 travelogue_book_desc: "Ein neues Buch wird geschaffen, das Reisen an exotische und ferne Lande sowie die Völker, Orte und Waren dokumentiert, die man dort finden kann."
 travelogue_effect_desc: "Dieses [artifact|E] gewährt [skills], [trait_level_track_xp|E] und [prestige_i][prestige|E]"
 writing_travelogue: "Schreibt einen Reisebericht"
 writing_travelogue_desc: "Dieser Charakter ist derzeit darin versunken, einen Reisebericht auf Grundlage seiner Erfahrungen zu schreiben."
 wipe_slate_merchant_decision: "Reiner Tisch"
 wipe_slate_merchant_decision_desc: "Muss ein Mensch denn für immer für Verbrechen leiden, die er unter den schlimmsten Umständen begangen hat? Haben nicht alle [ROOT.Char.GetFaith.GetAdherentNamePlural] das Recht auf einen Weg der Erlösung?\n\nMit Zeit, Mühe und – was am wichtigsten ist – #EMP Münzen#! können alle Arten von Sünden von der ganzen Welt vergeben werden."
 wipe_slate_merchant_decision_tooltip: "Buße für den eigenen Ruf als [GetTrait('dealbreaker').GetName(GetNullCharacter)] tun"
 wipe_slate_merchant_decision_confirm: "Von Tag zu Tag geht es besser!"
 merchant_spending_spree_decision: "Kaufrausch"
 merchant_spending_spree_decision_desc: "Jahr für Jahr wiege ich Waren, preise sie ein und feilsche um sie. Stets sind sie für andere Haushalte bestimmt – aber nie für meinen eigenen. Ein Tag, an dem ich mit offenem Geldbeutel zwischen den Ständen umhergehe und einfach alles kaufe, was mir ins Auge fällt, würde mir guttun."
 merchant_spending_spree_decision_tooltip: "Gebt großzügig [gold|E] auf dem [market|E] aus, um Eure eigene [stress|E] und die Eurer [associates|E] abzubauen und [prestige|E] zu erhalten – dabei habt Ihr die Chance, ein [domicile_artifact|E]zu erhalten"
