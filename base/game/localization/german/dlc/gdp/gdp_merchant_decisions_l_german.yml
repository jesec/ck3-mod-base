 craft_artifact_scheme.1000.t: "$craft_artifact$: Erfolg"
 craft_artifact_scheme.1000.intro.curio: "Nacht für Nacht verbrachte ich in der Werkstatt, entweder mit einem Mitarbeiter oder einem Mitglied der örtlichen Zunft an meiner Seite, um das eine oder andere Stück anzufertigen."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nHeute kann ich endlich sagen, dass sich all die Arbeit gelohnt hat! Wenn ich mir das Werk anschaue, zaubert mir jede Spur meiner Arbeit ein Lächeln ins Gesicht, und ich denke nur noch darüber nach, wo ich es voller Stolz ausstellen kann."
 craft_artifact_scheme.1000.intro.library: "Nacht für Nacht saß ich in meinem Arbeitszimmer, während meine mit Tinte befleckten Hände trotz Schreibkrampfs weiterkritzelten und der Docht langsam herunterbrannte."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nHeute kann ich endlich sagen, dass sich all diese Arbeit gelohnt hat! Wenn ich den Text durchblättere, zaubert mir jede Passage ein Lächeln ins Gesicht, und ich denke nur an jene, die diese Kritzeleien lesen werden."
 craft_artifact_scheme.1000.desc.curator: "\n\nDie Augen [Select_CString(curator.IsFemale, 'meiner Konservatorin', 'meines Konservators')] [curator.GetFirstName] leuchten auf, während [curator.Custom('DE_PRO_PER_S_3P_N')] das Werk betrachtet. „Das ist eine #EMP wahre#! Meisterleistung, [ROOT.Char.GetTitleAsNameNoTooltip].“"
 craft_artifact_scheme.1000.a: "Die Mühe hat sich gelohnt."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nHergestellt von [ROOT.Char.GetTitledFirstName] ([ROOT.Char.GetPrimaryTitle.GetName])."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nGeschrieben von [ROOT.Char.GetTitledFirstName] ([ROOT.Char.GetPrimaryTitle.GetName])."
 craft_artifact_scheme.2000.t: "$craft_artifact$: Fehlschlag"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nJeder Versuch, meine Idee zu verwirklichen, wurde durch Fehleinschätzungen oder Missverständnisse zunichtegemacht. Der Raum ist übersät mit den Überresten aufgegebener Versuche, die sich nicht anderweitig nutzen ließen …"
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nJeden Morgen liegen weggeworfene Schreibfetzen auf dem Boden verstreut. Die wenigen Stücke, die ich aufbewahrte, werden der Tragweite meiner Absicht nicht gerecht …"
 craft_artifact_scheme.2000.desc.curator: "\n\nWährend [Select_CString(curator.IsFemale, 'meine Konservatorin', 'mein Konservator')] [curator.GetFirstName] die mageren Ergebnisse meiner Arbeit betrachtet, seufzt [curator.Custom('DE_PRO_PER_S_3P_N')]. „Vielleicht ist es an der Zeit, sich geschlagen zu geben?“"
 craft_artifact_scheme.2000.a: "Das geht mir langsam auf die Nerven …"
 craft_artifact_scheme.2000.b: "… aber meine Arbeit darf nicht umsonst gewesen sein!"
