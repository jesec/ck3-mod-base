 gdp_decision.3010.t: "In der Gesellschaft von [sponsored_courtier.GetNameNoTooltip]"
 gdp_decision.3010.desc: "„Ich fühle mich geehrt, dass Ihr mir diese Verantwortung übertragen wollt! All die [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] aus Eurem Säckel werden hart arbeiten.“\n\n[sponsored_courtier.GetNameNoTooltip] schaut eifrig, obwohl [sponsored_courtier.Custom('DE_PRO_PER_S_3P_N')] vor Betreten des Raums gar nicht wissen konnte, dass [sponsored_courtier.Custom('DE_PRO_PER_S_3P_N')] [Select_CString(sponsored_courtier.IsFemale, 'meine treue Händlerin', 'mein treuer Händler')] werden sollte.\nVielleicht ist die Vorstellung der anfänglichen Finanzierung und die Verheißung des Aufbaus einer eigenen Gesellschaft gar die Erfüllung eines lebenslangen Traums."
 gdp_decision.3010.a: "Ich gebe Euch genug, um über die Runden zu kommen."
 gdp_decision.3010.b: "Alle Grundausgaben werden abgedeckt werden."
 gdp_decision.3010.c: "Eine beträchtliche Menge an Kapital wird den Erfolg sichern."
 gdp_decision.3010.d: "Wir werden keine Kosten scheuen!"
 gdp_decision.3010.e: "Wir können das noch etwas bedenken."
