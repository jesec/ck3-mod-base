 gdp_decision.2000.t: "$forge_charter_decision$"
 gdp_decision.2000.desc: "Dank geschickter Schriftführung und einer täuschend echten Nachahmung von Siegeln, Wachs und anderen amtlichen Eigenschaften ist das Werk des skrupellosen Fälschers wahrlich beeindruckend.\n\nIch wage zu behaupten, dass es selbst einem geübten Auge, das mit derartigen Dokumenten vertraut ist, täuschend echt erscheinen könnte. Solange man es nicht zu genau in Augenschein nimmt …"
 gdp_decision.2000.a: "Wir müssen vorsichtig sein."
