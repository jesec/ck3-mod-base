 gdp_sponsor_merchant_company_decision: "Kaufmann finanzieren"
 gdp_sponsor_merchant_company_decision_desc: "Handel ist bekanntermaßen ein schmutziges Geschäft und nicht für so feine Menschen wie mich geeignet. Doch es muss doch sicher jemandem an meinem Hof geben, der mein persönlicher Kaufmann werden und das für mich übernehmen könnte, oder?"
 gdp_sponsor_merchant_company_decision_tooltip: "Einen Eurer [courtiers|E] finanzieren, um eine [Concept('merchant', 'Kaufmanns')|E]-[company|E] zu finanzieren, die als Euer [client|E] beginnt"
