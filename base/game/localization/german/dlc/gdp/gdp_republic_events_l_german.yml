l_german:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|U]"
 republic_event.0001.desc: "Endlich stehen die Grundpfeiler unserer Republik! Kleine Despoten und ihre angeworbenen Räuber ketten uns nicht länger an Pflug und Furche. Ihre Streitigkeiten bringen uns nun weder Schmerz noch Sorgen.\n\nDa wir jetzt als eine Gemeinschaft verbunden sind, formen wir unser eigenes Schicksal und verteidigen unsere hart errungene Freiheit. Lasst unsere Stadt ein Leuchtfeuer der Hoffnung sein und unsere Mauern ein Schild gegen die Tyrannei."
 republic_event.0001.a: "Der Beginn einer neuen Epoche!"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "Die alten Methoden leisteten gute Arbeit für uns, und wir werden sie immer in Ehren halten. Doch die Clanhalle kann nicht länger fassen, was aus uns wurde. Märkte, Mauern und der Wunsch der Menschen verlangen nun nach einer anderen Art der Herrschaft.\n\nHeute legen wir die [Concept('tribal', 'Stammes')|E]-Herrschaft ab und gründen eine [republic|E]. Lasst die Stadt mit einer Stimme sprechen, und lasst diese Stimme die unsere sein."
 republic_event.0002.a: "Die Stadt wird sich hieran erinnern"
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "Hiermit setze ich Euch darüber in Kenntnis, dass ich Euren Handelsposten in [actor.GetCapitalLocation.GetBaronyNameExplicitly] auflöse, und zwar mit sofortiger Wirkung.\n\nDies ist natürlich, im besten Interesse meines Reichs ([actor.GetPrimaryTitle.GetNameNoTierNoTooltip]). Ich bin mir sicher, Ihr versteht das."
 republic_event.0010.a: "Aber das war #EMP mein#! Handelsposten!"
 republic_event.0012.desc: "Ihr seid in [trade_post_target_county.GetNameNoTierNoTooltip] nicht länger willkommen! Betrachtet Eure Handelsrechte als zurückgenommen. Alles, was Ihr dort von Wert habt, wird eingezogen und der Handelsposten dem Erdboden gleichgemacht."
 republic_event.0012.a: "Ich muss eine neue Heimat für meine Handelswaren finden …"
 republic_event.0020.t: "Die [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]e Schatzkammer"
 republic_event.0020.intro: "Es ist an der Zeit, die Finanzen der Republik zu überprüfen."
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U] steht mit zusammengezogenen Brauen und dem Hauptbuch in der Hand vor mir. Eine kleine Armee von Beratern läuft hinter [steward.Custom('DE_PRO_PER_S_3P_D')] her, schwer beladen mit Schriftrollen, Folianten und Haushaltsvermerken.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip|U]. Wir #EMP müssen#! unsere Ausgaben durchgehen und ein neues Budget für das Schatzamt festlegen. Ich fürchte, die Angelegenheit kann nicht warten."
 republic_event.0020.solo_desc: "Ich bin umgeben von einer kleinen Armee von Schreibern, die mit Schriftrollen, Folianten und Haushaltsvermerken beladen sind. Alle warten darauf, dass ich meine Durchsicht beende.\n\n"
 republic_event.0020.income_desc: "Unsere derzeitigen Einnahmen übersteigen bei Weitem unsere Ausgaben und sie können sinnvoller verwendet werden."
 republic_event.0020.deficit_desc: "Unsere Ausgaben sind zu hoch, und das Schatzamt wird unter der Last zusammenbrechen, wenn wir nichts unternehmen."
 republic_event.0020.fallback_desc: "Es ist schon viele Jahre her, seit der letzte Haushalt verabschiedet wurde."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U] überprüfte bereits den Haushalt, und es sieht gut aus. [steward.Custom('DE_PRO_PER_S_3P_N')|U] nimmt keine Änderungen vor."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "Mehrere Unterlagen mit Vorschlägen liegen vor mir, und eine jede zeigt einen anderen Weg für das Schatzamt dahingehend auf, wo Ausgaben erfolgen und wo gespart werden soll.\n\nWelche Variante soll ich wählen?"
 republic_event.0021.a: "Stellt sicher, dass alle gut bezahlt werden."
 republic_event.0021.b: "Ausgewogene Gehälter dienen uns am besten."
 republic_event.0021.c: "Wir sollten die zusätzlichen Finanzen für den Staat priorisieren."
 republic_event.0021.a.info_desc: "[treasury_budget_category|E]-Schwerpunkt: @gold_icon![treasury_salary_budget_short|E]\nHöhe Saläre mögen üblicherweise die meisten [patricians|E]"
 republic_event.0021.b.info_desc: "[treasury_budget_category|E]-Schwerpunkt: @law_icon!Ausgewogen\nEin gut ausgewogener Etat, der sicherstellt, dass die [patricians|E] ein angemessenes Salär haben, und der noch ausreichend [treasury|E] für den [Concept('liege', 'Lehnsherrn')|E] lässt"
 republic_event.0021.c.info_desc: "[treasury_budget_category|E]-Schwerpunkt: @treasury_icon!Reich\nEin geringer Etat für Saläre bedeutet mehr Geld für die Republik – und er gewährt dem [Concept('liege', 'Lehnsherrn')|E] zusätzliche Gelder, die frei verfügbar ausgegeben werden können"
 republic_event.0030.desc: "Ich bedauere, Euch darüber in Kenntnis setzen zu müssen, dass ich all Eure Monopole auf meinen Märkten widerrief. Der Handel muss frei erfolgen dürfen."
 republic_event.0030.a: "Wir müssen wie alle anderen in den Wettbewerb treten …"
 republic_event.0040.desc: "Mit Bedauern setze ich Euch darüber in Kenntnis, dass ich entschied, Euch aus unserem Bund ([actor.GetConfederation.GetName]) zu entfernen."
 republic_event.0040.a: "Erneute Wettbewerber"
 republic_event.0050.desc: "Die Versammlung von [title.GetName] machte wählte mich zum erlauchten Oberhaupt ([new_holder.GetTitleAsNameNoTooltip]) [new_holder.Custom('GetRepublicTermLength')]."
 republic_event.0051.desc: "Ich wurde wiedergewählt [new_holder.Custom('GetRepublicTermLength')]. Ruhm sei [title.GetName]."
 republic_term_length_1_desc: "für eine Amtszeit von [EmptyScope.ScriptValue('law_term_length_1_value')|0] Jahren"
 republic_term_length_2_desc: "für eine Amtszeit von [EmptyScope.ScriptValue('law_term_length_2_value')|0] Jahren"
 republic_term_length_3_desc: "für eine Amtszeit von [EmptyScope.ScriptValue('law_term_length_3_value')|0] Jahren"
 republic_term_length_4_desc: "für eine Amtszeit von [EmptyScope.ScriptValue('law_term_length_4_value')|0] Jahren"
 republic_term_length_5_desc: "für eine Amtszeit von [EmptyScope.ScriptValue('law_term_length_5_value')|0] Jahren"
 republic_term_length_indefinite_desc: "auf Lebenszeit"
 republic_event.0052.desc: "Ich stellte den erlauchten Mitgliedern der Versammlung ein neues Gesetz vor.\n\nDer Vorschlag in Sachen [new_law.GetNameNoTooltip] wird nach gründlicher Beratung zur Abstimmung gestellt."
 republic_event.0053.pass.desc: "Der Vorschlag in Sachen [new_law.GetNameNoTooltip] wurde angenommen und ist nun ein offizielles Gesetz der Republik!"
 republic_event.0053.rejected.desc: "Der Vorschlag in Sachen [new_law.GetNameNoTooltip] wurde von der Versammlung abgelehnt."
 republic_event.law.TT: "#bold Vorgeschlagen:#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P Beschlossen:#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N Abgelehnt:#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold Behalten:#! [current_law.GetName]"
 republic_event.assembly.response: "Verstanden."
 republic_event.assembly.opening: "Mitbürger,"
 rescind_trade_monopoly_notification_base_desc: "[trade_monopolies|E] auf den [Concept('trade_markets', 'Handelsmärkten')|E] von [actor.GetShortUIName] wurden aufgelöst, und zwar alle, die dem folgenden Akteur gehörten:"
 rescind_trade_monopoly_notification_confederation_desc: "[recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "Eure [company|E]"
 republic_event.0100.t: "Die Römische Republik"
 republic_event.0100.desc: "Rom. Allein das Wort zu nennen – nicht als den Namen einer Stadt, sondern als ein Symbol, ein #EMP Ideal#! –, war lange der Traum vieler. Ich ließ diesen Traum Wirklichkeit werden.\n\nIch höre die Feierlichkeiten aus allen Ecken des Reiches widerhallen. Bürger, nein, #EMP Römer#!, erleben eine Zukunft, in der wir erneut der Mittelpunkt der Zivilisation sind. Nun beginnt die Arbeit, die verlorenen Ideale der Antike wiederzubeleben. Um ein Leuchtfeuer zu werden, ein Licht, das uns in diesen dunklen Zeit leitet."
 republic_event.0100.a: "Wieder einmal sollen alle Wege nach Rom führen."
 republic_event.0100.b: "Rom ist nicht nur ein Ort, es ist ein Ideal."
