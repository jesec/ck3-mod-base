 HANSEATIC_LEAGUE_NAME: "Hanse"
 GENERIC_HANSE_NAME: "Hanse von [hanse_lead_town.GetName]"
 gdp_burgher.0001.desc: "Wir, die [burgher_county.Custom('BurgherPluralNoun')] von [burgher_county.GetNameNoTier], fordern, dass Ihr uns ein Privileg ([burgher_county.Custom('BurgherDemandedPrivilege')]) gewährt, damit unsere Stadt gedeihen und Eurem Reich Wohlstand bringen kann."
 gdp_burgher.0001.a: "Ihre Bitte ist vernünftig. Gewährt ihr mein Siegel."
 gdp_burgher.0001.b: "Ich weigere mich!"
 gdp_burgher.0001.opening: "[Select_CString(ROOT.Char.IsFemale, 'Unsere', 'Unser')][ROOT.Char.Custom('LadyLordWomanMan')],"
 gdp_burgher.0010.desc: "Wir, die [burgher_county.Custom('BurgherPluralNoun')] von [burgher_county.GetNameNoTierNoTooltip], bitten Euch daher, uns die Freiheit zu gewähren, uns selbst zu regieren, unsere Anführer selbst zu wählen und unsere Angelegenheiten in unserem eigenen Namen zu regeln. Andernfalls sind wir gezwungen, uns zu nehmen, was Ihr uns aus Gnade nicht gewähren wollt."
 gdp_burgher.0010.a: "Gebt ihnen ihre Freiheit."
 gdp_burgher.0010.b: "Sollen sie für ihre #EMP „Rechte“#! kämpfen."
 gdp_burgher.0020.t: "Die Freiheit von [freed_county.GetNameNoTierNoTooltip]"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier|U] erlangte die Freiheit und damit das Privileg, sich selbst zu regieren und eigene Magistrate zu ernennen.\n\nNichts davon wäre natürlich ohne #EMP meine#! Unterstützung möglich gewesen."
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier|U] erlangte die Freiheit und damit das Privileg, sich selbst zu regieren und eigene Magistrate zu ernennen.\n\nNichts davon wäre natürlich ohne #EMP meine#! Unterstützung möglich gewesen."
 gdp_burgher.0020.a: "Die Last der Führung ist eine, die ich gern annehme."
 gdp_burgher.0020.b: "Ich werde meinen Platz unter ihren Magnaten einnehmen."
 gdp_burgher.0020.c: "Ihr guter Wille ist schon lohnenswert genug."
 gdp_burgher_agitator_not_republic_head_tt: "Ihr dürft #bold nicht#! bereits einer [republic|E] vorstehen"
 gdp_burgher_agitator_outranks_republic_head_tt: "Euer [title_tier|E] muss niedriger als der von [burgher_ruler.GetTitledFirstName] sein"
 gdp_civic_agitation.0001.t: "Angefachte Freiheit"
 gdp_civic_agitation.0001.desc: "Alles fügt sich. Die Bevölkerung von [target.GetNameNoTier] brennt mit einem glühenden Verlangen nach bürgerlicher Freiheit, das meine Agenten zu entfachen vermochten, während ihre Anführer auf dem Marktplatz leidenschaftliche Reden über erdrückende Steuern und ungerechte Magistrate halten.\n\nMir wurde berichtet, dass sich eine Delegation zum Ausritt zu ihrem Herrn bereit macht, um das Recht auf Selbstverwaltung einzufordern. Die einzige Frage ist, ob ich sie begleite."
 gdp_civic_agitation.0001.a: "Ich bin so weit gekommen und werde auch das Ende miterleben."
 gdp_civic_agitation.0001.b: "Sie sollten als Streitmacht losreiten: bewaffnet und beritten auf meine Kosten."
 gdp_civic_agitation.0001.c: "Sollen die Maßen es für ihre Idee halten. Jene, die wichtig sind, wissen es besser."
 gdp_civic_agitation.0001.c.exposed: "Nehmt es an und versprecht ihnen nicht mehr"
 gdp_civic_agitation_sponsor_joins_war_tt: "Die [agitated_county.Custom('BurgherPluralNoun')] werden Euch im [war|E] an ihrer Seite haben, sollte ihr Herrscher sie zurückweisen"
 gdp_civic_agitation_sponsor_war_chest_tt: "Ihr werdet eine Kompanie von Berufssoldaten finanzieren, sollte ein Krieg ausbrechen"
 gdp_civic_agitation.0002.t: "Schlecht angelegtes Geld"
 gdp_civic_agitation.0002.desc: "Die Liste der Beschwerden wurde niedergeschrieben, vor den Einwohnern von [target.GetNameNoTier] verlesen, und ihre Anführer trafen sich und unternahmen #EMP nichts#!.\n\nMeine Agenten haben keine Kenntnis von den weiteren Geschehnissen. Mit meinem Geld konnten sie alles kaufen, was sie brauchten, außer dem Mut, es tatsächlich #EMP einzusetzen#!."
 gdp_civic_agitation.0002.a: "Ich werde diese feige Niedertracht nicht so schnell vergessen."
 found_the_hanseatic_league_decision: "Die Hanse gründen"
 found_the_hanseatic_league_decision_tooltip: "Bindet die [counties|E] Eurer [trade_league|E] zu einem noch mächtigeren Kaufmannsbund zusammen"
 found_the_hanseatic_league_decision_confirm: "In der Eintracht finden wir Wohlstand"
 found_the_hanseatic_league_decision_desc: "Könige glauben, Macht trage eine Krone und ein Schwert. Wir kennen die Wahrheit. Macht ist in Pelze gehüllt, riecht nach Fisch und hat Hauptbücher unter dem Arm, in denen Summen stehen, die ganze Königreiche ruinieren würden.\n\nAllein werden wir besteuert, ausgeplündert und zur Unterwerfung gezwungen. Vereint gibt es keine Macht in den nördlichen Meeren, die uns widerstehen kann. Kein Hafen wird unsere Schiffe abweisen, kein fremdländischer Händler den Preis unserer Waren unterbieten und kein Fürst unsere Privilegien verletzen."
 found_the_hanseatic_league_cohesion_tt: "Die [trade_league|E] muss mindestens #V 95#! [cohesion|E] haben"
 found_the_hanseatic_league_members_tt: "Die [trade_league|E] muss mindestens #V 4#! Mitglieder haben"
 found_the_hanseatic_league_message_title: "Eine Hanse wird geboren!"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U] [Select_CString(hanse_founder.IsLocalPlayer, 'verbandet', 'verband')] die Liga zu einer eingeschworenen Hanse."
 league_needs_liege_consent_tt: "Als [vassal|E] braucht Ihr die Zustimmung Eures [Concept('liege', 'Lehnsherrn')|E] oder eine Stadt, die frei beitreten kann"
 gdp_hanseatic.0010.opening: "Von der [the_league.GetName],"
 gdp_hanseatic.0010.desc: "Ihr haltet Handelsrechte in eigenem Namen, zu Eurem eigenen Vorteil und keinem anderen.\n\nSolche Einzelvereinbarungen schaden uns. Wir bitten Euch, diese zu unseren Gunsten aufzugeben, damit wir gemeinsam besser gedeihen können."
 gdp_hanseatic.0010.a: "Wir werden sie an die [the_league.GetName] abgeben."
 gdp_hanseatic.0010.b: "Ich werde sie [hanse_city_title.GetNameNoTier] verleihen."
 gdp_hanseatic.0010.c: "Diese Rechte gehören mir, #EMP und das soll auch so bleiben#!."
