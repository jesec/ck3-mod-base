 gdp_civic_agitation_scheme: "Bürgeraufruhr anfachen"
 gdp_civic_agitation_scheme_action: "Bürgeraufruhr anfachen gegen"
 gdp_civic_agitation_scheme_desc: "Ich werde die guten Menschen von [SCHEME.GetTargetTitle.GetBaseNameNoTier] aufwiegeln, damit sie jenes Recht zur Selbstverwaltung fordern, das sie so sehr verdienen!"
 gdp_civic_agitation_scheme_desc_general: "„$gdp_civic_agitation_scheme$“ ist ein [hostile_scheme|El], das darauf abzielt, eine [county|E] so sehr aufzuwiegeln, dass sie die Selbstverwaltung von ihrem [ruler|E] fordert. Es ist ein [secret_scheme|E], das auf [intrigue|E] beruht, und man kann [agents|E] dafür rekrutieren.\n\nEin erfolgreiches Anfachen der Bürgeraufruhr wird die ins Visier genommene [county|E] dazu bringen, eine $FACTION_BURGHER_AUTONOMY_NAME$-[faction|E] auszuheben.\n\nEin beliebiger [merchant|E] kann aufwiegeln, ebenso wie das Oberhaupt einer $republic_type_popular$, und jede [republic|E], die befreit wird, wird dieselbe Art annehmen. Andere Oberhäupter einer [republic|E] brauchen eine [patrician_rating|E] von mindestens [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V], und andere [Concept('republican', 'republikanische')|E] [house_heads|E] brauchen mindestens [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]."
 gdp_civic_agitation_scheme_desc_success: "Die Ziel-[county|E] hebt eine $FACTION_BURGHER_AUTONOMY_NAME$-[faction|E] aus und fordert Selbstverwaltung"
 gdp_civic_agitation_scheme_discovery_desc: "Ihr werdet beim Aufwiegeln der [county|E] nicht enttarnt"
