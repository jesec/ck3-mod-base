 agitate_civic_unrest_interaction: "Bürgeraufruhr verbreiten"
 agitate_civic_unrest_interaction_desc: "Versuchen, eine der [counties|E] von [recipient.GetShortUINameNoTooltip] auszuwiegeln, damit sie nach Selbstverwaltung verlangt und einen [war|E] mit dem [casus_belli|E] #V $BURGHER_WAR_CB_NAME$#! beginnt, wenn diese verweigert wird"
 agitate_civic_unrest_eligible_tt: "Ihr müsst in der Lage sein, ein #V $gdp_civic_agitation_scheme$#!-[scheme|E] gegen diese [county|E] zu beginnen"
