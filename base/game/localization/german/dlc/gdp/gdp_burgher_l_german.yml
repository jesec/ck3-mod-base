 BURGHER_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip|U]e Bürgererhebung"
 burgher_war_victory_desc: "Jede aufständische [county|E] wird eine sich selbst regierende [republic|E] und beginnt als [GetSubjectContractType('republic_government_free_city').GetObligationName('republic_government_free_city_chartered')|V]. Der [capital|E] wird in die größte Stadt der [county|E] verlegt, wenn nötig. Drei oder mehr bilden eine #V $confederation_type_trade_league_name$#!"
 burgher_war_victory_free_city_desc: "Jede aufständische [county|E] wird eine sich selbst regierende [republic|E] und beginnt als [GetSubjectContractType('republic_government_free_city').GetObligationName('republic_government_free_city_granted')|V]. Der [capital|E] wird in die größte Stadt der [county|E] verlegt, wenn nötig. Drei oder mehr bilden eine #V $confederation_type_trade_league_name$#!"
 burgher_war_white_peace_desc: "Die [faction|E] wird aufgelöst und die führende [county|E] erhält kleinere Bürgerprivilegien. Ihre Gemeinden werden für [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] Jahre keine weitere $FACTION_BURGHER_AUTONOMY_NAME$-[faction|E] ausheben."
 burgher_war_defeat_desc: "Die [faction|E] wird aufgelöst und alle aufständischen [Concept('county', 'Gemeinden')|E] verlieren alle Bürgerprivilegien, die sie haben, zusammen mit [popular_opinion|E]. Ihre Gemeinden werden für [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] Jahre keine weitere $FACTION_BURGHER_AUTONOMY_NAME$-[faction|E] ausheben."
 burgher_war_ended_invalid.desc: "$BURGHER_WAR_CB_NAME$ wird ungültig: Die $FACTION_BURGHER_AUTONOMY_NAME$-[faction|E] hat keinen Anführer mehr!"
 civic_privileges_county_modifier: "Bürgerprivilegien"
 civic_privileges_county_modifier_desc: "Dieser Gemeinde wurden einige wenige, kleinere Bürgerprivilegien gewährt, die allerdings nicht in einer Charta niedergeschrieben wurden."
 civic_privilege_market_rights_1_county_modifier: "Beschränkte Marktrechte"
 civic_privilege_market_rights_1_county_modifier_desc: "Dieser Gemeinde wurde das Recht gewährt, einen Markt unter den Gewichten und der Aufsicht des Fürsten abzuhalten."
 civic_privilege_market_rights_2_county_modifier: "Marktrechte"
 civic_privilege_market_rights_2_county_modifier_desc: "Dieser Gemeinde wurde das Recht gewährt, eigene Markttage und Waagen einzuführen sowie einen ordentlichen Anteil des Handels zu behalten."
 civic_privilege_market_rights_3_county_modifier: "Breite Marktrechte"
 civic_privilege_market_rights_3_county_modifier_desc: "Dieser Gemeinde wurde die nahezu vollständige Kontrolle über ihren Markt gewährt, sodass ihr Fürst nur einen kleinen Anteil vom Handel erhält."
 civic_privilege_guild_rights_1_county_modifier: "Begrenzte Zunftrechte"
 civic_privilege_guild_rights_1_county_modifier_desc: "Den Handwerkern dieser Gemeinde wurde das Recht gewährt, sich zusammenzuschließen. Ihre Meister schulden aber immer noch dem Fürsten Rechenschaft."
 civic_privilege_guild_rights_2_county_modifier: "Zunftrechte"
 civic_privilege_guild_rights_2_county_modifier_desc: "Den Zünften dieser Gemeinde wurde das Recht gewährt, eigene Anforderungen einzuführen und eigene Meister aufzunehmen."
 civic_privilege_guild_rights_3_county_modifier: "Breite Zunftrechte"
 civic_privilege_guild_rights_3_county_modifier_desc: "Dieser Gemeinde wurde die nahezu vollständige Kontrolle über ihre Handwerker und über das, was in ihren Werkstätten gefertigt wird, gewährt."
 civic_privilege_tax_exemption_1_county_modifier: "Teilweiser Beamtensteuerdispens"
 civic_privilege_tax_exemption_1_county_modifier_desc: "Dieser Gemeinde wurde ein Dispens von einigen der Abgaben gewährt, die sie ihrem Fürsten schuldet."
 civic_privilege_tax_exemption_2_county_modifier: "Beamtensteuerdispens"
 civic_privilege_tax_exemption_2_county_modifier_desc: "Der Stadt dieser Gemeinde wurde das Recht gewährt, eigene Steuern nach eigenem Gutdünken zu erheben."
 civic_privilege_tax_exemption_3_county_modifier: "Breiter Beamtensteuerdispens"
 civic_privilege_tax_exemption_3_county_modifier_desc: "Dieser Gemeinde wurde ein Dispens von den meisten Abgaben gewährt, sodass sie nur noch eine symbolische Summe zahlt."
 civic_privilege_militia_charter_1_county_modifier: "Begrenzte Miliz-Charta"
 civic_privilege_militia_charter_1_county_modifier_desc: "Der Stadt dieser Gemeinde wurde eine eigene Wache gewährt, solange diese innerhalb der Stadtmauern bleibt."
 civic_privilege_militia_charter_2_county_modifier: "Miliz-Charta"
 civic_privilege_militia_charter_2_county_modifier_desc: "Der Stadt dieser Gemeinde wurde eine eigene Miliz gewährt, von deren Truppen weniger für ihren Fürsten marschieren müssen."
 civic_privilege_militia_charter_3_county_modifier: "Breite Miliz-Charta"
 civic_privilege_militia_charter_3_county_modifier_desc: "Der Stadt dieser Gemeinde wurde das Recht gewährt, sich selbst zu bewaffnen und ihrem Fürsten nur eine symbolische Truppe zu schicken."
 burgher_grievance_county_modifier: "Bürgerbeschwerden"
 burgher_grievance_county_modifier_desc: "Die Forderungen dieser Gemeinde wurden verweigert, und sie ist nicht bereit, das auf sich beruhen zu lassen."
 gdp_civic_agitation_county_modifier: "Bürgeraufwiegelung"
 gdp_civic_agitation_county_modifier_desc: "Diese Gemeinde wird von äußeren Einflüssen gegen ihren Herrscher aufgebracht."
 gdp_civic_agitation_popular_republic_modifier: "Stimme des Volkes"
 gdp_civic_agitation_popular_republic_modifier_desc: "Dieses Komplott wird vom Oberhaupt einer [GetLaw('republic_type_popular').GetName] unterstützt, einem Leuchtfeuer der bürgerlichen Freiheit."
 bestow_civic_liberties_interaction: "Bürgerfreiheiten verleihen"
 bestow_civic_liberties_options_heading: "Zu gewährende Freiheit"
