l_german:
 # Scheme
 gdp_incite_unrest_scheme: "Unruhe stiften"
 gdp_incite_unrest_scheme_desc: "Abtrünnigkeit und Unzufriedenheit unter den Gemeinen des Hauptsitzes verbreiten, um sie gegen ihren Herrscher aufzubringen."
 gdp_incite_unrest_scheme_desc_general: "Abtrünnigkeit und Unzufriedenheit unter den Gemeinen des Hauptsitzes verbreiten, um sie gegen ihren Herrscher aufzubringen."
 gdp_incite_unrest_scheme_action: "Stiftet Unruhe gegen"
 GDP_INCITE_UNREST_SUCCESS_DESC: "Agitatoren brachten die Bevölkerung auf. Die Volksmeinung im Hauptsitz des Lehnsherrn wird fallen."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "Das Komplott, um Unruhe im Hauptsitz zu stiften, wurde aufgedeckt."
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "Komplott aufgegeben"
 gdp_incite_unrest_scheme_owner_not_republic: "Wir haben keine republikanische Regierung mehr und können dieses Komplott daher nicht verfolgen."
 # Interaction
 gdp_incite_unrest_start_interaction: "Unruhe stiften"
 gdp_incite_unrest_scheme_interaction_tt_approved: "Insgeheim daran arbeiten, Zwietracht unter den Gemeinen von [recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V] zu verbreiten, was die [popular_opinion|E] von [recipient.GetTitledFirstNameNoTooltip|V] veringert."
 gdp_incite_unrest_scheme_start_notification: "Komplott begonnen"
 gdp_incite_unrest_scheme_target_tt: "Jemand schmiedet ein Komplott gegen Euch."
 # Success messages
 gdp_incite_unrest_scheme_success_t: "Unruhe breitet sich aus"
 gdp_incite_unrest_scheme_success_liege_t: "Unruhe im Hauptsitz"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "Komplott verpufft"
 gdp_incite_unrest_scheme_failure_desc: "Unsere Unruhestifter konnten nicht für Unruhe gegen [scope:target.GetTitledFirstName] sorgen, und das Komplott ist im Sande verlaufen: Die Bevölkerung bleibt ungerührt."
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "Plan aufgedeckt"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "Die Unruhestifter vollbrachten ihr Werk. Unzufriedenheit breitet sich in den Straßen von [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] aus, während [target.GetTitledFirstName] das Vertrauen des Volks verliert."
 gdp_incite_unrest_scheme_event.0005.a: "Das Volk ist bereit, noch weiter getrieben zu werden."
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "Überall in [This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] gibt es unzufriedenes Getuschel. Jemand hat die Gemeinen gegen [This.Custom('DE_PRO_PER_S_3P_A')] aufgebracht, und der Groll wird immer größer."
 gdp_incite_unrest_scheme_event.0006.a: "Ich muss die Ordnung wiederherstellen."
 # County modifier
 gdp_incite_unrest_county_modifier: "Mit Abtrünnigkeit durchsetzt"
 gdp_incite_unrest_county_modifier_desc: "Aufhetzer waren hier am Werk und verbreiteten Groll, um die Bevölkerung gegen den Herrscher aufzubringen."
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "Entehrter Anstifter"
 gdp_caught_inciting_unrest_modifier_desc: "Dieser Patrizier wurde dabei erwischt, wie er Unruhe gegen das Overhaupt der Republik verbreitete. Andere Häuser und Wähler betrachten ihn mit Misstrauen."
