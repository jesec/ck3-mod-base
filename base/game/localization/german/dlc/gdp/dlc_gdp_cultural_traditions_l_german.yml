l_german:
 tradition_fortune_seekers_name: "Glückssucher"
 tradition_fortune_seekers_desc: "Diese Kultur sieht keine Schande darin, mittellos die Heimat zu verlassen, und erwartet von jenen, die wenig zu erben haben, dass sie ihr Glück in der Fremde suchen. Dort lernen sie die Sitten unzähliger Straßen kennen und damit auch den Wert jedes Gutes und die Bedingungen jedes Darlehens."
 culture_parameter_fortune_seekers_merchant_propensity: "[characters|E] dieser [culture|E] werden wahrscheinlicher [merchants|E]"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "Schaltet das [domicile_building|E] #V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName]#! frei"
 tradition_saharan_traders_name: "Sahara-Händler"
 tradition_saharan_traders_desc: "Es ist eine alte Weisheit, dass die Sahara weniger eine Barriere als vielmehr eine wichtige Handelsroute darstellt, die den Sahel und das westafrikanische Inland mit dem Mittelmeer  verbindet. Diese Kultur nahm eine Rolle in diesem Austausch an, und viele ihrer Mitglieder verbringen ihr gesamtes Leben in den Karawanen."
 culture_parameter_oasis_villages_building_slot: "Die [districts|E] #V [GetDistrictType('villages_district').GetName]#!, #V [GetDistrictType('religious_community_district').GetName]#! und #V [GetDistrictType('manor_houses_district').GetName]#! haben #P +1#! [building|E]-Platz in: [GetTerrain('oasis').GetName]"
 culture_parameter_saharan_seasoned_traveler_route_length: "Jede Stufe des #V bewährten#! Pfads der [trait|E] [GetTrait('lifestyle_traveler').GetName(GetNullCharacter)] gewährt #P +1#! [trade_route_length|E]"
 culture_parameter_saharan_merchant_domicile_buildings: "Schaltet die [domicile_buildings|E] #V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#! und #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#! frei"
 culture_parameter_caravan_escort_compound_domicile_building: "Schaltet das [domicile_building|E] #V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName]#! frei"
 tradition_silk_road_traders_name: "Seidenstraßen-Unternehmer"
 tradition_silk_road_traders_desc: "Die Seidenstraße ermöglicht einen stetigen Warenstrom zwischen Ost und West. Seide, Tee, Lackwaren, Jade und viele andere kostbare Güter werden auf der langen Route von Station zu Station befördert. Dies prägte die Gesellschaften der Straße. Reiche Städte betrieben entweder direkt Fernhandel oder verkauften an Händler, die dies taten."
 tradition_monsoon_traders_name: "Monsun-Kaufleute"
 tradition_monsoon_traders_desc: "Von den Nakhudas im Westen bis zu den Handelsgilden und -kasten im Osten brachten die Händler des Indischen Ozeans über Generationen Pfeffer, Baumwollstoffe und kostbare Güter auf den Markt."
 culture_parameter_caravanserai_hospitality: "[characters|E] dieser [culture|E] können die [interaction|E] #V $host_honored_guest_interaction$#! nutzen"
 culture_parameter_stewardship_gain_from_foreign_poi: "Eine [point_of_interest|E] in den Landen einer anderen [culture|E] zu besuchen, gewährt [Concept('stewardship', 'Verwaltungs')|E]-[lifestyle_experience|E]"
 culture_parameter_silk_road_market_expertise: "Die [decision|E] #V $visit_silk_road_market_decision$#! ist günstiger für Euch"
 culture_parameter_silk_road_oasis_urban_building_slots: "Die [districts|E] #V [GetDistrictType('urban_housing_district').GetName]#! und #V [GetDistrictType('guild_district').GetName]#! haben #P +1#! [building|E]-Platz in: [GetTerrain('oasis').GetName]"
 culture_parameter_silk_road_market_owner_bonuses: "Seidenstraßenmarkt-[buildings|E] geben zusätzliche [commerce_tax|E]"
 culture_parameter_silk_road_merchant_domicile_buildings: "Schaltet die [domicile_buildings|E] #V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName]#! und #V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName]#! frei"
 culture_parameter_monsoon_traveler_trade_bonuses: "Der #V $trait_track_travel$#!-Pfad der [trait|E] [GetTrait('lifestyle_traveler').GetName(GetNullCharacter)] gewährt zusätzliche [competitiveness_i][trade_competitiveness|E] und der #V bewährte#! Pfad gewährt zusätzliche [trade_route_capacity_i][capacity|E]"
 culture_parameter_monsoon_port_buildings_settlement_size: "[buildings|E] im [district|E] #V [GetDistrictType('port_district').GetName]#! geben #P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#! [settlement_size|E]"
 culture_parameter_monsoon_merchant_domicile_buildings: "Schaltet die [domicile_buildings|E] #V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName]#! und #V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName]#! frei"
 tradition_binding_oaths_name: "Bindende Eide"
 tradition_binding_oaths_desc: "Vereinbarungen müssen eingehalten werden. Diese Menschen glauben, dass ein geschlossener Vertrag niemals gebrochen werden darf. Eidbrecher werden nicht geduldet."
 culture_parameter_binding_oaths_harsh_break_penalties: "Einen [truce|E] zu brechen, einen [creditor|E] anzuschwärzen oder als [GetTrait('dealbreaker').GetName(GetNullCharacter)] entlarvt zu werden, sorgt für einen stärkeren [Concept('opinion', 'Meinungs')|E]-Verlust in der [culture|E] und kostet #N 10 %#! des [Concept('acumen', 'Scharfsinns')|E] einer [company|E]"
 culture_parameter_binding_oaths_word_is_trusted: "Andere [rulers|E] nehmen sehr viel wahrscheinlicher die [interaction|E] #V $negotiate_alliance_interaction$#! an und antworten auf die [interaction|E] #V $call_ally_interaction$#!, die [prestige_i]#P -50 %#! kostet"
 culture_parameter_good_faith_traits_more_common: "Die [traits|E] [GetTrait('honest').GetName(GetNullCharacter)|U] und [GetTrait('trusting').GetName(GetNullCharacter)|U] sind verbreiteter"
 culture_parameter_good_faith_trait_bonuses: "Die [traits|E] [GetTrait('honest').GetName(GetNullCharacter)|U] und [GetTrait('trusting').GetName(GetNullCharacter)|U] haben zusätzliche Boni"
 culture_parameter_better_stewardship_education: "[children|E] dieser [culture|E] erhalten wahrscheinlicher eine gute [education|E] in [stewardship|E]"
 binding_oaths_broke_word_modifier: "Eidbrecher"
 binding_oaths_alliance_accept_reason: "Eure [tradition|E] [GetCultureTradition('tradition_binding_oaths').GetName] bindet Euch an Euer Wort: $VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "Meine [tradition|E] [GetCultureTradition('tradition_binding_oaths').GetName] bindet mich an unser [alliance|E]: $VALUE|=+0$"
 culture_parameter_unlock_carnival_activity: "[Concept('republican', 'Republikanische')|E] [rulers|E] können die [activity|E] [GetActivityType('activity_carnival').GetName] ausrichten"
 culture_parameter_merchant_propensity_bonus: "[characters|E] dieser [culture|E] werden wahrscheinlicher [merchants|E]"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization(HasDlcFeature('silk_and_silver'), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line')]"
 culture_parameter_trade_league_cohesion_bonus_has_dlc: "Jeder [title|E] dieser [culture|E] in einer [trade_league|E] trägt #P +0,02#! monatlichen [league_cohesion|E] bei"
 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization(HasDlcFeature('silk_and_silver'), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line')]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "Eine [trade_league|E] kann von [Concept('rulers','Herrschern')|E] mit [county|E]-Rang gegründet werden"
 tradition_roman_law_name: "Römisches Recht"
 tradition_roman_law_desc: "Das römische Recht erbaute einst dieses Land. In dieser Kultur wird das Recht immer noch jedem von Bedeutung gelehrt, und sein Gebrauch findet sich überall in der Gesellschaft. Bauern, Künstler, Witwen, Edelleute, Kaufleute: Sie alle verlassen sich auf den Buchstaben des Gesetzes, um Streitigkeiten beizulegen."
 culture_parameter_roman_law_cheaper_university: "Ein [ward|E] zur Universität schicken und die [activity|E] [GetActivityType('activity_adult_education').GetName] kostet [gold_i]#P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#!"
 culture_parameter_roman_law_university_bonuses: "Universitäts-[buildings|E] gewähren zusätzliche Vorteile"
 culture_parameter_roman_law_education_bonuses: "[Concept('learning', 'Bildungs')|E]- und [Concept('stewardship', 'Verwaltungs')|E]-[education_traits|E] sowie [education_traits|E] der fünften Stufe haben zusätzliche [competitiveness_i] [Concept('trade_competitiveness', 'Wettbewerbsfähigkeits')|E]- und [stewardship_i][stewardship_skill|E]-Boni."
 culture_parameter_roman_law_legal_buildings_in_guild_district: "Die [Concept('buildings', 'Gebäudereihen')|E] #V [GetBuildingType('notary_1').GetName]#! und #V [GetBuildingType('court_of_law_1').GetName]#! können im #V [GetDistrictType('guild_district').GetName]#! gebaut werden"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "Die [Concept('buildings', 'Gebäudereihen')|E] #V [GetBuildingType('market_court_1').GetName]#!, #V [GetBuildingType('notary_1').GetName]#! und #V [GetBuildingType('court_of_law_1').GetName]#! gewähren zusätzliche [popular_opinion_i] [popular_opinion|E]"
 culture_parameter_roman_law_notariate_domicile_building: "Schaltet das [domicile_building|E] #V [GetDomicileBuilding('merchant_company_notariate_01').GetName]#! frei"
 tradition_civic_religion_name: "Bürgerreligion"
 tradition_civic_religion_desc: "Dieses Volk überlässt religiöse Angelegenheiten Zünften und Bruderschaften. Von der Armenfürsorge über die Verteidigung einer Stadt bis hin zum Kirchenbau: Alles fällt in den Verantwortungsbereich frommer Bürgergruppen."
 culture_parameter_civic_religion_temple_district_restriction: "Der [district|E] #V [GetDistrictType('temple_district').GetName]#! steht [Concept('secular_rulers', 'weltlichen Herrschern')|E] nicht zur Verfügung"
 culture_parameter_civic_religion_guild_building_slots: "Der #V [GetDistrictType('guild_district').GetName]#! hat #P +2#! [building|E]-Plätze"
 culture_parameter_civic_religion_guild_charity_buildings: "Die [Concept('buildings', 'Gebäudereihen')|E] #V [GetBuildingType('charities_1').GetName]#!, #V [GetBuildingType('hospitals_1').GetName]#!, #V [GetBuildingType('scribe_shop_1').GetName]#! und #V [GetBuildingType('scholarly_guilds_1').GetName]#! können im #V [GetDistrictType('guild_district').GetName]#! gebaut werden"
 culture_parameter_civic_religion_basilica: "Schaltet die [Concept('buildings', 'Gebäudereihe')|E] [GetBuildingType('republic_basilica_01').GetName|V] im [GetDistrictType('republic_great_plaza_district').GetName|V] für [republics|E] frei"
 culture_parameter_civic_religion_cathedral_civic_tax: "Kathedralen-[buildings|E] gewähren auch [civic_tax|E]"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "Einen [Concept('personal_tenet', 'persönlichen Grundsatz')|E] zu ändern, verursacht weniger [stress|E]"
 culture_parameter_civic_religion_education_piety_bonuses: "[diplomacy|E]-[education_traits|E] und die [traits|E] in Sachen [GetTrait('education_republican_knowledge_3').GetName(GetNullCharacter)] geben zusätzliche [piety_i][piety|E]"
 culture_parameter_civic_religion_trait_piety_bonuses: "Die [traits|E] [GetTrait('gregarious').GetName(GetNullCharacter)|U] und [GetTrait('family_first').GetName(GetNullCharacter)] geben zusätzliche [piety_i][piety|E]"
 culture_parameter_unlock_improved_republic_militia: "[Concept('republican', 'Republikanische')|E] [rulers|E] können das [law|E] #V $republic_army_organization_2_improved_levy$#! beschließen"
 tradition_contado_name: "Contado"
 tradition_contado_desc: "Ein Muster kleiner, aber befestigter Städte prägen das Landschaftsbild dieser Kultur, die ursprünglich oft von einem örtlichen Grundbesitzer gegründet wurden. Durch die Teilpacht entfremdeten sich die städtischen Grundbesitzer zunehmend vom Alltag auf dem Land."
 culture_parameter_contado_castello_buildings: "Die [Concept('buildings', 'Gebäudereihe')|E] #V [GetBuildingType('castello_1').GetName]#! kann im #V [GetDistrictType('villages_district').GetName]#! gebaut werden"
 culture_parameter_contado_borghi_buildings: "Die [Concept('buildings', 'Gebäudereihe')|E] #V [GetBuildingType('borghi_1').GetName]#! kann im #V [GetDistrictType('walls_district').GetName]#! gebaut werden"
 culture_parameter_contado_towers_domicile_building: "Schaltet das [domicile_building|E] #V [GetDomicileBuilding('merchant_company_towers_01').GetName]#! frei"
 tradition_contract_warfare_name: "Vertragskriegsführung"
 tradition_contract_warfare_desc: "Diese Kultur hat die Kriegsführung weit über Wehrpflicht und Bürgerarmeen hinaus institutionalisiert. Truppen dienen auf Vertragsgrundlage, und Offiziere handeln die Ziele von Feldzügen mit Städten und Lehnsherren aus. Das Töten hat sich von einer persönlichen zu einer geschäftlichen Angelegenheit entwickelt."
 culture_parameter_unlock_innovation_condottieri: "Die [innovation|E] #high $innovation_condottieri$#! wird in der [era|E] „$culture_era_late_medieval$“ verfügbar"
 culture_parameter_contract_warfare_single_combat: "[rulers|E] mit einer [commander_trait|E], einer [Concept('martial', 'Kriegsführungs')|E]-[education_trait|E] oder der [trait|E] [GetTrait('brave').GetName(GetNullCharacter)|U] können die [interaction|E] #V $challenge_to_single_combat_nomadic_interaction$#! bei [Concept('characters','Charakteren')|E] desselben oder niedrigeren [Concept('title_tier', 'Titelrangs')|E] nutzen, die nicht der eigene [liege|E] sind"
 culture_has_university_desc: "Die [culture|E] ist nicht in einer [county|E] mit einer Universität präsent"
