l_german:
 # Trade
 game_concept_trade: "Handel"
 game_concept_trade_desc: "$game_concept_trade$ ist der Lebenssaft von [republics|E], [trade_leagues|E] und [Concept('merchants', 'Kaufleuten')|E].\n\n[trade_routes|E] sorgen für die Ein- und Ausfuhr von [goods|E] in oder aus [trade_markets|E], während die [needs|E] und [surpluses|E] eines Markts durch [buildings|E] und ihre beteiligten [baronies|E] bestimmt werden.\n\nVerkaufspreise ermittelt man hingegen über den [prosperity|E] eines Besitztums, und an Verkäufen beteiligte Charaktere nutzen [competitiveness|E] und [monopolies|E] um Märkte zu beherrschen. Um die Gewinne zu steigern, sollte jeder auf einem Markt danach streben, die [capacity|E] und die Länge der Routen zu erhöhen sowie auch die Zahl der Märkte und Handelswaren auf jeder Route.\n\nAlle [government_forms|E] (außer [Concept('adventurers', 'Abenteurern')|E] und [nomads|E]) können am $game_concept_trade$ teilnehmen."
 game_concept_trade_good: "Handelsware"
 game_concept_trade_goods: "Handelswaren"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "der Handelsware"
 game_concept_trade_goods_possessive: "der Handelswaren"
 game_concept_good: "Ware"
 game_concept_goods: "Waren"
 game_concept_basic_trade_good: "Grundhandelsware"
 game_concept_basic_trade_goods: "Grundhandelswaren"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$ sind [trade_goods|E], die über eine [distribution_route|E] befördert werden können.\n\nIm Gegensatz dazu kann eine [profit_route|E] oder [commission_route|E] mit beliebigen $game_concept_trade_goods$ handeln."
 game_concept_market_toll: "Marktzoll"
 game_concept_market_tolls: "Marktzölle"
 game_concept_toll: "Zoll"
 game_concept_tolls: "Zölle"
 game_concept_market_toll_desc: "$game_concept_market_tolls$ sind Abgaben, die bei jedem Verkauf auf einem [trade_market|E] erhoben werden.\n\nSie werden vom [market_owner|E] kontrolliert, der auch alle Erlöse daraus erhält.\n\nMärkte mit niedrigeren $game_concept_market_tolls$n sind gewinnträchtiger für [merchants|E].\n\nHöhere $game_concept_market_tolls$ erhöhen die [income|E] $game_concept_market_owner_possessive$, aber mindern die Gewinne, die $game_concept_merchants$ auf allen [profit_routes|E] erzielen, welche $game_concept_goods$ auf diesem $game_concept_market$ verkaufen. All zu hohe $game_concept_tolls$ können $game_concept_merchants$ dazu bringen, auf weniger verzollten $game_concept_markets$n zu verkaufen.\n\nDer [market_owner|E] und seine [Concept('direct_vassals', 'direkten Vasallen')|E], [tributaries|E] und [clients|E] sind von der Zahlung von Zöllen ausgenommen."
 game_concept_good_possessive: "der Ware"
 game_concept_goods_possessive: "der Waren"
 game_concept_trade_good_desc: "$game_concept_trade_goods$ können auf einem [market|E] ge- und verkauft werden. Eine Vielzahl verschiedener Waren lassen sich auf der ganzen Welt handeln, um die [needs|E] der [realms|E] zu decken."
 game_concept_trade_category: "Warenkategorie"
 game_concept_trade_categories: "Warenkategorien"
 game_concept_trade_category_short: "Kategorie"
 game_concept_trade_categories_short: "Kategorien"
 game_concept_trade_category_desc: "$game_concept_trade_categories$ sind Gruppen von [trade_goods|E]. [trade_markets|E] haben oft einen [need|E] nach Waren einer bestimmten Kategorie. Jede Ware in dieser Kategorie kann den Bedarf decken."
 game_concept_trade_expertise: "Handelsexpertise"
 game_concept_expertise: "Expertise"
 game_concept_trade_expertise_desc: "Die $game_concept_trade_expertise$ stellt praktische Erfahrung beim Handel mit einer bestimmten [trade_category|E] dar. Man verdient sie sich durch die [primary_good|E] der aktiven [trade_routes|E]. Wächst die $game_concept_trade_expertise$, wird der Umgang mit dieser Kategorie gewinnträchtiger, und höhere [expertise_levels|E] gewähren weitere Boni, die von der Kategorie abhängen."
 game_concept_trade_expertise_progress: "Handelsexpertise-Fortschritt"
 game_concept_expertise_progress: "Expertise-Fortschritt"
 game_concept_trade_expertise_progress_desc: "Jeder Punkt [expertise|E] erhöht den Fortschritt eines Charakters zur nächsten [expertise_level|E]."
 game_concept_trade_expertise_level: "Handelsexpertise-Stufe"
 game_concept_expertise_level: "Expertise-Stufe"
 game_concept_expertise_levels: "Expertise-Stufen"
 game_concept_trade_expertise_level_desc: "Die $game_concept_trade_expertise_level$ einer [trade_category|E] ist ein Ranggrad, der widerspiegelt, wie erfahren eine [trade_company|E] beim Handel in dieser Kategorie ist.\n\nSie steigt, wenn [expertise_progress|E] durch aktive [trade_routes|E] angesammelt wird, und jede Stufe bietet weitere [Concept('trade', 'Handels')|E]-Boni.\n\nOhne aktiven Handel in der Kategorie nimmt die Stufe schrittweise ab (#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! Expertise-Fortschritt monatlich)."
 game_concept_trade_market: "Handelsmarkt"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "Handelsmärkte"
 game_concept_trade_market_possessive: "des Handelsmarkts"
 game_concept_trade_markets_possessive: "der Handelsmärkte"
 game_concept_market: "Markt"
 game_concept_markets: "Märkte"
 game_concept_market_possessive: "des Markts"
 game_concept_markets_possessive: "der Märkte"
 game_concept_trade_market_desc: "Ein $game_concept_trade_market$ ist ein Handelsknoten, der die [production|E] und [needs|E] aller von ihm umfassten [holdings|E] bündelt.\n\nInnerhalb eines Markts wird die örtliche Herstellung erst verwendet, um die [needs|E] seiner [buildings|E] zu stillen. Alles, was übrig bleibt, wird ein [surplus|E], der verkauft werden kann; nicht erfüllte Bedarfe müssen durch Einfuhren gedeckt werde. [trade_routes|E] verbinden Märkte, um [goods|E] zwischen ihnen zu befördern.\n\nJeder Markt hat einen [market_capital|E] als Zentrum, der vom [market_owner|E] gehalten wird. Je höher der [market_prosperity|E] ist, desto besser sind die [sell_prices|E], die Händlern angeboten werden."
 game_concept_market_prosperity: "Marktwohlstand"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "Der $game_concept_market_prosperity$ ist die durchschnittliche [Concept('prosperity', 'Wohlstands')|E]-Stufe in allen [counties|E] eines [Concept('market','Markts')|E].\n\nEin höhrer $game_concept_market_prosperity$ steigert die [sell_prices|E] von [goods|E] auf dem Markt, was diesen zu einem lohnenswerten Ziel für [merchants|E] macht."
 game_concept_market_capital: "Markthauptsitz"
 game_concept_market_capitals: "Markthauptsitze"
 game_concept_market_capital_possessive: "des Markthauptsitzes"
 game_concept_market_capitals_possessive: "der Markthauptsitze"
 game_concept_market_capital_desc: "Der $game_concept_market_capital$ ist das [holding|E] im Herzen eines [Concept('market','Markts')|E] und meist der [Concept('de_jure', 'De-jure')|E]-Hauptsitz jenes [Concept('duchy', 'Herzogtums')|E], das der Markt abdeckt.\n\nDer Markthauptsitz wird zu Beginn des Spiels festgelegt und verändert seine Position nicht. Wer diese [barony|E] hält, wird [market_owner|E] und kontrolliert den Markt."
 game_concept_market_owner: "Marktbesitzer"
 game_concept_market_owners: "Marktbesitzer"
 game_concept_market_owner_possessive: "des Marktbesitzers"
 game_concept_market_owners_possessive: "der Marktbesitzer"
 game_concept_owner: "Besitzer"
 game_concept_owners: "Besitzer"
 game_concept_owner_possessive: "des Besitzers"
 game_concept_owners_possessive: "der Besitzer"
 game_concept_market_owner_desc: "Der $game_concept_market_owner$ ist derjenige, wer auch immer den [market_capital|E] eines [Concept('market','Markts')|E] hält. Dies wird durch eine Übertragung des Besitzes der [barony|E] durch Kriege oder Vererbung bestimmt.\n\nDer Marktbesitzer kontrolliert den Markt: Er kann damit verbundene [distribution_routes|E] schaffen, ist der erforderliche Partner für [commission_routes|E], kann [monopolies|E] auf ihm verleihen und seinen [market_toll|E] festlegen."
 game_concept_market_priority: "Marktpriorität"
 game_concept_market_priorities: "Marktprioritäten"
 game_concept_market_priority_desc: "$game_concept_market_priority$ ist die Reihenfolge, in der die [holdings|E] eines [Concept('market','Markts')|E] versorgt werden, wenn ihre [needs|E] erfüllt werden.\n\nAn erster Stelle steht der [market_capital|E], dann der Rest seiner [county|E], gefolgt von den anderen $game_concept_counties$ entsprechend der [settlement_size|E] ihres [Concept('county_capital', 'Gemeidesitzes')|E].\n\nIn jeder $game_concept_county$ wird zuerst der [county_capital|E] und anschließend die anderen $game_concept_holdings$ entsprechend der [settlement_size|E] versorgt.\n\nIn einem [holding|E] könnt Ihr die Reihenfolge der [districts|E] und [buildings|E] ändern, um sicherzustellen, dass das richtige [building|E] als Erstes die [needs|E] erfüllen kann."
 game_concept_market_share: "Marktanteil"
 game_concept_market_shares: "Marktanteile"
 game_concept_market_share_desc: "Euer $game_concept_market_share$ gibt an, wie viel von einer [trade_good|E] Eure [profit_route|E] auf einem [market|E] handeln kann, im Rahmen dessen, wie es von Eurer $game_concept_competitiveness$ festgelegt wird.\n\nWenn Ihr beispielsweise so viel $game_concept_competitiveness$ wie alle anderen zusammen habt, die eine bestimmte $game_concept_good$ handeln, wäre Euer $game_concept_market_share$ 50 %. Wenn niemand anderes die $game_concept_good$ handelt, ist Euer $game_concept_market_share$ immer 100 %.\n\nIn diesem Fall könnt Ihr den gesamten [surplus|E] aufkaufen oder verkaufen, um all Eure [needs|E] auf diesem $game_concept_market$ zu decken, solange Ihr ausreichend [capacity|E] habt."
 game_concept_trade_route: "Handelsroute"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "Handelsrouten"
 game_concept_trade_route_possessive: "der Handelsroute"
 game_concept_trade_routes_possessive: "der Handelsrouten"
 game_concept_route: "Route"
 game_concept_routes: "Routen"
 game_concept_route_possessive: "der Route"
 game_concept_routes_possessive: "der Routen"
 game_concept_trade_route_desc: "Eine $game_concept_trade_route$ erlaubt es einem [character|E], für [gold|E] oder zur Deckung der Bedarfe des eigenen [Concept('realm', 'Reichs')|E] am [trade|E] teilzunehmen. Über diese Kanäle werden [goods|E] zwischen [Concept('markets', 'Märkten')|E] weitergeleitet: Der [surplus|E] wird von einem Markt genutzt, um [needs|E] eines anderen zu decken.\n\nEs gibt drei Arten von Routen:\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E]: Wird von [Concept('dukes', 'Herzögen')|E] und höheren Herrschern genutzt, um die [needs|E] ihrer [buildings|E] zu decken.\n$EFFECT_LIST_BULLET$[profit_route|E]: Wird von [Concept('merchants', 'Kaufleuten')|E] und [Concept('republican', 'republikanischen')|E] Herrschern verwendet, um [gold|E] zu erzeugen.\n$EFFECT_LIST_BULLET$[commission_route|E]: Ähneln Gewinnrouten, aber werden von landbesitzenden Herrschern an Kaufleute vergeben, um Bedarfe für eine begrenzte Zeit für eine einzelne Zahlung im Voraus zu erfüllen.#!"
 game_concept_distribution_route: "Verteilungsroute"
 game_concept_distribution_routes: "Verteilungsrouten"
 game_concept_distribution: "Verteilung"
 game_concept_distribution_route_possessive: "der Verteilungsroute"
 game_concept_distribution_routes_possessive: "der Verteilungsrouten"
 game_concept_distribution_route_desc: "Eine $game_concept_distribution_route$ ist eine Art von [trade_route|E], die von [Concept('dukes', 'Herzögen')|E] und höhergestellten Herrschern genutzt wird, um ihr eigenes [realm|E] zu versorgen.\n\nSie verbindet zwei [markets|E], und jeder [surplus|E] auf dem einen $game_concept_market$ wird genutzt, um [needs|E] auf dem anderen zu decken. Allerdings können nur [basic_trade_goods|E] über $game_concept_distribution_routes$ verlegt werden."
 game_concept_profit_route: "Gewinnroute"
 game_concept_profit_routes: "Gewinnrouten"
 game_concept_profit: "Gewinn"
 game_concept_profit_route_possessive: "der Gewinnroute"
 game_concept_profit_routes_possessive: "der Gewinnrouten"
 game_concept_profit_route_desc: "Eine $game_concept_profit_route$ ist eine Art von [trade_route|E], die [merchants|E] und [Concept('republican', 'republikanische')|E] [rulers|E] nutzen, um [gold|E] zu verdienen.\n\nSie kauft [trade_goods|E] günstig, wo sie einen [surplus|E] haben, und verkauft sie, wo [needs|E] hoch sind. Durch die Differenz zwischen [buy_price|E] und [sell_price|E] wird ein Gewinn erwirtschaftet."
 game_concept_trade_route_modifier: "Handelsrouten-Modifikator"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "Handelsrouten-Modifikatoren"
 game_concept_trade_route_modifier_desc: "Dieser [modifier|E] gilt für alle [trade_routes|E] seines Besitzers. Die unterschiedlichen modifizierbaren Attribute sind:\n$BULLET_WITH_TAB$[competitiveness_i][trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i][route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i][max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i][max_trade_markets_short|E]"
 game_concept_commission_route: "Kommissionsroute"
 game_concept_commission_route_desc: "Eine $game_concept_commission_route$ ist eine [trade_route|E], die ein [merchant|E] im Auftrag des eigenen [Concept('merchant_patron', 'Gönners')|E] bedient.\n\nDer $game_concept_merchant$ wird vom $game_concept_merchant_patron$ bezahlt, um eine bestimmte [trade_good|E] für die Dauer $game_concept_commission_possessive$ zum festgelegten [trade_market|E] zu bringen.\n\nEin $game_concept_merchant$ kann #V 1#! $game_concept_commission_route$ zur Zeit haben."
 game_concept_commission_routes: "Kommissionsrouten"
 game_concept_commission_route_possessive: "der Kommissionsroute"
 game_concept_commission_routes_possessive: "der Kommissionsrouten"
 game_concept_commission: "Kommission"
 game_concept_commissions: "Kommissionen"
 game_concept_commission_possessive: "der Kommission"
 game_concept_commissions_possessive: "der Kommissionen"
 game_concept_commissioned_route: "Kommissionärsroute"
 game_concept_commissioned_routes: "Kommissionärsrouten"
 game_concept_trade_route_length: "Handelsroutenlänge"
 game_concept_route_length: "Routenlänge"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "Die $game_concept_trade_route_length$ ist die maximale Zahl an [baronies|E], die eine [profit_route|E] überspannen kann, einschließlich Meeren und befahrbaren Flüssen. Dies lässt sich durch die Verbesserung von [Concept('company_building', 'Gesellschaftsgebäuden')|E] erhöhen."
 game_concept_max_trade_goods: "Max. Handelswaren"
 game_concept_max_trade_goods_short: "Handelswaren"
 game_concept_max_trade_goods_desc: "Die $game_concept_max_trade_goods$ sind die Zahl an unterschiedlichen [Concept('good', 'Warenarten')|E], die auf einer [route|E] gehandelt werden. Dies lässt sich durch [company_buildings|E] erhöhen.\n\nEine [profit_route|E] kann nie mehr als #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#! [goods|E] transportieren, ungeachtet etwaiger Boni."
 game_concept_max_trade_markets: "Max. Handelsmärkte"
 game_concept_max_trade_markets_short: "Handelsmärkte"
 game_concept_max_trade_markets_desc: "Die $game_concept_max_trade_markets$ sind die Menge an [Concept('markets', 'Märkten')|E], die ein [character|E] als Halte entlang einer [profit_route|E] auswählen kann. Dies lässt sich durch die Verbesserung von [Concept('company_building', 'Gesellschaftsgebäuden')|E] erhöhen."
 game_concept_trade_route_capacity: "Handelsrouten-Kapazität"
 game_concept_trade_route_capacity_short: "Handelskapazität"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "Kapazität"
 game_concept_trade_route_capacity_desc: "Die $game_concept_trade_route_capacity$ bestimmt über die Menge an [trade_goods|E], die entlang einer [profit_route|E] gleichzeitig gehandelt werden können. Dies lässt sich durch die Verbesserung von [Concept('company_building', 'Gesellschaftsgebäuden')|E] erhöhen."
 game_concept_primary_good: "Hauptware"
 game_concept_primary_goods: "Hauptwaren"
 game_concept_primary_good_desc: "[merchants|E] und [patricians|E] haben eine [trade_good|E], die die $game_concept_primary_good$ für ihre [trade_routes|E] ist.\n\nSie zu handeln, gewährt [trade_expertise|E] in der [trade_category|E] dieser Ware."
 game_concept_road: "Straße"
 game_concept_roads: "Straßen"
 game_concept_road_possessive: "der Straße"
 game_concept_roads_possessive: "der Straßen"
 game_concept_road_desc: "Eine [road|E] verbindet zwei [markets|E], was es [trade_routes|E] erlaubt, zwischen ihnen zu existieren.\n\n$game_concept_trade_routes$ entlang einer $game_concept_road$ haben Vorteile durch sie, vor allem durch eine erhöhte [trade_route_length|E].\n\nEine $game_concept_road$ kann auch der [barony|E], die sie durchquert, Vorteile gewähren (zum Beispiel ein höheres Bewegungstemp von [armies|E]).\n\nDie Vorteile einer $game_concept_road$ steigen mit ihrem [road_tier|E]."
 game_concept_road_tier: "Straßenrang"
 game_concept_road_tiers: "Straßenränge"
 game_concept_road_tier_short: "Rang"
 game_concept_road_tier_desc: "Der $game_concept_road_tier$ ist die Entwicklungsstufe einer [road|E], die von einem groben, unentwickelten Feldweg bis zu einer gut ausgebauten Überlandstraße reicht.\n\nEine Straße steigt im Rang auf, wenn mehr [trade|E] sie nutzt. Mit jedem Rang braucht es eine umfangreichere und längere Nutzung für den Abschluss als für den letzten. Höhere Ränge stärken die Auswirkungen der Straße: eine größere [trade_route_length|E] für die [trade_routes|E], die sie verwenden, und höhere Boni für die [baronies|E], die sie durchqueren.\n\nStraßen beginnen auf einem Rang, der von der Karte festgelegt wird, und nur jene über dem niedrigsten Rang werden zu Beginn des Spiels eingezeichnet."
 game_concept_building_need: "Gebäudebedarf"
 game_concept_building_needs: "Gebäudebedarfe"
 game_concept_need: "Bedarf"
 game_concept_needs: "Bedarfe"
 game_concept_building_need_desc: "Ein [building|E] kann $game_concept_needs$ nach [trade_goods|E] haben, die Boni gewähren, wenn sie erfüllt werden.\n\n$game_concept_needs$ sind entweder eine bestimmte [good|E] #weak (beispielsweise [GetTradeGoodType('trade_good_wine').GetName])#! oder eine beliebige $game_concept_good$ aus einer bestimmten [trade_category_short|E] #weak (beispielsweise [GetTradeGoodCategory('trade_category_alcohol').GetName])#!.\n\nAlle $game_concept_needs$ werden durch $game_concept_trade_goods$ auf dem örtlichen [market|E] erfüllt. Wenn es keinen [surplus|E] der $game_concept_good$ auf dem örtlichen $game_concept_market$ gibt, werden die $game_concept_goods$ entsprechend der [market_priority|E] verteilt.\n\n$game_concept_needs$ sind immer optional: Es hat keinen Nachteil, sie nicht zu erfüllen."
 game_concept_market_balance: "Marktsaldo"
 game_concept_market_balances: "Marktsaldos"
 game_concept_market_balance_short: "Saldo"
 game_concept_market_balances_short: "Saldos"
 game_concept_market_balance_desc: "Jeder[market|E] hat einen Saldo für jede [trade_good|E] oder Kategorie von [goods|E].\n\nIst der Saldo positiv, gibt es einen [surplus|E].\n\nIst der Saldo negativ ist, gibt es noch unerfüllte [needs|E] in [Concept('buildings', 'Gebäuden')|E] auf dem Markt."
 game_concept_trade_surplus: "Marktüberschuss"
 game_concept_trade_surpluses: "Marktüberschüsse"
 game_concept_surplus: "Überschuss"
 game_concept_surpluses: "Überschüsse"
 game_concept_trade_surplus_desc: "Eine [trade_good|E] hat einen $game_concept_surplus$ auf einem [market|E], wenn es mehr [production|E] als [need|E] gibt.\n\nDas bedeutet, dass alle [buildings|E] auf dem $game_concept_market$ ihre $game_concept_needs$ erfüllt haben.\n\nDieser Überschuss kann über [trade_routes|E] an andere $game_concept_markets$ überführt werden."
 game_concept_trade_deficit: "Marktdefizit"
 game_concept_trade_deficits: "Marktdefizite"
 game_concept_deficit: "Defizit"
 game_concept_deficits: "Defizite"
 game_concept_trade_deficit_desc: "Eine [trade_good|E] hat ein $game_concept_deficit$ auf einem [market|E], wenn es mehr [needs|E] als [production|E] oder Einfuhren gibt.\n\nDas bedeutet, dass die $game_concept_needs$ einiger [buildings|E] auf dem $game_concept_market$ nicht erfüllt werden.\n\nEinfuhren über [trade_routes|E] können helfen, das $game_concept_deficit$ zu decken."
 game_concept_production: "Herstellung"
 game_concept_productions: "Herstellung"
 game_concept_trade_goods_production: "Handelswarenherstellung"
 game_concept_produced: "hergestellt"
 game_concept_production_desc: "Die $game_concept_production$ ist die Menge an [trade_good|E], die jeden Monat durch [districts|E] und deren [buildings|E] geschaffen werden.\n\nÜbersteigt die $game_concept_production$ auf einem [market|E] die [needs|E] einer Ware, wird das Überzählige zu einem [surplus|E], der für den [trade|E] zur Verfügung steht. Fällt die $game_concept_production$ zu knapp aus, bleiben diese Bedarfe unbefriedigt."
 game_concept_potential_production: "Herstellungspotenzial"
 game_concept_potential_productions: "Herstellungspotenzial"
 game_concept_potential_production_desc: "Das Herstellungspotenzial [county_possessive|E] bestimmt darüber, welche Roh-[trade_goods|E] im [resource_district|E] des [Concept('county_capital', 'Gemeindehauptsitzes')|E] hergestellt werden."
 game_concept_sell_price: "Verkaufspreis"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "Verkaufspreise"
 game_concept_sell_price_desc: "Der $game_concept_sell_price$ [market_possessive|E] ist der [gold|E]-Wert einer [trade_good|E] mit [need|E].\n\nBesitzer einer [profit_routes|E] verdienen den $game_concept_sell_price$ einer $game_concept_trade_good$ auf einem $game_concept_market$, wenn ihre [route|E] $game_concept_goods$ dort verkauft, die $game_concept_needs$ $game_concept_market_possessive$ erfüllen.\n\n[Concept('landed', 'Landbesitzende')|E] [rulers|E] profitieren auch von einem hohen $game_concept_sell_price$, da mehr [merchants|E] auf den $game_concept_market$ gelockt werden, was die Einnahmen durch [tolls|E] und die Wahrscheinlichkeit erhöht, dass die $game_concept_need$ erfüllt werden.\n\n$game_concept_tolls$ werden auf jede verkaufte $game_concept_good$ bezahlt, was den tatsächlichen $game_concept_sell_price$ verringert.\n\nWie sein Gegenstück, der [buy_price|E], erhöht auch er den [market_prosperity|E]."
 game_concept_buy_price: "Kaufpreis"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "Kaufpreise"
 game_concept_buy_price_desc: "Der $game_concept_buy_price$ [market_possessive|E] sind die [gold|E]-Kosten einer [trade_good|E] mit [surplus|E].\n\nBesitzer einer [profit_routes|E] zahlen den $game_concept_buy_price$ einer $game_concept_trade_good$ auf einem $game_concept_market$, wenn ihre [route|E] $game_concept_goods$ dort im $game_concept_surplus$ kauft.\n\nWie sein Gegenstück, der [sell_price|E], erhöht auch er den [market_prosperity|E]."
 game_concept_trade_monopoly: "Handelsmonopol"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "Handelsmonopole"
 game_concept_monopoly: "Monopol"
 game_concept_monopolies: "Monopole"
 game_concept_trade_monopoly_desc: "Ein $game_concept_monopoly$ lässt nur den Inhaber [goods|E] auf einem [market|E] kaufen und verkaufen.\n\nEin $game_concept_monopoly$ kann unterschiedlich angewendet werden:\n #indent_newline:4    $EFFECT_LIST_BULLET$Ein gewöhnliches $game_concept_monopoly$ gilt für eine [trade_category|E], wohingegen ein [complete_monopoly|E] für alle Waren gilt.\n$EFFECT_LIST_BULLET$Ein [exploitative_monopoly|E] erlaubt es dem Inhaber, die [Concept('production','Herstellungs')|E]-$game_concept_goods$ schon zu kaufen, bevor [needs|E] erfüllt werden.\n$EFFECT_LIST_BULLET$Ein $game_concept_monopoly$ kann von einem [merchant|E], einer [republic|E] oder einer ganzen [trade_league|E] gehalten werden.#!\n\n$game_concept_monopolies$ erhält man durch die Interaktion: $request_trade_monopoly_for_character_interaction|V$."
 game_concept_complete_monopoly: "Vollmonopol"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "Vollmonopole"
 game_concept_complete_monopoly_short: "voll"
 game_concept_complete_monopoly_desc: "Ein $game_concept_complete_monopoly$ deckt alle [Concept('trade_good','Handelswaren')|E] auf einem [market|E] gleichzeitig ab. Im Gegensatz zu einem grundlegenden [monopoly|E] ist es nicht auf eine [trade_category|E] beschränkt."
 game_concept_exploitative_monopoly: "Ausbeutungsmonopol"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "Ausbeutungsmonopole"
 game_concept_exploitative_monopoly_short: "ausbeutend"
 game_concept_exploitative_monopoly_desc: "Ein $game_concept_exploitative_monopoly$ ist eine Art von [monopoly|E], die es dem Inhaber erlaubt, die [production|E] des [Concept('market','Markts')|E] direkt zu kaufen.\n\nÜblicherweise kann nur der [surplus|E] aufgekauft werden. Im Gegensatz dazu kann der Besitzer eines $game_concept_exploitative_monopoly$s die $game_concept_production$ der [buildings|E] auf dem $game_concept_market$ kaufen, bevor die örtlichen [building_needs|E] erfüllt werden."
 game_concept_trade_competitiveness: "Handelswettbewerbsfähigkeit"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "Wettbewerbsfähigkeit"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "Jede [profit_route|E] hat eine $game_concept_competitiveness$: ein Maß dafür, welchen Anteil der [trade_goods|E] auf einem [market|E] sie handeln kann, wenn sie mit anderen $game_concept_profit_routes$ im Wettbewerb steht.\n\nJe größer der Anteil der $game_concept_competitiveness$ für eine bestimmte $game_concept_trade_good$ ist, den Ihr habt, desto höher ist auch Euer [market_share|E].\n\nGibt es ein [monopoly|E] auf dem $game_concept_market$, kann nur der Besitzer des $game_concept_monopoly$s die eigene $game_concept_competitiveness$ vergleichen."
 game_concept_competitive_pressure: "Wettbewerbsdruck"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "Der $game_concept_competitive_pressure$ stellt einen kurzfristigen geschäftlichen Druck dar, den ein [merchant|E] ausüben kann. Man kann ihn für einzigartige [decisions|E] und [interactions|E] ausgeben, um besondere Vorteile auf einzelnen [trade_routes|E] zu erlangen."
 game_concept_put_on_notice: "In Kenntnis setzen"
 game_concept_put_on_notice_desc: "„$game_concept_put_on_notice$“ ist eine [character_interaction|E], die durch den [perk|E] „[GetPerk('prepared_conscription_perk').GetName(GetPlayer)]“ freigeschaltet wird. Dabei setzt man [competitive_pressure_i][competitive_pressure|E] ein, um eine auf einen Rivalen ausgerichtete [trade_opportunity|E] gegen einen [merchant|E] auf einem Eurer [Concept('trade_route', 'Handelsrouten')|E]-[trade_markets|E] zu beginnen."
 game_concept_ruthless_oversight: "Unbarmherzige Aufsicht"
 game_concept_ruthless_oversight_desc: "„$game_concept_ruthless_oversight$“ ist eine [character_interaction|E], die durch den [perk|E] „[GetPerk('fear_tax_perk').GetName(GetPlayer)]“ freigeschaltet wird. Sie kann die [court_position|E]-[aptitude|E] eines Charakters steigern, kostet aber [dread|E], [opinion|E] und [company_sentiment|E]."
 game_concept_request_merchant_charter: "Kaufmannscharta erbitten"
 game_concept_request_merchant_charter_desc: "„$game_concept_request_merchant_charter$“ ist eine [character_interaction|E], bei der ein [merchant|E] den eigenen [merchant_patron|E] um eine [charter|E] bittet, was ihm Sonderrechte auf dem örtlichen [market|E] gewährt."
 game_concept_monopolize_trade: "Handel monopolisieren"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "„$game_concept_monopolize_trade$“ ist eine [character_interaction|E], die einen [merchant|E] [gold|E] an einen [market_owner|E] im Austausch für ein [trade_monopoly|E] zahlen lässt."
 game_concept_trader: "Händler"
 game_concept_traders: "Händler"
 game_concept_trader_possessive: "des Händlers"
 game_concept_traders_possessive: "der Händler"
 game_concept_trader_desc: "Ein $game_concept_trader$ ist ein [character|E], der einer [trade_route|E] zugewiesen wurde.\n\nEr muss ein [associate|E] oder [courtier|E] des Besitzers der Route sein und kann nur eine Route zur Zeit beaufsichtigen. [SelectLocalization(GetPlayer.GetGovernment.HasGovernmentFlag('government_is_merchant'), 'game_concept_trader_council_merchant', 'game_concept_trader_council')]\n\nJeder Händler ist einer Aufgabe zugewiesen, die einen bestimmten Aspekt der Route verbessert. Seine [aptitude|E] für diese Aufgabe beruht auf seinen [Concept('skills', 'Werten')|E].\n\nWährend sie auf einer Route arbeiten, führen Händler [schemes|E] auf jedem [trade_market|E] durch. Scheitert ein Komplott, erhält der Händler die [trait|E] [GetTrait('lifestyle_merchant').GetName(GetNullCharacter)], falls er sie noch nicht hat. Hat er sie schon, erhält er eine kleine Menge [trait_level_track_xp|E] in einem zufälligen [GetTrait('lifestyle_merchant').GetNameNoTooltip(GetNullCharacter)]s-[trait_level_track|E] ($trait_track_caravaneer$, $trait_track_artisan$ oder $trait_track_creditor$)."
 game_concept_trader_council: "Abgesehen vom [spouse|E] des Besitzers können sie nicht auch im [council|E] sitzen."
 game_concept_trader_council_merchant: "Der [spouse|E] des Besitzers und [deputies|E] können auch $game_concept_traders$ sein, ausgenommen sind [GetCourtPositionType('partner_court_position').GetName()] und [GetCourtPositionType('travel_leader_court_position').GetName()]."
 #Merchant
 game_concept_merchant: "Kaufmann"
 game_concept_merchants: "Kaufleute"
 game_concept_merchant_possessive: "des Kaufmanns"
 game_concept_merchants_possessive: "der Kaufleute"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "Ein $game_concept_merchant$ ist ein [Concept('unlanded', 'landloser')|E] [character|E], der als Teil einer [company|E] [Concept('trade', 'Handel treibt')|E].\n\nDiese Menschen streben danach, [building_needs|E] von [Concept('trade_markets', 'Märkten')|E] zu decken, was die Wirtschaft stärkt, aber vor allem persönlichen Reichtum und ihren gesellschaftlichen Stand steigern soll. Von diesen beiden Zielen ist das [prestige|E] wertvoller als [gold|E], da es ihnen erlaubt, ihre Stellung gegenüber [merchant_patron|E] und ihren [Concept('associates','Mitarbeitern')|E] zu steigern, was ihnen mehr Macht gewährt, um ihre [trade_routes|E] zu stärken und sich letzten Endes sogar ein [trade_monopoly|E] zu sichern."
 game_concept_merchant_family: "Kaufmannsfamilie"
 game_concept_merchant_families: "Kaufmannsfamilien"
 game_concept_merchant_family_possessive: "der Kaufmannsfamilie"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$ sind [houses|E], die sich als [merchants|E] oder [republicans|E] am Handel beteiligen. Sie besitzen eine [company|E], die vom [house_head|E] kontrolliert wird und sich in dessen Besitz befindet. Sie spielen eine wichtige Rolle für den [trade|E] und den [prosperity|E] eines Reichs."
 game_concept_associate: "Mitarbeiter"
 game_concept_associates: "Mitarbeiter"
 game_concept_associate_possessive: "des Mitarbeiters"
 game_concept_associates_possessive: "der Mitarbeiter"
 game_concept_associate_desc: "$game_concept_associates$ sind [Concept('unlanded', 'landlose')|E] Charaktere, die zu einer [Concept('merchant', 'Kaufmanns')|E]-[company|E] gehören. Sie erfüllen ähnliche Rollen wie die [courtiers|E] eines Herrschers mit Landbesitz, können [trade_routes|E] als [traders|E] verwalten und [deputies|E] werden."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "Vertreter"
 game_concept_deputies: "Vertreter"
 game_concept_deputy_possessive: "des Vertreters"
 game_concept_deputies_possessive: "der Vertreter"
 game_concept_deputy_desc: "$game_concept_deputies$ dienen [merchant_families|E] und deren [companies|E] in verschiedenen Rollen. Diese ähneln [Concept('court_positions','Hofämtern')|E], zu denen man [company|E]-[Concept('associates','Mitarbeiter')|E] ernennt, und ihre [aptitude|E] bestimmt darüber, wie erfolgreich sie bei ihren Aufgaben sind."
 game_concept_company: "Gesellschaft"
 game_concept_companies: "Gesellschaften"
 game_concept_company_possessive: "der Gesellschaft"
 game_concept_trade_company: "Handelsgesellschaft"
 game_concept_trade_companies: "Handelsgesellschaften"
 game_concept_company_desc: "$game_concept_trade_companies$ sind die Ausgangspunkte von [Concept('merchant_family', 'Kaufmannsfamilien')|E], an denen all ihre verbundenen [trade_routes|E] beginnen.\n\nJeder [GetGovernment('merchant_government').GetName] hat einen $game_concept_trade_company$s-[domicile|E]. Wenn es einen [merchant_patron|E] gibt, liegt der $game_concept_domicile$ üblicherweise im [holding|E] ihres [Concept('merchant_patron_possessive', 'Gönners')|E].\n\n[company_buildings|E] sind [domicile_buildings|E] der Gesellschaft, die Boni beim Handel und für alle gewähren, die daran beteiligt sind. Die $game_concept_company$ bietet zudem eine Unterkunft für [associates|E] (sowie deren Familienmitglieder) und [knights|E], die man als [deputies|E] anstellen kann.\n\n#WEAK Wie [courts|E] beinhalten $game_concept_companies$ auch einige namenlose [characters|E], die nicht wichtig genug sind, um dargestellt zu werden (es sind aber weniger).#!"
 game_concept_company_building: "Gesellschaftsgebäude"
 game_concept_company_buildings: "Gesellschaftsgebäude"
 game_concept_company_buildings_short: "Gebäude"
 game_concept_company_building_desc: "$game_concept_company_buildings$ sind die [domicile_buildings|E] einer [company|E]. Sie verbessern vor allem [trade|E], einschließlich [capacity|E], [route_length|E], [max_trade_goods_short|E] und [max_trade_markets_short|E] auf [trade_routes|E]."
 game_concept_usury: "Wucherei"
 game_concept_usurer: "Wucherer"
 game_concept_usurers: "Wucherer"
 game_concept_usurer_possessive: "des Wucherers"
 game_concept_usurers_possessive: "der Wucherer"
 game_concept_usurious: "wuchernd"
 game_concept_interest: "Zinsen"
 game_concept_usury_desc: "$game_concept_usury$ ist das [Concept('lending', 'Verleihen')|E] von [gold|E] gegen $game_concept_interest$. Ob es nun ein ehrliches Geschäft oder eine [sin|E] ist, wird durch die [GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip|l]e [doctrine|E] eines [rite|E] bestimmt.\n\nWo sie verdammt wird, verliert ein [merchant|E] [piety|E] für jedes [loan|E] durch die [interaction|E] $loan_money_interaction|V$, und eine [company|E], die dem $company_purpose_creditor|V$-Zweck folgt, bringt ihrem Besitzer einen anhaltenden Ruf als $game_concept_usurer$ ein, sobald ihre $game_concept_interest$ offen bekannt werden.\n\n#weak Manche $game_concept_rites$ verbieten das Verleihen für $game_concept_interest$ nur innerhalb der eigenen [religion|E], sodass ihre $game_concept_merchants$ frei an alle anderen verleihen dürfen.#!"
 game_concept_loan: "Darlehen"
 game_concept_loans: "Darlehen"
 game_concept_loan_possessive: "des Darlehens"
 game_concept_loans_possessive: "der Darlehen"
 game_concept_loaned: "geliehen"
 game_concept_lending: "verleiht"
 game_concept_loan_desc: "Ein $game_concept_loan$ ist eine Summe an [gold_i|E][gold|E], die mit einer erwarteten Rückzahlung verbunden ist – mit oder ohne $game_concept_interest$.\n\n$game_concept_loans$ werden meist von [Concept('ruler', 'Herrschern')|E] aufgenommen, die [debt|E] haben oder zusätzliche Mittel für einen [war|E] oder andere Ausgaben brauchen.\n\n$game_concept_loans$ können mit offen erklärten $game_concept_interest$, versteckten $game_concept_interest$ oder frei von $game_concept_interest$ vergeben werden. Verschiedene [faiths|E] haben unterschiedliche Ansichten zur [usury|E].\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help Ein $game_concept_loan$ kann die Menschen überleben, die sich auf es einließen: Stirbt eine der beiden Parteien, geht es auf deren [Concept('heir', 'Erben')|E] über (falls sie einen hat)#!"
 loan_repayment_help: "#help $game_concept_loans$ können an einen [debtor|E] durch die [decision|E] [GetDecisionWithKey('repay_loan_decision').GetName] zurückgezahlt werden, und ein [creditor|E] kann sie auch direkt durch die [interaction|E] #V $demand_repayment_interaction$#! einfordern, wenn mindestens #V 2#! Jahre vergangen sind.\n\n[merchants|E] mit dem [company_purpose|E] [GetLaw('company_purpose_creditor').GetName] können auch [loans|E] im Lauf der Zeit eintreiben, indem sie einen [GetCourtPositionType('bailiff_court_position').GetName()] beschäftigen und die [court_position_task|E] #V $bailiff_collect_loans$#! verwenden#!"
 game_concept_merchant_patron: "Gönner"
 game_concept_merchant_patrons: "Gönner"
 game_concept_merchant_patron_possessive: "des Gönners"
 game_concept_merchant_patron_desc: "Ein $game_concept_merchant_patron$ ist der [ruler|E] des [Concept('holding', 'Besitztums')|E], in dem sich der [domicile|E] eines [Concept('merchant_possessive', 'Kaufmanns')] befindet.\n\nDer $game_concept_merchant$ gilt dann als [client|E] des $game_concept_merchant_patron$s und muss [taxes|E] an ihn zahlen."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "Klientenkaufmann"
 game_concept_client_merchants: "Klientenkaufleute"
 game_concept_client_merchant_possessive: "des Klientenkaufmanns"
 game_concept_client: "Klient"
 game_concept_client_possessive: "des Klienten"
 game_concept_clients: "Klienten"
 game_concept_client_merchant_desc: "Ein $game_concept_client_merchant$ ist ein [Concept('merchant', 'Kaufmanns')|E]-[character|E]. Ihm gehört eine [company|E] im [realm|E] eines [Concept('landed', 'landbesitzenden')|E] [Concept('ruler', 'Herrschers')|E], der zu seinem [merchant_patron|E] wird.\n\nDer $game_concept_client_merchant$ bietet seinem Gönner einen Anteil seiner Einnahmen aus dem [trade|E]. Er kann sich keinem Krieg und keiner [faction|E] gegen seinen Gönner anschließen, noch kann er sich von ihm lossagen – es sei denn, er verlegt die Gesellschaft an einen anderen Ort."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "Reich entreißen"
 game_concept_seize_realm_cb_desc: "Ein [casus_belli|E], der es einem [merchant|E] erlaubt, eine [republic|E] einzurichten und Landbesitz zu erhalten. Angreifer können die [interaction|E] #V $gdp_merchant_seize_realm_call_debtor_interaction$#! nutzen, um [Concept('independent', 'unabhängige')|E] [rulers|E] mittels @unspent_strong_hook_icon! [Concept('strong_hooks', 'starker Druckmittel')|E] #weak ($strong_indebted_hook$ oder $strong_loan_hook$)#! zu zwingen, sich diesem [war|E] als [allies|E] anzuschließen."
 game_concept_company_purpose: "Gesellschaftszweck"
 game_concept_company_purposes: "Gesellschaftszwecke"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$ sind Leitlinien, die eine [company|E] und ihre [merchant_family|E] formen.\n\nEine Gesellschaft kann ihren Schwerpunkt auf das Verleihen von Geld, die familiäre Verlässlichkeit, die Güte und Seltenheit ihrer Waren, die Reichweite ihres Netzwerks, die Überbrückung von Entfernungen oder auch Kulturen legen.\n\nDie unterschiedlichen Zwecke bieten einzigartige [interactions|E], [deputy|E]-Ämter sowie [Concept('trade', 'Handelsboni')|E]."
 game_concept_trade_acumen: "Handelsscharfsinn"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "Scharfsinn"
 game_concept_trade_acumen_desc: "Der $game_concept_acumen$ stellt abstrakt betrachtet die Gesamtmenge an [gold|E] dar, die eine [Concept('merchant', 'Kaufmanns')|E]-[company|E] durch ihren [trade|E] in allen [trade_categories|E] angesammelt hat.\n\nDer Scharfsinn wird genutzt, um unterschiedliche [company_sizes|E] freizuschalten, kann aber nicht im eigentlichen Sinn ausgegeben werden."
 game_concept_company_size: "Gesellschaftsgröße"
 game_concept_company_sizes: "Gesellschaftsgrößen"
 game_concept_company_size_desc: "Die $game_concept_company_size$ stellt die Vorherrschaft einer [Concept('merchant_family_possessive', 'Kaufmannsfamilie')|E] im [trade|E] dar. Jede Stufe erhöht die [competitiveness|E] und die Handelsfähigkeiten deutlich. Ein Aufstieg zu einer höheren Größe erfordert das Ansammeln von [acumen|E].\n\nEs gibt vier unterschiedliche Größen: [GetLaw('company_size_small').GetName], [GetLaw('company_size_medium').GetName], [GetLaw('company_size_large').GetName] und [GetLaw('company_size_huge').GetName]."
 #Contracts
 game_concept_trade_contract: "Handelsvertrag"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "Handelsverträge"
 game_concept_trade_contract_possessive: "des Handelsvertrags"
 game_concept_trade_contracts_possessive: "der Handelsverträge"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$ sind ein Weg, mit dem [Concept('merchant', 'Kaufmanns')|E]-[companies|E] ihre [trade_routes|E] beeinflussen oder nach Reichtümern aus fernen Landen streben können.\n\nErsteres nennt man [trade_opportunities|E], Letzeres [luxury_contracts|E]."
 game_concept_trade_contract_tier: "Handelsvertragsrang"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "Rang"
 game_concept_trade_contract_tier_desc: "Jeder [trade_contract|E] hat einen $game_concept_trade_contract_tier_tier$, der sowohl die Schwierigkeit als auch den Lohn eines $game_concept_trade_contract$s bestimmt. Er beruht meist auf dem [prosperity|E] seines Standorts."
 game_concept_luxury_contract: "Luxusvertrag"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "Luxusverträge"
 game_concept_luxury_contract_possessive: "des Luxusvertrags"
 game_concept_luxury_contracts_possessive: "der Luxusverträge"
 game_concept_luxury_contract_desc: "$game_concept_luxury_contracts$ erfordern, dass [Concept('merchant', 'Kaufmanns')|E]-[companies|E] an einen fernen Ort [Concept('travel', 'reisen')|E] und versuchen, ein [domicile_artifact|E] zu beschaffen.\n\nDiese Verträge haben eine gewisse Wahrscheinlichkeit, jährlich für Kaufleute mit dem Karawanenführer-[company_purpose|E] zu erscheinen, und können durch die [decision|E] „[GetDecisionWithKey('gdp_visit_holding_decision').GetName]“ erlangt werden"
 game_concept_trade_opportunity: "Handelsgelegenheit"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "Handelsgelegenheiten"
 game_concept_trade_opportunity_possessive: "der Handelsgelegenheit"
 game_concept_trade_opportunities_possessive: "der Handelsgelegenheiten"
 game_concept_opportunity: "Gelegenheit"
 game_concept_opportunities: "Gelegenheiten"
 game_concept_opportunity_possessive: "der Gelegenheit"
 game_concept_opportunities_possessive: "der Gelegenheiten"
 game_concept_trade_opportunity_desc: "Für $game_concept_trade_opportunities$ mussen [Concept('merchant', 'Kaufmanns')|E]-[companies|E] erfolgreich ein [scheme|E] abschließen.\n\nLetztere sind meist rein geschäftlicher Natur (wie die Förderung gewinnträchtiger [trade_goods|E]), können allerdings auch feindseliger sein (zum Beispiel der Wettbewerb mit einer rivalisierenden Familie um die Kontrolle eines [Concept('market','Markts')|E]).\n\nWenn das $game_concept_scheme$ aus irgendeinem Grund scheitert oder aufgegeben wird, scheitert auch die $game_concept_trade_opportunity$."
 game_concept_trade_opportunity_tier: "Handelsgelegenheitenrang"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "Rang"
 game_concept_trade_opportunity_tier_desc: "Der $game_concept_trade_opportunity_tier$ spiegelt den [prosperity|E] jenes Orts wider, an dem der Vertrag besteht.\n\nJe höher der $game_concept_trade_opportunity_tier$, desto größer ist auch die Belohnung – doch solche Aufgaben sind meist auch schwieriger."
 game_concept_trade_opportunity_scheme: "Handelsgelegenheiten-Komplott"
 game_concept_trade_opportunity_schemes: "Handelsgelegenheiten-Komplotte"
 game_concept_trade_opportunity_scheme_possessive: "des Handelsgelegenheiten-Komplotts"
 game_concept_trade_opportunity_schemes_possessive: "der Handelsgelegenheiten-Komplotte"
 game_concept_trade_opportunity_scheme_trade_opportunity: "Handelsgelegenheit"
 game_concept_trade_opportunity_scheme_opportunity: "Gelegenheit"
 game_concept_opportunity_scheme: "Gelegenheits-Komplott"
 game_concept_opportunity_schemes: "Gelegenheits-Komplotte"
 game_concept_opportunity_scheme_possessive: "des Gelegenheits-Komplotts"
 game_concept_opportunity_schemes_possessive: "der Gelegenheits-Komplotte"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "Gönnervertrag"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "Gönnerverträge"
 game_concept_patron_contract_possessive: "des Gönnervertrags"
 game_concept_patron_contracts_possessive: "der Gönnerverträge"
 game_concept_patron_contract_desc: "Bei $game_concept_patron_contracts$n müssen [Concept('merchant', 'Kaufmanns')|E]-[companies|E] erfolgreich ein [scheme|E] im Zusammenhang mit ihrem [merchant_patron|E] abschließen.\n\nDiese Komplotte haben üblicherweise einen [diplomacy|E]-Schwerpunkt und sollen den Wünschen des Gönners dienen (beispielsweise durch die Klärung eines Marktstreits) oder den Gönner für die Wünsche des Kaufmanns gefügig machen (indem man eine rivalisierende Kaufmannsfamilie verdrängt).\n\nWenn das $game_concept_scheme$ aus irgendeinem Grund scheitert oder aufgegeben wird, scheitert auch der $game_concept_patron_contract$."
 game_concept_patron_contract_scheme: "Gönnervertragskomplott"
 game_concept_patron_contract_schemes: "Gönnervertragskomplotte"
 game_concept_patron_contract_scheme_possessive: "des Gönnervertragskomplotts"
 game_concept_patron_contract_schemes_possessive: "der Gönnervertragskomplotte"
 game_concept_patron_contract_scheme_patron_contract: "Gönnervertrag"
 game_concept_patron_scheme: "Gönnerkomplott"
 game_concept_patron_schemes: "Gönnerkomplotte"
 game_concept_patron_scheme_possessive: "des Gönnerkomplotts"
 game_concept_patron_schemes_possessive: "der Gönnerkomplotte"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "Ausrichtungsvertrag"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "Ausrichtungsverträge"
 game_concept_unity_contract_possessive: "der Ausrichtungsvertrag"
 game_concept_unity_contracts_possessive: "der Ausrichtungsverträge"
 game_concept_unity_contract_desc: "$game_concept_unity_contracts$ entstehen, wenn die [company_sentiment|E] eines [Concept('merchant_possessive', 'Kaufmanns')|E] niedrig ist: Sie stellen ein Problem dar, worum man sich kümmern muss."
 game_concept_domicile_artifact: "Wohnsitz-Artefakt"
 game_concept_domicile_artifacts: "Wohnsitz-Artefakte"
 game_concept_domicile_artifact_desc: "Ein $game_concept_domicile_artifact$ ist ein [artifact|E], das in der [company|E] eines [Concept('merchant_possessive', 'Kaufmanns')|E] ausgestellt wird, zum Beispiel [curios|E] und [creatures|E].\n\n$game_concept_domicile_artifacts$ sind eine der Hauptquellen für die [prestige|E]-Einnahmen von $game_concept_merchants$n.\n\nEs gibt keine Begrenzung für die Zahl der $game_concept_artifacts$, die ein [character|E] haben kann, aber nur jene, die an einem zu ihnen passenden Platz ausgestellt werden, entfalten ihre Wirkung.\n\n$game_concept_merchants$ können $game_concept_domicile_artifacts$ durch den erfolgreichen Abschluss von [luxury_contracts|E] erhalten."
 game_concept_menagerie: "Menagerie"
 game_concept_menagerie_creature: "Menagerie-Kreatur"
 game_concept_menagerie_creatures: "Menagerie-Kreaturen"
 game_concept_creature: "Kreatur"
 game_concept_creatures: "Kreaturen"
 game_concept_creature_desc: "Eine $game_concept_creature$ ist ein lebendes Tier, das von [Concept('merchants', 'Kaufleuten')|E] durch den Abschluss von [Concept('luxury_contracts', 'Luxusverträgen')|E] beschafft wird.\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "Kuriosität"
 game_concept_curios: "Kuriositäten"
 game_concept_curio_desc: "Eine $game_concept_curio$ ist eine seltene [artifact|E]-Art, die von [Concept('merchants', 'Kaufleuten')|E] durch den Abschluss von [Concept('luxury_contracts', 'Luxusverträgen')|E] beschafft wird.\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "Sie können als [domicile_artifact|E] in einer [company|E] ausgestellt werden, um einen stetigen Zuwachs an [prestige|E] zu erzeugen."
 game_concept_guelph_ghibelline_precursor_situation: "Vorspiel zu $game_concept_guelph_ghibelline_situation$"
 game_concept_guelph_ghibelline_precursor_situation_desc: "Als Vorspiel der [situation|E] namens [guelph_ghibelline_situation|E] handelt es sich hierbei um eine Sammlung von Ereignissen, die den Zwist zwischen dem Heiligen Römischen Reich und dem Pontifikat verschärfen.\n\n#F Es begann alles mit dem päpstlichen Wiedererstarken in Form des [Glossary('In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS')], wobei der Papst damals erklärte, der Adel solle nicht an der Papstwahl beteiligt sein, sondern dass diese den in Rom versammelten Kardinälen vorbehalten sei.\n\nSpäter im [Glossary('Dictatus Papae', 'DICTATUS_PAPAE_GLOSS')] und beim Investiturstreit erklärte der Papst, dass die dem Papst von Gott verliehene Macht universell sei und daher allein er Kirchenleute ernennen oder absetzen könne. Bischöfe, denen Laien ihre Amtssymbole verliehen, waren nicht gern gesehen."
 game_concept_guelph_ghibelline_situation: "Guelfen und Ghibellinen"
 game_concept_guelph_ghibelline_situation_desc: "Diese Lage entstand durch den Zwist zwischen dem Papst ([guelphs|E]) und dem Heiligen Römischen Reich ([ghibellines|E]).\n\nIm Lauf der Zeit entwickelte sie sich zu einer örtlichen Angelegenheit, bei der die Herrscher Norditaliens stärker am Reich beteiligt sein oder ihre Unabhängigkeit wahren wollten."
 game_concept_gg_involvement: "Beteiligung"
 game_concept_gg_involvement_desc: "Die $game_concept_gg_involvement$ eines [Concept('ruler', 'Herrschers')|E] an der [situation|E] namens [guelph_ghibelline_situation|E] zeigt an, wie sehr sich der Charakter auf den Zustand der Lage ausgewirkt hat. Dies verändert sich vor allem durch Aktionen gegen die gegnerische Seite.\n\nZu solchen Aktionen gehören:\n$BULLET_WITH_TAB$[hostile_schemes|EU]\n$BULLET_WITH_TAB$[Concept('imprison', 'Einkerkerungs')|E]-, [torture|E]- und [Concept('execution', 'Hinrichtungs')|E]-[interactions|E]\n$BULLET_WITH_TAB$Das [scheme|E] „[GetScheme('gg_switch_sides').GetTypeName]“, die [interaction|E] „$gg_recruit_partisan_interaction|V$“, der [casus_belli|E] „[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]“ etc.\n$BULLET_WITH_TAB$Das Auslösen von [Concept('situation_catalysts', 'Auslösern')|E]\n\nIm Gegenzug wird die $game_concept_gg_involvement$:\n$BULLET_WITH_TAB$Den skalierenden [modifier|E] „[GetModifier('gg_involvement_modifier').GetNameWithTooltip]“ für je #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#! Beteiligung anwenden\n$BULLET_WITH_TAB$Als Multiplikator der Belohnungen dienen, sollte Eure Seite die Lage beenden.\n\n#F Während der [guelph_ghibelline_precursor_situation|E] kann noch keine $game_concept_gg_involvement$ erlangt werden und sie sammelt sich in geringerem Maß an, bis der Streit ganz losbricht.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "Guelfe"
 game_concept_guelphs: "Guelfen"
 game_concept_guelph_desc: "Die Guelfen sind die Seite der [situation|E] namens [guelph_ghibelline_situation|E], die die Unabhängigkeit vom Heiligen Römischen Reich unterstützt und damit auch die göttliche Souveränität.\n\n#F Der Name Guelfen leitet sich vom Haus der Welfen ab, die historisch die Herzöge Bayerns waren; durch mündliche Weitergabe und eine andere Aussprache änderte sich auch die Schreibweise.#!"
 game_concept_ghibelline: "Ghibelline"
 game_concept_ghibellines: "Ghibellinen"
 game_concept_ghibelline_desc: "Die Ghibellinen sind die Seite der [situation|E] namens [guelph_ghibelline_situation|E], die einen größeren Einfluss und eine schärfere Kontrolle der aufmüpfigen Stadtstaaten Norditaliens durch das Heilige Römische Reich unterstützen.\n\n#F Der Name Ghibellinen leitet sich vom Kriegsruf der Hohenstaufer während der Belagerung von Weinsberg ab: Man rief „Waiblingen!“, wobei es sich um eine Stammburg der Staufer handelte.#!"
 game_concept_lombard_league: "Lombardenbund"
 game_concept_lombard_league_desc: "Diese Liga wurde von norditalienischen Städten gebildet, um sich den wachsenden Zentralisierungsforderungen des Heilige Römischen Reichs entgegenzustellen."
 game_concept_confederation_cohesion: "Bundzusammenhalt"
 game_concept_cohesion: "Zusammenhalt"
 game_concept_confederation_cohesion_desc: "$game_concept_cohesion$ bemisst, wie eng ein [confederation|E] zusammenhält. Er reicht von #V 0#! bis #V 100#!. Jedes Mitglied trägt monatlich zu ihm bei (im Guten wie im Schlechten), wobei der Zuwachs bei hohem $game_concept_cohesion$ kleiner wird.\n\nJede erreichte Stufe gewährt wachsende Vorteile für die Mitglieder. Was $game_concept_cohesion$ erzeugt und was die Stufen gewähren, hängt von der Bundart ab.\n\nBünde verwenden die folgenden Arten von $game_concept_cohesion$:\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "Handelsliga"
 game_concept_trade_league_desc: "Eine $game_concept_trade_league$ ist ein [confederation|E] von [republics|E], den republikanische [rulers|E] bilden oder dem sie sich anschließen können, um gegenseitige wirtschaftliche oder verteidigungsbezogene Vorteile zu erlangen.\n\nEin Mitglied hält den [leading_title|E] und dient als [trade_league_leader|E] (das einzige Mitglied, das andere einladen oder entfernen kann), während die anderen einen [member_title|E] halten.\n\nMitglieder genießen größere Vorzüge, wenn der [league_cohesion|E] sich vertieft."
 game_concept_trade_leagues: "Handelsligen"
 game_concept_trade_league_short: "Liga"
 game_concept_league_cohesion: "Ligazusammenhalt"
 game_concept_league_cohesion_desc: "$game_concept_cohesion$ bemisst die Einigkeit einer [trade_league|E], wobei jede erreichte Stufe ihren Mitgliedern wachsende [Concept('trade', 'Handels')|E]-Vorzüge gewährt. Unter #V 20#! ist die Liga zu locker, als dass Mitglieder einander bei [Concept('wars','Kriegen')|E] beistehen oder um [trade_monopolies|E] erbitten.\n\nMitglieder erzeugen sie durch ihren [title_tier|E], ihren [capital|E] und ihre [opinion|E] über den [trade_league_leader|E]. Gehaltene Monopole lassen den Zusammenhalt wachsen, wohingegen zu wenige oder zu viele [trade_league_members_short|E] ihn zum Schrumpfen bringen."
 game_concept_trade_league_leader: "Handelsliga-Anführer"
 game_concept_trade_league_leader_desc: "Ein Handelsliga-Anführer ist das offizielle Oberhaupt einer [trade_league|E].\n\nDer Anführer ist das einzige Mitglied einer [trade_league_member_short|E], der neue Mitglieder einladen oder bestehende Mitglieder entfernen kann. Eine Liga beginnt mit ihrem Gründer als Anführer. Mitglieder können später Ansprüche auf die Anführerschaft durchsetzen. Wenn der Anführer sie verlässt, folgt ihm ein anderes Mitglied auf Grundlage von [title_tier|E], [settlement_size|E] im [capital|E] und [prestige|E]."
 game_concept_trade_league_leader_short: "Anführer"
 game_concept_trade_league_member: "Handelsliga-Mitglied"
 game_concept_trade_league_members: "Handelsliga-Mitglieder"
 game_concept_trade_league_member_short: "Mitglied"
 game_concept_trade_league_members_short: "Mitglieder"
 game_concept_trade_league_member_desc: "Ein Handelsliga-Mitglied ist Teil einer [trade_league|E], weil es einen [member_title|E] hält, der aus dem [primary_title|E] der Mitglieds-[republics|E] besteht.\n\nEin Mitglied hält den [leading_title|E] und dient als [trade_league_leader|E]."
 game_concept_league_focus: "Ligaschwerpunkt"
 game_concept_league_focuses: "Ligaschwerpunkte"
 game_concept_league_focus_desc: "Der $game_concept_league_focus$ ist eine [trade_category|E], die vom [trade_league_leader|E] einer [trade_league|E] ausgewählt wird. Alle [holder|E] von [Concept('member_title', 'Mitgliedertiteln')|E] erhalten [trade_expertise|E]-, [Concept('production','Herstellungs')|E]- und [sell_price|E]-Boni für diese Kategorie."
 game_concept_patrician: "Patrizier"
 game_concept_patricians: "Patrizier"
 game_concept_patrician_possessive: "des Patriziers"
 game_concept_patrician_desc: "Ein Patrizier ist das [house_head|E] der führenden [Concept('merchant', 'Kaufmannsfamile')|E] einer [republic|E]."
 game_concept_patrician_family: "Patrizierfamilie"
 game_concept_patrician_families: "Patrizierfamilien"
 game_concept_patrician_family_short: "Familie"
 game_concept_patrician_family_desc: "Eine $game_concept_patrician_family$ ist eine [merchant_family|E], die Teil einer [republic|E] ist. Sie ist die adlige Elite, die die Macht und den Einfluss innerhalb einer Republik innehat, wobei sie die [consortery|E] als ihren [domicile|E] nutzt.\n\nEine Republik von [county|E]-[title_tier|E] kann nur eine Patrizierfamilie haben, während von Republiken mit höherem Rang erwartet wird, dass sie viele besitzen."
 game_concept_patrician_rating: "Patrizierwertung"
 game_concept_patrician_rating_short: "Wertung"
 game_concept_patrician_rating_desc: "Eine [patrician_family|E] hat eine $game_concept_patrician_rating$, die ein allgemeines Maß dafür ist, wie wesentlich und einflussreich eine Familie und ihr [patrician|E] in der [republic|E] sind.\n\nEine hohe Wertung gewährt dem [patrician|E] und dessen [house|E] Boni, die auf drei unterschiedliche Stufen verteilt sind. Jede Stufe schaltet zusätzliche Vorteile frei, darunter:\n$BULLET_WITH_TAB$Verbesserte [house_ambition|E]\n$BULLET_WITH_TAB$Verbesserte Annahme von [interactions|E]\n$BULLET_WITH_TAB$Erhöhte [governor_salary|E]\n\nEs gibt viele Wege, die Wertung zu erhöhen. Zu den Schlüsselfaktoren gehören:\n$BULLET_WITH_TAB$Die [Concept('trade', 'Handels')|E]-Einnahmen [patrician_possessive|E]\n$BULLET_WITH_TAB$Beherrschen der [republic|E]\n$BULLET_WITH_TAB$Sichern von Sitzen in der [assembly|E] und dem [council|E] [liege_possessive|E][AddLocalizationIf(HasDlcFeature('by_god_alone'), 'game_concept_patrician_rating_church_factors')]\n\n[SelectLocalization(HasDlcFeature('by_god_alone'), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM')]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$[house|E]-Mitglieder halten eine [clerical_region|E]\n$BULLET_WITH_TAB$Folgenden [modifier|E] haben: [GetModifier('favored_by_pope_modifier').GetNameWithTooltip]"
 game_concept_patrician_rating_penalties_PAM: "Die Wertung verringert sich, wenn der Patrizier [excommunicated|El], ein bekannter [criminal|E] oder „[GetModifier('scorned_pope_modifier').GetNameWithTooltip]“ hat."
 game_concept_patrician_rating_penalties_NO_PAM: "Die Wertung verringert sich, wenn der Patrizier [excommunicated|El] oder ein bekannter [criminal|E] ist."
 game_concept_consortery: "Partnerei"
 game_concept_consorteries: "Partnereien"
 game_concept_consortery_possessive: "der Partnerei"
 game_concept_consortery_desc: "Die $game_concept_consortery$ ist Residenz und [domicile|E] einer [patrician_family|E]. Sie steht üblicherweise im [capital|E] ihres [Concept('liege_possessive', 'Lehnsherrn')|E].\n\nÄhnlich wie die [trade_companies|E] der [Concept('merchant_possessive', 'Kaufleute')] verwendet die $game_concept_consortery$ [company_buildings|E] als [domicile_buildings|E], um Geschick und Wettbewerbsfähigkeit im Handel zu stärken.\n\nSie wird zusammen mit dem Titel der [patrician_family|E] vererbt."
 game_concept_assembly: "Versammlung"
 game_concept_assembly_possessive: "der Versammlung"
 game_concept_assembly_desc: "Eine Versammlung ist die regierende Körperschaft eines [Concept('realm', 'Reichs')|E].\n\nDie Verantwortung der Versammlung hängt von ihren [Concept('laws', 'Gestezen')|E] ab und kann das Abstimmen über sowie Bestätigen von Gesetzen, [Concept('republic_decrees', 'Republikerlassen')|E] oder Abstimmungen über Kandidaten bei einer Wahl-[succession|E] umfassen (beispielsweise bei einer [GetLaw('republican_elective_succession_law').GetName])."
 game_concept_republic_senate: "Senat"
 game_concept_republic_senate_possessive: "des Senats"
 game_concept_voting_session: "Wahlsitzung"
 game_concept_voting_sessions: "Wahlsitzungen"
 game_concept_voting_session_desc: "Eine $game_concept_voting_session$ ist der Vorgang, durch den eine [assembly|E] über ein vorgeschlagenes [law|E] oder einen [republic_decree|E] entscheidet.\n\nWährend die Sitzung läuft, geben die Mitglieder ihre Stimmen für oder gegen den Vorschlag ab (entsprechend ihrer Zustimmung). Wenn ausreichend Mitglieder zustimmen, bevor die Sitzung endet, ist der Vorschlag beschlossen und tritt in Kraft.\n\nZustimmung kann im Vorfeld einer Sitzung durch eine [councillor_task|E] und gewisse [perks|E] gesteigert werden, und ein [hook|E] lässt sich einsetzen, um ein Mitglied zu zwingen, so zu stimmen, wie Ihr es wollt."
 game_concept_republic_decree: "Republikerlass"
 game_concept_republic_decrees: "Republikerlasse"
 game_concept_republic_decree_short: "Erlass"
 game_concept_republic_decrees_short: "Erlasse"
 game_concept_republic_decree_desc: "Ein $game_concept_republic_decree$ ist eine Art von [decision|E] für [Concept('republic', 'Republiken')|E], die von der [assembly|E] bestätigt werden muss.\n\nAuch wenn es mehrere Arten von $game_concept_republic_decrees_short$n gibt, betreffen die meisten [patricians|E], den [realm_capital|E] oder die Republik im Allgemeinen."
 game_concept_house_ambition: "Hausbestrebung"
 game_concept_house_ambitions: "Hausbestrebungen"
 game_concept_house_ambition_desc: "Jedes [house|E] einer [republic|E] hat eine Bestrebung, die angibt, was die Mitglieder des Hauses in der Republik bewegen wollen."
 game_concept_republic_administration: "Republikverwaltung"
 game_concept_republic_administration_short: "Verwaltung"
 game_concept_republic_administrations: "Republikverwaltungen"
 game_concept_republic_administration_desc: "Alle [republics|E] besitzen eine vorgesehene Republikverwaltung, die über ihre Spezialisierung bestimmt.\n\nNur der [ruler|E] der Republik kann die Verwaltung ändern.\n\nEs gibt mehrere Verwaltungen zur Auswahl, die jeweils eigene einzigartige Vorzüge aufweisen.\n\n#help Die häufigsten Verwaltungen sind [GetLaw('republic_type_communal').GetName], [GetLaw('republic_type_maritime').GetName] und [GetLaw('republic_type_civic').GetName].#!"
 game_concept_republic_senator: "Senator"
 game_concept_republic_senators: "Senatoren"
 game_concept_republic_senator_desc: "Ein $game_concept_republic_senator$ ist ein ernanntes Mitglied einer [assembly|E], für die ein [GetLaw('republic_assembly_composition_roman_senate').GetName] als Vorbild dient.\n\nSenatoren werden vom [ruler|E] [republic_possessive|E] oder dem Zensor ernannt.\n\nNur eine begrenzte Zahl von $game_concept_republic_senators$ kann zu einer Zeit ernannt werden, was das Senatsgröße-[law|E] festlegt."
 game_concept_mercenary_limit: "Söldnerschwelle"
 game_concept_mercenary_limit_desc: "Die Söldnerschwelle bestimmt darüber, wie viele [mercenaries|E] ein [character|E] gleichzeitig anwerben kann.\n\nDie Söldnerschwelle wird festgelegt durch:\n$BULLET_WITH_TAB$[martial_i][Concept('martial', 'Kriegsführungs')|E]-[skill|E]\n$BULLET_WITH_TAB$[title_tier_i][title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
