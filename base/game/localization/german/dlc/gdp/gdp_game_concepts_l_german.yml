 game_concept_merchant_charter: "Kaufmannscharta"
 game_concept_merchant_charters: "Kaufmannschartas"
 game_concept_charter: "Charta"
 game_concept_charters: "Chartas"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "Eine $game_concept_charter$ ist ein Dokumenten-[artifact|E], das vom [merchant_patron|E] für einen der eigenen [Concept('client', 'clients')|E] ausgestellt wird.\n\n$game_concept_merchants$, die $game_concept_charter$-$game_concept_artifacts$ mit dem Siegel ihres $game_concept_merchant_patron$s tragen, haben Zugriff auf:\n$EFFECT_LIST_BULLET$Die [decision|E] #EMP #V $abuse_charter_authority_decision$#!#!\n$EFFECT_LIST_BULLET$Die [decision|E] #EMP #V $benevolent_charter_authority_decision$#!#!\n$EFFECT_LIST_BULLET$Die [interaction|E] #EMP #V $leverage_charter_authority_interaction$#!#!"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "„$game_concept_make_a_request$“ ist eine [interaction|E], mit der man einen [merchant_patron|E] um Gefallen, Finanzierung oder andere Unterstützung bitten kann."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "„$game_concept_request_contract_change$“ ist eine [interaction|E], die ein [vassal|E], [tributary|E] oder [client|E] einsetzen kann, um die eigenen Verpflichtungen gegenüber seinem [Concept('liege', 'Lehnsherrn')|E] oder [suzerain|E] neu auszuhandeln."
 game_concept_leading_title: "Führungstitel"
 game_concept_leading_title_desc: "Der [title|E], der einen auf Titeln beruhenden Bund wie eine [trade_league|E] führt.\n\nDer [holder|E] des Führungstitels ist der [trade_league_leader|E] des Bunds."
 game_concept_client_contract: "Klientenbande"
 game_concept_client_contracts: "Klientenbande"
 game_concept_client_contract_desc: "$game_concept_client_contracts$ bestimmen über die [obligations|E] zwischen einem [Concept('client', 'Klienten')|E] und seinem [merchant_patron|E].\n\nVier Pflichten können ausgehandelt werden: der Anteil der [Concept('trade', 'Handels')|E]-Einnahmen, der an den Gönner gezahlt wird, [prestige|E]-Rückhalt durch den Gönner, Stützung der [trade_competitiveness|E] sowie die Vermittlung von [marriages|E] im Auftrag der Kaufmannsfamilie.\n\nDie Bande werden bei einer Nachfolge vererbt und können nur aufgelöst werden, wenn die [company|E] in ein neues [holding|E] verlegt wird."
 game_concept_member_title: "Mitgliedertitel"
 game_concept_member_title_desc: "Ein [title|E] für Mitglieder eines auf Titeln beruhenden Bunds (beispielsweise einer [trade_league|E])."
 game_concept_company_sentiment: "Gesellschaftsausrichtung"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "Ausrichtung"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "Die $game_concept_company_sentiment$ zeigt, wie eine [Concept('merchant_family_possessive', 'Kaufmannsfamilie')|E] vorgeht und welche Haltung die Mitglieder zueinander haben.\n\nEs gibt mehrere [company_sentiment_levels|E], die bei [house|E]-Mitgliedern für verschiedene Vorteile und Abzüge sorgen.\n\nDie $game_concept_company_sentiment$ ändert sich je nach den Taten der $game_concept_company$ als Ganzes. [company_sentiment_positive_actions|E] verschieben die $game_concept_sentiment$ in Richtung [company_sentiment_concerted_i][company_sentiment_concerted|El], während [company_sentiment_negative_actions|E] sie in Richtung [company_sentiment_divided_i][company_sentiment_divided|El] verschieben.\n\n[house_heads|E] besitzen allgemein einen größeren Einfluss auf die $game_concept_sentiment$ des eigenen Hauses als andere Mitglieder."
 game_concept_company_sentiment_level: "Gesellschaftsausrichtungs-Haltung"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "Gesellschaftsausrichtungs-Haltungen"
 game_concept_company_sentiment_level_desc: "Eine $game_concept_company_sentiment_level$ stellt den derzeitigen Zustand der [company_sentiment|E] dar. Die aktive Haltung als $game_concept_sentiment$ ändert sich in Richtung [company_sentiment_concerted_i][company_sentiment_concerted|El] durch [company_sentiment_positive_actions|E] oder in Richtung [company_sentiment_divided_i][company_sentiment_divided|El] durch [company_sentiment_negative_actions|E], und jede Haltung bringt den Mitgliedern eines [Concept('house', 'Hauses')|E] verschiedene Vorteile und Abzüge ein.\n\nEs gibt fünf verschiedene Haltungen:\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i][company_sentiment_divided|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i][company_sentiment_fractious|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i][company_sentiment_independent|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i][company_sentiment_cooperative|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i][company_sentiment_concerted|E]"
 game_concept_company_sentiment_divided: "Raubgierig"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "Opportunistisch"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "Ausgeglichen"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "Zupackend"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "Geadelt"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"
 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"
 game_concept_company_sentiment_divided_desc: "Die raubgierige [company_sentiment_level|E] ist die wettbewerbsorientierteste Haltung. Nimmt eine [company|E] diese Haltung ein, halten alle Mitglieder Gewinne für das Wichtigste überhaupt – selbst wenn man dabei anderen auf die Füße tritt.\n\n#bold Auswirkungen durch diese $game_concept_company_sentiment_level$:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$[merchant_patron|E]-Meinung: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]: #P +25 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_regional_networks_decision$#!#!"
 game_concept_company_sentiment_fractious_desc: "Die opportunistische [company_sentiment_level|E] ist eine stark wettbewerbsorientierte Haltung, die nur [rapacious|El] nachsteht. Nimmt eine [company|E] diese Haltung ein, sind Mitgliedern die eigenen Interessen wichtiger als familiäre Pflichten.\n\n#bold Auswirkungen durch diese [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]: #P +10 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_establish_network_decision$#!#!"
 game_concept_company_sentiment_independent_desc: "Die ausgeglichene [company_sentiment_level|E] ist die mittlere Haltung. Nimmt eine [company|E] diese Haltung ein, braucht die Familie zwar noch ein Aushängeschild, doch Mitglieder können frei eigenen Angelegenheiten nachgehen, ohne dass es Einmischungen oder Verurteilungen gibt.\n\n#bold Auswirkungen durch diese [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_consult_house_decision$#!#!"
 game_concept_company_sentiment_cooperative_desc: "Die zupackende [company_sentiment_level|E] ist eine Haltung mit starkem Schwerpunkt auf der Legitimität, die nur [ennobled|El] nachsteht. Nimmt eine [company|E] diese Haltung ein, werden der Ruf der Gesellschaft und der Ruf seiner Mitglieder zu ein und demselben, und jedes Mitglied muss danach streben, das Ansehen sowie den sozialen Stand zu verbessern.\n\n#bold Auswirkungen durch diese [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$: #P +5 %#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +10 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_prosperity_decision$#!#! \n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_bailiffs_decision$#!#!"
 game_concept_company_sentiment_concerted_desc: "Die geadelte [company_sentiment_level|E] ist die Haltung mit dem stärksten Schwerpunkt auf der Legitimität. Nimmt eine [company|E] diese Haltung ein, bindet aus Pflichtbewusstsein und Respekt erwachsende Treue die Interessen des Ganzen an die des Oberhaupts – und die Gesellschaft steht auf einer Höhe mit Adelsfamilien.\n\n#bold Auswirkungen durch diese [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +25 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_family_business_decision$#!#! \n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_prosperity_decision$#!#! \n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_bailiffs_decision$#!#!"
 game_concept_company_sentiment_positive_actions: "Legitimierungsaktionen"
 game_concept_company_sentiment_positive_actions_desc: "Legitimierungsaktionen durch Eure [company|E] schieben die [company_sentiment|E] in Richtung [company_sentiment_concerted_i][company_sentiment_concerted|El].\n\n[house_heads|E] können die [decision|E] #V $unity_merchant_promote_excess_decision$#! einsetzen, um die [company_sentiment|E] deutlich in Richtung [company_sentiment_concerted_i][company_sentiment_concerted|El] zu schieben.\n\n#weak Einige Beispiele für $game_concept_company_sentiment_positive_actions$ sind:$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "Gewinnstrebenaktionen"
 game_concept_company_sentiment_negative_actions_desc: "Gewinnstrebenaktionen durch Eure [company|E] schieben die [company_sentiment|E] in Richtung [company_sentiment_divided_i][company_sentiment_divided|El].\n\n[house_heads|E] können die [decision|E] #V $unity_merchant_promote_diligence_decision$#! einsetzen, um die [company_sentiment|E] deutlich in Richtung [company_sentiment_divided_i][company_sentiment_divided|El] zu schieben.\n\n#weak Einige Beispiele für $game_concept_company_sentiment_negative_actions$ sind:$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ zwischen Haus und Adel\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ Abschluss einer Mitarbeiterbitte\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ mit einem anderen Kaufmannshaus\n$EFFECT_LIST_BULLET$ In Gesellschaft einladen\n$EFFECT_LIST_BULLET$ Scheitern bei einer Mitarbeiterbitte\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$"
 game_concept_republican_army: "Republikarmee"
 game_concept_republican_armies: "Republikarmeen"
 game_concept_republican_army_desc: "Eine $game_concept_republican_army$ ist eine [army|E], die von einem [realm|E] mit einer [Concept('republican', 'republikanischen')|E] [government|E] rekrutiert und unterhalten wird.\n\nSie besteht ausschließlich aus [title_men_at_arms|E] und wird kontrolliert von demjenigen, der das Amt als [liege|E] übernimmt."
 REPUBLICAN_ARMY_CONCEPT: "[republican_army|E]"
