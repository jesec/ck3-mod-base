l_german:
 dinar: "Dinar"
 dinar_plural: "Dinare"
 dinar_gloss: "[Glossary('Dinar', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('Dinare', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "Der #bold Dinar#! (oder #emp Denar#!) war eine Goldmünze, die von den Umayyaden im 7. Jahrhundert als Gegenstück zum byzantinischen Gold-[Glossary('Solidus', 'SOLIDUS_GLOSS')] eingeführt wurde. Sein Name leitete sich jedoch vom Silber-[Glossary('Denarius', 'DENARIUS_GLOSS')] ab.\n\nDie Münzen verbreiteten sich in der ganzen arabischen Welt, und ihr Name wird auch noch in mehreren modernen Währungen verwendet."
 denarius: "Denarius"
 denarius_plural: "Denarii"
 denarius_gloss: "[Glossary('Denarius', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('Denarii', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "Der #bold Denarius#! war ursprünglich eine Silbermünze der Römischen Republik, die während der Kaiserzeit im Wert gemindert wurde.\n\nNichtsdestotrotz überlebte der Begriff als Synonym für Währung in Gebieten, die von den Römern beeinflusst wurden. So übertrug sich der Name beispielsweise auf den Silber-[Glossary('Denar', 'PENNY_GLOSS')] und den arabischen Gold-[Glossary('Dinar', 'DINAR_GLOSS')]."
 ducat: "Dukat"
 ducat_plural: "Dukaten"
 ducat_gloss: "[Glossary('Dukat', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('Dukaten', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "Der #bold Ducato#! oder #emp Dogado#! war eine Goldmünze, die im 13. Jahrhundert von Venedig eingeführt wurde, um dem [Glossary('Florentiner', 'FLORIN_GLOSS')] aus Florenz und dem Genueser #emp Genovino#! zu entsprechen, die als Antwort auf die Verschlechterungen des byzantinischen [Glossary('Solidus', 'SOLIDUS_GLOSS')] oder Nomisma in Umlauf kamen. Sein Name leitet sich vom Titel des #emp Dogen#! von Venedig ab.\n\nEr wurde bald im Handelsverkehr hoch geschätzt, verbreitete sich in ganz Europa und darüber hinaus und wurde als Standard kopiert."
 dirham: "Dirham"
 dirham_plural: "Dirham"
 dirham_gloss: "[Glossary('Dirham', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('Dirham', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "Der #bold Dirham#! oder #emp Dram#! war eine Silbermünze, die im 7. Jahrhundert von den Umayyaden eingeführt und in der gesamten arabischsprachigen Welt übernommen wurde. Ihr Name leitet sich von der altgriechischen Silber-#emp Drachme#! der klassischen und hellenistischen Zeit ab.\n\nSie wurde zu einer Standardgewichtseinheit in der islamischen Welt und  verbreitete sich weit. Ihr Name wird noch heute als Einheit mehrerer moderner Währungen verwendet."
 aureus: "Aureus"
 aureus_plural: "Aurei"
 aureus_gloss: "[Glossary('Aureus', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('Aurei', 'AUREUS_GLOSS')]"
 solidus: "Solidus"
 solidus_plural: "Solidi"
 solidus_gloss: "[Glossary('Solidus', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('Solidi', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "Der #bold Solidus#! oder #emp Nomisma#! (wörtlich „Münze“) war eine Goldmünze, die von den Byzantinern im 4. Jahrhundert eingeführt wurde, um den älteren römischen [Glossary('Aureus', 'AUREUS_GLOSS')] zu ersetzen. Im 11. Jahrhundert wurde er selbst dann vom [Glossary('Hyperpyron', 'HYPERPYRON_GLOSS')] abgelöst.\n\nDie Goldmünzen der italienischen Republiken wie [Glossary('Ducato', 'DUCAT_GLOSS')], [Glossary('Florentiner', 'FLORIN_GLOSS')] und #emp Genovino#! führte man als Antwort auf seine Entwertung im 13. Jahrhundert ein.\n\nIn Nordeuropa war er als #emp Schilling#! bekannt, bis Karl der Große im 8. Jahrhundert mit seinen Reformen den Silbertauschwert unter diesem Namen standardisierte."
 hyperpyron: "Hyperpyron"
 hyperpyron_plural: "Hyperpyra"
 hyperpyron_gloss: "[Glossary('Hyperpyron', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('Hyperpyra', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "Der #bold Hyperpyron#! (was in etwa „hochveredelt“ bedeutet) war eine Goldmünze, die von den Byzantinern im 11. Jahrhundert eingeführt wurde, um den früheren [Glossary('Solidus', 'SOLIDUS_GLOSS')] zu ersetzen, und in Europa als Bezant bekannt war.\n\nObwohl er nicht so stark an Wert verlor wie der #emp Solidus#!, sank sein Wert bis zum 13. Jahrhundert doch ebenfalls erheblich, was die Einführung von [Glossary('Ducato', 'DUCAT_GLOSS')], [Glossary('Florentiner', 'FLORIN_GLOSS')], und #emp Genovino#! durch die italienischen Republiken beförderte."
 bezant: "Bezant"
 bezant_plural: "Bezant"
 bezant_gloss: "[Glossary('Bezant', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('Bezant', 'HYPERPYRON_GLOSS')]"
 florin: "Florentiner"
 florin_plural: "Florentiner"
 florin_gloss: "[Glossary('Florentiner', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('Florentiner', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "Der #bold Florentiner#! war eine Goldmünze, die im 13. Jahrhundert von der Republik Florenz als Antwort auf die Entwertung des byzantinischen [Glossary('Solidus', 'SOLIDUS_GLOSS')] und [Glossary('Hyperpyron', 'HYPERPYRON_GLOSS')] eingeführt wurde. Bald darauf folgten der genuesische #emp Genovino#! und der venezianische [Glossary('Ducato', 'DUCAT_GLOSS')].\n\nWie der #emp Dukat#! wurde der Florentiner zu einer weitverbreiteten Tauschmünze, und zahlreiche Münzstätten in ganz Europa prägten Kopien, sodass sein Name im ungarischen #emp Forint#! fortlebte."
 penny: "Pfennig"
 penny_plural: "Pfennige"
 penny_gloss: "[Glossary('Pfennig', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('Pfennige', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "Der #bold Pfennig#! (oder im Englischen #emp Penny#!) war eine standardisierte Silbermünze, die Karl der Große im 8. Jahrhundert als Äquivalent zum früheren [Glossary('Denarius', 'DENARIUS_GLOSS')] der römischen Welt einführte.\n\nEr verbreitete sich schnell und wurde als Standard in ganz Europa kopiert. Daher wurden auch Bezeichnungen wie #emp Denar#!, #emp Denier#! oder #emp Dinero#! austauschbar als Begriff für Silbermünzen seines Gewichts verwendet."
 pfennig: "Pfennig"
 pfennig_plural: "Pfennige"
 pfennig_gloss: "[Glossary('Pfennig', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('Pfennige', 'PENNY_GLOSS')]"
 denier: "Denier"
 denier_plural: "Denier"
 denier_gloss: "[Glossary('Denier', 'PENNY_GLOSS')]"
