 groschen: "Groschen"
 groschen_plural: "Groschen"
 groschen_gloss: "[Glossary('Groschen', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('Groschen', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "Der #bold Groschen#! oder „Dickpfennig“ war eine schwerere Silbermünze, die im 13. Jahrhundert von Herzog Meinhard II. von Tirol als Antwort auf den gleichwertigen venezianischen #emp Grosso#! eingeführt wurde und ursprünglich 12 [Glossary('Pfennige', 'PENNY_GLOSS')] wert war.\n\nDer Standard verbreitete sich bald durch ganz Europa, wobei die Münzprägestätten von Kuttenberg (Kutná Hora) in Böhmen und Freiburg in Meissen bemerkenswerte Quellen waren."
 tongbao: "Tongbao"
 tongbao_plural: "Tongbao"
 tongbao_gloss: "[Glossary('Tongbao', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('Tongbao', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold Tongbao#! (in etwa „Schatz im Umlauf“) ist die Bezeichnung für gegossene Münzen im [Glossary('Qian', 'QIAN_GLOSS')]-Stil aus einer Bronzelegierung, die erstmals von der Tang-Dynastie im 7. Jahrhundert ausgegeben wurden.\n\nSie entwickelten sich zur Standardtauscheinheit im gesamten chinesischen Raum und werden heute in der traditionellen chinesischen Medizin und als Glücksbringer verwendet."
 qian: "Qian"
 qian_plural: "Qian"
 qian_gloss: "[Glossary('Qian', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('Qian', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold Qian#! („Geld“) ist die allgemeine Bezeichnung für die allgegenwärtigen, aus Kupfer gegossenen Münzen, die in China ab der Zeit der Streitenden Reiche als Zahlungsmittel dienten.\n\nIhre quadratischen Löcher erleichterten das Glätten der Gusskanten beim Zusammenrollen auf einem Stab und ermöglichten zudem das Auffädeln größerer Stückelungen zum Tausch, üblicherweise zu je 1.000 Stück. Sie inspirierten die Herstellung ähnlicher Münzen in Japan, Korea, Vietnam und anderen Ländern."
 mon_coin: "Mon"
 mon_coin_plural: "Mon"
 mon_coin_gloss: "[Glossary('Mon', 'MON_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('Mon', 'MON_GLOSS')]"
 tanka: "Tanka"
 tanka_plural: "Tanka"
 tanka_gloss: "[Glossary('Tanka', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('Tanka', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "Der #bold Tanka#! oder #emp Taka#! war eine Silbermünze, die im 13. Jahrhundert vom Sultanat von Delhi eingeführt wurde.\n\nSie verbreitete sich in ganz Indien und den angrenzenden Regionen, wo sie vielfach kopiert wurde und eine gängige Tauscheinheit auf der Seidenstraße war."
 jital: "Jital"
 jital_plural: "Jital"
 jital_gloss: "[Glossary('Jital', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('Jital', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold Jital#! waren ursprünglich Silbermünzen mit einem Stier-und-Reiter-Motiv, die im 8. Jahrhundert in Kabul eingeführt wurden.\n\nIhr Entwurf verbreitete sich regional. Es wurden viele Kopien ausgegeben und schließlich entwertet, als man sie mit mehr und mehr Kupfer legierte. Ab dem 16. Jahrhundert bestanden #emp Jital#! vollständig aus Kupfer."
 coin: "Münze"
 coin_plural: "Münzen"
 coin_gloss: "Münze"
 coin_gloss_plural: "Münzen"
 bazaar: "Basar"
 bazaar_plural: "Basare"
 bazaar_gloss: "[Glossary('Basar', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('Basare', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold Basar#! ist ein persisches Wort für Marktplatz und stammt aus dem Proto-Indogermanischen. Später verbreitete es sich im Arabischen und ist heute in ganz Westasien, Indien und darüber hinaus weitverbreitet."
 khrom: "Khrom"
 khrom_plural: "Khrom"
 khrom_gloss: "[Glossary('Khrom', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('Khrom', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold Khrom#! ist ein tibetischer Begriff für einen Marktplatz, der sich regional entlang der Seidenstraße verbreitete."
 shuka: "Shuka"
 shuka_plural: "Shuka"
 shuka_gloss: "[Glossary('Shuka', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('Shuka', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold Shuka#! ist in den Sprachen des Kaukasus die Bezeichnung für einen Marktplatz. Wie das arabische [Glossary('Suq', 'SUQ_GLOSS')] wurde es ursprünglich aus dem Akkadischen für „Straße“ entlehnt, hier jedoch über das Syriakische."
 suq: "Suq"
 suq_plural: "Suq"
 suq_gloss: "[Glossary('Suq', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('Suq', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold Suq#! (oder auch #emp Souk#!) ist ein arabisches Wort für Marktplatz. Ursprünglich war es eine Entlehnung aus dem Akkadischen für „Straße“ über das Aramäische. Es ist heute ein gebräuchlicher Begriff in der muslimischen Welt und darüber hinaus."
