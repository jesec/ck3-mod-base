 custom_gp_fountain: "die großen Springbrunnen, um die Öffentlichkeit zu erfreuen und der Pracht der Stadt dienlich zu sein"
 custom_gp_improved_fountain: "die Verbesserung der großen Springbrunnen durch große Becken und einen Aquädukt"
