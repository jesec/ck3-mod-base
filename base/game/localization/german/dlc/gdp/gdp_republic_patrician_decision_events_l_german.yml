l_german:
 city_stroll_prefix: "Stadtpromenade"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: Wer es findet, darf es behalten"
 gdp_republic_patrician_decision.1000.desc: "Ich biege um die Ecke in eine abseits der Hauptstraße gelegene Gasse und treffe auf einen einheimischen Krämer, der sich im Gespräch befindet:\n\n„… und dann kam niemand, um es abzuholen“, sagt [Select_CString(local_character.IsFemale, 'die Frau', 'der Mann')] zu [local_character.Custom('DE_PRO_POS_S_3P')]er Begleitung und deutet auf die Kisten voll Ware ([abandoned_trade_good.GetNameNoTooltip]), die auf der Straße verteilt sind.\n\nNiemand tritt vor und macht Besitzansprüche darauf geltend. Ich mustere die Ladung rasch. Eine echte #EMP Gelegenheit#!."
 gdp_republic_patrician_decision.1000.a: "Wie wäre es, wenn wir für etwas Nachfrage sorgen …"
 gdp_republic_patrician_decision.1000.a.flavor: "Die Kisten und ihr Inhalt ([abandoned_trade_good.GetNameNoTooltip]) sind zerbrochen."
 gdp_republic_patrician_decision.1000.b: "„Oho, das gehört mir, seht Ihr!“"
 gdp_republic_patrician_decision.1000.c: "„Ah, die verlorenen Waren ([abandoned_trade_good.GetNameNoTooltip]) von [liege_scope.GetTitledFirstNameNoTooltip]! Vielen Dank.“"
 gdp_republic_patrician_decision.1000.d: "Nun, das geht mich nichts an."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: Ein Tag im Garten"
 gdp_republic_patrician_decision.1010.desc: "Ich finde eine verborgene Oase; ein wahrer Rohdiamant, verborgen in den Ecken und Gassen von [city_location.GetTitle.GetNameNoTier]. Die Fußwege haben bessere Zeiten gesehen, und die Pflanzen sind nur wenige, doch gut gepflegt. Ein Ort mit einem sehr hingebungsvollen Gärtner.\n\nGruppen von Edelleuten, aber auch Kaufleuten, Gemeinen und Arbeitern verweilen im Grünen und genießen eine kurze Pause von ihrer Arbeit.\n\nIch schlendere dort entlang, meine Stimmung hellt sich etwas auf und meine Lasten werden etwas erträglicher."
 gdp_republic_patrician_decision.1010.a: "Wir sollten dies hier zum besten Garten in [city_location.GetTitle.GetNameNoTierNoTooltip] machen!"
 gdp_republic_patrician_decision.1010.b: "Nun, was ist das für ein kleines Pflänzchen?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "Ihr findet faszinierende Pflanzen"
 gdp_republic_patrician_decision.1010.b.health_plant: "Ihr findet wohltuende Kräuter"
 gdp_republic_patrician_decision.1010.c: "Lasst mich einfach … etwas freier sein …"
 gdp_republic_patrician_decision.1010.c.flavor: "Lasst die Seele baumeln. Wie entspannend!"
 gdp_republic_patrician_decision.1010.c.success: "Ihr bleibt unentdeckt"
 gdp_republic_patrician_decision.1010.c.failure: "Ihr werdet ertappt"
 gdp_republic_patrician_decision.1010.d: "Entzückend!"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: Der Große Platz von [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1020.intro: "Ungeachtet der Politik und der Komplotte der [city_location.GetCounty.GetTitle.GetAdjective|l]en Adligen und Herrscher geht das Leben auf dem Großen Platz weiter."
 gdp_republic_patrician_decision.1020.intro.01: "Ein verlockender Duft von frischem Essen ([ROOT.Char.Custom('GetLocalStreetFood')]) erfüllt meine Nase, als die Küchen zu arbeiten beginnen."
 gdp_republic_patrician_decision.1020.intro.02: "Ein störrischer Esel schreit laut, als sein Besitzer wütend versucht, ihn abzuspritzen, um getrockneten Schlamm abzuwaschen."
 gdp_republic_patrician_decision.1020.intro.03: "Mehrere ältere Bürger gehen umher und machen abschätzige Geräusche über den Brotpreis und die Hochnäsigkeit der heutigen Jugend."
 gdp_republic_patrician_decision.1020.intro.04: "Eine Schar [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')] umkreist das Gebiet und blickt hungrig auf die örtlichen Marktstände."
 gdp_republic_patrician_decision.1020.intro.rain: "Dieser Morgen spielt sich vor dem Hintergrund des gestrigen Regensturms ab."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nDort drüben entdecke ich eine Gruppe von Soldaten, die nicht aus [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip] stammen. Sie wirken fehl am Platz wirken und sehen ängstlich aus. Was ich aus ihren mitunter lebhaften Diskussionen aufschnappe, ist, dass sie auch nach einem neuen Gönner Ausschau halten."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nAm Ende des Platzes mustert eine grobe Gestalt die Vorbeigehenden mit mürrischem Blick. Als ich mich ihr nähere, höre ich eine Litanei über die kürzliche Beendigung ihres prestigereichen Kaufmannsvertrags mit Haus [liege_scope.GetHouse.GetBaseName]. Ein angesehener Händler, der vom Pech verfolgt ist?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nIn der Mitte des Platzes hockt auf einem Stapel Kisten ein Arzt, der soeben einen Vortrag zu Körpersäften beendete und dazu sprach, wie man die schwarze Galle einfacher ins Gleichgewicht bekommt. Zögerlich nicke ich zustimmend.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nAn einem Stand in einer schäbigen Ecke des Platzes entdecke ich etwas Perfektes ([ROOT.Char.Custom('RandomMediumObject')]). Das wäre bei meinem Komplott ([scheme_to_boost.GetName|l]) sicherlich hilfreich …$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nAls ich über den Platz schaue, bemerke ich, dass etwas das Licht reflektiert. Ich blicke auf den Boden, um den Ursprung zu finden, und entdecke ein kleines Schmuckstück, das fast gänzlich mit Dreck bedeckt ist.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nAuf der anderen Seite des Platzes wird eine kleine Gruppe vom Pech verfolgter Bauern weggeführt. Eines der kleinen Kinder weint herzerweichend vor Hunger und Angst, während die Zuschauer ihr Bestes geben, die elende Gefolgschaft zu übersehen."
 gdp_republic_patrician_decision.1020.outro: "\n\nMein Bediensteter räuspert sich subtil, um mir zu zeigen, dass es an der Zeit ist, nach Hause zu gehen und mich meinen anderen Verantwortlichkeiten zuzuwenden."
 gdp_republic_patrician_decision.1020.a: "Ich sollte ein oder zwei mehr Münder füttern können."
 gdp_republic_patrician_decision.1020.b: "Diese Soldaten könnten sich als nützlich erweisen …"
 gdp_republic_patrician_decision.1020.c: "Hm. Ich könnte immer einen weiteren fähigen Händler gebrauchen …"
 gdp_republic_patrician_decision.1020.d: "Der Arzt sollte für mich arbeiten."
 gdp_republic_patrician_decision.1020.e: "Erst arbeiten, dann flanieren."
 gdp_republic_patrician_decision.1020.f: "Ich bereinige das einfach schnell …"
 gdp_republic_patrician_decision.1020.g: "Es gibt viel zu sehen und viele Menschen zu treffen!"
 gdp_republic_patrician_decision.1020.g.alternate: "Ein weiterer Tag in [GetPlayer.GetCapitalLocation.GetNameNoTooltip]."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: Hafen von [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1030.desc: "Der Geruch von Fisch und verrottendem Tang wird immer stärker, je näher wir zum örtlichen Hafen gelangen. Fischer mit ihren Familien – Mütter und kleine Kinder – sowie eine Schar streunender Katzen verweilen hier allesamt und gehen ihren täglichen Aufgaben nach.\n\nBeim Vorbeischlendern höre ich zwei Fischer klagen: „… neue Haken bekamen wir auch. Aber mit neuen Netzen könnten wir so viel mehr anfangen …“. Sie verstummen, als sie mich bemerken."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nIch summe und nicke."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nIch summe und nicke, als sich eine streunende Katze an mein Bein kuschelt und heftig schnurrt."
 gdp_republic_patrician_decision.1030.a: "„Ich könnte überzeugt werden, neue Netze zu besorgen …“"
 gdp_republic_patrician_decision.1030.a.flavor: "Das könnte zu einem fetten Fang führen!"
 gdp_republic_patrician_decision.1030.b: "„Was muss ich zahlen, wenn ich Euren Fisch in großen Mengen abkaufe?“"
 gdp_republic_patrician_decision.1030.c: "Katze!"
 gdp_republic_patrician_decision.1030.d: "„Ein wunderbarerTag, nicht wahr?“"
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "Auf meinem gemütlichen Spaziergang gelange ich zu der neuesten Einrichtung von [liege_scope.GetTitledFirstName] auf dem Großen Platz: [ROOT.Char.Custom('GetGreatProjectDescription')].\n\nDer Vorarbeiter scheint allerdings etwas in der Klemme zu stecken, denn [local_character.Custom('DE_PRO_PER_S_3P_N')] blickt immer wieder auf ein Papier mit Namen und Siegeln, während [local_character.Custom('DE_PRO_PER_S_3P_N')] sich am Kopf kratzt: „Dieser … großzügige Beitrag … Dem Siegel fehlt ein Stück … Von wem mag es wohl stammen? Hm …“\n\nEin nicht gekennzeichneter Beitrag für das Vorhaben? #EMP Faszinierend.#!"
 gdp_republic_patrician_decision.1040.a: "„Mein Beitrag! Wir waren es!“"
 gdp_republic_patrician_decision.1040.a.success: "Ihr heimst die Anerkennung für den Beitrag ein"
 gdp_republic_patrician_decision.1040.a.failure: "Ihr fliegt auf"
 gdp_republic_patrician_decision.1040.b: "„Ein Beitrag von [liege_scope.GetTitledFirstNameNoTooltip]! Famos!“"
 gdp_republic_patrician_decision.1040.c: "Nun, das geht mich nichts an."
 gdp_republic_patrician_decision.1040.c.flavor: "Ich bin sicher, sie finden das heraus."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] erhält: [contribution_to_fund.GetName]"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: Fehlstart"
 gdp_republic_patrician_decision.1100.desc: "Ich klopfe noch einmal auf meine Börse, bevor ich mein Studierzimmer verlasse für einen kleinen Spaziergang durch die reizenden Straßen von [city_location.GetTitle.GetNameNoTier].\n\nEs gibt einen leisen #EMP Bums#!, als meine Stirn gegen die Tür stößt. Das verdammte Ding #EMP bewegt sich nicht#!! Dehnte es sich aus?\n\nIch blicke mich im Raum um und sehe ein Fenster, ja, doch durch den Sturz würde ich mir sicher einen oder zwei Knochen brechen.\n\nIch versuche, darüber nachzudenken."
 gdp_republic_patrician_decision.1100.a: "„H-hallo? Wachen? DIENER?!“"
 gdp_republic_patrician_decision.1100.a.flavor: "Nein, die Wände kommen nicht auf mich zu. Das tun sie doch nicht … oder?"
 gdp_republic_patrician_decision.1100.b: "Da ist genügend Weiches zum Abfangen unter dem Fenster!"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "Mein Leib sehnt sich nach einer Ertüchtigung!"
 gdp_republic_patrician_decision.1100.d: "Dann gehe ich einfach … zurück an meinen Schreibtisch."
