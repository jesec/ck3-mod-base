l_german:
 gdp_founded_republic_modifier: "Republikgründer"
 gdp_founded_republic_modifier_desc: "Dieser Charakter gründete eine Republik."
 gdp_fund_alms_decree_modifier: "Almosenverteilung"
 gdp_fund_alms_decree_modifier_desc: "Die Herrscher dieser Stadt erwiesen sich vor Kurzem als großzügig und verteilten Almosen an die Armen."
 gdp_taxed_county_modifier: "Bezahlte Kriegssteuer"
 gdp_taxed_county_modifier_desc: "Diese Gemeinde zahlte vor Kurzem erhebliche Steuern, um Kriegsbemühungen zu finanzieren."
 gdp_tax_holiday_decree_modifier: "Steuererleichterung"
 gdp_tax_holiday_decree_modifier_desc: "Die Stadtsteuern wurden per Erlass gesenkt, was bei den Bürgern auf Zustimmung stieß."
 gdp_trade_support_modifier: "Handelsunterstützung"
 gdp_trade_support_modifier_desc: "Dieser Charakter erhielt Handelsunterstützung von einer Republik zur Verbesserung von Handelsrouten."
 republic_reliable_caravans_modifier: "Verlässliche Karawanen"
 republic_reliable_caravans_modifier_desc: "Die Handelsrouten dieses Charakters werden durch besser organisierte Karawanen unterstützt."
 republic_premium_contracts_modifier: "Premiumverträge"
 republic_premium_contracts_modifier_desc: "Dieser Charakter sicherte sich vorteilhafte Verträge beim Verkauf von Waren."
 republic_inspector_bribery_modifier: "Inspektorenbestechung"
 republic_inspector_bribery_modifier_desc: "Die Marktinspektoren dieses Charakters wurden durch Bestechungen kompromittiert."
 gdp_glorification_modifier: "Verherrlicht"
 gdp_glorification_modifier_desc: "Dieser Herrscher wurde von seiner Stadt öffentlich verherrlicht. Sein Name und sein Bildnis wurden sowohl auf den Straßen als auch in den Versammlungshallen gefeiert.\n\n[voting_strength|E] in Sachen [GetLaw('republican_elective_succession_law').GetName]: +1"
 gdp_civic_labor_modifier: "Bürgerarbeit"
 gdp_civic_labor_modifier_desc: "Die Bürger des Hauptsitzes dieses Herrschers wurden dazu aufgerufen, ihre Arbeitskraft und ihr Fachwissen einzubringen, um die Kosten und die Bauzeit für den Wohnsitzbau zu senken."
 gdp_popular_mandate_modifier: "Volksunterstützung"
 gdp_popular_mandate_modifier_desc: "Dieser Herrscher vereinte die Bürger des Hauptsitzes hinter seiner andauernden Führung und verlieh damit seiner Stimme bei der nächsten Wahl zusätzliches Gewicht.\n\n#weak Dieser [modifier|E] bleibt für eine Wahl aktiv#!\n\n[voting_strength|E] in Sachen [GetLaw('republican_elective_succession_law').GetName]: #P +1#!"
 gdp_patrician_promoted_voter_modifier: "Geförderter Ruf"
 gdp_patrician_promoted_voter_modifier_desc: "Das Ansehen dieses Charakters in der Republik wurde durch einen erfolgreichen Werbefeldzug gestärkt.\n[voting_strength|E] in Sachen [GetLaw('republican_elective_succession_law').GetName]: #P +1#!"
 republic_procedural_advantage_modifier: "Ablaufvorteil"
 republic_procedural_advantage_modifier_desc: "Dieser Charakter bereitete die erforderlichen Abläufe und Formulare vor, um die Unterstützung bei der nächsten Abstimmung in der Versammlung zu verbessern."
 gdp_pledged_assembly_vote_modifier: "Versprochene Versammlungsstimmen"
 gdp_pledged_assembly_vote_modifier_desc: "[Concept('assembly', 'Versammlungs')|E]-Mitglieder versprachen diesem Charakter ihre Stimmen.\n$EFFECT_LIST_BULLET$#V Sie werden in der nächsten [voting_session|E] wie dieser Charakter abstimmen#!"
 gdp_bawdy_song_modifier: "Unzüchtiges Lied"
 gdp_bawdy_song_modifier_desc: "Dieser Charakter wurde von einem unzüchtigen Liedtext inspiriert."
 gdp_patriotic_song_modifier: "Patria-Lied"
 gdp_patriotic_song_modifier_desc: "Dieser Charakter wurde von einem Liedtext über die Liebe zur [Glossary('#bold Patria#!', 'carnival_patria_GLOSS')] inspiriert."
 gdp_spiritual_song_modifier: "Geistliches Lied"
 gdp_spiritual_song_modifier_desc: "Dieser Charakter wurde von einem geistlichen Liedtext inspiriert."
 gdp_rejected_dancefloor_modifier: "Abgelehnter Tanz"
 gdp_rejected_dancefloor_modifier_desc: "Dieser Charakter wurde von einem möglichen Tanzpartner abgelehnt."
 gdp_accepted_dancefloor_modifier: "Angenommener Tanz"
 gdp_accepted_dancefloor_modifier_desc: "Dieser Charakter bat um einen Tanz, der auch angenommen wurde."
 gdp_exquisite_mask_modifier: "Erlesene Maske"
 gdp_exquisite_mask_modifier_desc: "Dieser Charakter trug eine erlesene Maske während eines Karnevals."
 gdp_terrifying_mask_modifier: "Erschreckende Maske"
 gdp_terrifying_mask_modifier_desc: "Dieser Charakter trug eine erschreckende Maske während eines Karnevals."
 gdp_slanderous_grafitti_modifier: "Verleumderische Wandschmiererei"
 gdp_slanderous_grafitti_modifier_desc: "Die Familie dieses Charakters wurde in Schmierereien in den Gassen der Stadt geschmäht."
 gdp_domestic_chaos_modifier: "Heimisches Chaos"
 gdp_domestic_chaos_modifier_desc: "Der Wohnsitz dieses Charakters wurde auf den Kopf gestellt."
 gdp_fragrant_egg_modifier: "Duftender Eierspritzer"
 gdp_fragrant_egg_modifier_desc: "Dieser Charakter wurde durch eine geworfene Eierschale mit duftendem Parfum bespritzt."
 gdp_sympathetic_ear_scheme_modifier: "Ein mitfühlendes Ohr"
 gdp_sympathetic_ear_scheme_modifier_desc: "Dieser Charakter hat jemanden, der ein offenes Ohr bezüglich des Komplotts am eigenen Hof hat."
 gdp_insane_arguments_modifier: "Wahnsinnige Argumente"
 gdp_insane_arguments_modifier_desc: "Diesem Charakter wurden wahnsinnige Argumente vorgetragen."
 gdp_fatalistic_arguments_modifier: "Fatalistische Argumente"
 gdp_fatalistic_arguments_modifier_desc: "Diesem Charakter wurden fatalistische Argumente vorgetragen."
 gdp_beautiful_arguments_modifier: "Wunderschönes Argument"
 gdp_beautiful_arguments_modifier_desc: "Dieser Charakter wurde von einer wunderschönen Person beraten."
 gdp_ugly_arguments_modifier: "Hässliches Argument"
 gdp_ugly_arguments_modifier_desc: "Dieser Charakter wurde von einer hässlichen Person beraten."
 gdp_intellectual_debate_modifier: "Intellektuelle Debatte"
 gdp_intellectual_debate_modifier_desc: "Ein geübter Debattierer trug diesem Charakter Argumente vor."
 gdp_advise_of_a_fool_modifier: "Narrenrat"
 gdp_advise_of_a_fool_modifier_desc: "Jemand Närrisches trug diesem Charakter Argumente vor."
 gdp_a_way_with_words_modifier: "Geschickt mit Worten"
 gdp_a_way_with_words_modifier_desc: "Jemand Kultiviertes trug diesem Charakter Argumente vor."
 gdp_sympathetic_ear_scheme_modifier_tt: "Euer [scheme|E] erhält: [GetModifier('gdp_sympathetic_ear_scheme_modifier').GetNameWithTooltip]."
 gdp_business_sabotage_modifier: "Geschäftssabotage"
 gdp_business_sabotage_modifier_desc: "Dieser Charakter wurde von einem Mitbewerber sabotiert."
 gdp_arson_modifier: "Mysteriöses Feuer"
 gdp_arson_modifier_desc: "Das Haus dieses Charakters wurde von unbekannten Angreifern in Brand gesteckt."
 gdp_hardened_position_modifier: "Verfestigte Haltung"
 gdp_hardened_position_modifier_desc: "Dieser Charakter verfestigte seine Haltung als Antwort auf Einschüchterungsversuche."
 gdp_intimidated_modifier: "Eingeschüchtert"
 gdp_intimidated_modifier_desc: "Dieser Charakter wurde eingeschüchtert."
 gdp_trentina_quarantine_county_modifier: "Schiffsquarantäne"
 gdp_trentina_quarantine_county_modifier_desc: "Eine Schiffsquarantäne wurde an diesem Ort eingeführt, um die Verbreitung von Krankheiten einzudämmen."
 gdp_trentina_quarantine_character_modifier: "Schiffsquarantäne"
 gdp_trentina_quarantine_character_modifier_desc: "Die Geschäfte dieses Charakters wurden durch eine Schiffsquarantäne gestört."
 gdp_curfew_character_modifier: "Nächtliche Ausgangssperre"
 gdp_curfew_character_modifier_desc: "Dieser Charakter unterliegt einer nächtlichen Ausgangssperre, deren Einhaltung ihm und anderen Ärger erspart."
 gdp_state_protection_modifier: "Staatlicher Schutz"
 gdp_state_protection_modifier_desc: "Dieser Charakter steht unter dem Schutz der Versammlung."
 gdp_republic_grieving_parent_modifier: "Trauer"
 gdp_republic_grieving_parent_modifier_desc: "Dieser Charakter verlor einen Erben an die Gewalt des Pöbels. Dies belastet ihn nach wie vor."
 gdp_exposed_spy_modifier: "Unerlaubter Spion"
 gdp_exposed_spy_modifier_desc: "Dieser Charakter wurde als Spion für jemand anderes enttarnt."
 gdp_dodging_council_modifier: "Gemiedener Ratsdienst"
 gdp_dodging_council_modifier_desc: "Dieser Charakter fand einen Weg, sich vor seinem Ratsdienst zu drücken, sodass mehr Zeit für andere Dinge bleiben."
 gdp_exemption_from_council_modifier: "Ausgenommen vom Ratsdienst"
 gdp_exemption_from_council_modifier_desc: "Dieser Charakter wurde vom Ratsdienst ausgenommen, um sich auf eigene Geschäftsinteressen zu konzentrieren."
 gdp_wedded_to_the_sea_modifier: "Vermählt mit dem Meer"
 gdp_wedded_to_the_sea_modifier_desc: "Dieser Charakter schwor vor der ganzen Republik dem Meer die Treue."
 gdp_learning_from_the_masses: "Von der breiten Masse lernen"
 gdp_learning_from_the_masses_desc: "Dieser Charakter lernt sein Handwerk am liebsten durch das Beobachten ganz gewöhnlicher Leute."
 gdp_cooperation_correspondenti_house_modifier: "Correspondenti"
 gdp_cooperation_correspondenti_house_modifier_desc: "Durch die Zusammenarbeit mit einem anderen Handelshaus erweiterte dieses Haus die Kapazitäten seines Handelsnetzes."
 gdp_cooperation_compagnia_house_modifier: "Compagnia"
 gdp_cooperation_compagnia_house_modifier_desc: "Um Ressourcen und Fachwissen gemeinsam zu nutzen, ging dieses Haus eine Kooperation mit einem anderen Handelshaus ein."
 gdp_guild_sponsor_house_modifier: "Handwerkszunft-Förderung"
 gdp_guild_sponsor_house_modifier_desc: "Dieses Haus unterstützte die Gründung einer neuen Handwerkszunft in der Versammlung und wurde damit deren Gönner."
 gdp_ancient_craft_house_modifier: "Uraltes Handwerk"
 gdp_ancient_craft_carpentry_supplies_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_books_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_incense_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_base_metals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_alcohol_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_comforts_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_meat_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_cereals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_consumption_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_jewelry_materials_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_items_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_republic_disgraced_patrician_house_modifier: "Entehrte Patrizier"
 gdp_republic_disgraced_patrician_house_modifier_desc: "Dieses Haus führte eine Republik in den Untergang und wurde schandvoll ausgestoßen. Sein Name hat wenig Gewicht auf den Märkten und kaum jemand spricht gut von ihm."
 gdp_republic_unrest_guild_district_shutdown: "Zunftbezirk: Geschlossen"
 gdp_republic_unrest_guild_district_shutdown_desc: "Die Handwerkerzünfte haben ihre Türen geschlossen. In den Werkstätten herrscht Stillstand."
 gdp_republic_unrest_market_district_shutdown: "Marktbezirk: Geschlossen"
 gdp_republic_unrest_market_district_shutdown_desc: "Der Marktbezirk ist verrammelt und leer. Handel und Geschäfte in der Stadt geraten ins Stocken."
 gdp_republic_unrest_port_district_shutdown: "Hafenbezirk: Geschlossen"
 gdp_republic_unrest_port_district_shutdown_desc: "Der Hafen wurde von der Obrigkeit der Stadt geschlossen. Maritime Einnahmen sind versiegt."
 gdp_republic_unrest_bureaucratic_district_shutdown: "Bürokratiebezirk: Geschlossen"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "Im Verwaltungsbezirk herrscht Schweigen. Beamteneinnahmen werden nicht erhoben."
 gdp_republic_unrest_temple_district_shutdown: "Religiöser Enklavenbezirk: Geschlossen"
 gdp_republic_unrest_temple_district_shutdown_desc: "Die Glaubensenklave arbeitet nicht mehr mit: Fromme Spenden fließen nicht länger in die Schatzkammer."
 gdp_republic_unrest_entertainment_district_shutdown: "Unterhaltungsbezirk: Geschlossen"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "Das Unterhaltungsviertel liegt leer und dunkel dar. Die Stadteinnahmen leiden."
 gdp_republic_unrest_urban_housing_district_shutdown: "Wohnungsbezirk: Geschlossen"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "Das ganze Wohnviertel hat sich abgeschottet. Die Stadtsteuereinnahmen sind eingebrochen."
 gdp_republic_riot_aftermath: "Nachgang der Unruhen"
 gdp_republic_riot_aftermath_desc: "Straßen brannten, Getreidespeicher wurden geplündert und das Geflecht der Gesellschaft zerrissen. Die Erholung wird lange brauchen."
 gdp_republic_uprising_aftermath: "Nachgang der Erhebung"
 gdp_republic_uprising_aftermath_desc: "Das Volk randalierte in der Stadt. Die Ordnung wird noch auf sich warten lassen."
 gdp_sponsored_guild_modifier: "Geförderte Handwerkszunft"
 gdp_sponsored_guild_modifier_desc: "Den Handwerkern wurde gestattet, eine neue Zunft zu gründen. Ein wohlhabender Gönner unterstützt sie dabei."
 gdp_secret_information_house_modifier: "Diplomatische Geheimnisse"
 gdp_secret_information_house_modifier_desc: "Dieses Haus kommmmt in den Genuss von Einblicken in geheime diplomatische Verhandlungen seiner Republik."
 gdp_ambitions_aligned_house_modifier: "Hausbestrebung angeglichen"
 gdp_ambitions_aligned_house_modifier_desc: "Dieses Haus glich seine Interessen mit den anderen Häuser derselben Bestrebung in der Republik ab."
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "Der Ruf dieses Hauses wurde durch eine Flut reißerischer Verleumdungen in den Schmutz gezogen.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_patrician_slander_rating_penalty_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]-Unterstützungswert von [house|E]-Mitgliedern: [EmptyScope.ScriptValue('republic_slander_election_value')|0=+]"
 gdp_patrician_promoted_house_modifier: "Geförderter Ruf"
 gdp_patrician_promoted_house_modifier_desc: "Das Ansehen dieses Hauses in der Republik wurde durch einen erfolgreichen Werbefeldzug gemehrt.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_patrician_promote_rating_bonus_value')|0=+]"
 gdp_secured_republic_monopoly_modifier: "Gesichertes Republikmonopol"
 gdp_secured_republic_monopoly_modifier_desc: "Dieser Charakter sicherte sich ein Monopol für seine Republik.\n[patrician_rating|E]: [EmptyScope.ScriptValue('secured_republic_monopoly_rating_bonus_value')|0=+]"
 gdp_head_held_high_modifier: "Das Haupt hoch erhoben"
 gdp_head_held_high_modifier_desc: "Dieser Charakter lässt sich trotz aller Spottkommentare nicht unterkriegen."
 gdp_training_for_the_worst_modifier: "Vorbereitung auf den schlimmsten Fall"
 gdp_training_for_the_worst_modifier_desc: "Dieser Charakter beschloss, sich in den Kampfkünsten zu üben, für den Fall, dass das Schlimmste eintritt."
 gdp_fear_of_the_mob_modifier: "Angst vor der Meute"
 gdp_fear_of_the_mob_modifier_desc: "Dieser Charakter lebt in ständiger Angst vor der launischen Bevölkerung."
 gdp_champion_of_the_people_modifier: "Vorkämpfer des Volks"
 gdp_champion_of_the_people_modifier_desc: "Dieser Charakter rief sich selbst zum Verfechter des einfachen Volkes aus."
 gdp_champion_of_the_state_modifier: "Vorkämpfer der Regierung"
 gdp_champion_of_the_state_modifier_desc: "Dieser Charakter rief sich selbst zum Verfechter der herrschenden Regierung aus."
 gdp_guild_sponsored_feast_modifier: "Zunftfinanziertes Festmahl"
 gdp_guild_sponsored_feast_modifier_desc: "Diesem Charakter wurde von den Zünften in seiner Stadt ein kostenloses Festmahl angeboten."
 gdp_broken_trust_modifier: "Missbrauchtes Vertrauen"
 gdp_broken_trust_modifier_desc: "Dieser Charakter nutzte den guten Willen des Volks zu seinem eigenen Vorteil aus."
 gdp_toast_to_adventure_modifier: "Sehnsucht nach Abenteuern"
 gdp_toast_to_adventure_modifier_desc: "Dieser Charakter sehnt sich nach Abenteuern in fernen Ländern."
 gdp_toast_to_romance_modifier: "Sehnsucht nach Romantik"
 gdp_toast_to_romance_modifier_desc: "Dieser Charakter sehnt sich nach Liebe und Romantik."
 gdp_toast_to_glory_modifier: "Sehnsucht nach Ruhm"
 gdp_toast_to_glory_modifier_desc: "Dieser Charakter sehnt sich nach Ruhm."
 gdp_toast_to_relations_modifier: "Sehnsucht nach Freundschaft"
 gdp_toast_to_relations_modifier_desc: "Dieser Charakter sehnt sich nach Freundschaft und Familie.\nEntsperrt die [interaction|E]: $befriend_interaction$"
 gdp_republic_bureaucrat_modifier: "Republik-Bürokrat"
 gdp_republic_bureaucrat_modifier_desc: "Dieser Charakter bewies kürzlich im Gesetzgebungsverfahren großes Geschick und erledigte den Papierkram äußerst effizient.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\nZustimmung der [assembly|E] während [voting_sessions|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "Gesetzgeber"
 gdp_republic_law_maker_modifier_desc: "Dieser Charakter sicherte sich kürzlich durch geschicktes Taktieren – oder indem er genügend Beziehungen spielen ließ – die Zustimmung der Versammlung zu dem Gesetzesvorschlag.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "Einflussreiche Handelsposten"
 gdp_dominate_market_trade_post_modifier_desc: "Dieser Markt wird stark von den Handelsposten eines Patriziers beeinflusst."
 gdp_trade_post_charity_modifier: "Gezeigte Mildtätigkeit"
 gdp_trade_post_charity_modifier_desc: "Dieser Charakter zeigte sich mildtätig gegenüber dem einfachen Volk, um Kranken, Armen und Bedürftigen zu helfen."
 gdp_gather_popular_support_modifier: "Beliebt bei der Bevölkerung"
 gdp_gather_popular_support_modifier_desc: "Dieser Charakter gewann die Unterstützung der Stadtbewohner, machte sich einen Namen und verschaffte sich Gehör."
 gdp_gather_popular_support_house_t3_modifier: "Eine ganz besondere Familie des Volkes"
 gdp_gather_popular_support_house_t3_modifier_desc: "Dieses Haus genießt eine außergewöhnliche Unterstützung durch die Bewohner der Stadt.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]-Unterstützungswert der [house|E]-Mitglieder: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "Starke Familie des Volkes"
 gdp_gather_popular_support_house_t2_modifier_desc: "Dieses Haus genießt eine starke Unterstützung durch die Bewohner der Stadt.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]-Unterstützungswert der [house|E]-Mitglieder: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "Familie des Volks"
 gdp_gather_popular_support_house_t1_modifier_desc: "Dieses Haus genießt Unterstützung durch die Bewohner der Stadt.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]-Unterstützungswert der [house|E]-Mitglieder: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "Despotischer Bürgermeister"
 gdp_signorial_execute_and_banish_modifier_desc: "Dieser Charakter hat Bürger der Republik hingerichtet und verbannt und hegt den Ehrgeiz, noch mehr zu tun."
 gdp_ambition_promote_scheme_bonus_modifier: "Geförderte Patrizier"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "Dieser Charakter investierte Zeit und Mühe, um den Ruf eines anderen Patriziers zu verbessern, und verdiente sich dafür Wohlwollen.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (Die Wertung ist nicht kumulierbar)#!"
 gdp_noble_magistrate_modifier: "Amt des edlen Magistrats"
 gdp_noble_magistrate_modifier_desc: "Diesem Charakter wurde ein kleines Adelsamt übertragen, damit er der Republik in seiner offiziellen Funktion mit Integrität und Ehre dienen kann."
 gdp_republic_plaza_prestige_modifier: "Prestigeträchtiger Platz"
 gdp_republic_plaza_prestige_modifier_desc: "Dieser Charakter leistete einen Beitrag zum Großen Platz und sicherte sich damit Prestige und die Gunst der Öffentlichkeit."
 gdp_republic_trader_competitiveness_modifier: "Standfester Händler"
 gdp_republic_trader_competitiveness_modifier_desc: "Dieser Charakter ist ein eiskalter Händler, der sich nicht einschüchtern lässt – stattdessen bringt er die Gegenseite zum Einknicken."
 gdp_republic_plaza_chancery_modifier: "Kanzleiholz"
 gdp_republic_plaza_chancery_modifier_desc: "Dieser Charakter richtete das Archiv ein, was ihn mit Schreinern, Druckmaschinen und reichlich abgelagertem Holz hinterließ, und den Überschuss nutzt er nun zu Hause."
 gdp_republic_plaza_scriptorium_modifier: "Gut sortiertes Skriptorium"
 gdp_republic_plaza_scriptorium_modifier_desc: "Dieser Charakter besitzt eine ganze Menge hochwertiger Tinten und Pigmente, da er die Schreiber der Kommune damit belieferte."
 gdp_republic_plaza_magistracy_modifier: "Amtsroben"
 gdp_republic_plaza_magistracy_modifier_desc: "Dieser Charakter kleidete die Magistrate der Stadt auf eigene Kosten ein und wird überall, wo Recht gesprochen wird, entsprechend verehrt."
 gdp_republic_plaza_popular_favor_modifier: "Beliebte Galionsfigur"
 gdp_republic_plaza_popular_favor_modifier_desc: "Dieser Charakter ist ein Meister darin, die Menge auf seine Seite zu ziehen, und sorgt dafür, dass jeder genau weiß, wessen Geld für die Annehmlichkeiten bezahlt hat."
 gdp_republic_plaza_trade_capacity_modifier: "Gemessen und versiegelt"
 gdp_republic_plaza_trade_capacity_modifier_desc: "Die Waren dieses Charakters werden ohne Einwände abgewogen, und mit jeder Jahreszeit wechseln größere Mengen den Besitzer."
 gdp_republic_plaza_expertise_modifier: "Händler auf dem Platz"
 gdp_republic_plaza_expertise_modifier_desc: "Dieser Charakter hat großen Einfluss auf viele Kaufleute der Stadt und gewinnt so Einblicke in Waren und Handel, deren Erlangung sonst Jahrzehnte dauern würde."
 gdp_republic_plaza_estate_income_modifier: "Öffentlicher Geldgeber"
 gdp_republic_plaza_estate_income_modifier_desc: "Die Kommune schuldet diesem Charakter Geld, und die Zinsen kommen pünktlich in seiner Buchhaltung an."
 gdp_republic_plaza_physician_modifier: "Arztgunst"
 gdp_republic_plaza_physician_modifier_desc: "Dieser Charakter sorgte dafür, dass die Stadtbezirke mit Kräutern und Heilmitteln versorgt wurden und dass es in seinem eigenen Haushalt nie daran mangelt."
 gdp_republic_plaza_hired_swords_modifier: "Zahlmeister der Gesellschaften"
 gdp_republic_plaza_hired_swords_modifier_desc: "Dieser Charakter sorgt dafür, dass beauftragte Gesellschaften pünktlich und vollständig bezahlt werden – und dass sie sich daran erinnern, aus welcher Kasse das Geld kam."
 gdp_republic_plaza_organized_worker_modifier: "Arbeitskräfte-Organisator"
 gdp_republic_plaza_organized_worker_modifier_desc: "Dieser Charakter organisierte die Arbeitskräfte für Großbauvorhaben und lernte eine Menge über die umfassende Logistik, die dazu gehört."
 gdp_republic_civic_works_labor_modifier: "Organisierte Arbeit"
 gdp_republic_civic_works_labor_modifier_desc: "Die Arbeiter wurden von der Republik mobilisiert und organisiert, wodurch sich der Bau im ganzen Hauptsitz beschleunigte."
 gdp_republic_civic_works_materials_modifier: "Beschafftes Material"
 gdp_republic_civic_works_materials_modifier_desc: "Dank einer koordinierten Maßnahme zur Beschaffung und Bevorratung von Baumaterialien konnten die Baukosten im gesamten Hauptsitz gesenkt werden."
 gdp_republic_civic_works_amenities_modifier: "Öffentliche Annehmlichkeiten"
 gdp_republic_civic_works_amenities_modifier_desc: "Neue Bäder, Springbrunnen und Versammlungsorte hoben die Stimmung der Stadtbewohner."
 gdp_republic_civic_works_market_modifier: "Erweiterter Markt"
 gdp_republic_civic_works_market_modifier_desc: "Ein größerer und besser organisierter Marktbezirk zog mehr Händler an und verbesserte die Handelsbedingungen im Hauptsitz."
 gdp_republic_civic_works_guilds_modifier: "Finanzierte Handwerkszünfte"
 gdp_republic_civic_works_guilds_modifier_desc: "Durch finanzierte Zünfte wurden erfahrene Handwerker in den Hauptsitz geholt. Dies kurbelte Investitionen an und verbesserte die Lebensbedingungen dort stetig."
 gdp_republic_civic_works_labor_character_modifier: "Arbeitsnetzwerk"
 gdp_republic_civic_works_labor_character_modifier_desc: "Durch die Organisation der Arbeitskräfte für öffentliche Bauvorhaben knüpfte dieser Herrscher Kontakte zu Facharbeitern und Vertragsgebern im gesamten Hauptsitz.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "Versorgungsnetzwerk"
 gdp_republic_civic_works_materials_character_modifier_desc: "Die Beschaffung von Materialien für die Bürgerarbeiten erschloss zuverlässige Bezugsquellen für Stein, Holz und andere Baumaterialien zu günstigen Preisen.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "Bürgerlicher Gönner"
 gdp_republic_civic_works_amenities_character_modifier_desc: "Mit der Finanzierung öffentlicher Einrichtungen der Stadt machte sich dieser Herrscher bei den Einwohnern des Hauptsitzes sichtlich beliebt.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_market_character_modifier: "Marktverbindungen"
 gdp_republic_civic_works_market_character_modifier_desc: "Durch den Ausbau des Marktviertels des Hauptsitzes kam dieser Herrscher mit Kaufleuten und Händlern in Kontakt, die sich an diese Geste erinnern.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "Zunftgönner"
 gdp_republic_civic_works_guilds_character_modifier_desc: "Durch die Unterstützung der Handwerkszünfte wurden dauerhafte Bindungen zu den Handwerkern der Stadt geknüpft. Deren Dankbarkeit spiegelt sich zuträglich im Ansehen dieses Herrschers wider.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_settlement_modifier: "Siedlungserweiterung"
 gdp_republic_civic_works_settlement_modifier_desc: "Der Hauptsitz investierte in seine Infrastruktur und schuf so Platz für mehr Menschen. Diese kommen nun in die Stadt."
 gdp_republic_civic_works_settlement_character_modifier: "Stadtinvestor"
 gdp_republic_civic_works_settlement_character_modifier_desc: "Durch die Finanzierung des Ausbaus des Hauptsitzes der Republik gewann dieser Herrscher Einfluss darauf, wie sich die Stadt entwickelt.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_order_modifier: "Zivile Ordnung"
 gdp_republic_civic_works_order_modifier_desc: "Die Investitionen in Wachpersonal und die städtische Infrastruktur trugen dazu bei, dass der Hauptsitz nun geordneter ist und sich leichter verwalten lässt."
 gdp_republic_civic_works_order_character_modifier: "Bürger-Autorität"
 gdp_republic_civic_works_order_character_modifier_desc: "Durch die Förderung der öffentlichen Ordnung des Hauptsitzes erarbeitete sich dieser Herrscher den Ruf, für Stabilität und eine solide Regierungsführung zu sorgen.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
 gdp_republic_civic_works_school_modifier: "Öffentliche Schulen"
 gdp_republic_civic_works_school_modifier_desc: "Diese Gemeinde erhielt beträchtliche Mittel für den Bau öffentlicher Schulen."
 gdp_republic_civic_works_school_character_modifier: "Schulgönner"
 gdp_republic_civic_works_school_character_modifier_desc: "Dieser Charakter finanzierte den Bau von Schulen im Hauptsitz und stellte damit der Jugend Bildung und Lernmöglichkeiten zur Verfügung.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_civic_works_patrician_rating_bonus_value')|0=+]"
