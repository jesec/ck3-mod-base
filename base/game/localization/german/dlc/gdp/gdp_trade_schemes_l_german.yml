 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$: Erfolg"
 gdp_trade_scheme.0012.desc_capacity: "Eine Route ([disrupted_trade_route.GetName]) wird feststellen, dass ihr der Platz fehlt, um alle Waren zu transportieren, die sie einst beförderte. Lasst [target.GetShortUIName] sich nur wundern, warum [target.Custom('DE_PRO_POS_S_3P')]e Bücher nicht mehr stimmen."
 gdp_trade_scheme.0012.desc_competitiveness: "Eine Route ([disrupted_trade_route.GetName]) genießt nicht mehr die Vorzüge und Privilegien, die ihr einst auf den Märkten zuteilwurden. Lasst [target.GetShortUIName] spüren, wie schwer es mittlerweile ist, Geld zu verdienen."
 gdp_trade_scheme.0012.desc_discovered: "\n\nAllerdings wurde einer meiner Männer gefunden, was den Verdacht auf mich lenken könnte."
 gdp_trade_scheme.0012.a: "Viel Glück für [Select_CString(target.IsFemale, 'die Närrin', 'den Narren')]."
 gdp_trade_scheme.0012.a_discovered: "Das ist es wert."
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$: Fehlschlag"
 gdp_trade_scheme.0013.desc: "Trotz unserer größten Bemühungen ergeht es [target.GetShortUIName] und [target.Custom('DE_PRO_POS_S_3P')]en Handelsrouten nach wie vor genauso gut wie bisher."
 gdp_trade_scheme.0013.desc_discovered: "\n\nEiner meiner Händler wurde dabei beobachtet, wie er versuchte, die Angelegenheit zu regeln. Das ist eine Schande für den Ruf meines Hauses."
 gdp_trade_scheme.0013.a: "Ärgerlich."
 gdp_destroyed_republic_opinion: "Vernichtete meine Republik"
 gdp_smuggler_opinion: "Schmuggler"
