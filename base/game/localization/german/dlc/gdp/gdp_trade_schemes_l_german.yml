l_german:
 gdp_improve_trade_capacity: "Handelskapazitätsverbesserung"
 gdp_improve_trade_capacity_action: "Handelskapazität verbessern"
 gdp_improve_trade_capacity_desc: "Ich beauftragte meine Leute damit, Möglichkeiten auszuarbeiten, wie sich die Kapazität meiner Handelsrouten erhöhen lässt."
 gdp_improve_trade_capacity_desc_general: "$gdp_improve_trade_capacity$ ist ein [trade_scheme|E], in dem ein [merchant|E] oder [patrician|E] den eigenen Haushalt einsetzt, um die [trade_route_capacity|E] einer seiner eigenen [trade_routes|E] zu verbessern."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "Die ausgewählte [trade_route|E] erhält für #V 15 Jahre#! eine verbesserte Kapazität"
 gdp_improve_trade_capacity_invalidated_title: "@scheme_icon! $gdp_improve_trade_capacity$s-Komplott endet"
 gdp_improve_trade_competitiveness: "Handelswettbewerbsfähigkeitsverbesserung"
 gdp_improve_trade_competitiveness_action: "Handelswettbewerbsfähigkeit verbessern"
 gdp_improve_trade_competitiveness_desc: "Ich beauftragte meine Leute damit, Wege zu finden, wie meine Routen gegenüber denen der Konkurrenz den Vorzug erhalten."
 gdp_improve_trade_competitiveness_desc_general: "$gdp_improve_trade_competitiveness$ ist ein [trade_scheme|E], in dem ein [merchant|E] oder [patrician|E] den eigenen Haushalt einsetzt, um die [trade_competitiveness|E] einer seiner eigenen [trade_routes|E] zu verbessern."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "Die ausgewählte [trade_route|E] erhält für #V 15 Jahre#! eine verbesserte [competitiveness|E]"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! $gdp_improve_trade_competitiveness$s-Komplott endet"
 gdp_improve_trade_expertise: "Handels-Expertise-Verbesserung"
 gdp_improve_trade_expertise_action: "Handels-Expertise verbessern"
 gdp_improve_trade_expertise_desc: "Ich beauftragte meine Leute damit, Wege zu finden, wie wir unsere Effizienz auf unseren Routen steigern können, um sicherzustellen, dass wir alle richtigen Ansprechpartner kennen und aus unseren Fehlern lernen."
 gdp_improve_trade_expertise_desc_general: "$gdp_improve_trade_expertise$ ist ein [trade_scheme|E], in dem ein [merchant|E] oder [patrician|E] den eigenen Haushalt einsetzt, um die Geschwindigkeit zu erhöhen, mit der eine seiner eigenen [trade_routes|E] [trade_expertise|E] gewinnt."
 GDP_IMPROVE_TRADE_EXPERTISE_SUCCESS_DESC: "Die ausgewählte [trade_route|E] erhält für #V 15 Jahre#! schneller [expertise|E]"
 gdp_improve_trade_expertise_invalidated_title: "@scheme_icon! $gdp_improve_trade_expertise$s-Komplott endet"
 GDP_IMPROVE_TRADE_ROUTES_STAFFED_ROUTES_DESC: "[trade_routes|E] mit einem [trader|E]: $VALUE|+=0$"
 GDP_IMPROVE_TRADE_ROUTES_ESTABLISHED_ROUTES_DESC: "Traditionsreiche [trade_routes|E] mit einem [trader|E]: $VALUE|+=0$"
 gdp_improve_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName|U] betreibt [owner.Custom('DE_PRO_POS_S_3P')]e [trade_routes|E] nicht mehr selbst"
 gdp_improve_trade_routes_owner_has_no_routes: "[owner.GetShortUIName|U] verfügt über keine weitere [trade_route|E], die sich noch verbessern ließe"
 gdp_improve_trade_routes_needs_route_tt: "Ihr besitzt mindestens eine [trade_route|E]"
 gdp_improve_trade_routes_focused_route_gone: "Die [trade_route|E], für die [owner.GetShortUIName] sich entschied, existiert nicht mehr"
 gdp_improve_trade_capacity_decision_success_tt: "Wenn das [scheme|E] erfolgreich ist, erhält [selected_item.GetName] für #V 15 Jahre#! den Modifikator: [GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip]"
 gdp_improve_trade_competitiveness_decision_success_tt: "Wenn das [scheme|E] erfolgreich ist, erhält [selected_item.GetName] für #V 15 Jahre#! den Modifikator: [GetModifier('gdp_improve_trade_routes_competitiveness_modifier').GetNameWithTooltip]"
 gdp_improve_trade_expertise_decision_success_tt: "Wenn das [scheme|E] erfolgreich ist, erhält [selected_item.GetName] für #V 15 Jahre#! den Modifikator: [GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip]"
 gdp_improve_trade_routes_capacity_modifier: "Verbesserte Logistik"
 gdp_improve_trade_routes_competitiveness_modifier: "Verwurzelte Interessen"
 gdp_improve_trade_routes_expertise_modifier: "Erprobter Händler"
 gdp_improve_trade_capacity_decision: "Handelskomplott: Kapazität"
 gdp_improve_trade_capacity_decision_desc: "Ich weiß, dass wir manche Waren zurücklassen müssen, weil unsere Händler nicht über genügend Platz zum Transport verfügen. Doch mit einigen Investitionen und Anpassungen wird es nur eine Frage der Zeit sein, bis wir unsere Präsenz auf allen von uns besuchten Märkten ausbauen können."
 gdp_improve_trade_capacity_decision_tooltip: "Beginnt das [scheme|E] [GetScheme('gdp_improve_trade_capacity').GetTypeName] auf einer [trade_route|E] Eurer Wahl"
 gdp_improve_trade_capacity_decision_confirm: "Findet Platz und Arbeitskräfte."
 gdp_improve_trade_capacity_decision_effect_tt: "Beginnt das [scheme|E] [GetScheme('gdp_improve_trade_capacity').GetTypeName] mit dem Schwerpunkt auf: [selected_item.GetName]"
 gdp_improve_trade_competitiveness_decision: "Handelskomplott: Wettbewerbsfähigkeit"
 gdp_improve_trade_competitiveness_decision_desc: "Auf einigen der Märkte, die meine Händler regelmäßig besuchen, herrscht ein harter Wettbewerb. Wenn ich einige Münzen in die richtigen Hände gebe und kleine Geschäfte mit den Einheimischen abschließe, werden meine Händler gegenüber der Konkurrenz bevorzugt behandelt."
 gdp_improve_trade_competitiveness_decision_tooltip: "Beginnt das [scheme|E] [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] auf einer [trade_route|E] Eurer Wahl"
 gdp_improve_trade_competitiveness_decision_confirm: "Sorgt dafür, dass wir besser empfangen werden."
 gdp_improve_trade_competitiveness_decision_effect_tt: "Beginnt das [scheme|E] [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] mit dem Schwerpunkt auf: [selected_item.GetName]"
 gdp_improve_trade_expertise_decision: "Handelskomplott: Expertise"
 gdp_improve_trade_expertise_decision_desc: "Meine Händler berichten mir, dass wir auf einigen unserer Handelsrouten immer wieder die gleichen Fehler begehen. Es wird Zeit, dass wir aus unseren Erfahrungen lernen und dafür sorgen, dass unsere Routen so effizient wie möglich bedient werden."
 gdp_improve_trade_expertise_decision_tooltip: "Beginnt das [scheme|E] [GetScheme('gdp_improve_trade_expertise').GetTypeName] auf einer [trade_route|E] Eurer Wahl"
 gdp_improve_trade_expertise_decision_confirm: "Legt es auf eine Route fest."
 gdp_improve_trade_expertise_decision_effect_tt: "Beginnt das [scheme|E] [GetScheme('gdp_improve_trade_expertise').GetTypeName] mit dem Schwerpunkt auf: [selected_item.GetName]"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$: Erfolg"
 gdp_trade_scheme.0002.desc: "Auf der Route ([improved_trade_route.GetName]) läuft es nun endlich so, wie es von Anfang an vorgesehen war. Meine Händler teilten mir mit, dass wir nun mehr Waren einführen als erhofft."
 gdp_trade_scheme.0002.a: "Das war jede Münze wert, die es mich kostete."
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 gdp_trade_scheme.0003.desc: "Trotz aller Bemühungen läuft es auf der Handelsroute weiter wie bisher. Das ist ärgerlich, doch so ist der Markt eben manchmal."
 gdp_trade_scheme.0003.a: "Zurück an die Hauptbücher."
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: Erfolg"
 gdp_trade_scheme.0004.desc: "Die Route ([improved_trade_route.GetName]) bringt endlich den erhofften Gewinn ein. Meine Händler werden gegenüber der Konkurrenz bevorzugt behandelt und wir erzielen höhere Gewinne als zuvor."
 gdp_trade_scheme.0004.a: "Die Gefälligkeiten waren gut angelegt."
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$: Erfolg"
 gdp_trade_scheme.0005.desc: "Auf der Route ([improved_trade_route.GetName]) läuft es nun effizienter denn je zuvor, und wir begehen weniger Fehler. Diese Erkenntnisse werden die Grundsteine für den künftigen Erfolg meines Hauses bilden."
 gdp_trade_scheme.0005.a: "Und ich werde weiter daran arbeiten."
 gdp_disrupt_trade_routes: "Handelsroutenstörung"
 gdp_disrupt_trade_routes_action: "Handelsrouten stören von"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName|U] betreibt Handel auf meinen Märkten. Ein paar bestochene Diener und das rechte Gerücht genügen, um eine [SCHEME.GetTargetCharacter.Custom('DE_PRO_POS_S_3P')]er [trade_routes|E] zu ruinieren."
 gdp_disrupt_trade_routes_desc_general: "$gdp_disrupt_trade_routes$ ist ein [Concept('hostile_scheme', 'feindseliges Komplott')|E], bei dem ein [merchant|E] oder [patrician|E] darauf hinarbeitet, das [Concept('trade_route', 'Handelsrouten')|E]-Netz eines Rivalen zu stören. Es beruht auf [Concept('intrigue', 'Ränkespiel')|E] und man kann [agents|E] rekrutieren."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "Eine der [trade_routes|E] von[TARGET_CHARACTER.GetShortUIName] ist für #N 20 Jahre#! beeinträchtigt"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "Ihr werdet nicht dafür zur Rechenschaft gezogen, die [trade_routes|E] eines Rivalen gestört zu haben"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "Ihr teilt Euch einen [trade_market|E] mit [target.GetShortUIName]: $VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! $gdp_disrupt_trade_routes$s-Komplott endet"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName|U] betreibt [owner.Custom('DE_PRO_POS_S_3P')]e [trade_routes|E] nicht mehr selbst"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUIName|U] betreibt [target.Custom('DE_PRO_POS_S_3P')]e [trade_routes|E] nicht mehr selbst"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUIName|U] verfügt über keine weitere [trade_route|E], die sich stören ließe"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName|U] besitzt mindestens eine [trade_route|E]"
 gdp_disrupt_trade_routes_capacity_modifier: "Gestörte Logistik"
 gdp_disrupt_trade_routes_competitiveness_modifier: "Ruinierter Ruf"
 gdp_disrupt_trade_routes_discovered_opinion: "Störte meine Handelsrouten"
 gdp_disrupt_trade_routes_target_notification: "Probleme auf der Handelsroute ([disrupted_trade_route.GetName])"
 gdp_disrupt_trade_routes_target_notification_tt: "Auf einer meiner [trade_routes|E] ist etwas schiefgelaufen. Meine Händler können mir nicht sagen, was genau vorgefallen ist."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "Eine meiner [trade_routes|E] läuft eher schlecht, und meine Händler führten die Ursache auf [owner.GetShortUIName] zurück."
 gdp_disrupt_trade_routes_target_caught_notification: "Sabotage entdeckt"
 gdp_disrupt_trade_routes_target_caught_tt: "Einer der Männer von [owner.GetShortUIName] wurde auf einer meiner [trade_routes|E] aufgegriffen. Er gab zu, wozu er entsandt worden war."
