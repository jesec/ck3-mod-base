l_german:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "Ein kochender Kessel"
 republic_popular_opinion_event.1001.desc: "Dieser Tage ist es nicht gut, als Patrizier auf den Straßen erkannt zu werden.\n\n[relation_01.GetName|U] sieht meinen umherschweifenden Blick und meinen besorgten Gesichtsausdruck und sagt:\n\n„Verdammt, [ROOT.Char.GetFullName]. Die Patrizier aus [event_location_01.GetName] sondern sich nicht ab. Sie wandeln als stolze Bürger durch die Straßen!“\n\n[relation_01.Custom('DE_PRO_PER_S_3P_N')|U] hat recht, doch die Stimmung in der Stadt ist angespannt: Unzufriedenheit brodelt unter der Oberfläche. Proteste und Schlägereien plagen die Stadt, und ich kann nur erahnen, was nach Anbruch der Nacht geschieht."
 republic_popular_opinion_event.1001.a: "„Ihr habt recht. Wir müssen erhobenen Hauptes durch die Gegend gehen.“"
 republic_popular_opinion_event.1001.b: "„Das könnte eine gute Gelegenheit sein, mir einen Leibwächter zuzulegen.“"
 republic_popular_opinion_event.1001.c: "„Der Pöbel wird uns alle umbringen!“"
 republic_popular_opinion_event.1001.d: "„Sie werden in mir keine einfache Beute finden.“"
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "Zeit der Unzufriedenheit"
 republic_popular_opinion_event.1002.desc_1: "Als ich an meinem Fenster stehe, höre ich das Echo der wütenden Stimmen: [event_location_01.GetName] brodelt vor Unzufriedenheit. Die Arbeiter drohen damit, ihre Werkzeuge niederzulegen oder in den Straßen zu marschieren. Regierungssymbole werden zerstört oder es wird im Schutz der Dunkelheit Vandalismus betrieben.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "Wo auch immer ich hingehe, treffe ich auf düstere Mienen, Trotz und gemurmelte Beleidigungen."
 republic_popular_opinion_event.1002.desc_control_firm: "Die Massen können nicht mehr vollbringen als symbolische Akte des Widerstands, denn die Regierung schlägt beim kleinsten Anzeichen einer gesetzwidrigen Zusammenkunft mit brutaler Härte zu."
 republic_popular_opinion_event.1002.desc_control_strained: "Dank der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) können die Unruhen durch die Stadtwache im Zaum gehalten werden. Täglich werden Rädelsführer verhaftet und an den Pranger gestellt. Agenten, die sich Vorteile durch dieses Chaos verschaffen wollen, werden gejagt und bloßgestellt. Derzeit hält die Ordnung."
 republic_popular_opinion_event.1002.desc_control_slipping: "Trotz der harten Arbeit der Stadtwache entwischen immer wieder Aufrührer, in den Straßen herrscht nun Gewalt. Der Pöbel sammelt sich in Meuten, und nicht alle werden rechtzeitig aufgelöst. Die Nacht gehört den Banden und den Schlägern."
 republic_popular_opinion_event.1002.desc_control_broken: "Die Regierung hat die Kontrolle über die Straßen verloren. Die Stadtwache versteckt sich in ihren Kasernen, und der Pöbel bedrängt die Patrizier sogar auf den Stufen des Palastes! Gerüchte über fremdländische Agenten und Saboteure verbreiten sich ungehemmt."
 republic_popular_opinion_event.1002.a: "Ich stehe an der Seite der Regierung!"
 republic_popular_opinion_event.1002.b: "Ich werde deutlich machen, dass ich an der Seite des Volkes stehe."
 republic_popular_opinion_event.1002.c: "Es ist das Beste, sich bedeckt zu halten."
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "Festlicher Geist"
 republic_popular_opinion_event.1003.desc: "Im geschäftigen Treiben des Marktes von [event_location_01.GetTitle.GetName] unterhalte ich mich mit [Select_CString(craftsman_character.IsFemale, 'eine Bürgerin', 'einem Bürger')], [craftsman_character.GetName], und ob [craftsman_character.Custom('DE_PRO_POS_S_3P')]er Witze über [craftsman_character.Custom('DE_PRO_POS_S_3P')]en Esel krümme ich mich vor Lachen.\n\nIn letzter Zeit fühlt es sich so an, als sei die Stadt eine große Familie: Es fällt einfacher, mit Fremden zu sprechen, und alle sind trotz der schweren Lebensbedingungen guter Stimmung. Der Esel iaht fröhlich und stößt mich mit dem Kopf an.\n\n„Die Versammlung leistete gute Arbeit, nicht wahr?“, sagt [craftsman_character.GetFirstNameNoTooltip] und kratzt [craftsman_character.Custom('DE_PRO_POS_S_3P')]en Esel hinter dem Ohr. „Warum feiert Ihr nicht? Richtet ein Festmahl aus! Die Zünfte würden sich sicher beteiligen, um einen guten Eindruck zu hinterlassen und ihre Dankbarkeit zu zeigen.“"
 republic_popular_opinion_event.1003.a: "„Was für ein vorzüglicher Einfall!“"
 republic_popular_opinion_event.1003.b: "„Geld umsonst, sagt Ihr?“"
 republic_popular_opinion_event.1003.c: "„Ich würde lieber euch kennenlernen.“"
 republic_popular_opinion_event.1003.tt: "Eure nächste [feast|E]-[activity|E] ist #P umsonst.#!"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "Sich ehrgeizig fühlen"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName|U] und ich genießen einen Schluck [ROOT.Char.Custom('RegionalDrink')] auf einem Platz in der Nähe meines Hauses – und beobachten in aller Ruhe die rege Betriebsamkeit der Bürger, die ihrem Tagwerk nachgehen. [relation_01.GetName|U] seufzt zufrieden nach einem Nippen an [relation_01.Custom('DE_PRO_POS_S_3P')]em Getränk.\n\n„Ich sage Euch, [ROOT.Char.GetFullName]: Wir sollten schmieden, solange das Eisen noch heiß ist. Lasst uns ehrgeizig werden, sage ich! Die Stadt ist in solch einer guten Stimmung, dass alles möglich ist.“ [relation_01.Custom('DE_PRO_PER_S_3P_N')|U] hebt [relation_01.Custom('DE_PRO_POS_S_3P')]en Becher und lächelt. „Trinken wir: Auf neue Gelegenheiten und reichlich Münzen!“\n\nIch lächle auch und hebe meinen Becher."
 republic_popular_opinion_event.1004.a: "„Auf Abenteuer in der Ferne!“"
 republic_popular_opinion_event.1004.b: "„Auf neue Liebe und Romanzen!“"
 republic_popular_opinion_event.1004.c: "„Auf Ruhm und Ehre!“"
 republic_popular_opinion_event.1004.d: "„Auf Familie und Freunde!“"
