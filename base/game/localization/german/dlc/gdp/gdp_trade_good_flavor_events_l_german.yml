l_german:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "Bestandsaufnahme"
 gdp_trade_good_flavor.1001.desc: "Ich zähle meine [tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')] ein letztes Mal, bevor ich ins Bett gehe. 312, und alles davon ist bereits verkauft … zumindest in meinen Gedanken.\n\nIch zähle alles noch einmal. Nur um sicher zu sein."
 gdp_trade_good_flavor.1001.a: "Alles da. Alles meins."
 gdp_trade_good_flavor.1001.b: "Das Hauptbuch muss mir zustimmen."
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "Gerüchte verbreiten sich"
 gdp_trade_good_flavor.1002.desc: "Mich erreichte folgende Kunde: An [tgf_market_holder.Custom('DE_PRO_POS_S_3P')]em eigenen Tisch pries [tgf_market_holder.GetTitledFirstName] meine Ware ([tgf_good.Custom('GetTgfGoodLook')]). [tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')|U] will mehr, und [tgf_market_holder.Custom('DE_PRO_POS_S_3P')]e Nachbarn hörten [tgf_market_holder.Custom('DE_PRO_PER_S_3P_A')] das sagen.\n\nLob ist angenehm. Lob von jemandem, der kauft, ist noch besser."
 gdp_trade_good_flavor.1002.a: "Ein Geschenk für meinen Lieblingskunden."
 gdp_trade_good_flavor.1002.b: "Dann kann [tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')] mehr zahlen."
 gdp_trade_good_flavor.1002.c: "Lasst sie reden."
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "Von der Quelle"
 gdp_trade_good_flavor.1003.desc: "„Die [tgf_source_culture.GetName|l]en Kaufleute kennen ihr Geschäft bis zum letzten Fitzelchen“, schreibt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], aus [tgf_source_county.GetNameNoTier]. „Ihre Waren ([tgf_good.Custom('GetTradeGood')]) sind von hervorragender Güte, und niemand pfuscht.“\n\nDie Kenntnis der Quelle ist die halbe Voraussetzung für den Verkauf der Ware."
 gdp_trade_good_flavor.1003.a: "Jedes Detail ist Geld wert."
 gdp_trade_good_flavor.1003.b: "Jetzt weiß ich, was es kosten sollte."
 gdp_trade_good_flavor.1003.c: "Respekt – das sage ich unter uns Geschäftsleuten."
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "Eine offene Straße"
 gdp_trade_good_flavor.1004.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], grinst wie jemand, [tgf_trader.Custom('DE_ART_DEF_S_N')] bereits [tgf_trader.Custom('DE_PRO_POS_S_3P')]en Anteil ausgegeben hat. „Die ganze Straße ist offen, und sie fragen namentlich nach unserer Ware ([tgf_good.Custom('GetTgfGoodLook')]).“\n\nGute Jahre vergehen schnell. Man sollte das Beste aus ihnen machen."
 gdp_trade_good_flavor.1004.a: "Verkaufen wir, solange die Straße gut zu uns ist."
 gdp_trade_good_flavor.1004.b: "Aus jedem guten Jahr lässt sich etwas lernen."
 gdp_trade_good_flavor.1004.c: "Investiert in mehr Wagen!"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "Gewinnträume"
 gdp_trade_good_flavor.1005.desc: "Ich träumte erneut von unserer Ware ([tgf_good.Custom('GetTradeGood')]). [tgf_good.Custom('GetTradeGoodUnitPlural')|U] davon, bis unters Dach gestapelt und ich sitze oben auf dem Stapel – und beobachte die Käufer unten, die sich streiten, wer zuerst zahlen darf.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "Ich träumte erneut von unserer Ware ([tgf_good.Custom('GetTradeGood')]). Ganze Herden davon, die jede Straße bis zum Markt füllen – und ich reite an der Spitze der Kolonne und zähle die Käufer, während sie auf uns zurennen.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "Ich erwachte lachend. Dann begann ich, die Zahlen aufzuschreiben. Bald schon werde ich reich sein!"
 gdp_trade_good_flavor.1005.a: "Warum sollte es ein Traum bleiben?"
 gdp_trade_good_flavor.1005.a.tt: "Eine neue [trade_opportunity|E] wird sich schon bald ergeben"
 gdp_trade_good_flavor.1005.b: "Die Zahlen passen. Ich werde zusehen, dass sie passen."
 gdp_trade_good_flavor.1005.c: "Noch fünf Minuten mehr, in denen ich reich bin ... Schnarch#DIE1 Schnarch#!#DIE2 Schnarch …#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "Narren, die nachprüfen"
 gdp_trade_good_flavor.1006.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], zieht mich im Lagerhaus zur Seite. „Die Ware ([tgf_good.Custom('GetTradeGood')]) aus [tgf_source_county.GetNameNoTier] – [tgf_good.Custom('GetTgfGoodFlaw')]. Sie glauben, wir sind Narren, die das nicht überprüfen!“\n\nSie wollten mich betrügen. Stattdessen gaben sie mir einen Nachlass in die Hand."
 gdp_trade_good_flavor.1006.a: "Geringe Güte sollte auch einen geringen Preis haben."
 gdp_trade_good_flavor.1006.b: "Ha. Überlistet."
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "Fragt namentlich danach"
 gdp_trade_good_flavor.1007.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], überbringt mir merkwürdige Nachrichten aus [tgf_source_county.GetNameNoTier]. „[tgf_good.Custom('GetTradeGood')|U], [tgf_good.Custom('GetTgfGoodSold')], und noch immer fragen die [tgf_source_culture.GetCollectiveNoun] namentlich nach #EMP „[ROOT.Char.GetHouse.GetName]-[tgf_good.Custom('GetTradeGood')]“#!, und sie zahlen mehr als üblich, um das zu bekommen! Unsere Lager sind fast leer!“\n\nEs scheint so, als sei mein Name Geld wert."
 gdp_trade_good_flavor.1007.a: "Stempelt mein Zeichen auf alle [tgf_good.Custom('GetTradeGoodUnitPlural')]."
 gdp_trade_good_flavor.1007.b: "Verkaufen, verkaufen, verkaufen!"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "[tgf_good.GetNameNoTooltip] bewerten"
 gdp_trade_good_flavor.1008.desc: "Ein Brief mit dem Siegel von [tgf_market_holder.GetTitledFirstName] kommt an. „Mir wurden [tgf_good.Custom('GetTradeGoodUnitPlural')] von [tgf_good.Custom('GetTradeGood')], und mein Ratsverwalter kann die Güte nicht prüfen. Könntet Ihr mit Eurem Kaufmannsblick wohl einmal darüberschauen?“\n\nSchmeichelhaft. Schmeichelei kostet üblicherweise einen Aufpreis."
 gdp_trade_good_flavor.1008.a: "Die Wahrheit. Gewogen und gemessen."
 gdp_trade_good_flavor.1008.b: "Prächtig. Ich habe noch nie etwas Besseres gesehen."
 gdp_trade_good_flavor.1008.c: "Expertenmeinungen werden verkauft, nicht verschenkt."
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "Lernt zu zählen"
 gdp_trade_good_flavor.1009.desc: "Ich finde [Select_CString(tgf_heir.IsFemale, 'meine Erbin', 'meinen Erben')], [tgf_heir.GetFirstName] im Lagerhaus vor und sehe, wie [tgf_heir.Custom('DE_PRO_PER_S_3P_N')] durch die Ware ([tgf_good.Custom('GetTradeGood')]) wühlt, als würden sich ganz unten Münzen verstecken.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "Ich finde [Select_CString(tgf_heir.IsFemale, 'meine Erbin', 'meinen Erben')], [tgf_heir.GetFirstName] in den Ställen vor und sehe, wie [tgf_heir.Custom('DE_PRO_PER_S_3P_N')] die Ware ([tgf_good.Custom('GetTradeGood')]) mustert, als würden sich Münzen unter der Haut verbergen.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "Gute Instinkte. Es ist an der Zeit, dass sie jemand schärft."
 gdp_trade_good_flavor.1009.a: "Kommt. Schaut, was ich mache."
 gdp_trade_good_flavor.1009.b: "Dann zählt sie. Doppelt."
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "Der Nachahmer"
 gdp_trade_good_flavor.1010.desc: "Eine Kiste wird zu mir nach [tgf_source_county.GetNameNoTier] zurückgeschickt, denn „sie entspreche nicht den üblichen Standards“. Sie gehört nicht mir, sondern jemand ahmte mein Zeichen bis zum letzten Bogen nach.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "Eines meiner Tiere wird zu mir nach [tgf_source_county.GetNameNoTier] zurückgeschickt, denn „es entspreche nicht der üblichen Qualität“. Es ist nicht meines, sondern jemand ahmte mein Brandzeichen bis zum letzten Bogen nach.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], weiß, von wem die Fälschung stammt: Von [tgf_rival.GetFirstName] aus dem Unternehmen ([tgf_rival.Custom('GetTgfCompanyWord')]) von Haus [tgf_rival.GetHouse.GetBaseNameNoTooltip]. [tgf_rival.Custom('DE_PRO_PER_S_3P_N')|U] ahmte es gut nach, das muss man schon sagen."
 gdp_trade_good_flavor.1010.a: "Macht diese Fälschungen zunichte, was auch immer es kostet."
 gdp_trade_good_flavor.1010.b: "Lasst jedes Haus von dieser Schmähung wissen."
 gdp_trade_good_flavor.1010.c: "Eine Nachahmung verbreitet meinen Namen völlig kostenfrei."
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U] machte die Fälschungen von [tgf_rival.GetShortUINameNotMy] zu einer Angelegenheit zwischen ihren Häusern."
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U] machte die Fälschungen von [target_char.GetShortUINameNotMy] zu einer Angelegenheit zwischen ihren Häusern."
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "Der Preis in Sachen [tgf_good.GetNameNoTooltip]"
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName|U], [Select_CString(tgf_envoy.IsFemale, 'eine Händlerin, die', 'ein Händler, der')] in den Diensten des Unternehmens ([tgf_rival.Custom('GetTgfCompanyWord')]) von Haus [tgf_rival.GetHouse.GetBaseNameNoTooltip] steht, trifft mich in meinem Lagerhaus an und legt eine schwere Geldbörse auf den Tisch. „[Select_CString(tgf_rival.IsFemale, 'Meine Meisterin', 'Mein Meister')], [tgf_rival.GetFirstName] möchte die Namen Eurer Verkäufer in Sachen [tgf_good.Custom('GetTradeGood')]. Alle. Die Geldbörse sagt bitte.“\n\n[tgf_envoy.Custom('DE_PRO_PER_S_3P_N')|U] kauft nicht einfach nur Namen. [tgf_envoy.Custom('DE_PRO_PER_S_3P_N')|U] kauft Jahre meiner Arbeit."
 gdp_trade_good_flavor.1011.a: "Namen sind bloß Tinte. Rückt schon mit dem Geld heraus."
 gdp_trade_good_flavor.1011.b: "Mein Vorteil steht nicht zum Verkauf."
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "Ein Waffenstillstand unter Händlern"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U] verkauft [tgf_good.Custom('GetTradeGood')] nach [tgf_source_county.GetNameNoTier], so wie ich auch, und jede Saison drücken wir die Preise noch mehr. Heute bietet [tgf_ally.Custom('DE_PRO_POS_S_3P')] Brief einen Waffenstillstand an: Wir hören damit auf, uns gegenseitig zu unterbieten, und wir beide werden gut essen können.\n\nFrieden, so scheint es, kann wie alles andere auch gekauft werden."
 gdp_trade_good_flavor.1012.a: "In Ordnung. Essen wir beide."
 gdp_trade_good_flavor.1012.b: "Ich kann länger hungern, als [tgf_ally.Custom('DE_PRO_PER_S_3P_N')] es kann."
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U] und [tgf_ally.GetShortUINameNotMe] vereinbarten, sich nicht mehr zu unterbieten."
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U] und [target_char.GetShortUINameNotMe] vereinbarten, sich nicht mehr zu unterbieten."
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "Ein Privatpreis"
 gdp_trade_good_flavor.1013.desc: "Ich erhielt einen Brief mit dem Siegel von [tgf_market_holder.GetTitledFirstName]. „Ihr kauft Eure Ware ([tgf_good.Custom('GetTradeGood')]) auf meinem Markt. Wenn Ihr sie ausschließlich dort kauft, werdet Ihr weniger zahlen müssen als alle anderen Kaufleute es je mussten.“\n\n„Exklusiv“ ist nur ein anderes Wort für „an der Leine“. Doch die Rate ist gut."
 gdp_trade_good_flavor.1013.a: "[tgf_market_holder.Custom('DE_PRO_POS_S_3P')|U] Markt. Mein Nachlass. Erledigt."
 gdp_trade_good_flavor.1013.b: "Ich beuge mich niemandes Hauptbuch."
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "Fragt die alten Hasen"
 gdp_trade_good_flavor.1014.desc: "[Select_CString(tgf_porter.IsFemale, 'Eine grauhaarige Trägerin', 'Ein grauhaariger Träger')] stellt [tgf_porter.Custom('DE_PRO_POS_S_3P')]e Ladung am Lagerhaus von [tgf_source_county.GetNameNoTier] ab. „Ich bitte um Verzeihung – aber Ihr überprüft Eure Ware ([tgf_good.Custom('GetTradeGood')]) völlig falsch.“ [tgf_porter.Custom('DE_PRO_PER_S_3P_N')|U] zeigt es mir: hier und hier.\n\nDas lebenslange Tragen von [tgf_good.Custom('GetTradeGoodUnitPlural')] lehrte [tgf_porter.Custom('DE_PRO_PER_S_3P_A')] mehr als alle anderen."
 gdp_trade_good_flavor.1014.desc.livestock: "[Select_CString(tgf_porter.IsFemale, 'Eine grauhaarige Viehtreiberin', 'Ein grauhaariger Viehtreiber')] hütet [tgf_porter.Custom('DE_PRO_POS_S_3P')]e Herde am Lagerhaus von [tgf_source_county.GetNameNoTier]. „Ich bitte um Verzeihung – aber Ihr überprüft Eure Tiere ([tgf_good.Custom('GetTradeGood')]) völlig falsch.“ [tgf_porter.Custom('DE_PRO_PER_S_3P_N')|U] zeigt es mir: hier und hier.\n\nDas lebenslange Treiben der [tgf_good.Custom('GetTradeGoodUnitPlural')] lehrte [tgf_porter.Custom('DE_PRO_PER_S_3P_A')] mehr als alle anderen."
 gdp_trade_good_flavor.1014.a: "Hier. Weisheit verdient Münzen."
 gdp_trade_good_flavor.1014.b: "Macht weiter. Ich höre zu."
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "Ein Anfängerfehler"
 gdp_trade_good_flavor.1015.desc: "Irgendwo in [tgf_source_county.GetNameNoTier] stößt der Höker, der mir meine Ware ([tgf_good.Custom('GetTradeGood')]) verkauft hat, auf mein Wohl an. Ich habe den Preis eines Narren bezahlt, und alle anderen wissen es vor mir.\n\nNun gut. Narren, die lernen … hören auf, Narren zu sein."
 gdp_trade_good_flavor.1015.a: "Eine teure Lektion ist immer noch eine Lektion."
 gdp_trade_good_flavor.1015.b: "Es reicht. Heute schläft das Hauptbuch."
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "Das Handbuch des Kaufmanns"
 gdp_trade_good_flavor.1016.desc.intro: "In einer Kiste voll mit [tgf_good.Custom('GetTradeGood')] und vor der Feuchtigkeit geschützt finde ich eine Kopie"
 gdp_trade_good_flavor.1016.desc.intro_livestock: "Bei den Geräten, die mit der letzten Ware ([tgf_good.Custom('GetTradeGood')]) kamen, die ich kaufte, finde ich, vor Feuchtigkeit geschützt, eine Kopie"
 gdp_trade_good_flavor.1016.desc.book_1: "der Praktik des Handels"
 gdp_trade_good_flavor.1016.desc.book_2: "des Buchs der Straßen und Märkte"
 gdp_trade_good_flavor.1016.desc.book_3: "des Händlerspiegels"
 gdp_trade_good_flavor.1016.desc.outro: " – Gewichte, Maßeinheiten, Straßen und Preise, festgehalten von einem Kaufmann, der offenbar nie schlief.\n\nJemand verlor einen Schatz. Ich habe vor, ihn zu nutzen."
 gdp_trade_good_flavor.1016.a: "Lest darin, bis der Rücken aufbricht."
 gdp_trade_good_flavor.1016.b: "Seltene Bücher erzielen noch seltenere Preise."
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "Das Gefühl dafür"
 gdp_trade_good_flavor.1017.desc: "In [tgf_source_county.GetNameNoTier] hält [Select_CString(tgf_seller.IsFemale, 'eine Verkäuferin', 'ein Verkäufer')] der [tgf_seller.GetCulture.GetCollectiveNoun] [tgf_seller.Custom('DE_PRO_POS_S_3P')]e Ware ([tgf_good.Custom('GetTradeGood')]) hoch und nennt einen Preis, der für das Dreifache angemessen wäre. „Ihr seid neu in dem Geschäft, ja? Dann zahlt, um ein Gefühl dafür zu bekommen.“\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "In [tgf_source_county.GetNameNoTier] zeigt mir [Select_CString(tgf_seller.IsFemale, 'eine Verkäuferin', 'ein Verkäufer')] der [tgf_seller.GetCulture.GetCollectiveNoun] [tgf_seller.Custom('DE_PRO_POS_S_3P')]e Ware ([tgf_good.Custom('GetTradeGood')]) und nennt einen Preis, der für das Dreifache angemessen wäre. „Ihr seid neu in dem Geschäft, ja? Dann zahlt, um ein Gefühl dafür zu bekommen.“\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "Unverschämt. Angemessen, aber unverschämt."
 gdp_trade_good_flavor.1017.a: "Nehmt die Münzen. Bringt es mir bei."
 gdp_trade_good_flavor.1017.b: "Auf keinen Fall."
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "Falsches Maß"
 gdp_trade_good_flavor.1018.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], entdeckt, dass wir die Ware ([tgf_good.Custom('GetTradeGood')]) nach dem [ROOT.Char.GetCulture.GetName|l]en Maß verkauft haben – und damit in etwas geringerem Umfang, als ein [tgf_source_culture.GetName|l]er Käufer es annehmen würde. Alles, was wir davon verkauften, war zu wenig.\n\nEin ehrlicher Fehler. Doch ob es einer bleibt, liegt an mir."
 gdp_trade_good_flavor.1018.a: "Korrigiert die Maße. Alle."
 gdp_trade_good_flavor.1018.b: "Der Unterschied bleibt in meiner Geldbörse."
 gdp_trade_good_flavor.1018.c: "Wiegt es auf ihre Art und sagt das auch laut."
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "Zwei Waren, ein Käufer"
 gdp_trade_good_flavor.1019.desc: "Ich erhielt einen Brief von [tgf_market_holder.GetTitledFirstName]. „Schickt mir Eure Ware ([tgf_good.Custom('GetTradeGood')]). Schickt mir auch die andere Ware ([tgf_good_b.Custom('GetTradeGood')]), denn die eine ist ohne die andere nichts.“\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "Ich erhielt einen Brief von [tgf_market_holder.GetTitledFirstName]. „Schickt mir Eure Ware ([tgf_good.Custom('GetTradeGood')]). Schickt mir auch die andere Ware ([tgf_good_b.Custom('GetTradeGood')]), und zwar mit derselben Lieferung.“\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "Zwei Waren, ein Käufer, ein Preis. Meine liebste Form des Rechnens."
 gdp_trade_good_flavor.1019.a: "Zusammen verkauft, zusammen bepreist."
 gdp_trade_good_flavor.1019.b: "Getrennt. Eine Münze jetzt schlägt eine Münze später."
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "Der Baumeisterpreis"
 gdp_trade_good_flavor.1020.desc: "Gerüste ragen überall in [tgf_build_county.GetNameNoTier] auf. [tgf_market_holder.GetTitledFirstName|U] baut, und jeder Karren, der zu den Baustellen rollt, ist mit meinen Waren ([tgf_good.Custom('GetTradeGood')]) beladen. [tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')|U] schreibt und fragt nach einem Baumeisterpreis – dieselbe Ware ([tgf_good.Custom('GetTradeGood')]) wird gewollt, und zwar etwas günstiger, bis die Mauern stehen.\n\nJede Mauer, die [tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')] errichtet, ist bereits zur Hälfte die meine."
 gdp_trade_good_flavor.1020.a: "Dann machen wir also einen Baumeisterpreis."
 gdp_trade_good_flavor.1020.b: "Ein Preis, ja. Ein Geschenk, nein."
 gdp_trade_good_flavor.1020.c: "Ein Gefallen für einen Gefallen."
 gdp_trade_good_flavor.1020.d: "Das Beste davon bleibt in meinem Hof."
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "Die Waren kennen"
 gdp_trade_good_flavor.1021.desc: "Jedes Geschäft hat seine Meister, und Meister lernen #EMP ständig#!. Heute bin ich es, mit einer Lampe und den feinsten Waren ([tgf_good.Custom('GetTradeGood')]) in meinen Lagern, die ich untersuche, bis das Licht schwindet.\n\nIrgendwo hier findet sich auch der Grund, warum sich meine verkaufen und die der anderen nicht."
 gdp_trade_good_flavor.1021.desc.livestock: "Jedes Geschäft hat seine Meister, und Meister lernen ständig. Heute bin ich es, mit einer Laterne und den feinsten Waren ([tgf_good.Custom('GetTradeGood')]), die ich besitze und die ich von Kopf bis Schwanz untersuche.\n\nIrgendwo hier findet sich auch der Grund, warum sich meine verkaufen und die der anderen nicht."
 gdp_trade_good_flavor.1021.desc.books: "Jedes Geschäft hat seine Meister und Meister lernen #EMP ständig#!. Heute bin ich es, mit einer Lampe und den besten Büchern aus meinen Lagern, die ich lese, bis das Licht schwindet.\n\nIrgendwo hier findet sich auch der Grund, warum sich meine verkaufen und die der anderen nicht."
 gdp_trade_good_flavor.1021.a: "Das hier behalte ich. Alles andere wird sich daran messen."
 gdp_trade_good_flavor.1021.b: "Es gibt immer noch mehr zu lernen."
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "Ein Name für das Geschäft"
 gdp_trade_good_flavor.1022.desc: "In [tgf_source_county.GetNameNoTier] nennen sie nicht mehr meinen Namen. Sie sagen [tgf_good.Custom('GetTgfGoodNickname')], und alle wissen, wer gemeint ist. #bold Ich.#!\n\nTitel werden von Lehnsherren gewährt. Namen wie diesen gewähren die Märkte, und das Lob eines Marktes ist verdient."
 gdp_trade_good_flavor.1022.a: "Vulgär. Wirkungsvoll, aber vulgär."
 gdp_trade_good_flavor.1022.b: "Lasst es. Der Name ist gut fürs Geschäft."
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "Ein Lieferengpass"
 gdp_trade_good_flavor.1023.desc: "„Ihr kauft schneller, als wir herstellen können“ sagt [tgf_foreman.GetFirstName], [Select_CString(tgf_foreman.IsFemale, 'eine Vorarbeiterin', 'ein Vorarbeiter')] in [tgf_source_county.GetNameNoTier], während ich zusehe, wie meine Ware ([tgf_good.Custom('GetTradeGood')]) hergestellt wird. „Es gibt nicht genügend Hände.“\n\nMehr Hände kosten. Käufer wegzuschicken, kostet noch mehr."
 gdp_trade_good_flavor.1023.a: "Heuert mehr Hände an. Ich zahle."
 gdp_trade_good_flavor.1023.b: "Arbeitet stattdessen für mich."
 gdp_trade_good_flavor.1023.c: "Dann zeigt mir, wie man es macht."
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "Unter dem Hammer"
 gdp_trade_good_flavor.1024.desc: "„Vierzig [tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')], an das höchste Gebot!“ Auf dem Handelsplatz ([tgf_source_province.Custom('GetRegionalMarketTerm')]) von [tgf_source_county.GetNameNoTier] hebt [tgf_rival.GetFirstName] des Unternehmens ([tgf_rival.Custom('GetTgfCompanyWord')]) von Haus [tgf_rival.GetHouse.GetBaseNameNoTooltip] die Hand, noch ehe der Auktionator überhaupt geendet hat.\n\n[tgf_rival.Custom('DE_PRO_PER_S_3P_N')|U] schaut mich an und lächelt. [tgf_rival.Custom('DE_PRO_PER_S_3P_N')|U] denkt, diese ganze Charge würde bereits [tgf_rival.Custom('DE_PRO_PER_S_3P_D')] gehören …"
 gdp_trade_good_flavor.1024.a: "Was auch immer [tgf_rival.Custom('DE_PRO_PER_S_3P_N')] bietet: Bietet immer eins mehr."
 gdp_trade_good_flavor.1024.b: "Höher, höher, höher … und alles gehört Euch, [tgf_rival.GetFirstNameNoTooltip]!"
 gdp_trade_good_flavor.1024.c: "Lasst [tgf_rival.Custom('DE_PRO_PER_S_3P_A')] bieten. Ich werde zuschauen, wer gewinnt."
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "Als Erstes am Kai"
 gdp_trade_good_flavor.1025.desc: "„Zwanzig Schiffe am Kai und nur ein Kran“, sagt [tgf_docks_boss.GetFirstName], [tgf_docks_boss.Custom('DE_ART_DEF_S_N')] die Schauerleute von [tgf_source_county.GetNameNoTier] unter sich hat. „Wer seine Waren ([tgf_good.Custom('GetTradeGood')]) hier als Erstes anlandet, legt den Preis fest. Ihr könnt zuerst anlanden.“\n\n[tgf_docks_boss.Custom('DE_PRO_PER_S_3P_N')|U] hält die Hand auf."
 gdp_trade_good_flavor.1025.a: "Als Erstes von Bord, als Erstes den Preis festgelegt."
 gdp_trade_good_flavor.1025.b: "Dann verkaufe ich alles hier, gleich vom Schiff aus."
 gdp_trade_good_flavor.1025.c: "Lasst die anderen zuerst entladen und schaut, was sie verlangen."
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "Mit vollen Händen"
 gdp_trade_good_flavor.1026.desc: "„Nur eines zur Zeit – so kaufen die Armen“, sagt [tgf_stallholder.GetFirstName], [tgf_stallholder.Custom('DE_ART_DEF_S_N')] einen Stand auf dem Markt von [tgf_source_county.GetNameNoTier] hat. [tgf_stallholder.Custom('DE_PRO_PER_S_3P_N')|U] zerteilte die [tgf_good.Custom('GetTradeGoodUnitPlural')] meiner Ware ([tgf_good.Custom('GetTradeGood')]) in Hunderte von kleinen Päckchen und verkauft jedes für etwas mehr, als es wert ist.\n\n„Sorgt dafür, dass der Nachschub kommt, und ich sorge dafür, dass Ihr weiter bezahlt werdet.“"
 gdp_trade_good_flavor.1026.a: "Frische Ware, wann immer Ihr sie braucht. Abgemacht."
 gdp_trade_good_flavor.1026.b: "Verkauft ihnen die Ware zu dem Preis, den sie zahlen können."
 gdp_trade_good_flavor.1026.c: "Nehmt alles. Das bringt Münzen in die Hand."
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "Markttag"
 gdp_trade_good_flavor.1027.desc: "„[tgf_good.Custom('GetTradeGood')|U]! [tgf_good.Custom('GetTgfGoodLook')|U]! Wer braucht [tgf_good.Custom('GetTradeGood')]?“ Es ist Markttag in [tgf_source_county.GetNameNoTier], und man hört meinen Marktschreier kaum. Alle Käufer der Gemeinde, alle an einem Ort, alle mit Münzen in den Händen.\n\nIch muss sie nur überzeugen, sie bei #EMP mir#! auszugeben!"
 gdp_trade_good_flavor.1027.a: "Ich brauche das beste Verkaufsargument. Was immer es kostet."
 gdp_trade_good_flavor.1027.b: "Kein Stand. Ich kümmere mich selbst um die Menge."
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "Fremdländische Münzen"
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], [Select_CString(tgf_buyer.IsFemale, 'eine Käuferin', 'ein Käufer')] in [tgf_source_county.GetNameNoTier], möchte meine Ware ([tgf_good.Custom('GetTradeGood')]) und bezahlt mit [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]. „Münze ist Münze“, sagt [tgf_buyer.Custom('DE_PRO_PER_S_3P_N')].\n\n„Münze ist Münze“, stimme ich zu und sage [tgf_buyer.Custom('DE_PRO_PER_S_3P_D')], was mir [tgf_buyer.Custom('DE_PRO_POS_S_3P')]e Münzen wert sind. [tgf_buyer.Custom('DE_PRO_PER_S_3P_D')|U] vergeht das Lächeln."
 gdp_trade_good_flavor.1028.a: "Gut. Silber ist Silber."
 gdp_trade_good_flavor.1028.b: "Mein Preis oder kein Geschäft."
 gdp_trade_good_flavor.1028.c: "Bezahlt mich stattdessen in [tgf_good_b.Custom('GetTradeGood')]."
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "Jahre auf der Straße"
 gdp_trade_good_flavor.1029.desc: "„Drei Jahre lang trug diese Straße Eure Ware ([tgf_good.Custom('GetTradeGood')])“, sagt [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], und hebt den Becher. „Und keine [tgf_good.Custom('GetTradeGoodUnitPlural')] gingen verloren, während ich dabei war!“\n\n[tgf_trader.Custom('DE_PRO_PER_S_3P_N')|U] verlor fünf. Doch heute lasse ich [tgf_trader.Custom('DE_PRO_PER_S_3P_D')] den Ruhm."
 gdp_trade_good_flavor.1029.a: "Ihr habt Euch gut geschlagen!"
 gdp_trade_good_flavor.1029.b: "Auf die nächsten drei Jahre."
 gdp_trade_good_flavor.1029.c: "Nächstes Mal ziehen wir noch weiter. Noch viel weiter."
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "Den Verkauf beobachten"
 gdp_trade_good_flavor.1030.desc: "„Das ist echte Ware ([tgf_good.Custom('GetTradeGood')]) von Haus [ROOT.Char.GetHouse.GetName]“, sagt [Select_CString(tgf_buyer.IsFemale, 'eine Käuferin', 'ein Käufer')] auf dem Markt von [tgf_source_county.GetNameNoTier] und deutet auf meine [tgf_good.Custom('GetTradeGoodUnitPlural')]. „[tgf_good.Custom('GetTgfGoodLook')|U]!“\n\n[tgf_buyer.Custom('DE_PRO_PER_S_3P_N')|U] ahnt nicht, dass Haus [ROOT.Char.GetHouse.GetName] unmittelbar hinter [tgf_buyer.Custom('DE_PRO_PER_S_3P_D')] steht.\n\nIch könnte etwas sagen. Ich könnte es auch einfach nur genießen."
 gdp_trade_good_flavor.1030.a: "Sagt nichts. Hört einfach nur zu, was gewollt wird."
 gdp_trade_good_flavor.1030.b: "Das ist es tatsächlich. Ich sollte es wissen."
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "Geld von außen"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] und [tgf_investor_b.GetFirstName], zwei [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] aus [tgf_source_county.GetNameNoTier], kaufen meine Ware ([tgf_good.Custom('GetTradeGood')]) seit Jahren. Jetzt wollen sie einen Anteil haben.\n\n„Einen Anteil an Eurem Geschäft“, sagt [tgf_investor_a.GetFirstNameNoTooltip], während [tgf_investor_b.GetFirstNameNoTooltip] die Münzen zählt. „Wir zahlen gut, und wir stellen kaum Fragen.“\n\nSie werden Fragen stellen. Das machen Geldgeber immer."
 gdp_trade_good_flavor.1031.a: "Eure Münzen, meine Gewinne. Zumindest ein bisschen."
 gdp_trade_good_flavor.1031.b: "Dieses Geschäft bleibt in der Familie."
 gdp_tgf_kept_in_family_unity_desc: "Behielt das Geschäft in der Familie"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "Der Ausstellungsraum"
 gdp_trade_good_flavor.1032.desc: "„[tgf_good.Custom('GetTradeGood')], wirklich?“, fragt jeder Besucher, der in meine Halle kommt. Und ja: Die beste Ware, die ich besitze – [tgf_good.Custom('GetTgfGoodLook')] –, liegt dort, wo man sie nicht übersehen kann.\n\nNiemand verlässt mein Haus, ohne zu wissen, was ich verkaufe."
 gdp_trade_good_flavor.1032.desc.livestock: "„[tgf_good.Custom('GetTradeGood')], wirklich?“, fragt jeder Besucher, der in meiner Halle vorsichtig umhergeht. Und es ist so: Die beste Ware, die ich besitze – [tgf_good.Custom('GetTgfGoodLook')] –, ist dort abgestellt, wo sie niemand übersehen kann.\n\nNiemand verlässt mein Haus, ohne zu wissen, was ich verkaufe. Oder ohne die eigenen Schuhe zu überprüfen."
 gdp_trade_good_flavor.1032.a: "Lasst sie glotzen. Die Kunde wird sich verbreiten."
 gdp_trade_good_flavor.1032.b: "Nehmt etwas davon. Mit besten Grüßen."
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "Im Spiel bleiben"
 gdp_trade_good_flavor.1033.desc: "Ein langjähriger Lieferant in Sachen [tgf_good.Custom('GetTradeGood')] schreibt mir: „Den besten Teil der diesjährigen Ware ([tgf_good.Custom('GetTradeGood')]) habe ich für Euch zur Seite gelegt. Zum alten Preis. Wollt Ihr nicht wieder kaufen?“\n\nIch habe dieses Geschäft hinter mir gelassen, doch mein Auge für die Ware ([tgf_good.Custom('GetTradeGood')]) ist noch immer gut. Mein Blick dafür ist Geld wert, wenn ich ihn in Übung halte."
 gdp_trade_good_flavor.1033.a: "Schreibt zurück. Bleibt in Übung."
 gdp_trade_good_flavor.1033.b: "Mein Wissen steht zum Verkauf. Gegen eine gewisse Summe."
 gdp_trade_good_flavor.1033.c: "Lasst es sein. Ich habe jetzt neue Geschäftsfelder."
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "Der Reisebericht"
 gdp_trade_good_flavor.1034.desc: "[tgf_pilgrim.GetFirstName|U], [Select_CString(tgf_pilgrim.IsFemale, 'eine Pilgerin, die', 'ein Pilger, der')] in [tgf_source_county.GetNameNoTier] haltmacht, klopft auf ein kleines zerschlissenes Buch. „Jede Straße, jedes Gasthaus und jede Furt zwischen hier und dem Meer stehen hier drin. Und an den Rändern ist jeder Markt vermerkt, der gut für die Ware ([tgf_good.Custom('GetTradeGood')]) zahlt. Gegen eine gewisse Summe gehört es Euch.“\n\nDas Buch zeigt mehr als jede meiner Karten."
 gdp_trade_good_flavor.1034.a: "Nennt Euren Preis, [Select_CString(tgf_pilgrim.IsFemale, 'Pilgerin', 'Pilger')]."
 gdp_trade_good_flavor.1034.b: "Kopiert es heute Nacht. Gebt es zum Morgen zurück."
 gdp_trade_good_flavor.1034.c: "Erzählt mir einfach, was Ihr auf den Märkten saht."
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "Übers Geschäft reden"
 gdp_trade_good_flavor.1035.desc: "„Womit handelt Ihr?“, fragt [tgf_guest.GetFirstName], [Select_CString(tgf_guest.IsFemale, 'meine Gästin', 'mein Gast')], auf unserem Spaziergang nach dem Abendessen. Ein Fehler. Als ich fertig bin, ausschweifend zu erklären, wie ich an meine Ware ([tgf_good.Custom('GetTradeGood')]) gelange – [tgf_good.Custom('GetTgfGoodMade')] –, haben wir den ganzen Markt zweimal umrundet.\n\n[tgf_guest.Custom('DE_PRO_PER_S_3P_N')|U] versuchte nicht einmal, das Gespräch auf etwas anderes zu lenken. Daher weiß ich, dass ich [Select_CString(tgf_guest.IsFemale, 'eine Käuferin', 'einen Käufer')] habe."
 gdp_trade_good_flavor.1035.a: "Sollen wir beim Nachtisch über die Bedingungen sprechen?"
 gdp_trade_good_flavor.1035.b: "Genug über mich. Wo kauft Ihr Eure Ware?"
 gdp_trade_good_flavor.1035.c: "Lasst mich Euch erzählen, wie ich mein erstes Vermögen damit machte."
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "Die Packhalle"
 gdp_trade_good_flavor.1036.desc: "„Ein Drittel mehr [tgf_good.Custom('GetTradeGoodUnitPlural')] auf jeden Karren“, sagt [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], und zeigt mir, wie. „Etwas wird auf der Straße aufgehen, und die Käufer werden sich beschweren. Das meiste aber nicht.“\n\nDas meiste ist eine Zahl, die ich mag. Etwas ist eine Zahl, mit der ich leben kann."
 gdp_trade_good_flavor.1036.a: "Packt alles eng zusammen. Der Gewinn füllt die Lücken."
 gdp_trade_good_flavor.1036.b: "Packt alles sorgfältig. Die Käufer beurteilen das Erste, was sie öffnen."
 gdp_trade_good_flavor.1036.c: "Lasst es so. Es hat immer so geklappt."
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "Das Marktsiegel"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "Ein Marktbeamter, der die Waren auf Güte und treue Maße hin untersuchte und ein Blei- oder Wachssiegel an jenen befestigte, die die Prüfung bestanden. Viele Städte verboten den Verkauf von Stoffen und anderen Waren ohne ein solches Siegel, und der Siegler nahm eine Gebühr für jedes von ihnen."
 gdp_trade_good_flavor.1037.desc: "„Versiegelte Waren verkaufen sich für einen höheren Preis. Alle wissen das“, sagt [tgf_sealer.GetFirstName], der [Glossary('Siegler', 'TGF_SEALER_GLOSS')] des Markts von [tgf_source_county.GetNameNoTier], ohne von [tgf_sealer.Custom('DE_PRO_POS_S_3P')]er Bank aufzublicken. „Und ich siegele nach der Reihenfolge, nach der ich bezahlt werde, und nicht nach der, nach der man mich anfragt.“\n\nMeine Karren voll Ware ([tgf_good.Custom('GetTradeGood')]) warten in der Sonne. Wie auch mein Gewinn."
 gdp_trade_good_flavor.1037.a: "Dann warten wir. Versiegelt ist versiegelt."
 gdp_trade_good_flavor.1037.b: "Hier. Jetzt siegelt schneller."
 gdp_trade_good_flavor.1037.c: "Mein Name ist Siegel genug."
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "[Select_CString(tgf_broker.IsFemale, 'Die Zwischenhändlerin', 'Der Zwischenhändler')]"
 gdp_trade_good_flavor.1038.desc: "„Ich kenne Käufer, von denen Ihr noch nie gehört habt, in Städten, in denen Ihr noch nie gewesen seid“, sagt [tgf_broker.GetFirstName], [Select_CString(tgf_broker.IsFemale, 'eine Händlerin', 'ein Händler')] auf dem Markt von [tgf_source_county.GetNameNoTier] und schenkt mir einen Tee ein, um den ich nicht bat. „Eure Waren ([tgf_good.Custom('GetTradeGood')]), ihr Geld, mein Anteil.“\n\nDrei Parteien. Nur eine von ihnen bekommt ein Getränk umsonst."
 gdp_trade_good_flavor.1038.a: "Findet sie. Nehmt Euren Anteil."
 gdp_trade_good_flavor.1038.b: "Ich finde meine eigenen Käufer. Vielen Dank."
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "Der Lehrling [Select_CString(tgf_trader.IsFemale, 'die Händlerin', 'des Händlers')]"
 gdp_trade_good_flavor.1039.desc: "„Hier kann jemand schneller zählen, als ich es kann“, sagt [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], und schiebt eine dünne jugendliche Gestalt namens [tgf_youth.GetFirstName] nach vorn. [tgf_youth.GetFirstNameNoTooltip|U] benennt den Preis in Sachen [tgf_good.Custom('GetTradeGood')] auf beiden unseren Märkten, noch ehe ich fragen kann.\n\nEin kluges Kind kostet Geld, es zu behalten. Ein kluges Kind, das für mich arbeitet, verdient es zurück."
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip|U] bleibt bei mir."
 gdp_trade_good_flavor.1039.b: "Behaltet die Jugend, [tgf_trader.GetFirstNameNoTooltip]. Und bringt ihr etwas bei."
 gdp_trade_good_flavor.1039.c: "Wir müssen genug Mäuler stopfen."
 gdp_tgf_family_only_unity_desc: "Behielt die Gesellschaft in der Familie"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "Darin schwimmen"
 gdp_trade_good_flavor.1040.desc: "Spät in der Nacht gehört das Lagerhaus mir allein: [tgf_good.Custom('GetTgfGoodLook')], höher gestapelt als mein Kopf. Ich lasse eine Handvoll durch meine Finger rinnen, immer ein bisschen zur Zeit.\n\nEin Gedanke verfängt sich. Was, wenn ich … #EMP darin schwimme?#!"
 gdp_trade_good_flavor.1040.a: "Taucht hinein! Wie eine glückliche Ente!"
 gdp_trade_good_flavor.1040.a.toast: "Eine harte Landung"
 gdp_trade_good_flavor.1040.b: "Nein. Zählt es. Jedes kleinste bisschen."
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "Der erste Verkauf"
 gdp_trade_good_flavor.1041.desc: "Als ich eine alte Truhe ausräume, finde ich es in Stoff eingewickelt: das erste Stück [tgf_good.Custom('GetTradeGood')], das ich je verkaufte. Ich kaufte es Jahre später zurück, zum doppelten Preis.\n\nDa mich niemand sehen kann, halte ich es ins Licht und erzähle ihm, wie weit wir gekommen sind. Jede Münze, die ich seitdem verdient habe, ist eines seiner Kinder."
 gdp_trade_good_flavor.1041.a: "Rahmt es. Hängt es dort auf, wo ich es sehen kann."
 gdp_trade_good_flavor.1041.b: "Eine Reliquie meines Aufstiegs. Jemand wird dafür bezahlen."
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "Münze unter dem Kissen"
 gdp_trade_good_flavor.1042.desc: "„Gute Nacht, Münzen.“ Ich sage dies nun jeden Abend zu der Geldbörse unter meinem Kopfkissen: alles, was mir meine Ware ([tgf_good.Custom('GetTradeGood')]) diese Saison brachte.\n\nEs ist das härteste Kissen, das ich je besaß, und das einzige, das ein Vermögen wert ist."
 gdp_trade_good_flavor.1042.a: "Schlaft darauf. Auf allem davon."
 gdp_trade_good_flavor.1042.b: "Unter dem Kissen bewirkt es nichts. Kauft mehr [tgf_good.Custom('GetTradeGood')]."
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "Porträt mit Münzen"
 gdp_trade_good_flavor.1043.desc: "„Ihr, an Eurem Tisch. Eure Ware ([tgf_good.Custom('GetTradeGood')]) auf einer Seite und Eure Münzen auf der anderen“ sagt [tgf_painter.GetFirstName], [Select_CString(tgf_painter.IsFemale, 'eine Malerin, die', 'ein Maler, der')] durch [tgf_source_county.GetNameNoTier] reist und mich mit [tgf_painter.Custom('DE_PRO_POS_S_3P')]en Daumen einrahmt. „Jede Münze gemalt, jede [Glossary('gezählt', 'TGF_MONEYLENDER_PORTRAIT_GLOSS')].\"\n\nIch mag Leute, die zählen."
 gdp_trade_good_flavor.1043.a: "Malt es. Jede Münze."
 gdp_trade_good_flavor.1043.b: "Malt die Münzen … #EMP größer.#!"
 gdp_trade_good_flavor.1043.c: "Ein Maler ist kein Kunde."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "Kaufleute und Geldwechsler mochten es, bei der Arbeit gemalt zu werden, und zwar zwischen ihren Münzen und Waagen. Petrus Christus malte einen Goldschmied, der 1449 einen Ring für ein verlobtes Paar abwog."
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "Ein zu schwerer Geldbeutel"
 gdp_trade_good_flavor.1044.desc: "„Soll ich einen zweiten Bediensteten holen, [ROOT.Char.Custom('FormOfAddressForLiege')]?“, fragt [tgf_servant.GetFirstName]. Mein Geldbeutel, der voll ist mit dem Geld dieser Saison, braucht nun einen eigenen Bediensteten, um hinter mir hergetragen zu werden.\n\nIch denke über einen Karren nach."
 gdp_trade_good_flavor.1044.a: "Ja. Zwei Bedienstete. Geht langsam."
 gdp_trade_good_flavor.1044.b: "Nein. Ein Karren. Mit meinem Namen drauf!"
 gdp_trade_good_flavor.1044.c: "Zuerst gehen wir über den [tgf_good.Custom('GetTradeGood')]-Markt, [tgf_servant.GetFirstNameNoTooltip]."
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "Gewinn und Frömmigkeit"
 gdp_trade_good_flavor.1045.desc: "Meine Hauptbücher liegen vor mir [Glossary('auf die alte Weise', 'TGF_DATINI_GLOSS')], im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und des Gewinns. Dieses Jahr füllt der Gewinn vierzig Seiten, und keine einzige Münze ging an die höchste Macht ([ROOT.Char.GetFaith.HighGodName]).\n\nJeder Kaufmann weiß, dass ein Partner einen ehrlichen Anteil braucht."
 gdp_trade_good_flavor.1045.a: "Einen ehrlichen Anteil für meinen Partner im Himmel."
 gdp_trade_good_flavor.1045.b: "Eine ruhige Stunde mit der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]), und danach zurück zu den Hauptbüchern."
 gdp_trade_good_flavor.1045.c: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) ließ mich gut darin werden. Es wäre unhöflich, damit aufzuhören."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "In der Geschichte von Josef, wie sie in der Tora, der Bibel und dem Koran steht, träumt der Herrscher von Ägypten von sieben fetten Kühen, die von sieben mageren gefressen werden. Josef liest daraus, dass auf sieben Jahre des Überflusses sieben des Hungers folgen, und Ägypten kann noch rechtzeitig seine Getreidespeicher auffüllen."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "Francesco Datini, ein Kaufmann aus Prato, betitelte seine Hauptbücher mit „Im Namen Gottes und des Gewinns“ und starb als einer der reichsten Männer der Toskana."
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "Einer von ihresgleichen"
 gdp_trade_good_flavor.1046.desc: "„Die Hälfte der Menschen in [tgf_source_county.GetNameNoTier] sind [tgf_source_culture.GetCollectiveNoun] so wie ich“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „Für mich öffnen sich Türen, die Euch verschlossen bleiben. Für mich fallen Preise, die für [ROOT.Char.GetCulture.GetCollectiveNoun] wie Euch niemals fallen.“\n\n[tgf_trader.GetFirstNameNoTooltip|U] meint es nur nett. Ich entscheide mich, nur den Teil mit den Preisen zu hören."
 gdp_trade_good_flavor.1046.a: "Von nun an übernehmt Ihr das Reden."
 gdp_trade_good_flavor.1046.b: "Hier. Lasst Euch nicht ausnehmen."
 gdp_trade_good_flavor.1046.c: "Dann werde ich mir ihre Sitten aneignen."
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "Überfluteter Markt"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetFirstName] aus dem Unternehmen ([tgf_rival.Custom('GetTgfCompanyWord')]) von Haus [tgf_rival.GetHouse.GetBaseNameNoTooltip] verkauft Waren ([tgf_good.Custom('GetTradeGood')]) in [tgf_source_county.GetNameNoTier] für weniger, als es kostet, sie hierherzubringen. [tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], ist wütend.\n\nIch bin neugierig. Etwas, was so günstig ist, sollte jemand kaufen. Vorzugsweise ich."
 gdp_trade_good_flavor.1047.a: "Wenn [tgf_rival.GetFirstNameNoTooltip] es weggeben möchte, werde ich es nehmen."
 gdp_trade_good_flavor.1047.b: "Lasst [tgf_rival.GetFirstNameNoTooltip] mit Verlust verkaufen. Meine Ware ([tgf_good.Custom('GetTradeGood')]) wird sich halten."
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "Manuskript in einem Ballen"
 gdp_trade_good_flavor.1048.desc: "Jemand in [tgf_source_county.GetNameNoTier] stopfte meine letzten [tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')] mit alten Seiten aus, um die Feuchtigkeit fernzuhalten. [tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], faltet sie sorgfältig auf. „Ein [Glossary('Buch', 'TGF_HOUSE_OF_WISDOM_GLOSS')] oder das meiste davon zumindest. Jemand wird das vermissen.“\n\nIch bezahlte für die Ware ([tgf_good.Custom('GetTradeGood')]). Das Buch war umsonst, mag aber viel mehr wert sein."
 gdp_trade_good_flavor.1048.a: "Ich werde es behalten."
 gdp_trade_good_flavor.1048.b: "Verkauft es mit der Ware ([tgf_good.Custom('GetTradeGood')])."
 gdp_trade_good_flavor.1048.c: "Schickt es zurück nach [tgf_source_county.GetNameNoTierNoTooltip]."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "Bücher überquerten Grenzen im Gepäck der Kaufleute. In Bagdads Haus der Weisheit übersetzten Gelehrte griechische, persische und indische Werke ins Arabische und daraus dann viele ins Lateinische."
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "Kaufleute von daheim"
 gdp_trade_good_flavor.1049.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], schreibt aus [tgf_source_county.GetNameNoTier]. „Es gibt ein [Glossary('Quartier', 'TGF_DIASPORA_GLOSS')] für [ROOT.Char.GetCulture.GetCollectiveNoun] hier, fern der Heimat, und sie vermissen ihr Zuhause. Alle hier kennen den Namen [ROOT.Char.GetHouse.GetBaseNameNoTooltip]. Wenn sie ihn hören, versammeln sie sich.“\n\nHeinweh, stellt sich heraus, ist ein Markt."
 gdp_trade_good_flavor.1049.a: "Verkauft ihnen Waren, wie wir es zu Hause machen."
 gdp_trade_good_flavor.1049.b: "Bringt ihren Ältesten zu mir in die Gesellschaft."
 gdp_trade_good_flavor.1049.c: "Der Geschmack der Heimat ist Geld wert."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "Kaufleute, die sich in der Ferne niederließen, errichteten Quartiere unter ihresgleichen: Sogdier entlang der Seidenstraße, Venetianer in Konstantinopel, jüdische Händler von Kairo bis Aden. Ihre Verwandtschaft in der Heimat trieb über sie Handel."
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "Die [tgf_good.GetNameNoTooltip]-Straße"
 gdp_trade_good_flavor.1050.desc: "Ich werde [tgf_smuggler.GetFirstName] vorgestellt, ein [Glossary('Schmuggler', 'TGF_SMUGGLER_GLOSS')] aus [tgf_source_county.GetNameNoTier], der einen Kniff kennt: Die obersten [tgf_good.Custom('GetTradeGoodUnitPlural')] eines jeden Karrens sind das schlechteste Angebot – [tgf_good.Custom('GetTgfGoodFlaw')]. Deshalb schauen die Steuereintreiber von [tgf_market_holder.GetTitledFirstName] nie weiter unten nach.\n\n„Die Hälfte des Marktpreises“, sagt [tgf_smuggler.GetFirstNameNoTooltip]. „Unter die obersten [tgf_good.Custom('GetTradeGoodUnitPlural')] gelegt ist alles perfekt.“"
 gdp_trade_good_flavor.1050.a: "Die Hälfte des Preises ist mein Lieblingspreis."
 gdp_trade_good_flavor.1050.a.toast: "Die Nachricht spricht sich herum"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip|U] wird dankbar sein. Für Euren Kopf."
 gdp_trade_good_flavor.1050.c: "Steuereintreiber zum Narren halten? Ihr seid angeheuert."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "Wo auch immer die Herrscher Waren besteuerten, schlüpften die Schmuggler an ihnen vorbei. Salz, fast überall besteuert, machte ihn zum Reichsten: Huang Chao, ein Salzschmuggler im China der Tangzeit, führte einen Aufstand an, der den Hauptsitz Chang’an einnahm."
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "Eine schwere Ernte"
 gdp_trade_good_flavor.2001.desc: "Mich erreichen Neuigkeiten aus [tgf_source_county.GetNameNoTier], wo ich meine Waren ([tgf_good.Custom('GetTradeGood')]) kaufe. Die [tgf_source_culture.GetName|l]en Bauern brachten die Ernte ihres Lebens ein, und die Lagerhäuser können so viel gar nicht fassen.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "Mich erreichen Neuigkeiten aus [tgf_source_county.GetNameNoTier], wo ich meine Waren ([tgf_good.Custom('GetTradeGood')]) kaufe. Die [tgf_source_culture.GetName|l]e! Hirten hatten das Jahr ihres Lebens. Jeder Stall ist voll, und es gibt nicht genügend Gras für alle.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "Ein gutes Jahr für sie. Ein guter Preis für mich."
 gdp_trade_good_flavor.2001.a: "Macht den Preis fest, solange sie feiern."
 gdp_trade_good_flavor.2001.b: "Reitet hin. Lernt, wie sie es anbauten."
 gdp_trade_good_flavor.2001.b.livestock: "Reitet hin. Lernt, wie sie sie züchteten."
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "Die Beute des Jägers"
 gdp_trade_good_flavor.2002.desc: "„Die [tgf_good.Custom('GetTgfGoodGatherers')] von [tgf_source_county.GetNameNoTier] übertrafen sich selbst“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „Eine ganze Saisonladung voll Ware ([tgf_good.Custom('GetTradeGood')]) in einer Lieferung, und die beste, die sie je sandten. Die Angebote kommen schon herein.“\n\nAlles verkaufen oder die besten Teile behalten? Das liebste Dilemma eines Kaufmanns."
 gdp_trade_good_flavor.2002.a: "Verkauft es alles, solange der Preis hoch ist."
 gdp_trade_good_flavor.2002.b: "Die besten Stücke bleiben bei mir."
 gdp_trade_good_flavor.2002.c: "Flutet die Stände damit. Jeder bekommt etwas."
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "Eine reiche Ader"
 gdp_trade_good_flavor.2003.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], kommt grinsend von der Straße nach [tgf_source_county.GetNameNoTier]. „Ein neues Flöz: reich, flach und jeder Bergmann in der Gemeinde will mitarbeiten. Günstige Ware ([tgf_good.Custom('GetTradeGood')]) heute. Noch günstiger, wenn wir uns in das Flöz einkaufen.“\n\nIch kenne kein Flöz, das lange günstig geblieben wäre."
 gdp_trade_good_flavor.2003.desc.amber: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], kommt grinsend von der Straße nach [tgf_source_county.GetNameNoTier]. „Die Herbststürme haben mehr [tgf_good.Custom('GetTradeGood')] aufgewirbelt als jemals zuvor, und alle Familien an der Küste sind draußen zum Sammeln. Günstiger [tgf_good.Custom('GetTradeGood')] heute. Noch günstiger, wenn #EMP wir#! die Sammler bezahlen.“\n\nDenn das Meer ist niemals sehr lange so großzügig."
 gdp_trade_good_flavor.2003.a: "Beteiligt Euch am Abbau."
 gdp_trade_good_flavor.2003.a.amber: "Bezahlt die Sammler."
 gdp_trade_good_flavor.2003.b: "Kauft, solange die Karren übervoll sind."
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "Ein Geheimnis, das sich lohnt"
 gdp_trade_good_flavor.2004.desc: "„Eine neue Farbe!“ [tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], brachte eine Probe den ganzen Weg von [tgf_source_county.GetNameNoTier] hierher, und die Färberwerkstätten schwören, dass niemand sonst das Geheimnis kenne.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "„Ein neuer Lack!“ [tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], brachte eine Probe den ganzen Weg von [tgf_source_county.GetNameNoTier] hierher, und die Werkstatt schwört, das niemand sonst das Geheimnis kenne.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "Geheimnisse sind teuer. Exklusive Geheimnisse sind es wert."
 gdp_trade_good_flavor.2004.a: "Nennt Euren Preis. Das Geheimnis gehört mir."
 gdp_trade_good_flavor.2004.b: "Bewundert es, schreibt es auf und zieht weiter."
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "Die Waren probieren"
 gdp_trade_good_flavor.2005.desc: "Ein Kaufmann muss die Waren kennen. Daher probiere ich von meiner eigenen ([tgf_good.Custom('GetTradeGood')]) – einmal für die Pflicht, ein zweites Mal für die Gewissheit und danach rein aus Vergnügen. Am Abend ist alles weg.\n\nKöstlich. Die [tgf_source_culture.GetCollectiveNoun|U] würden das Doppelte dafür zahlen."
 gdp_trade_good_flavor.2005.a: "Doppelt. Sie werden doppelt zahlen."
 gdp_trade_good_flavor.2005.b: "Mm. Rein der Qualität wegen. Einmal noch."
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "Sich entsprechend kleiden"
 gdp_trade_good_flavor.2006.desc: "Wenn Ihr [tgf_good.Custom('GetTradeGood')] verkaufen wollt, dann tragt diese Ware am Leib. Ich komme auf dem Markt an und trage das Beste aus meinen Beständen und sehe, wie die Käufer zweimal hinsehen.\n\nDie Waren sprechen für sich. Ich trage sie nur."
 gdp_trade_good_flavor.2006.a: "Es passt. Es bleibt."
 gdp_trade_good_flavor.2006.a.tt_furs: "Ihr tragt von nun an Euren Pelzumhang"
 gdp_trade_good_flavor.2006.a.tt_leather: "Ihr tragt von nun an Euren Lederumhang"
 gdp_trade_good_flavor.2006.a.tt_silk: "Ihr tragt von nun an Euren Seidenmantel"
 gdp_trade_good_flavor.2006.a.tt_textiles: "Ihr tragt von nun an Euren edlen Mantel"
 gdp_trade_good_flavor.2006.b: "Lasst die Waren für sich sprechen."
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "Nennwert"
 gdp_trade_good_flavor.2007.desc: "„Die neuen [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')] werden mein Gesicht tragen“, erzählt mir [tgf_market_holder.GetTitledFirstName], „und aus Eurer Ware ([tgf_good.Custom('GetTradeGood')]) gefertigt sein. Ich wünsche regelmäßigen Nachschub. Zu Freundschaftspreisen.“\n\n[tgf_market_holder.Custom('DE_PRO_POS_S_3P')|U] Gesicht, mein Metall, eine Münze. Die Geschichte wird sich an uns beide erinnern."
 gdp_trade_good_flavor.2007.a: "Ein Freundschaftspreis! Prägt die erste Münze für mich."
 gdp_trade_good_flavor.2007.b: "Der volle Preis. Münze ist Münze."
 gdp_trade_good_flavor.2007.c: "Freundschaftspreis? Ich habe Besseres zu tun."
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "Unversehrt"
 gdp_trade_good_flavor.2008.desc: "„Meine [tgf_good.Custom('GetTradeGoodUnitPlural')] sind alle noch da. Nichts ging verloren“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], und ist sehr zufrieden mit sich. „Nichts vergeudet, nichts zerbrochen, nichts gestohlen. Alles kam so an, wie es die Reise antrat.“\n\nDas ist kein Glück. Das ist Können, und Können kann erlernt werden."
 gdp_trade_good_flavor.2008.a: "Zeigt mir, wie Ihr alles verpackt habt."
 gdp_trade_good_flavor.2008.b: "Sorgsame Hände. Beeindruckend."
 gdp_trade_good_flavor.2008.c: "Erzählt das den Käufern. Heile Ware verkauft sich zu hohen Preisen."
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "Andere Leute sehen Armeen"
 gdp_trade_good_flavor.2009.desc: "Der Krieg kam zu [tgf_market_holder.GetTitledFirstName], und Kriege fressen Waren ([tgf_good.Custom('GetTradeGood')]). [tgf_market_holder.Custom('DE_PRO_POS_S_3P')|U]e Quartiermeister kaufen alles, was meine Route tragen kann, und fragen, wann mehr kommt.\n\nAndere Leute sehen Armeen. Ich sehe Käufer."
 gdp_trade_good_flavor.2009.a: "Der Krieg zahlt Vorkasse."
 gdp_trade_good_flavor.2009.b: "Privilegien. Schriftlich. Sofort."
 gdp_trade_good_flavor.2009.c: "Vergesst nicht, wer Euch bewaffnete."
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "Die Gilde klopft an"
 gdp_trade_good_flavor.2010.desc: "Die [tgf_source_culture.GetName|l]e Gilde aus [tgf_source_county.GetNameNoTier] schreibt mir sehr höflich. Meine Preise unterbieten die ihren, und sie würde sich gern auf einen gemeinsamen Preis einigen, bevor jemand Schwierigkeiten bekommt.\n\nGilden klopfen höflich an, aber nur einmal."
 gdp_trade_good_flavor.2010.a: "Bezahlt die Gebühr. Legt den Preis fest."
 gdp_trade_good_flavor.2010.b: "Lasst sie ruhig kommen."
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "Herrscher geben den Ton vor"
 gdp_trade_good_flavor.2011.desc: "Die Kunde reist schneller als die Karren: [tgf_market_holder.GetTitledFirstName|U] trug meine Ware ([tgf_good.Custom('GetTradeGood')]) vor [tgf_market_holder.Custom('DE_PRO_POS_S_3P')]em gesamten Hof in [tgf_source_county.GetNameNoTier], und die Hälfte seiner Höflinge fragte bereits an, woher diese schönen Dinge kamen.\n\nDie Herrscher geben den Ton vor. Die Kaufleute den Preis."
 gdp_trade_good_flavor.2011.a: "Erzählt allen, wessen [tgf_good.Custom('GetTradeGood')] es war."
 gdp_trade_good_flavor.2011.b: "Erhöht die Preise, solange sie starren."
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "Die Waren verkosten"
 gdp_trade_good_flavor.2012.desc: "Die [tgf_good.Custom('GetTradeGoodUnitPlural')] von [tgf_good.Custom('GetTradeGood')] starren mich an. Es war ein schwarzer Monat, mein Kopf brummt, und ich bin umringt vom besten Getränk, das man mit Geld kaufen kann.\n\nIch prüfe nur die Güte. Niemand muss davon erfahren."
 gdp_trade_good_flavor.2012.a: "Ich prüfe die Ware. Alles davon."
 gdp_trade_good_flavor.2012.a.toast: "Eine Probe zu viel"
 gdp_trade_good_flavor.2012.b: "Nein. Lager ist Lager."
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "Eine Meisterwerkorder"
 gdp_trade_good_flavor.2013.desc: "„Gebt mir Eure beste Ware ([tgf_good.Custom('GetTradeGood')]) und eine Meistergebühr“, sagt [tgf_crafter.GetFirstName], der beste [tgf_good.Custom('GetTgfGoodCrafter')] in [tgf_source_county.GetNameNoTier], „und ich werde Euch etwas herstellen, was niemand zuvor gesehen hat.“\n\nMein Geldbeutel denkt darüber nach. Mein Stolz hat sich bereits entschieden."
 gdp_trade_good_flavor.2013.a: "Die Gebühr ist vereinbart. Versetzt mich in Erstaunen."
 gdp_trade_good_flavor.2013.b: "Meine Waren müssen sich nicht herausputzen."
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "Ihr Gericht, unsere Waren"
 gdp_trade_good_flavor.2014.desc: "„Sie tun Eure Ware ([tgf_good.Custom('GetTradeGood')]) jetzt in ihre einheimische Spezialität ([tgf_source_province.Custom('GetTgfLocalDish')])“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „Alle in [tgf_source_county.GetNameNoTier] machen das. Die Köche nennen es die neue Zubereitung, und niemand erinnert sich an die alte.“\n\nIch habe ihr örtliches Gericht ([tgf_source_province.Custom('GetTgfLocalDish')]) noch nicht einmal probiert. Ich könnte dennoch nicht stolzer sein."
 gdp_trade_good_flavor.2014.a: "Sie können mich für die neue Zubereitung bezahlen."
 gdp_trade_good_flavor.2014.b: "Mehr Karren. Die Köche sind hungrig."
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "In Ware bezahlt"
 gdp_trade_good_flavor.2015.desc: "„Wir wollen mehr Münzen“, sagt [tgf_spokesperson.GetFirstName] und spricht dabei für die [tgf_good.Custom('GetTgfGoodGatherers')] aus [tgf_source_county.GetNameNoTier]. Ich biete ihnen stattdessen [tgf_good.Custom('GetTradeGood')].\n\n„Ihr sammelt die Ware“, mache ich deutlich. „Sicherlich mögt Ihr sie!“\n\nSie mögen sie nicht."
 gdp_trade_good_flavor.2015.a: "Bezahlt sie. Mit Münzen."
 gdp_trade_good_flavor.2015.b: "Beteiligt sie am Gewinn."
 gdp_trade_good_flavor.2015.c: "Waren sind auch Löhne."
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "Geld stinkt nicht"
 gdp_trade_good_flavor.2016.desc: "„Es stinkt“, sagt ein Käufer in [tgf_source_county.GetNameNoTier] und hält meine Ware ([tgf_good.Custom('GetTradeGood')]) am ausgetreckten Arm. [tgf_good.Custom('GetTgfGoodFlaw')|U], so wurde mir gesagt.\n\nIch nehme die Münze des Käufers und rieche daran. [Glossary('Sie riecht nach gar nichts', 'TGF_PECUNIA_NON_OLET_GLOSS')]."
 gdp_trade_good_flavor.2016.a: "Verkauft an erkältete Käufer."
 gdp_trade_good_flavor.2016.b: "Vielleicht gibt es etwas gegen den Geruch?"
 gdp_trade_good_flavor.2016.c: "Haltet mir die Münze unter die Nase. Den ganzen Tag."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#! – „Geld stinkt nicht“. Der römische Kaiser Vespasian, so wird gesagt, soll eine Münze aus der Steuer für öffentliche Bedürfnisanstalten unter die Nase seines Sohnes gehalten haben, um diesen Sachverhalt zu verdeutlichen."
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "Sieben fette Jahre"
 gdp_trade_good_flavor.2017.desc: "Ich träume von sieben fetten Kühen und sieben mageren[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]. Ich wache auf und rechne noch vor dem Frühstück.\n\nWas auch immer die mageren Jahre kosten: Meine Ware ([tgf_good.Custom('GetTradeGood')]) wird mehr kosten."
 gdp_trade_good_flavor.2017.a: "Lagert alles ein. Bis auf die letzten [tgf_good.Custom('GetTradeGoodUnitPlural')]."
 gdp_trade_good_flavor.2017.b: "Kauft noch mehr, solange es günstig ist."
 gdp_trade_good_flavor.2017.c: "Kühe sind keine Hauptbücher. Schlaft weiter."
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "Irgendwessen Vieh"
 gdp_trade_good_flavor.2018.desc: "Ich trete aus der Tür und stelle fest, dass mein Tor von einer ganzen Herde [tgf_good.Custom('GetTradeGood')] versperrt ist, und [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')] mich aus der Herde heraus angrinst. „[tgf_raider.GetFirstName|U], ein [Glossary('Räuber', 'TGF_CATTLE_RAID_GLOSS')], brachte die Tiere vom Weideland von [tgf_market_holder.GetTitledFirstName]. Fragt nicht. Halber Marktpreis.“\n\nDas Brandzeichen von [tgf_market_holder.GetFirstNameNoTooltip|U] ist auf jeder Flanke.\n\n„Brandzeichen“, fügt [tgf_trader.GetFirstNameNoTooltip] hinzu, „lassen sich ändern.“"
 gdp_trade_good_flavor.2018.a: "Ein Geschäft ist ein Geschäft, ungeachtet des Brandzeichens."
 gdp_trade_good_flavor.2018.a.toast: "Jemand kannte das Brandzeichen"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U] kaufte wissentlich Tiere, die aus den Herden von [CHARACTER.GetShortUIName] gestohlen waren."
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U] kaufte wissentlich Tiere, die aus den Herden von [TARGET_CHARACTER.GetShortUIName] gestohlen waren."
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip|U] wird mir dafür etwas schulden."
 gdp_trade_good_flavor.2018.c: "Schlachtet sie schnell."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "Die Herde eines Nachbarn zu überfallen, war eine alte Tradition und ein ernsthaftes Geschäft. Irlands große Heldenerzählung, die Táin Bó Cúailnge, erzählt von einem Krieg, der wegen eines einzigen Bullen geführt wurde."
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "Der Durst eines trockenen Hofes"
 gdp_trade_good_flavor.2019.desc: "„Der Hof von [tgf_market_holder.GetTitledFirstName] trinkt niemals [tgf_good.Custom('GetTradeGood')],“ erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „Der Hof von [tgf_market_holder.GetTitledFirstNameNoTooltip] hat außerdem vierzig [tgf_good.Custom('GetTradeGoodUnitPlural')] von unserem Trunk bestellt. Beides ist offenbar wahr.“\n\nDer Glaube von [tgf_market_holder.GetFirstNameNoTooltip] [Glossary('verbietet das Trinken', 'TGF_ABU_NUWAS_GLOSS')]. Nichts verbietet, dass zu viel berechnet wird."
 gdp_trade_good_flavor.2019.a: "Beschriftet die Fässer als Essig."
 gdp_trade_good_flavor.2019.b: "Verdoppelt den Preis. Wem gegenüber würden sie sich beschweren?"
 gdp_trade_good_flavor.2019.b.toast: "Ein weiterer Lieferant"
 gdp_trade_good_flavor.2019.b.toast_good: "Vollständig bezahlt"
 gdp_trade_good_flavor.2019.c: "Dafür risikiere ich nicht meinen Hals. Verkauft woanders."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "An vielen Höfen war Wein verboten und wurde gleichzeitig an den meisten geliebt. Abu Nuwas, Dichter am Hof des Kalifen Hārūn ar-Raschīd, schrieb ein paar der schönsten Weingedichte auf Arabisch."
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "Ein perfektes Rad"
 gdp_trade_good_flavor.3001.desc: "Man riecht das Lagerhaus, bevor ich es sehen kann. Ein Käserad, so reif, dass die Träger halb im Scherz eine Wache postiert haben. Halb.\n\nVerkauft es, und es erkauft ein Festmahl. Behaltet es, und es ist eines."
 gdp_trade_good_flavor.3001.a: "Schützt es mit Eurem Leben."
 gdp_trade_good_flavor.3001.b: "Alles hat seinen Preis. Auch Vollkommenheit."
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "Eine berühmte Beschwerde"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "Die älteste bekannte Kundenbeschwerde: eine Lehmtafel aus Ur, beinahe dreitausend Jahre alt, in der ein Nanni den Kaufmann Ea-nasir beschimpft, er liefere Kupferbarren von geringer Güte geliefert und habe seinen Boten mit Verachtung behandelt."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName|U] schreibt, dass mein Kupfer von geringer Güte sei und meine Barren zu leicht. Alles richtig.\n\n„Für wen haltet Ihr mich, dass Ihr mich mit solcher [Glossary('Verachtung', 'TGF_EA_NASIR_GLOSS')] behandelt?“\n\nIch halte [tgf_market_holder.Custom('DE_PRO_PER_S_3P_A')] für gute Kundschaft. [tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')|U] bezahlte bereits."
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')|U] wird wieder kaufen. Das macht [tgf_market_holder.Custom('DE_PRO_PER_S_3P_N')] immer."
 gdp_trade_good_flavor.3002.a.toast: "Niemals wieder"
 gdp_trade_good_flavor.3002.a.toast_good: "Zurück für mehr"
 gdp_trade_good_flavor.3002.b: "Mein Kupfer ist echt. Lasst [tgf_market_holder.Custom('DE_PRO_PER_S_3P_A')] es prüfen!"
 gdp_trade_good_flavor.3002.b.toast_bad: "Erwischt"
 gdp_trade_good_flavor.3002.b.toast_good: "Die Probe wird bestanden"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U] verkaufte [CHARACTER.GetShortUIName] zu leichte Barren und schwor, sie seien echt."
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U] verkaufte [TARGET_CHARACTER.GetShortUIName] zu leichte Barren und schwor, sie seien echt."
 gdp_trade_good_flavor.3002.c: "Eine Entschuldigung. Und nächstes Mal bessere Barren."
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "In Pfeffer bezahlt"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "Pfeffer war beinahe so viel wert wie Silber und wurde oft als Zahlungsmittel angenommen. In London legten die Gesetze von König Æthelred um das Jahr 1000 herum einen Teil des Zolls für deutsche Händler in Pfeffer fest."
 gdp_trade_good_flavor.3003.desc: "[Select_CString(tgf_debtor.IsFemale, 'Eine meiner Schuldnerinnen', 'Einer meiner Schuldner')] in [tgf_source_county.GetNameNoTier], [tgf_debtor.GetFirstName], hat keine Münze übrig. Daher bezahlt [tgf_debtor.Custom('DE_PRO_PER_S_3P_N')] stattdessen in [Glossary('Pfeffer', 'TGF_PEPPER_GLOSS')], Prise für Prise, bis mein Tisch wie ein Gewürzmarkt riecht.\n\nIch zähle alles doppelt. Keine schlechte Rate. Und [tgf_debtor.GetFirstNameNoTooltip] kann nicht [Select_CString(tgf_debtor.IsFemale, 'die', 'der')] Einzige sein."
 gdp_trade_good_flavor.3003.a: "Fortan akzeptiere ich Pfeffer."
 gdp_trade_good_flavor.3003.b: "Münzen. Kratzt sie zusammen."
 gdp_trade_good_flavor.3003.c: "Arbeitet für mich. Die Schulden können warten."
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "Ein Brief voller Beschwerden"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "Briefe von Kaufleuten, die über Jahrhunderte aufbewahrt wurden – wie jene, die in der Kairoer Geniza aufbewahrt werden, dem Lagerraum einer Synagoge für weggeworfene Papiere –, beschreiben den Mittelmeerhandel in erschöpfenden und gekränkten Einzelheiten. Die Flachshändler beschweren sich am meisten."
 gdp_trade_good_flavor.3004.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], verkaufte jeden Ballen von meinem Flachs in [tgf_source_county.GetNameNoTier] zu einem guten Preis. [tgf_trader.Custom('DE_PRO_POS_S_3P')|U] [Glossary('Brief', 'TGF_GENIZA_GLOSS')] beschreibt es: in einer einzigen Zeile. Die anderen vierzig sind Beschwerden: die Feuchtigkeit, die Träger, die Käufer, wie ich alles verpackt hatte.\n\nZuerst der Gewinn, dann das Gemecker. Umgekehrt würde es mir Sorgen machen."
 gdp_trade_good_flavor.3004.a: "Eine Zeile zum Gewinn. Ich lese sie zwei Mal."
 gdp_trade_good_flavor.3004.b: "Vierzig Zeilen kostenlose Ratschläge."
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "Eine Raffiniertheit"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "Ein Prunkstück aus Zucker und Mandelpaste, das zwischen den Gängen des Festmahls serviert wird: Burgen, Schiffe und Tiere, die man formte, um die Gäste zu beeindrucken. Die größten Raffiniertheiten waren sowohl politische Aussagen als auch Nachtisch."
 gdp_trade_good_flavor.3005.desc: "„[tgf_market_holder.GetTitledFirstName|U] möchte einen bestimmten Vogel ([ROOT.Char.Custom('GetRandomRegionalBird')]) aus Zucker“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „Doppelt so groß wie in echt, jede einzelne Feder zu erkennen, zu Mittsommer auf [tgf_market_holder.Custom('DE_PRO_POS_S_3P')]em Tisch. Eine [Glossary('Raffiniertheit', 'TGF_SUBTLETY_GLOSS')], um [tgf_market_holder.Custom('DE_PRO_POS_S_3P')] Festmahl zu krönen.“\n\nZucker schmilzt. Der Ruf hält sich."
 gdp_trade_good_flavor.3005.a: "Ich werde das herstellen. Überlebensgroß."
 gdp_trade_good_flavor.3005.a.success: "Das Festmahl verstummt"
 gdp_trade_good_flavor.3005.a.failure: "Ein schiefer Vogel"
 gdp_trade_good_flavor.3005.b: "Festmahlpreise für Festmahlstücke."
 gdp_trade_good_flavor.3005.c: "Ich verkaufe Zucker, keine Skulpturen."
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "Der Schwarm"
 gdp_trade_good_flavor.3006.desc: "Die Bienen kommen uneingeladen, bauen zwischen den Dachsparren und nun stellen sie Honig in meinem Lagerhaus her. Umsonst.\n\nMieter, die in Honig bezahlen. Es gibt schlimmere Übereinkünfte – wenn man die Stiche ignoriert."
 gdp_trade_good_flavor.3006.a: "Honig umsonst. Was könnte es kosten?"
 gdp_trade_good_flavor.3006.a.toast: "Gestochen!"
 gdp_trade_good_flavor.3006.b: "Lasst sie arbeiten. Ohne Miete zu zahlen."
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "Eine weitere Tasse Tee"
 gdp_trade_good_flavor.3007.desc: "Eine Tasse, um die Ware kennenzulernen. Dann eine weitere, weil die erste gut war. Gegen Mitternacht habe ich drei Hauptbücher erneut gezählt und zwei Briefe verfasst, und ich fühle mich großartig.\n\nDas ist entweder eine sehr edle Lieferung oder eine sehr teure Gewohnheit."
 gdp_trade_good_flavor.3007.a: "Eine weitere Tasse. Jeden Morgen."
 gdp_trade_good_flavor.3007.b: "Schenkt ihn der ganzen Gesellschaft aus."
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "Ehe alles schlecht wird"
 gdp_trade_good_flavor.3008.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], öffnet die Warenlieferung ([tgf_good.Custom('GetTradeGood')]) und zuckt zusammen. „Der Flussnebel gelangte hinein. Sie sind weich – bis zum Ende der Woche werden sie verschimmelt sein.“\n\nGetrocknete Früchte halten sich jahrelang. Feuchte Früchte nur ein paar Tage. Zeit ist Geld."
 gdp_trade_good_flavor.3008.a: "Trocknet sie noch einmal und trocknet sie ordentlich."
 gdp_trade_good_flavor.3008.b: "Lasst alles vergären. Nennen wir es einen Wein."
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "Die Nacht zum Tag machen"
 gdp_trade_good_flavor.3009.desc: "Das Lampenöl neigt sich dem Ende entgegen, lange bevor es die Hauptbücher tun. Daher verbrenne ich meine eigene gute Ware ([tgf_good.Custom('GetTradeGood')]), die eigentlich zum Verkauf gedacht ist. Sie brennt nicht heller als der trübe Bodensatz, den wir wegwerfen.\n\nNicht heller. Und dennoch zahlen die Käufer das Dreifache dafür."
 gdp_trade_good_flavor.3009.a: "Verkauft den Bodensatz für Lampen und das gute Öl für die Tische."
 gdp_trade_good_flavor.3009.b: "Lasst die Lampe brennen. Zuerst kommen noch die Rechnungsbücher."
 gdp_trade_good_flavor.3009.c: "Bett. Das Öl kann sich auch ausruhen."
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "Von der Klinge"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "Getreide, das unmittelbar „von der Klinge“ gekauft wurde, war bereits bezahlt worden, als es noch grün auf dem Feld stand, zu einem Preis, der deutlich niedriger war als das, was die Ernte einbringen würde. Prediger und das kanonische Recht verurteilten diese Praxis als versteckte Wucherei."
 gdp_trade_good_flavor.3010.desc.condemned: "Mein Glaube nennt es Wucherei. Mein Hauptbuch nennt es einen Nachlass."
 gdp_trade_good_flavor.3010.desc.permitted: "Manche Glaubensrichtungen nennen es Wucherei. Die meine nennt es vorausschauend."
 gdp_trade_good_flavor.3010.desc.intro: "„Jetzt ist es noch grün, aber im Sommer wird es golden sein“, erklärt mir [tgf_peasant.GetFirstName] aus [tgf_source_county.GetNameNoTier], knietief im Matsch. „Bezahlt mir den heutigen Preis dafür, [Glossary('von der Klinge', 'TGF_IN_THE_BLADE_GLOSS')], und die Ernte gehört Euch.“\n\n"
 gdp_trade_good_flavor.3010.a: "Die Ernte des nächsten Jahres zum diesjährigen Preis."
 gdp_trade_good_flavor.3010.b: "Behaltet Euer Getreide, bis es reif ist."
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "Zehnjährige Hirse"
 gdp_trade_good_flavor.3011.desc: "Hinter dem neueren Bestand entdecke ich Säcke voll Hirse aus längst vergangenen Jahren, vergessen und verzählt. Jedes Korn ist immer noch gut. Hirse hält sich.\n\nWare umsonst von vor meiner Zeit. Das schönste Erbe überhaupt."
 gdp_trade_good_flavor.3011.a: "Verkauft alles. Mein früheres Ich würde es so wollen."
 gdp_trade_good_flavor.3011.b: "Verpackt alles für die Straße. Hirse hält sich."
 gdp_trade_good_flavor.3011.c: "Zählt das ganze Lager erneut."
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "Poliert oder nicht"
 gdp_trade_good_flavor.3012.desc: "Polierter Reis ist weiß, leicht und an jeder hohen Tafel erwünscht. Unpolierter Reis ist schwer, braun und überall sonst erwünscht. [tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], will wissen, zu welcher Art von Kaufleuten ich gehöre.\n\nIch gehöre zu der Art, die bezahlt wird."
 gdp_trade_good_flavor.3012.a: "Poliert ihn. Hohe Tafeln zahlen hohe Preise."
 gdp_trade_good_flavor.3012.b: "Verkauft ihn braun und günstig an jeden."
 gdp_trade_good_flavor.3012.c: "Poliert den besten Teil. Verkauft den Rest braun."
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "Vor dem Fasten"
 gdp_trade_good_flavor.3013.desc: "„[tgf_source_faith.Custom('GetTgfFastName')] beginnt bald!“, schreibt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], eilig aus [tgf_source_county.GetNameNoTier]. „Niemand will Fleisch über Wochen anfassen – und danach wollen sie nichts anderes.“\n\nEin hungriger Käufer feilscht nie."
 gdp_trade_good_flavor.3013.desc_ramadan: "„Der Ramadan beginnt bald!“, schreibt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], eilig aus [tgf_source_county.GetNameNoTier]. „Niemand isst bis Sonnenuntergang, und nach Sonnenuntergang isst niemand irgendetwas außer Fleisch.“\n\nEin hungriger Käufer feilscht nie."
 gdp_trade_good_flavor.3013.a: "Ich faste auch. Das Fleisch kann warten."
 gdp_trade_good_flavor.3013.b: "Salzt es und wartet auf den Hunger."
 gdp_trade_good_flavor.3013.c: "Verkauft es beim letzten Festmahl vor der Fastenzeit."
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "Schaut ihm ins Maul"
 gdp_trade_good_flavor.3014.desc: "[tgf_dealer.GetFirstName|U], [Select_CString(tgf_dealer.IsFemale, 'die Pferdehändlerin', 'der Pferdehändler')], schwört bei allem, was [tgf_dealer.Custom('DE_PRO_PER_S_3P_D')] heilig ist. „Vier Jahre alt, [Select_CString(ROOT.Char.IsFemale, 'meine Freundin', 'mein Freund')], höchstens fünf. Schaut Euch das Fell an!“ Das Fell ist sehr schön. Von den Zähnen, merke ich, hält [tgf_dealer.Custom('DE_PRO_PER_S_3P_N')] mich fern.\n\nEs gibt da dieses Sprichwort zu geschenkten Gäulen. Dieser hier ist kein Geschenk."
 gdp_trade_good_flavor.3014.a: "Weit aufmachen. Lasst uns die Zähne sehen."
 gdp_trade_good_flavor.3014.b: "Alt oder nicht: Das Tier hier gehört mir."
 gdp_trade_good_flavor.3014.c: "Euer Wort genügt. Tretet in meine Gesellschaft ein."
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "Für den Markt gemästet"
 gdp_trade_good_flavor.3015.desc: "„Die Herde erreichte [tgf_source_county.GetNameNoTier] mager und müde, als wären die Tier schon ihr eigenen Geister“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „[tgf_market_holder.GetTitledFirstName|U] hat gute Weideflächen in der Nähe und bietet sie uns an. Gegen eine Gebühr natürlich.“\n\nFett verkauft sich. Gras ist günstiger als Fett."
 gdp_trade_good_flavor.3015.a: "Bezahlt für das Gras. Verkauft das Fett."
 gdp_trade_good_flavor.3015.b: "Magere Tiere haben dennoch einen Preis."
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "Kalbsleder für die Schreiber"
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.GetTitledFirstName|U], [Select_CString(tgf_chaplain.IsFemale, 'Kaplanin', 'Kaplan')] für [tgf_market_holder.GetTitledFirstName], geht durch meine Gerberei wie [Select_CString(tgf_chaplain.IsFemale, 'eine Pilgerin', 'ein Pilger')] auf der Suche nach Reliquien. „Diese hier, dünn geschabt, würden die heiligen Worte für tausend Jahre tragen“, sagt [tgf_chaplain.Custom('DE_PRO_PER_S_3P_N')].\n\nEintausend Jahre meines Leders. Nicht schlecht für eine Kuh."
 gdp_trade_good_flavor.3016.a: "Nehmt die besten. Als Geschenk."
 gdp_trade_good_flavor.3016.b: "Für die Schreiber dann. Möge es lange halten."
 gdp_trade_good_flavor.3016.c: "Ich verkaufe es lieber an die Schuster."
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "Die Schur kaufen"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "Zisterzienserabteien verkauften ihre Wollschur – die Schur des jeweiligen Jahres – an italienische und flämische Kaufleute schon Jahre im Voraus und nahmen Geld für Vliese, die noch nicht gewachsen waren. Viele Häuser versanken dabei tief in Schulden."
 gdp_trade_good_flavor.3017.desc: "„[tgf_abbot.GetTitledFirstName|U] bietet uns für die nächsten Jahre die Wolle von [tgf_abbey.GetNameNoTier] an“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „[Glossary('Jahre der Schuf', 'TGF_WOOL_CLIP_GLOSS')], jetzt bezahlt, geliefert Vlies für Vlies. Sie wollen die Münzen heute.“\n\nSie planen voraus. So wie es Kaufleute machen."
 gdp_trade_good_flavor.3017.a: "Die Münzen heute, die Wolle für Jahre."
 gdp_trade_good_flavor.3017.b: "Ich bevorzuge Schafe, die bereits geschoren sind."
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "Das Pflanzenlamm"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "Eine Legende, die von Reisenden und Gelehrten gleichermaßen erzählt wurde: Im fernen Osten wächst eine Pflanze, die lebende Lämmer an ihren Stängeln trägt, die den Boden um den Halm abgrasen, bis dieser eingeht. Dies war eine Art, Baumwolle zu beschreiben: eine Wolle, die auf Pflanzen wuchs."
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName|U], [Select_CString(tgf_buyer.IsFemale, 'eine Käuferin', 'ein Käufer')] in [tgf_source_county.GetNameNoTier], dreht staunend ein Büschel meiner Baumwolle hin und her. „Ist es wahr? Man sagt, es wächst auf einer Pflanze, die kleine Lämmchen trägt, die so lange grasen, bis der Stängel bricht.“\n\n[Glossary('Das Pflanzenlamm', 'TGF_VEGETABLE_LAMB_GLOSS')]. Wunder verkaufen sich."
 gdp_trade_good_flavor.3018.a: "Jedes Wort ist wahr. Und die Pflanze ist äußerst selten."
 gdp_trade_good_flavor.3018.b: "Keine Lämmer. Nur eine sehr flauschige Pflanze."
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "Spolien"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "Steine werden alten Gebäuden entnommen und in neuen verwendet. Säulen, Verzierungen und gravierte Steine aus antiken Ruinen fanden so ihren Weg in Kirchen, Mauern und Häuser überall in der mittelalterlichen Welt."
 gdp_trade_good_flavor.3019.desc: "„Die Steinbrucharbeiter haben aufgehört, Steine im Bruch zu schneiden“, gesteht [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], in einem Brief aus [tgf_source_county.GetNameNoTier]. „Sie schneiden sie stattdessen aus den alten Ruinen heraus: Säulen, Schnitzereien, alles.“\n\n[Glossary('Spolien', 'TGF_SPOLIA_GLOSS')]. Alte Steine, neue Preise."
 gdp_trade_good_flavor.3019.a: "Antike Steine zu antiken Preisen."
 gdp_trade_good_flavor.3019.b: "Behaltet die schönste Schnitzerei für mich."
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "Der Maststamm"
 gdp_trade_good_flavor.3020.desc: "„Die Schiffsbauer von [tgf_market_holder.GetTitledFirstName] wollen unsere Ware ([tgf_good.Custom('GetTradeGood')])“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')]. „Aber nicht irgendein Holz. Sondern den längsten und geradesten Stamm, den wir haben. Für die Masten. Sie wissen, dass perfektes Holz selten ist.“\n\nSeltene Dinge sollten nie überstürzt verkauft werden."
 gdp_trade_good_flavor.3020.a: "Der beste Stamm ist für mein eigenes Schiff."
 gdp_trade_good_flavor.3020.b: "Verkauft. Masten warten auf niemanden."
 gdp_trade_good_flavor.3020.c: "Lasst sie warten. Der Preis wird steigen."
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "Das Rauchzelt"
 gdp_trade_good_flavor.3021.t_bhang: "Ein Becher Bhang"
 gdp_trade_good_flavor.3021.t_hashish: "Süßes hinter verschlossenen Türen"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "Herodot schrieb, dass die Skythen in geschlossenen Filzzelten Hanf auf glühend heiße Steine warfen und glückselig im Rauch heulten. Die Völker der Steppe behielten den Brauch noch lange bei."
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.Custom('DE_PRO_PER_S_3P_N')|U] wirft Hanfsamen auf die heißen Steine in [tgf_hemp_host.Custom('DE_PRO_POS_S_3P')]em Zelt, und der Rauch steigt auf. „[Glossary('Atmet tief ein', 'TGF_HEMP_TENT_GLOSS')], [Select_CString(ROOT.Char.IsFemale, 'Kauffrau', 'Kaufmann')]. So machen wir hier Geschäfte.“\n\nNatürlich. Nur aus Geschäftsgründen."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "Die Atharvaveda zählen Bhang zu den fünf heiligen Pflanzen. Hanfblätter werden gerieben und mit Milch, Ghee und Gewürzen bei Festen getrunken und Shiva dargeboten."
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.Custom('DE_PRO_PER_S_3P_N')|U] zerreibt Hanfblätter mit Milch und Gewürzen und gibt mir einen Becher. „[Glossary('Bhang', 'TGF_HEMP_BHANG_GLOSS')], [Select_CString(ROOT.Char.IsFemale, 'Kauffrau', 'Kaufmann')]. Bei Festen trinkt das die ganze Stadt. So wie Ihr heute.“\n\nAblehnen wäre unhöflich, und Unhöflichkeit ist schlecht fürs Geschäft."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "Haschisch – Hanfharz, das in Pasten und Süßigkeiten gegessen wurde – verbreitete sich in Ägypten und Syrien ab dem 12. Jahrhundert. Einige Sufis priesen es als den Weg zur Ekstase, wohingegen Rechtsgelehrte es verurteilten und Herrscher ganze Felder verbrennen ließen."
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.Custom('DE_PRO_PER_S_3P_N')|U] schließt die Tür und packt kleine Süßigkeiten aus gepresstem Hanfharz aus. „[Glossary('Haschisch', 'TGF_HEMP_HASHISH_GLOSS')], [Select_CString(ROOT.Char.IsFemale, 'Kauffrau', 'Kaufmann')]. Die Rechtsgelehrten lehnen es ab. Sie sind aber nicht hier.“\n\nEs wäre unhöflich, [Select_CString(tgf_hemp_host.IsFemale, 'eine Käuferin', 'einen Käufer')] abzuweisen."
 gdp_trade_good_flavor.3021.desc.intro: "„[tgf_good.Custom('GetTradeGood')|U] [tgf_good.Custom('GetTgfHempUse')]?“, lacht [tgf_hemp_host.GetTitledFirstName] aus [tgf_source_county.GetNameNoTier]. „Wir haben einen besseren Nutzen dafür.“\n\n"
 gdp_trade_good_flavor.3021.a: "Geschäft ist Geschäft. Gebt den Samen rüber."
 gdp_trade_good_flavor.3021.a_bhang: "Geschäft ist Geschäft. Gebt den Becher rüber."
 gdp_trade_good_flavor.3021.a_hashish: "Geschäft ist Geschäft. Gebt die Süßigkeiten rüber."
 gdp_trade_good_flavor.3021.b: "Verkauft es. Ich behalte einen klaren Kopf."
 gdp_trade_good_flavor.3021.a.toast_habit: "Ein neuer Brauch"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "Eine Klinge von meinen Besten"
 gdp_trade_good_flavor.3022.desc: "[tgf_smith.GetFirstName], [Select_CString(tgf_smith.IsFemale, 'eine Schmiedin', 'ein Schmied')] aus [tgf_source_county.GetNameNoTier], wiegt einen meiner Eisenbarren in der Hand und grinst. „Gebt mir den besten von diesen, und ich werde Euch eine Klinge schmieden, die zehnmal mehr wert ist als das Metall.“\n\nZehnmal. [tgf_smith.Custom('DE_PRO_PER_S_3P_N')|U] weiß, wie man mit Kaufleuten reden muss."
 gdp_trade_good_flavor.3022.a: "Schmiedet es. Macht es der Prahlerei würdig."
 gdp_trade_good_flavor.3022.b: "Lehrt mich, welche Barren die besten sind."
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "Der Anspruch des Edelsteinschleifers"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "Ein Schneider und Polierer von Edelsteinen und oft auch ein Leser von Lapidarien: Bücher, die die verborgenen Kräfte jedes Steins benennen, von Saphiren gegen Gift über Amethyste gegen Trunkenheit."
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U], ein [Glossary('Edelsteinschneider', 'TGF_LAPIDARY_GLOSS')] aus [tgf_source_county.GetNameNoTier], hält einen meiner Steine mit großer Ernsthaftigkeit ins Licht. „Dieser Stein hält [ROOT.Char.Custom('GetTgfAilment')] fern. Es steht in den Büchern.“\n\nEs steht nicht auf dem Preis. Noch nicht."
 gdp_trade_good_flavor.3023.a: "Mit dem Anspruch verkauft. Und entsprechend bepreist."
 gdp_trade_good_flavor.3023.b: "Tretet meiner Gesellschaft bei. Bringt Eure Bücher mit."
 gdp_trade_good_flavor.3023.c: "Ich werde mich nicht mit den Büchern streiten."
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "Der Herrenstein"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], [Select_CString(tgf_connoisseur.IsFemale, 'eine Kennerin', 'ein Kenner')] von Jade, klopft mit jedem meiner Stücke gegen [tgf_connoisseur.Custom('DE_PRO_POS_S_3P')]e Zähne und lauscht. Zwei legt [tgf_connoisseur.Custom('DE_PRO_PER_S_3P_N')] zur Seite. „Speckstein. Sehr guter Speckstein.“ Der Rest erhält ein langsames, zustimmendes Nicken.\n\nJemand, der richtig von falsch unterscheiden kann, ist wertvoll."
 gdp_trade_good_flavor.3024.a: "Zerstört die falschen. Nennt den Lieferanten."
 gdp_trade_good_flavor.3024.b: "Tretet in meine Gesellschaft ein. Euer Auge ist den Lohn wert."
 gdp_trade_good_flavor.3024.c: "Bringt mir den Kniff mit den Zähnen bei."
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "Porzellanballast"
 gdp_trade_good_flavor.3025.desc: "[tgf_trader.GetFirstName|U], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], ist äußerst zufrieden mit sich. „Das Schiff brauchte Ballast – und unsere [tgf_good.Custom('GetTradeGoodUnitPlural')] mit Keramik sind schwer. Der Kapitän berechnet uns fast nichts.“\n\nFracht, die die eigene Überfahrt bezahlt. Das ist mir am liebsten."
 gdp_trade_good_flavor.3025.a: "Bezahlt mit dem Ersparten die nächste Fracht."
 gdp_trade_good_flavor.3025.b: "Lernt, es als Ballast zu verstauen."
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "Das Harz beißt"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "Lack trocknet nicht an der Luft. Jede Schicht Baumharz muss tagelang in einem warmen, feuchten Raum aushärten und ein edles Stück benötigt Dutzende von Schichten. Bis es ausgehärtet ist, lässt das Harz jede Haut Blasen schlagen, die es berührt."
 gdp_trade_good_flavor.3026.desc: "Die neue Lackierware kam an, bevor die letzte Schicht [Glossary('ganz heil und trocken war', 'TGF_LACQUER_CURE_GLOSS')]. Der Abschluss sieht perfekt aus: tief in der Farbe, glänzend und fast feucht. Meine Finger wollen das Material berühren.\n\nDie Lackmacher sagen, das Harz beiße. Ich vermute, sie übertreiben."
 gdp_trade_good_flavor.3026.a: "Baut einen Feuchtraum, um es richtig auszuhärten."
 gdp_trade_good_flavor.3026.b: "Eine kleine Berührung. Nur um sicher zu sein."
 gdp_trade_good_flavor.3026.b.toast_rash: "Der Lack beißt"
 gdp_trade_good_flavor.3026.c: "Lasst alles aushärten. Gut Ding will Weile haben."
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "Lesesteine"
 gdp_trade_good_flavor.3027.desc.intro: "[tgf_glassmaker.GetFirstName|U], [Select_CString(tgf_glassmaker.IsFemale, 'eine Glasbläserin', 'ein Glasbläser')] aus [tgf_source_county.GetNameNoTier], legt zwei polierte Steine auf mein Hauptbuch. Die kleinen Zahlen werden größer, schärfer und dunkler. „Für alte Augen, [Select_CString(tgf_glassmaker.IsFemale, 'meine Freundin', 'mein Freund')]. Oder für müde.“\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "Meine sind beides. Zum ersten Mal seit Jahren kann ich das Kleingedruckte unter jedem Vertrag lesen."
 gdp_trade_good_flavor.3027.desc.young_eyes: "Meine Augen sind nichts davon. Doch ich kann nun das Kleingedruckte unter jedem Vertrag lesen."
 gdp_trade_good_flavor.3027.a: "Ein Paar ist für mich. Verpackt es gut."
 gdp_trade_good_flavor.3027.b: "Schickt ein Paar an [tgf_market_holder.GetTitledFirstNameNoTooltip]."
 gdp_trade_good_flavor.3027.c: "Nicht die Steine. Das Geheimnis dahinter."
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "Festtagspreise"
 gdp_trade_good_flavor.3028.desc.christian: "„Die heiligen Tage stehen an“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], gerade zurück aus [tgf_source_county.GetNameNoTier]. „Jeder Käufer will Weihrauch für die Heiligen Drei Könige, und niemand feilscht darüber, was auf dem Altar verbrannt wird.“\n\n"
 gdp_trade_good_flavor.3028.desc: "„Die heiligen Tage stehen an“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], gerade zurück aus [tgf_source_county.GetNameNoTier]. „Jeder Käufer will Weihrauch für den heiligsten Schrein, und niemand feilscht darüber, was auf dem Altar verbrannt wird.“\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "Ein Käufer, der nicht feilscht, ist ein Geschenk der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])."
 gdp_trade_good_flavor.3028.a: "Ich werde selbst etwas verbrennen. Für das Fest."
 gdp_trade_good_flavor.3028.b: "Der Tempel darf zuerst auswählen. Zum Einkaufspreis."
 gdp_trade_good_flavor.3028.c: "Festliche Tage, festliche Preise."
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "Theriak"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "Ein berühmtes Allheilmittel, aus Dutzenden von Zutaten gebraut, das oft Schlangenfleisch und Opium enthielt und jahrelang reifte. Ärzte verschrieben es gegen Vergiftungen, Seuchen und nahezu alles andere."
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U], [Select_CString(tgf_apothecary.IsFemale, 'eine Apothekerin', 'ein Apotheker')] aus [tgf_source_county.GetNameNoTier], schickt ein Schreiben, das nach Kräutern riecht. „Eure Ware ist genau das, was ich für [Glossary('Theriak', 'TGF_THERIAC_GLOSS')] benötige. Gegen Vergiftungen, Seuchen und jede andere Krankheit.“\n\nOb es wirkt, wissen nur [tgf_apothecary.Custom('DE_PRO_PER_S_3P_N')] und [tgf_apothecary.Custom('DE_PRO_POS_S_3P')]e Patienten. Mein Teil ist der Verkauf."
 gdp_trade_good_flavor.3029.a: "Braut es und verkauft es entlang meiner Straßen."
 gdp_trade_good_flavor.3029.b: "Alle vierundsechzig Zutaten. Von mir."
 gdp_trade_good_flavor.3029.c: "Bringt mir das Rezept bei. Und gebt mir eine Dosis."
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "Kein Papier für die Chartas"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "1231 verbot Kaiser Friedrich II. den Notaren seines Konigreichs Sizilien, öffentliche Dokumente auf Papier zu schreiben, denn er glaubte, es wäre zu anfällig, als dass man ihm Vertrauen schenken könnte. Nur Pergament wäre ausreichend."
 gdp_trade_good_flavor.3030.desc: "„Die Angestellten von [tgf_market_holder.GetTitledFirstName] [Glossary('rühren kein Papier an', 'TGF_PAPER_GLOSS')] für irgendetwas Offizielles“, erzählt mir [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale, 'meine Händlerin', 'mein Händler')], gerade zurück aus [tgf_source_county.GetNameNoTier] und immer noch empört. „Nur Pergament, sagen sie. Als ob es heilig wäre.“\n\nÜber jede Regel kann man sich streiten."
 gdp_trade_good_flavor.3030.a: "Verteidigt die Sache. Papier ist die Zukunft."
 gdp_trade_good_flavor.3030.a.success: "Die Kanzlei nimmt Papier"
 gdp_trade_good_flavor.3030.a.failure: "Die Kanzlei bleibt bei Pergament"
 gdp_trade_good_flavor.3030.b: "Dann werden sie mein Pergament kaufen."
 gdp_trade_good_flavor.3030.c: "Dann werde ich herausfinden, was sie wollen."
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "Grut oder Hopfen"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "Eine Mischung aus Kräutern wie Gagelstrauch und Schafgarbe, die vor dem Hopfen dem Bier Geschmack gaben und es konservierten. Viele Herrscher hielten das alleinige Recht, es zu verkaufen, und besteuerten so jeden, der es braute."
 gdp_trade_good_flavor.3031.desc: "„Hopfen“, flüstert [tgf_brewer.GetFirstName], [Select_CString(tgf_brewer.IsFemale, 'eine Brauerin', 'ein Brauer')] aus [tgf_source_county.GetNameNoTier], über meine Fässer hinweg. „Bier, das sich über Monate hält. Und niemand kann Hopfen besteuern.“ In [tgf_source_county.GetNameNoTier] muss jeder Brauer [Glossary('Grut', 'TGF_GRUIT_GLOSS')] von [tgf_market_holder.GetTitledFirstName] kaufen und zahlt [tgf_market_holder.Custom('DE_PRO_PER_S_3P_D')] darauf Steuern.\n\nIrgendjemand zahlt immer für den Fortschritt."
 gdp_trade_good_flavor.3031.a: "Hopfen also. Lasst ihn reisen."
 gdp_trade_good_flavor.3031.b: "Grut, wie man es als [tgf_market_holder.GetTitleAsNameNoTooltip] bevorzugt."
 gdp_trade_good_flavor.3031.c: "Etwas von beidem in jedem Fass."
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "Ein Korb voller Früchte"
 gdp_trade_good_flavor.3032.desc: "In [tgf_source_county.GetNameNoTier] werden [tgf_fruit_province.Custom('get_region_fruit_plural')] körbeweise gegessen und kaum etwas davon reist weiter als bis zum nächsten Dorf.\n\nGetrocknet würden sie sich halten. Verschifft würden sie sich verkaufen. Ich probiere davon und greife nach meinem Hauptbuch."
 gdp_trade_good_flavor.3032.a: "Findet heraus, wer sie anbaut und wie viel."
 gdp_trade_good_flavor.3032.b: "Noch ein Stück. Für die Forschung."
