l_german:
 gdp_republic_unrest.0001.t: "Hauptsitzaufstand: Die Missstände"
 gdp_republic_unrest.0001.desc: "Ein Gruppe von Arbeitern und Zunftgesellen hat sich im Hof versammelt. Einer von ihnen tritt vor. „Herr[ROOT.Char.Custom('DE_END_NOU_S_GS_N')], die Steuern lassen uns verarmen …“\n\nIch kenne das alles schon. Sie sind nicht die Ersten noch werden sie die Letzten sein, die diese Beschwerden an meiner Türschwelle vorbringen."
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "Wachen! Schafft diese … Leute weg."
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "Ich werde nicht mit Bauern verhandeln."
 gdp_republic_unrest.0001.b.success: "Der Protest löst sich ohne weitere Widrigkeiten auf"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "Die Weigerung macht sie wütend"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "Soll der Rat sich damit befassen."
 gdp_republic_unrest.0001.c.success: "Sie sind fürs Erste überzeugt"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "Sie durchschauen die Verzögerung"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "Ich werde Zugeständnisse machen. Dieses eine Mal."
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "Hauptsitzaufstand: Frostiger Empfang"
 gdp_republic_unrest.0011.desc: "Als ich über die Märkte gehe, höre ich das übliche laute Stimmengewirr, aber dennoch fühlt sich irgendetwas anders an als sonst. Die Stände halten inne, die Leute verstummen und blicken mich unbehaglich an.\n\nSeit Jahren gehe ich diese Straßen entlang, und niemals zuvor war es so wie heute."
 gdp_republic_unrest.0011.a: "Ich bin sicher, das bilde ich mir nur ein."
 gdp_republic_unrest.0011.b: "Schickt jemanden, um den Gerüchten auf den Grund zu gehen."
 gdp_republic_unrest.0011.b.success: "Meine Leute finden den Ursprung"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "Die Gerüchte bleiben bestehen"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "Ich werde stehen bleiben und mit den Leuten reden."
 gdp_republic_unrest.0011.c.success: "Die Leute sind dankbar für die Geste"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "Niemand möchte reden"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "Verteilt Essen und Wein – was auch immer nötig ist."
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "Hauptsitzaufstand: Der anonyme Brief"
 gdp_republic_unrest.0021.desc: "Ein Brief liegt auf meinem Schreibtisch, als ich an diesem Morgen ankomme. Er trägt weder Siegel noch Namen. Er beschreibt detailliert, wie viel schlimmer es in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] wurde, seit ich [ROOT.Char.GetTitleAsName] bin."
 gdp_republic_unrest.0021.a: "Werft ihn ins Feuer."
 gdp_republic_unrest.0021.b: "Jemand machte sich Mühe damit. Findet heraus, wer das war."
 gdp_republic_unrest.0021.b.success: "Der Verfasser wurde ermittelt"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "Der Verfasser bleibt unbekannt"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "Ich werde eine öffentliche Antwort geben."
 gdp_republic_unrest.0021.c.success: "Die Antwort wird gut aufgenommen"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "Die Antwort wird gehasst"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "Hauptsitzaufstand: Der Platz gehört nun ihnen"
 gdp_republic_unrest.0101.desc: "„Herr[ROOT.Char.Custom('DE_END_NOU_S_GS_N')], irgendwelche Bürger haben die Kontrolle über den Markplatz an sich gerissen … seit Tagen schon“, setzt mich eine meiner Wachen in Kenntnis. „Es scheint, dass eine Person namens [demagogue.GetFirstName] die Leute lautstark aufstachelt.“\n\nWofür bezahle ich diese Narren eigentlich, wenn der Markt tagelang geschlossen bleiben kann und es mir niemand sagt?"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "Räumt endlich den Platz!"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "Bringt [Select_CString(demagogue.IsFemale, 'diese Demagogin', 'diesen Demagogen')] in Misskredit."
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName|U] wird in Misskredit gebracht"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "Meine Versuche scheitern"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "Ich werde selbst mit ihnen reden."
 gdp_republic_unrest.0101.c.success: "Die Menge geht auseinander"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "Ich bin lautem Spott ausgesetzt"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "Gebt ihnen einfach, was sie wollen."
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "Hauptsitzaufstand: Das geschlossene Viertel"
 gdp_republic_unrest.0111.desc: "Mich erreichte die Kunde, dass sich ein gewisses Viertel ([closed_district.GetType.CalcTriggeredName(ROOT.Char.GetCapitalLocation)]) vollständig abgeschottet hat. Man weigert sich, unsere Steuereintreiber anzuerkennen und hört nicht auf unsere Wachen."
 gdp_republic_unrest.0111.a: "Schickt ein paar Wachen mit diesen Steuereintreibern mit."
 gdp_republic_unrest.0111.b: "Bezahlen wir sie."
 gdp_republic_unrest.0111.b.success: "Sie bekommen, was sie wollen"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "Sie verweigern Verhandlungen"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "Ich gehe dort hin und rede selbst mit ihnen."
 gdp_republic_unrest.0111.c.success: "Sie hören zu"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "Sie weigern sich, zuzuhören"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "Irgendwann werden sie müde werden. Hoffentlich."
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "Hauptsitzaufstand: Das Abbild"
 gdp_republic_unrest.0121.desc: "Als ich durch die Straßen gehe, lässt mich etwas jäh innehalten: eine hässliche Puppe, die in etwas gekleidet ist, was meiner Kleidung ähnelt, und die für alle sichtbar aufgehängt wurde. Die Menge ist ruhig und betrachtet erst die Puppe, dann mich.\n\n„Vollkommen lebensecht!“, schreit jemand weiter hinten und lauter Jubel erklingt aus der Menge."
 gdp_republic_unrest.0121.a: "Nehmt sie runter! SOFORT!"
 gdp_republic_unrest.0121.a.flavor: "Ich werde sicherstellen, dass niemand darüber spricht, was er gesehen hat."
 gdp_republic_unrest.0121.b: "Findet heraus, wer dahintersteckt."
 gdp_republic_unrest.0121.b.success: "Mit den Organisatoren wurde abgerechnet"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "Man ist nicht in der Lage, die Organisatoren ausfindig zu machen"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "Ich werde das öffentlich ansprechen."
 gdp_republic_unrest.0121.c.success: "Leute hören zu"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "Die Menge jubelt und buht"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "Würdigt diese Sache keiner Antwort."
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "Hauptsitzaufstand: Die Stadt brennt"
 gdp_republic_unrest.0201.desc: "Ich sehe, dass der Rauch, der vor den Wachen aufsteigt, mich erreicht. „Herr[ROOT.Char.Custom('DE_END_NOU_S_GS_N')], [Select_CString(demagogue.IsFemale, 'eine Demagogin', 'ein Demagoge')] mit Namen [demagogue.GetFirstName] überzeugte die Leute, in einem der Stadtbezirke Feuer zu legen.“\n\nWas geschieht mit meiner Stadt?"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "Weckt die ganze Kaserne. Regelt das."
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "Sattelt mein Pferd!"
 gdp_republic_unrest.0201.b.success: "Die Aufständischen laufen auseinander"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "Ich muss zurück in den Palast fliehen"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "Ich werde sie auf dem Platz treffen."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "Die Menge wendet sich gegen mich"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "Gebt ihnen die ganze Schatzkammer, wenn nötig."
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "Hauptsitzaufstand: Der Streik"
 gdp_republic_unrest.0211.desc: "Als ich über die Märkte gehe, ist der Streik sofort zu bemerken. Es gibt niemanden, der seine Waren anpreist, die Stände sind leer und die Werkstätten ruhig.\n\nEs wird deutlich, dass die Zünfte eine Entscheidung untereinander trafen, an die sich all ihre Arbeiter halten."
 gdp_republic_unrest.0211.a: "Bringt die Zunftmeister zum Gespräch."
 gdp_republic_unrest.0211.a.success: "Es wird eine Übereinkunft erzielt"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "Sie verweigern ein Erscheinen"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "Wir bezahlen sie. Dieses eine Mal."
 gdp_republic_unrest.0211.b.success: "Ein Preis wird vereinbart"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "Sie lehnen meinen Kompromiss ab"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "Schickt sie zurück an die Arbeit. Sofort."
 gdp_republic_unrest.0211.d: "Gebt ihren Forderungen nach."
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "Hauptsitzaufstand: Das Manuskript"
 gdp_republic_unrest.0221.desc: "„Herr[ROOT.Char.Custom('DE_END_NOU_S_GS_N')], sie … verteilen nun die hier,“ teilt mir einer meiner Leibwächter mit, als er mir ein Manuskript reicht. „Sie sind überall in der Stadt zu finden.“\n\nEs ist sehr detailreich, und ich werde sowohl persönlich beleidigt als auch aller Arten von Sünden bezichtigt."
 gdp_republic_unrest.0221.a: "Findet und kümmert Euch um denjenigen, der dies schrieb."
 gdp_republic_unrest.0221.a.success: "Die Quelle wird gefunden und zum Schweigen gebracht"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "Der Verfasser bleibt unbekannt"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "Ich werde das öffentlich zurückweisen."
 gdp_republic_unrest.0221.b.success: "Die Anschuldigungen vestummen langsam"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "Die Leute beschimpfen mich"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "Kauft jedes Exemplar."
 gdp_republic_unrest.0221.d: "Solche Dinge vergehen von allein."
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "Hauptsitzaufstand: Vor den Toren"
 gdp_republic_unrest.0301.desc: "Mehrere Leibwächter wecken mich, um mir mitzuteilen, dass ein Mob hinter uns her ist. Als ich durch meine Hallen gehe, sehe ich, wie leer sie sind … Die meisten meiner Wachen scheinen mich verlassen zu haben.\n\nAls ich aus dem Fenster blicke, sehe ich die Meute sich langsam nähern, schreiend und jubelnd. Der Mob sucht nach mir."
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "Nur [Select_CString(ROOT.Char.IsFemale, 'eine Frau ist die wahre', 'Nur ein Mann ist der wahre')] [ROOT.Char.GetTitleAsNameNoTooltip]. Kommt und holt [ROOT.Char.Custom('DE_PRO_PER_S_3P_A')]."
 gdp_republic_unrest.0301.a.success: "Ich metzele sie alle nieder, bis schließlich nur noch meine zitternden Hände und der stumme blutige Palast übrig sind"
 gdp_republic_unrest.0301.a.fail: "Ich falle dem Pöbel zum Opfer"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "Sie werden mich niemals lebendig bekommen!"
 gdp_republic_unrest.0301.b.success: "Meine Mannen und ich schlagen uns nach draußen durch"
 gdp_republic_unrest.0301.b.fail: "Wir sind in der Unterzahl"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "Verschwindet durch das Dienstbotentor."
 gdp_republic_unrest.0301.c.success: "Ich kann mich davonstehlen"
 gdp_republic_unrest.0301.c.fail: "Ich werde gefasst"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "Meine Herrschaft ist vorbei."
 gdp_republic_unrest.0301.d.flavor: "Ans Fenster treten und meinen Rücktritt verkünden. Danach unbewaffnet hinausgehen und beten, dass sie mich am Leben lassen."
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "Hauptsitzaufstand: Das große Schweigen"
 gdp_republic_unrest.0302.desc: "Im Palast ist es nun ruhig.\n\nDie Leiber wurden nicht angerührt, und die Tore sind noch so geöffnet, wie sie es waren, als der letzte der Rebellen floh. Meine Hände haben das Zittern weitgehend eingestellt.\n\nIch bin immer noch hier."
 gdp_republic_unrest.0302.a: "Ich stehe … noch immer aufrecht?"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "Hauptsitzaufstand: Ein neuer Name, ein neues Leben"
 gdp_republic_unrest.0303.desc: "Ich bin am Leben.\n\nDie Stadt liegt nun hinter mir, und niemand auf dieser Straße weiß, wer ich bin. Der Titel ist verloren, der Palast ist verloren, und alles, was mich seit Jahren ausmachte, ist verloren.\n\nUnd dennoch habe ich überlebt, und das muss doch etwas wert sein. Wo gehe ich nun hin?"
 gdp_republic_unrest.0303.a: "Macht Euch auf den Weg nach [destination_a.GetNameNoTierNoTooltip]. Ein neuer Anfang wartet auf Euch."
 gdp_republic_unrest.0303.a.tt: "Nach [destination_a.GetNameNoTier] reisen und meinen Wohnsitz dorthin verlegen"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip|U] ist weit genug weg. Ich kann dort alles neu aufbauen."
 gdp_republic_unrest.0303.b.tt: "Nach [destination_b.GetNameNoTier] reisen und meinen Wohnsitze dorthin verlegen"
 gdp_republic_unrest.0303.c: "Irgendwohin, wo niemand meinen Namen kennt. [destination_c.GetNameNoTierNoTooltip|U] ist gut."
 gdp_republic_unrest.0303.c.tt: "Nach [destination_c.GetNameNoTier] reisen und meinen Wohnsitz dorthin verlegen"
 gdp_republic_unrest.0303.d: "Ich weiß nicht, wo ich hingehen soll. Ich werde bleiben und mich nützlich machen."
 gdp_republic_unrest.0303.tt: "Ersetzt alle [domicile_buildings|E]"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[Select_CString(old_doge.IsFemale, 'Die', 'Der')] [old_doge.GetTitleAsNameNoTooltip] ist gefallen"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName|U] ist tot. [old_doge.Custom('DE_PRO_PER_S_3P_N')] fiel während des Aufstands, und der Palast ist nun leer.\n\nWas nun kommt, ist völlig ungewiss."
 gdp_republic_unrest.0304.a: "Das ändert alles."
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[Select_CString(old_doge.IsFemale, 'Die', 'Der')] [old_doge.GetTitleAsNameNoTooltip] ist verschwunden"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName|U] ist fort. Keine Leiche, kein Lebwohl. [old_doge.Custom('DE_PRO_PER_S_3P_N')|U] verschwand einfach in der Nacht, während der Pöbel vor den Toren stand.\n\nWas nun kommt, ist völlig ungewiss."
 gdp_republic_unrest.0305.a: "Das ändert alles."
 gdp_republic_unrest.0306.t: "Hauptsitzaufstand: Eine neue Stadt, ein neues Leben"
 gdp_republic_unrest.0306.desc: "Die Straße hinter mir ist lang, und ich versuche, nicht zurückzublicken.\n\nHier kennt noch niemand meinen Namen. Die Märkte sind ungewohnt, die Gesichter noch fremder. Doch hier lässt sich Geld machen, lassen sich Bündnisse schließen und lässt sich aus dem wenigen, was mir blieb, ein neues Leben aufbauen."
 gdp_republic_unrest.0306.a: "Zeit, sich an die Arbeit zu machen."
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "Hauptsitzaufstand: [Select_CString(assassin.IsFemale, 'Eine Meuchlerin', 'Ein Meuchler')] auf dem Platz"
 gdp_republic_unrest.0311.desc: "Als ich über den Markt gehe, teilt sich die Menge vor mir. Das laute Stimmengewirr erstirbt. Ich sehe, wie eine Gestalt mit gezückter Klinge plötzlich auf mich zukommt.\n\nMeine Wachen sind zu weit entfernt, um zu helfen, aber mir bleibt nur ein Wimpernschlag, um auf die Gefahr zu antworten."
 gdp_republic_unrest.0311.a: "Wo ist meine Klinge?!"
 gdp_republic_unrest.0311.a.success: "Ich schaffe es gerade noch, mich zu verteidigen"
 gdp_republic_unrest.0311.a.fail: "[assassin.Custom('DE_PRO_PER_S_3P_N')|U] erreicht mich, bevor meine Wachen zur Stelle sind"
 gdp_republic_unrest.0311.b: "Ich muss hier verschwinden. Sofort."
 gdp_republic_unrest.0311.b.success: "Ich schaffe es, [Select_CString(assassin.IsFemale, 'der Meuchlerin', 'dem Meuchler')] zu entkommen"
 gdp_republic_unrest.0311.b.fail: "Ich kann nirgendwo hin"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "Hauptsitzaufstand: Noch nicht besiegt"
 gdp_republic_unrest.0312.desc: "In dem Chaos hat sich die Menge zerstreut und wider Erwarten bin ich noch am Leben.\n\nIch blicke auf die Leiche [Select_CString(assassin.IsFemale, 'der Meuchlerin', 'des Meuchlers')], nachdem die Wachen eintrafen und sich um [assassin.Custom('DE_PRO_PER_S_3P_A')] kümmerten. [assassin.Custom('DE_PRO_PER_S_3P_N')|U] sieht aus wie jeder andere Kunsthandwerker in der Stadt.\n\nWo soll ich sicher sein, wenn sogar gewöhnliche Bürger versuchen, mich zu töten?"
 gdp_republic_unrest.0312.a: "Ich … Ich muss nach Hause gehen."
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "Hauptsitzaufstand: Blut für Blut"
 gdp_republic_unrest.0321.desc: "Ein Bote wird spät nachts in mein Schreibzimmer geführt, mit einem Brief in der Hand.\n\nMein[heir.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetFirstName] wird von ein paar Aufständischen in der Stadt festgehalten, und sollte ich nicht bis zum Morgen verschwunden sein, werden sie [heir.Custom('DE_PRO_POS_S_3P')]e Leiche zurück zu meinem Herrenhaus schicken."
 gdp_republic_unrest.0321.rival: "Sie können [heir.Custom('DE_PRO_PER_S_3P_A')] haben."
 gdp_republic_unrest.0321.a: "Ruft die Wachen. Bringt [heir.Custom('DE_PRO_PER_S_3P_A')] zurück."
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U] überlebt"
 gdp_republic_unrest.0321.a.success: "Meine Mannen retten [heir.Custom('DE_PRO_PER_S_3P_A')] rechtzeitig"
 gdp_republic_unrest.0321.a.fail: "Sie sind zu spät"
 gdp_republic_unrest.0321.b: "Findet heraus, wo sie [heir.Custom('DE_PRO_PER_S_3P_A')] festhalten."
 gdp_republic_unrest.0321.b.success: "Sie spüren [heir.Custom('DE_PRO_PER_S_3P_A')] auf"
 gdp_republic_unrest.0321.b.fail: "[heir.Custom('DE_PRO_PER_S_3P_N')|U] kann nicht gefunden werden"
 gdp_republic_unrest.0321.c: "Jede Münze, die ich habe. Gebt [heir.Custom('DE_PRO_PER_S_3P_A')] einfach nur zurück."
 gdp_republic_unrest.0321.d: "Der Titel bedeutet nichts ohne [heir.GetFirstNameNoTooltip]."
 gdp_republic_unrest.0321.d.flavor: "Wenn es [heir.Custom('DE_PRO_PER_S_3P_A')] rettet, ist es den Preis wert."
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "Hauptsitzaufstand: Sicher davongekommen"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip|U] kommt durch die Tür in mein Schreibzimmer, mit einem kleinen zittrigen Lächeln. [heir.Custom('DE_PRO_PER_S_3P_D')|U] geht es gut, [heir.Custom('DE_PRO_PER_S_3P_N')] hat überlebt. Für den Moment ist das alles, was zählt.\n\nIch muss dafür sorgen, dass das nicht wieder geschieht."
 gdp_republic_unrest.0322.desc.rival: "Ein Bediensteter kommt mit Neuigkeiten in mein Zimmer. [heir.GetFirstNameNoTooltip|U] ist zurück.\n\nGut, die Erbfolge bleibt vorerst gesichert. Ich muss dafür sorgen, dass das nicht wieder geschieht."
 gdp_republic_unrest.0322.a: "Oh, Ihr seid zurück!"
 gdp_republic_unrest.0322.a.rival: "Gut. Nun können wir uns wieder dem Geschäft widmen."
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "Hauptsitzaufstand: Zu spät"
 gdp_republic_unrest.0323.desc: "Nach Einbruch der Nacht klopft es am Tor. Ich höre draußen Stimmen, dann herrscht Stille.\n\nAls ich den Hof erreiche, weiß ich es schon. [heir.GetFirstNameNoTooltip|U] ist dort, auf den Steinen abgelegt. Der Mob schickte nach Hause, was von [heir.Custom('DE_PRO_PER_S_3P_D')] übrig ist."
 gdp_republic_unrest.0323.desc.rival: "Als ich den Hof erreiche, weiß ich es schon.\n\n[heir.GetFirstNameNoTooltip|U] ist dort, auf den Steinen abgelegt. Der Pöbel schickte nach Hause, was noch von [heir.Custom('DE_PRO_PER_S_3P_D')] übrig ist. Ich stehe dort eine lange Zeit und schaue auf die sterblichen Überreste [Select_CString(heir.IsFemale, 'meiner Erbin', 'meines Erben')]."
 gdp_republic_unrest.0323.a.child: "Schaut, wie sie [Select_CString(heir.IsFemale, 'mein Mädchen', 'meinen Jungen')] zugerichtet haben …"
 gdp_republic_unrest.0323.a: "Was haben sie Euch angetan, [heir.GetFirstNameNoTooltip]?"
