l_german:
 gdp_merchant_family.0001.t: "[house_member.Custom('GetBrideGroom')|U]: Ausgebüxt"
 gdp_merchant_family.0001.desc: "Ein Sturz in der Dunkelheit verrät, dass mein[house_member.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', house_member)] [house_member.GetTitledFirstName] durch die Schatztruhen der Gesellschaft geht, zusammen mit einer Person an [house_member.Custom('DE_PRO_POS_S_3P')]er Seite, die [house_member.Custom('DE_PRO_PER_S_3P_A')] mit gedämpfter Stimme zum Gehen drängt.\n\n„Was ist hier los?“, frage ich. Die beiden drehen sich zu mir um und halten sich aneinander fest. Nun erkenne ich die fremde Person als [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)] von [wedding_interest_house_head.GetTitledFirstName].\n\n„Wir bleiben hier nicht länger. Das Gift zwischen unseren Familien wird uns stets trennen. Deshalb wollen wir gehen,“ sagt [house_member.GetTitledFirstNameNoTooltip] "
 gdp_merchant_family.0001.desc.stubborn_outro: "mit trotzig erhobenem Kinn und die Hand von [wedding_interest.GetTitledFirstNameNoTooltip] fest umschlossen."
 gdp_merchant_family.0001.desc.fallback_outro: "und lässt die Hand von [wedding_interest.GetTitledFirstNameNoTooltip] los, was für [house_member.Custom('DE_PRO_PER_S_3P_A')] schmerzhaft zu sein scheint. Stattdessen wird sie jetzt mir in einer stummen Bitte entgegengestreckt."
 gdp_merchant_family.0001.a: "„Nehmt das Gold und geht mit meinem Segen.“"
 gdp_merchant_family.0001.b: "„Was kann ich tun, um Euch beide zum Bleiben zu überreden?“"
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName|U] schließt sich Euch an"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName|U] ist nicht beeindruckt"
 gdp_merchant_family.0001.c: "„Ihr geht #EMP nirgendwohin#!!“"
 gdp_merchant_family.0002.t: "Dicker als Wasser"
 gdp_merchant_family.0002.desc_intro: "Ich studiere die neuesten Umsatzberichte, als [blood.Custom2('MyCharacterIntroduction', ROOT.Char)] hereinstürmt.\n\n„Dieses [water.Custom('InsultAdjective')|l]e Schwein geht zu weit“, wütet [blood.Custom('DE_PRO_PER_S_3P_N')]. „[water.Custom('DE_PRO_PER_S_3P_N')|U] geht Risiken ein, ignoriert Grenzen und lässt den Rest von uns wie völlige Narren aussehen."
 gdp_merchant_family.0002.desc_adopted: "Das ist nicht hinnehmbar für ein Mitglied von Haus [ROOT.Char.GetHouse.GetName].“"
 gdp_merchant_family.0002.desc_associate: "Das ist nicht hinnehmbar für einen einfachen Mitarbeiter unserer Gesellschaft.“"
 gdp_merchant_family.0002.desc_outro: "\n\nAls die Beschwerde endlich endet, schaue ich erneut in das Hauptbuch. Was auch immer die Wahrheit sein mag: [water.GetFirstNameNoTooltip|U] bringt Gewinne ein, und gegen solche Ergebnisse lässt sich kaum argumentieren."
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip|U] muss in die Schranken gewiesen werden."
 gdp_merchant_family.0002.a.unity_gain.desc: "zog Blutsbande dem Geschäftsverdienst vor"
 gdp_merchant_family.0002.b: "Kommt wieder, wenn Ihr die Ergebnisse von [water.GetFirstNameNoTooltip] habt."
 gdp_merchant_family.0002.b.unity_loss.desc: "zog den Geschäftsverdienst den Blutsbanden vor"
 gdp_merchant_family.0002.c: "„Ich habe dafür keine Zeit …“"
 gdp_merchant_family.0003.t: "Keine Schande erleiden"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nähert sich mir sichtlich verärgert.\n\n„Ihr werdet nicht glauben, was mir gerade gesagt wurde“, schimpft [offended.Custom('DE_PRO_PER_S_3P_N')]. „[offender.Custom2('MyCharacterIntroduction', ROOT.Char)] dachte, es wäre lustig, mich und dadurch auch unser Haus zu beleidigen.“\n\nDie Kränkung ist geringfügig, aber beabsichtigt."
 gdp_merchant_family.0003.a: "Bei der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])! Haus [offender.GetHouse.GetNameNoTooltip] wird sich entschuldigen!"
 gdp_merchant_family.0003.a.unity_gain.desc: "Zeigte ein geeinte Front gegenüber einer öffentlichen Beleidigung"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U] beleidigte öffentlich das Haus von [target_char.GetShortUIName]"
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U], konzentriert Euch darauf, was sie nicht sagen …"
 gdp_merchant_family.0003.b.unity_loss.desc: "Weigerte sich, eine Beleidigung mit gleicher Münze heimzuzahlen"
 gdp_merchant_family.0003.c: "Ihr klärt das. Ich muss mich um andere Dinge kümmern."
 gdp_merchant_family.0003.c.unity_loss.desc: "Ignorierte eine Beleidigung, die unserem Haus galt"
 gdp_merchant_family.0004.t: "Ein glückverheißendes Angebot"
 gdp_merchant_family.0004.desc: "Als ich einen gemächlichen Spaziergang unternehme, höre ich eine mir unbekannte Stimme, die mich über den Hof hinweg anspricht. „Auf ein Wort, [ROOT.Char.Custom('FormOfAddressForLiege')].“ [offer_2.GetFullName|U] steht unmittelbar vor mir und spricht in einem sehr schmeichelnden Tonfall.\n\n„[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U] schickt mich mit einem Vorschlag. [offer.Custom2('YourCharacterIntroduction', ROOT.Char)] soll von mir geehelicht werden und die Verbindung zwischen unseren beiden Häusern stärken.“ Unbewusst halte ich den Atem an, als ich über das Angebot nachdenke.\n\n„Nun? Was sagt [ROOT.Char.Custom('FormOfAddressForLiege')] dazu?“"
 gdp_merchant_family.0004.a: "„Mein[offer.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))] wäre geehrt.“"
 gdp_merchant_family.0004.b: "„Wie wäre es mit einem Geschäft, von dem alle profitieren?“"
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U] und [target_char.GetShortUIName] schlossen ein Geschäft ab, das allen Vorteile bringt"
 gdp_merchant_family.0004.c: "„Ich muss höflich ablehnen, doch Ihr seid herzlich willkommen, zu bleiben.“"
 gdp_merchant_family.0005.t: "Eine Schande für das Haus [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.0005.desc: "Mich erreichte die Kunde, dass [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)] eine entscheidende Lieferung verlor, die in [wayward.Custom('DE_PRO_POS_S_3P')]er Verantwortung stand, was unserem Ruf erheblich schaden würde, wenn wir nicht umgehend handeln. Ich rufe [wayward.Custom('DE_PRO_PER_S_3P_A')] in meine Gemächer, um [wayward.Custom('DE_PRO_PER_S_3P_A')] zu befragen.\n\n„Es tut mir äußerst leid, [wayward.Custom2('RelationToMe', ROOT.Char)], doch Ihr solltet nicht mir für dieses Missgeschick die Schuld geben. Mein eigenes Blut, mein eigenes Haus versucht, mich zu hintergehen!“"
 gdp_merchant_family.0005.a: "„Seid verflucht, mein[wayward.Custom('DE_END_PRO_S_N')] [wayward.Custom('InsultAdjective')|l][Select_CString(wayward.IsFemale, 'e', 'er')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]!“"
 gdp_merchant_family.0005.a.unity_loss.desc: "Verurteilte öffentlich ein Mitglied des Hauses"
 gdp_merchant_family.0005.b: "„Wir stehen zusammen. Immer.“"
 gdp_merchant_family.0005.b.unity_gain.desc: "Entschied sich, den Widrigkeiten gemeinsam zu begegnen"
 gdp_merchant_family.0005.c: "„Löst das Problem.“"
 gdp_merchant_family.0010.t: "Das Zünglein an der Waage"
 gdp_merchant_family.0010.desc: "Mit einem #EMP BUMM#! schlägt die Kiste auf dem Boden auf und das übliche Treiben auf dem Markt ([ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]) gerät jäh ins Stocken. Ich drehe mich um und erblicke meine beiden Mitarbeiter [attacker.GetTitledFirstName] und [defender.GetTitledFirstName], die kurz davor sind, handgreiflich zu werden.\n\n„Ich schufte mich zu Tode für diese Familie“, sagt [attacker.GetTitledFirstNameNoTooltip] und [attacker.Custom('quirk_neg_present')], ein wütendes Funkeln im Blick. „Dieser armselige Mensch lungert hier in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] nur herum. Wenn Ihr mich nicht aufhaltet, prügle ich [defender.Custom('DE_PRO_PER_S_3P_D')] etwas Verstand ein.“"
 gdp_merchant_family.0010.a: "So benimmt sich keiner meiner Mitarbeiter."
 gdp_merchant_family.0010.a.tt.success: "Ihr vermittelt erfolgreich in dem Streit"
 gdp_merchant_family.0010.a.tt.failure: "Ihr schafft es nicht, in dem Streit zu vermitteln"
 gdp_merchant_family.0010.b: "Nur zu. Zeigt allen, wie wir eine Rechnung begleichen."
 gdp_merchant_family.0010.c: "Ihr werdet es noch bereuen, Eure Hand gegen [defender.GetTitledFirstNameNoTooltip] erhoben zu haben!"
 gdp_merchant_family.0010.d: "Handelt, wie Ihr es wollt."
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUIName|U] und [defender.GetShortUIName] werden ein kombiniertes [prowess_i][prowess|E]- und [martial_i][martial|E]-Duell gegeneinander führen! Jemand wird verletzt werden#!"
 merchant_unity_fight_stopped: "Beendete innere Streitigkeiten zwischen Mitgliedern der Gesellschaft"
 merchant_unity_fight_promoted: "Förderte innere Streitigkeiten zwischen Mitgliedern der Gesellschaft"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip|U] gewinnt"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U] verwundete [defender.GetFirstName]"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip|U] gewinnt"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.Custom('DE_PRO_PER_S_3P_N')|U] verteidigte sich selbst und verwundete [attacker.GetFirstName]"
 gdp_merchant_family.0015.t: "Ein vertrauter Geschäftspartner"
 gdp_merchant_family.0015.desc: "Unter all den vertrauten Gesichtern auf dem Markt ([ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]) von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] sucht [tip_giver.GetShortUIName] meinen Blick und zieht mich zur Seite. Mit einem gerissenen Grinsen überreicht [tip_giver.Custom('DE_PRO_PER_S_3P_N')] mir ein Hauptbuch.\n\n„Ah, [ROOT.Char.GetTitledFirstName], genau die Person, nach der ich Ausschau gehalten hatte! Lasst mich einige meiner neuesten Einblicke teilen und betrachtet es als ein Angebot für unsere künftige Zusammenarbeit.“"
 gdp_merchant_family.0015.a: "„Gemeinsam könnten wir einen ordentlichen Gewinn machen!“"
 gdp_merchant_family.0015.b: "„Lasst mich Euch das abkaufen.“"
 gdp_merchant_family.0015.b.artifact: "Eingeweihtenhauptbuch"
 gdp_merchant_family.0015.b.artifact.desc: "Ein eifersüchtig gehütetes Buch über Marktgewinne, Margen und nützliche Verbindungen"
 gdp_merchant_family.0015.c: "„Mein Unternehmen (#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#!) wird davon profitieren …“"
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U] und [target_char.GetShortUIName|U] tauschten einen gewinnträchtigen Hinweis aus"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U] nutzte den Hinweis von [target_char.GetShortUIName] gegen [target_char.Custom('DE_PRO_PER_S_3P_A')]"
 gdp_merchant_family.0020.t: "Talentaustausch"
 gdp_merchant_family.0020.desc: "[Select_CString(house_friend.IsFemale, 'Meine Geschäftsverbindung Meisterin', 'Meine Geschäftsverbindung Meister')] [house_friend.GetFirstName] kommt zu spät zu unserem üblichen Treffen. Als [house_friend.Custom('DE_PRO_PER_S_3P_N')] endlich eintrifft, ist [house_friend.Custom('DE_PRO_PER_S_3P_N')] ganz unerwartet nicht allein.\n\n„[ROOT.Char.Custom('MistressMaster')|U], dies ist mein[nepo_hire.Custom('DE_END_PRO_S_N')] [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))] [nepo_hire.GetFirstName], "
 gdp_merchant_family.0020.desc.diplomacy: "[Select_CString(nepo_hire.IsFemale, 'eine erfahrene Diplomatin', 'ein erfahrener Diplomat')]."
 gdp_merchant_family.0020.desc.martial: "[Select_CString(nepo_hire.IsFemale, 'eine sturköpfige Strategin', 'ein sturköpfiger Stratege')]. "
 gdp_merchant_family.0020.desc.stewardship: "[Select_CString(nepo_hire.IsFemale, 'eine Meisterin mit den Büchern', 'ein Meister mit den Büchern')]. "
 gdp_merchant_family.0020.desc.intrigue: "[Select_CString(nepo_hire.IsFemale, 'eine geistreiche Frau', 'ein geistreicher Mann')]. "
 gdp_merchant_family.0020.desc.learning: "[Select_CString(nepo_hire.IsFemale, 'eine gebildete Frau', 'ein gebildeter Mann')]. "
 gdp_merchant_family.0020.desc.outro: "Unter Eurer Aufsicht in Eurem Unternehmen ([ROOT.Char.GetPrimaryTitle.GetName]) würde [nepo_hire.Custom('DE_PRO_PER_S_3P_N')] gewiss bestens gedeihen.\""
 gdp_merchant_family.0020.a: "„[nepo_hire.GetFirstNameNoTooltip|U] darf sich uns gern anschließen.“"
 gdp_merchant_family.0020.a.unity_loss.desc: "vergab eine Mitarbeiterstelle als Gefallen"
 gdp_merchant_family.0020.b: "„Es tut mir leid, aber wir haben keine freien Stellen.“"
 gdp_merchant_family.0020.b.unity_gain.desc: "lehnte es ab, einen Außenseiter einzustellen"
 gdp_merchant_family.0020.c: "„Ihr beleidigt mich mit diesem Vorschlag.“"
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U] nahm die Verwandtschaft von [target_char.GetShortUIName] in [char.Custom('DE_PRO_POS_S_3P')]e Gesellschaft auf"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U] lehnte die Verwandtschaft von [target_char.GetShortUIName] ab"
 gdp_merchant_family.0025.t: "Nichts Persönliches"
 gdp_merchant_family.0025.desc: "Meine Hand schmerzt, als ich von einem scheinbar unendlichen Stapel von Handelsabkommen das letzte unterzeichne. Gerade als ich mich zur Nachtruhe zurückziehen will, kommt [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)] auf mich zu. [leaving_associate.Custom('DE_PRO_PER_S_3P_N')|U] hält nervös ein kleines Stück Pergament in der Hand und beginnt, den Inhalt vorzulesen.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mit Bedauern setze ich Euch darüber in Kenntnis, dass ich aus einer gewissen Richtung ([rival_poacher.GetPrimaryTitle.GetName]) ein Angebot erhielt, das ich einfach nicht ablehnen kann. Es ist nicht Eure Schuld, es ist schlicht ein gutes Geschäft.“"
 gdp_merchant_family.0025.a: "„Geht mit meinem Segen.“"
 gdp_merchant_family.0025.b: "„Euer Platz ist hier bei uns.“"
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U] bleibt bei der [company|E]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip|U] willigt ein, zu bleiben"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip|U] geht trotzdem"
 gdp_merchant_family.0025.c: "„Denkt daran: Ihr schuldet mir etwas.“"
 gdp_merchant_family.0025.d: "„Na schön. Geht.“"
 gdp_merchant_family.0025.d.rival: "„[rival_poacher.GetTitledFirstNameNoTooltip|U], Ihr werdet den Tag noch bereuen, an dem Ihr mir in die Quere gekommen seid!“"
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U] wilderte einen [associate|E] von [CHARACTER.GetShortUIName]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U] gab in guter Absicht einen [associate|E] an die Gesellschaft von [target_char.GetShortUIName] frei"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U] wilderte einen [associate|E] von [char.GetHouse.GetName]"
 gdp_merchant_family.0030.t: "Geschäft oder Vergnügen?"
 gdp_merchant_family.0030.desc: "Zwei meiner Mitarbeiter, [house_member.GetTitledFirstName] und [associate.GetTitledFirstName], kehren nach einem #EMP ausgedehnten#! Mittagessen in die Schreibstube meines Unternehmens ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]) zurück und bringen einen Krug voll [ROOT.Char.Custom('RegionalAlcoholicDrink')] mit.\n\n„… Und ich habe ihm gesagt, dass Katzen in einen Schweinestall gehören!“, sagt [house_member.GetTitledFirstNameNoTooltip], worauf [associate.GetTitledFirstNameNoTooltip] schallend lacht.\n\nWenn ich nichts tue, werden die beiden heute nichts Sinnvolles mehr erledigen."
 gdp_merchant_family.0030.a: "„Lasst mich eine richtige Flasche holen.“"
 gdp_merchant_family.0030.a.flavor: "Nur das Beste für dieses Unternehmen ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip])"
 gdp_merchant_family.0030.b: "„Kehrt an die Arbeit zurück, Ihr undankbares Pack!“"
 gdp_merchant_family.0030.b.flavor: "Dieses Unternehmen ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|U]) duldet keine Faulenzer"
 gdp_merchant_family.0030.c: "Lasst uns sehen, wohin diese Freundschaft führt."
 merchant_unity_breaks_encouraged: "Nur die besten Getränke, die der Markt zu bieten hat"
 merchant_unity_breaks_discouraged: "Unerwünschte Arbeitspausen"
 gdp_merchant_family.9000.t: "[Select_CString(target_character.IsFemale, 'Junge', 'Junger')] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "Endlich bin ich erwachsen und alt genug, meinen rechtmäßigen Platz als [ROOT.Char.GetTitleAsNameNoTooltip] unseres Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) einzunehmen. Ich muss in die Fußstapfen treten, die mir mein[predecessor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', predecessor)] [predecessor.GetFirstName] hinterließ.\n\nMeine Mitarbeiter blicken nun zu mir, das Unternehmen zu führen und in der Welt des Handels neue Wege und Gelegenheiten zu finden, auch wenn man mir sagt, ich solle mich auf ihre Erfahrung und ihre Weisheit verlassen soll …"
 gdp_merchant_family.9000.a: "Die Führung von [educator.GetTitledFirstNameNoTooltip] wird unbezahlbar sein."
 gdp_merchant_family.9000.b: "Wo soll ich anfangen …"
 gdp_merchant_family.9000.route_hint_tt: "Ihr könnt nun [distribution_routes|E] erstellen und anpassen"
 gdp_merchant_family.9010.t: "Eine Gesellschaft in Trauer"
 gdp_merchant_family.9010.desc: "Mein[previous_holder.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', previous_holder)] [previous_holder.GetFirstName] hat uns verlassen. [previous_holder.Custom('DE_PRO_PER_S_3P_N')|U] war das respektierte Oberhaupt der Gesellschaft. Es gibt kein Gelächter mehr in unseren Hallen, keine hitzigen Debatten in den Schreibstuben und alle blicken so besorgt drein.\n\n"
 gdp_merchant_family.9010.interim_generated: "Alle blicken zu jemandem namens [interim.GetFirstName], [interim.Custom('DE_ART_DEF_S_N')] gerufen wurde, beim Regeln der anstehenden Angelegenheiten zu helfen, und"
 gdp_merchant_family.9010.interim_relation: "Mein[interim.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', interim)] ist die Person, auf die sich derzeit alle Blicke richten und [interim.Custom('DE_ART_DEF_S_N')]"
 gdp_merchant_family.9010.interim: "[interim.GetFirstName|U] ist die Person, auf die sich alle Blicke richten, [interim.Custom('DE_ART_DEF_S_A')] mein[previous_holder.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', previous_holder)] zum engsten Mitarbeiterstab zählte, und [interim.Custom('DE_ART_DEF_S_N')]"
 gdp_merchant_family.9010.close: "ob der Abwesenheit von [previous_holder.GetFirstNameNoTooltip] Vorkehrungen traf, um sich um das Tagesgeschäft zu kümmern, bis ich alt genug bin, es zu übernehmen."
 gdp_merchant_family.9010.a: "Die Dinge haben sich so schnell geändert."
 gdp_merchant_family.9110.t: "Handelskniffe"
 gdp_merchant_family.9110.desc: "Mein[trader.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', trader)] [trader.GetFirstName] gehört zu den erfahrensten Kaufleuten der Gesellschaft und ist selten in der Schreibstube.\n\n[trader.Custom('DE_PRO_PER_S_3P_N')|U] kümmert sich um eine bestimmte Route ([route.GetName]), stellt sicher, dass auch die letzten [good.Custom('GetTradeGoodUnitPlural')] sicher vom Verkäufer zum Käufer gelangen, und sorgt so für reichlich [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] in unseren Geldbörsen.\n\n„Ein guter Händler ist überall zugleich“, lächelt [trader.Custom('DE_PRO_PER_S_3P_N')]. „Er kennt die Gesichter an jedem Stand der Handelsstätte ([ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')]), ihre Nöte – und sogar die einer jeden Stadt- und Karawanenwache!“"
 gdp_merchant_family.9110.a: "Wenn ich das Sagen habe, werde ich wie [trader.GetNameNoTooltip] sein."
 gdp_merchant_family.9110.b: "„Erzählt mir von den Karawanen!“"
 gdp_merchant_family.9110.b.tt: "Mit Erreichen der Volljährigkeit erhaltet Ihr #V 10#! [trait_level_track_xp|E] in: #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])#!"
 gdp_merchant_family.9110.c: "„[good.Custom('GetTradeGood')]! Damit möchte ich auch handeln!“"
 gdp_merchant_family.9110.c.tt: "Mit Erreichen der Volljährigkeit erhält das Unternehmen ([merchant.GetPrimaryTitle.GetDefinitiveName]) #V 450#! [trade_expertise|E] in Sachen [category.GetNameWithIcon]"
 gdp_merchant_family.9130.t: "Das Streben der Jugend"
 gdp_merchant_family.9130.desc: "Ich lerne viel vom Beobachten des täglichen Geschäfts der Gesellschaft, und meine Mitarbeiter geben sich alle Mühe, mich einzubeziehen, damit ich noch mehr verstehe."
 gdp_merchant_family.9130.caravaneer: "\n\nDas Unternehmen ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) handelt in nah und fern, und in den Hauptbüchern stehen Namen von Orten, die ich kaum aussprechen kann – weit weg von [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]. Wo genau, das kann ich nur vermuten."
 gdp_merchant_family.9130.artisan: "\n\nDas Unternehmen ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) ist als Käufer rarer und hochwertiger Artikel bekannt und als Gönner von [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip|l]en Handwerkern."
 gdp_merchant_family.9130.creditor: "\n\nDas Unternehmen ([ROOT.Char.GetPrimaryTitle.GetName]) ist bekannt dafür, [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] gegen Gefallen zu handeln, und die Hauptbücher sind voller Namen von [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip|l]en Pechvögeln und Spielern."
 gdp_merchant_family.9130.fallback: "\n\nDas Unternehmen ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) ist gut etabliert, aber nicht bekannt für irgendetwas Besonderes. Es ist einfach nur eines der [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip|l]en Handelshäuser, die viele Finger im Spiel haben."
 gdp_merchant_family.9130.a: "Ich kann es kaum abwarten, endlich am Steuer zu sein."
 gdp_merchant_family.9130.a.caravaneer: "Und wir werden es noch weiter bringen."
 gdp_merchant_family.9130.a.artisan: "Unser Name ist ein Gütesiegel."
 gdp_merchant_family.9130.a.creditor: "Kredit ist unser Geschäft."
 gdp_merchant_family.9130.a.tt: "Mit Erreichen der Volljährigkeit erhaltet Ihr jeweils #V 5#! [trait_level_track_xp|E] in #emp $trait_track_caravaneer$#!, #emp $trait_track_artisan$#! und #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])#!"
 gdp_merchant_family.9130.b: "Die weite Welt da draußen ist voller Möglichkeiten."
 gdp_merchant_family.9130.b.tt: "Mit Erreichen der Volljährigkeit nehmt Ihr den [company_purpose|E] [GetLaw('company_purpose_caravaneer').GetName] #P kostenfrei#! an und erhaltet #V 20#! [trait_level_track_xp|E] in #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])#!"
 gdp_merchant_family.9130.c: "Vieles wird für hübschen Zierrat ausgegeben."
 gdp_merchant_family.9130.c.tt: "Mit Erreichen der Volljährigkeit nehmt Ihr den [company_purpose|E] [GetLaw('company_purpose_artisan').GetName] #P kostenfrei#! an und erhaltet #V 20#! [trait_level_track_xp|E] in #emp $trait_track_artisan$#! #weak ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])#!"
 gdp_merchant_family.9130.d: "Wahre Macht und Reichtümer hängen nur vom richtigen Druckmittel ab."
 gdp_merchant_family.9130.d.tt: "Mit Erreichen der Volljährigkeit nehmt Ihr den [company_purpose|E] [GetLaw('company_purpose_creditor').GetName] #P kostenfrei#! an und erhaltet #V 20#! [trait_level_track_xp|E] in #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])#!"
 company_purpose_child_blocker_tt: "Ihr seid ein [child|E]"
 gdp_merchant_family.9140.t: "Marktfutter"
 gdp_merchant_family.9140.desc: "Aus den stickigen Schreibstuben in [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly] heraus wird mir alles über die Handelsrouten beigebracht, über die das Unternehmen ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) ein Vermögen macht oder es zumindest versucht. Es gibt so viele Orte und Waren, die ich mir merken muss.\n\nIch erwache aus meinen Tagträumereien, als [associate.GetFirstName] mit der Feder auf den Tisch klopft. „Kommt, [ROOT.Char.Custom('GirlBoy')]! Wie wollt Ihr Euch je als [ROOT.Char.GetTitleAsNameNoTooltip] bewähren, wenn Ihr unser Geschäft nicht lernt!“"
 gdp_merchant_family.9140.a: "„[category_1.Custom('GetTradeGoodCategory')|U]! Erzählt mir vom Handel damit!“"
 gdp_merchant_family.9140.a.tt: "Mit Erreichen der Volljährigkeit erhält das Unternehmen ([merchant.GetPrimaryTitle.GetDefinitiveName]) #V 450#! [trade_expertise|E] in Sachen [category_1.GetNameWithIcon]"
 gdp_merchant_family.9140.b: "„[category_2.Custom('GetTradeGoodCategory')|U]! Das ist ein Handel, der mich fasziniert.“"
 gdp_merchant_family.9140.b.tt: "Mit Erreichen der Volljährigkeit erhält das Unternehmen ([merchant.GetPrimaryTitle.GetDefinitiveName]) #V 450#! [trade_expertise|E] in Sachen [category_2.GetNameWithIcon]"
 gdp_merchant_family.9140.c: "„[category_3.Custom('GetTradeGoodCategory')|U]! Ich möchte mehr darüber erfahren, wie man solche Dinge umsetzt.“"
 gdp_merchant_family.9140.c.tt: "Mit Erreichen der Volljährigkeit erhält das Unternehmen ([merchant.GetPrimaryTitle.GetDefinitiveName]) #V 450#! [trade_expertise|E] in Sachen [category_3.GetNameWithIcon]"
 gdp_merchant_family.9150.t: "Rechte Hand"
 gdp_merchant_family.9150.desc: "Während ich auf meine Volljährigkeit warte, verbinge ich viel Zeit am Tag mit [partner.GetFirstName], [Select_CString(partner.IsFemale, 'der Partnerin', 'dem Partner')] der Gesellschaft. Ich beobachte [partner.Custom('DE_PRO_POS_S_3P')]e Geschäfte und Treffen und sauge alles Wissen auf, was ich kann.\n\nNach einer anstrengenden Sitzung über den Hauptbüchern dreht [partner.Custom('DE_PRO_PER_S_3P_N')] sich eines Tages zu mir um. „Ihr macht das gut, [ROOT.Char.GetTitleAsNameNoTooltip]“, grinst [partner.Custom('DE_PRO_PER_S_3P_N')] und wirft mir eine Münze zu. „Das Geschäft ist nicht einfach, aber anders als [Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'die', 'der')] [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')|l]e [ROOT.Char.GetSuzerain.GetTitleAsName] hält uns nur harte Arbeit über Wasser.“"
 gdp_merchant_family.9150.a: "„Ich werde weder Euch noch die Gesellschaft enttäuschen.“"
 gdp_merchant_family.9150.b: "„Ihr habt es mehr als verdient, [partner.GetFirstNameNoTooltip].“"
 gdp_merchant_family.9150.b.tt: "Für die nächsten #V 10#! Jahre gilt für die Eignung von [partner.GetShortUIName] als [GetCourtPositionType('partner_court_position').GetName()]: #p +1#!"
 gdp_merchant_family.9150.c: "„Und dennoch: Wo wären wir, wenn [Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'die', 'der')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] nicht wäre?“"
 gdp_merchant_family.9150.c.tt: "Mit Erreichen der Volljährigkeit erhaltet Ihr für #V 10#! Jahre den [modifier|E]: [GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip]"
 merchant_childhood_suzerain_modifier: "Gönnerschmeichler"
 merchant_childhood_suzerain_modifier_desc: "Dieser Charakter versteht die Bedeutung, gute Beziehungen zu jenen zu pflegen, die den größten Knüppel schwingen."
 merchant_childhood_desc: "Kaufmannskindheit"
