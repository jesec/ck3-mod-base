l_german:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "Beim Durchqueren der [local_province.Custom('GetTerrainLandPlural')] in [local_county.GetNameNoTierNoTooltip] gelangt meine Gruppe in die Nähe der örtlichen Siedlung und errichtet unser Lager an den [local_province.Custom('GetProvinceFoliageDescAdjective')|l]en Außenbezirken,"
 gdp_merchant_luxury_contract.0001.desc.locals: "Eine Gruppe vorbeikommender Dorfbewohner antwortet auf unsere unbeholfenen Fragen zur örtlichen Tierwelt mit merkwürdigen, aber unmissverständlichen Nachahmungen, die etwas ganz Bestimmtes darstellen sollen:"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "Eine Gruppe vorbeikommender Dorfbewohner antwortet auf unsere Fragen mit Geschichten über"
 gdp_merchant_luxury_contract.0001.desc.jungle: "wo die Luft vom Duft von Nektar erfüllt ist."
 gdp_merchant_luxury_contract.0001.desc.mountain: "wo die frische Luft zwischen den Ästen rauscht."
 gdp_merchant_luxury_contract.0001.desc.desert: "wo die brütende Sonne die stille Landschaft versengt."
 gdp_merchant_luxury_contract.0001.desc.plains: "wo der schwere Duft von Wildblumen in der Luft hängt."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "furchterregende Katzen."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "listige Katzen."
 gdp_merchant_luxury_contract.0001.desc.bear: "wilde Bären."
 gdp_merchant_luxury_contract.0001.desc.monkey: "ungehörige Affen."
 gdp_merchant_luxury_contract.0001.desc.elephant: "majestätische Elefanten."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "furchterregende Katzen und wilde Bären."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "wilde Bären und majestätische Elefanten."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "furchterregende Katzen und majestätische Elefanten."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "ungehörige Affen und furchterregende Katzen."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "ungehörige Affen und majestätische Elefanten."
 gdp_merchant_luxury_contract.0001.desc.bird: "betörende Vögel."
 gdp_merchant_luxury_contract.0001.desc.close: "Es scheint, als wären wir endlich auf der richtigen Spur!"
 gdp_merchant_luxury_contract.0001.a: "Die Bestien der Wildnis erwarten uns!"
 gdp_merchant_luxury_contract.0001.a.flavor: "Bevorzugt die Zurschaustellung von [martial_i|E][martial|E], [intrigue_i|E][intrigue|E] und [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "Versucht, ein #V Kreatur#!-[domicile_artifact|E] in der Wildnis zu beschaffen"
 gdp_merchant_luxury_contract.0001.b: "Wollen wir einmal sehen, was wir bei den Leuten ([local_barony.Custom('BaronyTownType')]) finden werden."
 gdp_merchant_luxury_contract.0001.b.flavor: "Bevorzugt die Zurschaustellung von [diplomacy_i|E][diplomacy|E], [stewardship_i|E][stewardship|E] und [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.0001.b.tt: "Versucht, ein #V Kreatur#!-[domicile_artifact|E] in einem städtischen Zentrum zu beschaffen"
 gdp_merchant_luxury_contract_back_to_town_tt: "Ihr reist zurück in die Ortschaft ([local_barony.Custom('BaronyTownType')])"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "Ihr reist zurück in die Wildnis"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: Örtliche Farbe"
 gdp_merchant_luxury_contract.0011.desc: "Als ich auf den mir unvertrauten Straßen von [local_province.GetBaronyNameExplicitlyNoTooltip] umherwandere, erblicke ich bald darauf eine [local_province.Custom('GetProvinceAdjective')|l]e Handelsstätte ([local_province.Custom('GetRegionalMarketTermGloss')]), wo sich [Select_CString(rich_local.IsFemale, 'eine nicht zu übersehende, gut gekleidete Frau', 'ein nicht zu übersehender, gut gekleideter Mann')] unterhält,"
 gdp_merchant_luxury_contract.0011.cage: "[Select_CString(rich_local.IsFemale, 'die', 'der')] neben einem Tier ([rich_local.Custom('GetAnimalType')]) in einem Käfig steht!"
 gdp_merchant_luxury_contract.0011.shoulder: "[Select_CString(rich_local.IsFemale, 'die', 'der')] ein Tier ([rich_local.Custom('GetAnimalType')]) auf der Schulter trägt!"
 gdp_merchant_luxury_contract.0011.leashed: "mit einem Tier ([rich_local.Custom('GetAnimalType')]) an der Seite!"
 gdp_merchant_luxury_contract.0011.close: "\n\nVon den Hökern um mich herum erfahre ich, dass [rich_local.Custom('DE_PRO_PER_S_3P_N')] [rich_local.GetTitledFirstName] heißt, von hier stammt und [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)] ist – und bekannt für [rich_local.Custom('DE_PRO_POS_S_3P')] Interesse an wilden und exotischen Tieren.\n\nVielleicht würde [rich_local.Custom('DE_PRO_PER_S_3P_N')] sich auf ein Geschäft einlassen?"
 gdp_merchant_luxury_contract.0011.a: "„[Select_CString(rich_local.IsFemale, 'Meine gute Frau', 'Mein guter Mann')], können wir über Euer prachtvolles Geschöpf ([rich_local.Custom('GetAnimalType')]) sprechen?“"
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.Custom('DE_PRO_PER_S_3P_N')|U] verkauft das Tier ([rich_local.Custom('GetAnimalType')]) Euch"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.Custom('DE_PRO_PER_S_3P_N')|U] lehnt Euer Angebot ab"
 gdp_merchant_luxury_contract.0011.b: "Ich kann ein eigenes besorgen …"
 gdp_merchant_luxury_contract.some_other_way: "Ihr müsst einen anderen Weg finden, um eine Kreatur zu erwerben"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.GetTitledFirstName|U] mustert mich neugierig von Kopf bis Fuß, als ich mich vorstelle und überschwenglich [rich_local.Custom('DE_PRO_POS_S_3P')] Tier preise.\n\n"
 gdp_merchant_luxury_contract.0012.success: "[rich_local.Custom('DE_PRO_POS_S_3P')|U] Blick wird wärmer, während ich spreche. Begierig saugt [rich_local.Custom('DE_PRO_PER_S_3P_N')] meine Komplimente auf und erkundigt sich, wie ich an einen Ort so fern der Heimat gelange.\n\nSchon bald einigen wir uns auf einen Preis, und ich bin plötzlich im Besitz eines prächtigen Tieres ([rich_local.Custom('GetAnimalType')])!"
 gdp_merchant_luxury_contract.0012.failure: "[rich_local.Custom('DE_PRO_POS_S_3P')|U]e Miene verfinstert sich, als [rich_local.Custom('DE_PRO_PER_S_3P_N')] zunächst die Stirn runzelt und dann verächtlich schnaubt. Schließlich weist [rich_local.Custom('DE_PRO_PER_S_3P_N')] mich entschieden ab und bedeutet [rich_local.Custom('DE_PRO_POS_S_3P')]en Begleitern, mich fortzuführen.\n\n[Select_CString(rich_local.IsFemale, 'Diese aufgeblasene Närrin', 'Dieser aufgeblasene Narr')] behandelt mich, als wäre #EMP ich#! das Tier ([rich_local.Custom('GetAnimalType')]) …"
 gdp_merchant_luxury_contract.0012.a: "Das wird in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] in aller Munde sein!"
 gdp_merchant_luxury_contract.0012.b: "Wartet! Schaut: Ich kann noch mehr bieten!"
 gdp_merchant_luxury_contract.0012.c: "Wo lebt [Select_CString(rich_local.IsFemale, 'diese Närrin', 'dieser Narr')]? Das Tier ([rich_local.Custom('GetAnimalType')]) #EMP wird#! mir gehören!"
 gdp_merchant_luxury_contract.0012.c.success: "Ihr raubt das Tier ([rich_local.Custom('GetAnimalType')])"
 gdp_merchant_luxury_contract.0012.c.failure: "Ganz knapp entkommt Ihr den Wachen"
 gdp_merchant_luxury_contract.0012.d: "#weak *Kopfschüttelnd*#! „Vergesst es. Ich schnappe mir selbst eines.“"
 gdp_merchant_luxury_contract.0012.e: "Ich bin durch damit …"
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "Es war nicht schwer, das Anwesen von [rich_local.GetTitledFirstName] in [local_province.GetBaronyNameExplicitlyNoTooltip] zu finden und in der Taverne ein paar örtliche Grobiane anzuwerben, bevor wir uns bei Einbruch der Nacht heimlich an den Ort heranschlichen.\n\n"
 gdp_merchant_luxury_contract.0013.success: "Es war fast zu einfach, auf das Gelände zu gelangen. und schon bald sind wir wieder einige Straßen entfernt und horchen angestrengt nach Alarmsignalen.\n\nEin gedämpfter Laut ([rich_local.Custom('GetAnimalSound')]) des Tieres ([rich_local.Custom('GetAnimal')]) ist alles, was zu hören ist!"
 gdp_merchant_luxury_contract.0013.failure: "Leider verließ mich das Glück! Ich entkam nur knapp den Wachen, die durch einen verräterischen Laut ([rich_local.Custom('GetAnimalSound')]) des Tieres ([rich_local.Custom('GetAnimal')]) herbeigerufen wurden, und der Plan scheiterte …\n\nDie Leute von [rich_local.GetFirstNameNoTooltip] werden sicherlich nach mir suchen!"
 gdp_merchant_luxury_contract.0013.a: "[Select_CString(rich_local.IsFemale, 'Diese Närrin', 'Dieser Narr')] hätte es mir verkaufen sollen!"
 gdp_merchant_luxury_contract.0013.b: "Ich muss diesen Ort sofort verlassen!"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]: Das Bestiarium"
 gdp_merchant_luxury_contract.0021.desc: "Tief in den verwinkelten Gassen des Handelsplatzes ([local_province.Custom('GetRegionalMarketTermGloss')]) der Ortschaft ([local_barony.Custom('BaronyTownType')]) ziehen mich der Gestank und die tierischen Schreie zu einer [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)|l] aussehenden Person hinter einem heruntergekommenen Stand, dessen [local_province.Custom('GetProvinceAdjective')|l]e Fläche voller Käfige aus Holz ([local_province.Custom('GetRandomRegionalWood')]) ist.\n\nAls [dealer.Custom('DE_PRO_PER_S_3P_N')] mein Interesse wahrnimmt, winkt [dealer.Custom('DE_PRO_PER_S_3P_N')] mich ungeduldig zu sich herüber. Es ist eine Augenweide! Ein prächtiges Tier ([ROOT.Char.Custom('GetAnimalType')]) erregt meine Aufmerksamkeit. Während ich sein charakteristischstes Merkmal ([ROOT.Char.Custom('GetAnimalFeature')]) bewundere, gibt ein eher klägliches Tier ([dealer.Custom('GetAnimalType')]) einen protestierenden Laut ([dealer.Custom('GetAnimalSound')]) von sich.\n\nDie Augen [Select_CString(dealer.IsFemale, 'der Hökerin', 'des Hökers')] schimmern vor Gier, während ich weiter stöbere."
 gdp_merchant_luxury_contract.0021.a: "„Wunderschön … Ich muss dieses Tier ([ROOT.Char.Custom('GetAnimalType')]) haben!“"
 gdp_merchant_luxury_contract.0021.b: "Sicherlich feilscht man auch in [local_province.GetBaronyNameExplicitlyNoTooltip] …"
 gdp_merchant_luxury_contract.0021.b.success_critical: "Ihr schließt ein meisterhaftes Geschäft ab"
 gdp_merchant_luxury_contract.0021.b.success: "Ihr spart ein paar Münzen"
 gdp_merchant_luxury_contract.0021.b.failure: "Ihr macht die Sache nur noch schlimmer"
 gdp_merchant_luxury_contract.0021.b.tt: "Ihr habt die Möglichkeit, abzulehnen"
 gdp_merchant_luxury_contract.0021.c: "#weak *Deutend*#! „Ich nehme dieses Tier ([dealer.Custom('GetAnimalType')])!“"
 gdp_merchant_luxury_contract.0021.d: "„Ich schaue nur.“"
 task_contract_success_pseudo: "#P Erfolg:#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "[Select_CString(dealer.IsFemale, 'Die Hökerin', 'Der Höker')] zwinkert, ganz offenkundig [Select_CString(dealer.IsFemale, 'eine geborene Verkäuferin', 'ein geborener Verkäufer')]. Gefühlte Ewigkeiten studieren wir das Tier und jedes Mal an seiner äußeren Erscheinung ([ROOT.Char.Custom('GetAnimalHide')]) und diskutieren die Qualität seiner Laute.\n\n"
 gdp_merchant_luxury_contract.0022.success: "Ich habe gute Argumente, und das bringt [dealer.Custom('DE_PRO_PER_S_3P_A')] etwas aus der Fassung. Schon bald gibt [dealer.Custom('DE_PRO_PER_S_3P_N')] nach und verringert den Preis deutlich, obwohl es noch mehr sein könnte …"
 gdp_merchant_luxury_contract.0022.neutral: "Meine Argumente scheinen Eindruck hinterlassen zu haben, denn [dealer.Custom('DE_PRO_POS_S_3P')] Preis sinkt etwas, doch dann kommt [dealer.Custom('DE_PRO_PER_S_3P_N')] nicht weiter auf mich zu …"
 gdp_merchant_luxury_contract.0022.failure: "Ich scheine [dealer.Custom('DE_PRO_PER_S_3P_A')] verärgert zu haben, denn der Preis hat sich lediglich erhöht und [dealer.Custom('DE_PRO_PER_S_3P_N')] ist nun starrköpfig …"
 gdp_merchant_luxury_contract.0022.a: "„Abgemacht.“"
 gdp_merchant_luxury_contract.0022.b: "„Eigentlich will ich dieses Tier ([dealer.Custom('GetAnimalType')]) …“"
 gdp_merchant_luxury_contract.0022.c: "#weak *Kopfschüttelnd*#! „Vergesst es.“"
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "Wenigstens habe ich erreicht, weswegen ich herkam, und bin nun [Select_CString(ROOT.Char.IsFemale, 'stolze Besitzerin', 'stolzer Besitzer')] dieses Tieres ([ROOT.Char.Custom('GetAnimalType')])! Die stolze Kreatur wurde sicher untergebracht und reist nun mit unserer Karawane nach Hause.\n\nWartet bloß ab, bis die Leute in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] es zu Gesicht kriegen!"
 gdp_merchant_luxury_contract.0023.a: "Los geht’s!"
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: Auf der Jagd"
 gdp_merchant_luxury_contract.0041.desc: "Ich verlasse die Wege und dringe tiefer in das Gelände ([local_province.Custom('GetTerrainType')]) vor, während ich mich auf der Suche nach irgendeinem Tier durch das Blattwerk ([local_province.Custom('GetProvinceFoliageDesc')]) zwänge. Nur der Ruf von Vögeln durchbricht die gespenstische Stille. Ich ziehe meinen Mantel enger um mich.\n\nGerade als ich das Dickicht verlassen will, sehe ich es! Dort, zwischen den Sträuchern ([local_province.Custom('GetProvinceGroundDesc')]) sind unverkennbare Tierabdrücke ([ROOT.Char.Custom('GetAnimalTrack')])! Ein jähes Geräusch ([ROOT.Char.Custom('GetAnimalSound')]) in der Ferne bestätigt es: Ein Tier ([ROOT.Char.Custom('GetAnimalType')]) versteckt sich hier!"
 gdp_merchant_luxury_contract.0041.a: "Vorwärts, bevor es flieht!"
 gdp_merchant_luxury_contract.0041.a.tt: "Ihr verfolgt das Tier ([THIS.Char.Custom('GetAnimalType')])"
 gdp_merchant_luxury_contract.0041.b: "Ver-vergesst es! Lasst uns umkehren!"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "Als ich mich durch das Gebüsch ([local_province.Custom('GetProvinceFoliageDesc')]) bewege, erblicke ich aus dem Augenwinkel einen Farbtupfer ([ROOT.Char.Custom('GetAnimalColor')]) von einem Tier. Ich befürchte das Schlimmste und drehe mich rasch um, während mein Herz fast in meiner Brust zerspringt!\n\nVor mir sitzt eine mitgenommene Kreatur ([ROOT.Char.Custom('GetAnimalType')]), nur ein Jungtier ([ROOT.Char.Custom('GetAnimalChild')]). Mit seinen großen Augen blickt es mich völlig angstfrei an. Ich schaue mich suchend um, doch es scheint allein zu sein. Kein Elterntier oder weitere Tiere ([ROOT.Char.Custom('GetAnimalGroup')]) sind in Sicht …"
 gdp_merchant_luxury_contract.0042.a: "Ich bin wegen einer ausgewachsenen Bestie hier!"
 gdp_merchant_luxury_contract.0042.a.tt: "Ihr setzt die Suche nach einem ausgewachsenen Tier-[artifact|E] ([THIS.Char.Custom('GetAnimalType')]) fort"
 gdp_merchant_luxury_contract.0042.b: "Vielleicht sollte ich eine Falle auslegen …"
 gdp_merchant_luxury_contract.0042.b.success: "Ihr nutzt das Jungtier ([ROOT.Char.Custom('GetAnimalChild')]) als Köder"
 gdp_merchant_luxury_contract.0042.b.success.tt: "Ihr erhaltet auch ein erwachsenes Tier-[artifact|E] ([THIS.Char.Custom('GetAnimalType')])"
 gdp_merchant_luxury_contract.0042.b.failure: "Ihr scheitert und das Jungtier ([ROOT.Char.Custom('GetAnimalChild')]) entkommt"
 gdp_merchant_luxury_contract.0042.c: "Es wird Zeit zu gehen. #EMP Du#! kommst mit mir, mein Kleines!"
 baby_creature_artifact_name: "[baby_creature.GetNameNoTooltip] [ROOT.Char.Custom('GetAnimalChild')|U]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "Ich werde von einer Bewegung im Dickicht ([local_province.Custom('GetProvinceFoliageDesc')]) überrascht und befürchte das Schlimmste: dass sich eine Bestie angeschlichen hat!\n\nIch bin halb erleichtert, als ich sehe, dass es nur [Select_CString(hunter.IsFemale, 'eine einheimische Fallenstellerin ist, die', 'ein einheimischer Fallensteller ist, der')] mich mit aufgelegtem Pfeil argwöhnisch mustert.\n\n„Ha! Sucht Ihr [ROOT.Char.Custom('GetAnimalPlural')]? Euresgleichen habe ich zuvor noch nie gesehen.“"
 gdp_merchant_luxury_contract.0043.a: "Könntet Ihr mir … helfen?"
 gdp_merchant_luxury_contract.0043.b: "Es wäre mir eine Ehre, mit Euch zusammen zu jagen!"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip|U] unterstützt Euch"
 gdp_merchant_luxury_contract.0043.b.success_tt: "Ihr habt eine höhere Chance, erfolgreich zu sein"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip|U] weist Euch ab"
 gdp_merchant_luxury_contract.0043.c: "Kommt mir nicht in die Quere."
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "Es ist einfach, das gefügige Jungtier ([ROOT.Char.Custom('GetAnimalChild')]) zu einer passenden Lichtung zu führen und es dort mit ein wenig Seil festzubinden.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName|U] ist eine angenehme Hilfe und weiß viel über das einheimische Gelände ([local_province.Custom('GetTerrainType')]) und seine Bewohner. Bald schon haben wir die Fährte des Tieres ([ROOT.Char.Custom('GetAnimal')])!\n\n"
 gdp_merchant_luxury_contract.0044.desc: "In dieser ungewohnten Umgebung geht es nur langsam voran. Wir verlaufen uns oft und gehen Wege mehrfach, doch schließlich haben wir die Fährte des Tieres ([ROOT.Char.Custom('GetAnimal')])!\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "Natürlich weckt ein Laut ([ROOT.Char.Custom('GetAnimalSound')]) von ihm bald schon die Aufmerksamtkeit eines ausgewachsenen Tieres ([ROOT.Char.Custom('GetAnimaltype')]). Wir beobachten, wie das Biest aus dem Dickicht ([local_province.Custom('GetProvinceFoliageDesc')]) heraus vorsichtig die Umgebung betrachtet. Schließlich nähert es sich zögernd dem Jungtier ([ROOT.Char.Custom('GetAnimalChild')]), und wir lassen unsere Falle zuschnappen!"
 gdp_merchant_luxury_contract.0044.bait_failure: "Oder so hätte es sein können … Nachdem es einige Zeit friedfertig dasaß und ab und an einen leisen Laut ([ROOT.Char.Custom('GetAnimalSound')]) von sich gab, sprang das Tier plötzlich mit aller Kraft auf, riss sich los und verschwand ins Dickicht ([local_province.Custom('GetProvinceFoliageDesc')]) …"
 gdp_merchant_luxury_contract.0044.success: "Wir haben Glück, dass wir das Tier ([ROOT.Char.Custom('GetAnimalType')]) gänzlich unaufmerksam im Dickicht ([local_province.Custom('GetProvinceFoliageDesc')]) überrraschen können, und mit viel Lärm ([ROOT.Char.Custom('GetAnimalSound')]) und in einem Farbwirbel ([ROOT.Char.Custom('GetAnimalColor')]) wird die Bestie mit einem Netz eingefangen!"
 gdp_merchant_luxury_contract.0044.failure: "Leider gehen die Dinge schief. Genauso schnell, wie wir es erblicken konnten, ist die Bestie auch schon wieder im Dickicht ([local_province.Custom('GetTerrainLand')]) verschwunden, mit viel Lärm ([ROOT.Char.Custom('GetAnimalSoundParticiple')]) und einem Farbwirbel ([ROOT.Char.Custom('GetAnimalColor')]) – offenbar zu verschreckt, um sich einfangen zu lassen."
 gdp_merchant_luxury_contract.0044.a: "Was für ein schönes Paar Ihr abgebt!"
 gdp_merchant_luxury_contract.0044.b: "Verdammte Biester!"
 gdp_merchant_luxury_contract.0044.c: "Jetzt habe ich dich!"
 gdp_merchant_luxury_contract.0044.d: "Verdammtes Biest!"
 gdp_merchant_luxury_contract.0044.e: "Wie würde es Euch gefallen, [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip] zu sehen, [hunter.GetFirstNameNoTooltip]?"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: Gewildert"
 gdp_merchant_luxury_contract.0051.desc: "Wir kamen an einem [local_province.Custom('GetProvinceGroundDescAdjective')|l]en Dorf vorbei und erkundigten uns nach einheimischen Wildtieren. Der Dorfvorsteher warnte uns sehr ernst und erklärte, eine große einheimische Persönlichkeit namens [rich_local.GetName] würde gerade in diesem Gebiet [rich_local.Custom('GetAnimalPlural')] jagen.\n\nBevor wir weiterziehen, kommt ein [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)|l]er Dörfler auf uns zu und erklärt uns ruhig, dass es einfach sein würde, eine der Kreaturen ([rich_local.Custom('GetAnimalPlural')]) [rich_local.GetTitleAsNamePossessiveNoTooltip] einzufangen!\n\nEine dreiste Vorstellung, aber vielleicht eine Gelegenheit, die wir nicht ignorieren sollten?"
 gdp_merchant_luxury_contract.0051.a: "Ein solches Tier ([rich_local.Custom('GetAnimalType')])? Lasst uns sofort aufbrechen!"
 gdp_merchant_luxury_contract.0051.a.flavor: "Die Einheimischen könnten bestraft werden …"
 gdp_merchant_luxury_contract.0051.a.tt: "Ihr werdet versuchen, von [rich_local.GetShortUIName] zu wildern"
 gdp_merchant_luxury_contract.0051.b: "Ich lege mich nicht mit [Select_CString(rich_local.IsFemale, 'einer', 'einem')] [rich_local.GetTitleAsNameNoTooltip] an …"
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "[Select_CString(hunter.IsFemale, 'Meine Führerin', 'Mein Führer')] [hunter.GetFirstName] lenkt uns rasch durch das Dickicht ([local_province.Custom('GetProvinceFoliageDesc')]), und wir durchqueren das örtliche Gelände ([local_province.Custom('GetTerrainTypePlural')]) mit beeindruckender Geschwindigkeit. Als wir an einer Lichtung ankommen, bleibt [hunter.Custom('DE_PRO_PER_S_3P_N')] plötzlich stehen und horcht angestrengt.\n\n„Leise!“, zischt [hunter.Custom('DE_PRO_PER_S_3P_N')] und zieht mich außer Sicht. „Bleibt in der Nähe.“\n\nNur einen kurzen Augenblick später stiebt die Jagdgesellschaft an uns vorbei und wühlt den Boden ([local_province.Custom('GetProvinceGroundDesc')]) auf, während weitere Jäger in der Ferne rufen.\n\nDann höre ich es: den Laut ([rich_local.Custom('GetAnimalSound')]) einer ganz bestimmten Bestie ([rich_local.Custom('GetAnimalType')])!"
 gdp_merchant_luxury_contract.0052.a: "Hier kommt ein Exemplar! Netz!"
 gdp_merchant_luxury_contract.0052.a.success: "Ihr fangt die Bestie ([rich_local.Custom('GetAnimalType')])"
 gdp_merchant_luxury_contract.0052.a.neutral: "Ihr verfehlt die Bestie ([rich_local.Custom('GetAnimalType')])"
 gdp_merchant_luxury_contract.0052.a.failure: "Die Bestie ([rich_local.Custom('GetAnimalType')]) verletzt Euch"
 gdp_merchant_luxury_contract.0052.b: "Versteckt Euch! Wir sind erledigt!"
 gdp_merchant_luxury_contract.0052.b.tt: "Die Bestie ([rich_local.Custom('GetAnimalType')]) entkommt"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "Wir kehren zurück ins Dorf, wo der Dorfvorsteher auf uns zustürmt und schreit, dass die Leute von [rich_local.GetTitledFirstName] dagewesen seien und nach Wilderern gesucht hätten!\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName|U] blickt schuldbewusst auf die gefesselte Bestie ([rich_local.Custom('GetAnimalType')]), allerdings nicht schuldig genug, um [hunter.Custom('DE_PRO_POS_S_3P')]en Stolz zu verhehlen."
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName|U] blickt niedergeschlagen zu Boden, während das restliche Dorf finster dreinschaut.\n\nAls [hunter.Custom('DE_PRO_PER_S_3P_N')] zurück zu [hunter.Custom('DE_PRO_POS_S_3P')]er Behausung geht, ist dort eine angebundene Bestie ([hunter.Custom('GetAnimalType')]) zu sehen."
 gdp_merchant_luxury_contract.0053.a: "„Was für eine wunderbare Kreatur …“"
 gdp_merchant_luxury_contract.0053.b: "„… Ich werde [rich_loyal.Custom('DE_ART_DEF_S_D')] [rich_local.GetTitleAsNameNoTooltip] sagen, wer sich das Tier genommen hat!“"
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip|U] ist von Eurer Kühnheit beeindruckt"
 gdp_merchant_luxury_contract.0053.c: "„Das war ein grässlicher Einfall …“"
 gdp_merchant_luxury_contract.0053.d: "„… doch trotzdem könnte ich [Select_CString(hunter.IsFemale, 'eine Frau', 'einen Mann')] wie Euch gebrauchen, [hunter.GetFirstNameNoTooltip].“"
 gdp_merchant_luxury_contract.0053.e: "„Ihr habt nie erwähnt, dass Ihr selbst eine solche Bestie ([hunter.Custom('GetAnimalType')]) habt!“"
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "Diesen Morgen erblicken wir die Ortschaft ([local_barony.Custom('BaronyTownType')]) in [local_province.GetBaronyNameExplicitlyNoTooltip], unser lang gesuchtes Ziel, das sich vor uns aus der Landschaft ([local_province.Custom('GetTerrainLandPlural')]) erhebt."
 gdp_merchant_luxury_contract.1001.desc.locals: "Am Tor erbitten wir von vorbeieilenden Dorfbewohnern in unserem holprigen [local_county.GetCountyData.GetCulture.GetLanguage.GetName|U] Wegbeschreibungen; auf unsere ungeschickten Fragen können sie nur mit Mühe antworten, doch sie deuten in Richtung"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "Am Tor antwortet eine Gruppe vorbeieilender Dorfbewohner auf unsere Fragen auf [local_county.GetCountyData.GetCulture.GetLanguage.GetName|U] mit Wegbeschreibungen in Richtung"
 gdp_merchant_luxury_contract.1001.desc.religious: "eines prächtigen und ehrwürdigen Grabmals in [religious_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "eines ehrwürdigen Zentrums der Gelehrsamkeit in [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.fallback: "eines örtlichen Marktes."
 gdp_merchant_luxury_contract.1001.a: "Der örtliche Handelsplatz ([local_province.Custom('GetRegionalMarketTerm')]) sollte etwas zu bieten haben."
 gdp_merchant_luxury_contract.1001.a.flavor: "Bevorzugt die Zurschaustellung von [stewardship_i|E][stewardship|E] und [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1001.a.tt: "Versucht, ein #V Kuriositäten#!-[domicile_artifact|E] auf dem Markt zu beschaffen"
 gdp_merchant_luxury_contract.1001.d: "Der prächtige Handelsplatz ([local_province.Custom('GetRegionalMarketTerm')]) ruft uns!"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "Lasst uns diesen heiligen Ort aufsuchen."
 gdp_merchant_luxury_contract.1001.e.flavor: "Bevorzugt die Zurschaustellung von [piety_i|E][piety|E] und [learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "Versucht, ein #V Kuriositäten#!-[domicile_artifact|E] bei der religiösen Stätte zu beschaffen"
 gdp_merchant_luxury_contract.1001.f: "Es muss hier viel geben, was wir lernen können."
 gdp_merchant_luxury_contract.1001.f.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "Versucht, ein #V Kuriositäten#!-[domicile_artifact|E] im Zentrum der Gelehrsamkeit zu beschaffen"
 gdp_merchant_luxury_contract.1001.return.religious: "Lasst uns zu dem heiligen Ort zurückkehren …"
 gdp_merchant_luxury_contract.1001.return.scholarly: "Lasst uns das Zentrum der Gelehrsamkeit finden …"
 gdp_merchant_luxury_contract.1001.return.urban: "Ich gehe nur eben zum Markt …"
 gdp_merchant_luxury_contract.1001.give_up: "Oh, vergesst es!"
 gdp_merchant_luxury_contract.1001.fallback: "Ich werde [local_province.GetBaronyNameExplicitlyNoTooltip] nicht mit leeren Händen verlassen."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "Ihr findet ein Schmuckstück auf dem örtlichen Handelsplatz ([local_province.Custom('GetRegionalMarketTermGloss')])"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: Handelszentrum"
 gdp_merchant_luxury_contract.1101.desc: "Die Ortschaft ([local_province.GetTitle.Custom('BaronyTownType')]) in [local_province.GetBaronyNameExplicitlyNoTooltip] ist voll geschäftigen Treibens, als die Einheimischen und Reisenden inmitten der Eindrücke von Bildern, Geräuschen und Gerüchen auf dem [local_province.Custom('GetProvinceAdjective')|l]en Handelsplatz ([local_province.Custom('GetRegionalMarketTermGloss')]) nach Waren jeglicher Art suchen.\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "In einer dunklen Ecke erblicke ich ein mürrisches Straßenkind, das schweigend und mit stechendem Blick den unablässigen Strom an Passanten verfolgt."
 gdp_merchant_luxury_contract.1101.antiques: "Ein schiefer Stand mit Antiquitäten, der übersät ist mit Nippes aus Holz ([local_province.Custom('GetRandomRegionalWood')]) und angelaufenem Metall, erweckt meine Neugierde, sehr zur Freude [Select_CString(dealer.IsFemale, 'der', 'des')] [dealer.Custom('GetYoungMiddleAgedOld')|l]en [Select_CString(dealer.IsFemale, 'Aufpasserin', 'Aufpassers')]."
 gdp_merchant_luxury_contract.1101.bookseller: "Der zerrissene Stoff ([ROOT.Char.Custom('RegionalFabric')]) des Vordachs eines schäbigen Geschäfts steht im Widerspruch zu den unzähligen ramponierten Schriftrollen und Folianten, die an den Wänden gestapelt lehnen und über die [Select_CString(dealer.IsFemale, 'eine', 'ein')] [dealer.Custom('GetYoungMiddleAgedOld')|l][Select_CString(dealer.IsFemale, 'e Frau', 'er Mann')] wacht."
 gdp_merchant_luxury_contract.1101.travelers: "Eine Gruppe [traveler.GetCulture.GetCollectiveNoun], die vom Leben gezeichnet wirken, ließ sich auf einem nahen Platz nieder und unterscheidet sich in Kleidung und Sprache deutlich von den [local_province.GetCulture.GetName|l]en Einheimischen."
 gdp_merchant_luxury_contract.1101.tavern: "Auf der anderen Straßenseite erweckt das derbe Gelage in einer Taverne meine Aufmerksamkeit, und ich erblicke [Select_CString(gambler.IsFemale, 'eine zwielichtig aussehende Spielerin, die', 'einen zwielichtig aussehenden Spieler, der')] eine Börse voller Münzen herumwirbelt, die [gambler.Custom('DE_PRO_PER_S_3P_N')] gerade einem verzweifelten Herausforderer abgenommen hat."
 gdp_merchant_luxury_contract.1101.merchant: "Ich erblicke [Select_CString(other_merchant.IsFemale, 'eine gut gekleidete Frau, die', 'einen gut gekleideten Mann, der')] über das langsame Vorankommen einer Karane durch die Stadt schimpft. [other_merchant.Custom('DE_PRO_PER_S_3P_N')|U] ist ein einheimischer Kaufmann ganz nach meinem Geschmack."
 gdp_merchant_luxury_contract.1101.a: "Das Kind wirkt … #EMP gerissen#!."
 gdp_merchant_luxury_contract.1101.a.flavor: "Bevorzugt die Zurschaustellung von [intrigue_i|E][intrigue|E] und [diplomacy|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "Ihr wartet ab, was das Straßenkind sagt"
 gdp_merchant_luxury_contract.1101.b: "[Select_CString(dealer.IsFemale, 'Diese Händlerin', 'Dieser Händler')] könnte etwas Spannendes haben …"
 gdp_merchant_luxury_contract.1101.b.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1101.b.tt: "Ihr versucht, eine spannende Antiquität zu kaufen"
 gdp_merchant_luxury_contract.1101.c: "Da muss es ein oder zwei spannende Bücher geben."
 gdp_merchant_luxury_contract.1101.c.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1101.c.tt: "Ihr versucht, ein spannendes Buch zu kaufen"
 gdp_merchant_luxury_contract.1101.d: "Diese [traveler.GetCulture.GetCollectiveNounNoTooltip] müssen das eine oder andere gesehen haben."
 gdp_merchant_luxury_contract.1101.d.lingua: "Eine Gelegenheit, mein [traveler.GetCulture.GetLanguage.GetNameNoTooltip|U] auf die Probe zu stellen."
 gdp_merchant_luxury_contract.1101.d.flavor: "Bevorzugt die Zurschaustellung von [diplomacy_i|E][diplomacy|E] und [learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "Ihr unterhaltet Euch mit den Reisenden"
 gdp_merchant_luxury_contract.1101.e: "Ihr könnt dem Glücksspiel nicht widerstehen …"
 gdp_merchant_luxury_contract.1101.e.flavor: "Bevorzugt die Zurschaustellung von [intrigue_i|E][intrigue|E] und den Zufall"
 gdp_merchant_luxury_contract.1101.e.tt: "Ihr schaut, was [Select_CString(gambler.IsFemale, 'der Spielerin', 'dem Spieler')] abgenommen werden kann"
 gdp_merchant_luxury_contract.1101.f: "Ah, [Select_CString(other_merchant.IsFemale, 'eine Wettbewerberin', 'ein Wettbewerber')] könnte mich verstehen."
 gdp_merchant_luxury_contract.1101.f.flavor: "Bevorzugt die Zurschaustellung von [stewardship_i|E][stewardship|E] und [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1101.f.tt: "Ihr wartet ab, was [Select_CString(other_merchant.IsFemale, 'die Händlerin', 'der Händler')] zu sagen hat"
 gdp_merchant_luxury_contract.1102.urchin: "Es ist schwer, [urchin.GetFirstName] dazu zu bringen, nicht mehr auf der Hut zu sein. Ich versuche, [urchin.Custom('DE_PRO_PER_S_3P_A')] mit Verachtung für die Vorbeieilenden und Geschichten über die rauhen Straßen von [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] für mich zu gewinnen.\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "Meine Geschichten über ferne Orte und die Gewinne eines Kaufmannslebens erwecken [urchin.Custom('DE_PRO_POS_S_3P')] Interesse. Als ich so weit bin, [urchin.Custom('DE_PRO_PER_S_3P_D')] ein Angebot zu machen, kommt [urchin.Custom('DE_PRO_PER_S_3P_N')] mir zuvor und bietet mir das Schmuckstück an, wenn ich [urchin.Custom('DE_PRO_PER_S_3P_A')] im Gegenzug mitnehme!"
 gdp_merchant_luxury_contract.1102.urchin.success: "Schließlich habe ich das Gefühl, wir verstehen uns so gut, dass ich ganz unverblümt fragen kann, wie viel [urchin.Custom('DE_PRO_PER_S_3P_N')] für das Schmuckstück haben möchte. Mit einem listigen Grinsen nennt [urchin.Custom('DE_PRO_PER_S_3P_N')] mir [urchin.Custom('DE_PRO_POS_S_3P')]en Preis."
 gdp_merchant_luxury_contract.1102.urchin.failure: "Schließlich habe ich das Gefühl, wir verstehen uns so gut, dass ich ganz unverblümt fragen kann, wie viel [urchin.Custom('DE_PRO_PER_S_3P_N')] für das Schmuckstück haben möchte. [urchin.Custom('DE_PRO_PER_S_3P_N')|U] verzieht nur den Mund und sagt mir, ich solle verschwinden."
 gdp_merchant_luxury_contract.1102.antiques: "[Select_CString(dealer.IsFemale, 'Die durchtriebene Händlerin', 'Der durchtriebene Händler')] und ich feilschen hin und her und debattieren die Verarbeitung des Stücks, sein Alter und seinen Zustand.\n\nSchließlich jedoch kommen der [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('dealer'))|l]e Sturschädel und ich nicht weiter."
 gdp_merchant_luxury_contract.1102.antiques.success: "Ich muss sagen, der Preis ist nicht schlecht. Viel besser, als ich hätte hoffen können."
 gdp_merchant_luxury_contract.1102.antiques.failure: "Ich kann nicht sagen, dass ich mit dem Ergebnis zufrieden bin, denn ich fühle mich ausgenutzt."
 gdp_merchant_luxury_contract.1102.bookseller: "[Select_CString(dealer.IsFemale, 'Die durchtriebene Händlerin', 'Der durchtriebene Händler')] und ich feilschen hin und her und debattieren die Herkunft des Buches, sein Alter und seinen Zustand.\n\nSchließlich jedoch kommen der [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('dealer'))|l]e Sturschädel und ich nicht weiter."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "Die Gruppe fasst mir gegenüber etwas Zutrauen, denn offenbar bin ich das Spannendste, was sie den ganzen Tag gesehen haben, und schon bald tauschen wir unsere Reiseberichte aus."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nNicht lange und wir essen gemeinsam und lachen und witzeln über unsere ähnlichen Missgeschicke und Erfahrungen in [local_province.GetBaronyNameExplicitly]. Als wir uns verabschieden, drückt mir [traveler.GetFirstName] ein Päckchen in die Hand und umarmt mich herzlich."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nNachdem wir ein paar kleinere Episodenfetzen miteinander geteilt haben, fällt mir rasch nichts mehr ein, wovon ich erzählen könnte, und die [traveler.GetCulture.GetCollectiveNoun] können nicht verbergen, dass sie sich meine Weiterreise wünschen."
 gdp_merchant_luxury_contract.1102.tavern: "Es scheint eine ausgeglichene Paarung zu sein, als wir unsere Würfel anwärmen und abwechselnd eine Runde oder zwei gewinnen, während wir Münzen tauschen und uns gegenseitig foppen. Doch [gambler.GetFirstName] ist trickreich, keine Frage.\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "Die Mächte des Wohlstands ([merchant.GetFaith.WealthGodName]) sind mir heute hold! Ob eines frühen Vorsprungs meinerseits wird [gambler.GetFirstNameNoTooltip] zunehmend sprachloser, und fluchend gräbt [gambler.Custom('DE_PRO_PER_S_3P_N')] sich ein immer tieferes Loch, bis [gambler.Custom('DE_PRO_PER_S_3P_N')] hinausstürmt und [gambler.Custom('DE_PRO_POS_S_3P')]e Würfel auf die Straße schmeißt!"
 gdp_merchant_luxury_contract.1102.tavern.failure: "Es braucht ein wenig, doch schließlich übernehme ich die Führung und stelle die Geduld von [gambler.GetFirstNameNoTooltip] so sehr auf die Probe, dass [gambler.Custom('DE_PRO_PER_S_3P_N')] beschließt aufzuhören, wohingegen ich mit meinen Münzen prahle."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "Schließlich zieht [gambler.Custom('DE_PRO_PER_S_3P_N')] alle Register, und schon bald liege ich nicht nur viele Runden zurück, sondern mir fehlen auch Geduld und Münzen. Missmutig ziehe ich mich von [gambler.GetFirstNameNoTooltip] und [gambler.Custom('DE_PRO_POS_S_3P')]er Schadenfreude zurück."
 gdp_merchant_luxury_contract.1102.merchant: "In ein paar ruhigen Schreibstuben in der Nähe der Handelsstätte ([local_province.Custom('GetRegionalMarketTermGloss')]) besprechen [other_merchant.GetTitledFirstName] und ich ausgiebig unsere Geschäfte, denken über gemeinsame Verbindungen an fernen Orten nach und heben beide unsere Erfolge hervor.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "Wir verstehen uns gut und teilen so manches Getränk ([other_merchant.Custom('RegionalDrink')]) und Brot, während wir uns Ratschläge geben und künftige Möglichkeiten diskutieren, die einen gemeinsamen Vorteil versprechen. Es fällt schwer, Abschied zu nehmen, und [other_merchant.GetFirstNameNoTooltip] bedenkt mich mit ein paar schönen Kostproben seiner Waren als Abschiedsgeschenk."
 gdp_merchant_luxury_contract.1102.merchant.failure: "Wir scheinen nicht viele Gemeinsamkeiten zu finden und sind bald gereizt von der Prahlerei des jeweils anderen und dem allgemeinen Widerwillen, nützliches Wissen zu teilen. Ich verabschiede mich schon bald von [Select_CString(other_merchant.IsFemale, 'dieser langweiligen Frau', 'diesem langweiligen Mann')]."
 gdp_merchant_luxury_contract.1102.a: "Das ist sicherlich noch nützlich."
 gdp_merchant_luxury_contract.1102.b: "Das muss ausreichen …"
 gdp_merchant_luxury_contract.1111.desc: "Ich überquere die [local_province.Custom('GetProvinceAdjective')]e Straße in Richtung [Select_CString(urchin.IsFemale, 'der Kleinen', 'des Kleinen')]. Als [urchin.Custom('DE_PRO_PER_S_3P_N')] mich erblickt, scheint [urchin.Custom('DE_PRO_POS_S_3P')] durchdringender Blick nach einer Erklärung für mein Verhalten zu suchen, doch ich gehe weiter zu jener Mauer, gegen die [urchin.Custom('DE_PRO_PER_S_3P_N')] sich lehnt, und gebe [urchin.Custom('DE_PRO_PER_S_3P_D')] zu verstehen, dass ich keine Bedrohung darstelle.\n\nEin glänzendes Schmuckstück funkelt verlockend in [urchin.Custom('DE_PRO_POS_S_3P')]er Hand, wird allerdings rasch verstaut, als [urchin.Custom('DE_PRO_PER_S_3P_N')] meinem Blick folgt. „Was wollt Ihr?“, fragt [urchin.Custom('DE_PRO_PER_S_3P_N')]. „Ich bin [urchin.GetFirstName]. Das hier sind #EMP meine#! Straßen.“"
 gdp_merchant_luxury_contract.1111.a: "Ihr seht aus, als wüsstet Ihr die eine oder andere Sache."
 gdp_merchant_luxury_contract.1111.a.success_critical: "Ihr gewinnt [urchin.Custom('DE_PRO_POS_S_3P')] Vertrauen"
 gdp_merchant_luxury_contract.1111.a.success: "Ihr kauft [urchin.Custom('DE_PRO_POS_S_3P')]e Beute"
 gdp_merchant_luxury_contract.1111.a.failure: "Ihr gewinnt [urchin.Custom('DE_PRO_POS_S_3P')]e Missachtung"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "Dieser Gegendstand wurde von [urchin.GetFirstName] auf den Straßen von [local_province.GetBaronyNameExplicitly] entwendet."
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip|U]er Ring"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "[local_county.GetAdjectiveNoTooltip|U]e Brosche"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip|U]e Halskette"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "Ich gebe mich demonstrativ gleichgültig, während ich die angebotenen Gegenstände durchstöbere und das wahre Ausmaß meines Interesses zu verbergen versuche – obwohl es schwer zu sagen ist, wie überzeugt [Select_CString(dealer.IsFemale, 'die Ladenbesitzerin', 'der Ladenbesitzer')] tatsächlich ist.\n\nMein Herz schlägt schnell für ein ganz besonderes Stück, das aus den anderen heraussticht und dessen Stil mit der Zeit noch exotischer wurde, sogar hier, an jenem Ort, an dem es einst erschaffen wurde."
 gdp_merchant_luxury_contract.1121.a: "Lasst uns über den Preis sprechen ..."
 gdp_merchant_luxury_contract.1121.a.success_critical: "Ihr handelt einen sehr guten Preis aus"
 gdp_merchant_luxury_contract.1121.a.success: "Ihr handelt einen guten Preis aus"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.Custom('DE_PRO_PER_S_3P_N')|U] verhandelt hart"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "[artifact.GetName] aus alten Zeiten"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] Dieses Artefakt ist vom Zahn der Zeit gezeichnet und im Kampf nicht mehr zu benutzen."
