 gdp_merchant_luxury_contract.1131.desc: "Ich gebe mich demonstrativ gleichgültig, während ich die angebotenen Werke durchstöbere und das wahre Ausmaß meines Interesses zu verbergen versuche – obwohl es schwer zu sagen ist, wie überzeugt [Select_CString(dealer.IsFemale, 'die Ladenbesitzerin', 'der Ladenbesitzer')] tatsächlich ist.\n\nMein Herz schlägt schnell für einen ganz besonderen Band, der aus der Menge heraussticht und – soweit ich das sagen kann – ein seltenes und oft übersehenes Werk ist."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Von einem Händler in [local_province.GetBaronyNameExplicitly] erworben."
 gdp_merchant_luxury_contract.1141.desc: "Ich nähere mich dem [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('traveler'))|l]en Oberhaupt des Trupps mit einem warmen Lächeln und hoffe, dass unser fremdländischer Hintergrund ein vereinendes Moment in der Fremde sein wird.\n\n[Select_CString(traveler.IsFemale, 'Die Frau', 'Der Mann')] nennt sich selbst [traveler.GetFirstName]. Im Gegenzug stelle ich mich mit „[merchant.GetNameNoTooltip|U]. Sicherlich habt Ihr schon von mir gehört?“ vor – halb als Bluff, halb als Scherz gemeint."
 gdp_merchant_luxury_contract.1141.a: "Ihr müsst einige spannende Geschichten kennen!"
 gdp_merchant_luxury_contract.1141.a.flavor: "Eine Probe Eurer [diplomacy_i|E][diplomacy|E] und [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1141.a.success: "Ihr freundet Euch mit [traveler.GetFirstNameNoTooltip] an"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip|U] wird Eurer überdrüssig"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] Von einem Händler in [local_province.GetBaronyNameExplicitly] erworben, vom Zahn der Zeit gezeichnet und im Kampf nicht mehr zu benutzen."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip|U]e Brosche"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ Erworben von Reisenden in [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1151.desc: "Als ich mich durch die Vorhänge in den schäbigen Unterschlupf zwänge, beobachte ich die Halunken und Herumtreiber. In der Mitte des Raumes sitzt [Select_CString(gambler.IsFemale, 'die Spielerin', 'der Spieler')] und zählt fröhlich Münzen.\n\nIch setze mich gegenüber hin und [Select_CString(gambler.IsFemale, 'die Frau', 'der Mann')] mustert mich mit gelupften Augenbrauen. „Wollt Ihr spielen?“, fragt [gambler.Custom('DE_PRO_PER_S_3P_N')] lächelnd. „Ich bin [gambler.GetFirstName], und Ihr fangt bitte nicht an zu weinen, wenn ich Euch Eure Münzen abnehme.“"
 gdp_merchant_luxury_contract.1151.a: "Spielen wir."
 gdp_merchant_luxury_contract.1151.a.flavor: "Eine Probe Eures [intrigue_i|E][Concept('intrigue', 'Ränkespiels')|E] und des Zufalls"
 gdp_merchant_luxury_contract.1151.a.success: "Ihr nehmt [gambler.Custom('DE_PRO_PER_S_3P_A')] aus"
 gdp_merchant_luxury_contract.1151.a.failure: "Ihr gewinnt einige Münzen"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "Ihr verliert einige Münzen"
 gdp_merchant_luxury_contract.1151.artifact.dice: "Glückswürfel [Select_CString(gambler.IsFemale, 'der Spielerin', 'des Spielers')]"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "Der hart errungene Würfel von [gambler.GetFirstName], [Select_CString(gambler.IsFemale, 'eine Schurkin und Spielerin', 'ein Schurke und Spieler')] aus [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1161.desc: "Ich unterbreche das Genörgel des Kaufmanns, als ich mich als Oberhaupt meiner Unternehmung ([merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]) aus [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] vorstelle und erkläre, dass ich nicht aus geschäftlichen Gründen hier bin.\n\nIm Gegenzug erfahre ich, dass dieser Mensch [other_merchant.GetName] heißt, aus [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly] stammt und hier Geschäfte in Sachen [merchant_good.GetName] macht. Nachdem wir einander gemustert haben, bietet [other_merchant.Custom('DE_PRO_PER_S_3P_N')] an, mich in der Nähe unterzubringen."
 gdp_merchant_luxury_contract.1161.a: "Es gibt einiges, was wir besprechen könnten."
 gdp_merchant_luxury_contract.1161.a.flavor: "Eine Probe Eurer [stewardship_i|E][stewardship|E] und [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip|U] freundet sich mit Euch an"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip|U] ist unversöhnlich"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Tuchproben"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Proben eines Tuchs ([other_merchant.Custom('RegionalFabric')]) aus [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], wie sie Kaufleute bei ihren Geschäften nutzen."
 gdp_merchant_luxury_contract.1161.artifact.gem: "Edelsteinproben"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Edelsteinproben aus [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], wie sie Kaufleute bei ihren Geschäften nutzen."
 gdp_merchant_luxury_contract.1161.artifact.gold: "Metallproben"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Proben von wertvollem Metall aus [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], wie sie Kaufleute bei ihren Geschäften nutzen."
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: Religiöses Zentrum"
 gdp_merchant_luxury_contract.1501.desc: "Wir folgen den Pfaden unzähliger Pilger und Verehrer, und bald schon gelangen wir zu dem prächtigen Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName]) in [religious_building_province.GetName].\n\n"
 gdp_merchant_luxury_contract.1501.site: "Die Grabstätte ist ein prächtiges Monument des Eifers vergangener [religious_building_faith.GetReligion.GetAdjective|l]er Herrscher im Namen der höchsten Macht ([religious_building_faith.HighGodName]). Aus dem Inneren dringt das melodiöse Gemurmel eines Gottesdienstes."
 gdp_merchant_luxury_contract.1501.tombs: "Ein kurzes Stück entfernt liegt eine Ansammlung verwitterter Steingräber, die mit religiösen Zeichen ([religious_building_faith.ReligiousSymbol]) versehen, aber mittlerweile überwuchert und durch den Lauf der Jahreszeiten verwittert sind."
 gdp_merchant_luxury_contract.1501.pilgrim: "Stete Reihen von Anhängern, die wegen ihres Aussehens leicht als Pilger zu erkennen sind, warten darauf, einzutreten. Eine Gruppe fällt besonders auf, da sie eine Art von Reliquie mit sich trägt."
 gdp_merchant_luxury_contract.1501.monks: "In der Nähe steht eine Gruppe von Mönchen ruhig im Schatten, in Gedanken versunken und leise Worte wechselnd, während die Welt um sie herum langsam weiterzieht."
 gdp_merchant_luxury_contract.1501.keepsake: "Als ich mich dem Gebäude nähere, bemerke ich eine abgenutzte Stelle im Mauerwerk, an der mehrere Steine im Lauf der Zeit lose wurden und gesprungen sind."
 gdp_merchant_luxury_contract.1501.apostate: "Ganz für sich allein sitzt [Select_CString(pilgrim.IsFemale, 'eine bekümmert aussehende Frau', 'ein bekümmert aussehender Mann')] im Schatten des Gebäudes, die Ellenbogen auf die Knie gestützt, das Gesicht in einer Hand und in der anderen ein Buch."
 gdp_merchant_luxury_contract.1501.a: "Ich will hineinschauen."
 gdp_merchant_luxury_contract.1501.a.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.a.tt: "Ihr seht, was in dem Gebäude ([religious_building_faith.HouseOfWorship]) wartet"
 gdp_merchant_luxury_contract.1501.b: "Es muss etwas in diesen Gräbern sein …"
 gdp_merchant_luxury_contract.1501.b.flavor: "Bevorzugt die Zurschaustellung von [intrigue_i|E][intrigue|E] und [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "Ihr kehrt des Nachts zurück, um ein Grab zu plündern"
 gdp_merchant_luxury_contract.1501.c: "Diese Pilger sehen leichtgläubig aus …"
 gdp_merchant_luxury_contract.1501.c.flavor: "Bevorzugt die Zurschaustellung von [intrigue_i|E][intrigue|E] und [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "Ihr versucht, einen Pilger zu betrügen"
 gdp_merchant_luxury_contract.1501.d: "Ich möchte mit diesen Mönchen reden."
 gdp_merchant_luxury_contract.1501.d.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.d.tt: "Ihr beginnt eine Unterhaltung mit den Mönchen"
 gdp_merchant_luxury_contract.1501.e: "Niemand wird einen fehlenden Stein bemerken …"
 gdp_merchant_luxury_contract.1501.e.flavor: "Bevorzugt die Zurschaustellung von [intrigue_i|E][intrigue|E] und [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "Ihr versucht, einen Teil des Bauwerks mitgehen zu lassen"
 gdp_merchant_luxury_contract.1501.f: "[Select_CString(pilgrim.IsFemale, 'Diese Frau', 'Dieser Mann')] sieht aus, als würde [pilgrim.Custom('DE_PRO_PER_S_3P_N')] Hilfe brauchen."
 gdp_merchant_luxury_contract.1501.f.flavor: "Bevorzugt die Zurschaustellung von [diplomacy_i|E][diplomacy|E] und [piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.f.tt: "Ihr beginnt eine Unterhaltung mit [Select_CString(pilgrim.IsFemale, 'der Pilgerin', 'dem Pilger')]"
 gdp_merchant_luxury_contract.1502.site: "Der Mensch, der hier als [priest.Custom('PriestTitle')] wirkt, mustert mich sorgsam von Kopf bis Fuß und wägt meine Worte und meine Miene sorgfältig ab, während Gläubige an uns vorbeiziehen und Gebete und Wünsche murmeln.\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "Schließlich seufzt [Select_CString(priest.IsFemale, 'die Frau', 'der Mann')]: „Ich kann Euch Eure ernsthafte Bitte nicht abschlagen.“ [priest.Custom('DE_PRO_PER_S_3P_N')|U] greift nach einem Buch und [priest.Custom('DE_PRO_POS_S_3P')]e Finger verharren einen Moment auf dem Einband, bevor [priest.Custom('DE_PRO_PER_S_3P_N')] es mir zeigt.\n\n„Nehmt das, [Select_CString(ROOT.Char.IsFemale, 'meine Freundin', 'mein Freund')]. Möget Ihr die Worte der höchsten Macht ([religious_building_faith.HighGodNameAlternate]) darin finden.“"
 gdp_merchant_luxury_contract.1502.site.failure: "Schließlich runzelt [Select_CString(priest.IsFemale, 'die Frau', 'der Mann')] die Stirn. „Raus mit Euch! Ihr seid hier falsch. Dies ist ein Gotteshaus ([religious_building_faith.HouseOfWorship]), ein Ort der Verehrung. Ich habe heute keine Zeit für Euer törichtes Verhalten.“\n\nMehrere Gläubige drehen sich um und warten darauf, dass ich gehe."
 gdp_merchant_luxury_contract.1502.pilgrim: "Durch freundliches Nachfragen finde ich heraus, dass man die Reliquie hierher brachte, um sie dem Gotteshaus ([pilgrim.GetFaith.HouseOfWorship]) zu spenden, nachdem man sie in der Nähe des eigenen Heimatortes erworben hatte.\n\nIch täusche Bestürzung vor und heuchle Mitgefühl, dass sie so unwürdig betrogen wurden!\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Verärgert, aber nicht wütend beobachte ich sie, wie sie von dannen ziehen und die kleine Schachtel auf das Ödland hinter dem umzäunten Areal werfen."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Ihre Antwort überrascht mich allerdings etwas, als sie die Reliquie zu Boden werfen und sie so lange mit Tritten und Schlägen malträtieren, bis sie völlig zerstört ist – und die Menge bestürzt zurückbleibt.\n\nIch sollte mich besser verabschieden …"
 gdp_merchant_luxury_contract.1502.tomb: "Diese Gräber lassen sich schwerer aufbrechen, als es den Anschein hat! Wir hebeln schließlich eines dieser größeren Monumente mit einem gewaltigen Ruck auseinander.\n\nIch wische mir den Schweiß ab und werfe einen Blick in das dunkle Innere, wo ich etwas entdecke – und vorsichtig hineingreife und es heraushole.\n\n„Bringt Licht!“, flüstere ich ungeduldig.\n\nIn meinen Händen halte ich …"
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "eine fein gestaltete und geschmückte Urne!"
 gdp_merchant_luxury_contract.1502.tomb.success: "eine abgenutzte und beschädigte Urne?"
 gdp_merchant_luxury_contract.1502.tomb.failure: "einen #EMP Knochen#!?"
 gdp_merchant_luxury_contract.1502.monks: "Diese Mönche sind noch spannender, als ich dachte! Viele interessante Einsichten und Deutungen erwachsen aus dem geistlichen Leben, angefangen bei den heiligen Schriften ([monk.GetFaith.ReligiousText]) bis hin zu Geheimnissen über die listenreichen Mächte ([monk.GetFaith.TricksterGodName]).\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "Wir beginnen eine gute Unterhaltung. und die Mönche wirken traurig, dass sie mich verabschieden müssen. [monk.GetFirstName|U] drückt mir beim Abschied etwas in die Hand und lächelt mich freundlich an."
 gdp_merchant_luxury_contract.1502.monks.failure: "Allerdings scheint [monk.GetFirstName] immer dann das Interesse zu verlieren, wenn ich zu sprechen beginne, und wirkt ungehalten und abwesend. Und schon bald wird klar, dass ich meinen Besuch überzogen habe."
 gdp_merchant_luxury_contract.1502.keepsake: "Nach einem letzten Blick hinter mich zur Absicherung gebe ich mein Bestes, um in einer einzigen flüssigen Bewegung etwas umzustoßen, aufzufangen und zu greifen.\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "Mit Anmut und Geschick nehme ich ein kleines Stück aus der Mauer heraus und verstecke es unter meinem Mantel, während ich ungerührt weitergehe. Niemand scheint es bemerkt zu haben!"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "Meine ungeschickten Bewegungen führen nur dazu, dass ich mit einem dumpfen Schlag zu Boden gehe und vor Schmerz aufstöhne, während mehrere neugierige Pilger ungläubig zu mir und zur Mauer und dann wieder zurück schauen."
 gdp_merchant_luxury_contract.1502.apostate: "[Select_CString(pilgrim.IsFemale, 'Die Frau', 'Der Mann')] beschwert sich nicht, als ich mich neben [pilgrim.Custom('DE_PRO_PER_S_3P_A')] setze und sanft meine Lieblingsverse aus den heiligen Schriften ([merchant.GetFaith.ReligiousText]) rezitiere, und bald schon stellt [pilgrim.Custom('DE_PRO_PER_S_3P_N')] abgelenkt von meinen Worten das Weinen ein.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "Ich spüre, dass [pilgrim.Custom('DE_PRO_PER_S_3P_N')] von meinen Worten bewegt ist, und tatsächlich dauert es nicht lange, bis [pilgrim.GetFirstName] mir deutlich zu verstehen gibt, dass [pilgrim.Custom('DE_PRO_PER_S_3P_N')] diesen Ort verlassen und mich auf dem Weg der höchsten Macht ([merchant.GetFaith.HighGodNameAlternate]) begleiten möchte!"
 gdp_merchant_luxury_contract.1502.apostate.success: "Beim Lesen spüre ich eine Veränderung bei [pilgrim.Custom('DE_PRO_PER_S_3P_D')], als ob [pilgrim.Custom('DE_PRO_PER_S_3P_D')] eine schwere Last von den Schultern fiele.\n\nSchweigend steht [pilgrim.Custom('DE_PRO_PER_S_3P_N')] auf und verlässt das Gebäude, [pilgrim.Custom('DE_PRO_POS_S_3P')] zerlesenes Buch bleibt an meiner Seite liegen."
 gdp_merchant_luxury_contract.1502.apostate.failure: "Es dauert allerdings nicht lange, ehe sich [pilgrim.Custom('DE_PRO_POS_S_3P')]e Miene verhärtet und [pilgrim.Custom('DE_PRO_PER_S_3P_N')] von einer neuen Regung beherrscht wird: Wut.\n\n[pilgrim.Custom('DE_PRO_PER_S_3P_N')|U] schreit, dass ich [pilgrim.Custom('DE_PRO_PER_S_3P_A')] zum Glaubensabfall brächte – auf dem Boden eines Gotteshauses ([pilgrim.GetFaith.HouseOfWorship]) noch dazu! Bald schon kommen verärgerte Zuschauer hinzu …"
 gdp_merchant_luxury_contract.1502.a.critical: "Das passt ganz ausgezeichnet!"
 gdp_merchant_luxury_contract.1502.a: "Das ist sicherlich noch nützlich."
 gdp_merchant_luxury_contract.1502.b: "Das muss ausreichen …"
 gdp_merchant_luxury_contract.1511.desc: "Nachdem die Sonne untergegangen ist, stehlen wir uns zurück in die Nähe des Gotteshauses ([religious_building_district.GetType.GetPrimaryBuildingType.GetName]) und suchen in den vergessenen Gräbern längst verstorbener Einheimischer nach Schätzen.\n\nAus Angst, gesehen zu werden, vermeiden wir die üblichen Routen und gelangen schließlich auf den kalten und stummen Friedhof."
 gdp_merchant_luxury_contract.1511.a: "Lasst uns ein Grabmal öffnen! Und sputen wir uns!"
 gdp_merchant_luxury_contract.1511.a.flavor: "Eine Probe Eures [intrigue_i|E][Concept('intrigue', 'Rännkespiels')|E] und Eures [prowess_i|E][Concept('prowess', 'Kampfgeschicks')|E]"
 gdp_merchant_luxury_contract.1511.a.success_critical: "Ihr findet ein reiches Artefakt"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "Ihr findet ein #V Kuriositäten#!-[domicile_artifact|E] von hoher Güte"
 gdp_merchant_luxury_contract.1511.a.success: "Ihr findet ein bescheidenes Artefakt"
 gdp_merchant_luxury_contract.1511.a.success.tt: "Ihr findet ein #V Kuriositäten#!-[domicile_artifact|E] von geringer Güte"
 gdp_merchant_luxury_contract.1511.a.failure: "Ihr findet nichts Erwähnenswertes"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "Ihr findet ein #V Kuriositäten#!-[domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.artifact.urn: "[religious_building_faith.GetAdjectiveNoTooltip|U]e Grabbeigaben"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "Eine Urne aus dem Grab eines längst verstorbenen Gläubigen ([religious_building_faith.GetAdherentName]), erbeutet aus einem Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1511.artifact.skull: "Schädel aus einer Plünderung"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "Der Schädel aus dem Grab eines längst verstorbenen Gläubigen ([religious_building_faith.GetAdherentName]), erbeutet aus einem Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1511.artifact.bone: "[priest.Custom('RandomSaintBone')] aus einer Plünderung"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "Der Knochen aus dem Grab eines längst verstorbenen Gläubigen ([religious_building_faith.GetAdherentName]), erbeutet aus einem Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1521.desc: "Als ich durch die großen Türen in die Dunkelheit trete, stehe ich in einer geschmückten Eingangshalle, in der es schwer nach den exotischen Düften von Riten und Opfergaben riecht.\n\nDie Verehrenden stehen um eine priesterliche Gestalt herum, die mit den Gottesdienstbesuchern spricht und mich sofort entdeckt – offenkundig falle ich hier auf.\n\n[priest.Custom('DE_PRO_PER_S_3P_N')|U] kommt [merchant.Custom2('QuirkAdverbPosOrNeg', SCOPE.sC('priest'))] zu mir. „Seid willkommen! Ihr befindet Euch in einem Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName]).\n\nWas sucht Ihr hier?“, fragt [priest.Custom('DE_PRO_PER_S_3P_N')] und blickt mich neugierig an. „Folgt Ihr den Lehren des Glaubens ([religious_building_faith.GetNameNoTooltip])?“"
 gdp_merchant_luxury_contract.1521.a: "Ich möchte alles über den Glauben ([religious_building_faith.GetNameNoTooltip]) lernen."
 gdp_merchant_luxury_contract.1521.a.flavor: "Eine Probe Eurer [learning_i|E][learning|E] und [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')] bietet mir einen Text an"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')] ist argwöhnisch"
 gdp_merchant_luxury_contract.1531.desc: "Die [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim'))]en Pilger beobachten mich argwöhnisch, als ich mich nähere, und halten ihre bescheidene Reliquie noch fester, während ich versuche, einen Blick darauf zu werfen.\n\nDie [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] messen diesem Gegenstand auf jeden Fall einiges an Bedeutung bei, und er würde in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] so manch nettes Gespräch anstoßen.\n\nIch kann diese Tölpel sicherlich überzeugen, dass sie von einem Krämer oder einem gewissenlosen [pilgrim.GetFaith.PriestNeuter] übers Ohr gehauen wurden …"
 gdp_merchant_luxury_contract.1531.a: "Es ist offenkundig eine Fälschung, denn es gibt Hunderte in [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] …"
 gdp_merchant_luxury_contract.1531.a.success: "Die Pilger werfen die Reliquie weg"
 gdp_merchant_luxury_contract.1531.a.failure: "Die Pilger sind wütend"
 gdp_merchant_luxury_contract.1541.desc: "Die Mönche blicken mich zunächst misstrauisch an, irritiert durch mein fremdländisches Gebaren, aber können ihre Neugier nicht verbergen, vor allem als ich deutlich mache, dass ich über Theologie diskutieren möchte.\n\nDie Jüngeren unter ihnen sind unsicher, ihr Oberhaupt jedoch, [Select_CString(monk.IsFemale, 'die', 'der')] [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('monk'))]e [monk.GetFirstName], heißt mich in ihrer Mitte willkommen und löchert mich mit Fragen zu meinen Reisen."
 gdp_merchant_luxury_contract.1541.a: "Ja, natürlich, aber wie denkt Ihr über die Mächte des Wohlstands ([monk.GetFaith.WealthGodName])?"
 gdp_merchant_luxury_contract.1541.a.flavor: "Eine Probe Eurer [learning_i|E][learning|E] und [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1541.a.success: "Die Mönche genießen die Diskussion"
 gdp_merchant_luxury_contract.1541.a.failure: "Die Mönche sind unbeeindruckt"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "[religious_building_faith.GetAdjectiveNoTooltip|U]e Gebetskette"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "Ein Set von [religious_building_faith.GetAdjective|l]er Gebetsperlen, ein Geschenk eines Mönchs aus einem Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1541.artifact.icon: "[religious_building_faith.GetAdjectiveNoTooltip|U]e Ikone"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "[SCOPE.Custom('ArtifactArticleWealth')|U]e Ikone von [SCOPE.Custom('ArtifactQuality')|l]er Machart, die Folgendes zeigt: [newly_created_artifact.GetFeatureText('icon_decoration')], ein Geschenk von Mönch [monk.GetFirstName] aus einem Gotteshaus ([religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1551.desc: "Während ich mich verstohlen umsehe, schlendere ich ganz beiläufig um das Gebäude ([religious_building_district.GetType.GetPrimaryBuildingType.GetName]) herum, lächle freundlich mir Entgegenkommende an und bewundere demonstrativ die Architektur.\nSchließlich widme ich mich einem Bereich mit besonders hochwertigem Mauerwerk, das scheinbar schon gelockert ist und sich in einem der ruhigsten Bereiche der Anlage befindet."
 gdp_merchant_luxury_contract.1551.a: "Ich muss nur den rechten Moment finden …"
 gdp_merchant_luxury_contract.1551.a.success: "Ihr nehmt Euch etwas von dem Mauerwerk"
 gdp_merchant_luxury_contract.1551.a.failure: "Ihr werdet auf frischer Tat ertappt"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Heiliges Mauerwerk"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "Ein kleines Stück Mauerkwerk aus dem religiösen Zentrum einer Verehrungsstätte ([religious_building_district.GetType.GetPrimaryBuildingType.GetName]), das als Andenken gestohlen wurde."
 gdp_merchant_luxury_contract.1561.desc: "Als ich mich [Select_CString(pilgrim.IsFemale, 'der Frau', 'dem Mann')] nähere, wird klar, dass [Select_CString(pilgrim.IsFemale, 'sie eine Pilgerin ist', 'er ein Pilger ist')], wie so viele hier, beladen mit Reisegepäck und von der Sonne verbrannt.\n\nIch finde heraus, dass [pilgrim.Custom('DE_PRO_PER_S_3P_N')] [pilgrim.GetFirstName] heißt und [pilgrim.Custom('DE_PRO_PER_S_3P_N')] nach vielen Schicksalsschlägen [pilgrim.Custom('DE_PRO_POS_S_3P')]en Glauben in die höchste [pilgrim.GetFaith.GetAdjectiveNoTooltip|l]e Macht ([pilgrim.GetFaith.HighGodName]) verloren hat. Sogar diese Pilgerreise vermochte es nicht, diesen Glauben wiederherzustellen.\n\nIch sehe [pilgrim.Custom('DE_PRO_POS_S_3P')]e tränenverschleierten Augen und die zerlesenen heiligen Schriften ([pilgrim.GetFaith.ReligiousText]). Ein Zeugnis [pilgrim.Custom('DE_PRO_POS_S_3P')]es Ringens."
 gdp_merchant_luxury_contract.1561.a: "In der heiligen Schrift ([merchant.GetFaith.ReligiousText]) stehen die Antworten …"
 gdp_merchant_luxury_contract.1561.a.flavor: "Eine Probe Eurer [diplomacy_i|E][diplomacy|E] und [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip|U] ist bekehrt"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip|U] ist ermutigt"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip|U] ist erzürnt"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "Tränenverschmierte Texte ([religious_building_faith.ReligiousText|U])"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "Persönliche Schriften, die einst einem geplagten [pilgrim.GetFaith.GetAdherentNameNoTooltip] namens [pilgrim.GetFirstName] gehörten, [pilgrim.Custom('DE_ART_DEF_S_N')] [pilgrim.Custom('DE_PRO_POS_S_3P')]en Glauben verloren hatte."
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: Zentrum des Wissens"
 gdp_merchant_luxury_contract.1601.desc: "Ich bin beeindruckt von dem Ausmaß des Gebäudes ([scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]). Seine Höfe und Hallen sind erfüllt vom Stimmengewirr so vieler gelehrter Menschen, die debattieren und nachdenken.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "[Select_CString(scholar.IsFemale, 'Eine Frau', 'Ein Mann')], beständig [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('scholar'))|l], eilt von Bediensteten begleitet vorbei und weist hochnäsig die anderen Gelehrten ab. Offenbar hat [scholar.Custom('DE_PRO_PER_S_3P_N')] hier das Sagen."
 gdp_merchant_luxury_contract.1601.sages: "Unter einem Baum auf dem Gelände sitzt schweigend [Select_CString(sage.IsFemale, 'eine weise alte Frau', 'ein weiser alter Mann')] und denkt womöglich über ein paar schwerwiegende Fragen des Lebens nach. Vielleicht hält [sage.Custom('DE_PRO_PER_S_3P_N')] aber auch nur ein Nickerchen."
 gdp_merchant_luxury_contract.1601.library: "Als ich an einer Tür vorbeigehe, erblicke ich [Select_CString(scholar.IsFemale, 'eine Frau', 'einen Mann')], [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('scholar'))|l] und allein in einer beeindruckenden Bibliothek, umgeben von einer Fülle von Texten. [scholar.Custom('DE_PRO_PER_S_3P_N')|U] liest ruhig und scheint sich in einem Zustand völliger Glückseligkeit zu befinden."
 gdp_merchant_luxury_contract.1601.physician: "In einem anderen Raum beugt sich [Select_CString(physician.IsFemale, 'eine Frau', 'ein Mann')] über eine schaurige Sammlung von allerlei Untersuchungsexemplaren, tierischen wie menschlichen, sowie über zahlreiche Instrumente. Man kann nur hoffen, dass [physician.Custom('DE_PRO_PER_S_3P_N')] [Select_CString(physician.IsFemale, 'eine Ärztin', 'ein Arzt')] ist …"
 gdp_merchant_luxury_contract.1601.student: "Eine besonders laute Gruppe von Studenten ist kaum zu übersehen. Sie diskutieren freundschaftich und lachen herzhaft, als sie einander in einer schattigen Ecke des großen Hofs wechselseitig aufziehen."
 gdp_merchant_luxury_contract.1601.botanist: "In einer ruhigen Ecke des Gebäudes stoße ich auf einen Raum, in dem sich eine merkwürdige Sammlung von Pflanzen und Tieren befindet, die von einer [merchant.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('scholar'))|l]en Person aufbewahrt und katalogisiert werden."
 gdp_merchant_luxury_contract.1601.a: "Das muss [Select_CString(scholar.IsFemale, 'die Dekanin', 'der Dekan')] sein."
 gdp_merchant_luxury_contract.1601.a.flavor: "Bevorzugt die Zurschaustellung von [diplomacy_i|E][diplomacy|E] und [prestige_i|E][prestige_level|E]."
 gdp_merchant_luxury_contract.1601.a.tt: "Ihr nähert Euch [Select_CString(scholar.IsFemale, 'der Dekanin', 'dem Dekan')]"
 gdp_merchant_luxury_contract.1601.b: "Ich fühle mich zu [Select_CString(sage.IsFemale, 'der alten Frau', 'dem alten Mann')] hingezogen …"
 gdp_merchant_luxury_contract.1601.b.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1601.b.tt: "Ihr nähert Euch [Select_CString(sage.IsFemale, 'der', 'dem')] Weisen"
 gdp_merchant_luxury_contract.1601.c: "In einer Bibliothek ist stets Wissen zu finden."
 gdp_merchant_luxury_contract.1601.c.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "Ihr betretet die Bibliothek"
 gdp_merchant_luxury_contract.1601.d: "Die Kunst des Medicus ist faszinierend."
 gdp_merchant_luxury_contract.1601.d.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "Ihr nähert Euch [Select_CString(physician.IsFemale, 'der Ärztin', 'dem Arzt')]"
 gdp_merchant_luxury_contract.1601.e: "Diese Studenten sehen nett aus."
 gdp_merchant_luxury_contract.1601.e.flavor: "Bevorzugt die Zurschaustellung von [diplomacy_i|E][diplomacy|E] und [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "Ihr nähert Euch den Studenten"
 gdp_merchant_luxury_contract.1601.f: "Diese Sammlung von Untersuchungsexemplaren ist atemberaubend."
 gdp_merchant_luxury_contract.1601.f.flavor: "Bevorzugt die Zurschaustellung von [learning_i|E][learning|E] und [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "Ihr erkundet die Sammlung"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "Ursprünglich Teil der Sammlung einer Verehrungsstätte ([scholarly_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName|U] folgt mir gedanklich, bis ich mich ganz klar ausgedrückt habe. Ich stamme aus einem fremden Land, wo dieses Papier nichts wert ist.\n\nNachdem ich die entsprechenden Argumente vorgebracht habe, gebe ich [scholar.Custom('DE_PRO_PER_S_3P_D')] den Raum, zu sprechen."
 gdp_merchant_luxury_contract.1602.dean.success: "[scholar.Custom('DE_PRO_PER_S_3P_N')|U] zeigt ein breites Grinsen, als [scholar.Custom('DE_PRO_PER_S_3P_N')] die offiziellen Dokumente nimmt und meine … Qualitäten bestätigt."
 gdp_merchant_luxury_contract.1602.dean.failure: "[scholar.Custom('DE_PRO_POS_S_3P')|U] unbewegtes Gesicht verhärtet sich, und verlegen bittet [scholar.Custom('DE_PRO_PER_S_3P_N')] mich zu gehen."
 gdp_merchant_luxury_contract.1602.sages: "Wir reden Ewigkeiten über Philosophie, sinnieren über Fragen, über die ich selten gesprochen habe, und bekommen gar nicht mit, dass sich der Himmel verdunkelt und ein weiterer Tag entschwindet.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "Schließlich steht die [sage.Custom('GetYoungMiddleAgedOld')|l]e Person auf und holt etwas aus ihrem Gewand, reicht es mir mit einem wissenden Nicken und entschwindet ohne Umschweife."
 gdp_merchant_luxury_contract.1602.sages.failure: "Schließlich steht die [sage.Custom('GetYoungMiddleAgedOld')]e Person auf, gürtet ihr Gewand enger um sich und entschwindet ohne Umschweife. Zumindest ich habe unser letztes Gespräch genossen …"
 gdp_merchant_luxury_contract.1602.library: "Ich zeige Interesse an [scholar.Custom('DE_PRO_POS_S_3P')]en Texten, und [scholar.Custom('DE_PRO_PER_S_3P_N')] stellt sich selbst als [scholar.GetFirstName] vor. Eine Zeit lang zählt [scholar.Custom('DE_PRO_PER_S_3P_N')] die vielen Werke auf, die [scholar.Custom('DE_PRO_PER_S_3P_N')] als Teil [scholar.Custom('DE_PRO_POS_S_3P')]er Studien bereits gelesen hat oder noch lesen wird, und fragt für jedes Werk nach meiner Meinung.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip|U] grinst bald wie ein Kind, und als es schließlich Zeit zum Gehen wird, reicht [scholar.Custom('DE_PRO_PER_S_3P_N')] mir mit einem listigen Zwinkern ein kleines Buch."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip|U] verliert rasch jegliches Interesse an mir und meinen Antworten und wendet sich brüsk wieder [scholar.Custom('DE_PRO_POS_S_3P')]en Notizen zu. Ich gehe."
 gdp_merchant_luxury_contract.1602.physician: "Ich zeige Interesse an Anatomie und versuche, so viel beizutragen, wie ich nur kann. [physician.Custom('DE_PRO_PER_S_3P_N')|U] redet sehr lange über die Eigenschaften des Leibes und verwendet knöcherne Exponate, um [physician.Custom('DE_PRO_POS_S_3P')]e Ausführungen zu untermalen.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.Custom('DE_PRO_PER_S_3P_N')|U] scheint von meinem Wissen beeindruckt zu sein, beklagt die Unwissenheit [scholar.Custom('DE_PRO_POS_S_3P')]er Studenten und Kollegen und zeigt mir einen Artikel."
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.Custom('DE_PRO_PER_S_3P_N')|U] verdreht bei meinen Fragen und zögerlichen Erklärungen ungeduldig diee Augen und sucht schon bald nach einer fadenscheinigen Ausrede, um mich aus dem Zimmer zu werfen."
 gdp_merchant_luxury_contract.1602.student: "Wir habern eine wilde Zeit in der Taverne ([student.Custom('GetPubName')]), während ich inmitten jugendlichen Taugenichtse Hof halte, Geschichten von meinen vielen Reisen erzähle und ihre unzähligen Fragen beantworte.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "Wir ziehen von Taverne zu Taverne, und schon bald bricht der Morgen an. Wir verabschieden uns nach einem letzten Lobgesang am Straßenrand, und einer von ihnen drückt mir irgendetwas in die Hand. Was für eine Nacht!"
 gdp_merchant_luxury_contract.1602.student.failure: "Die Dinge scheinen zunächst gut zu laufen, doch schon bald langweilt sie meine Begleitung und ich finde mich mit meinem Becher allein auf der falschen Seite der Stadt wieder. Was habe ich Falsches gesagt?"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName|U] führt mich eifrig durch die Sammlung und zeigt mir ausgewählte Stücke von besonderer Schönheit und Kuriosität.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.Custom('DE_PRO_PER_S_3P_N')|U] ist äußerst begeistert von meinem Interesse und nickt enthusiastisch, während [botanist.Custom('DE_PRO_PER_S_3P_N')] die Exklusivität und die Herkunft der Stücke erklärt.\n\nAls ich schließlich gehen muss, gibt [botanist.Custom('DE_PRO_PER_S_3P_N')] mir ein kleines Geschenk, von dem [botanist.Custom('DE_PRO_PER_S_3P_N')] wusste, dass ich mich besonders dafür interessierte."
 gdp_merchant_luxury_contract.1602.botanist.failure: "Es scheint, als könne ich die Sammlung oder [botanist.Custom('DE_PRO_POS_S_3P')]e Führung nicht angemessen würdigen, und schon bald macht [botanist.Custom('DE_PRO_PER_S_3P_N')] deutlich, dass meine Anwesenheit für [botanist.Custom('DE_PRO_POS_S_3P')]e Zwecke überflüssig ist …"
 gdp_merchant_luxury_contract.1602.a: "Ich werde das in Ehren halten!"
 gdp_merchant_luxury_contract.1602.b: "Das ist schon etwas, denke ich."
 gdp_merchant_luxury_contract.1611.desc: "Nachdem [scholar.Custom('DE_PRO_PER_S_3P_N')] zunächst abweisend ist, ist [Select_CString(scholar.IsFemale, 'die Dekanin', 'der Dekan')] äußerst geschmeichelt, als ich [scholar.Custom('DE_PRO_PER_S_3P_D')] mitteile, dass ich ein erfolgreicher Kaufmann aus der Ferne ([merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]) bin, und theatralisch stellt [scholar.Custom('DE_PRO_PER_S_3P_N')] sich als [Select_CString(scholar.IsFemale, 'Meisterin', 'Meister')] [scholar.GetFirstName] vor.\n\n[scholar.Custom('DE_PRO_PER_S_3P_N')|U] bittet mich in [scholar.Custom('DE_PRO_POS_S_3P')]e privaten Studierzimmer und erzählt unterwegs von architektonischen Besonderheiten und Kuriositäten. „So, was kann ich für Euch tun, [Select_CString(merchant.IsFemale, 'meine gute', 'mein guter')] [merchant.GetTitledFirstNameNoTooltip]?“, grinst [scholar.Custom('DE_PRO_PER_S_3P_N')]."
 gdp_merchant_luxury_contract.1611.a: "Ich wünschte, ich hätte die Gelegenheit bekommen, hier zu studieren …"
 gdp_merchant_luxury_contract.1611.a.flavor: "Eine Probe Eurer [diplomacy_i|E][diplomacy|E] und [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "Ihr erhaltet ein Ehrendiplom"
 gdp_merchant_luxury_contract.1611.a.success: "Man bietet Euch gegen eine gewisse Summe ein Ehrendiplom an"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip|U] ist beleidigt"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Ehrendiplom"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "Ein Ehrenzertifikat für Bildung, das mir vom Dekan einer Lehrstätte ([scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]) in [local_province.GetBaronyNameExplicitly] verliehen wurde."
 gdp_merchant_luxury_contract.1621.desc: "Ich nähere mich vorsichtig [Select_CString(sage.IsFemale, 'der weisen Frau', 'dem weisen Mann')], um [sage.Custom('DE_PRO_POS_S_3P')]e tiefe Versenkung nicht über Gebühr zu stören. Allerdings ist [sage.Custom('DE_PRO_PER_S_3P_N')] [Select_CString(sage.IsFemale, 'diejenige', 'derjenige')], [sage.Custom('DE_ART_DEF_S_N')] mich erschreckt!\n\n„Wollt Ihr dabei sein?“, fragt [sage.Custom('DE_PRO_PER_S_3P_N')] ruhig, ohne sich in meine Richtung zu drehen oder die Augen zu öffnen. „Kommt und setzt Euch.“\n\nDemütig nehme ich [sage.Custom('DE_PRO_POS_S_3P')] Angebot an und setze mich neben [sage.Custom('DE_PRO_PER_S_3P_A')], so huldvoll wie möglich.\n\n„Ich bin [sage.GetFirstName]“, krächzt [sage.Custom('DE_PRO_PER_S_3P_N')]. „Was bringt Euch an diesen Ort?“"
 gdp_merchant_luxury_contract.1621.a: "Ich … weiß es nicht."
 gdp_merchant_luxury_contract.1621.a.flavor: "Eine Probe Eurer [learning_i|E][learning|E] und [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.Custom('DE_PRO_PER_S_3P_N')|U] ist ermutigt"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.Custom('DE_PRO_PER_S_3P_N')|U] ist enttäuscht"
 gdp_merchant_luxury_contract.1631.desc: "Ich trete in einen Raum mit scheinbar endlosen Regalwänden, die vollgestopft sind mit Schriftrollen, und in dem der Geruch von alter Tinte und Papier hängt.\n\nRuhig nähere ich mich [Select_CString(scholar.IsFemale, 'der', 'dem')] schweigsamen Gelehrten, bis [scholar.Custom('DE_PRO_PER_S_3P_N')] mich endlich bemerkt. Zunächst tut [scholar.Custom('DE_PRO_PER_S_3P_N')] sehr geschäftig und abweisend, doch sein Blick wird sanfter, als meine fremdländische Herkunft [scholar.Custom('DE_PRO_POS_S_3P')]e Neugier zu wecken scheint."
 gdp_merchant_luxury_contract.1631.a: "Was ist das, was Ihr da lest, [Select_CString(scholar.IsFemale, 'meine Freundin', 'mein Freund')]?"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.Custom('DE_PRO_PER_S_3P_N')|U] ist beeindruckt von Eurem Wissen"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.Custom('DE_PRO_PER_S_3P_N')|U] hält Euch für [Select_CString(scholar.IsFemale, 'eine Landpommeranze', 'einen Bauerntölpel')]"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "Eine makabere Szene wartet auf mich. Unzählige Knochen menschlicher und anderer Herkunft sind in säuberlichen Reihen arrangiert, befühlt und betastet von einer [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)|l]en Person zum Nutzen einer Handvoll von Studenten.\n\n[physician.Custom('DE_PRO_PER_S_3P_N')|U] bemerkt mich schließlich, wirft mir einen fragenden Blick zu und bittet mich, zu der Gruppe zu treten. Ich finde heraus, dass dies [physician.GetFirstName] ist, und ich bin erleichtert, dass [physician.Custom('DE_PRO_PER_S_3P_N')] tatsächlich [Select_CString(physician.IsFemale, 'eine Frau', 'ein Mann')] der Medizin ist."
 gdp_merchant_luxury_contract.1641.a: "Ah, ist das nicht ein Knochen einer ganz besonderen Sorte? [merchant.Custom('RandomSaintBone')|U], oder?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip|U] ist beeindruckt"
 gdp_merchant_luxury_contract.1641.a.failure: "Ihr missfallt [physician.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "[physician.Custom('RandomSaintBone')|U] eines Menschen"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "Ein Knochen, der als medizinisches Lehrmittel genutzt wird. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "Schädel eines Menschen"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "Ein Schädel, der als medizinisches Lehrmittel genutzt wird. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "Als ich mich der Gruppe nähere, stelle ich mich vor. Die Studenten bilden einen Kreis um mich herum und lachen miteinander, aber sind ganz offenbar fasziniert von jemanden aus fremden Landen, der sich ihnen nähert.\n\nNachdem sie verstanden haben, dass ich ein weit gereister Kaufmann aus [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip] bin, ist ihre Neugierde geweckt und ich werde in ein berüchtigtes Etablissement in der Nähe eingeladen für … Erfrischungen."
 gdp_merchant_luxury_contract.1651.a: "In die Taverne!"
 gdp_merchant_luxury_contract.1651.a.success: "Ihr unterhaltet die Studenten"
 gdp_merchant_luxury_contract.1651.a.failure: "Ihr langweilt die Studenten"
 gdp_merchant_luxury_contract.1661.desc: "Als ich die merkwürdige Halle betrete, bin ich sprachlos. Noch nie habe ich eine solche Sammlung gesehen: diese unzählbare Vielfalt an Farben, Blüten und Blättern, Fell und Federn. Ein Fest für die Sinne und ein Abbild der Natur …\n\nDurch [Select_CString(physician.IsFemale, 'die Verwalterin, die', 'den Verwalter, der')] sich selbst als [botanist.GetFirstName] vorstellt und mir eine Führung anbietet, werde ich zurück in die Gegenwart gebracht."
 gdp_merchant_luxury_contract.1661.a: "Vielen Dank!"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip|U] weiß Euer Interesse zu schätzen"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip|U] ist unbeeindruckt"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "Ein Artefakt ([newly_created_artifact.Custom('ArtifactAnimalTrinketType')]) von einem Tier ([owner.Custom('GetAnimalType')]). $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "Die Feder von einem Tier ([owner.Custom('GetAnimalType')]). $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
