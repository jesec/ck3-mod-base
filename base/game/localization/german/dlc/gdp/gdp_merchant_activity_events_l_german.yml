l_german:
 gdp_merchant_activity_events.0001.t: "Ungespeister Appetit"
 gdp_merchant_activity_events.0001.desc: "Während die Heiterkeit eigentlich wachsen sollte, höre ich das Grummeln hungriger und zunehmend aufgebrachter Gäste. Auf den Tellern liegen nur noch Krümel, und es gibt keine Bediensteten, die die Teller auffüllen.\n\n[guest.GetTitledFirstName|U] steht [guest.Custom('quirk_neg_present')] mit einem leeren Becher an der Seite und fragt: „Was muss man machen, um bei diesem vermaledeiten Festmahl ein Getränk zu bekommen?“"
 gdp_merchant_activity_events.0001.host: "\n\nVielleicht ist das meine Gelegenheit, die Stimmung aufzulockern?"
 gdp_merchant_activity_events.0001.guest: "\n\nVielleicht ist das meine Gelegenheit, das Fest [Select_CString(host.IsFemale, 'unserer Gastgeberin', 'unseres Gastgebers')] [host.GetTitledFirstName] aufzulockern?"
 gdp_merchant_activity_events.0001.a: "„Los, bringt die Küche von [host.GetTitledFirstNameNoTooltip] zum Laufen. Scheut keine Kosten!“"
 gdp_merchant_activity_events.0001.a.host: "„Nun gut. Ich sollte #EMP wirklich#! die Küche zum Laufen bringen!“"
 gdp_merchant_activity_events.0001.b: "Sieht so aus, als wäre ich in einer guten Position, um zu verhandeln."
 gdp_merchant_activity_events.0001.c: "„Ihr solltet dankbarer sein, [guest.GetTitledFirstNameNoTooltip]!“"
 gdp_merchant_activity_events.0001.d: "„Wenn Ihr es nicht mögt, raus hier!“"
 gdp_merchant_activity_events.0001.e: "„Bedient Euch im Warenhaus der Gesellschaft.“"
 gdp_merchant_activity_events.0005.t: "Eine exotische Bitte"
 gdp_merchant_activity_events.0005.desc: "Mein[admirer.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))] [admirer.GetTitledFirstName] winkt mich zu sich herüber, damit ich mich an [admirer.Custom('DE_PRO_POS_S_3P')]er Unterhaltung mit [guest.GetTitledFirstName] beteilige.\n\n[admirer.GetFirstNameNoTooltip|U] lächelt mit"
 gdp_merchant_activity_events.0005.desc_esteemed: "Wärme"
 gdp_merchant_activity_events.0005.desc_fallback: "Heiterkeit"
 gdp_merchant_activity_events.0005.desc_outro: "im Blick und sagt: „Gerade sprachen mein[guest.Char.Custom('DE_END_PRO_S_N')] [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))] hier und ich über Eure [luxury_artifact.Custom('GetLuxuryArtifactSentiment')|l]e Entdeckung in der Ferne. Nur zu: Erzählt uns, wie es Euch gelang, Euer Artefakt ([luxury_artifact.GetName]) zu erwerben!“\n\nMir ist bewusst, dass [Select_CString(admirer.IsFemale, 'die', 'der')] [admirer.Custom('NoblewomanNobleman')] möchte, dass ich zur Unterhaltung der beiden Späße mache und herumalbere."
 gdp_merchant_activity_events.0005.a: "„Es war keine besondere Leistung …“"
 gdp_merchant_activity_events.0005.b: "„Ich setzte Arm und Bein für das Ding aufs Spiel!“"
 gdp_merchant_activity_events.0005.b.success: "Eure Ausschmückungen klingen echt"
 gdp_merchant_activity_events.0005.b.failure: "Ihr werdet beim Lügen erwischt"
 gdp_merchant_activity_events.0005.c: "„Dann hört mal gut her!“"
 gdp_merchant_activity_events.0005.d: "„Das ist nichts im Vergleich zu den Luxuswaren, mit denen ich in [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] Handel treibe.“"
 gdp_merchant_activity_events.0010.t: "Geben ist seliger"
 gdp_merchant_activity_events.0010.desc: "Kaum dass [merchant.GetTitledFirstName], ein weiterer Kaufmann, angekommen war, begann [merchant.Custom('DE_PRO_PER_S_3P_N')] auch schon, [merchant.Custom('DE_PRO_POS_S_3P')]en Reichtum zur Schau zu stellen. [merchant.Custom('DE_PRO_PER_S_3P_N')|U] spielt mit [merchant.Custom('DE_PRO_POS_S_3P')]em teuren Schmuck, zeigt [merchant.Custom('DE_PRO_POS_S_3P')]e kostbaren Gewänder aus feinstem Tuch ([merchant.Custom('RegionalFabric')]) und preist schamlos [merchant.Custom('DE_PRO_POS_S_3P')]e [good.Custom('GetTradeGoodUnitPlural')] [good.GetNameNoTooltip] in [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip] an.\n\nIch erwische [merchant.Custom('DE_PRO_PER_S_3P_A')] dabei, wie m[receiver.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', receiver)] [receiver.GetTitledFirstName] von [merchant.Custom('DE_PRO_PER_S_3P_D')] vor einer Schar beeindruckter Zuschauer ein Geschenk überreicht bekommt."
 gdp_merchant_activity_events.0010.a: "Dieses Spiel beherrsche ich auch …"
 gdp_merchant_activity_events.0010.b: "„Welch ein wohlüberlegtes Geschenk, [merchant.GetTitledFirstNameNoTooltip]!“"
 gdp_merchant_activity_events.0010.b.success: "Ihr führt [merchant.GetFirstNameNoTooltip] vor"
 gdp_merchant_activity_events.0010.b.failure: "Ihr wirkt töricht"
 gdp_merchant_activity_events.0010.c: "Ist mir vollkommen einerlei."
 gdp_merchant_activity_events.0010.d: "„Es gehört sich nicht, vor seinen Höhergestellten zu prahlen.“"
 gdp_merchant_activity_events.0015.t: "Bauernschicksal"
 gdp_merchant_activity_events.0015.desc: "Das Festmahl mit guten Getränken und viel Essen in der angenehmen Wärme einer Feuerstelle bildet einen scharfen Gegensatz zu der Kühle der Nacht draußen dar.\n\nIch begebe mich ein wenig abseits, um etwas frische Luft zu schnappen, als ich eine bettelarme Menge erblicke: Einige Gemeine drücken sich an den Mauern herum, in der Hoffnung, ein paar Brotkrumen vom Festmahl zu ergattern, sobald es beendet ist."
 gdp_merchant_activity_events.0015.a: "Lasst sie essen und fröhlich sein, und zwar auf meine Kosten!"
 gdp_merchant_activity_events.0015.b: "Ich würde eher ein Getränk ([ROOT.Char.Custom('RegionalDrink')]) mit den Adligen trinken."
 gdp_merchant_activity_events.0015.b.alcohol: "Ich würde eher einen Schluck [ROOT.Char.Custom('RegionalAlcoholicDrink')] mit den Adligen trinken."
 gdp_merchant_activity_events.0015.c: "Hier gehöre ich #EMP wahrhaftig#! hin."
 gdp_merchant_activity_events.0015.d: "Hinfort mit Euch, Abschaum!"
 custom.every_attending_noble: "Alle teilnehmenden [Concept('noble', 'adligen')|E] [Concept('character', 'Charaktere')|E]"
 gdp_merchant_activity_events.0020.t: "Im Auge des Betrachters"
 gdp_merchant_activity_events.0020.desc: "Mich erreicht die Kunde, das mein[other.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))] [other.GetTitledFirstName] zu diesem Anlass das schönste Artefakt ([fake_artifact.GetNameNoTooltip]) überhaupt trägt.\n\nIch erblicke [Select_CString(other.IsFemale, 'die Frau', 'den Mann')] in der großen Halle, und [other.Custom('DE_PRO_PER_S_3P_N')] wirkt äußerst prächtig in [other.Custom('DE_PRO_POS_S_3P')]en Gewändern und mit der Kette, die auf [other.Custom('DE_PRO_POS_S_3P')]er Brust ruht. [other.Custom('DE_PRO_PER_S_3P_N')|U] [other.Custom('quirk_pos_present')], als ich mich nähere, und sagt: „Habt Ihr meine neueste Errungenschaft gesehen? Was für ein Schatz, nicht wahr?“\n\nDas warme Licht der vielen Kerzen in der Halle beleuchtet das Juwel sehr schmeichelhaft, doch mit meinem geübten Auge komme ich nicht umhin, die vielen Fehler zu bemerken."
 gdp_merchant_activity_events.0020.a: "„Wie lustig! [other.GetFirstNameNoTooltip|U] denkt, dass dieses Schmuckstück etwas wert ist.“"
 gdp_merchant_activity_events.0020.b: "#weak *flüsternd*#! „Lasst mich diesen wertlosen Tand für Euch entsorgen.“"
 gdp_merchant_activity_events.0020.b.tt: "Ihr erhaltet ein [Concept('attraction', 'Anziehungs')|E]-[Concept('opinion', 'Meinungs')|E]-[artifact|E]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "Erhielt ein Artefakt ([fake_artifact.GetName]) von [other.GetTitledFirstName]."
 gdp_merchant_activity_events.0020.c: "„Ein äußerst wertvolles Stück. In der Tat.“"
 fake_artifact_name: "Edelsteinkette"
 fake_artifact_desc: "Eine hübsche Kette, die herrlich funkelt, doch wenn man genauer hinschaut, sieht man, wie nachlässig die Edelsteine geschliffen wurden."
 gdp_merchant_activity_events.0025.t: "Eine viel bereiste Straße"
 gdp_merchant_activity_events.0025.desc: "Inmitten des Gelächters und der Stimmen in der Halle höre ich ein unerwartetes Geräusch –"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP UUH UUH!#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP KII KII!#!"
 gdp_merchant_activity_events.0025.desc_cont: "Jemand hat diese Kreatur ([luxury_artifact.Custom('GetDomicileArtifactCreatureType')]) zum Festmahl mitgebracht?\n\nAls ich über die Menge schaue, erblicke ich [Select_CString(merchant.IsFemale, 'die Besitzerin', 'den Besitzer')] dieses Wesens, einen anderen Kaufmann namens [merchant.GetTitledFirstName]. [merchant.Custom('DE_PRO_PER_S_3P_N')|U] bemerkt meinen neugierigen Blick, [merchant.Custom('quirk_pos_present')] und sagt: „Ich habe dieses schöne Geschöpf während einer meiner vielen Reisen erworben. Dort gibt es einen wunderbaren Markt, den ich oft besuche. Ein Firmengeheimnis.“ [merchant.Custom('DE_PRO_PER_S_3P_N')|U] tippt sich mit einem selbstzufriedenen Grinsen auf die Nasenspitze."
 gdp_merchant_activity_events.0025.a: "„Oh, den Ort kenne ich!“"
 gdp_merchant_activity_events.0025.b: "„Könntet Ihr überzeugt werden, den Ort zu verraten?“"
 gdp_merchant_activity_events.0025.b.success: "Ihr habt überzeugende Argumente"
 gdp_merchant_activity_events.0025.b.failure: "Ihr habt keine überzeugenden Argumente"
 gdp_merchant_activity_events.0025.c: "„Erzählt mir mehr von Euren Reisen!“"
 gdp_merchant_activity_events.0025.tt.menagerie: "Erschafft einen [luxury_contract_i][luxury_contract|E]: #V $menagerie_acquisition_contract$#!"
 gdp_merchant_activity_events.0025.tt.curio: "Erschafft einen [luxury_contract_i][luxury_contract|E]: #V $find_curio_contract$#!"
