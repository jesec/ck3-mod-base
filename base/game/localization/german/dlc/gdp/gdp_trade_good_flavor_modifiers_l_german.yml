l_german:
 gdp_tgf_heavier_loads_modifier: "Schwerere Ladungen"
 gdp_tgf_seven_storehouses_modifier: "Sieben Lagerhäuser"
 gdp_tgf_seven_storehouses_modifier_desc: "Dieser Kaufmann baute Lagerhäuser für magere Jahre und sorgt dafür, dass jedes von ihnen voll ist."
 gdp_tgf_sweet_reputation_modifier: "Versüßter Ruf"
 gdp_tgf_sweet_reputation_modifier_desc: "Dieser Kaufmann schickte einen überlebensgroßen Zuckervogel zum Festmahl eines Fürsten. Niemand, der ihn probierte, spricht noch über etwas anderes."
 gdp_tgf_beekeeper_modifier: "Imker"
 gdp_tgf_beekeeper_modifier_desc: "Dieser Kaufmann hält Bienen im Gebälk des Lagerhauses. Sie zahlen ihre Rente mit Honig, und der Kaufmann erfuhr mehr über Honig, als jedes Buch ihn hätte lehren können."
 gdp_tgf_alcohol_opportunist_modifier: "Versehentlicher Winzer"
 gdp_tgf_alcohol_opportunist_modifier_desc: "Dieser Kaufmann ließ eine Ladung Früchte zu Wein vergären und hat seitdem ein Auge für günstige Fässer."
 gdp_tgf_two_grades_modifier: "Zwei Grade an Öl"
 gdp_tgf_two_grades_modifier_desc: "Dieser Kaufmann verkauft den trüben Bodensatz für Lampen, das klare Öl für den Tisch – und verlangt mehr für die Differenz."
 gdp_tgf_road_millet_modifier: "Hirse für den Weg"
 gdp_tgf_road_millet_modifier_desc: "Dieser Kaufmann reist nie ohne einen Sack Hirse. Er hält sich jahrelang – ebenso wie jeder, der ihn bei sich hat."
 gdp_tgf_cheap_rice_modifier: "Günstiger Reis"
 gdp_tgf_cheap_rice_modifier_desc: "Brauner Reis ist günstig auf den Märkten dieser Gemeinde, und deshalb muss niemand hungern."
 gdp_tgf_keeps_the_fast_modifier: "Hält sich ans Fasten"
 gdp_tgf_keeps_the_fast_modifier_desc: "Dieser Kaufmann verkauft das ganze Jahr Fleisch und fastet mit allen anderen. Niemand weiß besser, was die Hungrigen zu zahlen bereit sind."
 gdp_tgf_parchment_supplier_modifier: "Pergamentversorger"
 gdp_tgf_parchment_supplier_modifier_desc: "Die edelsten Häute dieses Kaufmanns werden zu Seiten verarbeitet. Irgendwo werden dann heilige Schriften auf ihnen niedergelegt."
 gdp_tgf_temple_supplier_modifier: "Tempelversorger"
 gdp_tgf_temple_supplier_modifier_desc: "Die Tempel kaufen ihren Weihrauch als Erstes bei diesem Kaufmann und beten dann hin und wieder für den Verkäufer."
 gdp_tgf_chancery_stationer_modifier: "Kanzleiversorger"
 gdp_tgf_chancery_stationer_modifier_desc: "Dieser Kaufmann versorgt die Kanzlei mit Papier, und jeder Beamte, der davon hört, wünscht sich dies auch."
 gdp_tgf_tall_mast_modifier: "Hoher Mast"
 gdp_tgf_tall_mast_modifier_desc: "Das eigene Schiff dieses Kaufmanns hat den besten Mast an der ganzen Küste und kommt so weiter."
 gdp_tgf_our_timber_modifier: "Gebaut aus unseren Balken"
 gdp_tgf_our_timber_modifier_desc: "Schiffe mit Masten aus dem Bauholz dieser Route bringen die Waren weiter, als sie es früher konnten."
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
 gdp_tgf_our_timber_renowned_modifier_desc: "$gdp_tgf_our_timber_modifier_desc$"
 gdp_tgf_heavier_loads_modifier_desc: "Diese Handelsroute ist übermäßig beladen."
 gdp_tgf_builders_rate_castle_full_modifier: "Stein für die Mauern"
 gdp_tgf_builders_rate_castle_full_modifier_desc: "Die Burg dieser Gemeinde wird zum Baumeisterpreis versorgt."
 gdp_tgf_builders_rate_castle_small_modifier: "Teuer erkaufte Mauern"
 gdp_tgf_builders_rate_castle_small_modifier_desc: "Die Burg dieser Gemeinde wird zu einem gehörigen Preis versorgt."
 gdp_tgf_builders_rate_church_full_modifier: "Stein für den Tempel"
 gdp_tgf_builders_rate_church_full_modifier_desc: "Der Tempel dieser Gemeinde wird zum Baumeisterpreis versorgt."
 gdp_tgf_builders_rate_church_small_modifier: "Teuer erkaufter Tempel"
 gdp_tgf_builders_rate_church_small_modifier_desc: "Der Tempel dieser Gemeinde wird zu einem gehörigen Preis versorgt."
 gdp_tgf_builders_rate_city_full_modifier: "Bohlen für die Anleger"
 gdp_tgf_builders_rate_city_full_modifier_desc: "Die Stadt dieser Gemeinde wird zum Baumeisterpreis versorgt."
 gdp_tgf_builders_rate_city_small_modifier: "Teuer erkaufter Anleger"
 gdp_tgf_builders_rate_city_small_modifier_desc: "Die Stadt dieser Gemeinde wird zu einem gehörigen Preis versorgt."
 gdp_tgf_builders_rate_generic_full_modifier: "Freundschaftspreis"
 gdp_tgf_builders_rate_generic_full_modifier_desc: "Die Baumeister dieser Gemeinde werden zum Freundschaftspreis versorgt."
 gdp_tgf_builders_rate_generic_small_modifier: "Kaufmannspreis"
 gdp_tgf_builders_rate_generic_small_modifier_desc: "Die Baumeister dieser Gemeinde werden zum Kaufmannspreis versorgt."
 gdp_tgf_keep_the_best_modifier: "Das Beste aus dem Bestand"
 gdp_tgf_keep_the_best_modifier_desc: "Dieser Charakter verwahrt die edelsten Baumaterialien für seine eigenen Werke."
 gdp_tgf_plentiful_stalls_modifier: "Volle Ställe"
 gdp_tgf_plentiful_stalls_modifier_desc: "Ein Kaufmann überflutete die Stände dieser Gemeinde mit der besten Ernte des Waldes."
 gdp_tgf_well_supplied_host_modifier: "Gut versorgte Schar"
 gdp_tgf_well_supplied_host_modifier_desc: "Die Armeen dieses Charakters marschieren mit den stetigen Lieferungen eines Kaufmanns."
 gdp_tgf_bee_stung_modifier: "Von Bienen zerstochen"
 gdp_tgf_bee_stung_modifier_desc: "Dieser Charakter stritt sich mit einem Lagerhaus voll Bienen gestritten … und verlor."
 gdp_tgf_awake_and_alert_modifier: "Wach und aufmerksam"
 gdp_tgf_awake_and_alert_modifier_desc: "Dieser Charakter trinkt kannenweise Tee und rechnet nachts die Hauptbücher nach."
 gdp_tgf_tea_drinker_modifier: "Teetrinker"
 gdp_tgf_tea_drinker_modifier_desc: "Dieser Charakter legte sich die Teegewohnheiten eines Kaufmanns zu und damit auch einen klareren Kopf."
 gdp_tgf_well_grazed_meadows_modifier: "Gut beweidete Wiesen"
 gdp_tgf_well_grazed_meadows_modifier_desc: "Auf den Weiden dieser Gemeinde fraßen sich die Herden eines Kaufmanns fett, sodass das Gras grüner ist."
 gdp_tgf_lacquer_rash_modifier: "Lackausschlag"
 gdp_tgf_lacquer_rash_modifier_desc: "Dieser Charakter fasste Lack an, bevor er trocken war. Der Lack gewann."
 gdp_tgf_curing_room_modifier: "Aushärtraum"
 gdp_tgf_curing_room_modifier_desc: "Dieser Kaufmann lässt Lack Schicht für Schicht in einem feuchten Raum trocknen, und das merken die Käufer."
 gdp_tgf_theriac_supply_modifier: "Theriak-Versorgung"
 gdp_tgf_theriac_supply_modifier_desc: "Auf den Märkten dieser Gemeinde verkauft mn Theriak, der aus dem Vorrat eines Händlers gebraut wird."
 gdp_tgf_theriac_dose_modifier: "Dosis Theriak"
 gdp_tgf_theriac_dose_modifier_desc: "Dieser Charakter nahm eine Dosis Theriak und schwört nun darauf."
 gdp_tgf_theriac_peddlers_modifier: "Theriak-Verkäufer"
 gdp_tgf_theriac_peddlers_modifier_desc: "Auf dieser Route wird in jeder Stadt Theriak verkauft, sodass ihre Karawanen niemals leer unterwegs sind."
