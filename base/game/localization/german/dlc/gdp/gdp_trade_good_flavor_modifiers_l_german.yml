 gdp_tgf_kept_edge_modifier: "Handelsgeheimnisse"
 gdp_tgf_kept_edge_modifier_desc: "Dieser Charakter lehnte gutes Geld für die Namen seiner Zulieferer ab."
 gdp_tgf_price_war_modifier: "Spitz auf Knopf kalkuliert"
 gdp_tgf_price_war_modifier_desc: "Dieser Charakter kalkuliert die eigenen Preise Spitz auf Knopf, was auch die Gewinne der Rivalen schmälert."
 gdp_tgf_vein_share_modifier: "Kaufmannsfinanzierte Grabungen"
 gdp_tgf_vein_share_modifier_desc: "Ein Kaufmann erwarb einen Anteil an den Grabungen dieser Gemeinde und will jeden einzelnen Karren."
 gdp_tgf_ballast_trick_modifier: "Lohnender Ballast"
 gdp_tgf_ballast_trick_modifier_desc: "Auf dieser Handelsroute wirft sogar der Ballast noch Gewinn ab."
 gdp_tgf_hop_trader_modifier: "Hopfenhändler"
 gdp_tgf_hop_trader_modifier_desc: "Dieser Kaufmann verkauft mit Hopfen gebrautes Bier, was sich auch auf langen Wegen hält und nicht das Grut eines Fürsten bezahlt."
