 gdp_tgf_packed_well_modifier_desc: "Waren auf dieser Handelsroute werden sorgfältig gepackt, und weniger passen in jeden Karren."
 gdp_tgf_sealed_stock_wait_modifier: "Wartet auf Versiegelung"
 gdp_tgf_sealed_stock_wait_modifier_desc: "Karren auf dieser Handelsroute warten auf den Marktsiegler."
 gdp_tgf_quick_seal_modifier: "Bezahltes Siegel"
 gdp_tgf_quick_seal_modifier_desc: "Auf dieser Handelsroute arbeitet der Siegler schneller. Bestechungsgelder helfen dabei."
