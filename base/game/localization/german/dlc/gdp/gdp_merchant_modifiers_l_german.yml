l_german:
 gdp_merchant_starting_capacity_modifier: "Erhöhte Kapazität"
 gdp_merchant_starting_capacity_modifier_desc: "Die Gesellschaft dieses Charakters kann eine größere Menge an Waren befördern."
 gdp_voluntary_merchant_modifier: "Freiwilliger Kaufmann"
 gdp_voluntary_merchant_modifier_desc: "Dieser Charakter gab seine Titel auf, um sich einen Namen als Kaufmann zu machen."
 gdp_patron_competitiveness_modifier: "Wetteifernder Anreiz"
 gdp_patron_competitiveness_modifier_desc: "Der Gönner dieses Charakters wurde überzeugt, sein Geschäft weiter zu verbreiten."
 gdp_romance_fan_modifier: "Hoffnungslos romantisch"
 gdp_romance_fan_modifier_desc: "Dieser Charakter kann einer guten Liebesgeschiche nicht widerstehen."
 gdp_nepotism_modifier: "Ermutigte Vetternwirtschaft"
 gdp_nepotism_modifier_desc: "Dieser Charakter meint, dass Familie immer vorgeht, koste es, was es wolle."
 gdp_merit_modifier: "Ermutigte Verdienste"
 gdp_merit_modifier_desc: "Dieser Charakter schert sich nicht, woher die Gewinne kommen."
 gdp_full_attention_modifier: "Geschäftsschwerpunkt"
 gdp_full_attention_modifier_desc: "Dieser Charakter vergeudet keine Zeit auf Frivolitäten."
 gdp_responsible_modifier: "Übernommene Verantwortung"
 gdp_responsible_modifier_desc: "Dieser Charakter übernimmt selbst Verantwortung – zumindest fürs Erste."
 gdp_cooperation_modifier: "Zusammenwirkendes Haus"
 gdp_cooperation_modifier_desc: "Dieser Charakter beschloss, zum wechselseitigen Vorteil mit einem anderen Haus zusammenzuarbeiten."
 gdp_guild_master_inpiration_diplomacy_modifier: "Diplomatische Führung"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "Dieser Charakter holte sich Anleitung von einem diplomatisch geübten Zunftmeister."
 gdp_guild_master_inpiration_learning_modifier: "Gelehrte Beratung"
 gdp_guild_master_inpiration_learning_modifier_desc: "Dieser Charakter holte sich Rat von einem gelehrten Zunftmeister."
 gdp_guild_master_inpiration_stewardship_modifier: "Unterweisung in Finanzen"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "Dieser Charakter ließ sich von einem Zunftmeister unterweisen."
 gdp_boasted_market_competence_modifier: "Angeberische Marktkenntnis"
 gdp_boasted_market_competence_modifier_desc: "Als sein Gönner ihn bat, sich vor Adeligen zum Affen zu machen, konnte dieser Charakter die Lage zum eigenen Vorteil nutzen."
 gdp_driven_by_motivation_modifier: "Angetrieben von Ehrgeiz"
 gdp_driven_by_motivation_modifier_desc: "Dieser Charakter tut sein Bestes, um dem Gesellschaftsinhaber seinen Wert zu beweisen."
 gdp_promoted_diligence_modifier: "Geförderter Fleiß"
 gdp_promoted_diligence_modifier_desc: "Dieser Charakter wurde vom eigenen Hausoberhaupt unter Druck gesetzt, seine Geschäftsbemühungen zu steigern, auch wenn er dabei seine Gesundheit aufs Spiel setzt."
 gdp_promoted_excess_modifier: "Geförderte Ausschweifung"
 gdp_promoted_excess_modifier_desc: "Dieser Charakter wurde dazu ermutigt, geschäftliche Belange beiseitezulassen und ein ausschweifendes Leben zu führen, damit sich die diplomatischen Beziehungen und das Ansehen der Gesellschaft in der Öffentlichkeit verbessern."
 gdp_oasis_of_hope_modifier: "Oase der Hoffnung"
 gdp_oasis_of_hope_modifier_desc: "Diese Reisegruppe fand auf wundersame Weise eine Oase in der Wüste und konnte sich so erholen."
 gdp_low_morale_entourage_modifier: "Gefolge mit niedriger Moral"
 gdp_low_morale_entourage_modifier_desc: "Dieser Charakter entschied, trotz der Hitzewelle weiter durch die Wüste zu reisen."
 organize_the_venture_scheme_modifier: "Organisiertes Unterfangen"
 organize_the_venture_scheme_modifier_desc: "Dieses Vertragskomplott wurde strengeren Zeitplänen und genauerer Aufsicht unterworfen."
 merchant_undercut_the_competition_modifier: "Unbarmherziges Unterbieten"
 merchant_undercut_the_competition_modifier_desc: "Dieser Charakter nimmt niedrigere Margen in Kauf, um Rivalen aus dem Gleichgewicht zu bringen."
 merchant_cornering_the_market_modifier: "Markt in die Ecke gedrängt"
 merchant_cornering_the_market_modifier_desc: "Dieser Charakter nutzt den jüngsten wirtschaftlichen Druck, um die eigene Marktstellung zu stärken."
 merchant_public_benefactor_modifier: "Öffentlicher Wohltäter"
 merchant_public_benefactor_modifier_desc: "Dieser Charakter finanziert öffentliche Arbeiten in der Nähe des Wohnsitzes seiner Gesellschaft und verwandelt Gewinne in Wohlwollen des Volkes."
 merchant_private_profit_focus_modifier: "Privatgewinn"
 merchant_private_profit_focus_modifier_desc: "Dieser Charakter legt den Schwerpunkt der eigenen Gesellschaft auf private Margen und wirtschaftlichen Vorteil, auf Kosten des öffentlichen Ansehens."
 merchant_sponsored_public_works_county_modifier: "Finanzierte öffentliche Bauarbeiten"
 merchant_sponsored_public_works_county_modifier_desc: "Diese Gemeinde kam in den Genuss der öffentlichen Bauarbeiten einer Kaufmannsgesellschaft und bürgerlicher Gönnerschaft."
 gdp_merge_company_competitiveness_modifier: "Vorherrschender Händler"
 gdp_merge_company_competitiveness_modifier_desc: "Dieser Charakter zerschlug die Routen einer rivalisierenden Gesellschaft und beherrscht diese Märkte."
 gdp_merchant_full_larder_modifier: "Volle Speisekammer"
 gdp_merchant_full_larder_modifier_desc: "Dieser Charakter behielt die Nahrung eines hungernden Markts für die eigene Tafel, und es fehlt ihm seitdem an nichts."
 gdp_merchant_staying_vigilant: "Bleibt wachsam"
 gdp_merchant_staying_vigilant_desc: "Dieser Charakter rechnet mit Rache für den Hunger, den sein Handel verursachte, und achtet daher auf jeden Schatten."
 gdp_merchant_master_craft_tutelage_modifier: "Vom Meister gelehrt"
 gdp_merchant_master_craft_tutelage_modifier_desc: "Dieser Charakter verbrachte Zeit in der Werkstatt eines Meisterwerkers."
 gdp_thirsty_traveler_modifier: "Durstiger Reisender"
 gdp_thirsty_traveler_modifier_desc: "Dieser Charakter musste eine weite Reise ohne Wasser zurücklegen."
 gdp_pure_waters_modifier: "Reine Wasser"
 gdp_pure_waters_modifier_desc: "Die Gesellschaft dieses Charakters wird mit reinem Wasser versorgt und gesättigt."
 gdp_rationing_water_modifier: "Rationiert Wasser"
 gdp_rationing_water_modifier_desc: "Die Gesellschaft dieses Charakters hat eine strenge, aber wirkungsvolle Wasserrationierung, wobei die Menge immer kleiner wird, während sie nach Nachschub sucht."
 gdp_workout_modifier: "Müde Muskeln"
 gdp_workout_modifier_desc: "Bäume fällen war eine gute, wenn auch anstrengende Übung für diesen Charakter. Im Lauf der Zeit wird er seine Kraft zurückgewinnen."
 gdp_cat_rats_modifier: "Katzenpfote"
 gdp_cat_rats_modifier_desc: "Dieser Charakter durfte dank einer fleißigen Katze eine Reise ohne Ratten genießen."
 gdp_fishing_modifier: "Die Freuden des Angelns"
 gdp_fishing_modifier_desc: "Dieser Charakter weiß aus eigener Erfahrung, wie wertvoll ein guter Fang ist."
 gdp_catch_rats_modifier: "Rattenfänger"
 gdp_catch_rats_modifier_desc: "Dieser Charakter war gezwungen, in einem dunklen, beengten Schiffsraum Ratten zu fangen, was zulasten seiner Gesundheit ging."
 dedicated_trade_studies: "Fachbezogene Handelsstudien"
 dedicated_trade_studies_desc: "Dieser Charakter entschied sich gegen eine Laufbahn im öffentlichen Dienst und für eine Tätigkeit in der Wirtschaft. Nun widmet er sich der Erforschung der Märkte."
 gdp_local_business_modifier: "Örtliche Geschäfte"
 gdp_local_business_modifier_desc: "Dieser Charakter beschloss, auf den Märkten in der näheren Umgebung zu konkurrieren, statt den Reichtümern entlang der Seidenstraße nachzujagen, die weit entfernt sind."
 gdp_silk_road_market_foothold_modifier: "Stand an der Seidenstraße"
 gdp_silk_road_market_foothold_modifier_desc: "Dieser verlagerte hat seine Gesellschaft kürzlich auf die Seidenstraße und nutzt nun seine neuen Verbindungen vor Ort."
 tgp_silk_road_interesting_innovations_modifier: "Interessante Innovationen"
 tgp_silk_road_interesting_innovations_modifier_desc: "Dieser Charakter interessierte sich für die Innovationen der Seidenstraße und kam weiser zurück."
 gdp_silk_road_bargain_modifier: "Seidenstraßenhandel"
 gdp_silk_road_bargain_modifier_desc: "Dieser Charakter suchte die Gelegenheit, ein großes Geschäft auf dem Seidenstraßenmarkt einzugehen."
 gdp_silk_road_market_investment_modifier: "Seidenstraßenmarktinvestition"
 gdp_silk_road_market_investment_modifier_desc: "Dieser Charakter entschied, dass es von Vorteil wäre, in diesen Seidenstraßenmarkt zu investieren."
 gdp_merchant_legacy_3_ennobled_modifier: "Vertrauenswürdiger Kaufmann"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "Der herausragende Geschäftssinn und die Gesellschaft dieses Charakters genießen in den angesehensten Kreisen hohes Ansehen."
 gdp_merchant_legacy_3_rapacious_modifier: "Sorgfältige Buchführung"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "Dieser Charakter ist dafür zuständig, alle Gesellschaftskonten zu prüfen und die Ergebnisse an die Hauptmitarbeiter weiterzugeben."
