l_german:
 gdp_trader_work_scheme_failure_toast_title: "[trader.GetShortUIName|U] tat sich schwer auf dem Markt."
 # Trader scheme outcome modifier names and descriptions
 gdp_trader_negotiate_deals_modifier: "Günstige Bedingungen"
 gdp_trader_negotiate_deals_modifier_desc: "Günstige Handelsbedingungen wurden auf diesem Markt ausgehandelt, was die Stellung der Gesellschaft im Wettbewerb verbessert."
 gdp_trader_capacity_boost_modifier: "Verbesserte Routenkapazität"
 gdp_trader_capacity_boost_modifier_desc: "Die Logistik der Handelskarawanen wurde verbessert, sodass diese Route eine höhere Kapazität besitzt."
 gdp_trader_lobby_advantages_modifier: "Eingesetzte Vorteile"
 gdp_trader_lobby_advantages_modifier_desc: "Auf diesem Markt sicherte man sich eine Vorzugsbehandlung durch den Marktbesitzer, was die Wettbewerbsfähigkeit auf diesem Markt verbessert."
 gdp_trader_undermine_competitor_modifier: "Untergrabene Stellung"
 gdp_trader_undermine_competitor_modifier_desc: "Ruf und geschäftliches Ansehen wurden auf diesem Markt geschädigt."
 gdp_trader_safe_passage_modifier: "Sichere Durchfahrt"
 gdp_trader_safe_passage_modifier_desc: "Es wurden Vereinbarungen getroffen, um sicherzustellen, dass die Reise auf dieser Route schnell und sicher ist."
 gdp_trader_exploring_new_markets_modifier: "Erkundeter Markt"
 gdp_trader_exploring_new_markets_modifier_desc: "Dieser Markt wurde erkundet, was günstige Kaufrechte offenbarte."
 gdp_trader_studying_local_crafts_modifier: "Handwerkseinblicke"
 gdp_trader_studying_local_crafts_modifier_desc: "Durch die Zusammenarbeit mit örtlichen Werkstätten verfeinerte dieser Händler sein handwerkliches Können und steigerte seinen Zuwachs in Sachen Lebenswandelerfahrung."
 gdp_trader_undivided_focus_modifier: "Ungeteilte Aufmerksamkeit"
 gdp_trader_undivided_focus_modifier_desc: "Dieser [trader|E] hat die Freiheit, sich ganz der eigenen Arbeit zu widmen.\nBonus von #P +15 %#! [scheme_success_chance|E] auf [trader|E]-[schemes|E]."
 # Merchant trait success chance bonus descs
 gdp_trader_merchant_trait_journeyman_bonus: "Erprobter Händler"
 gdp_trader_merchant_trait_expert_bonus: "Erfahrener Händler"
 gdp_trader_merchant_trait_master_bonus: "Meisterhändler"
 gdp_trader_house_member_success_bonus: "[house|E]-Mitglied"
 gdp_trader_scheme_shared_rules_tt: "\nEin [house|E]-Mitglied hat #P +10 %#! [scheme_success_chance|E].\n#weak Bei Fehlschlag:\n#!Der [trader|E] erhält #N 10#! [stress|E]"
 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "Geschäftsverhandlungen"
 gdp_trader_negotiate_deals_scheme_desc: "Euer Händler wird sich bemühen, mit den örtlichen Händlern und Beamten günstige Konditionen auszuhandeln, um sich bessere An- und Verkaufspreise auf diesem Markt zu sichern.\n\n#weak Bei Erfolg:\n#!Erhält der besuchte [trade_market|E] für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_negotiate_deals_scheme$ handelt ein [trader|E] mit örtlichen Händlern und Beamten günstige Konditionen aus, um bessere An- und Verkaufspreise zu erzielen.\n\n#weak Bei Erfolg:\n#!Erhält der besuchte [trade_market|E] für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E]"
 gdp_trader_negotiate_deals_scheme_success_title: "Händler: Ausgehandelte Geschäfte"
 gdp_trader_negotiate_deals_scheme_success_desc: "[trader.GetShortUIName|U] handelte erfolgreich eine neue Aufteilung der Märkte von [trader.GetCurrentLocation.GetName] aus."
 gdp_trader_finding_a_deal_scheme: "Geschäftsabschlüsse"
 gdp_trader_finding_a_deal_scheme_desc: "Euer Händler wird nach gewinnbringenden Gelegenheiten suchen und sich bemühen, kleine Margen in bares Geld umzuwandeln.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet [gold_i][gold|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_finding_a_deal_scheme$ sucht ein [trader|E] nach gewinnbringenden Gelegenheiten und versucht, kleine Margen in bares Geld umzuwandeln.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet [gold_i][gold|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_success_title: "Händler: Geschäft abgeschlossen"
 gdp_trader_finding_a_deal_scheme_success_desc: "[trader.GetShortUIName|U] ging in [trader.GetCurrentLocation.GetNameNoTooltip] einen Handel ein."
 gdp_trader_securing_surplus_scheme: "Überschusssicherung"
 gdp_trader_securing_surplus_scheme_desc: "Euer Händler wird sich bemühen, Überschusswaren auf diesem Markt auszumachen und für deren Beförderung entlang der Route zu sorgen, was zeitweise die Kapazität steigert.\n\n#weak Bei Erfolg:\n#!Eure [company|E] erhält für #V 5 Jahre#! [trade_route_capacity|E] auf dieser [trade_route|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_securing_surplus_scheme$ macht ein [trader|E] Überschusswaren aus und sorgt für deren Beförderung entlang der Route, was zeitweise die Kapazität steigert.\n\n#weak Bei Erfolg:\n#!Die [company|E] erhält für #V 5 Jahre#! [trade_route_capacity|E] auf dieser [trade_route|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_success_title: "Händler: Überschuss gesichert"
 gdp_trader_securing_surplus_scheme_success_desc: "[trader.GetShortUIName|U] setzte die örtlichen Handwerker von [trader.GetCurrentLocation.GetName] unter Druck und sammelte weitere Waren ein."
 gdp_trader_appraising_market_scheme: "Markteinschätzung"
 gdp_trader_appraising_market_scheme_desc: "Euer Händler wird sich bemühen, die örtlichen Marktbedingungen zu studieren, um die besten Handelsgelegenheiten zu finden.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] erhält für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_negotiate_deals_scheme$ studiert ein [trader|E] die örtlichen Marktbedingungen, um die besten Handelsgelegenheiten zu finden.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] erhält für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_success_title: "Händler: Märkte eingeschätzt"
 gdp_trader_appraising_market_scheme_success_desc: "[trader.GetShortUIName|U] entdeckte in [trader.GetCurrentLocation.GetNameNoTooltip] neue Geschäftsmöglichkeiten."
 gdp_trader_organizing_caravan_scheme: "Karawanenorganisation"
 gdp_trader_organizing_caravan_scheme_desc: "Euer Händler wird sich bemühen, die Effektivität und Organisation der Handelskarawane zu verbessern, damit mehr Waren über die Route bewegt werden können.\n\n#weak Bei Erfolg:\n#!Eure [company|E] erhält für #V 5 Jahre#! [trade_route_capacity|E] auf dieser [trade_route|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_organizing_caravan_scheme$ verbessert ein [trader|E] die Effektivität und Organisation der Handelskarawane, damit mehr Waren über die Route bewegt werden können.\n\n#weak Bei Erfolg:\n#!Die [company|E] erhält für #V 5 Jahre#! [trade_route_capacity|E] auf dieser [trade_route|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_success_title: "Händler: Karawane organisiert"
 gdp_trader_organizing_caravan_scheme_success_desc: "[trader.GetShortUIName|U] fand leichteres Verpackungsmaterial."
 gdp_trader_exploring_new_markets_scheme: "Markterweiterung"
 gdp_trader_exploring_new_markets_scheme_desc: "Euer Händler wird sich bemühen, einen Markt zu erkunden, den die Gesellschaft noch nicht erreicht hat, um die Grundlage für zukünftigen Handel zu schaffen.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] verringert für #V 5 Jahre#! die Kaufpreise $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_organizing_caravan_scheme$ erkundet ein [trader|E] einen Markt, den die Gesellschaft noch nicht erreicht hat, um die Grundlage für zukünftigen Handel zu schaffen.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] verringert für #V 5 Jahre#! die Kaufpreise $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_success_title: "Händler: Märkte erweitert"
 gdp_trader_exploring_new_markets_scheme_success_desc: "[trader.GetShortUIName|U] fand in [trader.GetCurrentLocation.GetNameNoTooltip] günstige Verkäufer."
 gdp_trader_identifying_rare_goods_scheme: "Ausmachen seltener Waren"
 gdp_trader_identifying_rare_goods_scheme_desc: "Euer Händler wird sich bemühen, nach seltenen und Luxuswaren zu suchen, die es auf diesem Markt gibt, um einen hoffentlich beträchtlichen Gewinn zu erzielen.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet eine großzügige Menge [gold_i][gold|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_identifying_rare_goods_scheme$“ sucht ein [trader|E] nach seltenen und Luxuswaren, die es auf diesem Markt gibt, um einen hoffentlich beträchtlichen Gewinn zu erzielen.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet eine großzügige Menge [gold_i][gold|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_success_title: "Händler: Seltene Waren ausgemacht"
 gdp_trader_identifying_rare_goods_scheme_success_desc: "[trader.GetShortUIName|U] fand in [trader.GetCurrentLocation.GetNameNoTooltip] wertvolle Edelsteine."
 # Diplomacy schemes
 gdp_trader_negotiating_with_ruler_scheme: "Adelsverhandlungen"
 gdp_trader_negotiating_with_ruler_scheme_desc: "Euer Händler wird sich bemühen, dauerhafte gesellschaftliche Bande zu den örtlichen Beamten und dem Marktbesitzer zu knüpfen.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet für #V 5 Jahre#! [opinion_i][opinion|E] beim örtlichen Herrscher $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_negotiating_with_ruler_scheme$ bemüht sich ein [trader|E], dauerhafte gesellschaftliche Bande zu den örtlichen Beamten und dem Marktbesitzer zu knüpfen.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet für #V 5 Jahre#! [opinion_i][opinion|E] beim örtlichen Herrscher $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_success_title: "Händler: Mit Adeligem verhandelt"
 gdp_trader_negotiating_with_ruler_scheme_success_desc: "[trader.GetShortUIName|U] hinterließ beim Herrscher von [trader.GetCurrentLocation.GetName] einen herausragenden ersten Eindruck."
 gdp_trader_building_connections_scheme: "Verbindungsaufbau"
 gdp_trader_building_connections_scheme_desc: "Euer Händler wird sich bemühen, dauerhafte gesellschaftliche Beziehungen zu örtlichen Beamten aufzubauen, um Zugang zu den Vorräten des Reiches zu erhalten.\n\n#weak Bei Erfolg:\n#!Eure [company|E] erhält für #V 5 Jahre#! [trade_route_capacity|E] auf dieser [trade_route|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_organizing_caravan_scheme$ knüpft ein [trader|E] dauerhafte gesellschaftliche Bande zu örtlichen Beamten, um Zugang zu den Vorräten des Reiches zu erhalten.\n\n#weak Bei Erfolg:\n#!Die [company|E] erhält für #V 5 Jahre#! [trade_route_capacity|E] auf dieser [trade_route|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_success_title: "Händler: Verbindungen aufgebaut"
 gdp_trader_building_connections_scheme_success_desc: "[trader.GetShortUIName|U] überzeugte die Verantwortlichen von [trader.GetCurrentLocation.GetNameNoTooltip] davon, mehr Fracht durchzulassen."
 gdp_trader_lobbying_advantages_scheme: "Vorteilseinsatz"
 gdp_trader_lobbying_advantages_scheme_desc: "Euer Händler wird sich bemühen, beim Marktbesitzer eine Vorzugsbehandlung herauszuschlagen, was die Wettbewerbsstellung der Gesellschaft verbessert.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] erhält für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_lobbying_advantages_scheme$ bemüht sich ein [trader|E], beim Marktbesitzer eine Vorzugsbehandlung herauszuschlagen, was die Wettbewerbsstellung der Gesellschaft verbessert.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] erhält für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_success_title: "Händler: Eingesetzte Vorteile"
 gdp_trader_lobbying_advantages_scheme_success_desc: "[trader.GetShortUIName|U] sicherte in [trader.GetCurrentLocation.GetNameNoTooltip] eine Vorzugsbehandlung."
 gdp_trader_building_reputation_scheme: "Rufaufbau"
 gdp_trader_building_reputation_scheme_desc: "Euer Händler wird sich bemühen, die Bekanntheit und den Ruf der Gesellschaft in dieser Region zu mehren.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet [prestige_i][prestige|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_lobbying_advantages_scheme$ mehrt ein [trader|E] die Bekanntheit und den Ruf der Gesellschaft in dieser Region.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet [prestige_i][prestige|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_success_title: "Händler: Ruf aufgebaut"
 gdp_trader_building_reputation_scheme_success_desc: "[trader.GetShortUIName|U] bracht dem Namen der Gesellschaft in [trader.GetCurrentLocation.GetNameNoTooltip] Ehre."
 gdp_trader_championing_patron_scheme: "Vertretung der Gönnerinteressen"
 gdp_trader_championing_patron_scheme_desc: "Euer Händler wird sich bemühen, sich für die Handelsinteressen des [Concept('merchant_patron', 'Gönners')|E] auf diesem Markt einzusetzen.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet [opinion_i][opinion|E] beim [merchant_patron|E] sowie eine kleine Menge an [prestige_i][prestige|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_championing_patron_scheme$“ setzt sich ein [trader|E] für die Handelsinteressen des [Concept('merchant_patron', 'Gönners')|E] auf diesem Markt ein.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet [opinion_i][opinion|E] beim [merchant_patron|E] sowie eine kleine Menge an [prestige_i][prestige|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_success_title: "Händler: Interessen des Gönners vertreten"
 gdp_trader_championing_patron_scheme_success_desc: "[trader.GetShortUIName|U] vertiefte den Einfluss von [route_owner.GetSuzerain.GetShortUIName] in [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_entertaining_merchants_scheme: "Unterhaltung von Kaufleuten"
 gdp_trader_entertaining_merchants_scheme_desc: "Euer Händler wird sich bemühen, Vertreter anderer Gesellschaften einzuladen und zu unterhalten, um Wohlwollen bei rivalisierenden [Concept('merchant', 'Kaufleuten')|E] zu finden.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet für #V 5 Jahre#! [opinion_i][opinion|E] bei einem rivalisierenden [merchant|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_entertaining_merchants_scheme$“ lädt ein [trader|E] Vertreter anderer Gesellschaften ein und unterhält diese, um Wohlwollen bei rivalisierenden [Concept('merchant', 'Kaufleuten')|E] zu finden.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet für #V 5 Jahre#! [opinion_i][opinion|E] bei einem rivalisierenden [merchant|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_success_title: "Händler: Kaufleute unterhalten"
 gdp_trader_entertaining_merchants_scheme_success_desc: "[trader.GetShortUIName] gelang es, die Gunst eines rivalisierenden [Concept('merchant', 'Kaufmanns')|E] in [trader.GetCurrentLocation.GetNameNoTooltip] zu gewinnen."
 gdp_trader_hiring_local_talent_scheme: "Anwerbung einheimischer Talente"
 gdp_trader_hiring_local_talent_scheme_desc: "Euer Händler wird sich bemühen, qualifizierte Personen zu finden, die als [associates|E] in die Gesellschaft eintreten.\n\n#weak Bei Erfolg:\n#!Eure [company|E] rekrutiert einen örtlichen [associate|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_hiring_local_talent_scheme$“ findet ein [trader|E] qualifizierte Personen, die als [associates|E] in die Gesellschaft eintreten.\n\n#weak Bei Erfolg:\n#!Die [company|E] rekrutiert einen örtlichen [associate|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_success_title: "Händler: Einheimische Talente angeworben"
 gdp_trader_hiring_local_talent_scheme_success_desc: "[trader.GetShortUIName] warb in [trader.GetCurrentLocation.GetNameNoTooltip] eine talentierte Person an."
 # Learning schemes
 gdp_trader_learning_from_locals_scheme: "Lernen von den Einheimischen"
 gdp_trader_learning_from_locals_scheme_desc: "Euer Händler wird sich bemühen, durch ein Eintauchen in die einheimische Handelstradition Expertise bei den Hauptwaren dieses Markts zu erlangen.\n\n#weak Bei Erfolg:\n#!Eure [company|E] erhält [trade_expertise|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_hiring_local_talent_scheme$“ erlangt ein [trader|E] durch ein Eintauchen in die einheimische Handelstradition Expertise bei den Hauptwaren dieses Markts.\n\n#weak Bei Erfolg:\n#!Eure [company|E] erhält [trade_expertise|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_success_title: "Händler: Von Einheimischen gelernt"
 gdp_trader_learning_from_locals_scheme_success_desc: "[trader.GetShortUIName] lernte von Händlern in [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_studying_local_crafts_scheme: "Einheimisches Handwerksstudium"
 gdp_trader_studying_local_crafts_scheme_desc: "Euer Händler wird sich bemühen, durch das Studieren einheimischer Werkstätten Einsichten in Bezug auf die hier hergestellten Waren zu erhalten.\n\n#weak Bei Erfolg:\n#!Euer [trader|E] erhält für #V 5 Jahre#! einen Zuwachs in Sachen [lifestyle_experience|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_studying_local_crafts_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_hiring_local_talent_scheme$“ erhält ein [trader|E] durch das Studieren einheimischer Werkstätten Einsichten in Bezug auf die hier hergestellten Waren.\n\n#weak Bei Erfolg:\n#!Der [trader|E] erhält für #V 5 Jahre#! einen Zuwachs in Sachen [lifestyle_experience|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_studying_local_crafts_scheme_success_title: "Händler: Einheimisches Handwerk studiert"
 gdp_trader_studying_local_crafts_scheme_success_desc: "[trader.GetShortUIName] gewann durch den Besuch der Werkstätten von [trader.GetCurrentLocation.GetNameNoTooltip] neue Erkenntnisse."
 gdp_trader_appraising_goods_scheme: "Warenschätzung"
 gdp_trader_appraising_goods_scheme_desc: "Euer Händler wird sich bemühen, örtliche Waren sorgfältig zu bewerten und so das Preiswissen der Gesellschaft zu verbessern.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] erhält für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_goods_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_hiring_local_talent_scheme$ bewertet ein [trader|E] örtliche Waren sorgfältig und verbessert so das Preiswissen der Gesellschaft.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] erhält für #V 5 Jahre#! einen Schub der [competitiveness_i][trade_competitiveness|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_goods_scheme_success_title: "Händler: Waren eingeschätzt"
 gdp_trader_appraising_goods_scheme_success_desc: "[trader.GetShortUIName] verschaffte sich beim Feilschen in [trader.GetCurrentLocation.GetNameNoTooltip] einen Vorteil."
 # Intrigue schemes
 gdp_trader_undermining_competitor_scheme: "Wettbewerberuntergrabung"
 gdp_trader_undermining_competitor_scheme_desc: "Euer Händler wird sich bemühen, den Ruf eines [Concept('rival', 'rivalisierenden')|E] Kaufmanns auf diesem Markt schädigen.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] verringert für #V 5 Jahre#! die [competitiveness_i][trade_competitiveness|E] eines [Concept('merchant', 'Kaufmanns')|E]-[Concept('rival', 'Rivalen')] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_undermining_competitor_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_hiring_local_talent_scheme$ schädigt ein [trader|E] den Ruf eines [Concept('rival', 'rivalisierenden')|E] Kaufmanns auf dem Markt.\n\n#weak Bei Erfolg:\n#!Der besuchte [trade_market|E] verringert für #V 5 Jahre#! die [competitiveness_i][trade_competitiveness|E] eines [Concept('merchant', 'Kaufmanns')|E]-[Concept('rival', 'Rivalen')] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_undermining_competitor_scheme_success_title: "Händler: Wettbewerber untergraben"
 gdp_trader_undermining_competitor_scheme_success_desc: "[trader.GetShortUIName|U] ließ einen Rivalen auf dem Markt von [trader.GetCurrentLocation.GetNameNoTooltip] alt aussehen."
 gdp_trader_recruiting_informants_scheme: "Informantenanwerbung"
 gdp_trader_recruiting_informants_scheme_desc: "Euer Händler wird sich bemühen, ein Netz aus örtlichen Wissenszuträgern zu pflegen, um einen Marktvorteil zu erhalten.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet 1 [competitive_pressure|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_recruiting_informants_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] $gdp_trader_hiring_local_talent_scheme$ pflegt ein [trader|E] ein Netz aus örtlichen Wissenszuträgern, um einen Marktvorteil zu erhalten.\n\n#weak Bei Erfolg:\n#!Ihr erhaltet 1 [competitive_pressure|E] $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_recruiting_informants_scheme_success_title: "Händler: Informanten angeworben"
 gdp_trader_recruiting_informants_scheme_success_desc: "[trader.GetShortUIName|U] trommelte in [trader.GetCurrentLocation.GetNameNoTooltip] einige willige Straßenkinder zusammen."
 # Martial schemes
 gdp_trader_securing_safe_passage_scheme: "Sicherung einer sicheren Durchreise"
 gdp_trader_securing_safe_passage_scheme_desc: "Euer Händler wird sich bemühen, Vereinbarungen zu treffen, um diese Route gefahrloser und schneller zu bereisen.\n\n#weak Bei Erfolg:\n#!Euer [trader|E] erhält für #V 5 Jahre#! ein verbessertes Reisetempo und eine verbesserte Reisesicherheit $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_safe_passage_scheme_desc_general: "Im Rahmen des [Concept('scheme','Komplotts')|E] „$gdp_trader_hiring_local_talent_scheme$“ trifft ein [trader|E] Vereinbarungen, um diese Route gefahrloser und schneller zu bereisen.\n\n#weak Bei Erfolg:\n#!Euer [trader|E] erhält für #V 5 Jahre#! ein verbessertes Reisetempo und eine verbesserte Reisesicherheit $gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_safe_passage_scheme_success_title: "Händler: Sichere Durchreise gesichert"
 gdp_trader_securing_safe_passage_scheme_success_desc: "[trader.GetShortUIName|U] sorgte dafür, dass der nächste Abschnitt der Strecke reibungslos verlaufen wird."
