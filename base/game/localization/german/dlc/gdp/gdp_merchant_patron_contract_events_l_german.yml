l_german:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: Die [patron.Custom('GetRoomPlural')|U] des Gönners ([patron.GetTitleAsNameNoTooltip])"
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName|U] ist [Select_CString(patron.IsFemale, 'eine großartige Frau', 'ein großartiger Mann')], und Adlige, Priester, Kaufleute und Gemeine gleichermaßen von überall aus [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] und darüber hinaus wetteifern um [patron.Custom('DE_PRO_POS_S_3P')]e Aufmerksamkeit und [patron.Custom('DE_PRO_POS_S_3P')] Patronat.\n\nWir müssen direkt sein, aber auch vorsichtig agieren, wenn wir sicherstellen wollen, dass die Gesellschaft weiterhin [patron.Custom('DE_PRO_POS_S_3P')]e Gunst genießt und nicht durch einen gerisseneren Rivalen ausgestochen wird oder die Aufmerksamkeit von [patron.GetTitledFirstName] gänzlich verliert.\n\nUnser Geschäft muss in den Kreisen der Mächtigen und Angesehenen von [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] stets im Gespräch bleiben."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: Erfolg!"
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName|U] konnte meinen Geschichten von fernen Ländern und den sich beständig kreuzenden Welten des Handels nicht widerstehen und hängt jeden Abend am Banketttisch an meinen Lippen.\n\nIch kann ruhigen Gewissens zur Gesellschaft zurückkehren, weiß ich doch, dass uns [patron.GetFirstNameNoTooltip|U] als wertvolle Partner und willkommene Freunde ansieht.\n\nUnser Ruf wurde in [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] bedeutsam gesteigert, und zweifelsohne wird die Kunde von meinem Einfluss mir in weiter entfernte Gegenden vorauseilen."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: Fehlschlag!"
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName|U] bat mich immer seltener um meine Gegenwart. Habe ich etwas falsch gemacht? Ein anderer Umgang seitens der Höflinge von [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] bestätigt mir [patron.Custom('DE_PRO_POS_S_3P')] Missfallen.\n\nHaben [patron.Custom('DE_PRO_PER_S_3P_A')] meine Geschichten gelangweilt? Habe ich zu viele Kommentare zu den Launen des Handels gemacht? Habe ich eine unsichtbare Grenze des #EMP Adels#!überschritten?\n\nEs gibt nichts, was wir tun können, außer zur Gesellschaft zurückzukehren, den Schaden abzumildern und die Dinge wieder auf den rechten Weg zu bringen …"
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "Beeindruckter Gönner"
 gdp_impressed_patron_modifier_desc: "Die Bemühungen dieses Kaufmanns, sich einzuschmeicheln, beeindruckten seinen Gönner."
 gdp_impressed_patron_critical_modifier: "Beeindruckter Gönner"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "Abschätziger Gönner"
 gdp_dismissive_patron_modifier_desc: "Die Bemühungen dieses Kaufmanns, sich einzuschmeicheln, enttäuschten den Gönner."
