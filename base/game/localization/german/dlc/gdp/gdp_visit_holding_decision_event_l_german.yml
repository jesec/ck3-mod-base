 gdp_visit_holding_rare_recruit_court_position.translator: "Die [aptitude|E] von [ROOT.Char.GetFirstNameNoTooltip] als [GetCourtPositionType('translator_court_position').GetName()] von Euch ist: [ROOT.Char.GetCourtPositionAptitude(GetCourtPositionType('translator_court_position'))]"
