 gdp_visit_holding_decision_event.1300.j.cooldown.tt: "Ihr habt Euch erst kürzlich entspannt – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1320_has_relaxed_recently'))] noch einmal"
 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$: Ausschau nach günstigen Gelegenheiten"
 gdp_visit_holding_decision_event.1310.desc: "In jüngster Zeit höre ich zahlreiche Geschichten über fremde Bestien und Reichtümer. Heute schreite ich den Marktplatz ab, um herauszufinden, ob ich jemanden auftreiben kann, der womöglich mehr über diese Gerüchte weiß.\n\nUnter den Händlern erspähe ich [Select_CString(foreigner.IsFemale, 'eine', 'einen')] [foreigner.GetWomanMan] mit einem sonderbaren Akzent, [Select_CString(foreigner.IsFemale, 'die', 'der')] vor einem offenkundig nicht sehr interessierten örtlichen Kollegen stolz mit [Select_CString(foreigner.IsFemale, 'ihren', 'seinen')] Unterfangen in fernen Landen prahlt. Ist das nur reine Aufschneiderei oder enthalten [Select_CString(foreigner.IsFemale, 'ihre', 'seine')] Geschichten doch vielleicht ein Körnchen Wahrheit? Womöglich liefert ein wenig Gold die Antwort …"
 spawn_merchant_contract_interaction_duplicate_tt: "Ihr habt bereits einen angenommenen oder verfügbaren [task_contract|E] dieser Art"
