 DECISION_ALREADY_VISITING_HOLDING_TIME: "Diese Aktion wird am [GetCurrentDateWithDiff( GetVarTimeRemaining(ROOT.Char.MakeScope, 'gdp_visit_holding_is_visiting'))] wieder verfügbar sein"
 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "Ihr besucht bereits ein Besitztum"
 gdp_visit_holding_decision_event.1340.t: "Ausfallzeit in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1340.desc: "Die Geschäftswelt ist bisweilen sehr anstrengend, und ohne eine ordentliche Auszeit kann man nur eine begrenzte Anzahl von Geschäften prüfen und nur eine begrenzte Weile gezwungen lächeln.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "Hier im Teehaus kann ich die Sorgen der Gesellschaft für eine Weile hinter mir lassen.\n\nEs ist eine Wohltat, einfach eine gute, dampfende Tasse frischen Tee zu genießen und mit den Stammgästen aus der Gegend ein wenig zu plaudern, Neuigkeiten auszutauschen und zu tratschen."
 gdp_visit_holding_decision_event.1340.hashish: "In diesem Haschischhaus kann ich die Sorgen der Gesellschaft für eine Weile hinter mir lassen.\n\nEs ist eine Wohltat, einfach in der Kühle und Ruhe zu sitzen, mit den Stammgästen aus der Gegend ein wenig zu plaudern, Neuigkeiten auszutauschen und zu tratschen."
 gdp_visit_holding_decision_event.1340.drink: "Hier in der Taverne kann ich die Sorgen der Gesellschaft für eine Weile hinter mir lassen.\n\nEs ist eine Wohltat, einfach ein gutes Glas [ROOT.Char.Custom('RegionalAlcoholicDrink')] zu genießen und mit den Stammgästen aus der Gegend ein wenig zu plaudern, Neuigkeiten auszutauschen und zu tratschen."
 gdp_visit_holding_decision_event.1340.food: "Hier im Festsaal kann ich die Sorgen der Gesellschaft für eine Weile hinter mir lassen.\n\nEs ist eine Wohltat, einfach an einem reichhaltigen Büfett zu schlemmen, an Leckereien ([ROOT.Char.Custom('FavoriteTreat')]) zu knabbern und mit den Stammgästen aus der Gegend ein wenig zu plaudern, Neuigkeiten auszutauschen und zu tratschen."
 gdp_visit_holding_decision_event.1340.bath: "In diesem Badehaus kann ich die Sorgen der Gesellschaft für eine Weile hinter mir lassen.\n\nEs ist Balsam für die Seele, einfach nur im wohltuenden Wasser zu baden und mit den Stammgästen aus der Gegend ein wenig zu plaudern, Neuigkeiten auszutauschen und zu tratschen."
 gdp_visit_holding_decision_event.1340.a: "Das sollten wir öfter machen."
