 gdp_visit_holding_decision_confirm: "Ans Werk!"
 gdp_visit_holding_decision_desc: "Wer Gelegenheiten sucht, findet sie auch. Dieser besondere Ort ([ROOT.Char.Custom('LocalHoldingTypeConcept')]) in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ist voll unausgeschöpften Potenzials! Neue Kunden, Verträge und Geschäfte warten schon."
 gdp_visit_holding_decision_effect_intro: "Ihr könntet die Gelegenheit zu Folgendem erhalten:"
 gdp_visit_holding_decision_effect_artifact: "\n$EFFECT_LIST_BULLET$ [artifact_i][artifacts|E] verbessern oder kaufen"
 gdp_visit_holding_decision_effect_guild: "\n$EFFECT_LIST_BULLET$ [skill_i][skills|E] von Euch oder Eurer [family_i][family|E] verbessern"
 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$ Eure [competitiveness_i][trade_competitiveness|E] steigern"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$ [gold_i][gold|E] für [prestige_i][prestige|E] eintauschen"
 gdp_visit_holding_decision_effect_recruit: "\n$EFFECT_LIST_BULLET$ [associate_i][associates|E] treffen und rekrutieren"
 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$ [luxury_contract_i][luxury_contracts|E] entdecken"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$ Senkt Eure [stress_i][stress|E]"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$ $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$ $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$ $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak Ihr habt noch Gelegenheiten:#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$Bei den Zünften"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$Auf dem Marktplatz"
 VISIT_HOLDING_DECISION_AVAILABLE_DOCKS: "\n$EFFECT_LIST_BULLET$Am Anleger"
 VISIT_HOLDING_DECISION_AVAILABLE_PATRON: "\n$EFFECT_LIST_BULLET$Am Hof von [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]"
 VISIT_HOLDING_DECISION_AVAILABLE_WORSHIP: "\n$EFFECT_LIST_BULLET$An der Verehrungsstätte ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship])"
 VISIT_HOLDING_DECISION_EXHAUSTED_AREAS_HEADER: "\n#weak Dieser Bereich öffnet sich wieder nach:#!"
 VISIT_HOLDING_DECISION_EXHAUSTED_GUILDS: "\n$EFFECT_LIST_BULLET$Bei den Zünften – [GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker'))|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$Auf dem Marktplatz – [GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker'))|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$Am Anleger – [GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker'))|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$Am Hof von [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] – [GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker'))|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$An der Verehrungsstätte ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) – [GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker'))|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "Ihr habt alle Gelegenheiten an diesem Ort ([ROOT.Char.Custom('LocalHoldingTypeConcept')]) erkundet. Neue Möglichkeiten stehen nach [GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker'))|V] zur Verfügung"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "Das Besitztum ([ROOT.Char.Custom('LocalHoldingTypeCapitalized')]) von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] besuchen"
 gdp_visit_holding_decision_event.1000.desc: "Als die Sonne sich wieder erhebt, tun dies auch die Bewohner von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Die Stille des Morgens wird rasch vom lebhaften Geschnatter von Menschen übertönt, die ihrem Tagwerk nachgehen. Für den aufmerksamen Beobachter lassen sich an jeder Ecke dieser belebten Straßen günstige Gelegenheiten auftun.\n\nWohin sollte ich mich wenden, um heute mein Glück zu suchen?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "Lektionen vom Zwischenlager"
 gdp_visit_holding_decision_event.1000.a: "Ich sollte mich zu den Zünften aufmachen"
 gdp_visit_holding_decision_event.1000.a.tt: "Ein Besuch bei den Zünften könnte die folgenden Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "Ihr habt alles erkundet, was die Zünfte zu bieten haben. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker'))|V] noch einmal"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "Ihr habt alles erkundet, was der Marktplatz zu bieten hat. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker'))|V] noch einmal"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "Ihr habt alles erkundet, was der Anlieger zu bieten hat. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker'))|V] noch einmal"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "Ihr habt erst kürzlich alle Gelegenheiten am Hof von [THIS.Char.GetSuzerain.GetTitledFirstNameNoTooltip] erschöpft – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker'))|V] noch einmal"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "Ihr habt keinen Gönner, bei dem Ihr um eine Audienz ersuchen könnt"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "Ihr habt alles erkundet, was diese Verehrungsstätte ([THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) zu bieten hat. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker'))|V] noch einmal"
 gdp_visit_holding_caught_stealing.tt: "Ihr wurdet unlängst beim Stehlen in der Verehrungsstätte ([THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) dieses Ortes ([THIS.Char.Custom('LocalHoldingTypeConcept')]) erwischt – Euch bleibt der Zutritt bis [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1500_caught_stealing'))|V] verwehrt"
 gdp_visit_holding_decision_event.1000.b: "Ich sollte mich um eine Audienz bei [patron.GetTitledFirstNameNoTooltip] bemühen."
 gdp_visit_holding_decision_event.1000.c: "Ein wunderbarer Tag, um auf dem Marktplatz herumzustöbern."
 gdp_visit_holding_decision_event.1000.c.tt: "Ein Besuch auf dem örtlichen Markt könnte die folgenden Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "Ein schöner Tag für einen Spaziergang an den Anlegern."
 gdp_visit_holding_decision_event.1000.e.tt: "Ein Besuch an den Anlegern könnte die folgenden Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "Das Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) wirkt spannend."
 gdp_visit_holding_decision_event.1000.f.tt: "Ein Besuch der örtlichen Verehrungsstätte könnte die folgenden Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_cure$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$ [gold_i][gold|E] spenden, um [piety_i][piety|E] zu erhalten"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$ Eure [health|E] verbessern oder [diseases|E] heilen"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$ Einen Segen in Form eines [Concept('character_modifier', 'Charaktermodifikators')|E] erhalten"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ [gold_i][gold|E] von Opfergaben stehlen"
 gdp_visit_holding_decision_event.1000.d: "Ich glaube, ich bin mit den heutigen Botengängen fertig."
 gdp_visit_holding_decision_event.1000.d.tt: "Fürs Erste nach Hause zurückkehren"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "„Ich habe es mir anders überlegt.“"
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Geht, ohne diesen Ort ([ROOT.Char.Custom('LocalHoldingTypeConcept')]) zu erkunden"
 gdp_visit_holding_decision_event.1000.d.exhausted: "Es scheint nichts mehr zu tun zu geben …"
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Nach Hause zurückkehren. Neue Gelegenheiten stehen nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker'))|V] zur Verfügung"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Euer [domicile|E] liegt derzeit nicht im Reich Eures [Concept('merchant_patrons', 'Gönners')|E]"
 gdp_visit_holding_decision_event.1110.t: "Die Zünfte von [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] besuchen"
 gdp_visit_holding_decision_event.1110.desc: "Der Klang von Hämmern auf Metall hallt in den Gassen der Zünfte wider. Ein Stück den Weg hinunter trägt ein junger Lehrling die Werkzeuge seines Meisters in eine Töpferei. Seit Generationen machen die Zunfthallen aus Gesellen fähige Meister ihres Fachs.\n\nDie Zünfte bieten einem jeden Kaufmann eine breite Palette an Diensten an. Welche sollte ich heute aufsuchen?"
 gdp_visit_holding_decision_event.1110.a: "Eines meiner Artefakte könnte etwas Politur vertragen."
 gdp_visit_holding_decision_event.1110.a.tt: "Ein Besuch beim Konservator könnte die folgenden Gelegenheiten ergeben:\n$EFFECT_LIST_BULLET$ Eure gewöhnlichen und meisterlichen @artifact_icon![artifacts|E] verbessern"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "Ihr habt die Dienste des Konservators erst kürzlich genutzt – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1111_has_improved_artifact_recently'))] noch einmal"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "Ihr habt keine gewöhnlichen oder meisterlichen [artifacts|E]"
 gdp_visit_holding_decision_event.1110.b: "Ich bin in der Stimmung für neue Waffen und Rüstung."
 gdp_visit_holding_decision_event.1110.b.tt: "Ein Besuch beim Schmied könnte die folgende Gelegenheiten egeben:\n$EFFECT_LIST_BULLET$ Gewöhnliche, meisterliche oder berühmte Waffen und Rüstung als @artifact_icon![artifacts|E] kaufen"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "Ihr habt erst kürzlich etwas beim Schmied gekauft – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1111_has_bought_artifact_recently'))] noch einmal"
 gdp_visit_holding_decision_event.1110.c: "Ich sollte ein Treffen mit einem Zunftmeister anberaumen."
 gdp_visit_holding_decision_event.1110.c.tt: "Ein Treffen mit einem Zunftmeister könnte die folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "Ihr habt Euch erst kürzlich mit einem Zunftmeister getroffen – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1110_visited_guild_master_recently'))] noch einmal"
 gdp_visit_holding_decision_event.1110.d: "Vielleicht sollte ich woanders hingehen?"
 gdp_visit_holding_decision_event.1110.d.tt: "Die Zünfte fürs Erste verlassen"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: [Select_CString(curator.IsFemale, 'Die Konservatorin', 'Der Konservator')]"
 gdp_visit_holding_decision_event.1111.desc: "Als ich in die Werkstatt [Select_CString(curator.IsFemale, 'der Konservatorin', 'des Konservators')] trete, erwarten mich faszinierende Gegenstände von nah und fern. An einer Werkbank im hinteren Teil des Raums ist [Select_CString(curator.IsFemale, 'eine', 'ein')] [curator.GetWomanMan] über einen Dolch gebeugt, dessen Knauf mit den feinsten Edelsteinen verziert ist. Während ich eines der ausgestellten Schmuckstücke betrachte, löst sich [Select_CString(curator.IsFemale, 'die Konservatorin von ihrer', 'der Konservator von seiner')] Arbeit.\n\n„Ah, mögliche Kundschaft! Wie kann ich [ROOT.Char.GetTitledFirstNameNoTooltip] heute zu Diensten sein?“"
 gdp_visit_holding_decision_event.1111.a: "Dieses Artefakt ([artifact_target_1.GetNameNoTooltip]) könnte die Politur wohl am ehesten vertragen."
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName|U] erhält eine Verbesserung"
 gdp_visit_holding_decision_event.1111.b: "Vielleicht braucht dieses Artefakt ([artifact_target_2.GetNameNoTooltip]) etwas Liebe."
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName|U] erhält eine Verbesserung"
 gdp_visit_holding_decision_event.1111.c: "Ich schätze, dieses Artefakt ([artifact_target_3.GetNameNoTooltip]) könnte etwas hübscher aussehen."
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName|U] erhält eine Verbesserung"
 gdp_visit_holding_decision_event.1111.d: "Womöglich muss ich später noch einmal wiederkommen …"
 gdp_visit_holding_decision_event.1111.d.tt: "Zu den Zünften zurückkehren und nachsehen, was [THIS.Char.GetCurrentLocation.GetName] sonst noch zu bieten hat"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: [Select_CString(blacksmith.IsFemale, 'Die Schmiedin', 'Der Schmied')]"
 gdp_visit_holding_decision_event.1112.desc: "Als ich die Werkstatt [Select_CString(blacksmith.IsFemale, 'der Schmiedin', 'des Schmieds')] betrete, spüre ich die nahezu unerträgliche Hitze der Esse. [Select_CString(blacksmith.IsFemale, 'Die Schmiedin, die', 'Der Schmied, der')] gerade auf ein Breitschwert einhämmerte, wird von meinem Eintreten jäh unterbrochen. [blacksmith.Custom('DE_PRO_PER_S_3P_N')|U] wischt sich eine Mischung aus Schweiß und Ruß von der Stirn und richtet die Aufmerksamkeit stattdessen auf mich.\n\n„Na, was haben wir denn hier? Trägt sich mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.GetTitleAsNameNoTooltip] mit dem Gedanken, heute einige dieser feinen Waffen und Rüstungen zu kaufen? Die besten, die man in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] überhaupt kriegen kann.“"
 gdp_visit_holding_decision_event.1112.a: "Dieses Teil ([arms_armor_artifact_1.GetNameNoTooltip]) wäre eine schöne Ergänzung meiner Sammlung."
 gdp_visit_holding_decision_event.1112.b: "Vielleicht sollte ich das hier ([arms_armor_artifact_2.GetNameNoTooltip]) kaufen."
 gdp_visit_holding_decision_event.1112.c: "So etwas wie das ([arms_armor_artifact_3.GetNameNoTooltip]) könnte ich gebrauchen."
 gdp_visit_holding_decision_event.1112.d: "Wenn ich es mir recht überlege, vielleicht lieber nicht heute."
 gdp_visit_holding_decision_event.1112.d.tt: "Sich zurück den Zünften aufmachen und nachsehen, was [THIS.Char.GetCurrentLocation.GetName] sonst noch zu bieten hat"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: Anleitung durch [Select_CString(guild_master.IsFemale, 'die Zunftmeisterin', 'den Zunftmeister')]"
 gdp_visit_holding_decision_event.1113.desc: "Das Treffen mit [Select_CString(guild_master.IsFemale, 'Zunftmeisterin', 'Zunftmeister')] [guild_master.GetName] erwies sich als fruchtbar für die [ROOT.Char.GetHouse.GetName]-Gesellschaft. In der staubigen Schreibstube zwischen den Stapeln aus Unterlagen und Büchern verflogen die Stunden geradezu.\n\n[guild_master.GetNameNoTooltip|U] besitzt wahrlich einzigartige Einsichten in das eigene Fach ([guild_master.Custom('highest_skill_noun')]). Sowohl ich als auch mein[visiting_associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))] [visiting_associate.GetName] sind von [guild_master.Custom('DE_PRO_POS_S_3P')]er Rede in ihren Bann geschlagen und ganz begierig darauf, mehr zu lernen."
 gdp_visit_holding_decision_event.1113.a.success: "Ihr und [visiting_associate.GetName] saugt das neue Wissen mühelos in Euch auf"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Das Entziffern alter Manuskripte ist keine leichte Aufgabe"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "Die Gleichungen sind zu schwierig, als dass Ihr und [visiting_associate.GetName] sie verstehen könntet"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Manch großes diplomatische Ringen ist zu vielschichtig, um es zu erfassen"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "Die Lektion stößt auf taube Ohren"
 gdp_visit_holding_decision_event.1113.a: "„Vielleicht könnten [visiting_associate.GetNameNoTooltip] und ich noch ein Weilchen bleiben?“"
 gdp_visit_holding_decision_event.1113.a.child: "Die Lektion trägt zur Ausbildung von [visiting_associate.GetName] bei"
 gdp_visit_holding_decision_event.1113.b: "„[visiting_associate.GetFirstNameNoTooltip] könnte eine weitere Lektion in diesem Fach vertragen.“"
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName] bringt [visiting_associate.GetNameNoTooltip] mehr über das Fach bei:"
 gdp_visit_holding_decision_event.1113.c: "„Spannend! Das muss ich mir sofort aufschreiben!“"
 gdp_visit_holding_decision_event.1113.c.tt: "Das Wissen von [guild_master.GetName] wird für die [THIS.Char.GetHouse.GetName]-Gesellschaft nützlich sein"
 gdp_visit_holding_decision_event.1113.d: "Genug davon ([guild_master.Custom('highest_skill_noun')]) für heute."
 gdp_visit_holding_decision_event.1113.d.tt: "Sich zurück den Zünften aufmachen und nachsehen, was [THIS.Char.GetCurrentLocation.GetName] sonst noch zu bieten hat"
 gdp_visit_holding_decision_event.1300.t: "Den Marktplatz von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] besuchen"
 gdp_visit_holding_decision_event.1300.asia: "Wie auf allen Märkten entlang der großen Seidenstraße findet man hier Luxuswaren wie Jade, Seide und Tee im Überfluss.\n\nMitten auf der überfüllten Straße lädt ein Mann vorsichtig zerbrechliche Porzellanvasen von einem Karren ab. Neben ihm stöbert ein fremder Händler in bunter Kleidung im Angebot der Stände, ganz begierig darauf, etwas zu kaufen."
 gdp_visit_holding_decision_event.1300.mena_india: "Farbenfrohe Stoffe und gemusterte Töpferwaren erhellen die ansonsten eher düstere Gasse. Weihrauch und Gewürze schwängern die Luft mit einem angenehmen Duft.\n\nIn einer dunklen Ecke versucht ein Höker verzweifelt, einen misstrauischen Passanten dazu zu bewegen, einige seiner hochwertigen Kupferteller zu kaufen. Das ist wirklich genau die richtige Zeit, um ein gutes Geschäft zu machen."
 gdp_visit_holding_decision_event.1300.default: "Der Duft von frischem Obst und Gemüse vermischt sich mit dem eher würzigen Aroma der hier versammelten Menschenmasse. Auf dem überfüllten Platz liefern sich Höker schreiend ein Wortgefecht.\n\n „[ROOT.Char.Custom('RegionalDrink')|U]! Sonderangebot! Nur heute!“ „Die letzte Gelegenheit, das beste Stück [ROOT.Char.Custom('RegionalEdibleMeat')] zu kaufen!“\n\n"
 gdp_visit_holding_decision_event.monk_hint: "Ein Mann verlässt mit gesenktem Kopf das nahegelegene Teehaus und murmelt etwas von schlechten Omen. Anscheinend wird dort drinnen die Zukunft vorausgesagt."
 gdp_visit_holding_decision_event.monk_hint_return: "In der Teestube ist es inzwischen ruhiger geworden, doch der Mönch, der die Zukunft vorhersagt, ist noch immer da."
 gdp_visit_holding_decision_event.caravaneer_hint: "Eine Kolonne vom Wetter gezeichneter Karawanen füllt die Straße, und die örtlichen Stallungen haben Mühe, mit dem jüngsten Zustrom von Handelsreisenden Schritt zu halten."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "Die Karawanen sind noch nicht weitergezogen. Ihr Treiber befindet sich nach wie vor unter den Tieren und wartet."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\nEs wird gemunkelt, dass ein besonders erfahrener Kapitän heute Passagiere auf seinem Schiff an Bord nimmt."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\nDer Kapitän nimmt weiterhin Passagiere an Bord, und die Menschenmenge rund um das Schiff hat sich noch nicht gelichtet."
 gdp_visit_holding_decision_event.carnival_jester_hint: "Ich kann nicht umhin, mitzuhören, wie sich ein Kaufmannskollege über einen bestimmten Straßenkünstler beschwert, der die Aufmerksamkeit seiner Stammkunden auf sich zieht."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "Der Straßenkünstler fesselt nach wie vor die Aufmerksamkeit der Zuschauer, und die Kaufleute in der Nähe scheinen darüber nicht gerade erfreut zu sein."
 gdp_visit_holding_decision_event.cook_hint: "Mir fällt auf, dass viele Menschen mit Leckereien ([ROOT.Char.Custom('FavoriteTreat')]) in der Hand herumlaufen. Zufällig höre ich, wie einer von ihnen sagt, dass es einen Bäcker gibt, der seine Waren kostenlos verschenkt."
 gdp_visit_holding_decision_event.cook_hint_return: "Der Bäcker hat seinen Stand noch nicht geschlossen."
 gdp_visit_holding_decision_event.1300.desc.fallback: "Münzen und Waren wechseln in raschem Tempo die Hände. Dieser Markt ist reif vor lauter Möglichkeiten."
 gdp_visit_holding_decision_event.1300.a: "Ich frage mich, welche Kunde die fremden Händler bringen."
 gdp_visit_holding_decision_event.1300.a.tt: "Das Belauschen von Händlern könnte die folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_contracts$"
 gdp_visit_holding_decision_event.1300.a.cooldown.tt: "Ihr habt erst kürzlich Verträge geschaffen – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1310_has_created_contract_recently'))] noch einmal"
 gdp_visit_holding_decision_event.1300.b: "Ich sollte die Augen nach neuen Helfern offen halten."
 gdp_visit_holding_decision_event.1300.b.cooldown.tt: "Ihr habt erst kürzlich versucht, Mitarbeiter anzuwerben – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1320_has_recruited_recently'))] noch einmal"
 gdp_visit_holding_decision_event.1300.b.tt: "Ein Erkunden des Marktplatzes könnte die folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_recruit$"
