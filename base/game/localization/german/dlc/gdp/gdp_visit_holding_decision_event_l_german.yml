 gdp_visit_holding_decision_event.1320.urchin.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$[intrigue|E]-[skill_challenge_no_prefix|E] gewinnen\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.herbalist.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$[Concept('learning', 'Bildungs')|E]-[skill_challenge_no_prefix|E] gewinnen\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip|U] wirkt vielversprechend."
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip|U] erregt meine Aufmerksamkeit."
 gdp_visit_holding_decision_event.1320.d: "Niemand vermochte mein Interesse zu wecken …"
 gdp_visit_holding_decision_event.1320.d.tt: "Gehen wir noch einmal zurück zum Marktplatz und sehen wir nach, was [THIS.Char.GetCurrentLocation.GetName] sonst noch zu bieten hat"
 gdp_visit_holding_decision_event.1320.e: "Niemand vermochte mein Interesse zu wecken …"
 gdp_visit_holding_decision_event.1320.e.tt: "Gehen wir noch einmal zurück zum Anleger und sehen wir nach, was [THIS.Char.GetCurrentLocation.GetNameNoTooltip] sonst noch zu bieten hat"
 gdp_visit_holding_decision_event.1320.tt: "Zurückgehen und nachsehen, ob es noch andere interessante Anwerbungen gibt"
 gdp_visit_holding_decision_event.1321.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1321.t: "[Select_CString(charlatan_recruit.IsFemale, 'Die Scharlatanin', 'Der Scharlatan')]"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName] bedeutet mir, mich zu nähern, und mit einer auslandenden Geste verkündet [charlatan_recruit.Custom('DE_PRO_PER_S_3P_N')]:\n\n„Wohlan denn! Sieht aus, als hätten wir [Select_CString(ROOT.Char.IsFemale, 'einen Freiwilligen', 'eine Freiwillige')]! Wenn Ihr vorhersagen könnt, auf welcher Seite diese Münze landet, werde ich Euch großzügig belohnen.“\n\nMit einer Drehung des Handgelenks lässt [charlatan_recruit.Custom('DE_PRO_PER_S_3P_N')] die Münze verschwinden. Die Menge erwartet schweigend, was ich als Nächstes tue."
 gdp_visit_holding_decision_event.1321.a: "Ihr habt #EMP eindeutig#! eine falsche Münze im Ärmel."
 gdp_visit_holding_decision_event.1321.a.success: "Ihr kommt der Täuschung auf die Schliche"
 gdp_visit_holding_decision_event.1321.a.failure: "Ihr kommt der Täuschung nicht auf die Schliche"
 gdp_visit_holding_decision_event.1321.b: "Eine geschickte Täuschung. Ihr solltet für mich arbeiten."
 gdp_visit_holding_decision_event.1321.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![charlatan_recruit_cost|V0] [gold|E] erforderlich, um [charlatan_recruit.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1321.c: "Ich habe keine Zeit für Tricks …"
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1322.t: "Der raue Klotz"
 gdp_visit_holding_decision_event.1322.desc: "Als ich mich [hired_muscle_recruit.GetFirstName] nähere, kann ich spüren, wie [hired_muscle_recruit.Custom('DE_PRO_PER_S_3P_N')] mich mit verschlagenem Blick mustert.\n\n„Wisst Ihr, mit wem Ihr es zu tun habt? Ich bin [Select_CString(hired_muscle_recruit.IsFemale, 'die unbesiegte Meisterin', 'der unbesiegte Meister')] von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Ihr traut Euch einiges, wenn Ihr meint, ein Wurm wie Ihr könnte es im Kampf mit mir aufnehmen.“\n\n[hired_muscle_recruit.Custom('DE_PRO_PER_S_3P_N')|U] hebt die Faust und droht mir."
 gdp_visit_holding_decision_event.1322.a: "Ich lasse [hired_muscle_recruit.Custom('DE_PRO_PER_S_3P_A')] [hired_muscle_recruit.Custom('DE_PRO_POS_S_3P')]e eigene Medizin schmecken!"
 gdp_visit_holding_decision_event.1322.a.success: "Ihr besiegt [hired_muscle_recruit.GetFirstName]"
 gdp_visit_holding_decision_event.1322.a.failure: "[bully.Custom('DE_PRO_PER_S_3P_N')|U] besiegt Euch"
 gdp_visit_holding_decision_event.1322.b: "Kämpft stattdessen für mich."
 gdp_visit_holding_decision_event.1322.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![hired_muscle_recruit_cost|V0] [gold|E] erforderlich, um [hired_muscle_recruit.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1322.c: "Ich glaube, ich sollte jetzt gehen …"
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1323.t: "[Select_CString(numerate_recruit.IsFemale, 'Die zahlenkundige Gelehrte', 'Der zahlenkundige Gelehrter')]"
 gdp_visit_holding_decision_event.1323.desc: "Da [numerate_recruit.GetFirstName] die Nase tief ins Buch steckt, bemerkt er mich kaum, bis ich ganz dicht heran bin. Dann schaut [numerate_recruit.Custom('DE_PRO_PER_S_3P_N')] grübelnd zu mir auf.\n\n„Sagt mal, Ihr seht recht fähig aus. Vielleicht könnt Ihr mir bei einem kleinen Problem helfen?”\n\nDer Bogen, den [numerate_recruit.Custom('DE_PRO_PER_S_3P_N')] ausgebreitet vor mir hochhält, ist voll sorgfältig geschriebener Zahlen und Berechnungen. Es scheint eine Art Saldobuch der Gewinne und Ausgaben der Stände hier zu sein."
 gdp_visit_holding_decision_event.1323.a: "Seht! Wenn Ihr diese Zahl hier verschiebt …"
 gdp_visit_holding_decision_event.1323.a.success: "Ihr löst die Gleichung"
 gdp_visit_holding_decision_event.1323.a.failure: "Ihr schafft es nicht, diese Gleichung zu lösen"
 gdp_visit_holding_decision_event.1323.b: "Wie wäre es, wenn Ihr das für #EMP meine#! Gesellschaft macht?"
 gdp_visit_holding_decision_event.1323.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![numerate_recruit_cost|V0] [gold|E] erforderlich, um [numerate_recruit.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1323.c: "Wenn ich es mir recht überlege …"
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1324.t: "[Select_CString(ROOT.Char.IsFemale, 'Die', 'Der')|U] erprobte Reisende"
 gdp_visit_holding_decision_event.1324.desc: "Die Spannungen zwischen den beiden Händlern erreichen den Siedepunkt: [traveler_recruit.GetFirstName|U] versucht mit beschwichtigenden Gesten, den Streit zu entschärfen. Trotz des gebrochenen [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|U]s ist [traveler_recruit.Custom('DE_PRO_PER_S_3P_N')] einigermaßen erfolgreich. Diese Bemühungen sind bewundernswert bei jemandem, der offensichtlich nicht mit der örtlichen Kultur vertraut ist.\n\nDoch keiner der beiden Händler vermag zu sagen, ob [traveler_recruit.Custom('DE_PRO_PER_S_3P_N')] Güte, Waren oder etwas ganz anderes meint, und der Streit endet in einem Patt."
 gdp_visit_holding_decision_event.1324.a: "„Lasst mich versuchen, hier zu schlichten.“"
 gdp_visit_holding_decision_event.1324.a.success: "Eure Interpretation ist beeindruckend"
 gdp_visit_holding_decision_event.1324.a.failure: "Eure Unterbrechung ist unerwünscht"
 gdp_visit_holding_decision_event.1324.b: "Ich könnte jemanden mit Euren Kenntnissen brauchen."
 gdp_visit_holding_decision_event.1324.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![traveler_recruit_cost|V0] [gold|E] erforderlich, um [traveler_recruit.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1324.c: "Es schert mich nicht …"
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1325.t: "Das Straßenkind"
 gdp_visit_holding_decision_event.1325.desc: "Ich habe diese Masche schon oft erlebt, weswegen ich weiß, dass ich mich dem Kind vorsichtig nähern muss. Noch ehe ich etwas sagen kann, drückt mir ein zarter Arm das Bündel in die Hand.\n\n„Bitte, lieber Mensch, könntet Ihr mir und dem Kleinen etwas zu essen geben?“\n\nDie andere Hand tastet bereits nach meinem Beutel. Das Bündel rutscht mir aus den Fingern und fällt zu Boden – drei in eine Decke gewickelte Steine, wie ich vermutet hatte. Eine offensichtliche, aber dreiste List."
 gdp_visit_holding_decision_event.1325.a: "Lass sofort die Finger von meinem Beutel!"
 gdp_visit_holding_decision_event.1325.a.success: "Ihr findet den Dieb"
 gdp_visit_holding_decision_event.1325.a.failure: "Ihr seid zu langsam"
 gdp_visit_holding_decision_event.1325.b: "Meine Gesellschaft könnte ein paar flinke Hände brauchen."
 gdp_visit_holding_decision_event.1325.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![urchin_recruit_cost|V0] [gold|E] erforderlich, um [urchin_recruit.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1325.c: "Genug davon!"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1326.t: "[Select_CString(herbalist_recruit.IsFemale, 'Die Kräuterkundlerin', 'Der Kräuterkundler')]"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName|U] beachtet mich nicht, während ich nähertrete. [herbalist_recruit.Custom('DE_PRO_PER_S_3P_N')|U] ist wie gebannt von den Bewegungen des Stößels, der die Zutat zu einer undefinierbaren Mischung zerreibt.\n\n„Ein wenig [ROOT.Char.Custom('Abortifacient')] und vielleicht etwas [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] – und dann könnte ich das Ganze womöglich in [ROOT.Char.Custom('RegionalDrink')] aufkochen. Ja … das sollte den gewünschten Effekt erzielen. Was meint Ihr?“\n\nOhne meine Anwesenheit groß zu beachten, dreht [herbalist_recruit.Custom('DE_PRO_PER_S_3P_N')] sich zu mir um und hält mir den Mörser unter die Nase. Ein beißender Geruch schlägt mir entgegen."
 gdp_visit_holding_decision_event.1326.a: "#EMP Hm#!, dürfte ich etwas mehr [ROOT.Char.Custom('Abortifacient')] vorschlagen?"
 gdp_visit_holding_decision_event.1326.a.success: "Euer Beitrag ist hilfreich"
 gdp_visit_holding_decision_event.1326.a.failure: "Euer Beitrag ist nicht hilfreich"
 gdp_visit_holding_decision_event.1326.b: "Ich könnte jemanden von Eurem Können wirklich brauchen."
 gdp_visit_holding_decision_event.1326.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![herbalist_recruit_cost|V0] [gold|E] erforderlich, um [herbalist_recruit.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1326.c: "Ich glaube nicht, dass das etwas für mich ist."
 gdp_visit_holding_decision_event.1330.t: "Der Mönch"
 gdp_visit_holding_decision_event.1330.desc: "In einer ruhigen Ecke des örtlichen Teehauses entdecke ich einen Mönch, der aus Schafgarbenhalmen im Kerzenschein die Zukunft deutet. Der Mönch blickt mich an und spürt mein Interesse.\n\n„Seid Ihr ein Anhänger des Orakels, mein guter Mensch? Ist Euer Geist offen und aufrichtig, so hat der Weg Euch viel zu zeigen.“"
 gdp_visit_holding_decision_event.1330.desc_returned_01: "Das Teehaus ist leerer als zuvor. [monk.GetFirstName|U] sitzt noch immer da. Vor [monk.Custom('DE_PRO_PER_S_3P_D')] liegen die Schafgarbenhalme nach wie vor ausgebreitet auf dem Tisch, während die Kerze mittlerweile weiter heruntergebrannt ist.\n\n[monk.Custom('DE_PRO_PER_S_3P_N')|U] blickt nicht auf."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "[monk.GetFirstName|U] packt gerade die Halme in einem Tuch zusammen, als ich zurückkehre. Die Kerze flackert.\n\n„Beharrlich“, sagt [monk.Custom('DE_PRO_PER_S_3P_N')]. „Dem Weg macht ein zweiter Besuch nichts aus. Euch etwa?“"
 gdp_visit_holding_decision_event.1330.a: "Meine Gesellschaft könnte einen sachkundigen Mitarbeiter gebrauchen."
 gdp_visit_holding_decision_event.1330.a.tt: "@gold_icon![monk_recruit_cost|V0] [gold|E] erforderlich, um [monk.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "Erzählt mir, was Ihr studiert habt."
 gdp_visit_holding_decision_event.1330.c: "Ich weiß das eine oder andere über den Himmel."
 gdp_visit_holding_decision_event.1330.c.success: "Ihr habt [monk.GetFirstNameNoTooltip] beeindruckt"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName|U] ist davon unbeeindruckt"
 gdp_visit_holding_decision_event.1330.d: "Vielleicht ein anderes Mal."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1333.t: "[Select_CString(caravaneer.IsFemale, 'Die', 'Der')|U] erprobte Karawanenführer[caravaneer.Custom('DE_END_NOU_S_GS_N')]"
 gdp_visit_holding_decision_event.1333.desc: "Die Dromedare drängen sich in dem spärlichen Schutz zusammen, den ihr Gehege bietet. Aus der Herde dringen gelegentlich ein Grunzen, das Stampfen eines Hufs und … ein #EMP Schnarchen#!?\n\nBei näherer Betrachtung entdecke ich [Select_CString(caravaneer.IsFemale, 'eine Karawanenführerin', 'einen Karawanenführer')], [caravaneer.Custom('DE_ART_DEF_S_N')] an den Satteltaschen lehnend schläft. [caravaneer.Custom('DE_PRO_PER_S_3P_N')|U] erwacht beim Geräusch meiner Annäherung, wischt sich den Speichel aus dem Gesicht und steht rasch auf.\n\n[caravaneer.Custom('DE_PRO_PER_S_3P_N')|U] erklärt: „Ich versichere Euch, der Stallbesitzer weiß, dass ich hier bin. Ich lasse meine Tiere niemals allein – zu ihrer Sicherheit und zu meinem eigenen Seelenfrieden.“"
 gdp_visit_holding_decision_event.1333.desc_returned_01: "Die Dromedare stehen noch immer dicht gedrängt im Pferch. Diesmal ist [Select_CString(caravaneer.IsFemale, 'die Karawanenführerin', 'der Karawanenführer')] wach und streicht mit der Hand über [caravaneer.Custom('DE_PRO_POS_S_3P')]en Sattelgurt.\n\n[caravaneer.Custom('DE_PRO_PER_S_3P_N')|U] blickt über [caravaneer.Custom('DE_PRO_POS_S_3P')]e Schulter hinweg. „Ihr schon wieder.“"
 gdp_visit_holding_decision_event.1333.desc_returned_02: "Ein Grunzen aus dem Pferch, dann ertönt die Stimme von [caravaneer.GetFirstName]: „Seid Ihr gekommen, um zu glotzen? Das kostet mehr.“\n\n[caravaneer.Custom('DE_PRO_PER_S_3P_N')|U] sitzt nun voll bekleidet auf den Satteltaschen und wartet ab, ob ich vorhabe, etwas zu sagen."
 gdp_visit_holding_decision_event.1333.a: "„Ich werde Eure Tiere beschützen.“"
 gdp_visit_holding_decision_event.1333.a.tt: "@gold_icon![caravaneer_recruit_cost|V0] [gold|E] erforderlich, um [caravaneer.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "„Was gibt es Neues von unterwegs?“"
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "Ihr fragtet erst kürzlich nach der Straße – versucht es erneut nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently'))]"
 gdp_visit_holding_decision_event.1333.c: "„Ich weiß einiges darüber, wie man Karawanen organisiert …“"
 gdp_visit_holding_decision_event.1333.c.success: "Ihr habt [caravaneer.GetFirstNameNoTooltip] beeindruckt"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName|U] macht sich mit [caravaneer.Custom('DE_PRO_POS_S_3P')]en Tieren auf den Weg"
 gdp_visit_holding_decision_event.1333.d: "Vielleicht ein anderes Mal."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1334.t: "[Select_CString(sea_captain.IsFemale, 'Die Kapitänin', 'Der Kapitän')]"
 gdp_visit_holding_decision_event.1334.desc: "Am Kai hat sich eine Gruppe von Frauen und Männern um [Select_CString(sea_captain.IsFemale, 'eine wettergegerbte Seefahrerin', 'einen wettergegerbten Seefahrer')] versammelt, in der Hoffnung, eine Überfahrt auf [sea_captain.Custom('DE_PRO_POS_S_3P')]em Schiff zu ergattern.\n\nIch höre zwei Passanten miteinander flüstern: „Wir sind zu spät! [sea_captain.GetTitledFirstName|U] wird keinen Platz mehr für uns haben.“ Anstatt sich an einen anderen Seefahrer zu wenden, beschließen sie, auf [sea_captain.Custom('DE_PRO_POS_S_3P')]e nächste Ankunft zu warten.\n\nWer genau ist [Select_CString(sea_captain.IsFemale, 'diese Seefahrerin', 'dieser Seefahrer')]? Und klirrt da etwa #EMP Gold#! in [sea_captain.Custom('DE_PRO_POS_S_3P')]em Holzbein?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "Die Menschenmenge um [sea_captain.GetFirstName] hat sich gelichtet. [sea_captain.Custom('DE_PRO_PER_S_3P_N')|U] wirft Münze um Münze in [sea_captain.Custom('DE_PRO_POS_S_3P')]en Geldbeutel, während sich die letzten Bittsteller zurückziehen.\n\n[sea_captain.Custom('DE_PRO_PER_S_3P_N')|U] macht sich gar nicht erst die Mühe, sich umzudrehen. „Ich hätte nicht erwartet, Euch wiederzusehen.“"
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName|U] winkt einen Nachzügler zu einem anderen Schiff hinüber. Der Geldbeutel klopft gegen die Planken, als [sea_captain.Custom('DE_PRO_PER_S_3P_N')] umdreht.\n\n„Schon wieder zurück? Wolltet Ihr eine Koje oder habt Ihr es auf mich abgesehen?“"
 gdp_visit_holding_decision_event.1334.a: "„Ich kann doppelt so viel zahlen wie jeder andere hier.“"
 gdp_visit_holding_decision_event.1334.a.tt: "@gold_icon![sea_captain_recruit_cost|V0] [gold|E] erforderlich, um [sea_captain.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "„Wollt Ihr uns vielleicht die eine oder andere Geschichte erzählen?“"
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "Ihr hörtet erst kürzlich die Geschichte eines Seekapitäns – versucht es erneut nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1334_gained_traveler_xp_recently'))]"
 gdp_visit_holding_decision_event.1334.c: "„Der Handel mit Waren ist ein weitaus lukrativeres Unterfangen.“"
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip|U] ist überzeugt"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName|U] winkt ab"
 gdp_visit_holding_decision_event.1334.d: "Vielleicht ein anderes Mal."
