 gdp_visit_holding_decision_event.1335.t: "[Select_CString(carnival_jester.IsFemale, 'Die Karnevalsnärrin', 'Der Karnevalsnarr')]"
 gdp_visit_holding_decision_event.1335.desc: "Ein gebanntes Publikum versammelt sich um [Select_CString(carnival_jester.IsFemale, 'eine Darstellerin', 'einen Darsteller')], [carnival_jester.Custom('DE_ART_DEF_S_N')] an einer Straßenecke auftritt. [carnival_jester.Custom('DE_PRO_PER_S_3P_N')|U] zieht Käufer von den nahen Verkaufsständen an und bringt das Marktgeschehen zum Erliegen.\n\n[Select_CString(carnival_jester.IsFemale, 'Die Darstellerin', 'Der Darsteller')] breitet einen Arm aus und sagt: „Seht her, Ihr alle, die Ihr mir sagtet, dass meine Kunststücke ohne die schummrigen Karnevalsorte nicht möglich wären. Ich muss mich, anders als Ihr, nicht hinter einer Maske verstecken.“"
 gdp_visit_holding_decision_event.1335.desc_returned_01: "Dieselbe Ecke, weniger Publikum. [carnival_jester.GetFirstName|U] beendet eine Drehung, entdeckt mich und breitet die Arme aus, als wäre ich Teil der Darbietung.\n\n„Eine Zugabe?“"
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName|U] packt [carnival_jester.Custom('DE_PRO_POS_S_3P')]e Requisiten in ein Tuch.\n\n„So langsam glaube ich, dass Ihr es auf mich abgesehen habt.“"
 gdp_visit_holding_decision_event.1335.a: "„Meine Gesellschaft braucht einen so scharfsinnigen Verstand wie den Euren.“"
 gdp_visit_holding_decision_event.1335.a.tt: "@gold_icon![carnival_jester_recruit_cost|V0] [gold|E] erforderlich, um [carnival_jester.GetFirstNameNoTooltip] anzuwerben"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "„Erzählt mir mehr über diese Karnevalsveranstaltungen.“"
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "Ihr fragtet erst kürzlich nach dem Karneval – versucht es erneut nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1335_gained_creditor_xp_recently'))]"
 gdp_visit_holding_decision_event.1335.c: "„Ihr habt hier doch sicherlich nichts mehr zu beweisen, oder?“"
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip|U] ist überzeugt"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName]|U packt [carnival_jester.Custom('DE_PRO_POS_S_3P')]e Sachen zusammen und geht"
 gdp_visit_holding_decision_event.1335.d: "Vielleicht ein anderes Mal."
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1336.t: "[Select_CString(cook.IsFemale, 'Die Bäckerin', 'Der Bäcker')]"
 gdp_visit_holding_decision_event.1336.desc_intro: "Der süße Duft von frischen Leckereien ([ROOT.Char.Custom('FavoriteTreat')]) weht von einem nahen Marktstand herüber. Auf jeder freien Fläche sind Körbe mit Backwaren gestapelt.\n\n[Select_CString(cook.IsFemale, 'Die Standbesitzerin', 'Der Standbesitzer')] steht mit dem Kopf in die Hände gestützt abseits. Als [cook.Custom('DE_PRO_PER_S_3P_N')] mich sieht, sagt [cook.Custom('DE_PRO_PER_S_3P_N')]:"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "„Früher arbeitete ich für [local_noble.GetTitledFirstNameNoTooltip], doch nun ‚achtet [local_noble.Custom('DE_PRO_PER_S_3P_N')] auf [local_noble.Custom('DE_PRO_POS_S_3P')]e Figur‘ und hat keine Verwendung mehr für mich.“ [cook.Custom('DE_PRO_PER_S_3P_N')|U] beißt sich auf die Lippen. „Vielleicht könnte [Select_CString(ROOT.Char.IsFemale, 'eine Kauffrau', 'ein Kaufmann')] wie Ihr mit diesen Waren hier handeln. Was mich betrifft … Dafür hat der Tag einfach zu wenig Stunden.“"
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "„Das Herrenhaus wird meine Dienste nicht anfordern. Ich habe mehr, als ich jemals verkaufen könnte!“"
 gdp_visit_holding_decision_event.1336.desc_returned_01: "Am Stand riecht es immer noch köstlich nach [ROOT.Char.Custom('FavoriteTreat')]. [cook.GetFirstName|U] packt gerade ein weiteres Päckchen für einen Fremden ein, der nicht bezahlt hat.\n\n[cook.Custom('DE_PRO_PER_S_3P_N')|U] sieht mich und seufzt. „Nach meinen Diensten wurde immer noch nicht verlangt. Ich kann meine Waren nicht immer weiter verschenken.“"
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Nun sind nur noch wenige Körbe übrig. [cook.GetFirstName|U] lehnt an der Theke. Mehl bedeckt [cook.Custom('DE_PRO_POS_S_3P')]en Ärmel, während [cook.Custom('DE_PRO_PER_S_3P_N')] zusieht, wie die letzten Laibe verkauft werden.\n\n„Wenn Ihr [Select_CString(cook.IsFemale, 'eine Bäckerin', 'einen Bäcker')] gebrauchen könnt“, sagt [cook.Custom('DE_PRO_PER_S_3P_N')], „so sagt es, bevor der Stand leer ist.“"
 gdp_visit_holding_decision_event.1336.a: "„In meiner Gesellschaft gibt es viele Mäuler zu stopfen.“"
 gdp_visit_holding_decision_event.1336.a.tt: "@gold_icon![cook_recruit_cost|V0] [gold|E] erforderlich, um [cook.GetFirstNameNoTooltip] anzuwerben"
