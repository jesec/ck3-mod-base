 gdp_visit_holding_decision_event.1320.desc: "Als ich die Menge überblicke, fallen mir drei mögliche Kandidaten ins Auge!"
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "Eine Menschenmenge versammelt sich, gebannt von einem silbernen Funkeln. Die Taschenspielertricks von [ROOT.Char.GetName] lassen sie Schlange stehen wie Lämmer auf dem Weg zur Schlachtbank."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "[ROOT.Char.GetFirstName|U] lehnt in einer oft getragenen Rüstung mit breitem Kreuz an einer Wand, wirft ein ums andere Mal einen Dolch zwei, drei Handbreit in die Höhe und fängt ihn wieder auf."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName|U] inspiziert die Stände einen nach dem anderen und vermerkt dann genau die Einzelheiten in einem handlichen Hauptbuch. "
 gdp_visit_holding_decision_event.1320.traveler.desc: "Gehüllt in fremdländische Gewänder versucht [ROOT.Char.GetFirstName], einen Streit zwischen zwei Händlern zu schlichten – und das auch noch in gebrochenem [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|U]!"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName|U] schleicht im Schatten herum, in einem Arm einen eingehüllten Säugling, den anderen Arm ausgestreckt auf der Suche nach einem ahnungslosen Ziel."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "Über einen verletzten Karawanenreisenden gebeugt stellt [ROOT.Char.GetFirstName] rasch einen Umschlag aus Kräutern aus der Nähe zusammen."
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip|U] sieht spannend aus."
 gdp_visit_holding_decision_event.1320.option.tt: "Ihr könnt vielleicht [THIS.Char.GetFirstName] als einen [associate|E] durch Folgendes rekrutieren:"
