 gdp_visit_holding_decision_event.1300.d_second: "Ich werde [monk.GetFirstNameNoTooltip] doch Gehör schenken."
 gdp_visit_holding_decision_event.1300.c.tt: "Den Marktplatz fürs Erste verlassen"
