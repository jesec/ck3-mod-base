 gdp_visit_holding_decision_event.1400.t: "Die Anleger von [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] besuchen"
 gdp_visit_holding_decision_event.1400.intro: "Unten am geschäftigen Hafen von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] entladen Hafenarbeiter emsig Fracht unterschiedlichster Art und Größe."
 gdp_visit_holding_decision_event.1400.asia: "Kisten mit Seide und Säcke mit Teeblättern werden von schwieligen Händen behutsam gehandhabt. Bald werden sie den Rest der bekannten Welt mit ihren Kostbarkeiten versorgen, sicher über die raue See befördert von den Dschunken."
 gdp_visit_holding_decision_event.1400.mena_india: "Inmitten des Chaos begutachtet ein Händler die Ladung einiger beschädigter Kisten. Am anderen Ende des Hafens werden Gewürzkisten sorgfältig versiegelt, um die gefahrvolle Überfahrt über den Ozean zu überstehen."
 gdp_visit_holding_decision_event.1400.default: "Säcke mit Getreide und Salz werden auf dem Seeweg in ferne Länder verschifft. Soeben ist eine stattliche Eichenkogge vor Anker gegangen, und eine Gruppe fremdländischer Kaufleute in farbenprächtiger Kleidung geht von Bord."
 gdp_visit_holding_decision_event.1400.outro: "Frische Luft füllt meine Lungen, und ich bin gespannt, ob mir das Glück heute hold ist.\n\nWohin soll ich mich als Nächstes wenden?\n\n"
 gdp_visit_holding_decision_event.1400.b: "Ich sollte die Augen nach spannenden Menschen offen halten."
 gdp_visit_holding_decision_event.1400.b.tt: "Eine Erkundung des Anlegers könnte die folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "Ich sollte einmal mit diesem Kapitän sprechen."
 gdp_visit_holding_decision_event.1400.d.tt: "Sprecht mit dem Kapitän\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "Ich sollte noch einmal mit [sea_captain.GetFirstNameNoTooltip] sprechen."
 gdp_visit_holding_decision_event.1400.c.tt: "Den Anleger fürs Erste verlassen"
