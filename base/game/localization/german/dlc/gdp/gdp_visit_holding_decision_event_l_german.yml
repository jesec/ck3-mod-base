 gdp_visit_holding_decision_event.1320.numerate.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$@skill_stewardship_icon![Concept('stewardship', 'Verwaltungs')|E]-[skill_challenge_no_prefix|E] gewinnen\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
