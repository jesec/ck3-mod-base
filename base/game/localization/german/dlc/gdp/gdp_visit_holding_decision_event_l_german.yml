 spawn_merchant_contract_interaction_cooldown_tt: "Diese Art von [task_contract|E] klingt gerade ab"
 gdp_visit_holding_decision_event.1310.a: "Ich will mehr über diese exotischen Kreaturen erfahren."
 gdp_visit_holding_decision_event.1310.a.tt: "Erzeugt einen [menagerie|E]-[luxury_contract_i][luxury_contract|E] auf der Karte"
 gdp_visit_holding_decision_event.1310.b: "Ich wäre sehr daran interessiert, diese Kuriositäten zu beschaffen."
 gdp_visit_holding_decision_event.1310.b.tt: "Erzeugt einen [Concept('curio', 'Kuriositäten')|E]-[luxury_contract_i][luxury_contract|E] auf der Karte"
 gdp_visit_holding_decision_event.1310.c: "Ich sollte stattdessen in die [ROOT.Char.GetHouse.GetNameNoTooltip]-Gesellschaft investieren"
