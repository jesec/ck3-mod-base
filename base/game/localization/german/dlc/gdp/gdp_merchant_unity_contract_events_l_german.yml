l_german:
 option_boilerplate.tt.partner_aptitude: "#WEAK Dieses Duell wird durch die [aptitude|E] Eures [Concept('deputy', 'Vertreters')|E] entschieden#!"
 option_boilerplate.tt.partner_aptitude.success: "Euer Vertreter ist erfolgreich"
 option_boilerplate.tt.partner_aptitude.failure: "Euer Vertreter scheitert"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: Nörgeleien in [destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_unity_contract.1004.desc: "Das Sendschreiben von [local_ruler.GetTitledFirstName] ist kurz und auf den Punkt: Das Benehmen [Select_CString(trader.IsFemale, 'meiner Händlerin', 'meines Händlers')] [trader.GetTitledFirstName] und damit auch meiner Gesellschaft wurde von den erzürnten Einwohnern von [destination.GetBaronyNameExplicitly] infrage gestellt.\n\nEinheimische Kaufleute, Geschäftsinhaber und Einwohner tragen allesamt Beschwerden über Unstimmigkeiten im Umgang mit meiner Gesellschaft vor. [local_ruler.GetTitledFirstNameNoTooltip] möchte die Sache schnell abschließen und beruhigt [local_ruler.Custom('DE_PRO_POS_S_3P')]e Kläger.\n\nOffenbar nahm sich [trader.GetTitledFirstNameNoTooltip] zu viele Freiheiten heraus, fernab der genauen Überprüfung, die [trader.Custom('DE_PRO_PER_S_3P_N')] hier in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ertragen müsste.\n\nAlles, was noch bleibt, ist die Reise nach [destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_unity_contract.1004.a: "Machen wir uns auf den Weg."
 gdp_merchant_unity_contract.1004.tt.destination_list: "Umgehend reist Ihr nach: [destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "[stewardship|E][stewardship|E][stewardship|E][stewardship|E]#TUT Um [task_contract|E] zu erfüllen:\n$EFFECT_LIST_BULLET$Ihr habt #V 3#! Gelegenheiten, Zusicherungen abzugeben:\n$TAB$$EFFECT_LIST_BULLET$#V 2#! Zusicherungen garantieren: $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$#V 3#! Zusicherungen garantieren: $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$#V 1#! Zusicherung führt entweder zu einem $label_success_standard$, zu einem #P Bedingten Erfolg#! oder zu einem $label_failure_standard$\n$EFFECT_LIST_BULLET$Herausforderungen können sein:\n$TAB$$EFFECT_LIST_BULLET$Eure [stewardship|E] auf die Probe stellen\n$TAB$$EFFECT_LIST_BULLET$Die [GetCourtPositionType('partner_court_position').GetName()]-[aptitude|E] des [Concept('deputy', 'Vertreters')|E]\n$TAB$$EFFECT_LIST_BULLET$Eure [diplomacy|E], Euer [intrigue|E] oder Eure [learning|E] auf die Probe stellen#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: Marktplatz"
 gdp_merchant_unity_contract.1010.desc.intro: "„[ROOT.Char.GetTitledFirstNameNoTooltip|U], nehme ich an?“, seufzt [local_ruler.GetTitledFirstName], als meine Gruppe und ich [local_ruler.Custom('DE_PRO_POS_S_3P')] Gefolge in [destination.GetBaronyNameExplicitly] treffen. Mein[trader.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))] [trader.GetTitledFirstName] ist mit dabei, von Wachen umgeben."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "Mein [GetCourtPositionType('partner_court_position').GetName()] [partner.GetFirstName] trottet hinter mir her, aufmerksam und bereit zum Helfen."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n„Euer Kaufmann verursachte ziemlichen Wirbel, wie unser Zeuge bestätigen wird.“ [local_ruler.GetFirstNameNoTooltip|U] fährt fort: „Ich vertraue Euch, dass Ihr das rasch regeln werdet! Ich habe keine Zeit für derlei Dinge übrig!“"
 gdp_merchant_unity_contract.1010.desc.outro: "\n\nIch soll mir den Kummer von [person_c.GetTitledFirstName] und [person_d.GetTitledFirstName] anhören. [trader.GetFirstNameNoTooltip|U] wirft mir einen Blick zu, der sagt: „[ROOT.Char.GetTitleAsNameNoTooltip|U], nun kommt schon, sicherlich versteht Ihr doch …“"
 gdp_merchant_unity_contract.1010.a: "[Select_CString(local_ruler.IsFemale, 'Gute', 'Guter')] [local_ruler.GetTitledFirstNameNoTooltip], könntet Ihr mich aufklären?"
 gdp_merchant_unity_contract.1010.a.tt: "Ihr erfragt umgehend die Erklärung von [THIS.Char.GetTitledFirstName]"
 gdp_merchant_unity_contract.1010.b: "Wir werden [person_c.GetTitledFirstNameNoTooltip] treffen."
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip|U] möchte äußerst gern mit uns sprechen."
 gdp_merchant_unity_contract.1010.d: "Lasst uns das genau an dieser Stelle beenden."
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "Wir werden in die privaten und unbescheidenen Gemächer von [char_current.GetTitleAsName] begleitet. [char_current.Custom('DE_PRO_PER_S_3P_N')|U] führt mich zu einem Raum, der für Besprechungen der wichtigsten Leute der Ortschaft ([destination.GetTitle.Custom('BaronyTownType')]) dient, und bittet mich, Platz zu nehmen."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName|U] bringt mich zu den nahen Räumlichkeiten [char_current.Custom('DE_PRO_POS_S_3P')]er Gesellschaft, wo [char_current.Custom('DE_PRO_POS_S_3P')]e eigenen Mitarbeiter geschäftig ihre Hauptbücher mit den Früchten der Tagesgeschäfte befüllen."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName|U] ist für die Anleger der Stadt zuständig und beobachtet vom Kai aus das Kommen und Gehen. [char_current.Custom('DE_PRO_POS_S_3P')|U]e endlosen Unterlagen halten die Schulden der Schiffe fest und notieren gelieferte und geladene Fracht."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName|U] überwacht den Hauptmarkt von [destination.GetTitle.GetBaseNameNoTier] und stellt sicher, dass die Höker ordnungsgemäß angemeldet sind und die Gesetze eingehalten werden, die [Select_CString(local_ruler.IsFemale, 'die', 'der')] [local_ruler.GetTitleAsNameNoTooltip] erlässt."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "Ich treffe [char_current.GetFirstName] in [char_current.Custom('DE_PRO_POS_S_3P')]er Schmiede an, wo [char_current.Custom('DE_PRO_PER_S_3P_N')] eifrig an ein paar Hufeisen hämmert. [char_current.Custom('DE_PRO_PER_S_3P_N')|U] bekommt kaum mit, dass ich mich nähere, aber entschuldigt sich, als [char_current.Custom('DE_PRO_PER_S_3P_N')] meinen Blick bemerkt, und gibt die Arbeit an einen Gesellen weiter."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "Ich treffe [char_current.GetFirstName] in [char_current.Custom('DE_PRO_POS_S_3P')]er Gerberei an, ein übel riechender Ort in den Außenbezirken der Stadt. [char_current.Custom('DE_PRO_PER_S_3P_N')|U] nimmt den Gestank kaum wahr, und die vielen Felle und Kunden bestätigen, dass der Gewinn den Gestank überwiegt."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "Ich treffe [char_current.GetFirstName] in [char_current.Custom('DE_PRO_POS_S_3P')]er Werkstatt an, wo die Luft nach Holz ([char_current.Custom('GetRandomAppropriateTree')]) riecht. Als [char_current.Custom('DE_PRO_PER_S_3P_N')] mich erblickt, legt [char_current.Custom('DE_PRO_PER_S_3P_N')] die Verbindungsstücke beiseite, an denen [char_current.Custom('DE_PRO_PER_S_3P_N')] gerade schnitzt."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName|U] steht der [destination.GetTitle.GetAdjectiveNoTooltip|l]en Stadtwache vor, und ich treffe [char_current.Custom('DE_PRO_PER_S_3P_A')] dösend in der Waffenkammer an. Als [char_current.Custom('DE_PRO_PER_S_3P_N')] erwacht, bietet [char_current.Custom('DE_PRO_PER_S_3P_N')] mir einen Platz an und stottert etwas von [char_current.Custom('DE_PRO_POS_S_3P')]er Pause."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "„Lasst uns offen reden, [ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip]“, beginnt [char_current.Custom('DE_PRO_PER_S_3P_N')]. „Mir wurde gesagt, [Select_CString(trader.IsFemale, 'diese Frau', 'dieser Mann')] von Euch beteiligte sich an allen Arten der Täuschung und"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n„Bekommt Eure Gesellschaft wieder in den Griff oder Ihr werdet woanders Euren Geschäften nachgehen müssen.“"
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "„Ist es so schwer?“, sagt [char_current.Custom('DE_PRO_PER_S_3P_N')] lächelnd, „Euer Familiengeschäft anständig zu betreiben? Mit allem Respekt vor Euren Unternehmungen: Diese hier ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) gibt kein gutes Bild ab …“"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "„Ich warne Euch“, sagt [char_current.Custom('DE_PRO_PER_S_3P_N')] lächelnd. „[Select_CString(local_ruler.IsFemale, 'Die', 'Der')] [local_ruler.GetTitleAsNameNoTooltip] war bislang geduldig, doch Ihr tut gut daran, [local_ruler.Custom('DE_PRO_PER_S_3P_A')] nicht auf die Probe zu stellen.“"
 gdp_merchant_unity_contract.1011.desc.personality.market: "„Von all den Händlern, die hier Geschäfte machen“, sagt [char_current.Custom('DE_PRO_PER_S_3P_N')] lächelnd und breitet die Arme aus, „ist es #EMP [Select_CString(trader.IsFemale, 'Eure', 'Euer')]#! [Select_CString(trader.IsFemale, 'Händlerin', 'Händler')]“, [char_current.Custom('DE_PRO_PER_S_3P_N')] deutet anklagend auf mich, „über [Select_CString(trader.IsFemale, 'die', 'den')] man sich wieder und wieder beschwert.“"
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "„Wir haben hier ein Sprichwort“, sagt [char_current.Custom('DE_PRO_PER_S_3P_N')] und verzieht das Gesicht. „#EMP Wo Rauch ist, ist auch Feuer#!, und [Select_CString(trader.IsFemale, 'Eure Händlerin', 'Euer Händler')] verursacht #EMP eine Menge#! an Rauch, kann ich Euch sagen!“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "„Ich habe meine Geschäfte immer auf eine anständige Art und Weise gemacht und ordentliche Aufzeichnungen und Beziehungen zu meinen Kunden geführt. Es ist eine Schande, dass sich nicht alle von uns dahingehend bemühen …“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "„Es führt kein Weg daran vorbei: Die Mächte des Wohlstands ([char_current.GetFaith.WealthGodName]) wachen über uns alle, und ich werde sicherstellen, dass sie mir wohlgesonnen bleiben. Jene, die dies nicht tun, finden es schon bald heraus …“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "„Schaut, ich nehme Geld so gern wie [Select_CString(char_current.IsFemale, 'jede andere Frau', 'jeder andere Mann')], vielleicht sogar noch lieber! Doch ich kann das Geschäft nicht so führen, auf Schritt und Tritt übervorteilt zu werden.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "„Ihr scheint eine vernünftige Person zu sein, [ROOT.Char.GetTitledFirstNameNoTooltip]. Bitte versteht, dass [Select_CString(trader.IsFemale, 'Eure Händlerin', 'Euer Händler')] uns Unrecht getan hat, und das können wir uns nicht leisten.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "„Ich betrachte mich als geradlinigen Menschen. Ich spreche frei heraus und hoffe, dass auch andere frei heraus mit mir sprechen. [Select_CString(trader.IsFemale, 'Eure Händlerin', 'Euer Händler')] lügt. Mehr gibt es dazu nicht zu sagen.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "„Ich weiß, ich weiß. Es scheint, als kämen wir gut zurecht, aber ich bin auf Schiffslieferungen angewiesen, um Handel treiben zu können, und [Select_CString(trader.IsFemale, 'Eure Frau', 'Euer Mann')] hat mich zu häufig im Stich gelassen.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "„Ich spiele gern gerecht und nach den Regeln, [ROOT.Char.GetTitledFirstNameNoTooltip], sowohl im Geschäft als auch mit meinen Untergebenen und meinen Vorgesetzten. Doch das ist nur angebracht, wenn jeder sich daran beteiligt. Wenn dem nicht so ist, kann es durchaus vorkommen, dass #EMP manche#! Leute wütend werden.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "„Ich bin [Select_CString(char_current.IsFemale, 'eine viel beschäftigte Frau', 'ein viel beschäftigter Mann')], und Ihr seid ebenso beschäftigt. Daher komme ich gleich zur Sache. Wenn ich nicht das bekomme, was ich brauche, kann ich die Meinen nicht ernähren. Ich will, dass das geklärt wird.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "„Schaut, ich bin sicher, dass [trader.GetFirstName] anständig ist, aber es gibt eine Grenze dessen, was ich dulden kann, und [trader.Custom('DE_PRO_PER_S_3P_N')] hat diese Grenze schon lange überschritten.“"
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "„Also … was werdet Ihr unternehmen? [Select_CString(trader.IsFemale, 'Eure Händlerin', 'Euer Händler')] machte sich hier unnötigerweise viele Feinde. Wir wünschen bloß, anständig behandelt zu werden.“"
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "verlegte mehrere Lieferungen.“"
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "lieferte Waren von schlechter Güte.“"
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "zahlte nicht die angemessenen Kosten.“"
 gdp_merchant_unity_contract.1011.a: "Versucht, die Unterschiede wegzureden."
 gdp_merchant_unity_contract.1011.b: "Versucht, [char_current.Custom('DE_PRO_PER_S_3P_A')] von Eurer Ehre zu überzeugen."
 gdp_merchant_unity_contract.1011.c: "Tischt einfach irgendeine Geschichte auf."
 gdp_merchant_unity_contract.1011.d.gold: "„Nehmt das. Für Eure Umstände.“"
 gdp_merchant_unity_contract.1011.d.competitiveness: "„Ich werde dafür sorgen, dass die Dinge wieder in Ordnung kommen.“"
 gdp_merchant_unity_contract.1011.e: "„Vielleicht können wir zu einer #EMP Vereinbarung#! gelangen?“"
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], Ihr könnt das erklären."
 gdp_merchant_unity_contract.1011.f.partner_away: "Wenn nur mein [GetCourtPositionType('partner_court_position').GetNameNoTooltip] hier wäre …"
 gdp_merchant_unity_contract.1011.f.partner_diff: "Wenn ich nur einen anderen [GetCourtPositionType('partner_court_position').GetNameNoTooltip] hätte …"
 gdp_merchant_unity_contract.1011.f.no_partner: "Hätte ich doch nur einen [GetCourtPositionType('partner_court_position').GetNameNoTooltip] …"
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT Ihr habt [task_contract.MakeScope.Var('assurances_given').GetValue|0V] von #V 3#! möglichen Zusicherungen gegeben#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT Ihr habt mit [task_contract.MakeScope.Var('chars_checked').GetValue|0V] von #V 3#! möglichen [Concept('characters','Charakteren')|E] gesprochen#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "Ihr gebt #P +1#! Zusicherung"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "Es wird keine Zusicherung gegeben"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Hier eine Zahl schönrechnen, dort einen Eintrag verschwinden lassen"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "Wartet, nein. Oh. Ist das so?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "[char_current.Custom('DE_PRO_PER_S_3P_N')|U] hat einen törichten Fehler gemacht"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Jede Aussage ist in sich stimmig"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "[char_current.Custom('DE_PRO_PER_S_3P_N')|U] ist nicht so schlau, wie [char_current.Custom('DE_PRO_PER_S_3P_N')] meint"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Immer noch schlauer als Ihr"
 gdp_merchant_unity_contract.1011.learning.tt.success: "Ihr wisst, wo Ihr suchen müsst"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "Ihr sucht überall, findet aber nichts"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: Erfolg!"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: Fehlschlag!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: Aufgabe ignoriert"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "Während [char_current.Custom('DE_PRO_PER_S_3P_N')] durch die Hauptbücher geht, verweist [char_current.GetTitledFirstName] auf Fälle von Fehlverhalten – auf Ausgaben, deren erwartete Erträge nie eingetreten sind oder hinter den versprochenen Ergebnissen zurückblieben."
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "Ich spreche hinlänglich über den guten Ruf meiner Gesellschaft in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] und über die zahlreichen Empfehlungen der ehrenwerten Leute dort in der Gegend. Die jüngsten Geschäfte sind offenbar eine Ausnahme, die zum Wohl des Handels nicht weiter verfolgt werden sollten."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "Ich erzähle eine mäandernde Geschichte über die letzten Schwierigkeiten, mit vielen sinnlosen Abschweifungen und der vorsichtigen Verwendung wahrheitsgemäßer Einzelheiten, bis ich selbst den Überblick über das Lügengespinst verliere."
 gdp_merchant_unity_contract.1012.desc.method.learning: "Wir reden eine #EMP gefühlte Ewigkeit#! und besprechen jeden vorstellbaren Gesichtspunkt der Geschäfte von [char_current.GetTitledFirstName] in [destination.GetBaronyNameExplicitly]. Jeder Stein wird umgedreht, jede Frage gestellt."
 gdp_merchant_unity_contract.1012.desc.method.partner: "[partner.GetFirstName|U] führt das Gespräch, und [char_current.GetTitledFirstName] stellt sich einem scheinbar unendlichen Hagel von Fragen. Zuerst noch geduldig, im Lauf der Zeit dann immer weniger zurückhaltend."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "„Euer Verständnis in dieser Angelegenheit wäre #EMP äußerst#! willkommen.“ Ich lächle und greife nach meiner Geldbörse, um ein paar Münzen auf den Tisch zu legen. [char_current.Custom('DE_PRO_PER_S_3P_N')|U] erstarrt kurz und blickt zwischen dem glänzenden Metall und meinen erhobenen Augenbrauen hin und her."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "„Meine Unternehmung ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) bedauert Eure Unannehmlichkeiten bei diesem Missverständnis zutiefst“, schmeichle ich. „Ich soll #EMP persönlich#! Eure Verluste ausgleichen.“"
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "Und damit habe ich alles getan, was ich tun kann. Es ist an der Zeit, die Dinge ruhen zu lassen."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip|U] wirft mir einen wissenden Blick zu und zieht die Münzen zu sich herüber."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "[char_current.GetFirstNameNoTooltip|U]e Überraschung verwandelt sich in Verärgerung, und mir wird die Tür gewiesen."
 gdp_merchant_unity_contract.1012.desc.result.success: "Dank etwas Schlitzohrigkeit und Klagen über die Launen des Handels akzeptiert [char_current.GetFirstNameNoTooltip] langsam meine Entschuldigungen für die Unstimmigkeiten. Nur die traurigen Realitäten des Fernhandels."
 gdp_merchant_unity_contract.1012.desc.result.failure: "Trotz all meiner Mühen lässt [char_current.Custom('DE_PRO_PER_S_3P_N')] jeden meiner Punkte abprallen und schlägt Lösungen vor, bringt ein Gegenargument oder erzählt eine Episode aus [char_current.Custom('DE_PRO_POS_S_3P')]em eigenen Erfahrungschatz – und bleibt unzufrieden."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "Ein Spatz in der Hand ist besser als eine Taube auf dem Dach, und ich halte diese vermutlich auf unrechtem Weg beschafften Reichtümer dieses Menschen sehr fest in der Hand, auch wenn ich uns dadurch der Möglichkeit beraubt habe, in [char_current.Custom('DE_PRO_POS_S_3P')]er Sache zu ermitteln."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "Möge uns unser Glück beim nächsten Verdächtigen so hold bleiben."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Hoffentlich haben wir beim nächsten Verdächtigen mehr Glück."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.Custom('DE_PRO_PER_S_3P_N')|U] kann dagegen nichts sagen."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "Möge meine Geldbörse unseren nächsten Besuch überleben …"
 gdp_merchant_unity_contract.1012.a: "[local_ruler.GetTitledFirstNameNoTooltip|U] als Nächstes."
 gdp_merchant_unity_contract.1012.b: "Auf! Besuchen wir [person_c.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip|U] erwartet uns …"
 gdp_merchant_unity_contract.1012.d: "Lasst uns das jetzt beenden …"
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "Ihr versucht, weiterhin Zusicherungen zu geben"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "Ihr entscheidet, wie die Lage geregelt werden soll"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: Regelung"
 gdp_merchant_unity_contract.1021.desc.intro: "Wieder einmal versammeln wir uns auf dem Marktplatz, wo [local_ruler.GetTitledFirstName] die Kläger und meinen Händler zusammengerufen hat, um meine endgültige Meinung in der Angelegenheit zu hören.\n\n[person_c.GetFirstName|U] und [person_d.GetFirstName] schauen mich an, während [trader.GetFirstName] das erste Mal seit meiner Ankunft nervös wirkt und unter den Blicken hin und her trippelt.\n\nMein Gefühl sagt mir, dass"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "die Einheimischen gut auf die richtige Seite geholt wurden."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "die Einheimischen einigermaßen zufrieden sind mit meinen Bemühungen."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "ich keinesfalls das Vertrauen der Einheimischen gewonnen habe."
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip|U] gähnt. „Nun kommt schon! Was ist mit"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "diesen fehlenden Lieferungen?“"
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "diesen Waren von mangelhafter Güte?“"
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "diesen unbezahlten Kosten?“"
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Nachdem Ihr alle möglichen Zusicherungen gabt, sind Eure übertriebenen Maßnahmen ausreichend, um einen #P Außergewöhnlichen Erfolg#! zu erzwingen, sogar wenn Ihr [trader.GetTitledFirstNameNoTooltip] nicht bestraft#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT Dank ausreichend Zusicherungen, die Ihr gabt, werden Eure Bemühungen wahrscheinlich mit einem $label_success_standard$ abschließen, sogar wenn Ihr [trader.GetTitledFirstNameNoTooltip] nicht bestraft#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT Da Ihr zu wenige Zusicherungen gabt, könnten Eure schlampigen Bemühungen zu Widerstand führen, wenn Ihr [trader.GetTitledFirstNameNoTooltip] nicht bestraft#!"
 gdp_merchant_unity_contract.1021.a: "„Wie ich schon erklärt hatte, war es einfach nur ein bedauerliches Missverständnis.“"
 gdp_merchant_unity_contract.1021.a.tt: "Ihr glaubt, dass Eure Zusicherungen ausreichend sind"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "Falls Ihr viele Zusicherungen gabt"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "Falls Ihr ein paar Zusicherungen gabt und die Einheimischen einlenken"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "Falls Ihr es nicht schafftet, verlässliche Zusicherungen zu machen, und die Einheimischen abwehrend antworten"
 gdp_merchant_unity_contract.1021.b: "Ihr werdet bezahlen, und zwar die Hälfte."
 gdp_merchant_unity_contract.1021.b.tt: "Ihr entscheidet zugunsten von [local_ruler.GetTitledFirstName], erleichtert aber dennoch die Steuerlast von [trader.GetTitledFirstName]"
 gdp_merchant_unity_contract.1021.c: "„Diese ganze Affäre ist doch Unsinn. Verleumdung und Unsinn!“"
 gdp_merchant_unity_contract.1021.c.tt: "Ihr verleugnet rundweg jedwede Fehler seitens der Gesellschaft"
 gdp_merchant_unity_contract.1021.d: "„[trader.GetTitledFirstNameNoTooltip|U] ist schuldig und muss bestraft werden.“"
 gdp_merchant_unity_contract.1021.d.tt: "Ihr opfert [trader.GetTitledFirstNameNoTooltip] für die Gesellschaft"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: Ein einfaches Missverständnis"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: Die Angelegenheit ist geklärt"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: Die Angelegenheit ist nicht geklärt"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: Nicht zufriedenstellend"
 gdp_merchant_unity_contract.1022.desc.success_critical: "Die Einheimischen schauen einander an und nicken begeistert, während [trader.GetFirstName] strahlt. [local_ruler.GetTitledFirstName|U] ist offenkundig erleichtert und auch ein wenig erstaunt. „Sehr gut! In diesem Fall ist die Angelegenheit beendet!“, verkündet [local_ruler.Custom('DE_PRO_PER_S_3P_N')].\n\nDie Kläger danken mir ausführlich für meinen Besuch und dass ich sie beruhigen konnte. Irgendwie wird der Gesellschaft in [destination.GetBaronyNameExplicitlyNoTooltip] nun #EMP mehr#! vertraut als je zuvor."
 gdp_merchant_unity_contract.1022.desc.success_standard: "Die Einheimischen schauen einander an und nicken schwerfällig, während [trader.GetFirstName] lächelt. [local_ruler.GetTitledFirstName|U] zeigt sich erst zögerlich, fährt aber dann doch rasch fort. „Richtig. Nun, dann ist die Angelegenheit abgeschlossen“, sagt [local_ruler.Custom('DE_PRO_PER_S_3P_N')] beinahe fragend.\n\nDie Kläger wirken zufrieden genug, als sie die Argumente diskutieren. Es scheint, als sei der Ruf der Gesellschaft in [destination.GetBaronyNameExplicitlyNoTooltip] für den Moment sicher."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "Für einen kurzen, angespannten Moment wirkt es, als wollten [local_ruler.GetTitledFirstName] und [local_ruler.Custom('DE_PRO_POS_S_3P')]e Lakaien meiner schwachen Schlussfolgerung widersprechen, doch der Moment vergeht.\n\n„Nun gut …“, seufzt [Select_CString(local_ruler.IsFemale, 'die', 'der')] [local_ruler.GetTitleAsNameNoTooltip] und mustert die unzufriedenen Kläger. „Stellt sicher, dass so etwas nie wieder vorkommt.“\n\nDie Einheimischen haben offenkundig ihre Zweifel, doch damit muss sich [trader.GetFirstName] herumschlagen."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "Schweigen legt sich über den Platz.\n\nEine angespannte, unangenehme Stille herrscht, als sich die Einheimischen gegenseitig anblicken und die Unzufriedenheit ihnen die Mundwinkel verzieht.\n\n[local_ruler.GetTitledFirstName|U] knurrt: „War es das?“, die wütende Unterstützung der Kläger im Rücken.\n\nDas nervöse Schlucken von [trader.GetFirstName] ist deutlich zu hören. „Mit tut diese Unannehmlichkeit äußerst leid“, bringt [trader.Custom('DE_PRO_PER_S_3P_N')] hervor. „Aber es gibt nichts mehr, was wir tun könnten. Solche Dinge … kommen vor.“"
 gdp_merchant_unity_contract.1022.a: "Das hätte nicht besser laufen können."
 gdp_merchant_unity_contract.1022.b: "Ende gut, alles gut …"
 gdp_merchant_unity_contract.1022.c: "Nun, das hätte besser laufen können."
 gdp_merchant_unity_contract.1022.d: "Äh … Zeit für den Aufbruch."
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: Verleugnung"
 gdp_merchant_unity_contract.1023.desc: "Die Kläger sind überrumpelt, so viel kann man ihrem wütenden Tuscheln entnehmen. [local_ruler.GetTitleAsName] ist offenkundig unsicher, wie es weitergehen soll.\n\nDie Überraschung von [trader.GetFirstName] verwandelt sich in selbstbewussten Stolz, als ich fortfahre: „Ich lasse es nicht zu, dass der gute Name meiner Gesellschaft wegen solcher Bagatellen durch den Dreck gezogen wird.“\n\nIch rümpfe die Nase, „Ihr habt meine Zeit hier verschwendet. Ich habe dringende Geschäfte in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] zu erledigen!“"
 gdp_merchant_unity_contract.1023.a: "Zeit für den Aufbruch."
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: Sündenbock"
 gdp_merchant_unity_contract.1024.desc: "Die Kläger brechen in laute Jubelrufe aus, als [local_ruler.GetTitledFirstName] etwas überrascht die Stadtwache ruft, um [Select_CString(trader.IsFemale, 'die überrumpelte', 'den überrumpelten')] [trader.GetFirstName] in Ketten legen zu lassen.\n\n„A-aber, [ROOT.Char.GetTitleAsNameNoTooltip]!“, krächzt [Select_CString(trader.IsFemale, 'meine Händlerin', 'mein Händler')]. Ich winke [trader.Custom('DE_PRO_PER_S_3P_A')] fort. „Geschieht [trader.Custom('DE_PRO_PER_S_3P_D')] recht. [trader.Custom('DE_PRO_PER_S_3P_N')|U] war ohnehin lausig in seiner Arbeit …“"
 gdp_merchant_unity_contract.1024.a: "Ein notwendiges Opfer."
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: Beeindruckender Scharfsinn"
 gdp_merchant_unity_contract.1031.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip|U]?“\n\nIch blicke von meinem Hauptbuch auf und sehe ... [Select_CString(hopeful.IsFemale, 'eine irgendwie vertraut wirkende', 'einen irgendwie vertraut wirkenden')] [hopeful.GetCulture.GetName|l][Select_CString(hopeful.IsFemale, 'e', 'en')] [hopeful.GetCulture.GetName]? Woher kenne ich [Select_CString(hopeful.IsFemale, 'sie', 'ihn')] nur …\n\n„Ich bin [hopeful.GetTitledFirstName], [ROOT.Char.GetTitleAsNameNoTooltip]. Ihr kamt vor einigen Jahren in meine Heimatstadt [destination_1.GetBaseNameNoTier] und brachtet ein Missverständnis in Ordnung. Und dies meines Erachtens nach mit Würde und Entschlossenheit.\n\nDennoch ging mein Geschäft vor langer Zeit vor die Hunde, und so suche ich nun nach anderer Arbeit. Ich dachte, Ihr … könntet etwas für mich haben …“"
 gdp_merchant_unity_contract.1031.a: "Wohlan denn und willkommen!"
 gdp_merchant_unity_contract.1031.b: "Die Gesellschaft hat keine Verwendung für Euch."
