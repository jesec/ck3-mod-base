l_german:
 schmooze_intent: "Gesellschaftlicher Umgang"
 schmooze_intent_desc: "Ihr strebt danach, die Räder des Geschäfts zu schmieren und die [competitiveness|E] zu verbessern."
 gdp_merchant_schmooze_modifier: "Umgang mit Adligen"
 gdp_merchant_schmooze_modifier_desc: "Dieser Charakter stellte sich bei einem Fest beim örtlichen Adel vor."
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U] verkehrte mit [TARGET_CHARACTER.GetShortUINameNoTooltip]"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName|U] nutzte die Gelegenheit, um Umgang mit [TARGET_CHARACTER.GetShortUINameNoTooltip] zu haben"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U] verkehrte mit dem Adel"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName] nutzte die Gelegenheit, um Umgang mit Adligen zu haben"
 gdp_schmooze_events.1000.t: "Umgang mit [schmoozee.GetFirstNameNoTooltip]"
 gdp_schmooze_events.1000.desc: "Wir Kaufleute müssen jede Gelegenheit nutzen, um mit dem Adel Umgang zu haben. Mit einem geschickten Wort oder einem edlen Geschenk lässt sich sicherstellen, dass er einem Vorhaben nicht im Wege steht – oder gar das eines Rivalen unterstützt.\n\nIndem ich sorgsam den schmalen Grat zwischen widerlicher Schmeichelei und allzu großer Aufdringlichkeit meide, tue ich mein Bestes, damit sich mein[schmoozee.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))] [schmoozee.GetTitledFirstName] auf meine Seite schlägt."
 gdp_schmooze_events.1000.a: "„Bitte, gut[schmoozee.Custom('DE_END_ADJ_IND_S_N')] [schmoozee.GetTitleAsNameNoTooltip], nehmt dieses Geschenk an.“"
 gdp_schmooze_events.1000.b: "„[Select_CString(ROOT.Char.IsFemale, 'Eine bescheidene Kauffrau', 'Ein bescheidener Kaufmann ')] wie ich muss doch zu den Höhergestellten aufschauen.“"
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip|U] ist geschmeichelt"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip|U] verdreht die Augen"
 gdp_schmooze_events.1000.c: "„Mit Euch zu sprechen, war mir eine Ehre.“"
 gdp_schmooze_events.1000.d: "„Ich handle mit vielen Dingen, die jemandem von Eurem Stand ([schmoozee.GetTitleAsNameNoTooltip]) würdig wären!“"
 gdp_schmooze_events.1010.t: "Gutmütiger Wettbewerb"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName|U] und ich brechen Brot und prahlen abwechselnd mit dem Erfolg unserer Gesellschaften, während wir bei [ROOT.Char.Custom('RegionalDrink')] und [ROOT.Char.Custom('GetExpensiveMeal')] zusammensitzen."
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName] und ich sitzen gemeinsam im Schatten eines Baums ([ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')]) und prahlen abwechselnd mit dem Erfolg unserer Gesellschaften."
 gdp_schmooze_events.1010.outro: "\n\nTrotz all unserer Prahlerei sind wir offensichtlich bei vielem einer Meinung. Dieser Mensch könnte vielleicht nützlich für mich sein – und ich für ihn."
 gdp_schmooze_events.1010.a: "„Für ein gewisses Sümmchen könnte ich Euch etwas Platz machen.“"
 gdp_schmooze_events.1010.b: "„Nehmt dies und kommt mir nicht in die Quere.“"
 gdp_schmooze_events.1010.c: "„Ihr singt Loblieder auf mich und ich auf Euch.“"
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip|U] macht mit"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip|U] hat kein Interesse"
 gdp_schmooze_events.1010.d: "Das ist nicht die Zeit."
 gdp_schmooze_events.1030.t: "Geteilte Aufmerksamkeit"
 gdp_schmooze_events.1030.feast: "Im weiteren Verlauf des Abends umlagern mich mein[schmoozee_1.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))] [schmoozee_1.GetTitledFirstName] und mein[schmoozee_2.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))] [schmoozee_2.GetTitledFirstName]. Die Adligen tauschen sich träge über die hypothetischen Prinzipien des Geschäftemachens und des Handels als Mittelsmann aus, während sie dabei [schmoozer.Custom('GetRegionalFish')] vom Grill genießen."
 gdp_schmooze_events.1030.hunt: "Im weiteren Verlauf der Jagd umlagern mich mein[schmoozee_1.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))] [schmoozee_1.GetTitledFirstName] und mein[schmoozee_2.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))] [schmoozee_2.GetTitledFirstName]. Die Adligen tauschen sich träge über die hypothetischen Prinzipien des Geschäftemachens und des Handels als Mittelsmann aus, während die Bluthunde nach einer Witterung suchen."
 gdp_schmooze_events.1030.outro: "\n\nSchließlich wendet sich [schmoozee_1.GetFirstNameNoTooltip] an mich, damit ich in dieser Angelegenheit ein klärendes Wort spreche. „Kommt, [schmoozer.GetTitledFirstNameNoTooltip], Ihr gehört doch auch zu den Kaufleuten. Gute Güte, Ihr müsst doch eine Meinung haben?“"
 gdp_schmooze_events.1030.a: "„Ihr trefft den Nagel auf den Kopf, [Select_CString(schmoozee_1.IsFemale, 'gute', 'guter')] [schmoozee_1.GetTitleAsNameNoTooltip].“"
 gdp_schmooze_events.1030.b: "„[schmoozee_2.GetTitledFirstNameNoTooltip|U] hat die Lage klar erkannt.“"
 gdp_schmooze_events.1030.c: "„Euer beider Einsichten sind für mich wahrlich beflügelnd.“"
 gdp_schmooze_events.1030.c.success: "Man fühlt sich geschmeichelt"
 gdp_schmooze_events.1030.c.failure: "Man verdreht die Augen"
 gdp_schmooze_events.1030.d: "„Dazu kann ich unmöglich etwas anmerken.“"
 gdp_schmooze_events.1050.t: "Bewegung am Markt"
 gdp_schmooze_events.1050.feast: "Die Feierlichkeiten legen eine kleine Pause ein, was es den Gästen erlaubt, ein wenig zu plauschen, und dem Gesinde eine Gelegenheit verschafft, mit der Arbeit hinterherzukommen."
 gdp_schmooze_events.1050.hunt: "Wir legen eine kleine Pause ein, um die [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')|l]e Landschaft ([ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')]) zu betrachten, während die Bluthunde und die Treiber weiter vorandrängen."
 gdp_schmooze_events.1050.outro: "Ich stelle fest, dass ich ohne echte Absicht dahinter an zwei entscheidende Spieler auf unseren Märkten herangetreten bin.\n\n[schmoozee_1.GetTitledFirstName|U] ist jemand, den es sich in [market_1.GetLocationTitle.GetNameNoTier] zu kennen lohnt, und für [schmoozee_2.GetTitledFirstName] gilt das Gleiche in [market_2.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.three: "Ich erspähe auch [schmoozee_3.GetTitledFirstName], [Select_CString(schmoozee_3.IsFemale, 'die', 'der')] in [market_3.GetLocationTitle.GetNameNoTier] beheimatet ist."
 gdp_schmooze_events.1050.a: "„[schmoozee_1.GetFirstNameNoTooltip|U], ich wollte mich gern unterhalten!“"
 gdp_schmooze_events.1050.b: "„Ich habe sehr spannende Dinge gehört, [schmoozee_2.GetFirstNameNoTooltip].“"
 gdp_schmooze_events.1050.c: "„Oh, [schmoozee_3.GetFirstNameNoTooltip], lasst uns ein wenig plaudern!“"
 gdp_schmooze_events.1050.d: "Den Märkten geht es bestens."
 gdp_schmooze_events.1060.t: "Wetteifern um die Aufmerksamkeit"
 gdp_schmooze_events.1060.feast: "Während das Gesinde um die Tische kreist, um Becher aufzufüllen und einen neuen Gang zu servieren,"
 gdp_schmooze_events.1060.hunt: "Als wir anhalten, um einen Schluck aus unseren Wasserschläuchen zu trinken und uns die Beine zu vertreten,"
 gdp_schmooze_events.1060.outro: "fällt mir etwas ins Auge: [rival.GetName|U] schmiert [schmoozee.GetName] schamlos Honig um den Bart.\n\nDas schleimige Geschöpf erzählt mit einem gekünstelten Lächeln, welche Vorteile seine Händler bringen, während es meine eigenen Mitarbeitern als Gauner und Maulhelden schmäht!"
 gdp_schmooze_events.1060.a: "„Nun kommt schon. Eure armselige [rival.GetHouse.GetBaseNameNoTooltip]-Unternehmung ist doch ein Witz!“"
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip|U] wirkt wie ein Trottel"
 gdp_schmooze_events.1060.a.failure: "Ihr wirkt wie ein Trottel"
 gdp_schmooze_events.1060.b: "„Weitermachen! Unser Buch ist handfest.“"
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip|U] ist überzeugt"
 gdp_schmooze_events.1060.b.failure: "Ihr habt schwache Argumente"
 gdp_schmooze_events.1060.c: "Lasst sie plappern."
 activity_used_trade_market_luxury_items_modifier: "Gesellschaftliche Nachfrage"
 activity_used_trade_market_luxury_items_modifier_desc: "Die Luxuswaren dieses Markts wurden von einem Kaufmann für die Verwendung bei einer Aktivität umgelenkt."
 activity_used_trade_market_comforts_modifier: "Gesellschaftliche Nachfrage"
 activity_used_trade_market_comforts_modifier_desc: "Die Annehmlichkeiten dieses Markts wurden von einem Kaufmann für die Verwendung bei einer Aktivität umgelenkt."
