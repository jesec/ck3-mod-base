 scheme_critical_moments.1142.desc_patrician_self: "Die ganze Mühe, die ich in die Kampagne für meine Eigenwerbung steckte, hat sich gelohnt.\n\nMein Ansehen unter meinen Gleichgestellten verbesserte sich, neue Unterstützer strömen in Scharen zu meinem [house|E] – und mein Ziel ist näher denn je!"
 scheme_critical_moments.1142.desc_patrician_other: "Die viele Zeit und vielen Ressourcen, die in die Förderung der Sache von [target.GetTitledFirstName] gesteckt wurden, haben Früchte getragen.\n\n[target.Custom('DE_PRO_POS_S_3P')|U] Ruf unter Gleichgestellten verbesserte sich, neue Unterstützer sind nun überzeugt, dass [target.Custom('DE_PRO_PER_S_3P_N')] würdig ist – und so ist [target.Custom('DE_PRO_POS_S_3P')] Ansehen in der [republic|E] nun eine Stufe gewachsen!"
 scheme_critical_moments.1143.desc_patrician_self: "All die Mühe und die Mittel, die ich in die Kampagne für meine Eigenwerbung steckte, waren einfach nicht genug. Niemand war von mir überzeugt oder ließ sich von meinen Versprechungen – oder Bestechungsgeldern – beeinflussen, sodass meine Stellung unverändert bleibt.\n\nIch werde mir etwas anderes einfallen lassen müssen, um mein [house|E] zu fördern."
 scheme_critical_moments.1143.desc_patrician_other: "$scheme_critical_moments.1143.desc_other$"
