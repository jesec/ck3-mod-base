 steal_trade_post_desc_general: "$steal_trade_post$ ist ein [hostile_scheme|El], das darauf abzielt, einen [trade_post|E] eines rivalisierenden [Concept('patrician', 'Patriziers')|E] an sich zu reißen. Es beruht auf [intrigue|E] und [stewardship|E] und man kann [agents|E] dafür anwerben.\n\nBei einem erfolgreichen Diebstahl geht der Besitz an dem angestrebten $game_concept_trade_post$ vom [scheme_target|E] auf den [scheme_owner|E] über."
 STEAL_TRADE_POST_SUCCESS_DESC: "Der betreffende [trade_post|E] wechselt den Besitzer, und [TARGET_CHARACTER.Custom('DE_PRO_PER_S_3P_N')] wird zu Eurem [Concept('rival', 'Rivalen')|E], wenn [TARGET_CHARACTER.Custom('DE_PRO_PER_S_3P_N')] erfährt, wer dahintersteckt."
