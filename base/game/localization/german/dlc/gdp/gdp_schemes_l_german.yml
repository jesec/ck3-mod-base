 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.8402.desc: "Tief in [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] schaue ich den Magistraten von [target_patron.GetTitledFirstName] zu, wie sie träge die Berge von Unterlagen durchgehen. Jedes zufriedene Stempeln bestätigt die Übertragung weiteren Besitzes des Hauses [target.GetHouse.GetName] an meine Unternehmung ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]).\n\nDer ruhige Flug einer Fliege über ihren Köpfen wird gestört, als [target.GetFirstName] in die Stube stürmt.\n\n#EMP „IHR!“#!, krächzt [target.Custom('DE_PRO_PER_S_3P_N')] giftig. „Wie?! #DIE2 Warum …#!“"
 scheme_critical_moments.8402.a: "Es ist nur ein gutes Geschäft …"
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.8403.desc: "Nach so viel Hin und Her und nach so viel Drängeln gegenüber [target_patron.GetTitledFirstName] konnten wir die letzten Schritte dennoch nicht abschließen, bevor [target.GetTitledFirstName] Wind davon bekam, dass etwas im Gange war …\n\nDieses Unternehmen ([target.GetPrimaryTitle.GetName]) hat sich nun fest eingeigelt und vereitelt damit unsere Fähigkeit, die Schweine vor Gericht auszumanövrieren."
 scheme_critical_moments.8403.discovered: "\n\nUm dem Ganzen noch die Krone aufzusetzen, ist klar, dass [target.GetTitledFirstNameNoTooltip] auch noch weiß, dass wir dahinterstecken …"
 scheme_critical_moments.8403.fallback: "\n\nEin kleiner Silberstreif ist wenigstens, dass [target.GetTitledFirstNameNoTooltip] nicht ahnt, dass wir daran beteiligt waren …"
 scheme_critical_moments.8403.a: "Das passt ja wieder …"
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U] versuchte eine feindliche Übernahme der Gesellschaft von [target.GetShortUIName] durchzuführen, aber scheiterte!"
 scheme_critical_moments.8404.t: "Feindliche Übernahme: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 scheme_critical_moments.8404.desc: "Während wir uns dem täglichen Erbsenzählen für unsere Routen widmeten und im Dreck nach neuen Kunden wühlten, mussten wir heute feststellen, dass wir auf das Falsche geachtet hatten.\n\nEin knappes Schreiben erreichte uns aus [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]: Doch diese Formalität bestätigte die heutigen Gerichtsverhandlungen, die zur Auflösung unserer Gesellschaft und zur #EMP Beschlagnahme#! ihres Vermögens durch eine andere ([owner.GetPrimaryTitle.GetDefinitiveName]) führt!\n\nAls ich dort ankomme, ist es zu spät, wenn man es denn überhaupt hätte verhindern können …\n\nDiese schurkische Kreatur [owner.GetTitledFirstName] grinst mich höhnisch an, während ich verzweifelt die Dokumente überfliege, die alle von [target_patron.GetTitledFirstName], [Select_CString(target_patron.IsFemale, 'meiner Gönnerin', 'meinem Gönner')], bestätigt wurden!"
 scheme_critical_moments.8404.a: "Wie?! #DIE2 Warum …#!"
