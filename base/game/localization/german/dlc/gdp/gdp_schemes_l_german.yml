 hostile_takeover_desc_general: "Die feindliche Übernahme ist ein [hostile_scheme|El], das darauf abzielt, die Besitzungen einer rivalisierenden [Concept('merchant', 'Kaufmanns')|E]-[company|E] an sich zu reißen. Es beruht auf [intrigue|E] und [stewardship|E] und man kann [agents|E] dafür anwerben.\n\nEine erfolgreiche feindliche Übernahme führt zur Zerstörung der [scheme_target|E]-$game_concept_company$ und steigert die [competitiveness|E] des [Concept('scheme_owner', 'Komplottanstifters')|E]."
