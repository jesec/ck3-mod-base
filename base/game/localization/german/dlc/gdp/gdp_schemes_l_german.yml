 attempted_steal_market_insights_opinion: "Versuchte, Markteinblicke zu stehlen"
 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.8502.desc: "Nach und nach zeichnen gestohlene Geschäftsbücher, aufgeschnappte Gerüchte und durch Gefälligkeiten gewonnene Wissenshäppchen ein Bild der vielen Käufer, Verkäufer und anderen Verbindungen einer gewissen Unternehmung ([target.GetPrimaryTitle.GetName]).\n\nEs besteht kein Zweifel, dass es uns diese Erkenntnisse ermöglichen werden, uns im Wettbewerb um begehrte Güter mit [target.GetTitledFirstName] eher auf Augenhöhe zu begegnen."
 scheme_critical_moments.8502.discovered: "\n\nDoch unser Nachbohren ist [target.GetTitledFirstNameNoTooltip] wohl leider nicht entgangen …"
 scheme_critical_moments.8502.a: "Ausgezeichnet!"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U] stahl Markteinblicke der Gesellschaft von [target.GetShortUIName], wurde aber entdeckt!"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.8503.desc: "So viele Wortgefechte mit Krämern und lange Nächte des Flüsterns bei flackerndem Kerzenschein gewährten uns keinen Einblick in die Machenschaften einer gewissen Unternehmung ([target.GetPrimaryTitle.GetName]) …\n\nSelbst die Dokumente, die aus den Stuben von [target.GetTitledFirstName] selbst entwendet wurden, waren bedeutungslose Kritzeleien oder alte Strichlisten."
 scheme_critical_moments.8503.discovered: "\n\nWas die Lage noch schlimmer macht: Es scheint, dass [target.GetTitledFirstNameNoTooltip] auch noch Wind von unserer Intrige bekam."
 scheme_critical_moments.8503.fallback: "\n\nZumindest können wir uns ein wenig damit trösten, dass [target.GetTitledFirstNameNoTooltip] keinen Wind von unserem Komplott bekam."
 scheme_critical_moments.8503.a: "Eine Zeitverschwendung."
 scheme_critical_moments.8503.tt.failed: "[scheme.GetOwner.GetShortUIName|U] versucht Markteinblicke der Gesellschaft von [target.GetShortUIName] zu stehlen, aber scheiterte!"
