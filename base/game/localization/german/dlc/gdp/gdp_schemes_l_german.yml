 steal_market_insights_desc: "Wenn wir ein gewisses Unternehmen ([SCHEME.GetTargetCharacter.GetPrimaryTitle.GetName]) unterwandern, können wir die Erfahrung von [SCHEME.GetTargetCharacter.GetShortUIName] beim Handeln mit bestimmten Waren ausnutzen."
 steal_market_insights_action: "Expertise stehlen von"
 steal_market_insights_desc_general: "$steal_market_insights$ ist ein [hostile_scheme|El], das darauf abzielt, die [expertise|E] einer rivalisierenden [Concept('merchant', 'Kaufmanns')|E]-[company|E] an sich zu reißen. Es beruht auf [intrigue|E] und [stewardship|E] und man kann [agents|E] dafür anwerben.\n\nEin erfolgreiches Stehlen von Markteinblicken führt dazu, dass die [company|E] [scheme_owner_possessive|E] $game_concept_expertise$ in allen [trade_categories|E] erlangt, in denen die $game_concept_company$ [scheme_target_possessive|E] eine höhere $game_concept_expertise$ hat."
 steal_market_insights_invalidated_title: "@scheme_icon! „$steal_market_insights$“-Komplott endet"
 start_steal_market_insights_notification: "$steal_market_insights$"
 steal_market_insights_rival_progress_tt: "Wenn Ihr entdeckt werden, bewegt Ihr Euch auf eine @rival_icon![rivalry|E] mit [recipient.GetShortUIName] hin und schadet der [actor.GetHouse.GetName]-[recipient.GetHouse.GetName]-[house_relation|E]"
 STEAL_MARKET_INSIGHTS_SUCCESS_DESC: "Die [company|E] von [CHARACTER.GetShortUIName] erhält #V 5#! [expertise_levels|E] in jeder [trade_category_short|E] mit einer niedrigeren Stufe als die $game_concept_company$ von [TARGET_CHARACTER.GetShortUIName]"
