 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "Ich verspüre beinahe Mitleid mit der Familie [target.GetHouse.GetName]. So entgegenkommend – ja, sogar #EMP begeistert#! – waren ihre Bediensteten und vermeintlichen Verbündeten dabei, meinen Agenten ihre bestürzendsten Geheimnisse preiszugeben. #EMP Beinahe#!.\n\nDer Beweis in meinen Händen ist unbestreitbar: [secret_holder.GetTitledFirstName|U] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')|l]!"
 gdp_patrician_find_secrets.0002.a: "[secret_holder.Custom('DE_PRO_POS_S_3P')|U] guter Ruf ist in meinen Händen."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "Meine Agenten durchforsteten die weggeworfenen Papiere der Familie [target.GetHouse.GetName], setzten ihre Bediensteten unter Druck und durchleuchteten die Geldbeutel aller Klatschmäuler auf dem Markt – und fanden trotzdem nichts von Wert.\n\nWelche Geheimnisse [target.GetTitledFirstName] auch immer hinter [target.Custom('DE_PRO_POS_S_3P')]en Türen verbirgt: Sie sind entweder zu tief vergraben, um sie zu entdecken, oder sie existieren erst gar nicht."
 gdp_patrician_find_secrets.0003.desc.outmatched: "Meine Agenten verfolgten jeden Schritt der Familie [target.GetHouse.GetName], konnten aber nicht einmal den geringsten Hauch ihrer Geheimnisse aufspüren. Ihre Türen sind fester verschlossen als der Geldbeutel eines Geizhalses, und ihre Bediensteten hüten ihre Zungen so sorgfältig, als hätten sie gar keine.\n\nWelche verwerflichen Taten [target.GetTitledFirstName] auch begangen haben mag: Wir wissen nicht mehr darüber als zu Beginn."
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]! Es war alles umsonst."
