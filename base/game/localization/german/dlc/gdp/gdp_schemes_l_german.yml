 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.8602.desc: "Die Magistrate von [trade_post_county.GetName] haben einen Preis – und der fällt bescheiden aus. Siegel für Siegel geht die Pacht in [trade_post_province.GetName] auf uns über.\n\nNoch ehe [target.GetTitledFirstName] davon erfährt, entlassen unsere Verwalter bereits [target.Custom('DE_PRO_POS_S_3P')]e Diener und übermalen [target.Custom('DE_PRO_POS_S_3P')]e Farben über der Tür."
 scheme_critical_moments.8602.a: "Eine edle Adresse, und nun ist sie unsere."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.8603.desc: "Jede Bestechung wurde angenommen und jedes Versprechen gebrochen. Die Magistrate von [trade_post_county.GetName] steckten mein Geld ein, ohne meinen Besitzanspruch auch nur anzuerkennen.\n\n[target.GetTitledFirstName|U] behält weiterhin die unerschütterliche Kontrolle über diesen Ort."
 scheme_critical_moments.8603.discovered: "\n\nSchlimmer noch: [target.GetTitledFirstNameNoTooltip] weiß ganz genau, wessen Hand nach [target.Custom('DE_PRO_POS_S_3P')]er Geldbörse griff …"
 scheme_critical_moments.8603.fallback: "\n\nZumindest bleibt unsere Rolle in dieser Angelegenheit ein Geheimnis."
 scheme_critical_moments.8603.a: "Geld, das an treulose Männer verschwendet wurde."
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U] versuchte, Euren [trade_post|E] in [trade_post_province.GetNameNoTooltip] zu erobern, ist dabei aber gescheitert!"
 scheme_critical_moments.8604.t: "Handelsposten eingenommen: [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "Ein Reiter bringt Euch Neuigkeiten aus [trade_post_county.GetName]: Unser Verwalter wurde auf die Straße geworfen, und die örtlichen Magistrate erklärten mich für unerwünscht und ernannten zugleich jemand anderen zum Besitzer des Handelspostens in [trade_post_province.GetName].\n\nJahre des Handels, der Lagerhaltung und unser hart erarbeiteter guter Ruf – einfach weggegeben von Leuten, die wir bereits bezahlt hatten."
 scheme_critical_moments.8604.discovered: "\n\nUnd nun steht [owner.GetTitledFirstName] an meiner Stelle, als hätte [owner.Custom('DE_PRO_PER_S_3P_N')] nie etwas anderes gekannt. Das werden wir #EMP nicht#! vergessen!"
 scheme_critical_moments.8604.a: "Wir wurden aus unserer eigenen Haustür hinausgeworfen!"
