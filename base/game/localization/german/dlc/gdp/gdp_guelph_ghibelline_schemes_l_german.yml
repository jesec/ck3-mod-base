l_german:
 #Side Switch Scheme
 gg_switch_sides: "Zum Überlaufen verleiten"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip|U] wird schon bald verstehen, was die #EMP richtige#! Ausrichtung in dieser Lage ist …"
 gg_switch_sides_desc_general: "Das [scheme|E] „$gg_switch_sides$” ist ein [political_scheme|E], das darauf abzielt, das [scheme_target|E] davon zu überzeugen, die Seite in der [situation|E] „[guelph_ghibelline_situation|E]“ zu wechseln"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] schließt sich den [CHARACTER.Custom('GetGuelphsGhibellinesConcept')] an"
 gg_switch_sides_invalidated_title: "@scheme_icon! „$gg_switch_sides$“-Komplott endet"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (Komplott)#!"
 gg_switch_sides_action: "Verleiten"
 scheme_interaction_tt_gg_switch_sides: "Versuchen, [recipient.GetShortUINameNoTooltip] zum Beitritt zu den [actor.Custom('GetGuelphsGhibellinesConcept')] zu verleiten"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip|U] ist immer noch verärgert wegen des letzten Mals, als Ihr [recipient.Custom('DE_PRO_PER_S_3P_A')] batet, den [actor.Custom('GetGuelphsGhibellinesConcept')] beizutreten"
 #Claim Leadership Scheme
 gg_claim_leadership: "Führung beanspruchen"
 gg_claim_leadership_desc: "Die [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')] werden schon bald verstehen, wer sich am besten als Anführer eignet"
 gg_claim_leadership_desc_general: "Das [scheme|E] „$gg_claim_leadership$” ist ein [political_scheme|E], das darauf abzielt, den [scheme_owner|E] zum Anführer der eigenen Seite in der [situation|E] „[guelph_ghibelline_situation|E]“ zu machen. Es ist ein [secret_scheme|E], beruhend auf [diplomacy|E], und man kann [agents|E] rekrutieren.\n\nJe mehr [gg_involvement|E] der [scheme_owner|E] im Vergleich zum derzeitigen Anführer besitzt, desto höher ist die [scheme_success_chance|E]. Eine höhere [prestige_level|E] als der Anführer zu haben, hilft ebenfalls."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U] wird neues Oberhaupt der [CHARACTER.Custom('GetGuelphsGhibellinesConcept')]"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "Ihr vermeidet es, [prestige|E] zu verlieren und die Beziehung zu [TARGET_CHARACTER.GetShortUIName] zu verschlechtern"
 gg_claim_leadership_invalidated_title: "@scheme_icon! „$gg_claim_leadership$“-Komplott endet"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (Komplott)#!"
 gg_claim_leadership_action: "Führung beanspruchen von"
 scheme_interaction_tt_gg_claim_leadership: "Versuchen, die [recipient.Custom('GetGuelphsGhibellinesConcept')]-Führung von [recipient.GetShortUIName] zu übernehmen"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "Unentschiedene ausrichten"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip|U] wird genötigt, mit den [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')] zu sympathisieren"
 gg_align_undecided_desc_general: "Das [scheme|E] „ $gg_align_undecided$” ist ein [political_scheme|E], das darauf abzielt, das [scheme_target|E] dazu zu bringen, sich der Seite des [Concept('scheme_owner', 'Komplottanstifters')|E] in der [situation|E] „[guelph_ghibelline_situation|E]“ anzuschließen"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] wird ein [CHARACTER.Custom('GetGuelphGhibellineConcept')]"
 gg_align_undecided_invalidated_title: "@scheme_icon! „$gg_align_undecided$“-Komplott endet"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (Komplott)#!"
 gg_align_undecided_action: "Ausrichten"
 scheme_interaction_tt_gg_align_undecided: "Versuchen, [recipient.GetShortUIName] nach den [actor.Custom('GetGuelphsGhibellinesConcept')] auszurichten"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "Herrscher ersetzen"
 gg_replace_ruler_desc: "Die Dienste von [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] werden nicht mehr benötigt: [scheme.GetTargetCharacter.Custom('DE_PRO_PER_S_3P_N')|U] sollte durch jemand #EMP Vernünftigeres#! ersetzt werden."
 gg_replace_ruler_desc_general: "Das [scheme|E] „$gg_replace_ruler$” ist ein [political_scheme|E], das darauf abzielt, das [scheme_target|E] mit einem Herrscher zu ersetzen, der der Seite des [Concept('scheme_owner', 'Komplottanstifters')|E] in der [situation|E] „[guelph_ghibelline_situation|E]“ treu ergeben ist"
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] wird durch einen [CHARACTER.Custom('GetGuelphsGhibellinesConcept')]-Loyalisten ersetzt"
 GG_REPLACE_RULER_DISCOVERY_DESC: "Ihr vermeidet es, [prestige|E] zu verlieren und die Beziehung zu [TARGET_CHARACTER.GetShortUIName] zu verschlechtern"
 gg_replace_ruler_invalidated_title: "@scheme_icon! „$gg_replace_ruler$“-Komplott endet"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (Komplott)#!"
 gg_replace_ruler_action: "Ersetzen"
 scheme_interaction_tt_gg_replace_ruler: "Versuchen, [recipient.GetShortUIName] mit einem [actor.Custom('GetGuelphsGhibellinesConcept')]-Loyalisten zu ersetzen"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip|U] ist immer noch seit dem letzten Mal alarmiert, als Ihr versuchtet, [recipient.Custom('DE_PRO_PER_S_3P_A')] zu ersetzen"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "Kann während der [situation_phase_phase|E] [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] keinen Anführer von Guelfen oder Ghibellinen ersetzen"
 #Invalidation
 scheme_gg_situation_ended: "Die [guelph_ghibelline_situation|E] endet"
 scheme_owner_not_aligned: "Ihr seid kein [guelph|E] oder [ghibelline|E] mehr"
 scheme_target_not_aligned: "[target.GetShortUIName] ist kein [guelph|E] oder [ghibelline|E] mehr"
 scheme_target_not_undecided: "[target.GetShortUIName|U] ist nicht länger [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('undecided').GetName]"
 scheme_owner_not_in_gg_situation: "Ihr seid nicht länger Teil der [situation|E]: [GetSituation('guelph_ghibelline').GetName]"
 scheme_target_not_in_gg_situation: "[target.GetShortUIName] ist nicht länger Teil der [situation|E]: [GetSituation('guelph_ghibelline').GetName]"
 scheme_target_already_your_side: "[target.GetShortUIName|U] ist bereits [target.Custom('GetGuelphGhibellineConcept')]"
 scheme_target_is_titleless: "[target.GetShortUIName|U] hält keine Titel mehr"
 scheme_target_might_get_displaced: "[target.GetShortUIName|U] ist Hauptverteidiger in einem „[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]“-[war|E]"
 scheme_target_might_get_reinstated: "[target.GetShortUIName] ist Hauptverteidiger in einem „[GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|V]“-[war|E]"
 scheme_owner_is_already_leader: "Ihr seid bereits Oberhaupt der [owner.Custom('GetGuelphsGhibellinesConcept')]"
 scheme_target_no_longer_gg_leader: "[target.GetShortUIName] führt nicht mehr die [owner.Custom('GetGuelphsGhibellinesConcept')] an"
