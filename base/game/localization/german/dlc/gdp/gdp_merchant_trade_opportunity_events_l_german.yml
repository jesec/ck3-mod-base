l_german:
 gdp_merchant_trade_opportunity.0001.t: "Wettbewerber-Herausforderung: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "Die Anwesenheit eines anderen Unternehmens ([task_contract_target.GetPrimaryTitle.GetName]) ist ein ständiger Dorn in unserem Fleisch. Es beschädigt unsere Aussichten und Gewinne und das nirgendwo mehr als auf einem ganz bestimmten Markt ([local_market.GetShortName]).\n\nMit diesen Störern muss aufgeräumt werden und es muss ihnen, mit welchen Mitteln auch immer, aufgezeigt werden, dass wir die rechtmäßigen Herren über diese einheimischen Märkte sind."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "Nach vielen Tagen und Nächten, in denen wir die örtlichen Höker mit Fragen bestürmten und alles in Erfahrung brachten, was es über die Märkte von [trade_market.GetShortName] zu wissen gibt, fanden wir die Schwäche unserer Gegenspieler ([target_title.GetName]).\n\nMit den Mitteln, ihre örtlichen Beziehungen zu untergraben und in wichtigen Bereichen ihre Preise zu unterbieten und höhere Gebote abzugeben, können wir schon bald dafür sorgen, dass ihre Profite zusammen mit ihrem Ruf verkümmern!"
 gdp_merchant_trade_opportunity.0002.a: "Lehren wir sie, sich von unserem Gebiet fernzuhalten."
 gdp_merchant_trade_opportunity.0002.b: "Wenn wir unsere Karten offenlegen, verdienen wir uns ihren Respekt."
 gdp_merchant_trade_opportunity.0002.b.tt: "Ihr müsst ein [friend|E] oder [spouse|E] sein oder wenigstens [SCOPE.ScriptValue('high_skill_rating')|V0] [diplomacy|E] besitzen und keine negative [relation|E] oder eine [house_feuding|E] haben"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "Unsere Bemühungen, die Netzwerke in Sachen [target_title.GetName] in [trade_market.GetShortName] und darüber hinaus zu kartieren, waren von wenig Erfolg gekrönt. Es scheint, als hätten wir sogar unseren Ruf auf dem Handelsplatz ([task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')]) beschädigt.\n\nUnsere ungeschickten Bemühungen führten nur dazu, dass sich die Position von Haus [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] verbesserte, ohne dass sich auch nur die kleinste Schwachstelle in den langen Ketten seiner Handelsrouten finden ließ …"
 gdp_merchant_trade_opportunity.0003.a: "Bei den Mächten des Wohlstands ([ROOT.Char.GetFaith.WealthGodName])! Das wird unsere Gewinne auffressen!"
 gdp_merchant_trade_opportunity.0011.t: "Warenförderung: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "Die geschäftigen [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')] von [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] zeichnen sich durch einen heftigen Wettbewerb zwischen den Hökern und den Kaufleuten aus, die hier alle möglichen Arten von Waren feilbieten.\n\nIch stehe inmitten des Getöses und werde von dem steten Fluss von Vorbeieilenden hin und her geschoben, und es schießt mir die Frage durch den Kopf, wie unsere Waren aus der Menge herausstechen können, damit sie den Kunden und Ladenbesitzern gleichermaßen ins Auge fallen …"
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "Unsere Versuche, die Verkäufe in Sachen [trade_good_type.GetNameNoTooltip] in [target_title.GetBaseNameNoTierNoTooltip] voranzutreiben, scheinen gefruchtet zu haben: Viele suchen gezielt nach unseren „hervorragenden“ Erzeugnissen, und die Verkaufszahlen in der Region steigen stetig an.\n\nOffenbar lockerten unser Drängen und unsere Anpreisungen genau die richtigen Geldbeutel!"
 gdp_merchant_trade_opportunity.0012.a: "Wir werden diese Gelegenheit nicht verstreichen lassen."
 gdp_merchant_trade_opportunity.0012.b: "Ich kann sie schon riechen: [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]!"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "Es wird deutlich, dass unsere Bemühungen, mit zugegebenermaßen etwas ausgeschmückten Beschreibungen der Güte unserer Waren Kunden anzuwerben, nicht die erwünschte Wirkung zeigten …\n\nDie Verkaufszahlen fallen und die Nachfrage in Sachen [trade_good_type.GetNameNoTooltip] in ganz [target_title.GetBaseNameNoTierNoTooltip] scheint abzuebben, während das Vertrauen der Käufer zurückgeht."
 gdp_merchant_trade_opportunity.0013.a: "Aber diese Waren ([trade_good_type.GetNameNoTooltip]) #EMP sind#! die besten!"
 gdp_merchant_trade_opportunity.0021.t: "Investitionsanregung: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "Wenn man durch [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] wandert, fallen einem die vielen Mängel der Infrastruktur auf, von der Qualität der Straßen über die dürftigen Lagerhäuser bis hin zum Handelsplatz ([task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')]) an sich.\n\nDen örtlichen Herrschern muss gezeigt werden, dass kleine Investitionen bereits einen Vorteil bringen. Andernfalls müssen wir das selbst erledigen, wenn wir unsere Beziehungen hierher bestmöglich ausnutzen möchten …"
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "Dadurch, dass wir geschickt die Mängel der [target_title.GetAdjectiveNoTooltip|l]en Infrastruktur aufzeigten und danach auf die Vorteile verwiesen, die sich durch eine Verbesserung erzielen ließen, gewannen wir die Aufmerksamkeit der richtigen Leute.\n\nDie Saat muss noch Früchte tragen, doch es scheint, als sei [local_ruler.GetTitledFirstName] überzeugt worden und die Arbeiten würden beginnen. Da der Handelsstrom langsam zunimmt, beglückwünschen uns die örtlichen Händler und die Stadtbewohner bereits zaghaft."
 gdp_merchant_trade_opportunity.0022.a: "Wenn Ihr wollt, dass etwas erledigt wird, dann erledigt es selbst."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "Unsere Versuche, die Leute hier von den unzähligen Mängeln der [target_title.GetAdjectiveNoTooltip|l]en Infrastruktur zu überzeugen, erzielten erschreckend wenig Erfolg, und es scheint unwahrscheinlich, dass diese Narren uns erneut zuhören werden.\n\nEin Fehler nach dem anderen wird die Dinge wieder dahin verkehren, wie wir sie vorfanden, und verwirrte einheimische Beamte und Händler als Ergebnis unserer Mühen hinterlassen, es sei denn, wir nehmen die Sache selbst in die Hand …"
 gdp_merchant_trade_opportunity.0023.a: "Der Handel muss florieren. Auf die eine oder auf die andere Weise."
 gdp_merchant_trade_opportunity.0023.b: "Die Einheimischen sind Narren …"
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "Die [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] von [local_market.GetShortName] tragen deutliche Narben des geschäftlichen Misserfolgs: Die verbarrikadierten und verlassenen Läden zeugen vom versiegenden Handelsfluss nach dem Auszug der Händler in diesen schwierigen Zeiten.\n\nDennoch muss man hier lernen, dass Händeringen und Flucht dem Handel wenig nutzen und dass Frieden niemals garantiert ist. Es ist an uns, Ordnung in die Sache zu bringen und die leeren Kassen zu füllen."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0032.desc: "Die Einwohner von [target_title.GetBaseNameNoTierNoTooltip], die hinter ihren Fensterläden hervorlugten, verstanden unser Ansinnen rasch, und wir konnten zügig einen festen Griff um den Markt und die Horte erlangen.\n\nJene, die das Nachsehen bei dieser Umgestaltung hatten, sahen sich gezwungen, widerwillig die Vorteile dieser neuen Ordnung und der Wiederbelebung des Handels zu akzeptieren."
 gdp_merchant_trade_opportunity.0032.a: "Es ist nur ein gutes Geschäft …"
 gdp_merchant_trade_opportunity.0032.b: "Unsere Arbeit hier ist erledigt."
 every_county_province_custom: "Jedes unlängst geplünderte [holding|E] in [saved_county.GetName]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0033.desc: "Unserer allzu deutlich sichtbaren Anwesenheit in [target_title.GetBaseNameNoTierNoTooltip] und den Versuchen, die Einwohner in unserem Sinne zu Änderungen anzustoßen, begegnete man mit großer Feindseligkeit und einer sturen Verweigerung jedweder Zusammenarbeit.\n\nDie Bevölkerung und die einheimischen Händler verbündeten sich gegen uns und betrachten die Zumutung unserer Dominanz als einen zu hohen Preis, der für die Wiederherstellung der Ordnung und des Handels zu zahlen wäre!"
 gdp_merchant_trade_opportunity.0033.a: "Sture Narren!"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "Die [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] von [local_market.GetShortName] beherbergen eine Unmenge an Kunsthandwerkergruppen, deren streng überwachte Zahl von Seilen bis Silberwaren alles herstellt, was die Einheimischen und andere Kunden brauchen.\n\nMit den richtigen Anweisungen könnten wir Zugang zu diesen Netzen fähiger Handwerker erlangen und uns hier einen Ruf als Gönner aufbauen – und vielleicht ein paar gewinnträchtige Vorgehensweisen oder Entwicklungen kennenlernen."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0042.desc: "Unser Geld brachte hier in [target_title.GetBaseNameNoTierNoTooltip] fruchtbare Verbindungen hervor: Wir unterstützten talentierte Handwerker aller Arten finanziell, die still und leise an bescheidenen wie auch wunderbaren Gegenständen arbeiten.\n\nDa wir als Gönner bekannt sind, sind wir in allen Bereichen herzlich willkommen und genießen die Aufmerksamheit von [inspired_artisan.GetFirstName], [Select_CString(inspired_artisan.IsFemale, 'einer einheimischen Künstlerin, die', 'eines einheimischen Künstlers, der')] gerade in aller Munde ist und finanzielle Unterstützung für die Schaffung [inspired_artisan.Custom('DE_PRO_POS_S_3P')]er Kunst ([inspired_artisan.Custom('InspirationArtisanType')]) benötigt."
 gdp_merchant_trade_opportunity.0042.a: "Unsere Investitionen haben ihren Zweck erfüllt."
 gdp_merchant_trade_opportunity.0042.b: "Wir können diese Gelegenheit nicht verstreichen lassen!"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0043.desc: "Unsere Bemühungen, Zugang zu den Netzwerken der einheimischen [target_title.GetBaseNameNoTierNoTooltip|l]en Künstler zu erlangen, wurden jedes Mal zurückgewiesen. Man akzeptierte unser Geld und unser Interesse widerwillig, aber mit wenig Dankbarkeit.\n\nHat unser Ruf durch ein Missverständnis gelitten? Durch die Manipulation von Rivalen oder einfach deshalb, weil wir die Unverfrorenheit besitzen, unsere Nasen in ihre Angelegenheiten zu stecken? Wir werden es wohl nie erfahren …"
 gdp_merchant_trade_opportunity.0043.a: "Pah! Ihre Waren waren ohnehin Müll …"
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "Die [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')] von [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] zeigen in jedem Blick und in jeder Geste eine Gier nach Geld. Dieser Ort verlangt nach unseren Münzen und zieht künftige Kunden an, die zu machtlos sind, um den Verheißungen zu widerstehen.\n\nEs ist viel einfacher, Leute zu finden, die [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] nehmen, als solche, die sie geben, doch wir müssen anspruchsvoll sein. Wir werfen unsere Köder für die Mächtigen und Angesehenen von [local_market.GetShortName] aus, denn ein angemessener Fang erfordert List und Geduld."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0052.desc: "Nachdem wir in [target_title.GetBaseNameNoTierNoTooltip] die Kunde gestreut hatten, dass wir zu finanzieller Hilfe bereit sind, dauerte es nicht lange und wir erhielten eine merkwürdig demütige Einladung von niemand Geringerem als [debtor.GetTitledFirstName].\n\nEs scheint, als benötige [Select_CString(debtor.IsFemale, 'die gute Frau', 'der gute Mann')] etwas „Flexibilität“ in [debtor.Custom('DE_PRO_POS_S_3P')]en Konten. Nichts sollte einfachen Kaufleuten ferner liegen, als die Mittel einer derart angesehenen Person infrage zu stellen …"
 gdp_merchant_trade_opportunity.0052.a: "„Lasst uns die Hauptbücher hier anpassen … #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip|U] von [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] …#!“"
 gdp_merchant_trade_opportunity.0052.b: "„Ich befürchte, dieses Mal wird das nicht möglich sein, mein[debtor.Custom('DE_END_PRO_S_N')] [debtor.GetLadyLord].“"
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0053.desc: "Obwohl wir die Kunde streuten, dass wir zu finanzieller Hilfe bereit sind, haben wir wenig dafür vorzuweisen. Unsere großzügigen Angebote wurden von den einheimischen Würdenträgern von [target_title.GetBaseNameNoTierNoTooltip] rundweg abgelehnt.\n\nOb wir nun unsere Geschäfte schlecht führten, die Geschäfte eines anderen Kaufmanns sich abträglich auf unsere auswirkten oder die Mächtigen dieser Gegend derzeit einen seltenen, aber umfassenden Wohlstand genießen, lässt sich kaum sagen."
 gdp_merchant_trade_opportunity.0053.a: "Es spielt keine Rolle. Die kommen schon wieder angekrochen. Das machen sie immer …"
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "Mein[contract_employer.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] kommt mit spannenden Neuigkeiten: [market_owner.GetName|U] benötigt Waren ([trade_good_type.GetNameNoTooltip]) und sucht nach einem Kaufmann, damit [market_owner.Custom('DE_PRO_PER_S_3P_N')] mit einer großen Lieferung versorgt wird.\n\n[Select_CString(task_contract_target.IsFemale, 'Die', 'Der')] prahlerische [task_contract_target.GetTitledFirstName] von der [task_contract_target.GetHouse.GetBaseName]-Gesellschaft verkündete stolz, dass [task_contract_target.Custom('DE_PRO_PER_S_3P_N')] zweifelsohne erfolgreich dabei sein werde, dieses Geschäft abzuschließen. Mit Schläue und List, so denke ich, könnten wir sie überbieten und uns an ihre Stelle setzen."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0062.desc: "Unsere heimlichen Versuche, den Handel von [target_title.GetName] zu durchkreuzen, hatten in unserem Sinne Erfolg. Als der Tag des Bieterkampfes kam, konnte [target_title.GetHolder.GetTitledFirstName] nur noch bestürzt zuschauen, wie stattdessen wir den Sieg beanspruchten.\n\nDer Ruf von [target_title.GetNameNoTooltip] ist seitdem schwer beschädigt, und wir wären gut beraten, wenn wir dieses Machtvakuum zu unserem Vorteil nutzen würden."
 gdp_merchant_trade_opportunity.0062.a: "Alles verläuft nach Plan …"
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0063.desc: "Trotz unserer Versuche, zur List zu greifen, übertrumpfte uns [target_title.GetHolder.GetTitledFirstName] einmal mehr. Schändlicherweise müssen wir eine deutliche Niederlage gegenüber [target_title.GetNameNoTier] einräumen.\n\nWir werden vielleicht niemals den Grund für unseren Fehler feststellen: Stand uns unser Stolz im Weg oder war es womöglich der Mangel an finanziellem Geschick? Für den Moment wissen wir nur, dass wir krachend verloren haben und nun mit leeren Taschen dastehen."
 gdp_merchant_trade_opportunity.0063.a: "Nächstes Mal kriegen wir sie …"
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "Mein[contract_employer.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] überprüft eine Ladung in Sachen [trade_good_type.Custom('GetTradeGood')] und beugt sich auf der Suche nach jedem noch so kleinen Makel durch falschen Umgang tief über die Waren ([trade_good_type.Custom('GetTradeGoodUnitPlural')]) und prüft dabei jede einzelne Befestigung.\n\nFracht wird nicht immer bestmöglich behandelt und kann durch Vernachlässigung oder Fahrlässigkeit Schaden nehmen. Vom Hausierer bis zum Großhändler: Man kann von jedem viel lernen."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0072.desc: "Während wir so zwischen den [destination.Custom('GetProvinceAdjective')|l]en Ständen auf dem geschäftigen Handesplatz ([destination.Custom('GetRegionalMarketTermGloss')]) von [destination.GetTitle.GetNameNoTierNoTooltip] und in den leisen Hallen umhergehen, schnappen wir viele Anekdoten, Geschichten und Ratschläge zu der Kunst des Geschäftemachens in Sachen [trade_good_type.Custom('GetTradeGood')] auf.\n\nVon der Lagerung und Beföderung der Warenheinheiten ([trade_good_type.Custom('GetTradeGoodUnitPlural')]) bis hin zu saisonaler Nachfrage und Gütebeurteilung wird das, was wir lernen, unserem Handel hier ([local_market.GetName]) und auch jenseits davon von Nutzen sein."
 gdp_merchant_trade_opportunity.0072.a: "Wer hätte gedacht, dass [trade_good_type.Custom('GetTradeGood')] als Ware derart vielschichtig ist?"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0073.desc: "Wir verbringen endlose Tage und unzählige Stunden zwischen den [destination.Custom('GetProvinceAdjective')|l]en Ständen auf dem geschäftigen Handelsplatz ([destination.Custom('GetRegionalMarketTermGloss')]) von [destination.GetTitle.GetNameNoTierNoTooltip] und in den leisen Hallen, aber werden nicht klüger, wenn es um die Kunst des Geschäftemachens in Sachen [trade_good_type.Custom('GetTradeGood')] geht.\n\nDie schweigsamen Hausierer und die abweisenden Händler antworten auf unsere Fragen mit kaum mehr als amüsierter Geringschätzung oder vorsichtigem Schweigen, und das wenige, was man mit uns teilt, ist banal oder unnötig verworren."
 gdp_merchant_trade_opportunity.0073.a: "Pah! Wir brauchen ihre Hilfe nicht!"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip|U]"
 gdp_merchant_trade_opportunity.0081.desc: "Mein[contract_employer.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] verdreht die Augen, als wir die neuesten Heldentaten einer gewissen Unternehmung ([contract_target.GetPrimaryTitle.GetDefinitiveName]) hier ([market.GetName]) beklagen.\n\nEs muss etwas wegen [contract_target.GetTitledFirstName] und [contract_target.Custom('DE_PRO_POS_S_3P')]er Unterstützung durch [contract_target.GetSuzerain.GetTitledFirstName] geschehen, wenn wir nicht abgehängt werden wollen …"
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0082.desc: "Unsere unermüdlichen Versuche, Vermittler zu umgarnen und eine gewisse Unternehmung ([target_title.GetDefinitiveName]) und ihre vermaledeite Charta in Misskredit zu bringen, scheinen Früchte zu tragen, denn viele denken nun zweimal nach, bevor sie den Worten von [target_title.GetHolder.GetTitledFirstName] ohne Weiteres Glauben schenken.\n\nSogar die Wahrhaftigkeit des Siegels von [target_title.GetHolder.GetSuzerain.GetTitledFirstName] auf Papieren von [target_title.GetHolder.GetTitledFirstNameNoTooltip] wurde infragegestellt, was gewiss keine Seite glücklich aufnimmt."
 gdp_merchant_trade_opportunity.0082.a: "Ins Jenseits ([ROOT.Char.GetRite.NegativeAfterLife]) mit ihren Papieren!"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0083.desc: "Unermüdlich knüpften wir Verbindungen und schmiedeten Komplotte gegen die verfluchten Agenten einer gewissen Unternehmung ([target_title.GetDefinitiveName]), doch es war alles umsonst: Nur wenige sind bereit, unsere Vorschläge angesichts einer mit dem Siegel von [target_title.GetHolder.GetSuzerain.GetTitledFirstName] versehenen Urkunde überhaupt in Betracht zu ziehen.\n\nDer Ruf von [target_title.GetHolder.GetTitledFirstName] bleibt so unbefleckt wie eh und je, und wir entehrten nur unseren eigenen Namen, indem wir so tief sanken …"
 gdp_merchant_trade_opportunity.0083.a: "Die höchste Macht ([target_title.GetHolder.GetRite.FateGodName]) lächelt immer noch auf die [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] nieder …"
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip|U]"
 gdp_merchant_trade_opportunity.0091.desc: "Als mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] und ich bei grauem Himmel durch den Handelsplatz ([destination.Custom('GetRegionalMarketTermGloss')]) gehen, wird der schlechte Zustand von [destination.GetBaronyNameExplicitlyNoTooltip] deutlich, der durch die Tücken von Krieg und Hungersnot über das Land kam.\n\nEine besorgniserregende Anzahl an Bettlern, ob nun verwitwet, verwaist oder verkrüppelt, bevölkert die Gassen, und Unheil hängt über den verlassenen Ständen wie eine zweite Wolkendecke."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0092.desc: "Als wir durch die Gassen gehen, stoßen wir auf einheimische Hausierer und Händler, die noch Geschäfte machen, trotz "
 gdp_merchant_trade_opportunity.0092.war: "der Verwüstungen des Krieges,"
 gdp_merchant_trade_opportunity.0092.disaster: "des drohenden Unglücks,"
 gdp_merchant_trade_opportunity.0092.epidemic: "des kürzlichen Krankheitsausbruchs,"
 gdp_merchant_trade_opportunity.0092.closing: "und sie konnten sogar wieder etwas Bewegung in ihre Hauptbücher bringen. Jedes noch so kleine Bemühen hilft.\n\nTag für Tag erklingen mehr Stimmen auf dem Handelsplatz ([destination.Custom('GetRegionalMarketTermGloss')]) von [destination.GetBaronyNameExplicitlyNoTooltip], die Stände bieten ein wenig mehr Waren an und die Schenken sind mit einer kleinen Handvoll weiterer Besucher gefüllt."
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip|U] wird schon bald wieder gedeihen."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0093.desc: "Wir sind überall in [destination.GetBaronyNameExplicitlyNoTooltip] auf der Suche nach Gelegenheiten umhergereist, jemandem Geld zu geben, der Gutes bewirken kann, um so das Lebenselixier des Handels in dieser Gegend wiederzubeleben – doch es war vergeblich.\n\nJene, die wir fanden, waren einfach nur Gewinnler, die unserer Großzügigkeit nicht würdig sind oder sich in einer Position befinden, aus der heraus sie nichts Zuträgliches bewirken können. Es fällt schwer angesichts unserer Rückschläge zuversichtlich zu bleiben, und wir sind zunehmend verzweifelt und verdrossen."
 gdp_merchant_trade_opportunity.0093.a: "Es gibt nichts mehr, was wir noh tun können …"
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] und ich stehen ehrfürchtig da und beobachten die geschäftigen Stände auf dem großen Handelsplatz ([destination.Custom('GetRegionalMarketTermGloss')]) von [destination.GetTitle.GetName]. Hier ist der Handelsstrom keine abstrakte Sache: Er ist so greifbar wie der Boden unter unseren Füßen.\n\nWie könnten wir an solch einem Ort, der von Händlern wimmelt, welche wie wir Geschäfte abschließen wollen, daran scheitern, Vorteile oder Gunst zu erlangen?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0102.desc: "Die letzten Wochen verbrachten wir in ständiger Bewegung und eilten jeden Tag durch [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] auf der Suche nach Treffen und Kontakten, doch durch kluge Diplomatie und noch klügere Geschäfte erschufen wir ein ordentliches Vertragswerk mit einheimischen Zwischenhändlern und Mittelsmännern.\n\nEs ist ersichtlich, dass unsere Bemühungen nicht umsonst waren und dass unsere Arbeit hier in der kommenden Saison für uns von großem Nutzen sein wird."
 gdp_merchant_trade_opportunity.0102.a: "Möge unsere Saat Früchte tragen!"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0103.desc: "Trotz all unserer Versuche, uns bei den einheimischen Zwischenhändlern und Mittelsmännern einzuschmeicheln, und obwohl wir ganz [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] jeden Tag auf der Suche nach Treffen und Kontakten durchquerten, stehen wir nicht besser als zu Beginn da.\n\nDies verheißt sicherlich einige Schwierigkeiten für die anstehende Saison …"
 gdp_merchant_trade_opportunity.0103.a: "Bei der höchsten Macht ([ROOT.Char.GetRite.WealthGodName]) …"
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0112.desc: "Wir arbeiteten fleißig und warfen unser Netz über die ganze Stadt [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] aus, auf der Suche nach Gelegenheiten, jemandem einen Gefallen zu gewähren oder jemanden zu bestechen. Im entscheidenden Augenblick wurden unsere Hoffnungen schließlich durch ein paar günstige Auktionen und Vereinbarungen bestätigt und die Unversehrtheit der Routen gesichert.\n\nWir können uns nun friedlich zurücklehnen, in dem sicheren Wissen, dass unsere Arbeit einen steten Strom an Waren garantierte – und dies durchaus für einige Zeit."
 gdp_merchant_trade_opportunity.0112.a: "Die wohlhabenden Mächte ([ROOT.Char.GetRite.WealthGodName]) sind uns hold!"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0113.desc: "Unsere ganze fleißige Arbeit, ein Netz über die Stadt [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] zu spannen, auf der Suche nach Gelegenheiten, jemandem einen Gefallen zu gewähren oder jemanden zu bestechen, war vergebens und verschwand wie ein Regentropfen in diesem aufgewühlten Handelsozean.\n\nEs ist ersichtlich, dass wir keine Möglichkeit haben, weder jetzt noch in absehbarer Zeit den nötigen Platz in einer Karawane zu erhalten, den wir brauchen, um unsere Quoten zu erfüllen ..."
 gdp_merchant_trade_opportunity.0113.a: "Was ist ein Händler ohne eine Karawane …"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] und gehen durch das Zwischenlager von [destination.GetBaronyNameExplicitly], ein Knotenpunkt des Kaufens und Verkaufens, wo sich Händler aller Art begegnen, und Waren zu unbekannten und fernen Orten verschicken.\n\nAn solch einem Ort, wo so viele Güter die Hände wechseln, sind es die großen Geschäfte oder der Handel in großen Mengen, die über Erfolg oder Misserfolg eines Kaufmanssschicksals entscheiden …"
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nIrgendwie schaffen wir es heil aus dem Schlangennest heraus, und das mit einem dicken Buch voller Schuldscheine, die für die kommende Saison wettbewerbsfähige Verkaufspreise für Wareneinheiten ([trade_good_type.Custom('GetTradeGoodUnitPlural')]) verschiedener Güter ([trade_good_type.Custom('GetTradeGood')]) in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] sicherstellen!"
 gdp_merchant_trade_opportunity.0122.intro: "Die Tage verschwimmen ob des endlosen Feilschens, Streitens und Zuredens, und meine Blicke wandern zwischen losen Zungen und knirschenden Zähnen hin und her, während Preise durch den Auktionshof gerufen werden und der Boden ([ROOT.Char.Custom('GroundType')]) voll weggeworfener Zettel, hingekritzelter Notizen und verlorener Vermögen ist."
 gdp_merchant_trade_opportunity.0122.a: "Es ist ein Markt für Käufer!"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nWir schaffen es zerschlagen und erschöpft aus dem Schlangennest heraus, ohne die garantierten Verkaufspreise für die Waren ([trade_good_type.Custom('GetTradeGood')]) zu sichern, wie wir es hofften. Stattdessen wurden wir von unseren Rivalen ausgestochen …"
 gdp_merchant_trade_opportunity.0123.a: "Es ist ein Markt für Verkäufer …"
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nIrgendwie schaffen wir es heil aus dem Schlangennest heraus – und dies mit einem dicken Buch voller Schuldscheine, die für die kommende Saison wettbewerbsfähige Kaufpreise für Güter ([trade_good_type.Custom('GetTradeGoodUnitPlural')]) verschiedener Warenarten ([trade_good_type.Custom('GetTradeGood')]) in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] sicherstellen!"
 gdp_merchant_trade_opportunity.0132.a: "Es ist ein Markt für Verkäufer!"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nWir schaffen es zerschlagen und erschöpft aus dem Schlangennest heraus, ohne die garantierten Kaufpreise für die Waren ([trade_good_type.Custom('GetTradeGood')]) zu sichern, wie wir es hofften. Stattdessen stachen unsere Rivalen uns aus …"
 gdp_merchant_trade_opportunity.0133.a: "Es ist ein Markt für Käufer …"
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "Vielleicht ist es nur gerecht, dass [task_contract_target.GetTitledFirstName] einen Anteil an den Verkäufen auf einem gewissen Amrkt ([local_market.GetName]) erhält, da [task_contract_target.Custom('DE_PRO_PER_S_3P_N')] dafür sorgt, dass Frieden und Gesetz eingehalten werden.\n\nAllerdings gibt es #EMP immer#! Raum für Verhandlungen. Wir müssen [task_contract_target.Custom('DE_PRO_PER_S_3P_D')] nur den Wert unserer Routen verdeutlichen und die Last erklären, die [task_contract_target.Custom('DE_PRO_PER_S_3P_N')] unseren armen Rücken aufbürdet …"
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0142.desc: "Es waren lange Tage des Zuredens, Schmeichelns und Ermahnens in den Hallen von [task_contract_target.GetTitledFirstName], und unsere Wangen schmerzen noch immer vom ständigen Lächeln, doch unsere Mühen waren nicht umsonst.\n\nWir handelten verringerte Zollgebühren aus, was bessere Margen in naher Zukunft verheißt."
 gdp_merchant_trade_opportunity.0142.a: "Das ist der Preis guter Geschäfte."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0143.desc: "Nach so vielen langen Tagen des Zuredens, Schmeichelns und Ermahnens in den Hallen von [target.GetTitledFirstName] schmerzen unsere Wangen noch immer vom ständigen Lächeln und unsere Beine sind schwach vom Stehen, und wir kehren mit nichts als Ausgleich für unsere Arbeit zurück …\n\nHeute, während wir auf die Audienz warteten, erklärte uns die Wache von [target.GetTitleAsNameNoTooltip], dass [target.Custom('DE_PRO_PER_S_3P_N')] uns leider nicht helfen könne, denn es gebe dringlichere Angelegenheiten …"
 gdp_merchant_trade_opportunity.0143.a: "Aber [target.Custom('DE_PRO_PER_S_3P_N')] wirkte so nachgiebig …"
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "Die Kommissionäre und Sammler eines gewissen Markts ([local_market.GetName]) schwören auf diesen Ort. Diese Schakale spotten mit Beuteln voll [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')], die sie mit sich führen, und jeder davon ist mit Gold gefüllt, das ehrlich erworben und aus den Taschen anständiger Kaufleute geschüttelt wurde, wie [associate.GetFirstName] und ich welche sind …\n\nDie Zölle von [owner.GetTitledFirstName] sind der Fluch des Handels hier, und [owner.Custom('DE_PRO_POS_S_3P')]e Gier zwang uns zu heimlichen Geschäften."
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: Erfolg"
 gdp_merchant_trade_opportunity.0152.desc: "Nach viel harter Arbeit haben wir gute Kontakte unter den einheimischen Taugenichtsen aufgebaut und verlässliche #EMP alternative#! Routen für Waren gesichert, die aus einem gewissen Markt ([trade_market.GetName]) kommen.\n\nKiste für Kiste, die mit jeder Ladung vor den leichtgläubigen Nasen der Wachen vorüberbefördert wird, werden sich die Ersparnisse bald summieren …"
 gdp_merchant_trade_opportunity.0152.a: "Es ist #EMP unser#! Geld, und wir sollten es behalten."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: Fehlschlag"
 gdp_merchant_trade_opportunity.0153.desc: "Unsere Bemühungen, einen Schmugglerring auf einem gewissen Markt ([trade_market.GetName]) aufzubauen, wurden immer wieder vereitelt, sei es durch die Unfähigkeit unserer Agenten, die Wachsamkeit der örtlichen Obrigkeit oder die Unehrlichkeit der einheimischen Taugenichtse …\n\nWir haben keine andere Wahl, außer weiter zu zahlen, und trotz all unserer harten Arbeit besudelten wir unseren eigenen Ruf als ehrliche Zwischenhändler nur."
 gdp_merchant_trade_opportunity.0153.a: "Wir hätten einfach die Zölle zahlen sollen …"
 gdp_merchant_trade_opportunity.1001.t: "Die Räder schmieren"
 gdp_merchant_trade_opportunity.1001.desc: "Unsere [task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip|l]en Kontakte zeigen eine uncharakteristische Verschwiegenheit in ihrem Tun, und es wurde deutlich, dass das örtliche Oberhaupt [local_ruler.GetTitledFirstName] der eigentliche Grund dafür ist.\n\nUnd tatsächlich erhalten wir schon bald Kunde von [Select_CString(local_ruler.IsFemale, 'der großen Frau', 'dem großen Mann')] höchstpersönlich, [local_ruler.Custom('DE_ART_DEF_S_N')] einen „#EMP Eindruck von den Möglichkeiten#!“ in [local_ruler.Custom('DE_PRO_POS_S_3P')]en Landen verlangt …"
 gdp_merchant_trade_opportunity.1001.a: "#weak *seufz*#! Gebt [Select_CString(local_ruler.IsFemale, 'der Frau', 'dem Mann')] [local_ruler.Custom('DE_PRO_POS_S_3P')]e [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')] …"
 gdp_merchant_trade_opportunity.1001.b: "Gewiss wird ein #EMP angesehener#! Geist unsere Lage nachvollziehen können."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip|U] ist entzückt"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip|U] ist verärgert"
 gdp_merchant_trade_opportunity.1001.c: "„Wisst Ihr, da nimmt sich #EMP wirklich#! jemand ([other_merchant.GetPrimaryTitle.GetNameNoTooltip]) viele Freiheiten heraus.“"
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip|U] beißt an"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip|U] nimmt Anstoß daran"
 gdp_merchant_trade_opportunity.1001.d: "Pah! Wir kommen zurecht."
 gdp_merchant_trade_opportunity.1011.t: "Gegenseitige Großzügigkeit"
 gdp_merchant_trade_opportunity.1011.desc: "Unser Vorgehen in [local_market.GetShortName] scheint das Interesse des örtlichen Oberhaupts [local_ruler.GetTitledFirstName] geweckt zu haben, das nun die Gesellschaft zu einer privaten Audienz bat.\n\nAls ich vor ihm stehe, lächelt [Select_CString(local_ruler.IsFemale, 'die', 'der')] [local_ruler.GetTitleAsNameNoTooltip]. „Handel bringt großartige Vorteile; für die Leute, den Adel, für alle hier ([local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip])! Teilt Eure Sorgen mit mir, und ich werde helfen, wo ich helfen kann.“"
 gdp_merchant_trade_opportunity.1011.a: "#weak *ähm*#! „Die Routen sind #EMP sehr#! schwierig gewesen, Euer Eminenz …“"
 gdp_merchant_trade_opportunity.1011.b: "„Ich hättet da tatsächlich ein paar Einfälle für die örtlichen Handelsplätze ([task_contract_location.Custom('GetRegionalMarketTerm')]).“"
 gdp_merchant_trade_opportunity.1011.b.good: "Euer Ratschlag ist gut"
 gdp_merchant_trade_opportunity.1011.b.bad: "Euer Ratschlag ist Unsinn"
 gdp_merchant_trade_opportunity.1011.c: "„Andere Kaufleute ([other_merchant.GetPrimaryTitle.GetNameNoTooltip]) lassen die Dinge sehr schwierig werden.“"
 gdp_merchant_trade_opportunity.1011.c.fallback: "„Die Konkurrenz macht die Dinge sehr schwierig.“"
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip|U] unterstützt Euch"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip|U] unterstützt das Haus [other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "Ein Beliebtheitswettkampf, der auf [diplomacy_i|E][diplomacy|E] und [opinion_i|E][opinion|E] beruht"
 gdp_merchant_trade_opportunity.1011.d: "„Gesegnet seien Ihr und Eure gütige Herrschaft, [Select_CString(local_ruler.IsFemale, 'große', 'großer')] [local_ruler.GetTitleAsNameNoTooltip].“"
 gdp_merchant_trade_opportunity.1021.t: "Gemeinsamer Konkurrent"
 gdp_merchant_trade_opportunity.1021.desc: "Geschlagen von diesen Schurken in [target.GetPrimaryTitle.GetName] bin ich überrascht von dem Vorgehen von [other_merchant.GetTitledFirstName] und [other_merchant.Custom('DE_PRO_POS_S_3P')]er Unternehmung ([other_merchant.GetPrimaryTitle.GetName]), einem weiteren Wettbewerber auf den Handelsplätzen ([task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]) von [local_market.GetShortName].\n\n„Seid mir gegrüßt, [ROOT.Char.GetTitledFirstNameNoTooltip]“, sagt [other_merchant.Custom('DE_PRO_PER_S_3P_N')]. „Ich hörte von Euren Schwierigkeiten mit dem Profitmacherhaus [target.GetHouse.GetNameNoTooltip], [target.GetTitledFirstName]. Vielleicht können wir einander helfen?“"
 gdp_merchant_trade_opportunity.1021.a: "„Sehr gut! Hier ist der Plan …“"
 gdp_merchant_trade_opportunity.1021.b: "„Wie kann ich wissen, dass man Euch vertrauen kann?“"
 gdp_merchant_trade_opportunity.1021.b.good: "Ihr kommt zu einer Übereinkunft"
 gdp_merchant_trade_opportunity.1021.b.bad: "Ihr werdet handgreiflich"
 gdp_merchant_trade_opportunity.1021.c: "„Zusammen können wir es sehr schwer für sie machen.“"
 gdp_merchant_trade_opportunity.1021.d: "„Niemals! Ihr [other_merchant.GetHouse.GetNameNoTooltip]-Abkömmlinge seid noch schlimmer!“"
 gdp_merchant_trade_opportunity.1031.t: "Handelsgeheimnis"
 gdp_merchant_trade_opportunity.1031.desc: "Als ich einige Gesellschaftsberichte aus [task_contract_location.GetBaronyNameExplicitlyNoTooltip] durchgehe, lösen sich ein paar Blätter und flattern auf den Boden. Ich sammle sie auf und bemerke, dass mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] finster und zögerlich dreinblickt.\n\nAls ich die Dokumente überfliege, kann ich nicht anders, als die Augenbrauen zu lupfen, denn mir wird der Grund für [associate.Custom('DE_PRO_POS_S_3P')]e Bestürzung klar. [associate.GetFirstNameNoTooltip|U] hat notwendiges Wissen für unsere Geschäfte hier zurückgehalten! Und das alles aus Bosheit?"
 gdp_merchant_trade_opportunity.1031.a: "„Verflucht, [associate.GetFirstNameNoTooltip]! Wem gilt Eure Treue?“"
 gdp_merchant_trade_opportunity.1031.b: "„Kommt schon. Was ist Euer Kummer?“"
 gdp_merchant_trade_opportunity.1031.c: "„#EMP HINAUS!#! Ihr dient nicht länger dem Nutzen dieser Gesellschaft!“"
 gdp_merchant_trade_opportunity.1041.t: "Eine Familienanstrengung"
 gdp_merchant_trade_opportunity.1041.desc: "Die Stimmung ist gut und die Gespräche in der Gesellschaft kehren immer wieder zu den kürzlichen Erfolgen in [task_contract_location.GetBaronyNameExplicitlyNoTooltip] zurück, die zufälligerweise alle mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] lenkte.\n\n[associate.Custom('DE_PRO_PER_S_3P_N')|U] wird als ein wahres Handelsgenie gepriesen, doch natürlich beruht jeder Erfolg auf der harten Arbeit vieler Hände und Zungen in unserem [ROOT.Char.GetHouse.GetNameNoTooltip]-Netzwerk."
 gdp_merchant_trade_opportunity.1041.a: "Großartige Arbeit, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1041.b: "Ganz offenkundig haben wir Euch nicht hart genug arbeiten lassen."
 gdp_merchant_trade_opportunity.1041.c: "Eure Bemühungen sind unglaublich. Sie sind ein Vorbild für uns alle!"
 gdp_merchant_trade_opportunity.1051.t: "Auf der Suche nach Klärung"
 gdp_merchant_trade_opportunity.1051.desc: "Als ich über den Handelsplatz ([task_contract_location.Custom('GetRegionalMarketTermGloss')]) gehe, erscheint plötzlich [Select_CString(target.IsFemale, 'unsere Konkurrentin', 'unser Konkurrent')] [target.GetTitledFirstName] ([target.GetPrimaryTitle.GetName]) höchstpersönlich vor mir! Wobei gesagt werden muss, dass [target.Custom('DE_PRO_POS_S_3P')]e Ehrerbietung mich etwas überrascht.\n\n„Schaut, [ROOT.Char.GetTitledFirstNameNoTooltip]“, seufzt [target.Custom('DE_PRO_PER_S_3P_N')]. „Ich werde ganz offen sein. Unsere Interessen hier stehen im Widerspruch zueinander, und es wird nichts Gutes daraus erwachsen, wenn wir uns in die Quere geraten. Ich bitte Euch, dass Ihr davon ablasst."
 gdp_merchant_trade_opportunity.1051.desc.gold: "Ich werde Euch Geld für Eure Umstände zahlen.“"
 gdp_merchant_trade_opportunity.1051.desc.luxury: "Im Gegenzug gebe ich Euch einen kleinen Hinweis zu einer wundersamen Anschaffung in einem weit entfernten Land.“"
 gdp_merchant_trade_opportunity.1051.a: "„Ihr sagt die Wahrheit. Nun gut, ich nehme an.“"
 gdp_merchant_trade_opportunity.1051.b: "„Hier gibt es eine Grundlage … Lasst uns verhandeln.“"
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip|U] willigt ein"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip|U] lehnt ab"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName|U] wird Euch zu Ehren eine [GetActivityType('activity_feast').GetName]-[activity|E] ausrichten"
 gdp_merchant_trade_opportunity.1052.t: "Festmahl annuliert"
 trade_opportunity_gain_luxury_contract_tt: "Ihr erhaltet einen [luxury_contract|E]"
 gdp_merchant_trade_opportunity.1051.d: "„Ha, die Geschäfte müssen #EMP wirklich#! schlecht laufen! Nie im Leben.“"
 gdp_merchant_trade_opportunity.1061.t: "Überlastet"
 gdp_merchant_trade_opportunity.1061.desc: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] hat sich über etwas beschwert: Indem wir uns darauf konzentrieren, unsere Geschäfte in [task_contract_location.GetBaronyNameExplicitlyNoTooltip] zu regeln, geraten unsere Fähigkeiten ins Wanken, das Tagesgeschäft auf dem Handelsplatz ([task_contract_location.Custom('GetRegionalMarketTermGlossPlural')]) am Laufen zu halten.\n\n„Etwas muss geschehen, [ROOT.Char.GetTitleAsNameNoTooltip]. Der Tag hat einfach nicht genügend Stunden und es gibt nicht genügend Hände in der Gesellschaft, um alles im Griff zu behalten, wenn wir so weitermachen.“"
 gdp_merchant_trade_opportunity.1061.a: "Unsere Unternehmung ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|U]) weicht nicht vor einer Herausforderung zurück!"
 gdp_merchant_trade_opportunity.1061.a.good: "Alles läuft nach Plan"
 gdp_merchant_trade_opportunity.1061.a.bad: "Ihr überanstrengt Euch"
 gdp_merchant_trade_opportunity.1061.b: "Die Gewinne werden unter meiner Aufsicht nicht zurückgehen."
 gdp_merchant_trade_opportunity.1061.already_tt: "Bereits erhalten: [associate.GetShortUIName] #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! [stress|E], [scheme|E] #P +1#! [scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 gdp_merchant_trade_opportunity.1071.t: "Flaschenhals"
 gdp_merchant_trade_opportunity.1071.desc: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] läuft unaufhörlich auf und ab und [associate.Custom('DE_PRO_POS_S_3P')] Gemüt wird durch eine gemächlich umherschwirrende Fliege noch mehr irritiert. „Ah!“, stöhnt [associate.Custom('DE_PRO_PER_S_3P_N')]. „Schaut her, [ROOT.Char.GetTitleAsNameNoTooltip], Eure Arbeit hier in [task_contract_location.GetBaronyNameExplicitlyNoTooltip] strapaziert meine Ressourcen!“\n\nIch starre angestrengt auf die Schuldscheine und das Hauptbuch und kann [associate.Custom('DE_PRO_PER_S_3P_D')] nur schwerlich widersprechen. [associate.Custom('DE_PRO_PER_S_3P_N')|U] seufzt. „Wir müssen einen Kompromiss finden oder unsere Niederlassung hier wird der Anstrengung nicht standhalten können …“"
 gdp_merchant_trade_opportunity.1071.a: "Wir sind einem einzigen Ziel verpflichtet."
 gdp_merchant_trade_opportunity.1071.d: "Überlasst mir die Angelegenheit und widmet Euch ganz Euren eigenen Aufgaben."
 gdp_merchant_trade_opportunity.1081.t: "In guten Händen"
 gdp_merchant_trade_opportunity.1081.desc: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] handhabte die meisten Einzelheiten unseres gegenwärtigen Geschäfts in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], und das zeigt sich! [associate.GetFirstName|U] verfügt ganz deutlich über die Präzision und die anderen Qualitäten [Select_CString(associate.IsFemale, 'einer begabten Händlerin', 'eines begabten Händlers')].\n\nSeitdem unsere Arbeit hier begann, habe ich kaum ein Hauptbuch überprüfen noch einer Anordnung nachgehen müssen."
 gdp_merchant_trade_opportunity.1081.a: "Behaltet die gute Arbeit bei, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1081.b: "Solch ein Einsatz sollte belohnt werden."
 gdp_merchant_trade_opportunity.1081.c: "Die gesamte Gesellschaft muss sich daran ein Beispiel nehmen!"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip|U] gibt ein Beispiel vor"
 gdp_merchant_trade_opportunity.1081.c.trigger: "Jeder andere [associate|E] hat weniger als [stewardship_i|E][EmptyScope.ScriptValue('medium_skill_rating')|V0]"
 gdp_merchant_trade_opportunity.1081.c.tt: "Die [stewardship|E] von jedem anderen [associate|E] erhöht sich um [stewardship_i|E]#P 1#!"
 gdp_merchant_trade_opportunity.1081.d: "[ROOT.Char.GetHouse.GetNameNoTooltip|U]-Leute sind natürlich die Besten."
 gdp_merchant_trade_opportunity.1091.t: "[Select_CString(associate.IsFemale, 'Eine arglose Mitarbeiterin', 'Ein argloser Mitarbeiter')]"
 gdp_merchant_trade_opportunity.1091.desc: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] übernahm die Leitung unserer gegenwärtigen Geschäfte in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], doch leider muss man sich jetzt wünschen, [associate.Custom('DE_PRO_PER_S_3P_N')] hätte es nicht getan …\n\nJeden Tag entdecke ich anscheinend wieder eine falsch verbuchte Summe oder muss mir die Beschwerden eines Kontakts anhören, der auf eine Antwort wartet. So nachlässig kann das Geschäft nicht geführt werden!"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip|U], lasst uns die Bücher durchgehen."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip|U] lernt ein oder zwei Dinge"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip|U] ist ein hoffnungsloser Fall"
 gdp_merchant_trade_opportunity.1091.c: "Die Gesellschaft wird die zusätzliche Last schultern müssen."
 gdp_merchant_trade_opportunity.1091.d: "[associate.GetSheHe|U] gibt [associate.Custom('DE_PRO_POS_S_3P')] Bestes, denke ich."
 gdp_merchant_trade_opportunity.1101.t: "Startkapital"
 gdp_merchant_trade_opportunity.1101.desc: "Darlehen können ein gutes Unternehmen sein für jene, die [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] und Geduld übrig haben, um die rechte Zeit abzuwarten. Passenderweise bat ein eifriger Investor um ein Treffen in [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nIch werde von [investor.GetTitledFirstName] begrüßt,"
 gdp_merchant_trade_opportunity.1101.ruler: "[Select_CString(investor.IsFemale, 'einer örtlichen Herrscherin', 'einem örtlicher Herrscher')] in [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.1101.courtier: "der Höfling irgendeines örtlichen Adligen."
 gdp_merchant_trade_opportunity.1101.adventurer: "jemandem von der weltgewandten Sorte mit einem wahren Geleitzug von Anhängern."
 gdp_merchant_trade_opportunity.1101.fallback: "[Select_CString(investor.IsFemale, 'eine', 'ein')] [investor.GetWomanMan] ohne jeglichen Hintergrund."
 gdp_merchant_trade_opportunity.1101.end: "„Schön, dass wir uns begegnen, [ROOT.Char.GetTitledFirstNameNoTooltip]!“, lächelt [investor.Custom('DE_PRO_PER_S_3P_N')] eifrig. „Ich wäre ein williger Finanzier Eures Unternehmens ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]). Und was erwarte ich im Gegenzug? Nun, machen wir uns darüber im Moment keine Gedanken.“"
 gdp_merchant_trade_opportunity.1101.a: "Ihr könnt Euch auf uns verlassen, [investor.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.1101.c: "Schon ein wenig mehr würde viel bewirken. Das garantiere ich bei meiner Ehre."
 gdp_merchant_trade_opportunity.1101.d: "Schmeichelhaft, aber wir verringern die Dinge dieses Mal aufs Wesentliche."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName] wird [gold_i|E][interest|0V] erheben (#M 20 % Zinsen#!) in #V 5#! Jahren"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "Es ist endlich an der Zeit für mich, die Früchte meiner Investition bei Eurer angesehenen Handelsgesellschaft zu ernten.\n\nIch erwarte geduldig die Quittierung meiner [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]."
 gdp_merchant_trade_opportunity.1102.a: "Wohlan denn. Mögen Euch die Mittel bei bester Gesundheit erreichen."
 gdp_merchant_trade_opportunity.1102.b: "Ah – lasst uns einmal sehen. Wir hatten eine Durststrecke, [investor.GetFirstNameNoTooltip] …"
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip|U] akzeptiert Eure Entschuldigungen"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip|U] schöpft Misstrauen"
 gdp_merchant_trade_opportunity.1102.d: "Ihr habt keine Investitionen bei uns, und damit genug."
 gdp_merchant_trade_opportunity.9000.t: "Das Geschäft in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] vorantreiben"
 gdp_merchant_trade_opportunity.9000.desc: "Nachdem die Sache geklärt ist, gibt es hier ([ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName]) noch andere Geschäfte, die unserer Aufmerksamkeit bedürfen.\n\nSollten wir unsere Angelegenheiten in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] in Ordnung bringen, bevor wir unsere Reise zurück nach [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] antreten?"
 gdp_merchant_trade_opportunity.9000.a: "Das sollten wir uns ansehen."
 gdp_merchant_trade_opportunity.9000.b: "Lasst uns das klären."
 gdp_merchant_trade_opportunity.9000.c: "Ich werde mich der Sache annehmen."
 gdp_merchant_trade_opportunity.9000.d: "Nein, wir werden in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] gebraucht."
 gdp_merchant_trade_opportunity.9000.accept_tt: "Ihr nehmt an und beginnt die [trade_opportunity|E] mit [trade_opportunity_tier_tier|E] [THIS.TaskContract.GetTaskContractTierValue|V] von [THIS.TaskContract.GetEmployer.GetUIName] in [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly] ([THIS.TaskContract.GetType.GetName|V])"
 gdp_merchant_trade_opportunity.9010.t: "Handelsgelegenheit: [task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "Wichtige Gesellschaftsgeschäfte warten in [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.intro: "Wichtige Gesellschaftsgeschäfte warten hier in [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.desc: "und meine Aufgaben müssen in den Händen meiner Mitarbeiter bleiben, bis ich zurückkehre.\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "Mein[partner.Custom('DE_END_PRO_S_N')] [GetCourtPositionType('partner_court_position').GetNameNoTooltip] [partner.GetFirstName] könnte die Verantwortung in dieser Sache bekommen, während ich mich um andere Angelegenheiten kümmere."
 gdp_merchant_trade_opportunity.9010.partner_busy: "Mein[partner.Custom('DE_END_PRO_S_N')] [GetCourtPositionType('partner_court_position').GetNameNoTooltip] [partner.GetFirstName] ist derzeit verhindert. Vielleicht sollte ich mich selbst darum kümmern …"
 gdp_merchant_trade_opportunity.9010.candidate: "Bis ich jemanden finde, dem ich eine solch wichtige Sache übertragen kann, werde ich mich selbst darum kümmern müssen."
 gdp_merchant_trade_opportunity.9010.no_partner: "Da es niemanden gibt, dem ich eine solch wichtige Sache übertragen kann, muss ich mich selbst darum kümmern."
 gdp_merchant_trade_opportunity.9010.a: "Lasst uns keine Zeit verlieren."
 gdp_merchant_trade_opportunity.9010.c: "Ja, [partner.GetFirstNameNoTooltip] kann sich darum kümmern."
 gdp_merchant_trade_opportunity.9010.c.no_partner: "[Select_CString(partner.IsFemale, 'Meine Partnerin', 'Mein Partner')] soll sich darum kümmern."
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUIName|U] ist bereits in die [trade_opportunity|E] einbezogen"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "[Select_CString(partner.IsFemale, 'Eure Partnerin', 'Euer Partner')] ist mit einer anderen [trade_opportunity|E] beschäftigt"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "Ist Eurer [trade_opportunity|E] in Sachen [task_contract.GetType.GetName|V] zugewiesen"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M Wird nicht verfügbar sein, bis der [task_contract|E] erfüllt ist#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M Erfolgschance beruht auf [THIS.Char.Custom('DE_PRO_POS_S_3P')]er [aptitude|E] ([THIS.Char.GetCourtPositionAptitude(GetCourtPositionType('partner_court_position'))])#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon! #X Der Vertrag scheitert, wenn [THIS.Char.Custom('DE_PRO_PER_S_3P_N')] nicht mehr Euer [GetCourtPositionType('partner_court_position').GetName] ist#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "[THIS.Char.GetShortUIName|U] wurde Eurer [trade_opportunity|E] in Sachen [task_contract.GetType.GetName] in [task_contract_location.GetBaronyNameExplicitly] zugewiesen"
 gdp_merchant_trade_opportunity.9010.d: "Vielleicht ist [candidate.GetFirstNameNoTooltip] der Sache gewachsen."
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "Vielleicht ist jemand der Sache gewachsen."
 gdp_merchant_trade_opportunity.9010.d.tt: "Ihr habt [associates|E], die:\n$EFFECT_LIST_BULLET$Keine [traders|E] sind\n$EFFECT_LIST_BULLET$Euer [GetCourtPositionType('partner_court_position').GetName] sein könnten"
 gdp_merchant_trade_opportunity.9010.e: "Vergesst es. Andere Verpflichtungen rufen."
 gdp_merchant_trade_opportunity.9010.e.tt: "Der [task_contract|E] wird gekündigt"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "Ihr beginnt umgehend mit dem [Concept('traveling', 'Reisen')|E] nach [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.tt.start: "Ihr beginnt umgehend mit dem [task_contract|E]"
 gdp_merchant_trade_opportunity.9020.t: "Handelsgelegenheit: [task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9020.intro: "Mein[partner.Custom('DE_END_PRO_S_N')] [GetCourtPositionType('partner_court_position').GetNameNoTooltip] [partner.GetFirstName] kehrte endlich mit Neuigkeiten über [partner.Custom('DE_PRO_POS_S_3P')]en Fortschritt aus [task_contract_location.GetBaronyNameExplicitly] zurück.\n\n"
 gdp_merchant_trade_opportunity.9020.success: "Glücklich erklärt [partner.Custom('DE_PRO_PER_S_3P_N')], wie [partner.Custom('DE_PRO_PER_S_3P_N')] die Angelegenheit geschickt im Sinne der Gesellschaft und zu [partner.Custom('DE_PRO_POS_S_3P')]en Gunsten regelte, und dies trotz vieler Schwierigkeiten …"
 gdp_merchant_trade_opportunity.9020.failure: "[partner.Custom('DE_PRO_PER_S_3P_N')|U] erklärt etwas zögerlich, wie schwierig [partner.Custom('DE_PRO_POS_S_3P')]e Aufgabe war und dass die Gesellschaft trotz [partner.Custom('DE_PRO_POS_S_3P')]er großen Bemühungen Schaden erlitt …"
 gdp_merchant_trade_opportunity.9020.a.success: "Sehr gut, [partner.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.9020.a.failure: "Ich hätte mich selbst darum kümmern sollen …"
 gdp_merchant_trade_opportunity.9050.t: "Eine vergebene Gelegenheit"
 gdp_merchant_trade_opportunity.9050.desc_opening: "Eine vielversprechende Aussicht trübte sich ein.\n\nDie Handelsgelegenheit in [trade_destination.GetBaronyNameExplicitlyNoTooltip], der eigentliche Grund unserer Reise, ging verloren."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\nDie einzige Frage, die sich nun stellt, ist, ob es überhaupt sinnvoll ist, diesen unheilvollen Weg weiter zu beschreiten."
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "Die Handelsroute, von der sie abhing, existiert nicht mehr."
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] liegt nicht mehr auf der Route ([trade_opportunity_route.GetName])."
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "[trade_opportunity_route.GetName|U] hat keinen Händler mehr, von dem diese Gelegenheit abhängig ist."
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "Es stellt sich heraus, dass sich die Aufstände auf einer Route ([trade_opportunity_route.GetName]) gelegt haben."
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "Da wir uns nicht länger Kunsthandwerker nennen, wäre es verkehrt, die Angelegenheit auf diese Weise geschäftlich anzugehen."
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "Da wir uns nicht länger Geldgeber nennen, wäre es verkehrt, die Angelegenheit auf diese Weise geschäftlich anzugehen."
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "Unsere rivalisierende Gesellschaft machte sich aus dem Staub, nach dem, was vorbeireisende Händler uns so erzählen."
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "Das Zwischenlager an unserem Ziel steht uns nicht mehr zur Verfügung, so scheint es."
