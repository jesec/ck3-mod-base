l_german:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "Regierung gestürzt"
 overthrow_government_outcome.1001.desc: "Die Verschwörung erreicht ihren Höhepunkt: Es heißt jetzt oder nie. Schlüsselagenten wurden in den Kasernen der Stadtwache, in der Versammlung und im Palast in Stellung gebracht. Auf meinen Befehl hin werden sie die Hebel der Macht übernehmen und dafür sorgen, dass das alte Regime hinweggefegt wird.\n\nMorgen bleibt der Versammlung keine andere Wahl, als mein Regime anzuerkennen und meine Gegner zu Staatsfeinden zu erklären."
 overthrow_government_outcome.1001.a: "Kein Blut. Keine Verbannungen."
 overthrow_government_outcome.1001.b: "Meine persönlichen Feinde."
 overthrow_government_outcome.1001.c: "Jeder, der sich uns in den Weg stellt, muss gehen."
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "Die Republik besteht weiter"
 overthrow_government_outcome.1002.desc: "Eine Verschwörung unter meinen Patriziern kam ans Licht, in die Wege geleitet von jemand Abtrünnigem: [owner.GetShortUINameNoTooltip]. Zum Glück zerschellte der Staatsstreich einfach am Fels meiner ruhmreichen Herrschaft!\n\nDie Schurken versuchten, meine erlauchte Person festzusetzen, doch meine Wache konnte dieses Ansinnen vereiteln. Die Versammlung und das Militär sind mir noch immer treu, trotz ihrer elenden Bemühungen."
 overthrow_government_outcome.1002.a: "Lasst sie festnehmen!"
 overthrow_government_outcome.1002.b: "Ich werde mich bei Zeiten um sie kümmern."
 overthrow_government_outcome.1002.c: "Ich werde die Herzensgüte aufbringen, ihnen zu vergeben."
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName|U] und [owner.Custom('DE_PRO_POS_S_3P')]e [agents|E] werden von ihrem Status als [criminal|E] befreit und sind keine Staatsfeinde mehr"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "Gestürzt"
 overthrow_government_outcome.1003.desc: "„Mein Herr!“, ruft [craftsman_character.GetShortUINameNoTooltip], während [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] durch die Tür stürmt: Es wirkt, als wäre [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] ums eigene Leben gerannt.\n\n„Verschwörung! Hochverrat! [owner.GetShortUINameNoTooltip|U] hat Verbündete um sich geschart und will erreichen, dass die Versammlung Euch [Select_CString(ROOT.Char.IsFemale, 'zur Staatsfeindin', 'zum Staatsfeind')] erklärt! Schläger sind bereits auf dem Weg!“\n\n[craftsman_character.Custom('DE_PRO_PER_S_3P_N')|U] geht unruhig im Zimmer auf und ab wie ein Tier im Käfig. „Was sollen wir nur tun?“, fragt [craftsman_character.Custom('DE_PRO_PER_S_3P_N')]."
 overthrow_government_outcome.1003.b.desc: "„Mein Herr!“, ruft [craftsman_character.GetShortUINameNoTooltip], während [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] durch die Tür stürmt: Es wirkt, als wäre [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] ums eigene Leben gerannt.\n\n„Verschwörung! Hochverrat! [owner.GetShortUINameNoTooltip|U] hat Verbündete um sich geschart und will erreichen, dass die Versammlung eine neue Regierung ausruft. Auf der Straße heißt es, dass Ihr abgesetzt seid, aber dass die neue Regierung alle ihre politischen Feinde begnadigte.“\n\n[craftsman_character.Custom('DE_PRO_PER_S_3P_N')|U] blickt mich niedergeschlagen an. „Was sollen wir nur tun?“, fragt [craftsman_character.Custom('DE_PRO_PER_S_3P_N')]."
 overthrow_government_outcome.1003.a: "[ROOT.Char.GetLiege.Custom('DE_ART_DEF_S_N')|U] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] und die Versammlung sollen meinen Fall vorgetragen bekommen."
 overthrow_government_outcome.1003.b: "Ich gehe in die Verbannung."
 overthrow_government_outcome.1003.c: "Ich ziehe mich als [Select_CString(ROOT.Char.IsFemale, 'einfache Kauffrau', 'einfacher Kaufmann')] aus der Politik zurück."
 overthrow_government_outcome.1003.d: "Fürs Erste nichts. So läuft es eben in der Politik."
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "[Select_CString(ROOT.Char.IsFemale, 'Staatsfeindin', 'Staatsfeind')]"
 overthrow_government_outcome.1004.1.desc: "Ich wurde zum Staatsfeind erklärt!"
 overthrow_government_outcome.1004.2.desc: "\n\nDie Verlautbarung wird an allen Marktplätzen und Kirchentoren aufgehängt. Mein Leben und Besitz sind in Gefahr."
 overthrow_government_outcome.1004.3.desc: "\n\nIch könnte jederzeit verhaftet werden!"
 overthrow_government_outcome.1004.councilor.desc: "\n\nZweifelsohne aufgrund meiner hervorgehobenen Stellung im Rat des abgesetzten Regimes."
 overthrow_government_outcome.1004.personal.desc: "\n\nDa [owner.GetName] mich als [Select_CString(ROOT.Char.IsFemale, 'persönliche Feindin', 'persönlichen Feind')] betrachtet, ist nicht schwer zu erraten, warum."
 overthrow_government_outcome.1004.political.desc: "\n\nZweifelsohne aufgrund meiner Stellung als [Select_CString(ROOT.Char.IsFemale, 'mächtige Patrizierin', 'mächtiger Patrizier')] und bekannte Stimme gegen die Agenda des neuen [owner.GetHouse.GetHouseAspiration.GetName]-Regimes."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nZweifelsohne aufgrund meiner Aufgaben als [Select_CString(ROOT.Char.IsFemale, 'Agentin', 'Agent')] der Verschwörung zum Sturz der Regierung."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "Der Würfel ist gefallen"
 overthrow_government_outcome.1005.desc: "Eine gespannte Erwartung liegt in der Luft, als [speaker.GetShortUINameNoTooltip] vor die Versammlung tritt und das Wort ergreift.\n\n„Patrizier! Lang lebe die Patria und unsere Republik. Es schmerzt mich, Euch mitteilen zu müssen, dass [Select_CString(target.IsFemale, 'unsere', 'unser')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] [target.GetFirstNameNoTooltip] abgesetzt wurde, wegen Korruption und Hochverrats an der Republik …“\n\nEine Welle von Rufen und Gemurmel geht durch die Halle, doch einige einflussreiche Patrizier erheben sich und klatschen Beifall.\n\n„Per Notstandsdekret sprang [Select_CString(ROOT.Char.IsFemale, 'Bürgerin', 'Bürger')] [owner.GetFirstNameNoTooltip] ein, um das Staatsschiff als [Select_CString(ROOT.Char.IsFemale, 'unsere neue', 'unser neuer')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] wieder auf Kurs zu bringen.“\n\nDer Beifall schwillt an, während sich immer mehr Patrizier erheben."
 overthrow_government_outcome.1005.a: "Lang lebe die Republik!"
 overthrow_government_outcome.1005.b: "Buh! [Select_CString(ROOT.Char.IsFemale, 'Tyrannin', 'Tyrann')]! Verrat!"
 government_overthrow_enemies.1001.b.custom: "Die folgenden Patrizier werden [criminals|E]:\n$EFFECT_LIST_BULLET$Gestürzter [liege|E] und [councillors|E]\n$EFFECT_LIST_BULLET$Eure [rivals|E] und Euer [nemesis|E]\n$EFFECT_LIST_BULLET$Charaktere mit #N -60#! oder weniger [opinion|E] von Euch\n$EFFECT_LIST_BULLET$[house_heads|E] mit der [house_relation|E] [rivalry|E]\n$EFFECT_LIST_BULLET$In der [assembly|E] können sie begnadigt oder verbannt werden\n$EFFECT_LIST_BULLET$[friends|E], [lovers|E], [soulmates|E] und [blood_brothers|E] sind ausgenommen"
 government_overthrow_enemies.1001.c.custom: "Die folgenden Patrizier werden [criminals|E]:\n$EFFECT_LIST_BULLET$Alle [Concept('powerful_vassal', 'mächtigen Vassallen')|E] mit anderer [house_ambition|E]\n$EFFECT_LIST_BULLET$Gestürzter [liege|E] und [councillors|E]\n$EFFECT_LIST_BULLET$Eure [rivals|E] und Euer [nemesis|E]\n$EFFECT_LIST_BULLET$Charaktere mit #N -60#! oder weniger [opinion|E] von Euch\n$EFFECT_LIST_BULLET$[house_heads|E] mit der [house_relation|E] [rivalry|E]\n$EFFECT_LIST_BULLET$Persönliche Feinde Eurer [agents|E]\n$EFFECT_LIST_BULLET$In der [assembly|E] können sie begnadigt werden oder ins Exil gehen"
 government_overthrow_populace.1001.a.custom: "Jedes [county|E] in Eurem [realm|E]"
 government_overthrow_populace.1001.a.description: "Ihr bietet eine Generalamnestie für alle Gegner des neuen Regimes an."
 government_overthrow_forgiven.tt: "Ihr werdet bezüglich Eurer Verbrechen gegen den Staat begnadigt"
 overthrow_government_outcome.tt.success.desc: "Ihr verteidigt wortgewandt Euer Handeln"
 overthrow_government_outcome.tt.success.toast: "Ihr beweist, dass Eure Taten nur Eurer Liebe zur Republik entsprangen"
 overthrow_government_outcome.tt.failure.desc: "Eure Ansprache stößt auf taube Ohren"
 overthrow_government_outcome.tt.failure.toast: "Ihr werdet ausgebuht und aus der Versammlung entfernt"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip|U] wurde [Select_CString(ROOT.Char.IsFemale, 'eine bescheidene Kauffrau', 'ein bescheidener Kaufmann')]"
 overthrow_government_enemy_of_the_state.tt: "Die Versammlung erklärte Euch [Select_CString(ROOT.Char.IsFemale, 'zur Staatsfeindin', 'zum Staatsfeind')]"
 overthrow_government_amnesty.tt: "Die Versammlung gewährte allen Verschwörern eine Generalamnestie."
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip|U] befahl Eure Festnahme wegen Eurer Rolle bei der Verschwörung gegen den Staat"
 overthrow_government_blanket_pardon.tt: "Regierung gestürzt: Begnadigt"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip|U] gab einen Begnadigungserlass für all [the_new_dodge.Custom('DE_PRO_POS_S_3P')]e politischen Gegner aus."
