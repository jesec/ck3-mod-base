l_german:
 merchant_house_unity: "Gesellschaftsausrichtung"
 rapacious_cs: "Raubgierig"
 rapacious_cs_desc: "#weak Die Verpflichtungen der Verwandtschaft gerieten längst in schwelendem Groll und Ehrgeiz in Vergessenheit. Die Belange der Gesellschaft stehen über denen ihrer Mitglieder: Der Gewinn geht über alles.#!"
 opportunistic_cs: "Opportunistisch"
 opportunistic_cs_desc: "#weak Widerspenstige Verwandte lehnen sich gegen die Hierarchien des Blutes auf und betrachten die Pflicht als zweitrangig gegenüber einzelnen Interessen.#!"
 balanced_cs: "Ausgeglichen"
 balanced_cs_desc: "#weak Auch wenn eine Familie ein Aushängeschild braucht, müssen ihre Mitglieder die Freiheit haben, eigene Angelegenheiten ohne Einmischung oder Verurteilung zu regeln.#!"
 grasping_cs: "Zupackend"
 grasping_cs_desc: "#weak Der Ruf der Gesellschaft und der Ruf ihrer Mitglieder sind untrennbar miteinander verbunden. Wer ein wertvoller Teil der Gesellschaft sein möchte, muss danach streben, sowohl sein Bild nach außen als auch seinen gesellschaftlichen Stand zu verbessern.#!"
 ennobled_cs: "Geadelt"
 ennobled_cs_desc: "#weak Getragen von einer aus Pflichtgefühl und Respekt erwachsenden unerschütterlichen Treue sind die Interessen des Ganzen deckungsgleich mit denen des Oberhaupts. Als eine durch familiäre Bande fest gefügte Einheit kann sich die Gesellschaft mit Adelsfamilien messen.#!"
