l_german:
 gdp_tgf_coin_artifact: "Erste Münze von [tgf_market_holder.GetFirstNameNoTooltip]"
 gdp_tgf_coin_artifact_desc: "Das Antlitz von [tgf_market_holder.GetFirstName] auf einer Seite und in Lettern im Rand, so klein, dass nur ein Kaufmann es lesen kann: [tgf_coin_merchant.GetFirstName|U] sorgte für [tgf_good.Custom('GetTradeGood')]."
 gdp_tgf_smith_weapon_axe: "[tgf_good.Custom('GetTradeGood')|U]-Axt von [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_dagger: "[tgf_good.Custom('GetTradeGood')|U]-Dolch von [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_hammer: "[tgf_good.Custom('GetTradeGood')|U]-Hammer von [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_mace: "[tgf_good.Custom('GetTradeGood')|U]-Streitkolben von [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_spear: "[tgf_good.Custom('GetTradeGood')|U]-Speer von [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_sword: "[tgf_good.Custom('GetTradeGood')|U]-Schwert von [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_desc: "Geschmiedet von [tgf_smith.GetFirstName] aus [tgf_source_county.GetNameNoTier] aus dem besten Barren, den [tgf_smith_patron.GetFirstName] je kaufte – dem Schmied nach mit einem zehnmal so hohen Wert wie das Metall."
 gdp_tgf_reading_stones_artifact_merchant: "Lesesteine von [tgf_lens_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_reading_stones_artifact_lord: "Lesesteine von [tgf_market_holder.GetFirstNameNoTooltip]"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "Zwei Linsen aus klarem Glas, geschliffen von [tgf_glassmaker.GetFirstName] aus [tgf_source_county.GetNameNoTier]. Seneca schrieb, dass kleine Lettern durch eine Kugel voll Wasser vergrößert werden. So ist auch das Kleingedruckte gut zu lesen."
 gdp_tgf_showpiece_artifact: "Kabinettschrank von [tgf_showpiece_merchant.GetFirstNameNoTooltip] aus [tgf_good.GetNameNoTooltip]"
 gdp_tgf_showpiece_artifact_desc: "Hergestellt von Meister-[tgf_good.Custom('GetTgfGoodCrafter')] [tgf_crafter.GetFirstName], jede Schublade ausgekleidet mit [tgf_good.Custom('GetTradeGood')] von [tgf_showpiece_merchant.GetFirstName]. Er öffnet sich für den Käufer und bleibt für jeden anderen verschlossen."
 gdp_tgf_curio_grain: "Garbe edles Getreide"
 gdp_tgf_curio_grain_desc: "Geschnitten auf dem besten Feld eines sehr guten Jahrs."
 gdp_tgf_curio_millet: "Krug mit alter Hirse"
 gdp_tgf_curio_millet_desc: "Jahre alt und doch so gut wie neu. Hirse ist haltbar."
 gdp_tgf_curio_rice: "Schale weißer Reis"
 gdp_tgf_curio_rice_desc: "Geschält, poliert und viel zu schön zum Essen."
 gdp_tgf_curio_meat: "Perfekt gesalzenes Stück"
 gdp_tgf_curio_meat_desc: "Gesalzen, damit es den Besitzer überdauert."
 gdp_tgf_curio_fish: "Aufgehangener Trockenfisch"
 gdp_tgf_curio_fish_desc: "Steif wie ein Brett und doppelt so stolz."
 gdp_tgf_curio_cheese: "Rad gereifter Käse"
 gdp_tgf_curio_cheese_desc: "Gepresst in einem Sommer, an den sich niemand mehr erinnert."
 gdp_tgf_curio_fruit: "Krug eingelegte Früchte"
 gdp_tgf_curio_fruit_desc: "Gezuckert, versiegelt und für einen Tag verwahrt, der sie verdient."
 gdp_tgf_curio_oil: "Krug der ersten Pressung"
 gdp_tgf_curio_oil_desc: "Grüngold, aus der ersten Pressung des Jahres."
 gdp_tgf_curio_honey: "Versiegelter Honigtopf"
 gdp_tgf_curio_honey_desc: "Dunkel wie Bernstein. Älter als die meisten Jahrgänge."
 gdp_tgf_curio_tea: "Block komprimierter Tee"
 gdp_tgf_curio_tea_desc: "Sein Gewicht in Gold wert und fern seines Gartens."
 gdp_tgf_curio_horses: "Hufeisen eines Siegers"
 gdp_tgf_curio_horses_desc: "Von einem Pferd, das noch nie ein Rennen verlor, wie der Verkäufer schwor."
 gdp_tgf_curio_cattle: "Poliertes Kuhhorn"
 gdp_tgf_curio_cattle_desc: "Auf Hochglanz poliert. Für den Umtrunk beim Festmahl."
 gdp_tgf_curio_silver: "Makelloser Silberbarren"
 gdp_tgf_curio_silver_desc: "Rein genug, um ihn mit dem Daumennagel zu ritzen, doch niemand wird das wagen."
 gdp_tgf_curio_gold: "Klümpchen Flussgold"
 gdp_tgf_curio_gold_desc: "An einem Fluss gewaschen, den niemand nennen will."
 gdp_tgf_curio_iron: "Vollkommener Eisenrohling"
 gdp_tgf_curio_iron_desc: "Dicht, dunkel und bar jeden Makels."
 gdp_tgf_curio_copper: "Funkelnder Kupferrundling"
 gdp_tgf_curio_copper_desc: "Gegossen in der Mine und so hell strahlend wie am Tag des Gusses."
 gdp_tgf_curio_beer: "Geschnitzter Humpen"
 gdp_tgf_curio_beer_desc: "Es passt genau ein ehrliches Pint hinein. Wird nur selten dafür verwendet."
 gdp_tgf_curio_wine: "Legendärer Jahrgang"
 gdp_tgf_curio_wine_desc: "Eine Flasche aus einem Jahr, von dem die Winzer heute noch flüstern."
 gdp_tgf_curio_gems: "Ungeschliffener Edelstein"
 gdp_tgf_curio_gems_desc: "So rau wie Kies und ein ganzes Dorf wert."
 gdp_tgf_curio_amber: "Bernsteinbrocken"
 gdp_tgf_curio_amber_desc: "Honigfarben mit einer darin gefangenen Fliege."
 gdp_tgf_curio_ivory: "Gravierter Elfenbeinsplitter"
 gdp_tgf_curio_ivory_desc: "Eine Stoßzahnspitze, die von jemandem mit Geduld graviert wurde."
 gdp_tgf_curio_jade: "Flussjadekiesel"
 gdp_tgf_curio_jade_desc: "Liegt kühl in der Hand, wie es bei Jade stets der Fall ist."
 gdp_tgf_curio_wood: "Knoten gemaserten Holzes"
 gdp_tgf_curio_wood_desc: "Eine Maserung wie fließendes Wasser. Die Gravierer bieten jährlich darauf."
 gdp_tgf_curio_hemp: "Vollkommene Seilschlinge"
 gdp_tgf_curio_hemp_desc: "Ein Seil, das so gleichmäßig ist, dass es gezogen und nicht gedreht wirkt."
 gdp_tgf_curio_wool: "Goldenes Vlies"
 gdp_tgf_curio_wool_desc: "Nicht das legendäre, doch den Hirten nach dicht dran."
 gdp_tgf_curio_cotton: "Büschel edle Baumwolle"
 gdp_tgf_curio_cotton_desc: "So leicht wie eine Daune und so weiß wie Frost."
 gdp_tgf_curio_flax: "Strang Seidenflachs"
 gdp_tgf_curio_flax_desc: "Flachs so fein, dass er in der Dämmerung wie Seide wirkt."
 gdp_tgf_curio_textiles: "Stoffballen eines Meisterwebers"
 gdp_tgf_curio_textiles_desc: "So dicht gewebt, dass er wasserabweisend ist."
 gdp_tgf_curio_furs: "Makelloses Winterfell"
 gdp_tgf_curio_furs_desc: "Mitten im Winter abgezogen, wenn das Fell am dichtesten ist."
 gdp_tgf_curio_leather: "Geprägtes Lederstück"
 gdp_tgf_curio_leather_desc: "Gegerbt, geprägt und weich wie Stoff."
 gdp_tgf_curio_sugar: "Weiße Zuckerhutspitze"
 gdp_tgf_curio_sugar_desc: "Der weißeste Teil des Huts, aufbewahrt zum Ausstellen."
 gdp_tgf_curio_spices: "Schachtel seltener Gewürze"
 gdp_tgf_curio_spices_desc: "Geöffnet einmal im Jahr als Beweis, dass es sie noch gibt."
 gdp_tgf_curio_ceramics: "Makellos glasierte Schale"
 gdp_tgf_curio_ceramics_desc: "Läutet wie eine Glocke, wenn man sie anschlägt – was aber niemand tut."
 gdp_tgf_curio_glass: "Klare Glasphiole"
 gdp_tgf_curio_glass_desc: "Nicht eine einzige Blase. Der Glasbläser konnte sich stolz zur Ruhe setzen."
 gdp_tgf_curio_jewelry: "Meisterwerkbrosche"
 gdp_tgf_curio_jewelry_desc: "Allein die Fertigung der Nadel brauchte fast einen Monat."
 gdp_tgf_curio_lacquerware: "Lackierte Andenkenschachtel"
 gdp_tgf_curio_lacquerware_desc: "Dreißig aufgetragene Schichten überstrahlen das Geschenk darin."
 gdp_tgf_curio_silk: "Vollkommener Seidenrest"
 gdp_tgf_curio_silk_desc: "Prachtstück eines Webstuhls, das dem Markt vorenthalten wurde."
 gdp_tgf_curio_incense: "Klumpen blasses Harz"
 gdp_tgf_curio_incense_desc: "Unverbrannt süß. Verbrannt noch süßer. Was es niemals wird."
 gdp_tgf_curio_medicaments: "Apothekerproben"
 gdp_tgf_curio_medicaments_desc: "Eine Dosis von jedem, hilft gegen alles."
 gdp_tgf_curio_stone: "Graviertes Steinfragment"
 gdp_tgf_curio_stone_place: "Gravierter Stein aus [tgf_source_county.GetNameNoTierNoTooltip]"
 gdp_tgf_curio_stone_desc: "Älter als jeder noch lebende Steinmetz und besser geschnitten."
 gdp_tgf_curio_salt: "Kuchen reinweißen Salzes"
 gdp_tgf_curio_salt_desc: "Weiß wie Schnee, was graues Salz nie ist."
 gdp_tgf_curio_alum: "Faustgroßer Alaunkristall"
 gdp_tgf_curio_alum_desc: "So klar wie Eis und scharf auf der Zunge."
 gdp_tgf_curio_dyes: "Phiole mit wahrem Purpur"
 gdp_tgf_curio_dyes_desc: "Eine Farbe, die einst Kaisern vorbehalten war. Theoretisch ist sie dies immer noch."
 gdp_tgf_curio_books_paper: "Illuminierte Seite"
 gdp_tgf_curio_books_paper_desc: "Die vollkommene Seite eines Buches, das niemand finden kann."
 gdp_tgf_itinerary_artifact: "Pilgerreise-Tagebuch"
 gdp_tgf_itinerary_artifact_desc: "Ein abgewetztes kleines Buch mit Straßen, Gasthäusern und Furten, die sorgsam verzeichnet wurden. Einige dieser Orte sind nicht einmal auf Karten zu finden"
 gdp_tgf_first_sale_artifact: "Ur-[tgf_good.GetNameNoTooltip] von [tgf_first_seller.GetFirstNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "Das erste bisschen [tgf_good.Custom('GetTradeGood')], das [tgf_first_seller.GetFirstName] je verkaufte, zum doppelten Preis zurückgekauft und gerahmt. Es steht nicht zum Verkauf. Wahrscheinlich."
 gdp_tgf_merchant_portrait_artifact: "Porträt eines Kaufmanns"
 gdp_tgf_merchant_portrait_artifact_desc: "Ein Händler am Zähltisch, gemalt mit einem Haufen Münzen und einem Ausdruck tiefer Zufriedenheit."
 gdp_tgf_bale_book_artifact: "Buch aus der Ladung"
 gdp_tgf_bale_book_artifact_desc: "Jemand wollte damit die Feuchtigkeit aus den Waren eines Kaufmanns halten. Es klappte in weiten Teilen auch."
 gdp_tgf_handbook_practice_artifact: "Praktik des Handels"
 gdp_tgf_handbook_practice_artifact_desc: "Gewichte, Maßeinheiten, Straßen und Preise, die von einem Kaufmann festgehalten wurden, der offenbar nie schlief. Am Rand stellte jemand eigene Berechnungen an."
 gdp_tgf_handbook_roads_artifact: "Buch der Straßen und Märkte"
 gdp_tgf_handbook_roads_artifact_desc: "Jede Straße zwischen den großen Märkten, mit Zöllen, Gasthäusern und den betrügerischen Fährleuten."
 gdp_tgf_handbook_mirror_artifact: "Händlerspiegel"
 gdp_tgf_handbook_mirror_artifact_desc: "Ratschläge für Händler: was man kaufen soll, wem man vertrauen kann. Vor allem dreht es sich aber darum, wem man nicht vertrauen kann."
