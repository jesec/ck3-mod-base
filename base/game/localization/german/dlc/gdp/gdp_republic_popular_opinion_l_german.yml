l_german:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "Niedrige Volksmeinung: Unruhiges Volk"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "Niedrige Volksmeinung: Stadt in der Krise"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "Hohe Volksmeinung: Gute Laune"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "Hohe Volksmeinung: Stadt erblüht"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "Wirtschaftliche Stagnation"
 gdp_popular_opinion_mild_neg_prosperity_desc: "Die öffentliche Unzufriedenheit sorgt dafür, dass die Bürger nur zögerlich in die Stadt investieren und das langfristige Wachstum daher nur schleppend vorangeht."
 gdp_popular_opinion_mild_neg_taxes: "Steuervermeidung"
 gdp_popular_opinion_mild_neg_taxes_desc: "Aufgebrachte Bürger suchen nach Wegen, um keine Abgaben zu leisten, was die Einnahmen aller Stadtbezirke verringert."
 gdp_popular_opinion_mild_neg_construction: "Bauverzögerungen"
 gdp_popular_opinion_mild_neg_construction_desc: "Arbeiter und Handwerker tragen weniger bei als üblich, was die Kosten erhöht und den Baufortschritt verlangsamt."
 gdp_popular_opinion_mild_neg_defense: "Unterbesetzte Mauern"
 gdp_popular_opinion_mild_neg_defense_desc: "Die Bürger sind nicht bereit, in der Miliz zu dienen, sodass die Verteidigung der Stadt unterbesetzt bleibt."
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "Wirtschaftskollaps"
 gdp_popular_opinion_severe_neg_prosperity_desc: "Tiefe Unruhe hat die Wirtschaft der Stadt zerschlagen. Das Wachstum ist eingeschlafen, und der Wohlstandsbestand beginnt zu verfallen."
 gdp_popular_opinion_severe_neg_taxes: "Steueraufstand"
 gdp_popular_opinion_severe_neg_taxes_desc: "Offener Widerstand gegen die Besteuerung breitete sich in allen Bezirken der Stadt aus und schadet den öffentlichen Einnahmen deutlich."
 gdp_popular_opinion_severe_neg_construction: "Bauarbeiterstreik"
 gdp_popular_opinion_severe_neg_construction_desc: "Zünfte und Arbeiter verweigern den Dienst. Der Bau geht nur äußerst langsam und teuer voran."
 gdp_popular_opinion_severe_neg_defense: "Garnisonsfahnenflucht"
 gdp_popular_opinion_severe_neg_defense_desc: "Soldaten geben ihre Posten auf oder verweigern den Dienst. Die Mauern der Stadt bleiben unbesetzt."
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "Bürgerliche Investitionen"
 gdp_popular_opinion_mild_pos_prosperity_desc: "Ein selbstbewusstes Bürgertum setzt auf die Zukunft der Stadt und stärkt sanft den langfristigen Wohlstand."
 gdp_popular_opinion_mild_pos_taxes: "Bereitwillige Steuerzahler"
 gdp_popular_opinion_mild_pos_taxes_desc: "Die Bürger zahlen ohne Murren ihre Steuern, was für mehr Einnahmen in allen Bezirken der Stadt sorgt."
 gdp_popular_opinion_mild_pos_construction: "Bürgerlicher Begeisterung"
 gdp_popular_opinion_mild_pos_construction_desc: "Zünfte und Handwerker tragen eifrig zum Wachstum der Stadt bei, was Baukosten und -zeiten neuer Arbeiten verringert."
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "Goldenes Zeitalter des Wohlstands"
 gdp_popular_opinion_strong_pos_prosperity_desc: "Die Stadt ist voll Zuversicht. Bürger und Kaufleute investieren freimütig, was für einen starken und anhaltenden Zuwachs sorgt."
 gdp_popular_opinion_strong_pos_taxes: "Überquellende Schatztruhen"
 gdp_popular_opinion_strong_pos_taxes_desc: "Der Stolz der Leute auf ihre Stadt spiegelt sich unmittelbar in großzügigen Steuerzahlungen in allen Bezirken wider."
 gdp_popular_opinion_strong_pos_construction: "Meisterlicher Bau"
 gdp_popular_opinion_strong_pos_construction_desc: "Die besten Kunst- und andere Handwerker streben danach, in der Stadt zu arbeiten, was die Kosten verringert und alle Vorhaben beschleunigt."
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "Vorsichtige Verkäufer"
 gdp_popular_opinion_mild_neg_sell_price_desc: "Unruhe in der Stadt macht die Händler vorsichtig: Sie halten Waren zurück und verringern Preise überall auf dem Markt."
 gdp_popular_opinion_mild_neg_capacity: "Marktzögerlichkeit"
 gdp_popular_opinion_mild_neg_capacity_desc: "Die schrumpfende Zuversicht sorgt dafür, dass einige Händler ihre Präsenz verringern und die Kapazität des Markts verengen."
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "Marktpanik"
 gdp_popular_opinion_severe_neg_sell_price_desc: "Die Krise auf den Straßen ließ die Preise stark ansteigen, da Käufer ihre Waren auf einem zusammenbrechenden Markt verschleudern wollen."
 gdp_popular_opinion_severe_neg_capacity: "Flucht der Kaufleute"
 gdp_popular_opinion_severe_neg_capacity_desc: "Bekannte Händler ziehen sich ganz aus der Stadt zurück, sodass der Handelsmarkt sich dramatisch verkleinert."
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "Selbstbewusste Verkäufer"
 gdp_popular_opinion_mild_pos_sell_price_desc: "Eine zuversichtliche Stimmung in der Stadt stärkt das Selbstbewusstsein der Verkäufer, sodass die Preise auf dem gesamten Markt steigen."
 gdp_popular_opinion_mild_pos_capacity: "Wachsender Markt"
 gdp_popular_opinion_mild_pos_capacity_desc: "Zuversicht zieht neue Händler und Kaufleute in die Stadt, sodass sich die Kapazität des Markts leicht ausdehnt."
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "Blühender Handel"
 gdp_popular_opinion_strong_pos_sell_price_desc: "Außerordentlicher Bürgerstolz machte die Güte der Waren auf dem Markt weithin bekannt, sodass sie alle beste Preise erzielen."
 gdp_popular_opinion_strong_pos_capacity: "Gedeihender Markt"
 gdp_popular_opinion_strong_pos_capacity_desc: "Der Ruf der Stadt zieht Kaufleute aus nah und fern an, was die Handelskapazität beträchtlich ausweitet."
