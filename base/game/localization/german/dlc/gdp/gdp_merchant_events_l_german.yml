 gdp_merchant.3000.t: "Der Ratschlag [Select_CString(translator.IsFemale, 'einer Übersetzerin', 'eines Übersetzers')]"
 gdp_merchant.3000.desc: "[Select_CString(translator.IsFemale, 'Meine Übersetzerin', 'Mein Übersetzer')] [translator.GetTitledFirstName] taucht endlich wieder auf, nachdem [translator.Custom('DE_PRO_PER_S_3P_N')] sich für einige Zeit zurückzog, weil [translator.Custom('DE_PRO_PER_S_3P_N')] wohl an dem einen oder anderen fremdländischen Text arbeitete.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]!“ [translator.Custom('DE_PRO_PER_S_3P_N')|U] strahlt übers ganze Gesicht „Ich sah mir Berichte an, die aus einem gewissen Markt ([market.GetName]) stammen. Die [saved_culture.GetLanguage.GetName|l]e Kurzschrift war schwierig, doch es steht viel über die Bewegung einheimischer Waren dort drin!“"
 gdp_merchant.3000.a: "„Ich will jedes letzte Fitzelchen, [translator.GetFirstNameNoTooltip]!“"
 gdp_merchant.3000.a.tt: "[company|E] erlangt [trade_expertise|E] in allen [trade_categories_short|E], die auf einem gewissen Markt ([market.GetName]) gehandelt werden"
 gdp_merchant.3000.b: "„Könntet Ihr mir diese Sprache beibringen?“"
 gdp_merchant.3000.b.tt: "Euer [scheme|E] erhält: [GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]"
 gdp_merchant.3000.c: "„Verkauft die Erkenntnisse an den Meistbietenden.“"
 gdp_merchant.3000.d: "„Konzentriert Euch auf Eure Sprachfähigkeiten.“"
 gdp_merchant_translator_buff_modifier: "Übersetzungstutor"
 gdp_merchant.3010.t: "Der Fund [Select_CString(fixer.IsFemale, 'einer Ausputzerin', 'eines Ausputzers')]"
 gdp_merchant.3010.desc: "[Select_CString(fixer.IsFemale, 'Meine Ausputzerin', 'Mein Ausputzer')] [fixer.GetTitledFirstName] trieb sich schon einige Zeit heimlich und hartnäckig in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] herum und vereinbarte nun endlich ein Treffen, mit einer vagen Notiz, [fixer.Custom('DE_PRO_PER_S_3P_N')] habe die #EMP Waren#!gefunden.\n\n[fixer.Custom('DE_PRO_PER_S_3P_N')|U] setzt sich geheimnistuerisch hin"
 gdp_merchant.3010.desc.secret: "und lächelt dann. „Ich musste ein Weilchen suchen, doch ich habe hier den Beweis, dass [secret_haver.GetName] ganz sicher etwas ganz Besonderes ([secret.GetName]) ist!“"
 gdp_merchant.3010.desc.scheme: "und macht ein besorgte Gesicht. „Ich bringe üble Kunde, [ROOT.Char.GetTitleAsNameNoTooltip]. Ich entdeckte, dass [scheme_owner.GetName] ein Komplott gegen Euch plant – gegen die Gesellschaft!“"
 gdp_merchant.3010.a: "„Äußerst nützlich. Bringt mir mehr!“"
 gdp_merchant.3010.b: "„Ihr seid ganz schön gerissen, nicht wahr, [fixer.GetFirstNameNoTooltip]?“"
 gdp_merchant.3010.c: "„Ich handle nicht mit unrechtmäßig erworbenem Klatsch.“"
 gdp_merchant.3010.d: "„Das könnte für meine Arbeit nützlich sein …“"
 gdp_merchant.3020.t: "Das polternde Gehabe [Select_CString(bailiff.IsFemale, 'einer Landvogtin', 'eines Landvogts')]"
 gdp_merchant.3020.desc: "[Select_CString(bailiff.IsFemale, 'Meine Landvogtin', 'Mein Landvogt')] [bailiff.GetTitledFirstName] schaut durch die Listen der Schuldner und druckst herum, wie viel Druck wohl ausgeübt werden muss, damit wir unsere [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] möglichst rasch zurückbekommen.\n\n"
 gdp_merchant.3020.pressure: "„[pressure_debtor_1.GetTitledFirstName|U] fehlen die Mittel, könnte aber zumindest eine Geste des guten Willens zeigen, indem die Schulden bedient werden …“, grollt [bailiff.GetFirstNameNoTooltip].\n\n"
 gdp_merchant.3020.demand: "[bailiff.Custom('DE_PRO_PER_S_3P_N')|U] seufzt. „Ich weiß sicher, dass [demand_debtor_1.GetTitledFirstName] zahlen kann … [demand_debtor_1.Custom('DE_PRO_PER_S_3P_N')|U] hält sich einfach für etwas Besseres als wir!“\n\n"
 gdp_merchant.3020.third: "„Und dann wäre da noch [portrait_3.GetTitledFirstName] …“, murmelt [bailiff.Custom('DE_PRO_PER_S_3P_N')]."
 gdp_merchant.3020.a: "„Ja, sicherlich kann sich [pressure_debtor_1.GetFirstNameNoTooltip] eine #EMP kleine#! Summe leisten?“"
 gdp_merchant.3020.a.tt: "Wird Euch [gold_i]#V -[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#! weniger schulden"
 gdp_merchant.3020.b: "„Legt [demand_debtor_1.GetTitledFirstNameNoTooltip] die Daumenschrauben an …“"
 gdp_merchant.3020.c: "„[pressure_debtor_2.GetFirstNameNoTooltip|U] kann sich eine kleine Zahlung leisten.“"
 gdp_merchant.3020.d: "„[demand_debtor_2.GetFirstNameNoTooltip|U] hält uns eindeutig hin!“"
 gdp_merchant.3020.e: "„Erinnert [pressure_debtor_3.GetFirstNameNoTooltip] an [pressure_debtor_3.Custom('DE_PRO_POS_S_3P')]e Verpflichtungen.“"
 gdp_merchant.3020.f: "„Es ist an der Zeit, [demand_debtor_3.GetFirstNameNoTooltip] gegenüber deutlich zu werden.“"
 gdp_merchant.3020.g: "„Ich würde sie lieber in meiner Schuld behalten.“"
 ho_loan_demand_refused_title: "Darlehensforderung abgelehnt"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName|U] schuldet Euch noch [gold_i][outstanding|V0]"
 ho_loan_reduced_title: "Darlehen verringert"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName|U] schuldet Euch nun [gold_i][outstanding|V0]"
 gdp_merchant.3031.t: "Der Feuereifer [Select_CString(market_agent.IsFemale, 'einer Agentin', 'eines Marktagenten')]"
 gdp_merchant.3031.desc: "[Select_CString(market_agent.IsFemale, 'Meine Marktagentin', 'Mein Marktagent')] [market_agent.GetTitledFirstName] war bis in die frühen Morgenstunden auf und ging die Hauptbücher durch, während die Kerzen allmählich neben [market_agent.Custom('DE_PRO_PER_S_3P_D')] herunterbrannten. [market_agent.Custom('DE_PRO_PER_S_3P_N')|U] blinzelt mit müden Augen, als [market_agent.Custom('DE_PRO_PER_S_3P_N')] an diesem Morgen meine Schreibstube betritt.\n\n„[ROOT.Char.GetTitledFirstName]! Ich bin die Bücher für einen gewissen Markt ([market.GetName]) durchgegangen, und da gibt es eine gute Gelegenheit, die wir –“ #weak *gähn*#! „Wir wären töricht, sie nicht zu nutzen!“"
 gdp_merchant.3031.a: "„Gute Arbeit, [market_agent.GetFirstNameNoTooltip]. Jetzt schlaft ein wenig!“"
 gdp_merchant.3031.a.tt: "Eine [trade_opportunity|E] [trade_opportunity.GetType.GetName|V] ergibt sich für einen gewissen Markt ([market.GetName])"
 gdp_merchant.3031.b: "„Kümmert Euch nicht darum, sondern widmet Euch ganz unseren derzeitigen Sorgen!“"
 gdp_merchant.3040.t: "Die Sorge [Select_CString(antiquarian.IsFemale, 'einer Konservatorin', 'eines Konservators')]"
 gdp_merchant.3040.desc: "[Select_CString(antiquarian.IsFemale, 'Meine Konservatorin', 'Mein Konservator')] [antiquarian.GetTitledFirstName] passt gut auf die Sammlung des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) auf und stellt sicher, dass alles sicher verwahrt und in gutem Zustand ist. Vereinzelten Gästen stellt [antiquarian.Custom('DE_PRO_PER_S_3P_N')] interessante Teile davon vor.\n\nAls ich eines Morgens eines unserer Artefakte ([artifact.GetName]) bewundere, erscheint [antiquarian.Custom('DE_PRO_PER_S_3P_N')] wie auf Zuruf. „Ah, [ROOT.Char.GetTitleAsNameNoTooltip], das ist ein sehr besonderes Stück. Aber dennoch frage ich mich bisweilen: Kann es mit dem Rest der Sammlung mithalten?“"
 gdp_merchant.3040.b: "„Es ist an der Zeit, dass wir uns davon trennen. Findet einen Käufer.“"
 gdp_merchant.3040.c: "„Es könnte vielleicht eine Überarbeitung gebrauchen.“"
 gdp_merchant.3040.c.tt: "Das Artefakt ([artifact.GetName]) ist bereits in einem hervorragenden Zustand"
 gdp_merchant.3040.c.tt.creature: "Das Artefakt ([artifact.GetName|U]) ist eine #V Kreatur#!"
 gdp_merchant.3040.d: "„Unsinn. Die Sammlung ist tadellos.“"
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "Ein einfacher Stadtbewohner würde es wohl kaum glauben, welche Reise ein simples Stück Stoff hinter sich hat, durch brennende Wüsten hindurch und über wogende Meere hinweg, um schließlich an einem Marktstand zu liegen.\n\nDiese Mühen von Händler, Tier und Schiff gehören zum Alltag unseres Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]). Sogar weit entfernte Städte, in denen man kein Wort [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|U] spricht, sind auf unsere Lieferungen angewiesen."
 gdp_merchant.8000.a: "Ein Ruf, der der Gesellschaft angemessen ist!"
 gdp_merchant.8000.b: "Aber ich darf meine Wurzeln nicht vergessen."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "Kostbarer noch als die Ballen und Stoffrollen der Tauschwaren oder die wertvollen Steine und Metalle der Erde sind die Wunder, die durch talentierte Hände aus ihnen erschaffen werden.\n\nRaffinierte Vorrichtungen, atemberaubender Schmuck und feine Handwerkskunst sind das Lebenselixier unseres Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]), und unser Name steht für Qualität und Vertrauen."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "Selbst der größte König kann so machtlos werden wie ein Bettler, wenn das Geld zu fließen aufhört, aber Kredite ihn umgeben wie die Fäden eines Spinnennetzes.\n\n Der Name unserer Unternehmung ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) erklingt an allen Höfen des Landes, wo man sich darauf verlässt, dass sie vermittelt und Geschäfte abschließt und stets bereit ist, in schweren Zeiten zu helfen, doch man sollte sie nie leichtfertig ausnutzen."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "Ein Buch der Reisen"
 gdp_merchant.8010.desc: "Nur wenige haben so viel gesehen, und keiner davon die Gesamtheit meiner einzigartigen Erfahrung. Für den Bettler wie den Potentaten liegen die fernen Lande dieser Welt wie in einem Dunst, und man sehnt sich nach Einsicht und Unterhaltung, die den Schleier lüften.\n\nAls ich mich hinsetze, denke ich über die packendsten Augenblicke meiner Reisen in [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier] nach und frage mich, was Fremde und meine Nachkommen wohl am meisten hören wollen."
 gdp_merchant.8010.a: "Ich werde mich ganz den fremden Bräuchen und der Etikette widmen."
 gdp_merchant.8010.a.tt: "Die Güte dieses Buchs hängt stark von Eurer [trait_level_track_xp|E] ab als: [GetTrait('lifestyle_merchant').GetTraitTrackByKey('caravaneer').GetName|V] #weak ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])#! und [GetTrait('lifestyle_traveler').GetTraitTrackByKey('travel').GetName|V] #weak ([GetTrait('lifestyle_traveler').GetName(GetNullCharacter)])#! "
 gdp_merchant.8010.b: "Die Leser suchen nach Handelsideen und Markteinblicken."
 gdp_merchant.8010.c: "Meine Arbeit wird exotische Städte und Wunder beschreiben."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "Es brauchte länger, als ich dachte, doch schließlich bin ich irgendwie zufrieden mit meiner Kritzelei. Ich schrieb meine Reise an einen besonderen Ort ([poi.GetName]) auf, schmückte sie mit Anekdoten von unterwegs aus und warf einen klaren Blick auf ein exotisches Thema ([author.Custom('GetTravelogueTopic')]).\n\n"
 gdp_merchant.8011.weak: "Als ich durchblättere, bin ich selbst enttäuscht und frage mich, ob ich mich hätte mehr bemühen sollen, doch leider ist es nun Zeit, meinen Federkiel niederzulegen."
 gdp_merchant.8011.mid: "Als ich durchblättere, bin ich stolz auf den Umfang meiner Arbeit, aber dennoch habe ich das Gefühl, das noch etwas Besonderes fehlt."
 gdp_merchant.8011.great: "Als ich durchblättere, muss ich über meine eigenen Worte lachen und manche Beschreibungen fesseln mich so sehr, als würde ich den betreffenden Vorfall erneut durchleben. Das sollte in Erinnerung bleiben!"
 gdp_merchant.8011.a: "Ich werde das vorerst für mich behalten."
 gdp_merchant.8011.b: "Das soll in die Bibliothek der Gesellschaft gehen."
 travelogue_description_full: "Das ist ein fantastischer Reisebericht aus [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier], verfasst [Select_CString(author.IsFemale, 'von der Kaufmännin', 'vom Kaufmann')] [author.GetTitledFirstName]. Er gewährt Einsichten in [author.Custom('DE_PRO_POS_S_3P')]e Erfahrungen mit fremden Besonderheiten ([author.Custom('GetTravelogueTopic')]).\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "Die Reisen von [author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]"
 travelogue_name_2: "Die Reise nach [poi.GetCounty.GetName]"
 travelogue_name_3: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]: [Select_CString(author.IsFemale, 'Die', 'Der')] Reisende"
 travelogue_name_4: "Nach [poi.GetCounty.GetName]"
 travelogue_name_5: "Abenteuer in [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_6: "[author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip|U]e Reisen"
 travelogue_name_7: "Ferne Lande"
 travelogue_name_8: "Hin und zurück"
 travelogue_name_9: "Die [poi.GetCulture.GetCollectiveNounNoTooltip]"
 travelogue_name_10: "[poi.GetNameNoTierNoTooltip], [poi.GetTitle.Custom('BaronyTownType')|U] voller Geheimnisse"
 travelogue_name_11: "Die Tausend"
 travelogue_name_12: "Die Reisen"
 travelogue_name_13: "Die Reise"
 travelogue_name_14: "Abenteuer von [author.GetFirstNameNoTooltip|U]"
 travelogue_topic_customs: "Bräuche"
 travelogue_topic_markets: "Märkte"
 travelogue_topic_places: "Orte"
 travelogue_description_quality_weak: "Das Buch ist schlecht geschrieben und stammt aus dem Reich der Fantasie."
 travelogue_description_quality_mid: "Das Buch enthält mehrere aufschlussreiche Passagen."
 travelogue_description_quality_great: "Das Buch ist fesselnd, dramatisch und vortrefflich geschrieben."
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: Neugieriger Besucher"
 gdp_merchant.8021.suzerain: "[Select_CString(visitor.IsFemale, 'Meine Gönnerin', 'Mein Gönner')] [visitor.GetTitledFirstName] bereitet mir eine große Ehre und"
 gdp_merchant.8021.merchant: "[visitor.GetTitledFirstName|U], [Select_CString(visitor.IsFemale, 'Kauffrau und Besitzerin', 'Kaufmann und Besitzer')] einer eigenen Gesellschaft ([visitor.GetPrimaryTitle.GetDefinitiveName]),"
 gdp_merchant.8021.laamp: "[visitor.GetTitledFirstName|U], [Select_CString(visitor.IsFemale, 'Anführerin', 'Anführer')] einer Reisegruppe mit illustrem Namen ([visitor.GetPrimaryTitle.GetDefinitiveName]),"
 gdp_merchant.8021.ruler: "[visitor.GetTitledFirstName|U], [Select_CString(visitor.IsFemale, 'eine örtliche Herrscherin', 'ein örtlicher Herrscher')], bereitet mir eine angenehme Überraschung und"
 gdp_merchant.8021.fallback: "[visitor.GetTitledFirstName|U], [Select_CString(visitor.IsFemale, 'eine demütige Reisende', 'ein demütiger Reisender')],"
 gdp_merchant.8021.desc: "besucht mich in meiner Residenz.\n\n[visitor.Custom('DE_PRO_PER_S_3P_N')|U] strahlt, als [visitor.Custom('DE_PRO_PER_S_3P_N')] unsere Sammlung erblickt, und ist von Staunen ergriffen.\n\n„Seid gegrüßt, [ROOT.Char.GetTitledFirstNameNoTooltip]! Ich hörte Geschichten über die Heldentaten Eurer Gesellschaft und Eure exotische Sammlung … Darf ich Euch ganz ku…“ [visitor.Custom('DE_PRO_PER_S_3P_N')|U] schnappt nach Luft und wird zu einem Artefakt ([artifact.GetName]) hingezogen.\n\n„Oh! Was haben wir denn hier …?“"
 gdp_merchant.8021.curio: "[visitor.Custom('DE_PRO_PER_S_3P_N')|U] untersucht es aus allen Richtungen, entschlossen, seine ganze Geschichte zu erfahren, bevor [visitor.Custom('DE_PRO_PER_S_3P_N')] zufrieden ist."
 gdp_merchant.8021.library: "[visitor.Custom('DE_PRO_PER_S_3P_N')|U] blättert vorsichtig durch die Seiten, während [visitor.Custom('DE_PRO_PER_S_3P_N')] unzählige Fragen stellt."
 gdp_merchant.8021.creature: "[visitor.Custom('DE_PRO_PER_S_3P_N')|U] bestaunt seine Anmut und beobachtet voller Freude seine Fütterungszeit."
 gdp_merchant.8021.a: "Ja, das ist wirklich etwas Besonderes."
 gdp_merchant.8021.b: "Wollt Ihr das haben?"
 gdp_merchant.9021.opening: "Seid gegrüßt, [merchant.GetTitledFirstNameNoTooltip],"
 gdp_merchant.9021.diarch.desc: "Als [commissioner.GetDiarchTitle] von [commissioner.GetName] will ich die Dienste einer gewissen Gesellschaft ([merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) in Anspruch nehmen."
 gdp_merchant.9021.no_diarch.desc: "Ich will die Dienste einer gewissen Gesellschaft ([merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) in Anspruch nehmen."
 gdp_merchant.9021.desc: "\n\nEs herrscht ein Mangel in Sachen [target.GetName] auf einem gewissen Markt ([trade_market.GetName]). Bringt Waren in die Gegend, und Ihr werdet angemessen entschädigt."
 gdp_merchant.9021.a: "Eure Kommission wurde angenommen."
 gdp_merchant.9021.b: "Ich muss höflich ablehnen."
 gdp_merchant.9021.b.cooldown_tt: "Ihr erhaltet für #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! Jahre keine andere [Concept('commission', 'Kommissionsanfrage')|E]"
 gdp_merchant.9005.t: "Hinausgedrängt"
 gdp_merchant.9005.desc_intro: "Mein[courtier.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] stürzt mit gerötetem Gesicht in die Schreibstube meines Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]).\n\n„Ich bringe Kunde von [Select_CString(expeller.IsFemale, 'unserer Gönnerin', 'unserem Gönner')] [expeller.GetTitledFirstName],“ sagt [courtier.Custom('DE_PRO_PER_S_3P_N')]. „Unsere Gesellschaft soll die Konten schließen und [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] umgehend verlassen!“\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U] befahl meinem Unternehmen ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]), dieses Reich ([expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) zu verlassen.\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "Das Vertrauen von [expeller.GetTitledFirstNameNoTooltip] in uns ist abgenutzt."
 gdp_merchant.9005.desc_body.enemies: "Gibt es für die Feindseligkeit von [expeller.GetTitledFirstNameNoTooltip] denn keine Grenzen?"
 gdp_merchant.9005.desc_body.fallback: "Nach allem, was wir hier getan haben …"
 gdp_merchant.9005.a: "Nun ist es also so weit gekommen."
 gdp_merchant.9005.a.tt: "Eure [company|E] wird das [realm|E] von [expeller.GetShortUIName] verlassen"
 gdp_merchant.9100.t: "Das Patrizierhaus von [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9100.desc: "Nachdem wir uns ausreichend vor den hochmütigen Familien von [new_patrician_liege.GetPrimaryTitle.GetNameNoTier] bewiesen und [new_patrician_liege.GetTitledFirstName] mit den richtigen #emp Anreizen#! ausstatteten, wurde meiner Bitte um unsere Erhebung stattgegeben.\n\nEndlich besitze ich die Dokumente, die versichern, dass [ROOT.Char.GetHouse.GetBaseName] ohne jeden Zweifel kein einfaches Kaufmannshaus mehr ist, sondern unter den anderen angesehenen Patrizierfamilien in der Versammlung von [new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] sitzt und selbst dem Haus [new_patrician_liege.GetHouse.GetBaseName] vor dem Gesetz ebenbürtig ist!"
 gdp_merchant.9100.a: "Ich kann meine erste Sitzung in der Versammlung kaum erwarten."
 merchant_patrician_transition_domicile_tt: "Eure [domicile_buildings|E] wurden einbehalten"
 gdp_merchant.9110.t: "Das Handelshaus [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9110.desc: "Mit der Zerstörung der alten Republik wurden Haus [ROOT.Char.GetHouse.GetBaseName] und andere stolze Patrizierfamilien aus [new_merchant_location.GetBaronyNameExplicitly] zu einfachen Handelshäusern degradiert und sind nun abhängig von den Launen des Schicksals und [Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'der örtlichen Herrscherin', 'des örtlichen Herrschers')], [ROOT.Char.GetSuzerain.GetTitledFirstName].\n\nDer Versammlung und dem Schutz unserer Republik beraubt müssen wir den Gesetzen des Reichs ([ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier]) vertrauen, wenn wir den Anschein unseres früheren Daseins aufrechterhalten wollen."
 gdp_merchant.9110.a: "Wie konnte es dazu kommen …"
 broke_deal_opinion: "Geplatztes Geschäft"
 gdp_repudiated_my_loan_opinion: "Wies mein Darlehen zurück"
 gdp_interest_free_loan_opinion: "Ohne Zinsen verliehen"
 gdp_usurious_loan_opinion: "Verlieh mir Gold zu Wucherzinsen"
 gdp_merchant_unity_intermarriage_desc: "heiratete in ein anderes [Concept('merchant', 'Kaufmanns')|E]-[house|E] ein"
 gdp_merchant_unity_noble_marriage_desc: "heiratete in ein adliges [house|E] ein"
 gdp_merchant.2000.t: "Nackter Markt: [needed_good.GetNameNoTooltip]"
 gdp_merchant.2000.desc.intro: "Ich gehe durch die "
 gdp_merchant.2000.desc.disaster: "katastrophengeplagten "
 gdp_merchant.2000.desc.war: "vom Krieg verwüsteten "
 gdp_merchant.2000.desc.plague: "pestverseuchten "
 gdp_merchant.2000.desc.unrest: "unruhigen "
 gdp_merchant.2000.desc.stalls: "Straßen von [starving_province.GetNameNoTooltip] und bemerke, dass die üblicherweise überfüllte Handelsstätte ([starving_province.Custom('GetRegionalMarketTermGloss')]) verstummt ist.\n\nDie Lebensmittelstände sind nahezu leer, bis auf etwas Altes ([ROOT.Char.Custom('GetLocalStreetFoodPlural')]) und Verdorbenes ([ROOT.Char.Custom('RegionalRootVegetablePlural')]). Abgemagerte Männer und Frauen durchwühlen den Abfall am Straßenrand."
 gdp_merchant.2000.a: "Ich sollte mich an das klammern, was noch übrig ist."
 gdp_merchant.2000.b: "Die Leute werden jemanden suchen, dem sie die Schuld geben können."
 gdp_merchant.2000.c: "Das geht mich nichts an."
 gdp_merchant.2010.t: "Monopol in Sachen [craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip]:"
 gdp_merchant.2010.t.smith: "Der Schmied"
 gdp_merchant.2010.t.goldsmith: "Der Goldschmied"
 gdp_merchant.2010.t.carpenter: "Der Schreiner"
 gdp_merchant.2010.t.tanner: "Der Gerber"
 gdp_merchant.2010.t.potter: "Der Töpfer"
 gdp_merchant.2010.desc.intro: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] sprach unaufhörlich von [Select_CString(craftsman.IsFemale, 'der meisterlichen Handwerkerin', 'dem meisterlichen Handwerker')] [craftsman.GetFirstName] aus [workshop_province.GetName]. Als ich nun [craftsman.Custom('DE_PRO_POS_S_3P')] Werk bestaune, verstehe ich die ganze Aufregung.\n\n[craftsman.GetFirstNameNoTooltip|U] begrüßt mich, ohne den Blick von [craftsman.Custom('DE_PRO_POS_S_3P')]er Arbeit zu heben. „Bitte. Seht Euch meine Waren in aller Ruhe an.“\n\nIch bin vor Ehrfurcht ergriffen von "
 gdp_merchant.2010.desc.weapon: "einer prächtigen Waffe."
 gdp_merchant.2010.desc.chalice: "einem kunstvoll gearbeiteten Kelch."
 gdp_merchant.2010.desc.box: "einer kunstvoll geschnitzten hölzernen Kiste."
 gdp_merchant.2010.desc.saddle: "einem perfekt geformten Sattel."
 gdp_merchant.2010.desc.vase: "einer fein bemalten Keramikvase."
 gdp_merchant.2010.desc.craftsmanship: "Das ist keine gewöhnliche Handwerkskunst."
 gdp_merchant.2010.a: "Ein Talent wie dieses sollte nicht vergeudet werden."
 gdp_merchant.2010.b: "Vielleicht könntet Ihr [associate.GetFirstNameNoTooltip] das ein oder andere beibringen."
 gdp_merchant.2010.c: "Ich würde gern bleiben und Euer Handwerk beobachten."
 gdp_merchant.2015.t: "Der Preis in Sachen [counsel_good.GetNameNoTooltip]"
 gdp_merchant.2015.desc: "Ich erhielt einen unerwarteten Ruf [Select_CString(target_character.IsFemale, 'meiner Gönnerin', 'meines Gönners')] [patron.GetTitledFirstName]. Aufgrund [patron.Custom('DE_PRO_POS_S_3P')]er [patron.Custom('quirk_neg_adjective')|l]en Natur betrete ich den Raum mit Beklommenheit.\n\n„[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip], seid so gut. Was könnt Ihr mir über die Güte und den Marktwert in Sachen [counsel_good.GetNameNoTooltip] sagen?“"
 gdp_merchant.2015.a: "„Tatsächlich bin ich sehr versiert, was die Sache anbelangt.“"
 gdp_merchant.2015.a.tt: "Ihr müsst mindestens [expertise_level|E] #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! in der [trade_category_short|E] [counsel_category.GetName] erreicht haben"
 gdp_merchant.2015.b: "„Ich könnte ein oder zwei Dinge wissen …“"
 gdp_merchant.2015.a.monopoly.tt: "Akzeptanz in Sachen [monopoly_i][trade_monopoly|E]: [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip|U] hält Euch für eine Autorität"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip|U] durchschaut Eure Lügen"
 gdp_merchant.2015.b.monopoly.tt: "Akzeptanz in Sachen [monopoly_i][trade_monopoly|E]: [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "„Ich strebe nach mehr im Leben als nur dem Handel.“"
 gdp_merchant.2020.t: "Ein Platz an der Tafel"
 gdp_merchant.2020.desc: "Ich habe die Ehre, in der Residenz ([patron.GetCapitalLocation.GetHolding.GetType.GetName]) von [Select_CString(patron.IsFemale, 'meiner Gönnerin', 'meinem Gönner')] [patron.GetTitledFirstName] aus [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] zu dinieren. [courtier_1.GetTitledFirstName|U] ist von edlem Geblüt und folgt mir mit brennendem Blick, als ich zu meinem Platz gehe. [courtier_1.Custom('DE_PRO_PER_S_3P_N')|U] flüstert den anderen Gästen fast unhörbar etwas zu, aber dennoch kann ich die Worte „Gesindel“ und „Bestechungen [Select_CString(ROOT.Char.IsFemale, 'einer gewöhnlichen Hökerin', 'eines gewöhnlichen Hökers')]“ verstehen. Die Stimmen verstummen, als sich [patron.GetFirstNameNoTooltip] erhebt und zu sprechen beginnt:\n\n„Vertraute Gefährten, neu gefundene Bekannte und lang verlorene Brüder, ich ließ Euch heute Nacht hier zusammenkommen, damit Ihr in meiner Gastfreundschaft schwelgen könnt. Lasst uns tafeln!“"
 gdp_merchant.2020.a: "„Wunderbar. Wir müssen das öfter machen!“"
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName|U] wird baldmöglichst #weak (innerhalb von 1-3 Monaten)#! ein [GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName] beginnen"
 gdp_merchant.2020.b: "Haus [ROOT.Char.GetHouse.GetBaseNameNoTooltip] wird die Anerkennung bekommen, die wir verdienen."
 gdp_merchant.2020.b.unity_gain.desc: "beanspruchte einen Sitz unter dem Adel im Namen unseres Hauses"
 gdp_merchant.2020.c: "„Hört, hört. Nun lasst uns zur Sache kommen!“"
 gdp_merchant.2020.c.unity_loss.desc: "widmete sich ganz dem, was wirklich wichtig ist: das Geschäft"
 gdp_merchant.2025.t: "[Select_CString(target_character.IsFemale, 'Die schlechtere Kauffrau', 'Der schlechtere Kaufmann')]"
 gdp_merchant.2025.desc: "Wie üblich taucht [charter_rival.GetTitledFirstName] nicht auf, wenn die Pflicht ruft. Mein[patron.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] [patron.GetTitledFirstName] und ich warten geduldig auf [charter_rival.Custom('DE_PRO_PER_S_3P_A')], bis wir entscheiden, die Hauptbücher für diesen Monat allein durchzugehen.\n\nUnbestätigte Handelsabkommen liegen noch immer auf dem Tisch verstreut, als [patron.GetFirstNameNoTooltip] die Pergamente beiseite schiebt und [patron.Custom('DE_PRO_POS_S_3P')]e Aufmerksamkeit mir zuwendet:\n\n„[ROOT.Char.GetFirstNameNoTooltip|U], nur unter uns: Wie denkt Ihr #EMP wirklich#! über [charter_rival.GetFirstNameNoTooltip]? Traf ich die richtige Wahl, als ich [charter_rival.Custom('DE_PRO_PER_S_3P_D')] meine Charta anvertraute?“"
 gdp_merchant.2025.a: "„Vielleicht wäre sie in meinen Händen besser verwendet?“"
 gdp_merchant.2025.a.charter.tt: "Akzeptanz in Sachen [charter_i][request_merchant_charter|E]: [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "„Ich vertraue Eurem überragenden Urteil, [patron.Custom('FormOfAddressForLiege')].“"
 gdp_merchant.2025.b.unity_gain.desc: "zeigte dem Gönner, dass wir seinem Urteil vertrauen"
 gdp_merchant.4000.t: "Unser Platz abseits des Weges"
 gdp_merchant.4000.desc.intro: "Ich betrete den Markt von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] und sehe, dass meine Verkäufer in eine entlegene Gasse gedrängt wurden und ihre Tische im Dreck eines nahen Schweinestalls stehen.\n\n"
 gdp_merchant.4000.desc.patron: "Mein[market_character.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))]"
 gdp_merchant.4000.desc.patron_representative: "[market_character.GetName|U], [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))] von [patron.GetTitledFirstName],"
 gdp_merchant.4000.desc.body: "steht weit gegen den Wind und grinst, als [market_character.Custom('DE_PRO_PER_S_3P_N')] sieht, wie mich meine Mitarbeiter mit Beschwerden überhäufen.\n\nAls ich mich nähere, sagt [market_character.GetFirstNameNoTooltip]:"
 gdp_merchant.4000.desc.body.patron: "„Ein angemessener Ort für die Geschäfte Eures Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]), oder nicht?“, und [market_character.Custom('DE_PRO_PER_S_3P_N')] deutet in Richtung der Schweine."
 gdp_merchant.4000.desc.body.patron_representative: "„Ich bin hier im Namen Eures Gönners.“ So, wie [market_character.Custom('DE_PRO_PER_S_3P_N')] das Kinn in die Höhe reckt und wie [market_character.Custom('DE_PRO_POS_S_3P')]e Augen leuchten, hat [market_character.Custom('DE_PRO_PER_S_3P_N')] viel Freude daran, diese Nachricht zu überbringen."
 gdp_merchant.4000.desc.outro: "„Ihr unterwerft Euch nicht unseren Bräuchen und beherzigt niemals das Wort von [Glossary('Kǒngzǐ', 'CONFUCIUS_GLOSS')]. Bis Ihr das tut, wird dies Euer Platz sein.“"
 gdp_merchant.4000.b: "Ich sollte mehr über den Weg erfahren."
 gdp_merchant.4000.b.tt: "Euer nächster [GetActivityType('activity_adult_education').GetName] kostet #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')] %#! weniger [gold|E], wenn er in einem Zentrum in Sachen [GetTrait('confucian_education').GetName(GetNullCharacter)|l] stattfindet"
 gdp_merchant.4000.c: "Denen werde ich es zeigen …"
 gdp_merchant.4010.t: "Die Tore der Bildung"
 gdp_merchant.4010.desc: "Ich genieße einen Tee am Ende eines langen Tages auf dem Markt. Dann und wann bemerke ich, wie [Select_CString(student.IsFemale, 'eine einheimische Gelehrte', 'ein einheimischer Gelehrter')] mich neugierig anblickt.\n\n„Die Mitglieder dieses Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) sind eine verächtliche Bande“, höre ich [student.Custom('DE_PRO_PER_S_3P_A')] [student.Custom('DE_PRO_POS_S_3P')]em Freund zuraunen. „Sie meinen, sie seien besser als wir, die wir die wahren Riten beachten. Wir bestanden unsere Prüfungen mit der gebotenen Sorgfalt. Was ist [ROOT.Char.GetFirstNameNoTooltip] denn je gelungen, außer andere auszunutzen?“"
 gdp_merchant.4010.a: "Diese Prüfung kann nicht zu schwer sein."
 gdp_merchant.4010.b: "„Und wessen Tee trinkt Ihr?“"
 gdp_merchant.4010.c: "„Und wessen Geschäft zu verlieren kann sich dieser Ort leisten?“"
 gdp_merchant.4020.t: "Die Seidenstraße"
 gdp_merchant.4020.desc: "Ich betrete [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] inmitten einer Masse an Leibern, sowohl Menschen als auch Tiere, die durch die Tore [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')] strömt, um sich dem endlosen Zug der Karawanen anzuschließen. Die Dromedare hier sind so groß wie Elefanten mit der Fülle ihrer Last, und sie schwanken in alle Richtungen ob der schieren Menge, die auf ihren Rücken befestigt ist.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "An jeder Straßenecke sind Händler, die derart viele Waren entladen, dass es kaum zu glauben ist.\n\nIch sehe Stände, an denen man das Essen einfach beseite schiebt, als gäbe es solch einen Überfluss, dass es schlicht nicht möglich ist, alles zu verkaufen, ehe es verdirbt."
 gdp_merchant.4020.desc.steady_trading: "Niemals zuvor habe ich eine solche Überfülle an einem Ort gesehen. Es gibt so viele Leute hier, dass wir zu einer lärmenden Masse werden, verschmolzen zu einer einzigen Einheit.\n\nWenn eine Karawane ins Stocken gerät, gibt es stets einen Meister, der bereit ist, die Peitsche knallen zu lassen."
 gdp_merchant.4020.desc.hardship: "Was ich hier und da bei verschiedenen Gesprächen in fremden Zungen aufschnappe, ist, dass dieser Markt derzeit in Schwierigkeiten steckt.\n\nWie dieser Ort wohl in wohlhabenderen Zeiten aussieht! Die unglaubliche Menge an Waren muss jenseits aller Schätzung sein …"
 gdp_merchant.4020.a: "Das ist der Weg in die Zukunft."
 gdp_merchant.4030.t: "Ferne Vermögen"
 gdp_merchant.4030.desc.intro: "Mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] betritt die Schreibstube des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]). [associate.Custom('DE_PRO_POS_S_3P')|U]e Augen leuchten so, wie ich dies bisher nur beim Anblick eines Haufens Gold sah.\n\n[associate.Custom('DE_PRO_PER_S_3P_N')|U] reicht mir eine Kiste. Ich öffne sie und finde"
 gdp_merchant.4030.desc.silk: "die feinste Seide, die ich je sah, unendlich zart und unfassbar leicht.\n\n"
 gdp_merchant.4030.desc.spice: "ein duftendes Puder, frisch gemahlen.\n\n„Sie nennen es [rumoured_market_owner.Custom('RegionalSpice')]“, sagt [associate.Custom('DE_PRO_PER_S_3P_N')]."
 gdp_merchant.4030.desc.jade: "ein Jadestein, so poliert, dass die Oberfläche glatt wie Glas ist.\n\n"
 gdp_merchant.4030.desc.ivory: "ein Stück Elfenbein, das zu einer Miniaturzitadelle geschnitzt wurde.\n\n"
 gdp_merchant.4030.desc.outro: "„Ich erwarb dies von einem Kaufmann, der von seinen [rumoured_market_owner.GetCulture.GetNameNoTooltip|l]en Verbindungen zur Seidenstraße sprach. Das Gold, das wir hier in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] verdienen, ist nichts im Vergleich zu dem, was die [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')] von [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip] erlangen.“"
 gdp_merchant.4030.a: "„Die Seidenstraße, sagt Ihr?“"
 gdp_merchant_4030_a_tt: "Wenn Ihr in den nächsten #V 5#! Jahren Eure [company|E] auf einen gewissen Markt ([rumoured_market.GetName]) verlegt, erhaltet Ihr auf diesem [market|E] für #V 10 Jahre#!: [GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]"
 gdp_merchant.4030.b: "„Habt Dank. Was für ein wohlüberlegtes Geschenk.“"
 gdp_merchant.4030.c: "„Wir haben wichtige Geschäfte hier, [associate.GetFirstNameNoTooltip].“"
 merchant_unity_local_business: "gab Geschäften in der Nähe den Vorzug vor der [silk_road|E]"
 gdp_merchant.4030.artifact.silk: "Seide aus [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant.4030.artifact.silk.desc: "Ein Muster hauchdünner Seide von den Märkten der Seidenstraße. Unglaublich leicht und weich anzufassen."
 gdp_merchant.4030.artifact.spice: "Beutel Gewürze"
 gdp_merchant.4030.artifact.spice.desc: "Ein Beutel mit duftenden Gewürzen von den Märkten der Seidenstraße."
 gdp_merchant.4030.artifact.jade: "Polierter Jadestein"
 gdp_merchant.4030.artifact.jade.desc: "Ein Jadestein von den Märkten der Seidenstraße, so sorgsam poliert, dass die Oberfläche so glatt wie Glas ist."
 gdp_merchant.4030.artifact.ivory: "Elfenbeinzitadelle"
 gdp_merchant.4030.artifact.ivory.desc: "Ein Stück Elfenbein von den Märkten der Seidenstraße, das aufwendig zu einer Miniaturzitadelle geschnitzt wurde."
 gdp_merchant.5000.t: "Aufgedecktes Interesse"
 gdp_merchant.5000.desc.debtor: "Die Tür zum Schreibzimmer des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) schwingt auf und mein[accuser.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] tritt herein, flankiert von meinen eigenen Mitarbeitern."
 gdp_merchant.5000.desc.debtor_paranoid: "Nur ein Quietschen der Tür verrät, dass sich mein[accuser.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] nähert, als [accuser.Custom('DE_PRO_PER_S_3P_N')] leise in das Schreibzimmer des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) tritt."
 gdp_merchant.5000.desc.bishop: "Gestalten, deren Gesichter unter Kapuzen verborgen liegen, verdunkeln die Türschwelle des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]). Es dauert nicht lange, bis [accuser.Custom('GetActualBishopTitle')] [accuser.GetFirstName] vor mir steht, hereingeführt von meinen eigenen Mitarbeitern."
 gdp_merchant.5000.desc.clergy: "Gestalten, deren Gesichter unter Kapuzen verborgen liegen, verdunkeln die Türschwelle des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]). Es dauert nicht lange, bis [accuser.Custom('PriestTitle')] [accuser.GetFirstName] vor mir steht, hereingeführt von meinen eigenen Mitarbeitern."
 gdp_merchant.5000.desc.steward: "Die Tür zum Schreibimmer des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) schwingt auf und [Select_CString(accuser.IsFemale, 'die', 'der')] [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] von [debtor.GetFirstName] stürmt herein, flankiert von meinen eigenen Mitarbeitern."
 gdp_merchant.5000.desc.break: "\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], es gibt eine Diskrepanz in dem Darlehen, das [SelectLocalization(ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'mir', debtor.GetTitledFirstName)] gegeben wurde“, sagt [accuser.Custom('DE_PRO_PER_S_3P_N')]."
 gdp_merchant.5000.desc.accepted: "„Ich mag es nicht besonders, wenn man mir Unwahrheiten unterbreitet. Zeigt mir die Bücher Eurer Gesellschaft und lasst uns die Dinge richtigstellen.“"
 gdp_merchant.5000.desc.discouraged.debtor: "„Ihr wisst um das Missfallen des Gotteshauses ([accuser.GetFaith.Custom('HouseOfWorshipBase')]) gegenüber Wucher. Lasst uns die Rechnung jetzt begleichen, und die Angelegenheit muss nicht weiter verfolgt werden.“"
 gdp_merchant.5000.desc.shunned.debtor: "„Sobald die [accuser.Custom('DefaultPriestTitlePlural')] davon wissen, werden sie hart gegen Euch und Euer Geschäft vorgehen. Ich bin hier, um Euch die Gelegenheit zu geben, Euch selbst zu retten.“"
 gdp_merchant.5000.desc.accepted.steward: "„Euer Gönner mag es nicht besonders, wenn man ihm Unwahrheiten unterbreitet. Zeigt mir Eure Gesellschaftsbücher und lasst uns die Zahlen in Ordnung bringen.“"
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "„Als Kaufmann versteht Ihr sicherlich, dass man nichts umsonst bekommen kann? Und dennoch … Nun, wir hoffen, dass diese Angelegenheit nun beigelegt werden kann. Diskret. Damit wir vermeiden, dass Euer Geschäft durch diesen Fehler leidet und deshalb dem Handel schadet.“"
 gdp_merchant.5000.desc.shunned: "„Es ist abscheulich, wie Ihr Eure Geschäfte geführt habt. Ihr, als [Select_CString(ROOT.Char.IsFemale, 'eine Kauffrau', 'ein Kaufmann')], verkauft etwas, was es gar nicht gibt? Das kommt vor Gericht, außer Ihr bittet um Vergebung.“"
 gdp_merchant.5000.a: "„Wisst Ihr denn nicht, dass ich im Namen von [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] handle?“"
 gdp_merchant.5000.a.debtor: "„Ihr wollt sicherlich nicht unserem Handel schaden?“"
 gdp_merchant.5000.b: "„Ihr könnt unseren Besitz als Entschädigung nehmen.“"
 gdp_merchant.5000.c: "„Hier. Lasst uns das Kleingedruckte lesen.“"
 gdp_merchant.5000.c.success: "Eure Konten sind makellos"
 gdp_merchant.5000.c.failure: "Die Zahlen sind nachlässig"
 gdp_merchant.5000.c.critical: "Der Zins ist schlecht getarnt"
 gdp_merchant.5000.d: "„Ich denke, ich könnte auf die Zinsen verzichten …“"
 gdp_merchant.5000.e: "„Erachtet das Darlehen als vergessen.“"
 gdp_usury_penance_seized_goods_modifier: "Wieder in Besitz genommene Karawanen"
 gdp_usury_penance_seized_goods_modifier_desc: "Das Geschäft dieses Charakters leidet unter der Entdeckung seiner verborgenen Zinsdarlehen."
 gdp_usury_penance_same_faith_scandal_modifier: "Bekannter Wucherer"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "Dieser Charakter leidet darunter, dass sein heimtückischer Wucher aufgedeckt wurde."
 gdp_usury_penance_forgive_interest_tt: "Der getarnte [interest|E] ist vergeben #weak ([TARGET_CHARACTER.GetShortUIName|U] schuldet [gold_i|E]$VALUE|0V$)#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "Das getarnte [loan|E] bleibt bestehen"
 gdp_merchant.5010.t: "Das Kleingedruckte"
 gdp_merchant.5010.desc: "Man machte mich darauf aufmerksam, dass [Select_CString(lender.IsFemale, 'meine Gläubigerin', 'mein Gläubiger')] [lender.GetFirstName] nicht ganz aufrichtig bei der Vereinbarung meines Darlehens war.\n\nAls ich erneut durch die Zahlen ging, sah ich, dass es im Kleingedruckten Sätze gibt, die eine höhere Summe beschreiben, als wir ursprünglich vereinbarten.\n\nDer Unterschied in unserer Vereinbarung ist für jedermann deutlich zu erkennen, falls ich mich in dieser Sache zum Handeln entschließen sollte."
 gdp_merchant.5010.a: "Bewahrt das Geheimnis."
 gdp_merchant.5010.b: "[lender.Custom('DE_PRO_PER_S_3P_N')|U] wird mir die Zinsen zurückzahlen."
 gdp_merchant.5010.b.wipe: "[lender.Custom('DE_PRO_PER_S_3P_N')|U] wird keine Zinsen erhalten."
 gdp_merchant.5010.c: "Lehnt das Darlehen ab."
 gdp_usury_debtor_discover_interest_tt: "Der verborgene [interest|E] ist #weak [gold_i|E]$VALUE|0V$#!"
 gdp_usury_debtor_keep_secret_tt: "Der getarnte [interest|E] bleibt ein Geheimnis"
 gdp_usury_debtor_demand_repayment_tt: "Verlangt, dass der versteckte [interest|E] zurückgezahlt wird"
 gdp_usury_debtor_inform_creditor_tt: "[lender.GetShortUINameNoTooltip|U] erhält einen Brief"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ Ich verlange, dass der versteckte Zins umgehend zurückgezahlt wird. Haltet mich nicht noch einmal zum Narren."
 gdp_merchant.5020.a: "Wie bedauerlich."
 gdp_merchant.5020.a.tt: "Versteckter Zins wird zurückgezahlt"
 gdp_usury_penance_interest_paid_back_tt: "Der versteckte [interest|E] wird nicht mehr geschuldet"
 gdp_merchant.5020.desc_intro: "Ich bin unseren Darlehensvertrag durchgegangen, und es ist deutlich zu erkennen, dass Ihr versucht habt, mich zu betrügen!"
 gdp_usury_debtor_kept_secret_message: "Geheimnis bewahrt"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName|U] weiß von dem verborgenen [interest|E] und wird das Geheimnis wahren."
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "Erachtet das Darlehen, das Ihr mir gewährtet, für null und nichtig. Ich werde das nächste Mal besser nachdenken, wenn Ihr mir etwas anbietet."
 gdp_merchant.5040.a: "So eine Unverschämtheit!"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "Es schmerzt mich, zu schreiben und zuzugeben, dass das Opfer, das die Straße fordert, und die unaufhörlichen Streitereien auf den Märkten für mich zu schwer zu ertragen sind.\n\nKönntet Ihr es in Erwägung ziehen, die Gesellschaft nach Hause zu rufen? Wenigstens für eine Weile?"
 gdp_merchant.0060.a: "Wenn ich denn muss."
 gdp_merchant.0060.a.tt: "Ihr versprecht, innerhalb von 2 Jahren folgende Entscheidung zu treffen: [GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName]"
 gdp_merchant.0060.b: "Ihr werdet das überwinden müssen."
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName|U] hat [stress_i]#N [associate.GetStress|0]#! [stress|E]. [associate.Custom('DE_PRO_PER_S_3P_N')|U] wird durch scheiternde [schemes|E] auf [associate.Custom('DE_PRO_POS_S_3P')]er Route weiterhin Anspannung erleiden"
