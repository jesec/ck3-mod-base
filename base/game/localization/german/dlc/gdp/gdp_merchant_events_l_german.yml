l_german:
 gdp_merchant.0001.t: "Ein mit Gold gepflasterter Weg"
 gdp_merchant.0001.desc: "Ich betrete den örtlichen Markt als [Select_CString(ROOT.GetWomanMan.IsFemale, 'eine freie Frau', 'ein freier Mann')]. Die Rufe der Verkäufer sind von jeder Straßenecke aus zu hören, wie sie sich mit Dröhnen von Schlägen auf Metall aus den umliegenden Werkstätten vermischen. Wohin ich auch schaue, erblicke ich Karren mit Kisten voll feinen Getränken ([ROOT.Char.Custom('RegionalDrink')]), Bahnen mit erlesenen Stoffen ([ROOT.Char.Custom('RegionalFabric')]) und Käfigen mit hiesigen Vögeln ([ROOT.Char.Custom('GetRandomRegionalBird')]), die man von hier nach dort bewegt.\n\nHier werde ich meine Dynastie errichten."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "Was soll mein erstes geschäftliches Unterfangen sein?"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "Nach sorgfältiger Überlegung habe ich mich dazu entschieden, das Leben eines Kaufmanns anzustreben. Ich bin in meinen kraftvollsten Jahren und mein Wunsch, in die Fremde zu reisen, drängt mich zum Handeln. Ich hoffe, dass wir eines Tages eine Geschäftsbeziehung haben werden, die uns beiden zum Vorteil gereicht. Ich lasse [old_primary_title.GetBaseNameNoTierNoTooltip] in Euren fähigen Händen."
 gdp_merchant.0002.a: "Eine spannende Wendung der Ereignisse."
 gdp_merchant.0010.t: "Familienangelegenheiten"
 gdp_merchant.0010.desc: "Nachdem wir das heutige Familientreffen vertagt haben, winkt mich mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] mit entschlossener Miene heran.\n\n„[Select_CString(ROOT.Char.IsFemale, 'Meine teure', 'Mein teurer')] [associate.Custom2('RelationToMe', ROOT.Char)]!"
 gdp_merchant.0010.desc.starting: "Ich bin seit ihrer Gründung ein Mitglied dieser Gesellschaft“,"
 gdp_merchant.0010.desc.starting_fallback: "Ich arbeite nun schon einige Zeit für diese Familie“,"
 gdp_merchant.0010.desc.cont: "sagt [associate.Custom('DE_PRO_PER_S_3P_N')] und wählt [associate.Custom('DE_PRO_POS_S_3P')]e Worte mit Bedacht."
 gdp_merchant.0010.desc.children: "„Und da [Select_CString(heir.IsFemale, 'Eure Nachkommin', 'Euer Nachkomme')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] noch nicht volljährig ist,"
 gdp_merchant.0010.desc.no_children: "„Und da Ihr keine erwachsenen Kinder habt,"
 gdp_merchant.0010.desc.outro: "hoffte ich, Ihr könntet in Betracht ziehen, mich an Kindes Statt anzunehmen. Es wäre mir eine Ehre, als ein Mitglied des Haushalts die Familie zu vertreten.“"
 gdp_merchant.0010.a: "„Ich sah Euch stets als einen der Meinen an.“"
 merchant_adoption_event_tt: "[associate.GetShortUIName|U] wird ein Teil von Eurem [house|E]"
 merchant_unity_adoption_loss: "Adoptierte einen Mitarbeiter ins [house|E]"
 gdp_merchant.0010.b: "„Ihr müsst Euch noch als nützlich erweisen.“"
 gdp_merchant.0010.c: "„Ich komme auf Euch zurück.“"
 gdp_merchant.0015.t: "Ein Geschäftsgesicht"
 gdp_merchant.0015.desc: "Mit der Schaffung einer gewissen Route ([trade_route.GetNameNoTooltip]) ist unser weiterer Handelskurs klar.\n\nIch muss allerdings noch eine Person auswählen, die unser neues Wagnis repräsentieren könnte. Mein[courtier_1.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))] [courtier_1.GetTitledFirstName] ist eine [courtier_1.Custom('quirk_pos_adjective')|l] Seele von"
 gdp_merchant.0015.desc_good_intellect: "angemessenem Verstand. Wer weiß? [courtier_1.Custom('DE_PRO_PER_S_3P_N')|U] könnte uns mit ein paar versteckten Talenten überraschen."
 gdp_merchant.0015.desc_excellent_intellect: "überragendem Verstand. Man kann sich leicht vorstellen, dass [courtier_1.Custom('DE_PRO_PER_S_3P_N')] dem Familiennamen zur Ehre gereicht."
 gdp_merchant.0015.desc_poor_intellect: "geringem Verstand. Vielleicht könnte [courtier_1.Custom('DE_PRO_PER_S_3P_A')] diese Gelegenheit dazu herausfordern, [courtier_1.Custom('DE_PRO_POS_S_3P')]e Fähigkeiten zu verbessern."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip|U] könnte genau [Select_CString(courtier_1.IsFemale, 'die', 'der')] richtige [courtier_1.GetWomanMan] für diese Aufgabe sein …"
 gdp_merchant.0015.b: "… aber [courtier_2.GetFirstNameNoTooltip] ist womöglich noch besser geeignet."
 gdp_merchant.0015.c: "Ich muss meine fähigen Leute in meiner Nähe halten."
 gdp_merchant.0015.c.fallback: "Nein. Ich brauche alle hier."
 gdp_merchant.0015.c.tt: "Ihr beginnt Eure [trade_route|E] ohne einen zugewiesenen [trader|E]"
 gdp_merchant.0020.t: "[Select_CString(current_partner.IsFemale, 'Eine Geschäftspartnerin', 'Ein Geschäftspartner')]"
 gdp_merchant.0020.desc: "Der Kopf eines Familienunternehmens ist nur so gut wie der Hals, der seinen Blick auf neue Perspektiven lenkt."
 gdp_merchant.0020.desc.partner_exists: "[Select_CString(old_holder.IsFemale, 'Meine Partnerin', 'Mein Partner')] [current_partner.GetFirstName] sollte eigentlich diese Aufgabe übernehmen, doch [current_partner.Custom('DE_PRO_PER_S_3P_N')] vergeudete immerzu unsere Zeit und unser Gold für sinnlose Unternehmungen."
 gdp_merchant.0020.desc.fallback: "Derzeit beschäftige ich niemanden, der diese Rolle erfüllt und an meiner Seite Partner ist."
 gdp_merchant.0020.desc.body: "Die Anspannung in der Gesellschaft ist greifbar und führt dazu, dass jeder, der nur einen Hauch von Ehrgeiz besitzt, sich streiten und profilieren will.\n\n"
 gdp_merchant.0020.desc.outro_three: "Unter ihnen sind auch [candidate_2.GetTitledFirstName] und [candidate_3.GetTitledFirstName], die beide ihre unerschütterliche Treue beschwören, um einen Sitz am Tisch zu erhalten.\n\nSie werden alles unternehmen, um [candidate_1.GetTitledFirstName] aus dem Weg zu räumen, [candidate_1.Custom('DE_ART_DEF_S_N')] ihnen klar überlegen ist."
 gdp_merchant.0020.desc.outro_two: "Unter ihnen ist [candidate_2.GetTitledFirstName], [candidate_2.Custom('DE_ART_DEF_S_N')] [candidate_2.Custom('DE_PRO_POS_S_3P')]e unerschütterliche Treue beschwört, um einen Sitz am Tisch zu erhalten.\n\n[candidate_2.Custom('DE_PRO_PER_S_3P_N')|U] wird alles tun, um [candidate_1.GetTitledFirstName] aus dem Weg zu räumen, [candidate_1.Custom('DE_ART_DEF_S_N')] [candidate_2.Custom('DE_PRO_PER_S_3P_D')] klar überlegen ist."
 gdp_merchant.0020.desc.outro_one: "Unter ihnen ist [candidate_1.GetTitledFirstName], [candidate_1.Custom('DE_ART_DEF_S_N')] [candidate_1.Custom('DE_PRO_POS_S_3P')]e unerschütterliche Treue beschwört, um einen Sitz am Tisch zu erhalten.\n\n[candidate_1.Custom('DE_PRO_PER_S_3P_N')|U] wird alles tun, um jeden aus dem Weg zu räumen, der zwischen [candidate_1.Custom('DE_PRO_PER_S_3P_D')] und der zu erledigenden Aufgabe steht."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip|U] verdient eine Chance."
 gdp_merchant.0020.a.custom: "Jeder andere Kandidat"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip|U] sollte die Gelegenheit bekommen."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip|U] hat es sicherlich am meisten verdient."
 gdp_merchant.0020.d: "Diese Leute haben bereits Aufgaben, um die sie sich kümmern müssen …"
 gdp_merchant.0020.d.custom: "Jeder Kandidat"
 merchant_unity_partner_gain: "Stellte Hausmitglied als Partner ein"
 merchant_unity_partner_loss: "Stellte Außenseiter als Partner ein"
 gdp_merchant.0025.t: "Geschätzte Kunsthandwerker"
 gdp_merchant.0025.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Gute', 'Guter')] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip]“, ruft mich eine fremde Stimme aus einer nahen Gerberei. Ich folge dem Ruf, sorgfältig darauf bedacht, nicht in den Dreck aus den Färbefässern zu treten.\n\nEhe ich michs versehe, stehe ich Auge in Auge mit … einem Kadaver? [Select_CString(traveler.IsFemale, 'Die Jägerin', 'Der Jäger')] lächelt mich an und zeigt stolz [traveler.Custom('DE_PRO_POS_S_3P')]e Trophäe.\n\n„Eure Unternehmung ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]) ist überall als Hort fähiger Handwerker bekannt. Daher wisst Ihr, dass das Erzeugnis, das man verkauft, nur so gut ist wie das Material, das man dafür verwendet. Als [Select_CString(traveler.IsFemale, 'Jägerin', 'Jäger')] machte ich es mir zur Aufgabe, für solch erlesene Kundschaft wie Ihr es seid, nur das Beste zu besorgen.“"
 gdp_merchant.0025.a: "„Habt Ihr in Erwägung gezogen, noch mehr Handel zu betreiben?“"
 gdp_merchant.0025.b: "„Bitte sprecht weiter …“"
 merchant_unity_artisan_recruit_loss: "warb einen Außenstehenden an"
 merchant_unity_artisan_recruit_decline_gain: "lernte etwas über luxeriöse Materialien"
 gdp_merchant.0030.t: "Ein ernst zu nehmender Gegner"
 gdp_merchant.0030.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstNameNoTooltip], schaut!“, höre ich jemanden rufen.\n\nAls ich mich umdrehe, sehe ich [Select_CString(traveler.IsFemale, 'eine Schmiedin', 'einen Schmied')] mir von [traveler.Custom('DE_PRO_POS_S_3P')]em Arbeitsplatz zuwinken. Ich gehe zu [traveler.Custom('DE_PRO_PER_S_3P_D')] und mir entgeht nicht, wie [traveler.Custom('DE_PRO_PER_S_3P_N')] sich dreht und [traveler.Custom('DE_PRO_POS_S_3P')]en Leib so bewegt, dass das Feuer [traveler.Custom('DE_PRO_POS_S_3P')]e Muskeln beleuchtet …\n\n„Ich warte schon so lange darauf, Euch kennenzulernen. Da Eure Gesellschaft einen so #EMP beeindruckenden#! Ruf erlangte, Eure Mitbewerber in den Schatten zu stellen, würde ich Euch gern meine Dienste anbieten. Ich möchte Euch meine Fäuste zur Verfügung stellen. Ich kann Schädel zertrümmern, ein Schwert schwingen – alles, was Ihr braucht.“"
 gdp_merchant.0030.a: "„Ich mag Euren Eifer.“"
 gdp_merchant.0030.b: "„#EMP Ähm …#! Zeigt mir mehr von Eurer Arbeit.“"
 merchant_unity_creditor_recruit_loss: "warb einen Außenstehenden an"
 merchant_unity_creditor_recruit_decline_gain: "wies einen aufdringlichen Gesellschaftsfanatiker ab"
 gdp_merchant.0035.t: "Ein weit gereister Ruf"
 gdp_merchant.0035.desc: "Ein ungewöhnliches Lärmen lenkt meine Aufmerksamkeit von den Hauptbüchern vor mir ab.\n\nAls ich aus der Schreibstube des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]) trete, treffe ich auf [Select_CString(target_character.IsFemale, 'eine Kauffrau', 'einen Kaufmann')] mit klugem Blick und dem Staub von mehreren Tagen Reise an der Kleidung.\n\n„Schön, dass wir uns begegnen, [ROOT.Char.GetTitledFirstNameNoTooltip]“, sagt [traveler.Custom('DE_PRO_PER_S_3P_N')]. „Unterwegs kannte jeder Euren Namen, und alle Leute, die ich traf, erzählten mir, dass Ihr die Person seid, die ich treffen muss. Ich hoffte, Ihr lasst mich künftig unter Eurem Namen reiten.“"
 gdp_merchant.0035.a: "„Nun, Ihr scheint äußerst wacker!“"
 gdp_merchant.0035.b: "„Mich würden eher Neuigkeiten über den fernen Handel interessieren.“"
 merchant_unity_caravaneer_recruit_loss: "warb einen Außenstehenden an"
 merchant_unity_caravaneer_recruit_decline_gain: "lernte etwas über ferne Märkte"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "Die [ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')] waren pessimistisch, doch endlich stimmte [recipient.GetTitledFirstName] unserem Ersuchen zu, und nun sind wir in Feierlaune! Wir werden endlich eine Stadt haben, die nur uns gehört, eine Republik, die wir nach unserem Ermessen regieren können!\n\nIch werde [Select_CString(ROOT.Char.IsFemale, 'die', 'der')] erste [ROOT.Char.GetTitleAsNameNoTooltip] unseres Reichs ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) sein"
 gdp_merchant.0101.liege: "und [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] und seine Umgebung als eine untertänige Stadt regieren, abhängig von und verpflichtet gegenüber unseren [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip|l]en Herren gleichermaßen."
 gdp_merchant.0101.independent: "und [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] und seine Umgebung zusammen mit den anderen angesehenen Familien im Namen der Bevölkerung regieren."
 gdp_merchant.0101.republic: "\n\nNach vielen Geschäften und vielen Betätigungen kann das große Haus [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ein bleibendes Vermächtnis aufbauen …"
 gdp_merchant.0101.a: "Hier bricht ein neues Zeitalter für die Leute von [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip] an!"
 gdp_merchant.0102.desc: "Es freute mich sehr zu hören, dass Ihr mein Angebot angenommen habt!\n\nDas Gold wurde auf den Weg gebracht, und wir gehen dazu über, eine Charta für unser Reich ([actor.GetPrimaryTitle.GetName]) auszuarbeiten,"
 gdp_merchant.0102.liege: "um als Eure demütigen [Concept('subject', 'Untertänigen')] zu regieren."
 gdp_merchant.0102.top_liege: "um unter [new_liege.GetTitledFirstName] zu regieren."
 gdp_merchant.0102.independent: "um es als eine unabhängige Stadt zu regieren."
 gdp_merchant.0103.desc: "Was für ein lächerlicher Vorschlag. Denkt Ihr ernsthaft, meine Titel stünden zum Verkauf? Und dann noch an [Select_CString(actor.IsFemale, 'eine so geringe Frau', 'einen so geringen Mann')], wie #EMP Ihr#! es seid?!"
 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "Nach einer längeren Diskussion kann [recipient.GetTitledFirstName] [recipient.Custom('DE_PRO_POS_S_3P')] Interesse an meinem großzügigen Angebot, unsere beiden Gesellschaften und Häuser zusammenzubringen, nicht verstecken.\n\n[recipient.Custom('DE_PRO_PER_S_3P_N')||U] nickt,"
 gdp_merchant.0110.desc.personality.ai_honor: "„Es scheint, als hätte ich keine Wahl in dieser Angelegenheit. Dennoch werde ich meinen Teil der Abmachung einhalten und Euren Interessen so pflichtschuldig dienen, wie ich meinen diente.“"
 gdp_merchant.0110.desc.personality.ai_zeal: "„Ich vertraue darauf, dass uns die Mächte des Wohlstands ([recipient.GetFaith.WealthGodName]) auf diesen Weg führten.“"
 gdp_merchant.0110.desc.personality.ai_greed: "„Ich sah Eure und unsere Hauptbücher durch. Angesichts dieser Zahlen bleibt mir keine andere Wahl, als Euer Angebot anzunehmen.“"
 gdp_merchant.0110.desc.personality.ai_compassion: "„Ich sprach mit der Gesellschaft, und wir denken, dass dieser Zusammenschluss uns allen zum Vorteil gereicht.“"
 gdp_merchant.0110.desc.personality.ai_boldness: "„Ich nehme Euren Vorschlag an. Lasst uns fortan offen miteinander reden.“"
 gdp_merchant.0110.desc.personality.ai_rationality: "„Ich wog unsere Gewinne gegen die Kosten ab, die eine Ablehnung Eures Angebots für uns hätte. Ich nehme an.“"
 gdp_merchant.0110.desc.personality.ai_vengefulness: "„Ihr lasst mir keine Wahl. Ihr gingt geschickt vor, und diese Runde geht an Euch.“"
 gdp_merchant.0110.desc.personality.ai_energy: "„Ich nehme an. Lasst Eure Angestellten einen Vertrag aufsetzen und schickt ihn mir unverzüglich zu!“"
 gdp_merchant.0110.desc.personality.ai_sociability: "„Die [recipient.GetHouse.GetBaseNameNoTooltip]-Gesellschaft akzeptiert Eure Bedingungen. Ich werde es vermissen, unter unserem eigenen Namen Handel zu treiben, doch es ist nicht weise, an seinem Stolz festzuhalten.“"
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "„Nach reiflicher Überlegung nehme ich Euren Vorschlag an, unsere Interessen zu vereinen.“"
 gdp_merchant.0110.desc.closing: "\n\n„Unsere Handelsrouten sind wie besprochen eingestellt, und der Name [recipient.GetHouse.GetBaseNameNoTooltip] wird von heute an Eurer Gesellschaft dienen.“"
 gdp_merchant.0110.a: "Die [recipient.GetHouse.GetBaseNameNoTooltip]-Märkte sind unser!"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "Ihr vergesst Euch und die Bedeutung dessen, was Ihr Euer nennt ([actor.GetPrimaryTitle.GetNameNoTooltip]). Unsere Unternehmung ([recipient.GetPrimaryTitle.GetNameNoTooltip]) wird niemals Euren kleinlichen Interessen nachgeben."
 gdp_merchant.0111.a: "Dieses Vorhaben erwies sich als schlecht durchdacht."
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "Gerüchte machen die Runde, dass das Reich [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] dringend finanzielle Hilfe benötigt. Ich könnte diese Lage bereinigen … für einen Gefallen im Gegenzug natürlich."
 gdp_purpose_events.0001.a: "Das könnte mein Weg hier heraus sein …"
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName|U] wird über Euer Angebot nachdenken."
 gdp_purpose_events.0001.b: "Diese Unverfrorenheit!"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "In diesen Zeiten bitte ich um Eure finanzielle Hilfe. Nennt Eure Bedingungen und ich werde sie nicht abschlagen, solange Ihr Euch überwinden könnt, sie niederzuschreiben."
 gdp_purpose_events.0002.a: "Schreibt den Schuldschein, samt Zinsen und allem."
 gdp_purpose_events.0002.a.sin: "Schreibt den Schuldschein, samt Wucher und allem."
 gdp_purpose_events.0002.c: "Legt ihn so an, dass niemand von Wucher sprechen kann."
 gdp_purpose_events.0002.d: "Schickt das Gold und fordert nichts dafür."
 gdp_purpose_events.0002.b: "Ich muss höflich ablehnen …"
 gdp_purpose_events.0002_notification: "Erfolgreiches Darlehen"
 gdp_purpose_events.0002_fail_notification: "Darlehen verweigert"
 fund_maa: "Ein @stationed_regiment_icon! [men_at_arms|E]-[regiment|E] finanzieren"
 fund_mercenaries: "Einen [mercenary_i|E][mercenary|E]-Vertrag finanzieren"
 gdp_purpose_events.0003.desc: "Es ist bekannt, dass der Krieg Euer Reich stark belastet. Ich bin bereit, Eure Unternehmungen zu finanzieren, mein[ruler.Custom('DE_END_PRO_S_N')] [ruler.GetTitleAsNameNoTooltip], sofern Ihr mir gleichermaßen in der Zukunft Eure Freundlichkeit gewähren würdet …"
 gdp_purpose_events.0003.a: "Ich brauche jede Hilfe, die ich bekommen kann!"
 gdp_purpose_events.0003.b: "Freundlichkeit? Niemals!"
 no_thanks.tt: "Ihr lasst diese Gelegenheit verstreichen …"
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "Es ärgert mich, Euch zu schreiben, doch im anstehenden Krieg könnte mein Reich Eure finanzielle Unterstützung gebrauchen. Ich bin bereit, Euch in der Zukunft gleichermaßen meine Freundlichkeit zu gewähren, wenn Ihr mir denn helfen würdet."
 gdp_purpose_events.0004.a: "Ich könnte Euch ein neues, spezialisiertes Regiment anbieten!"
 gdp_purpose_events.0004.b: "Ich könnte ein paar Leute schmieren, die ich kenne …"
 gdp_merchant.1002.t: "Die Gründung einer Gesellschaft"
 gdp_merchant.1002.desc: "Ein leeres Hauptbuch liegt vor mir auf dem Tisch. Vom offenen Fenster her wehen die Geräusche der örtlichen Handelsstätte ([ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]) in die Schreibstube des Unternehmens ([ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]) hinein: das Gefeilsche, das Knirschen der Räder und die Rufe der Tiere in ihren Käfigen.\n\nDer Raum ist bescheiden, mit wenig Licht – allein kann ich nicht bestehen, wenn ich mit den Händlern aus [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] mithalten soll. Vielleicht sollte ich ein paar Leute einstellen, um der Gesellschaft zu helfen?"
 gdp_merchant.1002.a: "Ich brauche Menschen mit Geschäftssinn."
 gdp_merchant.1002.a.tt: "Ihr beginnt mit zwei [Concept('associates','Mitarbeitern')|E] mit Können in Sachen [stewardship|E]"
 gdp_merchant.1002.b: "Wir werden unsere Gegner einschüchtern."
 gdp_merchant.1002.b.tt: "Ihr beginnt mit zwei [Concept('associates','Mitarbeitern')|E] mit Können in Sachen [martial|E]"
 gdp_merchant.1002.c: "Fähige Verhandler machen gute Geschäfte."
 gdp_merchant.1002.c.tt: "Ihr beginnt mit zwei [Concept('associates','Mitarbeitern')|E] mit Können in Sachen [diplomacy|E]"
 gdp_merchant.1002.d: "Es sind nicht zu wenige Gelehrte hier!"
 gdp_merchant.1002.d.tt: "Ihr beginnt mit zwei [Concept('associates','Mitarbeitern')|E] mit Können in Sachen [learning|E]"
 gdp_merchant.1002.e: "Gerissenheit wird von Vorteil für uns sein."
 gdp_merchant.1002.e.tt: "Ihr beginnt mit zwei [Concept('associates','Mitarbeitern')|E] mit Können in Sachen [intrigue|E]"
 gdp_merchant.1002.f: "Nein, ich brauche niemanden."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial Ihr findet [task_contracts|E] unter Umständen schwierig oder unmöglich, bis Ihr [associates|E] erhaltet#!"
 gdp_merchant.1002.f.tt.associates: "Anfänglich startet Ihr ohne [associates|E] – nur mit den Angehörigen Eurer [family|E] und den [Concept('friends', 'Freunden')|E], die Ihr bereits habt"
 gdp_merchant.1003.t: "Die Gründung einer Gesellschaft"
 gdp_merchant.1003.desc: "Der Handelsplatz ([ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]) von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] liegt mit all seiner unendlichen Vielfalt vor mir, und es vergeht kein Wimpernschlag, in dem nicht ein Geschäft beschlossen wird und [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] den Besitzer wechseln.\n\nÜberall herrscht geschäftiges Treiben: Die Räder der Karren quietschen, Tiere schreien aus ihren überfüllten Käfigen heraus, und hinter dem Lärm rufen die Kaufleute und hoffen, den Mitbewerbern einen Schritt voraus zu sein\n\nAlle möglichen Waren werden hier feilgeboten: Wenn ich mit den vielen Händlern wetteifern soll, vielleicht sollte ich dann meine Bemühungen stärker bündeln?"
 gdp_merchant.1003.a: "„Die Beförderung großer Warenmengen zu sichern, ist das Wichtigste.“"
 gdp_merchant.1003.b: "„Wir müssen es zu unserem Vorteil nutzen, wie uns [Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'die', 'der')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] sieht.“"
 gdp_merchant.1003.b.tt: "Ein [patron_contract|E] wird geschaffen"
 gdp_merchant.1003.c: "„Wir sind Kaufleute. Gewinn ist alles.“"
 gdp_merchant.1100.t: "Eine überfüllte Gesellschaft"
 gdp_merchant.1100.desc: "Mein[plaintiff.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', plaintiff)] [plaintiff.GetTitledFirstName] kommt in mein Studierzimmer und wägt [plaintiff.Custom('DE_PRO_POS_S_3P')]e Worte sorgfältig ab. „[ROOT.Char.GetFirstNameNoTooltip] … Dies hier ist eigentlich ein Familienunternehmen, aber trotzdem verlassen wir uns mehr und mehr auf Außenseiter.\n\nUnser Unternehmen ([ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]) sollte den Ballast abwerfen, wenn wir unsere Würde behalten wollen.“"
 gdp_merchant.1100.a: "„[associate_2.GetFirstNameNoTooltip|U] wird nicht länger benötigt.“"
 gdp_merchant.1100.b: "„Es ist an der Zeit, dass [associate_1.GetFirstNameNoTooltip] und wir getrennte Wege gehen.“"
 gdp_merchant.1100.c: "„Ja, lasst uns ‚Ballast abwerfen‘ …“"
 gdp_merchant.1100.d: "„Unsinn. Wir brauchen jede Hilfe, die wir kriegen können.“"
 merchant_overcrowding_ignored_loss: "ignorierte die Überfüllung der Gesellschaft"
 merchant_overcrowding_fired_gain: "feuerte einen Mitarbeiter, um die Überfüllung anzugehen"
 merchant_overcrowding_yeet_gain: "feuerte Mitarbeiter, um die Überfüllung anzugehen"
 gdp_merchant.1200.t: "Die Frage eines Mitarbeiters"
 gdp_merchant.1200.desc: "Nach einem langen Tag zwischen den Hauptbüchern sehe ich, dass mein[requester.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', requester)] [requester.GetTitledFirstName] an meiner Tür lungert und darauf wartet, mich sprechen zu können. „Oh, [ROOT.Char.Custom2('RelationToMeAddress', requester)]! Ich wollte Euch etwas fragen …\n\n"
 gdp_merchant.1200.desc.artifact: "Die Gesellschaft gedeiht so gut unter Eurer Führung und so viele wertvolle Gegenstände gehen durch die Bücher. Ihr könntet nicht vielleicht … mich einen behalten lassen?“"
 gdp_merchant.1200.desc.activity: "Die Gesellschaft arbeitet hart, und Ihr führt uns gut, doch ist es nicht an der Zeit, dass wir unsere großen Taten mit einem denkwürdigen Anlass feiern?“"
 gdp_merchant.1200.desc.luxury_contract: "Die Routen prosperieren unter Eurer Führung, doch es muss noch so viele Wunder geben, die da draußen nur darauf warten, gefunden zu werden …“"
 gdp_merchant.1200.a: "„Nun gut. Ich sehe, was ich machen kann.“"
 gdp_merchant.1200.b: "„Kommt schon. Ich habe Besseres zu tun.“"
