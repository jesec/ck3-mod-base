l_german:
 gdp_visit_holding_decision_event.1200.t: "Den Gönner besuchen"
 gdp_visit_holding_decision_event.1200.intro_desc: "Als ich den besonderen Ort ([ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName]) in [ROOT.Char.GetCurrentLocation.GetName] betrete, bin ich von der dortigen Opulenz überwältigt. Überall, wohin ich blicke, finden sich unbezahlbare Artefakte und Verzierungen: Wandteppiche aus [patron.Custom('RegionalFabric')], meisterhaft gefertigte Möbel und Statuen. Der köstliche Duft teurer Speisen ([patron.Custom('GetExpensiveMeal')]) erfüllt die Luft.\n\nVerloren inmitten umhereilender Bediensteter,"
 gdp_visit_holding_decision_event.1200.all_available_desc: "verkündet [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] meine Ankunft, während [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] in der Nähe steht. Ich muss den Rücken gerade machen und meinen Vorschlag unterbreiten."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "bedeutet [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] mir, heranzutreten. Das bedeutet wohl, dass ich oberste Dringlichkeit habe. Ich muss den Rücken gerade machen und meinen Vorschlag unterbreiten."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "bedeutet mir [steward.Custom2('MyCharacterIntroduction', ROOT.Char)], heranzutreten, während [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] nirgends zu sehen ist. Ich schätze, dass [patron.Custom('DE_PRO_PER_S_3P_N')] wohl zu beschäftigt ist, um mich zu treffen. Ich muss den Rücken gerade machen und meinen Vorschlag unterbreiten."
 gdp_visit_holding_decision_event.1200.representative_desc: "wartet [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] darauf, mich im Namen von [patron.GetTitledFirstNameNoTooltip] zu empfangen, [Select_CString(patron.IsFemale, 'die', 'der')] – so sagte man mir – unabkömmlich ist. Ich muss den Rücken gerade machen und meinen Vorschlag unterbreiten."
 gdp_visit_holding_decision_event.1200.none_available_desc: "ist [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] oder jemand anderes, der mein Flehen erhören könnte, nirgends zu sehen. Ich schätze, ich hätte einen Termin vereinbaren sollen."
 gdp_visit_holding_decision_event.1200.a: "Ich will mehr Kontrolle auf den [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip|l]en Märkten."
 gdp_visit_holding_decision_event.1200.a.tt: "Euer Vorschlag könnte folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "Ich werde nach Investitionsgelegenheiten suchen."
 gdp_visit_holding_decision_event.1200.b.tt: "Die Suche nach Finanzunternehmungen könnte folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.c: "Wenn ich es recht überdenke …"
 gdp_visit_holding_decision_event.1200.c.tt: "Gehen wir noch einmal zurück und sehen wir nach, was [THIS.Char.GetCurrentLocation.GetName] sonst noch zu bieten hat"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "Meine Liste von Mitarbeitern beeindruckt [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "Die Namen, die ich erwähne, sind unbedeutend"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "Meine Worte sind beleidigend"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "Meine organisatorischen Fähigkeiten überzeugen [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "Ich verpatze mein Argument"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "Mein Hauptbuch weist Spuren von Unterschlagung auf"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "Ich schaffe es, [negotiator.GetTitledFirstNameNoTooltip] zu überzeugen"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip|U] bleibt unbeeindruckt"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip|U] ist beleidigt von meinen Lügen"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.GetTitledFirstNameNoTooltip|U] ist von meinem Wissen beeindruckt"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "Mein allzu tiefes Eintauchen in Wirtschaftstheorie langweilt [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "Ich schaffe es irgendwie, dass sich [negotiator.GetTitledFirstNameNoTooltip] dumm fühlt"
 gdp_visit_holding_decision_event.1200.a_martial.success: "Mein Wissen um Versorgung im Krieg beeindruckt [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "Ich klinge am Ende doch nur wie [Select_CString(ROOT.Char.IsFemale, 'eine Aufschneiderin', 'ein Aufschneider')]"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "Meine Beispiele klingen wie Drohungen"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.GetTitledFirstNameNoTooltip|U] ist von meiner Stärke schwer beeindruckt"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip|U] gähnt"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip|U] deutet meine zur Schau gestellte Körperlichkeit als Drohung"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "Ihr ersuchtet erst vor Kurzem bei [patron.GetShortUIName] um Handelsprivilegien. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1200_patron_competitiveness'))] wieder"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "Ihr tauschtet erst vor Kurzem bei [patron.GetShortUIName] Gold gegen Prestige ein. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1200_patron_prestige'))] wieder"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: Ein umkämpfter Markt"
 gdp_visit_holding_decision_event.1201.all_available_desc: "Mit einer einladenden Geste ruft mich [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] näher heran. Ich gehe hastig noch ein letztes Mal meinen Vorschlag durch, ehe ich der Aufforderung folge. Es ist von allerhöchster Bedeutung für die [ROOT.Char.GetHouse.GetName]-Handelsgesellschaft, dass diese Vereinbarung getroffen wird.\n\nBeim Herannahen spüre ich die Aura der Überlegenheit, die von [patron.GetFirstName] ausgeht.\n\n„Wenn Ihr Euer Angebot klar darlegt, bin ich womöglich so freundlich, darüber nachzudenken …“"
 gdp_visit_holding_decision_event.1201.patron_available_desc: "Mit einer einschüchternden Geste ruft mich [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] näher heran. Ich gehe hastig noch ein letztes Mal meinen Vorschlag durch, ehe ich der Aufforderung folge. Es ist von allerhöchster Bedeutung für die [ROOT.Char.GetHouse.GetName]-Handelsgesellschaft, dass diese Vereinbarung getroffen wird.\n\nBeim Herannahen spüre ich die Aura der Überlegenheit, die von [patron.GetFirstName] ausgeht.\n\n„Wenn Ihr Euer Angebot klar darlegt, bin ich womöglich so freundlich, darüber nachzudenken …“"
 gdp_visit_holding_decision_event.1201.steward_available_desc: "Mit einer einladenden Geste ruft mich [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] näher heran. Ich gehe hastig noch ein letztes Mal meinen Vorschlag durch, ehe ich der Aufforderung folge. Es ist von allerhöchster Bedeutung für die [ROOT.Char.GetHouse.GetName]-Handelsgesellschaft, dass diese Vereinbarung getroffen wird.\n\n„Wenn Ihr Euer Angebot klar darlegt, treffe ich eine Einschätzung, ob es im besten Interesse von [patron.GetTitledFirstName] ist.“"
 gdp_visit_holding_decision_event.1201.representative_desc: "Mit einer maßvollen Geste ruft mich [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] näher heran. Ich gehe hastig noch ein letztes Mal meinen Vorschlag durch, ehe ich der Aufforderung folge. Es ist von allerhöchster Bedeutung für die [ROOT.Char.GetHouse.GetName]-Handelsgesellschaft, dass diese Vereinbarung getroffen wird.\n\n„Wenn Ihr Euer Angebot klar darlegt, treffe ich eine Einschätzung, ob es im besten Interesse von [patron.GetTitledFirstName] ist.“"
 gdp_visit_holding_decision_event.1201.a: "„Lasst mich den Vertragsvorschlag durchgehen …“"
 gdp_visit_holding_decision_event.1201.b: "„Ihr seid an Euer Wort gebunden, oder etwa nicht?“"
 gdp_visit_holding_decision_event.1201.c: "Nicht so wichtig."
 gdp_visit_holding_decision_event.1201.c.tt: "Zu Eurer Audienz zurückkehren und nachsehen, was Ihr sonst vorschlagen könnt"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: Ein Vorschlag für eine Investition"
 gdp_visit_holding_decision_event.1202.all_available_desc: "Ich stehe untätig daneben, während sich [patron.GetFirstName] meinen Vorschlag durchliest. Der Anflug einer gerunzelten Falte hat sich zwischen [patron.Custom('DE_PRO_POS_S_3P')]en Augenbrauen gebildet, als [patron.Custom('DE_PRO_PER_S_3P_N')] wieder von den Unterlagen aufblickt.\n\n„Mm … Ich verstehe … Ich schätze, ich könnte in Betracht ziehen, für Euch und die [ROOT.Char.GetHouse.GetName]-Handelsgsellschaft für diese Summe zu bürgen. Das sollte ausreichen, damit Ihr Euch etwas Respekt verdient, nicht wahr, [ROOT.Char.GetFirstNameNoTooltip]?“"
 gdp_visit_holding_decision_event.1202.patron_available_desc: "[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] wirkt [negotiator.Custom('DE_PRO_POS_S_3P')]er [negotiator.Custom('ComplimentAdjective')|l]en Miene nach zu urteilen recht interessiert, während ich [negotiator.Custom('DE_PRO_PER_S_3P_D')] meinen Vorschlag erläutere.\n\n„Das reicht aus, damit Ihr Euch etwas Respekt verdient, [ROOT.Char.GetFirstNameNoTooltip].“"
 gdp_visit_holding_decision_event.1202.steward_available_desc: "Ich stehe geduldig daneben, während [steward.GetFirstName] sich meinen Vorschlag durchliest. Mit sichtbarem Interesse am Inhalt schaut [steward.Custom('DE_PRO_PER_S_3P_N')] wieder zu mir auf.\n\n„Dieser Vorschlag ist gut geschrieben. Das muss ich Euch lassen … Ich schätze, ich könnte in Betracht ziehen, für Euch und die [ROOT.Char.GetHouse.GetName]-Gesellschaft bei [patron.GetTitledFirstName] zu bürgen.“"
 gdp_visit_holding_decision_event.1202.representative_desc: "Ich stehe geduldig daneben, während [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] sich auf Geheiß von [patron.GetTitledFirstNameNoTooltip] meinen Vorschlag durchliest. Mit sichtbarem Interesse am Inhalt schaut [negotiator.Custom('DE_PRO_PER_S_3P_N')] wieder zu mir auf.\n\n„Dieser Vorschlag ist gut geschrieben. Ich werde dafür sorgen, dass er die Aufmerksamkeit von [patron.GetTitledFirstName] weckt.“"
 gdp_visit_holding_decision_event.1202.a: "„Vielleicht könnten wir verhandeln …“"
 gdp_visit_holding_decision_event.1202.b: "„Ich nehme Euer Angebot an.“"
 gdp_visit_holding_decision_event.1202.b.success: "Austausch erfolgreich!"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName|U] will Euch eine Weile nicht wiedersehen. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1200_guards_summoned'))] wieder"
 gdp_caught_stealing.tt: "Ihr wurdet unlängst beim Stehlen an einem heiligen Ort erwischt – Euch bleibt der Zutritt bis [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1500_caught_stealing'))] verwehrt"
 gdp_visit_holding_decision_event.1000.b.tt: "Ein Appell an Euren [merchant_patron|E] könnte folgende Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Euer [merchant_patron|E] oder sein Vertreter muss zugegen sein"
 gdp_visit_holding_decision_event.1500.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] besuchen"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "Zurück auf dem Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) ist alles wie immer. Während die Sonne langsam über den Himmel wandert, spenden die angrenzenden Gebäude des offenen Platzes ihm nacheinander im Wechsel Schatten."
 gdp_visit_holding_decision_event.1500.desc_returned_02: "Ein heftiger Duft nach Weihrauch steigt mir unaufhaltsam in die Nase, als ich durch den Halbschatten zurück zum Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) gehe."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "Ich blinzle, als ich aus dem Zwielicht der Heilerhütte trete und mir meinen Weg zurück zum Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) suche."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "Bei der Rückkehr durch die Tore des Geländes um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) umfängt mich eine arkadische Ruhe, als ich mich wieder auf dem großen Platz dort wiederfinde."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "Als ich aus dem stillen Garten zurückkehre, fühle ich mich unbeschwerter, während ich den Blick über den belebten Platz auf dem Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) schweifen lasse."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "Ich folge den sich windenden Gassen fort vom Arbeitszimmer von [merchant_physician_recruit.GetFirstNameNoTooltip] und finde mich auf dem Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) wieder."
 gdp_visit_holding_decision_event.1500.desc: "Auf dem großen Platz des Geländes um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) herrscht eine gewisse Ruhe, obwohl hier viel Handel getrieben wird und zahlreiche [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] sowie deren Helfer unterwegs sind.\n\nDas prächtige Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) selbst ruht in der Mitte, und an den Seiten entdecke ich Schilder mit kühnen Heilungsversprechen und auch einen Garten, wo man sich in die Betrachtung des wahren Wesens der höchsten Macht ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]) versenken kann."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nAm Rande des Platzes predigt [Select_CString(laamp_physician_recruit.IsFemale, 'eine Gläubige', 'ein Gläubiger')] von besserer körperlicher Gesundheit, und wie zuvor vereinbart wurde das kranke Kind [1500_sickly_minor.GetFirstName] in die Heilerhütte eskortiert, wo es auf mich wartet."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nAm Rande des Platzes predigt [Select_CString(merchant_physician_recruit.IsFemale, 'eine Gläubige', 'ein Gläubiger')], dass eine bessere körperliche Gesundheit unsere geistige Gesundheit fördert. [merchant_physician_recruit.Custom('DE_PRO_PER_S_3P_N')|U] bleibt trotz gelegentlicher Zwischenrufe aus der bäuerlichen Menge standhaft."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nWie zuvor mit einem der Aufsteher vereinbart wurde das kranke Kind [1500_sickly_minor.GetFirstName] in die Heilerhütte eskortiert, wo es auf mich wartet."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] nickt anerkennend und schaut sich auf dem belebten Platz um, wobei [visiting_partner.Custom('DE_PRO_PER_S_3P_N')] bereits spannende Stände und Sehenswürdigkeiten ins Visier nimmt."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nIch blicke zufrieden über den Platz und atme ein paarmal tief durch, während ich über mein nächstes Ziel nachdenke."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName|U], [visiting_partner.Custom('DE_ART_DEF_S_N')] langsam ein wenig müde wirkt, sagt: „Ich bin niemand, der sich beschwert, aber … wir sind doch hier jetzt bestimmt fertig, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?“"
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nNachdem ich eine beträchtliche Zeit hier auf dem Gelände um das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) verbracht habe, bin ich mit dem heutigen Tag zufrieden und sehe mich nach dem schnellsten Weg zurück zum Hauptplatz um."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n[Select_CString(merchant_physician_recruit.IsFemale, 'Die hingebungsvolle Predigerin', 'Der hingebungsvolle Prediger')] verlautbart weiterhin [merchant_physician_recruit.Custom('DE_PRO_POS_S_3P')]e gesundheitsbezogenen Lehren, scheint sich aber dem Ende [merchant_physician_recruit.Custom('DE_PRO_POS_S_3P')]es Vortrags zu nähern."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nAus irgendeinem Grund gibt es nun offenbar einen Überfluss an Kindern auf dem Platz. Waren die die ganze Zeit schon hier? Sie spielen und toben und finden ständig neue Wege, alte Dinge zu tun, nicht selten zur Überraschung und zum Verdruss ihrer Aufpasser.\n\nIch muss immer wieder an den Zustand von [1500_sickly_minor.GetFirstName] denken, während ich mir auf dem Platz mein nächstes Ziel aussuche."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\nZu meiner Linken nimmt [visiting_partner.GetFirstName] neugierig einen Stand mit winzigen Fläschchen in Augenschein, die angeblich mit Gifttropfen einer wilden Kreatur ([ROOT.Char.Custom('VenomousCreature')]) gefüllt sind.\n\nAllein der Gedanke daran beschert mir eine Gänsehaut, während ich überlege, wohin ich als Nächstes gehen soll."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName|U] stupst mich an der Schulter an und deutet auf die Wachen, die einen zerlumpten Menschen aus dem Gebäude eskortieren, der etwas vom Ende der Welt schreit.\n\nMeine Augenbrauen heben sich fast wie von selbst und ich beobachte den Tumult, während ich überlege, was ich als Nächstes tun soll."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] reicht mir auf unserem Spaziergang über den Platz einen Happen.\n\nIch kaue nachdenklich auf der getrockneten Ration herum, während ich über meinen nächsten Schritt nachdenke."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nIn einer schattigen Ecke des Platzes versucht ein Händler, seine hochwohlgeborene Kundschaft von der heilenden Wirkung von rotem Sand zu überzeugen.\n\nIch beobachte beiläufig das Gezänk, während ich über meinen nächsten Schritt nachdenke."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nAn einem nahen Stand mit Obsidianspiegeln versucht ein [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter], seine Aufregung zu verbergen, als er endlich die Gelegenheit hat, sich selbst zu betrachten.\n\nLeicht amüsiert versuche ich, eine Entscheidung zu treffen, wohin ich als Nächstes gehen soll."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nBei einer kleinen Rotunde liest ein Händler, der Abschriften eines heiligen Textes ([ROOT.Char.Custom('RandomReligiousTextName')]) feilbietet, einem demütig lauschenden Publikum daraus vor.\n\nIch höre geistesabwesend zu, während ich den Platz beobachte und überlege, was ich als Nächstes tun soll."
 gdp_visit_holding_decision_event.1500.a: "Ich will mir den Segen der Heiler abholen."
 gdp_visit_holding_decision_event.1500.a_second: "Ich kehre zu den Heilern zurück."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Vielleicht können die Heiler ja [1500_sickly_minor.GetFirstNameNoTooltip] helfen?"
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip|U] wartet immer noch auf mich."
 gdp_visit_holding_decision_event.1500.a.tt: "Ein Besuch bei den Heilern könnte die folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "Ihr besuchtet erst vor Kurzem die Heiler. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1500_used_healer_recently'))] wieder"
 gdp_visit_holding_decision_event.1500.b: "Dieses Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) ist faszinierend."
 gdp_visit_holding_decision_event.1500.b_second: "Das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) ist noch einen Besuch wert."
 gdp_visit_holding_decision_event.1500.b.tt: "Ein Betreten der örtlichen Verehrungsstätte könnte die folgenden Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "Ihr besuchtet erst vor Kurzem das örtliche Gotteshaus. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1500_used_holy_site_recently'))] wieder"
 gdp_visit_holding_decision_event.1500.c: "Die Gärten sehen interessant aus."
 gdp_visit_holding_decision_event.1500.c_second: "Ich werde noch einen Bick auf die Gärten werfen."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ Glauben bedenken und [stress|E] verringern"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ Nach Proviant suchen"
 gdp_visit_holding_decision_event.1500.c.tt: "Ein Besuch der Gärten könnte die folgenden Gelegenheiten ergeben: $gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "Ihr besuchtet erst vor Kurzem die Gärten. Versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1500_used_garden_recently'))] wieder"
 gdp_visit_holding_decision_event.1500.d: "Ist das ein Prediger dort drüben?"
 gdp_visit_holding_decision_event.1500.d_second: "Ich habe noch etwas mit [merchant_physician_recruit.GetFirstNameNoTooltip] zu besprechen."
 gdp_visit_holding_decision_event.1500.d.tt: "Mit dem Arzt zu sprechen, könnte die folgende Gelegenheit ergeben: $gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "Ich werde mich um andere Dinge kümmern."
 gdp_visit_holding_decision_event.1501.intro: "Das Licht ist gedämpft und es #EMP riecht#! merklich in der Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')]. Nicht #EMP unangenehm#!, aber eindringlich.\n\n[merchant_healer_character.GetFirstName|U] steht an einem hohen Tisch und bereitet ein Gebräu zu."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: [Select_CString(merchant_healer_character.IsFemale, 'Die Heilerin', 'Der Heiler')]"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ Als wir eintreten schaut [Select_CString(merchant_healer_character.IsFemale, 'eine', 'ein')] [merchant_healer_character.GetWomanMan] mit einem strahlenden Lächeln zu uns auf.\n\n„Willkommen in meinem bescheidenen Obdach! Ich bin [merchant_healer_character.GetFirstNameNoTooltip]. Wie kann ich Euch hefen?“"
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "[Select_CString(1500_sickly_minor.IsFemale, 'Meine', 'Mein')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName], [Select_CString(1500_sickly_minor.IsFemale, 'die', 'der')] krank ist, kommt mit mir in die Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')]. [1500_sickly_minor.Custom('DE_PRO_PER_S_3P_N')|U] hustet schlimm, während ich [1500_sickly_minor.Custom('DE_PRO_PER_S_3P_A')] die Treppe hinuntertrage.\n\n[Select_CString(merchant_healer_character.IsFemale, 'Die Heilerin', 'Der Heiler')] [merchant_healer_character.GetFirstName] steht von [merchant_healer_character.Custom('DE_PRO_POS_S_3P')]em Holzschemel auf und sieht mich düster an. „Werdet Ihr meine Dienste brauchen?“"
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "Als wir die Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')] betreten, ist [merchant_healer_character.GetFirstName] gerade dabei, eine Reinigungsprozedur an einem älteren Patienten durchzuführen. [visiting_partner.GetFirstName|U] beobachtet [merchant_healer_character.GetFirstNameNoTooltip] eifrig, ein aufgeregtes Funkeln in den Augen. „Ich hätte nichts dagegen, mich auch #EMP daran#! zu versuchen …“\n\n[merchant_healer_character.GetFirstNameNoTooltip|U] schaut auf, als [merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')] unsere Stimmen hört. „Ich hatte Euch gar nicht gesehen! Plagt Euch etwas?“"
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ [merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')|U] schaut auf und hebt leicht die Augenbrauen. „Wie ich sehe, habt Ihr es in einem Stück wieder hierher geschafft! Wie kann ich Euch dieses Mal helfen?“"
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName|U] liegt auf einem weichen Bett neben dem Ofen in der Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')] und wartet auf meine Rückkehr. Rasch beuge ich mich vor, um [1500_sickly_minor.Custom('DE_PRO_POS_S_3P')]e Atmung zu überprüfen, und streichle [15000_sickly_minor.Custom('DE_PRO_PER_S_3P_D')] übers Haar.\n\n[merchant_healer_character.GetFirstName|U] legt [merchant_healer_character.Custom('DE_PRO_POS_S_3P')] Schreibwerkzeug ([ROOT.Char.Custom('WritingInstrument')]) beiseite und sieht mich grimmig an. „Worauf hatten wir uns geeinigt?“"
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "Als wir die Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')] betreten, brütet [merchant_healer_character.GetFirstName] über ein paar Kräutern, doch [merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')] schaut zu uns auf, als wir die Treppe hinunterkommen. „Ah, Ihr habt es Euch also anders überlegt?“\n\nZu meiner Linken trippelt [visiting_partner.GetFirstNameNoTooltip] unruhig, immer noch voller Verlangen, jene Prozedur, die wir [merchant_healer_character.GetFirstNameNoTooltip] vorhin haben durchführen sehen, einmal selbst zu versuchen."
 gdp_visit_holding_decision_event.1501.desc_returned_01: "[merchant_healer_character.GetFirstName|U] kümmert sich gerade um einen anderen Patienten, als ich die Treppe hinunterkomme und die Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')] betrete. [merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')|U] wirft mir einen kurzen Blick zu, ehe [merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')] [merchant_healer_character.Custom('DE_PRO_POS_S_3P')]em Patienten ein Zeichen gibt, sich auf etwas Bettzeug weiter hinten im Raum zu setzen.\n\n[merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')|U] zieht einen behelfsmäßigen Vorhang aus einem zerschlissenen Laken zu, um sowohl dem Patienten als auch uns etwas mehr Ungestörtheit zu verschaffen.\n\n„Wie ich sehe, seid Ihr zurückgekehrt“, merkt [merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')] eifrig an. „Braucht Ihr meine Hilfe bei irgendetwas?“"
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Als ich die schwach beleuchtete Hütte [Select_CString(merchant_healer_character.IsFemale, 'der Heilerin', 'des Heilers')] erneut betrete, sitzt [merchant_healer_character.GetFirstName] ein Stück tiefer im Raum und blättert in einem abgenutzten Tagebuch. Aus der Entfernung ist es schwer zu erkennen, doch es scheint Darstellungen des menschlichen Leibes zu enthalten.\n\n[merchant_healer_character.Custom('DE_PRO_PER_S_3P_N')|U] schlägt das Tagebuch behutsam zu, steckt es weg, sieht mich dann an und meint mit ruhiger Stimme: „Ah, Ihr seid also zurück. Habt Ihr doch noch etwas gefunden, was Euch plagt?“"
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nAus dem Augenwinkel erspähe ich ein paar medizinische Schmuckstücke, von denen ein prächtiges Horn meine Aufmerksamkeit besonders fesselt."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nEin Stück tiefer im Raum ruht immer noch dieses prächtige Artefakt ([1500_health_artifact.GetName]) inmitten all der anderen medizinischen Schmuckstücke."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nAuf einem Regal ein Stück tiefer im Raum voller medizinischer Schmuckstücke schreit ein sonderbares Artefakt ([1500_health_artifact.GetName]), das ich dort erspähe, geradezu nach meiner Aufmerksamkeit."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nEin Stück tiefer im Raum schreit dieses prächtige Artefakt ([1500_health_artifact.GetName]) geradezu noch immer nach meiner Aufmerksamkeit."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "„Ich interessiere mich für dieses Artefakt ([1500_health_artifact.GetNameNoTooltip]).“"
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "„[1500_sickly_minor.GetFirstNameNoTooltip], mein[1500_sickly_minor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))], muss behandelt werden!“"
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Behandlungsfehlschlag"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "Die Behandlung scheitert"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "Behandlung erfolgreich"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: Das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U])"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "Eine Predigt ist gerade zu Ende gegangen, als wir in das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) zurückkehren. [merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] geht mit einem Besen umher, räumt behutsam auf und säubert den heiligen Boden für alle Besucher, die zwecks eines Gebets oder aus dem Wunsch nach Besinnung hierherkommen.\n\n[merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')|U] schaut auf, als ich mich nähere, und ein sanftes Lächeln umspielt [merchant_clergy_character.Custom('DE_PRO_POS_S_3P')]e Lippen. „Willkommen zurück in der warmen Umarmung der höchsten Macht ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]). Warum bleibt Ihr nicht eine Weile und genießt die Umgebung?“"
 gdp_visit_holding_decision_event.1503.desc_returned_02: "[merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] sitzt auf einer der Bänke gegenüber der Kanzel und wirkt in Gedanken versunken, als ich das Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) erneut betrete.\n\n[merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')|U] dreht den Kopf in meine Richtung und schaut über die Schulter, als ich mich nähere. „Es gibt so viel zu tun. Lasst diese müden Füße einen Augenblick Ruhe finden, mein Kind. Wie kann ich Euch helfen?“"
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "Als ich durch die bemerkenswert prächtigen Tore des Gotteshauses ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) trete, haben die [GetTrait('devoted').GetNameNoTooltip(merchant_clergy_character)|l]en Kleriker, die diesen Ort betreuen, gerade ihre Aufgaben für den Tag verteilt.\n\nIch schaue den Hauptgang hinunter und erblicke unerwartet [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName], [Select_CString(merchant_clergy_character.IsFemale, 'die mir ihrerseits', 'der mir seinerseits')] einen unergründlichen Blick zuwirft und zu mir herüberkommt. „Mein eigensinniges Kind. Die höchste Instanz ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]) hat Euch wohlbehalten an unsere Türschwelle zurückgebracht!“"
 gdp_visit_holding_decision_event.1503.desc: "Als ich die Tore des Gotteshauses ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) durchschreite, bin ich beeindruckt von der Arbeit, die in die erlesenen Strukturen und die sakrale Ausstattung geflossen sein muss.\n\n[Select_CString(merchant_clergy_character.IsFemale, 'Eine der frommen Klerikerinnen', 'Einer der frommen Kleriker')], die sich um diesen Ort kümmern, bemerkt mich und kommt gemessenen Schrittes zu mir herüber. „Seid gegrüßt, mein Kind. Ich bin [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName]. Wie kann ich Euch helfen?“"
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "Nun #EMP ja#! …"
 gdp_visit_holding_decision_event.1503.b: "„Vielleicht könnte die höchste Macht ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]) unsere Gesellschaft segnen?“"
 gdp_visit_holding_decision_event.1503.c: "Offensichtlich bin #EMP ich#! dringend auf diese Spenden angewiesen."
 gdp_visit_holding_decision_event.1503.c_guarded: "Eine weitere Spende. In #EMP meinen#! Geldbeutel."
 gdp_visit_holding_decision_event.1503.c_master_thief: "„Pst, [visiting_partner.GetFirstNameNoTooltip]! Passt auf!“"
 gdp_visit_holding_decision_event.1503.c.flavor: "Für eine Ablenkung sorgen und ein paar Münzen abgreifen. Ganz leicht."
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Hm. Die Wachen streifen wirklich viel durch diesen Teil – aus irgendwelchen Gründen …"
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Erfolgreicher Diebstahl"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "Ihr stehlt erfolgreich die Spenden"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "Verbannt!"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "Ihr werdet aus dem Gotteshaus ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) verbannt"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Wachen wurden gerufen"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "Als ich die Spende überreiche, weiten sich die Augen von [merchant_clergy_character.GetFirstName] vor Schreck. „Ihr … Ihr seht genauso aus wie [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U] … [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U] … Ich schwöre es …“ [merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')|U] starrt mich einen Moment lang an und öffnet und schließt den Mund wie ein Fisch auf dem Trockenen.\n\nDann, als [merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')] begreift, was [merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')] da gerade treibt, reißt [merchant_clergy_character.GetFirstNameNoTooltip] sich zusammen und räuspert sich. „Es wäre mir eine Ehre, #EMP mein#! Leben Eurer Sache zu widmen.“"
 gdp_visit_holding_decision_event.1504.desc: "Das Lächeln von [merchant_clergy_character.GetFirstName] wird breiter, als [merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')] sich zu mir beugt und mir eine Hand auf die Schulter legt. „Sehr gütig von Euch, mein Kind. Ich weiß, dass Münzen für Kaufleute wie Euch nicht immer leicht zu bekommen sind.“\n\n[merchant_clergy_character.Custom('DE_PRO_PER_S_3P_N')|U] nickt anerkennend und [merchant_clergy_character.Custom('DE_PRO_POS_S_3P')]e Hand fällt zurück an [merchant_clergy_character.Custom('DE_PRO_POS_S_3P')]e Seite, während [merchant_clergy_character.Custom('DE_PRO_POS_S_3P')] Blick weiter auf mir ruht."
 gdp_visit_holding_decision_event.1504.a: "„Könnte vielleicht die höchste Macht ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]) unsere Geschäfte segnen?“"
 gdp_visit_holding_decision_event.1504.a_epiphany: "„Ich bin allein an der Gnade der höchsten Macht ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]) interessiert.“"
 gdp_visit_holding_decision_event.1504.b: "„Wir #EMP könnten#! noch jemand Tüchtigen brauchen.“"
 gdp_visit_holding_decision_event.1504.c: "„Wenn es eines gibt, worum ich mich schere, so sind es meine Mitmenschen.“"
 gdp_visit_holding_decision_event.1504.c_epiphany: "… Wir stellen derzeit niemanden ein."
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: Der Garten"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "Im Garten herrscht noch immer beschauliche Ruhe, und einige Besucher führen gedämpfte Gespräche in den Sitzbereichen, wohingegen andere in stille Versenkung vertieft sind und die Natur betrachten.\n\nIch lausche dem Raunen und der Brise. Dank des Winds in den Bäumen fühle ich mich plötzlich viel wohler."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "Diesmal entdecke ich einen kleinen Vogel in einem der Bäume ([ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]), der gerade dabei ist, zum ersten Mal seine Flügel zu erproben.\n\nEr rutscht sanft über den Rand des Nestes, doch die Flügel sind irgendwie ineinander verheddert, und für einen Wimpernschlag fällt der Vogel im freien Fall durch die Luft, bis … der Wind ihn sacht auffängt und in Sicherheit trägt. Ein Gefühl der Erleichterung breitet sich in meiner Brust aus."
 gdp_visit_holding_decision_event.1505.desc: "Der Garten ist von Hecken umrahmt, und auf den sanften Hügeln stehen Bäume, durch deren Laub man den einen oder anderen Vogel und das eine oder andere Eichhörnchen beobachten kann.\n\nIch spüre hier ganz deutlich eine Präsenz, die in all dieser Schönheit eingefangen ist. Was, wenn die höchste Macht ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]) mir bei all meinen Schwierigkeiten und Nöten die ganze Zeit über beigestanden hat …?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nEin Stück die Straße hinauf schaut sich [visiting_partner.GetFirstName] noch einmal die essbaren Pflanzen hier an."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nUnd weiter die Straße hinunter entdecke ich noch mehr wilde Leckerbissen, die sich der Nachmittagssonne entgegenrecken."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nVon hinten höre ich [visiting_partner.GetFirstName] jedes Mal murmeln, wenn wir auf unserem Spaziergang auf eine weitere obskure, aber essbare Pflanze stoßen."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nAus den Augenwinkeln bemerke ich köstlich aussehende Wildfrüchte und Kräuter, die zur Üppigkeit des Gartens beitragen."
 gdp_visit_holding_decision_event.1505.a: "Ich spüre nur Frieden in mir."
 gdp_visit_holding_decision_event.1505.a_convert: "Vielleicht ist dieser Glaube ([ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]) doch gar keine so schlechte Sache."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "Ihr sinniertet erst vor Kurzem über diesem Garten – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1505_contemplated_garden_recently'))] wieder"
 gdp_visit_holding_decision_event.1505.b: "Es wäre eine Schande, diese Leckerbissen zu verschwenden."
 gdp_visit_holding_decision_event.1505.b_partner: "„[visiting_partner.GetFirstNameNoTooltip|U], wie wäre es, wenn wir auf Nahrungssuche gehen?“"
 gdp_visit_holding_decision_event.1505.b_flavor: "Erntezeit!"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "Ihr erntetet erst vor Kurzem diesen Garten – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1505_has_harvested_recently'))] wieder"
 gdp_visit_holding_decision_event.1505.c: "„… so viele versteckte Ecken und Winkel, #EMP [visiting_partner.GetFirstNameNoTooltip]#! …“"
 gdp_visit_holding_decision_event.1505.c.flavor: "Wahrlich göttlich."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "Ihr erntetet erst vor Kurzem diesen Garten – versucht es nach [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, '1505_garden_unwinded_recently'))] wieder"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$: [Select_CString(merchant_physician_recruit.IsFemale, 'Die Ärztin', 'Der Arzt')]"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "Die Tür zum Arbeitszimmer von [merchant_physician_recruit.GetFirstName] steht einen Spalt offen, und durch diesen beobachte ich, wie [merchant_physician_recruit.GetFirstNameNoTooltip] einem Patienten, der ganz still dasitzt, mit einer erschreckend scharfen und schmalen Schere die Haare schneidet.\n\nIch klopfe an die Tür und trete ein, wobei ich die Aufmerksamkeit [Select_CString(merchant_physician_recruit.IsFemale, 'der Ärztin', 'des Arztes')] auf mich lenke. „So ein heimliches Erscheinen. Was wolltet Ihr denn?“"
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName|U] steht vor [merchant_physician_recruit.Custom('DE_PRO_POS_S_3P')]er Tür und untersucht die Schulter eines Menschen, der offenbar Schmerzen hat.\n\n[merchant_physician_recruit.Custom('DE_PRO_PER_S_3P_N')|U] beendet die Visite, gibt Anweisungen, wie das Gelenk am besten heilen wird, und wendet sich danach an mich: „Ihr seid wieder da. Wollt Ihr dieses Mal etwas?“"
 gdp_visit_holding_decision_event.1507.desc_returned_03: "Als ich vorsichtig die Treppe zum Arbeitszimmer von [merchant_physician_recruit.GetFirstName] hinaufgehe, schaue ich durch die offene Tür.\n\n[merchant_physician_recruit.Custom('DE_PRO_PER_S_3P_N')|U] scheint in eine Art körperliche Übung vertieft zu sein und gerät recht ordentlich ins Schwitzen, während [merchant_physician_recruit.Custom('DE_PRO_PER_S_3P_N')] immer wieder in die Hocke geht, aufsteht und von vorn beginnt.\n\nNach einer gewissen Anzahl von Wiederholungen hört [merchant_physician_recruit.Custom('DE_PRO_PER_S_3P_N')] auf, wischt sich die Stirn ab und nimmt einen Schluck aus einer nahen Flasche. [merchant_physician_recruit.Custom('DE_PRO_POS_S_3P')|U] messerscharfer Blick richtet sich auf mich. „Ihr seid ganz schön beharrlich, hm?“"
 gdp_visit_holding_decision_event.1507_desc_intro: "Ich folge [merchant_physician_recruit.GetFirstName] eine schmale Gasse hinunter, eine Treppe hinauf und in [merchant_physician_recruit.Custom('DE_PRO_POS_S_3P')] Arbeitszimmer hinein. Der Raum ist vom Boden bis zur Decke mit Regalen vollgestopft, in denen sich Schriften und Drucke zu den Themen Körpersäfte, Gesundheit und Spiritualität befinden.\n\n[merchant_physician_recruit.Custom('DE_PRO_PER_S_3P_N')|U] setzt sich auf den einzigen Stuhl am Schreibtisch, streicht geistesabwesend über einen kleinen Talisman und bemerkt dann endlich meine Anwesenheit."
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$ „Oh. Habe ich Euch nicht schon einmal irgendwo gesehen? Was wollt Ihr?“\n\nIch wäge meine Worte sorgfältig ab, ehe ich erwidere:"
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$ „Oh. Ihr. Wolltet Ihr etwas?“\n\n„Ich habe Euren Vortrag für die Schlechtergestellten gesehen“, antworte ich und zögere, ehe ich fortfahre:"
 gdp_visit_holding_decision_event.1507.a: "„Wollt Ihr für mich arbeiten?“"
 gdp_visit_holding_decision_event.1507.b: "„Helft mir, die Geistesstärke meiner Mitarbeiter zu mehren!“"
 gdp_visit_holding_decision_event.1507.c: "„Ihr müsst Euer Können #EMP anwenden#!, um auf der Höhe zu bleiben. Schließt Euch meiner Gesellschaft an.“"
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName|U] teilt Eure Einschätzung"
 gdp_visit_holding_decision_event.1507.c.failure: "Ihr scheitert daran, [merchant_physician_recruit.GetShortUIName] zu verlocken"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUIName|U] beginnt, nicht weiter auf Euch zu achten"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "Zum Gelände der Verehrungsstätte ([THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]) zurückkehren und nachsehen, was es sonst noch zu bieten hat"
