l_german:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip|U]: Was verloren ist"
 gdp_guelph_ghibelline_scheme.1000.desc: "Ich bin auf dem jährlichen Volksfest von [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], wo die Freude und die Kameradschaft greifbar sind.\n\nDer Lärm der ausgelassenen Festlichkeiten, bunt verzierte Stoffe und der Geruch der köstlichen [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip|l]en Küche umgeben einen überall – ein Genuss für meine müden Sinne.\n\nZufälligerweise treffe ich auf [target.GetTitledFirstName], [target.Custom('DE_ART_DEF_S_N')] begeistert einen Marktstand betrachtet, und ich ergreife die Gelegenheit, meinen Charme spielen zu lassen."
 gdp_guelph_ghibelline_scheme.1000.a: "„Die #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]#! versuchen, diese Festlichkeiten zu verbieten, wisst Ihr?“"
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "Ihr legt erfolgreich die Böswilligkeit der [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')] dar"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName|U] weist Euch ab"
 gdp_guelph_ghibelline_scheme.1000.b: "„Dieser Anstecker würde hervorragend zu Euch passen, [Select_CString(target.IsFemale, 'meine Freundin', 'mein Freund')]!“"
 gdp_guelph_ghibelline_scheme.1000.c: "Kein Grund für mich, hier einzugreifen."
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip|U]: Die Gerüchte besagen …"
 gdp_guelph_ghibelline_scheme.1010.desc: "Von meinen Wissenszuträgern höre ich, dass [target.GetTitledFirstName], unser #EMP geschätztes#! Oberhaupt ([ROOT.Char.Custom('GetGuelphGhibelline')]), in letzter Zeit irgendwie überfordert wirkt und sich unter der Last [target.Custom('DE_PRO_POS_S_3P')]er beschwerlichen Pflichten krümmt.\n\nEin paar klug gesetzte Briefe an unsere Partisanen könnten diesen Eindruck bestätigen und einen #EMP würdigeren#! Träger dieser Last vorschlagen."
 gdp_guelph_ghibelline_scheme.1010.a: "Schreibt umgehend diese Briefe."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "Verbesserte Erfolgschance durch Eure @gg_involvement_icon! [gg_involvement|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Eure Briefe überzeugen viele [ROOT.Char.Custom('GetGuelphsGhibellines')] von Eurer Führung"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Eure Briefe richten mehr Schaden an, als dass sie Gutes bewirken"
 gdp_guelph_ghibelline_scheme.1010.b: "Ein jeder aus Haus [ROOT.Char.GetHouse.GetName] wäre ein großartiger Anführer!"
 gdp_guelph_ghibelline_scheme.1010.c: "Wer kann schon sagen, dass das überhaupt stimmt?"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip|U]: Silberne Zunge"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "Es scheint, als habe [Select_CString(court_agent.IsFemale, 'meine Agentin', 'mein Agent')] [court_agent.GetTitledFirstName] bei einer Gruppe betrogener Höflinge und Andersdenkender am Hof von [target.GetTitledFirstName] Gehör gefunden."
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "Es scheint so, als sei [Select_CString(court_agent.IsFemale, 'meine Agentin', 'mein Agent')] [court_agent.GetTitledFirstName] unter den [target.Custom('GetGuelphsGhibellines')], die unzufrieden mit der Führung von [target.GetTitledFirstName] sind, auf verständnisvolle Ohren gestoßen."
 gdp_guelph_ghibelline_scheme.1020.intro: "Es scheint, als habe [Select_CString(court_agent.IsFemale, 'meine Agentin', 'mein Agent')] [court_agent.GetTitledFirstName] bei [target.GetTitledFirstName] Gehör gefunden."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nIch bin mit meinem nächsten Brief an [court_agent.GetTitledFirstNameNoTooltip] längst überfällig."
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "Sollten wir mit diesen einheimischen Unruhestiftern zusammenarbeiten, um unsere Pläne voranzutreiben?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "Ich lasse [court_agent.Custom('DE_PRO_PER_S_3P_A')] ihre Zweifel an [target.GetFirstNameNoTooltip] nähren?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "Ergreife ich diese Gelegenheit und lasse [court_agent.Custom('DE_PRO_PER_S_3P_A')] sich vor [Select_CString(target.IsFemale, 'der', 'dem')] [target.GetTitleAsNameNoTooltip] für die [ROOT.Char.Custom('GetGuelphsGhibellines')] aussprechen?"
 gdp_guelph_ghibelline_scheme.1020.a: "Nutzt meine Bemühungen stattdessen als Druckmittel."
 gdp_guelph_ghibelline_scheme.1020.b: "Lasst uns diese … Schurken für uns nutzen."
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip|U] sollte sich [court_agent.Custom('DE_PRO_POS_S_3P')]en Unterhalt verdienen."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName|U] treibt Eure Pläne erfolgreich voran"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName|U] ist wenig überzeugend"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.Custom('DE_PRO_PER_S_3P_N')|U] sollte sich auf meinen Ruf konzentrieren."
 gdp_guelph_ghibelline_scheme.1020.prestige: "Beschädigtes Prestige"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Euer Prestige wurde etwas beschädigt."
 gdp_guelph_ghibelline_scheme.1020.piety: "Beschädigte Frömmigkeit"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Eure Frömmigkeit wurde etwas beschädigt."
 gdp_guelph_ghibelline_scheme.1020.e: "Meine Hingabe spricht für sich!"
 gdp_guelph_ghibelline_scheme.1020.f: "Ich sollte mich nicht einmischen."
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip|U]: Die Räder schmieren"
 gdp_guelph_ghibelline_scheme.1030.desc: "Einer meiner langjährigen Mitarbeiter eilt auf mich zu, als ich eines Morgens meine Runde mache:\n\n„M[ROOT.Char.Custom('DE_ART_IND_N')] [ROOT.Char.GetTitleAsNameNoTooltip], unsere Wissenszuträger am Hof von [target.GetTitledFirstName] berichten, dass die Fähigkeiten, die [Select_CString(target.IsFemale, 'diese', 'dieser')] [target.GetTitleAsNameNoTooltip] in Sachen [ROOT.Char.Custom('DescribeTargetSkill')] besitzt, bestenfalls lächerlich sind.\n\nVielleicht könnten wir dies irgendwie zu unserem Vorteil nutzen …?“"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "Mein[sly_character.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', sly_character )] [sly_character.GetTitledFirstName] kommt diskret auf mich zu, als ich eines Morgens meine Runde mache:\n\n„Was unsere Bemühungen anbelangt, eine gewisse Sache ([target.GetPrimaryTitle.GetName]) vor den törichten [target.Custom('GetGuelphsGhibellines')] #EMP zu retten#!: Wie wäre es, wenn wir die Fähigkeiten in Sachen [ROOT.Char.Custom('DescribeTargetSkill')] anzweifeln, die [target.GetTitledFirstName] besitzt?\n\nNach allem, was ich höre, scheint [target.Custom('DE_PRO_PER_S_3P_N')] eher glanzlos in dieser Hinsicht zu sein.“"
 gdp_guelph_ghibelline_scheme.1030.a: "„Unsere Bemühungen werden jeden Klatsch ausstechen.“"
 gdp_guelph_ghibelline_scheme.1030.a.tt: "Verbesserte Erfolgschance durch Eure @gg_involvement_icon! [gg_involvement|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "Ihr schwächt erfolgreich [target.GetShortUIName]"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Eure Bemühungen sind vergebens"
 gdp_guelph_ghibelline_scheme.1030.b: "„Wir sollten dies nutzen, um [target.Custom('DE_PRO_PER_S_3P_A')] an [target.Custom('DE_PRO_POS_S_3P')]em Hof zu schwächen.“"
 gdp_guelph_ghibelline_scheme.1030.c: "„Lasst uns diese Gerüchte anheizen.“"
 gdp_guelph_ghibelline_scheme.1030.d: "„Ich denke nicht, dass wir das tun sollten.“"
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.1262.desc: "Ein großer Erfolg! [target.GetTitledFirstName|U] ist endlich einsichtig und steht nun an unserer Seite als [owner.Custom('GetGuelphGhibelline')] – treu und wahrhaftig.\n\nIch wusste, dass [target.Custom('DE_PRO_PER_S_3P_N')] noch einlenken würde."
 scheme_critical_moments.1262.a: "Hervorragend!"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.1263.desc: "#EMP Leute gibt es …#! Sehr zu unserem geteilten Verdruss besteht [target.GetTitledFirstName] darauf, dass die [target.Custom('GetGuelphsGhibellines')] recht haben – ganz gleich, wie viel ich auch argumentiere, verhandle und bitte.\n\nIch muss nicht erwähnen, dass wir dieses Mal #EMP nicht#! freundschaftlich auseinandergingen."
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')|U]#!!"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.1272.desc: "Lasst uns feiern! Nach und nach entziehen die [owner.Custom('GetGuelphsGhibellines')] [target.GetTitledFirstName] ihre Unterstützung und blicken stattdessen auf mich, wenn sie Führung suchen.\n\n[target.Custom('DE_PRO_PER_S_3P_N')|U] hat keine Wahl, sondern muss zurücktreten."
 scheme_critical_moments.1272.a: "Famos!"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.1273.desc: "Trotz all unserer Bemühungen bleibt [target.GetTitledFirstName] weiterhin unerschütterlich an erster Stelle unter den [owner.Custom('GetGuelphsGhibellines')], und die Unterstützung, die ich zuvor sammeln konnte, ist verkümmert und verschwunden."
 scheme_critical_moments.1273.desc.secret: "\n\nWenigstens kennt [target.Custom('DE_PRO_PER_S_3P_N')] meine Pläne immer noch nicht."
 scheme_critical_moments.1273.desc.discovered: "\n\nWas noch schlimmer ist: [target.Custom('DE_PRO_PER_S_3P_N')|U] weiß, dass ich dahinterstecke, und [target.Custom('DE_PRO_PER_S_3P_N')] wird das kaum vergessen."
 scheme_critical_moments.1273.a: "Ts, ts."
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.1282.desc: "Großer Erfolg! [target.GetTitledFirstName|U] ist endlich einsichtig und steht nun an unserer Seite als [owner.Custom('GetGuelphGhibelline')]: treu und wahrhaftig.\n\nIch wusste, dass [target.Custom('DE_PRO_PER_S_3P_N')] noch einlenken würde."
 scheme_critical_moments.1282.a: "Hervorragend!"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.1283.desc: "#EMP Leute gibt es …#! Sehr zu unserem geteilten Verdruss besteht [target.GetTitledFirstName] darauf, dass die [target.Custom('GetGuelphsGhibellines')] recht haben – ganz gleich, wie viel ich auch argumentiere, verhandle und bitte.\n\nIch muss nicht erwähnen, dass wir dieses Mal #EMP nicht#! freundschaftlich auseinandergingen."
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')|U]#!!"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: Erfolg"
 scheme_critical_moments.1292.desc.intro: "Hervorragende Neuigkeiten: [target.GetTitledFirstName|U] wird durch [target_character.GetTitledFirstName] ersetzt, [target_character.Custom('DE_ART_DEF_S_N')] sehr viel wohlwollender ist!"
 scheme_critical_moments.1292.desc.intro.unknown: "Hervorragende Neuigkeiten: [target.GetTitledFirstName|U] wird durch jemanden ersetzt, der der Sache treu ergeben ist!"
 scheme_critical_moments.1292.desc: "\n\nDas ist wahrhaftig ein besonderer Erfolg für die [ROOT.Char.Custom('GetGuelphsGhibellines')], denn nun können wir sicher sein, dass das Reich ([target.GetPrimaryTitle.GetDefinitiveName]) gerecht und ordnungsgemäß regiert werden wird."
 scheme_critical_moments.1292.desc.discovered: "\n\nMeine Beteiligung blieb allerdings nicht unbemerkt, weswegen ich künftig gut auf der Hut sein sollte …"
 scheme_critical_moments.1292.a: "Hört, hört!"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: Fehlschlag"
 scheme_critical_moments.1293.desc: "Der Mensch denkt, Gott lenkt …\n\n#EMP Irgendjemand beging irgendwann einen Fehler.#! Ich werde schon noch herausfinden, wer es war, doch derzeit kann ich nicht leugnen, dass mir [target.GetTitledFirstName] diesmal entkommen ist. Für eine kleine Weile länger werden wir wohl eine wahnwitzige [target.Custom('GetGuelphsGhibellines')]-Herrschaft über das Reich ([target.GetPrimaryTitle.GetDefinitiveName]) hinnehmen müssen."
 scheme_critical_moments.1293.a: "#EMP Verflixt#!!"
