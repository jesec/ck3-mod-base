l_german:
 guelphs_ghibellines_prefix: "Guelfen und Ghibellinen:"
 gdp_guelph_ghibelline.0500.t: "Die Guelfen und Ghibellinen"
 gdp_guelph_ghibelline.0500.intro.all: "Ein misstrauischer Blick; ein abschätziges Schnauben – der Streit zwischen [pope_scope.GetTitledFirstName] und [ghibelline_leader.GetTitledFirstName] schuf einen wachsenden Riss in der sonst so engen Gemeinschaft Norditaliens.\n\nDiejenigen, die das Oberhaupt ([ghibelline_leader.GetTitleAsNameNoTooltip]) der Ghibellinen im Streben nach Imperialismus und Schutz unterstützen, müssen gegen jene kämpfen, die eine zunehmende Unabhängigkeit suchen und die Guelfen des Pontifikats unterstützen."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "Ein misstrauischer Blick; ein abschätziges Schnauben – dieser absurde Streit zwischen dem abtrünnigen Oberhaupt ([ghibelline_leader.GetTitleAsName]) und meinen frommen Offiziellen schuf in letzter Zeit einen wachsenden Riss in der sonst so engen Gemeinschaft Norditaliens.\n\nDiejenigen, die die Ghibellinen im Streben nach Imperialismus und Schutz unterstützen, müssen gegen meine gottesfürchtigen Guelfen kämpfen, die einfach nur ihre Eigenständigkeit im Angesicht der Tyrannei unterstützen.\n\nZusammen werden wir dem Oberhaupt ([ghibelline_leader.GetTitleAsNameNoTooltip]) schon Vernunft beibringen. Es ist an der Zeit, das zu zeigen, was ich am besten kann: [ROOT.Char.Custom('GetHighestSkillAdjective')]."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "Ein misstrauischer Blick; ein abschätziges Schnauben – dieser absurde Streit zwischen den Narren des Pontifikats und mir schuf angeblich einen wachsenden Riss in der sonst so engen Gemeinschaft Norditaliens.\n\nDiejenigen, die #EMP meine#! Ghibellinen für Sicherheit und Schutz unterstützen, müssen gegen jene kämpfen, die Unsicherheit und eine zerbrechliche Unabhängigkeit suchen, indem sie den einfältigen Guelfen des Pontifikats den Rücken stärken.\n\nAls [ghibelline_leader.GetTitleAsNameNoTooltip] bin ich misstrauisch gegenüber diesen kirchlichen Guelfen-Wichtigtuern. Sie haben lange genug meine Autorität untergraben und werden sich schon noch fügen – auf die eine oder andere Art …"
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nGesegnet sind wir, dass unser pflichtschuldiges Oberhaupt ([guelph_leader.GetFirstNameNoTooltip]) zu unserer Stimme wird und den Kampf gegen unseren kaiserlichen Unterdrücker aufnimmt. Und ich werde meinen Teil dazu beitragen."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nIch bin überzeugt, dass unser Oberhaupt ([ghibelline_leader.GetTitleAsNameNoTooltip]) als Einziges wahrhaftig unsere Leute und unser Reich gegen jene verteidigt, die uns schaden wollen. Im Gegenzug werde ich [ghibelline_leader.Custom('DE_PRO_POS_S_3P')]e Ghibellinen in vollem Umfang unterstützen."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nDa ich bisher noch kein Bündnis einging, sollte ich die Streitparteien sorgfältig gegeneinander abwägen, damit ich im besten Interesse von Haus [ROOT.Char.GetHouse.GetBaseName] handeln kann."
 gdp_guelph_ghibelline.0500.a: "Vorwärts!"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_guelph_ghibelline.1000.desc: "Mir kam zu Ohren, dass Ihr unermüdlich für die Machtposition der [ROOT.Char.Custom('GetGuelphsGhibellines')] geworben und sie in diesem anstrengenden Zwist gestärkt habt.\n\nVon daher habt Ihr meine unerschütterliche Dankbarkeit."
 gdp_guelph_ghibelline.1000.a: "Besten Dank."
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 gdp_guelph_ghibelline.5000.desc: "Ich werde Euren schäbigen [actor.Custom('GetGuelphsGhibellines')] sobald nicht beitreten."
 gdp_guelph_ghibelline.5000.a: "Äußerst unklug."
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U] wird die Forderung, dass [recipient.GetShortUIName] den [actor.Custom('GetGuelphsGhibellines')] beitritt, mehrere Jahre nicht wiederholen können."
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ Das Wormser Konkordat"
 gdp_guelph_ghibelline.6500.desc: "Diese Streit dauert schon viel zu lang. Nach gründlichem Überdenken präsentieren mir meine Schreiber eine schriftliche Übereinkunft:\n\nDer Einfluss [ghibelline_leader.GetTitleAsNamePossessive] wird bei kirchlichen Ernennungen beschänkt, doch die neue Regelung gibt [ghibelline_leader.Custom('DE_PRO_PER_S_3P_D')] das Recht zurück, die Wahlen zu beobachten und bei strittigen Ergebnissen zu entscheiden.\n\nIch kratze mich am Kinn, während ich darüber sinniere, wie sich dies auf uns alle auswirken wird."
 gdp_guelph_ghibelline.6500.a: "Das ist der Weg vorwärts."
 gdp_guelph_ghibelline.6500.b: "Die Macht des Pontifikats ist #EMP absolut#!!"
 concordat_of_worms_fulfilled.t: "Wormser Konkordat erfüllt"
 concordat_of_worms_abandoned.t: "Wormser Konkordat aufgegeben"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName|U] entscheidet, ob die Vereinbarung angenommen wird."
 cow_phase_moves_to_agitation.tt: "Die [GetSituation('guelph_ghibelline').GetName] verlassen die Vorspielphase und gehen über zur [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]"
 cow_phase_moves_to_repose.tt: "Die [GetSituation('guelph_ghibelline').GetName] verlassen die erste Phase und gehen über zur [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.6505.desc: "Lasst uns unsere Streitigkeiten für einen Augenblick beilegen und uns auf den richtigen Umgang mit Euren kirchlichen Ernennungen verständigen.\n\nIm Gegenzug darf [Select_CString(ROOT.Char.IsFemale, 'die', 'der')] [ROOT.Char.GetTitleAsNameNoTooltip] den Wahlen beiwohnen und strittige Ergebnisse entscheiden."
 gdp_guelph_ghibelline.6505.a: "Ich denke, das sollte ausreichen …"
 gdp_guelph_ghibelline.6505.b: "Das ist nicht hinnehmbar!"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ Der $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "Während Gerüchte aufkommen, [Select_CString(hre_kaiser.IsFemale, 'die', 'der')] [hre_kaiser.GetTitleAsName] habe Norditalien ins Visier genommen, um [hre_kaiser.Custom('DE_PRO_POS_S_3P')]e Macht in der Region zu zentralisieren unn zu stärken, sind meine Boten zu mir zurückgekehrt:"
 gdp_guelph_ghibelline.7000.desc.all: "\n\nAlle Befragten traten auf mein Geheiß dem Lombardenbund bei.\n\nNun sind wir stark genug, um jedem plötzlichen Manöver zu widerstehen, das [Select_CString(hre_kaiser.IsFemale, 'die', 'der')] [hre_kaiser.GetTitleAsName] womöglich versucht …!"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nMehr als die Hälfte der Befragten trat auf mein Geheiß dem Lombardenbund bei.\n\nDas sollte uns die Möglichkeit geben, [Select_CString(hre_kaiser.IsFemale, 'der', 'dem')] [hre_kaiser.GetTitleAsName] zu widerstehen, und hoffentlich können wir zusätzliche Hilfe von unseren heiligen Freunden erhalten …"
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nNur wenige der Befragten traten dem Lombardenbund bei, was mich zweifelsohne besorgt.\n\n#EMP Doch das spielt keine Rolle!#! Mit etwas heiliger Hilfe sollten wir in der Lage sein, unsere neu gewonnene Unabhängigkeit zu verteidigen."
 gdp_guelph_ghibelline.7000.a: "Es ist an der Zeit für einen Wandel!"
 gdp_guelph_ghibelline.7000.b: "Unsere Zeit ist gekommen!"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ Beitritt zum $lombard_league_name$?"
 gdp_guelph_ghibelline.7005.desc: "Es scheint, als sei [Select_CString(league_creator.IsFemale, 'die', 'der')] [league_creator.GetTitledFirstName] am Ende doch [Select_CString(league_creator.IsFemale, 'eine ehrenwerte Frau', 'ein ehrenwerter Mann')].\n\nEs erreichen mich Neuigkeiten, dass [league_creator.Custom('DE_PRO_PER_S_3P_N')] den [lombard_league_conf.GetName] gründete, eine Initiative, um jene Vorstöße abzuwehren, die [Select_CString(hre_kaiser.IsFemale, 'die', 'der')] [hre_kaiser.GetTitleAsName] unternimmt.\n\nDas hört sich nach einer sinnvollen Maßnahme an, wenn man versucht ist, den Fesseln des Kaiserreichs zu entkommen …"
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "Lasst uns nicht so voreilig sein …"
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ Der $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "Meine Boten setzen mich darüber in Kenntnis, dass das streitsüchtige Schwein #EMP [league_creator.GetTitledFirstName]#! nicht zufrieden damit ist, wie die Dinge in [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier] laufen und dass diese Verräterseele andere schwachsinnige Schafe davon überzeugte, sich [league_creator.Custom('DE_PRO_PER_S_3P_D')] anzuschließen!\n\nWas soll überhaupt der #EMP Lombardenbund#!sein?!"
 gdp_guelph_ghibelline.7010.a: "Diese Unverschämtheit darf nicht ungestraft bleiben!"
 gdp_guelph_ghibelline.7010.b: "Ich habe mich anderen Zielen zugewandt."
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName] gründete: [league_creator.GetConfederation.GetName|U] #weak (Derzeit #V [lombard_league_conf.GetMemberCount]#! Mitglieder)#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 gdp_guelph_ghibelline.7015.desc: "Ich fürchte, der Lombardenbund muss ohne Eure #EMP großzügigen#! Beiträge auskommen."
 gdp_guelph_ghibelline.7015.a: "Hmm."
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ Kompromiss erzielt"
 gdp_guelph_ghibelline.8500.desc: "Ein jähes Raunen geht durch die Menge, als zwei Vertreter der Guelfen und der Ghibellinen, [guelph_leader.GetName] und [ghibelline_leader.GetName], zusammentreten, um den Vertrag zu unterzeichnen.\n\nManche wirken geradezu fröhlich, andere deutlich aufgeregter bei der Vorstellung, einen Kompromiss zu schließen und Teile jener eigenen Ansichten aufzugeben, die sie doch eigentlich selbst so sehr schätzen.\n\nSpäter finden leise Gespräche statt, während sich die Menge auflöst und dazu übergeht, an den üblichen Vorbereitungen für das Abendessen teilzunehmen."
 gdp_guelph_ghibelline.8500.a: "Es ist endlich vorbei."
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "Ich sehe, dass Ihr den Fehler in Eurem Verhalten immer noch nicht erkannt habt. Warum sollten wir solche weitreichenden Zugeständnisse machen, wenn Ihr [actor.Custom('GetGuelphsGhibellines')] so offensichtlich falschliegt?\n\nEs würde mich belustigen, wenn es nicht so ungeheuerlich wäre."
 gdp_guelph_ghibelline.8510.a: "Diese Frechheit!"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U] lehnte Euren Vorschlag ab, die [situation|E] [GetSituation('guelph_ghibelline').GetName] zu beenden"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "Die Übereinkunft ist eine Demonstration der Diplomatie. So viel ist sicher.\n\n[guelph_leader.GetName|U] und [ghibelline_leader.GetName] schlossen beide einen Kompromiss, erzielten kleine Siege, aber verloren an Volksmeinung.\n\nEinen Vertrag zu schließen, der die Zeit überdauert, ist keine geringe Leistung, und wir sollten schauen, wie viele von uns die Vergangenheit hinter sich lassen und nach vorn in Richtung einer strahlenderen Zukunft blicken können."
 gdp_guelph_ghibelline.8520.a: "Ich denke, es ist das Beste."
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphsGhibellines')]-Sieg"
 gdp_guelph_ghibelline.9000.desc.guelph: "Es ist beschlossen. Wir verteidigten die Rechte dessen, was am Heiligsten ist: die absolute Autorität des Papstes, auch künftig unsere geistlichen Hirten zu schützen und zu wählen.\n\nUnd den Einfluss in Sachen [GetTitleByKey('e_hre').GetName] zu schmälern, dessen Ambitionen uns am Ende alle bedrohen.\n\nJene #EMP fehlgeleiteten#! Ghibellinen-Seelen ahnten kaum, was sie da erwischte."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "Endlich stellten wir unser Herrschaftsrecht unter Beweis, das Kaiserreich so zu regieren, wie es die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) immer beabsichtigt hatte: mit fester Hand und vernünftigem Geist.\n\nWie konnte überhaupt ein fehlgeleitetes heiliges Werkzeug tatsächlich entscheiden wollen, wer am besten geeignet wäre, um unser [GetTitleByKey('e_hre').GetName] und dessen Lande zu regieren?\n\nDiese papsttreuen Guelfden können sich gern um unsere Seelen kümmern, und wir kümmern uns um das, was #EMP wirklich#! wichtig ist."
 gdp_guelph_ghibelline.9000.a: "Ich denke, es ist Zeit zum Feiern."
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphsGhibellines')]-Niederlage"
 gdp_guelph_ghibelline.9010.desc.win: "Immer wieder gewinnen wir angesichts einer schwachen [ROOT.Char.Custom('GuelphGhibellineGetOpposite')]-Opposition die Unterstützung der Bevölkerung.\n\n[victorious_leader.GetTitledFirstName|U], [Select_CString(victorious_leader.IsFemale, 'unsere angesehene Anführerin', 'unser angesehener Anführer')], wie auch unabhängige Rechtsverständige ließen verlautbaren, dass die [ROOT.Char.Custom('GetGuelphsGhibellines')] im Recht sind, und sie beendeten damit diese andauernde #EMP Angelegenheit#! ein für alle Mal.\n\nEndlich kehrt Vernunft auch in diesen Teil der Welt ein!"
 gdp_guelph_ghibelline.9010.desc.lose: "Unsere Unterstützung schwindet. Das ist zweifellos so.\n\nWeder die Macht noch der Einfluss der [ROOT.Char.Custom('GetGuelphsGhibellines')] reichen so weit, wie sie sollten und müssten, und diese schwachsinnigen [ROOT.Char.Custom('GuelphGhibellineGetOpposite')] haben übermächtige #EMP unabhängige#! Rechtsverständige aufgetrieben, die sie unterstützen.\n\nEs ist für die [ROOT.Char.Custom('GetGuelphsGhibellines')] an der Zeit, diesen Kampf aufzugeben und sich besser zu erreichenden Zielen zu widmen."
 gdp_guelph_ghibelline.9010.a.win: "Lasst uns diesen Augenblick genießen."
 gdp_guelph_ghibelline.9010.a.lose: "Diese #EMP Schlangen#!!"
