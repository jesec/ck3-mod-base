l_german:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName|U]: Drang nach Vorteilen"
 gdp_merchant_scheme_advantage.1000.intro: "Ich überlege, wie wir unsere Angelegenheiten hier in [task_contract_location.GetBaronyNameExplicitly] vorantreiben können, und komme dabei auf"
 gdp_merchant_scheme_advantage.1000.intro.rival: "[Select_CString(rival.IsFemale, 'unsere Rivalin', 'unseren Rivalen')] [rival.GetTitledFirstName] und wie uns [Select_CString(rival.IsFemale, 'ihre', 'seine')] Anwesenheit daran hindert."
 gdp_merchant_scheme_advantage.1000.intro.partner: "[Select_CString(portrait.IsFemale, 'meine Partnerin', 'meinen Partner')] [portrait.GetTitledFirstName], was die Suche nach Lösungen anbelangt."
 gdp_merchant_scheme_advantage.1000.intro.agent: "[Select_CString(portrait.IsFemale, 'meine Mitarbeiterin', 'meinen Mitarbeiter')] [associate.GetTitledFirstName], was die Suche nach Lösungen anbelangt."
 gdp_merchant_scheme_advantage.1000.intro.trader: "[Select_CString(portrait.IsFemale, 'meine Händlerin', 'meinen Händler')] [trader.GetTitledFirstName], was die Suche nach Lösungen anbelangt."
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nWenn [portrait.GetTitledFirstNameNoTooltip] doch nur endlich zu mehr Ernsthafttigkeit finden und der Angelegenheit [portrait.Custom('DE_PRO_POS_S_3P')]e volle Aufmerksamkeit schenken würde, könnten wir diese Sache gewiss umgehend hinter uns lassen …"
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nWenn die Gesellschaft doch nur zusammenstehen und sich ins Zeug legen würde, könnten wir diese Sache gewiss umgehend hinter uns lassen …"
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nVielleicht sollte ich zum Wohl der Gesellschaft die Ärmel hochkrempeln und versuchen, endlich einmal etwas zu schaffen, damit wir zu anderen Dingen übergehen können …"
 gdp_merchant_scheme_advantage.1000.a: "„Wofür bezahle ich Euch, [portrait.GetTitledFirstNameNoTooltip]?!“"
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.GetTitledFirstNameNoTooltip] ist belastet"
 gdp_merchant_scheme_advantage.1000.b: "„Die ganze Gesellschaft muss endlich in die Gänge kommen!“"
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] Die [company|E] ist belastet"
 gdp_merchant_scheme_advantage.1000.c: "„Genau, ich muss es einfach selbst machen!“"
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] Ihr seid belastet"
 gdp_merchant_scheme_advantage.1000.d.associate: "„Kommt schon! [portrait.GetFirstNameNoTooltip|U] kann sicherlich mehr leisten.“"
 gdp_merchant_scheme_advantage.1000.d.unity: "„Diese Gesellschaft steckt voller Faulenzer!“"
 gdp_merchant_scheme_advantage.1000.d.stress: "„Ich muss nur ein wenig zusätzliche Arbeit machen …“"
 gdp_merchant_scheme_advantage.1000.e: "„Oh, vergesst es …“"
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName|U] und ich sitzen jeden Tag beisammen und besprechen die besten Wege, uns unserem Ziel näher zu bringen. [Select_CString(trader.IsFemale, 'Mein Händlerin', 'Mein Händler')] verweist immer wieder auf unseren Mangel an verlässlichen Arbeitskräften in [task_contract_location.GetBaronyNameExplicitly].\n\n„Wisst Ihr“, seufzt [trader.GetFirstNameNoTooltip], „es gibt da jemanden, der uns helfen könnte.“"
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetFirstName|U] ist [recruit.Custom('DE_PRO_POS_S_3P')] Name. [recruit.Custom('DE_PRO_PER_S_3P_N')|U] dient [recruit_liege.GetTitledFirstName] ([recruit_liege.GetPrimaryTitle.GetName]) als [Select_CString(recruit.IsFemale, 'Lakaiin', 'Lakai')] …“"
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetFirstName|U] ist [recruit.Custom('DE_PRO_POS_S_3P')] Name, [Select_CString(recruit.IsFemale, 'eine einheimische Agentin und Schieberin', 'ein einheimischer Agent und Schieber')] auf dem Markt …“"
 gdp_merchant_scheme_advantage.1010.a: "„Lasst mich mit [recruit.Custom('DE_PRO_PER_S_3P_D')] sprechen …“"
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! Ihr verlasst Euch auf Euren Liebreiz"
 gdp_merchant_scheme_advantage.1010.b: "„Werbt [Select_CString(recruit.IsFemale, 'die Frau', 'den Mann')] an, was auch immer es kostet.“"
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! Ihr verlasst Euch auf Profit"
 gdp_merchant_scheme_advantage.1010.e: "„Pah! [recruit.Custom('DE_PRO_PER_S_3P_N')|U] ist den Aufwand nicht wert.“"
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName|U] und ich sitzen jeden Tag beisammen und besprechen die besten Wege, uns unserem Ziel näher zu bringen. Schließlich spricht [Select_CString(trader.IsFemale, 'Mein Händlerin', 'Mein Händler')] unsere Charta ([charter.GetName]) an und dass sie nützlich sein könnte, um jene Türen zu öffnen, die für uns in [task_contract_location.GetBaronyNameExplicitly] derzeit verschlossen sind.\n\n„Warum“, so fragt [trader.GetFirstNameNoTooltip] lächelnd, „sollten wir das Papier von [patron.GetTitledFirstName] denn nicht sinnvoll einsetzen?“"
 gdp_merchant_scheme_advantage.1020.a: "„Ja, ich bin mir sicher, wir haben den Rückhalt von [patron.GetTitleAsNameNoTooltip]!“"
 gdp_merchant_scheme_advantage.1020.b: "„Unsere Charta spricht in der Tat für sich selbst.“"
 gdp_merchant_scheme_advantage.1020.e: "„Jetzt ist nicht die richtige Zeit dafür …“"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "Drang nach Vorteilen (Potenzial)"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "Die Versuche, dieses Komplott zu beschleunigen, behinderten seinen Fortschritt nur."
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "Drang nach Vorteilen (Wachstum)"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "Drang nach Vorteilen (Phase)"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "Drang nach Vorteilen (Wettbewerbsfähigkeit)"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "Die Versuche, ein Komplott zu beschleunigen, behinderten die Handelsbemühungen."
 gdp_merchant_scheme_advantage_outcome: "Drang nach Vorteilen"
 gdp_merchant_scheme_advantage.desc: "drängte auf [opportunities|E] bei einem [Concept('opportunity','Gelegenheiten')|E] [scheme|E]"
