l_german:
 yearly_republic.1001.t: "Kommt ins Bett, Liebling"
 yearly_republic.1001.desc: "Kurz vor Mitternacht findet mich mein[spouse_target.Custom('DE_END_PRO_S_N')] [spouse_target.GetWifeHusband] [spouse_target.GetTitledFirstName] über Schriftstücken brütend, da ich die Hauptbücher erneut überprüfe.\n\n„Kommt ins Bett, [ROOT.Char.GetWifeHusband]“, bittet [spouse_target.Custom('DE_PRO_PER_S_3P_N')]. „Die Arbeit kann sicherlich noch bis morgen warten?\n\nOder“, meint [spouse_target.GetFirstNameNoTooltip] und blickt nachdenklich drein, „vielleicht könntet Ihr Eure Arbeit teilen?“"
 yearly_republic.1001.a: "Dann lasst uns besser noch mehr Kerzen holen, mein Liebling."
 yearly_republic.1001.b: "Ich habe noch zu viel zu tun. Lasst mich in Ruhe!"
 yearly_republic.1001.c: "Die Welt kann warten, solange ich Euch habe."
 yearly_republic.1001.communal: "Alle [vassals|E] erhalten #P 10#! Meinung über #value Euch#!"
 yearly_republic.1002.t: "Dornige Ehe"
 yearly_republic.1002.desc: "Meine Ehe mit [spouse_target.GetTitledFirstName] erlebte schon viel Zwietracht. Wir scheinen uns auf nichts einigen zu können. Zweifelsohne setzt [spouse_target.Custom('DE_PRO_PER_S_3P_N')] [spouse_target.Custom('DE_PRO_POS_S_3P')]e Verwandtschaft regelmäßig in Briefen über meine „Unzulänglichkeiten“ in Kenntnis.\n\nIch hatte die Hoffnung, meine Ehe würde meine Geschäftsinteressen enger an Haus [spouse_target.GetDynastyHouseName] binden, doch jedes Mal, wenn ich seine Agenten oder Kunden in der Stadt antreffe, sehe ich das Misstrauen in ihrem Blick.\n\nWenn nicht irgendetwas geschieht, wird sich diese bösartige Meinung innerhalb unserer beider Familien verbreiten wie Blut aus einer brandigen Wunde."
 yearly_republic.1002.a: "Ich werde die Dankbarkeit von [spouse_target.GetFirstNameNoTooltip] und [spouse_target.Custom('DE_PRO_POS_S_3P')]em Haus kaufen."
 yearly_republic.1002.b: "Ich werde [spouse_target.Custom('DE_PRO_POS_S_3P')]e Briefe fälschen und in höchsten Tönen von mir schwärmen."
 yearly_republic.1002.c: "Ich werde im Namen der höchsten Macht ([ROOT.Char.GetFaith.random_GoodGodNames]) schwören, mich in Euren Augen zu verbessern."
 yearly_republic.1002.d: "Sie sollen denken, was sie wollen."
 yearly_republic.1002.tt.falsifying_success.desc: "Bearbeitet die Briefe Eures Ehepartners, um Euch besser darzustellen"
 yearly_republic.1002.falsifying_success.toast: "Haus [spouse_target.GetDynastyHouseName] ist überzeugt, dass Ihr Euch verbessert habt"
 yearly_republic.1002.tt.falsifying_failure.desc: "Ihr scheitert bei dem Versuch, die Briefe Eures Ehepartners zu fälschen"
 yearly_republic.1002.falsifying_failure.toast: "Die Meinung von [spouse_target.GetDynastyHouseName] über Euch verschlechtert sich noch weiter"
 yearly_republic.1002.tt.impress_spouse_success.desc: "Euer Ehepartner ist von Euren Bemühungen beeindruckt"
 yearly_republic.1002.impress_spouse_success.toast: "Haus [spouse_target.GetDynastyHouseName] befürwortet Eure Bemühungen"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "Euer Ehepartner ist von Euren Bemühungen unbeeindruckt"
 yearly_republic.1002.impress_spouse_failure.toast: "Haus [spouse_target.GetDynastyHouseName] sieht Euch als einen hoffnungslosen Fall"
 yearly_republic.1003.t: "Hintergassenehre"
 yearly_republic.1003.desc: "„[Select_CString(rook_01.IsFemale, 'Ihr Närrin', 'Ihr Narr')]! Sich in den Straßen zu prügeln, kann zu einer Fehde zwischen den Häusern führen! Schaut Euch doch an: Ihr blutet!“, ruft mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [spouse_target.GetWifeHusband] [spouse_target.GetTitledFirstName] aus – doch mein[rook_01.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', rook_01)] [rook_01.GetTitledFirstName] lacht nur, als [rook_01.Custom('DE_PRO_POS_S_3P')] Blut auf meinen Boden tropft.\n\n„Meinem Gegner geht es deutlich schlechter als mir! Das dumme Schwein humpelt beschämt nach Hause.“\n\nVerdammt seien diese Jugendbanden! Sie ziehen mit Waffen und Prahlereien durch die Straßen, geraten in Kämpfe und machen alle möglichen üblen Dinge, um sich zu amüsieren.\n\n„Es war nur eine kleine Rangelei. Macht Euch keine Sorgen, [rook_01.Custom2('RelationToMeShort', spouse_target)] – ich habe nur unseren Familiennamen gegen Verleumdungen verteidigt.“"
 yearly_republic.1003.a: "Ah, die Torheiten der Jugend."
 yearly_republic.1003.b: "Ganz offenkundig war [rook_02.GetNameNoTooltip] im Unrecht. Wir verlangen Wiedergutmachung!"
 yearly_republic.1003.c: "Wir sollten Haus [rook_02.GetDynastyHouseNameNoTooltip] ein Geschenk schicken, um die Dinge zu beruhigen."
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "Eure Anschuldigungen gegen mein Haus entbehren jeder Grundlage. Sie sind eitel und völlig ehrlos.\n\nIhr werdet nichts von uns bekommen – außer den höflichen Besuch unserer Klingen an Eurer Kehle, solltet Ihr die Angelegenheit bedauerlicherweise weiter verfolgen."
 yearly_republic.1004.b.desc: "Als Oberhaupt von Haus [other_house_character_01.GetDynastyHouseName] bedauere ich zutiefst diese Unannehmlichkeiten zwischen unseren Familien. Ich entschuldige mich für den Zwischenfall und bitte Euch, dass Ihr dieses Geschenk als einen Ausdruck meines Bedauerns annehmt."
 yearly_republic.1004.a: "Sie werden diese Zurschaustellung von Respektlosigkeit noch bereuen!"
 yearly_republic.1004.b: "Na schön. Wir werden unsere Entschädigung zu gegebener Zeit erhalten."
 yearly_republic.1004.c: "Wir akzeptieren unsere Schuld."
 yearly_republic.1004.d: "Lasst dies das Ende der Zwietracht zwischen uns sein."
 yearly_republic.1005.t: "Veto der Massen"
 yearly_republic.1005.desc: "Die Zwietracht zwischen meinem Haus und Haus [other_house_character_01.GetDynastyHouseName] ist einmal mehr auf die Straßen von [capital_01.GetName] übergeschwappt: Unsere Fuhrknechte raufen sich um das Wegerecht, bis die Straße selbst blockiert ist. Nur ein weiterer kleinlicher Groll, so dachte ich, bis sich der Pöbel vor meiner Tür versammelte.\n\n„Es reicht!“, schreit ein Mann. „Wir können unseren Geschäften nicht nachgehen, wenn sich [ROOT.Char.GetDynastyHouseName] und [other_house_character_01.GetDynastyHouseNameNoTooltip] streiten. Hört auf, die Stadt in Euer Elend hineinzuziehen!“\n\nMein[house_member_01.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] [house_member_01.GetTitledFirstName] ist über diese Dreistigkeit erzürnt. „Wer sind sie denn, dass sie über unser Verhalten bestimmen wollen?“"
 yearly_republic.1005.a: "Nein, [ROOT.Char.Custom2('RelationToMeShort', house_member_01)]. Es ist an der Zeit, sich mit Haus [other_house_character_01.GetDynastyHouseNameNoTooltip] zusammenzusetzen."
 yearly_republic.1005.b: "Meine rhetorischen Fähikeiten werden Haus [other_house_character_01.GetDynastyHouseNameNoTooltip] die Schuld zuschieben."
 yearly_republic.1005.c: "Wachen! Vertreibt das Gesindel von meiner Tür."
 yearly_republic.1005.tt.oratory_blame.desc: "Blendet die Menge mit Euren rhetorischen Fähigkeiten"
 yearly_republic.1005.tt.oratory_blame.toast: "Ihr wälztet die Scherereien auf Haus [other_house_character_01.GetDynastyHouseName] ab"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Von der schreienden Menge übertönt"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "Ihr scheitert daran, die Schuld auf Haus [other_house_character_01.GetDynastyHouseName] abzuwälzen"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "Ich habt recht. Es ist an der Zeit, dass wir uns zusammensetzen und ruhigere Gemüter übernehmen – denjenigen zuliebe, die noch nicht geboren sind und für das beständig Gute der Republik. Wir werden uns mit Euch treffen."
 yearly_republic.1006.b.desc: "Leider sehen wir keinen Grund, warum wir Euch die Gelegenheit geben sollten, uns ins Gesicht zu lügen. Zweifelsohne sucht Ihr eine günstige Möglichkeit, uns zu schaden. Es wird keine Verhandlungen geben."
 yearly_republic.1006.a: "Ausgezeichnet!"
 yearly_republic.1006.b: "Verdammt noch eins!"
 yearly_republic.1007.t: "Entspannung zwischen [ROOT.Char.GetDynastyHouseNameNoTooltip] und [other_house_character_01.GetDynastyHouseNameNoTooltip]"
 yearly_republic.1007.desc: "Die Spannung, die in der Luft liegt, ist förmlich greifbar, als ich mich mit [other_house_character_01.GetTitledFirstName] auf neutralem Boden treffe. Unsere Kunden drängen sich im Raum, auf beide Seiten aufgeteilt – wie zwei Armeen, die sich über das Schlachtfeld hinweg beäugen. Unter ihren Umhägen sind ohne jeden Zweifel Dolche verborgen.\n\n„So“, meint [other_house_character_01.GetFirstNameNoTooltip] mit reservierter Stimme. „Sagt, was Ihr sagen wollt.“\n\nAlle im Raum blicken mich an, als ich mich sammle und beginne."
 yearly_republic.1007.a: "Diese Fehde ist schlecht für das Geschäft."
 yearly_republic.1007.b: "Wir sollten Frieden schließen. Als [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]."
 yearly_republic.1007.c: "Blut wurde vergossen; lasst Blut uns aneinander binden."
 yearly_republic.1007.d: "Lasst es uns mit Stahl beilegen – hier und jetzt!"
 yearly_republic.1007.tt.detente_business.desc: "Ihr überzeugt [other_house_character_01.GetShortUINameNoTooltip] mit Eurem Argument"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip|U] ist überzeugt"
 yearly_republic.1007.tt.detente_business_failure.desc: "Ihr scheitert daran, [other_house_character_01.GetShortUINameNoTooltip] von Eurem Argument zu überzeugen"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip|U] ist nicht gänzlich überzeugt"
 yearly_republic.1007.detente_business.change.desc: "Beide Häuser stimmten zu, zum Wohl des Geschäfts ihre Streitigkeiten beizulegen."
 yearly_republic.1007.piety.change.desc: "Beide Häuser stimmten zu, aus Liebe zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) ihre Streitigkeiten beizulegen."
 yearly_republic.1007.detente_marriage.change.desc: "Beide Häuser stimmten zu, mittels einer Ehe ihre Streitigkeiten beizulegen."
 yearly_republic.1007.duel_win.desc: "Ihr gewinnt das Duell"
 yearly_republic.1007.duel_win.toast: "Ihr stecht [other_house_character_01.GetShortUINameNoTooltip] nieder"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip|U] gewinnt das Duell"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip|U] sticht Euch nieder"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip|U] wird verwundet oder getötet"
 yearly_republic.1007.duel_loss.custom: "Ihr werdet verwundet oder getötet"
 yearly_republic.1007.c.tt.suitable_pair: "Beide Häuser haben unverheiratete Mitglieder, die einander heiraten können"
 house_relation_reason_falsify_good_desc: "Briefe erhalten, in denen über den guten Charakter des Hausanführers geschrieben wird"
 house_relation_reason_falsify_bad_desc: "Herausgefunden, dass der Hausanführer Briefe fälschte"
 house_relation_reason_thorny_desc: "Eine unglückliche Ehe sät Zwietracht"
 house_relation_reason_bribery_good_desc: "Ehepartner mit Gold und Juwelen überschüttet"
 house_relation_reason_street_combat_desc: "Straßenkampf zwischen der Jugend beider Häuser"
 house_relation_reason_business_argument_desc: "Besprachen den Nutzen des Geschäfts"
 house_relation_reason_house_blamed_desc: "Für gesellschaftlichen Aufruhr verantwortlich gemacht"
 house_relation_reason_houses_aligned_desc: "Machten auf einer Versammlung gleichgesinnter Häuser gemeinsame Sache"
 house_relation_reason_cooperation_desc: "Vertiefte Zusammenarbeit zwischen den Häusern."
 demand_reparation_for_fight_desc: "Schickt einen Brief, in dem Ihr Wiedergutmachung fordert"
 pay_reparation_for_fight_desc: "Schickt einen Brief mit einem Geschenk und einer Entschuldigung"
 offer_a_sitdown_desc: "Schickt einen Brief, um eine Entspannung anzubieten"
 yearly_republic.1008.t: "Wölfe im Kaufmannsgewand"
 yearly_republic.1008.desc: "Spannende Neuigkeiten erreichten mich:\nEiner der Kaufmannskapitäne in der Gesandtschaft von [other_patrician_01.GetTitledFirstName] betätigt sich nebenbei als [Select_CString(bandit_01.IsFemale, 'wahllose Banditin', 'wahlloser Bandit')], während [Select_CString(bandit_01.IsFemale, 'sie', 'er')] Handelsverträge rund um das Mittelmeer erfüllt und die erbeutete Fracht anschließend zum eigenen Gewinn verkauft – ein wahrer Wolf im Schafspelz!\n\nObgleich es unmöglich herauszufinden ist, ob [other_patrician_01.GetFirstNameNoTooltip] von diesem Komplott weiß, würde es den Versammlungsmitgliedern, deren Schiffe und Fracht geplündert wurden, wenig bedeuten."
 yearly_republic.1008.a: "Heuert [Select_CString(bandit_01.IsFemale, 'die Kapitänin', 'den Kapitän')] unverzüglich an, um für Euch zu arbeiten."
 yearly_republic.1008.b: "Bedroht den [Select_CString(bandit_01.IsFemale, 'die Kapitänin', 'den Kapitän')], bis [bandit_01.Custom('DE_PRO_PER_S_3P_N')] [bandit_01.Custom('DE_PRO_POS_S_3P')]e Beute teilt."
 yearly_republic.1008.c: "Bedroht [other_patrician_01.GetFirstNameNoTooltip], um ein Druckmittel zu erhalten."
 yearly_republic.1009.t: "Salon der Geheimnisse"
 yearly_republic.1009.desc: "Ich verbringe den Nachmittag in einem gemütlichen Salon, der [patrician_spouse_01.GetTitledFirstName] gehört.\n\nWährend mein[relation_01.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName] und ich uns unterhalten und einen edlen Tropfen ([patrician_spouse_01.Custom('GetExpensiveDrink')]) genießen, bemerke ich einen kleinen Schatten, der sich an der Wand in der Nähe eines großen Paravents entlangbewegt. Nachdem ich ihn eine Weile beobachtet habe, komme ich zu dem Schluss, dass es der Schatten eines Armes ist, der kurze, präzise Bewegungen ausführt: [relation_01.GetFirstNameNoTooltip] verstummt und die Bewegung endet – irgendjemand schreibt von hinter dem Paravent jedes Wort mit, das im Salon fällt!\n\nEs scheint, als spionierten unsere Gastgeber, [patrician_spouse_01.GetFirstNameNoTooltip] und [patrician_spouse_01.Custom('DE_PRO_POS_S_3P')][patrician_husband_01.Custom('DE_END_PRO_S_N')] [patrician_husband_01.GetWifeHusband] [patrician_husband_01.GetTitledFirstName], die Gespräche ihrer Gäste aus."
 yearly_republic.1009.a: "Ich muss alle vor diesem ruchlosen Komplott warnen!"
 yearly_republic.1009.a.tt: "Erhaltet #P 20#! Meinung über #value Euch#! und #N -25#! Meinung über [patrician_spouse_01.GetShortUINameNoTooltip] und [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.b: "Was für ein großartiger Einfall! Ich sollte das selbst machen."
 yearly_republic.1009.c: "Erpresst [patrician_spouse_01.GetFirstNameNoTooltip] und [patrician_spouse_01.Custom('DE_PRO_POS_S_3P')][patrician_husband_01.Custom('DE_END_PRO_S_A')] [patrician_husband_01.GetWifeHusband], damit Ihr das Geheimnis wahrt."
 yearly_republic.1009.c.success.desc: "Überlistet [patrician_spouse_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.success.toast: "Ihr erhaltet ein starkes Druckmittel gegen [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip|U] überlistet Euch"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip|U] rückt näher daran, Euer Rivale zu werden"
 yearly_republic.1009.flavor: "Wer weiß, was Ihr belauschen könntet?"
 yearly_republic.1009.b.secret_learned: "Eure Spionagebemühungen deckten ein Geheimnis auf"
 yearly_republic.1010.t: "Patrizier unter dem Dach"
 yearly_republic.1010.desc: "Mein[relation_01.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName] entdeckt mich, als ich einen gemütlichen Spaziergang unternehme, und beugt sich zu mir, um mir zuzuflüstern:\n\n„[Select_CString(ambassador.IsFemale, 'Botschafterin', 'Botschafter')] [ambassador_01.GetFirstName] kam aus [ambassador_mission_location_01.GetName] zurück und berichtet heute Abend im Palast vor einem ausgewählten Rat.“\n\n[relation_01.Custom('DE_PRO_PER_S_3P_N')|U] schüttelt den Kopf. „Oh, stellt Euch nur vor, welchen Geschäftsvorteil es hätte, könnten wir diesen Bericht hören, noch bevor er der ganzen Versammlung präsentiert wird!“\n\nWährend [relation_01.GetFirstNameNoTooltip] dies sagt, kann man das Dach des Palasts in der Ferne erblicken."
 yearly_republic.1010.a: "Wir werden Schindeln vom Dach entfernen und lauschen."
 yearly_republic.1010.b: "Vielleicht lässt sich [ambassador_01.GetFirstNameNoTooltip] überzeugen?"
 yearly_republic.1010.c: "Wir werden es zu gegebener Zeit wissen."
 yearly_republic.1010.a.success.desc: "Ihr belauscht den Bericht"
 yearly_republic.1010.a.success.toast: "Ihr belauscht den Bericht"
 yearly_republic.1010.a.mixed.desc: "Ihr fallt vom Dach"
 yearly_republic.1010.a.mixed.toast: "Ihr fallt vom Dach"
 yearly_republic.1010.a.failure.desc: "Ihr fallt in den Raum"
 yearly_republic.1010.a.failure.toast: "Ihr fallt in den Raum"
 yearly_republic.1010.a.mixed.custom: "Ihr und [relation_01.GetShortUIName|U] erhaltet die [trait|E]: [GetTrait('wounded_1').GetName(GetNullCharacter)|LVU]"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUIName|U] verliert #N 25#! [opinion|E] über Euch und [relation_01.GetShortUIName] #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW Verbrechen – Erlaubt es [republic_ruler.GetShortUIName], Euch beide rechtmäßig einzukerkern#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip|U] ist Bestechung nicht abgeneigt"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip|U] ist beleidigt, dass Ihr fragtet"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip|U] gibt Euch den Bericht"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip|U] weigert sich, bestochen zu werden"
 yearly_republic.1011.t: "Zum Rat gerufen"
 yearly_republic.1011.desc: "Wieder einmal bin ich gerufen worden, an einem der vielen geheimen Räte teilzunehmen, die die Republik am Laufen halten.\n\nDiese Verpflichtungen rauben mir Zeit, die mir sonst für Familie und Geschäft bliebe. Allerdings kann man als Patrizier einen solchen Ruf nicht ohne triftigen Grund verweigern, es sei denn, man hat eine entsprechende Genehmigung von der Versammlung."
 yearly_republic.1011.a: "Ich werde meinen Arzt bitten, mir zu bestätigen, dass ich bettlägerig bin."
 yearly_republic.1011.b: "Da mein[sick_person_01.Custom('DE_END_PRO_S_N')] teur[sick_person_01.Custom('DE_END_ADJ_IND_S_N')] [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)] krank ist, habe ich einen guten Grund, zu Hause zu bleiben."
 yearly_republic.1011.c: "Ich werde die Versammlung um eine Ausnahmegenehmigung für 5 Jahre bitten."
 yearly_republic.1011.d: "Es ist meine Pflicht, zum Rat zu gehen."
 yearly_republic.1011.c.success.desc: "Die Versammlung gewährt die Erlaubnis"
 yearly_republic.1011.c.success.toast: "Die Versammlung gewährte Euch Eure Erlaubnis"
 yearly_republic.1011.c.failure.desc: "Die Versammlung verweigert die Erlaubnis"
 yearly_republic.1011.c.failure.toast: "Die Versammlung verweigerte Euch Eure Erlaubnis"
 yearly_republic.1012.t: "Prozession [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 yearly_republic.1012.desc: "Die Vorfreude der Menge ist spürbar, als sich die Prozession [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] durch die Palasttore bewegt und den Marsch durch die Stadt beginnt.\n\nErst kommen die Beamten in der Reihenfolge ihrer Bedeutung und ihres Prestiges, danach komme ich: als [ROOT.Char.GetTitleAsNameNoTooltip] in den edelsten Staatsroben gewandet. Die Symbole meiner Autorität werden hoch emporgehalten, damit die Leute staunen können.\nHinter mir gehen die Patrizier, in der Reihenfolge des Ansehens ihrer Häuser.\n\nJeder ist an seinem Platz, und die Hierarchie und der Ruhm unserer Republik werden durch diese ehrwürdige Zeremonie für jedermann sichtbar!"
 yearly_republic.1012.a: "Für die Republik! Für das Volk!"
 yearly_republic.1012.b: "Ruhm sei der Versammlung!"
 yearly_republic.1012.c: "All dies spiegelt MEINEN Ruhm wider!"
 yearly_republic.1012.c.tt: "Für die nächsten #V 10#! Jahre kostet das Verabschieden des [Concept('succession_law', 'Nachfolgerechts')|E] $republican_despot_succession_law$ #P 50 %#! weniger [prestige|E]"
 yearly_republic.1013.t: "Vermählung mit dem Meer"
 yearly_republic.1013.desc: "Der [Glossary('#bold Bucentaur#!', 'BUCENTAUR_GLOSS')] passierte die letzten vorgelagerten Inseln, und nun liegt die salzige Weite der Adria vor mir. [bishop_01.GetTitledFirstName|U] reicht mir den zeremoniellen Ring und tritt zurück.\nIch halte ihn in die Höhe, damit ihn die versammelten Würdenträger sehen können, und im Einklang mit den Riten werfe ich ihn in die grünen Wogen.\n\n„[Glossary('#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS')]“, erkläre ich, und als die Menge an Bord meinen Worten jubelnd zustimmt, ist die Vermählung unserer Republik mit dem Meer – die Quelle unseres Wohlstands und unserer Macht – vollzogen."
 yearly_republic.1013.a: "Wir herrschen über die Wellen!"
 yearly_republic.1013.b: "Ein törichtes und hohles Ritual."
 yearly_republic.1013.c: "Ich bin schon da, mein Herz!"
 yearly_republic.1013.d: "Der See werde ich treu bleiben!"
 yearly_republic.1014.t: "Die Häuser angleichen"
 yearly_republic.1014.desc: "Auf Einladung von [faction_head_01.GetTitledFirstName] haben sich die Hausoberhäupter versammelt, die demselben Streben ([faction_head_01.GetHouse.GetHouseAspiration.GetName]) anhängen.\n\n„Meine Freunde! In Zeiten wie diesen müssen wir zusammenkommen und unsere Interessen angleichen. Damit die anderen Zusammenschlüsse unserer geliebten Republik keine Gelegenheit finden, uns zu teilen und zu zermalmen.“\n\nWir debattieren bis spät in die Nacht, und obwohl uns vieles trennt, bietet sich die Gelegenheit, dass eine starke Stimme die Risse heilt und eine geschlossene Front erschafft."
 yearly_republic.1014.a: "„Wir sollten uns alle den Guelfen anschließen.“"
 yearly_republic.1014.b: "„Wir sollten uns alle den Ghibellinen anschließen.“"
 yearly_republic.1014.c: "„Lasst uns die Bande zwischen unseren Häusern stärken.“"
 yearly_republic.1014.d: "„Alle Rivalitäten zwischen uns müssen enden.“"
 yearly_republic.1014.e: "„Wir sollten unsere Geschäftsinteressen bündeln.“"
 yearly_republic.1014.e.tt: "Alle [patricians|E] mit der [house_ambition|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] erhalten für 2 Jahre: [GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip]"
 yearly_republic.1014.a.tt: "Alle [patricians|E] mit der [house_ambition|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] werden Mitglieder der [situation_participant_group|E]: [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('guelph_member').GetName]"
 yearly_republic.1014.b.tt: "Alle [patricians|E] mit der [house_ambition|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] werden Mitglieder der [situation_participant_group|E]: [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('ghibelline_member').GetName]"
 yearly_republic.1014.c.tt: "Alle [patricians|E] mit der [house_ambition|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] verbessern ihre [house_relations|E] zueinander"
 yearly_republic.1014.d.tt: "Rivalitäten und Feindseligkeiten zwischen den [Concept('patricians', 'Patriziern')|E] mit der [house_ambition|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] werden beendet"
 yearly_republic.1014.tt.align_guelphs_success.desc: "Die Versammlung ist überzeugt und die Häuser verpflichten sich den Guelfen"
 yearly_republic.1014.align_guelphs_success.toast: "Die Häuser werden Guelfen"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "Die Debatte wird zunehmend hitzig und die Häuser behalten ihren eigenen Rat"
 yearly_republic.1014.align_guelphs_failure.toast: "Die Häuser bleiben gespalten"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "Die Versammlung ist überzeugt und die Häuser verpflichten sich den Ghibellinen"
 yearly_republic.1014.align_ghibellines_success.toast: "Die Häuser werden Ghibellinen"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "Die Debatte wird zunehmend hitzig und die Häuser behalten ihren eigenen Rat"
 yearly_republic.1014.align_ghibellines_failure.toast: "Die Häuser bleiben gespalten"
 yearly_republic.1014.d.toast: "Alter Groll wird beiseitegelegt"
 yearly_republic.1014.e.toast: "Die Häuser legen ihre Interessen zusammen"
 yearly_republic.1015.t: "Gold gegen Stimmen"
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName|U] findet mich, als ich über den Markt flaniere. [patrician.Custom('DE_PRO_PER_S_3P_N')|U] nähert sich mit einem entspannten Lächeln und einer sorgsam gesenkten Stimme.\n\n„Ah, es ist angenehm, eine Pause von der trostlosen Angelegenheit der Wahlen in der Versammlung zu haben. Ich bin oft erstaunt darüber, wie gewählt wird. Ein kluger Verstand wie der Eure ist wie ein strahlender Leuchtturm in der nebligen See, der einem Wicht wie mir den Weg in solch politisch heiklen Angelegenheiten weist.“ [patrician.Custom('DE_PRO_PER_S_3P_N')|U] seufzt dramatisch.\n\n„Doch tatsächlich bin ich gerade etwas blank. Wie soll ein armer Bootsmann das nächste Mal seinen Bug ausrichten, wenn die Versammlung zur Abstimmung bittet?“"
 yearly_republic.1015.a: "Nennt einfach Euren Preis."
 yearly_republic.1015.c: "Meine Vorschläge gründen auf ihrem eigenen Verdienst."
 yearly_republic.1016.t: "Die Stimme aus ihnen herausprügeln"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U] ist ein unverschämter Wurm, doch [patrician.Custom('DE_PRO_PER_S_3P_N')] besitzt gleichwohl ein Stimmrecht in der Versammlung. Und was jenes Stimmrecht angelangt, könnte [patrician.Custom('DE_PRO_PER_S_3P_N')] „überzeugt“ werden, es mir zur Verfügung zu stellen.\n\nIch muss nur etwas Druck auf [patrician.Custom('DE_PRO_PER_S_3P_A')] ausüben, damit [patrician.Custom('DE_PRO_PER_S_3P_N')] die Konsequenzen versteht, die folgen, wenn man einen Menschen wie mich enttäuscht."
 yearly_republic.1016.a: "Sabotiert [patrician.Custom('DE_PRO_POS_S_3P')]e Geschäftsinteressen."
 yearly_republic.1016.b: "Lasst Schläger [patrician.Custom('DE_PRO_POS_S_3P')]en Höfling überfallen und verprügeln."
 yearly_republic.1016.c: "Steckt [patrician.Custom('DE_PRO_POS_S_3P')] Haus in Brand."
 yearly_republic.1016.d: "Ich werde [patrician.Custom('DE_PRO_PER_S_3P_A')] das Fürchten lehren!"
 yearly_republic.1016.e: "Lasst [patrician.Custom('DE_PRO_PER_S_3P_A')] nach [patrician.Custom('DE_PRO_POS_S_3P')]em Gewissen abstimmen."
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip|U] verspricht, so abzustimmen, wie Ihr es tut"
 yearly_republic.1016.d.tt: "An [house_member.GetNameNoTooltip] wird ein Exempel statuiert."
 yearly_republic.1017.t: "Philosophen-Könige"
 yearly_republic.1017.desc: "Das Abendmahl ging bis in den frühen Morgen hinein: Die Getränke flossen in Strömen und die Zungen lockerten sich.\n[debater_01.GetFirstName|U], [debater_02.GetFirstName], [debater_03.GetFirstName] und diskutierten alle Themen auf der Welt.\n\nEs trifft mich wie der Blitz, dass ich im Austausch mit einigen der gebildetsten Patrizier der Republik bin – in der Tat eine illustre Gesellschaft. Die Art von Leuten, die sich mit stichhaltigen Argumenten und geistiger Brillianz davon überzeugen ließen, nächstes Mal so wie ich zu stimmen, wenn die Versammlung erneut zusammentritt."
 yearly_republic.1017.a: "Brilliante rhetorische Fähigkeiten werden sie überzeugen."
 yearly_republic.1017.b: "Die Stichhaltigkeit meiner Argumente wird sie überwältigen."
 yearly_republic.1017.c: "Vielleicht ist es besser, zuzuhören und zu lernen."
 yearly_republic.1017.a.success.desc: "Ihr erweist Euch als redegewandter als [debater_orator.GetFirstNameNoTooltip], [Select_CString(debater_orator.IsFemale, 'die beste Rednerin', 'den besten Redner')] hier am Tisch"
 yearly_republic.1017.a.success.toast: "Der Tisch wird gewonnen"
 yearly_republic.1017.a.failure.desc: "[debater_orator.GetFirstNameNoTooltip|U], [Select_CString(debater_orator.IsFemale, 'die beste Rednerin', 'der beste Redner')] am Tisch, hält Euch mit Ausflüchten hin"
 yearly_republic.1017.a.failure.toast: "Eure Rhetorik kommt nicht an"
 yearly_republic.1017.b.success.desc: "Ihr überzeugt [debater_scholar.GetFirstNameNoTooltip], den gebildetsten Verstand am Tisch"
 yearly_republic.1017.b.success.toast: "Der Tisch ist überzeugt"
 yearly_republic.1017.b.failure.desc: "Eure Argumente werden von [debater_scholar.GetFirstNameNoTooltip], dem gebildetsten Verstand am Tisch, zerpflückt"
 yearly_republic.1017.b.failure.toast: "Euer Argument wird zerpflückt"
 yearly_republic.1017.c.toast: "Eine Nacht des Zuhörens"
 yearly_republic.1017.c.tt: "Eine geringe Chance, dass die nächtliche Debatte einen bleibenden Eindruck bei Euch hinterlässt"
 yearly_republic.1017.c.insight.toast: "Die Debatte hinterlässt ihre Spuren"
 yearly_republic.1018.t: "Kommt mit Geschenken"
 yearly_republic.1018.desc: "Mein[benefactor_01.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName] kommt unangekündigt an mein Tor. Nachdem wir uns begrüßt und herzlich umarmt haben, führt mich [benefactor_01.GetFirstNameNoTooltip] nach draußen zu einem wartenden Karren, der mit Waren und Schmuckstücken beladen ist.\n\n„Entschuldigt, dass ich Euch nicht vorher Kunde von meinem Besuch übermitteln ließ, doch ich kam hier vorbei und dachte, Ihr würdet die Sache ([new_curio.GetType]) mögen, die ich von meinen letzten Reisen mitbrachte.“\n\n[benefactor_01.Custom('DE_PRO_PER_S_3P_N')|U] hebt ein Tuch von dem Wagen und zeigt sie ([new_curio.GetName]) mir."
 yearly_republic.1018.a: "„Habt Dank, [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]!“"
 yearly_republic.1018.b: "Vielleicht könnte das einen guten Preis erzielen?"
 yearly_republic.1018_domicile_curio_sold_tt: "Ihr verkauft die Sache ([new_curio.GetName]) später"
 yearly_republic.1019.t: "Ein Blick fürs Detail"
 yearly_republic.1019.desc: "Ein weiterer Tag, an dem mein[benefactor_01.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetShortUIName] und gemeinsam durch die Straßen dieses Orts ([event_location_01.GetName]) spazieren. Es gibt dort immer etwas zu sehen und zu diskutieren.\n\n„Schaut, wie sie diese Feldfrüchte lagern; ich sah, dass sie es in [target_city.GetNameNoTooltip] viel besser machen. Lasst mich Euch sagen, [ROOT.Char.GetFirstNameNoTooltip]: Man kann so viel von den Leuten um uns herum lernen, wenn man nur etwas aufmerksam ist.“"
 yearly_republic.1019.a: "„Habt Ihr auf Euren Reisen etwas in Sachen [experience_trade_category_01.GetNameNoTooltip] gelernt?“"
 yearly_republic.1019.b: "„Lasst uns das Geschäft in Sachen [experience_trade_category_02.GetNameNoTooltip] auf dem Markt diskutieren.“"
 yearly_republic.1019.c: "Ich sollte Beobachtungen zu einer täglichen Angewohnheit machen."
 yearly_republic.1020.t: "Die Abmachung im Badehaus"
 yearly_republic.1020.desc: "„… Geschäfte gedeihen schließlich zwischen vertrauten Partnern.“\n\n[house_benefactor_01.GetFirstName|U] kippt sich einen Eimer Wasser über den Kopf und dreht sich noch einmal mit ernster Miene zu mir. „Eure Familie hat unseren Respekt, [ROOT.Char.GetFirstName].“\n\nDer Dampf des Badehauses vernebelt mir die Sicht, und die Hitze des Wassers entspannt meine Muskeln.\n\n„Ihr und die Euren waren uns von Haus [house_benefactor_01.GetDynastyHouseNameNoTooltip] gute Freunde, und ich denke, es ist nur natürlich, wenn wir unsere Zusammenarbeit vertiefen. Es würde unseren beiden Häusern zum Vorteil gereichen.“"
 yearly_republic.1020.a: "„Wir sollten Agenten und Kontakte in der Fremde miteinander teilen, um so unsere Reichweite vergrößern.“"
 yearly_republic.1020.b: "„Lasst uns unsere Expertise teilen und gemeinsam stärker werden.“"
 ## GLOSS
 BUCENTAUR_GLOSS: "Der Bucentaur war die goldene Staatsbarke Venedigs, die von Ruderern des Arsenals gerudert und nur für zeremonielle Zwecke genutzt wurde."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! – Latein für: „Wir vermählen uns mit Euch, Meer, zum Zeichen wahrer und immerwährender Herrschaft.“"
