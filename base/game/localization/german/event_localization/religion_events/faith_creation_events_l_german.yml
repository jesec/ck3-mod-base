l_german:
 faith_creation.1001.t.schism: "Die [reformed_faith.GetAdjectiveNoTooltip]e Spaltung"
 faith_creation.1001.t.reformation: "Die [reformed_faith.GetAdjectiveNoTooltip]e Reformation"
 faith_creation.1001.desc.schism: "Ein neues Schisma innerhalb des Glaubens ([reformed_faith.GetReligion.GetName]) entstand. [reformer.GetTitledFirstName|U] und [reformer.Custom('DE_PRO_POS_S_3P')]e Anhänger haben mit ihrem Mutterglauben ([old_faith.GetName]) gebrochen und der [old_rite.GetAdjective|l]e Ritus, den sie einst pflegten, wurde die Saat eines eigenen Glaubens."
 faith_creation.1001.desc.reformation: "[reformer.GetTitledFirstName|U], eine berühmte Persönlichkeit inmitten der [reformed_faith.GetAdherentNamePlural], rief alle [reformer.Custom('DefaultPriestTitlePlural')] im Land zusammen, um ihre einzelnen Feierlichkeiten zu einem einzigen Ritus zu verbinden und daraus eine offizielle Doktrin für den Glauben festzulegen."
 faith_creation.1001.desc.schism.personal: "Die [old_faith.GetAdjective|l]en [old_faith.AltPriestTermPlural] sind vom rechten Weg abgekommen, und wir können nicht mehr darauf vertrauen, dass sie uns gut führen. Ich habe [reformer.Custom('DefaultPriestTitlePlural')] zusammengebracht, die wie ich denken, und was wir aus dem [old_rite.GetName] gemacht haben, gehört nicht mehr zu unserem Mutterglauben."
 faith_creation.1001.desc.reformation.personal: "Endlich versammelte ich jeden wichtigen [reformer.Custom('DefaultPriestTitle')] in der Welt, sodass wir unsere einzelnen Feierlichkeiten zu einem einzigen Ritus zusammenführen und eine Doktrin festlegen können, die unseren Glauben von nun an leiten wird."
 faith_creation.1001.desc.schism.personal.hof: "Ich werde nicht länger niederknien, während [old_hof.GetTitledFirstName] und die [old_faith.GetAdjective|l]en [old_faith.AltPriestTermPlural] die Gläubigen verführen. Ich versammelte die [reformer.Custom('DefaultPriestTitlePlural')], die meine Überzeugung teilen, und aus dem [old_rite.GetAdjective|l]en Ritus, den wir pflegten, formten wir einen neuen Glauben, der dem alten ([old_faith.GetName]) nichts schuldet."
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName|U] wies die Autorität von [old_hof.GetTitledFirstName] zurück und führt [reformer.Custom('DE_PRO_POS_S_3P')]e Anhänger von ihrem alten Glauben ([old_faith.GetName]) weg. Der [old_rite.GetAdjective|l]e Ritus, den sie pflegten, ist nun die Wurzel eines Glaubens, der niemandem verantwortlich ist außer sich selbst."
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\nSchon jetzt sprechen entflammte [reformer.Custom('DefaultPriestTitlePlural')] darüber, [reformed_faith.GHWNamePlural] zu entsenden, die ihren neuen Glauben in die Welt hinaustragen sollen, und"
 faith_creation.1001.desc.outlook.pacifism: "\n\nDiese [reformed_faith.GetAdjectiveNoTooltip]en [reformer.Custom('DefaultPriestTitlePlural')] haben Gewalt und Blutvergießen entsagt; ihrer Meinung nach führt Krieg nur zu Leid und Hass, und"
 faith_creation.1001.desc.outlook.dogmatic: "\n\nDiese [reformer.Custom('DefaultPriestTitlePlural')] haben [reformed_faith.GetNameNoTooltip] zum einzig wahren Glauben erklärt, und"
 faith_creation.1001.desc.outlook.accepting: "\n\nDiese [reformed_faith.GetAdjectiveNoTooltip]en [reformer.Custom('DefaultPriestTitlePlural')] ermutigen Zusammenarbeit und Toleranz auch Ungläubigen gegenüber, und"
 faith_creation.1001.desc.outlook.fallback: "\n\nDiese [reformed_faith.GetAdjectiveNoTooltip]en [reformer.Custom('DefaultPriestTitlePlural')] haben eine pragmatische und ausgeglichene Sichtweise anderen Glaubensrichtungen gegenüber, und"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "sie behaupten, dass man wahre Hingabe nur dadurch beweisen kann, dass man ihrem höchsten Gott Menschenopfer darbietet!"
 faith_creation.1001.desc.belief.indulgent: "sie ermutigen ihre Anhänger, sich den Begierden des Fleisches hinzugeben und ihr Leben in vollen Zügen zu genießen."
 faith_creation.1001.desc.belief.incest: "sie sanktionieren die Ehe zwischen nahen Verwandten mit der Begründung, die Bande der Familie seien heilig, und solche Hochzeiten seien gesegnet."
 faith_creation.1001.desc.belief.aniconism: "sie lehnen sämtliche religiösen Symbole ab mit der Begründung, dass bloße Abbilder nicht die wahre Größe ihres obersten Gottes wiedergeben können."
 faith_creation.1001.desc.belief.ascetic: "sie fördern Askese unter ihren Anhängern mit der Begründung, dass das Streben nach Besitz den Weg zu geistiger Erfüllung behindere."
 faith_creation.1001.desc.belief.spirits: "sie erbitten die Hilfe von Geistern, damit diese die Gläubigen durch diese turbulenten Zeiten führen."
 faith_creation.1001.desc.belief.superstition: "sie haben zahlreiche uralte Aberglauben und Legenden in den Kanon der offiziellen Doktrin aufgenommen."
 faith_creation.1001.desc.belief.nature: "sie haben großen Respekt vor der Natur; sie wollen sie bewahren und vor all jenen beschützen, die sie zu ihrem eigenen Nutzen auszubeuten suchen."
 faith_creation.1001.desc.belief.community: "ihr neuer Glaube ist mit den kulturellen Traditionen verschmolzen; nun gibt es eng verbundene Gemeinden von [reformed_faith.GetAdherentNamePluralNoTooltip], die nur ungern Außenseiter aufnehmen."
 faith_creation.1001.desc.belief.pain: "sie lehren, dass das Fleisch durch Mühsal und Schmerz demütig werden muss, damit die Seele sich reinigt und die Glaubigen näher an die höchste Macht ([reformed_faith.HighGodName]) herangeführt werden."
 faith_creation.1001.desc.belief.iconoclasm: "sie rufen dazu auf, dass die Götzenbilder und Altäre falscher Götter überall dort niedergerissen und verbrannt werden, wo sie noch stehen."
 faith_creation.1001.desc.belief.militant: "sie halten daran fest, dass die Gläubigen in erster Linie Soldaten sind, berufen, den Glauben auf der Klinge zu tragen."
 faith_creation.1001.desc.belief.veneration: "sie verehren die heiligen Verstorbenen als Fürsprecher, indem sie ihre Reliquien ehren und ihre Namen im Gebet anrufen."
 faith_creation.1001.desc.belief.sacraments: "sie halten daran fest, dass die Gnade allein durch jene heiligen Riten fließt, die von geweihten Händen und von niemandem sonst gespendet werden."
 faith_creation.1001.desc.belief.penance: "sie lehren, dass jede Seele befleckt geboren wird und nur durch Beichte und Buße rein gemacht werden kann."
 faith_creation.1001.desc.belief.christology: "sie klärten eine große Frage der Glaubenslehre: Sie schreiben das eigentliche Wesen des Göttlichen in Begriffen fest, zu denen sich alle Gläubigen bekennen müssen."
 faith_creation.1001.desc.belief.rebirth: "sie lehren, dass die Seele an das große Rad der Wiedergeburt gebunden ist und jedes neue Leben durch die Taten des vorherigen bestimmt wird."
 faith_creation.1001.desc.belief.learning: "sie schätzen das Lernen höher als beinahe alles andere und sind der Überzeugung, dass das Studium der Welt dazu dient, den Geist der höchsten Macht ([reformed_faith.HighGodName]) besser kennenzulernen."
 faith_creation.1001.desc.belief.law: "sie halten das heilige Gesetz für über allem stehend und fordern, dass jedes Wort der Glaubenslehre wortgetreu befolgt wird."
 faith_creation.1001.desc.belief.missionary: "sie schwören, das Wort in jeden Winkel der Erde zu tragen, damit keine Seele in der Dunkelheit zurückbleibt."
 faith_creation.1001.desc.belief.hierarchy: "sie lehren, dass alle Dinge ihren rechtmäßigen Platz haben und Harmonie nur dann entsteht, wenn jede Seele die über ihr festgelegte Ordnung achtet."
 faith_creation.1001.desc.belief.charity: "sie rufen die Gläubigen dazu auf, Not mit Nächstenliebe zu begegnen und sich gleichermaßen um die Armen, die Kranken und die Fremden zu kümmern."
 faith_creation.1001.desc.belief.family: "sie halten die Bande der Verwandtschaft für heilig und lehren, dass es schon ein Akt der Anbetung ist, seine Vorfahren zu ehren und viele Kinder großzuziehen."
 faith_creation.1001.desc.belief.sacred_sites: "sie errichten große steinerne Monumente als Zeugnisse ihrer Hingabe, heiliger Boden, der für Generationen Bestand haben soll."
 faith_creation.1001.desc.belief.worldly: "sie betrachten die Hingabe aus einem weltlichen und pragmatischen Blickwinkel: Sie sind der Überzeugung, dass Geld, Kompromisse und wohlüberlegtes Schweigen dem Glauben ebenso gewiss dienen können wie das Gebet."
 faith_creation.1001.desc.belief.syncretic: "sie verweben die Glaubensvorstellungen ihrer Nachbarn mit den eigenen und vertreten die Ansicht, dass viele Wege letztlich zur selben Wahrheit führen können."
 faith_creation.1001.desc.belief.fallback: "sie bitten alle Anhänger, alte Streitigkeiten beizulegen und zum Wohl des neuen Glaubens zusammenzuhalten."
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip] hat sich entschlossen, diese aufstrebende [reformed_faith.GetAdjectiveNoTooltip]e Bewegung persönlich anzuführen und so den Titel [reformed_faith.ReligiousHeadName] angenommen. Diesen erhabenen Posten wird [reformer.Custom('DE_PRO_PER_S_3P_N')] wohl an [reformer.Custom('DE_PRO_POS_S_3P')]en Erben weitergeben."
 faith_creation.1001.desc.temporal.personal: "\n\nIch habe mich entschlossen, diese aufstrebende [reformed_faith.GetAdjectiveNoTooltip]e Bewegung persönlich anzuführen und so den Titel [reformed_faith.ReligiousHeadName] angenommen. Diesen erhabenen Posten werde ich an meine Nachfahren weitergeben."
 faith_creation.1001.desc.spiritual: "\n\nDie [reformed_faith.GetAdjectiveNoTooltip|l]en [reformer.Custom('DefaultPriestTitlePlural')] beschlossen, [reformed_hof.GetFirstNameNoTooltip] als [reformed_faith.ReligiousHeadName] anzuerkennen, um den Hauptlinienritus entgegen jedem anderen [reformed_faith.GetAdjectiveNoTooltip|l]en Ritus zu formen und Streitigkeiten innerhalb der Glaubensgemeinschaft zu schlichten."
 faith_creation.1001.desc.spiritual.sameold: "\n\nDie [reformed_faith.GetAdjectiveNoTooltip|l]en [reformer.Custom('DefaultPriestTitlePlural')] beschlossen, [reformed_hof.GetFirstNameNoTooltip] als [reformed_faith.ReligiousHeadName] zu behalten; [reformed_hof.Custom('DE_PRO_PER_S_3P_N')] wird den Hauptlinienritus entgegen jedem anderen [reformed_faith.GetAdjectiveNoTooltip|l]en Ritus formen und Streitigkeiten innerhalb der Glaubensgemeinschaft schlichten."
 faith_creation.1001.desc.no_head: "\n\nDie erblühende Bewegung hat sich beschloss, kein religiöses Oberhaupt einzusetzen; stattdessen soll jeder Ritus seine eigene Lehre behalten und jeder [reformer.Custom('DefaultPriestTitle')] für sein eigenes Gotteshaus ([reformed_faith.HouseOfWorship]) verantwortlich sein."
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip] erwarten gespannt die prophezeite Ankunft: Ein [reformed_faith.ReligiousHeadName] wird als großer Anführer alle Gläubigen um sich scharen und ein neues goldenes Zeitalter ihrer Religion einläuten."
 faith_creation.1001.o.frightened: "[ROOT.Char.GetFaith.random_GoodGodNames], lasst nicht zu, dass diese blutrüstigen [second.Custom('GetUnbelieverNamePlural')] uns etwas antun!"
 faith_creation.1001.o.heretical: "Diese Ketzer werden für ihre Verbrechen gegen [ROOT.Char.GetFaith.HighGodName] büßen!"
 faith_creation.1001.o.crusader: "Ein oder zwei [ROOT.Char.GetFaith.GHWName] werden dafür sorgen, dass diese [second.Custom('GetUnbelieverNamePlural')] uns in Ruhe lassen!"
 faith_creation.1001.o.interested: "Wir sollten diese neue Entwicklung im Auge behalten …"
 faith_creation.1001.o.uninterested: "Es ist einerlei, was diese [second.Custom('GetUnbelieverNamePlural')] glauben."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Erhaltet #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! kostenfreie Aktionen, um [holy_sites|El] zu erschaffen, zurückzustufen, zu erheben, anzunehmen oder aufzugeben"
 faith_creation.1001.o.personal: "Die Welt wird sehen, dass [ROOT.Char.GetFaith.HighGodName] uns bevorzugt!"
 faith_creation.1002.t: "Ein entrissener Ritus"
 faith_creation.1002.t.new_faith: "Unser eigener Glaube"
 faith_creation.1002.desc.intro.founder: "Mein [old_rite.GetAdjective|l]er Ritus kam vom Weg ab – Gebet für Gebet, Grundsatz für Grundsatz –, bis er nicht mehr sein eigentlicher Glaube ([old_faith.GetName]) war."
 faith_creation.1002.desc.intro.member: "Unser [old_rite.GetAdjective|l]er Ritus kam unter [founder.GetTitledFirstName] vom Weg ab – Gebet für Gebet, Grundsatz für Grundsatz –, bis er nicht mehr sein eigentlicher Glaube ([old_faith.GetName]) war."
 faith_creation.1002.desc.intro.observer: "Der [old_rite.GetAdjective|l]e Ritus von [founder.GetTitledFirstName] kam vom Weg ab – Gebet für Gebet, Grundsatz für Grundsatz –, bis er nicht mehr sein eigentlicher Glaube ([old_faith.GetName]) war."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName|U] spricht das Urteil: Die abtrünnige Herde wird ausgestoßen, mit Stumpf und Stiel abgetrennt."
 faith_creation.1002.desc.anathema.no_hof: "\n\nDie [old_faith.AltPriestTermPlural] des Glaubens ([old_faith.GetName]) sprechen das Urteil von jedem Altar: Die abtrünnige Herde wird ausgestoßen, mit Stumpf und Stiel abgetrennt."
 faith_creation.1002.desc.new_head.personal: "Die Last dessen, was folgt, ist die meine: Ich bin nun [new_faith.ReligiousHeadName] meines Glaubens ([new_faith.GetName])."
 faith_creation.1002.desc.new_head.founder: "Wer sie fortführte, führt sie auch weiterhin: [founder.GetFirstNameNoTooltip] als [new_faith.ReligiousHeadName] dieses Glaubens ([new_faith.GetName])."
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName|U] ist nun das [new_faith.ReligiousHeadName] dieses Glaubens ([new_faith.GetName])."
 faith_creation.1002.desc.new_head.none: "Kein einziger Hirte führt die neue Herde; die [new_faith.AltPriestTermPlural] unterstehen nur sich selbst."
 faith_creation.1002.desc.outro.new_faith: "\n\nUnser eigener Glaube, unser eigenes Gesetz – doch sein Feuer brennt erst seit Kurzem, und der alte Glaube ([old_faith.GetName]) könnte uns nun sowohl mit dem Schwert als auch mit der Zensur begegnen."
 faith_creation.1002.desc.outro.old_faith: "\n\nJedes Land und jede Seele, die den [old_rite.GetName] beibehielt, verlässt den Glauben ([old_faith.GetName]) mit einem einzigen Schlag. Sie sind nicht länger Verwandte – bald schon könnten wir uns im Krieg begegnen."
 faith_creation.1002.a: "Endlich unser eigener Glaube."
 faith_creation.1002.a.founder: "Der Weg war immer der unsrige – nun ist es auch der Name."
 faith_creation.1002.b: "Ketzer, jetzt und für immerdar."
 faith_creation.1002.b.hof: "Bringt ihnen bei, wie kalt es außerhalb der Herde ist."
 faith_creation.1002.consequences.tt: "[new_faith.GetName|U] ist nun ein völlig eigener [faith|E]:\n$EFFECT_LIST_BULLET$Alle [followers|E] und [counties|E] des vorherigen [rite|E] gehören nun zum neuen Glauben\n$EFFECT_LIST_BULLET$[faith_hostility|E] gilt zwischen [new_faith.GetName] und [old_faith.GetName], was [holy_wars|E] erlaubt\n$EFFECT_LIST_BULLET$Die zwei Glauben teilen nicht länger ein [head_of_faith|E]"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName|U] erhält#V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! kostenfreie Aktionen, um [holy_sites|El] zu erschaffen, zurückzustufen, zu erheben, anzunehmen oder aufzugeben"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName|U] verliert: [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip] wurde [faith.ReligiousHeadName|U]"
 faith_creation.1010.desc.start: "Obgleich niemand je die Rechtschaffenheit unseres Glaubens in Zweifel zog, war es eine harte Zeit, in der wir ohne geistigen Anführer auskommen mussten. Nun ist dieses Jammertal jedoch endlich durchschritten, da"
 faith_creation.1010.desc.temporal.personal: "ich die [faith.AltPriestTermPlural] endlich davon überzeugen konnte, mich als einzig wahren [faith.ReligiousHeadName|U] zu akzeptieren."
 faith_creation.1010.desc.temporal: "[HoF.GetTitledFirstName] die [faith.AltPriestTermPlural] endlich davon überzeugen konnte, [HoF.Custom('DE_PRO_PER_S_3P_A')] als einzig wahren [faith.ReligiousHeadName|U] zu akzeptieren."
 faith_creation.1010.desc.spiritual: "die [faith.AltPriestTermPlural] zusammenkamen, um [HoF.GetFirstName] als einzig [Select_CString(HoF.IsFemale, 'wahre', 'wahren')] [faith.ReligiousHeadName] und [Select_CString(HoF.IsFemale, 'Bewahrerin', 'Bewahrer')] des Hauptlinienritus anzuerkennen."
 faith_creation.1010.desc.end: "\n\nNun, da die Gläubigen endlich hinter einem starken Anführer vereint sind, erwartet unseren Glauben wohl ein goldenes Zeitalter."
 faith_creation.1010.desc.end.personal: "\n\nNun, da die Gläubigen endlich hinter mir vereint sind, werde ich unseren Glauben in ein goldenes Zeitalter führen!"
 faith_creation.1010.a: "Ehre sei [faith.HighGodName]!"
 faith_creation.1011.message.title: "Ein neues religiöses Oberhaupt"
 faith_creation.1011.message.desc: "Die [faith.GetAdjective|l]en [faith.AltPriestTermPlural] haben [faith.ReligiousHeadName] [HoF.GetFirstName] zu ihrem neuen [head_of_faith|E] gemacht"
 faith_creation.1021.t: "Ein Ritus innerhalb der Herde"
 faith_creation.1021.t.founder: "Unser eigener Ritus"
 faith_creation.1021.desc.intro.founder: "Der [new_rite.GetName] wird verkündet, und jene, die ihm folgen, blicken auf mich. Wir bleiben [old_faith.GetAdherentNamePlural], aber nicht länger [source_rite.GetAdjective|l]."
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName|U] gründete einen neuen Ritus innerhalb des Glaubens ([old_faith.GetName]). Seine Anhänger nennen ihn „[new_rite.GetName]“ und pflegen den [old_faith.GetAdjective|l]en Glauben durch eigene Riten."
 faith_creation.1021.desc.divergence.minor: "\n\nEr unterscheidet sich nur geringfügig vom [source_rite.GetAdjective|l]en. "
 faith_creation.1021.desc.divergence.moderate: "\n\nSeine Bräuche würden den meisten, die den [source_rite.GetAdjective|l]en Ritus pflegen, merkwürdig vorkommen. "
 faith_creation.1021.desc.divergence.major: "\n\nSeine Praktiken sind weit genug von dem [source_rite.GetAdjectiveNoTooltip|l]en entfernt, um verdächtig zu sein. "
 faith_creation.1021.desc.differing.tenet: "Der größte Unterschied liegt im Grundsatz namens [differing_tenet.GetBaseName]."
 faith_creation.1021.desc.differing.doctrine: "Der größte Unterschied liegt in der Doktrin in Sachen [differing_doctrine.GetDescriptiveName]."
 faith_creation.1021.desc.differing.fallback: "Die Trennung macht nicht eine einzige Praxis aus."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nWir ließen den Hauptlinienritus hinter uns, das Maß, nach dem unser Glaube ([old_faith.GetNameNoTooltip]) alle anderen beurteilt. Lasst sie es ruhig Anmaßung nennen."
 faith_creation.1021.desc.outro.founder.branch: "\n\nWir waren bereits ein Zweig; nun sind wir ein von uns selbst geschaffener und legen nur uns gegenüber Rechenschaft ab."
 faith_creation.1021.desc.outro.observer: "\n\nNeue Riten entstehen oft genug. Ob dieser Wurzeln schlägt oder ob er zur Ketzerei verkommt, bleibt abzuwarten."
 faith_creation.1021.a.founder: "Lasst ihn sich stillschweigend unter den Frommen ausbreiten."
 faith_creation.1021.b.founder: "Lasst das ganze Reich davon hören."
 faith_creation.1021.a: "Ein lebendiger Glaube hat Platz für viele Riten."
 faith_creation.1021.b: "Jede Ketzerei beginnt als etwas Neues."
