l_german:
 holy_order_hired_message: "Kriegerorden angeworben"
 holy_order.hired_message: "[holy_order.GetName] wurde von [actor.GetUIName] gerufen"
 holy_order_hired_by_enemy_message: "Feindlicher Kriegerorden"
 holy_order.hired_by_enemy: "[actor.GetUIName] hat den Orden namens [holy_order.GetName] gerufen, der sich uns nun entgegenstellt"
 holy_order.destroyed_message: "[title.GetName] wurde vernichtet"
 holy_order_expanded: "Kriegerorden breitet sich aus"
 holy_order.new_lease: "Der Orden namens [holy_order.GetName] pachtet jetzt [barony.GetName] von [former_holder.GetTitledFirstName]"
 monastic_holy_order_expanded: "Klosterorden expandiert"
 holy_order.0001.t: "Der Kriegerorden"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] wartet auf meinen Abschied. [recipient.Custom('DE_PRO_POS_S_3P')|U]e Habseligkeiten mitsamt Gefolge sind bereit für die bevorstehende Reise.\n\n"
 holy_order.0001.desc_demand: "„Ich nehme an, das hat schon etwas Ehrenhaftes …“, murrt [recipient.Custom('DE_PRO_PER_S_3P_N')], „dass ich sterben muss, um irgendein fremdes Heidenland zu erobern. Ich dachte, ich würde im Kampf für [actor.GetPrimaryTitle.GetNameNoTier] sterben …“\n\n[recipient.Custom('DE_PRO_PER_S_3P_N')|U] steigt auf [recipient.Custom('DE_PRO_POS_S_3P')] Pferd und fragt: „Wohin soll ich reiten?“"
 holy_order.0001.desc: "„Also, [ROOT.Char.Custom('FormOfAddressForLiege')], welchem Orden soll ich mit frommem Herzen und gezücktem Schwert dienen?“"
 holy_order.0001.desc_relation: "„Schon jetzt dürstet mein Schwert nach der niederen Haut des Heiden, [recipient.Custom2('RelationToMeShort', ROOT.Char)]! Doch wohin soll ich reiten? Wer sollen meine neuen [Select_CString(recipient.IsFemale, 'Schwestern', 'Brüder')] sein?“"
 holy_order.0001.a: "Diesem Orden ([holy_order_1.GetName]) sollt Ihr beitreten."
 holy_order.0001.b: "Fortan sollt Ihr diesem Orden ([holy_order_2.GetName]) angehören."
 holy_order.0001.c: "Dieser Orden ([holy_order_3.GetName]) soll sich Eurer annehmen."
 holy_order.0001.d: "Ihr seid jetzt ein Problem des Ordens namens [holy_order_4.GetName]."
 holy_order.0001.e: "Das war ein Fehler. Ihr gehört hierher!"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName|U] nahm den Ruf von [puppet_or_actor.GetShortUIName] an, sich einem Kriegerorden anzuschließen"
 holy_order.0002.desc_angry: "Ich sprach die heiligen Worte und bin nun, so wie Euer Wille mich band, an die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) gebunden."
 holy_order.0002.desc: "Ich werde dem Ruf folgen, einer höheren Macht zu dienen, und ich danke Euch dafür, dass Ihr mich auf diesen Weg der Rechtschaffenheit geführt habt."
 holy_order.0002.a_demand: "Gut. Nun wartet schweigend auf das Jenseits ([ROOT.Char.GetFaith.PositiveAfterLife])."
 holy_order.0002.a: "Ich bin mir sicher, dass Ihr [ROOT.Char.GetFaith.HighGodName] gute Dienste erweisen werdet!"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName|U] legte auf Bitten von [puppet_or_actor.GetShortUIName] das Gelübde ab"
 char_interaction.0001.opening_low_piety: "Dass ein derart [ROOT.GetCharacter.Custom('GetSinfulShameful')|l]es Wesen wie Ihr zu einem heiligen Orden der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) gekrochen kommt … Ihr solltet Euch vor allem anderen um die Rettung Eurer Seele kümmern, ehe Ihr Euch um weltlichen Reichtum sorgt."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.0200.desc: "Ich habe Eure Bitte um Gold vernommen, und der Orden namens [order.GetName] wird ihr nachkommen."
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName] ist mir hold!"
 holy_order.0200.b: "Aber … Aber ich brauche das Geld!"
 holy_order.0202.second_time: "Erneut erinnere ich Euch daran, dass Ihr meinem Orden #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! Gold schuldet."
 holy_order.0202.opening: "Ihr schuldet meinem Orden #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! Gold."
 holy_order.0202.desc: "Wenn Ihr das Gold nicht zurückgebt, werden wir andere Wege finden, wie Ihr Eure Schuld begleichen könnt. Wege, die [ROOT.Char.GetFaith.HighGodName] gutheißt, Ihr aber wohl weniger."
 holy_order.0202.a: "Natürlich werde ich unsere Vereinbarung einhalten."
 holy_order.0202.a_no: "Ich werde bezahlen! Lasst mich nur erst das Gold finden …"
 holy_order.0202.a._not.tt: "@warning_icon! #X Nicht genug [gold_i][gold|E]#!"
 holy_order.0202.b_christian: "Ist Geduld nicht eine Tugend?"
 holy_order.0202.b: "Wir teilen doch denselben Glauben … Gewährt mir etwas mehr Zeit!"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip] gibt Euch 5 Jahre mehr Zeit"
 holy_order.0202.c: "Vielleicht finden wir ja eine andere Art der Zahlung …?"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetTitleAsNameNoTooltip] wird Euch um etwas bitten#!"
 holy_order.0202.d: "In meinen Händen bringt das Geld mehr!"
 holy_order.0203.desc: "Ich bin kein Freund von Wortbrechern, und [ROOT.Char.GetFaith.HighGodNameAlternate] ebenfalls nicht. Um diese Kränkung wiedergutzumachen, werdet Ihr uns [province.GetName] überlassen, damit wir dort das Werk der höheren Mächte vorantreiben können."
 holy_order.0203.a: "Natürlich wird [province.GetNameNoTierNoTooltip] Euer sein."
 holy_order.0203.b: "Welch absurde Forderung!"
 holy_order.0204.desc: "Ich bin kein Freund von Wortbrechern, und [ROOT.Char.GetFaith.HighGodNameAlternate] ebenfalls nicht. Um diese Kränkung wiedergutzumachen, werdet Ihr uns Euer Kind [child.GetTitledFirstName] schicken, damit es das Werk der höheren Mächte verrichtet."
 holy_order.0204.a: "Ich … Ich werde [child.Custom('DE_PRO_PER_S_3P_A')] auf der Stelle losschicken."
 holy_order.0204.a.tt: "Ihr schuldet dem Orden kein Gold mehr"
 holy_order.0205.desc: "Diese ganze Angelegenheit mit dem geliehenen Geld ist eine schändliche Zurschaustellung Eurer Gier. Ich werde dafür sorgen, dass der [ROOT.Char.GetFaith.ReligiousHeadName] davon hört!"
 holy_order.0205.a: "Verflixt!"
 holy_order_letter.opening: "[Select_CString(ROOT.Char.IsFemale, 'Ihr andere Dienerin', 'Ihr anderer Diener')] der höchsten Macht ([ROOT.Char.GetFaith.HighGodNameAlternate]),"
 holy_order.1001.intro: "Eifrige Seelen strömen zum Orden ([holy_order.GetName]) und sind bereit, ihre sterblichen Leiber für den [ROOT.Char.GetFaith.GetAdjective|l]en Glauben zu geben. Wir benötigen mehr Land, um unsere [GetPlayer.Custom('KnightCulturePluralNoTooltip')] unterzubringen."
 holy_order.1001.end: "\n\n[target_barony.GetName|U] ist für diesen Zweck hervorragend geeignet. Können wir diesen Landstrich als Pacht in den Dienst unserer heiligen Sache stellen?"
 holy_order.1001.a: "Eurer Bitte wird stattgegeben. Für [ROOT.Char.GetFaith.HighGodName]!"
 holy_order.1001.b: "Wäre [alternative_barony.GetNameNoTierNoTooltip] nicht genauso hilfreich für Euch?"
 holy_order.1001.c: "Nein, ich werde Euch dieses Land nicht gewähren."
 holy_order.1011.intro: "In [target_barony.GetName] gibt es gutes Land zum Bestellen und schöne Gotteshäuser ([grandmaster.GetFaith.HouseOfWorship]), die von einem Kloster meiner [grandmaster.Custom('SistersBrothers')] viel Gewinn zögen."
 holy_order.1011.end: "\n\nWürdet Ihr als [Select_CString(ROOT.Char.IsFemale, 'Zwischenhändlerin', 'Zwischenhändler')] auftreten, damit der Orden ([holy_order.GetName]) dort ein Kloster errichten könnte?"
 holy_order.1011.a: "Der Orden kann [target_barony.GetNameNoTierNoTooltip] pachten."
 holy_order.1011.b: "Gibt es Ruhe in [alternative_barony.GetNameNoTierNoTooltip]?"
 holy_order.1011.c: "Ich fürchte, Ihr müsst Eure [grandmaster.Custom('SistersBrothers')] woanders hinschicken."
 holy_order.2001.t: "Ein göttliches Ziel"
 holy_order.2001.desc: "Als mein[child.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] zu mir kommt, begreife ich rasch, dass [child.Custom('DE_PRO_PER_S_3P_N')] etwas sehr Ernstes zu besprechen hat.\n\n„[ROOT.Char.Custom('MotherFather')|U], mein Leben hier wird für immer im Schatten anderer gelebt werden. Ich möchte stattdessen den höchsten Mächten dienen und mich dem Orden mit Namen [holy_order.GetName] anschließen. Ich habe mir dies reiflich überlegt, und es ist mein ausdrücklicher Wunsch.“"
 holy_order.2001.a: "Möge das Gute und Gerechte Euch leiten, mein[child.Custom('DE_END_PRO_S_N')] [child.Custom('DaughterSon')]."
 holy_order.2001.b: "Ich habe Pläne für Euch hier, auch wenn es keine grandiosen sein mögen."
 holy_order.2002.desc: "Als mein[sibling.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] [sibling.GetTitledFirstName] mir von [sibling.Custom('DE_PRO_POS_S_3P')]en Plänen berichtet, ist offenkundig, dass [sibling.Custom('DE_PRO_PER_S_3P_N')] sehr lange über sie nachgedacht hat.\n\n„Hier gibt es kaum etwas für mich zu erreichen, und wenn ich schon jemandem dienen muss, dann am liebsten der allerhöchsten Macht selbst. Ich schließe mich dem Orden mit Namen [holy_order.GetName] an.“"
 holy_order.2002.a: "Ich verstehe Eure Entscheidung, [sibling.Custom('SisterBrother')]."
 holy_order.2002.b: "Oh, das werdet Ihr #EMP auf gar keinen Fall#! tun!"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "Es wird immer einen Bedarf an treuen Kriegern geben, die sich jedweder Bedrohung für den [grandmaster.GetFaith.GetAdjective|l]en Glauben entgegenstellen.\nViele Begabungen und nur wenig Aussichten auf ein Erbe: Ich glaube, Euer Kind [child.GetTitledFirstName] könnte im Dienst meines Ordens ein besseres Leben führen. Wir als [holy_order_scope.GetName] werden [child.Custom('DE_PRO_PER_S_3P_A')] ausbilden und unterrichten, und [child.Custom('DE_PRO_PER_S_3P_N')] wird Eurem Namen viel Ehre bringen."
 holy_order.2003.a: "[child.Custom('DE_PRO_PER_S_3P_N')|U] wird leben wie ein wahrer [child.GetFaith.GetAdherentName]."
 holy_order.2003.child_joins_order: "[child.GetFirstName] erhält [GetTrait('order_member').GetName(child.Self)] und schließt sich dem Hof von [grandmaster.GetTitledFirstNameNoTooltip] an"
 holy_order.2003.b: "Vielleicht könntet Ihr stattdessen [alternative_child.GetFirstNameNoTooltip] ausbilden?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName] erhält [GetTrait('order_member').GetName(alternative_child.Self)] und schließt sich dem Hof von [grandmaster.GetTitledFirstNameNoTooltip] an"
 holy_order.2003.c: "[child.Custom('DE_PRO_POS_S_3P')|U] Platz ist hier bei mir."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "Ich habe mein Leben der höchsten Macht ([child.GetFaith.HighGodNameAlternate]) gewidmet, doch ich mag nicht daran glauben, dass sie von mir verlangen würde, meine eigene Familie zu missachten.\n\n[grandmaster.GetTitledFirstName|U] hat mir die Erlaubnis erteilt, in mein altes Leben zurückzukehren und jene weltlichen Pflichten wiederaufzunehmen, die ich [SelectLocalization(IsLandlessAdventurer(ROOT.Char), 'im Lager', 'am Hof')] hinter mir ließ."
 holy_order.2004.a: "Willkommen daheim, mein[child.Custom('DE_END_PRO_S_N')] [child.Custom('DaughterSon')]!"
 holy_order.2004.b: "Nein. Für Euch gibt es hier keinen Platz mehr."
 holy_order.2005.t: "Eine Heimkehr"
 holy_order.2005.desc: "Der Besuch von [child.GetTitledFirstName] dauert länger als gewöhnlich. Erst nachdem mein[child.Custom('DE_END_PRO_S_N')] [child.Custom('DaughterSon')] sich tagelang [SelectLocalization(IsLandlessAdventurer(ROOT.Char), 'in meinem Lager', 'an meinem Hof')] aufhielt, wo [child.Custom('DE_PRO_PER_S_3P_N')] sich mit Essen vollstopfte und meine Bediensteten belästigte, sprach ich die Frage an, wann [child.Custom('DE_PRO_PER_S_3P_N')] denn gedachte, zu [child.Custom('DE_PRO_POS_S_3P')]em Orden zurückzukehren. [child.Custom('DE_PRO_POS_S_3P')|U]e Antwort fiel unglücklicherweise sehr begeistert aus.\n\n„Habt Ihr es denn noch nicht gehört, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName|U] war so großzügig, mich von meinen Pflichten gegenüber dem [child.GetFaith.GetAdjective|l]en Glauben zu entbinden! Ich bin endlich wieder daheim, bei meiner Familie.“"
 holy_order.2005.a: "Oh, Ihr seid … nicht nur zu Besuch?"
 holy_order.destroyed_title: "Kriegerorden aufgelöst"
 holy_order.2010.t: "Ein neuer Klosterorden"
 holy_order.2010.desc: "Einsiedler, Mystiker und unzufriedene Zöglinge älterer Orden versammelten sich in [barony.GetNameNoTier] und arbeiteten jahrelang daran, sich in der Wildnis eine neue Heimat zu schaffen. [Select_CString(leader.IsFemale, 'Eine Frau', 'Ein Mann')] namens [leader.Custom('SisterBrother')|U] [leader.GetFirstName] tat sich bei diesem aufstrebenden Orden als [Select_CString(leader.IsFemale, 'natürliche Anführerin', 'natürlicher Anführer')] mit dem Titel „[leader.GetPrimaryTitle.GetName]“ hervor. Doch in dieser Angelegenheit ist #EMP meine#! erhabene Stimme noch nicht zu hören. Zudem muss ich noch ein heiliges Gebot vorschlagen, das als Kern der Lebensweise dieses Ordens verankert werden soll.\n\nWorüber soll dieser Chor reiner Gläubiger in [barony.GetNameNoTierNoTooltip] singen? Wofür sollen sie arbeiten, um ein erfülltes Leben zu führen? Worüber sollen sie nachdenken und schreiben? Und wer soll sie dabei anleiten?"
 holy_order.2010.4: "[tenet_4.GetName(order_rite)] und [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5: "[tenet_5.GetName(order_rite)] und [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6: "[tenet_6.GetName(order_rite)] und [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d: "[tenet_1.GetName(order_rite)] und [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.e: "[tenet_2.GetName(order_rite)] und [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f: "[tenet_3.GetName(order_rite)] und [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 monastic_tenet_pick_tt: "[tenet_pick.GetName(order_rite)] ist der vom Orden ([monastic_order.GetName]) vertretene [core_tenet|E]"
 monastic_order_tenet_advocated_tt: "Der Orden ([monastic_order.GetName]) vertritt fortan den Grundsatz: [tenet_pick.GetName(order_rite)]"
 founded_monastic_order_modifier: "Klosterorden gegründet"
 founded_monastic_order_modifier_desc: "Dieser weise Herrscher trug zur Konzeption und Gründung eines neuen Klosterordens bei und richtete damit einen direkten Appell an das Göttliche."
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] wird [ruler|E] des Klosterordens „[monastic_order.GetName]“"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] bleibt auch weiterhin [ruler|E] des Klosterordens „[monastic_order.GetName]“"
 holy_order.2009.t: "Der Bau eines Klosters"
 holy_order.2009.desc: "Inmitten der stillen Landschaft ([province.GetTerrain.GetNameNoTooltip]) an einem Ort, den die [province.GetCulture.GetCollectiveNoun] lieben, lege ich den Grundstein für das Kloster von [province.GetName].\n\nMeine Arbeiter schließen sich mit einfachen Werkzeugen zusammen, um Mauern zu errichten und ihren emsigen Leibern andächtige Hymnen zu entlocken. Die ersten Ordensleute – wie [potential_leader.Custom('SisterBrother')|U] [potential_leader.GetName] – sind ebenfalls an diesen Ort gekommen, um Pläne für Kapellen und Refektorien zu entwerfen.\n\nIn wenigen Jahren wird hier ein neuer Orden entstehen. Neben Stein und [ROOT.Char.Custom('GetWritingMaterial')] wird dieser Orden weitere vereidigte Mitglieder benötigen."
 holy_order.2009.a: "Dieser neue Orden muss von jenen geleitet werden, die ich unterstütze."
 holy_order.2009.b: "Viele Ordensmitglieder fühlen sich in ihrem derzeitigen Orden eingeengt …"
 holy_order.2009.b.tt: "… sie würden ihre Oberer im Stich lassen, um in diesem neuen Orden den Ton anzugeben und die Freiheit zu erlangen, neue Regeln zu schreiben."
 holy_order.2009.c: "Versammelt wilde Asketen und eifrige junge Leute."
 monastic_order_creation_increased_spiritual_fulfillment: "[interactions|E] mit dem [monastic_holy_order|E] erhöhen für #high 50 Jahre#! die [spiritual_fulfillment|E]"
 monastic_founder_become_saint_tt: "[chosen_leader.GetShortUIName|U] wird nach [chosen_leader.Custom('DE_PRO_POS_S_3P')]em Tod als [GetTrait('saint').GetName(chosen_leader.Self)] heilig gesprochen, wenn [chosen_leader.Custom('DE_PRO_PER_S_3P_N')] #high mehr als 65#! [trait_level_track_xp|E] in Sachen [GetTrait('devoted').GetName(chosen_leader.Self)] oder eine [piety_level|E] von mindestens @piety_level_4_icon_christian! [GetModifier('piety_level_4').GetNameWithTooltip|L] hat"
 holy_order.2020.t: "Klostergelübde"
 holy_order.2020.desc: "Auf mein Drängen hin wendet [recipient.GetFirstName] [recipient.Custom('DE_PRO_POS_S_3P')]e frisch in Ordensgewänder gekleidete Gestalt von meiner Wohnstatt ([ROOT.Char.Custom('ResidenceBuilding')]) ab, und die [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] und der Adel der profanen Welt bleiben hinter [recipient.Custom('DE_PRO_PER_S_3P_D')] zurück.\n\n[recipient.Custom('DE_PRO_PER_S_3P_N')|U] wird Aufnahme in einer neuen Heimat ([archabbot.GetPrimaryTitle.GetName]) finden. Wie [recipient.Custom('DE_PRO_POS_S_3P')]e anderen Ordensmitglieder schwört [recipient.GetFirstNameNoTooltip] der heiligen Gemeinschaft Treue und Gehorsam. [recipient.Custom('DE_PRO_PER_S_3P_N')|U] übergibt [recipient.Custom('DE_PRO_POS_S_3P')] Fleisch der höchsten Macht ([recipient.GetFaith.HighGodName]) und [recipient.Custom('DE_PRO_POS_S_3P')]en Geist der Verehrung einer jenseitigen Welt ([recipient.GetFaith.PositiveAfterLife]).\n\n[recipient.GetFirstNameNoTooltip|U] soll in [archabbot.GetCapitalLocation.GetName] oder einem anderen Heiligtum des Ordens wohnen und dort [recipient.Custom('DE_PRO_POS_S_3P')] neues Leben voll Studien und Kontemplation beginnen."
 holy_order.2020.aa: "Der Orden hat einen regen Geist gewonnen."
 holy_order.2020.aa.tt: "Die Verwaltungswerte von [recipient.GetFirstNameNoTooltip] werden ihnen bei ihrer unermüdlichen Arbeit zugutekommen."
 holy_order.2020.a: "Der Orden hat einen weisen Zögling gewonnen."
 holy_order.2020.a.tt: "Für [recipient.Custom('DE_ART_DEF_S_A')] gelehrt[recipient.('DE_END_ADJ_IND_S_A')] [recipient.GetFirstNameNoTooltip] könnte kein Ort auf dieser Welt passender sein."
 holy_order.2020.b: "[ROOT.Char.Custom('DE_ART_DEF_S_N')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ihres Lehnsspenders ist kein Küchen[Select_CString(recipient.IsFemale, 'mädchen', 'junge')] …"
 holy_order.2020.c: "Eine „Spende“ sorgt dafür, dass [recipient.GetFirstNameNoTooltip] verwöhnt wird."
 holy_order.2020.d: "[recipient.Custom('DE_PRO_POS_S_3P')|U] Leben gehört nun dem Orden."
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName|U] trat auf Bitten von [puppet_or_actor.GetShortUIName] einem Klosterorden bei"
 take_vows_improve_education_learning_tt: "@skill_learning_icon!Das Ergebnis der [Concept('learning', 'Bildungs')|E]-[education|E] verbessert sich"
 take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon!Das Ergebnis der [Concept('stewardship', 'Verwaltungs')|E]-[education|E] verbessert sich"
 recently_joined_holy_order_desc: "[recipient.GetShortUIName|U] ist [recipient.Custom('DE_PRO_POS_S_3P')]em Orden innerhalb der letzten 5 Jahre beigetreten"
 child_in_holy_order_desc: "[recipient.GetShortUIName] ist ein Kind, das [recipient.Custom('DE_PRO_POS_S_3P')]em Orden versprochen wurde"
 custom.every_domain_monastic_order: "Jeder [monastic_holy_order|E] in Eurer [domain|E]"
 order_gains_minor_tenet_popularity_tt: "[core_tenet|E] erhält #P [tenet_popularity|E] [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! "
 new_order_gains_minor_tenet_popularity_tt: "Euer neuer [monastic_holy_order|E] ermöglicht seinem [core_tenet|E] zusätzliche [tenet_popularity|E] #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#!"
 holy_order.2030.t: "Spende: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "Mein Vermögen wird in die Schatzkammern der Klöster von [recipient.GetTitledFirstName] geleitet. Es ist eine Spende, die die fromme Bewirtschaftung der Ländereien, die Abschrift heiliger Texte und die weltlichen Bestrebungen von [recipient.GetPrimaryTitle.GetName] finanzieren soll …\n\n… Außerdem werden tausend Gebete meiner unsterblichen Seele gewidmet. Denn Klostermitglieder leben, um zu beten, und ihre einzigartige, rechtschaffene Hingabe bedeutet angeblich, dass die höchste Macht ([ROOT.Char.GetFaith.random_GoodGodNames]) besonders darauf achtet, ihre Gebete zu erhören.\n\n#EMP [actor.GetFaith.HighGodName|U], hört Ihr, wie sie meinen Namen sprechen?#!"
 holy_order.2030.desc_desperate_plea: "#EMP Wisst Ihr, wie ich – wie eine arme Seele – um Eure Gnade bat und bettelte?#!"
 holy_order.2030.desc_huge_donation: "#EMP Habt Ihr überhaupt eine Ahnung, welches Vermögen ich aufgab …?#!"
 holy_order.2030.a: "Neue Fürsprecher für mein Seelenheil."
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUIName|U] nahm die klösterliche Spende von [puppet_or_actor.GetShortUIName] an"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U],"
 holy_order.2031.desc: "ich habe über Eure Bitte nachgedacht und gebetet. Leider muss ich Euch mitteilen, dass keine Spende meine Mönche dazu bewegen wird, sich in Eurem Namen an die höchste Macht ([recipient.GetFaith.HighGodName]) zu wenden. Euer Seelenheil scheint selbst für uns unerreichbar zu sein."
 holy_order.2031.a: "Pah! Wenigstens habe ich noch mein Geld."
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte die klösterliche Spende von [puppet_or_actor.GetShortUIName] ab"
 already_has_monastic_lease_tt: "[target.GetNameNoTier|U] ist bereits an einen [monastic_holy_order|E] [leased|E]"
 lease_title_to_existing_monastic_order_interaction: "Spende an ein Kloster"
 lease_title_to_existing_monastic_order_interaction_desc: "Das [Concept('lease', 'Verpachten')|E] eines [Concept('temple_holding', 'Klosters')|E] an [recipient.GetPrimaryTitle.GetName] gewährt [spiritual_fulfillment|E], [piety|E] und einen verbesserten Zugang zum Orden"
 INTERACTION_LEASE_DONATION: "Erwerb von Nebenbesitztümern"
 no_valid_temple_holdings_to_lease_tt: "Es sind keine [temple_holdings|E] in Eurer [domain|E] zur [Concept('lease', 'Verpachtung')|E] verfügbar"
 monastic_onslaught_modifier_tt: "[target_county.GetName|U] erhält für #high 20 Jahre#! den Modifikator „[GetModifier('monastic_onslaught_modifier').GetNameWithTooltip]“"
 holy_order.2040.opening: "[actor.GetFirstName|U] von [actor.GetPrimaryTitle.GetNameNoTier], o [Select_CString(actor.IsFemale, 'Wohltäterin', 'Wohltäter')],"
 holy_order.2040.desc: "es ist vollbracht. Ein Teil von [recipient.GetPrimaryTitle.GetNameNoTier] wird an das Gotteshaus ([actor.GetFaith.HouseOfWorship]) in [target.GetNameNoTier] angeschlossen. Dort, im Herzen des [target.GetDeJureLiegeOfTier('duchy').GetNameNoTier]s werden wir alte Schriften aus den Bibliotheken von [recipient.GetCapitalLocation.GetName] verwahren.\n\n"
 holy_order.2040.desc_nuns: "Und dort werden unsere [recipient.GetFaith.DevoteeFemalePlural] in Eurem Namen Gebete an die höchste Macht ([actor.GetFaith.HighGodName]) richten."
 holy_order.2040.desc_monks: "Und dort werden unsere [recipient.GetFaith.DevoteeMalePlural] in Eurem Namen Gebete an die höchste Macht ([actor.GetFaith.HighGodName]) richten."
 holy_order.2040.desc_huge_donation: "Die Dankbarkeit des Ordens für Eure heilige Nächstenliebe ist gewaltig."
 holy_order.2040.desc_rite: "\n\nSeid gewiss, dass das Kapitel die Bräuche des [recipient.GetRite.GetName] weiter einhalten wird, wie es jedes Haus unseres Ordens tut."
 holy_order.2040.a: "Auf dass Euer Orden gedeihen möge!"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUIName|U] nahm das Angebot von [puppet_or_actor.GetShortUIName] an, eine Baronie zu pachten"
 holy_order.2041.opening: "[actor.GetFirstName|U] von [actor.GetPrimaryTitle.GetNameNoTier],"
 holy_order.2041.desc: "wir, die reinsten Anhänger der höchsten Macht ([recipient.GetFaith.HighGodName]), wir, die wir die vollkommene Heiligkeit des Jenseits ([recipient.GetFaith.PositiveAfterLife]) auf diese elende Erde bringen … befürchten, dass ein Fluch über das Reich von [actor.GetPrimaryTitle.GetNameNoTier] gekommen ist, den selbst unsere Gebete nicht zu bannen vermögen.\n\nSolange die Seele Eures Reichs auf erbärmliche Weise von der höchsten Macht ([recipient.GetFaith.HighGodName]) getrennt ist, kann [recipient.GetPrimaryTitle.GetName] sich nicht nach [target.GetNameNoTier] begeben."
 holy_order.2041.a: "Ihre „Reinheit“ – was für ein Unsinn!"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte das Angebot von [puppet_or_actor.GetShortUIName] ab, eine Baronie zu pachten"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial Der Klosterorden „[monastic_order.GetName|U]“ wird sich in [holy_order_vicinity|E] ansiedeln, was seine [interactions|E] aktiviert#!"
 holy_order.2050.t: "Eine Bewegung erhebt sich in [barony.GetNameNoTierNoTooltip]"
 holy_order.2050.desc: "„Leidet dieser Orden ([target_order.GetName]) immer noch – so wie es die Eremiten in der Wüste taten?“ So beginnen alle scharfzüngigen Schreiben von [clerical_helper.GetName].\n\n„Kleidet sich [target_lessee.GetTitledFirstName] in Gold?“, fragen die Predigten der Reformer in [barony.GetNameNoTier], und sie enden mit: #EMP „Ein neuer Weg! Eine neue Regel!“#!\n\nDas Kloster wird zunehmend zu einer Brustätte für fromme Reformen und Dissens. Die Bewohner sind kaum noch [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip|l] und kaum zufrieden mit dem altbekannten Gerede über den Grundsatz namens [target_order_tenet.GetName(founder.GetRite)]. Doch ihr wandlungsbereiter Geist muss erst noch auf ein einziges neues Prinzip und eine einzige gemeinsame Gesinnung ausgerichtet werden."
 msg_order_movement_took_monastery.t: "[chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip|U]e Bewegung"
