l_german:
 rite_growth.0010.t: "Ein neuer [origin_faith.GetReligion.GetAdjectiveNoTooltip|l]er Ritus"
 rite_growth.0010.desc.intro.relation: "Im Herzen eines neu gegründeten Ritus steht [Select_CString(founder.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', founder.Self)] [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_archbishop: "Im Herzen eines neu gegründeten Ritus steht der [founder.GetCulture.GetName|l]e Erzbischof [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_ruler: "Im Herzen eines neu gegründeten Ritus steht [founder.GetTitledFirstName], "
 rite_growth.0010.desc.opener.archbishopric: "der [founder_clerical_title.GetNameNoTier] vorsteht.\n\n"
 rite_growth.0010.desc.opener.lands: "[Select_CString(founder.IsFemale, 'die', 'der')] über die Lande von [founder.GetPrimaryTitle.GetBaseNameNoTier] herrscht.\n\n"
 rite_growth.0010.desc.divergence.minor: "Bei seinen Anhängern als [new_rite.GetName] bekannt unterscheidet sich dieser Ritus nur leicht vom [source_rite.GetAdjective|l]en, "
 rite_growth.0010.desc.divergence.moderate: "Bei seinen Anhängern als [new_rite.GetName] bekannt ist der Ritus viel zu ungewohnt für viele [source_rite.GetAdjective|l]e Anhänger, "
 rite_growth.0010.desc.divergence.major: "Bei seinen Anhängern als [new_rite.GetName] bekannt grenzen die Praktiken dieses Ritus für die meisten [source_rite.GetAdjective|l]en Anhänger an Ketzerei, "
 rite_growth.0010.desc.differing.tenet: "wobei die auffälligste neue Ausrichtung klar ist: [differing_tenet.GetBaseName]."
 rite_growth.0010.desc.differing.doctrine: "wobei der auffälligste Unterschied klar ist: [differing_doctrine.GetDescriptiveName]."
 rite_growth.0010.desc.differing.fallback: "doch der Unterschied in der Lehre ist zu subtil, um ihn einfach benennen zu können."
 rite_growth.0010.desc.outro.wildfire: "\n\nDiese neuen Lehren verbreiten sich rasch durch die [origin_faith.GetAdjective|l]e Schar."
 rite_growth.0010.a: "Meine Seele ist sicher beim [ROOT.Char.GetRite.GetNameNoTooltip]."
 rite_growth.0010.b: "Ich sollte den [new_rite.GetNameNoTooltip] praktizieren!"
 rite_growth.0010.c: "Klingt für mich nach Ketzerei …"
 counties_and_court_converts: "[counties|E] und [courtiers|E] des [source_rite.GetName] konvertieren zum [new_rite.GetName]"
 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNoTooltip|U] nimmt Ritus an"
 rite_growth.0011.notification.desc: "[convert_ruler.GetTitledFirstName|U] schloss sich [founder.GetTitledFirstName] beim Praktizieren des [new_rite.GetName] an"
 iberian_struggle_blocks_holy_war_tt: "Einen [holy_war|E] zu erklären, darf nicht vom [Concept('iberian_struggle', 'Iberischen Ringen')|E] blockiert werden"
