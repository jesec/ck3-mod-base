l_german:
 religious_interaction.1.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.desc: "Nach viel Gebet und Meditation habe ich beschlossen, Euch das Recht zu gewähren, Euch von Eurem Ehepartner [secondary_recipient.GetFirstNameNoTooltip] scheiden zu lassen,"
 religious_interaction.1.consanguinity: "weil Ihr verwandt seid."
 religious_interaction.1.fallback: "weil der Verdacht eines Ehebruchs besteht."
 religious_interaction.1.adultery: "weil es einen Ehebruch gab."
 religious_interaction.1.different_faith: "weil [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] einem feindlichen Glauben anhängt."
 religious_interaction.1.eunuch: "weil [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] nicht über die Körperlichkeit [Select_CString(secondary_recipient.IsFemale, 'einer echten Frau', 'eines echten Mannes')] verfügt."
 religious_interaction.1.a: "Es tut mir leid, [secondary_recipient.GetFirstNameNoTooltip]."
 religious_interaction.1.price_feud: "\n\nAber das wird Euch beide wohl kaum entzweien, oder? Daher brachte ich in Eurem Sinne scheußliche Anschuldigungen gegen [secondary_recipient.GetFirstName] dem ganzen Haus [secondary_recipient.GetHouse.GetName] gegenüber vor.\n\nDie Familie von [Select_CString(secondary_recipient.IsFemale, 'Eurer', 'Eurem')] [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] scheint nun an einer … #EMP dauerhaften#! Trennung interessiert zu sein."
 religious_interaction.1.price_lease: "\n\nDiese falsche Behauptung hat ihren Preis: die Pacht von [barony_to_lease.GetName] durch den Orden ([lease_order.GetName]). Und solltet Ihr diese Glaubensdiener verstoßen, so wie Ihr es mit [Select_CString(secondary_recipient.IsFemale, 'Eurer', 'Eurem')] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] tatet, so wird Eure Seele doppelt befleckt sein."
 religious_interaction.1.price_hook: "\n\nBedenkt den Gefallen, den Euch [Select_CString(recipient.IsFemale, 'Eure', 'Euer')] [recipient.GetTitleAsName] mit dieser zweifelhaften Erklärung tat. Bedenkt auch: Geben ist genauso gut wie bekommen."
 religious_interaction.1.price_vows: "\n\nDas sind fragwürdige Gründe … und daher suchte ich nach Beweisen, dass [secondary_recipient.GetFirstNameNoTooltip], bevor [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] Eu[secondary_recipient.Custom('DE_END_PRO_S_N')] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] wurde, das Gelübde eines [joining_order_title.GetAdjective|l]en Ordens abgelegt hatte.\n\nIch werde persönlich sicherstellen, dass [secondary_recipient.Custom('DE_PRO_POS_S_3P')]e Hingabe bis in den Tod reicht."
 religious_interaction.1.price_none: "\n\nDas ist natürlich ein Possenspiel. Ein schäbiger Vorgang, der meine Seele beschmutzte. Doch ich kann Euch nicht guten Gewissens zwingen, noch länger das Ehebett mit [secondary_recipient.GetFirstNameNoTooltip] zu teilen."
 religious_interaction.1.a_feud: "Ihr seid bösartig, [recipient.GetFaith.PriestNeuter]! Was habt Ihr getan?!?"
 religious_interaction.1.a_hook: "Frei von [Select_CString(secondary_recipient.IsFemale, 'einer', 'einem')] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] … und belastet mit [Select_CString(recipient.IsFemale, 'einer', 'einem')] [recipient.GetTitleAsNameNoTooltip]."
 religious_interaction.6.price_feud: "\n\nDoch dies wird die beiden wohl kaum entzweien, oder? Daher brachte ich im Sinne von [actor.GetFirstNameNoTooltip] scheußliche Anschuldigungen gegen [secondary_recipient.GetFirstName] dem ganzen Haus [secondary_recipient.GetHouse.GetName] gegenüber vor.\n\nDie Familie von [actor.Custom('DE_PRO_POS_S_3P')][secondary_recipient.Custom('DE_END_PRO_S_D')] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] scheint nun an einer … #EMP dauerhaften#! Trennung interessiert zu sein."
 religious_interaction.6.price_lease: "\n\nDiese falsche Behauptung hat ihren Preis: die Pacht von [barony_to_lease.GetName] durch den Orden ([lease_order.GetName]). Und sollte [secondary_recipient.GetFirstNameNoTooltip] diese Glaubensdiener verstoßen, so wie Ihr es mit [actor.Custom('DE_PRO_POS_S_3P')][secondary_recipient.Custom('DE_END_PRO_S_D')] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] tatet, so wird [actor.Custom('DE_PRO_POS_S_3P')]e Seele doppelt befleckt sein."
 religious_interaction.6.price_hook: "\n\nBedenkt den Gefallen, den Euch [Select_CString(recipient.IsFemale, 'Eure', 'Euer')] [recipient.GetTitleAsName] mit dieser zweifelhaften Erklärung tat. Bedenkt auch: Geben ist genauso gut wie bekommen."
 religious_interaction.6.price_vows: "\n\nDas sind fragwürdige Gründe … und daher suchte ich nach Beweisen, dass [secondary_recipient.GetFirstNameNoTooltip], bevor [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] von [actor.GetFirstNameNoTooltip] wurde, das Gelübde eines [joining_order_title.GetAdjective|l]en Ordens abgelegt hatte.\n\nIch werde persönlich sicherstellen, dass [secondary_recipient.Custom('DE_PRO_POS_S_3P')]e Hingabe bis in den Tod reicht."
 religious_interaction.6.price_none: "\n\nDas ist natürlich ein Possenspiel. Ein schäbiger Vorgang, der meine Seele beschmutzte. Doch ich kann [actor.GetFirstNameNoTooltip] nicht guten Gewissens zwingen, noch länger das Ehebett mit [secondary_recipient.GetFirstNameNoTooltip] zu teilen."
 religious_interaction.2.desc: "Nach langer Überlegung habe ich beschlossen, dass es für unser Haus das Beste wäre, wenn Ihr das Recht bekommt, Euch von Eurem Ehepartner [secondary_recipient.GetFirstNameNoTooltip] scheiden zu lassen,"
 religious_interaction.2.infertility: "weil man sich weigert, die Ehe zu vollziehen."
 religious_interaction.2.adultery: "weil durch [secondary_recipient.Custom('DE_PRO_POS_S_3P')]en Beischlaf mit einer anderen Person die Heiligkeit des Ehestandes geschmäht wurde."
 religious_interaction.3.desc_subordinate: "Im Namen aller Vertreter der höchsten Macht ([actor.GetFaith.HighGodName]) auf Erden gewähre ich Euch Eure Bitte."
 religious_interaction.3.desc: "Ich habe Eure Notlage bedacht und entschieden, Eurem Ansinnen stattzugeben."
 religious_interaction.3.defensive_war: "Mögen diese Mittel Euch dabei helfen, den Glauben gegen [war_target.GetTitledFirstName] und die vorrückenden [war_target.GetFaith.GetAdjective|l]en Horden zu verteidigen!"
 religious_interaction.2.offensive_war: "Mögen Euch diese Mittel den Sieg im Krieg gegen [war_target.GetTitledFirstName] bringen!"
 religious_interaction.3.fallback: "Mögen diese Mittel Euch helfen, den wahren Glauben in Euren Ländereien zu verbreiten!"
 religious_interaction.3.a: "Gepriesen sei [ROOT.Char.GetFaith.WealthGodName]! Hier kommt die Steuerrückzahlung!"
 religious_interaction.3.b: "Diese Mittel werden mir den Sieg bringen!"
 religious_interaction.3.c: "Ich werde diesen Reichtum weise nutzen."
 religious_interaction.3.d: "Dieses Gold wird meinen ausgehungerten Schatztruhen etwas Labsal bringen!"
 religious_interaction.32.desc: "Ich habe Eure Anfrage bedacht und entschieden, sie abzulehnen."
 religious_interaction.32.a: "O nein!"
 religious_interaction.4.desc: "Ich habe über Eure Bitte nachgedacht und habe entschieden, Euren Anspruch auf [target.GetName] anzuerkennen."
 religious_interaction.4.child: "Da [secondary_recipient.GetTitledFirstName] nur ein Kind ist, seid Ihr durchaus im Recht, dort einzugreifen."
 religious_interaction.4.they_are_female: "Da [secondary_recipient.GetTitledFirstName] nur eine Frau ist, seid Ihr durchaus im Recht, dort einzugreifen."
 religious_interaction.4.they_are_male: "Da [secondary_recipient.GetTitledFirstName] nur ein Mann ist, seid Ihr durchaus im Recht, dort einzugreifen."
 religious_interaction.4.fallback: "Es ist sind unerschütterliche Beweise ans Licht gekommen, dass unsere Ahnen in der Tat in uralten Zeiten dieses Land regierten."
 religious_interaction.4.a: "Ich werde mich als würdiger Herrscher beweisen!"
 religious_interaction.42.desc: "Ich habe Eure Anfrage bezüglich eines Anspruchs auf [target.GetName] bedacht und entschieden, sie abzulehnen."
 religious_interaction.42.a: "Verdammt noch eins!"
 religious_interaction.5.child: "Da Ihr minderjährig seid"
 religious_interaction.5.they_are_female: "Da Ihr eine Frau seid"
 religious_interaction.5.they_are_male: "Da Ihr ein Mann seid"
 religious_interaction.5.fallback: "Da es Euch offensichtlich an Frömmigkeit mangelt"
 religious_interaction.5.outro: "und dies der Kirche große Sorgen bereitet,"
 religious_interaction.5.outro_different_recipient: "habe ich [actor.GetName] auf [actor.Custom('DE_PRO_POS_S_3P')]en Wunsch hin einen Anspruch auf [target.GetName] gewährt."
 religious_interaction.5.self: "Ich habe mich entschieden, meinem Anspruch auf [target.GetName] nachzugehen, wie es mein Recht ist."
 religious_interaction.5.a: "Das ist eine Farce!"
 religious_interaction.6.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.desc: "Nach viel Gebet und reiflicher Überlegung habe ich beschlossen, [secondary_actor.GetFirstNameNoTooltip] eine Scheidung von [secondary_recipient.GetFirstNameNoTooltip] zu gewähren,"
 religious_interaction.6.consanguinity: "weil sie verwandt sind."
 religious_interaction.6.fallback: "weil der Verdacht eines Ehebruchs besteht."
 religious_interaction.6.adultery: "weil es einen Ehebruch gab."
 religious_interaction.6.different_faith: "weil [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] einem feindlichen Glauben anhängt."
 religious_interaction.6.eunuch: "weil [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] nicht über die Körperlichkeit verfügt, wie man sie von [Select_CString(secondary_recipient.IsFemale, 'einer', 'einem')] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] erwartet."
 religious_interaction.6.a: "[actor.GetFirstNameNoTooltip|U] und [secondary_recipient.GetFirstNameNoTooltip] gibt es nicht mehr."
 religious_interaction.1001.t.fatwa: "Fatwa angewiesen!"
 religious_interaction.1001.t: "Rechtliche Verdammung!"
 religious_interaction.1001.desc: "Mein[actor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))], [actor.GetTitledFirstName], ließ mich in einem Schreiben, das von [actor.Custom('DE_PRO_POS_S_3P')]em [actor.GetFaith.PriestNeuter] verfasst wurde, als sündig verdammen!\n\nDies könnte als rechtliche Basis für die Anfechtung meiner Befähigung dienen, in [recipient.GetFaith.GetAdjective|l]en Landen zu herrschen."
 religious_interaction.1001.a: "Wäre [actor.Custom('DE_PRO_PER_S_3P_N')] nicht mein Lehnsherr, würde ich …"
 religious_interaction.1001.a.revoke_tt: "[actor.GetTitledFirstName] kann einen meiner Titel [revoke|E]"
 #Religious Head of Faith Interactions
 religious_interaction.1010_subordinate: "Als Eure Stimme bei den heiligsten [actor.GetFaith.GetAdjective|l]e! Ohren und den heiligsten [actor.GetFaith.GetAdjective|l]en Herzen, gewähre ich Euch Erlösung von der Last Eurer Sünden.\n\nEure großzügige Spende hat Euch diese Vergebung verdient."
 religious_interaction.1010: "Es ist lobenswert, dass Ihr Buße für Eure Sünden tun wollt. Ich nehme Eure großzügige Spende an und entsende Euch im Gegenzug meinen Segen."
 religious_interaction.1011: "Eure Missetaten sind viel zu schwer, als dass man sie nur mit Gold wiedergutmachen könnte. Wenn Ihr für Eure Sünden wirklich büßen wollt, müsst Ihr Eure Lebensweise ändern und mir beweisen, dass Ihr aufrichtig Vergebung sucht. Erst dann kann ich Eure Spende annehmen."
 religious_interaction.excommunication.opening: "[excommunication_issuer.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1020: "Ich habe verstörende Nachrichten von [actor.GetTitledFirstName] über Eure Missetaten erhalten."
 religious_interaction.1020.requested: "Ich hörte verstörende Berichte von [actor.GetTitledFirstName] über Eure Fehltritte. Auf [actor.Custom('DE_PRO_POS_S_3P')] Drängen hin habe ich Euch aus dem [recipient.GetFaith.GetAdjective|l]en Glauben exkommuniziert.\n\nMöge die höchste Macht ([recipient.GetFaith.HighGodName]) Eurer Seele gnädig sein."
 religious_interaction.1020.sin: "Verstörende Berichte von [actor.GetTitledFirstName] sprechen von Eurer [my_sinful_trait.GetName(ROOT.Char)|l]en Natur. Auf [actor.Custom('DE_PRO_POS_S_3P')] Drängen hin habe ich Euch aus dem [recipient.GetFaith.GetAdjective|l]en Glauben exkommuniziert.\n\nMöge die höchste Macht ([recipient.GetFaith.HighGodName]) Eurer Seele gnädig sein."
 religious_interaction.1020.empire: "Euer Anspruch auf das Großreich hat den [recipient.GetFaith.GetAdjective|l]en Glauben gespalten. Auf das Drängen von [actor.GetTitledFirstName] hin habe ich Euch exkommuniziert."
 religious_interaction.1020.a.tt_petition: "#help Erlangt [piety|E]. Nach einem Jahr wendet Ihr Euch persönlich mit einer Bitte an Euer [head_of_faith|E] und wählt #high $petition_head_of_faith_decision_option_repentance$#! aus. Siehe [Concept('excommunicated_recovery', 'Aufhebungsmöglichkeiten')|E].#!"
 religious_interaction.1020.a.tt_declaration: "#help Erlangt [piety|E]. Nutzt nach einem Jahr #high $declaration_of_repentance_interaction$#! bei einem rechtmäßig anerkannten Geistlichen. Siehe [Concept('excommunicated_recovery', 'Aufhebungsmöglichkeiten')|E].#!"
 religious_interaction.1020.a: "Ich werde meine Strafe annehmen und nach Vergebung suchen"
 religious_interaction.1020.b: "Verflucht sei [actor.GetFirstNameNoTooltip] dafür!"
 religious_interaction.1020.b.tt: "#help Verliert [stress|E]. Macht Fortschritte in Richtung einer [rivalry|E] mit [actor.GetShortUIName].#!"
 religious_interaction.1020.c: "Verflucht sei [Select_CString(recipient.IsFemale, 'die', 'der')] [recipient.GetTitleAsNameNoTooltip], dass [Select_CString(recipient.IsFemale, 'sie', 'er')] auf [actor.Custom('DE_PRO_PER_S_3P_A')] hört!"
 religious_interaction.1020.c.tt: "#help Verliert [stress|E]. Macht Fortschritte in Richtung einer [rivalry|E] mit [recipient.GetShortUIName]. [GetTrait('cynical').GetName(GetNullCharacter)|U]e, [GetTrait('wrathful').GetName(GetNullCharacter)|l]e und [GetTrait('arbitrary').GetName(GetNullCharacter)|l]e [courtiers|E] heißen dies gut.#!"
 religious_interaction.1021.generic: "Wir alle können irren, denn wir sind in Sünde geboren. Doch ach, bei Euch sehe ich nicht einmal den Versuch, den Weg Christi zu beschreiten."
 religious_interaction.1021.empire: "In diesen letzten Tagen stelltet Ihr Euren eigenen Ehrgeiz über die Belange der Christenheit. Euer Anspruch auf das Großreich ist ein Krebsgeschwür am Leib der Kirche!"
 religious_interaction.1021.clergy_hostility: "Unsere Feindschaft ist kein Geheimnis. Doch wegen Eurer Liebe zur Sünde und Eurer Widersetzlichkeit verstoße ich Euch."
 religious_interaction.1021.sin: "Eure sündhafte Natur ist allen bekannt. Ich kann nicht zulassen, dass Euer Beispiel die Herde in die Irre führt."
 religious_interaction.1021.conclusion: "\n\nIhr seid aus dem [actor.GetFaith.GetAdjective|l]en Glauben exkommuniziert. Möge die höchste Macht ([actor.GetFaith.HighGodName]) Eurer Seele gnädig sein."
 religious_interaction.1021.a: "Ich unterwerfe mich dem Urteil der Kirche."
 religious_interaction.1021.b: "Die höchste Macht ([recipient.GetFaith.HighGodName]) verlieh mir meine Krone, [Select_CString(recipient.IsFemale, 'keine', 'kein')] [actor.GetTitleAsNameNoTooltip]!"
 religious_interaction.1021.b.tt: "#help Verliert [stress|E]. Macht Fortschritte in Richtung einer [rivalry|E] mit [actor.GetShortUIName]. [GetTrait('cynical').GetName(GetNullCharacter)|U]e, [GetTrait('wrathful').GetName(GetNullCharacter)|l]e und [GetTrait('arbitrary').GetName(GetNullCharacter)|e] [courtiers|E] heißen dies gut.#!"
 religious_interaction.1022: "Am schwersten verstören mich die Geschichten, die Ihr über die Missetaten von [secondary_recipient.GetTitledFirstName] erzählt habt. Es schmerzt mich sehr, doch ich stimme Euch zu, dass es zum Wohl des [actor.GetFaith.GetAdjective|l]en Glaubens ist, wenn [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] exkommuniziert wird."
 religious_interaction.1022.toast_puppeteer: "[recipient.GetShortUIName|U] gewährte die Exkommunikationsbitte von [puppet_or_actor.GetShortUIName]"
 religious_interaction.1023: "Was bildet Ihr Euch ein, dass Ihr die Exkommunizierung eines anderen erbittet? Der [actor.GetFaith.GetAdjective|l] Glaube ist doch kein Mittel des politischen Vorankommens! Ihr solltet Euch glücklich schätzen, dass ich nicht Euch exkommuniziere, weil Ihr um so etwas bittet. "
 religious_interaction.1023.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte die Exkommunikationsbitte von [puppet_or_actor.GetShortUIName] ab"
 religious_interaction.1024: "Ich merke schon, dass Ihr Eure Sünden wirklich bereut und große Anstrengungen unternommen habt, um Euch von ihnen reinzuwaschen. Auch wenn Eure Vergehen gegen den [actor.GetFaith.GetAdjective|l]en Glauben wirklich schwer wogen, lassen mich Eure jüngsten Taten doch glauben, dass Ihr noch eine Chance verdient habt.\n\nAngesichts dessen hebe ich Eure Exkommunikation auf und heiße Euch zurück im Schoß des [actor.GetFaith.GetAdjective|l]en Glaubens willkommen."
 religious_interaction.1024.toast_puppeteer: "[recipient.GetShortUIName|U] hob die Exkommunikation von [puppet_or_actor.GetShortUIName] auf"
 religious_interaction.1025: "Meint Ihr, ich würde Leute leichtfertig exkommunizieren? Meint Ihr, dass eine halbherzige Entschuldigung ausreicht, um das wiedergutzumachen? Bettelt, so viel Ihr nur wollt: Ich werde Euch nicht wieder zurück in den [actor.GetFaith.GetAdjective|l]en Glauben lassen, bis Ihr bewiesen habt, dass Ihr Eure ruchlose Lebensweise wirklich geändert habt."
 religious_interaction.1025.toast_puppeteer: "[recipient.GetShortUIName|U] weigerte sich, die Exkommunikation von [puppet_or_actor.GetShortUIName] aufzuheben"
 religious_interaction.1030: "Nach reiflicher Überlegung habe ich beschlossen, dass Eure Worte wahr und weise sind. Ich werde mich einem Klosterorden anschließen und ein neues Leben allein im Dienst von [actor.GetFaith.HighGodName] beginnen."
 religious_interaction.1031: "Ihr erweist mir die Ehre, mir vorzuschlagen, die heiligen Gelübde abzulegen. Doch ich fürchte, die höchste Macht ([recipient.GetFaith.HighGodName]) hat Pläne für mich, die über die Klostermauern hinausreichen. Meine Seele und mein Gewissen lassen es nicht zu, dass ich diese Worte ausspreche."
 religious_interaction.1031.toast_puppeteer: "[recipient.GetShortUIName|U] verweigerte sich der Bitte von [puppet_or_actor.GetShortUIName], das Gelübde abzulegen"
 religious_interaction.1000.positive: "Ich freue mich, dass [recipient.GetFirstNameNoTooltip] die Weisheit in meiner Bitte erkannte."
 religious_interaction.1000.negative: "Höchst bedauerlich …"
 religious_interaction.1000.strong_negative: "Verdammt noch eins!"
 religious_interaction.1024.positive: "Ich freue mich, dass [recipient.GetFirstNameNoTooltip] die Weisheit dieses Vorgehens erkannte."
 religious_interaction.2002.desc: "Ich habe mich entschieden, dem Licht zu folgen und zum [ROOT.Char.GetFaith.GetName] zu konvertieren!"
 religious_interaction.2002.toast_puppeteer: "[recipient.GetShortUIName|U] akzeptierte die Aufforderung von [puppet_or_actor.GetShortUIName], sich zu bekehren"
 religious_interaction.2002.a: "Gepriesen sei [ROOT.Char.GetFaith.HighGodName]!"
 religious_interaction.2003.desc: "Mein Glaube ist zu stark, um sich weltlichen Worten zu beugen. Ich werde mich lieber im Jenseits entlohnen lassen."
 religious_interaction.2003.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte die Aufforderung von [puppet_or_actor.GetShortUIName] ab, sich zu bekehren"
 religious_interaction.2003.hooking_out: "\n\nIch möchte Euch auch daran erinnern, dass Ihr mir etwas schuldet und Ihr mir lieber nicht noch weiter zusetzt, nur weil ich ein wahrer Gläubiger bin."
 religious_interaction.2003.a: "Es ging mir doch nur um Euer Seelenheil."
 religious_interaction.2003.b: "Nun, Ihr werdet den Preis dafür in dieser Welt entrichten!"
 religious_interaction.2003.c: "Meint nicht, dass ich Euch einfach damit davonkommen lasse!"
 religious_interaction.2003.d: "Oh, ich denke, Ihr werdet genau das glauben, was ich Euch sage."
 religious_interaction.2011.desc: "Gern würde ich mich Euren Lobpreisungen anschließen, doch die schieren Kosten der Umgestaltung unserer [recipient.GetFaith.HouseOfWorshipPlural] und der Verkündung unter meinen Bauern …\n\nWenn Ihr mir bei diesen Bemühungen helfen würdet, wäre ich auch eher bereit, zu [ROOT.Char.GetFaith.HighGodName] zu beten."
 religious_interaction.2011.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte die Aufferderung von [puppet_or_actor.GetShortUIName] ab, es sei denn, Gold würde gezahlt"
 religious_interaction.2011.a: "Alles für den Glauben."
 religious_interaction.2011.b: "Ich werde nicht für Eure ewige Erlösung zahlen!"
 religious_interaction.2011.c: "Ihr werdet es für etwas sehr viel Wertvolleres als Gold tun."
 religious_interaction.2012.desc: "Ich erkenne die Weisheit in Eurem Glauben, doch ich hoffe, Ihr erkennt auch, was für ein langer, gewundener Pfad es von der Finsternis ins Licht ist.\n\nVielleicht würde die Reise für mich leichter werden, wenn Ihr versprächet, mich überall zu unterstützen, wohin mich dieser Weg führt."
 religious_interaction.2012.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte die Aufforderung von [puppet_or_actor.GetShortUIName] ab, es sei denn, es würde ein Gefallen gewährt"
 religious_interaction.2012.a: "Ich akzeptiere, zum Wohl der Gläubigen allerorten."
 religious_interaction.2012.b: "Ich werde nicht um Eure Seele feilschen!"
 religious_interaction.2012.c: "Erst müsst Ihr mir noch andere Schulden zahlen."
 religious_interaction.2015.desc: "Der [actor.GetRite.GetName] brachte Euch offenkundig Stärke. Ich möchte die Macht, die Ihr von der höchsten Instanz ([actor.GetFaith.HighGodName]) erhieltet, besser verstehen."
 religious_interaction.2015.toast_puppeteer: "[recipient.GetShortUIName|U] bat [puppet_or_actor.GetShortUIName] zu warten, während [recipient.Custom('DE_PRO_PER_S_3P_N')] den Glauben studiert"
 religious_interaction.2015.a: "Ich werde Euch die Wege der guten Mächte ([actor.GetFaith.GoodGodNames]) lehren."
 religious_interaction.2015.b: "Ihr werdet Euch heute noch den guten Mächten ([actor.GetFaith.GoodGodNames]) beugen!"
 religious_interaction.2015.c: "Vielleicht lernt Ihr am besten durchs Handeln."
 religious_interaction.2016.desc: "Wie erbeten könnt Ihr die Lehren der guten Mächte ([actor.GetFaith.GoodGodNames]) unter meinem wachsamen Blick studieren."
 religious_interaction.2016.a: "Lasst uns beginnen."
 religious_interaction.2016.a.tt: "Ihr werdet mit einem [GetScheme('study_faith').GetTypeName] bei [actor.GetShortUINameNoTooltip] beginnen."
 religious_interaction.2021.opening: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2021.desc: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]\nEs wird Zeit, dass Ihr mir ins Licht folgt, [puppet_or_actor.Custom2('RelationToMe', SCOPE.sC('recipient'))]. In Anbetracht all dessen, was Ihr mir schuldet, verlange ich, dass Ihr Euch zu meinem Glauben ([puppet_or_actor.GetFaith.GetName]) bekehrt!"
 religious_interaction.2021.a: "Ich … Meinethalben, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('puppet_or_actor'))]."
 #######################################################
 ### Sun Trial by Mathilda Bjarnehed & Nick Meredith ###
 #######################################################
 #I have been left in the sun to die!
 religious_interaction.2100.t: "Eine höhere Gerechtigkeit"
 religious_interaction.2100.desc: "Nachdem ich weiß die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) wie lange in einer dunklen Zelle verbracht habe, blendet mich das grelle Tageslicht. Die Wachen, die mich aus dem Kerker in die Wildnis geleiten, sind überraschend still, ja sogar feierlich ernst.\n\n"
 religious_interaction.2100.descwaterlogged: "Die Sonne strahlt zwar hell, doch der sumpfige Boden, auf dem ich stehe, schmatzt und saugt an meinen Füßen. Bald sehe ich [Select_CString(imprisoner.IsFemale, 'meine Kerkermeisterin', 'meinen Kerkermeister')] [imprisoner.GetTitledFirstName], [imprisoner.Custom('DE_ART_DEF_S_N')] sich selbstgefällig, aber etwas behäbig über den aufgeweichten Grund nähert, in Begleitung mehrerer [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descpleasant: "Die Sonne strahlt zwar hell, doch der sumpfige Boden, auf dem ich stehe, schmatzt und saugt an meinen Füßen. Bald entdecke ich [Select_CString(imprisoner.IsFemale, 'meine Kerkermeisterin', 'meinen Kerkermeister')] [imprisoner.GetTitledFirstName], [imprisoner.Custom('DE_ART_DEF_S_N')] sich ein wenig unsicher wirkend über den aufgeweichten Grund nähert, in Begleitung mehrerer [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descforest: "Die Sonne scheint hell und fällt in getupften Strahlen durch die Baumkronen. Bald entdecke ich [Select_CString(imprisoner.IsFemale, 'meine Kerkermeisterin', 'meinen Kerkermeister')] [imprisoner.GetTitledFirstName], [imprisoner.Custom('DE_ART_DEF_S_N')] sich durch das Dickicht kämpft, in Begleitung mehrerer [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descoasis: "Die Sonne brennt auf die Wüste herab und glitzert auf der Oberfläche der Oase. Bald entdecke ich [Select_CString(imprisoner.IsFemale, 'meine Kerkermeisterin', 'meinen Kerkermeister')] [imprisoner.GetTitledFirstName], [imprisoner.Custom('DE_ART_DEF_S_N')] durch das Wasser patscht, in Begleitung mehrerer [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.deschostile: "Als ich [imprisoner.GetTitledFirstName] sehe, flankiert von einem Dutzend [imprisoner.Custom('DefaultPriestTitlePlural')], wird mir klar, was unser kleiner Ausflug bedeutet.\n\n„[ROOT.Char.GetFullNameNoTooltip]. Ihr werdet hier an diesen Pfahl gefesselt, und die höchste Instanz ([imprisoner.GetFaith.HighGodName]) wird über Euer Schicksal entscheiden. Falls Ihr unschuldig seid, überlebt Ihr, doch solltet Ihr schuldig sein, ereilt Euch der Tod.“"
 religious_interaction.2100.middledefault: "„Für Eure Vergehen werdet Ihr von der Allmacht der höchsten Instanz ([imprisoner.GetFaith.HighGodName|U]) gerichtet werden“, dröhnt [imprisoner.Custom('DE_PRO_PER_S_3P_N')]. Die Wachen treten vor und binden meine Gliedmaßen an einen Pfahl. Die [imprisoner.Custom('DefaultPriestTitlePlural')] beginnen mit ausgestreckten Armen ein Klagelied. Dann zieht sich die Gruppe zurück. Ich bin allein und soll verdursten."
 religious_interaction.2100.middleoasis: "„Für Eure Vergehen werdet Ihr von der Allmacht der höchsten Instanz ([imprisoner.GetFaith.HighGodName|U]) gerichtet werden“, dröhnt [imprisoner.Custom('DE_PRO_PER_S_3P_N')]. Die Wachen treten vor und binden meine Gliedmaßen an einen Pfahl, der brusttief in der Oase steckt. Die [imprisoner.Custom('DefaultPriestTitlePlural')] beginnen mit ausgestreckten Armen ein Klagelied. Dann zieht sich die Gruppe zurück. Ich bin allein und soll verdursten."
 religious_interaction.2100.endwaterlogged: "\n\nIch schaue mich in meiner durchnässten Umgebung um."
 religious_interaction.2100.endpleasant: "\n\nIch schaue mich in meiner angenehmen Umgebung um."
 religious_interaction.2100.endforest: "\n\nIch schaue mich in meiner grünen Umgebung um."
 religious_interaction.2100.endoasis: "\n\nIch blicke hinunter zum Wasser."
 religious_interaction.2100.a.believer: "[imprisoner.GetFaith.HighGodName|U] wird gerecht über mich richten!"
 religious_interaction.2100.a.unbeliever: "Ihr lasst mich #EMP wirklich#! hier zurück?!"
 religious_interaction.2100.a.confused: "Ähm …"
 religious_interaction.2100.a.success: "Ihr überlebt die Prüfung"
 religious_interaction.2100.a.failure: "Ihr vergeht unter der Sonne"
 #I have survived!
 religious_interaction.2101.t: "Begnadigt von der höchsten Instanz ([imprisoner.GetFaith.HighGodName|U])"
 religious_interaction.2101.start.desc: "Wasser, ich brauche Wasser! Meine Kehle, mein Kopf, meine Haut … Ich brenne!\n\nWaren wirklich Dämonen hier, die über mein Elend lachten? Hat [ROOT.Char.GetFaith.WaterGodName] mir wirklich eine Flasche Wasser angeboten? Ich trank und trank, doch mein Durst wurde einfach nicht gestillt."
 religious_interaction.2101.end.desc: "\n\nAls [imprisoner.GetTitledFirstName] zurückkehrt und eine Flasche an meine Lippen gedrückt wird, lichtet sich der Nebel in meinem Geist. [imprisoner.Custom('DE_ART_DEF_S_N')|U] [imprisoner.GetTitleAsNameNoTooltip] scheint ein wenig enttäuscht, mich noch lebend vorzufinden, doch der göttliche Wille hat gesprochen."
 religious_interaction.2101.desc.pleasant: "Ich habe meine angeketteten Tage im Freien fast #EMP genossen#!. Die Vögel sangen, die Sonne wärmte mir die Haut und Regentropfen erfrischten mich und löschten meinen Durst.\n\nAls [imprisoner.GetTitledFirstName] zurückkehrt, ist [imprisoner.Custom('DE_PRO_PER_S_3P_N')] sichtlich verärgert über mein Befinden und meine allgemein gute Laune, doch [imprisoner.Custom('DE_PRO_PER_S_3P_N')] muss sich den eigenen Bedingungen beugen: Das Göttliche hat gesprochen!"
 religious_interaction.2101.desc.oasis: "Ich habe meine angeketteten Tage in den kühlen Wassern der Oase fast #EMP genossen#!. Die Sonne brannte zwar heiß, doch die Seile waren locker genug, dass ich mich hinunterbeugen und trinken konnte.\n\nAls [imprisoner.GetTitledFirstName] zurückkehrt, ist [imprisoner.Custom('DE_PRO_PER_S_3P_N')] sichtlich verärgert über meine Verfassung und meine allgemein gute Laune, aber [imprisoner.Custom('DE_PRO_PER_S_3P_N')] muss sich den eigenen Bedingungen beugen: Das Göttliche hat gesprochen!"
 religious_interaction.2101.a: "Ich bin unschuldig!"
 #They survived...
 religious_interaction.2102.desc: "Am letzten Abend der Prüfung von [prisoner.GetTitledFirstName] finden wir [prisoner.Custom('DE_PRO_PER_S_3P_A')] bewusstlos, aber noch immer lebend vor.\n\n„Das ist ein Wunder!“, erklärt der [ROOT.Char.Custom('DefaultPriestTitle')] mit erhobenen Händen. „[ROOT.Char.GetFaith.HighGodName|U] hat gesprochen! Dieser Mensch ist unschuldig!“"
 religious_interaction.2102.oasis: "Als ich durch das Wasser der Oase wate, in der [prisoner.GetTitledFirstName] angebunden wurde, finde ich [prisoner.Custom('DE_PRO_PER_S_3P_A')] nicht nur bei Bewusstsein, sondern bei bester Gesundheit vor.\n\n„Das ist ein Wunder!“, erklärt der [ROOT.Char.Custom('DefaultPriestTitle')] mit erhobenen Händen. „Die höchste Instanz ([ROOT.Char.GetFaith.HighGodName|U]) hat gesprochen! Dieser Mensch ist unschuldig!“\n\nVerdrossen knirsche ich mit den Zähnen, als die [ROOT.Char.Custom('DefaultPriestTitlePlural')] [prisoner.GetFirstNameNoTooltip] losbinden. Warum haben wir [imprisoner.Custom('DE_PRO_PER_S_3P_A')] gerade #EMP hier#! gelassen?!"
 religious_interaction.2102.pleasant: "Als ich durch das Wasser der Oase wate, in der [prisoner.GetTitledFirstName] angebunden wurde, finde ich [prisoner.Custom('DE_PRO_PER_S_3P_A')] nicht nur bei Bewusstsein, sondern #EMP grinsend#! vor.\n\n„Das ist ein Wunder!“, erklärt der [ROOT.Char.Custom('DefaultPriestTitle')] mit erhobenen Händen. „Die höchste Instanz ([ROOT.Char.GetFaith.HighGodName|U]) hat gesprochen! Dieser Mensch ist unschuldig!“\n\nVerdrossen knirsche ich mit den Zähnen, als die [ROOT.Char.Custom('DefaultPriestTitlePlural')] [prisoner.GetFirstNameNoTooltip] losbinden. Warum haben wir [prisoner.Custom('DE_PRO_PER_S_3P_A')] gerade #EMP hier#! gelassen?!"
 religious_interaction.2102.a: "Die höheren Mächte wollen es so."
 religious_interaction.2102.b: "Also mir scheint [prisoner.Custom('DE_PRO_PER_S_3P_N')] ziemlich tot …"
 religious_interaction.2102.b.tt: "[ROOT.Char.GetFaith.HighGodName|U] hat nicht #EMP immer#! recht!"
 religious_interaction.2102.b.success: "Eure Einmischung bleibt unbemerkt"
 religious_interaction.2102.b.failure: "Ihr werdet als Mörder bloßgestellt"
 #I have died...
 religious_interaction.2103.t: "Gepeinigt von der höchsten Instanz ([imprisoner.GetFaith.HighGodName|U])"
 religious_interaction.2103.end.desc: "\n\nWenn das der Wille der höheren Mächte ist, habe ich das ja vielleicht verdient. Vielleicht bin ich … böse."
 religious_interaction.2103.desc.pleasant: "Ich war so übermütig, so töricht. So lange unter freiem Himmel zu sein, würde jedem schwer zusetzen – das verstehe ich nun. Tagsüber brennt die Sonne, nachts heult der Wind und schleudert mich umher, und der Himmel bleibt schrecklich und gnadenlos wolkenfrei.\n\nWasser, Wasser. Es ist überall um mich herum, eingeschlossen in der Umarmung der Natur, doch es gibt keinen Tropfen, den ich trinken könnte. Mein Kopf hängt schlaff herunter."
 religious_interaction.2103.desc.waterlogged: "Obwohl der Wind mir zu schaffen macht und die Sonne auf meiner Haut brennt, erfrischt mich zumindest der stetige Regen, der so oft über diese Gegend zieht. Ich lächle zum Himmel hinauf, als ein weiterer Wolkenbruch beginnt.\n\nPlötzlich beginnt die Welt zu wanken. Zuerst unmerklich, dann schneller und schneller. Es dauert einige Augenblicke, bis ich merke, dass mein Pfahl aus dem Gleichgewicht geraten ist und nun unmittelbar in den Tümpel vor mir kippt!\n\nAls ich aufs Wasser pralle, versuche ich wie wild, mich zu befreien, doch es ist sinnlos. All meine Gliedmaßen sind gefesselt, und das Gewicht des Baumstamms drückt mich tiefer in den flachen Teich. Ich schreie, aber kein Ton entweicht meiner Kehle, und das Wasser strömt in meinen Mund, um die Leere zu füllen."
 religious_interaction.2103.desc.oasis: "Während ich meine Prüfung ableiste und die Sonne auf meiner Haut brennt, erfrischt mich zumindest das Wasser, das gegen meine Brust plätschert – ich wurde schließlich mitten in der Oase aufgehängt.\n\nPlötzlich beginnt die Welt zu wanken. Zuerst unmerklich, dann schneller und schneller. Es dauert einige Augenblicke, bis ich merke, dass der weiche Sand unter meinem Pfahl nachgibt und ich nach vorn in die Oase kippen werde!\n\nAls ich aufs Wasser pralle, versuche ich wie wild, mich zu befreien, doch es ist sinnlos. All meine Gliedmaßen sind gefesselt, und das Gewicht des Baumstamms drückt mich tiefer ins Wasser. Ich schreie, aber kein Ton entweicht meiner Kehle, und das Wasser strömt in meinen Mund, um die Leere zu füllen."
 religious_interaction.2103.a: "Ich … Ich bin so müde …"
 religious_interaction.2103.b: " #DIE1 Bl–#! #DIE2 blubb …#!"
 #They died!
 religious_interaction.2104.desc: "Am letzten Abend der Prüfung von [prisoner.GetTitledFirstName] rührt [prisoner.Custom('DE_PRO_PER_S_3P_N')] sich nicht, als wir uns [prisoner.Custom('DE_PRO_PER_S_3P_D')] nähern. Einer der Diener setzt [prisoner.Custom('DE_PRO_PER_S_3P_D')] eine Flasche an die Lippen, doch das Wasser rinnt [prisoner.Custom('DE_PRO_PER_S_3P_D')] nur das Kinn hinunter.\n\n„Die höchste Instanz ([ROOT.Char.GetFaith.HighGodName]) hat gesprochen!“, erklärt der [ROOT.Char.Custom('DefaultPriestTitle')] mit erhobenen Händen. „Dieser Mensch ist schuldig!“"
 religious_interaction.2104.desc.drowned: "Als wir uns der Stelle nähern, an der wir [prisoner.GetTitledFirstName] an einen Pfahl gebunden zurückgelassen haben, wird rasch klar, dass etwas nicht stimmt. [prisoner.Custom('DE_PRO_POS_S_3P')|U] Pfahl ist vermutlich nach vorn gekippt, geradewegs in den Tümpel, neben dem wir [prisoner.Custom('DE_PRO_PER_S_3P_A')] zurückgelassen hatten. Die Fesseln, die wir [prisoner.Custom('DE_PRO_PER_S_3P_D')] angelegt hatten, haben wohl gehalten, und durch das Gewicht des Baumstamms, das auf [prisoner.Custom('DE_PRO_PER_S_3P_D')] lastete, gab es kein Entrinnen.\n\n„Die höchste Instanz ([ROOT.Char.GetFaith.HighGodName]) hat gesprochen!“, verkündet der [ROOT.Char.Custom('DefaultPriestTitle')], die Hände zum Himmel erhoben. „Dieser Mensch ist schuldig!“"
 religious_interaction.2104.desc.oasisdrowned: "Als wir uns der Stelle nähern, an der wir [prisoner.GetTitledFirstName] an einen Pfahl gebunden zurückgelassen haben, wird rasch klar, dass etwas nicht stimmt. [prisoner.Custom('DE_PRO_POS_S_3P')|U] Pfahl ist vermutlich nach vorn gekippt, geradewegs in die Oase, in der wir [prisoner.Custom('DE_PRO_PER_S_3P_A')] zurückgelassen hatten. Die Fesseln, die wir [prisoner.Custom('DE_PRO_PER_S_3P_D')] angelegt hatten, haben wohl gehalten, und durch das Gewicht des Baumstamms, das auf [prisoner.Custom('DE_PRO_PER_S_3P_D')] lastete, gab es kein Entrinnen.\n\n„Die höchste Instanz ([ROOT.Char.GetFaith.HighGodName|U]) hat gesprochen!“, verkündet der [ROOT.Char.Custom('DefaultPriestTitle')], die Hände zum Himmel erhoben. „Dieser Mensch ist schuldig!“"
 religious_interaction.2104.b.drowned: "Nun, ich schätze, so kann man es auch sehen …"
 ##############################################
 ### Literalist Debate by Ewan Cowhig Croft ###
 ##############################################
 religious_interaction.2400.t: "Eine große Debatte"
 religious_interaction.2400.desc: "Der Page zittert vor Angst, als [recipient.Custom('DE_PRO_PER_S_3P_N')] mir den Brandbrief von [puppet_or_actor.GetTitledFirstName] vorliest: Ich werde zu einer öffentlichen Debatte über die Tugenden und Sünden unseres gemeinsamen Glaubens herausgefordert, und gleichzeitig wird infrage gestellt, ob ich dessen Grundsätze auch befolge.\n\nMein Diener scheut sich, weiter vorzulesen, da der Tonfall des Schreibens keinen Zweifel daran lässt, wie [puppet_or_actor.GetShortUINameNoTooltip] meine Frömmigkeit einschätzt."
 religious_interaction.2400.a: "Diese Kröte! Herausforderung angenommen!"
 religious_interaction.2400.a.tt_success: "Die öffentliche Debatte demütigt [puppet_or_actor.GetShortUINameNoTooltip]"
 religious_interaction.2400.a.tt_fail: "[puppet_or_actor.GetShortUINameNoTooltip|U] stellt erfolgreich meinen Glauben infrage"
 religious_interaction.2400.b: "Ich werde den Namen von [recipient.GetFaith.HighGodName] nicht mit dieser Farce besudeln."
 religious_interaction.2400.b.tt: "[puppet_or_actor.GetShortUINameNoTooltip|U] wird in Kenntnis gesetzt"
 religious_interaction.2400.b_turned_down: "[recipient.GetShortUIName|U] hat meine Herausforderung zu einer Debatte abgelehnt"
 religious_interaction.2400.b_turned_down_puppeteer: "[recipient.GetShortUIName|U] lehnte die Herausforderung von [puppet_or_actor.GetShortUIName] zu einer Debatte ab"
 used_literalist_debate_modifier: "Unlängst debattiert"
 used_literalist_debate_modifier_desc: "Dieser Charakter hat vor Kurzem eine Debatte über die Grundlagen seines Glaubens begonnen."
 literally_debated_modifier: "Unlängst debattiert"
 literally_debated_modifier_desc: "Dieser Charakter wurde vor Kurzem in eine Debatte über die Grundlagen seines Glaubens verwickelt."
 religious_interaction.2401.desc_intro: "Wir treffen uns in einer großen Halle in [debate_locale.GetNameNoTierNoTooltip], wo wir auf wackligen Tischen stehen, die kaum einen Meter voneinander entfernt sind, umgeben von einer Schar eifriger Zuschauer. Die Menge schweigt und wartet darauf, dass die Debatte beginnt.\n\n"
 religious_interaction.2401.desc_won: "Binnen einer Stunde rede ich [recipient.GetTitledFirstName] in Grund und Boden: Ich greife [recipient.Custom('DE_PRO_POS_S_3P')]e Frömmigkeit an, zweifle [recipient.Custom('DE_PRO_POS_S_3P')]em Verständnis von Tugend und stelle sogar infrage, ob die höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) [recipient.Custom('DE_PRO_PER_S_3P_A')] wirklich als treu ergeben erachten kann. Die Menge tobt und bewirft [recipient.GetTitledFirstNameNoTooltip] mit faulen Eiern und schimmelnden Kohlköpfen, bis [recipient.Custom('DE_PRO_PER_S_3P_N')] aus der Halle flieht."
 religious_interaction.2401.desc_lost: "Die verbale Attacke von [recipient.GetTitledFirstName] beginnt unverzüglich und lässt mir kaum Gelegenheit zu reagieren, und schon bald hat die Menge ihren Sieger erkoren.\n\nIch harre noch ein paar Minuten aus und stelle mich dem Hagel aus verfaultem Gemüse, trete dann aber doch den Rückzug an, als mir ein Mitglied der Bauernschaft ein lebendes Huhn an den Kopf wirft."
 religious_interaction.2401.a_won: "Liebt die höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) mich denn nicht mehr?"
 religious_interaction.2401.a_lost: "Diese Leute verstehen den Glauben ([puppet_or_actor.GetFaith.GetReligion.GetNameNoTooltip]) nicht!"
 religious_interaction.2402.desc_won: "Obwohl [puppet_or_actor.GetTitledFirstName] bei der Herausforderung noch so überheblich war, schmilzt [puppet_or_actor.Custom('DE_PRO_POS_S_3P')]e Selbstsicherheit vor meinem Ansturm vernichtender Worte und frommer Kritik dahin. Es dauert nicht lange, bis die Menge sich ebenfalls beteiligt, und mein[actor.Custom('DE_END_PRO_S_N')] Gegner[puppet_or_actor.Custom('DE_END_NOU_S_GS_N')] flieht unter einem Hagel aus faulem Gemüse und einem besonders angriffslustigen Gockel."
 religious_interaction.2402.desc_lost: "Obwohl ich mein Bestes gebe, wählte [puppet_or_actor.GetTitledFirstName] [puppet_or_actor.Custom('DE_PRO_POS_S_3P')]e Argumente eindeutig sehr gut und vorausschauend aus: Die Menge frisst [puppet_or_actor.Custom('DE_PRO_PER_S_3P_D')] beinahe sofort aus der Hand. [puppet_or_actor.Custom('DE_PRO_PER_S_3P_N')|U] tadelt mich dennoch mehr als eine Stunde lang und bezichtigt mich jeder nur vorstellbaren Sünde: [puppet_or_actor.Custom('DE_PRO_PER_S_3P_N')|U] legt sogar nahe, dass die höchste Macht ([recipient.GetFaith.HighGodName]) mich womöglich nicht als treu ergeben erachtet.\n\nIrgendwann ergreife ich die Flucht, verfolgt von einem Hagel aus faulem Gemüse, das die Menge auf mich wirft."
 religious_interaction.2403.desc: "[victim.GetTitledFirstName] hat keine Chance. Obwohl [victim.Custom('DE_PRO_PER_S_3P_N')] sich für gut vorbereitet hält, schlage ich [victim.Custom('DE_PRO_POS_S_3P')]e armseligen Argumente beiseite wie Fliegen. Bei jedem Gegenargument zuckt [victim.GetFirstNameNoTooltip] zusammen, als hätte ich ihn geschlagen. Mit der Zeit wird [victim.Custom('DE_PRO_PER_S_3P_N')] so unfähig, sich zu verteidigen, dass sogar die Menge schweigt.\n\n„… und deshalb“, sage ich und erhebe dramatisch meine Hand, um mit einem anschuldigenden Finger quer durch den Raum zu zeigen, „werdet Ihr niemals …“\nIch halte inne, als ich bemerke, wie [victim.GetFirstNameNoTooltip] nach Luft schnappt und sich"
 religious_interaction.2403.conclusion_either: "die Brust hält."
 religious_interaction.2403.conclusion_man: "den Arm hält."
 religious_interaction.2403.conclusion_woman: "den Bauch hält."
 religious_interaction.2403.a.low_compassion: "„Ihr wählt also den Ausweg des Feiglings.“"
 religious_interaction.2403.a.zealous: "„Offenbar haben die höheren Mächte einen Sieger auserkoren.“"
 religious_interaction.2403.a.stubborn: "„He, ich bin noch nicht fertig!“"
 religious_interaction.2403.a: "„Ist … Ist alles in Ordnung?“"
 religious_interaction.2403.a.tt: "[victim.GetShortUIName] erleidet einen Herzinfarkt und [Concept('character_death_dies', 'Stirbt')|E]"
 religious_interaction.2500.desc: "Endlich kommt Ihr zu Sinnen … Das muss ein Zeichen von [ROOT.Char.GetFaith.HighGodNameAlternate] sein! Der einzig wahre Glaube heißt Euch willkommen."
 religious_interaction.2500.toast_puppeteer: "[recipient.GetShortUIName|U] nahm das Angebot von [puppet_or_actor.GetShortUIName] an, sich im Krieg zu bekehren"
 religious_interaction.2500.a: "Gelobt seien die höchsten Mächte!"
 religious_interaction.2501.desc: "Das soll doch wohl ein Witz sein? Eure durchschaubaren Versuche einer politischen Flucht werden Euch den Zorn von [recipient.GetFaith.HighGodName] nicht ersparen!"
 religious_interaction.2501.toast_puppeteer: "[recipient.GetShortUIName|U] lehnte das Angebot von [puppet_or_actor.GetShortUIName] ab, sich im Krieg zu bekehren"
 #########################
 #Exaltation of Pain tenet
 #########################
 religious_interaction.2600.t: "Lektionen in Erlösung"
 religious_interaction.2600.desc.recipient: "[actor.GetTitledFirstName|U] nimmt sanft meine Hand und führt mich zu einem Sammelsurium scharfer und stumpfer Dinge, die wir bei unserer Sitzung verwenden werden. Eine der Klingen funkelt im Licht, und ich spüre ein Gefühl des Friedens über mich kommen.\n\nMit dem Werkzeug in der Hand bedeute ich [actor.Custom('DE_PRO_PER_S_3P_D')], sich umzudrehen. [actor.Custom('DE_PRO_PER_S_3P_N')|U] zieht [actor.Custom('DE_PRO_POS_S_3P')] Oberteil aus und legt die makellose Haut [actor.Custom('DE_PRO_POS_S_3P')]es Rückens frei. Ich mache mich an die Arbeit, und das sanfte Stöhnen und Grunzen wird bald zu einem tiefen Brummen in [actor.Custom('DE_PRO_POS_S_3P')]er Kehle.\n\nIch weiß schon, mit welchem Werkzeug ich meine eigene Erlösung genauestens abstimmen werde."
 religious_interaction.2600.desc.actor: "[recipient.GetTitledFirstName|U] wirft einen aufmerksamen Blick auf die Werkzeuge der Transzendenz und bebt schon leicht vor Vorfreude.\n\nIch packe [recipient.Custom('DE_PRO_POS_S_3P')] Handgelenk und gebe [actor.Custom('DE_PRO_PER_S_3P_D')] dann eine scharfe Klinge, um sie sogleich sanft an meine Brust zu pressen. „Mit Bedacht, ja? Und ruhiger Hand. Wir wandeln hier auf einem schmalen Grat.“\n\n[recipient.GetFirstNameNoTooltip|U] schaut mir in die Augen und nickt, ehe [actor.Custom('DE_PRO_PER_S_3P_N')] beginnt, das eigene Oberteil aufzuknöpfen und eine Stelle reinen, unvernarbten Fleischs freizulegen – bald wird es die Erlösung durch die höchste Macht ([recipient.GetFaith.HighGodName]) erfahren."
 religious_interaction.2600.a: "„Lasst uns transzendieren. Gemeinsam.“"
 religious_interaction.2610.desc: "Ich muss mich dieses Mal leider noch um einige wichtige Angelegenheiten kümmern … aber nächstes Mal werden wir um so eifriger dem Gottesdient nachgehen!"
 religious_interaction.2610.a: "Wie schade."
 religious_interaction.2620.t: "Schmerz gewähren"
 religious_interaction.2620.desc.actor: "[recipient.GetTitledFirstName|U] kniet vor mir, während ich die Peitsche erhebe. Schmerz ist Gnade, und durch [recipient.Custom('DE_PRO_POS_S_3P')] Leid gelange ich näher an die höchste Macht ([actor.GetFaith.HighGodName])."
 religious_interaction.2620.desc.recipient: "Ich knie vor [actor.GetTitledFirstName], als [actor.Custom('DE_PRO_PER_S_3P_N')] die Peitsche erhebt. Schmerz ist Gnade, und durch mein Leid gelangt [actor.Custom('DE_PRO_PER_S_3P_N')] näher an die höchste Macht ([actor.GetFaith.HighGodName])."
 religious_interaction.2620.a: "Lasst den Schmerz uns einander näherbringen."
