l_german:
 culture_notification.0010.t: "Tradition aufgegeben"
 culture_notification.0010.desc: "Die [this_player.GetCulture.GetName|l]e [culture|E] hat die [tradition|E] „[tradition.GetName]“ aufgegeben"
 culture_notification.0011.t: "Tradition gefördert"
 culture_notification.0011.desc: "Die [this_player.GetCulture.GetName|l]e [culture|E] hat die [tradition|E] „[tradition.GetName]“ angenommen"
 culture_notification.1001.t: "Mischkultur: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "[founder.GetTitledFirstName|U] hat die [parent_1.GetNameNoTooltip|l]e und die [parent_2.GetNameNoTooltip|l]e Kultur miteinander verbunden und damit die [new_culture.GetName|Vl]e [hybrid_culture|E] erschaffen"
 culture_notification.1011.t: "Die [new_culture.GetNameNoTooltip]e Mischkultur"
 culture_notification.1011.intro: "Jahre des Austauschs brachten zwei Völker ([parent_1.GetName] und [parent_2.GetName]) einander noch näher – so nah, dass sich etwas Neues entwickeln konnte: ein Volk, das sich selbst als [new_culture.GetName|l] bezeichnet.\n\n"
 culture_notification.1011.blend: "Die Verschmelzung ist offenkundig. Sie behalten die [parent_1.GetNameNoTooltip|l]e Tradition in Sachen [tradition_1.GetName] neben dem [parent_2.GetNameNoTooltip|l]en Brauch in Sachen [tradition_2.GetName] bei. Zusammen ergeben sie dieses neue Volk."
 culture_notification.1011.blend_fallback: "Kein Elternteil beansprucht für sich den größeren Anteil – das [new_culture.GetNameNoTooltip|U]e fügt beide Welten nahtlos zusammen."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "Aus der [parent_1.GetNameNoTooltip|l]en und der [parent_2.GetNameNoTooltip|l]en [culture|E] ist die [hybrid_culture|E] [new_culture.GetNameNoTooltip] entstanden."
 culture_notification.1101.t: "Zweigkultur: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName|U] hat [new_culture.GetName|V] erschaffen, eine [divergent_culture|E] von [parent_1.GetNameNoTooltip]"
 culture_notification.1111.t: "Die [new_culture.GetNameNoTooltip]e Zweigkultur"
 culture_notification.1111.intro: "Ein anderer Dialekt hier, ein neuer Brauch dort – auf den ersten Blick leicht zu übersehen. Doch nicht länger: Die [parent_1.GetCollectiveNoun] aus [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] bezeichnen sich selbst nun als [new_culture.GetName|U].\n\n"
 culture_notification.1111.tradition.new: "Die Traditionen ihrer Vorfahren weichen dem Neuen: [new_tradition.GetName|U]."
 culture_notification.1111.tradition.lost: "Sie wurden die Traditionen ([lost_tradition.GetName|U]) der [parent_1.GetCollectiveNounNoTooltip] los."
 culture_notification.1111.ethos.bellicose: "Von Feinden und Rivalen bedrängt wurden die [new_culture.GetCollectiveNounNoTooltip|U] [new_culture.GetEthos.GetName|l] und vertrauen ihr Geschick der Macht der Waffen an."
 culture_notification.1111.ethos.bureaucratic: "Die [new_culture.GetCollectiveNounNoTooltip] wurden [new_culture.GetEthos.GetName|l] und fanden Trost in langen Chartas und noch längeren Chroniken."
 culture_notification.1111.ethos.courtly: "Die [new_culture.GetCollectiveNounNoTooltip|U], die dem Benehmen und dem Zeremoniell ergeben sind, führen nun eine [new_culture.GetEthos.GetName|l]e Lebensweise."
 culture_notification.1111.ethos.communal: "Die [new_culture.GetCollectiveNounNoTooltip|U], durch Triumph und Tragödie miteinander verbunden, wurden [new_culture.GetEthos.GetName|l] und sind eng an ihre Nachbarn gebunden."
 culture_notification.1111.ethos.stoic: "In einer ebenso gefährlichen wie unvorhersagbaren Welt wurden die [new_culture.GetCollectiveNounNoTooltip] [new_culture.GetEthos.GetName|l] und stellen nun Durchhaltevermögen über alles."
 culture_notification.1111.ethos.spiritual: "Auf der Suche nach Antworten, die von innen kommen, wurden die [new_culture.GetCollectiveNounNoTooltip] ein [new_culture.GetEthos.GetName|l]es Volk, das sogar noch frommer als zuvor ist."
 culture_notification.1111.ethos.egalitatian: "Die Geburt zählt nun weniger als die Verdienste unter den [new_culture.GetCollectiveNounNoTooltip] – sie sind eine [new_culture.GetEthos.GetName|l]e Gesellschaft."
 culture_notification.1111.ethos.unchanged: "Ihre Lebenseinstellung ist unverändert, aber dennoch spalteten die Trennungen in Bezug auf Politik und Grenzen das Volk."
 culture_notification.1111.outro.other: "\n\nOb durch Gerissenheit oder Überzeugung: [founder.GetTitledFirstName|U] ist nun das Oberhaupt dieser kulturellen Erweckung."
 culture_notification.1111.outro.founder: "\n\nDie [new_culture.GetNameNoTooltip|l]en Menschen schauen nun auf mich. Unsere Zukunft beginnt hier."
 culture_notification.1111.a.other: "Wir werden sehen, wie sich die Lage entwickelt."
 culture_notification.1111.a.founder: "Auf in ein neues Zeitalter. Hin zu einer neuen Ära, hin zu einem neuen Volk!"
 culture_notification_tooltip: "Die [divergent_culture|E] [new_culture.GetName] hat sich aus der [parent_1.GetName|l]en [culture|E] entwickelt."
