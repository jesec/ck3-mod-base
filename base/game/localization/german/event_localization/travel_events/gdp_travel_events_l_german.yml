l_german:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ In einer Hitzewelle gefangen"
 gdp_travel_events.1000.desc: "Wie ein endloses Sandmeer erstrecken sich die Dünen von [ROOT.Char.GetCurrentLocation.GetName] bis jenseits des Horizonts. Die Hitze der Sonne zeichnet ein sich stetig veränderndes, hypnotisierendes Muster auf ihre Oberfläche. In Schweiß getränkt und ohne Schatten in Sicht halten wir, um zu rasten. Mein[entourage_member_one.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetFirstName] wendet sich mir mit weit aufgerissenen Augen zu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], fürchtet Euch nicht vor der Hitze. Letzte Nacht wurde ich von der höchsten Macht ([entourage_member_one.GetFaith.HighGodName]) gesegnet! Ich sah eine Oase nicht weit von hier.“"
 gdp_travel_events.1000.a: "Eigentlich sollte es so sein!"
 gdp_travel_events.1000.b: "Wir haben keine anderen Möglichkeiten mehr. Lasst es uns versuchen."
 gdp_travel_events.1000.b.success: "Gepriesen sei die höchste Macht ([entourage_member_one.GetFaith.HighGodName])! Die Oase gibt es wirklich"
 gdp_travel_events.1000.b.failure: "Es war nur eine Fata Morgana"
 gdp_travel_events.1000.c: "Ich werde keinen Visionen vertrauen."
 low_caravaneer_experience_reason_tooltip: "Erfordert #V 100#! [trait_level_track_xp|E] auf der Laufbahn $trait_track_caravaneer$ ([GetTrait('lifestyle_merchant').GetName(GetNullCharacter)])"
 gdp_travel_events.1010.t: "Verlorene Reisende"
 gdp_travel_events.1010.desc: "Ein Stück die Straße von der Ansiedlung ([ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')]) in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] hinunter macht sich unsere Karawane bereit, ihr Lager aufzuschlagen. Gerade als wir uns für den Abend zur Ruhe legen wollen, erklingt eine leise Stimme hinter uns.\n\n„Verzeiht, [ROOT.Char.Custom('FormOfAddressForLiege')]. Meine Familie und ich sind Reisende, die von unserer Karawane getrennt wurden. Wir können nicht viel anbieten, doch ich gäbe alles, wenn [Select_CString(traveler_child.IsFemale, 'meine', 'mein')] [traveler_child.Custom('GetDaughterSon')] heute Nacht sicher wäre.“"
 gdp_travel_events.1010.a: "Behaltet Euer Geld. Kommt mit uns."
 gdp_travel_events.1010.b: "Wir können Euch Schutz bieten … gegen eine kleine Gebühr."
 gdp_travel_events.1010.c: "#EMP Alles#!, sagt Ihr …"
 gdp_travel_events.1010.d: "Wir haben genügend Mäuler zu stopfen."
 gdp_travel_events.1020.t: "Wissenshäppchen auf der Straße"
 gdp_travel_events.1020.desc.intro: "Die Reisestrecke seit [journey_start.GetName] spüre ich schmerzlich in meinem Hintern, als mein [ROOT.Char.Custom('GetDonkeyDromedary')] durch die Landschaft ([ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]) trottet. Von all dem scheinbar unberührt reitet mein[associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] aufgeregt an meine Seite, um mir etwas mitzuteilen.\n\n"
 gdp_travel_events.1020.desc.caravaneer: "„Eine kurze Geschichte, [ROOT.Char.Custom('FormOfAddressForLiege')]. Kürzlich sprach ich mit einem Karawanenmeister aus [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]. Er erzählte mir von dieser herausragenden Navigationsvorrichtung …“"
 gdp_travel_events.1020.desc.artisan: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], wusstet Ihr, dass man aus dieser einen Blume ([ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]) ein ganz wunderbares Tuchfärbemittel herstellen kann? Wenn Ihr die Blütenblätter nehmt und sie zerstoßt …“"
 gdp_travel_events.1020.desc.creditor: "„Witziges Wissen, [ROOT.Char.Custom('FormOfAddressForLiege')]: An manchen Orten ist Plündern #EMP unter Umständen#! erlaubt, wenn das Opfer bei einem Schulden hat. Das erinnert mich an damals, als meine Vettern und ich …“"
 gdp_travel_events.1020.desc.war_profiteer: "„Interessantes Wissenshäppchen für Euch, [ROOT.Char.Custom('FormOfAddressForLiege')]: Auf diesem Gebiet ([ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]) fand einst eine große Schlacht statt. Hier fiel ein legendärer Schwertkämpfer, und man sagt, er metzelte seine Feinde wie eine Bestie ([ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]) nieder …“"
 gdp_travel_events.1020.a: "Faszinierend. Bitte erzählt mir mehr."
 gdp_travel_events.1020.b: "Lasst uns stattdessen hierüber sprechen: [ROOT.Char.Custom('my_subject_of_interest')]."
 gdp_travel_events.1020.c: "Ich ziehe es vor, schweigend zu reiten."
 gdp_travel_events.1020.b.success: "Ihr wechselt das Thema"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip|U] hat kein Interesse daran, Euch anzuhören"
 gdp_travel_events.1030.t: "Bösartiges Getuschel"
 gdp_travel_events.1030.desc: "Mein[ambitious_associate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))] [ambitious_associate.GetFirstName] huscht zu mir und blickt sich nach Zuschauern um. [ambitious_associate.Custom('DE_PRO_PER_S_3P_N')|U] rückt näher und flüstert:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], ich hörte ein paar besorgniserregende Dinge über [Select_CString(current_partner.IsFemale, 'Eure Partnerin', 'Euren Partner')] [current_partner.GetFirstName]. Es heißt in der Gesellschaft, [current_partner.Custom('DE_PRO_PER_S_3P_N')] habe ein Geheimnis (#EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')|U]#!). Wenn das wahr ist, müssen wir [current_partner.Custom('DE_PRO_PER_S_3P_A')] zur Rechenschaft ziehen!\n\n… Und vielleicht wäre auch eine Belohnung für die Person angemessen, die Euch diese schlimme Kunde überbrachte?“"
 gdp_travel_events.1030.a: "Ich muss die Wahrheit wissen!"
 gdp_travel_events.1030.a.unity_loss.desc: "Die wahre Natur Eures Partners wird herausgefunden"
 gdp_travel_events.1030.b: "Ich will nicht spekulieren."
 gdp_travel_events.1030.b.unity_gain.desc: "Ihr weigertet Euch, auf Gerüchte über Euren Partner hereinzufallen"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ Ungepflegter Brunnen"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName|U] blickt in einen alten Brunnen und rümpft die Nase.\n\nDer Brunnen ist schon lange nicht mehr gepflegt worden. Die Steine sind überwuchert, der Eimer halb vergammelt und das Wasser hat einen abschreckend fauligen Geruch.\n\nLeider sind unsere Wasserschläuche schon schlaff und fast leer – und der Durst wird nahezu unerträglich."
 gdp_travel_events.1040.a: "Etwas Dreck schadet einem Menschen wie mir nicht!"
 gdp_travel_events.1040.b: "Ich weiß, wie man das Wasser reinigen kann."
 gdp_travel_events.1040.c: "Wir müssen das Wasser, was wir noch haben, rationieren."
 gdp_travel_events.1040.d: "Das wird eine lange, durstige Strecke werden."
 gdp_travel_events.1040.e: "Vielleicht nur einen winzigen Schluck …"
 gdp_travel_events.1040.e.critical_failure.tt: "Eure Erkrankung verschlimmert sich."
 gdp_travel_events.1040.e.success: "Das Wasser ist trinkbar."
 gdp_travel_events.1040.e.success.desc: "Ihr trinkt aus dem Brunnen und fühlt Euch erfrischt."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ Umgestürztes Holz"
 gdp_travel_events.1050.desc: "Ein Sturm fegte über die Landschaft ([ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]) in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] hinweg und entwurzelte Bäume, die nun überall auf der Straße liegen. Einheimische Arbeiter räumen die Schäden auf, doch es wird noch einige Zeit vergehen, bis wir weiterziehen können.\n\nDas Gebiet ([ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]) um die Sperrung herum ist zwar passierbar, doch heftig geneigte Bäume machen dies zu einem gefährlichen Umweg."
 gdp_travel_events.1050.x: "Mein Ross [ROOT.Char.Custom('WarhorseStoryName')] wird den Unrat beiseiteziehen!"
 gdp_travel_events.1050.a: "Dann kann ich genauso gut anpacken."
 gdp_travel_events.1050.b: "Wir könnten von ihren Methoden lernen."
 gdp_travel_events.1050.c: "Lasst uns einen Weg um die Sperrung herum finden."
 gdp_travel_events.1050.d: "Wir warten, bis die Arbeiter fertig sind."
 gdp_travel_events.1050.c.success: "Ihr findet einen Weg um die entwurzelten Bäume herum."
 gdp_travel_events.1050.c.failure: "Ihr verletzt Euch in der Wildnis."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ Ratten im Frachtraum"
 gdp_travel_events.1060.desc: "Der Frachtraum des Schiffes ist voller Ratten, die sich an unseren Vorräten gütlich tun. Einige sagen, die schlechte Verstauung sei schuld – lose Deckel und alte Säcke. Andere meinen, es sei die unfassbare Größe des Schwarms.\n\nWas auch immer der Grund ist: Wir verlieren diese Schlacht zusehends und müssen handeln, bevor die dreckigen Ratten alles auffressen, was wir haben und uns ohne einen Krümel zurücklassen."
 gdp_travel_events.1060.x: "Lasst meine Katze [ROOT.Char.Custom('CatStoryName')] sich dessen annehmen."
 gdp_travel_events.1060.a: "„Bringt mir eine Harpune und ein gutes Netz!“"
 gdp_travel_events.1060.b: "Ich löse das mit der Verstauung selbst!"
 gdp_travel_events.1060.c: "Setzt Kurs auf einen Hafen und nehmt Vorräte auf."
 gdp_travel_events.1060.d: "Jeder muss Ratten fangen!"
 gdp_travel_events.1060.b.tt: "Ihr müsst mindestens #V 25#! [expertise|E] in Sachen [GetTradeGoodCategory('trade_category_cereals').GetName] haben"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ Zielscheibe auf unserem Rücken"
 gdp_travel_events.1070.desc: "Erst ist Staub am Horizont zu sehen, und dann entdecken wir eine Bande von Dieben, die ihre Pferde über einen Schuttkamm führt.\n\n„Halt!“, ruft mir ihr Anführer zu. „Geht mir friedlich Euer getauschtes Gold, [ROOT.Char.GetTitleAsNameNoTooltip], und niemand wird verletzt.“"
 gdp_travel_events.1070.a: "„Ich reise unter dem Schutz von [ROOT.Char.GetSuzerain.GetShortUIName], Ihr Hunde!“"
 gdp_travel_events.1070.a.success: "Der Name Eures Gönners gewährt Euch freies Geleit"
 gdp_travel_events.1070.b: "„Ihr werdet es uns abnehmen müssen!“"
 gdp_travel_events.1070.b.success: "Ihr vertreibt die Räuber"
 gdp_travel_events.1070.b.failure: "Die Räuber nehmen Euer Gold"
 gdp_travel_events.1070.c: "„Was auch immer nötig ist, damit wir passieren können.“"
 gdp_travel_events.2000.t: "Der geneigte Turm"
 gdp_travel_events.2000.desc: "Liegt es an … meinen Augen? Stehen meine Füße nicht so fest, wie es sich anfühlt? Nein, meine Sinne täuschen mich nicht, trotz der Unwirklichkeit des Anblicks vor mir. #EMP Der große [GetBuildingType('tower_of_pisa').GetNameNoTooltip] neigt sich#!!\n\n„Der Boden hier ist ungefähr so fest wie geronnene Milch, [ROOT.Char.Custom('FormOfAddressForLiege')]“, sagt [mason.GetFirstName], der Meistersteinmetz, neben mir. „Er begann, sich zu bewegen, als wir kaum ein Viertel gebaut hatten, doch wir konnten ihn zu Ende bauen.\n\nPrächtig, nicht wahr?“"
 gdp_travel_events.2000.a: "Vielleicht wird seine #EMP Besonderheit#! wenigstens Reisende anziehen …?"
 gdp_travel_events.2000.b: "Ihr seid entweder ein Genie oder verrückt. Ihr seid angeheuert!"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip],"
 gdp_travel_events.2002.desc: "unsere Steinmetze freuen sich, mitteilen zu können, dass der stattliche [GetBuildingType('tower_of_pisa').GetNameNoTooltip] endlich fertig ist.\n\nAllerdings muss ich auch berichten, dass ich ungewöhnliche Nachrichten aus Pisa hörte, von Reisenden, die von einem Bauwerk sprachen, das #EMP sehr#! anders ist als alles, was sie je zuvor gesehen haben. Ich fürchte, irgendetwas stimmt mit seiner Konstruktion nicht."
 gdp_travel_events.2002.a: "Lasst mich ihre Arbeit mit eigenen Augen beurteilen."
 gdp_travel_events.2002.b: "So lange es aufrecht stehen bleibt, ist es mir einerlei."
