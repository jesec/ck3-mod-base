l_german:
 influence_house_ambition_ongoing.1001.tt: "Ein mitfühlendes Ohr"
 influence_house_ambition_ongoing.1001.desc: "Wenn ich in der Gesellschaft von [target.GetFirstName] ein mitfühlendes Ohr finden könnte, würde dies vielleicht dabei helfen, [target.Custom('DE_PRO_POS_S_3P')]e Meinung zu ändern und [target.Custom('DE_PRO_PER_S_3P_A')] die Dinge so sehen lassen, wie ich sie sehe.\n\nIch wähle lieber eine Person aus, mit der es sich angenehm unterhalten lässt und die gut reden kann. Es würde außerdem nicht schaden, wenn sie lieblich anzusehen wäre.\n\nNachdem ich mich diskret nach den Höflingen von [target.GetFirstName] erkundigte, fand ich zwei Kandidaten: [target_associate_01.GetFirstName] und [target_associate_02.GetFirstName]."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip|U] ist eine gute Wahl."
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip|U] könnte zu [target_associate_02.Custom('DE_PRO_POS_S_3P')][Select_CString(target.IsFemale, 'er Meisterin', 'em Meister')] durchdringen."
 influence_house_ambition_ongoing.1001.c: "Nein. Meine Worte sind ausreichend."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip|U] bringt in Eurem Namen ein überzeugendes Argument vor"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip|U] scheitert daran, ein gutes Argument zum Ausdruck zu bringen"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip|U] bringt in Eurem Namen ein überzeugendes Argument vor"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip] scheitert daran, ein gutes Argument zum Ausdruck zu bringen"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "Will Geld im Gegenzug für Hilfe"
 influence_house_ambition_ongoing.1001.cooltip.relation: "Will nichts im Gegenzug haben"
 influence_house_ambition_ongoing.1001.cooltip.lewd: "Schlagt eine „alternative“ Belohnung vor"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "Will einen Gefallen im Gegenzug"
 influence_house_ambition_ongoing.1002.tt: "Strenge Verhandlungen"
 influence_house_ambition_ongoing.1002.desc: "Ich beginne, mich zu fragen, ob [target.GetFirstName] mich überhaupt ernst nimmt. Alles, was ich höre, sind vage Versprechungen, Verzögerungen und endlose schwadronierende Debatten.\n\nEs wird Zeit, dass ich meinen Unmut kundtue. Nicht unverhohlen vielleicht, sondern so, dass [target.GetFirstName] versteht, dass es Folgen hat, wenn man mich als [ROOT.Char.GetTitleAsNameNoTooltip] meiner Größenordnung verärgert!"
 influence_house_ambition_ongoing.1002.a: "Sabotiert [target.Custom('DE_PRO_POS_S_3P')]e Geschäftsinteressen."
 influence_house_ambition_ongoing.1002.b: "Lasst Schläger [target.Custom('DE_PRO_POS_S_3P')]en Höfling überfallen und verprügeln."
 influence_house_ambition_ongoing.1002.c: "Steckt [target.Custom('DE_PRO_POS_S_3P')] Haus in Brand."
 influence_house_ambition_ongoing.1002.d: "Ich werde [target.Custom('DE_PRO_PER_S_3P_A')] das Fürchten lehren!"
 influence_house_ambition_ongoing.1002.e: "Ich werde noch etwas länger geduldig sein."
