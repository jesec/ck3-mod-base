l_german:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "[target.GetAdherentNameNoTooltip] gefunden!"
 study_faith_outcome.0010.desc: "Meine diskreten Nachfragen und kleinen Bestechungen haben sich ausgezahlt! Nun steht [study_faith_target.GetShortUIName] vor mir – angeblich als [target.GetAdherentName].\n\n"
 study_faith_outcome.0010.desc.in_realm: "Es ist noch nicht lange her, als ich darum bat, ein [target.GetAdherentName] aus meinem Reich möge sich mit mir treffen. Nun ist [study_faith_target.GetShortUIName] dem Ruf gefolgt und steht vor mir.\n\n"
 study_faith_outcome.0010.d.intimidated: "„Was wünscht Ihr von mir, mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.GetTitleAsName]?“, fragt [study_faith_target.Custom('DE_PRO_PER_S_3P_N')] zitternd. Die Wachen starren [study_faith_target.Custom('DE_PRO_PER_S_3P_A')] misstrauisch an und sind bereit, beim ersten Anzeichen von Hexerei einzugreifen."
 study_faith_outcome.0010.d.safe: "„Wie kann ich Euch zu Diensten sein, mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.GetTitleAsName]?“, fragt [study_faith_target.Custom('DE_PRO_PER_S_3P_N')] leicht eingeschüchtert. Meine Wachen können nicht anders, als [study_faith_target.Custom('DE_PRO_PER_S_3P_A')] neugierig anzuschauen, kennen sie doch die Gerüchte über meine Suche."
 study_faith_outcome.0010.a: "Lasst mich [target.GetNameNoTooltip] durch Euch studieren."
 study_faith_outcome.0010.b: "Ich habe meine Meinung geändert."
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName|U] wird hinausgeleitet, um [study_faith_target.Custom('DE_PRO_POS_S_3P')] Leben so zu leben, wie [study_faith_target.Custom('DE_PRO_PER_S_3P_N')] es wünscht"
 study_faith_outcome.0101.t: "Vertraut mit der höchsten Macht ([actor.GetFaith.HighGodName])"
 study_faith_outcome.0101.desc: "Mühsame Studien zum [actor.GetRite.GetName] brachten mich dazu, dass mein[actor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName] nun besser für mich zu verstehen ist und dass ich darüber hinaus den Weg der höchsten Macht ([actor.GetFaith.GoodGodNames]) beschreite."
 study_faith_outcome.0101.a: "Es ist an der Zeit, die Bekehrung zu vollziehen."
 study_faith_outcome.0101.b: "Ich kann die guten Mächte ([ROOT.Char.GetFaith.GoodGodNames]) nicht aufgeben!"
 study_faith_outcome.0102.desc: "Ich danke Euch für Eure Geduld und Eure Großzügigkeit, mich durch meine Unwissenheit zu führen. Nun kann ich den Weg der guten Mächte ([actor.GetFaith.GoodGodNames]) beschreiten."
 study_faith_outcome.0102.a: "Es war richtig, dass ich das getan habe."
 study_faith_outcome.0103.desc: "Meine Treue gilt den guten Mächten ([recipient.GetFaith.GoodGodNames])! Ich werde mich nicht zwingen lassen, dem [recipient.GetRite.GetName] zu entsagen."
 study_faith_outcome.0103.a: "Es gibt einen Preis für Ungehorsamkeit …"
 study_faith_outcome.0111.t: "Schwierigkeiten beim Erfassen des [actor.GetRite.GetNameNoTooltip]"
 study_faith_outcome.0111.desc: "Mühsame Studien zum [actor.GetRite.GetName] brachten mich nicht weiter! Es fällt mir nicht nur schwer, den Weg der guten Mächte ([actor.GetFaith.GoodGodNames]) zu beschreiten, sondern ich fürchte, dass jene Überzeugungen, die mein[actor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] hegt, falsch sein könnten."
 study_faith_outcome.0111.a: "Vielleicht kommt das Verständnis mit der Bekehrung …"
 study_faith_outcome.0111.b: "Ich werde meine Bemühungen verdoppeln"
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$: Ein Durchbruch"
 study_faith_outcome.1000.desc: "Nach all der harten Arbeit ergibt schließlich alles Sinn. Endlose Stunden über den Büchern, schlaflose Nächte, in denen ich die Rituale übte, unzählige Lektionen in [target.GetFaith.GetAdjective|l]er Theologie – zusammen verschmelzen sie endlich zu einem klaren Verständnis des [target.GetRite.GetAdjective|l]en Ritus.\n\nWährend dieser Zeit versuchte ich, [target.GetTitledFirstName] nachzueifern. Doch nun glaube ich zu verstehen, wie [target.Custom('DE_PRO_PER_S_3P_N')] sich in der „warmen Umarmung“ des [target.GetRite.GetName] so wohlfühlen konnte."
 study_faith_outcome.1000.a: "Ich kann so ziemlich jeden Glauben erlernen!"
 study_faith_outcome.1000.b: "Mir erscheint dieser [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip] sinnvoller als mein eigener …"
 study_faith_outcome.1200.t: "$study_faith$: Ein Grundsatz tritt klar hervor"
 study_faith_outcome.1200.desc: "Die vertrauten Wände meines Studierzimmers sind Zeugen eines leisen Sieges, als ich den [target.GetRite.GetAdjective|l]en Wert des Grundsatzes namens [discovered_tenet.GetName(target.GetRite)] nachvollziehe. Auch wenn es seltsam erscheinen mag, kann ich mir mit etwas Einbildungskraft vorstellen, wie sich [target.GetTitledFirstName] und [target.Custom('DE_PRO_POS_S_3P')]e Verwandten dieser fremdartigen Praxis hingeben.\n\nEs ist nur ein Schritt auf einem langen Weg – doch meine Reise durch den [target.GetRite.GetNameNoTooltip|l]en Ritus kommt dennoch Stück um Stück voran."
 study_faith_outcome.1200.a: "Ich möchte unbedingt mehr über diese [target.GetRite.GetAdjectiveNoTooltip|l]en Praktiken erfahren!"
 study_faith_outcome.1200.b: "Faszinierend. Ich frage mich, in welchem Zusammenhang dies mit anderen Inhalten ([additional_discovered_doctrine.GetDescriptiveNameNoTooltip(target.GetFaith)]) steht!"
 study_faith_outcome.1200.c: "Das alles gibt mir ein ungutes Gefühl …"
 study_faith_outcome.1400.t: "$study_faith$: Bräuche des [target.GetRite.GetNameNoTooltip]"
 study_faith_outcome.1400.desc: "Um den [target.GetRite.GetName] zu verstehen, muss man nicht nur seinen metaphysischen Rahmen studieren, sondern auch seinen alltäglichen Einfluss auf das Leben.\n\nNachdem ich lange über ein bestimmtes Konzept ([discovered_doctrine.GetDescriptiveName(scheme.GetOwner.GetFaith.Self)]) nachdachte, habe ich dessen Implikationen nun ausreichend erfasst, um es mit den Praktiken des [target.GetRite.GetNameNoTooltip] als Ganzes in Verbindung zu bringen."
 study_faith_outcome.1400.alt1.desc: "\n\nDies machte mir wiederum die Feinheiten in ihrer Ausübung in Sachen „[third_discovered_doctrine.GetDescriptiveName(scheme.GetOwner.GetFaith.Self)]“ deutlich!"
 study_faith_outcome.1400.alt2.desc: "\n\nEs ist nur ein Teil eines größeren Mosaiks, doch jedes Steinchen bringt mich dem Verständnis des [target.GetRite.GetNameNoTooltip] als Ganzem ein wenig näher."
 study_faith_outcome.1400.a: "Nützliches Wissen. Und weiter geht es voran."
 study_faith_outcome.1400.b: "Ich mache die Nacht zum Tag."
 study_faith_outcome.1400.c: "Lasst mich versuchen, aus [target.GetShortUINameNoTooltip] noch mehr herauszuholen."
 study_faith_outcome.1500.t: "$study_faith$: Außerhalb meiner Reichweite"
 study_faith_outcome.1500.desc: "Lange Studien brachten mich so weit, wie man es als Außenstehender vermag. Welche Geheimnisse auch immer noch im [target.GetRite.GetName] verborgen liegen, verbleiben bei jenen, die mit ihm aufgewachsen sind – ausschließlich weitergereicht an die eigenen Eingeweihten und jedem Text, jeder Beobachtung und sogar dem geduldigsten Lehrer entzogen.\n\nWas ich wissen kann, das weiß ich nun."
 study_faith_outcome.1500.a: "Ich lernte, was ich lernen konnte."
 study_faith_outcome.1500.toast: "$study_faith$: Abgeschlossen"
 study_faith_outcome.1500.toast.desc: "Ihr habt jeden [core_tenet|E] und jede [doctrine|E] des [target.GetRite.GetName] erlernt, die man als Außenstehender erlernen kann."
 study_faith_scheme_stays_active: "Das [scheme|E] bleibt aktiv"
 study_faith_outcome.3000.t: "$study_faith$: Studium wiederaufnehmen?"
 study_faith_outcome.3000.desc: "Leider ist [target.GetTitledFirstName] nicht mehr da. Dies ist sehr bedauerlich, denn ich hatte mir [target.Custom('DE_PRO_PER_S_3P_A')] zum Vorbild genommen, um mehr über die Feinheiten in Sachen [target.GetFaith.GetName] zu erfahren.\n\nDies bedeutet nicht, dass ich mein Studium abbrechen muss: Ich muss nur jemand anderen finden, dem ich nacheifern kann!"
 study_faith_outcome.3000.alt1.desc: "Leider war [target.GetTitledFirstName] nicht die beste Wahl, um mir bei den Feinheiten des [target.GetFaith.GetAdjective|l]en Glaubens beratend zur Seite zu stehen.\n\nDies bedeutet nicht, dass ich mein Studium abbrechen muss: Ich muss nur jemand anderen finden, dem ich nacheifern kann!"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] ist leidenschaftlich in [Select_CString(potential_continuation_target_1.IsFemale, 'ihrer', 'seiner')] Verehrung!"
 study_faith_outcome.3000.b: "Vielleicht [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? [potential_continuation_target_2.Custom('DE_PRO_POS_S_3P')|U]e Theologie klingt spannend."
 study_faith_outcome.3000.c: "Vielleicht [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d: "Ah, ich hatte sowieso nach einem Grund gesucht, mit dem Lernen aufzuhören! Hurra!"
 study_faith_scheme_retains_progress: "Das [scheme|E] behält alle bisherigen Fortschritte"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U] studiert einen Ritus!"
 child_studied_faith_desc: "Euer Nachwuchs lernt mehr über den [target.GetRite.GetName]"
 child_studied_faith_invalidated_title: "Das Ritusstudium-Komplott Eures Kindes ist hinfällig"
 child_studied_faith_invalidated_desc: "Das [GetScheme('study_faith').GetTypeName]-[scheme|E] Eures Kinds wurde ungültig"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$: Die Leichtigkeit der Jugend"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: Die Leichtigkeit der Erfahrung"
 study_faith_ongoing.1000.desc.young: "Mein Studium des [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Glaubens macht ausgezeichnete Fortschritte. Ich fühle mich, als hätte ich sämtliche Konzentration und Tatkraft der Welt!"
 study_faith_ongoing.1000.desc.theologian: "Mein Studium des [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Glaubens schreitet gut voran. Es zeigt sich, dass sich sein Rahmen nicht allzu sehr von dem anderer Glaubensrichtungen unterscheidet."
 study_faith_ongoing.1000.desc: "\n\n„#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!“\n\nAuch wenn ich hier vielleicht etwas umschreibe, habe ich dennoch das Gefühl, dass der Kern des Glaubens klar ist, während ich noch an den Einzelheiten des Wortlauts feile.\n\nWenn ich diesen strengen Fokus beibehalte, kenne ich bald alle Geheimnisse des [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Glaubens!"
 study_faith_ongoing.1000.a: "Ich werde dem Studium meine #EMP ganze#! Zeit widmen!"
 study_faith_ongoing.1000.b: "Ich würde meine Zeit lieber anderswo verbringen …"
 study_faith_ongoing.1010.t: "$study_faith$: Ein vertrautes Verständnis"
 study_faith_ongoing.1010.desc: "#EMP „[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]“#!\n\nIch spüre eine Präsenz und schaue von der Analyse der [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Schriftstelle auf. [lover_target.GetFirstName|U] beugt sich mit lüsternem Blick über mich.\n\n„Bezieht sich dieser Text auf den [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Glauben?“, fragt [lover_target.Custom('DE_PRO_PER_S_3P_N')].\n\n„Wie wunderbar, jemand Mitgläubiges am Hof zu haben – und noch dazu jemanden, der [ROOT.Char.GetTitleTierName] ist! Vielleicht könnte ich Euch mit meinem etwas … vertrauteren Verständnis behilflich sein?“"
 study_faith_ongoing.1010.a: "Ziehen wir uns in meine Gemächer zurück, damit wir ungestört sind."
 study_faith_ongoing.1010.b: "Ich beobachte Euch [lover_target.Custom('GetDerogatoryNonbeliever')] nur, mehr nicht!"
 study_faith_ongoing.1010.c: "Verschwindet, [lover_target.Custom2('InsultNounSexual', ROOT.Char)|U]. Ich muss meine Sinne beisammenhalten!"
 study_faith_ongoing.1010.c.tt: "#EMP Ihr schlagt [lover_target.Custom('DE_PRO_PER_S_3P_D')] die Tür vor der Nase zu und widmet Euch wieder Eurem Studium.#!"
 study_faith_ongoing.1011.t: "$study_faith$: Eine falsche Fährte"
 study_faith_ongoing.1011.desc: "Ich hatte schon seit einiger Zeit einen Verdacht. Nach einigen mit Fallstricken gespickten Fragen wird die Lüge von [scheme.GetTargetCharacter.GetTitledFirstName] schließlich entlarvt. Ungeachtet dessen, was [scheme.GetTargetCharacter.Custom('DE_PRO_PER_S_3P_N')] behauptet, ist [scheme.GetTargetCharacter.Custom('DE_PRO_POS_S_3P')] [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]er Glaube nicht echt!\n\nZwar ist das Schauspiel eines jeden Ungläubigen an sich spannend, doch um mein Verständnis vom [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Glauben sinnvoll voranzubringen, ist es vielleicht am besten, wenn ich einen gläubigeren Anhänger finde …"
 study_faith_ongoing.1011.a: "Ich kann mich nicht länger auf [scheme.GetTargetCharacter.GetShortUINameNoTooltip] verlassen."
 study_faith_ongoing.1011.b: "Wenn [scheme.GetTargetCharacter.Custom('DE_PRO_PER_S_3P_N')] es so gut verbergen konnte, kann ich das vielleicht auch …"
 study_faith_ongoing.1011.c: "Nun, woran #EMP glaubt#! [scheme.GetTargetCharacter.GetShortUINameNoTooltip] denn dann?"
 study_faith_ongoing.1011.c.tt: "Ich werde versuchen, [scheme.GetTargetCharacter.Custom('DE_PRO_POS_S_3P')]em geheimen Glauben auf die Schliche zu kommen."
 study_faith_ongoing.1012.t: "$study_faith$: Praktizierender alter Riten"
 study_faith_ongoing.1012.desc: "Meine Versuche, den Glauben von [scheme.GetTargetCharacter.GetTitledFirstName] zu untersuchen, waren erfolgreich, wenn auch auf unerwartete Weise. Zwar hängt [scheme.GetTargetCharacter.Custom('DE_PRO_PER_S_3P_N')] zweifellos nicht dem [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Glauben an, doch [scheme.GetTargetCharacter.Custom('DE_PRO_PER_S_3P_N')] scheint seltsamen, vergessenen Riten ([actual_faith.GetName]) zu folgen. Diese Praktiken ähneln in gewisser Weise … der Hexerei.\n\nDiese Entdeckung erschüttert mich zutiefst. Gibt es eine Möglichkeit, wie ich sie mir zunutze machen kann?"
 study_faith_ongoing.1012.a: "Nun, das ist dennoch #EMP spannend#! zu wissen."
 study_faith_ongoing.1012.b: "Ich werde einen neuen Lehrer für mein Studium brauchen."
 study_faith_ongoing.1012.b.tt: "Ihr werdet versuchen, einen ähnlichen Lehrer zu finden, um das Studium des [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Glaubens fortzusetzen"
 study_faith_ongoing.1012.c: "Das klingt tatsächlich viel überzeugender als der [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]e Glaube!"
 study_faith_ongoing.1012.c.tt: "Ihr beginnt nun mit dem Studium des [actual_faith.GetAdjectiveNoTooltip|l]en Glaubens"
 study_faith_ongoing.1013.t: "$study_faith$: Mehr Mime als Mystiker"
 study_faith_ongoing.1013.desc: "Meine Versuche, den Glauben von [scheme.GetTargetCharacter.GetTitledFirstName] zu ergründen, sind gescheitert. Hinter [scheme.GetTargetCharacter.Custom('DE_PRO_POS_S_3P')]er frommen Fassade scheint die Weltanschauung völlig frei von jeglicher theologischer Grundlage zu sein.\n\nVielleicht folgt [scheme.GetTargetCharacter.Custom('DE_PRO_PER_S_3P_N')] den Grundsätzen dieses Glaubens ([scheme.GetTargetCharacter.GetFaith.GetName]) lediglich aus Bequemlichkeit, um Einfluss zu gewinnen oder aus Sicherheitsgründen?\n\nWas auch immer die Gründe sein mögen: Es ist klar, dass diese Person nicht an den Überzeugungen interessiert ist, die sie vertritt."
 study_faith_ongoing.1013.a: "Das ist reine Zeitverschwendung! Ich habe genug vom [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Glauben."
 study_faith_ongoing.1020.t: "$study_faith$: Ortsansässiger Gläubiger"
 study_faith_ongoing.1020.desc: "Es scheint, als hätte [faith_helper.GetTitledFirstName] von meinen Studien zur [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Praxis gehört. [faith_helper.Custom('DE_PRO_PER_S_3P_N')|U] ist [Select_CString(faith_helper.IsFemale, 'eine örtliche Praktizierende', 'ein örtlicher Praktizierender')] und bietet mir [faith_helper.Custom('DE_PRO_POS_S_3P')]e Unterstützung bei meinen Studien an.\n\n„Ich bitte um nicht mehr als ein Zeichen der Wertschätzung für meine Bemühungen, [ROOT.Char.Custom('FormOfAddressForLiege')]“, sagt [faith_helper.Custom('DE_PRO_PER_S_3P_N')] [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "Wenn Ihr mir dabei helft, wird dieses Gold Euch gehören."
 study_faith_ongoing.1020.b: "Ein Gefallen für einen Gefallen?"
 study_faith_ongoing.1020.c: "Ihr seid #EMP so selbstlos#!, mir anzubieten, ohne Gegenleistung dabei zu helfen!"
 study_faith_ongoing.1020.d: "Danke, aber ich komme auch allein zurecht."
 study_faith_ongoing.1020.c.success: "Ihr überredet [faith_helper.GetFirstNameNoTooltip], Euch zu helfen"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip|U] durchschaut Eure Manipulationen"
 study_faith_ongoing.1030.t: "$study_faith$: Alte Schriften ([scheme.GetTargetCharacter.GetFaith.ReligiousText|U])"
 study_faith_ongoing.1030.desc: "Eine Person nähert sich mir mit einem gierigen Grinsen.\n\n„Ist es wahr, dass Ihr Euch mit gewissen Lehren ([scheme.GetTargetCharacter.GetFaith.GetName]) beschäftigt, [ROOT.Char.Custom('FormOfAddressForLiege')|U]? Mein Vater brachte diese Schriften ([scheme.GetTargetCharacter.GetFaith.ReligiousText]) von einer seiner Reisen nach [holy_site.GetNameNoTier] mit!\n\nIch habe keine Verwendung dafür, da ich nicht lesen kann. Ich würde sie Euch gern im Austausch gegen etwas Geld überlassen.“"
 study_faith_ongoing.1030.a: "Was für ein Glück. Mein Gold gehört Euch."
 study_faith_ongoing.1030.b: "Diese Schriften sind gar nicht so selten, wie Ihr vielleicht denkt …"
 study_faith_ongoing.1030.b.flavor: "Mit [Select_CString(chosen_peasant.IsFemale, 'dieser Trödelhändlerin', 'diesem Trödelhändler')] verhandeln"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] nimmt das Angebot an"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] ist von Eurem Angebot beleidigt"
 study_faith_ongoing.1030.c: "Wachen, nehmt Euch diese heidnischen Schriften von [chosen_peasant.Custom('DE_PRO_PER_S_3P_D')]."
 study_faith_ongoing.1030.d: "[Select_CString(chosen_peasant.IsFemale, 'Betrügerin', 'Betrüger')]! Verschwindet …"
 study_faith_ongoing.1040.t: "$study_faith$: Bewunderung"
 study_faith_ongoing.1040.desc: "Was für ein Segen! Ich erhielt mehrere Schreiben, in denen [target.GetTitledFirstName] meine Bemühungen lobt, die Feinheiten des [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Glaubens zu erlernen. [target.Custom('DE_PRO_PER_S_3P_N')|U] geht sogar so weit, mich für meine Studien des [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]en Glaubens als herausragend [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] zu bezeichnen.\n\nEs tut gut, Anerkennung für meine harte Arbeit zu erhalten!"
 study_faith_ongoing.1040.a: "Schreiber! Schickt eine Nachricht mit meiner Wertschätzung zurück."
 study_faith_ongoing.1040.b: "Der Ausdruck des Glaubens von [target.GetFirstNameNoTooltip] ist erleuchtend …"
 study_faith_ongoing.1040.c: "Pah! Ich brauche von niemandem Bestätigung außer #EMP mir selbst#!!"
 study_faith_ongoing.1050.t: "$study_faith$: Der Geruch von Sabotage"
 study_faith_ongoing.1050.desc: "Die Notizen, in denen ich die bisweilen verwirrenden und widersprüchlichen Grundsätze des [scheme.GetTargetCharacter.GetFaith.GetName|l]en Glaubens skizzierte, liegen überall in meinem Studierzimmer verstreut. Monatelange Arbeit wurde zerrissen und zerfleddert. Ein einzelnes Blatt am Fenster deutet darauf hin, dass zumindest ein Teil meiner Notizen den Weg nach draußen fand.\n\nMuss ich nun wieder ganz von vorn anfangen?\n\n#EMP Schnüffel, schnüffel …#!Was ist das für ein widerlicher Geruch? Weihrauch oder Sandelholz, vermischt mit … etwas Blumigem? Der Geruch ruft mir das selbstgefällige Gesicht von [sabotage_rival.GetTitledFirstName] ins Gedächtnis. Diese [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)|l]e Ausrede für eine echte Person, die meinen Untergang zum Ziel hat …"
 study_faith_ongoing.1050.a: "Meine Notizen … Nein! So viel Arbeit … Alles weg!"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] verdient den #EMP TOD#!!"
 study_faith_ongoing.1050.c: "Ha! Ich fertige immer eine #EMP Kopie#! meiner Notizen an!"
 study_faith_ongoing.1060.t: "$study_faith$: Eine unsachkundige Auslegung"
 study_faith_ongoing.1060.desc: "Um meine Fortschritte zu überprüfen, versuche ich, eine Passage aus den heiligen Schriften ([scheme.GetTargetCharacter.GetFaith.ReligiousText|U]) für [offended_character.GetTitledFirstName], mein[offended_character.Custom('DE_END_PRO_S_A')] [scheme.GetTargetCharacter.GetFaith.GetAdjective|l][offended_character.Custom('DE_END_ADJ_IND_S_A')] [ROOT.Char.Custom2('RelationToMeShort', offended_character)], zusammenzufassen: #EMP „… der [offended_character.GetFaith.PriestNeuter] muss das Instrument des Glaubens ([target.Custom('GetAccessory')]) hochhalten, damit [target.Custom('Custom('DE_ART_DEF_S_N')')] [target.Custom('FormOfAddressForLiege')] die [target.GetCurrentLocation.Custom('get_region_flower_type')] pflücken kann …“#!\n\n„Eure Auslegung ist unsinnig! Sie lässt meine [offended_character.GetFaith.PriestNeuterPlural] [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))|l] erscheinen und die höchste Macht ([offended_character.GetFaith.HighGodName]) wie einen widerwärtigen geilen Bock!“.\n\nVielleicht mangelt es mir noch an Verständnis für die Feinheiten der [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Praxis …"
 study_faith_ongoing.1060.a: "Bitte nehmt dies als Zeichen meiner Reue."
 study_faith_ongoing.1060.b: "Mein Ziel war es, die Tugenden zu preisen, die man als [offended_character.GetFaith.PriestNeuter] zeigt!"
 study_faith_ongoing.1060.c: "Wisst Ihr was? Die höchste Macht ([offended_character.GetFaith.HighGodName]) ist ein #EMP widerwärtiger geiler Bock#!!"
 study_faith_ongoing.1060.d: "Ich hatte lediglich gehofft, die höchste Macht ([scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]) besser zu verstehen!"
 study_faith_ongoing.1060.b.success: "Ihr täuscht [offended_character.Custom('DE_PRO_PER_S_3P_D')] vor, dass Ihr [offended_character.Custom('DE_PRO_POS_S_3P')]em [offended_character.GetFaith.PriestNeuter] #EMP geschmeichelt#! habt"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] durchschaut Eure Lüge"
 study_faith_ongoing.1060.d.success: "Ihr erklärt erfolgreich, dass es ein Missverständnis war"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] glaubt Euch nicht"
 study_faith_ongoing.1070.t: "$study_faith$: Schmutzige Mythen"
 study_faith_ongoing.1070.desc: "Das Geschenk von [target.GetTitledFirstName] in Form mythologischer [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]er Schriften sorgt am Hof für Aufregung. Viele beobachten mich, während ich sie studiere und die spannendsten Passagen vorlese.\n\nZunächst nehme ich an, dass mir böse Mächte ([ROOT.Char.GetFaith.EvilGodNames]) einen Streich spielen, doch nach gründlicher Untersuchung bestimmter aufrührerischer Passagen wird klar, dass es sich um einen erotischen Text handeln muss.\n\nWas haben Verweise auf die körperlichen Vorzüge der fruchtbaren Kräfte ([scheme.GetTargetCharacter.GetFaith.FertilityGodName]) in einer heiligen Schrift zu suchen? [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "Wachen, entsorgt dieses verfluchte Buch!"
 study_faith_ongoing.1070.b: "Ihr wagt es, mich auszulachen? #EMP Peitscht sie alle aus.#!"
 study_faith_ongoing.1070.c: "Nun, ich nehme an, in gewisser Weise #EMP zählt#! das auch zur Bildung …"
 study_faith_ongoing.1080.t: "$study_faith$: Ein hervorragender Tutor"
 study_faith_ongoing.1080.desc: "Mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] unterstützte mich unermüdlich dabei, die Feinheiten dieses Glaubens ([scheme.GetTargetCharacter.GetFaith.GetName]) zu verstehen.\n\n[court_tutor.Custom('DE_PRO_POS_S_3P')|U]e Begeisterung für die Kunst des Lehrens ist inspirierend! [court_tutor.Custom('DE_PRO_PER_S_3P_N')|U] hat stets einen passenden [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Text griffbereit oder findet mir einen gelehrten [scheme.GetTargetCharacter.GetFaith.PriestNeuter], mit dem ich mich unterhalten kann.\n\nWahrlich, ohne [court_tutor.Custom('DE_PRO_POS_S_3P')]e Hilfe wäre mein Verständnis nicht so weit fortgeschritten."
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], Ihr habt eine Belohnung verdient!"
 study_faith_ongoing.1080.b: "[court_tutor.Custom('DE_PRO_PER_S_3P_N')|U] macht gute Arbeit."
 study_faith_ongoing.1090.t: "$study_faith$: Unbegreiflich!"
 study_faith_ongoing.1090.desc.intro: "Die Theologie hinter dem [scheme.GetTargetCharacter.GetFaith.GetName|l]en Glauben ist unmöglich zu begreifen!"
 study_faith_ongoing.1090.tenet.desc: "Der Glaube an ein bestimmtes Konzept ([discovered_tenet.GetName(scheme.GetOwner.GetFaith.Self)]) ist mir in besonderem Maß völlig unverständlich."
 study_faith_ongoing.1090.doctrine.desc: "Vor allem ein Grundsatz ([discovered_doctrine.GetName(scheme.GetOwner.GetFaith.Self)]) entzieht sich meinem Verständnis vollem Umfang."
 study_faith_ongoing.1090.desc.main: "\n\nMein Kopf platzt geradezu vor Wissen! Kaum taucht ein Gedanke auf, wird ein anderer in den Abgrund des Vergessens verdrängt."
 study_faith_ongoing.1090.friend.desc: "\n\n„Macht weiter so, mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom('ComplimentAdjective')|l][ROOT.Char.Custom('DE_END_ADJ_IND_S_N')] Freund[ROOT.Char.Custom('DE_END_NOU_S_GS_N')], ich glaube an Euch!“\n\nGlücklicherweise ist [helpful_friend.GetTitledFirstName] stets zur Stelle, um mir dabei zu helfen, diese mir unbekannten Lehren zu verstehen. Ich bin wirklich gesegnet."
 study_faith_ongoing.1090.no_friend.desc: "\n\nVielleicht brauche ich eine Pause?"
 study_faith_ongoing.1090.a: "Ich kann mich immer auf [helpful_friend.GetFirstNameNoTooltip] verlassen, wenn ich Rat brauche!"
 study_faith_ongoing.1090.b: "Ganz gleich, wie seltsam dies alles erscheinen mag: Ich muss durchhalten!"
 study_faith_ongoing.1090.c: "Ich muss die Bücher erst einmal für eine Weile beiseitelegen …"
 study_faith_ongoing.1090.d: "Ein hoffnungsloser Fall!"
 study_faith_ongoing.1100.t: "$study_faith$: Der [target.GetFaith.GetAdjectiveNoTooltip|l]e [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1100.desc: "Es sprach sich herum, dass ich mich ausgiebig mit dem [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Glauben beschäftigte.\n\nMan bezeichnet mich als „[target.GetFaith.GetAdjectiveNoTooltip|l][target.GetFaith.Custom('DE_END_ADJ_IND_S_A')] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]“, was zu Verwirrungen führen könnte."
 study_faith_ongoing.1100.a: "Mit einer geschickten Ansprache könnte ich mein Volk und die [target.GetFaith.GetAdherentNamePluralNoTooltip] besänftigen!"
 study_faith_ongoing.1100.b: "Mein Studium ist meine Sache. Keine Ablenkungen!"
 study_faith_ongoing.1100.c: "Das wird [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] sicherlich beeindrucken!"
 study_faith_ongoing.1100.a.success: "Ihr haltet eine fantastische Rede"
 study_faith_ongoing.1100.a.success.tt: "Jeder Höfling oder Gast bom Glauben „[root_scope.GetFaith.GetNameNoTooltip]“ oder „[target.GetFaith.GetNameNoTooltip]“"
 study_faith_ongoing.1100.a.failure: "Ihr macht Euch selbst zum Narren"
 study_faith_ongoing.1110.t: "$study_faith$: Der Liebreiz der [target.GetFaith.GetAdjectiveNoTooltip|l]en Dichtung"
 study_faith_ongoing.1110.desc: "Ah, „[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] & [poet_location.Custom('GetTerrainTypePlural')|U]“ von [the_poet.GetFirstName] aus [poet_location.GetCounty.GetName]. Wahrlich eine großartige Sammlung [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]er Gedichte!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nVielleicht ist die Poesie ein Fenster zum Glauben?"
 study_faith_ongoing.1110.a: "Ich werde mich an einem [target.GetFaith.GetAdjectiveNoTooltip|l]en Vers versuchen!"
 study_faith_ongoing.1110.b: "Soll mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip] ein #EMP romantisches#! Gedicht von mir zu hören bekommen?"
 study_faith_ongoing.1110.c: "Ich untersuche das Gedicht auf seine religiösen Aspekte."
 study_faith_ongoing.1110.a.success: "Ihr beweist ein Händchen für die Dichtkunst"
 study_faith_ongoing.1110.a.failure: "Eure Versuche, Gedichte zu verfassen, sind alles andere als überzeugend"
 study_faith_ongoing.1120.t: "$study_faith$: Ketzerische Erzählungen"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n„Ein Mensch von Eurem Rang, der sich mit Fabeln eines fremden Glaubens beschäftigt? Kennt Ihr denn keine Scham?“, ruft mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName] aus.\n\n„Wenn Eure Feinde erfahren, dass Ihr Euch mit ketzerischen Ideen beschäftigt, werden sie alles in ihrer Macht Stehende tun, um Euch als [Select_CString(ROOT.Char.IsFemale, 'Ketzerin', 'Ketzer')] darzustellen!“\n\nMöglicherweise könnten die von mir gewählten [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]en Schriften von Dummköpfen und Feinden am [ROOT.Char.Custom('GetCourt')] falsch ausgelegt werden."
 study_faith_ongoing.1120.a: "Nein! Das sind …#EMP ehrwürdige [target.GetFaith.GetAdjectiveNoTooltip|l]e theologische Abhandlungen!#!"
 study_faith_ongoing.1120.b: "Ihr wagt es, mich der Ketzerei zu bezichtigen?! Ich werde es Euch schon zeigen!"
 study_faith_ongoing.1120.c: "Ihr habt recht. Jemand von meinem Rang liest solche Schriften nicht."
 study_faith_ongoing.1120.d: "Lasst die Leute denken, was sie wollen. Diese Schriften sind äußerst aufschlussreich!"
 study_faith_ongoing.1120.a.success: "Ihr täuscht [zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a.failure: "Eure Vorliebe für ketzerische Lektüre wird allgemein bekannt"
 study_faith_ongoing.1120.b.tt: "#V Duelliert#! Euch mit [zealot.GetFirstName], um [zealot.Custom('DE_PRO_PER_S_3P_A')] für diese Frechheit zu bestrafen!\n#weak Dieses Duell geht NICHT bis zum Tod.#!\nGewinnt Ihr, erhaltet Ihr [prestige_i] [prestige|E] sowie einen [modifier|E] für das [scheme|E]. Solltet Ihr verlieren, macht Ihr Euch nur noch lächerlicher.\n\nEuer [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\nvon [zealot.GetFirstName]: [prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "Mein Duell gegen [zealot.GetFirstNameNoTooltip] wurde annulliert"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "„Ich gebe auf! Bitte verzeiht mir. Ihr seid überhaupt nicht dümmlich! Verschont mich einfach!“, ruft [zealot.GetTitledFirstName].\n\n#EMP Mich#! beleidigt zu haben, wird [zealot.Custom('DE_PRO_PER_S_3P_D')] eine Lehre sein."
 study_faith_ongoing.1123.a: "Wie ein weises Tier ([ROOT.Char.Custom('GetAnimalType')]) einst sagte: „Beleidigt nie diejenigen, die über Euch stehen!“"
 study_faith_ongoing.1123.b: "Ihr werdet für diese Frechheit im Kerker verrotten!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName|U] spuckt neben die Stelle, an der Ihr auf dem Boden liegt.\n\n„Ihr seid schwach und erbärmlich in Eurer Herrschaft. Nun werde ich Euch einen Gefallen tun und Euch von diesen albernen Büchern befreien“, spricht [zealot.Custom('DE_PRO_PER_S_3P_N')]."
 study_faith_ongoing.1124.a: "Ein Rückschlag in meinem Studium …"
 study_faith_ongoing.1130.t: "$study_faith$: Die Freuden des Glaubens"
 study_faith_ongoing.1130.desc: "„Oh, m[ROOT.Char.Custom('DE_ART_IND_N')] lieb[ROOT.Char.Custom('DE_END_ADJ_IND_S_N')] [ROOT.Char.GetFirstNameNoTooltip]! Ihr gabt Euch wirklich dem Studium des [scheme.GetTargetCharacter.GetFaith.GetName|l]en Glaubens hin? Ich schätze es sehr, dass Ihr Euch solche Mühe gebt, mich zu verstehen!“, sagt [lover_to_help.GetTitledFirstName] [lover_to_help.Custom('quirk_pos_pp')].\n\n„Es wäre mir eine Freude, Euch in #EMP jeder#! erdenklichen Weise behilflich zu sein.“"
 study_faith_ongoing.1130.a: "Ich nehme jede Hilfe, die ich bekommen kann!"
 study_faith_ongoing.1130.b: "Mir fällt da etwas höchst Angenehmes ein."
 study_faith_ongoing.1130.c: "Ich würde es vorziehen, allein zu lernen."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] ist [lover_to_help.Custom('DE_ART_IND_N')] gut[lover_to_help.Custom('DE_END_ADJ_IND_S_N')], wenn auch etwas kokett[lover_to_help.Custom('DE_END_ADJ_IND_S_N')] Lehrer[lover_to_help.Custom('DE_END_NOU_S_GS_N')]"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip|U] widmet sich in seinen Lektionen vorrangig derart nischenhaften, sinnlichen Aspekte der Theologie, dass nicht erkennbar ist, wie diese mit dem Glauben als Ganzes vereinbar sind."
 study_faith_ongoing.1130.a.failure.toast: "Die Hilfe von [lover_to_help.GetFirstNameNoTooltip] ist zu kokett, um hilfreich zu sein."
 study_faith_ongoing.1140.t: "$study_faith$: Eine führende Hand"
 study_faith_ongoing.1140.desc: "„Ich lobe Euch dafür, dass Ihr Euch dem Studium dieses Glaubens ([scheme.GetTargetCharacter.GetFaith.GetName]) verschrieben habt. Dies wird Euren Rang gewiss stärken“, sagt m[close_one_to_help.Custom('DE_ART_IND_N')] [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName] [close_one_to_help.Custom('quirk_pos_pp')].\n\n„Ich bin mit den Wegen dieses Glaubens ([scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]) seit meiner Geburt vertraut. Vielleicht kann ich Euch dabei behilflich sein, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?“"
 study_faith_ongoing.1140.a: "Könntet Ihr mir dabei helfen, diesen Grundsatz zu verstehen?"
 study_faith_ongoing.1140.b: "Möchtet Ihr an meinen Lernrunden teilnehmen?"
 study_faith_ongoing.1200.t: "$study_faith$: Ein heidnischer Hund"
 study_faith_ongoing.1200.desc: "Um die Geheimnisse dieses Glaubens ([scheme.GetTargetCharacter.GetFaith.GetName]) zu ergründen, führe ich eine übersichtliche Sammlung von Notizen. Dies ist mein einziges Mittel, um das Chaos eines anderen Glaubens zu bewältigen. Leider scheinen meine Notizen nun wie vom Erdboden verschluckt.\n\nDie vertraute feuchte Nase meines Hundes [ROOT.Char.Custom('DogStoryName')] stupst meine Hand an. Ich sehe zu meinem geliebten Hund hinunter und hoffe, eine Pause von meinem Verdruss zu gewinnen.\n\nMit Blick auf mich wedelt mein treuer vierbeiniger Freund voller Stolz mit dem Schwanz. Erst dann wird mir klar, dass sich meine Notizen in seinem Maul befinden …"
 study_faith_ongoing.1200.a: "Ich könnte unmöglich weiter wütend auf dich sein!"
 study_faith_ongoing.1200.b: "Möchtest du Gassi gehen? Dann komm."
 study_faith_ongoing.1200.c: "Das ist kein Spielzeug! #EMP Böser#! Hund!"
 study_faith_ongoing.1300.t: "$study_faith$: Praxis ist der beste Lehrer"
 study_faith_ongoing.1300.desc: "Als wir durch [ROOT.Char.GetCurrentLocation.GetTitle.GetName] gehen, scheinen die Einheimischen gerade ein [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]es Fest zu feiern. Eine Person kommt auf uns zu und lädt uns ein, daran teilzunehmen, obwohl wir [ROOT.Char.GetFaith.GetAdherentNamePlural] sind.\n\nMeine Gruppe versucht, sich zwischen uns zu stellen, da sie befürchtet, es könnte sich um eine Falle handeln.\n\nZum Teufel mit der Gefahr! Ich kann mir kaum eine bessere Gelegenheit vorstellen, um aus erster Hand etwas über den [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]en Glauben zu erfahren!"
 study_faith_ongoing.1300.a: "Zeigt mir den Weg!"
 study_faith_ongoing.1300.a.flavor: "Es ist doch nur ein harmloses [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l]e Ritual – was kann daran schon schaden?"
 study_faith_ongoing.1300.b: "Am lehrreichsten wird sicherlich eine Auseinandersetzung mit den Einzelheiten [interlocutor.Custom('DE_PRO_POS_S_3P')]es Glaubens sein."
 study_faith_ongoing.1300.b.flavor: "Ihr versucht, [interlocutor.GetFirstNameNoTooltip] in eine gütliche Debatte zu verwickeln"
 study_faith_ongoing.1300.b.success: "Ihr führt eine spannende Debatte mit [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.failure: "Ihr schafft es nicht, Euch mit [interlocutor.GetFirstNameNoTooltip] zu verständigen"
 study_faith_ongoing.1300.c: "„Begleitet uns doch auf unserer Reise nach [next_destination.GetNameNoTooltip]!“"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "So wie die Motte die Sprache der Sterne nicht kennt und dennoch die Flamme findet, so muss die Seele das Göttliche nicht beim Namen nennen, um von ihm verzehrt zu werden."
 holy_text_indeterminate_quote_2: "Nachdem der Wüstenwind die Fußspuren des Tyrannen verwischt hatte, erinnerte sich der Sand nur noch an die Spuren der Durstigen und der Gütigen."
 holy_text_indeterminate_quote_3: "Der Fluss wählt die Steine, die er glättet, zwar nicht aus, doch durch sein stetiges Strömen verwandelt er jeden einzelnen von ihnen in einen Edelstein."
 holy_text_indeterminate_quote_4: "Trinkt aus der Quelle des Wissens, und es wird Euren Rücken beugen."
 holy_text_indeterminate_quote_5: "An dem Tag, als sich der Berg verneigte, tat er dies nicht vor Königen oder Heeren, sondern vor jenem Kind, das sich traute, ihm eine Frage zu stellen."
 holy_text_indeterminate_quote_6: "Der Verborgene spricht zunächst in Wispern des Zweifels, damit Euer Glaube, wenn Ihr schließlich antwortet, Euer eigener ist."
 holy_text_indeterminate_quote_7: "Jede Lüge, die vor dem Altar dargebracht wird, kehrt als Rauch zurück. Doch jede aufrichtige Träne fällt wie ein Samenkorn in die Gärten des Himmels."
 holy_text_indeterminate_quote_8: "Verflucht nicht die Dunkelheit, die Euren Weg verhüllt. Sie existiert, damit Eure eigene Flamme den Mut zum Leuchten findet."
 holy_text_indeterminate_quote_9: "Der Strahlende berücksichtigt nicht die Gebete der Hochmütigen, sondern nur die stillen Taten der Barmherzigkeit, die vollbracht werden, wenn niemand zusieht."
 holy_text_indeterminate_quote_10: "Als die Welt in ein „Mein“ und ein „Euer“ geteilt wurde, lachte das Göttliche, denn aus seinem Blickwinkel gab es nur ein „Unser“."
