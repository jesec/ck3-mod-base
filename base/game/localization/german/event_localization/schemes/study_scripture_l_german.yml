l_german:
 study_scripture_outcome.10.t: "$study_scripture_title$Eine Studienregel"
 study_scripture_outcome.10.desc: "Die Bücher liegen offen auf dem Lesepult, die Artikel der [ROOT.Char.GetFaith.GetAdjective|l]en Doktrin mit sorgfältiger Hand kopiert. Eine Kerze glimmt in der Dunkelheit. Unten im Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) warten die Gläubigen so, wie sie es immer tun.\n\n"
 study_scripture_outcome.10.desc_quote: "Auf der obersten Seite unterstrich ein Leser vor mir einen einzelnen Abschnitt: #EMP „[ROOT.Char.Custom('RandomStudyVerseFragment')]“#!\n\nWie viel von mir selbst soll ich diesen heiligen Seiten geben?"
 study_scripture_outcome.10.desc_generic: "Wie viel von mir selbst werde ich der heiligen Bildung geben?"
 study_scripture_outcome.10.a: "Lasst die Wunder der Welt hinter der Klostertür warten."
 study_scripture_outcome.10.b: "Das Studium sollte seine festen Zeiten haben, so wie [ROOT.Char.Custom('StudyOfficesWord')] die ihren."
 study_scripture_outcome.10.c: "Ich werde lesen, wann immer mich der Geist bewegt."
 no_change_study_scripture_tt: "Euer [GetScheme('study_scripture').GetTypeName]s-[scheme|E] schreitet unverändert voran"
 study_scripture_outcome.110.t: "$study_scripture_title$Die heilige Seite"
 study_scripture_outcome.110.desc: "Ich arbeite mich Zeile um Zeile durch die großen Texte des Glaubens ([ROOT.Char.GetFaith.GetName]), während sich Wachs um den Kerzenstummel herum sammelt und die Kaninchen und Schnecken in den Randbemerkungen miteinander streiten.\n\n"
 study_scripture_outcome.110.desc_quote: "Eine Textstelle spricht mich an:\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!\n\nWenn ich die Gläubigen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) hüten soll, muss ich diese Worte in meinem Herzen tragen."
 study_scripture_outcome.110.desc_generic: "Wenn ich die Gläubigen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) hüten soll, sind dies die Worte, die ich in meinem Herzen tragen muss."
 study_scripture_outcome.110.a: "Ich muss lernen, was auch immer ich dafür geben muss."
 study_scripture_outcome.110.b: "Das Verständnis wird zu seiner Zeit kommen."
 study_scripture_outcome.120.t: "$study_scripture_title$Der lange Kommentar"
 study_scripture_outcome.120.desc: "Bevor ich meine Herde führen kann, muss ich lernen, mich selbst zu führen. Der Kommentar von [commentary_writer.GetTitledFirstName] liegt geöffnet vor mir – die lebenslange Arbeit eines anderen Gelehrten am Text ([ROOT.Char.GetFaith.ReligiousText]), so undurchdringlich wie ein Dornengestrüpp und doppelt so scharf. Jede Zeile, die ich kläre, gibt drei weitere preis.\n\nNur durch Disziplin werde ich obsiegen."
 study_scripture_outcome.120.a: "Ich werde den Text nach einer tieferen Bedeutung durchgehen."
 study_scripture_outcome.120.b: "Stete Stunden, steter Fortschritt."
 study_scripture_outcome.120.c: "Eine Seite pro Nacht genügt."
 scholar_xp_high_tt: "Ihr vertieft deutlich Eure Gelehrsamkeit"
 scholar_xp_low_tt: "Ihr vertieft ein wenig Eure Gelehrsamkeit"
 study_scripture_outcome.130.t: "$study_scripture_title$Geduld in den Randbemerkungen"
 study_scripture_outcome.130.desc: "Warum erschließt sich mir der Sinn nicht? Ich lese die Passage ein viertes Mal, doch sie verschließt sich regelrecht vor mir. Ich lege meine Stirn sanft auf den Schreibtisch.\n\n„Ich habe eine Kerze für Euch“, sagt mein[tutor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', tutor)] [tutor.GetFirstName] von der Tür aus. „Ah – die alten Anmerkungen. Ich kenne diese Seiten gut. Sollen wir sie für einen Augenblick gemeinsam lesen?“\n\nIch schaue auf. Vielleicht ist eine helfende Hand genau das, was ich brauche."
 study_scripture_outcome.130.a: "Unterweist mich. Ich bin nicht zu stolz zum Lernen."
 study_scripture_outcome.130.b: "Setzt Euch für einen Augenblick zu mir; der Text kann warten."
 study_scripture_outcome.140.t: "$study_scripture_title$Zu der Gemeinde ([ROOT.Char.Custom('StudyParishWord')|U]) predigen"
 study_scripture_outcome.140.desc: "Seufzend klappe ich das Buch zu. Die ganze Doktrin steht in ihm, doch als [preacher.GetTitledFirstName] zuletzt vor mir predigte, gab es in ihr keinen Syllogismus – nur die reine Wahrhreit der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]). Die Gemeinde ([ROOT.Char.Custom('StudyParishWord')]) weinte. #EMP Ich#! weinte."
 study_scripture_outcome.140.a: "Es gibt die Doktrin, und es gibt ihre Vermittlung. Ich werde beides erlernen."
 study_scripture_outcome.140.b: "Nicht das Predigen ist meine Berufung, sondern die Schrift."
 study_scripture_outcome.150.t: "$study_scripture_title$Die weltlichen Besitztümer"
 study_scripture_outcome.150.desc: "„Geht ein Stück mit mir“, sagt mein[steward_scope.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', steward_scope)] [steward_scope.GetFirstName] mit dem Hauptbuch unter dem Arm und führt mich hinaus in den Morgen.\n\n„Die Tempelfelder, die Mühle, die Zehntscheunen: Achtet darauf, welche voll sind, welche Löcher haben und welche doppelt zugesagt wurden. Eine Herde kann nicht mit Würde allein gefüttert werden.“"
 study_scripture_outcome.150.a: "Unterweist mich in den Hauptbüchern."
 study_scripture_outcome.150.b: "Ein kleiner Spaziergang lässt wenigstens meinen Kopf frei werden."
 study_scripture_outcome.160.t: "$study_scripture_title$Gebildete Gesellschaft"
 study_scripture_outcome.160.desc: "Meine Studien ließen mich mit [colleague.GetTitledFirstName] korrespondieren, und von [colleague.Custom('DE_PRO_POS_S_3P')]er Hingabe wird auch über [colleague.Custom('DE_PRO_POS_S_3P')] eigenes Heim hinaus nur gut gesprochen.\n\n"
 study_scripture_outcome.160.desc_distant: "Wir schreiben uns Glaubensangelegenheiten – Fragen, Argumente und Korrekturen gehen hin und her. [colleague.Custom('DE_PRO_POS_S_3P')|U]e Handschrift ist schrecklich, doch [colleague.Custom('DE_PRO_POS_S_3P')]e Argumente sind gut."
 study_scripture_outcome.160.a: "Lasst uns das ordentlich diskutieren."
 study_scripture_outcome.160.b: "Eine gebildete Person sollte wissen, wie ihr Sitz regiert wird."
 study_scripture_outcome.160.c: "Gemeinsam zurück zum Text."
 piety_gain_high_tt: "Bedeutender Frömmigkeitszuwachs"
 piety_gain_low_tt: "Leichter Frömmigkeitszuwachs"
 study_scripture_outcome.170.t: "$study_scripture_title$Ein versiegelter Brief"
 study_scripture_outcome.170.desc: "Mein[letterman.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', letterman)] [letterman.GetFirstName] trägt ihn wie eine Reliquie vor sich her: einen Brief, der das Siegel von [senior.GetTitledFirstName] trägt.\n\n„Kunde Eurer Studien reiste weiter, als Euch bewusst ist. Der Glaube ist reicher durch einen Hirten, der liest. Bleibt beharrlich und seid Euch meiner Gnade sicher.“\n\n"
 study_scripture_outcome.170.desc_quote: "Der Brief endet mit einem Vers, der von den anderen abgesetzt ist:\n#EMP „[ROOT.Char.Custom('RandomBibleQuoteShort')]“#!"
 study_scripture_outcome.170.desc_generic: "Der Brief endet mit einem Segen im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]), der viel größer geschrieben ist als der Rest."
 study_scripture_outcome.170.a: "Ich werde eine würdige Antwort verfassen."
 study_scripture_outcome.170.b: "Vielleicht könnte [senior.Custom('DE_PRO_PER_S_3P_N')] meine Bildung etwas … öffentlicher loben?"
 study_scripture_outcome.170.c: "Lest ihn noch einmal. Langsamer diesmal."
 study_scripture_outcome.171.t: "$study_scripture_title$Briefe an die Gläubigen"
 study_scripture_outcome.171.desc: "Ich bekomme Briefe aus allen Ecken des Glaubens ([ROOT.Char.GetFaith.GetName]). Kleriker streiten über ein Wort der Liturgie, Dorf-[ROOT.Char.GetFaith.PriestNeuterPlural] fürchten sich vor ihren eigenen Zweifeln, und ein Gelehrter bittet um ein Urteil zu einer Übersetzung, die kein Lebender überprüfen kann. Meines ist das Siegel, das Streitigkeiten beilegt.\n\n"
 study_scripture_outcome.171.desc_quote: "Die heutigen Briefe zitiert hoffnungsfrog die heiligen Schriften:\n#EMP „[ROOT.Char.Custom('RandomBibleQuoteShort')]“#!\n\nDer Stapel auf meinem Schreibtisch wird immer höher. Genauso, wenn auch still, wächst meine Bildung."
 study_scripture_outcome.171.desc_generic: "Der Stapel auf meinem Schreibtisch wird immer höher. Genauso, wenn auch still, wächst meine Bildung."
 study_scripture_outcome.171.a: "Antwortet ihnen allen. Dafür ist ein Hirte da."
 study_scripture_outcome.171.b: "Lasst die Schreiber meine Antworten in alle Ecken des Glaubens verteilen."
 study_scripture_outcome.171.c: "Heute gehöre ich zu den Lernenden. Die Antworten können warten."
 study_scripture_outcome.172.t: "$study_scripture_title$Gemeindebriefe"
 study_scripture_outcome.172.desc: "Heute studiere ich Briefe, die von Hirten an ferne Glaubensgemeinschaften geschickt wurden: Die Predigten und Anweisungen unterscheiden sich sehr von [ROOT.Char.Custom('StudyParishWord')] zu [ROOT.Char.Custom('StudyParishWord')].\n\nMeine Gedanken kehren zu den Gläubigen aus [pastoral_county.GetNameNoTier] zurück, in den Landen von [pastoral_lord.GetTitledFirstName]. Sie haben dort eine Kirche. Sie sind weit von mir entfernt und ohne meine Führung … Vielleicht ist es an der Zeit, dass ich ihnen schreibe.\n\nIch nehme meinen Federkiel in die Hand. #EMP „An die Gläubigen in [pastoral_county.GetNameNoTier] …“#!"
 study_scripture_outcome.172.a: "Sendet ihn ab."
 study_scripture_outcome.172.b: "Die Lektion bestand darin, ihn zu schreiben. Das reicht."
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName|U] schickte den Leuten von [pastoral_county.GetNameNoTier] einen Brief"
 study_scripture_outcome.180.t: "$study_scripture_title$Die Entlastung"
 study_scripture_outcome.180.desc: "Mit zusammengebissenen Zähnen und angespannten Schultern beginne ich zu lesen, in der Erwartung einer weiteren Pflicht, die es zu erfüllen gilt.\n\n"
 study_scripture_outcome.180.desc_confession: "Irgendwo zwischen der ersten und der letzten Seite zerbricht meine Seele. Alles, was ich mit mir trug, spreche ich vor niemandem außer vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) laut aus. Die Last ist fort.\n\nZum ersten Mal seit Monaten liegt der Weg klar vor mir."
 study_scripture_outcome.180.desc_generic: "Irgendwo zwischen der ersten und der letzten Seite fällt mir eine Last von den Schultern. Es ist, als hätte sich ein Schleier gelüftet.\n\nZum ersten Mal seit Monaten liegt der Weg klar vor mir."
 study_scripture_outcome.180.a: "Nun – was lese ich als Nächstes …"
 study_scripture_outcome.190.t: "$study_scripture_title$Patronat der Gebildeten"
 study_scripture_outcome.190.desc: "Auch die Bildung hat ihre eigene Politik. Ein kopiertes Buch, das an den richtigen Rat geschickt wird, ein vielversprechender Lektor, der am richtigen Tisch sitzt, mein Name, den man wohlgesonnen in den Hallen ausspricht …\n\nIch arbeite fleißig. Doch Fleiß, der nicht gesehen wird, ist vergeudet."
 study_scripture_outcome.190.a: "Schaut, dass die Synode meinen Namen hört."
 study_scripture_outcome.190.b: "Bittet die Theologen, ihre Notizen zu teilen."
 study_scripture_outcome.190.c: "Die Mystiker sollten meine Arbeit kennen."
 study_scripture_outcome.190.d: "Meine Hingabe steht für sich selbst."
 study_scripture_outcome.200.t: "$study_scripture_title$Der Visionär"
 study_scripture_outcome.200.desc: "Es gibt Seiten, auf denen die Briefe enden und etwas anderes beginnt. Der [GetTrait('lifestyle_mystic').GetName(mystic)] namens [mystic.GetTitledFirstName] schreibt über eine Dunkelheit, die heller als der Mittag sei, über Gebete, die andauern, auch wenn die Worte versagen – und der Glaube ([ROOT.Char.GetFaith.GetName]) lehrt uns, dass solche Türen für jene, die an ihnen zu klopfen wagen, tatsächlich existieren.\n\nIch lese, bis die Kerze heruntergebrannt ist. Dann sitze ich noch lange in der Dunkelheit und lausche."
 study_scripture_outcome.200.a: "Etwas wartete in der Dunkelheit. Ich werde es suchen."
 study_scripture_outcome.200.b: "Stellt mich auf die Probe, ihr Mysterien. Ich fürchte mich nicht."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip|U] verdient einen Brief der Bewunderung."
 study_scripture_outcome.200.d: "Ich werde die Tür im Auge behalten und mich schlichteren Studien zuwenden."
 study_scripture_outcome.300.t: "$study_scripture_title$Die Nachtwache"
 study_scripture_outcome.300.desc: "Das Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) ist kalt und völlig stilll. Zwischen dem letzten und dem ersten Offizium liegt eine Stunde, die niemandem gehört, und ich habe sie zu der meinen gemacht – eine einzige Kerze, die Dunkelheit und das Geheimnis, das sich dicht um die Flamme drängt.\n\nEtwas wartet hinter der Stille. Es ist geduldig. Heute Nacht bin ich es auch."
 study_scripture_outcome.300.a: "Tiefer. Ich werde noch tiefer gehen."
 study_scripture_outcome.300.b: "Eine Stunde der Stille, dann der Schlaf."
 study_scripture_outcome.300.c: "Ich hielt Wache; das genügt."
 study_scripture_outcome.100.t: "$study_scripture_title$Eine Frage der Nachfolge"
 study_scripture_outcome.100.desc: "Die Nacht bricht herein, als ich den Wahlkanon vor mich lege. Die Seiten werden von schwachem Licht erhellt. Wer wird erhoben, wer erhebt wen, welche Präzedenzfälle haben Bestand und welche müssen sich beugen – es steht alles hier für jene, die die Geduld haben, es zu lesen.\n\nAlte Männer sterben. Das Konklave versammelt sich. Und wenn es darauf ankommt, dann erinnern sich die Kardinäle daran, wer die Gesetze kannte."
 study_scripture_outcome.100.a: "Eines Tages wird die Frage gestellt werden. Ich werde die Antwort sein."
 study_scripture_outcome.100.b: "Weisheit braucht Zeit; lasst den Ehrgeiz warten."
 study_scripture_outcome.100.c: "Ich würde lieber schlafen gehen …"
 pam_ss_papabile_tt: "Euer [papabile_score|E] für die Papstnachfolge erhöht sich um #P +10#!"
 study_scripture_outcome.101.t: "$study_scripture_title$Der berühmte Exeget"
 study_scripture_outcome.101.desc: "Während eines kalten Abendessens kommt die Antwort über mich, zwischen einem Bissen und dem nächsten. Endlich weiß ich, wie ich die Textstelle lesen muss:\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!\n\nGenerationen von [Glossary('Exegeten', 'GLOSS_EXEGETE')] stritten über diese Worte. Nun scheint ihre Bedeutung völlig klar. Die Frage ist jetzt, was ich mit meiner Deutung anfangen soll."
 study_scripture_outcome.101.desc_generic: "Generationen von [Glossary('Exegeten', 'GLOSS_EXEGETE')] stritten über diese Worte. Nun scheint ihre Bedeutung völlig klar. Die Frage ist jetzt, was ich mit meiner Deutung anfangen soll."
 study_scripture_outcome.101.a: "Predigt sie während des nächsten Festmahls."
 study_scripture_outcome.101.b: "Verbreitet sie stillschweigend unter den Gebildeten."
 study_scripture_outcome.101.c: "Sie wurde mir schweigend gegeben; schweigend werde ich sie zurückgeben."
 GLOSS_EXEGETE: "Eine Person, die Exegese betreibt: ein Fachmann oder Gelehrter, der in der kritischen Erläuterung, der Deutung oder der Auslegung von insbesondere religiösen Schriften geschult ist."
 study_scripture_outcome.102.t: "$study_scripture_title$Klarheit in den Doktrinen"
 study_scripture_outcome.102.desc: "Seit Jahren habe ich die Doktrinen des Glaubens ([ROOT.Char.GetFaith.GetName]) vor Augen, doch einige der Lehren ergaben für mich nie Sinn.\n\n"
 study_scripture_outcome.102.desc_tenet: "Heute Nacht wird mir der Grundsatz namens [pam_ss_clarity_tenet.GetBaseName] endlich klar: was er fordert, was er vergibt und wo seine Grenzen liegen. Ich verstehe ihn gut genug, um ihn vor jedem Gelehrten zu verteidigen oder ihn einem Kind zu erklären."
 study_scripture_outcome.102.desc_generic: "Heute Nacht werden die Lehren endlich klar: was sie fordern, was sie vergeben und wo ihre Grenzen liegen. Ich verstehe sie gut genug, um sie vor jedem Gelehrten zu verteidigen oder sie einem Kind zu erklären."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!"
 study_scripture_outcome.102.a: "Ich muss das niederschreiben, bevor das Licht schwindet."
 study_scripture_outcome.102.b: "Lasst die Freude daran genug sein."
 study_scripture_outcome.102.c: "Auch die Offenbarung kann bis morgen warten."
 study_scripture_outcome.121.t: "$study_scripture_title$Der Lehrer"
 study_scripture_outcome.121.desc: "Lange nachdem die Kerzen gelöscht sein sollten, ist mein[student_courtier.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', student_courtier)] [student_courtier.GetTitledFirstName] in der Bibliothek über einen Text gebeugt, der viel zu lang ist für [student_courtier.Custom('DE_PRO_POS_S_3P')]e Bildung.\n\n„Ich bitte um Vergebung, [ROOT.Char.Custom('FormOfAddressForLiege')]“, stottert [student_courtier.Custom('DE_PRO_PER_S_3P_N')] erschrocken. „Ich … Ich wünschte nur, ich könnte diesen Band lesen …“\n\nIch erinnere mich, wie sehr ich mich nach einem Lehrer gesehnt hatte, der dieses Buch tatsächlich #EMP gelesen#! hatte."
 study_scripture_outcome.121.a: "Wir werden es gründlich lesen – gemeinsam."
 study_scripture_outcome.121.b: "Ich werde [student_courtier.Custom('DE_PRO_PER_S_3P_A')] fördern."
 study_scripture_outcome.121.c: "Lasst [student_courtier.Custom('DE_PRO_PER_S_3P_A')] allein studieren. Das formt den Charakter."
 study_scripture_outcome.122.t: "$study_scripture_title$Der Katechismus"
 study_scripture_outcome.122.desc: "Meine Studien trugen Früchte. Heute versammle ich meinen Haushalt in der Halle ([ROOT.Char.Custom('ResidenceBuildingHallsType')]) meiner Residenz ([ROOT.Char.Custom('ResidenceBuilding')]) und öffne den Text ([ROOT.Char.GetFaith.ReligiousText]) vor ihm.\n\nIch lese. Die anderen lauschen. Bald schon kommen die Fragen – einige sind einfältig, andere überraschend gezielt. Es scheint, als sei ich nicht allein in meinem Hunger nach heiliger Bildung."
 study_scripture_outcome.122.a: "Zeile um Zeile, für jeden. Das ist die Arbeit."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] hat einen scharfen Verstand. Ich werde [pupil.Custom('DE_PRO_PER_S_3P_D')] mehr beibringen."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] blieb danach noch im Raum. Die Tür ist geöffnet."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] lernte genügend. Gebt [devout.Custom('DE_PRO_PER_S_3P_D')] meinen Segen."
 study_scripture_outcome.123.t: "$study_scripture_title$Die Tore zur Bildungsstätte"
 study_scripture_outcome.123.desc: "Die Kunde über meine Studien verbreitete sich mit den Pilgern und den Hausierern, und heute brachten sie mir einen möglichen Schüler. [aspirant.GetTitledFirstName|U] steht an meinem Tor, zerzaust von der Reise und stur, ein geliehenes Buch in den zitternden Händen.\n\n„Man sagt, dass Ihr tatsächlich lest, was Ihr predigt. Lehrt es mich und ich werde dienen.“"
 study_scripture_outcome.123.a: "Ah. Wir beginnen mit dem Alphabet des Glaubens."
 study_scripture_outcome.123.b: "Mein Hof ist keine Bildungsstätte ([ROOT.Char.Custom('StudySeminaryWord')])."
 study_scripture_outcome.400.t: "$study_scripture_title$Arzt, heilt Euch selbst"
 study_scripture_outcome.400.desc: "Die Textstelle lässt mich innehalten. Die Verurteilung darin kommt mir unangenehm bekannt vor.\n\n"
 study_scripture_outcome.400.desc_generic: "Der Text benennt mich nicht, und doch tut er es: Ich bin „[penance_sin.GetName(ROOT.Char)]“, sagt er – deutlich und ohne Gnade –, als ob der Verfasser mich kannte."
 study_scripture_outcome.400.desc_end: "\n\nIch könnte das Buch schließen und nicht weiterlesen. Doch die Anschuldigung würde bestehen bleiben."
 study_scripture_outcome.400.a: "Es gibt nur eine Heilung. Buße."
 study_scripture_outcome.400.b: "Ich muss weiterlesen – komme, was wolle."
 study_scripture_outcome.400.c: "Heilige predigen. Sünder herrschen."
 study_scripture_outcome.410.t: "$study_scripture_title$Merkwürdige Kommentare"
 study_scripture_outcome.410.desc: "Der Kodex ist geliehen, und der vorherige Leser hinterließ eigene Gedanken in den Randbemerkungen: Einsprüche, Gebete und Bemerkungen zu dem Grundsatz namens [pam_ss_margin_tenet.GetBaseName].\n\nIch sollte nicht weiter auf diese Kritzeleien achten. Stattdessen stelle ich fest, dass ich sie zweimal lese."
 study_scripture_outcome.410.a: "Und nun ein drittes Mal, ganz langsam."
 study_scripture_outcome.410.b: "Ein so schwerwiegender Fehler braucht eine angemessene Gegenrede."
 study_scripture_outcome.410.c: "Ins Feuer damit – die ganze Seite."
 study_scripture_outcome.430.t: "$study_scripture_title$Der Grundsatz und das Herz"
 study_scripture_outcome.430.desc: "Von den Lehren des Glaubens ([ROOT.Char.GetFaith.GetName]) steht mir eine ganz nahe: [pam_ss_heart_tenet.GetBaseName] – in mir getragen seit einer Zeit, lange bevor ich diesen Grundsatz hätte verteidigen können. Heute richte ich mein Studium darauf aus, auf der Suche nach Schwächen.\n\n"
 study_scripture_outcome.430.desc_quote: "Der Text antwortet einstimmig:\n#EMP „[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]“#!\n\nDie Schwäche lag nie in der Lehre."
 study_scripture_outcome.430.desc_generic: "Der Text antwortet einstimmig, älter und beständiger als ich. Die Schwäche lag nie in der Lehre."
 study_scripture_outcome.430.a: "Ich glaube es. Lasst die ganze Gemeinde ([ROOT.Char.Custom('StudyParishWord')]) sehen, wie ich es lebe."
 study_scripture_outcome.430.b: "Ich werde etwas zu seiner Verteidigung schreiben."
 study_scripture_outcome.430.c: "Wenn man genau hinschaut, hat jede Lehre ihre Schwächen …"
 pam_ss_spread_tenet_tt: "Eure schriftliche Verteidigung kann bis zu #V 3#! [rulers|E] umstimmen, den Glaubenssatz namens [pam_ss_heart_tenet.GetBaseName] anzunehmen"
 pam_ss_conviction_spread_tt: "$study_scripture_title$Persönlicher Grundsatz angenommen"
 study_scripture_outcome.1000.t: "$study_scripture_title$Ein zurechtgewiesener Hirte"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U] erhebt die Stimme nicht. [senior.Custom('DE_PRO_PER_S_3P_N')|U] muss es nicht.\n\n„Man sagt, dass Eure Studien Staub ansammeln. Ein Hirte, der nicht lernt, hat eine ziellose Herde. Euch wurde mehr als den meisten gegeben – was habt Ihr damit angefangen?“\n\nDas anschließende Schweigen ist schlimmer als jedes Schreien."
 study_scripture_outcome.1000.desc_letter: "Die Worte tragen das Siegel von [senior.GetTitledFirstName], und jede wohlgesetzte Zeile trifft mich wie ein Schlag:\n\n„Mich erreichte die Kunde, dass Eure Studien stocken. Ein Hirte, der nicht lernt, führt [ROOT.Char.Custom('DE_PRO_POS_S_3P')]e Herde in die Irre. Euch wurde mehr als den meisten gegeben. Ich erwarte, Besseres zu hören.“\n\nEs gibt keine Unterschrift. Das Siegel reicht aus."
 study_scripture_outcome.1000.desc_dream: "Im Traum stehe ich in einer großen Bibliothek, in der jedes Buch meinen Namen trägt und jede Seite leer ist. Eine Gestalt, die ich von Hunderten von heiligen Bildern kenne, schließt sanft das letzte Buch so, wie man die Augen der Toten schließt.\n\n„Euch wurde mehr als den meisten gegeben“, sagt der Heilige – und ich erwache und die Worte hallen noch nach."
 study_scripture_outcome.1000.a: "Man wird an mir nicht noch einmal einen Makel feststellen."
 study_scripture_outcome.1000.b: "Ich kann so nicht mehr weitermachen. Es reicht – für immer."
 study_scripture_outcome.1000.c: "Genug. Ich brauche Ruhe."
 never_study_scripture_again_tt: "Ihr könnt #N niemals#! mehr ein [GetScheme('study_scripture').GetTypeName]s-[scheme|E] beginnen"
 study_scripture_outcome.1010.t: "$study_scripture_title$Ein Geschenk aus Tinte"
 study_scripture_outcome.1010.desc: "Ein Paket kommt von [sender.GetTitledFirstName]."
 study_scripture_outcome.1010.end_christian: "Ein Bändchen markiert die Textstelle, an der ich bisher gescheitert bin:\n\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!\n\nEin großzügiges Geschenk – und ein nützliches."
 study_scripture_outcome.1010.end: "In ihm liegt ein fein gebundenes Andachtsbuch, und seine Seiten sind mit Gebeten, Anmerkungen und sorgfältigen Bebilderungen gefüllt.\n\nEin großzügiges Geschenk – und ein nützliches. Die Antworten, die sich mir entzogen, könnten bereits zwischen diesen Seiten liegen."
 study_scripture_outcome.1010.a: "Ich werde dieses Geschenk weise nutzen."
 study_scripture_outcome.1010.b: "Ein schönes Buch. Es wird gut auf meinem Regal aussehen."
 pam_ss_devotional_book_name: "Andachtsbuch"
 pam_ss_devotional_book_description: "Ein illuminierter Band mit heiligen Texten und Anmerkungen, kopiert und vergoldet mit offenkundiger Hingabe. Ein Bändchen markiert die Textstelle, die sein Empfänger am dringlichsten lesen muss."
 study_scripture_outcome.1020.t: "$study_scripture_title$Kasteiung des Fleisches"
 study_scripture_outcome.1020.desc: "Heute bezwingt mich der Text, so wie er es letzte Nacht tat und die Nacht davor. Meine Blicke wandern umher. Mein Geist denkt an das Abendessen, an mein Bett, an alles andere als die Doktrin.\n\nDer Leib ist das Hindernis. Die alten Asketen wussten es: Bequemlichkeit ist der leiseste Diener der bösen Mächte ([ROOT.Char.GetFaith.DevilName]), und Hunger schärft die Seele. Vielleicht muss sich das Fleisch beugen, bevor der Verstand voranschreiten kann."
 study_scripture_outcome.1020.a: "Die Geißel wird meinen Geist schärfen."
 study_scripture_outcome.1020.b: "Hungert den Leib aus und nährt die Seele."
 study_scripture_outcome.1020.c: "Oder vielleicht ein feines Abendessen, mein Bett und morgen früh ein frischer Beginn."
 study_scripture_outcome.1030.t: "$study_scripture_title$Rückzug ins Kloster"
 study_scripture_outcome.1030.desc: "Meine Studien stocken. Derselbe Tisch, dieselbe Kerze, dieselben Niederlagen. Mein[counselor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', counselor)], [counselor.GetTitledFirstName] hingegen verfügt über eine Hingabe, die nichts Ebenbürtiges kennt.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "„Ihr bringt zu viele Mauern mit Euch“, sagt [counselor.GetFirstNameNoTooltip] und deutet auf die nackte Zelle mit ihrer einzigen Lichtquelle und all der Stille. „Die alten Eremiten wussten es: Nehmt alles weg, und was bleibt, ist das, wonach Ihr suchtet.“"
 study_scripture_outcome.1030.desc_monastery: "„Ihr lest, wie die Herrscher es tun“, sagt [counselor.GetFirstNameNoTooltip] nicht unfreundlich. „Ihr wollt die Seiten erobern und sie wie Steuern zählen. Hier lesen wie dieselbe Zeile eine ganze Woche lang, bis sie schließlich uns liest.“"
 study_scripture_outcome.1030.a: "Vereinbart eine Segnung für mein Studierzimmer."
 study_scripture_outcome.1030.b: "Dann werde ich dieselbe Zeile zwei Wochen lang lesen."
 study_scripture_outcome.1030.c: "Ich werde darüber beten und es dabei belassen."
 study_scripture_outcome.1040.t: "$study_scripture_title$Ein zweites Paar Hände"
 study_scripture_outcome.1040.desc_acolyte: "Ich fragte nicht nach Hilfe. Sie kam dennoch. Mein[helper.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', helper)] [helper.GetTitledFirstName] sortierte meine Anmerkungen, fand den richtigen Kommentar und kürzte meine Kerze. [helper.Custom('DE_PRO_PER_S_3P_N')|U] erlernte stillschweigend meine Gewohnheiten – und sogar, welche Textstellen mich zum Aufseufzen bringen.\n\n„Ihr betet besser, wenn Ihr ausgeruht seid“, sagt [helper.Custom('DE_PRO_PER_S_3P_N')] einfach und stellt einen Teller mit warmem Essen ([helper.Custom('GetLocalStreetFood')]) neben meine Notizen."
 study_scripture_outcome.1040.desc_partner: "Mein[helper.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', helper)] [helper.GetTitledFirstName] kommt herein, nimmt den Kodex aus meinen Händen und liest die Zeile laut. Die Worte sind heilig. Höchste Macht ([ROOT.Char.GetFaith.HighGodName]), vergib mir – heute finde ich [helper.Custom('DE_PRO_POS_S_3P')]e Gestalt ([helper.Custom('ObjectifiedFeature')]) noch heiliger.\n\n„Lasst mich helfen“ murmelt [helper.Custom('DE_PRO_PER_S_3P_N')], nahe genug, um die Wärme der Kerze zu teilen. „Ich wünsche es.“"
 study_scripture_outcome.1040.a: "Dann lasst Euch von mir bis zum Morgengrauen diktieren. Wir beenden diese Sache."
 study_scripture_outcome.1040.b: "Dann verbringen wir also eine Stunde zusammen."
 study_scripture_outcome.1040.c: "Die Freundlichkeit ist Hilfe genug."
 study_scripture_outcome.1040.d: "Kommt näher. Die Kerze reicht nicht so weit …."
 study_scripture_outcome.1050.t: "$study_scripture_title$Die dunkle Nacht der Seele"
 study_scripture_outcome.1050.desc: "Ich habe zu lange gelesen. Irgendwann nach Mitternacht wurden aus den Antworten Fragen und aus der Gewissheit Zweifel.\n\n"
 study_scripture_outcome.1050.desc_quote: "Ich bin nicht der erste Mensch, der sich solchem Schweigen gegenübersieht. #EMP „Mein Gott, mein Gott, warum hast du mich verlassen?“#!\n\nDie Kerze brennt. Die Stille bleibt. Was nun?"
 study_scripture_outcome.1050.desc_generic: "Die Heiligen jedes Zeitalzers kannten diese Zweifel – die Stunde, wenn die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) den Atem anhält und einfach nicht verraten will, warum.\n\nDie Kerze brennt. Die Stille bleibt. Was nun?"
 study_scripture_outcome.1050.a: "Zweifel ist ein Text wie jeder andere."
 study_scripture_outcome.1050.b: "Vielleicht ist die Stille die Antwort."
 study_scripture_outcome.1050.c: "Vergangene Worte, vergangene Zweifel – hinein in das Mysterium selbst."
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString(order_head.IsFemale,'Schwestern', 'Brüder')] der Ordensregel"
 study_scripture_outcome.1060.desc_house: "Mir fällt alles schwer, und ich habe wenig von Wert gelernt. Die Kunde davon erreicht das Oberhaupt ([order_head.GetPrimaryTitle.GetNameNoTier]), dessen Orden ein Haus in [order_house_county.GetNameNoTier] hat. Heute kommt sein Wagen in meinem Hof quietschend zum Stillstand: kopierte Kommentare, eine Kiste voller Kerzen und ein Brief mit dem Siegel von [order_head.GetTitledFirstName].\n\n„Kein Hirte studiert allein, solange die Ordensregel gilt. Ihr braucht es nur zu sagen, und was uns gehört, gehört auch Euch.“"
 study_scripture_outcome.1060.desc_far: "Die Kunde über meine Schwierigkeiten reiste weit: den ganzen Weg zum Oberhaupt ([order_head.GetPrimaryTitle.GetNameNoTier]). Heute hält der Wagen quietschend in meinem Hof: kopierte Kommentare, eine Kiste voller Kerzen und ein Brief mit dem Siegel von [order_head.GetTitledFirstName].\n\n„Kein Hirte studiert allein, solange die Ordensregel gilt. Ihr braucht es nur zu sagen, und was uns gehört, gehört auch Euch.“"
 study_scripture_outcome.1060.a: "Mein Dank an jede Hand, die die Kopien erstellte."
 study_scripture_outcome.1060.b: "Schickt mir jemanden von Eurem gebildeten Klerus."
 study_scripture_outcome.1060.c: "Möge die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) sie behalten."
 pam_ss_lettered_brother_tt: "Ein #EMP gebildeter Kleriker#! aus dem Orden kommt an Euren [court|E]"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U] kommt vom Oberhaupt ([order_head.GetPrimaryTitle.GetNameNoTier])"
