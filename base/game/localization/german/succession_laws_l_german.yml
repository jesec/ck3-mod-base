l_german:
 succession_order_laws: "[succession_laws|E]"
 succession_order_laws_singular: "[succession_law|E]"
 partition_succession_law: "Erbteilung"
 partition_succession_law_subname: "Alle Kinder erben zu gleichen Teilen"
 partition_succession_law_effects: "\nBei der $partition_succession_law$s-[succession|E], werden Eure [titles|E] gleichmäßig unter Euren Kindern aufgeteilt.\n\n#weak $partition_base_desc$#!"
 partition_base_desc: "#weak Im Nachfolgefall werden sämtliche gehaltenen [titles|E] des verstorbenen [Concept('ruler', 'Herrschers')|E] unter dessen [Concept('eligible_children', 'erbberechtigten Kindern')|E] aufgeteilt, wobei der [player_heir|E] immer den [primary_title|E], den [realm_capital|E] und alle direkt damit verbundenen [de_jure|E]-Titel erhält.\n\nJüngere Kinder erhalten dann Titel beginnend mit denen im selben [rank|E] des Haupttitels; falls keine verfügbar sind, erhalten sie niederrangigere Titel. Euer Spielererbe kann im Vorfeld keine Titel erhalten, die er nicht auch erben würde.\n#!"
 high_partition_succession_law: "Großteilung"
 high_partition_succession_law_subname: "Alle Kinder erben"
 high_partition_succession_law_effects: "\nBei $high_partition_succession_law$s-[succession|E] geht der Löwenanteil der [titles|E] an Euren [Concept('player_heir', 'Spielererben')|E] – der Rest wird unter Euren Kindern aufgeteilt.\n\n#weak $partition_base_desc$\nDer Spielererbe erbt #emp immer#! mindestens die Hälfte der Titel des verstorbenen Herrschers.\n#!"
 confederate_partition_succession_law: "Bundteilung"
 confederate_partition_succession_law_subname: "Alle Kinder erben gleichteilig"
 confederate_partition_succession_law_effects: "\nGilt $confederate_partition_succession_law$, werden Eure [titles|E] gleichmäßig unter Euren Kindern aufgeteilt. Neue Titel können für jüngere [realm_heirs|E] geschaffen werden.\n\n#weak $partition_base_desc$\nFür jüngere Kinder werden Titel erschaffen, sofern genug Landbesitz vorhanden ist.\n\n#!#X Stammesherrscher sind auf diese Nachfolge-Art festgelegt.#!\n"
 single_heir_succession_law: "Primogenitur"
 single_heir_succession_law_subname: "Ältestes Kind erbt"
 single_heir_succession_law_effects: "\nBei der $single_heir_succession_law$-[succession|E] erbt Euer ältestes Kind all Eure [titles|E].\n\n#weak Im Nachfolgefall gehen sämtliche [titles|E] des verstorbenen Herrschers an den [Concept('player_heir', 'Spielererben')|E], der immer das älteste [Concept('eligible_child', 'erbberechtigte Kind')|E] ist. Jüngere Kinder erhalten nichts.\n#!"
 single_heir_succession_law_youngest: "Ultimogenitur"
 single_heir_succession_law_youngest_subname: "Jüngstes Kind erbt"
 single_heir_succession_law_youngest_effects: "\nBei der $single_heir_succession_law_youngest$-[succession|E] erbt Euer jüngstes Kind all Eure [titles|E].\n\n#weak Im Nachfolgefall gehen sämtliche [titles|E] des verstorbenen Herrschers an den [Concept('player_heir', 'Spielererben')|E], der immer das jüngste [Concept('eligible_child', 'erbberechtigte Kind')|E] ist. Ältere Kinder erhalten nichts.\n#!"
 single_heir_dynasty_house: "Haus-Senex"
 single_heir_dynasty_house_subname: "Ältestes [house|E]-Mitglied erbt"
 single_heir_dynasty_house_effects: "\nBei der $single_heir_dynasty_house$-[succession|E] erbt das älteste Mitglied Eures [Concept('house', 'Hauses')|E] all Eure [titles|E].\n\n#weak Im Nachfolgefall gehen sämtliche [titles|E] des verstorbenen Herrschers an das älteste erbberechtigte Mitglied seines [Concept('house', 'Hauses')|E]. Kinder erhalten nichts, wenn sie nicht das älteste Hausmitglied sind.\n#!"
 same_faith_theocratic_succession_law: "Selber Glaube"
 same_faith_theocratic_succession_law_effects: "Nur Charaktere desselben [Concept('faith', 'Glaubens')|E] wie der derzeitige [ruler|E] können erben."
 same_faith_only_law: "$same_faith_theocratic_succession_law$"
 same_faith_only_law_effects: "$same_faith_theocratic_succession_law_effects$"
 bishop_theocratic_succession_law: "Theokratisch"
 bishop_theocratic_succession_law_effects: "Im Nachfolgefall gehen sämtliche [titles|E] des [Concept('realm_priest', 'Reichspriesters')|E] an dessen [Concept('primary_heir', 'Haupterben')|E]. Die Doktrinen ihres [Concept('faith', 'Glaubens')|E] legen fest, wer dieser Nachfolger sein wird."
 temporal_head_of_faith_succession_law: "Weltlich theokratisch"
 temporal_head_of_faith_succession_law_effects: "The [temporal_head_of_faith|E]-[title|E] wird an den [Concept('player_heir', 'Spielererben')|E] des derzeitigen [Concept('head_of_faith', 'Glaubensoberhaupts')|E] weitergegeben."
 succession_laws_must_not_be_temporal: "Darf kein [temporal_head_of_faith|E]-[title|E] sein."
 holy_order_succession_law: "Kriegerorden"
 holy_order_succession_law_effects: "Im Nachfolgefall gehen sämtliche [titles|E] des Großmeisters an dessen Nachfolger, der in der Regel der [knight|E] mit dem höchsten [martial|E]-Wert ist."
 cultural_holy_order_succession_law: "Kultureller Kriegerorden"
