 tribal_elective_candidates_tooltip: "Um bei der Dschirga ein zulässiger Kandidat zu sein, muss ein Charakter eine der folgenden Bedingungen erfüllen:\n$EFFECT_LIST_BULLET$Ist legitimes Mitglied der [dynasty|E] des Herrschers und steht nicht in der Nachfolge für eine Theokratie oder Republik. Kinder eines Kandidaten können nicht nominiert werden\n$EFFECT_LIST_BULLET$Ist [claimant|E] auf den Titel und steht nicht in der Nachfolge für eine Theokratie oder Republik\n$EFFECT_LIST_BULLET$Ist [direct_vassal|E] des Titels"
