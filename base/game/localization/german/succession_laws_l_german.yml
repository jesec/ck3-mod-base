 male_preference_law_effects: "$EFFECT_LIST_BULLET$Männer werden bei der Nachfolge Frauen gegenüber bevorzugt\n$EFFECT_LIST_BULLET$Männliche [rulers|E] können [concubines|E] oder mehrere [spouses|E] haben, falls ihr [faith|E] die [doctrine|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]“ oder „[GetDoctrineType('doctrine_polygamy').GetBaseName]“ aufweist"
 equal_law_effects: "$EFFECT_LIST_BULLET$Männer und Frauen werden bei der Nachfolge gleich behandelt\n$EFFECT_LIST_BULLET$[rulers|E] können [concubines|E] oder mehrere [spouses|E] haben, falls ihr [faith|E] die [doctrine|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]“ oder „[GetDoctrineType('doctrine_polygamy').GetBaseName]“ aufweist"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$Frauen werden bei der Nachfolge Männern gegenüber bevorzugt\n$EFFECT_LIST_BULLET$Weibliche [rulers|E] können [concubines|E] oder mehrere [spouses|E] haben, falls ihr [faith|E] die „[doctrine|E] [GetDoctrineType('doctrine_concubines').GetBaseName]“ oder „[GetDoctrineType('doctrine_polygamy').GetBaseName]“ aufweist"
 female_only_law_effects: "$EFFECT_LIST_BULLET$Männer erhalten keine Erbberechtigung\n$EFFECT_LIST_BULLET$Männer können keine [claims|E] erben\n$EFFECT_LIST_BULLET$Weibliche [rulers|E] können [concubines|E] oder mehrere [spouses|E] haben, falls ihr [faith|E] die [doctrine|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]“ oder „[GetDoctrineType('doctrine_polygamy').GetBaseName]“ aufweist"
