 monastic_holy_order_succession_law: "Klosterorden"
 monastic_holy_order_succession_law_effects: "Im Nachfolgefall gehen sämtliche [titles|E] des Erzabts an dessen Nachfolger, der in der Regel der [courtier|E] mit dem höchsten [Concept('learning', 'Bildungs')|E]-Wert ist. Nur Charaktere mit demselben [rite|E] wie der derzeitige [ruler|E] können erben."
 female_monastic_holy_order_succession_law: "Klosterorden (weiblich)"
 female_monastic_holy_order_succession_law_effects: "Im Nachfolgefall gehen sämtliche [titles|E] der Erzäbtissin an ihre Nachfolgerin, die in der Regel der weibliche [Concept('courtier', 'Höfling')|E] mit dem höchsten [Concept('learning', 'Bildungs')|E]-Wert ist. Nur Charaktere mit demselben [rite|E] wie der derzeitige [ruler|E] können erben."
