 mandala_succession_law_subname: "Mandala-Nachfolge"
 mandala_succession_law_effects: "Die $mandala_succession_law$ erlaubt es Eurem ältesten Kind, Eure [titles|E] zu erben.\n\nIm Anschluss an die Nachfolge wird der neue Herrscher [mandala_trials|E] bestehen müssen, um die Kontrolle über das ganze Reich und dessen [tributaries|E] zu wahren.\n\n"
 celestial_appointment_succession_law: "Himmlische Ernennungsnachfolge"
 celestial_appointment_succession_law_subname: "Kandidat mit den höchsten Punkten erbt"
 celestial_appointment_succession_law_effects: "\nDie [succession|E] beruht auf [merit_level|E] und [merit_pools|E]\n\nEine Art der [appointment_succession_law|E]. Bei der Himmlischen Ernennungsnachfolge werden der [title|E] und dazugehörige [holdings|E] vom Kandidaten mit dem höchsten [candidate_score|E] geerbt. Jeder [Concept('adult', 'Erwachsene')|E] im [realm|E] kann danach streben, ein [governorship|E] zu erlangen. Die Mittel dafür reichen von einem beträchtlichen [merit_level|E] bis zum Einsatz von [influence|E].\n\n"
 celestial_military_appointment_succession_law: "Himmlische Befehlshabernachfolge"
 celestial_military_appointment_succession_law_subname: "Kandidat mit den höchsten [Concept('martial', 'Kriegsführungs')|E]-Fähigkeiten erbt"
 celestial_military_appointment_succession_law_effects: "\nDie [succession|E] beruht auf [merit_level|E] und [merit_pools|E]\n\nEine Art der [appointment_succession_law|E]. Bei der Himmlischen Befehlshabernachfolge werden der [title|E] und dazugehörige [holdings|E] vom Kandidaten mit dem höchsten [candidate_score|E] geerbt. Jeder [Concept('adult', 'Erwachsene')|E] im [realm|E] kann danach streben, ein militärisches [governorship|E] zu erlangen, indem man einen guten [martial_skill|E] hat, [commander_traits|E] erwirbt oder [influence|E] einsetzt.\n\n"
