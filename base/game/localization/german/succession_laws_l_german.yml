 meritocratic_military_appointment_succession_law_effects: "\nEine Art der [appointment_succession_law|E]. Bei der meritokratischen Befehlshabernachfolge werden der [title|E] und dazugehörige [holdings|E] vom Kandidaten mit dem höchsten [candidate_score|E] geerbt. Jeder [Concept('adult', 'Erwachsene')|E] im [realm|E] kann danach streben, ein militärisches [governorship|E] zu erlangen, indem man einen guten [martial_skill|E] hat, [commander_traits|E] erwirbt oder [influence|E] einsetzt.\n\n"
 #Meritocratic Acclamation Succession Law (Korea, TGP)
 meritocratic_regency_succession_law: "Meritokratische Regentschaftsnachfolge"
 meritocratic_regency_succession_law_subname: "$appointment_succession_law_subname$"
 meritocratic_regency_succession_law_effects: "Gilt die $meritocratic_regency_succession_law$, werden der [title|E] sowie die dazugehörigen [holdings|E] an den Kanditen mit den höchsten Punkten vererbt. Der Kandidatenvorrat beinhaltet [noble_families|E] und [governors|E] des Reichs nebst deren Familienmitgliedern."
 #PAM
 clerical_appointment_law: "Klerikale Ernennung"
 clerical_appointment_law_subname: "$clerical_appointment_succession_law$"
 clerical_appointment_law_effects: "\nEine Art der [appointment_succession_law|E], die von [Concept('christian', 'christlichen')|E] [Concept('ecclesiastical', 'kirchlichen')|E] und [Concept('theocratic', 'theokratischen')|E] [governments|E] verwendet wird. Hierbei werden [title|E] und dazugehörige [holdings|E] vom Kandidaten mit dem höchsten [candidate_score|E] geerbt.\n\nJeder [Concept('adult', 'Erwachsene')|E] desselben [Concept('faith', 'Glaubens')|E] aus der [Concept('close_family', 'nahen Verwandtschaft')|E] [holder_possessive|E] oder aus dessen [house|E] sowie [councillors|E], [court_position|E]-Trägers, [vassals|E] oder [clerical_region|E]-[clergy|E] können alle danach streben, den Titel zu erlangen, indem sie [piety|E] einsetzen.\n"
 clerical_appointment_succession_law: "Kandidat mit den höchsten Punkten erbt"
 theocratic_elective_succession_law: "Theokratiewahl"
 theocratic_elective_succession_law_subname: "Kardinalskollegium"
 theocratic_elective_succession_law_effects: "\nDie [cardinals|E] des [Concept('college_of_cardinals', 'Kardinalskollegiums')|E] wählen einen [Concept('title_heir', 'Titelerben')|E] aus ihren Reihen: Jeder Kardinal ist [Concept('elector', 'Wahlmann')|E] und Kandidat zugleich. Kardinäle mit dem höchsten [papabile_score|E] erhalten wahrscheinlich mehr Stimmen."
 theocratic_elective_candidates: "Kardinäle"
 theocratic_elective_candidates_tooltip: "Um bei der $theocratic_elective_succession_law$ ein zulässiger Kandidat zu sein, muss ein Charakter ein [cardinal|E] des [Concept('college_of_cardinals', 'Kardinalskollegiums')|E] sein."
 theocratic_elective_electors: "Das Kardinalskollegium"
 theocratic_elective_electors_tooltip: "Um bei der $theocratic_elective_succession_law$ ein zulässiger [Concept('elector', 'Wahlmann')|E] zu sein, muss ein Charakter ein [cardinal|E] des [Concept('college_of_cardinals', 'Kardinalskollegiums')|E] sein."
