l_german:
 msg_passive_learned_rite: "Ritus erlernt: [LEFT_CHARACTER.GetRite.GetNameNoTooltip]"
 msg_passive_learned_rite_desc: "Nachdem [Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] lange von Euch beobachtet wurde, habt Ihr [agnostic_knowledge|E] über die [core_tenets|E] und [doctrines|E] eines [rite|E] ([passive_learn_source.GetRite.GetName]) erlangt."
 msg_passive_learned_tenet: "Grundsatz erlernt: [RIGHT_TENET.GetBaseNameNoTooltip]"
 msg_passive_learned_tenet_desc: "Nachdem [Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] von Euch beim Praktizieren eines [Concept('core_tenet', 'Grundsatzes')|E] ([passive_learn_tenet.GetBaseName]) eines [rite|E] ([passive_learn_source.GetRite.GetName]) beobachtet wurde, habt Ihr selbst [agnostic_knowledge|E] darüber erlangt."
 msg_passive_learned_tenet_special: "$msg_passive_learned_tenet$"
 msg_passive_learned_tenet_special_desc: "$msg_passive_learned_tenet_desc$"
 msg_passive_learned_tenet_cranial_trophies_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] behält einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] bei, und dadurch habt Ihr [agnostic_knowledge|E] von seinem finsteren Zweck erlangt."
 msg_passive_learned_tenet_ritual_cannibalism_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] ehrt einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E], und Ihr habt [agnostic_knowledge|E] über seine Bedingungen erlangt."
 msg_passive_learned_tenet_human_sacrifice_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] führte in Eurer Gegenwart einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] durch, und Ihr habt [agnostic_knowledge|E] davon erlangt."
 msg_passive_learned_tenet_warmonger_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] lebt nach einem der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E], und Ihr habt [agnostic_knowledge|E] über seine Logik erlangt."
 msg_passive_learned_tenet_takamin_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] praktiziert einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] täglich, und Ihr habt [agnostic_knowledge|E] über seine Abläufe erlangt."
 msg_passive_learned_tenet_exaltation_of_pain_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] wurde von Euch beobachtet, und Ihr habt [agnostic_knowledge|E] über einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] erlangt – auch wenn er verstörend ist."
 msg_passive_learned_tenet_sacrificial_ceremonies_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] führte einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] Schritt für Schritt vor, und Ihr habt [agnostic_knowledge|E] davon erlangt."
 msg_passive_learned_tenet_gruesome_festivals_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] zeigte einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] in all seinem Spektakel, und Ihr habt [agnostic_knowledge|E] davon erlangt."
 msg_passive_learned_tenet_adorcism_desc: "Nachdem [Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] von Euch beobachtet wurde, habt Ihr zu [passive_learn_source.Custom('DE_PRO_POS_S_3P')]en Bedingungen [agnostic_knowledge|E] über einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E] erlangt."
 msg_passive_learned_tenet_hedonistic_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] feiert nach einem der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [rite|E], und Ihr habt [agnostic_knowledge|E] über seine Anziehung erlangt."
 msg_passive_learned_doctrine: "Doktrin erlernt: [RIGHT_DOCTRINE.GetDescriptiveNameNoTooltip(GetPlayer.GetFaith)]"
 msg_passive_learned_doctrine_desc: "Nachdem [Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] beim Leben nach einer [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]) des [passive_learn_source.GetRite.GetName] von Euch beobachtet wurde, habt Ihr selbst [agnostic_knowledge|E] darüber erlangt."
 msg_passive_learned_doctrine_polygamy_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] lebt nach einer seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und Ihr habt [agnostic_knowledge|E] über ihr Wirken erlangt."
 msg_passive_learned_doctrine_concubines_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] hält sich an eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und Ihr habt [agnostic_knowledge|E] über die Denkweise dahinter erlangt."
 msg_passive_learned_doctrine_consanguinity_unrestricted_desc: "Nachdem [Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] von Euch beobachtet wurde, habt Ihr [agnostic_knowledge|E] über eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]) erlangt und sie erscheint Euch nicht mehr so seltsam wie einst."
 msg_passive_learned_doctrine_deviancy_virtuous_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] praktiziert offen eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und Ihr habt [agnostic_knowledge|E] über ihre Bedingungen erlangt."
 msg_passive_learned_doctrine_kinslaying_accepted_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] lehrte Euch in einer schaurigen Lektion eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und Ihr habt [agnostic_knowledge|E] darüber erlangt."
 msg_passive_learned_doctrine_witchcraft_virtuous_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] hält sich eng an eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und so habt Ihr [agnostic_knowledge|E] darüber erlangt."
 msg_passive_learned_doctrine_funeral_sky_burial_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] beachtet eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und Ihr habt [agnostic_knowledge|E] über ihre Bedeutung erlangt."
 msg_passive_learned_doctrine_funeral_mummification_desc: "[Select_CString(passive_learn_source.IsFemale, 'Eure', 'Euer')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vom [passive_learn_source.GetRite.GetName] hält sich an eine seiner [Concept('doctrine', 'Doktrinen')|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)]), und Ihr habt [agnostic_knowledge|E] über ihre Wege erlangt."
 message_filter_passive_religious_learning: "@religious_icon! Passives Religionswissen"
 message_filter_passive_religious_learning_desc: "Ihr habt passiv einen [core_tenet|E], eine [doctrine|E] oder einen ganzen [rite|E] durch nahe Verwandte oder einen Höfling eines fremdländischen [Concept('faith', 'Glaubens')|E] erlernt"
 clerical_justifications_perk_passive_learning_effect: "Passiv einen [core_tenet|E], eine [doctrine|E] oder einen ganzen [rite|E] durch nahe Verwandte #weak (Ehepartner, Freunde und so weiter)#! und durch [Concept('traveling', 'Reisen')|E] doppelt so oft erlernen"
 apa_passive_religious_learning_host_title: "[first.GetShortUINameNoTooltip|U] praktiziert den eigenen [rite|E]"
 apa_passive_religious_learning_host_tt: "Ihr beobachtet [first.GetShortUIName] beim Praktizieren des [first.GetRite.GetName]"
 apa_passive_religious_learning_guest_title: "[first.GetShortUINameNoTooltip] praktiziert den eigenen [rite|E]"
 apa_passive_religious_learning_guest_tt: "Ihr beobachtet [first.GetShortUIName] beim Praktizieren des [first.GetRite.GetName]"
 apa_passive_religious_learning_pilgrimage_pool_title: "Lehren von [first.GetShortUINameNoTooltip]"
 apa_passive_religious_learning_pilgrimage_pool_tt: "Ihr beobachtet [first.GetShortUIName], jemand Einheimischen, beim Praktizieren des [first.GetRite.GetName]"
 apa_passive_religious_learning_pilgrimage_rite_title: "Der örtliche [rite|E]"
 apa_passive_religious_learning_pilgrimage_rite_tt: "Ihr schaut den Einheimischen beim Praktizieren des [passive_learn_rite.GetName] zu"
 ### HoR passive learning
 msg_hor_learned_tenet_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] gewährte Euch das Studium des benachbarten [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] [agnostic_knowledge|E] über einen [core_tenet|E] ([passive_learn_tenet.GetBaseName])."
 msg_hor_learned_doctrine_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] gewährte Euch das Studium des benachbarten [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] [agnostic_knowledge|E] über eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)])."
 msg_hor_learned_tenet_cranial_trophies_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] studiertet Ihr einen [core_tenet|E] ([passive_learn_tenet.GetBaseName]) des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] und zeichnetet seine finsteren Zwecke auf, wodurch Ihr [agnostic_knowledge|E] über ihn erlangtet."
 msg_hor_learned_tenet_ritual_cannibalism_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] beobachtetet Ihr einen [core_tenet|E] ([passive_learn_tenet.GetBaseName]) des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] zu seinen Bedingungen, wodurch Ihr [agnostic_knowledge|E] über ihn erlangtet."
 msg_hor_learned_tenet_human_sacrifice_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] katalogisiertet Ihr einen [core_tenet|E] ([passive_learn_tenet.GetBaseName]), wie ihn der [passive_learn_source_faith.GetAdjective|l]e [faith|E] praktiziert, wodurch Ihr [agnostic_knowledge|E] über ihn erlangtet."
 msg_hor_learned_tenet_warmonger_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] studiertet Ihr, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] einen [core_tenet|E] ([passive_learn_tenet.GetBaseName]) praktisch umsetzt, wodurch Ihr [agnostic_knowledge|E] über ihn erhieltet."
 msg_hor_learned_tenet_takamin_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] katalogisiertert Ihr die täglichen Abläufe eines [Concept('core_tenet', 'Grundsatzes')|E] ([passive_learn_tenet.GetBaseName]), wie ihn der [passive_learn_source_faith.GetAdjective|l]e [faith|E] praktiziert, wodurch Ihr [agnostic_knowledge|E] über ihn erlangtet."
 msg_hor_learned_tenet_exaltation_of_pain_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] lehrte Euch das Studium des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] einen – stellenweise verstörenden – [core_tenet|E] ([passive_learn_tenet.GetBaseName]), und damit gewannt Ihr auch [agnostic_knowledge|E] über ihn."
 msg_hor_learned_tenet_sacrificial_ceremonies_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] zeichnetet Ihr einen [core_tenet|E] ([passive_learn_tenet.GetBaseName]) des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] Schritt für Schritt auf, wodurch Ihr [agnostic_knowledge|E] über ihn erlangtet."
 msg_hor_learned_tenet_gruesome_festivals_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] erlebtet Ihr den [core_tenet|E] ([passive_learn_tenet.GetBaseName]) des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] in Gänze mit, wodurch Ihr [agnostic_knowledge|E] über ihn erlangtet."
 msg_hor_learned_tenet_adorcism_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] beobachtetet Ihr, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] einen [core_tenet|E] ([passive_learn_tenet.GetBaseName]) erfüllt, wodurch Ihr [agnostic_knowledge|E] über ihn erhieltet."
 msg_hor_learned_tenet_hedonistic_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] offenbarte Euch das Studium des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] [agnostic_knowledge|E] über die Anziehung, die von einem [core_tenet|E] ([passive_learn_tenet.GetBaseName]) ausgeht."
 msg_hor_learned_doctrine_polygamy_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] studiertet Ihr, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] seine Haushalte nach einer bestimmten [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) ordnet, wodurch Ihr [agnostic_knowledge|E] über sie erhieltet."
 msg_hor_learned_doctrine_concubines_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] erfuhrt Ihr, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) begründet, wodurch Ihr [agnostic_knowledge|E] über sie erhieltet."
 msg_hor_learned_doctrine_consanguinity_unrestricted_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] ist Euch durch Eure Deutung des [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) nicht mehr fremdartig, und Ihr erlangtet [agnostic_knowledge|E] über sie."
 msg_hor_learned_doctrine_deviancy_virtuous_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] beobachtetet Ihr, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] offen eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) praktiziert, wodurch Ihr zu ihren Bedingungen [agnostic_knowledge|E] über sie erhieltet."
 msg_hor_learned_doctrine_kinslaying_accepted_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] durchdrangt Ihr mit deutlichem Unbehagen, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) rechtfertigt, wodurch Ihr [agnostic_knowledge|E] über sie erhieltet."
 msg_hor_learned_doctrine_witchcraft_virtuous_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] studiertet, wie der [passive_learn_source_faith.GetAdjective|l]e [faith|E] sich eng an eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) hält, wodurch Ihr [agnostic_knowledge|E] über sie erhieltet."
 msg_hor_learned_doctrine_funeral_sky_burial_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] beobachtetet Ihr, wie eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) durch den [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glauben')|E] praktiziert wird, wodurch Ihr [agnostic_knowledge|E] über ihre Bedeutung erlangtet."
 msg_hor_learned_doctrine_funeral_mummification_desc: "Als Oberhaupt des [passive_learn_hor.GetRite.GetName] studiertet Ihr, wie eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source_faith.Self)]) durch den [passive_learn_source_faith.GetAdjective|l]en [Concept('faith', 'Glauben')|E] praktiziert wird, wodurch Ihr [agnostic_knowledge|E] ihre Gebräuche erlangtet."
