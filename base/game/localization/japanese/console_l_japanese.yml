l_japanese:
 # None of these need to be translated, it's just that they can look a bit nicer in here where we can format them instead of doing raw tooltips
 control_console_button_tooltip: "左クリック：[GetPlayer.GetCapitalLocation.GetCounty.GetName]の統制度が25上昇\n左クリック+Shift：所有するすべての伯爵領の統制度が25上昇\n右クリック：[GetPlayer.GetCapitalLocation.GetCounty.GetName]の統制度が25低下\n右クリック+Shift：所有するすべての伯爵領の統制度が25低下"
 prosperity_console_button_tooltip: "左クリック：[GetPlayer.GetCapitalLocation.GetCounty.GetName]の繁栄度が5上昇\n左クリック+Shift：所有するすべての伯爵領の繁栄度が5上昇\n右クリック：[GetPlayer.GetCapitalLocation.GetCounty.GetName]の繁栄度が5低下\n右クリック+Shift：所有するすべての伯爵領の繁栄度が5低下"
 popular_opinion_console_button_tooltip: "左クリック：[GetPlayer.GetCapitalLocation.GetCounty.GetName]の領民の好感度が5上昇\n左クリック+Shift：所有するすべての伯爵領の領民の好感度が5上昇\n右クリック：[GetPlayer.GetCapitalLocation.GetCounty.GetName]の領民の好感度が5低下\n右クリック+Shift：所有するすべての伯爵領の領民の好感度が5低下"
 size_console_button_tooltip: "左クリック：[GetPlayer.GetCapitalLocation.GetNameNoTooltip]の規模が1上昇\n左クリック+Shift：直轄領内のすべての属州の規模が1上昇\n右クリック：[GetPlayer.GetCapitalLocation.GetNameNoTooltip]の規模が1低下\n右クリック+Shift：直轄領内のすべての属州の規模が1低下"
