 #Situation Regions
 guelph_ghibelline_sub_region_core: "帝国領"
 guelph_ghibelline_sub_region_core_desc: "[GetTitleByKey('e_hre').GetDefinitiveName|l]のイタリアおよびドイツの[kingdoms|E]に属するすべての[counties|E]。ここでは[guelphs|E]と[ghibellines|E]が争っている。"
 #Participant Groups
 gg_leader_group_help: "#help \n\nいずれかの側の指導者が不在になった場合、その党派は敗北し、状況は相手側に有利な形で終結します。#!"
 guelph_ghibelline_participant_group_guelph_leader: "$guelph$指導者"
 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main' )]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "[GetSituation('guelph_ghibelline').GetName]の[situation|E]における[guelphs|E]の指導者。\n\n[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]と[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]の序章の[situation_phase|E]で、$religiousheadname_pope$が[guelphs|E]を率い、歴史上の流れに沿って争いが激化していく。指導者自身の[decisions|E]は、序章が本格的な対立へ移行してから利用可能になる。$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "[GetSituation('guelph_ghibelline').GetName]の[situation|E]における[guelphs|E]の指導者。\n\nこの指導者は、争いの行方を左右する固有の[decisions|E]を使用できる：\n$BULLET_WITH_TAB$「#V $guelph_ghibelline_peace_decision$#!」および「#V $guelph_ghibelline_conflict_decision$#!」によって、[situation|E]をより平穏な[situation_phase|E]と対立が激しい[situation_phase|E]の間で移行させる\n$BULLET_WITH_TAB$「#V $guelph_victory_decision$#!」によって、優勢に立っている[guelphs|E]の勝利で状況を終結させる\n$BULLET_WITH_TAB$[decisions|E]によって指導者を辞任し、適切な支持者に指導権を譲る$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "$ghibelline$指導者"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "[GetSituation('guelph_ghibelline').GetName]の[situation|E]における[ghibellines|E]の指導者。\n\n[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]と[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]の序章の[situation_phase|E]では、[GetTitleByKey('e_hre').GetName]の統治者が[ghibellines|E]を率い、歴史上の流れに沿って争いが激化していく。指導者自身の[decisions|E]は、序章が本格的な対立へ移行してから利用可能になる。$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "[GetSituation('guelph_ghibelline').GetName]の[situation|E]における[ghibellines|E]の指導者。\n\nこの指導者は、争いの行方を左右する固有の[decisions|E]を使用できる：\n$BULLET_WITH_TAB$「#V $guelph_ghibelline_peace_decision$#!」および「#V $guelph_ghibelline_conflict_decision$#!」によって、[situation|E]をより平穏な[situation_phase|E]と対立が激しい[situation_phase|E]の間で移行させる\n$BULLET_WITH_TAB$「#V $ghibelline_victory_decision$#!」によって、優勢に立っている[ghibellines|E]の勝利で状況を終結させる\n$BULLET_WITH_TAB$[decision|E]によって指導者を辞任し、適切な支持者に指導権を譲る$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_member: "$guelph$支持者"
 guelph_ghibelline_participant_group_guelph_member_desc: "[situation|E]「[GetSituation('guelph_ghibelline').GetName]」の[guelph|E]の支持者。"
 guelph_ghibelline_participant_group_ghibelline_member: "$ghibelline$支持者"
 guelph_ghibelline_participant_group_ghibelline_member_desc: "[situation|E]「[GetSituation('guelph_ghibelline').GetName]」の[ghibelline|E]の支持者。"
 guelph_ghibelline_participant_group_undecided: "無所属"
 guelph_ghibelline_participant_group_undecided_desc: "[situation|E]「[GetSituation('guelph_ghibelline').GetName]」で、どちらの側にも属していない勢力。適切な手段を用いれば、どちらの側にも引き入れられる可能性がある。\n\n[situation_catalysts|E]を#BOL 発生させず#!、[gg_involvement|E]を獲得する可能性も低い。"
 guelph_ghibelline_participant_group_outsider: "部外者"
 guelph_ghibelline_participant_group_outsider_desc: "[situation|E]「[GetSituation('guelph_ghibelline').GetName]」の部外者。通常は所領なしの冒険者およびその他の傭兵のタイプ。\n\n[situation_catalysts|E]を#BOL 発生させず#!、[gg_involvement|E]も#BOL 獲得しない#!。"
 guelph_ghibelline_all: "現在の[guelph_ghibelline_situation|E]の[situation_phase_phase|E]"
 guelph_ghibelline_guelph_leader: "[guelph_ghibelline_situation|E]の[situation_phase_phase|E]#weak （$PARTICIPANT_GROUP$）#!"
 guelph_ghibelline_guelph_member: "[guelph_ghibelline_situation|E]の[situation_phase_phase|E]#weak （$PARTICIPANT_GROUP$）#!"
 guelph_ghibelline_ghibelline_leader: "[guelph_ghibelline_situation|E]の[situation_phase_phase|E]#weak （$PARTICIPANT_GROUP$）#!"
 guelph_ghibelline_ghibelline_member: "[guelph_ghibelline_situation|E]の[situation_phase_phase|E]#weak （$PARTICIPANT_GROUP$）#!"
 #Situation Phases
