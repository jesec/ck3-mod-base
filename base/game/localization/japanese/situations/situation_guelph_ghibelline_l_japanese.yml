 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "主の御名において——$religiousheadname_pope$ニコラウス2世が1059年4月13日に公布した教皇勅書。当時の教皇選挙制度に大規模な改革をもたらした文書であり、そのうち特に重要なのは、選出と承認の過程から君主を排除し、枢機卿司教のみを教皇選挙人としたことである。"
 DICTATUS_PAPAE_GLOSS: "教皇訓令——$religiousheadname_pope$が主張する権威をまとめた27か条の宣言集。$religiousheadname_pope$グレゴリウス7世が、聖職叙任権闘争が勃発したのとほぼ同時期の1075年に口述したもの。"
