 precursor_situation_leader_help: "#help この[situation_phase_phase|E]では、[GetTitleByKey('e_hre').GetDefinitiveName|l]の統治者が[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('ghibelline_leader').GetName]であり、かつ$religiousheadname_pope$が[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('guelph_leader').GetName]である必要があります。#!"
 situation_guelph_ghibelline_phase_in_nomine_domini: "教皇の復権"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "この[GetSituation('guelph_ghibelline').GetName][situation_phase|E]は、差し迫った影響がほとんどない比較的平穏な時期である。\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "約[Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae') )|0V][Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1' ), '年', '年' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1' ), 'か月', 'か月' ) )]で状況は激化し、[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName][situation_phase_phase|E]へ移行する"
 gg_nomine_domini_transition_desc: "ディクタトゥス・パパエの原則の大半は（…）"
 dictatus_papae: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "ディクタトゥス・パパエ"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "この[GetSituation('guelph_ghibelline').GetName][situation_phase|E]は、これより前の[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]フェーズがさらに激化したものである。\n\n今や君主と教会制の封臣たちとの関係は硬化しつつある。封臣たちは、普遍的な権力を持っていると主張する$religiousheadname_pope$と、自らの主権を維持しようとする主君の間で板挟みになっている。\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "約[Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V][Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), '年', '年' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), 'か月', 'か月' ) )]で状況は激化し、[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]または[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]の[situation_phase_phase|E]へ移行する"
 gg_dictatus_papae_transition_desc: "ディクタトゥス・パパエの原則の大半は（…）"
 ad_interim: "$situation_guelph_ghibelline_phase_ad_interim$"
 ad_interim_desc: "$situation_guelph_ghibelline_phase_ad_interim_desc_short$"
 situation_guelph_ghibelline_phase_ad_interim: "ヴォルムス協約"
 situation_guelph_ghibelline_phase_ad_interim_desc_short: "この[GetSituation('guelph_ghibelline').GetName]の[situation_phase|E]は転換点であり、[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName]と[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName]によって、次のフェーズが[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]または[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]のどちらになるかが決まる…\n\n$precursor_situation_leader_help$"
 agitation: "$situation_guelph_ghibelline_phase_agitation$"
 agitation_desc: "$situation_guelph_ghibelline_phase_agitation_desc_short$"
 situation_guelph_ghibelline_phase_agitation: "動揺"
 situation_guelph_ghibelline_phase_agitation_desc_short: "このタイプの[GetSituation('guelph_ghibelline').GetName][situation_phase|E]の特徴は紛争の増加と激化であり、勝利側の勢力を拡大するための戦闘や戦争が繰り広げられる。\n\n紛争のいずれかの党派が70%以上の影響力を有している場合、このフェーズは直接以下のいずれかへ移行する：\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
 guelph_advantage: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_advantage_desc: "$situation_guelph_ghibelline_phase_guelph_advantage_desc_short$"
 situation_guelph_ghibelline_phase_guelph_advantage: "ゲルフ派優勢"
 situation_guelph_ghibelline_phase_guelph_advantage_desc_short: "この[GetSituation('guelph_ghibelline').GetName][situation_phase|E]では、紛争が絶えないこの[situation_phase_phase|E]の中で[guelphs|E]が優位に立っている。\n\nその結果、$guelphs$はさらなるボーナスを獲得できる。しかし、強大な権力を握った者は、しばしばその力を試されることになる…"
 ghibelline_advantage: "$situation_guelph_ghibelline_phase_ghibelline_advantage$"
 ghibelline_advantage_desc: "$situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short$"
 situation_guelph_ghibelline_phase_ghibelline_advantage: "ギベリン派優勢"
 situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short: "この[GetSituation('guelph_ghibelline').GetName][situation_phase|E]では、紛争が絶えないこの[situation_phase_phase|E]の中で[ghibellines|E]が優位に立っている。\n\nその結果、$ghibellines$はさらなるボーナスを獲得できる。しかし、強大な権力を握った者は、しばしばその力を試されることになる…"
 repose: "$situation_guelph_ghibelline_phase_repose$"
 repose_desc: "$situation_guelph_ghibelline_phase_repose_desc_short$"
 situation_guelph_ghibelline_phase_repose: "平穏"
 situation_guelph_ghibelline_phase_repose_desc_short: "この[GetSituation('guelph_ghibelline').GetName][situation_phase|E]は、この地域に平和と再生の時をもたらす。ただし、それは束の間にすぎない。\n\n小競り合いや戦争を煽る行為は困難であり、また歓迎されない。"
