 trade_category_non_construction: "建材以外の商品"
 trade_category_non_construction_desc: "建材を除くすべての交易品。木材、麻、石材は含まれない。"
 trade_category_non_food: "食料以外の商品"
 trade_category_non_food_desc: "基本的な食料を除くすべての交易品。穀物、雑穀、米、果物、肉、魚、チーズは含まれない。"
 trade_category_non_medicinal: "医薬品以外の商品"
 trade_category_non_medicinal_desc: "医薬品を除くすべての交易品。"
 trade_category_non_luxury: "贅沢品以外の商品"
 trade_category_non_luxury_desc: "贅沢品や嗜好品を除くすべての交易品。絹、香辛料、宝飾品、チーズ、果物、油、蜂蜜、茶などは含まれない。"
 trade_category_food: "基本食料"
 trade_category_food_desc: "あらゆる人口を支える、穀物、雑穀、米、果物、肉、魚、チーズなどの欠かせない食料。その安定した供給は、すべての集落、軍勢、家族にとってまず満たされるべき要件である。"
 trade_category_beasts_of_burden: "役畜"
 trade_category_beasts_of_burden_desc: "農業と輸送に欠かせない馬や牛などの家畜。これらの役畜は農地を耕し、物資を運び、あらゆる領国の農村経済を支えている。"
 trade_category_minerals: "鉱物"
 trade_category_minerals_desc: "採鉱や採石によって大地から得られる金属、宝石、塩、ミョウバンなどの資源。これらは鍛冶場、造幣所、工房など、あらゆる産業を支える場所に供給される。"
 trade_category_luxury: "奢侈品"
 trade_category_luxury_desc: "富裕層や権力者が求める、絹や香辛料、象牙、宝飾品などの希少かつ高価な物品。これらは威信と洗練の趣を所有者に与えるが、それを手にできるのは最も繁栄した宮廷のみである。"
 trade_category_refined_goods: "加工品"
 trade_category_alcohol: "酒類"
 trade_category_alcohol_desc: "ビールやワインは単なる道楽品ではない。それらは汚染された水に代わる安全な飲み物であり、聖餐式に用いられ、酒場や宮廷では社交に欠かせない存在である。"
 trade_category_liqour_raw_materials: "蒸留原料"
 trade_category_precious_metals: "貴金属"
 trade_category_precious_metals_desc: "銀や金は造幣所や国庫を支える生命線である。それらは貨幣としての用途を持つだけなく、精巧な工芸品や地位を誇示する品々にも欠かせない。"
 trade_category_jewelry_materials: "宝石"
 trade_category_jewelry_materials_desc: "その美しさゆえに尊ばれる、宝石や琥珀、象牙、翡翠などの希少で目を引く原材料。これらは高値で取引され、高級な工芸や宗教的装飾には欠かせない。"
 trade_category_crops: "作物"
 trade_category_crops_desc: "穀物、サトウキビ、綿花、亜麻などの栽培作物。手入れされた圃場で育てられ、灌漑によって水を与えられるこれらの作物は、農業共同体の土台となる自然の恵みである。"
 trade_category_base_metals: "卑金属"
 trade_category_base_metals_desc: "鉄と銅は、産業と戦争を下支えする実用的な金属である。鉄は武器、道具、鎧となり、銅は合金の製造や日々の金属加工に欠かせない。"
 trade_category_cereals: "穀物"
 trade_category_cereals_desc: "穀物、キビ、米などの主食作物。穀類はあらゆる食生活の基盤であり、最も広く取引される交易品であると同時に、都市や軍勢を養うのに欠かせない必需品である。"
 trade_category_meat: "肉類"
 trade_category_meat_desc: "保存加工や塩蔵された肉と魚。タンパク質に富むこれらの食料は、家庭や駐屯地、そして生鮮食品を入手できない、長い旅路を支える。"
 trade_category_comforts: "嗜好品"
 trade_category_comforts_desc: "毎日の食卓を賑わす、生きるための主食の枠を越えたチーズや果物、オリーブオイル、蜂蜜、茶などの食品。これらの嗜好品は生活の質を高め、すべての定住共同体で安定した需要がある。"
 trade_category_clothes: "衣服"
 trade_category_clothes_desc: "衣料品や、織物、毛皮、革などの衣料素材。粗末な労働着から洗練された衣装に至るまで、衣服は領国のあらゆる人々に欠かせない生活必需品である。"
 trade_category_luxury_consumption: "高級消費財"
 trade_category_luxury_consumption_desc: "遠方の地からもたらされる、砂糖や香辛料などの高価で人気の高い品々。食を豊かにし、薬としても重宝されるが、それを手にできるのは一握りの特権階級のみである。"
 trade_category_luxury_items: "高級品"
 trade_category_luxury_items_desc: "地位や文化を象徴する、陶磁器、ガラス、宝飾品、漆器、絹などの工芸品。これらは繁栄と洗練を極めた宮廷の証である。"
 trade_category_construction_materials: "建築資材"
 trade_category_mandala_arms: "粗製武器"
 trade_category_mandala_arms_desc: "軍勢の武装に用いられる、銅や木材を中心とする簡素な資材。より強力な鍛造武器を入手できない領国で、槍、盾、その他の基本的な武具を賄うもの。"
 trade_category_carpentry_supplies: "木工資材"
 trade_category_carpentry_supplies_desc: "建築と航海に欠かせない、木材や麻などの原材料。材木は建物や船の骨組みに使われ、麻は海上交易に欠かせない縄や索具の材料となる。"
 trade_category_rural_goods: "地方特産品"
 trade_category_rural_goods_desc: "農作物や家畜、木材、そして地中から掘り出される価値ある鉱石など、地方がもたらす幅広い天然の恵み。これらの特産品はその土地から運び出され、それらを加工する町や都市へと流れ込む。"
 trade_category_agricultural_goods: "農産物"
 trade_category_agricultural_goods_desc: "農地や牧場が生み出す、穀物や繊維作物、ワイン、蜂蜜、家畜などのあらゆる産物。これらの産物は定住型農業経済による幅広い生産物を表している。"
 trade_category_bast_fibres: "靭皮繊維"
 trade_category_fabrics: "繊維"
 trade_category_fabrics_desc: "織物のための羊毛、綿花、亜麻などの天然繊維。これらは素材である農産物と完成品である織物との間の中間産品であり、領国各地の機織り工房に供給される。"
 trade_category_guild_goods: "ギルド製品"
 trade_category_guild_goods_desc: "都市のギルドの工房で生産される、ビール、織物、ガラス、宝飾品などの手の込んだ加工品。これらは熟練した職人たちが生み出す完成品である。"
 trade_category_cheap_common: "一般品"
 trade_category_cheap_common_desc: "ほぼすべての市場で安価に、かつ簡単に手に入る、穀物や魚、木材、石材などの品々。これらは価格が手頃で流通量も多いことから、地方交易の日常的な取引材料となっている。"
 trade_category_fine_goods: "上質品"
 trade_category_fine_goods_desc: "世界各地の大市場を行き交う、価値の高い品々。これらは富と地位、そして文明的な生活を象徴する存在である。"
 trade_category_staple_goods: "必需品"
 trade_category_staple_goods_desc: "都市や軍隊を支える大量消費品。人々が集団で暮らす場所では、これらの品の流通は必須である。"
 trade_category_stone: "石材"
 trade_category_stone_desc: "城塞や教会、公共インフラなどの建設に用いられる採石材。石材を産出しない土地で大規模な建設事業を遂行するには、それらを輸入しなければならない。"
 trade_category_salt: "塩"
 trade_category_salt_desc: "食料の保存と食生活に欠かせない鉱物資源。塩は肉や魚の長期保存や皮革のなめしを可能にし、古代から遠距離交易を支える重要な商品であった。"
 trade_category_alum: "ミョウバン"
 trade_category_alum_desc: "主に染料を織物に定着させる媒染剤として用いられる、幅広い用途を持つ鉱物塩。皮革のなめしや医薬品としても使われ、その希少性から戦略的価値の高い交易品となっている。"
 trade_category_dyes: "染料"
 trade_category_dyes_desc: "植物や鉱物、昆虫から抽出される鮮やかな染料。布地の染色のほか、陶器の施釉や写本を彩る色鮮やかなインクなど、数多くの工芸に用いられる。"
 trade_category_books: "本"
 trade_category_books_desc: "写本と、それを書き記すための紙や羊皮紙。本は教育や統治、知識の伝達の中核となるものであり、読み書きが定着した場所であればどこでも需要がある。"
 trade_category_incense: "香料"
 trade_category_incense_desc: "世界各地の宗教儀式で焚かれる、香り高い樹脂や調合物。信仰の篤い共同体では、教会や寺院、神殿に安定して供給することが欠かせない。"
 trade_category_medicaments: "医薬品"
 trade_category_medicaments_desc: "医師や治癒師が使用する治療薬、薬草、調合薬。これらは疾病や負傷による犠牲者を減らし、発展しつつあるあらゆる定住地の命綱となる。"
 trade_good_wood: "木材"
 trade_good_wood_desc: "木材は家屋や船の建造、家具の製作に欠かせない建材である。良質な硬木は現地で手に入るとは限らず、森林地帯からの輸入が必要になる場合もある。"
 trade_good_stone: "石材"
 trade_good_stone_desc: "鉱脈から切り出される石灰岩や砂岩、大理石などの建築石材は、大規模な建設に欠かせない資材である。これらは重く、輸送費がかさむため、自然の露頭のない土地では不足しがちである。"
 trade_good_wool: "羊毛"
 trade_good_wool_desc: "羊から刈り取られ、洗浄された羊毛は、中世ヨーロッパで最も重要な織物用繊維である。糸に紡がれ、布に織り上げられて、幅広い織物産業を支える原材料となる。"
 trade_good_cotton: "綿"
 trade_good_cotton_desc: "インドからエジプトにかけての温暖な地域で栽培される綿花は、羊毛よりも軽く通気性に優れた繊維を生み出す。糸に紡がれ、布に織り上げられて、イスラム世界を中心とする織物交易の大部分を支える基盤となっている。"
 trade_good_leather: "皮革"
 trade_good_leather_desc: "動物の生皮をなめし、耐久性を高めて加工しやすくしたもの。皮革は靴やベルト、鞍、鎧、本の装丁などに用いられ、あらゆる文化の工芸を支える基本的な素材となっている。"
 trade_good_flax: "亜麻"
 trade_good_flax_desc: "亜麻は、リネン繊維と、種子から抽出できる亜麻仁油の両方を目的として栽培される、人類最古の作物の一つである。収穫には労力を要するが、他の繊維作物ほど環境を選ばないため、ほぼどこでも育てることができる。"
 trade_good_hemp: "麻"
 trade_good_hemp_desc: "丈夫な繊維を採るために栽培される多用途の植物。その繊維は縄になわれ、帆布に織られ、船の防水材に用いられる。麻は海運経済にも、そして世界各地の建設事業にも欠かせない物資である。"
 trade_good_salt: "塩"
 trade_good_salt_desc: "塩田や岩塩鉱山、あるいは塩泉から採取される塩は、食料の保存と食生活に欠かせない鉱物資源である。腐敗を防ぐその性質により、歴史を通じて最も安定して取引されてきた、最も重要な交易品の一つである。"
 trade_good_grain: "穀物"
 trade_good_grain_desc: "粉に挽かれてパンや粥となる穀物は、中世世界で最も重要な農作物である。西方の小麦から北方のライ麦に至る様々な穀物が、農民から貴族に至るあらゆる人々の食を支えている。"
 trade_good_fruit: "果物"
 trade_good_fruit_desc: "生の果物や干し果物は、中世の食生活に甘みと変化を添える。温暖な地域から仕入れられたリンゴやナシ、イチジクなどの果樹園の果物が、北方での需要を満たしている。"
 trade_good_meat: "加工肉"
 trade_good_meat_desc: "塩漬けや燻製、または乾燥によって保存性を高めた加工肉は、重要なタンパク源として、遠征中の軍勢や食料の乏しい冬を過ごす人々の暮らしを支えている。"
 trade_good_fish: "魚"
 trade_good_fish_desc: "乾燥や塩漬け、燻製処理を施した魚は、腐敗することなく長距離輸送に耐えるため、海や川から遠く離れた地域では重要なタンパク源となる。なかでもニシンとタラは、長距離海上交易を支える主要な交易品となった。"
 trade_good_cattle: "牛"
 trade_good_cattle_desc: "牛は鋤を引いて畑を耕すだけでなく、その乳や肉、そして生皮も利用できる。それは最も用途の広い家畜であり、優れた種牛を確保することは、あらゆる農業経済の向上につながる。"
 trade_good_horses: "馬"
 trade_good_horses_desc: "馬は中世世界における主要な牽引および乗用動物であり、農業や輸送、そして戦争に欠かせない存在である。ステップ地帯やイベリア産の優れた品種は特に珍重されている。"
 trade_good_cheese: "チーズ"
 trade_good_cheese_desc: "牛乳を凝固させ、熟成させて作られる保存用の乳製品。チーズは生乳よりもはるかに長く保存でき、脂肪やタンパク質の季節を問わない安定した供給源となっている。"
 trade_good_beer: "ビール"
 trade_good_beer_desc: "発酵させた穀物から醸造されるビールは、北ヨーロッパの日常的な飲料である。アルコール度数は低いものの栄養価が高く、多くの都市では水より安全な飲み物として、あらゆる階層で消費されている。"
 trade_good_wine: "ワイン"
 trade_good_wine_desc: "ブドウを発酵させて作られるワインは、教会や貴族、富裕層の飲料として、中世文化で比類ない地位を占めている。ワインは地中海沿岸やライン川流域のブドウ園で生産され、広域にわたって取引されている。"
 trade_good_oil: "オリーブ油"
 trade_good_oil_desc: "オリーブの実を搾って作られるこの油は、地中海世界では食用油やランプ用の燃料、石鹸の原料として用いられている。北に行くと動物性脂肪やバターがこれに代わるため、その重要性は低くなる。"
 trade_good_honey: "蜂蜜"
 trade_good_honey_desc: "中世世界における主要な甘味料である蜂蜜は、蜂蜜酒や薬、食品の保存にも用いられる。蜜蜂は世界各地で飼育されているが、上質の蜂蜜は高値で取引される。"
 trade_good_rice: "米"
 trade_good_rice_desc: "南アジアと東アジアにおいて最も重要な穀物である米は、栽培に水田と温暖な気候を必要とするものの、その収穫量は極めて高く、膨大な人口の食生活を支える基盤となっている。"
 trade_good_millet: "雑穀"
 trade_good_millet_desc: "ほかの穀物が実らないやせた土地や乾燥した気候でもよく育つ、丈夫な穀物。アフリカの大部分、中央アジア、そしてインドの乾燥地帯で主食となっている。"
 trade_good_iron: "鉄"
 trade_good_iron_desc: "中世世界の主力金属である鉄は、鉱石から精錬されて道具や武器、蹄鉄、釘へと加工される。職人や兵士に安定して供給されなければ、いかなる定着地も発展することはできない。"
 trade_good_alum: "ミョウバン"
 trade_good_alum_desc: "ミョウバンは、出血を止めたり、ガラスの仕上げや皮革のなめしを行ったりするのに重宝される、希少な塩類である。主な用途は媒染剤であり、織物を漂白し、染料をより効率的に定着させる働きを持つ。\n\nミョウバンは中東などの温暖な地域では天然の形で産出するが、世界の他の地域でも明礬石から抽出することができる。"
 trade_good_jade: "翡翠"
 trade_good_jade_desc: "東アジアで極めて重要な文化的意義を持つ翡翠は、道具や装身具、祭祀用の品々に加工される。中国の宮廷では非常に高値で取引され、徳と身分の象徴となっている。"
 trade_good_gold: "金"
 trade_good_gold_desc: "最も貴重な金属である金は、王家の財政の基盤であると同時に、最も額面の高い貨幣の素材でもある。その希少性と輝きから、王冠や聖遺物、美術品などの材料として特に好まれている。"
 trade_good_silver: "銀"
 trade_good_silver_desc: "最も一般的な貨幣用金属である銀は、既知の世界のあらゆる場所で流通する貨幣として鋳造される。また貨幣だけでなく、宝飾品や銀食器、美しい宗教的祭具へと加工される。"
 trade_good_amber: "琥珀"
 trade_good_amber_desc: "琥珀は主にバルト海沿岸で産出する化石化した樹木の樹脂であり、古代から交易品として用いられてきた。その温かみのある黄金色と加工のしやすさから、ビーズやペンダント、装飾品の素材として珍重されている。"
 trade_good_copper: "銅"
 trade_good_copper_desc: "柔らかく加工しやすい金属であり、調理器具や教会の鐘、青銅や真鍮などの合金に用いられる。その温かみのある色合いから、装飾的な金属工芸品としても好まれている。"
 trade_good_gems: "宝石"
 trade_good_gems_desc: "ルビーやサファイア、エメラルドなどの宝石は、あらゆる交易路で最も価値ある品に数えられる。それらは研磨やカットを施され、王冠や聖遺物箱、権力者たちの宝飾品を彩っている。"
 trade_good_silk: "絹"
 trade_good_silk_desc: "最高級の繊維である絹は、蚕の繭から紡がれて、並外れた柔らかさと光沢を備えた布へと織り上げられる。原産地は中国であるが、世界で最も価値の高い交易品の一つとなっている。"
 trade_good_textiles: "織物"
 trade_good_textiles_desc: "羊毛や綿、亜麻、あるいは混紡繊維から織られる布地。上質な織物は中世世界で最も広く取引される交易品の一つであり、フランドルやイタリア、中東の工房は特に名高い。"
 trade_good_furs: "毛皮"
 trade_good_furs_desc: "北方の森林で捕獲された、キツネやオコジョ、クロテン、ビーバーなどの動物の毛皮。毛皮の衣服は富と身分の象徴であり、貴族の宮廷からの需要が富を生む交易を支えている。"
 trade_good_books_paper: "本と紙"
 trade_good_books_paper_desc: "手書きの写本と、それを書き移すための羊皮紙や紙。本は法典や宗教文書、蓄積された知識を後世へ伝え、行政や学問が発展する場所であればどこでも需要がある。"
 trade_good_spices: "香辛料"
 trade_good_spices_desc: "南アジアや東南アジアで生産される胡椒やシナモン、クローブ、ナツメグなどの香辛料は、世界で最も価値ある交易品の一つである。これらは食品の保存や風味付けに用いられるだけでなく、富の象徴ともなる。"
 trade_good_tea: "茶"
 trade_good_tea_desc: "チャノキの葉を乾燥・加工して作られる茶は、極東を象徴する飲物である。シルクロードを通じて西方に広まり、それ自体が重要な交易品としての地位を確立した。"
 trade_good_dyes: "染料"
 trade_good_dyes_desc: "タイセイやアカネなどの植物、タマムシなどの昆虫、鉱物から採取される染料。染料は布地や陶器、彩飾写本に鮮やかな彩りを与え、それらを用いる工芸産業に欠かせない存在となっている。"
 trade_good_jewelry: "宝飾品"
 trade_good_jewelry_desc: "貴金属に宝石や七宝、ガラスを組み合わせて作られる装身具。宝飾品は中世世界において個人の富を最も分かりやすく示すものであり、贈答品や外交上の献上品としても用いられる。"
 trade_good_ivory: "象牙"
 trade_good_ivory_desc: "象の牙から切り出される象牙は威信と信仰を象徴する素材であり、装飾彫刻やチェスの駒、聖遺物箱の装飾板、そして最も豪華な装飾品の制作に用いられる。"
 trade_good_glass: "ガラス"
 trade_good_glass_desc: "ガラスを吹いて成型された容器や窓ガラス、そして装飾品。ヴェネツィアやイスラム世界の優れたガラス工芸品は高値で取引される一方、より素朴なガラス製品も教会や富裕層の邸宅に次第に普及しつつある。"
 trade_good_sugar: "砂糖"
 trade_good_sugar_desc: "温暖な南の地域で栽培されるサトウキビから精製される砂糖は、希少で高価な贅沢品である。甘味料や医薬品としてだけでなく、富裕層の厨房でその地位を誇示するための食材として用いられる。"
 trade_good_incense: "香料"
 trade_good_incense_desc: "あらゆる信仰の宗教儀式で焚かれる、乳香や没薬などの芳香性の樹脂。その生産には温暖な気候と特定の樹木が必要であり、アラビアやエチオピア、インドから輸出されている。"
 trade_good_ceramics: "陶磁器"
 trade_good_ceramics_desc: "高度な技術と優れた意匠によって作られる陶器や磁器。中国やイスラム世界の上質な陶磁器は、高級な交易品や装飾品として人気が高い。"
 trade_good_lacquerware: "漆器"
 trade_good_lacquerware_desc: "幾重にも漆を塗り重ねて仕上げられ、その耐久性と光沢ある質感から東アジアで重宝されている工芸品。漆塗りの箱、盆、家具などは高級輸出品として、シルクロードを通じて遠方へと運ばれていく。"
 trade_good_medicaments: "医薬品"
 trade_good_medicaments_desc: "医師や薬剤師が用いる、乾燥した薬草や鉱物の化合物、各種調剤薬などのさまざまな医薬品。これらの入手は、傷の治療や病気の管理、そして人々の健康維持に欠かせない。"
