 ecumenical_council_phase_summons: "召集"
 ecumenical_council_phase_summons_desc: "客人たちが集まり、最初の議題が示されるのを待ちわびている。"
 ecumenical_council_phase_first_debate: "第1の討論"
 ecumenical_council_phase_first_debate_desc: "公会議は手短な祈りとともに幕を開け、[Activity.GetSelectedTenet1.GetName( GetPlayer.GetRite )|V]に関する討論が開始される。"
