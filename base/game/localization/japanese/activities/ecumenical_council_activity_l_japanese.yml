 ecumenical_council_second_debate_proposal_flag: "[Activity.Custom('GetEcumenicalCouncilTenet2Proposal')]"
 ecumenical_council_third_debate_proposal_flag: "[Activity.MakeScope.Var('third_debate_proposal').DoctrineType.GetBaseName]"
