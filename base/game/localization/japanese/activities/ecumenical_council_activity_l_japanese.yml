 ecumenical_council_outcome_preview_core_tt: "$ecumenical_council_outcome_preview_tt$\n$BULLET_WITH_TAB$[host.GetFaith.GetName]が[current_topic.GetName( host.GetRite )|V]を$faith_tenet_status_core_name$の信条に指定する"
