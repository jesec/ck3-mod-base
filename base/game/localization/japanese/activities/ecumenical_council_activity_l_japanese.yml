 activity_ecumenical_council_host_an_a: "$articleblank_blank$"
 activity_ecumenical_council: "公会議"
 activity_ecumenical_council_desc: "キリスト教世界の偉大な高位聖職者や統治者たちを招集せよ！我らが目的は信仰と実践を統一し、[GetPlayer.GetFaith.HighGodName|U]をより一層称えることにある。\n\n我らはかつて使徒たちがエルサレムに集ったように、信仰を一つとして集うのだろうか。それとも我らの傲慢の重みによって教会を引き裂いてしまうのだろうか？"
 activity_ecumenical_council_destination_selection: "[holding|E]が重要な宗教の中心地でなければならない。"
 activity_ecumenical_council_host_desc: "$BULLET_WITH_TAB$[core_tenets|E]が発見、許可、禁止、または変更される可能性がある\n$BULLET_WITH_TAB$[doctrines|E]が変更される可能性がある\n$BULLET_WITH_TAB$@fervor_icon! [fervor|E]が増加する可能性がある\n$BULLET_WITH_TAB$@piety_icon! [piety|E]を獲得する可能性がある\n$BULLET_WITH_TAB$参加者からの@opinion_icon! [opinion|E]を獲得する可能性がある\n$BULLET_WITH_TAB$[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]の[trait|E]または[trait_level_track_xp|E]"
 activity_ecumenical_council_guest_desc: "$activity_ecumenical_council_host_desc$"
 activity_ecumenical_council_selection_tooltip: "キリスト教世界で特に影響力があり、博識な人々を招き、神学上の問題と俗世の問題の両方を討論させる。\n\n期待される報酬：\n$BULLET_WITH_TAB$[core_tenet|E]の変更\n$BULLET_WITH_TAB$[doctrine|E]の変更\n$BULLET_WITH_TAB$@fervor_icon! [fervor|E]\n$BULLET_WITH_TAB$@piety_icon! [piety|E]\n$BULLET_WITH_TAB$@opinion_icon! [opinion|E]\n$BULLET_WITH_TAB$[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]の[trait|E]または[trait_level_track_xp|E]"
 activity_ecumenical_council_holy_site_province: "\n#p +++ 聖地#!"
 activity_ecumenical_council_cathedral_province: "\n#P ++ 大型宗教施設#!"
 activity_ecumenical_capital_province: "\n#P + 自分の首都#!"
 ecumenical_council_type_doctrine: "$activity_ecumenical_council$"
 ecumenical_council_type_doctrine_desc: "$EFFECT_LIST_BULLET$[core_tenets|E]が変更される可能性がある\n$EFFECT_LIST_BULLET$[doctrines|E]が変更される可能性がある\n\n#weak [GetPlayer.GetFaith.HighGodName|U]の真理も、人間の舌が語れば自明のものではなくなるのだ。#!"
 ecumenical_council_base_cost: "[GetActivityType( 'activity_ecumenical_council' ).GetName]の基本コスト"
 activity_invite_archbishops: "大司教"
 activity_invite_clergy: "聖職者"
 activity_invite_cardinals: "枢機卿"
 activity_invite_hof_and_hor: "宗教および流派指導者"
 activity_ecumenical_council_guest_help_text: "[activity_guests|E]は、自らの望む[core_tenets|E]と[doctrines|E]を受け入れさせるため、教会に働きかける機会を得る。"
 ecumenical_council_not_valid_province: "ここには重要な宗教施設は存在しない"
 ecumenical_council_start_log_title: "公会議の開催"
