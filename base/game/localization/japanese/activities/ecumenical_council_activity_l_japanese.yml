 ecumenical_council_outcome_preview_adopt_core_tt: "$ecumenical_council_outcome_preview_tt$\n$BULLET_WITH_TAB$[host.GetFaith.GetName]は[ec_promoted_tenet.GetName( host.GetRite )|V]を$faith_tenet_status_core_name$として採用する"
