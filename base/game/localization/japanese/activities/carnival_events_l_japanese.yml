 carnival.1009.customloc08: "樽職人"
 carnival.1009.customloc09: "防具職人"
 ## Event - the duel
 carnival.1010.t: "決闘"
 carnival.1010.desc: "仮面をつけた見知らぬ者が二人、対峙したまま円を描くように歩いている。群衆が彼らに道を開ける——そしてついに剣が抜かれた！彼らの目には憎悪が浮かんでいる。どうやら、少しの流血で済ませる気はないようだ。"
 carnival.1010.a.desc: "\n\n仮面を被ったまま、群衆に溶け込んでおこう。"
 carnival.1010.b.desc: "私の正体に気付いた群衆は、私が介入するかどうか見守っている。"
 carnival.1010.a: "衛兵を呼んで決闘をやめさせる。"
 carnival.1010.b: "決闘をやめるよう説得する。"
 carnival.1010.c: "決闘をやめるよう命令する。"
 carnival.1010.d: "決闘を続けさせる。"
 cooltip.carnival.1010_duel_diplomacy_success: "決闘を止める"
 cooltip.carnival.1010_duel_diplomacy_fail: "決闘を止めることに失敗する"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName]が決闘に敗れ、死傷する可能性がある。"
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName]が決闘に敗れ、死傷する可能性がある。"
 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName]が決闘に勝利する"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName]が決闘に勝利する"
 carnival.1010_duel_guards_success.desc: "衛兵が走ってくる"
 carnival.1010_duel_guards_fail.desc: "衛兵が来るのが遅すぎる"
 carnival.1010_duel_guards_success_toast: "衛兵が決闘をやめさせる"
 carnival.1010_duel_guards_failure_toast: "衛兵が間に合わず、決闘を止められない"
 carnival.1010_duel_diplomacy_success_toast: "あなたは決闘を止めた"
 carnival.1010_duel_diplomacy_fail_toast: "あなたは決闘を止められなかった"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName]が決闘で負傷した"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName]が決闘で死亡した"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName]が決闘で負傷した"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName]が決闘で死亡した"
 carnival.1010.duel_stop.log_title: "決闘の制止"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip]は[duelist_01.GetFirstNameNoTooltip]と[duelist_02.GetFirstNameNoTooltip]の決闘を止めた"
 carnival.1010.duel_continue.log_title: "決闘の制止に失敗"
 carnival.1010.duel_continue.log: "[carnival_main.GetShortUIName|U]は[duelist_01.GetShortUIName]と[duelist_02.GetShortUIName]の決闘を止められなかった"
 ## Event - Gracious Host
 carnival.1011.t: "気前のよい主催者"
 carnival.1011.desc: "カーニバルは、館を民衆に開放し、私の富と趣味の良さを誇示する絶好の機会だ。カーニバルについて[house_member01.GetFirstNameNoTooltip]と話し合いながら、私は誰を招くべきか思案した。[house_member01.GetSheHe|U]はいくつか良い案を出してくれたが、決めるのは私だ。 "
 carnival.1011.a: "館中を飾り立てろ。費用は惜しまない！"
 carnival.1011.b: "貧しい者たちにも門戸を開こう！"
 carnival.1011.c: "高名な者だけを招待しよう！"
 carnival.1011.d: "親族だけの集まりにしよう。"
 ## Event - Puppet theater
 carnival.1012.t: "人形劇"
 carnival.1012.desc: "庶民は人形劇が大好きで、どたばた喜劇や卑猥な芝居に夢中になっている。あらゆる階層の人々を風刺したグロテスクな人形たちが、情事にふけり、言い争い、戦い、あり得ないような騒動を次々と繰り広げていく。\n\n[carnival_location.GetName]のカーニバルには多くの人形師たちが集まっている。人々は熱狂しているが、あまりの低俗さに[carnival_host.GetFaith.PriestNeuterPlural]は懸念を抱いている。"
 carnival.1012.a: "こっそり観劇しよう。"
 carnival.1012.b: "金を握らせて、私の望む芝居をやらせよう！"
 carnival.1012.c: "堂々と観劇しよう！"
 carnival.1012.d: "裏でひそかに芸人たちを戒める。"
 carnival.1012.e: "このような下品な見世物を禁じる。"
 ## Event - The Mask Maker
 carnival.1013.t: "仮面職人"
 carnival.1013.desc: "人気のない中庭を歩いている途中、年老いた[mask_maker.GetWomanMan]が仮面を彫っているのを見かけた。傍らには[mask_maker.GetHerHim]の露店があり、様々な種類の仮面がずらりと並んでいる。\n\n実に見事な職人芸だ。"
 carnival.1013.a: "すべて買い取り、出会う人全員に配って回ろう！"
 carnival.1013.b: "仮面職人に工房を構える資金を提供する。"
 carnival.1013.c: "見事な仮面を自分用に買う。"
 carnival.1013.d: "恐ろしげな仮面を自分用に買う。"
 carnival.1013.maskmaker_workshop.log_title: "仮面職人の工房に投資"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName]は仮面職人が工房を構えるのを支援した"
 ## Event - Holy Fools
 carnival.1014.t: "聖なる愚者たち"
 carnival.1014.desc: "聖なる行進を真似た行列が、通りを練り歩いている。司祭や修道士、さらには我々の信仰の最高指導者までをも風刺した衣装だ！聖職者たちは公然と笑いものにされている。"
 carnival.1014_2.a.desc: "\n\nこのまま群衆に紛れておこう。"
 carnival.1014_2.b.desc: "\n\n皆、私がどんな反応を示すのか見ている。"
 carnival.1014.a: "ひそかに衛兵を呼び、冒涜的な真似をやめさせる。"
 carnival.1014.b: "罪深い者たちを糾弾する！"
 carnival.1014.c: "一緒になってからかう。"
 carnival.1014.d: "群衆の中にそっと紛れ込む。"
 carnival.1014.e: "こんなに笑ったのは何年ぶりだろう！"
 cooltip.carnival.1014.non_believer: "#weak #EMP あなたの「無神論者」の[secret|E]により、[stress|E]が減少する#!#!"
 carnival.1014.secret.tt.toast: "心の底では信じていなかったことに気づく"
 carnival.1014.mockery.tt.toast: "罪悪感と安堵が入り混じった気持ちになる"
 ## Event - The Cat
 carnival.1015.t: "猫"
 carnival.1015.desc: "今夜はずっと、小さな影に後をつけられてる。角を曲がるたびに、2つの輝く目と、かすれた#EMP 「ニャー」#!という鳴き声が私を待ち受けているのだ。\n\n「どうやら友達ができたようですね」と[observer_01.GetTitledFirstName]が笑って言った。猫がまた私の脚に体をすり寄せてくる。"
 carnival.1015.a: "こういう運命だったのだろう！"
 carnival.1015.b: "きっとあなたと一緒にいたいはずだ。"
 carnival.1015.c: "[family_member01.GetTitledFirstName]には話し相手が必要だろう。"
 carnival.1015.adopt_cat.log_title: "猫を迎え入れた"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName]は猫を迎え入れた"
 ## Event - Lover's mask
 carnival.1016.t: "恋人の仮面"
 carnival.1016.desc: "祝祭の熱気に包まれながら[carnival_location.GetName]の街を歩いていると、路地から音楽が聞こえてきた。宴の輪は酒場から通りへとあふれ出し、平民とパトリシアンが肩を並べている。身分と特権は、仮面に取って代わられていた。\n\nふいに肩を叩かれて振り返ると、仮面をつけた[woo_character.GetWomanMan]が立っていた。[woo_character.GetSheHe|U]は大げさにポーズを決めると、くすりと笑う。一瞬だけ仮面をずらした[woo_character.GetWomanMan]の顔を見て、私はそれが[woo_character.GetNameNoTooltip]だと気づいた。\n\n#EMP 「ごきげんよう、[ROOT.Char.GetLadyLord]。今夜は私とご一緒しませんか？仮面をつけた二人の見知らぬ者同士として、カーニバルを楽しみましょう」#![woo_character.GetSheHe]はそう言うと、芝居がかった仕草でお辞儀をした。"
 carnival.1016.a: "これは嬉しい驚きだ！案内してくれ、#EMP 「見知らぬ人」よ。#!"
 carnival.1016.b: "ぜひ#BOLD 友人#!としてご一緒したい。"
 carnival.1016.c: "見知らぬ者同士のままでいるべきだ。"
 ## Event - In candle light
 carnival.1017.t: "ろうそくの明かりの中で"
 carnival.1017.desc: "静かな酒場で、私は[intent_target.GetNameNoTooltip]を見つけた。外ではカーニバルが盛り上がっているが、店内はろうそくの灯りに照らされて、居心地がいい。[intent_target.GetNameNoTooltip]は本を読んでいて、集中するあまり、眉間にはしわが寄っている。\n\n少し気の利いた会話でもすれば、[intent_target.GetHerHim]も私の魅力に気付くに違いない。"
 carnival.1017.a: "文学の知識を披露して[intent_target.GetHerHim]を感心させる。"
 carnival.1017.b: "機知に富んだ会話で、本のことを忘れさせる。"
 carnival.1017.c: "本を読み終えたら貸してもらえないか尋ねる。"
 carnival.1017.a.tt.failure.desc: "ああ、無学な人間には良い本だな"
 carnival.1017.a.tt.success.desc: "それで思い出した本がある"
 carnival.1017.b.tt.success.desc: "[intent_target.GetHerHis]の注意を引く"
 carnival.1017.a.tt.success.toast: "あなたの幅広い知識は[intent_target.GetTitledFirstName]の関心を引いた"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName]はあなたを退屈で尊大だと感じた"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName]は本のことをすっかり忘れてしまった"
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName]は本に夢中なままだ"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName]にとって、あなたの機知は本ほど魅力的ではなかった"
 carnival.1017.c.tt.toast: "あなたと[intent_target.GetTitledFirstName]は、興味深い本について語り合ううちに親しくなった"
 ## Event - Flowers & song
 carnival.1018.t: "恋と競技"
 carnival.1018.desc: "力と技を競う競技を見物しようと、広場に人が集まっている。レスリングや徒競走、綱引きなどが行われ、観衆は歓声を上げている。陽気で和やかな雰囲気だ。\n\n[intent_target.GetTitledFirstName]は参加者の活躍ぶりに感心しているようだ。何度も視線を[contender.GetTitledFirstName]に向けている。[intent_target.GetHerHis]の好意を勝ち取りたいのなら、何とかして[contender.GetTitledFirstName]を打ち負かさなければならない。"
 carnival.1018.a: "レスリングで[contender.GetHerHim]を叩きのめしてやろう！"
 carnival.1018.b: "わざと負けるよう説得できるかもしれないな。"
 carnival.1018.c: "[intent_target.GetTitledFirstNameNoTooltip]の前で[contender.GetHerHim]を辱める"
 carnival.1018.d: "競技に参加する気はない。"
 carnival.1018.a.success.desc: "あなたは[contender.GetTitledFirstNameNoTooltip]に打ち勝つ"
 carnival.1018.a.success.toast: " [intent_target.GetTitledFirstNameNoTooltip]があなたの活躍に感銘を受ける"
 carnival.1018.a.failure: "あなたは尻もちをつく"
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip]はあなたの存在を忘れる"
 carnival.1018.b.success: "本当にあなたが勝利したと見せかけることに成功する"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip]はあなたを勝者として称える"
 carnival.1018.b.failure: "八百長なのは明らかだ"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip]はあなたを詐欺師呼ばわりする"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip]は喜び、魅了された"
 ## Event - A mask in the crowd
 carnival.1019.t: "群衆に紛れた仮面"
 carnival.1019.desc: "群衆の中で、同じ仮面を何度も見かける。通りを歩いていると、笑顔を凍りつかせた道化の顔が視界の端にちらつくのだ。道化の顔は、仮面の波の中に現れては消え、消えてはまた現れる。まさかつけられているのか？考えただけで背筋が凍った。\n\n大通りを離れても、仮面の男たちはついてくる。間違いない！私に危害を加えるつもりだ！"
 carnival.1019.a: "奇襲に備える。"
 carnival.1019.b: "衛兵隊のもとにおびき寄せる。"
 carnival.1019.c: "助けを求めて叫ぶ。"
 cooltip.carnival.1019.tt.assassination_success: "襲撃者を殺す"
 cooltip.carnival.1019.tt.assassination_fended: "襲撃者に傷を負わせる"
 cooltip.carnival.1019.tt.assassination_captured: "襲撃者が投獄される"
 cooltip.carnival.1019.tt.assassination_scream: "あなたの叫び声に、暗殺者たちは散り散りになって逃げる"
 carnival.1019.tt.assassination_success.desc: "あなたは襲撃者を討ち取る"
 carnival.1019.tt.assassination_fended.desc: "あなたは襲撃者を撃退する"
 carnival.1019.tt.assassination_wounded.desc: "あなたは負傷する"
 carnival.1019.tt.assassination_killed.desc: "あなたは襲撃者に殺害される"
 carnival.1019.tt.assassination_gotaway.desc: "あなたは逃げ延びる"
 carnival.1019.tt.assassination_cornered.desc: "あなたは追い詰められる"
 carnival.1019.tt.assassination_captured.desc: "衛兵が暗殺者を捕らえる"
 carnival.1019.tt.assassination_fended_toast: "あなたは襲撃者を刺し、路地へ逃げ込んだ"
 carnival.1019.tt.assassination_wounded_toast: "襲撃者はあなたに傷を負わせると、再び闇の中へ姿を消した"
 carnival.1019.tt.assassination_success_toast: "暗殺を実行しようとした[murder_01.GetFirstNameNoTooltip]は死亡した"
 carnival.1019.tt.assassination_gotaway_toast: "あなたは襲撃者たちを振り切った"
 carnival.1019.tt.assassination_captured_toast: "暗殺者[murderer_01.GetFirstNameNoTooltip]は牢に放り込まれる。"
 ## Event - Thundering hooves
 carnival.1020.t: "鳴り響く蹄音"
 carnival.1020.desc: "宴を後にする[murder_victim.GetNameNoTooltip]の姿を見つける。[murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))]の[bystander.GetFirstNameNoTooltip]と一緒だ。\n\n私は馬の手綱を引き、[murder_victim.GetFirstNameNoTooltip]が主催者に別れの挨拶を済ませるのを待った。標的は危険にまったく気付いていない。それは蹄の音を轟かせて、すぐ近くまで迫ってきているというのに。\n\nこれは絶好の機会だが、罪のない者を巻き込む危険もある。"
 carnival.1020.a: "駆け抜けながら二人まとめて斬ってやろう。"
 carnival.1020.b: "進め、[ROOT.Char.Custom('WarhorseStoryName')]！私が恐るべき[ROOT.Char.GetWomanMan]であることを思い知らせてやる。"
 carnival.1020.c: "[murder_victim.GetFirstNameNoTooltip]を馬に轢き殺させよう。痛ましい事故だな。"
 carnival.1020.d: "手駒に合図を送り、獲物を馬で踏み潰させよう。"
 carnival.1020.e: "今日は駄目だ。危険すぎる。"
 carnival.1020.tt.horse.hit.desc: "標的が馬の蹄に踏み潰される"
 carnival.1020.tt.horse.miss.desc: "馬が標的を捉え損ねる"
 carnival.1020.tt.horse.hit.toast: "標的は馬の蹄に踏み潰された"
 carnival.1020.tt.horse.miss.toast: "馬は標的を捉え損ねた"
 carnival.1020.murder_horse.log_title: "軍馬の暴走"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName]は軍馬[ROOT.Char.Custom('WarhorseStoryName')]に乗り、[murder_victim.GetShortUIName]を踏み潰した"
 carnival.1020.accident.log_title: "痛ましい事故"
 carnival.1020.accident.log: "[murder_victim.GetShortUIName]は馬に踏みつけられるという痛ましい事故により死亡した"
 carnival.1020.both_accident.log_title: "痛ましい事故"
 carnival.1020.both_accident.log: "[murder_victim.GetShortUIName]と[bystander.GetShortUIName]は馬に踏みつけられるという痛ましい事故により死亡した"
 carnival.1020.bystander_accident.log_title: "痛ましい事故"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName]は馬に踏みつけられるという痛ましい事故により死亡した"
 carnival.1020.sword.log_title: "馬上の凶行"
 carnival.1020.sword.log: "[murder_victim.GetShortUIName]と[bystander.GetShortUIName]は馬に乗った者に斬り殺された。"
 carnival.1020.miss.log_title: "[murder_victim.GetShortUIName]の轢殺未遂"
 carnival.1020.miss.log: "[murder_victim.GetShortUIName]は馬に乗った[carnival_main.GetShortUIName]に轢き殺されそうになったと主張している。これは殺人未遂だ！"
 ## Event - The Arrow
 carnival.1021.t: "矢"
 carnival.1021.desc: "私が潜んでいる場所は静かだ。聞こえるのは木の軋む音と、鎧戸越しに漏れてくる街の喧騒だけ。眼下の中庭に、標的の[murder_victim.GetFirstNameNoTooltip]がいる。私の視線にも、傍らに置いた[SCOPE.Custom('UniqueBowOrJustBow')]にも気付いていない。\n\n人手が必要な場合に備え、金で雇った[bandit_01.GetFirstNameNoTooltip]も連れてきている。\n\n私が弓を引き絞ると、[murder_victim.GetFirstNameNoTooltip]が顔を上げた。窓をじっと見つめている！"
 carnival.1021.a: "気付かれる前に矢を放つ。"
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip]、矢を放て。私は逃走経路を確保する。"
 carnival.1021.c: "伏せろ。次のチャンスを待つんだ。"
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip]は別の人間を殺害する"
 carnival.1021.tt.arrow.hit.desc: "矢は標的に命中する"
 carnival.1021.tt.arrow.miss.desc: "矢は外れ、標的に姿を見られる"
 carnival.1021.tt.thug.arrow.hit.desc: "矢は標的に命中する"
 carnival.1021.tt.thug.arrow.miss.desc: "矢は別の人物に当たる"
 carnival.1021.tt.arrow.hit.toast: "矢が標的を射抜いた"
 carnival.1021.tt.arrow.miss.toast: "矢が外れ、あなたの姿を見られた！"
 carnival.1021.tt.thug.arrow.hit.toast: "手下の放った矢が標的を射抜いた"
 carnival.1021.tt.thug.arrow.miss.toast: "手下の放った矢が別の人物を射抜いた！"
 carnival.1021.arrow.log_title: "正体不明の射手"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip]は、正体不明の射手が放った矢によって殺害された"
 ## Event - Procession of My Own
 carnival.1022.t: "私のパレード"
 carnival.1022.desc: "街はカーニバルの費用を負担しており、すべての人々の利益のために行われている。十分な娯楽を賄うだけの金はあるが、財力のある進取の気性に富んだ市民がいれば、祝祭をさらに華やかにすることができるだろう。\n\n私が寄付をすれば、同輩たちは嫉妬に狂うだろうし、下位の者たちの目には、私は古のパトリキのように輝いて映るだろう。そうだ、古代都市国家の高貴な者たちは、自らの富を誇示していた！壮麗な行列の主催者となれば、私の名は永遠に語り継がれるだろう！\n\n #BOLD だが、テーマは何にすべきだろうか？#!"
 carnival.1022.a: "私の功績を称える#BOLD 美しい#!行列にしよう！"
 carnival.1022.b: "恐怖と敬意を植え付ける#BOLD 威圧的な#!行列にしよう！"
 carnival.1022.c: "私の信心深さを示す#BOLD 宗教的な#!行列にしよう！"
 carnival.1022.d: "やはりやめておこう。他にもっと良い金の使い道がある。"
 custom.carnival.1022.guestopinion: "カーニバルのすべての客"
 custom.zealot_carnival.1022.guestopinion: "カーニバルのすべての[GetVassalStance( 'zealot' ).GetTextIcon]的な客"
 ## Event - Legacy in marble
 carnival.1023.t: "大理石の遺産"
 carnival.1023.desc: "幼い頃から、古代都市国家の物語を聞いてきた。パトリキは芸術家の偉大な後援者だった。栄光ある過去の壮麗な建築は今や廃墟と化しているが、その芸術と美は今なお人々に感動を与え続けている。芸術家を支援すれば、名声を高め、この高貴な集団に仲間入りすることができるだろう。\n\n想像してみよう。私の名声が、肉体の死を超越して続いていくことを！\n\n大理石と石と木で形作られ、虹色に彩られた芸術を人々に見せよう！[Glossary( '#bold パトリア#!', 'carnival_patria_GLOSS' )]の栄光のため、祖先への崇敬のため、そして[ROOT.Char.GetDynastyHouseName]家の威信のために！"
 carnival.1023.a: "若き芸術家のためのコンテストを支援する"
 carnival.1023.b: "公共の広場に飾る新たなフレスコ画と装飾品の製作を依頼する"
 carnival.1023.c: "街の創設者たちの彫像を発注する"
 carnival.1023.d: "待て。芸術とはこんなに金がかかるものなのか！？"
 ## Event - Whispers behind the mask
 carnival.1024.t: "仮面の下の囁き"
 carnival.1024.desc: "カーニバルの狂騒の渦中では、境界線は曖昧になり、人々は節度を失う。隣にいる仮面の人物が誰なのか、そして何がその人物の記憶に残るのかは、決して分からない。\n\n[hook_target.GetTitledFirstNameNoTooltip]は自制心を失っている。一晩中、目に留まった相手と踊り続け、明日などないかのように飲み食いしている。誰が聞いているか気にも留めずに、笑い、喋り、醜聞になりかねない様で踊っている。#BOLD 仮面の下から見ている私の視線にもまったく気付いていない。#!\n\n#BOLD 私は[hook_target.GetHerHim]が恥をかかないようにしてやることもできるし、これを利用して私への貸しにすることもできる。#!"
 carnival.1024.a: "友人として見守ろう。"
 carnival.1024.b: "こんな弱みを握られては、後で困ったことになるだろう。"
 carnival.1024.c: "友人として[hook_target.GetHerHis]の家に警告しておいた方が良いだろう。"
 carnival.1024.d: "放っておこう。失敗も経験のうちだ。"
 carnival.1025.t: "装身具と珍獣"
 carnival.1025.into_desc: "気づけば、私は異国の商人が開いている店の前に立っていた。津々浦々から集められた見慣れない品々が陳列され、さらには異国の猛獣を閉じ込めた檻までもが置かれている。この珍獣、発する音も臭気もただ事ではない。\n\n「さあさ、寄ってらっしゃい見てらっしゃい！どれもこれも逸品ばかりだよ！」商人は威勢のよい売り口上とともに、身振り手振りで商品を見るように促す。\n\n「一級品の[merchant_trinket.GetName]に、[merchant_creature.Custom('GetCarnival1025PitchArticle')][merchant_creature.GetName]——"
 carnival_1025_creature_lion_desc: "アフリカのマンティコア——伝説の凶暴な人食い獣でございますよ！」"
 carnival_1025_creature_caracal_desc: "小さいですが獰猛ですよ！」"
 carnival_1025_creature_lynx_desc: "一瞬にして木を駆け上り、その尿からは魔力を秘めた水晶が作り出されるとか！」"
 carnival_1025_creature_tiger_desc: "ペルシアの伝説にも語られる恐ろしい人食い獣でございます！」"
 carnival_1025_creature_leopard_desc: "古代の文献にも書き記されておりますよ！」"
 carnival_1025_creature_bear_desc: "前足を使って逆立ちし、人の頭ほどもある岩でお手玉をして見せるのです！」"
 carnival_1025_creature_elephant_desc: "気の触れた錬金術師が生み出したとか！」"
 carnival_1025_creature_peacock_desc: "炎の中より生まれた鳥ですよ！」"
 carnival_1025_creature_parrot_desc: "人の言葉を話し、賛美歌まで歌う鳥です！」"
 carnival_1025_creature_cockatoo_desc: "実に稀少な種でございます！」"
