l_japanese:
 ## Event - Carnival Opening
 carnival.1001.t: "驚きのひととき"
 carnival.1001.desc: "準備はすべて整った。\n\n色鮮やかな旗が大通りに並び、行列が[carnival_location.GetName]の路地や通りをうねるように進んでいく。広場には人々が集まる。富める者も貧しき者も、醜き者も美しき者も、この仮面の海の中では皆同じだ。\n\nなんという見事な光景になることだろう！"
 carnival.1001.a: "仮面を着ける時が来た。[Glossary( '#bold カルニス・レヴァーレ！#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "私を見つけてみよ、暗殺者どもめ！"
 carnival.1001.c: "仮面は欠点も傷跡も等しく隠してくれる…"
 ## Event - Carnival Closing
 carnival.1002.t: "日常への帰還"
 carnival.1002.desc: "カーニバルの名残が通りに散らばっている。捨てられた仮面や飾りが側溝に溢れ、祝祭の参加者たちはそれぞれの家へと引き上げていく。私たちは互いの違いを忘れ、ひとつの都市の民として共に食べ、踊り、遊び、笑い合った。\n\nカーニバルの華やいだ雰囲気はしばらく消えずに、私たちが何者であるかを思い出させてくれることだろう。そうして私たちは、階級社会と労働、そして果たすべき義務に満ちた日常へと帰っていく。カーニバルが再び訪れるその時まで。"
 carnival.1002.a: "仕事に戻ろう。"
 carnival.1002.b: "毎日がこうだったらいいのに。"
 carnival.1002.c: "秩序ある生活に戻るのは心地よい。"
 ## Event - A chance for mischief
 carnival.1003.t: "悪戯のチャンス"
 carnival.1003.desc: "[house_target.GetDynastyHouseName]家のけばけばしい屋敷を訪れると、上等な[house_target.Custom('RegionalFabric')]のカーテン、数百もの[house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')]、大勢の使用人、そして客に向かって高説を垂れる[house_target.GetName]の姿が目に入った。私は少しばかり、身の程を知らせてやりたい衝動に駆られた。\n\nこういう悪戯こそ、カーニバルの醍醐味ではないだろうか？\n\n密かにごろつきを雇おう。"
 carnival.1003.a: "そして[house_target.GetFirstNameNoTooltip]に腐った卵を投げつけさせよう！"
 carnival.1003.b: "そして悪魔の仮装で[house_target.GetHerHis]の館で暴れ回らせてやろう。"
 carnival.1003.c: " そして大通りに[house_target.GetHerHis]の家族を風刺する下品な落書きを描かせよう。"
 carnival.1003.d: "いや、やはりやめておこう。"
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName]は恥ずかしさのあまり外に出られなくなる"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName]は正気を失う"
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUINamePossessive]の血が沸き立っている"
 carnival.1003.throw_eggs_log_title: "投げつけられた卵"
 carnival.1003.throw_eggs_log: "[house_target.GetDynastyHouseName]家の屋敷に卵が投げつけられた"
 carnival.1003.mischief.insanity.log_title: "悪魔の暴動"
 carnival.1003.mischief.insanity.log: "悪魔の格好をした暴徒の乱入により、[house_member.GetShortUIName]は正気を失った"
 carnival.1003.mischief.irritable.log_title: "悪魔の暴動"
 carnival.1003.mischief.irritable.log: "悪魔の格好をした暴徒が暴れたことで、[house_member.GetShortUIName]は周囲の人間全員に苛立ちと怒りを覚えている"
 carnival.1003.mischief.reclusive.log_title: "悪魔の暴動"
 carnival.1003.mischief.reclusive.log: "悪魔の格好をした暴徒が暴れたため、[house_member.GetShortUIName]は身を隠すほかなかった"
 ## Event - House Relations
 carnival.1004.t: "家同士の関係"
 carnival.1004.desc: "分断された都市は長くは持たない。ならば、[carnival_location.GetName]の政界に関わる有力な家々とは、手を組むのが賢明だ。\n\n宴の席で[other_house_leader01.GetName]を呼び出し、我が[ROOT.Char.GetDynastyHouseName]家と[other_house_leader01.GetHerHis]の[other_house_leader01.GetDynastyHouseName]家が良好な関係を築く利点を説くとしよう。"
 carnival.1004.a: "我々の帳簿は埋まっていて、懐は豊かだ！"
 carnival.1004.b: "事業で協力し合うことは互いの利益となる。"
 carnival.1004.c: "貴家は我が[ROOT.Char.GetDynastyHouseNameNoTooltip]家の格下にすぎない。"
 carnival.1004.d: "両家の関係は現状のままでいい。"
 ## Event - Prank a friend
 carnival.1005.t: "友との戯れ"
 carnival.1005.desc: "カーニバルは、友人にちょっとした悪戯を仕掛けるのにうってつけだ。もちろん、あくまで悪意のない冗談程度であればの話だが。\n\n友人である[friend.GetName]が[bystander.GetName]と話しているのを見て、すぐに面白い考えがいくつも頭に浮かんできた！"
 carnival.1005.a: "木の棒で決闘を挑もう！"
 carnival.1005.b: "変装して[friend.GetHerHim]にぶつかり、でたらめな言語で話しかけよう。"
 carnival.1005.c: "香水を詰め、彩色した卵の殻を投げつけよう！"
 carnival.1005.d: "やめておこう。自分の冗談を他人に押しつけるべきではない。"
 carnival.1005.tt.stick_success.desc: "棒で楽しく戦う"
 carnival.1005.tt.stick_failure.desc: "ふざけているうちに度を越してしまう"
 carnival.1005.tt.success.desc: "皆があなたの派手な動きを見て笑う"
 carnival.1005.tt.failure.desc: "相手にのろまな間抜けと罵られる"
 carnival.1005.tt.disguise_success.desc: "観衆を楽しませる"
 carnival.1005.tt.disguise_failure.desc: "観衆を困惑させ、苛立たせる"
 carnival.1005.tt.success.toast: "皆があなたの派手な動きを見て笑った"
 carnival.1005.tt.failure.toast: "相手にのろまな間抜けと罵られた"
 carnival.1005.tt.egg_success.toast: "あなたの友人は香りのサプライズを喜んだ"
 carnival.1005.tt.egg_failure.toast: "あなたの友人は卵の匂いを嫌がった"
 ## Event - The entertainer
 carnival.1006.t: "楽師たち"
 carnival.1006.desc: "カーニバルは、あらゆる種類の演芸師たちにとって書き入れ時だ。私は今、声と詩と楽器を駆使して物語を紡ぐ、才能あふれる楽団の演奏に耳を傾けている。"
 carnival.1006.a: "楽師たちに金を払って、私の偉大さを歌わせよう！"
 carnival.1006.b: "仲介者を通して、楽師たちの中で最も優秀な者たちを雇用しよう。"
 carnival.1006.c: "人気のある曲をリクエストしよう。"
 carnival.1006.d: "近くにいる[dancer_character.GetWomanMan]をダンスに誘おう！"
 cooltip.carnival.1006.bawdy_song.tt: "卑猥な歌をリクエストする"
 cooltip.carnival.1006.patriotic_song.tt: "[Glossary( '#bold パトリア！#!', 'carnival_patria_GLOSS' )]の歌をリクエストする"
 cooltip.carnival.1006.spiritual_song.tt: "祈りの歌をリクエストする"
 carnival.1006.tt.dance_success.desc: "[dancer_character.GetWomanMan]はダンスの誘いを受け入れる"
 carnival.1006.tt.dance_failure.desc: "[dancer_character.GetWomanMan]はダンスの誘いを断る"
 carnival.1006.tt.dance_success.toast: "あなたは[dancer_character.GetFirstNameNoTooltip]と踊る"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip]はダンスの誘いを断る。"
 carnival.1006.bawdy_song.tt.toast: "卑猥な歌を歌ってもらった！"
 carnival.1006.patriotic_song.tt.toast: "[Glossary( '#bold パトリア！#!', 'carnival_patria_GLOSS' )]の歌を歌ってもらった！"
 carnival.1006.spiritual_song.tt.toast: "祈りの歌を歌ってもらった！"
 carnival.1006.recruit_entertainer.log_title: "楽師を雇用した"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip]は[entertainer_character.GetFirstNameNoTooltip]を雇用した"
 ## Event - Learning to juggle
 carnival.1007.t: "曲芸を学ぶ"
 carnival.1007.desc: "吟遊詩人や曲芸師、道化たちが[carnival_location.GetName]の大通りで人々を楽しませている。その中でも特に、曲芸師たちの姿が私の目を引いた。空中に投げられたナイフや玉を自在に操る見事な手さばきには、感嘆せざるを得ない。\n\n曲芸師の一人が前に出てきて、試しにやってみないかと誘ってくる。\n\n「1つか、2つか、それとも3つか…いくつの玉を落とさずにいられますか？」"
 carnival.1007.a: "賭けてもいい！私は3つの玉を落とさずにいられる！"
 carnival.1007.b: "2つで十分だ。"
 carnival.1007.c: "ナイフ2本はどうだ？"
 carnival.1007.d: "くだらない遊びに付き合う気はない。"
 carnival.1007.juggling_success.tt.toast: "ジャグリングに成功した"
 carnival.1007.juggling_fail.tt.toast: "ボールを落とした"
 carnival.1007.juggling_athletic.tt.toast: "ジャグリングは身体と感覚を鍛える良い方法だ"
 carnival.1007.juggling_k.success.tt.toast: "ナイフのジャグリングに成功した"
 carnival.1007.juggling_k.fail.tt.toast: "ナイフで怪我をした"
 carnival.1007.blademaster.log_title: "刃物への関心"
 carnival.1007.blademaster.log: "ナイフでジャグリングをしたことをきっかけに、[carnival_main.GetFirstNameNoTooltip]は鋭い刃物で遊ぶことに強い興味を抱くようになった"
 ## Event - A wild dance
 carnival.1008.t: "狂騒のダンス"
 carnival.1008.desc: "中央広場は仮面を着けて踊る人々の海となり、音楽と笑い声が混ざり合う。ダンスをしながら、見知らぬ者同士が入れ代わり立ち代わり出会っては、また別れていく。\n\n広場の端に立っている私にまで、その熱気が伝わってくるようだ！"
 carnival.1008.a: "「最も踊りがうまい者に金貨をやろう！」"
 carnival.1008.b: "踊ろう、踊ろう！脚が動かなくなるまで！"
 carnival.1008.c: "ダンスに身を任せよう。"
 carnival.1008.d: "ただこの瞬間を楽しもう。"
 carnival.1008.strong.tt.toast: "舞い回る脚"
 carnival.1008.exhausted.tt.toast: "ダンスで疲れ切ってしまった！"
 carnival.1008.hurt.tt.toast: "ダンスで怪我をしてしまった！"
 ## Event - A drink with a craftsman
 carnival.1009.t: "熟練の[craftsman_character.Custom('CraftsmanDescOption')]と交わす一杯"
 carnival.1009.desc: "[craftsman_character.Custom('CraftsmanDescOption')|l]たちの店が並ぶ通りにある上等な店で、私は一人の熟練の職人と話し込んだ。\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.GetSheHe|U]は[carnival_host.GetTitleAsNameNoTooltip]を目の前にして驚いている。"
 carnival.1009.1_b.desc: "仮面を着けているから、[craftsman_character.GetSheHe]が私の正体に気づいていないのは間違いない。"
 carnival.1009.2_a.desc: "私は[craftsman_character.GetSheHe]の話に興味深く聞き入った。[craftsman_character.GetSheHe]は街の運営に不満を述べ、商売がうまくいかないのは[carnival_host.GetTitleAsNameNoTooltip]のせいだと主張した。"
 carnival.1009.2_b.desc: "私は[craftsman_character.GetSheHe]の話に興味深く聞き入った。[craftsman_character.GetSheHe]は街の運営を称賛し、[carnival_host.GetTitleAsNameNoTooltip]の健康を祈って杯を掲げた。"
 carnival.1009.2_c.desc: "[craftsman_character.GetSheHe|l]は街の運営にかなり満足していて、私に惜しみない賛辞を送った。"
 carnival.1009.2_d.desc: "[craftsman_character.GetSheHe|U]は徐々に言葉少なになり、それから不満げに、最近は少し苦しい状況だと漏らした。"
 carnival.1009.a: "真摯に受け止め、これまで以上に努力しよう。"
 carnival.1009.b: "この無礼者を見せしめにするため、衛兵を呼ぶとしよう。"
 carnival.1009.c: "「ならばお前が評議員をやったらどうだ！」"
 carnival.1009.d: "正体を明かし、街のために努力すると約束しなければ。"
 carnival.1009.e: "こんな正直な称賛の言葉は数か月ぶりだ。"
 carnival.1009.f: "思った通りだ！街の心配などする必要はなかった。"
 carnival.1009.g: "予想通りだ。私の像でも建てた方がよさそうだ。"
 carnival.1009.h: "本音を話すよう[craftsman_character.Custom('CraftsmanDescOption')]を説得する"
 carnival.1009.i: "「見えない力が我らの共和国を蝕んでいるのだ、友よ」"
 carnival.1009.j: "「これだけ努力しているのだから、見返りがあって当然ではないか？」"
 carnival.1009.k: "「共和国の繁栄は、我々の功績だ！」"
 carnival.1009.l: "頷いて、ひたすら[ROOT.Char.Custom('RegionalDrink')]を飲む。"
 carnival.1009.m: "無駄話をしにきたわけではない。戦いに来たのだ！"
 carnival.1009.n: "「職人の仕事について何か教えてくれ、[craftsman_character.Custom('CraftsmanDescOption')|l]よ！」"
 carnival.1009.o: "仲介人を通じて職人を雇用する。"
 carnival.1009.p: "「友よ、一杯おごろう」"
 custom.carnival.1009.spreading_ill_rumors: "異なる[culture|E]または[faith|E]を持つすべての[courtier|E]"
 custom.carnival.1009.shared_praise: "すべての[courtier|E]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U]が#V 匠の#![inspiration|E]を得た"
 carnival.1009.drunk.tt.toast: "あなたは酒に溺れてしまった"
 carnival.1009.tasty.tt.toast: "うーん、美味い！"
 carnival.1009.skillup.tt.toast: "あなたは名工の技を学んだ"
 carnival.1009.patron.tt.toast: "協力者を得た"
 carnival.1009.councilor.log_title: "新たな評議員"
 carnival.1009.councilor.log: "[craftsman_character.GetShortUIName|U]が[councillor|E]に任命された"
 carnival.1009.recruiting.log_title: "熟練の[craftsman_character.Custom('CraftsmanDescOption')|U]を雇用"
 carnival.1009.recruiting.log: "[craftsman_character.GetShortUIName|U]は[carnival_main.GetFirstNameNoTooltip]に雇用された"
 carnival.1009.learning_trade.log_title: "熟練の職人からの学び"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip]は熟練の[craftsman_character.Custom('CraftsmanDescOption')|l]から知識を得た"
 ## A drink with a craftsman - Different Craftsmen nick
 carnival.1009.customloc01: "鍛冶職人"
 carnival.1009.customloc02: "大工"
 carnival.1009.customloc03: "石工"
