 ## Event - Dead End
 carnival.1111.t: "袋小路"
 carnival.1111.desc: "刺客の一人ともみ合っていると、首に鋭い痛みを感じた。背後から刺客の仲間に首を刺されたのだ。崩れ落ちる私の眼前に、地面が勢いよく迫ってくる。手足から力が抜けていく。荒い呼気とともに、血の泡が唇からこぼれる。"
 carnival.1111.a: "こんなはずではなかった。"
