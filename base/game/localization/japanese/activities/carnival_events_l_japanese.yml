 ## GLOSS
 carnival_GLOSS: "カーニバルはラテン語の「carnis levare」（「肉を取り除く」の意）に由来し、四旬節の節制期間に入る前に行われる最後の祝宴を意味する。"
 carnival_patria_GLOSS: "「#EMP パトリア#!」は「祖国」や「父祖の地」を意味するラテン語。中世において、州や都市、共和国への帰属意識や誇りを表す言葉として用いられた。"
