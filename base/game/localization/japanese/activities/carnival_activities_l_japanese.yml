 carnival_entertainment_extravagant: "豪奢な余興"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$[popular_opinion|E]の獲得量が大幅に増加する\n\n#weak 世界中から集めた芸人たちで広場を埋め尽くし、異国情緒あふれる数々の演目で人々を虜にし、熱狂させる。#!"
 go_incognito_intent: "お忍びで参加する"
