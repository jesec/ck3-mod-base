l_japanese:
 activity_carnival: "カーニバル"
 activity_carnival_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]のカーニバル"
 activity_carnival_owner: "主催者"
 activity_carnival_desc: "華やかなカーニバルを開催し、市民を楽しませて不満を和らげよう！あなた自身も臣下たちも——皆が身分や立場の違いを忘れ、大いに楽しむ機会となるだろう。仮面の宴、見世物、料理に酔いしれるのだ！\n\n誰もがあなたの共和国の歴史と文化を祝おうと心待ちにするだろう。富を見せつけて好敵手の嫉妬をかき立てるにも、群衆に紛れて彼らの飾らない思いや不満に耳を傾けるにも、またとない好機である。"
 activity_carnival_host_desc: "$BULLET_WITH_TAB$[prestige_i] [prestige|E]を獲得する可能性がある\n$BULLET_WITH_TAB$[piety_i] [piety|E]を獲得する可能性がある\n$BULLET_WITH_TAB$参加者は、他の[activity_guest_short_possessive|E]からの[opinion_i|E] [opinion|E]が改善する可能性がある\n$BULLET_WITH_TAB$参加者は[stress_loss_i] [stress|E]が減る可能性がある\n$BULLET_WITH_TAB$[county|E]の[control_i|E] [control|E]が改善する可能性がある\n$BULLET_WITH_TAB$[county|E]の[prosperity_i|E] [prosperity|E]が上昇する可能性がある\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]が改善する可能性がある\n"
 activity_carnival_guest_help_text: "カーニバルは、有能な平民を見出したり、商売上のつながりを築いたり、ただ[stress_loss_i] [stress|E]を解消したりする絶好の機会である。"
 activity_carnival_province_desc: "[ROOT.Province.GetName]でカーニバルを開催する。"
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$参加者は[prestige|E]を得る可能性がある\n$BULLET_WITH_TAB$参加者はほかの参加者の[opinion|E]を得る可能性がある\n$BULLET_WITH_TAB$参加者は[stress_loss_i] [stress|E]が減る可能性がある"
 activity_carnival_conclusion_desc: "[GetActivityType( 'activity_carnival' ).GetName]が終了した。"
 activity_carnival_selection_tooltip: "仮面の宴で人々を楽しませる\n\n期待される報酬：\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$[control_i|E] [control|E]\n$BULLET_WITH_TAB$[prosperity_i|E] [prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]"
 carnival_decoration_basic: "簡素な装飾"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$[prestige|E]の獲得量が減少する\n\n#weak 街は今のままでも十分美しい。そうだろう？#!"
 carnival_decoration_extensive: "盛大な装飾"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$[prestige|E]を中程度獲得する\n\n#weak 花々、織物、舞台装置で街を飾り立て、市民を日常の外に広がる驚異の世界へと誘う。#!"
 carnival_decoration_extravagant: "豪奢な装飾"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$[prestige|E]の獲得量が大幅に増加する\n\n#weak 費用を惜しまず、通りや広場を想像力あふれる夢の世界へと飾り変え、街全体を一変させる。#!"
 carnival_entertainment_basic: "簡素な余興"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$[popular_opinion|E]の獲得量が減少する\n\n#weak 数人の曲芸師と歌い手が1人いれば十分だ。#!"
 carnival_entertainment_extensive: "盛大な余興"
