l_japanese:
 msg_passive_learned_tenet_abroad_desc: "[passive_learn_source.GetRite.GetAdjective]の[rite|E]に属する[passive_learn_source.GetTitledFirstName]を[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]で観察したことで、あなたは[passive_learn_tenet.GetBaseName]の[core_tenet|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_abroad_desc: "[passive_learn_source.GetRite.GetAdjective]の[rite|E]に属する[passive_learn_source.GetTitledFirstName]を[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]で観察したことで、あなたは[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_rite_abroad_desc: "[passive_learn_source.GetTitledFirstNameNoTooltip]を通じて、あなたは[passive_learn_source.GetRite.GetAdjective]の[rite|E]の[core_tenets|E]と[doctrines|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_pilgrimage_rite_desc: "[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]で、あなたは[passive_learn_rite.GetAdjective]の[rite|E]の[passive_learn_tenet.GetBaseName]の[core_tenet|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]で、あなたは[passive_learn_rite.GetAdjective]の[rite|E]の[passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )]の[doctrine|E]に関する[agnostic_knowledge|E]を獲得した。"
 rite_travel_events.1000.t: "旅する[passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "日が落ちるころ、我々の焚火に一人の旅する[passive_learn_rite.GetAdherentName]が加わった。\n\n夜が更けるにつれ、我々は[passive_learn_source.Custom('RegionalDrink')]を酌み交わし[passive_learn_source.Custom('RegionalEdibleMeat')]を分け合い、互いの物語に耳を傾けた。[passive_learn_source.GetSheHe|U]は、自らの民の神聖な教えや、[passive_learn_rite.GetNameNoTooltip]が生活にどのように生かされ、実践されているかを語る。その言葉の一つ一つに、確固たる信念が満ちていた。"
 rite_travel_events.1000.a: "実に洞察に富んでいる。"
 rite_travel_events.1000.b: "[passive_learn_source.GetSheHe|U]は私についてくるべきだ。"
 rite_travel_events.1000.c: "そのような異端の話など聞きたくもない。"
 rite_travel_events.2000.t: "天啓"
 rite_travel_events.2000.desc: "[location.GetName]の[location.GetTerrain.GetNameNoTooltip]を進んでいると、人だかりができているのに気が付いた。\n\n一人の説教師が[passive_learn_tenet.GetBaseName]とかいうものについて語っている。聞いたこともないものだったが、[passive_learn_source.GetHerHis]の言葉は胸に響いた。\n\n通り過ぎるつもりだったが、私は耳を傾けている。\n\nこれだ…これこそが真理なのだ。"
 rite_travel_events.2000.a: "これは、[ROOT.Char.GetFaith.HighGodName]が私に求めていることだ。"
 rite_travel_events.2000.b: "私は異教徒ではない！"
