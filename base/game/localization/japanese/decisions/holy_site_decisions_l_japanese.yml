l_japanese:
 elevate_holy_site_decision: "聖地を格上げする"
 elevate_holy_site_decision_desc: "[ROOT.Char.GetFaith.GetName]の[holy_site|E]を[eminent_holy_site|E]に格上げする。"
 elevate_holy_site_decision_tooltip: "選択した[holy_site|E]を[ROOT.Char.GetFaith.GetName]の[eminent_holy_site|E]に格上げする。"
 elevate_holy_site_decision_confirm: "聖地を格上げする"
 elevate_holy_site_decision_target_in_realm_or_head_of_faith: "[selected_item.GetName]が[actor.GetShortUINamePossessive]の[realm|E]内にある、または[actor.GetUIName]が[actor.GetFaith.GetName]の[head_of_faith|E]である必要がある"
 elevate_holy_site_decision_county_holder_correct_faith: "[selected_item.GetName]を持つ[county|E]が[actor.GetFaith.GetAdjective]の[ruler]によって統治されている必要がある"
 elevate_holy_site_decision_under_eminent_holy_sites_max: "[faith.GetName]が保有する[eminent_holy_sites|E]の数が[faith.GetReligion.GetType.GetEminentHolySitesMax]未満である"
 demote_holy_site_decision: "聖地を格下げする"
 demote_holy_site_decision_desc: "[ROOT.Char.GetFaith.GetName]の[eminent_holy_site|E]を普通の[holy_site|E]に格下げする。"
 demote_holy_site_decision_tooltip: "選択した[ROOT.Char.GetFaith.GetName]の[eminent_holy_site|E]を普通の[holy_site|E]に格下げする。"
 demote_holy_site_decision_confirm: "聖地を格下げする"
 demote_holy_site_decision_above_eminent_holy_sites_min: "[faith.GetName]が保有する[eminent_holy_sites|E]の数が[faith.GetReligion.GetType.GetEminentHolySitesMin]を上回っている"
 abandon_holy_site_decision: "聖地を放棄する"
 abandon_holy_site_decision_desc: "[ROOT.Char.GetFaith.GetName]の[holy_site|E]を放棄し、[faith|E]から完全に削除する。"
 abandon_holy_site_decision_tooltip: "選択した[holy_site|E]を[ROOT.Char.GetFaith.GetName]から削除する。"
 abandon_holy_site_decision_confirm: "聖地を放棄する"
 adopt_holy_site_decision: "聖地を採用する"
 adopt_holy_site_decision_desc: "あなたの[realm|E]内にある既存の[holy_site|E]を、[ROOT.Char.GetFaith.GetName]の[holy_site|E]として採用する。"
 adopt_holy_site_decision_tooltip: "選択した[holy_site|E]を[ROOT.Char.GetFaith.GetName]の[holy_site|E]として追加する。"
 adopt_holy_site_decision_confirm: "聖地を採用する"
 adopt_holy_site_decision_not_already_a_holy_site: "[selected_item.GetName]はまだ[actor.GetFaith.GetName]の[holy_site|E]ではない"
 adopt_holy_site_decision_shared_or_syncretic_faith: "[selected_item.GetName]が、[actor.GetFaith.GetName]と同じ[religion|E]の[faith|E]か、[actor.GetFaith.GetName]が習合している[faith|E]を1つ以上持ち、かつ[actor.GetFaith.GetName]がその[faith|E]を[faith_hostile|E]または[faith_evil|E]とみなしていない"
 adopt_holy_site_decision_active_site: "[selected_item.GetName]は現在も信仰されている[faith|E]の[holy_site|E]であり、その宗派を信仰する[county|E]が少なくとも1つ存在する。"
 adopt_holy_site_decision_under_holy_sites_max: "[faith.GetName]が保有する[holy_sites|E]が[faith.GetReligion.GetType.GetHolySitesMax]未満である"
 adopt_holy_site_in_realm: "[selected_item.GetName]があなたの[realm|E]内にある"
 abandon_holy_site_decision_above_holy_sites_min: "[faith.GetName]が保有する[holy_sites|E]が[faith.GetReligion.GetType.GetHolySitesMin]を上回っている"
 manage_holy_sites_hof_or_puppet_tt: "以下のいずれかを満たしている必要がある：\n#indent_newline:3 $EFFECT_LIST_BULLET$あなたが[faith|E]の[head_of_faith|E]である#!\n#indent_newline:3 $EFFECT_LIST_BULLET$あなたの[faith|E]の[head_of_faith|E]が、あなたの[clerical_puppet|E]または[external_clerical_puppet|E]である#!"
 manage_holy_sites_realm_priest_puppet_tt: "あなたの[faith|E]には[head_of_faith|E]が存在しないため、[clerical_puppet|E]が必要である"
 manage_holy_sites_piety_level_tt: "あなたの[faith|E]には[head_of_faith|E]が存在しないため、@piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip]以上の[piety_level|E]が必要である"
 holy_site_kingdom_already_used_tt: "あなたの[faith|E]が、この[barony|E]の慣習的[kingdom|E]において、[holy_site|E]をすでに創設または採用していてはならない"
 holy_site_creation_on_cooldown_tt: "最近あなたが別の[holy_site|E]を創設していてはならない"
 ai_remove_enshrined_artifact_decision: "#D AI Remove Enshrined Artifacts#!"
 ai_remove_enshrined_artifact_decision_desc: ""
 ai_remove_enshrined_artifact_decision_tooltip: ""
 ai_remove_enshrined_artifact_decision_confirm: "$CONFIRM$"
 ai_enshrine_artifact_decision: "#D AI Enshrine Artifact#!"
 ai_enshrine_artifact_decision_desc: ""
 ai_enshrine_artifact_decision_tooltip: ""
 ai_enshrine_artifact_decision_confirm: "$CONFIRM$"
 HOLY_SITE_LIST_TT: "#T [HolySite.GetNameNoTooltip]の[holy_site|E]#![AddParagraph( HolySite.GetType.GetEffectDesc( GetPlayer.GetFaith.Self, HolySite.GetBarony.Self ) )][AddParagraph( HolySite.GetInventoryDesc( GetPlayer.GetFaith.Self ) )]\n\n#I クリックして[holy_site]「[HolySite.GetName]」の詳細を表示#!"
