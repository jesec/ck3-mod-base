l_japanese:
 DISTRICT_DEBUG_KEY: "#D デバッグキー：#![DistrictType.GetKey]"
 DISTRICT_DEBUG_FULL: "#D DEBUG KEY AND DESC:#!\n[District.GetKey]\n[District.GetDescKey]"
 bureacratic_district_capital_trigger: "[root_scope.GetName]があなたの[realm_capital|E]である"
 civic_district_capital_trigger: "[root_scope.GetName]があなたの[capital|E]である"
 household_district_government_trigger: "あなたの[government|E]が[feudal|E]、[clan|E]、[administrative|E]、[celestial|E]、[meritocratic|E]、[ritsuryo|E]、または[soryo|E]である"
 household_district_top_liege_trigger: "[administrative|E]、[celestial|E]、[meritocratic|E][governments|E]で求められる通り、あなたが[independent_ruler|E]である"
 bureaucratic_district_ledger_or_administrative_trigger: "保持者が[administrative|E][government|E]を持っているか、この[barony|E]の[culture|E]が#V $innovation_ledger$#!の[innovation|E]を発見している"
 port_district_water_trigger: "この[barony|E]は海岸または河川に隣接して#bol いない#!"
 temple_district_trigger: "これは[county_capital|E]、[temple|E]、[temple_citadel|E]のいずれでもない"
 metropolitan_district_city_trigger: "これは[city_holding|E]である"
 ### Holdings ###
 castle_holding_district: "城砦領地区"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "部族領地区"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "都市領地区"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "寺院領地区"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "遊牧民の居住地区"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "遊牧集団の居住地区"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "寺院要塞領地区"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"
 DISTRICT_FOCUS_HEADING: "#low 地区方針\n#!"
 UNLOCKS_DISTRICTS: "#low アンロック済みの[districts|E]#!"
 ### Economy ###
 guild_district: "ギルド地区"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[trade_goods_i] [trade_goods|E]\n$BULLET_WITH_TAB$[gold_i] [sell_prices|E]"
 guild_district_desc_flavor: "ここのギルド会館には町随一の職人たちが集まり、技術の秘密を固く守っている。仕事の腕は一流だが、値段は高く、徒弟たちは酷使されている。"
 market_district: "市場地区"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[gold_i] [sell_prices|E]\n$BULLET_WITH_TAB$[gold_i] [buy_prices|E]\n$BULLET_WITH_TAB$[commerce_tax_i] [commerce_tax_short|E]と[artisan_tax_i] [artisan_tax|E]"
 market_district_desc_flavor: "この活気あふれる広場は、夜明けから日暮れまで、地域の農民や職人、商人たちでひしめき合っている。ここなら町で作れないものは何でも「適正」価格で手に入る。"
 port_district: "港湾地区"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i] [trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[maritime_tax_i] [maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E]"
 port_district_desc_flavor: "港沿いには桟橋や倉庫が立ち並び、港湾労働者たちが大小さまざまな船から貨物を荷揚げしている。海の向こうから届くものは何であれ、まずここを通る。"
 entrepot_location_district: "中継地区"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax_i] [commerce_tax|E]"
 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', 'その建造物を通じて商品を長距離にわたり転売可能' )|E]\n\n輸入品はこれらの倉庫で数を確認して仕分けされ、市場へと送り出される。ここの商人たちは常に何が品薄かを把握しており、それに応じた値段をつける。"
 entrepot_holding_district_level_2_tt: "レベル#V 2#!の[holding_district|E]が必要"
 entrepot_holding_district_level_3_tt: "レベル#V 3#!の[holding_district|E]が必要"
 entrepot_holding_district_level_4_tt: "レベル#V 4#!の[holding_district|E]が必要"
 holding_district_level_2_tt: "レベル#V 2#!の[holding_district|E]が必要"
 holding_district_level_3_tt: "レベル#V 3#!の[holding_district|E]が必要"
 holding_district_level_4_tt: "レベル#V 4#!の[holding_district|E]が必要"
 ### Fortification ###
 border_forts_district: "国境の砦地区"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i] [garrison|E]\n$BULLET_WITH_TAB$[stationed_regiment_i] [stationed_regiment|E]\n$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[control_i] [control|E]"
 border_forts_district_desc_flavor: "男爵領の境界沿いには砦が連なり、それぞれに駐屯する兵士たちは、道も川の渡し場も知り尽くしている。略奪者が攻め込んできても、奥深くまで進めることはめったにない。"
 walls_district: "城壁地区"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i] [fort_level|E]\n$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[garrison_i] [garrison|E]"
 walls_district_desc_flavor: "頑丈な石壁が町を取り囲み、略奪者から町を守っている。町の人々は門で徴収される通行料に不満をこぼしているが、略奪に遭うよりは安上がりだ。"
 ### Military ###
 military_district: "軍事地区"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i] [stationed_regiment|E]\n$BULLET_WITH_TAB$[siege_weapon_i] [siege_weapons|E]\n$BULLET_WITH_TAB$[garrison_i] [garrison|E]\n$BULLET_WITH_TAB$[supply_i] [supply|E]"
 military_district_desc_flavor: "頑丈な兵舎には領国の兵士たちが暮らし、食事を与えられ、訓練を受け、いつでも行軍できるよう備えている。兵士たちに酒を控えさせることができるかどうかは、また別の話だ。"
 ### Civic ###
 bureaucratic_district: "官庁地区"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i] [vassals|E]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence_i] [influence|E]\n$BULLET_WITH_TAB$[tax_collector|E]および[governor_efficiency|E]"
 bureaucratic_district_desc_flavor: "これらの庁舎では、地位の異なる役人たちが国務に関する文書を複写し、封印し、整理している。彼らの仕事が称賛されることはめったにないが、彼らがいなければ国の営みはすぐに立ち行かなくなる。"
 household_district: "王室"
 imperial_household_district: "皇室"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knight_i] [knights|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]"
 household_district_desc_flavor: "これらの大広間には統治者が朝廷を置く。高い城壁の内側では、使用人、熟練した職人、そして評議員たちによって王国の威厳が保たれている。中には、この地区から一歩も出ることなく生涯を過ごす者もいる。"
 mandala_district: "マンダラ地区"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i] [dynasty_prestige|E]\n$BULLET_WITH_TAB$[gold_i] [tax|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]"
 mandala_district_desc_flavor: "この神聖な区画における寺院や像、儀式は、すべて同じ物語を語っている。すなわち、王は神々の意志によって統治しているのだという物語だ。その主張は何度も、声高に繰り返されている。"
 temple_district: "宗教街区"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[religious_tax_i] [religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i] [epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]"
 temple_district_desc_flavor: "この一帯には礼拝所が数多くあり、鐘の音や聖歌、礼拝への呼びかけが一日を通して絶え間なく響いている。ここでは、聖職者たちが領主に匹敵するほどの影響力を持っている。"
 temple_district_christian: "教会街区"
 temple_district_islamic: "モスク地区"
 ### Metropolitan ###
 entertainment_district: "娯楽地区"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[urban_tax_i] [urban_tax|E]"
 entertainment_district_desc_flavor: "さまざまな音楽や遊戯、見世物に惹かれ、あらゆる階層の町人がこの区画に集まる。貴族たちは楽しんでいないふりをし、農民たちは貴族の姿など目に入らないふりをする。"
 patrician_district: "パトリシアン地区"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E]\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]"
 patrician_district_desc_flavor: "富裕層の邸宅が並ぶこの区画では、大理石や絹、輸入された香辛料も珍しくない。ここの家々は互いに婚姻を結び、金を貸し借りし、互いに陰謀を企てている。"
 urban_housing_district: "住宅地区"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E]と[settlement_size_growth_short|E]\n$BULLET_WITH_TAB$[urban_tax_i] [urban_taxes_short|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[urban_districts|E]をアンロック"
 urban_housing_district_desc_flavor: "市民の大半は、家々が密集するこの地区で暮らしている。一つ屋根の下に複数の家族が暮らすことも珍しくない。田舎から出てきた者にとって、ここはよりよい暮らしへの第一歩となる。"
 ### Rural ###
 manor_houses_district: "領主の館地区"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[fort_level_i] [fort_level|E]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax_short|E]と[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i] [supply|E]"
 manor_houses_district_desc_flavor: "田園地帯の各地には、周辺の土地を管理する下級貴族の一族が暮らす荘園邸宅が点在している。穀物や金銭が上納される一方で、不満の声もまた領主のもとへと届く。"
 religious_community_district: "宗教共同体地区"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[religious_tax_i] [religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i] [epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i] [travel_danger|E]"
 religious_community_district_desc_flavor: "信仰篤い人々がこの静かな共同体に集い、世俗から離れて祈りを捧げ、農作業に励み、聖典を書き写して暮らしている。しかし、世俗の問題は絶えず持ち込まれる。"
 villages_district: "村落地区"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E]の縮小\n$BULLET_WITH_TAB$[trade_goods_i] [trade_goods_production|E]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax_short|E]と[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i] [supply|E]$UNLOCKS_RURAL_DISTRICTS$"
 villages_district_desc_flavor: "城壁の外の田園地帯には村々が点在し、それぞれが畑と井戸を持っている。ここで暮らす農民たちが、町の人々が当たり前のように口にしている食料を育てている。"
 ### Tribal ###
 tribal_economy_prestige_district: "宴会場地区"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[gold_i] [tax|E]"
 tribal_economy_prestige_district_desc_flavor: "これらの宴会場には部族民が集い、食べ、飲み、手柄を自慢し合う。杯を重ねるたびに、語られる武勇伝も少しずつ大げさになっていく。"
 tribal_military_district: "戦士の集会所地区"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[men_at_arms_i] [men_at_arms|E]"
 tribal_military_district_desc_flavor: "部族の戦士たちはこれらの集会所で武器を研ぎ、過去の襲撃について語り合う。若者たちは熱心に耳を傾けながら、すでに自分たちの襲撃を計画している。"
 tribal_wanua_district: "ワンティラン地区"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i] [barter_goods|E]\n$BULLET_WITH_TAB$[vassal_limit_i] [vassal_limit|E]\n$BULLET_WITH_TAB$[domain_limit_i] [domain_limit|E]"
 tribal_wanua_district_desc_flavor: "人々は開放的な集会所に集まり、長老たちの前で不満を訴える。長老たちもまた、その声が族長に届くよう取り計らう。"
 ### Duchy ###
 bailiwick_district: "代官地区"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax_short|E]と[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[trade_goods_i] [trade_goods_production|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]"
 bailiwick_district_desc_flavor: "公爵領の営みを支える費用は、すべて田園地帯が負担している。この地区では代官たちが畑や家畜の群れ、村を一つずつ回り、納められるべきものを漏れなく取り立てている。"
 staple_district: "交易集散地区"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i] [urban_taxes_short|E]、[commerce_tax_i] [commerce_tax_short|E]、[artisan_tax_i] [artisan_tax_short|E]、[maritime_tax_i] [maritime_tax|E]\n$BULLET_WITH_TAB$[gold_i] [sell_prices|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i] [trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 staple_district_desc_flavor: "倉庫や計量所、会計所が立ち並ぶ交易集散地区では、公爵領で最も価値の高い交易品が計量され、課税され、保護されている。"
 endowment_district: "寄進地区"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i] [religious_tax|E]\n$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i] [epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i] [travel_danger|E]"
 endowment_district_desc_flavor: "この地区に寄進された財産は、永代にわたって保持される。ここの聖職者たちは、今では誰も名を覚えていない統治者たちから授かった特許状を保有している。"
 assay_district: "試金地区"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E]と[civic_tax_i] [civic_tax|E]\n$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[influence_i] [influence|E]\n$BULLET_WITH_TAB$[vassal_i] [vassals|E]"
 assay_district_desc_flavor: "この地区で鋳造された硬貨は、鋳造のたびに数枚ずつ箱に保管され、後日検査される。鋳造者が欲を出していないか確かめるためだ。"
 military_duchy_capital_district: "召集場地区"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i] [stationed_regiment|E]\n$BULLET_WITH_TAB$[garrison_i] [garrison|E]と[fort_level|E]\n$BULLET_WITH_TAB$[knight_i] [knights|E]"
 military_duchy_capital_district_desc_flavor: "この地区に召集された兵士は皆、名前と武具、馬を名簿に記録される。召集に応じなかった者の名も、同じように記録される。"
 ducal_residence_district: "公爵の邸宅地区"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[stress_i] [stress|E]"
 ducal_residence_district_desc_flavor: "この地区を訪れる客は、公爵にふさわしい広間や庭園でもてなされる。公爵領のさまざまな事柄も、宮廷よりこの地区で夕食を囲みながらが決まることのほうが多い。"
 royal_residence_district: "王宮地区"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[stress_i] [stress|E]"
 royal_residence_district_desc_flavor: "この地区を訪れる客は、王にふさわしい広間や庭園でもてなされる。領国のさまざまな事柄も、宮廷よりこの地区で夕食を囲みながらが決まることのほうが多い。"
 governance_district: "行政区"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[influence_i] [influence|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[men_at_arms_i] [men_at_arms|E]"
 governance_district_desc_flavor: "この地区の庁舎では、さまざまな地位の役人たちが働いている。州の税収を集計し、穀物倉を検査し、守備隊への給与を支給するのも彼らの仕事だ。"
 forestry_district: "林業地区"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_glass').GetNameWithIcon]、[GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon]、[GetTradeGoodType('trade_good_meat').GetNameWithIcon]"
 forestry_district_desc_flavor: "この一帯の森林からは、家屋や船の建材、燃料となる木材が得られる。その伐採権は厳重に管理されており、木材の盗伐には、鹿の密猟とほぼ同じ厳しい罰が科される。"
 grain_district: "穀物栽培地区"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 grain_district_desc_flavor: "穀物はあらゆる経済の基盤である。そしてこの地区の畑では、穀物が豊富に生産されている。パンに使われない穀物は、醸造酒や蒸留酒の原料になるか、そのまま売られる。"
 wool_district: "羊飼育地区"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]、[GetTradeGoodType('trade_good_leather').GetNameWithIcon]、[GetTradeGoodType('trade_good_cheese').GetNameWithIcon]、[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]、[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 wool_district_desc_flavor: "この地区の牧草地では羊の群れが草を食み、その羊毛は袋詰めにされ、領国内の各地の織工たちに売られる。大商人として財を築いた者の中には、羊の群れひとつから身を起こした者もいる。"
 cattle_district: "牛飼育地区"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_meat').GetNameWithIcon]、[GetTradeGoodType('trade_good_cheese').GetNameWithIcon]、[GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 cattle_district_desc_flavor: "この地区の牧草地では牛が草を食んでいる。牛は肉や乳が得られるだけでなく、すきによる耕作にも役立つため、重宝されている。花嫁の持参財産を牛の頭数で示す地域も、今なお少なくない。"
 cotton_district: "綿花栽培地区"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]、[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 cotton_district_desc_flavor: "この地区の畑では白い綿花が実り、手作業で摘み取られ、俵詰めにして売られる。遠い異国には、綿花に小さな羊が実ると信じている人々もいる。"
 stone_district: "採石地区"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 stone_district_desc_flavor: "この地区の丘陵には採石による傷跡が刻まれ、切り出された石材は領国各地の城壁や寺院、城の建造に使われている。領国屈指の建造物の中には、かつてこの地の丘陵の一部だった石から造られたものもある。"
 fish_district: "漁業地区"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i] [maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 fish_district_desc_flavor: "この地区で獲れた魚は、生で食べられるほか、塩漬けや燻製、乾燥加工されて、水が乏しい遠方の内陸部にまで運ばれ、取引される。大漁の時は、ひとつの村をひと月養うこともできる。"
 wine_district: "ブドウ畑地区"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 wine_district_desc_flavor: "この地区のブドウ畑では、生食用や乾燥用、そして何よりワイン用のブドウが栽培される。出来のよいワインは何十年も人々の記憶に刻まれるが、出来の悪い年のワインはさらに長く語り草にされる。"
 oil_district: "オリーブ栽培地区"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 oil_district_desc_flavor: "この地区で採れる油の用途は多岐に渡る。ランプの燃料や料理に使われるほか、信徒への塗油や富裕層の肌の手入れにも用いられる。ほとんどの家庭にとって欠かせない品だ。"
 rice_district: "稲作地区"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]と[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 rice_district_desc_flavor: "この地区では、水を張った田が段をなして広がり、村人たちが総出で田植えから草取り、収穫まで行う。稲作は、一つの家族だけで担うにはあまりにも手間がかかる。"
 millet_district: "キビ栽培地区"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_wood').GetNameWithIcon]"
 millet_district_desc_flavor: "この地区の乾燥した平原はキビやモロコシの畑に覆われ、これらの作物は馬に乗った人の姿を隠すほど高く育つ。小粒で硬い穀物は、何年も傷まずに保存できる。"
 mine_district: "鉱業地区"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_jewelry').GetNameWithIcon]"
 mine_district_desc_flavor: "この地区の地下に眠る鉄や銀、塩を掘り出す鉱夫たちは、地上よりも地下でより長い時間を過ごす。"
 salt_district: "採塩地区"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 salt_district_desc_flavor: "塩がなければ、食料の乏しい時期に備えて肉や魚を保存することも、軍隊に食料を供給し続けることもできない。この地区は大量の塩を供給しており、その重要性もよく心得ている。"
 amber_district: "琥珀採取地区"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "琥珀は嵐の後にこの地の海岸に打ち上げられ、内陸の砂地や湿地からも掘り出される。虫を閉じ込めた琥珀は、幸運をもたらすと考えられている。"
 silk_district: "絹生産地区"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]と[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 silk_district_desc_flavor: "この地区の絹は、小さな蚕から生まれる。蚕は昼夜を問わず桑の葉を与えられて育つ。一着の衣を作るには、何千匹もの蚕の繭が必要になる。"
 furs_district: "毛皮業地区"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 furs_district_desc_flavor: "この地区の罠猟師たちは、動物の毛皮が最も厚く、最も高値で売れる寒さの厳しい時期に狩りに出る。上質な毛皮一枚が、ひと季節分の稼ぎになることもある。"
 spices_district: "香辛料栽培地区"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 spices_district_desc_flavor: "この地の香辛料は、樹皮、芽、果実、根、さらには花の一部まで、植物のあらゆる部位から得られる。いずれも手作業で採取し、手間をかけて乾燥させる。"
 tea_district: "茶栽培地区"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 tea_district_desc_flavor: "この地区の急斜面では茶の木が育ち、朝には霧が立ちこめる。最高級の茶葉は新芽のうちに摘み取られ、芽ひとつと葉2枚を1組として収穫される。"
 dyes_district: "染料製造地区"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 dyes_district_desc_flavor: "この地区の染料は、根や葉、果実、さらにはすり潰した昆虫からも作られる。深みがあり、色落ちしにくい色を出すには、染めるものを染液に10回ほど浸す必要があることもある。"
 ivory_district: "象牙狩猟地区"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 ivory_district_desc_flavor: "この地区では象を捕獲して人に慣らし、戦争や労働、宗教儀式に使うために訓練する。象牙は、象が人々にもたらす価値の一部にすぎない。"
 sugar_district: "砂糖栽培地区"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 sugar_district_desc_flavor: "この地区ではサトウキビが高く伸び、収穫した茎を圧搾して甘い汁を搾り出す。その汁を煮詰めると、固い砂糖の塊ができる。遠い土地では、砂糖ひとかたまりが牛一頭より高値で取引される。"
 incense_district: "香料採取地区"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 incense_district_desc_flavor: "この地区の香は、木の樹皮に傷をつけて採取した樹脂を、日に当てて固めたものである。この香の煙は、世界各地の寺院で立ちのぼっている。"
 medicaments_district: "薬草採取地区"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 medicaments_district_desc_flavor: "この地区の庭園や野原に薬草が生えている。どの葉が病を癒やし、どの葉が害をもたらすのかを知る人々が、それらを採取している。"
 ceramics_district: "陶磁器製造地区"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_glass').GetNameWithIcon]"
 ceramics_district_desc_flavor: "陶工たちは非常に上質な粘土を求めて、何週間もかけてこの地区に足を運ぶ。ここで焼成された器の中でも、特に出来のよいものは、叩くと鐘のような音が鳴る。"
 hemp_district: "麻栽培地区"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 hemp_district_desc_flavor: "この地区一帯は麻畑に覆われている。人々は麻を刈り取り、水に浸してから叩き、繊維状にして、縄や布、帆布を作る。"
 flax_district: "亜麻栽培地区"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]と[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 flax_district_desc_flavor: "この地区では、亜麻を刈り取るのではなく根ごと引き抜き、繊維を余すところなく利用している。種子から油を搾り、搾りかすは家畜の餌にされている。"
 honey_district: "養蜂地区"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]と[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 honey_district_desc_flavor: "この地区では、藁や粘土で作った巣箱や、中をくり抜いた丸太で蜂を飼っている。蜂蜜を採るときは煙で蜂を落ち着かせる。多くの人にとって、生涯口にする甘味は蜂蜜だけだ。"
 fruit_district: "果樹園地区"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]と[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] 生産可能な交易品：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 fruit_district_desc_flavor: "この地区の斜面や谷には果樹園が広がっている。収穫される果実は、生のまま食べられるほか、日に干して乾燥させたり、搾汁したりして食される。"
 horses_district: "馬飼育地区"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 horses_district_desc_flavor: "この地区には広大な牧草地や放牧場、厩舎があり、馬の繁殖や調教が盛んに行われている。育てられた馬は、領内各地の人々に買われていく。"
