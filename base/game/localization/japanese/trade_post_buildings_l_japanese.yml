 building_type_trade_league_treasury_01: "同盟の宝物庫"
 building_type_trade_league_treasury_01_desc: "この宝物庫の鍵は同盟の都市がそれぞれ一本ずつ保管しており、すべての鍵が揃わない限り、それを開けることはできない。"
