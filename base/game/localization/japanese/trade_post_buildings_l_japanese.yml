 # Blacksmith Quarter #
 building_type_trade_blacksmith_quarter_01: "鍛冶場"
 building_type_trade_blacksmith_quarter_01_desc: "金属の価値はその純度で決まる。そのためこの鍛冶場に持ち込まれるすべての地金は計量されて純度が調べられ、刻印が押される。"
 trade_blacksmith_quarter_01: "$building_type_trade_blacksmith_quarter_01$"
 trade_blacksmith_quarter_02: "$building_type_trade_blacksmith_quarter_01$II"
 trade_blacksmith_quarter_03: "$building_type_trade_blacksmith_quarter_01$III"
 trade_blacksmith_quarter_04: "$building_type_trade_blacksmith_quarter_01$IV"
 trade_blacksmith_quarter_05: "$building_type_trade_blacksmith_quarter_01$V"
 # Gem Exchange #
 building_type_trade_gem_exchange_01: "宝石取引所"
 building_type_trade_gem_exchange_01_desc: "この宝石取引所の鑑定人たちは、太陽が直接差し込まない窓辺で、正午にだけ宝石を鑑定する。光が最も安定しているからだ。"
 trade_gem_exchange_01: "$building_type_trade_gem_exchange_01$"
 trade_gem_exchange_02: "$building_type_trade_gem_exchange_01$II"
 trade_gem_exchange_03: "$building_type_trade_gem_exchange_01$III"
 trade_gem_exchange_04: "$building_type_trade_gem_exchange_01$IV"
 trade_gem_exchange_05: "$building_type_trade_gem_exchange_01$V"
