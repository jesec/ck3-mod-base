 ##### Trade Post District #####
 trade_post_location_district: "交易所地区"
 trade_post_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods_i] [trade_goods|E]\n$BULLET_WITH_TAB$@trade_market_icon! [trade_market|E]\n$BULLET_WITH_TAB$[gold_i] [gold|E]\n$BULLET_WITH_TAB$[alliance_i] [alliance|E]\n\n#low アンロック#!\n$BULLET_WITH_TAB$この@trade_market_icon! [trade_market|E]を起点とする@trade_route_icon! [trade_routes|E]の開設が可能になる"
 trade_post_location_district_desc_flavor: "共和国や裕福なパトリシアンが商品やサービスを取引する場となる、大規模な交易複合施設。"
 # Trade Office #
 building_type_pb_trade_office_01: "交易事務所"
 building_type_pb_trade_office_01_desc: "この交易事務所の事務官たちは、あらゆる貨物を登録し、あらゆる契約に封印を施し、出航するすべての船に本国への報告書を託す。"
 pb_trade_office_01: "$building_type_pb_trade_office_01$"
 pb_trade_office_02: "$building_type_pb_trade_office_01$II"
 pb_trade_office_03: "$building_type_pb_trade_office_01$III"
 pb_trade_office_04: "$building_type_pb_trade_office_01$IV"
 # Counting House #
 building_type_trade_counting_house_01: "勘定所"
 building_type_trade_counting_house_01_desc: "この勘定所の事務官たちは、交易所の収益、債務、貸し付け金を一銭残らず記録している。"
 trade_counting_house_01: "$building_type_trade_counting_house_01$"
 trade_counting_house_02: "$building_type_trade_counting_house_01$II"
 trade_counting_house_03: "$building_type_trade_counting_house_01$III"
 trade_counting_house_04: "$building_type_trade_counting_house_01$IV"
 trade_counting_house_05: "$building_type_trade_counting_house_01$V"
 # Treasury #
 building_type_trade_treasury_01: "財務事務所"
 building_type_trade_treasury_01_desc: "数多くの国々の貨幣がこの財務事務所を通り、それぞれ重さを量られ、他の貨幣と比べてその価値を査定される。財務官は、貨幣の音を聞いただけで偽造貨幣を見分けられる。"
 trade_treasury_01: "$building_type_trade_treasury_01$"
 trade_treasury_02: "$building_type_trade_treasury_01$II"
 trade_treasury_03: "$building_type_trade_treasury_01$III"
 trade_treasury_04: "$building_type_trade_treasury_01$IV"
 trade_treasury_05: "$building_type_trade_treasury_01$V"
 # Recruitment Office #
 building_type_trade_recruitment_office_01: "徴兵事務所"
 building_type_trade_recruitment_office_01_desc: "兵士や水夫、警備兵たちがこの募兵事務所に登録し、交易所に季節単位または年単位で奉仕する。"
 trade_recruitment_office_01: "$building_type_trade_recruitment_office_01$"
 trade_recruitment_office_02: "$building_type_trade_recruitment_office_01$II"
 trade_recruitment_office_03: "$building_type_trade_recruitment_office_01$III"
 trade_recruitment_office_04: "$building_type_trade_recruitment_office_01$IV"
 trade_recruitment_office_05: "$building_type_trade_recruitment_office_01$V"
 # Office of Foreign Stipendiaries #
 building_type_trade_mercenary_office_01: "俸給外国人事務所"
 building_type_trade_mercenary_office_01_desc: "傭兵団の隊長たちはこの事務所を訪れ、報酬や契約条件、強奪品の分け前について交渉する。誰も相手を信用していないため、すべての条項が書き留められる。"
 trade_mercenary_office_01: "$building_type_trade_mercenary_office_01$"
 trade_mercenary_office_02: "$building_type_trade_mercenary_office_01$II"
 trade_mercenary_office_03: "$building_type_trade_mercenary_office_01$III"
 trade_mercenary_office_04: "$building_type_trade_mercenary_office_01$IV"
 trade_mercenary_office_05: "$building_type_trade_mercenary_office_01$V"
 # Watchtower #
 building_type_trade_watchtower_01: "見張り塔"
 building_type_trade_watchtower_01_desc: "この見張り塔の頂上から、警備兵たちは何マイルも先まで見すことができる。ただし、彼らが見張っているのはもっぱら倉庫の扉だ。"
 trade_watchtower_01: "$building_type_trade_watchtower_01$"
 trade_watchtower_02: "$building_type_trade_watchtower_01$II"
 trade_watchtower_03: "$building_type_trade_watchtower_01$III"
 trade_watchtower_04: "$building_type_trade_watchtower_01$IV"
 trade_watchtower_05: "$building_type_trade_watchtower_01$V"
 # Shipyard #
 building_type_trade_shipyard_01: "造船所"
 building_type_trade_shipyard_01_desc: "この造船所の船大工たちは、地元の市場で手に入るあらゆる資材を使って損傷した船を修繕する。そのため、修理の仕上がりは毎回少しずつ異なる。"
 trade_shipyard_01: "$building_type_trade_shipyard_01$"
 trade_shipyard_02: "$building_type_trade_shipyard_01$II"
 trade_shipyard_03: "$building_type_trade_shipyard_01$III"
 trade_shipyard_04: "$building_type_trade_shipyard_01$IV"
 trade_shipyard_05: "$building_type_trade_shipyard_01$V"
 # Merchant Guesthouse #
 building_type_trade_lodgings_01: "商人宿"
 building_type_trade_lodgings_01_desc: "この宿泊所では、訪れた商人に清潔な寝床、鍵のかかる箱、そして温かい食事を提供する。商会の関係者は妥当な料金で利用できるが、それ以外の者は倍を支払う。"
 trade_lodgings_01: "$building_type_trade_lodgings_01$"
 trade_lodgings_02: "$building_type_trade_lodgings_01$II"
 trade_lodgings_03: "$building_type_trade_lodgings_01$III"
 trade_lodgings_04: "$building_type_trade_lodgings_01$IV"
 trade_lodgings_05: "$building_type_trade_lodgings_01$V"
 # Warehouse #
 building_type_trade_warehouse_01: "倉庫"
 building_type_trade_warehouse_01_desc: "この倉庫内の木箱にはすべて所有者の印が付けられている。何一つとして倉庫長の封印なしに門から外に持ち出すことはできない。"
 trade_warehouse_01: "$building_type_trade_warehouse_01$"
 trade_warehouse_02: "$building_type_trade_warehouse_01$II"
 trade_warehouse_03: "$building_type_trade_warehouse_01$III"
 trade_warehouse_04: "$building_type_trade_warehouse_01$IV"
 trade_warehouse_05: "$building_type_trade_warehouse_01$V"
 # Secure Storeroom #
 building_type_trade_secure_storeroom_01: "貯蔵室"
 building_type_trade_secure_storeroom_01_desc: "この貯蔵室には交易所で最も貴重な品々が収められており、警備の者たちには盗人を退けるべく手厚い報酬が支払われている。そして、その中身を詮索せぬよう、さらに破格の口止め料も払われている。"
 trade_secure_storeroom_01: "$building_type_trade_secure_storeroom_01$"
 trade_secure_storeroom_02: "$building_type_trade_secure_storeroom_01$II"
 trade_secure_storeroom_03: "$building_type_trade_secure_storeroom_01$III"
 trade_secure_storeroom_04: "$building_type_trade_secure_storeroom_01$IV"
 trade_secure_storeroom_05: "$building_type_trade_secure_storeroom_01$V"
 # Granary #
 building_type_trade_granary_01: "穀物庫"
 building_type_trade_granary_01_desc: "豊作後に安く買い付た穀物は、価格が再び上昇するまでこれらの貯蔵庫に保管される。遅かれ早かれ、価格は必ず上がるのだ。"
 trade_granary_01: "$building_type_trade_granary_01$"
 trade_granary_02: "$building_type_trade_granary_01$II"
 trade_granary_03: "$building_type_trade_granary_01$III"
 trade_granary_04: "$building_type_trade_granary_01$IV"
 trade_granary_05: "$building_type_trade_granary_01$V"
 # Cellar #
 building_type_trade_cellar_01: "地下貯蔵庫"
 building_type_trade_cellar_01_desc: "母国から運ばれたワインは地元の酒とともにこの地下貯蔵庫に保管される。望郷の念に駆られる商人たちには慰めとなるが、それ以外の者にとっては贅沢品だ。"
 trade_cellar_01: "$building_type_trade_cellar_01$"
 trade_cellar_02: "$building_type_trade_cellar_01$II"
 trade_cellar_03: "$building_type_trade_cellar_01$III"
 trade_cellar_04: "$building_type_trade_cellar_01$IV"
 trade_cellar_05: "$building_type_trade_cellar_01$V"
 # Food Depot #
 building_type_trade_food_depot_01: "保存庫"
 building_type_trade_food_depot_01_desc: "この保存庫には塩漬け肉やチーズ、油、蜂蜜が蓄えられており、長い旅や食料の乏しい季節への備えとなっている。"
 trade_food_depot_01: "$building_type_trade_food_depot_01$"
 trade_food_depot_02: "$building_type_trade_food_depot_01$II"
 trade_food_depot_03: "$building_type_trade_food_depot_01$III"
 trade_food_depot_04: "$building_type_trade_food_depot_01$IV"
 trade_food_depot_05: "$building_type_trade_food_depot_01$V"
 # Cloth Hall #
 building_type_trade_cloth_hall_01: "織物所"
 building_type_trade_cloth_hall_01_desc: "この織物所では毛織物、亜麻布、絹織物の反物が買い付けられ、検品を経て保管された後、国外に出荷される。"
 trade_cloth_hall_01: "$building_type_trade_cloth_hall_01$"
 trade_cloth_hall_02: "$building_type_trade_cloth_hall_01$II"
 trade_cloth_hall_03: "$building_type_trade_cloth_hall_01$III"
 trade_cloth_hall_04: "$building_type_trade_cloth_hall_01$IV"
 trade_cloth_hall_05: "$building_type_trade_cloth_hall_01$V"
 # Tanners' Stables #
 building_type_trade_tanners_stables_01: "皮なめし職人の厩舎"
 building_type_trade_tanners_stables_01_desc: "これらの厩舎の買い手は、代金を支払う前に必ず馬の歯を確かめる。売り手が言う馬の年齢ほど、当てにならないものはないからだ。"
 trade_tanners_stables_01: "$building_type_trade_tanners_stables_01$"
 trade_tanners_stables_02: "$building_type_trade_tanners_stables_01$II"
 trade_tanners_stables_03: "$building_type_trade_tanners_stables_01$III"
