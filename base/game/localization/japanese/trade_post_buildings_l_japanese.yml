 building_type_trade_apothecary_guild_01_desc: "この薬屋ギルドの会員たちは、交易所を通過する香辛料、香、そして医薬品を、その匂い、味、手触りで等級分けしている。"
 trade_apothecary_guild_01: "$building_type_trade_apothecary_guild_01$"
 trade_apothecary_guild_02: "$building_type_trade_apothecary_guild_01$II"
