 trade_consulate_05: "$building_type_trade_consulate_01$V"
 # League Arsenal #
 building_type_trade_league_arsenal_01: "武器庫"
 building_type_trade_league_arsenal_01_desc: "この兵器庫は何千という武器を保管している。それは一隻の軍艦や一個の守備隊をたった一日で武装するのに十分な量だ。"
