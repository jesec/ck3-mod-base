 building_type_wieliczka_mines_01: "ヴィエリチカ岩塩坑"
 building_type_wieliczka_mines_01_desc: "この地には、地域全体の需要を賄えるほどの豊富な岩塩が眠っている。塩の採掘は、何世代にもわたってこの地を潤し続けるだろう。"
