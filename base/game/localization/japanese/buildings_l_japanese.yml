 building_type_taghaza_mines_01: "タガザ塩田"
 building_type_taghaza_mines_01_desc: "タガザ岩塩坑はマグリブと西アフリカの塩の大部分の原産地である。"
 taghaza_mines_01: "タガザ鉱山採掘ピット"
