 sankore_university_desc: "$building_type_sankore_university_desc$"
 building_type_siena_university: "シエナ大学"
 building_type_siena_university_desc: "$building_type_generic_university_desc$\n\nシエナ大学の運営資金と教職員たちの給与はシエナの税金で賄われている。具体的には学生たちに部屋を貸している者たちからの税金である。"
