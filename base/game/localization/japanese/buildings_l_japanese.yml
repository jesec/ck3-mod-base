 building_type_zawar_mines_01: "ザワー鉱山"
 building_type_zawar_mines_01_desc: "ザワー鉱山には数千年前から豊富な鉛、亜鉛、銀の存在が確認されている。ザワーの鉱床の特徴はその資源の豊富さだけでなく、高度な冶金技術がなくとも手作業で鉱石を分別できるほどにはっきりと鉱床が分断されているところにある。"
