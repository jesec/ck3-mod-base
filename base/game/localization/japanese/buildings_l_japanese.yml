 building_type_takkeda_mines_01: "タッケダ鉱山"
 building_type_takkeda_mines_01_desc: "アイル山地には豊富な銅鉱床があり、有史以前からタッケダで採掘されてきた。"
 takkeda_mines_01: "タッケダ鉱山集落"
