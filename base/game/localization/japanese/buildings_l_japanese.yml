 mozu_tombs: "百舌鳥古墳群"
 mozu_tombs_desc: "鍵穴の形をした百舌鳥の墳丘には古代の天皇が眠るという。近くの湾を航行する船にとっては、目印であると同時に、過ぎ去った時代を思い起こさせる存在でもある。"
