 building_type_zigong_mines_01: "自流井および貢井塩井"
 building_type_zigong_mines_01_desc: "塩の採掘における独自の優位性から、この地域は数千年前の殷王朝の時代から、地の底深くから塩を抽出する拠点となってきた。今日においても、そして今後も、この地は地域経済における主要な要素であり続ける。"
 zigong_mines_01: "自流井および貢井鉱山集落"
