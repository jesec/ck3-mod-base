 building_type_holy_site_imam_ali_mosque_01: "イマーム・アリーのモスク"
 building_type_holy_site_imam_ali_mosque_01_desc: "イマーム・アリーのモスクには、ムハンマドのいとこであり、その死後初のシーア派のイマ―マとなったアリの墓地がある。毎年何千人もの巡礼者たちがここを訪れ、モスクの壮大な緑色のドームに出迎えられる。"
 holy_site_imam_ali_mosque_01: "$building_type_holy_site_imam_ali_mosque_01$"
 holy_site_imam_ali_mosque_01_desc: "$building_type_holy_site_imam_ali_mosque_01_desc$"
 building_type_holy_site_great_mosque_of_mecca_01: "マスジド・ハラーム"
 building_type_holy_site_great_mosque_of_mecca_01_desc: "マスジド・ハラームは巨大な古代建造物で、その壁はカアバ聖殿を取り囲んでいる。その建造以来、多くの君主たちがモスクや周囲の建物を改修している。イスラム教徒はハッジの最中に必ずここを訪れなければならない。"
 holy_site_great_mosque_of_mecca_01: "$building_type_holy_site_great_mosque_of_mecca_01$"
 holy_site_great_mosque_of_mecca_01_desc: "$building_type_holy_site_great_mosque_of_mecca_01_desc$"
 building_type_holy_site_cologne_cathedral_01: "ケルン大聖堂"
 building_type_holy_site_cologne_cathedral_01_desc: "ケルン大聖堂には東方の三博士の遺物が置かれており、世界からキリスト教の巡礼者が多く訪れる。大聖堂はゴシック様式で建築され、尖塔や細かい飾りつけで豪華に装飾されている。"
 holy_site_cologne_cathedral_01: "$building_type_holy_site_cologne_cathedral_01$"
 holy_site_cologne_cathedral_01_desc: "$building_type_holy_site_cologne_cathedral_01_desc$"
 building_type_holy_site_canterbury_cathedral_01: "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_01_desc: "ローマの伝道者であり後に大司教となったアウグスティヌスが、この町をケントの司教管区の中心地として定めた後にカンタベリー大聖堂を建設した。この新しい大聖堂は再び街の重要性を高め、イングランド国教会を超える権威を得た。"
 holy_site_canterbury_cathedral_01: "カンタベリーのバシリカ"
 holy_site_canterbury_cathedral_01_desc: "$building_type_holy_site_canterbury_cathedral_01_desc$"
 building_type_holy_site_canterbury_cathedral_02: "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_02_desc: "大聖堂といえども時間の流れや厳しい環境の影響と無縁というわけではない。火事による損傷部分の修繕の際には、ノルマン様式が選ばれた。以前のバリシカは新たな十字型の身廊となり、後になって自律型の鐘楼が追加された。"
 holy_site_canterbury_cathedral_02: "カンタベリー神殿"
 holy_site_canterbury_cathedral_02_desc: "$building_type_holy_site_canterbury_cathedral_02_desc$"
 building_type_holy_site_canterbury_cathedral_03: "カンタベリー大聖堂"
 building_type_holy_site_canterbury_cathedral_03_desc: "大聖堂が酷く損傷したことで、新たな再建設計画が求められた。一部ではまだノルマン様式の構造が残されているものの、人気のゴシック様式が採用されたことで背の高い建造物になった。"
 holy_site_canterbury_cathedral_03: "$building_type_holy_site_canterbury_cathedral_02$"
 holy_site_canterbury_cathedral_03_desc: "$building_type_holy_site_canterbury_cathedral_02_desc$"
 building_type_doges_palace_01: "ドゥカーレ宮殿"
 building_type_doges_palace_01_desc: "ドゥカーレ宮殿はヴェネツィア共和国政府の公邸だ。荘厳で見事な建物の中には、議会、評議会、政権、司法など、それぞれの専用部屋がある。"
 doges_palace_01: "$building_type_doges_palace_01$"
 doges_palace_01_desc: "$building_type_doges_palace_01_desc$"
 building_type_visby_ringmur_01: "ヴィスビーの輪壁"
 building_type_visby_ringmur_01_desc: "ヴィスビーの街の壁は、侵略者やデーン人などの外敵から街を守っている。ゴットランドから送られてくる収税官も止めてくれるため効率が良い！ 中の富を得るためには、敵は射手の陣取る塔の大群を突破しなければならない。"
 visby_ringmur_01: "$building_type_visby_ringmur_01$"
 visby_ringmur_01_desc: "$building_type_visby_ringmur_01_desc$"
 building_type_walls_of_benin_01: "ベニンの壁"
 building_type_walls_of_benin_01_desc: "ベニンの壁は、#low （エドの言葉でイヤと呼ばれる）#!, 巨大な土手でベニン全体を囲っている。壁は土手と堤でできており、内側には堀、外側には塁壁がある。"
 walls_of_benin_01: "$building_type_walls_of_benin_01$"
 walls_of_benin_01_desc: "$building_type_walls_of_benin_01_desc$"
 building_type_the_friday_mosque_01: "金曜モスク"
 building_type_the_friday_mosque_01_desc: "金曜モスクは別名エスファハーンのジャーメ・モスクとも呼ばれ、ウマイヤ朝の時代に建てられた。カリフ自らが支柱のひとつを建てたとされている。モスクになる前はゾロアスター教徒の礼拝所であったとされる。"
 the_friday_mosque_01: "$building_type_the_friday_mosque_01$"
 the_friday_mosque_01_desc: "$building_type_the_friday_mosque_01_desc$"
 building_type_brihadeeswarar_temple_01: "ブリハディーシュヴァラ寺院"
 building_type_brihadeeswarar_temple_01_desc: "ブリハディーシュヴァラ寺院はヒンドゥー教の神シヴァに捧げられて作られたもので、ドラヴィダの建築様式で建てられた南インドの寺院では最も大きいもののひとつである。寺院の名前はサンスクリット語の複合語で、大雑把に翻訳すると「偉大なる神シヴァの寺院」となる。"
 brihadeeswarar_temple_01: "$building_type_brihadeeswarar_temple_01$"
 brihadeeswarar_temple_01_desc: "$building_type_brihadeeswarar_temple_01_desc$"
 building_type_holy_site_mahabodhi_temple_01: "マハーボーディ寺院"
 building_type_holy_site_mahabodhi_temple_01_desc: "マハーボーディ寺院は、仏陀が悟りを開いたとされる場所に建っている。仏教徒とヒンドゥー教徒の両方にとって、巡礼における重要な場所だ。寺院の建設は200年ごろにアショーカ王によって始められ、以後何度も改修、復元がなされている。"
 holy_site_mahabodhi_temple_01: "$building_type_holy_site_mahabodhi_temple_01$"
 holy_site_mahabodhi_temple_01_desc: "$building_type_holy_site_mahabodhi_temple_01_desc$"
 building_type_holy_site_great_mosque_of_cordoba_01: "コルドバの大モスク"
 building_type_holy_site_great_mosque_of_cordoba_01_desc: "コルドバの大モスクはイスラムによる西ゴート王国の征服後、キリスト教会の創立に伴い建てられた。元々はイスラム教徒とキリスト教徒が分け合って使用していたが、その後キリスト教側が買い取られ、モスク建設のため取り壊された。"
 holy_site_great_mosque_of_cordoba_01: "$building_type_holy_site_great_mosque_of_cordoba_01$"
 holy_site_great_mosque_of_cordoba_01_desc: "$building_type_holy_site_great_mosque_of_cordoba_01_desc$"
 building_type_walls_of_genoa_01: "ジェノヴァの壁"
 building_type_walls_of_genoa_01_desc: "ジェノヴァの壁は、街に自治権が与えられた後、9世紀に建てられた。壁と海岸線が合わさることでこの街は大いに発展し、繁栄することになった。"
 walls_of_genoa_01: "$building_type_walls_of_genoa_01$"
 walls_of_genoa_01_desc: "$building_type_walls_of_genoa_01_desc$"
 building_type_holy_site_great_mosque_of_djenne_01: "泥のモスク"
 building_type_holy_site_great_mosque_of_djenne_01_desc: "泥のモスクはバニ川の土手に建っている。すべて泥レンガでできているためかなりの手入れが必要だが、信者たちは喜んで手間をかける。毎年モスクの修理・改修のため多くの人々が集まる。"
 holy_site_great_mosque_of_djenne_01: "$building_type_holy_site_great_mosque_of_djenne_01$"
 holy_site_great_mosque_of_djenne_01_desc: "$building_type_holy_site_great_mosque_of_djenne_01_desc$"
 building_type_holy_site_great_mosque_of_samarra_01: "サーマッラーの大モスク"
 building_type_holy_site_great_mosque_of_samarra_01_desc: "サーマッラーの大モスクは、サーマッラーを統治していたアッバース朝のカリフ・ムタワッキルによって851年に建てられた。最も特徴的な部分は、天高く伸びるマルウィヤ・ミナレットというらせん状の尖塔だ。"
 holy_site_great_mosque_of_samarra_01: "$building_type_holy_site_great_mosque_of_samarra_01$"
 holy_site_great_mosque_of_samarra_01_desc: "$building_type_holy_site_great_mosque_of_samarra_01_desc$"
 building_type_holy_site_prophetic_mosque_01: "預言者のモスク"
 building_type_holy_site_prophetic_mosque_01_desc: "預言者のモスク、別名アル・マスジド・アン・ナバウィは、ムハンマド本人が建てた屋外モスクだ。彼が建てたモスクの中では初期のもので、彼の住居にも近い。"
 holy_site_prophetic_mosque_01: "$building_type_holy_site_prophetic_mosque_01$"
 holy_site_prophetic_mosque_01_desc: "$building_type_holy_site_prophetic_mosque_01_desc$"
 building_type_generic_university: "大学"
 building_type_generic_university_desc: "大学は富に余裕があり、入学するに値する能力があると認められた者のための高等教育施設だ。様々な学者や科学者が集まり、議論、研究、執筆を繰り返し、知恵を貯め込む。"
