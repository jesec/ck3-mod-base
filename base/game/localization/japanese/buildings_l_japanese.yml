 ratnapura_mines_02: "ラトゥナプラ鉱山"
 ratnapura_mines_02_desc: "宝石類の採掘量を増やすため、採掘ピットが拡張され、技師が集められた。"
 ratnapura_mines_03: "ラトゥナプラ大鉱山"
 ratnapura_mines_03_desc: "たくさんの採掘ピットを囲むように村ができ、労働者たちは日常的に巨大な宝石類を採掘している。"
 ratnapura_mines_04: "ラトゥナプラ鉱区"
 ratnapura_mines_04_desc: "宝石類の採掘が工業的と言えるまでに開発され、数千の労働者が働いている。無尽蔵の資源はまるで鉱山から流れ出てくるようである。"
 building_type_mogok_mines_01: "モゴック渓谷の鉱山"
 building_type_mogok_mines_01_desc: "モゴック渓谷はルビーやサファイア、そしてスピネルやガーネットのような価値の低い原石の産地として有名だ。\n「ルビーの谷」は採掘量よりも、原石の品質で際立っている。大地から掘り出された深紅の石は、灼熱の太陽に照らされ、ほかでは見ることのできない輝きを放つ。"
