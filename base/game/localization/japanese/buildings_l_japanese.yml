 building_type_rammelsberg_mines_01: "ランメルスベルク鉱山"
 building_type_rammelsberg_mines_01_desc: "ランメルスベルク山の麓には、多くの利益を生む有望な銀山がある。"
 rammelsberg_mines_01: "ランメルスベルク鉱山集落"
 rammelsberg_mines_01_desc: "鉱脈の近くに小さな鉱山集落ができた。住人たちは鉱脈を開発して鉱石を取り出し始めたが、まだ表面を削っているに過ぎない。"
 rammelsberg_mines_02: "ランメルスベルク鉱山"
 rammelsberg_mines_02_desc: "集落が大きくなるにつれ多くの鉱石が取り出されている。有能な技師が入ってきたことでれっきとした鉱山の建設が可能となった。"
 rammelsberg_mines_03: "ランメルスベルク大鉱山"
 rammelsberg_mines_03_desc: "採鉱の規模が大きくなるにつれ鉱山そのものも大きくなっている。入口が増設され、大きなシャフトが掘られたことで深い部分の鉱石が採れるようになった。"
 rammelsberg_mines_04: "ランメルスベルク鉱区"
 rammelsberg_mines_04_desc: "鉱石の生産が増加し、集落の周囲にはいくつかの鋳造工場や製錬所が設置されている。住人たちにとって金属の加工は日常的な作業となり、その技術は世界でも有名となった。"
