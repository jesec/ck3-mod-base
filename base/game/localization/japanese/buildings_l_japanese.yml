 building_type_byeokran_port_01_desc: "$byeokran_port_01_desc$"
 byeokran_port_01: "ビョクラン港" #碧瀾渡 (벽란도)
 byeokran_port_01_desc: "ガソン市の西、リョソン川の河口に位置するビョクラン港は、北の国境や山脈を避けて外国の物資や旅行者が朝鮮半島に入ることのできる、最も直接的な経路となっている。"
 building_type_sado_mines_01: "$sado_mines_02$" #佐渡金山
 building_type_sado_mines_01_desc: "$sado_mines_01_desc$"
 sado_mines_01: "佐渡金坑"
 sado_mines_01_desc: "流刑地として知られていた佐渡島の地下に、これほど多くの金が隠されていたとは、誰も予想していなかっただろう。"
 sado_mines_02: "佐渡金山"
 sado_mines_02_desc: "金の採掘事業を本格的に拡大するため、採掘坑が拡張され、技師が集められた。"
 sado_mines_03: "佐渡大金山"
 sado_mines_03_desc: "多くの採掘坑を囲むように村が形成され、労働者たちは次々と新しい金鉱脈を発見している。"
 sado_mines_04: "佐渡金鉱区"
 sado_mines_04_desc: "金の採掘業はほぼ産業規模に拡大し、労働者の数は現在数千人にのぼっている。鉱山からは、まるで無限の富が流れ出ているようだ。"
