 ijil_mines_02: "イジル鉱山"
 ijil_mines_02_desc: "集落が大きくなるにつれて、塩の採掘量もますます増えている。有能な技師が入ってきたことで真っ当な鉱山の建設が可能となった。"
 ijil_mines_03: "イジル大鉱山"
 ijil_mines_03_desc: "採掘の規模が大きくなるにつれ、鉱山そのものも大きくなっている。入口が増設され、大きなシャフトが掘られたことで深い部分の塩が採れるようになった。"
 ijil_mines_04: "イジル鉱区"
 ijil_mines_04_desc: "塩の生産量が増えたことで、世界中から商人や職人が集まってくるようになった。"
 building_type_turda_mines_01: "トルダ岩塩坑"
 building_type_turda_mines_01_desc: "トルダの巨大な岩塩の山地は数世紀に渡ってトランシルヴァニアの経済の中心だった。鉱山と岩塩市場は今もなお同地域の大きな収入源である。"
