 water_temples_4: "$water_temples$IV"
 water_temples_5: "$water_temples$V"
 building_water_temples_01: "スバックの堰と田の祠"
 building_water_temples_01_desc: "小さな堰と土の水路が水田をつなぎ、祠を通じて供物や作業当番を管理する。収量に安定したゆとりが生まれ、祭礼も行われるようになる。"
 building_water_temples_02: "スバック評議会の祠"
 building_water_temples_02_desc: "複数の祠がより広域の「スバック」を取りまとめ、暦に基づいて水を分配する。争いごとや修繕は共同で処理され、管理と収量が向上する。"
 building_water_temples_03: "水利寺院のネットワーク"
 building_water_temples_03_desc: "本格的な水利寺院のネットワークが、作付けと休耕の周期を地域全体で同期し、監視する。これによって害虫が減り、収量が増え、祭礼もより信心深いものになる。"
 building_water_temples_04: "水利寺院の偉大な景観"
 building_water_temples_04_desc: "排水路全体が寺院主導の集会を通じて統制され、棚田や水門、祭礼がこの州を敬虔なる穀倉地帯にしている。"
 building_type_stilted_granaries_01: "高床穀物倉"
 building_type_stilted_granaries_01_desc: "4本以上の柱で支えられた、ネズミ対策が講じられた高床式の納屋。貢ぎ物や軍団用の糧食の保存に最適。"
 building_stilted_granaries_01: "杭上穀物倉"
 building_stilted_granaries_01_desc: "4本の柱の上に建てられた簡素な納屋で、種や貢ぎ物を乾燥状態で保管でき、遠征に出る村の警備隊もよりよい食事ができる。"
 building_stilted_granaries_02: "穀物倉の列"
 building_stilted_granaries_02_desc: "ネズミ除けと屋根付き階段を備えた高床倉庫が一列に並ぶ。穀物の納税がより安定し、徴収効率も向上する。"
 building_stilted_granaries_03: "彫刻入り高床穀物倉"
 building_stilted_granaries_03_desc: "威信を示す彫刻がゆとりを象徴する。管理人が食料の貯蔵と配給を交代で行って長距離行軍に備える。"
 building_stilted_granaries_04: "穀物倉の区画"
 building_stilted_granaries_04_desc: "監視用の差し掛け小屋と記録小屋を備えた、柵で囲まれた穀物倉群。食料の安全保障が伯爵領全体を安定させる。"
 building_type_kora_kora_yards_01: "コラコラ置き場"
 building_type_kora_kora_yards_01_desc: "氏族のアウトリガー式戦闘用カヌー用の小屋と進水台。"
 kora_kora_yards: "$building_type_kora_kora_yards_01$"
 building_type_kora_kora_yards_1: "$kora_kora_yards$"
 building_type_kora_kora_yards_1_desc: "$building_type_kora_kora_yards_01_desc$"
 kora_kora_yards_1: "$kora_kora_yards$"
 kora_kora_yards_2: "$kora_kora_yards$II"
 kora_kora_yards_3: "$kora_kora_yards$III"
 kora_kora_yards_4: "$kora_kora_yards$IV"
 kora_kora_yards_5: "$kora_kora_yards$V"
 building_kora_kora_yards_01: "カヌー小屋"
 building_kora_kora_yards_01_desc: "パドルで漕ぐアウトリガー式カヌーのための屋根付き船台。乗組員は沿岸襲撃や島間の航行に備えた訓練を行う。"
 building_kora_kora_yards_02: "氏族の船置き場"
 building_kora_kora_yards_02_desc: "木材、繊維の縄、予備のアウトリガーを備蓄して、迅速な修繕を可能にし、襲撃隊は戦利品や物々交換品を持ち帰る。"
 building_kora_kora_yards_03: "コラコラ造船所"
 building_kora_kora_yards_03_desc: "より大きな船体、戦闘用の甲板、そして信号用の太鼓。沿岸警備や季節的な遠征が、生活（と収入）のリズムを刻む。"
 building_kora_kora_yards_04: "戦闘用カヌーの大規模な兵器庫"
 building_kora_kora_yards_04_desc: "船大工の棟梁たちが全艦隊の装備を整え、進水台、艤装作業場、召集用拠点が近隣地域に恐怖を与える。"
 building_type_idjang_forts_01: "イジャン砦"
 building_type_idjang_forts_01_desc: "段丘状の部族の要塞で、尾根や小高い丘の上の拠点となる。"
 idjang_forts: "$building_type_idjang_forts_01$"
 building_type_idjang_forts_1: "$idjang_forts$"
 building_type_idjang_forts_1_desc: "$building_type_idjang_forts_01_desc$"
 idjang_forts_1: "$idjang_forts$"
 idjang_forts_2: "$idjang_forts$II"
 idjang_forts_3: "$idjang_forts$III"
 idjang_forts_4: "$idjang_forts$IV"
 idjang_forts_5: "$idjang_forts$V"
 building_idjang_forts_01: "防御柵で囲んだイジャン"
 building_idjang_forts_01_desc: "防御に適した丘の頂上を木の柵が囲み、篝火と空堀が襲撃隊を退ける。"
 building_idjang_forts_02: "石壁のイジャン"
 building_idjang_forts_02_desc: "重要な壁面を木材ではなく石積みの擁壁で覆い、屋根付きの通路で守備兵は安全に行き来できる。"
 building_idjang_forts_03: "ひな壇型のイジャン"
 building_idjang_forts_03_desc: "階段状の進入路、出撃用の階段、射撃用の平台により、致命的な角度で矢や槍を打ち込むことができる。"
 building_idjang_forts_04: "城塞イジャン"
 building_idjang_forts_04_desc: "門楼、内郭、貯水槽を備えているため、守備隊は長期間持ちこたえることができる。"
 building_type_wantilan_01: "ワンティラン"
 building_type_wantilan_01_desc: "開放的で壁のない大広間や共同体のためのパビリオンで、集会、祭礼、演劇に用いられる。"
 building_wantilan_01: "小さなワンティラン"
 building_wantilan_01_desc: "村の集会所は召集、宣誓、稽古の場であり、争いが起こる前に長老たちが仲裁する場でもある。"
 building_wantilan_02: "ワンティランパビリオン"
 building_wantilan_02_desc: "階層状の屋根を持つ広々としたホールでは祭りや通過儀礼が行われ、共同の儀式が士気と威信を高める。"
 building_wantilan_03: "寺院ワンティラン"
 building_wantilan_03_desc: "地元の聖域と結びついた儀式の空間。供物や行列のための十分な広さを持つ。"
 building_wantilan_04: "大きなワンティラン"
 building_wantilan_04_desc: "太鼓、踊り手、そして指導者たちが同じ屋根の下に集まる、地域の象徴的な集会場。"
 building_type_military_academy_01: "士官学校"
 building_type_military_academy_01_desc: "士官や騎士を訓練し、戦闘力を上げるための施設。"
 military_academy_01: "$building_type_military_academy_01$"
 building_military_academy_01_desc: "軍学校では将校を目指す者たちが実績を基に精査されている。もちろん貴族階級の生徒以外は受け入れられない。"
 military_academy_02: "$building_type_military_academy_01$II"
 building_military_academy_02_desc: "ここでは中級から上級の士官が訓練を受け、部隊の動きや陣地の準備、戦場の状況についての理解を深めていく。"
 military_academy_03: "$building_type_military_academy_01$III"
 building_military_academy_03_desc: "高等軍学校は、先進的な軍事機構の中核をなす存在です。ここで訓練を受けた士官たちは、戦略、軍隊の組織運営、そして戦争における最新技術について徹底的に学ぶ。"
 military_academy_04: "$building_type_military_academy_01$IV"
 military_academy_05: "$building_type_military_academy_01$V"
 building_type_march_01: "国境"
 building_type_march_01_desc: "国境の領主たちは要塞や守備隊で守りを固めている。"
 marches_effect_desc: "特殊な[raid_intents|E]の確率を減少させる"
 marches_effect_2_desc: "特殊な[raid_intents|E]を防ぐ"
 march_01: "$building_type_march_01$"
 building_march_01_desc: "国の中心から遠く危険な場所には、襲撃に備え辺境伯が任命される。数は少なく分散されているが、警報機構として役立ち、時には密輸入者も捕らえることもある。"
 march_02: "$building_type_march_01$II"
 building_march_02_desc: "領主の警備機構は国境全体にまたがり、高い防御力を提供している。"
 march_03: "$building_type_march_01$III"
 building_march_03_desc: "大きな要塞が公領中の国境に設置され、どんな敵が相手でもその侵攻を大幅に妨害することができる。"
 march_04: "$building_type_march_01$IV"
 march_05: "$building_type_march_01$V"
 building_type_siege_works_01: "攻城兵器製作所"
 building_type_siege_works_01_desc: "包囲戦に備えるための施設のおかげで、支配者は高品質の包囲攻撃兵器を保持し、出動させることができる。"
 siege_works_01: "$building_type_siege_works_01$"
 building_siege_works_01_desc: "攻城兵器工房では、専門化された標準化の建造手順により、攻城兵器を迅速かつ安定的に供給できる。"
 siege_works_02: "$building_type_siege_works_01$II"
 building_siege_works_02_desc: "攻城戦の最先端兵器であるトレビュシェットを運用するには、専門の技術者が必要である。"
 siege_works_03: "$building_type_siege_works_01$III"
 building_siege_works_03_desc: "大砲は戦場に登場した最新兵器である。音は大きく重くて扱いも難しいものの、石の要塞に対しては強力だ。大砲を作り戦場に投入できれば、我々はかなり優位になれるだろう。"
 siege_works_04: "$building_type_siege_works_01$IV"
 siege_works_05: "$building_type_siege_works_01$V"
 building_type_royal_armory_01: "王立造兵廠"
 building_type_royal_armory_01_desc: "王室資金による武器庫は、軍に安定した武器の供給と整備を保証する。"
 royal_armory_01: "$building_type_royal_armory_01$"
 building_royal_armory_01_desc: "戦時には、農民からなる徴兵に兵器庫から武器が支給される。ほとんどは錆びた古い斧や壊れかけた槍、鈍った刃物などだが、少し整備すれば、普段徴兵たちが使う農具よりもずっと使える武器になる。"
 royal_armory_02: "$building_type_royal_armory_01$II"
 building_royal_armory_02_desc: "王室管理の武器庫では、戦時用の武器や防具が保管されている。品質もそれなりに高く、たとえ酒浸りの怠け者でも一丁前に戦える兵士に変貌する。"
 royal_armory_03: "$building_type_royal_armory_01$III"
 building_royal_armory_03_desc: "王立兵器廠には膨大な量の武器が備蓄、整備されており、必要な時には無数の農民徴兵を即座に動員できる、国内の一流傭兵をも魅了する。"
 royal_armory_04: "$building_type_royal_armory_01$IV"
 royal_armory_05: "$building_type_royal_armory_01$V"
 building_type_jousting_lists_01: "馬上槍試合場"
 building_type_jousting_lists_01_desc: "馬上槍試合を行う場所があることで、騎手や騎士たちの訓練や、軍への加入が促進される。"
 jousting_lists_01: "$building_type_jousting_lists_01$"
 building_jousting_lists_01_desc: "騎手や騎士の訓練のため、この空き地は年中保持されている。"
 jousting_lists_02: "$building_type_jousting_lists_01$II"
 building_jousting_lists_02_desc: "この競技場には複数の試合会場と民衆用の客席が用意され、多くの出場者を集める。"
 jousting_lists_03: "$building_type_jousting_lists_01$III"
 building_jousting_lists_03_desc: "王室用の観覧席が設けられ、試合会場も拡張された競技場は、見る者を圧倒する。"
 jousting_lists_04: "$building_type_jousting_lists_01$IV"
 jousting_lists_05: "$building_type_jousting_lists_01$V"
 building_type_blacksmiths_01: "鍛冶屋"
 building_type_blacksmiths_01_desc: "王室直属の鍛冶職人は護衛軍の武器や防具を作り、常に上質な武具が揃っていることを保障する。"
 blacksmiths_01: "$building_type_blacksmiths_01$"
 building_blacksmiths_01_desc: "最も生産量の多い王室お抱えの一流鍛冶屋が近衛隊のために剣、鎖帷子、パイクを製造する。"
 blacksmiths_02: "$building_type_blacksmiths_01$II"
 building_blacksmiths_02_desc: "ほかのギルドと協力することで、注文の入った品は安く大量生産できる。"
 blacksmiths_03: "$building_type_blacksmiths_01$III"
 building_blacksmiths_03_desc: "王室に武器を供給するためだけに設置された大きな鍛冶場があり、そこで働けるのは最高峰の鍛冶職人だけである。"
 blacksmiths_04: "$building_type_blacksmiths_01$IV"
 blacksmiths_05: "$building_type_blacksmiths_01$V"
 building_type_archery_ranges_01: "弓兵訓練場"
 building_type_archery_ranges_01_desc: "弓の射撃練習に特化したこの場所では、一般人も経験豊富な射手も技術を磨くことができる。"
 archery_ranges_01: "$building_type_archery_ranges_01$"
 building_archery_ranges_01_desc: "弓兵訓練場は貧富に関わらず誰でも使用することができる。その理由は2つある。農民は弓を扱えれば戦争で役に立ち、経験のある射手は大会に出る時に最高の状態を保つことができる。"
 archery_ranges_02: "$building_type_archery_ranges_01$II"
 building_archery_ranges_02_desc: "最高峰の弓師たちは王室に雇われており、専用の施設で最高品質の弓を製作している。"
 archery_ranges_03: "$building_type_archery_ranges_01$III"
 building_archery_ranges_03_desc: "農民たちを勇気づけ、射手たちにふさわしい試練を与えるため、この練習場は長距離の射撃に特化して設計されている。"
 archery_ranges_04: "$building_type_archery_ranges_01$IV"
 archery_ranges_05: "$building_type_archery_ranges_01$V"
 building_type_leisure_palace_01: "離宮"
 building_type_leisure_palace_01_desc: "1つの豪華な城に住み続けるのも悪くないが、ほかにも選択肢があって損はない。"
 leisure_palace_01: "$building_type_leisure_palace_01$"
 building_leisure_palace_01_desc: "重大な責任に耐えきれなくなった時（もしくは農民たちが門の前で暴動を起こした時）、人里離れた邸宅に避難してリラックスするに越したことはない！"
 leisure_palace_02: "$building_type_leisure_palace_01$II"
 building_leisure_palace_02_desc: "夏の宮殿は、つまらない仕事に骨を折る民たちから遠く離れた景色の美しい場所にある。権力と名声、そして我々の方が#emphasis 優れている#! という単純な事実を誇示するにはこの上ない場所だ。"
 leisure_palace_03: "$building_type_leisure_palace_01$III"
 building_leisure_palace_03_desc: "冬の宮殿は、厳しい季節の間も王室が住めるよう設計されている。守りやすい位置で十分な食料が備蓄されており、近くで働く震える国民たちを見下ろす。"
 leisure_palace_04: "$building_type_leisure_palace_01$IV"
 leisure_palace_05: "$building_type_leisure_palace_01$V"
 chateau_01: "邸宅"
 chateau_02: "$chateau_01$II"
 chateau_03: "$chateau_01$III"
 chateau_04: "$chateau_01$IV"
 chateau_05: "$chateau_01$V"
 building_type_royal_forest_01: "王室林"
 building_type_royal_forest_01_desc: "王室の森は地域の土地の法律を無効化し、住民から権利を奪って売り戻すことができる貴重な収入源だ。当然ながら狩りにも最適だ。"
 royal_forest_01: "$building_type_royal_forest_01$"
 building_royal_forest_01_desc: "この国では森の多くが王室専用となっている。農民たちは森での居住、狩り、農業目的での伐採を禁じられている。通りがかった王室の租税査定人を攻撃することは特に固く禁じられている。"
 royal_forest_02: "$building_type_royal_forest_01$II"
 building_royal_forest_02_desc: "町単位で王室の森に包含されるようになり、王の配下が“発見”した地図によると近くの集落がその領域内に入っているということがしばしばある。"
 royal_forest_03: "$building_type_royal_forest_01$III"
 building_royal_forest_03_desc: "法はその後ろにあるシステムと同等でしかない。王室の森には裁判所、警備隊、事務官のシステムが構築され、訓練された判事たちに支えられ、王室の命令を執行する準備が整っている。"
 royal_forest_04: "$building_type_royal_forest_01$IV"
 royal_forest_05: "$building_type_royal_forest_01$V"
 building_type_royal_garden_01: "王室庭園"
 building_type_royal_garden_01_desc: "美しい庭ほど人々がくつろげる社交の場はない。大抵の人は小さな個人用の庭で十分だが、権力のある富裕層を満足させられるのは、最も華々しい建築だけなのだ！"
 royal_garden_01: "$building_type_royal_garden_01$"
 building_royal_garden_01_desc: "石壁に囲まれた小さな庭。忙しない外の世界から隔てられたこの小さな空間は、平穏で心地よい安息の地だ。"
 royal_garden_02: "$building_type_royal_garden_01$II"
 building_royal_garden_02_desc: "目を引く広大な庭園の中に花、薬草、果物の木、その他すべてが揃っている。大勢の庭師に維持され、常に手入れが行き届いている。"
 royal_garden_03: "$building_type_royal_garden_01$III"
 building_royal_garden_03_desc: "この王立公園の広大な絶景は、周辺の地形と建築物に溶け込むよう丁寧に作られた。一般公開されていて、各地からの訪問者を圧倒させている。"
 royal_garden_04: "$building_type_royal_garden_01$IV"
 royal_garden_05: "$building_type_royal_garden_01$V"
 building_type_ananda_temple_01: "アーナンダ寺院"
 building_type_ananda_temple_01_desc: "パガンの街やその周辺には数千もの仏塔、寺院、神殿があるが、アーナンダ寺院はその中でも採鉱の功績である。完璧に設計された建物の中には珍しい飾り版や石像がある。祈りの場所であり、宗教教育の中心地でもある。"
 ananda_temple_01: "$building_type_ananda_temple_01$"
 ananda_temple_01_desc: "$building_type_ananda_temple_01_desc$"
 building_type_hotin_fort_01: "ホトィン要塞化"
 building_type_hotin_fort_01_desc: "ホトィン要塞はドニエストル川の川岸に建てられた小さな要塞だ。要塞の主はこの位置から地元の交易路を守り、川を支配することができる。"
 hotin_fort_01: "ホトィン要塞"
 hotin_fort_01_desc: "$building_type_hotin_fort_01_desc$"
 hotin_fort_02: "ホトィン大要塞"
 hotin_fort_02_desc: "以前の要塞がかすんでしまうほど立派な要塞だ。数世紀の時を経て、要塞は高い石壁や広い堀、複数の巨大な塔を含むようになった。この防御設備は、大抵の攻囲軍を楽々と食い止めるだろう。"
 building_type_golden_gate_of_kiev_01: "キエフの黄金の門"
 building_type_golden_gate_of_kiev_01_desc: "コンスタンティノープルの門を元に作られて名づけられたキエフの黄金の門は、街の入口および凱旋門として機能している。門の最上部に建てられた教会の黄金の円屋根は遠くから見え、人目を引くキエフの象徴になっている。"
 golden_gate_of_kiev_01: "$building_type_golden_gate_of_kiev_01$"
 golden_gate_of_kiev_01_desc: "$building_type_golden_gate_of_kiev_01_desc$"
 building_type_heddal_stave_church_01: "ヘッダール・スターヴ教会"
 building_type_heddal_stave_church_01_desc: "ヘッダール・スターヴ教会はノルウェー最大の板張り教会であり、室内は美しい木製建築だ。伝説によると、山のトロールがわずか3日でこの教会を建て上げた。"
 heddal_stave_church_01: "$building_type_heddal_stave_church_01$"
 heddal_stave_church_01_desc: "$building_type_heddal_stave_church_01_desc$"
 building_type_temple_of_uppsala_01: "ウプサラの神殿"
 building_type_temple_of_uppsala_01_desc: "ウプサラの神殿はスカンディナヴィアの大部分にとっての聖地だ。神話のユグドラシルと同じように神殿の近く、井戸の隣に神木が立っている。"
 temple_of_uppsala_01: "$building_type_temple_of_uppsala_01$"
 temple_of_uppsala_01_desc: "$building_type_temple_of_uppsala_01_desc$"
 temple_of_uppsala_02: "ウプサラ大聖堂"
 temple_of_uppsala_02_desc: "ウプサラ大聖堂は、南ヨーロッパの優れた建築物と競うために建てられた背の高い大聖堂だ。スウェーデン有数の君主たちが眠る埋葬地であり、複数の聖遺物がある。"
 building_type_lund_cathedral_01: "ルンド大聖堂"
 building_type_lund_cathedral_01_desc: "ルンド大聖堂は、石の彫刻で豪華に飾られた壮大な教会だ。ロマネスク建築の影響を受けていて、ドイツの教会と多数の類似点がある。この建物はルンドの守護聖人である聖ローレンスに捧げられている。"
 lund_cathedral_01: "$building_type_lund_cathedral_01$"
 lund_cathedral_01_desc: "$building_type_lund_cathedral_01_desc$"
 building_type_danevirke_01: "デーンヴィルク"
 building_type_danevirke_01_desc: "デーンヴィルクは大陸からの侵略を防ぐために建てられた広大な土塁であり、落成してから複数回拡張されている。"
 danevirke_01: "$building_type_danevirke_01$"
 danevirke_01_desc: "$building_type_danevirke_01_desc$"
 building_type_aljaferia_palace_01: "アルヘフェリア"
 building_type_aljaferia_palace_01_desc: "サリア平原に建てられた大きな宮殿要塞アルヘフェリアは、サラゴサの権力と富の証である。威圧的な要塞であると同時に、イベリア建築の最高峰でもある。"
 aljaferia_palace_01: "$building_type_aljaferia_palace_01$"
 aljaferia_palace_01_desc: "$building_type_aljaferia_palace_01_desc$"
 building_type_roman_wall_of_lugo_01: "ルーゴのローマの壁"
 building_type_roman_wall_of_lugo_01_desc: "はるか昔にローマ人によって築かれたルーゴの壁は、今でも印象的な光景を残している。巡礼者たちはサンティアゴ・デ・コンポステーラへの道中、この5つの城門を通過し、旅はさらに印象深くなる。"
 roman_wall_of_lugo_01: "$building_type_roman_wall_of_lugo_01$"
 roman_wall_of_lugo_01_desc: "$building_type_roman_wall_of_lugo_01_desc$"
 building_type_rock_of_gibraltar_01: "ジブラルタル岩"
 building_type_rock_of_gibraltar_01_desc: "一枚岩のジブラルタル岩は、地中海に続く狭い海峡を見下ろしている。古代にはヘラクレスの柱のひとつで、既知の世界の端を示すものと考えられていた。今見ると、その先に何があるのか不思議でならない。"
 rock_of_gibraltar_01: "$building_type_rock_of_gibraltar_01$"
 rock_of_gibraltar_01_desc: "$building_type_rock_of_gibraltar_01_desc$"
 building_type_tower_of_hercules_01: "ファルム・ブリガンティウム"
 building_type_tower_of_hercules_01_desc: "この古代の灯台は、アレクサンドリアにある有名な姉妹灯台を参考にしたと言われている。何世紀にもわたって船乗りを導いてきたこの灯台は、今でもガリシアの沿岸貿易にとって重要な役割を果たしている。この孤高な塔の頂上からは、アイルランドの緑の海岸を垣間見ることができると言う者もいるが、遠くを眺めても果てしない海しか見えない。"
 tower_of_hercules_01: "$building_type_tower_of_hercules_01$"
 tower_of_hercules_01_desc: "$building_type_tower_of_hercules_01_desc$"
 building_type_city_wall_of_toledo_01: "トレドの市壁"
 building_type_city_wall_of_toledo_01_desc: "この巨大な城壁はその昔ローマ人によって築かれたものだが、西ゴート族の王ウァンバの時代に大幅に拡張された。初期のアラビアの統治者はさらに城壁を広げ、王の都にふさわしい防衛体制を作り上げた。"
 city_wall_of_toledo_01: "$building_type_city_wall_of_toledo_01$"
 city_wall_of_toledo_01_desc: "$building_type_city_wall_of_toledo_01_desc$"
 building_type_alcazar_of_segovia_01: "セゴヴィアのアルカサル"
 building_type_alcazar_of_segovia_01_desc: "岩山から船の舳先のようにそびえ立つこの要塞は、畏敬の念を抱かせる光景だ。荘厳かつ難攻不落なこの城は、城の王国カスティーリャで最も偉大な城である。"
 alcazar_of_segovia_01: "$building_type_alcazar_of_segovia_01$"
 alcazar_of_segovia_01_desc: "$building_type_alcazar_of_segovia_01_desc$"
 building_type_holy_site_basilica_santiago_01: "サンティアゴ・デ・コンポステーラ大聖堂"
 building_type_holy_site_basilica_santiago_01_desc: "大ヤコブの墓の上に建てられたこの壮麗な建物は、聖ヤコブの道の終着点であり、キリスト教の偉大な遺跡のひとつである。西ヨーロッパと北ヨーロッパの各地から大勢の巡礼者が訪れ、何十もの言語を話すが、その多くは畏敬の念を抱いて言葉を発することはない。"
 holy_site_basilica_santiago_01: "$building_type_holy_site_basilica_santiago_01$"
 holy_site_basilica_santiago_01_desc: "$building_type_holy_site_basilica_santiago_01_desc$"
 building_type_charnel_grounds_01: "納骨地"
 building_type_charnel_grounds_01_desc: "霊の浄化の場であると同時に、死者が休息する場でもあるこれらの野外墓地は、遺体の分解を進める場所でもある。"
 charnel_grounds_01: "$building_type_charnel_grounds_01$"
 building_charnel_grounds_01_desc: "太陽にさらされ、猛禽類に啄ばまれ、遺体は丘の上で腐敗していく。"
 charnel_grounds_02: "$building_type_charnel_grounds_01$II"
 building_charnel_grounds_02_desc: "宗教的な場所でもあり、墓地でもあるこの場所では、腐敗した遺体は生者から遠ざけられる。"
 charnel_grounds_03: "$building_type_charnel_grounds_01$III"
 building_charnel_grounds_03_desc: "辺りには遺体が散乱しているが、香り袋は小道周辺の臭いを一部打ち消し、そこで生者たちは自然への新しい供え物の準備をする。"
 charnel_grounds_04: "$building_type_charnel_grounds_01$IV"
 charnel_grounds_05: "$building_type_charnel_grounds_01$V"
 building_type_imam_reza_shrine_01: "イマーム・レザーの聖域"
 building_type_imam_reza_shrine_01_desc: "この聖域には、シーア派の一部から第8代イマームとして称えられるアリー・アッ＝リダーの遺骸が安置されている。彼はこの地で殉教した人物である。拡大を続けるその複合施設には、霊廟のほか、礼拝堂、図書館、バザールが含まれ、巡礼者や隊商が流浪するのと共に、多様性に富みながらも見事な形で拡大している。"
 imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$"
 imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$"
 building_type_soltaniyeh_01: "ソルターニーイェのドーム"
 building_type_soltaniyeh_01_desc: "神殿と霊廟の両方の役割を果たすこの建物の壮大な規模と見事な左右対称性は、これから生まれるであろう多くの偉大な作品に着想を与えることだろう。その大きな二重のドームはターコイズで覆われている。その規模は、まるで天に挑戦しているようだ。"
 soltaniyeh_01: "$building_type_soltaniyeh_01$"
 soltaniyeh_01_desc: "$building_type_soltaniyeh_01_desc$"
 building_type_palace_of_ctesiphon_01: "クテシフォン宮殿の遺跡"
 building_type_palace_of_ctesiphon_01_desc: "この古代の建造物は、かつてサーサーン朝の王の中の王たちの儀式の場であった。しかし、かつての栄光に満ちた広間には静寂が訪れ、庭園の花々ももはや咲き誇ることはない。バグダード建設のために多くの資材が持ち去られ、人々は四方八方に散らばった。それでもなお、不気味なまでの壮麗さが残り、古の栄光がかすかに残っている。"
 palace_of_ctesiphon_01: "$building_type_palace_of_ctesiphon_01$"
 palace_of_ctesiphon_01_desc: "$building_type_palace_of_ctesiphon_01_desc$"
 building_type_palace_of_ctesiphon_02: "クテシフォンの大宮殿"
 building_type_palace_of_ctesiphon_02_desc: "現在は再建され、古代の王たちの座所はその栄光を完全に取り戻した。庭園では花は咲き、広間は音楽と華やかさで満ちている。訪問者は、近くの方から遠方の方まで幅広く、玉座の間の大きなアーチを見に来る。これは古代世界の長く忘れられてきた驚異であり、今やようやく歌の中の場所を取り戻した。"
 palace_of_ctesiphon_02: "$building_type_palace_of_ctesiphon_02$"
 palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$"
 building_type_falak_ol_aflak_citadel_01: "ファラク・オル・アフラク"
 building_type_falak_ol_aflak_citadel_01_desc: "ホッラマーバードの町を見下ろす丘の頂に位置するこのサーサーン朝時代の泥レンガ製の要塞は、今もなお印象的な景観を誇る。谷の住民たちはこれを#italic ファラク・オル・アフラク#!と呼び、「天の中の天」と意味し、まるで世界の頂上にあるかのように感じ、強固な壁を持ち、しばしば安全の地と見なしている。"
 falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$"
 falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$"
 building_type_minarets_and_remains_of_jam_01: "ジャームのミナレット"
 building_type_minarets_and_remains_of_jam_01_desc: "この建造物はハリ川の谷にそびえ立ち、スタッコや彩釉タイルの装飾、そして書道の帯が交互に配されている。遠隔で険しい地であっても、信仰と富を顕示する見事な記念碑である。"
 minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$"
 minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$"
 building_type_great_wall_of_gorgan_01: "ゴルガーンの防衛壁"
 building_type_great_wall_of_gorgan_01_desc: "ゴルガーンの防衛壁はヘフタライト・フン族に対する防壁として古代の王たちが築いた広大な要塞群である。東方征服の遠征の時、アレクサンドロス大王自身がその門を通過したとも言われている。"
 great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$"
 great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$"
 building_type_maharloo_lake_01: "マハルルー湖"
 building_type_maharloo_lake_01_desc: "この湖は季節的に乾いた塩の平原となることがある。夏の盛りには水面が見事な薄紅色に染まる。若き詩人たちは岸辺に集まり、この不思議な湖水を眺めながら、地球の美しさと謎について思いを巡らせる。"
 maharloo_lake_01: "$building_type_maharloo_lake_01$"
 maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$"
 building_type_tomb_of_cyrus_01: "バトシェバの墓"
 building_type_tomb_of_cyrus_01_desc: "白い石灰岩で造られたこの古代の墓は、複数の宗教で崇められるソロモン王の母、バトシェバの眠る場所と言われている。女性たちがこの場所を管理しており、墓の暗い内部に入ることが許されるのも女性だけです。彼女たちは中で見たものについてほとんど語らない。近くの水は祝福を受けているとされ、狂犬に噛まれた人を癒す力があると言われている。"
 tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$"
 tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$"
 building_type_rainbow_mountains_01: "レインボーマウンテン"
 building_type_rainbow_mountains_01_desc: "まるで創造主自身が尾根を虹色に塗り替えたかのようである。赤、白、黄色、灰色、オレンジ、そしてさらに奇妙な色彩の帯が、岩だらけの静かな風景を染めている。地元の統治者たちはこの素晴らしい景色を見るために、狩りの際によく客人をここに連れてくる。"
 rainbow_mountains_01: "$building_type_rainbow_mountains_01$"
 rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$"
 building_type_mount_damavand_01: "ダマーヴァンド山"
 building_type_mount_damavand_01_desc: "古代の伝承に包まれた、偉大な雪を頂く峰、ダマーヴァンド山は、怪物のような暴君ザッハークが終末の日まで閉じ込められていると語られています。かつて多くの英雄たちがこの山で偉業を成し遂げてきた。今日この地を訪れる者たちも、その雄大な存在に魂を揺さぶられると言われている。休火山であるこの山の斜面には温泉が点在しており、疲れた旅人たちが立ち寄って休息し、古の英雄たちの偉業に思いを馳せることができる。"
 mount_damavand_01: "$building_type_mount_damavand_01$"
 mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$"
 building_type_holy_site_fire_temple_01: "偉大なる拝火神殿"
 building_type_holy_site_fire_temple_01_desc: "この建物の内部では、#italic アタシュ・バハラーム#!（勝利の火）が燃えている。炎最も偉大で純粋な炎であり、雷、王家のろうそく、火葬の炎、金細工師の炉、修行者たちの炉から集められた。遠く離れた地から巡礼者たちがこの奇跡を目にするために訪れ、マギたちは終わりなく続くように見えるな浄化の儀式を行っている。"
 holy_site_fire_temple_01: "偉大なる拝火神殿"
 holy_site_fire_temple_01_desc: "$building_type_holy_site_fire_temple_01_desc$"
 building_type_ark_of_bukhara_01: "ブハラのアルク"
 building_type_ark_of_bukhara_01_desc: "若き世界の時代に、王子スィヤヴシャがこの巨大な要塞を築いたと言われている。それから3000年後、この地の古代の支配者であるブハラ・フダスによって修復され、以来ずっと使用され続けている。近隣や遠方から訪れる旅人たちは、この建造物を称賛する。北斗七星を象徴する7つの大柱がそびえ立ち、なによりも要塞であることこそが見る者を圧倒させる。"
 ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$"
 ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$"
 building_type_shah_i_zinda_01: "シャーヒ・ズィンダ"
 building_type_shah_i_zinda_01_desc: "この霊廟群の名前は#italic 生ける王#!を意味し、ここに埋葬されているとされるムハンマドの従兄弟、クサム・イブン・アッバースに由来する。霊廟は非常に小さく質素だが、その厳かな美しさは多くの人々の心を静寂の墓へと引き止め、人生の儚さを感じさせてくれる。"
 shah_i_zinda_01: "$building_type_shah_i_zinda_01$"
 shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$"
 shah_i_zinda_02: "シャーヒ・ズィンダ廟群"
 shah_i_zinda_02_desc: "ターコイズのタイルで覆われた霊廟、高い門、ドーム状の回廊が広がる巨大な霊廟群#italic 生ける王#!は、預言者の従兄弟や多くの古代の偉大な君主たちの眠る埋葬地である。この複合施設は絶えず拡張を続けており、不気味さと威厳が見事に調和している。"
 building_type_alamut_castle_01: "アラムート城"
 building_type_alamut_castle_01_desc: "この鷲の巣のような城、アラムート城は、高い岩山の頂に位置し、困難な状況にあったジャスタン朝が要塞として建設した。その圧倒的な景観と強固な城壁を持つこの城は、ほぼ攻略不可能とされている。この孤立した地を利用して栄える武闘派や宗派にとって、理想的な拠点となり得る。"
 alamut_castle_01: "$building_type_alamut_castle_01$"
 alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$"
 building_type_alamut_castle_02: "アラムート要塞"
 building_type_alamut_castle_02_desc: "高い岩山の頂に位置するこの城は、長らく人里離れた山岳の要塞として機能してきた。現在では、中に図書館や研究室、静かな庭園を備えた強力な#italic フェダイーン#!の要塞として再建されている。ある者にとっては流血と戦争の地であり、またある者にとっては精神的な安らぎの地である、もしくはその両方であるかもしれない。"
 alamut_castle_02: "$building_type_alamut_castle_02$"
 alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$"
 building_type_assassin_castle_01: "$holy_order_hashshashin$$castle_04$"
 building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
 assassin_castle_01: "$building_type_assassin_castle_01$"
 assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$"
 building_type_qanats_01: "$qanats_06$"
 building_type_qanats_01_desc: "$qanats_05_desc$"
 building_qanats_01: "ヤフチャール"
 building_qanats_01_desc: "このドーム型の氷室は、地下の貯蔵エリアと耐熱性の建材を組み合わせ、蒸発冷却装置として機能する断熱空間を作り出している。"
 building_qanats_02: "システルン"
 building_qanats_02_desc: "ペルシア語で#italic アブ・アンバール#!と呼ばれるこれらのアーチ型構造物は、半地下にあり、大量の水を貯蔵するために使用される。"
 building_qanats_03: "採風塔"
 building_qanats_03_desc: "ペルシアの発明であるこれらの高い塔は、貯水槽やほかの建物と繋がている。風上に向けられた開口部から風を取り込み、その空気を内部に循環させることで冷却効果を生み出す。"
 building_qanats_04: "カーリーズ"
 building_qanats_04_desc: "地下導水路システムの第一段階であるカーリーズは、一連の垂直のシャフトと緩やかな斜面のトンネルで繋がており、地下の水源にアクセスしてその水を地表に運ぶ。"
 building_qanats_05: "小規模なカナート"
 qanats_05_desc: "カナートは、水の蒸発による損失を軽減するために設計された地下導水路だ。この段階では規模は小さいが、それでも農業に大きな恩恵をもたらす。"
 qanats_06: "カナート"
 building_qanats_06_desc: "地下導水路が拡張され、地域の貯水槽、氷室、灌漑システムと接続されている。"
 building_qanats_07: "大規模なカナート"
 building_qanats_07_desc: "この大規模な地下導水路システムは複数の#italic パラサンゴ#!にわたって広がり、農民と町民の両方に膨大な水を供給する。"
 building_qanats_08: "巨大なカナートシステム"
 building_qanats_08_desc: "無数の地下貯水槽、灌漑用水路、氷室、浴場、噴水、飲用井戸へと流れ込む壮大な地下導水路網は、ペルシアの独創性と栄光を真に示す。"
 building_type_tower_of_silence_01: "偉大なる沈黙の塔"
 building_type_tower_of_silence_01_desc: "大地も火も亡骸に穢されることのないよう、死者は屋根のない塔の上に横たえられ、鳥たちに委ねられる。残った骨はのちに拾い集められ、塔の中央にある穴へと納められる。"
 tower_of_silence_01: "偉大なる沈黙の塔"
 tower_of_silence_01_desc: "公爵領ののどかな場所に建てられたこの天井のない塔は、地元の人々が死者を安置する場所である。中の遺体はハゲタカと強い日差しにさらされ、亡くなった魂を安全にあの世に運び、生者を腐敗から守る。宗教的な戒律により、伝統的な荒野でなく塔でなければいけないのだが、その存在が地域社会を団結させている。"
 tower_of_silence_01.tt.liege_not_approve_of_burial: "[liege_possessive|E]の[faith|E]は、$building_type_event_tower_of_silence_01$を必要とせずに伝統的な埋葬を行えるようにしている。"
 tower_of_silence_01.tt.county_not_tos_users: "[county|E]の[faith|E]は、この方法で死者を処理することはない"
 building_type_event_tower_of_silence_01: "沈黙の塔"
 building_type_event_tower_of_silence_01_desc: "$tower_of_silence_01_desc$"
 event_tower_of_silence_01: "沈黙の塔"
 event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$"
 church_of_the_theotokos: "生神女聖堂"
 church_of_the_theotokos_desc: "聖十字架ははるか以前にこの立派な建造物を征服し、処女女神アテナへの異教信仰を打ち破った。\n現在では、神の母であり、#EMP 聖#!の名にふさわしい唯一の処女であるマリア・パルテノスの祠がある。"
 building_type_church_of_the_theotokos: "$church_of_the_theotokos$"
 building_type_church_of_the_theotokos_desc: "$church_of_the_theotokos_desc$"
 parthenon: "パルテノン"
 parthenon_desc: "強大なアテナの聖殿が、愚かな迷信に汚されることなく、再び誇らしげに立っている。\n1000年以上前に建てられた荘厳な柱と壁は、時の試練に耐え、今も信者の家々を天空から守っており、この都市の名付け親である処女女神の祝福を静かに象徴している。"
 building_type_parthenon: "$parthenon$"
 building_type_parthenon_desc: "$parthenon_desc$"
 hagios_demetrios: "アギオス・デメトリオス"
 hagios_demetrios_desc: "聖デメトリオス教会は、この都市で最も重要な教会である。\nキリストへの信仰が生まれたばかりの頃に建てられており、内部には聖人が多くの黎明期の信者とともに投獄され、殉教し、埋葬されたローマ時代の浴場もある。"
 building_type_hagios_demetrios: "$hagios_demetrios$"
 building_type_hagios_demetrios_desc: "$hagios_demetrios_desc$"
 kassiopi_castle: "カシオピ城"
 kassiopi_castle_desc: "海岸に建てられた迫力ある要塞。島と本土を隔てる海峡を見下ろす戦略的な位置にあり、イオニア地域の重要な拠点となっている。"
 building_type_kassiopi_castle: "$kassiopi_castle$"
 building_type_kassiopi_castle_desc: "$kassiopi_castle_desc$"
 saint_lazarus: "聖ラザロ教会"
 saint_lazarus_desc: "伝承によると、キリストによって死からよみがえったベタニヤのラザロは、二度目の死後、ラルナカの街に埋葬された。\n墓は何世紀ものあいだ場所が特定されなかったが、発見されると、皇帝レオーン6世は聖人の遺骸をコンスタンティノープルに移し、墓の上にこの立派な教会を建てさせた。"
 building_type_saint_lazarus: "$saint_lazarus$"
 building_type_saint_lazarus_desc: "$saint_lazarus_desc$"
 building_type_sumela_monastery_01: "スメラ修道院"
 building_type_sumela_monastery_01_desc: "黒山の険しい崖の上に建てられたこの修道院の起源はほとんど謎に包まれている。一説によると、最初に建てられたのは4世紀のテオドシウス帝の命令だというが、聖なる泉と古代のフレスコ画はさらに古い可能性がある。\n修道院の宝物は神の母のフレスコ画で、使徒ルカ自身が描いたと言われている。"
 sumela_monastery_01: "$building_type_sumela_monastery_01$"
 sumela_monastery_01_desc: "修道院は廃墟と化し、その後、何人かの皇帝によって修復、拡張されてきたが、現在の形になった主な貢献者は、ベリサリウス将軍の手を借りたユスティニアヌス帝である。"
 sumela_monastery_02: "改修された$building_type_sumela_monastery_01$"
 sumela_monastery_02_desc: "この修道院が最後に改修されてから、何世紀もの歳月が流れた。最近の介入によって、さらなる世襲地と扶養家族が与えられ、税金を免除され、新しい建物を建てるための帝国からの資金が与えられた。その恩恵を最も受けたのは岩窟教会で、フレスコ画が新しく描き直された。"
 patras_castle: "パトラ城"
 patras_castle_desc: "ヴォディアス山脈の丘にそびえるパトラの古代アクロポリスは、ユスティニアヌス帝の時代に要塞になった。\nそれ以来、この城は地元の守護聖人である聖アンデレと#EMP ゲニウス・ロキ#!であるローマ時代の乙女像、パトリネッラの庇護のもと、ずっと使われつづけている。"
 building_type_patras_castle: "$patras_castle$"
 building_type_patras_castle_desc: "$patras_castle_desc$"
 maiden_tower: "乙女の塔"
 maiden_tower_desc: "沖にあるこの岩は、ボスポラス海峡の入り口という絶好の位置にあるため、アテナイのアルキビアデスの時代にはすでに税関が置かれていた。\n同じ小島にある要塞化された塔は、現在、黒海を往来するすべての海軍の交通を管理することができる。さらに、塔とコンスタンティノープルのあいだに海面の高さまで大きな鎖を上げることができ、危険な船や迷惑な船の航路を効果的に遮断することが可能である。"
 building_type_maiden_tower: "$maiden_tower$"
 building_type_maiden_tower_desc: "$maiden_tower_desc$"
 despot_palace: "独裁者の宮殿"
 despot_palace_desc: "要塞都市ミストラスの真上、タイゲトス山の安全な場所にある壮麗な宮殿。\nこの宮殿はコンタンティノープルの大広間に匹敵するほど豪華であり、非常に裕福で影響力のある支配者ぐらいしか利用できない。"
 building_type_despot_palace: "$despot_palace$"
 building_type_despot_palace_desc: "$despot_palace_desc$"
 building_type_meteora_01: "メテオラ"
 building_type_meteora_01_desc: "メテオラとは、地元住民に付けられた名前であり、ピドノス山近くの自然の岩柱からなる息をのむような美しさの岩山のことである。"
 meteora_01: "$building_type_meteora_01$"
 meteora_01_desc: "メテオラの自然の洞穴には9世紀初頭から禁欲的な隠者が住んでいるが、人間が造った建物は景観を変えていない。"
 meteora_02: "$building_type_meteora_01$"
 meteora_02_desc: "メテオラの山頂の洞穴に避難する隠者の修道士が増えるにつれて、修道院の数も増えていった。\nしかし、この場所の敵対する自然を人間はまだまだ支配しきれていない。修道院にたどり着くのは非常に困難で、装備の不良により落下してしまえば命を落とすことになるので、梯子やロープを使ったり、手で引っ張ったり、#EMP 祈ったり#!するしかない。"
 building_type_mount_athos_01: "アトス山"
 building_type_mount_athos_01_desc: "伝承によると、聖母マリアはキプロス島で伝道活動をしていた息子の友人ラザロを訪ねるため、パレスチナからキプロスへ航海していたところ、船が航路を外れて吹き飛ばされ、アトス山近くのこの地に上陸した。下船したマリアは美しい自然に畏敬の念を抱き、その地を祝福し、さらに自分の庭にしたいと願った。天からの声が彼女の願いに応えると、それ以来、ここは神聖な場所とされ、いかなる女性も立ち入ることを禁じられている。"
 mount_athos_01: "$building_type_mount_athos_01$"
 mount_athos_01_desc: "キリスト教共同体は、少なくともコンスタンティヌス1世の時代からこの岬に住んでおり、アトス山の修道士たちはすでに第7ニカイア公会議に参加している。しかし、れっきとした修道院の共同体や常設の建物はまだない。"
 mount_athos_02: "$building_type_mount_athos_01$"
 mount_athos_02_desc: "アタナシオスと呼ばれる修道士がアトス山に到着したことで、受胎告知に捧げられた大ラヴラとヴァトペディを始めとするいくつかの修道院が半島各地に設立された。れっきとした修道院ができたことで、地域の修道士は秩序のある規則正しい生活を送っている。"
 mount_athos_03: "$building_type_mount_athos_01$"
 mount_athos_03_desc: "修道院の中心地としてのアトス山の人気は、平信徒の有力者からの多くの献上物、自治法、完全に隔離された生活様式、盛んに描かれる肖像画に基づいており、何世紀にもわたって新たにやって来る修道士が絶えることがなかった。\n修道士の数が増えるにつれて、修道院の数も増えていった。現在、アトス山には20の修道院が存在し、この地域で最大かつ最も影響力のある修道院共同体のひとつとなっている。"
 apollinare_nuovo: "サンタポリナーレ・ヌオヴォ"
 apollinare_nuovo_desc: "サンタポリナーレ・ヌオヴォ聖堂が現在の名称になったのは、聖アポリナリスの遺物が隣接するクラッセ聖堂から移されたつい最近のことである。しかし、その歴史はもっと古い。\n6世紀初頭、東ゴートのテオドリック王によってアリウス派の教会として最初に聖別されたこの建物は、西洋と東洋の芸術を見事に融合させた独特の様式と、美しいビザンツ様式のモザイク画を維持しながら、建造物そのものと装飾の両方を何度も改修してきた。"
 building_type_apollinare_nuovo: "$apollinare_nuovo$"
 building_type_apollinare_nuovo_desc: "$apollinare_nuovo_desc$"
 saint_catherine: "聖カタリナ修道院"
 saint_catherine_desc: "砂漠の真ん中にある地味な修道院だが、深い歴史がある。最初の修道院は、実はコンスタンティヌス帝の母がモーセの「燃える柴」が出現した場所に建てるように命じたものだった。ユスティニアヌス帝はモーセの井戸を囲む現在の要塞への拡張に資金を提供した。設立から数世紀後、聖カタリナの戦利品が届き、修道院の名前が変わった。\n最古の修道院の一つであり、多くの写本を残し、肖像画製作の中心地であり続けた。"
 building_type_saint_catherine: "$saint_catherine$"
 building_type_saint_catherine_desc: "$saint_catherine_desc$"
 jvari_monastery: "ジワリ修道院"
 jvari_monastery_desc: "聖ニノがグルジアを伝道する際に奇跡の十字架を設置した場所に建てられた古代の修道院。\nこの神聖な建物はコーカサス全土から巡礼者を集めている。"
 building_type_jvari_monastery: "$jvari_monastery$"
 building_type_jvari_monastery_desc: "$jvari_monastery_desc$"
 etchmiadzin_cathedral: "エチミアジン大聖堂"
 etchmiadzin_cathedral_desc: "この古代の聖堂はアルメニア使徒キリスト教の歴史的中心地である。元々はアルメニア王国の新しく採用された宗教の勝利を象徴するために、異教徒の神殿の上に聖グレゴリウス・ザ・イルミネーターによって創建されたものであったが、サーサーン朝の侵攻によってほぼ完全に破壊され、数年後に一から再建された。\nしかし7世紀以降、何度もの略奪と放棄を経て、廃墟化した。思い切った高額の資金が投じられ、以前の輝きを取り戻すことができたのである。"
 building_type_etchmiadzin_cathedral: "$etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc: "$etchmiadzin_cathedral_desc$"
 cattolica_stilo: "カットリカ・ディ・スティーロ"
 cattolica_stilo_desc: "この建物にはビザンツの影響が色濃く残っている。洗礼堂のある小さな教会は、剥きだしの岩の上に赤レンガで造られ、「刻印ある十字架」と、さらにフレスコ画には豊かな装飾が施され、スティラロ川の渓谷を見下ろしている。\nこの教会は荒涼とした自然の中にある孤高の宝石であり、そこで人は神を身近に感じることができる。"
 building_type_cattolica_stilo: "$cattolica_stilo$"
 building_type_cattolica_stilo_desc: "$cattolica_stilo_desc$"
 hosios_loukas: "オシオス・ルカス"
 hosios_loukas_desc: "この修道院は、世捨て人の修道士であったステイリスの尊者ルークの聖遺物を保管するために建てられた。\n聖遺物からは奇跡の油が湧き出ると言われ、無数の巡礼者が墓のそばで眠り、インキュベーションにより癒されるという。内部はモザイク画、肖像画、シャンデリア、彫刻、衣服など当時最高峰の芸術品で飾られ、その品質と贅沢さで東地中海全域から賞賛されている。"
 building_type_hosios_loukas: "$hosios_loukas$"
 building_type_hosios_loukas_desc: "$hosios_loukas_desc$"
 sofia_ohrid: "聖ソフィア教会"
 sofia_ohrid_desc: "オフリドの大聖堂はスラヴ人が最初にこの地にやって来たときに破壊され、この地域が安全にキリスト教信仰に戻るまで再建されなかった。\nその最後の姿は、当時最高峰の芸術家たちによるフレスコ画で豪華に装飾された円堂型のバシリカである。"
 building_type_sofia_ohrid: "$sofia_ohrid$"
 building_type_sofia_ohrid_desc: "$sofia_ohrid_desc$"
 fairy_chimneys: "穴居人の集落"
 fairy_chimneys_desc: "この地域の岩石は非常に柔らかく、自然に円錐形、峰、洞窟を形成する。\n人類は何世紀にもわたってこうした構造を利用し、厩舎、倉庫、避難所、家屋、生産施設、そして最終的には教会を円錐形の岩の中に建設し、そうして集落全体が形成された。"
 building_type_fairy_chimneys: "$fairy_chimneys$"
 building_type_fairy_chimneys_desc: "$fairy_chimneys_desc$"
 cilician_gates: "キリキア峠"
 cilician_gates_desc: "キリキア峠は、キリキア平原とアナトリア高原を結ぶタウルス山脈の山道である。\n太古の昔からこの峠は要塞化されており、峠を支配することは、小アジアと中東の商業と軍の主要経路の一つを支配することを意味していた。"
 building_type_cilician_gates: "$cilician_gates$"
 building_type_cilician_gates_desc: "$cilician_gates_desc$"
 swahili_port_pemba: "ペンバ貿易港"
 swahili_port_pemba_desc: "ペンバ島のサンゴ礁、ビーチ、マングローブの森はペンバの人々に豊富な入江と資源をもたらし、自然が作り出したザンジュの中継地となっている。"
 building_type_swahili_port_pemba: "$swahili_port_pemba$"
 building_type_swahili_port_pemba_desc: "$swahili_port_pemba_desc$"
 swahili_port_zanzibar: "ザンジバル貿易港"
 swahili_port_zanzibar_desc: "サンゴ礁の小島に守られたウングージャ島の砂浜は、船にとっては完璧な避難所である。インド洋のあちこちから、商人たちが海洋商業の中心地であるウングージャの自然の力を享受するためにやって来る。"
 building_type_swahili_port_zanzibar: "$swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc: "$swahili_port_zanzibar_desc$"
 swahili_port_mombasa: "モンバサ港"
 swahili_port_mombasa_desc: "険しい崖に囲まれた岩の多い島の頂上に位置するモンバサは、海上交通への便が良いにもかかわらず、防衛上有利な位置にある。"
 building_type_swahili_port_mombasa: "$swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc: "$swahili_port_mombasa_desc$"
 swahili_port_pate: "パテ島貿易港"
 swahili_port_pate_desc: "スワヒリの中心地の北端に位置するパテ島は、スワヒリ人が最初にイスラム教に入信した地域の一つであり、その結果、中東の貿易網とつながりを持っている。"
 building_type_swahili_port_pate: "$swahili_port_pate$"
 building_type_swahili_port_pate_desc: "$swahili_port_pate_desc$"
 swahili_port_lamu: "ラム貿易港"
 swahili_port_lamu_desc: "海岸の温かな白い砂浜とゆっくりと打ち寄せる鮮やかな青い波は、ラムの生命線である活気ある商業活動と対照をなしている。海を越えた国々と古くから交易を行ってきたこの地では、西の果てから東の果てに至るまで、世界中の様々な品々が売買されている。"
 building_type_swahili_port_lamu: "$swahili_port_lamu$"
 building_type_swahili_port_lamu_desc: "$swahili_port_lamu_desc$"
 building_type_dragon_kiln_01: "龍窯"
 building_type_dragon_kiln_01_desc: "急斜面の中腹に建てられたこの複合窯は、交易品や贈答品として価値の高い異国の陶器を生産するのに必要な超高温の火を作り出すことができる。"
 dragon_kiln_01: "$building_type_dragon_kiln_01$"
 building_dragon_kiln_01_desc: "この長い窯は通気口が水平につながれており、陶芸家が高価値な鉢や花瓶などの陶器を作るのに必要な強烈な熱を生み出す。"
 dragon_kiln_02: "$building_type_dragon_kiln_01$II"
 building_dragon_kiln_02_desc: "陶器の生産はこう鉢を使うことで容易になる。こう鉢とは、産業規模の生産過程で出る煙、灰、破片などの不純物や損傷から、焼成中の陶器を保護するための簡単な容器である。"
 dragon_kiln_03: "$building_type_dragon_kiln_01$III"
 building_dragon_kiln_03_desc: "窯の火をいくつもの部屋で囲むことで、火の温度を調節し、作業員による陶器の積み下ろしを容易にする。多くの人々が高い価格を支払ってもいいと思うような、高品質な製品を大量生産する。"
 dragon_kiln_04: "$building_type_dragon_kiln_01$IV"
 dragon_kiln_05: "$building_type_dragon_kiln_01$V"
 dragon_kiln_terrain_requirement_tt: "[terrain|E]が#V $terrain_mountains$#!、#V $terrain_desert_mountains$#!、#V $terrain_hills$#!ではない"
 only_one_mint_tt: "この[province|E]にはほかの造幣所が存在しません。建設できるのは#V $mint$#!（#V $mine_district$#!内）または#V $bureaucratic_mint$#!（#V $bureaucratic_district$#!内）のいずれか1つだけです"
 TERRAIN_NOT_FARMLANDS: "地形は$farmlands$ではない"
 building_type_burkhan_khaldun_01: "ブルハン・ハルドゥーン"
 building_type_burkhan_khaldun_01_desc: "ブルハン・ハルドゥーンはヘンティー山脈で最大の威容を誇る。\n数多くのモンゴルの英雄たちの生誕地とされ、山肌に林立するオボーには、その加護を得ようと多くの生贄が捧げられている。"
 burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
 burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"
 pleasure_dome: "歓楽宮"
 pleasure_dome_desc: "モンゴルの宮殿で、等しく軍と文化の中心地としての役割を果たしている。銀の木の形をした噴水があり、像に絡みつく蛇からさまざまな種類の酒が湧き出ている。"
 building_type_pleasure_dome: "$pleasure_dome$"
 building_type_pleasure_dome_desc: "$pleasure_dome_desc$"
 building_type_murex_farm_01: "アクキガイ漁場"
 building_type_murex_farm_01_desc: "深い紫色は常に需要が高い。この豪華な染料の原料となるアクキガイはここで漁獲され、処理される。"
 building_murex_farm_01: "アクキガイの採集者"
 building_murex_farm_01_desc: "地中海沿岸ではアクキガイの漁業が盛んである。採集した貝を販売すれば、ささやかではあるが安定した収入が得られる。"
 building_murex_farm_02: "アクキガイの処理施設"
 building_murex_farm_02_desc: "ここではアクキガイを効率的に処理し、貴重な分泌物をうまく抽出している。結果として、需要の高い紫色の染料の品質が向上した。"
 building_murex_farm_03: "染料精留所"
 building_murex_farm_03_desc: "専用の精留所がアクキガイの分泌物を深い紫色の染料に精製する。この作業は染料の鮮やかさと価値を著しく高める。"
 building_murex_farm_04: "乾燥場"
 building_murex_farm_04_desc: "野外の庭で干すことで染料の酸化を促進する。これにより、紫色の染料の生産時間が短縮され、より効率的に作業ができるようになる。"
 building_murex_farm_05: "染色職人ギルド"
 building_murex_farm_05_desc: "完璧な色合いの貝紫色を実現できることで有名な染色職人ギルドは、織物染色の精度が高い。結果として、常に高品質の紫衣が生産される。"
 building_murex_farm_06: "絹織物工房"
 building_murex_farm_06_desc: "この工房は絹のような高級織物を染織することに特化している。高品質の衣服を生産できるようにし、その貿易価値を高めている。"
 building_murex_farm_07: "紫衣工房"
 building_murex_farm_07_desc: "皇室の工房では、貝紫色の染め織物の大量生産に力を入れており、これらの高級衣服の販売による収入を大幅に伸ばしている。"
 building_murex_farm_08: "紫の王宮"
 building_murex_farm_08_desc: "貝紫色を基調とした装飾で飾られた壮麗な宮殿は、まさに富と権力の象徴である。この地方の貝紫色染料の生産技術が優れていることを示している。"
 building_type_generic_copper_mines_01: "銅鉱山"
 building_type_generic_copper_mines_01_desc: "重要な銅鉱山であり、その幸運な所有者に驚くほど収益性の高い銅鉱石を供給している。"
 generic_copper_mines_01: "銅鉱山集落"
 generic_copper_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_copper_mines_02: "銅鉱山"
 generic_copper_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_copper_mines_03: "大銅鉱山"
 generic_copper_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_copper_mines_04: "銅鉱区"
 generic_copper_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_generic_silver_mines_01: "銀鉱山"
 building_type_generic_silver_mines_01_desc: "豊かな銀鉱山。貴重な銀を産出しつづけている。"
 generic_silver_mines_01: "銀鉱山集落"
 generic_silver_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_silver_mines_02: "銀鉱山"
 generic_silver_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_silver_mines_03: "銀銅鉱山"
 generic_silver_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_silver_mines_04: "銀鉱区"
 generic_silver_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_generic_gold_mines_01: "金山"
 building_type_generic_gold_mines_01_desc: "驚くほど高価値で希少な金山。地域内のすべての貴族が欲している。"
 generic_gold_mines_01: "金山集落"
 generic_gold_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_gold_mines_02: "金山"
 generic_gold_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_gold_mines_03: "金銅鉱山"
 generic_gold_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_gold_mines_04: "金鉱区"
 generic_gold_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_capital_bureau_01: "首都の行政庁"
 building_type_capital_bureau_01_desc: "首都の運営に全力を傾ける専属の行政機関。城壁内には多くの事務官や軍人が常駐し、エパルクの指示を待っている。"
 building_capital_bureau_01: "裁判所"
 building_capital_bureau_01_desc: "法律は都市を繁栄させるものであり、法廷においてのみ維持されるものである。"
 building_capital_bureau_02: "警備事務所"
 building_capital_bureau_02_desc: "この事務所は大規模な取り締まり部隊を持ち、犯罪から街の安全を守り、法律に違反する者を捕まえている。"
 building_capital_bureau_03: "消防士本部"
 building_capital_bureau_03_desc: "火災は人口密度の高い地域には常に立ちはだかる脅威である。よく訓練された消防士は燃え広がる前に消火を行う。"
 building_capital_bureau_04: "ギルド管理局"
 building_capital_bureau_04_desc: "市内に数多くあるギルドを監督する役人を任命することで、各ギルドが効率よく機能し、質を維持し、必要な手続きをすべて守るようにする。"
 building_capital_bureau_05: "司法部"
 building_capital_bureau_05_desc: "成長しつづける大都市には、大きな司法部が必要不可欠である。役人、事務官、裁判官の一団は、難なく法と秩序を執行する。"
 building_capital_bureau_06: "市内刑務所"
 building_capital_bureau_06_desc: "小さな刑務所は市内にいくつもあるものの、大きな刑務所があれば、法を犯した者に確実に独房が用意される。"
 building_capital_bureau_07: "貿易大学"
 building_capital_bureau_07_desc: "貿易はあまりに儲かりすぎるため、法で規制しないわけにはいかない。通行料と都市に入る交易品を監視することで、首都の備蓄をより効率的に管理することができ、おそらくはさらに金を得ることもできるだろう。"
 building_capital_bureau_08: "都市宮殿"
 building_capital_bureau_08_desc: "ほとんどの宮殿の面目を失わせるような壮大な大邸宅があれば、行政長官はいつでも近くにいて、何かあればすぐに対応できる。都市が本当に眠ることはないが、行政官は間違いなく眠るのだ。"
 capital_bureau_custom_effect_desc: "#low アンロック：#!\n[GetCourtPositionType('eparch_court_position').GetName()]の[court_position|E]の[aptitude|E]を向上させる"
 #ACH
 building_type_oath_warriors_building_01: "軍事恩賞"
 building_type_oath_warriors_building_01_desc: "この領地の君主は、戦士を支援することを戴冠式で誓っている。"
 oath_warriors_building_01: "退役兵の小農地"
 oath_warriors_building_01_desc: "長年奉仕してきた貴族戦士たちには、寛大な地元領地が与えられる。そのため、この地では忠誠を尽くして仕える意欲が高まっている。"
 oath_warriors_building_02: "軍事私有地"
 oath_warriors_building_02_desc: "戦場で命を落とさなかった貴族戦士階級は、与えられた領地で安楽な生活を送るだけでなく、十分な兵を募り、武装することができる。"
 oath_warriors_building_03: "村の封土"
 oath_warriors_building_03_desc: "多くの地元の村が騎士階級の将校たちに個人領地として与えられる。彼らはほかの階級を犠牲にして、力と富を蓄えることができる。"
 oath_warriors_building_04: "広大な軍事領分"
 oath_warriors_building_04_desc: "地元の税収のかなりの部分が、畑や集落の領有権を持つ下級の戦士貴族たちに納められている。しかし、彼らの強力な従者たちは引き続き主君に仕えている。"
 building_type_oath_faithful_building_01: "宗教的記念碑"
 building_type_oath_faithful_building_01_desc: "この領地の君主は、信徒を支援することを戴冠式で誓っている。"
 oath_faithful_building_01: "道端の祠"
 oath_faithful_building_01_desc: "道路沿いの小さな小屋に、簡素な聖像が安置されている。"
 oath_faithful_building_02: "聖なる門"
 oath_faithful_building_02_desc: "集落の入り口にも内部にも精緻な宗教的美術品が設置され、人々に畏敬の念を抱かせるとともに安全な通行を約束する。"
 oath_faithful_building_03: "寺院の聖域"
 oath_faithful_building_03_desc: "地元の寺院複合施設はアーチ屋根付きの庭園を持つように拡張され、淡水の井戸を備えた静かな場所が設けられている。"
 oath_faithful_building_04: "記念碑的な広場"
 oath_faithful_building_04_desc: "中央の大広場には多大な投資が行われた。大広場は宗教的な芸術品が溢れ、無駄や高利貸しとは無縁で、しかも住民に水を供給する。"
 building_type_oath_poor_building_01: "公設の慈善院"
 building_type_oath_poor_building_01_desc: "この領地の君主は、貧民を支援することを戴冠式で誓っている。"
 oath_poor_building_01: "慈善の慣習"
 oath_poor_building_01_desc: "特に聖なる日には、富める人々は恵まれぬ人々に余分な食料や財産を施すよう当局から奨励される。"
 oath_poor_building_02: "救貧院"
 oath_poor_building_02_desc: "ごく貧しい人々、寡婦、そして高齢者に、ささやかな宿泊場所といくらかの世話が簡素な施設で提供される。"
 oath_poor_building_03: "慈悲深い行政"
 oath_poor_building_03_desc: "慈善院を始めとする恵まれない人々のための施設が、ある程度の資力を持つ公的な管理者によって適切に運営されている。"
 oath_poor_building_04: "慈善施設"
 oath_poor_building_04_desc: "この地のどこでも貧しい人々が困ることはない。優雅な住まいが放浪せんとする人々を収容し、病院が病気の人々や高齢者を看護し、貧しい農民には寛大な手当が与えられる。"
 oath_warriors_building_01_tooltip_high_medieval: "少なくとも#V 3#!人のあなたの[knights|E]が以下の状況（現在：#P [GetPlayer.MakeScope.ScriptValue('oath_warriors_building_01_high_medieval_value')|0]#!）：\n少なくとも#V 14#!の[prowess|E]と、少なくとも1つの[commander_trait|E]を持っている"
