 great_project_cathedral_01_desc: "古くから建つ大聖堂であり、司教が座すとともにキリスト教の巡礼者を導く灯台である。重厚な円形アーチと威厳あるヴォールトの下、聖遺物や祭壇が信徒たちを待ち受ける。\n\n[building|E]の効果：[cathedral_complex|E]の[GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName]"
