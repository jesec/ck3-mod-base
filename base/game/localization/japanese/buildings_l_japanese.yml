 building_type_sankore_university: "サンコーレ大学"
 building_type_sankore_university_desc: "$building_type_generic_university_desc$\n\n元々モスクだったサンコーレ大学は、旅商人たちから多くの本を得て学問の中心地へと変貌を遂げた。"
