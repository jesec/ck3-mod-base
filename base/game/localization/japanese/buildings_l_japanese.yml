 building_type_powder_magazine_01: "火薬製造業者"
 building_type_powder_magazine_01_desc: "火薬の効力を維持するには、製造、保管、整備の専用施設が必要である。この強力な戦力を必要とする[GetMaA('handgunners').GetName]やその他の兵種を雇用するためには、専用の建造物を建てなければならない。"
 powder_magazine_01: "火薬保管庫"
 building_powder_magazine_01_desc: "天候の影響を受けないよう火薬を安全に保管し、事故が起きる危険を最小限に抑えることができる保管庫。"
 building_powder_magazine_02: "火薬物流事務所"
 building_powder_magazine_02_desc: "火薬の複雑な物流管理ができる職員を採用することで、火薬を正しく保管し、領国全土に事故なく輸送できるようになる。"
 building_powder_magazine_03: "硫黄鉱山"
 building_powder_magazine_03_desc: "硫黄は土硫黄とも呼ばれ、豊富に存在するが、大量生産が難しい鉱物だ。専用の鉱山があれば、この貴重な鉱物を安定して供給できる。"
 building_powder_magazine_04: "硝石工房"
 building_powder_magazine_04_desc: "硝石は火薬を作るうえで重要な原料の一つだが、建物全体を焼き尽くすことなく大量に生産するには、管理された環境と熟練した技術が必要とされる。"
 building_powder_magazine_05: "火薬庫"
 building_powder_magazine_05_desc: "火薬の貯蔵には、人の住む場所や大切な場所から離れた安全なところに、強固な壁を持つ専用の建物を作る必要がある。"
 building_powder_magazine_06: "衛兵所"
 building_powder_magazine_06_desc: "火薬はそれ自体が危険なものだが、間違った人間の手に渡ればその危険性はさらに高まる。火薬が盗まれることのないよう、多数の衛兵を配置することができるようになった。"
 building_powder_magazine_07: "火薬精製所"
 building_powder_magazine_07_desc: "様々な材料を使って火薬が製造される独立した建物。これで万一事故が起きたとしても、施設全体が破壊されることはなくなるだろう。"
 building_powder_magazine_08: "手砲用施設"
 building_powder_magazine_08_desc: "手砲は信頼性が低く、使用中に破損する恐れがある。このため、可能な限り最高の設備を整え、熟練の職人を雇って、最高品質の手砲を製造する必要がある。"
 powder_magazine_1_effect_desc: "$unlocks_building_desc$[gunpowder|E][men_at_arms|E]の徴兵上限：#P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
 powder_magazine_2_effect_desc: "$unlocks_building_desc$[gunpowder|E][men_at_arms|E]の徴兵上限：#P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
 powder_magazine_3_effect_desc: "$unlocks_building_desc$[gunpowder|E][men_at_arms|E]の徴兵上限：#P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 building_type_mandala_capital_01: "首都の総合寺院"
 building_type_mandala_capital_01_desc: "この[great_project|E]は単なる寺院ではない。我々の気骨の証、我々の功績、我々の#EMP 栄光#!である。このような寺院は、神聖で強大なデーヴァラージャの支配と博愛を示すものである。"
 mandala_capital_01: "装飾された寺院"
 mandala_capital_01_desc: "壮大な遺産へのつつましい第一歩であるこの装飾された寺院は、支配者デーヴァラージャへの礼拝と祈りの場である。"
 mandala_capital_02: "荘厳な寺院"
 mandala_capital_02_desc: "元の寺院を改良し、お堂、調度品、装飾を追加して首都の寺院は拡張された。"
 mandala_capital_03: "境内"
 mandala_capital_03_desc: "さらに宿舎を増やしたことで、境内が拡大しはじめた。\n現在では、参拝者、使用人、聖職者の住居のほか、礼拝のためのお堂がいくつかある。"
 mandala_capital_04: "大寺院群"
 mandala_capital_04_desc: "寺院群は今や小さな村ほどの大きさになり、ほとんどの生活必需品は自給自足できるようになった。\n小さな舎利殿と東西に広がる水鏡の池が追加され、精神世界とのつながりがさらに強まっている。"
 mandala_capital_05: "聖寺院宮殿"
 mandala_capital_05_desc: "めったにお目にかかれない珠玉の建築物である寺院宮殿は、神聖なデーヴァラージャのために立派な宿舎を備えて拡張された。\n記念碑、遺物、宝物——各地からやって来た旅人は、この神聖な寺院宮殿のあまりの迫力に驚嘆する。"
 building_type_wulingyuan_01: "$wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$wulingyuan_01_desc$"
 wulingyuan_01: "武陵源"
 wulingyuan_01_desc: "この場所の山々には、何千本もの巨大な砂岩の柱がそびえ立っている。最も印象的なのはその柱だが、この地域には渓谷、小川、小さな湖、洞窟も多い。"
 building_type_leshan_giant_buddha_01: "$leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$leshan_giant_buddha_01_desc$"
 leshan_giant_buddha_01: "楽山大仏"
 leshan_giant_buddha_01_desc: "崖の側面に彫られたこの仏像は岷江と烏渓の合流地点に面しており、旅に疲れた旅人を迎えている。"
 building_type_yungang_grottoes_01: "$yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$yungang_grottoes_01_desc$"
 yungang_grottoes_01: "雲岡石窟"
 yungang_grottoes_01_desc: "数十の大きな洞窟と数百の小さな洞窟を含む、大規模な石窟寺院。洞窟は何千、何万もの仏像で埋め尽くされている。"
 building_type_wudang_mountain_temples_01: "$wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$wudang_mountain_temples_01_desc$"
 wudang_mountain_temples_01: "武当山寺院"
 wudang_mountain_temples_01_desc: "武当山は道教にとって神聖な山の一つである。また、太極拳の修行で有名な大きな寺院群の本拠地でもある。"
 building_type_shaolin_monastery_01: "$shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$shaolin_monastery_01_desc$"
 shaolin_monastery_01: "少林寺"
 shaolin_monastery_01_desc: "少林寺は少林拳発祥の地であり、武術に長けた僧侶を輩出したことで最も有名だろう。しかし、ここは同時に学問の場でもあり、仏典の翻訳も行う。"
 building_type_lingyin_temple_01: "$lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$lingyin_temple_01_desc$"
 lingyin_temple_01: "霊隠寺"
 lingyin_temple_01_desc: "霊隠寺は、西暦328年にインドの僧侶と巡礼者が仏教を広めるために創建した。それ以来、寺は大きく発展してきた。いくつものお堂、石窟や仏塔があり、何千人もの僧侶を収容できる寮もある。"
 building_type_giant_wild_goose_pagoda_01: "$giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$giant_wild_goose_pagoda_01_desc$"
 giant_wild_goose_pagoda_01: "大雁塔"
 giant_wild_goose_pagoda_01_desc: "大雁塔はもともと、書物や彫刻、さまざまな像を保管する場所として西暦652年に建てられた。その後、立派な10階建てに建て直されたが、何度も改築や修復を受けて7階建てになった。"
 building_type_kaifeng_palace_01: "$kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$kaifeng_palace_01_desc$"
 kaifeng_palace_01: "開封王宮"
 kaifeng_palace_01_desc: "開封の王宮は、宋がこの街に都を置いたときに建てられた。強力な優れた政府がこの城壁の中で統治を行い、街と王国全体の繁栄を確かなものにする。"
 kaifeng_examination_cost_bonus_desc: "この[barony|E]が[realm_capital|E]であるあいだの、[activity|E]「[GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName]」のコスト：#P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuildingType('kaifeng_palace_01').GetName]"
 building_type_forbidden_city_01: "$forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$forbidden_city_01_desc$"
 forbidden_city_01: "紫禁城"
 forbidden_city_01_desc: "紫禁城は広大な皇帝の宮殿で、約1,000の個別の建物で構成されている。紫禁城全体は高い城壁と深い堀に囲まれており、その中で不眠不休で働く多くの役人と政府を守っている。"
 building_type_qianling_mausoleum_01: "$qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$qianling_mausoleum_01_desc$"
 qianling_mausoleum_01: "乾陵"
 qianling_mausoleum_01_desc: "乾陵は主に皇帝高宗と女帝武則天の陵墓であるが、李氏のほかの一族もここに葬られている。墳墓は長方形の壁で保護されており、景観を飾る多くの石像はこの陵墓の最もよく知られた特徴の一つである。"
 building_type_quanzhou_seaport_01: "$quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$quanzhou_seaport_01_desc$"
 quanzhou_seaport_01: "泉州港"
 quanzhou_seaport_01_desc: "泉州（チュワンチョウ）の港には、遠くから異国の商人が集まってくる。アラビア、アナトリア、日本、朝鮮、そしてそれらに挟まれたあらゆる国からやってくる。このような貿易船の流入により、地元の産業は盛況し、泉州はこの地域で随一の造船業を営むようになった。"
 building_type_angkor_wat_01: "$angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$angkor_wat_01_desc$"
 angkor_wat_01: "アンコール・ワット"
 angkor_wat_01_desc: "アンコール・ワットは、ヴィシュヌ神に捧げられた巨大な寺院群である。ヒンドゥー教の神話に登場する神々の故郷、メルー山を表現するように作られている。立派な堀に囲まれた寺院群には宗教画、彫刻、レリーフで溢れる回廊がいくつもある。"
 building_type_citadel_thang_long_01: "タン・ロン城塞" #昇龍
 building_type_citadel_thang_long_01_desc: "$citadel_thang_long_01_desc$"
 citadel_thang_long_01: "大羅城"
 citadel_thang_long_01_desc: "地元軍隊の軍事拠点となる城塞で、侵略者を撃退するために高度に要塞化されている。"
 citadel_thang_long_02: "タン・ロン皇城塞" #昇龍
 citadel_thang_long_02_desc: "タンロン城は要塞でも王宮でもある。城塞には、主要塞、宮城、紫禁城の三つの区域がある。"
 building_type_po_klong_garai_01: "$po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$po_klong_garai_01_desc$"
 po_klong_garai_01: "ポー・クロン・ガライ寺院"
 po_klong_garai_01_desc: "チャム建築の最高峰であるポー・クロン・ガライ寺院は、同名の伝説的な王を祀るために建てられたと言われている。レンガ造りの三つの目立つ塔があり、主な芸術作品としてシヴァ神の立派な彫刻がある。"
 building_type_dau_temple_01: "$dau_temple_01$"
 building_type_dau_temple_01_desc: "$dau_temple_01_desc$"
 dau_temple_01: "ザウ寺"
 dau_temple_01_desc: "ルイラウにある由緒ある寺院は、遠方の地から来た僧侶たちが初めて集ったまさにその場所である。今も残るレンガの塔、遺物、そして高僧のミイラは、何世紀にもわたる仏教への帰依を体現している。"
 building_type_liuhe_pagoda_01: "$liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$liuhe_pagoda_01_desc$"
 liuhe_pagoda_01: "六和塔"
 liuhe_pagoda_01_desc: "王たちが潮を鎮め、仏陀を称えるために建立した高層の仏塔。その灯火は大地を照らし、人と天との調和の象徴となっている。"
 building_type_muaro_jambi_01: "$muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$muaro_jambi_01_desc$"
 muaro_jambi_01: "ムアロ・ジャンビ寺院群"
 muaro_jambi_01_desc: "バタンハリ川沿いに位置するムアロ・ジャンビの広大なレンガ造りの複合施設は、交易と信仰の双方を守っていた。シュリーヴィジャヤの拠点として統治者の避難所となり、スマトラ中核地域内の軍を動員する場でもあった。"
 building_type_hanging_temple_01: "$hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$hanging_temple_01_desc$"
 hanging_temple_01: "懸空寺"
 hanging_temple_01_desc: "懸空寺は恒山の断崖にぶら下がるように建てられた僧院である。伝説によれば、その建設は何世紀も前に、了然という名の僧侶によって始められたという。高床式の木造の堂には仏教、道教、儒教の聖人たちを祀る祠があり、複数の信仰が融合し、優美な静けさで重力に逆らっている。"
 building_type_pagoda_of_fogong_temple_01: "$pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$pagoda_of_fogong_temple_01_desc$"
 pagoda_of_fogong_temple_01: "仏宮寺釈迦塔"
 pagoda_of_fogong_temple_01_desc: "仏宮寺釈迦塔は釘を使わずに建てられた高層の木造塔である。九層にそびえ立つ塔の内部には聖遺物や聖像が安置されており、その巧妙な構造は今なお建築技術の驚異であると同時に、信仰の象徴となっている。"
 building_type_plain_of_jars_01: "$plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$plain_of_jars_01_desc$"
 plain_of_jars_01: "ジャール平原"
 plain_of_jars_01_desc: "ジャール平原は巨大な石の壺が散在する広大な高原で、その目的は謎に包まれている。かつて古代の儀式に使われたこれらの壺は、忘れられた民族の遺物として残り、畏敬の念と地元民の崇敬を呼び起こしている。"
 building_type_dieng_plateau_01: "$dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$dieng_plateau_01_desc$"
 dieng_plateau_01: "ディエン高原"
 dieng_plateau_01_desc: "ディエン高原は霧に覆われた火山性の盆地で、硫黄の池や噴気孔が点在している。散在する古代寺院と儀式の伝説により、畏怖と崇拝の両方を受ける聖なる高地であり、かつて古代の善と悪の神々がさまよった地である。"
 building_type_mount_apo_01: "$mount_apo_01$"
 building_type_mount_apo_01_desc: "$mount_apo_01_desc$"
 mount_apo_01: "アポ山"
 mount_apo_01_desc: "アポ山はベナド湖畔にそびえ立ち、その名はルマッド語で「尊敬される長老」を意味する。これは聖なる山の精霊であるアポ・サンダワの名の短縮形であり、「長老サンダワ」や「祖父サンダワ」とも呼ばれる。アポ・サンダワのための儀式は、祖先の霊の媒介者とされる部族のシャーマンが執り行う。"
 building_type_besakih_temple_01: "$besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$besakih_temple_01_desc$"
 besakih_temple_01: "ブサキ寺院"
 besakih_temple_01_desc: "「バリ島の母なる寺院」として知られるブサキ寺院は、島内で最も重要かつ神聖なヒンドゥー教寺院の複合施設である。バリ島で最も高く崇高なる火山であるアグン山の山腹に位置し、島全体の宗教的・文化的な中心地として、あらゆる人々のための壮大な儀式が行われる。"
 building_type_gongsanseong_fortress_01: "$gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$gongsanseong_fortress_01_desc$"
 gongsanseong_fortress_01: "公山城"
 gongsanseong_fortress_01_desc: "公山城は錦江上流の丘陵にそびえる。百済の王城として築かれたこの要塞は、長大な城壁と石造の門が王と臣民を等しく守り、王朝の権力と防衛の山城として機能した。"
 building_type_krakatoa_01: "$krakatoa_01$"
 building_type_krakatoa_01_desc: "$krakatoa_01_desc$"
 krakatoa_01: "クラカタウ"
 krakatoa_01_desc: "クラカタウは海岸を少し離れた小さな列島に位置する迫力ある火山である。"
 building_type_borobudur_01: "$borobudur_01$"
 building_type_borobudur_01_desc: "$borobudur_01_desc$"
 borobudur_01: "ボロブドゥール"
 borobudur_01_desc: "ボロブドゥールは九つの石壇が積み重なり、中央のお堂を頂点とする巨大な仏教寺院である。寺院は何千ものレリーフと何百もの仏像で飾られている。"
 building_type_hoshi_ryokan_01: "$hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$hoshi_ryokan_01_desc$"
 hoshi_ryokan_01: "法師旅館"
 hoshi_ryokan_01_desc: "法師旅館は古い伝統的な旅館で、家族経営である。旅人に休息場所、食事、温泉を提供する。"
 building_type_celestial_great_barracks_01: "大兵舎"
 building_type_celestial_great_barracks_01_desc: "この巨大な兵舎と要塞は、地方総督に軍隊を強化するための兵士を提供し、その地域の防衛力を大幅に向上させる。拡張が進めば、それ自体が一つの要塞都市へと発展する。文官が役目を果たせなくなったときには、ここが地方の防衛と補給、さらには統治までも担う拠点となる。"
 celestial_great_barracks_01: "$building_type_celestial_great_barracks_01$"
 building_celestial_great_barracks_01_desc: "この巨大な兵舎と要塞は、地方総督に軍隊を強化するための兵士を提供し、その地域の防衛力を大幅に向上させる。"
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U]は軍事[governor|E]ではない"
 celestial_great_barracks_great_project_only_desc: "[great_project|E]「[GetGreatProjectType('construct_great_barracks').GetName]」を完了しなければ建設できない"
 building_type_the_great_wall_01: "$the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$the_great_wall_01_desc$"
 the_great_wall_01: "万里の長城"
 the_great_wall_01_desc: "これは長城の最も古い部分で、大部分が秦王朝によって築かれた。長い歴史の中で石やレンガ、漆喰は摩耗したが、それでも要塞としては強固である。"
 building_type_the_great_wall_02: "$the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$the_great_wall_02_desc$"
 the_great_wall_02: "万里の長城"
 the_great_wall_02_desc: "漢王朝は先代が築いた城壁を大幅に拡張した。彼らは砂漠や山を越えて何百マイルにも及ぶ、より広大な区画をいくつか建設した。"
 building_type_the_great_wall_03: "$the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$the_great_wall_03_desc$"
 the_great_wall_03: "万里の長城"
 the_great_wall_03_desc: "魏、斉、隋の各王朝は紀元5世紀から6世紀にかけて城壁を増築し、いくつかの区間を改良してより堅牢な要塞を築いた。"
 building_type_the_great_wall_04: "$the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$the_great_wall_04_desc$"
 the_great_wall_04: "万里の長城"
 the_great_wall_04_desc: "最も優れた技術的快挙であるこの巨大城壁は、紀元前7世紀に建設されて以来、何度も拡張されてきた。現在では数千マイルにおよび、多数の監視塔、兵舎、駐屯所を収容している。蛮族の侵略者がこの強大な障害を乗り越えることはないだろう。"
 building_type_the_great_wall_shanhai_pass: "$the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 the_great_wall_shanhai_pass: "$the_great_wall_04$"
 the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 the_great_wall_liaodong: "$the_great_wall_04$"
 the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 special_building_improve_silk_road: "この[special_building|E]の完成時、[sub_region_temp.GetName][situation_sub_region|E]は[situation_silk_road_phase_exceptional_bounty|E]の[silk_road|E][situation_phase|E]に近づく#weak （現時点でそのフェーズでない場合）#!"
 building_type_herat_bazaar_01: "$herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$herat_bazaar_01_desc$"
 herat_bazaar_01: "ヘラートのバザール"
 herat_bazaar_01_desc: "ヘラートの賑やかなバザールは、#italic ハライワ#!の古代アケメネス朝時代から有名だった。毎日この街を出入りする隊商は、このヘラートのバザールをホラーサーンの真珠と呼んでいる。"
 herat_bazaar_02: "ヘラートの広大なバザール"
 herat_bazaar_02_desc: "ヘラートのバザールでは商業と交易が盛んに行われている。ホラーサーンの真珠は、どんな王冠の宝石よりもきらきらと輝いている。"
 building_type_tabriz_bazaar_01: "$tabriz_bazaar_01$"
 building_type_tabriz_bazaar_01_desc: "$tabriz_bazaar_01_desc$"
 tabriz_bazaar_01: "タブリーズのバザール"
 tabriz_bazaar_01_desc: "タブリーズの由緒ある市場は、太古の昔から商業の中心地として機能してきた。その壁は色とりどりのタイルや漆喰で飾られ、この古代の市場の富と威信を反映している。"
 tabriz_bazaar_02: "タブリーズの広大なバザール"
 tabriz_bazaar_02_desc: "年月を重ねても、タブリーズの威厳ある古代の市場から活気が失われることはない。むしろ、由緒あるバザールは以前にも増して生き生きとしているようだ。"
 building_type_gurganj_bazaar_01: "$gurganj_bazaar_01$"
 building_type_gurganj_bazaar_01_desc: "$gurganj_bazaar_01_desc$"
 gurganj_bazaar_01: "グルガーンジュのバザール"
 gurganj_bazaar_01_desc: "ステップへの玄関口である活気あふれる都市グルガーンジュは、辺境で財を築こうとする商人や旅人が数多く集まることで知られる。"
 gurganj_bazaar_02: "グルガーンジュの広大なバザール"
 gurganj_bazaar_02_desc: "灼熱の太陽の下、遊牧民や商人、冒険者たちは、遠き中国の富の噂とともに皇帝の異国の貨を交換しながら、細々と生計を立てている。"
 building_type_lhasa_market_01: "$lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$lhasa_market_01_desc$"
 lhasa_market_01: "ラサのフロム"
 lhasa_market_01_desc: "インドと中国に挟まれた要所に位置するラサでは、高くそびえるポタラ宮の陰に商人たちが集まり、旅行者の目を引こうとする。"
 lhasa_market_02: "ラサの広大なフロム"
 lhasa_market_02_desc: "ラサの商人たちは言う——太陽の下に新しいものなど何ひとつない、と。安物から宝石まで、シルクロードを渡るあらゆる品々のなかで、彼らが出会わなかったものはひとつとして存在しないのだ。"
 building_type_changan_market_01: "$changan_market_01$"
 building_type_changan_market_01_desc: "$changan_market_01_desc$"
 changan_market_01: "長安の市場"
 changan_market_01_desc: "大都市長安の市場は#EMP 永遠の平和#!と謳われ、あらゆる商売で賑わい、中国内外のほぼすべての交易にとって不可欠な中継地である。"
 changan_market_02: "長安の大市場"
 changan_market_02_desc: "長安で成功を収めた商人たちは、人類史上最高の財宝を見ても、もはや瞬きもしない。というのも、彼らはそれらをすべて見たことがあり、おそらくそのうちのいくつかを所有しているからだ。"
 building_type_dunhuang_market_01: "$dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$dunhuang_market_01_desc$"
 dunhuang_market_01: "敦煌の市場"
 dunhuang_market_01_desc: "光り輝く疏勒河のほとりに位置する都市敦煌は、河西回廊とタリム盆地の境界に位置し、両地域を行き来するすべての旅人にとって重要な中継地である。"
 dunhuang_market_02: "敦煌の大市場"
 dunhuang_market_02_desc: "太陽に晒された敦煌の通りにあるのは、荷を積んだ無数のラクダやラバ、そして人々の緩慢な行進と、東西へと絶えず交わる道だけである。"
 building_type_lahur_bazaar_01: "$lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$lahur_bazaar_01_desc$"
 lahur_bazaar_01: "ラホールのバザール"
 lahur_bazaar_01_desc: "ラホールの旧市街は、二つの大きな市場を中心にそれを囲むように民家が建ち並び、そのすべてが長い土壁で囲まれている。この賑やかな市場の集まりは大昔から活気に満ちていて、これから先も繁盛が続くだろう。"
 lahur_bazaar_02: "ラホールの広大なバザール"
 lahur_bazaar_02_desc: "ラホールには、川底を水が流れるように自然に交易品が流れ込んでくる。密集した市場には商品が溢れ、商人たちはその鋭い眼光の奥に、この都市の長い歴史から得たあらゆる知恵を潜ませているようだ。"
 building_type_hamadan_bazaar_01: "ハマダーンのバザール"
 building_type_hamadan_bazaar_01_desc: "$hamadan_bazaar_01_desc$"
 hamadan_bazaar_01: "ハマダーンのバザール"
 hamadan_bazaar_01_desc: "古代メディア人の核心地域だったハマダーンは、粘土板や楔形文字の時代から商業の中心地であった。ハマダーンの主要バザールの露店では、何百世代にもわたって商人たちが商品を売り歩き、交渉術を発揮してきた。"
 hamadan_bazaar_02: "ハマダーンの広大なバザール"
 hamadan_bazaar_02_desc: "ハマダーンの偉大なバザールはかつてないほど繁栄し、その長く威厳ある歴史において、比類なき富と活動の新たな高みに到達している。"
 building_type_sunday_bazaar_01: "日曜バザール"
 building_type_sunday_bazaar_01_desc: "$sunday_bazaar_01_desc$"
 sunday_bazaar_01: "日曜バザール"
 sunday_bazaar_01_desc: "地元の人の中には、カシュガルには金の概念が生まれる前から日曜バザールがあったと話す人もいる。市場の屋台を歩いていると、確かにそんな感じがする。この場所のない時代を想像できない。"
 sunday_bazaar_02: "広大な日曜バザール"
 sunday_bazaar_02_desc: "カシュガルの大日曜バザールは太古の昔から続いているが、現在の繁栄ぶりは後世まで語り継がれるに違いない。"
 building_type_mount_fuji_01: "富士山"
 building_type_mount_fuji_01_desc: "雪に覆われた孤高の頂を持つ富士山は、東日本への玄関口として知られ、日本全国から旅人や参拝者を惹きつけ、見る者すべてに安らぎを与える名所だ。神道のなかでも最も神聖な山の一つである富士山には、火山、桜、そして生命の儚さを司る女神「#EMP コノハナノサクヤヒメ#!」が祀られている。"
 mount_fuji_01: "$building_type_mount_fuji_01$"
 mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 building_type_waterworks_01: "水管理施設"
 building_type_waterworks_01_desc: "水はすべての生命の源である。安定した水の供給を維持し、効果的に活用することは、強固な領国と統治の維持に必要不可欠だ。"
 waterworks_01: "人工池"
 building_waterworks_01_desc: "水を管理するための第一歩は、管理する水を確保することだ。地面の窪みに粘土を敷いた簡単な人工池には、後で使用するための水を貯めておくことができる。"
 building_waterworks_02: "貯水池"
 building_waterworks_02_desc: "より深さのある窪地の内側に防水性の層を施し、簡単な屋根を付けた貯水池は、汚染や蒸発による損失を少なくして、より多くの水をより長く貯めることができる。"
 building_waterworks_03: "水平運河"
 building_waterworks_03_desc: "貯水場所の間に溝を掘ることで、より多くの人々が管理された水をはるかに容易に利用できるようになる。水平運河を作ることで、水量が過剰に多くなった場合に水の勢いを弱めるだけでなく、干ばつ時には人や家畜、作物に水を供給し続けることもできる。水路を適切に計画すれば、軽舟の航行にも利用できる。"
 building_waterworks_04: "灌漑用貯水池"
 building_waterworks_04_desc: "あらゆる丘や尾根、周囲との高低差がある場所は、適切な堤防を築くことで、水を貯める場所に変えることができる。水路でつながれた開放型の貯水池は、互いに水を供給し合うことができ、必要に応じて貯める水と使用する水の量をより細かく制御できる。"
 building_waterworks_05: "階段井戸"
 building_waterworks_05_desc: "水の管理と基本的な井戸掘りを組み合わせることで、常に地下から水を供給できる巨大な地下構造物を作ることができる。階段井戸を地上の水門や水路と接続すれば、必要に応じて水を集めたり、逆にほかの地域に給水することもできる。"
 building_waterworks_06: "運河の水門"
 building_waterworks_06_desc: "水路の深さ自体も、水門や排水路によって制御することができる。水門の後ろに貯められた水は、はしけや小船が航行できる水路として活用でき、運河は輸送に最適な水路となる。"
 building_waterworks_07: "人造湖"
 building_waterworks_07_desc: "大量の水を貯めることができる巨大な貯水池。河川や水路から水を引く人造湖は、広大な農地や数多くの村に水を供給することができる。壮大な人造湖は、その存在自体が崇敬の的となり、崇拝や統治の拠点として効果的に機能する。"
 building_waterworks_08: "給排水システム"
 building_waterworks_08_desc: "パイプとポンプを通して水は上下に流れる。水は最も高い塔にも届けられ、汚れた水は最も遠い汚水溜めに流される。水は過不足なく供給され、水量が増えても溢れることなく排水される。"
 building_type_spice_plantation_01: "香辛料の農園"
 building_type_spice_plantation_01_desc: "世界のごく限られた地域でしか育たない植物から、最高の香りと繊細な風味をもたらす香辛料が生まれる。これらの植物はその希少性と品質の高さから、無事育てることができれば非常に高い利益が見込まれる。"
 building_spice_plantation_01: "香辛料の採集"
 building_spice_plantation_01_desc: "香辛料はさまざまな樹木や低木、花から採集できるが、まずはそれらを#italic 見つける#!必要がある。"
 building_spice_plantation_02: "耕作された香辛料の畑"
 building_spice_plantation_02_desc: "需要の高い香辛料は、適切な条件下で、適切な作業をし、適切な監督者が適切に管理することで栽培できる。"
 building_spice_plantation_03: "香辛料園"
 building_spice_plantation_03_desc: "広大な土地に整然と規則的に植物を植えることで、毎年、安定した量の香辛料を計画的に生産することができる。"
 building_spice_plantation_04: "香辛料の乾燥"
 building_spice_plantation_04_desc: "出荷前に香辛料を乾燥させるための場所を付近に確保しておくことで、より多くの収穫物を腐らせずに加工することができ、全体的な香辛料の生産費用を削減することができる。"
 building_spice_plantation_05: "香辛料の粉砕機"
 building_spice_plantation_05_desc: "香辛料は粉砕することで腐りやすくなるが、保存効率は大幅に向上する。また、粉砕機は選別にも役立ち、異物を取り除いてより純度の高い香辛料を手に入れることができる。"
 building_spice_plantation_06: "香辛料用の私有地"
 building_spice_plantation_06_desc: "労働者の住宅、作物の加工所、保管所を、香辛料が栽培されている場所の近くに統合することで、全体的な経費を削減しながら、より多くの香辛料を生産し販売することが可能になる。"
 building_spice_plantation_07: "農園の土地管理"
 building_spice_plantation_07_desc: "大地そのものを再形成して、作物の栽培に利用できる土地を増やすことができる。棚田や水路を作ることで、より多くの作物を栽培する新たな機会が生まれる。"
 building_spice_plantation_08: "香辛料の大量生産"
 building_spice_plantation_08_desc: "正しい方針に従えば、土地全体を最も収益性の高い香辛料の生産に特化して活用できる。植えた木や育てた低木、摘んだ葉、乾燥させた実、そのすべてが財源となる。"
 building_type_examination_hall_01: "試験会場"
 building_type_examination_hall_01_desc: "科挙は試験を行う場所がなければ実施できない。地方の属州総督は、試験を適切に実施するために役人が必要とするすべての資源を確保し、受験者による不正行為を最小限に抑えつつ、必要な支援を行う責任を負う。"
 examination_hall_01: "$building_type_examination_hall_01$"
 building_examination_hall_01_desc: "政府の役職に就く候補者の試験を行うには、試験を実施する場所が必要となる。試験専用の部屋は最低限の施設ではあるが、これで試験は実施できる。"
 examination_hall_02: "$building_type_examination_hall_01$II"
 building_examination_hall_02_desc: "少し祈りを捧げることが、受験者にどんな勉強や準備よりも大きな自信を与えることもある。"
 examination_hall_03: "$building_type_examination_hall_01$III"
 building_examination_hall_03_desc: "講堂、試験施設、教員室、保管室からなる複合施設は、科挙の各段階を最高の効率と質で実施するために必要な総合的な支援を提供している。"
 examination_hall_04: "$building_type_examination_hall_01$IV"
 examination_hall_05: "$building_type_examination_hall_01$V"
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "この[holding|E]で開催された[GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName]と[GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName]の[activities|E]コストが減少：[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "この場所には$building_type_examination_hall_01$がある"
 building_can_benefit_requirements: "#S 条件を満たしている場合：#!\n"
 rebuilding_grants_full_benefits: "#S [rebuilding|El]後：#!\n"
 building_requirements_header: "#S 条件：#!\n"
 building_fallback: "#S 条件を満たしていない場合：#!\n"
 building_effects_header: "#S 効果：#!\n"
 building_type_citadel_shrine_01: "要塞神殿"
 building_type_citadel_shrine_01_desc: "$building_type_temple_citadel_01$は、その神々を祀る場所がなければ完成したとは言えない。一般市民であれ駐屯兵であれ、その壁から放たれる神聖な空気は、どんな不安を抱えた魂も落ち着かせるだろう。"
 building_citadel_shrine_01: "プラサダ塔"
 building_citadel_shrine_01_desc: "$building_type_temple_citadel_01$の頂を飾るプラサダは、遠くから見ても堂々としたシルエットを描いている。このため崇拝者たちは遠くからでも神殿を称えることができる。"
 building_citadel_shrine_02: "プラーン尖塔"
 building_citadel_shrine_02_desc: "繊細な彫刻がふんだんに施されたプラーンは、カスケードのようにそびえ立ち、その高さを印象付けている。祈りの言葉を口にする間も、瞑想の沈黙のなかで祈る間も、目を癒してくれる。"
 building_citadel_shrine_03: "神聖な彫像"
 building_citadel_shrine_03_desc: "目に見えぬ世界を見つめ、永遠に思いを馳せ続ける数々の彫像は、崇拝者にしばしば深遠な感情を抱かせる。"
 building_citadel_shrine_04: "シンハの彫像"
 building_citadel_shrine_04_desc: "歯をむき出してこちらを睨みつけている獰猛な守護獅子は、$building_type_temple_citadel_01$の住人たちに保護の祝福を与える。"
 building_citadel_shrine_05: "守護神ナーガ"
 building_citadel_shrine_05_desc: "砂岩に丁寧に彫刻され、胸に複雑な曼荼羅が刻まれたこの七つの頭を持つ蛇は、この要塞神殿に住む人々に平和と繁栄をもたらしている。"
 building_citadel_shrine_06: "浅浮き彫り"
 building_citadel_shrine_06_desc: "人々はしばしば立ち止まり、この浅浮彫りの細部をじっくりと眺める。劇的な戦いの場面だけでなく、さまざまな神々の世界や創造神話も描写されているからだ。"
 building_citadel_shrine_07: "聖遺物箱"
 building_citadel_shrine_07_desc: "さまざまな宗教的・儀式用の彫像や品々が収蔵されているこの$building_type_temple_citadel_01$は、ほかのどこよりも豊富な収蔵品を誇っている。"
 building_citadel_shrine_08: "デーヴァラージャ像"
 building_citadel_shrine_08_desc: "威厳に満ちた姿のまま時が止まった神聖な存在は、崇拝者たちが祈りを捧げ、忠誠を誓い、その祝福を受けることを許している。"
 building_type_sacred_pool_01: "聖なる池"
 building_type_sacred_pool_01_desc: "このような広大な水場にはさまざまな用途があるだろう。だが時が経ち、季節が移り変わるにつれて、水面が時折、この世のものとは思えない光景を映し出すことは明らかだ。これらの池は防衛の手段として、また水源として、この地に住む人々の日常生活に欠かせない重要な存在となっている。"
 sacred_pool_01: "蓮池"
 building_sacred_pool_01_desc: "美しさと静けさで見る者を魅了する調和の取れた池。霊的な出来事が起こる場所として知られている。"
 sacred_pool_02: "聖なる貯水池"
 building_sacred_pool_02_desc: "広大な$sacred_pool_02$には、時折野生生物も訪れる。動植物が一体となり、訪れる人に生命の循環を感じさせる。"
 building_sacred_pool_03: "流域"
 building_sacred_pool_03_desc: "奇妙な祭儀や儀式が行われるこの流域は、支配者の栄華を物語っている。"
 building_sacred_pool_04: "堀"
 building_sacred_pool_04_desc: "今や崇拝の場を囲む$building_type_sacred_pool_01$は、潜在的な敵を隔てる要塞の役割を果たし、住民たちにより大きな安心感を与えている。"
 building_sacred_pool_05: "小バライ"
 building_sacred_pool_05_desc: "バライを見守る守護獅子の群れは、その静かな水面を渡ろうとする侵入者を思いとどまらせる。"
 sacred_pool_06: "バライ"
 building_sacred_pool_06_desc: "東から西に伸びる$sacred_pool_06$が見事な光景を作り出している。蛇の彫像が周辺を見張っている。"
 building_sacred_pool_07: "大バライ"
 building_sacred_pool_07_desc: "数々の彫像、咲き誇る花々、そして壮麗な景色がこの雄大な水域を際立たせている。酷暑の時期には涼しい安らぎをもたらす水源となる。"
 building_sacred_pool_08: "聖なるバライ"
 building_sacred_pool_08_desc: "旅行者や訪問者は、この人工池を見てしばしば立ち止まり、その広さに驚嘆する。反対側の岸がほとんど見えないほどの広大さが、神聖な存在とのつながりを感じさせる。"
 building_type_vihara_halls_01: "僧院施設"
 building_type_vihara_halls_01_desc: "雨季に僧侶たちを雨風から守るために建てられた僧院で、静かな瞑想、祈り、休息の場となっている。施設を拡張することで、そこに住む信者の活力と信仰心がさらに高まる。"
 vihara_halls_01: "祈祷所"
 building_vihara_halls_01_desc: "$vihara_halls_01$を加えることで、訪問者に祈りと瞑想の場が提供される。"
 building_vihara_halls_02: "経典図書館"
 building_vihara_halls_02_desc: "ホートライには古代の経典だけでなく、新しい経典も収められている。ここを訪れた信徒たちは、自由に経典を閲覧し、悟りを深めることができる。"
 building_vihara_halls_03: "列柱の礼拝堂"
 building_vihara_halls_03_desc: "これらの礼拝堂には壮大な列柱がそびえ立ち、礼拝に訪れた人々は細密な碑文やさまざまな宗教画を見ることができる。"
 building_vihara_halls_04: "マンダパ"
 building_vihara_halls_04_desc: "柱で支えられた広々とした空間は、公的な儀式やその他の宗教儀式を行うのに最適である。"
 building_vihara_halls_05: "シャラパビリオン"
 building_vihara_halls_05_desc: "緑に囲まれたパビリオンの美しさは、この建造物に宿る精神性に合致している。"
 building_vihara_halls_06: "シーマ石"
 building_vihara_halls_06_desc: "この境界石は、僧侶たちが適切に礼拝を行うために必要な空間の広さと距離を概算する上で、$building_type_vihara_halls_01$の管理者の役に立っている。"
 vihara_halls_07: "鐘楼"
 building_vihara_halls_07_desc: "荘厳な$vihara_halls_07$が$building_type_vihara_halls_01$の頂を飾り、昼間は日光を反射し、夜は遠くでそびえ立っている。"
 building_vihara_halls_08: "大型会館"
 building_vihara_halls_08_desc: "これらの会館の快適性と設備が、遠方から僧侶たちを引き寄せている。集まった僧侶たちは貴重な情報網の中で教えや考えを統合し、近隣地域にまで調和を広めることができる。"
 building_type_itsukushima_jinja_01: "$itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$itsukushima_jinja_01_desc$"
 itsukushima_jinja_01: "厳島神社" #厳島神社
 itsukushima_jinja_01_desc: "6世紀に建立された厳島神社は、神道の海と嵐の女神を祀っている。松島湾に浮かんでいるかのように見える有名な鳥居に向かって、水上に拝殿が立っている。"
 itsukushima_jinja_02: "$itsukushima_jinja_01$"
 itsukushima_jinja_02_desc: "$itsukushima_jinja_01_desc$"
 building_type_heian_palace_01: "$heian_palace_01$"
 building_type_heian_palace_01_desc: "$heian_palace_01_desc$"
 heian_palace_01: "平安宮" #平安宮
 heian_palace_01_desc: "桓武天皇によって平安京の中心地に建設された広大な宮城には、皇居、住居、そして日本の中央官庁が置かれている。回廊は儀式が行われる場であるだけでなく、政治や陰謀が交錯し、古の貴族たちが影響力を争う場にもなっていた。"
 building_type_ise_jingu_01: "$ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$ise_jingu_01_desc$"
 ise_jingu_01: "伊勢神宮" #伊勢神宮
 ise_jingu_01_desc: "伊勢神宮は、太陽の女神「#EMP 天照大御神#!」を祀る、最も神聖な神道の聖地の一つである。この神社には、大和朝廷の宝物である「三種の神器」が納められており、皇族の中から選ばれた斎宮と呼ばれる巫女によって管理されている。"
 building_type_kofuku_ji_01: "$kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$kofuku_ji_01_desc$"
 kofuku_ji_01: "興福寺" #興福寺
 kofuku_ji_01_desc: "7世紀に建てられた興福寺は、奈良の七大寺の一つであり、日本最古かつ最も重要な仏教思想と権力の中心地の一つである。"
 building_type_enryaku_ji_01: "$enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$enryaku_ji_01_desc$"
 enryaku_ji_01: "延暦寺" #延暦寺
 enryaku_ji_01_desc: "延暦寺は8世紀末、$SaichO_$によって創建された。桓武天皇の都、平安京を見下ろすようにして比叡山に鎮座している、日本の天台宗の総本山である。"
 building_type_dazaifu_01: "$dazaifu_01$"
 building_type_dazaifu_01_desc: "$dazaifu_01_desc$"
 dazaifu_01: "大宰府" #興福寺
 dazaifu_01_desc: "太宰府は遠く九州に設置された朝廷の行政拠点である。島の防衛、海外貿易の円滑化、外国要人の接待を目的として設立され、太宰府の長となることは、野心的な官僚にとって出世の足掛かりとなる。"
 building_type_chinjufu_01: "$chinjufu_01$"
 building_type_chinjufu_01_desc: "$chinjufu_01_desc$"
 chinjufu_01: "鎮守府" #鎮守府
 chinjufu_01_desc: "もともと多賀に置かれていた鎮守府は、日本北部の平定を目的とした要塞化された拠点であり、地域の防衛と徴税を管轄する特別司令官によって統括されていた。"
 building_type_hakata_port_01: "$hakata_port_01$"
 building_type_hakata_port_01_desc: "$hakata_port_01_desc$"
 hakata_port_01: "博多港" #博多
 hakata_port_01_desc: "九州北岸の港町である博多は、大和時代の初期から、海の玄関口として機能してきた。太宰府の管轄下に置かれ、活気溢れる交通の要所であった。商人たちが遠く離れた土地から仕入れた商品を売る場でもあり、また外交使節団が日本の地に足を踏み入れる場でもあった。"
 building_hakata_port_02: "$hakata_port_01$"
 building_hakata_port_02_desc: "$hakata_port_01_desc$"
 building_type_hwangnyongsa_01: "$hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$hwangnyongsa_01_desc$"
 hwangnyongsa_01: "ファンニョン寺" #皇龍寺 (황룡사)
 hwangnyongsa_01_desc: "7世紀に完成したファンニョンサ（皇龍寺）は、新羅の真興王が仏教の教義と権力の中心地として建設した広大な寺院で、世界有数の高さを誇る仏塔がある。"
 building_type_white_deer_grotto_academy_01: "$white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$white_deer_grotto_academy_01_desc$"
 white_deer_grotto_academy_01: "白鹿洞書院"
 white_deer_grotto_academy_01_desc: "隠者の李渤によって創立され、白鹿が自由に歩き回るこの学堂は、宋明理学の中心地として栄えた。"
 building_type_shigu_academy_01: "$shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$shigu_academy_01_desc$"
 shigu_academy_01: "石鼓書院"
 shigu_academy_01_desc: "この学堂は湖南の静かな山々に古典を研究する学者たちを集めた。詩と哲学の中心地として、唐の伝統を宋へと継承した。"
 building_type_culai_academy_01: "$culai_academy_01$"
 building_type_culai_academy_01_desc: "$culai_academy_01_desc$"
 culai_academy_01: "徂徠書院"
 culai_academy_01_desc: "学者たちは徂徠の山間に学堂を築き、隠遁して儒教の経典を研究した。その講堂には自然と政治の調和をめぐる議論の声が響き渡った。"
 building_type_lize_academy_01: "$lize_academy_01$"
 building_type_lize_academy_01_desc: "$lize_academy_01_desc$"
 lize_academy_01: "麗澤書院"
 lize_academy_01_desc: "麗澤書院は河北の河川周辺地域に学問を広め、移り変わる国境の中で北方の儒教秩序の砦として機能している。"
 building_type_maoshan_academy_01: "$maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$maoshan_academy_01_desc$"
 maoshan_academy_01: "茅山書院"
