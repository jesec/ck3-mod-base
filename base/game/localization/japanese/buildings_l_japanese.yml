 building_type_ratnapura_mines_01: "ラトゥナプラ鉱山"
 building_type_ratnapura_mines_01_desc: "宝石の都市ラトゥナプラには、世界でも有数のルビーとサファイアの豊富な鉱床がある。数百年に渡ってこうした資源は採掘され、インド亜大陸、東南アジア、中国からやって来た商人と取引されてきた。"
 ratnapura_mines_01: "ラトゥナプラ鉱山採掘ピット"
