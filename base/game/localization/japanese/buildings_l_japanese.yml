 siena_university_desc: "$building_type_siena_university_desc$"
 building_type_nalanda_university: "ナーランダー大学"
 building_type_nalanda_university_desc: "$building_type_generic_university_desc$\n\nナーランダー大学はヴェーダの学問にとって重要な場所であり、チベットや中国など遠い国からも生徒がやって来る。"
