 taghaza_mines_02: "タガザ鉱山"
 taghaza_mines_02_desc: "集落が大きくなるにつれて、塩の採掘量もますます増えている。有能な技師が入ってきたことで真っ当な鉱山の建設が可能となった。"
 taghaza_mines_03: "タガザ大鉱山"
 taghaza_mines_03_desc: "採掘の規模が大きくなるにつれ、鉱山そのものも大きくなっている。入口が増設され、大きなシャフトが掘られたことで深い部分の塩が採れるようになった。"
 taghaza_mines_04: "タガザ鉱区"
 taghaza_mines_04_desc: "塩の生産量が増えたことで、世界中から商人や職人が集まってくるようになった。"
 building_type_ijil_mines_01: "イジル岩塩坑"
 building_type_ijil_mines_01_desc: "イジルはアフリカ最古の岩塩坑の一つであり、そして多くの意味でサハラを跨ぐ貿易網の最初の中継地点でもある。"
 ijil_mines_01: "イジル鉱山採掘ピット"
