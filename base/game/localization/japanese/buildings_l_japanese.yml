 building_type_xiuyan_mines_01_desc: "この古代の採石場は数千年にわたり、この地域に高品質の翡翠を供給してきた。紅山文化の人々は腕輪、道具、象徴的な作品といったさまざまな工芸品を作り出して利用し、その社会的用途と一族の威信を高めた。"
