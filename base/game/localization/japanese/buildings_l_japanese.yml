 building_type_allaq_mines_01: "ワディ・アル・アラク鉱山"
 building_type_allaq_mines_01_desc: "年代記の編集者には単に鉱山の国として知られているだけだが、エジプト東部の砂漠の山地には深い場所に金鉱床がある。この地域の主要拠点はワディ・アル・アラクとその鉱山である。"
