 building_type_hetian_mines_01: "ホータン鉱山"
 building_type_hetian_mines_01_desc: "ホータンは太古の昔からヘティアン翡翠の産地であった。この希少な白い石は、翡翠の中で最も高く評価されており、多くの人々から金や銀よりも価値があると考えられている。翡翠は山から直接採掘されるほか、露天掘りや川底からも直接採掘される。"
 hetian_mines_01: "ホータン鉱山集落"
 hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
 hetian_mines_02: "ホータン鉱山"
 hetian_mines_02_desc: "鉱山集落が成長するにつれて、ますます多くの翡翠が採掘されるようになった。この貴石の評判が高まるにつれて、有能な技術者や商人が次々と流入し、採掘事業の収益が大幅に増加した。"
 hetian_mines_03: "ホータン大鉱山"
 hetian_mines_03_desc: "採掘事業が拡大するにつれて、鉱山自体も拡大する。労働者が増え、翡翠が採掘される場所の交通量も増えた。こうして行き交う人々が今やこの地域の景観の一部となっている。"
 hetian_mines_04: "ホータン鉱山の複合施設"
 hetian_mines_04_desc: "時が経つにつれ、翡翠はこの地域の主要な輸出品であるだけでなく、多くの職人や工芸家の生業の元にもなった。今では工房や販売店が街に立ち並び、産業として成立している。"
 building_type_dushan_mines_01: "独山鉱山"
 building_type_dushan_mines_01_desc: "中国における翡翠の四大産地の一つである独山は、漢時代から翡翠の採掘地であった。ほかの種類の翡翠より色が濃く、色が混ざり合っていることが多い。"
