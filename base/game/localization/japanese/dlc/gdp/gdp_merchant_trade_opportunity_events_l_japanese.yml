l_japanese:
 gdp_merchant_trade_opportunity.0001.t: "競合相手に挑む：[task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "[task_contract_target.GetPrimaryTitle.GetNamePossessive]の存在は、我々にとっては常に悩みの種であり、商機と利益の妨げとなってきた。その中でも[local_market.GetShortName]では、その影響が特に大きい。\n\nこの厄介者たちを何とかしなければならない。我々こそがこの地域の市場の正当な支配者であることを思い知らせる必要がある。"
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "何日も昼夜を問わず、地元の行商人たちに聞き込みを続け、[trade_market.GetShortName]の市場について知りうる限りの情報をかき集めた結果、我々は[target_title.GetNamePossessive]の弱点を突き止めることに成功した。\n\nこれで彼らの人脈を絶ち、要所要所の販売では彼らより安値を、買い付けでは高値を提示することができる。彼らの利益と評判は、すぐに転落するだろう！"
 gdp_merchant_trade_opportunity.0002.a: "誰の縄張りか思い知らせてやろう。"
 gdp_merchant_trade_opportunity.0002.b: "こちらの手の内を明かせば、相手も敬意を示すだろう。"
 gdp_merchant_trade_opportunity.0002.b.tt: "あなたが[friend|E]または[spouse|E]であるか、最低[SCOPE.ScriptValue('high_skill_rating')|V0]の[diplomacy|E]能力が必要であり、険悪な[relation|E]や[house_feuding|E]状態であってはならない。"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "我々は[trade_market.GetShortName]とその周辺における[target_title.GetNamePossessive]の商業網を探ろうとしたが、ほとんど成果を上げられなかった。それどころか、[task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')]での我々自身の評判を落としてしまったようだ。\n\nこの不手際のせいで、[target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]家の地位をかえって強固にしてしまった。彼らの長い交易網には、付け入る隙ひとつ見当たらない…"
 gdp_merchant_trade_opportunity.0003.a: "ああ[ROOT.Char.GetFaith.WealthGodName]よ！これでは我々の利益が削られてしまう！"
 gdp_merchant_trade_opportunity.0011.t: "商品の売り込み：[task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]の賑やかな[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]では、多種多様な品々を取り扱う行商人や交易商人たちが、激しい競争を繰り広げている。\n\n喧騒の中で立ち尽くしていると、絶え間なく行き交う人々と肩がぶつかる。これだけ物が溢れかえっているなかで、我々の商品をいかにして際立たせ、客や店主の目を引くかという問題が、切実なものとして浮かび上がってくる…"
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "[target_title.GetBaseNameNoTierNoTooltip]での[trade_good_type.GetNameNoTooltip|l]の販促活動が実を結んだようだ。我々の「素晴らしい」品を求める者が増え、この地での売り上げも着実に伸びている。\n\n熱心な売り込みと呼び込みが、見事に客の財布のひもを緩められたようだ！"
 gdp_merchant_trade_opportunity.0012.a: "この機会を無駄にはしない。"
 gdp_merchant_trade_opportunity.0012.b: "[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]の匂いがプンプンするぞ！"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "商品の品質を多少誇張してでも客を呼び込もうと、あれこれ手を尽くしてきたが、どうやら思うような効果は得られなかったようだ…\n\n売り上げはむしろ落ち込み、買い手からの信頼が薄れるにつれて、[target_title.GetBaseNameNoTierNoTooltip]全域で[trade_good_type.GetNameNoTooltip|l]の需要も減退してきている。"
 gdp_merchant_trade_opportunity.0013.a: "#EMP 本当に#!最高の[trade_good_type.GetNameNoTooltip|l]なのに！"
 gdp_merchant_trade_opportunity.0021.t: "投資の促進：[local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]を歩いていると、数々の基盤設備の欠陥が浮き彫りになってくる。街路や貯蔵施設の整備不足、加えて[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l]そのものに至るまで、どこを取っても問題だらけだ。\n\nこの地域の統治者たちには、わずかな投資で大きな利益が得られることをわからせなくてはならない。そうでもしない限り、この地での人脈を最大限に活かすには、我々自身が手を下さなければならないだろう…"
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "我々は[target_title.GetAdjectiveNoTooltip]の基盤設備の欠点を挙げ、それを改善することでどのような利益が得られるかを巧みに示し、然るべき人々の関心を引くことができた。\n\n撒いた種が実を結びはじめた。我々の説得に[local_ruler.GetTitledFirstName]は得心したようで、基盤設備の改善が開始される運びとなった。交易量が増大するにつれ、地元の商人や町人たちは早くも我々を称賛しはじめている。"
 gdp_merchant_trade_opportunity.0022.a: "望みを叶えたくば、自ら行動するしかない。"
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "我々は[target_title.GetAdjectiveNoTooltip]の基盤設備がいかに多くの欠点を抱えているか説得を試みたが、その結果は惨憺たるもので、愚か者どもは我々の話に耳を貸しそうもない。\n\n失策に次ぐ失策により、状況は当初とほぼ変わらず、苦労の末に得たものといえば、役人と商人の困惑だけだ。このままでは埒が明かない。我々自身が手を打たない限りは…"
 gdp_merchant_trade_opportunity.0023.a: "交易を滞らせるわけにはいかない。"
 gdp_merchant_trade_opportunity.0023.b: "ここの人間は愚かな者ばかりだ…"
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$：[local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "[local_market.GetShortName]の[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]のあちこちに、不運の痕跡がまざまざと残されている。板が張られた店や放棄された店が、商人たちの流出の後、停滞した交易の流れを如実に物語っている。\n\nだが彼らは学ばねばならない。嘆き、逃げたところで、この状況は変わらない。そして平和が保証されることもない。空席を埋め、この地に秩序をもたらすことが我々の役割のようだ。"
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$：成功"
 gdp_merchant_trade_opportunity.0032.desc: "閉ざされた扉の陰から様子をうかがっていた[target_title.GetBaseNameNoTierNoTooltip]の住民たちは、すぐに我々の目的を理解した。こうして我々は迅速に市場と貯蔵施設を掌握した。\n\nこの改革で不利益を被った者たちも、町に秩序が戻り、交易が徐々に活気を取り戻していくのを前に、その恩恵をしぶしぶ受け入れざるを得なかった。"
 gdp_merchant_trade_opportunity.0032.a: "商売繁盛のためにしたことだ…"
 gdp_merchant_trade_opportunity.0032.b: "ここでやるべきことはやった。"
 every_county_province_custom: "[saved_county.GetName]のすべての$recently_looted_modifier$の[holding|E]"
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$：失敗"
 gdp_merchant_trade_opportunity.0033.desc: "[target_title.GetBaseNameNoTierNoTooltip]で意見を強く主張し、住民をこちらの思惑通りに導こうとした結果、方々から反感を買い、頑なに協力を拒まれることになってしまった。\n\n住民と地元の商人たちは結束して我々に対抗している。我々に支配されるくらいなら、秩序を取り戻し、交易を復興できなくてもいいと思っているのだ！"
 gdp_merchant_trade_opportunity.0033.a: "頑固な愚か者どもめ！"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$：[task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "[local_market.GetShortName]の[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]には数多くの職人集団が根付いており、外部から守られた職人たちが、縄から銀食器に至るまでさまざまな品々を生産し、地元住民や買人の需要を満たしている。\n\n適切な紹介があれば、こうした熟練職人たちの伝手を獲得し、この地の後援者として名を売ることができるかもしれない。それに、有益な技術や流行に関する情報を得られる可能性もある。"
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$：成功"
 gdp_merchant_trade_opportunity.0042.desc: "資金を投じたことにより、[target_title.GetBaseNameNoTierNoTooltip]に実りある人脈を築くことができた。さまざまな職人たちへの資金援助により、彼らは日用品から見事な逸品に至るまで、多種多様な品々の製作に黙々と励んでいる。\n\n後援者として知られるようになったことで、私はどこへ行っても温かく迎えられるようになり、評判の高い職人[inspired_artisan.GetFirstName]から、[inspired_artisan.Custom('InspirationArtisanType')]の製作に出資を頼まれた。"
 gdp_merchant_trade_opportunity.0042.a: "我々の投資は狙いどおりの成果を上げた。"
 gdp_merchant_trade_opportunity.0042.b: "この機会を逃すわけにはいかない！"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$：失敗"
 gdp_merchant_trade_opportunity.0043.desc: "我々は[target_title.GetBaseNameNoTierNoTooltip]の職人の人脈を手に入れようと試みたが、ことごとく拒絶されてしまった。資金援助や我々の関心そのものはしぶしぶ受け入れられたが、ほとんど感謝されることはなかった。\n\n何かの誤解で我々の評判が悪くなったのか、競合相手が何か小細工をしたのか、それとも単に余計な口出しが嫌がられただけなのか。真相は分からないままだろう…"
 gdp_merchant_trade_opportunity.0043.a: "ふん、どうせ大した品もなかったさ…"
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$：[task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]の[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]には金の匂いが満ちており、それは人々の視線や仕草の端々にまで表れている。この地は我々の投資を切望し、甘い展望に抗えない未来の取引相手たちを引き寄せているのだ。\n\n[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]は、与えてくれる人間より、欲しがる人間を探す方がはるかに簡単だ。だが、だからこそ相手は慎重に選ばねばならない。[local_market.GetShortName]の名士や有力者を念頭に釣り糸を垂らすのだ。大物を釣り上げるには、策略と忍耐が必要となる。"
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$：成功"
 gdp_merchant_trade_opportunity.0052.desc: "[target_title.GetBaseNameNoTierNoTooltip]で投資先を募っていることを広く知らせると、ほどなくして一通の妙に丁重な招待状が届いた。その差出人はなんと、[debtor.GetTitledFirstName]だった。\n\nどうやらこの高貴なる[debtor.Custom('LadyLordWomanMan')]は、財政面で多少の「融通」を必要としているらしい。もっとも、私のようなしがない商人が、かくも高名なお方に口を出すなど差し出がましいことだが…"
 gdp_merchant_trade_opportunity.0052.a: "「では、ここの数字を少し調整いたしましょう…#EMP [debtor.GetFirstNameNoTooltip]様。[debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]の[debtor.GetTitleAsNameNoTooltip]様…#!」"
 gdp_merchant_trade_opportunity.0052.b: "「申し訳ございませんが、今はお力になれません」"
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$：失敗"
 gdp_merchant_trade_opportunity.0053.desc: "投資先を募っていることを広く知らせてはみたものの、成果はほとんど得られなかった。我々の寛大な申し出は、[target_title.GetBaseNameNoTierNoTooltip]の有力者たちにきっぱりと断られてしまったのだ。\n\nこちらが立ち回りを誤ったのか、他の商人たちの介入があったのか、あるいはこの地域の有力者たちの懐が珍しく潤っている時期なのか…理由は定かではない。"
 gdp_merchant_trade_opportunity.0053.a: "構うものか。そのうち向こうが這いつくばって頼みにくる。そういうものだ…"
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$：[task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))]の[contract_employer.GetFirstName]が興味深い話を持ってきた。[market_owner.GetName]が[trade_good_type.GetNameNoTooltip|l]を必要としていて、大量に納品できる交易商人を探しているらしい。\n\n[task_contract_target.GetHouse.GetBaseName]商会の[task_contract_target.GetTitledFirstName]は、自分が必ずこの取引をまとめてみせると吹聴している。こちらが策略を巡らせれば、彼らより有利な条件を提示し、身の程を思い知らせてやることができるだろう。"
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$：成功"
 gdp_merchant_trade_opportunity.0062.desc: "[target_title.GetNamePossessive]の交易に巧みに介入したことが功を奏した。入札合戦の日が訪れると、[target_title.GetHolder.GetTitledFirstName]は我々が彼らを差し置いて勝利をさらう様子を、ただ愕然と見ていることしかできなかった。\n\n[target_title.GetNameNoTooltip]の評判は深刻なまでに落ちている。この隙を最大限に活用するのが賢明だろう。"
 gdp_merchant_trade_opportunity.0062.a: "すべて計画通りだ…"
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$：失敗"
 gdp_merchant_trade_opportunity.0063.desc: "策略を巡らせたにもかかわらず、我々は再び[target_title.GetHolder.GetTitledFirstName]に打ち破られた。屈辱だが、[target_title.GetNameNoTier]に完敗したことを認めざるを得ない。\n\n失敗の原因は永遠に分からないかもしれない。我々の慢心が災いしたのか、それとも商才が足りなかったのだろうか？確かなのは、肩を落とし、懐を空にして敗者となったの我々だということだけだ。"
 gdp_merchant_trade_opportunity.0063.a: "次こそは出し抜いてみせる…"
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$：[trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))]である[contract_employer.GetFirstName]が、[trade_good_type.Custom('GetTradeGood')]の積み荷を検分し、[trade_good_type.Custom('GetTradeGoodUnitPlural')]を丹念に調べ、不適切な取り扱いによる欠陥がないか確認し、一つひとつの留め具を確かめている。\n\n商品は必ずしもその真価が発揮されるわけではなく、怠慢や無知によってその価値が無駄にされることもある。最下層の行商人から高名な大商人まで、学ぶべきことは多い。"
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$：成功"
 gdp_merchant_trade_opportunity.0072.desc: "[destination.GetTitle.GetNameNoTierPossessiveNoTooltip]の賑やかな[destination.Custom('GetRegionalMarketTermGloss')]にある[destination.Custom('GetProvinceAdjective')]露店の間を縫い、交渉の囁き声が漏れる商館を行き来するなかで、我々は[trade_good_type.Custom('GetTradeGood')]取引に関する多くの豆知識、噂話、そして秘訣を仕入れた。\n\n[trade_good_type.Custom('GetTradeGoodUnitPlural')]の保管や輸送から、季節ごとの需要や品質の評価に至るまで、我々の得た知識は[local_market.GetName|l]をはじめとする各地での商売に必ずや利益をもたらすだろう。"
 gdp_merchant_trade_opportunity.0072.a: "[trade_good_type.Custom('GetTradeGood')]にこれほど奥深い世界があるとは。"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$：失敗"
 gdp_merchant_trade_opportunity.0073.desc: "[destination.GetTitle.GetNameNoTierPossessiveNoTooltip]の賑やかな[destination.Custom('GetRegionalMarketTermGloss')]の[destination.Custom('GetProvinceAdjective')]露店と、交渉の囁き声が漏れる商館の間を数え切れないほどの日々と果てしなく長い時間を費やして歩き回ったが、[trade_good_type.Custom('GetTradeGood')]取引の極意については、依然として何も収穫はなかった。\n\n口の堅い行商人や冷淡な仲買人たちは、私たちの質問に対して、呆れを含んだ軽蔑や警戒に満ちた沈黙以上の反応をほとんど示さず、共有された情報は些細なものか、あるいは無駄に入り組んだものばかりだった。 "
 gdp_merchant_trade_opportunity.0073.a: "ふん、あいつらの助けなどいらん！"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$：[contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))]である[contract_employer.GetFirstName]は、[market.GetName|l]における[contract_target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]の最近の躍進ぶりを嘆く我々を見て、うんざりした表情を浮かべて天を仰いでいる。\n\n我が商会が取り残されないようにするためには、あの[contract_target.GetTitledFirstName]と、その後ろ盾である[contract_target.GetSuzerain.GetTitledFirstName]に対して、何らかの対策を講じなければならない…"
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$：成功"
 gdp_merchant_trade_opportunity.0082.desc: "我々が仲介業者を執拗に説得し、[target_title.GetDefinitiveName|l]とその忌々しい特許状の悪評を流し続けた甲斐あって、今や多くの者が[target_title.GetHolder.GetTitledFirstNamePossessive]の言葉を鵜呑みにする前に、一考するようになった。\n\n[target_title.GetHolder.GetTitledFirstNamePossessive]の書類に押された[target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive]の印章の信憑性さえも、今や疑われる始末である。この噂は[target_title.GetHolder.GetTitledFirstName]にとっても、その宗主にとっても決して喜ばしいものではないだろう。"
 gdp_merchant_trade_opportunity.0082.a: "奴らの書類など[ROOT.Char.GetRite.NegativeAfterLife]へ放り投げてしまえ！"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$：失敗"
 gdp_merchant_trade_opportunity.0083.desc: "忌々しい[target_title.GetDefinitiveName|l]の手先どもを妨害すべく、たゆまず人脈を築き、陰謀を張り巡らせてきたが、すべてが無駄に終わった。[target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive]自身の印章が押された特許状を前に、我々の働きかけになびく者はほとんどいなかったのだ。\n\n[target_title.GetHolder.GetTitledFirstNamePossessive]の名声は相変わらず傷一つなく、このような低俗な手段に手を染めたことで、我々は自らの名に泥を塗る結果となっただけだった…"
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName]は、依然として[target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]に微笑みかけている…"
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$：[local_market.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0091.desc: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]である[associate.GetFirstName]と共に曇天の[destination.Custom('GetRegionalMarketTermGloss')]を歩き回っていると、戦争と飢饉の気まぐれによってもたらされた[destination.GetBaronyNameExplicitlyNoTooltip]の悲惨な状況が、はっきりと見て取れる。\n\n未亡人、孤児、身体の不自由な者など、身寄りのない乞食たちが路地に溢れかえり、人影のない露店の上には、暗雲が重なるかのように破滅の陰が立ち込めている。"
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$：成功"
 gdp_merchant_trade_opportunity.0092.desc: "この地域のあちこちを巡った末、私たちは地元の行商人や職人たちを見つけ出すことに成功した。そして、"
 gdp_merchant_trade_opportunity.0092.war: "戦争による荒廃"
 gdp_merchant_trade_opportunity.0092.disaster: "災厄の足音"
 gdp_merchant_trade_opportunity.0092.epidemic: "最近の疫病の流行"
 gdp_merchant_trade_opportunity.0092.closing: "にもかかわらず商売を続けている彼らの帳簿に、いくらかの活力を取り戻すこともできた。ささやかではあるが、あらゆる努力が助けとなる。\n\n日を追うごとに、[destination.GetBaronyNameExplicitlyNoTooltip]の[destination.Custom('GetRegionalMarketTermGloss')]には少しずつ多くの声が響き渡るようになり、その露店では少しずつ多くの商品が輝きを放ち、宿屋には少しずつ多くの旅人たちが集まるようになっていく。"
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip]は間もなく再び繁栄を取り戻すだろう。"
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$：失敗"
 gdp_merchant_trade_opportunity.0093.desc: "我々は[destination.GetBaronyNameExplicitlyNoTooltip]の隅々まで巡り、有効に金を活かせる者たちに出資して、この地の商業の命脈を蘇らせようと機会を探ったが、ほとんどは徒労に終わった。\n\n見つかるのは我々の寛大さなど到底値しない単なる利己的な者か、あるいは何の役にも立たない連中ばかりだ。相次ぐ挫折を前に楽観を保つことは難しく、我々は絶望と焦燥に沈んでいく。"
 gdp_merchant_trade_opportunity.0093.a: "我々にできることは、もはや何もない…"
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetFirstName]と私は、[destination.GetTitle.GetNameNoTierPossessive]の大[destination.Custom('GetRegionalMarketTermGloss')]に並ぶ露店を見つめ、その賑わいに圧倒されて立ち尽くす。ここでは、交易の流れは抽象的なものではない。足元の[ROOT.Char.Custom('GroundType')]と同じくらい、はっきりと実感できるものだ。\n\n 我々と同じように取引に励む商人たちであふれるこの場所なら、利益も、人々からの引き立ても得られるはずだ。"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$：成功"
 gdp_merchant_trade_opportunity.0102.desc: "この数週間は移動に次ぐ移動だった。会合を求め、あるいは人脈を探して[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]中を駆け回った結果、持ち前の交渉術と、それを上回る商売の勘を活かすことで現地の仲買人や卸との間で確かな合意書を取り交わすことができた。\n\n我々の努力は間違いなく実を結んだ。この成果は来季に向けて有益なものとなるだろう。"
 gdp_merchant_trade_opportunity.0102.a: "蒔いた種の実を結ばんことを！"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$：失敗"
 gdp_merchant_trade_opportunity.0103.desc: "会合を求め、あるいは人脈を探して毎日[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]中を駆け回り、現地の仲買人や卸と関係を築くために人事を尽くしたが、結果としては何一つ成果を得られないままに終わった。\n\n来季は困難な経営を強いられるのは間違いないだろう…"
 gdp_merchant_trade_opportunity.0103.a: "ああ、[ROOT.Char.GetRite.WealthGodName]よ…"
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$：成功"
 gdp_merchant_trade_opportunity.0112.desc: "我々は労力を惜しまずに働き、[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の都市全体に網を張り巡らせて、貸しを作ったり賄賂を渡したりする相手を探し求めた。ほどなく、好条件の競りや合意によって望みの結果を得ることができ、流通路の安全を確保することができた。\n\n苦労の甲斐もあって物資の安定供給は保証され、しかもそれがしばらくは続く。これで安心して過ごせるというものだ。"
 gdp_merchant_trade_opportunity.0112.a: "[ROOT.Char.GetRite.WealthGodName]が我らに微笑みかけているのだ！"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$：失敗"
 gdp_merchant_trade_opportunity.0113.desc: "我々は労力を惜しまずに働き、[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の都市全体に網を張り巡らせて、貸しを作ったり賄賂を渡したりする相手を探し求めた。だが、その苦労も水泡に帰した。我々は商業という荒波に降る雨粒のごとく飲み込まれてしまったのだ。\n\n必要な分量を満たせるだけの隊商枠を確保する手段がないことは間違いなく、当面の間状況は変わらないだろう…"
 gdp_merchant_trade_opportunity.0113.a: "隊商を持たずして何が交易商か…"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetFirstName]と私は、[destination.GetBaronyNameExplicitly]にある中継貿易地を歩いている。あらゆる分野の交易商人たちが行き交い、どことも知れぬはるか遠方の地へと商品を運ぶ売買と物流の拠点である。\n\nここでは数多くの商品が次々とその持ち主を変える。商人の運命を分かつのは、大口取引による価格交渉である…"
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$：成功"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nどうにかこうにか、我々は真っ当な約束手形の束を抱えて毒蛇の巣から無傷で抜け出すことに成功した。これで来季は[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]において[trade_good_type.Custom('GetTradeGood')]の[trade_good_type.Custom('GetTradeGoodUnitPlural')]を、競争力のある価格で売り出せるのは間違いない！"
 gdp_merchant_trade_opportunity.0122.intro: "ここ数日は、果てしない値切りや言い争い、駆け引きの連続で、目まぐるしく過ぎ去っていった。競売場に売買価格を叫ぶ怒号が飛び交うなか、私はまくし立てる口元や悔しさに歯ぎしりする人々にせわしなく視線を巡らせていた。[ROOT.Char.Custom('GroundType')]には、用済みになった伝票や殴り書きの紙くずが散らばり、ここで幾多の財産が失われたことを物語っている。"
 gdp_merchant_trade_opportunity.0122.a: "まさに買い手市場だ！"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$：失敗"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n我々はほうほうの体で毒蛇の巣から抜け出したが、目的であった堅実な販売価格で[trade_good_type.Custom('GetTradeGood')]を確保できず、競合には競り負ける結果となった…"
 gdp_merchant_trade_opportunity.0123.a: "これは売り手市場だ…"
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$：成功"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nどうにかこうにか、我々は真っ当な約束手形の束を抱えて毒蛇の巣から無傷で抜け出すことに成功した。これで来季は[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]において[trade_good_type.Custom('GetTradeGood')]の[trade_good_type.Custom('GetTradeGoodUnitPlural')]を、競争力のある価格で買い付けられるのは間違いない！"
 gdp_merchant_trade_opportunity.0132.a: "まさに売り手市場だ！"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$：失敗"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n我々はほうほうの体で毒蛇の巣から抜け出したが、目的であった堅実な購入価格で[trade_good_type.Custom('GetTradeGood')]を確保できず、競合には競り負ける結果となった…"
 gdp_merchant_trade_opportunity.0133.a: "これは買い手市場だ…"
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$：[task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "治安の維持者にして法の擁護者たる[task_contract_target.GetTitledFirstName]が、[local_market.GetName|l]における売上の一部を受け取るのはある意味ではもっともなことだ。\n\nしかしながら、交渉の余地は#EMP 常に#!存在する。我々の持つ交易路の価値を[task_contract_target.GetHerHim]に認めさせ、[task_contract_target.GetSheHe]が憐れな我々の背に負わせている重荷について説明すれば良いだけなのである…"
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$：成功"
 gdp_merchant_trade_opportunity.0142.desc: "[task_contract_target.GetTitledFirstName]の館では、懐柔、ごますり、説得を続ける日々が長く続いた。作り笑顔のせいで頬が今もひきつっているが、努力は無駄ではなかった。\n\n我々は税率の引き下げを勝ち取り、当面の間は利益率の向上を確保できることとなった。"
 gdp_merchant_trade_opportunity.0142.a: "これも商売繁盛のためだ。"
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$：失敗"
 gdp_merchant_trade_opportunity.0143.desc: "[task_contract_target.GetTitledFirstName]の館では、懐柔、ごますり、説得を続ける日々が長く続いた。作り笑顔のせいで頬が今もひきつり、脚が棒のようになるまで立ち続けたが、何の成果も得ることなく引き下がざるを得ない結果となった…\n\n本日、我々は謁見を待っていた。そこに[target.GetTitleAsNamePossessiveNoTooltip]の近侍が現れ、急を要する要件があるため、残念ながら力にはなれないと取り澄ました顔で告げてきたのであった…"
 gdp_merchant_trade_opportunity.0143.a: "御しやすそうな人物だと思っていたのに…"
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "[local_market.GetName|l]の代理人や徴税人どもが我が物顔で歩き回っている。この連中は、[associate.GetFirstName]や私のような善良な商人が真っ当な商いで得た稼ぎを巻き上げ、その[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]を詰めた袋を腰の両脇にぶら下げ、じゃらじゃらと鳴らしながら、私たちをせせら笑っているのだ…\n\nこの地では[owner.GetTitledFirstNamePossessive]が課す税が商売の大きな妨げとなっている。その強欲さのせいで、我々は不正な商売に手を染めざるを得なくなった。"
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$：成功"
 gdp_merchant_trade_opportunity.0152.desc: "多大な苦労を経て、我々は地元の裏稼業の者たちと良好な関係を築き、[trade_market.GetName|l]から商品を運び出す際の頼れる#EMP 代替#!経路を確保した。\n\n木箱が一つ、また一つと間抜けな衛兵たちの鼻の先を通過するたび、脱税で浮いた金は瞬く間に積みあがっていくことだろう…"
 gdp_merchant_trade_opportunity.0152.a: "#EMP 我々#!の懐に入るべき金だからな。"
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$：失敗"
 gdp_merchant_trade_opportunity.0153.desc: "[trade_market.GetName|l]に密輸の網を張り巡らそうという試みは、工作員の無能さ、地元当局の警戒、そして地元の裏稼業の者たちの裏切りによってそのことごとくが打ち砕かれてしまった…\n\nもはや税を納めるほかに選択肢はなく、これまでの苦労はすべて、誠実な仲買人という我々の評判に泥を塗っただけに終わった。"
 gdp_merchant_trade_opportunity.0153.a: "おとなしく税金を支払っておけばよかった…"
 gdp_merchant_trade_opportunity.1001.t: "根回し"
 gdp_merchant_trade_opportunity.1001.desc: "[task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip]の人々が、最近になって妙によそよそしい態度を取るようになった。調べたところ、原因は統治者の[local_ruler.GetTitledFirstName]であることが判明した。\n\n案の定、ほどなくして当の本人から伝言が届いた。[local_ruler.GetHerHis]の領地における事業について、ぜひとも「#EMP その旨味を共に味わいたい#!」というのだ…"
 gdp_merchant_trade_opportunity.1001.a: "はあ。分け前の[local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]を渡しておけ…"
 gdp_merchant_trade_opportunity.1001.b: "#EMP 高名な#!方なら、こちらの事情もご理解くださるはずだ。"
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip]が満足する"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip]の機嫌を損ねる"
 gdp_merchant_trade_opportunity.1001.c: "「そういえば、[other_merchant.GetPrimaryTitle.GetNameNoTooltip|l]は#EMP 本当に#!やりたい放題でしてね」"
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip]が食いつく"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip]が不快感を示す"
 gdp_merchant_trade_opportunity.1001.d: "ふん、何とかなるさ。"
 gdp_merchant_trade_opportunity.1011.t: "持ちつ持たれつ"
 gdp_merchant_trade_opportunity.1011.desc: "我々の[local_market.GetShortName]での活動が、当地の統治者である[local_ruler.GetTitledFirstName]の目に留まったらしく、商会は私的な謁見の場に招かれた。\n\n私が[local_ruler.GetTitleAsNameNoTooltip]の前に進み出ると、[local_ruler.GetHerHim]は微笑んだ。「交易は大きな利益をもたらす。民にも、貴族にも、[local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]のすべての者にもだ！困り事があるなら話してみるがよい。できる限り力になろう」"
 gdp_merchant_trade_opportunity.1011.a: "#weak *ごほん*#!「交易路が#EMP 大変#!厳しい状況でして…」"
 gdp_merchant_trade_opportunity.1011.b: "「当地の[task_contract_location.Custom('GetRegionalMarketTerm')|l]について、いくつか提案があります」"
 gdp_merchant_trade_opportunity.1011.b.good: "あなたの助言は的確である"
 gdp_merchant_trade_opportunity.1011.b.bad: "あなたの助言は役に立たない"
 gdp_merchant_trade_opportunity.1011.c: "「[other_merchant.GetPrimaryTitle.GetNameNoTooltip]のせいで苦戦しております」"
 gdp_merchant_trade_opportunity.1011.c.fallback: "「競争が激しくて苦戦しています」"
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip]があなたを支持する"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip]が[other_merchant.GetHouse.GetNameNoTooltip]を支持する"
 gdp_merchant_trade_opportunity.1011.c.flavor: "[diplomacy_i|E] [diplomacy|E]能力と[opinion_i|E] [opinion|E]に基づく人気勝負"
 gdp_merchant_trade_opportunity.1011.d: "「偉大なる[local_ruler.GetTitleAsNameNoTooltip]よ。あなたと、その慈悲深き統治に祝福がありますように」"
 gdp_merchant_trade_opportunity.1021.t: "共通の敵"
 gdp_merchant_trade_opportunity.1021.desc: "[target.GetPrimaryTitle.GetName]のならず者どもの対応に追われていた私は、不意に[other_merchant.GetPrimaryTitle.GetName]の[other_merchant.GetTitledFirstName]に声をかけられて面食らった。[other_merchant.GetSheHe]は[local_market.GetShortName]の[task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]で互いにしのぎを削る同業者だ。\n\n「お会いできて光栄です、[ROOT.Char.GetTitledFirstNameNoTooltip]」[other_merchant.GetSheHe]はそう切り出した。「あなたが[target.GetHouse.GetNameNoTooltip]の食わせ者、[target.GetTitledFirstName]に手を焼いていると聞きましてね。ここは互いに協力しませんか？」"
 gdp_merchant_trade_opportunity.1021.a: "「いいだろう！こちらに考えがある…」"
 gdp_merchant_trade_opportunity.1021.b: "「どうして信用できると？」"
 gdp_merchant_trade_opportunity.1021.b.good: "手を結ぶ"
 gdp_merchant_trade_opportunity.1021.b.bad: "殴り合いになる"
 gdp_merchant_trade_opportunity.1021.c: "「力を合わせれば、連中をかなり追い込めるはずだ」"
 gdp_merchant_trade_opportunity.1021.d: "「断る！[other_merchant.GetHouse.GetNameNoTooltip]の人間は、連中より信用ならない！」"
 gdp_merchant_trade_opportunity.1031.t: "企業秘密"
 gdp_merchant_trade_opportunity.1031.desc: "[task_contract_location.GetBaronyNameExplicitlyNoTooltip]で商会の帳簿を精査していると、数枚の書類がひらりと落ちてしまった。拾い集めて振り返ると、[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetFirstName]が、どこか気まずそうな表情を浮かべている。\n\n書類に目を通した私は、思わず眉を上げた。[associate.GetFirstNameNoTooltip]が動揺している理由が分かったからだ。[associate.GetSheHe]はこの地での事業に関わる重要な情報を、ずっと隠していたのだ！これはただの腹いせだろうか？"
 gdp_merchant_trade_opportunity.1031.a: "「くそっ、[associate.GetFirstNameNoTooltip]！お前は一体誰の味方なんだ？」"
 gdp_merchant_trade_opportunity.1031.b: "「話してみろ。何が不満だ？」"
 gdp_merchant_trade_opportunity.1031.c: "「#EMP 出て行け！#!お前はもう、この商会にはいらん！」"
 gdp_merchant_trade_opportunity.1041.t: "一族の総力"
 gdp_merchant_trade_opportunity.1041.desc: "商会の士気は高く、[task_contract_location.GetBaronyNameExplicitlyNoTooltip]での最近の成功談があちこちで語られている。そのいずれも、偶然にも[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]である[associate.GetFirstName]が導いたものだった。\n\n[associate.GetHerHis|U]は真の商才を持つ天才として盛んに称賛されている。しかし実際には、どの事業の成功も、[ROOT.Char.GetHouse.GetNameNoTooltip]家の人脈を通じて、多くの者たちが力を尽くした結果成し遂げられたものだ。"
 gdp_merchant_trade_opportunity.1041.a: "よくやった、[associate.GetFirstNameNoTooltip]！"
 gdp_merchant_trade_opportunity.1041.b: "どうやら、まだ働かせ足りなかったようだな。"
 gdp_merchant_trade_opportunity.1041.c: "見事な働きだ。皆の模範と言えるだろう！"
 gdp_merchant_trade_opportunity.1051.t: "和解の申し出"
 gdp_merchant_trade_opportunity.1051.desc: "[task_contract_location.Custom('GetRegionalMarketTermGloss')]を歩いていると、競合相手である[target.GetPrimaryTitle.GetName]の[target.GetTitledFirstName]当人が突然目の前に現れた！とはいえ、[target.GetHerHis]が思いのほか低姿勢だったことに、私は少々面食らった。\n\n「率直に話しましょう、[ROOT.Char.GetTitledFirstNameNoTooltip]」[target.GetSheHe]はため息交じりに切り出した。「この地では我々の利害が真っ向から対立していて、角を突き合わせても良い結果は得られません。ここはどうか手を引いて頂きたい。 "
 gdp_merchant_trade_opportunity.1051.desc.gold: "その償いとして、こちらは金をお支払いします」"
 gdp_merchant_trade_opportunity.1051.desc.luxury: "手を引いてくださるなら、遠い異国で手に入る素晴らしい品についての情報を教えましょう」"
 gdp_merchant_trade_opportunity.1051.a: "「もっともだな。ではそうするとしよう」"
 gdp_merchant_trade_opportunity.1051.b: "「悪くない話だ…詳しく話し合うとしよう」"
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip]が受け入れる"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip]が拒否する"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName]があなたを称える[GetActivityType('activity_feast').GetName]の[activity|E]を催す"
 gdp_merchant_trade_opportunity.1052.t: "宴が無効になる"
 trade_opportunity_gain_luxury_contract_tt: "[luxury_contract|E]を受け取る"
 gdp_merchant_trade_opportunity.1051.d: "「はっ、#EMP よほど#!経営が苦しいと見えるな！その手には乗らん」"
 gdp_merchant_trade_opportunity.1061.t: "人手不足"
 gdp_merchant_trade_opportunity.1061.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetTitledFirstName]が不満を漏らしている。[task_contract_location.GetBaronyNameExplicitlyNoTooltip]での事業に注力するあまり、[task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]の日々の運営が追いつかなくなってきていると言うのだ。\n\n「どこかで折り合いをつけなければなりません、[ROOT.Char.GetTitleAsNameNoTooltip]。このままでは手が回らなくなります。商会の人手も時間も足りないのです」"
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]は困難に怯んだりしない！"
 gdp_merchant_trade_opportunity.1061.a.good: "すべて順調に進む"
 gdp_merchant_trade_opportunity.1061.a.bad: "あなたは無理をしすぎる"
 gdp_merchant_trade_opportunity.1061.b: "私の目の黒いうちは利益は落とさせない。"
 gdp_merchant_trade_opportunity.1061.already_tt: "獲得済み：[associate.GetShortUIName]の[stress|E]#N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#!、[scheme|E]の[scheme_opportunity_i|E] [scheme_opportunity_opportunity|E]#P +1#!"
 gdp_merchant_trade_opportunity.1071.t: "苦境"
 gdp_merchant_trade_opportunity.1071.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetTitledFirstName]が、落ち着きなく歩き回っている。まとわりつくハエにも苛立ちを募らせているようだ。「まったく！」[associate.GetSheHe]はうめくように言った。「ご覧ください、[ROOT.Char.GetTitleAsNameNoTooltip]。[task_contract_location.GetBaronyNameExplicitlyNoTooltip]で進めている事業のせいで、人員も資金も限界に近いのです！」\n\n帳簿や伝票をよく見てみると、[associate.GetHerHim]に反論するのは難しい状態だった。[associate.GetSheHe|U]はため息をついて言った。「どこかで妥協するしかありません。このままでは運営が破綻します…」"
 gdp_merchant_trade_opportunity.1071.a: "我々が専念すべき目標は一つだ。"
 gdp_merchant_trade_opportunity.1071.d: "あとは私に任せて、自分の仕事に集中しろ。"
 gdp_merchant_trade_opportunity.1081.t: "確かな手腕"
 gdp_merchant_trade_opportunity.1081.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetTitledFirstName]が、[task_contract_location.GetBaronyNameExplicitlyNoTooltip]で進めている事業の実務の大半を取り仕切っているが、その手腕は見事なものだ！[associate.GetFirstName]は有能な商人に欠かせない注意深さと資質を備えている。\n\nここで事業を始めてから、私は帳簿を確認したり、指示通りに進んでいるか確認したりする必要がほとんどなくなった。"
 gdp_merchant_trade_opportunity.1081.a: "その調子で頼むぞ、[associate.GetFirstNameNoTooltip]！"
 gdp_merchant_trade_opportunity.1081.b: "このような働きには報いるべきだ。"
 gdp_merchant_trade_opportunity.1081.c: "商会の者は皆、この姿勢を見習うべきだ！"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip]が模範となる"
 gdp_merchant_trade_opportunity.1081.c.trigger: "ほかの[associate|E]の[stewardship|E]が[stewardship_i|E] [EmptyScope.ScriptValue('medium_skill_rating')|V0]未満である"
 gdp_merchant_trade_opportunity.1081.c.tt: "別の[associate_possessive|E]の[stewardship|E]が[stewardship_i|E]#P 1#!上昇する"
 gdp_merchant_trade_opportunity.1081.d: "[ROOT.Char.GetHouse.GetNameNoTooltip]家の者が優秀なのは当然だ。"
 gdp_merchant_trade_opportunity.1091.t: "頼りない商会員"
 gdp_merchant_trade_opportunity.1091.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetTitledFirstName]に、[task_contract_location.GetBaronyNameExplicitlyNoTooltip]で進めている事業を任せていたのだが、今となっては後悔しはじめている…\n\n私は毎日のように、帳簿に計算間違いを見つけ、連絡を怠って取引先を無駄に待たせたせいで苦情を聞かされる羽目になっている。こんな杜撰なやり方では仕事にならない！"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip]、帳簿を見直そう。"
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip]が少しは学ぶ"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip]は救いようがない"
 gdp_merchant_trade_opportunity.1091.c: "商会が尻拭いをするしかあるまい。"
 gdp_merchant_trade_opportunity.1091.d: "[associate.GetSheHe|U]なりに頑張ってはいるのだろう。"
 gdp_merchant_trade_opportunity.1101.t: "資金集め"
 gdp_merchant_trade_opportunity.1101.desc: "貸し付けは、[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]を余らせていて、なおかつ好機をじっと待つ忍耐のある者にとっての冒険的な事業である。さて、とある熱心な投資家が[task_contract_location.GetBaronyNameExplicitlyNoTooltip]で会いたいと持ち掛けてきた。\n\nそこで私は、"
 gdp_merchant_trade_opportunity.1101.ruler: "[investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]を治める領主、[investor.GetTitledFirstName]の出迎えを受けた。"
 gdp_merchant_trade_opportunity.1101.courtier: "貴族の廷臣、[investor.GetTitledFirstName]の出迎えを受けた。"
 gdp_merchant_trade_opportunity.1101.adventurer: "従者を大勢引き連れた世慣れた人物、[investor.GetTitledFirstName]の出迎えを受けた。"
 gdp_merchant_trade_opportunity.1101.fallback: "これといった後ろ盾を持たない[investor.GetWomanMan]、[investor.GetTitledFirstName]の出迎えを受けた。"
 gdp_merchant_trade_opportunity.1101.end: "「[ROOT.Char.GetTitledFirstNameNoTooltip]殿、お会いできて光栄です！」と、[investor.GetSheHe|U]は身を乗り出して微笑む。「ぜひ私を、[ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip|l]の後援者としていただきたい。見返りは何かって？まあ、それはおいおい話をするとしましょう」"
 gdp_merchant_trade_opportunity.1101.a: "我々を信頼していただいて結構ですよ、[investor.GetFirstNameNoTooltip]。"
 gdp_merchant_trade_opportunity.1101.c: "あと少しご出資いただければ大きな助けになります。名誉にかけてお約束しましょう。"
 gdp_merchant_trade_opportunity.1101.d: "ありがたいお話ですが、今は規模を抑えて運営しておりますので。"
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName]は#V 5#!年後に[gold_i|E] [interest|0V]（#M 利率20%#!）の支払いを求める"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "いよいよ、そちらの商会に投資した成果を受け取る時が来ました。\n\n約束の[investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]を受け取れる日を心待ちにしていますよ。"
 gdp_merchant_trade_opportunity.1102.a: "いいでしょう。有意義にお使いください。"
 gdp_merchant_trade_opportunity.1102.b: "ええと、その…実は最近、事業があまり振るいませんで…"
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip]があなたの言い訳を受け入れる"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip]が不審に思う"
 gdp_merchant_trade_opportunity.1102.d: "あなたからの出資は受けてはいませんので、話は終わりですね。"
 gdp_merchant_trade_opportunity.9000.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]での急ぎの仕事"
 gdp_merchant_trade_opportunity.9000.desc: "ひとまず一件落着したが、ここ[ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l]には、ほかにも片付けるべき仕事が残っている。\n\n[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]へ戻る前に、[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の用事を済ませておこうか？"
 gdp_merchant_trade_opportunity.9000.a: "この件は誰かに対応させよう。"
 gdp_merchant_trade_opportunity.9000.b: "これは我々で片付けよう。"
 gdp_merchant_trade_opportunity.9000.c: "この件は私が引き受けよう。"
 gdp_merchant_trade_opportunity.9000.d: "いや、[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]へ戻らねば。"
 gdp_merchant_trade_opportunity.9000.accept_tt: "[THIS.TaskContract.GetEmployer.GetUINamePossessive]の[trade_opportunity_tier_tier|E][THIS.TaskContract.GetTaskContractTierValue|V]の[trade_opportunity|E]「[THIS.TaskContract.GetType.GetName|V]」を受諾し、[THIS.TaskContract.GetLocation.GetBaronyNameExplicitly]で開始する"
 gdp_merchant_trade_opportunity.9010.t: "交易機会：[task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "重要な商会の仕事が、[task_contract_location.GetBaronyNameExplicitly]で私を待っている。"
 gdp_merchant_trade_opportunity.9010.intro: "重要な商会の仕事が、ここ[task_contract_location.GetBaronyNameExplicitly]で私を待っている。"
 gdp_merchant_trade_opportunity.9010.desc: "私が戻るまで、仕事は商会員に任せるしかない。\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]の[partner.GetFirstName]になら、この件を任せておいてもいいだろう。その間に私は別の用事を片付けられる。"
 gdp_merchant_trade_opportunity.9010.partner_busy: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]の[partner.GetFirstName]は今、手が離せない。やはり私が対応するしかないか…"
 gdp_merchant_trade_opportunity.9010.candidate: "この重要な仕事を任せられる者が見つからない限り、自分で対応するしかない。"
 gdp_merchant_trade_opportunity.9010.no_partner: "この重要な仕事を任せられる者がいない以上、自分で対応するしかない。"
 gdp_merchant_trade_opportunity.9010.a: "ぐずぐずしている暇はない。"
 gdp_merchant_trade_opportunity.9010.c: "よし、[partner.GetFirstNameNoTooltip]に任せよう。"
 gdp_merchant_trade_opportunity.9010.c.no_partner: "共同経営者に任せよう。"
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUIName]はすでにこの[trade_opportunity|E]に関わっている"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "共同経営者は別の[trade_opportunity|E]への対応で手が離せない"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "[trade_opportunity|E]「[task_contract.GetType.GetName|V]」を担当している"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M [task_contract|E]が完了するまで利用できません#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M 成功率は[THIS.Char.GetHerHis]の[aptitude|E]（[THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )]）に基づきます#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon! #X [THIS.Char.GetSheHe]が[GetCourtPositionType('partner_court_position').GetName]でなくなると契約は失敗します#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "[THIS.Char.GetShortUIName|U]を[task_contract_location.GetBaronyNameExplicitly]の[trade_opportunity|E]「[task_contract.GetType.GetName]」の担当者に任命した"
 gdp_merchant_trade_opportunity.9010.d: "[candidate.GetFirstNameNoTooltip]なら任せられるかもしれない。"
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "誰か任せられる者がいるかもしれない。"
 gdp_merchant_trade_opportunity.9010.d.tt: "次の条件を満たす[associates|E]がいる：\n$EFFECT_LIST_BULLET$[traders|E]ではない\n$EFFECT_LIST_BULLET$[GetCourtPositionType('partner_court_position').GetName]になれる"
 gdp_merchant_trade_opportunity.9010.e: "やめておこう。他に優先すべき仕事がある。"
 gdp_merchant_trade_opportunity.9010.e.tt: "[task_contract|E]は破棄される"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "ただちに[task_contract_location.GetBaronyNameExplicitly]への[traveling|E]に出立する"
 gdp_merchant_trade_opportunity.9010.tt.start: "ただちに[task_contract|E]を開始する"
 gdp_merchant_trade_opportunity.9020.t: "交易機会：[task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9020.intro: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]の[partner.GetFirstName]が、成果を報告すべく、ようやく[task_contract_location.GetBaronyNameExplicitly]から戻ってきた。\n\n"
 gdp_merchant_trade_opportunity.9020.success: "[partner.GetSheHe|U]は、さまざまな困難に見舞われながらも、仕事を見事にやり遂げ、商会にも[partner.GetHerHis]自身にも利益をもたらしたと嬉しげに語った…"
 gdp_merchant_trade_opportunity.9020.failure: "[partner.GetSheHe|U]は、この仕事がいかに困難だったかを少し気まずそうに語った。そして、懸命に尽くしたものの、商会は痛手を被ってしまったと説明した…"
 gdp_merchant_trade_opportunity.9020.a.success: "よくやった、[partner.GetFirstNameNoTooltip]。"
 gdp_merchant_trade_opportunity.9020.a.failure: "私が対応すべきだった…"
 gdp_merchant_trade_opportunity.9050.t: "失われた機会"
 gdp_merchant_trade_opportunity.9050.desc_opening: "有望な商機は失われてしまった。\n\n旅の目的だった[trade_destination.GetBaronyNameExplicitlyNoTooltip]での交易機会は、失われてしまった。"
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\n残る問題は、この縁起の悪い旅を続ける意味がまだあるのかどうかだけだ。"
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "この交易機会を支えていた交易路が、もはや存在しない。"
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]は、もはや[trade_opportunity_route.GetName]上に存在しない。"
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "[trade_opportunity_route.GetName]には、この機会に必要な交易担当者がもういない。"
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "どうやら、[trade_opportunity_route.GetName]の混乱は収束したようだ。"
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "もはや職人を名乗っていない以上、職人として商売を続けるのは筋違いだ。"
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "もはや金貸しを名乗っていない以上、金貸しとして商売を続けるのは筋違いだ。"
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "行き交う商人たちの話によれば、我々の競合商会は姿を消したらしい。"
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "どうやら、目的地にある中継地は、もはや我々には利用できないようだ。"
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "当初支払うはずだった市場税も、今では支払わずに済んでいる。"
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "状況が変わりやすいことを考えれば当然だが、シルクロードは我々が旅を始めたころとは様変わりしており、その流れに介入する機会も失われた。"
 gdp_merchant_trade_opportunity.9050.reason_unknown: "現時点では、何が変わったのかはっきりしない。"
 gdp_merchant_trade_opportunity.9050.a: "ここでできることは、もう何もない。"
 gdp_merchant_trade_opportunity.9050.b: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]に何があるのか、見てみよう。"
 gdp_merchant_trade_opportunity.9050.b.tt: "旅を続け、#weak [trade_destination.GetBaronyNameExplicitly]を訪問する#!"
 gdp_merchant_trade_opportunity.9050.toast: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]での交易機会を失った"
 gdp_merchant_trade_opportunity.9050.toast_route_destroyed: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]への交易路が失われた"
 gdp_merchant_trade_opportunity.9050.toast_desc_route_destroyed: "この[trade_opportunity|E]の[trade_route|E]は、もはや存在しない"
 gdp_merchant_trade_opportunity.9050.toast_desc_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]は、もう[trade_opportunity_route.GetName]上の[market|E]ではない"
 gdp_merchant_trade_opportunity.9050.toast_desc_trader_changed: "[trade_opportunity_route.GetName]から[trader|E]がいなくなった"
 gdp_merchant_trade_opportunity.9050.toast_desc_upheaval_ended: "[trade_opportunity_route.GetName]は、もう混乱に見舞われている[market|E]を通らない"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_artisan: "あなたの[company|E]は、もう[GetLaw('company_purpose_artisan').GetName]の[company_purpose|E]を持っていない"
