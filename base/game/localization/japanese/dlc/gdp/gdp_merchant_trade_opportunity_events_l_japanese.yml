 gdp_merchant_trade_opportunity.9050.toast_desc_competitor_gone: "競合する[merchant_family|E]は、もう[company|E]を率いていない"
 gdp_merchant_trade_opportunity.9050.toast_desc_charter_gone: "競合相手は、もう[merchant_patron|E]から[charter|E]を付与されていない"
 gdp_merchant_trade_opportunity.9050.toast_desc_entrepot_gone: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]には、もう[entrepot_district|E]が存在しない"
 gdp_merchant_trade_opportunity.9050.toast_desc_tolls_ended: "あなたはもう[trade_destination.GetBaronyNameExplicitlyNoTooltip]で[tolls|E]を支払わない"
 gdp_merchant_trade_opportunity.9050.toast_desc_silk_road: "あなたはもう[silk_road|E]の参加者ではない"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_imprisoned: "あなたは[imprisoned|E]されている"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_incapable: "あなたは[GetTrait('incapable').GetName( GetNullCharacter )]である"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_government: "あなたはもう[merchant|E][government|E]を持っていない"
