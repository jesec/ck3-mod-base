l_japanese:
 gdp_tgf_coin_artifact: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip]の最初の硬貨"
 gdp_tgf_coin_artifact_desc: "片面には[tgf_market_holder.GetFirstNamePossessive]の顔が刻まれ、そして縁には、商人以外には誰も読めないほどの小さな文字で「[tgf_coin_merchant.GetFirstName]が[tgf_good.Custom('GetTradeGood')]を供給した」と刻まれている。"
 gdp_tgf_smith_weapon_axe: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]の[tgf_good.Custom('GetTradeGood')|U]の斧"
 gdp_tgf_smith_weapon_dagger: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]の[tgf_good.Custom('GetTradeGood')|U]の短剣"
 gdp_tgf_smith_weapon_hammer: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]の[tgf_good.Custom('GetTradeGood')|U]のハンマー"
 gdp_tgf_smith_weapon_mace: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]の[tgf_good.Custom('GetTradeGood')|U]のメース"
 gdp_tgf_smith_weapon_spear: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]の[tgf_good.Custom('GetTradeGood')|U]の槍"
 gdp_tgf_smith_weapon_sword: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]の[tgf_good.Custom('GetTradeGood')|U]の剣"
 gdp_tgf_smith_weapon_desc: "[tgf_smith_patron.GetFirstName]がこれまで購入した中で最高の地金から、[tgf_source_county.GetNameNoTier]の[tgf_smith.GetFirstName]が鍛造した品。元の金属の10倍の価値があると、鍛冶職人は請け合った。"
 gdp_tgf_reading_stones_artifact_merchant: "[tgf_lens_merchant.GetFirstNamePossessiveNoTooltip]の読書石"
 gdp_tgf_reading_stones_artifact_lord: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip]の読書石"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "[tgf_source_county.GetNameNoTier]の[tgf_glassmaker.GetFirstName]が研磨した2枚の透明なガラス製のレンズ。セネカは、水を満たしたガラス球を通すと小さな文字が大きく見えると書いている。これらのレンズがあれば、どんな契約書の細かな文字もはっきりと読むことができる。"
 gdp_tgf_showpiece_artifact: "[tgf_showpiece_merchant.GetFirstNamePossessiveNoTooltip]の[tgf_good.GetNameNoTooltip]の飾り棚"
 gdp_tgf_showpiece_artifact_desc: "名だたる[tgf_good.Custom('GetTgfGoodCrafter')]の[tgf_crafter.GetFirstName]が作り上げた品。すべての引き出しには[tgf_showpiece_merchant.GetFirstNamePossessive]の最高級の[tgf_good.Custom('GetTradeGood')]が敷き詰めてある。買い手には開いて見せるが、それ以外の者には固く閉ざされている。"
 gdp_tgf_curio_grain: "極上の穀物の束"
 gdp_tgf_curio_grain_desc: "大豊作の年に最良の畑から刈り取られたもの。"
 gdp_tgf_curio_millet: "古い雑穀の壺"
 gdp_tgf_curio_millet_desc: "年代物だが新品同様だ。雑穀は長持ちする。"
 gdp_tgf_curio_rice: "一碗の白米"
 gdp_tgf_curio_rice_desc: "脱穀され、精米された、食べるのが惜しいほど美しい米。"
 gdp_tgf_curio_meat: "完璧な塩漬け肉"
 gdp_tgf_curio_meat_desc: "十二分に塩漬けされた肉。持ち主よりも長持ちするかもしれない。"
 gdp_tgf_curio_fish: "台座に置かれた干し魚"
 gdp_tgf_curio_fish_desc: "板のように硬く、その倍誇らしい。"
 gdp_tgf_curio_cheese: "熟成チーズの塊"
 gdp_tgf_curio_cheese_desc: "誰も覚えていないほど遠い夏に作られ、圧搾されたもの。"
 gdp_tgf_curio_fruit: "果物の砂糖漬けの壺"
 gdp_tgf_curio_fruit_desc: "砂糖漬けにして密封され、それにふさわしい日まで取っておかれるもの。"
 gdp_tgf_curio_oil: "一番搾りの油の瓶"
 gdp_tgf_curio_oil_desc: "その年最初に絞った、緑がかった黄金色の油。"
 gdp_tgf_curio_honey: "密封された蜂蜜の壺"
 gdp_tgf_curio_honey_desc: "琥珀のように色が濃く、いくつかの古酒よりも古い。"
 gdp_tgf_curio_tea: "圧縮茶の塊"
 gdp_tgf_curio_tea_desc: "茶園から遠く離れた地でも、その重さに見合う価値がある。"
 gdp_tgf_curio_horses: "勝ち馬の蹄鉄"
 gdp_tgf_curio_horses_desc: "一度もレースで負けたことがない馬のものだと、売り手は請け合った。"
 gdp_tgf_curio_cattle: "磨き上げられた牛の角"
 gdp_tgf_curio_cattle_desc: "磨き上げられて輝いている。宴席で酒を飲むのにちょうどよい。"
 gdp_tgf_curio_silver: "傷一つない銀の延べ棒"
 gdp_tgf_curio_silver_desc: "純度がく、高い爪で跡がつくほどだが、誰もそんなことはしない。"
 gdp_tgf_curio_gold: "砂金の塊"
 gdp_tgf_curio_gold_desc: "誰も名を明かさない、ある川で採取されたもの。"
 gdp_tgf_curio_iron: "完璧な鉄のブランク材"
 gdp_tgf_curio_iron_desc: "緻密で黒光りし、傷一つない。"
 gdp_tgf_curio_copper: "輝く銅の円盤"
 gdp_tgf_curio_copper_desc: "鉱山で鋳造されたもので、冷え固まったその日のままの輝きを保っている。"
 gdp_tgf_curio_beer: "彫刻入りのジョッキ"
 gdp_tgf_curio_beer_desc: "きっかり1パイント入る。もっとも、一杯で済むことなど滅多にない。"
 gdp_tgf_curio_wine: "伝説の年代物ワイン"
 gdp_tgf_curio_wine_desc: "ブドウ農家たちが声をひそめて語り継ぐ、当たり年の一本。"
 gdp_tgf_curio_gems: "宝石の原石"
 gdp_tgf_curio_gems_desc: "見た目は小石も同然だが、村一つ分の値打ちがある。"
 gdp_tgf_curio_amber: "琥珀の塊"
 gdp_tgf_curio_amber_desc: "蜂蜜色の輝きの奥に、一匹のハエが永遠に閉じ込められている。"
 gdp_tgf_curio_ivory: "彫刻入りの象牙片"
 gdp_tgf_curio_ivory_desc: "牙の先端を、根気強い誰かが丹念に彫り上げたもの。"
 gdp_tgf_curio_jade: "川で磨かれた翡翠"
 gdp_tgf_curio_jade_desc: "手に取るとひんやりと冷たい。本物の翡翠ならではの感触だ。"
 gdp_tgf_curio_wood: "木目の美しい木塊"
 gdp_tgf_curio_wood_desc: "流れる水のような美しい木目。毎年、彫刻師たちが競って値をつける。"
 gdp_tgf_curio_hemp: "見事に巻かれた縄"
 gdp_tgf_curio_hemp_desc: "むら一つなく、ねじり合わせたというより、まるで引き伸ばしたような縄。"
 gdp_tgf_curio_wool: "黄金の羊毛"
 gdp_tgf_curio_wool_desc: "伝説の金羊毛ではない。だが、それに近いものだと羊飼いは言い張っている。"
 gdp_tgf_curio_cotton: "極上の綿花"
 gdp_tgf_curio_cotton_desc: "羽毛のように軽く、霜のように白い。"
 gdp_tgf_curio_flax: "絹のような亜麻糸の束"
 gdp_tgf_curio_flax_desc: "夕暮れ時なら絹と見間違えるほど、きめ細かな亜麻糸。"
 gdp_tgf_curio_textiles: "名織工が織り上げた布地"
 gdp_tgf_curio_textiles_desc: "雨さえ弾くほど、目の詰まった織り。"
 gdp_tgf_curio_furs: "傷一つない冬毛の毛皮"
 gdp_tgf_curio_furs_desc: "毛皮が最も厚くなる真冬に獲られたもの。"
 gdp_tgf_curio_leather: "浮き彫り細工の一枚革"
 gdp_tgf_curio_leather_desc: "なめされ、彫られ——それでいて布のように柔らかい。"
 gdp_tgf_curio_sugar: "真っ白な砂糖塊の先端"
 gdp_tgf_curio_sugar_desc: "砂糖塊のなかでも最も白い部分。人に見せるために取っておいたもの。"
 gdp_tgf_curio_spices: "希少な香辛料の箱"
 gdp_tgf_curio_spices_desc: "年に一度、その存在を証明するためだけに箱が開けられる。"
 gdp_tgf_curio_ceramics: "傷一つない釉薬掛けの鉢"
 gdp_tgf_curio_ceramics_desc: "叩けば鐘のように澄んだ音がする。もちろん、叩く者などいない。"
 gdp_tgf_curio_glass: "透き通ったガラスの小瓶"
 gdp_tgf_curio_glass_desc: "気泡一つない。これを吹いたガラス職人は、胸を張って引退した。"
 gdp_tgf_curio_jewelry: "名品のブローチ"
 gdp_tgf_curio_jewelry_desc: "留め針を作るだけで、ひと月もかかった。"
 gdp_tgf_curio_lacquerware: "漆塗りの小箱"
 gdp_tgf_curio_lacquerware_desc: "漆を30回も塗り重ねてある。中の贈り物さえ霞むほどの輝きだ。"
 gdp_tgf_curio_silk: "完璧な絹の端切れ"
 gdp_tgf_curio_silk_desc: "織機が生み出した最高の逸品。市場には出さず、大切に取っておかれた。"
 gdp_tgf_curio_incense: "淡い色をした樹脂の塊"
 gdp_tgf_curio_incense_desc: "焚かずとも甘く香る。焚けばなお甘く香る。だが、一度も焚かれたことはない。"
 gdp_tgf_curio_medicaments: "薬屋の見本箱"
 gdp_tgf_curio_medicaments_desc: "あらゆる病に備え、あらゆる薬を一服分ずつ。"
 gdp_tgf_curio_stone: "彫刻入りの石片"
 gdp_tgf_curio_stone_place: "[tgf_source_county.GetNameNoTierNoTooltip]産の彫刻入りの石"
 gdp_tgf_curio_stone_desc: "今いるどの石工よりも古く、その誰が彫ったものよりも見事だ。"
 gdp_tgf_curio_salt: "純白の塩の塊"
 gdp_tgf_curio_salt_desc: "雪のように白い。灰色の塩では、決してこうはならない。"
 gdp_tgf_curio_alum: "拳ほどもあるミョウバンの結晶"
 gdp_tgf_curio_alum_desc: "氷のように透き通り、舐めれば舌に刺激が走る。"
 gdp_tgf_curio_dyes: "紫染料の小瓶"
 gdp_tgf_curio_dyes_desc: "かつては皇帝だけに許された色。建前上は、今もそうだ。"
 gdp_tgf_curio_books_paper: "装飾写本の一ページ"
 gdp_tgf_curio_books_paper_desc: "誰にも見つけられない本の、非の打ちどころのない一ページ。"
 gdp_tgf_itinerary_artifact: "巡礼者の道中記"
 gdp_tgf_itinerary_artifact_desc: "道筋や宿屋、川を渡れる浅瀬などが丁寧な筆跡で記された、くたびれた小さな本。なかには、どの地図にも載っていない場所もある。"
 gdp_tgf_first_sale_artifact: "[tgf_first_seller.GetFirstNamePossessiveNoTooltip]が初めて売った[tgf_good.GetNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "[tgf_first_seller.GetFirstName]が初めて売った[tgf_good.Custom('GetTradeGood')]の[tgf_good.Custom('GetTgfGoodSmallest')]。倍の値で買い戻し、額に入れて飾ってある。売り物ではない。たぶん。"
 gdp_tgf_merchant_portrait_artifact: "交易商人の肖像画"
 gdp_tgf_merchant_portrait_artifact_desc: "勘定机に向かい、硬貨の山を前に満足げな表情を浮かべる交易商人が描かれている。"
 gdp_tgf_bale_book_artifact: "積み荷から出てきた本"
 gdp_tgf_bale_book_artifact_desc: "誰かが交易商人の積み荷を湿気から守るために使ったもの。それなりの役には立ったらしい。"
 gdp_tgf_handbook_practice_artifact: "商売の手引き"
 gdp_tgf_handbook_practice_artifact_desc: "どこかの交易商人が寝る間も惜しんで記したのだろう——度量衡に街道、相場までが詳しく書き込まれている。さらに余白には、別の誰かの計算がびっしりと並んでいる。"
 gdp_tgf_handbook_roads_artifact: "街道と市場の書"
 gdp_tgf_handbook_roads_artifact_desc: "名だたる市場を結ぶ街道を一つ残らず網羅。通行料や宿屋はもちろん、どの渡し守が客をだますかまで載っている。"
 gdp_tgf_handbook_mirror_artifact: "交易商人の鑑"
 gdp_tgf_handbook_mirror_artifact_desc: "何を仕入れるべきかから誰を信用すべきかまで、交易商人の心得を説いた書。その大半は、誰を信用してはならないかに割かれている。"
