l_japanese:
 # Scheme
 gdp_incite_unrest_scheme: "騒乱の扇動"
 gdp_incite_unrest_scheme_desc: "首都の民衆に反乱の火種と不満を広め、統治者への反感を煽る。"
 gdp_incite_unrest_scheme_desc_general: "首都の民衆に反乱の火種と不満を広め、統治者への反感を煽る。"
 gdp_incite_unrest_scheme_action: "騒乱の扇動"
 GDP_INCITE_UNREST_SUCCESS_DESC: "扇動者たちが民衆を煽り立てた。主君の首都伯爵領で民衆の好感度が低下する。"
 GDP_INCITE_UNREST_DISCOVERY_DESC: "首都での騒乱の扇動工作が露見した。"
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "工作中止"
 gdp_incite_unrest_scheme_owner_not_republic: "共和制ではなくなったため、この工作は実行できない。"
 # Interaction
 gdp_incite_unrest_start_interaction: "騒乱の扇動"
 gdp_incite_unrest_scheme_interaction_tt_approved: "[recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V]の民衆に密かに不満を広め、[recipient.GetTitledFirstNamePossessiveNoTooltip|V]の[popular_opinion|E]を低下させる。"
 gdp_incite_unrest_scheme_start_notification: "工作開始"
 gdp_incite_unrest_scheme_target_tt: "誰かがあなたに対して工作を進めている。"
 # Success messages
 gdp_incite_unrest_scheme_success_t: "騒乱の拡大"
 gdp_incite_unrest_scheme_success_liege_t: "首都の騒乱"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "工作の頓挫"
 gdp_incite_unrest_scheme_failure_desc: "扇動者たちは[scope:target.GetTitledFirstName]に対する反乱を煽ることに失敗し、陰謀は無駄に終わった。民衆は動かされないままだ。"
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "計画の露見"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "扇動者たちは役目を果たした。[target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]では不満が街中へ広がり、[target.GetTitledFirstName]は民衆の信頼を失いつつある。"
 gdp_incite_unrest_scheme_event.0005.a: "民衆をさらに煽ってやろう。"
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "不満の声が[This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]に広がっている。何者かが民衆を扇動し、[This.GetHerHim]への反感を煽っており、その不満は日に日に大きくなっている。"
 gdp_incite_unrest_scheme_event.0006.a: "秩序を取り戻さねば。"
 # County modifier
 gdp_incite_unrest_county_modifier: "反乱の火種"
 gdp_incite_unrest_county_modifier_desc: "扇動者たちがこの地で不満を煽り、民衆の統治者への反感を煽っている。"
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "面目を失った扇動者"
 gdp_caught_inciting_unrest_modifier_desc: "このパトリシアンは共和国の元首に対する扇動工作を行っていることが発覚し、他の一族や有権者から疑いの目を向けられている。"
