l_japanese:
 gdp_visit_holding_decision_event.1200.t: "後援者を訪ねて"
 gdp_visit_holding_decision_event.1200.intro_desc: "[ROOT.Char.GetCurrentLocation.GetName]の[ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l]に入ると、その豪奢さに圧倒される。どこを見ても、値のつけようもない工芸品や装飾品が並んでいる。[patron.Custom('RegionalFabric')]のタペストリー、彫像、そして見事な彫刻が施された家具。[patron.Custom('GetExpensiveMeal')]の芳醇な香りが辺りに満ちている。\n\n慌ただしく行き交う召使いたちの間で "
 gdp_visit_holding_decision_event.1200.all_available_desc: "道に迷っていると、[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]が私の到着を告げているのが目に入った。その近くには、[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]が立っている。姿勢を正し、提案を切り出さねば。"
 gdp_visit_holding_decision_event.1200.patron_available_desc: "道に迷っていると、[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]が、こちらへ来るよう私に手招きしているのが目に入った。どうやら、私は[patron.GetHerHis]にとって非常に重要な客人らしい。姿勢を正し、提案を切り出さねば。"
 gdp_visit_holding_decision_event.1200.steward_available_desc: "道に迷っていると、[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]が、こちらへ来るよう私に手招きしているのが目に入った。[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]の姿はどこにも見えない。どうやら[patron.GetSheHe]は、私に会う暇もないほど忙しいらしい。姿勢を正し、提案を切り出さねば。"
 gdp_visit_holding_decision_event.1200.representative_desc: "道に迷っていると、[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)]が私を迎えるべく待っているのが目に入った。話によると、都合がつかない[patron.GetTitledFirstNameNoTooltip]の代理とのことだ。姿勢を正し、提案を切り出さねば。"
 gdp_visit_holding_decision_event.1200.none_available_desc: "道に迷いながら、私は[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]か、私の申し入れを聞いてくれる誰かを探し続けた。だが、そのような相手は、ついに見つからなかった。どうやら、あらかじめ約束を取りつけておくべきだったらしい。"
 gdp_visit_holding_decision_event.1200.a: "[ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]の市場をより強力に統制したい。"
 gdp_visit_holding_decision_event.1200.a.tt: "あなたの提案により、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "投資の機会を見つけたい。"
 gdp_visit_holding_decision_event.1200.b.tt: "投資先となる事業を探すことで、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_prestige$ "
 gdp_visit_holding_decision_event.1200.c: "考え直そう…"
 gdp_visit_holding_decision_event.1200.c.tt: "[THIS.Char.GetCurrentLocation.GetName]に戻り、ほかに何があるか確かめる"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "私が挙げた商会員の面々が、[negotiator.GetTitledFirstNameNoTooltip]に好印象を与える"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "私が口にした名前は、取るに足りないものと見なされる"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "私の言葉が不興を買う"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "私の人を取りまとめる能力が[negotiator.GetTitledFirstNameNoTooltip]を納得させる"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "私は提案の内容をうまく伝えられず、しどろもどろになる"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "私の帳簿に横領の形跡が見つかる"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "[negotiator.GetTitledFirstNameNoTooltip]の説得に成功する"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip]の心は動かない"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip]は私の嘘に気分を害する"
 gdp_visit_holding_decision_event.1200.a_learning.success: "私の知識が[negotiator.GetTitledFirstNameNoTooltip]に感銘を与える"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "経済理論を深く語りすぎて、[negotiator.GetTitledFirstNameNoTooltip]を退屈させる"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "どういうわけか、[negotiator.GetTitledFirstNameNoTooltip]に自分が愚かだと思わせてしまう"
 gdp_visit_holding_decision_event.1200.a_martial.success: "軍事兵站に関する私の知識が、[negotiator.GetTitledFirstNameNoTooltip]に感銘を与える"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "結局、軍事通を気取っているように聞こえてしまう"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "私が挙げた例が脅しのように聞こえてしまう"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "私の力強さが[negotiator.GetTitledFirstNameNoTooltip]に深い感銘を与える"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip]はあくびをする"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip]は、私のいかめしい身振りを脅しと勘違いする"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "あなたは最近[patron.GetShortUIName]に交易上の特権を求めたばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "あなたは最近[patron.GetShortUIName]に金を支払って威信点を得たばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$：競争の激しい市場"
 gdp_visit_holding_decision_event.1201.all_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]は歓迎するような仕草で、近くへ来るよう私に手招きする。私は近づく前に、自分の提案について、慌ただしく最後の確認をする。この取引を成立させることは、[ROOT.Char.GetHouse.GetName]商会にとって何よりも重要なのだ。\n\n歩み寄るにつれ、[patron.GetFirstName]の周りに尊大な空気が漂っているのを感じる。\n\n「提案の内容は明確に述べたまえ。そうすれば、検討しないこともない…」"
 gdp_visit_holding_decision_event.1201.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]は威圧的な仕草で、近くへ来るよう私に手招きする。私は近づく前に、自分の提案について、慌ただしく最後の確認をする。この取引を成立させることは、[ROOT.Char.GetHouse.GetName]商会にとって何よりも重要なのだ。\n\n歩み寄るにつれ、[patron.GetFirstName]の周りに尊大な空気が漂っているのを感じる。\n\n「提案の内容は明確に述べたまえ。そうすれば、検討しないこともない…」"
 gdp_visit_holding_decision_event.1201.steward_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]は歓迎するような仕草で、近くへ来るよう私に手招きする。私は近づく前に、自分の提案について、慌ただしく最後の確認をする。この取引を成立させることは、[ROOT.Char.GetHouse.GetName]商会にとって何よりも重要なのだ。\n\n「提案の内容は明確に述べたまえ。それが[patron.GetTitledFirstNamePossessive]の利益にかなうか、私が判断しよう」"
 gdp_visit_holding_decision_event.1201.representative_desc: "[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)]は落ち着いた仕草で、近くへ来るよう私に手招きする。私は近づく前に、自分の提案について、慌ただしく最後の確認をする。この取引を成立させることは、[ROOT.Char.GetHouse.GetName]商会にとって何よりも重要なのだ。\n\n「提案の内容は明確に述べたまえ。それが[patron.GetTitledFirstNamePossessive]の利益にかなうか、私が判断しよう」"
 gdp_visit_holding_decision_event.1201.a: "「では、提案の中身について、お話しさせていただきます…」"
 gdp_visit_holding_decision_event.1201.b: "「ご自身の言葉には責任をお持ちいただけるんでしょうね？」"
 gdp_visit_holding_decision_event.1201.c: "今回は提案を見送ろう。"
 gdp_visit_holding_decision_event.1201.c.tt: "謁見に戻り、ほかに提案できることを検討する"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$：投資の提案"
 gdp_visit_holding_decision_event.1202.all_available_desc: "[patron.GetFirstName]が私の提案書に目を通すあいだ、私はただその場に立ち尽くしていた。書類から顔を上げた彼の眉間には、かすかな皺が寄っている。\n\n「ふむ…なるほど…この額なら、君と[ROOT.Char.GetHouse.GetName]商会のために口添えしてやってもよいかもしれん。これで多少は面目が立つはずだよ、[ROOT.Char.GetFirstNameNoTooltip]君？」"
 gdp_visit_holding_decision_event.1202.patron_available_desc: "私が[negotiator.GetHerHim]に提案の中身を話しているあいだ、[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]は[negotiator.Custom('ComplimentAdjective')]面持ちで、興味深そうに聞き入っていた。\n\n「なるほど…これは敬意を払うに値するよ、[ROOT.Char.GetFirstNameNoTooltip]君」"
 gdp_visit_holding_decision_event.1202.steward_available_desc: "[steward.GetFirstName]が私の提案書に目を通すあいだ、私は辛抱強くその場で待っていた。[steward.GetSheHe]はその内容に興味を引かれた様子だった。そして書類から顔を上げ、私の方を見て言った。\n\n「この提案書はよく書けている。その点は認めよう…君と[ROOT.Char.GetHouse.GetName]商会のため、[patron.GetTitledFirstName]様に口添えしてもよいかもしれない」"
 gdp_visit_holding_decision_event.1202.representative_desc: "[patron.GetTitledFirstNameNoTooltip]の代理として、[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)]が私の提案書に目を通すあいだ、私は辛抱強くその場で待っていた。[negotiator.GetSheHe]はその内容に興味を引かれた様子だった。そして書類から顔を上げ、私の方を見て言った。\n\n「この提案書はよく書けている。必ず[patron.GetTitledFirstNameNoTooltip]様の目に触れるよう取り計らおう」"
 gdp_visit_holding_decision_event.1202.a: "「もう少し条件について話し合えませんか…」"
 gdp_visit_holding_decision_event.1202.b: "「その条件でお受けいたします」"
 gdp_visit_holding_decision_event.1202.b.success: "取引は成功だ！"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName]はしばらくあなたに会うつもりはない。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]以降に再試行可能"
 gdp_caught_stealing.tt: "あなたは聖地で窃盗しようとしたところを捕まったばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]まで追放された状態が続く"
 gdp_visit_holding_decision_event.1000.b.tt: "あなたの[merchant_patron|E]に訴えれば、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_competitiveness$$gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "あなたの[merchant_patron|E]、または[patron.GetHerHis]の代理人が同席している必要がある"
 gdp_visit_holding_decision_event.1500.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]を訪ねて"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]に戻ってきたが、何も変わっていない。太陽はゆっくりと上空を横切り、開けた広場に隣接する建物がかわるがわる影をつくる。"
 gdp_visit_holding_decision_event.1500.desc_returned_02: "弱い日の光を浴びながら、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]へ戻る途中、ずっとお香の強い匂いがする。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "暗い治癒師の小屋から出てきた私は目を細め、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の広場へ戻っていく。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の門をくぐり、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の広場に戻ると、田舎の静けさに出迎えられる。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "晴れた気持ちで静かな庭園から戻ってくると、賑わっている[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の広場を見渡す。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "[merchant_physician_recruit.GetFirstNamePossessiveNoTooltip]の書斎を出て、徐々に細くなる路地裏を抜けて、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]に戻ってくる。"
 gdp_visit_holding_decision_event.1500.desc: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の広場は商売が盛んで、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural]や手伝いの者がいるが、どこか落ち着いた感じがある。\n\n中央には立派な[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]があり、両脇には大げさに治療を宣伝する看板や、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]を静かに瞑想するための付設の庭園がある。"
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\n広場の端では、信者が体の健康を保つことについて説教をしている。以前に約束した通り、病気にかかった私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))]、[1500_sickly_minor.GetFirstName]は治癒師の小屋へ連れていかれ、そこで私を待っている。"
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\n広場の端では、信者が体の健康が心の健康を良くするのだと説教をしている。[merchant_physician_recruit.GetSheHe|U]はときどき農民の群衆にやじられながらも、臆せず立っている。"
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\n野営地で付き添い人と約束した通り、病気にかかった私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))]、[1500_sickly_minor.GetFirstName]は治癒師の小屋へ連れていかれ、そこで私を待っている。"
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName]は鑑賞するように頷き、賑わう広場を見渡すと、興味をそそる露店や面白そうな場所に早速目移りさせている。"
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\n私は満足した気持ちで広場を眺め、数回深呼吸をすると、次の目的地について考える。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n少し疲れはじめた[visiting_partner.GetFirstName]が言う。「文句を言うつもりはないのだが…もうここでの用は済んだのではないか？」"
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\n[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の広場でかなり長い時間を過ごし、今日の成果に満足した私は、大広場に戻る一番近い道を探して辺りを見る。"
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n熱心な説教師が健康に関する教えを説いているが、どうやら説教は終わりに近づいているようだ。"
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nどういうわけか、広場に子供がたくさんいるような気がする。最初からずっといただろうか？子供たちははしゃぎ回り、昔からある遊びにいつも何かひねりを加えて、しばしば親を驚かせたり、怒らせたりしている。\n\n[1500_sickly_minor.GetFirstNamePossessive]の健康のことばかり考えながら、私は広場を眺め、次の目的地を探す。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\n私の左で、[visiting_partner.GetFirstName]は小瓶が並べられた露店を興味津々に見ている。小瓶には[ROOT.Char.Custom('VenomousCreature')]の毒が入っているらしい。\n\n考えるだけでも鳥肌が立つくらい恐ろしい。私は次の目的地を決めようとする。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName]は私の肩を叩き、衛兵たちを指差す。彼らは、世界の終焉を叫ぶぼろぼろの[ROOT.Char.GetWomanMan]を建物から連れ出しているところだ。\n\n私は本能的に眉を上げ、その騒ぎを観察しながら、次に何をすべきか考える。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName]は広場を抜ける途中、私に食べ物を分けてくれる。\n\n私は干物を噛みながら、次に何をすべきか考える。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\n広場の暗い片隅で、行商人が貴族の[ROOT.Char.GetWomanMan]に赤土の治癒効果を信じ込ませようとしている。\n\n私は彼らが言い争っているのを何気なく見ながら、次に何をすべきか考える。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\n黒曜石の鏡が置かれた近くの露店で、ある[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter]がようやく自分の姿を確認することができた興奮を抑えようとしている。\n\nそれを少し愉快に感じながら、私は次の目的地を探る。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\n小さなロタンダの近くで、[ROOT.Char.Custom('RandomReligiousTextName')]の写本を持つ行商人が、質素ななりの聴衆に向けてその内容を大きな声で読み上げている。\n\n私はぼんやりと耳を傾けながら、広場を観察し、次に何をすべきかを考える。"
 gdp_visit_holding_decision_event.1500.a: "治癒師の祝福を求めよう。"
 gdp_visit_holding_decision_event.1500.a_second: "治癒師のもとへ戻ろう。"
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "治癒師なら[1500_sickly_minor.GetFirstNameNoTooltip]を助けられるかもしれない。"
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip]はまだ私を待っている。"
 gdp_visit_holding_decision_event.1500.a.tt: "治癒師を訪問すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "あなたは最近治癒師を訪ねたばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]より後に再試行可能"
 gdp_visit_holding_decision_event.1500.b: "この[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]には興味をそそられる。"
 gdp_visit_holding_decision_event.1500.b_second: "この[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]はもう一度訪れる価値がある。"
 gdp_visit_holding_decision_event.1500.b.tt: "地元の礼拝所を訪問すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "あなたは最近現地の礼拝所を訪れたばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]より後に再試行可能"
 gdp_visit_holding_decision_event.1500.c: "庭園も面白そうだ。"
 gdp_visit_holding_decision_event.1500.c_second: "もう一度、庭園を見て回ろう。"
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ 信仰について思索し、[stress|E]を減少させる"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ 物資を調達する"
 gdp_visit_holding_decision_event.1500.c.tt: "庭園を訪れると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_garden_contemplate$$gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "あなたは最近庭園を訪れたばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]より後に再試行可能"
 gdp_visit_holding_decision_event.1500.d: "あそこにいるのは説教師か？"
 gdp_visit_holding_decision_event.1500.d_second: "[merchant_physician_recruit.GetFirstNameNoTooltip]とはまだ話が済んでいない。"
 gdp_visit_holding_decision_event.1500.d.tt: "医師と話すと、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "ほかの用件に取りかかろう。"
 gdp_visit_holding_decision_event.1501.intro: "治癒師の小屋は薄暗く、独特な#EMP 臭い#!がする。#EMP 不快#!なわけではないが、鼻の奥が刺激される臭いだ。\n\n[merchant_healer_character.GetFirstName]は背の高いテーブルの近くに立ち、調合薬の準備で忙しそうにしている。"
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$：治癒師"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$中へ入ると、ひとりの[merchant_healer_character.GetWomanMan]が満面の笑みで私たちを迎えた。\n\n「ようこそ、こんな粗末な住まいへ！私は[merchant_healer_character.GetFirstNameNoTooltip]。何かお困りかな？」"
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))]、[1500_sickly_minor.GetFirstName]は病にかかっており、治癒師の小屋にいる。[1500_sickly_minor.GetSheHe|U]は私が[1500_sickly_minor.GetHerHim]を階下に運んでいると、物悲しく咳をする。\n\n治癒師の[merchant_healer_character.GetFirstName]は木の椅子から立ち上がると、こちらに曇らせた顔を向ける。「私の治療が必要か？」"
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "治癒師の小屋に入ると、[merchant_healer_character.GetFirstName]は年寄りの[ROOT.Char.GetWomanMan]を浄化している最中だった。[visiting_partner.GetFirstName]は興奮に目を輝かせ、熱心に[merchant_healer_character.GetFirstNameNoTooltip]を観察する。「#EMP あれ#!ならやってみてもいいな…」\n\n[merchant_healer_character.GetFirstNameNoTooltip]は我々の声を聞くと顔を上げる。「なんだ、気付かなかったよ！何か病気か？」"
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$[merchant_healer_character.GetSheHe|U]は顔を上げ、眉を少し上げる。「無事に戻ってきたようだな！今回はどんな用件だ？」"
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName]は治癒師の小屋の隅にある暖炉のそばの、柔らかい寝台の上で私の帰りを待っている。私は考えるより先に体を寄せて[1500_sickly_minor.GetHerHis]の呼吸を確かめ、髪を撫でる。\n\n[merchant_healer_character.GetFirstName]は[ROOT.Char.Custom('WritingInstrument')]を置き、こちらに険しい顔を向ける。「どうするのだ？」"
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "治癒師の小屋に入ると、[merchant_healer_character.GetFirstName]は薬草を見ながら考え事をしていたが、我々が階段を下りると顔を上げる。「ああ、気が変わったのか？」\n\n私の左では、[visiting_partner.GetFirstNameNoTooltip]は片足に交互に体重をかけ、以前に[merchant_healer_character.GetFirstNameNoTooltip]がやっていた施術を自分でもやってみたくてうずうずしている。"
 gdp_visit_holding_decision_event.1501.desc_returned_01: "階段を下りて治癒師の小屋に入ると、[merchant_healer_character.GetFirstName]は別の患者の世話をしている。[merchant_healer_character.GetSheHe|U]は私を見るなり、患者に部屋のさらに奥にある寝台に座るよう指示する。\n\n[merchant_healer_character.GetSheHe|U]は、患者と我々が互いのことを知られないよう、破れた敷布で作ったその場しのぎのカーテンを閉めにいく。\n\n「戻ってきたか」[merchant_healer_character.GetSheHe]は真面目な口調で言う。「何かで私の助けが必要なのか？」"
 gdp_visit_holding_decision_event.1501.desc_returned_02: "薄暗い治癒師の小屋に戻ると、[merchant_healer_character.GetFirstName]は少し奥まったところに座っており、ぼろぼろの日誌のようなものを読んでいる。遠くからではわかりにくいが、人間の体が描かれているように見える。\n\n[merchant_healer_character.GetSheHe|U]は慎重に日誌を閉じると、それをしまい、私を見て落ち着いた声で話す。「ああ、戻ってきたのか。やはり、何か病気が見つかったのか？」"
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\n視界の端で治療用の装身具を見つけ、そのなかでも特に立派な角に興味が湧く。"
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\n部屋を少し奥に入ったところに、素晴らしい[1500_health_artifact.GetName]がほかの治療用の装身具と一緒にまだ置かれている。"
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\n部屋を少し奥に入ったところに治療用の装身具が並べられた棚があり、そこで見かけた面白い[1500_health_artifact.GetName]に興味が湧く。"
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\n部屋を少し奥に入ったところにある[1500_health_artifact.GetName]がまだ私の興味を引きつける。"
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "「その[1500_health_artifact.GetNameNoTooltip]に興味がある」"
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
