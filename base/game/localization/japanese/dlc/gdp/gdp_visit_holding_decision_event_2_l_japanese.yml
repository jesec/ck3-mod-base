 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$：[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]に戻ると、ちょうど説教が終わったところだった。修道者の[merchant_clergy_character.GetFirstName]はほうきを持って歩き回り、穏やかに片付けをして、祈りや瞑想をしにここへやって来る人のために聖地を清潔にしている。\n\n[merchant_clergy_character.GetSheHe|U]は私が近づくとこちらを向き、口角を上げて優しく微笑む。「主の暖かい抱擁の中へよくぞ戻ってきた。しばらくここに残って、景色を眺めていってはどうだ？」"
 gdp_visit_holding_decision_event.1503.desc_returned_02: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]に再び入ると、修道者の[merchant_clergy_character.GetFirstName]は説教壇と向かい合わせになったベンチに座り、どうやら瞑想に集中しているようだ。\n\n[merchant_clergy_character.GetSheHe|U]はこちらに顔を向け、近づいていく私を肩越しに見る。「忙しそうだな。その疲れた足を少し休めていきなさい。なんの用かな？」"
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の見事な門をくぐると、この場所に務める[GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]がその日の仕事をちょうどやり終えたところだった。\n\n大きな通路の先に、意外にも、修道者の[merchant_clergy_character.GetFirstName]がおり、こちらに不可解な表情を見せると歩み寄ってくる。「移り気な子よ、そなたをここまで安全に運んでくださったのは[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]だ！」"
 gdp_visit_holding_decision_event.1503.desc: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の門をくぐり、私は建物の精巧な作りと神聖な装飾に込められた職人技に驚かされる。\n\nこの場所に務める[GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]の一人が私に気付き、落ち着いた足取りでこちらに向かってくる。「ごきげんよう。私は修道者の[merchant_clergy_character.GetFirstName]。なんの用かな？」"
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "#EMP たぶん#!…"
 gdp_visit_holding_decision_event.1503.b: "「[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]は我が商会を祝福してくれるだろうか？」"
 gdp_visit_holding_decision_event.1503.c: "こうした寄付を必要としているのは、どう考えても#EMP 私#!だ。"
 gdp_visit_holding_decision_event.1503.c_guarded: "#EMP 私#!の懐に、もう一度寄付を。"
 gdp_visit_holding_decision_event.1503.c_master_thief: "「おい、[visiting_partner.GetFirstNameNoTooltip]、見張っていろ！」"
 gdp_visit_holding_decision_event.1503.c.flavor: "陽動して、金をくすねる。簡単だ。"
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "うーむ、どういうわけか、衛兵がこの辺りを巡回する頻度が増えているな…"
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "窃盗成功"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "あなたは寄付金の窃盗に成功する"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "追放！"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "あなたは[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]から追放される"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "衛兵招集"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "寄付金を手渡すと、[merchant_clergy_character.GetFirstNamePossessive]は驚いて目を大きくする。「あ…あなたは主にそっくりだ…間違いない…」[merchant_clergy_character.GetFirstNamePossessive]は一瞬私を見詰め、釣り上げられた魚のように口をぱかぱかと開けて言葉を発する。\n\nそして、[merchant_clergy_character.GetFirstNameNoTooltip]は自分のやっていることに気付くと冷静さを取り戻し、咳払いをする。「君の大義に喜んで#EMP 私#!の人生を捧げよう」"
 gdp_visit_holding_decision_event.1504.desc: "[merchant_clergy_character.GetFirstNamePossessive]はかがみ腰になり、私の肩に手を置くと、さらに大きな笑顔を見せる。「なんと慈悲深い人だ。君のような交易商人にとって、金を手放すのが必ずしも容易な行いではないことは、私も承知している」\n\n[merchant_clergy_character.GetSheHe|U]はもったいぶるように頷き、私を見たまま、肩に置いていた手を戻す。"
 gdp_visit_holding_decision_event.1504.a: "「[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]は我々の商売を祝福してくれるだろうか？」"
 gdp_visit_holding_decision_event.1504.a_epiphany: "「私は[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]の恩寵にしか興味がない」"
 gdp_visit_holding_decision_event.1504.b: "「健康な人間がもう一人#EMP 必要#!だ」"
 gdp_visit_holding_decision_event.1504.c: "「ただ同胞の力になりたいだけだ」"
 gdp_visit_holding_decision_event.1504.c_epiphany: "…今回は誰も雇うつもりはない。"
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$：庭園"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "庭園はまだ静寂に包まれており、椅子が用意された場所で静かに会話を交わす訪問者もいれば、静かに物思いにふけり、自然を眺めている者もいる。\n\n私は木々のざわめきやそよ風に耳を傾け、ふと安らいだ気持ちになる。"
 gdp_visit_holding_decision_event.1505.desc_returned_02: "今回、私は[ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]の木に初めて羽ばたこうとしている小鳥を見つける。\n\n小鳥は滑らかに巣の縁から飛び出すが、羽はなぜか絡まっており、しばらくのあいだ自由落下を続けるが…風が優しくそれを受け止める。私の胸に安堵感が広がる。"
 gdp_visit_holding_decision_event.1505.desc: "庭園は生け垣に囲まれ、木々はなだらかな丘の上に広がっており、珍しい鳥やリスが草木の奥に見える。\n\n私はこの美しさに包まれながら、ある存在を強く感じる。試練や苦難のあいだ、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]がずっと私と一緒にいたのだとしたら…？"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\n道の少し先で、[visiting_partner.GetFirstName]はまたこの地域の食用植物を探している。"
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nそして、その道の先で、午後の日差しを浴びて伸びる野生の食材を発見する。"
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\n背後から、おそらくは食べられるであろう植物に出会うたびに、[visiting_partner.GetFirstName]が何かをぶつぶつと言う声が聞こえてくる。"
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\n視界の端に、庭園を美しく飾る旨そうな野生の果物や薬草を見つける。"
 gdp_visit_holding_decision_event.1505.a: "安心する。"
 gdp_visit_holding_decision_event.1505.a_convert: "つまるところ、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]もそれほど悪くないのかもしれない。"
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "あなたは最近この庭園で思索したばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1505.b: "食材を無駄にするのはいけない。"
 gdp_visit_holding_decision_event.1505.b_partner: "「[visiting_partner.GetFirstNameNoTooltip]、野草を摘まないか？」"
 gdp_visit_holding_decision_event.1505.b_flavor: "収穫の時だ！"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "あなたは最近この庭園で収穫したばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1505.c: "「…隠れた場所や隙間があちこちにあるぞ、#EMP [visiting_partner.GetFirstNameNoTooltip]#!…」"
 gdp_visit_holding_decision_event.1505.c.flavor: "なんと神聖な場所か。"
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "あなたは最近この庭園でくつろいだばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$：医師"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "[merchant_physician_recruit.GetFirstNamePossessive]の研究室に続く扉は少し開いており、私はその隙間から、[merchant_physician_recruit.GetFirstNameNoTooltip]が恐ろしく鋭く細いはさみを使って、じっと座っている患者の髪を切っているのを観察する。\n\n扉を1回ノックし、中に入ると医師の注意がこちらに向く。「気付かなかったよ。なんの用だ？」"
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName]は扉の外に立ち、痛みに苦しんでいる様子の[ROOT.Char.GetWomanMan]の肩を診察する。\n\n[merchant_physician_recruit.GetSheHe|U]は診察を終えると、関節の治癒を早める自宅療法を教え、私の方を向く。「戻ってきたか。今度はなんの用だ？」"
 gdp_visit_holding_decision_event.1507.desc_returned_03: "恐る恐る[merchant_physician_recruit.GetFirstNamePossessive]の書斎に続く階段を上り、開いていた扉から中を覗く。\n\n[merchant_physician_recruit.GetSheHe|U]はどうやら何かの運動の最中のようで、大量の汗をかきながら、しゃがんだり立ったりを繰り返している。\n\nその動きを何度か繰り返した後、[merchant_physician_recruit.GetSheHe]は動きを止め、額を拭いて、近くの瓶に入れた飲み物を一口飲む。[merchant_physician_recruit.GetHerHis|U]は剃刀のように鋭い視線を私に向ける。「しつこい人だな」"
 gdp_visit_holding_decision_event.1507_desc_intro: "[merchant_physician_recruit.GetFirstName]の後に続いて徐々に細くなっていく路地を進み、階段を上って[merchant_physician_recruit.GetHerHis]の書斎に入る。部屋は床から天井まで、聖書や体液、健康、精神に関する書物を並べた棚で一杯である。\n\n[merchant_physician_recruit.GetSheHe|U]は机の後ろの一つしかない椅子に座り、小さなお守りを無心で撫でると、ようやく私の存在に気付く。 "
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$「おや、どこかで会ったことがあるかな？なんの用だい？」\n\n私は慎重に言葉を選んで話す。"
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$「おや、何か用かな？」\n\n「君が貧民たちに講義しているのを見た」私は質問に答えると、躊躇してからさらに話を続ける。"
 gdp_visit_holding_decision_event.1507.a: "「私のために働かないか？」"
 gdp_visit_holding_decision_event.1507.b: "「商会員たちの心を強くするのを手伝ってくれ！」"
 gdp_visit_holding_decision_event.1507.c: "「思考を鈍らせないためには、自分の能力を#EMP 発揮#!しつづける必要がある。私の商会に加われ」"
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName]はあなたの判断に同意する"
