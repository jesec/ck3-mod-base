 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "治療失敗"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "治療は失敗する"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "治療成功"
