l_japanese:
 gdp_republic_unrest.0001.t: "首都の蜂起：苦情"
 gdp_republic_unrest.0001.desc: "労働者とギルドの職人たちからなる集団が中庭に集まっている。その中の一人が前に進み出て言う。「申し上げます。税が重く、皆は貧困にあえいでおりまして…」\n\n聞き飽きた言葉である。こうした不平不満を直訴してくるのは、彼らが最初でも最後でもない。"
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "衛兵！この…皆様にお引き取り願え。"
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "農民風情と交渉する気はない。"
 gdp_republic_unrest.0001.b.success: "集団はこれ以上騒ぎを起こさずに解散する"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "拒絶されたことで彼らは激怒する"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "評議会に対処させろ。"
 gdp_republic_unrest.0001.c.success: "ひとまず集団は納得する"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "時間稼ぎだと見抜かれる"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "今回は譲歩をしよう。"
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "首都の蜂起：冷たい視線"
 gdp_republic_unrest.0011.desc: "市場を歩いていると、いつものように賑わっているには賑わっているのだが、どこか普段とは雰囲気が異なっているように感じられる。露店は静かで、人々も口をつぐみ、私を見ると気まずそうな顔をしている。\n\n長年この街を歩いてきて、このようなことは今までに一度もなかった。"
 gdp_republic_unrest.0011.a: "きっと気のせいだ。"
 gdp_republic_unrest.0011.b: "人を遣って噂の出どころを突き止めろ。"
 gdp_republic_unrest.0011.b.success: "配下の者が噂の出どころを突き止める"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "噂が広まり続ける"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "立ち止まって人々と話をしよう。"
 gdp_republic_unrest.0011.c.success: "人々はその態度を評価する"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "誰も話に応じてくれない"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "食料とワインを配れ。費用は度外視だ。"
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "首都の蜂起：匿名の手紙"
 gdp_republic_unrest.0021.desc: "今朝、私の机の上に一通の手紙が置かれていた。封蝋はなく、差出人の名もない。手紙には、私が[ROOT.Char.GetTitleAsName]に就任して以来、[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]がどれほど悪化したのかが事細かに書かれていた。"
 gdp_republic_unrest.0021.a: "火に放り込め。"
 gdp_republic_unrest.0021.b: "これほど手間をかけるとは。誰なのか突き止めろ。"
 gdp_republic_unrest.0021.b.success: "差出人を特定した"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "差出人は依然としてわからない"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "公の場に出て釈明を行おう。"
 gdp_republic_unrest.0021.c.success: "釈明が好意的に受け止められる"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "釈明が顰蹙を買う"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "首都の蜂起：広場の占拠"
 gdp_republic_unrest.0101.desc: "「申し上げます。一部の市民が市場広場を占拠しております…もう何日も前からです」衛兵が報告する。「[demagogue.GetFirstName]と名乗る[demagogue.GetWomanMan]がさかんに人々を煽動しているようです」\n\n市場が何日も占拠されているというのに、誰も報告にこないとは、どいつもこいつも給料泥棒ではないか。"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "さっさと広場から追い払え！"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "煽動者の悪評を広めろ。"
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName]の信用が失墜する"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "悪評は広まらない"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "私が直接話をつけよう。"
 gdp_republic_unrest.0101.c.success: "群衆が解散する"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "盛大に野次られる"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "要求に応じよう。"
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "首都の蜂起：閉ざされた街区"
 gdp_republic_unrest.0111.desc: "[closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )]が外部との接触を一切断っているという知らせが届いた。徴税人の立ち入りを拒み、衛兵の命令にも耳を貸そうとしていない。"
 gdp_republic_unrest.0111.a: "徴税人に衛兵を同行させよう。"
 gdp_republic_unrest.0111.b: "金で何とかしよう。"
 gdp_republic_unrest.0111.b.success: "彼らの要求が聞き入れられる"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "彼らは交渉を拒絶する"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "私が直接行って話をしよう。"
 gdp_republic_unrest.0111.c.success: "彼らは話に応じる"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "彼らは聞く耳を持たない"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "いずれ飽きるだろう。きっとな。"
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "首都の蜂起：見せしめ"
 gdp_republic_unrest.0121.desc: "街を歩いていたところ、醜い人形が目に入り、足を止めた。私の衣服と似たような布を着せられ、衆目に晒されるように吊るされている。群衆は固唾をのんで静まり返り、人形と私を交互に見つめている。\n\n「本物そっくりだなあ！」後ろのほうで誰かが叫んだ。すると、堰を切ったように群衆から野次が投げかけられた。"
 gdp_republic_unrest.0121.a: "撤去しろ！今すぐにだ！"
 gdp_republic_unrest.0121.a.flavor: "全員、ここで見たことを決して口外できないようにしてやる。"
 gdp_republic_unrest.0121.b: "誰の差し金か突き止めろ。"
 gdp_republic_unrest.0121.b.success: "首謀者らは処分される"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "首謀者を突き止めることに失敗する"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "公の場でこの件に関する声明を出そう。"
 gdp_republic_unrest.0121.c.success: "人々は耳を傾ける"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "群衆から野次と非難が飛ぶ"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "こんなものに取り合うな。"
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "首都の蜂起：街が燃えている"
 gdp_republic_unrest.0201.desc: "黒煙が立ち上る。衛兵が駆け寄ってきて報告する。「申し上げます。[demagogue.GetFirstName]と名乗る煽動者が人々をそそのかし、市内の一区画に火を放った模様です」\n\n一体、街に何が起きているのだ？"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "守備隊を結集して対処させろ。"
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "馬の用意を！"
 gdp_republic_unrest.0201.b.success: "暴徒たちが四散する"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "宮殿へと逃げ帰る羽目になる"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "広場で直接会って話そう。"
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "群衆が私に殺到する"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "必要なら、国庫を明け渡しても構わない。"
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "首都の蜂起：ストライキ"
 gdp_republic_unrest.0211.desc: "市場を通りかかると、ストライキが行われているのは一目瞭然であった。商品の売り込みをする者は誰一人としておらず、露店はもぬけの殻、工房も静まり返っている。\n\nギルド間で協定が結ばれ、所属する労働者たちもそれに従っているのは明らかだ。"
 gdp_republic_unrest.0211.a: "ギルド長たちを呼んで話し合おう。"
 gdp_republic_unrest.0211.a.success: "合意に達する"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "ギルド長は現れない"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "今回は金で何とかしよう。"
 gdp_republic_unrest.0211.b.success: "金額で合意に達する"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "妥協案が拒絶される"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "今すぐ仕事に戻らせろ。"
 gdp_republic_unrest.0211.d: "彼らの要求を飲もう。"
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "首都の蜂起：手書きの告発文"
 gdp_republic_unrest.0221.desc: "「申し上げます。実は…このようなものが出回っておりまして」衛兵の一人が紙切れを差し出す。「市内一帯にばら撒かれています」\n\nそこには、私個人に対する罵詈雑言に加え、ありとあらゆる類の罪を告発する内容が、事細かに書き連ねられている。"
 gdp_republic_unrest.0221.a: "書いた者を突き止めて対処せよ。"
 gdp_republic_unrest.0221.a.success: "告発者が見つかり、口封じされる"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "作者は依然として分からない"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "公の場でしっかりと否定しよう。"
 gdp_republic_unrest.0221.b.success: "非難の声が鎮まりはじめる"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "人々から野次を投げかけられる"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "一枚残らず買い占めろ。"
 gdp_republic_unrest.0221.d: "放っておけばそのうち消える。"
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "首都の蜂起：門前にて"
 gdp_republic_unrest.0301.desc: "暴徒がこちらに向かっているとの報告で目が覚める。宮殿の大広間を進むが、これではまるで伽藍洞だ…衛兵の大半は私を見捨てて逃亡してしまっている。\n\n窓から外を見ると、叫び声を上げ、はやし立てながら徐々に接近する暴徒たちの姿。奴らの狙いは私だ。"
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "真の[ROOT.Char.GetTitleAsNameNoTooltip]はただ一人だ。討てるものなら討ってみろ。"
 gdp_republic_unrest.0301.a.success: "暴徒を斬り伏せ続ける。後に残るのは、震える両手と血に染まり静まり返った宮殿だけだ"
 gdp_republic_unrest.0301.a.fail: "暴徒の手に掛かる"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "生け捕りにされてなるものか！"
 gdp_republic_unrest.0301.b.success: "従者たちと共に血路を切りひらく"
 gdp_republic_unrest.0301.b.fail: "多勢に無勢である"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "使用人用の門から出よう。"
 gdp_republic_unrest.0301.c.success: "密かに脱出することに成功する"
 gdp_republic_unrest.0301.c.fail: "捕らえられてしまう"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "私の治世は終わった。"
 gdp_republic_unrest.0301.d.flavor: "窓辺へ歩み寄り、退位を宣言する。その後、命だけは助かるよう祈りながら、丸腰で外へ出る。"
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "首都の蜂起：大いなる静寂"
 gdp_republic_unrest.0302.desc: "宮殿は静まり返っている。\n\n倒れた者たちの亡骸はまだ運び出されておらず、反乱者の最後の一団が逃げていった後も、門は開いたままだ。私の手の震えは…ほとんど収まった。\n\n私はまだここにいる。"
 gdp_republic_unrest.0302.a: "私はまだ…立っているのか？"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "首都の蜂起：新たな名、新たな人生"
 gdp_republic_unrest.0303.desc: "私は生きている。\n\n私は街を後にした。この通りでは、誰も私が何者か知らない。称号も、宮殿も…長年にわたって私を形作ってきたものは、すべて失われた。\n\nだが、それでも。私は生き延びた。生き延びたことにはきっと意味がある。さて、どこへ向かおうか？"
 gdp_republic_unrest.0303.a: "[destination_a.GetNameNoTierNoTooltip]へ向かおう。新しい人生が待っている。"
 gdp_republic_unrest.0303.a.tt: "[destination_a.GetNameNoTier]に行き、本拠地を移す"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip]なら十分遠い。あそこでやり直そう。"
 gdp_republic_unrest.0303.b.tt: "[destination_b.GetNameNoTier]に行き、本拠地を移す"
 gdp_republic_unrest.0303.c: "誰も私の名を知らない場所へ行こう。[destination_c.GetNameNoTierNoTooltip]で十分だ。"
 gdp_republic_unrest.0303.c.tt: "[destination_c.GetNameNoTier]に行き、本拠地を移す"
 gdp_republic_unrest.0303.d: "ほかに行く当てはない。ここに残り、誰かの役に立とう。"
 gdp_republic_unrest.0303.tt: "すべての[domicile_buildings|E]が払い戻される"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.GetTitleAsNameNoTooltip]の死"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName]は死亡した。[old_doge.GetHeShe]は蜂起で命を落とし、宮殿は静まり返っている。\n\nこの先どうなるかは、誰にもわからない。"
 gdp_republic_unrest.0304.a: "これですべてが変わる。"
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.GetTitleAsNameNoTooltip]の失踪"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName]は姿を消した。遺体も、別れの言葉もなく、暴徒が門前に迫る夜、忽然と姿を消したのだ。\n\nこの先どうなるかは、誰にもわからない。"
 gdp_republic_unrest.0305.a: "これですべてが変わる。"
 gdp_republic_unrest.0306.t: "首都の蜂起：新たな街、新たな人生"
 gdp_republic_unrest.0306.desc: "私は振り返らないよう努めながら、長い道のりを歩いた。\n\nこの場所では、まだ誰も私の名を知らない。市場の様子も見慣れず、行き交う人々の顔も知らないものばかりだ。それでもここには稼ぐ手段があり、新たに同盟を結ぶこともできる。残されたわずかなもので、人生を立て直すことができるのだ。"
 gdp_republic_unrest.0306.a: "仕事に取りかかろう。"
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "首都の蜂起：広場の暗殺者"
 gdp_republic_unrest.0311.desc: "市場を通り抜けようとしたとき、群衆が私の前で左右に分かれた。喧噪は一瞬にして静まり返る。突然、何者かがこちらに猛進してくる。その手には剣が握られている。\n\n後方にいる護衛の者たちでは間に合わない。迷っている暇はない。"
 gdp_republic_unrest.0311.a: "私の剣はどこだ！？"
 gdp_republic_unrest.0311.a.success: "間一髪で身を守る"
 gdp_republic_unrest.0311.a.fail: "護衛が駆けつける前に、[assassin.GetSheHe|U]が私に迫る"
 gdp_republic_unrest.0311.b: "ここから逃げなければ。今すぐだ。"
 gdp_republic_unrest.0311.b.success: "暗殺者をうまくかわす"
 gdp_republic_unrest.0311.b.fail: "逃げ場はどこにもない"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "首都の蜂起：それでも立っている"
 gdp_republic_unrest.0312.desc: "混乱の中、群衆は散り散りになった。どうにか私は生き延びたようだ。\n\n追いついた護衛に始末された暗殺者の遺体を見下ろす。どこにでもいるような職人にしか見えない。\n\n何の変哲もない庶民にさえ命を狙われるような状況で、安全な場所などあるのだろうか？"
 gdp_republic_unrest.0312.a: "と…とにかく館に戻ろう。"
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "首都の蜂起：血には血を"
 gdp_republic_unrest.0321.desc: "深夜、書斎に使者が現れ、一通の手紙を渡してきた。\n\n市内で一部の暴徒が私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))]である[heir.GetFirstName]を拉致し、明朝までに私が市を去らない場合は、この居館に[heir.GetHerHis]の遺体を届けると書かれている。"
 gdp_republic_unrest.0321.rival: "[heir.GetHerHim]はくれてやる。"
 gdp_republic_unrest.0321.a: "衛兵を向かわせろ。[heir.GetHerHim]を連れ戻せ。"
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U]が生き延びる"
 gdp_republic_unrest.0321.a.success: "衛兵が無事[heir.GetHerHim]を救出した"
 gdp_republic_unrest.0321.a.fail: "衛兵が間に合わない"
 gdp_republic_unrest.0321.b: "[heir.GetHerHim]をどこに拘束しているのか突き止めろ。"
 gdp_republic_unrest.0321.b.success: "衛兵が[heir.GetHerHim]の居場所を突き止める"
 gdp_republic_unrest.0321.b.fail: "[heir.GetSheHe|U]が見つからない"
 gdp_republic_unrest.0321.c: "全財産を払う。[heir.GetHerHim]を取り返せ。"
 gdp_republic_unrest.0321.d: "[heir.GetFirstNameNoTooltip]がいなければ、この称号に意味はない。"
 gdp_republic_unrest.0321.d.flavor: "[heir.GetHerHim]を救えるなら、代償を払う価値はある。"
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "首都の蜂起：生還"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip]はぎこちない笑みを浮かべながら、私の書斎へと入ってきた。無事で、生きている。今はそれだけが重要だ。\n\nこのようなことは二度と起きてはならない。"
 gdp_republic_unrest.0322.desc.rival: "使用人が部屋に来て知らせを伝える。[heir.GetFirstNameNoTooltip]が帰ってきたらしい。\n\nよかった。ひとまず継承権に揺るぎはない。このようなことは二度と起きてはならない。"
 gdp_republic_unrest.0322.a: "ああ、帰ってきたか！"
 gdp_republic_unrest.0322.a.rival: "よし。これで仕事に戻れる。"
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "首都の蜂起：手遅れ"
 gdp_republic_unrest.0323.desc: "暗くなってから、門を叩く音がした。外で声が聞こえたと思ったら、やがて静かになる。\n\n中庭へたどり着いた時には、もうわかっていた。[heir.GetFirstNameNoTooltip]が、石床の上に横たわっている。暴徒が[heir.GetHerHim]の亡骸を届けに来たのだ。"
 gdp_republic_unrest.0323.desc.rival: "暗くなってから、門を叩く音がした。中庭へたどり着いた時には、もうわかっていた。\n\n[heir.GetFirstNameNoTooltip]が、石床の上に横たわっている。暴徒が[heir.GetHerHim]の亡骸を届けに来たのだ。変わり果てた姿を見ながら、私は長い間そこに立ち尽くした。"
 gdp_republic_unrest.0323.a.child: "なんと無残な姿にされたものか…"
 gdp_republic_unrest.0323.a: "[heir.GetFirstNameNoTooltip]、奴らに何をされた？"
