 gdp_tgf_known_mark_modifier: "名の知れた商標"
 gdp_tgf_known_mark_modifier_desc: "この交易路沿いの買い手たちは、ある交易商人の商標が付いた品を真っ先に探す。"
 gdp_tgf_kept_edge_modifier: "商売上の秘密"
 gdp_tgf_kept_edge_modifier_desc: "この人物は、大金を積まれても仕入れ先の名を明かさなかった。"
 gdp_tgf_price_war_modifier: "身を切る値下げ"
 gdp_tgf_price_war_modifier_desc: "この人物は、価格を限界まで引き下げ、商売敵の利益まで容赦なく削っている。"
 gdp_tgf_vein_share_modifier: "商人出資の採掘場"
 gdp_tgf_vein_share_modifier_desc: "この伯爵領にある採掘場の権益を一部買い取った交易商人は、荷車一台分の採掘物も逃すまいと目を光らせている。"
 gdp_tgf_ballast_trick_modifier: "金になる底荷"
 gdp_tgf_ballast_trick_modifier_desc: "この交易路では、船の重しに使う底荷でさえ利益を生む。"
 gdp_tgf_hop_trader_modifier: "ホップ商人"
 gdp_tgf_hop_trader_modifier_desc: "この交易商人は、ホップを使って醸造したビールを売っている。長旅でも鮮度が落ちず、領主にグルート税を納める必要もない。"
