 gdp_tgf_watched_bidding_renowned_modifier_desc: "$gdp_tgf_watched_bidding_modifier_desc$"
 gdp_tgf_bled_by_the_handful_modifier: "貧者の小銭"
 gdp_tgf_bled_by_the_handful_modifier_desc: "この地の貧しい人々は、なけなしの金をはたいては、ある交易商人の商品を少しずつ買っている。"
 gdp_tgf_market_day_crowds_modifier: "市の日の賑わい"
 gdp_tgf_market_day_crowds_modifier_desc: "この市場には、伯爵領の各地から買い手が集まってくる。"
