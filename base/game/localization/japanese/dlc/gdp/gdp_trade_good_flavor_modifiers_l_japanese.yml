l_japanese:
 gdp_tgf_heavier_loads_modifier: "積み荷の重量増加"
 gdp_tgf_seven_storehouses_modifier: "7つの倉"
 gdp_tgf_seven_storehouses_modifier_desc: "この交易商人は、凶作の年に備えて倉を建て、そのすべてを常に蓄えで満たしている。"
 gdp_tgf_sweet_reputation_modifier: "甘美な評判"
 gdp_tgf_sweet_reputation_modifier_desc: "この交易商人はかつて、ある王子の宴に実物よりも大きな鳥の砂糖細工を贈った。味わった者たちは、今なおその話を語り続けている。"
 gdp_tgf_beekeeper_modifier: "養蜂家"
 gdp_tgf_beekeeper_modifier_desc: "この交易商人は、倉庫の屋根裏で蜂を飼っている。蜂たちは家賃代わりに蜂蜜を納めてくれるうえ、どんな書物よりも多くのことを教えてくれた。"
 gdp_tgf_alcohol_opportunist_modifier: "偶然の醸造家"
 gdp_tgf_alcohol_opportunist_modifier_desc: "この交易商人はかつて、積み荷の果物を腐るに任せていたら酒になっていたことがある。以来、安い酒樽には目ざとくなった。"
 gdp_tgf_two_grades_modifier: "油の等級分け"
 gdp_tgf_two_grades_modifier_desc: "この交易商人は、底にたまった濁り油は灯り用に、澄んだ油は食卓用にと売り分け、値段にもきっちり差をつけている。"
 gdp_tgf_road_millet_modifier: "道中のキビ"
 gdp_tgf_road_millet_modifier_desc: "この交易商人は、旅には必ずキビを一袋携えていく。キビは何年も長持ちし、持ち歩く者もまた長持ちするのだ。"
 gdp_tgf_cheap_rice_modifier: "安価な米"
 gdp_tgf_cheap_rice_modifier_desc: "この伯爵領の市場では、玄米が安く出回っており、そのおかげで誰も飢えずに済んでいる。"
 gdp_tgf_keeps_the_fast_modifier: "断食を守る者"
 gdp_tgf_keeps_the_fast_modifier_desc: "この交易商人は、一年中肉を売る一方で、断食の時期には皆と同じように断食する。腹を空かせた者が何になら金を出すのか、誰よりもよく分かっている。"
 gdp_tgf_parchment_supplier_modifier: "羊皮紙の供給者"
 gdp_tgf_parchment_supplier_modifier_desc: "この交易商人が扱う皮のうち、最上のものはやがて写本のページとなる。今もどこかで、そこに聖なる言葉が綴られている。"
 gdp_tgf_temple_supplier_modifier: "寺院御用達"
 gdp_tgf_temple_supplier_modifier_desc: "寺院は真っ先にこの交易商人から香を買い付け、ときおりその売り手のために祈りも捧げてくれる。"
 gdp_tgf_chancery_stationer_modifier: "文書局御用達"
 gdp_tgf_chancery_stationer_modifier_desc: "この交易商人は、ある文書局に紙を納めており、その話を聞きつけた書記は誰もが同じ紙を欲しがる。"
 gdp_tgf_tall_mast_modifier: "高い帆柱"
 gdp_tgf_tall_mast_modifier_desc: "この交易商人の持ち船には沿岸随一の帆柱が立っており、そのおかげでほかの船よりも遠くまで航海できる。"
 gdp_tgf_our_timber_modifier: "自前の木材で造った船"
 gdp_tgf_our_timber_modifier_desc: "帆柱にこの交易路の木材を用いた船は、ここで扱う品々を以前よりも遠くまで運べるようになった。"
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
 gdp_tgf_our_timber_renowned_modifier_desc: "$gdp_tgf_our_timber_modifier_desc$"
 gdp_tgf_heavier_loads_modifier_desc: "この交易路では、安全を顧みないほど積み荷が詰め込まれている。"
 gdp_tgf_builders_rate_castle_full_modifier: "城壁用の石材"
 gdp_tgf_builders_rate_castle_full_modifier_desc: "この伯爵領の城には、建築業者向けの割安な値で石材が納められている。"
 gdp_tgf_builders_rate_castle_small_modifier: "高くついた城壁"
 gdp_tgf_builders_rate_castle_small_modifier_desc: "この伯爵領の城には、高値で石材が納められている。"
 gdp_tgf_builders_rate_church_full_modifier: "寺院用の石材"
 gdp_tgf_builders_rate_church_full_modifier_desc: "この伯爵領の寺院には、建築業者向けの割安な値で石材が納められている。"
 gdp_tgf_builders_rate_church_small_modifier: "高くついた寺院"
 gdp_tgf_builders_rate_church_small_modifier_desc: "この伯爵領の寺院には、高値で石材が納められている。"
 gdp_tgf_builders_rate_city_full_modifier: "波止場用の木材"
 gdp_tgf_builders_rate_city_full_modifier_desc: "この伯爵領の都市には、建築業者向けの割安な値で木材が納められている。"
 gdp_tgf_builders_rate_city_small_modifier: "高くついた波止場"
 gdp_tgf_builders_rate_city_small_modifier_desc: "この伯爵領の都市には、高値で木材が納められている。"
 gdp_tgf_builders_rate_generic_full_modifier: "良心的な価格"
 gdp_tgf_builders_rate_generic_full_modifier_desc: "この伯爵領の建築業者には、良心的な価格で資材が納められている。"
 gdp_tgf_builders_rate_generic_small_modifier: "商人の言い値"
 gdp_tgf_builders_rate_generic_small_modifier_desc: "この伯爵領の建築業者には、商人の言い値で資材が納められている。"
 gdp_tgf_keep_the_best_modifier: "とっておきの資材"
 gdp_tgf_keep_the_best_modifier_desc: "この人物は、最上の建築資材を自らの建設のために取っておいた。"
 gdp_tgf_plentiful_stalls_modifier: "品揃え豊かな露店"
 gdp_tgf_plentiful_stalls_modifier_desc: "ある交易商人が、この伯爵領の露店を選りすぐりの森の恵みであふれさせた。"
 gdp_tgf_well_supplied_host_modifier: "補給万全の軍勢"
 gdp_tgf_well_supplied_host_modifier_desc: "この人物の軍勢は、ある交易商人が絶えず届ける物資を糧に進軍する。"
 gdp_tgf_bee_stung_modifier: "蜂刺され"
 gdp_tgf_bee_stung_modifier_desc: "この人物は、蜂だらけの倉庫に蜂蜜を採りにいき、返り討ちに遭った。"
 gdp_tgf_awake_and_alert_modifier: "眠気知らず"
 gdp_tgf_awake_and_alert_modifier_desc: "この人物は、茶を何杯も飲み干しては、夜通し帳簿の勘定に励んでいる。"
 gdp_tgf_tea_drinker_modifier: "茶の愛飲家"
 gdp_tgf_tea_drinker_modifier_desc: "この人物は、交易商人の茶の習慣がうつり、ついでに頭も冴えるようになった。"
 gdp_tgf_well_grazed_meadows_modifier: "放牧で肥えた牧草地"
 gdp_tgf_well_grazed_meadows_modifier_desc: "ある交易商人の家畜がこの伯爵領の牧草地で肥え太り、おかげで草はいっそう青々と茂るようになった。"
 gdp_tgf_lacquer_rash_modifier: "漆かぶれ"
 gdp_tgf_lacquer_rash_modifier_desc: "この人物は、固まる前の漆に触れてしまい、漆に負けた。"
 gdp_tgf_curing_room_modifier: "漆の乾燥室"
 gdp_tgf_curing_room_modifier_desc: "この交易商人は、湿気をこもらせた部屋で、漆を一層ずつじっくりと乾かしている。その仕上がりの違いは、買い手にも一目瞭然だ。"
 gdp_tgf_theriac_supply_modifier: "テリアカの供給"
 gdp_tgf_theriac_supply_modifier_desc: "ある交易商人の扱う原料から調合されたテリアカが、この伯爵領の市場に出回っている。"
 gdp_tgf_theriac_dose_modifier: "一服のテリアカ"
 gdp_tgf_theriac_dose_modifier_desc: "この人物は、テリアカを一服飲んで以来、その効き目を信じて疑わない。"
 gdp_tgf_theriac_peddlers_modifier: "テリアカの行商人"
 gdp_tgf_theriac_peddlers_modifier_desc: "この交易路では、どの町でもテリアカがよく売れる。そのため、隊商が荷を半分しか積まずに旅立つことはない。"
