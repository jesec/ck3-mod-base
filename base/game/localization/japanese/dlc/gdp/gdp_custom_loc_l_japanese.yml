l_japanese:
 dinar: "ディナール"
 dinar_plural: "ディナール"
 dinar_gloss: "[Glossary('ディナール', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('ディナール', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "#bold ディナール#!、または#emp デナール#!は、7世紀にウマイヤ朝が導入した金貨で、ビザンツ帝国の金貨[Glossary('ソリドゥス', 'SOLIDUS_GLOSS')]と同等のものとして作られた。ただし、その名称は銀貨[Glossary('デナリウス', 'DENARIUS_GLOSS')]に由来する。\n\nディナールはアラブ世界全域に広まり、現在も複数の通貨の単位としてその名が使われている。"
 denarius: "デナリウス"
 denarius_plural: "デナリウス"
 denarius_gloss: "[Glossary('デナリウス', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('デナリウス', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "#bold デナリウス#!は、もともとはローマ共和政期に使用された銀貨で、帝政期には品位が低下していた。\n\nしかし、この名称はローマの影響圏で通貨一般を指す言葉として残り、後世のカロリング朝の銀貨[Glossary('デナール', 'PENNY_GLOSS')]やアラブ世界の金貨[Glossary('ディナール', 'DINAR_GLOSS')]にも受け継がれている。"
 ducat: "デュカット"
 ducat_plural: "デュカット"
 ducat_gloss: "[Glossary('デュカット', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('デュカット', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: " #bold ドゥカート#!、または#emp ドガード#!は、13世紀にヴェネツィアが導入した金貨である。ビザンツ帝国の金貨[Glossary('ソリドゥス', 'SOLIDUS_GLOSS')]の品位低下を受け、フィレンツェの[Glossary('フローリン', 'FLORIN_GLOSS')]やジェノヴァの#emp ジェノヴィーノ#!に匹敵する金貨として発行された。この名称はヴェネツィアの#emp ドージェ#!（総督）の称号に由来する。\n\n発行後間もなく交易で極めて高く評価されるようになり、ヨーロッパの各地やその周辺へと広まって標準通貨として模倣された。"
 dirham: "ディルハム"
 dirham_plural: "ディルハム"
 dirham_gloss: "[Glossary('ディルハム', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('ディルハム', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "#bold ディルハム#!（あるいは#emp ドラム#!）は、7世紀にウマイヤ朝によって導入され、アラビア語圏全域に採用された銀貨である。その名称は古典期およびヘレニズム期の古代ギリシャの#emp ドラクマ#!銀貨に由来する。\n\nイスラム世界における標準的な重さの単位としても広く普及し、その名称は現在でもいくつかの現代通貨の単位として使用されている。"
 aureus: "アウレウス"
 aureus_plural: "アウレウス"
 aureus_gloss: "[Glossary('アウレウス', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('アウレウス', 'AUREUS_GLOSS')]"
 solidus: "ソリドゥス"
 solidus_plural: "ソリドゥス"
 solidus_gloss: "[Glossary('ソリドゥス', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('ソリドゥス', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "#bold ソリドゥス#!（あるいは文字通り「硬貨」を意味する#emp ノミスマ#!）は、それまでのローマの[Glossary('アウレウス', 'AUREUS_GLOSS')]に代わるものとして4世紀にビザンツ帝国によって導入され、11世紀に[Glossary('ヒュペルピュロン', 'HYPERPYRON_GLOSS')]に取って代わられるまで流通した金貨である。\n\n13世紀までにはその品位も低下し、イタリアの諸共和国で金貨（[Glossary('ダカット', 'DUCAT_GLOSS')]、[Glossary('フローリン', 'FLORIN_GLOSS')]、#emp ジェノヴィーノ#!など）が導入されることとなった。\n\nソリドゥスは北欧では#emp シリング#!として知られていたが、8世紀のカール大帝の貨幣改革によって、銀貨の価値を示す計算単位として定められた。"
 hyperpyron: "ヒュペルピュロン"
 hyperpyron_plural: "ヒュペルピュロン"
 hyperpyron_gloss: "[Glossary('ヒュペルピュロン', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('ヒュペルピュロン', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "#bold ヒュペルピュロン#!は「高度に精錬されたもの」を意味し、ヨーロッパでは#emp ベザント#!として知られる金貨である。11世紀にビザンツ帝国が、それまでの金貨[Glossary('ソリドゥス', 'SOLIDUS_GLOSS')]に代わるものとして導入した。\n\n#emp ソリドゥス#!ほど品位が低下したわけではなかったが、ヒュペルピュロンの価値も13世紀までには大きく下落した。これを受け、イタリアの諸共和国では[Glossary('ダカット', 'DUCAT_GLOSS')]、[Glossary('フローリン', 'FLORIN_GLOSS')]、#emp ジェノヴィーノ#!が導入された。"
 bezant: "ベザント"
 bezant_plural: "ベザント"
 bezant_gloss: "[Glossary('ベザント', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('ベザント', 'HYPERPYRON_GLOSS')]"
 florin: "フローリン"
 florin_plural: "フローリン"
 florin_gloss: "[Glossary('フローリン', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('フローリン', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: " #bold フローリン#!は、ビザンツ帝国の[Glossary('ソリドゥス', 'SOLIDUS_GLOSS')]と[Glossary('ヒュペルピュロン', 'HYPERPYRON_GLOSS')]の品位低下を受け、13世紀にフィレンツェ共和国が導入した金貨である。その後まもなく、ジェノヴァの#emp ジェノヴィーノ#!とヴェネツィアの[Glossary('ダカット', 'DUCAT_GLOSS')]も登場した。\n\n#emp ダカット#!と同様に、フローリンは広く流通する交換用貨幣となり、ヨーロッパ各地の多くの造幣所で模倣品が発行された。この名称はハンガリーの#emp フォリント#!にも受け継がれている。"
 penny: "ペニー"
 penny_plural: "ペニー"
 penny_gloss: "[Glossary('ペニー', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('ペニー', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "#bold プフェニヒ#!、または#emp ペニー#!は、8世紀にカール大帝が導入した標準化銀貨であり、それ以前のローマ世界で広く流通していた銀貨[Glossary('デナリウス', 'DENARIUS_GLOSS')]に相当するものだった。\n\nプフェニヒは間もなくヨーロッパ各地に広まり、標準貨幣として模倣されるようになった。その後何世紀にもわたり、#emp デナール#!、#emp ドゥニエ#!、#emp ディネロ#!などの名称が、プフェニヒと同じ重量の銀貨を指す言葉として互換的に使われた。"
 pfennig: "プフェニヒ"
 pfennig_plural: "プフェニヒ"
 pfennig_gloss: "[Glossary('プフェニヒ', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('プフェニヒ', 'PENNY_GLOSS')]"
 denier: "ドゥニエ"
 denier_plural: "ドゥニエ"
 denier_gloss: "[Glossary('ドゥニエ', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('ドゥニエ', 'PENNY_GLOSS')]"
 dinero: "ディネロ"
 dinero_plural: "ディネロ"
 dinero_gloss: "[Glossary('ディネロ', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('ディネロ', 'PENNY_GLOSS')]"
 denaro: "デナロ"
 denaro_plural: "デナロ"
 denaro_gloss: "[Glossary('デナロ', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('デナロ', 'PENNY_GLOSS')]"
 denar: "デナール"
 denar_plural: "デナール"
 denar_gloss: "[Glossary('デナール', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('デナール', 'PENNY_GLOSS')]"
 groschen: "グロッシェン"
 groschen_plural: "グロッシェン"
 groschen_gloss: "[Glossary('グロッシェン', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('グロッシェン', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "「分厚いペニー」を意味する#bold グロッシェン#!は、ヴェネツィアの同等貨幣#emp グロッソ#!の発行を受けて13世紀にチロル伯マインハルト2世によって導入された大型の銀貨であり、当初は12[Glossary('プフェニヒ', 'PENNY_GLOSS')]の価値があった。\n\nこの貨幣規格は間もなくヨーロッパ各地へ広まり、ボヘミアのクトナー・ホラやマイセンのフライベルクにあった造幣所が著名な発行地となった。"
 tongbao: "通宝"
 tongbao_plural: "通宝"
 tongbao_gloss: "[Glossary('通宝', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('通宝', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "「巡り廻る宝」を意味する#bold 通宝#!は、7世紀に唐朝によって初めて発行された[Glossary('銭', 'QIAN_GLOSS')]という様式の青銅合金製の鋳造貨幣に付けられた名称である。\n\nこれは中華文化圏全域において標準的な取引単位となり、今日でも伝統的な中医学に用いられるほか、縁起物としても使われている。"
 qian: "銭"
 qian_plural: "銭"
 qian_gloss: "[Glossary('銭', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('銭', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "「金（かね）」を意味する#bold 銭#!は、戦国時代に始まり、中国全土で取引単位として広く普及した銅合金の鋳造貨幣を指す総称である。\n\n中央の四角い穴は複数の銭を棒に通して鋳造後の縁をまとめて滑らかに研磨するのに役立ったほか、大きな取引のために大量の硬貨を紐でまとめることを可能にした。一般的には1,000枚の銭を1連にしていた。こうした銭を手本として、日本や朝鮮、ベトナムなどでも同様の鋳造貨幣が作られるようになった。"
 mon_coin: "文"
 mon_coin_plural: "文"
 mon_coin_gloss: "[Glossary('文', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('文', 'QIAN_GLOSS')]"
 tanka: "タンカ"
 tanka_plural: "タンカ"
 tanka_gloss: "[Glossary('タンカ', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('タンカ', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "#bold タンカ#!、あるいは#emp タカ#!は、13世紀にデリー・スルタン朝によって導入された銀貨である\n\nインド全土および周辺地域に広まって盛んに模倣され、シルクロードにおける標準的な取引単位となった。"
 jital: "ジタール"
 jital_plural: "ジタール"
 jital_gloss: "[Glossary('ジタール', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('ジタール', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold ジタール#!は、もともと8世紀にカーブルで導入された牡牛と馬を駆る戦士の図柄を持つ銀貨である。\n\nこの図柄は周辺地域にも広まり、多くの模倣貨幣が発行されたが、やがて価値が下落し、銅の含有量が次第に増えていった。16世紀までには#emp ジタール#!は完全な銅貨となった。"
 coin: "硬貨"
 coin_plural: "硬貨"
 coin_gloss: "硬貨"
 coin_gloss_plural: "硬貨"
 bazaar: "バザール"
 bazaar_plural: "バザール"
 bazaar_gloss: "[Glossary('バザール', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('バザール', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold バザール#!、あるいは#emp バザル#!は市場を意味するペルシャ語の言葉であり、印欧祖語に由来する。後にアラビア語にも取り入れられ、現在では西アジア、インド、そしてそれ以外の地域でも広く使用されている。"
 khrom: "クロム"
 khrom_plural: "クロム"
 khrom_gloss: "[Glossary('クロム', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('クロム', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold クロム#!は市場を指すチベット語の言葉であり、シルクロード沿いの周辺地域でも使われるようになった。"
 shuka: "シュカ"
 shuka_plural: "シュカ"
 shuka_gloss: "[Glossary('シュカ', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('シュカ', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold シュカ#!はコーカサス諸語において市場を意味する言葉である。アラビア語の[Glossary('スーク', 'SUQ_GLOSS')]と同様に、もともとはアッカド語で「通り」を意味する語に由来するが、シリア語を経由して借用された。"
 suq: "スーク"
 suq_plural: "スーク"
 suq_gloss: "[Glossary('スーク', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('スーク', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold スーク#!は市場を意味するアラビア語であり、もとはアッカド語で「通り」を意味する語をアラム語経由で借用したもので、現在ではイスラム圏をはじめ、その周辺地域でも広く使われている。"
 market_custom: "市場"
 market_custom_plural: "市場"
 market_custom_gloss: "市場"
 market_custom_gloss_plural: "市場"
 burgher: "市民"
 burgher_plural: "市民"
 patrician: "市民"
 patrician_plural: "市民"
 freeman: "自由民"
 freeman_plural: "自由民"
 artifact_curious: "好奇心をそそる"
 artifact_fascinating: "魅力的な"
 artifact_impressive: "印象的な"
 artifact_magnificent: "壮麗な"
 artifact_parrot: "インコ"
 artifact_cockatoo: "オウム"
 artifact_monkey: "サル"
