 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.8502.desc: "少しずつ盗んで集めた帳簿、聞き出した噂話、取り入って得た断片的な情報が、[target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]の数多くの買い手、売り手、その他のつながりを浮かび上がらせていく。\n\nこれらの情報があれば、[target.GetTitledFirstNamePossessive]が得意とする商品の取引で、より対等な立場で競争できることは間違いない。"
 scheme_critical_moments.8502.discovered: "\n\nなんということだ。我々が探りを入れていることが[target.GetTitledFirstNameNoTooltip]に気付かれた…"
 scheme_critical_moments.8502.a: "素晴らしい！"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U]は[target.GetShortUINamePossessive]の商会から$steal_market_insights$ことに成功したが、工作が発覚してしまった！"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.8503.desc: "行商人たちと何日も言葉を交わし続け、今にも消えそうな蝋燭の明かりの下、夜通し囁き声を交わしてきたが、我々は未だ[target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]の事業について、何の情報も得られていない…\n\n[target.GetTitledFirstNamePossessive]の事務所から持ち出した書類でさえ、意味のない走り書きか、古い集計表にすぎなかったのだ。"
 scheme_critical_moments.8503.discovered: "\n\nその上、我々の企みは[target.GetTitledFirstNameNoTooltip]に察知されてしまったようだ。"
 scheme_critical_moments.8503.fallback: "\n\n我々の企みが[target.GetTitledFirstNameNoTooltip]に察知されていないことだけが、せめてもの慰めだ。"
 scheme_critical_moments.8503.a: "時間の無駄だった…"
