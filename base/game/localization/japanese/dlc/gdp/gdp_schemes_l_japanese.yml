 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.8402.desc: "[target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の奥深くで、私は[target_patron.GetTitledFirstNamePossessive]の判事たちが気だるげに大量の書類を調べているのを見守っている。判が心地良い音を立てて押されるたびに、[target.GetHouse.GetName]の資産が[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]に移されたことがわかる。\n\n彼らの頭上をハエがのんびりと飛び回っている。だがその静けさは、突然部屋に飛び込んできた[target.GetFirstName]によって破られた。\n\n#EMP 「貴様！#!」[target.GetSheHe]が憎しみを込めて声を絞り出した。「一体何をした！？#DIE2 どうして…！？#!」"
 scheme_critical_moments.8402.a: "これも仕事のうちだ…"
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.8403.desc: "[target_patron.GetTitledFirstName]に何度も詰め寄り、あれこれと駆け引きを重ねた末、買収成立まであと一歩のところまで進んだ。だが、その直前に[target.GetTitledFirstName]に我々の企みを気取られてしまった…\n\n[target.GetPrimaryTitle.GetDefinitiveName]は今や完全に警戒態勢に入り、法廷で連中を出し抜くことは困難になってしまった。"
 scheme_critical_moments.8403.discovered: "\n\n挙句の果てに、[target.GetTitledFirstNameNoTooltip]は裏で糸を引いているのが我々だと確実に気付いている…"
 scheme_critical_moments.8403.fallback: "\n\n[target.GetTitledFirstNamePossessiveNoTooltip]が我々の関与を感知していないのがせめてもの救いだ…"
 scheme_critical_moments.8403.a: "これだから…"
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U]は[target.GetShortUINamePossessive]の商会の$hostile_takeover$を試みたが、失敗した！"
 scheme_critical_moments.8404.t: "敵対的買収：[owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "我々はこれまで、交易路の日々の収支を細かく確認し、有望な取引相手を求めて泥の中を嗅ぎ回っていた。だが今日、注意すべきところを完全に見誤っていたことが判明した。\n\n[target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]から、簡素な書状が届いた。今日の裁判手続きを正式に知らせるものだ。その手続きによって我々の商会は解散し、資産は[owner.GetPrimaryTitle.GetDefinitiveName|l]に#EMP 奪われる#!というのだ！\n\n私が到着した時には、すでに手遅れだった。いや、そもそも最初から手遅れだったのだ…\n\nあの悪党、[owner.GetTitledFirstName]は、私が必死に書類を調べる様子を見て、薄ら笑いを浮かべている。しかも、このすべてを我が後援者の[target_patron.GetTitledFirstName]が認めていたのだ！"
 scheme_critical_moments.8404.a: "一体何をした！？#DIE2 どうして…#!"
