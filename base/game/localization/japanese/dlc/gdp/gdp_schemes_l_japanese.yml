 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.8602.desc: "[trade_post_county.GetName]の行政官たちに袖の下を渡す必要があったが、その額はさほど高くなかった。印が一つずつ押されるたびに、[trade_post_province.GetName]の交易所の権利が我々のものになっていく。\n\n[target.GetTitledFirstName]がその知らせを聞くころには、我々の代理人はすでに[target.GetHerHis]の事務員を追い出し、戸口の上に掲げられた[target.GetHerHis]の旗印を塗りつぶしているだろう。"
 scheme_critical_moments.8602.a: "なかなかの拠点が手に入った。"
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.8603.desc: "賄賂はすべて受け取られ、約束はすべて破られた。[trade_post_county.GetName]の行政官たちは私の金を懐に入れながら、私の所有権を認めなかった。\n\n[target.GetTitledFirstNamePossessive|U]の所有権は揺るがないままだ。"
 scheme_critical_moments.8603.discovered: "\n\nさらに悪いことに、[target.GetTitledFirstNameNoTooltip]は[target.GetHerHis]の懐に手を伸ばしたのが誰なのか、正確に知っている…"
 scheme_critical_moments.8603.fallback: "\n\n少なくとも、この件に我々が関与したことは露見していない。"
 scheme_critical_moments.8603.a: "信用ならない連中に金を使ってしまった。"
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U]は[trade_post_province.GetNameNoTooltip]にあるあなたの[trade_post|E]を奪おうとしたが、失敗した！"
 scheme_critical_moments.8604.t: "交易所を奪われた：[trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "[trade_post_county.GetName]から騎手が知らせを運んできた。我々の代理人は外へ放り出され、地元の行政官たちは私を歓迎しないと宣言し、[trade_post_province.GetName]の交易所の所有者に別人を立てた。\n\n何年もかけて築いた交易の実績、蓄え、苦労して得た信頼、それらすべてが、我々がすでに金を支払った連中の手によって、他人に譲り渡されてしまった。"
 scheme_critical_moments.8604.discovered: "\n\nそして今、[owner.GetTitledFirstName]が私に取って代わり、まるで最初から[owner.GetHersHis]のものだったかのように振る舞っている。この仕打ちは#EMP 決して#!忘れない！"
 scheme_critical_moments.8604.a: "自分の店先から追い出されるとは！"
