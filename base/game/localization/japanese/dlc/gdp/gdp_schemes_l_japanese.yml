 start_patrician_find_secrets_notification: "$patrician_find_secrets$"
 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "私は[target.GetHouse.GetName]家に危うく同情しかけた。一族の最も醜聞めいた秘密を、召使いや仲間を名乗る者たちが、私の工作員にいとも簡単に、いや、#EMP 嬉々として#!漏らしたからである。とはいえ、あくまで同情は#EMP しかけた#!だけだ。\n\n私の手元にある証拠に疑いの余地はない。[secret_holder.GetTitledFirstName]は[secret_to_reveal.Custom('SecretDescriptionThirdPerson')]！"
 gdp_patrician_find_secrets.0002.a: "これで[secret_holder.GetHerHis|U]の評判は私の思うままだ。"
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "工作員たちは[target.GetHouse.GetName]家が捨てた書類をくまなく調べ、召使いたちを脅して口を割らせ、市場のすべての噂好きに賄賂まで渡した。それでも、価値ある情報は何一つ見つからなかった。\n\n[target.GetTitledFirstName]がその屋敷の奥に隠している秘密は、見つけられないほど深く埋もれているか、そもそも存在しないかのどちらかだ。"
 gdp_patrician_find_secrets.0003.desc.outmatched: "工作員たちは[target.GetHouse.GetName]家の動向をことごとく追ったが、その秘密の片鱗さえつかめなかった。一族の扉は守銭奴の財布より固く閉ざされ、召使いたちは口を堅く閉ざし、まるで舌など持ち合わせていないかのようだ。\n\n[target.GetTitledFirstName]がどれほど卑劣な行いをしていたとしても、調査を始めたときから新たにわかったことは何もない。"
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]！すべて無駄だった。"
