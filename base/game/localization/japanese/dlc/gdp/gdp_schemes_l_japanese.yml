 patrician_promote_ambition_bonus_tt: "成功した場合："
 scheme_critical_moments.1142.desc_patrician_self: "自己宣伝に費やした努力が報われた。\n\n同輩たちのあいだの評判は上がり、新たな支援者たちが私の[house|E]に押し寄せてくる。私はかつてないほど目標達成に近づいている！"
 scheme_critical_moments.1142.desc_patrician_other: "[target.GetTitledFirstNamePossessive]のために多くの時間と資源を費やした活動が、ついに実を結んだ。\n\n[target.GetHerHis|U]の同輩からの評判は高まり、新たな支持者たちも[target.GetHerHis|U]の価値を認めている。そして、[republic|E]国家における[target.GetHerHis|U]の地位も一段と向上した！"
 scheme_critical_moments.1143.desc_patrician_self: "自分の評判を高めるために力と資源を注いだが、それだけでは足りなかった。誰一人として私の価値に納得することも、私の公約や賄賂に揺れ動かされることもなく、私の評判は変わらぬままだ。\n\n一族の評判を高めるには、別の手を考える必要がある。"
 scheme_critical_moments.1143.desc_patrician_other: "$scheme_critical_moments.1143.desc_other$"
 patrician_promote_success_toast: "地位が向上した！"
