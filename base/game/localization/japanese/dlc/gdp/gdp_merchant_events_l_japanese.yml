 gdp_merchant.3000.t: "翻訳者からの助言"
 gdp_merchant.3000.desc: "我が商会の翻訳者、[translator.GetTitledFirstName]はここのところ部屋にこもっていたが、どうやら何か外国語の文書と格闘していたらしい。そして、しばらく振りに[translator.GetSheHe]が姿を見せた。\n\n「[ROOT.Char.GetTitleAsNameNoTooltip]！」翻訳者は満面の笑みを浮かべながら言う。「[market.GetName|l]で入手した報告書に目を通しておりました。[saved_culture.GetLanguage.GetName]の略記を読み解くのには苦労しましたが、地元の商品の流通について、多くのことが記されています！」"
 gdp_merchant.3000.a: "「隅々まで詳しく教えてくれ！」"
 gdp_merchant.3000.a.tt: "[market.GetName]で取引されているすべての[trade_categories_short|E]について、[company|E]が[trade_expertise|E]を獲得する"
 gdp_merchant.3000.b: "「この言語を私に教えてくれないか？」"
 gdp_merchant.3000.b.tt: "あなたの[scheme|E]が[GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]を得る"
 gdp_merchant.3000.c: "「最も高値をつけた者にこの調査結果を売り渡せ」"
 gdp_merchant.3000.d: "「語学力の向上に専念しろ」"
 gdp_merchant_translator_buff_modifier: "翻訳の個人授業"
 gdp_merchant.3010.t: "後始末役がつかんだ情報"
 gdp_merchant.3010.desc: "このところ、後始末役の[fixer.GetTitledFirstName]は[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の動静をしつこく嗅ぎ回っていたのだが、ついに[fixer.GetHerHis]が#EMP 例の件#!について突き止めたという意味深な伝言とともに会談の場を設けてきた。\n\n[fixer.GetSheHe|U]は思わせぶりに席に着き、"
 gdp_merchant.3010.desc.secret: "不敵な笑みを浮かべた。「なかなか骨は折れましたが、[secret_haver.GetName]がほぼ間違いなく[secret.GetName]である証拠を掴みました！」"
 gdp_merchant.3010.desc.scheme: "不安げな表情を浮かべる。「悪い知らせです。[scheme_owner.GetName]が[ROOT.Char.GetTitleAsNameNoTooltip]様に対し、いや、商会に対して陰謀を企てていることが判明いたしました！」"
 gdp_merchant.3010.a: "「よく知らせてくれた。これからも頼むぞ！」"
 gdp_merchant.3010.b: "「[fixer.GetFirstNameNoTooltip]よ、お前はなかなかの曲者のようだな」"
 gdp_merchant.3010.c: "「そのような怪しげな噂など信じるものか」"
 gdp_merchant.3010.d: "「これは利用価値がありそうだ…」"
 gdp_merchant.3020.t: "取り立て役の大言"
 gdp_merchant.3020.desc: "取り立て役の[bailiff.GetTitledFirstName]が、我々の[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]を手早く回収するにはどのような圧力をかけるのが良いか、債務者の一覧を眺めながらあれこれと思案している。\n\n"
 gdp_merchant.3020.pressure: "「[pressure_debtor_1.GetTitledFirstName]は金に困っているけれども、債務を返済する意志はあるようですし…」[bailiff.GetFirstNameNoTooltip]は困ったような声を漏らす。\n\n"
 gdp_merchant.3020.demand: "[bailiff.GetSheHe|U]はため息をつく。「確かな筋から聞いた話では、[demand_debtor_1.GetTitledFirstName]は支払いができないわけではなく…単に、我らより格上だとうぬぼれているだけなのですよ！」\n\n"
 gdp_merchant.3020.third: "「それに、[portrait_3.GetTitledFirstName]もおりますね…」取り立て役は小声で言う。"
 gdp_merchant.3020.a: "「ああ、確かに[pressure_debtor_1.GetFirstNameNoTooltip]ならば#EMP 少々の#!支払いは可能だろう」"
 gdp_merchant.3020.a.tt: "あなたへの債務が[gold_i] #V -[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#!減少する"
 gdp_merchant.3020.b: "「[demand_debtor_1.GetTitledFirstNameNoTooltip]に脅しをかけてやれ…」"
 gdp_merchant.3020.c: "「[pressure_debtor_2.GetFirstNameNoTooltip]なら少額の返済は可能だろう」"
 gdp_merchant.3020.d: "「[demand_debtor_2.GetFirstNameNoTooltip]が返済を先延ばしにしようとしているのは明らかだ！」"
 gdp_merchant.3020.e: "「返済義務があることを[pressure_debtor_3.GetFirstNameNoTooltip]に思い出させてやれ」"
 gdp_merchant.3020.f: "「そろそろ[demand_debtor_3.GetFirstNameNoTooltip]にはっきり言ってやらねば」"
 gdp_merchant.3020.g: "「借金漬けにしておくほうが都合が良い」"
 ho_loan_demand_refused_title: "返済の要求が拒絶された"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName]があなたに負う借金は、[gold_i] [outstanding|V0]のまま変化しない"
 ho_loan_reduced_title: "債務が減額された"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName]があなたに負う借金は、[gold_i] [outstanding|V0]になった"
 gdp_merchant.3031.t: "熱心な代理人"
 gdp_merchant.3031.desc: "市場代理人の[market_agent.GetTitledFirstName]は近ごろ夜更かしをして、周りの蝋燭が尽きかけるまで帳簿を熱心に読み込んでいる。今朝、私の書斎に入ってきた[market_agent.GetSheHe]は、眠たそうな目をしばたたかせていた。\n\n「[ROOT.Char.GetTitledFirstName]様！[market.GetName|l]に関する帳簿を精査しましたところ、極めて有望な好機が——」#weak *あくび*#!「これを利用しない手はございません！」"
 gdp_merchant.3031.a: "「よくやった。[market_agent.GetFirstNameNoTooltip]よ、まずはしっかりと休め！」"
 gdp_merchant.3031.a.tt: "[market.GetName|l]で[trade_opportunity.GetType.GetName|V]の[trade_opportunity|E]が発生する"
 gdp_merchant.3031.b: "「それは捨て置いて、喫緊の問題に専念せよ！」"
 gdp_merchant.3040.t: "宝物管理官の配慮"
 gdp_merchant.3040.desc: "宝物管理官の[antiquarian.GetTitledFirstName]は、[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]のコレクションに目を光らせ、それらが安全で良い状態に保たれるよう気を配るとともに、時おり訪れる客人に薀蓄を披露するなどしてもてなしをしている。\n\nある朝、私が[artifact.GetName]を鑑賞しようと足を止めたところ、管理官が機を捉えたように現れた。「これはこれは[ROOT.Char.GetTitleAsNameNoTooltip]様、これは逸品でございますよ。しかしながら、時々このように思うのです。これは他の蒐集品と比べ、一段格の落ちるものではないでしょうか？」"
 gdp_merchant.3040.b: "「手放し時だな。買い手を探してくれ」"
 gdp_merchant.3040.c: "「少し修繕が必要かもしれない」"
 gdp_merchant.3040.c.tt: "[artifact.GetName]はすでに万全の状態である"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName]は#V 獣#!である"
 gdp_merchant.3040.d: "「戯言を。このコレクションに瑕疵などない」"
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "ごく普通の町人なら、たった一枚の布切れが辿る旅路がどれほど壮大なものか——市場の露店に並ぶまでに灼熱の砂漠や荒れ狂う海を越えていることなど、到底信じられないだろう。\n\n交易商人、駄獣、そして船が辿るこうした苦難こそ、[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]の日常である。[ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]の言葉が一言も話されない遠くの町でさえ、我々の届ける品々に頼っているのだ。"
 gdp_merchant.8000.a: "商会にふさわしい名誉だ！"
 gdp_merchant.8000.b: "しかし、自らの故郷を忘れてはならない。"
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "物々交換された商品の包みや織物の束、あるいは大地から採れる貴石や貴金属よりも、人の手と才によってそれらから生み出される見事な品々のほうが、はるかに尊いものだ。\n\n独創的な仕掛け、息を呑むような装飾、そして繊細な職人技こそが[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]の生命線であり、我らの名はその品質と信頼の証である。"
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "たとえ最も偉大な王であれ、富の流れが途絶えれば貧民同然の無力な存在と化してしまう。しかし、信用による融資の網が、無数の蜘蛛の糸のようにその周囲には張り巡らされている。\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive]の名は諸国の宮廷に響きわたり、仲介と取引の頼みの綱として、助けを求める者には常に手を差し伸べるが、決して軽んじていい相手ではない。"
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "旅の書"
 gdp_merchant.8010.desc: "私ほど多くのものを見てきた者は少なく、私の唯一無二の体験のすべてを目の当たりにした者は誰一人としていない。貧者から権力者に至るまで、この世界のはるか彼方の地はせいぜい霞がかかったようにしか見えず、人々は薄暗い現実を照らす見聞や面白い話を渇望している。\n\n私は腰を下ろし、[poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier]での旅で得た興味深い逸話に思いを巡らせながら、見知らぬ人々や我が子孫たちが最も聞きたがるのは一体どのような物語だろうかと考える。"
 gdp_merchant.8010.a: "異国の慣習や礼儀作法に焦点を当てよう。"
 gdp_merchant.8010.a.tt: "この本の品質はあなたの[GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|V]#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!と[GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|V]#weak （[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]）#!の[trait_level_track_xp|E]に大きく依存する"
 gdp_merchant.8010.b: "読者は交易の秘訣や市場の知見を求めている。"
 gdp_merchant.8010.c: "我が著作は異国情緒あふれる都市と驚異を描き出すものとなる。"
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "予想以上に時間はかかったが、ようやく自分の拙い手記にいくらか満足できるようになった。[poi.GetName]への旅路を、道中の逸話を交えつつ、特に異国の[author.Custom('GetTravelogueTopic')]に重点を置いて詳細に描き出した。\n\n"
 gdp_merchant.8011.weak: "ページをめくりながら、私は物足りなさを覚え、もう少し努力できたのではないかと自問するが、まあいい、そろそろ羽根ペンを置く頃合いだ。"
 gdp_merchant.8011.mid: "ページをめくりながら、私は作品の幅広さには誇りを感じる一方で、特別なきらめきのようなものがまだ欠けているような気もする。"
 gdp_merchant.8011.great: "ページをめくりながら、自分の言葉に思わず笑みがこぼれ、まるでその場面を改めて体験しているかのように、文章の展開に胸が高鳴る。これは記憶に残る一冊だ！"
 gdp_merchant.8011.a: "しばらく手元に置いておこう。"
 gdp_merchant.8011.b: "商会の書庫に入れよう。"
 travelogue_description_full: "これは交易商人[author.GetTitledFirstName]によって書かれた、[author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier]の地を巡る幻想的な旅行記である。本書は[author.GetHerHis]が異国の[author.Custom('GetTravelogueTopic')]について、自身の体験から得た洞察を綴ったものである。\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "[author.GetFirstNameNoTooltip]・[author.GetHouse.GetNameNoTooltip]の旅"
 travelogue_name_2: "[poi.GetCounty.GetName]への道"
 travelogue_name_3: "[author.GetFirstNameNoTooltip]・[author.GetHouse.GetNameNoTooltip]：旅人"
 travelogue_name_4: "[poi.GetCounty.GetName]へ"
 travelogue_name_5: "[author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]での冒険"
 travelogue_name_6: "[author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip]の旅"
 travelogue_name_7: "遠方の地"
 travelogue_name_8: "行きて帰りし物語"
 travelogue_name_9: "[poi.GetCulture.GetCollectiveNounNoTooltip]について"
 travelogue_name_10: "[poi.GetNameNoTierNoTooltip]——神秘の[poi.GetTitle.Custom('BaronyTownType')|U]"
 travelogue_name_11: "千の見聞録"
 travelogue_name_12: "旅の記録"
 travelogue_name_13: "旅路"
 travelogue_name_14: "[author.GetFirstNamePossessiveNoTooltip]の冒険"
 travelogue_topic_customs: "慣習"
 travelogue_topic_markets: "市場"
 travelogue_topic_places: "土地"
 travelogue_description_quality_weak: "この本は文章が拙く、明らかに現実離れしている。"
 travelogue_description_quality_mid: "この本には示唆に富む一節がいくつか含まれている。"
 travelogue_description_quality_great: "この本は魅力的であり、劇的かつ見事に書き上げられている。"
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$：好奇心旺盛な訪問者"
 gdp_merchant.8021.suzerain: "この上なく名誉なことに、我が後援者である[visitor.GetTitledFirstName]が、"
 gdp_merchant.8021.merchant: "同業の交易商人であり[visitor.GetPrimaryTitle.GetDefinitiveName]の主である[visitor.GetTitledFirstName]が、"
 gdp_merchant.8021.laamp: "[visitor.GetPrimaryTitle.GetDefinitiveName]と称する旅の一団を率いる[visitor.GetTitledFirstName]が、"
 gdp_merchant.8021.ruler: "嬉しいことに、地元の統治者である[visitor.GetTitledFirstName]が思いがけず"
 gdp_merchant.8021.fallback: "謙虚な旅人である[visitor.GetTitledFirstName]が、"
 gdp_merchant.8021.desc: "我が邸宅を訪れた。\n\n[visitor.GetSheHe|U]は案内されて我々の収集品を目にすると満面の笑みを浮かべ、いくぶん驚嘆した様子であたりを見回す。\n\n「お会いできて光栄だ、[ROOT.Char.GetTitledFirstNameNoTooltip]殿！あなたの商会の活躍や、その異国情緒あふれる収集品の噂は聞いていたが…差し支えなければ、話を——」と、[visitor.GetSheHe]は息を呑み、[artifact.GetName]に引き寄せられる。\n\n「おやっ！これは一体…？」"
 gdp_merchant.8021.curio: "[visitor.GetSheHe|U]はその由来のすべてを聞き届けるまで引き下がるまいと、あらゆる角度からじっくりと観察している。"
 gdp_merchant.8021.library: "[visitor.GetSheHe|U]は数え切れないほどの質問を投げかけながら、注意深くページをめくっていく。"
 gdp_merchant.8021.creature: "[visitor.GetSheHe|U]はその優美さに感嘆し、嬉しそうにその餌やりの様子に見入っている。"
 gdp_merchant.8021.a: "ええ、実に素晴らしい代物でしょう。"
 gdp_merchant.8021.b: "よろしければ、お譲りしましょうか？"
 gdp_merchant.9021.opening: "ごきげんよう、[merchant.GetTitledFirstNameNoTooltip]"
 gdp_merchant.9021.diarch.desc: "[commissioner.GetName]の[commissioner.GetDiarchTitle]として、[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]に依頼したいことがある。"
 gdp_merchant.9021.no_diarch.desc: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]に依頼したいことがある。"
 gdp_merchant.9021.desc: "\n\n[trade_market.GetName|l]では[target.GetName]が不足している。この地へ品物を運び込んでくれれば、相応の報酬を約束しよう。"
 gdp_merchant.9021.a: "ご依頼を承りました。"
 gdp_merchant.9021.b: "恐縮ですが、お引き受けできません。"
 gdp_merchant.9021.b.cooldown_tt: "#V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#!年間は新たに[commission|E]を引き受けることができない"
 gdp_merchant.9005.t: "強制退去"
 gdp_merchant.9005.desc_intro: "我が[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))]である[courtier.GetTitledFirstName]が、[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]の執務室に押し入ってきた。その顔は真っ赤に染まっている。\n\n「我らの後援者である[expeller.GetTitledFirstName]からのお言葉を伝えに参りました」と、[courtier.GetSheHe]は言う。「我が商会は勘定を締め、直ちに[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]を去らねばなりません！」\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U]は[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]に対し、[expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip]からの退去を命じた。\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "[expeller.GetTitledFirstNamePossessiveNoTooltip]の我々に対する信頼はすっかり失われてしまった。"
 gdp_merchant.9005.desc_body.enemies: "[expeller.GetTitledFirstNamePossessiveNoTooltip]の敵意に終わりはないのか？"
 gdp_merchant.9005.desc_body.fallback: "ここまで尽くしてきたというのに…"
 gdp_merchant.9005.a: "結局こうなってしまったか。"
 gdp_merchant.9005.a.tt: "あなたの[company|E]は[expeller.GetShortUINamePossessive]の[realm|E]を去ることになる"
 gdp_merchant.9100.t: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]のパトリシアン一族"
 gdp_merchant.9100.desc: "[new_patrician_liege.GetPrimaryTitle.GetNameNoTier]の高慢ちきな一族どもに我々の力をはっきりと示し、[new_patrician_liege.GetTitledFirstName]には相応の#emp 見返り#!を与えたことで、我らの昇格が認められるのはほぼ確実となった。\n\n我が[ROOT.Char.GetHouse.GetBaseName]家が単なる商家に留まらず、[new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]の議会で他の有力なパトリシアン一族と肩を並べる存在であること、そして、法の下においてはあの[new_patrician_liege.GetHouse.GetBaseName]家とすら対等であることを疑いの余地なく証明する文書をついに手にしたのだ！"
 gdp_merchant.9100.a: "議会に登院する日が待ちきれない。"
 merchant_patrician_transition_domicile_tt: "[domicile_buildings|E]は維持される"
 gdp_merchant.9110.t: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]の商家"
 gdp_merchant.9110.desc: "旧共和国の崩壊に伴い、[ROOT.Char.GetHouse.GetBaseName]家をはじめ[new_merchant_location.GetBaronyNameExplicitly]の誇り高きパトリシアン一族らは一介の商家へと身をやつし、気まぐれな運命と地元統治者[ROOT.Char.GetSuzerain.GetTitledFirstName]の思惑に翻弄される立場となった。\n\n議会や共和国という後ろ盾を失った今、かつての権勢を少しなりとも保ちたいのであれば、[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier]の法に頼るほかない。"
 gdp_merchant.9110.a: "なぜこのようなことに…"
 broke_deal_opinion: "契約を破棄した"
 gdp_repudiated_my_loan_opinion: "貸し付けを断られた"
 gdp_interest_free_loan_opinion: "無利子で金を貸してくれた"
 gdp_usurious_loan_opinion: "高利で金を貸し付けられた"
 gdp_merchant_unity_intermarriage_desc: "別の[merchant|E]の[house|E]に嫁いだ"
 gdp_merchant_unity_noble_marriage_desc: "貴族の[house|E]に嫁いだ"
 gdp_merchant.2000.t: "閑散とした市場：[needed_good.GetNameNoTooltip]"
 gdp_merchant.2000.desc.intro: "ひとりで、 "
 gdp_merchant.2000.desc.disaster: "災害に見舞われた "
 gdp_merchant.2000.desc.war: "戦禍に荒廃した "
 gdp_merchant.2000.desc.plague: "疫病が蔓延した "
 gdp_merchant.2000.desc.unrest: "荒れ果てた "
 gdp_merchant.2000.desc.stalls: "[starving_province.GetNameNoTooltip]の街なかを歩いていると、普段は賑わう[starving_province.Custom('GetRegionalMarketTermGloss')]が静まり返っていることに気づく。\n\n食べ物の露店は、古びた[ROOT.Char.Custom('GetLocalStreetFoodPlural')]と腐った[ROOT.Char.Custom('RegionalRootVegetablePlural')]がわずかにあるだけで、ほぼ空っぽだ。やせ細った男や女たちが、通りの脇に積まれたごみの山を漁っている。"
 gdp_merchant.2000.a: "残されたものをしっかりと守り抜かねば。"
 gdp_merchant.2000.b: "人々は誰かのせいにしようとするだろう。"
 gdp_merchant.2000.c: "これは私の問題ではない。"
 gdp_merchant.2010.t: "[craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip]の独占権："
 gdp_merchant.2010.t.smith: "鍛冶職人"
 gdp_merchant.2010.t.goldsmith: "金細工職人"
 gdp_merchant.2010.t.carpenter: "大工"
 gdp_merchant.2010.t.tanner: "皮なめし職人"
 gdp_merchant.2010.t.potter: "陶工"
 gdp_merchant.2010.desc.intro: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]である[associate.GetFirstName]が、[workshop_province.GetName]の熟練の職人[craftsman.GetFirstName]について絶えず話している。今、[craftsman.GetHerHis]の作品の前に立つと、皆がこれほど騒いでいた理由が理解できた。\n\n[craftsman.GetFirstNameNoTooltip]は作品から視線を外すことなく、私を迎えてくれた。「どうぞ、ごゆっくり私の作品をご覧になってください」\n\n私が圧倒されたのは、 "
 gdp_merchant.2010.desc.weapon: "見事な武器だ。"
 gdp_merchant.2010.desc.chalice: "精巧に作られた聖杯だ。"
 gdp_merchant.2010.desc.box: "精巧に彫刻された木箱だ。"
 gdp_merchant.2010.desc.saddle: "完璧に彫り込まれた鞍だ。"
 gdp_merchant.2010.desc.vase: "繊細に絵付けされた陶磁器の壺だ。"
 gdp_merchant.2010.desc.craftsmanship: "これは並大抵の職人技ではない。"
 gdp_merchant.2010.a: "これほどの才能を無駄にしてはならない。"
 gdp_merchant.2010.b: "[associate.GetFirstNameNoTooltip]に少し手ほどきしてやってもらえないだろうか。"
 gdp_merchant.2010.c: "ここに留まってあなたの技を観察させていただきたい。"
 gdp_merchant.2015.t: "[counsel_good.GetNameNoTooltip]の価値"
 gdp_merchant.2015.desc: "後援者の[patron.GetTitledFirstName]から突然呼び出しを受けた。[patron.GetHerHis]の[patron.Custom('quirk_neg_adjective')]性格を考えると、玉座の間に入る足取りも重くなる。\n\n「[ROOT.Char.GetFirstNameNoTooltip][ROOT.Char.Custom('MistressMaster')|U]、頼み事がある。[counsel_good.GetNameNoTooltip]の品質と市場価値について詳しく教えてはくれないか？」"
 gdp_merchant.2015.a: "「偶然にも、私の専門分野でございます」"
 gdp_merchant.2015.a.tt: "[counsel_category.GetName][trade_category_short|E]の[expertise_level|E]が#V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#!以上に到達している必要がある"
 gdp_merchant.2015.b: "「多少の心得はございますが…」"
 gdp_merchant.2015.a.monopoly.tt: "[monopoly_i] [trade_monopoly|E]の受諾率：[monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip]はあなたをその分野の権威とみなす"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip]はあなたの嘘を見抜く"
 gdp_merchant.2015.b.monopoly.tt: "[monopoly_i] [trade_monopoly|E]の受諾率：[monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "「商売だけにとどまらず、人生でもっと大きなことを成し遂げたい」"
 gdp_merchant.2020.t: "食事会"
 gdp_merchant.2020.desc: "後援者の[patron.GetTitledFirstName]に招かれ、[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の[patron.GetCapitalLocation.GetHolding.GetType.GetName|l]で開かれる晩餐会で席を共にする栄誉にあずかった。席に着こうとすると、[courtier_1.Custom('NoblewomanNobleman')]の[courtier_1.GetTitledFirstName]が怒りに満ちた視線をこちらへと向けている。そして、他の来賓には聞こえないような小声で、「卑しいやつ」だとか「平商人が賄賂でも渡したか」だとか呟いている。だがその声も、[patron.GetFirstNameNoTooltip]の挨拶が始まると静かになった。\n\n「信頼のおける仲間たち、新たな友人たち、そして久しく会えなかった同胞たちよ。今日歴々を招いたのは心行くまで我がもてなしを堪能してもらうためだ。さあ、乾杯しよう！」"
 gdp_merchant.2020.a: "「素晴らしい、このような宴をもっと頻繁に開いていただきたいものだ！」"
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName]は[GetActivityType('activity_feast').GetTextIcon] [GetActivityType('activity_feast').GetName]を可能な限り早く開始する#weak （1～3か月以内）#!"
 gdp_merchant.2020.b: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家はふさわしい評価を得るだろう。"
 gdp_merchant.2020.b.unity_gain.desc: "我が一族の名において貴族の間に列席した"
 gdp_merchant.2020.c: "「おっしゃるとおり！では、さっそく商談といきましょう！」"
 gdp_merchant.2020.c.unity_loss.desc: "本題である商売に専念した"
 gdp_merchant.2025.t: "劣った交易商人"
 gdp_merchant.2025.desc: "いつものことだが、[charter_rival.GetTitledFirstName]は大事な時に姿を見せない。[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))]である[patron.GetTitledFirstName]は私とともに辛抱強く[charter_rival.GetHerHis]の到着を待ったが、結局は[charter_rival.GetHerHim]抜きで今月の帳簿を確認することにした。\n\n決裁の済んでいない取引合意書が散乱する机に向かいながら、[patron.GetFirstNameNoTooltip]は羊皮紙を横に払って私に目を向ける。\n\n「[ROOT.Char.GetFirstNameNoTooltip]よ、ここだけの話、お前は[charter_rival.GetFirstNameNoTooltip]のことを#EMP 実際には#!どう思っているのだ？[charter_rival.GetHerHim]に特許状を与えたのは正しい選択だったのだろうか？」"
 gdp_merchant.2025.a: "「私めにお与え頂くほうが有益かと存じます」"
 gdp_merchant.2025.a.charter.tt: "[charter_i] [request_merchant_charter|E]の受諾率：[charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "「[patron.Custom('FormOfAddressForLiege')]のご判断に間違いはございません」"
 gdp_merchant.2025.b.unity_gain.desc: "後援者の判断を信用していることを示した"
 gdp_merchant.4000.t: "道から外れた場所"
 gdp_merchant.4000.desc.intro: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の市場に入ると、我が商会の店子らが寂れた路地へと追いやられ､陳列棚は近くにある豚小屋の泥の中に投げ入れられているのが目に入った｡\n\n"
 gdp_merchant.4000.desc.patron: "我が[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))]"
 gdp_merchant.4000.desc.patron_representative: "[patron.GetTitledFirstNamePossessive]の[patron.Custom2('RelationToMe', SCOPE.sC('market_character'))]である[market_character.GetName]"
 gdp_merchant.4000.desc.body: "は風上から遠巻きに、私が商会員らから不満を投げかけられる様を薄ら笑いを浮かべながら眺めている。\n\n近づくと、[market_character.GetFirstNameNoTooltip]は、"
 gdp_merchant.4000.desc.body.patron: "「[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l]の商売にはおあつらえ向きの場所だろう？」と、豚を指さしながら言う。"
 gdp_merchant.4000.desc.body.patron_representative: "「私はお前の後援者の名代として来たのだよ」顎を突き出し、その目はきらきらと輝いている。どうやら[market_character.GetSheHe]は、それを伝えることに並々ならぬ快感を覚えているようだ。"
 gdp_merchant.4000.desc.outro: "「お前は我らのしきたりを破り、[Glossary( '孔子', 'CONFUCIUS_GLOSS' )]の教えにも耳を傾けない。できるようになるまでは、ここがお前の場所だ」"
 gdp_merchant.4000.b: "道について学ぼう。"
 gdp_merchant.4000.b.tt: "[GetTrait('confucian_education').GetName(GetNullCharacter)]の中心地で開催する場合、次の[GetActivityType('activity_adult_education').GetName]のコストが#P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#!少ない[gold|E]で済む"
 gdp_merchant.4000.c: "今に見ていろよ…"
 gdp_merchant.4010.t: "学びの門"
 gdp_merchant.4010.desc: "市場での長い一日を終え、茶を味わっていると、時折、地元の学者が物珍し気な視線をこちらに向けてくる。\n\n「[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]というのはまったく浅ましい奴だ」学者はその友人と話している。「奴らは、礼節を守る我々よりも優れていると思い込んでいる。我々は努力によって試験を乗り越えた。他人から搾取をする以外に、[ROOT.Char.GetFirstNameNoTooltip]が何を成し遂げたというのだ？」"
 gdp_merchant.4010.a: "試験など、言うほど難しくもないだろう。"
 gdp_merchant.4010.b: "「飲んでいるその茶は、誰の商品だね？」"
 gdp_merchant.4010.c: "「商売がなくなっても、誰も困らないのかい？」"
 gdp_merchant.4020.t: "シルクロード"
 gdp_merchant.4020.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]に到着した。人と家畜でごった返す[ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')]の門を抜け、無限に続いているかのような隊商の列に合流する。この地のヒトコブラクダは高々と積まれた荷のせいもあって象と見まがうほどで、その重みで左右にゆらゆらと揺れている。\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "どの街角にも、信じ難い量の商品を荷下ろししている商人の姿がある。\n\n中には、仕入れ過ぎて売り切れず、腐らせてしまった商品を道端に投げ捨てている商店さえもある。"
 gdp_merchant.4020.desc.steady_trading: "かつて、これほどの富が一か所に集まっているのを見たことがあっただろうか？膨大な数の人がひしめき合い、我々は騒がしい大群衆の一部分と化す。\n\n隊商が足を止めることがあったとしても、鞭を振るおうと手ぐすねを引いた隊長が待ち構えている。"
 gdp_merchant.4020.desc.hardship: "異国の言葉で交わされる断片的な会話から察するに、どうやらこの市場は苦境のさなかにあるようだ。\n\n最盛期のころに、この地で取り扱われていた商品の量は想像を絶するものであっただろう…"
 gdp_merchant.4020.a: "この道は未来へと続いている。"
 gdp_merchant.4030.t: "遠方の富"
 gdp_merchant.4030.desc.intro: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))]の[associate.GetFirstName]が、まるで金塊の山でも見るかのように目をきらきらさせながら[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の事務所に入ってきた。\n\n[associate.GetSheHe|U]から手渡された箱を開けると、そこには"
 gdp_merchant.4030.desc.silk: "見たこともないような上質な絹が納められている。極めて薄く、信じられないほどに軽い。\n\n"
 gdp_merchant.4030.desc.spice: "まだ挽いたばかりの、かぐわしい粉末が入っている。\n\n「これは[rumoured_market_owner.Custom('RegionalSpice')]と呼ばれているものでございます」と[associate.GetSheHe]は言う。"
 gdp_merchant.4030.desc.jade: "まるでガラスのように滑らかさに磨き上げられた翡翠が納められていた。\n\n"
 gdp_merchant.4030.desc.ivory: "小さな城塞をかたどった見事な象牙細工が納められていた。\n\n"
 gdp_merchant.4030.desc.outro: "「シルクロードで[rumoured_market_owner.GetCulture.GetNameNoTooltip|l]と伝手があると言う商人から買い付けたものでございます。[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]で我らが稼ぐ金など、[rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]の[rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')]で彼らが手にする富に比べれば微々たるもの」"
 gdp_merchant.4030.a: "「今『シルクロード』と言ったか？」"
 gdp_merchant_4030_a_tt: "今後#V 5#!年以内に[company|E]を[rumoured_market.GetName]に移転した場合、その[market|E]において[GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]を#V 10年間#!にわたって獲得する"
 gdp_merchant.4030.b: "「気が利くな。ありがとう」"
 gdp_merchant.4030.c: "「[associate.GetFirstNameNoTooltip]よ、我々にとって重要なのはこの地での商売なのだ」"
 merchant_unity_local_business: "[silk_road|E]より近隣での商売を優先した"
 gdp_merchant.4030.artifact.silk: "[rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]の絹"
 gdp_merchant.4030.artifact.silk.desc: "シルクロードにある市場からもたらされた極めて薄い絹の布地。驚くほど軽く、肌触りが滑らか。"
 gdp_merchant.4030.artifact.spice: "香辛料の小袋"
 gdp_merchant.4030.artifact.spice.desc: "シルクロードの市場からもたらされた香り高い香辛料が入った小袋。"
 gdp_merchant.4030.artifact.jade: "磨き上げられた翡翠"
 gdp_merchant.4030.artifact.jade.desc: "シルクロードの市場からもたらされた翡翠。その表面はガラスのように滑らかに磨き上げられている。"
 gdp_merchant.4030.artifact.ivory: "象牙細工の城塞"
 gdp_merchant.4030.artifact.ivory.desc: "シルクロードの市場からもたらされた象牙細工。丹念な彫刻仕事によって精巧な小型の城塞がかたどられている。"
 gdp_merchant.5000.t: "利子の露見"
 gdp_merchant.5000.desc.debtor: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の事務所の扉が勢いよく開き、[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))]の[accuser.GetFirstName]が我が商会員たちを引き連れて入ってきた。"
 gdp_merchant.5000.desc.debtor_paranoid: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))]の[accuser.GetFirstName]が[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の事務所に足音も立てずに入ってくる。ただ扉の軋む音だけがそれを告げていた。"
 gdp_merchant.5000.desc.bishop: "フードをかぶった人影が[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の敷居を跨ぐ。商会員らに案内され、[accuser.Custom('GetActualBishopTitle')]の[accuser.GetFirstName]が私の前に姿を現した。"
 gdp_merchant.5000.desc.clergy: "フードをかぶった人影が[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の敷居を跨ぐ。商会員らに案内され、[accuser.Custom('PriestTitle')]の[accuser.GetFirstName]が私の前に姿を現した。"
 gdp_merchant.5000.desc.steward: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の事務所の扉が勢いよく開き、[debtor.GetFirstNamePossessive]の[debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))]が我が商会員たちを伴って怒鳴り込んできた。"
 gdp_merchant.5000.desc.break: "\n\n「[ROOT.Char.GetTitledFirstNameNoTooltip]よ、[SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, '私', debtor.GetTitledFirstName )]への貸し付けには誤解があるようだ」と[accuser.GetSheHe]は言う。"
 gdp_merchant.5000.desc.accepted: "「私は嘘がとりわけ嫌いだ。商会の帳簿を拝見させてもらおう。それを見れば真実は明らかになるはずだ」"
 gdp_merchant.5000.desc.discouraged.debtor: "「[accuser.GetFaith.Custom('HouseOfWorshipBase')]の教えで高利貸しが認められていないことはご存じのはず。今ここで決着をつけるなら、これ以上事を荒立てるつもりはない」"
 gdp_merchant.5000.desc.shunned.debtor: "「もしも[accuser.Custom('DefaultPriestTitlePlural')]がこのことを知れば、貴殿や貴商会にはすみやかに厳しい処分が下されるだろう。私が参ったのは、貴殿が窮地を逃れられるようにと思ってのこと」"
 gdp_merchant.5000.desc.accepted.steward: "「貴殿の後援者は嘘を吹き込まれるのがとりわけ嫌いだ。商会の帳簿を見せてもらおうか。数字は正しく直さねばならぬ」"
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "「貴殿も商売人なら、無から富を生み出すことなどできないとご存じのはずだ。それなのに貴殿は…。この過ちによって貴殿の事業が打撃を受け、ひいては取引に害を及ぼすことのないよう、今ここで内密に解決できればそれが良いと私は思っている。どうだろうか？」"
 gdp_merchant.5000.desc.shunned: "「貴殿の商いの手口には全く見下げ果てる。商売人でありながら、存在もしないモノを売りつけるとはどういうことだ？ここで赦しを乞うつもりがないなら、決着は法廷で着けようじゃないか」"
 gdp_merchant.5000.a: "「私が[ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]の名代として動いていることをご存じないのかな？」"
 gdp_merchant.5000.a.debtor: "「我々の取引に傷がつくのはあなたも望んでおられないでしょう」"
 gdp_merchant.5000.b: "「我が資産をもって贖いましょう」"
 gdp_merchant.5000.c: "「それでは、一緒に細則を確認しようではないか」"
 gdp_merchant.5000.c.success: "帳簿に瑕疵はない"
 gdp_merchant.5000.c.failure: "帳簿の数字に不審な点がある"
 gdp_merchant.5000.c.critical: "利子をうまく偽装できていない"
 gdp_merchant.5000.d: "「利子なら免除してやってもよいが…」"
 gdp_merchant.5000.e: "「この貸し付けは白紙としましょう」"
 gdp_usury_penance_seized_goods_modifier: "差し押さえに遭った隊商"
 gdp_usury_penance_seized_goods_modifier_desc: "この人物の事業は、利子付き融資を隠し立てしていたことが発覚し、打撃を受けている。"
 gdp_usury_penance_same_faith_scandal_modifier: "周知の高利貸し"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "この人物は、不正に利子付き融資を行っていたことが露見し、苦境に立たされている。"
 gdp_usury_penance_forgive_interest_tt: "偽装された[interest|E]が免除される#weak （[TARGET_CHARACTER.GetShortUIName]の債務：[gold_i|E]$VALUE|0V$）#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "偽装された[loan|E]は現状のまま維持される"
 gdp_merchant.5010.t: "細則"
 gdp_merchant.5010.desc: "債権者の[lender.GetFirstName]が、私への貸し付けに際して後ろ暗いことをしていたことが明らかになった。\n\nよくよく調べてみると、細則の中には当初の取り決めよりも高い金額が算定される条項が含まれていることがわかる。\n\n私がその気になれば、この取り決めにおける食い違いを広く知らしめることも可能だ。"
 gdp_merchant.5010.a: "秘密のままにしておく。"
 gdp_merchant.5010.b: "[lender.GetSheHe|U]に利子を返還させる。"
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U]は一切の利子を受け取れなくなる。"
 gdp_merchant.5010.c: "借り入れを白紙にする。"
 gdp_usury_debtor_discover_interest_tt: "隠し[interest|E]の額：#weak （[gold_i|E]$VALUE|0V$）#!"
 gdp_usury_debtor_keep_secret_tt: "偽装された[interest|E]は秘密のまま保たれる"
 gdp_usury_debtor_demand_repayment_tt: "隠し[interest|E]の返還を要求する"
 gdp_usury_debtor_inform_creditor_tt: "[lender.GetShortUINameNoTooltip]に書状が送られる"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$騙し取っていた利子は即刻返還してもらおうか。この私を欺こうなど、二度と考えるでない。"
 gdp_merchant.5020.a: "残念なことだ。"
 gdp_merchant.5020.a.tt: "隠し利子が返還される"
 gdp_usury_penance_interest_paid_back_tt: "隠し[interest|E]は免除される"
 gdp_merchant.5020.desc_intro: "貸し付けの契約書を詳しく調べたが、貴殿が私を欺こうとしたことは疑いようもなく明らかだ！"
 gdp_usury_debtor_kept_secret_message: "秘密は守られた"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName]は[interest|E]の偽装を知っており、その秘密を胸の内にしまっておく。"
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "私への貸し付けは白紙に戻ったと考えてもらおう。次に貴殿から何かを持ち掛けられたときには、もう少し慎重に考えることにしよう。"
 gdp_merchant.5040.a: "図々しい！"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "このような告白を書状にしたためるのは心苦しい限りではございますが、街道をゆく苦しい旅や、市場での終わることのない交渉に、私はもはや耐えきれなくなってしまいました。\n\nせめてしばらくの間だけでも、商会に帰郷の許しを頂けないでしょうか？"
 gdp_merchant.0060.a: "やむを得まい。"
 gdp_merchant.0060.a.tt: "2年以内に[GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName]ことを約束する"
 gdp_merchant.0060.b: "なんとか踏みとどまってくれ。"
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName]は[stress_i]#N [associate.GetStress|0]#!の[stress|E]を抱えている。[associate.GetSheHe|U]のストレスは、交易路での[schemes|E]に失敗するたび今後も増加していく。"
