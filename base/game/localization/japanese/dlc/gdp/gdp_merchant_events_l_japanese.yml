l_japanese:
 gdp_merchant.0001.t: "黄金への道"
 gdp_merchant.0001.desc: "私は自由の身として、この地の市場へ足を踏み入れた。通りのあちこちで商人たちが声を張り上げ、それに混じって近くの工房から金属を打つ音が聞こえてくる。見渡せば、[ROOT.Char.Custom('RegionalDrink')]の木箱や、[ROOT.Char.Custom('RegionalFabric')]の布地、[ROOT.Char.Custom('GetRandomRegionalBird')]の鳥かごを積んだ荷車がひっきりなしに行き交っている。\n\n私はここで私の王国を築くのだ。"
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "最初の商いは何にしようか？"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "色々と考えた結果、私は商人として生きる道を選んだ。人生で今が最も心身ともに充実していて、異国を巡りたいという思いが私を突き動かしている。いつの日か、互いに利益をもたらす取引ができることを願っている。[old_primary_title.GetBaseNameNoTierNoTooltip]はあなたの手に託そう。"
 gdp_merchant.0002.a: "興味深い展開だな。"
 gdp_merchant.0010.t: "家族の問題"
 gdp_merchant.0010.desc: "今日の一族会議がお開きになると、[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]の[associate.GetTitledFirstName]が、決意に満ちた表情で私を呼び止めた。\n\n「親愛なる我が[associate.Custom2('RelationToMe', ROOT.Char)]よ！"
 gdp_merchant.0010.desc.starting: "私は創設当初から、この商会の一員でした」"
 gdp_merchant.0010.desc.starting_fallback: "私は長らくこの家に仕えてまいりました」"
 gdp_merchant.0010.desc.cont: "[associate.GetSheHe]は言葉を慎重に選びながら続けた。"
 gdp_merchant.0010.desc.children: "「そして、あなたの[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))]はまだ成人していません。"
 gdp_merchant.0010.desc.no_children: "「そして、あなたには成人したお子様がいません。"
 gdp_merchant.0010.desc.outro: "そこでお願いがあります。どうか私を養子として迎えていただけないでしょうか。家族の一員としてお役に立てれば光栄です」"
 gdp_merchant.0010.a: "「君のことは、ずっと我が子同然と思っていた」"
 merchant_adoption_event_tt: "[associate.GetShortUIName]があなたの[house|E]の一員となる"
 merchant_unity_adoption_loss: "[house|E]に商会員を養子として迎えた"
 gdp_merchant.0010.b: "「お前はまだ、自分の価値を証明していない」"
 gdp_merchant.0010.c: "「少し考えさせてくれ」"
 gdp_merchant.0015.t: "新事業の顔"
 gdp_merchant.0015.desc: "[trade_route.GetNameNoTooltip|l]の創設により、我々の交易路は定まった。\n\nあとは、この新たな事業を任せる者を選ぶだけだ。私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))]である[courtier_1.GetTitledFirstName]は[courtier_1.Custom('quirk_pos_adjective')]人間で、"
 gdp_merchant.0015.desc_good_intellect: "分別がある。ひょっとすると、まだ見ぬ才能で我々を驚かせてくれるかもしれない。"
 gdp_merchant.0015.desc_excellent_intellect: "聡明だ。きっと一族にさらなる栄誉をもたらしてくれるだろう。"
 gdp_merchant.0015.desc_poor_intellect: "凡庸だ。だが、この機会が[courtier_1.GetHerHim]を成長させるかもしれない。"
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip]になら任せられるかもしれない…"
 gdp_merchant.0015.b: "…いや、[courtier_2.GetFirstNameNoTooltip]の方が適任かもしれない。"
 gdp_merchant.0015.c: "有能な人材は傍に置いておきたい。"
 gdp_merchant.0015.c.fallback: "いや。今は誰一人欠かせない。"
 gdp_merchant.0015.c.tt: "あなたは[trader|E]を任命せずに[trade_route|E]の運用を開始する"
 gdp_merchant.0020.t: "事業の共同経営者"
 gdp_merchant.0020.desc: "家業の長の力量は、新たな商機へと目を向けさせてくれる右腕の力量にかかっている。"
 gdp_merchant.0020.desc.partner_exists: "その役目を担うはずの私の共同経営者、[old_holder.GetFirstName]は、見込みのない事業に時間と金を浪費し続けてきた。"
 gdp_merchant.0020.desc.fallback: "私には現在、この役目を担い、私と共に事業を切り盛りする共同経営者がいない。"
 gdp_merchant.0020.desc.body: "商会には張り詰めた空気が漂っている。野心を抱く者たちが自分を売り込もうと、互いにいがみ合っているのだ。\n\n"
 gdp_merchant.0020.desc.outro_three: "その中でも[candidate_2.GetTitledFirstName]と[candidate_3.GetTitledFirstName]は、右腕の座を狙って、私に揺るぎない忠誠を誓っている。\n\n彼らは自分たちより明らかに優秀な[candidate_1.GetTitledFirstName]を押しのけてでも、この座を勝ち取ろうとするだろう。"
 gdp_merchant.0020.desc.outro_two: "その中でも[candidate_2.GetTitledFirstName]は、右腕の座を狙って、私に揺るぎない忠誠を誓っている。\n\n[candidate_2.GetSheHe|U]は自分より明らかに優秀な[candidate_1.GetTitledFirstName]を押しのけてでも、この座を勝ち取ろうとするだろう。"
 gdp_merchant.0020.desc.outro_one: "その中でも[candidate_1.GetTitledFirstName]は、右腕の座を狙って、私に揺るぎない忠誠を誓っている。\n\n[candidate_1.GetSheHe|U]は、何をしてでもこの座を勝ち取ろうとするだろう。"
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip]に機会を与えよう。"
 gdp_merchant.0020.a.custom: "他のすべての候補者"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip]に機会を与えるべきだ。"
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip]こそ最もふさわしい。"
 gdp_merchant.0020.d: "彼らには既に別の務めがある…"
 gdp_merchant.0020.d.custom: "すべての候補者"
 merchant_unity_partner_gain: "一族の成員を共同経営者に任命した"
 merchant_unity_partner_loss: "部外者を共同経営者に任命した"
 gdp_merchant.0025.t: "名望ある職人たち"
 gdp_merchant.0025.desc: "「ご機嫌麗しゅう、[ROOT.Char.GetTitleAsNameNoTooltip][ROOT.Char.GetFirstNameNoTooltip]様」近くの革なめし場から聞き慣れない声が私を呼んだ。染料槽の泥水に足を取られないよう注意しながら、私はその声の方へと向かった。\n\n気がつけば、私の目の前にあったのは…動物の死骸か？狩人はその戦利品を誇らしげに見せつけながら、私に向かって微笑む。\n\n「[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]は熟練した職人の街として津々浦々に知れ渡っております。なればこそ、売り物の品質が手元にある素材次第であることもご存じでしょう。狩人たる私めは、あなた様のような目の肥えた買い手のために、極上の品を調達することを生業としているのでございます」"
 gdp_merchant.0025.a: "「もっと大きな商売にしようと考えたことは？」"
 gdp_merchant.0025.b: "「詳しく聞こうじゃないか」"
 merchant_unity_artisan_recruit_loss: "部外者を雇用した"
 merchant_unity_artisan_recruit_decline_gain: "高級素材についての知見を得た"
 gdp_merchant.0030.t: "無視できない力"
 gdp_merchant.0030.desc: "「[ROOT.Char.GetFirstNameNoTooltip][ROOT.Char.GetTitleAsNameNoTooltip|U]様、こちらをご覧あれ！」[traveler.GetWomanMan]の叫ぶ声が耳に届く。\n\n振り向くと、鍛冶場から鍛冶職人が手を振っていた。近づいていくと、職人は体をひねって筋骨を誇示し、炉の火が筋肉の陰影を絶妙に際立たせるよう角度をつけているのが目に入る…\n\n「お目にかかる日をずっと待ちわびておりましたぞ。貴商会が競合どもを圧倒し、#EMP 目覚ましき#!勇名を馳せていると聞き及び、この腕っぷしをお役に立てたく馳せ参じた次第です。頭をかち割るもよし、剣を振るうもよし、何なりとお申し付けを」"
 gdp_merchant.0030.a: "「その意気込み、気に入った」"
 gdp_merchant.0030.b: "「#EMP う、うむ…#!それより、何を作っているのか見せてくれないか」"
 merchant_unity_creditor_recruit_loss: "部外者を雇用した"
 merchant_unity_creditor_recruit_decline_gain: "商会に心酔する厄介者を追い払った"
 gdp_merchant.0035.t: "千里を駆ける名声"
 gdp_merchant.0035.desc: "ただならぬ騒ぎに、手元の帳簿から目を離して顔を上げる。\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の事務所から外に出てみると、鋭い目つきの商人が立っていた。何日も旅してきたのか、衣服が土埃にまみれている。\n\n「お初にお目にかかります、[ROOT.Char.GetTitledFirstNameNoTooltip]様」商人が話す。「街道を行き交う者であなた様の名を知らぬ者はございません。出会う人々が皆、訪ねるべきはあなた様だと申しておりました。願わくば今後、[ROOT.Char.GetTitledFirstNameNoTooltip]様のもとで商いをさせていただけないでしょうか」"
 gdp_merchant.0035.a: "「もちろんだ。なかなかの人物のようだな！」"
 gdp_merchant.0035.b: "「それより、遠方の交易について聞きたいのだが」"
 merchant_unity_caravaneer_recruit_loss: "部外者を雇用した"
 merchant_unity_caravaneer_recruit_decline_gain: "遠方の交易について知見を得た"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "[ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')]は悲観的だったが、ついに[recipient.GetTitledFirstNamePossessive]が我らの願いを聞き入れてくださった！街は歓喜に沸いている。我々はついに自分たちの都市を手に入れ、自らの手で共和国を治められるようになったのだ！\n\n私は[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]初代[ROOT.Char.GetTitleAsNameNoTooltip]として、"
 gdp_merchant.0101.liege: "[new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip]の支配者たちを頼みとして、その御恩に報いつつ、[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]とその周辺を従属都市として統治することになる。"
 gdp_merchant.0101.independent: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]とその周辺を、他の有力諸家とともに、人民の名の下に統治することになる。"
 gdp_merchant.0101.republic: "\n\n数々の取引と奔走の末、偉大なる[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家が、ついに永続する遺産を築くことができる…"
 gdp_merchant.0101.a: "[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip]の民にとって新たな時代の幕が開ける！"
 gdp_merchant.0102.desc: "我らの願いを受け入れてくださったと聞き、大いに勇気づけられました！\n\n金はすでに送らせております。これから[actor.GetPrimaryTitle.GetName]の特許状を作成し、"
 gdp_merchant.0102.liege: "あなたの忠実な臣下として統治いたします。"
 gdp_merchant.0102.top_liege: "[new_liege.GetTitledFirstName]様の下に統治いたします。"
 gdp_merchant.0102.independent: "独立都市として統治いたします。"
 gdp_merchant.0103.desc: "なんと馬鹿げた提案だ。称号が金で買えると本気で思っているのか？それも#EMP お前ごときが！？#!"
 gdp_merchant.0110.t: "$merge_company_interaction$：[actor.GetHouse.GetNameNoTooltip]と[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "長い議論の末、[recipient.GetTitledFirstName]は、両商会と商家を統合するという私の寛大な提案に対し、関心を隠しきれない様子だ。\n\n[recipient.GetSheHe||U]は頷き、こう言う。"
 gdp_merchant.0110.desc.personality.ai_honor: "「この件に関しては、私に選択の余地はほとんどないようだ。それでも約束は守り、自らの利益と同じように、そちらの利益も誠実に守ろう」"
 gdp_merchant.0110.desc.personality.ai_zeal: "「[recipient.GetFaith.WealthGodName]が私たちにこの道を示してくださったのだと信じている」"
 gdp_merchant.0110.desc.personality.ai_greed: "「そちらと我々双方の帳簿を精査した。この数字を前にしては、そちらの条件を受け入れるほかない」"
 gdp_merchant.0110.desc.personality.ai_compassion: "「商会と協議した結果、商会の統合は双方に利益をもたらすとの結論に至った」"
 gdp_merchant.0110.desc.personality.ai_boldness: "「そちらの提案を受け入れよう。これ以上、互いに駆け引きを続けるのはやめだ」"
 gdp_merchant.0110.desc.personality.ai_rationality: "「我々の利益と、そちらからの提案を断ることによる代償を天秤にかけた結果、受け入れることにした」"
 gdp_merchant.0110.desc.personality.ai_vengefulness: "「選択の余地はない。見事な手並みだった。この勝負はそちらの勝ちだ」"
 gdp_merchant.0110.desc.personality.ai_energy: "「提案を受け入れよう。至急、契約書を作成し、私のもとへ届けさせてくれ！」"
 gdp_merchant.0110.desc.personality.ai_sociability: "「[recipient.GetHouse.GetBaseNameNoTooltip]商会は、あなたの条件を受け入れる。我らの名を掲げて商いを続けられなくなるのは寂しいが、意地を張るのは賢明ではない」"
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "「熟慮の末、提案どおり、双方の利害を一つにすることを受け入れることにした」"
 gdp_merchant.0110.desc.closing: "\n\n「約束どおり交易網は解消され、本日より[recipient.GetHouse.GetBaseNameNoTooltip]の名はそちらの商会のために用いられることになる」"
 gdp_merchant.0110.a: "[recipient.GetHouse.GetBaseNameNoTooltip]の市場は我らのものだ！"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "お前は分をわきまえず、[actor.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip]の重要性を過信している。[recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip]がお前のつまらぬ要求のために譲歩することは決してない。"
 gdp_merchant.0111.a: "この企ては見込み違いだった。"
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "[indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の領国が深刻な財政難に陥っているという噂を耳にした。私なら問題を解決できるかもしれない…もちろん、見返りはいただくつもりだが。"
 gdp_purpose_events.0001.a: "これで難局を切り抜けられるかもしれない…"
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName]があなたの提案を検討する。"
 gdp_purpose_events.0001.b: "なんと厚かましい！"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "折り入っての頼みだ。どうか私に財政的な援助をお願いしたい。条件を提示してくれれば、それが文書として残される限りにおいて決して拒みはしない。"
 gdp_purpose_events.0002.a: "利子を含む借用書を作成する。"
 gdp_purpose_events.0002.a.sin: "法外な利子を含む借用書を作成する。"
 gdp_purpose_events.0002.c: "誰も高利貸しだと呼べないよう、うまく借用書を作成する。"
 gdp_purpose_events.0002.d: "金を融通し、見返りは何も求めない。"
 gdp_purpose_events.0002.b: "申し訳ないが、お断りしよう…"
 gdp_purpose_events.0002_notification: "融資成功"
 gdp_purpose_events.0002_fail_notification: "融資拒否"
 fund_maa: "@stationed_regiment_icon! [men_at_arms|E]の[regiment|E]を編成するため"
 fund_mercenaries: "[mercenary_i|E] [mercenary|E]契約のため"
 gdp_purpose_events.0003.desc: "戦争があなたの領国の負担になっていることは周知の事実です。もし将来、私に便宜を図っていただけるなら、資金を投じる用意があるのですが…"
 gdp_purpose_events.0003.a: "今はどんな助力でもありがたい！"
 gdp_purpose_events.0003.b: "便宜を図れだと？お断りだ！"
 no_thanks.tt: "あなたはこの機会を逃す…"
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "このような手紙を書くのは心苦しいが、我が領国は戦争で支援を必要としている。援助してくれるのなら、将来そちらに便宜を図る用意がある。"
 gdp_purpose_events.0004.a: "新たな特殊連隊を提供してもいい！"
 gdp_purpose_events.0004.b: "裏で根回しすることもできる…"
 gdp_merchant.1002.t: "商会の創設"
 gdp_merchant.1002.desc: "目の前の机には、空白の帳簿が一冊置かれている。開け放たれた窓の外から、[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]の喧騒が[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l]の事務所に流れ込み、値切る声や、荷車の軋む音、檻に入れられた家畜の鳴き声が聞こえてくる。\n\n書斎は質素で、薄暗い…私一人では、[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の商人たちと到底渡り合えそうにない。誰か商会を支えてくれる人間を雇うべきだろうか？"
 gdp_merchant.1002.a: "商売に長けた人材が必要だ。"
 gdp_merchant.1002.a.tt: "[stewardship|E]能力に長けた2人の[associates|E]を雇うことから始める"
 gdp_merchant.1002.b: "ライバルを威圧してやろう。"
 gdp_merchant.1002.b.tt: "[martial|E]能力に長けた2人の[associates|E]を雇うことから始める"
 gdp_merchant.1002.c: "巧みな交渉術が良い取引を生む。"
 gdp_merchant.1002.c.tt: "[diplomacy|E]能力に長けた2人の[associates|E]を雇うことから始める"
 gdp_merchant.1002.d: "学者ならいくらでもいる！"
 gdp_merchant.1002.d.tt: "[learning|E]能力に長けた2人の[associates|E]を雇うことから始める"
 gdp_merchant.1002.e: "狡猾さがあれば優位に立てる。"
 gdp_merchant.1002.e.tt: "[intrigue|E]能力に長けた2人の[associates|E]を雇うことから始める"
 gdp_merchant.1002.f: "いや、誰も必要ない。"
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial [associates|E]を採用するまで、[task_contracts|E]が達成困難か、達成不可能になる可能性があります#!"
 gdp_merchant.1002.f.tt.associates: "初期の[associates|E]を持たず、既にいる[family|E]と[friends|E]のみを頼りとする"
 gdp_merchant.1003.t: "商会の創設"
 gdp_merchant.1003.desc: "無数の人々でごった返す[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]が目の前に広がっている。取引が成立し、絶え間なく[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]が動いていく。\n\n交易の喧騒は至るところに満ちている。荷車の車輪が軋み、混み合った家畜小屋からは動物の鳴き声が響く。その喧騒の向こうでは、仲間の交易商人たちが競争相手を出し抜こうと声を張り上げている。\n\nここではあらゆる種類の商品が取引されている。大勢の商人たちと競い合うために、焦点を一つに絞るべきだろうか？"
 gdp_merchant.1003.a: "「鍵は大量輸送の手段を確保することだ」"
 gdp_merchant.1003.b: "「我々に対する[ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip]の評価を利用すべきだ」"
 gdp_merchant.1003.b.tt: "[patron_contract|E]が締結される"
 gdp_merchant.1003.c: "「商人たる我々にとって、利益こそがすべてだ」"
 gdp_merchant.1100.t: "過密な商会"
 gdp_merchant.1100.desc: "私の[ROOT.Char.Custom2('RelationToMe', plaintiff)]である[plaintiff.GetTitledFirstName]が書斎にやってきて、慎重に言葉を選びながら切り出した。「[ROOT.Char.GetFirstNameNoTooltip]…これは本来、家族経営の商売のはずなのに、我々はますます外からの者たちに頼り切ってしまっている」\n\n「[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]は、威厳を保つためにも、無駄をそぎ落とすべきだ」"
 gdp_merchant.1100.a: "「もう[associate_2.GetFirstNameNoTooltip]は必要ない」"
 gdp_merchant.1100.b: "「そろそろ[associate_1.GetFirstNameNoTooltip]とは別の道を歩む時だ」"
 gdp_merchant.1100.c: "「ああ、余計な者を整理しよう…」"
 gdp_merchant.1100.d: "「馬鹿を言うな、今はどんな助力でもありがたい」"
 merchant_overcrowding_ignored_loss: "商会の過密状態を放置した"
 merchant_overcrowding_fired_gain: "過密状態を解消するため、商会員を1人解雇した"
 merchant_overcrowding_yeet_gain: "過密状態を解消するため、商会員を複数人解雇した"
 gdp_merchant.1200.t: "商会員からの要請"
 gdp_merchant.1200.desc: "帳簿に向き合った一日の終わり、[ROOT.Char.Custom2('RelationToMe', requester)]の[requester.GetTitledFirstName]が私の部屋の扉のところで待ち構えているのに気づいた。「ああ、[ROOT.Char.Custom2('RelationToMeAddress', requester)]！ずっと尋ねようと思っていたんだが…」\n\n"
 gdp_merchant.1200.desc.artifact: "「あなたの采配の下で商会はとても順調で、帳簿には数多くの貴重な品々が記録されている。一つ頼みなんだが…その一つを私に譲ってもらえないだろうか？」"
 gdp_merchant.1200.desc.activity: "「商会はよく働いているし、あなたも私たちをよく率いてくれているが、そろそろ記憶に残るような催しで自分たちの功績を祝うべきではないだろうか？」"
 gdp_merchant.1200.desc.luxury_contract: "「あなたの指揮の下、商会の交易路は順調だが、世界の果てにはまだ誰も目にしたことのない素晴らしいものがたくさんあるはずだ…」"
 gdp_merchant.1200.a: "「よかろう、どうにかしよう」"
 gdp_merchant.1200.b: "「まったく、私には他にやるべきことがある」"
 merchant_associate_request_fulfill_gain: "[associate_possessive|E]の要請を承諾した"
 merchant_associate_request_reject_loss: "[associate_possessive|E]の要請を拒絶した"
