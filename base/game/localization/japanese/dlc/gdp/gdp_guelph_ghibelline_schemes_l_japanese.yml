l_japanese:
 #Side Switch Scheme
 gg_switch_sides: "寝返りを促す"
 gg_switch_sides_desc: "この状況下で、どちらが#EMP 正しい#!党派なのか…[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]はじきに理解することになるだろう。"
 gg_switch_sides_desc_general: "[scheme|E]「$gg_switch_sides$」は、[situation|E]「[guelph_ghibelline_situation|E]」において、[scheme_target|E]に党派を変えるよう説得することを目的とした[political_scheme|E]である"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]が[CHARACTER.Custom('GetGuelphsGhibellinesConcept')]に加わる"
 gg_switch_sides_invalidated_title: "@scheme_icon! $gg_switch_sides$工作が終了"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$#weak （工作）#!"
 gg_switch_sides_action: "説得"
 scheme_interaction_tt_gg_switch_sides: "[actor.Custom('GetGuelphsGhibellinesConcept')]に加わるよう[recipient.GetShortUINameNoTooltip]の説得を試みる"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip]は以前あなたから[actor.Custom('GetGuelphsGhibellinesConcept')]に加わるよう要求されたことに、いまだに怒っている"
 #Claim Leadership Scheme
 gg_claim_leadership: "主導権主張"
 gg_claim_leadership_desc: "[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')]はまもなく、自分たちの指導者に最もふさわしい者が誰なのかを理解するだろう"
 gg_claim_leadership_desc_general: "[scheme|E]「$gg_claim_leadership$」は、[situation|E]「[guelph_ghibelline_situation|E]」において、[scheme_owner|E]を自派の指導者にすることを目的とした[political_scheme|E]である。\n\n[scheme_owner|E]の[gg_involvement|E]が現在の指導者と比較して高いほど、その[scheme_success_chance|E]は高くなる。また、[prestige_level|E]が指導者を上回ることも有利に働く。"
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U]が[CHARACTER.Custom('GetGuelphsGhibellinesConcept')]の新しい指導者になる"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "[prestige|E]の喪失と[TARGET_CHARACTER.GetShortUIName]との関係悪化を回避する"
 gg_claim_leadership_invalidated_title: "@scheme_icon! $gg_claim_leadership$工作が終了"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$#weak （工作）#!"
 gg_claim_leadership_action: "主導権を奪取"
 scheme_interaction_tt_gg_claim_leadership: "[recipient.GetShortUIName]から[recipient.Custom('GetGuelphGhibellineConcept')]の主導権を奪取しようと試みる"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "無所属者の取り込み"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]が[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')]に共感するよう仕向ける"
 gg_align_undecided_desc_general: "[scheme|E]「$gg_align_undecided$」は、[situation|E]「[guelph_ghibelline_situation|E]」において、[scheme_target|E]を[scheme_owner|E]の党派に加わらせることを目的とした[political_scheme|E]である"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]が[CHARACTER.Custom('GetGuelphGhibellineConcept')]になる"
 gg_align_undecided_invalidated_title: "@scheme_icon! $gg_align_undecided$工作が終了"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$#weak （工作）#!"
 gg_align_undecided_action: "取り込む"
 scheme_interaction_tt_gg_align_undecided: "[recipient.GetShortUIName]を[actor.Custom('GetGuelphsGhibellinesConcept')]に取り込もうと試みる"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "統治者交代"
 gg_replace_ruler_desc: "[SCHEME.GetTargetCharacter.GetShortUINamePossessiveNoTooltip]の役目はもはや終わった。[SCHEME.GetTargetCharacter.GetSheHe]はもう少し…#EMP 理性的#!な人物と交代する必要がある。"
 gg_replace_ruler_desc_general: "[scheme|E]「$gg_replace_ruler$」は、[situation|E]「[guelph_ghibelline_situation|E]」において、[scheme_target|E]を[scheme_owner|E]の党派に忠実な統治者へ交代させることを目的とした[political_scheme|E]である"
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]が[CHARACTER.Custom('GetGuelphGhibellineConcept')]の忠実な支持者に交代させられる"
 GG_REPLACE_RULER_DISCOVERY_DESC: "[prestige|E]の喪失と[TARGET_CHARACTER.GetShortUIName]との関係悪化を回避する"
 gg_replace_ruler_invalidated_title: "@scheme_icon! $gg_replace_ruler$工作が終了"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$#weak （工作）#!"
 gg_replace_ruler_action: "交代"
 scheme_interaction_tt_gg_replace_ruler: "[recipient.GetShortUIName]を[actor.Custom('GetGuelphGhibellineConcept')]の忠実な支持者に交代させようと試みる"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip]は以前あなたが[recipient.GetHerHim]を交代させようとしたことで、いまだに強い警戒心を抱いている"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "[situation_phase_phase|E]「[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]」の間は、[GetSituation('guelph_ghibelline').GetName]の指導者を交代させることはできない"
 #Invalidation
 scheme_gg_situation_ended: "[guelph_ghibelline_situation|E]が終結した"
 scheme_owner_not_aligned: "あなたはもはや[guelph|E]でも[ghibelline|E]でもない"
 scheme_target_not_aligned: "[target.GetShortUIName]はもはや[guelph|E]でも[ghibelline|E]でもない"
 scheme_target_not_undecided: "[target.GetShortUIName]はもう[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'undecided' ).GetName]ではない"
 scheme_owner_not_in_gg_situation: "あなたはもはや[situation|E]「[GetSituation('guelph_ghibelline').GetName]」に関与していない"
 scheme_target_not_in_gg_situation: "[target.GetShortUIName]はもはや[situation|E]「[GetSituation('guelph_ghibelline').GetName]」に関与していない"
 scheme_target_already_your_side: "[target.GetShortUIName]はすでに[target.Custom('GetGuelphGhibellineConcept')]である"
 scheme_target_is_titleless: "[target.GetShortUIName]はもはや称号を持っていない"
 scheme_target_might_get_displaced: "[target.GetShortUIName]は[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V][war|E]における主要防衛者である"
 scheme_target_might_get_reinstated: "[target.GetShortUIName]は[GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|V][war|E]における主要防衛者である"
 scheme_owner_is_already_leader: "あなたはすでに[owner.Custom('GetGuelphsGhibellinesConcept')]の指導者である"
 scheme_target_no_longer_gg_leader: "[target.GetShortUIName]はもはや[owner.Custom('GetGuelphsGhibellinesConcept')]の指導者ではない"
