l_japanese:
 guelphs_ghibellines_prefix: "ゲルフ派とギベリン派："
 gdp_guelph_ghibelline.0500.t: "ゲルフ派とギベリン派"
 gdp_guelph_ghibelline.0500.intro.all: "疑わしげな視線、軽蔑するような鼻息——[pope_scope.GetTitledFirstName]と[ghibelline_leader.GetTitledFirstName]の対立により、かつて固く結びついていた北イタリアの共同体の間に、次第に亀裂が広がっている。\n\n[ghibelline_leader.GetTitleAsNameNoTooltip]のギベリン派を支持し、帝国の権威と庇護を求める者たちは、教皇側につくゲルフ派を支持して、より大きな自治を求める者たちと対立している。"
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "疑わしげな視線、軽蔑するような鼻息——背教者[ghibelline_leader.GetTitleAsName]と、敬虔な我が役人たちの馬鹿げた対立により、かつて固く結びついていた北イタリアの共同体に、残念なことに亀裂が次第に広がっている。\n\n安全と庇護を求めて皇帝支持のギベリン派につく者たちがいる一方、我がゲルフ派は神を畏敬し、暴君から自治を守ろうとしている。\n\n共に力を合わせて、[ghibelline_leader.GetTitleAsNameNoTooltip]に道理をわからせよう。今こそ、私の[ROOT.Char.Custom('GetHighestSkillAdjective')]を活かす時だ。"
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "疑わしげな視線、軽蔑するような鼻息——教皇庁の愚か者どもと私の馬鹿げた対立が、かつて固く結びついていた北イタリアの共同体に亀裂を広げているらしい。\n\n安全と庇護を求めて#EMP 我が#!ギベリン派を支持する者たちがいる一方、教皇庁の愚かなゲルフ派を支持する者たちは、不安定かつ脆弱な自治を求めている。\n\n私は[ghibelline_leader.GetTitleAsNameNoTooltip]として、教会勢力であるゲルフ派の厄介な干渉者たちに警戒を強めている。彼らはこれまで散々、私の権威を脅かしてきた。もうこれ以上は許さない。どんな手段を使ってでも、彼らを従わせてやる…"
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\n忠義に篤い指導者[guelph_leader.GetFirstNameNoTooltip]が我らの代弁者となり、帝国の抑圧者に立ち向かってくれますように。私も自分の役目を果たそう。"
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\n我らを害そうとする者たちから、民と領土を守っているのは、我らの[ghibelline_leader.GetTitleAsNameNoTooltip]ただ一人だ。だからこそ、私も[ghibelline_leader.GetHerHis]のギベリン派を全面的に支持しよう。"
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nまだどちらに味方するか決めていない以上、[ROOT.Char.GetHouse.GetBaseName]一族にとって最善の結果となるよう、争い合う両派を慎重に見極めなければならない。"
 gdp_guelph_ghibelline.0500.a: "前進あるのみだ！"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "この厄介な争いにおいて、あなたは倦むことなく[ROOT.Char.Custom('GetGuelphGhibellinePossessive')]の影響力を高め、その地位を強固なものにしてきたと聞き及んでいる。\n\nその働きに対し、私は心からの感謝を捧げよう。"
 gdp_guelph_ghibelline.1000.a: "心より感謝する。"
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "落ちぶれた[actor.Custom('GetGuelphsGhibellines')]に加わる気はない。"
 gdp_guelph_ghibelline.5000.a: "愚かな。"
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U]は数年間、[recipient.GetShortUIName]に[actor.Custom('GetGuelphsGhibellines')]に加わることを要請できなくなる。"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ヴォルムス協約"
 gdp_guelph_ghibelline.6500.desc: "この争いは、あまりにも長く続きすぎた。熟考を重ねた末、書記たちが協定書をまとめてきた。\n\n[ghibelline_leader.GetTitleAsNamePossessive|U]の教会の人事に対する影響力は制限されるが、引き続き選挙の立ち会いと、選挙結果を巡る争いの裁定は認められることになる。\n\n私は顎をなでながら、この取り決めが我々にどのような影響を及ぼすのか、慎重に考えを巡らせた。"
 gdp_guelph_ghibelline.6500.a: "これこそ進むべき道だ。"
 gdp_guelph_ghibelline.6500.b: "教皇権こそが#EMP 至高の権力#!である！"
 concordat_of_worms_fulfilled.t: "ヴォルムス協約の履行"
 concordat_of_worms_abandoned.t: "ヴォルムス協約の破棄"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName]が協約を受諾するか否かを決定する"
 cow_phase_moves_to_agitation.tt: "[GetSituation('guelph_ghibelline').GetName]は序章段階を終え、[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]フェーズへ移行する"
 cow_phase_moves_to_repose.tt: "[GetSituation('guelph_ghibelline').GetName]は序章段階を終え、[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]フェーズへ移行する"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "意見の相違はいったん忘れて、教会人事のあるべき形については合意しようではないか。\n\nそれと引き換えに、[ROOT.Char.GetTitleAsNameNoTooltip|U]には選挙への立ち会いと、選挙結果を巡る争いの裁定が認められる。"
 gdp_guelph_ghibelline.6505.a: "これで手を打つとしよう…"
 gdp_guelph_ghibelline.6505.b: "到底受け入れられん！"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$$lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "[hre_kaiser.GetTitleAsName]が北イタリアに狙いを定め、中央集権化を行って自らの権力を強めようとしているとの噂が広まっている。そんななか、私の使者たちが戻ってきた。"
 gdp_guelph_ghibelline.7000.desc.all: "\n\nこちらからの呼びかけに応じて、全員がロンバルディア同盟に加わった。\n\nこれでいつ[hre_kaiser.GetTitleAsName]が何らかの動きを見せようとも対抗できる…！"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nこちらからの呼びかけに応じて、過半数がロンバルディア同盟に加わった。\n\nこれで[hre_kaiser.GetTitleAsName]に対抗できるはずだ。教会勢力からの支援も期待できるかもしれない…"
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nロンバルディア同盟に加わった者はごくわずかで、正直なところ不安は拭えない。\n\n#EMP だが問題ない！#! 神のご加護が少しでもあれば、手にしたばかりの独立を守り抜けるはずだ。"
 gdp_guelph_ghibelline.7000.a: "変革の時だ！"
 gdp_guelph_ghibelline.7000.b: "今こそ我らの時代だ！"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$$lombard_league_name$への加盟について"
 gdp_guelph_ghibelline.7005.desc: "どうやら[league_creator.GetTitledFirstName]は、名誉ある[league_creator.GetWomanMan]だったようだ。\n\n[league_creator.GetSheHe]が[hre_kaiser.GetTitleAsName]の勢力拡大を食い止めるため、[lombard_league_conf.GetName]を結成したとの知らせが届いた。\n\n帝国のくびきから逃れたい者にとっては、実に理にかなった構想に思えるが…"
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "焦ることはあるまい…"
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$$lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "使者の報告によれば、争い好きな[ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))]、#EMP [league_creator.GetTitledFirstName]#!が、[league_creator.GetCapitalLocation.GetTitle.GetNameNoTier]の現状に不満を抱いているらしい。しかもあの裏切り者ときたら、ほかの愚かな羊どもまで言いくるめて仲間に引き入れたのだ！\n\n大体、#EMP ロンバルディア同盟#!とは一体何なのだ！？"
 gdp_guelph_ghibelline.7010.a: "この無礼を見過ごすわけにはいかぬ！"
 gdp_guelph_ghibelline.7010.b: "ほかに優先すべきことがある。"
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName]が[league_creator.GetConfederation.GetName]を結成した#weak（現在の加盟数：#V [lombard_league_conf.GetMemberCount]#!）#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "残念ですが、ロンバルディア同盟はあなたの#EMP 寛大なる#!ご支援なしでやっていくことになりそうです。"
 gdp_guelph_ghibelline.7015.a: "うーん。"
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$妥協案の成立"
 gdp_guelph_ghibelline.8500.desc: "ゲルフ派とギベリン派の代表、[guelph_leader.GetName]と[ghibelline_leader.GetName]が条約の署名に臨むと、観衆の間でざわめきが広がった。\n\n妥協に至ったことを喜ぶ者もいれば、あからさまに憤る者もいる。自分こそが正しいと信じてやまない者たちが、信念を曲げさせられたと憤っているのだ。\n\nその後、人々が慣例の晩餐の準備に向かう中、あちこちで小声の会話が交わされた。"
 gdp_guelph_ghibelline.8500.a: "ようやく終わった。"
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "まだ自分の過ちを理解していないようだな。お前達[actor.Custom('GetGuelphsGhibellines')]が明らかに間違っているというのに、なぜこちらがここまで譲歩しなくてはならないのだ？\n\n理不尽もここまでくると笑えない。"
 gdp_guelph_ghibelline.8510.a: "無礼者め！"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U]は、[GetSituation('guelph_ghibelline').GetName]の[situation|E]を終結させる提案を拒否した"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "この合意は外交上の見せ場だった。それだけは確かだ。\n\n[guelph_leader.GetName]と[ghibelline_leader.GetName]はいずれも譲歩し、小さな勝利を得る一方で、人々からの支持を失った。\n\n時の試練に耐える条約を結ぶことは容易ではない。過去に区切りをつけ、より明るい未来へと目を向けられる者がどれだけいるかは、これから明らかになっていくだろう。"
 gdp_guelph_ghibelline.8520.a: "多分、これで良かったのだろう。"
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$[ROOT.Char.Custom('GetGuelphGhibelline')]の勝利"
 gdp_guelph_ghibelline.9000.desc.guelph: "これで決着だ。我々は最も神聖な権利、すなわち、教皇が聖なる羊飼いを守り、そして選出する至高の権威を守り抜いた。\n\n[GetTitleByKey('e_hre').GetName]の影響力を抑え込むこともできた。[GetTitleByKey('e_hre').GetName]の野心は、最終的には我々全員を脅かすものであったのだ。\n\n#EMP 迷える#!ギベリン派の者どもは、何が起きたのかも分かっていないだろう。"
 gdp_guelph_ghibelline.9000.desc.ghibelline: "ついに我々は、[ROOT.Char.GetFaith.HighGodName]のご意思に従って帝国を統治する正当な権利、すなわち、厳格かつ理性的な統治を行う権利が我々にあることを証明した。\n\nそもそも、神聖な媒介者の座を失った者が、[GetTitleByKey('e_hre').GetName]の地を正当に統治できる人間を決められるはずもない。\n\n教皇を支持するゲルフ派の者どもは、魂の世話でもしておけばいい。#EMP 本当に#!重要な問題には、我々が対処する。"
 gdp_guelph_ghibelline.9000.a: "祝宴を開く時が来たようだ。"
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$[ROOT.Char.Custom('GetGuelphGhibelline')]の敗北"
 gdp_guelph_ghibelline.9010.desc.win: "我々はこれまでに何度も、脆弱な[ROOT.Char.Custom('GuelphGhibellineGetOpposite')]と対立しながらも、民衆の支持を勝ち取ってきた。\n\n我らが名高き指導者[victorious_leader.GetTitledFirstName]は、中立的な立法者たちとともに、[ROOT.Char.Custom('GetGuelphsGhibellines')]の正当性を公認し、#EMP 事態#!に終止符が打たれた。\n\nついにこの地にも理性が訪れたのだ！"
 gdp_guelph_ghibelline.9010.desc.lose: "我々は民衆からの支持を失いつつある。それは事実だ。\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')]の力と影響力は、本来あるべき水準にも、必要とされる水準にも届いていない。その上、愚鈍な[ROOT.Char.Custom('GuelphGhibellineGetOpposite')]の統治者どもときたら、我々に対抗するため、強大な影響力を持つ#EMP 中立的な#!立法者たちをかき集め、味方につけている。\n\nもはや[ROOT.Char.Custom('GetGuelphsGhibellines')]は戦いから退き、より現実的な目標に集中すべき時が来た。"
 gdp_guelph_ghibelline.9010.a.win: "この瞬間を味わおう。"
 gdp_guelph_ghibelline.9010.a.lose: "忌々しい#EMP 蛇ども#!め。"
