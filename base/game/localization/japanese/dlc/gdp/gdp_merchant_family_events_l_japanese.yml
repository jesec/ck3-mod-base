l_japanese:
 gdp_merchant_family.0001.t: "駆け落ちした[house_member.Custom('GetBrideGroom')|U]"
 gdp_merchant_family.0001.desc: "暗がりで足を取られた拍子に、我が[ROOT.Char.Custom2('RelationToMe', house_member)]である[house_member.GetTitledFirstName]が商会の金庫を漁っているのが見えた。その傍らには[wedding_interest.GetWomanMan]がおり、小声で立ち去るよう促していた。\n\n「これは一体どういうことだ？」と私が問うと、二人は互いに抱き合いながら振り返った。ここで私は、見知らぬ人物が[wedding_interest_house_head.GetTitledFirstNamePossessive]の[wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)]であることに気づく。\n\n「もうここにはいられない。両家の間に横たわる憎しみが私たちを引き離すだろうから、出て行くことに決めたのだ」と、[house_member.GetTitledFirstNameNoTooltip]は言い、"
 gdp_merchant_family.0001.desc.stubborn_outro: "挑戦的な態度で顎を上げ、[wedding_interest.GetTitledFirstNamePossessiveNoTooltip]の手を強く握りしめた。"
 gdp_merchant_family.0001.desc.fallback_outro: "辛そうに[wedding_interest.GetTitledFirstNamePossessiveNoTooltip]の手を離し、無言の懇願を込めて私に手を伸ばした。"
 gdp_merchant_family.0001.a: "「金を持っていきなさい。私の祝福とともに」"
 gdp_merchant_family.0001.b: "「どうにか、二人ともここに残ってくれないだろうか？」"
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName]があなたに加わる"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName]は納得していない"
 gdp_merchant_family.0001.c: "「#EMP どこへも#!行かせんぞ！！」"
 gdp_merchant_family.0002.t: "血よりも濃いもの"
 gdp_merchant_family.0002.desc_intro: "最新の利益報告書を確認していると、[blood.Custom2('MyCharacterIntroduction', ROOT.Char)]が部屋に押し入ってきた。\n\n「あの[water.Custom('InsultAdjective')][water.Custom('InsultNoun')]は超えてはならぬ一線を超えました」と[blood.GetSheHe]が噛みつくように言った。「[water.GetSheHe|U]は無謀な身の程知らずです。そのせいで私たちまで愚かな人間だと思われています。 "
 gdp_merchant_family.0002.desc_adopted: "到底[ROOT.Char.GetHouse.GetName]家にふさわしい人間ではありません」"
 gdp_merchant_family.0002.desc_associate: "ただの商会員の分際で、このような振る舞いは到底ふさわしくありません」"
 gdp_merchant_family.0002.desc_outro: "\n\n不満の言葉がようやく尽きたところで、私は帳簿に視線を戻した。真実がどうであれ、[water.GetFirstNameNoTooltip]が利益をもたらしていることは確かだ。"
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip]は身の程をわきまえるべきだ。"
 gdp_merchant_family.0002.a.unity_gain.desc: "商売よりも血縁を選んだ"
 gdp_merchant_family.0002.b: "[water.GetFirstNamePossessiveNoTooltip]と同じだけの成果を出してから言え。"
 gdp_merchant_family.0002.b.unity_loss.desc: "血縁よりも商売を選んだ"
 gdp_merchant_family.0002.c: "「こんなことに構っている暇はないのだ…」"
 gdp_merchant_family.0003.t: "恥辱を許すな"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U]は明らかに苛立った様子で私のもとへやって来た。\n\n「たった今、私が何と言われたと思いますか？」と[offended.GetSheHe]が言った。「[offender.Custom2('MyCharacterIntroduction', ROOT.Char)]は楽しげに私を、ひいては一族を侮辱したのです」\n\n大した侮辱ではないが、意図的ではある。"
 gdp_merchant_family.0003.a: "[ROOT.Char.GetFaith.HighGodName]の名にかけて、[offender.GetHouse.GetNameNoTooltip]家は謝罪すべきだ！"
 gdp_merchant_family.0003.a.unity_gain.desc: "公然と侮辱されたことに対し、一族の結束を示した"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U]は[target_char.GetShortUINamePossessive]の一族を公然と侮辱した"
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U]、相手の裏の意図を読み取るのだ…"
 gdp_merchant_family.0003.b.unity_loss.desc: "侮辱に侮辱で返すことを拒否した"
 gdp_merchant_family.0003.c: "この件についてはお前が何とかしなさい。私は他の用事がある。"
 gdp_merchant_family.0003.c.unity_loss.desc: "家に対する侮辱を無視した"
 gdp_merchant_family.0004.t: "縁起のいい申し出"
 gdp_merchant_family.0004.desc: "のんびりと散歩をしていると、中庭の向こうから聞き慣れない声に呼び止められた。「少しお話をよろしいでしょうか、[ROOT.Char.Custom('FormOfAddressForLiege')]様」。[offer_2.GetFullName]は私の目の前に立つと、甘い調子で語りかけてきた。\n\n「[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U]からの使いで参りました。[offer.Custom2('YourCharacterIntroduction', ROOT.Char)]と結婚し、両家の絆を強めるよう申しつかったのです」私は思わず息を呑んで、その申し出について考えた。\n\n「さあ、[ROOT.Char.Custom('FormOfAddressForLiege')]様はどうお考えですか？」"
 gdp_merchant_family.0004.a: "「我が[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))]は光栄に思うだろう」"
 gdp_merchant_family.0004.b: "「互いの利益になる取引をするのはどうだ？」"
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U]と[target_char.GetShortUINamePossessive]は互いの利益になる取引に署名した"
 gdp_merchant_family.0004.c: "「丁重にお断りするが、滞在は歓迎する」"
 gdp_merchant_family.0005.t: "[ROOT.Char.GetHouse.GetNameNoTooltip]家の恥"
 gdp_merchant_family.0005.desc: "[wayward.Custom2('MyCharacterIntroduction', ROOT.Char)]が、管理していた重要な荷を紛失したという報せが届いた。これを放置すれば、我々の評判が地に落ちかねない。私は[wayward.GetHerHim]を私室に呼び、この件について問いただした。\n\n「本当に申し訳ありません、[wayward.Custom2('RelationToMe', ROOT.Char)]様。ですがこれは私の失態ではないのです。我が血族、我が一族そのものが私を陥れようとしているのです！」"
 gdp_merchant_family.0005.a: "「おのれ、この[wayward.Custom('InsultAdjective')][ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]め！」"
 gdp_merchant_family.0005.a.unity_loss.desc: "一族の人間を公然と糾弾した"
 gdp_merchant_family.0005.b: "「常に共に戦おう」"
 gdp_merchant_family.0005.b.unity_gain.desc: "困難に共に立ち向かうことを選んだ"
 gdp_merchant_family.0005.c: "「何とかしろ」"
 gdp_merchant_family.0010.t: "天秤の傾き"
 gdp_merchant_family.0010.desc: "#EMP ガラガラガラッ！#!——木箱が地面に叩きつけられる大きな音に、普段の[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]の活気がぴたりとやんだ。振り向くと、商会員の[attacker.GetTitledFirstName]と[defender.GetTitledFirstName]が、今にも殴り合いを始めそうになっている。\n\n「私はこの家のために身を削って働いています」と、[attacker.GetTitledFirstNameNoTooltip]は目に激しい怒りを浮かべて言い、[attacker.Custom('quirk_neg_present')]。「それに比べてこの[defender.GetWomanMan]ときたら、[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]で怠けてばかり。あなたが止めないのなら、私がこいつに道理というものを叩き込んでやりますよ」"
 gdp_merchant_family.0010.a: "我が商会の人間にふさわしくない振る舞いだ。"
 gdp_merchant_family.0010.a.tt.success: "仲裁に成功する"
 gdp_merchant_family.0010.a.tt.failure: "仲裁に失敗する"
 gdp_merchant_family.0010.b: "いいぞ、落とし前の付け方を見せてやれ。"
 gdp_merchant_family.0010.c: "[defender.GetTitledFirstNameNoTooltip]に手を上げたことを後悔するぞ！"
 gdp_merchant_family.0010.d: "好きにしろ。"
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUIName]と[defender.GetShortUIName]が[prowess_i] [prowess|E]と[martial_i] [martial|E]を組み合わせた決闘を始めます！どちらかが負傷することになります#!"
 merchant_unity_fight_stopped: "商会員同士の争いを止めた"
 merchant_unity_fight_promoted: "商会員同士の争いを煽った"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip]が勝利する"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U]は[defender.GetFirstName]を負傷させた"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip]が勝利する"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.GetSheHe|U]は自己防衛で[attacker.GetFirstName]を負傷させた"
 gdp_merchant_family.0015.t: "商売上の腹心"
 gdp_merchant_family.0015.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l]に見慣れた顔が並ぶなか、[tip_giver.GetShortUIName]が私の注意を引き、脇へ呼び寄せた。[tip_giver.GetSheHe]は悪戯っぽい笑みを浮かべながら、一冊の台帳を差し出す。\n\n「ああ、[ROOT.Char.GetTitledFirstName]、まさに探しておりました。私が最近手に入れた裏情報を、いくつかお教えしようと思いましてね。これは、我々が今後も協力していくための手土産とお考えください」"
 gdp_merchant_family.0015.a: "「我らで手を組めば、莫大な利得を上げられるだろう！」"
 gdp_merchant_family.0015.b: "「その台帳を買い取ろう」"
 gdp_merchant_family.0015.b.artifact: "内密の台帳"
 gdp_merchant_family.0015.b.artifact.desc: "市場の利得、利幅、そして有益な人脈が記され、厳重に守られた帳簿"
 gdp_merchant_family.0015.c: "「#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#!の役に立つだろう…」"
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U]と[target_char.GetShortUIName]が有益な情報を交わした"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U]は得た情報を利用して[target_char.GetShortUINamePossessive]を出し抜いた"
 gdp_merchant_family.0020.t: "才能の交換"
 gdp_merchant_family.0020.desc: "我が商会の取引相手である[house_friend.Custom('MistressMaster')|U]の[house_friend.GetFirstName]が、いつもの顔合わせに遅れている。[house_friend.GetSheHe]がようやく到着したとき、予想外の同伴者がいた。\n\n「[ROOT.Char.Custom('MistressMaster')|U]、こちらは私の[house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))]である[nepo_hire.GetFirstName]で、 "
 gdp_merchant_family.0020.desc.diplomacy: "有能な外交官です。 "
 gdp_merchant_family.0020.desc.martial: "頑固一徹な戦略家です。 "
 gdp_merchant_family.0020.desc.stewardship: "帳簿の扱いに長けた者です。 "
 gdp_merchant_family.0020.desc.intrigue: "機知に富んだ[nepo_hire.GetWomanMan]です。 "
 gdp_merchant_family.0020.desc.learning: "博識豊かな[nepo_hire.GetWomanMan]です。 "
 gdp_merchant_family.0020.desc.outro: "[ROOT.Char.GetPrimaryTitle.GetName]でのあなたの指導の下なら、必ずや大いに活躍することでしょう」"
 gdp_merchant_family.0020.a: "「[nepo_hire.GetFirstNameNoTooltip|U]を歓迎しよう」"
 gdp_merchant_family.0020.a.unity_loss.desc: "恩義から商会員の地位を与えた"
 gdp_merchant_family.0020.b: "「申し訳ないが、あいにく空きはない」"
 gdp_merchant_family.0020.b.unity_gain.desc: "部外者の採用を断った"
 gdp_merchant_family.0020.c: "「そのような提案は私への侮辱だ」"
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U]は[target_char.GetShortUINamePossessive]の身内を自らの商会に引き入れた"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U]は[target_char.GetShortUINamePossessive]の身内を拒否した"
 gdp_merchant_family.0025.t: "私怨にあらず"
 gdp_merchant_family.0025.desc: "商取引の協定書に延々と署名し、ようやく片付いたころには手首が痛むほどだった。そろそろ一日の仕事を終えようとしたその矢先、[leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)]が近寄ってきた。[leaving_associate.GetSheHe]は落ち着かない様子で一枚の小さな羊皮紙を掲げ、その内容を読み上げた。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')|U]、大変心苦しいのですが、[rival_poacher.GetPrimaryTitle.GetName]よりどうにも断り切れない申し出をいただきました。あなたに対して不満があるわけではなく、あくまで商売上の判断にございます」"
 gdp_merchant_family.0025.a: "「私の祝福を胸に行くがいい」"
 gdp_merchant_family.0025.b: "「お前の居場所はここ、我々の側にある」"
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U]は[company|E]に留まる"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip]は留まることに同意する"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip]は構わず去っていく"
 gdp_merchant_family.0025.c: "「覚えておけ、お前は私に借りがある」"
 gdp_merchant_family.0025.d: "「よかろう、去るがいい」"
 gdp_merchant_family.0025.d.rival: "「[rival_poacher.GetTitledFirstNameNoTooltip]め、私を敵に回したことを後悔させてやる！」"
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U]は[CHARACTER.GetShortUIName]から[associate|E]を引き抜いた"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U]は善意に基づき[associate|E]を[target_char.GetShortUINamePossessive]の商会へ送り出した"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U]は[char.GetHouse.GetName]家から[associate|E]を引き抜いた"
 gdp_merchant_family.0030.t: "商売か、それとも遊びか？"
 gdp_merchant_family.0030.desc: "我が商会員、[house_member.GetTitledFirstName]と[associate.GetTitledFirstName]の二人が、#EMP かなり#!長めの食事を終えて[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]の執務室へ戻ってきた。手には[ROOT.Char.Custom('RegionalAlcoholicDrink')]の入った壺が握られている。\n\n「…で、こう言ってやったのさ。あんな猫は豚小屋がお似合いだってな！」と、[house_member.GetTitledFirstNameNoTooltip]が言うと、[associate.GetTitledFirstNameNoTooltip]は腹を抱えて大笑いした。 \n\nこのまま放置すれば、二人は今日一日まともな仕事などしないだろう。"
 gdp_merchant_family.0030.a: "「もっとちゃんとした酒を用意してやろう」"
 gdp_merchant_family.0030.a.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]には最高の酒のみが相応しい！"
 gdp_merchant_family.0030.b: "「さっさと仕事に戻れ、この恩知らずどもめ！」"
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]は怠け者を一切許容しない"
 gdp_merchant_family.0030.c: "この友情がどこへ向かうか見ものだな。"
 merchant_unity_breaks_encouraged: "市場で手に入る最高級の酒のみを嗜む"
 merchant_unity_breaks_discouraged: "怠惰な息抜きを咎めた"
 gdp_merchant_family.9000.t: "[ROOT.Char.GetHouse.GetNameNoTooltip]家の若[ROOT.Char.GetTitleAsNameNoTooltip]"
 gdp_merchant_family.9000.desc: "私はついにいっぱしの[ROOT.Char.GetWomanMan]となり、正式に[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]の[ROOT.Char.GetTitleAsNameNoTooltip|l]を務められる年齢になった。[ROOT.Char.Custom2('RelationToMeShort', predecessor)]、[predecessor.GetFirstName]の跡を継がねばならない。\n\n商会員たちの経験と知恵に頼るようにと言われてはいるものの、彼らは私が商売の世界で新たな道や機会を見出し、事業のかじ取りをしていくことに大きな期待を寄せている…"
 gdp_merchant_family.9000.a: "[educator.GetTitledFirstNamePossessiveNoTooltip]の指導はかけがえのないものとなるだろう。"
 gdp_merchant_family.9000.b: "どこから手をつけようか…"
 gdp_merchant_family.9000.route_hint_tt: "[distribution_routes|E]の作成と編集が可能になった"
 gdp_merchant_family.9010.t: "悲しみに暮れる商会"
 gdp_merchant_family.9010.desc: "[ROOT.Char.Custom2('RelationToMeShort', previous_holder)]、[previous_holder.GetFirstName]がこの世を去った。商会から深く敬愛されていた[previous_holder.Custom('MistressMaster')]であった。商会からは笑い声が消え、事務所での熱い議論も聞こえなくなり、皆が深い不安な表情を浮かべている。\n\n"
 gdp_merchant_family.9010.interim_generated: "皆が頼りにしているのは、事業運営の支援のために呼ばれた[interim.GetFirstName]という名の[interim.GetWomanMan]だ。"
 gdp_merchant_family.9010.interim_relation: "皆が頼りにしているのは我が[ROOT.Char.Custom2('RelationToMeShort', interim)]の[interim.GetFirstName]だ。"
 gdp_merchant_family.9010.interim: "皆が頼りにしているのは、我が[ROOT.Char.Custom2('RelationToMePossessive', previous_holder)]の信頼厚き商会員、[interim.GetFirstName]だ。"
 gdp_merchant_family.9010.close: "この人物は[previous_holder.GetFirstNamePossessiveNoTooltip]亡き後、商会の体制を整え直した。私が商会の舵を取れる年齢に達するまでの間は、この人物が日々の業務を監督することになる。"
 gdp_merchant_family.9010.a: "あまりにも急に物事が変化してしまった。"
 gdp_merchant_family.9110.t: "商売のコツ"
 gdp_merchant_family.9110.desc: "[ROOT.Char.Custom2('RelationToMeShort', trader)]の[trader.GetFirstName]は我が商会でも屈指の経験を持つ商人であり、事務所に姿を見せることは滅多とない。\n\n[trader.GetSheHe|U]は[route.GetName|l]を管轄し、すべての商品が確かに売り手から買い手へと届くよう手はずを整え、我々の懐を[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')]で潤してくれる。\n\n「良い商人というのはあちこちを飛び回っているものなのですよ」と言って[trader.GetSheHe|U]は笑う。「[ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')]にあるどの商店で誰が働いているのか、どんな面倒があるのかを知り、さらにはすべての町と隊商護衛の事情まで知り尽くしていますからね！」"
 gdp_merchant_family.9110.a: "自分が舵を取ることになったら、[trader.GetNameNoTooltip]のようになりたい。"
 gdp_merchant_family.9110.b: "「隊商の話を聞かせて！」"
 gdp_merchant_family.9110.b.tt: "成人時、あなたは#emp $trait_track_caravaneer$#!#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!の[trait_level_track_xp|E]を#V 10#!獲得する"
 gdp_merchant_family.9110.c: "「自分も[good.Custom('GetTradeGood')]商人になりたい！」"
 gdp_merchant_family.9110.c.tt: "成人時、[merchant.GetPrimaryTitle.GetDefinitiveName|l]は[category.GetNameWithIcon]の[trade_expertise|E]を#V 450#!獲得する"
 gdp_merchant_family.9130.t: "若き大志"
 gdp_merchant_family.9130.desc: "私は商会の日々の業務を観察することで多くを学び、商会員らも私が理解を深められるよう仕事の輪に入れてくれている。"
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]ははるか遠方まで広く交易を行っており、その帳簿には[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]から遠く離れた、読み方もよくわからない土地の名前が連なっている。どこにあるのかなど、私には見当もつかない。"
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]は希少で品質の良い品物の買い手としてよく知られており、[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]の職人たちの後援者としても名が通っている。"
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]は[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')]と引き換えに貸しを作ることで有名で、その帳簿には[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]でうだつの上がらない者たちや賭博師たちの名がびっしりと記されている。"
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]は確固たる地位を築いてはいるものの、これといった専門分野は持っていない。手広くいろいろな事業に手を出している、[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]に拠点を置く交易商会の一つに過ぎない。"
 gdp_merchant_family.9130.a: "商会の舵取りをする日が待ち遠しい。"
 gdp_merchant_family.9130.a.caravaneer: "そして、さらに遠くへと手を広げるだろう。"
 gdp_merchant_family.9130.a.artisan: "我が商会の名は品質の証だ。"
 gdp_merchant_family.9130.a.creditor: "信用こそが我々の商売だ。"
 gdp_merchant_family.9130.a.tt: "成人時、#emp $trait_track_caravaneer$#!、#emp $trait_track_artisan$#!、#emp $trait_track_creditor$#!#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!のそれぞれにおいて[trait_level_track_xp|E]を#V 5#!獲得する"
 gdp_merchant_family.9130.b: "世界は広い。可能性の塊だ。"
 gdp_merchant_family.9130.b.tt: "成人時、#P コストなし#!で[GetLaw('company_purpose_caravaneer').GetName]の[company_purpose|E]を採用し、#emp $trait_track_caravaneer$#!#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!の[trait_level_track_xp|E]を#V 20#!獲得する#!"
 gdp_merchant_family.9130.c: "人は美しい品々に大金を費やす。"
 gdp_merchant_family.9130.c.tt: "成人時、#P コストなし#!で[GetLaw('company_purpose_artisan').GetName]の[company_purpose|E]を採用し、#emp $trait_track_artisan$#!#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!の[trait_level_track_xp|E]を#V 20#!獲得する"
 gdp_merchant_family.9130.d: "真の権力と富は貸し借りの中に眠る。"
 gdp_merchant_family.9130.d.tt: "成人時、#P コストなし#!で[GetLaw('company_purpose_creditor').GetName]の[company_purpose|E]を採用し、#emp $trait_track_creditor$#!#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!の[trait_level_track_xp|E]を#V 20#!獲得する"
 company_purpose_child_blocker_tt: "あなたは[child|E]である"
 gdp_merchant_family.9140.t: "市場を学ぶ"
 gdp_merchant_family.9140.desc: "[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]にあるごみごみとした事務所で、私は[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]がどの交易路で儲けを出し、どの交易路を開拓しているのか教えこまれている。覚えるべき地名も商品名もあまりにも多い。\n\n[associate.GetFirstName]が[ROOT.Char.Custom('WritingInstrument')]でテーブルをコツコツと叩き、私は居眠りから覚める。「しっかりしてください！商会の仕事をちゃんと学ばないと、立派な[ROOT.Char.GetTitleAsNameNoTooltip]にはなれませんよ！」"
 gdp_merchant_family.9140.a: "「[category_1.Custom('GetTradeGoodCategory')]の交易について教えてほしい」"
 gdp_merchant_family.9140.a.tt: "成人時、[merchant.GetPrimaryTitle.GetDefinitiveName|l]は[category_1.GetNameWithIcon]の[trade_expertise|E]を#V 450#!獲得する"
 gdp_merchant_family.9140.b: "「[category_2.Custom('GetTradeGoodCategory')]の取引が面白そう」"
 gdp_merchant_family.9140.b.tt: "成人時、[merchant.GetPrimaryTitle.GetDefinitiveName|l]は[category_2.GetNameWithIcon]の[trade_expertise|E]を#V 450#!獲得する"
 gdp_merchant_family.9140.c: "「[category_3.Custom('GetTradeGoodCategory')]の流通について知りたい」"
 gdp_merchant_family.9140.c.tt: "成人時、[merchant.GetPrimaryTitle.GetDefinitiveName|l]は[category_3.GetNameWithIcon]の[trade_expertise|E]を#V 450#!獲得する"
 gdp_merchant_family.9150.t: "右腕"
 gdp_merchant_family.9150.desc: "成人となる日を待つ間、私は一日の大半を商会の共同経営者、[partner.GetFirstName]に付き従って過ごしている。私は[partner.GetHerHis]の商談や会合に影のように同行し、盗める限りの知識を盗んでいる。\n\nある日、帳簿とのにらめっこを終えた[partner.GetSheHe|U]が振り返って私を見る。「若[ROOT.Char.GetTitleAsNameNoTooltip]様、あなたは本当によく頑張っておられる」と言って笑い、一枚のコインをぽいと投げてよこした。「商売は甘くありません。ですが、[ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')][ROOT.Char.GetSuzerain.GetTitleAsName]とは違い、私たちを支えているのは私たち自身の頑張りなのです」"
 gdp_merchant_family.9150.a: "「絶対にあなたや商会の期待に応えてみせる」"
 gdp_merchant_family.9150.b: "「[partner.GetFirstNameNoTooltip]さん、これはあなたにこそ相応しい」"
 gdp_merchant_family.9150.b.tt: "今後#V 10#!年間、[partner.GetShortUINamePossessive]の[GetCourtPositionType( 'partner_court_position' ).GetName()]としての[aptitude|E]：#p +1#!"
 gdp_merchant_family.9150.c: "「でも、[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]の助けなしじゃ立ち行かないんじゃ？」"
 gdp_merchant_family.9150.c.tt: "成人時、あなたは#V 10#!年間にわたって[modifier|E]「[GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip]」を獲得する"
 merchant_childhood_suzerain_modifier: "後援者のごますり"
 merchant_childhood_suzerain_modifier_desc: "この人物は、最も大きな権限を持つ者と良好な関係を維持することの重要性をよく理解している。"
 merchant_childhood_desc: "交易商人の幼少期"
