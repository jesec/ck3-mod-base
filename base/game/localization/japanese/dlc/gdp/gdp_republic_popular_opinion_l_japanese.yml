l_japanese:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "低い領民の好感度：不穏な民衆"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "低い領民の好感度：危機に瀕する都市"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "高い領民の好感度：活気に満ちた都市"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "高い領民の好感度：繁栄する都市"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "経済停滞"
 gdp_popular_opinion_mild_neg_prosperity_desc: "民衆の不満によって市民は都市への投資に消極的になり、長期的な成長が鈍化している。"
 gdp_popular_opinion_mild_neg_taxes: "脱税"
 gdp_popular_opinion_mild_neg_taxes_desc: "不満を抱く市民は納税を逃れる方法を探しており、市内全地区からの収入が減少している。"
 gdp_popular_opinion_mild_neg_construction: "建設の遅延"
 gdp_popular_opinion_mild_neg_construction_desc: "労働者や職人は普段より非協力的になっており、費用が増大し、建設の進捗も遅れている。"
 gdp_popular_opinion_mild_neg_defense: "人手不足の城壁"
 gdp_popular_opinion_mild_neg_defense_desc: "市民は都市民兵となることを嫌がっており、都市の防衛は人手不足に陥っている。"
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "経済崩壊"
 gdp_popular_opinion_severe_neg_prosperity_desc: "深刻な社会不安によって都市経済は崩壊している。成長は停滞し、これまでの繁栄も失われはじめている。"
 gdp_popular_opinion_severe_neg_taxes: "税金反乱"
 gdp_popular_opinion_severe_neg_taxes_desc: "納税への公然たる抵抗が都市の全地区に広がり、公共収入を大幅に減少させている。"
 gdp_popular_opinion_severe_neg_construction: "建設ストライキ"
 gdp_popular_opinion_severe_neg_construction_desc: "ギルドや労働者が働くことを拒んでいる。建設は極めて遅く、費用も高くなっている。"
 gdp_popular_opinion_severe_neg_defense: "守備隊の離脱"
 gdp_popular_opinion_severe_neg_defense_desc: "持ち場を放棄する兵士や、任務への従事を拒む兵士が出ている。都市の城壁はほぼ無人となっている。"
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "都市への投資"
 gdp_popular_opinion_mild_pos_prosperity_desc: "明るい未来を確信する市民たちが都市の発展へ積極的に投資し、長期的な繁栄を緩やかに推進している。"
 gdp_popular_opinion_mild_pos_taxes: "進んで納税する納税者"
 gdp_popular_opinion_mild_pos_taxes_desc: "市民は不満を漏らすことなく納税し、都市の各地区からより多くの収入がもたらされている。"
 gdp_popular_opinion_mild_pos_construction: "都市発展への熱意"
 gdp_popular_opinion_mild_pos_construction_desc: "ギルドや職人たちは都市の発展に意欲的で、新たな建設事業の費用は軽減され、工期も短縮されている。"
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "繁栄の黄金時代"
 gdp_popular_opinion_strong_pos_prosperity_desc: "都市は楽観的な空気に満ちている。市民も商人も自由に投資し、力強く持続的な成長をもたらしている。"
 gdp_popular_opinion_strong_pos_taxes: "潤沢な国庫"
 gdp_popular_opinion_strong_pos_taxes_desc: "市民の都市に対する誇りが、全地区での積極的な納税に直結している。"
 gdp_popular_opinion_strong_pos_construction: "匠の建設"
 gdp_popular_opinion_strong_pos_construction_desc: "最高の職人や工匠たちが都市で働く栄誉を競い合い、建設費の低下と工事の迅速化をもたらしている。"
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "慎重な売り手"
 gdp_popular_opinion_mild_neg_sell_price_desc: "都市の不安により商人たちは慎重になり、取引を控え、市場全体の価格が低下している。"
 gdp_popular_opinion_mild_neg_capacity: "市場の警戒感"
 gdp_popular_opinion_mild_neg_capacity_desc: "信頼の低下により一部の商人が活動を縮小し、市場の取引容量が低下している。"
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "市場の混乱"
 gdp_popular_opinion_severe_neg_sell_price_desc: "街中の混乱により売り手は商品を売り急ぎ、市場は崩壊に向かい価格が急落している。"
 gdp_popular_opinion_severe_neg_capacity: "交易商人の流出"
 gdp_popular_opinion_severe_neg_capacity_desc: "有力な商人たちが都市から完全に撤退し、交易市場の規模は大幅に縮小している。"
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "自信に満ちた売り手"
 gdp_popular_opinion_mild_pos_sell_price_desc: "都市の明るい雰囲気が売り手の自信を高め、市場全体の価格を緩やかに押し上げている。"
 gdp_popular_opinion_mild_pos_capacity: "成長する市場"
 gdp_popular_opinion_mild_pos_capacity_desc: "都市の楽観的な雰囲気が新たな商人を引き寄せ、市場の取引容量が緩やかに拡大している。"
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "交易の隆盛"
 gdp_popular_opinion_strong_pos_sell_price_desc: "都市に対する並外れた誇りにより、この都市の市場は高品質の代名詞となり、あらゆる商品が高値を付けている。"
 gdp_popular_opinion_strong_pos_capacity: "繁栄する市場"
 gdp_popular_opinion_strong_pos_capacity_desc: "都市の評判に引き寄せられて各地から商人が集まり、交易規模が大幅に拡大している。"
