l_japanese:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "渦巻く不満"
 republic_popular_opinion_event.1001.desc: "昨今は、街なかでパトリシアンと知られるのは賢明ではない。\n\n私の視線が泳ぎ、不安げな表情をしているのを見た[relation_01.GetName]は威勢よく言う。\n\n「どうしたのだ、[ROOT.Char.GetFullName]。[event_location_01.GetName]のパトリシアンともあろう者がコソコソしていてはならん。誇り高き市民として堂々と歩きたまえ！」\n\n[relation_01.GetSheHe|U]の言い分は正しい。しかし、近頃の市内の雰囲気は張りつめている。水面下では不満が渦巻いているのだ。抗議行動や乱闘が街に広がり、日の落ちた後に何が起きているのか、想像するだに恐ろしい。"
 republic_popular_opinion_event.1001.a: "「おっしゃる通り、胸を張っていかねばな」"
 republic_popular_opinion_event.1001.b: "「そろそろ護衛を雇ったほうが良いかもしれない」"
 republic_popular_opinion_event.1001.c: "「我々全員、暴徒に皆殺しにされるんだ！」"
 republic_popular_opinion_event.1001.d: "「私は簡単にはくたばらんぞ」"
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "不満の時世"
 republic_popular_opinion_event.1002.desc_1: "窓辺に立つと、怒号がこだましているのが聞こえてくる。[event_location_01.GetName]は不満に煮えくり返っている。労働者たちは仕事を放棄してやるとか、路上を行進してやるぞと脅しをかけてきている。暗闇に紛れ、政府の紋章が傷つけられたり、破壊されたりもしているのだ。\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "どこへ行っても、不満げな表情を見せられ、妨害に遭い、小声で罵倒される。"
 republic_popular_opinion_event.1002.desc_control_firm: "政府は容赦ない手際のよさで、非合法な集会のわずかな兆候ですら叩き潰している。そのため、群衆にできるのは形だけの抵抗運動だ。"
 republic_popular_opinion_event.1002.desc_control_strained: "[ROOT.Char.GetFaith.HighGodName]のご加護もあり、騒乱は市の衛兵によって抑え込まれている。連日のように首謀者らが逮捕され、晒し台送りになっている。混乱に乗じて暗躍を企む工作員も、追跡に遭って摘発されている。秩序は保たれている。今のところは。"
 republic_popular_opinion_event.1002.desc_control_slipping: "市の衛兵たちの奮闘にもかかわらず、煽動者らは取り締まりをかいくぐり、街には暴力が溢れかえっている。暴徒が集結しても、そのすべてをすぐに解散させられるわけではない。夜間ともなればもはや無法地帯だ。"
 republic_popular_opinion_event.1002.desc_control_broken: "政府は市内の統制を完全に失った。市の衛兵たちは兵舎に閉じこもり、暴徒たちは宮殿の階段に陣取って貴族たちを恐怖させているのだ！外国の工作員らが好き放題をしているという噂も飛び交っている。"
 republic_popular_opinion_event.1002.a: "私は政府側につく！"
 republic_popular_opinion_event.1002.b: "民衆の側につくとを明言しよう。"
 republic_popular_opinion_event.1002.c: "身を潜めておくのが一番だ。"
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "祝祭気分"
 republic_popular_opinion_event.1003.desc: "[event_location_01.GetTitle.GetNamePossessive]市場の喧噪のなか、私は[craftsman_character.GetName]と名乗る市民と話をしていた。[craftsman_character.GetHerHis]は自分の飼っているロバについて冗談を言い、私は腹を抱えて笑ってしまった。\n\n近頃は、都市がひとつの大きな家族のように感じられる。見知らぬ者どうしが気軽に言葉を交わし、決して楽とは言えない暮らしの中でも誰もが上機嫌だ。ロバは幸せそうにいななき、頭を私にすり寄せてきた。\n\n「議会もなかなかいい仕事をしているじゃありませんか」[craftsman_character.GetFirstNameNoTooltip]はロバの耳の後ろを掻いてやりながら言う。「祝賀会でも開いて、宴を催すってのはどうです？ギルドもいい顔をできるし、感謝の気持ちも示せるから、喜んで資金を出しますよ」"
 republic_popular_opinion_event.1003.a: "「それは良い考えだ！」"
 republic_popular_opinion_event.1003.b: "「金がかからないのか？」"
 republic_popular_opinion_event.1003.c: "「むしろ私はあなたに興味がある」"
 republic_popular_opinion_event.1003.tt: "次の[feast|E]の[activity|E]が#P 無料#!になる。"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "胸に秘めた野心"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName]と私は、自宅近くの広場で[ROOT.Char.Custom('RegionalDrink')]を嗜みながら、街を行き交い、仕事に励んで暮らしを営む市民たちをのんびりと眺めていた。[relation_01.GetName]は杯を傾け、満足げに息をつく。\n\n「なあ[ROOT.Char.GetFullName]、鉄は熱いうちに打てと言うだろう。つまり、今こそ野望を抱く時だ！都市がこれほど良い状態なのだから、何だって可能に思えてくる」[relation_01.GetSheHe|U]は杯を掲げ、そして微笑む。「新たな機会と、そして溢れんばかりの金に乾杯！」\n\n私もそれに笑顔で応じ、ゴブレットを掲げる。"
 republic_popular_opinion_event.1004.a: "「遠大なる冒険に乾杯！」"
 republic_popular_opinion_event.1004.b: "「新たな愛と情熱に乾杯！」"
 republic_popular_opinion_event.1004.c: "「名声と栄光に乾杯！」"
 republic_popular_opinion_event.1004.d: "「家族と友人に乾杯！」"
