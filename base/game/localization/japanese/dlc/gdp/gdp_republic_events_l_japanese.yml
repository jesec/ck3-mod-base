l_japanese:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "我らが共和国の礎が、ついに築かれた！卑小な暴君どもも彼らに雇われた手下どもも、もはや我々を犂と畝に縛り付けることはできない。彼らの争いがもはや我々に苦痛や悲しみをもたらすこともないのだ。\n\n今や一つの共同体として団結し、我々は自らの運命を切り開き、苦難の末に勝ち取った自由を守り抜くのだ。我らの都市を希望の灯台とし、その壁を専制政治に対する盾としよう。"
 republic_event.0001.a: "新時代の幕開けだ！"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "古より続く習わしは我らを大いに助けてくれたし、これからも崇敬を絶やすことはない。しかし、氏族の集会所は現在の我々にとっては窮屈なものとなってしまった。市場、城壁、そして民の意志は今、新たな形の統治を求めているのだ。\n\n今日、我々は[tribal|E]の統治を脱し、[republic|E]に移行する。都市にひとつの声を語らせよ。そしてその声は我らの声でなければならない。"
 republic_event.0002.a: "我らが都市はこの日を決して忘れない"
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "ここに通告する。貴殿が有する[actor.GetCapitalLocation.GetBaronyNameExplicitly]の交易所をただちに廃止する。効力は即時発効とする。\n\nもちろん、これは[actor.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip]にとって最善の利益に基づく措置である。ご理解いただけるものと確信している。"
 republic_event.0010.a: "だが、あれは#EMP 私の#!交易所だったんだぞ！"
 republic_event.0012.desc: "貴殿はもはや[trade_post_target_county.GetNameNoTierNoTooltip]では歓迎されていない！交易権は剥奪されたものと考えよ。貴殿が所有する価値ある物品はすべて没収とし、交易所は破却の後に更地とする。"
 republic_event.0012.a: "交易品の新たな受け入れ先を探さないと…"
 republic_event.0020.t: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]の国庫"
 republic_event.0020.intro: "共和国の予算を見直すべき時が来た。"
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U]が眉をひそめ、帳簿を手に私の前に立った。[steward.GetHerHim]の後ろには小規模な補佐官の集団が控えており、それぞれ巻物や書物、財政報告書を抱えている。\n\n「[ROOT.Char.GetTitleAsNameNoTooltip|U]よ、我々は支出を精査し、新たな予算案を策定#EMP しなければなりません#!。一刻の猶予も許されないのです。"
 republic_event.0020.solo_desc: "私の周りに、巻物や分厚い書物、財政報告書を抱えた事務員たちが小さな集団を成している。皆、私の審査が終わるのを待っている。\n\n"
 republic_event.0020.income_desc: "現在の収入は支出を大きく上回っており、これをより有効に活用できるはずだ。"
 republic_event.0020.deficit_desc: "支出が多すぎて、対策を講じなければ国庫は崩壊する。"
 republic_event.0020.fallback_desc: "前回の予算案が実施されてからすでに何年も経過している。"
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U]はすでに予算を確認しており、問題のない状態にある。[steward.GetSheHe|U]が変更を加える箇所はない。"
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "いくつかの文書が目の前に置かれており、異なる予算案が示されている——どこに支出し、どこで財布の紐を締めるべきかを。\n\nどれを選べばいいだろうか？"
 republic_event.0021.a: "全員が十分な報酬を得られるようにせよ。"
 republic_event.0021.b: "均衡の取れた給与こそが我々にとって最善の策となる。"
 republic_event.0021.c: "我が国への追加資金を優先すべきだ。"
 republic_event.0021.a.info_desc: "[treasury_budget_category|E]の方針：@gold_icon! [treasury_salary_budget_short|E]\n高い給与は、一般的に大半の[patricians|E]に好まれる。"
 republic_event.0021.b.info_desc: "[treasury_budget_category|E]の方針：@law_icon! バランス型\n[patricians|E]に相応の給与を確保しつつ、[liege|E]のために十分な[treasury|E]を残す、均衡の取れた予算"
 republic_event.0021.c.info_desc: "[treasury_budget_category|E]の方針：@treasury_icon! 国庫\n給与予算を抑えることで共和国により多くの資金を残し、[liege|E]が適切と判断する方法で追加資金を自由に使えるようにする"
 republic_event.0030.desc: "遺憾ながら、我が市場における貴殿の独占権をすべて剥奪したことを通告する。交易は自由に行われるべきである。"
 republic_event.0030.a: "我々も競争にさらされることになるな…"
 republic_event.0040.desc: "残念だが、あなたを[actor.GetConfederation.GetName]から除名することにした。"
 republic_event.0040.a: "再び競争相手に戻るというわけか"
 republic_event.0050.desc: "[title.GetName]の議会は、私を栄誉ある[new_holder.GetTitleAsNameNoTooltip]の職に、[new_holder.Custom('GetRepublicTermLength')]選出した。"
 republic_event.0051.desc: "私は、[new_holder.Custom('GetRepublicTermLength')]再選出された。[title.GetName]に栄光あれ。"
 republic_term_length_1_desc: "[EmptyScope.ScriptValue('law_term_length_1_value')|0]年の任期で"
 republic_term_length_2_desc: "[EmptyScope.ScriptValue('law_term_length_2_value')|0]年の任期で"
 republic_term_length_3_desc: "[EmptyScope.ScriptValue('law_term_length_3_value')|0]年の任期で"
 republic_term_length_4_desc: "[EmptyScope.ScriptValue('law_term_length_4_value')|0]年の任期で"
 republic_term_length_5_desc: "[EmptyScope.ScriptValue('law_term_length_5_value')|0]年の任期で"
 republic_term_length_indefinite_desc: "終身の任期で"
 republic_event.0052.desc: "私は議会の高貴なる議員の面々に対して新たな法案を提出した。\n\n「[new_law.GetNameNoTooltip]」の草案は、綿密なる審議の後に採決に付されることとなる。"
 republic_event.0053.pass.desc: "「[new_law.GetNameNoTooltip]」の法案は可決され、共和国法として制定された！"
 republic_event.0053.rejected.desc: "「[new_law.GetNameNoTooltip]」の法案は議会で否決された。"
 republic_event.law.TT: "#bold 提出済み：#![new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P 可決：#!#![new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N 否決：#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold 現行法を維持：#![current_law.GetName]"
 republic_event.assembly.response: "わかった。"
 republic_event.assembly.opening: "市民諸君、"
 rescind_trade_monopoly_notification_base_desc: "以下に属する[actor.GetShortUINamePossessive]の[trade_markets|E]において、すべての[trade_monopolies|E]が破棄された："
 rescind_trade_monopoly_notification_confederation_desc: "[recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "あなたの[company|E]"
 republic_event.0100.t: "ローマ共和国"
 republic_event.0100.desc: "ローマ——単に都市の名としてではなく、象徴として、#EMP 理想#!としてその名を語ることは、長きにわたって多くの者が夢見てきたことである。私はその夢を現実のものとしたのだ。\n\n国のいたるところから祝福の声がこだまするのが聞こえる。市民、いや、#EMP ローマの民#!は、我らこそが文明の中心となる時代を再び迎えるのだ。失われた古代の理想を復活させる事業が今始まる。希望のしるべ、この暗き時代を導く灯火となるために。"
 republic_event.0100.a: "すべての道は、いま再びローマに通ず。"
 republic_event.0100.b: "ローマとは単なる都市の名ではない。理想である。"
