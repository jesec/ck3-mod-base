 gdp_improve_trade_competitiveness_desc: "私は競合相手よりも私の交易路が優先される方法を考えるよう、配下の者たちに指示した。"
 gdp_improve_trade_competitiveness_desc_general: "「$gdp_improve_trade_competitiveness$」は、[merchant|E]または[patrician|E]が配下の者を動員し、所有する[trade_routes|E]のうち1つの[trade_competitiveness|E]を高める[trade_scheme|E]である。"
