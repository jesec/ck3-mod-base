 gdp_improve_trade_expertise_desc: "私は交易路の運営効率を高める方法を考え、しかるべき関係者とのつながりを築き、失敗から学べるよう、配下の者たちに指示した。"
 gdp_improve_trade_expertise_desc_general: "「$gdp_improve_trade_expertise$」は、[merchant|E]または[patrician|E]が配下の者を動員し、所有する[trade_routes|E]のうち1つで[trade_expertise|E]の獲得速度を高める[trade_scheme|E]である。"
