 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_balance: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_overseer' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_success: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_speed: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_overseer' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_messenger' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_secrecy: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_alibi' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]"
 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$：成功"
 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U]は、以前のように十分な量の商品を運べなくなるだろう。[target.GetShortUIName]は、なぜ帳簿の数字が合わなくなったのか、せいぜい悩むがいい。"
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U]は、もはや市場で以前のような優先的な扱いや特権を受けられない。[target.GetShortUIName]には、商売で利益を上げることがどれほど難しくなったか、思い知ってもらおう。"
 gdp_trade_scheme.0012.desc_discovered: "\n\n工作員の一人が見つかってしまった。これで私の関与が露見するかもしれない。"
 gdp_trade_scheme.0012.a: "愚か者に幸運を祈ろう。"
 gdp_trade_scheme.0012.a_discovered: "それでもやる価値はある。"
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$：失敗"
 gdp_trade_scheme.0013.desc: "あらゆる手を尽くしたにもかかわらず、[target.GetShortUIName]と[target.GetHerHis]の交易路は相変わらず順調だ。"
 gdp_trade_scheme.0013.desc_discovered: "\n\nしかも、私の交易担当者の一人が妨害工作をしようとしているところを目撃された。一族の名に泥を塗られたのだ。"
 gdp_trade_scheme.0013.a: "腹立たしい。"
 gdp_destroyed_republic_opinion: "私の共和国を滅ぼした"
 gdp_smuggler_opinion: "密輸業者"
