 gdp_improve_trade_expertise_decision_success_tt: "[scheme|E]が成功すると、[selected_item.GetName|l]は[GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip]を#V 15年間#!獲得する"
