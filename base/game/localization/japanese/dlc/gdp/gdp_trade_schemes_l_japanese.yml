 gdp_improve_trade_routes_expertise_modifier: "熟練の交易担当者"
 gdp_improve_trade_capacity_decision: "交易工作：容量"
 gdp_improve_trade_capacity_decision_desc: "交易担当者たちが積みきれずに置いていく商品があるのは分かっている。投資や調整を重ねれば、訪れるすべての市場で我々の存在感を高められるはずだ。"
 gdp_improve_trade_capacity_decision_tooltip: "任意の[trade_route|E]を対象に[scheme|E]「[GetScheme('gdp_improve_trade_capacity').GetTypeName]」を開始する"
 gdp_improve_trade_capacity_decision_confirm: "積み込む余地と人手を確保せよ。"
 gdp_improve_trade_capacity_decision_effect_tt: "[selected_item.GetName|l]を対象に[scheme|E]「[GetScheme('gdp_improve_trade_capacity').GetTypeName]」を開始する"
 gdp_improve_trade_competitiveness_decision: "交易工作：競争力"
 gdp_improve_trade_competitiveness_decision_desc: "交易担当者たちが定期的に訪れる市場の中には、競争の激しい場所もある。しかるべき相手に金を渡し、現地の人々と小さな取引をまとめれば、我々の交易担当者を競合相手より優先してもらえるだろう。"
 gdp_improve_trade_competitiveness_decision_tooltip: "任意の[trade_route|E]を対象に[scheme|E]「[GetScheme('gdp_improve_trade_competitiveness').GetTypeName]」を開始する"
 gdp_improve_trade_competitiveness_decision_confirm: "我々が優先されるよう取り計らえ。"
 gdp_improve_trade_competitiveness_decision_effect_tt: "[selected_item.GetName|l]を対象に[scheme|E]「[GetScheme('gdp_improve_trade_competitiveness').GetTypeName]」を開始する"
 gdp_improve_trade_expertise_decision: "交易工作：専門知識"
 gdp_improve_trade_expertise_decision_desc: "交易担当者によると、特定の交易路で同じ失敗が何度も繰り返されているという。これまでの経験を活かし、各交易路を可能な限り効率よく運営できるようにすべきだ。"
 gdp_improve_trade_expertise_decision_tooltip: "任意の[trade_route|E]を対象に[scheme|E]「[GetScheme('gdp_improve_trade_expertise').GetTypeName]」を開始する"
 gdp_improve_trade_expertise_decision_confirm: "交易担当者を一つの交易路に専念させろ。"
 gdp_improve_trade_expertise_decision_effect_tt: "[selected_item.GetName|l]を対象に[scheme|E]「[GetScheme('gdp_improve_trade_expertise').GetTypeName]」を開始する"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$：成功"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U]は、ようやく本来あるべき姿で運営されている。交易担当者から、期待どおり以前より多くの商品を運べるようになったと報告を受けた。"
 gdp_trade_scheme.0002.a: "投じた金に見合う成果だ。"
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]：失敗"
 gdp_trade_scheme.0003.desc: "最善を尽くしたにもかかわらず、交易路の運営状況は以前とまったく変わっていない。腹立たしいが、市場とはそういうものなのだろう。"
 gdp_trade_scheme.0003.a: "帳簿の見直しに戻ろう。"
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$：成功"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U]は、ようやく期待どおりの利益を上げている。交易担当者たちは競合相手より優先的に扱われるようになり、以前より多くの利益を得ている。"
 gdp_trade_scheme.0004.a: "根回しに金を使った甲斐があった。"
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$：成功"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U]は以前より効率よく運営され、失敗も減っている。ここで得た教訓は、我が一族の将来の繁栄を築く礎となるだろう。"
 gdp_trade_scheme.0005.a: "我が一族の繁栄を、さらに築き上げていこう。"
 gdp_disrupt_trade_routes: "交易路の妨害"
 gdp_disrupt_trade_routes_action: "交易路の妨害"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName]は私の市場で商売をしている。事務員に賄賂を渡し、効果的な噂を流せば、[SCHEME.GetTargetCharacter.GetHerHis]の[trade_routes|E]の一つを台無しにできるはずだ。"
 gdp_disrupt_trade_routes_desc_general: "「$gdp_disrupt_trade_routes$」は、[merchant|E]または[patrician|E]が競合相手の[trade_route|E]網を妨害する[hostile_scheme|E]である。[intrigue|E]に基づく工作であり、[agents|E]を雇用できる。"
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive]の[trade_routes|E]の一つが#N 20年間#!機能不全に陥る"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "あなたが競合相手の[trade_routes|E]を妨害したことは露見しない"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "[target.GetShortUIName]と同じ[trade_market|E]で交易を行っている：$VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! $gdp_disrupt_trade_routes$工作が終了"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName]はもう自分の[trade_routes|E]を運営していない"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUIName]はもう自分の[trade_routes|E]を運営していない"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUIName]には妨害可能な[trade_route|E]がもう残っていない"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName]が1つ以上の[trade_route|E]を所有している"
 gdp_disrupt_trade_routes_capacity_modifier: "妨害を受けた物流"
 gdp_disrupt_trade_routes_competitiveness_modifier: "評判の悪化"
 gdp_disrupt_trade_routes_discovered_opinion: "私の交易路を妨害した"
 gdp_disrupt_trade_routes_target_notification: "[disrupted_trade_route.GetName|l]で問題発生"
 gdp_disrupt_trade_routes_target_notification_tt: "私の[trade_routes|E]の1つで何か問題が起きている。交易担当者たちにも原因はわからないという。"
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "私の[trade_routes|E]の1つが不調に陥っている。交易担当者は原因が[owner.GetShortUIName]にあることを突き止めた。"
 gdp_disrupt_trade_routes_target_caught_notification: "妨害工作が発覚した"
 gdp_disrupt_trade_routes_target_caught_tt: "[owner.GetShortUINamePossessive]の部下が私の[trade_routes|E]で捕らえられ、妨害工作のために送り込まれたと白状した。"
 start_gdp_disrupt_trade_routes_interaction: "$gdp_disrupt_trade_routes$#weak （工作）#!"
