l_japanese:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]：[patron.GetTitleAsNameNoTooltip]の[patron.Custom('GetRoomPlural')|U] "
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName]は偉大な[patron.GetWomanMan]である。[patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]のみならず各地から、貴族、聖職者、商人、そして庶民までもが、こぞって[patron.GetHerHis]の関心と援助を求めて集まってくる。\n\n商会が[patron.GetHerHis]の援助を受け続けるには、躊躇なく、だが慎重に立ち回る必要がある。狡猾な競争相手に出し抜かれることも、[patron.GetHerHis]の関心を完全に失うことも避けねばならないのだ。\n\n我々の事業は常に[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の名士たちの話題に上っていなければならない。"
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$：成功！"
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName]は、私が語る遠い異国や、複雑に交錯する商業の世界の話にすっかり魅了され、晩餐の席では毎夜のように私の言葉へ聞き入っていた。\n\nこれで安心して商会に戻れる。[patron.GetFirstNameNoTooltip]は我々を価値ある協力者、そして歓迎すべき友人と見なしている。\n\n我々の[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]での評判は大いに高まった。私の影響力の噂もまた、さらに遠方へ広まっていくことだろう。"
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$：失敗！"
 gdp_merchant_patron_contract.0003.desc: "私は次第に[patron.GetTitledFirstName]に呼ばれなくなっていった。何かしてしまったのだろうか？[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の廷臣たちの態度が以前ほど丁重でなくなったことで、私は[patron.GetHerHis]の不興を買ったのだと悟った。\n\n私の逸話が[patron.GetHerHim]を退屈させてしまったのだろうか？あるいは、商売の予測不可能性について語りすぎたか？それとも#EMP 貴族社会#!の超えてはならぬ一線を越えてしまったのだろうか。\n\nもはや商会へ戻り、被害を最小限に抑えて、立て直すしかない…"
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "感銘を受けた後援者"
 gdp_impressed_patron_modifier_desc: "この交易商人は後援者に取り入り、好印象を与えた。"
 gdp_impressed_patron_critical_modifier: "感銘を受けた後援者"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "冷淡な後援者"
 gdp_dismissive_patron_modifier_desc: "この交易商人は後援者に取り入ったが、白けさせてしまった。"
