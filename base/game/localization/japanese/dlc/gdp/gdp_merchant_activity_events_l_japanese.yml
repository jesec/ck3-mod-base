l_japanese:
 gdp_merchant_activity_events.0001.t: "満たされぬ食欲"
 gdp_merchant_activity_events.0001.desc: "宴が進むにつれ、空腹とともに苛立ちを募らせる客たちの不満の声が聞こえてきた。大皿には料理がほとんど残っておらず、給仕たちが新しい料理を持ってくる気配もない。\n\n[guest.GetTitledFirstName]が[guest.Custom('quirk_neg_present')]。そして空の杯を傍らに置いて言った。「この退屈な宴で酒を一杯もらうには、一体何をすればいいんだ？」"
 gdp_merchant_activity_events.0001.host: "\n\nこれは宴を盛り上げるのに一役買う好機かもしれない。"
 gdp_merchant_activity_events.0001.guest: "\n\nこれは主催者である[host.GetTitledFirstNamePossessive]の宴を盛り上げるのに一役買う好機かもしれない。"
 gdp_merchant_activity_events.0001.a: "「さあ、[host.GetTitledFirstNamePossessiveNoTooltip]の厨房を存分に働かせろ。費用は惜しむな！」"
 gdp_merchant_activity_events.0001.a.host: "「いいだろう。厨房を#EMP 全力で#!稼働させよう！」"
 gdp_merchant_activity_events.0001.b: "これは良い交渉材料になりそうだ。"
 gdp_merchant_activity_events.0001.c: "「少しは感謝すべきだ、[guest.GetTitledFirstNameNoTooltip]！」"
 gdp_merchant_activity_events.0001.d: "「気に入らないなら出ていけ！」"
 gdp_merchant_activity_events.0001.e: "「商会の倉庫から持ち出せ」"
 gdp_merchant_activity_events.0005.t: "奇妙な頼みごと"
 gdp_merchant_activity_events.0005.desc: "私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))]である[admirer.GetTitledFirstName]が、[admirer.GetHerHis]の客人である[guest.GetTitledFirstName]との会話に加わるよう手招きしてきた。\n\n[admirer.GetFirstNameNoTooltip]は目に"
 gdp_merchant_activity_events.0005.desc_esteemed: "温かな"
 gdp_merchant_activity_events.0005.desc_fallback: "陽気な"
 gdp_merchant_activity_events.0005.desc_outro: "色を浮かべてこう言った。「今ちょうど[admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))]と、君の異国での[luxury_artifact.Custom('GetLuxuryArtifactSentiment')]発見について話していたところだ。さあ、どうやって[luxury_artifact.GetName]を手に入れたのか話してくれ！」\n\nこの[admirer.Custom('NoblewomanNobleman')]は明らかに、私が面白い話でこの場を盛り上げ、二人を楽しませることを期待している。"
 gdp_merchant_activity_events.0005.a: "「大したことではありません…」"
 gdp_merchant_activity_events.0005.b: "「命懸けで手に入れたんですよ！」"
 gdp_merchant_activity_events.0005.b.success: "あなたの誇張がもっともらしく聞こえる"
 gdp_merchant_activity_events.0005.b.failure: "あなたの嘘が見抜かれる"
 gdp_merchant_activity_events.0005.c: "「よく聞いておいてくださいね！」"
 gdp_merchant_activity_events.0005.d: "「私が[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]で扱っている宝物に比べれば、大したものではありませんよ」"
 gdp_merchant_activity_events.0010.t: "贈り物の駆け引き"
 gdp_merchant_activity_events.0010.desc: "私と同じ交易商人である[merchant.GetTitledFirstName]は、到着するとすぐに自分の富を誇示しはじめた。高価な宝飾品を弄び、上質な[merchant.Custom('RegionalFabric')]の衣をひけらかし、[merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip]で売りさばいている[good.Custom('GetTradeGood')]の[good.Custom('GetTradeGoodUnitPlural')]を臆面もなく売り込んでいる。\n\n私は、[merchant.GetHerHim]が大勢の見物人の見ている前で、私の[ROOT.Char.Custom2('RelationToMeShort', receiver)]である[receiver.GetTitledFirstName]に贈り物を渡しているところを目にした。"
 gdp_merchant_activity_events.0010.a: "ならばこちらも同じ手でいくか…"
 gdp_merchant_activity_events.0010.b: "「[merchant.GetTitledFirstNameNoTooltip]よ、なんと心のこもった贈り物だろう！」"
 gdp_merchant_activity_events.0010.b.success: "[merchant.GetFirstNameNoTooltip]の鼻を明かす"
 gdp_merchant_activity_events.0010.b.failure: "間抜けな姿をさらす"
 gdp_merchant_activity_events.0010.c: "好きにすればいい。"
 gdp_merchant_activity_events.0010.d: "「格上相手に自慢するのは無作法だ」"
 gdp_merchant_activity_events.0015.t: "農民の暮らし"
 gdp_merchant_activity_events.0015.desc: "上質な酒に豊富な料理、そして暖炉の心地よい温もりに満ちた宴は、外の冷たい夜の空気とはあまりにも対照的だ。\n\n私は少し空気を吸おうと宴席を離れたところで、貧しい人々の集まりを見かけた。宴が終わった後のおこぼれにあずかろうと、壁際で待っているのだ。"
 gdp_merchant_activity_events.0015.a: "彼らも食べて飲んで楽しめばいい。費用は私が持つ！"
 gdp_merchant_activity_events.0015.b: "[ROOT.Char.Custom('RegionalDrink')]は貴族たちと分かち合う方がいい。"
 gdp_merchant_activity_events.0015.b.alcohol: "[ROOT.Char.Custom('RegionalAlcoholicDrink')]は貴族たちと分かち合う方がいい。"
 gdp_merchant_activity_events.0015.c: "こちらこそが私の#EMP 真の#!居場所だ。"
 gdp_merchant_activity_events.0015.d: "失せろ、虫けらめ！"
 custom.every_attending_noble: "出席しているすべての[noble|E]の[character|E]"
 gdp_merchant_activity_events.0020.t: "審美眼"
 gdp_merchant_activity_events.0020.desc: "私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))]である[other.GetTitledFirstName]が、この日のために見事な[fake_artifact.GetNameNoTooltip]を身につけてきたらしい。\n\n私は大広間で[other.GetHerHis]を見つけた。衣装と胸元を飾る首飾りも相まって、実に華やかな姿だ。私が近づくと、[host.GetSheHe|U]が[host.Custom('quirk_pos_present')]。そしてこう言った。「私が最近手に入れた品はもう見ましたか？なかなかの逸品だと思いませんか？」\n\n大広間を照らす無数の蝋燭の温かな光が、その宝石を美しく輝かせている。だが目利きの私は、数多くの欠点があることに気付かざるを得なかった。"
 gdp_merchant_activity_events.0020.a: "「傑作だな！こんなガラクタに価値があると思っているとは」"
 gdp_merchant_activity_events.0020.b: "#weak *小声で*#!「その出来の悪い安物は、私が処分しておきます」"
 gdp_merchant_activity_events.0020.b.tt: "[attraction|E]の[opinion|E]と[artifact|E]を獲得する"
 gdp_merchant_activity_events.0020.b.equipped_tt: "[other.GetTitledFirstName]から[fake_artifact.GetName]を手に入れた"
 gdp_merchant_activity_events.0020.c: "「実に貴重な品ですね」"
 fake_artifact_name: "宝石の首飾り"
 fake_artifact_desc: "一見すると美しく輝く首飾りだが、よく見ると宝石の研磨が粗いことがわかる。"
 gdp_merchant_activity_events.0025.t: "旅慣れた道"
 gdp_merchant_activity_events.0025.desc: "笑い声と話し声が満ちる広間で、不意に聞き慣れない音が耳に飛び込んできた。"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP ウーウー！#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP キーキー！#!"
 gdp_merchant_activity_events.0025.desc_cont: "誰かが[luxury_artifact.Custom('GetDomicileArtifactCreatureType')]でも宴に連れてきたのだろうか？\n\n辺りを見回すと、飼い主らしき交易商仲間の[merchant.GetTitledFirstName]がいた。[merchant.GetSheHe|U]は私の興味深げな視線に気付くと、[merchant.Custom('quirk_pos_present')]。そしてこう言った。「色々と旅をして手に入れた上物ですよ。とても良い市場があって、よく立ち寄るんです。これは企業秘密ですがね」そう言うと、[merchant.GetSheHe|U]は満足げな笑みを浮かべて、自分の鼻先に軽く触れた。"
 gdp_merchant_activity_events.0025.a: "「ああ、その市場には心当たりがありますよ！」"
 gdp_merchant_activity_events.0025.b: "「その市場の場所、なんとか教えていただけませんか？」"
 gdp_merchant_activity_events.0025.b.success: "説得に成功する"
 gdp_merchant_activity_events.0025.b.failure: "説得に失敗する"
 gdp_merchant_activity_events.0025.c: "「旅の話をもっと聞かせてください！」"
 gdp_merchant_activity_events.0025.tt.menagerie: "[luxury_contract_i] [luxury_contract|E]「#V $menagerie_acquisition_contract$#!」を作成する"
 gdp_merchant_activity_events.0025.tt.curio: "[luxury_contract_i] [luxury_contract|E]「#V $find_curio_contract$#!」を作成する"
