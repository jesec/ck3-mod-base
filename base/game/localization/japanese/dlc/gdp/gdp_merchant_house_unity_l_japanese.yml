l_japanese:
 merchant_house_unity: "商会方針"
 rapacious_cs: "拝金主義"
 rapacious_cs_desc: "#weak 血縁に伴う責務は、くすぶり続ける怨恨と野心の中でとうに忘れ去られた。商会の都合は成員の都合よりも優先され、何よりも利益が重んじられる。#!"
 opportunistic_cs: "打算"
 opportunistic_cs_desc: "#weak 手に負えない親族たちは血の序列に反発し、義務よりも個々の利害を優先している。#!"
 balanced_cs: "中庸"
 balanced_cs_desc: "#weak 一族には旗印となる人物が必要だ。だが、その成員は干渉や批判を受けることなく、自らの事柄を自由に取り仕切ることができなければならない。#!"
 grasping_cs: "栄達志向"
 grasping_cs_desc: "#weak 商会の評判と、その構成員一人ひとりの評判は同じものだ。商会にとって価値ある一員となるには、評判だけでなく社会的地位も高めるよう努めなければならない。#!"
 ennobled_cs: "貴族化"
 ennobled_cs_desc: "#weak 義務と敬意から生まれた揺るぎない忠誠により、一族全体の利益は家長の利益と一体となっている。家族の絆によって固く結ばれた一団として、この商会は高貴な名家にも肩を並べうる。#!"
 house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts: "[traders|E]として働く[house|E]の成員が、[trade_opportunities|E]を提示する可能性が高くなる"
 house_unity_parameter_unity_risk_of_leaving: "他の[rulers|E]が自分の[court|E]に[associates|E]を招いたときの受諾率：#N +20#!"
 house_unity_parameter_unity_very_high_risk_of_leaving: "他の[rulers|E]が自分の[court|E]に[associates|E]を招いたときの受諾率：#N +50#!"
 house_unity_parameter_unity_deputy_positions_cost_less: "[deputy|E]の役職の給与が減少する：#P -50%#!"
 house_unity_parameter_unity_deputy_positions_cost_significantly_less: "[deputy|E]の役職の給与が#EMP 大幅に#!減少する：#P -85%#!"
 unity_merchant_can_petition_for_noble_standing_tt: "[company_sentiment|E]が#V #emp $ennobled_cs$#!#!でなければならない"
 house_unity_parameter_unity_merchant_can_petition_for_noble_standing: "#V $merchant_purchase_land_interaction$#!の選択肢「#V $merchant_purchase_land_interaction_noble_standing$#!」および[interaction|E]「#V $merchant_procure_estate_interaction$#!」を使用できる"
 unity_merchant_can_request_complete_exploitative_monopolies_tt: "[complete_monopoly|E]または[exploitative_monopoly|E]を要請するには、[company_sentiment|E]が#V #emp $rapacious_cs$#!#!でなければならない"
 house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies: "[interaction|E]「#V $request_trade_monopoly_for_character_interaction$#!」で[complete_monopolies|E]または[exploitative_monopolies|E]を要請できる"
 merchant_steady_hand_low_unity_modifier: "$merchant_house_unity$：堅実な采配"
 merchant_steady_hand_low_unity_modifier_desc: "この人物は、統制の取れていない一族を抱えながらも、商会を動かし続けている。"
 merchant_house_of_knives_fractious_modifier: "$merchant_house_unity$：刃の一族"
 merchant_house_of_knives_fractious_modifier_desc: "この人物の一族は対立が激しく、暗黙の脅しさえ無視できない。"
 merchant_house_of_knives_divided_modifier: "$merchant_house_unity$：刃の一族"
 merchant_house_of_knives_divided_modifier_desc: "この人物の一族の分裂は激しく、恐怖だけが商会を結びつける共通の言語となっている。"
 merchant_family_mobilization_promote_diligence_modifier: "$merchant_house_unity$：勤勉さの奨励"
 merchant_family_mobilization_promote_diligence_modifier_desc: "この人物は、意欲旺盛な一族を、より無駄のない交易と、より熾烈な競争へと導いている。"
 unity_regional_networks_decision: "地域ごとの利益追求を認める"
 unity_regional_networks_decision_desc: "我が一族の成員たちは、己の商売上の利益を守ろうと激しく争う。だが、身内同士の競争を認めることこそが、商会全体の利益につながるだろう。"
 unity_regional_networks_decision_tooltip: "[house|E]の成員が、それぞれの地域交易で独自に利益を追求することを認める"
 unity_regional_networks_decision_confirm: "交易の自由を促す"
 unity_family_business_decision: "家業を組織化する"
 unity_family_business_decision_desc: "[ROOT.Char.GetHouse.GetName]家の屋敷は我々の交易網の中枢であり、その効率的な管理こそが成功の鍵である。"
 unity_family_business_decision_tooltip: "[house|E]の成員を組織化し、[company|E]と交易網の管理に当たらせる"
 unity_family_business_decision_confirm: "一族の責務を定める"
 unity_merchant_prosperity_decision: "繁栄を促す"
 unity_merchant_prosperity_decision_desc: "繁栄を手にするには、[ROOT.Char.GetDomicile.GetLocation.GetName]一帯を発展させ、我らの野心を支えられるだけの力を持たせねばならない。"
 unity_merchant_prosperity_decision_tooltip: "[company|E]所在地の[prosperity|E]が上昇するよう支援する"
 unity_merchant_prosperity_decision_confirm: "地域の繁栄を促す"
 unity_merchant_prosperity_decision_cooldown_tooltip: "[THIS.Char.GetHouse.GetName][house|E]は過去#V 10#!年以内に繁栄を促しているため、再び実行できるのは[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_prosperity_decision_cooldown') )|V]以降である"
 unity_required_level_not_met_tooltip: "あなたの[THIS.Char.Custom('GetHouseUnityLevelConcept')]では実行できません"
 unity_merchant_bailiffs_decision: "現地当局を支援する"
 unity_merchant_bailiffs_decision_desc: "[ROOT.Char.GetDomicile.GetLocation.GetName]の統治者たちは、この一帯を十分に掌握できていない。犯罪者に我らの前途を損なわれぬよう、我々が介入せねばならない。"
 unity_merchant_bailiffs_decision_tooltip: "[company|E]所在地の[county_control|E]が上昇するよう支援する"
 unity_merchant_bailiffs_decision_confirm: "地域の統制を強化する"
 unity_merchant_bailiffs_decision_cooldown_tooltip: "[THIS.Char.GetHouse.GetName][house|E]は過去#V 10#!年以内に統制を強化しているため、再び実行できるのは[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_bailiffs_decision_cooldown') )|V]以降である"
 unity_merchant_bailiffs_decision_control_tooltip: "[THIS.Char.GetDomicile.GetLocation.GetCounty.GetTitle.GetName]では、[county_control|E]が[control_baseline|E]を下回る"
 merchant_unity_associate_busywork_desc: "[unity_target.GetNamePossessive]の不手際の尻拭いを他の者たちにさせた"
 merchant_unity_associate_rewarded_desc: "[unity_target.GetName]の優れた働きに報いた"
 merchant_unity_associate_after_company_desc: "[unity_target.GetName]よりも商会を優先した"
 merchant_unity_associate_before_company_desc: "[unity_target.GetName]を商会より優先した"
 merchant_unity_associate_unappreciated_desc: "[unity_target.GetName]の優れた働きを正当に評価しなかった"
 merchant_unity_associate_example_desc: "[unity_target.GetName]を商会の模範として取り上げた"
 merchant_unity_strong_leadership_desc: "商会運営において強い指導力を示した"
 merchant_unity_poor_leadership_desc: "商会運営における指導力に疑問を抱かせた"
 merchant_unity_company_in_debt_desc: "商会が長期間にわたって借金を抱えたままになるのを放置した"
 unity_merchant_promote_diligence_decision: "勤勉を奨励する"
 unity_merchant_promote_diligence_decision_desc: "商会の市場での地位を維持するため、競合相手を越えるまでは、商会の成員全員が快適さよりも利益を優先しなければならない。"
 unity_merchant_promote_diligence_decision_tooltip: "[prestige|E]を消費して[company_sentiment|E]を[company_sentiment_divided_i] [company_sentiment_divided|E]の方向へ傾け、[company_possessive|E]の[competitiveness|E]を高め、あなたの[house|E]の成員の技能向上を支援する"
 unity_merchant_promote_diligence_decision_not_excess_requirement: "「[GetDecisionWithKey('unity_merchant_promote_excess_decision').GetName]」が現在有効ではない"
 unity_merchant_promote_diligence_decision_confirm: "時は金なり！"
 unity_merchant_promote_diligence_decision_cooldown_tooltip: "すでにあなたの[house|E]で勤勉さを奨励している。#V [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_promote_diligence_decision_cooldown') )|V]以降、再び実行できる#!"
 unity_merchant_promote_diligence_unity_change_tt: "[company_direction|E]の[company_sentiment_divided_i] [company_sentiment_divided|E]への進捗：[EmptyScope.ScriptValue('monumental_unity_value')|V0]"
 unity_merchant_promote_excess_decision: "贅沢を奨励する"
 unity_merchant_promote_excess_decision_desc: "今の身分を超えて成り上がるには、貴族のように食べ、飲み、話さなければならない。そうすれば、いつか周囲から見られているとおりの存在になれるだろう。"
 unity_merchant_promote_excess_decision_tooltip: "[gold|E]を消費して[company_sentiment|E]を[company_sentiment_concerted_i] [company_sentiment_concerted|E]の方向へ傾け、あなたの[house|E]の成員が得る[prestige|E]を増やす"
 unity_merchant_promote_excess_decision_not_diligence_requirement: "「[GetDecisionWithKey('unity_merchant_promote_diligence_decision').GetName]」が現在有効ではない"
 unity_merchant_promote_excess_decision_confirm: "今日は贅沢に楽しもう！"
 unity_merchant_promote_excess_decision_cooldown_tooltip: "すでにあなたの[house|E]で贅沢を奨励している。#V [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_promote_excess_decision_cooldown') )|V]以降、再び実行できる#!"
 unity_merchant_promote_excess_unity_change_tt: "[company_direction|E]の[company_sentiment_concerted_i] [company_sentiment_concerted|E]への進捗：[EmptyScope.ScriptValue('monumental_unity_value')|V0]"
 merchant_unity_promote_diligence.desc: "[house_head|E]としての立場を利用し、健康や幸福を犠牲にして勤勉に働くよう[house|E]の成員に奨励した"
 merchant_unity_promote_excess.desc: "[house_head|E]としての立場を利用し、[house|E]の成員に贅沢を奨励し、商会の評判を高めた"
 unity_required_house_member_nr: "あなた自身に加えて、成人した[house]の成員が1人以上必要"
 COMPANY_DIRECTION_CONCEPT_LABEL: "[company_direction|E]"
 COMPANY_DIRECTION_HEADER_PROGRESS_ENNOBLED: "#weak [company_sentiment_concerted_i] [company_sentiment_concerted|E]への進捗：[DynastyHouse.MakeScope.ScriptValue('merchant_company_direction_header_progress_ennobled_value')|V0] #!"
 COMPANY_DIRECTION_HEADER_PROGRESS_RAPACIOUS: "#weak [company_sentiment_divided_i] [company_sentiment_divided|E]への進捗：[DynastyHouse.MakeScope.ScriptValue('merchant_company_direction_header_progress_rapacious_value')|V0]#!"
 COMPANY_DIRECTION_HEADER_NO_CURRENT_DIRECTION: "#weak 現在の風土なし#!"
 gdp_send_trade_envoys_decision: "交易使節を派遣する"
 gdp_send_trade_envoys_decision_desc: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の交易担当者たちは、我々の利益が最大限に守られるよう、自ら隊商や市場を監督しなければならない。"
 gdp_send_trade_envoys_decision_tooltip: "あなたの[traders|E]が各自の[trade_routes|E]を旅し、[schemes|E]を実行する"
 gdp_send_trade_envoys_decision_confirm: "皆の者、出発だ！"
 gdp_send_trade_envoys_decision_effect_tt: "[schemes|E]に成功すると、以下の交易上の利益を得られる可能性がある：\n$EFFECT_LIST_BULLET$[competitiveness_i] [trade_competitiveness|E]または[competitive_pressure|E]\n$EFFECT_LIST_BULLET$[trade_route_capacity_i] [trade_route_capacity|E]\n$EFFECT_LIST_BULLET$[buy_price_i|E] [buy_price|E]\n$EFFECT_LIST_BULLET$[gold_i] [gold|E]\n$EFFECT_LIST_BULLET$[prestige_i] [prestige|E]\n$EFFECT_LIST_BULLET$[associate_i] [associates|E]\n$EFFECT_LIST_BULLET$[trade_expertise|E]"
 gdp_send_trade_envoys_decision_recalled_requirement: "[traders|E]が現在、旅をしていない"
 gdp_send_trade_envoys_decision_cooldown_tooltip: "最近、あなたは[traders|E]を呼び戻した。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'gdp_send_trade_envoys_cooldown') )|V]以降、再び実行できる"
 gdp_return_trade_envoys_decision: "交易使節を呼び戻す"
 gdp_return_trade_envoys_decision_desc: "資源が分散していては、その力も弱まる。商会は本拠地に目を向けなければならない。一丸となれば、我々が何より大切にする利益を守ることができる。"
 gdp_return_trade_envoys_decision_tooltip: "[traders|E]は各自の[trade_routes|E]での商売を終え、本拠地へ戻る"
 gdp_return_trade_envoys_decision_confirm: "皆の者、集合だ！"
 gdp_return_trade_envoys_decision_effect_tt: "[traders|E]は各自の[trade_routes|E]で[schemes|E]を実行するのをやめ、本拠地へ戻る"
 gdp_return_trade_envoys_decision_out_requirement: "[traders|E]は現在、旅をしている"
