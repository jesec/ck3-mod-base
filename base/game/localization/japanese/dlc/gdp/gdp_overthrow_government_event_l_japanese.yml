l_japanese:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "政府転覆"
 overthrow_government_outcome.1001.desc: "陰謀はいよいよ最終段階に入った。やるなら今しかない。都市警備隊の兵舎、議会、宮殿にはすでに主要な工作員を配置してある。私が命じれば、彼らは権力の要所を掌握し、旧体制を一掃するだろう。\n\n明日、議会は私が政権を取ることを認め、反対する者たちを国家の敵として糾弾するほかなくなるのだ。"
 overthrow_government_outcome.1001.a: "血は流さない。追放もしない。"
 overthrow_government_outcome.1001.b: "私個人の敵だけだ。"
 overthrow_government_outcome.1001.c: "我々に反対する者は全員排除する。"
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "共和国の存続"
 overthrow_government_outcome.1002.desc: "パトリシアンが企てた陰謀が明るみに出た。仕組んだのはあのならず者、[owner.GetShortUINameNoTooltip]だ。だが幸いにも、クーデターは私の輝かしく強固な政権を前にあっけなく砕け散った！\n\n反逆者たちはこの私を捕らえようとしたが、衛兵がその企てを阻止した。あれほど卑劣な真似をされても、議会と軍は今なお私に忠誠を誓っている。"
 overthrow_government_outcome.1002.a: "奴らを捕らえよ！"
 overthrow_government_outcome.1002.b: "いずれ私が始末しよう。"
 overthrow_government_outcome.1002.c: "寛大な心で許してやろう。"
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName]とその[agents|E]は[criminal|E]ではなくなり、国家の敵ではなくなる"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "転覆"
 overthrow_government_outcome.1003.desc: "「閣下！[craftsman_character.GetShortUINameNoTooltip]が、命からがら逃げてきたかのような様子で扉を突き破って叫んだ。\n\n「陰謀です！反逆です！[owner.GetShortUINameNoTooltip]が賛同者を集め、議会に閣下を国家の敵として糾弾させようとしています！暴徒がこちらへ向かっています！」\n\n[craftsman_character.GetSheHe|U]は檻に入れられた獣のように部屋を歩き回り、「どうすればよいでしょう？」と問いかけた。"
 overthrow_government_outcome.1003.b.desc: "「閣下！[craftsman_character.GetShortUINameNoTooltip]が、命からがら逃げてきたかのような様子で扉を突き破って叫んだ。\n\n「陰謀です！反逆です！[owner.GetShortUINameNoTooltip]が賛同者を集め、議会に新政府の樹立を宣言させようとしています！街では、あなたは失脚したものの、新政府は政敵すべてに恩赦を与えたという噂が広まっています」\n\n[craftsman_character.GetSheHe|U]は意気消沈した様子で私を見つめ。「どうすればよいでしょう？」と問いかけた。"
 overthrow_government_outcome.1003.a: "[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]と議会の前で弁明しよう。"
 overthrow_government_outcome.1003.b: "亡命しよう。"
 overthrow_government_outcome.1003.c: "政治から身を引き、交易商人として慎ましく生きよう。"
 overthrow_government_outcome.1003.d: "今は何もしない。政治の潮流とはそういうものだ。"
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "国家の敵"
 overthrow_government_outcome.1004.1.desc: "私は国家の敵と宣告された！"
 overthrow_government_outcome.1004.2.desc: "\n\nこの布告はあらゆる市場の広場や教会の扉に掲示され、私の命と財産に危険が迫っている。"
 overthrow_government_outcome.1004.3.desc: "\n\nいつ逮捕されてもおかしくない！"
 overthrow_government_outcome.1004.councilor.desc: "\n\n追放された政権の評議会で重要な地位に就いていたからに違いない。"
 overthrow_government_outcome.1004.personal.desc: "\n\n[owner.GetName]に個人的な敵と見なされている以上、理由を推測するのは難しくない。"
 overthrow_government_outcome.1004.political.desc: "\n\n強大なパトリシアンとしての地位にあり、新政権の[owner.GetHouse.GetHouseAspiration.GetName]の方針に反対する有力な発言者だったからに違いない。"
 overthrow_government_outcome.1004.conspiracy.desc: "\n\n政権転覆の陰謀に加担していたからに違いない。"
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "賽は投げられた"
 overthrow_government_outcome.1005.desc: "[speaker.GetShortUINameNoTooltip]が発言しようと議会の面前に進み出ると、辺りは緊張した空気に包まれた。\n\n「パトリシアン諸君！我らが祖国、我らが共和国に栄光あれ。残念だが、我らの[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U][target.GetFirstNameNoTooltip]は、汚職と共和国への反逆を理由に廃位されることになった」\n\n議場に驚きの声や不満のざわめきが広がるなか、影響力を持つ数人のパトリシアンが立ち上がり、拍手を送った。\n\n「緊急布告により、市民[owner.GetFirstNameNoTooltip]が国家の針路を正すため、新たな[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]として就任した」\n\nさらに多くのパトリシアンが立ち上がり、拍手はますます大きくなる。"
 overthrow_government_outcome.1005.a: "共和国万歳！"
 overthrow_government_outcome.1005.b: "これは反逆だ！暴君め！"
 government_overthrow_enemies.1001.b.custom: "以下のパトリシアンが[criminals|E]となる：\n$EFFECT_LIST_BULLET$廃位された[liege|E]と[councillors|E]\n$EFFECT_LIST_BULLET$あなたの[rivals|E]と[nemesis|E]\n$EFFECT_LIST_BULLET$あなたへの[opinion|E]が#N -60#!以下の人物\n$EFFECT_LIST_BULLET$[rivalry|E]の[house_relation|E]を持つ[house_heads|E]\n$EFFECT_LIST_BULLET$該当者は[assembly|E]で恩赦を求めるか、亡命する可能性がある\n$EFFECT_LIST_BULLET$[friends|E]、[lovers|E]、[soulmates|E]、[blood_brothers|E]は対象外"
 government_overthrow_enemies.1001.c.custom: "以下のパトリシアンが[criminals|E]となる：\n$EFFECT_LIST_BULLET$異なる[house_ambition|E]を持つ[powerful_vassal|E]\n$EFFECT_LIST_BULLET$廃位された[liege|E]と[councillors|E]\n$EFFECT_LIST_BULLET$あなたの[rivals|E]と[nemesis|E]\n$EFFECT_LIST_BULLET$あなたへの[opinion|E]が#N -60#!以下の人物\n$EFFECT_LIST_BULLET$[rivalry|E]の[house_relation|E]を持つ[house_heads|E]\n$EFFECT_LIST_BULLET$あなたの[agents|E]の個人的な敵\n$EFFECT_LIST_BULLET$該当者は[assembly|E]で恩赦を求めるか、亡命する可能性がある"
 government_overthrow_populace.1001.a.custom: "あなたの[realm|E]のすべての[county|E]"
 government_overthrow_populace.1001.a.description: "新政権に反対する者すべてを一律に赦免する。"
 government_overthrow_forgiven.tt: "国家に対する罪を赦される"
 overthrow_government_outcome.tt.success.desc: "自らの行動を雄弁に正当化する"
 overthrow_government_outcome.tt.success.toast: "あなたの行動が共和国への愛ゆえのものだと証明する"
 overthrow_government_outcome.tt.failure.desc: "あなたの演説は誰の耳にも届かない"
 overthrow_government_outcome.tt.failure.toast: "あなたは野次を浴び、議会から追放される"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip]は慎ましい交易商人になった"
 overthrow_government_enemy_of_the_state.tt: "議会はあなたを国家の敵と宣言した"
 overthrow_government_amnesty.tt: "議会はすべての共謀者に一律の恩赦を与えた"
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip]は、国家に対する陰謀に加担したあなたを逮捕するよう命じた"
 overthrow_government_blanket_pardon.tt: "政府転覆：放免された"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip]は政敵すべてに恩赦を与えると宣言した。"
