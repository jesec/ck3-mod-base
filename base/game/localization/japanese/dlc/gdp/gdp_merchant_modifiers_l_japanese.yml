l_japanese:
 gdp_merchant_starting_capacity_modifier: "積載量の増加"
 gdp_merchant_starting_capacity_modifier_desc: "この人物の商会は、より多くの商品を運搬できる。"
 gdp_voluntary_merchant_modifier: "自ら交易商人となった者"
 gdp_voluntary_merchant_modifier_desc: "この人物は、交易商人として名を上げるため、自らの称号を手放した。"
 gdp_patron_competitiveness_modifier: "競争力強化の後押し"
 gdp_patron_competitiveness_modifier_desc: "この人物の後援者は、事業を広く行き渡らせるよう説得された。"
 gdp_romance_fan_modifier: "救いようのないロマンチスト"
 gdp_romance_fan_modifier_desc: "この人物は、よくできた恋物語に目がない。"
 gdp_nepotism_modifier: "縁故主義の奨励"
 gdp_nepotism_modifier_desc: "この人物は、どんな犠牲を払ってでも一族を最優先すべきだと考えている。"
 gdp_merit_modifier: "実力主義の奨励"
 gdp_merit_modifier_desc: "この人物は、利益の出どころにはこだわらない。"
 gdp_full_attention_modifier: "商売への専念"
 gdp_full_attention_modifier_desc: "この人物は、つまらない道楽に時間を浪費しない。"
 gdp_responsible_modifier: "責務の引き受け"
 gdp_responsible_modifier_desc: "この人物は、少なくとも今のところ、自らの責務を引き受けている。"
 gdp_cooperation_modifier: "協力的な一族"
 gdp_cooperation_modifier_desc: "この人物は、相互の利益のために他家と協力する道を選んだ。"
 gdp_guild_master_inpiration_diplomacy_modifier: "外交の手ほどき"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "この人物は、外交に長けたギルド長に教えを求めた。"
 gdp_guild_master_inpiration_learning_modifier: "学術的助言"
 gdp_guild_master_inpiration_learning_modifier_desc: "この人物は、学識あるギルド長に助言を求めた。"
 gdp_guild_master_inpiration_stewardship_modifier: "財務の手ほどき"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "この人物はギルド長に教えを請い、指導を受けた。"
 gdp_boasted_market_competence_modifier: "商才の誇示"
 gdp_boasted_market_competence_modifier_desc: "この人物は、後援者から貴族たちの前で道化を演じるよう求められたが、その状況を逆手に取り、自らの利益へとつなげた。"
 gdp_driven_by_motivation_modifier: "野心に駆られて"
 gdp_driven_by_motivation_modifier_desc: "この人物は、商会の所有者に貢献しようと懸命に努めている。"
 gdp_promoted_diligence_modifier: "勤勉さの奨励"
 gdp_promoted_diligence_modifier_desc: "この人物は、心身の健康を損なう危険を冒してでも商売に一層励むよう、家長から圧力をかけられている。"
 gdp_promoted_excess_modifier: "贅沢の奨励"
 gdp_promoted_excess_modifier_desc: "この人物は商売を忘れ、贅沢な暮らしを送るよう奨励された。その結果、外交能力が高まり、商会の社会的な地位も向上している。"
 gdp_oasis_of_hope_modifier: "希望のオアシス"
 gdp_oasis_of_hope_modifier_desc: "この旅の一行は、砂漠で奇跡的にオアシスを見つけ、どうにか体力を回復した。"
 gdp_low_morale_entourage_modifier: "士気の低い一行"
 gdp_low_morale_entourage_modifier_desc: "この人物は熱波にもかかわらず、砂漠を進み続けることを決めた。"
 organize_the_venture_scheme_modifier: "整備された事業"
 organize_the_venture_scheme_modifier_desc: "この契約工作は、より厳格な日程と綿密な管理のもとに置かれている。"
 merchant_undercut_the_competition_modifier: "容赦なき値下げ攻勢"
 merchant_undercut_the_competition_modifier_desc: "この人物は競合相手を不利な立場に追い込むため、利益率を下げている。"
 merchant_cornering_the_market_modifier: "市場の独占"
 merchant_cornering_the_market_modifier_desc: "この人物は、最近の商業的圧力を利用して市場での地位を強化している。"
 merchant_public_benefactor_modifier: "公共事業の後援者"
 merchant_public_benefactor_modifier_desc: "この人物は、商会の本拠地周辺の公共事業を後援し、利益を地域からの信頼へと変えている。"
 merchant_private_profit_focus_modifier: "私的利益"
 merchant_private_profit_focus_modifier_desc: "この人物は、商会の利益と商業上の優位性を追求する一方で、世間からの評判を損なっている。"
 merchant_sponsored_public_works_county_modifier: "公共事業の後援"
 merchant_sponsored_public_works_county_modifier_desc: "この伯爵領は、商会による公共事業と地域への後援の恩恵を受けている。"
 gdp_merge_company_competitiveness_modifier: "支配的な交易商人"
 gdp_merge_company_competitiveness_modifier_desc: "この人物は、競合する商会の交易路を解体し、その市場を支配している。"
 gdp_merchant_full_larder_modifier: "食料庫の充実"
 gdp_merchant_full_larder_modifier_desc: "この人物は飢えに苦しんでいる市場の食料を自分たちの食卓のために確保し、それ以来、何一つ不足することなく暮らしている。"
 gdp_merchant_staying_vigilant: "警戒態勢"
 gdp_merchant_staying_vigilant_desc: "この人物は、自らの商売によって生じた飢えへの報復を恐れ、常に物陰に注意を払っている。"
 gdp_merchant_master_craft_tutelage_modifier: "匠に師事"
 gdp_merchant_master_craft_tutelage_modifier_desc: "この人物は匠の工房でしばらく修業した。"
 gdp_thirsty_traveler_modifier: "喉の渇いた旅人"
 gdp_thirsty_traveler_modifier_desc: "この人物は水なしで長い距離を旅しなければならなかった。"
 gdp_pure_waters_modifier: "清らかな水"
 gdp_pure_waters_modifier_desc: "この人物の商会は、浄化された水を十分に蓄え、渇きを潤している。"
 gdp_rationing_water_modifier: "水の節約"
 gdp_rationing_water_modifier_desc: "この人物の商会では水を厳しく、だが効果的に配給している。さらなる水を探しているため、進行が遅くなっている。"
 gdp_workout_modifier: "疲労した筋肉"
 gdp_workout_modifier_desc: "木を切る作業は、この人物にとって良い運動になったが、かなりの重労働でもあった。やがて体力は回復するだろう。"
 gdp_cat_rats_modifier: "猫の手柄"
 gdp_cat_rats_modifier_desc: "この人物は、働き者の猫のおかげで鼠のいない船旅を楽しんだ。"
 gdp_fishing_modifier: "釣りの喜び"
 gdp_fishing_modifier_desc: "この人物は、良い獲物の価値を身をもって知っている。"
 gdp_catch_rats_modifier: "鼠捕り"
 gdp_catch_rats_modifier_desc: "この人物は、暗く狭い船倉で健康を損ないながら、鼠を捕まえることを余儀なくされた。"
 dedicated_trade_studies: "交易の研究に専念"
 dedicated_trade_studies_desc: "この人物は官職ではなく商業の道を選び、市場を熟知するために研鑽を積んでいる。"
 gdp_local_business_modifier: "地元市場での商売"
 gdp_local_business_modifier_desc: "この人物は、遠く離れたシルクロードで大金を追い求めるのではなく、近隣の市場で競争する道を選んだ。"
 gdp_silk_road_market_foothold_modifier: "シルクロード市場への足掛かり"
 gdp_silk_road_market_foothold_modifier_desc: "この人物は最近、商会をシルクロードの市場へ移し、新たに築いた現地の人脈を活用している。"
 tgp_silk_road_interesting_innovations_modifier: "興味深い革新性"
 tgp_silk_road_interesting_innovations_modifier_desc: "この人物はシルクロードの革新性に興味を持ち、より多くの知識を得て帰ってきた。"
 gdp_silk_road_bargain_modifier: "シルクロードでの掘り出し物"
 gdp_silk_road_bargain_modifier_desc: "この人物はシルクロードの市場で大きな掘り出し物を手に入れる機会を求めた。"
 gdp_silk_road_market_investment_modifier: "シルクロード市場への投資"
 gdp_silk_road_market_investment_modifier_desc: "この人物はこのシルクロードの市場に投資すれば有利になると判断した。"
 gdp_merchant_legacy_3_ennobled_modifier: "信頼される交易商人"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "この人物とその商会の卓越した商才は、上流の社交界でも認められている。"
 gdp_merchant_legacy_3_rapacious_modifier: "綿密な会計"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "この人物は商会の帳簿を隅々まで調べ、その結果を主要な関係者と共有することを怠らない。"
