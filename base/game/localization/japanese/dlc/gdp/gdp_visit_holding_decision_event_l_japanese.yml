 gdp_visit_holding_decision_event.1300.b.cooldown.tt: "商会員を雇用しようと試みたばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_recruited_recently') )]以降に再試行可能"
