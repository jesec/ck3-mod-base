 gdp_visit_holding_decision_event.1320.urchin.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$@skill_intrigue_icon! [intrigue|E]の[skill_challenge_no_prefix|E]に勝利する\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.herbalist.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$@skill_learning_icon! [learning|E]の[skill_challenge_no_prefix|E]に勝利する\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip]は見込みがありそうだ。"
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip]には惹かれるものがある。"
 gdp_visit_holding_decision_event.1320.d: "面白そうな者はいないな…"
 gdp_visit_holding_decision_event.1320.d.tt: "市場へ戻り、[THIS.Char.GetCurrentLocation.GetName]でほかに何ができるか見て回る"
 gdp_visit_holding_decision_event.1320.e: "面白そうな者はいないな…"
 gdp_visit_holding_decision_event.1320.e.tt: "波止場へ戻り、[THIS.Char.GetCurrentLocation.GetNameNoTooltip]でほかに何ができるか見て回る。"
 gdp_visit_holding_decision_event.1320.tt: "ほかに面白そうな人材がいないか、見に戻ってみる"
 gdp_visit_holding_decision_event.1321.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1321.t: "ペテン師"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName]が、こちらへ来いと私を手招きしている。[charlatan_recruit.GetSheHe]は大仰な手振りとともに宣言した。\n\n「さて…挑戦者が現れたようだ！このコインが表と出るか裏と出るかを言い当てられたら、報酬ははずんでやるぞ！」\n\n[charlatan_recruit.GetSheHe]が手首をさっと返すと、コインは消えてしまった。群衆は固唾を呑み、私の対応を待っている。"
 gdp_visit_holding_decision_event.1321.a: "袖の中に偽のコインを隠しているの#EMP 明らか#!だ。"
 gdp_visit_holding_decision_event.1321.a.success: "いかさまを見破ることに成功する"
 gdp_visit_holding_decision_event.1321.a.failure: "いかさまを見破れない"
 gdp_visit_holding_decision_event.1321.b: "見事ないかさまだ。その技を私のために活かせ。"
 gdp_visit_holding_decision_event.1321.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [charlatan_recruit.GetFirstNameNoTooltip]を雇用するには@gold_icon! [charlatan_recruit_cost|V0]の[gold|E]が必要 "
 gdp_visit_holding_decision_event.1321.c: "こんな小細工に付き合っている暇はない…"
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1322.t: "荒々しきならず者"
 gdp_visit_holding_decision_event.1322.desc: "[hired_muscle_recruit.GetFirstName]に近づいた私は、[hired_muscle_recruit.GetHerHis]の鋭い目に値踏みされているのを感じた。\n\n「お前…誰に目ぇ付けてるか、わかってんのか？俺は[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]で無敗の王者だぞ。お前みたいな[hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)]が俺の前に立つとは、なかなか度胸があるじゃねぇか…」\n\n[hired_muscle_recruit.GetSheHe|U]は私を威嚇するように、拳を振り上げてきた。"
 gdp_visit_holding_decision_event.1322.a: " [hired_muscle_recruit.GetHerHim]の不躾な態度を後悔させてやろう！"
 gdp_visit_holding_decision_event.1322.a.success: "[hired_muscle_recruit.GetFirstName]を打ち負かす"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName]に打ち負かされる"
 gdp_visit_holding_decision_event.1322.b: "私と戦うのではなく、私のために戦え。"
 gdp_visit_holding_decision_event.1322.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [hired_muscle_recruit.GetFirstNameNoTooltip]を雇用するには@gold_icon! [hired_muscle_recruit_cost|V0]の[gold|E]が必要 "
 gdp_visit_holding_decision_event.1322.c: "さっさと立ち去ろう…"
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1323.t: "数字に強い学者"
 gdp_visit_holding_decision_event.1323.desc: "[numerate_recruit.GetFirstName]は自身の鼻を突っ込まんばかりに熱心に帳面を読みふけっており、私がすぐそばまで近づくまでほとんど気づかない。そして[numerate_recruit.GetSheHe|U]は、考え込むような表情で私を見上げる。\n\n「あなたはなかなか有能な[ROOT.Char.GetWomanMan]のようだ。よければ、このちょっとした問題を解くのを手伝ってくれないか？」\n\n[numerate_recruit.GetSheHe]が私の前に広げている帳簿には、数字や計算が几帳面に書き込まれている。露店の利益と経費を記した収支帳のようだ。"
 gdp_visit_holding_decision_event.1323.a: "この数字をこちらに移せば…"
 gdp_visit_holding_decision_event.1323.a.success: "計算の解を導き出す"
 gdp_visit_holding_decision_event.1323.a.failure: "方程式を解けない"
 gdp_visit_holding_decision_event.1323.b: "その才を#EMP 私の#!商会のために活かしてみる気はないか？"
 gdp_visit_holding_decision_event.1323.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [numerate_recruit.GetFirstNameNoTooltip]を雇用するには@gold_icon! [numerate_recruit_cost|V0]の[gold|E]が必要 "
 gdp_visit_holding_decision_event.1323.c: "ほかの人材を探そう…"
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1324.t: "熟練の旅人"
 gdp_visit_holding_decision_event.1324.desc: "二人の商人の間の緊張は、いまや頂点に達している。[traveler_recruit.GetFirstName]は宥めるような仕草を交えながら、争いを鎮めようとしている。[traveler_recruit.GetSheHe]は拙い[ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]で、ある程度の成果を上げた。明らかに現地の文化に慣れていない者としては、その努力は称賛に値する。\n\nだが、[traveler_recruit.GetSheHe]が言っているのが品質のことなのか、商品なのか、それともまったく別のことなのか、どちらの商人にも判断できず、口論は行き詰まったまま膠着状態に陥っている。"
 gdp_visit_holding_decision_event.1324.a: "「私が仲裁してみよう」"
 gdp_visit_holding_decision_event.1324.a.success: "あなたの解釈には説得力がある"
 gdp_visit_holding_decision_event.1324.a.failure: "あなたの口出しは歓迎されない"
 gdp_visit_holding_decision_event.1324.b: "君のような知識のある者が必要だ。"
 gdp_visit_holding_decision_event.1324.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [traveler_recruit.GetFirstNameNoTooltip]を雇用するには@gold_icon! [traveler_recruit_cost|V0]の[gold|E]が必要 "
 gdp_visit_holding_decision_event.1324.c: "もう構っていられない…"
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1325.t: "浮浪児"
 gdp_visit_holding_decision_event.1325.desc: "この手口は何度も見てきたので、私は[urchin_recruit.Custom('GirlBoy')]に慎重に近づく。声をかけるより先に、細い腕がおくるみを私の手に押し付けてきた。\n\n「親切なお方、お願いです。私とこの子に食べ物を恵んでいただけませんか？」\n\n[urchin_recruit.GetHerHis|U]のもう一方の手は、すでに私の財布をまさぐっている。するとおくるみが滑り落ち、その中から3つの石が転がり出た。思った通りだ。見え透いた芝居だが、大胆な手口だ。"
 gdp_visit_holding_decision_event.1325.a: "今すぐ財布から手を離せ！"
 gdp_visit_holding_decision_event.1325.a.success: "あなたは盗人を捕らえる"
 gdp_visit_holding_decision_event.1325.a.failure: "あなたの反応が遅すぎる"
 gdp_visit_holding_decision_event.1325.b: "私の商会には器用な人間が必要だ。"
 gdp_visit_holding_decision_event.1325.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [urchin_recruit.GetFirstNameNoTooltip]を雇用するには@gold_icon! [urchin_recruit_cost|V0]の[gold|E]が必要 "
 gdp_visit_holding_decision_event.1325.c: "いい加減にしろ！"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1326.t: "薬師"
 gdp_visit_holding_decision_event.1326.desc: "私が近づいても、[herbalist_recruit.GetFirstName]は気にも留めない。[herbalist_recruit.GetSheHe|U]は乳棒で材料をすり潰すのに夢中になっているようだ。\n\n「少量の[ROOT.Char.Custom('Abortifacient')]に、[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]を少し。それから[ROOT.Char.Custom('RegionalDrink')]で煮込めばいいかもしれない。そうだ…これでうまくいくはず。君はどう思う？」\n\n私の存在などほとんど意に介さないまま、[herbalist_recruit.GetSheHe]は私の方を向いて乳鉢を鼻先に差し出した。鼻を刺すような臭いが襲ってくる。"
 gdp_visit_holding_decision_event.1326.a: " #EMP ふむ#!、[ROOT.Char.Custom('Abortifacient')]をもっと加えてみてはどうだ？"
 gdp_visit_holding_decision_event.1326.a.success: "あなたの意見が役に立つ"
 gdp_visit_holding_decision_event.1326.a.failure: "あなたの意見は役に立たない"
 gdp_visit_holding_decision_event.1326.b: "君のような技能を持つ者が、本当に必要なんだ。"
 gdp_visit_holding_decision_event.1326.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [herbalist_recruit.GetFirstNameNoTooltip]を雇用するには@gold_icon! [herbalist_recruit_cost|V0]の[gold|E]が必要 "
 gdp_visit_holding_decision_event.1326.c: "私には向いていないと思う。"
 gdp_visit_holding_decision_event.1330.t: "僧侶"
 gdp_visit_holding_decision_event.1330.desc: "地元の茶屋の静かな一角で、私は占いをしている僧侶を見つけた。[monk.GetHerHim]は筮竹を広げていて、卓はろうそくの明かりに照らされている。[monk.GetWomanMan]は私が興味を示しているのを察し、こちらを見た。\n\n「友よ、あなたは神託の教えを学ぶ者か？心を開き、偽りなく向き合うなら、道は多くのことを示してくれるだろう」"
 gdp_visit_holding_decision_event.1330.desc_returned_01: "茶屋の客が先程より少なくなっている。[monk.GetFirstName]は今も筮竹を前に広げて座っている。ろうそくはだいぶ短くなっていた。\n\n[monk.GetSheHe|U]は顔を上げようともしない。"
 gdp_visit_holding_decision_event.1330.desc_returned_02: "戻ってみると、[monk.GetFirstName]は筮竹を布にしまっているところだった。ろうそくの火が消えかけている。\n\n「また来られたか」と[monk.GetSheHe]が言う。「道は二度目の訪問を嫌がらない。あなたはどうだ？」"
 gdp_visit_holding_decision_event.1330.a: "我が商会には、博学な仲間が必要だ。"
 gdp_visit_holding_decision_event.1330.a.tt: "[monk.GetFirstNameNoTooltip]を雇用するには@gold_icon![monk_recruit_cost|V0]の[gold|E]が必要"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "何を学んでいるのか聞かせてくれ。"
 gdp_visit_holding_decision_event.1330.c: "天のことなら、私も多少は心得ている。"
 gdp_visit_holding_decision_event.1330.c.success: "あなたは[monk.GetFirstNameNoTooltip]を感心させる"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName]は感心することなく立ち去る"
 gdp_visit_holding_decision_event.1330.d: "またの機会にしよう。"
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1333.t: "熟練の隊商長"
 gdp_visit_holding_decision_event.1333.desc: "ヒトコブラクダが、囲いの中にあるわずかな雨よけの下に身を寄せ合っている。群れの中から、ときおり鼻を鳴らす音や蹄を踏み鳴らす音が聞こえてくる。そしてこれは…#EMP いびき#!か!？\n\nよく見ると、隊商長が鞍袋にもたれて眠っている。[caravaneer.GetSheHe|U]は私が近づく音で目を覚まし、慌てて立ち上がると、よだれを拭った。\n\n彼はこう説明した。「ご安心ください。厩舎の持ち主は私がここにいることを承知しています。私は動物たちの安全のため、そして私自身が安心していられるよう、決して動物のそばを離れないのです」"
 gdp_visit_holding_decision_event.1333.desc_returned_01: "ヒトコブラクダは、相変わらず囲いの中で身を寄せ合っている。今回は[caravaneer.GetFirstName]は起きており、鞍の腹帯に手を滑らせている。\n\n[caravaneer.GetSheHe|U]はこちらを振り返ると、「またあなたですか」と言った。"
 gdp_visit_holding_decision_event.1333.desc_returned_02: "囲いの中からラクダが鼻を鳴らす音が聞こえて、それから[caravaneer.GetFirstNamePossessive]の声がした。「見物に来たのなら料金を払ってもらいますよ」\n\n[caravaneer.GetSheHe|U]は今度はきちんと身なりを整え、鞍袋の上に座っている。私が話をしにきたのかどうか、様子をうかがっている。"
 gdp_visit_holding_decision_event.1333.a: "「私が君の動物たちを守ろう」"
 gdp_visit_holding_decision_event.1333.a.tt: "[caravaneer.GetFirstNameNoTooltip]を雇用するには@gold_icon! [caravaneer_recruit_cost|V0]の[gold|E]が必要"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "「道中で何か変わったことは？」"
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "あなたは最近、街道について尋ねたばかりだ。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1333.c: "「隊商の編成についてなら、私にも多少心得がある…」"
 gdp_visit_holding_decision_event.1333.c.success: "あなたは[caravaneer.GetFirstNameNoTooltip]を感心させる"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName]は動物を連れて立ち去る"
 gdp_visit_holding_decision_event.1333.d: "またの機会にしよう。"
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1334.t: "船長"
 gdp_visit_holding_decision_event.1334.desc: "波止場では、熟練の船乗りの船に乗せてもらおうと集まった男女が、[sea_captain.GetHerHis]を囲んでいた。\n\n通りがかった2人がひそひそ話すのが聞こえてくる。「遅かった！[sea_captain.GetTitledFirstName|U]の船に私たちが乗れる場所は残っていないだろう」彼らは他の船乗りに頼ることもせず、船長が次に戻ってくるのを待つことにした。\n\nいったいあの[sea_captain.GetWomanMan]は何者なのだろう。それと、[sea_captain.GetHerHis]の義足の中から聞こえるのは、まさか#EMP 金貨#!の音なのか？"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "[sea_captain.GetFirstName]を取り囲んでいた人だかりがまばらになっている。最後の乗船希望者が去っていくなか、[sea_captain.GetSheHe|U]は義足の中に金貨を一枚ずつ落としている。\n\n[sea_captain.GetSheHe|U]はこちらを向きもせずに、「また会うとは思っていなかった」と言った。"
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName|U]は遅れてやってきた人に、別の船を指し示している。[sea_captain.GetSheHe]は振り返り、義足で埠頭の板張りをコツンと鳴らした。\n\n「もう戻ってきたのか。船に乗りたいのか、それとも何か用があるのか？」"
 gdp_visit_holding_decision_event.1334.a: "「ここにいる者たちの倍額を払おう」"
 gdp_visit_holding_decision_event.1334.a.tt: "[sea_captain.GetFirstNameNoTooltip]を雇用するには@gold_icon! [sea_captain_recruit_cost|V0]の[gold|E]が必要"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "「何か面白い話を聞かせてくれないか？」"
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "あなたは最近、船長の話を聞いたばかりだ。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1334.c: "「交易のほうが、よほど儲かる商売だ」"
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip]を説得する"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName]が船を出す"
 gdp_visit_holding_decision_event.1334.d: "またの機会にしよう。"
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1335.t: "カーニバルの道化師"
 gdp_visit_holding_decision_event.1335.desc: "街角で芸を披露する[carnival_jester.GetWomanMan]の周りに、観客が集まって夢中になっている。近くの露店からも客が流れ込み、市場全体の取引を停滞させている。\n\n芸人は片腕を広げると、こう言った。「私の芸は薄暗いカーニバルの会場でなければできないと言っていた連中は、よく見ておけ！お前たちと違って、私は仮面の下に隠れる必要などないんだ」"
 gdp_visit_holding_decision_event.1335.desc_returned_01: "先程の街角に来たが、人だかりが少なくなっている。[carnival_jester.GetFirstName]はひと演目を終えると私に気づき、まるで私も芸に登場するかのようにこちらへ両腕を広げた。\n\n「もう一芸観たいのかい？」"
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName]は小道具を布に包んで片づけている。\n\n「あなたのお目当ては私なんじゃないかという気がしてきたよ」"
 gdp_visit_holding_decision_event.1335.a: "「我が商会には君のような機知に富んだ人間が必要だ」"
 gdp_visit_holding_decision_event.1335.a.tt: "[carnival_jester.GetFirstNameNoTooltip]を雇用するには@gold_icon! [carnival_jester_recruit_cost|V0]の[gold|E]が必要"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "「カーニバルについて、もっと詳しく聞かせてくれ」"
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "あなたは最近、カーニバルについて尋ねたばかりだ。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1335.c: "「ここでこれ以上、自分の腕を証明する必要はないだろう？」"
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip]を説得する"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName]は荷物をまとめて立ち去る"
 gdp_visit_holding_decision_event.1335.d: "またの機会にしよう。"
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1336.t: "パン職人"
 gdp_visit_holding_decision_event.1336.desc_intro: "近くの露店から、焼きたての[ROOT.Char.Custom('FavoriteTreat')]の甘い香りが漂ってきた。見ると、パンの籠が所狭しと積み上げられている。\n\n店の[cook.GetWomanMan]主人は脇に立ち、両手で頭を抱えている。[cook.GetSheHe]は私に気づくと、こう言った。"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "「以前は[local_noble.GetTitledFirstNameNoTooltip]に雇われていたんですが、[local_noble.GetSheHe]は最近体型を気にしているとかで、私は用済みになってしまったんです」[cook.GetSheHe|U]が唇を噛んだ。「あなたのような交易商人なら、うまく売りさばけるかもしれませんね。私には…一日ではとても手が回りません」"
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "「お屋敷からお呼びがかからない。パンは山ほどあるのに、とても売り切れそうにない！」"
 gdp_visit_holding_decision_event.1336.desc_returned_01: "露店には、まだ[ROOT.Char.Custom('FavoriteTreat')]の香りが漂っている。[cook.GetFirstName]は、代金を払わなかった見知らぬ客のために、また包みを用意している。\n\n[cook.GetSheHe|U]が私に気づいてため息をついた。「まだ注文が来ないのです。いつまでも無料で配り続けるわけにはいきません」"
 gdp_visit_holding_decision_event.1336.desc_returned_02: "籠の数が減っている。[cook.GetFirstName]はカウンターにもたれ、袖に小麦粉をつけたまま、最後のパンが持ち帰られるのを見つめている。\n\n「パン職人を必要としているなら、露店が空になる前に声をかけてください」と[cook.GetSheHe]は言った。"
 gdp_visit_holding_decision_event.1336.a: "「商会には養わなければならない者が大勢いる」"
 gdp_visit_holding_decision_event.1336.a.tt: "[cook.GetFirstNameNoTooltip]を雇用するには@gold_icon! [cook_recruit_cost|V0]の[gold|E]が必要"
