l_japanese:
 gdp_visit_holding_decision: "領分を訪れる"
 gdp_visit_holding_decision_tooltip: "$visit_local_settlement_decision_tooltip$\n[ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasWorship')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasWorship')]"
 gdp_visit_holding_decision_confirm: "仕事に取りかかろう！"
 gdp_visit_holding_decision_desc: "機会は、それを求める者のもとに訪れる。[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]のこの[ROOT.Char.Custom('LocalHoldingTypeConcept')]には、まだ引き出されていない可能性が満ちている！新たな顧客、新たな契約、そして新たな商機が待っているのだ。"
 gdp_visit_holding_decision_effect_intro: "以下の機会が得られる可能性がある："
 gdp_visit_holding_decision_effect_artifact: "\n$EFFECT_LIST_BULLET$[artifact_i] [artifacts|E]を改良または購入する"
 gdp_visit_holding_decision_effect_guild: "\n$EFFECT_LIST_BULLET$あなた、またはあなたの[family_i] [family|E]の[skill_i] [skills|E]を上げる "
 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$あなたの[competitiveness_i] [trade_competitiveness|E]を上げる"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$[gold_i] [gold|E]を[prestige_i] [prestige|E]に換える"
 gdp_visit_holding_decision_effect_recruit: "\n$EFFECT_LIST_BULLET$[associate_i] [associates|E]と出会い、雇い入れる"
 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$[luxury_contract_i] [luxury_contracts|E]を見つける"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$あなたの[stress_loss_i] [stress|E]を軽減する"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$$gdp_visit_holding_decision_effect_artifact$$gdp_visit_holding_decision_effect_guild$$gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$$gdp_visit_holding_decision_effect_recruit$$gdp_visit_holding_decision_effect_contracts$$gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak まだ機会がある場所：#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$ギルド"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$市場"
 VISIT_HOLDING_DECISION_AVAILABLE_DOCKS: "\n$EFFECT_LIST_BULLET$波止場"
 VISIT_HOLDING_DECISION_AVAILABLE_PATRON: "\n$EFFECT_LIST_BULLET$あなたの[ROOT.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip]の宮廷"
 VISIT_HOLDING_DECISION_AVAILABLE_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 VISIT_HOLDING_DECISION_EXHAUSTED_AREAS_HEADER: "\n#weak これらのエリアは以下の日付以降に再訪できる：#!"
 VISIT_HOLDING_DECISION_EXHAUSTED_GUILDS: "\n$EFFECT_LIST_BULLET$ギルド —— [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$市場 —— [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$波止場 —— [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$あなたの[ROOT.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip]の宮廷 —— [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] —— [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "この[ROOT.Char.Custom('LocalHoldingTypeConcept')]の探索は完了した。新しいオプションは[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]以降に利用可能になる"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の[ROOT.Char.Custom('LocalHoldingTypeCapitalized')]を訪ねて"
 gdp_visit_holding_decision_event.1000.desc: "陽が昇るにつれ、[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の住民たちも目を覚ましていく。朝の静けさはほどなく、日々の営みに向かう人々の賑やかな話し声に取って代わられた。目ざとい観察者なら、この慌ただしい通りの至るところに機会を見いだせるだろう。\n\n幸運を手にするため、今日はどこへ向かおうか？"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "中継地での教訓"
 gdp_visit_holding_decision_event.1000.a: "ギルドへ向かおう。"
 gdp_visit_holding_decision_event.1000.a.tt: "ギルドを訪問すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_artifact$$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "ギルドの探索は完了した。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]以降に再試行可能"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "市場の探索は完了した。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]以降に再試行可能"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "波止場の探索は完了した。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]以降に再試行可能"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "[THIS.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip]の宮廷の探索は完了した。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]以降に再試行可能"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "謁見を求められる後援者がいない"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "この[THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]の探索は完了した。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]以降に再試行可能"
 gdp_visit_holding_caught_stealing.tt: "この[THIS.Char.Custom('LocalHoldingTypeConcept')]の[THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]において窃盗で捕まっており、[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]まで追放されている"
 gdp_visit_holding_decision_event.1000.b: "[patron.GetTitledFirstNameNoTooltip]との謁見を求めよう。"
 gdp_visit_holding_decision_event.1000.c: "市場を見て回るには絶好の日だ。"
 gdp_visit_holding_decision_event.1000.c.tt: "地元の市場を訪問すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_recruit$$gdp_visit_holding_decision_effect_contracts$$gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "波止場のあたりを散策するのにちょうどよい日だ。"
 gdp_visit_holding_decision_event.1000.e.tt: "地元の波止場を訪問すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_recruit$$gdp_visit_holding_decision_effect_contracts$$gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]に足を運ぶのも面白そうだ。"
 gdp_visit_holding_decision_event.1000.f.tt: "地元の礼拝所を訪問すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_donate$$gdp_visit_holding_decision_effect_cure$$gdp_visit_holding_decision_effect_blessing$$gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$[gold_i] [gold|E]を寄進して[piety_i] [piety|E]を得る"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$あなたの[health|E]を改善する、または[diseases|E]を治療する"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$祝福により、[character_modifier|E]を得る"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$供物をくすねて[gold_i] [gold|E]を得る"
 gdp_visit_holding_decision_event.1000.d: "今日やるべきことはやったな。"
 gdp_visit_holding_decision_event.1000.d.tt: "帰宅する"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "「やっぱりやめておこう」"
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "この[ROOT.Char.Custom('LocalHoldingTypeConcept')]を探索せずに去る"
 gdp_visit_holding_decision_event.1000.d.exhausted: "やり残したことはなさそうだ…"
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "家に帰る。新しい機会は[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]以降に利用可能になる"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "あなたの[domicile|E]は現在、あなたの[merchant_patrons|E]の領国にない"
 gdp_visit_holding_decision_event.1110.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]のギルドを訪ねて"
 gdp_visit_holding_decision_event.1110.desc: "ギルド街の路地には、金槌で金属を打つ音が響いている。通りの先では、若い徒弟が親方の道具を陶芸工房へ運んでいる。何世代にもわたり、ギルド会館は職人たちを熟練の親方へと鍛え上げてきた。\n\nギルドはあらゆる交易商人に多くのサービスを提供している。今日はどのギルドを訪ねるべきだろうか？"
 gdp_visit_holding_decision_event.1110.a: "手持ちの宝物を少し磨いてもらうとしよう。"
 gdp_visit_holding_decision_event.1110.a.tt: "宝物管理官を訪問すると、以下の機会が得られる可能性がある：\n$EFFECT_LIST_BULLET$「一般的」や「名品」の@artifact_icon! [artifacts|E]を改良する"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "宝物管理官のサービスを利用したばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "あなたは「一般的」または「名品」の[artifacts|E]を所有していない"
 gdp_visit_holding_decision_event.1110.b: "新しい武具が欲しい気分だ。"
 gdp_visit_holding_decision_event.1110.b.tt: "鍛冶工を訪問すると、以下の機会が得られる可能性がある：\n$EFFECT_LIST_BULLET$「一般的」、「名品」、または「著名」の武具@artifact_icon! [artifacts|E]を購入する"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "鍛冶工から商品を購入したばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1110.c: "ギルド長との面会を手配しよう。"
 gdp_visit_holding_decision_event.1110.c.tt: "ギルド長と面会すると、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "ギルド長と面会したばかりである。[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]以降に再試行可能"
 gdp_visit_holding_decision_event.1110.d: "別の場所に行くべきか？"
 gdp_visit_holding_decision_event.1110.d.tt: "ギルド街を立ち去る"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$：宝物管理官"
 gdp_visit_holding_decision_event.1111.desc: "宝物管理官の工房に足を踏み入れると、近隣や遠方の地から集められた興味深い品々が私を迎えた。奥の作業台では、ひとりの[curator.GetWomanMan]が猫背になって、短剣の柄に極上の宝石を象嵌している。展示されている小物のひとつを眺めていると、[curator.GetSheHe]は意識をこちらに向けて言った。\n\n「おや、どうもいらっしゃい！今日はどうやって[ROOT.Char.GetTitledFirstNameNoTooltip]のお役に立ちましょうかね？」"
 gdp_visit_holding_decision_event.1111.a: "[artifact_target_1.GetNameNoTooltip]を磨いてもらうのがよさそうだ。"
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName]が改良される"
 gdp_visit_holding_decision_event.1111.b: "[artifact_target_2.GetNameNoTooltip]を少し手入れしてもらうべきかもしれない。"
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName]が改良される"
 gdp_visit_holding_decision_event.1111.c: "私の持っている[artifact_target_3.GetNameNoTooltip]は、もっと優れた品にできるはずだ。"
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName]が改良される"
 gdp_visit_holding_decision_event.1111.d: "またの機会にするとしよう…"
 gdp_visit_holding_decision_event.1111.d.tt: "ギルド街へ戻り、[THIS.Char.GetCurrentLocation.GetName]でほかに何ができるか見て回る"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$：鍛冶工"
 gdp_visit_holding_decision_event.1112.desc: "鍛冶工房に入ると、ほとんど耐えがたいほどの炉の熱気が立ちこめていた。ブロードソードを叩いていた鍛冶工は、私が入ってきたことで不意に手を止める。[blacksmith.GetSheHe]は煤の混じった汗を額から拭うと、こちらを向いて言った。\n\n「こんな所へようこそ、我が[ROOT.Char.GetTitleAsNameNoTooltip]。今日はここにある素晴らしい武具をお求めかな？[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]でも滅多にお目にかかれない名品が揃ってますよ」"
 gdp_visit_holding_decision_event.1112.a: "この[arms_armor_artifact_1.GetNameNoTooltip]…よい収蔵品になりそうだ。"
 gdp_visit_holding_decision_event.1112.b: "その[arms_armor_artifact_2.GetNameNoTooltip]は買っておくべきだろうな。"
 gdp_visit_holding_decision_event.1112.c: "その[arms_armor_artifact_3.GetNameNoTooltip]のような品は役に立ちそうだ。"
 gdp_visit_holding_decision_event.1112.d: "気が変わった。今日はやめておこう。"
 gdp_visit_holding_decision_event.1112.d.tt: "ギルド街へ戻り、[THIS.Char.GetCurrentLocation.GetName]でほかに何ができるか見て回る"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$：ギルド長の指南"
 gdp_visit_holding_decision_event.1113.desc: "ギルド長、[guild_master.GetName]との面会は、[ROOT.Char.GetHouse.GetName]商会にとって実り多いものとなった。埃っぽい事務室で、紙と書物の山に囲まれて話しているうち、気づけば数時間が過ぎていた。\n\n[guild_master.GetNameNoTooltip]は[guild_master.Custom('highest_skill_noun')]について、独自の見識を持っている。私と私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))]である[visiting_associate.GetName]は共に、[guild_master.GetHerHis|U]の話にすっかり惹き込まれてしまい、さらに学びを深めたいという思いを募らせるばかりだった。"
 gdp_visit_holding_decision_event.1113.a.success: "あなたと[visiting_associate.GetName]は新たな知識を難なく吸収する"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "古代の写本を読み解くのは容易ではない"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "その数式は、あなたと[visiting_associate.GetName]には難しすぎて理解できない"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "壮大な外交上の駆け引きは、複雑すぎて理解できない"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "講義は誰の耳にも届かない。"
 gdp_visit_holding_decision_event.1113.a: "「私と[visiting_associate.GetNameNoTooltip]、もう少しここに留まってもよいのではないか？」"
 gdp_visit_holding_decision_event.1113.a.child: "この講義は[visiting_associate.GetNamePossessive]の教育に役立つ"
 gdp_visit_holding_decision_event.1113.b: "「[visiting_associate.GetFirstNameNoTooltip]には、この分野についてもう一度講義を受けさせてもよさそうだ」"
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName]が[visiting_associate.GetNameNoTooltip]に、以下の分野についてさらに教えを授ける："
 gdp_visit_holding_decision_event.1113.c: "「興味深い内容だ…いますぐ書き留めておかねば！」"
 gdp_visit_holding_decision_event.1113.c.tt: "[guild_master.GetNamePossessive]の知識は[THIS.Char.GetHouse.GetName]商会の役に立つ"
 gdp_visit_holding_decision_event.1113.d: "[guild_master.Custom('highest_skill_noun')]の話は、今日はこのくらいでよいだろう。"
 gdp_visit_holding_decision_event.1113.d.tt: "ギルド街へ戻り、[THIS.Char.GetCurrentLocation.GetName]でほかに何ができるか見て回る"
 gdp_visit_holding_decision_event.1300.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の市場を訪ねて"
 gdp_visit_holding_decision_event.1300.asia: "シルクロード沿いの市場はどこもそうだが、ここにも翡翠や絹、茶葉といった高級品が豊富に並んでいる。\n\n人でごった返している大通りの真ん中では、ひとりの男が荷車から繊細な磁器の花瓶を慎重に降ろしている。その傍らでは、色鮮やかな衣装に身を包んだ異国の交易者が、品定めをしながら露店を見て回り、何か買おうと目を輝かせていた。"
 gdp_visit_holding_decision_event.1300.mena_india: "色鮮やかな布地と模様入りの陶器が、薄暗い路地に彩りを添えている。香と香辛料が、客を誘うような香りを辺りに満たしていた。\n\n市場の片隅の暗がりでは、ひとりの行商人が、上質な銅皿を買わせようと、疑わしげな通行人を必死に説得している。取引をまとめるには絶好の機会だ。"
 gdp_visit_holding_decision_event.1300.default: "新鮮な農産物の匂いに、押し寄せる群衆の熱気が混じり合っている。狭苦しい広場では、行商人たちが声を張り上げ、客を奪い合っていた。\n\n「[ROOT.Char.Custom('RegionalDrink')|U]はどうだ！本日限りの特別価格だ！」「最高級の[ROOT.Char.Custom('RegionalEdibleMeat')]、今を逃すともう買えないよ！」\n\n"
 gdp_visit_holding_decision_event.monk_hint: "近くの茶屋から、凶兆について何かつぶやきながら、うなだれて出てくる男がいる。どうやら中で誰かが占いをしているらしい。"
 gdp_visit_holding_decision_event.monk_hint_return: "茶屋は先程より静かになっているが、占いをする僧侶はまだ立ち去っていない。"
 gdp_visit_holding_decision_event.caravaneer_hint: "長旅で風雨にさらされた隊商が列をなして通りを埋め尽くしている。交易の新たな流入に、地元の厩舎も対応に追われている。"
 gdp_visit_holding_decision_event.caravaneer_hint_return: "隊商はまだ出発していない。御者は今も家畜のそばにいて、待機している。"
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\n噂によると、経験豊富な船長が、今日は自分の船に乗客を乗せているらしい。"
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\n船長はまだ乗客を募っており、船の周りにはまだ人だかりができている。"
 gdp_visit_holding_decision_event.carnival_jester_hint: "交易商人が、店の常連客の関心を奪ってしまう大道芸人について不満を漏らしているのが聞こえてくる。"
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "大道芸人はまだ群衆を引きつけており、近くの交易商人たちも不満そうにしている。"
 gdp_visit_holding_decision_event.cook_hint: "たくさんの人々が、[ROOT.Char.Custom('FavoriteTreat')]を手に持って歩いている。そのうちの一人が、無料で商品を配っているパン職人がいると話しているのが聞こえてきた。"
 gdp_visit_holding_decision_event.cook_hint_return: "パン職人はまだ店を閉めていない。"
 gdp_visit_holding_decision_event.1300.desc.fallback: "硬貨と商品が目まぐるしく行き交っている。市場は機会に満ちあふれているようだ。"
