 gdp_visit_holding_rare_recruit_skill.intrigue: "[ROOT.Char.GetFirstName]の[intrigue_skill|E]：[ROOT.Char.Custom('GetVisitHoldingColoredIntrigueSkillLevel')]（[intrigue_i] [ROOT.Char.GetSkill( 'intrigue' )|V]）"
 gdp_visit_holding_rare_recruit_skill.learning: "[ROOT.Char.GetFirstName]の[learning_skill|E]：[ROOT.Char.Custom('GetVisitHoldingColoredLearningSkillLevel')]（[learning_i] [ROOT.Char.GetSkill( 'learning' )|V]）"
 gdp_visit_holding_rare_recruit_court_position.partner: "あなたの[GetCourtPositionType('partner_court_position').GetName()]としての[ROOT.Char.GetFirstNamePossessiveNoTooltip]の[aptitude|E]：[ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('partner_court_position') )]"
 gdp_visit_holding_rare_recruit_court_position.translator: "あなたの[GetCourtPositionType('translator_court_position').GetName()]としての[ROOT.Char.GetFirstNamePossessiveNoTooltip]の[aptitude|E]：[ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('translator_court_position') )]"
 gdp_visit_holding_rare_recruit_court_position.fixer: "あなたの[GetCourtPositionType('fixer_court_position').GetName()]としての[ROOT.Char.GetFirstNamePossessiveNoTooltip]の[aptitude|E]：[ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('fixer_court_position') )]"
