 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$：機会の探索"
 gdp_visit_holding_decision_event.1310.desc: "近ごろは、異国の獣や財宝にまつわる噂をあれこれと耳にする。今日は市場をくまなく歩き回り、そうした話に詳しい者がいないか探ってみるとしよう。\n\n交易者たちの中に、奇妙な異国訛りで、遠方の地における自身の冒険譚を得意げに語る[foreigner.GetWomanMan]の姿があった。相手をしている地元の交易者は、さほど興味もなさそうだ。[foreigner.GetSheHe|U]はただの大言壮語の輩かもしれないが、その話にも多少の真実はあるのかもしれない。少しばかり金を握らせれば、口を開かせられるだろうか…"
 spawn_merchant_contract_interaction_duplicate_tt: "このタイプの[task_contract|E]には、受諾済みまたは利用可能なものがすでに存在する"
