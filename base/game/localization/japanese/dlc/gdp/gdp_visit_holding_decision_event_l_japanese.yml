 market_recruitment_success.t: "採用成功"
 gdp_visit_holding_decision_event.1400.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]の波止場を訪ねて"
 gdp_visit_holding_decision_event.1400.intro: "活気に満ちた[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の港では、荷役人たちが大小さまざまな積み荷をせっせと荷下ろししている。"
 gdp_visit_holding_decision_event.1400.asia: "絹の木箱や茶葉の袋が、タコのできた手で慎重に扱われている。やがてそれらは、荒海を越え、ジョング船によって無事に運ばれ、世界各地へ驚きをもたらすことになるのだ。"
 gdp_visit_holding_decision_event.1400.mena_india: "混沌とした喧騒の中、ひとりの交易商人が破損した木箱の積み荷を検分している。港の反対側では、香辛料の木箱が、危険に満ちた船旅に耐えられるよう慎重に封をされていた。"
 gdp_visit_holding_decision_event.1400.default: "穀物や塩の袋が、遠方の地へ向けて沖合へ運び出されている。ちょうど錨を下ろしたばかりの、堂々たるオーク材のコグ船からは、色鮮やかな衣服をまとった異国の交易商人たちが降り立っていた。"
 gdp_visit_holding_decision_event.1400.outro: "新鮮な空気が肺を満たす。幸運を運ぶ海風は今日、私のほうへ吹いているか、確かめたくてたまらない。\n\n…次はどこへ向かおうか？\n\n"
 gdp_visit_holding_decision_event.1400.b: "興味深い人物がいないか、目を光らせておこう。"
 gdp_visit_holding_decision_event.1400.b.tt: "波止場で人材を探すことにより、以下の機会が得られる可能性がある：$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "あの船長と話をしてみよう。"
 gdp_visit_holding_decision_event.1400.d.tt: "船長に話しかける\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "もう一度[sea_captain.GetFirstNameNoTooltip]と話をしてみよう。"
 gdp_visit_holding_decision_event.1400.c.tt: "波止場を立ち去る"
