 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "すでに領分を訪問中である"
 gdp_visit_holding_decision_event.1340.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]でひと休み"
 gdp_visit_holding_decision_event.1340.desc: "商売の世界は気疲れするものだ。取引を吟味し、作り笑いを浮かべ続けるのにも限界がある。たまにはゆっくり休む時間が必要だ。\n\n"
 gdp_visit_holding_decision_event.1340.tea: "この茶屋では、商会が抱える問題を束の間忘れることができる。\n\n淹れたての熱いお茶をゆっくり味わいながら、地元の常連客と他愛のない話や近況を話し合い、噂話に花を咲かせる。そんなひとときが心を休ませてくれるのだ。"
 gdp_visit_holding_decision_event.1340.hashish: "このハシシを楽しむ店では、商会が抱える問題を束の間忘れることができる。\n\n涼しく静かな店内でくつろぎながら、地元の常連客と他愛のない話や近況を話し合い、噂話に花を咲かせる。そんなひとときが心を休ませてくれるのだ。"
 gdp_visit_holding_decision_event.1340.drink: "この酒場では、商会が抱える問題を束の間忘れることができる。\n\n上等な[ROOT.Char.Custom('RegionalAlcoholicDrink')]を少しずつ味わいながら、地元の常連客と他愛のない話や近況を話し合い、噂話に花を咲かせる。そんなひとときが心を休ませてくれるのだ。"
 gdp_visit_holding_decision_event.1340.food: "この宴会場では、商会が抱える問題を束の間忘れることができる。\n\nずらりと並んだごちそうを楽しみ、[ROOT.Char.Custom('FavoriteTreat')]をつまみながら、地元の常連客と他愛のない話や近況を話し合い、噂話に花を咲かせる。そんなひとときが何より心を休めてくれる。"
 gdp_visit_holding_decision_event.1340.bath: "この浴場では、商会が抱える問題を束の間忘れることができる。\n\n身体を癒やす湯にゆっくり浸かりながら、地元の常連客と他愛のない話や近況を話し合い、噂話に花を咲かせる。そんなひとときが心を休ませてくれるのだ。"
 gdp_visit_holding_decision_event.1340.a: "もっと頻繁にここに来るようにしよう。"
