 gdp_visit_holding_decision_event.1320.t_docks: "$gdp_visit_holding_decision_event.1400.t$：人材の探索"
 gdp_visit_holding_decision_event.1320.desc: "群衆を見渡していると、有望な候補者が3人、目に留まった！"
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "群衆が銀のきらめきに魅了されて集まっている。[ROOT.Char.GetNamePossessive]の手品に、人々は屠殺場へ向かう羊のように列を作っている。"
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "使い古された鎧を身にまとった[ROOT.Char.GetFirstName]は、屈強な体を壁に預けて、落ち着きなく短剣を弄んでいる。"
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName]は露店を一つずつ調べ、小さな帳簿に細かな情報を丹念に書き留めている。 "
 gdp_visit_holding_decision_event.1320.traveler.desc: "異国の服装をした[ROOT.Char.GetFirstName]が、2人の交易者の争いを仲裁しようとしている。しかも、たどたどしい[ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]でだ！"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName]は物陰に身を潜め、布にくるんだ赤ん坊を片腕に抱え、もう片方の手を差し出して、次の不用心な獲物を物色している。"
 gdp_visit_holding_decision_event.1320.herbalist.desc: "[ROOT.Char.GetFirstName]は負傷した旅人のそばに身をかがめ、近くの雑草から手早く治療用の湿布を作っている。"
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip]は興味深い人物のようだ。"
 gdp_visit_holding_decision_event.1320.option.tt: "以下の行動により、[THIS.Char.GetFirstName]を[associate|E]として雇用できる可能性がある："
 gdp_visit_holding_decision_event.1320.no_gold.tt: ""
 gdp_visit_holding_decision_event.1320.option.money.tt: "$BULLET$@gold_icon! [gold|E]を支払う"
 gdp_visit_holding_decision_event.1320.charlatan.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$@skill_intrigue_icon! [intrigue|E]の[skill_challenge_no_prefix|E]に勝利する\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.hired_muscle.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$@skill_prowess_icon! [prowess|E]と@skill_martial_icon! [martial|E]の[skill_challenge_no_prefix|E]に勝利する\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.numerate.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$@skill_stewardship_icon! [stewardship|E]の[skill_challenge_no_prefix|E]に勝利する\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
