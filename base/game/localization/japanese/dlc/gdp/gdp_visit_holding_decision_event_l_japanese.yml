 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.b: "商会の者たちをどう養うか、見せてもらおう。"
 gdp_visit_holding_decision_event.1336.c: "料理の腕前はどちらが上か確かめよう。"
 gdp_visit_holding_decision_event.1336.c.success: "あなたは[cook.GetFirstNameNoTooltip]を感心させる"
 gdp_visit_holding_decision_event.1336.c.failure: "[cook.GetFirstName]は露店を閉めて立ち去る"
 gdp_visit_holding_decision_event.1336.d: "またの機会にしよう。"
