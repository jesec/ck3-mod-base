 spawn_merchant_contract_interaction_cooldown_tt: "このタイプの[task_contract|E]はクールダウン中である"
 gdp_visit_holding_decision_event.1310.a: "異国の生き物について、もっと話を聞きたい。"
 gdp_visit_holding_decision_event.1310.a.tt: "マップ上に[menagerie|E]の[luxury_contract_i] [luxury_contract|E]を発生させる"
 gdp_visit_holding_decision_event.1310.b: "珍品を手に入れる方法には、実に興味がある。"
 gdp_visit_holding_decision_event.1310.b.tt: "マップ上に[curio|E]の[luxury_contract_i] [luxury_contract|E]を発生させる"
 gdp_visit_holding_decision_event.1310.c: "そんな金を出すくらいなら、[ROOT.Char.GetHouse.GetNameNoTooltip]商会に投資すべきだ。"
 gdp_visit_holding_decision_event.1310.c.tt: "マップ上に[company_purpose|E]の[trade_opportunity_i] [trade_opportunity|E]を発生させる"
 gdp_visit_holding_decision_event.1310.d: "今日は別の場所を探ってみよう…"
