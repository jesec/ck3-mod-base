l_japanese:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "在庫の計算"
 gdp_trade_good_flavor.1001.desc: "寝る前に、私は[tgf_good.Custom('GetTradeGood')]の[tgf_good.Custom('GetTradeGoodUnitPlural')]をもう一度数える。312。どれもすでに売約済みだ…少なくとも、私の頭の中では。\n\nもう一度数えておこう。念のためだ。"
 gdp_trade_good_flavor.1001.a: "すべて揃っている。すべて私のものだ。"
 gdp_trade_good_flavor.1001.b: "帳簿にも同じ数字を記さなければ。"
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "噂は広まる"
 gdp_trade_good_flavor.1002.desc: "噂が耳に入った。[tgf_market_holder.GetTitledFirstName]は、自分の食卓で私の[tgf_good.Custom('GetTgfGoodLook')]を褒めちぎっていたらしい。[tgf_market_holder.GetSheHe|U]はもっと欲しがっており、その話は近所の者たちの耳にも届いている。\n\n褒められるのは嬉しい。それも、商品を買い続けてくれる[tgf_market_holder.GetWomanMan]からの称賛なら、なおさらだ。"
 gdp_trade_good_flavor.1002.a: "得意客に贈り物をしよう。"
 gdp_trade_good_flavor.1002.b: "ならば、もっと高く買ってもらおう。"
 gdp_trade_good_flavor.1002.c: "好きに噂させておけばいい。"
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "生産地からの報告"
 gdp_trade_good_flavor.1003.desc: "「ここの[tgf_source_culture.GetName]の職人たちは、[tgf_good.Custom('GetTgfGoodSmallest')]の細部に至るまで、自分たちの仕事を熟知しています」と、[tgf_source_county.GetNameNoTier]から交易担当者の[tgf_trader.GetFirstName]が手紙を寄越した。「[tgf_good.Custom('GetTradeGood')]は、[tgf_good.Custom('GetTgfGoodMade')]のです。誰も手を抜いていません」\n\n在庫を売るには、まず生産地を知ることが肝心だ。"
 gdp_trade_good_flavor.1003.a: "細かな情報もすべて金になる。"
 gdp_trade_good_flavor.1003.b: "これで適正価格がわかった。"
 gdp_trade_good_flavor.1003.c: "同じ商売人として、敬意を表する。"
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "開かれた交易路"
 gdp_trade_good_flavor.1004.desc: "交易担当者の[tgf_trader.GetFirstName]は、自分の取り分をすでに使い込んだ[tgf_trader.GetWomanMan]のように、にやりと笑う。「交易路はすっかり開けています。皆があなたの[tgf_good.Custom('GetTgfGoodLook')]を名指しで求めています」\n\n好況はあっという間に過ぎ去るもの。今のうちに、この機会を最大限に活かすべきだ。"
 gdp_trade_good_flavor.1004.a: "交易路が順調なうちに売りさばこう。"
 gdp_trade_good_flavor.1004.b: "好調な今のうちに、学べることは学んでおこう。"
 gdp_trade_good_flavor.1004.c: "荷馬車をもっと買い足そう！"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "利益の夢"
 gdp_trade_good_flavor.1005.desc: "また[tgf_good.Custom('GetTradeGood')]の夢を見た。[tgf_good.Custom('GetTradeGoodUnitPlural')|U]が天井の梁まで届くほど積み上がり、その頂上に私が座っている。下では買い手たちが、誰が先に代金を払うかを争っている。\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "また[tgf_good.Custom('GetTradeGood')]の夢を見た。市場へ続く道という道が、家畜の群れで埋め尽くされている。そして私は群れの先頭で馬を駆り、駆け寄ってくる買い手の数を数えている。\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "私は笑いながら目を覚まし、それから数字を書き留めはじめた。いつの日か、私は大金持ちになる！"
 gdp_trade_good_flavor.1005.a: "夢のままで終わらせる必要はないだろう？"
 gdp_trade_good_flavor.1005.a.tt: "まもなく新たな[trade_opportunity|E]が訪れる"
 gdp_trade_good_flavor.1005.b: "採算は合う。私が必ずそうしてみせる。"
 gdp_trade_good_flavor.1005.c: "あと5分だけ、金持ち気分を味わわせてくれ…Zz#DIE1 zz#!#DIE2 zz…#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "確認を怠る愚か者"
 gdp_trade_good_flavor.1006.desc: "交易担当者の[tgf_trader.GetFirstName]が、倉庫で私を呼び止めた。「[tgf_source_county.GetNameNoTier]産の[tgf_good.Custom('GetTradeGood')]ですが…[tgf_good.Custom('GetTgfGoodFlaw')]です。こちらが検品もしない愚か者だと思っているようです！」\n\n連中は私を騙そうとしたが、結局は値引きせざるを得なくなった。"
 gdp_trade_good_flavor.1006.a: "品質が悪ければ、値段も安くて当然だ。"
 gdp_trade_good_flavor.1006.b: "ハッ。してやったりだ。"
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "名指しで注文"
 gdp_trade_good_flavor.1007.desc: "交易担当者の[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]から奇妙な知らせを持ち帰った。「[tgf_good.Custom('GetTradeGood')|U]は[tgf_good.Custom('GetTgfGoodSold')]というのに、それでも[tgf_source_culture.GetCollectiveNoun]は、#EMP [ROOT.Char.GetHouse.GetName]の[tgf_good.Custom('GetTradeGood')]#!を名指しで注文し、相場より高い金を払ってまで手に入れようとしています！在庫がもうなくなりそうです！」\n\nどうやら、私の名前にも値打ちがあるらしい。"
 gdp_trade_good_flavor.1007.a: "すべての[tgf_good.Custom('GetTradeGoodUnit')]に私の商標を刻もう。"
 gdp_trade_good_flavor.1007.b: "売って、売って、売りまくれ！"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "[tgf_good.GetNameNoTooltip]の鑑定"
 gdp_trade_good_flavor.1008.desc: "[tgf_market_holder.GetTitledFirstNamePossessive]の封蝋が押された手紙が届いた。「1[tgf_good.Custom('GetTradeGoodUnit')]の[tgf_good.Custom('GetTradeGood')]を買わないかと勧められたのだが、私の執事には良し悪しが判断できない。そちらの交易商人の目で見定めてくれないだろうか？」\n\n私を頼ってくれるとは光栄だ。だが、鑑定にはそれなりの報酬をいただこう。"
 gdp_trade_good_flavor.1008.a: "真実を正確に見極めて伝えよう。"
 gdp_trade_good_flavor.1008.b: "素晴らしい。これほどの品は見たことがない。"
 gdp_trade_good_flavor.1008.c: "専門家の意見は、ただでは手に入らない。"
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "数え方を学ぶ"
 gdp_trade_good_flavor.1009.desc: "倉庫で跡継ぎの[tgf_heir.GetFirstName]を見つけた。1[tgf_good.Custom('GetTradeGoodUnit')]の[tgf_good.Custom('GetTradeGood')]を、まるでその底に硬貨が隠れているかのように覗き込んでいる。\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "家畜小屋で跡継ぎの[tgf_heir.GetFirstName]を見つけた。1[tgf_good.Custom('GetTradeGoodUnit')]の[tgf_good.Custom('GetTradeGood')]を、まるでその皮の下に硬貨が隠れているかのように品定めしている。\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "良い勘をしている。そろそろ鍛えてやる頃合いだ。"
 gdp_trade_good_flavor.1009.a: "さあ、私のやり方を見ていなさい。"
 gdp_trade_good_flavor.1009.b: "では、数えてみなさい。二度だ。"
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "模倣者"
 gdp_trade_good_flavor.1010.desc: "[tgf_source_county.GetNameNoTier]で、「品質がいつもの水準に達していない」として木箱が返品されてきた。私の品ではないが、誰かが私の商標を細部に至るまでそっくり模倣していた。\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "[tgf_source_county.GetNameNoTier]で、「品質がいつもの水準に達していない」として家畜が返品されてきた。私の家畜ではないが、誰かが私の焼き印を細部に至るまでそっくり模倣していた。\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "交易担当者の[tgf_trader.GetFirstName]が、偽造者の名を挙げた。[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]に属する、[tgf_rival.GetFirstName]だという。模倣の腕前はなかなかのものだ。その点は認めてやろう。"
 gdp_trade_good_flavor.1010.a: "偽造品を徹底的に排除しろ。費用はいくらかかっても構わない。"
 gdp_trade_good_flavor.1010.b: "この侮辱を他の一族にも広く知らしめよう。"
 gdp_trade_good_flavor.1010.c: "模倣品のおかげで、私の名がただで広まる。"
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U]は、[tgf_rival.GetShortUINamePossessiveNotMy]による偽造を、一族同士の問題に発展させた。"
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U]は、[target_char.GetShortUINamePossessiveNotMy]による偽造を、一族同士の問題に発展させた。"
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "[tgf_good.GetNameNoTooltip]の値段"
 gdp_trade_good_flavor.1011.desc: "[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]に雇われている商人、[tgf_envoy.GetFirstName|U]が倉庫に現れ、ずっしりと重い財布をテーブルに置いた。「我が主人[tgf_rival.GetFirstName]が、あなたの[tgf_good.Custom('GetTradeGood')]の仕入れ先を一つ残らず知りたがっています。この財布は、そのお願いのためのものです」\n\n[tgf_envoy.GetSheHe|U]が買おうとしているのは、単なる仕入れ先の情報ではない。私が何年もかけて築き上げてきた仕事そのものだ。"
 gdp_trade_good_flavor.1011.a: "名前など、ただの文字にすぎない。金さえ払えば教えてやろう。"
 gdp_trade_good_flavor.1011.b: "私の強みは売り物ではない。"
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "商人たちの休戦"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U]も私と同じく、[tgf_source_county.GetNameNoTier]で[tgf_good.Custom('GetTradeGood')]を売っている。季節が巡るたび、互いに値下げを重ね、利益を削り合ってきた。だが今日、[tgf_ally.GetHerHis]から届いた手紙には休戦の申し出が記されていた。値下げ競争をやめ、双方が十分な利益を得られるようにしようというのだ。\n\nどうやら、平和もほかの商品と同じように金で買えるらしい。"
 gdp_trade_good_flavor.1012.a: "合意しよう。互いに利益を得られる。"
 gdp_trade_good_flavor.1012.b: "[tgf_ally.GetSheHe]よりも、私の方が長く持ちこたえられる。"
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U]と[tgf_ally.GetShortUINameNotMe]は、互いに値下げ競争をやめることに合意した。"
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U]と[target_char.GetShortUINameNotMe]は、互いに値下げ競争をやめることに合意した。"
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "特別価格"
 gdp_trade_good_flavor.1013.desc: "[tgf_market_holder.GetTitledFirstName]の封蝋が押された手紙が届いた。「あなたは私の市場で[tgf_good.Custom('GetTradeGood')]を仕入れている。この市場だけで仕入れると約束するなら、これまでどの商人にも提示したことのない安値で提供しよう」\n\n独占契約は首輪をつけられるようなものだが、価格は魅力的だ。"
 gdp_trade_good_flavor.1013.a: "[tgf_market_holder.GetHerHis|U]の市場を利用すれば、こちらは割引を受けられる。話は決まりだ。"
 gdp_trade_good_flavor.1013.b: "私は誰の帳簿にも縛られはしない。"
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "古参に教えを乞う"
 gdp_trade_good_flavor.1014.desc: "白髪交じりの荷運び人が、[tgf_source_county.GetNameNoTier]の倉庫で荷を下ろした。「出過ぎたことを申し上げるようですが…あなたの[tgf_good.Custom('GetTradeGood')]の検品方法は、まるで見当違いです」[tgf_porter.GetSheHe|U]は、ここ、そしてここ、と私に指し示した。\n\n生涯をかけて[tgf_good.Custom('GetTradeGoodUnitPlural')]を運び続けてきた経験が、並の人間にはない知識を[tgf_porter.GetHerHim]に授けている。"
 gdp_trade_good_flavor.1014.desc.livestock: "白髪交じりの家畜追いが、[tgf_source_county.GetNameNoTier]の市場で群れの足を止めた。「出過ぎたことを申し上げるようですが…あなたは[tgf_good.Custom('GetTradeGood')]の見極め方を完全に間違えています」[tgf_porter.GetSheHe|U]は、ここ、そしてここ、と私に指し示した。\n\n生涯をかけて[tgf_good.Custom('GetTradeGood')]を追い立て続けてきた経験が、並の人間にはない知識を[tgf_porter.GetHerHim]に授けている。"
 gdp_trade_good_flavor.1014.a: "受け取れ。知識には、それ相応の報酬を払おう。"
 gdp_trade_good_flavor.1014.b: "興味深い。続けてくれ。"
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "初心者の過ち"
 gdp_trade_good_flavor.1015.desc: "[tgf_source_county.GetNameNoTier]のどこかで、私に[tgf_good.Custom('GetTradeGood')]を売った行商人が、私の健康を祝して酒を飲んでいることだろう。私は馬鹿げた値段を払わされたが、最後まで気付かなかった。\n\nまあいい。愚か者も学べば…愚か者ではなくなる。"
 gdp_trade_good_flavor.1015.a: "高くつこうが、教訓には変わりない。"
 gdp_trade_good_flavor.1015.b: "もういい。今夜はもう帳簿を閉じよう。"
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "商人の手引き"
 gdp_trade_good_flavor.1016.desc.intro: "[tgf_good.Custom('GetTradeGood')]を詰めた木箱の中に、湿気を防ぐよう包まれた本が一冊入っていた。 "
 gdp_trade_good_flavor.1016.desc.intro_livestock: "買い付けた[tgf_good.Custom('GetTradeGood')]に付いてきた道具の中に、湿気を防ぐよう包まれた本が一冊入っていた。 "
 gdp_trade_good_flavor.1016.desc.book_1: "『商売の手引き』"
 gdp_trade_good_flavor.1016.desc.book_2: "『街道と市場の書』"
 gdp_trade_good_flavor.1016.desc.book_3: "『交易商人の鑑』"
 gdp_trade_good_flavor.1016.desc.outro: " ——どこかの交易商人が寝る間も惜しんで記したのだろう。度量衡に街道、相場までが詳しく書き込まれている。\n\n誰かが宝を失ったようだ。ありがたく使わせてもらおう。"
 gdp_trade_good_flavor.1016.a: "背表紙が壊れるまで読み込もう。"
 gdp_trade_good_flavor.1016.b: "珍しい本には、それ以上に稀な高値がつく。"
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "手触りを知る"
 gdp_trade_good_flavor.1017.desc: "[tgf_source_county.GetNameNoTier]で、[tgf_seller.GetCulture.GetCollectiveNoun]の一人である売り手が、1[tgf_good.Custom('GetTradeGoodUnit')]の[tgf_good.Custom('GetTradeGood')]を差し出し、3倍に相当する値段をつけてきた。「この商売は初めてだろう？なら、実際に触れて確かめるための勉強代を払ってもらおう」\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "[tgf_source_county.GetNameNoTier]で、[tgf_seller.GetCulture.GetCollectiveNoun]の一人である売り手が、1[tgf_good.Custom('GetTradeGoodUnit')]の[tgf_good.Custom('GetTradeGood')]を私の前で見せびらかし、3倍に相当する値段をつけてきた。「この商売は初めてだろう？なら、実際に触れて確かめるための勉強代を払ってもらおう」\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "言っていることは正しいが、無礼だ。"
 gdp_trade_good_flavor.1017.a: "金を払う。教えてくれ。"
 gdp_trade_good_flavor.1017.b: "絶対にお断りだ。"
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "間違った度量衡"
 gdp_trade_good_flavor.1018.desc: "交易担当者の[tgf_trader.GetFirstName]が、我々が[tgf_good.Custom('GetTradeGood')]を[ROOT.Char.GetCulture.GetName]の度量衡で売っていることに気づいた。買い手が想定している[tgf_source_culture.GetName]の度量衡より、わずかに小さいものだ。売った[tgf_good.Custom('GetTradeGoodUnit')]はすべて、規定より少ない量になっていた。\n\n悪意のない間違いだが、このままにするかどうかは、私次第だ。"
 gdp_trade_good_flavor.1018.a: "度量衡を正せ。すべてだ。"
 gdp_trade_good_flavor.1018.b: "差額は私の懐に入れておこう。"
 gdp_trade_good_flavor.1018.c: "買い手の基準で量り、それを大々的に宣伝しろ。"
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "2つの商品、1人の買い手"
 gdp_trade_good_flavor.1019.desc: "[tgf_market_holder.GetTitledFirstName]から手紙が届いた。「[tgf_good.Custom('GetTradeGood')]を送ってほしい。それに、[tgf_good_b.Custom('GetTradeGood')]も一緒に頼む。片方だけでは意味がない」\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "[tgf_market_holder.GetTitledFirstName]から手紙が届いた。「[tgf_good.Custom('GetTradeGood')]を送ってほしい。それに、[tgf_good_b.Custom('GetTradeGood')]もまとめて届けてくれ」\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "2つの商品、1人の買い手、1つの値段。私好みの計算だ。"
 gdp_trade_good_flavor.1019.a: "一組にして売り、一組あたりの価格をつけよう。"
 gdp_trade_good_flavor.1019.b: "別々に売ろう。金は早く手に入る方がいい。"
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "建設業者向け価格"
 gdp_trade_good_flavor.1020.desc: "[tgf_build_county.GetNameNoTier]では、あちこちに足場が組まれている。[tgf_market_holder.GetTitledFirstName]が建設を進めており、工事現場に向かう荷車はどれも私の[tgf_good.Custom('GetTradeGood')]を積んでいる。[tgf_market_holder.GetSheHe|U]は手紙を寄こし、建設業者向けの特別価格を求めてきた。壁が完成するまで、同じ[tgf_good.Custom('GetTradeGood')]を少し安く売ってほしいという。\n\n[tgf_market_holder.GetSheHe]が築く壁は、どれもすでに半分は私のものも同然だ。"
 gdp_trade_good_flavor.1020.a: "建設業者向け価格でいいだろう。"
 gdp_trade_good_flavor.1020.b: "値引きには応じよう。だが、ただでは渡さない。"
 gdp_trade_good_flavor.1020.c: "これは貸しにしておこう。"
 gdp_trade_good_flavor.1020.d: "一番いい品は手元に残しておこう。"
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "商品を知り尽くす"
 gdp_trade_good_flavor.1021.desc: "どんな商売にも達人はいる。そして達人は#EMP 学び続ける#!ものだ。今夜はランプを灯し、私が所有する最高級の[tgf_good.Custom('GetTradeGood')]を、ランプの油が尽きかけるまでじっくりと調べよう。\n\n私の品が売れ、ほかの者の品が売れない理由が見つかるはずだ。"
 gdp_trade_good_flavor.1021.desc.livestock: "どんな商売にも達人はいる。そして達人は学び続けるものだ。今夜はランタンを手に、私が所有する最高の[tgf_good.Custom('GetTradeGood')]を、歯から尻尾までくまなく調べよう。\n\n私の家畜が売れ、ほかの者の家畜が売れない理由が見つかるはずだ。"
 gdp_trade_good_flavor.1021.desc.books: "どんな商売にも達人はいる。そして達人は#EMP 学び続ける#!ものだ。今夜はランプを灯し、私が所有する最高の本を、ランプの油が尽きかけるまでじっくりと調べよう。\n\n私の本が売れ、ほかの者の本が売れない理由が見つかるはずだ。"
 gdp_trade_good_flavor.1021.a: "これは手元に残しておこう。ほかの品はすべて、これを基準に良し悪しを判断する。"
 gdp_trade_good_flavor.1021.b: "学ぶべきことは、まだまだ尽きない。"
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "商売で得た異名"
 gdp_trade_good_flavor.1022.desc: "[tgf_source_county.GetNameNoTier]では、もはや私の名前を呼ぶ者はいない。皆が口にする名は「[tgf_good.Custom('GetTgfGoodNickname')]」…誰のことかは誰もがわかっている。#bold 私だ。#!\n\n称号は主君から授けられる。だが、こうした呼び名は市場が与えるもの。そして市場での評判は、自ら勝ち取るものだ。"
 gdp_trade_good_flavor.1022.a: "下品だ。効果はあるが、下品だ。"
 gdp_trade_good_flavor.1022.b: "好きに呼ばせておけ。その名は商売に役立つ。"
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "供給が追いつかない"
 gdp_trade_good_flavor.1023.desc: "「あなたはこちらで生産するより早く買い付けていきますからね」と、[tgf_source_county.GetNameNoTier]の職長である[tgf_foreman.GetFirstName]が言う。私は[tgf_good.Custom('GetTradeGood')]が生産される様子を見ている。[tgf_good.Custom('GetTradeGood')]は、[tgf_good.Custom('GetTgfGoodMade')]のだ。「働き手にも限りがあります」\n\n人手を増やせば金がかかる。買い手を追い返す方が、大きな損になる。"
 gdp_trade_good_flavor.1023.a: "もっと人を雇え。金は私が出す。"
 gdp_trade_good_flavor.1023.b: "それなら、私のところで働かないか。"
 gdp_trade_good_flavor.1023.c: "ならば、どうやるのか私に見せてくれ。"
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "競売の壇上"
 gdp_trade_good_flavor.1024.desc: "「[tgf_good.Custom('GetTradeGood')]、40[tgf_good.Custom('GetTradeGoodUnitPlural')]を、最高値を付けた方へ！」[tgf_source_county.GetNameNoTier]の[tgf_source_province.Custom('GetRegionalMarketTerm')]で、[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]を営む[tgf_rival.GetFirstName]が、競売人が言い終わるより先に手を上げた。\n\n[tgf_rival.GetSheHe|U]が私を見て微笑む。この競売品はもう自分のものだと思っているらしい…"
 gdp_trade_good_flavor.1024.a: "[tgf_rival.GetSheHe]がいくら出そうと、それ以上出してやる。"
 gdp_trade_good_flavor.1024.b: "もっと上げろ、もっと、もっとだ…これで全部お前のものだ、[tgf_rival.GetFirstNameNoTooltip]！"
 gdp_trade_good_flavor.1024.c: "好きなだけ競えばいい。誰が勝つか見物しよう。"
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "波止場の一番乗り"
 gdp_trade_good_flavor.1025.desc: "「波止場には船が20隻、クレーンは1台だけです」と、[tgf_source_county.GetNameNoTier]の荷運び人たちを取り仕切る[tgf_docks_boss.GetFirstName]が言う。「[tgf_good.Custom('GetTradeGood')]を最初に荷揚げした者が、その季節の値を決める。あなたの貨物を一番に荷揚げできますよ」\n\n[tgf_docks_boss.GetSheHe|U]が手のひらを上に向け差し出した。"
 gdp_trade_good_flavor.1025.a: "真っ先に荷を降ろして、真っ先に値を付けよう。"
 gdp_trade_good_flavor.1025.b: "それなら、甲板の上から直に売ってしまおう。"
 gdp_trade_good_flavor.1025.c: "他の誰かを先に荷揚げさせて、いくらの値を付けるか見ていよう。"
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "一握りずつ"
 gdp_trade_good_flavor.1026.desc: "「貧しい者は[tgf_good.Custom('GetTgfGoodSmallest')]ずつ買うものだ」と、[tgf_source_county.GetNameNoTier]の市場で露店を営む[tgf_stallholder.GetFirstName]は言う。[tgf_stallholder.GetSheHe|U]は私の[tgf_good.Custom('GetTradeGood')]を100個もの小さな包みに分け、それぞれを本来の価値より少し高い値段で売っている。\n\n「供給を切らさなければ、こちらもきちんと支払いますよ」"
 gdp_trade_good_flavor.1026.a: "必要になったら新たに1[tgf_good.Custom('GetTradeGoodUnit')]届けよう。取引成立だ。"
 gdp_trade_good_flavor.1026.b: "人々が払える値で売ろう。"
 gdp_trade_good_flavor.1026.c: "今すぐ全部引買い取れ。現金払いだ。"
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "市の日"
 gdp_trade_good_flavor.1027.desc: "「[tgf_good.Custom('GetTradeGood')|U]！[tgf_good.Custom('GetTgfGoodLook')|U]だよ！[tgf_good.Custom('GetTradeGood')]が欲しい人はいないか？」[tgf_source_county.GetNameNoTier]は市の日で、私の呼び売りの声もかき消されそうだ。伯爵領中の買い手が全員、金を手にこの一か所に集まっている。\n\nあとは、その金を#EMP 私の店で#!使ってもらうだけだ！"
 gdp_trade_good_flavor.1027.a: "最高の売り文句が必要だ。いくらかかっても構わない。"
 gdp_trade_good_flavor.1027.b: "露店は出さない。自分で人々に声をかけて回ろう。"
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "異国の貨幣"
 gdp_trade_good_flavor.1028.desc: "[tgf_source_county.GetNameNoTier]の買い手である[tgf_buyer.GetFirstName]が私の[tgf_good.Custom('GetTradeGood')]を求め、支払いを[tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]で済ませようとする。「金は金だ」というのが[tgf_buyer.GetSheHe]の言い分だ。\n\n確かに、金は金だ。私が同意し、[tgf_buyer.GetHerHis]の金が私にとっていくらの価値になるかを伝えると、[tgf_buyer.GetSheHe|U]の顔から笑顔が消えた。"
 gdp_trade_good_flavor.1028.a: "いいだろう。銀は銀だ。"
 gdp_trade_good_flavor.1028.b: "私の言い値で払え。さもなければ取引はなしだ。"
 gdp_trade_good_flavor.1028.c: "代わりに[tgf_good_b.Custom('GetTradeGood')]で支払え。"
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "道を行き続けて"
 gdp_trade_good_flavor.1029.desc: "「この交易路であなたの[tgf_good.Custom('GetTradeGood')]を運び続けて3年になります」と、交易担当者[tgf_trader.GetFirstName]が杯を掲げて言う。「私がこの交易路を任されてから、商品を失ったことは一度もありません！」\n\n[tgf_trader.GetSheHe|U]は実際は商品を5つ失っている。だが今夜は目をつぶってやろう。"
 gdp_trade_good_flavor.1029.a: "よくやった！"
 gdp_trade_good_flavor.1029.b: "次の3年に乾杯しよう。"
 gdp_trade_good_flavor.1029.c: "次はもっと遠く、ずっと遠くへ運んでもらおう。"
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "売れていくのを眺めて"
 gdp_trade_good_flavor.1030.desc: "「これは本物の[ROOT.Char.GetHouse.GetName]の[tgf_good.Custom('GetTradeGood')]ですね」と、[tgf_source_county.GetNameNoTier]の市場で買い手が、私の商品を指差して言う。「[tgf_good.Custom('GetTgfGoodLook')|U]ですな！」\n\n[tgf_buyer.GetSheHe|U]は背後に[ROOT.Char.GetHouse.GetName]家の者が立っていることにまったく気付いていない。\n\n何か言ってやってもいいが、このまま楽しんでいるのも悪くない。"
 gdp_trade_good_flavor.1030.a: "何も言わない。何を求めているのか聞いていよう。"
 gdp_trade_good_flavor.1030.b: "その通りだ。私が一番よく知っている。"
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "外からの出資"
 gdp_trade_good_flavor.1031.desc: "[tgf_source_county.GetNameNoTier]の[tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')]である[tgf_investor_a.GetFirstName]と[tgf_investor_b.GetFirstName]は、何年もの間、私の[tgf_good.Custom('GetTradeGood')]を買ってきた。そして今度は、分け前が欲しいらしい。\n\n「あなたの商売に出資する」と[tgf_investor_a.GetFirstNameNoTooltip]が言い、[tgf_investor_b.GetFirstNameNoTooltip]が金を数えていく。「きちんと払いますし、余計なことも聞きません」\n\nそのうち余計なことを聞くようになる。投資家とは、そういうものだ。"
 gdp_trade_good_flavor.1031.a: "そちらの金で私が稼ぐ。そして稼ぎの一部を分けてやろう。"
 gdp_trade_good_flavor.1031.b: "この商売は一族だけで続ける。"
 gdp_tgf_kept_in_family_unity_desc: "商売を一族だけで続けた"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "展示室"
 gdp_trade_good_flavor.1032.desc: "「あれは[tgf_good.Custom('GetTradeGood')]か？」訪れた客が皆、広間で足を止めて尋ねる。それは私が所有する中でも最高の品で、[tgf_good.Custom('GetTgfGoodLook')]である。誰の目にも入るように並べてある。\n\n私の家に来た者は皆、必ず私が何を売っているのかを知ることになる。"
 gdp_trade_good_flavor.1032.desc.livestock: "「あれは[tgf_good.Custom('GetTradeGood')]か？」訪れた客は皆、広間で慎重にそれを避けながら尋ねる。そう、[tgf_good.Custom('GetTradeGood')]だ。私が所有する中でも最高の品で、[tgf_good.Custom('GetTgfGoodLook')]である。誰の目にも入るよう、小屋に繋いである。\n\n私の家に来た者は皆、必ず私が何を売っているのかを知ることになる。そして帰り際には、靴の裏が汚れていないか確かめる。"
 gdp_trade_good_flavor.1032.a: "好きなだけ見させておけ。噂は広まる。"
 gdp_trade_good_flavor.1032.b: "持っていくといい。私からの贈り物だ。"
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "腕を鈍らせない"
 gdp_trade_good_flavor.1033.desc: "[tgf_good.Custom('GetTradeGood')]の古い仕入れ先から手紙が届いた。「今年の[tgf_good.Custom('GetTradeGood')]の中でも最高の品を、以前の値段であなたのために取ってあります。また買っていただけませんか？」と書いてある。\n\n私はその商売から手を引いた。だが、[tgf_good.Custom('GetTradeGood')]を見極める目はまだ衰えていない。私ほどの目利きの目は、使い続けてこそ金になる。"
 gdp_trade_good_flavor.1033.a: "返事を書こう。目を鈍らせないために。"
 gdp_trade_good_flavor.1033.b: "私の知識は金になる。だが値段次第だ。"
 gdp_trade_good_flavor.1033.c: "やめておこう。今は新しい商売がある。"
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "旅行案内書"
 gdp_trade_good_flavor.1034.desc: "[tgf_source_county.GetNameNoTier]に宿を取っている巡礼者、[tgf_pilgrim.GetFirstName]が、くたびれた小さな本を指で叩く。「ここから海までの道、宿、渡し場がすべてここに記されています。それに余白には、[tgf_good.Custom('GetTradeGood')]を高値で買ってくれる市場まで書いてある。お代さえいただければ、差し上げますよ」\n\nこの本は、私のどの荷車よりも遠くまで旅している。"
 gdp_trade_good_flavor.1034.a: "巡礼者よ、値段を言ってくれ。"
 gdp_trade_good_flavor.1034.b: "今夜写して、朝までに返そう。"
 gdp_trade_good_flavor.1034.c: "市場で何を見たのか、それだけ教えてくれ。"
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "商売の話"
 gdp_trade_good_flavor.1035.desc: "「それで、あなたは何を扱っているんですか？」夕食後の散歩中、客人の[tgf_guest.GetFirstName]が尋ねてきた。しまった。[tgf_good.Custom('GetTgfGoodMade')][tgf_good.Custom('GetTradeGood')]を、私がどのように仕入れているのか——説明し終えるころには、市場を2周してしまっていた。\n\n[tgf_guest.GetSheHe|U]は一度も話題を変えようとしなかった。どうやら買い手になってくれそうだ。"
 gdp_trade_good_flavor.1035.a: "デザートを食べながら条件を話し合いましょうか？"
 gdp_trade_good_flavor.1035.b: "私の話はもういい。そちらはどこで仕入れを？"
 gdp_trade_good_flavor.1035.c: "私がこれで最初の財を築いた話をしよう。"
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "荷造り場"
 gdp_trade_good_flavor.1036.desc: "「荷車1台につき、積み込む商品を3割増しにできます」と、交易担当者の[tgf_trader.GetFirstName]はやり方を見せながら言う。「道中でいくつかは破損して、買い手から文句が出るでしょう。ですが、大半は大丈夫です」\n\n大半という言葉は気に入った。いくつかなら許容できる。"
 gdp_trade_good_flavor.1036.a: "ぎっちり詰めろ。隙間にも利益を詰め込め。"
 gdp_trade_good_flavor.1036.b: "きちんと詰めろ。買い手は最初に開けた一つで品を判断する。"
 gdp_trade_good_flavor.1036.c: "そのままでいい。これでうまくいっている。"
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "市場の検印"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "品物の品質と計量が正確かを確認し、合格した品に鉛や蝋の検印を付ける市場の役人。多くの町では、検印がない布などの商品を売ることを禁じており、検印係は一つ検印するごとに手数料を取った。"
 gdp_trade_good_flavor.1037.desc: "「検印された品は高く売れる。誰でも知っていることだ」と、[tgf_source_county.GetNameNoTier]市場の[Glossary( '検印係', 'TGF_SEALER_GLOSS' )]、[tgf_sealer.GetFirstName]が作業台から顔も上げずに言った。「そして、私が検印する順番は頼まれた順ではなく、金を払った順だ」\n\n私の[tgf_good.Custom('GetTradeGood')]を積んだ荷車が日なたで待っている。私の利益も同じだ。"
 gdp_trade_good_flavor.1037.a: "ならば待とう。検印されればそれでいい。"
 gdp_trade_good_flavor.1037.b: "受け取れ。今すぐ検印しろ。"
 gdp_trade_good_flavor.1037.c: "私の名が十分な検印の証になる。"
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "仲介人"
 gdp_trade_good_flavor.1038.desc: "「私にはあなたの知らない町にだって、買い手の伝手があるんですよ」と、[tgf_source_county.GetNameNoTier]市場の仲介人[tgf_broker.GetFirstName]が、頼んでもいないのに、私の杯を満たしながら言った。「あなたの[tgf_good.Custom('GetTradeGood')]を客に売る。あなたには代金が、私には仲介料が入る」\n\n売り手と買い手、そして仲介人。うまい思いをするのは一人だけというわけだ。"
 gdp_trade_good_flavor.1038.a: "買い手を見つけてくれ。手数料は払う。"
 gdp_trade_good_flavor.1038.b: "ありがたい申し出だが、買い手は自分で探す。"
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "交易担当者の弟子"
 gdp_trade_good_flavor.1039.desc: "「こいつは私より計算が速いんです」と、交易担当者の[tgf_trader.GetFirstName]が、[tgf_youth.GetFirstName]という痩せた若者を前に押し出して言った。[tgf_youth.GetFirstNameNoTooltip]は私が尋ねるより先に、仕入れ先と売り先、双方の市場での[tgf_good.Custom('GetTradeGood')]の値段を言い当てた。\n\n賢い子供を養うには金がかかる。だが、賢くて働く子供なら、かけた金を稼いで返してくれる。"
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip]は私のところに置こう。"
 gdp_trade_good_flavor.1039.b: "その若者は任せる、[tgf_trader.GetFirstNameNoTooltip]。しっかり教えてやれ。"
 gdp_trade_good_flavor.1039.c: "養わねばならない人間はもう十分いる。"
 gdp_tgf_family_only_unity_desc: "商会を一族だけで維持した"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "ひと泳ぎ"
 gdp_trade_good_flavor.1040.desc: "夜も更け、倉庫には私一人しかいない。[tgf_good.Custom('GetTgfGoodLook')]が私の頭より高く積み上げられている。最初の一握りを指の間から、[tgf_good.Custom('GetTgfGoodSmallest')]ずつ落としてみる。\n\nあることを思いついてしまった。もし…#EMPこの中で泳いだらどうなる？#!"
 gdp_trade_good_flavor.1040.a: "飛び込め。アヒルのように楽しく泳ごう！"
 gdp_trade_good_flavor.1040.a.toast: "激しい着地"
 gdp_trade_good_flavor.1040.b: "いや。数えろ。[tgf_good.Custom('GetTgfGoodSmallest')]ずつだ。"
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "最初の売り物"
 gdp_trade_good_flavor.1041.desc: "古い箱を片付けていると、布に包まれた何かが出てきた。私が初めて売った[tgf_good.Custom('GetTradeGood')]の[tgf_good.Custom('GetTgfGoodSmallest')]だ。何年も前に、倍の値段で買い戻したものだ。\n\n誰も見ていないのをいいことに、私はそれを光にかざして、ここまでの道のりを語りかけた。私が稼いだ金はすべて、この[tgf_good.Custom('GetTgfGoodSmallest')]から生まれた子供たちだ。"
 gdp_trade_good_flavor.1041.a: "額に入れて、見えるところに飾ろう。"
 gdp_trade_good_flavor.1041.b: "成功の証だ。これにも金を出す奴がいるだろう。"
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "枕の下の金"
 gdp_trade_good_flavor.1042.desc: "「おやすみ、金貨たち」と、枕の下の財布——この季節、私の[tgf_good.Custom('GetTradeGood')]がもたらしたものすべて——に挨拶するのは、今や毎晩の日課になっている。\n\nこれまででで一番硬い枕だ。そして、財宝と呼べる唯一の枕でもある。"
 gdp_trade_good_flavor.1042.a: "金を枕にして眠ろう。ありったけの金をだ。"
 gdp_trade_good_flavor.1042.b: "枕の下に置いても何にもならない。これでもっと[tgf_good.Custom('GetTradeGood')]を仕入れよう。"
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "金貨とともに描かれる肖像"
 gdp_trade_good_flavor.1043.desc: "「机に向かい、片側には[tgf_good.Custom('GetTradeGood')]、もう片側には金貨を置いてください」と、[tgf_painter.GetFirstName]が言った。[tgf_source_county.GetNameNoTier]を通りかかったこの画家は、私を囲むように両手の指で額縁を作っている。「金貨は一枚残らず描き、枚数も正確に[Glossary( '数えておきましょう', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )]」\n\n金の計算ができる[tgf_painter.GetWomanMan]は好きだ。"
 gdp_trade_good_flavor.1043.a: "金貨を一枚残らず描け。"
 gdp_trade_good_flavor.1043.b: "金貨を描け…#EMP 大きく#!だ。"
 gdp_trade_good_flavor.1043.c: "画家など客にもならない。"
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "交易商人や両替商は、仕事中の自分の姿を、金貨や秤とともに描かせることを好んだ。ペトルス・クリストゥスは1449年、婚約した男女のために指輪の重さを量る金細工師を描いている。"
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "重すぎる財布"
 gdp_trade_good_flavor.1044.desc: "「従者をもう一人呼んでまいりましょうか、[ROOT.Char.Custom('FormOfAddressForLiege')]？」と[tgf_servant.GetFirstName]が尋ねる。今季の[tgf_good.Custom('GetTradeGood')]で得た金貨がたっぷり詰まった私の財布は、後ろについて運んでくれる専属の従者が必要なほど重くなっていた。\n\n荷車を用意すべきだろうか。"
 gdp_trade_good_flavor.1044.a: "従者が2人必要だ。ゆっくり歩かせよう。"
 gdp_trade_good_flavor.1044.b: "いや、荷車でいい。私の名前を記した荷車だ！"
 gdp_trade_good_flavor.1044.c: "[tgf_servant.GetFirstNameNoTooltip]よ、まずは[tgf_good.Custom('GetTradeGood')]市場を通り抜けよう。"
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "利益と信心"
 gdp_trade_good_flavor.1045.desc: "私の帳簿は[Glossary( '伝統的な様式', 'TGF_DATINI_GLOSS' )]で、「神と利益の名のもとに」という言葉から始まる。今年、利益は帳簿の40ページを埋め尽くしたが、硬貨一枚たりとも[ROOT.Char.GetFaith.HighGodName]には捧げていない。\n\n商人なら誰でも、相棒には分け前を渡すものだと知っている。"
 gdp_trade_good_flavor.1045.a: "天上の相棒にも、正当な取り分を。"
 gdp_trade_good_flavor.1045.b: "[ROOT.Char.GetFaith.HighGodName]と静かなひとときを過ごそう。それから帳簿に戻る。"
 gdp_trade_good_flavor.1045.c: "[ROOT.Char.GetFaith.HighGodName]が私に商才を授けてくださったのだ。無下にすれば失礼にあたる。"
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "トーラー、聖書、そしてクルアーンで語られるヨセフの物語では、エジプトの支配者が、7頭の肥えた牛が7頭の痩せた牛に食べられる夢を見る。ヨセフはこれを7年間の豊作と7年間の飢饉の予兆と解釈し、エジプトは飢饉に備えて穀物庫を満たした。"
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "プラートの商人フランチェスコ・ダティーニは、帳簿の冒頭に「神と利益の名のもとに」と記し、トスカーナでも有数の大富豪として生涯を終えた。"
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "同郷の者"
 gdp_trade_good_flavor.1046.desc: "「[tgf_source_county.GetNameNoTier]の半分は、私と同じ[tgf_source_culture.GetCollectiveNoun]です」と、交易担当者の[tgf_trader.GetFirstName]が言う。「あなたには閉ざされている扉も、私には開きます。あなたのような[ROOT.Char.GetCulture.GetCollectiveNoun]には値引きしない人間も、私には安く売ってくれるのです」\n\n[tgf_trader.GetFirstNameNoTooltip]に悪気はない。私は値段の話だけを聞くことにした。"
 gdp_trade_good_flavor.1046.a: "今後は君が話を進めろ。"
 gdp_trade_good_flavor.1046.b: "受け取れ。誰にも引き抜かれるなよ。"
 gdp_trade_good_flavor.1046.c: "ならば、私も彼らのやり方を学ぼう。"
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "商品であふれる市場"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]の[tgf_rival.GetFirstName]が、[tgf_source_county.GetNameNoTier]で[tgf_good.Custom('GetTradeGood')]を売っている。それも運搬費よりも安い値段でだ。交易担当者の[tgf_trader.GetFirstName]は激怒している。\n\n私は興味をそそられた。そこまで安いなら、誰かが買って然るべきだろう。できれば私が。"
 gdp_trade_good_flavor.1047.a: "[tgf_rival.GetFirstNameNoTooltip]が投げ売りしたいなら、私が買ってやろう。"
 gdp_trade_good_flavor.1047.b: "[tgf_rival.GetFirstNameNoTooltip]には好きに安売りさせておけ。私の[tgf_good.Custom('GetTradeGood')]は今のままで売れる。"
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "梱包材にされた写本"
 gdp_trade_good_flavor.1048.desc: "[tgf_source_county.GetNameNoTier]の誰かが、最後の[tgf_good.Custom('GetTradeGood')]を、濡れないよう古い紙で包んでいた。交易担当者の[tgf_trader.GetFirstName]が、その紙を丁寧に広げる。「これは[Glossary( '本', 'TGF_HOUSE_OF_WISDOM_GLOSS' )]ですね。ほとんど一冊分あります。持ち主はさぞ惜しむことになるでしょう」\n\n私は[tgf_good.Custom('GetTradeGood')]の代金を払った。本はおまけだが、こちらの方が価値があるかもしれない。"
 gdp_trade_good_flavor.1048.a: "私が持っておこう。"
 gdp_trade_good_flavor.1048.b: "[tgf_good.Custom('GetTradeGood')]と一緒に売ろう。"
 gdp_trade_good_flavor.1048.c: "[tgf_source_county.GetNameNoTierNoTooltip]に送り返してやろう。"
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "書物は商人たちが運ぶ交易品に紛れて、国境を越えていった。バグダッドの知恵の館では、学者たちがギリシャ、ペルシア、インドの書物をアラビア語に翻訳し、その多くがそこからラテン語圏へと伝わった。"
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "故郷から来た商人たち"
 gdp_trade_good_flavor.1049.desc: "交易担当者の[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]から手紙を寄越した。「ここには、故郷を遠く離れ、故郷を恋しがっている[ROOT.Char.GetCulture.GetCollectiveNoun]の[Glossary( '居住区', 'TGF_DIASPORA_GLOSS' )]があります。故郷では誰もが[ROOT.Char.GetHouse.GetBaseNameNoTooltip]の名を知っています。こちらでその名を言うと、皆が集まってくるのです」\n\nどうやら、望郷の念も市場になるらしい。"
 gdp_trade_good_flavor.1049.a: "故郷と同じ値で売ろう。"
 gdp_trade_good_flavor.1049.b: "彼らの最年長者を商会に迎え入れよう。"
 gdp_trade_good_flavor.1049.c: "故郷の味には、金を払う価値がある。"
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "海外に定住した交易商人たちは、自分たちの居住区を築いた。シルクロード沿いのソグド人、コンスタンティノープルのヴェネツィア人、カイロからアデンにかけてのユダヤ人商人などがその例である。故郷にいる同胞たちは、彼らを通して交易を行った。"
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "[tgf_good.GetNameNoTooltip]街道"
 gdp_trade_good_flavor.1050.desc: "[tgf_source_county.GetNameNoTier]出身の[Glossary( '密輸人', 'TGF_SMUGGLER_GLOSS' )]、[tgf_smuggler.GetFirstName]を紹介された。その手口は、荷車の一番上に粗悪品——[tgf_good.Custom('GetTgfGoodFlaw')]を積むことだった。[tgf_market_holder.GetTitledFirstNamePossessive]の徴税官は、それより下を調べようとしない。\n\n「市場価格の半額で売りますよ」と[tgf_smuggler.GetFirstNameNoTooltip]が言う。「一番上の商品を除けば、あとは完璧です」"
 gdp_trade_good_flavor.1050.a: "半額は大好きだ。"
 gdp_trade_good_flavor.1050.a.toast: "密輸が露見する"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip]は感謝するだろう。お前の首を差し出せばな。"
 gdp_trade_good_flavor.1050.c: "徴税官を欺くだと？お前を採用しよう。"
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "交易品に税を課す地域では、密輸商人たちもまた、徴税を逃れる術を心得ていた。塩は各地で広く課税されており、その密輸は莫大な富をもたらした。唐代中国では、塩の密輸商人だった黄巣が反乱を率い、唐の都・長安を攻略した。"
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "大豊作"
 gdp_trade_good_flavor.2001.desc: "[tgf_good.Custom('GetTradeGood')]を仕入れている[tgf_source_county.GetNameNoTier]から知らせが届いた。[tgf_source_culture.GetName]の農民たちが、一世代に一度あるかないかという大収穫を迎え、穀物庫に収まりきらないほどの作物を収穫したという。\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "[tgf_good.Custom('GetTradeGood')]を仕入れている[tgf_source_county.GetNameNoTier]から知らせが届いた。[tgf_source_culture.GetName]の牧畜民たちは、一世代に一度あるかないかというほどの豊かな年を迎えたという。囲いはどこも家畜でいっぱいで、餌にする草も足りないようだ。\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "彼らには恵みの年。私には仕入れの好機だ。"
 gdp_trade_good_flavor.2001.a: "彼らが祝っている間に、価格を固定しろ。"
 gdp_trade_good_flavor.2001.b: "現地へ赴き、栽培方法を学ぼう。"
 gdp_trade_good_flavor.2001.b.livestock: "現地へ赴き、繁殖方法を学ぼう。"
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "狩人の大収穫"
 gdp_trade_good_flavor.2002.desc: "「[tgf_source_county.GetNameNoTier]の[tgf_good.Custom('GetTgfGoodGatherers')]は、実に見事な仕事をしました」と、交易担当者の[tgf_trader.GetFirstName]が言う。「[tgf_good.Custom('GetTradeGood')]が一季分まとめて一度に届きました。これまでに送られてきた中でも最高の品です。もうすでに買い手から声がかかっています」\n\nすべて売り払うか、それとも一番上等な品は手元に残すか？ 商人にとっては悩ましい選択だ。"
 gdp_trade_good_flavor.2002.a: "高値が付いているうちに、すべて売ろう。"
 gdp_trade_good_flavor.2002.b: "一番上等な品は取っておこう。"
 gdp_trade_good_flavor.2002.c: "市場を埋め尽くしてやろう。誰にでも行き渡るようにだ。"
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "豊かな鉱脈"
 gdp_trade_good_flavor.2003.desc: "交易担当者の[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]からの街道を、満面の笑みを浮かべて戻ってきた。「新しい鉱脈です。埋蔵量は豊富で、浅い所にあり、伯爵領中の鉱夫たちが列をなして働きにきています。今なら[tgf_good.Custom('GetTradeGood')]が安く手に入ります。この鉱脈に出資すれば、さらに安くなりますよ」\n\n鉱脈が見つかっても、そこから採れる資源がいつまでも安く手に入ることはあり得ない。"
 gdp_trade_good_flavor.2003.desc.amber: "交易担当者の[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]からの街道を、満面の笑みを浮かべて戻ってきた。「秋の嵐のおかげで、誰も記憶にないほど大量の[tgf_good.Custom('GetTradeGood')]が浜に打ち上げられました。海岸ではどの家も総出で拾い集めています。今なら[tgf_good.Custom('GetTradeGood')]が安く手に入ります。#EMP 我々#!が拾い手に報酬を払えば、さらに安くなりますよ」\n\n海がいつまでもこれほどの恵みをもたらすことはあり得ない。"
 gdp_trade_good_flavor.2003.a: "採掘に出資する。"
 gdp_trade_good_flavor.2003.a.amber: "拾い手に報酬を支払う。"
 gdp_trade_good_flavor.2003.b: "荷車に満載されているうちに買い付ける。"
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "秘伝に見合う価値"
 gdp_trade_good_flavor.2004.desc: "「新しい色です！」交易担当者の[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]から遠路はるばる見本を持ち帰った。染色工房によれば、この秘伝を知る者は他にいないという。\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "「新しい釉薬です！」交易担当者の[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]から遠路はるばる見本を持ち帰った。工房によれば、この秘伝を知る者は他にいないという。\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "秘伝とは値が張るものだ。もし独占できるなら、それだけの価値はある。"
 gdp_trade_good_flavor.2004.a: "言い値を払おう。その秘伝は私のものだ。"
 gdp_trade_good_flavor.2004.b: "称賛するに留めて、仕事に戻れ。"
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "商品の味見"
 gdp_trade_good_flavor.2005.desc: "商人は商品を知っておかねばならない。だから私は、自分の商品である[tgf_good.Custom('GetTradeGood')]を味見する。一回目は義務のため、二回目は確認のため、そしてそこから先は純粋に楽しみのためだ。夕方までに[tgf_good.Custom('GetTradeGoodUnit')]が丸ごと消えてしまった。\n\n美味だ。[tgf_source_culture.GetCollectiveNoun]なら、これに倍の金を払うだろう。"
 gdp_trade_good_flavor.2005.a: "倍額だ。連中なら倍額でも払うだろう。"
 gdp_trade_good_flavor.2005.b: "うむ。品質をじっくり調べないとな。もう一口。"
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "ふさわしく装う"
 gdp_trade_good_flavor.2006.desc: "[tgf_good.Custom('GetTradeGood')]を売りたいなら[tgf_good.Custom('GetTradeGood')]を着るべきだ。私は自分の在庫の中でも最高級の品を身に着けて市場に行き、客たちが二度見するのを眺める。\n\n商品がその価値を語る。私はただそれを纏うだけだ。"
 gdp_trade_good_flavor.2006.a: "ぴったりだ。脱ぐ気になれない。"
 gdp_trade_good_flavor.2006.a.tt_furs: "今後は毛皮の外套を着用する"
 gdp_trade_good_flavor.2006.a.tt_leather: "今後は革の外套を着用する"
 gdp_trade_good_flavor.2006.a.tt_silk: "今後は絹のマントを着用する"
 gdp_trade_good_flavor.2006.a.tt_textiles: "今後は上等な外套を着用する"
 gdp_trade_good_flavor.2006.b: "商品に語らせよう。"
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "額面の価値"
 gdp_trade_good_flavor.2007.desc: "「新しい[tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')]には私の顔を刻む」[tgf_market_holder.GetTitledFirstName]は言った。「そしてお前の[tgf_good.Custom('GetTradeGood')]を使う。良心的な価格で安定供給してほしい」\n\n[tgf_market_holder.GetHerHis|U]の顔と私の金属が一枚の硬貨になる。歴史は我々二人を記憶するだろう。"
 gdp_trade_good_flavor.2007.a: "お安くしましょう！最初の一枚は、私にください。"
 gdp_trade_good_flavor.2007.b: "定価でいいだろう。硬貨は硬貨だ。"
 gdp_trade_good_flavor.2007.c: "良心的な価格だと？相手にしない方がいいな。"
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "無傷"
 gdp_trade_good_flavor.2008.desc: "「一[tgf_good.Custom('GetTradeGoodUnit')]たりとも失われませんでした」交易担当者である[tgf_trader.GetFirstName]は、得意気に私に言った。「傷んだものも、壊れたものも、盗まれたものもありません。すべての[tgf_good.Custom('GetTradeGood')]が、出発したときと同じ状態で届きました」\n\nこれは運ではない。技術だ。そして技術は教えることができる。"
 gdp_trade_good_flavor.2008.a: "どのように梱包したのか見せてくれ。"
 gdp_trade_good_flavor.2008.b: "慎重に扱ったのだな。見事なものだ。"
 gdp_trade_good_flavor.2008.c: "買い手たちに伝えろ。無傷の商品は高く売れる。"
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "他の者たちは軍勢を見る"
 gdp_trade_good_flavor.2009.desc: "[tgf_market_holder.GetTitledFirstName]の治める地にも戦火が及んだ。戦争は[tgf_good.Custom('GetTradeGood')]を食いつくす。[tgf_market_holder.GetHerHis|U]の需品係たちは私の交易路で運べる限りの品を買い占めた挙句、次の入荷はいつになるのかと尋ねてくる。\n\n他の者たちには軍勢が見える。私に見えるのは客だ。"
 gdp_trade_good_flavor.2009.a: "戦争は前払いをしてくれる。"
 gdp_trade_good_flavor.2009.b: "特権を、今すぐ書面で確約してもらおう。"
 gdp_trade_good_flavor.2009.c: "誰のおかげで武装できるのか、お忘れなきよう。"
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "ギルドが扉を叩く"
 gdp_trade_good_flavor.2010.desc: "[tgf_source_county.GetNameNoTier]の[tgf_source_culture.GetName]ギルドから丁重な手紙が届いた。私の売価が彼らの売価より安いため、誰かが痛い目を見る前に、協定価格を定めたいとの内容だ。\n\nギルドは礼儀正しく扉を叩く。だがそれは一度きりだ。"
 gdp_trade_good_flavor.2010.a: "手数料を払い、価格を取り決めよう。"
 gdp_trade_good_flavor.2010.b: "奴らの好きにさせておけ。"
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "流行を作るのは統治者"
 gdp_trade_good_flavor.2011.desc: "荷車よりも噂の方が先に届く。[tgf_market_holder.GetTitledFirstName]が私の[tgf_good.Custom('GetTradeGood')]を身に纏い、宮廷の人々の前に現れたのだ。彼らの半数は、すでにそれがどこで手に入るのか尋ねてきている。\n\n流行を作るのは統治者。価格を決めるのは商人だ。"
 gdp_trade_good_flavor.2011.a: "あれが誰から買った[tgf_good.Custom('GetTradeGood')]だったのか、皆に知らせてやれ。"
 gdp_trade_good_flavor.2011.b: "注目されているうちに値上げしろ。"
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "商品の試飲"
 gdp_trade_good_flavor.2012.desc: "[tgf_good.Custom('GetTradeGood')]の[tgf_good.Custom('GetTradeGoodUnitPlural')]が、私をじっと見つめ返している。暗鬱な一か月だった。頭が静まらないまま、私は金で買える最高の酒に囲まれている。\n\nこれは品質管理のための試飲だ。誰も知る必要はない。"
 gdp_trade_good_flavor.2012.a: "品質管理のためだ。全部な。"
 gdp_trade_good_flavor.2012.a.toast: "度が過ぎた試飲"
 gdp_trade_good_flavor.2012.b: "いや、在庫は在庫だ。"
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "名品の注文"
 gdp_trade_good_flavor.2013.desc: "「そちらの最高の[tgf_good.Custom('GetTradeGood')]と、熟練職人にふさわしい報酬を用意してくれ」と、[tgf_source_county.GetNameNoTier]で最も優れた[tgf_good.Custom('GetTgfGoodCrafter')]の[tgf_crafter.GetFirstName]は言う。「そうすれば、誰も見たことのないものを作ってみせよう」\n\n懐具合を考えるとためらわれるが、私の見栄っ張りな心はすっかりその気だ。"
 gdp_trade_good_flavor.2013.a: "報酬は承知した。私を驚かせてみろ。"
 gdp_trade_good_flavor.2013.b: "私の商品は飾り立てる必要などない。"
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "彼らの料理、我々の商品"
 gdp_trade_good_flavor.2014.desc: "「彼らは今や自分たちの[tgf_source_province.Custom('GetTgfLocalDish')]に、あなたの[tgf_good.Custom('GetTradeGood')]を入れていますよ」と、私の交易担当者である[tgf_trader.GetFirstName]は料理を食べながら言った。「[tgf_source_county.GetNameNoTier]の人々は皆そうしています。料理人たちはこれを新しい流儀だと言い、かつての作り方など誰も覚えていません」\n\n私は彼らの[tgf_source_province.Custom('GetTgfLocalDish')]を味わったことすらない。しかし、これほど誇らしく思ったことはない。"
 gdp_trade_good_flavor.2014.a: "ならば、彼らにはその新しい流儀の代金を払ってもらおう。"
 gdp_trade_good_flavor.2014.b: "荷車をもっと手配しろ。料理人たちが待ちわびている。"
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "現物支給"
 gdp_trade_good_flavor.2015.desc: "「もっと金を払っていただきたい」と、[tgf_source_county.GetNameNoTier]の[tgf_good.Custom('GetTgfGoodGatherers')]を代表して[tgf_spokesperson.GetFirstName]が言う。私は代わりに[tgf_good.Custom('GetTradeGood')]を渡そうとした。\n\n「お前たちがいつも集めているものだろう」と私は指摘する。「だったら、もらえて嬉しいはずじゃないか！」\n\nどうもそうではないようだ。"
 gdp_trade_good_flavor.2015.a: "報酬を払おう。硬貨でな。"
 gdp_trade_good_flavor.2015.b: "彼らに利益を分配しろ。"
 gdp_trade_good_flavor.2015.c: "現物も賃金のうちだ。"
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "金は臭わない"
 gdp_trade_good_flavor.2016.desc: "私の[tgf_good.Custom('GetTradeGood')]を顔から遠ざけるようにして持ちながら、「臭いな」と[tgf_source_county.GetNameNoTier]の買い手は言った。「[tgf_good.Custom('GetTgfGoodFlaw')|U]」だそうだ。\n\n私は買い手の硬貨を受け取り、匂いを嗅ぐ。[Glossary('何の匂いもしない', 'TGF_PECUNIA_NON_OLET_GLOSS' )]。"
 gdp_trade_good_flavor.2016.a: "鼻風邪をひいた買い手に売れ。"
 gdp_trade_good_flavor.2016.b: "臭いを消す方法があるかもしれないな。"
 gdp_trade_good_flavor.2016.c: "その硬貨を私の鼻の下に置いておけ。一日中な。"
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#!——「金は臭わない」。ローマ皇帝ウェスパシアヌスは、公衆便所への課税で得た硬貨を息子の鼻に突きつけ、このことを教えたと言われている。"
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "7年の豊作"
 gdp_trade_good_flavor.2017.desc: "私は7頭の肥えた牛と7頭の痩せた牛の夢を見た[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]。目を覚ますと、朝食前に計算を始める。\n\n凶作の年にどれほの損失が出ようとも、私の[tgf_good.Custom('GetTradeGood')]はそれ以上の値がつくはずだ。"
 gdp_trade_good_flavor.2017.a: "すべて蓄えておけ。最後の一[tgf_good.Custom('GetTradeGoodUnit')]までな。"
 gdp_trade_good_flavor.2017.b: "安いうちに、もっと買い付けておけ。"
 gdp_trade_good_flavor.2017.c: "牛は帳簿ではない。もう一眠りするか。"
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "誰かの家畜"
 gdp_trade_good_flavor.2018.desc: "外に出ると、門が[tgf_good.Custom('GetTradeGood')]の大群に塞がれていた。その真ん中で、交易担当者の[tgf_trader.GetFirstName]が満面の笑みを浮かべている。「[Glossary( '略奪者', 'TGF_CATTLE_RAID_GLOSS' )]の[tgf_raider.GetFirstName]が[tgf_market_holder.GetTitledFirstNamePossessive]の牧草地から連れてきたのです。どうやったのかは聞かないでください。相場の半額でしたよ」\n\nどの家畜の脇腹にも[tgf_market_holder.GetFirstNamePossessiveNoTooltip|U]の焼き印が押されている。\n\n「焼き印なんて」[tgf_trader.GetFirstNameNoTooltip]は言い添えた。「焼き直せますよ」"
 gdp_trade_good_flavor.2018.a: "焼き印は何であれ、掘り出し物は掘り出し物だ。"
 gdp_trade_good_flavor.2018.a.toast: "焼き印を知っている者がいた"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U]は、[CHARACTER.GetShortUINamePossessive]の群れから盗まれた家畜だと知りながらそれを購入した。"
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U]は、[TARGET_CHARACTER.GetShortUINamePossessive]の群れから盗まれた家畜だと知りながらそれを購入した。"
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip]は、この件で私に借りを作ることになる。"
 gdp_trade_good_flavor.2018.c: "さっさと屠殺してしまえ。"
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "隣人の家畜を襲って奪うことは、古くからの娯楽であると同時に、名誉や財産をめぐる重大事でもあった。アイルランドの偉大な叙事詩『クーリーの牛争い』は、一頭の雄牛を巡って起きた戦いを物語っている。"
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "酒を禁じる宮廷からの注文"
 gdp_trade_good_flavor.2019.desc: "「[tgf_market_holder.GetTitledFirstNamePossessive]の宮廷では決して[tgf_good.Custom('GetTradeGood')]を飲みません」と、交易担当者である[tgf_trader.GetFirstName]が言う。「なのに、40[tgf_good.Custom('GetTradeGoodUnitPlural')]の注文が届いたんです。どちらも本当の話のようですよ」\n\n[tgf_market_holder.GetFirstNamePossessiveNoTooltip]の宗派では[Glossary( '飲酒を禁じている', 'TGF_ABU_NUWAS_GLOSS' )]。だが、値段を上乗せして請求することは禁止されていない。"
 gdp_trade_good_flavor.2019.a: "樽には「酢」と書いておけ。"
 gdp_trade_good_flavor.2019.b: "価格を倍にしよう。誰も文句は言うまい。"
 gdp_trade_good_flavor.2019.b.toast: "別の供給者"
 gdp_trade_good_flavor.2019.b.toast_good: "全額支払われた"
 gdp_trade_good_flavor.2019.c: "命を懸けるほどのことではない。他所で売れ。"
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "ワインは多くの宮廷で禁じられていたが、その大半で愛飲されてもいた。カリフのハールーン・アッ＝ラシードの宮廷詩人、アブー・ヌワースは、アラビア語で最も優れたワインの詩をいくつも残している。"
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "完璧なチーズ"
 gdp_trade_good_flavor.3001.desc: "見るより先に、倉庫にはその匂いが立ち込めている。豊かな味わいの熟成した円盤型のチーズだ。荷運び人たちは冗談半分で見張りまで立てている。残りの半分は本気だ。\n\n売ればご馳走が買える。取っておけば、それ自体がご馳走になる。"
 gdp_trade_good_flavor.3001.a: "命懸けで守れ。"
 gdp_trade_good_flavor.3001.b: "すべてのものには値段がある。完璧な品であっても。"
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "有名な苦情"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "顧客からの苦情として知られる最古のもの。それは、今から約3000年前のウルで作られた粘土板である。そこには、ナンニという人物が、粗悪な銅の延べ棒を納品したうえ、使者を侮辱したエアナーシルという商人を激しく非難する言葉が記されている。"
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName]は私の銅が粗悪で、延べ棒の重量も足りないと書いている。どちらも事実だ。\n\n「私を何だと思っているのだ？これほど[Glossary( '侮辱', 'TGF_EA_NASIR_GLOSS' )]的な扱いをするとは」\n\n私は[tgf_market_holder.GetHerHim]を上得意だと思っている。何しろ、もう代金は支払ってくれたのだから。"
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.GetSheHe|U]はまた買いに来るだろう。いつもそうなのだから。"
 gdp_trade_good_flavor.3002.a.toast: "二度とない"
 gdp_trade_good_flavor.3002.a.toast_good: "また買いにくる"
 gdp_trade_good_flavor.3002.b: "私の銅は本物だ。[tgf_market_holder.GetHerHim]に確かめさせてみろ！"
 gdp_trade_good_flavor.3002.b.toast_bad: "見破られた"
 gdp_trade_good_flavor.3002.b.toast_good: "検査に合格する"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U]は[CHARACTER.GetShortUIName]に目方の足りない延べ棒を売りつけ、それらが本物だと誓った。"
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U]は[TARGET_CHARACTER.GetShortUIName]に目方の足りない延べ棒を売りつけ、それらが本物だと誓った。"
 gdp_trade_good_flavor.3002.c: "謝罪し、次はもっと質の良い延べ棒を渡す。"
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "胡椒での支払い"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "胡椒は銀に匹敵するほどの価値があり、しばしば支払いに使われた。西暦1000年頃のロンドンでは、エゼルレッド王の法律により、ドイツの交易商人に課される通行税は一部を胡椒で支払うよう定められていた。"
 gdp_trade_good_flavor.3003.desc: "[tgf_source_county.GetNameNoTier]にいる私の債務者、[tgf_debtor.GetFirstName]はもう金を持っていない。そのため、[Glossary( '胡椒', 'TGF_PEPPER_GLOSS' )]で支払うという。小さな[tgf_good.Custom('GetTradeGoodUnit')]単位で持ってくるので、私の机は香辛料市場のような匂いがしている。\n\n二度数え直してみたが、換金率は悪くない。そして、このような支払い方を望む者は[tgf_debtor.GetFirstNameNoTooltip]だけではないはずだ。"
 gdp_trade_good_flavor.3003.a: "今後は胡椒での支払いを受け入れよう。"
 gdp_trade_good_flavor.3003.b: "硬貨で払わせよ。何とかかき集めろ。"
 gdp_trade_good_flavor.3003.c: "私のために働け。返済は後からでもよい。"
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "不満で一杯の手紙"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "シナゴーグの廃棄文書の収蔵庫であるカイロ・ゲニザの文書をはじめとして、何世紀にもわたって蓄えられてきた交易商人たちの手紙には、地中海貿易の詳しい記録が、不満たっぷりに残されている。最も多いのは、亜麻商人たちからの文句だ。"
 gdp_trade_good_flavor.3004.desc: "交易担当者の[tgf_trader.GetFirstName]は、[tgf_source_county.GetNameNoTier]で私の亜麻を見事な値段で一つ残らず売り払った。[tgf_trader.GetHerHis|U]の[Glossary('手紙','TGF_GENIZA_GLOSS')]にはその旨が1行だけ書かれている。そして残りの40行は湿気、荷役人、買い手、私の梱包に関する文句が連ねてある。\n\n最初に利益、後から愚痴。逆なら心配になるところだが、よしとしよう。"
 gdp_trade_good_flavor.3004.a: "利益については一行だけ。そこだけは二度読み返す。"
 gdp_trade_good_flavor.3004.b: "ありがた迷惑な忠告が40行。"
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "飴細工"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "饗宴の料理の合間に供される、砂糖とアーモンドの練粉で作られた飾り物。城、船、動物などを模し、客たちを驚嘆させる。最も豪華な飴細工は、デザートであると同時に政治的な主張でもあった。"
 gdp_trade_good_flavor.3005.desc: "「[tgf_market_holder.GetTitledFirstName]が砂糖でできた[ROOT.Char.Custom('GetRandomRegionalBird')]を所望されています」と、交易担当者の[tgf_trader.GetFirstName]が告げた。「大きさは実物の倍で、羽毛も一筋一筋精巧に彫り込んだものを、夏至までに[tgf_market_holder.GetHerHis]の卓上に用意してほしいとのことです。[tgf_market_holder.GetHerHis]の饗宴を彩る[Glossary('飴細工', 'TGF_SUBTLETY_GLOSS')]として供するとか」\n\n砂糖は溶けて消えるが、評判は残る。"
 gdp_trade_good_flavor.3005.a: "私が作ろう。実物よりも大きく、雄大に。"
 gdp_trade_good_flavor.3005.a.success: "饗宴は静まり返る"
 gdp_trade_good_flavor.3005.a.failure: "不格好な鳥"
 gdp_trade_good_flavor.3005.b: "宴の飾り菓子には、相応の値をつけろ。"
 gdp_trade_good_flavor.3005.c: "私が売るのは砂糖だ。彫刻ではない。"
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "蜂の群れ"
 gdp_trade_good_flavor.3006.desc: "勝手に集まってきた蜂たちが、梁の間に巣を作り、今や私の倉庫で蜂蜜を作っている。家賃も払わずにだ。\n\nこの店子には蜜で賃料を払ってもらおう。刺されることさえ気にしなければ、それほど悪くない取り決めだ。"
 gdp_trade_good_flavor.3006.a: "ただで手に入る蜂蜜だ。代償などあるはずがないだろう？"
 gdp_trade_good_flavor.3006.a.toast: "刺された！"
 gdp_trade_good_flavor.3006.b: "好きに働かせておこう。家賃は無料だ。"
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "茶をもう一杯"
 gdp_trade_good_flavor.3007.desc: "品物を確かめるためにまず一杯。それが効いたので、もう一杯。真夜中までに3冊の帳簿を再計算し、2通の手紙を書き上げたが、気分はすこぶる爽快だ。\n\nこれは積み荷が極上だったか、それともひどく金のかかる悪癖が始まったかのどちらかだな。"
 gdp_trade_good_flavor.3007.a: "毎朝、もう一ポット頼む。"
 gdp_trade_good_flavor.3007.b: "商会の皆に振る舞え。"
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "傷む前に"
 gdp_trade_good_flavor.3008.desc: "交易担当者の[tgf_trader.GetFirstName]が、[tgf_good.Custom('GetTradeGood')]の[tgf_good.Custom('GetTradeGoodUnit')]を開けて顔をしかめた。「川霧が入り込んでしまいました。今はまだ柔らかい程度ですが、週末までにはカビが生えるでしょう」\n\n乾燥果実は何年も保存できるが、湿った果実は数日しか持たない。時は金なりだ。"
 gdp_trade_good_flavor.3008.a: "もう一度乾燥させろ。しっかりとな。"
 gdp_trade_good_flavor.3008.b: "発酵させろ。ワインとして売ればよかろう。"
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "夜なべの灯油"
 gdp_trade_good_flavor.3009.desc: "帳簿をつけ終える一時間前にランプの油が切れてしまったので、私は売り物として蓄えていた上等な[tgf_good.Custom('GetTradeGood')]を使って火を灯した。だが、捨ててしまうような濁った油の澱と比べても、大して明るく灯るわけではない。\n\n明るさは変わらない。それなのに、買い手はその3倍もの金を払う。"
 gdp_trade_good_flavor.3009.a: "澱はランプ用に売り、上等な油は食卓用に売れ。"
 gdp_trade_good_flavor.3009.b: "燃やし続けろ。帳簿の計算が第一だ。"
 gdp_trade_good_flavor.3009.c: "床に就こう。油も休ませてやればいい。"
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "青田買い"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "穀物を青田買いする場合は、畑の穀物が実る前に代金を支払うが、その価格は、収穫後につくであろう価格を大幅に下回っている。説教師や教会法学者たちは、この慣行を「偽装された高利貸し」として非難した。"
 gdp_trade_good_flavor.3010.desc.condemned: "私の宗派ではこれを高利貸しと呼ぶ。だが私の帳簿では値引きと呼ぶ。"
 gdp_trade_good_flavor.3010.desc.permitted: "一部の宗派ではこれを高利貸しと呼ぶ。だが私の宗派では先見の明と呼ぶ。"
 gdp_trade_good_flavor.3010.desc.intro: "「今はまだ青いですが、夏になれば黄金色に変わります」と、[tgf_source_county.GetNameNoTier]の[tgf_peasant.GetFirstName]は膝まで泥にまみれて私に言った。「今の価格で[Glossary('青田買い', 'TGF_IN_THE_BLADE_GLOSS')]で前払いしていただければ、収穫物はすべてあなたのものです」\n\n"
 gdp_trade_good_flavor.3010.a: "来年の収穫を、今年の価格で買おう。"
 gdp_trade_good_flavor.3010.b: "作物は、実るまで売らずに置いておくがいい。"
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "10年ものの雑穀"
 gdp_trade_good_flavor.3011.desc: "新しい在庫の奥から、何年も前の雑穀の[tgf_good.Custom('GetTradeGoodUnitPlural')]が見つかった。すっかり忘れ去られ、帳簿にもつけられていないものだ。一粒たりとも痛んでいない。雑穀は長持ちするのだ。\n\n過去の自分からの無料の在庫。これこそ最高の遺産というものだ。"
 gdp_trade_good_flavor.3011.a: "売ってしまえ。過去の自分もそう望むだろう。"
 gdp_trade_good_flavor.3011.b: "荷造りして道中の食料にしろ。雑穀は長持ちする。"
 gdp_trade_good_flavor.3011.c: "倉庫の在庫を全部数え直せ。"
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "精米か、玄米か"
 gdp_trade_good_flavor.3012.desc: "精米した米は白く、軽く、どんな上流階級の宴席にもふさわしい。玄米は重く茶色いが、それ以外のあらゆる場所で求められている。交易担当者である[tgf_trader.GetFirstName]は、私がどちらの側の交易商人なのか知りたがっている。\n\n私は儲けを出す側の交易商人だ。"
 gdp_trade_good_flavor.3012.a: "精米しろ。上流階級は高い金を払う。"
 gdp_trade_good_flavor.3012.b: "玄米のまま、安く、誰にでも売り払え。"
 gdp_trade_good_flavor.3012.c: "上質のものは精米し、残りは玄米のまま売れ。"
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "断食の前"
 gdp_trade_good_flavor.3013.desc: "「まもなく[tgf_source_faith.Custom('GetTgfFastName')]が始まります！」と、交易担当者である[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]から慌ただしく書き送ってきた。「何週もの間、誰もが肉を断ちます。そしてそれが終われば、他の何よりも肉を欲するのです」\n\n空腹の買い手は値切らない。"
 gdp_trade_good_flavor.3013.desc_ramadan: "「まもなくラマダンが始まります！」と、交易担当者である[tgf_trader.GetFirstName]が、[tgf_source_county.GetNameNoTier]から慌ただしく書き送ってきた。「日中は、誰も何も食べません。そして日が沈めば、肉を貪ります」\n\n空腹の買い手は値切らない。"
 gdp_trade_good_flavor.3013.a: "私も断食をする。肉は放っておけ。"
 gdp_trade_good_flavor.3013.b: "塩漬けにしろ。空腹の時機を待て。"
 gdp_trade_good_flavor.3013.c: "断食前の最後の饗宴で、すべて売り払え。"
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "馬の歯を見よ"
 gdp_trade_good_flavor.3014.desc: "馬商人の[tgf_dealer.GetFirstName|U]は、自分が神聖だと信じるものすべてにかけて誓っている。「4歳だよ、旦那。せいぜい5歳だ。この毛並みを見てくれ！」確かに毛並みは素晴らしい。だが、[tgf_dealer.GetSheHe]は歯についてはどうも私の目をそらそうとしていようだ。\n\n贈られた馬の口の中を覗くな、ということわざがある。だが、この馬は贈り物ではない。"
 gdp_trade_good_flavor.3014.a: "口を大きく開けさせろ。歯を見ようじゃないか。"
 gdp_trade_good_flavor.3014.b: "年取っていようがいまいが、この馬は私が買う。"
 gdp_trade_good_flavor.3014.c: "お前の言葉を信用しよう。私の商会に加われ。"
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "市場用に肥やす"
 gdp_trade_good_flavor.3015.desc: "「群れはやせ細り、疲れ果てて[tgf_source_county.GetNameNoTier]にたどり着きました。まるで亡霊のようです」と、交易担当者である[tgf_trader.GetFirstName]は語る。「[tgf_market_holder.GetTitledFirstName]が近くに良い放牧地を持っており、それを我々に使わせてくれるそうです。もちろん、利用料は必要ですが」\n\n肥えた家畜はよく売れる。牧草は脂えた家畜より安上がりだ。"
 gdp_trade_good_flavor.3015.a: "牧草の代金を払え。太らせて売るのだ。"
 gdp_trade_good_flavor.3015.b: "やせた家畜にも値は付くものだ。"
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "書記たちのための子牛革"
 gdp_trade_good_flavor.3016.desc: "[tgf_market_holder.GetTitledFirstName]の宮廷聖職者である[tgf_chaplain.GetTitledFirstName]は、巡礼者が聖遺物を選ぶかのように私の皮なめし工房を歩き回っている。「これらを薄く削れば、聖なる言葉を千年にわたって記すことができるでしょう」と[tgf_chaplain.GetSheHe]は言う。\n\n私の革が千年も残る。牛一頭で歴史に残るとは悪くない話だ。"
 gdp_trade_good_flavor.3016.a: "最もよい品を贈り物としてお持ちください。"
 gdp_trade_good_flavor.3016.b: "書記官たちに使ってもらおう。長く残るように。"
 gdp_trade_good_flavor.3016.c: "靴職人に売る方がマシだ。"
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "羊毛の買い付け"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "シトー会の修道院は、毎年の羊の毛刈りで得られる羊毛を、数年も前からイタリアやフランドルの交易商人に売り渡し、まだ生えてもいない羊毛の代金を前払いで受け取っていた。多くの修道院がこの取引に手を出し、深い負債を抱えることになった。"
 gdp_trade_good_flavor.3017.desc: "「[tgf_abbot.GetTitledFirstName]が、今後数年分の[tgf_abbey.GetNameNoTier]の羊毛を我々に売りたいそうです」と、交易担当者の[tgf_trader.GetFirstName]は言う。「[Glossary('数年分の羊毛', 'TGF_WOOL_CLIP_GLOSS')]です。今支払えば、毛刈りのたびに羊毛が届きます。向こうは今すぐ金が欲しいのです」\n\n彼らは遠い先を見据えている。交易商人も同じだ。"
 gdp_trade_good_flavor.3017.a: "今金を払えば、羊毛が何年にもわたって手に入る。"
 gdp_trade_good_flavor.3017.b: "まだ毛も生えていない羊など当てにならん。"
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "バロメッツ"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "旅人や学者の間で語り継がれてきた伝説がある。極東には、生きた子羊が実る植物が生えており、子羊たちはその茎が枯れるまで周囲の草を食むという。それは植物に生える羊毛、すなわち綿花を説明するための一つの方法であった。"
 gdp_trade_good_flavor.3018.desc: "[tgf_source_county.GetNameNoTier]の買い手である[tgf_buyer.GetFirstName|U]は、私の綿の房を感嘆しながら手の中で転がした。「本当ですか？これが小さな子羊を実らせる植物に実るというのは。しかもその子羊たちは、茎が枯れるまで草を食むと言うじゃないですか」\n\n[Glossary( 'バロメッツ', 'TGF_VEGETABLE_LAMB_GLOSS' )]のことか。珍しいものは売れる。"
 gdp_trade_good_flavor.3018.a: "嘘偽りなく本当だ。しかも非常に珍しいのだ。"
 gdp_trade_good_flavor.3018.b: "子羊ではない。単なるふわふわした植物だ。"
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "スポリア"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "古い建造物から取り外され、新しい建造物に再利用された石材。古代の遺跡に使われていた柱や彫刻、碑文入りの石材は、中世世界各地の教会、城壁、家々に組み込まれた。"
 gdp_trade_good_flavor.3019.desc: "「石切り職人たちが採石をやめました」と、交易担当者の[tgf_trader.GetFirstName]が[tgf_source_county.GetNameNoTier]からの手紙で打ち明ける。「代わりに古い遺跡から石材を切り出しています。柱も彫刻も、あるものすべてです」\n\n[Glossary( 'スポリア', 'TGF_SPOLIA_GLOSS' )]を切り出しているというわけか。古い石材に、新しい値が付くのだ。"
 gdp_trade_good_flavor.3019.a: "骨董の石には、骨董相応の値をつけろ。"
 gdp_trade_good_flavor.3019.b: "最も優れた彫刻は私に取っておけ。"
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "マスト用の柱材"
 gdp_trade_good_flavor.3020.desc: "「[tgf_market_holder.GetTitledFirstNamePossessive]の船大工たちが、我々の[tgf_good.Custom('GetTradeGood')]を欲しがっています」と、交易担当者である[tgf_trader.GetFirstName]が言う。「どんな木材でもいいわけではありません。我々の在庫の中で最も長く、最もまっすぐな丸太が欲しいとのことです。帆柱に使うのです。理想どおりの木材がめったにないことは、向こうも承知です」\n\n希少なものを焦って売ってはならない。"
 gdp_trade_good_flavor.3020.a: "最良の丸太は、私の船に使う。"
 gdp_trade_good_flavor.3020.b: "売ろう。帆柱は待ってはくれないからな。"
 gdp_trade_good_flavor.3020.c: "待たせておけ。価格はもっと上がるはずだ。"
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "煙の天幕"
 gdp_trade_good_flavor.3021.t_bhang: "一杯のバングー"
 gdp_trade_good_flavor.3021.t_hashish: "閉ざされた扉の向こうの菓子"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "ヘロドトスによれば、スキタイ人は閉め切ったフェルト製の天幕の中で、真っ赤に熱した石の上に麻の種を投げ入れ、立ち込める煙の中で喜びの声を上げていたという。草原の民はこの風習を、その後も長く守り続けた。"
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.GetSheHe|U]は自らの天幕で、赤く熱した石の上に麻の種を投げ入れた。煙が上がる。「[Glossary( '吸い込むのだ', 'TGF_HEMP_TENT_GLOSS' )]、商人よ。ここではこうやって商談を進めるのだ」\n\nもちろん、すべて商売上の理由からだ。"
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "『アタルヴァ・ヴェーダ』では、バングーは5つの聖なる植物の一つに数えられている。麻の葉を牛乳、ギー、香辛料とともにすり潰して飲み物にし、祭りで飲んだり、シヴァ神に捧げたりする。"
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.GetSheHe|U]は麻の葉を牛乳や香辛料とともにすり潰し、私に杯を手渡した。「[Glossary( 'バングー', 'TGF_HEMP_BHANG_GLOSS' )]だ、商人よ、祭りの時には町中の者がこれを飲む。今夜はお前も飲むのだ」\n\n断るのは無礼であり、無礼は商売上よろしくない。"
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "練り物や菓子に混ぜて食される大麻樹脂、ハシシは、12世紀以降にエジプトやシリアに広まった。一部のスーフィー教徒はこれを恍惚への道として称賛したが、法学者はこれを非難し、統治者たちは畑を丸ごと焼き払わせた。"
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.GetSheHe|U]は扉を閉めると、小さく固められた大麻樹脂の菓子を取り出した。「[Glossary( 'ハシシ', 'TGF_HEMP_HASHISH_GLOSS' )]だ、商人よ。法学者たちは眉をひそめるが、ここには法学者はいない」\n\n買い手の申し出を断るのは無礼というものだ。"
 gdp_trade_good_flavor.3021.desc.intro: "「[tgf_good.Custom('GetTgfHempUse')]の[tgf_good.Custom('GetTradeGood')|U]だって？」[tgf_source_county.GetNameNoTier]の[tgf_hemp_host.GetTitledFirstName]は笑う。「[tgf_good.Custom('GetTgfGoodItThem')]なら、もっといい使い道がある」\n\n"
 gdp_trade_good_flavor.3021.a: "商売は商売だ。種をよこせ。"
 gdp_trade_good_flavor.3021.a_bhang: "商売は商売だ。杯をよこせ。"
 gdp_trade_good_flavor.3021.a_hashish: "商売は商売だ。菓子をよこせ。"
 gdp_trade_good_flavor.3021.b: "売ってしまえ。頭はすっきりさせておこう。"
 gdp_trade_good_flavor.3021.a.toast_habit: "新しい習慣"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "最上の鉄から鍛えた刃"
 gdp_trade_good_flavor.3022.desc: "[tgf_source_county.GetNameNoTier]の鍛冶職人、[tgf_smith.GetFirstName]は、私の鉄の延べ棒の一つを手に載せて重さを確かめ、にやりと笑う。「この中で最高のものをくれれば、その金属の10倍の価値がある刃を作ってやろう」\n\n\n10倍か。[tgf_smith.GetSheHe|U]は交易商人との話し方を心得ている。"
 gdp_trade_good_flavor.3022.a: "鍛えてもらおう。その大口に見合う品にしてみせろ。"
 gdp_trade_good_flavor.3022.b: "どの延べ棒が最上か教えてくれ。"
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "宝石彫刻師の主張"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "宝石の形を整え、研磨する職人。また、宝石の秘められた力を記した宝石誌の読者でもある。そこには、毒に効くサファイアから酔いを防ぐアメジストまで、あらゆる宝石の効能が列挙されている。"
 gdp_trade_good_flavor.3023.desc: "[tgf_source_county.GetNameNoTier]の[Glossary( '宝石彫刻師', 'TGF_LAPIDARY_GLOSS' )]である[tgf_lapidary.GetFirstName|U]が、私の宝石の一つをひどく真剣な面持ちで光にかざす。「この石には[ROOT.Char.Custom('GetTgfAilment')]を退ける力があります。宝石誌にもそう書かれています」\n\nそれは値札には書かれていない。今のところは。"
 gdp_trade_good_flavor.3023.a: "その効能を謳って売れ。見合った値段を付けろ。"
 gdp_trade_good_flavor.3023.b: "私の商会に加われ。その本も持ってくるように。"
 gdp_trade_good_flavor.3023.c: "本の内容に異を唱えるつもりはない。"
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "紳士の石"
 gdp_trade_good_flavor.3024.desc: "翡翠の目利きである[tgf_connoisseur.GetFirstName|U]は、私の品を一つずつ自分の歯に当て、その音を聞いて確かめる。そして2つの品を脇へ除けた。「滑石だ。非常に上質な滑石ではあるが」残りの品には納得した様子でゆっくりと頷く。\n\n本物と偽物を見分けることができる者は、どちらの石よりも価値がある。"
 gdp_trade_good_flavor.3024.a: "偽物を叩き割れ。仕入れ先はどこだ？"
 gdp_trade_good_flavor.3024.b: "私の商会に加われ。お前の目利きには給金を払う価値がある。"
 gdp_trade_good_flavor.3024.c: "歯で見分けるコツを教えてくれ。"
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "陶磁器の底荷"
 gdp_trade_good_flavor.3025.desc: "交易担当者の[tgf_trader.GetFirstName]は得意気だ。「船には重しが必要でした。それに、我々の陶磁器の[tgf_good.Custom('GetTradeGoodUnitPlural')]は重いですからね。船長は運賃をほとんど請求しませんでしたよ」\n\n運賃を自ら稼いでくれる積み荷か——こういう品は大歓迎だ。"
 gdp_trade_good_flavor.3025.a: "浮いた金は次の荷に回せ。"
 gdp_trade_good_flavor.3025.b: "陶磁器を底荷として積み込む方法を学べ。"
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "樹液かぶれ"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "漆は空気に触れて乾くわけではない。樹液は塗り重ねるたびに、暖かく湿った部屋で何日もかけて硬化させなければならず、上質な品を仕上げるには何十回もの塗り重ねが必要となる。硬化する前の樹液は、触れれば肌に水ぶくれが生じる。"
 gdp_trade_good_flavor.3026.desc: "新たな漆器が数[tgf_good.Custom('GetTradeGoodUnitPlural')]届いたが、最後の塗りがまだ[Glossary('硬化', 'TGF_LACQUER_CURE_GLOSS')]していない。仕上がりは完璧だ。深みがあり、艶やかで、まるで濡れているかのようだ。触って確かめたくてたまらない。\n\n漆職人たちは、樹液に触るとかぶれるという。だが、彼らは大げさなのではないかと私は疑っている。"
 gdp_trade_good_flavor.3026.a: "湿度の高い部屋を作り、きちんと硬化させろ。"
 gdp_trade_good_flavor.3026.b: "ちょっと触るだけ。確かめるだけだ。"
 gdp_trade_good_flavor.3026.b.toast_rash: "漆かぶれ"
 gdp_trade_good_flavor.3026.c: "硬化させろ。良いものは待つ価値がある。"
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "読書石"
 gdp_trade_good_flavor.3027.desc.intro: "[tgf_source_county.GetNameNoTier]の[tgf_glassmaker.GetFirstName]というガラス職人が、磨き上げた2つの石を私の帳簿の上に置いた。小さな数字が大きく、くっきりと黒く見える。「年取った目にはありがたい代物だ、友よ。疲れた目にもな」\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "私の場合は両方とも当てはまる。ここ何年もなかったことだが、あらゆる契約書の細かい文字が読めるようになった。"
 gdp_trade_good_flavor.3027.desc.young_eyes: "私の場合はそんなことはない。だが、今やあらゆる契約書の細かい文字が読めるようになった。"
 gdp_trade_good_flavor.3027.a: "私に一組くれ。しっかり梱包してもらおう。"
 gdp_trade_good_flavor.3027.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip]に一組送ってくれ。"
 gdp_trade_good_flavor.3027.c: "石はいらない。ただ、その仕組みを教えてくれ。"
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "お祭り価格"
 gdp_trade_good_flavor.3028.desc.christian: "「もうじき聖なる祭日ですね」と、[tgf_source_county.GetNameNoTier]から戻ったばかりの交易担当者、[tgf_trader.GetFirstName]が言う。「誰もが東方の三博士にふさわしい香を買い求めています。祭壇で焚くものを値切る者などおりません」\n\n"
 gdp_trade_good_flavor.3028.desc: "「もうじき聖なる祭日ですね」と、[tgf_source_county.GetNameNoTier]から戻ったばかりの交易担当者、[tgf_trader.GetFirstName]が言う。「誰もが神聖な礼拝堂にふさわしい香を買い求めています。祭壇で焚くものを値切る者などおりません」\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "値切りらぬ買い手は、[ROOT.Char.GetFaith.HighGodName]からの賜物だ。"
 gdp_trade_good_flavor.3028.a: "私も、祝祭のためにいくらか焚くことにしよう。"
 gdp_trade_good_flavor.3028.b: "寺院に優先的に選ばせよう。原価でな。"
 gdp_trade_good_flavor.3028.c: "祝祭の日には、祝祭にふさわしい価格を。"
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "テリアカ"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "数十種類の材料から作られる有名な万能薬。しばしば毒蛇の肉やアヘンが含まれ、何年も寝かせて熟成させる。医師たちは毒や疫病をはじめ、ほとんどあらゆる病に対してこれを処方した。"
 gdp_trade_good_flavor.3029.desc: "[tgf_source_county.GetNameNoTier]の薬屋である[tgf_apothecary.GetFirstName|U]から、薬草の香りがする手紙が届いた。「あなたの在庫は、まさに私が[Glossary('テリアカ', 'TGF_THERIAC_GLOSS')]を作るために必要としているものです。毒にも疫病にも、そしてどのような病に効くのです」\n\n効き目があるかどうかは、[tgf_apothecary.GetHerHim]と患者の間の問題だ。私の役目は売ることだ。"
 gdp_trade_good_flavor.3029.a: "調合して、私の交易路沿いで売れ。"
 gdp_trade_good_flavor.3029.b: "64種類すべての材料を用意しよう。私から買え。"
 gdp_trade_good_flavor.3029.c: "調合法を教えてくれ。それと一服分もな。"
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "紙の公文書の禁止"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "1231年、皇帝フリードリヒ2世は、シチリア王国の公証人たちに公文書を紙に書くことを禁じた。紙は脆すぎて信用できないと考えたためである。使用を認められたのは羊皮紙のみであった。"
 gdp_trade_good_flavor.3030.desc: "「[tgf_market_holder.GetTitledFirstNamePossessive]の書記官たちは、公的な事柄については[Glossary( '紙を一切使おうとしません', 'TGF_PAPER_GLOSS' )]」と、[tgf_source_county.GetNameNoTier]から戻ったばかりの交易担当者、[tgf_trader.GetFirstName]は憤懣やる方ない様子で語る。「羊皮紙しか認めないと言うのです。まるでそれが神聖なものであるかのように」\n\nどんな規則にも異議を唱える余地はある。"
 gdp_trade_good_flavor.3030.a: "異議を申し立てろ。紙こそ未来だ。"
 gdp_trade_good_flavor.3030.a.success: "文書局は紙を受け入れる"
 gdp_trade_good_flavor.3030.a.failure: "文書局は羊皮紙を使い続ける"
 gdp_trade_good_flavor.3030.b: "ならば、私の羊皮紙を買ってもらおう。"
 gdp_trade_good_flavor.3030.c: "ならば、彼らがどんな商品を求めているのか探ってみよう。"
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "グルートかホップか"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "「ヤチヤナギやセイヨウノコギリソウなどの薬草を混ぜたもの。ホップが使われるようになる前に、エールの風味付けと保存のために使われていた。多くの統治者はその独占販売権を握り、醸造されるエールすべてに税を課していた。"
 gdp_trade_good_flavor.3031.desc: "「ホップですよ」と、[tgf_source_county.GetNameNoTier]の醸造家である[tgf_brewer.GetFirstName]が私の樽越しに囁く。「出来たビールは何か月も保存できるし、ホップには誰も税を課せない」[tgf_source_county.GetNameNoTier]では、すべての醸造所が[tgf_market_holder.GetTitledFirstNamePossessive]の[Glossary('グルート', 'TGF_GRUIT_GLOSS')]を購入し、それとともに税を納めねばならない。\n\n進歩の代償は、いつだって誰かが払う。"
 gdp_trade_good_flavor.3031.a: "ホップにしよう。流通させろ。"
 gdp_trade_good_flavor.3031.b: "[tgf_market_holder.GetTitleAsNameNoTooltip||]のお好みどおり、グルートにしよう。"
 gdp_trade_good_flavor.3031.c: "両方を少しずつ、どの樽にも入れよう。"
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "果物ひと籠"
 gdp_trade_good_flavor.3032.desc: "[tgf_source_county.GetNameNoTier]では、[tgf_fruit_province.Custom('get_region_fruit_plural')]は籠単位で食べられているが、隣村より遠くまで運ばれることはほとんどない。\n\n乾燥させれば長持ちするだろう。出荷すれば売れるだろう。私は一つ食べ、帳簿に手を伸ばす。"
 gdp_trade_good_flavor.3032.a: "誰が栽培しているのか、どれだけの生産量があるのか調べろ。"
 gdp_trade_good_flavor.3032.b: "もう一つ。研究のためだ。"
