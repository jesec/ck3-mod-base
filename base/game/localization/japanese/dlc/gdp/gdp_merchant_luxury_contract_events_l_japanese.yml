 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]産の貴金属の見本。商人たちの取引に用いられる。"
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]：宗教の中心地"
 gdp_merchant_luxury_contract.1501.desc: "無数の巡礼者や信徒たちが歩んだ道を進んでいくと、やがて[religious_building_province.GetName]にある壮麗な[religious_building_district.GetType.GetPrimaryBuildingType.GetName]が眼前に現れる。\n\n"
 gdp_merchant_luxury_contract.1501.site: "霊廟は、過去の[religious_building_faith.GetReligion.GetAdjective]の統治者たちが[religious_building_faith.HighGodName]を篤く信仰した証として建てられた、壮大な記念碑である。その中から、礼拝の声が旋律のように低く響いてくる。"
 gdp_merchant_luxury_contract.1501.tombs: "少し離れた所に、[religious_building_faith.ReligiousSymbol]が刻まれた、古い石の墓所がある。長い年月の中で草に覆われ、石の角はすり減っている。"
 gdp_merchant_luxury_contract.1501.pilgrim: "巡礼者の装いをした信徒たちが列をなし、中へ入る順番を待っている。その中でも特に目を引いたのは、聖遺物箱のようなものを持った一団だ。"
 gdp_merchant_luxury_contract.1501.monks: "近くでは僧侶たちが静かに身を寄せ合い、まるで世の喧騒から切り離されているかのように、落ち着いた調子で言葉を交わしている。"
 gdp_merchant_luxury_contract.1501.keepsake: "建物に近づくと、長年の時を経て石組みが緩み、壁面にひびが走っているのが目に入る。"
 gdp_merchant_luxury_contract.1501.apostate: "少し離れた所で、思い詰めた様子の[pilgrim.GetWomanMan]が建物の陰に腰を下ろし、膝に肘を置いて頬杖をつきながら、小さな書物を読んでいる。"
 gdp_merchant_luxury_contract.1501.a: "中を見たい。"
 gdp_merchant_luxury_contract.1501.a.flavor: "[learning_i|E] [learning|E]能力や[piety_i|E] [piety|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1501.a.tt: "[religious_building_faith.HouseOfWorship]の中を見る"
 gdp_merchant_luxury_contract.1501.b: "あの墓には何かあるはずだ…"
 gdp_merchant_luxury_contract.1501.b.flavor: "[intrigue_i|E] [intrigue|E]や[prowess_i|E] [prowess|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1501.b.tt: "夜に戻って墓を暴く"
 gdp_merchant_luxury_contract.1501.c: "あの巡礼者たちは騙されやすそうだ…"
 gdp_merchant_luxury_contract.1501.c.flavor: "[intrigue_i|E] [intrigue|E]や[diplomacy_i|E] [diplomacy|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1501.c.tt: "巡礼者を騙そうとする"
 gdp_merchant_luxury_contract.1501.d: "僧侶たちと話してみたい。"
 gdp_merchant_luxury_contract.1501.d.flavor: "[learning_i|E] [learning|E]能力や[piety_i|E] [piety|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1501.d.tt: "僧侶たちと対話する"
 gdp_merchant_luxury_contract.1501.e: "石が一つなくなっても気付かれまい…"
 gdp_merchant_luxury_contract.1501.e.flavor: "[intrigue_i|E] [intrigue|E]や[prowess_i|E] [prowess|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1501.e.tt: "建物の一部を盗もうとする"
 gdp_merchant_luxury_contract.1501.f: "あの[pilgrim.GetWomanMan]は助けを必要としているようだ。"
 gdp_merchant_luxury_contract.1501.f.flavor: "[diplomacy_i|E] [diplomacy|E]能力や[piety_i|E] [piety|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1501.f.tt: "巡礼者に話しかける"
 gdp_merchant_luxury_contract.1502.site: "[priest.Custom('PriestTitle')]は私をじっくりと上から下まで眺め、私の言葉と表情を見定めた。その横を、参拝者たちが祈りや願いを口の中でつぶやきながら通り過ぎていく。\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "[priest.GetSheHe]はしばらくしてからため息をつくと、こう言った。「そこまで熱心に頼まれては、断るわけにもいきません」[priest.GetSheHe|U]は近くにあった本に手を伸ばすと、その表紙を少し撫でてから、私に差し出した。\n\n「これを持っていきなさい、友よ。[religious_building_faith.HighGodNameAlternate]の御言葉が見つかりますように」"
 gdp_merchant_luxury_contract.1502.site.failure: "[priest.GetSheHe]はしばらくしてから眉をひそめると、こう言った。「さっさと出ていきなさい。ここは君の来る場所ではない。ここは[religious_building_faith.HouseOfWorship]、信仰の場なのだよ。今日は君のくだらない戯言に付き合っている暇はない」\n\n何人かの参拝者が振り返り、私が立ち去るのを見ていた。"
 gdp_merchant_luxury_contract.1502.pilgrim: "親しみを込めて聞いてみたところ、彼らはその聖遺物を故郷の近くで手に入れ、[pilgrim.GetFaith.HouseOfWorship]へ寄進するためにここへ持ち込んだのだと分かった。\n\n私は驚いたふりをしてみせた。そんなひどい騙され方をするとは、なんと気の毒なことかと！\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "私は、怒ってこそいないが落胆しながら、彼らが小箱を敷地の向こうの空き地へ投げ捨て、立ち去るのを見送った。"
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "だが、彼らの反応には少々面食らった。彼らは聖遺物を地面に叩きつけ、粉々になるまで踏み砕いたのだ。見物人たちは仰天していた。\n\nここは退散した方がよさそうだ…"
 gdp_merchant_luxury_contract.1502.tomb: "墓をこじ開けるのは、見た目以上に骨が折れた！私たちは渾身の力を振り絞り、ようやくひときわ立派な墓碑のひとつをこじ開けた。\n\n汗をぬぐって薄暗い内部をのぞき込むと、何かが見えた。私は慎重に手を伸ばし、それを取り出した。\n\n「明かりを！」私は焦れて囁いた。\n\n私が手にしたのは…"
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "装飾が施された見事な骨壺だった！"
 gdp_merchant_luxury_contract.1502.tomb.success: "古びた傷だらけの骨壺だろうか？"
 gdp_merchant_luxury_contract.1502.tomb.failure: "#EMP 骨#!だろうか？"
 gdp_merchant_luxury_contract.1502.monks: "僧侶たちとの会話は思っていた以上に興味深かった！[monk.GetFaith.ReligiousText]から[monk.GetFaith.TricksterGodName]の神秘に至るまで、彼らが聖職者としての人生で得た興味深い解釈や洞察が次々と語られたのだ。\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "私たちは大いに語り合い、別れの時が来る頃には、僧侶たちは名残惜しそうにしていた。別れ際、[monk.GetFirstName]は温かな笑みを浮かべながら、私の手に何かを持たせた。"
 gdp_merchant_luxury_contract.1502.monks.failure: "だが、私が話すたびに[monk.GetFirstName]は興味を失っていくようだった。不満なのか退屈なのかわからないが、やがて私はもう歓迎されていないことをはっきり悟った。"
 gdp_merchant_luxury_contract.1502.keepsake: "私は最後に背後を一瞥すると、流れるような動作で壁の一部を叩き、落ちた欠片を受け止めようと試みた。\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "私は華麗な手さばきで壁の一部を剥ぐと、外套の下へ押し込んで、何事もなかったかのようにその場を離れた。どうやら誰にも気付かれなかったようだ！"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "だが、私の手際は無様なまでに悪く、大きな音を立てて尻もちまでついてしまった。注意を引かれた巡礼者たちが、信じられないといった様子で痛みに呻く私と壁を交互に見ている。"
 gdp_merchant_luxury_contract.1502.apostate: "私が[pilgrim.GetWomanMan]の隣に腰を下ろし、[merchant.GetFaith.ReligiousText]のお気に入りの一節を静かに語りはじめても、[pilgrim.GetHerHim]は特に抗議しなかった。そして私の言葉に気を取られたのか、やがて[pilgrim.GetSheHe]は泣きやんだ。\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "私の言葉は[pilgrim.GetSheHe]の心を動かしたようだ。事実、それから間もなくして[pilgrim.GetFirstName]はここを離れ、私と共に[merchant.GetFaith.HighGodNameAlternate]の道を歩みたいと言ってきたのだ！"
 gdp_merchant_luxury_contract.1502.apostate.success: "私が読み進めるうちに、[pilgrim.GetHerHim]の様子が変わっていくのを感じた。まるで重い肩の荷が下りたかのようだ。\n\n[pilgrim.GetSheHe]は立ち上がると、何も言わずに去っていった。[pilgrim.GetHerHis]の古びた本は、私の傍らに置き去りにされたままだ。"
 gdp_merchant_luxury_contract.1502.apostate.failure: "だが、それも長くは続かなかった。[pilgrim.GetHerHis]の表情は徐々に険しくなり、[pilgrim.GetSheHe]の胸には新たな感情が燃え上がる。怒りだ。\n\n[pilgrim.GetHerHis|U]は、私が[pilgrim.GetHerHim]を背教の道へ誘惑していると叫んだ。よりによって[pilgrim.GetFaith.HouseOfWorship]の敷地内でだ！ほどなくして、怒れる信徒たちが集まりはじめた…"
 gdp_merchant_luxury_contract.1502.a.critical: "上出来だ！"
 gdp_merchant_luxury_contract.1502.a: "なかなかの出来だ。"
 gdp_merchant_luxury_contract.1502.b: "これで妥協するしかない…"
 gdp_merchant_luxury_contract.1511.desc: "日が沈むと、我々は人目を忍んで[religious_building_district.GetType.GetPrimaryBuildingType.GetName]の付近へと戻り、とうに世を去った誰とも知れぬ墓を暴いて金品財宝を探す。\n\n目撃されるのを避けるため、普通の道を使わずに慎重に進み、そうしてひんやりと静まり返った墓地にたどり着いた。"
 gdp_merchant_luxury_contract.1511.a: "墓を開けよう！急げ！"
 gdp_merchant_luxury_contract.1511.a.flavor: "[intrigue_i|E] [intrigue|E]能力と[prowess_i|E] [prowess|E]能力が試される"
 gdp_merchant_luxury_contract.1511.a.success_critical: "豪華な宝物を発見する"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "高品質な#V 珍品#!に分類される[domicile_artifact|E]を発見する"
 gdp_merchant_luxury_contract.1511.a.success: "ささやかな宝物を発見する"
 gdp_merchant_luxury_contract.1511.a.success.tt: "低品質な#V 珍品#!に分類される[domicile_artifact|E]を発見する"
 gdp_merchant_luxury_contract.1511.a.failure: "特筆すべきものは何も見つからない"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "#V 珍品#!に分類される[domicile_artifact|E]を発見する"
 gdp_merchant_luxury_contract.1511.artifact.urn: "[religious_building_faith.GetAdjectiveNoTooltip]の副葬品"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]から奪われた、とうに世を去った[religious_building_faith.GetAdherentName]の墓に納められていた骨壺。"
 gdp_merchant_luxury_contract.1511.artifact.skull: "略奪した頭蓋骨"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]にある墓から奪われた、とうに世を去った[religious_building_faith.GetAdherentName]の頭蓋骨。"
 gdp_merchant_luxury_contract.1511.artifact.bone: "略奪した[priest.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]にある墓から奪われた、とうに世を去った[religious_building_faith.GetAdherentName]の骨。"
 gdp_merchant_luxury_contract.1521.desc: "立派な扉を開けて薄暗がりへと足を踏み入れると、装飾の施された玄関広間に出た。儀式や供物の香から異国めいた濃厚な香りが漂っている。\n\n[priest.Custom('PriestTitle')]と思しき一人の[priest.GetWomanMan]が会衆と言葉を交わしており、その周りに信徒たちが集まっている。その人物はすぐに私に気づいた。ここでは私は目立ち過ぎるようだ。\n\n[priest.GetSheHe|U]は[merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )]私のもとへと歩み寄る。「[religious_building_district.GetType.GetPrimaryBuildingType.GetName]によくいらしっしゃいました」\n\n「何を求めてこられたのですか？」[priest.GetSheHe]は興味深そうに尋ねる。「あなたは[religious_building_faith.GetNameNoTooltip]の教えに従う者でしょうか？」"
 gdp_merchant_luxury_contract.1521.a: "[religious_building_faith.GetNameNoTooltip]について、できる限り学びたい。"
 gdp_merchant_luxury_contract.1521.a.flavor: "[learning_i|E] [learning|E]能力と[piety_i|E] [piety_level|E]が試される"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')]が書物を差し出す"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')]は疑念を抱いている"
 gdp_merchant_luxury_contract.1531.desc: "その粗末な聖遺物をもっとよく見ようと私が近づくと、[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )]巡礼者たちは聖遺物をしっかり抱え込み、疑いの目を向けてきた。\n\n[pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip]にとって何らかの重要な意味を持つ品であることは間違いない。[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]へ持ち帰れば、良い話の種になるだろう。\n\nこの田舎者たちなら、行商人か不道徳な[pilgrim.GetFaith.PriestNeuter]に偽物を掴まされたのだと信じ込ませられるはずだ…"
 gdp_merchant_luxury_contract.1531.a: "これは明らかな偽物だ。[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]には掃いて捨てるほどある…"
 gdp_merchant_luxury_contract.1531.a.success: "巡礼者たちが聖遺物を捨てる"
 gdp_merchant_luxury_contract.1531.a.failure: "巡礼者たちが怒る"
 gdp_merchant_luxury_contract.1541.desc: "僧侶たちは、最初こそ異国の人間らしい私の振る舞いに戸惑い訝っていたものの、私が神学について語り合いたいと言うと、好奇心を露わにした。\n\n若い僧侶たちはためらったが、彼らの指導者である[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )][monk.GetFirstName]は私を輪の中へ迎え入れ、旅について次々と質問してきた。"
 gdp_merchant_luxury_contract.1541.a: "ところで、[monk.GetFaith.WealthGodName]についてはどう考えていますか？"
 gdp_merchant_luxury_contract.1541.a.flavor: "[learning_i|E] [learning|E]能力と[piety_i|E] [piety_level|E]が試される"
 gdp_merchant_luxury_contract.1541.a.success: "僧侶たちが議論を楽しむ"
 gdp_merchant_luxury_contract.1541.a.failure: "僧侶たちが白ける"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "[religious_building_faith.GetAdjectiveNoTooltip]の数珠"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]の僧侶から贈られた、[religious_building_faith.GetAdjective]の数珠。"
 gdp_merchant_luxury_contract.1541.artifact.icon: "[religious_building_faith.GetAdjectiveNoTooltip]の聖像"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]の僧侶、[monk.GetFirstName]から贈られた、[newly_created_artifact.GetFeatureText('icon_decoration')]を描いた[SCOPE.Custom('ArtifactQuality')]職人技の[SCOPE.Custom('ArtifactArticleWealth')]聖像。"
 gdp_merchant_luxury_contract.1551.desc: "周囲をさり気なく窺いながら、私は[religious_building_district.GetType.GetPrimaryBuildingType.GetName]の付近を怪しまれないように歩く。すれ違う人々には笑顔で会釈をし、建築を鑑賞する素振りをした。\n\nそうするうちに、私は一帯の端の最も人目につかない場所にあった、いかにも緩んで動かせそうな石造物に狙いを定めた。"
 gdp_merchant_luxury_contract.1551.a: "あとは頃合いを見計らうだけだ…"
 gdp_merchant_luxury_contract.1551.a.success: "石造物の一部を手に入れる"
 gdp_merchant_luxury_contract.1551.a.failure: "犯行を目撃される"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "聖なる石造物"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]の中心的宗教施設から記念として盗んできた石造物の一部分。"
 gdp_merchant_luxury_contract.1561.desc: "近づいてみると、[pilgrim.GetSheHe]がここに大勢いる人々と同じ巡礼者であることがすぐにわかった。旅の装備を身につけ、肌は陽に焼けている。\n\n話を聞くうちに、[pilgrim.GetHerHis]の名が[pilgrim.GetFirstName]であることがわかった。[pilgrim.GetSheHe]は幾度もの不幸に見舞われた末、[pilgrim.GetFaith.GetAdjectiveNoTooltip]の[pilgrim.GetFaith.HighGodName]への信仰を失っていた。今回の巡礼ですら、信仰を取り戻すことはできなかったようだ。\n\n涙の跡が残る、読み込まれた[pilgrim.GetFaith.ReligiousText]が目に入る。[pilgrim.GetHerHis]の苦悩を物語る証だ。"
 gdp_merchant_luxury_contract.1561.a: "[merchant.GetFaith.ReligiousText]に答えがある…"
 gdp_merchant_luxury_contract.1561.a.flavor: "[diplomacy_i|E] [diplomacy|E]能力と[piety_i|E] [piety_level|E]が試される"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip]が改宗する"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip]が勇気づけられる"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip]が激怒する"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "涙の跡が残る[religious_building_faith.ReligiousText|U]"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "信仰を失った悩める[pilgrim.GetFaith.GetAdherentNameNoTooltip]、[pilgrim.GetFirstName]が持っていた聖典。"
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]：知の中心地"
 gdp_merchant_luxury_contract.1601.desc: "[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]のあまりの規模に私は圧倒される。その敷地内も広間の中も、議論と探究にいそしむ大勢の学徒たちの活気に溢れていた。\n\n"
 gdp_merchant_luxury_contract.1601.dean: "終始[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )][scholar.GetWomanMan]が従者を引き連れて慌ただしく行き来し、同僚たちを尊大にあしらっている。どうやらここを取り仕切っている人物らしい。"
 gdp_merchant_luxury_contract.1601.sages: "敷地内の木の下に、年老いた[sage.GetWomanMan]が静かに腰を下ろしている。宇宙の深遠な謎について思索しているのか、それともただ居眠りをしているだけなのかはわからない。"
 gdp_merchant_luxury_contract.1601.library: "扉の前を通りかかると、[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )][scholar.GetWomanMan]が見事な図書室で一人、膨大な書物に囲まれていた。[scholar.GetSheHe|U]は至福の境地にあるかのように、静かに読書に没頭している。"
 gdp_merchant_luxury_contract.1601.physician: "別の部屋では、[physician.GetWomanMan]が一人、不気味な標本の数々を管理していた。動物や人間の標本に加え、さまざまな器具も並べられている。[physician.GetSheHe]が医師ならいいのだが…"
 gdp_merchant_luxury_contract.1601.student: "ひときわ騒がしい学生の集団に、私は目を引かれた。彼らは中庭の日陰で互いにからかい合いながら、大声で笑い、和やかに議論を交わしている。"
 gdp_merchant_luxury_contract.1601.botanist: "施設の静かな一角で、私は奇妙な植物や獣を集めた部屋を見つけた。[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )][botanist.GetWomanMan]がそれらを保存し、分類している。"
 gdp_merchant_luxury_contract.1601.a: "あれが学長に違いない。"
 gdp_merchant_luxury_contract.1601.a.flavor: "[diplomacy_i|E] [diplomacy|E]能力や[prestige_i|E] [prestige_level|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1601.a.tt: "学長に近づく"
 gdp_merchant_luxury_contract.1601.b: "あの老いた[sage.GetWomanMan]が気になる…"
 gdp_merchant_luxury_contract.1601.b.flavor: "[learning_i|E] [learning|E]能力や[piety_i|E] [piety_level|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1601.b.tt: "賢者に近づく"
 gdp_merchant_luxury_contract.1601.c: "図書館では必ず知識を得られる。"
 gdp_merchant_luxury_contract.1601.c.flavor: "[learning_i|E] [learning|E]や[diplomacy_i|E] [diplomacy|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1601.c.tt: "図書館に入る"
 gdp_merchant_luxury_contract.1601.d: "医術の道は実に興味深い。"
 gdp_merchant_luxury_contract.1601.d.flavor: "[learning_i|E] [learning|E]能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1601.d.tt: "医師に近づく"
 gdp_merchant_luxury_contract.1601.e: "あの学生たちは面白そうだ。"
 gdp_merchant_luxury_contract.1601.e.flavor: "[diplomacy_i|E] [diplomacy|E]や[prowess_i|E] [prowess|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1601.e.tt: "学生たちに近づく"
 gdp_merchant_luxury_contract.1601.f: "息をのむほど素晴らしい標本ばかりだ。"
 gdp_merchant_luxury_contract.1601.f.flavor: "[learning_i|E] [learning|E]や[diplomacy_i|E] [diplomacy|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1601.f.tt: "標本を見て回る"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "元々は[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]の収蔵物の一部だったもの。"
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName]は私の話を聞きながら、私の思考の流れを追い、私は自分のことを十分に伝えた。何しろ私は遠い異国から来た人間で、持参したこの紙きれには何の効力もないのだ。\n\n必要な説明を終え、私は期待を込めて[scholar.GetHerHim]の答えを待った。"
 gdp_merchant_luxury_contract.1602.dean.success: "[scholar.GetSheHe]は満面の笑みを浮かべ、私の…資質を証明する正式な書類を持ってきた。"
 gdp_merchant_luxury_contract.1602.dean.failure: "無表情だった[scholar.GetHerHis|U]の顔が強張り、気まずそうに私に退出するよう求めた。"
 gdp_merchant_luxury_contract.1602.sages: "私たちは延々と哲学について語り合った。これまでほとんど口にしてこなかった問いについて熟考している間に、いつの間にか空は暗くなっていて、一日の営みのざわめきが消えていくことにも気付かなかった。\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "[sage.Custom('GetYoungMiddleAgedOld')]の[sage.GetWomanMan]はようやく立ち上がり、ローブから何かを取り出すと、意味ありげに頷いてそれを私に手渡した。そして何事もなかったかのように立ち去っていったのだ。"
 gdp_merchant_luxury_contract.1602.sages.failure: "[sage.Custom('GetYoungMiddleAgedOld')]の[sage.GetWomanMan]はようやく立ち上がり、ローブの前をかき合わせると、そのまま何事もなかったかのように立ち去っていった。少なくとも、会話そのものは楽しめたが…"
 gdp_merchant_luxury_contract.1602.library: "私が[scholar.GetHerHis]の蔵書に興味があることを示すと、[scholar.GetSheHe]は[scholar.GetFirstName]と名乗った。その後しばらくの間、[scholar.GetSheHe]は研究の一環として読んだ書物や、これから読む予定の書物について次々と語り、一冊ごとに私の意見を求めた。\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "やがて[scholar.GetFirstNameNoTooltip]は子供のような笑顔を浮かべるようになり、別れの時が来ると、いたずらっぽくウインクをして小さな一冊を私に手渡した。"
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip]はすぐに私自身とその回答に興味を失い、不躾にも書物に向き直ったため、私はその場を後にした。"
 gdp_merchant_luxury_contract.1602.physician: "私は解剖学に関心があることを伝え、できる限り話に加わった。[physician.GetSheHe|U]は人体の仕組みについて長々と語り、骨の標本を手に取って見せながら説明した。\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.GetSheHe|U]は私の知識に感心したようで、[scholar.GetHerHis]の学生や同僚たちの無知を嘆きながら、一篇の文書を私に渡した。"
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetSheHe|U]は私の質問や要領を得ない説明にうんざりしたように目で天を仰ぎ、ほどなくしてもっともらしい言い訳をして私を部屋から追い出した。"
 gdp_merchant_luxury_contract.1602.student: "[student.Custom('GetPubName')]で、私は放蕩な若い学生たちに囲まれて賑やかな時を過ごした。私は旅の体験談を語り、次々と飛んでくる質問に答えていく。\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "酒場から酒場へと渡り歩いている間に、気付くと朝になっていた。道端で最後にひとしきり歌い騒いでから別れを告げると、学生の一人が私の手に何かを握らせた。最高の夜だ！"
 gdp_merchant_luxury_contract.1602.student.failure: "最初はうまくいっているように思えたが、彼らはすぐに私に飽きてしまったようで、私は気付けば場末の店でひとり杯を傾けていた。何かまずいことでも言っただろうか？"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName]は熱心に私をコレクションを見せ、選び抜かれた珍品や美しい収蔵品を次々と紹介してくれた。\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.GetSheHe|U]は私が興味を示したことを大いに喜び、熱心に頷きながら、収蔵品の希少価値や来歴について語った。\n\nやがて私が帰る時間になると、[botanist.GetSheHe]は私が特に気に入った品を、小さな贈り物として差し出してくれた。"
 gdp_merchant_luxury_contract.1602.botanist.failure: "どうやら私はコレクションの価値も、[botanist.GetHerHis]の説明も十分に理解できなかったらしい。[botanist.GetSheHe]はほどなくして、もう私がお呼びでないことを態度で示した…"
 gdp_merchant_luxury_contract.1602.a: "大切にしよう！"
 gdp_merchant_luxury_contract.1602.b: "まあ、何もないよりはましだろう。"
 gdp_merchant_luxury_contract.1611.desc: "学長は最初こそ素っ気ない態度だったが、私が遠く離れた[merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]で成功を収めた交易商人であることを伝えると、明らかに機嫌を良くして、芝居がかった調子で[scholar.GetFirstName]と名乗った。\n\n[scholar.GetSheHe|U]は私を私室に招待し、道すがら建物の風変わりな特徴や見どころを紹介してくれた。「さて、[merchant.GetTitledFirstNameNoTooltip]殿。私に何かお力添えできることはありますかな？」[scholar.GetSheHe]はそう言うと、にこやかな笑顔を浮かべた。"
 gdp_merchant_luxury_contract.1611.a: "ここで学べたらよかったのに…"
 gdp_merchant_luxury_contract.1611.a.flavor: "[diplomacy_i|E] [diplomacy|E]能力と[prestige_i|E] [prestige_level|E]が試される"
 gdp_merchant_luxury_contract.1611.a.success_critical: "名誉学位を授与される"
 gdp_merchant_luxury_contract.1611.a.success: "金と引き換えに名誉学位を授与される"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip]は気分を害する"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "名誉学位"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "[local_province.GetBaronyNameExplicitly]にある[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]の学長から授与された名誉学位。"
 gdp_merchant_luxury_contract.1621.desc: "私は賢者の深い瞑想をむやみに妨げないよう、慎重に近づいた。だが、不意を突かれたのは私の方だった！\n\n「ご一緒にいかがかな？」[sage.GetSheHe]はこちらを向きもせず、目も開けずに穏やかに尋ねると、「こちらへ来てお座りなさい」と言った。\n\n私はありがたくこの誘いを受け入れ、できるだけ礼儀正しく[sage.GetHerHim]の隣に腰を下ろした。\n\n「私は[sage.GetFirstName]だ」[sage.GetSheHe]がしわがれた声で言った。「この地を訪れた理由は？」"
 gdp_merchant_luxury_contract.1621.a: "わ…わかりません。"
 gdp_merchant_luxury_contract.1621.a.flavor: "[learning_i|E] [learning|E]能力と[piety_i|E] [piety_level|E]が試される"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetSheHe|U]は好感を持つ"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetSheHe|U]は失望する"
 gdp_merchant_luxury_contract.1631.desc: "私は、巻物で埋め尽くされた棚がどこまでも続く部屋へ足を踏み入れた。古いインクと紙のかび臭い香りが濃く漂っている。\n\n静かにしている学者にそっと近づくと、ようやく[scholar.GetHerHis]がこちらに目を向けた。最初は忙しそうに私を無視していたが、異国から来た私に興味を惹かれたのか、その眼差しはやがて和らいだ。 "
 gdp_merchant_luxury_contract.1631.a: "友よ、何を読んでいるんだ？"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.GetSheHe|U]はあなたの知識に感心する"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetSheHe|U]はあなたを田舎者だと思う"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc]$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "そこにはおぞましい光景が広がっていた。人骨、そしてそれ以外の無数の骨が整然と並ぶなか、[merchant.Custom2('QuirkAdjectivePosOrNeg', physician)][physician.GetWomanMan]がそれらをつついたり持ち上げたりしながら、数人の学生たちに講義している。\n\n[physician.GetSheHe|U]はようやく私に気付くと、訝しげな視線を向け、学生たちに混ざるよう手招きしてきた。この人物が[physician.GetFirstName]なのだろう。私は[physician.GetSheHe]が医術を修めた者であることを確認して安堵した。"
 gdp_merchant_luxury_contract.1641.a: "おや、それは[merchant.Custom('RandomSaintBone')|l]の骨ではありませんか？"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip]は感心する"
 gdp_merchant_luxury_contract.1641.a.failure: "[physician.GetFirstNameNoTooltip]の機嫌を損ねる"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "人間の[physician.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "医学教育の教材として使用される骨。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "人間の頭蓋骨"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "医学教育用の教材として使用される頭蓋骨。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "私はその一団に近づき、自己紹介をした。学生たちは輪になって私を取り囲み、互いに笑い合っていたが、よそ者である私が話しかけてきたことに、明らかに興味を示していた。\n\n私が遠く離れた[merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]から来た旅慣れた交易商人だと知ると、彼らの好奇心はいっそう高まった。そして私は、近くにある悪名高い店で…一杯やろうと誘われた。"
 gdp_merchant_luxury_contract.1651.a: "いざ酒場へ！"
 gdp_merchant_luxury_contract.1651.a.success: "学生たちを楽しませる"
 gdp_merchant_luxury_contract.1651.a.failure: "学生たちを退屈させる"
 gdp_merchant_luxury_contract.1661.desc: "私は奇妙な部屋に足を踏み入れ、思わず息をのんだ。こんなコレクションは見たことがない。数え切れないほどの色彩が溢れ、花弁や葉、毛皮に羽根が置かれている…五感に訴えかける、自然を凝縮したような場所だ。\n\n管理人に声をかけられ、私は唐突に現実に引き戻された。[botanist.GetHerselfHimself]は[botanist.GetFirstName]と名乗り、この場所を案内してくれると言う。"
 gdp_merchant_luxury_contract.1661.a: "ぜひ頼みます！"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip]はあなたが興味を示したことに好感を持つ"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip]は白ける"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "[owner.Custom('GetAnimalType')]の[newly_created_artifact.Custom('ArtifactAnimalTrinketType')]。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "[owner.Custom('GetAnimalType')]の羽根。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
