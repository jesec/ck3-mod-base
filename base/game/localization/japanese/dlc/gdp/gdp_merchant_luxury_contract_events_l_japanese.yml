l_japanese:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]：[local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "一行は[local_county.GetNameNoTierNoTooltip]の[local_province.Custom('GetTerrainLandPlural')]を超え、集落の近くに辿り着くと、[local_province.Custom('GetProvinceFoliageDescAdjective')]郊外に野営地を設けた。"
 gdp_merchant_luxury_contract.0001.desc.locals: "通りかかった村人たちに、この地にどんな野生動物がいるのかと片言で問いかけると、彼らは奇妙だが、はっきりとわかる身振りでその動物のまねをして見せた。それは"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "通りかかった村人たちに、この地にどんな野生動物がいるのか尋ねたところ、ある動物について話をしてくれた。その動物とは、"
 gdp_merchant_luxury_contract.0001.desc.jungle: "辺りは甘い蜜の香りに満ちている。"
 gdp_merchant_luxury_contract.0001.desc.mountain: "枝の間をさわやかな風が吹き抜けていく。"
 gdp_merchant_luxury_contract.0001.desc.desert: "灼熱の太陽が、静まり返った大地を焼き尽くすかのようだ。"
 gdp_merchant_luxury_contract.0001.desc.plains: "辺りはむせかえるような野生の花々の香りに満ちている。"
 gdp_merchant_luxury_contract.0001.desc.big_cat: "恐ろしい猫だった。"
 gdp_merchant_luxury_contract.0001.desc.small_cat: "狡猾な猫だった。"
 gdp_merchant_luxury_contract.0001.desc.bear: "獰猛な熊だった。"
 gdp_merchant_luxury_contract.0001.desc.monkey: "いたずら好きな猿だった。"
 gdp_merchant_luxury_contract.0001.desc.elephant: "威厳ある象だった。"
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "恐ろしい猫と獰猛な熊だった。"
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "獰猛な熊と威厳ある象だった。"
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "恐ろしい猫と威厳ある象だった。"
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "いたずら好きな猿と恐ろしい猫だった。"
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "いたずら好きな猿と威厳ある象だった。"
 gdp_merchant_luxury_contract.0001.desc.bird: "魅惑的な鳥だった。"
 gdp_merchant_luxury_contract.0001.desc.close: "少なくとも道は間違っていないようだ！"
 gdp_merchant_luxury_contract.0001.a: "野生の獣たちが待っている！"
 gdp_merchant_luxury_contract.0001.a.flavor: "[martial_i|E] [martial|E]、[intrigue_i|E] [intrigue|E]、[prowess_i|E] [prowess|E]の能力を発揮すると有利になる"
 gdp_merchant_luxury_contract.0001.a.tt: "荒野で#V 獣#!に分類される[domicile_artifact|E]の入手を試みる"
 gdp_merchant_luxury_contract.0001.b: "[local_barony.Custom('BaronyTownType')]で何が見つかるか試してみよう。"
 gdp_merchant_luxury_contract.0001.b.flavor: "[diplomacy_i|E] [diplomacy|E]や[stewardship_i|E] [stewardship|E]の能力や、[gold_i|E] [gold|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.0001.b.tt: "都市部で#V 獣#!に分類される[domicile_artifact|E]の入手を試みる"
 gdp_merchant_luxury_contract_back_to_town_tt: "[local_barony.Custom('BaronyTownType')]へ戻る"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "野外へ戻る"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]：現地の風土"
 gdp_merchant_luxury_contract.0011.desc: "見慣れぬ[local_province.GetBaronyNameExplicitlyNoTooltip]の路地を歩いていると、やがて[local_province.Custom('GetProvinceAdjective')]の[local_province.Custom('GetRegionalMarketTermGloss')]に行き着いた。そこでは嫌でも目を引く、身なりの良い地元の[rich_local.GetWomanMan]が、立ち話をしている。そして"
 gdp_merchant_luxury_contract.0011.cage: "その横には、檻に入れられた[rich_local.Custom('GetAnimalType')]がいた！"
 gdp_merchant_luxury_contract.0011.shoulder: "その肩には、[rich_local.Custom('GetAnimalType')]が乗っていた！"
 gdp_merchant_luxury_contract.0011.leashed: "その傍には、ひもでつながれた[rich_local.Custom('GetAnimalType')]がいた！"
 gdp_merchant_luxury_contract.0011.close: "\n\n近くの行商人たちから聞いたところによると、[rich_local.GetSheHe]は[rich_local.GetTitledFirstName]で、野生動物や珍しい獣に関心がある[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)]この地の名士らしい。\n\nもしかすると取引に応じてくれるかもしれない。"
 gdp_merchant_luxury_contract.0011.a: "「そこのお方、その見事な[rich_local.Custom('GetAnimalType')]についてお話を伺えませんか？」"
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.GetSheHe|U]はあなたに[rich_local.Custom('GetAnimalType')]を売る"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetSheHe|U]はあなたの申し出を断る"
 gdp_merchant_luxury_contract.0011.b: "自力で探そう…"
 gdp_merchant_luxury_contract.some_other_way: "獣を手に入れる他の方法を探さなくてはならない"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "私が自己紹介し、獣に惜しみない賛辞を送ると、[rich_local.GetTitledFirstName]は興味深げに私を上から下まで眺めた。\n\n"
 gdp_merchant_luxury_contract.0012.success: "[rich_local.GetHerHis|U]は私の言葉を聞くうちに次第に表情を和らげ、喜んで称賛を受け入れると、なぜ私がこのような遠方にまでやってきたのか、楽しげに尋ねてきた。\n\nそうしているうちに値段交渉が終わり、気づけば私は見事な[rich_local.Custom('GetAnimalType')]の誇り高き所有者となっていた！"
 gdp_merchant_luxury_contract.0012.failure: "しかしその表情はすぐに曇り、やがて眉をひそめ、軽蔑の笑みへと変わり、ついには従者に私を追い払うよう合図した。\n\nあの尊大な愚か者は、まるで#EMP 私自身#!が[rich_local.Custom('GetAnimalType')]であるかのように扱ったのだ…"
 gdp_merchant_luxury_contract.0012.a: "これは[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]中の話題になるだろう！"
 gdp_merchant_luxury_contract.0012.b: "待て、金ならもっと出せる！"
 gdp_merchant_luxury_contract.0012.c: "あの愚か者はどこに住んでいる？あの[rich_local.Custom('GetAnimalType')]は#EMP 必ず#!私のものにしてみせる！"
 gdp_merchant_luxury_contract.0012.c.success: "あなたは[rich_local.Custom('GetAnimalType')]を盗む"
 gdp_merchant_luxury_contract.0012.c.failure: "あなたは辛くも護衛から逃れる"
 gdp_merchant_luxury_contract.0012.d: "#weak *首を振って*#!「もういい、自分で捕まえる」"
 gdp_merchant_luxury_contract.0012.e: "もううんざりだ…"
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip]で[rich_local.GetTitledFirstNamePossessive]の屋敷を見つけ出すのは難しくなかった。私は酒場で地元のごろつきを何人か雇うと、日が暮れてから屋敷へ忍び寄った。\n\n"
 gdp_merchant_luxury_contract.0013.success: "警備を突破するのは拍子抜けするほど簡単で、気がつけば我々は数本先の通りまで逃げおおせていた。耳を澄ませても、騒ぎが起きたような気配はない。\n\n聞こえるのは、[rich_local.Custom('GetAnimalPossessive')]の小さな[rich_local.Custom('GetAnimalSoundPresent')]だけだ！"
 gdp_merchant_luxury_contract.0013.failure: "だが、私の運はそこで尽きた！計画は台無しになり、あの忌々しい[rich_local.Custom('GetAnimalPossessive')]の[rich_local.Custom('GetAnimalSoundPresent')]に引きつけられた護衛どもから、私は辛うじて逃げ延びた… \n\n[rich_local.GetFirstNamePossessiveNoTooltip]の追っ手は私を捜しているだろう！"
 gdp_merchant_luxury_contract.0013.a: "あの愚か者が最初から私に売っておけばよかったものを！"
 gdp_merchant_luxury_contract.0013.b: "今すぐこの地を離れなければ！"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]：動物寓話"
 gdp_merchant_luxury_contract.0021.desc: "迷路のように入り組んだ[local_barony.Custom('BaronyTownType')]の[local_province.Custom('GetRegionalMarketTermGloss')]の奥深くで、獣の臭いと鳴き声に引き寄せられた私は、古びた露店の後ろに[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)][dealer.GetWomanMan]が立っているのを見つけた。[local_province.Custom('GetProvinceAdjective')]空き地には、[local_province.Custom('GetRandomRegionalWood')]で作られた檻が所狭しと並んでいる。\n\n私が興味深げに見ていることに気付くと、[dealer.GetSheHe]は慌てて手招きをした。すばらしい光景だ！その中でも特に見事な[ROOT.Char.Custom('GetAnimalType')]に、私はすぐに目を奪われた。[ROOT.Char.Custom('GetAnimalFeature')]に見とれていると、哀れな様子の[dealer.Custom('GetAnimalType')]が抗議するように[dealer.Custom('GetAnimalSoundPresent')]を上げた。\n\n私が眺めている間、行商人は貪欲に目を光らせている。"
 gdp_merchant_luxury_contract.0021.a: "「美しい…この[ROOT.Char.Custom('GetAnimalType')]は絶対に手に入れたい！」"
 gdp_merchant_luxury_contract.0021.b: "[local_province.GetBaronyNameExplicitlyNoTooltip]の人間も値切りくらいするだろう…"
 gdp_merchant_luxury_contract.0021.b.success_critical: "見事な取引をまとめる"
 gdp_merchant_luxury_contract.0021.b.success: "いくらか節約する"
 gdp_merchant_luxury_contract.0021.b.failure: "事態を悪化させるだけになる"
 gdp_merchant_luxury_contract.0021.b.tt: "購入を断ることもできる"
 gdp_merchant_luxury_contract.0021.c: "#weak *指差して*#!「その[dealer.Custom('GetAnimalType')]をもらおう！」"
 gdp_merchant_luxury_contract.0021.d: "「見ているだけだ」"
 task_contract_success_pseudo: "#P 成功：#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "その商人は、生まれながらの商売上手といった風情でウインクしてみせた。我々は延々と値段交渉を続け、[ROOT.Char.Custom('GetAnimalPossessive')]の[ROOT.Char.Custom('GetAnimalHide')]のあらゆる特徴を吟味し、その[ROOT.Char.Custom('GetAnimalSoundPresent')]の質について議論した。\n\n"
 gdp_merchant_luxury_contract.0022.success: "私の説得力のある主張に、[dealer.GetSheHe]は少々たじろいだ様子だった。やがて[dealer.GetSheHe]は折れ、値段を大幅に下げてくれた。もっとも、根切りにも限度というものはあるが…"
 gdp_merchant_luxury_contract.0022.neutral: "私の主張は[dealer.GetHerHim]に多少なりとも響いたようで、獣の値段を少し下げてくれた。だが、それ以上譲ろうとはしない…"
 gdp_merchant_luxury_contract.0022.failure: "どうやら私は[dealer.GetHerHim]の気に障ったらしく、獣の値段をむしろ引き上げ、[dealer.GetSheHe]はますます頑なになった…"
 gdp_merchant_luxury_contract.0022.a: "「取引成立だ」"
 gdp_merchant_luxury_contract.0022.b: "「やっぱり、そちらの[dealer.Custom('GetAnimalType')]が欲しい…」"
 gdp_merchant_luxury_contract.0022.c: "#weak 首を振って#!「やめておこう」"
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "ついに目的を果たした私は、晴れて[ROOT.Char.Custom('GetAnimalType')]の所有者となった！誇り高き獣は逃げないように適切に収容され、我々の隊商とともに故郷へ向かう準備が整っている。\n\n [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の者たちがこれを見たら、きっと驚くだろう！"
 gdp_merchant_luxury_contract.0023.a: "さあ行こう。"
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]：獲物を追って"
 gdp_merchant_luxury_contract.0041.desc: "私は街道を離れ、獣の痕跡を求めて[local_province.Custom('GetTerrainType')]のさらに奥へと足を踏み入れた。[local_province.Custom('GetProvinceFoliageDesc')]をかき分けながら進むが、不気味な静寂を破るのは鳥の鳴き声だけだ。私は外套の前をきつくかき合わせた。\n\n茂みから離れようとした時、危うく見落とすところだったが、[local_province.Custom('GetProvinceGroundDesc')]の中に、紛れもない[ROOT.Char.Custom('GetAnimalTrack')]の足跡があった！加えて遠くから突然聞こえてきた[ROOT.Char.Custom('GetAnimalSound')]に、私は確信した。近くに[ROOT.Char.Custom('GetAnimalType')]が潜んでいる！"
 gdp_merchant_luxury_contract.0041.a: "逃げられる前に追え！"
 gdp_merchant_luxury_contract.0041.a.tt: "[THIS.Char.Custom('GetAnimalType')]を追跡する"
 gdp_merchant_luxury_contract.0041.b: "や、やっぱりやめて戻ろう！"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "[local_province.Custom('GetProvinceFoliageDesc')]をかき分けて進んでいると、視界の端に一瞬、[ROOT.Char.Custom('GetAnimalColor')]の[ROOT.Char.Custom('GetAnimalHide')]が見えた。私は飛び出しそうな心臓を抑え、覚悟して振り返った！\n\nだが目の前にいたのは、みすぼらしい小さな[ROOT.Char.Custom('GetAnimalType')]だった。まだ[ROOT.Char.Custom('GetAnimalChild')]だ。好奇心に満ちた大きな瞳で、恐れることなく私を見つめている。周囲を見回してみるが、親の姿も[ROOT.Char.Custom('GetAnimalGroup')]も見当たらない。どうやら本当に一匹きりのようだ…"
 gdp_merchant_luxury_contract.0042.a: "欲しいのは成獣だ！"
 gdp_merchant_luxury_contract.0042.a.tt: "大人の[THIS.Char.Custom('GetAnimalType')]の[artifact|E]を求めて捜索を続ける"
 gdp_merchant_luxury_contract.0042.b: "罠を仕掛けるという手もあるな…"
 gdp_merchant_luxury_contract.0042.b.success: "[ROOT.Char.Custom('GetAnimalChild')]を囮に使う"
 gdp_merchant_luxury_contract.0042.b.success.tt: "子供に加えて大人の[THIS.Char.Custom('GetAnimalType')]の[artifact|E]も獲得する"
 gdp_merchant_luxury_contract.0042.b.failure: "失敗して[ROOT.Char.Custom('GetAnimalChild')]が逃げ出す"
 gdp_merchant_luxury_contract.0042.c: "帰るとしよう。#EMP お前は#!一緒に来るんだぞ、おチビさん！"
 baby_creature_artifact_name: "[baby_creature.GetNameNoTooltip]の[ROOT.Char.Custom('GetAnimalChild')|U]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "[local_province.Custom('GetProvinceFoliageDesc')]の中で何かが閃いたのを見た私は、獣が忍び寄ってきたのかと思い、最悪の事態を覚悟した！\n\nだがそれは地元の罠猟師だった。私は半ば安堵したが、相手は矢をつがえたまま警戒の目を向けてくる。\n\n「はっ、あんたも[ROOT.Char.Custom('GetAnimalPlural')]を探しに来たのか？見ない顔だな」"
 gdp_merchant_luxury_contract.0043.a: "頼みがあるんだが…手を貸してくれないか？"
 gdp_merchant_luxury_contract.0043.b: "ぜひ一緒に狩りをしたい！"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip]が協力してくれる"
 gdp_merchant_luxury_contract.0043.b.success_tt: "成功率が上昇する"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip]に断られる"
 gdp_merchant_luxury_contract.0043.c: "私の邪魔をするな。"
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "従順な[ROOT.Char.Custom('GetAnimalChild')]を適当な空き地まで誘導するのはそう難しいことではなく、無事に縄でつなぐことができた。\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName]は頼もしい助けとなった。[local_province.Custom('GetTerrainType')]とそこに棲む生物に精通していたのだ。我々はほどなくして[ROOT.Char.Custom('GetAnimalPossessive')]の痕跡を見つけた！\n\n"
 gdp_merchant_luxury_contract.0044.desc: "見知らぬ土地での追跡には骨が折れる。何度も道を間違え、同じ道を入ったり来たりしたが、ようやく[ROOT.Char.Custom('GetAnimalPossessive')]の痕跡を見つけた！\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "案の定、子供のか細い[ROOT.Char.Custom('GetAnimalSoundParticiple')]に、大人の[ROOT.Char.Custom('GetAnimalType')]が引き寄せられた。我々は、[local_province.Custom('GetProvinceFoliageDesc')]の向こうから慎重にこちらの様子をうかがう獣を見守った。そしてついに成獣が警戒しながら[ROOT.Char.Custom('GetAnimalChild')]に近付いた時、我々は罠を発動させた！"
 gdp_merchant_luxury_contract.0044.bait_failure: "…はずだった。しばらくの間はおとなしく座り、か細い[ROOT.Char.Custom('GetAnimalSoundParticiple')]を上げていたが、忌々しくも獣は突然全力で駆け出した。縄を引きちぎって逃げ去り、[local_province.Custom('GetProvinceFoliageDesc')]の中へ消えてしまったのだ…"
 gdp_merchant_luxury_contract.0044.success: "我々は幸運にも、[local_province.Custom('GetProvinceFoliageDesc')]の中で油断している[ROOT.Char.Custom('GetAnimalType')]と遭遇した。激しく[ROOT.Char.Custom('GetAnimalSoundParticiple')]を響かせ暴れる[ROOT.Char.Custom('GetAnimalColor')]の獣に、我々は網をかぶせた！"
 gdp_merchant_luxury_contract.0044.failure: "だが事態はすぐに悪い方向へ転じた。姿を捉えたと思ったのも束の間、獣は[ROOT.Char.Custom('GetAnimalSoundParticiple')]を上げて[ROOT.Char.Custom('GetAnimalColor')]の影となり、[local_province.Custom('GetTerrainLand')]の中へと逃げてしまった。怯えきってしまい、捕獲するのは不可能だった。"
 gdp_merchant_luxury_contract.0044.a: "見事な二匹が揃ったぞ！"
 gdp_merchant_luxury_contract.0044.b: "忌々しい獣め！"
 gdp_merchant_luxury_contract.0044.c: "捕まえたぞ！"
 gdp_merchant_luxury_contract.0044.d: "忌々しい獣め！"
 gdp_merchant_luxury_contract.0044.e: "[hunter.GetFirstNameNoTooltip]、[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]を見てみたくないか？"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]：密猟"
 gdp_merchant_luxury_contract.0051.desc: "[local_province.Custom('GetProvinceGroundDescAdjective')]村を訪れ、現地の野生動物について尋ねた。すると村長は深刻な面持ちで立ち去るよう警告してきた。「[rich_local.GetName]」という地元の有力者が、この辺りで[rich_local.Custom('GetAnimalPlural')]を狩っているのだという。\n\n我々がその場を離れようとした時、[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)]村人が現れ、小声で囁いた。[rich_local.GetTitleAsNamePossessiveNoTooltip]の[rich_local.Custom('GetAnimalPlural')]を一匹捕まえることなど簡単だと！\n\n大胆な提案だが、見逃すには惜しい好機かもしれない。"
 gdp_merchant_luxury_contract.0051.a: "[rich_local.Custom('GetAnimalType')]だと？今すぐ行こう！"
 gdp_merchant_luxury_contract.0051.a.flavor: "地元の人間が罰せられるかもしれない…"
 gdp_merchant_luxury_contract.0051.a.tt: "[rich_local.GetShortUIName]の獲物の密猟を試みる"
 gdp_merchant_luxury_contract.0051.b: "[rich_local.GetTitleAsNameNoTooltip]を敵に回す気はない…"
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "案内役の[hunter.GetFirstName]に導かれ、我々は[local_province.Custom('GetProvinceFoliageDesc')]の中を足早に進み、[local_province.Custom('GetTerrainTypePlural')]をかなりの速さで突き進んだ。やがて開けた場所に差しかかると、[hunter.GetSheHe]が突然立ち止まり、耳を澄ませた。\n\n「静かに！」[hunter.GetSheHe]はそう囁くと私を物陰へ引き寄せ、「すぐそこだ」と言った。\n\n直後、狩猟隊が轟音を立てながら我々の脇を通り過ぎ、[local_province.Custom('GetProvinceGroundDesc')]を踏み荒らしていった。離れたところから、猟師たちの叫び声が響いている。\n\nそして私は[rich_local.Custom('GetAnimalType')]の[rich_local.Custom('GetAnimalSound')]を耳にしたのだった！"
 gdp_merchant_luxury_contract.0052.a: "来たぞ！網をくれ！"
 gdp_merchant_luxury_contract.0052.a.success: "[rich_local.Custom('GetAnimalType')]を捕まえる"
 gdp_merchant_luxury_contract.0052.a.neutral: "[rich_local.Custom('GetAnimalType')]を捕まえ損ねる"
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('GetAnimalType')]に傷を負わされる"
 gdp_merchant_luxury_contract.0052.b: "隠れろ！もう終わりだ！"
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('GetAnimalType')]が逃げ去る"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "村へ戻ると、村長が怒鳴りながら飛び出してきた。[rich_local.GetTitledFirstNamePossessive]の手下たちが密猟者を探しにきたというのだ！\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName]は縄で繋がれた[rich_local.Custom('GetAnimalType')]を見て気まずそうな顔をしたが、誇らしげな態度は隠せていない。"
 gdp_merchant_luxury_contract.0053.failure: "村人たちが厳しい視線を向ける中、[hunter.GetFirstName]はうなだれて地面を見つめている。\n\n[hunter.GetSheHe]が自宅へ戻ろうとすると、繋がれた[hunter.Custom('GetAnimalType')]が現れ、[local_province.Custom('GetProvinceGroundDesc')]を[hunter.Custom('GetAnimalWalkParticiple')]した。"
 gdp_merchant_luxury_contract.0053.a: "「なんて素晴らしい生物だ…」"
 gdp_merchant_luxury_contract.0053.b: "「…誰が盗んだのか、[rich_local.GetTitleAsNameNoTooltip]に教えてやろう！」"
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip]はあなたの大胆さに感銘を受ける"
 gdp_merchant_luxury_contract.0053.c: "「密猟なんてするんじゃなかった…」"
 gdp_merchant_luxury_contract.0053.d: "「…だがお前のような人間は役に立ちそうだな、[hunter.GetFirstNameNoTooltip]」"
 gdp_merchant_luxury_contract.0053.e: "「[hunter.Custom('GetAnimalType')]を飼っていたなんて聞いていないぞ！」"
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]：[local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "今朝、我々が長らく目指していた目的地、[local_province.GetBaronyNameExplicitlyNoTooltip]の[local_barony.Custom('BaronyTownType')]が[local_province.Custom('GetTerrainLandPlural')]の向こうに姿を現した。"
 gdp_merchant_luxury_contract.1001.desc.locals: "門の前で通りがかった村人たちに拙い[local_county.GetCountyData.GetCulture.GetLanguage.GetName]で道を尋ねると、難儀しながらも応じてくれた。彼らが指したのは、"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "門の前で通りがかった村人たちに[local_county.GetCountyData.GetCulture.GetLanguage.GetName]で問いかけた。彼らが指したのは、"
 gdp_merchant_luxury_contract.1001.desc.religious: "[religious_building_province.GetBaronyNameExplicitlyNoTooltip]にある、壮麗で神聖な霊廟だった。"
 gdp_merchant_luxury_contract.1001.desc.scholarly: "[scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]にある、賢者たちが集う学問の中心地だった。"
 gdp_merchant_luxury_contract.1001.desc.fallback: "地元の市場だった。"
 gdp_merchant_luxury_contract.1001.a: "地元の[local_province.Custom('GetRegionalMarketTerm')]なら何か見つかるはずだ。"
 gdp_merchant_luxury_contract.1001.a.flavor: "[stewardship_i|E] [stewardship|E]能力や[gold_i|E] [gold|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1001.a.tt: "市場で#V 珍品#!に分類される[domicile_artifact|E]の入手を試みる"
 gdp_merchant_luxury_contract.1001.d: "壮大な[local_province.Custom('GetRegionalMarketTerm')]が我々を呼んでいる！"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "その聖地を訪ねよう。"
 gdp_merchant_luxury_contract.1001.e.flavor: "[piety_i|E] [piety|E]や[learning_i|E] [learning|E]能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1001.e.tt: "宗教施設で#V 珍品#!に分類される[domicile_artifact|E]の入手を試みる"
 gdp_merchant_luxury_contract.1001.f: "ここでたくさんのことを学べるはずだ。"
 gdp_merchant_luxury_contract.1001.f.flavor: "[learning_i|E] [learning|E]や[diplomacy_i|E] [diplomacy|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1001.f.tt: "学問の中心地で#V 珍品#!に分類される[domicile_artifact|E]の入手を試みる"
 gdp_merchant_luxury_contract.1001.return.religious: "聖地へ戻ろう…"
 gdp_merchant_luxury_contract.1001.return.scholarly: "学問の中心地を探そう…"
 gdp_merchant_luxury_contract.1001.return.urban: "とりあえず市場へ行こう…"
 gdp_merchant_luxury_contract.1001.give_up: "いや、やっぱりやめだ！"
 gdp_merchant_luxury_contract.1001.fallback: "手ぶらで[local_province.GetBaronyNameExplicitlyNoTooltip]を去るつもりはない。"
 gdp_merchant_luxury_contract.1001.fallback.flavor: "[local_province.Custom('GetRegionalMarketTermGloss')]で何かしらの装身具を見つける"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]：商業の中心地"
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip]の[local_province.GetTitle.Custom('BaronyTownType')]は活気に満ちている。ありとあらゆる品を求めて地元住民や旅人たちが集う[local_province.Custom('GetProvinceAdjective')][local_province.Custom('GetRegionalMarketTermGloss')]では、様々な光景が広がり、喧騒が行き交い、色々な匂いが混じり合っている。\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "薄暗い一角で、不機嫌そうな浮浪児が目に留まった。[urchin.GetHerHis]は小さな目で、絶え間なく行き交う人々を静かに観察している。"
 gdp_merchant_luxury_contract.1101.antiques: "[local_province.Custom('GetRandomRegionalWood')]製の小物や、くすんだ金属製品が所狭しと並ぶ古物商の露店に私は興味を引かれ、それが[dealer.Custom('GetYoungMiddleAgedOld')]の店主を大いに喜ばせた。"
 gdp_merchant_luxury_contract.1101.bookseller: "みすぼらしい店の擦り切れた[ROOT.Char.Custom('RegionalFabric')]の天幕の下には、古びた巻物や書物が山積みになって端に寄せられている。店主は[dealer.Custom('GetYoungMiddleAgedOld')]の[dealer.GetWomanMan]だ。"
 gdp_merchant_luxury_contract.1101.travelers: "近くの広場には、旅慣れた様子の[traveler.GetCulture.GetCollectiveNoun]が陣取っている。服装や話し方から、[local_province.GetCulture.GetName]の地元住民ではないことが明らかだ。"
 gdp_merchant_luxury_contract.1101.tavern: "通りの向こうにある酒場から下品な歓声が響き、荒くれた博打打ちが目に入った。[gambler.GetSheHe]は今しがた巻き上げたのであろう財布を弄んでいて、対戦相手と思しき人物は打ちひしがれている。"
 gdp_merchant_luxury_contract.1101.merchant: "ふと見ると、身なりの良い[other_merchant.GetWomanMan]が、遅々として進まない隊商を大声で叱責している。どうやら私と同じ、地元の交易商人らしい。"
 gdp_merchant_luxury_contract.1101.a: "あの子供…#EMP ずる賢そう#!だ。"
 gdp_merchant_luxury_contract.1101.a.flavor: "[intrigue_i|E] [intrigue|E]と[diplomacy|E]の能力を発揮すると有利になる"
 gdp_merchant_luxury_contract.1101.a.tt: "浮浪児に話を聞いてみる"
 gdp_merchant_luxury_contract.1101.b: "この店、何か面白い品があるかもしれない…"
 gdp_merchant_luxury_contract.1101.b.flavor: "[learning_i|E] [learning|E]能力や[gold_i|E] [gold|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1101.b.tt: "興味深い骨董品の購入を試みる"
 gdp_merchant_luxury_contract.1101.c: "興味深い本が1冊や2冊あるはずだ。"
 gdp_merchant_luxury_contract.1101.c.flavor: "[learning_i|E] [learning|E]能力や[gold_i|E] [gold|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1101.c.tt: "興味深い書物の購入を試みる"
 gdp_merchant_luxury_contract.1101.d: "あの[traveler.GetCulture.GetCollectiveNounNoTooltip]たちは、きっと様々なものを見てきたに違いない。"
 gdp_merchant_luxury_contract.1101.d.lingua: "私の[traveler.GetCulture.GetLanguage.GetNameNoTooltip]を試す好機だ。"
 gdp_merchant_luxury_contract.1101.d.flavor: "[diplomacy_i|E] [diplomacy|E]や[learning_i|E] [learning|E]の能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1101.d.tt: "旅人たちと語らう"
 gdp_merchant_luxury_contract.1101.e: "賭け事の機会は逃せない…"
 gdp_merchant_luxury_contract.1101.e.flavor: "[intrigue_i|E] [intrigue|E]能力を活かすと有利になる"
 gdp_merchant_luxury_contract.1101.e.tt: "博打打ちから何か勝ち取れないか試してみる"
 gdp_merchant_luxury_contract.1101.f: "ああ、同業者なら私を理解してくれるかもしれない。"
 gdp_merchant_luxury_contract.1101.f.flavor: "[stewardship_i|E] [stewardship|E]能力や[prestige_i|E] [prestige_level|E]を活かすと有利になる"
 gdp_merchant_luxury_contract.1101.f.tt: "交易商人の話を聞いてみる"
 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstNamePossessive|U]の警戒心を解くのは実に骨が折れる。私は通行人の悪口を言い、[merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]の荒れた通りの話をして、[urchin.GetHerHim]の気を引こうとした。\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "私が遠い土地の話や交易商という仕事の良さを語ると、[urchin.GetHerHis]は興味を引かれたようだった。私が取引を持ちかけようとすると、[urchin.GetSheHe]は自分を連れて行ってくれるなら、装身具をただで譲ると言い出した！"
 gdp_merchant_luxury_contract.1102.urchin.success: "そろそろ打ち解けられただろうと感じた私は、率直に装身具の値段を尋ねみた。すると[urchin.GetSheHe]はずる賢そうな笑みを浮かべて、値段を告げた。"
 gdp_merchant_luxury_contract.1102.urchin.failure: "そろそろ打ち解けられただろうと感じた私は、率直に装身具の値段を尋ねみた。すると[urchin.GetSheHe|U]は唇を歪めて、失せろと言い放った。"
 gdp_merchant_luxury_contract.1102.antiques: "私は抜け目のない店主としばらくの間、骨董品の出来栄えや年代、保存状態について議論を重ねた。\n\nだが結局、[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )]食わせ者との交渉は膠着状態に陥った。"
 gdp_merchant_luxury_contract.1102.antiques.success: "値段は悪くない。思っていたよりずっと良いくらいだ。"
 gdp_merchant_luxury_contract.1102.antiques.failure: "結果に満足しているとは言い難く、してやられたという気分だ。"
 gdp_merchant_luxury_contract.1102.bookseller: "私は抜け目のない店主としばらくの間、書物の出所や年代、保存状態について議論を重ねた。\n\nだが結局、[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )]食わせ者との交渉は膠着状態に陥った。"
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "彼らも多少は私を受け入れてくれたらしい。どうやら私が現れたことが、今日一番の出来事だったようだ。私たちはほどなくして、互い旅の話を語りはじめた。"
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nやがて私たちは、[local_province.GetBaronyNameExplicitly]での体験や苦労話に笑いながらパンを分け合った。そして[traveler.GetFirstName]は別れ際、私を優しく抱擁し、小さな包みを手渡してくれた。"
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nいくつか小話を披露したものの、すぐに話題は尽きてしまった。[traveler.GetCulture.GetCollectiveNoun]たちは、私にどこかに行ってほしそうにしている。"
 gdp_merchant_luxury_contract.1102.tavern: "勝負はほぼ互角だった。勝ったり負けたりを繰り返しながら、互いに金をやり取りし、軽口を叩き合う。だが、[gambler.GetFirstName]が食えない相手であることは間違いなかった。\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "[merchant.GetFaith.WealthGodName]は今日、私に微笑んでいる！序盤から圧倒的な優位に立った私に、[gambler.GetFirstNamePossessiveNoTooltip]は呆然とし、悪態をついた。徐々に追い詰められた[gambler.GetSheHe]はたまらず出ていき、通りにサイコロを投げつけた！"
 gdp_merchant_luxury_contract.1102.tavern.failure: "時間はかかったが、私は何とか優位に立つことができた。私が勝ち取った金を眺めてほくそ笑んでいると、[gambler.GetFirstNamePossessiveNoTooltip]の我慢は限界に達し、今日はここまでにしようと言った。"
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "[gambler.GetSheHe]が本気を出すまでにそう時間はかからなかった。私はあっという間に負けを重ね、財布の中身も寂しくなり、我慢も限界に達した。ほくそ笑む[gambler.GetFirstNamePossessiveNoTooltip]を後に残し、私はむっつりとその場から退散した。"
 gdp_merchant_luxury_contract.1102.merchant: "[local_province.Custom('GetRegionalMarketTermGloss')]近くの静かな事務所で、私は[other_merchant.GetTitledFirstName]と延々と商売の話をした。遠方にいる共通の知り合いに思いを巡らせながら、互いの成功談を語り合ったのだ。\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "私たちはすっかり意気投合し、パンをつまみながら[other_merchant.Custom('RegionalDrink')]を酌み交わして、商売の知識や、将来的にお互いのためになり得ることについて語り合った。[other_merchant.GetFirstNameNoTooltip]は別れを惜しみつつ、餞別として上等な見本品を贈ってくれた。"
 gdp_merchant_luxury_contract.1102.merchant.failure: "どうにも共通の話題は見つからなかった。私たちは互いの自慢話と、有益な情報をくれる気配がない相手にうんざりした。私はほどなくして、退屈な[other_merchant.GetWomanMan]に別れを告げた。"
 gdp_merchant_luxury_contract.1102.a: "これなら申し分ない。"
 gdp_merchant_luxury_contract.1102.b: "これで妥協するしかないか…"
 gdp_merchant_luxury_contract.1111.desc: "私は[local_province.Custom('GetProvinceAdjective')]の通りを渡り、[urchin.Custom('GirlBoy')]に近づいた。[urchin.GetHerHis]は私に気付くと、こちらの意図を探るように鋭い目を向けてくる。私は敵意がないことを示しながら、[urchin.GetSheHe]が寄りかかっている壁際へ歩み寄った。\n\n[urchin.GetHerHis]の手の中で、装身具らしい何かが魅力的な輝きを放っている。だが私の視線に気付くや否や、[urchin.GetSheHe]は素早くそれを隠してしまった。「何か用？」[urchin.GetSheHe]が吐き捨てるように言う。「[urchin.GetFirstName]ってんだ。この辺りを#EMP 縄張り#!にしてる」"
 gdp_merchant_luxury_contract.1111.a: "君は色々と知っていそうだな。"
 gdp_merchant_luxury_contract.1111.a.success_critical: "[urchin.GetHerHis]の信頼を得る"
 gdp_merchant_luxury_contract.1111.a.success: "[urchin.GetHerHis]の盗品を買う"
 gdp_merchant_luxury_contract.1111.a.failure: "[urchin.GetHerHis]に軽蔑される"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "もともとは、[local_province.GetBaronyNameExplicitly]の街中で[urchin.GetFirstName]がくすねた品だ。"
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip]の指輪"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$$gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "[local_county.GetAdjectiveNoTooltip]のブローチ"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$$gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip]の首飾り"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$$gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "私は並べられた品々を眺めながら、気のない素振りで気分の高揚を隠した。もっとも、その演技が店主にどれだけ通じているのかはわからない。\n\nやがて私は、ひときわ珍しい品に心を奪われた。その逸品の様式は、時の流れを経て、生まれ故郷でさえ異国めいた趣を醸し出している。"
 gdp_merchant_luxury_contract.1121.a: "値段交渉といこう…"
 gdp_merchant_luxury_contract.1121.a.success_critical: "非常に良い値段まで値切る"
 gdp_merchant_luxury_contract.1121.a.success: "良い値段まで値切る"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetSheHe|U]はなかなか値切りに応じない"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "古い[artifact.GetName]"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc]長い年月を経て傷んでおり、もはや実戦には使えない。"
 gdp_merchant_luxury_contract.1121.artifact.bowl: "古い[local_province.GetCounty.GetCulture.GetNameNoTooltip]の鉢"
 gdp_merchant_luxury_contract.1121.artifact.plate: "古い[local_province.GetCounty.GetCulture.GetNameNoTooltip]の皿"
 gdp_merchant_luxury_contract.1121.artifact.urn: "古い[local_province.GetCounty.GetCulture.GetNameNoTooltip]の壺"
 gdp_merchant_luxury_contract.1131.desc: "私は並べられた書物を眺めながら、気のない素振りで気分の高揚を隠した。もっとも、その演技が店主にどれほど通じているのかはわからない。\n\nやがて私は、一冊の装丁に心を奪われた。ひときわ目を引く書物で、見たところ希少でありながら見過ごされてきたもののようだ。"
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc][local_province.GetBaronyNameExplicitly]の商人から入手した。"
 gdp_merchant_luxury_contract.1141.desc: "私は親しげな笑みを浮かべながら、その一団を率いる[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )]人物に歩み寄った。よそ者同士、話が合うかもしれない。\n\nその[traveler.GetWomanMan]は[traveler.GetFirstName]と名乗った。私も続いて、はったり半分、冗談半分で、こんな自己紹介をした。「[merchant.GetNameNoTooltip]だ。もちろん聞いたことがあるだろう？」"
 gdp_merchant_luxury_contract.1141.a: "さぞ面白い経験をしてきたに違いない！"
 gdp_merchant_luxury_contract.1141.a.flavor: "[diplomacy_i|E] [diplomacy|E]能力と[prestige_i|E] [prestige_level|E]が試される"
 gdp_merchant_luxury_contract.1141.a.success: "[traveler.GetFirstNameNoTooltip]と意気投合する"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip]があなたにうんざりする"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc][local_province.GetBaronyNameExplicitly]で商人から入手した。長い年月を経て傷んでおり、もはや実戦には使えない。"
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip]のブローチ"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$[local_province.GetBaronyNameExplicitly]で旅人から入手した。"
 gdp_merchant_luxury_contract.1151.desc: "薄汚い垂れ幕をめくって中へ入ると、ならず者や流れ者たちがたむろしていた。その中央では、博打打ちが上機嫌で金を数えている。\n\n私が向かいに腰を下ろすと、その[gambler.GetWomanMan]は眉を上げて私を値踏みした。「勝負したいのか？」と[gambler.GetSheHe]が笑った。「[gambler.GetFirstName]だ。一文無しになっても泣くなよ」"
 gdp_merchant_luxury_contract.1151.a: "勝負だ。"
 gdp_merchant_luxury_contract.1151.a.flavor: "[intrigue_i|E] [intrigue|E]能力と運が試される"
 gdp_merchant_luxury_contract.1151.a.success: "[gambler.GetHerHim]を完全に打ち負かす"
 gdp_merchant_luxury_contract.1151.a.failure: "いくらかの金を勝ち取る"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "いくらかの金を失う"
 gdp_merchant_luxury_contract.1151.artifact.dice: "博打打ちの幸運のサイコロ"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "苦労の末手に入れた、[local_province.GetBaronyNameExplicitly]のならず者の博打打ち、[gambler.GetFirstName]が使っていたサイコロ。"
 gdp_merchant_luxury_contract.1161.desc: "商人の愚痴を遮り、私は[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の代表であると名乗った。拠点は[merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]にあり、ここへは仕事で来たのではないと付け加える。\n\nすると商人は[other_merchant.GetName]と名乗り、[other_merchant.GetCapitalLocation.GetBaronyNameExplicitly]の出身で、ここでは[merchant_good.GetName]を扱っていると教えてくれた。お互いの素性が分かると、[other_merchant.GetSheHe]は近くで私をもてなしてくれると言った。"
 gdp_merchant_luxury_contract.1161.a: "話題は尽きないだろう。"
 gdp_merchant_luxury_contract.1161.a.flavor: "[stewardship_i|E] [stewardship|E]能力と[prestige_i|E] [prestige_level|E]が試される"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip]はあなたに心を開く"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip]は頑として心を開かない"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "布の見本"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]産の[other_merchant.Custom('RegionalFabric')]の見本。商人たちの取引に用いられる。"
 gdp_merchant_luxury_contract.1161.artifact.gem: "宝石の見本"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]産の貴石の見本。商人たちの取引に用いられる。"
