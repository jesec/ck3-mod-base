 gdp_republic_city_stroll_decision_desc: "商人として市場の需要を予測して富を築くには、時代の流れをつかむことが肝心だ。では、どうすれば時代の流れをつかめるのか？街の人々と交流し、[GetPlayer.GetCapitalLocation.GetNameNoTooltip]の空気を感じ取るのだ！"
