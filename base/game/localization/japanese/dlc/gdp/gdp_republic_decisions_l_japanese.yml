l_japanese:
 gdp_adopt_republic_government_decision: "共和制の理念を受け入れる"
 gdp_adopt_republic_government_decision_desc: "日々の苦労に疲れ果てた群衆が通りを行き交うのを眺めながら、私は思う。統治者の道とは、本当に我々の[ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l]的なあり方しかないのだろうか。生まれながらの権利だけに頼らず、自ら認められることで忠誠を勝ち取ることはできないのか。新たな理念を受け入れ、我々の生き方を作り変える時が来たのかもしれない。"
 gdp_adopt_republic_government_decision_tooltip: "共和制の理念を受け入れ、[GetGovernment('republic_government').GetName]になる"
 gdp_adopt_republic_government_decision_confirm: "共和制の理念を受け入れる"
 liege_has_granted_city_charter: "あなたの[liege|E]は、あなたに都市特許状を授与している"
 liege_has_granted_city_charter_duration: "あなたの[liege|E]は、あなたに都市特許状を授与している#weak （[GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )]まで）#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X あなたは今後[GetTitleByKey('e_hre').GetName]の[elector|E]ではなくなります#!"
 gdp_adopt_republican_ways_decision: "共和制の流儀を取り入れる"
 gdp_adopt_republican_ways_decision_desc: "かつて我々を結びつけていた集会は、市場や城壁の発展とともに、もはや従来の役割を果たせなくなっている。[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]を繁栄させるには、古い部族の流儀を捨て、都市を共和制のもとで自治させなければならない。"
 gdp_adopt_republican_ways_decision_tooltip: "[tribal|E]の流儀を捨てて[republic|E]になる"
 gdp_adopt_republican_ways_decision_confirm: "共和制の流儀を取り入れる"
 gdp_tribal_capital_becomes_city_tt: "あなたの[realm_capital|E]が[city_holding|E]になる"
 gdp_other_tribal_holdings_become_castles_tt: "領国内のほかのすべての[tribal_holdings|E]が[castle_holdings|E]になる"
 gdp_tribal_vassals_will_feudalize_tt: "あなたの[tribal|E]の[vassals|E]が、[feudal|E]または[clan|E][government|E]を採用する"
 convert_to_feudalism_from_republic_decision: "[ROOT.Char.Custom('GetTribalReformGovernment')|U]の流儀を取り入れる"
 convert_to_feudalism_from_republic_decision_desc: "議会や手続き、官僚機構は我々の政府の実効性を損なっている。[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]を繁栄させるには、こうした足かせを取り除かねばならない。"
 convert_to_feudalism_from_republic_decision_confirm: "[ROOT.Char.Custom('GetTribalReformGovernment')|U]の流儀を取り入れる"
 convert_to_feudalism_from_republic_decision_tooltip: "[government|E]タイプを変更する"
 patricians_becomes_merchants_desc: "[patrician|E]の[vassals|E]が[merchants|E]になる"
 gdp_restore_roman_republic_decision: "ローマ共和国を復興させる"
 gdp_restore_roman_republic_decision_desc: "ローマ共和国は自由と繁栄の象徴であり、誰もが手本とすべき存在だった。しかし、ローマ共和国もまた、時の流れとともに衰退してしまった。今こそ再び命を吹き込み、その栄光を取り戻す時だ！"
 gdp_restore_roman_republic_decision_tooltip: "ローマ共和国を復興させる"
 gdp_restore_roman_republic_decision_confirm: "ローマ共和国を復興させる"
 restore_roman_republic_make_rome_capital_desc: "[GetTitleByKey('c_roma_urbs').GetName]を[realm_capital|E]に定めることができる"
 assembly_members_appointed_as_senators_desc: "すべての[assembly|E]議員が[republic_senators|E]に任命される"
 gdp_popular_mandate_decision: "民衆の支持を求める"
 gdp_popular_mandate_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の人々は私を慕っている。この支持を今こそ活用し、私の続投を後押しするよう民衆を結集させよう。議会では民衆の声にも重みがある。民衆を味方につけた[ROOT.Char.GetTitleAsNameNoTooltip|l]は、投票でより有利な立場に立てる。\n\n民衆からの支持をいくらか失うことになるが、票は今のうちに確保しておくべきだ。"
 gdp_popular_mandate_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の[popular_opinion|E]を消費して、次の[election|E]で追加票を得る"
 gdp_popular_mandate_decision_confirm: "私を支持するよう民衆に働きかける"
 gdp_popular_mandate_no_active_mandate_desc: "まだ民衆の支持を得ていない"
 gdp_civic_labor_decision: "市民労働力を動員する"
 gdp_civic_labor_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の住民からの好意は、金と同じくらい確かな資源だ。その好意をいくらか消費する代わりに、市民に建設事業への労働力と専門知識の提供を求めよう。"
 gdp_civic_labor_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の[popular_opinion|E]を消費して、[ROOT.Char.GetTitleAsNameNoTooltip|l]の本拠地建設でボーナスを獲得する"
 gdp_civic_labor_decision_confirm: "市民に協力を求める"
 gdp_popular_gifts_decision: "後援を募る"
 gdp_popular_gifts_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の人々から高く評価されている私は、それを利用できる。[ROOT.Char.GetTitleAsNameNoTooltip|l]が有力なパトリシアンから贈り物を申し出られていると公にすれば、貴族たちは互いに負けまいと、より豪華な贈り物を競って差し出すだろう。誰が競り勝とうとも、宮廷は潤う。"
 gdp_popular_gifts_decision_tooltip: "[popular_opinion|E]を消費し、裕福なパトリシアン同士が歓心を得ようと競い合う状況を作り、宮殿に[gold|E]と贈り物をもたらす"
 gdp_popular_gifts_decision_confirm: "贈り物を募る"
 gdp_popular_gifts_artifact_tt: "ランダムな贈り物の[artifact|E]を受け取る"
 gdp_glorification_decision: "称揚を受け入れる"
 gdp_glorification_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の人々は、政治的な支持や人気を超えた敬意を私に寄せている。彼らは私を指導者としてではなく、都市そのものを体現する存在として称えたいのだ。この瞬間をありのまま受け入れよう。"
 gdp_glorification_decision_tooltip: "市民による称揚を受け入れる。一生に一度の栄誉だ。"
 gdp_glorification_decision_confirm: "祝賀を受け入れよう"
 gdp_glorification_artifact_tt: "[artifact|E]「#V $gdp_glorification_artifact_name$#!」を受け取る"
 gdp_glorification_artifact_name: "都市の栄光のメダル"
 gdp_glorification_artifact_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市民が、敬愛する[ROOT.Char.GetTitleAsNameNoTooltip|l]に敬意を表して贈った記念メダル。"
 gdp_popular_mandate_decision_toast: "民衆の支持を獲得した"
 gdp_civic_labor_decision_toast: "市民労働力を動員した"
 gdp_popular_gifts_decision_toast: "パトリシアンたちが呼びかけに応じる"
 gdp_glorification_decision_toast: "都市を挙げて祝う"
 gdp_fund_alms_decree_decision: "首都で施しを行う"
 gdp_fund_alms_decree_decision_desc: "[ROOT.Char.GetTitleAsNameNoTooltip]として、[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市民が困窮せぬようにする責務が私にはある。施しを行う理由はいくつもある。困っている者を助けるため、都市をより繁栄させるため、そして我々の社会を結びつける絆を強めるためだ。\n\n動機が何であれ、貧しき者に手を差し伸べることは、民衆の支持を保つ確かな手段である。"
 gdp_fund_alms_decree_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の貧民に施しを行う"
 gdp_fund_alms_decree_decision_confirm: "施しを行う"
 gdp_tax_holiday_decree_decision: "税の減免を行う"
 gdp_tax_holiday_decree_decision_desc: "今後数年間、[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市民に課す税を減額する。費用は国庫から出すことになるが、民衆からの支持を得るためなら、その代償を払う価値はある。"
 gdp_tax_holiday_decree_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市税を減額し、[popular_opinion|E]を上昇させる"
 gdp_tax_holiday_decree_decision_confirm: "市税を減免する"
 gdp_debt_forgiveness_decree_decision: "債務を免除する"
 gdp_debt_forgiveness_decree_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市民の多くは、返済できない借金に苦しんでいる。市に対する債務を免除すれば、彼らの負担を軽減し、その見返りに忠誠を得られるだろう。国庫をこのように使うことに反対する者もいるだろうが、民衆の支持を得た統治者の立場は揺るがない。"
 gdp_debt_forgiveness_decree_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市民の債務を免除し、[popular_opinion|E]を大幅に上昇させる"
 gdp_debt_forgiveness_decree_decision_confirm: "債務を免除する"
 gdp_debt_forgiveness_upset_patricians_tt: "[GetHouseAspiration( 'republic_communal' ).GetName|V]の[house_ambition|E]を持たないすべての[vassal|E]"
 gdp_debt_forgiveness_pleased_patricians_tt: "[GetHouseAspiration( 'republic_communal' ).GetName|V]の[house_ambition|E]を持つすべての[vassal|E]"
 gdp_finance_war_decree_decision: "戦争遂行のための資金を調達する"
 gdp_finance_war_decree_decision_desc: "戦争とは恐ろしい営みであり、何よりも#EMP 金のかかる#!営みである。必要とあらば、追加の戦争税を課し、戦争遂行のための資金を確保することができる。"
 gdp_finance_war_decree_decision_tooltip: "進行中の戦争に資金を投じるため、追加の税を課す"
 gdp_finance_war_decree_decision_confirm: "戦争税を課す"
 finance_war_patrician_tax_name: "パトリシアン税"
 finance_war_patrician_tax_desc: "$finance_war_patrician_tax_name$"
 finance_war_patrician_tax_tooltip: "[patricians|E]に追加の税を課す"
 finance_war_citizen_tax_name: "市民税"
 finance_war_citizen_tax_desc: "$finance_war_citizen_tax_name$"
 finance_war_citizen_tax_tooltip: "[counties|E]に追加の税を課す"
 every_patrician_tt: "すべての[patrician|E]"
 gdp_war_approval_decree_decision: "開戦の許可を求める"
 gdp_war_approval_decree_decision_desc: "我々が[war|E]を宣言できるかどうかは、ひとえに議会の意思にかかっている。十分な票を確保するには、多少の袖の下も必要になるかもしれない。だが、それも大義のためである。"
 gdp_war_approval_decree_decision_tooltip: "[war|E]を宣言する許可を[assembly|E]に求める"
 gdp_war_approval_decree_decision_confirm: "開戦の許可を求める"
 gdp_war_approval_decree_decision_effect_desc: "[war|E]を宣言する許可を得る"
 must_have_assembly_approval_declare_war_desc: "[war|E]の宣言に必要な[assembly_possessive|E]の承認を得て#bold いない#!"
 gained_assembly_approval_declare_war_desc: "[war|E]の宣言に必要な[assembly_possessive|E]の承認を得ている"
 gdp_banishment_approval_decree_decision: "追放の承認を求める"
 gdp_banishment_approval_decree_decision_named: "[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]の追放を求める"
 gdp_banishment_approval_decree_decision_desc: "我々の統治を受け入れられない者たちがいる。そして、我々もまた、もはや彼らを受け入れられない。議会の同意を得られれば、彼らを領国から[banish|E]できる。処刑すれば命を奪い合う抗争を招きかねないが、追放ならその危険を避けて危険人物を排除できる。"
 gdp_banishment_approval_decree_decision_tooltip: "あなたが告発した人物の[banish|E]許可を[assembly|E]に求める"
 gdp_banishment_approval_decree_decision_confirm: "追放の承認を求める"
 gdp_banishment_approval_decree_decision_effect_desc: "[indicted_character.GetShortUIName]の[banish|E]許可を得る"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "あなたが告発した人物の[banish|E]許可を得る"
 must_have_assembly_approval_banishment_desc: "あなたは対象を[banish|E]する承認を[assembly_possessive|E]から#bold 得ていない#!"
 gained_assembly_approval_banishment_desc: "あなたは[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]を[banish|E]する承認を[assembly_possessive|E]からすでに#bold 得ている#!"
 gdp_proscription_approval_decree_decision: "一族追放の承認を求める"
 gdp_proscription_approval_decree_decision_named: "[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip]家の追放を求める"
 gdp_proscription_approval_decree_decision_desc: "血は争えない。裏切り者の一族は皆同様に汚名を背負い、邪心を抱いている。議会の同意を得られれば、一族全員を[banish|E]し、不忠な一族を領国から追い払うことができる。"
 gdp_proscription_approval_decree_decision_tooltip: "あなたが告発した人物の一族全員の[banish|E]許可を[assembly|E]に求める"
 gdp_proscription_approval_decree_decision_confirm: "一族追放の承認を求める"
 gdp_proscription_approval_decree_decision_effect_desc: "[indicted_character.GetShortUINamePossessive]の一族全員を[banish|E]する許可を得る"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "あなたが告発した人物の一族全員の[banish|E]許可を得る"
 must_have_assembly_approval_proscription_desc: "あなたは対象の一族を[banish|E]する承認を[assembly_possessive|E]から#bold 得ていない#!"
 gained_assembly_approval_proscription_desc: "あなたは[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINamePossessive]の一族を[banish|E]する承認を[assembly_possessive|E]からすでに#bold 得ている#!"
 gdp_execution_approval_decree_decision: "処刑の承認を求める"
 gdp_execution_approval_decree_decision_named: "[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]の処刑を求める"
 gdp_execution_approval_decree_decision_desc: "我々が慈悲深く統治していても、その支配を脅かす者はなお存在する。彼らの脅威はあまりに大きく、彼らが生きている限り安心はできない。議会の承認を得て彼らを[execute|E]し、民衆の不安を取り除こう。"
 gdp_execution_approval_decree_decision_tooltip: "あなたが告発した人物の[execute|E]許可を[assembly|E]に求める"
 gdp_execution_approval_decree_decision_confirm: "処刑の承認を求める"
 gdp_execution_approval_decree_decision_effect_desc: "[indicted_character.GetShortUIName]の[execute|E]許可を得る"
 gdp_execution_approval_decree_decision_effect_no_indicted_desc: "あなたが告発した人物の[execute|E]許可を得る"
 must_have_assembly_approval_execution_desc: "あなたは対象を[execute|E]する承認を[assembly_possessive|E]から#bold 得ていない#!"
 gained_assembly_approval_execution_desc: "あなたは[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]を[execute|E]する承認を[assembly_possessive|E]からすでに#bold 得ている#!"
 gdp_has_no_valid_indicted_character_desc: "あなたはまだ[assembly|E]で誰も#bold 告発していない#!"
 gdp_has_no_valid_indicted_family_desc: "あなたはまだ[assembly|E]で[patrician_family|E]の当主を#bold 告発していない#!"
 gdp_indicted_family_head_is_player_desc: "告発された[patrician_family|E]の当主は、プレイヤーであっては#bold ならない#!"
 gdp_overthrow_government_decision: "政府を転覆させる"
 gdp_overthrow_government_decision_desc: "この共和国の政権は根本から腐敗している。今こそ国家という船の舵を正し、腐敗した無能な者たちを排除し、共和主義の美徳による統治を[ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]に再び取り戻す時だ。\n\n支持者を集め、彼らと共に[ROOT.Char.GetLiege.GetNameNoTooltip]の政府を転覆させよう。"
 gdp_overthrow_government_decision_tooltip: "現在の[republic|E]政府を転覆させ、自らその統治者となる"
 gdp_overthrow_government_decision_confirm: "暴君の支配から解放せよ！"
 you_are_patrician_desc: "あなたは所領無しの[patrician|E]である。"
 overthrow_government_effect_tooltip: "#WEAK この決断により、政府転覆を図る[hostile_scheme|E]が開始される。#!\n$EFFECT_LIST_BULLET$あなたが新たな[liege|E]となる可能性がある\n$EFFECT_LIST_BULLET$あなたの[rivals|E]や政敵が[republic|E]を去る可能性がある\n$EFFECT_LIST_BULLET$[assembly_possessive|E]の承認なしに、共和国の法律があなたの一族の野望に沿う形へと変更される\n@alert_icon! #alert_trial 露見した場合、国家に対する陰謀は重大な[crime|E]となります#!"
 gdp_overthrow_agent_focus_balance: "バランス型の[agent|E]配備"
 gdp_overthrow_agent_focus_success: "[scheme_potential|E]を高める[agents|E]を重視"
 gdp_overthrow_agent_focus_speed: "[scheme_speed|E]を低下させる[agents|E]を重視"
 gdp_overthrow_agent_focus_secrecy: "[secrecy|E]を高める[agents|E]を重視"
 agent_focus_balance_tooltip: "$overthrow_government_interaction.tt.agent_focus_balance$"
 agent_focus_success_tooltip: "$overthrow_government_interaction.tt.agent_focus_success$"
 agent_focus_speed_tooltip: "$overthrow_government_interaction.tt.agent_focus_speed$"
 agent_focus_secrecy_tooltip: "$overthrow_government_interaction.tt.agent_focus_secrecy$"
 gdp_quarantine_ship_decree_decision: "30日間検疫"
 gdp_quarantine_ship_decree_decision_desc: "#bold 議会の決定をここに通達する。#!\n疫病やその他の病を引き起こす有害な蒸気の拡散を食い止めるため、30日間の検疫を実施するものとする。"
 gdp_quarantine_ship_decree_decision_tooltip: "港に入る船舶の検疫を実施し、[capital_possessive|E]の[trade_market|E]につながるすべての[trade_routes|E]の[competitiveness|E]低下と引き換えに、[epidemic_resistance|E]を高める"
 gdp_quarantine_ship_decree_decision_confirm: "30日間検疫を実施"
 gdp_quarantine_modifier_desc: "[capital_possessive|E]の[market|E]に[trade_route|E]を持つすべての[character|E]"
 DECREE_PLAGUE_APOCALYPTIC_DESC: "[realm|E]で終末的な[epidemic|E]が発生している"
 DECREE_PLAGUE_MAJOR_DESC: "[realm|E]で大規模な[epidemic|E]が発生している"
 DECREE_PLAGUE_MINOR_DESC: "[realm|E]で小規模な[epidemic|E]が発生している"
 DECREE_PLAGUE_NONE_DESC: "[realm|E]で[epidemic|E]が発生していない"
 gdp_enforce_curfew_decree_decision: "夜間外出禁止令"
 gdp_enforce_curfew_decree_decision_desc: "#bold 議会の決定をここに通達する。#!\n夜間の犯罪行為を抑制するため、厳格な夜間外出禁止令を施行し、夜間の犯罪行為を取り締まるものとする。"
 gdp_enforce_curfew_decree_decision_tooltip: "違法行為を抑制し、犯罪計画を阻止するため、夜間外出禁止令を施行した"
 gdp_enforce_curfew_decree_decision_confirm: "夜間外出禁止令を施行"
 gdp_enforce_curfew_decree_decision_effect_desc: "夜間外出禁止令により、[hostile_scheme|E]の効果が低下し、[control|E]が上昇する"
 gdp_republic_curfew_desc: "[capital|E]内のすべての[vassals|E]"
 gdp_sponsor_craft_guild_decision: "職人ギルドを後援する"
 gdp_sponsor_craft_guild_decision_desc: "共和制のもとでは、職人ギルドとして公認されることには大きな利点がある。そのため、さまざまな職業の職人たちが、議会で起草・承認される公的な特許状を求めている。彼らがその手続きを進められるよう支援することは、都市のためになるだけでなく、議会に議案を提出したパトリシアンも、新たに設立されるギルドから後援者として認められる。"
 gdp_sponsor_craft_guild_decision_tooltip: "職人ギルドを後援すると、[capital|E][county|E]の[prosperity_growth|E]と[urban_tax|E]が増加し、あなたの[house_possessive|E][trade_competitiveness|E]と[trade_expertise|E]の成長も促進される"
 gdp_sponsor_craft_guild_decision_confirm: "新たな職人ギルドを後援した"
 gdp_request_noble_magistracy_decision: "貴族の行政官職を求める"
 gdp_request_noble_magistracy_decision_desc: "パトリシアンの身分の者が就ける官職は限られているが、貴族向けに設けられた行政官職もある。若く野心的なパトリシアンが国政の仕組みを学び、名声を得るにはうってつけの役職だ。"
 gdp_request_noble_magistracy_decision_tooltip: "貴族の行政官職に就くと、あなたの[heir_possessive|E]の[dynasty_prestige|E]獲得量、[lifestyle_experience|E]獲得量、[opinion|E]が増加する一方、[stress_gain|E]量も増える"
 gdp_request_noble_magistracy_decision_confirm: "後継者のために貴族の行政官職を求めた"
 gdp_request_relief_from_bankruptcy_decision: "破産救済を求める"
 gdp_request_relief_from_bankruptcy_decision_desc: "有力な一族が困窮に陥らないよう、議会は共和国の国庫を使って債権者への返済を肩代わりし、返済困難な借金を整理できる。これにより、破産寸前まで追い込まれたパトリシアンにも、立ち直る機会が与えられる。"
 gdp_request_relief_from_bankruptcy_decision_tooltip: "破産救済を受けると、あなたの[gold|E]の借金が[republic|E]国家の[treasury|E]から返済される"
 gdp_request_relief_from_bankruptcy_decision_confirm: "破産救済を求めた"
