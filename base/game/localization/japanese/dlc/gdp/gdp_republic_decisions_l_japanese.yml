 gdp_trade_post_charity_decision_desc: "我々の交易所は小さな商業の中心地であり、昼夜を問わず活気にあふれている。だが、最善は尽くしていても、見落とされて隅で埃をかぶる品が時折出てしまう。\n\n売れる見込みの薄い品も、困窮する人々に寄付すれば有効活用できる。"
