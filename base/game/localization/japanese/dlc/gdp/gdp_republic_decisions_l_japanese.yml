 gdp_gather_popular_support_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]の市民の行動は予測しづらく、騒乱が起きれば危険な勢力となりうる。しかし、彼らを味方につければ、こちらの意のままに動かせる強力な力となる。"
