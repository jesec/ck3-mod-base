l_japanese:
 tradition_fortune_seekers_name: "一攫千金を求める者たち"
 tradition_fortune_seekers_desc: "この文化では、何も持たずに故郷を離れることを恥とは考えず、受け継げるものが少ない者には、国外で富を求めることが期待される。そこで無数の道を行き交う術を身につけ、あらゆる商品の価値と、あらゆる貸し付けの条件を知るようになる。"
 culture_parameter_fortune_seekers_merchant_propensity: "この[culture|E]の[characters|E]は[merchants|E]になる可能性が高い"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "[domicile_building|E]「#V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName]#!」をアンロックする"
 tradition_saharan_traders_name: "サハラの交易商人"
 tradition_saharan_traders_desc: "サハラ砂漠は古くから、交易の障壁というより、むしろ交易路として機能し、サヘルや西アフリカ内陸部を地中海沿岸へと結びつけてきた。この文化に属する人々は、こうした交易における自らの役割を受け入れており、隊商の中で生涯を過ごす者も多い。"
 culture_parameter_oasis_villages_building_slot: "[GetTerrain( 'oasis' ).GetName]では[district|E]#V「[GetDistrictType('villages_district').GetName]#!」、「#V [GetDistrictType('religious_community_district').GetName]#!」、「#V [GetDistrictType('manor_houses_district').GetName]#!」の[building|E]スロットが#P +1#!になる"
 culture_parameter_saharan_seasoned_traveler_route_length: "[trait|E]「[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]」の#V $trait_track_danger$#!系統のレベルが1上がるごとに[trade_route_length|E]が#P +1#!になる"
 culture_parameter_saharan_merchant_domicile_buildings: "[domicile_buildings|E]「#V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#!」と「#V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#!」をアンロックする"
 culture_parameter_caravan_escort_compound_domicile_building: "[domicile_building|E]「#V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName]#!」をアンロックする"
 tradition_silk_road_traders_name: "シルクロードの事業家"
 tradition_silk_road_traders_desc: "シルクロードでは、東西のあいだを絶えず商品が行き交う。絹や茶、漆器、翡翠をはじめとする高価な品々が、長い道のりを隊商宿から次の隊商宿へと運ばれていく。こうした交易路は、その経路上の各地の社会を形作ってきた。交易路の要所では豊かな都市が自ら遠隔地交易に携わるか、交易商を相手に商売を営んでいる。"
 tradition_monsoon_traders_name: "モンスーンの交易商人"
 tradition_monsoon_traders_desc: "インド洋の交易は、西方のナクーダ（船長）から東方の交易ギルドやカーストまで、さまざまな人々に支えられてきた。彼らは世代を超えて、胡椒や綿布、その他の貴重な品々を市場へ運んでいる。"
 culture_parameter_caravanserai_hospitality: "この[culture|E]の[characters|E]は、[interaction|E]「#V $host_honored_guest_interaction$#!」を使用できる"
 culture_parameter_stewardship_gain_from_foreign_poi: "別の[culture|E]の領地にある[point_of_interest|E]を訪れると、[stewardship|E]の[lifestyle_experience|E]を獲得する"
 culture_parameter_silk_road_market_expertise: "[decision|E]「#V $visit_silk_road_market_decision$#!」による恩恵がより大きくなる"
 culture_parameter_silk_road_oasis_urban_building_slots: "[GetTerrain( 'oasis' ).GetName]では[districts|E]「#V [GetDistrictType('urban_housing_district').GetName]#!」および「#V [GetDistrictType('guild_district').GetName]#!」の[building|E]スロットが#P +1#!になる"
 culture_parameter_silk_road_market_owner_bonuses: "シルクロードの市場の[buildings|E]が追加の[commerce_tax|E]を付与する"
 culture_parameter_silk_road_merchant_domicile_buildings: "[domicile_buildings|E]「#V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName]#!」と「#V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName]#!」をアンロックする"
 culture_parameter_monsoon_traveler_trade_bonuses: "[trait|E]「[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]」の#V $trait_track_travel$#!系統が追加の[competitiveness_i] [trade_competitiveness|E]を付与し、#V $trait_track_danger$#!系統が追加の[trade_route_capacity_i] [capacity|E]を付与する"
 culture_parameter_monsoon_port_buildings_settlement_size: "[district|E]「#V [GetDistrictType('port_district').GetName]#!」の[buildings|E]が#P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#!の[settlement_size|E]を付与する"
 culture_parameter_monsoon_merchant_domicile_buildings: "[domicile_buildings|E]「#V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName]#!」と「#V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName]#!」をアンロックする"
 tradition_binding_oaths_name: "破れぬ誓い"
 tradition_binding_oaths_desc: "取り決めは必ず守らなければならない。この文化の人々は、一度交わした契約を決して破ってはならないと考えている。誓いを破る者は決して許されない。"
 culture_parameter_binding_oaths_harsh_break_penalties: "[truce|E]を破る、[creditor|E]を非難する、または[GetTrait('dealbreaker').GetName( GetNullCharacter )]であることが露見すると、この[culture|E]内での[opinion|E]が大幅に下がり、[company|E]の[acumen|E]が#N 10%#!失われる"
 culture_parameter_binding_oaths_word_is_trusted: "他の[rulers|E]が[interaction|E]「#V $negotiate_alliance_interaction$#!」を受け入れたり、[interaction|E]「#V $call_ally_interaction$#!」に応じたりする可能性が大幅に高くなり、そのコストが[prestige_i]#P -50%#!になる"
 culture_parameter_good_faith_traits_more_common: "[traits|E]「[GetTrait('honest').GetName( GetNullCharacter )]」と「[GetTrait('trusting').GetName( GetNullCharacter )]」がより一般的になる"
 culture_parameter_good_faith_trait_bonuses: "[traits|E]「[GetTrait('honest').GetName( GetNullCharacter )]」と「[GetTrait('trusting').GetName( GetNullCharacter )]」に追加ボーナスが付与される"
 culture_parameter_better_stewardship_education: "この[culture|E]の[children|E]は、優れた[stewardship|E][education|E]を受ける可能性が高くなる"
 binding_oaths_broke_word_modifier: "誓いを破った者"
 binding_oaths_alliance_accept_reason: "[GetCultureTradition('tradition_binding_oaths').GetName]の[tradition|E]があなたに約束を守らせる：$VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "私の[GetCultureTradition('tradition_binding_oaths').GetName]の[tradition|E]が[alliance|E]を守らせる：$VALUE|=+0$"
 culture_parameter_unlock_carnival_activity: "[republican|E]の[rulers|E]は、[activity|E]「[GetActivityType('activity_carnival').GetName]」を開催できる"
 culture_parameter_merchant_propensity_bonus: "この[culture|E]の[characters|E]は[merchants|E]になる可能性が高い"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line' )]"
 culture_parameter_trade_league_cohesion_bonus_has_dlc: "[trade_league|E]に属するこの[culture|E]の各[title|E]は、毎月の[league_cohesion|E]に#P +0.02#!寄与する"
 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line' )]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "[county|E]階級の[rulers|E]が[trade_league|E]を設立できる"
 tradition_roman_law_name: "ローマ法"
 tradition_roman_law_desc: "かつてローマ法がこの地の礎を築いた。この文化では、重要な立場にある者は今なお誰もが法律を学び、社会のあらゆる場面で法律が用いられている。農民、職人、未亡人、貴族、商人など、あらゆる人々が、争いを解決するために法の条文を頼りにしている。"
 culture_parameter_roman_law_cheaper_university: "[ward|E]を大学に送るコストと、[activity|E]「[GetActivityType('activity_adult_education').GetName]」の開催コストが[gold_i]#P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#!になる"
 culture_parameter_roman_law_university_bonuses: "大学の[buildings|E]が追加の恩恵を付与する"
 culture_parameter_roman_law_education_bonuses: "[learning|E]および[stewardship|E]の[education_traits|E]と、レベル5の[education_traits|E]が、[competitiveness_i] [trade_competitiveness|E]および[stewardship_i] [stewardship_skill|E]の追加ボーナスを付与する。"
 culture_parameter_roman_law_legal_buildings_in_guild_district: "#V [GetBuildingType('notary_1').GetName]#!および#V [GetBuildingType('court_of_law_1').GetName]#!系統の[buildings|E]を、#V [GetDistrictType('guild_district').GetName]#!に建設できる"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "#V [GetBuildingType('market_court_1').GetName]#!、#V [GetBuildingType('notary_1').GetName]#!、および#V [GetBuildingType('court_of_law_1').GetName]#!系統の[buildings|E]が、追加の[popular_opinion_i] [popular_opinion|E]を付与する"
 culture_parameter_roman_law_notariate_domicile_building: "[domicile_building|E]「#V [GetDomicileBuilding('merchant_company_notariate_01').GetName]#!」をアンロックする"
 tradition_civic_religion_name: "市民宗教"
 tradition_civic_religion_desc: "この文化では、宗教に関する事柄をギルドや信徒団体が担っている。貧者の救済から都市の防衛、教会の建設に至るまで、敬虔な市民の集団がその責任を負う。"
 culture_parameter_civic_religion_temple_district_restriction: "[secular_rulers|E]は、[district|E]「#V [GetDistrictType('temple_district').GetName]#!」を利用できない"
 culture_parameter_civic_religion_guild_building_slots: "#V [GetDistrictType('guild_district').GetName]#!の[building|E]スロットが#P +2#!になる"
 culture_parameter_civic_religion_guild_charity_buildings: "#V [GetBuildingType('charities_1').GetName]#!、#V [GetBuildingType('hospitals_1').GetName]#!、#V [GetBuildingType('scribe_shop_1').GetName]#!、および#V [GetBuildingType('scholarly_guilds_1').GetName]#!系統の[buildings|E]を、#V [GetDistrictType('guild_district').GetName]#!に建設できる"
 culture_parameter_civic_religion_basilica: "[republics|E]のために、[GetDistrictType('republic_great_plaza_district').GetName|V]で[GetBuildingType('republic_basilica_01').GetName|V]の[building|E]系統をアンロックする"
 culture_parameter_civic_religion_cathedral_civic_tax: "大聖堂の[buildings|E]は[civic_tax|E]も付与する"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "[personal_tenet|E]を変更すると[stress|E]が軽減する"
 culture_parameter_civic_religion_education_piety_bonuses: "[diplomacy|E]の[education_traits|E]と[GetTrait('education_republican_knowledge_3').GetName( GetNullCharacter )]系統の[traits|E]が追加の[piety_i] [piety|E]を付与する"
 culture_parameter_civic_religion_trait_piety_bonuses: "[traits|E]「[GetTrait('gregarious').GetName( GetNullCharacter )]」と「[GetTrait('family_first').GetName( GetNullCharacter )]」が追加の[piety_i] [piety|E]を付与する"
 culture_parameter_unlock_improved_republic_militia: "[republican|E]の[rulers|E]は、#V $republic_army_organization_2_improved_levy$#!の[law|E]を制定できる"
 tradition_contado_name: "コンタード"
 tradition_contado_desc: "この文化の土地には、小規模ながら都市的な性格を持つ城塞都市が点在しており、その多くはもともと地元の領主によって築かれたものだ。小作制によって、都市に住む領主たちは農村の日常生活から遠ざかっていった。"
 culture_parameter_contado_castello_buildings: "#V [GetBuildingType('castello_1').GetName]#!系統の[buildings|E]を#V [GetDistrictType('villages_district').GetName]#!に建設できる"
 culture_parameter_contado_borghi_buildings: "#V [GetBuildingType('borghi_1').GetName]#!系統の[buildings|E]を#V [GetDistrictType('walls_district').GetName]#!に建設できる"
 culture_parameter_contado_towers_domicile_building: "[domicile_building|E]「#V [GetDomicileBuilding('merchant_company_towers_01').GetName]#!」をアンロックする"
 tradition_contract_warfare_name: "契約戦争"
 tradition_contract_warfare_desc: "この文化では、徴募兵や市民軍の枠をはるかに超えて、戦争が制度化されている。兵士たちは契約に基づいて働き、将校は都市や領主と軍事作戦の目標を交渉する。人を殺めることは、個人的な行為から職業へと変わった。"
 culture_parameter_unlock_innovation_condottieri: "#high $innovation_condottieri$#!の[innovation|E]が、$culture_era_late_medieval$[era|E]で利用可能になる"
 culture_parameter_contract_warfare_single_combat: "[commander_trait|E]、[martial|E]の[education_trait|E]、または[trait|E]「[GetTrait('brave').GetName( GetNullCharacter )]」を持つ[rulers|E]は、自分の[liege|E]ではない、自分と同等以下の[title_tier|E]を持つ[characters|E]に対して、[interaction|E]「#V $challenge_to_single_combat_nomadic_interaction$#!」を使用できる"
 culture_has_university_desc: "この[culture|E]は、大学のある[county|E]には存在しない"
 cultrad_republic_government_type: "あなたの[government|E]は[GetGovernment( 'republic_government' ).GetName]である"
 cultrad_has_military_district: "あなたは#V [GetDistrictType('military_district').GetName]#!を持つ[holding|E]を保有している"
 culture_in_oasis_desc: "この[culture|E]は、[GetTerrain( 'oasis' ).GetName]の[terrain|E]を持つ[county|E]には存在しない"
 oasis_count_desc: "この[culture|E]が[GetTerrain( 'oasis' ).GetName]の[terrain|E]を持つ#V 2#!ヶ所以上の[counties|E]に存在しない"
 culture_in_silk_road_region_desc: "この[culture|E]は、[GetGeographicalRegion('tgp_silk_road_region').GetName]沿いには存在しない"
 silk_road_percentage_desc: "[culture|E]が#V 30%#!の[counties|E]を[GetGeographicalRegion('tgp_silk_road_region').GetName]沿いに持っていない"
 culture_on_monsoon_coast_desc: "この[culture|E]は、[GetGeographicalRegion('world_india').GetName]、[GetGeographicalRegion('world_africa_east').GetName]、[GetGeographicalRegion('world_middle_east').GetName]の沿岸[county|E]には存在しない"
