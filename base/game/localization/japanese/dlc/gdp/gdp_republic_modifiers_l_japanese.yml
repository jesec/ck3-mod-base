l_japanese:
 gdp_founded_republic_modifier: "共和制の創設者"
 gdp_founded_republic_modifier_desc: "この人物は、共和制を創設した。"
 gdp_fund_alms_decree_modifier: "貧民への施し"
 gdp_fund_alms_decree_modifier_desc: "この都市の統治者たちは、最近、貧民に施しを与えることで寛大さを示した。"
 gdp_taxed_county_modifier: "戦争税の支払い"
 gdp_taxed_county_modifier_desc: "この伯爵領は最近、戦争遂行の費用を賄うため、多額の税金を納めた。"
 gdp_tax_holiday_decree_modifier: "減税"
 gdp_tax_holiday_decree_modifier_desc: "勅令によって市税が引き下げられ、市民の好感を得ている。"
 gdp_trade_support_modifier: "交易支援"
 gdp_trade_support_modifier_desc: "この人物は、交易路を改善するため、共和国から交易支援を受けている。"
 republic_reliable_caravans_modifier: "信頼できる隊商"
 republic_reliable_caravans_modifier_desc: "この人物の交易路は、より組織化された隊商によって支えられている。"
 republic_premium_contracts_modifier: "有利な契約"
 republic_premium_contracts_modifier_desc: "この人物は商品の販売に有利な契約を確保している。"
 republic_inspector_bribery_modifier: "監察官の収賄"
 republic_inspector_bribery_modifier_desc: "この人物の市場監察官は賄賂によって買収されている。"
 gdp_glorification_modifier: "称揚"
 gdp_glorification_modifier_desc: "この統治者は市民に称賛され、その名と姿は街路や議会堂の至るところで称えられている。\n\n[GetLaw( 'republican_elective_succession_law' ).GetName]の[voting_strength|E]：+1"
 gdp_civic_labor_modifier: "市民労働力"
 gdp_civic_labor_modifier_desc: "首都の市民に労働力と専門知識の提供を求めることで、本拠地の建設費用と所要時間が削減されている。"
 gdp_popular_mandate_modifier: "民衆の支持"
 gdp_popular_mandate_modifier_desc: "この統治者は、首都の市民から統治継続への支持を集め、次の選挙における発言力を高めている。\n\n#weak この[modifier|E]は1回の選挙の間のみ有効。#!\n\n[GetLaw( 'republican_elective_succession_law' ).GetName]の[voting_strength|E]：#P +1#!"
 gdp_patrician_promoted_voter_modifier: "評判の向上"
 gdp_patrician_promoted_voter_modifier_desc: "宣伝活動が成功し、この人物の共和国での地位が高まった。\n[GetLaw( 'republican_elective_succession_law' ).GetName]の[voting_strength|E]：#P +1#!"
 republic_procedural_advantage_modifier: "手続き上の優位"
 republic_procedural_advantage_modifier_desc: "この人物は、次の議会での採決で支持を得るために必要な手続きと書類を準備している。"
 gdp_pledged_assembly_vote_modifier: "約束された評議会票"
 gdp_pledged_assembly_vote_modifier_desc: "[assembly|E]の議員は、この人物に同調して票を投じると約束している。\n$EFFECT_LIST_BULLET$#V 彼らは次の[voting_session|E]で、この人物と同じように投票する#!"
 gdp_bawdy_song_modifier: "卑猥な歌"
 gdp_bawdy_song_modifier_desc: "この人物は、卑猥な歌詞に感化されている。"
 gdp_patriotic_song_modifier: "パトリアの歌"
 gdp_patriotic_song_modifier_desc: "この人物は、[Glossary( '#bold パトリア#!', 'carnival_patria_GLOSS' )]への愛を歌った歌詞に感化されている。"
 gdp_spiritual_song_modifier: "祈りの歌"
 gdp_spiritual_song_modifier_desc: "この人物は、祈りを捧げる歌詞に感化されている。"
 gdp_rejected_dancefloor_modifier: "ダンスを断られた"
 gdp_rejected_dancefloor_modifier_desc: "この人物は、ダンスの誘いを断られた。"
 gdp_accepted_dancefloor_modifier: "ダンスに応じてもらえた"
 gdp_accepted_dancefloor_modifier_desc: "この人物は、ダンスの誘いに応じてもらえた。"
 gdp_exquisite_mask_modifier: "見事な仮面"
 gdp_exquisite_mask_modifier_desc: "この人物は、見事な仮面を着けてカーニバルに参加した"
 gdp_terrifying_mask_modifier: "恐ろしげな仮面"
 gdp_terrifying_mask_modifier_desc: "この人物は、恐ろしげな仮面を着けてカーニバルに参加した"
 gdp_slanderous_grafitti_modifier: "中傷的な落書き"
 gdp_slanderous_grafitti_modifier_desc: "この人物の一族は、市内の路地のあちこちに描かれた落書きで中傷されている。"
 gdp_domestic_chaos_modifier: "混沌とした本拠地"
 gdp_domestic_chaos_modifier_desc: "この人物の本拠地は、めちゃくちゃに荒らされている。"
 gdp_fragrant_egg_modifier: "香水入りの卵"
 gdp_fragrant_egg_modifier_desc: "この人物は、香水入りの卵を投げつけられ、むせ返るような香りを放っている。"
 gdp_sympathetic_ear_scheme_modifier: "好意的な聞き手"
 gdp_sympathetic_ear_scheme_modifier_desc: "この人物の宮廷には、この工作に好意的な者がいる。"
 gdp_insane_arguments_modifier: "常軌を逸した議論"
 gdp_insane_arguments_modifier_desc: "この人物は、常軌を逸した議論を聞かされた。"
 gdp_fatalistic_arguments_modifier: "運命論的な議論"
 gdp_fatalistic_arguments_modifier_desc: "この人物は、運命論的な議論を聞かされた。"
 gdp_beautiful_arguments_modifier: "美しい議論"
 gdp_beautiful_arguments_modifier_desc: "この人物は、美しい人物から助言を受けている。"
 gdp_ugly_arguments_modifier: "醜い議論"
 gdp_ugly_arguments_modifier_desc: "この人物は、醜い人物から助言を受けている。"
 gdp_intellectual_debate_modifier: "知的議論"
 gdp_intellectual_debate_modifier_desc: "熟練の討論者が、この人物の前で議論を展開した。"
 gdp_advise_of_a_fool_modifier: "愚者の助言"
 gdp_advise_of_a_fool_modifier_desc: "愚かな人物が、この人物の前で議論を展開した。"
 gdp_a_way_with_words_modifier: "弁舌の才"
 gdp_a_way_with_words_modifier_desc: "弁の立つ人物が、この人物の前で議論を展開した。"
 gdp_sympathetic_ear_scheme_modifier_tt: "あなたの[scheme|E]は[GetModifier('gdp_sympathetic_ear_scheme_modifier').GetNameWithTooltip]を得る。"
 gdp_business_sabotage_modifier: "商売妨害"
 gdp_business_sabotage_modifier_desc: "この人物は競合相手から妨害工作を受けている。"
 gdp_arson_modifier: "謎の火災"
 gdp_arson_modifier_desc: "この人物は、何者かに屋敷へ火を放たれた。"
 gdp_hardened_position_modifier: "態度の硬化"
 gdp_hardened_position_modifier_desc: "この人物は、脅迫を受けて態度を硬化させている。"
 gdp_intimidated_modifier: "脅迫"
 gdp_intimidated_modifier_desc: "この人物は脅しを受けている。"
 gdp_trentina_quarantine_county_modifier: "海上検疫"
 gdp_trentina_quarantine_county_modifier_desc: "疫病の蔓延を防ぐため、海上検疫が実施されている。"
 gdp_trentina_quarantine_character_modifier: "海上検疫"
 gdp_trentina_quarantine_character_modifier_desc: "この人物は、海上検疫によって商業活動を妨害されている。"
 gdp_curfew_character_modifier: "夜間外出禁止令"
 gdp_curfew_character_modifier_desc: "この人物は夜間外出禁止令を敷いており、自身や他者が問題を起こすのを防いでいる。"
 gdp_state_protection_modifier: "国の庇護"
 gdp_state_protection_modifier_desc: "この人物は議会の庇護下にある。"
 gdp_republic_grieving_parent_modifier: "悲嘆"
 gdp_republic_grieving_parent_modifier_desc: "この人物は暴徒の暴力によって後継者を失った。その悲しみはいまだ癒えていない。"
 gdp_exposed_spy_modifier: "不法な密偵"
 gdp_exposed_spy_modifier_desc: "この人物は、他者を偵察していたことが露見した。"
 gdp_dodging_council_modifier: "評議会の務めを回避"
 gdp_dodging_council_modifier_desc: "この人物は評議会の務めを免れる方法を見つけ、ほかのことに使える時間を増やした。"
 gdp_exemption_from_council_modifier: "評議会の務めの免除"
 gdp_exemption_from_council_modifier_desc: "この人物は自分の事業に専念するため、評議会の務めを免除された。"
 gdp_wedded_to_the_sea_modifier: "海と結ばれた者"
 gdp_wedded_to_the_sea_modifier_desc: "この人物は、共和国の民を前にして海への忠誠を誓った。"
 gdp_learning_from_the_masses: "民衆からの学び"
 gdp_learning_from_the_masses_desc: "この人物は、一般の人々の日々の暮らしを観察して商売を学ぶことに熱心である。"
 gdp_cooperation_correspondenti_house_modifier: "商家間の交易連携"
 gdp_cooperation_correspondenti_house_modifier_desc: "この商家は別の商家と協力関係を結び、交易網の機能を拡充している。"
 gdp_cooperation_compagnia_house_modifier: "商家間の資源共有"
 gdp_cooperation_compagnia_house_modifier_desc: "この商家は別の商家と協力関係を結び、資源と専門知識を共有している。"
 gdp_guild_sponsor_house_modifier: "職人ギルドの後援者"
 gdp_guild_sponsor_house_modifier_desc: "この商家は議会内で新たな職人ギルドの設立を支援し、その後援者となった。 "
 gdp_ancient_craft_house_modifier: "古代の職人技"
 gdp_ancient_craft_carpentry_supplies_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_books_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_incense_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_base_metals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_alcohol_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_comforts_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_meat_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_cereals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_consumption_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_jewelry_materials_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_items_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_republic_disgraced_patrician_house_modifier: "不名誉なパトリシアン"
 gdp_republic_disgraced_patrician_house_modifier_desc: "この一族は共和国を破滅に追い込み、恥辱にまみれて追放された。その名は市場では何の重みも持たず、好意的に語る者もほとんどいない。"
 gdp_republic_unrest_guild_district_shutdown: "ギルド地区：閉鎖"
 gdp_republic_unrest_guild_district_shutdown_desc: "職人ギルドが門を閉ざし、職人たちの仕事や工房は停止している。"
 gdp_republic_unrest_market_district_shutdown: "市場地区：閉鎖"
 gdp_republic_unrest_market_district_shutdown_desc: "市場地区は封鎖され、人影もない。都市の交易と商業は停滞している。"
 gdp_republic_unrest_port_district_shutdown: "港湾地区：閉鎖"
 gdp_republic_unrest_port_district_shutdown_desc: "港は都市当局の立ち入りを拒んでいる。海運収入は途絶えている。"
 gdp_republic_unrest_bureaucratic_district_shutdown: "官庁地区：閉鎖"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "官庁地区は沈黙に包まれている。都市の収入は徴収されずにいる。"
 gdp_republic_unrest_temple_district_shutdown: "宗教街区地区：閉鎖"
 gdp_republic_unrest_temple_district_shutdown_desc: "宗教街区が協力を取りやめた。信者からの寄付が国庫に入らなくなった。"
 gdp_republic_unrest_entertainment_district_shutdown: "娯楽地区：閉鎖"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "娯楽街は暗闇に包まれ、人影もなく、都市収入に打撃を与えている。"
 gdp_republic_unrest_urban_housing_district_shutdown: "住宅地区：閉鎖"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "住宅地区全体がバリケードで封鎖されている。都市税の徴収は滞っている。"
 gdp_republic_riot_aftermath: "暴動の余波"
 gdp_republic_riot_aftermath_desc: "通りは焼かれ、穀物庫は略奪され、社会基盤は引き裂かれた。復興には時間がかかる。"
 gdp_republic_uprising_aftermath: "蜂起の余波"
 gdp_republic_uprising_aftermath_desc: "民衆は誰にも止められずに街中で暴れ回った。秩序が戻るには時間がかかる。"
 gdp_sponsored_guild_modifier: "後援を受けた職人ギルド"
 gdp_sponsored_guild_modifier_desc: "職人たちは新たなギルドの結成を認められ、裕福な後援者から後援を受けている。"
 gdp_secret_information_house_modifier: "外交上の秘密"
 gdp_secret_information_house_modifier_desc: "この一族は、共和国で秘密裏に行われている外交交渉の内幕を知ることで利益を得ている。"
 gdp_ambitions_aligned_house_modifier: "一族の野望の一致"
 gdp_ambitions_aligned_house_modifier_desc: "この一族は、共和国内で同じ野望を抱くほかの一族と利害が一致している。"
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "この一族は、激しい誹謗中傷の嵐によって評判を貶められている。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_patrician_slander_rating_penalty_value' )|0=+]\n[house|E]の成員の[GetLaw('republican_elective_succession_law').GetName]に対する支持スコア：[EmptyScope.ScriptValue( 'republic_slander_election_value' )|0=+]"
 gdp_patrician_promoted_house_modifier: "評判の向上"
 gdp_patrician_promoted_house_modifier_desc: "宣伝活動が成功し、この一族の共和国での地位が高まった。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
 gdp_secured_republic_monopoly_modifier: "共和国の独占権を確保"
 gdp_secured_republic_monopoly_modifier_desc: "この人物は共和国のために独占権を確保した。\n [patrician_rating|E]：[EmptyScope.ScriptValue( 'secured_republic_monopoly_rating_bonus_value' )|0=+]"
 gdp_head_held_high_modifier: "堂々たる態度"
 gdp_head_held_high_modifier_desc: "この人物は、あらゆる嘲笑にも屈せず胸を張っている。"
 gdp_training_for_the_worst_modifier: "最悪の事態への備え"
 gdp_training_for_the_worst_modifier_desc: "この人物は、万が一の事態に備えて武芸を鍛えることにした。"
 gdp_fear_of_the_mob_modifier: "民衆への恐怖"
 gdp_fear_of_the_mob_modifier_desc: "この人物は、気まぐれな民衆を恐れながら暮らしている。"
 gdp_champion_of_the_people_modifier: "民衆の擁護者"
 gdp_champion_of_the_people_modifier_desc: "この人物は庶民の擁護者を自称している。"
 gdp_champion_of_the_state_modifier: "政権の擁護者"
 gdp_champion_of_the_state_modifier_desc: "この人物は現政権の擁護者を自称している。"
 gdp_guild_sponsored_feast_modifier: "ギルド主催の祝宴"
 gdp_guild_sponsored_feast_modifier_desc: "この人物は、都市のギルドから無料の祝宴に招かれた。"
 gdp_broken_trust_modifier: "信頼の裏切り"
 gdp_broken_trust_modifier_desc: "この人物は、自らの利益のために民衆の好意につけ込んだ。"
 gdp_toast_to_adventure_modifier: "冒険への憧れ"
 gdp_toast_to_adventure_modifier_desc: "この人物は遠方での冒険を望んでいる。"
 gdp_toast_to_romance_modifier: "恋愛への憧れ"
 gdp_toast_to_romance_modifier_desc: "この人物は恋愛やロマンスを求めている。"
 gdp_toast_to_glory_modifier: "栄光への野心"
 gdp_toast_to_glory_modifier_desc: "この人物は栄光を求めている。"
 gdp_toast_to_relations_modifier: "友情への憧れ"
 gdp_toast_to_relations_modifier_desc: "この人物は、友情を育み、家族との絆を深めたいと考えている。\n[interaction|E]「$befriend_interaction$」をアンロックする"
 gdp_republic_bureaucrat_modifier: "共和制の官僚"
 gdp_republic_bureaucrat_modifier_desc: "この人物は最近、立法手続きにおいて優れた手腕を発揮し、書類業務を極めて効率的に処理した。\n[patrician_rating|E]：[EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\n[voting_sessions|E]中の[assembly|E]の賛同：[EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "立法者"
 gdp_republic_law_maker_modifier_desc: "この人物は、巧みな立ち回りや十分な根回しによって、最近自身が提案した法律に対する議会の承認を取り付けた。\n[patrician_rating|E]：[EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "影響力の大きい交易所"
 gdp_dominate_market_trade_post_modifier_desc: "この市場は、パトリシアンの交易所から強い影響を受けている。"
 gdp_trade_post_charity_modifier: "慈善活動の開催"
 gdp_trade_post_charity_modifier_desc: "この人物は庶民のために慈善活動を行い、病人や貧困者、困窮している人々を支援した。"
 gdp_gather_popular_support_modifier: "民衆の人気者"
 gdp_gather_popular_support_modifier_desc: "この人物は都市の市民から支持を集め、名を広めるとともに、自らの声を広く届けている。"
 gdp_gather_popular_support_house_t3_modifier: "民衆から絶大な支持を得た一族"
 gdp_gather_popular_support_house_t3_modifier_desc: "この一族は都市の市民から絶大な支持を得ている。\n[patrician_rating|E]：[EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]における[house|E]の成員の支持スコア：[EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "民衆から強い支持を得た一族"
 gdp_gather_popular_support_house_t2_modifier_desc: "この一族は都市の市民から強い支持を得ている。\n[patrician_rating|E]：[EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]における[house|E]の成員の支持スコア：[EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "民衆の支持を得た一族"
 gdp_gather_popular_support_house_t1_modifier_desc: "この一族は都市の市民から支持を得ている。\n[patrician_rating|E]：[EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName]における[house|E]の成員の支持スコア：[EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "専制的な市長"
 gdp_signorial_execute_and_banish_modifier_desc: "この人物は共和国の市民を処刑・追放し、さらに犠牲者を増やそうとしている。"
 gdp_ambition_promote_scheme_bonus_modifier: "パトリシアンの地位向上を支援"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "この人物は別のパトリシアンの評判を高めるために時間と労力を費やし、その見返りに好意を得た。\n[patrician_rating|E]：[EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+]#weak（評価は累積しない）#!"
 gdp_noble_magistrate_modifier: "貴族の行政官職"
 gdp_noble_magistrate_modifier_desc: "この人物は、共和制国家の公職において誠実かつ名誉をもって奉仕するため、下級貴族の行政官職を与えられた。"
 gdp_republic_plaza_prestige_modifier: "大広場の名声"
 gdp_republic_plaza_prestige_modifier_desc: "この人物は大広場の整備に貢献し、名声と市民の支持を得た。"
 gdp_republic_trader_competitiveness_modifier: "強硬な商人"
 gdp_republic_trader_competitiveness_modifier_desc: "この人物は交渉において一歩も譲らない冷徹な商人であり、相手が折れるまで決して妥協しない。"
 gdp_republic_plaza_chancery_modifier: "文書局の余剰木材"
 gdp_republic_plaza_chancery_modifier_desc: "この人物は、文書保管所の整備で余った大工や印刷機、十分に乾燥させた木材を、自宅のために活用している。"
 gdp_republic_plaza_scriptorium_modifier: "充実した写字室"
 gdp_republic_plaza_scriptorium_modifier_desc: "この人物は、コミューンの写字生たちに上質なインクや顔料を供給しており、それらを大量に所有している。"
 gdp_republic_plaza_magistracy_modifier: "行政官の公服"
 gdp_republic_plaza_magistracy_modifier_desc: "この人物は自費で市の行政官たちに衣服を支給したため、法が語られる場所ならどこでも相応の敬意をもって迎えられる。"
 gdp_republic_plaza_popular_favor_modifier: "民衆の顔役"
 gdp_republic_plaza_popular_favor_modifier_desc: "この人物は民衆の心をつかむ術に長けており、公共施設の整備費用を自ら負担したことを、確実に人々に知らしめている。"
 gdp_republic_plaza_trade_capacity_modifier: "計量と封印"
 gdp_republic_plaza_trade_capacity_modifier_desc: "この人物の商品は計量時に異議を唱えられることもなく、季節を追うごとに取引量も増えている。"
 gdp_republic_plaza_expertise_modifier: "大広場の商人"
 gdp_republic_plaza_expertise_modifier_desc: "この人物は市内の多くの商人に影響力を持ち、通常なら何十年もかけなければ得られない商品や交易に関する知識を身につけている。"
 gdp_republic_plaza_estate_income_modifier: "公の債権者"
 gdp_republic_plaza_estate_income_modifier_desc: "コミューンはこの人物に借金があり、利息は期日どおりにその会計所へ支払われる。"
 gdp_republic_plaza_physician_modifier: "医療への貢献"
 gdp_republic_plaza_physician_modifier_desc: "この人物は市の病棟に薬草や治療薬を備える費用を負担し、自邸でもそれらに不自由しないようにしている。"
 gdp_republic_plaza_hired_swords_modifier: "傭兵隊の給与支払人"
 gdp_republic_plaza_hired_swords_modifier_desc: "この人物は傭兵隊への報酬が遅滞なく全額支払われるようにしており、傭兵たちは誰の懐から金が出ているのかを覚えている。"
 gdp_republic_plaza_organized_worker_modifier: "労働者の組織者"
 gdp_republic_plaza_organized_worker_modifier_desc: "この人物は大規模な建設事業のために労働者を組織し、それに伴う大規模な物流について多くのことを学んだ。"
 gdp_republic_civic_works_labor_modifier: "労働力の組織化"
 gdp_republic_civic_works_labor_modifier_desc: "共和国が労働者を集めて組織化したことで、首都全域の建設が加速している。"
 gdp_republic_civic_works_materials_modifier: "建材の調達"
 gdp_republic_civic_works_materials_modifier_desc: "建築資材の調達と備蓄を組織的に進めたことで、首都全域の建設費用が削減された。"
 gdp_republic_civic_works_amenities_modifier: "公共施設の充実"
 gdp_republic_civic_works_amenities_modifier_desc: "新たな浴場や噴水、集会所が整備され、市民の気分が明るくなった。"
 gdp_republic_civic_works_market_modifier: "市場の拡張"
 gdp_republic_civic_works_market_modifier_desc: "市場地区が拡張・整備されたことで、商人が集まり、首都の交易環境が改善した。"
 gdp_republic_civic_works_guilds_modifier: "職人ギルドへの資金援助"
 gdp_republic_civic_works_guilds_modifier_desc: "支援を受けたギルドが熟練職人を首都に呼び込み、投資を促すとともに、都市環境を着実に改善している。"
 gdp_republic_civic_works_labor_character_modifier: "労働者とのつながり"
 gdp_republic_civic_works_labor_character_modifier_desc: "この統治者は、公共事業の労働者を取りまとめたことで、首都各地の熟練労働者や請負業者の人脈を得た。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "供給網"
 gdp_republic_civic_works_materials_character_modifier_desc: "この統治者は、公共事業の資材調達を通して、石材、木材、その他の資材を有利な価格で安定的に入手できるルートを確保した。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "公共施設の後援者"
 gdp_republic_civic_works_amenities_character_modifier_desc: "この統治者は、首都の公共施設に資金を投じたことで、市民から目に見えるほどの好感を得た。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "市場とのつながり"
 gdp_republic_civic_works_market_character_modifier_desc: "この統治者は、首都の市場地区を拡張したことで、この計らいに恩義を感じている商人や交易商とのつながりを得た。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "ギルドの後援者"
 gdp_republic_civic_works_guilds_character_modifier_desc: "この統治者は、職人ギルドへの資金援助によって市の職人たちと長期的な関係を築き、彼らから感謝されることで評判も高めている。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "定住地の拡大"
 gdp_republic_civic_works_settlement_modifier_desc: "首都の都市インフラへの投資によって、より多くの人々が暮らせるようになり、実際に人々が集まってきている。"
 gdp_republic_civic_works_settlement_character_modifier: "都市開発への投資家"
 gdp_republic_civic_works_settlement_character_modifier_desc: "この統治者は、共和国の首都の拡張に資金を投じたことで、都市の成長方針に影響力を持つようになった。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "都市の秩序"
 gdp_republic_civic_works_order_modifier_desc: "警備員の配置や都市インフラの整備に投資したことで、首都の秩序が保たれ、統治もしやすくなった。"
 gdp_republic_civic_works_order_character_modifier: "市政の権威"
 gdp_republic_civic_works_order_character_modifier_desc: "この統治者は、首都の治安維持に資金を投じたことで、安定した健全な統治を行う人物としての評判を得た。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "公立学校"
 gdp_republic_civic_works_school_modifier_desc: "この伯爵領は、公立学校の建設のために多額の資金提供を受けている。"
 gdp_republic_civic_works_school_character_modifier: "学校の後援者"
 gdp_republic_civic_works_school_character_modifier_desc: "この人物は、首都に学校を建設するための資金を提供し、若者の教育環境を整えた。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
