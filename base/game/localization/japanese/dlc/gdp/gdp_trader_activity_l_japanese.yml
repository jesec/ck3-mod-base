l_japanese:
 gdp_trader_work_scheme_failure_toast_title: "[trader.GetShortUIName]は市場での取引に苦戦した。"
 # Trader scheme outcome modifier names and descriptions
 gdp_trader_negotiate_deals_modifier: "有利な取引条件"
 gdp_trader_negotiate_deals_modifier_desc: "この市場では有利な取引条件が取り付けられ、商会の競争力が高まっている。"
 gdp_trader_capacity_boost_modifier: "交易路容量の向上"
 gdp_trader_capacity_boost_modifier_desc: "交易隊商の輸送体制が改善され、交易路の容量が高まっている。"
 gdp_trader_lobby_advantages_modifier: "働きかけによる優遇"
 gdp_trader_lobby_advantages_modifier_desc: "市場所有者から優遇措置を取り付けたため、この市場での競争力が高まっている。"
 gdp_trader_undermine_competitor_modifier: "地位の失墜"
 gdp_trader_undermine_competitor_modifier_desc: "この市場での評判と商業上の地位が損なわれている。"
 gdp_trader_safe_passage_modifier: "安全な通行"
 gdp_trader_safe_passage_modifier_desc: "より安全かつ迅速に移動できるよう交易路が整備されている。"
 gdp_trader_exploring_new_markets_modifier: "市場の調査"
 gdp_trader_exploring_new_markets_modifier_desc: "この市場を調査した結果、有利な条件で商品を仕入れられることが判明した。"
 gdp_trader_studying_local_crafts_modifier: "職人技の知見"
 gdp_trader_studying_local_crafts_modifier_desc: "地元の工房を研究したことで、この交易担当者の技量が磨かれ、ライフスタイル経験値の獲得量が増加した。"
 gdp_trader_undivided_focus_modifier: "一意専心"
 gdp_trader_undivided_focus_modifier_desc: "この[trader|E]は、余計なことに気を取られず、自分の仕事に専念できる。\n[trader|E]の[scheme_success_chance|E]に#P +15%#!のボーナスが付与される。"
 # Merchant trait success chance bonus descs
 gdp_trader_merchant_trait_journeyman_bonus: "熟練の交易商人"
 gdp_trader_merchant_trait_expert_bonus: "経験豊富な交易商人"
 gdp_trader_merchant_trait_master_bonus: "交易の達人"
 gdp_trader_house_member_success_bonus: "一族の成員"
 gdp_trader_scheme_shared_rules_tt: "\n一族の成員は[scheme_success_chance|E]が#P +10%#!上昇する。\n#weak 失敗した場合：\n#![trader|E]が[stress|E]を#N 10#!得る"
 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "取引条件の交渉"
 gdp_trader_negotiate_deals_scheme_desc: "あなたの交易担当者は、地元の商人や役人と有利な条件で交渉し、この市場での購入価格と販売価格の改善を試みる。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_desc_general: "[scheme|E]「$gdp_trader_negotiate_deals_scheme$」では、[trader|E]が地元の商人や役人と有利な条件で交渉し、購入価格と販売価格の改善を試みる。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_success_title: "交易担当者：取引条件を交渉した"
 gdp_trader_negotiate_deals_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetName]の市場で新たな取引条件を取りまとめることに成功した。"
 gdp_trader_finding_a_deal_scheme: "取引の開拓"
 gdp_trader_finding_a_deal_scheme_desc: "あなたの交易担当者は、利益を得られる機会を探し、わずかな利幅から確実な利益を生み出そうとする。\n\n#weak 成功した場合：\n#![gold_i] [gold|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_desc_general: "[scheme|E]「$gdp_trader_finding_a_deal_scheme$」では、[trader|E]が利益を得られる機会を探し、わずかな利幅から確実な利益を生み出す。\n\n#weak 成功した場合：\n#![gold_i] [gold|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_success_title: "交易担当者：取引を成立させた"
 gdp_trader_finding_a_deal_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で有利な取引をまとめた。"
 gdp_trader_securing_surplus_scheme: "余剰品を確保する"
 gdp_trader_securing_surplus_scheme_desc: "あなたの交易担当者は、この市場で余剰品を見つけ出し、交易路に運び込む手配をして、一時的に交易路の容量を高めようとする。\n\n#weak 成功した場合：\n#!あなたの[company|E]が、この[trade_route|E]の[trade_route_capacity|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_desc_general: "$gdp_trader_securing_surplus_scheme$[scheme|E]では、[trader|E]が余剰品を見つけ出し、交易路に運び込む手配をして、一時的に交易路の容量を高める。\n\n#weak 成功した場合：\n#![company|E]が、この[trade_route|E]の[trade_route_capacity|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_success_title: "交易担当者：余剰品を確保した"
 gdp_trader_securing_surplus_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetName]の職人たちに圧力をかけ、追加の商品をかき集めた。"
 gdp_trader_appraising_market_scheme: "市場の見極め"
 gdp_trader_appraising_market_scheme_desc: "あなたの交易担当者は、地元市場の状況を調査し、最も有利な取引機会を見つけ出そうとする。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_desc_general: "[scheme|E]「$gdp_trader_appraising_market_scheme$」では、[trader|E]が地元市場の状況を調査し、最も有利な取引機会を見つけ出す。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_success_title: "交易担当者：市場を見極めた"
 gdp_trader_appraising_market_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で新たな商機を見つけた。"
 gdp_trader_organizing_caravan_scheme: "隊商の編成"
 gdp_trader_organizing_caravan_scheme_desc: "あなたの交易担当者は、交易隊商の効率と編成を改善し、交易路の輸送量を増やそうとする。\n\n#weak 成功した場合：\n#!あなたの[company|E]が、この[trade_route|E]の[trade_route_capacity|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_desc_general: "[scheme|E]「$gdp_trader_organizing_caravan_scheme$」では、[trader|E]が交易隊商の効率と編成を改善し、輸送量を増やす。\n\n#weak 成功した場合：\n#![company|E]が、この[trade_route|E]の[trade_route_capacity|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_success_title: "交易担当者：隊商を整えた"
 gdp_trader_organizing_caravan_scheme_success_desc: "[trader.GetShortUIName]は、より軽い梱包材を見つけた。"
 gdp_trader_exploring_new_markets_scheme: "市場の拡張"
 gdp_trader_exploring_new_markets_scheme_desc: "あなたの交易担当者は、商会がまだ進出していない市場を調査し、将来の交易に向けた足がかりを築こうとする。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]での購入価格が#V 5年間#!低下する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_desc_general: "[scheme|E]「$gdp_trader_exploring_new_markets_scheme$」では、[trader|E]が商会がまだ進出していない市場を調査し、将来の交易に向けた足がかりを築く。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]での購入価格が#V 5年間#!低下する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_success_title: "交易担当者：市場を拡張した"
 gdp_trader_exploring_new_markets_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で安い仕入れ先を見つけた。"
 gdp_trader_identifying_rare_goods_scheme: "希少品を特定する"
 gdp_trader_identifying_rare_goods_scheme_desc: "あなたの交易担当者は、この市場で希少品や高級品を探し、大きな利益を得ようとする。\n\n#weak 成功した場合：\n#!多額の[gold_i] [gold|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_desc_general: "[scheme|E]「$gdp_trader_identifying_rare_goods_scheme$」では、[trader|E]が大きな利益を得るため、市場で希少品や高級品を探す。\n\n#weak 成功した場合：\n#!多額の[gold_i] [gold|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_success_title: "交易担当者：希少品を特定した"
 gdp_trader_identifying_rare_goods_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で貴重な宝石を見つけた。"
 # Diplomacy schemes
 gdp_trader_negotiating_with_ruler_scheme: "貴族との交渉"
 gdp_trader_negotiating_with_ruler_scheme_desc: "あなたの交易担当者は、市場の所有者たちと良好な関係を築こうとする。\n\n#weak 成功した場合：\n#!現地の統治者からの[opinion_i] [opinion|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_desc_general: "[scheme|E]「$gdp_trader_negotiating_with_ruler_scheme$」では、[trader|E]が市場の所有者たちと良好な関係を築こうとする。\n\n#weak 成功した場合：\n#!現地の統治者からの[opinion_i] [opinion|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_success_title: "交易担当者：貴族と交渉した"
 gdp_trader_negotiating_with_ruler_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetName]の統治者に好印象を与えた。"
 gdp_trader_building_connections_scheme: "人脈を築く"
 gdp_trader_building_connections_scheme_desc: "あなたの交易担当者は、領国内の備蓄品を利用できるよう、地元の役人たちと長く続く人脈を築こうとする。\n\n#weak 成功した場合：\n#!あなたの[company|E]が、この[trade_route|E]の[trade_route_capacity|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_desc_general: "[scheme|E]「$gdp_trader_building_connections_scheme$」では、[trader|E]が領国内の備蓄品を利用できるよう、地元の役人たちと長く続く人脈を築く。\n\n#weak 成功した場合：\n #![company|E]が、この[trade_route|E]の[trade_route_capacity|E]を#V 5年間#!獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_success_title: "交易担当者：人脈を築いた"
 gdp_trader_building_connections_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]の役人たちを説得し、より多くの荷を通してもらえるようにした。"
 gdp_trader_lobbying_advantages_scheme: "優遇措置を求める働きかけ"
 gdp_trader_lobbying_advantages_scheme_desc: "あなたの交易担当者は、商会の競争力を高めるため、市場の所有者に働きかけて優遇措置を求めようとする。\n\n#weak 成功した場合：\n#! 訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_desc_general: "[scheme|E]「$gdp_trader_lobbying_advantages_scheme$」では、[trader|E]が市場の所有者に働きかけて優遇措置を求め、商会の競争力を高める。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_success_title: "交易担当者：優遇措置を取り付けた"
 gdp_trader_lobbying_advantages_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で有利な待遇を確保した。"
 gdp_trader_building_reputation_scheme: "評判を高める"
 gdp_trader_building_reputation_scheme_desc: "あなたの交易担当者は、地域での商会の知名度と評判を高めようとする。\n\n#weak 成功した場合：\n#![prestige_i] [prestige|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_desc_general: "[scheme|E]「$gdp_trader_building_reputation_scheme$」では、[trader|E]が地域での商会の知名度と評判を高める。\n\n#weak 成功した場合：\n#![prestige_i] [prestige|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_success_title: "交易担当者：評判を高めた"
 gdp_trader_building_reputation_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]における商会の名声を高めた。"
 gdp_trader_championing_patron_scheme: "後援者の利益を守る"
 gdp_trader_championing_patron_scheme_desc: "あなたの交易担当者は、この市場における[merchant_patron|E]の交易上の利益を守ろうとする。\n\n#weak 成功した場合：\n#![merchant_patron|E]からの[opinion_i] [opinion|E]が上昇し、少量の[prestige_i] [prestige|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_desc_general: "[scheme|E]「$gdp_trader_championing_patron_scheme$」では、[trader|E]が市場における[merchant_patron|E]の交易上の利益を擁護する。\n\n#weak 成功した場合：\n#![merchant_patron|E]からの[opinion_i] [opinion|E]が上昇し、少量の[prestige_i] [prestige|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_success_title: "交易担当者：後援者の利益を守った"
 gdp_trader_championing_patron_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]における[route_owner.GetSuzerain.GetShortUINamePossessive]の影響力を強めた。"
 gdp_trader_entertaining_merchants_scheme: "交易商人をもてなす"
 gdp_trader_entertaining_merchants_scheme_desc: "あなたの交易担当者は、他の商会の代表者たちをもてなし、競合する[merchant|E]との関係改善を図ろうとする。\n\n#weak 成功した場合：\n#!競合する[merchant|E]からの[opinion_i] [opinion|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_desc_general: "[scheme|E]「$gdp_trader_entertaining_merchants_scheme$」では、[trader|E]が他の商会の代表者たちをもてなし、競合する[merchant|E]との関係改善を図る。\n\n#weak 成功した場合：\n#!競合する[merchant|E]からの[opinion_i] [opinion|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_success_title: "交易担当者：交易商人をもてなした"
 gdp_trader_entertaining_merchants_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で競合する[merchant|E]の歓心を買うことに成功した。"
 gdp_trader_hiring_local_talent_scheme: "現地の人材を雇う"
 gdp_trader_hiring_local_talent_scheme_desc: "あなたの交易担当者は、[associates|E]として迎え入れる有能な人材を探そうとする。\n\n#weak 成功した場合：\n#![company|E]が現地の[associate|E]を一人雇い入れる$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_desc_general: "[scheme|E]「$gdp_trader_hiring_local_talent_scheme$」では、[trader|E]が[associates|E]として迎え入れる有能な人材を探す。\n\n#weak 成功した場合：\n#![company|E]が現地の[associate|E]を1人雇い入れる$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_success_title: "交易担当者：現地の人材を雇った"
 gdp_trader_hiring_local_talent_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]で有能な人材を雇い入れた。"
 # Learning schemes
 gdp_trader_learning_from_locals_scheme: "現地の人々から学ぶ"
 gdp_trader_learning_from_locals_scheme_desc: "あなたの交易担当者は、現地の交易文化に深く触れ、この市場で扱われる商品の専門知識を身につけようとする。\n\n#weak 成功した場合：\n#![company|E]が[trade_expertise|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_desc_general: "[scheme|E]「$gdp_trader_learning_from_locals_scheme$」では、[trader|E]が現地の交易文化に深く触れ、市場で扱われる商品の専門知識を身につける。\n\n#weak 成功した場合：\n#![company|E]が[trade_expertise|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_success_title: "交易担当者：現地の人々から学んだ"
 gdp_trader_learning_from_locals_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]の交易担当者たちから学んだ。"
 gdp_trader_studying_local_crafts_scheme: "現地の工芸を研究する"
 gdp_trader_studying_local_crafts_scheme_desc: "あなたの交易担当者は、現地の工房を調べ、そこで生産される品々について知見を深めようとする。\n\n#weak 成功した場合：\n#![trader|E]が#V 5年間#!、より多くの[lifestyle_experience|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_studying_local_crafts_scheme_desc_general: "[scheme|E]「$gdp_trader_studying_local_crafts_scheme$」では、[trader|E]が現地の工房を調べ、そこで生産される品々について知見を深める。\n\n#weak 成功した場合：\n#![trader|E]が#V 5年間#!、より多くの[lifestyle_experience|E]を獲得する$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_studying_local_crafts_scheme_success_title: "交易担当者：現地の工芸を研究した"
 gdp_trader_studying_local_crafts_scheme_success_desc: "[trader.GetShortUIName]は[trader.GetCurrentLocation.GetNameNoTooltip]の工房を訪れ、知見を深めた。"
 gdp_trader_appraising_goods_scheme: "商品を査定する"
 gdp_trader_appraising_goods_scheme_desc: "あなたの交易担当者は、商会の商品相場に関する知識を深めるため、現地の商品を慎重に鑑定しようとする。\n\n#weak 成功した場合：\n#!訪れた[trade_market|E]の[competitiveness_i] [trade_competitiveness|E]が#V 5年間#!上昇する$gdp_trader_scheme_shared_rules_tt$"
