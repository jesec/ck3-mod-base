l_japanese:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]：失われたもの"
 gdp_guelph_ghibelline_scheme.1000.desc: "私は[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]で毎年開かれる市を訪れていた。喜びに満ちた雰囲気で、人々は打ち解け合っている。\n\n祭りの陽気な喧騒、色鮮やかな布飾り、そして香り豊かな[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip]料理の匂いが通りを満たし、私の疲れた五感を喜ばせてくれる。\n\n偶然にも、私は近くの露店を興味深そうに眺めている[target.GetTitledFirstName]を見つけた。これは私の魅力を売り込む絶好の機会だ。"
 gdp_guelph_ghibelline_scheme.1000.a: "「[ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]は、この祭りを禁じようとしたんだ」"
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "あなたは[ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]の悪意を訴えることに成功した"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName]はあなたをあしらう"
 gdp_guelph_ghibelline_scheme.1000.b: "「このピンは君にぴったりだよ、友よ！」"
 gdp_guelph_ghibelline_scheme.1000.c: "邪魔をする必要はない。"
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]：噂によれば…"
 gdp_guelph_ghibelline_scheme.1010.desc: "\n\n情報提供者たちの報告によれば、#EMP 尊敬すべき#!我らが[ROOT.Char.Custom('GetGuelphGhibelline')]の指導者[target.GetTitledFirstName]は最近、自らの重責に押しつぶされそうになっているようだ。\n\n支持者たちに上手く手紙を送れば、[target.GetTitledFirstName]が職務を担いきれなくなっているという評判を広め、その重責を担うにもっと#EMP ふさわしい#!人物がいると示唆できるだろう。"
 gdp_guelph_ghibelline_scheme.1010.a: "すぐに手紙の文案を用意させろ。"
 gdp_guelph_ghibelline_scheme.1010.a.tt: "成功率はあなたの@gg_involvement_icon! [gg_involvement|E]（#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!）に応じて変化する"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "あなたの手紙により、多くの[ROOT.Char.Custom('GetGuelphsGhibellines')]が、あなたこそ優れた指導者であると確信する"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "あなたの手紙が、かえって逆効果をもたらす"
 gdp_guelph_ghibelline_scheme.1010.b: "[ROOT.Char.GetHouse.GetName]家の者なら誰でも立派な指導者になれる！"
 gdp_guelph_ghibelline_scheme.1010.c: "そもそも、それが本当だと誰が言える？"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]：巧みな話術"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "どうやら私の工作員[court_agent.GetTitledFirstName]は、[target.GetTitledFirstNamePossessive]の宮廷で冷遇された廷臣や反対派の関心を引いたようだ。"
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "どうやら私の工作員[court_agent.GetTitledFirstName]は、[target.GetTitledFirstNamePossessive]の指導力に不満を抱く[target.Custom('GetGuelphsGhibellines')]の者たちの中に、耳を傾けてくれる者を見つけたようだ。"
 gdp_guelph_ghibelline_scheme.1020.intro: "どうやら私の工作員[court_agent.GetTitledFirstName]は、[target.GetTitledFirstName]の関心を引いたようだ。"
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nそろそろ[court_agent.GetTitledFirstNameNoTooltip]に返事を書く頃合いだ。"
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "この土地の扇動者たちを取り込んで、計画を進めるべきだろうか？"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "[court_agent.GetHerHim]に[target.GetFirstNameNoTooltip]に対する疑念を煽らせようか？"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "この機会に、[target.GetTitleAsNameNoTooltip]の前で[ROOT.Char.Custom('GetGuelphsGhibellines')]を支持するよう働きかけてもらおうか？"
 gdp_guelph_ghibelline_scheme.1020.a: "私自身の実績を生かそう。"
 gdp_guelph_ghibelline_scheme.1020.b: "ならず者どもを利用しよう。"
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip]にしっかり働いてもらおう。"
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName]が計画を順調に進展させる"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName]が説得に失敗する"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U]にはまず私の評判を高めてもらおう。"
 gdp_guelph_ghibelline_scheme.1020.prestige: "威信点の低下"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "威信がやや損なわれた。"
 gdp_guelph_ghibelline_scheme.1020.piety: "敬虔点の低下"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "敬虔さがやや損なわれた。"
 gdp_guelph_ghibelline_scheme.1020.e: "私の敬虔さは誰の目にも明らかだ！"
 gdp_guelph_ghibelline_scheme.1020.f: "口出しはしないでおこう。"
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]：根回し"
 gdp_guelph_ghibelline_scheme.1030.desc: "ある朝、見回りをしていると、長年仕える従者が慌ただしく駆け寄ってきた。\n\n「[ROOT.Char.GetTitleAsNameNoTooltip]様。[target.GetTitledFirstNamePossessive]の宮廷にいる密偵から報告です。あの[target.GetTitleAsNameNoTooltip]の[ROOT.Char.Custom('DescribeTargetSkill')]は、お世辞にも優れているとは言えなようです。\n\n何とかして、これをうまく利用できないでしょうか…？」"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "ある朝、見回りをしていると、[ROOT.Char.Custom2('RelationToMe', sly_character)]の[sly_character.GetTitledFirstName]が人目を避けるようにしながら近づいてきた。\n\n「愚かな[target.Custom('GetGuelphsGhibellines')]から[target.GetPrimaryTitle.GetDefinitiveName]を#EMP 救う#!ため、[target.GetTitledFirstName]の[ROOT.Char.Custom('DescribeTargetSkill')]に疑問を投げかけてみてはどうでしょう？\n\n聞くところによれば、その点では[target.GetSheHe]はあまり冴えないようです」"
 gdp_guelph_ghibelline_scheme.1030.a: "「大切なのは噂より実力だ」"
 gdp_guelph_ghibelline_scheme.1030.a.tt: "成功率はあなたの@gg_involvement_icon! [gg_involvement|E]（#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!）に応じて変化する"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "[target.GetShortUIName]の評判を貶めることに成功する"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "努力が無駄に終わる"
 gdp_guelph_ghibelline_scheme.1030.b: "「これを利用して、[target.GetHerHis]の宮廷での評判を落とそう」"
 gdp_guelph_ghibelline_scheme.1030.c: "「噂を流そう」"
 gdp_guelph_ghibelline_scheme.1030.d: "「そこまでする必要はない」"
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1262.desc: "大成功だ！[target.GetTitledFirstName|U]がついに理性的になり、我々と同じ真の[owner.Custom('GetGuelphGhibelline')]となった。\n\nいずれ[target.GetSheHe]にもわかる時が来るとわかっていたが、思った通りだ。"
 scheme_critical_moments.1262.a: "素晴らしい！"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.1263.desc: "#EMP 厄介な人間がいたものだ。#! 互いに苛立ちながら、どれだけ言葉を尽くし、議論を重ね、[target.GetTitledFirstName]を説得しようとしても、[target.GetSheHe]は[target.Custom('GetGuelphsGhibellines')]の主張こそが正しいのだと言って譲らなかった。\n\n言うまでもなく、我々は今回、#EMP 友好的に#!別れることはできなかった。"
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')]#!め！"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1272.desc: "祝杯を挙げよう！[owner.Custom('GetGuelphsGhibellines')]の者たちは次々と[target.GetTitledFirstName]への支持を撤回し、代わって私に指導を求めるようになった。\n\n[target.GetSheHe|U]はもはや身を引くほかない。"
 scheme_critical_moments.1272.a: "最高だ！"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.1273.desc: "我々の努力にもかかわらず、[target.GetTitledFirstName]は依然として[owner.Custom('GetGuelphsGhibellines')]の中で揺るぎない地位を保っている。私がどうにか取り付けた支持も次第に減り、ついには失われてしまった。"
 scheme_critical_moments.1273.desc.secret: "\n\n少なくとも、[target.GetSheHe]はまだ私の計画に気づいていない。"
 scheme_critical_moments.1273.desc.discovered: "\n\nさらに悪いことに、[target.GetSheHe]は私が黒幕だったと知っている。おそらく、このことを忘れはしないだろう。"
 scheme_critical_moments.1273.a: "まったく、厄介な話だ。"
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1282.desc: "大成功だ！[target.GetTitledFirstName|U]がついに理性的になり、我々と同じ真の[owner.Custom('GetGuelphGhibelline')]となった。\n\nいずれ[target.GetSheHe]にもわかる時が来るとわかっていたが、思った通りだ。"
 scheme_critical_moments.1282.a: "素晴らしい！"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.1283.desc: "#EMP 厄介な人間がいたものだ。#! 互いに苛立ちながら、どれだけ言葉を尽くし、議論を重ね、[target.GetTitledFirstName]を説得しようとしても、[target.GetSheHe]は[target.Custom('GetGuelphsGhibellines')]の主張こそが正しいのだと言って譲らなかった。\n\n言うまでもなく、我々は今回、#EMP 友好的に#!別れることはできなかった。"
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')]#!め！"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1292.desc.intro: "素晴らしい知らせだ。[target.GetTitledFirstName|U]に代わり、より穏健な[target_character.GetTitledFirstName]が就任することになった！"
 scheme_critical_moments.1292.desc.intro.unknown: "素晴らしい知らせだ。[target.GetTitledFirstName|U]に代わり、大義に忠実な者が就任することになった！"
 scheme_critical_moments.1292.desc: "\n\nこれはまさしく[ROOT.Char.Custom('GetGuelphsGhibellines')]の手柄だ。これで[target.GetPrimaryTitle.GetDefinitiveName]は公平・公正に統治されると安心していいだろう。"
 scheme_critical_moments.1292.desc.discovered: "\n\nもっとも、私が関与したことは知られている。今後は背後に気を付けるとしよう…"
 scheme_critical_moments.1292.a: "よし、いいぞ！"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]：失敗"
 scheme_critical_moments.1293.desc: "周到に立てた計画が…\n\n#EMP 誰か途中でしくじった人間がいる。#!犯人は突き止めるが、とにかく今は認めざるを得ない。今回、私は[target.GetTitledFirstName]を掌握しそこねた。我々はしばらくの間、妄信的な[target.Custom('GetGuelphGhibelline')]が[target.GetPrimaryTitle.GetDefinitiveName]を統治するのを甘んじて受け入れるしかない。"
 scheme_critical_moments.1293.a: "#EMP なんと忌々しい！#!"
