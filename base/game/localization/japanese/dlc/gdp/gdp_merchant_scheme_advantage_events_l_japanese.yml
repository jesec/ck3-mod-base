l_japanese:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]：優位性の追求"
 gdp_merchant_scheme_advantage.1000.intro: "[task_contract_location.GetBaronyNameExplicitly]での仕事を少しでも早く進める方法を考えながら、私は"
 gdp_merchant_scheme_advantage.1000.intro.rival: "ライバルである[rival.GetTitledFirstNamePossessive]の存在が、どれほど私たちの足を引っ張っているかに着目した。"
 gdp_merchant_scheme_advantage.1000.intro.partner: "解決策を求めて、共同経営者である[portrait.GetTitledFirstName]に目を向けた。"
 gdp_merchant_scheme_advantage.1000.intro.agent: "解決策を求めて、商会員の[portrait.GetTitledFirstName]に目を向けた。"
 gdp_merchant_scheme_advantage.1000.intro.trader: "解決策を求めて、交易担当者の[portrait.GetTitledFirstName]に目を向けた。"
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\n[portrait.GetTitledFirstNameNoTooltip]が本気を出して、この件に専念してくれれば、あっという間に片付くはずなのだが…"
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\n商会が一丸となって本腰を入れれば、この件もあっという間に片付くはずなのだが…"
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\n商会のためにも、私がひと肌脱いで本腰を入れた方がいいかもしれない。そうすれば、この件をさっさと片付けて次の仕事に取りかかれる…"
 gdp_merchant_scheme_advantage.1000.a: "「何のために給料を払っていると思っているんだ、[portrait.GetTitledFirstNameNoTooltip]？！」"
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.GetTitledFirstNameNoTooltip]に負担がかかる"
 gdp_merchant_scheme_advantage.1000.b: "「商会全体がもっと本気を出さなければ！」"
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] [company|E]に負担がかかる"
 gdp_merchant_scheme_advantage.1000.c: "「よし、私がやるしかない！」"
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] あなたに負担がかかる"
 gdp_merchant_scheme_advantage.1000.d.associate: "「さあ、[portrait.GetFirstNameNoTooltip]、もっと頑張れ」"
 gdp_merchant_scheme_advantage.1000.d.unity: "「この商会は怠け者ばかりだ！」"
 gdp_merchant_scheme_advantage.1000.d.stress: "「私が少し無理をするしかないか…」"
 gdp_merchant_scheme_advantage.1000.e: "「もういい…」"
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName]と私は毎日、どうすれば目標に近づけるか話し合っている。交易担当者は、[task_contract_location.GetBaronyNameExplicitly]では頼れる人手が足りないと、何度も口にした。\n\n「実は…」と[trader.GetFirstNameNoTooltip]はため息をつく。「力になってくれそうな[recruit.GetWomanMan]がいます。"
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetFirstName]という名で、[recruit_liege.GetPrimaryTitle.GetDefinitiveName|l]の[recruit_liege.GetTitledFirstName]の配下です…」"
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetFirstName]という名で、この市場で顔が利く仲介人です…」"
 gdp_merchant_scheme_advantage.1010.a: "「私から[recruit.GetHerHim]に話をつけよう…」"
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! 魅力に頼る"
 gdp_merchant_scheme_advantage.1010.b: "「費用は問わない。その[recruit.GetWomanMan]を連れてこい」"
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! 金の力に頼る"
 gdp_merchant_scheme_advantage.1010.e: "「ふん、[recruit.GetSheHe]にそこまでする価値はない」"
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName]と私は毎日、どうすれば目標に近づけるか話し合っている。やがて交易担当者は、我々の[charter.GetName]を使えば、[task_contract_location.GetBaronyNameExplicitly]の閉ざされた道も開けるのではないかと言い出した。\n\n「どうせなら」と[trader.GetFirstNameNoTooltip]が微笑んで言う。「[patron.GetTitledFirstNamePossessive]の特許状を存分に活用してはいかがでしょう？」"
 gdp_merchant_scheme_advantage.1020.a: "「そうだ、我々には[patron.GetTitleAsNamePossessiveNoTooltip]の後ろ盾がある！」"
 gdp_merchant_scheme_advantage.1020.b: "「特許状があれば十分だ」"
 gdp_merchant_scheme_advantage.1020.e: "「今はまだその時ではない…」"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "優位性の追求：潜在力"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "工作を急ぎすぎたことで、かえって進展が妨げられている。"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "優位性の追求：成長"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "優位性の追求：フェーズ"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "優位性の追求：競争力"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "工作を急ぎすぎたことで、交易活動に支障が出ている。"
 gdp_merchant_scheme_advantage_outcome: "優位性の追求"
 gdp_merchant_scheme_advantage.desc: "[opportunity|E][scheme|E]を押し進めた"
 gdp_merchant_scheme_advantage_add_1_opportunity_tt: "[scheme|E]が[scheme_opportunity_i|E] [scheme_opportunity_opportunity|E]を#P +1#!獲得する"
 gdp_merchant_scheme_advantage_add_2_opportunities_tt: "[scheme|E]が[scheme_opportunity_i|E] [scheme_opportunity_opportunity|E]を#P +2#!獲得する"
 gdp_merchant_scheme_advantage_subtract_opportunity_tt: "[scheme|E]が[scheme_opportunity_i|E] [scheme_opportunity_opportunity|E]を#N 1#!失う"
 house_relation_reason_scheme_push_for_advantage_desc: "[char.GetShortUINameNotMe|U]は[target_char.GetShortUINameNotMe]に対して交易上の優位性を追求した"
