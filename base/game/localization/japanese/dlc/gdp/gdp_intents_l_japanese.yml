l_japanese:
 schmooze_intent: "親交"
 schmooze_intent_desc: "商売を円滑に進め、[competitiveness|E]を高めようとする。"
 gdp_merchant_schmooze_modifier: "貴族との親交"
 gdp_merchant_schmooze_modifier_desc: "この人物は、宴席でこの市場の地元貴族と親交を深めた。"
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U]は[TARGET_CHARACTER.GetShortUINameNoTooltip]と親交を深めた"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName]は好機を捉えて[TARGET_CHARACTER.GetShortUINameNoTooltip]と懇意になった"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U]は貴族と親交を深めた"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName]は好機を捉えて貴族と懇意になった"
 gdp_schmooze_events.1000.t: "[schmoozee.GetFirstNameNoTooltip]との親交"
 gdp_schmooze_events.1000.desc: "我々商人は、貴族と肩を並べる機会を決して逃してはならない。気の利いた一言や上質な贈り物があれば、貴族が事業の邪魔をしたり、競争相手に肩入れしたりするのを防ぐことができる。\n\nおべっかを使いすぎず、かといって馴れ馴れしくもならないよう気を配りながら、私は[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))]である[schmoozee.GetTitledFirstName]の歓心を得るよう最善を尽くす。"
 gdp_schmooze_events.1000.a: "「どうかこちらをお納めください、[schmoozee.GetTitleAsNameNoTooltip]」"
 gdp_schmooze_events.1000.b: "「私は一介の商人に過ぎませんから、分をわきまえねばなりません」"
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip]が機嫌を良くする"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip]が呆れたように目で天を仰ぐ"
 gdp_schmooze_events.1000.c: "「お話しできて光栄でした」"
 gdp_schmooze_events.1000.d: "「[schmoozee.GetTitleAsNameNoTooltip]にふさわしい品を数多く取り揃えております！」"
 gdp_schmooze_events.1010.t: "友好的な競争"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName]と私は食事を囲み、[ROOT.Char.Custom('RegionalDrink')]と[ROOT.Char.Custom('GetExpensiveMeal')]を楽しみながら、互いの商会の成功を自慢し合っている。"
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName]と私は[ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')]の木陰で休みながら、互いの商会の成功を自慢し合っている。"
 gdp_schmooze_events.1010.outro: "\n\n互いに成功を自慢し合いながらも、多くの点で意見が一致していることは明らかだった。[schmoozee.GetHerHim]は私にとって有益な存在になり得るし、私もまた[schmoozee.GetHerHim]にとってそうなれるかもしれない。"
 gdp_schmooze_events.1010.a: "「相応の対価をいただけるなら、手を引こう」"
 gdp_schmooze_events.1010.b: "「これと引き換えに、我々の邪魔はしないでいただきたい」"
 gdp_schmooze_events.1010.c: "「あなたが私を立てるなら、私もあなたを立てましょう」"
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip]が同意する"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip]は興味を示さない"
 gdp_schmooze_events.1010.d: "今はその時ではない。"
 gdp_schmooze_events.1030.t: "板挟み"
 gdp_schmooze_events.1030.feast: "宴が進むにつれ、私は[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))]の[schmoozee_1.GetTitledFirstName]と、[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))]の[schmoozee_2.GetTitledFirstName]の間で板挟みになっていた。二人の貴族は焼いた[schmoozer.Custom('GetRegionalFish')]をつつきながら、商売や仲介業のあるべき姿について気ままに論じ合っている。"
 gdp_schmooze_events.1030.hunt: "狩りが進むにつれ、私は[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))]の[schmoozee_1.GetTitledFirstName]と、[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))]の[schmoozee_2.GetTitledFirstName]の間で板挟みになっていた。猟犬が獲物の匂いを追うなか、二人の貴族は商売や仲介業のあるべき姿について気ままに論じ合っている。"
 gdp_schmooze_events.1030.outro: "\n\nやがて[schmoozee_1.GetFirstNameNoTooltip]が決着をつけようと私に向き直り、こう言った。「さあ、[schmoozer.GetTitledFirstNameNoTooltip]。商人なら意見の一つくらいあるだろう？」"
 gdp_schmooze_events.1030.a: "「あなたの仰る通りです、[schmoozee_1.GetTitleAsNameNoTooltip]」"
 gdp_schmooze_events.1030.b: "「[schmoozee_2.GetTitledFirstNameNoTooltip]の考えが的を射ています」"
 gdp_schmooze_events.1030.c: "「どちらの考えも大変勉強になります」"
 gdp_schmooze_events.1030.c.success: "二人は機嫌を良くする"
 gdp_schmooze_events.1030.c.failure: "二人は呆れ顔をする"
 gdp_schmooze_events.1030.d: "「私には何とも申し上げられません」"
 gdp_schmooze_events.1050.t: "市場の動き"
 gdp_schmooze_events.1050.feast: "宴がひと段落し、客人たちは歓談し、召使いたちは給仕に追われている。"
 gdp_schmooze_events.1050.hunt: "猟犬と勢子が先へ進む間、私たちは足を止め、[ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')]の[ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')]を見渡す。"
 gdp_schmooze_events.1050.outro: "そして私は、自然と市場の重要人物たちに目を向けていた。\n\n[market_1.GetLocationTitle.GetNameNoTier]では[schmoozee_1.GetTitledFirstName]と知り合っておいて損はないし、[market_2.GetLocationTitle.GetNameNoTier]では[schmoozee_2.GetTitledFirstName]と知り合っておきたい。"
 gdp_schmooze_events.1050.three: "さらに、[market_3.GetLocationTitle.GetNameNoTier]を拠点とする[schmoozee_3.GetTitledFirstName]の姿も目に入った。"
 gdp_schmooze_events.1050.a: "「[schmoozee_1.GetFirstNameNoTooltip]、ぜひお話ししたいと思っていました！」"
 gdp_schmooze_events.1050.b: "「興味深いお話を色々耳にしていますよ、[schmoozee_2.GetFirstNameNoTooltip]」"
 gdp_schmooze_events.1050.c: "「おや、[schmoozee_3.GetFirstNameNoTooltip]！少しお話ししませんか？」"
 gdp_schmooze_events.1050.d: "市場は今のままで順調だ。"
 gdp_schmooze_events.1060.t: "注目の奪い合い"
 gdp_schmooze_events.1060.feast: "召使いたちが卓を巡り、杯を満たし、新たな料理を運んでくるなか、"
 gdp_schmooze_events.1060.hunt: "水袋で喉を潤し、足を休めていると、"
 gdp_schmooze_events.1060.outro: "競合相手の[rival.GetName]が、臆面もなく[schmoozee.GetName]に取り入っているのが目に入った。\n\nあの嫌味な[rival.GetWomanMan]は、自分の交易担当者たちの利点ばかりを並べ立て、私の部下を山師や大ぼら吹き呼ばわりしている！"
 gdp_schmooze_events.1060.a: "「おいおい、[rival.GetHouse.GetBaseNameNoTooltip]家のちっぽけな商売など笑い話にもならない！」"
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip]が恥をかく"
 gdp_schmooze_events.1060.a.failure: "あなたが恥をかく"
 gdp_schmooze_events.1060.b: "「ちょっと待った！我々の帳簿は健全そのものだ」"
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip]が納得する"
 gdp_schmooze_events.1060.b.failure: "説得に失敗する"
 gdp_schmooze_events.1060.c: "好きに言わせておけ。"
 activity_used_trade_market_luxury_items_modifier: "社交需要"
 activity_used_trade_market_luxury_items_modifier_desc: "この市場の贅沢品は、交易商人が活動のために確保している。"
 activity_used_trade_market_comforts_modifier: "社交需要"
 activity_used_trade_market_comforts_modifier_desc: "この市場の嗜好品は、交易商人が活動のために確保している。"
