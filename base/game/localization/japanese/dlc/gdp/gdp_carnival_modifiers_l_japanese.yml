l_japanese:
 gdp_carnival_prosperity_modifier: "カーニバルによる繁栄"
 gdp_carnival_prosperity_modifier_desc: "この属州は、カーニバルが成功してから繁栄している"
 gdp_civic_commitment_modifier: "市民への献身"
 gdp_civic_commitment_modifier_desc: "この人物は、自らの共和国に暮らす人々の生活向上に身を捧げている。"
 gdp_down_to_earth_ruler_modifier: "親しみやすい統治者"
 gdp_down_to_earth_ruler_modifier_desc: "市民はこの人物を、親しみやすく公正な人物とみなしている。"
 gdp_self_aggrandizing_decorations_modifier: "自己顕示の装飾"
 gdp_self_aggrandizing_decorations_modifier_desc: "この人物は、自らの栄光を称える記念碑を築いている"
 gdp_masked_face_modifier: "仮面姿"
 gdp_masked_face_modifier_desc: "この人物はカーニバルの間、美しい仮面で顔を隠している。"
 gdp_masked_vigile_modifier: "仮面の夜警"
 gdp_masked_vigile_modifier_desc: "この人物はカーニバルの間、仮面をつけて影の中を忍び歩いている。"
 gdp_order_and_business_modifier: "秩序と商売"
 gdp_order_and_business_modifier_desc: "この人物は商売と秩序を重視している。"
 gdp_echos_of_carnival_modifier: "カーニバルの高揚"
 gdp_echos_of_carnival_modifier_desc: "この人物はいまなおカーニバルの高揚を保っている。"
 gdp_carnival_basic_celebration_modifier: "楽しんだ民衆"
 gdp_carnival_basic_celebration_modifier_desc: "民衆はカーニバルを満喫した。"
 gdp_carnival_extensive_celebration_modifier: "触発された民衆"
 gdp_carnival_extensive_celebration_modifier_desc: "民衆はカーニバルを通じて、公共への務めに目覚めた。"
 gdp_carnival_extravagant_celebration_modifier: "畏敬に満ちた民衆"
 gdp_carnival_extravagant_celebration_modifier_desc: "民衆は自らの共和国に対し、深い畏敬の念を抱いている。"
 gdp_masked_paranoia_modifier: "仮面の下の猜疑心"
 gdp_masked_paranoia_modifier_desc: "この人物は暗殺者に襲われながらも逃げ延びた。だが、彼らはどこかにまだ潜んでいる。"
 gdp_terrifying_procession_modifier: "恐怖の示威行進"
 gdp_terrifying_procession_modifier_desc: "この人物は、自らに逆らえば容赦しないことを万人に知らしめるため、恐ろしい示威行進を催した。"
 gdp_pious_procession_modifier: "敬虔なる行進"
 gdp_pious_procession_modifier_desc: "この人物は、自らが敬虔な人間であることを万人に知らしめるため、行進を催した。"
