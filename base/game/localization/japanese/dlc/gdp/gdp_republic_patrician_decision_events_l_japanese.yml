l_japanese:
 city_stroll_prefix: "都市散策"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$：拾った者勝ち"
 gdp_republic_patrician_decision.1000.desc: "大通りから路地に入ると、地元の行商人が話をしている最中だった。\n\n「…それで、結局だれも受け取りにこなかったんだ」[local_character.GetWomanMan]は連れに向かって肩をすくめ、通りに散乱している[abandoned_trade_good.GetNameNoTooltip|l]の木箱を指さす。\n\nこの荷の所有者であると名乗り出た者はいない。私は素早くその荷の値踏みをする。これは#EMP 好機#!だ。"
 gdp_republic_patrician_decision.1000.a: "少しばかり需要を作ってやるか…"
 gdp_republic_patrician_decision.1000.a.flavor: "[abandoned_trade_good.GetNameNoTooltip|l]の木箱は壊され、中身は粉々になる。"
 gdp_republic_patrician_decision.1000.b: "「お、おい！それは私の荷だ！」"
 gdp_republic_patrician_decision.1000.c: "「おや、[liege_scope.GetTitledFirstNamePossessiveNoTooltip]様が失くした[abandoned_trade_good.GetNameNoTooltip|l]ではないか！助かった、感謝する」"
 gdp_republic_patrician_decision.1000.d: "私には関係のないことだ。"
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$：庭園での一日"
 gdp_republic_patrician_decision.1010.desc: "隠れた憩いの場を見つけた。[city_location.GetTitle.GetNameNoTier]の入り組んだ路地の奥にある小ぢんまりとした庭園、まさに宝石の原石だ。歩道は年季が入っていて、植物の数こそ少ないものの、よく手入れがされている。きっと熱心な管理人がいるのだろう。\n\n貴族たちだけでなく、商人も、庶民も、労働者たちも、皆が緑の中に佇み、仕事の合間のひとときを満喫している。\n\nのんびり歩いているうちに私の気分も少し上向き、背負っている重責もいくらか軽くなった気がした。"
 gdp_republic_patrician_decision.1010.a: "この場所を[city_location.GetTitle.GetNameNoTierNoTooltip]で一番の庭園にしよう！"
 gdp_republic_patrician_decision.1010.b: "おや、この可愛らしい植物は何かな？"
 gdp_republic_patrician_decision.1010.b.poison_plant: "興味深い植物を見つける"
 gdp_republic_patrician_decision.1010.b.health_plant: "薬効のある薬草を見つける"
 gdp_republic_patrician_decision.1010.c: "少しばかり…羽を伸ばすとしようか…"
 gdp_republic_patrician_decision.1010.c.flavor: "すべてをさらけ出そう。なんと心地の良いことか！"
 gdp_republic_patrician_decision.1010.c.success: "誰にも気づかれずに済む"
 gdp_republic_patrician_decision.1010.c.failure: "見つかってしまう"
 gdp_republic_patrician_decision.1010.d: "いい気分だ！"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$：[city_location.GetTitle.GetNameNoTierNoTooltip]の大広場"
 gdp_republic_patrician_decision.1020.intro: "[city_location.GetCounty.GetTitle.GetAdjective]の貴族や権力層がどんな駆け引きや陰謀劇を繰り広げていようとも、大広場の日常は今日も変わらず続いている。"
 gdp_republic_patrician_decision.1020.intro.01: "厨房の火が赤く燃え上がり、出来立ての[ROOT.Char.Custom('GetLocalStreetFood')]のおいしそうな香りが鼻腔を満たす。"
 gdp_republic_patrician_decision.1020.intro.02: "こびりついた泥を落とそうと一生懸命に水をかける飼い主に向かって、反抗的なロバがいなないている。"
 gdp_republic_patrician_decision.1020.intro.03: "何人かの老市民が散歩をしながら、パンの値段が高いとか、近頃の若者は礼儀がなっていないとか不満を垂れている。"
 gdp_republic_patrician_decision.1020.intro.04: "[ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l]の群れが上空を旋回し、露店に並べられた食べ物を虎視眈々と窺っている。"
 gdp_republic_patrician_decision.1020.intro.rain: "今朝の大広場は、昨日の豪雨の爪痕が残っている。"
 gdp_republic_patrician_decision.1020.desc.maa: "\n\n少し離れた場所に、[city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]の出身ではない兵士の一団がいるのが目に入った。見るからに場違いで、不安げに視線を泳がせている。言い争っている最中のようで、時折大きな声も聞こえる。どうやら、彼らは新たな雇い主を探しているようだ。"
 gdp_republic_patrician_decision.1020.desc.trader: "\n\n広場の端で、みすぼらしい身なりの人物が通りかかる人々に不機嫌そうな視線を投げかけている。近づいてみると、誉れ高き[liege_scope.GetHouse.GetBaseName]家との取引の契約が、最近になって打ち切られたことを嘆いている。落ちぶれた元有名商人といったところだろうか？"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\n広場の中央では、積み上げられた木箱の上に腰かけた医師が、ちょうど講義を締めくくろうとしている。体液と、黒胆汁の調和についての内容だ。私はなるほどといった風を装ってうなずく。$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\n広場の片隅、薄暗い場所にある露店で、私は完璧な[ROOT.Char.Custom('RandomMediumObject')]を見つけた。これがあれば、[scheme_to_boost.GetName|l]工作もきっと捗るだろう…$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\n広場を見渡したところ、何かきらきらと光るものがあることに気づいた。その源を探ろうと目を凝らして地面を見ると、ほとんど土に埋もれた小さな宝石を見つけた。$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\n広場の向こう、困窮した農民たちの小さな集団が敷地の外へと追い立てられている。ひもじさと恐怖で泣き声を上げる幼い子供の姿に胸が引き裂かれそうになる。居合わせた人々は、できるだけ無関心を装おうとしているようだ。"
 gdp_republic_patrician_decision.1020.outro: "\n\n従者が控えめに咳払いをする。そろそろ居所に戻って他の仕事に取り掛かる時間であることを、さりげなく知らせてくれたのだ。"
 gdp_republic_patrician_decision.1020.a: "一、二名を食わせていくくらいならば可能だ。"
 gdp_republic_patrician_decision.1020.b: "あの兵士たちは役に立つかもしれないな…"
 gdp_republic_patrician_decision.1020.c: "ふむ、有能な商人なら何人いても損ではないが…"
 gdp_republic_patrician_decision.1020.d: "あの医師を雇おう。"
 gdp_republic_patrician_decision.1020.e: "仕事が先、散策は後だ。"
 gdp_republic_patrician_decision.1020.f: "汚れをきれいに落とそう…"
 gdp_republic_patrician_decision.1020.g: "見るべき場所も会うべき人も尽きない！"
 gdp_republic_patrician_decision.1020.g.alternate: "[GetPlayer.GetCapitalLocation.GetNameNoTooltip]の日常だな。"
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$：[city_location.GetTitle.GetNameNoTierPossessiveNoTooltip]の港"
 gdp_republic_patrician_decision.1030.desc: "港が近づくにつれ、魚と腐った海藻の臭いがどんどんと濃くなってくる。漁師たちやその家族——母親たちと幼い子どもたち、そして野良猫の群れがあたりにたむろし、それぞれ日々の営みを続けている。\n\n通り過ぎざま、二人の漁師の嘆きが聞こえてきた。「…新しい釣り針は手に入ったが、新しい網がありゃあもっと魚を獲れるんだがなあ…」私の姿に気づき、二人は口をつぐんだ。"
 gdp_republic_patrician_decision.1030.desc.outro: "\n\n私はふむふむとうなづく。"
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\n私はふむふむとうなづく。そんな私の足元には野良猫がすり寄ってゴロゴロと喉を鳴らしていた。"
 gdp_republic_patrician_decision.1030.a: "「新しい網なら私が用立てしてやってもいいが…」"
 gdp_republic_patrician_decision.1030.a.flavor: "これで#EMP ひと儲け#!できそうだ！"
 gdp_republic_patrician_decision.1030.b: "「その魚、まとめて買い取るならいくらになる？」"
 gdp_republic_patrician_decision.1030.c: "猫だ！"
 gdp_republic_patrician_decision.1030.d: "「いいお天気だね」"
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$：[ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "のんびりと散策していると、大広場に[liege_scope.GetTitledFirstNamePossessive]が新たに手がけたものが目に入った。[ROOT.Char.Custom('GetGreatProjectDescription')]。\n\nしかし、現場の監督者には悩みがあるようだ。頭を掻きむしりながら、名簿に並んだ名前と印章をしげしげと見つめている。「この…多額の寄付なのですが…印章の一部が欠けていて…一体どなたに寄付をしていただいたのか…うーん…」\n\n事業の寄付者の印章がない？#EMP おもしろい#!。"
 gdp_republic_patrician_decision.1040.a: "「私だ！我々が寄付をしたんだ！」"
 gdp_republic_patrician_decision.1040.a.success: "寄付を自分の手柄にする"
 gdp_republic_patrician_decision.1040.a.failure: "嘘が見破られる"
 gdp_republic_patrician_decision.1040.b: "「[liege_scope.GetTitledFirstNamePossessiveNoTooltip]様の寄付だ！素晴らしい！」"
 gdp_republic_patrician_decision.1040.c: "私には関係のないことだ。"
 gdp_republic_patrician_decision.1040.c.flavor: "自分たちで探し当てるだろう。"
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')]が[contribution_to_fund.GetName]を得る"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$：出鼻をくじかれる"
 gdp_republic_patrician_decision.1100.desc: "[city_location.GetTitle.GetNameNoTierPossessive]の美しい街並みを散策することにした。書斎を出る前に、鞄をぽんと叩いて確認する。\n\n#EMP ごつん#!——低い音が鳴る。私はおでこを扉にぶつけてしまった。忌々しい扉め——#EMP ん？びくともしない#!ぞ。湿気で膨らんだのか？\n\n部屋を見渡す。そう、窓はある。しかし、飛び降りれば骨折は免れまい。\n\nよく考えよう。"
 gdp_republic_patrician_decision.1100.a: "「お、おい！衛兵はいるか？使用人は？」"
 gdp_republic_patrician_decision.1100.a.flavor: "いやまさか、壁が迫ってきているわけではないよな？そう…だよな？"
 gdp_republic_patrician_decision.1100.b: "窓の下にあるものが衝撃を吸収してくれる！"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "ちょうど体を動かしたいと思っていたところだ！"
 gdp_republic_patrician_decision.1100.d: "仕方ない…仕事に戻ろう。"
