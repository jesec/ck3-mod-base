l_japanese:
 option_boilerplate.tt.partner_aptitude: "#WEAK この決闘の勝敗は、あなたの[deputy_possessive|E]の[aptitude|E]によって決まる#!"
 option_boilerplate.tt.partner_aptitude.success: "代理人が勝利する"
 option_boilerplate.tt.partner_aptitude.failure: "代理人が敗北する"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$：[destination.GetBaronyNameExplicitlyNoTooltip]の不満の声"
 gdp_merchant_unity_contract.1004.desc: "[local_ruler.GetTitledFirstNamePossessive]から届いた書簡は、簡潔そのものだった。私の配下の交易担当者である[trader.GetTitledFirstName]、ひいては商会そのものの振る舞いについて、[destination.GetBaronyNameExplicitly]の怒れる住民たちから疑義が呈されているというのだ。\n\n地元の商人や事業主、住民たちは皆、商会との取引に不審な点があると訴えている。[local_ruler.GetTitledFirstNameNoTooltip]はこの問題を早急に片付け、不満を訴える人々を静めたいと考えているようだ。\n\nどうやら[trader.GetTitledFirstNameNoTooltip]は、[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]から離れた地で監視の目が届かないことをいいことに、少々勝手をしすぎているらしい。\n\n今やるべきことは、[destination.GetBaronyNameExplicitlyNoTooltip]へ向かうことだけだ。"
 gdp_merchant_unity_contract.1004.a: "出発しよう。"
 gdp_merchant_unity_contract.1004.tt.destination_list: "直ちに[destination.GetBaronyNameExplicitly]への旅を開始する"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT [task_contract|E]の完了条件：\n$EFFECT_LIST_BULLET$弁明の機会は#V 3#!回ある：\n$TAB$$EFFECT_LIST_BULLET$#V 2#!回の弁明に成功すれば$label_success_standard$が保証される\n$TAB$$EFFECT_LIST_BULLET$#V 3#!回の弁明に成功すれば$label_success_critical$が保証される\n$TAB$$EFFECT_LIST_BULLET$#V 1#!回の弁明に成功した場合、$label_success_standard$、$label_success_qualified$、または$label_failure_standard$のいずれかになる。\n$EFFECT_LIST_BULLET$以下のいずれかの試練が発生する：\n$TAB$$EFFECT_LIST_BULLET$あなたの[stewardship|E]能力が試される\n$TAB$$EFFECT_LIST_BULLET$[GetCourtPositionType('partner_court_position').GetName()]である[deputy_possessive|E]の[aptitude|E]が試される\n$TAB$$EFFECT_LIST_BULLET$あなたの[diplomacy|E]、[intrigue|E]、または[learning|E]能力が試される#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$：広場"
 gdp_merchant_unity_contract.1010.desc.intro: "「[ROOT.Char.GetTitledFirstNameNoTooltip]殿だな？」[destination.GetBaronyNameExplicitly]に到着した我々を迎えた[local_ruler.GetTitledFirstName]は、ため息交じりに言った。私の配下の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))]である[trader.GetTitledFirstName]は、護衛による監視のもと連れてこられている。"
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "[GetCourtPositionType('partner_court_position').GetName()]である[partner.GetFirstName]が私の後に続き、いつでも助けに入れるよう警戒している。"
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n「そちらの部下が大きな騒ぎを起こした。証人もいる」[local_ruler.GetFirstNameNoTooltip]はこう続けた。「速やかに解決するように。こちらには、こんなことに割く時間はない！」"
 gdp_merchant_unity_contract.1010.desc.outro: "\n\n私は[person_c.GetTitledFirstName]と[person_d.GetTitledFirstName]に会い、苦情の内容を聞くよう促された。[trader.GetFirstNameNoTooltip]といえば、「[ROOT.Char.GetTitleAsNameNoTooltip]、事情はわかっていただけるでしょう…？」と言いたげな視線を送ってくる。"
 gdp_merchant_unity_contract.1010.a: "[local_ruler.GetTitledFirstNameNoTooltip]殿、事情を説明していただけますか？"
 gdp_merchant_unity_contract.1010.a.tt: "直ちに[THIS.Char.GetTitledFirstNamePossessive]に説明を求める"
 gdp_merchant_unity_contract.1010.b: "[person_c.GetTitledFirstNameNoTooltip]に会うとしよう。"
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip]もぜひ話したいようだ。"
 gdp_merchant_unity_contract.1010.d: "今すぐ決着をつけよう。"
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$：[char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "私たちは[char_current.GetTitleAsNamePossessive]のけばけばしい私邸の一角へ案内された。[char_current.GetSheHe|U]は私を[destination.GetTitle.Custom('BaronyTownTypePossessive')]の有力者たちが集まる会合に使われているらしい一室へ導き、席に着くよう促した。"
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName]は私を近くにある[char_current.GetHerHis]の商会へ案内した。そこでは、[char_current.GetHerHis]の商会員たちが、その日の取引の成果を帳簿に忙しなく書き込んでいる。"
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName]はこの街の港を取り仕切っており、波止場から出入りする船に目を光らせている。[char_current.GetHerHis|U]の膨大な書類には、船舶が支払うべき諸料金や、積荷と揚げ荷の記録が細かく記されている。"
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName]は[destination.GetTitle.GetBaseNameNoTierPossessive]の中央市場を管理しており、行商人たちが正規の許可を得ていること、そして[local_ruler.GetTitleAsNamePossessiveNoTooltip]の法が守られていることを確認している。"
 gdp_merchant_unity_contract.1011.desc.business.smithy: "私は[char_current.GetFirstName]を[char_current.GetHerHis]の鍛冶場で見つけた。馬の蹄鉄を打つのに忙しく、私が近づいてきたことに気づかない。ようやく目が合ったところで[char_current.GetSheHe|U]は謝罪し、仕事を見習いに任せた。"
 gdp_merchant_unity_contract.1011.desc.business.tannery: "私は[char_current.GetFirstName]を[char_current.GetHerHis]のなめし革工房で見つけた。街外れにあるその一角には、鼻を突く臭いが漂っているが、[char_current.GetSheHe|U]は意に介していないようだ。積み上げられた皮革と客足の多さを見れば、悪臭など問題にならないほどの利益があることがわかる。"
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "私は[char_current.GetFirstName]を[char_current.GetHerHis]の工房で見つけた。室内には[char_current.Custom('GetRandomAppropriateTree')]の香りが立ち込めている。[char_current.GetSheHe]は私に気づくと、彫っていた継ぎ手を脇へ置いた。"
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName]は[destination.GetTitle.GetAdjectiveNoTooltip]の衛兵隊長だが、私は武器庫で居眠りしている[char_current.GetHerHim]を見つけた。目を覚ました[char_current.GetSheHe]は席を勧めながら、休憩中だったのだと言い訳した。"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "「率直にお話ししましょう、[ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip]殿」[char_current.GetSheHe]は切り出した。「あなたの配下であるこの[trader.GetWomanMan]が、あらゆる不正に手を染めていると聞いております。"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n「部下をしっかり管理してくださいよ。さもなければ、よそで商売をしてもらうことになります」"
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "「そんなに難しいことですか？」[char_current.GetSheHe]は微笑む。「私はただ、公正に商売をして欲しいと言っているだけです。そんなやり方では、[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]の名が泣きますよ…」"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "「警告しておきます」[char_current.GetSheHe]は微笑んだ。「[local_ruler.GetTitleAsNameNoTooltip]はこれまで辛抱強く耐えてきましたが、[local_ruler.GetHerHim]の忍耐力を試すような真似は避けるべきです」"
 gdp_merchant_unity_contract.1011.desc.personality.market: "「ここで商売をしている人間は大勢います」[char_current.GetSheHe]は微笑み、両腕を広げる。「ですが、苦情が絶えないのは…」[char_current.GetSheHe]は責めるように私を指さし、こう続けた。「#EMP あなたの#!部下だけなのですよ」"
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "「こんなことわざがあります」[char_current.GetSheHe]はわざとらしく顔をしかめて言った。「#EMP 火のない所に煙は立たない#!ってね。だが、あなたの部下からは#EMP 大量の#!煙が上がっているのですよ！」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "「私は常に誠実に商売をしてきました。帳簿も顧客との関係も健全に保っています。皆が同じようにできないのは、実に残念なことです…」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "「言い逃れはできません。[char_current.GetFaith.WealthGodName]はすべてを見ておられる。私は常に[char_current.GetFaith.WealthGodHerHis]の加護を失わぬよう努めています。それを怠る者は、やがて思い知ることになるでしょう…」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "「いいですか、私だって人並みに金は好きです。いや、人並み以上かもしれない！ですが、毎度のように代金を踏み倒されていては商売になりません」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "「[ROOT.Char.GetTitledFirstNameNoTooltip]殿、あなたは話のわかる人に見えます。どうか分かってください。あなたの部下は我々に損害を与えたのです。そして、我々にはこれを看過できるほどの余裕はありません」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "「私は無駄なことはしない人間です。だから率直に言いますし、相手にもそうしてほしい。あなたの部下は嘘つきです。それだけのことですよ」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "「ええ、わかっています。私たちは順調にやっているように見えるでしょう。しかし、商品が届かなければ商売になりません。そして、あなたの部下には何度も裏切られてきたのです」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "「[ROOT.Char.GetTitledFirstNameNoTooltip]よ、私は公私ともに公平さを重んじているのです。目下の者とも、目上の者とも公平に接するようにしています。だがそれは、相手もそうである場合に限る。#EMP そうでない者#!との間に不和が生じるのは当然でしょう」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "「お互い忙しい身ですから、単刀直入に言いましょう。必要なものが手に入らなければ、私は養うべき者を養えない。だからこの問題を解決してもらいたいのです」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "「[trader.GetFirstName]も根はまともな[trader.GetWomanMan]なのでしょう。だが私にも我慢の限界がある。そして[trader.GetSheHe]は、とっくにその一線を越えているのです」"
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "「さて…あなたはどうなさるおつもりですか？あなたの部下は、この地でずいぶんと敵を作ってしまった。それも、不必要にね。我々はただ、まっとうな扱いを受けたいだけなのですが」"
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "それに、積荷を何度も紛失したとか」"
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "それに、粗悪な品を納品したとか」"
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "それに、支払うべき金を払わなかったとか」"
 gdp_merchant_unity_contract.1011.a: "食い違いについて言い訳を試みる。"
 gdp_merchant_unity_contract.1011.b: "自分は誠実な人間であることを訴える。"
 gdp_merchant_unity_contract.1011.c: "もっともらしい作り話をでっち上げる。"
 gdp_merchant_unity_contract.1011.d.gold: "「これをどうぞ。ご迷惑をおかけしたお詫びです」"
 gdp_merchant_unity_contract.1011.d.competitiveness: "「必ず解決してみせましょう」"
 gdp_merchant_unity_contract.1011.e: "「お互いに#EMP わかり合う#!ことはできませんか？」"
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U]、説明してくれ。"
 gdp_merchant_unity_contract.1011.f.partner_away: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]さえここにいれば…"
 gdp_merchant_unity_contract.1011.f.partner_diff: "別の[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]さえいれば…"
 gdp_merchant_unity_contract.1011.f.no_partner: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]さえいてくれれば…"
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT #V 3#!回ある弁明の機会のうち、[task_contract.MakeScope.Var('assurances_given').GetValue|0V]回成功した#!#"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT #V 3#!人のうち、[task_contract.MakeScope.Var('chars_checked').GetValue|0V]人の[characters|E]と話をした#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "#P +1#!回の弁明に成功"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "弁明が成功していない"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "ここをこうして、あの記録をひとつ消そう。"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "まさか、そんな。え？本当に？"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "[char_current.GetHerHis]が愚かな過ちを犯す"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "完全に辻褄が合っている"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "[char_current.GetSheHe]は自分で思うほど賢くない"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "相手の方が賢い"
 gdp_merchant_unity_contract.1011.learning.tt.success: "目の付け所が良い"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "どこを探しても何も見つからない"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$：成功！"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$：失敗!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$：任務の放置"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "[char_current.GetTitledFirstName]は帳簿に目を通しながら、不正の証拠を指摘していく。期待されていた利益を出さなかった、あるいは成果が水準を下回った支出がある。"
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "私は[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]における我が商会の評判の良さと、近隣の名士たちがいかに我々を信頼しているかを長々と語った。最近起きた取引上の問題はあくまで例外的な出来事であり、商業の発展のためにも水に流すべきだと説得を試みた。"
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "私は最近置かれている苦境について、何度も脇道に逸れながら、都合よく真実を織り交ぜつつ長話を続けた。そのうちに自分自身ですら、どこまでが嘘だったのかわからなくなってくる始末だ。"
 gdp_merchant_unity_contract.1012.desc.method.learning: "我々は一日の大半#EMP にも感じられるような#!長い時間を費やして、[destination.GetBaronyNameExplicitly]における[char_current.GetTitledFirstNamePossessive]の事業についてありとあらゆる角度から話し合った。もはや調べ損ねたことも、聞きそびれたこともない。"
 gdp_merchant_unity_contract.1012.desc.method.partner: "[partner.GetFirstName]が聞き取りを行う間、[char_current.GetTitledFirstName]は座って、果てしなく続くかに思える質問に答えていった。最初は辛抱強く対応していたが、時間が経つにつれて疲弊していった。"
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "「この件についてご理解いただければ、#EMP 本当に#!ありがたいのですが」私は微笑んで財布に手を伸ばし、数枚の硬貨を卓上に置いた。[char_current.GetSheHe|U]は一瞬動きを止めると、輝く硬貨と私の意味ありげな視線を交互に一瞥する。"
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "「[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]は、誤解によってご不便をおかけしたことを大変申し訳なく思っております」私はなだめるように続けた。「そちらの損失については、この私が#EMP 直接#!埋め合わせましょう」"
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "できることはすべてやった。あとは結果を待つだけだ。"
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip]は訳知り顔で私を見ると、硬貨を自分の方へ引き寄せた。"
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "[char_current.GetFirstNameNoTooltip]の驚きはたちまち怒りへと変わり、私は出口を指し示された。"
 gdp_merchant_unity_contract.1012.desc.result.success: "口先でうまく言いくるめつつ、商売のままならなさを嘆いてみせると、[char_current.GetFirstNameNoTooltip]は一つ一つの食い違いに対する私の言い訳を次第に受け入れていった。長距離交易にはよくある、どうしようもない現実というわけだ。"
 gdp_merchant_unity_contract.1012.desc.result.failure: "私はあらゆる手を尽くして説得を試みたが、[char_current.GetSheHe]は私の主張をことごとく退け、解決策や反論、あるいは自身の経験からの実例を持ち出し、決して納得しなかった。"
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "掌中の1羽は叢中の2羽に値するというが、この[char_current.GetWomanMan]がおそらく不正に得たであろう稼ぎは私の手にしっくりと収まっている。たとえこれを手に入れたことで、[char_current.GetHerHim]を調査することはできなくなったとしても。"
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "次もこの幸運が続きますように。"
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "次はもっとうまくいくといいが。"
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.GetSheHe|U]は反論できない。"
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "次に来るときまで、財布がもてばいいが…"
 gdp_merchant_unity_contract.1012.a: "次は[local_ruler.GetTitledFirstNameNoTooltip]だ。"
 gdp_merchant_unity_contract.1012.b: "さあ、[person_c.GetTitledFirstNameNoTooltip]のもとへ向かおう。"
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip]が待っている…"
 gdp_merchant_unity_contract.1012.d: "今こそ決着をつけよう…"
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "引き続き弁明を試みる"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "この状況をどう収めるか決める"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$：解決"
 gdp_merchant_unity_contract.1021.desc.intro: "我々は再び町の広場に集まった。[local_ruler.GetTitledFirstName]が私の最終判断を聞くため、期待に満ちた原告たちと問題の交易担当者を呼んだのだ。\n\n[person_c.GetFirstName]と[person_d.GetFirstName]が私を見つめる一方、[trader.GetFirstName]は私がここに到着して以来初めて落ち着きを失い、身じろぎしている。\n\n私の勘では、"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "住民たちはすっかりこちらの味方だ。"
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "住民たちは私の尽力にある程度満足している。"
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "住民たちの信頼は得られていない。"
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip]があくびをしながら言う。「それで、"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "行方不明になった積み荷の件は？」"
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "粗悪な商品の件は？」"
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "未払い金の件は？」"
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT 考え得る限り最善の弁明をしたため、たとえ[trader.GetTitledFirstNameNoTooltip]を罰しなくとも、あなたの尽力だけで$label_success_critical$を勝ち取れるだろう！#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT 十分な弁明を行ったため、たとえ[trader.GetTitledFirstNameNoTooltip]を罰しなくとも、あなたの対応はおそらく$label_success_standard$に終わるだろう！#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT 弁明が不十分だったため、[trader.GetTitledFirstNameNoTooltip]を罰しなければ、あなたの不十分な対応は反発を招くかもしれない！#!"
 gdp_merchant_unity_contract.1021.a: "「説明した通り、これは単なる不幸な行き違いでした」"
 gdp_merchant_unity_contract.1021.a.tt: "あなたは十分な弁明をしたと考えている"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "十分に弁明できた場合"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "ある程度弁明に成功し、住民たちが折れた場合"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "十分な弁明ができず、住民たちが反発した場合"
 gdp_merchant_unity_contract.1021.b: "半分の金額を払ってもらおう。"
 gdp_merchant_unity_contract.1021.b.tt: "[local_ruler.GetTitledFirstName]の訴えを認めるが、[trader.GetTitledFirstName]の税負担は軽減する"
 gdp_merchant_unity_contract.1021.c: "「何もかもでたらめだ。馬鹿げた誹謗中傷に過ぎない！」"
 gdp_merchant_unity_contract.1021.c.tt: "商会の不正を全面的に否定する"
 gdp_merchant_unity_contract.1021.d: "「[trader.GetTitledFirstNameNoTooltip]に非がある。罰を受けるべきだ」"
 gdp_merchant_unity_contract.1021.d.tt: "商会を守るため、[trader.GetTitledFirstNameNoTooltip]を切り捨てる"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$：単なる誤解"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$：問題解決"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$：未解決の問題"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$：不満の残る結末"
 gdp_merchant_unity_contract.1022.desc.success_critical: "住民たちは顔を見合わせ、勢いよくうなずき合う。[trader.GetFirstName]も満面の笑みを浮かべている。[local_ruler.GetTitledFirstName]は明らかに安堵しながらも、少し驚いている様子だ。「結構。では、この話はこれで終わりだ！」と[local_ruler.GetSheHe]は宣言した。\n\n原告たちは皆、私がここまで足を運び、彼らの不安を取り除いたことに対し、口々に感謝を述べた。どういうわけか、商会は今や[destination.GetBaronyNameExplicitlyNoTooltip]で#EMP これまで以上#!の信頼を得たのだ。"
 gdp_merchant_unity_contract.1022.desc.success_standard: "住民たちは顔を見合わせて重々しくうなずき、[trader.GetFirstName]は微笑みを浮かべている。[local_ruler.GetTitledFirstName]はためらいがちではあったが、すぐに話を切り上げた。「そうか。では、この話はこれで終わりだな」[local_ruler.GetSheHe]は問いかけるように言った。\n\n原告たちは議論の内容を語り合い、ひとまず納得したようだ。少なくとも今のところは、商会の[destination.GetBaronyNameExplicitlyNoTooltip]での評判は傷つかずに済んだらしい。"
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "張り詰めた空気の中、ほんの一瞬、[local_ruler.GetTitledFirstName]とその取り巻きが、私の説得力に欠ける結論に異を唱えようとしているかに見えた。だが、その瞬間は沈黙のうちに過ぎ去っていった。\n\n「いいだろう…」[local_ruler.GetTitleAsNameNoTooltip]は不満げな原告たちに目をやりながら、ため息をついた。「二度と同じことを起こさないように」\n\n住民たちが疑念を抱いているのは明らかだが、それは[trader.GetFirstNamePossessive]の問題だ。"
 gdp_merchant_unity_contract.1022.desc.failure_standard: "重苦しく気まずい沈黙が流れる。\n\n住民たちは互いを見やり、不満に口を歪めている。\n\n[local_ruler.GetTitledFirstName]が唸るように言った。「それだけか？」原告たちも、怒りを込めて同調する。\n\n[trader.GetFirstNamePossessive]が緊張に息を飲んだ音が、沈黙を破った。「ご迷惑をおかけしたことは深くお詫びします」[trader.GetSheHe]が言った。「ですが、これ以上できることはありません。こういったことは…起きてしまうものなのです」"
 gdp_merchant_unity_contract.1022.a: "これ以上ない結果だ。"
 gdp_merchant_unity_contract.1022.b: "終わりよければすべてよし…"
 gdp_merchant_unity_contract.1022.c: "もっとうまい方法があったかもしれないな。"
 gdp_merchant_unity_contract.1022.d: "さて…退散するとしよう。"
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$：否認"
 gdp_merchant_unity_contract.1023.desc: "原告たちが呆然としているのは、その怒りに満ちたささやき声からも明らかだった。[local_ruler.GetTitleAsName]も、どう収拾をつけるか戸惑っているようだ。\n\n驚いていた[trader.GetFirstName]も、私の言葉に自信を取り戻していく。「このようなつまらぬ事で、我が商会の名誉に泥を塗ることは許さん」\n\n私は彼らを鼻であしらうように言った。「まったく時間の無駄だった。私には[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]で急ぎの用がある！」"
 gdp_merchant_unity_contract.1023.a: "帰るとしよう。"
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$：トカゲの尻尾切り"
 gdp_merchant_unity_contract.1024.desc: "原告たちから歓声が上がった。やや驚いた様子の[local_ruler.GetTitledFirstName]が衛兵を呼び、呆然としている[trader.GetFirstName]を拘束させた。\n\n「そ、そんな…[ROOT.Char.GetTitleAsNameNoTooltip]様！」かすれた声を上げる部下を、私は投げやりに手を振って追い払った。「これで清々した。どうせ役立たずだったからな…」"
 gdp_merchant_unity_contract.1024.a: "これも必要な犠牲だ。"
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$：優れた才覚"
 gdp_merchant_unity_contract.1031.desc: "「[ROOT.Char.GetTitledFirstNameNoTooltip]様？」\n\n帳簿から目を上げると、そこには…どこか見覚えのある[hopeful.GetCulture.GetName]の[hopeful.GetWomanMan]が立っていた。どこで会ったのだったか…\n\n「私は[hopeful.GetTitledFirstName]と申します、[ROOT.Char.GetTitleAsNameNoTooltip]様。数年前、あなたは私の故郷である[destination_1.GetBaseNameNoTier]を訪れ、ある揉め事を見事に解決してくださいました」\n\n「もっとも、あの後商売が立ち行かなくなり、今は新たな働き口を探しているのですが。それで、もしよろしければ…私を雇っていただけないかと…」"
 gdp_merchant_unity_contract.1031.a: "いいだろう、歓迎しよう！"
 gdp_merchant_unity_contract.1031.b: "あいにく、間に合っている。"
