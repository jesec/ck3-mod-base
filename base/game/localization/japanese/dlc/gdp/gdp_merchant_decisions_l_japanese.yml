 craft_artifact_action: "宝物製作"
 craft_artifact_desc: "[company|E]の[domicile_artifact|E]の製作を試みる。"
 craft_artifact_desc_general: "[scheme|E]「$craft_artifact$」は、あなたとあなたの[company|E]がまったく新しい[domicile_artifact|E]の製作を試みる[personal_scheme|E]です。この工作の成否は、主にあなた自身の[stewardship|E]に左右されます。\n\n[success_chance|E]は多くの要素の影響を受け、特にあなたの[stewardship_skill|E]と、あなたの$antiquarian_merchant$の[aptitude|E]によって左右されます。"
 CRAFT_ARTIFACT_SUCCESS_DESC: "新たな[domicile_artifact|E]を製作する"
 craft_artifact_invalidated_title: "$craft_artifact$工作の終了"
 craft_artifact_scheme.1000.t: "$craft_artifact$：成功"
 craft_artifact_scheme.1000.intro.curio: "私は夜ごと工房で過ごし、商会員や地元のギルドの[ROOT.Char.GetWomanMan]を傍らに、何かしらの作品を作り続けてきた。"
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nだが、ようやく努力が実を結んだと言える日が来た！完成品を眺めると、苦労の跡一つひとつに笑みがこぼれる。今はただ誇らしい気持ちで、この作品をどこに飾ろうかと、そればかり考えている。"
 craft_artifact_scheme.1000.intro.library: "私は夜ごと書斎で机に向かい、インクで汚れた手がつり、ろうそくの火が弱まるまで、ひたすら筆を走らせた。"
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nだが、ようやく努力が実を結んだと言える日が来た！作品を読み返すと、どの一節にも笑みがこぼれる。今はただ、この走り書きを誰かが読んでくれることを願っている。"
 craft_artifact_scheme.1000.desc.curator: "\n\n宝物管理官の[curator.GetFirstNamePossessive]が目を輝かせて、作品を念入りに見ている。「これは#EMP まさに#!偉業です、[ROOT.Char.GetTitleAsNameNoTooltip]」"
 craft_artifact_scheme.1000.a: "苦労した甲斐があった。"
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\n[ROOT.Char.GetPrimaryTitle.GetName|l]の[ROOT.Char.GetTitledFirstName]が製作。"
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\n[ROOT.Char.GetPrimaryTitle.GetName|l]の[ROOT.Char.GetTitledFirstName]が執筆。"
 craft_artifact_scheme.2000.t: "$craft_artifact$：失敗"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\n構想を形にしようと試みるたび、計算違いや思い違いに阻まれる。そして部屋には、作り直すこともできずに放棄した試作品の残骸が散らばっている…"
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\n毎朝、書き損じた紙が床に散らばっている。手元に残したわずかな文章も、どれも自分が表現したかったことを十分に書き表せていない…"
 craft_artifact_scheme.2000.desc.curator: "\n\n宝物管理官の[curator.GetFirstName]は、私の努力がほとんど実を結んでいないのを見て、ため息をついて言った。「そろそろ失敗を認めるころではありませんか？」"
 craft_artifact_scheme.2000.a: "もううんざりだ…"
 craft_artifact_scheme.2000.b: "…だが、これまでの努力を無駄にするわけにはいかない！"
