 gdp_decision.3010.t: "[sponsored_courtier.GetNameNoTooltip]の商会で"
 gdp_decision.3010.desc: "「このような大役を仰せつかり、光栄の至りです！いただいた[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]は、一銭たりとも無駄にはいたしません」\n\nこの部屋に入るまで、自分が私の信頼の交易商人になるとは夢にも思わなかっただろうが、[sponsored_courtier.GetNameNoTooltip]は意気込んでいるようだ。\n生涯の夢を叶えることよりも、開業資金を手にし、それを使って自分の商会を立ち上げられるという考えに胸を躍らせているのかもしれない。"
