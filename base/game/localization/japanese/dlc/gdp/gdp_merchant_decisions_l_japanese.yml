l_japanese:
 gdp_repudiate_usurious_loan_decision: "高利貸しに当たる貸し付けを告発する"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip]は利子を明記した貸付契約を結んが、我が[ROOT.Char.GetRite.PriestNeuterPlural]たちは、そのような契約に拘束力はないと考えている。返済するのではなく、債務を無効にしてもらおう。\n\nこれは盗みではなく、[ROOT.Char.GetRite.GetAdjectiveNoTooltip]の法に基づく行為だ。だが、この地から海岸にかけて、商人たちは皆これを盗みと呼ぶだろう。"
 gdp_repudiate_usurious_loan_decision_tooltip: "[clergy|E]に、[usury|E]に当たるとして債務を無効にさせる。[gold|E]は残るが、[merchants|E]の間での評判を損なう"
 gdp_repudiate_usurious_loan_decision_confirm: "罪深い契約に縛られるものか！"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "この[loan|E]を返済する余裕がない"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "最近、[creditor|E]を告発していない"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X [merchants|E]は当面、あなたに貸し付けをしなくなる可能性があります#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "あなたの[rite|E]でこの貸し付けが罪と見なされており、あなたの[faith|E]に属する[clergy|E]の統治者が、この貸し付けを無効にできる範囲内にいる必要がある。また、その統治者が、あなたの[rite|E]と同じ立場を取る[rite|E]を信仰していることと、あなたの[creditor|E]でも[rival|E]でもなく、あなたと戦争中でもないことが条件となる\n#weak あなたの[head_of_faith|E]、あなたの首都または現在地の[clerical_region|E]を保有する者、あなたの[top_liege_possessive|E]の領国内にいる[clergy|E]が対象となる。#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "あなたの[Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E]があなたを支持している必要がある。具体的には、あなたに対して#P プラスの#![opinion|E]を持っているか、あなたがその人物の[strong_hook|E]を握り、[puppet|E]としている必要がある"
 become_merchant_decision: "交易商人になる"
 become_merchant_decision_desc: "人々の習わしを知らぬ者が宮廷に仕えて、その務めに何の意味があるだろうか？異国を旅して、領国と領国を結ぶ者になりたい——そんな望みが、もはや無視できないほど強くなっている。"
 become_merchant_decision_tooltip: "[titles|E]を手放し、[merchant|E]の[company|E]を設立する"
 become_merchant_decision_confirm: "今こそ交易を始める時だ！"
 become_merchant_decision_house_head_tt: "あなたは[house_head|E]でなければならない"
 gdp_recently_became_adventurer_decision_cooldown_tt: "あなたは#V 5年間#![adventurer|E]を続けている"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U]の[repudiated_lender.GetShortUIName]に対する[loan|E]の返済義務がなくなる"
 abuse_charter_authority_decision: "特許状の権限を濫用する"
 abuse_charter_authority_decision_tooltip: "[charter|E]を利用して[gold_i|E] [gold|E]を絞り取り、[competitiveness_i|E] [competitiveness|E]を高める"
 abuse_charter_authority_decision_desc: "私は[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip]の[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]から授けられた特許状を携えており、[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]の意向は法にも等しいものとなっている。領国の君主が我々の後ろ盾となる以上、我々の利益を阻もうとする者などいないだろう。"
 abuse_charter_authority_decision_confirm: "[ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]の名のもとに行動する！"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "[gurkhan_possessive|E]の権威はここでは認められていない"
 abuse_charter_authority_decision.region_already_abused: "これらの領土では、すでに[gurkhan_possessive|E]の権限が濫用されている"
 abuse_charter_authority_decision.nothing_to_abuse: "この[location|E]には濫用できる肥沃な土地はない"
 gdp_charter_abused_market_modifier: "特許状の権限の濫用"
 gdp_charter_abused_market_modifier_desc: "この人物は特許状によって与えられた権限を濫用し、自身の商会に利益をもたらしている。"
 gdp_charter_abused_market_county_modifier: "特許状の権限の濫用"
 gdp_charter_abused_market_county_modifier_desc: "この伯爵領は、特許状を利用して利益を得ようとする商会に搾取されている。"
 gdp_charter_leveraged_market_modifier: "特許状保持者の後塵"
 gdp_charter_leveraged_market_modifier_desc: "この人物の商会は、領国の統治者から特許状を授与された競合相手によって勢いを削がれている。"
 gdp_charter_charitable_market_county_modifier: "特許状に基づく開発"
 gdp_charter_charitable_market_county_modifier_desc: "この伯爵領は、特許状に基づいて直接介入した商会によって開発された。"
 gdp_decision.1000.t: "後援者の不興"
 gdp_decision.1000.desc: "使者が[patron.GetTitledFirstNameNoTooltipRegnal]の館から報せを持ってきた。そこでは、我が商会の横暴が声高に糾弾され、後援者は険しい表情でそれを聞いていたという。\n\n聞くところによると、行政官たちは我々の不正行為に関する告発を事細かに列挙し、[patron.GetTitleAsNameNoTooltip]は徐々に私に対する疑念を深めていったらしい。\n\n後援者は今、我々の行いについて直ちに釈明するよう求めている…"
 gdp_decision.1000.a: "「裁きを受け入れましょう」"
 gdp_decision.1000.b: "「ご理解いただけるはずです。すべては領国のためにしたことなのです…」"
 gdp_decision.1000.b.success: "後援者は慈悲を示す"
 gdp_decision.1000.b.failure: "後援者は激怒する"
 gdp_decision.1000.a.effects: "あなたの[merchant_patron|E]は、あなたに対する[imprisonment_reason|E]および[execute_reason|E]を得る"
 gdp_decision.1000.a.severe_effects: "あなたの[merchant_patron|E]は、あなたとあなたの[close_family_members|E]に対する[imprisonment_reason|E]および[execute_reason|E]を得る"
 gdp_decision.1000.a.survived_patrons_wrath: "[merchant_patron_possessive|E]の怒りを買いながらも、なんとか処分は免れた。だが、再び権威を悪用することはできない"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "[ROOT.Char.GetTitleAsNameNoTooltip]である私の名の下に、[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]の交易商人たちは活動している。私の印章を帯びた特許状を授与された者たちはなおさらだ。\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$そのような行商人のひとり、[merchant.GetName]が私の恩寵につけ込み、特権的な権威を振りかざして、民の犠牲のもとに私腹を肥やしているらしい。\n\nこのような勝手は言語道断だが、そうした交易者たちが領国にもたらす利益も考慮しなければならない。"
 gdp_decision.1010.a: "[merchant.GetSheHe|U]には自分がしたことの責任を取ってもらう！"
 gdp_decision.1010.a.tt: "[merchant.GetShortUIName]が[imprisoned|E]されると、あなたの[charters|E]を持つほかの[clients|E]も、あなたの権威を濫用することを躊躇するようになる"
 gdp_decision.1010.b: "今のところは目をつぶろう。"
 gdp_decision.1010.c: "雑貨屋ごときのことで騒ぎ立てるなど、私には相応しくない。"
 gdp_decision.1010.c.flavor: "今後もあなたの権威が濫用される可能性はあるが、通知は届かなくなる"
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]…？彼らに特許状など与えた覚えはない！"
 gdp_decision.1020.t: "[patron.GetTitleAsNameNoTooltip]の名の下に"
 gdp_decision.1020.opening: "私が特許状をちらつかせるだけで、[market_province.GetBaronyNameExplicitly]の門も、そこにいる行政官たちの役所も、[patron.GetTitledFirstName]の名の下に開かれる。\n\n"
 gdp_decision.1020.market_holder: "地元の有力者である[market_holder.GetTitledFirstName]は、[patron.GetTitleAsNameNoTooltip]にこの件を知らせると喚き立て、不快感をあらわにしている。だが、[market_holder.GetHerHis]の言い分など何の意味もない。この文書に異を唱えることはできないのだ。\n\n"
 gdp_decision.1020.closing: "町が私の思いのままになった以上、商会の代理人たちは市場の施設を押さえ、正規の書類を伴わない商品を押収し、根拠のない申し立てや告発で競合相手を悩ませることができる。"
 gdp_decision.1020.a: "我々の道を阻める者などいない。"
 gdp_decision.1020.b: "[market_holder.GetTitledFirstNameNoTooltip]にも分け前を与えて、こちら側に引き込むべきだな。"
 gdp_decision.1020.c: "気が変わった。"
 gdp_decision.1020.d: "「私の#EMP 査察#!はこれで終わりだ。今回はな…」"
 gdp_decision.1020.b.success: "この件は[patron.GetTitleAsNameNoTooltip]の耳に入らない"
 gdp_decision.1020.b.failure: "この横暴は[patron.GetTitleAsNameNoTooltip]の耳に入る"
 benevolent_charter_authority_decision: "現地へ直接投資する"
 benevolent_charter_authority_decision_tooltip: "[charter|E]を利用して[building_i|E] [building|E]を発展させ、現地の[prosperity_i|E] [prosperity|E]を高める"
 benevolent_charter_authority_decision_desc: "[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip]の[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]から認可を受けている私は、一介の商会には本来認められない、領国への直接介入を行える立場にある。"
 benevolent_charter_authority_decision_confirm: "[ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip]の名の下で、大いに善を成すことができる。"
 merchant_charter_intervention_county_cooldown: "過去#V 5#!年間、[THIS.Char.GetDomicile.GetLocation.GetName]に介入していない"
 gdp_decision.1200.t: "後援者の喜悦"
 gdp_decision.1200.desc: "[patron.GetTitledFirstNameNoTooltipRegnal]の館から報せが届いた。そこでは、我が商会の取り組みに対する惜しみない称賛が寄せられ、後援者もご満悦の様子だったという。\n\n幾人もの証人が、[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]とその近頃の働きを口を極めて称えていたそうだ。\n\nその結果、[patron.GetTitleAsNameNoTooltip]は我が商会に宛てて、次のような書状を送ってきた。「[ROOT.Char.GetTitledFirstNameNoTooltip]よ、貴殿の尽力は領国の誉れである！」"
 gdp_decision.1200.a: "「商会としてお役に立てたこと、喜ばしく存じます」"
 gdp_decision.1200.b: "「お認めいただけるのはありがたいことです。ですが、褒美もまたありがたいものです」"
 gdp_decision.1200.b.flavor: "恐れながら申し上げますと…"
 gdp_decision.1200.b.success: "後援者は気前よく応じる"
 gdp_decision.1200.b.failure: "後援者は失望する"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$そのような行商人のひとり、[merchant.GetName]は特権的な権威を領国の利益のために用い、[market_province.GetBaronyNameExplicitlyNoTooltip]の開発に投資したらしい！\n\nこのような立派な働きは称賛に値するが、報奨を与えれば、さらなる善行を促すことにもなるだろう。"
 gdp_decision.1210.a: "このような自発的な働きは奨励すべきだ。"
 gdp_decision.1210.a.tt: "あなたの[charters|E]を持つほかの[clients|E]も、あなたの権威を善意ある形で行使することに前向きになる"
 gdp_decision.1210.b: "[ROOT.Char.GetFaith.HighGodName]よ、かくも誠実な交易商人が#EMP 本当に#!存在するとは！"
 gdp_decision.1210.c: "そんなことで私を煩わせるな。"
 gdp_decision.1210.c.flavor: "今後もあなたの権威が善意ある形で行使される可能性はあるが、通知は届かなくなる"
 gdp_decision.1220.t: "[patron.GetTitleAsNameNoTooltip]の名の下に"
 gdp_decision.1220.opening: "特許状を手に、[market_province.GetBaronyNameExplicitly]で挨拶をして回った。当初は地元の行政官たちに困惑されたが、ほどなくして我が商会の善意を理解してもらうことができた。\n\n"
 gdp_decision.1220.market_holder: "地元の有力者である[market_holder.GetTitledFirstName]は、[market_holder.GetHerHis]の臣民の生産と商売を促進することに利を見出し、私の提案に関心を示しはじめている。\n\n"
 gdp_decision.1220.closing: "町を少し見て回っただけで、修繕や改良の余地がある場所はいくつも見つかるし、町人たちもそれを我々に進んで教えてくれるのだ。"
 gdp_decision.1220.a: "「ぐずぐずしている暇などないな。さあ、取りかかろう！」"
 gdp_decision.1220.d: "「実に興味深いが、ほかに片づけるべき用件がある…」"
 press_the_advantage_decision: "優勢に乗じる"
 press_the_advantage_decision_desc: "我々が近ごろ収めた成功により、競合相手は後手に回り、市場も先行きが読めない状況にある。今こそ工作員、貸し、そして苦労して築いてきた影響力を交易路に投入し、競争圧力を利益へと変えるべき時だ。"
 press_the_advantage_decision_tooltip: "[competitive_pressure_i] [competitive_pressure|E]を消費して、一定期間、[trade_route|E]における[competitiveness_i] [trade_competitiveness|E]を高める"
 press_the_advantage_decision_confirm: "この優勢に乗じよう。"
 merchant_competitive_pressure_gain_1_tt: "[competitive_pressure_i]#P 1#![competitive_pressure|E]を獲得する"
 merchant_competitive_pressure_gain_2_tt: "[competitive_pressure|E]を[competitive_pressure_i]#P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#!獲得する"
 merchant_competitive_pressure_spend_tt: "[competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#![competitive_pressure|E]を消費する"
 merchant_competitive_pressure_spend_cost_tt: "[competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#!以上の[competitive_pressure|E]がある"
 merchant_competitive_pressure_below_max_tt: "最大値より[competitive_pressure_i] [competitive_pressure|E]が少ない#weak （[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0]）#!"
 press_the_advantage_route_not_already_pressed_tt: "まだ[GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]の効果を受けていない有効な[trade_route|E]がある"
 press_the_advantage_selected_route_has_trader_tt: "選択した[trade_route|E]には[trader|E]がいる"
 press_the_advantage_selected_route_not_already_pressed_tt: "選択した[trade_route|E]は、まだ[GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]の効果を受けていない"
 merchant_competitive_pressure_route_modifier: "優勢に乗じた攻勢"
 merchant_competitive_pressure_route_modifier_desc: "この交易路には、競合相手の弱みを熟知した工作員たちが集中的に目を光らせている。"
 choose_specialized_market_decision: "専門市場を選択する"
 choose_specialized_market_decision_desc: "市場の慣習や役人、隠れた流通経路を知り尽くした商会なら、見知らぬ街にも根を下ろすことができる。交易路上の一つの市場に調査員を集中させることで、現地の知識を商売の強みに変えられる。"
 choose_specialized_market_decision_tooltip: "[route_i] [trade_routes|E]のいずれかにある[market_i] [market|E]を選択し、調査員の専門化ボーナスを得る"
 choose_specialized_market_decision_confirm: "市場を調査する"
 choose_specialized_market_decision_effect_tt: "選択した[market_i] [market|E]が専門[market_i] [market|E]になる"
 choose_specialized_market_has_valid_market_tt: "[route_i] [trade_route|E]上または[domicile|E]の所在地に有効な[market_i] [market|E]がある"
 choose_specialized_market_selected_market_has_valid_route_tt: "選択した[market_i] [market|E]は、[route_i] [trade_routes|E]のいずれかまたは[domicile|E]の所在地にある"
 choose_specialized_market_selected_market_is_new_tt: "選択した[market_i] [market|E]は、まだ専門[market_i] [market|E]になっていない"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "この商会は、この市場の現地の習慣や役人、商慣行を調査した。"
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "この商会は、この市場で綿密な調査体制を維持している。"
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "この商会は、この市場の露店や倉庫、人知れぬ取引の詳細まで綿密に把握している。"
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "この商会は、長年の経験によってこの市場を知り尽くしている。"
 pious_patronage_decision: "敬虔な後援"
 pious_patronage_decision_desc: "信仰の力があれば、金だけでは開けられない扉も開くことができる。すでに交易路に組み込まれている市場で、聖堂や聖職者、慈善事業に資金を提供すれば、共通の信仰を商売上の信用に変えられる。"
 pious_patronage_decision_tooltip: "[piety_i] [piety|E]を消費して、[market_i] [market|E]での[competitiveness_i] [trade_competitiveness|E]を高める"
 pious_patronage_decision_confirm: "信徒を支援する"
 pious_patronage_has_valid_market_tt: "[route_i] [trade_route|E]が通る有効な[market_i] [market|E]のうち、[GetModifier('pious_patronage_market_modifier').GetNameWithTooltip]の効果をまだ受けていない市場がある"
 pious_patronage_selected_market_valid_faith_tt: "選択した[market_i] [market|E]はあなたの[faith|E]に属している#weak （または[GetPerk('prophet_perk').GetName(GetPlayer)]を持っている）#!"
 pious_patronage_selected_market_has_valid_route_tt: "あなたは選択した[market_i] [market|E]を通る[route_i] [trade_route|E]を持っている"
 pious_patronage_selected_market_no_modifier_tt: "選択した[market_i] [market|E]で[GetModifier('pious_patronage_market_modifier').GetNameWithTooltip]の効果をまだ受けていない"
 pious_patronage_different_faith_cost_tt: "あなたの[faith|E]とは異なる[market_i] [market|E]を後援するために、[piety|E]を少なくとも[piety_i]#V [EmptyScope.ScriptValue('massive_piety_value')|0]#!持っている"
 pious_patronage_market_modifier: "敬虔な後援"
 pious_patronage_market_modifier_desc: "この商会は、この市場で宗教的な後援の恩恵を受けている。"
 organize_the_venture_decision: "事業を整備する"
 organize_the_venture_decision_desc: "有望な事業がすでに進行している。より厳密な日程と指示、そして商会の影響力をもって臨めば、仕事を着実に推し進めることができる。"
 organize_the_venture_decision_tooltip: "[competitive_pressure_i] [competitive_pressure|E]を消費して、進行中の[contract_scheme|E]を加速する"
 organize_the_venture_decision_confirm: "仕事の段取りを整える"
 merchant_competitive_pressure_organize_venture_spend_tt: "[competitive_pressure|E]を[competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#!消費する"
 merchant_competitive_pressure_organize_venture_spend_cost_tt: "あなたは[competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#!以上の[competitive_pressure|E]を持っている"
