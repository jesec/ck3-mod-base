 gdp_decision.2000.desc: "印章、封蝋、その他もろもろの公文書らしい体裁を巧みに似せ、創意に富んだ筆さばきで仕上げられたそれは、悪辣な偽造師の仕事ながら、見事と言うほかない。\n\nこれなら、こうした文書を見慣れた目利きでさえ欺けるだろう。隅々まで念入りに調べられさえしなければ…"
