 gdp_decision.3000.desc: "私は、貴殿のように名高く勤勉な交易商人に、[new_patron.GetPrimaryTitle.GetDefinitiveName]への移転を求めている。\n\nその見返りとして、我々の市場で貴殿が有利に商いを営めるよう取り計らおう。"
