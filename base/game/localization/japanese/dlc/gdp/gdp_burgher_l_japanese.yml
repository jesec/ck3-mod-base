 BURGHER_WAR_CB_NAME: "市民の自由を求める戦争"
 burgher_refusal_revolt_war_tt: "$FACTION_BURGHER_AUTONOMY_NAME$[faction|E]が[casus_belli|E]「#V $BURGHER_WAR_CB_NAME$#!」により[war|E]を開始する\n勝利した場合：$burgher_war_victory_desc$"
