 burgher_self_rule_free_city_tt: "新しい[republic|E]は[GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|V]を持って開始される"
 burgher_self_rule_chartered_city_tt: "新しい[republic|E]は[GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|V]を持って開始される"
 burgher_self_rule_new_capital_tt: "新しい[republic|E]は[burgher_new_capital.GetNameNoTier]をその[capital|E]とする"
 BURGHER_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip]の市民蜂起"
 burgher_war_victory_desc: "反乱を起こした[county|E]はすべて、自治権を持つ[republic|E]国家となり、[GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|V]を持って開始される。また、必要に応じて[capital|E]をその[county|E]内で最大の都市に移す。3つ以上の自治[republic|E]国家が成立すると、#V $confederation_type_trade_league_name$#!を形成する"
 burgher_war_victory_free_city_desc: "反乱を起こした[county|E]はすべて、自治権を持つ[republic|E]国家となり、[GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|V]を持って開始される。また、必要に応じて[capital|E]をその[county|E]内で最大の都市に移す。3つ以上の自治[republic|E]国家が成立すると、#V $confederation_type_trade_league_name$#!を形成する"
 burgher_war_white_peace_desc: "[faction|E]は解散し、反乱を主導した[county|E]には限定的な市民特権が与えられる。この[faction|E]の伯爵領は[EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0]年間、別の$FACTION_BURGHER_AUTONOMY_NAME$[faction|E]を結成できない。"
 burgher_war_defeat_desc: "[faction|E]は解散し、反乱を起こした[county|E]はすべて、保有する市民特権と[popular_opinion|E]を失う。この[faction|E]の伯爵領は[EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0]年間、別の$FACTION_BURGHER_AUTONOMY_NAME$[faction|E]を結成できない。"
 burgher_war_ended_invalid.desc: "$FACTION_BURGHER_AUTONOMY_NAME$[faction|E]の指導者がいなくなったため、「$BURGHER_WAR_CB_NAME$」が無効になった！"
 civic_privileges_county_modifier: "市民特権"
 civic_privileges_county_modifier_desc: "この伯爵領には、いくつかのわずかな市民特権が認められているが、そのいずれも特許状には明記されていない。"
 civic_privilege_market_rights_1_county_modifier: "限定的な市場権"
 civic_privilege_market_rights_1_county_modifier_desc: "この伯爵領では、領主の定めた度量衡と監督の下で市場を開く権利が認められている。"
 civic_privilege_market_rights_2_county_modifier: "市場権"
 civic_privilege_market_rights_2_county_modifier_desc: "この伯爵領では、市を開く日や使用する秤を自ら定める権利が認められており、交易からも相応の利益を得ている。"
 civic_privilege_market_rights_3_county_modifier: "広範な市場権"
 civic_privilege_market_rights_3_county_modifier_desc: "この伯爵領には、市場をほぼ全面的に管理する権利が認められている。そのため、領主が交易から得る取り分はわずかしかない。"
 civic_privilege_guild_rights_1_county_modifier: "限定的なギルド権"
 civic_privilege_guild_rights_1_county_modifier_desc: "この伯爵領の職人たちには組織を結成する権利が認められているが、親方たちは依然として領主の裁判権に従わなければならない。"
 civic_privilege_guild_rights_2_county_modifier: "ギルド権"
 civic_privilege_guild_rights_2_county_modifier_desc: "この伯爵領のギルドには、自分たちで基準を定め、親方を認定する権利が認められている。"
 civic_privilege_guild_rights_3_county_modifier: "広範なギルド権"
 civic_privilege_guild_rights_3_county_modifier_desc: "この伯爵領のギルドには、職人の仕事とその製品について、ほぼ全面的な管理権が認められている。"
 civic_privilege_tax_exemption_1_county_modifier: "市税の一部免除"
 civic_privilege_tax_exemption_1_county_modifier_desc: "この伯爵領の町は、領主に納める税や負担の一部を免除されている。"
 civic_privilege_tax_exemption_2_county_modifier: "市税免除"
 civic_privilege_tax_exemption_2_county_modifier_desc: "この伯爵領の町には、自ら税率を決めて税を徴収する権利が認められている。"
 civic_privilege_tax_exemption_3_county_modifier: "広範な市税免除"
 civic_privilege_tax_exemption_3_county_modifier_desc: "この伯爵領の町は税の大部分を免除されており、領主に納めるのはほんのわずかな額にすぎない。"
 civic_privilege_militia_charter_1_county_modifier: "限定的な民兵特許状"
 civic_privilege_militia_charter_1_county_modifier_desc: "この伯爵領の町は、独自の警備隊を持つことが認められている。ただし、その警備隊は城壁の外に出てはならない。"
 civic_privilege_militia_charter_2_county_modifier: "民兵特許状"
 civic_privilege_militia_charter_2_county_modifier_desc: "この伯爵領の町は、独自の民兵隊を持つ権利が認められており、領主のために出征する兵は少ない。"
 civic_privilege_militia_charter_3_county_modifier: "広範な民兵特許状"
 civic_privilege_militia_charter_3_county_modifier_desc: "この伯爵領の町には自ら武装する権利が認められており、領主に差し出す兵はごく少数にとどまる。"
 burgher_grievance_county_modifier: "市民の不満"
 burgher_grievance_county_modifier_desc: "この伯爵領は要求を拒否されており、そのことを水に流すつもりはない。"
 gdp_civic_agitation_county_modifier: "市民扇動"
 gdp_civic_agitation_county_modifier_desc: "外部の者がこの伯爵領の住民を扇動し、統治者に反抗させている。"
 gdp_civic_agitation_popular_republic_modifier: "民衆の声"
 gdp_civic_agitation_popular_republic_modifier_desc: "この工作は、市民の自由の象徴である[GetLaw('republic_type_popular').GetName]の長によって支援されている。"
 bestow_civic_liberties_interaction: "市民に自由を与える"
 bestow_civic_liberties_options_heading: "自由の付与"
 bestow_civic_liberties_option_market_rights: "市場権"
 bestow_civic_liberties_option_guild_rights: "ギルド権"
 bestow_civic_liberties_option_tax_exemption: "税の免除"
 bestow_civic_liberties_option_militia_charter: "民兵特許状"
 bestow_civic_liberties_interaction_desc: "自分の[counties|E]のいずれかに市民特権を付与し、その地域の[popular_opinion|E]を上昇させる"
 bestow_civic_liberties_no_charter_left_tt: "この[county|E]にまだ認められていない市民特権が残っている必要がある"
 agitate_civic_unrest_interaction: "市民騒乱を扇動する"
 agitate_civic_unrest_interaction_desc: "[recipient.GetShortUINamePossessiveNoTooltip]の[counties|E]の1つを扇動して自治権を要求させる。要求が拒否された場合、[casus_belli|E]「#V $BURGHER_WAR_CB_NAME$#!」による[war|E]が始まる"
 agitate_civic_unrest_eligible_tt: "この[county|E]に対して[scheme|E]「#V $gdp_civic_agitation_scheme$#!」を開始できる必要がある"
 revoke_civic_liberties_interaction: "市民の自由を剥奪する"
 revoke_civic_liberties_interaction_desc: "自分の[counties|E]の1つからすべての市民特権を剥奪し、その代償として[popular_opinion|E]が大幅に低下する"
 revoke_civic_liberties_authority_tt: "あなたの[crown_authority|E]が[GetLaw('crown_authority_1').GetName]以上でなければならない"
 revoke_civic_liberties_no_privileges_tt: "この[county|E]が剥奪対象となる市民特権を保有していなければならない"
 gdp_civic_agitation_scheme: "市民騒乱の扇動"
 gdp_civic_agitation_scheme_action: "市民騒乱の扇動"
 gdp_civic_agitation_scheme_desc: "[SCHEME.GetTargetTitle.GetBaseNameNoTier]の善良な人々を奮い立たせ、彼らに当然認められるべき自治権を要求させよう！"
 gdp_civic_agitation_scheme_desc_general: "「$gdp_civic_agitation_scheme$」は、[county|E]を扇動してその[ruler|E]に自治権を要求させることを目的とした[hostile_scheme|E]である。これは[intrigue|E]に基づく[secret_scheme|E]であり、[agents|E]を勧誘できる。\n\n工作が成功すると、対象の[county|E]は$FACTION_BURGHER_AUTONOMY_NAME$[faction|E]を結成する。要求が拒否された場合、[faction|E]は[war|E]を開始する\n\nあらゆる[merchant|E]と、$republic_type_popular$の長が扇動することができ、彼らが解放した[republic|E]はすべて同じ政体を採用する。その他の[republic|E]の長が扇動を行うには、[EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V]以上の[patrician_rating|E]が必要であり、その他の[republican|E][house_heads|E]の場合、[EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]以上が必要である。"
 gdp_civic_agitation_scheme_desc_success: "対象の[county|E]が$FACTION_BURGHER_AUTONOMY_NAME$[faction|E]を結成して自治権を要求する"
 gdp_civic_agitation_scheme_discovery_desc: "あなたが[county|E]を扇動していることは露見しない"
 gdp_civic_agitation_scheme_invalidated_title: "@scheme_icon! $gdp_civic_agitation_scheme$工作が終了"
 gdp_civic_agitation_scheme_invalidated_desc: "[scheme|E]「$gdp_civic_agitation_scheme$」は無効になった"
