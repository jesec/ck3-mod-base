 dissolve_the_hanse_cb_white_peace_desc: "[defender.GetConfederation.GetName]は解体されず、[defender.GetShortUIName]は独立を維持する。"
 dissolve_the_hanse_cb_defeat_desc: "$dissolve_the_hanse_cb_white_peace_desc$"
 dissolve_the_hanse_cb_ended_invalid.desc: "[war.GetName]は終結した：[defender.GetShortUIName]がハンザ同盟の盟主ではなくなったか、[attacker.GetShortUIName]がハンザに加入した。"
 hanseatic_league_member_modifier: "ハンザ商人"
 hanseatic_league_member_modifier_desc: "この人物はハンザ同盟の一員であり、同盟の特権に守られながら交易を行っている。"
 hanseatic_league_county_modifier: "ハンザ同盟の伯爵領"
 hanseatic_league_county_modifier_desc: "この伯爵領はハンザ同盟の加盟者が領有しており、同盟の特権によって市場が繁栄している。"
