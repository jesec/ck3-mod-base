 every_hanseatic_family: "ハンザ同盟に属するすべての[family|E]"
 gdp_caught_agitating_modifier: "扇動の露見"
 gdp_caught_agitating_modifier_desc: "この人物は、別の[ruler|E]に反抗するよう人々を扇動したところを見つかった。そのため、他の[rulers|E]から疑いの目を向けられている。"
 merchant_civic_advantage_modifier: "市民の後援者"
 merchant_civic_advantage_modifier_desc: "この人物は市民の自由を求める動きを後押しし、その結果、人々の好意を得た。こうした好意は、利益につながることもある。"
