 GENERIC_HANSE_NAME: "[hanse_lead_town.GetName]のハンザ同盟"
 gdp_burgher.0001.desc: "我々[burgher_county.GetNameNoTier]の[burgher_county.Custom('BurgherPluralNoun')]は、我が町が繁栄し国により多くの富をもたらすことができるよう、[burgher_county.Custom('BurgherDemandedPrivilege')]の授与を求めます。"
 gdp_burgher.0001.a: "彼らの要求はもっともだ。正式に認めよう。"
 gdp_burgher.0001.b: "断る！"
 gdp_burgher.0001.opening: "我らが[ROOT.Char.Custom('LadyLordWomanMan')]へ"
 gdp_burgher.0010.desc: "我々[burgher_county.GetNameNoTierNoTooltip]の[burgher_county.Custom('BurgherPluralNoun')]は、自治を認め、自分たちで指導者を選び、自分たちの名で物事を進める自由を授けていただきますようお願い申し上げます。温情をかけていただけなければ、力ずくで手に入れざるを得なくなるかもしれません。"
 gdp_burgher.0010.a: "彼らに自由を認めよう。"
 gdp_burgher.0010.b: "#EMP 「権利」#!とやらのために戦ってみるがいい。"
 gdp_burgher.0020.t: "[freed_county.GetNameNoTierNoTooltip]の自由"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier]は自由を勝ち取り、それとともに自治と、自ら行政官を任命する権利を手にした。\n\nもちろん、これらは#EMP 私#!の後ろ盾がなければ実現しなかっただろう。"
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier]は自由を勝ち取り、それとともに自治と、自ら行政官を任命する権利を手にした。\n\nもちろん、これらは#EMP 私#!の後ろ盾がなければ実現しなかっただろう。"
 gdp_burgher.0020.a: "指導者の責務なら、喜んで引き受けよう。"
 gdp_burgher.0020.b: "有力者の仲間入りをしよう。"
 gdp_burgher.0020.c: "彼らの好意だけでも十分な利益になる。"
 gdp_burgher_agitator_not_republic_head_tt: "現在[republic|E]の指導者であっては#bold ならない#!"
 gdp_burgher_agitator_outranks_republic_head_tt: "あなたの[title_tier|E]は[burgher_ruler.GetTitledFirstName]の[title_tier|E]より低くなければならない"
 gdp_civic_agitation.0001.t: "自由の火が灯る"
 gdp_civic_agitation.0001.desc: "すべてが思いどおりに進んでいる。私の工作員が煽り立てた結果、[target.GetNameNoTier]の人々は市民の自由を求める情熱に燃え、彼らの指導者たちは市場の広場で、重税や不公正な行政官を糾弾する熱弁を振るっている。\n\n報告によれば、彼らは自治権を求め、領主のもとへ代表団を送る準備をしているという。あとは私も彼らに同行するかどうかだ。"
 gdp_civic_agitation.0001.a: "ここまで来たのだ。最後まで見届けよう。"
 gdp_civic_agitation.0001.b: "大勢で武装して馬に乗って向かうべきだ。費用は私が持とう。"
 gdp_civic_agitation.0001.c: "民衆には自分たちの考えだと思わせておけ。重要な者たちは真相を知っている。"
 gdp_civic_agitation.0001.c.exposed: "関与を認め、これ以上は何も約束しない"
 gdp_civic_agitation_sponsor_joins_war_tt: "統治者が要求を退けた場合、あなたは[agitated_county.Custom('BurgherPluralNoun')]とともに[war|E]に参戦する"
 gdp_civic_agitation_sponsor_war_chest_tt: "戦争になった場合、あなたは傭兵隊の費用を負担する"
 gdp_civic_agitation.0002.t: "無駄に終わった出費"
 gdp_civic_agitation.0002.desc: "不満を列挙した文書が作成され、[target.GetNameNoTier]の人々の前で読み上げられた。ところが、彼らの指導者たちは集まったにもかかわらず、#EMP 何もしなかった#!。\n\n工作員も、指導者たちが何もしなかったこと以外、何が起きたのかわかっていない。私の金で必要なものはすべて揃えたが、それを#EMP 使う#!度胸は買えなかったようだ。"
 gdp_civic_agitation.0002.a: "この卑劣な裏切りは、そう簡単には忘れん。"
 found_the_hanseatic_league_decision: "ハンザ同盟を結成する"
 found_the_hanseatic_league_decision_tooltip: "あなたの[trade_league|E]に属する[counties|E]を、さらに強力な商業連合へとまとめ上げる"
 found_the_hanseatic_league_decision_confirm: "一致団結すれば繁栄を築ける"
 found_the_hanseatic_league_decision_desc: "王たちは、権力とは王冠を戴き、剣を携えるものだと考えている。だが、我々は別の真実を知っている。権力は毛皮に身を包み、魚の臭いを漂わせ、王国を破産させかねない金額を記した帳簿を携えている。\n\n単独であれば、我らは課税され、略奪され、脅されて従わされる。しかし団結すれば、北方の海に我らに抗える勢力は存在しない。どの港も我々の船を拒まず、我々より安値で商品を売る外国商人もおらず、我らの特権に異を唱える君主もいないだろう。"
 found_the_hanseatic_league_cohesion_tt: "[trade_league|E]が#V 95#!以上の[cohesion|E]を有していなければならない"
 found_the_hanseatic_league_members_tt: "[trade_league|E]は#V 4#!人以上の加盟者がいなければならない"
 found_the_hanseatic_league_message_title: "ハンザ同盟の誕生"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U]は同盟を誓約によって結ばれたハンザ同盟へとまとめ上げた。"
 league_needs_liege_consent_tt: "あなたは[vassal|E]のため、[liege|E]の同意か、または独自に加盟できる町がなければならない"
 gdp_hanseatic.0010.opening: "[the_league.GetName]より"
 gdp_hanseatic.0010.desc: "あなたは自分自身の名義で交易権を保有し、その利益はあなた一人のものとなっている。\n\nこのような個別の取り決めは、我らの結束を損なう。我らに権利を譲り渡していただきたい。そうすれば、共にいっそう繁栄できるだろう。"
 gdp_hanseatic.0010.a: "権利を[the_league.GetName]に譲渡しよう。"
 gdp_hanseatic.0010.b: "権利を[hanse_city_title.GetNameNoTier]に与えよう。"
 gdp_hanseatic.0010.c: "これらの権利は私のものであり、#EMP これからもそうあり続ける#!。"
