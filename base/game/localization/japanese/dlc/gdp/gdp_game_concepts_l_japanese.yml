l_japanese:
 # Trade
 game_concept_trade: "交易"
 game_concept_trade_desc: "$game_concept_trade$は、[republics|E]、[trade_leagues|E]、および[merchants|E]の生計を支える仕組みです。\n\n[trade_routes|E]は[trade_markets|E]を結び、[goods|E]の輸出入を支えます。市場の[needs|E]と[surpluses|E]は、市場を構成する[baronies|E]内の[buildings|E]によって決まります。\n\n一方、販売価格は領分の[prosperity|E]によって決まります。販売に従事するキャラクターは、[competitiveness|E]や[monopolies|E]を活用して、市場で優位に立つことができます。利益を増やすには、市場で取引を行う者が[trade_routes|E]の[capacity|E]と距離を伸ばし、さらに各経路が結ぶ市場の数や交易品の数を増やすことが重要です。\n\n[adventurers|E]と[nomads|E]を除くすべての[government_forms|E]は、$game_concept_trade$に参加できます。"
 game_concept_trade_good: "交易品"
 game_concept_trade_goods: "交易品"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "交易品"
 game_concept_trade_goods_possessive: "交易品"
 game_concept_good: "商品"
 game_concept_goods: "商品"
 game_concept_basic_trade_good: "基本交易品"
 game_concept_basic_trade_goods: "基本交易品"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$とは、[distribution_route|E]によって輸送可能な[trade_goods|E]です。\n\n対照的に、[commission_route|E]や[profit_route|E]はあらゆる$game_concept_trade_goods$を取引できます。"
 game_concept_market_toll: "市場税"
 game_concept_market_tolls: "市場税"
 game_concept_toll: "市場税"
 game_concept_tolls: "市場税"
 game_concept_market_toll_desc: "$game_concept_market_tolls$とは、[trade_market|E]内で行われるすべての販売に課される税のことです。\n\n$game_concept_market_tolls$は[market_owner|E]によって管理され、手数料もすべて[market_owner|E]が受け取ります。\n\n$game_concept_market_tolls$が軽い市場ほど、[merchants|E]の得られる利益は大きくなります。\n\n$game_concept_market_tolls$を重くすると$game_concept_market_owner_possessive$の[income|E]は増加しますが、$game_concept_market$で$game_concept_goods$を販売するすべての[profit_route|E]において、$game_concept_merchants$の得られる利益が削られます。$game_concept_tolls$があまりにも重い場合、$game_concept_merchants$はより税負担の軽い$game_concept_markets$で販売を行うようになる可能性があります。\n\n[market_owner|E]と、その[direct_vassals|E]、[tributaries|E]、[clients|E]は市場税の支払いを免除されます。"
 game_concept_good_possessive: "商品"
 game_concept_goods_possessive: "商品"
 game_concept_trade_good_desc: "$game_concept_trade_goods$は、[market|E]で売買できます。世界各地でさまざまな品物が取引され、[realms|E]の[needs|E]を満たしています。"
 game_concept_trade_category: "商品カテゴリー"
 game_concept_trade_categories: "商品カテゴリー"
 game_concept_trade_category_short: "カテゴリー"
 game_concept_trade_categories_short: "カテゴリー"
 game_concept_trade_category_desc: "$game_concept_trade_categories$は、[trade_goods|E]を分類したグループです。[trade_markets|E]では特定のカテゴリーに属する品物が必要とされることが多く、同じカテゴリー内の品物であれば[need|E]を満たすことができます。"
 game_concept_trade_expertise: "交易知識"
 game_concept_expertise: "知識"
 game_concept_trade_expertise_desc: "$game_concept_trade_expertise$は、特定の[trade_category|E]における実務的な交易経験を表し、有効な[trade_routes|E]の[primary_good|E]から獲得できます。知識が豊富になるにつれ、そのカテゴリーの商品を取り扱うことで得られる利益が大きくなります。また、高い[expertise_levels|E]に達するほど、そのカテゴリーに応じた追加のボーナスが付与されます。"
 game_concept_trade_expertise_progress: "交易知識の進捗"
 game_concept_expertise_progress: "知識の進捗"
 game_concept_trade_expertise_progress_desc: "[expertise|E]を獲得するたびに、次の[expertise_level|E]への進捗が増加します。"
 game_concept_trade_expertise_level: "交易知識レベル"
 game_concept_expertise_level: "知識レベル"
 game_concept_expertise_levels: "知識レベル"
 game_concept_trade_expertise_level_desc: "[trade_category|E]の$game_concept_trade_expertise_level$は、そのカテゴリーの交易における[trade_company|E]の経験値を段階的に表したものです。\n\n有効な[trade_routes|E]で[expertise_progress|E]が進むと上昇し、レベルごとに追加の[trade|E]ボーナスを獲得します。\n\nカテゴリー内で有効な交易を行っていない場合、レベルは徐々に低下します（毎月#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#!の知識の進捗）。"
 game_concept_trade_market: "交易市場"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "交易市場"
 game_concept_trade_market_possessive: "交易市場"
 game_concept_trade_markets_possessive: "交易市場"
 game_concept_market: "市場"
 game_concept_markets: "市場"
 game_concept_market_possessive: "市場"
 game_concept_markets_possessive: "市場"
 game_concept_trade_market_desc: "$game_concept_trade_market$は、その範囲内に含まれるすべての[holdings|E]の[production|E]と[needs|E]を集約する交易拠点です。\n\n市場内では、まず現地の生産量が[buildings|E]の[needs|E]を満たすために充てられ、残った分が売却可能な[surplus|E]となり、満たされない需要は輸入によって賄わなければなりません。[trade_routes|E]は市場同士を繋ぎ、その間で[goods|E]を輸送します。\n\n各市場は、その[market_owner|E]が所有する[market_capital|E]をその中核としており、[market_prosperity|E]が高いほど、交易者に対してよりよい[sell_prices|E]が提示されます。"
 game_concept_market_prosperity: "市場の繁栄度"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$は、[market|E]内のすべての[counties|E]の平均[prosperity|E]です。\n\n$game_concept_market_prosperity$が高いほど、市場内の[goods|E]の[sell_prices|E]が上昇し、[merchants|E]にとって利益を得やすい市場になります。"
 game_concept_market_capital: "市場中心地"
 game_concept_market_capitals: "市場中心地"
 game_concept_market_capital_possessive: "市場中心地"
 game_concept_market_capitals_possessive: "市場中心地"
 game_concept_market_capital_desc: "$game_concept_market_capital$は、[market|E]の中心となる[holding|E]で、通常はその市場が対象とする[duchy|E]の[de_jure|E]首都がこれに当たります。\n\nゲーム開始時に固定され、その後は変更されません。この[barony|E]の保持者は[market_owner|E]となり、市場を支配します。"
 game_concept_market_owner: "市場所有者"
 game_concept_market_owners: "市場所有者"
 game_concept_market_owner_possessive: "市場所有者"
 game_concept_market_owners_possessive: "市場所有者"
 game_concept_owner: "所有者"
 game_concept_owners: "所有者"
 game_concept_owner_possessive: "所有者"
 game_concept_owners_possessive: "所有者"
 game_concept_market_owner_desc: "$game_concept_market_owner$は、ひとつの[market|E]における[market_capital|E]を保持する者のことであり、その支配権は戦争や相続を通じ、[market_capital|E]の属する[barony|E]の所有権とともに移転します。\n\n市場所有者は市場の統括者であり、[market|E]に繋がる[distribution_routes|E]を創設すること、[commission_routes|E]に必要となる相手方になること、[market|E]内での[monopolies|E]を付与すること、そして[market_toll|E]を設定することができます。"
 game_concept_market_priority: "市場の優先順位"
 game_concept_market_priorities: "市場の優先順位"
 game_concept_market_priority_desc: "$game_concept_market_priority$とは、[market|E]に属する[holdings|E]の[needs|E]を満たす際に、商品が供給される順番を表します。\n\n1番目は[market_capital|E]で、次にその[county|E]内の残りの領地が続きます。次いで他の$game_concept_counties$に、それぞれの[county_capital|E]の[settlement_size|E]の順で商品が供給されます。\n\n各$game_concept_county$内では[county_capital|E]が1番目で、次いで他の$game_concept_holdings$に、[settlement_size|E]の順で供給されます。\n\n[holding|E]内においては、[districts|E]や[buildings|E]の優先順位を並べ替えて、適切な[building|E]の[needs|E]が最優先で満たされるようにすることが可能です。"
 game_concept_market_share: "市場占有率"
 game_concept_market_shares: "市場占有率"
 game_concept_market_share_desc: "$game_concept_market_share$とは、$game_concept_competitiveness$に応じて決まる、[profit_route|E]が[market|E]で取引できる[trade_good|E]の割合を表します。\n\nたとえば、特定の$game_concept_good$について、あなたの$game_concept_competitiveness$が他の全員の合計と同じ場合、あなたの$game_concept_market_share$は50%になります。その$game_concept_good$を取引している者が誰もいない場合、あなたの$game_concept_market_share$は常に100%となります。\n\n$game_concept_market_share$が100%に達していて、なおかつ十分な[capacity|E]さえ持っていれば、その[market|E]の[surplus|E]をすべて買い取ることも、[needs|E]をすべて満たすだけの商品を販売することもできます。"
 game_concept_trade_route: "交易路"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "交易路"
 game_concept_trade_route_possessive: "交易路"
 game_concept_trade_routes_possessive: "交易路"
 game_concept_route: "交易路"
 game_concept_routes: "交易路"
 game_concept_route_possessive: "交易路"
 game_concept_routes_possessive: "交易路"
 game_concept_trade_route_desc: "$game_concept_trade_route$を利用すると、[character|E]は[trade|E]を行って[gold|E]を獲得したり、[realm|E]の需要を満たしたりできます。交易路によって、[markets|E]間で[goods|E]をやり取りし、一方の市場の[surplus|E]を、もう一方の市場の[needs|E]を満たすために輸送することができます。\n交易路には次の3種類があります：\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E]：[dukes|E]以上の統治者が自らの[buildings|E]の[needs|E]を満たすために使用します｡\n$EFFECT_LIST_BULLET$[profit_route|E]：[merchants|E]や[republican|E]の統治者が[gold|E]を生み出すために使用します｡\n$EFFECT_LIST_BULLET$[commission_route|E]：営利交易路とよく似ていますが､所領持ちの統治者が期間限定の需要を満たすため､一括の前払いで交易商人に発注する際に使用します｡#!"
 game_concept_distribution_route: "流通交易路"
 game_concept_distribution_routes: "流通交易路"
 game_concept_distribution: "流通"
 game_concept_distribution_route_possessive: "流通交易路"
 game_concept_distribution_routes_possessive: "流通交易路"
 game_concept_distribution_route_desc: "$game_concept_distribution_route$とは、[dukes|E]以上の統治者が自らの[realm|E]に物資を供給するために用いるタイプの[trade_route|E]です。\n\n2つの[markets|E]間で結ばれ、一方の$game_concept_market$の[surplus|E]が他方の[needs|E]を満たすために使用されます。ただし、$game_concept_distribution_routes$で輸送できるのは[basic_trade_goods|E]に限られます。"
 game_concept_profit_route: "営利交易路"
 game_concept_profit_routes: "営利交易路"
 game_concept_profit: "営利"
 game_concept_profit_route_possessive: "営利交易路"
 game_concept_profit_routes_possessive: "営利交易路"
 game_concept_profit_route_desc: "$game_concept_profit_route$とは、[merchants|E]や[republican|E]の[rulers|E]が[gold|E]を得るために用いるタイプの[trade_route|E]です。\n\n[surplus|E]のある[trade_goods|E]を安く買い、[needs|E]の高い市場で売ることで、[buy_price|E]と[sell_price|E]の差額から利益を得ます。"
 game_concept_trade_route_modifier: "交易路補正"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "交易路補正"
 game_concept_trade_route_modifier_desc: "この[modifier|E]は、所有者のすべての[trade_routes|E]に適用されます。補正可能な属性は以下の通りです：\n$BULLET_WITH_TAB$[competitiveness_i] [trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i] [trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i] [route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i] [max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i] [max_trade_markets_short|E]"
 game_concept_commission_route: "委託交易路"
 game_concept_commission_route_desc: "$game_concept_commission_route$は、[merchant|E]が[merchant_patron|E]の依頼を受けて運用する[trade_route|E]です。\n\n$game_concept_merchant$は$game_concept_merchant_patron$から報酬を受け取り、$game_concept_commission_possessive$期間中、指定された[trade_market|E]に特定の[trade_good|E]を届けます。\n\n$game_concept_merchant$が一度に保有できる$game_concept_commission_route$は#V 1#!本です。"
 game_concept_commission_routes: "委託交易路"
 game_concept_commission_route_possessive: "委託交易路"
 game_concept_commission_routes_possessive: "委託交易路"
 game_concept_commission: "委託"
 game_concept_commissions: "委託"
 game_concept_commission_possessive: "委託"
 game_concept_commissions_possessive: "委託"
 game_concept_commissioned_route: "委託交易路"
 game_concept_commissioned_routes: "委託交易路"
 game_concept_trade_route_length: "交易路距離"
 game_concept_route_length: "交易路距離"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$は、[profit_route|E]が通過できる[baronies|E]の最大数を表します。これには海域や航行可能な河川も含まれます。$game_concept_trade_route_length$は[company_buildings|E]をアップグレードすることで延長できます。"
 game_concept_max_trade_goods: "交易品目の上限"
 game_concept_max_trade_goods_short: "交易品目"
 game_concept_max_trade_goods_desc: "$game_concept_max_trade_goods$とは、1本の[route|E]が取り扱い可能な[good|E]タイプの数で、[company_buildings|E]のアップグレードにより増やすことができます。\n\n[profit_route|E]では、いかなるボーナスを得ていたとしても#V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#!種類を超える[goods|E]を取り扱うことはできません。"
 game_concept_max_trade_markets: "交易市場の上限"
 game_concept_max_trade_markets_short: "交易市場"
 game_concept_max_trade_markets_desc: "$game_concept_max_trade_markets$とは、[character|E]が1本の[profit_route|E]上で経由地として選択できる[markets|E]の数です。[company_buildings|E]のアップグレードにより増やすことができます。"
 game_concept_trade_route_capacity: "交易路の容量"
 game_concept_trade_route_capacity_short: "交易路容量"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "容量"
 game_concept_trade_route_capacity_desc: "$game_concept_trade_route_capacity$は、1本の[profit_route|E]で一度に取引できる[trade_goods|E]の量を表し、[company_buildings|E]のアップグレードにより増やすことができます。"
 game_concept_primary_good: "主要商品"
 game_concept_primary_goods: "主要商品"
 game_concept_primary_good_desc: "[merchants|E]と[patricians|E]は、自らの[trade_routes|E]において1種類の[trade_good|E]を$game_concept_primary_good$として取り扱います。\n\n$game_concept_primary_good$を取引することで、その商品を含む[trade_category|E]の[trade_expertise|E]を獲得できます。"
 game_concept_road: "道路"
 game_concept_roads: "道路"
 game_concept_road_possessive: "道路"
 game_concept_roads_possessive: "道路"
 game_concept_road_desc: "[road|E]とは、2つの[markets|E]間を結んで[trade_routes|E]を確立できるようにするものです。\n\n$game_concept_road$沿いの$game_concept_trade_routes$は$game_concept_road$による恩恵を受け、特に[trade_route_length|E]が増加します。\n\nまた、$game_concept_road$沿いの[barony|E]にも、[armies|E]の移動速度増加などの直接的な恩恵があります。\n\n$game_concept_road$の恩恵は[road_tier|E]に応じて増大します。"
 game_concept_road_tier: "道路等級"
 game_concept_road_tiers: "道路等級"
 game_concept_road_tier_short: "等級"
 game_concept_road_tier_desc: "$game_concept_road_tier$は、[road|E]の開発レベルを表し、未整備の荒れた小道から、よく整備された街道へと段階的に向上していきます。\n\n道路は、その沿線で[trade|E]が行われるほど等級が上昇しますが、等級が上がるほど、その次の等級に到達するために多くの利用実績と時間が必要になります。等級が高くなるほど、道路の効果も高まります（その[road|E]を利用する[trade_routes|E]の[trade_route_length|E]が増加し、通過する[baronies|E]へのボーナスも強化されます）。\n\n道路はマップ上で設定された等級から始まり、ゲーム開始時には最下位等級より上の道路のみが描画されます。"
 game_concept_building_need: "建造物の需要"
 game_concept_building_needs: "建造物の需要"
 game_concept_need: "需要"
 game_concept_needs: "需要"
 game_concept_building_need_desc: "[building|E]は[trade_goods|E]に対する$game_concept_needs$を持つ場合があり、$game_concept_needs$を満たせばボーナスを獲得できます。\n\n$game_concept_needs$には、特定の[good|E]#weak （[GetTradeGoodType('trade_good_wine').GetName]など）#!を必要とするものと、特定の[trade_category_short|E]#weak （[GetTradeGoodCategory('trade_category_alcohol').GetName]など）#!に属する$game_concept_good$であれば何でもよいものがあります。\n\n$game_concept_needs$はすべて、その地域の[market|E]に存在する$game_concept_trade_goods$によって満たされます。地域の$game_concept_market$に必要な$game_concept_good$の[surplus|E]がない場合、$game_concept_good$は[market_priority|E]に従って分配されます。\n\n$game_concept_needs$への対応は任意であり、満たさなくても不利益はありません。"
 game_concept_market_balance: "市場の需給バランス"
 game_concept_market_balances: "市場の需給バランス"
 game_concept_market_balance_short: "需給バランス"
 game_concept_market_balances_short: "需給バランス"
 game_concept_market_balance_desc: "各[market|E]には[trade_good|E]ごと、もしくは[goods|E]カテゴリーごとの需給バランスが存在します。\n\n需給バランスがプラスの場合、その[trade_good|E]や[goods|E]カテゴリーには[surplus|E]があります。\n\n需給バランスがマイナスの場合、その市場内にある[buildings|E]には[needs|E]が満たされていないものが存在します。"
 game_concept_trade_surplus: "市場の余剰"
 game_concept_trade_surpluses: "市場の余剰"
 game_concept_surplus: "余剰"
 game_concept_surpluses: "余剰"
 game_concept_trade_surplus_desc: "[market|E]において、[need|E]を上回る[production|E]を持つ[trade_good|E]には$game_concept_surplus$が発生します。\n\nこれは、$game_concept_market$内に存在するすべての[buildings|E]の$game_concept_needs$が満たされていることを意味します。\n\n$game_concept_surplus$分の[trade_good|E]は[trade_routes|E]を通じて他の$game_concept_markets$へと運び出すことができます。"
 game_concept_trade_deficit: "市場の不足"
 game_concept_trade_deficits: "市場の不足"
 game_concept_deficit: "不足"
 game_concept_deficits: "不足"
 game_concept_trade_deficit_desc: "[market|E]において、[production|E]や輸入量を上回る[needs|E]を持つ[trade_good|E]には$game_concept_deficit$が発生します。\n\nこれは、$game_concept_market$内に存在する一部の[buildings|E]の$game_concept_needs$が満たされていないことを意味します。\n\n$game_concept_deficit$は[trade_routes|E]を通じた輸入によって補うことができます。"
 game_concept_production: "生産量"
 game_concept_productions: "生産量"
 game_concept_trade_goods_production: "交易品生産量"
 game_concept_produced: "生産"
 game_concept_production_desc: "$game_concept_production$は、[districts|E]とその[buildings|E]が毎月生産する[trade_good|E]の量です。\n\n[market|E]での$game_concept_production$が、その市場の交易品に対する[needs|E]を上回ると、余った分は[trade|E]に利用できる[surplus|E]となります。$game_concept_production$が不足すると、その需要は満たされません。"
 game_concept_potential_production: "生産可能品"
 game_concept_potential_productions: "生産可能品"
 game_concept_potential_production_desc: "各[county_possessive|E]の生産可能品は、[county_capital|E]の[resource_district|E]で生産できる原材料の[trade_goods|E]を示します。"
 game_concept_sell_price: "販売価格"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "販売価格"
 game_concept_sell_price_desc: "[market_possessive|E]の$game_concept_sell_price$とは、[need|E]のある[trade_good|E]の価値を[gold|E]で換算したものです。\n\n[profit_routes|E]の所有者は、自らの[route|E]が$game_concept_market_possessive$の$game_concept_needs$を満たすために$game_concept_goods$を販売する際、その$game_concept_market$におけるその$game_concept_trade_good$の$game_concept_sell_price$を利益として獲得します。\n\n[landed|E]の[rulers|E]も高い$game_concept_sell_price$による恩恵を受けます。というのも、そのような$game_concept_market$にはより多くの[merchants|E]が集まり、[tolls|E]からの収入が増加したり、$game_concept_need$が満たされる可能性が高まったりするためです。\n\n$game_concept_tolls$は販売されるすべての$game_concept_good$に対して課され、実際の$game_concept_sell_price$を押し下げます。\n\n対となる[buy_price|E]と同様に、$game_concept_sell_price$は[market_prosperity|E]が高いほど上昇します。"
 game_concept_buy_price: "購入価格"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "購入価格"
 game_concept_buy_price_desc: "[market_possessive|E]の$game_concept_buy_price$とは、[surplus|E]のある[trade_good|E]の価格を[gold|E]で換算したものです。\n\n[profit_routes|E]の所有者は、自らの[route|E]を通じて$game_concept_surplus$のある$game_concept_market$から$game_concept_goods$を購入する際、その$game_concept_trade_good$の$game_concept_buy_price$を支払います。\n\n対となる[sell_price|E]と同様に、$game_concept_buy_price$は[market_prosperity|E]が高いほど上昇します。"
 game_concept_trade_monopoly: "交易独占権"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "交易独占権"
 game_concept_monopoly: "独占権"
 game_concept_monopolies: "独占権"
 game_concept_trade_monopoly_desc: "$game_concept_monopoly$とは、その保有者のみに[market|E]における[goods|E]の売買を可能にする権利です。\n\n$game_concept_monopoly$には複数の種類があります：\n #indent_newline:4    $EFFECT_LIST_BULLET$通常の$game_concept_monopoly$は単一の[trade_category|E]に適用され、[complete_monopoly|E]はすべての[trade_category|E]に適用されます。\n$EFFECT_LIST_BULLET$[exploitative_monopoly|E]を保有すると、[needs|E]が満たされる前でも、$game_concept_goods$の[production|E]から買い取ることができます。\n$EFFECT_LIST_BULLET$$game_concept_monopoly$は[merchant|E]、[republic|E]国家、もしくは[trade_league|E]全体が保有可能です。#!\n\n$game_concept_monopolies$は行動「$request_trade_monopoly_for_character_interaction|V$」によって獲得できます。"
 game_concept_complete_monopoly: "完全独占権"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "完全独占権"
 game_concept_complete_monopoly_short: "完全"
 game_concept_complete_monopoly_desc: "$game_concept_complete_monopoly$は[market|E]内のすべての[trade_good|E]を一括して対象とします。通常の[monopoly|E]とは異なり、単一の[trade_category|E]のみに限定されません。"
 game_concept_exploitative_monopoly: "搾取型独占権"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "搾取型独占権"
 game_concept_exploitative_monopoly_short: "搾取型"
 game_concept_exploitative_monopoly_desc: "$game_concept_exploitative_monopoly$は[monopoly|E]の一種で、保有者は、[market|E]の[production|E]から直接購入することができます。\n\n通常、購入できるのは[surplus|E]のみですが、$game_concept_exploitative_monopoly$の保有者は対象の$game_concept_market$内にある[building_needs|E]が満たされる前の段階で、$game_concept_market$内の[buildings|E]の$game_concept_production$から購入を行うことができます。"
 game_concept_trade_competitiveness: "交易競争力"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "競争力"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "各[profit_route|E]には$game_concept_competitiveness$が存在します。これは他の$game_concept_profit_routes$と競合する際に、[market|E]内の[trade_goods|E]をどれだけ取引できるかを表します。\n\n特定の$game_concept_trade_good$に対する$game_concept_competitiveness$合計が高いほど、[market_share|E]も高くなります。\n\n$game_concept_market$に[monopoly|E]が設定されている場合、$game_concept_monopoly$の保有者間でのみ$game_concept_competitiveness$の比較が行われます。"
 game_concept_competitive_pressure: "競争圧力"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "$game_concept_competitive_pressure$は、[merchant|E]が一時的に獲得する商業上の影響力を表します。競争圧力を使って、特定の[trade_routes|E]に対して特別な利益をもたらす[decisions|E]や[interactions|E]を行うことができます。"
 game_concept_put_on_notice: "通告"
 game_concept_put_on_notice_desc: "$game_concept_put_on_notice$は、[GetPerk('prepared_conscription_perk').GetName(GetPlayer)]の[perk|E]でアンロックされる[character_interaction|E]です。[competitive_pressure_i] [competitive_pressure|E]を消費して、自分の[trade_route|E]が通る[trade_markets|E]のいずれかにいる[merchant|E]を相手に、ライバル向けの[trade_opportunity|E]を開始します。"
 game_concept_ruthless_oversight: "無慈悲な管理"
 game_concept_ruthless_oversight_desc: "$game_concept_ruthless_oversight$は、[GetPerk('fear_tax_perk').GetName(GetPlayer)][perk|E]でアンロックされる[character_interaction|E]です。[dread|E]、[opinion|E]、[company_sentiment|E]を消費して、キャラクターの[court_position|E]の[aptitude|E]を向上できます。"
 game_concept_request_merchant_charter: "交易特許状の要請"
 game_concept_request_merchant_charter_desc: "$game_concept_request_merchant_charter$は、[merchant|E]が[merchant_patron|E]に[charter|E]を要請できる[character_interaction|E]です。[charter|E]を得ると、本拠の[market|E]で特権が与えられます。"
 game_concept_monopolize_trade: "交易の独占"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "$game_concept_monopolize_trade$は、[merchant|E]が[market_owner|E]に[gold|E]を支払い、その対価として[trade_monopoly|E]を獲得する[character_interaction|E]です。"
 game_concept_trader: "交易担当者"
 game_concept_traders: "交易担当者"
 game_concept_trader_possessive: "交易担当者"
 game_concept_traders_possessive: "交易担当者"
 game_concept_trader_desc: "$game_concept_trader$とは、[trade_route|E]の監督役に任命された[character|E]です。\n\n$game_concept_trader$はその交易路の所有者の[associate|E]もしくは[courtier|E]である必要があり、一度に監督できる交易路は1本だけです。[SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\n各交易担当者には、交易路の特定の側面を改善する任務が割り当てられます。その任務に対する[aptitude|E]は、当人の[skills|E]に基づいて決まります。\n\n交易路を監督する間、交易担当者は各[trade_market|E]で対人[schemes|E]を実行します。工作に失敗した場合、未所持であれば[trait|E]「[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]」を獲得します。所持している場合は、代わりにランダムな[GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )]の[trait_level_track|E]（$trait_track_caravaneer$、$trait_track_artisan$、もしくは$trait_track_creditor$）で少量の[trait_level_track_xp|E]を獲得します。"
 game_concept_trader_council: "所有者の配偶者を除き、評議員を兼任できません。"
 game_concept_trader_council_merchant: "所有者の[spouse|E]と[deputies|E]は、$game_concept_traders$を兼任できます。ただし、[GetCourtPositionType('partner_court_position').GetName()]と[GetCourtPositionType('travel_leader_court_position').GetName()]は除きます。"
 #Merchant
 game_concept_merchant: "交易商人"
 game_concept_merchants: "交易商人"
 game_concept_merchant_possessive: "交易商人"
 game_concept_merchants_possessive: "交易商人"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "$game_concept_merchant$は[unlanded|E]の[character|E]であり、[company|E]の一員として[trade|E]に従事します。\n\n交易商人は[trade_markets|E]の[building_needs|E]を満たすことを目指します。彼らは財を成し、社会的地位を向上することを目的として行動し、経済を活性化させますが、彼らにとって[prestige|E]は[gold|E]よりも重要です。[prestige|E]は[merchant_patron|E]や[associates|E]との関係において自らの地位を高め、[trade_routes|E]を拡大するのに役立ち、最終的には[trade_monopoly|E]の確保を可能にするためです。"
 game_concept_merchant_family: "交易商家"
 game_concept_merchant_families: "交易商家"
 game_concept_merchant_family_possessive: "交易商家"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$は、[merchants|E]または[republicans|E]の市民として交易に従事する[houses|E]です。[house_head|E]が所有・統制する[company|E]を保有し、領国の[trade|E]と[prosperity|E]において重要な役割を担います。"
 game_concept_associate: "商会員"
 game_concept_associates: "商会員"
 game_concept_associate_possessive: "商会員"
 game_concept_associates_possessive: "商会員"
 game_concept_associate_desc: "$game_concept_associates$は、[merchant|E]の[company|E]に所属する[unlanded|E]の[character|E]です。所領持ちの統治者にとっての[courtiers|E]と同様の役割を果たし、[traders|E]として[trade_routes|E]を管理したり、[deputies|E]に就任したりすることができます。"
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "代理人"
 game_concept_deputies: "代理人"
 game_concept_deputy_possessive: "代理人"
 game_concept_deputies_possessive: "代理人"
 game_concept_deputy_desc: "$game_concept_deputies$は、[merchant_families|E]とその[companies|E]において、さまざまな役割を担います。代理人の役職は[court_positions|E]と同様の性質を持ち、[company|E]の[associates|E]に与えられ、代理人の[aptitude|E]によって、それぞれの業務の成否が決まります。"
 game_concept_company: "商会"
 game_concept_companies: "商会"
 game_concept_company_possessive: "商会"
 game_concept_trade_company: "交易商会"
 game_concept_trade_companies: "交易商会"
 game_concept_company_desc: "$game_concept_trade_companies$は[merchant_family_possessive|E]の事業拠点で、管轄する[trade_routes]はすべてここが起点となります。\n\n各[GetGovernment( 'merchant_government' ).GetName]は$game_concept_trade_company$の[domicile|E]を所有します。[merchant_patron|E]が存在する場合、$game_concept_merchant_possessive$の$game_concept_domicile$は通常[merchant_patron_possessive|E]の[holding|E]内に置かれます。\n\n[company_buildings|E]は商会の[domicile_buildings|E]であり、交易活動と、商会に所属するすべての者にボーナスをもたらします。また、$game_concept_company$はその[associates|E]と家族、そして[deputies|E]として雇われる[knights|E]に居住の場を提供します。\n\n#WEAK [courts|E]と同様に、$game_concept_companies$にも名もなき[characters|E]が存在しますが、その数は比較的少なめです。#!"
 game_concept_company_building: "商会建造物"
 game_concept_company_buildings: "商会建造物"
 game_concept_company_buildings_short: "建造物"
 game_concept_company_building_desc: "$game_concept_company_buildings$とは[company|E]の[domicile_buildings|E]のことで、主として[trade|E]の改善、すなわち[trade_routes|E]の[capacity|E]、[route_length|E]、[max_trade_goods_short|E]、および[max_trade_markets_short|E]の強化を行います。"
 game_concept_usury: "高利貸し"
 game_concept_usurer: "高利貸し"
 game_concept_usurers: "高利貸し"
 game_concept_usurer_possessive: "高利貸し"
 game_concept_usurers_possessive: "高利貸し"
 game_concept_usurious: "高利"
 game_concept_interest: "利子"
 game_concept_usury_desc: "$game_concept_usury$とは$game_concept_interest$付きで[gold|E]を[lending|E]することです。それが真っ当な商売であるか[sin|E]であるかは、[rite|E]の[doctrine|E]が「[GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip]」であるか否かで決定されます。\n\n$game_concept_usury$が非難される[rite|E]では、[merchant|E]は[interaction|E]「$loan_money_interaction|V$」を通じて[loan|E]を行うたびに[piety|E]を失い、また、「$company_purpose_creditor|V$」の理念の下に運営されている[company|E]は、$game_concept_interest$を取っていることが周知の事実となった時点で、[company|E]の所有者に$game_concept_usurer$としての永続的な悪評がもたらされます。\n\n#weak 一部の$game_concept_rites$では、$game_concept_interest$付きの貸し付けがその[religion|E]内でのみ禁止されており、$game_concept_merchants$は他の[religion|E]の信徒に対しては自由に貸し付けることができます。#!"
 game_concept_loan: "貸し付け"
 game_concept_loans: "貸し付け"
 game_concept_loan_possessive: "貸し付け"
 game_concept_loans_possessive: "貸し付け"
 game_concept_loaned: "貸し付け"
 game_concept_lending: "貸し付け"
 game_concept_loan_desc: "$game_concept_loan$とは、$game_concept_interest$の有無にかかわらず返済を前提として渡される一定額の[gold_i|E] [gold|E]のことです。\n\n$game_concept_loans$の対象となるのは通常、[debt|E]もしくは[war|E]や他の支出のために追加の資金を必要としている[ruler|E]です。\n\n$game_concept_loans$には、$game_concept_interest$を公然と明示するもの、$game_concept_interest$を隠して課すもの、無$game_concept_interest$のものがあります。[faiths|E]によって[usury|E]に対する見解はさまざまです。\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help $game_concept_loan$は、貸し借りに合意した当事者が亡くなっても消滅するとは限りません。当事者の一方が死亡した場合、[heir|E]がいる場合はその人物に引き継がれます#!"
 loan_repayment_help: "#help [debtor|E]は[decision|E]「[GetDecisionWithKey('repay_loan_decision').GetName]」を使用することで$game_concept_loans$を返済できます。[creditor|E]は、#V 2#!年以上が経過すると、[interaction|E]「#V $demand_repayment_interaction$#!」を通して返済を求めることができます\n\n[company_purpose|E]「[GetLaw('company_purpose_creditor').GetName]」を持つ[merchants|E]は、[GetCourtPositionType( 'bailiff_court_position' ).GetName()]を雇用し、[court_position_task|E]「#V $bailiff_collect_loans$#!」を用いることで、時間をかけて[loans|E]を回収することもできます#!"
 game_concept_merchant_patron: "後援者"
 game_concept_merchant_patrons: "後援者"
 game_concept_merchant_patron_possessive: "後援者"
 game_concept_merchant_patron_desc: "$game_concept_merchant_patron$とは、[merchant_possessive|E]が[domicile|E]を構えている[holding|E]の[ruler|E]のことです。\n\nこの場合、$game_concept_merchant$はその$game_concept_merchant_patron$の[client|E]とみなされ、$game_concept_merchant_patron$に[taxes|E]を納める必要があります。"
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "従属商人"
 game_concept_client_merchants: "従属商人"
 game_concept_client_merchant_possessive: "従属商人"
 game_concept_client: "従属商人"
 game_concept_client_possessive: "従属商人"
 game_concept_clients: "従属商人"
 game_concept_client_merchant_desc: "$game_concept_client_merchant$とは、[merchant|E]の[character|E]です。[landed|E]の[ruler|E]の[realm|E]内に[company|E]を所有し、その[ruler|E]が[merchant_patron|E]となります。\n\n$game_concept_client_merchant$は、自らの[trade|E]による収入の一部を後援者に納めます。後援者に対する戦争や反対[faction|E]に参加することができず、商会を別の場所へと移転しない限り、後援者との関係を断ち切ることもできません。"
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "領国奪取"
 game_concept_seize_realm_cb_desc: "[merchant|E]が[republic|E]国家を樹立して領地を獲得できる[casus_belli|E]です。攻撃側は[interaction|E]「 #V $gdp_merchant_seize_realm_call_debtor_interaction$#!」を使用し、@unspent_strong_hook_icon! [strong_hooks|E] #weak （$strong_indebted_hook$または$strong_loan_hook$）#!を消費することで、[independent|E]した[rulers|E]を[allies|E]としてこの[war|E]に参戦させることができます。"
 game_concept_company_purpose: "商会方針"
 game_concept_company_purposes: "商会方針"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$とは、[company|E]とその[merchant_family|E]の方向性を定める指針です。\n\n商会は、金融業、一族の信頼性、商品の品質や希少性、あるいは距離や文化の隔たりを越えた交易網の拡充のいずれかに重点を置くことができます。\n\n方針に応じて、固有の[interactions|E]、[deputy|E]職、および[trade|E]ボーナスが付与されます。"
 game_concept_trade_acumen: "交易洞察力"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "洞察力"
 game_concept_trade_acumen_desc: "$game_concept_acumen$は、[merchant|E]の[company|E]がすべての[trade_categories|E]での[trade|E]で獲得した[gold|E]の累計を表します。\n\n洞察力は、さまざまな[company_sizes|E]のアンロックに使用され、消費されることはありません。"
 game_concept_company_size: "商会規模"
 game_concept_company_sizes: "商会規模"
 game_concept_company_size_desc: "$game_concept_company_size$とは[merchant_family_possessive|E]の[trade|E]における優位性を表すもので、規模の拡大とともに[competitiveness|E]と交易能力が大幅に向上します。規模を拡大するには[acumen|E]を蓄積する必要があります。\n\n商会の規模には、[GetLaw('company_size_small').GetName]、[GetLaw('company_size_medium').GetName]、[GetLaw('company_size_large').GetName]、[GetLaw('company_size_huge').GetName]の4段階があります。"
 #Contracts
 game_concept_trade_contract: "交易契約"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "交易契約"
 game_concept_trade_contract_possessive: "交易契約"
 game_concept_trade_contracts_possessive: "交易契約"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$は、[merchant|E]の[companies|E]が[trade_routes|E]に影響を及ぼしたり、遠方で貴重な財貨を追い求めたりするための手段です。\n\n前者は[trade_opportunities|E]、後者は[luxury_contracts|E]と呼ばれます。"
 game_concept_trade_contract_tier: "交易契約等級"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "等級"
 game_concept_trade_contract_tier_desc: "各[trade_contract|E]には$game_concept_trade_contract_tier_tier$が存在し、これによって$game_concept_trade_contract$の難易度と報酬の両方が決まります。通常、$game_concept_trade_contract_tier_tier$はその場所の[prosperity|E]に基づきます。"
 game_concept_luxury_contract: "特別契約"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "特別契約"
 game_concept_luxury_contract_possessive: "特別契約"
 game_concept_luxury_contracts_possessive: "特別契約"
 game_concept_luxury_contract_desc: "$game_concept_luxury_contracts$では、[merchant|E]は[companies|E]を遠隔地まで[travel|E]させ、[domicile_artifact|E]を調達する必要があります。\n\nこれらの契約は「隊商長」の[company_purpose|E]を持つ商人に毎年発生する可能性があり、[decision|E]「[GetDecisionWithKey('gdp_visit_holding_decision').GetName]」を通じて獲得することができます。"
 game_concept_trade_opportunity: "交易機会"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "交易機会"
 game_concept_trade_opportunity_possessive: "交易機会"
 game_concept_trade_opportunities_possessive: "交易機会"
 game_concept_opportunity: "機会"
 game_concept_opportunities: "機会"
 game_concept_opportunity_possessive: "機会"
 game_concept_opportunities_possessive: "機会"
 game_concept_trade_opportunity_desc: "$game_concept_trade_opportunities$では、[merchant|E]の[companies|E]は[scheme|E]を成功させなければなりません。\n\n工作内容は通常、純粋な商業活動（利益の大きい[trade_goods|E]の販促など）ですが、対立的な活動（[market|E]の支配権を巡って対立する一族と競い合うなど）もあります。\n\n何らかの理由で$game_concept_scheme$が失敗または中止された場合、その$game_concept_trade_opportunity$も失敗となります。"
 game_concept_trade_opportunity_tier: "交易機会等級"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "等級"
 game_concept_trade_opportunity_tier_desc: "$game_concept_trade_opportunity_tier$は、契約の対象地域の[prosperity|E]を反映しています。\n\n$game_concept_trade_opportunity_tier$が高いほど報酬も増加しますが、一般的に任務の難易度も高くなります。"
 game_concept_trade_opportunity_scheme: "交易機会工作"
 game_concept_trade_opportunity_schemes: "交易機会工作"
 game_concept_trade_opportunity_scheme_possessive: "交易機会工作"
 game_concept_trade_opportunity_schemes_possessive: "交易機会工作"
 game_concept_trade_opportunity_scheme_trade_opportunity: "交易機会"
 game_concept_trade_opportunity_scheme_opportunity: "機会"
 game_concept_opportunity_scheme: "機会工作"
 game_concept_opportunity_schemes: "機会工作"
 game_concept_opportunity_scheme_possessive: "機会工作"
 game_concept_opportunity_schemes_possessive: "機会工作"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "後援者契約"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "後援者契約"
 game_concept_patron_contract_possessive: "後援者契約"
 game_concept_patron_contracts_possessive: "後援者契約"
 game_concept_patron_contract_desc: "$game_concept_patron_contracts$では、[merchant|E]の[companies|E]は[merchant_patron|E]に対する[scheme|E]を成功させなければなりません。\n\n工作は主に[diplomacy|E]に重点を置いたもので、後援者の望みを叶えるためのもの（市場での紛争を解決するなど）や、交易商人に有利な方向へ後援者を誘導するためのもの（対立する交易商家を排除するなど）があります。\n\n何らかの理由で$game_concept_scheme$が失敗または中止された場合、その$game_concept_patron_contract$も失敗となります。"
 game_concept_patron_contract_scheme: "後援者契約工作"
 game_concept_patron_contract_schemes: "後援者契約工作"
 game_concept_patron_contract_scheme_possessive: "後援者契約工作"
 game_concept_patron_contract_schemes_possessive: "後援者契約工作"
 game_concept_patron_contract_scheme_patron_contract: "後援者契約"
 game_concept_patron_scheme: "後援者工作"
 game_concept_patron_schemes: "後援者工作"
 game_concept_patron_scheme_possessive: "後援者工作"
 game_concept_patron_schemes_possessive: "後援者工作"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "方針契約"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "方針契約"
 game_concept_unity_contract_possessive: "方針契約"
 game_concept_unity_contracts_possessive: "方針契約"
 game_concept_unity_contract_desc: "$game_concept_unity_contracts$は、[merchant_possessive|E]の[company_sentiment|E]が低下した際に発生し、対処すべき問題を提示します。"
 game_concept_domicile_artifact: "本拠地の宝物"
 game_concept_domicile_artifacts: "本拠地の宝物"
 game_concept_domicile_artifact_desc: "$game_concept_domicile_artifact$とは、[merchant_possessive|E]の[company|E]で展示される[artifact|E]で、[curios|E]や[creatures|E]などが含まれます。\n\n$game_concept_domicile_artifacts$は、$game_concept_merchant_possessive$が自動的に[prestige|E]を獲得する主な手段となります。\n\n[character|E]が所持できる$game_concept_artifacts$の数に制限はありませんが、種類に合ったスロットに展示されているものだけが効果を発揮します。\n\n$game_concept_merchants$は、[luxury_contracts|E]を成功させることで$game_concept_domicile_artifacts$を獲得できます。"
 game_concept_menagerie: "珍獣"
 game_concept_menagerie_creature: "珍獣"
 game_concept_menagerie_creatures: "珍獣"
 game_concept_creature: "獣"
 game_concept_creatures: "獣"
 game_concept_creature_desc: "$game_concept_creature$とは、[luxury_contracts|E]の達成時に[merchants|E]を通じて入手できる、生きた動物です。\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "珍品"
 game_concept_curios: "珍品"
 game_concept_curio_desc: "$game_concept_curio$は、[luxury_contracts|E]の達成時に[merchants|E]を通じて入手できる、希少な[artifact|E]の一種です。\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "これらを[company|E]内に[domicile_artifact|E]として展示すると、[prestige|E]を継続的に獲得できます。"
 game_concept_guelph_ghibelline_precursor_situation: "$game_concept_guelph_ghibelline_situation$ 序章"
 game_concept_guelph_ghibelline_precursor_situation_desc: "「[guelph_ghibelline_situation|E]」の[situation|E]の序章では、神聖ローマ帝国と教皇庁が対立を深めていく一連の出来事が発生します。\n\n#F 発端となったのは、[Glossary( 'イン・ノミネ・ドミニ', 'IN_NOMINE_DOMINI_GLOSS' )]による教皇権の再興でした。当時の教皇は、教皇選挙に貴族が関与すべきではなく、ローマに集う枢機卿がこれを行うべきであると宣言しました。\n\nその後、[Glossary( 'ディクタトゥス・パパエ', 'DICTATUS_PAPAE_GLOSS' )]と聖職叙任権闘争の時代に、教皇は神から授けられた教皇権こそが普遍的な権威であり、教皇こそが聖職者を任命または罷免できる唯一の存在であると宣言しました。また、世俗的な権力者が司教職の象徴を司教に授与することは好ましくないと見なされました。#!"
 game_concept_guelph_ghibelline_situation: "ゲルフ派とギベリン派"
 game_concept_guelph_ghibelline_situation_desc: "教皇（[guelphs|E]）と神聖ローマ帝国（[ghibellines|E]）の対立から生じる状況です。\n\nやがてこの対立は、北イタリアの統治者たちが帝国の関与をより積極的に受け入れるか、それとも独立を維持するかを巡る地域的な問題へと発展していきました。"
 game_concept_gg_involvement: "関与度"
 game_concept_gg_involvement_desc: "[ruler|E]の[situation|E]「[guelph_ghibelline_situation|E]」への$game_concept_gg_involvement$は、そのキャラクターがこの状況にどれほど影響を与えたかを示します。関与は主に、対立する党派に対してアクションを起こすことで達成できます。\n\n該当するアクションには以下が含まれます：\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[interactions|E]「[imprison|E]」、「[torture|E]」、「[execution|E]」\n$BULLET_WITH_TAB$[scheme|E]「[GetScheme('gg_switch_sides').GetTypeName]」、[interaction|E]「$gg_recruit_partisan_interaction|V$」、[casus_belli|E]「[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]」など\n$BULLET_WITH_TAB$[situation_catalysts|E]の発動\n\n$game_concept_gg_involvement$の効果：\n$BULLET_WITH_TAB$$game_concept_gg_involvement$が#V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#!増えるごとに、[modifier|E]「[GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip]」が段階的に適用される\n$BULLET_WITH_TAB$最終的に所属党派がこの状況を終了させた場合、報酬倍率として機能する。\n\n#F [guelph_ghibelline_precursor_situation|E]の間は、まだ$game_concept_gg_involvement$を獲得できず、対立が本格的に勃発するまでは通常より低い速度で蓄積されます。#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "ゲルフ派"
 game_concept_guelphs: "ゲルフ派"
 game_concept_guelph_desc: "ゲルフ派は、「[guelph_ghibelline_situation|E]」の[situation|E]において神聖ローマ帝国からの独立、ひいては教皇の神授的権威を支持する勢力です。\n\n#F 「ゲルフ」という名称はバイエルン公を輩出したヴェルフ家に由来し、口伝や発音の変化によって現在の形へと変化したものです。#!"
 game_concept_ghibelline: "ギベリン派"
 game_concept_ghibellines: "ギベリン派"
 game_concept_ghibelline_desc: "ギベリン派は、「[guelph_ghibelline_situation|E]」の[situation|E]において、北イタリアの諸都市国家に対する神聖ローマ帝国の影響力と支配の強化を支持する勢力です。\n\n#F 「ギベリン」という名称は、ホーエンシュタウフェン家の掛け声に由来し、ヴァインスベルク包囲戦におけるヴィーベリンゲン城の呼称に結びついているとされています。#!"
 game_concept_lombard_league: "ロンバルディア同盟"
 game_concept_lombard_league_desc: "北イタリアの諸都市によって結成された同盟で、$e_hre$による中央集権化の圧力に反対するものです。"
 game_concept_confederation_cohesion: "連合結束力"
 game_concept_cohesion: "結束力"
 game_concept_confederation_cohesion_desc: "$game_concept_cohesion$とは、[confederation|E]がどれほど固く団結しているかを#V 0#!から#V 100#!までの値で測る指標です。この値の上下には毎月すべての加盟者が影響を与えるほか、高い$game_concept_cohesion$では増加量が減少します。\n\n各段階に達するごとに、加盟者が得られるボーナスも段階的に大きくなります。何によって$game_concept_cohesion$が生み出され、各段階のボーナスが何であるかは連合の種類によって異なります。\n\n連合の$game_concept_cohesion$には以下のタイプがあります：\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "交易同盟"
 game_concept_trade_league_desc: "$game_concept_trade_league$とは[republics|E]の[confederation|E]のことで、共和制の[rulers|E]が商業的および防衛的な相互利益のために結成もしくは加盟できるものです。\n\n1人の加盟者が[leading_title|E]を保持し、[trade_league_leader|E]を務めます（他の[rulers|E]を招待または除名できるのはこの盟主のみです）。残りの加盟者は[member_title|E]を保持します。\n\n[league_cohesion|E]が強固になるにつれ、加盟者が享受するボーナスも大きくなります。"
 game_concept_trade_leagues: "交易同盟"
 game_concept_trade_league_short: "同盟"
 game_concept_league_cohesion: "同盟結束力"
 game_concept_league_cohesion_desc: "$game_concept_cohesion$とは[trade_league|E]の団結の程度を測るもので、各段階に達するごとに、加盟者が得られるボーナスも漸増的に大きくなります。この値が#V 20#!未満のときは同盟の結びつきが弱すぎるため、互いの[wars|E]に参戦したり、[trade_monopolies|E]を要請したりすることはできません。\n\n$game_concept_cohesion$は加盟者の[title_tier|E]、[capital|E]、および[trade_league_leader|E]への[opinion|E]から生み出されます。[trade_monopolies|E]の保持はさらなる$game_concept_cohesion$を生み出す一方、[trade_league_members_short|E]が少なすぎても多すぎても結束力は減少します。"
 game_concept_trade_league_leader: "交易同盟の盟主"
 game_concept_trade_league_leader_desc: "交易同盟の盟主は[trade_league|E]の正式な指導者です。\n\n盟主は$game_concept_trade_league$において、新規加盟者を招待したり、既存加盟者を除名したりできる唯一の[trade_league_member_short|E]です。同盟はその創設者を盟主として発起します。加盟者は後に盟主の座を要求することができます。盟主が離脱した場合、[title_tier|E]、[capital|E]の[settlement_size|E]、そして[prestige|E]に基づいて他の加盟者が盟主の座を継承します。"
 game_concept_trade_league_leader_short: "盟主"
 game_concept_trade_league_member: "交易同盟の加盟者"
 game_concept_trade_league_members: "交易同盟の加盟者"
 game_concept_trade_league_member_short: "加盟者"
 game_concept_trade_league_members_short: "加盟者"
 game_concept_trade_league_member_desc: "交易同盟の加盟者とは、[member_title|E]の保持をもって[trade_league|E]の一員となった者のことで、この[member_title|E]は加盟している[republics|E]国家の[primary_title|E]で構成されます。\n\n1人の加盟者が[leading_title|E]を保持し、[trade_league_leader|E]を務めます。"
 game_concept_league_focus: "同盟の重点分野"
 game_concept_league_focuses: "同盟の重点分野"
 game_concept_league_focus_desc: "$game_concept_league_focus$とは、[trade_league|E]において[trade_league_leader|E]によって選択される[trade_category|E]のことをいいます。各[member_title|E]の[holder|E]は、そのカテゴリーの[trade_expertise|E]、[production|E]、そして[sell_price|E]へのボーナスを獲得します。"
 game_concept_patrician: "パトリシアン"
 game_concept_patricians: "パトリシアン"
 game_concept_patrician_possessive: "パトリシアン"
 game_concept_patrician_desc: "パトリシアンは、[republic|E]における有力な[merchant|E]一族の[house_head|E]を指します。"
 game_concept_patrician_family: "パトリシアン一族"
 game_concept_patrician_families: "パトリシアン一族"
 game_concept_patrician_family_short: "一族"
 game_concept_patrician_family_desc: "$game_concept_patrician_family$は[republic|E]国家に属する[merchant_family|E]です。[consortery|E]を[domicile|E]として使用し、共和国における権力と影響力を握る名門貴族です。\n\n$game_concept_patrician_family$は[county|E][title_tier|E]の共和国においては1つしか存在できませんが、より上位の共和国では複数が存在でき、また複数存在することが前提となっています。"
 game_concept_patrician_rating: "パトリシアン評価"
 game_concept_patrician_rating_short: "評価"
 game_concept_patrician_rating_desc: "[patrician_family|E]には、一族とその[patrician|E]が[republic|E]国家内でどれほど不可欠で影響力を持っているかを示す$game_concept_patrician_rating$が存在します。\n\n高い評価を得ると、パトリシアンとその[house|E]に対して3段階の異なるボーナスが付与されます。各段階に達すると、以下のような追加のボーナスがアンロックされます：\n$BULLET_WITH_TAB$[house_ambition|E]の強化\n$BULLET_WITH_TAB$[interactions|E]の受諾率の上昇\n$BULLET_WITH_TAB$[governor_salary|E]の増加\n\n評価を高める方法にはさまざまなものがあり、主要なものとして以下があります：\n$BULLET_WITH_TAB$[patrician_possessive|E]の[trade|E]収入\n$BULLET_WITH_TAB$[republic|E]国家の統治\n$BULLET_WITH_TAB$[assembly|E]や[liege_possessive|E]の[council|E]議席の確保[AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$[house|E]の成員が[clerical_region|E]を保有\n$BULLET_WITH_TAB$[modifier|E]「[GetModifier('favored_by_pope_modifier').GetNameWithTooltip]」の保持"
 game_concept_patrician_rating_penalties_PAM: "パトリシアンが[excommunicated|E]されているか、周知の[criminal|E]であるか、あるいは[GetModifier('scorned_pope_modifier').GetNameWithTooltip]である場合、評価は低下します。"
 game_concept_patrician_rating_penalties_NO_PAM: "パトリシアンが[excommunicated|E]であるか、周知の[criminal|E]である場合、評価は低下します。"
 game_concept_consortery: "コンソルテリーア"
 game_concept_consorteries: "コンソルテリーア"
 game_concept_consortery_possessive: "コンソルテリーア"
 game_concept_consortery_desc: "$game_concept_consortery$とは、[patrician_family|E]の邸宅であり[domicile|E]のことです。通常は[liege_possessive|E]の[capital|E]に所在します。\n\n[merchant_possessive|E]の[trade_companies|E]と同様に、$game_concept_consortery$は[company_buildings|E]を[domicile_buildings|E]として使用し、一族の武勇と交易における競争力を高めます。\n\n$game_concept_consortery$は[patrician_family|E]の称号とともに相続されます。"
 game_concept_assembly: "議会"
 game_concept_assembly_possessive: "議会"
 game_concept_assembly_desc: "$game_concept_assembly$は、[realm|E]の統治機関です。\n\n議会の権限は[laws|E]によって定められ、法律や[republic_decrees|E]の可決・承認のほか、[GetLaw('republican_elective_succession_law').GetName]のような一部の選挙制の[succession|E]においては、後継者候補への投票を行う場合もあります。"
 game_concept_republic_senate: "元老院"
 game_concept_republic_senate_possessive: "元老院"
 game_concept_voting_session: "投票"
 game_concept_voting_sessions: "投票"
 game_concept_voting_session_desc: "$game_concept_voting_session$は、[assembly|E]が提案された[law|E]や[republic_decree|E]について採決を行う一連の過程です。\n\n投票が進行している間、構成員は各自の賛同度に基づき、提案に対して賛成または反対の投票を行います。投票が終了するまでに十分な数の構成員が賛同すれば、法案は可決され、成立します。\n\n賛同度は、投票に先立って[councillor_task|E]や特定の[perks|E]を通じて高めることができ、[hook|E]を使用することで議員に自身の望み通りの投票を強制することもできます。"
 game_concept_republic_decree: "共和国法令"
 game_concept_republic_decrees: "共和国法令"
 game_concept_republic_decree_short: "法令"
 game_concept_republic_decrees_short: "法令"
 game_concept_republic_decree_desc: "$game_concept_republic_decree$は、[republic|E]における[decision|E]の一種で、[assembly|E]の承認が必要です。\n\n$game_concept_republic_decrees_short$にはさまざまな種類がありますが、その多くは[patricians|E]、[realm_capital|E]、または共和国全体に影響を及ぼします。"
 game_concept_house_ambition: "一族の野望"
 game_concept_house_ambitions: "一族の野望"
 game_concept_house_ambition_desc: "[republic|E]国家の[house|E]はそれぞれ野望を持っています。野望は、一族の構成員が共和国にどのような影響を与えたいと考えているかを示します。"
 game_concept_republic_administration: "共和制の行政制度"
 game_concept_republic_administration_short: "行政制度"
 game_concept_republic_administrations: "共和制の行政制度"
 game_concept_republic_administration_desc: "すべての[republics|E]には共和制の行政制度が定められており、それによって共和国の特色が決まります。\n\n行政制度を変更できるのは、共和国の[ruler|E]だけです。\n\n選択できる行政制度は複数あり、それぞれ固有の利点があります。\n\n#help 一般的な行政制度には、[GetLaw( 'republic_type_communal' ).GetName]、[GetLaw( 'republic_type_maritime' ).GetName]、[GetLaw( 'republic_type_civic' ).GetName]があります。#!"
 game_concept_republic_senator: "元老院議員"
 game_concept_republic_senators: "元老院議員"
 game_concept_republic_senator_desc: "$game_concept_republic_senator$とは、[GetLaw( 'republic_assembly_composition_roman_senate' ).GetName]を採用している[assembly|E]の議員のことです。\n\n元老院議員は[republic_possessive|E]の[ruler|E]または監察官によって任命されます。\n\n一度に任命できる$game_concept_republic_senators$の人数には上限があり、その上限は元老院規模の[law|E]によって決まります。"
 game_concept_mercenary_limit: "傭兵上限"
 game_concept_mercenary_limit_desc: "傭兵上限は、[character|E]が同時に雇用できる[mercenaries|E]の数を指します。\n\n傭兵上限は以下によって決まります：\n$BULLET_WITH_TAB$[martial_i] [martial|E][skill|E]\n$BULLET_WITH_TAB$[title_tier_i] [title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
