 game_concept_merchant_charter: "交易特許状"
 game_concept_merchant_charters: "交易特許状"
 game_concept_charter: "特許状"
 game_concept_charters: "特許状"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "$game_concept_charter$とは、[merchant_patron|E]が自らの[clients|E]に対して発行する文書の[artifact|E]のことです。\n\n$game_concept_merchant_patron$の印章が押された$game_concept_charter$の$game_concept_artifacts$を所持している$game_concept_merchants$は以下を利用できます：\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $abuse_charter_authority_decision$#!#!」\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $benevolent_charter_authority_decision$#!#!」\n$EFFECT_LIST_BULLET$[interaction|E]「#EMP #V $leverage_charter_authority_interaction$#!#!」"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "「$game_concept_make_a_request$」は、[merchant_patron|E]に対して援助や支援、その他の後援を求めるために用いられる[interaction|E]です。"
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "$game_concept_request_contract_change$とは、[vassal|E]、[tributary|E]、または[client|E]が自らの[liege|E]や[suzerain|E]への義務を再交渉するために用いる[interaction|E]のことです。"
 game_concept_leading_title: "主導称号"
 game_concept_leading_title_desc: "特定の称号を中心に構成される[trade_league|E]などの連合を率いる[title|E]です。\n\n主導称号の[holder|E]が、その連合の[trade_league_leader|E]となります。"
 game_concept_client_contract: "従属商人契約"
 game_concept_client_contracts: "従属商人契約"
 game_concept_client_contract_desc: "$game_concept_client_contracts$とは、[client|E]とその[merchant_patron|E]との間の[obligations|E]を取り決める契約のことです。\n\n交渉可能な義務は以下の4つです：後援者に支払われる[trade|E]収入の割合、後援者による[prestige|E]の後ろ盾、[trade_competitiveness|E]の支援、および交易商家の[marriages|E]の取りまとめ。\n\nこの契約は継承時に引き継がれ、交易商人が新たな[holding|E]へと自らの[company|E]を移転させない限り破棄できません。"
 game_concept_member_title: "加盟者称号"
 game_concept_member_title_desc: "特定の称号を中心に構成される[trade_league|E]などの連合に属する[title|E]です。"
 game_concept_company_sentiment: "商会方針"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "方針"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "$game_concept_company_sentiment$とは、[merchant_family_possessive|E]の行動様式や、その成員同士の互いへの態度を表すものです。\n\n複数の[company_sentiment_levels|E]が存在し、それぞれが[house|E]の成員にさまざまな利益と不利益をもたらします。\n\n$game_concept_company_sentiment$は$game_concept_company$全体の行動に応じて変化します。[company_sentiment_positive_actions|E]は一般的に$game_concept_sentiment$を[company_sentiment_concerted_i] [company_sentiment_concerted|E]の方向へと傾け、[company_sentiment_negative_actions|E]は[company_sentiment_divided_i] [company_sentiment_divided|E]の方向へと傾けます。\n\n[house_heads|E]は通常、一族の$game_concept_sentiment$に対して他の成員よりも大きな影響力を持っています。"
 game_concept_company_sentiment_level: "商会方針姿勢"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "商会方針姿勢"
 game_concept_company_sentiment_level_desc: "$game_concept_company_sentiment_level$とは、[company_sentiment|E]の現在の状態を示すものです。[company_sentiment_positive_actions|E]によって$game_concept_sentiment$が[company_sentiment_concerted_i] [company_sentiment_concerted|E]の方向へと傾くか、あるいは[company_sentiment_negative_actions|E]によって[company_sentiment_divided_i] [company_sentiment_divided|E]の方向へと傾くことで現在の姿勢が変化し、それぞれの姿勢は[house|E]の成員にさまざまな利益と不利益をもたらします。\n\n姿勢には以下の5種類が存在します：\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i] [company_sentiment_divided|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i] [company_sentiment_fractious|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i] [company_sentiment_independent|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i] [company_sentiment_cooperative|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i] [company_sentiment_concerted|E]"
 game_concept_company_sentiment_divided: "拝金主義"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "打算"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "中庸"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "栄達志向"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "貴族化"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"
 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"
 game_concept_company_sentiment_divided_desc: "$game_concept_company_sentiment_divided$の[company_sentiment_level|E]は最も競争的な姿勢です。[company|E]がこの姿勢をとると、一族のすべての成員が、たとえ互いの足を引っ張りあうことになろうとも利益を最優先するようになります。\n\n#bold この$game_concept_company_sentiment_level$による効果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#N -20#!\n$EFFECT_LIST_BULLET$[merchant_patron|E]の好感度：#P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i] [competitiveness|E]：#P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_regional_networks_decision$#!#!」"
 game_concept_company_sentiment_fractious_desc: "$game_concept_company_sentiment_fractious$の[company_sentiment_level|E]は[rapacious|E]に次いで競争性の高い姿勢です。[company|E]がこの姿勢をとると、成員は一族の義務よりも個人の利益を優先するようになります。\n\n#bold この[company_sentiment_level|E]による効果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i] [competitiveness|E]：#P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_establish_network_decision$#!#!」"
 game_concept_company_sentiment_independent_desc: "$game_concept_company_sentiment_independent$の[company_sentiment_level|E]は中間的な姿勢です。[company|E]がこの姿勢をとると、一族には依然として看板となる人物が必要であるものの、成員は干渉や批判を受けることなく、自らの事業を自由に進めることができます。\n\n#bold この[company_sentiment_level|E]による効果：#!\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_consult_house_decision$#!#!」"
 game_concept_company_sentiment_cooperative_desc: "$game_concept_company_sentiment_cooperative$の[company_sentiment_level|E]は[ennobled|E]に次いで正統性を重視した姿勢です。[company|E]がこの姿勢をとると、商会の評判とその成員の評判は表裏一体となり、各々の成員は自らの社会的地位だけでなく、外聞の向上にも努めなければなりません。\n\n#bold この[company_sentiment_level|E]による効果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$：#P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$：#P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_merchant_prosperity_decision$#!#!」\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_merchant_bailiffs_decision$#!#!」"
 game_concept_company_sentiment_concerted_desc: "$game_concept_company_sentiment_concerted$の[company_sentiment_level|E]は最も正統性を重視した姿勢です。[company|E]がこの姿勢をとると、義務と敬意から生じる忠誠心によって全体の利益が家長の利益と固く結びつき、商会は貴族の家系と肩を並べることができます。\n\n#bold この[company_sentiment_level|E]による効果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$：#P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_family_business_decision$#!#!」\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_merchant_prosperity_decision$#!#!」\n$EFFECT_LIST_BULLET$[decision|E]「#EMP #V $unity_merchant_bailiffs_decision$#!#!」"
 game_concept_company_sentiment_positive_actions: "正統化活動"
 game_concept_company_sentiment_positive_actions_desc: "[company|E]による正統化活動は、[company_sentiment|E]を[company_sentiment_concerted_i] [company_sentiment_concerted|E]の方向へと傾けます。\n\n[house_heads|E]は[decision|E]「#V $unity_merchant_promote_excess_decision$#!」を使用して、[company_sentiment|E]を[company_sentiment_concerted_i] [company_sentiment_concerted|E]の方向に大きく傾けることができます。\n\n#weak $game_concept_company_sentiment_positive_actions$の例：$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "利益追求活動"
 game_concept_company_sentiment_negative_actions_desc: "[company|E]による利益追求活動は、[company_sentiment|E]を[company_sentiment_divided_i] [company_sentiment_divided|E]の方向へと傾けます。\n\n[house_heads|E]は[decision|E]「#V $unity_merchant_promote_diligence_decision$#!」を使用して、[company_sentiment|E]を[company_sentiment_divided_i] [company_sentiment_divided|E]の方向に大きく傾けることができます。\n\n#weak $game_concept_company_sentiment_negative_actions$の例：$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$一族と貴族間の$arrange_marriage_interaction$\n$EFFECT_LIST_BULLET$$gift_artifact_interaction$\n$EFFECT_LIST_BULLET$商会員からの依頼を完了する\n$EFFECT_LIST_BULLET$$pay_ransom_interaction$\n$EFFECT_LIST_BULLET$$offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$$restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$$abandon_hook_interaction$\n$EFFECT_LIST_BULLET$$fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$$propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$他の交易商家との$arrange_marriage_interaction$\n$EFFECT_LIST_BULLET$商会に招待する\n$EFFECT_LIST_BULLET$商会員からの依頼に失敗する\n$EFFECT_LIST_BULLET$$merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$$declare_war_interaction$\n$EFFECT_LIST_BULLET$$imprison_interaction$\n$EFFECT_LIST_BULLET$$move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$$disinherit_interaction$\n$EFFECT_LIST_BULLET$$denounce_interaction$\n$EFFECT_LIST_BULLET$$expose_secret_interaction$\n$EFFECT_LIST_BULLET$$blackmail_interaction$\n$EFFECT_LIST_BULLET$$break_betrothal_interaction$"
 game_concept_republican_army: "共和国軍"
 game_concept_republican_armies: "共和国軍"
 game_concept_republican_army_desc: "$game_concept_republican_army$とは、[republican|E]の[government|E]を持つ[realm|E]によって編成・維持される[army|E]のことです。\n\nこの[army|E]は[title_men_at_arms|E]のみで構成され、[liege|E]の座にあるキャラクターの指揮下に置かれます。"
 REPUBLICAN_ARMY_CONCEPT: "[republican_army|E]"
 REPUBLICAN_ARMY_CONCEPT_NO_TOOLTIP: "$game_concept_republican_army$"
 REPUBLICAN_ARMIES_CONCEPT: "[republican_armies|E]"
 REPUBLICAN_ARMIES_CONCEPT_NO_TOOLTIP: "$game_concept_republican_armies$"
