l_japanese:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "叙任権をめぐる紛争"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "あなたの勝利により、[defender.GetShortUIName]とその陣営は、聖職者の任命をめぐるあなたの立場を受け入れざるを得ない。"
 pam_investiture_conflict_cb_victory_desc_defender: "[attacker.GetShortUIName|U]の勝利により、あなたと支持者たちは、聖職者の任命をめぐる相手側の立場を受け入れざるを得ない。"
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U]が勝利し、[defender.GetShortUIName]とその陣営は、聖職者の任命をめぐる[attacker.GetShortUIName]の立場を受け入れざるを得ない。"
 pam_investiture_conflict_cb_white_peace_desc: "聖職者の任命をめぐる紛争は決着がつかないまま終わり、どちらの陣営も譲歩しなかった。"
 pam_investiture_conflict_cb_defeat_desc_attacker: "あなたの敗北により、あなたと支持者たちは、聖職者の任命をめぐる[defender.GetShortUIName]の立場を受け入れざるを得ない。"
 pam_investiture_conflict_cb_defeat_desc_defender: "あなたが勝利し、[attacker.GetShortUIName]とその陣営は、聖職者の任命をめぐるあなたの立場を受け入れざるを得ない。"
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U]が勝利し、[attacker.GetShortUIName]とその陣営は、聖職者の任命をめぐる[defender.GetShortUIName]の立場を受け入れざるを得ない。"
 msg_pam_investiture_conflict_cb_invalidated_message: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終結したため、叙任権をめぐる紛争はもはや成立しない。"
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "叙任権会議はまだ#EMP 招集されていない#!"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "譲歩を強いられる"
 pam_investiture_conflict_forced_stance_tt: "叙任権をめぐる紛争に敗れたため、来たる会議では、聖職者の任命をめぐる勝者の立場に従わなければならない。"
