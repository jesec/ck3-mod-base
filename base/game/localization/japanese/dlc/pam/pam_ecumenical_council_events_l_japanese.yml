 ecumenical_council_events.0011.desc.outro: "主催者である[host.GetTitledFirstName]が高らかに宣言する。\n\n「[ec_debate_topic_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]"
 ecumenical_council_events.0011.desc.permit: "の容認を提案する」"
 ecumenical_council_events.0011.desc.prohibit: "の禁止を提案する」"
 ecumenical_council_events.0011.desc.learn: "の認知を提案する」"
 ecumenical_council_events.0011.desc.make_core: "を中核の教義とし、[core_tenet_to_swap.GetName(ROOT.GetCharacter.GetRite)]の置き換えを提案する」"
 ecumenical_council_events.0011.a: "変革に賛成する。"
 ecumenical_council_events.0011.b: "反対だ。"
