 ecumenical_council_events.0104.oppose: "[lead_conservative.GetFirstNameNoTooltip]とともに変革に反対する。"
 ecumenical_council_events.0104.oppose_duel: "[lead_innovator.GetFirstNameNoTooltip]に警告する。一族を分裂させてはならない。"
