 # ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "白髪頭の不平家たち"
 ecumenical_council_events.0111.desc: "白髪頭の年長者たちが、言い争いながら辺りをうろついている。\n\n「我々はこれまでいくつもの公会議に参加してきたが、そのすべてで過ちが犯されてきた。そのような歪みを正すどころか、さらに増やそうとしているようだ！」と[lead_conservative.GetTitledFirstName]が不平を漏らす。\n\n「この年老いた[lead_conservative.Custom('RegionalFarmAnimal')]め！お前は前回も同じようなことを言っていた。墓に入るまで文句を言い続けるつもりだろう！」[lead_innovator.GetTitledFirstName]が怒鳴り返す。"
 ecumenical_council_events.0111.support: "この変革が古い過ちを正すのだ！"
 ecumenical_council_events.0111.support_duel: "年配にも分かるよう、賛成の論拠を説き直す。"
 ecumenical_council_events.0111.support_duel.success: "彼らが不平を言いつつも受け入れる"
 ecumenical_council_events.0111.support_duel.success_halved: "数人が改正を受け入れる"
 ecumenical_council_events.0111.support_duel.failure: "彼らが「曲解だ！」と主張し続ける"
 ecumenical_council_events.0111.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip]を支持する。もう愚行はたくさんだ。"
 ecumenical_council_events.0111.oppose_duel: "老いた夢想家たちを論破し、跡形もなく打ち砕く！"
 ecumenical_council_events.0111.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派が折れる"
