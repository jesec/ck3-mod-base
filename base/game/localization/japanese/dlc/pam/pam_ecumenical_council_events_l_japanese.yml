 ecumenical_council_events.0106.t: "忠誠の義務"
 ecumenical_council_events.0106.desc: "私は封臣たちと共に、ひとつの部屋に集った。\n\n「ここでも、お前たちが従うべきは主君だ」と[lead_conservative.GetTitledFirstName]が他の者たちに釘を刺す。「我らの[ROOT.Char.GetTitleAsName]がこの異端的な革新に賛成しないのなら、お前たちも口を閉ざさねばならぬ」\n\n「我らの[ROOT.Char.GetTitleAsNamePossessiveNoTooltip]は、ほかの場所では我々を従わせている。だが、ここでは違う！」[lead_innovator.GetTitledFirstName]が言い返す。"
 ecumenical_council_events.0106.desc_innovator: "私は封臣たちと共に、ひとつの部屋に集った。\n\n「主君には答えるべきだ」と[lead_conservative.GetTitledFirstName]が言う。「残念ながら、この問題は[ROOT.Char.GetHerHim]の手に余るのではないかと思う。[lead_conservative.GetFaith.HighGodName]だけが我らの心を導き、我らが決して踏み外してはならぬ一線を定めるのだ！」\n\n「だが我らの[ROOT.Char.GetTitleAsNamePossessiveNoTooltip]の望みは、[ROOT.Char.GetFaith.HighGodNamePossessive]に背くものではない」と[lead_innovator.GetTitledFirstName]が答える。「誓いを思い出し、[ROOT.Char.GetHerHis]の知恵に耳を傾けよ！」"
 ecumenical_council_events.0106.support: "「[ROOT.Char.GetTitleAsNameNoTooltip]たる私は、[ROOT.Char.GetFaith.HighGodName]の代理人である」"
 ecumenical_council_events.0106.support_duel: "封臣たちが誓った忠誠を求める。"
 ecumenical_council_events.0106.support_duel.success: "彼らがあなたに従う"
 ecumenical_council_events.0106.support_duel.success_halved: "数人があなたに従うことに同意する"
 ecumenical_council_events.0106.support_duel.failure: "封臣たちが[lead_conservative.GetFaith.HighGodName]にのみ忠誠を捧げる"
 ecumenical_council_events.0106.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip]を支持する。これは主君の力が及ぶところではない。"
 ecumenical_council_events.0106.oppose_duel: "主君の望みが神に背くものではないと主張する。"
 ecumenical_council_events.0106.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派が折れる"
