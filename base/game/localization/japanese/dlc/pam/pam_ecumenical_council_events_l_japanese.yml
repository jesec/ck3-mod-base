l_japanese:
 ecumenical_council_events.0001: "[my_location.GetBaronyNameExplicitlyNoTooltip]公会議"
 ecumenical_council_events.0001.desc_intro: "この日のため、[my_location.GetBaronyNameExplicitly]の[ROOT.Char.GetFaith.HouseOfWorshipPlural]は美しく飾り立てられている。キリスト教世界の錚々たる者たちが、"
 ecumenical_council_events.0001.host: "私の呼びかけに応じて集うのだ。"
 ecumenical_council_events.0001.dislikes_host: "[host.Custom('InsultAdjective')][host.GetTitledFirstNamePossessive]の呼びかけに応じて集うのだ。"
 ecumenical_council_events.0001.likes_host: "[host.Custom('ComplimentAdjective')][host.GetTitledFirstNamePossessive]の呼びかけに応じて集うのだ。"
 ecumenical_council_events.0001.neutral: "[host.GetTitledFirstNamePossessive]の呼びかけに応じて集うのだ。"
 ecumenical_council_events.0001.intent_arrived: "\n\nそして早くも、集まった人々の中に[intent_target.GetTitledFirstName]の姿を見つけた。完璧だ！"
 ecumenical_council_events.0001.waiting_for_intent: "\n\n[intent_target.GetTitledFirstName]が姿を現すのも時間の問題だ…"
 ecumenical_council_events.0001.no_intent_target: "\n\nあとは彼らが到着するのを待つだけだ！"
 ecumenical_council_events.0001.a.bad: "仕方ない、始めよう。"
 ecumenical_council_events.0001.a.good: "聖なる務めを果たすとしよう。"
 ecumenical_council_events.0002.t: "召集"
 ecumenical_council_events.0002.desc_intro: "[host.GetFaith.HouseOfWorship]の扉が開いた。いよいよ我らの偉業が始まる。それに備えるため、"
 ecumenical_council_events.0002.reformist: "王と聖職者の隔てなく、同盟を結ぶべき時である。"
 ecumenical_council_events.schism_crisis_intro: "\n\n交わされる挨拶こそ穏やかだが、両陣営の間に流れる沈黙は冷ややかだ。ローマとコンスタンティノープルはもはや礼節を交わすこともない。癒やされぬままの争い一つ一つが、キリストの一なる御体に亀裂を生じさせている。"
 ecumenical_council_events.0002.first_tenet: "\n\nあたりは話し声で満ちている。召集された者たちが、[ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]やその他の差し迫った問題について、それぞれの立場を固め始めた。"
 ecumenical_council_events.0002.host: "\n\n私は両手を広げ、我が子らを迎え入れる。この重大な使命に、ともに立ち向かうために。"
 ecumenical_council_events.0002.guest: "\n\n「我が子らよ、ようこそ。主がこの重大な使命において我らを導かれますように！」[host.GetTitledFirstName]が我らを前へと手招きした。"
 ecumenical_council_events.0002.a: "アーメン。"
 ecumenical_council_events.0010.t: "[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]に対する我々の立場 "
 ecumenical_council_events.0010.desc.intro: "最初の議題は[ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]をめぐるものだ。現在の教会法は、「[host.Custom('GetEcumenicalDebateTenet1StatusText')|l]」として位置づけている。[lead_portrait.GetTitledFirstName]が口火を切った。\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n「ますます多くの人々が、これを崇拝の中心に据えています」と、[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )]の[court_chaplain.GetFirstName]が報告する。"
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n「慣習を禁じるのには危険が伴いますが、今回はその危険を冒すだけの十分な理由があります」と、[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )]の[court_chaplain.GetFirstName]が請け合う。"
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n「この慣習はいまだに広く行われています。これを非難することには…ある程度の危険が伴います」と、[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )]の[court_chaplain.GetFirstName]が懸念を示す。"
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n「この慣習は廃れつつあります。支持を撤回するには、ちょうどよい時機です」と、[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )]の[court_chaplain.GetFirstName]が進言する。"
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n「この慣習は広まりつつあります。支持することを検討するのが賢明でしょう」と、[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )]の[court_chaplain.GetFirstName]が提案する。"
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n「この慣習はほとんど知られていません。擁護するのは危険です」と、[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )]の[court_chaplain.GetFirstName]が警告する。"
 ecumenical_council_events.0010.desc.fallback.explanation: "「これは我々がいまだに明確な答えを出していない教えです。今、この会議に審議が委ねられています」"
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "「[ROOT.Char.GetFaith.HighGodName]の平和と休戦を維持すべきかが問われています。教会や聖職者、武器を持たぬ者を略奪や流血から守るため、民に誓いを立てさせるべきでしょうか？聖なる時期には、[ROOT.Char.GetFaith.GetAdjective]教会の禁令に背けば罰を受けるものとして、誰にも武器を取らせないことができるでしょうか？」"
 ecumenical_council_events.0010.desc.dulia.explanation: "「聖人を厚く崇敬すべきかが問われています。聖人の聖遺物を神聖なものとして扱い、その祝祭日を守り、その執り成しを求めながら、礼拝はなお[ROOT.Char.GetFaith.HighGodName]だけに捧げることはできるのでしょうか？」"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "「司祭による聖別によって、祭壇上のパンとワインが本当にキリストの御体と御血に変わるのかが問われています」"
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "「聖なる生活において、祈りと労働を一体のものとすべきかが問われています。怠惰は魂の敵なのでしょうか？畑や写字室での労働も、[ROOT.Char.Custom('GetReligiousRite')]の祈祷時課と同じように尊ばれるべきでしょうか？」"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "「聖なる母マリア、すなわち神の母を、他のすべての聖人よりも篤く崇敬すべきかが問われています」"
 ecumenical_council_events.0010.desc.simony.explanation: "「聖職や祝福、秘跡を金で売買してよいのかが問われています」"
 ecumenical_council_events.0010.desc.monophysitism.explanation: "「キリストにはただ一つの本性、すなわち完全に神的な本性だけがあり、人性は神性に呑み込まれ、受肉した御言葉には神性しか残っていないのかが問われています」"
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "「[ROOT.Char.GetFaith.GetAdjective]教会は『使徒言行録』にあるように生きるべきなのかが問われています。宣教師を送り出し、使徒的熱意をもって、いまだ闇の中にいる者たちへ御言葉を伝えるべきでしょうか？」"
 ecumenical_council_events.0010.desc.purgatory.explanation: "「地獄に堕ちてもおらず、まだ清められてもいない魂が、死後に清められるのかが問われています。生者の祈りや儀式は、その魂が[ROOT.Char.GetFaith.HighGodName]にまみえる前に、助けとなるのでしょうか？」"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "「子をもうけることが神聖な務めなのかが問われています。信徒は子孫を増やし、大地を満たすべきでしょうか？」"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "「司教の権威は、本当に使徒から途切れることなく受け継がれたものなのかが問われています」"
 ecumenical_council_events.0010.desc.confession.explanation: "「すべての[ROOT.Char.GetFaith.GetAdherentName]は、赦しを得るために司祭に罪を告白すべきかが問われています。告解の秘密は決して破られてはならないのでしょうか？」"
 ecumenical_council_events.0010.desc.original_sin.explanation: "「すべての魂がアダムの罪を受け継いでいるのかが問われています。我らは生まれながらに罪に染まり、洗礼の恩寵を必要とするのでしょうか？」"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "「聖なる天使たちは[ROOT.Char.GetFaith.HighGodName]の下で秩序ある位階を成し、それぞれの位階が次の位階の上位にあるのでしょうか？[ROOT.Char.GetFaith.GetAdjective]教会の役職も、天上の秩序に倣うべきでしょうか？」"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "「信徒はキリストの兵士となるべきかが問われています。召されたときには剣を取り、[ROOT.Char.GetFaith.GetAdjective]教会を守る義務があるのでしょうか？」"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "「信仰は理性による理解を求めてもよいのかが問われています。学問の場では弁証法と哲学を用い、教義を体系立て、擁護すべきでしょうか？」"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "「キリストは、その人性において、[ROOT.Char.GetFaith.HighGodName]の養子とされたのかが問われています」"
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "「隣人愛は、相手が見知らぬ者や敵であっても、[ROOT.Char.GetFaith.HighGodName]への愛を測る確かな基準として、すべての[ROOT.Char.GetFaith.GetAdherentName]を結びつけるべきかが問われています」"
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "「歌、香、定められた儀式を伴う[ROOT.Char.Custom('GetReligiousRite')]が、信徒が[ROOT.Char.GetFaith.HighGodName]に近づけるための主要な道なのかが問われています」"
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "「キリストにおいて神性と人性は、分かたれることも混じり合うこともなく、一つの受肉した本性であるのかが問われています」"
 ecumenical_council_events.0010.desc.hesychasm.explanation: "「聖なる静寂と、絶え間なく繰り返される素朴な心の祈りによって、魂は[ROOT.Char.GetFaith.HighGodNamePossessive|U]の創られざる光を見ることができるのかが問われています」"
 ecumenical_council_events.0010.desc.anachoresis.explanation: "「世から退くことは聖なることなのかが問われています。隠者の孤独は[ROOT.Char.GetFaith.HighGodName]へ至る真の道なのでしょうか？」"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "「断食、粗布、鞭打ちによって肉体を厳しく律するとき、霊が豊かになるのかが問われています」"
 ecumenical_council_events.0010.desc.holy_myron.explanation: "「神聖な[Glossary( '聖香油', 'CHRISM_GLOSS' )]によって、洗礼と戴冠に聖霊の賜物を示す印を施すべきかが問われています」"
 CHRISM_GLOSS: "ギリシャ語で「塗油」を意味する、香りのよい聖なる油。司教によって聖別された#bold 聖香油#!は、洗礼や堅信、時には王の戴冠式で信徒に塗られる。"
 ecumenical_council_events.0010.desc.khachkar.explanation: "「彫刻を施した石の十字架を、信仰を示す恒久的な公の証として我らの間に立て、聖地や死者の標とすべきかが問われています」"
 ecumenical_council_events.0010.desc.philanthropia.explanation: "「貧者の救済は[ROOT.Char.GetFaith.GetAdjective]教会の果たすべき義務なのかが問われています。施しを行い、病院や慈善の家を設けるべきでしょうか？」"
 ecumenical_council_events.0010.desc.aniconism.explanation: "「すべての聖像を教会から取り除くべきかが問われています。聖像を崇敬することは、本当にこの世の像を偶像として崇め、我らの目と心を[ROOT.Char.GetFaith.HighGodName]から遠ざける行いなのでしょうか？」"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "「聖書に隠された霊的な意味を読み解くべきかが問われています。ギリシャの学問と寓意によって、文字だけでは覆い隠されているものを明らかにできるでしょうか？」"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "「十字架を取り、聖なる目的のために進軍すること自体が、キリストに対する献身になるのかが問われています。剣によって巡礼者を守り、不信心者の手にあるものを取り戻すべきでしょうか？」"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "「肉体の快楽は魂を神聖なものへ近づけるのかが問われています。欲望は罪として避けるのではなく、尊び、追い求めるべきでしょうか？」"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "「[ROOT.Char.GetFaith.HighGodName]の下で、信仰と民は一つなのかが問われています。外部の者は真の群れの外に留めるべきでしょうか？」"
 ecumenical_council_events.0010.desc.communion.explanation: "「聖なる儀式を共に行うことによって[ROOT.Char.GetFaith.HighGodName]の臨在を呼び起こせるのかが問われています。我らと儀式を共にしようとしない者は、真の群れの外にあるとみなすべきでしょうか？」"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "「死が近づいたとき、最後の霊的な清めがあらゆる罪を洗い流せるのか、そして清められた者は罪が戻らぬよう食を断ち、生を拒むべきなのかが問われています」"
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "「結婚は神聖な血統の内に留め、[ROOT.Char.GetFaith.GetAdjective]教会が禁じるほど近い血縁者同士でさえ認めるべきかが問われています」"
 ecumenical_council_events.0010.desc.gnosticism.explanation: "「救済は、秘儀を授けられた者だけに明かされる隠された知識にあり、それによって神の火花が解き放たれ、その源へと帰るのかが問われています」"
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "「修道士は何も所有すべきでないのかが問われています。彼らは町から町へとさすらい、施しを受けて暮らしながら、[ROOT.Char.GetFaith.HighGodName]の御言葉を説くべきでしょうか？」"
 ecumenical_council_events.0010.desc.pacifism.explanation: "「[ROOT.Char.GetFaith.GetAdherentName]の生において、剣に居場所はないのかが問われています。『正当な戦争』という考えは誤りなのでしょうか？」"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "「[ROOT.Char.GetFaith.GetAdjective]教会は、五つの総主教座が合議して統治すべきなのかが問われています。これは[ROOT.Char.GetFaith.HighGodNamePossessive]の首席代祷者の首位権を否定することになるのでしょうか？」"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "「迫害や苦難、疑念の中でも信仰を曲げずに守るべきかが問われています。どれほどの犠牲を払おうとも、我々は揺るがず立つべきなのでしょうか？」"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "「使徒たちのように清貧の誓いを立てることで、[ROOT.Char.GetFaith.HighGodName]に最もよく仕えることができるのかが問われています」"
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "「群れをそのままにして、自らの道を歩ませるべきかが問われています。[ROOT.Char.GetFaith.GetAdjective]教会は外部の者に干渉せず、その介入も招くべきではないのでしょうか？」"
 ecumenical_council_events.0010.desc.adaptive.explanation: "「我々の慣習と禁令を普遍的に守らせようとすることは、群れを害するのかが問われています。信仰の核心が変わらない限り、信徒が生きていかなければならない世界に合わせて、法を変えてもよいのでしょうか？」"
 ecumenical_council_events.0010.desc.esotericism.explanation: "「[ROOT.Char.GetFaith.HighGodName]の神秘は、我々に世界の知識を求めるよう促しているのかが問われています」"
 ecumenical_council_events.0010.desc.legalism.explanation: "「聖なる法が、[ROOT.Char.GetFaith.GetAdjective]の生活のあらゆる行為を律するべきかが問われています。どれほど高貴な身分であろうと、どれほど尊大であろうと、いかなる罪人も我らの法の上に立つことはできないのでしょうか？」"
 ecumenical_council_events.0010.desc.literalism.explanation: "「聖典は不変かつ完全で、[ROOT.Char.GetFaith.HighGodNamePossessive]の知恵を収める唯一のものなのかが問われています」"
 ecumenical_council_events.0010.desc.reincarnation.explanation: "「魂は一度だけ[ROOT.Char.GetFaith.HighGodNamePossessive]の裁きを受けるのではなく、幾度もの生を巡るのかが問われています」"
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "「[ROOT.Char.GetFaith.GetAdjective]教会の神学者が、信仰や法に関して新たな問題が生じるたびに、拘束力のある裁定を下してよいのかが問われています」"
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "「[ROOT.Char.GetFaith.GetAdjective]の生き方は、苦闘と服従を中心に形作られるべきなのかが問われています。信徒は[ROOT.Char.GetFaith.HighGodNamePossessive|U]の意志に完全に従わなければならないのでしょうか？」"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "「[ROOT.Char.GetFaith.GetAdherentName]は迫害下で別の信仰を装ってよいのかが問われています」"
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "「非信徒が、保護の対価として税を支払うことで[ROOT.Char.GetFaith.GetAdjective]の支配下に留まってよいのかが問われています」"
 ecumenical_council_events.0010.desc.asceticism.explanation: "「飢えと困窮、そして安楽の否定を通して[ROOT.Char.GetFaith.HighGodName]を求めるべきなのかが問われています」"
 ecumenical_council_events.0010.desc.bhakti.explanation: "「それぞれの魂が愛に満ちた献身によって、神性の一面に身を委ねるべきなのかが問われています」"
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "「生きとし生けるものに対するあらゆる危害を禁じるべきなのかが問われています。取るに足らない獣や虫を傷つけることさえ避けるべきでしょうか？」"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "「[ROOT.Char.GetFaith.HighGodName]は何よりも、観想と自己理解によって求められるのかが問われています」"
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "「我々には、見知らぬ者をも食卓に迎え入れる神聖な務めがあるのかが問われています」"
 ecumenical_council_events.0010.desc.adorcism.explanation: "「この世の精霊を穢れた力として追い払うのではなく、助けてくれる存在として敬い、迎え入れるべきなのかが問われています」"
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "「祖先を敬い、祈りと供物を捧げることで、我々を見守り導いてもらうべきなのかが問われています」"
 ecumenical_council_events.0010.desc.astrology.explanation: "「[ROOT.Char.GetFaith.HighGodNamePossessive]の意志は星々から読み取れるのかが問われています。天には我々の運命の秘密が記されているのでしょうか？」"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "「快楽は、礼拝の一形態として追い求めるべき賜物なのかが問われています」"
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "「人命を祭壇に捧げてもよいのかが問われています。神聖な供物として、[ROOT.Char.GetFaith.HighGodName]のために血を流してもよいのでしょうか？」"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "「特定の魂は生まれながらに神聖な力を宿し、霊的指導者となるよう定められ、[ROOT.Char.GetFaith.GetAdjective]教会から塗油を受ける前から、すでに選ばれているのかが問われています」"
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "「信徒を結びつけるため、[ROOT.Char.GetFaith.GetAdjective]の暦を聖なる祝祭で満たすべきなのかが問われています」"
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "「出産には聖なる儀式をもって備えるべきなのかが問われています。[ROOT.Char.GetFaith.HighGodName]が母子を祝福できるよう、出産の場を清めるべきでしょうか？」"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "「森の木立や川の奔流、露に濡れた谷は聖なるものなのかが問われています。荒野でこそ[ROOT.Char.GetFaith.HighGodName]を求めるべきなのでしょうか？」"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "「太陽に祈りを向けるべきなのかが問われています。この生命を与える光こそが我らの[ROOT.Char.GetFaith.HighGodName]なのでしょうか？」"
 ecumenical_council_events.0010.desc.warmonger.explanation: "「戦争と征服そのものが聖なる務めなのかが問われています。剣こそが[ROOT.Char.GetFaith.HighGodName]の御言葉を広める最も確かな手段なのでしょうか？」"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "「聖日を血と残酷な見世物で祝ってよいのかが問われています。このような狂騒は[ROOT.Char.GetFaith.HighGodName]への真の礼拝になるのでしょうか？」"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "「高き所や大地の深奥が聖なるものなのかが問われています。山頂に立ち、人知れぬ石の小道を辿って[ROOT.Char.GetFaith.HighGodName]を求めるべきなのでしょうか？」"
 ecumenical_council_events.0010.desc.household_gods.explanation: "「炉辺や家の神々を、[ROOT.Char.GetFaith.GetAdjective]の家庭で祀り、敬ってもよいのかが問われています」"
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "「遥かな東方の儀式や教典を我々の信仰に織り込んでもよいのかが問われています」"
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "「互いを悪と決めつけることなく隣り合って生きる東方の信仰から、その神々を共有していない我々が学んでもよいのかが問われています」"
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "「新たな改宗者の古くからの民間習慣を打ち倒して非難するのではなく、静かに学ぶ対象としてそのまま残して良いのかが問われています」"
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "「キリストを信仰していない者が、彼を真の神と認めなくとも、その教えと模範を敬ってよいのかが問われています」"
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "「サラセン人の法を[ROOT.Char.GetFaith.GetAdjective]教会に取り込み、その教えを福音と融合させてもよいのかが問われています」"
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "「たとえその主張をすべて共有していなくとも、ユダヤ人の律法と学問を[ROOT.Char.GetFaith.GetAdjective]教会に受け入れるべきなのかかが問われています」"
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "「苦痛そのものが聖なるものなのかが問われています。苦痛を与えることは祝福であり、苦痛を受けることは[ROOT.Char.GetFaith.HighGodName|U]からの恩寵なのでしょうか？」"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "「都市を捨てて自然の中での生活を受け入れ、原初のあり方へ立ち返ることに聖性があるのかが問われています」"
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "「生者の世界を支配することは、神聖な目的たりうるのかが問われています。権力を握ることは[ROOT.Char.GetFaith.HighGodNamePossessive]の意志にかなうのでしょうか？」"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "「死者の肉を神聖な儀式として食してもよいのかが問われています」"
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "「欺くことが聖なる行為になり得るのかが問われています。真実が信仰を危うくするとき、信徒は嘘をつき、さらには自らの嘘を信じてもよいのでしょうか？」"
 ecumenical_council_events.0010.desc.polyamory.explanation: "「信徒は、一人の魂がもう一人の愛情を独占できるという考えを捨てて、多くの者と愛を分かち合ってもよいのかが問われています」"
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "「人命を神聖な儀式で捧げてもよいのかが問われています。自ら望む者は自らを、罪ある者は生贄として、[ROOT.Char.GetFaith.GetAdjective]の祭壇に捧げてもよいでしょうか？」"
 ecumenical_council_events.0010.desc.megaliths.explanation: "「[ROOT.Char.GetFaith.HighGodNamePossessive]の栄光のために、巨大な石の記念碑を建てるべきなのかが問われています」"
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "「信徒はすべての財産を共有すべきなのかが問われています」"
 ecumenical_council_events.0010.desc.pure_land.explanation: "「苦しみのない祝福された境地には、富や学問、儀式の熟達ではなく、信頼と献身だけで至ることができるのかが問われています」"
 ecumenical_council_events.0010.desc.no_mind.explanation: "「[ROOT.Char.GetFaith.HighGodName]を、心を空にし自己を静めることによって求めるべきなのかが問われています」"
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "「高き所は、真に高く、そして聖なるものなのかが問われています。[ROOT.Char.GetFaith.HighGodName]は山頂でこそ求められるべきなのでしょうか？」"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "「この時代が暗くなり、悪魔が敬虔な姿を装って横行いるのかが問われています。衰えゆく聖なる法を守るため、そのような敵を討ち滅ぼすべきなのでしょうか？」"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "「討ち取った敵の首を、神聖な戦利品として持ち帰るべきなのかが問われています」"
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "「知識を求めることは神聖な務めなのかが問われています」"
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "「公正な統治は、[ROOT.Char.GetFaith.GetAdjective]の君主が守るべき神聖な務めなのかが問われています」"
 ecumenical_council_events.0010.desc.filial_piety.explanation: "「両親や年長者を敬うことが、[ROOT.Char.GetFaith.HighGodName]によって定められているのかが問われています」"
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "「社会の調和、すなわちそれぞれの魂があるべき場所にあることが、[ROOT.Char.GetFaith.GetAdjective]の秩序の核心であるのかが問われています」"
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "「破壊そのものが聖なるものになり得るのかが問われています。古いものを打ち壊すことこそ、[ROOT.Char.GetFaith.HighGodName]が我々に求めていることなのでしょうか？」"
 ecumenical_council_events.0010.desc.preservation.explanation: "「建造物を築き、守ることに聖性があるのかが問われています。[ROOT.Char.GetFaith.GetAdjective]の神殿や建造物を手入れし、永遠に栄えさせるべきなのでしょうか？」"
 ecumenical_council_events.0010.desc.takamin.explanation: "「強大な熊は神性の器なのかが問われています。狩りにおいては、その偉大な獣を神聖なものとして敬い、殺める際にも聖なる敬意を払うべきでしょうか？」"
 ecumenical_council_events.0010.a_1: "[current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]を置き換える。"
 ecumenical_council_events.0010.a_2: "[current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]を排除して空きを作ろう。"
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]は廃止すべきだ。"
 ecumenical_council_events.0010.b: "その慣習を禁じよ！"
 ecumenical_council_events.0010.c: "現状は認めておくことにしよう。"
 ecumenical_council_events.0010.d: "この信条については、少なくとも認めはしよう。"
