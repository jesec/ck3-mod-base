 ecumenical_council_events.0104.t: "血族の聖職者たち"
 ecumenical_council_events.0104.desc: "一族の聖職者たちが、[ROOT.Char.GetHouse.GetName]家がどちらに肩入れすべきかを話し合っている。[lead_conservative.GetTitledFirstName]が「一族が公然と分裂するようなことは避けるべきだ。私は[host.GetTitledFirstName]には与しない！」と言う。\n\n[lead_innovator.GetTitledFirstName]は[lead_conservative.GetTitledFirstNamePossessiveNoTooltip]の背後で嘲るような仕草をし、一族全員が変革に反対しているわけではないことを示している。"
 ecumenical_council_events.0104.support: "[ROOT.Char.GetHouse.GetNameNoTooltip]家に賛成の立場を取るよう呼びかける。"
 ecumenical_council_events.0104.support_duel: "変革を拒む者たちを説得する。"
 ecumenical_council_events.0104.support_duel.success: "あなたの一族は賛成の立場を取る"
 ecumenical_council_events.0104.support_duel.success_halved: "数人が賛成の立場を取る"
