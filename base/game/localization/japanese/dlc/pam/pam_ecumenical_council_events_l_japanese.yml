 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetNameNoTooltip]の気質"
 ecumenical_council_events.0105.desc: "ここでは多くの言語が交わされているが、その中でも特に聞き慣れた[ROOT.Char.GetCulture.GetLanguage.GetName]が際立っている。もちろん、[lead_conservative.GetTitledFirstName]が我が一族にしつこく言い立てているのだ。\n\n「我々[lead_conservative.GetCulture.GetCollectiveNounNoTooltip]は、そのような革新など望まぬ！」[lead_conservative.GetSheHe]が激しくまくし立てる。\n\n「だが、教会が立ち止まったままであることを、我々のせいにされてもよいのか？」[lead_innovator.GetTitledFirstName]が問いただす。"
 ecumenical_council_events.0105.support: "[lead_conservative.GetFirstNameNoTooltip]、あなたは我々全員を代表しているわけではない。"
 ecumenical_council_events.0105.support_duel: "我々[lead_conservative.GetCulture.GetCollectiveNounNoTooltip]には革新の歴史がある。"
 ecumenical_council_events.0105.support_duel.success: "居合わせた全員が賛成の立場を取ることに同意する"
 ecumenical_council_events.0105.support_duel.success_halved: "数人が賛成の立場を取ることに同意する"
 ecumenical_council_events.0105.support_duel.failure: "彼らが依然として革新を拒む"
 ecumenical_council_events.0105.oppose: "[ROOT.Char.GetCulture.GetNameNoTooltip]の伝統を支持しよう！"
 ecumenical_council_events.0105.oppose_duel: "伝統を擁護する。"
