 pam_ecumenical_council_roman_guests_custom: "公会議に出席している[GetRiteByKey('roman_rite').GetAdherentName]の客人すべて"
 pam_ecumenical_council_greek_guests_custom: "公会議に出席している[GetRiteByKey('byzantine_rite').GetAdherentName]の客人すべて"
 pam_ecumenical_council_overruled_guests_custom: "意見を聞かれることなく、意に反する裁定に一方的に従わされた流派の客人"
 pam_rite_quarrel_championed_opinion: "公会議で私の流派の側についた"
 pam_rite_quarrel_slighted_opinion: "公会議で私の流派と対立する流派の側についた"
 pam_rite_quarrel_overruled_opinion: "公会議で私の流派の主張を退けた"
 ecumenical_council_summons_events.0060.t: "同輩中の第一者"
 ecumenical_council_summons_events.0060.desc: "[GetRiteByKey('roman_rite').GetName]を代表する[ec_roman_champion.GetTitledFirstName]は、一歩も引き下がらない。\n\n「すべての教会がローマに従うのだ。ローマは何者にも従わぬ！」\n\n[ec_greek_champion.GetTitledFirstName]は指を折りながら5人の総主教を数え上げる。\n\n「このうちの一体誰が、ひざまずいたことがあると？」"
 ecumenical_council_summons_events.0060.a: "「二人とも落ち着きたまえ。会議はまだ始まってもいない」"
 ecumenical_council_summons_events.0060.a.success: "議場が二派に分断される前に、二人を落ち着かせる。"
 ecumenical_council_summons_events.0060.a.failure: "二人とも耳を貸さず、議場が二派に分断される"
 ecumenical_council_summons_events.0060.b: "天国の鍵はペトロに授けられ、今はローマが握っている。"
 ecumenical_council_summons_events.0060.c: "ローマは同輩中の第一者に過ぎない。"
 ecumenical_council_summons_events.0060.d: "この場を仕切るのは私だ。議論は打ち切りとする。"
 ecumenical_council_summons_events.0061.t: "聖霊は子からも発する"
 ecumenical_council_summons_events.0061.desc: "「二語足されている」[GetRiteByKey('byzantine_rite').GetName]の[ec_greek_champion.GetTitledFirstName]が言う。「[GetRiteByKey('roman_rite').GetAdherentNamePlural]が東方に断りもなく、基本信条に密かに書き加えたのだ」\n\n「真理を述べるのに、誰かの許可など必要ない。神の許しがあればそれでよいのだ」[ec_roman_champion.GetTitledFirstName]が返す。"
 ecumenical_council_summons_events.0061.a: "基本信条はこれより苛烈な争いも乗り越えてきた。"
 ecumenical_council_summons_events.0061.a.success: "決定的な対立へと発展する前に、議論を鎮める"
 ecumenical_council_summons_events.0061.a.failure: "議論が双方それぞれに譲れぬ教義へと変わる"
 ecumenical_council_summons_events.0061.b: "この言葉が書き加えられたのは、真実だからだ。"
 ecumenical_council_summons_events.0061.c: "基本信条を定めたのは公会議だ。変更できるのも公会議だけだ。"
 ecumenical_council_summons_events.0061.d: "基本信条の内容は私が決める。"
 ecumenical_council_summons_events.0062.t: "祭壇のパン"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName]が硬貨のように薄く白いパンを掲げて言う。\n\n「[GetRiteByKey('roman_rite').GetAdherentNamePlural]はいつの時代にもこれだけで満たされてきた」\n\n[ec_greek_champion.GetTitledFirstName]がその傍らに膨らんだパンを置いてこう尋ねる。\n\n「ならば[GetRiteByKey('byzantine_rite').GetAdherentNamePlural]は、使徒の時代からずっと間違っているとでもいうのか？」"
 ecumenical_council_summons_events.0062.a: "明日、我が祭壇でどちらのパンも祝福し、その両方を皆で食そう。"
 ecumenical_council_summons_events.0062.a.success: "両方のパンが食され、争いが収束する。"
 ecumenical_council_summons_events.0062.a.failure: "その晩、2つの祭壇が設けられ、完全に分かれて礼拝が執り行われる"
 ecumenical_council_summons_events.0062.b: "最後の晩餐と同様に、種なしパンとせよ。"
 ecumenical_council_summons_events.0062.c: "復活された主には、膨らんだパンこそふさわしい。"
 ecumenical_council_summons_events.0062.d: "パンはパンだ。大切なのは祝福である。"
 ecumenical_council_summons_events.0063.t: "言語の問題"
 ecumenical_council_summons_events.0063.desc: "祈りがラテン語で読み上げられる。[GetRiteByKey('byzantine_rite').GetAdherentNamePlural]は席で通訳されるのを待っているが、いざ訳された祈りは歪められている。[ec_greek_champion.GetTitledFirstName]が呟く。\n\n「ローマ人はまるで法律家のように論じる。饒舌だが中身がない」\n\n「ギリシャ人は哲学者のように論じるではないか。何ひとつ解決せずにな」[ec_roman_champion.GetTitledFirstName]が返す。"
 ecumenical_council_summons_events.0063.a: "ならばどちらにも通じる言葉を探そう。"
 ecumenical_council_summons_events.0063.a.success: "どちら側にも曲解されない言い回しを見つける。"
 ecumenical_council_summons_events.0063.a.failure: "双方ともに、相手が不誠実な態度で議論したと確信して立ち去る"
 ecumenical_council_summons_events.0063.b: "ラテン語で唱えよ。わかりやすい言葉でな。"
 ecumenical_council_summons_events.0063.c: "教父たちはギリシャ語で書いたのだ。努力すれば読めるはずだ。"
 ecumenical_council_summons_events.0063.d: "我が名のもと、両方の言語で唱えるものとする。異論は許さない。"
