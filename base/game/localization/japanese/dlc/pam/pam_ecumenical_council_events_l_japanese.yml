 ecumenical_council_events.0101.t: "学識者たちの議論"
 ecumenical_council_events.0101.desc: "学者たちが広間の至る所で聖句を引き合いに出し、そのたびに議論が激化している。\n\n「[lead_conservative.GetFaith.ReligiousText|U]は明確だ」と[lead_conservative.GetTitledFirstName]が主張する。「[ec_current_topic.GetName( activity.GetHost.GetRite )]は変えるべきではない」\n\n「私が引用した箇所を最初から最後まで読んでみたまえ」と[lead_innovator.GetTitledFirstName]が応じる。「変革が強く求められていることがほぼ明記されているのが分かるはずだ！」"
 ecumenical_council_events.0101.support: "引用された箇所の欠けている文脈を指摘する。"
 ecumenical_council_events.0101.support_duel: "より深い学識をもって、彼らを論破する。"
 ecumenical_council_events.0101.support_duel.success: "彼らが聖典から導かれた変革を受け入れる"
 ecumenical_council_events.0101.support_duel.success_halved: "数人が聖典から導かれた変革を受け入れる"
 ecumenical_council_events.0101.support_duel.failure: "彼らが聖典は明らかに変革に反対していると主張する"
 ecumenical_council_events.0101.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip]を支持する：聖典は変更すべきではない。"
 ecumenical_council_events.0101.oppose_duel: "変革が聖典の記述に由来するという主張に異議を唱える。"
 ecumenical_council_events.0101.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派が折れる"
 ecumenical_council_events.0101.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派の数人が折れる"
 ecumenical_council_events.0101.oppose_duel.failure: "変革についての彼らの解釈が通る"
 ecumenical_council_events.0101.conservatives_custom: "学識ある[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0101.conservatives_custom_halved: "学識ある[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0101.innovators_custom: "学識ある[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0101.innovators_custom_halved: "学識ある[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0102.t: "祈りの競い合い"
 ecumenical_council_events.0102.desc: "集まった者たちの中でもとりわけ敬虔な者たちが、提案をめぐって二つの祈りの輪に分かれた。\n\n[lead_innovator.GetTitledFirstName]は、自らの啓示が[lead_innovator.GetFaith.HighGodName]の御意志を反映したものだと認めていただけるよう、祈りを捧げる。[lead_conservative.GetTitledFirstNamePossessive]の一派もすぐさまこれに応じ、長きにわたり教会を支えてきた伝統を守るよう、[lead_innovator.GetFaith.random_GoodGodNames]に祈る。"
 ecumenical_council_events.0102.support: "変革を求める祈りに加わる"
