 # Flavor Events
 ecumenical_council_summons_events.0001.t: "[guest_1.GetTitleAsNameNoTooltip|U]の悩み"
 ecumenical_council_summons_events.0001.desc: "「例の問題が…私を苛んでいるのです。ああ、[guest_1.GetFaith.HighGodName]よ。これではろくに眠ることもできません…」[guest_1.GetTitledFirstName]は苦しげな小声で[guest_2.GetTitledFirstName]に打ち明ける。\n\n「わかりますとも…」と言って[guest_2.GetFirstNameNoTooltip]はうなずく。「主催者である[host.GetTitleAsNameNoTooltip]に相談してみてはいかがでしょう？[host.GetSheHe]なら、霊的な助言を授けてくれるかもしれません」"
 ecumenical_council_summons_events.0001.a: "一体何が[guest_1.GetHerHim]をそこまで悩ませているのだ…？"
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "[guest_1.GetShortUINamePossessive]の秘密を知る"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip]に必要なのは、親身な慰めだ。"
 ecumenical_council_summons_events.0001.c: "知らないほうがよい。"
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U]は公会議で、秘密を抱えて悩んでいた[TARGET_CHARACTER.GetShortUIName]を慰めた。"
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は公会議で、秘密を抱えて悩んでいた[CHARACTER.GetShortUIName]を慰めた。"
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUIName|U]は公会議で、[TARGET_CHARACTER.GetShortUINamePossessive]の秘密を探ろうとしていたところを見咎められた。"
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U]は公会議で、自分の秘密を探ろうとしていた[TARGET_CHARACTER.GetShortUIName]を見咎めた。"
 ecumenical_council_summons_events.0010.t: "秘密"
 ecumenical_council_summons_events.0010.desc: "主催者である[host.GetTitledFirstName]は、従者に祭服を整えさせており、私の存在には気づいていないようだ。\n\n「[host.GetFaith.HighGodName]よ、お許しください…」と[host.GetSheHe]はつぶやく。「私の…性向にまつわる噂。キリストの代理者たるこの私が、そのような不埒な嗜好にふけっているなどと思われるとは！このような噂を、枢機卿たちの耳に入れるわけにはいかない」"
 ecumenical_council_summons_events.0010.a: "「悔いておられるのですね、[host.GetTitleAsNameNoTooltip]」"
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "[host.GetShortUINamePossessive]の秘密を知る"
 ecumenical_council_summons_events.0010.b: "「[ROOT.Char.Custom('RandomBibleQuoteShort')]」"
 ecumenical_council_summons_events.0010.b.flavor: "[host.GetSheHe|U]は聖句に慰めを見いだすだろう！"
 ecumenical_council_summons_events.0010.c: "知らずにおくべきこともある。"
 ecumenical_council_summons_events.0020.t: "運営上の問題"
 ecumenical_council_summons_events.0020.desc.intro: "「やむを得んか…」[host.GetTitledFirstName]は手振りで司祭の一人を下がらせる。\n\n「[ROOT.Char.GetTitledFirstNameNoTooltip]！」と、[host.GetSheHe]は私に声をかける。"
 ecumenical_council_summons_events.0020.desc.caravans: "「物資を運ぶ隊商が、まだ到着していないのだ。"
 ecumenical_council_summons_events.0020.desc.servants: "「客人全員をもてなすには、召使いの数がまるで足りていないのだ。"
 ecumenical_council_summons_events.0020.desc.overcrowded: "「客人の数が多すぎて、公会議のために手配した[ROOT.Char.GetCurrentLocation.GetName]の宿だけでは足りないのだ。"
 ecumenical_council_summons_events.0020.desc.outro: "何か、この苦境を解決する手立てはないだろうか？」"
 ecumenical_council_summons_events.0020.aaa: "「ここは私の領地です、猊下。私が手配いたしましょう」"
 ecumenical_council_summons_events.0020.aa: "私に借りがある者なら、#EMP 大勢#!知っている…"
 ecumenical_council_summons_events.0020.a: "「金で解決できぬ問題はありません、猊下！」"
 ecumenical_council_summons_events.0020.b: "「私の貸しをすべて使うとしよう！」"
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName]は、私を影響力ある候補者として記憶するだろう…"
 ecumenical_council_summons_events.0020.c: "ささやかな祈りを捧げることしかできない…"
 ecumenical_council_summons_events.0020.papabile_tt: "教皇継承におけるあなたの[papabile_score|E]が#P +10#!上昇する"
 ecumenical_council_summons_events.0030.t: "荒天に翻弄されて"
 ecumenical_council_summons_events.0030.desc.intro: "公会議が目前に迫るなか、風は唸りを上げ、雨が道を激しく打ちつけている。"
 ecumenical_council_summons_events.0030.desc.dry_season: "この時期にしては、珍しい荒天である。"
 ecumenical_council_summons_events.0030.desc.wet_season: "この時期であれば、このような荒天も当然のことだ。"
 ecumenical_council_summons_events.0030.desc.outro: "私の[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )]である[chaplain.GetFirstName]は、震えを抑えきれずにいる。\n\n「我が主よ…私は公会議に出席できないかもしれません。この嵐、この寒さ…身体に堪えるのです。痰もひどくて…」"
 ecumenical_council_summons_events.0030.aa: "「この種の病については、書物で#EMP 大いに#!学んだことがある！」"
 ecumenical_council_summons_events.0030.a: "最高の医師を呼ばねば！"
 ecumenical_council_summons_events.0030.b: "「あなたのために祈りを捧げよう」"
 ecumenical_council_summons_events.0030.c: "人の命は定められた道をたどるものだ。"
 ecumenical_council_summons_events.0040.t: "本番前の緊張"
 ecumenical_council_summons_events.0040.desc: "公会議の時が近づくなか、私の[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )]である[chaplain.GetFirstName]が、不安げに中庭を歩き回っているのを見かけた。\n\n「もちろん、[ROOT.Char.GetFaith.ReligiousSymbol]の問題がある…当然だ…そして[chaplain.CustomFixedRandom('random_learning_topic')]についてはどうする…」と、独り言を呟いているのが聞こえる。"
 ecumenical_council_summons_events.0040.aa: "「[ROOT.Char.GetFaith.KnowledgeGodName]を思い出すのだ、[chaplain.GetFirstNameNoTooltip]よ」"
 ecumenical_council_summons_events.0040.aa.flavor: "霊的な助言があれば、きっと心強いはずだ。"
 ecumenical_council_summons_events.0040.a: "[chaplain.GetSheHe|U]には、私の名代でもあることを自覚してもらわねば。"
 ecumenical_council_summons_events.0040.a.tt.success: "あなたの外交手腕が功を奏する"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName]はあなたの意図を理解できない"
 ecumenical_council_summons_events.0040.b: "私の立場を利用して、[chaplain.GetHerHis]のために取り計らうこともできる…"
 ecumenical_council_summons_events.0040.c: "祈りで癒やせぬものなどない。"
 friend_reassured_at_council: "[CHARACTER.GetShortUIName|U]は、公会議の場で[TARGET_CHARACTER.GetShortUIName]を安心させた。"
 friend_reassured_at_council_corresponding: "[CHARACTER.GetShortUIName|U]は、公会議の場で[TARGET_CHARACTER.GetShortUIName]に安心させられた。"
 ecumenical_council_summons_events.0050.t: "疑わしき信仰心"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName]は、[non_pious_guest.GetTitledFirstName]の姿を目にして、面白くてたまらない様子だ。\n\n「あれをご覧になりましたか、[ROOT.Char.GetTitleAsNameNoTooltip]？」と、[pious_guest.GetSheHe]は私に声をかける。「[non_pious_guest.GetFirstNameNoTooltip]は称賛されるべきです。てっきり、[non_pious_guest.GetSheHe]が腰を下ろす場所といえば、[Glossary( '公衆浴場', 'BATHHOUSES_GLOSS' )]くらいのものだと思っておりました。"
 ecumenical_council_summons_events.0050.desc.non_pious_host: "ましてや、[non_pious_guest.GetSheHe]が自らを全[ROOT.Char.GetFaith.GetAdherentNamePlural]の長と称しているとは」"
 ecumenical_council_summons_events.0050.aaa: "その立場にふさわしいのは、[chaplain.GetTitledFirstNameNoTooltip]に違いない。"
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "[non_pious_guest.GetSheHe]がこの公会議に参加することを決めたとは、驚きだ。"
 ecumenical_council_summons_events.0050.aa: "よき羊飼いは、羊の群れの中から立たねばならない…"
 ecumenical_council_summons_events.0050.a: "「その話を#EMP 皆#!に広めてさしあげてもよいが…対価次第ですな」"
 ecumenical_council_summons_events.0050.b: "「では、#EMP あなた#!はどうして、誰が公衆浴場に通っているかをご存じなのですかな、[pious_guest.GetTitleAsNameNoTooltip]？」"
 ecumenical_council_summons_events.0050.c: "[ROOT.Char.GetFaith.HighGodName]に感謝しよう。退屈せずに済んだ。"
 BATHHOUSES_GLOSS: "中世の多くの都市では、かつて慎ましい沐浴のために設けられた公衆浴場が、悪名高い場所として知られるようになっていた。人目につきにくい部屋は、快楽を売る者たちが客を取るには十分な私的空間となっていた。"
 friend_defended_piety_at_ec_reason: "[CHARACTER.GetShortUIName|U]は公会議で[TARGET_CHARACTER.GetShortUINamePossessive]の敬虔さを擁護した。"
 friend_defended_piety_at_ec_reason_corresponding: "多くの証人が、公会議の場で[TARGET_CHARACTER.GetShortUIName|U]が[CHARACTER.GetShortUINamePossessive]の敬虔さを擁護したと証言した。"
 rival_accused_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]は、公会議の場で[CHARACTER.GetShortUIName]の不信心な振る舞いを非難した。"
 rival_accused_at_council_reason_corresponding: "[CHARACTER.GetShortUIName|U]は、公会議の場で[TARGET_CHARACTER.GetShortUIName]から不信心な振る舞いを非難された。"
