 ecumenical_council_events.0120.t: "年代記に残る名"
 ecumenical_council_events.0120.desc: "数人の名高い客人たちが会議の場から少し離れて、すべてが記録された後に自分たちの評価がどうなるかを考えている。\n\n「近頃書かれた年代記なら、どれを見ても私の名が載っている。永遠に嘲笑されかねない法令に、私の名を連ねる必要がどこにある？」と[lead_conservative.GetTitledFirstName]が言う。\n\n「人々の記憶に残るのは、手を汚さなかった者ではなく、争いを収めた者だ。そして、私こそがその者として記憶されるのだ」と[lead_innovator.GetTitledFirstName]が答える。"
 ecumenical_council_events.0120.support: "「教会の指導者は我々ではないか」"
 ecumenical_council_events.0120.support_duel: "「あなたは一人ではない！」"
 ecumenical_council_events.0120.support_duel.success: "懐疑的な者たちが歴史に身を委ねる"
 ecumenical_council_events.0120.support_duel.success_halved: "数人が歴史に身を委ねる"
 ecumenical_council_events.0120.support_duel.failure: "彼らは依然として賛同を避ける"
 ecumenical_council_events.0120.oppose: "笑いものになるような法令に、私の名を連ねるつもりはない。"
 ecumenical_council_events.0120.oppose_duel: "「歪んだ法令を施行して争いを収めようとするのは、愚か者がやることだ…」"
 ecumenical_council_events.0120.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派が折れる"
