 ecumenical_council_events.0107.t: "初めての公会議"
 ecumenical_council_events.0107.desc: "若い聖職者たちの一団が、興奮した様子で話している。彼らの多くにとって、これが初めての公会議なのだ。\n\n「ここでは何かが起こりつつある。[lead_innovator.GetFaith.HouseholdGodName]の気配を感じないか？長い間忘れられていた大胆さをもって、教会に我々の足跡を残そう！」と[lead_innovator.GetTitledFirstName]が言う。\n\n「卑しい愚か者め！我々は教父たちの教えに従い、忌まわしい革新を退けねばならないのだ」と[lead_conservative.GetTitledFirstName]が主張する。"
 ecumenical_council_events.0107.support: "信仰に新たな朝が訪れた！"
 ecumenical_council_events.0107.support_duel: "臆病な保守派に反論する。"
 ecumenical_council_events.0107.support_duel.success: "彼らの目に希望の輝きが宿る"
 ecumenical_council_events.0107.support_duel.success_halved: "数人が支持を誓う"
 ecumenical_council_events.0107.support_duel.failure: "彼らは軽蔑的な態度を崩さない"
 ecumenical_council_events.0107.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip]の言う通りだ。"
 ecumenical_council_events.0107.oppose_duel: "大胆さが招く危険を非難する！"
