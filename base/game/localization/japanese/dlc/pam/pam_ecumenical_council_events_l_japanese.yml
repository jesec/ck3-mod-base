 ecumenical_council_events.0103.t: "変革の代償"
 ecumenical_council_events.0103.desc: "「貴君の頑迷さが我々を破滅させるのだ！」[lead_innovator.GetTitledFirstName]が叫ぶ。\n\n「[lead_conservative.GetPrimaryTitle.GetNameNoTooltip]の信徒たちは、[lead_conservative.Custom('GetFaithTemple')]を再建する後援者に感謝するでしょう」と[lead_conservative.GetTitledFirstName]が言う。"
