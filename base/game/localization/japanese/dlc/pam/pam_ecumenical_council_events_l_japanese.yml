 ecumenical_council_guests_swayed_to_conservatives_log_title: "[ec_conservatives|E]に傾いた客人"
 ecumenical_council_guests_swayed_to_conservatives_log: "以下の出席者が、提案された変更に反対するよう説得され、[ec_conservatives|E]に加わった："
