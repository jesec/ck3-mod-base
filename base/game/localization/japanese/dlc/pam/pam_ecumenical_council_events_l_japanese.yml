 ecumenical_council_events.0122.t: "生きているうちに"
 ecumenical_council_events.0122.desc: "病弱な司祭たちが、陽の暖かさを求めて、広間の人混みから離れたところに座っている。\n\n「[lead_conservative.GetFaith.HighGodName]の御前へ召される前に、この公会議の最後をの言葉を聞くことができるだろうか…そして新たな恐怖の悪臭漂う[lead_conservative.GetFaith.NegativeAfterLife]へ落ちてしまうのだろうか」と[lead_conservative.GetTitledFirstName]が息苦しそうに喘ぎながら言う。\n\n「[lead_conservative.GetFirstNameNoTooltip]、あなたには失うものなどもうほとんど残っていない。だが、きっとまだ世界に与えられる希望があるはずだ。それができれば、安らかに[lead_innovator.GetFaith.PositiveAfterLife]へ行けるだろう？」と[lead_innovator.GetTitledFirstName]が答える。"
 ecumenical_council_events.0122.support: "「[ROOT.Char.GetFaith.HighGodName]にかけて、残された時間こそかけがえのないものだ！」"
 ecumenical_council_events.0122.support_duel: "私は沈黙を守ったまま[ROOT.Char.GetFaith.HighGodName]にまみえるつもりはない。"
 ecumenical_council_events.0122.support_duel.success: "彼らが最後の改革に駆り立てられる"
 ecumenical_council_events.0122.support_duel.success_halved: "数人が最後の改革に駆り立てられる"
 ecumenical_council_events.0122.support_duel.failure: "彼らは苦々しい思いを抱えて衰えていく"
 ecumenical_council_events.0122.oppose: "我々に残された最後の力は、[ROOT.Char.GetFaith.HighGodName]とその御言葉のためにある。"
 ecumenical_council_events.0122.oppose_duel: "「こんなことで我らの人生に汚点を残すのはやめよう！」"
 ecumenical_council_events.0122.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派が折れる"
 ecumenical_council_events.0122.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派の数人が折れる"
 ecumenical_council_events.0122.oppose_duel.failure: "彼らは依然として救われないままだ"
