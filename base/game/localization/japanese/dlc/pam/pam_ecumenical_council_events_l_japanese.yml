 ecumenical_council_events.0109.t: "静かな不満"
 ecumenical_council_events.0109.desc: "会議の場を離れたところで、小さな評議会が開かれているようだ。私抜きで信仰を作り変えようとしているのは、いったい誰だ？\n\n「この問題を問い直せるのなら、ほかのことも同じではないか」と[lead_conservative.GetTitledFirstName]が警告する。「私はそのような扉を開き、[lead_conservative.GetFaith.HighGodName]の家に不確かさを招き入れるつもりはない」\n\n「もはや役に立たぬ伝統など、振り払いたくはないのか？」と[lead_innovator.GetTitledFirstName]が問い返す。"
 ecumenical_council_events.0109.support: "理解者がいれば十分だ。"
 ecumenical_council_events.0109.support_duel: "慎重な者たちに耳を傾けさせる方法なら分かっている…"
 ecumenical_council_events.0109.support_duel.success: "彼らは道を塞ごうとはしない"
 ecumenical_council_events.0109.support_duel.success_halved: "数人があなたの言葉に耳を傾ける"
 ecumenical_council_events.0109.support_duel.failure: "彼らは結束してあなたに敵対する"
 ecumenical_council_events.0109.oppose: "扉を静かに閉める。"
 ecumenical_council_events.0109.oppose_duel: "「[lead_innovator.GetFirstNameNoTooltip]よ、お前はいつもそうして混乱を招くのか？」"
 ecumenical_council_events.0109.oppose_duel.success: "彼らは混乱を招く危険を冒さない"
 ecumenical_council_events.0109.oppose_duel.success_halved: "数人が支持を撤回する"
 ecumenical_council_events.0109.oppose_duel.failure: "彼らは依然として不和と破滅を望んでいる"
