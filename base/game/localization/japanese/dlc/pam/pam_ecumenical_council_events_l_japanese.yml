 ecumenical_council_events.0108.t: "友の輪"
 ecumenical_council_events.0108.desc: "集まった者たちの中に[ROOT.Char.Custom2('RelationToMe', friend)]の[friend.GetTitledFirstName]を見つけ、私は心強く思った。\n\n「私の立場は分かっているだろう」と[friend.GetSheHe]が言う。「一言命じてくれれば、私は従う」"
 ecumenical_council_events.0108.a: "[friend.GetFirstNameNoTooltip]よ、私に味方してくれ。"
 ecumenical_council_events.0108.b: "君自身の信念を貫くがいい。"
