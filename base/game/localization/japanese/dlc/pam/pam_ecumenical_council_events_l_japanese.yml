 ecumenical_council_events.0114.t: "信仰と鋼を武器に"
 ecumenical_council_events.0114.desc.intro: "戦を知る者たちの習わしのように、老練の戦士たちが共に時を過ごしている。\n\n「[lead_innovator.GetFaith.HighGodName]にかけて、これらの変更が合意されれば喜ばしいことだ。再び信徒を一つの旗の下に集められる！」と[lead_innovator.GetTitledFirstName]が言う。\n\n"
 ecumenical_council_events.0114.desc.conservative: "「我々は今のままでも、数多くの[ec_hostile_faith.GetAdherentName]を斬ってきたではないか」と[lead_conservative.GetTitledFirstName]が言う。「[lead_conservative.GetFaith.WarGodName]は、すでに我らの旗を祝福しているのではないか？」"
 ecumenical_council_events.0114.desc.conservative_generic: "「我々は今のままでも、数多くのの敵を斬ってきたではないか」と[lead_conservative.GetTitledFirstName]が言う。「[lead_conservative.GetFaith.WarGodName]は、すでに我らの旗を祝福しているのではないか？」"
 ecumenical_council_events.0114.support: "祝福された新たな旗を高く掲げよう。"
 ecumenical_council_events.0114.support_duel: "怯える者たちを[ROOT.Char.GetFaith.HighGodNamePossessive]の祝福された旗の下に集めよう！"
 ecumenical_council_events.0114.support_duel.success: "兵士は仕えねばならない"
 ecumenical_council_events.0114.support_duel.success_halved: "数人が徴兵される"
 ecumenical_council_events.0114.support_duel.failure: "彼らは頑として譲らない"
 ecumenical_council_events.0114.oppose: "正統派の擁護者、[lead_conservative.GetTitledFirstNameNoTooltip]を支持する"
 ecumenical_council_events.0114.oppose_duel: "言葉の決闘だ！"
