 ecumenical_council_events.0123.t: "戦争の気配"
 ecumenical_council_events.0123.desc: "私は今、味方同士が言い争う姿を目にしている。これではまるで、戦場で対峙している敵同士だ。これは不吉な兆しである。\n\n「我々に共通する目的は一つしかない！投票の指図をするな！私は[ROOT.Char.GetTitledFirstName]の鎖につながれた愛玩犬でも、うるさく吠える猟犬でもない！」と[lead_conservative.GetTitledFirstName]が怒鳴る。\n\n「[ROOT.Char.GetPrimaryTitle.GetNameNoTier]に命を懸けて誓ったことに、簡単な言葉ですら応えようとしない者を、私はどういう目で見ればいいのだ？」と[lead_innovator.GetTitledFirstName]が言い返す。"
 ecumenical_council_events.0123.support: "「すべての味方の忠誠心に訴えねばならない」"
 ecumenical_council_events.0123.support_duel: "あなたがこれを不名誉とみなしていることを警告する。"
 ecumenical_council_events.0123.support_duel.success: "味方があなたを支持する"
 ecumenical_council_events.0123.support_duel.success_halved: "数人の味方があなたを支持する"
 ecumenical_council_events.0123.support_duel.failure: "味方が脅しに屈しない"
 ecumenical_council_events.0123.oppose: "「ここでは聖典だけに忠誠を誓うがいい」"
 ecumenical_council_events.0123.oppose_duel: "[lead_innovator.GetFirstNameNoTooltip]のような味方に忠誠を求める。"
 ecumenical_council_events.0123.oppose_duel.success: "味方が折れる"
 ecumenical_council_events.0123.oppose_duel.success_halved: "数人の味方が折れる"
 ecumenical_council_events.0123.oppose_duel.failure: "味方が反対派としてまとまらない"
