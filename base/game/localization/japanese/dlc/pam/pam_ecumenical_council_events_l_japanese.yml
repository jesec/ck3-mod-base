 ecumenical_council_events.0113.t: "戦火の中の信仰"
 ecumenical_council_events.0113.desc: "異なる信仰の軍勢に領国を荒らされている者たちが、互いに共感しながら会議の場を離れて集まっている。\n\n「信仰の敵に領土を焼き払われているというのに、愚かな夢想をめぐって言い争っている場合か？」と[lead_conservative.GetTitledFirstName]が言う。「我々の胸には剣が突き立てられているも同然なのだぞ」\n\n「亀裂の入った信条は、壊れた盾と同じだ」と[lead_innovator.GetTitledFirstName]が答える。「教会法を定め、団結を新たにして戦おう！」"
 ecumenical_council_events.0113.support: "再び希望を味わいたいものだ。"
 ecumenical_council_events.0113.support_duel: "我らの盾たる教会を立て直そう！"
 ecumenical_council_events.0113.support_duel.success: "彼らが受け入れ、我々は一つとなって戦う"
 ecumenical_council_events.0113.support_duel.success_halved: "数人が改革を受け入れる"
 ecumenical_council_events.0113.support_duel.failure: "彼らは希望を思い出せない"
 ecumenical_council_events.0113.oppose: "こんな愚かなことよりも、もっと急を要する問題があるのではないか？"
 ecumenical_council_events.0113.oppose_duel: "彼らの軽率さを戒める。"
