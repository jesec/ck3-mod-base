 ecumenical_council_events.0117.t: "多すぎる改正"
 ecumenical_council_events.0117.desc: "2人の手慣れた交渉役が、法令の余白に文案を書き込みながら、まるで条約の内容を詰めるかのように、条項を削ったり戻したりしている。\n\n「このままにしておけ！より厄介な問題に取りかかる前に、半数が去ってしまうかもしれない」と[lead_conservative.GetTitledFirstName]が言う。「私は何か月もかけて、皆を一つの卓に着かせてきた。法令の内容を緩めなければ、公会議そのものを失うことになる」\n\n「だからといって、公会議が終わった後に誰も施行しないようなこんな代物を残せというのか？」と[lead_innovator.GetTitledFirstName]が答える。"
 ecumenical_council_events.0117.support: "我々は説得力のある、明確な法令を作るべきだ。"
 ecumenical_council_events.0117.support_duel: "曖昧なままにするより、断固たる法令の方がいいではないか。"
 ecumenical_council_events.0117.support_duel.success: "曖昧な法令が施行されないことを彼らが認める"
 ecumenical_council_events.0117.support_duel.success_halved: "曖昧な法令が施行されないことを数人が認める"
 ecumenical_council_events.0117.support_duel.failure: "彼らは依然として孤立を恐れる"
 ecumenical_council_events.0117.oppose: "公会議を失う危険は冒せない！"
 ecumenical_council_events.0117.oppose_duel: "こんな粗雑な内容では可決できない！"
 ecumenical_council_events.0117.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]派が折れる"
