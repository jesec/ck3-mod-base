 ecumenical_council_events.0126.t: "ライバルたちの中で"
 ecumenical_council_events.0126.desc: "集まった者たちの中に我が[ROOT.Char.Custom2('RelationToMe', rival)]の[rival.GetTitledFirstName]の姿を見つけるとは、なんという試練だろうか。\n\n「私がここにいる理由は分かっているだろう」と[rival.GetSheHe]が唸るように言う。「言いたいことを言え。どちらにつくか選べ…私はただ、お前に反対票を投じるのを待っているだけだ」"
 ecumenical_council_events.0126.a: "憎しみではなく、良心に従って投票しろ。"
 ecumenical_council_events.0126.b: "恨みは胸にしまっておけ。私は挑発には乗らない。"
 ecumenical_council_events.0126.c: "[rival.GetHerHim]は公会議に気を取られている…"
 ecumenical_council_events.0126.c.tt: "[scheme|E]の[success_chance|E]が#P 増加する#!"
 ecumenical_council_events.0126.conservatives_custom: "あなたの[rivals|E]の中の[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0126.innovators_custom: "あなたの[rivals|E]の中の[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0129.t: "議場に漂う恐怖"
 ecumenical_council_events.0129.desc: "私を前に震える者たちが、怯えきった目で議論を見守っている。その中でも最も卑しい[lead_conservative.GetTitledFirstName]は、私と目を合わせようともしない。\n\n「言いたいことを言えばいい」と[lead_conservative.GetSheHe]が囁く。「あなたに逆らえばどうなるかは、もう分かっている」"
 ecumenical_council_events.0129.support: "残虐に振る舞って、思い通りにならなかったことは一度もない。"
 ecumenical_council_events.0129.support_duel: "他の者たちにも同じ恐怖を味わわせる。"
 ecumenical_council_events.0129.support_duel.success: "彼らは恐怖に屈して、あなたに従う"
 ecumenical_council_events.0129.support_duel.success_halved: "数人が恐怖に屈して、あなたに従う"
 ecumenical_council_events.0129.support_duel.failure: "彼らの恐怖が反抗心へと変わる"
 ecumenical_council_events.0129.oppose: "そして恐怖が希望を食らい尽くす。"
 ecumenical_council_events.0129.oppose_duel: "誰一人として私に逆らわせはしない。"
 ecumenical_council_events.0129.oppose_duel.success: "恐れる者たちが従う"
 ecumenical_council_events.0129.oppose_duel.success_halved: "数人が従う"
 ecumenical_council_events.0129.oppose_duel.failure: "彼らの恐怖が反抗心へと変わる"
