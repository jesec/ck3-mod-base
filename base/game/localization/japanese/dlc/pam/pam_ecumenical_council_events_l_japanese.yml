 ecumenical_council_events.0110.t: "行き過ぎた野心"
 ecumenical_council_events.0110.desc: "「これはほんの小さな改正だ！」と[lead_innovator.GetTitledFirstName]が言う。「これを押し通す手助けをしておけば、[lead_innovator.GetFaith.ReligiousHeadName]候補としての立場を良くしておける」\n\n「お前の行き過ぎた野心は身を滅ぼし、我々を破滅させるだろう」と[lead_conservative.GetTitledFirstName]がせせら笑う。"
 ecumenical_council_events.0110.support: "少しの野心には使い道がある"
 ecumenical_council_events.0110.support_duel: "さらに上の地位を目指すべく主張する！"
 ecumenical_council_events.0110.support_duel.success: "ほんの小さな改正にすぎないと彼らが認める"
 ecumenical_council_events.0110.support_duel.success_halved: "数人が支持の利点を認める"
