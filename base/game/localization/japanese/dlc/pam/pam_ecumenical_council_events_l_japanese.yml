 ecumenical_council_events.0112.t: "領国を襲う疫病"
 ecumenical_council_events.0112.desc: "「我が領地では死体が山のように積み上がっている！最初はなぜ[lead_conservative.GetFaith.HighGodNamePossessive]が罰を与えられたのか分からなかったが、今やあまりにも明白だ！この世界が教会法の変異を拒絶しているからこそ、人々は苦しんでいるのだ」と[lead_conservative.GetTitledFirstName]が言う。\n\n「この公会議に対する憎しみに目が眩み、救いまで見えなくなったか？」と[lead_innovator.GetTitledFirstName]が言い返す。「我らの改革が[lead_innovator.GetFaith.HighGodName]の怒りを鎮めるのだ！」"
 ecumenical_council_events.0112.support: "その通りだ。[ROOT.Char.GetFaith.HighGodName|U]は教会に変革を求めている。"
 ecumenical_council_events.0112.support_duel: "この石頭の理屈を逆手に取ればうまくいくかもしれない！"
 ecumenical_council_events.0112.support_duel.success: "多くの者が神の怒りが収まると認識する"
 ecumenical_council_events.0112.support_duel.success_halved: "数人が[lead_innovator.GetFaith.HighGodName]の怒りを鎮めようとする"
 ecumenical_council_events.0112.support_duel.failure: "教会法の破壊はあまりにも危険だ"
 ecumenical_council_events.0112.oppose: "それとも、[ROOT.Char.GetFaith.HighGodName]をさらに怒らせる気か！"
 ecumenical_council_events.0112.oppose_duel: "これは教会法の破壊に繋がると警告する。"
