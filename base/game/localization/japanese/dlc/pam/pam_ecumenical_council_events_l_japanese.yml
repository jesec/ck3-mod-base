 ecumenical_council_events.0118.t: "遠き聖座の伝統"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName]は、[lead_conservative.GetCulture.GetNameNoTooltip]出身の有力な公会議の出席者だ。教会の伝統を守るため、遠方から旅してきた他の聖職者たちとともに立っている。\n\n「[lead_conservative.GetFaith.GetAdjective]の世界は、[lead_conservative.GetFaith.HighGodName]の愛と同じく広大だ」と[lead_conservative.GetSheHe]が言う。「この巡礼が、教父たちが築いてきたものを覆そうとする[lead_innovator.GetTitledFirstName]の説教を聞くためだけのものにならないことを願う」"
 ecumenical_council_events.0118.support: "最も苦しい巡礼こそ、最も大いなる啓示をもたらす。"
 ecumenical_council_events.0118.support_duel: "[lead_innovator.GetFirstNamePossessiveNoTooltip]の構想が正しいと彼らに納得させる。"
 ecumenical_council_events.0118.support_duel.success: "教父たちの伝統が脅かされることはないと彼らが認める"
 ecumenical_council_events.0118.support_duel.success_halved: "教父たちの伝統が脅かされることはないと数人が認める"
 ecumenical_council_events.0118.support_duel.failure: "彼らは依然として[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]の説教を警戒している"
 ecumenical_council_events.0118.oppose: "「我々全員で、あなたの献身を称えよう」"
 ecumenical_council_events.0118.oppose_duel: "「私は[lead_innovator.GetTitledFirstNameNoTooltip]に反対する説教をしよう」"
