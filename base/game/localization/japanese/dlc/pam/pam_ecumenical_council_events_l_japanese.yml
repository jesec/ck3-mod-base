 ecumenical_council_events.0116.t: "代償を払う者"
 ecumenical_council_events.0116.desc: "いくつもの司教座の管財人たちが羊皮紙の切れ端を覗き込みながら、まるでこの広間が会計所であるかのように数字について言い争っている。\n\n「我が教区には、これ以上の変革に耐える余裕はない」と[lead_conservative.GetTitledFirstName]が言う。「すべての教区に新しい書物を。すべての村の[lead_conservative.GetFaith.HouseOfWorship]に早馬を。これが可決されれば、十分の一税ではとても賄いきれない」\n\n「では、否決されたら？」と[lead_innovator.GetTitledFirstName]が問う。「我々はすでに何年も言い争ってきた。その間に費やした金は、いずれにせよ戻ってこない。残った金は、信徒が従う法のために使った方がいい」"
 ecumenical_council_events.0116.support: "そうだ、すでに使ってしまった金のことを悔やんで何になる？"
 ecumenical_council_events.0116.support_duel: "改革を支持することは、将来への投資だと主張する。"
 ecumenical_council_events.0116.support_duel.success: "彼らが改革に惹きつけられる"
 ecumenical_council_events.0116.support_duel.success_halved: "数人がこの主張を受け入れる"
 ecumenical_council_events.0116.support_duel.failure: "彼らは依然として出費について不平を漏らす"
 ecumenical_council_events.0116.oppose: "我が教区には、このような変革を支える余裕はない"
 ecumenical_council_events.0116.oppose_duel: "「[ROOT.Char.GetFaith.HighGodName]にかけて！財政を考えれば無謀だ！」"
