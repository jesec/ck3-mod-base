 ecumenical_council_events.0115.t: "陰謀と駆け引き"
 ecumenical_council_events.0115.desc: "認めるのは辛いが、すべての聖職者が名誉ある形で聖職に就いたわけではない。この高貴な集まりの中でさえ、聖典の純粋な光よりも闇を好む者がいることを、私は十分に意識しておかねばならない。現に、闇の中から囁き声が聞こえてくるまで、そう時間はかからなかった。\n\n「ここにいるすべての魂は…何かに飢えている。誰がその飢えの代償を払うことになるのか、賢明なる我々がよく考えねばならない」と[lead_conservative.GetTitledFirstName]が、聞く耳を持つ者たちに囁きかける。「無謀な思想、熱意に満ちた改革…これほど代償の大きいものはない…」\n\nもう一匹の毒蛇、[lead_innovator.GetTitledFirstName]が立ち上がり、[lead_conservative.GetHerHim]に挑む。「混乱の代償を払うのが#EMP あなた#!だと思っているのか？これから訪れる混乱の時代、我々が好きなように振る舞える時代にか…？」"
 ecumenical_council_events.0115.support: "混乱にも利用価値はある。"
 ecumenical_council_events.0115.support_duel: "耳を傾けるだけの賢さがある者たちに、好機を説く。"
 ecumenical_council_events.0115.support_duel.success: "彼らが欲に駆られてあなたに従う"
 ecumenical_council_events.0115.support_duel.success_halved: "数人が混乱を求める"
 ecumenical_council_events.0115.support_duel.failure: "彼らは好機を見抜けない"
 ecumenical_council_events.0115.oppose: "わずかな施しを受けたところで、我ら[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]はその後永遠に飢えることになる。"
 ecumenical_council_events.0115.oppose_duel: "聖典に真理を求めなければ、道を失う。"
