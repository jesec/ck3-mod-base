 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる遺骸から取り出された指を納めた、優美な聖遺物箱。"
 pam_saint_relic_tooth_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる遺骸から取り出された歯を納めた、優美な聖遺物箱。"
 pam_saint_relic_rib_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる遺骸から取り出された肋骨を納めた、優美な聖遺物箱。"
 pam_saint_relic_hair_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる髪の一房を納めた、優美な聖遺物箱。"
 pam_saint_relic_vestment_desc: "[relic_creator_saint.GetShortUINameNotMe]がかつて身にまとった式服の一片を納めた、優美な聖遺物箱。"
 pam_saint_relic_hand_desc: "[relic_creator_saint.GetShortUIName]の聖なる遺骸から取り出され、保存された手を納めた、優美な聖遺物箱。"
 pam_saint_relic_arm_desc: "[relic_creator_saint.GetShortUIName]の聖なる遺骸から取り出され、保存された腕を納めた、優美な聖遺物箱。"
 pam_saint_relic_skull_desc: "[relic_creator_saint.GetShortUINameNotMe]の崇敬される頭蓋骨を納めた、優美な聖遺物箱。"
 pam_saint_relic_blood_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる血を一瓶納めた、優美な聖遺物箱。"
 pam_saint_relic_heart_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる心臓を納めた、優美な聖遺物箱。"
 pam_saint_relic_effigy_desc: "[relic_creator_saint.GetShortUINameNotMe]の姿をかたどった、信徒たちの崇敬を集める聖像。"
 pam_saint_relic_letter_desc: "[relic_creator_saint.GetShortUINameNotMe]がしたためた書簡を納めた、優美な聖遺物箱。"
 pam_saint_relic_drawing_desc: "[relic_creator_saint.GetShortUINameNotMe]が描いた名高い絵。"
 pam_saint_relic_stationery_desc: "[relic_creator_saint.GetShortUINameNotMe]が使っていた筆記具一式。持ち主にも同じ知恵を授けるといわれている。"
 pam_saint_relic_ash_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖なる遺灰を納めた、優美な聖遺物箱。"
 pam_saint_relic_canopic_jar_desc: "[relic_creator_saint.GetShortUINameNotMe]の内臓を納めた壺。"
 pam_saint_relic_staff_desc: "[relic_creator_saint.GetShortUINameNotMe]が巡礼の旅で使っていた杖。"
 pam_saint_relic_water_filter_desc: "[relic_creator_saint.GetShortUINameNotMe]が旅先で水を濾すために使っていた布切れ。"
 pam_saint_relic_bowl_desc: "[relic_creator_saint.GetShortUINameNotMe]が旅先で施しを乞う際に使っていた鉢。"
 pam_saint_relic_robe_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖衣を納めた、優美な聖遺物箱。"
 pam_saint_relic_sword_desc: "[relic_creator_saint.GetShortUINameNotMe]が振るった聖なる剣。これを携える信徒には、神の加護と力が授けられるという。"
 pam_saint_relic_sarira_desc: "[relic_creator_saint.GetShortUINameNotMe]の舎利を納めた、優美な聖遺物箱。"
 pam_saint_relic_skull_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]の舎利である肉髻を納めた、優美な聖遺物箱。"
 pam_saint_relic_finger_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]の舎利である指を納めた、優美な聖遺物箱。"
 pam_saint_relic_tooth_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]の舎利である歯を納めた、優美な聖遺物箱。"
 pam_saint_relic_rib_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]の舎利である肋骨を納めた、優美な聖遺物箱。"
 pam_saint_relic_talisman_desc: "[relic_creator_saint.GetShortUINameNotMe]が記したタリスマン。邪を祓う、あるいは持ち主を癒す力があるといわれている。"
 pam_saint_relic_pellet_desc: "[relic_creator_saint.GetShortUINameNotMe]が調合した丹薬を収めた小瓶。"
 pam_saint_relic_footprint_desc: "[relic_creator_saint.GetShortUINameNotMe]の足跡を納めた、優美な聖遺物箱。"
 pam_saint_relic_afarganyu_desc: "[relic_creator_saint.GetShortUINameNotMe]が所持していたアファルガニュ。"
 pam_saint_relic_ring_desc: "[relic_creator_saint.GetShortUINameNotMe]が所持していた聖なる指輪。"
 pam_saint_relic_bracelet_desc: "[relic_creator_saint.GetShortUINameNotMe]が所持していた聖なる腕輪。"
 pam_saint_relic_commentary_desc: "[relic_creator_saint.GetShortUINameNotMe]が著した注釈書集。[relic_creator_saint.GetFaith.ReligiousText]についての解釈が記されている。"
 pam_saint_relic_tzitzit_desc: "[relic_creator_saint.GetShortUINamePossessiveNotMy]のツィーツィートをなす一本の聖なる糸。その敬虔さの証とされている。"
 pam_saint_relic_relic_desc: "[relic_creator_saint.GetShortUINameNotMe]の聖遺物を納めた、優美な聖遺物箱。"
 # Buried-saint point of interest
 poi_buried_saint: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]の墓"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "聖人の墓への訪問"
 poi_buried_saint.visit_va: "先祖の墓への訪問"
 poi_buried_saint.visit_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]の墓を訪れると、敬虔な思いに満たされる。"
 poi_buried_saint.preset_visit_desc: "[visited_saint.GetShortUIName]の墓で立ち止まり、敬意を表する。"
 poi_buried_saint.foreign_visit: "古代の墓への訪問"
 poi_buried_saint.foreign_visit_desc: "我が信仰は[visited_saint.GetShortUIName]を崇敬しないが、この墓から学べることは多い。"
 pam_poi_buried_saint_on_visit_preset_relic_tt: "敬意を表すとささやかな[piety_i|E][piety|E]を得られ、さらに遠方から行うよりも#EMP 少ない#!費用で聖なる[Concept('artifact','遺物')|E]を取り出すこともできる。"
 pam_poi_buried_saint_on_visit_relic_tt: "[visited_saint.GetShortUIName]に敬意を表すと、遠方から行うよりも#EMP 少ない#!費用で聖なる[Concept('artifact','遺物')|E]を取り出すことができる。"
 pam_poi_buried_saint_on_visit_no_relic_tt: "ここに眠る[visited_saint.Custom('PamSaintOrAncestorNoun')]、[visited_saint.GetShortUIName]に敬意を表する。"
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "[visited_saint.GetShortUINameNoTooltip]の墓前で"
 pam_saint_events.0007.desc: "旅の途上、わが信仰で崇敬される[visited_saint.Custom('PamVeneratedSaintOrAncestor')]、[visited_saint.GetShortUIName]が眠る墓所へとたどり着いた。辺りには神聖な気配が満ち、墓の周りでは信徒たちがひざまずき、静かに祈りを捧げている。"
 pam_saint_events.0007.a: "敬意を表し、先へ進もう。"
 pam_saint_events.0007.b: "聖なる遺物を取り出そう。"
 pam_saint_events.0007.b.tt: "[visited_saint.GetShortUINameNoTooltip]の遺骸から聖なる[Concept('artifact','遺物')|E]が取り出される"
 pam_saint_events.0007.b.toast: "聖なる遺物が取り出された"
 pam_saint_events.0007.b.toast_desc: "敬虔な者たちによって、[visited_saint.GetShortUINameNoTooltip]の遺骸から[relic_artifact.GetName]が取り出され、我が[realm|EU]に祝福をもたらす。"
