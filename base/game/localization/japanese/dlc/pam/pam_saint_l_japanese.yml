 pam_saint_noun_jainism: "[Concept('canonized','シッダ')|E]"
 pam_saint_noun_shintoism: "[Concept('canonized','神')|E]"
 pam_saint_noun_confucianism: "[Concept('canonized','聖賢')|E]"
 pam_saint_noun_buddhism: "[Concept('canonized','アーリヤ')|E]"
 pam_saint_noun_taoism: "[Concept('canonized','真人')|E]"
 pam_saint_noun_judaism: "[Concept('canonized','ツァディク')|E]"
 pam_saint_noun_other: "尊敬される先祖"
