 # Title-cased fallbacks for the name-context commands; the bespoke branches reuse the pam_venerated_saint_* fragments above.
 pam_venerated_saint_other_title: "尊敬される先祖"
 pam_venerate_object_other: "先祖"
 pam_consecrate_christian: "聖別"
 pam_consecrate_others: "安置"
 pam_consecrate_christian_past: "聖別"
 pam_consecrate_others_past: "安置"
 pam_consecrate_christian_present: "聖別"
 pam_consecrate_others_present: "安置"
 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "聖人を祀る"
 pam_choose_consecration_site_decision_va: "[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]を聖別する"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "我が[realm|EU]内の[Concept('ecclesiastical_domicile_building','聖堂')|E]を、この聖なる[Concept('canonized','聖人')|E]を祀り、その遺骸を安置する場所として選ぼう。そうすれば、信徒たちを引き寄せることができるだろう。"
 pam_choose_consecration_site_decision_desc_va: "この[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]を聖別し、その遺骸を安置する聖なる場所を[realm|EU]の中から選ぼう。そうすれば、信徒たちもこの地へ集うだろう。"
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "我が[faith|EU]の[Concept('holy_site','聖地')|E]を、この聖なる[Concept('canonized','聖人')|E]を祀り、その遺骸を安置する場所として選ぼう。そうすれば、信徒たちを引き寄せることができるだろう。"
 pam_choose_consecration_site_decision_desc_holy_site_va: "この[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]を聖別し、その遺骸を安置する場所として、[realm|EU]内にある[faith|EU]の[Concept('holy_site','聖地')|E]を選ぼう。そうすれば、信徒たちもその地へ集うだろう。"
 pam_choose_consecration_site_decision_tooltip: "選ばれた[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]を聖別する場所を選択する。"
 pam_choose_consecration_site_decision_confirm: "祀る"
 pam_choose_consecration_site_decision_select_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]を聖別する場所を選ぶ"
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "遺物を取り出す"
 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U]は我が領国内に[GetPlayer.Custom('PamConsecratedEnshrined')]されている。その遺骸から、しかるべき敬意をもって聖遺物を取り出し、信徒たちの祝福に用いよう。"
 pam_extract_relic_decision_tooltip: "支配下の領地に葬られた[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]から聖遺物を取り出す。"
 pam_extract_relic_decision_confirm: "遺物を取り出す"
 pam_extract_relic_decision_req_saint: "[realm|EU]内に、まだ聖遺物を取り出せる[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U]が眠っている"
 pam_extract_relic_decision_req_saint_count: "これまでに[CHARACTER.GetShortUIName]から取り出された[Concept('artifact','遺物')|E]は[CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')]個中[CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')]個"
 pam_extract_relic_decision_extract_tt: "[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]の遺骸から聖なる[Concept('artifact','遺物')|E]を作り出す"
 pam_extract_relic_decision_choose_tt: "埋葬されている[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]のうち、誰の遺骸から[Concept('artifact','遺物')|E]を取り出すか選ぶ"
 pam_extract_relic_decision_item_valid_tt: "この[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]の遺骸からは、まだ聖なる[Concept('artifact','遺物')|E]を取り出せる。"
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "請願書の送付"
 pam_saint_events.0001.desc: "[saint_candidate.GetFirstName]の件の準備が整い、[consecration_province.GetName]にはその祝福された遺骸を祀る名誉ある場所が用意されている。\n\n今やこの事案は私の手を離れた。[petition_recipient.GetTitledFirstName]へと請願書が送られ、あとは良き判断が下されるよう祈るばかりだ。"
 pam_saint_events.0001.a: "あとは待ち、祈るのみだ。"
 pam_saint_events.0001.a.tt_saint: "[saint_candidate.GetFirstName]を聖なる[Concept('canonized','聖人')|E]と認め、[consecration_province.GetName]に祀るための請願書が[petition_recipient.GetTitledFirstName]へと送られた。返答はいずれ届くだろう。"
 pam_saint_events.0001.a.tt_va: "[saint_candidate.GetFirstName]を[saint_candidate.Custom('PamVeneratedSaintOrAncestor')]として崇敬し、その遺骸を[consecration_province.GetName]に[saint_candidate.Custom('PamConsecratedEnshrined')]するよう求める請願が[petition_recipient.GetTitledFirstName]に送られた。返答はいずれ届くだろう。"
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "列聖の請願"
 pam_saint_events.0002.t_va: "先祖尊敬の請願"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName]は、[saint_candidate.GetFirstName]を[consecration_province.GetName]内に祀り、祝福された聖人の列に加えるよう懇願している。"
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName]は、[saint_candidate.GetFirstName]を[saint_candidate.Custom('PamBlessedOnesOrAncestors')]に列し、その遺骸を[consecration_province.GetName]に[saint_candidate.Custom('PamConsecratedEnshrined')]するよう嘆願している。"
 pam_saint_events.0002.desc.traits_1: "\n\n生前、[saint_candidate.GetFirstNameNoTooltip]は、[pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]であることで知られる[saint_candidate.GetWomanMan]であった。"
 pam_saint_events.0002.desc.traits_2: "\n\n生前、[saint_candidate.GetFirstNameNoTooltip]は、[pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]であり[pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]であることで知られる[saint_candidate.GetWomanMan]であった。"
 pam_saint_events.0002.desc.traits_3: "\n\n生前、[saint_candidate.GetFirstNameNoTooltip]は、[pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]、[pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]、そして[pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]として知られる[saint_candidate.GetWomanMan]であった。"
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "この魂からは揺らめく光が放たれている。それはささやかな炎だが、すべての聖人がより大きな炎で鍛え上げられたわけではない。\n\n判断は我々に委ねられている。"
 pam_saint_events.0002.desc.virtue_1_va: "この魂からは揺らめく光が放たれている。それはささやかな炎だが、すべての尊敬される者がより大きな炎で鍛え上げられたわけではない。\n\n判断は我々に委ねられている。"
 pam_saint_events.0002.desc.virtue_2: "[saint_candidate.GetFaith.HighGodName]を喜ばせるためのこの人物の功績は、軽視されるべきものではない。それは不完全ではあるにせよ、紛れもない恩寵の証なのだ。\n\n判断は我々に委ねられている。"
 pam_saint_events.0002.desc.virtue_3: "美徳はこの人物の体現であり、神性をこれほど明白に纏う人間は稀である。\n\n判断は我々に委ねられている。"
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName]は真に相応しい。"
 pam_saint_events.0002.a.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive]の[Concept('dynasty','王朝')|E]の成員のうち、[canonizer.GetFaith.GetAdherentName]である者のあなたに対する[Concept('opinion','好感度')|E]が20年間、#P 10#!上昇する"
 pam_saint_events.0002.b: "我々は承認しない。"
 pam_saint_events.0002.b.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive]の[Concept('dynasty','王朝')|E]の成員のうち、[canonizer.GetFaith.GetAdherentName]である者のあなたに対する[Concept('opinion','好感度')|E]が20年間、#N 10#!減少する"
 # Opinion Modifiers
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
 pam_canonization_approved_petitioner_opinion_saint: "[dynasty|E]の成員の列聖を承認した"
 pam_canonization_approved_petitioner_opinion_va: "[dynasty|E]の成員の尊敬を承認した"
 pam_canonization_approved_dynasty_opinion: "$pam_canonization_approved_petitioner_opinion$"
 pam_canonization_denied_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_denied_petitioner_opinion_saint', 'pam_canonization_denied_petitioner_opinion_va' )]"
 pam_canonization_denied_petitioner_opinion_saint: "[dynasty|E]の成員の列聖を却下した"
 pam_canonization_denied_petitioner_opinion_va: "[dynasty|E]の成員の尊敬を却下した"
 pam_canonization_denied_dynasty_opinion: "$pam_canonization_denied_petitioner_opinion$"
 pam_canonization_celebrated_dynasty_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_celebrated_dynasty_opinion_saint', 'pam_canonization_celebrated_dynasty_opinion_va' )]"
 pam_canonization_celebrated_dynasty_opinion_saint: "[dynasty|E]の成員を列聖した"
 pam_canonization_celebrated_dynasty_opinion_va: "[dynasty|E]の成員を尊敬した"
 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "新たな聖人"
 pam_saint_events.0003.t_va: "新たな[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_saint_events.0003.desc_saint: "すべてが済んだ。[saint_candidate.GetFirstName]は聖人の列に加えられ、[consecration_province.GetName]内に祀られた。[saint_candidate.GetHerHis]の光が、今後幾世代にもわたって我が同胞たる[saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip]を祝福せんことを。"
 pam_saint_events.0003.desc_va: "これにて成就した。[saint_candidate.GetFirstName]は[saint_candidate.Custom('PamBlessedOnesOrAncestors')]に列せられ、その遺骸は[consecration_province.GetName]に[saint_candidate.Custom('PamConsecratedEnshrined')]された。その光が、代々にわたり我らが領国を祝福せんことを。"
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "神に感謝を。"
 pam_saint_events.0003.a_va: "感謝を捧げよう。"
 pam_saint_events.0003.a.dynasty_opinion_tt: "あなたと同じ[faith|EU]を信仰するあなたの[dynasty|E]の成員の、あなたに対する[Concept('opinion','好感度')|E]が、20年間、#P 20#!上昇する"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "聖人列聖が却下された"
 pam_saint_events.0004.t_va: "先祖尊敬が却下された"
 pam_saint_events.0004.desc: "[saint_candidate.GetFirstName]を[GetPlayer.Custom('PamCanonizeVenerateVerb')]するための我々の請願は、[petition_recipient.GetTitledFirstName]によって却下された。今日この日、[saint_candidate.GetSheHe|U]が[GetPlayer.Custom('PamBlessedOnesOrAncestors')]の列に加わることはない。"
 pam_saint_events.0004.a: "仕方あるまい。"
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "聖遺物箱の準備"
 pam_saint_events.0005.desc: "[extract_site.GetName]では、敬虔な者たちが厳粛な作業に取りかかり、[relic_saint.GetShortUIName]の聖遺物を[relic_saint.GetHerHis]の祝福された遺骸から取り出そうとしている。\n\nこの神聖な機会を祝うための準備が進められている。"
 pam_saint_events.0005.a: "最大の敬意をもって進めさせよ。"
 pam_saint_events.0005.a.tt: "[relic_saint.GetShortUIName]の聖なる[Concept('artifact','遺物')|E]が間もなく[extract_site.GetName]から取り出される。"
 # The relic is drawn
 pam_saint_events.0006.t: "聖なる遺物"
 pam_saint_events.0006.desc_relic: "[extract_site.GetName]に[GetPlayer.Custom('PamConsecratedEnshrined')]された[relic_saint.GetFirstName]の聖なる遺骸から、#EMP [relic_artifact.GetName]#!を聖遺物として取り出した。これが代々にわたり、我が領国の信徒たちを祝福せんことを。"
 pam_saint_events.0006.desc: "[extract_site.GetName]に[GetPlayer.Custom('PamConsecratedEnshrined')]された[relic_saint.GetFirstName]の聖なる遺骸から、我らが領国を祝福するための聖なる[Concept('artifact','遺物')|E]が取り出された。"
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "神に栄光あれ！"
 pam_saint_events.0006.a_va: "感謝を捧げよう。"
 pam_saint_events.0006.a.tt: "[relic_artifact.GetName]が取り出され、今やあなたの保管のもとにある。"
 pam_dulia_relic_dynasty_prestige_tt: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]の信条による効果："
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "信条「[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]」により、あなたと同じ[faith|E]を信仰するすべての[ruler|E]が、#EMP 5#!年間、$pam_dulia_new_saint_modifier$を得る。"
 pam_dulia_new_saint_message_t: "新たな仲介者"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.GetTitledFirstName]は聖人の列に加えられ、[pam_new_saint.GetFaith.GetName]の信徒たちは、神の御前に新たな仲介者を得た。"
 # Relic benefit requirement (can_benefit on pam_saint_relic_template).
 pam_saint_relic_benefit_faith_tt: "保持者は[CHARACTER.GetShortUIName]と同じ[religion|E]である"
