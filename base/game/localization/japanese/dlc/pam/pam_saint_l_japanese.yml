 # Plain bare noun for names/titles/possessives (no concept link, capitalized fallback), via PamSaintOrAncestorTitleNoun.
 pam_saint_title_noun_christian: "聖人"
 pam_saint_title_noun_islam: "ワリ"
 pam_saint_title_noun_hellenism: "ディウス"
 pam_saint_title_noun_jainism: "シッダ"
 pam_saint_title_noun_shintoism: "神"
 pam_saint_title_noun_confucianism: "聖賢"
 pam_saint_title_noun_buddhism: "アーリヤ"
