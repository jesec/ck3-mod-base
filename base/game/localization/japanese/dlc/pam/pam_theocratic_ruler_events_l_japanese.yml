l_japanese:
 pam_theocratic_ruler_events.0001.t: "教会への遺贈"
 pam_theocratic_ruler_events.0001.desc: "裕福な商人が教会に遺産を残した。その額は決して少なくない。\n\n私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))]である[subordinate_priest.GetFirstName]が、勘定書と意向表明書を持ってきた。[subordinate_priest.GetSheHe|U]は私の判断を待っている。\n\n「遺言書には、この資金を[ROOT.Char.GetFaith.HighGodName]への信仰を強めるために使ってほしいと記されています」"
 pam_theocratic_ruler_events.0001.a: "[subordinate_priest.GetSheHe]が聖なる資金を不正に扱った証拠を見つけ出す…"
 pam_theocratic_ruler_events.0001.b: "「聖職者同士、共に考えよう」"
 pam_theocratic_ruler_events.0001.c: "感謝して大切に国庫へ入れるとしよう。"
 pam_theocratic_ruler_events.0001.b.success: "神の御業は不可思議だ"
 pam_theocratic_ruler_events.0001.b.failure: "司祭は納得しない"
 pam_theocratic_ruler_events.0001.b.toast.success: "あなたは[subordinate_priest.GetHerHim]を説得し、遺産を受け取る。"
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.GetSheHe|U]が[ROOT.Char.GetFaith.HighGodName]への寄進を預かる。"
 pam_theocratic_ruler_events.0002.t: "国境を越えた旅人"
 pam_theocratic_ruler_events.0002.desc: "隣国の統治者であり、[foreign_ruler.GetFaith.GetName]の古き教えに従う[foreign_ruler.GetTitledFirstName]が我が領地に入ったとの知らせが届いた。\n\nその小さな随行団の目的地は別にあるが、道中で我が宮廷の近くを通るらしく、私は彼らを正式な挨拶とともに迎え入れることが期待されている。\n\n彼らをどう迎えるべきだろうか？"
 pam_theocratic_ruler_events.0002.a: "ささやかな贈り物と和平の申し出を捧げよう。"
 pam_theocratic_ruler_events.0002.b: "「我らの民の間に、真の相互理解を築きたい」"
 pam_theocratic_ruler_events.0002.b.success: "私の礼節が彼らの心を動かす"
 pam_theocratic_ruler_events.0002.b.failure: "私の言葉は空しく響く"
 pam_theocratic_ruler_events.0002.b.toast.success: "あなたの礼節が功を奏し、民に寛容の心が育まれる"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.GetSheHe|U]は心を動かされず、あなたの言葉は空しく響く"
 pam_theocratic_ruler_events.0002.b.acceptance: "宮廷使節団"
 pam_theocratic_ruler_events.0002.c: "異教徒に我らの地を踏ませるわけにはいかない。"
 TRUCE_PAM_NEIGHBOR_GIFT: "\n贈り物と互いの敬意に基づく隣国との停戦協定"
 pam_theocratic_ruler_events.0003.t: "国境強化への助言"
 pam_theocratic_ruler_events.0003.desc: "戦と略奪者によって我が領地は幾度となく試練にさらされてきた。私は信頼する[advisor.GetCouncilTitle]である[advisor.GetTitledFirstName]を呼び、取るべき策を検討することにした。\n\n「[alliance_target.GetTitledFirstName]に働きかけることもできます。同じ信仰を持つ神権制の統治者として、我らに力を貸してくれるかもしれません」\n\nそれとも、この重荷は自ら背負うべきだろうか？"
 pam_theocratic_ruler_events.0003.a: "使節を送れ。我らは団結せねばならぬ。"
 pam_theocratic_ruler_events.0003.a.tt: "[alliance_target.GetShortUINameNoTooltip]と[alliance|E]を結ぶ"
 pam_theocratic_ruler_events.0003.b: "信心深い農民を国境防衛のために招集する。"
 pam_theocratic_ruler_events.0003.b.army: "信心深い農民"
 pam_theocratic_ruler_events.0003.c: "最近略奪を受けた伯爵領1つに援助を送り、復興させる。"
 pam_theocratic_ruler_events.0003.d: "この件は[ROOT.Char.GetFaith.HighGodNamePossessive]の手に委ねよう。"
 pam_theocratic_ruler_events.0004.t: "隣人たる修道士"
 pam_theocratic_ruler_events.0004.desc: "[monastic_order_head.GetPrimaryTitle.GetName]が近くにあるため、私は[monastic_order_head.GetTitledFirstName]を招き、さらなる協力関係を築くにはどうすれば良いか話し合った。\n\n「[monastic_order_head.GetFaith.HighGodName]よ、我らを裁く時は、我らの驕りではなく奉仕の心をご覧ください」[monastic_order_head.GetTitledFirstNameNoTooltip]は静かにこう述べた。"
 pam_theocratic_ruler_events.0004.a: "どうか、修道士たちから我が領地に祝福を授けてください。"
 pam_theocratic_ruler_events.0004.b: "あなたの弟子の[monastic_monk.GetTitledFirstNameNoTooltip]なら、我が宮廷の力となるだろう。"
 pam_theocratic_ruler_events.0004.c: "共に祈りを捧げよう。"
 pam_theocratic_ruler_events.0005.t: "信仰の剣"
 pam_theocratic_ruler_events.0005.desc: "[military_order_head.GetPrimaryTitle.GetName]が我が領国内に拠点を構えたため、私は[military_order_head.GetTitledFirstName]を招き、信仰の剣を互いのためにどう役立てるべきか話し合った。\n\n「[military_order_head.GetFaith.HighGodName]が祝福するのは眠れる鋼ではありません。信徒を守るために掲げられた刃です」[military_order_head.GetTitledFirstNameNoTooltip]がそう語る傍らで、[military_order_head.GetHerHis]の従者の[order_knight.GetTitledFirstName]は静かに頭を下げている。"
 pam_theocratic_ruler_events.0005.a: "我が[ROOT.Char.Custom('GetFighterTermPlural')]に、そちらの規律を叩き込んでくれ。"
 pam_theocratic_ruler_events.0005.b: "[order_knight.GetTitledFirstNameNoTooltip]を我が護衛に迎えよう。"
 pam_theocratic_ruler_events.0005.c: "正義の戦について語り合おう。"
 pam_theocratic_ruler_events.0006.t: "十分の一税か慈悲か"
 pam_theocratic_ruler_events.0006.desc: "村長の[local_peasant_leader.GetTitledFirstName]が私の前に連れてこられた。村民が教会税の納付を拒んだかと思ったら、今度は困窮を訴えているのだ。\n\n「冬は厳しいものでした、我が[ROOT.Char.GetLadyLord]。我らの穀倉はほとんど空なのです」[local_peasant_leader.GetSheHe]は震える声で言った。\n\n問題は明白である。恐怖によって伯爵領に規律をもたらすか、慈悲によって平穏を守るかだ。"
 pam_theocratic_ruler_events.0006.a: "例外は認めぬ。主導者を捕らえよ。"
 pam_theocratic_ruler_events.0006.a.tt: "[gold_i] [EmptyScope.ScriptValue('minor_gold_value')|0]を獲得し、[local_peasant_leader.GetShortUINameNoTooltip]を投獄する。[troubled_county.GetName]は5年間#N 強制的な十分の一税#!を課せられる（#N -20#!の[county_opinion|E]）。"
 pam_theocratic_ruler_events.0006.b: "今回は見逃そう。慈悲の心を持つことも神への奉仕となる。"
 pam_theocratic_ruler_events.0006.b.tt: "[piety_i] [EmptyScope.ScriptValue('minor_piety_gain')|0]を獲得し、[troubled_county.GetName]は5年間#P 寛大な十分の一税#!を課せられる（#P +20#!の[county_opinion|E]）。"
 pam_theocratic_ruler_events.0006.c: "我が家令が期待を裏切った。責任は家令にある。"
 pam_theocratic_ruler_events.0006.c.tt: "可能な場合、[ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip]への[hook|E]を獲得する（利用可能な場合はより強力な義務フックが使用される）。[ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip]のあなたへの[opinion|E]が低下する（#N -20#!、5年間で減衰）。"
 pam_theocratic_ruler_events.0007.t: "至福の調和"
 pam_theocratic_ruler_events.0007.desc: "穏やかな日差しが朝露を払い、教会の墓地の石を温めていくのを見て、私は気づく——珍しく、務めに追い立てられていないのだ。働き者の蜜蜂さえも、陽光を浴びて背中を温めるために一息ついているようだ。\n\n我が領地は静かな秩序に包まれている。国庫には金があり、我が信徒たちは満足し、敬虔である。我が主君である[ROOT.Char.GetLiege.GetTitledFirstName]でさえ、私が[ROOT.Char.GetLiege.GetHerHis]の臣民をキリストへと導いていることに対してお褒めの言葉を口にする。"
 pam_theocratic_ruler_events.0007.a: "平和は甘美だが、[ROOT.Char.GetFaith.HighGodName]は私にまだ偉大な使命を用意されている。"
 pam_theocratic_ruler_events.0007.b: "秩序正しく、神聖な生活の福音を広めよう。"
 pam_theocratic_ruler_events.0007.c: "ただ耳を傾け、静かにしていよう。"
 pam_theocratic_ruler_events.0008.t: "石の上に石を"
 pam_theocratic_ruler_events.0008.desc: "[stone_province.GetName]を継承して以来、[GetBuilding('curtain_walls_01').GetName]のある城を所有している。私は、世俗的な統治のために築かれたこの見事な石造りに目を留めてきた。しかし、信心深い者たちにとって、防壁は本当に必要なのだろうか？\n\n私の私有地には、私の名にふさわしい[GetDomicileBuilding('episcopal_palace_01').GetName]はないが、ここにはすでに世俗の手によって積み上げられた切り石がある。"
 pam_theocratic_ruler_events.0008.a: "この原始的な壁から余った石材を利用しよう。"
 pam_theocratic_ruler_events.0008.b: "壁を取り壊し、私の[GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]を築こう。"
 pam_theocratic_ruler_events.0008.c: "人間の手のあらゆる業は、目に見える形となった祈りである。"
 pam_theocratic_ruler_events.0008.c.flavor: "あなたは[GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]の信条を持っている"
 pam_theocratic_ruler_events.0008.d: "彼らには防壁が必要かもしれない。"
 pam_theocratic_ruler_events.0009.t: "よき牧者であれ"
 pam_theocratic_ruler_events.0009.desc: "我が信徒たちから、涙に濡れた報告が届いた。それによると、[heir.GetTitledFirstName]が前回の説教の最中に怒りを露わにしたという。彼らは、[heir.GetSheHe]が課す厳しい規律を守り切れないと訴えている。\n\n問い質すと、[heir.GetSheHe]は激怒する。\n\n「ああ、あの下劣な罪人どもめ！奴らの贖罪の真似事には、到底我慢できない」"
 pam_theocratic_ruler_events.0009.a: "「牧者は穏やかであるべきだ。情熱を抑えなさい」"
 pam_theocratic_ruler_events.0009.a.success: "あなたの助言は[heir.GetHerHis]に届く"
 pam_theocratic_ruler_events.0009.a.failure: "あなたの言葉では[heir.GetHerHim]を鎮められない"
 pam_theocratic_ruler_events.0009.a.toast.success: "助言成功"
 pam_theocratic_ruler_events.0009.a.toast.failure: "助言失敗"
 pam_theocratic_ruler_events.0009.b: "私は失望して、静かに首を横に振る。"
 pam_theocratic_ruler_events.0009.b.flavor: " [heir.GetSheHe|U]には私の祝福はなく、統治する資格もない "
 pam_theocratic_ruler_events.0009.c: "「祈りを捧げよ。肉体を律せよ」"
 pam_theocratic_ruler_events.0010.t: "剣か司教杖か"
 pam_theocratic_ruler_events.0010.desc: "この領地の統治者として、私は祝福だけでなく剣をもって[ROOT.Char.GetFaith.HighGodName]に仕えることを余儀なくされてきた。\n\n[pilgrimage_memory.GetDescription]時、そして[battle_memory.GetDescription]時のことを私は鮮明に覚えている。戦場には死体が山積みとなっていた。我が従者たちは私が目の前の任務から逃げ出さないことを知っている。\n\nこの領地の未来を見据えるにあたり、我が[ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle]である[ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName]と、我が[ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle]である[ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName]は、どちらもそれぞれの道具——剣か、それとも司教杖——をこの国の歩みの主軸に据えることを望んでいる。"
 pam_theocratic_ruler_events.0010.a: "剣を尊ぶ。"
 pam_theocratic_ruler_events.0010.b: "司教杖が先導すべきだ。"
 pam_theocratic_ruler_events.0010.c: "剣と司教杖を共に役立てよう。"
 pam_theocratic_ruler_events.0011.t: "倒れし騎士の安息"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName]が私の前にひざまずき、[ROOT.Char.GetFaith.HighGodName]を守って戦死した[landed_subject.GetHerHis]の親族についての知らせをもたらした。\n\n「彼は多くの異教徒を相手に健闘しましたが、傷が深すぎました。最後の別れを告げることができたのが、せめてもの救いです」\n\n「どうか、祭壇の通路の下に、剣を傍らに添え、彼に安息の地を与えてください。そうしていただけるなら、生涯感謝いたします」"
 pam_theocratic_ruler_events.0011.a: "墓石の代金を払えば、ここに眠らせてやろう。"
 pam_theocratic_ruler_events.0011.a.flavor: "騎士は教会内に埋葬される。"
 pam_theocratic_ruler_events.0011.b: "剣を寄付するならば、地下納骨堂を利用してもよい。"
 pam_theocratic_ruler_events.0011.b.flavor: "騎士は剣を持たずに埋葬される。"
 pam_theocratic_ruler_events.0011.c: "戦士たちは広々とした空の下で眠るべきだ。"
 pam_theocratic_ruler_events.0011.c.flavor: "騎士は教会の壁の外に埋葬される。"
 pam_fallen_knight_crusader_sword_name: "十字軍の剣"
 pam_fallen_knight_crusader_sword_desc: "信仰を守るために命を落とした騎士が携えていた剣。異教徒の刃によって刻まれた無数の傷があり、柄には小さな十字架が刻み込まれている。"
 pam_theocratic_ruler_events.0012.t: "聖なる森とされていた場所"
 pam_theocratic_ruler_events.0012.desc: "私の従者たちが、小道を包み込む森の辺りで歩みを緩める。[grove_county.GetNameNoTier]の信者の一人である[grove_subject.GetTitledFirstName]が、両手を広げて挨拶しながら木々の間から現れた。\n\n「もしあなたが本当にこの地の信徒たちの心を掴みたいのなら、[ROOT.Char.GetFaith.HighGodName]がすでにここに植えられたものを聞き入れ、受け入れなければなりません。[grove_province.GetName]の古木が生い茂る森のそばに神殿を建てれば、人々はあなたが誰の牧者であるかを知るでしょう」"
 pam_theocratic_ruler_events.0012.a: "自然に私の信仰を導かせよう。"
 pam_theocratic_ruler_events.0012.b: "その森を見せてくれ。"
 pam_theocratic_ruler_events.0012.b.success: "従者たちは後で木材を回収するために戻ってくる"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip]はあなたの策略を見抜く"
 pam_theocratic_ruler_events.0012.b.toast.success: "古代の木々は金のために運び去られる。"
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip]はあなたの冒涜を言いふらす。"
 pam_theocratic_ruler_events.0012.c: "この森には悪魔の臭いが漂っている。"
 pam_theocratic_ruler_events.0013.t: "天使の着想"
 pam_theocratic_ruler_events.0013.desc: "今日のミサの最中、まるで神の啓示を受けたかのように、この世のものとは思えないほど美しく澄んだ声がカントルの声に重なるように響き渡った。\n\n[angelic_singer.GetTitledFirstName]が歌うと信徒たちは静まり返り、最後の音が消え去ってからも、私はなおその歌声に耳を傾けていた。"
 pam_theocratic_ruler_events.0013.a: "「あなたのその賜物は[ROOT.Char.GetFaith.HighGodName]のものだ。誓いを立て、仕えなさい」"
 pam_theocratic_ruler_events.0013.a.success: "あなたの言葉が[angelic_singer.GetHerHim]を信仰へと導く"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip]は説得に応じない"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip]は誓いを立て、あなたの宮廷に加わる。"
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip]は断り、立ち去る。"
 pam_theocratic_ruler_events.0013.b: "私の客人としてとどまりなさい。その声をもう一度聴かせてほしい。"
 pam_theocratic_ruler_events.0013.c: "歌唱は我がカントルに任せよう。"
 pam_theocratic_ruler_events.0014.t: "改宗者の嘆願"
 pam_theocratic_ruler_events.0014.desc: "私の説教の折、[neighbour_faith.GetNameNoTooltip]の古い信仰から改宗した[convert_peasant.GetCulture.GetNameNoTooltip]の[convert_peasant.GetTitledFirstName]が群衆をかき分けて近づいてきた。\n\n「古き慣習からは、今なお学ぶべきことが多くあります。もしあなたが心を開いてそれらを考慮してくださるなら、我々の民は、あなたが我々の伝統を敬っていることを知るでしょう。私の同胞たちはあなたの元に集い、あらゆる取り組みを支援するでしょう」\n\n[convert_peasant.GetSheHe|U]は私の祝福と、答えとしての静かなうなずきを待っている。"
 pam_theocratic_ruler_events.0014.a: "目障りなこの穢れた者を連れて行け。"
 pam_theocratic_ruler_events.0014.a.flavor: "あなたは[trait|E]「[GetTrait('arrogant').GetName( GetNullCharacter )]」を持っている"
 pam_theocratic_ruler_events.0014.a.acceptance: "改宗者の嘆願を拒否"
 pam_theocratic_ruler_events.0014.b: "[offered_tenet_a.GetBaseNameNoTooltip]を私自身のものとして受け入れる。"
 pam_theocratic_ruler_events.0014.b.tt: "[great_project|E]「[GetGreatProjectType('pam_mass_rite_conversion').GetName|V]」における次回の「#V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#!」への寄付が無料になる。"
 pam_theocratic_ruler_events.0014.c: "[offered_tenet_b.GetBaseNameNoTooltip]を私自身のものとして受け入れる。"
 pam_theocratic_ruler_events.0014.c.tt: "[great_project|E]「[GetGreatProjectType('pam_mass_rite_conversion').GetName|V]」における次回の「#V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#!」への寄付が無料になる。"
 pam_theocratic_ruler_events.0014.d: "羊が羊飼いを導くというのか？"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "改宗者の嘆願"
 pam_theocratic_ruler_events.0015.t: "後継者たちへの導き"
 pam_theocratic_ruler_events.0015.desc: "私亡き後、この司教座には、祈りだけでなく裁きにおいても導くことのできる牧者が求められるだろう。継承順位第1位の[succession_heir_first.GetTitledFirstName]と、そのすぐ後に続く[succession_heir_second.GetTitledFirstName]が、内々に私の前で聖句を暗唱するよう招かれた。\n\nそのうちの一人が私の重責を継ぐことになるが、今日、二人を等しく鍛え上げることはできない。\n\n「我が信仰の子らよ。暗記したことだけでなく、自分自身のものとしたことを私に見せなさい」"
 pam_theocratic_ruler_events.0015.a: "聖書について[succession_heir_first.GetFirstNameNoTooltip]を指導する。"
 pam_theocratic_ruler_events.0015.b: "聖典を通して[succession_heir_second.GetFirstNameNoTooltip]を導く。"
 pam_theocratic_ruler_events.0015.c: "私がまだ牧者だ。私が暗唱を行おう。"
 pam_theocratic_ruler_events.0015.c.success: "あなたの学識は彼らの暗唱を凌駕する"
 pam_theocratic_ruler_events.0015.c.failure: "あなたは彼らが暗記している一節でつまずいてしまう"
 pam_theocratic_ruler_events.0015.c.toast.success: "彼らはあなたの教義への造詣の深さに心を動かされる。"
 pam_theocratic_ruler_events.0015.c.toast.failure: "あなたの下位者たちが、あなたの間違いに顔を見合わせる。"
