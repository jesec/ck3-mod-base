l_japanese:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "自身の[faith|E]のものではない慣習が頭から離れなくなり、あなたは[pam_sf_seeded_tenet.GetBaseName]の[core_tenet|E]の[agnostic_knowledge|E]を得た。"
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U]が[TARGET_CHARACTER.GetShortUIName]の代父母を務め、その精神的な絆は友情へと発展した。"
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]が[CHARACTER.GetShortUIName]の代父母を務め、その精神的な絆は友情へと発展した。"
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は、信仰への共通の信念によって心を通わせた。"
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は最も親しい友人となり、信仰への共通の信念によってその絆は深まった。"
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U]は[TARGET_CHARACTER.GetShortUIName]を宗教迫害から守った。"
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は[CHARACTER.GetShortUIName]を宗教迫害から守った。"
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は、信仰に対し同じ信念を抱くなかで惹かれ合い、恋人同士となった。"
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は、神聖な陶酔を分かち合った夜、恋人同士となった。"
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は、告解室で赦し以上のものを見出し、恋人同士となった。"
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は、信仰の複雑さについて語り合った末に恋人同士となった。"
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は運命の人となり、その愛は信仰への共通の信念によって深まった。"
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U]は、[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip]の聖職位を金銭を支払うことのできる見知らぬ他人に売り渡した。"
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は、[CHARACTER.GetShortUINamePossessiveNoTooltip]の聖職位を金銭を支払うことのできる見知らぬ他人に売り渡した。"
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U]は[CHARACTER.GetShortUIName]を修道院へと追いやることで、[CHARACTER.GetHerHim]に聖なる誓いを立てさせた。"
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U]は[TARGET_CHARACTER.GetShortUIName]を修道院へと追いやることで、[TARGET_CHARACTER.GetHerHim]に聖なる誓いを立てさせた。"
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "師父"
 pam_my_liege_reverend_mother: "師母"
 pam_my_liege_captain: "隊長"
 pam_my_liege_khan: "大ハン"
 pam_my_liege_khatun: "大ハトゥン"
 pam_my_liege_chieftain: "我が族長"
 pam_my_liege_serene_lord: "至高の領主"
 pam_my_liege_serene_lady: "至高の夫人"
 pam_my_liege_lord: "我が君"
 pam_my_liege_lady: "我が君"
 pam_my_liege_liege: "我が主君"
 pam_secular_faith_events.0001.t: "聖なる煙"
 pam_secular_faith_events.0001.desc: "我が[ROOT.Char.Custom2('RelationToMeShort', chaplain)]である[chaplain.GetFirstName]が香炉を持って身廊を歩いている。聖なる煙が梁へと立ち上り、会衆の囁くような祈りを運んでいく。\n\n一瞬、あらゆる創造物が[ROOT.Char.GetFaith.PositiveAfterLife]へと手を伸ばしているように感じられる。そして私もまた、そこに向かっているように思える。"
 pam_secular_faith_events.0001.a: "祈りに身を委ねよう。"
 pam_secular_faith_events.0001.b: "この儀式は[ROOT.Char.GetFaith.WealthGodName]に捧げられるべきだ。"
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('GetCourt')]もこの信心を分かち合うべきだ。"
 pam_secular_faith_events.0002.t: "ピクアハ・ネフェシュ"
 pam_secular_faith_events.0002.desc: "我が領地を通りかかった旅人[traveler_in_danger.GetTitledFirstName]が、[background_terrain_scope.GetName]で山賊に襲われた！\n\n[traveler_in_danger.GetHerHis|U]の命が危ういが、[ROOT.Char.GetFaith.HighGodNamePossessive]の聖日に武器を取ることは禁じられている。安息日を破る権限は私にはない。日没を待てば、[traveler_in_danger.GetHerHim]を埋葬するためだけに駆けつけることになるかもしれない。\n\nだが、命が危機に瀕しているというのに、ただ手をこまねいて見ているだけでよいのだろうか？"
 pam_secular_faith_events.0002.a: "命は何よりも重い。出立するぞ。"
 pam_secular_faith_events.0002.b: "我が[ROOT.Char.Custom2('RelationToMeShort', chaplain)]、[chaplain.GetFirstNameNoTooltip]に相談しなければならない。"
 pam_secular_faith_events.0002.c: "安息日を破るわけにはいかない。"
 pam_secular_faith_events.0003.t: "夜の幻視"
 pam_secular_faith_events.0003.desc: "夢以上の何か——炎の柱、私の名を知る声、忘れられない顔…に囚われて目を覚ました。\n\n私のもとに訪れたのは[ROOT.Char.GetFaith.HighGodName]だったのか？それとも[ROOT.Char.GetFaith.HealthGodName]？いや、麗しい姿に化けた[ROOT.Char.GetFaith.DevilName]か…\n\nあるいは、熱に浮かされた血が見せたただの幻だったのかもしれない。"
 pam_secular_faith_events.0003.a: "その声は至福の真実を囁いた…"
 pam_secular_faith_events.0003.b: "熱に浮かされた妄想か…類似した事例について調べなければならない。"
 pam_secular_faith_events.0003.c: "私が見たものを[ROOT.Char.Custom('GetCourt')]に伝えなければ！"
 pam_secular_faith_events.0004.t: "禁断の真理"
 pam_secular_faith_events.0004.desc: "眠れぬまま、私は疑念に満ちて、[ROOT.Char.Custom('ResidenceBuilding')]の暗い[ROOT.Char.Custom('ResidenceBuildingHallsType')]を歩き回っている。\n\n私の心は、信仰が断罪するもの——[pam_sf_forbidden_tenet.GetBaseName]へと何度も引き戻されてしまう。悩むべきことのはずなのに、その信念には何らかの正当な真理があるように感じられ、この考えを頭から追い払うことができない。"
 pam_secular_faith_events.0004.a: "この真理を貫こう——だが、ひっそりと。"
 pam_secular_faith_events.0004.b: "いや、私は道を踏み外したりはしない。"
 pam_secular_faith_events.0005.t: "蝋燭の明かりの下で"
 pam_secular_faith_events.0005.desc_intro: "夕方の勉学で心を落ち着かせるはずが、ある一節が今も頭から離れない。\n\n"
 pam_secular_faith_events.0005.desc_tenet: "それは彼らが[pam_sf_revelation_tenet.GetBaseName]と呼ぶ信条に関するもので、私の信仰では決して容認されない慣習である。私は自分に、それは野蛮だと言い聞かせる。"
 pam_secular_faith_events.0005.desc_doctrine: "それは[pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )]という教義に関するもので、私の信仰では決して容認されない教えだ。私は自分に、それは誤りだと言い聞かせる。"
 pam_secular_faith_events.0005.desc_end: "それでも、蝋燭の明かりの下で、他の者がなぜそれを信じるのか、理解できる気がする。"
 pam_secular_faith_events.0005.a: "自分の考えを書き留めなければならない。"
 pam_secular_faith_events.0005.b: "理解するだけなら、害はないだろう。"
 pam_secular_faith_events.0005.c: "祈りがこれらの雑念を清めてくれるだろう。"
 pam_secular_faith_events.0006.t: "聖人の骨"
 pam_secular_faith_events.0006.desc: "旅に疲れ果てた巡礼者が市場で私の目を引いた。[relic_seller.GetHerHis]の震える手に握られているのは、黄色く変色した指の骨だ。\n\n「聖人の骨です」と、[relic_seller.GetWomanMan]は断言する。「[GetTitleByKey('c_jerusalem').GetNameNoTier]への旅の途中で見つけましたが、[ROOT.Char.GetTitleAsNameNoTooltip]様のお手元にある方が安全でしょう」\n\n学識ある目なら、その主張の真偽を見極められるだろう。都合の良いことに、[relic_seller.GetWomanMan]はその聖遺物を売りに出している。"
 pam_secular_faith_events.0006.a: "代金を払う前に、鑑定させてほしい。"
 pam_secular_faith_events.0006.b: "私が買い取ろう。"
 pam_secular_faith_events.0006.c: "見知らぬ者の骨など要らん。立ち去れ。"
 pam_sf_acquire_relic_tt: "あなたは一般的な[rarity|E]の聖遺物の[artifact|E]を手に入れる"
 pam_sf_examine_relic_tt: "あなたの聖遺物の[artifact|E]を手に入れる。[rarity|E]はあなたの[learning_i] [learning_skill|E]によって決まる"
 pam_sf_acquire_relic_toast: "聖遺物を獲得"
 pam_sf_fingerbone_relic_name: "聖[SCOPE.Custom('PamFingerboneSaint')]の指骨"
 pam_sf_fingerbone_relic_desc: "黄ばんだ指骨。聖[SCOPE.Custom('PamFingerboneSaint')]の聖遺物として崇められ、小さな聖遺物箱に収められている。"
 pam_secular_faith_events.0007.t: "傲慢な司教"
 pam_secular_faith_events.0007.desc: "我が[defiant_bishop.GetTitleAsNameNoTooltip]の一人である[defiant_bishop.GetFirstName]は、高慢で人脈も広く、密かに自分が私より優れていると確信している。最近何人かの召使いたちが病に倒れたため、私は[defiant_bishop.GetHerHim]に我が家の加護を祈るよう求めた。\n\n召喚を何日も無視した挙句、ようやく到着した[defiant_bishop.GetSheHe]は、ニヤリと笑ってこう言った。「遅れたことについての許しを乞いたいところですが、私はいかなる[ROOT.Char.GetTitleAsNameNoTooltip]よりも偉大な主の命令に従っておりますので」"
 pam_secular_faith_events.0007.a: "貴殿の地位にふさわしい尊厳をもって進めよう。"
 pam_secular_faith_events.0007.b: "お願いだ。とにかく儀式を執り行ってくれ。"
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName]がお前の主かもしれないが、私はお前の主君だ。出て行け！"
 pam_secular_faith_events.0008.t: "罪の重み"
 pam_secular_faith_events.0008.desc: "蝋燭の火が小さくなり、同じ考えが再び頭をよぎる。私は[penance_sin.GetName(ROOT.Char)]であり、私の信仰はこの行為を罪の一つとみなしている。\n\nどんなにこの考えを振り払おうとも、罪悪感は消えない。\n\n「自らを律するのです。そうすれば、あなたの魂は重荷から解放されるでしょう」私の[ROOT.Char.Custom2('RelationToMeShort', confessor)]である[confessor.GetFirstName]は、叱責もしなければ断罪もせず、そう言う。「この贖罪を果たしなさい。道を踏み外してはなりません」"
 pam_secular_faith_events.0008.a: "[confessor.GetFirstNameNoTooltip]の助言に従おう。"
 pam_secular_faith_events.0008.b: "まだ心構えができていない。"
 pam_secular_faith_events.0009.t: "キリストのような見知らぬ人"
 pam_secular_faith_events.0009.desc: "我が門の前に、傷跡のある一人の見知らぬ者が立ち、施しを求めて手を差し伸べている。\n\n「お邪魔でなければ幸いです、[ROOT.Char.Custom('ComplimentAdjective')][ROOT.Char.GetTitleAsNameNoTooltip]」と、[stranger.GetSheHe]は優雅に一礼して言う。「もしお許しいただけるなら、ほんの少しばかり何か恵んでいただけませんか」\n\n[stranger.GetSheHe|U]は物乞いにしては妙に教養のある話し方をする。誰を門前払いしたのか、後になってみなければわからないものだ。"
 pam_secular_faith_events.0009.a: "お入りなさい。我が[ROOT.Char.Custom('ResidenceBuilding')]はあなたのために開かれている。"
 pam_secular_faith_events.0009.b: "このパンを受け取り、安らかに去るがいい。"
 pam_secular_faith_events.0010.t: "寒さから逃れてきた者"
 pam_secular_faith_events.0010.desc_blessed: "私が門から迎え入れたこの[stranger.GetWomanMan]は、ただの浮浪者ではなかった——[stranger.GetFirstName]は聖典や国政についてあまりにも流暢に語るため、学識ある臣下たちすら黙り込んで聞き入ってしまうほどだ。\n\nどうやら我が門を訪れたのは、やはり[ROOT.Char.GetFaith.HighGodName]ご自身だったようだ。[stranger.GetHerHim]をこれ以上放浪させるわけにはいかない。"
 pam_secular_faith_events.0010.desc_thief: "目を覚ますと、暖炉は冷めきり、金庫は開け放たれていた。\n\nパンと宿を提供した恩を仇で返されるとは。\n\n[stranger.GetFirstName]は夜のうちに姿を消し、我が富も一緒に持ち去られてしまった。\n\n家中の者が騒ぎ立てるころには、[stranger.GetSheHe]はすでに我が城壁を越え、手の届かないところへ行ってしまっていた。"
 pam_secular_faith_events.0010.a: "あの者は、何らかの理由でここに遣わされたに違いない。"
 pam_secular_faith_events.0010.b: "私は食卓に毒蛇を招き入れてしまった。"
 pam_secular_faith_events.0011.t: "悔悛者"
 pam_secular_faith_events.0011.desc: "雷鳴ではなく、鞭の打ち鳴らされる音で私は目を覚ました。\n\n悔悛者の集団が我が[ROOT.Char.Custom('ResidenceBuilding')]の外に集まっている。背中が擦りむけ、血まみれになりながら、[ROOT.Char.GetFaith.HighGodName]が[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )]を求めていると叫んでいる。\n\n家臣たちは、どうすべきか私の指示を待っている。"
 pam_secular_faith_events.0011.a: "この行為には、何か深い真理があるのだろうか？"
 pam_secular_faith_events.0011.b: "私にも鞭を打て！——私もまた、罪を犯したのだから。"
 pam_secular_faith_events.0011.c: "この狂った者どもを我が領地から追い出せ！"
 pam_secular_faith_events.0012.t: "武具の祝福"
 pam_secular_faith_events.0012.desc: "平和とは、恵みではなく一時的な借り物にすぎない。\n\n[ROOT.Char.GetFaith.WarGodName]の祭日に、我が[ROOT.Char.Custom2('RelationToMeShort', chaplain)]である[chaplain.GetFirstName]が、我が家門の武具を聖別すると申し出た。\n\n「ダビデにゴリアテを討つ力を与えた神よ、どうかその力を[ROOT.Char.GetHouse.GetBaseName]家にもお授けください——弱き者の守護のために、常に立ち上がらんことを」と、[chaplain.GetSheHe]は祈る。"
 pam_secular_faith_events.0012.a: "いざという日のために、我が旗と剣を祝福せよ。"
 pam_secular_faith_events.0012.b: "それよりも、平和のために祈ろう。"
 pam_secular_faith_events.0012.c: "静かな祝福で十分だ。"
 pam_secular_faith_events.0013.t: "預言された死"
 pam_secular_faith_events.0013.desc: "狂気じみた目をした説教師が私の前に引きずり出された。民衆を扇動し、予言を行ったとして告発された[prophet.GetSheHe]は、震える指をためらうことなく我が[ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )]である[doomed_soul.GetTitledFirstName]へと突きつけた。\n\n「この者を見よ！」と、[prophet.GetSheHe]は叫ぶ。「次の月が巡る前に、[doomed_soul.GetSheHe]はこの大地に横たわる冷たい骸となるだろう。[ROOT.Char.GetFaith.HighGodName]がその正確な時刻を私に示されたのだ！」\n\n[prophet.GetHerHis|U]の確信に満ちた様子は不安を搔き立てる。だが[doomed_soul.GetFirstNamePossessiveNoTooltip]の怯えようには、もっと不安を感じる。"
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName]は時に、奇妙な者の口を通じて語られるものだ…"
 pam_secular_faith_events.0013.b: "失せろ、狂った愚か者めが！"
 prophecy_foretold_tt: "預言が下されたのだ。もしかしたら本当のことでは？"
 prophecy_foretold_2_tt: "預言などくだらない。全くの戯言だ！"
 pam_secular_faith_events.0014.t: "預言の結末"
 pam_secular_faith_events.0014.desc_fulfilled: "新月の夜が過ぎ、[doomed_soul.GetTitledFirstName]は死んだ——眠りの中で静かに息を引き取ったのだ。\n\nあのぼろをまとった預言者は、まさにその時刻を言い当てていた。私はそれを忘れることができない。\n\nこれは預言だったのか…それとも恐怖が現実になったのだろうか？"
 pam_secular_faith_events.0014.desc_failed: "新月の夜が過ぎたが、[doomed_soul.GetTitledFirstName]は今なお生きている。あのぼろをまとった預言者が告げた時刻は過ぎたが、何も奪われることはなかった。\n\n[prophet.GetSheHe|U]は詐欺師か愚か者だ。間違いなく[ROOT.Char.GetFaith.HighGodName]の代弁者などではない。"
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\n何だか馬鹿げた気分だ。"
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U]は真の預言者だ！"
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName]の御業は人知を超えている。"
 pam_secular_faith_events.0014.c: "なぜあんな出まかせの預言を信じてしまったのだ！？"
 pam_secular_faith_events.0014.d: "あの預言を信じるべきだった…"
 pam_secular_faith_events.0014.e: "あの説教師は、私が言った通り詐欺師だった！"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U]が宗教的[inspiration|E]を得る"
 pam_secular_faith_events.0015.t: "涙を流す聖像"
 pam_secular_faith_events.0015.desc: "私の[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、私を急かして[miracle_church.GetName]へと連れて行く。中に入ると、聖人の描かれた目から芳香を放つ油が流れている。\n\n奇跡の噂はどんな伝令よりも早く広がる。そして奇跡とは強力で、危険なものでもある。"
 pam_secular_faith_events.0015.a: "奇跡だと？調べなければならん。"
 pam_secular_faith_events.0015.b: "信者たちを呼べ。参拝させてやろう。"
 pam_secular_faith_events.0015.c: "この祝福を他者と分かち合うわけにはいかない。"
 pam_secular_faith_events.0015.d: "我が領国は祝福された！"
 no_miracles_tt: "この奇跡はいささか胡散臭いぞ…"
 pam_secular_faith_events.0016.t: "説教壇の値段"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U][candidate.GetWomanMan]が我が[ROOT.Char.Custom('ResidenceBuilding')]に足を踏み入れる。頼み事をするためではなく、金で便宜を買うためだ。\n\n「貴殿の[old_realm_priest.GetCouncilTitle]である[old_realm_priest.GetFirstName]は素晴らしい牧者です」と、[candidate.GetSheHe]は呟き、ずっしりと重い財布をテーブルにドサリと置いた。「しかし、私ならばもっと…感謝を知る牧者となれるでしょう。あの者の職を私に与え、[ROOT.Char.GetFaith.WealthGodNamePossessive]の祝福をお受け取りください」"
 pam_secular_faith_events.0016.desc_sanctioned: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )]を恥じることなどない。銀貨も悪くない。"
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )]は罪だ。この金を受け取れば、私の魂は黒く染まってしまう。"
 pam_secular_faith_events.0016.a: "結局のところ、金は罪よりも重いのだ…"
 pam_secular_faith_events.0016.b: "適正な代価を、公正に支払った。その職は君のものだ。"
 pam_secular_faith_events.0016.c: "聖職位は売り物ではない。"
 pam_secular_faith_events.0017.t: "[ROOT.Char.Custom('GetCourt')|U]の異端者"
 pam_secular_faith_events.0017.desc: "「異端者め！」我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、[accused.GetFirstName]を非難するように指を突きつけた。「[accused.GetFirstNamePossessiveNoTooltip]の忌まわしい[accused.GetRite.GetAdjective]の影響が、あなたの[ROOT.Char.Custom('GetCourt')]に及んでいるのに気がつかないのですか？[accused.GetSheHe|U]は悔い改め、[ROOT.Char.GetFaith.HighGodName]を受け入れなければなりません！」\n\n[accused.GetFirstNameNoTooltip]は毅然とした表情を崩さないが、その非難が[accused.GetHerHis]の心を深く傷つけているのは明らかだ。"
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip]よ、私がお前を信仰へと導こう。"
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip]が改宗する"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName]の心は動かない"
 pam_secular_faith_events.0017.b: "ならば独房で悔い改めるがいい。[accused.GetHerHim]を拘束せよ。"
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip]は我が保護下にある。追及はそこまでにせよ。"
 pam_secular_faith_events.0018.t: "神に捧げられたる子"
 pam_secular_faith_events.0018.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', pious_child )]である[pious_child.GetFirstName]は、普通の子供とは違う。ほかの子たちが遊んでいる間も、[pious_child.GetSheHe]は礼拝堂で過ごす。\n\n「[pious_child.GetHerHim]のような子は見たことがありません」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が静かに言う。「[pious_child.GetSheHe|U]は何時間も祈りを捧げ、ミサの最中には涙を流すのです。[pious_child.GetFirstNameNoTooltip]が[GetTrait('devoted').GetName( pious_child )]としての人生を望んでおられるのは一目瞭然です」"
 pam_secular_faith_events.0018.a: "[ROOT.Char.GetFaith.HighGodName]に仕えよ、だがここに留まれ。"
 pam_secular_faith_events.0018.b: "教会に我が[pious_child.Custom('GetDaughterSon')]を差し出そう。"
 pam_secular_faith_events.0018.c: "いや、[pious_child.GetSheHe]は我が[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家のものだ。"
 pam_secular_faith_events.0019.t: "神の平和"
 pam_secular_faith_events.0019.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、重大な知らせを携えてやってきた。\n\n「[ROOT.Char.GetFaith.HighGodNamePossessive]の御前で兄弟が兄弟を殺してはなりません」と、[chaplain.GetSheHe|U]が訴える。「[feud_attacker.GetTitledFirstName]と[feud_defender.GetTitledFirstName]が剣を交えて争うことで、犠牲となっているのは庶民たちなのです！」\n\n「どうかこれを終わらせてください。[GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )]をもって彼らを縛るのです」"
 pam_secular_faith_events.0019.a: "[ROOT.Char.GetFaith.HighGodName]の御名にかけて、平和をもたらそう。"
 pam_secular_faith_events.0019.b: "剣を抜いたすべての領主に責任を取らせよう。"
 pam_secular_faith_events.0019.c: "封臣の争いを裁くのは、私の役目だ。"
 pam_sf_peace_of_god_ends_wars_tt: "あなたの[vassals|E]間のすべての[war|E]が[white_peace|E]で終戦する"
 pam_secular_faith_events.0020.t: "[temple_location.GetNameNoTooltip]の[ROOT.Char.GetFaith.HouseOfWorship|U]"
 pam_secular_faith_events.0020.desc: "石工たちが、私が初めて建てた[ROOT.Char.GetFaith.HouseOfWorship]の最後の石をここ[temple_location.GetName]の[temple_location.Custom('TerrainTypeProvincePrefix')][temple_location.Custom('TerrainTypeProvince')]に据えつけた。\n\n我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、香炉を手に敷地内を歩いている。\n\n「貴殿が[ROOT.Char.GetFaith.HighGodName]に捧げた[ROOT.Char.GetFaith.HouseOfWorshipPlural]によって、貴殿の名は語り継がれるでしょう」と、[chaplain.GetSheHe]は言う。「これを第一歩とし、この先も数多くの[ROOT.Char.GetFaith.HouseOfWorshipPlural]を築かれんことを」"
 pam_secular_faith_events.0020.a: "[chaplain.GetFirstNameNoTooltip]よ、我々の祈りを導いてくれ。"
 pam_secular_faith_events.0020.b: "[ROOT.Char.GetFaith.HouseOfWorship]を中心に、[consecrated_county.GetNameNoTierNoTooltip]が繁栄しますように。"
 pam_secular_faith_events.0020.c: "この壁の中で知恵を求めよう。"
 pam_secular_faith_events.0020.d: "[ROOT.Char.GetFaith.HighGodNamePossessive]の御業はまだ始まったばかりだ。"
 pam_secular_faith_events.0021.t: "天の徴"
 pam_secular_faith_events.0021.desc: "どうしても眠りにつくことができない。[ROOT.Char.Custom('GetCourtyard')]の静かな闇に身を置き、私は夜空を仰ぎ見る。今宵、天は私に[ROOT.Char.Custom('GetPamCelestialOmen')]を示している。\n\nこのような兆しには、必ず意味があるものだ。"
 pam_omen_blood_moon: "赤く染まった月"
 pam_omen_star_host: "あるはずのない場所に輝く無数の星"
 pam_omen_comet: "2つの尾を引く彗星"
 pam_omen_falling_stars: "流れ星の雨"
 pam_omen_moon_halo: "月を取り巻く淡い光の輪"
 pam_omen_eclipse: "銅色の三日月へと変貌した月"
 pam_omen_wandering_star: "明るく輝くさまよう星"
 pam_secular_faith_events.0021.a: "この前兆を詳しく調べよう。"
 pam_secular_faith_events.0021.b: "[ROOT.Char.GetFaith.HighGodNamePossessive]の恩寵が輝いている。"
 pam_secular_faith_events.0021.c: "このような前兆は征服の到来を告げるものだ！"
 pam_secular_faith_events.0021.d: "天は私に答えを示す義務はない。"
 pam_secular_faith_events.0022.t: "[ROOT.Char.GetTitleAsNameNoTooltip]の手"
 pam_secular_faith_events.0022.desc_intro: "我が[ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )]である[sick_courtier.GetFirstName]が、青ざめ、足取りもふらつきながら、私の方へ近づいてくる。\n\n"
 pam_secular_faith_events.0022.desc_ill: "「[ROOT.Char.Custom('FormOfAddressForLiege')]、私はひどい[illness_trait.GetName( GetNullCharacter )]に蝕まれ、治療法も見つからず、衰弱していくばかりです。医師の[physician.GetTitledFirstName]でさえ、私に何が起きているのか分からないのです！」と、[sick_courtier.GetSheHe]は泣き叫ぶ。\n\n"
 pam_secular_faith_events.0022.desc_other: "「私は[illness_trait.GetName]に冒され、治療法も見つからず、衰弱していくばかりです。[physician.GetTitledFirstName]でさえ、私に何が起きているのか分からないのです！」と、[sick_courtier.GetSheHe]は泣き叫ぶ。\n\n"
 pam_secular_faith_events.0022.desc_end: "「戴冠した者の手には[ROOT.Char.GetFaith.HighGodNamePossessive]の恩寵が宿ると言われています。それが私に残された最後の希望なのです」"
 pam_secular_faith_events.0022.a: "来なさい。私の手をそなたに当てよう。"
 pam_secular_faith_events.0022.b: "いや…ここから祝福を授けよう。"
 pam_sf_kings_touch_gamble_tt: "私の手が[sick_courtier.GetFirstName]の病を癒やすかもしれないし、逆に病が私に移るかもしれない…"
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName]が病床から起き上がる"
 pam_sf_kings_touch_infected_toast: "今後は病が私にうつる"
 pam_sf_kings_touch_nothing_toast: "私が触れても[sick_courtier.GetFirstName]の容態に変化はない"
 pam_secular_faith_events.0023.t: "放浪の書記官"
 pam_secular_faith_events.0023.desc: "やせ細った[scholar.GetWomanMan]が私の前に連れてこられた。指にはインクの染みが付き、脇には書物を抱えている。\n\n「私は[scholar.GetFirstName]、書記にして学者です」[scholar.GetSheHe]は続ける。「私には家も、庇護してくださる方もありません。この手は労働のためのものではなく、[ROOT.Char.GetTitleAsNameNoTooltip]の言葉を[ROOT.Char.Custom('GetWritingMaterial')]に記すためのものです」\n\n「どうか、パンと雨露をしのぐ屋根を授けてください。そうすれば忠実にあなたに仕えましょう」"
 pam_secular_faith_events.0023.a: "学者だと？お前の知っていることを教えてくれ。"
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip]がお前を必要としている。"
 pam_secular_faith_events.0023.c: "我が帳簿には確かな腕が必要だ。"
 pam_secular_faith_events.0023.d: "お前など必要ない。去れ。"
 pam_secular_faith_events.0024.t: "修道院へ"
 pam_secular_faith_events.0024.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', rival_character )]である[rival_character.GetFirstName]は、相変わらず[ROOT.Char.Custom('GetCourt')]において[rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)][rival_character.Custom2('InsultNounClumsy', ROOT.Char)]であり、しかも[rival_character.Custom2('InsultAdjective', ROOT.Char)][rival_character.Custom2('InsultNoun', ROOT.Char)]である。だが、[archdiocese.GetName]の[archbishop.GetTitledFirstName]からの手紙のおかげで私の気分は晴れやかになる。\n\n「[rival_character.GetFirstName]は[ROOT.Char.GetFaith.HighGodName]に立派に仕えることでしょう」と、[archbishop.GetSheHe]は記している。「修道院は喜んで[rival_character.GetHerHim]を受け入れます」\n\n修道院の床にひざまづく者たちのことなど、世間はすぐに忘れてしまうのだから。"
 pam_secular_faith_events.0024.a: "こうして[ROOT.Char.GetFaith.HighGodName]はまた一人、「志願した」しもべを得るというわけだ！"
 pam_secular_faith_events.0024.b: "敵はむしろ目の届くところに置いておきたいものだ。"
 pam_secular_faith_events.0025.t: "代[ROOT.Char.GetMotherFather]"
 pam_secular_faith_events.0025.desc: "「私は肉体も魂も、[ROOT.Char.GetFaith.GetAdjective]の信仰に身を捧げたいと願っています」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', converting_char )]である[converting_char.GetFirstName]は厳粛に語った。「洗礼を受けて[ROOT.Char.GetRite.GetAdherentName]になりたいのです…どうか我が代[ROOT.Char.GetMotherFather]として、洗礼盤の脇に立ってくださいませんか」"
 pam_secular_faith_events.0025.a: "ならば私たちの新たな絆を皆に見せよう！"
 pam_secular_faith_events.0025.b: "信仰に壮大な儀礼など不要だ。"
 pam_secular_faith_events.0025.c: "この名誉を受けるわけにはいかない。"
 pam_secular_faith_events.0026.t: "囚われた魂"
 pam_secular_faith_events.0026.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', afflicted )]である[afflicted.GetFirstName]は、これまで決して正気とは言えなかったが…もはや自分すら失ってしまったようだ。\n\n「[ROOT.Char.GetFaith.EvilGodNames]！[ROOT.Char.GetFaith.EvilGodNames]が私の中にいる！」と、[ROOT.Char.GetFaith.HouseOfWorship]の床で痙攣しながら、[afflicted.GetSheHe]は叫ぶ。\n\n我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が青ざめる。「[ROOT.Char.Custom('FormOfAddressForLiege')|U]、[afflicted.GetHerHis]の魂は悪魔に囚われているようです。[afflicted.GetHerHim]を救うには、悪魔祓いを行うしかありません」"
 pam_secular_faith_events.0026.a: "[afflicted.GetSheHe|U]には適切な世話が必要だ。"
 pam_secular_faith_events.0026.b: "私が自ら悪魔祓いを執り行おう。"
 pam_secular_faith_events.0026.c: "これは聖なる業だ。お前が責任を持ってやり遂げよ。"
 pam_secular_faith_events.0026.d: "混乱が広がる前に、[afflicted.GetHerHim]を追い出せ！"
 pam_sf_exorcism_success_toast: "悪魔祓いは成功する"
 pam_sf_exorcism_failed_toast: "悪魔祓いは失敗する"
 pam_secular_faith_events.0027.t: "信仰の危機"
 pam_secular_faith_events.0027.desc: "「[ROOT.Char.GetFaith.HighGodName]よ、私の声が聞こえますか？」と、私は囁く。だが心の奥底では、[ROOT.Char.GetFaith.HighGodNameSheHe|U]が私のような罪人の声になど耳を傾けないことを知っている。\n\n私は[ROOT.Char.GetFaith.HighGodHerHis|U]の御心を誤解していたのだろうか？[old_tenet.GetName( ROOT.Char.GetRite )]は[ROOT.Char.GetFaith.HighGodHerHis|U]の知恵の真の姿ではないのだろうか？\n\n十字架に光が降り注ぎ、私の胸に希望が湧き上がる。"
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName]は[new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]を求めているのだ！"
 pam_secular_faith_events.0027.b: "もしかすると…[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]なのか？"
 pam_secular_faith_events.0027.c: "私は救われない。そして他の者たちも皆…"
 pam_secular_faith_events.0028.t: "我が魂、安らかに"
 pam_secular_faith_events.0028.desc: "私は[ROOT.Char.GetFaith.HouseOfWorship]でひざまずき、[ROOT.Char.GetFaith.HighGodName]の存在が我が魂の隅々にまで染み渡っていくのを感じる。\n\n[old_tenet.GetName( ROOT.Char.GetRite )]への崇敬が、真理を私に教えてくれた。これほどの安らぎをかつて味わったことはない。どうしてこの歓びを自分だけのものにしておけようか？他の人々をも同じ光へと導き、真理を示してやるべきではないだろうか？"
 pam_secular_faith_events.0028.a: "耳を傾ける者を見つけよう。"
 pam_secular_faith_events.0028.b: "だが、私の真の情熱は[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]にある！"
 pam_secular_faith_events.0028.c: "この想いを[ROOT.Char.Custom('GetWritingMaterial')]に記さなくては。"
 pam_secular_faith_events.0029.t: "死者の訪問"
 pam_secular_faith_events.0029.desc: "「起きなさい、[ROOT.Char.GetFirstNameNoTooltip]」と、聞き覚えのある声が響く。「私はここにいる、[departed.Custom2( 'RelationToMeShort', root_scope )]よ…あなたが助けを必要とする時に」\n\n私は身を起こした。額には冷や汗がにじんでいる。幻影は一瞬ちらつき、やがて消え去った。\n\nあれは…私の[ROOT.Char.Custom2( 'RelationToMeShort', departed )]だったのだろうか？"
 pam_secular_faith_events.0029.a: "[departed.GetSheHe|U]は安らかに、私を見守ってくれている。"
 pam_secular_faith_events.0029.b: "あれは…警告だったのだろうか？"
 pam_secular_faith_events.0029.c: "ただの心の迷いだ。"
 pam_secular_faith_events.0030.t: "隠者"
 pam_secular_faith_events.0030.desc: "「私は[ROOT.Char.GetFaith.HighGodName]により近づきたいのです」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )]である[would_be_anchorite.GetFirstName]が厳粛に言う。「この世は誘惑に満ちており、私は完全な孤独を求めています」\n\n[would_be_anchorite.GetSheHe|U]は我が[ROOT.Char.Custom('ResidenceBuilding')]の壁を見つめ、指先でそれをなぞる。\n\n「[church_scope.GetName]の[ROOT.Char.GetFaith.HouseOfWorship]は美しい。私はその壁の中に幽閉され、残りの人生を途切れることなき祈りに費やしたいのです」"
 pam_secular_faith_events.0030.a: "それがそなたの望みなら、石工たちをすぐに手配しよう。"
 pam_secular_faith_events.0030.b: "いや、その願いを聞き入れるわけにはいかない。"
 pam_secular_faith_events.0031.t: "学者たちの討論"
 pam_secular_faith_events.0031.desc: "「どうして[tenet_1.GetBaseName]の神聖さを否定できるというのか？」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )]である[disputant_one.GetFirstName]が叫ぶ。\n\n「馬鹿げている！[tenet_2.GetBaseName]こそが我々を神聖なる存在へと近づけてくれることは、明らかではないか！お前は一体何を学んできたのだ？」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )]である[disputant_two.GetFirstName]が反論する。"
 pam_secular_faith_events.0031.a: "学者の討論か？私の書き付けを取りに行こう…"
 pam_secular_faith_events.0031.b: "私は[tenet_1.GetBaseNameNoTooltip]に惹かれる。"
 pam_secular_faith_events.0031.c: "[tenet_2.GetBaseNameNoTooltip]のほうが真理をついている。"
 pam_secular_faith_events.0031.d: "活気ある[ROOT.Char.Custom('GetCourt')]とは、学識ある[ROOT.Char.Custom('GetCourt')]だ。"
 pam_secular_faith_events.0032.t: "誘惑の刻"
 pam_secular_faith_events.0032.desc_food: "目を覚ますと、枕はよだれで濡れていた。厨房からは[ROOT.Char.Custom('RegionalEdibleMeat')]のローストと、[ROOT.Char.Custom('GetFoodDetail')]を詰めた[ROOT.Char.Custom('GetRandomRegionalSmallGame')]の香りが漂ってくる。[ROOT.Char.Custom('ResidenceBuildingHallsType')]からは[ROOT.Char.Custom('RegionalDrink')]の杯が触れ合う音と陽気な話し声が聞こえてくる。\n\n[vice_trait.GetName( GetNullCharacter )]である私に、[ROOT.Char.GetFaith.PriestNeuterPlural]は断食を命じたのだが…なぜ[ROOT.Char.GetFaith.HighGodName]は、よりによってこの夜に私を試されるのか？\n\n腹の虫が鳴るにつれて、決意が消え去っていくのを感じる。"
 pam_secular_faith_events.0032.a: "この欲求は[ROOT.Char.GetFaith.HighGodName]の御心にかなうものだ！"
 pam_secular_faith_events.0032.b: "いや、断食を続ける。ここで折れるものか。"
 pam_secular_faith_events.0032.c: "ひと口だけ…誰にもわかりやしない。"
 pam_secular_faith_events.0033.t: "枕元の説教"
 pam_secular_faith_events.0033.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )]である[believing_spouse.GetFirstName]は[believing_spouse.GetRite.GetName]を信仰しており、その教えを夜な夜な嬉しそうに私に囁いてくれる。\n\n「[new_tenet.Custom('GetGenericTenetSentence')]我が[ROOT.Char.Custom('RomanticComplimentAdjective')][believing_spouse.Custom2( 'RelationToMeShort', root_scope )]よ、これを耳にされたことは？#EMP 魅力的#!だと思いませんか？」[believing_spouse.GetSheHe|U]はそう尋ね、私を抱きしめる。\n\n[believing_spouse.GetHerHis|U]の情熱は、その笑顔と同じくらい魅力的だ。"
 pam_secular_faith_events.0033.a: "ふむ、もっと聞かせてくれ…"
 pam_secular_faith_events.0033.b: "魅力的なのは#EMP あなた#!だ！こちらへおいで。"
 pam_secular_faith_events.0033.c: "お願いだ、我が[believing_spouse.Custom('RomanticComplimentNoun')]よ、私は眠りたいんだ。"
 pam_secular_faith_events.0034.t: "見捨てられた子"
 pam_secular_faith_events.0034.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が遅刻するなど珍しい。[ROOT.Char.GetFaith.HouseOfWorship]の静寂を、赤ん坊のか細い泣き声が破った。\n\n「慈悲深き[ROOT.Char.GetFaith.HighGodName]よ…」と、[chaplain.GetFirstNameNoTooltip]は囁き、子どもを優しく抱き締める。「[trait_scope.GetName( GetNullCharacter )]であるために捨てられた…どの魂も、こんな運命を辿るいわれはありません」\n\n赤ん坊の小さな指が[chaplain.GetHerHis]の親指をしっかりと握りしめる。"
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName]は私に[foundling.Custom('GetDaughterSon')]をお授けになられた。"
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip]がこの子を引き取るだろう。"
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip]がこの子を育てる。"
 pam_secular_faith_events.0034.d: "この子がどうなろうと知ったことではない。"
 pam_secular_faith_events.0035.t: "苦行"
 pam_secular_faith_events.0035.desc: "地面に血痕がある。鞭の音を辿っていくと、我が[ROOT.Char.Custom2( 'RelationToMeShort', sufferer )]である[sufferer.GetFirstName]の姿があった。[sufferer.GetHerHis]の手には深紅に染まった鞭が握られ、頬には涙が伝っている。\n\n「私の[sinful_trait.GetName( GetNullCharacter )]の情欲が私を呑み込もうとしている」と、[sufferer.GetSheHe]はあえぐ。「誘惑の炎に焼かれるよりは、鞭の痛みのほうがましだ」\n\n「この痛みはいずれ過ぎ去る。だが[ROOT.Char.GetFaith.NegativeAfterLife|U]はそうではない」"
 pam_secular_faith_events.0035.a: "興味深い…その鞭を私に渡せ。"
 pam_secular_faith_events.0035.b: "[sufferer.GetHerHim]に苦行を続けさせよう。"
 pam_secular_faith_events.0035.c: "[ROOT.Char.GetFaith.HighGodNamePossessive]のために、この狂気を止めよ。"
 pam_sf_scourge_abandoned_toast: "鞭が捨て去られた"
 pam_secular_faith_events.0036.t: "隠者の知恵"
 pam_secular_faith_events.0036.desc: "ぼろをまとった[hermit.GetWomanMan]が謁見を求めてきた。その者は、[hermit_location.GetName]の辺境の[hermit_location.Custom('TerrainTypeProvince')]から来た隠者だと名乗っている。\n\n「7晩もの間、[ROOT.Char.GetFaith.HighGodName]は私に眠りを与えなかった」と、[hermit.GetSheHe]は厳しい口調で言う。「私を罰するためではなく、他者——つまりあなたへと伝えるべき真理で私の思考を満たすためにです」\n\n「私の言葉を聞き、心に留められよ。その後私は、再び孤独へと戻りましょう」"
 pam_secular_faith_events.0036.a: "どんな神秘を授けてくれるのだ？"
 pam_secular_faith_events.0036.b: "学ぶ用意はできている。"
 pam_secular_faith_events.0036.c: "去れ、物乞いめ。"
 pam_secular_faith_events.0037.t: "肉欲の啓示"
 pam_secular_faith_events.0037.desc_wanderer: "夜遅くまで[ROOT.Char.Custom('RegionalAlcoholicDrink')|U]が振る舞われるなか、訪問中の旅人[reveler.GetFirstName]が身を寄せてくる。"
 pam_secular_faith_events.0037.desc_normal: "夜遅くまで[ROOT.Char.Custom('RegionalAlcoholicDrink')|U]が振る舞われるなか、我が[ROOT.Char.Custom2( 'RelationToMeShort', reveler )]、[reveler.GetFirstName]が身を寄せてくる。"
 pam_secular_faith_events.0037.desc: "やがて、[reveler.GetHerHis]の[reveler.Custom('ObjectifiedFeature')]のほかには何も目に入らなくなっていく。\n\n「舌で唱える祈りもあります」と、[reveler.GetSheHe]は言いながら、ゆっくりと[reveler.GetHerHis]の[reveler.Custom('GetClothingArticle')]を脱いでいく。「そして、肉体で唱える祈りもあります。我が[ROOT.Char.Custom('RaunchyComplimentNoun')]よ、[reveler.Custom('pam_sf_carnal_art')]をお見せしましょう」\n\n[reveler.GetSheHe|U]は私に手を差し出す。「これから訪れる恍惚は、[ROOT.Char.GetFaith.PositiveAfterLife]の至福にも匹敵するはずです」"
 pam_secular_faith_events.0037.a: "見せてくれ。後ろの戸を閉ざせ。"
 pam_secular_faith_events.0037.b: "服を着ろ。"
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "とぐろを巻く蛇"
 pam_sf_carnal_art_2: "昇りゆく河"
 pam_sf_carnal_art_3: "絡み合う蔦"
 pam_sf_carnal_art_4: "密なる抱擁"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "竹の裂け目"
 pam_sf_carnal_art_6: "雌馬の戯れ"
 pam_sf_carnal_art_7: "花開く蓮"
 pam_sf_carnal_art_8: "インドラの妻"
 pam_sf_carnal_art_9: "立ち上がるコブラ"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "恋人の結び目"
 pam_sf_carnal_art_11: "薔薇と棘"
 pam_sf_carnal_art_12: "吟遊詩人の秘密"
 pam_sf_carnal_art_13: "掌に包まれた炎"
 pam_secular_faith_events.0038.t: "楽園の味"
 pam_secular_faith_events.0038.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', reveler )]である[reveler.GetFirstName]が、別の皿に[ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')]を山盛りにして、テーブルの向こうから私にニヤリと笑いかけてくる。\n\n「あなたは腹を空かせ、空の盃を手に[ROOT.Char.GetFaith.HighGodName]を追い求めておられる。しかし私は、熟した果物、極上の肉、笑い声、そして歌の中に[ROOT.Char.GetFaith.HighGodName]を見出すのです」と、[reveler.GetSheHe]は並々と注がれた盃を掲げる。\n\n「[ROOT.Char.GetFaith.HighGodNamePossessive]の授かり物は味わうためにあるのですよ、[ROOT.Char.Custom('FormOfAddressForLiege')]よ。与えられたものを無駄にする？それこそ恐るべき大罪です！」"
 pam_secular_faith_events.0038.a: "神聖さはこの盃の中にあるのかもしれない…"
 pam_secular_faith_events.0038.b: "ならば、その恵みを称えて盛大な饗宴を催そう。"
 pam_secular_faith_events.0038.c: "信仰を装った退廃だ。断る。"
 pam_secular_faith_events.0039.t: "暗闇の中の祈り"
 pam_secular_faith_events.0039.desc: "我が[ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )]である[spymaster_scope.GetFirstName]が、自らの謀略がもたらした成果に動揺した様子で私のもとを訪れる。\n\n「[secret_keeper.GetTitledFirstName]の傍らで祈りを捧げながら、私は嘘をつきました、[ROOT.Char.Custom('FormOfAddressForLiege')]よ。相手の口を割らせるために、些細で敬虔な嘘を囁いたのです」\n\n「すると[secret_keeper.GetSheHe|U]は、[ROOT.Char.GetFaith.HighGodName]の御前で[secret_keeper.Custom('GetSecretCrimeConfessionIndef')]を告白しました」と、[spymaster_scope.GetSheHe]は声を潜める。「私は[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]をついたのです…もしかするとこの欺瞞こそ、私たちが[ROOT.Char.GetFaith.HighGodName]に負うべき義務なのでしょうか？」"
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName]は確かに影の中で働きたもう…"
 pam_secular_faith_events.0039.b: "なんと忌むべき手口だ…さっさとその秘密を教えてくれ。"
 pam_secular_faith_events.0040.t: "信徒の肉"
 pam_secular_faith_events.0040.desc: "夕食の席で、我が[ROOT.Char.Custom2( 'RelationToMeShort', scholar )]である[scholar.GetFirstName]が、ページが擦り切れるほど読み込まれた古書を開いた。また講義が始まろうとしている。\n\n「[Glossary( 'イッセドネス', 'ISSEDONES_GLOSS' )]の人々は死者を埋葬しなかったのです、[ROOT.Char.Custom('FormOfAddressForLiege')]。彼らは死者を食らったのです！」と、[scholar.GetSheHe]は息継ぎもせずにまくし立てる。「父親の肉を羊肉と混ぜ合わせ、その頭蓋骨には金箔を貼って聖なる遺物として大切に崇めた。彼らにとってそれは、子どもが示しうる真実の愛だったのです」\n\n「そして一番素晴らしい点は何か知っていますか？」と、[scholar.GetSheHe]はニヤリと笑う。「ヘロドトス自身でさえ、彼らを邪悪でも狂気でもないと判断したのです。#EMP 『慣習こそ万物の王である』#!とね！」"
 pam_secular_faith_events.0040.a: "ああ、そのことならよく知っているとも。"
 pam_secular_faith_events.0040.b: "恐るべき慣習だな…もっと詳しく聞かせてくれ。"
 pam_secular_faith_events.0040.c: "まったく、私は食事をしているんだ！"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "古代ギリシャの歴史家ヘロドトスが記述した遥か北方のステップに住む民族。男の父親が死ぬと、その親族は家畜を屠り、その肉を死者の肉と混ぜ合わせて厳粛な葬儀の宴で分け合った。そして頭蓋骨の肉を削ぎ落として綺麗に洗い、金箔を貼って聖なる遺物とし、毎年の生け贄を捧げて敬った。ヘロドトスは、そうした儀式を非難するためではなく、ギリシャの火葬の風習と並べて提示することで、「慣習こそ万物の王である」こと——つまり、どの民族も自分たちのやり方を最も正しいと考えていることを示そうとした。"
 pam_secular_faith_events.0041.t: "裸の真実"
 pam_secular_faith_events.0041.desc: "庭園を歩いていると、[ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')]の花壇の中に一人の見知らぬ者がいるのに気づいた。生まれ出たままの姿で、我が[ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')]から果実をもぎ取っている。[adamite.GetHerHis]が身に纏っているのは落ち葉だけだ。\n\n「おお、[ROOT.Char.GetTitleAsName]！なぜ布や王冠の陰に隠れるのですか？」と、[adamite.GetSheHe]は[ROOT.Char.GetFaith.HighGodName]と私の前で恥じらう様子もなく尋ねる。「私は、私たちが裸で恐れを知らずに生きていた、最初の無垢なる状態を受け入れたのです」\n\n[adamite.GetSheHe|U]はまた別の果実にかぶりつき、果汁がその肌を伝い落ちる。「あなたもすべきかもしれません」"
 pam_secular_faith_events.0041.a: "私もまた、その自由を求めている。"
 pam_secular_faith_events.0041.b: "私の果実を食らい、お前の物語を語ってから去るがいい。"
 pam_secular_faith_events.0041.c: "侵入者を投獄しろ。"
 pam_secular_faith_events.0042.t: "旅の後援"
 pam_secular_faith_events.0042.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )]である[sponsor_character.GetFirstName]が、開いた財布を手に温かい笑みを浮かべて庭園で私を出迎える。\n\n「あなたの[GetActivityType( 'activity_pilgrimage').GetName]の費用は私が持ちましょう、[ROOT.Char.Custom('FormOfAddressForLiege')]。巡礼の道は小銭を数える場所ではありません。自由に歩み、私たちのために祈ってください」\n\n本物の硬貨だ。そしてそこに込められた信頼もまた本物だ。"
 pam_secular_faith_events.0042.a: "感謝の心を胸に、巡礼の道を歩もう。"
 pam_secular_faith_events.0042.b: "硬貨はありがたく頂戴し、懐に入れておこう。"
 pam_secular_faith_events.0042.c: "硬貨は君が持っていてくれ、友よ。"
 pam_sf_pilgrimage_sponsor_tt: "#V 7#!年以内に[GetActivityType( 'activity_pilgrimage').GetName]を完了すると、[sponsor_character.GetFirstName]のあなたに対する好感度が#P 50#!上昇する"
 pam_sf_pilgrimage_sponsor_toast: "後援者を喜ばせた"
 pam_secular_faith_events.0043.t: "巡礼者の歓迎"
 pam_secular_faith_events.0043.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', holy_man )]である[holy_man.GetFirstName]が、祭壇の前で私の両手を取る。\n\n「巡礼の道を歩みなさい、[ROOT.Char.Custom('FormOfAddressForLiege')]。戻った折には、[capital_county.GetNameNoTier]のすべての広場で、あなたが[GetActivityType( 'activity_pilgrimage').GetName]を終えられたことを高らかに知らしめましょう。民は[ROOT.Char.GetTitleAsNameNoTooltip]が自分たちのためにひざまずいたことを知るでしょう」"
 pam_secular_faith_events.0043.a: "ならば巡礼の道を歩もう。"
 pam_secular_faith_events.0043.b: "私にはもっと俗世的な務めがある。"
 pam_sf_extolled_pilgrimage_toast: "民が歓喜する"
 pam_secular_faith_events.0044.t: "聖職者への口添え"
 pam_secular_faith_events.0044.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )]である[friendly_bishop.GetFirstName]が、いつになく上機嫌でやって来た。\n\n「最近、同輩たち——司教や修道院長、教会で影響力のある者たちから目をかけられているのです。もし彼らの信心深い知恵や道徳的権威が必要なら、あなたのために口添えして差し上げましょう」\n\n[friendly_bishop.GetFirstNamePossessiveNoTooltip]が、権力に飢えた[ROOT.Char.GetFaith.PriestNeuterPlural]から受けている引き立てなど、すぐに使い物にならなくなる。"
 pam_secular_faith_events.0044.a: "ならば私の名を出して、話をつけてくれ。"
 pam_secular_faith_events.0044.b: "あなたの友情だけで十分すぎるほどの祝福だ。"
 pam_secular_faith_events.0045.t: "啓示"
 pam_secular_faith_events.0045.desc: "晴れた空に走る稲妻のように、明晰な理解が突然訪れた。\n\n教義。信条。流派。信仰。千の散らばった思考のように見えたものが、今やひとつの真理となって私の目の前に形を成す。"
 pam_secular_faith_events.0045.a: "未来が私に、人々を導くよう呼びかけている。"
 pam_secular_faith_events.0045.b: "この瞬間を存分に味わおう。"
 pam_secular_faith_events.0046.t: "共通の信念"
 pam_secular_faith_events.0046.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', intimate )]である[intimate.GetFirstName]は、[shared_tenet.GetName( intimate.GetRite )]について語る時、その信念を隠しきれない。\n\n「[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )]は私のすべての行いに意味を与えてくれるのです」と、[intimate.GetSheHe]は言う。「私にとってそれと同じくらい大切なものは一つだけ…あなたです、我が[ROOT.Char.Custom('ComplimentAdjective')][intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))]よ」\n\n一筋の涙が[intimate.GetHerHis]の頬を伝う。「ただ、あなたに知ってほしかったのです」"
 pam_secular_faith_events.0046.a: "共通の信念によって我々の絆を深めよう！"
 pam_secular_faith_events.0046.b: "この信念を分かち合うこと…それはまるで愛のようだ。"
 pam_secular_faith_events.0046.c: "思いを明かしてくれて感謝する。"
 pam_secular_faith_events.0047.t: "聖職者の献身"
 pam_secular_faith_events.0047.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が十字を切り、頭を垂れる。\n\n「[ROOT.Char.GetFaith.HighGodName]が理由あってあなたに冠を授けられたのです。あなたに忠実に仕えることこそ、[ROOT.Char.GetFaith.HighGodHerHis|U]の御心に仕えることなのです」と、[chaplain.GetSheHe]は言う。\n\n「私は[ROOT.Char.GetFaith.HighGodName]に忠誠を誓いました。今、あなたに対しても同じ忠誠を誓いましょう」"
 pam_secular_faith_events.0047.a: "ならば私に全身全霊で仕えよ。"
 pam_secular_faith_events.0047.b: "そなたは常にまず[ROOT.Char.GetFaith.HighGodName]に仕えなければならない。"
 pam_secular_faith_events.0048.t: "悪魔の夢"
 pam_secular_faith_events.0048.desc: "目を覚ましたが、体を動かすことができない。\n\n歪んだ姿をした何かが私の前で踊り、狂ったように笑っている。悪魔か？恐怖がゆっくりと全身を満たしていく。「へっ…へっ…お前の罪は重い。まもなく[ROOT.Char.GetFaith.EvilGodNames]がお前を連れ去るだろう！」\n\n夢であろうと悪魔であろうと、私が見たものを無視することはできない。[ROOT.Char.GetFaith.HighGodName]と和解しなければならない。"
 pam_secular_faith_events.0048.a: "この夢は…何かを意味しているに違いない。"
 pam_secular_faith_events.0048.b: "ただの夢だ。寝直そう。"
 pam_secular_faith_events.0048.c: "[ROOT.Char.GetFaith.HighGodName]よ、私をお守りください！悔い改めなければ。"
 pam_sf_demon_torment_modifier_tt: "この補正を取り消すには、[GetBuilding('temple_01').GetName]の[holding|E]を建設するか、[GetActivityType('activity_pilgrimage').GetName]に出る必要がある"
 pam_sf_demon_torment_lifted_toast: "苦悩が和らぐ"
 pam_secular_faith_events.0049.t: "「天上位階」"
 pam_secular_faith_events.0049.desc: "我が礼拝堂から聞こえてくるのは、祈りの声ではない。\n\n「そう、#emp ああもっとです#!、閣下！この哀れな罪人に[GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]におけるふさわしい立場を思い知らせてください！」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )]である[lustful_priest.GetFirstName]が恍惚のうちに叫ぶ。「私は泥の中で身悶えする、この世の欲望にまみれた蛆虫です。#emp 私を罰してください！#!」\n\n[ROOT.Char.GetFaith.HighGodName]よ、我が礼拝堂で一体何が起きているのだ！？"
 pam_secular_faith_events.0049.a: "儀式的なものに違いない。これを…書き留めなければ。"
 pam_secular_faith_events.0049.b: "#emp 我が#!礼拝堂ですると言うなら、#emp 私も#!加わるまでだ！"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip]が、性的倒錯者だと！？忌々しいが、利用価値はある。"
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U][chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0050.desc: "[ROOT.Char.GetFaith.HouseOfWorship]の揺らめく蝋燭の灯りでは、私の心を満たす不純な思考をそらすには不十分だ。\n\n「懺悔室にいらしてください、[ROOT.Char.Custom('FormOfAddressForLiege')]」と、我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]が囁く。私の視線は[chaplain.GetHerHis]の[chaplain.Custom('ObjectifiedFeature')]に釘付けになる。「あなたの魂を悩ませるどんな重荷であれ、恐れずに語るのです」\n\n[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )]は神聖なものだが…他のどの罪よりも重くのしかかる罪が一つある。それは[chaplain.GetFirstNamePossessive]の[chaplain.Custom('AdmiredFeature')]だ。"
 pam_secular_faith_events.0050.a: "…その懺悔室は、2人入れる広さだろうか？"
 pam_secular_faith_events.0050.b: "[ROOT.Char.GetFaith.HighGodName]よ、お許しください。私には不純な考えがあります。"
 pam_secular_faith_events.0051.t: "あなたの神、主"
 pam_secular_faith_events.0051.desc: "#EMP 「我はあなたの神、主である」#!と、轟くような声が[ROOT.Char.GetFaith.HouseOfWorship]に響き渡る。#EMP 「我が前にひざまずきなさい」#!\n\n私は膝をつき、視界がかすむ。顔に付いた血の筋を拭った。\n\n#EMP 「あなたの神、主である我はあなたに命じる。心を尽くし、魂のすべてを捧げて我に従え」#!一つの声が百になり、百の声が千になる。#EMP 「もし従わぬなら、あなたが滅びるまで、我はあなたを呪うだろう。あなたの神であり主である我を見捨てたのだから」#!"
 pam_secular_faith_events.0051.a: "…従おう…"
 pam_sf_lord_your_god_effect_tt: "@alert_icon! #alert_trial 恐るべき、あるいは美しい何かが起こります…#!"
 pam_sf_lord_your_god_tt: "お願いです、[ROOT.Char.GetFaith.HighGodName]よ…どうか慈悲を。"
 pam_sf_voice_of_jesus_toast: "神の声"
 pam_sf_stroke_of_god_toast: "神の一撃"
 pam_secular_faith_events.0052.t: "亡き後"
 pam_secular_faith_events.0052.desc: "[resting_church.GetNameNoTier]の[ROOT.Char.GetFaith.HouseOfWorship]にて、我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、私の前に統治した者たちの風化した墓石の前で足を止める。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')]よ、[ROOT.Char.GetFaith.HighGodName]はあなたに、大多数の者よりも多くの歳月をお与えになられました。どのように眠りにつくかを決めることは罪ではありません」\n\n「石に刻まれたあなたの威厳ある姿か、あるいは修道士の[Glossary( '質素な修道服', 'AD_SUCCURRENDUM_GLOSS' )]か。選ぶのはあなたです」"
 pam_secular_faith_events.0052.a: "私の姿を彫ってくれ…だが、より若く、より見栄えよく頼む。"
 pam_secular_faith_events.0052.b: "質素な修道服で十分だ。"
 pam_secular_faith_events.0052.c: "墓は気長に待ってくれるさ。"
 pam_sf_effigy_planned_tt: "あなたの死後に[GetActivityType( 'activity_funeral').GetName]が開催された場合、その主催者は[prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#!の[prestige|E]を獲得する"
 pam_sf_cowl_burial_planned_tt: "あなたの死後に[GetActivityType( 'activity_funeral').GetName]が開催された場合、その主催者は[piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#!の[piety|E]を獲得する"
 pam_sf_effigy_unveiled_toast: "像が除幕された"
 pam_sf_cowl_burial_toast: "修道服に身を包み眠りにつく"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "#G ad succurrendum#!——すなわち死の床で修道士の誓願を立て修道服を纏うことは、中世キリスト教世界における大領主たちの最後の手段であった。絹の衣装ではなく質素な修道服に身を包んで埋葬されることで、死を目前にした統治者は、神の審判に臨む際、権力者ではなく謙虚な兄弟たちの一員として数えられることを望んだのである。"
 pam_secular_faith_events.0053.t: "聖人の出立"
 pam_secular_faith_events.0053.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、産婆が赤子を取り上げるように、注意深く聖遺物箱の蓋を持ち上げる。その中には我が一族の至宝、[procession_relic.GetName]が収められている。\n\n「鍵をかけて閉じ込められた聖性は、誰の助けにもなりませんよ、[ROOT.Char.Custom('FormOfAddressForLiege')]」と、[chaplain.GetSheHe]は言う。「民に[Glossary( '聖遺物の顕示', 'OSTENSION_GLOSS' )]を行いましょう。聖遺物を人々に公開し、ここから門に至るまでのすべての街路を祝福するのです」"
 pam_secular_faith_events.0053.a: "私が自ら聖遺物箱を持って進もう。"
 pam_secular_faith_events.0053.b: "行列前夜は私が夜通し祈ろう。"
 pam_secular_faith_events.0053.c: "聖遺物を動かすなど、恐れ多くてできない。"
 pam_sf_procession_gamble_tt: "街路は金庫ではない。聖遺物が傷つくかもしれない…"
 pam_sf_relic_jostled_toast: "群衆の中での揉み合い"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "聖人の遺物の厳粛な公開。重要な祝祭日には、遺物が安置所から取り出され、街路や野原を行列をなして運ばれた。これにより、一つの祭壇に結び付けられた祝福が、道中のあらゆる人々の魂に触れることになるのだ。持ち出された聖遺物は、運ばれる先々で群衆、金銭、そして名声を引き寄せた。"
 pam_secular_faith_events.0054.t: "たらいと布"
 pam_secular_faith_events.0054.desc: "私の足元でたらいから湯気が立ち上り、[ROOT.Char.Custom('GetCourt')]の者が固唾を呑んで見守っている。私の前の腰掛けには、明らかに緊張した様子で[pauper.Custom2('dummy_peasant_profession', pauper)]が座っている。[pauper.GetHerHis]の裸足には泥がこびりついている。匂いは…なかなか強烈だ。\n\nまさにこの夜、救世主ご自身がたらいと布を手にひざまずかれた。[Glossary( '洗足式', 'MANDATUM_GLOSS' )]の準備は整い、水は温かく、広間のすべての視線が私に注がれている。\n\nあとはひざまずくだけ——あるいは思い直すかだけだ。"
 pam_secular_faith_events.0054.deviant: "#EMP この美味しそうな足を私の舌で綺麗にしてやろう。#!"
 pam_secular_faith_events.0054.a: "ひざまずき、布を手に取る。"
 pam_secular_faith_events.0054.b: "ひざまずき、この疲れ切った足に口づける。"
 pam_secular_faith_events.0054.c: "私には…できない。たらいを下げろ。"
 pam_sf_odorous_feet_tt: "ひざまずけば聖性に満たされるかもしれない…あるいは農民の足の匂いが一生消えないかもしれない"
 pam_sf_odorous_feet_toast: "消えない悪臭"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "洗足の儀式。最後の晩餐でのキリストの言葉——#G Mandatum novum do vobis#!（「新しい戒めをあなたがたに与える」）——にちなんで名付けられた。毎年、復活祭前の木曜日になると、コンスタンティノープルの皇帝や西欧各地の王たちは、選ばれた貧民の前にたらいと布を持ってひざまずき、その足を洗い、手に銀貨を握らせた。その一夜限り、その場にいる最も権力ある者が、最も深く頭を垂れたのである。"
 pam_secular_faith_events.0055.t: "青銅の声"
 pam_secular_faith_events.0055.desc: "[bell_church.GetName]の古い鐘にひびが入ったため、鋳直された。今日、新しい鐘が塔の中で輝きを放っている。その下には我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、聖水、聖油、塩を手に立っている。\n\n「鐘は、[ROOT.Char.GetFaith.HighGodName]に声を捧げる前に[Glossary( '洗礼', 'BELL_BAPTISM_GLOSS' )]を受けなければなりません」と、[chaplain.GetSheHe]はすでに袖をまくりながら主張する。「洗い清められ、聖別され、名を与えられるのです——そうすれば、いかなる悪魔も嵐も、その声を沈黙させることはできません」"
 pam_secular_faith_events.0055.a: "では、洗い清め、聖別し、名を与えよう。"
 pam_secular_faith_events.0055.b: "それは青銅であって、魂などではない——法令集にもそう記されている。"
 pam_secular_faith_events.0055.c: "簡単な祝福で十分だ。鳴り響かせよ。"
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "教会の鐘はキリスト教徒とほぼ同様に聖別された。聖水で洗い、聖油を注ぎ、聖人の名を与えられ、中には代父母まで立てられることもあった。カール大帝の#G 『Admonitio Generalis』#!（万民への訓諭勅令）は789年に鐘への洗礼を禁じたが、その慣習は何世紀にもわたって変わらず続けられた。洗礼を受けた鐘は、その音が届くところならどこでも嵐、雹、悪魔を追い払うと信じられていた。後に、鋳造師たちは「#G Fulgura frango#!」（私は稲妻を砕く）という銘文を鐘に刻み込んだ。"
 pam_secular_faith_events.0056.t: "広間の雀"
 pam_secular_faith_events.0056.desc: "一羽の雀が冬の闇から飛び込み、松明の煙と笑い声の中を[ROOT.Char.Custom('ResidenceBuildingHallType')]の隅から隅へと掠め飛ぶと、[ROOT.Char.Custom('ResidenceBuildingWindowType')]から再び飛び去っていった。\n\n[ROOT.Char.Custom('GetCourt')]が笑う。だが、我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]は笑わない。\n\n「[Glossary( '人の生もかくのごとし', 'BEDE_SPARROW_GLOSS' )]です、[ROOT.Char.Custom('FormOfAddressForLiege')]よ。光と温もりに包まれる一瞬、一つの闇から別の闇への旅立ちにすぎません。その前後に何があるのかは、[ROOT.Char.GetFaith.HighGodName]のみが知っています」"
 pam_secular_faith_events.0056.scholar: "ベーダもほぼ同じことを記していた。"
 pam_secular_faith_events.0056.a: "では、光に包まれたその一瞬を、有意義に過ごそう。"
 pam_secular_faith_events.0056.b: "ただの鳥だ。もっとワインを。"
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "ベーダの記述によれば、ノーサンブリア王エドウィンの助言者が、人間の命を、冬の夜に温かい宴会場を飛び抜ける雀にたとえたという。嵐の中から抜け出し、光と安らぎの中を束の間通り過ぎ、再び嵐の中へと戻っていく。その前後すべては未知である。もし新しい信仰が、その広間の向こうにあるものを語りうるなら、それは従うに値するはずだと彼は主張し、エドウィンは納得した。"
 pam_secular_faith_events.0057.t: "チャーチエール"
 pam_secular_faith_events.0057.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、[ale_church.GetName]の教会墓地に立っている。そこには教区民の半分が座る長机が並び、[GetBuilding('breweries_01').GetName]から運び込まれたばかりの樽が置かれている。その手には、すでに並々と注がれた大ジョッキが握られている。\n\n「屋根から雨が漏れています、[ROOT.Char.Custom('FormOfAddressForLiege')]。十分の一税だけでは足りません。そこで修道士たちが[Glossary( 'チャーチエール', 'CHURCH_ALE_GLOSS' )]を醸造し、私たちがそれを売り、屋根の代金が全額賄えるまで教区民に飲んでもらうというわけです」\n\n「ジョッキの一杯一杯が善行となるのです。あなたも一杯いかがですか？」"
 pam_secular_faith_events.0057.a: "では、私にも一杯くれ。屋根のために。"
 pam_secular_faith_events.0057.b: "エールは要らぬ。屋根にかかる費用は私が払おう。"
 pam_secular_faith_events.0057.c: "飲むだと？聖地でか？捨ててしまえ。"
 pam_sf_church_ale_gamble_tt: "一杯一杯が屋根のため。この教区で造られるエールはとても強い…"
 pam_sf_church_ale_toast: "翌朝、二日酔いで目覚める"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "教区で催される宴。寄付された麦芽から醸造されたエールが教会墓地で販売され、その収益が教会の維持費（雨漏りする屋根、新しい鐘、貧者のためのパン）に充てられる。教会会議は聖地での飲酒を繰り返し非難したが、教区はどこも醸造をやめなかった。多くの村の教会にとって、エールの収入は十分の一税をはるかに上回っていたからである。"
 pam_secular_faith_events.0058.t: "Quid Mus Sumit?"
 pam_secular_faith_events.0058.desc: "我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]が、祭壇布のように青ざめた顔で飛び込んできた。小さな銀の[Glossary( '聖餅箱', 'PYX_GLOSS' )]をまるでそれが手の中で燃えているかのように握りしめている。\n\n「鼠です、[ROOT.Char.Custom('FormOfAddressForLiege')]。今夜早くに箱を食い破り、[Glossary( '祝福されたパン', 'RESERVED_HOST_GLOSS' )]を食べてしまったのです！」\n\n[chaplain.GetSheHe]は言葉を絞り出すのがやっとだった。「学者たちは[Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )]——鼠は一体何を食べたのかと問うています。私はどうすればよいのでしょうか？」"
 pam_secular_faith_events.0058.scholar: "落ち着きなさい。鼠はパンを食べただけだ。"
 pam_secular_faith_events.0058.mean: "お前は#EMP 鼠#!に[ROOT.Char.GetFaith.HighGodName]を食わせたのか！？我が[ROOT.Char.Custom('GetCourt')]から出て行け！"
 pam_secular_faith_events.0058.a: "もっと鍵のしっかりした聖餅箱を買え。"
 pam_secular_faith_events.0058.b: "では、その鼠は地獄行きというわけか？ハハ！"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! ——「鼠は何を食べるのか？」これはスコラ学者たちが真剣に議論した疑問である。もし鼠が聖別された聖体をかじったとしたら、それは神の御体を食べたことになるのか？教会法では、聖体を不注意に扱った司祭に対する償いを定めており、高名な学者たちは、鼠が食べるのはパンの外観にすぎず、聖体は不敬な歯から自らを退避させると裁定した。"
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "通常は銀製または金めっきの小さな蓋付き容器で、ミサで聖別されたパンが保管される。教会法では、これを清潔に保ち、施錠し、不敬な手や、飢えた訪問者から安全に守ることを求めていた。"
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "ミサで聖別され、その後取り置かれたパン。病人や臨終者がいつでも受け取れるよう、教会に保管されていた。一度聖別されると、このパンは神の真の肉であるとみなされたため、その厳重な保管は極めて重要な事項であった。"
 pam_secular_faith_events.0059.t: "主の日"
 pam_secular_faith_events.0059.desc: "夜明けごろ、[sighting_county.GetBaseNameNoTier]の[sighting_province.Custom('GetTerrainTypePlural')]に[sighting_county.Custom('GetAnimalAdjective')][sighting_county.Custom('GetAnimalType')]が現れたという知らせが届いた。猟犬が吠え立て、馬が庭先で足を踏み鳴らしている。しかし、我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]である[chaplain.GetFirstName]は門の真ん中に立ちはだかっている。\n\n「本日は[Glossary( '安息日', 'LORDS_DAY_GLOSS' )]です、[ROOT.Char.Custom('FormOfAddressForLiege')]。鐘が鳴り、ミサが待っています！」\n\n「[ROOT.Char.GetFaith.HighGodName]はあなたに6日間の騎行を許されました。この1日までも欲しがるおつもりですか？」"
 pam_secular_faith_events.0059.a: "馬の鞍を外せ。ミサに参列しよう。"
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')]は待ってくれない。急げ！"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "週の最初の日で、復活を記念して聖なる日とされる。教会会議はこの日に肉体労働、市場の開催、無為な娯楽を行うことを禁じ、キリスト教の王たちはその禁止令を法に定めた——とはいえ、多くの領主は説教と同様に、狩猟もまた自分と神との間の問題だと考えていた。"
 pam_secular_faith_events.0060.t: "重荷なき人生"
 pam_secular_faith_events.0060.desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]の街を馬で進みながら、空っぽの金庫に悩み、心の内に苦悩を抱えていると、物乞いが目に入った。\n\n[hermit.GetSheHe]は世俗の所有物を何ひとつ持たず、この世での自分の居場所を受け入れた者らしい、穏やかな悟りを感じさせる様子で踊っている。私が抱えている苦悩から解放された魂だ。\n\nもしかすると、[hermit.GetSheHe]は私をも解放してくれる真理を見いだしているのかもしれない。"
 pam_secular_faith_events.0060.a: "持たないほど豊かになれる！"
 pam_secular_faith_events.0060.b: "この私の檻を、もう一度金で飾ろう！"
 pam_secular_faith_events.0060.c: "この雨から私を救い出してくれ。"
