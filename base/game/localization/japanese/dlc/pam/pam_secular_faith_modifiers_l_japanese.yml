l_japanese:
 pam_sf_devotion_modifier: "繁栄への献身"
 pam_sf_devotion_modifier_desc: "この人物は密かに献身の誓いを立てており、敬虔さと金貨を人知れず授かった。"
 pam_sf_grace_modifier: "授かりし恩寵"
 pam_sf_grace_modifier_desc: "この人物は感謝を捧げるか、あるいは静かな誓いを立てることで恩寵を授かり、心が晴れやかになった。"
 pam_sf_consolation_modifier: "平穏"
 pam_sf_consolation_modifier_desc: "この人物は平穏な状態にある。"
 pam_sf_visionary_renown_modifier: "宣言された幻視"
 pam_sf_visionary_renown_modifier_desc: "この人物は神聖な幻視を宮廷で公言し、その地位を高めた。"
 pam_sf_consecrated_arms_modifier: "聖別された紋章"
 pam_sf_consecrated_arms_modifier_desc: "この人物は聖なる祝祭日に家門の紋章の祝福を受けた。"
 pam_sf_serenity_modifier: "公の信仰行為への称賛"
 pam_sf_serenity_modifier_desc: "この人物は公の場で信仰を示し、聖職者や宮廷からの好意を得ている。"
 pam_sf_humiliated_modifier: "屈辱的な誓い"
 pam_sf_humiliated_modifier_desc: "この人物は強制的に聖なる誓いを立てさせられ、修道院に閉じ込められている。"
 pam_sf_promised_acclaim_modifier: "巡礼者の約束"
 pam_sf_promised_acclaim_modifier_desc: "この人物の領国祭司は、次に完了した巡礼を首都の人々に宣伝すると約束した。\n\n巡礼を完了すると、[capital|E]が[GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]を#V 15#!年間獲得する。"
 pam_sf_extolled_pilgrimage_county_modifier: "巡礼者の歓迎"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "統治者の巡礼の知らせはこの伯爵領中に響き渡り、人々はその誇りに胸を躍らせている。"
 pam_sf_free_feast_discount_desc: "間近に迫る宴"
 pam_sf_free_feast_modifier: "宴への待望"
 pam_sf_free_feast_modifier_desc: "聖なる免罪を垣間見たことで、この人物の食欲が高まった：\n$EFFECT_LIST_BULLET$次の[GetActivityType( 'activity_feast').GetName]のコスト：[gold_i]#P -100%#!\n#weak 宴が始まると消費される。#!"
 pam_sf_pilgrimage_funded_modifier: "後援付きの巡礼"
 pam_sf_pilgrimage_funded_modifier_desc: "後援者がこの人物の次の巡礼費用の一部を負担することを約束した：\n$EFFECT_LIST_BULLET$[GetActivityType( 'activity_pilgrimage').GetName]のコスト：[gold_i]#P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "後援付きの巡礼"
 pam_sf_ear_of_clergy_modifier: "聖職者への口添え"
 pam_sf_ear_of_clergy_modifier_desc: "教会がこの人物の請願を受け入れる可能性が高くなる：\n$EFFECT_LIST_BULLET$「#V $hof_ask_for_claim_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $hof_ask_for_gold_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $request_excommunication_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $request_legitimacy_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $ecclesiastic_grant_claim_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $strengthen_claim_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $request_enforce_succession_interaction$#!」の受諾率：#P +25#!\n$EFFECT_LIST_BULLET$「#V $request_white_peace_interaction$#!」の受諾率：#P +25#!"
 pam_religious_delirium_modifier: "宗教的妄想"
 pam_religious_delirium_modifier_desc: "この人物は、天そのものが自らに語りかけていると固く信じている：\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E]の獲得量：#P +50%#!\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E]の減少量：#N +50%#!"
 pam_sf_church_builder_modifier: "教会の建設者"
 pam_sf_church_builder_modifier_desc: "この人物は初めて礼拝所を建設して以来、教会を少し安く建設できるようになり、少しずつ敬虔さを獲得している。"
 pam_sf_scriptorium_county_modifier: "作業中の書記"
 pam_sf_scriptorium_county_modifier_desc: "定住した学者たちがこの領分の帳簿を書写し、保管している。"
 pam_sf_doctrine_clarity_modifier: "啓示"
 pam_sf_doctrine_clarity_modifier_desc: "この人物は突然の悟りともいうべき、稀有な啓示を得た。"
 pam_sf_favorable_omen_modifier: "吉兆"
 pam_sf_favorable_omen_modifier_desc: "この人物は天の徴を神の恩寵の表れと解釈し、信徒たちはその祝福に勇気づけられている。"
 pam_sf_omen_of_victory_modifier: "勝利の前兆"
 pam_sf_omen_of_victory_modifier_desc: "天が勝利を約束したと確信し、この人物とその軍勢は恐れることなく行進する。"
 pam_sf_demon_torment_modifier: "悪魔の苦悩"
 pam_sf_demon_torment_modifier_desc: "この人物は自分が悪魔に憑かれており、[GetBuilding('temple_01').GetName]の[holding|E]を建設するか、[GetActivityType('activity_pilgrimage').GetName]に出る必要があると思い込んでいる。"
 pam_sf_besieged_by_demons_modifier: "悪魔の責め苦"
 pam_sf_besieged_by_demons_modifier_desc: "この人物は精神を悪魔に攻め立てられ、狂乱し、身を悶えさせ、日に日に正気を失っている。"
 pam_sf_grief_solace_modifier: "精霊からの慰め"
 pam_sf_grief_solace_modifier_desc: "この人物は幽霊が現れたとされる出来事の後、静かな慰めを得た。"
 pam_sf_grief_warning_modifier: "精霊からの警告"
 pam_sf_grief_warning_modifier_desc: "この人物は、自分が亡霊から警告されたと信じている。"
 pam_sf_peace_of_god_modifier: "神の平和"
 pam_sf_peace_of_god_modifier_desc: "この人物は自分の領国内で神の平和を誓い、それを遂行した。"
 pam_sf_immured_anchorite_modifier: "閉居する隠者"
 pam_sf_immured_anchorite_modifier_desc: "この寺院には、壁に囲まれて閉居する隠者がいる。"
 pam_sf_voice_of_jesus_modifier: "神の声"
 pam_sf_voice_of_jesus_modifier_desc: "この人物は神の声を聞いて変貌を遂げ、まるで神の手が触れたかのようにあらゆる能力が研ぎ澄まされた。"
 pam_sf_stroke_of_god_modifier: "神の一撃"
 pam_sf_stroke_of_god_modifier_desc: "突然の卒中に襲われてこの人物は倒れた。医者たちが「神の一撃」と呼ぶその神聖なる一撃は、脳を鬱血させ、その後身体と精神を損なわせた。"
 pam_sf_lingering_stench_modifier: "消えない臭い"
 pam_sf_lingering_stench_modifier_desc: "どれだけ努力しても、この人物は自分が洗った貧民の足の臭いを忘れ去ることができない。"
 pam_sf_site_of_miracle_county_modifier: "奇跡の地"
 pam_sf_site_of_miracle_county_modifier_desc: "この伯爵領は奇跡の地であり、巡礼者と盗賊を同じように引き寄せている。"
 pam_sf_consecrated_county_modifier: "新たな聖別"
 pam_sf_consecrated_county_modifier_desc: "この伯爵領には新しく聖別された教会がある。"
 pam_sf_flagellant_cults_county_modifier: "苦行者カルト"
 pam_sf_flagellant_cults_county_modifier_desc: "苦行者たちの一団が自らを鞭打ちながらこの伯爵領の通りを歩いている。"
 pam_sf_relic_procession_county_modifier: "聖者の来臨"
 pam_sf_relic_procession_county_modifier_desc: "聖者の遺物が厳かな行列とともにこの伯爵領を練り歩き、人々はそれを受けて少し誇らしげに歩いている。"
 pam_sf_blessed_bell_county_modifier: "洗礼を受けた鐘"
 pam_sf_blessed_bell_county_modifier_desc: "この伯爵領の教会の鐘は洗い清められ、塗油され、名を与えられた。人々はその音が嵐も悪魔も追い払うと信じている。"
 pam_sf_church_ale_county_modifier: "チャーチエール"
 pam_sf_church_ale_county_modifier_desc: "この伯爵領の統治者は教区の人々とともにチャーチエールを汲み交わしたが、それ以来、教区はその話題で持ちきりである。"
 pam_sf_safe_passage_modifier: "通行の安全"
 pam_sf_safe_passage_modifier_desc: "この旅人は街道で救出された後、護衛と安全な通行を保証された。"
 pam_sf_waylaid_road_modifier: "街道での待ち伏せ"
 pam_sf_waylaid_road_modifier_desc: "この旅人は街道で襲撃され、その旅路は危険なものになった。"
 pam_sf_penance_lustful_modifier: "劣情の抑制"
 pam_sf_penance_lustful_modifier_desc: "この人物は色欲の罪を悔い改めており、欲望を抑えている代わりに、なかなか子供が増えない。"
 pam_sf_penance_chaste_modifier: "自制の放棄"
 pam_sf_penance_chaste_modifier_desc: "この人物は、信仰上は罪とされている純潔を、自らの本性に反し捨てようとしている。"
 pam_sf_penance_gluttonous_modifier: "断食の日々"
 pam_sf_penance_gluttonous_modifier_desc: "この人物は大食の罪を悔い改めるため断食し、肉体を削って魂を養っている。"
 pam_sf_penance_temperate_modifier: "長い断食の終わり"
 pam_sf_penance_temperate_modifier_desc: "この人物は、信仰上は罪とされる節制を捨て、心も財布の紐も緩めている。"
 pam_sf_penance_greedy_modifier: "悔悟の施し"
 pam_sf_penance_greedy_modifier_desc: "この人物は強欲の罪を悔い改めるため施しを行い、金庫も良心も軽くしている。"
 pam_sf_penance_generous_modifier: "財布の紐の引き締め"
 pam_sf_penance_generous_modifier_desc: "この人物は、信仰上は罪とされる寛大さを抑え、裕福にはなったが人々から恨まれている。"
 pam_sf_penance_lazy_modifier: "悔悟の労働"
 pam_sf_penance_lazy_modifier_desc: "この人物は怠惰の罪を悔い改めるため、身を粉にして労働に従事している。"
 pam_sf_penance_diligent_modifier: "強制的な休息"
 pam_sf_penance_diligent_modifier_desc: "この人物は、信仰上は罪とされる勤勉さを捨て、心は穏やかになったが生産性は低下している。"
 pam_sf_penance_wrathful_modifier: "怒りの抑制"
 pam_sf_penance_wrathful_modifier_desc: "この人物は悔悛のために怒りを抑えており、人当たりがより穏やかになり、刃の切れ味も鈍くなっている。"
 pam_sf_penance_calm_modifier: "奮起"
 pam_sf_penance_calm_modifier_desc: "この人物は、信仰上は罪とされる平静さを熱情へと奮い立たせ、より苛烈になったものの、無理が生じている。"
 pam_sf_penance_patient_modifier: "急き立てられる生活"
 pam_sf_penance_patient_modifier_desc: "この人物は、信仰上は罪とされる忍耐を捨て、常に忙しく落ち着きがない。"
 pam_sf_penance_impatient_modifier: "忍耐の育成"
 pam_sf_penance_impatient_modifier_desc: "この人物は悔悛のためせっかちな気性を抑えているが、待つことが苦痛になっている。"
 pam_sf_penance_arrogant_modifier: "謙虚さの実践"
 pam_sf_penance_arrogant_modifier_desc: "この人物は悔悛のため高慢な態度を改め、それとともに名声も衰えている。"
 pam_sf_penance_humble_modifier: "高慢な態度"
 pam_sf_penance_humble_modifier_desc: "この人物は、謙虚さよりも高慢さを重視すべきという教えに従っており、名声は得ているが虚栄心が強いと思われている。"
 pam_sf_penance_deceitful_modifier: "率直さの誓い"
 pam_sf_penance_deceitful_modifier_desc: "この人物は欺瞞の罪を悔い改めるため、率直に振る舞う誓いを守っており、狡猾さが鈍っている。"
 pam_sf_penance_honest_modifier: "偽りの習得"
 pam_sf_penance_honest_modifier_desc: "この人物は、自分の信仰において正直さよりも重んじられる狡知さを学び、より抜け目がなくなる一方で、信用を失っている。"
 pam_sf_penance_craven_modifier: "恐怖との対峙"
 pam_sf_penance_craven_modifier_desc: "この人物は臆病の罪を悔い改めるため、恐怖に屈せず踏みとどまっているが、その一瞬一瞬を心底恐れている。"
 pam_sf_penance_brave_modifier: "武勇の抑圧"
 pam_sf_penance_brave_modifier_desc: "この人物は、信仰上は罪とされる武勇を抑えて慎重になったが、戦士としての鋭さを失った。"
 pam_sf_penance_shy_modifier: "無理やりの大胆さ"
 pam_sf_penance_shy_modifier_desc: "この人物は内気な性質を悔い改めるため、無理に大胆に振る舞っているが、あらゆる集まりが苦痛になっている。"
 pam_sf_penance_gregarious_modifier: "沈黙への退避"
 pam_sf_penance_gregarious_modifier_desc: "この人物は罪深い享楽から離れて沈黙に身を置き、そのおかげで友人も減っている。"
 pam_sf_penance_ambitious_modifier: "野心の抑制"
 pam_sf_penance_ambitious_modifier_desc: "この人物は悔悛のために野心に満ちた視線を伏せ、それとともに名声も失っている。"
 pam_sf_penance_content_modifier: "欲望の焚き付け"
 pam_sf_penance_content_modifier_desc: "この人物は、信仰上は罪とされる満足に抗って欲望をかき立て、飽くことなく何かを求めている。"
 pam_sf_penance_arbitrary_modifier: "正義による統治"
 pam_sf_penance_arbitrary_modifier_desc: "この人物は恣意的な統治を悔い改めるため、正義をもって統治し、より公平になる一方で、より貧しくなっている。"
 pam_sf_penance_just_modifier: "気まぐれな統治"
 pam_sf_penance_just_modifier_desc: "この人物は、正義よりも気まぐれを重視すべきという教えに従って統治し、裕福になる一方で、人々からの人気を失っている。"
 pam_sf_penance_cynical_modifier: "信仰の再燃"
 pam_sf_penance_cynical_modifier_desc: "この人物は冷笑的な態度を悔い改めるため信仰を呼び覚ましたが、着慣れない上衣をまとっているような心地である。"
 pam_sf_penance_zealous_modifier: "熱意の抑圧"
 pam_sf_penance_zealous_modifier_desc: "この人物は、自分の信仰において過剰とされる熱意を冷まそうとしており、信徒たちの態度も冷ややかになっている。"
 pam_sf_penance_paranoid_modifier: "信頼の習得"
 pam_sf_penance_paranoid_modifier_desc: "この人物は猜疑心を悔い改めるため人を信頼することを学び、心の扉を開いて警戒を解いている。"
 pam_sf_penance_trusting_modifier: "心の閉鎖"
 pam_sf_penance_trusting_modifier_desc: "この人物は、信仰上は無防備すぎるとされる自分の心を閉ざし、用心深くなる一方で、冷たい人間と思われている。"
 pam_sf_penance_compassionate_modifier: "慈悲の抑制"
 pam_sf_penance_compassionate_modifier_desc: "この人物は、信仰上は罪とされる慈悲を抑え、より厳しい顔つきになったため、他者から恐れられている。"
 pam_sf_penance_callous_modifier: "慈悲の育成"
 pam_sf_penance_callous_modifier_desc: "この人物は非情な心を悔い改めるため慈悲を育み、処遇がより柔和になり、かつて頼みとしていた恐怖支配も消えつつある。"
 pam_sf_penance_sadistic_modifier: "残虐さの放棄"
 pam_sf_penance_sadistic_modifier_desc: "この人物は悔悛のために残虐さを捨て、人々に植え付けてきた恐怖も消えつつある。"
 pam_sf_penance_stubborn_modifier: "意志の折り曲げ"
 pam_sf_penance_stubborn_modifier_desc: "この人物は悔悛のため、頑固な意志を曲げて助言に従い、以前なら譲らなかった場面でも折れるようになっている。"
 pam_sf_penance_fickle_modifier: "魂の安定"
 pam_sf_penance_fickle_modifier_desc: "この人物は気まぐれな心を悔い改めるため、堅実な道を歩もうとしているが、それに苛立ちを感じている。"
 pam_sf_penance_eccentric_modifier: "慣習の受容"
 pam_sf_penance_eccentric_modifier_desc: "この人物は奇抜な性質を悔い改めるため、奇異な考えを止めている。"
 pam_sf_penance_vengeful_modifier: "寛容の実践"
 pam_sf_penance_vengeful_modifier_desc: "この人物は復讐心を悔い改めるため、過去の恨みを水に流している。捕虜にはより寛大になったものの、反撃は遅くなっている。"
 pam_sf_penance_forgiving_modifier: "恨みの温存"
 pam_sf_penance_forgiving_modifier_desc: "この人物は、赦しよりも遺恨の念を重視すべきという教えに従っており、より冷酷で恐れられる存在となっている。"
 pam_mystical_birthright_spiritual_leader_modifier: "吉兆の子"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "生来の徴が、この人物の信仰上の成長に影響を与えてきた。"
 pam_personal_sacrifice_of_wealth_county_modifier: "信仰への投資"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "統治者による信仰上の捧げ物が、この伯爵領の発展を促している。"
 pam_sf_grinding_modifier: "魂を蝕む仕事"
 pam_sf_grinding_modifier_desc: "この人物はひたすら仕事に追われ、そのために魂をすり減らしている。"
