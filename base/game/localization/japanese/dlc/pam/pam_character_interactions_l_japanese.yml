 pam_interactions_events.0039.desc: "突然の知らせとなってしまったが、伝えねばならないことがある。私は[target.GetName]を[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetTitleAsName]へ引き渡すことにした。\n\nこの決定は、お前の治める[ROOT.Char.GetPrimaryTitle.GetTierAsName]をめぐる私と[actor.GetTitledFirstNameNicknamed]との交渉を取りまとめた[secondary_recipient.GetTitledFirstNameRegnal]の裁定によるものだ。[recipient.GetCapitalLocation.GetTitle.GetNameNoTier]へ戻れ。近いうちに新たな職務に就くことになるだろう。"
