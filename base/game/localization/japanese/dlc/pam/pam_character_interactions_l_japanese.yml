 JUSTIFY_DIVORCE_INTERACTION_OPTION: "宗教法による正当化"
 divorce_justified_tt: "以下のいずれか：\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]があなたの殺害を企てた\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]が[GetTrait('adulterer').GetName( secondary_recipient )]である\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]の[fertility|E]が非常に低く、あなたとの婚姻において子供がいない\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINamePossessive]の[faith|E]が[faith_hostile|E]または[faith_evil|E]である\n$EFFECT_LIST_BULLET$複婚制が禁じられているにもかかわらず、[secondary_recipient.GetShortUIName]に複数の[spouses|E]がいる\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]が不能である\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]に[incestuous|E]の愛人がいる\n$EFFECT_LIST_BULLET$あなたの[secondary_recipient.GetShortUIName]との婚姻が[incestuous|E]である\n$EFFECT_LIST_BULLET$あなたと[secondary_recipient.GetShortUIName]の婚姻は同性婚であり、禁じられている"
 divorce_justified_secondary_tt: "以下のいずれか：\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]が[secondary_actor.GetShortUIName]の殺害を企てた\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]が[GetTrait('adulterer').GetName( secondary_recipient )]である\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]の[fertility|E]が非常に低く、その婚姻において子供がいない\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINamePossessive]の[faith|E]が[faith_hostile|E]または[faith_evil|E]である\n$EFFECT_LIST_BULLET$複婚制が禁じられているにもかかわらず、[secondary_recipient.GetShortUIName]に複数の[spouses|E]がいる\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]が不能である\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]に[incestuous|E]の愛人がいる\n$EFFECT_LIST_BULLET$[secondary_actor.GetShortUINamePossessive|U]と[secondary_recipient.GetShortUIName]の婚姻が[incestuous|E]である\n$EFFECT_LIST_BULLET$[secondary_actor.GetShortUINamePossessive|U]と[secondary_recipient.GetShortUIName]の婚姻は同性婚であり、禁じられている"
