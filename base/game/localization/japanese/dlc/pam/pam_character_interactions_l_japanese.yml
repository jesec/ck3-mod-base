 ASK_FOR_INFLUENCE_TEXT: "\n[actor.GetFaith.PriestNeuterPlural|U]は[actor.GetFaith.HighGodNamePossessive]の栄光を讃える聖歌が歌われる場でのみ権勢を振るうのではない…密談が囁かれる場でも、彼らの言葉には耳が傾けられる。\n\n[actor.GetTopLiege.Custom('GetTitleTierAdjective')]の宮廷で、我が一族のために貴殿の聖なる唇で口添えしてもらいたい。"
