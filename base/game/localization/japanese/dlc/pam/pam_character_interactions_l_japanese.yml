 pam_interactions_events.0097.opening: "我が[ROOT.Char.Custom('GetTitleTierAdjective')]たる子よ"
 pam_interactions_events.0097.desc: "そなたの請願は聞き入れられた。[target.GetName]は長らく空位となっており、この地の[ROOT.Char.GetFaith.GetAdherentName]の魂には導き手がいなかった。それでは[ROOT.Char.GetFaith.HighGodName]への敬意を疑われよう。\n\n謹んで称号を戴くがよい。教会は、授けた[title|E]のことを決して忘れぬ。"
 pam_interactions_events.0097.desc_holy_war: "そなたの請願は聞き入れられ、その誓いは決して忘れられぬよう、しかと書き記された。[target.GetName]はそなたのものとなった。だが、その一部はいまだ[ROOT.Char.GetFaith.HighGodName]を否定する者たちの支配下にある。\n\nその地へ赴き、そなたの称号がすでにそなたのものと認めているものを、その手に収めよ。信仰篤き[ROOT.Char.GetFaith.PriestNeuter]が、そなたの戦いを咎めることなどあるまい。だが5年後、我らはそなたの誓いの行く末を問う。その時、果たされぬままであれば、それは誓いを破ったものとみなされるだろう。"
 pam_interactions_events.0097.a: "[target.GetNameNoTierNoTooltip]の責任は私が負おう。"
