 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal]よ"
 pam_interactions_events.0050.desc: "[puppet_or_actor.GetFaith.ReligiousText]では、婚姻は聖なる結びつきである。だが、生身の男女が生きるこの世界では…婚姻はそこまで完璧なものではない。\n\nあなたは[secondary_recipient.GetTitledFirstName]と私を別れさせることを拒んだ。では、残されたこの修羅場をどうせよと…？"
 pam_interactions_events.0050.aa: "あなたを苦しめているのは肉欲だ。"
 pam_interactions_events.0050.aa.tt: "愛を知らないこの愚か者に、肉体へのあらゆる欲求と期待を捨て去るために何をすべきかを叩き込む…"
 pam_interactions_events.0050.a: "[recipient.GetFaith.PositiveAfterLife]に至る道？それは愛。献身だ。"
 pam_interactions_events.0050.a.tt: "あなたの導きにより、破綻寸前のこの夫婦は、互いの中に救いを見出せるかもしれない。"
 pam_interactions_events.0050.b: "[recipient.GetFaith.GoodGodNames]の御前で立てた誓いを果たしなさい。"
 pam_interactions_events.0050.c: "この聖なる婚姻への侮りは冒涜だ！"
 pam_interactions_events.0050.d: "二人で共に祈るのだ、[recipient.GetFaith.HighGodNamePossessive]の導きを。"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\n私が終わらせてくれと頼んでいるのは、近親相姦の契りであり、自然に反する関係だ！"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\n我々の[puppet_or_actor.GetFaith.GetAdjective]信仰が、私の寝床からこの[secondary_recipient.GetWomanMan]を追い出すよう迫っている！"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\n[secondary_recipient.GetFirstNameNoTooltip]が、惨めな不能者呼ばわりされていることをお忘れなきよう…"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は我々の絆を軽視し、公然と下劣な近親相関を行っている。恥辱の極みだ！"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は私に対して貞淑ではなかった。しかもそれは周知の事実だ！"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\n[puppet_or_actor.GetFaith.HighGodName]は、私に男と結婚するよう定めた！しかし、[secondary_recipient.GetFirstNameNoTooltip]は…男としての役目を果たすこともできない！"
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\nおお[puppet_or_actor.GetFaith.HighGodName]よ、あの悪魔のような[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]は、私を殺させようとしたのだ！"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は複婚主義者だ！私は[secondary_recipient.GetHerHis]の家畜の中の一頭に過ぎない！どうか私を解放したまえ！"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\n私がこれ以上、あの卑劣な[secondary_recipient.GetFaith.GetAdjective]の異教徒と寝床を共にすることを、[puppet_or_actor.GetFaith.HighGodName]がお望みになることなどあろうか？"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\n私が離婚をあなたに懇願する理由は誰の目にも明らかだ！[secondary_recipient.GetFirstNameNoTooltip]、あの好色な[puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))]が私に不実を働いたのだ。"
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\n我々の間に子はない。そして今後も実を結ぶ見込みはないのだ。"
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\n何かもっともらしい口実をでっち上げてもらわなければならない、[puppet_or_actor.GetFaith.HighGodName]にかけて！私が[secondary_recipient.GetFirstNameNoTooltip]を憎んでいるという事実だけで、理由としては十分なはずだ。"
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\n正当な理由などありはしない…しかし私は、宗教法に精通したあなたなら、離縁の口実を#EMP 見つけ出せる#!と信じている。"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\n私が終わらせてくれと頼んでいるのは、近親相姦の契りであり、自然に反する関係だ！"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\n我々の[puppet_or_actor.GetFaith.GetAdjective]信仰が、私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]の寝床からこの[secondary_recipient.GetWomanMan]を追い出すよう迫っている！"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip]が、惨めな不能者呼ばわりされていることをお忘れなきよう…"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は夫婦の絆を軽視し、あからさまに下劣な近親相関を行っている。恥辱の極みだ！"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]に対して貞淑ではなかった。しかもそれは周知の事実だ！"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName]は、私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]に男と結婚するよう定めた！しかし、[secondary_recipient.GetFirstNameNoTooltip]は…男としての役目を果たすこともできない！"
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName]にかけて、あの悪魔のような[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]は、私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]を殺させようとしたのだ！"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は複婚主義者だ！私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]は[secondary_recipient.GetHerHis]の家畜の中の一頭に過ぎない！どうか[secondary_actor.GetHerHim]を解放したまえ！"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH_SECONDARY: "\n\n私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]がこれ以上、あの卑劣な[secondary_recipient.GetFaith.GetAdjective]の異教徒と寝床を共にすることを、[puppet_or_actor.GetFaith.HighGodName]がお望みになることなどあろうか？"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT_SECONDARY: "\n\n私が離婚をあなたに懇願する理由は誰の目にも明らかだ！[secondary_recipient.GetFirstNameNoTooltip]、あの好色な[puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))]が私の[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]に不実を働いたのだ。"
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY_SECONDARY: "\n\n彼らの間に子はない。そして今後も実を結ぶ見込みはないのだ。"
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED_SECONDARY: "\n\n何かもっともらしい口実をでっち上げてもらわなければならない、[puppet_or_actor.GetFaith.HighGodName]にかけて！我々が[secondary_recipient.GetFirstNameNoTooltip]を憎んでいるという事実だけで、理由としては十分なはずだ。"
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED_SECONDARY: "\n\n正当な理由などありはしない…しかし私は、宗教法に精通したあなたなら、離縁の口実を#EMP 見つけ出せる#!と信じている。"
