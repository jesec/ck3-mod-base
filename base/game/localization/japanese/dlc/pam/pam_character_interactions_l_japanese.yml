 pam_interactions_events.0072.opening: "下劣な[recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)]よ"
 pam_interactions_events.0072.desc_joined_war: "今、私はお前のもとへ来た。宣教師としてお前の闇に光を灯すために。[puppet_or_actor.GetMotherFather]として罰を与えるために。\n\nさらに、私の傍らには、[puppet_or_actor.GetFaith.GoodGodNames]の戦士、[secondary_recipient.GetName]が控えている。その軍勢は、[target.GetNameNoTier]を悪から解き放つだろう。"
 pam_interactions_events.0072.desc: "もはや手遅れだ。悔い改める機会はない。\n\n見よ、邪悪なる[recipient.GetPrimaryTitle.GetNameNoTier]の地は引き裂かれる！見よ、[puppet_or_actor.GetFaith.DevilName]の僕たちは虐殺される！私は信徒たちに武器を取らせ、お前を滅ぼすために[secondary_recipient.GetName]を差し向けたのだ！"
 pam_interactions_events.0072.a: "我々にこのような[puppet_or_actor.GetWomenMen]を差し向けるとは、[puppet_or_actor.GetFaith.HighGodName]はなんと残忍なことか！"
