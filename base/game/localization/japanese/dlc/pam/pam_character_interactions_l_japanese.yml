 DEMAND_DIVORCE_NOTIFICATION: "配偶者である[secondary_recipient.GetTitledFirstName]を離縁するよう要求するのは私の役目である。"
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nあなたは[secondary_recipient.GetFirstNameNoTooltip]と血を分けており、世の誰もが知るところである。そのような近親相姦は[actor.GetFaith.HighGodName]の御前において許されるものではない。"
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nあなた方の結びつきは、[actor.GetFaith.HighGodName]が定めた夫婦の絆を冒瀆するものである。これを看過することはできない。"
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は異教の神々にひざまずきながらも、あなたと寝床を共にしている。私はそのような結びつきを許すことはできない。"
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip]は真の信仰から逸脱し、あなたの魂までも引きずり込んでいる。この結びつきは許されない。"
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\n[secondary_recipient.GetFirstNameNoTooltip]があなたの夫婦の絆を裏切ったことは、世の誰もが知っている。壊れたものは、今こそ終わらせなければならない。"
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\nあなたは[secondary_recipient.GetFirstNameNoTooltip]を大勢いる配偶者の一人として抱えているが、それは[actor.GetFaith.HighGodName]が忌み嫌うものである。これを看過することはできない。"
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\n教養ある者があなたと[secondary_recipient.GetFirstNameNoTooltip]の血統を辿ったところ、禁忌とされる近親婚の範囲内で絡み合っていることが判明した。血縁関係——その調査結果は極めて決定的である。"
