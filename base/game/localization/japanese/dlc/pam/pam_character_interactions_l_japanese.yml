 pam_interactions_events.0090.desc: "まことに、[recipient.GetFaith.HighGodName]は[recipient.GetPrimaryTitle.GetNameNoTier]に慈愛の眼差しを注いでおられる！あなたの宣言によって私はこの地の[recipient.GetTitleAsName]となり、[recipient.GetFaith.GetAdjective]の信徒たちの間に喜びが広がっている。\n\n私は自らの命をもって、この[recipient.GetPrimaryTitle.GetTierAsName]を守ろう。法をもって賢明に治めよう。剣と王笏をもって毅然と統治しよう。そして、あなたの助言には深く耳を傾けよう。"
