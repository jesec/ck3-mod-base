 pam_interactions_events.0010: "あなたに土地と称号を授けた[actor.GetFaith.HighGodNamePossessive]のご意思は、一体いつまで無視され続けるのでしょう。[target.GetTierAsNamePossessiveNoTooltip]の民は、一体いつまで[actor.GetHouse.GetName]の血を引く羊飼いを持たぬまま苦しめばいいのでしょう。\n\n私はあらゆる法廷で、あらゆる評議会で、あらゆる論説で、あなたの[target.GetNameNoTierNoTooltip]に対する請求権を支持します。\n\nあなたの請求権が、あなたとともに消え去ることはありません。"
 pam_interactions_events.0010.a.low_zeal: "こうして先祖伝来の権利が築かれるのだ…"
