 pam_interactions_events.0100.t: "もはや庶子にあらず"
 pam_interactions_events.0100.desc: "[ROOT.Char.GetFaith.HighGodName]と集まった信徒たちの前で、[actor.GetTitledFirstName]は私を正統な生まれとして宣言した。出生によって奪われたものを、聖職者たちが聖なる儀礼と一筆の署名によって与えてくれた。\n\n二度と誰も私を庶子などと呼ぶことは許さない。"
 pam_interactions_events.0100.a: "汚点は洗い流された！"
 pam_interactions_events.0101.opening: "あなたの一族に祝福あれ、"
 pam_interactions_events.0101.desc: "喜ばしい知らせを伝えられることを嬉しく思う。私は[ROOT.Char.GetFaith.HighGodName]の御前において、あなたの[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))]である[recipient.GetFirstNameNoTooltip]が正統な生まれであることを宣言した。\n\nもはやいかなる法律も噂も、[recipient.GetHerHis]の出生を理由に[recipient.GetHerHim]を咎めることはできない。"
 pam_interactions_events.0101.a: "実に喜ばしい知らせだ。"
