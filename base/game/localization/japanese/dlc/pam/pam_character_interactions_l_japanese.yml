 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName]よ、ああ不当に権利を奪われし[actor.GetTitledFirstNameNoTooltip]よ！"
 pam_interactions_events.0020_threatened: "どうか我が[secondary_recipient.GetFaith.GetReligion.GetAdjective]の[secondary_recipient.GetFaith.HouseOfWorshipPlural]へ向けようとしている懲罰や非難、武力行使を思いとどまってください。あなたの恐るべき覚悟は、いずれ必要となる日が来るでしょう。なぜなら、[target.GetNameNoTier]に対する請求権はあなたのものだからです。"
 pam_interactions_events.0020_offer_hook: "あなたが[secondary_recipient.GetPrimaryTitle.GetNameNoTier]を支持すると約束してくれたことが、私を動かしたのです。そして私は、長らく顧みられなかったあなたの[target.GetNameNoTier]に対する請求権を裏付ける証拠を見つけ出したのです！"
 pam_interactions_events.0020_indebted: "この卑しき[secondary_recipient.GetFaith.PriestNeuter]は、あなたに恩義があります。ゆえに私は探し求め、ついに見つけたのです。[target.GetNameNoTier]は本来あなたの一族に属する土地であり、不当にあなたから奪われていたことを示す、疑いようのない証拠を！"
 pam_interactions_events.0020: "[target.GetNameNoTier]を請求することはあなたの正当な権利です。それは神の摂理によって与えられた古き権利なのです！私はその証拠をあなたの評議会に送りました。"
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal]はこの知らせを決して喜ばないでしょう。ですが[secondary_recipient.GetFaith.FateGodName]は、詐欺師の抗議など意に介しません。"
 pam_interactions_events.0020.a.low_zeal: "こうして歴史は書き換えられる…"
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip]は聖なる権利によって私のものとなる！"
 pam_interactions_events.0020.a: "私の請求権は成立した。[recipient.GetTitledFirstNameNoTooltip]など知ったことか。"
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName]は、[puppet_or_actor.GetShortUIName]に[target.GetNameNoTier]に対する請求権を付与した"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName]よ、"
 pam_interactions_events.0021: "もしあなたが[target.GetNameNoTier]を治めるべき運命にあったのなら、[secondary_recipient.GetFaith.HighGodName]が生まれながらの権利としてそれを授けていたはずではありませんか？\n\n私は断じて、[recipient.GetTitledFirstNameRegnal]を軽んじ、あなたの悪しき企てのために偽りを記し、あなたと私、双方の魂を穢すような真似はいたしません。\n\n自らの過ちを悔い改めなさい。"
 pam_interactions_events.0021.a: "[secondary_recipient.GetFaith.HouseOfWorship|U]の庇護をいいことに、身の程知らずめ！"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの[target.GetNameNoTier]に対する請求権付与の要請を拒否した"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "我が生得の権利を握る者よ。"
 pam_interactions_events.0022_shrimp: "私は一介の[actor.GetTitleAsName]にすぎない。しかし、[actor.GetFaith.GetAdjective]の[secondary_recipient.GetFaith.AltPriestTermPlural]は、私の血筋こそが[target.GetName]全土に対する請求権を古くから受け継いできたことを突き止めたのだ。"
 pam_interactions_events.0022_shark: "[target.GetName]は、[actor.GetFaith.HighGodName]により我が[actor.Custom('GetTitleTierAdjective')]の血筋に授けられたものである。それは今日まで知られてこなかっただけで、古より変わらぬ事実である。"
 pam_interactions_events.0022: "学識ある者たちの間では以前から知られていたこの事実が、今改めて証明された。私は正当な権利をもって[target.GetName]を請求できるのだ。"
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal]は私の請求権に聖なる認可を与えた。[secondary_recipient.GetPrimaryTitle.GetName]もまた、全面的に私を支持している。\n\nだから私は願い、祈っている。いつの日か、美しき[target.GetNameNoTierNoTooltip]の主として迎えられる日が来ることを…"
 pam_interactions_events.0022.a: "嘘だ！偽りの[secondary_recipient.GetFaith.PriestNeuter]に裏付けられた、偽りの請求権にすぎない！"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "聖なる[secondary_recipient.GetMotherFather]よ。"
 pam_interactions_events.0023_shrimp: "もし私に正当な請求権があるなら、[actor.Custom2('InsultAdjective', recipient)][recipient.GetFirstNameRegnal]よりも、私の方が[target.GetName]を公正に治められるのではないでしょうか。どうか、この一介の[actor.GetTitleAsName]に[actor.GetFaith.HighGodNamePossessive]の光をお与えください。"
 pam_interactions_events.0023_shark: "[actor.GetFaith.HighGodNamePossessive]の御意志により、私はすでに数々の土地と民を治め、その守り手となっています。しかし、[target.GetName]は私の権利が及ばない領域にあります。"
 pam_interactions_events.0023: "信徒たちの間では混乱が生じています。私が[target.GetName]を手にすべきだと強く望む者もいれば、私の権利を否定する者もいます。"
 pam_interactions_events.0023_end: "\n\nあなたほど博識なお方であれば、歴史の中から必要な証拠を#EMP 見つけ出せる#!ことでしょう…そして、[target.GetNameNoTierNoTooltip]への請求権を私にお授けいただけるものと信じております。"
 pam_interactions_events.0023.a: "我が[actor.Custom('GetDaughterSon')]よ、どうか[target.GetNameNoTierNoTooltip]があなたのものとならんことを。"
 pam_interactions_events.0023.b: "[secondary_recipient.GetTitleAsNameNoTooltip]たる者、偽りを語ってはならない。"
