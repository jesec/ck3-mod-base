 pam_interactions_events.0070.t: "[puppet_or_actor.GetTitleAsNameNoTooltip]のための戦争"
 pam_interactions_events.0070.desc_intro_pagan: "「[target.GetNameNoTier]の邪悪な異教徒どもに、"
 pam_interactions_events.0070.desc_intro_heretic: "「[target.GetNameNoTier]の異端者である[recipient.GetFaith.GetAdherentNamePlural]どもに、"
 pam_interactions_events.0070.desc_intro_infidel: "「[target.GetNameNoTier]の[recipient.GetFaith.GetReligion.GetAdjective]の異端派に、"
 pam_interactions_events.0070.desc_intro_heathen: "「[target.GetNameNoTier]の異教徒である[recipient.GetFaith.GetReligion.GetAdherentNamePlural]どもに、"
 pam_interactions_events.0070.desc: "#EMP 天罰、滅亡——剣による死を！#!」[puppet_or_actor.GetTitledFirstNameRegnal]は叫ぶ。その言葉は殺気立つ[secondary_recipient.GetPrimaryTitle.GetNameNoTier]の民衆へと広がっていく。\n\n「[ROOT.Char.GetFaith.random_GoodGodNames]の聖旗を掲げよ、[ROOT.Char.GetTitledFirstName]！[target.GetNameNoTierNoTooltip]の地から[recipient.GetTitledFirstName]を追放せよ！あの[recipient.GetPrimaryTitle.GetAdjective]の[recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]どもを、[ROOT.Char.GetFaith.NegativeAfterLife]の業火に投げ込むのだ！」\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "[puppet_or_actor.GetTitleAsNameNoTooltip]は本当に、[puppet_or_actor.GetFaith.HighGodNamePossessive]の支配を広げることを切望している！[puppet_or_actor.GetSheHe|U]は自ら馬を駆って戦場へ赴き、その軍勢を私の自由に使わせると誓っている。"
 pam_interactions_events.0070.desc_outro_funding_war: "この要求には金銭も添えられている。[puppet_or_actor.GetTitleAsNameNoTooltip]は戦費の提供を約束しているのだ。そのため我が[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]の[ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]たちは、信仰心のみを頼みにした場合よりもはるかに奮い立つだろう。"
 pam_interactions_events.0070.a: "「[ROOT.Char.GetFaith.WarGodName]は我らとともに！#EMP いざ、戦場へ！#!」"
 pam_interactions_events.0070.b: "[recipient.GetTitledFirstNamePossessiveNoTooltip]の民は巻き込まずにおこう。"
 cultural_acceptance_gain_refused_incited_holy_war: "世俗の統治者が聖戦の勃発を阻止した"
 pam_interactions_events.0071.t: "[ROOT.Char.GetFaith.HighGodNamePossessive]の[target.GetNameNoTierNoTooltip]征服"
 pam_interactions_events.0071.desc_intro: "鬨の声によって、歌によって、そして勝利の祈りによって——[ROOT.Char.GetFaith.HighGodNamePossessive]の聖なる言葉が、[recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]たちがはびこる[target.GetTierAsNameNoTooltip]へと届けられた！[secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier]の主たる[ROOT.Char.GetFaith.HouseOfWorship]から、[secondary_recipient.GetName]は聖戦を布告する。その相手は"
 pam_interactions_events.0071.desc_intro_pagan: "[recipient.GetPrimaryTitle.GetAdjective]の異教徒だ。\n\n野蛮な獣のように、[recipient.GetTitledFirstName]とその[recipient.GetCulture.GetCollectiveNoun]の民は、[secondary_recipient.GetPrimaryTitle.GetNameNoTierPossessive]の[secondary_recipient.GetFaith.GetReligion.GetAdjective]の義なる軍勢が迫れば、必ずや四散するに違いない！"
 pam_interactions_events.0071.desc_intro_heretic: "[recipient.GetPrimaryTitle.GetAdjective]の異端者だ。\n\n血の大波の中で、[recipient.GetTitledFirstName]とその汚らしい[recipient.GetFaith.GetAdherentNamePlural]たちはこの地から一掃されるだろう！それが[ROOT.Char.GetFaith.HighGodName]の御言葉を歪める者の定めなのだ！"
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.GetPrimaryTitle.GetNameNoTier]の[recipient.GetTitleAsName]だ。\n\n[recipient.GetFaith.GetReligion.GetAdjective]の異端派たちは、預言者の#EMP ジハード#!に敗れた過去の者たちと同様に、まもなく服従させられるだろう！"
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.GetPrimaryTitle.GetNameNoTier]の[recipient.GetTitleAsName]だ。\n\n[ROOT.Char.GetFaith.WarGodName]に誓って、[secondary_recipient.GetSheHe]は異教徒の軍勢を打ち砕くだろう！そしてすべての[ROOT.Char.GetFaith.GetReligion.GetAdjective]の民が、驚嘆の眼差しでそれを見つめるのだ。"
 pam_interactions_events.0071.desc_outro_joining_war: "\n\n私の軍勢も傍観しているつもりはない。断じてだ！彼らは[secondary_recipient.GetTitledFirstNamePossessiveNoTooltip]の[secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l]とともに、[recipient.GetCapitalLocation.GetTitle.GetNameNoTier]の城壁を突破するのだ。"
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nすでに、[secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip]をはじめとする各地から、熱狂的な戦士たちが[secondary_recipient.GetTitledFirstNamePossessiveNoTooltip]の旗のもとに集結している。"
 pam_interactions_events.0071.desc_outro_funding_war: "\n\n[ROOT.Char.GetFaith.HighGodNamePossessive]の加護だけでも[secondary_recipient.GetTitledFirstNameNoTooltip]の勝利は約束されている。しかし、私からの惜しみない寄進が[secondary_recipient.GetHerHis]の確信をさらに揺るぎないものにするのだ。"
 pam_interactions_events.0071.a: "この大義のために死ぬ者たちが、永遠に羨望の対象にならんことを。"
