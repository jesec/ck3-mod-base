 pam_interactions_events.0060.t: "離婚の正当化"
 pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName]は[puppet_or_actor.GetHerHis]の婚姻を終わらせたいと望んでいる。それは確かだ。しかし、[puppet_or_actor.GetSheHe]と[secondary_recipient.GetTitledFirstName]が互いにどれほど憎み合っていようと…二人は[puppet_or_actor.GetFaith.HighGodName]の御前で契りを交わしたのだ。そして、その婚姻を終わらせる正当な理由などない。\n\nそのため、私は嘘をでっち上げて、二人の離縁を正当化しなければならない。これは冒涜であり…相応の見返りを求めても差し支えないはずだ…"
 pam_interactions_events.0060.a: "この離縁には…血塗られた醜聞がふさわしい。"
 pam_interactions_events.0060.a.tt: "高潔な嘘など必要ない。[secondary_recipient.GetFirstNameNoTooltip]に対し下劣な告発をしてやろう！[secondary_recipient.GetHerHis|U]の一族は[secondary_recipient.GetHerHis]の弁護に回らざるを得なくなり…[puppet_or_actor.GetFirstNamePossessiveNoTooltip]の親族も[puppet_or_actor.GetHerHis]を守らざるを得なくなるだろう。"
 pam_interactions_events.0060.b: "[puppet_or_actor.GetTitleAsNameNoTooltip]に信徒へ土地を寄進させよう。"
 pam_interactions_events.0060.b.tt: "称号を[lease_order.GetName]に譲渡すれば、冒涜による罪の重荷が和らぐだろう…"
 pam_interactions_events.0060.c: "恩には恩で返してもらおう。"
 pam_interactions_events.0060.d: "[secondary_recipient.GetFirstNameNoTooltip]は聖職に就く約束がされていたと偽ろう。"
 pam_interactions_events.0060.d.tt: "[secondary_recipient.GetSheHe]がはるか昔に[divorcee_joining_order.GetName]に誓いを立てていたのなら、この婚姻は無効になる！ならば、[secondary_recipient.GetFirstNamePossessiveNoTooltip]の新たな人生を導くのに、私以上の適任者がいるだろうか？"
 pam_interactions_events.0060.e: "この不幸な夫婦から見返りは求めない。"
