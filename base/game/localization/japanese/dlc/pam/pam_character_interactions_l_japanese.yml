 pam_interactions_events.0091.opening: "我が恩人よ"
 pam_interactions_events.0091.desc_hook_theocrat: "あなたの取りなしにより、私は大きな御恩を賜りました。私の一方の手には羊飼いの杖があり、もう一方の手は[recipient.GetFaith.HighGodName]ご自身の御手にしっかりと握られています。私が[recipient.GetFaith.HighGodHerHis|U]の忠実な僕である以上、これもまた、定めというものでしょう！[target.GetNameNoTier]は偉大なる贈り物であり、私はその恩恵に深く感謝しています。\n\n全土に知らしめましょう——[ROOT.Char.GetTitledFirstNameRegnal]の御意向により、この[target.GetTierAsName]は聖職者のものとなるのだと！"
 pam_interactions_events.0091.desc_hook: "あなたの取りなしにより、私は大きな御恩を賜りました。私の一方の手には統治の笏があり、もう一方の手は[recipient.GetFaith.HighGodName]ご自身の御手にしっかりと握られています。これもまた、定めというものでしょう。[target.GetNameNoTier]は偉大なる贈り物であり、私はその恩恵に深く感謝しています。\n\n全土に知らしめましょう——[ROOT.Char.GetTitledFirstNameRegnal]の御意向により、この[target.GetTierAsName]は我が物となったのだと！"
 pam_interactions_events.0091.desc: "あなたの取りなしは、私の想像を超える祝福でした。聖なる[ROOT.Char.GetMotherFather|U]の御手はどこまでも届き、その慈しみもまた深い——[recipient.GetFaith.HighGodName]に感謝を！\n\n[target.GetName]は高貴なる地です。私は謙虚さと慈愛をもってその称号を戴き、[recipient.GetFaith.GetAdherentNamePlural]を治めます。"
 pam_interactions_events.0091.a: "[target.GetNameNoTierNoTooltip]を注意深く見守ろう。"
 pam_interactions_events.0092.opening_theocratic: "敬愛なる[ROOT.Char.GetFaith.PriestNeuter]様"
 pam_interactions_events.0092.opening: "我が[ROOT.Char.Custom('GetTitleTierAdjective')]たる子よ"
 pam_interactions_events.0092.desc_hook: "[recipient.GetFaith.HighGodName]と[recipient.GetFaith.HighGodHerHis|U]の高位聖職者たちがあなたに授けたこの偉大なる賜物に祈りを捧げながらも、自分がこの[target.GetTierAsName]に真にふさわしい存在であるかよく考えなさい。もしかすると、あなたが果たすべき敬虔な奉仕がまだ残っているのではないでしょうか。\n\nこの件については私が助言を授けましょう。[target.GetNameNoTierNoTooltip]におけるあなたの統治が[recipient.GetFaith.HighGodName]の御心にかない、神に奉仕するものとなるよう、我々は努めねばならないのですから。"
 pam_interactions_events.0092.desc: "あなたの[target.GetTierAsNameNoTooltip]の創設が宣言されました！\n\n祈りに導かれ、私はあなたの栄達に、まことに特別な関心を寄せてきました。私が望むのはただ一つ、あなたが良き統治を行い、その治世が[target.GetNameNoTier]の[recipient.GetFaith.GetAdherentNamePlural]にとって祝福となることだけです。"
 pam_interactions_events.0092.a: "[recipient.GetFaith.PositiveAfterLife]からの直々の使命だ！"
