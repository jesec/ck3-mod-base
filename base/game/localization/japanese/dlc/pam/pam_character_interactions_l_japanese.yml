 pam_forced_negotiate_land_relation_tt: "良好な[relations|E]と[spiritual_fulfillment|E]を失い、@rival_icon! [rivals|E]になる可能性がある"
 pam_possible_negotiate_land_relation_tt: "良好な[relations|E]と[spiritual_fulfillment|E]を失い、@rival_icon! [rivals|E]になる"
 pam_forced_negotiate_land_piety_level_1_tt: "[actor.GetShortUIName]は#N 250#!、[recipient.GetShortUIName]は#N 500#!の@piety_icon! [piety_experience|E]を失う"
 pam_forced_negotiate_land_piety_level_2_tt: "[actor.GetShortUIName]は#N 500#!の@piety_icon! [piety_experience|E]を失い、[recipient.GetShortUIName]は#N 1#!の@piety_icon! [piety_level|E]を失う"
 pam_possible_negotiate_land_piety_level_tt: "[actor.GetShortUIName]は#N 1#!、[recipient.GetShortUIName]は#N 2#!の@piety_icon! [piety_levels|E]を失う"
 pam_forced_negotiate_land_legitimacy_level_1_tt: "[actor.GetShortUIName]は#N 100#!、[recipient.GetShortUIName]は#N 200#!の@legitimacy_icon! [legitimacy|E]を失う"
 pam_forced_negotiate_land_legitimacy_level_2_tt: "[actor.GetShortUIName]は#N 200#!の@legitimacy_icon! [legitimacy|E]を失い、[recipient.GetShortUIName]は#N 1#!の@legitimacy_icon! [legitimacy_level|E]を失う"
 pam_possible_negotiate_land_legitimacy_level_tt: "[actor.GetShortUIName]は#N 1#!、[recipient.GetShortUIName]は#N 2#!の@legitimacy_icon! [legitimacy_levels|E]を失う"
 pam_forced_negotiate_land_gold_tt: "[recipient.GetShortUIName]に#N [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! @gold_icon! [gold|E]を支払う"
