 grant_ecclesiastical_title_interaction_desc: "既存の[clerical_title|E]を[recipient.GetShortUIName]に授与する。その座が空席でない場合は、現在の[holder|E]を罷免する\n\n#weak 異なる[rite|E]を奉じる[archbishop|E]の罷免には、相手を上回る[learning|E]と多大な[piety|E]が必要であり、あなたの[faith|E]の[fervor|E]が低下する#!"
