 request_legitimacy_interaction_notification: "\n[actor.GetFaith.HighGodName]の高位聖職者たちは、私を[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetFaith.GetAdherentNamePlural]を治めるにふさわしい人物として認めている——そうですね？ならば、そのことを我が封臣に書面で伝え、我が民に説いていただきたいのです。\n\nあなたの支持がなければ、我が[actor.GetPrimaryTitle.GetTierAsNameNoTooltip]は混乱に陥ってしまうでしょう。"
 strengthen_claim_interaction_notification: "\n[actor.GetFaith.HighGodName]の恩寵は、私の子孫にも及ぶのでしょうか。それとも、私の命とともに失われてしまうのでしょうか。\n\nあなたが宣言してくだされば、私の[target.GetName]への正当な請求権は改めて認められ、私の死後も受け継がれることでしょう。"
