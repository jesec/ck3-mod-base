 refuse_ecclesiastic_land_transfer_penalty_tt: "[recipient.GetShortUIName]が最終的に[target.GetName]をあなたへ譲ることを拒否した場合、[recipient.GetShortUIName]は#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_large_piety_value')]#!の@piety_icon! [piety|E]と#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_large_legitimacy_value')]#!の@legitimacy_icon! [legitimacy|E]を失う"
 refuse_ecclesiastic_land_transfer_penalty_minor_tt: "[recipient.GetShortUIName]が最終的に[target.GetName]をあなたへ譲ることを拒否した場合、[recipient.GetShortUIName]は#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_small_piety_value')]#!の@piety_icon! [piety_experience|E]と#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_small_legitimacy_value')]#!の@legitimacy_icon! [legitimacy|E]を失う"
 refuse_ecclesiastic_land_transfer_penalty_no_legit_tt: "[recipient.GetShortUIName]が最終的に[target.GetName]をあなたへ譲ることを拒否した場合、[recipient.GetShortUIName]は#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_large_piety_value')]#!の@piety_icon! [piety|E]と#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_large_prestige_value')]#!の@prestige_icon! [prestige|E]を失う"
 refuse_ecclesiastic_land_transfer_penalty_minor_no_legit_tt: "[recipient.GetShortUIName]が最終的に[target.GetName]をあなたへ譲ることを拒否した場合、[recipient.GetShortUIName]は#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_small_piety_value')]#!の@piety_icon! [piety_experience|E]と#N [recipient.MakeScope.ScriptValue('clergy_land_refusal_small_prestige_value')]#!の@prestige_icon! [prestige|E]を失う"
 pam_negotiate_land_definite_refusal_actor_tt: "@warning_icon! #X [recipient.GetShortUIName]は[target.GetName]の譲渡要求を#bold 拒否します#!#!"
 pam_negotiate_land_definite_refusal_tt: "#X @warning_icon! [recipient.GetShortUIName]は拒否したことにより、以下のペナルティを受けます：#!#!"
 pam_negotiate_land_possible_acceptance_tt: "[recipient.GetShortUIName]に[titles|E]の譲渡を承諾させるには、[actor.GetShortUIName]は以下のいずれかが必要になる：\n$BULLET_WITH_TAB$[recipient.GetShortUIName]に対する[hook_i] [hook|E]\n$BULLET_WITH_TAB$[friend|E]、[disciple|E]、または[soulmate|E]の[relation|E]\n$BULLET_WITH_TAB$より高い@piety_icon! [piety_level|E]\n$BULLET_WITH_TAB$より高い@legitimacy_icon! [legitimacy_level|E]\n$BULLET_WITH_TAB$#high [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! @gold_icon! [gold|E]または@treasury_icon! [treasury|E]\n$BULLET_WITH_TAB$[recipient.GetShortUIName]が@intimidated_icon! [intimidated|E]状態で、軍事力（[allies|E]を含む）があなたの#high 25%#!未満である\n$BULLET_WITH_TAB$[recipient.GetShortUIName]が@terrified_icon! [cowed|E]状態で、軍事力（[allies|E]を含む）があなたの#high 50%#!未満である"
 clergy_transfer_no_capital_county_tt: "[target.GetName]は[recipient.GetShortUINamePossessive]が保有する唯一の[county|E]である"
 clergy_transfer_instant_accept_terror_tt: "#Weak #EMP あなたの[dread|E]と軍事力が高いため、この[interaction|E]を#bold 受諾する#!#!"
 clergy_transfer_instant_accept_piety_legitimacy_tt: "#Weak #EMP #N 0#! @piety_icon! [piety_level|E]および#N 0#! @legitimacy_icon! [legitimacy_level|E]であるため、この[interaction|E]を#bold 受諾する#!#!"
 clergy_transfer_instant_accept_popes_demands_tt: "#Weak #EMP あなたが@unspent_strong_hook_icon! [strong_hook|E]を持つ[head_of_faith|E]が仲介者であるため、この[interaction|E]を#bold 受諾する#!#!"
