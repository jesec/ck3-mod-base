 bishop_excommunication_target_secular_tt: "[target_char.GetShortUIName|U]は以下のいずれかでなければならない：\n$EFFECT_LIST_BULLET$[excommunicator.GetShortUINamePossessive]の[vassal|E]以下である\n$EFFECT_LIST_BULLET$隣接する[ruler|E]である、または[excommunicator.GetShortUINamePossessive]の[clerical_region|E]内に拠点を置いている\n$EFFECT_LIST_BULLET$[court_chaplain|E]が[excommunicator.GetShortUINamePossessive]の[subordinate|E]以下の立場である\n$EFFECT_LIST_BULLET$[court_chaplain|E]が[excommunicator.GetShortUIName]であり、かつ[excommunicator.GetShortUIName]に[superior|E]が存在しない\n$EFFECT_LIST_BULLET$[liege|E]以上の立場の人物が、[excommunicator.GetShortUIName]を[court_chaplain|E]としている"
 bishop_excommunication_target_courtier_tt: "[target_char.GetShortUINamePossessive|U]の[liege|E]は、[excommunicator.GetShortUIName]、[excommunicator.GetShortUINamePossessive]の[vassal|E]以下、隣接する[ruler|E]、または[excommunicator.GetShortUINamePossessive]の[clerical_region|E]内に拠点を置く人物でなければならない"
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U]は[excommunicator.GetShortUINamePossessive]の[realm|E]、隣接する[county|E]、または[excommunicator.GetShortUINamePossessive]の[clerical_region|E]内にいなければならない"
 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U]は[secondary_recipient.GetShortUIName]を直接[excommunicate|E]できる"
 no_valid_excommunicator_tt: "あなたの[faith|E]には[theocratic|E]の[head_of_faith|E]が存在しないため、[secondary_recipient.GetShortUIName]を[excommunicated|E]できるのは、以下のいずれかを満たす有力な[ecclesiastical|E]の[ruler|E]のみである：\n$EFFECT_LIST_BULLET$[secondary_recipient.GetHerHis]の[liege|E]以上の立場である\n$EFFECT_LIST_BULLET$隣接する[ruler|E]であるか、自身の[clerical_region|E]内に[secondary_recipient.GetHerHis]の[realm_capital|E]が存在する\n$EFFECT_LIST_BULLET$[secondary_recipient.GetHerHis]の[court_chaplain|E]の[superior|E]以上である\n$EFFECT_LIST_BULLET$[secondary_recipient.GetHerHis]の[court_chaplain|E]であり、かつ[superior|E]が存在しない"
