 pam_interactions_events.0094.opening: "正当なる[ROOT.Char.GetTitleAsName]よ！"
 pam_interactions_events.0094.desc_conversion: "[target.GetNameNoTier]に[cleric.GetFaith.HighGodName]の御言葉を広めよ！その迷える民に鞭を惜しんではならず、その地の美徳を守るため、あなたの[ROOT.Char.Custom('GetFighterTermPlural')]の武力を惜しんではならない。\n\nこの[target.GetTierAsNameNoTooltip]はあなたが統治すべき地である。それは世の終わりまで、代々の[ROOT.Char.GetPrimaryTitle.GetAdjective][ROOT.Char.GetTitleAsName]の摂理に#EMP 慣習的#!に委ねられているのだ。"
 pam_interactions_events.0094.desc: "[target.GetNameNoTooltip]の[cleric.GetFaith.GetAdherentNamePlural]にとって祝福された日である！ああ、彼らは[ROOT.Char.GetPrimaryTitle.GetNameNoTier]にいる兄弟姉妹と一つになることをどれほど切望したことか！\n\n[target.GetAdjectiveNoTooltip]の人々の心に宿っていたものが、[cleric.GetFaith.HighGodNamePossessive]の[cleric.GetTitleAsName]によって法として定められた。諸国の君主たちは今や、[target.GetTierAsNameNoTooltip]が[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]の#EMP 慣習的領土#!であることを認めている。"
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip]と[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]は永遠に結ばれる。"
 pam_interactions_events.0095.opening: "[target_county.GetNameNoTier]および諸領地の[ROOT.Char.GetTitleAsName]よ、"
 pam_interactions_events.0095.desc: "あなたは[cleric.GetFaith.HighGodName]の祝福を受ける者となった！[cleric.GetFaith.HighGodHerHis|U]の英知により、[cleric.GetFaith.HighGodNameSheHe|U]は[target.GetName]の全土を[de_jure_master.GetPrimaryTitle.GetName]の[de_jure_master.GetTitleAsName]の永遠なる保護下に置かれた。\n\n[cleric.GetTitleAsName]として、私は[target.GetAdjectiveNoTooltip]の[cleric.GetFaith.GetAdherentNamePlural]、[de_jure_master.GetTitleAsNameNoTooltip]、そして[cleric.GetFaith.HighGodNamePossessive]の現世の領国を#EMP 慣習的に#!分かつ英知を理解する者たちを代表して、この布告を発令する。"
 pam_interactions_events.0095.a: "[de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]の強欲さに呪いあれ！"
 pam_interactions_events.0095.a_same_faith: "まさに、[ROOT.Char.GetFaith.HighGodName]のほかに誰が領国を分配できようか。"
