 # Clerical land transfer events
 # player Priest refuses event
 pam_interactions_events.0031.opening: "聞き分けのない我が[actor.Custom('GetDaughterSon')]よ。"
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName]は、正しき言葉を発するためにあなたに唇を授けました。[actor.GetFaith.HighGodName]は、剣を振るうためにあなたに手を授けました。そして[actor.GetFaith.HighGodName]は、あなたが[actor.GetFaith.PriestNeuterPlural]の知恵に耳を傾けられるよう、この世に彼らを遣わされました。\n\n欲に囚われたあなたは、邪な言葉を口にし、恐れと疑念に縛られて[target.GetNameNoTier]に剣を振るうことを渇望しています。\n\nゆえに、あなたは私の言葉に従うべきです。[target.GetTierAsName]には手を出してはなりません。"
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip]が私の願いを拒んだ！"
 # Player clergy response event
 pam_interactions_events.0033.opening: "天地の秩序を司る方よ、"
 pam_interactions_events.0033_de_jure: "どうかお力をお貸し下さい。私には[target.GetName]を統治する慣習的かつ正当な権利があることをご公言ください。あなたに認めていただければ、私は血を流すことなく[recipient.GetName]を説得できるでしょう。\n\n"
 pam_interactions_events.0033_claim: "私は[target.GetNameNoTier]に対する請求権を行使したいのです。聖なる認可をいただければ、[recipient.GetName]は[target.GetTierAsName]を引き渡し、[actor.GetFaith.GetAdjective]信徒の血が流れることもないでしょう。\n\n"
 pam_interactions_events.0033_threaten: "もしこの願いをお聞き届けいただけないのであれば…私が[target.GetNameNoTierNoTooltip]を焼き払い、多くの命を奪うことについて、[ROOT.Char.GetFaith.HighGodName]に説明することになるのは#EMP あなた#!なのです。"
 pam_interactions_events.0033_succession: "私のためにお口添えいただけるのであれば、約束しましょう。私が[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetTitleAsName]として、跡継ぎとなる子を残さずに死んだ時は、[actor.GetPrimaryTitle.GetNameNoTier]を教会にお譲りします。"
 pam_interactions_events.0033_pilgrimage: "この件でお力添えいただけるのであれば、その報いとして巡礼に赴き、[actor.GetFaith.HighGodName]の祝福に感謝を捧げることをお約束します。"
 pam_interactions_events.0033_use_hook: "まさかお忘れではないでしょう…あなたにその名を与えたのは私であり、あなたが綴る言葉もまた私の意向に従うべきだということを…"
 pam_interactions_events.0033_offer_hook: "敬虔なるあなたの名声は、我が大義の達成にとって大きな助けとなります。この件についてご協力いただけるのなら、いずれ私もあなたに力を貸しましょう。"
 pam_interactions_events.0033_donate: "我が領国が新たな領地を得るためにご協力いただけるなら、喜んで教会に寄進いたします。"
 pam_interactions_events.0033_fallback: "この領地と称号を巡る交渉は、聖なる仲介者なくしては実を結びません。どうか、あなたの聖なる権威を我が大義のためにお貸しください。"
 pam_interactions_events.0033.aa: "よろしい。引き受けよう。"
 pam_interactions_events.0033.a: "我が命により、[target.GetNameNoTierNoTooltip]は[actor.GetFirstNamePossessiveNoTooltip]のものとする。"
 pam_interactions_events.0033.a.tt: "[recipient.GetTitledFirstNameNoTooltip]に書状を送れ。不当に手に入れた領地にしがみつくことは、[secondary_recipient.GetFaith.HighGodName]と[secondary_recipient.GetTitleAsNameNoTooltip]をないがしろにする行為だと伝えるのだ。"
 pam_interactions_events.0033.b: "こんな無礼な要求を受け入れることはできない。"
 pam_interactions_events.0033.b.tt: "世界の秩序は今のままで保たれている。[recipient.GetTitledFirstNameNoTooltipRegnal]が[target.GetNameNoTierNoTooltip]を保持し続けるべきだ。"
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName]は[target.GetName]を譲るよう[recipient.GetShortUIName]に説得を試みますが、失敗する可能性があります#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName]は[target.GetName]を譲るよう[recipient.GetShortUIName]に強制することもできますが、あえて失敗の危険を冒す選択もできます#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName]は抵抗することなく[target.GetName]を[actor.GetShortUIName]に譲る#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold あなたの[GetLaw('church_authority_3').GetName]の[law|E]により、[recipient.GetShortUIName]は抵抗することなく[target.GetName]を[actor.GetShortUIName]に譲る#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "聖なる仲裁者として、これより交渉を開始いたします。"
 pam_interactions_events.0032_intro: "あなたは[target.GetNameNoTier]を見事に治めてこられました。しかし[recipient.GetFaith.HighGodName]は、[target.GetTierAsNameNoTooltip]を[actor.GetName]に与えることを望んでおられます。どうか血を流すことなく、この地を[actor.GetHerHim]にお譲りください。\n\n"
 pam_interactions_events.0032_de_jure: "[target.GetNameNoTierNoTooltip]は、#EMP [de_jure|E]#!権利に基づき[actor.GetHerHis]のものなのです。"
 pam_interactions_events.0032_claim: "全能なる神の御前において、[actor.GetHerHis]が持つ[target.GetNameNoTierNoTooltip]への[claim|E]こそ、最も正当なものなのです。"
 pam_interactions_events.0032.aa: "さて、筆はどこだ…"
 pam_interactions_events.0032.aa.flavor: "ならば全世界に知らしめよう。[recipient.GetFaith.HighGodName]は、この罪深き詐欺師どもからあらゆる[recipient.GetFaith.GetAdjectiveNoTooltip]の美徳を取り上げられたのだと。今も昔も、彼らが持っているものといえば、恥知らずな厚かましさだけだ。"
 clergy_interaction_scholar_block_tt: "#P #bold #EMP [actor.GetShortUINamePossessive]による[target.GetName]獲得の試みが失敗する#!#!#!"
 pam_interactions_events.0032.a: "それが[actor.GetFaith.HighGodName]の御意志ならば、[target.GetNameNoTierNoTooltip]を明け渡そう。"
 pam_interactions_events.0032.b: "いや、いずれの言葉にも納得できない。"
 pam_interactions_events.0032.b.tt: "[actor.GetTitledFirstNameNoTooltip]と[secondary_recipient.GetTitledFirstNameNoTooltip]も、簡単に黙らせられればいいものを…"
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold 以下のいずれかにより、[actor.GetTitledFirstNameNoTooltip]による[target.GetName]の奪取を受け入れるよう働きかけられる可能性があります：#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "[target.GetNameNoTierNoTooltip]を巡る交渉"
 pam_interactions_events.0030.desc_intro_envoy: "聖なる地で、私の使者である[secondary_recipient.GetTitledFirstNameRegnal]が、[target.GetNameNoTier]に対する私の権利を訴える。"
 pam_interactions_events.0030.desc_intro: "[secondary_recipient.GetTitledFirstNameRegnal]の祝福と聖地の加護のもと、私は[target.GetNameNoTier]に対する私の権利を訴える。"
 pam_interactions_events.0030.desc: "平和を語りながら戦争をほのめかす言葉や、神に定められた私の権利を訴える言葉が延々と語られる…\n\n"
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed]は、そう簡単に[target.GetTierAsNameNoTooltip]を手放さないだろう。この領地の問題は、約束で決着をつけるか、さもなくば卑劣な脅しで片付けるしかない。"
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed]は、そう簡単に[vassal.GetName]を手放さないだろう。封臣を手に入れるには、魅力的な条件を示すか、脅しをかけなければならない。"
 pam_interactions_events.0030.a: "[recipient.GetFirstNameNoTooltip]に、[recipient.GetSheHe]には果たすべき…義務があることを思い出させてやろう。"
 pam_interactions_events.0030.a.flavor: "その義務を果たすよう命じられるのは、[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]の[actor.GetTitleAsNameNoTooltip]だけだということも！"
 pam_interactions_events.0030.b: "私に必要なのは[ROOT.Char.Custom2('RelationToMe', recipient)]ではない。[target.GetNameNoTierNoTooltip]だ。"
 pam_interactions_events.0030.b.flavor: "はっきり伝えろ。[recipient.GetFirstNameNoTooltip]がこれを拒むなら、[recipient.GetSheHe]はお前にとって何の価値もないと。"
 pam_interactions_events.0030.c: "[recipient.GetSheHe]が屈しないなら、この聖地を穢してやれ。"
 pam_interactions_events.0030.c.tt: "あの穢れた罪人を容赦なく糾弾しろ！二人まとめて破滅に追い込み、蔑みの的にしてやれ！[secondary_recipient.GetTitledFirstNameNoTooltip]と[actor.GetFaith.PriestNeuterPlural]が束になって、[recipient.GetFirstNameNoTooltip]を屈服させるだろう！"
 pam_interactions_events.0030.d: "奴の正当性を疑わせる醜聞を触れ回ると脅せ。"
 pam_interactions_events.0030.d.flavor: "人望のない[recipient.GetTitleAsNameNoTooltip]では、名誉や危うくなれば、長くは持つまい…"
 pam_interactions_events.0030.e: "[target.GetTierAsNameNoTooltip]を買い取ると申し出るだけでいい。"
 pam_interactions_events.0030.f: "この件は[ROOT.Char.GetFaith.HighGodName]と、[recipient.GetFirstNamePossessiveNoTooltip]の判断に任せよう。"
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold 見返りがない場合、[recipient.GetShortUIName]が受け入れる可能性はほとんどありません！#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial 見返りがない場合、[recipient.GetShortUIName]が受け入れる可能性は低くなります#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "[target.GetNameNoTierNoTooltip]をめぐる争い"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal]は、[actor.GetNamePossessive]のために[target.GetNameNoTier]を引き渡すよう、さらに主張を重ねる。それこそが[recipient.GetFaith.HighGodNamePossessive]が定めた地上の秩序であり、すべての[recipient.GetFaith.GetAdjective]の聖職者の願いなのだと言い張っているのだ。"
 pam_interactions_events.0034.desc_intro: "[actor.GetName]は[target.GetNameNoTier]が自分のものであると訴えているが、[recipient.GetFaith.GetAdjective]信仰に守られ、支持された要求を繰り返しているにすぎない。"
 pam_interactions_events.0034.desc_vassal: "[target.GetHolder.GetName]が死ぬまで私への忠誠を誓っていることなどお構いなしだ。忠誠心すら取引対象と思っているらしい。"
 pam_interactions_events.0034.desc_target: "[target.GetTierAsNameNoTooltip]が正統な血統と征服によって私のものとなったことなど、お構いなしだ。この世に取引できないものはないということか。"
 pam_interactions_events.0034.desc: "\n\n場所が聖地であったため、私は権利を侵害されたことに対しても平静を保った。提示された条件を吟味するとしよう…\n\n"
 pam_interactions_events.0034.desc_method_hook: "[actor.GetTitledFirstNameNoTooltip]が私に課している義務を、すべて無効にするという約束だ。"
 pam_interactions_events.0034.desc_method_relation: "私たちの間の温もりも信頼も愛情も、すべて完全に失われる。[actor.GetFirstNameNoTooltip]によれば、[actor.GetHerHis]の心はこの領地の問題に懸かっている。\n\nこれを拒めば、[actor.GetSheHe|U]は永遠に私を憎むだろう。"
 pam_interactions_events.0034.desc_method_piety: "ただでさえ危うい私と信仰との関係が、完全に破綻するという脅しだ。[actor.GetTitledFirstNameNoTooltip]の評判も傷つくだろうが、[actor.GetHerHis]の方が私よりはるかに敬虔な人物として認められている。"
 pam_interactions_events.0034.desc_method_legitimacy: "私の正統性を揺るがす重大な脅しだ。[target.GetNameNoTierNoTooltip]をめぐる醜悪な公然たる争いは、私たち二人を物笑いの種にするだろう…"
 pam_interactions_events.0034.desc_method_gold: "山のような金貨だ。[actor.GetTitleAsNameNoTooltip]いわく、[target.GetTierAsNameNoTooltip]にふさわしい代価だ。"
 pam_interactions_events.0034.desc_no_method: "…だが条件など#EMP 何もない#!。ただ[target.GetNameNoTier]を要求されただけで、私が[recipient.GetFaith.PriestNeuterPlural]の軽蔑や戦争の恐怖に屈すると思われている。"
 pam_interactions_events.0034.a: "[actor.GetSheHe|U]に[target.GetNameNoTierNoTooltip]で旗を掲げさせてやろう。"
 pam_interactions_events.0034.b: "私が生きている限り、[target.GetTierAsNameNoTooltip]は私のものだ。"
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip]の獲得"
 pam_interactions_events.0035.desc_intro: "[recipient.GetFirstNameNicknamed]が熟慮の末、ついに折れた！[target.GetNameNoTier]の譲渡交渉は速やかに進み、実を結んだ。\n\n私の権利を認める[secondary_recipient.GetTitledFirstNamePossessive]の裁定が履行されたのだ。"
 pam_interactions_events.0035.desc_hook: "[recipient.GetFirstNameNoTooltip]が私に対して負っていた義務は、名誉ある形で果たされた。"
 pam_interactions_events.0035.desc_relation: "確かに悲しみの涙は流れ、喜びと敬愛は失われた。[target.GetNameNoTierNoTooltip]を奪ったことで、私は[recipient.GetFirstNameNoTooltip]を深く苦しめた。だが…"
 pam_interactions_events.0035.desc_piety: "こうして、[recipient.GetFirstNameNoTooltip]と私の双方を恥辱に陥れるという脅しは…実行せずに済んだ。"
 pam_interactions_events.0035.desc_legitimacy: "こうして、論争や中傷を広めるという脅しは…実行せずに済んだ。"
 pam_interactions_events.0035.desc_gold: "金庫番と債権者に支払いの指示を出した。これは私が進んで支払う対価だ。"
 pam_interactions_events.0035.desc_fallback: "[actor.GetFaith.HighGodName]は[actor.GetFaith.GetAdjective]の[actor.GetFaith.PriestNeuterPlural]、そしてこの私に、偉大な力を与え給うた！軍勢も戦も必要ない。我らの命令だけで、世界の秩序は塗り替えられる。"
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName]は私に忠誠を誓うだろう。"
 pam_interactions_events.0035.desc: "\n\n[target.GetTierAsNameNoTooltip]は私のものだ。"
 pam_interactions_events.0035.a: "我が旗を[target.GetNameNoTierNoTooltip]の全土に高く掲げよ！"
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip]の割譲拒否"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[secondary_recipient.GetTitledFirstNamePossessive]の平和的な仲裁にもかかわらず、[recipient.GetTitledFirstName]は屈強な兵士たちに護衛され、落ち着かない様子で返答する。\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[secondary_recipient.GetTitledFirstNamePossessive]の平和的な仲裁にもかかわらず、[recipient.GetTitledFirstName]は屈強な[recipient.Custom('KnightCulturePluralNoTooltip')|l]に護衛され、落ち着かない様子で返答する。\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName]は、[secondary_recipient.GetTitledFirstNamePossessive]の平和的な仲裁に後押しされ、毅然と一人で返答する。\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName]は護衛を従えて、[secondary_recipient.GetTitledFirstNamePossessive]の平和的な仲裁をあざ笑うように返答する。\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName]は屈強な[recipient.Custom('KnightCulturePluralNoTooltip')|l]を従えて、[secondary_recipient.GetTitledFirstNamePossessive]の平和的な仲裁をあざ笑うように返答する。\n\n"
 pam_interactions_events.0036.desc_hook: "「どんな義務を引き合いに出そうと、[target.GetNameNoTierPossessive]は私にとって何よりも大切だ」"
 pam_interactions_events.0036.desc_relation: "「[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetTitleAsName]は、私の心を踏みにじり、魂を引き裂いた。[actor.GetHerHim]の言葉など、もう聞くつもりはない。"
 pam_interactions_events.0036.desc_piety: "「[target.GetNameNoTier]を渡さぬなら、罪と非難で私たち二人を貶めるというのか。いいだろう。"
 pam_interactions_events.0036.desc_legitimacy: "「毒に満ちた嘘を好きなだけ広めるがいい。[target.GetNameNoTier]の民も、ほかのすべての民も、私たち二人に背を向けさせるがいい。"
 pam_interactions_events.0036.desc_gold: "「金銀で[target.GetNameNoTier]を買えると思っているのか？高貴な[target.GetTierAsNameNoTooltip]が、その程度の取引で手に入るものか。"
 pam_interactions_events.0036.desc_fallback: "「[actor.GetTitleAsName]と[secondary_recipient.GetTitleAsNameNoTooltip]が、わずかな言葉だけで[target.GetNameNoTier]を手に入れられると思うのか…答えは否だ。"
 pam_interactions_events.0036.desc_afraid: "[recipient.GetFaith.PriestNeuterPlural]を遣わすなら歓迎しよう。使者を遣わすなら話し合おう…」\n\n「だが、このような形で[target.GetTierAsNameNoTooltip]を手放すことはできない」"
 pam_interactions_events.0036.desc_pious: "堕落した[recipient.GetFaith.PriestNeuterPlural]を送り込み、[target_capital.GetTitle.GetNameNoTier]に悪魔の軍勢を差し向けるがいい…」\n\n「それでも私は、[recipient.GetFaith.HighGodName]から授かった[target.GetTierAsNameNoTooltip]を手放したりない」"
 pam_interactions_events.0036.desc: "わめき散らす[recipient.GetFaith.PriestNeuterPlural]を送り込み、[target_capital.GetTitle.GetNameNoTier]に[actor.Custom('GetFighterTermPlural')]の軍勢を差し向けるがいい…」\n\n「それでも私は、[target.GetTierAsNameNoTooltip]をそう簡単に手放したりない」"
 pam_interactions_events.0036.a_relation: "私を拒むとはどういうことだ！？"
 pam_interactions_events.0036.a: "[secondary_recipient.GetTitleAsNameNoTooltip]の意思に背くとは、恥知らずな…"
 clergy_land_transfer_refusal_tt: "[actor.GetShortUIName]への[target.GetNameNoTierNoTooltip]の割譲を拒否"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetPrimaryTitle.GetNameNoTier]の[ROOT.Char.GetTitleAsNameNoTooltip]、[ROOT.Char.GetFirstNameNicknamed]へ"
 pam_interactions_events.0037.desc: "突然の知らせとなってしまったが、伝えねばならないことがある。今後、お前の主君は[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetTitleAsName]となる。\n\nこの決定は、お前の治める[ROOT.Char.GetPrimaryTitle.GetTierAsName]をめぐる私と[actor.GetTitledFirstNameNicknamed]との交渉を取りまとめた[secondary_recipient.GetTitledFirstNameRegnal]の裁定によるものだ。[recipient.GetPrimaryTitle.GetNameNoTier]に忠誠を尽くしてきたように、新たな主君にも忠誠を尽くせ。"
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName]があなたの[liege|E]となった"
 pam_interactions_events.0037.a: "私の誓約は無効となった。もはや誰も私に命じることはできない。"
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip]は宗主権を手放した。だが、[actor.GetTitledFirstNameNoTooltip]がそれを手にしたいのなら…十分な軍勢を率いて[target.GetNameNoTierNoTooltip]へ来ることだ。"
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]だと？本当なのか？"
 pam_interactions_events.0037.b.tt: "かつて我が民は[recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]を仰いでいた。これからは[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]を仰ぐことになるのだろう。"
