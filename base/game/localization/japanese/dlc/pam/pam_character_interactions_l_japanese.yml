 pam_interactions_events.0011: "あなたを案じる気持ちを込め、この書状をお送りします。自らのものではないものを恥知らずに求め続ければ、あなたの威厳を損なうことになるのではありませんか？[actor.GetFaith.HighGodName]の御心を害することを、そして[actor.GetFaith.GetReligion.GetAdjective]の同胞を傷つけることを、あなたは恐れないのですか？\n\nあなたの魂が[actor.GetFaith.PositiveAfterLife]で安らぐ時、あるいは残酷な運命によって[actor.GetFaith.NegativeAfterLife]に導かれる時、我々は[target.GetNameNoTier]に平穏が訪れることを祈りましょう。"
