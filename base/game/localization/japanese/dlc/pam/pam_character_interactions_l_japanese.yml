 pam_interactions_events.0083.desc: "[puppet_or_actor.GetTitledFirstName]との戦いを熟考した結果、勝敗がすでに決したと判断した。戦いを続けることは、すでに失われた大義のためにキリスト教徒の命を費やすことにほかならず、そのような血で自らの手を汚すわけにはいかない。\n\nゆえに、私はこの戦争の勝利を宣言した。教会の裁定を受け入れる者には報いがもたらされるだろう。"
