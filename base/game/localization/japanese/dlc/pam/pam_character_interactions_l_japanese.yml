 pam_interactions_events.0096.opening: "[ROOT.Char.GetFaith.random_GoodGodNames]の御手はなんと賢明なことか！"
 pam_interactions_events.0096.desc: "[former_de_jure_liege.GetNameNoTier]から[target.GetNameNoTier]を切り離すことは、最も賢明かつ祝福に満ちた行いである！\n\nあなたが定めた通りにならんことを。あらゆる時代を通じて、信心深い[target.GetAdjectiveNoTooltip]の[ROOT.Char.GetFaith.GetAdherentNamePlural]が[ROOT.Char.GetFaith.HighGodNamePossessive]の光へと永遠に導かれるよう、[de_jure_master.GetPrimaryTitle.GetNameNoTier]はこの[target.GetTierAsNameNoTooltip]と[ROOT.Char.GetFaith.PositiveAfterLife]の間に立つ支えとならん。\n\n私はこれを自身の神聖な[de_jure_master.Custom('GetTitleTierAdjective')]の誓いとして取り入れよう。"
 pam_interactions_events.0096.a: "どうか、これが真に調和のとれた結びつきとなりますように。"
