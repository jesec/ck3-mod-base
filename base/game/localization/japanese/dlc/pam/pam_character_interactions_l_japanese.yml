 pam_interactions_events.0001.opening: "高貴なる[ROOT.Char.GetTitledFirstNameRegnal]よ、"
 pam_interactions_events.0001.hook_intro: "もちろん、喜んでお力添えいたします。"
 pam_interactions_events.0001.intro: "[recipient.GetTitleAsNamePossessive]の承認を求めるのは当然のことです。"
 pam_interactions_events.0001: "なぜなら、この世のすべての[recipient.GetFaith.GetReligion.GetAdjective]の称号は、[recipient.GetFaith.HighGodNamePossessive]の聖なる御心によってのみ保たれているからです。"
 pam_interactions_events.0001.mid: "あなたの領国の[recipient.GetFaith.HouseOfWorshipPlural]には、あなたの統治の正当性を高らかに説き、あなたのような[ROOT.Char.GetTitleAsNameNoTooltip]を[actor.GetPrimaryTitle.GetNameNoTier]へもたらした[recipient.GetFaith.HighGodName]を讃える説教が響き渡ることでしょう。"
 pam_interactions_events.0001.tithe: "\n\n十分の一税が納められるにあたり、"
 pam_interactions_events.0001.hook: "\n\nあなたへの恩寵の証として、"
 pam_interactions_events.0001.monks: "\n\n修道院と"
 pam_interactions_events.0001.donate: "\n\nあなたの寄進への感謝として、"
 pam_interactions_events.0001.normal: "\n\n私の働きかけにより、"
 pam_interactions_events.0001_disgust: "\n\nこの言葉を邪悪な行いで汚すことのないように。"
 pam_interactions_events.0001_disapprove: "\n\nどうか、この称賛の言葉に恥じぬ行いを。"
 pam_interactions_events.0001_approve: "\n\n我々が捧げる賛辞は偽りなく、感謝に満ちたものとなるでしょう。"
 pam_interactions_events.0001_offer_hook_end: "\n\nこの恩をお忘れなきよう。"
 pam_interactions_events.0001.a.low_zeal: "民衆が何でもすぐ信じるのは好都合だ…"
 pam_interactions_events.0001.a.high_zeal: "私を疑うことは、[ROOT.Char.GetFaith.HighGodName]の御言葉を疑うことに等しい！"
 pam_interactions_events.0001.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]は、[ROOT.Char.GetFaith.HighGodName]より私に授けられたのだ。"
 pam_interactions_events.0001.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUIName]に聖職者の[legitimacy|E]を付与した"
 pam_interactions_events.0002.opening: "[ROOT.Char.GetTitledFirstNameRegnal]よ、"
 pam_interactions_events.0002: "権威の象徴はすでにあなたの手中にあり、その身を飾っています。[recipient.GetFaith.HighGodName]に仕える者の敬虔な声など、あなたには不要でございましょう。残虐な力も、邪悪な行いも、醜悪な陰謀も、すべてはあなたの思うままなのですから。\n\n[ROOT.Char.Custom('GetTitleTierAdjective')]の装いはご自身でお守りください。[recipient.GetFaith.HighGodName]のしもべは、手を貸すつもりはありません。"
