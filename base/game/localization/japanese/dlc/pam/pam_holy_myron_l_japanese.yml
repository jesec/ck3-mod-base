 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "新生児への傅膏機密"
 pam_holy_myron_unction_toast: "病者の塗油"
 pam_holy_myron.0300.t: "聖霊の印"
 pam_holy_myron.0300.desc: "我が[child.Custom('GetDaughterSon')][child.GetFirstName]は、[myron_officiant.GetFaith.PriestNeuter]の腕の中で泣き叫んでいる。そこへ、儀式に用いる香油が運ばれてきた。\n\n教会には、すべての新生児に施せるだけの祝福された香油が備えられている。だが、手の届くところには自らの聖香油の小瓶もある。その輝く一滴を使えば、この子に生涯消えぬ印を授けることができる。"
 pam_holy_myron.0300.desc_twin: "\n\nしかも、額はひとつではなく、ふたつある。[pam_myron_twin.GetFirstName]は双子のきょうだいの隣でおくるみに包まれ、同じ印を授かるのを待っている。"
 pam_holy_myron.0300.a: "教会の祝福された香油で十分だ。"
 pam_holy_myron.0300.b: "聖香油でなければならない。"
