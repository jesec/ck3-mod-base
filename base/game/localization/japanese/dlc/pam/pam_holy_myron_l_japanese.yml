 pam_anoint_artifact_decision_tooltip: "聖香油を1回分消費して、通常なら信条上認められない場合でも、所持する[artifacts|E]の1つを[sanctified|E]する"
 pam_anoint_artifact_decision_desc: "聖香油は聖職者の許しなど求めない。刃であれ、書物であれ、装身具であれ、触れたものはすべて、聖香油によって[ROOT.Char.GetFaith.GetName]の[sanctified|E]を受ける。いかなる信条の定めも司教も、これを阻むことはできない。"
