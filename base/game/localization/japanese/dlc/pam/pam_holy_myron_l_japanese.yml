l_japanese:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "聖香油の小瓶"
 pam_holy_myron_artifact_desc_common: "聖別された香油を納めた栓付きの器。[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]を純粋なオリーブ油に浸し、前回調製した香油から一滴を新たな香油に加える。こうして祝福の系譜は絶えることなく、使徒たちにまで遡る。"
 pam_holy_myron_artifact_desc_masterwork: "聖別された香油を納めた栓付きの器。[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]、[Glossary('没薬','pam_myron_gloss_myrrh')]を純粋なオリーブ油に浸し、前回調製した香油から一滴を新たな香油に加える。こうして祝福の系譜は絶えることなく、使徒たちにまで遡る。"
 pam_holy_myron_artifact_desc_famed: "聖別された香油を納めた栓付きの器。[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]、[Glossary('没薬','pam_myron_gloss_myrrh')]、[Glossary('ナルド','pam_myron_gloss_spikenard')]、[Glossary('シナモン','pam_myron_gloss_cinnamon')]を純粋なオリーブ油に浸し、前回調製した香油から一滴を新たな香油に加える。こうして祝福の系譜は絶えることなく、使徒たちにまで遡る。"
 pam_holy_myron_artifact_desc_illustrious: "聖別された香油を納めた栓付きの器。古来の製法に忠実に、[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]、[Glossary('没薬','pam_myron_gloss_myrrh')]、[Glossary('ナルド','pam_myron_gloss_spikenard')]、[Glossary('シナモンcinnamon','pam_myron_gloss_cinnamon')]、[Glossary('菖蒲','pam_myron_gloss_calamus')]、[Glossary('カシア','pam_myron_gloss_cassia')]を純粋なオリーブ油に浸し、前回調製した香油から一滴を新たな香油に加える。こうして祝福の系譜は絶えることなく、使徒たちにまで遡る。"
 pam_holy_myron_charges_line: "塗油の残り回数：#V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "名高きユダヤのバルサム。死海沿岸のエリコとエン・ゲディで栽培される低木から滲み出る、芳香豊かな樹脂。わずか一滴でさえ、古代世界で最も高価な香料とされた。聖香油の要となる材料であり、その樹園は厳重に守られ、この低木はほかの土地では育たない。"
 pam_myron_gloss_frankincense: "南アラビアの節くれだった木々から採れる黄金色の樹脂。ほかの土地ではほとんど得られない。はるか昔から祭壇の前で焚かれ、その芳香は聖香油に香りを添え、立ち昇る煙は祈りを天へと運ぶ。"
 pam_myron_gloss_myrrh: "南アラビアとアフリカの角に生える棘木から滲み出る、苦みを帯びた血を思わせる暗赤色の樹脂。『出エジプト記』にも聖別の香油の材料として名を連ね、東方の博士たちによって幼子キリストに捧げられ、のちには信徒たちによってキリストの墓所へと運ばれた。"
 pam_myron_gloss_spikenard: "東方の高山にのみ育つ植物の根から搾り取られ、山を下ってインドの港々へと運ばれる甘く濃厚な香りの油。ベタニアで主の御身に注がれたのもこのナルドであり、そのあまりの高価さに弟子たちは憤った。"
 pam_myron_gloss_cinnamon: "インドとその彼方の島々に育つ木から採れる、甘く香る内樹皮。『出エジプト記』にも聖別の香油の材料として名を連ね、はるか世界の半ばを越え、キリスト教の祭壇へと届けられる。"
 pam_myron_gloss_calamus: "聖書に記された香り高き菖蒲。はるか東方の湿地で採れる香りのよい葦で、『出エジプト記』にも聖別の香油の材料として名を連ねる。"
 pam_myron_gloss_cassia: "シナモンに似ているが、より粗い風味をもつ樹皮。はるか東方の木々から剥ぎ取られ、『出エジプト記』にも聖別の香油の材料として名を連ねる。"
 ### Modifiers
 pam_holy_myron_vessel_modifier: "聖香油の小瓶"
 pam_holy_myron_vessel_modifier_desc: "聖別された香油が納められている。[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]の芳香は、持ち主にさえ聖性を授ける。"
 pam_holy_myron_vessel_potent_modifier: "強き聖香油の小瓶"
 pam_holy_myron_vessel_potent_modifier_desc: "ひときわ強い力を宿す聖香油が納められている。[Glossary('乳香','pam_myron_gloss_frankincense')]と[Glossary('ナルド','pam_myron_gloss_spikenard')]を濃厚に含み、その芳香だけでも聖性が感じ取れる。"
 pam_chrismated_artifact_modifier: "聖香油による塗油"
 pam_chrismated_artifact_modifier_desc: "この宝物には聖香油が施され、今なお[Glossary('没薬','pam_myron_gloss_myrrh')]の香りが残っている。"
 pam_chrismated_regalia_modifier: "聖香油を施されたレガリア"
 pam_chrismated_regalia_modifier_desc: "このレガリアは戴冠式で聖香油を施され、その祝福は今なお宿っている。"
 pam_holy_myron_pilgrim_modifier: "香料を携える者"
 pam_holy_myron_pilgrim_modifier_desc: "この人物は、聖香油の材料となる[Glossary('バルサム','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]、さらに希少な品々を求めて旅をしている。道中の備えにも抜かりはない。"
 pam_chrismated_child_modifier: "香油による塗油"
 pam_chrismated_child_modifier_desc: "この人物は生後間もなく香油による塗油を受け、聖霊の恵みを授かった。"
 pam_myron_chrismated_child_modifier: "聖香油による塗油"
 pam_myron_chrismated_child_modifier_desc: "この人物は生後間もなく聖香油による塗油を受けた。その幼い額には[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]が塗られ、その聖なる印は決して失われることがない。"
 pam_anointed_with_holy_oil_modifier: "聖油による塗油"
 pam_anointed_with_holy_oil_modifier_desc: "この人物は病者の塗油を受けた。額と両手に[Glossary('バルサム','pam_myron_gloss_balsam')]の香る油が塗られ、試練のさなか、肉体と魂に力を与えている。"
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "聖香油を調製する"
 pam_prepare_holy_myron_decision_tooltip: "[court_chaplain|E]を遣わして希少な香料を集め、#V 聖香油の小瓶#!を聖別させる。この[artifact|E]は、塗油に用いるたびに残り使用回数が1減少する"
 pam_prepare_holy_myron_decision_desc: "聖香油は、厨房の余り物を寄せ集めて調製するようなものではない。聖書には、純粋なオリーブ油に[Glossary('没薬','pam_myron_gloss_myrrh')]、香り高い[Glossary('シナモン','pam_myron_gloss_cinnamon')]、[Glossary('菖蒲','pam_myron_gloss_calamus')]、[Glossary('カシア','pam_myron_gloss_cassia')]を加えると記されている。いずれも、その産地まで赴いて手に入れなければならない。\n\n遠征の足を延ばすほど、持ち帰って聖別する香油はより豊かなものとなる。だが、その道のりは長く、決して平穏ではない。盗賊や熱病によって香油の材料が失われ、ときには運び手の命まで奪われることもある。"
 pam_prepare_holy_myron_decision_confirm: "遠征隊を派遣する"
 pam_prepare_holy_myron_decision_needs_chaplain: "[court_chaplain|E]は行動可能な成人で、すでに旅に出ていてはならない。"
 pam_prepare_holy_myron_decision_already_owned: "聖香油の小瓶をすでに所持していてはならない。"
 pam_prepare_holy_myron_decision_journey_underway: "[court_chaplain|E]はすでに香料を集めている。"
 pam_prepare_holy_myron_decision_levant_name: "ユダヤのバルサム"
 pam_prepare_holy_myron_decision_levant_desc: "[court_chaplain|E]は#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!で[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]を集める。目的地は1か所のみ。調合される香油も最も簡素なものとなる。\n\n[common|E]な聖香油の小瓶が得られる。"
 pam_prepare_holy_myron_decision_arabia_name: "バルサムと乳香"
 pam_prepare_holy_myron_decision_arabia_desc: "[court_chaplain|E]は#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!で[Glossary('バルサム','pam_myron_gloss_balsam')]を集め、続いて#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!で[Glossary('乳香','pam_myron_gloss_frankincense')]と[Glossary('没薬','pam_myron_gloss_myrrh')]を集める。香料街道をたどり、2か所の目的地を巡る。\n\n[masterwork|E]の聖香油の小瓶が得られる。"
 pam_prepare_holy_myron_decision_india_name: "すべての聖なる材料"
 pam_prepare_holy_myron_decision_india_desc: "[court_chaplain|E]は#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!で[Glossary('バルサム','pam_myron_gloss_balsam')]を、#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!で[Glossary('乳香','pam_myron_gloss_frankincense')]と[Glossary('没薬','pam_myron_gloss_myrrh')]を、さらに#V [GetTitleByKey('c_kerala').GetNameNoTier]#!で[Glossary('ナルド','pam_myron_gloss_spikenard')]と[Glossary('シナモン','pam_myron_gloss_cinnamon')]を集めるため、3つの地を巡る長旅に出る。\n\n[famed|E]な聖香油の小瓶が得られる。ただし[court_chaplain|E]が古来の製法を忠実に守れば、代わりに[illustrious|E]の聖香油の小瓶が得られる。その確率は#V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!で、[court_chaplain|E]の[learning|E]に応じて変動する。"
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "[gold_i] [GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V]の[gold|E]を支払えるだけの資金が必要"
 pam_prepare_holy_myron_decision_afford_india_tt: "[gold_i] [GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V]の[gold|E]を支払えるだけの資金が必要"
 pam_prepare_holy_myron_journey_toast: "聖香油を求める遠征隊が旅立つ"
 pam_prepare_holy_myron_journey_toast_tt: "[court_chaplain|E]は聖香油の材料を集めるため、旅立った。"
 pam_prepare_holy_myron_decision_levant_effect_tt: "[court_chaplain|E]は#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!へ向けて旅立つ。無事に帰還すれば、[common|E]な聖香油の小瓶が聖別される。"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "[court_chaplain|E]は#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!と#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!へ向けて旅立つ。帰還後、[masterwork|E]の聖香油の小瓶が聖別される。ただし、道中で盗賊に襲われたり不運に見舞われたりすると、持ち帰れる材料が減ることがある。"
 pam_prepare_holy_myron_decision_india_effect_tt: "[court_chaplain|E]は#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!、#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!、#V [GetTitleByKey('c_kerala').GetNameNoTier]#!へ向けて旅立つ。帰還後、[famed|E]な聖香油の小瓶が聖別されるが、#V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!の確率で、代わりに[illustrious|E]の聖香油の小瓶が聖別される。ただし、道中で盗賊に襲われたり不運に見舞われたりすると、持ち帰れる材料が減ることがある。"
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]"
 pam_holy_myron.0011.desc_levant: "死海の岸辺よりご報告申し上げます。ここでは[Glossary('ユダヤのバルサム','pam_myron_gloss_balsam')]が、切りつけた樹皮から黄金の涙のように滲み出ています。栽培者たちとの値段交渉は難航しましたが、樹脂は紛れもない本物です。手首に一滴たらすだけで、その芳香が部屋中に広がります。これで最初の材料は確保しました。"
 pam_holy_myron.0011.desc_arabia: "香料街道は長く、水場もまばらでしたが、ドファールでついに目当ての品を手に入れました。朝まだきの氷のように淡い[Glossary('乳香','pam_myron_gloss_frankincense')]と、黒ずんだ血のように濃い[Glossary('没薬','pam_myron_gloss_myrrh')]です。この地の隊商長たちは、これほど上質な樹脂は世界のどの港にも入ってこないと言います。私もそう思い、相応の値で買い付けました。"
 pam_holy_myron.0011.desc_india: "航海は誰にとっても厳しい試練となりましたが、マラバール海岸の市場には、高山から運ばれてきた[Glossary('ナルド','pam_myron_gloss_spikenard')]や、ひときわ甘く香る[Glossary('シナモン','pam_myron_gloss_cinnamon')]など、目を見張る品々が並んでいます。これで最後の材料も揃いました。これより帰路につきます。"
 pam_holy_myron.0011.a: "残る道のりも順調であることを祈ろう。"
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]、災難に見舞われました。"
 pam_holy_myron.0012.desc: "行く手の峠を武装した一団が塞いでいます。自らを通行料の徴収人と称していますが、そのような権利を授けた君主などおりません。こちらの荷箱を数え、中身の値打ちまで見抜いており、金を払えば略奪せずに通すと言っています。\n\nご指示をお待ちしております。香料は決して手放しません。"
 pam_holy_myron.0012.a: "払え。聖香油は金には代えられぬ。"
 pam_holy_myron.0012.b: "教会の金を賊どもにくれてやるものか。"
 pam_holy_myron.0012.b.tt: "集めた香料が奪われ、完成する聖香油の品質が#N 低下#!する"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]"
 pam_holy_myron.0013.desc: "道中、熱病にかかりました。こうして書いている今も手が震えています。宿屋の女将はいくつもの治療法を勧めてきますが、どれもひどい代物です。香料のことはご心配なく。乾燥させて封をしてあり、私などよりよほど手厚く守られています。起き上がれるようになり次第、旅を再開します。"
 pam_holy_myron.0013.a: "[myron_chaplain.GetHerHim]の無事を祈ろう。"
 pam_holy_myron_journey_abandoned_toast: "聖香油を求める遠征は断念された"
 pam_holy_myron.0020.t: "旅路の果て"
 pam_holy_myron.0020.desc: "商人から届いた手紙がもたらしたのは、訃報だった。聖香油の材料を集めるため送り出した[myron_chaplain.GetTitledFirstName]が、故郷を遠く離れた地で亡くなった。香料は見知らぬ者たちの手に渡り、費やした金も[myron_chaplain.GetHerHis]の労苦も、もはや聖香油を生むことはない。"
 pam_holy_myron.0020.a: "[ROOT.Char.GetFaith.HighGodName]が[myron_chaplain.GetHerHim]の魂に安息を与えんことを。"
 pam_holy_myron.0100.t: "聖香油の聖別"
 pam_holy_myron.0100.desc.intro: "長旅の疲れをにじませた[myron_chaplain.GetTitledFirstName]が、ついに帰還した。積み荷が運び込まれるより先に、その芳香が宮廷に漂ってきた。固く閉ざした扉の向こうで香油が調合され、そこへ前回調製した聖香油が一滴加えられた。使徒たちの時代から受け継がれてきた慣わしである。\n\n"
 pam_holy_myron.0100.desc_full: "集めた材料はすべて無事に持ち帰られた。黄金色を帯び、芳香を放つ聖香油は小瓶に注がれ、祭壇の前に安置された。"
 pam_holy_myron.0100.desc_robbed: "道中で多くの材料を失い、香油は望んだほど豊かな仕上がりにはならなかった。それでも、旅路で損なわれたものは聖別によって補われ、小瓶は祭壇の前に安置された。"
 pam_holy_myron.0100.a: "祝福は今も、途切れることなく受け継がれている。"
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "最後の塗油"
 pam_holy_myron.0200.desc: "棺台へ近づくと、参列者たちが左右に道を開ける。その道を、私に先立って[pam_holy_myron_artifact.GetName]が運ばれていく。宮廷の一同が見守るなか、[deceased.GetTitledFirstName]の額に聖香油で十字を記せば、塗油を受けた者として[ROOT.Char.GetFaith.HighGodName]の御座の前へと送り出せる。その栄誉は、この場の誰もが見届け、後々まで語り継ぐだろう。だが、死者に捧げる一滴は、生者に回らぬ一滴でもある。"
 pam_holy_myron.0200.a: "[deceased.GetFirstNameNoTooltip]には塗油を施して送り出そう。"
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#!は、列聖候補として検討される際により有利に評価される"
 pam_holy_myron.0200.b: "聖香油は生者のためにある。"
 pam_holy_myron.0200.b.tt: "聖香油を、なお祝福を受けられる者たちのために残しておく"
 ### Spending the oil
 pam_holy_myron_spend_tt: "聖香油の小瓶の残り使用回数が1減少する"
 pam_holy_myron_spend_last_tt: "聖香油の小瓶に残る#N 最後の1回分#!を消費する。空になった小瓶は#N 失われる#!"
 pam_holy_myron_vessel_spent_toast: "聖香油が尽きる"
 pam_holy_myron_vessel_spent_tt: "残っていた聖香油が尽き、小瓶はその役目を終えた"
 ### Coronation
 pam_holy_myron_coronation_option: "この王冠に、聖香油の祝福を授けよう。"
 pam_holy_myron_coronation_option.flavor: "聖香油を1回分消費して、自ら塗油を受ける。"
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\n戴冠式で聖香油を施され、その祝福は今なお宿っている。"
