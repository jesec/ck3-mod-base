 #Interaction reference tooltips
 pam_estate_interaction_tt_demand_child_as_monk_interaction: "相手に対し、保護下にある[child|E]、子孫、または未成年の[courtier|E]の一人を[GetTrait('devoted').GetName( GetNullCharacter )]として差し出すよう要求する。選ばれた者は[succession|E]から外れ、あなたの[courtier|E]となる。"
 pam_estate_interaction_tt_demand_church_succession_interaction: "相手が正当な[heir|E]なくこの世を去った場合、その所領は[fallback_heir|E]として私に継承される。"
 pam_estate_interaction_tt_demand_divorce_interaction: "相手に対し、その婚姻が[faith|E]を冒瀆する（あるいはそう見せかけられる）配偶者を離縁するよう要求する。"
 pam_estate_interaction_tt_ecclesiastic_consecrate_kingdom_interaction: "相手のために新しい[kingdom|E]を建国し、その見返りに[hook|E]を得る"
 pam_estate_interaction_tt_ecclesiastical_bestow_title_interaction: "あなたの宗教的権威を使って、まだ創設されていない[title|E]を相手に直接授与し、場合によってはその[rank|E]を引き上げることができる"
 pam_estate_interaction_tt_influence_papal_vote_interaction: "相手に圧力をかけ、あなたが選んだ候補者にその[cardinal|E]票を投じさせる"
 pam_estate_interaction_tt_pam_evangelize_personal_tenet_interaction: "あなたの[personal_tenet|E]を相手に伝道し、相手自身の[personal_tenet|E]として採用するように促す"
 pam_estate_interaction_tt_request_clerical_chastity_interaction: "相手に[GetPlayer.GetFaith.HighGodName]の前で貞潔の誓いを立てるよう求める。受け入れた場合、誓いが終わるか放棄されるまで、相手は長期的な[fertility|E]ペナルティを受け、誘惑や求愛を開始できない。"
 pam_estate_interaction_tt_request_ecclesiastical_treasury_interaction: "[GetPlayer.GetPlayerInteractionTooltip('request_ecclesiastical_treasury_interaction')]"
 pam_estate_interaction_tt_request_realm_priest_replacement_interaction: "[GetPlayer.GetPlayerInteractionTooltip('request_realm_priest_replacement_interaction')]"
 pam_estate_interaction_tt_spiritual_counsel_interaction: "相手に個人的な助言を授ける。告解に耳を傾け、賢明な言葉を授けるのと引き換えに、[hook_i] [hook|E]を得る。"
 pam_estate_interaction_tt_take_monastic_vows_interaction: "相手に[monastic_holy_order|E]に加わるよう要請する"
 pam_estate_interaction_tt_take_vows_interaction: "誓いを立てて聖職者になるよう相手に頼む"
 pam_estate_interaction_tt_sway_ruler_to_my_rite_interaction: "あなたの[rite|E]を採用するよう相手に促す。"
 pam_estate_interaction_tt_ecclesiastic_incite_holy_war_interaction: "[GetPlayer.GetPlayerInteractionTooltip('ecclesiastic_incite_holy_war_interaction')]"
 pam_estate_interaction_tt_influence_clerical_candidacy_interaction: "[piety|E]を消費して、[appointment|E]継承法下の[clerical_title|E]における相手の[candidate_score|E]を上昇または下降させる"
 pam_estate_interaction_tt_increase_theocratic_heir_candidacy: "あなたの[clerical_titles|E]のうち1つに対する相手の[candidate_score|E]を上昇させる"
