l_japanese:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "信条を伝道する"
 spread_personal_tenet_intent_desc: "耳を傾ける客人たちに[personal_tenet|E]を説き、自身の信条として受け入れさせることで[tenet_popularity|E]を高めるべきだ。"
 spread_personal_tenet_intent_not_valid_desc: "現在は[personal_tenet|E]を持っていない"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "客人のいる[activities|E]で[intent|E]「#EMP $spread_personal_tenet_intent$#!」がアンロックされ、[tenet_popularity|E]を高められるようになる"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U]が[second.GetShortUINameNoTooltip]に勝利"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U]が[second.GetShortUINameNoTooltip]に勝利"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nだが、私の心を占めるのは[spread_tenet.GetBaseName]——我が信仰が退ける教えだ。ここで口にすれば、聞いた者すべてに我が命運を握らせることになる。"
 pam_spread_tenet_option_scripture: "聖典こそが、私に代わって語ってくれる。"
 pam_spread_tenet_option_preach: "私が信ずる真理を聞け！"
 pam_spread_tenet_option_forbidden: "真理のためなら、危険を冒す価値はある。もっと近くへ。"
 pam_spread_tenet_option_decline: "またの機会にしよう。"
 pam_spread_tenet_forbidden_flavor: "こちらに耳を傾ける者が、皆好意的とは限らない…"
 pam_spread_tenet_overheard_toast: "好意なき耳"
 pam_spread_tenet_events.0001.t: "食卓の語らい"
 pam_spread_tenet_events.0001.desc: "食卓には上等な[ROOT.Char.Custom('GetExpensiveMeal')]が所狭しと並び、広間には乾杯の声と笑い声が響いている。\n\n「信仰について、ずいぶん深く考えてこられたようですね」と、[pam_spread_listener_1.GetTitledFirstName]が[ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]を盛った皿越しに身を乗り出す。「もっと聞かせてください」\n\n食卓が静まり返る。皆、好意的に耳を傾け、続きを待っている…"
 pam_spread_tenet_events.0101.t: "火を囲んで"
 pam_spread_tenet_events.0101.desc: "狩りの途中、しばしの休息を取る。火を囲んで身を寄せ合い、串に刺した[ROOT.Char.Custom('GetRandomRegionalSmallGame')]から脂が滴っている。\n\n「こうして獲物を追っていると、魂もおのずと崇高なものへ向かうものです」と[pam_spread_listener_1.GetTitledFirstName]が炎を見つめたままつぶやく。\n\n炎の明かりの中、静寂に包まれ、皆が耳を傾けている。"
 pam_spread_tenet_events.0201.t: "試合の合間"
 pam_spread_tenet_events.0201.desc: "競技場には選手の姿がない。従騎士たちが折れた槍を片づける一方、観衆は日陰を探し、世間話に興じている。\n\n「勝者は皆[ROOT.Char.GetFaith.HighGodName]に感謝し、敗者は皆[ROOT.Char.GetFaith.DevilName]を呪う」と、傍らの[pam_spread_listener_1.GetTitledFirstName]が冗談めかして言う。「だが、その理由まで考える者はいるのでしょうか？」\n\n束の間の静けさが訪れる。手持ち無沙汰な名士たちが長椅子に並ぶなか、ひとつの問いだけが答えを待っている。"
 pam_spread_tenet_events.0301.t: "信念に乾杯"
 pam_spread_tenet_events.0301.desc: "杯が次々と掲げられる——新婚の二人に、まだ見ぬ跡継ぎに。\n\n「そして、すべての魂を結びつける[ROOT.Char.GetFaith.HighGodName]に！」と[pam_spread_listener_1.GetTitledFirstName]が続けると、賛同のざわめきが広がる。\n\nここに集う者たちの心は、愛にも、希望にも、聖なるものにも開かれている。今なら、語る言葉もきっと心に根づくだろう。"
 pam_spread_tenet_events.0401.t: "弔いの語らい"
 pam_spread_tenet_events.0401.desc: "弔問客たちは思い思いに集まり、亡き者のことや、いずれ誰もが迎える運命について静かに言葉を交わしている。\n\n「誰にでも、いつかは訪れるものです」と、傍らの[pam_spread_listener_1.GetTitledFirstName]が静かに言う。「それでも我々は、つまらぬことでいがみ合う」\n\n悲しみは、魂をむき出しにする…"
