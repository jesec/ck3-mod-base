l_japanese:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "信仰の探究"
 study_scripture_action: "信仰の探究"
 study_scripture_desc: "[GetPlayer.GetFaith.ReligiousText]、我が宗派の教義、そしてその先にある神秘を学び究めよう。"
 study_scripture_desc_general: "$study_scripture$は、[piety|E]、[skill|E]、[trait|E]「[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]」を得ることを目指す[personal_scheme|E]である。"
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "能力を高めるか、敬虔点を得るか、あるいは好機を見いだす"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "[GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]を受け入れる：$VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "[GetTenetType('tenet_scholasticism').GetBaseName]を受け入れる：$VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "上位聖職者の[learning|E]：$VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "[GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip]を持っている：$VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "[stress|E]が学びを妨げている：$VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "[GetTrait('burdened').GetName( owner )]である：$VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "[GetTrait('cynical').GetName( owner )]である：$VALUE|+0=$"
 pam_study_scripture_decision: "[ROOT.Char.GetFaith.ReligiousText|U]を学ぶ"
 pam_study_scripture_decision_desc: "[ROOT.Char.GetFaith.ReligiousText]は自ら紐解かねばならず、[ROOT.Char.GetFaith.GetName]の教義も怠惰な者にはその真意を明かさない。[ROOT.Char.Custom('StudyOfficesWord')]の合間を学びと思索に充て、羊飼い自らが学ぶ姿を群れに示すのだ。"
 pam_study_scripture_decision_tooltip: "自身を対象に[scheme|E]「[GetScheme('study_scripture').GetTypeName]」を開始する"
 pam_study_scripture_decision_tt: "自身を対象に[scheme|E]「[GetScheme('study_scripture').GetTypeName]」を開始する\n\n期待される報酬：\n$EFFECT_LIST_BULLET$ [piety_i] [piety|E]\n$EFFECT_LIST_BULLET$[trait|E]「[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]」またはその[trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[learning_i][stewardship_i][diplomacy_i] の[skill|E] #weak （最大8）#!\n$EFFECT_LIST_BULLET$[clergy|E]との交流の機会\n\nデメリット：\n$EFFECT_LIST_BULLET$[stress_i] [stress|E]が増加する可能性がある\n$EFFECT_LIST_BULLET$[prestige_i] [prestige|E]の獲得量の減少"
 pam_study_scripture_decision_confirm: "学びを始めよう。"
 pam_study_scripture_decision_req_tt: "まだ[scheme|E]「[GetScheme('study_scripture').GetTypeName]」を実行していない"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial 進行中の[personal_scheme|E]は終了します#!"
 study_scripture_title: "$study_scripture$： "
 study_scripture_outcome_piety: "$study_scripture_title$報われた信心"
 study_scripture_outcome_fragment_tt: "#EMP 「[owner.Custom('RandomStudyVerseFragment')]」#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$聖典への理解"
 study_scripture_outcome_mystery: "$study_scripture_title$神秘の片鱗"
 study_scripture_outcome_stress: "$study_scripture_title$骨の折れる学び"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "我が足のともしび、我が道の光…"
 pam_ss_fragment_psalm_119_165: "御身の律法を愛する者に、大いなる平安あり…"
 pam_ss_fragment_proverbs_9_9: "知恵ある者に教えを授けよ…"
 pam_ss_fragment_proverbs_4_7: "知恵の始まり、それは…"
 pam_ss_fragment_joshua_1_8: "昼も夜も、これを思い巡らせよ…"
 pam_ss_fragment_matthew_7_7: "求めよ、さらば見いださん…"
 pam_ss_fragment_james_1_5: "もし知恵に欠ける者があるなら…"
 pam_ss_fragment_2_timothy_2_15: "神の御前に、認められし者として立て…"
 pam_ss_fragment_verbum_domini: "主の言葉は、とこしえに残る…"
 pam_ss_fragment_generic_1: "神秘は、さらに深まる…"
 pam_ss_fragment_generic_2: "知恵は、根を下ろす…"
 pam_ss_fragment_generic_3: "聖典は、その意味を明かしてゆく…"
 # Faith-flavored vocabulary for StudyParishWord/StudyPulpitWord/StudySeminaryWord/StudyOfficesWord
 pam_ss_word_parish: "教区"
 pam_ss_word_congregation: "会衆"
 pam_ss_word_pulpit: "説教壇"
 pam_ss_word_minbar: "ミンバル"
 pam_ss_word_lectern: "書見台"
 pam_ss_word_seminary: "神学校"
 pam_ss_word_madrasa: "マドラサ"
 pam_ss_word_school: "学校"
 pam_ss_word_offices: "聖務日課"
 pam_ss_word_daily_prayers: "日々の祈り"
 pam_ss_word_daily_rites: "日々の儀礼"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "挫折した学び"
 pam_lapsed_studies_modifier_desc: "この人物は絶望のあまり、聖なる学びを断念した。"
 pam_renewed_zeal_modifier: "新たな熱意"
 pam_renewed_zeal_modifier_desc: "厳しい戒めを受け、この人物は改めて学びに身を捧げる決意を固めた。\n[GetScheme('study_scripture').GetTypeName]の[success_chance|E]：#P +10%#!"
 pam_inspired_study_modifier: "学びへの励み"
 pam_inspired_study_modifier_desc: "心のこもった贈り物が、この学びをさらに進める励みとなった。"
 pam_cloistered_rigor_modifier: "徹底した学び"
 pam_cloistered_rigor_modifier_desc: "人目を避け、妥協なくこの学びに打ち込んでいる。"
 pam_cloistered_rigor_personal_modifier: "学びに籠もる"
 pam_cloistered_rigor_personal_modifier_desc: "この人物は世俗から身を引き、妥協なく聖なる学びに打ち込んでいる。"
 pam_measured_devotion_modifier: "節度ある信心"
 pam_measured_devotion_modifier_desc: "この学びは、定めた時間を充てながら、着実に進められている。"
 pam_measured_devotion_personal_modifier: "聖典に身を捧げる学徒"
 pam_measured_devotion_personal_modifier_desc: "この人物は節度を保ちつつ、着実に聖なる学びを続けている。"
 pam_mortified_flesh_modifier: "肉体の苦行"
 pam_mortified_flesh_modifier_desc: "断食と夜を徹した祈りによって、学びに臨む心は研ぎ澄まされている。"
 pam_divine_favor_modifier: "神の寵愛"
 pam_divine_favor_modifier_desc: "この学びは、祝福を受けながら進められている。"
 pam_devoted_acolyte_modifier: "献身的な侍者"
 pam_devoted_acolyte_modifier_desc: "この侍者は、学びに必要なあらゆることを抜かりなく整えている。"
 pam_amanuensis_modifier: "忠実な筆記者"
 pam_amanuensis_modifier_desc: "忠実な助手が、記録や書類を完璧に整理している。"
 pam_persistent_devotions_modifier: "たゆまぬ精進"
 pam_persistent_devotions_modifier_desc: "挫折を重ねるたび、この学びへの厳格な姿勢はいっそう深まっている。"
 pam_renowned_exegete_modifier: "名高き聖典解釈者"
 pam_renowned_exegete_modifier_desc: "この人物は聖典の読み解きに通じ、[Glossary('聖典解釈者', 'GLOSS_EXEGETE')]として知られている。"
 pam_doctrinal_clarity_modifier: "教義の明晰な理解"
 pam_doctrinal_clarity_modifier_desc: "この人物は、自らの信仰の教義を類まれな明晰さで理解している。\n\n「$sway_ruler_to_my_rite_interaction$」の受諾率：#p +20#!\n「$pam_evangelize_personal_tenet_interaction$」の受諾率：#p +20#!\n「$pam_evangelize_personal_tenet_interaction$」の[piety|E]コスト：#p -50%#!"
 pam_known_in_the_synod_modifier: "宗教会議での高い評判"
 pam_known_in_the_synod_modifier_desc: "この人物の学識は、聖職者たちのあいだでも評判となっている。"
 pam_assisted_by_theologians_modifier: "神学者たちの助力"
 pam_assisted_by_theologians_modifier_desc: "博識な神学者たちが、この人物の学びを支えている。"
 pam_known_by_mystics_modifier: "神秘主義者の高い評価"
 pam_known_by_mystics_modifier_desc: "この人物は、神秘主義者や瞑想に励む者たちのあいだで高く評価されている。"
 pam_monastic_copyists_modifier: "修道院の写字生"
 pam_monastic_copyists_modifier_desc: "休むことなく筆を走らせる修道院の写字生たちが、この学びに新たな写本をもたらしている。"
 pam_charterhouse_silence_modifier: "修道院の静寂"
 pam_charterhouse_silence_modifier_desc: "沈黙のうちに観想に励む修道士たちの規律が、この学びを着実なものにしている。"
 pam_pastoral_letter_county_modifier: "牧会書簡"
 pam_pastoral_letter_county_modifier_desc: "遠方の牧者から届いた、慰めと教えを記した書簡が、礼拝のたびに読み上げられている。"
