l_japanese:
 # Activity: The Investiture Council
 activity_investiture_council: "叙任権会議"
 activity_investiture_council_desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]の終結に際し、聖職者の叙任権を教会と王権のいずれが握るのか、最終的な決着をつけるために招集された会議。"
 activity_investiture_council_province_desc: "ここで叙任権会議を開催する。"
 activity_investiture_council_host_desc: "叙任権会議を招集し、聖職者の任命をめぐる問題に決着をつける。"
 activity_investiture_council_guest_desc: "叙任権会議に出席し、聖職者の任命について意見を述べる。"
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council: "叙任権会議への[Character.GetFirstNamePossessiveNoTooltip]の旅"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value: "叙任権会議への招集"
 pam_investiture_council_start_log_title: "叙任権会議の開催"
 pam_investiture_council_start_log: "[CHARACTER.GetTitledFirstName]は、聖職者の任命をめぐる問題に決着をつけるため、叙任権会議を開会した。"
 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title: "教会の勝利"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.GetTitledFirstName]は会議の裁定を宣言した。聖職者を叙任するのは教会のみとし、王室が退位させることはできない。"
 pam_investiture_council_concluded_temporal_log_title: "王権の勝利"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.GetTitledFirstName]は会議の裁定を宣言した。教会が聖職者を叙任するが、世俗君主は失態を犯した聖職者の位を剥奪できる。"
 pam_investiture_council_conclusion.intro: "叙任権会議は結論に達した。"
 pam_investiture_council_conclusion.spiritual: "会議に集った聖職者たちは、聖職者を叙任する権利は教会のみが有するものと認め、王権をもっても覆すことができないものとした。一度叙任された聖職者は、生涯その職に留まる。\n\n長きにわたる[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わった。優位を確立した教会は、ただちに内部改革へと乗り出す。"
 pam_investiture_council_conclusion.temporal: "会議に集った聖職者たちは、聖職者の任命を教会に委ねることを認めたが、世俗君主が失態を犯した聖職者の位を剥奪できるものとした。長きにわたる[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わった。だが、教会の権威は衰え、その結束も危ういものとなった。"
 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived: "高位聖職者\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "保守派\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "改革派\n[Character.GetShortUINameNoTooltip|U]"
 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt: "「聖職者の任命」の[doctrine|E]が「[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]」から「[GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]」に変更された"
 pam_investiture_resolution_temporal_tt: "「聖職者の任命」の[doctrine|E]が「[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]」から「[GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]」に変更された"
 # Activity phase names + descriptions
 investiture_council_phase_summons: "招集"
 investiture_council_phase_summons_desc: "聖職者の任命をめぐる決着の時が迫っているとの報が広まり、信徒たちが集いはじめる。"
 investiture_council_phase_debate: "討議"
 investiture_council_phase_debate_desc: "会議では、聖職者の叙任権を教会と王権のいずれが握るべきかが審議され、最後に採決が行われる。"
 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t: "到着"
 pam_investiture_council_events.0001.desc: "到着すると、[arrival_host.GetTitledFirstName]が入口で温かく出迎えてくれた。その奥の広間は、すでに高位聖職者や諸侯たちでざわめいている。まもなく、聖職者の任命をめぐる重大な問題について、一同で議論が交わされる。"
 pam_investiture_council_events.0001.a: "この場に列席できることを光栄に思う。"
 pam_investiture_council_events.0001.a.tt: "ほかの出席者が到着し次第、討議が始まる。"
 # The council convenes (host)
 pam_investiture_council_events.0002.t: "教会をめぐる決着の時"
 pam_investiture_council_events.0002.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わりを迎えた。集った信徒たちは、今後いかに聖職者を任命するかを決めなければならない。教会の権威が守られるよう、力を尽くすつもりだ。"
 pam_investiture_council_events.0002.a: "そうあるべきだ。"
 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t: "討議の始まり"
 pam_investiture_council_events.0003.desc: "討議はついに、教会と王権を対立させてきた争点へと移る。誰が聖職者を叙任するのか——その問いを前に、集った者たちは静まり返る。この場の一人ひとりの声が、その決着を左右する。"
 pam_investiture_council_events.0003.a: "時は来た。"
 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t: "しかるべき相手への一言"
 pam_investiture_council_events.0032.desc: "採決の行方はまだ定まっていない。反対陣営で態度を決めかねている者にうまく働きかければ、こちらに引き込めるかもしれない。だが、説得を誤れば高くつく。"
 pam_investiture_council_events.0032.a: "一同をこちらに引き込もう。"
 pam_investiture_council_events.0032.b: "このままにしておこう。"
 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t: "王冠の重み"
 pam_investiture_council_events.0033.desc: "この聖職者たちの会議で、私に票はない。だが、世俗君主にも打つ手はある。金を積めば良心も揺らぎ、筋の通った主張は態度を決めかねる者の心を動かす。教会の主張に肩入れすることも、王権の側に力を貸すこともできる。あるいは、黙っているのもよい。"
 pam_investiture_council_events.0033.a: "買収して教会側に票を入れさせよう。"
 pam_investiture_council_events.0033.b: "説得して教会側に票を入れさせよう。"
 pam_investiture_council_events.0033.c: "買収して王権側に票を入れさせよう。"
 pam_investiture_council_events.0033.d: "説得して王権側に票を入れさせよう。"
 pam_investiture_council_events.0033.e: "関わらないでおこう。"
 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title: "一同が反応を示す"
 pam_investiture_persuade_toast_swayed_tt: "#P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#!人をこちらの側に引き込んだ。"
 pam_investiture_persuade_toast_backfired_tt: "失策により、#N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#!人を反対陣営に回してしまった。"
 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt: "まだ教会側に引き込める投票者がいる"
 pam_investiture_persuade_target_temporal_tt: "まだ王権側に引き込める投票者がいる"
 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator: "最大#P 10#!人を教会側に引き込む。"
 pam_investiture_persuade_tt_great_conservative: "最大#P 10#!人を王権側に引き込む。"
 pam_investiture_persuade_tt_good_innovator: "最大#P 5#!人を教会側に引き込む。"
 pam_investiture_persuade_tt_good_conservative: "最大#P 5#!人を王権側に引き込む。"
 pam_investiture_persuade_tt_modest_innovator: "最大#P 3#!人を教会側に引き込む。"
 pam_investiture_persuade_tt_modest_conservative: "最大#P 3#!人を王権側に引き込む。"
 pam_investiture_persuade_tt_backfire_innovator: "失策により、#N 5#!人が教会側に回る。"
 pam_investiture_persuade_tt_backfire_conservative: "失策により、#N 5#!人が王権側に回る。"
 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t: "叙任権会議への招集"
 pam_investiture_council_events.0004.desc: "聖職者の任命をめぐる問題に決着をつけるべく、叙任権会議が開かれるとの報せが届いた。だが、今いる場所は会議の場から遠く離れている。今の務めを放り出し、馬を飛ばして会議に駆けつけることもできる。あるいは、私抜きで成り行きに任せてもよい。"
 pam_investiture_council_events.0004.a: "すべてを投げ出して、会議へ向かおう。"
 pam_investiture_council_events.0004.b: "私抜きで決めてもらおう。"
 pam_investiture_council_haste_modifier: "叙任権会議への急行"
 pam_investiture_council_haste_modifier_desc: "この[ruler|E]は、[clergy|E]の任命に関する裁定が下される前に到着しようと、すべてを投げ出して叙任権会議に急いでいる。"
 # The debate opens (host)
 pam_investiture_council_events.0010.t: "教会の叙任権"
 pam_investiture_council_events.0010.desc: "聖職者を叙任する権利は教会に属し、その任命は王権をもっても撤回できないと訴える。あとは一同に決着を委ねよう。"
 pam_investiture_council_events.0010.a: "教会の権威を擁護しよう。"
 # The debate: guest picks a side
 pam_investiture_council_events.0031.t: "どちらの側につく？"
 pam_investiture_council_events.0031.desc: "宗教指導者は、聖職者を任命する権利は教会のみが持ち、王権をもっても撤回できないと訴えている。世俗君主は、失態を犯した聖職者の位を剥奪できるものとする。会議は私の意見を待っている。"
 pam_investiture_council_events.0031.a: "教会を支持しよう。聖職者は教会が任命し、生涯その職に留まる。"
 pam_investiture_council_events.0031.b: "王権を支持しよう。聖職者は教会が任命するが、君主が撤回できる。"
 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening: "教皇聖下"
 pam_investiture_council_events.0060.desc.spiritual: "会議は閉会いたしました。聖下はご不在でしたので、その結果を急ぎ羊皮紙にしたため、ご報告申し上げます。列席した聖職者たちは、聖職者を叙任する権利は教会のみが有するものと認め、王権をもっても覆すことができないものとしました。一度叙任された聖職者は、生涯その職に留まります。[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]はこれにて終結いたしました。"
 pam_investiture_council_events.0060.desc.temporal: "会議は閉会いたしました。聖下はご不在でしたので、その結果を急ぎ羊皮紙にしたため、ご報告申し上げます。心苦しい限りですが、列席した聖職者たちは、聖職者の任命権を我々に残したものの、世俗君主に失態を犯した聖職者の位を剥奪する余地が与えられました。[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]はこれにて終結いたしました。"
 pam_investiture_council_events.0060.a: "決議文を読もう。"
 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening: "我が君"
 pam_investiture_council_events.0061.desc.spiritual: "叙任権会議から礼拝堂に報せが届きました。列席した聖職者たちは、聖職者を叙任する権利は教会のみが有するものと認め、閣下をもっても覆すことができないものとしました。長きにわたる[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わりを迎え、王権が求めた叙任権は、今なお教会の手にあります。"
 pam_investiture_council_events.0061.desc.temporal: "叙任権会議から礼拝堂に報せが届きました。列席した聖職者たちは、聖職者を叙任する権利を教会に残したものの、閣下の裁量で失態を犯した聖職者の位を剥奪できます。長きにわたる[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わりを迎え、王権が教会を制しました。"
 pam_investiture_council_events.0061.a: "これで決着がついた。"
 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t: "叙任権会議の開催"
 pam_investiture_council_events.0050.desc.named: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わりを迎えようとしており、聖職者の任命をめぐる問題に決着をつけるため、叙任権会議が開かれる。\n\n[investiture_nominee_host.GetTitledFirstName]が会議の開催を引き受けた。宗教指導者として、会議に出席し、聖職者の任命について意見を述べることになる。ただし、欠席しても結果は知らされる。"
 pam_investiture_council_events.0050.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は終わりを迎えようとしており、聖職者の任命をめぐる問題は、会議で決着をつけなければならない。自ら主催しないため、代わって同じ信仰の有力な大司教がその役目を引き受ける。それでも、会議に出席して意見を述べることはできる。"
 pam_investiture_council_events.0050.a: "よかろう。"
 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip]の終結"
 pam_investiture_crisis_lapsed_tt: "会議が開かれないまま、[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]は教会側に有利な形で幕を閉じた。今後は教会が聖職者を任命し、生涯その職に留まる。"
