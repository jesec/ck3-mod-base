l_japanese:
 ecumenical_council_events_josh.0001.t: "終課の殺人"
 ecumenical_council_events_josh.0001.desc: "信心深い者たちの行動は、実に予測しやすい。[murder_target.GetTitledFirstName]が[Glossary( '終課', 'COMPLINE_GLOSS' )]の祈りに頭を垂れるなか、私は物陰に潜んでいる。\n\n長い祈りを捧げる[murder_target.GetHerHis|U]は、まったくもって無防備だ。私と[murder_target.GetHerHim]、ふたりきりになれば、どれほど上等な衣であろうと——祭服であれビロードであれ——首を絞める縄に変わり得るのだ。"
 ecumenical_council_events_josh.0001.a: "[murder_target.GetHerHis]の装身具を締め上げてやろう。"
 ecumenical_council_events_josh.0001.a.tt: "少々、息苦しいかもしれないが"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetSheHe|U]は私の手から逃れる"
 ecumenical_council_events_josh.0001.a.toast.success: "暗殺に成功した"
 ecumenical_council_events_josh.0001.a.toast.failure: "暗殺の試みは失敗した"
 ecumenical_council_events_josh.0001.a.flavor: "あれほど熱心に祈る者は、よほど罪深いに違いない…"
 ecumenical_council_events_josh.0001.b: "神聖な祈りの最中に手を下すわけには…"
 COMPLINE_GLOSS: "終課とは、夜の祈りのことである。キリスト教では伝統的に、毎日定められた時間帯に祈りを捧げるが（すなわち時課）、終課は一日の最後の祈りとなる。"
 ecumenical_council_events_josh.0010.t: "聖人を称える祝祭"
 ecumenical_council_events_josh.0010.desc: "聖職者たちが集った。我らを導く星のひとつを祝うことほど、大きな喜びはない。今月は、[monthly_saint.GetTitledFirstName]を称えるのが最もふさわしいだろう。\n\n「[ROOT.Char.GetFaith.HighGodNamePossessive]の御名において、本日の礼拝を執り行うものとする」"
 ecumenical_council_events_josh.0010.a: "ミサを捧げよう。"
 ecumenical_council_events_josh.0010.b: "説教を行おう。"
 ecumenical_council_events_josh.0010.c: "詩篇か聖歌をひとつ加えればよいだろう。"
 ecumenical_council_events_josh.0011.t: "雷鳴の如く"
 ecumenical_council_events_josh.0011.desc: "客人たちに挨拶していると、群衆の中でひときわ目立つ[guest_giant.GetTitledFirstName]の姿が否応なく目に入る。[guest_giant.GetHerHis]の巨躯は、どうしても人目を引いてしまうのだ。だが、[guest_giant.GetSheHe]が「ごきげんよう、信仰の守護者たる同胞諸君」と口を開いた瞬間、私はその真の可能性に気づいた。\n\n雷鳴の如く轟く[guest_giant.GetSheHe]の声——これは使える。[Glossary( '晩課', 'VESPER_GLOSS' )]の詩篇唱和には、もうひとり低音がいてもよさそうだ…"
 ecumenical_council_events_josh.0011.a: "[guest_giant.GetHerHis]の声に乗せて、我らの祈りを[ROOT.Char.GetFaith.HighGodName]へ届けてもらおう。"
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName]も、集まった者たちも皆、畏敬の念に打たれる。"
 ecumenical_council_events_josh.0011.b: "その響き渡る声は、祈りではなく討論の場で使わせてもらおう。"
 ecumenical_council_events_josh.0011.b.tt: "[guest_giant.GetSheHe|U]は頼れる存在になる"
 ecumenical_council_events_josh.0011.b.tt2: "[guest_giant.GetSheHe|U]を信用できるのは、分け前を受け取っている間だけだ"
 ecumenical_council_events_josh.0011.b.toast.success: "[guest_giant.GetHerHim]を説得し、味方につける。"
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetSheHe|U]は、支援の見返りを求めている。"
 ecumenical_council_events_josh.0011.b.flavor: "[guest_giant.GetTitledFirstName]が絶妙なタイミングで賛同の声を張り上げてくれれば、討論でこちらが優位に立てるだろう。"
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U]は道具ではない。客人だ。"
 ecumenical_council_events_josh.0011.c.flavor: "[guest_giant.GetHerHim]には、我らの中で自らの居場所を見つけてもらおう。"
 ecumenical_council_events_josh.0011.c.tt: "[guest_giant.GetTitledFirstName]を聖歌隊や討論に無理やり引き込むことはしない"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]は、公会議の場で[CHARACTER.GetShortUIName]を支持することにした。"
 VESPER_GLOSS: "晩課とは、夕方の祈りのことである。キリスト教では伝統的に、毎日定められた時間帯に祈りを捧げるが（すなわち時課）、晩課は通常、夕食前に行う祈りである。"
 ecumenical_council_events_josh.0012.t: "司教の指輪"
 ecumenical_council_events_josh.0012.desc: "公会議が始まって以来、[guest_bishoplover.GetTitledFirstName]と[guest_bishop.GetTitledFirstName]が片時も離れずにいることには気づいていた。今朝の[Glossary( '賛課', 'LAUD_GLOSS' )]では、[guest_bishoplover.GetFirstName]は遅刻したうえ、身だしなみも乱れている。[guest_bishoplover.GetHerHis]の指にはめられているのは、まさか[guest_bishop.GetFirstNamePossessive]の指輪ではないだろうか？私は気づいたことをそっと[guest_bishoplover.GetHerHim]に伝え、片眉を上げてみせた。\n\n自分の失態に気づいた[guest_bishoplover.GetFirstName]は、顔を赤らめ、しどろもどろになって答える。\n\n「お願いです、このことはどうか誰にも…」"
 ecumenical_council_events_josh.0012.b: "「その指輪を私に渡して、口をつぐんでいなさい」"
 ecumenical_council_events_josh.0012.c: "「このことは私とあなた、そして[ROOT.Char.GetFaith.HighGodName]だけが知る秘密です」"
 ecumenical_council_events_josh.0012.bishopringname: "司教の指輪"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\n身につける者の使徒職を目に見える形で示すしるし。"
 LAUD_GLOSS: "賛課とは、朝の祈りのことである。キリスト教では伝統的に、毎日定められた時間帯に祈りを捧げるが（すなわち時課）、賛課は通常、朝食前に行う祈りである。"
 ecumenical_council_events_josh.0013.t: "装いの罪"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U]は、華やかな祭服をまとって立っている。この日のために新たに織られた祭服で、[fashion_criminal.GetHerHis]を慕う信徒たちからの贈り物に違いない。絹のストラには[ROOT.Char.GetFaith.WealthGodName]の刺繍が施され、こちらを見つめている。\n\nなんという厚顔さだ！[fashion_criminal.GetSheHe]は公然と[fashion_criminal.GetFaith.GetName]の信条に背いているのか、それともただの見栄っ張りな孔雀なのか？"
 ecumenical_council_events_josh.0013.a: "「目障りなこの恥さらしを連れて行け」"
 ecumenical_council_events_josh.0013.b: "「立ち去れ。お前はこの場にふさわしくない」"
 ecumenical_council_events_josh.0013.b.toast.success: "[fashion_criminal.GetHerHim]を追放する。"
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetSheHe|U]は、どうにか公会議からの追放を免れる。"
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]は、公会議で不適切な装いをしていた。"
 ecumenical_council_events_josh.0020.t: "熱情の灯火"
 ecumenical_council_events_josh.0020.desc.intro: "「[ROOT.Char.GetFaith.GetName]の柱たる、この者を見よ！正しき者がいかに十字架の道を歩むかを示す、まことの証である」\n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: " が語っているのは、[faith_battle_memory.GetDescription]ときのことである。異教徒には、いついかなる時も立ち向かわねばならない。私は剣を掲げ、その称賛を受け入れる。「信仰のために！」"
 ecumenical_council_events_josh.0020.desc.fallback: " は、私が近ごろ信仰に尽くしてきたことを認めてくれているのだ。集まった聖職者たちの前で称えられ、誇らしさで胸がいっぱいになる。"
 ecumenical_council_events_josh.0020.a: "「[ROOT.Char.GetFaith.HighGodNamePossessive]の御名において、我らは勝利する！」"
 ecumenical_council_events_josh.0020.a.flavor: "私の行いは、列席する聖職者たちの心を動かした。"
 ecumenical_council_events_josh.0020.b: "この栄光にただ浸っていよう。"
 ecumenical_council_events_josh.0021.t: "光の中で"
 ecumenical_council_events_josh.0021.desc: "討論が長引くなか、一条の光が部屋に差し込み、床を照らした。そこへ歩み出た瞬間、すべての視線が私へと向けられた。\n\n私の言葉だけでも十分だったはずだが、聖なる光がさらに私の主張を後押ししてくれる。討論相手の[council_opponent.GetFirstName]は影の中に取り残された。[council_opponent.GetHerHis|U]の主張は、ますます曖昧に見える。"
 ecumenical_council_events_josh.0021.a: "勢いに乗じて[council_opponent.GetFirstName]をさらに追い詰める。"
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U]が[ec_conservatives|E]を離れ、[ec_innovators|E]に加わる"
 ecumenical_council_events_josh.0021.b: "この神々しい光で、一同の心をつかもう。"
 ecumenical_council_events_josh.0021.b.ct: "最大#V 3#!人の[ec_conservatives|E]が[ec_innovators|E]に加わる"
 ecumenical_council_events_josh.0021.c: "私の威光を見せつけてやろう。"
 ecumenical_council_events_josh.0021.c.ct: "[clerical_title|E]への[appointment|E]スコアが、#V 50#!追加される"
 ecumenical_council_events_josh.0022.t: "信仰のもとに結束を"
 ecumenical_council_events_josh.0022.desc: "公会議の会場を見て回るなか、[host.GetTitledFirstName|U]は[host.GetHerHis]の信奉者たちを外からの脅威に対して結束させる機会を見出した。[host.GetSheHe|U]は私と[alliance_target.GetTitledFirstName]を呼び寄せ、目の前に並び立たせる。\n\n「敬虔なる者たちよ、そなたらが信仰のもとに立つのであれば、逆境に臨むときも肩を並べて立つべきであろう」"
 ecumenical_council_events_josh.0022.a: "教会に我らの同盟を祝福してもらおう。"
 ecumenical_council_events_josh.0022.a.flavor: "敬虔な信徒としての立場を利用し、この同盟を固める。"
 ecumenical_council_events_josh.0022.b: "同盟は相互理解の上に築かれるべきだ。"
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetHerHim|U]は同盟の結成に同意する。"
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetSheHe|U]はあなたの接近に気分を害する。"
 ecumenical_council_events_josh.0022.b.flavor: "人の心をつかむ私の話術があれば、きっとうまくいくはずだ。"
 ecumenical_council_events_josh.0022.c: "公会議は、そのような話をする場ではない。"
 ecumenical_council_events_josh.0022.c.flavor: "敬意を込めて一礼するだけで十分だ。"
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]は、不適切な同盟を拒否した。"
 ecumenical_council_events_josh.0023.t: "我がために祈りを"
 ecumenical_council_events_josh.0023.desc: "「恩寵と平安が、汝の上にあらんことを」[host.GetTitledFirstName|U]は、近づいてくる客人たちを祝福している。今なら、この信仰の柱たる人物の前に身を投げ出すこともできる。[host.GetHerHis]が[Glossary( '賛課', 'LAUD_GLOSS' )]で捧げる祈りに私の名を加えてもらうことができれば、きっと救済へと近づけるはずだ。\n\n「どけよ、たわ言を並べるのはやめろ。後がつかえているんだ」後ろで順番を待っていた[prayer_opponent.GetFirstName|U]が、私にそう囁いた。"
 ecumenical_council_events_josh.0023.a: "「相応の寄進をいたします。どうか私のためにお祈りください」"
 ecumenical_council_events_josh.0023.b: "主催者の祭服の裾に口づけする"
 ecumenical_council_events_josh.0023.b.tt: "我が願いは、必ず聞き届けさせる"
 ecumenical_council_events_josh.0023.b.tt2: "礼節を欠いた私は、脇へ押しやられる"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U]はあなたのために祈りを捧げる。"
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U]はあなたの願いを聞き流す。"
 ecumenical_council_events_josh.0023.c: "素直に退こう。敬虔に振る舞うほうがよさそうだ。"
 ecumenical_council_events_josh.0024.t: "神秘の美"
 ecumenical_council_events_josh.0024.desc: "ここには、聖なる神秘について語りたくてたまらず、新たな解釈を打ち立てては言い争おうとする者たちもいる。[tenet_target_a.GetName]もその一人だ。\n\n「[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]！[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]だ、兄弟たちよ。[ROOT.Char.GetFaith.HighGodName]が我らに課したこの戒めを尊び、この道に知恵を求めよ。そうすれば、神の真理を理解できるようになる！」\n\n群衆の中で様々な声が上がっては消えていく。一方、[tenet_target_b.Custom('FormalComplimentAdjective')][tenet_target_b.GetTitledFirstName]は、見慣れぬ書物に夢中になっている。私に読み取れたのは、「[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )]」という言葉だけだ。"
 ecumenical_council_events_josh.0024.a: "「[tenet_target_a.GetFirstNameNoTooltip]、今、知恵と言ったか？」"
 ecumenical_council_events_josh.0024.b: "その本はなかなか興味深そうだ。"
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName]はすでに私に真の道を示している。"
 ecumenical_council_events_josh.0025.t: "招かれざる神学者"
 ecumenical_council_events_josh.0025.desc: "大規模な集会の端で騒ぎが起こる。何人かの見慣れぬ者たちが旅の埃を払っている。高位聖職者たちは小声で話し、彼らをじっと見つめ、立ち去るよう手で促した。見知らぬ者たちを率いている[theologian.GetWomanMan]が声を上げた。\n\n「私は同胞たる[theologian.GetFaith.GetAdherentNamePlural]のために証を立てようと、はるばる旅をしてきた。かつて我らの父祖たち、聖なる使徒たちは兄弟同然だった。それなのに、なぜ私を拒むのか？」"
 ecumenical_council_events_josh.0025.a: "参加を認めてほしければ、それなりの代価を払ってもらおう…"
 ecumenical_council_events_josh.0025.a.flavor: "招待者名簿の末尾に[theologian.GetHerHim]の名を加えるくらい、たやすいことだ。"
 ecumenical_council_events_josh.0025.b: "「あなたの教えは恥ずべきものだ！」"
 ecumenical_council_events_josh.0025.c: "「興味深い。後で我々だけの公会議を開こうではありませんか」"
 ecumenical_council_events_josh.0025.d: "丁重にお引き取りいただくよう促す。"
