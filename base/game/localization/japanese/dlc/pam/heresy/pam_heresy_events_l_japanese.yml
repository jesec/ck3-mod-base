l_japanese:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "カタリ"
 cathar_rite_adj: "カタリ"
 cathar_rite_adherent: "カタリ派信徒"
 cathar_rite_adherent_plural: "カタリ派信徒"
 cathar_rite_desc: "禁欲的な二元論の流派。物質世界は邪悪なデミウルゴスの創造物であると主張する。完徳者は清貧と純潔を誓い、既成教会の秘跡を拒み、神の名の下に兵役を拒む。"
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "ワルドー"
 waldensian_rite_adj: "ワルドー"
 waldensian_rite_adherent: "ワルドー派"
 waldensian_rite_adherent_plural: "ワルドー派信徒"
 waldensian_rite_desc: "裸足で各地を巡る托鉢説教師の流派。一般信徒にも聖書を説く権利があり、制度化された教会だけが恩寵を授けられるわけではないと主張する。また、キリスト教徒は財産を持つことも、武器を取ることもあってはならないとしている。"
 lollard_rite: "$lollard$"
 lollard_rite_name: "ロラード"
 lollard_rite_adj: "ロラード"
 lollard_rite_adherent: "ロラード派信徒"
 lollard_rite_adherent_plural: "ロラード派信徒"
 lollard_rite_desc: "俗語による改革を掲げる流派。華美な儀式や聖変化、聖遺物崇敬、そして聖職者が富を蓄えることを否定する。聖書は民衆の言葉で読まれ、すべての信徒はそれぞれが司祭であるとしている。"
 hussite_rite: "$hussite$"
 hussite_rite_name: "フス"
 hussite_rite_adj: "フス"
 hussite_rite_adherent: "フス派信徒"
 hussite_rite_adherent_plural: "フス派信徒"
 hussite_rite_desc: "ボヘミアの改革的な流派。一般信徒への聖杯授与、俗語で書かれた聖書、聖職者の富と免罪符の販売の廃止を求めている。フス派の説教師たちは、ウィクリフ派の教え、そしてローマ教会は使徒の道を外れたという強い確信を基盤としている。"
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "ヨアキム"
 joachimite_rite_adj: "ヨアキム"
 joachimite_rite_adherent: "ヨアキム派信徒"
 joachimite_rite_adherent_plural: "ヨアキム派信徒"
 joachimite_rite_desc: "終末論を掲げる流派。歴史を「父の時代」「子の時代」、そして制度化された教会が消え去り、新たな観想修道会が興る「聖霊の時代」の3つに分けて解釈する。ヨアキム派の信徒は使徒にならった清貧の生活を送り、市場で説教を行い、間近に迫った世界の終末を待ち望んでいる。"
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "聖像破壊"
 iconoclast_rite_adj: "聖像破壊"
 iconoclast_rite_adherent: "聖像破壊派信徒"
 iconoclast_rite_adherent_plural: "聖像破壊派信徒"
 iconoclast_rite_desc: "古くから東方に伝わる聖像否定運動を復興した流派。聖像崇敬はいずれ偶像崇拝に行き着くと非難し、教会だけでなく家庭からも聖像を取り除くことを求めている。"
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "ボゴミル"
 bogomilist_rite_adj: "ボゴミル"
 bogomilist_rite_adherent: "ボゴミル派信徒"
 bogomilist_rite_adherent_plural: "ボゴミル派信徒"
 bogomilist_rite_desc: "司祭ボゴミルを起源とするスラヴの二元論的な流派。ボゴミル派の説教師は裸足で各地を巡り、位階制度を否定し、武器を取ることを拒み、サタンが目に見える世界の創造主であると説く。"
 paulician_rite: "$paulician$"
 paulician_rite_name: "パウロ"
 paulician_rite_adj: "パウロ"
 paulician_rite_adherent: "パウロ派信徒"
 paulician_rite_adherent_plural: "パウロ派信徒"
 paulician_rite_desc: "小アジアで生まれた戦闘的な二元論の流派。聖像と既成教会の位階制度を蔑視し、パウロ書簡を仲介者を介さずに読むことを重んじ、その教えの純粋性を守るためには武器を取ることも辞さない。"
 messalian_rite: "$messalian$"
 messalian_rite_name: "メッサリア"
 messalian_rite_adj: "メッサリア"
 messalian_rite_adherent: "メッサリア派信徒"
 messalian_rite_adherent_plural: "メッサリア派信徒"
 messalian_rite_desc: "秘教的かつ禁欲的な流派。たゆまぬ祈りだけが真に重要な秘跡であると説く。また、信徒はひとたび自らの内に宿る悪魔を追い払えば、肉欲の行為によって二度と穢されることはないと主張する。"
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "養子説"
 adoptionist_rite_adj: "養子説"
 adoptionist_rite_adherent: "養子説派信徒"
 adoptionist_rite_adherent_plural: "養子説派信徒"
 adoptionist_rite_desc: "キリスト論に基づくヒスパニアの流派。キリストは人性においては神の生来の子ではなく、養子とされた子であると説く。この教義は、カロリング朝教会からネストリウス派に通じるものとみなされた。"
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "信徒が高まる[rite_divergence|E]に結束して立ち向かった"
 pam_heresy_fervor_reset_component_2_desc: "信徒が新たな分離派の[rite|E]に結束して立ち向かった"
 pam_heresy_fervor_reset_component_3_desc: "信徒が異端の復活に結束して立ち向かった"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "異端的な乖離"
 heresy_light.0010.desc.intro.descriptor_archbishop: "[founder.GetCulture.GetName]人の大司教[founder.GetFirstName] "
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName] "
 heresy_light.0010.desc.opener.archbishopric: "（[founder_clerical_title.GetNameNoTier]） "
 heresy_light.0010.desc.opener.lands: "（[founder.GetPrimaryTitle.GetBaseNameNoTier]） "
 heresy_light.0010.desc.body.uneasy: "は、[new_rite.GetName]を[source_rite.GetAdjective]からさらに逸脱させた。 "
 heresy_light.0010.desc.body.alarming: "は、[new_rite.GetName]を正統な[source_rite.GetAdjective]の慣行から危険なほど逸脱させた。 "
 heresy_light.0010.desc.body.dangerous: "は[new_rite.GetName]を、もはや[source_rite.GetAdjective]から見ても同系統とはほとんど認識できないほど逸脱させた。 "
 heresy_light.0010.desc.differing.tenet: "最大の相違点は[differing_tenet.GetBaseName]である。"
 heresy_light.0010.desc.differing.doctrine: "最大の相違点は[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]である。"
 heresy_light.0010.desc.differing.fallback: "際立った特徴はなく、特定の名で括れるものではない。"
 heresy_light.0010.desc.outro: "\n\n彼らはまだ異端ではない。だが、その一線を越える日も近い。"
 heresy_light.0010.desc.outro.own_rite: "\n\n我々はまだ異端ではない。だが、その一線を越える日も近い。"
 heresy_light.0010.a: "神の導きを祈ろう。"
 heresy_light.0010.b: "[new_rite.GetNameNoTooltip]には学ぶべき知恵がある。その道を歩もう。"
 heresy_light.0010.c: "異端の臭いがする…"
 heresy_light.0010.c.own_rite: "ならば進もう。この道が我らの道だ。"
 heresy_light.notification.member.title: "流派の離反"
 heresy_light.notification.member.tt: "[founder.GetTitledFirstName]のもと、[new_rite.GetName]は[source_rite.GetAdjective]からさらに離反した。"
 heresy_light.notification.hof.title: "流派の異端化"
 heresy_light.notification.hof.tt: "[founder.GetTitledFirstName]のもと、[new_rite.GetName]は[source_rite.GetAdjective]から大きく逸脱した。"
 heresy_light.notification.mainline.title: "近縁流派の離反"
 heresy_light.notification.mainline.tt: "[founder.GetTitledFirstName]のもと、[new_rite.GetName]は[source_rite.GetAdjective]からさらに離反した。"
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "異端の流派"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "[founder.GetCulture.GetName]人の大司教[founder.GetFirstName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "（[founder_clerical_title.GetNameNoTier]） "
 heresy_dangerous_rite.0010.desc.opener.lands: "（[founder.GetPrimaryTitle.GetBaseNameNoTier]） "
 heresy_dangerous_rite.0010.desc.body.alarming: "は、[source_rite.GetAdjective]と決別し、[new_rite.GetName]を打ち立てた。 "
 heresy_dangerous_rite.0010.desc.body.severe: "は、名を除くすべてにおいて[source_rite.GetAdjective]と決別し、[new_rite.GetName]を打ち立てた。 "
 heresy_dangerous_rite.0010.desc.differing.tenet: "その新たな教令の中でも、とりわけ大胆なのが、[differing_tenet.GetBaseName]を公然と説くことだ。"
 heresy_dangerous_rite.0010.desc.differing.doctrine: "その新たな教令の中でも、とりわけ大胆なのが、[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]を公然と説くことだ。"
 heresy_dangerous_rite.0010.desc.differing.fallback: "その新たな教令は、一文では語り尽くせないほど多い。"
 heresy_dangerous_rite.0010.desc.outro: "\n\n説教師たちはすでに領国各地へ散り、片手に[origin_faith.ReligiousText]、もう片方の手に松明を掲げている。[origin_faith.GetName]の長老たちがこの事態を穏やかに受け入れるはずがない。\n\n新たな流派は異端の教えを書き記し、説教壇から声高に叫び始めた。言葉が通じないのなら、剣と炎で応じるまでだ。"
 heresy_dangerous_rite.0010.a: "始めよう。"
 heresy_dangerous_rite.0010.c: "異端の臭いがする…"
 heresy_dangerous_rite.spread.title: "新たな流派の拡大"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "ウィクリフ派の異端"
 heresy_historical.0050.t.hussite.first: "フス派の異端"
 heresy_historical.0050.t.joachimite.first: "ヨアキム派の異端"
 heresy_historical.0050.t.cathar.first: "カタリ派の異端"
 heresy_historical.0050.t.waldensian.first: "ワルド派の異端"
 heresy_historical.0050.t.bogomilist.first: "ボゴミル派の異端"
 heresy_historical.0050.t.resurgence: "[heresy_faith.GetAdjectiveNoTooltip]の異端が再興"
 heresy_historical.0050.t.fallback: "[heresy_faith.GetAdjectiveNoTooltip]の異端"
 heresy_historical.0050.desc.nearby.first: "[founder.GetTitledFirstName]は[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]で[heresy_faith.GetAdjective]の教えを説いている。それも、もはや噂を否定できないほど近くでだ。我らの[origin_faith.PriestMalePlural]は説教壇から[founder.GetHerHim]を糾弾するが、それがかえって[founder.GetHerHis]の教えを広める結果となっている。\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "[founder.GetTitledFirstName]のもと、[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]で[heresy_faith.GetAdjective]の教えが再び勢いを取り戻した。かつての炎が、我らのすぐ近くで再び燃え上がっているのだ。その炎がいかに危険なものであったかは、廷臣も民衆も忘れてはいない。\n\n"
 heresy_historical.0050.desc.distant.first: "遠く[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]から、[founder.GetTitledFirstName]が[heresy_faith.GetAdjective]の教えを広めているとの知らせが届いた。巡礼者や商人が、彼らの説教を街道沿いに伝えている。その噂が我らの戸口に届くのも時間の問題だ。\n\n"
 heresy_historical.0050.desc.distant.resurgence: "遠く[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]から、すべての高位聖職者が恐れていた知らせが届いた。[founder.GetTitledFirstName]のもと、[heresy_faith.GetAdjective]の教えが再び勢いを取り戻したのだ。これではまるで、異端を封じる炎も、布告も、公会議も存在しなかったかのようだ。\n\n"
 heresy_historical.0050.desc.insider.first: "[founder.GetTitledFirstName]は[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]で[heresy_faith.GetAdjective]の教えを公然と掲げた。長年囁かれてきた教えが、ついに世に向けて説かれる説教となったのだ。\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName]は[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]で[heresy_faith.GetAdjective]の教えに再び火をともした。かつての炎が、新たな風を受けて燃え上がる。我らの努力は、決して忘れ去られてはいなかったのだ。\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.GetSheHe|U]は、聖典を民衆の言葉で説き、聖職者の土地所有を否定し、祭壇での芝居がかった儀式を廃止することを説いている。"
 heresy_historical.0050.gloss.hussite: "[founder.GetSheHe|U]は、一般信徒に対するパンとぶどう酒の両方による聖体拝領、ボヘミア語の聖典、そして金で買われた特権を排した教会のあり方を説いている。"
 heresy_historical.0050.gloss.joachimite: "[founder.GetSheHe|U]は、ローマの司祭階級が退き、貧しい人々による観想的な教会へと置き換わる、「聖霊の時代」が迫っていると説いている。"
 heresy_historical.0050.gloss.cathar: "[founder.GetSheHe|U]は、世界を邪悪な神の創造物、ローマ教会を「バビロンの大淫婦」とみなす、厳格な二元論を説いている。"
 heresy_historical.0050.gloss.waldensian: "[founder.GetSheHe|U]は、裸足の信徒伝道者による清貧な教会のあり方を説いている。そこでは誓約も戦争もなく、聖職者が御言葉を独占することもない。"
 heresy_historical.0050.gloss.bogomilist: "[founder.GetSheHe|U]はスラヴ的二元論を説いている。世界はサタンのものであり、たゆまぬ祈りのみが魂を取り戻すことができると主張している。"
 heresy_historical.0050.gloss.paulician: "[founder.GetSheHe|U]は古い東方の思想を説き、二元論、聖像破壊主義、そしてパウロ書簡の厳格な解釈を重視している。[founder.GetHerHis|U]の信奉者は、火刑で命を落とすより、剣を取って戦うことを選ぶ。"
 heresy_historical.0050.gloss.iconoclast: "[founder.GetSheHe|U]は、聖像破壊運動の復活を説いている。聖画のキリストも金色に装飾された聖人もすべて偶像であり、第2ニカイア公会議は償われざる過ちであると主張している。"
 heresy_historical.0050.gloss.adoptionist: "[founder.GetSheHe|U]は、スペインにおける過去の論争を再び持ち出し、キリストは人間としては神の実子ではなく養子であると主張している。"
 heresy_historical.0050.gloss.messalian: "[founder.GetSheHe|U]は、どんな秘跡よりもたゆまぬ祈りが重要であるとし、司祭が決して追い払うことのできない内なる悪が存在すると説いている。"
 heresy_historical.0050.gloss.generic: "[founder.GetSheHe|U]は、[heresy_faith.GetAdjective]の伝統に由来し、それを先鋭化させ、徹底的に再編した教義を説いている。"
 heresy_historical.0050.history.lollard: "\n\n事の発端はオックスフォードで、神学者たちが教会法について素朴な問いを投げかけたことだった。今やその動きは英語訳の聖書という形を取り、修道院から町へと急速に広がっており、教区司祭は問題の聖書を没収する暇さえない。"
 heresy_historical.0050.history.hussite: "\n\n火が付いたのはプラハのベツレヘム礼拝堂での出来事だった。ボヘミア語による説教と、一般信徒への聖杯の授与が行われたのだ。国王は見て見ぬふりをしたが、教皇庁は許さないだろう。"
 heresy_historical.0050.history.joachimite: "\n\n事の発端はカラブリアの修道院で、修道院長が黙示録を暦として読み、来るべき時代までの年を数えたことだった。霊的フランシスコ会士たちがその計算を引き継ぎ、今では信徒伝道者たちが各地の市場に広めている。"
 heresy_historical.0050.history.cathar: "\n\nバルカンから広がった運動は、ラングドックの領主らの間に根を下ろし、今や織工も子爵も身分の垣根なく参加している。完徳者は裸足で誓約を拒み、その信徒は季節を追うごとに増えている。"
 heresy_historical.0050.history.waldensian: "\n\n事の発端は、リヨンの商人が自らの財産を貧しい人々に分け与え、聖書の教えを説いたことだった。教会会議はこの商人を黙らせたが、信徒たちは裸足で二人組となってアルプスの谷へと移っていった。"
 heresy_historical.0050.history.bogomilist: "\n\n事の発端は、ツァーリ・ピョートルのもとで村の司祭たちが、パンと葡萄酒はただのパンと葡萄酒にすぎないと説いたことだった。この教えは総主教によって異端とされたが、それでもスラヴの農村へと浸透し、完全に消えることはなかった。"
 heresy_historical.0050.history.paulician: "\n\nこの教えの火は、ボスポラスのどの大聖堂よりも古い。信徒たちがアルメニア高地でパウロを厳格に読み解くなかから生まれ、かつてテフリケを拠点にして帝国に抗い、守られた火だ。"
 heresy_historical.0050.history.iconoclast: "\n\n帝国は二度、教会からすべての聖像を取り除いた。だが二度とも聖像は戻り、問いは答えられないままに葬られた。そして今、古い論争が再び歩き出している。"
 heresy_historical.0050.history.adoptionist: "\n\nその論争の起源はイベリアの辺境にある。辺境の司教たちは、大工の息子は栄光のうちに生まれたのではなく、栄光へと迎え入れられた養子であると説いたのだ。フランクフルトとアーヘンの公会議はこれを断じたが、辺境の信徒たちは問うことをやめなかった。"
 heresy_historical.0050.history.messalian: "\n\n始まりはメソポタミアの砂漠。眠ることなく祈り続ける放浪の修道士たちが、すべての魂にはどんな司祭にも祓えない悪霊が宿ると主張した。エフェソス公会議は彼らを断罪したが、彼らは構わず放浪を続けた。"
 heresy_historical.0050.history.generic: "\n\nどの時代にも、似たような火は生まれる。戒律を破る修道院や、大聖堂を飛び出して二度と戻らない説教師たちがそうだ。そして今、その火は広がりつつある。"
 heresy_historical.0050.a: "彼らの大義は正しい。受け入れよう。"
 heresy_historical.0050.b: "あの強い信念が私にもあれば…"
 heresy_historical.0050.c: "異端者め…"
 heresy_historical.0050.c.insider: "我らは耐える。大義は広がる。"
 heresy_historical.spread.title: "異端の拡大"
