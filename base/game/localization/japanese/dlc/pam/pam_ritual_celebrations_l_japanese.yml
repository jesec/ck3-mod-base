l_japanese:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "[activities|E]「[GetActivityType('activity_feast').GetName]」用の[intent|E]「$praise_the_gods_intent$」をアンロック"
 praise_the_gods_intent: "神を讃える"
 praise_the_gods_intent_desc: "共同の祝宴を礼拝に変え、宴の間を通して宗教的知識、霊的洞察、そして親睦を求める。"
 praise_the_gods_intent_not_valid_desc: "あなたは個人的に、もはや[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )]の[tenet|E]に従わない"
 pam_ritual_celebrations_events.0001.t: "啓示の宴"
 pam_ritual_celebrations_events.0001.desc: "皿が空になり、杯が満たされるにつれて、[ROOT.Char.GetFaith.WealthGodName]への乾杯がさらなる乾杯を呼ぶ。やがて広間には祈りや聖なる物語、熱を帯びた神学論争の声が響き渡る。\n\n祝宴の温かな雰囲気の中、熱気ある親睦を通じてであれ、静かな祈りを通じてであれ、悟りに手が届きそうな気がしてくる。"
 pam_ritual_celebrations_events.0001.a: "お祭り騒ぎを礼拝に変えよう。"
 pam_ritual_celebrations_events.0001.b: "私は身を引き、厳粛な内省のうちに祈りを捧げる。"
 pam_praise_the_gods_revelation_outcome_tt: "祝宴の喧騒から神聖な真理が浮かび上がる"
 pam_praise_the_gods_belief_outcome_tt: "半ば忘れかけていた教えが、信仰の新たな道を開く"
 pam_praise_the_gods_legend_outcome_tt: "今夜の聖なる物語が伝説として根付き、後世に語り継がれる"
 pam_praise_the_gods_clergy_outcome_tt: "共に捧げる賛美により、食卓を囲む[clergy|E]の一人との絆が深まる"
 pam_praise_the_gods_scholar_outcome_tt: "今夜の議論は、聖なる学問への尽きることのない渇望を呼び覚ます"
 pam_praise_the_gods_scholar_xp_outcome_tt: "あらゆる祈りと寓話が、聖なる学問への理解を深めさせる"
 pam_praise_the_gods_revelation_toast: "お祭り騒ぎのなかの啓示"
 pam_praise_the_gods_belief_toast: "神学的洞察"
 pam_praise_the_gods_legend_toast: "聖なる物語が根付く"
 pam_praise_the_gods_clergy_toast: "[ROOT.Char.GetFaith.WealthGodName]への賛美で結ばれた絆"
 pam_praise_the_gods_scholar_toast: "宴で見出した知恵"
 pam_praise_the_gods_scholar_xp_toast: "学識が深まる"
 pam_praise_the_gods_clergy_bond_opinion: "神聖なる祝宴で結ばれた絆"
 pam_praise_the_gods_log_title: "神を讃えた"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U]は、宴での祈り、物語、そして議論を通じて神の洞察を求めた"
 pam_praise_the_gods_quiet_log_title: "静かな献身のうちに祈った"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U]はお祭り騒ぎから身を引き、静かな祈りのうちに神聖なる安らぎを求めた"
