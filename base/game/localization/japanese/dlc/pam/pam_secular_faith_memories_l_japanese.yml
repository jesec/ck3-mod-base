l_japanese:
 # Character memories raised by the secular-faith flavor events.
 # Owner = the ruler who remembers; participant role names match the type definitions.
 pam_sf_kings_touch_healing_memory: "触れただけで病人を癒した"
 pam_sf_kings_touch_healing_memory_desc: "重病を患っていた[healed_subject.GetTitledFirstName]に私が手を触れると、[healed_subject.GetSheHe]は回復した。"
 pam_sf_kings_touch_healing_memory_desc_second_perspective: "重病を患っていた[healed_subject.GetTitledFirstName]にあなたが手を触れると、[healed_subject.GetSheHe]は回復した。"
 pam_sf_kings_touch_healing_memory_desc_third_perspective: "重病を患っていた[healed_subject.GetTitledFirstName]に[owner.GetTitledFirstName]が手を触れると、[healed_subject.GetSheHe]は回復した。"
 pam_sf_deliverance_memory: "悪魔祓いを行った"
 pam_sf_deliverance_memory_desc: "[delivered_soul.GetTitledFirstName]が凶暴な霊に取り憑かれていたため、私は悪魔払いを行った。"
 pam_sf_deliverance_memory_desc_second_perspective: "[delivered_soul.GetTitledFirstName]が凶暴な霊に取り憑かれていたため、あなたは悪魔払いを行った。"
 pam_sf_deliverance_memory_desc_third_perspective: "[delivered_soul.GetTitledFirstName]が凶暴な霊に取り憑かれていたため、[owner.GetTitledFirstName]は悪魔払いを行った。"
 pam_sf_prophecy_fulfilled_memory: "予言が現実になるのを目撃した"
 pam_sf_prophecy_fulfilled_memory_desc: "[prophet.GetTitledFirstName]は私に[doomed.GetTitledFirstName]が死ぬと警告した。そして実際に[doomed.GetSheHe]は死んだ。"
 pam_sf_prophecy_fulfilled_memory_desc_second_perspective: "[prophet.GetTitledFirstName]はあなたに[doomed.GetTitledFirstName]が死ぬと警告した。そして実際に[doomed.GetSheHe]は死んだ。"
 pam_sf_prophecy_fulfilled_memory_desc_third_perspective: "[prophet.GetTitledFirstName]は[owner.GetTitledFirstName]に[doomed.GetTitledFirstName]が死ぬと警告した。そして実際に[doomed.GetSheHe]は死んだ。"
