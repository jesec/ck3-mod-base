l_japanese:
 PAM_CHALLENGE_HOF_WAR_CB_NAME: "[head_of_faith|E]に挑戦"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "あなたが擁立した[challenger_hof|E]が、[head_of_faith_possessive|E]の称号を奪取し、[attacker.GetRite.GetName]が[mainline_rite|E]となる。"
 pam_challenge_hof_cb_victory_desc_attacker: "あなたが[head_of_faith_possessive|E]の称号を奪取し、[attacker.GetRite.GetName]が[mainline_rite|E]となる。"
 pam_challenge_hof_cb_victory_desc: "[challenger_hof|E]が[head_of_faith|E]になる。"
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U]は[head_of_faith|E]に留まる。"
 pam_challenge_hof_cb_defeat_desc_attacker: "[head_of_faith|E]に対するあなたの挑戦は失敗に終わる。"
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "戦争が終結した：防衛側はもはや[head_of_faith|E]ではない。"
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "戦争が終結した：宗教指導者に対抗する者はもはやいない。"
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U]は[sponsor.GetShortUINamePossessive]の[vassal|E]になる"
 PAM_ANTIKING_WAR_CB_NAME: "[challenger_hof|E]の廃位"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "[defender.GetShortUINamePossessive]の[challenger_hof|E]を排除し、[attacker.GetFaith.GetReligiousHead.GetShortUINamePossessive]の感謝を得る。"
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "[defender.GetShortUINamePossessive]の[challenger_hof|E]を排除する。"
 pam_antiking_cb_victory_desc: "[challenger_hof|E]が廃位される。"
 pam_antiking_cb_white_peace_desc: "[challenger_hof|E]が現在の地位にとどまる。"
 pam_antiking_cb_defeat_desc_attacker: "[challenger_hof|E]を排除する試みが失敗する。"
 pam_antiking_cb_defeat_desc: "[challenger_hof|E]が生き延びる。"
 msg_pam_antiking_cb_invalidated_message: "戦争が終結した：防衛側はもはや[challenger_hof|E]を後援していない。"
 pam_humiliation_cb_papabile_score_loss_tt: "教皇継承における[defender.GetShortUINamePossessive|U]の[papabile_score|E]が#N 25#!低下する"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "教皇継承における[attacker.GetShortUINamePossessive|U]の[papabile_score|E]が#N 25#!低下する"
 pam_clerical_disgrace_modifier: "聖職者の恥辱"
 pam_clerical_disgrace_modifier_desc: "この人物は宗教戦争で屈辱を味わい、[clerical_titles|E]の[candidate_score|E]が低下している。"
 pam_clerical_disgrace_candidacy_penalty_desc: "宗教戦争で屈辱を味わった"
 pam_antipope_events.0010.t: "僭称者の屈服"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')]分裂主義者、[pam_ch_hof_challenger.GetTitledFirstName]が偽りの[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]の座から引きずり降ろされ、私の前にひざまずいている。\n\nなおも反抗的な態度を崩さず、[pam_ch_hof_challenger.GetSheHe]が口を開く。「聖櫃は私の立つところにあるものだ。貴様の足元ではない」\n\nこの者の舌は、どうやら今なおサタンに仕えているようだ。"
 pam_antipope_events.0010.desc: "僭称者である[pam_ch_hof_challenger.GetTitledFirstName]が、偽りの[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]の座から引きずり降ろされ、私の前にひざまずいている。\n\nなおも反抗的な態度を崩さず、[pam_ch_hof_challenger.GetSheHe]が口答えする。「真の[ROOT.Char.GetFaith.ReligiousHeadName]はこの私だ」"
 pam_antipope_events.0010.a.christian: "独房に放り込めば、ヨナのように悔い改めるかもしれない。"
 pam_antipope_events.0010.a: "牢に閉じ込めておけ。"
 pam_antipope_events.0010.b.christian: "処刑しろ。主は御自身に属する者をご存じだ。"
 pam_antipope_events.0010.b: "処刑しろ。あとは[ROOT.Char.GetFaith.HighGodName]がお裁きになる。"
 pam_antipope_events.0010.c: "慈悲をかけてやろう。"
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.GetSheHe|U]は真の[ROOT.Char.GetFaith.ReligiousHeadName|U]の名を泣き叫ぶことになるだろう。"
 pam_challenge_hof_war_random_permanent_harm_tt: "ランダムに選ばれた恒久的な傷を負う"
 pam_antipope_events.0011.t: "後援の代償"
 pam_antipope_events.0011.desc.christian: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive]が金の力でこの邪悪な分裂を押し進め、[ROOT.Char.GetRite.GetName]に対して対立[ROOT.Char.GetFaith.ReligiousHeadName|U]を擁立した。\n\n聖書はこのような後援者を厳しく非難している。「[Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]」\n\n[pam_ch_hof_sponsor.GetSheHe|U]は顔を上げ、なおも反抗的な態度で言い放つ。「貴様は[ROOT.Char.GetFaith.ReligiousHeadName]などではない。偽りの修道士だ。その座から降りよ、降りよ、永劫に呪われよ！」"
 pam_antipope_events.0011.desc: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive]が金の力で対立[ROOT.Char.GetFaith.ReligiousHeadName|U]を擁立し、[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]に分断をもたらした。\n\n[pam_ch_hof_sponsor.GetSheHe|U]が顔を上げる。「貴様は[ROOT.Char.GetFaith.ReligiousHeadName]などではない。詐欺師だ」"
 pam_antipope_events.0011.a: "この事態を招いた財貨を没収せよ。"
 pam_antipope_events.0011.b: "処刑せよ。この事態の容認には代償が伴う。"
 pam_antipope_events.0011.c: "[pam_ch_hof_sponsor.GetHerHis]の一族に塗られた恥辱だけで十分な罰だ。"
 pam_antipope_events.0011.d: "肉が裂けるまで鞭打て。"
 pam_romans_1_32_english: "このようなことを行う者は、死に値する。それを知りながら、彼らはなおも自ら行うのみならず、そうする者を誉め称えてすらいるのだ。"
 ROMANS_1_32_GLOSS: "#weak ローマ1章32節（新改訂標準訳聖書・更新版）#!"
 pam_antipope_events.0012.t: "廃位されし者への裁き"
 pam_antipope_events.0012.t.christian: "サタンの兵士への裁き"
 pam_antipope_events.0012.intro.christian: "[ROOT.Char.GetRite.GetName]が従うのは私だ。偽りの[ROOT.Char.GetFaith.ReligiousHeadName|U]、[pam_ch_hof_old_hof.GetTitledFirstName]は我が足元にひざまずいている。"
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]が従うのは私だ。偽りの[ROOT.Char.GetFaith.ReligiousHeadName|U]、[pam_ch_hof_old_hof.GetTitledFirstName]は我が足元にひざまずいている。"
 pam_antipope_events.0012.intro.sponsor: "我が[ROOT.Char.GetFaith.ReligiousHeadName|U]、[pam_ch_hof_new_hof.GetFirstName]が聖座に就いた。僭称者[pam_ch_hof_old_hof.GetTitledFirstName]は我が足元にひざまずいている。"
 pam_antipope_events.0012.dialogue.christian: "\n\nなおも反抗的な態度で、[pam_ch_hof_old_hof.GetSheHe]が吐き捨てる。「貴様は剣によって、平和の座を奪ったのだ」\n\n「主は、御自身の計画を成し遂げるための道具を私に授けてくださったまでだ」私は答える。"
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetSheHe|U]が言う。「貴様は剣によってその座を奪ったのだ」\n\n「そして剣によって、それを守るのだ」私は答える。"
 pam_antipope_events.0012.a: "独房に入れば、その驕りも冷めるだろう。"
 pam_antipope_events.0012.b: "二つ頭を持つものは怪物となる。一つは刎ねねばならない。"
 pam_antipope_events.0012.c: "争いはもう十分だ。平安のうちに[pam_ch_hof_old_hof.GetHerHim]を去らせよ。"
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.GetSheHe|U]は真の[ROOT.Char.GetFaith.ReligiousHeadName|U]の名を泣き叫ぶことになるだろう。"
 pam_antipope_events.0014.t: "私への裁き"
 pam_antipope_events.0014.intro.judge: "「すべての[pam_ch_hof_judge.GetFaith.GetAdherentNamePlural]を汝への服従から解放する」[pam_ch_hof_judge.GetTitledFirstName]が言う。"
 pam_antipope_events.0014.intro.mercy.christian: "「立ち去るがよい。そして二度と罪を犯すな」[pam_ch_hof_judge.GetTitledFirstName]が言う。"
 pam_antipope_events.0014.intro.mercy: "「立ち去るがよい。二度とこの道に戻ってはならぬ」[pam_ch_hof_judge.GetTitledFirstName]が言う。"
 pam_antipope_events.0014.desc.condemned.christian: "\n\n私は正義を愛し、不正を憎んできた。ゆえに私は死ぬのだ。"
 pam_antipope_events.0014.desc.condemned: "\n\n私は己が正しいと信じたもののために死ぬのだ。"
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U]とその手下たちが、私の肉体を鞭打ちながら、嘲って笑う。私はもはやただの抜け殻だ。穀物のもみ殻のようなものだ。"
 pam_antipope_events.0014.desc.captive.christian: "\n\n彼らは私に独房を与えた。聖なる者には小部屋ひとつあれば十分だと、昔から聞かされてきた。"
 pam_antipope_events.0014.desc.captive: "\n\n彼らは私に独房を与えた。それが私に許されたすべてだ。"
 pam_antipope_events.0014.desc.spared.christian: "\n\nどうやら彼らは私に石を投げつけず、私は自由の身となるようだ。この慈悲を無駄にしてはならない。"
 pam_antipope_events.0014.desc.spared: "\n\nどうやら私は自由の身となるようだ。この慈悲を無駄にしてはならない。"
 pam_antipope_events.0014.desc.generic: "\n\n裁きは下された。この先どうするかを決めるのは、私自身だ。"
 pam_antipope_events.0014.a: "我が一族が[ROOT.Char.GetFaith.HighGodName]に忠実であったことを、後世に伝えよう。"
 pam_antipope_events.0014.b: "奴らはその手の血を、決して洗い流せない。"
 pam_antipope_events.0014.b.toast: "あなたは[GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]で穢れている"
 pam_antipope_events.0014.c: "この恥辱から我が一族を守りたまえ。"
 pam_antipope_events.0014.d: "真の[ROOT.Char.GetFaith.ReligiousHeadName]と和解しよう。"
 pam_antipope_events.0014.e: "[pam_ch_hof_judge.GetTitledFirstNameNoTooltip]から教わった悪行を、今度は私が行う番だ。"
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "贖罪が果たされるまで裸足で歩こう。"
 pam_antipope_events.0015.opening: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]の[ROOT.Char.GetTitledFirstNameNoTooltip]へ"
 pam_antipope_events.0015.desc.defender_victory.christian: "[ROOT.Char.GetFaith.ReligiousHeadName|U]に対する分裂主義者の挑戦が打ち砕かれたことを、ここに告げる。僭称者の座は廃され、[ROOT.Char.GetRite.GetName]の結束は揺るぎないものとなった。君主であれ高位聖職者であれ、誰に忠誠を尽くすべきかを、二度と疑うことがないようにせよ。"
 pam_antipope_events.0015.desc.defender_victory: "[ROOT.Char.GetFaith.ReligiousHeadName|U]に対する挑戦が打ち砕かれたことをここに告げる。僭称者の座は廃され、[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]の結束は揺るぎないものとなった。いかなる統治者も、誰に忠誠を尽くすべきかを二度と疑うことがないようにせよ。"
 pam_antipope_events.0015.desc.attacker_victory.christian: "[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]の座をめぐる戦争が終結したことを、ここに告げる。私はその座をサタンのくびきから解放した。[ROOT.Char.GetRite.GetName]は我が命に従うものとする。"
 pam_antipope_events.0015.desc.attacker_victory: "[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]の座をめぐる戦争が終結したことを、ここに告げる。私がその座に就き、[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]は私に従うものとする。信徒らに、新たなる[ROOT.Char.GetFaith.ReligiousHeadName]の君臨を知らしめよ。"
 pam_antipope_events.0015.a: "ならば、そうしよう。"
