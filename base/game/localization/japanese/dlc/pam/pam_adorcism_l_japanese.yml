l_japanese:
 pam_curse_enemy_decision: "敵を呪う"
 pam_curse_enemy_decision_desc: "#F 私に歯向かうとは、身の程知らずの愚か者め。精霊たちの前で奴の名を唱え、あらゆる怨恨と侮辱、そして呪いをその身に浴びせてやる。笑っていられるのも今のうちだ。報いの時がすぐそこに迫っている。#!"
 pam_curse_enemy_decision_tooltip: "好敵手または[wars|E]の交戦相手に対し、呪いの儀式を執り行う"
 pam_curse_enemy_decision_confirm: "儀式を始める"
 pam_curse_enemy_decision_valid_target: "存命している成人の[rival|E]、[nemesis|E]、または交戦相手がいる"
 pam_curse_enemy_decision_selected_target_valid: "選択した敵は、今も存命している成人の[rival|E]、[nemesis|E]、または交戦相手である"
 pam_curse_enemy_decision_no_item_selected: "敵が選択されていない"
 pam_seek_war_aid_decision: "戦争の支援を求める"
 pam_seek_war_aid_decision_desc: "#F 戦争において試されるのは、武器や兵数だけではない。これから待ち受ける試練を乗り越え、大義を果たせるだけの洞察力、活力、そして忍耐力を授けてくださるよう、精霊たちに乞おう。#!"
 pam_seek_war_aid_decision_tooltip: "精霊に、現在進行中の戦争への支援を請う。"
 pam_seek_war_aid_decision_confirm: "精霊に呼びかける"
 pam_adorcism_events.0001.t: "精霊の前で唱える名"
 pam_adorcism_events.0001.desc: "人目につかない場所で、私は[pam_adorcism_curse_target.GetTitledFirstNamePossessive]の名を地面に刻み、胸に抱えるあらゆる恨みを声にして吐き出す。この儀式には骨を砕いたり、作物を枯らしたりする力はない。だが、それは目的ではない。\n\n立ち上がるころには、怒りが鎮まり、固い決意へと変わっている。[pam_adorcism_curse_target.GetHerHim]に関するあらゆる噂が、引けば何かが起こる糸のように思えてくる。"
 pam_adorcism_events.0001.a: "私がなすべきことがはっきりした。"
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U]、貴様の名を精霊の前で唱え、呪いをかけた。災いがその身に降りかかったなら、それを呼び寄せたのが我が意志であることを覚えておくがいい。"
 pam_adorcism_events.0002.desc.default: "\n\n貴様の名を精霊の前で唱え、呪いをかけた。災いがその身に降りかかったなら、それを呼び寄せたのが我が意志であることを覚えておくがいい。"
 pam_adorcism_events.0002.a: "誰か、[ROOT.Char.GetFaith.PriestNeuter]を呼んでくれ——早く！"
 pam_adorcism_events.0002.a.flavor: "呪いがあなたの心を蝕み、あらゆる影が不吉な前兆のように思える。"
 pam_adorcism_events.0101.t: "見えざるものからの助言"
 pam_adorcism_events.0101.desc: "野営地の焚火が途絶えた先で私は供物を捧げ、耳を澄ませる。背後で軍勢のざわめきが次第に遠のいていく。風が砂埃を巻き上げ、はっきりとした声は聞こえてこない。それでも、この儀式は心を落ち着かせてくれる。\n\nこれから待ち受ける遠征のためにどんな助けを乞うべきかを、決めなければならない。"
 pam_adorcism_events.0101.a: "勝利への道を示したまえ。"
 pam_adorcism_events.0101.b: "我が剣腕に力を授けたまえ。"
 pam_adorcism_events.0101.c: "我が軍勢に不屈の心を授けたまえ。"
 pam_adorcism_curse_focus_modifier: "怒りの転嫁"
 pam_adorcism_curse_focus_modifier_desc: "この人物は怒りの矛先を定め、儀式によって相手に放った。"
 pam_adorcism_ill_omen_modifier: "凶兆の印"
 pam_adorcism_ill_omen_modifier_desc: "この人物の流派の信徒は、呪いの噂を聞いてから、この人物に疑いの目を向けている。"
 pam_adorcism_curse_anxiety_modifier: "呪いへの恐れ"
 pam_adorcism_curse_anxiety_modifier_desc: "この人物は、災いが降りかかるたびに、呪いによるものではないかと疑わずにはいられない。"
 pam_adorcism_battle_guidance_modifier: "精霊に導かれた戦略"
 pam_adorcism_battle_guidance_modifier_desc: "この人物は、精霊が戦いの吉兆を示してくれたと信じている。"
 pam_adorcism_personal_vigor_modifier: "精霊から授かった活力"
 pam_adorcism_personal_vigor_modifier_desc: "儀式によって得た自信が、この人物に一騎討ちでの強さをもたらしている。"
 pam_adorcism_campaign_endurance_modifier: "精霊に支えられる軍勢"
 pam_adorcism_campaign_endurance_modifier_desc: "この人物の軍勢は、新たな信念を胸に、長きにわたる遠征を耐え抜いている。"
