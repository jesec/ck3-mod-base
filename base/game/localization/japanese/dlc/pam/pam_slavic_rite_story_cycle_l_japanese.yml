l_japanese:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "グラゴル文字"
 slavic_rite.1000.desc: "「さあ、兄弟、[greek_preacher.GetFirstName]よ」と、我が[court_chaplain.GetActiveCouncilTask.GetPositionName]が、[GetRiteByKey('byzantine_rite').GetAdjective]の信徒である[greek_preacher.Custom('MyPriestTitle')]を手招きする。\n\n「おお、[ROOT.Char.GetTitleAsNameNoTooltip]よ、あなたの王国に祝福あれ。我が兄弟たちは、あなたの民のため、文字体系の開発を着実に進めております。ああ、しかし我々は、あなたの領地に聖界権力を及ぼそうと目論む[GetRiteByKey('carolingian_christianity').GetAdherentName]の司祭たちの影と脅威の下に置かれています。[Glossary('キュリロスとメトディオス', 'CYRIL_AND_METHODIUS_GLOSS')]から、対立を避け、外交的解決策を見出すため、方策を練る時間をもう少しいただけないかと申し出がありました」"
 slavic_rite.1000.a: "ここまで来たのだ。彼らを信じよう。"
 slavic_rite.1000.a_tt: "新たなスラヴ文字を生み出した兄弟、[Glossary( 'キュリロスとメトディオス', 'CYRIL_AND_METHODIUS_GLOSS' )]は、あなたの領国に新たな[court_chaplain.GetFaith.GetAdjective][rite|E]を広めるための次の一手を、間もなく知らせてくれるだろう。"
 slavic_rite.1000.b: "[GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip]の怒りを受けるくらいなら、この道から身を引いたほうがよい。"
 slavic_rite.1000.b_tt: "[Glossary('キュリロスとメトディオス', 'CYRIL_AND_METHODIUS_GLOSS')]による現地文字の開発と、新たな[rite|E]の確立に向けたすべての取り組みが断念される。"
 slavic_rite.1000.b_tt_2: "$story_slavic_rite$の[story_cycle|E]が終了する。"
 # Travel to Rome Initiation
 slavic_rite.0001.t: "モラヴィアへの宣教"
 slavic_rite.0001.desc: "[Glossary( 'キュリロスとメトディオス', 'CYRIL_AND_METHODIUS_GLOSS' )]に再び会うことができて安心した。彼らに[GetRiteByKey('carolingian_christianity').GetAdherentName]の干渉に対処する策があることを願う。\n\n「高貴なる[ROOT.Char.GetTitleAsNameNoTooltip]よ、あなたの民の信仰の安全を保障する唯一の手段は、[pope_scope.GetCapitalLocation.GetBaronyNameExplicitly]へ赴き、[pope_scope.GetTitledFirstName]の祝福を受けることであるように思われます」\n\n聖ペトロの座の権威が、横暴な[GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip]を抑え込んでくれることを切に願うが、彼らは自分たちの仲間しか重んじないように見える。"
 slavic_rite.0001.a: "神のご加護を。"
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName]と[methodius_scope.GetFirstName]が旅路につく。彼らの旅が成功すれば、その帰還はあなたの領国全体に新たな宗教運動を巻き起こすかもしれない。"
 slavic_rite.0001.b: "手ぶらで行かせるわけにはいかない。"
 slavic_rite_travel_toast_title: "キュリロスとメトディオスが旅立った"
 slavic_rite_moravian_mission_gift_sent_tooltip: "贈り物が[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]へ送られる。兄弟は帰還後、その反応をあなたに知らせる。"
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "[methodius_scope.GetRite.GetName]の誕生"
 slavic_rite.0003.desc: "[methodius_scope.GetFirstNameNoTooltip]が[moravia_liege_scope.GetTitledFirstNameNoTooltip]の助力を得て、[moravia_liege_scope.GetCulture.GetNameNoTooltip]の地で[methodius_scope.GetFaith.GetNameNoTooltip]の新たな実践方式を広めようとしているとの知らせを受けた。我が国の学者たちは、それを[methodius_scope.GetRite.GetName]と呼んでいる。\n\nこれまで我々は現地の民を我々に近づけようと努めてきた。それにもかかわらず、[methodius_scope.GetSheHe]は新たな文字体系を用いて彼らに教えを広めることについて、[pope_scope.GetTitledFirstNameNoTooltip]から承認を取りつけたのだ。"
 slavic_rite.0003.a: "[methodius_scope.GetHerHis]のやり方が、どこまで通用するか見ものだな。"
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "[ROOT.Char.GetCulture.GetNameNoTooltip]の[methodius_scope.GetRite.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "今朝、興味深い知らせが宮廷にもたらされた。\n\n[liege_scope.GetTitledFirstNameNoTooltip]は、[methodius_scope.GetCulture.GetNameNoTooltip]人の司祭[methodius_scope.GetFirstNameNoTooltip]が、長年にわたり我らの地で冒涜的な教えを広めることを許してきた。[methodius_scope.GetFaith.GetNameNoTooltip]は、[ROOT.Char.GetCulture.GetNameNoTooltip]の生活様式に合わせて実践できる形へと変えられていくというのだ。\n\n近頃、我らの伝統における霊的なあり方をめぐって、あまりにも多くの騒ぎが起きている。この種の問題全般について、どう向き合うべきか考える時が来たのかもしれない。"
 slavic_rite.0004.desc_chalcedonian: "我らの[liege_scope.GetTitleAsNameNoTooltip]は、領国全域に[methodius_scope.GetRite.GetNameNoTooltip]を広めるべく、その制定を布告した。学者たちによれば、それは我らの生活様式を損なうことなく、[methodius_scope.GetFaith.GetNameNoTooltip]をより無理なく実践する方法であるという。\n\n一考に値するのではないだろうか？"
 slavic_rite.0004.a_pagan: "我らの祖先の慣習こそ、優れた慣習だ。"
 slavic_rite.0004.b_pagan: "一理あるのかもしれない…"
 slavic_rite.0004.a_chalcedonian: "真の道から外れるつもりはない。"
 slavic_rite.0004.b_chalcedonian: "学者たちを呼べ。"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "ほろ苦い旅路"
 slavic_rite.0005.desc: "[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]から戻った[methodius_scope.GetFirstName]は、今度はひとりで私の前に立っている。[cyril_scope.GetFirstName]のことを尋ねると、[methodius_scope.GetHerHis]の表情が曇った。\n\n「慈悲深き[ROOT.Char.GetTitleAsNameNoTooltip]よ、良い知らせは、[pope_scope.GetTitledFirstName]が我らに祝福を授け、我ら独自の方法と聖典を用いて、[ROOT.Char.GetCulture.GetNameNoTooltip]の民の間で、そしてあなたの領国全域において、信仰を広めることを認めてくださったことです」そう言うと、[methodius_scope.GetSheHe]は深く息を吸った。「ですが残念ながら、私は兄弟を彼の地に残してこなければなりませんでした。我々の努力が無駄にならぬよう、最善を尽くすつもりです。[ROOT.Char.GetFaith.HighGodName]が我らを助けたまわんことを」"
 slavic_rite.0005.a: "あなたの兄弟が誇りに思えるよう、共に我らの務めを果たそう。"
 slavic_rite.0005.b: "私にできるのは、彼の遺志を尊ぶことくらいだ。"
 pam_cyril_statue_modifier: "キュリロスの記念碑"
 pam_brothers_travel_safety_modifier: "慎重な旅路"
 slavic_rite.0005.c: "汝の務めに幸運あれ。"
 slavic_rite_mass_conversion_tooltip: "[counties|E]を[methodius_scope.GetRite.GetName]へ改宗させることを目指す大規模改宗[great_project|E]が、[moravia_liege_scope.GetPrimaryTitle.GetNameNoTier]のすべての[duchies|E]を対象に計画された。"
 slavic_rite_moravian_mission_gift_received_tooltip: "[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]への贈り物は感謝と共に受け取られた。"
 slavic_rite_ecclesiastical_title_creation_tooltip: "$slavic_rite_ecclesiastical_title$が創設され、[methodius_scope.GetFirstName]が初代[holder|E]となる。"
 slavic_rite_ecclesiastical_title: "モラヴィア$d_et_archdiocese_prefix$"
 slavic_rite_ecclesiastical_title_name: "モラヴィア"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "モラヴィアへの宣教の終わり"
 slavic_rite.0006.desc.brothers_are_dead: "[Glossary('キュリロスとメトディオス', 'CYRIL_AND_METHODIUS_GLOSS')]兄弟が死亡し、彼らの典礼改革を引き継ぐにふさわしい者はいない。民の完全な改宗を望むのなら、我々独自の方法を築かねばならない。"
 slavic_rite.0006.desc.no_longer_christian: "私はかつて、栄光への道を見た。だが、民と我が一族の幸福のために抱いた志も、今ではまったく取るに足らないものに思える。彼らに定められていた道は、私が望んだものとは違っていた。ありがたいことに、[ROOT.Char.GetFaith.HighGodName]が我らに正しき道を示してくださったのだ。"
 slavic_rite.0006.desc.no_longer_king: "最近の出来事と強大な地位を失った経験から、分不相応な重荷は背負うべきではないと学んだ。今の我々に、モラヴィアへの布教を支え続ける余裕はない。だがいずれ立ち直った時、新たな条件下でもう一度試みることはできるかもしれない。\n\nそれまでは、同じ運命を辿らないよう、[ROOT.Char.GetPrimaryTitle.GetNameNoTier]を守らねばならない。"
 slavic_rite.0006.desc.no_longer_slav: "我が祖先は、今の私を誇りには思わないだろう。\n\nだが、それでいい。[ROOT.Char.GetPrimaryTitle.GetNameNoTier]をいかに治めるかを決めるのは彼らではない。この私なのだ。"
 slavic_rite.0006.a.brothers_are_dead: "こんなはずでは…"
 slavic_rite.0006.a.no_longer_christian: "[ROOT.Char.GetFaith.HighGodName]を称えよ！"
 slavic_rite.0006.a.no_longer_king: "もはやそのような大望を抱く余裕はない。"
 slavic_rite.0006.a.no_longer_slav: "グラゴル文字は我が民にとって重荷だった。"
 slavic_rite.0006.a.tooltip: "領国への宣教を目的とした$story_slavic_rite$は廃止された。"
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "[ROOT.Char.GetFaith.HighGodName]によって結ばれた領国"
 slavic_rite.0007.desc: "「#italic …[ROOT.Char.GetHerHis]の統治の下、我らが敬虔さと威厳を保ち、\n静かで平穏な生活を送れますように。\n\n王国、力、そして栄光は主のものです。\n今もいつも、世々に至るまで。アーメン。#!」\n\n[archdiocese_holder.GetTitledFirstName]が祈りを終えると、永遠の至福にも似た感覚が私の魂を満たした。我ら独自の神聖なる伝統を、領国の隅々まで行き渡らせるという使命は、見事に果たされたのだ。[ROOT.Char.GetFaith.HighGodName]が我が一族、[Glossary( 'キュリロスとメトディオス', 'CYRIL_AND_METHODIUS_GLOSS' )]、そして[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]の善良なる民を祝福してくださいますように。"
 slavic_rite.0007.a: "聖なる道を歩むことが我らの運命だったのだ。"
 pam_slavic_rite_clergy_opinion_modifier: "祝福された君主"
 slavic_rite.0007.b: "我が民に耐えられぬものなどない。"
 pam_slavic_rite_culture_opinion_modifier: "人民の君主"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "潜伏する説教師たち"
 slavic_rite.0010.desc: "我が宮廷聖職者[court_chaplain.GetTitledFirstName]に連れられ、[undercover_preacher.GetCulture.GetNameNoTooltip]の[undercover_preacher.Custom('MyPriestTitle')]と[undercover_preacher.GetHerHis]の説教師の一団が、恥じる様子もなく広間へ入ってきた。\n\n「ご挨拶申し上げます、我が[ROOT.Char.GetTitleAsNameNoTooltip]。我々は潜入者どもを見つけ出しました。この者どもは[court_chaplain_superior.GetTitledFirstName]やあなたの権威を無視し、[ROOT.Char.GetFaith.HighGodName]の御言葉を説いていたのです」[court_chaplain.GetSheHe|U]は言葉を切り、異国人を頭から足先まで見やった後、再びこちらへ向き直った。\n\n「聞くところによれば、こやつらはかなり前から密かに活動し、何も知らぬ民を説き伏せ、その魂を汚そうとしていたようです。この者らをいかように処分いたしましょう？」"
 slavic_rite.0010.a: "去れ、二度と我が領土に足を踏み入れるな。"
 slavic_rite.0010.b: "あれだけ警告しても足りなかったようだな。"
 slavic_rite.0010.c: "主に合わせる顔もあるまい。ここに残ってはどうだ？"
 slavic_rite.0010.c.success: "[undercover_preacher.GetSheHe|U]はあなたの宮廷で新たな人生を始めることを望んでいる"
 slavic_rite.0010.c.failure: "[undercover_preacher.GetSheHe|U]は説得されない"
 preacher_recruited.t: "説教師を雇用した"
 preacher_left.t: "説教師は去った"
 # 0020
 slavic_rite.0020.t: "敬虔なる大義への資金援助"
 slavic_rite.0020.desc: "「彼らは現地の住民を利用しようとしているわけではありません、我が[ROOT.Char.GetTitleAsNameNoTooltip]。その点、[court_chaplain_superior.GetTitledFirstNamePossessive]の各地を巡る説教師たちは非常に思慮深いのです。あなたに話を通してほしいと私に頼むほどで、その謙虚さは称賛に値します。あなたの承認があれば、彼らは宣教活動を進めやすくなり、民もそれを受け入れやすくなるでしょう」\n\n他者に代わって私を説得しようとする[court_chaplain.GetTitledFirstNamePossessive]の努力は認めるが、その才はむしろ我が民が古き伝統を手放す手助けに向けるべきではないかと思わずにはいられない。\n\n「これは、あなたが[ROOT.Char.GetFaith.HighGodNamePossessive]に近づく機会となるお導きなのだと思います」"
 slavic_rite.0020.a: "我が民から不信心を取り除くのは早いほどよい。"
 pam_slavic_rite_great_project_speed_modifier: "改宗計画の資金提供"
 slavic_rite.0020.b: "出せるのはこれが精一杯だ。"
 slavic_rite.0020.c: "断じて断る。"
 # 0030
 slavic_rite.0030.t: "東西の討論"
 slavic_rite.0030.desc: "修道院の庭でそよ風が木の葉を揺らす中、[court_chaplain_superior.GetTitledFirstName]の客人である2人の聖職者が、討論する人々の中で向かい合っていた。一人は東方の伝統をまとい、もう一人は西方の権威を体現している。控えめだった二人の声は、次第に自信と情熱を帯びていった。\n\n彼らは数多くの典礼上の問題について語り合っていた。学術的な討論は興味深い論争へと変わっていき、私はその一言一句に引き込まれていった。\n\nこれは単なる会話ではなかった。2つの世界の対立を象徴し、儚い調和か、あるいは分断の深化を予感させるものであった。"
 slavic_rite.0030.a: "[visiting_byzantine_clergy.GetCulture.GetNameNoTooltip]の[visiting_byzantine_clergy.Custom('MyPriestTitle')]の主張は実に筋が通っている。"
 slavic_rite.0030.b: "[visiting_carolingian_clergy.GetNamePossessiveNoTooltip]の主張には興味深いものがある。"
 slavic_rite.0030.c: "知識は知識だ。私は双方に同意する。"
 slavic_rite.0030.d: "我らの流儀は、彼らの古い原則より優れている。"
