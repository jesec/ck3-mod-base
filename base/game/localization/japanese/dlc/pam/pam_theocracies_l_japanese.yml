 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U]は[clergy|E]の一員であるか、[THIS.Char.GetFaith.GetName]が$doctrine_theocracy_lay_clergy_name$の[doctrine|E]を有していなければならない"
