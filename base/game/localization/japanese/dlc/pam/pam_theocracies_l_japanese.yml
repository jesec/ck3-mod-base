 theocracy_lease: "神権制貸与"
 theocracy_lease_desc: "この[holding|E]は、所有者の[faith|E]に属する[realm_priest|E]に[leased|E]されている。\n\n[realm_priest|E]は[liege|E]（承認を得ている場合）と[religious_superior|E]の双方に対して、[tax|E]と[levies|E]を供出する。\n\n宗教的上位者は、同じ宗派に属している場合は[liege|E]の[realm_priest|E]となり、そうでない場合は、[realm_priest|E]の宗派の[head_of_faith|E]となる。"
 ecclesiastical_lease: "教会制貸与"
 ecclesiastical_lease_desc: "この領分は、所有者の[ecclesiastical|E]の[faith|E]に属する[realm_priest|E]に[leased|E]されている。\n\n[realm_priest|E]は[liege|E]（承認を得ている場合）と[religious_superior|E]、そして直接[head_of_faith|E]に[tax|E]と[levies|E]を供出する。\n\n宗教的上位者は、[liege|E]の首都が属する教会制の[clerical_title|E]の[holder|E]となり、そうでない場合は、[realm_priest|E]の宗派の[head_of_faith|E]となる。"
