l_japanese:
 game_concept_puppet: "傀儡"
 game_concept_puppets: "傀儡"
 game_concept_puppeted: "傀儡"
 game_concept_puppeting: "傀儡"
 game_concept_puppet_type: "傀儡タイプ"
 game_concept_puppet_types: "傀儡タイプ"
 game_concept_puppet_type_desc: "[puppet|e]には複数のタイプがあり、そのタイプによって、あなたに代わって実行できるアクションが決まります。\n\n特別なアクションの多くは共通していますが、各$game_concept_puppet_type$には、そのタイプでのみ利用可能な固有のアクションが用意されています。\n\nたとえば、[clerical_puppet|e]はあなたの代わりに誰かを[excommunicate|e]することができる一方、[external_ruler_puppet|e]には[tributary|e]を解放させたり、[spouse|e]と離婚させたりできます。\n\n各タイプにつき、$game_concept_puppet$は1人しか持つことができません。"
 game_concept_puppet_desc: "傀儡とは[puppeteer|E]の支配下にある[character|E]で、傀儡を通して特殊な傀儡アクションを実行することができます。\n\n傀儡を通して行動することで、通常なら閉ざされている道を開くことができます。[clerical_puppet|E]はあなたに代わって[clerical_titles|E]や[excommunication|E]を請願でき、[external_ruler_puppet|E]には、[tributaries|E]を解放させたり、独立を認めさせたり、[spouse|E]と離婚させたりできます。\n\n実行できるアクションは[puppet_type|E]に応じて異なります。"
 game_concept_puppeteer: "傀儡使い"
 game_concept_puppeteers: "傀儡使い"
 game_concept_puppeteer_possessive: "傀儡使い"
 game_concept_puppeteers_possessive: "傀儡使い"
 game_concept_puppeteer_desc: "傀儡使いとは、1人以上の[puppets|E]を支配している[character|E]です。\n\n傀儡を通して行動することで、傀儡使いは[clergy|E]の影響力や別の[realm|E]の権威など、自身の地位だけでは得られない権限を行使できます。"
 game_concept_clerical_puppet: "領国祭司の傀儡"
 game_concept_clerical_puppets: "領国祭司の傀儡"
 game_concept_clerical_puppet_desc: "自身の[liege|E]の[puppet|E]となっている[realm_priest|E]です。\n\nこの人物を通じて、傀儡使いは[faith|E]の問題に介入できます。[head_of_faith|E]に[clerical_titles|E]や[excommunication|E]を請願したり、[holy_sites|E]を管理したり、新たな[rite|E]を創設したり、[ecumenical_council|E]を開催したりできます。"
 game_concept_external_clerical_puppet: "聖職統治者の傀儡"
 game_concept_external_clerical_puppets: "聖職統治者の傀儡"
 game_concept_external_clerical_puppet_desc: "[clergy|E]の有力者（[archbishop|E]や[head_of_faith|E]など）で、別の[ruler|E]の[puppet|E]となった人物です。\n\n聖職者の権力が強いほど、傀儡使いの影響力も大きくなります。傀儡となった宗教指導者は、あなたに代わって敵を[excommunicate|E]したり、[cardinals|E]を任命したり、[pressed_claim|E]を与えたり、[holy_war|E]を引き起こしたりできます。"
 game_concept_external_ruler_puppet: "世俗統治者の傀儡"
 game_concept_external_ruler_puppets: "世俗統治者の傀儡"
 game_concept_external_ruler_puppet_desc: "[clergy|E]ではない[ruler|E]で、別の[character|E]の[puppet|E]となった人物です。\n\nこの傀儡を通して、[schemes|E]や[imprisonment|E]などを使用し、他の[realms|E]の問題に介入できます。\n\n\nこのタイプの傀儡を作るには、[interaction|E]「#V $make_external_ruler_puppet_interaction$#!」を使用する必要があります。この行動は、以下のいずれかの条件を満たすとアンロックされます：\n$BULLET_WITH_TAB$あなたが対象の[vassal|E]であり、かつ[clergy|E]である\n$BULLET_WITH_TAB$あなたが[GetTrait('seducer').GetName( GetNullCharacter )]であり、かつ対象があなたの[lover|E]であるか、または対象が[king|E]ランク以上であり、かつあなたの[soulmate|E]である\n$BULLET_WITH_TAB$あなたが[GetTrait('torturer').GetName( GetNullCharacter )]であり、かつ対象を[dungeon|E]に収監している\n$BULLET_WITH_TAB$あなたが[GetTrait('family_first').GetName( GetNullCharacter )]であり、かつ対象があなたの[close_family|E]である\n$BULLET_WITH_TAB$あなたが[GetTrait('diplomat').GetName( GetNullCharacter )]であり、かつ対象が[independent_ruler|E]である\n$BULLET_WITH_TAB$あなたが[GetTrait('gallant').GetName( GetNullCharacter )]であり、かつ対象があなたの[spouse|E]である\n$BULLET_WITH_TAB$あなたが[entrenched_regency|E]における対象の[diarch|E]である"
 game_concept_ecumenical_council: "公会議"
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$とは、キリスト教世界の最高位の[clergy|E]が集まり、教会の未来を決める[activity|E]です。\n\n集まった高位聖職者たちは何度も議論を重ね、係争中の[core_tenets|E]について、その[tenet_status|E]を[permitted_tenet_status|E]または[prohibited_tenet_status|E]にしたり、[core_tenet_status|E]として昇格させたり、[faith|E]の[doctrines|E]を決定したりします。"
 game_concept_ecumenical_councils: "公会議"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "教会分裂"
 game_concept_schism_desc: "$game_concept_schism$（大分裂）とは、統一されていた$christian_faith$の[faith|E]がローマとギリシャの[rites|E]に分かれ、$catholic$と$orthodox$に分裂する出来事です。\n\n[the_christian_church|E]の[situation|E]が特定の[the_christian_church_chapters_short|E]に入ると、大分裂の危機が訪れ、キリスト教世界の統治者たちはどちらの陣営につくか選択を迫られます。[decisions|E]によって分裂を解消するか、逆に分裂を確定させない限り、その局面の終了時に分裂は恒久的なものとなります。"
 game_concept_schisms: "教会分裂"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "聖職称号"
 game_concept_clerical_titles: "聖職称号"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$とは[ecclesiastical|E]の[title|E]であり、[faith|E]の[clerical_region|E]を統治する[clergy|E]が保持します。[christian|E]の宗派では、[archdiocese|E]がこれに相当します。\n\n保持者は管区内の[clergy|E]の[religious_superior|E]であり、通常は[head_of_faith|E]からこの称号を授けられます。"
 game_concept_the_christian_church: "キリスト教会"
 game_concept_the_christian_church_desc: "キリスト教会とは、イエス・キリストの信徒を統括して導く聖界組織であり、その変遷は[the_christian_church_chapters_short|E]を経て進行する[situation|E]として表されます。\n\nその管轄は世界中のすべての[archdiocese|E]に及び、[realm|E]が一部でも大司教区内に含まれている[county|E]ランク以上の[christian|E]の[ruler|E]は、聖職者であるか俗人であるかにかかわらず、その一員となります。"
 game_concept_christendom: "キリスト教世界"
 game_concept_christendom_desc: "$game_concept_christendom$には、[the_christian_church|E]（[situation|E]）に属するすべての[independent|E]した[christian|E]の[ruler|E]が治める[realm|E]が含まれます。"
 game_concept_christian: "キリスト教徒"
 game_concept_christians: "キリスト教徒"
 game_concept_christian_possessive: "キリスト教徒"
 game_concept_christian_desc: "[religion|E]のひとつであるキリスト教の信者です。"
 game_concept_papal_bull: "教皇勅書"
 game_concept_papal_bulls: "教皇勅書"
 game_concept_bull: "勅書"
 game_concept_bulls: "勅書"
 game_concept_papal_bull_desc: "教皇勅書とは、[christian|E][faith|E]の[head_of_faith|E]によって発布される正式な布告で、その発布者の意思の背後には[the_christian_church|E]の全面的な権威が存在します。\n\n十分な[church_authority|E]を持つキリスト教の[head_of_faith|E]は、[decision|E]「[GetDecisionWithKey('enact_a_bull_decision').GetName]」を通じて勅書を公布することができ、その際[piety|E]を消費して以下を実行することができます：\n\n$EFFECT_LIST_BULLET$[great_holy_war|E]を宣言する\n$EFFECT_LIST_BULLET$[rite|E]を[heresy|E]として糾弾する\n$EFFECT_LIST_BULLET$[core_tenet|E]の[permitted_tenet_status|E]または[prohibited_tenet_status|E]を宣言する"
 game_concept_situation_the_christian_church_phase: "キリスト教会の局面"
 game_concept_the_christian_church_chapter_short: "局面"
 game_concept_the_christian_church_chapters_short: "局面"
 game_concept_situation_the_christian_church_phases: "キリスト教会の局面"
 game_concept_situation_the_christian_church_phase_desc: "局面は、[the_christian_church|E]の[situation_phases|E]です。局面は全部で7つあり、4種類の[the_christian_church_chapter_types|E]に分類されます。"
 game_concept_the_christian_church_chapter_type: "局面タイプ"
 game_concept_the_christian_church_chapter_types: "局面タイプ"
 game_concept_the_christian_church_chapter_type_desc: "[the_christian_church|E]には、[situation_the_christian_church_phases|E]を分類する4種類の$game_concept_the_christian_church_chapter_types$があります。\n\n$game_concept_the_christian_church_chapter_types$：[the_christian_church_unstable_short|E]、[the_christian_church_crisis_short|E]、[the_christian_church_zeal_short|E]、[the_christian_church_stability_short|E]"
 game_concept_the_christian_church_unstable: "不安定の局面"
 game_concept_the_christian_church_unstable_short: "不安定"
 game_concept_the_christian_church_unstable_desc: "[the_christian_church|E]における#high $game_concept_the_christian_church_unstable$#!とは、服従の意識が薄れる局面です：\n\n[rulers|E]は別の[rite|E]へ改宗しやすくなり、破門がより頻繁に行われるほか、[gold|E]が私的に使われることもあります。\n\n#high $fragile_unity$#!と#high $reform_phase$#!は、$game_concept_the_christian_church_unstable_short$の[the_christian_church_chapters_short|E]にあたります。"
 game_concept_the_christian_church_zeal: "熱意の局面"
 game_concept_the_christian_church_zeal_short: "熱意"
 game_concept_the_christian_church_zeal_desc: "#high $game_concept_the_christian_church_zeal$#!とは、対外的な熱意が高まる局面です：\n\n大規模な改宗が起こることがあり、[great_holy_wars|E]がより頻繁に発生し、[papal_bulls|E]がより頻繁に発布されるほか、他の[faith|E]への改宗もしやすくなります。\n\n#high $conversion_phase$#!と#high $crusade_phase$#!は、$game_concept_the_christian_church_zeal_short$の[the_christian_church_chapters_short|E]にあたります。"
 game_concept_the_christian_church_stability: "安定の局面"
 game_concept_the_christian_church_stability_short: "安定"
 game_concept_the_christian_church_stability_desc: "#high $game_concept_the_christian_church_stability$#!とは、[the_christian_church|E]において貴重な平穏が訪れる局面です：\n\n[temple_holding|E]での建設費用が安くなり、大聖堂の拡張がより早く進み、[characters|E]は[GetTrait('devoted').GetName( GetNullCharacter )]になりやすくなるほか、大分裂が修復されることもあります。\n\n#high $concord$#!は唯一の$game_concept_the_christian_church_stability$にあたります。"
 game_concept_the_christian_church_crisis: "危機の局面"
 game_concept_the_christian_church_crisis_short: "危機"
 game_concept_the_christian_church_crisis_desc: "#high $game_concept_the_christian_church_crisis$#!とは、[the_christian_church|E]が最も深刻な危機に陥る局面です：\n\n免罪符がより安くなり、[ecumenical_councils|E]がより頻繁に開かれ、[rulers|E]が独自の[court_chaplain|E]を任命できるようになるほか、[clergy|E]が結婚できるようになったり、[head_of_faith|E]が[anointment|E]の実施を拒否したり、[taxes|E]が減少したりすることがあります。\n\n#high $saeculum_obscurum$#!と#high $investiture_crisis$#!は、$game_concept_the_christian_church_crisis_short$の[the_christian_church_chapters_short|E]にあたります。"
 game_concept_head_of_rite: "流派指導者"
 game_concept_head_of_rite_desc: "[rite|E]の指導者である[character|E]です。その[rite|E]に属している[head_of_faith|E]がいる場合はその人物が該当し、いない場合はその[rite|E]の信徒が最も多い[clerical_region|E]の保持者が該当します。それもいない場合は、[rite_possessive|E]の[counties|E]を最も多く統治する[ruler|E]が該当します。\n\n$game_concept_head_of_rite$だけが自身の[rite_possessive|E]の[core_tenets|E]と[doctrines|E]を編集できます。また、教会が[schism|E]に向かった際は、この人物が信徒を代表して発言します。"
 game_concept_ecclesiastical: "聖界"
 game_concept_ecclesiastical_government: "聖界政府"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "$game_concept_ecclesiastical$とは、[bishops|E]や[archbishops|E]などの[christian|E]の[clergy|E]である[rulers|E]が採用する[theocratic|E][government_form|E]です。\n\nほとんどの聖界統治者は、世俗の[liege|E]から[temple_holdings|E]の[lease|E]を受け、[head_of_faith|E]に従属する神権制の[vassals|E]ですが、[leased|E]されていない[landed|E][titles|E]を保持する[bishop|E]は、自らの権利に基づき[independent|E]した聖界[ruler|E]として統治することができます。このような統治者が自身の[vassals|E]に対して行使する権力は、彼らの[church_authority|E]によって決定されます。"
 game_concept_lease_contract: "貸与契約"
 game_concept_lease_contract_desc: "キャラクターが称号を[leasing|E]する際の法的条件です。これにより、その人物の[religious_superior|E]が誰であるかも決まります。"
 game_concept_church_obligations: "教会の義務"
 game_concept_church_obligations_desc: "教会の義務とは、[church_holding|E]の収入に課されるさまざまな義務を合わせたものです。これらの義務は、[superior|E]、[head_of_faith|E]、または地域の世俗[ruler|E]に対して支払われます。例としては[church_centralization|E]や[secular_obligations|E]が挙げられます。"
 game_concept_church_centralization: "教会の中央集権化"
 game_concept_minimal_centralization: "最低限の中央集権化"
 game_concept_mild_centralization: "中程度の中央集権化"
 game_concept_strong_centralization: "高度な中央集権化"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$は、教会がどの程度中央集権的な権限と財政構造を採用しているかを表します。中央集権化が強いほど、聖職者階層の上位へ流れる収入が増えます。\n\n中央集権化のタイプは以下の通りです：\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "世俗の義務"
 game_concept_personal_obligations: "個人の義務"
 game_concept_fixed_obligations: "固定義務"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$は、[church_holdings|E]の収入のうち地域の[secular_ruler|E]に帰属する額がどのように決定されるのかを表します。\n\n義務のタイプは以下の通りです：\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\n一部の局面では、世俗統治者が地域において教会に対して通常より大きな権限を持ちます：\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "宗教的上位者"
 game_concept_religious_superiors: "宗教的上位者"
 game_concept_superior: "上位者"
 game_concept_religious_superior_desc: "宗教的上位者とは、階層化された宗教組織において、1人以上の聖職者を自らの[subordinate|E]とし、その聖職者たちに対する宗教上の管轄権を持つ[character|E]のことです。"
 game_concept_religious_subordinate: "宗教的下位者"
 game_concept_religious_subordinates: "宗教的下位者"
 game_concept_subordinate: "下位者"
 game_concept_subordinates: "下位者"
 game_concept_religious_subordinate_desc: "宗教的下位者とは、階層化された宗教組織において、自らの[religious_superior|E]が存在する[character|E]のことです。"
 game_concept_clerical_region: "聖職管区"
 game_concept_clerical_regions: "聖職管区"
 game_concept_clerical_region_possessive: "聖職管区"
 game_concept_clerical_regions_possessive: "聖職管区"
 game_concept_clerical_region_desc: "聖職管区とは、[clerical_title|E]の管轄下に置かれる地理的な区域です。管区内の聖職者はすべて、その管区に関連付けられた[title|E]を保持する者の[subordinate|E]となります。\n\n[ruler|E]は自身の[capital|E][county|E]を含む聖職管区に属し、新たな管区はその創設者の[primary_title|E]の[capital|E]を拠点として設立されます。管区は複数の[realms|E]にまたがることがあり、異なる領国に属する下位者を抱える場合もあります。\n\nひとりの$game_concept_ruler$が同時に複数の$game_concept_clerical_region$を保有することはできません。統治者が新たな聖職管区を授与された場合、以前の管区内の所領をすべて失います。"
 game_concept_clerical_region_capital: "聖職管区の首都"
 game_concept_clerical_region_capitals: "聖職管区の首都"
 game_concept_clerical_region_capital_desc: "聖職管区の首都とは、[clerical_region|E]が[ecclesiastical_estate|E]を基盤として設立された[county|E]のことで、その地域を統治する[clerical_title|E]の本拠地として機能します。[de_jure_capital|E]とは異なり、この首都は管区に固定されており、移転することはできません。"
 clerical_electors: "聖職者選挙人"
 game_concept_archdiocese: "大司教区"
 game_concept_archdioceses: "大司教区"
 game_concept_archdiocese_desc: "大司教区とは、[christian|E]における[clerical_region|E]の形態です。[archbishop|E]がその[clerical_title|E]を通じて保持し、首都となる[county|E]に本拠地を置く聖界の直轄領であり、首都には[grand_cathedral|E]を建設することができます。\n\n[christian|E]の[ruler|E]は、その[capital|E][county|E]を管轄する大司教区の[archbishop|E]に対し、宗教上の事柄について支持を仰ぎます。また、各大司教区の管轄下にある領土は、総じて[the_christian_church|E]（[situation|E]）を構成します。"
 game_concept_grand_cathedral: "大聖堂"
 game_concept_grand_cathedrals: "大聖堂"
 game_concept_grand_cathedral_desc: "大聖堂は[great_project|E]によって建設される[great_building|E]で、[archbishop|E]が座する[archdiocese|E]の首都に建設されます。\n\n最初の大聖堂の建設は、篤い信仰を示す記念碑的な事業です。創設者は永続的な[piety|E]、[legitimacy|E]、[spiritual_fulfillment|E]、追加の[personal_tenet|E]スロットに加え、同じ[faith|E]からの[opinion|E]に恒常的なボーナスが付与されます。建設後は[christendom|E]からキリスト教の巡礼者を引き寄せ、所有者の[cathedral_complex|E]が拡張されます。また、後に[GetBuilding('great_project_cathedral_02').GetName|V]や[GetBuilding('great_project_cathedral_03').GetName|V]へと増築できます。"
 game_concept_monastic_holy_order: "修道会"
 game_concept_monastic_holy_orders: "修道会"
 game_concept_monastic_holy_order_possessive: "修道会"
 game_concept_monastic_holy_orders_possessive: "修道会"
 game_concept_monastic: "修道制"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "修道会とは、祈り、学問、そして単一の[core_tenet|E]の伝道に特化した[holy_order|E]の一種です。創設者の[rite|E]に属し、その[rite_possessive|E]の[core_tenets|E]の1つを掲げ、信徒の間でその実践を広めます。\n\n[archabbot|E]が率いる修道会は、[monastic_order_patrons|E]から与えられた[temple_holdings|E]と[gold|E]によって維持されます。その見返りとして、修道会は[spiritual_fulfillment|E]と[piety|E]をもたらします。\n\n修道制を容認する[faith|E]の[ruler|E]であれば、[decision|E]「#high 修道会を設立する#!」を実行して修道会を創設することができます。"
 game_concept_monastic_order_patron: "修道会の後援者"
 game_concept_monastic_order_patrons: "修道会の後援者"
 game_concept_monastic_order_patronize: "後援"
 game_concept_monastic_order_patronized: "後援"
 game_concept_monastic_order_patronage: "後援"
 game_concept_monastic_order_patron_desc: "修道会の後援者とは、[monastic_holy_order|E]を支える[duchy|E][title_tier|E]以上の[ecclesiastical|E]または世俗の[ruler|E]で、多くの場合、その修道会を設立した統治者です。後援者は、[temple_holdings|E]の貸与や[gold|E]の寄付を通じて、修道会に世俗の富を提供します。\n\nこうした援助の見返りとして、後援者は[piety|E]と[spiritual_fulfillment|E]を得ます。また、修道会の指導者を支配し、その人物を[puppet|E]にして[clerical|E]の行動を実行させることもできます。"
 game_concept_mendicant: "托鉢修道会"
 game_concept_rite: "流派"
 game_concept_rite_possessive: "流派"
 game_concept_rites_possessive: "流派"
 game_concept_rite_desc: "流派とは、宗教的慣習の地域的な違いによって[faith|E]から枝分かれした宗教上の一派です。流派は[head_of_rite|E]に率いられ、それぞれの流派に属する[counties|E]や[characters|E]に信仰されています。すべての宗派には[mainline_rite|E]があり、そこからさらに複数の流派が生まれることがあります。\n\nある流派はその[core_tenets|E]と[doctrines|E]によって定義されます。各信条の[permitted_tenet_status|E]または[prohibited_tenet_status|E]は、[faith|E]がその[mainline_rite|E]を通じて判断します。[rite_possessive|E]の選択がこの判断に反するほど、その[rite_divergence|E]が高まります。乖離した流派は[faithpossessive|E]の[fervor|E]を低下させ、[heresy|E]とみなされるようになり、[divergence|E]が#V 100#!に達すると独立した[faith|E]として分離します。\n\n新たな流派は敬虔な者が創設でき、[rulers|E]をある流派から別の流派へ転向させることもできますが、流派を編集できるのは[head_of_rite|E]だけです。"
 game_concept_rites: "流派"
 game_concept_archabbot: "修道院長"
 game_concept_archabbot_desc: "$game_concept_archabbot$とは、[monastic_holy_order|E]の[ruler|E]にして、その修道会が支持する[rite|E]の[head_of_rite|E]であり、学問や瞑想、そして[core_tenets|E]の伝道においてその成員を導きます。\n\n修道会は[monastic_order_patron|E]の支援を受けることができ、その[monastic_order_patronage|E]によって富と影響力を得ます。\n\n$game_concept_archabbot$が死去すると、その[titles|E]は後継者（通常は最も高い[learning|E]を持つ[courtier|E]）に引き継がれます。"
 game_concept_archbishop: "大司教"
 game_concept_archbishops: "大司教"
 game_concept_archbishop_possessive: "大司教"
 game_concept_archbishops_possessive: "大司教"
 game_concept_archbishop_desc: "大司教とは、キリスト教における[archdiocese|E]の保持者であり、その[clerical_region|E]が複数の[realms|E]にまたがることもある公爵領階級の[clerical_title|E]です。\n\nその地域内の[bishops|E]および下位の[clergy|E]の[religious_superior|E]として、大司教は通常の[bishop|E]よりも上位に位置し、自身は[head_of_faith|E]の指示を仰ぎます。"
 game_concept_bishop: "司教"
 game_concept_bishops: "司教"
 game_concept_bishop_possessive: "司教"
 game_concept_bishops_possessive: "司教"
 game_concept_bishop_desc: "$game_concept_bishop$とは、キリスト教の[faith|E]の[clergy|E]であり、[temple_holdings|E]を保持または貸与されています。\n\n司教は[archdiocese|E]内に居住し、[religious_superior|E]であるその地の[archbishop|E]に従います。[leased|E]称号を持つ土地なしの司教は世俗の[liege|E]に仕える一方、貸与されていない[landed|E][titles|E]を保持する司教は[ecclesiastical|E][ruler|E]として統治することができます。"
 game_concept_rite_divergence: "乖離度"
 game_concept_rite_divergent: "乖離"
 game_concept_divergence: "乖離"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "乖離度とは、[rite_possessive|E]の[core_tenets|E]と[doctrines|E]が元となる[faith|E]からどれだけ乖離しているかを示すものです。[prohibited_tenet_status|E]された信条を[core_tenet_status|E]として採用している流派ほど乖離度が高くなります。\n\n乖離度が高いと、元となる宗派の[fervor|E]が低下し、[heresy|E]が発生しやすくなります。乖離度が#V 100#!に達した流派は自動的に異端とされ、新たな[faith|E]となります。"
 game_concept_spiritual_fulfillment: "霊的充足度"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$とは、ある[character|E]が自身の[faith|E]に対してどれほど心の安らぎを感じているかを示す指標です。\n\n基準値は、その人物が持つ[traits|E]と、それらが[sinful|E]、あるいは[virtuous|E]とみなされるかどうかに基づいて算出されます。\n\n$game_concept_spiritual_fulfillment$は、その人物の行動が[faith|E]の観点から適切か否かに応じて増減します。また、有害な特性を打ち消すために、[personal_tenets|E]を採用することもできます。"
 game_concept_fulfillment: "充足度"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "霊的充足度レベル"
 game_concept_spiritual_fulfillment_levels: "霊的充足度レベル"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E]の[spiritual_fulfillment|E]はしきい値によって$game_concept_spiritual_fulfillment_levels$に分けられ、レベルごとに異なる効果が適用されます。\n\nレベルが低いほど生活が困難になり、罪深い行為のコストが安くなります。レベルが高くなると献身が容易になり、新たな宗教的選択肢も利用できるようになります。"
 game_concept_personal_tenet: "個人的信条"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$とは、[ruler|E]が自身の精神性の中核として採用する[core_tenet|E]です。\n\n[faith|E]において[core_tenet_status|E]または[permitted_tenet_status|E]とされている$game_concept_personal_tenet$を採用すると[spiritual_fulfillment|E]を獲得できる一方、[prohibited_tenet_status|E]とされている信条を採用すると[secret|E]が生じます。$game_concept_personal_tenets$は追加の効果をもたらし、特別なゲームシステムがアンロックされます。\n\nキャラクターが採用できる$game_concept_personal_tenets$の数は、[piety_level|E]および[GetTrait('theologian').GetName( GetNullCharacter )][trait|E]の影響を受けます。"
 game_concept_personal_tenets: "個人的信条"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "枢機卿"
 game_concept_cardinals: "枢機卿"
 game_concept_cardinal_possessive: "枢機卿"
 game_concept_cardinals_possessive: "枢機卿"
 game_concept_cardinalate: "枢機卿職"
 game_concept_cardinalates: "枢機卿職"
 game_concept_cardinal_desc: "[the_christian_church|e]の意思の実現を進めるため、教皇によって選ばれた[clergy|e]です。[college_of_cardinals|E]の構成員は全員、教皇職の候補者であると同時に選挙人でもあり、[papabile_score|E]を保持しています。"
 game_concept_college_of_cardinals: "枢機卿団"
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$とは、教皇に助言を行い、[the_christian_church|E]の次期[head_of_faith|E]を選出する[cardinals|E]からなる機関です。\n\nすべての[cardinal|E]は、教皇職の候補者であると同時に選挙人でもあります。"
 game_concept_papabile_score: "教皇候補スコア"
 game_concept_papabile_scores: "教皇候補スコア"
 game_concept_papabile_score_desc: "[college_of_cardinals|E]の構成員は全員、自身の[traits|E]、[piety_level|E]、[rite|E]、そして他の枢機卿の[opinion|E]を反映した$game_concept_papabile_score$を保持しています。\n\n最も高い$game_concept_papabile_score$を持つ[cardinals|E]は、教皇選挙においてより多くの票を獲得する可能性が高くなります。\n\n$game_concept_papabile_score$は、[character_interaction|E]「#high $increase_papabile_score_interaction$#!」や[decision|E]「[GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]」を通じて増加させることができます。"
 game_concept_mainline_rite: "本流派"
 game_concept_mainline_rite_desc: "本[rite|E]とは、[faith|E]において最も広く受け入れられている信仰体系を表します。非本$game_concept_rite$は、この$game_concept_rite$から[rite_divergent|E]しているとみなされます。\n\nどの$game_concept_rite$が本[rite|E]となるかは、$game_concept_faith$に[head_of_faith|E]が存在するかどうかによって異なります。\n\n$game_concept_faith$に$game_concept_head_of_faith$がいる場合、その$game_concept_head_of_faith$が属する$game_concept_rite$が本$game_concept_rite$となります。そのため、[challenger_hof|E]候補など、別の$game_concept_rite$に属する人物がその地位を継いだ場合、本$game_concept_rite$も変わる可能性があります。\n\n$game_concept_head_of_faith$がいない場合、本流派と同数以上の[holy_sites|E]を保持している$game_concept_rite$が、本$game_concept_rite$よりも多くの[counties|E]で信仰されるようになると、その[rite|E]が本流派に取って代わります。"
 game_concept_mainline_rites: "本流派"
 game_concept_mainline_rite_short: "本流派"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "信条の状態"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$とは、ある[core_tenet|E]または[doctrine|E]に対する[rite_possessive|E]の立場を表します。この両方に同じ5段階の尺度が適用され、関与の度合いが低い順に以下の通りとなります。\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E]：$game_concept_rite$は、対象の$game_concept_core_tenet$または$game_concept_doctrine$を認識していない。\n$EFFECT_LIST_BULLET$[known_tenet_status|E]：$game_concept_rite$は対象を認識しているが、その実践を支持も禁止もしない。\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E]：$game_concept_rite$は、対象の実践を認めている。\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E]：$game_concept_rite$は、対象の実践を明確に禁じている。\n$EFFECT_LIST_BULLET$[core_tenet_status|E]：$game_concept_rite$は、対象の$game_concept_core_tenet$の実践を積極的に推進している。\n\n特定の$game_concept_core_tenet$または$game_concept_doctrine$に対する$game_concept_rite$の立場は、$game_concept_rite$を創設または分岐させる際にそれらを選択できるかどうかや、[followers|E]がそれらを実践した場合に霊的なペナルティを受けるかどうかを決定します。\n\n信条の状態は、[character_possessive|E]個人の認識を表す[tenet_knowledge|E]とは異なり、$game_concept_rite$の立場を表します。"
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "未知"
 game_concept_unknown_tenet_status_desc: "[tenet_status|E]が$game_concept_unknown_tenet_status$の場合、[rite|E]は対象の[core_tenet|E]または[doctrine|E]をまったく認識していません。$game_concept_rite$の[followers|E]もその存在を認識していないため、新しい$game_concept_rite$の創設時や[personal_tenet|E]として選択することはできません。"
 game_concept_known_tenet_status: "既知"
 game_concept_known_tenet_status_desc: "[tenet_status|E]が$game_concept_known_tenet_status$の場合、[rite|E]は対象の[core_tenet|E]または[doctrine|E]を認識しているものの、その実践について支持も許可もしていません。$game_concept_rite$の創設時や分岐時の選択候補となり、より高い[tenet_status|E]へ引き上げることもできます。"
 game_concept_permitted_tenet_status: "容認"
 game_concept_permit_tenet_status: "容認"
 game_concept_permitted_tenet_status_desc: "[tenet_status|E]が$game_concept_permitted_tenet_status$の場合、[rite|E]は対象の[core_tenet|E]または[doctrine|E]を積極的に推進してはいないものの、認めている状態です。$game_concept_rite$の[character|E]は、霊的なペナルティを受けることなく、$game_concept_core_tenet$を[personal_tenet|E]として採用できます。"
 game_concept_prohibited_tenet_status: "禁止"
 game_concept_prohibit_tenet_status: "禁止"
 game_concept_prohibited_tenet_status_desc: "[tenet_status|E]が$game_concept_prohibited_tenet_status$である場合、[rite|E]は対象の[core_tenet|E]または[doctrine|E]を、明示的に禁止している状態です。$game_concept_rite$の[character|E]が$game_concept_core_tenet$を[personal_tenet|E]として採用している場合、それを[secret|E]として守り、[prohibited_tenet_status|E]されている[core_tenets|E]を[core_tenet_status|E]として採用している$game_concept_rite$は、その[faith|E]から大きく[rite_divergent|E]したものになります。"
 game_concept_core_tenet_status: "中核"
 game_concept_core_tenet_status_desc: "[tenet_status|E]が$game_concept_core_tenet_status$である場合、[rite|E]は対象の[core_tenet|E]または[doctrine|E]を、[rite|E]を特徴づける実践の一つとして積極的に推進している状態です。$game_concept_rite$のすべての[followers|E]は、その効果の対象となります。"
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "宗教知識"
 game_concept_doctrine_knowledge: "教義知識"
 game_concept_rite_knowledge: "流派知識"
 game_concept_agnostic_knowledge: "知識"
 game_concept_tenet_knowledge_desc: "[character|E]は、すべての宗教的慣習の詳細を知っているわけではありません。\n\n既知の信条や教義は、[rite_divergent|E]した$game_concept_rite$の創設時に使用でき、[personal_tenets|E]として採用することもできます。$game_concept_rite$のすべての$game_concept_core_tenets$と$game_concept_doctrines$を知っていると、改宗しやすくなります。\n\n自身の[faith|E]に属するすべての[core_tenets|E]と[doctrines|E]は、既に持っている知識です。新たな知識は、[spouses|E]や[friends|E]などとの関わりや、[traveling|E]、[activities|E]、または[scheme|E]「流派の研究」によって獲得できます。"
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "安置"
 game_concept_enshrine: "安置"
 game_concept_enshrined_desc: "[holy_site|E]に安置された[holy_relic|E]は、その聖地のボーナスを有効化し、聖地がもたらすボーナスを強化します。ボーナスの効果は、安置されているすべての宝物の[rarity|E]レベルの合計値に応じて決まります。\n\n安置された宝物は、所有者はいなくなりますが、聖地の[holder|E]、[top_liege|E]、または[clerical_region|E]の所有者は引き続き利用できます。また、安置された宝物は劣化しなくなります。安置できるのは、自身の[faith|E]に一致する聖遺物に限られ、他の宗派の聖遺物を安置しても恩恵は得られません。\n\n宝物の安置や、安置された宝物の撤去には、報酬や費用が発生する場合があります。"
 game_concept_holy_relic: "聖遺物"
 game_concept_holy_relics: "聖遺物"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$とは、[faith|E]にとって宗教的な重要性を持つ[artifact|E]です。$game_concept_holy_relic$はその宗派の[holy_site|E]に[enshrined|E]することで、恩恵を得ることができます。\n\n宝物の中には特定の宗派においてもともと神聖なものもありますが、宝物を[sanctified|E]して聖遺物にすることもできます。"
 game_concept_sanctified: "聖別"
 game_concept_sanctify: "聖別"
 game_concept_sanctifying: "聖別"
 game_concept_sanctified_desc: "[artifact|E]を聖別すると、[faith|E]の[holy_relic|E]となります。宝物は複数の宗派に対して聖別することができます。"
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "聖界所領"
 game_concept_ecclesiastical_estates: "聖界所領"
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$、または$game_concept_cathedral_complex$とは、[clerical_title|E]に付属する[domicile|E]の一種で、[archbishop|E]とその司教座が直接所有する所領を指します。[GetGovernment('ecclesiastical_government').GetName]の下位の[clergy|E]は、そのような[title|E]に昇格して初めて教会所領を与えられます。\n\nここに[ecclesiastical_estate_buildings|E]を建設すると、所有者の富を増やし、[piety|E]と[spiritual_fulfillment|E]を高められます。$game_concept_ecclesiastical_estate$の所在地は変わらず、その称号の次の[holder|E]に引き継がれます。"
 game_concept_ecclesiastical_estate_building: "聖界所領の建造物"
 game_concept_ecclesiastical_estate_buildings: "聖界所領の建造物"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$は、[ecclesiastical_estate|E]を改良するための固有かつ永続的な建造物です。\n\n建設できる建造物は多種多様で、所有者はこれらを建設することで私的な収入や[piety|E]、[spiritual_fulfillment|E]を獲得できるほか、多くの[decisions|E]や[interactions|E]などを利用できるようになります。"
 game_concept_cathedral_complex: "大聖堂複合施設"
 game_concept_cathedral_complexes: "大聖堂複合施設"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "$game_concept_cathedral_complex$の建造物"
 game_concept_cathedral_complex_buildings: "$game_concept_cathedral_complex$の建造物"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "列聖"
 game_concept_canonized_desc: "死後に聖人、またはワリや尊敬される先祖など、他の宗派における同等の存在と認定され、[GetTrait('saint').GetName( GetNullCharacter )][trait|E]を得た[character|E]です。\n\n徳のある生涯を送った人物は、死後$game_concept_canonization$されることがあります。列聖は[decision|E]によって請願され、[head_of_faith|E]の祝福が必要となる場合があり、聖人の埋葬地を聖別することで確定します。その後、その埋葬地には敬虔な旅人が訪れるようになり、聖遺骸から[holy_relics|E]が得られることもあります。"
 game_concept_canonization: "列聖"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "聖人"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "関連する[ecclesiastical|E]または[theocratic|E]の[ruler|E]の承認を得ることで、[unpressed_claim|E]を[pressed_claim|E]へ強化する[interaction|E]です。"
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "他の[ruler|E]が保有する[title|E]への[claim|E]を獲得する[interaction|E]です。関連する[ecclesiastical|E]または[theocratic|E]の[character|E]の承認が必要です。"
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "[title|E]または[vassal|E]を別の[ruler|E]へ平和的に移譲する[interaction|E]です。これには対象の[ruler|E]と仲介者の承認が必要となります。\n\n対象の[ruler|E]が移譲の要求を拒否した場合、その[ruler|E]は通常、[piety|E]と[legitimacy|E]を失うほか、移譲を要求した[ruler|E]が説得のために選択した追加コストも負うことになります。\n\n仲介者となる関連する[ecclesiastical|E]または[theocratic|E]の[ruler|E]は、この[interaction|E]自体を禁じることができ、また[GetLaw('church_authority_3').GetName]の[law|E]の下では、受諾を強制することもできます。"
 game_concept_challenger_hof: "対立宗教指導者"
 game_concept_antipope: "対立教皇"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$とは、[mainline_rite|E]の$game_concept_head_of_faith$に対抗して擁立された[head_of_faith|E]です。\n\n[ruler|E]は[clergy|E]を$game_concept_challenger_hof$として擁立できます。[clergy|E]である[ruler|E]や、世俗的な宗教指導者を持つ[faith|E]に属する統治者は、代わりに自らを対立宗教指導者として宣言することもできます。\n\n擁立された$game_concept_challenger_hof$は、擁立者の[rite|E]を採用し、擁立者の[external_clerical_puppet|E]となって、[weak_hook|E]を負います。\n\n$game_concept_mainline_rite$の$game_concept_head_of_faith$は、$game_concept_challenger_hof$に従う者、すなわち擁立者とその[vassals|E]を[excommunicate|E]できません。\n\n$game_concept_challenger_hof$に従う者は、聖職者への請願を$game_concept_mainline_rite$の$game_concept_head_of_faith$ではなく、$game_concept_challenger_hof$に行います。こうした[interactions|E]には以下が含まれます。\n$EFFECT_LIST_BULLET$「[petition_antipope_indulgences_interaction|E]」\n$EFFECT_LIST_BULLET$「[petition_antipope_gold_interaction|E]」\n\n$game_concept_challenger_hof$やその擁立者は、[casus_belli|E]「[pam_challenge_hof_cb|E]」を正統な$game_concept_head_of_faith$に対して使用できます。\n\n同じ[faith|E]の対抗する[kings|E]またはそれ以上の地位にある者は、代わりに擁立者に対して「[pam_antiking_cb|E]」を使用し、対立する請求者を廃位することができます。"
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "宗教指導者に挑戦"
 game_concept_pam_challenge_hof_cb_desc: "[challenger_hof|E]またはその擁立者が、自らの[faith|E]の正統な[head_of_faith|E]に対して使用する[casus_belli|E]です。勝利すると、$game_concept_challenger_hof$が$game_concept_head_of_faith$として就任し、その[rite|E]が[mainline_rite|E]となります。擁立者が戦争に勝利し、$game_concept_challenger_hof$よりも地位が高い場合、[challenger_hof|E]はその[vassal|E]となります。"
 game_concept_pam_antiking_cb: "対立教皇を廃位"
 game_concept_pam_antiking_cb_desc: "[challenger_hof|E]を擁立しておらず、自らが[challenger_hof|E]でもない[christian|E]の[kings|E]以上の地位にある者が利用できる[casus_belli|E]です。同じ[faith|E]に属する[independent|E]した擁立者に対して行使され、相手の$game_concept_challenger_hof$を廃位し、正統な[head_of_faith|E]からの感謝を得ます。"
 game_concept_petition_antipope_indulgences_interaction: "対立教皇の免罪を求める"
 game_concept_petition_antipope_indulgences_interaction_desc: "[challenger_hof|E]に従う者なら誰でも使用できる[interaction|E]です。[mainline_rite|E]の[head_of_faith|E]を介さずに、$game_concept_antipope$に[gold|E]を支払って免罪と[piety|E]を得ます。擁立者による請願は無条件で受け入れられます。"
 game_concept_petition_antipope_gold_interaction: "対立教皇に金を請願する"
 game_concept_petition_antipope_gold_interaction_desc: "[challenger_hof|E]に従う者なら誰でも使用できる[interaction|E]です。$game_concept_antipope$に[gold|E]を求めます。擁立者による請願は無条件で受け入れられます。"
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "高位聖職者や強力な統治者が使用できる[decision|E]です。[the_christian_church|E]を自らが選択した局面へと進めます。"
 game_concept_tenet_popularity: "信条の普及度"
 game_concept_tenet_popularity_desc: "[faith|E]内で[personal_tenets|E]が広まるにつれ、その実践も一般的になっていきます。$game_concept_tenet_popularity$は、[core_tenet|E]がどれほど広く普及しているかを示す指標であり、[ecumenical_council|E]での議題や[papal_bull|E]の対象として採用される可能性に影響します。\n\n$game_concept_tenet_popularity$が高いほど、[ecumenical_council|E]で議論された際に[clergy|E]からの支持を得やすくなります。$game_concept_tenet_popularity$が#high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!に達すると、[head_of_faith|E]は自らの信念にかかわらず、その信条の[permitted_tenet_status|E]を宣言する可能性が非常に高くなります。"
 game_concept_ecumenical_council_innovator: "革新派"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "革新派"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "革新派は、[activity|E]「[ecumenical_council|E]」における[activity_guests_short|E]であり、[core_tenet|E]や[doctrine|E]に対する立場の変更を提案する[activity_host_short|E]に賛成票を投じます。\n\n彼らは、現状維持を求めて変更に反対票を投じる[ec_conservatives|E]と真っ向から対立しています。$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help 投票権を持つ[characters|E]：[clergy|E]、[clerical_puppet|E]を擁する[rulers|E]、および[activity_host|E]#!"
 game_concept_ecumenical_council_conservative: "保守派"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "保守派"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "保守派は、[activity|E]「[ecumenical_council|E]」における[activity_guests_short|E]であり、[core_tenet|E]や[doctrine|E]に対する立場の変更を提案する[activity_host_short|E]に対して反対票を投じます。\n\n彼らは変更の実現をめざす[ec_innovators|E]と真っ向から対立しています。$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[ecclesiastical|E]の[rulers|E]が、自身の[clerical_region|E]を隣接する[duchy|E]の[de_jure|E][counties|E]へと拡大するために使用する[interaction|E]です。\n\nこれは[head_of_faith|E]の承認がある場合にのみ可能です。"
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[ecclesiastical|E]の[rulers|E]が、同じ[faith|E]の世俗[rulers|E]に対して、敵対的な宗派の[rulers|E]に対する[holy_war|E]を宣言させるために使用できる[interaction|E]です。"
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[ecclesiastical|E][rulers|E]が、同じ[faith|E]の世俗[rulers|E]に対して、他の世俗[rulers|E]に対して[claim|E][war|E]を宣言させるために使用できる[interaction|E]です。"
 game_concept_treasury_cardinal_budget: "枢機卿予算"
 game_concept_treasury_cardinal_budget_short: "枢機卿"
 game_concept_treasury_cardinal_budget_benefices: "枢機卿の聖職禄"
 game_concept_treasury_cardinal_budget_desc: "中央教会の財源から[cardinals|E]に割り当てられる予算です。枢機卿に与えられる直接的および間接的な[Glossary( '聖職禄', 'CARDINAL_BENEFICES_GLOSS' )]を指します。"
 CARDINAL_BENEFICES_GLOSS: "聖職禄とは、聖職者に#i イン・コメンダム（信託）#!として授与されることのあった、近隣もしくは遠隔地の財産や役職、教皇庁の共有収入などを指す。それらは通常、直接的な管理責任を伴わずに収入を生み出した。"
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[clerical|E]の権威者が、[spiritual_fulfillment|E]による慰めと引き換えに、[hook|E]を得る[interaction|E]です。"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "他の[character|E]に貞潔の誓いを立てさせ、長期的な[fertility|E]のペナルティを負わせる[interaction|E]です。"
 game_concept_military_holy_order: "騎士修道会"
 game_concept_military_holy_orders: "騎士修道会"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "騎士修道会"
 game_concept_military_holy_orders_possessive: "騎士修道会"
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$とは、自らが属する[faith|E]の所領を守り、拡大することを誓った戦士で構成される[holy_order|E]の一種です。\n\n騎士修道会と同じ宗派を信仰する統治者は、[faith_hostile|L]している、または[faith_evil|L]であるとみなしている$game_concept_faith$との[war|E]中に、[piety|E]を支払うことで騎士修道会を雇用することができます。その戦争が終結すると、騎士修道会はその統治者のために戦わなくなります。\n\n$game_concept_holy_order$には[military_holy_order_patron|E]がいる場合があり、その後援者は騎士修道会を雇用する際に費用を必要としません。"
 game_concept_military_holy_order_patron: "騎士修道会の後援者"
 game_concept_military_holy_order_patronage: "騎士修道会の後援"
 game_concept_military_holy_order_patronize: "後援"
 game_concept_military_holy_order_patron_desc: "$game_concept_holy_order_patron$とは、[military_holy_order|E]と同じ[faith|E]を信仰し、その首都が[realm|E]内にある[duke|E][title_tier|E]以上の[ruler|E]です。\n\n$game_concept_holy_order_patron$は、宗教的に対立する敵との戦いにおいて、[piety|E]を支払うことなく$game_concept_holy_order$の助力を得ることができます。\n\n騎士修道会の首都の支配権を他者に譲った場合、後援者の地位は[duke|E][title_tier|E]以上の[vassals|E]に移ることがあります。"
