l_japanese:
 pam_clergy_events.0001.t: "Quo Nomine Vis Vocari?"
 pam_clergy_events.0001.desc: "私の[chaplain.GetCouncilTitle|l]、[chaplain.GetFirstName]が、聖ペトロの後継者たちが名を連ねる名簿の次なる空欄へと目を向ける。それは[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )]の生きた証である。\n\n#emp 「あなたがお選びになる名は、あなたの治世を超え、千世代後まで語り継がれるでしょう」#!\n\n[chaplain.GetHerHis|U]はそう言うと、羽根ペンでインクを落とすべき場所を示した。\n\nそして、#emp 「Quo nomine vis vocari?」#! ——いかなる名で呼ばれることを望むか、と問いかけた。"
 pam_clergy_events.0001.a: "我が名を永遠に知らしめよ。"
 pam_clergy_events.0003.t: "信条の再編成"
 pam_clergy_events.0003.desc: "[pam_recast_rite.GetNameNoTooltip]の中核をなす信条が[pam_recast_pope.GetTitledFirstName]の下で変わった：[tenet_to_remove.GetBaseName]が[tenet_to_add.GetBaseName]に取って代わった。"
 pam_clergy_events.0010.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U]の意志"
 pam_clergy_events.0010.desc.intro: "[cardinalate.GetHolder.GetTitleAsNameNoTooltip]である私は、聖なる[actor.Custom('GetMotherFatherPossessive')|U]の御心の体現者である。\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "私が誰よりも敬愛する我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]は、[cardinalate.GetHolder.GetTitleAsNameNoTooltip]としての務めを果たす上で私を導いてくれる。\n\n"
 pam_clergy_events.0010.desc: "[actor.GetTitledFirstName]はその限りなき英知をもって、私が進むべき道を示した。"
 pam_clergy_events.0010.desc.develop: "[archdiocese.GetName]のすべての[recipient.GetFaith.GetAdherentNamePlural]の繁栄のため、公共事業の発展に尽力するのだ。"
 pam_clergy_events.0010.desc.convert_faith: "[archdiocese.GetName]およびその周辺における[ROOT.Char.Custom('GetUnbelieverNamePlural')]の改宗を推し進める使命を果たすのだ。"
 pam_clergy_events.0010.desc.increase_control: "[archdiocese.GetName]の民衆を鎮める使命を果たすのだ。"
 pam_clergy_events.0010.desc.cultural_fascination: "[actor.GetHerHis]と同じ[actor.GetCulture.GetCollectiveNoun]のため、新技術の研究を加速させる使命を果たすのだ。"
 pam_clergy_events.0010.desc.epidemic_resistance: "[archdiocese.GetName]の疫病対策を支援するため、教会の資源を結集するのだ。"
 pam_clergy_events.0010.desc.improve_legitimacy: "[archdiocese.GetName]における[recipient.GetFaith.GetAdjective]の君主たちの正統性を高める使命を果たすのだ。"
 pam_clergy_events.0010.desc.undermine_legitimacy: "[archdiocese.GetName]における[recipient.GetFaith.GetAdjective]の君主たちの正統性を揺るがす使命を果たすのだ。"
 pam_clergy_events.0010.a: "「必ずや成し遂げます、[actor.Custom('FormOfAddressForLiege')]！」"
 pam_clergy_events.0010.b: "十分の一税には、もっと有効な使い道がある…"
 pam_clergy_events.0030.t: "Habemus Papam"
 pam_clergy_events.0030.t.female: "Habemus Mamam"
 pam_clergy_events.0030.desc: "白煙が、[new_pope.GetCurrentLocation.GetName]の中心で新しい[new_pope.GetTitledFirstName]の誕生を告げている。\n\n「私たちがその力と権威を信頼する聖使徒ペトロとパウロが、主の御前で私たちのために執り成してくださいますように。そして全能の神、父と子と聖霊の祝福が、あなたの上に降り、永遠にあなたと共にありますように」\n\n「アーメン」"
 pam_clergy_events.0030.a: "聖ペトロの玉座に栄光あれ！"
 pam_clergy_events.0030.b: "偽預言者が現れたようだ。"
 pam_clergy_events.0030.b.tt: "[decision|E]「[GetDecisionWithKey('declare_antipope_decision').GetName]」のコストが#V 15年間#!安くなる"
 pam_clergy_events.0030.aa: "教会のことなど、知ったことか。"
 pam_clergy_events.0030.aa.tt: "今後の「Habemus Papam」のイベントはメッセージとして表示される"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName]が[head_of_faith|E]に選出された。"
 pam_clergy_events.0040.opening: "敬虔なる[head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]へ。"
 pam_clergy_events.0040.desc: "枢機卿団の人数が減ったため、貴君を枢機卿職に昇格させることとした。この難局において、貴君の敬虔さと知恵が教会を支えることを願う。"
 pam_clergy_events.0040.appoint_tt: "あなたが[cardinal|E]に任命される"
 pam_clergy_events.0040.a: "聖なる重責を引き受けよう。"
 pam_clergy_events.0041.opening: "聖ペトロの座へ。"
 pam_clergy_events.0041.desc: "枢機卿団は定員を満たしておらず、最も敬虔なる枢機卿が残した席も、いまだ埋められていない。\n\n教会を無防備なままにはしておけない！私自らが赤い帽子を戴こう。"
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U]が自ら[cardinal|E]を名乗る"
 pam_clergy_events.0041.a: "この不遜な振る舞いを忘れはしない。"
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "枢機卿団の席に空きが生じ、正式な手続きを踏んでいる余裕が教会にはございませんでした。我らのうち最も敬虔な者幾名かがそろって赤帽を戴き、枢機卿団はふたたび完全なものとなりました。\n\nこのように急ぎの対応を取ったことを、どうかお許しください。"
 pam_clergy_events.0042.a: "枢機卿団に空きがあるより、揃っているほうが都合がいい。"
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "信仰を揺るがす激震"
 pam_clergy_events.0051.desc: "[county.GetNameNoTier|U]における私の立場が揺らいでいる。生涯を捧げて仕えてきた民が、今や[new_faith.GetAdherentNamePlural]として祈りを捧げているのだ。\n\n私も改宗して、支配権を守るべきだろうか？そうすれば[title.GetName]の人々をこの先も導けるが、もはや[old_faith.GetAdherentNamePlural]でなくなった者たちを真に助けることなどできるだろうか？[new_faith.GetNameNoTooltip]の信仰をすべての者に強いたところで、良いことなど起ころうか！？"
 pam_clergy_events.0051.a: "信徒のためなら、何でもしよう。"
 pam_clergy_events.0051.a.keep_see_tt: "あなたは[title.GetName]の支配を維持する"
 pam_clergy_events.0051.b: "同胞たる[old_faith.GetAdherentNamePluralNoTooltip]にしか仕えられない。"
 pam_clergy_events.0051.b.tt: "あなたの[landed|E]の[titles|E]がすべて廃止される"
 pam_clergy_events.0051.c: "この職を退く時が来たのだ。"
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER あなたは[adventurer|E]の[camp|E]を設立する#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER [game_over|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "[title.GetNameNoTooltip]の終わり"
 pam_clergy_events.0052.desc: "どんな経緯があったにせよ、もはや私には[title.GetDefinitiveName]を正当に導くことはできない。教会が私に託したものが今、我が手から離れていく。"
 pam_clergy_events.0052.a: "仕方あるまい。"
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "聖ペトロの座に就きし[new_prelate.GetDynasty.GetNameNoTooltip]家の一員"
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetDynasty.GetNameNoTooltip]家の一員たる[new_prelate.GetFaith.ReligiousHeadName|U]"
 pam_clergy_events.0060.t.antipope: "[new_prelate.GetDynasty.GetNameNoTooltip]家の一員が[new_prelate.GetFaith.ReligiousHeadTitleName|U]を宣言"
 pam_clergy_events.0060.t.archbishop: "司教杖を執る[new_prelate.GetDynasty.GetNameNoTooltip]家の一員"
 pam_clergy_events.0060.desc.intro: "玉座からであれ説教壇からであれ、我々はキリスト教世界を導こうとしてきた。今や[new_prelate.GetFaith.HighGodName|U]は、[new_prelate.GetDynasty.GetName]一族を新たな高みへ引き上げるべきだと判断された。\n\n"
 pam_clergy_events.0060.desc.pope: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))]、[new_prelate.GetFirstName]が、地上における[new_prelate.GetFaith.HighGodNamePossessive]の代理者たる聖ペトロの御座に引き上げられた。"
 pam_clergy_events.0060.desc.head_of_faith: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))]、[new_prelate.GetFirstName]は[prelate_title.GetDefinitiveName]の保持者である。"
 pam_clergy_events.0060.desc.hof_outro: "王も皇帝も、聖なる[new_prelate.Custom('GetMotherFatherPossessive')|U]の御意志の影にあっては、ただの子供に過ぎない。今や[new_prelate.GetFaith.BishopMalePlural]の一団は、[new_prelate.GetDynasty.GetNameNoTooltip]家の者の指揮下にある。"
 pam_clergy_events.0060.desc.antipope: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))]、[new_prelate.GetFirstName]が[new_prelate.GetFaith.ReligiousHeadName|U]として宣言された。その座には、別の者が就いているにもかかわらずだ。すべての[new_prelate.GetFaith.GetAdherentName]は今や、どちらが[new_prelate.GetFaith.HighGodName|U]の代理者たるかを選ばねばならない。この件が決着するまで、我らの魂は危機にさらされる。"
 pam_clergy_events.0060.desc.archbishop: "我が[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))]、[new_prelate.GetFirstName]が[prelate_title.GetDefinitiveName]に叙任された。十分の一税も修道院も、[new_prelate.GetHerHim]の下に配された[new_prelate.GetFaith.BishopNeuter]たちの聖別も、今や[new_prelate.GetDynasty.GetNameNoTooltip]家の者によって導かれる。"
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.GetHerHis|U]は[ROOT.Char.GetFaith.GetNameNoTooltip]ではなく[new_prelate.GetFaith.GetNameNoTooltip]を信仰しているが、我々が同じ一族であることには変わりない。"
 pam_clergy_events.0060.a: "教会と[new_prelate.GetDynasty.GetNameNoTooltip]、双方にとっての祝福だ。"
 pam_clergy_events.0060.a.antipope: "争いごとまで受け継ぐつもりはない。"
 pam_clergy_events.0060.b: "[prelate_title.GetDefinitiveNameNoTooltip]の行く先をもっと間近で見届けるとしよう。"
 pam_clergy_events.0060.b.antipope: "この危機を解決できるのは私だけだ。"
 pam_clergy_events.0060.b.tt: "@warning_icon! 現在のキャラクターを放棄します。後からこのキャラクターでプレイを再開することはできません。\n\n#TUT [new_prelate.GetShortUINameNoTooltip]の死後は、[player_heir|E]としてプレイすることになります。[player_heir|E]はこの[ecclesiastical|E]の職を[dynasty|E]による継承ではなく、[appointment|E]または選挙により継承します。#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U]はあなたと同じ宗派ではない。この先は[new_prelate.GetFaith.GetAdherentName]としてプレイすることになる。"
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U]は選挙を経ず、対抗者としてこの座に就いている。その主張を認めない者たちが、その座を奪いにやってくるだろう。"
