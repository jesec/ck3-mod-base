l_japanese:
 pam_generic_events.0001.t: "信仰の学徒"
 pam_generic_events.0001.desc: "私が[ROOT.Char.GetFaith.HouseOfWorship]に入ると、我が[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]、[chaplain.GetFirstName]は講義に没頭しているようだった。\n\n「ああ、[ROOT.Char.Custom('FormOfAddressForLiege')]」ようやく[chaplain.GetSheHe]は私に気づいたようだ。「[ROOT.Char.GetFaith.HighGodName]の御言葉への関心が高まっておられるのですか？私が教えて差し上げましょう」"
 pam_generic_events.0001.a: "学ぶ価値はある。"
 pam_generic_events.0001.b: "統治だけで手一杯だ。"
 pam_generic_events.0002.t: "善良な人間"
 pam_generic_events.0002.desc.intro: "[ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )]の[doubting_child.GetFirstName]が、蝋燭の火を消す時間をとうに過ぎた頃、私の部屋に忍び込んできた。[doubting_child.GetHerHis]の頬には涙が伝っている。\n\n「私は善良な人間なのかな？」と[doubting_child.GetSheHe]が囁く。「私という存在そのものが罪なら…"
 pam_generic_events.0002.desc.sin: "#EMP おぞましいほど#![sinful_trait.GetName( ROOT.Char )|l]なのに…"
 pam_generic_events.0002.desc.sp: "こんなに魂が空っぽなのに…"
 pam_generic_events.0002.desc.outro: "[ROOT.Char.GetFaith.HighGodName]が私を望んでくださるわけがない」"
 pam_generic_events.0002.a: "恥じているものを捨てなさい。"
 pam_generic_events.0002.b: "お前はもう愛されている。"
 pam_generic_events.0002.c: "では、祈ろう。"
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U]は自分が善良な人間かどうか不安を感じていた[TARGET_CHARACTER.GetShortUIName]を慰めた。"
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は自分が善良な人間かどうか不安を感じていた[CHARACTER.GetShortUIName]を慰めた。"
 pam_generic_events.0003.t: "あなたという人間"
 pam_generic_events.0003.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )]の[worried_spouse.GetFirstName]が日暮れ後、生け垣のそばで私を待っていた。膝の上で両手を落ち着きなく動かしている。\n\n「あなたは本当に#EMP [sinful_trait.GetName( ROOT.Char )|l]#!だ」と[worried_spouse.GetSheHe]が低い声で言う。「[ROOT.Char.GetFaith.HighGodName]の前では、私たち2人の恥になる。どうして自分の信仰にそこまで無頓着でいられる？これがあなたをどれほど蝕んでいるのか、分からないのか？」"
 pam_generic_events.0003.a: "あなたのためなら、償おう。"
 pam_generic_events.0003.b: "[ROOT.Char.GetFaith.HighGodName]が私をこうお造りになったのだ。"
 pam_generic_events.0003.c: "あなたは心配しすぎだ。"
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U]は[TARGET_CHARACTER.GetShortUIName]に、自らの生き方を改め、巡礼に行くと約束した。"
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は[CHARACTER.GetShortUIName]に、自らの生き方を改め、巡礼に行くと約束した。"
 rival_embraced_sinful_ways: "[TARGET_CHARACTER.GetShortUIName]が[CHARACTER.GetShortUIName|U]に変わるよう懇願したとき、[CHARACTER.GetHerHim]は悔い改めることを拒んだ。"
 rival_embraced_sinful_ways_corresponding: "[CHARACTER.GetShortUIName]が[TARGET_CHARACTER.GetShortUIName|U]に変わるよう懇願したとき、[TARGET_CHARACTER.GetHerHim]は悔い改めることを拒んだ。"
 pam_generic_events.0004.t: "闇の中の光"
 pam_generic_events.0004.desc: "[ROOT.Char.GetFaith.HouseOfWorship]には誰もいない。霧が柱の間で渦巻き、[deceased.GetDeathReasonHideKiller]私の[ROOT.Char.Custom2( 'RelationToMeShort', deceased )]、[deceased.GetFirstName]の記憶を囲むように、蝋燭の火が揺らめいている。\n\n[ROOT.Char.Custom2( 'RelationToMeShort', comforter )]の[comforter.GetFirstName]が、袖が触れるほど近くに座っている。「悲しみは道だ」と[comforter.GetSheHe]が静かに言った。「その道を歩めば、行き着いた先には[ROOT.Char.GetFaith.PositiveAfterLife]が待っているかもしれない」"
 pam_generic_events.0004.a: "私だ！#EMP 私が#!やった！"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP 父の家には住む所がたくさんある。#!"
 JOHN_14_2_GLOSS: "#weak ヨハネ14章2節（新改訂標準訳聖書・更新版）#!"
 pam_generic_events.0004.c: "では、祈ろう。"
 pam_generic_events.0004.d: "来なさい。あの人を偲んで杯を捧げよう。"
 pam_generic_events.0005.t: "忠実なる拳"
 pam_generic_events.0005.desc: "「#EMP よくも#!！」\n\n私の[ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )]の[loyal_vassal.GetTitledFirstName]が、抜きかけた剣を手に、評議室へ乗り込んできた。\n\n「[clerical_holder.GetTitledFirstName]があなたを追放するなど、なんたる暴挙！」と[loyal_vassal.GetSheHe|U]が地面に唾を吐く。「私には[clerical_region.GetName]に兵がいる。命じてくれれば、[clerical_holder.GetHerHim]のもとへ乗り込んでやろう」"
 pam_generic_events.0005.a: "いいだろう、行ってくれ。"
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName]が[clerical_holder.GetCapitalLocation.GetName]へ向かう。[loyal_vassal.GetHerHis]が戻ると、あなたは[dread|E]と[GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName][vassal|E]の[opinion|E]を得る。"
 pam_generic_events.0005.b: "もっと巧いやり方がある。"
 pam_generic_events.0005.b.tt: "#V 15年間#!、[clerical_holder.GetShortUIName]を標的とする[GetScheme('murder').GetTypeName][schemes|E]に#P 特大#!ボーナスを得る"
 pam_generic_events.0005.c: "私は右の頬を打たれたら、左の頬を向けるよう教えられてきた。"
 pam_generic_events.0005.c.tt: "#V 10年間#!、[character_interaction|E]「#V $declaration_of_repentance_interaction$#!」の受諾率が#P +20#!上昇する"
 pam_generic_events.0005.c.tt2: "今後#V 10年間#!、[character_interaction|E]「#V $lift_excommunication_interaction$#!」があなたに対して使われる可能性が高くなる"
 pam_turned_the_other_cheek_accept_reason: "左の頬を向けた"
 PAM_GENERIC_0005_MURDER_BONUS: "忠実な封臣がこの標的の直轄領に兵を持っている：$VALUE|+0=$"
 pam_generic_events.0007.opening: "[ROOT.Char.GetTitledFirstName]へ"
 pam_generic_events.0007.desc: "仕事は終わった。私は[clerical_holder.GetTitledFirstName]を見つけ、[clerical_holder.GetHerHim]を血まみれにしてきた。"
 pam_generic_events.0007.a: "結構。"
 pam_generic_events.0008.t: "闇の中の声"
 pam_generic_events.0008.desc: "夕食がまだ腹に重く残る中、私はふらつきながら寝室に向かった。視界がぼやけ、足元で廊下が傾いているような気がする。\n\nすると…声が聞こえた。「なんと[virtuous_trait.GetName( ROOT.Char )|l]なる[ROOT.Char.GetTitleAsNameNoTooltip|l]だ…」とその声が言う。「なんと徳高いことか。そなたは主を喜ばせている」\n\nこれは本当に[ROOT.Char.GetFaith.HighGodName]なのか？それとも、ただ私の体調が悪いだけなのか？"
 pam_generic_events.0008.a: "そうだ。#EMP そうだとも！！#!"
 pam_generic_events.0008.b: "主に違いない！"
 pam_generic_events.0008.c: "古き力が目覚めつつある…"
 pam_generic_events.0008.d: "食べ物がこういう作用を及ぼすこともある。"
 pam_generic_events.0008.e: "もしかすると…食べた物のせいかもしれない。"
 pam_generic_events.0008.f: "念のため祈っておこう。"
 pam_generic_events.0009.t: "地獄の業火"
 pam_generic_events.0009.desc: "目が覚めると全身汗まみれで、心臓が肋骨を激しく打っていた。\n\n夢の中で、私は焼かれていた。肉はバターのように骨から剥がれ落ちた。「[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]！[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]！」と、悪魔の群れが私に向かって叫んでいた。\n\n[ROOT.Char.GetFaith.NegativeAfterLife]の業火が私を呑み込み、聞こえてくる絶叫は私自身のものだった。"
 pam_generic_events.0009.a: "苦難が道を示す。"
 pam_generic_events.0009.b: "肉は肉の報いを受けねばならない。"
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP 罪人よ、手を清め、心を清めなさい。#!"
 JAMES_4_8_GLOSS: "#weak ヤコブ4章8節（新改訂標準訳聖書・更新版）#!"
 pam_generic_events.0009.d: "[comforting_courtier.GetTitledFirstName]と話すと、いつも気が楽になる。"
 pam_generic_events.0009.e: "夢はただの夢だ。"
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U]は、永遠の罰を受ける悪夢を見た後、[TARGET_CHARACTER.GetShortUIName]に慰めを求めた。"
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は、永遠の罰を受ける悪夢を見た後、[CHARACTER.GetShortUIName]に慰めを求めた。"
 pam_generic_events.0010.t: "祝福された狩り"
 pam_generic_events.0010.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]が周囲に広がっている。やがて何十頭もの馬が駆ける轟音が響き、[hunting_ruler.GetName]が誇らしげに一団を率いてやってくる。\n\n「#EMP 止まれ！#!」[hunting_ruler.GetSheHe|U]が手を上げて挨拶し、従者たちを止める。「この天候を[ROOT.Char.GetFaith.HighGodName]に感謝せよ！」と[hunting_ruler.GetSheHe|U]が叫ぶ。「そして、我々が狩る獲物のことも！」"
 pam_generic_events.0010.a: "聞く気があるなら一つ助言しよう…"
 pam_generic_events.0010.b: "あなたの目は槍のように鋭い。"
 pam_generic_events.0010.b.success: "あなたの賞賛が好意的に伝わる"
 pam_generic_events.0010.b.failure: "あなたの賞賛が響かない"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetSheHe|U]があなたの賞賛を心に留める"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetSheHe|U]が中身のないお世辞に腹を立てる"
 pam_generic_events.0010.b.tt: "今後#V 10年間#!、[hunting_ruler.GetTitledFirstName]が[character_interaction|E]「#high $negotiate_alliance_interaction$#!」を受け入れる可能性が高くなる"
 pam_generic_events.0010.c: "誉れあれ！"
 pam_generic_events.0010.d: "道中のために、騎手を何人か貸してくれ。"
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U]は[TARGET_CHARACTER.GetShortUINamePossessive]の狩りの腕前を称賛した。"
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]は[CHARACTER.GetShortUINamePossessive]の狩りの腕前を称賛した。"
 pam_praised_hunting_alliance_accept_reason: "私の狩りを称賛した"
 pam_generic_events.0011.t: "小さな罪"
 pam_generic_events.0011.desc: "[sinful_courtier.GetTitledFirstNamePossessive]の罪深い行いは、あまりにも長く続いている。宮廷では[sinful_courtier.GetHerHis]の[sinful_trait.GetName( ROOT.Char )|l]な振る舞いの噂が飛び交い、[sinful_courtier.GetSheHe]が通るたびに使用人たちが避けていくのを私は目にしている。\n\n書斎に入ると、「[ROOT.Char.Custom('FormOfAddressForLiege')|U]！」と[sinful_courtier.GetSheHe|U]が声を上げ、[sinful_courtier.Custom('quirk_neg_pp')]。「あなたのお側にいられるとは、なんという光栄でしょう」"
 pam_generic_events.0011.a: "その[sinful_trait.GetNameNoTooltip( ROOT.Char )|l]な生き方を改めなさい。"
 pam_generic_events.0011.b: "[ROOT.Char.GetFaith.HighGodName]の教えに耳を傾けなさい。"
 pam_generic_events.0011.b.success: "教えが心に届く"
 pam_generic_events.0011.b.failure: "教えが心に届かない"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetSheHe|U]が罪の重さを理解する"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetSheHe|U]があなたの説教を聞き流す"
 pam_generic_events.0011.c: "これはあなたのためにならない…"
 pam_generic_events.0011.c.success: "穏やかな助言で相手の態度が和らぐ"
 pam_generic_events.0011.c.failure: "あなたの優しさは軽蔑を買うだけだ"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetSheHe|U]はあなたの気遣いに心を動かされる"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetSheHe|U]はあなたの優しさを弱さと見なす"
 pam_generic_events.0011.d: "大したことではないのかもしれない。"
