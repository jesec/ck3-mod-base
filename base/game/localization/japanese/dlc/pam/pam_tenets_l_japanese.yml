 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "モルティフィカツィオ・カルニス" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "ネクローシス・テース・サルコス" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "肉体の苦行"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "主よ、私たちが肉体をその情念と欲望とともに十字架にかけることができるよう、恵みを与えてください。聖なる苦しみを通してキリストの受難にあずかり、肉の行いを断ち切ることで、真に生きることができますように。\n\n$pam_galatians_5_24_latin$\n\n[Glossary('モルティフィカティオ・カルニスの歴史的背景','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "断食、徹夜の祈り、そして肉体の苦行を通して、神の僕たちは肉を抑え込み、服従させる。そうすることで、霊は天へと昇っていくことができるのだ。\n\n$pam_galatians_5_24_greek$\n\n[Glossary('ネクローシス・テース・サルコスの歴史的背景','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "信徒は肉体とその罪深い欲望を苦行によって抑え、キリストの受難にあずかることで、魂を清め、霊的な完成へと至る。\n\n$pam_galatians_5_24_default$\n\n[Glossary('肉体の苦行の歴史的背景','tenet_mortification_of_the_flesh_historical_desc')]"
