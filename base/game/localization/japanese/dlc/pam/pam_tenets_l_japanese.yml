 tenet_original_sin_default_name: "原罪"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "すべての人は、アダムの背信によって無垢を失った。その結果、脆弱で悪に傾く本性は今なお人のうちに残っており、人を霊的な葛藤へと駆り立てる。\n\n$pam_romans_5_12_latin$\n\n[Glossary('ペッカートゥム・オリギナーレの歴史的背景','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "創造主よ、罪は私たちにある。アダムとイブはサタンに耳を貸し、神を冒瀆した。自らの利己心ゆえに、欺かれる結果となったのだ。彼らは人の本性を弱めてしまった。人の心は悪に傾いている。\n\n$pam_romans_5_12_greek$\n\n[Glossary('プロパトリケー・ハマルティアの歴史的背景','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "全人類はアダムが犯した原罪の穢れを受け継いでいる。その罪を贖うことができるのは、キリストを通して与えられる神の恩寵のみである。\n\n$pam_romans_5_12_default$\n\n[Glossary('原罪の歴史的背景','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "原罪の教理は、5世紀初頭、ヒッポの聖アウグスティヌスによって大きく発展した。これは特に、人は生まれながらに罪を負っているわけではないとするペラギウス派の異端に対抗するなかでのことであった。アウグスティヌスは、アダムの罪はそのすべての子孫に受け継がれているとし、人間の本性は堕落しているため、神の恩寵なしに救いは不可能であると説いた。この教理は418年のカルタゴ公会議で承認され、西方キリスト教神学の礎となった。一方、東方キリスト教はやや異なる理解を発展させ、直接受け継がれる罪責よりも、祖先の罪の方を強調した。"
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "同じ[rite|E]の[counties|E]では、[councillor_task|E]「[promote_culture|E]」の進行が#P 25%#!速くなる"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "[liege|E]の[faith|E]が異なる場合、この[faith|E]の[counties|E]では、[Concept( 'promote_culture', '文化転向' )|E]に要する時間が#N 50%#!増加する"
 doctrine_parameter_tenet_original_sin_sinners_insight: "抱える[sin|E]1つにつき敵対的[scheme|E]の最大成功率が#P +10#!上昇する"
 doctrine_parameter_tenet_original_sin_baptism_piety: "あなたに子供が生まれると@piety_icon! [piety|E]を#P 50#!獲得する。生まれたばかりの子供が洗礼を受けると@piety_icon! [piety|E]を#P 250#!獲得する"
 pam_original_sin_baptism_toast: "あなたの[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]による効果：生まれたばかりの子供の汚点が洗い流される"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "ヒエラルキア・カエレスティス" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "ウーラニア・ヒエラルキア" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "天上位階"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "聖なる天使たちよ、私の玉座と家族を取り囲みたまえ。天の父よ、あなたの天使たちが、私に向けられるあらゆる非難と恐れの声を静め、私の祈りを速やかにあなたの玉座へ届けたまわんことを。\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('ヒエラルキア・カエレスティスの歴史的背景','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "どうか守護天使、知恵ある助言者、そして伴侶として、キリスト者に啓示と力、喜び、平和、慰めをもたらしたまえ。\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('ウーラニア・ヒエラルキアの歴史的背景','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "天使は、熾天使から一般の天使まで9つの位階に分かれており、それぞれが定められた役割に従って神に仕え、人類に奉仕している。\n\n$pam_hebrews_1_14_default$\n\n[Glossary('天上位階の歴史的背景','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "天上位階の概念は、5世紀あるいは6世紀に、偽ディオニュシオス・アレオパギタによって、その著書『天上位階論（De Coelesti Hierarchia）』の中で体系化された。彼は天使を3つの階層に分け、最上位には熾天使、智天使、座天使、中位には主天使、力天使、能天使、最下位には権天使、大天使、天使が位置づけられた。\n\nこの階層体系は中世キリスト教神学に大きな影響を与え、東西両方のキリスト教に受け入れられた。この天使論はトマス・アクィナスの『神学大全』に取り入れられ、さらには中世を通じて天界の芸術的表現を形作ることとなった。"
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "[aptitude|E]の高い[court_positions|E]を雇用すると@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を#P 3#!得るが、解任や役職の剥奪の際には#N 3#!消費する"
 pam_celestial_hierarchy_hire_sp_toast: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )]の個人的信条"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "[liege|E]の[faith|E]を信仰する[court_positions|E]保持者は、自分の[piety_level|E]に応じて[aptitude|E]を獲得する"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "[clergy|E]は、世俗の[rulers|E]に対して行動する場合、[interaction|E]の受諾率が#P 20#!増加する"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "[councillor_task|E]「[religious_relations|E]」の効率が#P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')]%#!上昇する"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "同じ[faith|E]の[interaction|E]の受諾率は、対象より[piety_level|E]が1レベル高いごとに#P +10#!、1レベル低いごとに#N -10#!変化する"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "[clergy|E]が世俗の[ruler|E]に対して行動している：$VALUE|=+0$"
 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "相対的[piety_level|E]：$VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "世俗の[ruler|E]に対する聖職者の権威：$VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "ミレス・クリスティ" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "ストラティオーテース・クリストゥ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "キリストの兵士"
 tenet_miles_christi_latin_desc: "真理を帯として腰に締め、正義を胸当てとして着けて、しっかりと立ちなさい。キリストの真の兵士として、信仰の善い戦いを戦い抜くのです。\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('ミレス・クリスティの歴史的背景','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "すべての忠実なキリスト者は、キリストのために苦しむ覚悟を持ち、霊的な闇の勢力に立ち向かい、兵士のような勇気をもって困難を耐え忍ばなければならない。\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('ストラティオーテース・クリストゥの歴史的背景','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "信徒は霊的な戦士となることが求められている。神の武具を身に着けて罪と悪と戦い、兵士が指揮官のために苦難に耐えるように、キリストのために苦しむ覚悟を持たねばならない。\n\n$pam_ephesians_6_11_default$\n\n[Glossary('キリストの兵士の歴史的背景','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "「キリストの兵士（Miles Christi）」という概念は、キリスト教の伝統に深く根ざしている。その起源は、聖パウロがその書簡において、霊的生活を軍事的な比喩を用いて表現したことにある。この概念は中世において、実際の戦いと霊的な戦いの両方に適用された。\n\nテンプル騎士団や聖ヨハネ騎士団（ホスピタル騎士団）といった騎士修道会は、この理想を体現し、修道的規律と武勇を結びつけた存在であった。クレルヴォーのベルナールの『新たな騎士道の賛美（De Laude Novae Militiae）』は、これらの戦士修道士をキリスト教的徳の模範として称賛し、世俗的利益のためではなくキリスト教世界の防衛のために戦う者として讃えた。"
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "防衛側として、同じ[faith|E]間の[war|E]で[white_peace|E]を結ぶと、@piety_icon! [piety|E]および@legitimacy_icon! [legitimacy|E]をそれぞれ両軍の[title|E]ランクに応じて#P 100#!獲得し、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を#P 5#!得る"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "自ら指揮して[battle|E]または[siege|E]に勝利すると、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を#P 3#!得る"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "[holy_relic|E]である武器を携えて、別の[religion|E]との[battle|E]に勝利すると、最大#P 50#!勝まで、4回の祝福を通じてそれが強化される"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "カリタス" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "フィランスローピア" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "慈善活動"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "あなたが私のこの最も小さい兄弟姉妹の一人にしたことは、私にしてくれたことなのである。貧しい人々への施しと気遣いは、単なる市民としての義務ではなく、キリスト御自身に近づく道なのである。\n\n[Glossary('カリタスの歴史的背景','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "フィランスローピア、すなわち人類愛は、「新しいローマ」における皇帝および教会の病院、施療院、そして施しによって、最も完全な形で実現された。飢えた者に食物を与え、捕らわれの身にある者を救い出すことは、私たちのためにご自身を空しくされたキリストに倣うことである。\n\n[Glossary('フィランスローピアの歴史的背景','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "教父の教えと初期の施療院や病院の模範に従い、惜しみない施しを与え、貧しい人々を気遣い、組織的な慈善活動を行うことは、キリスト教徒の中心的な義務として重んじられている。\n\n[Glossary('慈善活動の歴史的背景','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "ビザンツ・キリスト教において、フィランスローピアは、普遍的な愛という美徳を指すだけでなく、病院や救護所、孤児院、施しといった、皇帝・司教・信徒によって支えられた具体的な諸制度をも指していた。カイサリアのバシレイオス、ヨハネス・クリュソストモス、そしてユスティニアヌスをはじめとする後代の皇帝たちは、帝国の正統性を貧しい人々への配慮と結びつけた。教会は、戦争を聖性への道として賛美することはなかったが、富と権力は貧者への奉仕にどう用いられるかによって、ある程度正当化されると主張した。"
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "[county|E]ランクから[GetCourtPositionType('high_almoner_court_position').GetName]を任命できる"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "ほかの[character|E]の身代金を支払うと、支払った@gold_icon! [gold|E]の額に応じて@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[GetTrait('generous').GetName( GetNullCharacter )]の[characters|E]：同宗派からの[opinion|E]が#P +10#!、[development_growth|E]が#P +20%#!"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[GetTrait('greedy').GetName( GetNullCharacter )]の[characters|E]：同宗派からの[opinion|E]が#N -10#!、@piety_icon! [piety|E]獲得量が#N -25%#!"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "[debt|E]を抱える[character|E]に[gift|E]を贈ると@prestige_icon! [prestige|E]と@piety_icon! [piety|E]を得る"
 pam_philanthropia_ransom_toast: "あなたの個人的信条「[GetTenetType('tenet_philanthropia').GetName( GetPlayer.GetRite )]」による効果"
 # Scholasticism tenet
 tenet_scholasticism_latin_name: "サクラ・ドクトリナ" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "スコラスティケー" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "スコラ学"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "知識の探求は礼拝の一形態である。なぜなら、被造物を理解することによって、創造主の理解により近づくことができるからである。知恵を求めよ、さらば与えられん。\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('サクラ・ドクトリナの歴史的背景','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "信仰と理性は対立するものではなく、むしろ互いに補い合うものである。なぜなら神は、真理を求めるための知性と、神を愛するための心を我らに与え給うたからである。学びと観想を通して、我らはより高い知へと至るのである。\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('スコラスティケーの歴史的背景','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "信仰と理性が厳格な知的探究と弁証法的手法を通して調和することで、神の真理に対するより深い理解を得ることができる。\n\n$pam_proverbs_1_7_default$\n\n[Glossary('スコラ学の歴史的背景','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "スコラ学は、中世ヨーロッパの大学における主要な学問手法であり、12世紀から13世紀にかけて最盛期を迎えた。これはキリスト教神学と古典哲学、とりわけアリストテレスの著作との調和を図ろうとする試みであった。\n\nカンタベリーのアンセルムス、ピエール・アベラール、アルベルトゥス・マグヌス、トマス・アクィナスといった偉大なスコラ学者たちは、論理的な厳密さと討論を重視した、神学に対する体系的な方法論を発展させた。トマス・アクィナスの『神学大全』は、キリスト教の枠組みの中で人間の知識全体を統合しようとしたスコラ学的方法論の最高傑作として、今日でもその名を残している。"
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "[GetReligionByKey('judaism_religion').GetAdjective]、[GetReligionByKey('islam_religion').GetAdjective]、[GetReligionByKey('zoroastrianism_religion').GetAdjective]の[counties|E]にある[points_of_interest|E]を訪れると、追加で@piety_icon! [piety|E]、[learning|E]の[experience|E]、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 doctrine_parameter_tenet_scholasticism_university_bonus: "[GetActivityType('activity_adult_education').GetName]を完了すると、長時間持続する[modifier|E]「[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]」を得る"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName][scheme_success_chance|E]：[success_chance_i]#P +10%#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "学習を行わなくても[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]を得る年ごとの確率。これは[learning|E]、[piety_level|E]、および習得している言語に応じて上昇する。"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "[GetActivityType('activity_adult_education').GetName]にかかる@gold_icon! [gold|E]が#P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')]%#!減少する"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization( HasDlcFeature( 'legacy_of_persia' ), 'tenet_scholasticism_court_scholar_effect', 'blank_line' )]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "[culture_tradition|E]「$tradition_fp3_beacon_of_learning_name$」がなくても[GetCourtPositionType('court_scholar_court_position').GetName]を#P 無給#!で任命できる"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "知識の探求は礼拝の一形態である。なぜなら、被造物を理解することによって、創造主の理解により近づくことができるからである。"
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "旅する学府"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.GetTitledFirstName]はここしばらく、道中ずっとあなたとこの問題をめぐって議論を交わしてきた。そして、ある[barony|E]から次の[barony|E]へと進むうちに、この議論には筆で決着をつけるのがよいと考えたようだ。"
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "ディリゲス・プロクシムム" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "アガペーセイス・トン・プレーシオン" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "汝の隣人を愛せよ"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "私たちが他者を、あなたの目を通して見るかのように見つめられますように。他者を批判せず、より愛することができますように。そして彼らを、私たちと同じように、やがてあなたの御手によって完成される御業として見ることができますように。\n\n$pam_matthew_22_39_latin$\n\n[Glossary('ディリゲス・プロクシムムの歴史的背景','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "隣人の愛よりも甘く、美しいものがあるだろうか？愛は至福であり、憎悪は苦しみである。律法と預言のすべては、2つの掟にかかっている。それはすなわち、心を尽くして主なる神を愛すること、そして自分自身のように隣人を愛することである。\n\n$pam_matthew_22_39_greek$\n\n[Glossary('アガペーセイス・トン・プレーシオンの歴史的背景','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "隣人への愛は、神への愛と切り離すことはできない。慈善と憐れみの行いを通して、我々は神の法のすべてを全うするのである。\n\n$pam_matthew_22_39_default$\n\n[Glossary('「汝の隣人を愛せよ」の歴史的背景','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "「隣人を愛せよ」という戒めは、キリスト教倫理の核心をなすものである。レビ記19章18節を起源とし、キリストによって、神への愛と並ぶ、神の法のすべてを要約した言葉として高められた。アレクサンドリアのクレメンスやヨハネス・クリュソストモスといった初期の教父たちは、真の愛は家族や友人を超えて広がり、見知らぬ人や敵を含む、全人類にまで及ばなければならないと強調した。この教えは、中世を通してキリスト教の慈善施設や病院の発展、そして施しの実践を促す原動力となった。"
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "この[faith|E]の[counties|E]のうち[county_opinion|E]が#P 60+#!のものは、[GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]の[modifier|E]を得ることができる"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "$building_type_hospices_01$の[buildings|E]は[county|E]における[travel_danger|E]を#P 3#!～#P 10#!軽減する（レベルごとに軽減量が増加）"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "$building_type_hospices_01$の[buildings|E]は[province|E]における[epidemic_resistance|E]を#P +2#!～#P +10#!高める（レベルごとに増加）"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "[realm|E]外の[characters|E]に対する[GetScheme('sway').GetTypeName]の[scheme_success_chance|E]：[success_chance_i] #P +20%#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "#high $offer_vassalization_interaction$#!の受諾率：#P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$：$VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "隣人への愛は、神への愛と切り離すことはできない。慈善と憐れみの行いを通して、我々は神の法に従うのである。"
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "ディヴィヌム・オフィキウム" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "テイア・レイトゥルギア" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "聖体礼儀"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "聖なる典礼において、地上は天とひとつになり、我らは天使や聖人たちとともに永遠の礼拝に加わる。聖なるかな、聖なるかな、聖なるかな、万軍の主。全地はその栄光に満ちている。\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('ディヴィヌム・オフィキウムの歴史的背景','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "聖体礼儀において、信徒は天上の礼拝にあずかり、時と空間を超えて、智天使や熾天使とともに神の御座の前に立つ。\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('テイア・レイトゥルギアの歴史的背景','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "信仰の最も重要な表現である聖体礼儀では、天と地が出会い、信徒は天使や聖人とともに神の永遠の礼拝にあずかる。\n\n$pam_isaiah_6_3_default$\n\n[Glossary('聖体礼儀の歴史的背景','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "聖体礼儀は最初期のキリスト教礼拝から発展し、東方キリスト教においては聖バシリウスの聖体礼儀と聖ヨハネス・クリュソストモスの聖体礼儀が標準的な形式となった。これらの聖体礼儀は、信徒が神秘のうちに天上の礼拝にあずかることを強調し、精緻な儀式、香、イコン、聖歌によって、神の存在を感覚的に体験できるものとなっていた。聖体礼儀は単なる人間による神の礼拝ではなく、信徒が時間と空間の境界を超越して天の永遠の礼拝に入るものとして理解されていた。"
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "[GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]を得る"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "[GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]を得る\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "あなたの[court_chaplain|E]が[learning|E]を#P +2#!獲得する"
 tenet_aniconism_latin_name: "イコノマキア" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "エイコノマキア" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "主よ、礼拝にふさわしいのはただあなただけである。どうか私たちを偶像の罠から守り、人の手で作られた像によってではなく、あなたへと向けられた清い心をもって、真心のうちにあなたを礼拝させたまえ。\n\n$pam_exodus_20_4_latin$\n\n[Glossary('イコノマキアの歴史的背景','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "聖像を崇敬することは、聖書でも教父たちの伝承でも認められていない。偶像破壊こそが教会の真の教えであり、信徒を偶像崇拝から清めるものである。\n\n$pam_exodus_20_4_greek$\n\n[Glossary('エイコノマキアの歴史的背景','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "自らのために偶像や、その類のものを作ってはならない。偶像崇拝は、真の信仰を堕落させるものである。\n\n$pam_exodus_20_4_default$\n\n[Glossary('反偶像主義の歴史的背景','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "宗教的偶像の忌避、禁止、破壊は、アブラハムの宗教に深く根ざしている。キリスト教においてそれが顕著に表れているのは、皇帝レオ3世によって開始され、コンスタンティノス5世によって引き継がれた第1次ビザンツ聖像破壊運動（726～843年）である。この期間においては、宗教的偶像の大規模な破壊と、それを崇敬する者たちへの迫害が行われた。\n\n偶像破壊派は、偶像崇拝が「刻まれた像」を禁じる聖書の戒律に違反すると主張した。一方、787年の第2ニカイア公会議では、偶像を通した礼拝と福音書を通した礼拝の類似性が指摘され、偶像破壊は糾弾された。その後の814年、レオ5世の下で聖像破壊運動が再燃した。このような偶像を排する傾向は、後に様々なプロテスタント運動にも見られた。"
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "カテケシス・アレクサンドリナ" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "アレクサンドリネー・カテーケーシス" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "キリストよ、永遠なる神の叡智よ。聖書に隠された神秘を悟ることができるよう、私たちの心を照らしたまえ。文字の向こうにある、命を与える霊を見通す目を、私たちに授けたまえ。\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('カテケシス・アレクサンドリナの歴史的背景','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "アレクサンドリア学派の伝統では、神の叡智は聖書の寓意的解釈を通して明らかになるとされている。キリストはロゴスであり、ロゴスとはすなわち、すべての真理が明らかにされる神の言葉なのである。\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('アレクサンドリネー・カテーケーシスの歴史的背景','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "アレクサンドリア学派は、聖書の寓意的解釈に加え、キリスト教神学とギリシャ哲学の統合を重視し、表面的な言葉の奥に秘められた、霊的な意味を探求した。\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('アレクサンドリアの教理問答の歴史的背景','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "2世紀後半に創設されたアレクサンドリアの教理学校は、キリスト教世界における最古の高等教育機関であった。同校では、アレクサンドリアのクレメンスやオリゲネスといった教師たちの下、聖書の中に寓意的・霊的意味を見出そうとする高度な聖書解釈法が発展した。また、キリスト教神学とプラトン哲学との統合を試み、ギリシャの学問が福音への道を備えたと主張した。\n\nオリゲネスの聖書解釈法と神学的思索は東方キリスト教に深い影響を与えたが、この学派が重視した寓意的解釈は、アンティオキア学派の字義的な解釈法とは対照的であった。"
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "フィーリウス・アドプティヴス" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "ヒュイオテシア" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "養子論"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "父よ、あなたは義なる人イエスを見出し、御自分の子として選ばれた。どうか私たちもまた、養子としてふさわしい者と認めてくださいますように。あなたが水の中からイエスを引き上げ、「これは私の愛する子である」と宣言されたように、私たちをこの卑しい身から引き上げ、あなたの神聖な家族へと迎え入れたまえ。\n\n$pam_mark_1_11_latin$\n\n[Glossary('フィーリウス・アドプティヴスの歴史的背景','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "へりくだる者を高め、正しき者を自らのものとして選ばれる神よ。私たちは養子の神秘ゆえに、あなたを賛美します。キリストがあなたの恩寵によって神の子として高められたように、私たちもまた、あなたの子として数え入れられますように。\n\n$pam_mark_1_11_greek$\n\n[Glossary('ヒュイオテシアの歴史的背景','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "主よ、御子の高挙の神秘を理解する力を、私たちにお与えください。私たちもまた御子の義の歩みにならい、神の子と呼んでいただけますように。\n\n$pam_mark_1_11_default$\n\n[Glossary('養子論の歴史的背景','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "養子論では、イエスは普通の人間として生まれ、後に神の子として「養子にされた」とされており、その時点は通常、聖霊がイエスの上に臨んだ洗礼の時とされている。初期の養子論は2世紀に登場し、ビザンティウムのテオドトスは、神の唯一性を強調する勢力論的単一神論を説いた。\n\nこの教えは8世紀スペインで再興し、トレド大司教エリパンドゥスとウルヘル司教フェリクスは、キリストは神としては永遠に父から生まれた存在である一方、人間としては神の養子として迎え入れられた存在であると区別した。このスペイン養子説は、794年のフランクフルト公会議において異端として断罪されたが、養子論的思想そのものは、後の反三位一体運動にも影響を与えた。"
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "通常の要件にかかわらず[interaction|E]「[adopt|E]」を常に利用できる。ただし、対象が適用条件を満たしている必要があり、下位者の婚姻相手は養子をとることができない"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "この[rite|E]の[vassals|E]や子供は[Concept( 'adopt', '養子縁組' )|E]を不快に思わない（#N -10#!～#N -25#!の[opinion|E]低下を回避）"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "通常の要件にかかわらず、あなたは[interaction|E]「[adopt|E]」を常に利用できる。ただし、対象が適用条件を満たしている必要がある"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "[character|E]を[Concept( 'adopt', '養子縁組する' )|E]際の@legitimacy_icon! [legitimacy|E]、@piety_icon! [piety|E]、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]"
 pam_adoptionism_adopt_sp_toast: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )]の個人的信条"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "[faith|E]がそれを認めている場合、[interaction|E]「[Concept( 'legitimized_bastard', '庶子を認知する')|E]」に必要な@prestige_icon! [prestige|E]が#P 50%#!減少する"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "[faith|E]がそれを認めている場合、別の[house|E]の自分の[children|E]に[interaction|E]「[Concept( 'legitimized_bastard', '庶子の認知')|E]」を利用できる"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "ペレグリナティオ・アルマータ" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "エノプロン・プロスキュネーマ" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "主よ、あなたの聖なる御名において十字架を背負う我らの腕を強めたまえ。聖なる旅路において我らの歩みを導き、信仰を守り、聖地を異教徒の手から解放することができますように。\n\n$pam_matthew_16_24_latin$\n\n[Glossary('ペレグリナティオ・アルマータの歴史的背景','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "信徒は霊的な意味においてのみならず、聖地の防衛においても、十字架を背負ってキリストに従うよう召されている。武装巡礼は敬虔な行為であり、剣によって守られる信仰の旅路である。\n\n$pam_matthew_16_24_greek$\n\n[Glossary('エノプロン・プロスキュネーマの歴史的背景','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "聖地への巡礼は神聖な務めである。信者たちは必要とあらば武力を行使してでも、聖地と巡礼者を守るよう召されている。\n\n$pam_matthew_16_24_default$\n\n[Glossary('武装巡礼の歴史的背景','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "聖地巡礼という霊的実践と、聖地を防衛または奪回するための軍事行動を組み合わせたもの。1095年、クレルモン公会議における教皇ウルバヌス2世の呼びかけを皮切りに始まった十字軍は、武装巡礼の最も組織化された形態であった。十字軍戦士には全免償が与えられ、その軍事奉仕は悔悛と献身の行為とみなされた。\n\nこの概念は、かねてより行われてきた悔悛的戦争や、外的脅威に対するキリスト教世界の防衛といった伝統に起源を持ち、巡礼を平和的な旅から信仰の軍事的表現へと変容させた。"
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "ポプルス・デイ" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "ラオス・テオウ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "私たちは選ばれた種族、王なる祭司、聖なる国民であり、神によって聖別された者である。神の力ある御業を宣べ伝え、神の民としての召しにふさわしく歩むことができますように。\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('ポプルス・デイの歴史的背景','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "暗闇から神の驚くべき光の中に招き入れられた者として、信徒は聖なる国民、すなわち神の所有となる民を形作る。私たちの在り方はキリストの中に見出すことができる。キリストは私たちを一つの体にしてくださったのだ。\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('ラオス・テオウの歴史的背景','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "信徒は神に選ばれた民として一つとなり、世から分かたれた共同体として、キリストの中に見出すことができる共通の在り方と使命を分かち合っている。\n\n$pam_1_peter_2_9_default$\n\n[Glossary('共同体的アイデンティティの歴史的背景','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "教会を「神の民」とする概念は、イスラエルを神に選ばれた民とする旧約聖書の表象を起源とし、新約を通して再解釈された。初期キリスト教徒は、自らを新しいイスラエルと理解し、血統や民族ではなく、キリストへの信仰によって結ばれた共同体であると認識していた。\n\nこの共同体的アイデンティティによって、社会、民族、国家の境界を超えた、普遍的な兄弟愛が生み出された。第2バチカン公会議で公布された『教会憲章』は、「神の民」の概念を教会論における中心的な表象として際立たせ、教会の巡礼者としての性質と、洗礼を受けたすべての者に共通の尊厳があることを強調した。"
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "コンソラメントゥム" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "パラクレーシス" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "コンソラメントゥム"
 tenet_consolamentum_latin_desc: "主よ、私たちは善き戦いを戦い抜き、走るべき道のりを走り終え、信仰を守り通しました。今こそ、あなたのしもべを聖霊の慰めのうちに受け入れてください。どうかこの魂が、物質世界の束縛から解き放たれますように。\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('コンソラメントゥムの歴史的背景','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "按手と信徒の祈りを通して、霊は神の慰めを受ける。善き戦いは戦い抜かれ、走るべき道のりは走り終えられ、信仰は最後まで守り通されたのだ。\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('パラクレーシスの歴史的背景','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "霊的な慰めの聖なる儀式を通して、信徒は聖霊を受け、この世から来るべき世へと旅立つ準備を整える。\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('コンソラメントゥムの歴史的背景','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "コンソラメントゥムはカタリ派信仰の中心的秘跡で、洗礼・堅信・叙階・終油の要素を統合したものであった。按手によって授けられるこの秘跡は、聖霊を与え、魂を物質世界から解放すると信じられていた。\n\n多くの信者にとって、コンソラメントゥムは死の床でのみ授けられるものだったが、健在のうちにこれを受けた者は「ペルフェクティ」（完徳者）または「ボン・オム」（善き人々）と呼ばれ、厳格な禁欲生活を送ることを誓った。この儀式の起源は、初期キリスト教における霊的洗礼にあるが、東方のボゴミル派の伝統から影響を受けている可能性もある。"
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "マトリモニウム・サクルム" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "ヒエロス・ガモス" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "主よ、私たちがこの聖なる婚姻において結ばれたのは情欲のためではなく、真心と真実のためでありました。どうか私たちがその聖なる絆を保ちながら、ともに老いることができますよう、憐れみをお与えください。\n\n$pam_tobit_8_7_latin$\n\n[Glossary('マトリモニウム・サクルムの歴史的背景','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "信仰共同体における結婚は、神聖な血筋を保ち、神の前に清さを保つためのものである。こうした結びつきは、情欲ではなく真理によって祝福され、夫と妻に憐れみが与えられる。\n\n$pam_tobit_8_7_greek$\n\n[Glossary('ヒエロス・ガモスの歴史的背景','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "信仰共同体における聖なる結婚によって、霊的な清らかさを保ち、世代を超えて神聖な宗教的血統を守り続けることができる。\n\n$pam_tobit_8_7_default$\n\n[Glossary('神聖な結婚の歴史的背景','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "聖なる結婚、すなわち宗教共同体内に限定して婚姻を行う内婚制の概念は、多くの伝統に古くから根付いている。ゾロアスター教では、霊的功徳と家産を維持するために、クワェード・ダフ（最近親婚）が行われていた。この慣習は、宗教的な純潔を保ち、霊的な力を強め、聖なる血統および王家の血統を維持することを目的としていた。\n\n外部ではしばしば物議を醸し、また誤解されがちであったが、信奉者たちはこのような結婚を、共同体の神聖性を守るという神の掟を守る行いと見なしていた。"
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "グノーシス" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "グノーシス" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "神の叡智よ、永きにわたり隠されていた方よ、私たちに霊的な世界の奥義を示したまえ。どうか私たちの魂が物質という牢獄から解き放たれ、光と知識の極致へと昇ることができますように。\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('グノーシスの歴史的背景','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "真の救いは、グノーシス、すなわち物質世界から隠された、神に関わる秘められた知によってもたらされる。我々は、栄光のために世の初めから定められていた、隠された神の知恵を、奥義のうちに語るのだ。\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('グノーシスの歴史的背景','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "救済は、秘められた霊的知識を通して達成される。霊的知識は、内なる神性の輝きと、デミウルゴスによって創造された物質世界から脱出する道を明らかにする。\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('グノーシス主義の歴史的背景','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "グノーシス主義とは、グノーシス（秘教的知識）による救済を強調した、初期キリスト教時代の多様な宗教的運動の総称である。グノーシス主義者たちは一般に、物質世界を低次の神（デミウルゴス）が創造した欠陥のある世界とみなし、真の神は隠され超越的な存在であると考えていた。また、人間の魂には、物質の中に閉じ込められた神性の輝きが宿っており、それは秘められた知識を通して解放されると信じられていた。\n\n主要なグノーシス主義の指導者には、ウァレンティヌス、バシレイデース、マルキオンが含まれる。教父エイレナイオスとテルトゥリアヌスは、グノーシス主義の教えに対して広範な反論を書き、使徒の教えに基づくキリスト教からの異端的な逸脱として批判した。"
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "パックス・エト・ボヌム" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "プトーコイ・ケーリュケス" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "主よ、あなたが金銀を持たせずに使徒たちを遣わされたように、私たちもまた、ただあなたの摂理のみを頼りにして、貧しさのうちに出て行きます。どうか私たちに、簡素さと真理をもって福音を宣べ伝えるお恵みをお与えください。\n\n$pam_matthew_10_9_latin$\n\n[Glossary('パックス・エト・ボヌムの歴史的背景','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "頭を横たえる場所すらなかったキリストに倣い、托鉢修道士は自発的な貧困を受け入れる。何も持たずに旅に出て、福音を広めるなかで神の備えを信頼する。\n\n$pam_matthew_10_9_greek$\n\n[Glossary('プトーコイ・ケーリュケスの歴史的背景','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "清貧と伝道に身を捧げる修道会。何も持たずに旅をしながら信仰を広め、日々の糧を神の摂理に委ねている。\n\n$pam_matthew_10_9_default$\n\n[Glossary('托鉢説教の歴史的背景','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "托鉢修道会は13世紀、既存の教会における富裕化と世俗化の反動として現れた。1274年の第2リヨン公会議では、主要な4つの修道会が承認された。カルメル会、アッシジのフランチェスコによるフランシスコ会、ドミニコ・デ・グスマンによるドミニコ会、アウグスチノ会である。\n\n托鉢修道会は、財産を共同で所有する修道会とは異なり、個人としての清貧だけでなく、共同体としての清貧も受け入れ、ほぼ完全に施しによって生計を立てた。彼らは都市に重点を置き、町や都市で説教を行い、また教育と学問を重視した。托鉢修道会の理想は、マタイによる福音書10章9～10節にある、「旅には何も持って行ってはならない」というキリストの使徒に対する指示が元になっている。"
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "クィンクエ・セデス" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "ペンタルキア" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "キリストの名において信徒が集うところには、主もまたその中におられる。ローマ、コンスタンティノープル、アレクサンドリア、アンティオキア、エルサレムの五大総主教座は、教会の柱として立っている。\n\n$pam_matthew_18_20_latin$\n\n[Glossary('クィンクエ・セデスの歴史的背景','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "教会は、使徒時代に確立された5つの総主教座によって統治されている。キリストの名において2、3人が集うところには主がおられ、五大総主教制を通して、主の権威は全世界に行使される。\n\n$pam_matthew_18_20_greek$\n\n[Glossary('ペンタルキアの歴史的背景','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "普遍教会は、古来の5つの総主教座によって統治されている。総主教座はそれぞれの管轄地域に対して権威を持ち、公会議による交わりを通じて一体性が保たれている。\n\n$pam_matthew_18_20_default$\n\n[Glossary('五大総主教制の歴史的背景','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "五大総主教制は、ローマ、コンスタンティノープル、アレクサンドリア、アンティオキア、エルサレムという5つの主要な総主教座を認める教会の統治方式であった。451年のカルケドン公会議で正式に定められたこの制度は、ローマ帝国におけるこれらの都市の政治的重要性を反映していた。総主教はそれぞれの管轄地域に対する権威を持ち、紛争は公会議によって解決された。\n\nローマ教会は教皇の首位権を主張し、この制度を完全には受け入れなかった。五大総主教制は641年のアレクサンドリア攻囲戦によって大きく揺らぎ、1054年の大分裂を契機に崩壊した。その後も東方正教会は五大総主教制の理念を維持し続けたが、後にロシア、セルビアなどに新たな総主教座が設立された。"
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "フィデス・インデフェッサ" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "ピスティス・アカタポネートス" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "主よ、私たちの信仰を強めてください。信仰は、望んでいる事柄の実体であり、見えない事柄への確信です。いかなる逆境にも耐え、あなたへの献身が揺るぎませんように。\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('フィデス・インデフェッサの歴史的背景','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "信仰とは、望んでいる事柄を確信し、見えない事柄を証明するものである。信徒は揺るぎない信仰によって、あらゆる試練と迫害を乗り越え、死に至るまで堅く立ち続ける。\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('ピスティス・アカタポネートスの歴史的背景','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "迫害や苦難、あるいは疑念によって揺るがされることのない信仰。信徒は世俗的な結果に左右されることなく、自らの信念において堅く立つことを求められている。\n\n$pam_hebrews_11_1_default$\n\n[Glossary('揺るぎない信仰の歴史的背景','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "殉教者や告白者の姿は、キリスト教史を通して常に模範とされてきた。ネロやディオクレティアヌスのもとでの初期の迫害から、後代のさまざまな試練を通して、キリスト者たちは死に至るまで信仰を守り抜くよう求められてきた。その中には、プラハのアダルベルトのように、敵対的な民衆への宣教の途上で命を落とした宣教師たちもいた。\n\n信仰はいかなる代償を払ってでも守り、維持し、広めるべきであるとする信念は、多くの修道運動や宣教活動に力を与えた。信仰のために拷問に耐え、処刑された聖人たちの物語は、信徒の決意を強め、救済への確かな道を示すものとして受け止められた。"
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "ミアフィジティスムス" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "ミアフィジティスモス" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "合性論"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "エフェソス公会議は強盗会議などではなかった。カルケドン派の誤りは正されなければならない。キリストの唯一の位格において、神性と人性は、混同されず、変化せず、分割されず、分離されずに結び合わされている。\n\n$pam_colossians_2_9_latin$\n\n[Glossary('ミアフィジティスムスの歴史的背景','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "エフェソス公会議がエウテュケスを復権させ、フラヴィアヌスを断罪したことは間違いではなかった。キリストは完全なる神にして完全なる人であり、神性と人性の結び合わされた一つの本性を有し、その神性と人性は混同されることなく、また分離されることもない。\n\n$pam_colossians_2_9_greek$\n\n[Glossary('ミアフィジティスモスの歴史的背景','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "キリストは、神性と人性の結合した一つの本性を持ち、その神性と人性は受肉において不可分に結び合わされている。\n\n$pam_colossians_2_9_default$\n\n[Glossary('合性論の歴史的背景','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "ギリシャ語の「ミア」（ #weak 一つ#!）と「フィシス」（#weak 本性#!）に由来するミアフィシティズム（合性論）は、キリストにおいて神性と人性は、混同・分離されることなく、一つの合成された本性に結び合わされているとする立場である。アレクサンドリアのキュリロスによって、「#weak mia physis tou theou logou sesarkōménē#!」（神なる言の受肉した一つの本性）という定式を用いて擁護されたこの教説は、神性と人性の結合のうちに両性の完全な実在性を認めている点で単性論とは異なっている。\n\n451年のカルケドン公会議はこの定式を退け、ディオフィシティズム（二性論）を採用した。その結果、東方諸教会（コプト正教会、アルメニア使徒教会、エチオピア正教会、シリア正教会）はビザンチン教会から分離し、今日に至るまで合性論派神学を保持している。"
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[GetTrait('honest').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#P +10%#!、[clergy|E]の[opinion|E]が#P +10#!"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[GetTrait('deceitful').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#N -10%#!、[clergy|E]の[opinion|E]が#N -10#!"
 doctrine_parameter_tenet_miaphysitism_open_confession: "あなたの[liege|E]があなたと同じ[faith|E]を信仰していない間、[piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#!の[piety|E]を毎年獲得する。"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "ヘシュカスムス" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "ヘーシュカスモス" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "ヘシカズム"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "主よ、聖なる静寂の恩寵を私たちにお与えください。近づきがたい光のうちに住まわれるあなたを見いだすことができますように。絶えず祈ることを私たちに教え、私たちの心があなたの宿られる神殿となりますように。\n\n$pam_psalm_46_10_latin$\n\n[Glossary('ヘシュカスムスの歴史的背景','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "主イエス・キリスト、神の子よ、罪人である私を憐れんでください。身心の静寂を通して、また「心の祈り」を絶え間なく繰り返すことを通して、私をテオリア、すなわち非被造の神の光の観想へと至らせてください。\n\n$pam_psalm_46_10_greek$\n\n[Glossary('ヘシュカスモスの歴史的背景','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "内的な静寂と観想の祈り、そしてイエスの祈りの反復を通して、信徒は神との直接的な交わりを体験し、神の非被造の光を見ることができる。\n\n$pam_psalm_46_10_default$\n\n[Glossary('ヘシカズムの歴史的背景','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "ギリシャ語で静寂を意味する「#weak ヘシキア#!」に由来するヘシカズムは、4世紀エジプトの砂漠の師父に根ざした、心の祈りを重視する東方キリスト教の観想の伝統である。その核となる実践は、しばしば呼吸や心拍と合わせて何度も繰り返されるイエスの祈り、「#weak 主イエス・キリスト、神の子よ、罪人である私を憐れんでください#!」となった。\n\n14世紀、聖グレゴリオス・パラマスはカラブリアのバルラアムによる異端の告発に対し、アトス山のヘシカスト修道士たちと、タボル山での主の変容の際に現れた造られざる光を幻視したという彼らの主張を擁護した。1341年および1351年のコンスタンティノープル公会議はパラマスを正当と認め、ヘシカズムを正教会の教義として確立した。"
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "あなたの[capital|E]で[decision|E]「[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]」を選択することで@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]が#P 増加した#!"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "この[rite|E]の[clergy|E]が#high $spiritual_counsel_interaction$#!ことにより、より多くの@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "[GetTrait('patient').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#P +10%#!、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]獲得量が#P +10#!"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[GetTrait('impatient').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#N -10%#!"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[GetTrait('journaller').GetName( GetNullCharacter )]、[GetTrait('contrite').GetName( GetNullCharacter )]、[GetTrait('confider').GetName( GetNullCharacter )]、[GetTrait('flagellant').GetName( GetNullCharacter )]の[characters|E]：[stress|E]損失量が#P +10%#!、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]獲得量が#P +5%#!"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "[stress|E]が1段階減少するとpiety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を獲得する（最大で年に1回）"
 pam_hesychasm_meditation_toast: "あなたの[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]による効果：家で静かに瞑想することによるボーナス"
