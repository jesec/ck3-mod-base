 pam_luke_1_42_english: "あなたは女の中で祝福された方。その胎の実も祝福されています。"
 pam_luke_1_79_english: "暗闇と死の陰に座す者たちを照らし、我らの足を平和の道に導く。"
 pam_colossians_3_15_english: "また、キリストの平和にあなたがたの心を支配させなさい。この平和のために、あなたがたは招かれて一つの体とされたのです。また、感謝する人となりなさい。"
 pam_matthew_5_9_english: "平和を造る人々は幸いである。その人々は神の子と呼ばれる。"
 pam_philippians_4_21_english: "キリスト・イエスにある聖徒の一人一人によろしく。私と共にいる兄弟たちから、あなたがたによろしく。"
 pam_hebrews_12_1_english: "したがって、私たちはこのように多くの証人に雲のように囲まれているのですから、一切の重荷と、纏わりつく罪とを捨て去り、私たちの参加すべき競走を、耐え忍んで走り抜こうではありませんか。"
 pam_acts_7_59_english: "彼らがステファノに石を投げつけている間、ステファノは祈った。「主イエスよ、私の霊をお受け下さい」"
 pam_luke_22_19_english: "そしてパンを取り、感謝してこれを割き、弟子たちに与えて言った。「これは、あなたがたのために与える私の体である。私を記念するため、このように行いなさい」"
 pam_1_corinthians_1_10_english: "さて兄弟・姉妹たちよ。私たちの主イエス・キリストの名においてあなたがたにお願いします。みな語ることを一つにして、#bold互いの間に分争がないようにし#!、同じ心、同じ思いになって、固く結び合うように。"
 pam_1_corinthians_10_16_english: "私たちが祝福する祝福の杯、それはキリストの血にあずかることではないでしょうか？私たちが割くパン、それはキリストの体にあずかることではないでしょうか？"
 pam_1_corinthians_10_17_english: "パンが一つなのだから、私たちは多くいても、身体は一つなのだ。それは皆で一つのパンを頂くからである。"
 pam_john_6_41_english: "ユダヤ人らはイエスについて不満を言いはじめた。イエスが「私は天から下ってきたパンである」と言われたのだ。"
 pam_1_thessalonians_5_16_20_english: "常に喜んでいるように。絶えず祈るように。すべての事について感謝するように。これがキリスト・イエスにおいて、神があなたがたに望んでおられることです。御霊を消してはならない。預言を軽んじてはならない。"
 pam_1_thessalonians_4_11_english: "落ち着いた生活をし、自分の仕事に励み、手ずから働くよう熱心に努めなさい。私たちがあなたがたに命じておいたように。"
 pam_proverbs_6_6_english: "怠け者よ、蟻のところへ行き、その道を見て、知恵を得よ。"
 pam_john_19_26_27_english: "イエスは、母とそのそばにいる愛弟子とを見て、母に、「婦人よ、見なさい。あなたの子です」と言われた。それからこの弟子に言われた。「見なさい。あなたの母です」。その時から、この弟子はイエスの母を自分の家に引き取った。"
 pam_isaiah_7_14_english: "それゆえ、主自らが一つのしるしをあなたがたに与えられる。見よ、おとめが身籠って男の子を産む。その名はインマヌエルとなる。"
 pam_proverbs_31_20_english: "彼女は貧しい者に手を開き、乏しい人に手をさしのべる。"
 pam_revelation_12_1_english: "大いなるしるしが天に現れた。一人の女が太陽を身にまとい、月を足の下に踏み、その頭に12の星の冠をかぶっていた。"
 pam_acts_8_18_english: "シモンは、使徒たちが手を置き、人々に精霊が授けられたのを見て、金をさし出した。"
 pam_proverbs_21_20_english: "知恵ある者の家には尊い宝があり、愚かな者はこれを吞み尽くす。"
 pam_luke_16_11_english: "だから、不正の富について忠実でない者に、どうして真の富を任せることができるだろうか。"
 pam_john_10_30_english: "私と父とは一つである。"
 pam_john_1_1_english: "初めに言があった。言は神と共にあった。言は神であった。"
 pam_hebrews_1_3_english: "御子は神の栄光の輝きであり、神の本質の真の姿であって、その力ある言葉をもって万物を保って支えておられます。そして罪の清めをなし終えてから、高みにおられる大いなる方の右の座に着かれました。"
 pam_acts_1_8_english: "しかし、聖霊があなたがたに下る時、あなたがたは力を受けて、エルサレム、ユダヤとサマリアの全土、さらに地のはてまで、私の証人となる。"
 pam_acts_2_4_english: "一同は聖霊に満たされ、御霊が語らせるままに、いろいろの他国の言葉で話し出した。"
 pam_acts_2_38_english: "ペトロは彼らに言った。「悔い改めなさい。そして、あなたがた一人一人が罪の赦しを得るために、イエス・キリストの名によって洗礼を受けなさい。そうすれば、聖霊の賜物を受けるであろう」"
 pam_2_macabees_12_44_english: "もし彼が、死者が復活するという希望を抱いていなければ、死者のために祈ることは無駄で、愚かしい行為であっただろう。 "
 pam_matthew_12_25_english: "内部で分裂した王国はどれも荒廃し、内部で分裂した都市や家も立ち行かない。"
 pam_matthew_12_32_english: "人の子に対して言い逆らう者は赦されるであろう。しかし、聖霊に対して言い逆らう者は、この世でも、来たるべき世でも赦されることはない。"
 pam_hebrews_12_29_english: "実に私たちの神は、焼きつくす火です。"
 pam_genesis_1_28_english: "神は彼らを祝福して言われた、「生めよ、ふえよ、地に満ちよ、地を従わせよ。また海の魚と、空の鳥と、地に動くすべての生き物とを治めよ」"
 pam_matthew_19_5_english: "それゆえに、人は父母と離れてその妻と結ばれ、二人は一体となる。"
 pam_ephesians_4_3_6_english: "平和の絆で結ばれ、霊による一致を保つように努めよ。体は一つであり、霊も一つである。あなたがたが召されたのは、一つの希望にあずかるようにと召されたのと同じである。主は一つ、信仰は一つ、バプテスマは一つ。"
 pam_ephesians_5_25_english: "夫たる者よ。キリストが教会を愛してそのために自身をささげられたように、妻を愛せ。"
 pam_matthew_16_18_english: "あなたはペトロである。私はこの岩の上に、私の教会を建てる。黄泉の門も打ち勝つことはできないだろう。"
 pam_2_timothy_2_2_english: "そして、あなたが多くの証人の前で私から聞いたことを、他の人々にも教えることができる忠実な人々に、委ねなさい。"
 pam_titus_1_5_english: "あなたをクレタに残してきた理由は、私があなたに命じておいたように、残っている仕事を整理し、また、町々に長老を立ててもらうためです。"
 pam_james_5_16_english: "だから、互いに罪を告白し合い、互いのために祈りなさい。あなたが癒されるように。正しい人の執り成しは、大いに力があり、効果があるのです。"
 pam_1_john_1_9_english: "私たちが自分の罪を告白するならば、神は真実で正しい方であるから、その罪を赦し、すべての不正から私たちを清めてくださいます。"
 pam_john_20_23_english: "誰の罪でも、あなた赦せばその罪は赦される。誰の罪でも、あなたが赦さなければ、その罪は残る。"
 pam_romans_5_12_english: "このようなわけで、一人の人によって罪が世に入り、罪によって死が入り込んだように、すべての人に死が入り込んだのです。すべての人が罪を犯したからです。"
 pam_psalm_51_5_english: "見よ、私は過ちの内に生まれました。私の母は罪のうちに私を身籠りました。"
 pam_genesis_3_6_english: "女が見ると、その木は食べるに良く、目には美しく、また、賢くなるには好ましく思われた。彼女は実を取って食べ、また共にいた夫にも与えた。そこで彼も食べた。"
 # Celestial Hierarchy Tenet
 pam_hebrews_1_14_english: "天使たちは皆仕える霊であって、救いを受け継ぐべき人々に奉仕するために、遣わされたものではありませんか？"
 pam_psalm_91_11_english: "これは主があなたのために天使たちに命じて、あなたの歩むすべての道であなたを守らせるからである。"
 pam_matthew_18_10_english: "あなたがたは、これらの小さい者を一人たりとも軽んじないよう気をつけなさい。言っておくが、彼らの天使たちは天にあって、天におられる私の父の御顔をいつも仰いでいるのである。"
 # Miles Christi Tenet
 pam_ephesians_6_11_english: "神の武具で身を固め、悪魔の策略に対して立ち向かうことができるようにしなさい。"
 pam_2_timothy_2_3_english: "キリスト・イエスの良い兵士として、私と苦しみを共にしてください。"
 pam_1_timothy_6_12_english: "信仰の闘いを立派に闘い抜いて、永遠の命を獲得しなさい。あなたはそのために召され、多くの証人の前で、立派な告白をしたのです。"
 # Scholasticism Tenet
