 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "サクセッシオ・アポストリカ" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "アポストリケー・ディアドケー" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "使徒継承"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "キリストは使徒ペトロに第一の名誉と権威を授け、それはペトロの後継者である教皇たちに受け継がれている。\n\n$pam_matthew_16_18_latin$\n\n[Glossary('サクセッシオ・アポストリカの歴史的背景','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "ローマ教会では、クラウディアの子リヌスが最初の司教として、パウロによって叙階された。\n\n$pam_matthew_16_18_greek$\n\n[Glossary('アポストリケー・ディアドケーの歴史的背景','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "使徒から現代に至るまで絶え間なく続いてきた司教の系譜は、信仰の真正な伝承を担保している。\n\n$pam_matthew_16_18_default$\n\n[Glossary('使徒継承の歴史的背景','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "使徒継承の教理では、司教の権威は、使徒自身にまで途切れることなく遡ることができる叙階の系譜を通して受け継がれるものとされている。2世紀、リヨンのエイレナイオスは、グノーシス派の異端に対抗する論拠として使徒継承を用い、キリストの真の教えは教会の正統な司教たちを通して守られてきたことを示した。\n\n13世紀以降、教皇たちは、聖ペトロの後継者であることの象徴として「漁師の指輪」をはめるようになった。一方、東方正教会では、西方の教皇たちの系譜と初期キリスト教におけるその役割を認めつつも、ペトロが他の使徒たちに勝る存在であるとは認めておらず、リヌスを初代ローマ司教とみなしている。"
 tenet_apostolic_succession_requires_head_of_faith_tt: "あなたの[faith|E]には[head_of_faith|E]が必要である"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "同じ[faith|E]の[theocratic_vassals|E]は、[liege|E]に対する[legitimacy_expectations|E]が低い"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "[GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]を得る"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "[cardinal|E]を昇進させると、[papabile_score|E]がさらに#P 10#!上昇する"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "[head_of_faith|E]本人から@legitimacy_icon! [legitimacy|E]を認める説教を受けると、追加の@legitimacy_icon! [legitimacy|E]を得る"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "[antipope|E]を廃位すると@legitimacy_icon! [legitimacy|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 # Confession tenet
 tenet_confession_latin_name: "コンフェッシオ" # DO NOT TRANSLATE
 tenet_confession_greek_name: "エクソモロゲーシス" # DO NOT TRANSLATE
 tenet_confession_default_name: "告解の秘跡"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "父よ、祝福してください。私は罪を犯しました。ああ、慈悲深き神よ！私はあなたの御前にひれ伏し、赦しを求めます。私は嘘偽りなく、あなたとあなたの司祭に罪を告白します。\n\n$pam_james_5_16_latin$\n\n[Glossary('コンフェッシオの歴史的背景','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "主よ、この惨めな私の祈りに耳を傾け、私の内に潜む蛇を滅ぼしてください！\n\n$pam_james_5_16_greek$\n\n[Glossary('エクソモロゲーシスの歴史的背景','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "罪人は告解を通して赦しを受け、神および教会と和解することができる。\n\n$pam_james_5_16_default$\n\n[Glossary('告解の秘跡の歴史的背景','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "罪の告白は、キリスト教の歴史を通して大きく変化してきた。初期の教会では、重大な罪については公の場で告白するのが一般的であった。6世紀になると、ケルト系教会で司祭への私的な告白が広まり、やがて西方キリスト教世界全体へと広がっていった。1215年の第4ラテラノ公会議では、すべてのキリスト教徒に年1回の告解が義務付けられた。告白された罪を絶対に漏らしてはならないという「告解の封印」は、この秘跡を特徴づける重要な要素となり、司祭たちはこの封印を破るよりは殉教を選ぶ覚悟であった。"
 doctrine_parameter_tenet_confession_priests_secrets: "あなたの[faith|E]の[court_chaplain|E]が告解を行っており、さらにあなたを好意的に思っているか、あなたがその人物に対して強いフックを持っている場合、[councillor_task|E]「$task_find_secrets$」の効率が上昇する"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "この[rite|E]の[clergy|E]が#high $spiritual_counsel_interaction$#!ことにより、より多くの@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName][schemes|E]により、[stress|E]がより多く解消される"
 doctrine_parameter_tenet_confession_confess_sins_decision: "[decision|E]「[GetDecisionWithKey('pam_decision_confession').GetName]」を使用できる"
