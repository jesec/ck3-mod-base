 # Anachoresis tenet
 tenet_anachoresis_latin_name: "ヴィタ・エレミティカ" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "アナコーレーシス" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "アナコレシス"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "主よ、あなたが御子を荒野へ導き、宣教の備えをさせたように、私たちを心の砂漠へとお導きください。孤独と沈黙のうちに、私たちがこの世の雑念から解放され、ただあなただけを見いだすことができますように。\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('ヴィタ・エレミティカの歴史的背景','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "世から身を引く者は幸いである。彼らは荒野の静寂のうちに神を見いだすであろう。預言者たちが洞窟や地の穴で暮らしたように、キリストの僕たちもまた、情念と戦うために孤独を求める。\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('アナコーレーシスの歴史的背景','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "信徒たちは、世俗社会を離れて荒野に身を置くことで、清浄な霊性を手に入れ、情念を克服し、孤独な祈りと禁欲的な修練を行うことで神へと近づくことができる。\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('アナコレシスの歴史的背景','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "アナコレシスは、ギリシャ語で「離脱」を意味する「#weak アナコレーシス#!」に由来し、社会を離れて荒野へ赴き、祈りと断食、そして悪魔の力との霊的な戦いに身を捧げる隠者たちの実践を意味する。この運動は3世紀のエジプトに始まり、伝統的には最初のキリスト教隠修士とみなされているテーベの聖パウロスが、250年頃、デキウス帝による迫害から逃れ、テーベ砂漠の洞窟へ退いたのを嚆矢とする。\n\n中世を通じて隠遁生活は広く行われた。彼らは修道院に付属する孤立した小部屋で暮らし、ハギオスコープと呼ばれる小窓から聖体を受けた。13世紀イングランドの『Ancrene Wisse』（アンクレン・ウィッセ）などの指導書には、男女双方の隠修士のための規則が定められていた。"
 doctrine_parameter_tenet_anachoresis_mystic_trait: "[trait|E]「[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]」を得る"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "あなたの[capital|E]外で[decision|E]「[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]」を選択することで@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]が#P 増加した#!"
