 pam_tobit_8_7_english: "今私は、この親族の女性を、情欲に駆られてではなく、誠実さをもって娶ります。どうか、私と彼女を憐れみ、私たちが老いを共に分かち合うことができるようにしてください。子どもたちの祝福をお授けください。"
 # Gnosticism Tenet
 pam_1_corinthians_2_7_english: "しかし、私たちが語るのは神の知恵、隠された秘義です。それは神が私たちに栄光を与えるために、世界の始まる前から定めておられたものです。"
 # Mendicant Preachers Tenet
 pam_matthew_10_9_english: "帯の中には金も銀も、そして銭も入れていくな。"
 # Pentarchy Tenet
 pam_matthew_18_20_english: "2人または3人が、私の名によって集まっている所には、私もその中にいるのである"
 # Unrelenting Faith Tenet
 pam_hebrews_11_1_english: "信仰とは、望んでいる事柄を確信し、見えない事柄を証明するものです。"
 # Hesychasm Tenet
 pam_psalm_46_10_english: "静まれ、私こそが神であると知れ！私は国々に崇められ、全地に崇められる。"
 pam_matthew_6_6_english: "あなたが祈る時は、自分の部屋に入って戸を閉じ、隠れた所においでになるあなたの父に祈りなさい。そうすれば、隠れたことを見ておられるあなたの父は、報いてくださるであろう。"
 pam_1_kings_19_12_english: "地震の後に火があったが、火の中に主はおられなかった。火の後にかすかにささやく声が聞えた。"
 # Anachoresis Tenet
 pam_matthew_4_1_2_english: "さて、イエスは御霊によって荒野に導かれた。悪魔に試みられるためである。そして、40日と40夜断食した後、空腹を覚えられた。"
 pam_hebrews_11_38_english: "この世は、彼らにふさわしくありませんでした。彼らは荒れ野と山の中、洞穴と地の割れ目をさまよい続けたのです。"
 pam_luke_5_16_english: "しかしイエスは、寂しい所に退いて祈っておられた。"
 # Mortification of the Flesh Tenet
 pam_1_corinthians_9_27_english: "むしろ、自分の体を打ち叩いて服従させます。他の人に宣べ伝えておきながら、自分の方が失格者とならないためです。"
 pam_galatians_5_24_english: "キリスト・イエスに属する者は、自分の肉を十字架につけてしまったのです。その情欲と欲望と一緒に。"
 pam_romans_8_13_english: "なぜなら、肉に従って生きるなら、あなたがたは死ぬ外はありません。しかし、霊によって体の行いを殺すなら、あなたがたは生きるでしょう。"
 # Holy Myron Tenet
 pam_john_3_5_english: "イエスは答えられた。「よくよくあなたに言っておく。誰でも、水と霊とから生まれなければ、神の国に入ることはできない。"
 pam_acts_10_38_english: "神はナザレのイエスに聖霊と力とを注がれました。イエスは方々を巡り歩いてよい働きをし、また悪魔に苦しめられている人々をことごとく癒されました。それは、神が共におられたからです。"
 pam_2_corinthians_1_21_22_english: "しかし、私たちとあなたがたとを、キリストのうちに堅く支え、私たちに油を注いで下さったのは神です。神はまた、私たちに証印を押し、その保証として、わたしたちの心に御霊を与えてくださいました。"
 # Khachkar Tenet
 pam_galatians_6_14_english: "私には、私たちの主イエス・キリストの十字架以外に、誇るものがあっては決してなりません。この方によって、世界は私に対し、また私も世界に対して十字架につけられたのです。"
 pam_1_corinthians_1_18_english: "十字架に関する言葉は、滅びゆく者には愚かなものですが、救いにあずかる私たちには神の力です。"
 pam_isaiah_19_19_english: "その日、主のための祭壇がエジプトの地の中心に建てられ、主を祭る石の柱がその地の境に立てられる。"
 # Miaphysitism Tenet
 pam_john_1_14_english: "そして言は肉となり、私たちの間に宿った。私たちはその栄光を見た。それは父の独り子としての栄光であって、恵みと誠とに満ちていた。"
 pam_colossians_2_9_english: "キリストの内には、満ち溢れる一切の神性が見える形で宿っている。"
 pam_philippians_2_6_7_english: "キリストは神の形で存在していましたが、神と等しくあることに固執せず、自分自身を無にして、僕の形を取り、人間と同じ者になられました。"
 # Philanthropia Tenet
 pam_matthew_25_40_english: "まことに、あなたがたに言う。わたしの兄弟のうち、最も小さい者の一人にしたことは、わたしにしたのである。"
 # Sanctity of Nature Tenet
 pam_psalm_24_1_english: "地とそこに満ちるもの、世界とそこに住む者は、すべて主のものである。"
 # Literalism Tenet
 pam_2_timothy_3_16_english: "聖書はすべて神の霊感によるものであり、教え、戒め、過ちを正し、義に生きるよう導くために有益である。"
 # Legalism Tenet
 pam_romans_2_13_english: "律法を聞くだけでは、神の御前に正しいとはされない。律法を行う者こそ、義と認められるのである。"
 # Religious Law Tenet
 pam_matthew_18_18_english: "まことに、あなたがたに言う。地上でつなぐものは天でもつながれ、地上で解くものは天でも解かれる。"
 # Communal Possessions Tenet
 pam_acts_4_32_english: "信じる者たちは皆、心も魂も一つであった。誰一人、自分の持ち物を自分だけのものとはせず、すべてを共に用いていた。"
 # Ritual Hospitality Tenet
 pam_hebrews_13_2_english: "見知らぬ者をもてなすことを怠ってはならない。そうとは知らず、天使を迎え入れた者もいるからである。"
 # Ritual Celebrations Tenet
 pam_psalm_150_3_4_english: "角笛を吹き鳴らして主をほめたたえよ。琴と竪琴を奏でて主をほめたたえよ。太鼓と踊りをもって主をほめたたえよ。弦楽器と笛をもって主をほめたたえよ。"
 # Adaptability Tenet
 pam_1_corinthians_9_22_english: "すべての人に対して、すべてのものとなった。あらゆる手立てを尽くして、幾人かでも救うためである。"
 # Astrology Tenet
 pam_matthew_2_2_english: "ユダヤ人の王としてお生まれになった幼子は、どこにおられるのか。我らはその方の星が昇るのを見て、拝するために来たのである。"
 # Warmongering Tenet
 pam_psalm_144_1_english: "わが岩なる主は、ほむべきかな。主は我が手を戦いに、我が指を戦さに備えさせる。"
 # Natural Primitivism Tenet
 pam_genesis_2_25_english: "男とその妻は、ともに裸であったが、恥じることはなかった。"
 # Auspicious Birthright Tenet
 pam_jeremiah_1_5_english: "胎内であなたを形づくる前から、わたしはあなたを知っていた。生まれる前から、あなたを聖別していた。"
 # Sacred Childbirth Tenet
 pam_psalm_127_3_english: "子らはまことに主からの賜り物、胎の実りは報いである。"
 # Hedonism Tenet
 pam_ecclesiastes_8_15_english: "そこでわたしは、喜びをたたえる。日の下に生きる者にとって、食べ、飲み、楽しむことに勝るものはないからである。"
 # Pursuit of Power Tenet
 pam_psalm_2_8_english: "わたしに求めよ。国々をあなたに与え、地の果てまであなたの領地としよう。"
 # Sanctioned False Conversions Tenet
 pam_2_kings_5_18_19_english: "我が主人がリンモンの神殿に入り、わたしの腕に寄りかかって礼拝するとき、わたしもそこで身をかがめることとなる。このことだけは、どうか主がしもべをお赦しくださるように。すると彼は、安らかに行くよう告げた。"
