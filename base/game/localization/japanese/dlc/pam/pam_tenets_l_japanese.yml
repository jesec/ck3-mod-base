 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "カイン・アドムナーン" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "パックス・エト・トレウガ・デイ" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "エケケイリア・テオウ" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "神の平和"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "別名「無辜の者の法」とも呼ばれ、戦争における非戦闘員の安全を保障するための規則を定めた。違反者は、犯罪を阻止する行動をとらなかった傍観者と共に、世俗的な罰金と儀式的な呪いの対象となった。\n\n$pam_colossians_3_15_default$\n\n[Glossary('カイン・アドムナーンの歴史的背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "待降節から公現日とその後の7日間、休戦は不可侵のものとして遵守されなければならない。休戦を破ろうとする者がいた場合、その者の司教は破門の判決を下すべきである。\n\n$pam_colossians_3_15_latin$\n\n[Glossary('神の平和の歴史的背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "キリストの弟子たる者は、平和のためにあらゆることを行う、平和の職人でなければならない。平和を求める者はキリストを求める者である。他者への愛がなく、すべての人に対して平和の姿勢を持たない者は、キリストの真のしもべとは言えない。\n\n$pam_colossians_3_15_greek$\n\n[Glossary('神の休戦の歴史的背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "兄弟姉妹に対する理不尽な暴力は、神への冒涜である。\n\n[Glossary('神の平和の歴史的背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "中世を通して、様々なキリスト教運動が起きた。その目的は正式な戦闘規則を定めることによって流血を抑制することにあった。7世紀のアイルランドのカイン・アドムナーンから10世紀フランスの神の平和運動に至るまで、これらの取り組みは教会財産と教会関係者の保護、非戦闘員への暴力の制限、そして貴族間の争いを特定の時期と場所に制限することに重点を置いていた。\n\nそしてこのような規則はしばしば、キリスト教徒以外の人々にも適用された。1179年の第3ラテラノ公会議で定められた教令第21条により、定期的な休戦がキリスト教世界全体に拡大した。だがその一方、教令第27条では、カタリ派やバスク人などの異端者に対する武力行使が求められた。"
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "同じ[faith|E]の[ruler|E]との[war|E]を宣言すると@piety_icon! [piety|E]を消費する"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "[GetTrait('zealous').GetName( GetNullCharacter )]である[rulers|E]は、その[faith|E]内で[war|E]を宣言する可能性が低い"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "この[rite|E]に従う[rulers|E]が、[interaction|E]「#high $ecclesiastic_incite_holy_war_interaction$#!」に応じる可能性ははるかに低い"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "[interaction|E]「#high $purchase_truce_interaction$#!」に必要なコストが#P 50%#!減少し、より受け入れられやすくなる"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "[raid|E]できない"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "[peace|E]の状態で#V 5年#!を過ごすごとに、[rulers|E]は報酬を得る。これは多くの場合、@legitimacy_icon! [legitimacy|E]である"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "[peace|E]の状態で#V 5年#!を過ごすごとに、ランダムな[skill|E]が#P 1#!ポイント上昇する"
 doctrine_parameter_tenet_peace_of_god_excommunication: "主要防衛側は、同じ[faith|E]の攻撃側を[excommunicate|E]する際に@piety_icon! [piety|E]を消費しない"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "同じ[faith|E]内で[truce|E]を破ると、即座に[excommunication|E]をもたらす"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "[clergy|E]は土地や称号を巡る争いをより迅速に解決し、請求する@piety_icon! [piety|E]、@gold_icon! [gold|E]、@prestige_icon! [prestige|E]が#P 25%#!減少する"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$：平和の状態にある"
 # Dulia tenet
 tenet_dulia_latin_name: "ドゥリア" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "ハギオカタタクシス" # DO NOT TRANSLATE
 tenet_dulia_default_name: "聖人崇敬"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "主を礎として選んだ者たちは、崇敬されなければならない。彼らの永遠の肉体は聖なるものであり、その遺骸は神聖であり、その記憶は崇高なものである。\n\n$pam_philippians_4_21_latin$\n\n[Glossary('ドゥリアの歴史的背景','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "証聖者や携香女から聖愚者に至るまで、教会は神への並外れた献身を示した者たちに特別な称号を授け、典礼暦において記念日を設けることで称えてきた。\n\n$pam_philippians_4_21_greek$\n\n[Glossary('ハギオカタタクシスの歴史的背景','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "聖人たちの執り成しを求める者は皆、畏敬と敬虔をもって彼らに拝謁せねばならない。\n\n$pam_philippians_4_21_default$\n\n[Glossary('聖人崇敬の歴史的背景','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "初期キリスト教においては、信仰のために命を落とした殉教者たちが崇敬され、その遺骸は聖なる品として保管された。4世紀以降になると、死によってではなく、言葉と生涯によって信仰を告白した告白者たちもまた称えられるようになった。\n\n聖人としての地位は当初、その人物の生涯と奇跡についての調査を行った上で、地方の司教によって承認されていた。993年、教皇ヨハネス15世によって承認されたアウクスブルクの司教、聖ウダルリクは、ローマ以外で初めて教皇による列聖を受けた聖人である。1170年の教皇アレクサンデル3世の教令により、列聖は教皇のみに許された特権となった。"
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[GetDecisionWithKey('pam_canonize_saint_decision').GetName]および[GetDecisionWithKey('pam_extract_relic_decision').GetName]の[decisions|E]に必要な@piety_icon! [piety|E]と@gold_icon! [gold|E]が#P 15%#!減少する"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[GetDecisionWithKey('pam_extract_relic_decision').GetName]の[decision|E]による[artifacts|E]には、追加でランダムな祝福が#P 1#!つ与えられる"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "[dynasty|E]の成員に対する[GetDecisionWithKey('pam_extract_relic_decision').GetName]の[decision|E]により、#P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#!の[dynasty_prestige|E]を得る"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "聖人を列聖すると、その[faith|E]のすべての[ruler|E]は#EMP 5年間#!$pam_dulia_new_saint_modifier$を得る"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "トランススブスタンティアティオ" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "メトゥシオーシス" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "聖変化"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "しかし聖体の秘跡においては、パンは聖別によって無に帰するのではなく、キリストの御体となる。そうでなければ、この秘跡のもとで、いかにしてキリストの御体が現前するのか説明がつかない。キリストの御体は、空間を移動することでそこに存在するようになるのではない。もしそうであれば、キリストの御体は天に存在しなくなってしまうであろう。\n\n$pam_luke_22_19_latin$\n\n[Glossary('トランススブスタンティアティオの歴史的背景','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "しかし主は真に、かつ現実にそこに存在しておられる。ゆえに、パンと葡萄酒の聖別の後、パンは主の真の御体そのものへと変容し、転化し、聖変化を遂げるのである。\n\n$pam_luke_22_19_greek$\n\n[Glossary('メトゥシオーシスの歴史的背景','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "聖別の前、それには別の名があるが、聖別の後は「血」と呼ばれる。そして人は「アーメン」、すなわち「その通りです」と唱えるのである。\n\n$pam_luke_22_19_default$\n\n[Glossary('聖変化の歴史的背景','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "聖体におけるキリストの現前性については、教会の草創期以降、神学論争の的となってきた。パンと葡萄酒がキリストの御体と御血であるという神性そのものが疑われることは稀であったが、その正確な性質をめぐっては数多くの論争が起き、分派や教会分裂が生じた。カトリック的な解釈は13世紀にトマス・アクィナスによってさらに発展し、1215年の第4ラテラノ公会議において正式に定義された。それはミサの間、パンと葡萄酒の実体はキリストの御体と御血の実体へと変化するが、パンと葡萄酒の偶有性（外見）はそのまま残るというものであった。"
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "[fabricate_claim|E]の速度：#p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "オラ・エト・ラボラ"
 tenet_ora_et_labora_greek_name: "アコイメトイ"
 tenet_ora_et_labora_default_name: "働くことは祈ること"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "目上の者に従順であれ。苦難の中にあって忍耐強くあれ。最も卑しい務めを受け入れ、自らを無価値な僕と心得よ。\n#weak 『聖ベネディクトゥス戒律』第7章#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('オラ・エト・ラボラの歴史的背景','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "休むことなく、昼夜を問わず、修道士たちは礼拝を執り行わなければならない。交互に歌う聖歌隊の歌声と絶え間ない賛美歌は、修道会と神に栄光をもたらす。\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('アコイメトイの歴史的背景','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "祈ることは働くことであり、働くことは祈ることである。怠惰は魂の敵であり、人は思考においても行動においても、勤勉でなければならない。\n\n$pam_proverbs_6_6_default$\n\n[Glossary('働くことは祈ることの歴史的背景','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "『聖ベネディクトゥス戒律』に由来する標語「#weak オラ・エト・ラボラ#!」には、祈りと労働という修道生活の理想が表れている。修道士たちは、一日のうちの決まった時間を集団礼拝、個人の黙想、そして肉体労働に捧げることが求められた。これらの均衡を保つことは、霊的な成長と規律のために不可欠と考えられていた。ベネディクト会修道院は、学問・農業・手工業の中心地となり、中世ヨーロッパの文化的・経済的生活に大きく貢献した。"
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "ヒュペルドゥリア" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "テオトコス" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "神の母"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "主の憐れみのもとに、我らは身を寄せる。苦難の時に、我らの願いを退けたまうな。ただ清く、ただ祝福された御方よ、我らを危難より救いたまえ。\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('ヒュペルドゥリアの歴史的背景','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "我らの祈りを受け入れ、御身の御子にして我らの神である御方に届けたまえ。さすれば御身のために、主が我らの魂を照らし、救いたまわん。至聖なる神の母よ、我らを救いたまえ！\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('テオトコスの歴史的背景','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "聖なるおとめマリア、神の母、慈悲の母、聖母。\n\n$pam_proverbs_31_20_default$\n\n[Glossary('「神の母」の歴史的背景','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "キリスト教の黎明期から、イエスの母マリアは特別な尊崇と崇敬の対象とされてきた。西暦431年のエフェソス公会議では、「テオトコス（#weak 神の母#!）」がその称号として承認されたが、ネストリウス派が好んだ「クリストトコス（#weak キリストの母#!）」という呼称は非難された。8世紀、ダマスコの聖ヨハネは、救済史においてマリアが果たした唯一無二の役割を理由として、マリアがすべての聖人に勝る存在であると記している。以後数世紀にわたり、無原罪の御宿りや被昇天といった、マリアに関する様々な教義が発展し、キリスト教諸教会において正式に定められていった。"
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "女性の[claims|E]は、[gender_laws|E]によって弱体化しなくなる"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "[laws|E]：[GetLaw('female_preference_law').GetName]の継承法が利用可能"
 # Simony tenet
 tenet_simony_latin_name: "シモニア" # DO NOT TRANSLATE
 tenet_simony_greek_name: "シモニア" # DO NOT TRANSLATE
 tenet_simony_default_name: "聖職売買"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "神は選ばれし者への恵みとして、我らに与え給うた大地の下に金を創造された。\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('シモニアの歴史的背景','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "神は選ばれし者への恵みとして、我らに与え給うた大地の下に金を創造された。\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('シモニアの歴史的背景','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "神は選ばれし者への恵みとして、我らに与え給うた大地の下に金を創造された。\n\n$pam_proverbs_21_20_english$\n\n[Glossary('聖職売買の歴史的背景','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "教会の役職や聖遺物、儀式等を金銭で売買すること。使徒から洗礼の力を金で買おうとしたサマリアの#weak 魔術師#!、シモン・マグスにちなんで名付けられた。\n\n西暦305年のエルビラ教会会議から1545年のトリエント公会議に至るまで、数多くの教会会議が聖職売買を強く非難し、最も厳しい霊的・世俗的罰を科した。これほど長期間にわたり繰り返し非難されてきたということは、聖職売買がごく一般的に行われていたことを示唆している。またこの問題はマルティン・ルターの『95ヶ条の論題』や、ダンテの『神曲』地獄篇第19歌においても批判されている。#weak 神のものを貪り取る者たちよ、忠実な花嫁であるべきものを、金と銀のために姦淫させる者たちよ！#!"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[castle_holdings|E]と[church_holdings|E]：@piety_icon! [piety|E]レベルごとの[tax|E]：#P + 0.1[gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "@gold_icon! [gold|E]を支払うことで、[character_interaction|E]「#high $take_monastic_vows_interaction$#!」の受諾を保証できる"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "[interaction|E]「#high $buy_ecclesiastical_title_interaction$#!」により、@gold_icon! [gold|E]を支払って聖職[titles|E]が得られる"
 tenet_simony_ecclesiastical_purchase_name: "[interaction|E]「#high $buy_ecclesiastical_title_interaction$#!」"
 doctrine_parameter_tenet_simony_gold_donations: "[clergy|E]に請願する際、@gold_icon! [gold|E]の寄付は#P 5倍#!の効果を持つ"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "年ごとに#P 25%#!～#P 75%#!の確率で#P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#!の@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を獲得し、裕福であるほど確率が上がる"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "[head_of_faith|E]は、[excommunication|E]の解除のために捧げられた@gold_icon! [gold|E]をいつでも受け入れる"
 doctrine_parameter_tenet_simony_personal_gifts: "贈り物は[stress|E]を減らし、わずかな@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を付与し、獲得する[opinion|E]を2倍にする"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "習合主義の歓迎"
 pam_personal_syncretism_county_modifier_desc: "住民は君主個人の諸教習合の伝統を尊重し、その統治のもとで繁栄を享受している。"
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "モノフィジティスムス" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "モノフィシティスモス" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "単性論"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "御子は唯一であり、その本性もまた唯一である。たとえ御子が理性的な魂を持つ肉体を引き受けたと考えられるとしても、その事実は変わらない。\n\n$pam_john_1_1_latin$\n\n[Glossary('モノフィジティスムスの歴史的背景','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "受肉した言はただ一つの本性を有する。\n\n$pam_john_1_1_greek$\n\n[Glossary('モノフィシティスモスの歴史的背景','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "キリストはただ一つの本性を持つ。それは完全なる神性である。\n\n$pam_john_1_1_default$\n\n[Glossary('単性論の歴史的背景','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "ギリシャ語の「モノス」（#weak 唯一#!）と「フィシス」（#weak 本性#!）に由来する教義。イエス・キリストは唯一、神性の本性のみを持ち、その本性とは受肉した神の言（ロゴス）であると主張するものである。451年のカルケドン公会議において異端として非難されたが、皇帝バシリスクスの支持を受け、ユスティニアヌス1世の庇護を受けた。この教義は教会の分裂を生み、アレクサンドリア総主教の権威を拒否したアケファリ派や、イエスの人性は幻影にすぎないとするドケティズムなどの諸分派を生んだ。"
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[GetTrait('theologian').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#P +10%#!、狂信者の[opinion|E]が#P +5#!、[lifestyle|E]経験が#P +10%#!"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[GetTrait('stubborn').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#P +10%#!、[clergy|E]の[opinion|E]が#P +10#!"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[GetTrait('trusting').GetName( GetNullCharacter )]の[characters|E]：@piety_icon! [piety|E]獲得量が#N -10%#!、[clergy|E]の[opinion|E]が#N -10#!"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "あなたの[religion|E]のほかの[faiths|E]の場合：[convert_county|E]の速度が#P +25%#!、[characters|E]が改宗を受け入れる確率が#P +20#!それぞれ上昇する"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "アクトゥス・アポストロルム" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "プラクシス・トーン・アポストローン" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "熱狂的な改宗活動"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "モーセがファラオの前に立ち、神から与えられた使命を堂々と告げたように、我らの宣教師たちもまた、人々の前に立つ。\n\n$pam_acts_1_8_latin$\n\n[Glossary('アクトゥス・アポストロルムの歴史的背景','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "主よ、あなたから私に与えられた賜物であるあなたの民を、私はあなたにお返しします。あなたの力強い右の御手で彼らを導き、あなたの翼の陰でお守りください。\n\n$pam_acts_1_8_greek$\n\n[Glossary('プラクシス・トーン・アポストローンの歴史的背景','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "闇の中にある者たちに天の光をもたらし、絶望の中にある者たちに希望を与えたまえ。\n\n$pam_acts_1_8_default$\n\n[Glossary('熱狂的な改宗活動の歴史的背景','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "キリスト教は紀元後最初の数世紀に急速に広まったが、その主な要因は使徒や初期の弟子たちによる布教活動にあった。彼らはローマ帝国全土を巡り、キリスト教の共同体を形成して、多様な背景を持つ人々を改宗させていった。彼らの改宗活動にかける熱意は、イエス・キリストによる救済の教えに対する深い確信によって支えられていた。こうしてキリスト教は、ユダヤ教内部の小さな一派から、世界的な宗教へと成長していった。\n\n中世になると、後に聖人や殉教者となる多くの人々が異教の地へ宣教の旅に赴き、絶え間なくキリスト教信仰を広めていった。"
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "より少ない条件で[decision|E]「[GetDecisionWithKey('zealous_missionary_prep_decision').GetName]」を実行できるようになり、より多くの[adventurers|E]がこれを選択するようになる"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "[characters|E]を改宗させると@legitimacy_icon! を#P 50#!獲得し、あなたの[court_chaplain|E]が[county|E]を改宗させると@legitimacy_icon! を#P 100#!、@spiritual_fulfillment_icon! を#P 5#!獲得する"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "[character|E]を改宗させると@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を#P 3#!獲得し、所領持ちの[ruler|E]を改宗させると#P 10#!獲得する"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "[characters|E]をこの[rite|E]に懐柔する際、あなたの[head_of_rite|E]は受諾率を#P +25#!を獲得する"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "[characters|E]の改宗を要求すると[learning|E]の優位性が#P 2倍#!になる"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "[ruler|E]を改宗させると、その[title|E]ランクに応じて@piety_icon! [piety|E]を#P 25#!～#P 1500#!獲得する"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]の信条による効果"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "プルガトリウム" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "カタルテーリオン" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "煉獄"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "私は下の罰をより強く恐れている。魂は不安に揺れながら、すでに第一の環の重みを感じている。\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('プルガトリウムの歴史的背景','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "そして天にいる人々は、肉体を持たないためにテオーシス（神化）を深めることができない。だからこそ、我々の祈りが彼らのテオーシスの助けとなるのである。\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('カタルテーリオンの歴史的背景','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "神の恩寵のうちに死んだ人々に対する最後の浄化。煉獄を経ることで、天国の喜びに入るために必要な聖性のみが彼らの内に残される。\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('煉獄の歴史的背景','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "魂には天国に至るまでの過渡期があるという考え方自体は広く受け入れられていたが、その正確な性質についてはしばしば議論がなされた。それが実在の場所なのか、精神状態なのか、単なる比喩なのか、あるいは肉体の浄化なのかは、神学者や教派によって見解が分かれていた。ジェノヴァの聖カタリナは、それを喜びと自らの罪に対する自発的な苦痛の両方が共存する状態であると述べた。一方、アレクサンドリアのオリゲネスは、神がすべてを焼き尽くす火であると論じた。\n\nカトリック教会はフィレンツェ公会議（1439年）およびトリエント公会議（1545〜63年）において煉獄の教義を正式に定めた。これにより、それは浄化を受ける一時的な状態であり、生者の祈りや善行が、そこにいる魂に恩恵をもたらすという教えが広まった。"
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[sinful|E]とされる[characters|E]は、[factions|E]に参加する可能性が低下する（抱える[sin|E]1つにつき#N -15#!）"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[sinful|E]とされる[rulers|E]は、抱える[sin|E]1つにつき@piety_icon! [piety|E]の獲得量が#N 10%#!低下する"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "[stress|E]による精神崩壊が[sinful|E]の[traits|E]を[virtues|E]に置き換える可能性があり、その確率は崩壊が深刻なほど高まる"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "この[rite|E]から[Concept('excommunicated', '破門')|E]された[characters|E]は贖罪によって償う：@piety_icon! [piety|E]獲得量が#P +25%#!、同宗派からの[opinion|E]が#P +10#!"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|E]に必要な@prestige_icon! [prestige|E]が減少し、[prestige_level|E]が低下しない"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "死亡した近親の[family|E]の成員が抱える[sin|E]1つにつき@piety_icon! [piety|E]を#P 50#!獲得する"
 pam_purgatory_prayers_for_the_dead_toast: "あなたの[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]による効果：死者への祈り"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "クレスキテ・エト・ムルティプリカミニ" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "アウクサネステ・カイ・プレーテュネステ" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "生めよ、増えよ"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "夫婦は自分たち自身だけでなく、子どもという現実を世にもたらす。子どもは夫婦の愛の表れであり、二人の存在の結びつきから不可分の生きた存在である。\n\n$pam_genesis_1_28_latin$\n\n[Glossary('クレスキテ・エト・ムルティプリカミニの歴史的背景','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "見よ、子どもは主から譲り受けたものであり、胎の実は報いである。\n\n$pam_genesis_1_28_greek$\n\n[Glossary('アウクサネステ・カイ・プレーテュネステの歴史的背景','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "神の計画において、家族は生命と愛の親密な共同体である。その営みは、すべての被造物と贖われたものと同様に、神の国において成就するであろう。\n\n$pam_genesis_1_28_default$\n\n[Glossary('生めよ、増えよの歴史的背景','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "「生めよ、増えよ」とは、創世記1章28節にある聖書の言葉であり、神がアダムとイブに子孫を増やし、地を満たすよう命じているものである。"
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "配偶者への求愛が大幅に容易になり、[fertility|E]に大きなボーナスを得る"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "[fertility|E]の低い配偶者とはいつでも離婚できる"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "新生児は、両親の親密さに応じて[health|E]にボーナスを得る"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "可愛がられて育てられた"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "愛情深く育てられた"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "献身的に育てられた"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "愛情に結ばれた両親のもとに生まれた子は、二人のぬくもりに包まれて育ち、健やかに成長する"
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "誕生時と成人時：\n$BULLET_WITH_TAB$#V 子供#!に[GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip]が2年間付与される。\n$BULLET_WITH_TAB$#V 両親#!に[GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip]が2年間付与される。"
 tenet_be_fruitful_and_multiply_child_modifier: "溺愛"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "出産や繁栄に対する熱烈な崇敬により、信徒は皆、子どもやその親により配慮し、関心を持つようになる"
 tenet_be_fruitful_and_multiply_parent_modifier: "多産の賛辞"
