 pam_1_peter_2_9_english: "しかし、あなたがたは選ばれた民であり、王の祭司であり、聖なる国民であり、神のものとなった民です。それは、あなたがたを暗闇から驚くべき御光の中に招き入れてくださった方の御業を、あなたがたが広く伝えるためです。"
