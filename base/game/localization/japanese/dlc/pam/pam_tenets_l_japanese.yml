 pam_john_1_1_greek: "[Glossary('En arche ẽn ho lógos, kaì ho lógos ẽn pròs tòn theón, kaì theòs ẽn ho lógos.', 'JOHN_1_1_GREEK_GLOSS')]" #Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
 pam_hebrews_1_3_greek: "[Glossary('Hòs on apaúgasma tẽs dóxēs kaì charakter tẽs hypostάseōs autoũ, phérōn te tà pánta to rhemati tẽs dynάmeōs autoũ, katharismòn tõn hamartiõn poiēsάmenos ekάthisen en dexia tẽs megalōsýnēs en hypsēloĩs', 'HEBREWS_1_3_GREEK_GLOSS')]" #ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως αὐτοῦ, καθαρισμὸν τῶν ἁμαρτιῶν ποιησάμενος ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς
 pam_acts_1_8_greek: "[Glossary('Allà lempsesthe dýnamin epelthóntos toũ hagíou pneúmatos eph hymãs kaì ésesthé mou mártyres én te Ierousalem kaì en pάse te Ioudaía kaì Samarίa kaì héōs eschάtou tẽs gẽs.', 'ACTS_1_8_GREEK_GLOSS')]" #ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ' ὑμᾶς καὶ ἔσεσθέ μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρίᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
 pam_acts_2_4_greek: "[Glossary('Kaì eplesthēsan hápantes pneúmatos hagíou kaì erxanto laleĩn hetérais glossais kathos tò pneũma edídou apophthéngesthai autoĩs.', 'ACTS_2_4_GREEK_GLOSS')]" #καὶ ἐπλήσθησαν ἅπαντες πνεύματος ἁγίου καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι αὐτοῖς.
 pam_acts_2_38_greek: "[Glossary('Pétros dè pròs autoús; Metanoesate, kaì baptisthetō hékastos hymõn en to onómati Iēsoũ Christoũ eis áphesin tõn hamartiõn hymõn kaì lempsesthe ten dōreàn toũ hagíou pneúmatos.', 'ACTS_2_38_GREEK_GLOSS')]" #Πέτρος δὲ πρὸς αὐτούς· Μετανοήσατε, καὶ βαπτισθήτω ἕκαστος ὑμῶν ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
 pam_2_macabees_12_44_greek: "[Glossary('Ei gàr me toùs propeptōkótas anastenai prosedóka, perissòn àn en kaì lērodes hypèr nekron proseúkhesthai.','2_MACABEES_12_44_GREEK_GLOSS')]" #εἰ γὰρ μὴ τοὺς προπεπτωκότας ἀναστῆναι προσεδόκα, περισσὸν ἂν ἦν καὶ ληρῶδες ὑπὲρ νεκρῶν προσεύχεσθαι.
 pam_matthew_12_25_greek: "[Glossary('Pãsa basileía meristheĩsa kath heautẽs erēmoũtai, kaì pãsa pólis e oikía meristheĩsa kath heautẽs ou stathésetai.','MATTHEW_12_25_GREEK_GLOSS')]" #πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
 pam_matthew_12_32_greek: "[Glossary('Kaì hòs eàn eípe lógon katà toũ hyioũ toũ anthropou, aphethesetai auto; hòs d àn eípe katà toũ pneúmatos toũ hagíou, ouk aphethesetai auto oúte en toúto to aiõni oúte en to méllonti.','MATTHEW_12_32_GREEK_GLOSS')]" #καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ' ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
 pam_hebrews_12_29_greek: "[Glossary('Kaì gàr ho theòs hēmõn pỹr katanalískon.', 'HEBREWS_12_29_GREEK_GLOSS')]" #καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
 pam_genesis_1_28_greek: "[Glossary('Kaì eulógēsen autoùs ho Theós, légōn; auxánesthe kaì plēthýnesthe kaì plērosate ten gen kaì katakyrieúsate autes kaì árkhete ton ikhthýōn tes thalássēs kaì ton peteinon toũ ouranoũ kaì pántōn ton ktēnon kaì pásēs tes ges kaì pántōn ton herpeton ton herpóntōn epì tes ges.','GENESIS_1_28_GREEK_GLOSS')]" #καὶ εὐλόγησεν αὐτοὺς ὁ Θεός, λέγων· αὐξάνεσθε καὶ πληθύνεσθε καὶ πληρώσατε τὴν γῆν καὶ κατακυριεύσατε αὐτῆς καὶ ἄρχετε τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ πάντων τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς.
 pam_matthew_19_5_greek: "[Glossary('Kaì eĩpen; héneka toútou kataleípsei ánthrōpos tòn patéra kaì ten mētéra kaì kollēthesetai te gynaikì autoũ, kaì ésontai hoi dýo eis sárka mían', 'MATTHEW_19_5_GREEK_GLOSS')]" #καὶ εἶπεν· ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν
 pam_ephesians_4_3_6_greek: "[Glossary('Spoudázontes tēreĩn ten henótēta toũ pneúmatos en to syndésmõi tẽs eirénēs. Hen sõma kaì hen pneũma, kathos kaì eklethēte en mia elpidi tẽs kléseōs hymõn. Heĩs kýrios, mía pístis, hen báptisma. Heĩs theòs kaì pater pántōn, ho epì pántōn kaì dià pántōn kaì en pãsin.', 'EPHESIANS_4_3_6_GREEK_GLOSS')]" #σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης· ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν· εἷς κύριος, μία πίστις, ἓν βάπτισμα· εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν πᾶσιν.
 pam_ephesians_5_25_greek: "[Glossary('Hoi ándres, agapãte tàs gynaĩkas, kathos kaì ho Christòs ēgάpēsen ten ekklēsían kaì heautòn parédōken hypèr autẽs', 'EPHESIANS_5_25_GREEK_GLOSS')]" #Οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς
 pam_matthew_16_18_greek: "[Glossary('Kago dé soi légō hóti sỳ eĩ Pétros, kaì epì taúte te pétra oikodomesō mou ten ekklēsían kaì pýlai hadou ou katischýsousin autẽs.', 'MATTHEW_16_18_GREEK_GLOSS')]" #κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς.
 pam_2_timothy_2_2_greek: "[Glossary('Kaì hà ekousas par emoũ dià pollõn martýrōn, taũta paráthọu pistoĩs anthropois, hoítines hikanoì ésontai kaì hetérous didάxai.', '2_TIMOTHY_2_2_GREEK_GLOSS')]" #καὶ ἃ ἤκουσας παρ᾽ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
 pam_titus_1_5_greek: "[Glossary('Toútou chárin apélipon se en Krete, hína tà leíponta epidiorthose kaì katasteses katà pólin presbytérous, hōs ego soi dietaxάmēn', 'TITUS_1_5_GREEK_GLOSS')]" #Τούτου χάριν ἀπέλιπόν σε ἐν Κρήτῃ, ἵνα τὰ λείποντα ἐπιδιορθώσῃ καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην
 pam_james_5_16_greek: "[Glossary('Exomologeĩsthe oũn allelois tàs hamartías kaì proseúchesthe hypèr allelōn, hópōs iathẽte. polỳ ischýei déēsis dikaíou energouménē.', 'JAMES_5_16_GREEK_GLOSS')]" #ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ προσεύχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
