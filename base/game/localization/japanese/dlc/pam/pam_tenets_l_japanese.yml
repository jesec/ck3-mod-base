 pam_john_3_5_greek: "[Glossary('Apekríthē Iēsoũs; amen amen légō soi, eàn me tis gennēthe ex hýdatos kaì pneúmatos, ou dýnatai eiseltheĩn eis tèn basileían toũ theoũ.','JOHN_3_5_GREEK_GLOSS')]" #ἀπεκρίθη Ἰησοῦς· ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
