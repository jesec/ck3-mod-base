 pam_mortification_holy_scars_toast: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]により、鞭打ちはその身に聖なる傷痕を残す"
 pam_mortification_suffering_sanctifies_toast: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]により、肉体の苦しみを神に捧げる"
 tenet_mortification_of_the_flesh_historical_desc: "肉体の苦行は、聖パウロが「#weak 肉の行いを死に至らしめよ#!」（ローマ8章13節）、「#weak 自分の体を戒めて服従させよ#!」（コリント1 9章27節）と呼びかけたことに根ざし、キリスト教初期の時代からその禁欲主義における中心であった。その最も極端な例が登塔者である。大聖シメオンはアレッポ近郊の柱の上で37年間を過ごし、灼熱の暑さと厳しい寒さに耐えながら、絶えず祈りを捧げ続けた。\n\n自己鞭打ちは中世の西方キリスト教に広まり、聖ペトルス・ダミアニ（1007～1072年）によって聖職者の間で擁護された。13～14世紀になると、一般信徒たちが町を練り歩き、贖罪として公の場で自らを鞭打つ光景が見られるようになったが、このような動きは特に疫病や災害に見舞われた際に顕著であった。"
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "ケドゥス・メロン" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "サンクトゥム・クリスマ" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "ハギオン・ミュロン" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "ホーリー・ミロン"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "アブナによって聖別されたメロンによって、信徒は聖霊の印を受ける。ヨルダン川での洗礼の際、鳩がキリストの上に降りてきたように、この聖なる塗油を通して、聖霊は新たに洗礼を受けた者の上に降り、その者を神の子として刻印する。\n\n$pam_john_3_5_default$\n\n[Glossary('ケドゥス・メロンの歴史的背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "司教によって聖別された聖香油によって、信徒は聖霊の賜物の印を受ける。この塗油によって、洗礼の恵みが完成する。\n\n$pam_john_3_5_latin$\n\n[Glossary('サンクトゥム・クリスマの歴史的背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "総主教によって聖別されたホーリー・ミロンは、聖霊の賜物の印である。この聖なる塗油を通して、新たに光を受けた者は聖霊の賜物のすべてを受け、生ける神の神殿となる。\n\n$pam_john_3_5_greek$\n\n[Glossary('ハギオン・ミュロンの歴史的背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "ホーリー・ミロン、すなわち聖香油は、堅信の秘跡で用いられる特別に聖別された油であり、新たに洗礼を受けた者に聖霊の賜物の印を与え、教会への入信を完成させるものである。\n\n$pam_john_3_5_default$\n\n[Glossary('ホーリー・ミロンの歴史的背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "ホーリー・ミロンは、ギリシャ語で香油を意味する「#weak ミュロン#!」に由来し、傅膏機密、すなわち西方教会における堅信の秘跡で用いられる。東方ではこれは洗礼に直ちに続いて行われ、幼児にも施される。西方では通常、司教が洗礼とは別にこれを授ける。油を注ぐことは、聖書に深く根ざした慣習であり、「#weak キリスト#!」と「#weak メシア#!」はいずれも、「#weak 油を注がれた者#!」を意味する。\n\n新しいミロン（聖油）の聖別は、稀にしか行われない厳粛な儀式であり、必ず前回の聖油が加えられる。これにより、使徒にまで遡るとされる継承の連続性が保たれている。エチオピアの伝承によれば、#weak ミロン#!の製法は5世紀にシリアの宣教師、「九聖人」によってもたらされたとされ、その聖別はアブナである総主教のみに委ねられている。"
 doctrine_parameter_tenet_holy_myron_artifact: "[decision|E]「[GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName]」で[court_chaplain|E]を派遣し、[artifact|E]「#V 聖香油#!」を作成させることができる。聖香油を消費して[artifacts|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]を祝福できる"
 pam_holy_myron_param_coronation_append: "、自身の[coronation|E]"
 pam_holy_myron_param_funeral_append: "、[funerals|E]で弔われる死者"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "[artifact|E]「#V 聖香油#!」の一部をほかの統治者に贈ると、@piety_icon! [piety|E]と[opinion|E]を獲得できる"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "自分の子供は、生まれてから#V 16#!年間[modifier|E]「[GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip]」を獲得する。[artifact|E]「#V 聖香油#!」の一部により[modifier|E]「[GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip]」を得る"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "[ill|E]になると、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得て、[stress|E]が減少する。さらに、#V 2#!年間[modifier|E]「[GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip]」を獲得する"
 # Khachkar tenet
 tenet_khachkar_armenian_name: "ハチュカル" # DO NOT TRANSLATE
 tenet_khachkar_latin_name: "クルクス・ラピデア" # DO NOT TRANSLATE
 tenet_khachkar_greek_name: "リシノス・スタウロス" # DO NOT TRANSLATE
 tenet_khachkar_default_name: "ハチュカル"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "ハチュカルは、我々の信仰の永遠の証人として立っている。十字架、蔓、聖なる象徴が精緻に彫り込まれたハチュカルは、ひとつひとつが石に刻まれた祈りであり、世界を救った十字架を讃えるものである。\n\n$pam_galatians_6_14_default$\n\n[Glossary('ハチュカルの歴史的背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "アルメニアの人々が石の十字架を天に掲げるように、我らもこの大地に救いの象徴、主イエス・キリストの十字架を刻もう。\n\n$pam_galatians_6_14_latin$\n\n[Glossary('クルクス・ラピデアの歴史的背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "聖なる象徴が刻まれた石の記念碑は、キリストの勝利の証となり、信徒たちの永遠の記念碑として立っている。\n\n$pam_galatians_6_14_greek$\n\n[Glossary('リシノス・スタウロスの歴史的背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "精緻な宗教的図像を刻んだ石の十字架は、聖地を示す神聖な記念碑であり、また死者を偲び、神の摂理を讃えるものでもある。\n\n$pam_galatians_6_14_default$\n\n[Glossary('ハチュカルの歴史的背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "ハチュカルは、アルメニア語の「#weak ハチュ#!」（十字）と「#weak カル#!」（石）に由来する精巧な彫刻が施された石碑であり、一般的に十字架を中心に、ロゼットや永遠の輪が配されている。アルメニアのキリスト教文化に特有のこれらの記念碑は、聖地の標示、重要な出来事や勝利の記念、そして死者の追悼を目的としている。\n\nこの伝統は9世紀に始まったものだが、その起源は301年にアルメニアが改宗した後、聖グレゴリウス・イルミナトルが異教の寺院に木製の十字架を掲げたことにさかのぼり、12～13世紀にかけて、ザカリア朝の諸公のもとで頂点を極めた。ハチュカルにはひとつとして同じものはない。それらはノラヴァンク修道院のモミクをはじめとする匠の作品であり、中には奇跡の力があるとされて、巡礼の対象となったものもある。"
