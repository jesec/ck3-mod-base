l_japanese:
 artifact_pedestal_bible_name: "$artifact_name_prefix$聖書"
 artifact_pedestal_bible_description: "宝石をあしらった表紙で装丁された、挿絵入りの聖書。その一節一節が、忍耐と献身をもって手書きで書き写されている。"
 artifact_pedestal_thurible_name: "$artifact_name_prefix$香炉"
 artifact_pedestal_thurible_description: "磨き上げられた鎖に吊るされた、精巧に作られた香炉——火が灯されると、香りのよい煙が広間いっぱいに広がり、祈りを天へと運んでいく。"
 artifact_pedestal_situla_name: "$artifact_name_prefix$シトゥラ"
 artifact_pedestal_situla_description: "聖水を納める豪華に装飾された器で、信徒たちに祝福を振りかけるために行列の中で運ばれる。"
 artifact_pedestal_crozier_name: "$artifact_name_prefix$司教杖"
 artifact_pedestal_crozier_description: "羊飼いの杖を模して作られた司教杖。信徒を導き、道を外れた者を戒めるためのもの。"
