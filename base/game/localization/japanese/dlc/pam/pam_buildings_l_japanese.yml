l_japanese:
 # Abbey of St Gall
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$"
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$"
 building_pam_abbey_of_st_gall_01: "ザンクト・ガレン修道院"
 building_pam_abbey_of_st_gall_01_desc: "ザンクト・ガレンの隠遁所を中心に築かれたこの修道院は、その学校、写本室、図書館で名高い。その壁の内側では、修道士たちが聖典を写し、ボーデン湖の岸辺を遥かに越えて知を広める聖職者たちを育成している。"
 building_pam_abbey_of_st_gall_01_destination_desc: "[GetBuilding('pam_abbey_of_st_gall_01').GetName]はその壁の下に巡礼者や学者たちを集める。その修道士たちは、アルプスの麓で写本を保存し、聖職者たちを教えザンクト・ガレンの記憶を今に伝えている。"
 # Palais des Papes
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$"
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$"
 building_pam_palais_de_papes_01: "アヴィニョン教皇庁"
 building_pam_palais_de_papes_01_desc: "アヴィニョンの街を見下ろすように、要塞兼住居として築かれたこの宮殿は、巨大な石壁の背後に教皇庁を擁している。礼拝堂、謁見の間、行政室などが、この都市を教会権力の中枢へと変貌させている。"
 building_pam_palais_de_papes_01_destination_desc: "[GetBuilding('pam_palais_de_papes_01').GetName]は要塞化された壁と荘厳な礼拝堂を備え、教会の公務と儀式を行うために建てられた宮殿として、アヴィニョンの街で圧倒的な存在感を放っている。"
 # Archbasilica of Saint John Lateran
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$"
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$"
 building_pam_lateran_basilica_01: "サン・ジョバンニ・イン・ラテラノ大聖堂"
 building_pam_lateran_basilica_01_desc: "ローマの大聖堂は、この都市および世界の教会の母であり、その頂点としてそびえ立っている。そのバシリカや隣接する諸堂では公会議が開かれ、教義が決定され、ローマ教皇の権威が示される。"
 building_pam_lateran_basilica_01_destination_desc: "[GetBuilding('pam_lateran_basilica_01').GetName]はローマの司教座として巡礼者や高位聖職者を迎え入れる。歴史の重みを感じさせる壁のもとでは、厳粛な礼拝と教会統治が行われている。"
 # Reims Cathedral
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$"
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$"
 building_pam_reims_cathedral_01: "ランス・ノートルダム大聖堂"
 building_pam_reims_cathedral_01_desc: "ランスにあるこの大聖堂はクロヴィスの洗礼と国王たちの戴冠の聖地としてそびえ立っている。ここでは、聖職者による祝福が統治者の統治権を神聖な権威へと変え、信仰と王権の結びつきを築き上げている。"
 building_pam_reims_cathedral_01_destination_desc: "[GetBuilding('pam_reims_cathedral_01').GetName]は、王権戴冠の聖なる中心地へと旅人たちを引き寄せる。そこでは、フランク王国の国王たちが祭壇の前にひざまずき、聖油を注がれてから、王国の臣民の前に姿を現す。"
