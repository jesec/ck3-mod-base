 pam_tenet_events.0004.opening.hof: "至高なる[diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip]猊下"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "ご報告申し上げます。[diverged_rite.GetName]は、信条の一つとして[diverged_added_tenet.GetBaseName]を取り入れました。\n\n信徒を正しく導く流派は、[diverged_rite.GetFaith.GetAdjective]宗派全体をより強固なものとします。これは至極もっともな道理でございます。"
 pam_tenet_events.0004.desc.forward_doctrine: "ご報告申し上げます。[diverged_rite.GetName]は、今や正式に[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )]を採用しました。\n\n信徒を正しく導く流派は、[diverged_rite.GetFaith.GetAdjective]宗派全体をより強固なものとします。これは至極もっともな道理でございます。"
 pam_tenet_events.0004.desc.backward_tenet: "ご報告申し上げます。[diverged_rite.GetName]は、信条の一つとして[diverged_added_tenet.GetBaseName]を受け入れました。\n\nこれにより、我らは[diverged_rite.GetFaith.GetMainRite.GetName]へとさらに近づきます。諸流派が声を一つにするとき、[diverged_rite.GetFaith.GetAdjective]宗派は栄えるでしょう！"
 pam_tenet_events.0004.desc.backward_doctrine: "ご報告申し上げます。[diverged_rite.GetName]は、今や[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )]を奉じています。\n\nこれにより、我らは[diverged_rite.GetFaith.GetMainRite.GetName]へとさらに近づきます。諸流派が声を一つにするとき、[diverged_rite.GetFaith.GetAdjective]宗派は栄えるでしょう！"
 pam_tenet_events.0004.a: "結構だ。"
 pam_tenet_events.0004.a.tt.diverged: "[diverged_rite.GetName]の[rite|E]が[mainline_rite|E]である[diverged_rite.GetFaith.GetMainRite.GetName]から乖離し、年間の[fervor_i] [fervor|E]の減少速度が速くなる"
 pam_tenet_events.0004.a.tt.consolidated: "[diverged_rite.GetName]の[rite|E]が[mainline_rite|E]である[diverged_rite.GetFaith.GetMainRite.GetName]に近づき、年間の[fervor_i] [fervor|E]の減少速度が遅くなる"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "貧しき者のために、持てる財の半ばを施したことで、魂はかえって豊かになりました。\n\nそこで、同じようにお持ちの財の半ばをお分けいただけませんか。持たざる者は赦されます。持てる者が施さぬことは、見過ごされません。"
 pam_tenet_events.0005.a: "我が[redistributing_liege.GetTitleAsNameNoTooltip]にできるなら、私とてできる。"
 pam_tenet_events.0005.b: "金ならたっぷりあるが、施すつもりはない。"
 pam_tenet_events.0005.b.tt: "国庫はそのままで、[counties|E]には何も分配されない"
 pam_tenet_events.0006.t: "秘された教え"
 pam_tenet_events.0006.desc_intro: "名もなき書物が目の前に開かれ、描かれた図形が露わになっている。記された名は、決して人の口に上せてはならぬものばかりだ。これは、敬虔な信徒なら決して触れてはならぬ類の知識。そして私は今宵、この知識に浸る機会を金で買った。"
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName]は戸口まで来ると、そこで足を止めた。「こういうものが、鍵と祈りで封じられているのには理由がある」と、[mystic_witness.GetSheHe]はつぶやいた。「読んだことは、もう知らなかったことにはできない」"
 pam_tenet_events.0006.desc_alone: "\n\n宮廷の者は誰一人、この書物を共に読み解こうとはしない。そこに何が記されていようと、助言もなしに独りで向き合うしかない。"
 pam_tenet_events.0006.a: "この書に、私の理解が及ばぬものなどない。読み進めよう。"
 pam_tenet_events.0006.b: "灯火が燃えているあいだだけ読み進めよう。それ以上は読むまい。"
 pam_tenet_events.0007.t: "死者の助言"
 pam_tenet_events.0007.desc: "扉を固く閉ざし、灯火を消す。やがて周囲は闇に沈み、今にも消え入りそうな一筋の炎と、濃く渦巻く煙だけが残る。煙の帳の向こうで、[guiding_forebear.GetTitledFirstName]が身じろぐ気配をすでに感じる。\n\n闇の中、白日の下では口にすることさえ憚られる深い苦悩をさらけ出す。霊は生者のようには答えない。墓所から響くような囁き、頼りなく揺らめく炎の爆ぜる音、見えぬ風がそっと肌を撫でる感触、煙の中で揺らめく亡霊——そうしたものを通して答えるのだ。\n\n導きを求めるあまり、何より欲する答えを見いだそうと、あらゆる兆しに必死に目を凝らす。"
 pam_tenet_events.0007.a: "かつて導きとなった知恵を分け与えてくれ。"
 pam_tenet_events.0007.b: "夜明けを迎えるだけの心の安らぎを与えてほしい。"
 pam_tenet_events.0008.t: "かつての己"
 pam_tenet_events.0008.desc: "印章、杯、指輪——いずれも、私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))]、[remembered_forebear.GetTitledFirstName]の手元から取り上げられたものだ。それらを目の前に並べさせ、借り物とは思えなくなるまで、こうして共に時を過ごしている。\n\n何も現れない。何も語られない。[remembered_forebear.GetHerHim]のことが伝わってくるわけではない。呼び覚まされているのは、私自身だ。そして蘇るのは、あの生で失ったのではなく、ただ手放したにすぎない己の気質なのだ。"
 pam_tenet_events.0008.a: "あれは私だった——まさしく[remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l]そのものだった。"
 pam_tenet_events.0008.b: "目覚めると、心の奥に[remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l]が宿っている。それが己のものだとわかる。"
 pam_tenet_events.0008.c: "そうだ。あの生では[remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l]だった。ならば、再びそうなれる。"
 pam_tenet_events.0008.d: "過去の生はもう終わった。私は今の私でいる。"
 pam_tenet_events.0009.t: "金庫を開ける"
 pam_tenet_events.0009.desc_intro: "金庫は中庭へ運び出され、鍵は私の手に渡された。"
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.GetTitledFirstName]は、並べられた金庫の列に沿って歩く。\n\n「いかに寛大な[ROOT.Char.GetTitleAsNameNoTooltip]であろうと、[ROOT.Char.GetTitleAsNameNoTooltip]であることに変わりはありません」と、[redistribution_witness.GetSheHe]は言う。「いかに惜しみなく施そうと、それだけでは救われません。手元に残すものが何一つなくなってこそ、救われるのです」"
 pam_tenet_events.0009.desc_alone: " 誰一人、私の傍らに立とうとはしない。家令たちは距離を置き、じっと待っている。"
 pam_tenet_events.0009.desc_end: "\n\n自分の金庫は、鍵をひとひねりすれば開く。他の者の財産は取り上げるしかない。"
 pam_tenet_events.0009.a: "錠を壊せ。皆に取り分を与えよ。"
 pam_tenet_events.0009.flavor: "余財のある封臣は財の供出を強いられ、あなたの伯爵領では自由が広がる一方で統制が難しくなる。また、この信条を共有しない者からは、そのことで反感を買う。"
 pam_tenet_events.0009.b: "待て。手放すのは私の財だけでよい。"
 pam_tenet_events.0009.b.tt: "あなたは自らの財産だけを分け与える。あなたの[vassals|E]は財産を供出せず、このことであなたに反感を抱くこともない。"
 pam_tenet_events.0010.t: "肉体の負う代償"
 pam_tenet_events.0010.desc_intro: "鞭はいつもの場所にある。今宵、その傍らには鉄の器具と短刀が置かれている。人知れず、自ら取り寄せたものだ。"
 pam_tenet_events.0010.desc_alone: "\n\n今宵、私のために灯火を掲げる者はいない。あの卓上から何を手に取ろうと、それを見届ける者もいない。"
 pam_tenet_events.0010.a: "心が静まるまで、鞭を振るおう。"
 pam_tenet_events.0010.b: "この世を見るのも、これ限りとしよう。"
 pam_tenet_events.0010.c: "欲を断てば、罪も消える。"
