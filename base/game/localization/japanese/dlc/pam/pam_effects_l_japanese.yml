 pam_pentarchy_see_visited_message: "[GetTenetType('tenet_pentarchy').GetName( pam_pentarchy_pilgrim.GetRite )]：総主教座を巡礼"
 pam_pentarchy_see_visited_message_desc: "あなたの信仰において神聖とされる総主教座が、また1つあなたを迎え入れた。\n\nこれで、[pam_pentarchy_pilgrim.MakeScope.Var('pam_pentarchy_sees_total').GetValue|0]か所の[holy_sites|E]のうち、[pam_pentarchy_pilgrim.MakeScope.Var('pam_pentarchy_sees_count').GetValue|0]か所への巡礼を果たした。"
 pam_pentarchy_circuit_completed_toast: "[GetTenetType('tenet_pentarchy').GetName( pam_pentarchy_pilgrim.GetRite )]：すべての総主教座を巡った者"
 pam_pentarchy_circuit_completed_toast_desc: "あなたの宗派が認める総主教座は、これですべてあなたを迎え入れた。どの座にも等しく敬意を払い、ひとつとして特別に重んじることはなかった。"
 pam_pentarchy_circuit_entourage_tt: "同行者全員が[skill|E]ポイントを#V 1#!得る"
 pam_harmonious_society_five_bonds_toast: "五倫"
 pam_harmonious_society_five_bonds_toast_desc: "五倫こそ社会の礎である。そして今、自らの五倫のあり方も変わった。"
 pam_five_bonds_ruler_subject_tt: "#high 君臣#!の倫が保たれている"
 pam_five_bonds_parent_child_tt: "#high 父子#!の倫が保たれている"
