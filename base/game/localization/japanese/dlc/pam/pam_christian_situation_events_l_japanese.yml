l_japanese:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName]は多くの領国にまたがり、そこには言語も文化も、抱える争いも異なる無数の民が暮らしている。\n\n教義をめぐる争いは教会と同じほどに古いものだが、疫病、戦争、異端に荒らされたこの終末の時代にあるいま、我らの結束が試されている。\n\n使徒[st_paul.GetName]がコリント人に結束を求めたように、すべての[christians|E]もまた[st_paul.GetHerHis]の導きに耳を傾け、「[Glossary( 'Non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]」という聖句を心に刻むべきである。さもなくば、我らは異端の泥沼にはまり、反キリストに弄ばれるだけの存在となるだろう。\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "軟弱な肉体を持つ隣人、[christians|E]どもは、弱く嫉妬深い神を崇め、その偶像の本質をめぐって子供のように口論している。その間に連中の警戒心は鈍り、奴らの剣は飢えている。正しき流血の宴から、あまりにも長く遠ざかっているのだ。\n\n連中は聖職者を送り込み、我らの土地にその弱さを広めようとしている。ならば、こちらも連中のもとを訪れ、その金庫を略奪してやろうではないか。我らが手本を見せれば、連中も強さとは何かを思い出すだろう。"
 pam_the_christian_church.0051.desc.heathen_rulers: "我らの隣人たる[christian|E]は、粗野でいがみ合ってばかりの民である。奴らは水に漂う泥のように、[ROOT.Char.GetFaith.HighGodName]の信徒を映す粗末な鏡にすぎない。過去に縛られた連中の偽りの信仰は、ただ破滅を招くばかりだ。\n\n連中の財宝は、それがいかに乏しかろうと、奪われるためにあるのだ。規律というものも弁えない連中だが、支配してやるには頃合いだろう。"
 pam_the_christian_church.0051.desc.heretic_rulers: "[st_peter.GetName]の座に居座る愚物は、真の信仰を守る我らを異端者と呼ぶつもりらしい。キリストが再び地上に生まれたなら、奴はきっとファリサイ派を気取り、再び我らが主を十字架にかけろと叫ぶだろう。\n\nキリストを我らの主と仰ぐ者たちの間に、どれほどの分裂があるかを見よ！ローマの偽司祭こそ、この不和の畑に種を蒔いた張本人ではないか。\n\nサタンの代理人たるこの男は、我らを殉教者にしようとしている。すべての[christians|E]の救済のため、この腫れ物を必ずや切り除かねばならない！"
 pam_the_christian_church.0051.desc.western: "ローマの司教の権力が弱まった今、信仰に生じたこの亀裂を修復しなければならない。最後の審判の日は近づいている。"
 pam_the_christian_church.0051.desc.eastern: "我らはキリストの敵に囲まれている。最後の審判が近づく今、ローマの司教と手を結ばねばならない。"
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\n会議は、教会が任命する聖職者を解任する自由を王権に与えた。"
 pam_the_christian_church.0051.desc.oriental_orthodox: "「[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]」——最後の審判が近づくいま、我らは兄弟たちを光のもとへ連れ戻さねばならない。"
 pam_the_christian_church.0051.a: "キリストの導きのもとに！"
 pam_the_christian_church.0051.b: "このキリストの信徒たちには目を光らせておかねばならない。"
 MIAPHYSITISM_GLOSS: "#bold 「受肉した神の言葉には、ただひとつの本性がある！」#!アレクサンドリアの聖キュリロスは、西暦431年のエフェソス公会議でそう宣言した。このキリスト論的見解は合性論として知られ、東方諸教会で広く奉じられている。"
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName]を包む闇の中で、いくつもの声が合唱のように響き渡る。\n\n#EMP 「ローマは現代のソドムになろうとしている！」#!\n\n#EMP 「教皇は女衒にして娼婦だ！」#!\n\nより穏健な見方をする者でさえ、教会が危機に瀕しており、改革を求めねばならないことは認めざるを得ない。"
 pam_the_christian_church.0052.desc.unreformed_pagan: "軟弱な魂を持つ隣人、[christians|E]どもが叫んでいる。「我らの終わりは近い！我らが教皇は異教徒のごとく野蛮だ」などと。\n\n少なくとも、そのうちひとつは真実だ。連中がしきりに口にする終わりとやらを、我らの手で迎えさせてやろうではないか！"
 pam_the_christian_church.0052.desc.heathen_rulers: "「我らの教会は危機に瀕している！」と、[christians|E]どもが叫んでいる。\n\n結構なことだ。連中が、我らにとってはとうに明らかだった事実を認めたのだから。この異教の愚か者どもも、いつの日か[ROOT.Char.GetFaith.HighGodName]の道を受け入れ、我らに倣うことを望むほかあるまい。\n\n連中の財宝は、それがいかに乏しかろうと、奪われるためにあるのだ。規律というものも弁えない連中だが、支配してやるには頃合いだろう。"
 pam_the_christian_church.0052.desc.heretic_rulers: "聖ペトロの衣をまとったこの反キリストを、何としても止めねば！"
 pam_the_christian_church.0052.desc.western: "まずはローマを変革しなければ、[GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip]が癒やされることはない。"
 pam_the_christian_church.0052.desc.eastern: "キリストの敵に囲まれる今、我らはローマの腐敗を正さねばならない。さもなくば、我らもその腐敗に呑み込まれてしまうだろう。"
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "主よ、我らの行く道を照らしたまえ！"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "我らの使命が大きく前進していることを喜ばねばならない！異教の蛮人どもがキリストの道を歩むことを学ぶにつれ、[GetSituation('the_christian_church').GetTopSubRegion.GetName]の領域は広がっている。\n\n残念ながら、すべての者が教会の教えを受け入れるわけではない。だが、恐れることはない。我らの宣教師を拒む者どもには、剣の切っ先で我らの祈りを教え込めばよい！\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "[christians|E]は聖職者を連れて我らの地へやって来る。追い返せば、今度は剣を携えて戻ってくる。\n\n我らの多くは[ROOT.Char.GetFaith.HighGodName]の道を守ろうとしているが、この人神——キリストに仕えることに利を見出す者もいる。権力は神に定められたものとなり、教会は我らの伝令役を務めてくれる。そして何より魅力的なことに、連中は税を徴収するのだ。"
 pam_the_christian_church.0053.desc.heathen_rulers: "我らの隣人たる[christians|E]は、偶像崇拝者どもを力ずくで改宗させている。奴らなど、殺されるくらいしか価値のない存在だというのに。\n\nいま、連中の剣はこちらを向いていない——これは、[ROOT.Char.GetFaith.HighGodName]が我らに与えたもうた好機だ。連中の財宝は、それがいかに乏しかろうと、奪われるためにあるようなもの。規律というものも弁えない連中だが、支配してやるには頃合いだろう。"
 pam_the_christian_church.0053.desc.heretic_rulers: "ローマの僭称者は、異教徒どもをその誤った信仰へ改宗させようとしている！この反キリストは、[christians|E]の心を毒するだけでは飽き足らず、その歪んだ欲望のままに、未熟な偶像崇拝者どもまで地獄の抱擁へ引きずり込もうとしているのだ。"
 pam_the_christian_church.0053.desc.western: "新たにキリスト教徒となった者たちが、聖ペトロの座より認められし[ROOT.Char.GetRite.GetName]の教えを信仰するよう、我らは注意深く導かねばならない。"
 pam_the_christian_church.0053.desc.eastern: "ローマは[GetSituation('the_christian_church').GetTopSubRegion.GetName]外部の者の改宗しか求めていないと言うが、油断してはならない。我らから[ROOT.Char.GetRite.GetName]の信仰を奪わぬとも限らないからだ。そればかりか、異教徒の血がしたたる剣を、同胞たるキリスト教徒に向ける可能性すらある。"
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName]の前には大きな試練が待ち受けているが、教会はまだ救える。\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nだが、教会はまだ救える！\n\n"
 pam_the_christian_church.0054.desc.intro.common: "神への信仰が揺らぐことはない。だが、教会への信頼を失った者は多い。かつて聖職者たちはキリストに倣う行いの模範であったが、いまやその独立性を大幅に失い、皇帝や王たちが影響力を振るうための道具と成り果てている。"
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural]は自らの聖職者の装いを引き裂き、継ぎはぎを神に気付かれまいとしている。祭服や記録の修繕に追われているなら、我らの森や川辺の聖域を乱す者も減るだろう。"
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural]は法と祭壇の大改革を試み、各派閥が苦難の神に対する信仰の純粋さを競っている。彼らの新たな標語は覚えておこう。だが彼らの開く公会議よりも、我らの斧の刃の方が明快に答えを示すことができる。"
 pam_the_christian_church.0054.desc.heretic_rulers: "ローマの分派が改革を巡って争っている！奴らの言う刷新など、同じくびきを組み直し、より危険な独善で締め上げようとしているに過ぎない。我らの聖地に矛先を向ける前に、勝手に自分たちの聖堂で頭を砕き合っていればいい。"
 pam_the_christian_church.0054.desc.western: "この舵取りの修正を改革と呼ぶ者もいるだろうが、民は革新を警戒している。むしろ「古き道への回帰」と位置づけたほうが受け入れられやすいかもしれない。"
 pam_the_christian_church.0054.desc.eastern: "ローマ、あるいはエクメーネの裁定者を気取る教会機関は、儀礼を磨き上げるのに躍起になり、新たな教会法、新たな誓約、そして古き罪への新たな訓戒を定めている。西方の改革が普遍のくびきと見なされぬよう、我らはこの動きを注視し、異を唱え、教会体制を強化する。"
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\n会議は、教会の生涯にわたる叙任権を認める決定を下した。"
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\n俗世の君主たちは、まるで聖職が貸し出し可能な農地であるかのように、[christianity.GetReligiousHeadTitle.GetNamePossessive|U]の司教たちに誓約を迫っている。一方、[christianity.GetReligiousHeadTitle.GetName]は、司教を聖別する立場にない世俗の君主が叙任を行うことを禁じている。\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\n明確な羊飼いがいないなか、各地の君主が意のままに司教を据えている。その衣は聖なるものだが、聖別式で漂っているのは香ではなく金の臭いである。\n\n"
 pam_the_christian_church.0055.desc.intro.common: "[GetSituation('the_christian_church').GetTopSubRegion.GetName]全土において、教会と世俗権力の争いは、もはや単なる噂ではなくなった。"
 pam_the_christian_church.0055.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural]が王と教皇のどちらに司教を叙任する権利があるか争う間、我らに目を向ける宣教師は減っている。王と司教たちには互いの特権で首を絞め合ってもらおう。この分断のおかげで、我々の森は静かになる。"
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "ローマ教会は世俗君主による叙任を横暴だと声高に叫んでいるが、手が届けば我らの導師にも枷をはめるだろう！我らに説教したいのなら、まず自らの首輪を断ち切ってからにしろ、ファリサイ派どもめ！"
 pam_the_christian_church.0055.desc.western: "司教杖を王笏の方へ傾けすぎれば、いずれこの二つが混同されるようになるかもしれない。\n\n"
 pam_the_christian_church.0055.desc.eastern: "西方の王たちは司教の指輪と杖を巡ってローマ教会と争い、その罪深き振る舞いで教会制度そのものを汚している。\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName]の各地で、信徒たちが聖墳墓の解放を求めている。彼らは進軍に備えて十字架を磨き、戦費を捻出するために聖遺物を質に入れている。\n\n信仰の情熱は激しく燃え上がっているが、この熱が冷めれば、あたかも灰が風にさらわれるかのように、その情熱はたちまち疑念へと変わるだろう。\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "戦を説く者たちは、自らの地を顧みず十字軍への参加を呼びかけている。ローマの者どもには、遠き砂漠で勝手に疲弊させておけばよい。"
 pam_the_christian_church.0056.desc.western: "剣ならば、説教の届かぬものも手に入れられるかもしれない。\n\n"
 pam_the_christian_church.0056.desc.eastern: "西方の軍勢が聖地へと進軍している。\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "[christianity.GetReligiousHeadTitle.GetNamePossessive|U]の厳重な監視の下で、$pam_the_christian_church.0057.desc.intro.common$\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$\n\n唯一無二の羊飼いがいなくとも、信仰は再び理性を取り戻す定めにあるのだ。\n\n"
 pam_the_christian_church.0057.desc.intro.common: "教会の争いに終止符が打たれた。[GetSituation('the_christian_church').GetTopSubRegion.GetName]は平和と融和の時代を迎えている。"
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "神学者たちがいくら議論を積み重ねようとも、多くの魂は司祭の言葉を通して神に触れる。\n\n我らの宗教は民のための宗教であることを忘れてはならない。"
 pam_the_christian_church.0057.desc.eastern: "我々が依然として聖歌で祈りを捧げている一方で、西方の机は分厚い論考書の山にきしんでいる。調和は歓迎するが、彼らの学派争いを我々の政務の場に持ち込むべきではない。"
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "叙任権会議の召集"
 pam_the_christian_church.0058.desc: "長年にわたる[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]が最高潮に達した。聖職者の叙任権を教会と王権のいずれが握るのか、最終的な決着をつけるため、会議が召集される。"
 pam_the_christian_church.0058.a: "決断の時だ。"
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "叙任権会議の開催"
 pam_the_christian_church.0059.desc.located: "召集の知らせが発せられた。[investiture_convene_host.GetTitledFirstName]が[investiture_convene_location.GetName]で開催する叙任権会議に、教会の聖職者たちが集う。この会議の裁定により、キリスト教世界全体において、聖職者を叙任するのが教会か王権かが定められる。"
 pam_the_christian_church.0059.desc: "召集の知らせが発せられた。教会の聖職者たちが叙任権会議に集う。この会議の裁定により、キリスト教世界全体において、聖職者を叙任するのが教会か王権かが定められる。"
 pam_the_christian_church.0059.a: "審議の時だ。"
 pam_the_christian_church_not_hof_trigger_tt: "あなたは宗教指導者ではない"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "まもなく教会の特別会議が開かれ、あなたの[faith|E]における次の「聖職者の任命」の[doctrine|E]が決定される。"
 pam_the_christian_church.0060.t: "汝らの間に分裂があってはならない"
 pam_the_christian_church.0060.desc: "キリスト教世界は一触即発の状態にある。[schism_mainline_rite.GetName]は使徒の継承を主張する一方で、[schism_competitor_rite.GetName]は決して譲ろうとしない。\n\nキリストご自身も「[Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]」と警告された。この危機によって生じた傷を放置すれば、教会は二度と一つの声で語ることはできなくなるかもしれない。"
 pam_the_christian_church.0060.a: "[schism_mainline_rite.GetNameNoTooltip]を支持する。"
 pam_the_christian_church.0060.a.tt: "[decision|E]「[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]」に貢献する"
 pam_the_christian_church.0060.b: "[schism_competitor_rite.GetNameNoTooltip]を支持する。"
 pam_the_christian_church.0060.b.tt: "[decision|E]「[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]」に貢献する"
 pam_the_christian_church.0060.c: "体には2本の腕が必要だ。"
 pam_the_christian_church.0060.c.tt: "[decision|E]「[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]」に貢献する"
 pam_the_christian_church.0061.t: "大分裂"
 pam_the_christian_church.0061.desc: "[schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]の使節たちが祭壇に宣告文を叩きつけた。\n\n「偽って[schism_eastern_faith.ReligiousHeadName]と呼ばれる[schism_eastern_faith.GetReligiousHead.GetFirstName]と、そのすべての信者たちを呪詛する。[Glossary( 'マラナタ', 'MARANATHA_GLOSS' )]、すべての異端者とともに！いや、悔い改めぬ限り、悪魔とその使いたちとともに！」\n\n「この不敬な文書は、これを編集し、書き記し、あるいは何らかのかたちで関与した者たちとともに呪詛されるべきである」と、[schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip]は応じた。\n\n信徒は[schism_western_faith.GetAdherentNamePlural]と[schism_eastern_faith.GetAdherentNamePlural]に分断された。我が魂は今や[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]となった。"
 pam_the_christian_church.0061.desc.bystander: "[schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]から知らせが届いた。使節たちが破門状を祭壇に叩きつけ、[schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip]のほうも同様の報復をもって応じたという。\n\nひとつの教会を称していた者たちが、今や[schism_western_faith.GetAdherentNamePlural]と[schism_eastern_faith.GetAdherentNamePlural]に分断されている。この争いは私にはかかわりがなく、[ROOT.Char.GetFaith.GetName]の信仰がそれによって揺らぐこともない。だが、この対立を目の当たりにするのは胸が痛む。"
 pam_the_christian_church.0061.a: "それで構わない。"
 pam_the_christian_church.0061.a.shame: "実に残念だ。"
 pam_the_christian_church.0061.a.bystander: "兄弟同士で争うとは、なんとも嘆かわしいことだ。"
 MARANATHA_GLOSS: "#bold 「主よ、来てください！」#!を意味するアラム語の叫び。『コリント人への手紙 第一』16章22節に由来し、呪いの定型句となった。呪われた者たちは、主が再臨されるまで追放される。"
 pam_the_christian_church.0062.t: "守られた聖餐の交わり"
 pam_the_christian_church.0062.desc: "キリスト教世界を引き裂く恐れがあった傷は縫い合わされた。[schism_peacemaker.GetTitledFirstName]の尽力により、争っていた教座は再び一つの卓へと呼び戻された。\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName]は聖餐の交わりを保っている。"
 pam_the_christian_church.0062.a: "主の御名が称えられんことを。"
 pam_the_christian_church.0062.a.peacemaker: "いずれの司教座も、他の座を支配してはならない。"
 pam_the_christian_church.0062.b: "[new_head_of_faith.GetTitledFirstNameNoTooltip]に我々を導いてもらおう。"
 pam_the_christian_church.0062.b.self: "ならば、信徒たちには私に従ってもらおう。"
 pam_the_christian_church.0063.t: "取り残されし者"
 pam_the_christian_church.0063.desc: "私は[ROOT.Char.GetRite.GetName]の教えを受け入れたが、[schism_dissenter.GetTitledFirstName]は同じ道を選ばなかった。[schism_dissenter.GetSheHe|U]は私の魂や私がかつて属していた共同体をめぐり、繰り返し懸念を口にしている。\n\n「あなたは我々のもとを去ってしまいました」[schism_dissenter.GetSheHe]はそう静かに言う。「教会が二つに引き裂かれるとき…いずれそうなるでしょうが…あなたと私はその傷口を挟んで対立することになるでしょう」"
 pam_the_christian_church.0063.a: "同じ神がどちらの祈りも聞いてくださる。"
 pam_the_christian_church.0063.b: "なぜ私が宗旨替えしたのか、教えてやろう。"
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip]も改宗する"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip]の心は動かない"
 pam_the_christian_church.0063.c: "その不安は胸にしまっておけ。"
 pam_the_christian_church.0064.t: "開きゆく傷口"
 pam_the_christian_church.0064.desc.opening.self_mainline: "私の声が[schism_competitor_head.GetTitledFirstName]の声とぶつかり合う。"
 pam_the_christian_church.0064.desc.opening.self_competitor: "私の声が[schism_mainline_head.GetTitledFirstName]の声とぶつかり合う。"
 pam_the_christian_church.0064.desc.opening: "[schism_mainline_head.GetTitledFirstName]と[schism_competitor_head.GetTitledFirstName]の声がぶつかり合う。 "
 pam_the_christian_church.0064.desc: "[schism_mainline_rite.GetName]と[schism_competitor_rite.GetName]の間に和解への道はもはや見いだせない。\n\n聖書に記された警告が今や、宣告となって響きわたる。「[Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]」[christianity.GetName]内の交わりはまだ絶たれていない。だがこの傷口はいずれ開くだろう。その時が来ることは、もはや避けられない。"
 pam_the_christian_church.0064.a: "神よ、我々を見捨て給うな。"
 pam_the_christian_church.0064.a.tt: "大分裂の進捗が閾値に達した"
