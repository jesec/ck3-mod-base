 concord_icon: "@pam_the_christian_church_concord_icon! $concord$"
 concord_desc: "協調はキリスト教世界が安定期にあることを示す。教会の活力は理性、法、体系的な神学へと向けられ、古典の再発見は、危機感だけでなく、議論によって疑念に答えるというスコラ学的な姿勢を育む。"
