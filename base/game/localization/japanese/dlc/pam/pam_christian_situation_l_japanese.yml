 the_christian_church_participant_group_christian_clerical_main_power_rulers: "主勢力（聖職）"
 the_christian_church_participant_group_christian_clerical_main_power_rulers_desc: "[theocratic_government|E]または[ecclesiastical_government|E]を持ち、[county|E]以上の[title_tier|E]を有していて、現在世界で最も多くの[counties|E]を支配しているキリスト教の[faith|E]に属している[ruler|E]。"
 the_christian_church_participant_group_christian_regular_main_power_rulers: "主勢力（世俗）"
 the_christian_church_participant_group_christian_regular_main_power_rulers_desc: "[county|E]以上の[title_tier|E]を持ち、現在世界で最も多くの[counties|E]を支配しているキリスト教の[faith|E]に属している[secular_ruler|E]。"
 the_christian_church_participant_group_christian_clerical_secondary_powers_rulers: "副勢力（聖職）"
 the_christian_church_participant_group_christian_clerical_secondary_powers_rulers_desc: "主勢力とは異なる公会議派の[christian|E][faith|E]に属し、[theocratic_government|E]または[ecclesiastical_government|E]で、少なくとも[county|E]の[title_tier|E]を持つ[ruler|E]。"
 the_christian_church_participant_group_christian_regular_secondary_powers_rulers: "副勢力（世俗）"
 the_christian_church_participant_group_christian_regular_secondary_powers_rulers_desc: "主勢力とは異なる公会議派の[christian|E][faith|E]に属し、少なくとも[county|E]の[title_tier|E]を持つ[secular_ruler|E]。"
 the_christian_church_participant_group_christian_clerical_heretic_rulers: "異端（聖職）"
 the_christian_church_participant_group_christian_clerical_heretic_rulers_desc: "非公会議派の[christian|E][faith|E]に属し、[theocratic_government|E]または[ecclesiastical_government|E]で、少なくとも[county|E]の[title_tier|E]を持つ[ruler|E]。"
 the_christian_church_participant_group_christian_regular_heretic_rulers: "異端（世俗）"
 the_christian_church_participant_group_christian_regular_heretic_rulers_desc: "主勢力とは異なる非公会議派の[christian|E][faith|E]に属し、少なくとも[county|E]の[title_tier|E]を持つ[secular_ruler|E]。"
 the_christian_church_fragile_unity_situation_phase: "$fragile_unity$"
 fragile_unity: "脆弱な統一"
 fragile_unity_icon: "@pam_the_christian_church_fragile_unity_icon! $fragile_unity$"
 fragile_unity_desc: "キリスト教世界には、誰もが従うべき唯一の玉座が存在しない。王も司教も異端者も皆、自分こそが神の代弁者だと主張するが、誰も彼らに耳を傾けてはいないようだ。"
 the_christian_church_saeculum_obscurum_situation_phase: "$saeculum_obscurum$"
 saeculum_obscurum: "暗黒時代"
 saeculum_obscurum_icon: "@pam_the_christian_church_saeculum_obscurum_icon! $saeculum_obscurum$"
 saeculum_obscurum_desc: "ペトロの座である教皇庁の暗黒時代。教皇庁は罪にまみれ、権力者の寝所にその権威を委ねている。"
 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "改宗"
 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "新たな洗礼の時代。王たちは川沿いの砦や市場町に十字架を掲げ、宣教師と王の軍勢は辺境の人々の魂を奪い合っている。一人の統治者の改宗が、民全体を同じ洗礼盤へと導くこともある。"
 reform_phase: "改革"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "規律と法、そして清教徒的な熱意が聖職者たちに戻ってくる。キリスト教の内部構造には厳しい目が向けられているが、教会の浄化にはしばしば血の代償が伴う。"
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 investiture_crisis: "聖職叙任権闘争"
 investiture_crisis_icon: "@pam_the_christian_church_investiture_crisis_icon! $investiture_crisis$"
 investiture_crisis_desc: "王冠と司教杖は、神の穀倉の鍵を誰が持つのかを巡って真っ向から対立する。\n\n世俗の支配者が司教に司教杖と指輪を授ける一方、教会はその正統性を認めることを拒む。"
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "次回の叙任権会議：[GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]が最終局面を迎え、決着するまでの残り時間。\n\n期限が切れると叙任権会議が招集され、「[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]聖職者任命制」の[doctrine|E]を巡る論争が行われ、投票結果に応じて[GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]または[GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]のいずれかに置き換えられる。世俗[rulers|E]は、[casus_belli|E]「$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$」を使用するか、[puppets|E]を獲得することによって、[clergy|E]に反対投票を強制することができる。"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak 教会が優位に立っている#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak 王冠が優位に立っている#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak 来たる投票結果はどちらに転ぶか分からない#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "[schism|e]の進捗：[Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0]/[Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "[GetRiteByKey('roman_rite').GetAdherentNamePlural]と[GetRiteByKey('byzantine_rite').GetAdherentNamePlural]の分断によって、キリスト教世界がどれだけ[Concept( 'schism', '大分裂')|E]へと近づいているかを表す。\n\n不満が十分に蓄積されると、教会が分裂する可能性がある。$GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'christian_faith').GetName]は[Concept( 'schism', '大分裂')|E]が起こるか、または阻止されるまで[head_of_faith|E]を創設できません#!\n\n#help 進捗は以下により増加します。\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName]の投票により[core_tenet|E]または[doctrine|E]が[rites|E]から取り消される\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName]での討論が始まる前に、両流派の間で争いが起こる\n$BULLET_WITH_TAB$[GetSituation('the_christian_church').GetName]に属する両流派の[kings|E]以上の統治者間で[war|E]が起こる\n$BULLET_WITH_TAB$一方の流派の[holy_site|E]がもう一方の流派に改宗する\n$BULLET_WITH_TAB$いずれかの流派の[holy_site|E]が格下げされる\n$BULLET_WITH_TAB$[head_of_rite|E]が他方の流派によって殺害される#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "次の[GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName]に進むと、[decisions|E]「[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]」および「[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]」、ならびに[interaction|E]「#V $pam_sway_schism_stance_interaction$#!」を使用できるようになる"
 pam_great_schism_decision_taken: "[Concept( 'schism', '大分裂')|E]が起こったか、阻止された"
 msg_pam_great_schism_progress_title: "大分裂への進捗"
 crusade_phase: "十字軍"
 crusade_phase_icon: "@pam_the_christian_church_crusade_phase_icon! $crusade_phase$"
 crusade_phase_desc: "十字架は剣として掲げられる。悔い改めた領主たちの軍勢が、危機に瀕したすべての聖所を守るため、聖都へと押し寄せる。"
 the_christian_church_crusade_phase_situation_phase: "$crusade_phase$"
