 pam_decision_events.0030.b.decline: "[religious_authority.GetTitleAsName]はあなたの王国を非難する"
 pam_decision_events.0030.opening: "至聖なる[religious_authority.GetMotherFather|U]よ！"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName]は、[religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip]信徒たる子らを守る高位の守護者、すなわち[ROOT.Char.GetFaith.HighGodNameSheHe|U]が地上に与えた美しき地を治める君主を、ごく僅かしかお定めになりません。\n\nどうか私を、その祝福された数少ない者の一人にお加えください。[king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]王国を創設してくだされば、私はあらゆる悪からそれを守り抜きます。"
 pam_decision_events.0030.a: "ここに新たな[religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip]王国を聖別する。"
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName]はそなたに対し、そのような計画はお持ちではないのだ、[king_aspirant.GetFirstNameNoTooltip]よ…"
 pam_decision_events.0031.t: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]の[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 pam_decision_events.0031.desc.self_crowning: "[ROOT.Char.GetPrimaryTitle.GetNameNoTier]ほど祝福された土地が他にあろか？王の加護にふさわしい領地が他にあろうか？[ROOT.Char.GetFaith.WarGodName]はその民を災厄から守り、私の聖座をその境の内に保ってきてくださったではないか？\n\n私は[ROOT.Char.GetFaith.HighGodNamePossessive]の御意志を掲げて、[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]の[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]を聖別した。自らをこの地の聖なる守護者としたからには、もう二度と私の意志が拒絶されることはない。\n\n封臣も信徒も皆、平伏せよ！善き[religious_authority.GetFaith.GetReligion.GetAdherentNamePlural]は、己の[ROOT.Char.GetTitleAsName]を崇敬するものだ。"
 pam_decision_events.0031.desc_three_duchies: "[religious_authority.GetTitledFirstNamePossessiveRegnal]の命により、我が領国の地は、天空を巡る宿命の星々のごとく一つに連ねられた。[duchy_1.GetName]、[duchy_2.GetName]、[duchy_3.GetName]は一つに結ばれ、祝福された[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]が築かれる。\n\nそして、正義に満ちた相応しき魂から、新たな[ROOT.Char.GetTitleAsName]が誕生する！私は[religious_authority.GetTitleAsNamePossessiveNoTooltip]の命によって高みに上った身であり、[religious_authority.GetHerHis]の導きに従ってこの国を導かねばならない。"
 pam_decision_events.0031.desc: "[religious_authority.GetTitledFirstNamePossessiveRegnal]の命により、新たな[ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]の名が年代記に刻まれる。[ROOT.Char.GetFaith.PriestNeuterPlural]も民も、歓喜のうちに私を称え上げている！[ROOT.Char.GetPrimaryTitle.GetNameNoTier]が異教徒や異端者の手に落ちぬ限り、私はこの地の正統なる[ROOT.Char.GetFaith.GetAdjective]の[ROOT.Char.GetTitleAsName]であり続ける。\n\n私を立てし[religious_authority.GetTitleAsNameNoTooltip]は、この慎ましき領国に真の祝福を授けられた…そして、王としての私の振る舞いにもきっと関心をお持ちになることだろう。"
 pam_decision_events.0031.a: "[ROOT.Char.GetFaith.HighGodName]が我が[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]を永遠に愛し給わんことを。"
 any_landed_duchy_title_tt: "あなたが保有する[duchy|E]のうち、少なくとも1つが[landed|E]の[title|E]である#weak #EMP（[clerical_region|E]または[noble_family|E]ではない）#!#!"
