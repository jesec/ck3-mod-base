 pam_promulgate_word_of_pious_deeds_decision: "敬虔な善行を広く知らしめる"
 pam_promulgate_word_of_pious_deeds_decision_desc: "尚書局は、私のキリストのごとき善行を称える頌辞を編纂した。自らの美徳を称えるのは見苦しいことではあるが、側近たちは私の敬虔さをすべての[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]に知らせることを望んでいる。\n\nそうなれば、私こそが聖ペトロの玉座…さらにはその先へと昇るに最もふさわしい[ROOT.Char.GetWomanMan]だという評判が広まるかもしれない。"
