 decision_every_clerical_region_ruler_evangelized_personal_tenet_tt: "[clerical_region.GetName]内の伝道を受けたすべての[ruler|E]（[evangelized_clerical_region_rulers_count]人）：\n$BULLET_WITH_TAB$#V [actor.MakeScope.ScriptValue('pam_evangelize_tenet_adoption_chance_value')|0]%#!の確率で[selected_item.GetNameNoTooltip(actor.GetRite)]を[personal_tenet|E]として採用する"
