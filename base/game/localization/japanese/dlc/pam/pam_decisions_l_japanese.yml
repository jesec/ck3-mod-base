 pam_permit_tenet_decision_desc: "長らく信徒の間で密かに語り継がれてきた教えに、今こそ正式な承認を与えるべき時が来た。[ROOT.Char.GetFaith.HighGodNamePossessive|U]の祝福をこの[core_tenet|E]に授け、これを[permitted_tenet_status|E]しよう。"
