 pam_bull_events.0001.t: "[GetCurrentDate.GetYear]年の教皇勅書"
 pam_bull_events.0001.desc: "「私は汝らすべてに、[title.GetName]の異教徒に立ち向かい、その圧政からこの土地を解放して、捕らわれの身となった幾千もの同胞をその手から救い出すよう切に求める」\n\n「それによって汝らの時代にキリスト者の名誉がさらに高まり、全世界に称賛される汝らの武勇が、損なわれぬまま揺るぎなく保たれんことを」"
 pam_bull_events.0001.a: "#EMP イン・ノミネ・ドミニ。#!"
 pam_bull_events.0001.a.flavor: "#EMP 主の御名において。#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "「[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]を信仰する者は皆知るがよい。今や[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]の許しの下で、それが認められているということを」"
 pam_bull_events.0002.desc.tenet_forbidden: "「[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]の教義は、もはや我々の中に居場所を持たない。これを実践する者は皆、教会の神聖さを侵し、死に至る罪を犯していると知るがよい」"
 pam_bull_events.0002.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0002.a.flavor: "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0003.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0003.desc: "「[heresy_rite.GetName]の邪悪を終わらせるため、使徒座の権限により、私は彼らすべてを異端者と断罪し、永遠の破門に処する——"
 pam_bull_events.0003.desc.heresiarch: "そして、その首領である[heresiarch.GetTitledFirstName]は、異端首謀者として知られることになる」"
 pam_bull_events.0003.desc.no_heresiarch: "今後何世紀にもわたって」"
 pam_bull_events.0003.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0003.a.flavor: "$pam_bull_events.0001.a.flavor$"
 IN_NOMINE_DOMINI_GLOSS: "主の御名において。"
 pam_bull_events.0004.opening: "[ROOT.GetCharacter.GetFaith.GetAdjectiveNoTooltip]の信者たる[ROOT.GetCharacter.GetTitledFirstNameNoTooltip]へ、"
 pam_bull_events.0004.desc.crusade: "あなたたち全員に、[title.GetName]の異端派に立ち向かうよう強く勧告する。"
 pam_bull_events.0004.desc.heresy: "これより[heresy_rite.GetName]を破門とし、その信徒は異端者であることを万人に知らしめよ。"
 pam_bull_events.0004.desc.tenet_permitted: "「[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]を信仰する者は皆知るがよい。今や[bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip]の許しの下で、それが認められているということを」"
 pam_bull_events.0004.desc.tenet_forbidden: "「本日をもって、[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]の教義は信徒の間に居場所を失う。これを実践する者は教会の神聖を冒涜し、大罪を犯すものである」"
 pam_bull_events.0004.desc.fallback: "[bull_issuer.GetTitledFirstName]は、この宗派のすべての統治者に対し、新たな教皇勅書を発布した。"
 pam_bull_events.0004.a: "それで構わない。"
 pam_bull_events.0004.b: "[bull_issuer.GetRite.GetNameNoTooltip]に改宗する。"
 pam_bull_events.0004.c: "[ROOT.GetCharacter.GetFaith.HighGodName]の御名において！"
