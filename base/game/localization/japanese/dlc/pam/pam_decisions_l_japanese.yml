 pam_unite_miaphysite_churches_decision_desc: "信条を同じくしながらも、合性論派の教会は長きにわたり、それぞれの最高位聖職者のもとで別々の道を歩んできた。牧者たちを調和のもとに束ねることができれば、信徒らを完全なる統合から隔てるものは何ひとつなくなるだろう。"
