 pam_kingdom_of_heaven.0001.t: "天の王国"
 pam_kingdom_of_heaven.0001.desc: "「神の国は次のようなものである。誰かが地に種を蒔き、朝晩、寝起きを繰り返しているうちに、種は芽を出し、成長する。だがどうしてそうなるのか、その人は知らない」\n\n私はキリスト教徒たちに体を向け、指で聖地の土を掴む。\n\n「地はひとりでに実を結ばせ、まず茎が伸びる」私はそう言って手を開き、土を風に散らす。「次に穂ができる」私は民を指す。「そして穂は豊かな実をつける」私は司教杖を掲げる。\n\n「しかし実が熟せば…人はすぐに鎌を入れる。収穫の時が来たからである」"
 pam_kingdom_of_heaven.0001.a: "私は[previous_capital.GetNameNoTooltip]を放棄しない。"
 pam_kingdom_of_heaven.0001.b: "聖ペトロの座など、キリストの座に比べれば何だというのか？"
