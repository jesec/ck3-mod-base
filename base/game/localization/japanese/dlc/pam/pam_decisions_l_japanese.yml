 pam_raise_khachkar_decision: "ハチュカルを建立する"
 pam_raise_khachkar_decision_desc: "[GetTenetType('tenet_khachkar').GetName( ROOT.Char.GetRite )]は、死者は石に刻んでこそ最も手厚く悼むことができるという信仰に基づいている。血族を追悼するため、装飾を施した十字架を建立しよう。それによって生者と死者、そしてこの大地を一つに結びつけるのだ。"
 pam_raise_khachkar_decision_tooltip: "あなたの[counties|E]の1つに[GetModifier('pam_khachkar_ancestral_county').GetName]を建立するよう依頼する。"
 pam_raise_khachkar_decision_confirm: "石に刻んで記念する"
 pam_raise_khachkar_decision_warning: "@warning_icon! #X ハチュカルは、[county|E]があなたの[dynasty|E]に属さない人物の手に渡った場合、破壊されます#!"
 pam_khachkar_grant_title_warning: "@warning_icon! #X [recipient.GetShortUIName]はあなたの[dynasty|E]に属していないので、[target.GetNameNoTier]のハチュカルが破壊されます！#!"
