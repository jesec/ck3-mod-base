 pam_decision_events.0021.t: "生ける御言葉"
 pam_decision_events.0021.desc: "[ROOT.Char.Custom('GetFaithTemple')]にはもはや跪く余地すらない。巡礼者は[ROOT.Char.GetFaith.PriestNeuterPlural]と、男爵は乞食と肩を並べてひしめき合い、入口にはさらに人波が押し寄せている。\n\n私の行いは、どんな年代記編者も追いつけぬほど事細かに数え上げられている——歩いたすべての道、守ったすべての徹夜の祈り、[ROOT.Char.GetFaith.HighGodNamePossessive]の名のもとに捧げたすべての硬貨に至るまで。一人の[ROOT.Char.GetFaith.PriestNeuterPlural]が私の手を取り、[ROOT.Char.GetFaith.HighGodNamePossessive]の祭壇に押し当てる。「お話しください。我々は耳を傾けます」\n\nその後に続く静寂は私のものだ。この静寂を満たす私の言葉は、この壁を越えて響き渡るだろう。"
 pam_decision_events.0021.a: "慈悲を私の説教としよう。"
 pam_decision_events.0021.b: "私は炎と剣をもって御言葉を広める。"
 pam_herald_shepherd_of_the_faithful_modifier: "信徒の羊飼い"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "この人物は慈悲の言葉によって聖なる使命を宣言し、信徒たちから崇敬されている。"
 pam_herald_fire_and_sword_modifier: "炎と剣"
 pam_herald_fire_and_sword_modifier_desc: "この人物は自らの聖なる天命を戦闘への呼びかけとして宣言し、信仰の戦士たちがその旗のもとに結集している。"
 pam_convert_to_theocracy_decision: "神権制統治を採用する"
 pam_convert_to_theocracy_decision_desc: "現在の階級制度は、[ROOT.Char.GetFaith.GoodGodNames]が定めた秩序を歪めたものだ。私はこれを正す唯一の道を授かった。それは、[ROOT.Char.GetFaith.GoodGodNames]を称え、同時に民に対する務めを果たすものでもある。これこそが[ROOT.Char.GetFaith.GoodGodNames]の御言葉である。"
 pam_convert_to_theocracy_decision_confirm: "[ROOT.Char.GetFaith.HighGodNamePossessive|U]の権威を振るう"
 pam_convert_to_theocracy_decision_tooltip: "あなたの[government|E]を[theocracy|E]に変更する"
 pam_convert_theocracy_to_feudal_decision: "世俗統治を復活させる"
 pam_convert_theocracy_to_feudal_decision_desc: "名目上、[ROOT.Char.GetFaith.HighGodNamePossessive|U]の法を司る立場にある私に、[ROOT.Char.GetFaith.GetAdherentNamePlural]は霊的な導きを求めている。しかし私はその務めにふさわしい者ではない。そうした裁定は[ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]に委ねよう。\n\n私の本分は世俗の政にある。ゆえに世俗の王冠を戴くべきなのだ。民に知らしめよ。統治するのは私であり、[ROOT.Char.GetFaith.PriestNeuterPlural]でも、ましてや[ROOT.Char.GetFaith.HighGodName]でもない。"
 pam_convert_theocracy_to_feudal_decision_tooltip: "[realm|E]を[theocracy|E]ではなく[feudal|E]に変更する"
 pam_convert_theocracy_to_feudal_decision_confirm: "領国を再び人の手に取り戻す"
