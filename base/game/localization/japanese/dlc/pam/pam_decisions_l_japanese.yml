 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "あなたは[recipient.GetShortUINamePossessive]の[head_of_rite|E]であるが、その[liege|E]の[head_of_rite|E]ではない"
 pam_personal_sacrifice_of_wealth_decision: "富を捧げる"
 pam_personal_sacrifice_of_wealth_decision_desc: "自分の富の一部を信仰の証として捧げ、自らの保護下にある伯爵領の発展を促す。"
 pam_personal_sacrifice_of_wealth_decision_tooltip: "[gold|E]を消費して選択した[county|E]の[development_growth|E]を増加させ、[spiritual_fulfillment|E]を獲得する"
 pam_personal_sacrifice_of_wealth_decision_confirm: "捧げる"
 pam_personal_sacrifice_of_wealth_decision_toast: "信仰への投資がなされた"
 pam_develop_clerical_court_decision: "聖職者の廷臣を教育する"
 pam_develop_clerical_court_decision_desc_christian: "怠惰な僕では[ROOT.Char.GetFaith.HighGodName]にお仕えする役に立たない。一族の者を集めよう——ふさわしき者を叙任し、叙任された者を教育し、修道見習いを我が門前に呼び寄せるのだ。"
 pam_develop_clerical_court_decision_desc: "怠惰な僕は[ROOT.Char.GetFaith.HighGodName]に何の栄誉ももたらさない。一族の者を集めよう——ふさわしき者を[clergy|E]に取り立て、仕える者を教育し、修道見習いを我が門前に呼び寄せるのだ。"
 pam_develop_clerical_court_decision_tooltip: "宮廷の[clergy|E]を叙任、教育、または採用する"
 pam_develop_clerical_court_decision_confirm: "一族を招集する"
 pam_develop_clerical_court_decision_tt: "あなたは一族を招集し、以下のいずれか#EMP 一つ#!を選択する：\n$EFFECT_LIST_BULLET$最大[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]人の在家の[courtiers|E]が[clergy|E]に加わり、それぞれが追加の[piety_i] [piety|E]をもたらす\n$EFFECT_LIST_BULLET$最大[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]人の宮廷[clergy|E]が[learning_i] [learning|E]および[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]または[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]の[trait|E]/[trait_level_track_xp|E]を獲得する\n$EFFECT_LIST_BULLET$周辺地域から最大[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]人の修道見習いがあなたの宮廷と[clergy|E]に加わる\n\nどの道を選んでも、あなたは[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0]の[piety_i] [piety|E]を獲得する\n\n#weak 報酬はあなたの[learning|E]、[piety_level|E]、宗教[traits|E]に応じて増加する。また、稀に特別な機会が訪れることもある#!"
 pam_develop_clerical_court_decision_candidates_tt: "叙任または教育に適した[courtier|E]がいるか、ふさわしい候補者が近隣にいる"
 pam_clerical_court_joins_clergy_tt: "[pam_clerical_patron.GetFaith.GetName]の[clergy|E]に加わる"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName]が聖職者に加わる"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName]が知識を深める"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName]が呼びかけに答える"
 pam_oblate_patron_reason: "修道見習いの名高い後援者"
 pam_oblate_patron_modifier: "修道見習いの後援者"
 pam_oblate_patron_modifier_desc: "この人物は、神への奉仕に導かれた者たちを支援することで名を知られている。誓願にかかる費用は少なくなり、親たちはより進んで子供を手放す。"
 pam_scriptorium_modifier: "書記官の館"
 pam_scriptorium_modifier_desc: "この人物は書記官たちを集めた館を構えており、その仕事によって学識ある者たちが首都へと引き寄せられている。"
 pam_decision_events.0032.t: "群れの世話"
 pam_decision_events.0032.desc.intro.christian: "私は一族の事務官と聖職者に呼びかけ、誰を叙任すべきか、そして誰がまだ導きを必要としているかを見極める。"
 pam_decision_events.0032.desc.intro: "私は宮廷で[ROOT.Char.GetFaith.GetName]に仕える者たちに呼びかけ、誰がその務めに就くべきか、そして誰が導きを必要としているかを見極める。"
 pam_decision_events.0032.desc.pupil: "\n\n私の弟子、[pam_clerical_pupil.GetFirstName]は、自らの価値を証明しようと、立って祈りを捧げる。"
 pam_decision_events.0032.desc.no_pupil: "\n\n彼らのうち、信仰への奉仕に身を投じた者はあまりにも少ない——その不足を私は解消するつもりだ。"
 pam_decision_events.0032.desc.novice: "\n\n我が一族の外から、[pam_clerical_novice.GetFirstName]という志ある見知らぬ者が、信仰に仕える場を懇願している。"
 pam_decision_events.0032.desc.outro.christian: "\n\n[ROOT.Char.GetFaith.HighGodName]が託したこの群れを、私はいかに導くべきだろうか？"
 pam_decision_events.0032.desc.outro: "\n\n[ROOT.Char.GetFaith.HighGodName]が託した者たちを、私はいかに育てるべきだろうか？"
 pam_decision_events.0032.prodigy: "私の弟子には神の賜物が備わっている！"
 pam_decision_events.0032.oblates: "神に仕える道を志す者を、私が歓迎していることを皆に知らしめよ。"
 pam_decision_events.0032.piety: "彼らの信仰が、私自身の信仰を強めている。"
 pam_decision_events.0032.novice: "有望な魂だ——ただちに[pam_clerical_novice.GetHerHim]を受け入れよ。"
 pam_decision_events.0032.miracle: "人々は私の弟子が奇跡を起こすと言っている。"
 pam_decision_events.0032.relic.christian: "この聖典は我が宝物庫に納められるべきだ！"
 pam_decision_events.0032.relic: "これらの書物で私の宮廷を豊かにせよ。"
 pam_decision_events.0032.language: "私の弟子に聖典を学ばせよ。"
 pam_decision_events.0032.scriptorium.christian: "写字室のすべての羽根ペンを働かせよ。"
 pam_decision_events.0032.scriptorium: "私の宮廷のすべての書記官を働かせよ。"
 pam_decision_events.0032.a.christian: "我が一族の中で最もふさわしい者を叙任せよ。"
 pam_decision_events.0032.a: "我が一族の中で最もふさわしい者を、信仰に仕える者へと取り立てよ。"
 pam_decision_events.0032.a.tt: "あなたの最も学識ある在家の[courtiers|E]#weak （親族含む）#!のうち、最大[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]人がそれぞれ：\n$EFFECT_LIST_BULLET$[pam_clerical_patron.GetFaith.GetName]の[clergy|E]に加わる\n$EFFECT_LIST_BULLET$[learning_i] [learning|E]およびあなたに対する[opinion|E]を獲得する\n$EFFECT_LIST_BULLET$あなたに[piety_i] [piety|E]をもたらす"
 pam_decision_events.0032.b: "すでに私の庇護下にある聖職者を指導する。"
 pam_decision_events.0032.b.tt: "あなたの最も学識ある宮廷[clergy|E]のうち、最大[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]人がそれぞれ：\n$EFFECT_LIST_BULLET$[learning_i] [learning|E]を獲得する #weak （最大[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0]）#!\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]または[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]の[trait|E]を獲得または進展させる"
 pam_decision_events.0032.c.named: "[pam_clerical_novice.GetFirstNameNoTooltip]を受け入れ、修道見習いを歓迎すると知らせよう。"
 pam_decision_events.0032.c: "修道見習いを歓迎すると知らせよう。"
 pam_decision_events.0032.c.tt: "周辺地域からの最大[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]人の修道見習いがそれぞれ：\n$EFFECT_LIST_BULLET$あなたの宮殿および[pam_clerical_patron.GetFaith.GetName]の[clergy|E]に加わる\n$EFFECT_LIST_BULLET$あなたの[rite|E]に改宗する"
 pam_seize_capital_clerical_region_decision: "聖職管区を奪取する"
 pam_seize_capital_clerical_region_decision_desc: "私自身の首都は、私が保有していない[clerical_region|E]内にある。私が統治する座の上に座る[archbishop|E]など存在してはならない。その[title|E]は[head_of_faith|E]のもとにこそあるべきだ。"
 pam_seize_capital_clerical_region_decision_tooltip: "あなたの首都がある[clerical_region|E]を取得し、空位でない場合はその[archbishop|E]を廃位する"
 pam_seize_capital_clerical_region_decision_confirm: "管区を獲得する"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName]は退位させられる"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName]があなたの手に渡る"
