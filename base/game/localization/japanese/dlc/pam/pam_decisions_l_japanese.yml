 pam_proclaim_crusade_age_tenet_decision_confirm: "信徒たちを進軍させる"
 pam_secure_pilgrim_routes_decision: "巡礼路の安全を確保する"
 pam_secure_pilgrim_routes_decision_desc: "聖地への道は危険なものとなっている。信徒が巡礼に武器を携行してよいと宣言することで、我々は旅人を守り、キリスト教世界全体に信仰心を呼び起こすことができる。"
 pam_secure_pilgrim_routes_decision_tooltip: "[GetTenetType('tenet_armed_pilgrimages').GetBaseName]を中核の[core_tenet|E]として採用する"
 pam_secure_pilgrim_routes_decision_confirm: "巡礼路の安全を確保する"
