 pam_decision_events.0009.t: "聖なる統治"
 pam_decision_events.0009.desc: "私は[ROOT.Char.Custom('ReligiousHeadHeadgear')]を恭しく頭に戴き、敬虔な[ROOT.Char.GetFaith.GetAdherentNamePlural]の前へ進み出る。\n\n「封土と勅書による古き統治は、これまで十分に機能してきた。だがそれは、やがて我らを正しき道から遠ざけるようになった。[ROOT.Char.GetFaith.HighGodName]の御言葉こそが、我らが[ROOT.Char.GetPrimaryTitle.GetNameNoTier]をいかに治めるべきかを示している。私は[ROOT.Char.GetFaith.HighGodName]の卑しき僕にすぎず、皆もまた同じである」"
 pam_decision_events.0009.a: "[new_capital.GetNameNoTierPossessiveNoTooltip]の[ROOT.Char.Custom('GetFaithTemple')]を新たな首都とする！"
 church_holding_as_new_capital: "[new_capital.GetName]を[realm_capital|E]に設定する"
 pam_decision_events.0009.b: "これは[ROOT.Char.GetFaith.HighGodName]の御心である。"
