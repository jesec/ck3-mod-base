 pam_prohibit_tenet_decision: "信条を禁止する"
 pam_prohibit_tenet_decision_desc: "正道を外れた教えは、その正体を明らかにしなければならない。[core_tenet|E]を[prohibited_tenet_status|E]とし、信徒がこれを避けるよう知らしめよう。"
 pam_prohibit_tenet_decision_tooltip: "[ROOT.Char.GetFaith.GetName]において[core_tenet|E]を[prohibited_tenet_status|E]とし、これを同じ宗派に属するすべての統治者へ布告する。"
