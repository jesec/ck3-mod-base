 pam_secure_pilgrim_routes_pilgrim_xp_tt: "今後#V 25年間#!、すべての[GetFaithByKey('catholic').GetAdherentNamePlural]は、[pilgrimages|E]から獲得する[GetTrait('pilgrim').GetName( GetPlayer )]の[trait|E][experience|E]が増加する"
 pam_secure_pilgrim_routes_ai_pilgrimage_tt: "#weak 今後#V 25年間#!、[GetFaithByKey('catholic').GetAdjective]の[rulers|E]が[pilgrimages|E]を行う可能性が高くなる#!"
 pam_secure_pilgrim_routes_ai_pilgrimage: "安全な巡礼路"
