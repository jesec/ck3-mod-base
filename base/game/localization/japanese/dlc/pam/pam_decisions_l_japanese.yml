 pam_decision_events.0008.desc.intro: "我が支配下にある[ROOT.Char.GetFaith.HouseOfWorshipPlural]に、膨れ上がった金庫が鎮座している。衛兵たちが聖堂に踏み込む音に続いて、まもなく硬貨の触れ合う音が響き渡った。\n\n"
 pam_decision_events.0008.desc.chaplain: "「[ROOT.Char.GetTitleAsNameNoTooltip|l]ともあろうお方が、[ROOT.Char.GetFaith.HighGodName]の僕たちを辱めてお喜びなのですか？」と[chaplain.GetTitledFirstName|U]は非難する。「[ROOT.Char.GetFaith.HighGodName]の家を、まるで#EMP 下賤な#!娼婦のように裸にして、快楽を感じておられるのですか？」"
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]は嫌悪のあまり顔を背けた。だが[ROOT.Char.GetFaith.HighGodName|U]の僕たちは、[gold|e]に強い関心を抱いているようだ。"
