 pam_renounce_papal_candidacy_decision_embrace: "[ROOT.Char.GetFaith.ReligiousHeadTitleName]の座を目指す"
 pam_renounce_papal_candidacy_decision_desc_renounce: "生涯をかけて[ROOT.Char.GetFaith.ReligiousHeadName]の座を目指す者もいるが、その出世争いが彼らに何をもたらすのかを私は見てきた。\n\n次の[ROOT.Char.GetFaith.ReligiousHeadName]選挙には立候補しないと、[cardinal|E]たちに伝えよう。我が務めは、ここに——我が主教座にある。"
 pam_renounce_papal_candidacy_decision_desc_embrace: "かつて私は、[ROOT.Char.GetFaith.ReligiousHeadName]の座には立候補しないと表明した。当時、私はまだ若かったし、[ROOT.Char.GetFaith.GetName]も寛大な指導者の手に委ねられていたからだ。\n\nやはり、ぜひとも立候補したいと、[cardinal|E]たちに伝えよう。"
