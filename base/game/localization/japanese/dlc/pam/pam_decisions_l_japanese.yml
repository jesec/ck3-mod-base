 pam_decision_events.0015.t: "敬虔な善行を広く知らしめる"
 pam_decision_events.0015.desc.intro.no_praiser: "忠実な司祭たちが"
 pam_decision_events.0015.desc.intro.praiser: "有力な[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))]である[my_praiser.GetTitledFirstName]が"
 pam_decision_events.0015.desc.intro: "[GetDomicileBuilding('chancery_01').GetName]が作成した頌辞を披露した。\n\n「善き行いは、主が蒔かれた種のようなもの。その種は芽吹き、敬虔なる実りをもたらす。[praise_worthy_priest.GetName]が高潔さと"
 pam_decision_events.0015.desc.virtuoustrait: "[my_virtuous_trait.GetName(praise_worthy_priest)]の"
 pam_decision_events.0015.desc.mid: "美徳を備え、常に"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]に導かれて歩んできたことを、誰もが知るべきである」"
 pam_decision_events.0015.desc.novirtuoustenet: "神に導かれて歩んできたことを、誰もが知るべきである」"
 pam_decision_events.0015.desc.bad: "\n\n称賛の言葉があろうと、私の心は地獄の業火を恐れている。"
 pam_decision_events.0015.desc.good: "\n\nまことに私は主の道具であり、この世における主の美の現れである。"
 pam_decision_events.0015.desc.neutral: "\n\n称賛の言葉があろうと、私の魂が主の御心にかなうかどうかは、死して初めて知ることになる。"
 pam_decision_events.0015.desc.outro: "\n\n「…[praise_worthy_priest.GetHerHis]はその義なる行いゆえ、いつの日か教会を導くにふさわしき者となるだろう！」"
 pam_decision_events.0015.b: "「私の名には数多くの奇跡が刻まれている」"
 pam_decision_events.0015.b.flavor: "列聖される可能性があるというのに、教皇で満足する必要があるだろうか？"
 pam_decision_events.0015.b.tt: "死後に#V 列聖される確率が上昇#!\n#weak [dynasty|E]の列聖が必要#!"
 pam_decision_events.0015.c: "主が私の統治をお望みならば…"
 pam_decision_events.0015.c.flavor: "…この使命を果たさねばならない"
 pam_decision_events.0015.c.tt: "[praise_worthy_priest_superior_title.GetName]の#V 選出スコアが増加#!する：#P +30#!"
 pam_decision_events.0015.d: "他の名は一切口にさせるな。"
 pam_decision_events.0015.d.flavor: "我が信仰心の蓄えをすべてつぎ込むのだ。二番手にはなるつもりはない。"
 pam_decision_events.0015.d.tt: "[praise_worthy_priest_superior_title.GetName]の#V 選出スコアが増加#!する：#P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!（$theocratic_elective_populist$として首位に立てる）\n[piety|E]が@piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0]必要"
