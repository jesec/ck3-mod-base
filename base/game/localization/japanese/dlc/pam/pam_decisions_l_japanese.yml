l_japanese:
 pam_invite_syncretic_exiles_decision: "習合主義の亡命者を迎え入れる"
 pam_invite_syncretic_exiles_decision_desc: "我々が尊重する宗教の亡命者の集団が、安全に暮らせる地を求めて彷徨っている。彼らを我が領国に迎え入れ、定住させて、その伝統を分かち合うことができる。"
 pam_invite_syncretic_exiles_decision_tooltip: "あなたの個人的な習合主義において認められた宗教系統の亡命者を迎え入れ、[development|E]を上昇させるとともに、地域の[faith|E]または[rite|E]を変化させる。\n\n大量の[piety|E]が必要。"
 pam_invite_syncretic_exiles_decision_confirm: "亡命者を迎え入れる"
 pam_invite_syncretic_exiles_decision_effect: "亡命者の一団があなたのもとを訪れ、[counties|E]への定住を願い出る。受け入れると[development|E]が上昇するとともに、地域の[faith|E]または[rite|E]が変化する。"
 pam_invite_syncretic_exiles_no_pool: "迎え入れることのできる該当宗教の亡命者がいない"
 SELECT_TENET: "信条を選択"
 REPLACE_TENET: "信条を置き換え"
 SELECT_HOLY_SITE: "聖地を選択"
 puppet_cost_desc: "[Character.GetName]、"
 pam_decision_confession_name: "告解を受ける"
 pam_decision_confession_name_low: "己の罪を告白する"
 pam_decision_confession_desc: "人は自らの罪を自覚したとき、その罪を告白しなければならない。"
 pam_decision_confession_tooltip: "あなたの罪を告白する"
 pam_decision_confession_tooltip_sp_effect: "あなたはいくらか[spiritual_fulfillment|E]を得る"
 pam_decision_confession_tooltip_stress_effect: "あなたの[stress|E]がいくらか減少する"
 pam_decision_confession_confirm: "[ROOT.Char.GetFaith.PriestNeuter]を呼び寄せる"
 sp_confession_decision_tooltip: "あなたの[spiritual_fulfillment|E]が#V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!以上である"
 pam_decision_confession_sp_court_chaplain: "あなたは[court_chaplain|E]を雇用している"
 pam_decision_events.0001.t: "告白"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName]は誰もいない礼拝堂でじっと待っている。\n\n"
 pam_decision_events.0001.desc.bad: "[chaplain.GetHerHis|U]の厳しい眼差しは、父なる神が持つであろうそのままの眼差しだ。"
 pam_decision_events.0001.desc.good: "私が背負う荷は重くはないが、軽くするに越したことはない。"
 pam_decision_events.0001.desc.neutral: "家畜のように道を見失い、自分の心の善良さにも自信を持てぬまま、私は[chaplain.GetHerHim]に歩み寄る。"
 pam_decision_events.0001.desc.sin.preamble: "\n\n自分の罪から感じるこの罪悪感は、私にとって初めてのものではない。"
 pam_decision_events.0001.desc.sin.lustful: "私は欲望に身を任せてしまった。"
 pam_decision_events.0001.desc.sin.chaste: "私は貞節を、義務から逃れるための冷たい隠れ家にしてしまった。"
 pam_decision_events.0001.desc.sin.gluttonous: "私は節操もなく肉欲を満たしてしまった。"
 pam_decision_events.0001.desc.sin.temperate: "私の節制は、必要なものすら拒む頑ななものになってしまった。"
 pam_decision_events.0001.desc.sin.greedy: "与えるべき時に、私は金に執着してしまった。"
 pam_decision_events.0001.desc.sin.generous: "私の施しは分別を超え、私は文無しとなってしまった。"
 pam_decision_events.0001.desc.sin.lazy: "怠惰によって、私は祈りと義務を怠ってきた。"
 pam_decision_events.0001.desc.sin.diligent: "仕事に熱意を注ぎすぎて、私は慈悲の心を閉め出してしまった。"
 pam_decision_events.0001.desc.sin.wrathful: "怒りのあまり、私は罪を犯してしまった。"
 pam_decision_events.0001.desc.sin.calm: "私の平静さは、美徳を装った無関心だ。"
 pam_decision_events.0001.desc.sin.patient: "忍耐しているつもりが、臆病な先延ばしになってしまっている。"
 pam_decision_events.0001.desc.sin.impatient: "苛立ちから、私は辛辣かつ短慮になってしまった。"
 pam_decision_events.0001.desc.sin.arrogant: "高慢さによって、私は思い上がってしまっている。"
 pam_decision_events.0001.desc.sin.humble: "偽りの謙遜によって、私は真実から遠ざかってしまっている。"
 pam_decision_events.0001.desc.sin.deceitful: "私は嘘を重ね、正直に打ち明けるべきことを隠してきた。"
 pam_decision_events.0001.desc.sin.honest: "私の正直すぎる言葉が、優しく接するべき相手を傷つけてきた。"
 pam_decision_events.0001.desc.sin.craven: "恐怖のあまり、私は正しい道を捨ててしまった。"
 pam_decision_events.0001.desc.sin.brave: "私は大胆にふるまうあまり慎重さを失い、無謀になってしまっている。"
 pam_decision_events.0001.desc.sin.shy: "臆病さゆえに、私は為すべき善行すら怠ってしまっている。"
 pam_decision_events.0001.desc.sin.gregarious: "人付き合いを優先するあまり、私は良心を見失ってしまっている。"
 pam_decision_events.0001.desc.sin.ambitious: "野心に駆られるあまり、私は良心を顧みなくなってしまった。"
 pam_decision_events.0001.desc.sin.content: "満足感に甘んじ、私は正義を追い求めることを忘れてしまっている。"
 pam_decision_events.0001.desc.sin.arbitrary: "私は正義ではなく、気まぐれによって統治してきた。"
 pam_decision_events.0001.desc.sin.just: "私の正義は無慈悲で、高慢なものになってしまっている。"
 pam_decision_events.0001.desc.sin.cynical: "冷笑的な心が、私の信仰を蝕んでしまった。"
 pam_decision_events.0001.desc.sin.zealous: "私の熱意は、慈愛よりも激しく燃え上がってしまっている。"
 pam_decision_events.0001.desc.sin.paranoid: "疑念の心が、私の人間関係を蝕んでしまっている。"
 pam_decision_events.0001.desc.sin.trusting: "信頼のあまり、私は邪悪さを見過ごしてきた。"
 pam_decision_events.0001.desc.sin.compassionate: "哀れみから、私は非難すべきことまで容認してきた。"
 pam_decision_events.0001.desc.sin.callous: "人々の苦悶を前に、私は頑なに心を閉ざしている。"
 pam_decision_events.0001.desc.sin.stubborn: "頑固さゆえに、私は忠告に耳を貸さなくなった。"
 pam_decision_events.0001.desc.sin.fickle: "移り気のため、私の言葉は信頼できないものになってしまっている。"
 pam_decision_events.0001.desc.sin.eccentric: "私の奇抜な振る舞いが、信徒たちを憤慨させている。"
 pam_decision_events.0001.desc.sin.vengeful: "私は復讐心で一杯になってしまった。"
 pam_decision_events.0001.desc.sin.forgiving: "私は重大な過ちを、あまりにも軽々しく許してきた。"
 pam_decision_events.0001.desc.sin.sadistic: "私は残酷な行いに快楽を見出すようになってしまった。"
 pam_decision_events.0001.desc.outro: "\n\n「[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]」"
 pam_decision_events.0001.a: "[ROOT.Char.GetFaith.HighGodName]よ、お許しください。私は罪を犯しました。"
 pam_john_20_22_english: "聖霊を受けなさい。誰の罪でも、あなた赦せばその罪は赦される。誰の罪でも、あなたが赦さなければ、その罪は残る。"
 JOHN_20_22_GLOSS: "#weak ヨハネ20章22～23節（新改訂標準訳聖書・更新版）#!"
 pam_decision_act_of_devotion: "信仰心を誇示する"
 pam_decision_act_of_devotion_desc: "私は[ROOT.Char.GetFaith.HighGodName]と霊的に深く結ばれている。この絆を、ぜひとも世に知らしめねばならない！\n\n[ROOT.Char.GetFaith.PriestNeuterPlural]を召集し、盛大なミサを執り行い、領国中のすべての人々を呼び集めよ。主君たる私がいかに敬虔であるかを、皆に見せつけるのだ。"
 pam_decision_act_of_devotion_desc_tooltip: "[piety|E]を引き換えに[prestige|E]を得る"
 pam_decision_act_of_devotion_tooltip_effect: "以下のいずれかを選択：\n$BULLET_WITH_TAB$[prestige_i] #P [EmptyScope.ScriptValue('major_prestige_gain')|0]#!の[prestige|E]\n$BULLET_WITH_TAB$1[piety_level|E]と引き換えに、[prestige_i] #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#!の[prestige|E]と追加の[prestige_level|E]"
 pam_decision_act_of_devotion_confirm: "鐘を鳴らせ！"
 pam_decision_act_of_devotion_sp_tooltip: "あなたの[spiritual_fulfillment|E]が#V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!以上である"
 pam_decision_act_of_devotion_fame_tooltip: "あなたの[prestige_level|E]が[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]より低くなければならない"
 pam_confession_penalty_modifier: "告解の代償"
 pam_confession_penalty_modifier_desc: "この人物は、自らの告解師の求めに応じた行動を取らなければならない"
 pam_meddled_in_clerical_appointments_modifier: "聖職者叙任への介入"
 pam_meddled_in_clerical_appointments_modifier_desc: "この[ruler|E]は[clerical_title|E][holder|E]を強引に交代させ、[clergy|E]の怒りを買った。"
 pam_kowtowed_to_pope_modifier: "教会への屈従"
 pam_kowtowed_to_pope_modifier_desc: "この[ruler|E]は教会に屈し、[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]を終結させる会議にて#EMP 聖職的、取り消し可能#!の教義を支持することを誓約した。この補正は、会議がその論争を解決した時点で解除される。"
 pam_kowtow_to_pope_decision: "[ROOT.Char.GetFaith.ReligiousHeadName]に屈従する"
 pam_kowtow_to_pope_decision_desc: "聖職位の任免権をめぐり、王冠と司教杖が激しく対立している。公然と反抗する危険を冒すよりも、[ROOT.Char.GetFaith.ReligiousHeadName]に屈服し、事態を収拾するために招集される大会議において、信徒たちと共に立て。"
 pam_kowtow_to_pope_decision_tooltip: "教会の叙任権の主張を支持することを誓約する"
 pam_kowtow_to_pope_decision_confirm: "屈従する"
 pam_kowtow_to_pope_effect_tt: "あなたが[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]を終結させる会議にて#EMP 聖職的、取り消し可能#!の教義を支持することを誓約する"
 pam_kowtow_to_pope_not_already_pledged_tt: "あなたが教会を支持することをまだ誓約していない"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "あなたの[faith|E]には[head_of_faith|E]が必要である"
 pam_kowtow_to_pope_toast: "あなたは[ROOT.Char.GetFaith.ReligiousHeadName]に屈従する"
 pam_decision_events.0001.a.confession_random_outcome: "あなたの[court_chaplain|E]は何かを求めてくるかもしれない。あるいは、あなたは告解の最中に何かを耳にするかもしれない…"
 pam_decision_events.0001.a.piety: "あなたの告白は心からのもののようだ"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName]は新しい情報を知った"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName]はあなたの罪深い性質を良しとしない"
 pam_decision_events.0001.a.courtier_secret: "あなたは[my_courtier.GetShortUIName]が告解を受けているのを耳にする"
 pam_decision_events.0001.a.random_confession: "あなたは他人が告解を受けているのを耳にする"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.GetShortUIName]はあなたに[pilgrimage|E]へ赴くよう求めている"
 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUIName]はあなたに[GetCourtPositionType('high_almoner_court_position').GetName()]を雇用するよう求めている"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUIName]はあなたに、#V 5年#!の間いかなる攻撃的戦争も布告しないよう求めている"
 pam_confession_penalty_var.no_war_toast: "あなたはいかなる宣戦布告もしないことを約束した"
 pam_decision_events.0001.a.conversion: "[chaplain.GetShortUIName]はあなたに、[target.GetShortUIName]を改宗させるよう求めている"
 pam_decision_events.0001.a.conversion.toast: "あなたは約束を果たした"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.GetShortUIName]は約束を果たした"
 pam_decision_events.0002.t: "信仰の誇示"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName]は私の隣、祭壇の傍らに立っている。柔らかな陽光が"
 pam_decision_events.0002.desc.uncrowned: "私の衣を、あたかも聖なる外套であるかのように照らしている。"
 pam_decision_events.0002.desc.crowned: "私の王冠を後光のように照らしている。"
 pam_decision_events.0002.desc.mid: "\n\n「[ROOT.Char.Custom('RandomBibleQuote')]…」[my_chaplain.GetHerHis|U]の説教は延々と続き、"
 pam_decision_events.0002.desc.bad: "私は集中力を保つのに苦労している。"
 pam_decision_events.0002.desc.good: "聴衆の視線はまるで私だけに注がれているかのようだ。"
 pam_decision_events.0002.desc.neutral: "私は感銘を受けた者はいるかと聴衆を見回す。"
 pam_decision_events.0002.desc.outro: "\n\n「そして賢明にして高潔なる我が[ROOT.Char.GetNameNoTooltip]が、この破滅の時代にあって我々を導いてくださるでしょう」"
 pam_decision_events.0002.a: "私自らが群衆に語りかけねばならない。"
 pam_decision_events.0002.b: "軽く応じるだけで十分だろう。"
 pam_mentor_sp_decision: "霊的な導きを与える"
 pam_mentor_sp_decision_desc: "[ROOT.Char.GetFaith.HighGodNamePossessive]の光の中を歩む我々には、闇に迷う者や、若さゆえに思考や行いを誤りかねない者を導く義務がある。"
 pam_mentor_sp_decision_desc_tooltip: "子供の[spiritual_fulfillment|E]が高まるよう助ける"
 pam_mentor_sp_decision_confirm: "語れ、そして耳を傾けよ。"
 pam_mentor_sp_decision_sp_tooltip: "あなたの[spiritual_fulfillment|E]が#V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!以上である"
 pam_mentor_sp_decision_tooltip_effect: "あなたの[primary_heir|E]または[favorite_child|E]の[spiritual_fulfillment|E]が増加する"
 pam_mentor_sp_decision_valid_child_tt: "以下の条件を満たす[child|E]を持っていなければならない：\n$BULLET_WITH_TAB$あなたと[faith|E]が同じである\n$BULLET_WITH_TAB$#V 16#!才以上である\n$BULLET_WITH_TAB$あなたの[primary_heir|E]または[favorite_child|E]である\n$BULLET_WITH_TAB$[spiritual_fulfillment|E]が#V 75#!より低い\n$BULLET_WITH_TAB$これまで霊的な導きを受けたことがない"
 pam_mentor_sp_decision_primary_heir_tt: "あなたの[primary_heir|E]の要件：$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "第一後継者"
 pam_mentor_sp_decision_primary_favorite_child_tt: "あなたの[favorite_child|E]の要件：$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "寵児"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$あなたと[faith|E]が同じである\n$BULLET_WITH_TAB$#V 16#!才以上である\n$BULLET_WITH_TAB$[spiritual_fulfillment|E]が#V 75#!より低い\n$BULLET_WITH_TAB$これまで霊的な導きを受けたことがない"
 pam_decision_events.0003.t: "最も重要な教訓"
 pam_decision_events.0003.desc.intro: "夜は更け、天守は静まり返っている。私の[target_child.Custom('GetDaughterSon')]は個室礼拝堂で私の隣に座っている。\n\n私は[target_child.GetHerHim]に目を向けた。"
 pam_decision_events.0003.desc.bad: "[target_child.GetHerHis|U]の顔はげっそりとし、眼差しはうつろで、ほとんど眠っているかのようだった。\n\n「[ROOT.Char.GetMotherFather|U]上」と、[target_child.GetSheHe]はしびれを切らしたように尋ねる。「どうしてお呼びになったのですか？」"
 pam_decision_events.0003.desc.good: "[target_child.GetHerHis|U]の瞳は蝋燭の灯りに照らされて輝いている。[target_child.GetSheHe|U]は善良な[target_child.GetWomanMan]だ。\n\n「[ROOT.Char.GetMotherFather|U]上」と、[target_child.GetSheHe]は尋ねた。「私は何か過ちを犯したのでしょうか？」"
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U]。今や立派な大人だ。\n\n「[ROOT.Char.GetMotherFather|U]上」と、[target_child.GetSheHe]は静かに尋ねる。「人はどう生きれば正しくあれるのでしょう？」"
 pam_decision_events.0003.a: "腐った[ROOT.Char.GetTitleAsNameNoTooltip|l]は、すぐに[target_child.GetHerHis]の[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]を毒してしまうだろう。"
 pam_decision_events.0003.b: "ただ…善良であれ。"
 grudge_pressured_me_sp: "[CHARACTER.GetShortUIName|U]は、[CHARACTER.GetHerHis]の霊的充足について迫られたことで、[TARGET_CHARACTER.GetShortUIName]に対して怨恨を抱いた。"
 grudge_pressured_me_sp_corresponding: "[CHARACTER.GetShortUIName|U]は[TARGET_CHARACTER.GetShortUIName]の霊的充足について迫ったことで、[TARGET_CHARACTER.GetHerHis]から恨みを買った。"
 pam_decision_events.0003.after_tt: "[target_child.GetFirstName]について、何かが明らかになるかもしれない…"
 pam_decision_events.0003.secret: "[target_child.GetShortUIName]があなたに告白する"
 pam_decision_events.0003.mystic: "[target_child.GetShortUIName]がその件に強い関心を抱く"
 pam_decision_events.0003.learning: "[target_child.GetShortUIName]の知識が向上する"
 pam_decision_events.0003.education: "[target_child.GetShortUIName]の教育が向上する"
 pam_decision_events.0003.stress: "[target_child.GetShortUIName]の心が危機に陥る"
 pam_decision_events.0003.lover: "[target_child.GetShortUIName]が[lover_scope.GetShortUIName]と別れる"
 pam_decision_events.0003.trait: "[target_child.GetShortUIName]が啓示を得る"
 pam_establish_theocratic_dynasty_decision: "王朝を創設する"
 pam_establish_theocratic_dynasty_decision_desc: "ごく細やかな根でさえ、やがて最も巨大な木へと成長しうる。"
 pam_establish_theocratic_dynasty_decision_desc_tooltip: "あなたの[dynasty|E]を創設する"
 pam_establish_theocratic_dynasty_decision_confirm: "時は来た"
 pam_establish_theocratic_dynasty_decision_effects_tt: "あなたの自身の[dynasty|E]を設立する"
 pam_decision_events.0004.t: "新たなる始まり"
 pam_decision_events.0004.desc: "長年、私は軍旗の代わりに祭服を身にまとってきた。それでも地位と権力は等しく私のところに転がり込んできた。\n\nそれなのに、名家に生まれなかったというだけで、なぜ私の遺産が私と共に消え去らねばならないのだ？"
 pam_decision_events.0004.a: "#EMP [ROOT.Char.GetHouse.GetMotto]。#!"
 pam_decision_events.0004.tt: "#high [THIS.Char.GetDynasty.GetName]王朝が設立される#!"
 pam_determine_patron_saint_decision: "守護聖人を選ぶ"
 pam_determine_patron_saint_decision_desc: "天上の玉座から、聖人たちは人間の支配者たちの苦闘を見守り、我々の魂の気性を量っている。\n\nその徳が私の歩む道を形作り、その執り成しが[ROOT.GetCharacter.GetFaith.HighGodName]と人々の前で我が決断を揺るぎなきものとしてくれる守護聖人を選ぼう。"
 pam_determine_patron_saint_decision_tooltip: "あなたが生きる指針となる徳を備えた守護聖人を選ぶ"
 pam_determine_patron_saint_decision_confirm: "心は決まった。"
 pam_determine_patron_saint_decision_dulia_tt: "[GetTenetType('tenet_dulia').GetBaseName]の信条が容認されているか、[faith|E]の[core|E]である必要がある。"
 pam_determine_patron_saint_decision_personal_tenet_tt: "[personal_tenet|E]として[GetTenetType('tenet_dulia').GetBaseName]がなければならない"
 pam_determine_patron_saint_decision_peter: "教会の礎、聖ペトロ"
 pam_determine_patron_saint_decision_paul: "異邦人の使徒、聖パウロ"
 pam_determine_patron_saint_decision_john: "福音記者、聖ヨハネ"
 pam_determine_patron_saint_decision_matthew: "徴税人、聖マタイ"
