 pam_decision_events.0020.t: "[selected_item.GetNameNoTooltip(actor.GetRite)]の伝道"
 pam_decision_events.0020.desc: "[clerical_region.GetName]でのミサの後、私は一群の信徒を集め、私自身から[ROOT.Char.GetFaith.HighGodName|U]の言葉を聞かせることにした。[selected_item.GetName( actor.GetRite )]に対する私の信仰を説くため、選んだのは[ROOT.Char.GetFaith.ReligiousText|U]の一節である。\n\n「[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]」"
 pam_decision_events.0020.a: "残りは他の領主たちに向けて話そう。"
 pam_decision_events.0020.b: "次のたとえ話は我が封臣たちに捧げよう。"
