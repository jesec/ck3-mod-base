 pam_decision_last_rites_name: "終油の秘跡を受ける"
 pam_decision_last_rites_name_low: "終油の秘跡を受ける"
 pam_decision_last_rites_desc: "#EMP [ROOT.Char.GetFaith.HighGodName]よ、我を憐れみたまえ！我が咎をことごとく洗い流し、我が罪から我を清めたまえ！#!\n\nこの肉体的な存在からの旅立ちを間近に控え、私は自らの魂を正しく整えたいと願っている。地獄の影響から身を守れば、私は良き死を迎え、天国で永遠の命を得ることができるだろう。"
 pam_decision_last_rites_tooltip: "旅立ちに備えて魂の準備を整える"
 pam_decision_last_rites_tooltip_sp_effect: "あなたはいくらか@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 pam_decision_last_rites_confirm: "我が枕辺に集え"
 pam_decision_last_rites_sp_tooltip: "あなたの[spiritual_fulfillment|E]が#V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!以上である"
 pam_decision_last_rites_doctrine_tt: "[faith|E]に[GetDoctrineType('doctrine_sacraments_central').GetBaseName]の[doctrine|E]がなければならない"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X 終油の秘跡を受けない場合：\n$BULLET_WITH_TAB$[legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]を失います\n$BULLET_WITH_TAB$$every_zealot_vassal$：\n$TAB$$BULLET_WITH_TAB$#V あなた#!への[opinion|E]が#N 30#!低下します#!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial あなたは[secret|E]を明かす必要があるかもしれません#!"
 pam_decision_events.0005.details: "あなたは[titles|E]を[lease|E]するか、あるいは[lease|E]可能な[titles|E]がない場合は、[monastic_holy_orders|E]、[holy_orders|E]、または[the_christian_church|E]に[gold|E]を寄付する機会を獲得する——これにより、あなたの[player_heir|E]に有益な[modifiers|E]が与えられる。"
 pam_decision_events.0005.t: "終油の秘跡：最期の時"
 pam_decision_events.0005.desc.healthtrait: "罪によって私は[death_trait.GetName(soon_dead)|l]となり、恐らくそれが原因で死を目前に迎えている。"
 pam_decision_events.0005.desc.bad: "私は[ROOT.Char.GetFaith.HighGodName]を敬うことに苦しみ、傲慢にも、すべてを見通すその御目から自らの罪を隠そうとしてきた。\n\n"
 pam_decision_events.0005.desc.good: "幸いなることに、悪魔どもが私の魂を奪わぬよう、天使たちがすぐ傍で守ってくれているように感じる。\n\n"
 pam_decision_events.0005.desc.neutral: "私は[ROOT.Char.GetFaith.HighGodName]を敬うよう努めてきたが、永遠への門口に近づくにつれ、私の魂がその天国に相応しいと審判されるのか、不安を覚える。\n\n"
 pam_decision_events.0005.desc.notalone: "私の傍らには、私の魂のために祈りを捧げようと、[ROOT.Char.Custom2('PartnerOpinionDescription', 、SCOPE.sC('fam_or_friend_1') )][ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))]、[fam_or_friend_1.GetFirstName]をはじめとする人々が集まっている。"
 pam_decision_events.0005.desc.alone: "私はただ一人、恐怖に身を震わせている。私の傍らには、私の魂のために祈ってくれる親しい者は誰もいない。"
 pam_decision_events.0005.desc.outro: "私の告解師は[Glossary('典礼書','SACRAMENTARY_GLOSS')]を手に、「偽りなく[ROOT.Char.GetFaith.HighGodName]と向き合うのです！」と諭す。\n\n罪にまみれた王ダビデでさえ、告解の後には清められたのだ…[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "この先には、悔悛の秘跡が待ち受けている。"
 pam_decision_events.0005.b: "悪魔よ、私を連れて行くがいい！この司祭を追い出せ。"
 pam_psalm_51_english: "「私はあなたに背き…罪を犯して、悪事を行いました…ですから、あなたの宣告は正しく、その審判に一切の非はありません」"
 SACRAMENTARY_GLOSS: "典礼書、または#EMP 奉神礼書#!は、キリスト教の司教や司祭が典礼で用いた書物である。時代や地域によって異なるが、秘跡のための文言に加え、朗読または詠唱される文言も収められていた。"
 pam_decision_events.0006.t: "終油の秘跡：我が咎は常に我が前にあり"
 pam_decision_events.0006.intro: "「人間は過ちを犯すものです。しかし、告解なくして罪の赦しは得られません」と[confessor.GetTitledFirstName]が言う。"
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\n私の罪は大きく、何度も繰り返された。私の魂は重く、サタンの灼熱の指に掴まれている。明らかに奴のものとなった魂を、奪い去ろうとしているのだ。\n\n"
 pam_decision_events.0006.desc.good: "\n\n私の心は軽い。私の行いは主の御心に沿ったものであったからだ。\n\n"
 pam_decision_events.0006.desc.neutral: "\n\n私はただの人間だ。最善を尽くしたものの、罪から逃れることはできなかった。\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "私は自分の[my_sinful_trait.GetName(soon_dead)]の性質によって、これまでどれほど道を踏み外してきたことか！"
 pam_decision_events.0006.desc.secret_sin: "私は、自らが[my_secret.GetName]であるという事実を、闇の港に留め置いていた。"
 pam_decision_events.0006.desc.my_criminal_trait_sin: "何よりも悪いことに、私は[my_criminal_trait.GetName(soon_dead)]なのだ！息苦しくなるような罪悪感が、一息ごとに私の喉を締め付ける。"
 pam_decision_events.0006.desc.sin_default: "私の罪はきっと数多いのだろうが、思い出そうとしても容易には浮かばない。だが、ひとたび[confessor.GetTitledFirstNameNoTooltip]に語りはじめれば、それは堤防を越えて押し寄せる海のように溢れ出るに違いない。"
 pam_decision_events.0006.desc.sin_default_good_sp: "[ROOT.Char.GetFaith.HighGodName]が私の骨を砕き、不義を拭い去ってくださいますように。"
 pam_decision_events.0006.desc.outro: "私は真摯な悔悟をもって罪を告白しなければならない。さもなければ、聖体拝領を拒まれてしまう。"
 pam_decision_events.0006.a: "「許してください、司祭様…」"
 pam_decision_events.0006.b: "墓場まで持っていくべき罪もある。"
 pam_decision_events.0006.b.flavor: "あなたはいくつかの罪を告白したが、他者を巻き込む恐れのある秘密については口を閉ざした。"
 pam_decision_events.0007.t: "終油の秘跡：肉体、血、そして聖油"
 pam_decision_events.0007.intro: "かくして我が罪の清算は終わった。わずか1ファージングの負債と、1万タラントもの負債ではわけが違うというものだ。\n\n告解師が聖別されたパンと葡萄酒を差し出す。"
 pam_decision_events.0007.desc.bad: "主の肉と血が捧げられているこの時でさえ、魂を差し出せと悪鬼たちが囁くのが聞こえる。そうすれば私は生き永らえて、俗世の快楽に耽ることができるのだと。\n\n"
 pam_decision_events.0007.desc.good: "重荷を下ろした私は、死の抱擁へと身を投じる。そして、我が主の肉と血を、この身に受けたいとただ願う。御許へと赴くときが近づいている。\n\n"
 pam_decision_events.0007.desc.neutral: "狼のように待ち伏せ、定められた時より早く私を連れ去ろうとする悪魔どもから、主の肉と血が私を守ってくださいますように。\n\n"
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U]はその後、私の額、両手、そして両足に聖油を塗る。"
 pam_decision_events.0007.desc.oil.bad: "私の魂はまだ懊悩している。\n\n"
 pam_decision_events.0007.desc.oil.good: "私の魂は主の愛で輝いている。\n\n"
 pam_decision_events.0007.desc.oil.neutral: "私の魂がその旅路に向けて守護されているのを感じる。\n\n"
 pam_decision_events.0007.desc.outro: "[Glossary('ヴィアティクム','VIATICUM_GLOSS')]と[Glossary('終油の秘跡','UNCTION_GLOSS')]が済んだ今、私は私のため祈ってくれる人物を決めることができる。"
 VIATICUM_GLOSS: "ラテン語で「旅の備え」を意味する。ヴィアティクムとは、臨終の儀式における聖体拝領、すなわち聖餐を指す言葉である。ここでいう「旅」は、永遠の来世に向かう旅路を意味する。"
 UNCTION_GLOSS: "終油の秘跡とは、臨終、すなわち死の間際にある病者に聖油を塗る儀式を指す言葉である。これは、永遠の来世に赴く準備のために行われる。"
 pam_decision_events.0007.a: "[monastic_order.GetName]が我がために祈らんことを。"
 pam_decision_events.0007.b: "私は[military_order.GetName]を増強する。"
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip]に私の富を与える。そして私は、[religious_head.GetHerHis]の祈りを得るのだ。"
 pam_decision_events.0007.d: "[confessor.GetTitledFirstNameNoTooltip]への敬虔な言葉だけで十分だ。"
