 consecrate_kingdom_decision: "新しい王国を聖別する"
 consecrate_kingdom_decision_desc_self: "君主を定めるのは[ROOT.Char.GetFaith.HighGodName]であり、その御意思を代弁するのが私なのだ。信徒の地を治めるのに、私ほどふさわしい君主がいるだろうか？"
 consecrate_kingdom_decision_desc: "君主を定めるのは[ROOT.Char.GetFaith.HighGodName]である。災厄のときには、最も身分の低い貴族の中から君主をお選びになることさえある。\n\n今はまさにその時なのだ。この無冠の頭に聖なる王冠を授かるよう、願い出よう。"
 consecrate_kingdom_decision_confirm: "王権を担う"
 consecrate_kingdom_decision_tooltip: "あなたの[realm]の力ではなく、高位の宗教的権威の承認を根拠として、新しい[kingdom|E]の[title|E]を創設する"
 consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.GetShortUIName]はあなたの[kingdom|E]の聖別を拒否する可能性があり、その場合はこの[decision|E]は無効になります！#!"
