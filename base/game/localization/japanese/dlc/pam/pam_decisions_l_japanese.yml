 pam_raise_khachkar_no_valid_county_in_realm: "あなたには適切な[county|E]がある。"
 pam_proclaim_crusade_age_tenet_decision: "十字軍の時代を宣言する"
 pam_proclaim_crusade_age_tenet_decision_desc: "信徒らは武器を取ってキリスト教世界を防衛し、失われた地を奪還しなければならない。"
