 pam_decision_events.0011.opening: "諸国の[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]へ"
 pam_decision_events.0011.desc.permitted: "私はこの件について裁可を下した。本日より、[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]は容認された教えとなる。\n\nこれまで密かにこれを実践してきた者は、前へ出るがよい。"
 pam_decision_events.0011.desc.prohibited: "私はこの件について裁可を下した。本日より、[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]を異端とする。これに固執する者は、信徒の道を外れることになる。"
 pam_decision_events.0011.desc.fallback: "私は[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]について布告を発した。"
 pam_decision_events.0011.b: "それでも私は、この教えを信じ続ける…"
 pam_decision_events.0012.opening: "諸国の[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]へ"
 pam_decision_events.0012.desc: "[bull_issuer.GetTitledFirstName]は[heresy_rite.GetName]を異端と宣言した。\n\n信仰を同じくするすべての統治者よ、このことを心に留めよ。"
 pam_decision_events.0012.a: "それで構わない。"
 pam_decision_events.0013.opening: "かつて信徒の列にあった[ROOT.Char.GetTitledFirstNameNoTooltip]へ"
 pam_decision_events.0013.desc.intro: "決定は下された。[heresy_rite.GetName]は異端と宣告され、これをなお信奉する者は一人残らず[bull_issuer.GetFaith.GetName]との交わりを断たれる。"
 pam_decision_events.0013.desc.outro: "\n\n選ぶがよい。再び膝を屈し、教会に迎え入れられるか。それとも、偽りの教えに固執し、断罪されるか。"
 pam_decision_events.0013.a: "ならば喜んで袂を分かとう。"
 pam_decision_events.0013.b: "破門されるわけにはいかない。どうか再び迎え入れてほしい。"
 pam_tenet_stance_judgement_personal_permit: "私の献身が報われた！"
 pam_tenet_stance_judgement_personal_prohibit: "人目を避けて祈りを捧げねば…"
