 pam_antipope_events.0001.t: "対立[ROOT.Char.GetFaith.ReligiousHeadName|U]"
 pam_antipope_events.0001.desc.intro: "すべての[ROOT.Char.GetRite.GetName]がこの[ROOT.Char.GetFaith.HouseOfWorship]に再結集したようだ。\n\n"
 pam_antipope_events.0001.desc.self: "私は手を高く掲げる。[pope.GetTitledFirstName]の偽りの統治は、間もなく終わりを迎える。虐げられてきたその羊の群れを、今こそ私が導く時だ。"
 pam_antipope_events.0001.desc.sponsor: "「#EMP 私#!こそが真の[ROOT.Char.GetFaith.ReligiousHeadName|U]だと伝令官たちに宣言させよ！」と[antipope.GetTitledFirstName]が吠える。「偽りの[pope.GetTitledFirstName]が[pope_capital.GetName]の[pope.GetHerHis]の宮殿に隠れている間に、信徒たちは虐げられ、導かれることなく放置されているのだと、皆に知らしめよ！」\n\n[antipope.GetSheHe|U]は私の方を向く。「だが、もう恐れることはない。敬虔なる[ROOT.Char.GetTitledFirstName]が、皆の苦難を終わらせると決意した。そして私も[ROOT.Char.GetHerHim]と共にある」"
 pam_antipope_events.0001.a: "[ROOT.Char.GetFaith.GetNameNoTooltip]よ、震え上がるがいい。"
 pam_antipope_events.0002.opening: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]の[ROOT.Char.GetTitledFirstNameNoTooltip]へ"
 pam_antipope_events.0002.desc.challenger_sponsor: "ここに告げる。[sponsor.GetTitledFirstName]たる私は、[antipope.GetTitledFirstName]を擁立した——"
 pam_antipope_events.0002.desc.antipope_self: "ここに告げる。[sponsor.GetTitledFirstName]たる私は、自ら立ち上がった——"
 pam_antipope_events.0002.desc.outro: "対立[ROOT.Char.GetFaith.ReligiousHeadName|U]として偽りの[pope.GetTitledFirstName]に対抗し、我々の伝統に従って[antipope.GetRite.GetName]の信徒を導くことを。"
 pam_antipope_events.0002.a: "私に対抗する$anti_religious_head_name$だと…？"
