 pam_secure_pilgrim_routes_incompatible_tenet_tt: "平和主義の[core_tenet|E]は[GetTenetType('tenet_armed_pilgrimages').GetBaseName]と両立できないため、先に置き換える必要がある"
 pam_secure_pilgrim_routes_decision_remove_tenet_tt: "[GetPlayer.GetRite.GetName]は選択した[core_tenet|E]をもはや中核としていない"
 pam_secure_pilgrim_routes_decision_holy_site_tt: "[THIS.Char.GetFaith.GetName]のどの[holy_site|E]も、[GetReligionByKey('christianity_religion').GetAdjective]の[ruler|E]によって所有#bold されていない#!"
 pam_decision_events.0019.t: "巡礼者の守護者"
 pam_decision_events.0019.desc: "すべての[ROOT.Char.GetFaith.GetAdherentNamePlural]に私の言葉を記した手紙を送る。\n\n「聖地へ至る道はいずれも危険な状況となっている。信徒たちは巡礼に武器を携行し、楽園への道を阻む者から自らを守ることをここに許可する」"
 pam_decision_events.0019.a: "主よ、我らの武器に力を与えたまえ。"
 pam_decision_events.0018.opening: "諸国の[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]へ"
 pam_decision_events.0018.desc.armed_pilgrimages: "私はこの件について裁可を下した。本日より、[GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )]は[hof_scope.GetFaith.GetName]の中核となる信条の一つとなる。\n\n信仰を同じくするすべての統治者よ、このことを心に留めよ。"
 pam_decision_events.0018.desc.struggle_submission: "私はこの件について裁可を下した。本日より、[GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )]は[hof_scope.GetFaith.GetName]の中核となる信条の一つとなる。\n\n信仰を同じくするすべての統治者よ、このことを心に留めよ。"
 pam_decision_events.0018.a: "それで構わない。"
 pam_decision_events.0017.t: "先祖のハチュカルを建立"
 pam_decision_events.0017.desc: "私は[khachkar_location.GetNameNoTier]を見渡す高台を石の十字架を建立する場所に選んだ。\n\n腕の立つ石工たちに、[khachkar_ancestor.GetTitledFirstNameNicknamed]を追悼するための、真に畏敬の念を抱かせるものを作らせよう。それはロゼットや装飾、そして[khachkar_ancestor.GetHerHis]の[khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)]が[khachkar_ancestor.GetHerHis]を偲んで建立した旨の碑文で囲まれた十字架だ。\n\nその下で地元の巡礼者たちに祈らせ、この地における我々の正当な統治を皆に知らしめるのだ。"
 pam_decision_events.0017.a: "この十字架が末永く立ち続けんことを。"
 pam_decision_events.0017.b: "今はその時ではない。"
