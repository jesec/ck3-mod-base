 pam_proclaim_living_word_decision_desc: "信徒たちは[ROOT.Char.GetFaith.HighGodName]が私に印を授けたと囁き合っている。巡礼者は辻々の聖堂で私の名を口にし、[ROOT.Char.GetFaith.PriestNeuterPlural]は私の裁定をまるで聖書であるかのように引用する。\n\nあらゆる祭壇から宣言させよう。私を通じて、生ける御言葉が示されるのだと。"
