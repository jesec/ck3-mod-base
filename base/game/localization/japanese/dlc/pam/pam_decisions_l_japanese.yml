 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName]は遠く隔たった、ふさわしくない人物であり、[ROOT.Char.GetFaith.GetName]を導くにはあまりにも力不足である。[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe]がどれほど学識を誇ろうとも、[ROOT.Char.GetFaith.GetAdjective]の思想に秘められた繊細な真実の多くを、まったく#EMP 理解#!していないのだ。\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U]には無理だが、#EMP 私#!なら…"
