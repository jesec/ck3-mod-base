 nestorian_adj: "ネストリウス派"
 nestorian_adherent: "ネストリウス派"
 nestorian_adherent_plural: "ネストリウス派"
 nestorian_desc: "イエス・キリストが神格と人格の二つの位格を持つと説くネストリウス派は、ほとんどのキリスト教宗派から異端であると宣言されてきた。にもかかわらず、その特有の見解は、中国、インド、さらにはモンゴルといった遠く東の地で信者を集めている。"
 nestorian_religious_head_title: "総主教"
