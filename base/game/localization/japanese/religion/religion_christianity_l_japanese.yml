 adoptionist: "養子的キリスト論主義"
 adoptionist_adj: "養子的キリスト論主義"
 adoptionist_adherent: "養子的キリスト論主義"
 adoptionist_adherent_plural: "養子的キリスト論主義者"
 adoptionist_desc: "イベリア半島における養子的キリスト論のルーツは、トレド大司教区とその周辺の諸教会における独自の考え方、数世紀前の北アフリカの清教主義、そして9世紀初頭の極めてカリスマ的な数人の異端者たちにある。\n\n極めて捉えにくいものから完全に露骨なものまでさまざまな形をとるが、教義として共通しているのは、キリストの永遠の神性に対する疑問の態度である。"
