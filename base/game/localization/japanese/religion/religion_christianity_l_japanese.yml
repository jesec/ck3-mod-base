 waldensian: "ワルドー派"
 waldensian_adj: "ワルドー派"
 waldensian_adherent: "ワルドー派"
 waldensian_adherent_plural: "ワルドー派"
 waldensian_desc: "富の蓄積は救済への到達とは相容れない忌むべき行いであるとするワルドー派は、使徒的清貧こそが完全への道であると説き、祭司は称号も土地も持ってはならないと信じている。"
 lollard: "ロラード派"
 lollard_adj: "ロラード派"
 lollard_adherent: "ロラード派"
 lollard_adherent_plural: "ロラード派"
 lollard_desc: "洗礼や告解といった多くの一般的なキリスト教の秘跡を非難するロラード派は、ただ聖書のみが教義の正当な源泉であり、それに直接基づかない教えは本質的に不正であると主張する。"
 hussite: "フス派"
 hussite_adj: "フス派"
 hussite_adherent: "フス派信徒"
 hussite_adherent_plural: "フス派信徒"
 hussite_desc: "ローマ教会は使徒の道を外れたという、燃えるような確信から生まれたボヘミアの改革的な宗派。フス派は、一般信徒への聖杯授与、俗語で書かれた聖書、そして聖職者からの富や世俗の権益の剥奪を求めている。"
 joachimite: "ヨアキム派"
 joachimite_adj: "ヨアキム派"
 joachimite_adherent: "ヨアキム派信徒"
 joachimite_adherent_plural: "ヨアキム派信徒"
 joachimite_desc: "聖書と歴史の歩みを、神による3段階の啓示、すなわち父の時代、子の時代、そして間近に迫った聖霊の時代として解釈する終末論的な神秘主義信仰。聖霊の時代には、既存の制度化された教会は退き、裸足で財産を持たない説教師たちの観想的な修道会がそれに替わるとされる。"
 bosnian_church: "ボスニア教会"
 bosnian_church_adj: "ボスニア教会"
 bosnian_church_adherent: "ボスニア教会信徒"
 bosnian_church_adherent_plural: "ボスニア教会信徒"
 bosnian_church_desc: "カトリックからも正教からも久しく忘れ去られていた、ボスニア高地のボスニア教会は、有名な同胞よりも寛容だが、形式的な構造を持たない。多くの初期キリスト教の要素を保っているため、ほかのキリスト教徒からは軽蔑されていることが多い。彼らに記憶されていればの話だが。"
