 cathar_adherent: "カタリ派"
 cathar_adherent_plural: "カタリ派"
 cathar_desc: "万物はサタンの創造物であり、本質的に罪悪によってけがれていると説くカタリ派は、世俗的欲望と物質世界を拒絶することが救済を得る唯一の道だと信じている。"
