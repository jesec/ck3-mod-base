 orthodox_adj: "正教会"
 orthodox_adherent: "正教会"
 orthodox_adherent_plural: "正教会"
 orthodox_desc: "東方正教会は、自派の主教がキリストの使徒の真の直接的後継者であり、聖なる典礼の伝統によって受け継がれてきたキリスト教本来の信仰だと主張している。"
 orthodox_religious_head_title: "総主教"
 orthodox_religious_head_title_female: "女総主教"
 orthodox_religious_head_title_name: "総主教領"
