 paulician_adherent: "パウロ派"
 paulician_adherent_plural: "パウロ派"
 paulician_desc: "キリストの神性を否定し、十字架への尊敬を異教的とみなすパウロ派は、タルソスのパウロが打ち立てた真のキリスト教の姿を取り戻すことを目指している。"
