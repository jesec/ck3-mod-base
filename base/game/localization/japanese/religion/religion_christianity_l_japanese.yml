 adoptionist_religious_head_title_female: "女大司教"
 adoptionist_religious_head_title_name: "大司教"
 conversos: "コンベルソ"
 conversos_adj: "コンベルソ"
 conversos_adherent: "コンベルソ"
 conversos_adherent_plural: "コンベルソ"
 conversos_desc: "コンベルソはユダヤ人共同体が強制的にキリスト教に改宗させられたときに生じた。彼らは新たな信仰を受け入れているが、古い伝統を忘れてはおらず、未だ改宗していない者たちに対して同情的である。"
