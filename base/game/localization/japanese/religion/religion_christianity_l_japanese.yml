 bogomilist_adj: "ボゴミール派"
 bogomilist_adherent: "ボゴミール派"
 bogomilist_adherent_plural: "ボゴミール派"
 bogomilist_desc: "一般の民衆から宗教指導者を選出するボゴミール派は、すべての世俗的な虚飾とその権力制度を拒絶し、その代わりとして、キリストと使徒たちが実践したかつての精神的な教えの道に回帰することを提唱している。"
