 messalian_adj: "メッサリア派"
 messalian_adherent: "メッサリア派"
 messalian_adherent_plural: "メッサリア派"
 messalian_desc: "神の本質は肉体感覚を通して知覚されると信じるメッサリア派は、伝統的なキリスト教の秘跡を拒否し、代わりにあまり伝統的ではない礼拝方法によって、神を直接体験しようとする。"
 messalian_priest: "完徳者"
 messalian_priest_plural: "完徳者"
 adamites: "アダム派"
 adamites_adj: "アダム派"
 adamites_adherent: "アダム派"
 adamites_adherent_plural: "アダム派"
 adamites_desc: "アダム派は、服を脱ぎ捨てることによって、アダムとイヴの本来の無垢な状態を取り戻したと主張している。アダム派の集団はしばしば絶対的な無法状態で生活しており、無垢であるがゆえに自らの行動は善でも悪でもない、と主張している。"
