 iconoclast_adherent: "聖像破壊派"
 iconoclast_adherent_plural: "聖像破壊派"
 iconoclast_desc: "霊的象徴の使用はいかなる偶像も造ってはならないとする第二戒に反すると信じる聖像破壊派は、既存の宗教的図像を破壊し、新たな作成を排除しようとしている。"
