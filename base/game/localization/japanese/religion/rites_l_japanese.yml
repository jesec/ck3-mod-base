 roman_rite: "ローマ流派"
 roman_rite_adj: "ローマ流派"
 roman_rite_adherent: "ローマ・キリスト教徒"
 roman_rite_adherent_plural: "ローマ・キリスト教徒"
 roman_rite_desc: "ローマ流派は、ローマ教会における典礼の伝統である。ラテン神学と法的な権威によって形作られ、秘跡の規律、聖職者の階層、制度的な統一を重視している。"
 insular_celtic: "ケルト教会"
 insular_celtic_adj: "ケルト教会派"
 insular_celtic_adherent: "ケルト教会派信徒"
 insular_celtic_adherent_plural: "ケルト教会派信徒"
 insular_celtic_desc: "数世紀前にローマ・カトリックの正統派から離脱した地方教会であるケルト教会流派は、母教会の強い要求により、かつての独自性の多くを失っている。それでもなお、懺悔と修道生活の重視は強く残っており、広義のキリスト教世界には見られない、多くの伝統的なケルト式の結婚の慣習を取り入れている。"
