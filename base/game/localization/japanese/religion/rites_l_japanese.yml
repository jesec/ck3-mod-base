 mozarabic_church: "モサラベ派"
 mozarabic_church_adj: "モサラベ派"
 mozarabic_church_adherent: "モサラベ派信徒"
 mozarabic_church_adherent_plural: "モサラベ派信徒"
 mozarabic_church_desc: "初期イベリア礼拝式を祖とするモサラベ流派は、何世紀もイスラム教の支配下にあったため、ローマからの独立性を保ってきた。長い間、ほかの信仰と共存してきたことで、原理主義的な宗派よりも、違いを受け入れるようになった。"
 ambrosian_rite: "アンブロシウス流派"
 ambrosian_rite_adj: "アンブロシウス流派"
 ambrosian_rite_adherent: "アンブロシウス・キリスト教徒"
 ambrosian_rite_adherent_plural: "アンブロシウス・キリスト教徒"
 ambrosian_rite_desc: "ミラノの大司教であった聖アンブロシウスの時代より、ミラノ大司教区に固有のものとして伝わるアンブロシウス流派は、独自の礼拝様式と聖歌を維持し、ヒッポの聖アウグスティヌスの思想を重んじる神学的伝統を持っている。"
 beneventan_rite: "ベネヴェント流派"
 beneventan_rite_adj: "ベネヴェント流派"
 beneventan_rite_adherent: "ベネヴェント・キリスト教徒"
 beneventan_rite_adherent_plural: "ベネヴェント・キリスト教徒"
 beneventan_rite_desc: "ベネヴェントとモンテ・カッシーノの大修道院を中心とする、ランゴバルド南部の典礼伝統。その独特な聖歌と儀礼はローマの慣行とは一線を画しており、ローマ側はこの流派を次第に疑いの目で見るようになっている。"
 carolingian_christianity: "カロリング・キリスト教"
 carolingian_christianity_adj: "カロリング・キリスト教"
 carolingian_christianity_adherent: "カロリング教徒"
 carolingian_christianity_adherent_plural: "カロリング教徒"
 carolingian_christianity_desc: "カロリング朝の統治下で発展したキリスト教の一形態。修道生活と宣教活動を重視することを特徴としている。"
 byzantine_rite: "ギリシャ流派"
 byzantine_rite_adj: "ギリシャ流派"
 byzantine_rite_adherent: "ギリシャ・キリスト教徒"
 byzantine_rite_adherent_plural: "ギリシャ・キリスト教徒"
 byzantine_rite_desc: "コンスタンティノープル総主教庁は、東方正教会における最も重要な中心地の一つであり、豊かな神学的伝統と歴史的な影響力を有することで知られている。ギリシャ流派は、この総主教庁に直接由来するものである。"
 antiochian_rite: "アンティオキア流派"
 antiochian_rite_adj: "アンティオキア流派"
 antiochian_rite_adherent: "アンティオキア・キリスト教徒"
 antiochian_rite_adherent_plural: "アンティオキア・キリスト教徒"
 antiochian_rite_desc: "アンティオキア総主教庁は最も古いキリスト教共同体の一つであり、聖ペトロと使徒パウロによって創設された。その西シリアの伝統は、教会を再編したヤコブ・バラダイオスにちなんで「ヤコブ派」と呼ばれ、合性論の教えと聖ヤコブの古代典礼を守っている。"
 slavic_rite: "スラヴ流派"
 slavic_rite_adj: "スラヴ流派"
 slavic_rite_adherent: "スラヴ・キリスト教徒"
 slavic_rite_adherent_plural: "スラヴ・キリスト教徒"
 slavic_rite_desc: "この流派は、キュリロスとメトディオスによってスラヴ民族にもたらされた。グラゴル文字を通してスラヴの言語と文化に適応されたビザンツ典礼の要素が取り入れられている。"
 georgian_rite: "グルジア流派"
 georgian_rite_adj: "グルジア流派"
 georgian_rite_adherent: "グルジア派信徒"
 georgian_rite_adherent_plural: "グルジア派信徒"
 georgian_rite_desc: "グルジア流派はグルジアにおけるキリスト教の伝統を受け継ぎ、独自の典礼、教会の伝統、そして東方正教の神学と実践との強い結びつきを特徴としている。"
 coptic_rite: "コプト派"
 coptic_rite_adj: "コプト派"
 coptic_rite_adherent: "コプト派信徒"
 coptic_rite_adherent_plural: "コプト派信徒"
 coptic_rite_desc: "その起源を福音記者聖マルコにまでさかのぼるコプト正教会は、キリスト教修道会の発祥地であるとともに、教育と哲学の振興を重んじる長い伝統を保っていることで有名だ。"
 ethiopian_rite: "ゲエズ派"
 ethiopian_rite_adj: "ゲエズ派"
 ethiopian_rite_adherent: "ゲエズ派信徒"
 ethiopian_rite_adherent_plural: "ゲエズ派信徒"
 ethiopian_rite_desc: "エチオピアの高地を拠点とし、アクスムの遺産に根ざした古代キリスト教の伝統的な流派。他のアレクサンドリア系教会とは異なり、より広範な正典と強固な修道院の伝統、そしてソロモン王朝の遺産によって形作られた契約観を保持している。"
 armenian_rite: "使徒派"
 armenian_rite_adj: "使徒派"
 armenian_rite_adherent: "使徒派信徒"
 armenian_rite_adherent_plural: "使徒派信徒"
 armenian_rite_desc: "使徒タダイとバルトロマイ両名により設立されたアルメニア使徒教会は、この地方で急速に信徒を増やし、アルメニア王国をキリスト教を国教と定めた史上初の国家にした。"
 apostolic_religious_head_title: "カトリコス"
 apostolic_religious_head_title_plural: "カトリコス"
 apostolic_religious_head_title_name: "教会"
 # Nabi
 nabi: "ナビー派"
 nabi_adj: "ナビー派"
 nabi_adherent: "ナビー派信徒"
 nabi_adherent_plural: "ナビー派信徒"
 nabi_desc: "クルアーンに明記されているように、ナビーとは全能の神に選ばれた存在を意味する。その役目は、神の御言葉を人々に伝えること、そして人々が神の御前に召され、自らの行いについて問われる日が来ることを喚起することである。ナビー派の核心的教義では、預言者ムハンマドはその最後の預言者とされている。"
 # Pre madhabs
 sahabah: "サハーバ派"
 sahabah_adj: "サハーバ派"
 sahabah_adherent: "サハーバ派信徒"
 sahabah_adherent_plural: "サハーバ派信徒"
 sahabah_desc: "ムハンマドの教友としても知られる、ムハンマドの存命中に彼と面会したり、その姿を見たりしたイスラム教徒を指す。彼らはイスラム教初期の闘争、社会形成、ハディースの伝承、統治において重要な役割を果たした。"
 tabiun: "タービウーン派"
 tabiun_adj: "タービウーン派"
 tabiun_adherent: "タービウーン派信徒"
 tabiun_adherent_plural: "タービウーン派信徒"
 tabiun_desc: "預言者ムハンマドの教友（サハーバ）に続く世代のイスラム教徒とされる。後のスンナ派の諸学派が成立する以前に、預言者の教えを教友を通して間接的に受け継いだ信徒を指す。"
 # Sunni
 hanafi: "ハナフィー派"
 hanafi_adj: "ハナフィー派"
 hanafi_adherent: "ハナフィー派信徒"
 hanafi_adherent_plural: "ハナフィー派信徒"
 hanafi_desc: "推論の使用を体系化した法学者兼神学者のアブー・ハニーファの教えに基づいて発展した。ハナフィー法学理論では、主にクルアーン、スンナ、学者の合意、類推的推論から法規範を導出している。"
 hanbali: "ハンバル派"
 hanbali_adj: "ハンバル派"
 hanbali_adherent: "ハンバル派信徒"
 hanbali_adherent_plural: "ハンバル派信徒"
 hanbali_desc: "ハンバル学派は、スンナ派の四大法学派の中で最も小規模な学派であり、アフマド・イブン・ハンバルの教えに基づいて発展した。他の学派とは異なり、法を包括的な体系として成文化することに反対し、クルアーンとハディースを最高の法源として重視している。"
 maliki: "マーリク派"
 maliki_adj: "マーリク派"
 maliki_adherent: "マーリク派信徒"
 maliki_adherent_plural: "マーリク派信徒"
 maliki_desc: "スンナ派イスラム法学における四大法学派の一つ。8世紀にマーリク・イブン・アナスによって創始された。マーリク学派は、法規定の導出に用いる法源が、他のスンナ派法学派と顕著に異なっている。"
 shafii: "シャーフィイー派"
 shafii_adj: "シャーフィイー派"
 shafii_adherent: "シャーフィイー派信徒"
 shafii_adherent_plural: "シャーフィイー派信徒"
 shafii_desc: "9世紀初頭に「イスラム法学の父」と呼ばれたイスラム教徒の学者兼法学者アル＝シャーフィイーにちなんで名付けられた。シャーフィイー派の核心は、法の対象となる信者のあらゆる行為には、啓示法（シャリーア）において対応する規定が存在するという考え方にある。"
 #Ismaili
 ismaili: "イスマーイール派"
 ismaili_adj: "イスマーイール派"
 ismaili_adherent: "イスマーイール派信徒"
 ismaili_adherent_plural: "イスマーイール派信徒"
 ismaili_desc: "神の知識と絶対性を持った真のイマームの系譜は、イスマーイール・イブン・ジャアファルを通して受け継がれていると考えるシーア派の一派。イスマーイールはムハンマドに次ぐ7人目のイマームであったため、七イマーム派としても知られている。"
 #Qarmatians
 qarmatian: "カルマト派"
 qarmatian_adj: "カルマト派"
 qarmatian_adherent: "カルマト派信徒"
 qarmatian_adherent_plural: "カルマト派信徒"
 qarmatian_desc: "ゾロアスター教の要素を取り入れたイスマーイール派の分派。神によりイマームの数は7と定められ、7代目のムハンマド・イブン・イスマーイールが信徒を導くために戻ってくるまでは、これ以上のイマームは存在しないとした。"
 #Nizari
 nizari: "ニザール派"
 nizari_adj: "ニザール派"
 nizari_adherent: "ニザール派信徒"
 nizari_adherent_plural: "ニザール派信徒"
 nizari_desc: "クルアーンとハディースの解釈において論理的推論を重視する合理主義的な分派。イマームは世襲制であり、その継承の系譜はアリーにまで遡る。"
 #Zayidi
 zayidi: "ザイド派"
 zayidi_adj: "ザイド派"
 zayidi_adherent: "ザイド派信徒"
 zayidi_adherent_plural: "ザイド派信徒"
 zayidi_desc: "真のイマームは決して誤らないものではなく、堕落や邪悪との戦いによって定義される。そのためザイド派は、ウマイヤ朝に対する反乱によって、ザイド・ブン・アリーがイマームの正当な後継者となったと考えている。"
 #Imamism (Twelver)
 imami: "イマーム派"
 imami_adj: "イマーム派"
 imami_adherent: "イマーム派信徒"
 imami_adherent_plural: "イマーム派信徒"
 imami_desc: "イマーム派は12人のイマームがイスラム共同体を導くよう預言され、12代目イマームのザマンが審判の日にイスラム教徒を導くために再臨すると信じている。"
 islam_ayatollah: "アーヤトッラー"
 islam_ayatollah_plural: "アーヤトッラー"
 ghulat: "イフティラフ派"
 ghulat_adj: "イフティラフ派"
 ghulat_adherent: "イフティラフ派信徒"
 ghulat_adherent_plural: "イフティラフ派信徒"
 ghulat_desc: "イフティラフ派はアリーに始まるイマームの絶対的な神性を信じている。神は彼らを任命し霊感を与えただけではなく、イマームの行動を導き、ひいてはイスラム共同体全体を導くために部分的に彼らに憑依している。"
 alawite: "アラウィー派"
 alawite_adj: "アラウィー派"
 alawite_adherent: "アラウィー派信徒"
 alawite_adherent_plural: "アラウィー派信徒"
 alawite_desc: "アラウィー派の宗教上の教えは秘密主義であり、クルアーンは彼らの聖典の一つにすぎない。アリーを通じたイマームの継承を信じていることに加え、アラウィー派は輪廻転生を信じている。すべてのものは天国から投げ出された星であるとし、善行と信仰の日々を続けることによって元の場所に戻らなければならない。"
 #Alevis
 alevi: "アレヴィー派"
 alevi_adj: "アレヴィー派"
 alevi_adherent: "アレヴィー派信徒"
 alevi_adherent_plural: "アレヴィー派信徒"
 alevi_desc: "アレヴィー派は十二イマームの継承を信じているが、彼らの聖典の集合であるブルックに記された多くの伝承にも従っている。アレヴィー派の伝承では神は真理であり、ムハンマドとアリーは世界における神の現れである。"
