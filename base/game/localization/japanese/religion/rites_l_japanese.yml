l_japanese:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "[Rite.GetNameNoTooltip]は[Character.GetFullName]によって、[GetCurrentDate.GetStringLong]に[Character.GetCurrentLocation.GetTitle.GetAdjective]において、[Faith.GetAdjective]宗派内の一流派として創設された。[Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "[Rite.GetNameNoTooltip]は[Character.GetFullName]によって、[GetCurrentDate.GetStringLong]に、[Faith.GetAdjective]宗派内の一流派として創設された。[Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "この流派は、その母体となる宗派において独自の信仰的な特色を保持している。"
 generic_rite_focus_tenet_aniconism: "この流派は聖像を否定し、聖像の不在と節制、そして描かれざる神聖なるものへの崇敬を追求する。"
 generic_rite_focus_tenet_alexandrian_catechism: "この流派は、学識に裏打ちされた教えと深遠な教義、そして信徒への忍耐強い指導を重んじている。"
 generic_rite_focus_tenet_armed_pilgrimages: "この流派は、聖戦と武装巡礼を敬虔な信者が果たすべき神聖な務めと見なしている。"
 generic_rite_focus_tenet_carnal_exaltation: "この流派は、欲望と肉体的快楽を、神聖なるものに触れられた賜物として尊ぶ。"
 generic_rite_focus_tenet_communal_identity: "この流派は、崇拝を共有された慣習、共同生活、そして守られた共同体の意識と強く結びつけている。"
 generic_rite_focus_tenet_communion: "この流派は、信仰心の共有と施し、そしてその精神的指導者との交わりによって結束している。"
 generic_rite_focus_tenet_consolamentum: "この流派は、禁欲と死への揺るぎない備えを通して最終的な浄化へ至ることを目指している。"
 generic_rite_focus_tenet_divine_marriage: "この流派は、結びつきと統治の双方を神聖視し、聖なる結婚を神聖な秩序の反映と見なしている。"
 generic_rite_focus_tenet_gnosticism: "この流派は、世界の帳の向こうに秘められた真理を求め、救いを神聖なる知識に託している。"
 generic_rite_focus_tenet_mendicant_preachers: "この流派は、遍歴の説教師と謙虚な伝導、そして絶え間ない教導を通して信仰を広めている。"
 generic_rite_focus_tenet_pacifism: "この流派は節制と平和を尊び、無益な流血を魂の重大な堕落と見なしている。"
 generic_rite_focus_tenet_pentarchy: "この流派は古来の権威の座と、信仰全体に対する秩序ある統治を重んじている。"
 generic_rite_focus_tenet_unrelenting_faith: "この流派は揺るぎない熱意と強固な決意、そして聖なるもののために戦う覚悟を称えている。"
 generic_rite_focus_tenet_vows_of_poverty: "この流派は清貧を尊び、信徒に過剰なものを捨て、質素に生きることを促している。"
 generic_rite_focus_tenet_pastoral_isolation: "この流派は守られた信徒の共同体を形成することを好み、妥協するよりも外界からの隔絶を重んじる。"
 generic_rite_focus_tenet_rite: "この流派は典礼、聖職の序列、そして神聖な伝統の維持を非常に重んじている。"
 generic_rite_focus_tenet_adaptive: "この流派は折れることなく形を変え、神聖な本質を保ちながら地域の慣習を取り入れている。"
 generic_rite_focus_tenet_esotericism: "この流派は秘められた叡智と入信儀礼、そして備えある者にのみ明かされる真理を尊ぶ。"
 generic_rite_focus_tenet_legalism: "この流派は、明確な法、正しい裁き、そして規律ある生活の秩序を神聖性の根拠とする。"
 generic_rite_focus_tenet_literalism: "この流派は聖典の言葉に厳密に従い、恣意的な解釈や慣習的な妥協を排している。"
 generic_rite_focus_tenet_reincarnation: "この流派は、魂の旅路を循環的なものと捉え、それぞれの生が次の生を形づくると考えている。"
 generic_rite_focus_tenet_religious_legal_pronouncements: "この流派は、聖なる法と正式な裁定に、永続的な霊的権威を与えている。"
 generic_rite_focus_tenet_struggle_submission: "この流派では、信仰は闘争と征服、そして不信心者の服従によって証明されると説いている。"
 generic_rite_focus_tenet_false_conversion_sanction: "この流派は、生存や利益のためであれば、内心では従いながらも外面では別の姿を装うことを容認する。"
 generic_rite_focus_tenet_tax_nonbelievers: "この流派は、不信心を貢納の負担を負うべきものと見なし、世俗的な賦課金を課すことを通して神聖な階層構造を強化している。"
 generic_rite_focus_tenet_asceticism: "この流派は自制と規律、そして忍耐強く欲望を制することを通じて、聖性を追求している。"
 generic_rite_focus_tenet_bhakti: "この流派は心からの信仰を中心に据え、愛に満ちた献身こそが魂を神聖なるものへ最も近づけると説いている。"
 generic_rite_focus_tenet_dharmic_pacifism: "この流派は不害と自制を重んじ、平和を怒りよりも高次の修養と見なしている。"
 generic_rite_focus_tenet_inner_journey: "この流派は、内面へと向かい、内省と規律、そして自己変容を通して覚醒することを求めている。"
 generic_rite_focus_tenet_ritual_hospitality: "この流派は、もてなしを神聖な義務と見なし、聖なる慣習のもとで主と客を結びつけている。"
 generic_rite_focus_tenet_adorcism: "この流派は、精霊に敬意をもって働きかけることで、その加護を得て、怒りを避けようとする。"
 generic_rite_focus_tenet_ancestor_worship: "この流派は、崇敬される死者に導きと加護、そして生者とのつながりを求めている。"
 generic_rite_focus_tenet_astrology: "この流派は天の意味を読み解き、星々が秩序と運命、そして時機を明らかにすると信じている。"
 generic_rite_focus_tenet_hedonistic: "この流派は、祝祭と放縦、そして共同礼拝における快楽の聖化を受け入れている。"
 generic_rite_focus_tenet_human_sacrifice: "この流派は、血の供物を、人と神との間で交わされる恐ろしくも神聖な取引と見なしている。"
 generic_rite_focus_tenet_mystical_birthright: "この流派は、生まれながらにして特定の魂が、神聖な力を授かり、霊的な高みへと至るよう運命づけられているとしている。"
 generic_rite_focus_tenet_ritual_celebrations: "この流派は、共同の祝宴と聖なる祝祭を、礼拝の最も完全な表現として称えている。"
 generic_rite_focus_tenet_sacred_childbirth: "この流派は出産を神聖なものとして尊び、母性と新たな生命を神聖な意義を持つものとしている。"
 generic_rite_focus_tenet_sanctity_of_nature: "この流派は、生ける世界の中に聖性を見出し、成長と豊穣、そして制御されぬ創造を崇拝している。"
 generic_rite_focus_tenet_sun_worship: "この流派は、太陽を秩序と輝き、そして神の恩寵をもたらす生命の源の象徴として崇めている。"
 generic_rite_focus_tenet_warmonger: "この流派は征服と武勇を称え、信徒に戦いを通して己を証明することを求めている。"
 generic_rite_focus_tenet_gruesome_festivals: "この流派はおぞましい饗宴を受け入れ、恐怖と流血、そして見世物を神聖な表現へと変える。"
 generic_rite_focus_tenet_cthonic_redoubts: "この流派は、自然の高所と隠れた要塞を、格別な聖地として崇めている。"
 generic_rite_focus_tenet_household_gods: "この流派は家庭を中心に据え、炉と家族、そして日々の献身を神の加護に委ねている。"
 generic_rite_focus_tenet_sinitic_syncretism: "この流派は、流派の伝統と中国的思想と織り合わせ、断絶ではなく調和を追求している。"
 generic_rite_focus_tenet_eastern_syncretism: "この流派は東方の教えを柔軟に取り入れ、異国の知恵を神聖な真理の響きとして受け止めている。"
 generic_rite_focus_tenet_unreformed_syncretism: "この流派は古い慣習を自由に取り入れ、古の儀式を新しい神聖な体系へと織り込んでいる。"
 generic_rite_focus_tenet_christian_syncretism: "この流派はキリスト教の教えを全面的に否定するのではなく、独自の神聖な枠組みの中で再解釈している。"
 generic_rite_focus_tenet_islamic_syncretism: "この流派はイスラムの信仰と慣習を取り入れ、系譜の近い啓示の中に活用できる真理を見出している。"
 generic_rite_focus_tenet_jewish_syncretism: "この流派はユダヤの伝統、律法、そして記憶を、神聖なるものの理解に取り入れている。"
 generic_rite_focus_tenet_exaltation_of_pain: "この流派は苦痛を浄化と見なし、耐え忍ぶことや苦しみを受け入れることで信仰心を示している。"
 generic_rite_focus_tenet_natural_primitivism: "この流派は過度な文明を疑い、より厳しく根源的な生き方を尊んでいる。"
 generic_rite_focus_tenet_pursuit_of_power: "この流派は野心と世俗的支配を称え、権力を神聖なるものの正当な手段として扱う。"
 generic_rite_focus_tenet_ritual_cannibalism: "この流派は人肉を食することを、禁忌的な崇拝の中に組み込み、神聖な畏怖に昇華している。"
 generic_rite_focus_tenet_sacred_shadows: "この流派は秘密の衣をまとい、秘匿、明暗の狭間、そして大衆から隠されたものを神聖なものとして崇めている。"
 generic_rite_focus_tenet_polyamory: "この流派は同時に複数を愛することを祝福し、神聖な絆を一つの関係に限定することを拒む。"
 generic_rite_focus_tenet_sacrificial_ceremonies: "この流派は厳粛な供物を礼拝の中心に据え、犠牲を契約と恩寵に結びつけている。"
 generic_rite_focus_tenet_megaliths: "この流派は聖なるものを不朽の石に刻み、記憶と信仰を支える錨としての役割を記念碑に託している。"
 generic_rite_focus_tenet_fp3_fedayeen: "この流派は、崇高な大義のための潜伏と潜入、そして自己犠牲的な暴力を神聖化している。"
 generic_rite_focus_tenet_communal_possessions: "この流派は私的な富を重視せず、信徒に財産の共有を促している。"
 generic_rite_focus_tenet_pure_land: "この流派は、苦しみの果てにある祝福された境地に希望を据え、信頼と記憶、そして献身によってそこに到達することができるとしている。"
 generic_rite_focus_tenet_no_mind: "この流派は、思考による理解を超えた明晰さを求め、自己を鍛え、空でありながら明晰な覚知に至ることを目指している。"
 generic_rite_focus_tenet_mountain_worship: "この流派は、高所を神聖なものに近い場所と捉え、山頂や高地を崇敬の対象としている。"
 generic_rite_focus_tenet_extinction_of_dharma: "この流派は、世界を腐敗に満ちたものと見なし、真理を守るための容赦ない暴力を是認している。"
 generic_rite_focus_tenet_cranial_trophies: "この流派は、敵の遺骸を勝利の神聖な証と見なし、恐るべき威信の象徴として扱う。"
 generic_rite_focus_tenet_pursuit_of_knowledge: "この流派は、学びを神聖な営みとして称え、学問、討論、そして規律ある探究を通して真理を追求している。"
 generic_rite_focus_tenet_benevolent_governance: "この流派は、正しい統治、秩序ある管理、そして領土への配慮を、聖性の尺度の一部としている。"
 generic_rite_focus_tenet_filial_piety: "この流派は、親と年長者への敬意を、道徳的かつ神聖な秩序の基盤であると説いている。"
 generic_rite_focus_tenet_harmonious_society: "この流派は、均衡、礼節、そして社会的調和を、宇宙の秩序が反映されたものとして重んじている。"
 generic_rite_focus_tenet_sacred_destruction: "この流派は、聖なる破壊を浄化と見なし、破滅そのものを神聖な再生の手段としている。"
 generic_rite_focus_tenet_preservation: "この流派は、忍耐と継続、そして託されたものを大切に守り抜くことを重んじている。"
 generic_rite_focus_tenet_takamin: "この流派は、熊や野生に宿る同種の力を、敬意と畏怖をもって崇め、大切に扱う。"
 generic_rite_focus_tenet_peace_of_god: "この流派は暴力を抑制し、血を流すことが正当化される神聖な条件を定めている。"
 generic_rite_focus_tenet_dulia: "この流派は聖人や聖なる模範を敬い、その記憶を崇敬するが、彼らを神そのものと同一視することはない。"
 generic_rite_focus_tenet_transubstantiation: "この流派は、聖なる秘跡が真に人を変容させるものと考え、秘跡を神の現臨をもたらす中心として重んじている。"
 generic_rite_focus_tenet_ora_et_labora: "この流派は、祈りと労働を結びつけ、規律ある労働そのものが信仰となりうると説いている。"
 generic_rite_focus_tenet_hyperdulia: "この流派は、最も聖なる執り成し人を通常の聖人よりも高い位に据え、特別に崇敬している。"
 generic_rite_focus_tenet_simony: "この流派は、聖職と後援、そして世俗的な富が容易に切り離せるものではないと認めている。"
 generic_rite_focus_tenet_monophysitism: "この流派はキリストの本性の統一を説き、神性と人性を過度に分けて捉えることを拒んでいる。"
 generic_rite_focus_tenet_acts_of_apostles: "この流派は初期の信徒たちの共同体を模範とし、慈愛と共同生活を重んじている。"
 generic_rite_focus_tenet_purgatory: "この流派は、多くの魂は死後に浄化を受けてはじめて、完全なる至福へと至ることができると説いている。"
 generic_rite_focus_tenet_be_fruitful_and_multiply: "この流派は家族、生殖、新たな命の誕生を神聖な務めとして掲げている。"
 generic_rite_focus_tenet_apostolic_succession: "この流派は、使徒にまで途切れることなく遡ることができる継承の系譜を権威の根拠としている。"
 generic_rite_focus_tenet_confession: "この流派は公の悔悛と赦しを重んじ、罪を言葉にして告白することが癒やしの始まりになると信じている。"
 generic_rite_focus_tenet_original_sin: "この流派は、人間の弱さを根源的なものと捉え、傷一つない魂がこの世に生まれることはないと説いている。"
 generic_rite_focus_tenet_celestial_hierarchy: "この流派は、宇宙を神聖な序列によって秩序づけられたものと捉え、それぞれの位階が神の意図を反映していると考えている。"
 generic_rite_focus_tenet_miles_christi: "この流派は信徒を聖なる戦士と見なし、節度ある情熱をもって真理を守るよう促している。"
 generic_rite_focus_tenet_scholasticism: "この流派は、議論と解釈、そして理性と信仰の調和を通じて、信仰を深めている。"
 generic_rite_focus_tenet_adoptionism: "この流派は、高挙と神の子たる性質を強調し、神との永遠の区別を重視していない。"
 generic_rite_focus_tenet_love_thy_neighbour: "この流派は、慈悲と隣人愛を日々の信仰生活の中心に据えている。"
 generic_rite_focus_tenet_divine_liturgy: "この流派は厳粛な典礼を尊び、秩序ある礼拝を神性を最も明確に感じる手段として捉えている。"
 generic_rite_focus_tenet_miaphysitism: "この流派は、キリストという唯一の神秘のうちに、神性と人性が切り離せない形で結ばれていると説いている。"
 generic_rite_focus_tenet_hesychasm: "この流派は、沈黙と静寂、そして心の中で聖なる祈りを繰り返し唱えることを通して神との合一を求めている。"
 generic_rite_focus_tenet_anachoresis: "この流派は、世俗を離れ、孤独と苦難、そして隔絶のうちに聖性を求めることを称えている。"
 generic_rite_focus_tenet_mortification_of_the_flesh: "この流派は肉体を霊的な目的に従わせ、苦行を通して聖性を追求している。"
 generic_rite_focus_tenet_holy_myron: "この流派は聖なる塗油を特に重視し、聖油を神の恩寵の印と捉えている。"
 generic_rite_focus_tenet_khachkar: "この流派は、彫刻が施された石の十字架や不朽の記念碑を聖別し、聖なるものを世に示す証としている。"
 generic_tenet_focus_fallback: "この信条は、その母体となる宗派において独自の信仰上の特色を保持している。"
 generic_tenet_focus_tenet_aniconism: "[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]は聖像を否定し、聖像の不在と節制、そして描かれざる神聖なるものへの崇敬を追求する。"
