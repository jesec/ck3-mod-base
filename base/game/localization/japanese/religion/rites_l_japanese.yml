 generic_tenet_focus_tenet_vows_of_poverty: "[GetTenetType('tenet_vows_of_poverty').GetName( GetPlayer.GetRite )]は清貧を尊び、信徒に過剰なものを捨て、質素に生きることを促している。"
 generic_tenet_focus_tenet_pastoral_isolation: "[GetTenetType('tenet_pastoral_isolation').GetName( GetPlayer.GetRite )]は守られた信徒の共同体を形成することを好み、妥協するよりも外界からの隔絶を重んじる。"
 generic_tenet_focus_tenet_adaptive: "[GetTenetType('tenet_adaptive').GetName( GetPlayer.GetRite )]は折れることなく形を変え、神聖な本質を保ちながら地域の慣習を取り入れている。"
 generic_tenet_focus_tenet_esotericism: "[GetTenetType('tenet_esotericism').GetName( GetPlayer.GetRite )]は秘められた叡智と入信儀礼、そして備えある者にのみ明かされる真理を尊ぶ。"
 generic_tenet_focus_tenet_legalism: "[GetTenetType('tenet_legalism').GetName( GetPlayer.GetRite )]は、明確な教え、正しい裁き、そして規律ある生活の秩序を神聖性の根拠とする。"
 generic_tenet_focus_tenet_literalism: "[GetTenetType('tenet_literalism').GetName( GetPlayer.GetRite )]は聖典の言葉に厳密に従い、恣意的な解釈や慣習的な妥協を排している。"
 generic_tenet_focus_tenet_reincarnation: "[GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )]は、魂の旅路を循環的なものと捉え、それぞれの生が次の生を形づくると考える。"
 generic_tenet_focus_tenet_religious_legal_pronouncements: "[GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )]は、神聖な判決と厳粛な裁きに永続的な精神的権威を与える。"
 generic_tenet_focus_tenet_struggle_submission: "[GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )]では、信仰は苦難と征服、そして不信心者の屈服によって証明されると説いている。"
 generic_tenet_focus_tenet_false_conversion_sanction: "[GetTenetType('tenet_false_conversion_sanction').GetName( GetPlayer.GetRite )]は、生存や利益のためであれば、内心では従いながらも外面では別の姿を装うことを容認する。"
 generic_tenet_focus_tenet_tax_nonbelievers: "[GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )]は、信徒でない者には貢納の義務があるとし、世俗的な賦課金を課すことを通して神聖な階層構造を強化している。"
 generic_tenet_focus_tenet_asceticism: "[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]は自制と規律、そして忍耐強く欲望を制することを通じて、聖性を追求している。"
 generic_tenet_focus_tenet_bhakti: "[GetTenetType('tenet_bhakti').GetName( GetPlayer.GetRite )]は心からの信仰を中心に据え、愛に満ちた献身こそが魂を神聖なるものへ最も近づけると説いている。"
 generic_tenet_focus_tenet_dharmic_pacifism: "[GetTenetType('tenet_dharmic_pacifism').GetName( GetPlayer.GetRite )]は不害と自制を重んじ、平和を怒りよりも高次の修養と見なしている。"
 generic_tenet_focus_tenet_inner_journey: "[GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )]は、内面へと向かい、内省と規律、そして自己変容を通して覚醒することを求めている。"
 generic_tenet_focus_tenet_ritual_hospitality: "[GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )]は、見知らぬ者を迎え入れることを神聖な義務とみなし、聖なる慣習のもとで主と客を結びつけている。"
 generic_tenet_focus_tenet_adorcism: "[GetTenetType('tenet_adorcism').GetName( GetPlayer.GetRite )]は、精霊に敬意をもって働きかけることで、その加護を得て、怒りを避けようとする。"
 generic_tenet_focus_tenet_ancestor_worship: "[GetTenetType('tenet_ancestor_worship').GetName( GetPlayer.GetRite )]は、崇敬される死者に導きと加護、そして生者とのつながりを求めている。"
 generic_tenet_focus_tenet_astrology: "[GetTenetType('tenet_astrology').GetName( GetPlayer.GetRite )]は天の意味を読み解き、星々が秩序と運命、そして時機を明らかにすると信じている。"
 generic_tenet_focus_tenet_hedonistic: "[GetTenetType('tenet_hedonistic').GetName( GetPlayer.GetRite )]は、祝祭と放縦、そして共同礼拝における快楽の聖化を受け入れている。"
 generic_tenet_focus_tenet_human_sacrifice: "[GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )]は、血の供物を、人と神との間で交わされる恐ろしくも神聖な取引と見なしている。"
 generic_tenet_focus_tenet_mystical_birthright: "[GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )]は、誕生時から特定の魂が、神聖な力を授かり、霊的な高みへと至るよう運命づけられているとしている。"
 generic_tenet_focus_tenet_ritual_celebrations: "[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )]は、共同の祝宴と聖なる祝祭を、礼拝の最も完全な表現として称えている。"
 generic_tenet_focus_tenet_sacred_childbirth: "[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )]は子供の誕生を神聖なものとして尊び、母性と新たな生命を神聖な意義を持つものとしている。"
 generic_tenet_focus_tenet_sanctity_of_nature: "[GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )]は、生ける世界の中に神性を見出し、成長と豊穣、そして制御されぬ創造を崇拝している。"
 generic_tenet_focus_tenet_sun_worship: "[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )]は、天空の灼熱の円盤を秩序と輝き、そして神の恩寵をもたらす生命の源の象徴として崇めている。"
 generic_tenet_focus_tenet_warmonger: "[GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )]は征服と武勇を称え、信徒に戦場で己を証明することを求めている。"
 generic_tenet_focus_tenet_gruesome_festivals: "[GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )]はおぞましい饗宴を受け入れ、恐怖と流血、そして見世物を神聖な表現へと変える。"
 generic_tenet_focus_tenet_cthonic_redoubts: "[GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )]は、自然の高所と隠れた要塞を、格別な聖地として崇めている。"
 generic_tenet_focus_tenet_household_gods: "[GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )]は家庭を中心に据え、炉と家族、そして日々の献身を神の加護に委ねている。"
 generic_tenet_focus_tenet_sinitic_syncretism: "[GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )]は、伝統と中国的思想と織り合わせ、断絶ではなく調和を追求している。"
 generic_tenet_focus_tenet_eastern_syncretism: "[GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )]は異国の教えを柔軟に取り入れ、異国の知恵を神聖な真理の響きとして受け止めている。"
 generic_tenet_focus_tenet_unreformed_syncretism: "[GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )]は古い慣習を自由に取り入れ、古の儀式を新しい神聖な体系へと織り込んでいる。"
 generic_tenet_focus_tenet_christian_syncretism: "[GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )]はキリストの教えを全面的に否定するのではなく、独自の神聖な枠組みの中で再解釈している。"
 generic_tenet_focus_tenet_islamic_syncretism: "[GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )]はイスラムの信仰と慣習を取り入れ、系譜の近い啓示の中に活用できる真理を見出している。"
 generic_tenet_focus_tenet_jewish_syncretism: "[GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )]はヘブライの伝統、律法、そして記憶を、神聖なるものの理解に取り入れている。"
 generic_tenet_focus_tenet_exaltation_of_pain: "[GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )]は肉体的苦痛を浄化と見なし、耐え忍ぶことや苦しみを受け入れることで信仰心を示している。"
 generic_tenet_focus_tenet_natural_primitivism: "[GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )]は過度な文明を疑い、より厳しく根源的な生き方を尊んでいる。"
 generic_tenet_focus_tenet_pursuit_of_power: "[GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )]は野心と世俗的支配を称え、支配権を神聖なるものの正当な手段として扱う。"
 generic_tenet_focus_tenet_ritual_cannibalism: "[GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )]は人肉を食することを、禁忌的な崇拝の中に組み込み、神聖な畏怖に昇華している。"
 generic_tenet_focus_tenet_sacred_shadows: "[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]は秘密の衣をまとい、秘匿、明暗の狭間、そして大衆から隠されたものを神聖なものとして崇めている。"
 generic_tenet_focus_tenet_polyamory: "[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )]は同時に複数を愛することを祝福し、神聖な絆を一つの関係に限定することを拒む。"
 generic_tenet_focus_tenet_sacrificial_ceremonies: "[GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )]は厳粛な供物を礼拝の中核に据え、それを神との契約や恩寵と結びつけている。"
 generic_tenet_focus_tenet_megaliths: "[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )]は聖なるものを不朽の石に刻み、記憶と信仰を支える錨としての役割を記念碑に託している。"
 generic_tenet_focus_tenet_fp3_fedayeen: "[GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )]は、崇高な大義のための潜伏と潜入、そして自己犠牲的な暴力を神聖化している。"
 generic_tenet_focus_tenet_communal_possessions: "[GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )]は私的な富を重視せず、信徒に財産の共同所有を促している。"
 generic_tenet_focus_tenet_pure_land: "[GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )]は、苦しみの果てにある祝福された境地に希望を据え、信頼と記憶、そして献身によってそこに到達することができるとしている。"
 generic_tenet_focus_tenet_no_mind: "[GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )]は、思考による理解を超えた明晰さを求め、自己を鍛え、空でありながら明晰な覚知に至ることを目指している。"
 generic_tenet_focus_tenet_mountain_worship: "[GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )]は、高所を神聖なものに近い場所と捉え、山頂や高地を崇敬の対象としている。"
 generic_tenet_focus_tenet_extinction_of_dharma: "[GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )]は、世界を腐敗に満ちたものと見なし、真理を守るための容赦ない暴力を是認している。"
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )]は、敵の遺骸を勝利の神聖な証と見なし、恐るべき威信の象徴として扱う。"
 generic_tenet_focus_tenet_pursuit_of_knowledge: "[GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )]は、学びを神聖な営みとして称え、学問、討論、そして規律ある探究を通して真理を追求している。"
 generic_tenet_focus_tenet_benevolent_governance: "[GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )]は、正しい統治、秩序ある管理、そして領土への配慮を、聖性の尺度の一部としている。"
 generic_tenet_focus_tenet_filial_piety: "[GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )]は、親と年長者への敬意を、道徳的かつ神聖な秩序の基盤であると説いている。"
 generic_tenet_focus_tenet_harmonious_society: "[GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )]は、均衡、礼節、そして社会の調和を、宇宙の秩序が反映されたものとして重んじている。"
 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )]は、聖なる破壊を浄化とみなし、荒廃そのものを再生の手段としている。"
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )]は、忍耐と継続、そして託されたものを大切に守り抜くことを重んじている。"
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )]は、熊や野生に宿る同種の力を、敬意と畏怖をもって崇め、大切に扱う。"
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )]は暴力を抑制し、血を流すことが正当化される神聖な条件を定めている。"
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]は祝福された死者や聖なる模範を敬い、その記憶を大切にするが、彼らを神そのものと同一視することはない。"
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )]は、聖なる秘跡が真に人を変容させるものと考え、秘跡を神の現臨をもたらす中心として重んじている。"
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )]は信仰と労働を一体とし、誠実な労働そのものが礼拝になりうると説く。"
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )]は、最も聖なる執り成し人を通常の聖人よりも高い位に据え、特別に崇敬している。"
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )]は、聖職と後援、そして世俗的な富が容易に切り離せるものではないと認めている。"
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )]はキリストの本性の統一を説き、神性と人性を過度に分けて捉えることを拒んでいる。"
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]は初期の信徒たちの共同体を模範とし、慈愛と共同生活を重んじている。"
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]は、多くの魂は死後に浄化を受けてはじめて、完全なる至福へと至ることができると説いている。"
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )]は家族、生殖、新たな命の誕生を神聖な務めとして掲げている。"
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )]は、最初の弟子にまで途切れることなく遡ることができる継承の系譜を権威の根拠としている。"
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )]は公の悔悛と赦しを重んじ、罪を言葉にして告白することが癒やしの始まりになると信じている。"
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]は、人間の弱さを根源的なものと捉え、傷一つない魂がこの世に生まれることはないと説いている。"
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )]は、宇宙を神聖な序列によって秩序づけられたものと捉え、それぞれの位階が神の意図を反映していると考えている。"
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )]は信徒を聖なる戦士とみなし、節度ある情熱をもって真理を守るよう促している。"
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )]は、議論と解釈、そして理性と信仰の調和を通じて、信仰を深めている。"
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )]は、高挙と神の子たる性質を強調し、神との永遠の区別を重視していない。"
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )]は、慈悲と慈善を日々の信仰生活の中心に据えている。"
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )]は厳粛な儀式を尊び、秩序ある礼拝を聖なるものを最も明確に感じる手段として捉えている。"
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )]は、キリストという唯一の神秘のうちに、神性と人性が切り離せない形で結ばれていると説いている。"
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]は、沈黙と静寂、そして心の中で聖なる祈りを繰り返し唱えることを通して神との合一を求めている。"
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]は、世俗を離れ、孤独と苦難、そして隔絶のうちに聖性を求めることを称えている。"
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]は低次の欲望を霊的な目的に従わせ、苦行を通して聖性を追求している。"
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )]は塗油式を特に重視し、聖油を神の恩寵の印と捉えている。"
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )]は、彫刻が施された石の十字架や不朽の記念碑を聖別し、聖なるものを世に示す証としている。"
