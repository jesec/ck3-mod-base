 #FP3 tenets
 tenet_communal_possessions_name: "共同財産"
 tenet_communal_possessions_desc: "[ROOT.Rite.GetFaith.HighGodName]は、地上の資源をすべての者が平等に分け合うことを望まれた。我々はすべてを共有し、権力者によって奪われた富を再分配すべきだ。"
