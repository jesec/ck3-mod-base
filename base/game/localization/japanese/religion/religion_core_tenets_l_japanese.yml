 doctrine_parameter_piety_from_marrying_lowborn_active: "統治者は[lowborn|E]の[characters|E]と結婚すると@piety_icon! [piety|E]を獲得し、その際に@legitimacy_icon! [legitimacy|E]を失わない"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "[decision|E]「$redistribute_realm_wealth_decision$」をアンロックする"
 tenet_sacrificial_ceremonies_name: "生贄の儀"
 tenet_sacrificial_ceremonies_desc: "自発的であれ、不本意であれ、人身御供を差し出すことで我々は神に近づく。儀式において自らの命を捧げることは、慣習であると同時に高潔な行いとみなされており、神々に対して許されぬ罪を犯した者たちを贄として捧げるのと同じくらい徳の高い行為なのである。"
 tenet_megaliths_name: "メガリスの建設"
 tenet_megaliths_desc: "礼拝は、神殿という限られた領域の中だけで行われるべきではない。これらは人の手で造られた粗野な建物に過ぎず、我々を取り巻く神の創造物から我らを遠ざけるものである。我々は、石と外気を愛し、創造主が与えてくださった石を、かの御方が望む形に配置することでその高みに近づけるのだ。"
 doctrine_parameter_can_build_megaliths: "[temple|E]領内でのメガリスや、公爵領の首都での巨大メガリスの建設が可能になる。"
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "[buildings|E]である[points_of_interest|E]を訪れた際に得られる経験値が2倍になる"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "[GetTerrain( 'hills' ).GetName]、[GetTerrain( 'terraced_hills' ).GetName]、[GetTerrain( 'mountains' ).GetName]、または[GetTerrain( 'desert_mountains' ).GetName]で建設を完了すると、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を獲得する"
 pam_megaliths_rough_terrain_construction_toast: "あなたの個人的信条「[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )]」による効果"
