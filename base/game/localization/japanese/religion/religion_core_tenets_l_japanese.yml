 tenet_fp3_fedayeen_name: "フィダーイー"
 tenet_fp3_sacred_murder_name: "神聖な殺人"
 tenet_fp3_fedayeen_desc: "通常の戦争が手段として通用しないとき、[ROOT.Rite.GetFaith.HighGodNameAlternate]の前で、[ROOT.Rite.GetFaith.HighGodHerHis|U]の敵を、潜入や欺瞞によって滅ぼすことが我々の義務だ。死や苦痛を恐れず、大いなる目的のために喜んで命を捧げなければならない。"
