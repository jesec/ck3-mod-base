l_japanese:
 doctrine_core_tenets_name: "信条："
 tenets_name: "信条"
 #Abrahamic Tenets
 tenet_communion_name: "聖餐"
 tenet_communion_desc: "我々の儀式は単なる象徴ではなく、神の降臨を祈願するものだ。儀式に参加できない者や参加しない者は、真の信者ではない。"
 doctrine_parameter_tenet_communion_denied_sacrament: "この[rite|E]から[Concept('excommunicated', '破門')|E]された[characters|E]は@piety_icon! [piety|E]獲得量が#N -25%#!、同宗派からの[opinion|E]が#N -10#!低下する"
 doctrine_parameter_tenet_communion_shared_table: "[GetActivityType('activity_feast').GetName]を主催すると、同じ[faith|E]の客人1人につき[opinion|E]を#P +10#!獲得する"
 doctrine_parameter_excommunication_active: "聖職的[heads_of_faith|E]はその[faith|E]に属するほかのキャラクターを[excommunicate|E]することができる"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "この[rite|E]の人物は、[decision|E]「[GetDecisionWithKey('pam_decision_last_rites').GetName]」を使用できる"
 doctrine_parameter_seek_indulgences_active: "この[rite|E]の人物は、[faith|E]に[head_of_faith|E]または[clerical_regions|E]が存在する場合、[interaction|E]「#high $seek_indulgences_interaction$#!」を使用できる"
 tenet_armed_pilgrimages_name: "武装した巡礼"
 tenet_armed_pilgrimages_desc: "我々の巡礼者は世界中を旅して聖地を訪れる… 喜んで剣を取り、彼らを傷つけようとするすべての者から守ろう"
 doctrine_parameter_cheaper_holy_wars_active: "この[rite|E]の[rulers|E]が[holy_wars|E]を宣言する際に必要な@piety_icon! [piety|E]が#P 20%#!減少する"
 doctrine_parameter_great_holy_wars_active: "[head_of_faith|E]が存在する場合、[great_holy_war|E]を宣言できる"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "[head_of_faith|E]が存在しない場合、信徒は支配している[holy_site|E]ごとに[convert_county|E]の[councillor_task|E]にボーナスを得る"
 doctrine_parameter_pilgrimage_decision_active: "この[rite|E]の人物は、[pilgrimage|E]を無事に終えると追加のボーナスを得る"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[holdings|E]を[holy_orders|E]に[leasing|E]すると、追加の@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "修道院生活"
 tenet_monasticism_desc: "美味しい食べものや飲みものの喜びは、我々を惑わし神への奉仕から遠ざけるだけだ。こうした誘惑を避けるには、人里離れた修道院に身を寄せるのが一番だ。"
 doctrine_parameter_take_vows_active: "[courtiers|E]は誓いを立てて[GetTrait('devoted').GetName( GetNullCharacter )]になることができる"
 doctrine_parameter_devoted_trait_criminal: "[GetTrait('devoted').GetName( GetNullCharacter )]特性は[criminal|E]である"
 doctrine_parameter_cannot_take_the_vows: "この[rite|E]の人物は、[character_interaction|E]「#high $take_vows_interaction$#!」を使用できない"
 tenet_divine_marriage_name: "神統婚姻"
 tenet_divine_marriage_xwedodah: "フヴェドダフ"
 tenet_divine_marriage_desc: "近親者と結婚することで、私たちは創造の最初の存在たちの神聖な結合を模倣する。優れた特質が家系に受け継がれ、それによって邪悪に対する永遠の戦いで純粋さと恩恵を得るのだ。"
 doctrine_parameter_divine_marriage_opinion: "[close_family|E]の一員と婚姻している信徒は同じ[faith|E]の[vassals|E]からの[opinion|E]を$VALUE|0+=$得る"
 doctrine_parameter_divine_marriage_piety_gain_active: "あなたが[close_family|E]の一員と婚姻する場合、[GetDoctrineType('doctrine_monogamy').GetBaseName]の婚姻ボーナスとして大量の@piety_icon! [piety|E]も獲得する"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "[spouse|E]の[councillor_tasks|E]からの[skills|E]貢献度：#P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "[close_family|E]や[extended_family|E]と結婚している[liege|E]に対し、信徒が[factions|E]を結成したり、それに参加したりする可能性が著しく低い"
 tenet_pacifism_name: "平和主義"
 tenet_pacifism_desc: "暴力は苦しみと痛みと後悔しか生まない忌まわしい行為だ。できるだけそれを避けようと努力することで、より強く安全な社会を築くことができる。平和主義の伯爵領は、この平和な秩序の下で成長し、繁栄していく。"
 doctrine_parameter_holy_wars_forbidden: "[holy_wars|E]または[raid|E]を宣言できない"
 doctrine_parameter_pacifist_opinion_active: "平和主義者の好感度：$VALUE|+=0$"
 pacifist_opinion_name: "同輩の平和主義者"
 pacifist_county_opinion_name: "同輩の平和主義者の伯爵領"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "ほかの平和主義者への[opinion|E]：$VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "2年以上平和状態の統治者は、@piety_icon! [piety|E]が毎月$VALUE|+$変化する"
 PIETY_LONG_PEACE: "長い平和"
 tenet_vows_of_poverty_name: "清貧の誓い"
 tenet_vows_of_poverty_desc: "金銭は人の心を堕落させ、真の信仰から遠ざける。本当に大切なことに集中するには、物質的な富の獲得を避け、つつましい営みを選び、それを成しとげることに信仰心を見出さなければならない。"
 doctrine_parameter_vows_of_poverty_active: "[rulers|E]は清貧の誓いを立てる[decide|E]ができ、毎月の[tax|E]の収入が減るが毎月得られる@piety_icon! [piety|E]が増加する"
 tenet_human_sacrifice_name: "人身御供"
 tenet_human_sacrifice_desc: "献身を証明する最高の方法は、犠牲をささげることだ。我々が提供できる最も価値ある犠牲は、人命だ。"
 doctrine_parameter_human_sacrifice_active: "[executions|E]によって@piety_icon! [piety|E]を費やすのではなく@piety_icon! [piety|E]を獲得する"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[sharing_power|E]をしていると[executions|E]によって@prestige_icon! [prestige|E]一切費やさない"
 doctrine_parameter_flower_war_cb_active: "隣接する領国に対する[flowery_war|E]の[casus_belli|E]が与えられる"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "[executions|E]を行うと、生贄の[nobility|E]と[rank|E]に応じて、追加の@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "[sieges|E]中に人物を捕える確率が大幅に上昇する"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "所領無しの人物の[imprison|E]に成功する確率が上昇する"
 tenet_gruesome_festivals_blot_name: "ブロート"
 tenet_gruesome_festivals_name: "陰惨なる祝祭"
 tenet_gruesome_festivals_desc: "我らは皆、血の中から生まれる。我らは家畜の血、家族の血、敵の血によって生かされている。[ROOT.Rite.GetFaith.PantheonTerm]が応分の分け前をお望みになるのは、もっともなことなのだ。"
 gruesome_festivals_active_name: "大生贄祭を執り行う能力"
 doctrine_parameter_gruesome_festivals_active: "@piety_icon! [piety|E]に加えて同じ[faith|E]の臣下と[county_opinion|E]を得るために、約10年に一度、[GetActivityType('activity_gruesome_festival').GetName]の[activity|E]をアンロックする"
 tenet_volcanic_veneration_name: "火山に対する畏敬の念"
 tenet_volcanic_veneration_desc: "我らが故郷の火を噴く大穴より、新たに生まれ出でた土ほど神聖なものもそうあるまい。我々は、天災と隣り合わせで生きるさだめにあり、すべては[ROOT.Rite.GetFaith.PantheonTerm]次第なのである。"
 tenet_cthonic_redoubts_name: "地上の要塞"
 tenet_cthonic_redoubts_desc: "大地の根に勝る避難所はなく、突き出たとげに勝る要塞はなく、隠された小道に勝る神聖な巡礼はない。我々はこの高い頂上から天地創造を見下ろし、神の真の重みを感じる。"
 doctrine_parameter_easier_to_convert_faith_in_mountains: "山岳[terrain|E]での[convert_county|E]の速度：#P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "同[faith|E]の山岳[terrain|E]での[promote_culture|E]の速度：#P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "山岳[terrain|E]での敵対的な[convert_county|E]の速度：#P +[EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "救慰礼"
 tenet_consolamentum_name_alternate: "儀礼的自殺"
 tenet_consolamentum_desc: "高齢になった者や病気になった者は、罪悪の魂を清める儀式を行う。それが終われば、我々は命を素早く確実に終わらせ、罪悪が我々に群がる機会を与えないようにする。"
 doctrine_parameter_consolamentum_active: "信徒は高齢の時、無能の時、または瀕死の時に自らの命を終わらせることを[decide|E]でき、そうすることで自殺による通常のペナルティを受けなくなる"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "[decision|E]「[GetDecisionWithKey('initiate_consolamentum_decision').GetName]」によって信徒が死亡すると、その後継者が@piety_icon! [piety|E]を#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#!獲得する"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "[decision|E]「[GetDecisionWithKey('initiate_consolamentum_decision').GetName]」によってあなたが死亡すると、あなたの後継者が追加で@piety_icon! [piety|E]を#P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#!、および$pam_blessed_passing_modifier$を#P 10#!年間獲得する"
 tenet_gnosticism_name: "グノーシス主義"
 tenet_gnosticism_desc: "知識を通して、全人類の内側に宿る神の光が解放され、霊的世界にある天上の故郷へと還ることができるかもしれない。"
 doctrine_parameter_granting_titles_gives_stress: "[titles|E]を授与すると、[stress|E]が減少する"
 tenet_mendicant_preachers_name: "托鉢説教"
 tenet_mendicant_preachers_desc: "伝道師は来ている衣服以外何も持たずに遠く広く旅をする。彼らは人々の施しに頼って生き、見返りとして真なる信仰の知識を分け与える。"
 doctrine_parameter_mendicant_preachers_conversion_active: "伯爵領の改宗速度：#P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "[character|E]を改宗させると、追加の@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を獲得する"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "別の[faith|E]に属する[characters|E]への懐柔が成功しやすくなる"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "あなたの[activities|E]に参加した客人が、あなたの[faith|E]に改宗する場合がある"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "あなたが現在いる[location|E]の[ruler|E]に対して、[interaction|E]「#V $attempt_conversion_of_local_ruler_interaction$#!」を使用できる"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "[GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)][perk|E]がなくても、[travel_option|E]「[GetTravelOption('adventurers_proselytize_zealously_option').GetName]」を使用できる"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U]が[first.GetFaith.GetName]に改宗"
 must_be_in_same_county_tt: "相手が保持する[county|E]にいなければならない"
 tenet_communal_identity_name: "共同体の独自性"
 tenet_communal_identity_desc: "我々の信仰と文化は本質的に結びついている。これは共同体の絆を強めるが、外部の者を排除する傾向がある。"
 doctrine_parameter_same_communal_identity_opinion_active: "同じ[faith|E]のキャラクターの[opinion|E]#P +10#!"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "[ecumenical_council|E]で派閥を懐柔しても@prestige_icon! [prestige|E]を費やさない"
 doctrine_parameter_tenet_communal_identity_sway_piety: "あなたと同じ[rite|E]の人物の[GetScheme('sway').GetTypeName]に成功するたび、[piety_i] #P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#![piety|E]を得る"
 doctrine_parameter_tenet_communal_identity_language_devotion: "あなたと同じ[rite|E]の対象に対する[GetScheme('learn_language').GetTypeName]の[scheme_success_chance|E]：[success_chance_i] #P +20%#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "あなたと同じ[rite|E]の人物の[language|E]を学習すると@piety_icon! [piety|E]と@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を得る"
 doctrine_parameter_same_culture_conversion_bonus_active: "自分の[culture|E]の[counties|E]の改宗速度：#P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "自分の[faith|E]の[counties|E]の文化の拡張速度：#P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "異なる[culture|E]の[counties|E]の改宗速度：#N -50%#!"
 tenet_pentarchy_name: "神権国家"
 tenet_pentarchy_alternate_name: "五本山"
 tenet_pentarchy_desc: "我々の聖地はただ単に神聖なだけの場所ではなく、宗教指導者が統治を行う権力の座そのものだ。"
 tenet_aniconism_name: "反偶像主義"
 tenet_aniconism_desc: "偶像崇拝はあまりにも多くの人々から神聖な真実を見る目を奪ってきた。我々はすべての偶像を神聖な場から追放し、信徒がその罠に陥らないようにする。"
 doctrine_parameter_reforging_artifacts_costs_piety: "この[rite|E]の[rulers|E]は[artifacts|E]の[reforge|E]または[repair|E]に@piety_icon! [piety|E]を消費しなければならない"
 doctrine_parameter_destroying_artifacts_is_pious: "この[rite|E]の[rulers|E]は[artifacts|E]を破壊して@piety_icon! [piety|E]を得られる"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "[artifacts|E]を破壊して@piety_icon! [piety|E]を得られる"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "この[core_tenet|E]を持たない[faith|E]の[rulers|E]の所領を包囲すると、[development|E]が通常より大きく低下し、[artifacts|E]が損傷する確率が上がるほか、@piety_icon! [piety|E]を得る"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "[artifacts|E]を破壊するか、この[core_tenet|E]を持たない[faith|E]の所領を包囲すると、@spiritual_fulfillment_icon! [spiritual_fulfillment|E]を獲得する"
 pam_aniconism_siege_toast: "あなたの[personal_tenet|E]「[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]」による効果"
 destroying_artifacts_is_not_pious_tt: "あなたの[rite|E]では、[artifacts|E]を破壊して[piety|E]を得ることはできない"
 artifact_is_rarer_than_masterwork_tt: "この[artifact|E]は名品より[rarity|E]が高い"
 tenet_alexandrian_catechism_name: "アレクサンドリアの教理問答"
 tenet_alexandrian_catechism_desc: "アレクサンドリア教校には、神学者がものごとを批判的に考え、現状に疑問を持つことを奨励する長い伝統があった。\n\n教校は物理的には破壊されたが、我々はこの伝統を継続している。"
 tenet_islamic_rationalism_name: "イスラム合理主義"
 tenet_islamic_rationalism_desc: "[ROOT.Rite.GetFaith.HighGodNameAlternate]は公正で賢明であるため、[ROOT.Rite.GetFaith.HighGodNameSheHe|U]は理性に反したり、[ROOT.Rite.GetFaith.HighGodHerHis|U]の創造物の幸福を無視したりすることはない。純粋な理性によってのみ、我々は[ROOT.Rite.GetFaith.HighGodHerHis|U]の偉大な業における自らの役割を理解し、善と悪を分別することができるのだ。"
 doctrine_parameter_scholasticism_is_holy: "[trait|E]「[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]」は追加のボーナスをもたらす"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "[learning|E]の[education_focus|E]で教育した子供は、成人すると[learning_lifestyle|E]の[experience|E]を得ることがある。自分自身の教育水準が高いほど、その可能性も高まる。"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "伯爵領の改宗速度：#P +25%#!"
 tenet_hedonistic_name: "快楽主義"
 tenet_hedonistic_desc: "神はこの世界を、夢中になって楽しめる豊かな享楽で満たした… それらを味わわないことは、神の創造物に対する侮辱だ。"
 doctrine_parameter_piety_from_feasts_active: "[GetActivityType('activity_feast').GetName]を開催すると@piety_icon! [piety|E]を獲得する"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" #Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "[GetActivityType('activity_festival').GetName]を開催すると@piety_icon! [piety|E]を獲得する"
 tenet_carnal_exaltation_name: "肉欲の法悦"
 tenet_carnal_exaltation_desc: "肉の悦びは地上に存在するほかのいかなる体験をも超越しているという点で崇高なものであり、我々を神へ近づける。我々は己の性欲を讃え、それを満たす機会を追い求めるべきだ。"
 doctrine_parameter_piety_from_seduction_active: "[schemes|E]「[GetScheme('seduce').GetTypeName]」に成功すると、@piety_icon! [piety|E]を獲得する"
 doctrine_parameter_tenet_carnal_exaltation_clergy_no_continence: "この[rite|E]の[clergy|E]は、肉体関係を断つことが求められていない"
 doctrine_parameter_tenet_carnal_exaltation_deviancy_virtuous: "[faith|E]が[GetDoctrineType('doctrine_deviancy_virtuous').GetBaseName]の[doctrine|E]を選択できるようになる"
 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "[GetTrait('lustful').GetName( GetNullCharacter )]、[GetTrait('rakish').GetName( GetNullCharacter )]、または[GetTrait('deviant').GetName( GetNullCharacter )]の[characters|E]は、特性ごとに[intrigue|E]を#P +2#!、[diplomacy|E]を#P +2#!、[fertility|E]を#P +25%#!獲得する"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "[GetTrait('lustful').GetName( GetNullCharacter )]、[GetTrait('rakish').GetName( GetNullCharacter )]、または[GetTrait('deviant').GetName( GetNullCharacter )]の[characters|E]は、特性ごとに[GetScheme('seduce').GetTypeName]の[schemes|E]の完了が#P 20#!日早くなる"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "[decision|E]「[GetDecisionWithKey('commission_artifact_decision').GetName]」で「道楽品」の宝物を作成できる"
 tenet_polyamory_name: "ポリアモリー"
 tenet_polyamory_desc: "我々の互いへの愛は、我々に対する[ROOT.Rite.GetFaith.FertilityGodNamePossessive]の愛と同じく無条件であるべきだ。我々は一人の人間が別の一人の愛情を専有するという時代遅れの考え方を捨てねばならない。"
 doctrine_parameter_no_unfaithfulness_penalty_active: "信徒は配偶者やその愛人が婚姻外で関係を持ったことによって[opinion|E]ペナルティや[imprisonment_reasons|E]を受けることがない"
