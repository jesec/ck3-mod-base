 witchcraft_shunned_name: "忌避される魔術教義"
 doctrine_head_of_faith_name: "宗教指導者"
 doctrine_head_of_faith_desc: "[head_of_faith|E]とは、[faith|E]のリーダーのことです"
 doctrine_no_head_name: "なし"
 doctrine_no_head_descriptive_name: "宗教指導者なし"
 doctrine_no_head_desc: "一人の人間が[ROOT.Faith.HighGodName]の御心を真に理解できると考えるのはまったく愚かなことだ。我々はそれぞれが自分の心に従い、[ROOT.Faith.HighGodHerHis]が我々のために何をお考えなのかを見出さなくてはならない。"
 doctrine_parameter_no_head_of_faith: "[head_of_faith|E]がいない"
