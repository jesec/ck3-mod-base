 doctrine_bastardry_legitimization_desc: "婚姻は神聖なものであり、婚姻外で生まれた子供を認知するには、別の方法で祝福しなければならない。"
 doctrine_bastardry_all_name: "認知不可"
 doctrine_bastardry_all_descriptive_name: "庶子の不認知"
 doctrine_bastardry_all_desc: "結婚の絆は神聖不可侵なものであり、婚姻外で生まれた子供は永遠に庶子であり続ける。"
 doctrine_parameter_bastards_none: "[bastard|E]などというものは存在しない。すべての子供は等しく[legitimate|E]だ"
 doctrine_parameter_bastards_legitimize: "[bastards|E]は[house_head|E]または[dynast|E]が許可すれば認知することができる"
 doctrine_parameter_bastards_always: "[bastards|E]が認知されることはない"
