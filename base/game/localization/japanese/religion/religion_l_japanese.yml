 doctrine_parameter_minimum_fervor: "熱情が#V $VALUE|0$%#!より低くならない"
 doctrine_spiritual_head_name: "信仰重視"
 doctrine_spiritual_head_descriptive_name: "霊的な指導"
 doctrine_spiritual_head_desc: "物質世界と聖職的世界は別物だ。我々は聖職的世界に独自の指導者を立たせ、その人物が我々を導き、我々の信仰が物質的な欲望によってけがされないようにしなくてはならない。"
 doctrine_parameter_spiritual_head_of_faith: "とりわけ優れた聖職者に[head_of_faith|E]の地位が与えられる"
 doctrine_parameter_spiritual_head_of_faith_claims: "[head_of_faith|E]は所領持ちの称号に対する[claims|E]を敬虔な信徒に与えることができる"
 doctrine_parameter_spiritual_head_of_faith_gold: "[head_of_faith|E]は[gold|E]を敬虔な信徒に与えることができる"
 doctrine_temporal_head_name: "世俗的"
 doctrine_temporal_head_descriptive_name: "世俗的な指導"
 doctrine_parameter_temporal_head_of_faith: "[head_of_faith|E]の地位が[faith|E]の創始者に与えられ、死後は[primary_heir|E]に継承される"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "その宗派が[great_holy_wars|E]を行うとき、宗教指導者はその戦争を指揮し、戦争目標を選ぶことができる"
 doctrine_temporal_head_desc: "精神的なものと肉体的なものは本質的に結びついており、切り離すことはできない。一つの領国に指導者が二人いるのは愚かなことだ。"
 doctrine_marriage_type_name: "婚姻の形式"
 doctrine_monogamy_name: "単婚制"
 doctrine_monogamy_descriptive_name: "単婚制"
 doctrine_monogamy_desc: "婚姻は二人の人間の間にある神聖な絆だ。そのような絆を一度に複数の人と結ぼうとすることは冒涜行為だ。"
 doctrine_polygamy_name: "複婚制"
 doctrine_polygamy_descriptive_name: "複婚制"
 doctrine_polygamy_desc: "婚姻は神聖な結びつきであり、複数の婚姻関係を持つことが一つだけの婚姻関係よりも神聖なのは明らかだ… それぞれの婚姻が神聖なものならば。"
 doctrine_concubines_name: "側夫と側妻"
 doctrine_concubines_descriptive_name: "側室制"
 doctrine_concubines_desc: "婚姻は神聖な絆だが、配偶者が優先される限り、側妻または側夫を持つことが許される。"
