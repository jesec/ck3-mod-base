 doctrine_clerical_gender_female_only_name: "女性のみ"
 doctrine_clerical_gender_female_only_descriptive_name: "女性限定の聖職制"
 doctrine_clerical_gender_female_only_desc: "女性のみが[ROOT.Faith.HighGodNamePossessive]の意志を解釈し、我々の宗派の[ROOT.Faith.PriestFemalePlural]として奉仕できるだけの賢さを持っている。"
