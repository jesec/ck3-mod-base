 doctrine_clerical_marriage_name: "聖職者の結婚"
 doctrine_clerical_marriage_allowed_name: "可能"
 doctrine_clerical_marriage_allowed_descriptive_name: "聖職者の結婚の許可"
 doctrine_clerical_marriage_allowed_desc: "婚姻は神聖な制度であるため、[ROOT.Faith.PriestNeuterPlural]はほかの敬虔な信徒と同じくその制度を利用できる。"
 doctrine_parameter_clergy_can_marry: "[clergy|E]は[marry|E]できる"
 doctrine_clerical_marriage_disallowed_name: "禁止"
 doctrine_clerical_marriage_disallowed_descriptive_name: "聖職者の結婚の禁止"
 doctrine_clerical_marriage_disallowed_desc: "[ROOT.Faith.PriestNeuter]になることは人生を[ROOT.Faith.HighGodName]にささげることを意味する。従って配偶者を持つことを考えるのは、本質的に不信心なことだ。"
 doctrine_parameter_clergy_can_marry_disabled: "[clergy|E]は[marrying|E]が禁止されている\n$EFFECT_LIST_BULLET$[clergy|E]に対する[GetScheme('seduce').GetTypeName]および[GetScheme('courting').GetTypeName]の[scheme_success_chance|E]：[success_chance_i]#N -25%#!"
 doctrine_clerical_succession_name: "聖職者の任命"
 doctrine_clerical_succession_temporal_appointment_name: "世俗的、取り消し可能"
 doctrine_clerical_succession_temporal_appointment_descriptive_name: "世俗権力による罷免可能な聖職任命制"
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U]は突きつめれば領国のしもべであるため、わずかな制約のもと、その主君によって雇用し解雇することができる。"
 doctrine_clerical_succession_spiritual_appointment_name: "聖職的、取り消し可能"
 doctrine_clerical_succession_spiritual_appointment_descriptive_name: "宗教的権威による罷免可能な聖職任命制"
 doctrine_clerical_succession_spiritual_appointment_desc: "[ROOT.Faith.AltPriestTermPlural]がすべての[ROOT.Faith.BishopNeuterPlural]を任命するが、世俗の統治者はその期待に応えられない者を解雇することができる。"
 doctrine_clerical_succession_temporal_fixed_appointment_name: "世俗的、終身"
 doctrine_clerical_succession_temporal_fixed_appointment_descriptive_name: "世俗権威による終身聖職任命制"
 doctrine_clerical_succession_temporal_fixed_appointment_desc: "統治者は自ら[ROOT.Faith.BishopNeuterPlural]を選ぶことができるが、その責務は神聖なものであり、任命を取り消すことはできない。"
 doctrine_clerical_succession_spiritual_fixed_appointment_name: "聖職的、終身"
 doctrine_clerical_succession_spiritual_fixed_appointment_descriptive_name: "宗教的権威による終身聖職任命制"
 doctrine_clerical_succession_spiritual_fixed_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U]は神のしもべであり、神の代理人として[ROOT.Faith.AltPriestTermPlural]がこの地位に対して行う選択は揺らぐことのない絶対的なものだ。"
 doctrine_clerical_succession_conditional_name: "条件付き"
 doctrine_clerical_succession_conditional_descriptive_name: "条件付き聖職者任命制"
 doctrine_clerical_succession_conditional_desc: "聖職称号の保持者を交代させる権限が誰にあるかは、いまだ定まっていない。こうした権限の曖昧さは、必然的に宗派を[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]へと向かわせる。"
 doctrine_clerical_succession_conditional_can_pick_tt: "この[doctrine|E]は任意に選択できず、公会議を通じてのみ再び制定できる"
 doctrine_parameter_clerical_appointment_ruler: "[rulers|E]が自らの[realm_priest|E]や[court_chaplain|E]を任命する"
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E]または[court_chaplains|E]は聖職者の中から選ばれ、必要に応じて[rulers|E]に割り当てられる"
 doctrine_parameter_clerical_appointment_fixed_disabled: "[realm_priest|E]や[court_chaplain|E]を解雇して新たに任命される者を後任にすることができる"
 doctrine_parameter_clerical_appointment_fixed: "[realm_priest|E]や[court_chaplain|E]は生涯にわたってその地位を保有する"
 doctrine_parameter_clerical_appointment_ruler_can_replace_ecc: "世俗[rulers|E]は、自身の[realm|E]内の[clerical_title|E]の[holders|E]を交代させることができる"
 doctrine_parameter_clerical_appointment_hof_can_replace_ecc: "[head_of_faith|E]は、[clerical_title|E]の[holders|E]を交代させることができる"
 doctrine_theism_name: "有神論"
 doctrine_monotheist_name: "一神教徒"
 doctrine_monotheist_descriptive_name: "一神教"
 doctrine_monotheist_desc: "唯一の神のみが崇拝される。ほかのいわゆる「神々」は、せいぜい空虚な偶像に過ぎず、最悪の場合は悪意ある欺瞞者が正しい[ROOT.Faith.HighGodName]への崇拝から信仰心を遠ざけようとする誘惑だ。[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning: "\n\n$FAITH_MANDALA_MONOTHEIST_WARNING$"
 mandala_monotheist_warning_tt_global: "[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning_tt_first: "$mandala_monotheist_warning_tt_global$"
 mandala_monotheist_warning_tt_third: "$mandala_monotheist_warning_tt_global$"
 doctrine_polytheist_name: "多神教徒"
 doctrine_polytheist_descriptive_name: "多神教"
 doctrine_polytheist_desc: "宇宙は強大な神々や精霊で満ちている。はっきりとした神々の体系が存在する場合もあるが、霊的世界は無限で、周囲のあらゆるものに遍在し、名前のある神すら存在しないこともある。"
 unreformed_faith_doctrine_name: "未改革"
 unreformed_faith_doctrine_descriptive_name: "未改革の宗派"
 unreformed_faith_name: "教義"
 unreformed_faith_doctrine_desc: "未改革の宗派は組織化された聖職者と確立された正統の教義を持たない。異なる共同体が名目上同じ宗派を信仰していても、その宗教的慣習や信条は大きく異なる場合がある。"
 doctrine_parameter_unreformed: "部族制の[rulers|E]は[government|E]の政体を変更できない\n$EFFECT_LIST_BULLET$[unreformed_pagan_combat_bonus|E]を与える"
