 doctrine_clerical_function_taxation_desc: "[ROOT.Faith.AltPriestTermPlural]の権威は[ROOT.Faith.HighGodName]に由来し、それはこの世界でも適用される。"
 doctrine_clerical_function_alms_and_pacification_name: "施しと慰安"
 doctrine_clerical_function_alms_and_pacification_descriptive_name: "聖職者による施しと慰安"
 doctrine_clerical_function_alms_and_pacification_desc: "我々の[ROOT.Faith.PriestNeuterPlural]は、自給自足のできない貧民や抑圧された人々に十分な食料と避難所を用意する責務を担っている。"
 doctrine_clerical_function_recruitment_name: "徴兵"
 doctrine_clerical_function_recruitment_descriptive_name: "聖職者の軍事機能"
 doctrine_clerical_function_recruitment_desc: "[ROOT.Faith.PriestNeuterPlural]は武器を取り、信仰を守るために戦うことができる。模範者として人々を指導する責任が、戦いの中で彼らにさらなる力を与える。"
 doctrine_parameter_clergy_can_fight: "[clergy|E]は[commanders|E]または$knight_culture_player_plural$となることができる"
 doctrine_clerical_gender_name: "聖職者の性別"
 doctrine_clerical_gender_male_only_name: "男性のみ"
 doctrine_clerical_gender_male_only_descriptive_name: "男性限定の聖職制"
 doctrine_clerical_gender_male_only_desc: "男性のみが我々の宗派の[ROOT.Faith.PriestMalePlural]として奉仕する重大な責務を担うことができる。"
