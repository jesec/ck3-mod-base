 doctrine_clerical_gender_either_name: "両性"
 doctrine_clerical_gender_either_descriptive_name: "性別不問の聖職制"
 doctrine_clerical_gender_either_desc: "神の呼びかけを感じた者は、性別にかかわらず[ROOT.Faith.PriestNeuterPlural]として奉仕することができる。"
 doctrine_parameter_clergy_can_be_either_gender: "性別は寺院[holdings|E]の授与と[court_chaplains|E]への任命に影響しない"
