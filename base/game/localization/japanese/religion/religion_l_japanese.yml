 doctrine_parameter_kinslaying_close_kin_crime: "[GetTrait('kinslayer_3').GetName( GetPlayer )]の[trait|E]を持つ[kinslayers|E]は[dynasty|E]から[criminals|E]とみなされる"
 doctrine_parameter_kinslaying_shunned: "[kinslayers|E]は[shunned|E]される"
 doctrine_parameter_kinslaying_accepted: "肉親を殺した者が[kinslayers|E]とみなされることはない"
 doctrine_kinslaying_extended_family_crime_name: "家族殺しは罪"
 doctrine_kinslaying_extended_family_crime_descriptive_name: "家族殺しの罪"
 doctrine_kinslaying_extended_family_crime_desc: "自分の家族を殺害することは、最も忌まわしい犯罪の一つだ。そのようなことをした者はすべて厳罰に処せられる。"
 doctrine_kinslaying_close_kin_crime_name: "近親殺しは罪"
 doctrine_kinslaying_close_kin_crime_descriptive_name: "近親殺しの罪"
 doctrine_kinslaying_close_kin_crime_desc: "同胞殺しやそれに準ずる行為は公正かつ高潔な社会では許されない。そのような犯罪を犯した者は罰せられる。"
 doctrine_kinslaying_shunned_name: "忌避"
 doctrine_kinslaying_shunned_descriptive_name: "同族殺しの忌避"
 doctrine_kinslaying_shunned_desc: "自分の親族を殺害するのは恐ろしいことだが、そのような行為が本質的にほかの殺人よりもより罪が重いということはない。"
 doctrine_kinslaying_accepted_name: "受容"
 doctrine_kinslaying_accepted_descriptive_name: "同族殺しの受容"
 doctrine_kinslaying_accepted_desc: "自分の家族の殺害は、ほかのいかなる殺人と違いがなく、同じように扱われる。"
 kinslayer_crime_dynasty: "肉親殺し"
 doctrine_consanguinity_name: "血族関係"
 doctrine_consanguinity_dynastic_name: "直系禁止"
 doctrine_consanguinity_dynastic_descriptive_name: "王朝内結婚の禁止"
 doctrine_consanguinity_dynastic_desc: "同姓同祖の者とは、いかに遠縁であろうとも結婚することは厳しく禁じられる。また、 血縁的に近い他姓の人間と結婚することも許されない。"
 doctrine_consanguinity_restricted_name: "近親相姦の禁忌"
 doctrine_consanguinity_restricted_descriptive_name: "近親婚の禁止"
 doctrine_consanguinity_restricted_desc: "二人の親族が婚姻したり性的関係を持ったりすることを許すのは、[ROOT.Faith.HighGodName]に対する罪悪だ。"
 doctrine_parameter_consanguinity_restricted_marriage: "[extended_family_members|E]や[close_family_members|E]同士の婚姻は禁止されている"
 doctrine_parameter_consanguinity_restricted_close_kin_incest: "[extended_family_members|E]や[close_family_members|E]間の性的関係は近親相姦の[secret|E]を与える"
 doctrine_consanguinity_cousins_name: "いとこ婚"
 doctrine_consanguinity_cousins_descriptive_name: "$doctrine_consanguinity_cousins_name$"
