 global_religion.1000.desc_same_faith_counties: "[local_character.MakeScope.Var( 'loc_number' ).GetValue|0]人を超える[target_rite.GetName]信者が[target_rite_associated_county.GetName]から追放され、我が領国への入国を希望している。その指導者である[local_character.GetFirstName]が謁見を求めてきた。「[ROOT.Char.GetTitleAsNameNoTooltip]よ、我々はより良く、より安全な暮らしを求めています」と、[local_character.GetSheHe]は言った。「[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]に我々を住まわせてください」"
 global_religion.1000.desc_same_faith_counties_alt: "[target_rite_associated_county.GetName]では宗教的迫害が蔓延しており、[target_rite_associated_county_rite.GetAdjective]の貴族たちが[target_rite.GetName]の信者を強制的に改宗させている。\n\nそして今、[local_character.MakeScope.Var( 'loc_number' ).GetValue|0]人を超える亡命者が我が領国への入国を求めている。彼らの指導者、[local_character.GetFirstName]が謁見を求めてきた。「[ROOT.Char.GetTitleAsNameNoTooltip]よ、我々はより良く、より安全な暮らしを求めています」と、[local_character.GetSheHe]は言った。「[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]に我々を住まわせてください」"
 global_religion.1000.desc_any_counties: "[target_rite_associated_county.GetName]では宗教的迫害が蔓延しており、[target_rite_associated_county_rite.GetAdjective]の貴族たちが[target_rite.GetName]の信者を強制的に改宗させている。\n\nそして今、[local_character.MakeScope.Var( 'loc_number' ).GetValue|0]人を超える亡命者が我が領国への入国を求めている。彼らの指導者、[local_character.GetFirstName]が謁見を求めてきた。「[ROOT.Char.GetTitleAsNameNoTooltip]よ、我々はより良く、より安全な暮らしを求めています」と、[local_character.GetSheHe]が懇願した。「どうか[initial_county_target.GetNameNoTier]の周辺に我々を住まわせてください」\n\nこれを許せば、[local_character.GetFaith.GetAdjective]信仰が[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]中に広まるだろう。"
 global_religion.1000.desc_any_counties_alt: "[local_character.MakeScope.Var( 'loc_number' ).GetValue|0]人を超える[target_rite.GetName]の信者が[target_rite_associated_county.GetName]から追放され、我が領国への入国を希望している。彼らの指導者[local_character.GetFirstName]が謁見を求めてきた。「[ROOT.Char.GetTitleAsNameNoTooltip]よ、我々はより良く、より安全な暮らしを求めています」と、[local_character.GetSheHe]が懇願した。「どうか[initial_county_target.GetNameNoTier]の周辺に我々を住まわせてください」\n\nこれを許せば、[local_character.GetFaith.GetAdjective]信仰が[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]中に広まるだろう。"
