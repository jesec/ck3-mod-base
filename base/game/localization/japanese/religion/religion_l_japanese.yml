 special_doctrine_full_tolerance_desc: "誰もが自由に自分の宗派を選ぶことができます。我々の違いは我々を分断するのではなく、強くしてくれる。"
 nudity_doctrine_name: "裸体に関する視点"
 special_doctrine_naked_priests_name: "裸の祭司"
 special_doctrine_naked_priests_descriptive_name: "$special_doctrine_naked_priests_name$"
 special_doctrine_naked_priests_desc: "我々の祭司は衣服が精神を閉じ込め、真の悟りへの道を阻むことを知っている。我々は衣服を脱ぎ捨てることによってのみ、魂を目覚めさせ、[ROOT.Faith.HighGodNamePossessive]の愛を感じることができる。"
 doctrine_parameter_naked_priests_active: "祭司と狂信的な者は衣服を身につけない。"
 doctrine_gender_name: "性別に関する視点"
 doctrine_gender_male_dominated_name: "男性優位"
 doctrine_gender_male_dominated_descriptive_name: "男性優位社会"
 doctrine_gender_male_dominated_desc: "男性のほうが強く、この過酷で容赦のない世界で我々を導く能力に優れているため、我々は彼らに社会の統治を任せる。"
 doctrine_gender_equal_name: "対等"
 doctrine_gender_equal_descriptive_name: "男女平等"
 doctrine_gender_equal_desc: "性別のみを理由にして、能力のある人に政府における役割を与えないのは愚かしいことだ。我々は有能な者なら誰であろうと、我々の社会を統治することを許可する。"
 doctrine_gender_female_dominated_name: "女性優位"
 doctrine_gender_female_dominated_descriptive_name: "女性優位社会"
 doctrine_gender_female_dominated_desc: "女性は、女性だけが我々の社会を正しく統治するのに必要な知恵と思慮分別を持っているということを幾度となく証明してきた。"
 doctrine_divorce_name: "離婚"
 doctrine_divorce_disallowed_name: "禁止"
 doctrine_divorce_disallowed_descriptive_name: "離婚の禁止"
 doctrine_divorce_disallowed_desc: "婚姻の誓いは揺るがず、拘束力があるものだ。ふたりを分かつのは死のみである。"
 doctrine_divorce_approval_name: "許可が必要"
 doctrine_divorce_approval_descriptive_name: "条件付きの離婚の許可"
 doctrine_divorce_approval_desc: "夫婦の絆を軽視するべきではないが、事情によっては離婚が必要となる場合がある。"
 doctrine_divorce_allowed_name: "常に可能"
 doctrine_divorce_allowed_descriptive_name: "常に離婚を許可"
 doctrine_divorce_allowed_desc: "婚姻とはただ二人の人間の協力関係でしかなく、すべての協力関係と同じように、自由に終わらせることができる。"
 doctrine_parameter_divorce_disallowed: "キャラクターは[spouse|E]と[divorce|E]することが一切許されない"
 doctrine_parameter_divorce_approval: "キャラクターは聖職的な[head_of_faith|E]の（聖職的な宗教指導者が存在しない場合は[house_head|E]の）許可があれば[spouse|E]と[divorce|E]できる"
 doctrine_parameter_divorce_allowed: "キャラクターは[piety|E]を支払うことでいつでも[spouse|E]と[divorce|E]できる"
 doctrine_bastardry_name: "庶子"
 doctrine_bastardry_none_name: "庶子なし"
 doctrine_bastardry_none_descriptive_name: "常に庶子を認知"
 doctrine_bastardry_none_desc: "家系を決めるのは血であり、婚姻ではない。婚姻外で生まれた子供には、ほかの子供と同様に継承資格がある。"
 doctrine_bastardry_legitimization_name: "認知"
