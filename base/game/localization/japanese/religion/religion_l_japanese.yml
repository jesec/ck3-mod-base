 doctrine_parameter_homosexuality_shunned: "[GetTrait('sodomite').GetName( GetDummyMale )]の[trait|E]を持つ男性は[shunned|E]される"
 doctrine_parameter_homosexuality_accepted: "同性間の関係は完全に受け入れられる"
 doctrine_deviancy_name: "性的倒錯"
 doctrine_deviancy_crime_name: "犯罪者"
 doctrine_deviancy_crime_descriptive_name: "性的倒錯の罪"
 doctrine_deviancy_crime_desc: "正しい人の愛し方が一つしかないのは明らかだ。そこからの逸脱はすべて罪悪であり、罰せられなければならない。"
 doctrine_deviancy_shunned_name: "忌避"
 doctrine_deviancy_shunned_descriptive_name: "性的倒錯の忌避"
 doctrine_deviancy_shunned_desc: "世の中には異常で奇妙な性行為が存在する。当然、そのような欲望を持つことも異常で奇妙なことだ。"
 doctrine_deviancy_accepted_name: "受容"
 doctrine_deviancy_accepted_descriptive_name: "性的倒錯の受容"
 doctrine_deviancy_accepted_desc: "形にかかわらず、愛とは美しく尊いものだ。誰もが望むままに愛し合うことは許されるべきである。"
 doctrine_deviancy_virtuous_name: "美徳"
 doctrine_deviancy_virtuous_descriptive_name: "性的倒錯の美徳"
 doctrine_deviancy_virtuous_desc: "肉体の幸福により我々は神へと近づくことができる。それゆえ、従来の欲望により枷を外された者たちが我々の信仰においては美徳の極みにいるのだ。"
 doctrine_parameter_deviancy_illegal: "[GetTrait('deviant').GetName( GetPlayer )]の[trait|E]を持つ者は[criminals|E]とみなされる"
 doctrine_parameter_deviancy_shunned: "[GetTrait('deviant').GetName( GetPlayer )]の[trait|E]を持つ者は[shunned|E]される"
 doctrine_parameter_deviancy_accepted: "[GetTrait('deviant').GetName( GetPlayer )]の[trait|E]を持つ者は完全に受け入れられる"
 doctrine_witchcraft_name: "魔術"
 doctrine_witchcraft_crime_name: "犯罪者"
 doctrine_witchcraft_crime_descriptive_name: "魔術の罪"
 doctrine_witchcraft_crime_desc: "この世界で奇跡をなす権利を持つのは神のみである。奇跡を起こそうという冒涜的な試みを行う者はその不遜と傲慢のために罰を受ける。"
 doctrine_witchcraft_shunned_name: "忌避"
 doctrine_witchcraft_shunned_descriptive_name: "魔術の忌避"
 doctrine_witchcraft_shunned_desc: "この世の超自然的な力に対する正当な権限を有しているのは神であり、その力を無理に定命の者の意思に従わせようとする試みはそもそも間違っている。"
 doctrine_witchcraft_accepted_name: "受容"
 doctrine_witchcraft_accepted_descriptive_name: "魔術の受容"
 doctrine_witchcraft_accepted_desc: "魔法は我々の世界に満ちみちており、祖先と同じようにそれと関わりを持つことは我々の基本的な権利だ。"
 doctrine_witchcraft_virtuous_name: "美徳"
 doctrine_witchcraft_virtuous_descriptive_name: "魔術の美徳"
 doctrine_witchcraft_virtuous_desc: "魔術を実践することは、自身の魂を悪霊の危険にさらすことを意味する。魔術師たちの勇敢さにより必然的に我々の魂は清らかなままであるのだから、彼らは崇めらているのだ。"
 doctrine_parameter_witchcraft_illegal: "[GetTrait('witch').GetName( GetPlayer )]の[trait|E]を持つ者は[criminals|E]とみなされる"
 doctrine_parameter_witchcraft_shunned: "[GetTrait('witch').GetName( GetPlayer )]の[trait|E]を持つ者は[shunned|E]される"
