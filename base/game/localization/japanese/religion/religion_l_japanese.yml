 special_tolerance_name: "特別な寛容"
 special_doctrine_ecumenical_christian_name: "世界教会主義"
 special_doctrine_ecumenical_christian_desc: "我々の宗教指導者たちは歴史的に、さまざまなキリスト教宗派間の協力関係を強めるため、宗派間の対話を行ってきました。"
 special_doctrine_ecumenical_miaphysite_name: "合性論派の交わり"
 special_doctrine_ecumenical_miaphysite_desc: "それぞれ独立した聖職位階制度を持ちながらも、合性論派の諸教会は完全な聖餐の交わりを保ち、互いの秘跡と聖職者を承認しています。"
 #Doctrine is invisible, but still needs these keys
 special_doctrine_has_clerical_electors_name: "聖職者選挙人"
 special_doctrine_has_clerical_electors_desc: "この[faith|E]では、[cardinals|E]を通じて[head_of_faith|E]を選出します。"
 has_clerical_electors_name: "聖職者選挙人"
 special_doctrine_full_tolerance_name: "全面的な寛容"
