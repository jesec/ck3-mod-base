 west_african_unreformed_faith_doctrine_descriptive_name: "$unreformed_faith_doctrine_descriptive_name$"
 west_african_unreformed_faith_doctrine_desc: "$unreformed_faith_doctrine_desc$"
 heresy_hostility_name: "異端に関する視点"
 heresy_hostility_doctrine_name: "異端"
 heresy_hostility_doctrine_desc: "自らの目的のために宗派をゆがめ腐らせる、偽りの預言者に気をつけよ。そのような者は異端者であり、滅ぼされるべきだ。"
 divine_destiny_name: "神の運命"
 divine_destiny_doctrine_name: "世界の正当な統治者"
 divine_destiny_doctrine_descriptive_name: "$divine_destiny_doctrine_name$"
 divine_destiny_doctrine_desc: "我々は、すべての人々を平和と繁栄の時代に導く者だ。我々こそが世界の正当な統治者だ。"
 doctrine_parameter_divine_destiny_holy_war_cost_reduction: "聖戦の[piety|e]コスト：#P -50%#!"
 adoptionist_school_name: "養子的キリスト論の信条"
 special_doctrine_adoptionist_school_elipandic_doctrine_name: "エリパンドゥス派"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc: "キリスト論の微妙な違いに焦点を当てることを好むエリパンドゥス派の$adoptionist$は、三位一体の教義との#EMP 正確な#!違いの重要性を強調する。複雑な違いをうまく説明することは、単純な説明を下手に正当化することよりもはるかに優れている。"
 special_doctrine_adoptionist_school_felicitous_doctrine_name: "フェリシタス派"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc: "フェリシタス派$adoptionist$は、敵対的なシステムを弱体化させるためには、そのシステムの中で機能する必要があることを理解し、純粋さよりも実際的であることを信奉している。崇高な目的を追求するための凶悪な嘘は、千の率直な真実に等しい価値があると考えられている。"
 special_doctrine_adoptionist_school_radical_doctrine_name: "急進派"
 special_doctrine_adoptionist_school_radical_doctrine_desc: "急進的な$adoptionist_adherent_plural$は、父以外の神を認めず、死すべき肉からの神性を受け入れず、己以外の$christianity_religion_adherent_plural$を認めない。正典のすべての#EMP 文字#!に同意することなくキリストを受け入れることは、背教と見なされる。"
 doctrine_parameter_has_clerical_regions: "[clerical_region|E]がある"
 special_doctrine_is_christian_faith_name: "イエスの教え"
 is_christian_faith_name: "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc: "世界にはイエスの神性を認めることなくその教えを固く守る人々がいる。冒涜的ではあるが、いつの日か真の信仰へと改宗する可能性もあるため、我々は彼らに憐れみを示すべきだ。"
 special_doctrine_is_islamic_faith_name: "ムハンマドの教え"
 is_islamic_faith_name: "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc: "預言者の律法のすべてに従ってはいなくとも、この世界には、自分の知る以上にアッラーの御心に導かれている人がいる。そのような半端な改宗者たちは、やがて悪しき道を捨てて、真のイスラム共同体の一員となるかもしれない！"
 special_doctrine_is_jewish_faith_name: "モーセの教え"
 is_jewish_faith_name: "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc: "すべての貴族が罪悪にまみれて生きているわけではない。神に選ばれた人々に敬意を払う者もおり、そうした者には我々もある程度は敬意を払うべきだ。"
 prophecy_of_malachi_name: "マラキの予言"
 special_doctrine_not_allowed_to_hof_name: "祭司職の廃止"
 not_allowed_to_hof_name: "$special_doctrine_not_allowed_to_hof_name$"
 prophecy_of_malachi_desc: "伝統的なユダヤ教の教義においては、新しい大祭司は予言者が到来した時か、祭司に適任であるアーロンの子孫が見つかった時にしか指名できない。"
 special_doctrine_not_allowed_to_hof_desc: "この信仰における大祭司職は完全に廃止されています。大祭司を指名するには、まず伝統的な教派の構造を一から再構築する必要があります。"
 doctrine_parameter_block_from_create_hof_parameter: "この信仰は通常の状態では[head_of_faith|E]を再創設できない。"
 special_doctrine_is_eastern_faith_name: "多宗教の集合体"
 is_eastern_faith_name: "$special_doctrine_is_eastern_faith_name$"
 special_doctrine_is_eastern_faith_desc: "私たちは1つの信仰によってではなく、社会の宗教的な構造を構成する多くの信仰によって、共に結ばれています。異なる名前を呼び合い、異なる道を歩むかもしれませんが、信仰から外れた人たちも、この社会で共存するすべを学びました。"
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "$tenet_eastern_syncretism_name$を持つ東部以外の[faiths|E]は、$hostility_evil_tooltippable$の代わりに[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]とみなされる。"
 special_doctrine_is_sinitic_faith_name: "中国宗教の宇宙観"
 is_sinitic_faith_name: "$special_doctrine_is_sinitic_faith_name$"
 special_doctrine_is_sinitic_faith_desc: "$special_doctrine_is_eastern_faith_desc$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "$tenet_sinitic_syncretism_name$の信条を持つ非中国宗教の[faiths|E]は、$hostility_evil_tooltippable$ではなく[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]とみなされる"
