 doctrine_homosexuality_shunned_desc: "どんな状況でも、二人の男性同士が性的関係を持つことは自然の理に反する。"
 doctrine_homosexuality_accepted_name: "受容"
 doctrine_homosexuality_accepted_descriptive_name: "同性愛の受容"
 doctrine_homosexuality_accepted_desc: "愛は肉体を超越した深遠かつ素晴らしいものであり、性別で縛ることはできない。"
