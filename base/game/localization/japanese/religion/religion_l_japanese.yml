 doctrine_adultery_men_crime_desc: "男性が婚姻外の性交を行うことは犯罪であり、相応の罰を受けるべきだ。"
 doctrine_adultery_men_shunned_name: "忌避"
 doctrine_adultery_men_shunned_descriptive_name: "男性の不倫の忌避"
 doctrine_adultery_men_shunned_desc: "男性が婚姻外の性交を行うことは罪深いが、すべての罪悪と同じように、その過ちについて審判を下すべきは神である。"
