 doctrine_pilgrimage_forbidden_descriptive_name: "巡礼の禁止"
 doctrine_pilgrimage_forbidden_desc: "[ROOT.Faith.HighGodName]の存在はどこにいても感じることができる。特定の場所が他よりも神聖であるという考えはまさしく異端信仰に他ならない。"
 doctrine_pilgrimage_encouraged_name: "推奨"
 doctrine_pilgrimage_encouraged_descriptive_name: "巡礼の推奨"
 doctrine_pilgrimage_encouraged_desc: "この信仰では、[ROOT.Faith.PantheonTerm]への崇敬の念を示すための手段として、霊験的重要性が高いとされる世俗的な場所を訪問することを信徒に勧めている。"
 doctrine_pilgrimage_mandatory_name: "義務"
 doctrine_pilgrimage_mandatory_descriptive_name: "巡礼の義務"
 doctrine_pilgrimage_mandatory_desc: "すべての健全な[ROOT.Faith.GetAdherentNamePlural]が可能な限り早く聖地への巡礼を終えることを期待されている。それができないということは、[ROOT.Faith.HighGodName]に服従していないことを意味する。"
 doctrine_pilgrimage_mandatory_hajj_name: "ハッジ"
 doctrine_pilgrimage_mandatory_hajj_desc: "すべての健全なイスラム教徒が人生で一度はメッカへのハッジを終えることを期待されている。特別な免除が与えられることも多いが、ハッジを終えていない[ROOT.Faith.GetAdherentNameNoTooltip]は懐疑の目を向けられることになる。"
