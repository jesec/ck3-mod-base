 doctrine_parameter_kinslaying_any_dynasty_member_crime: "[GetTrait('kinslayer_1').GetName( GetPlayer )]以下の[trait|E]を持つ[kinslayers|E]は[dynasty|E]から[criminals|E]とみなされる"
