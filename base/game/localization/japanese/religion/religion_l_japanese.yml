 doctrine_mythic_literary_desc: "信仰は神の御業を伝える物語を通じて広まり、受け継がれていくが、その物語の多くは文学作品となっている。"
 doctrine_oral_storytelling_name: "口承"
 doctrine_oral_storytelling_desc: "創世神話や道徳的教訓は、民話の中に織り込まれ、世代と文化を越えて語り継がれていく。"
 doctrine_monasticism_name: "$tenet_monasticism_name$"
 doctrine_monasticism_encouraged_name: "推奨"
 doctrine_monasticism_encouraged_descriptive_name: "修道院制を奨励"
 doctrine_monasticism_encouraged_desc: "$doctrine_monasticism_general_desc$"
 doctrine_monasticism_accepted_name: "受容"
 doctrine_monasticism_accepted_descriptive_name: "修道院制を容認"
 doctrine_monasticism_accepted_desc: "修道生活は許可されているが、信仰の中心ではない。敬虔な者は誓願を立てて修道院に入ることができるが、この伝統では、修道生活を理想的な生き方として強調してはいない。"
 doctrine_monasticism_absent_name: "修道院制なし"
 doctrine_monasticism_absent_descriptive_name: "修道院制なし"
 doctrine_monasticism_absent_desc: "この伝統では、修道院制は確立されていない。信仰生活は世俗の中で営まれ、世俗からの離脱や終生誓願の制度は存在しない。"
 doctrine_monasticism_forbidden_name: "禁止"
 doctrine_monasticism_forbidden_descriptive_name: "修道院制を禁止"
 doctrine_monasticism_forbidden_desc: "この宗派では、修道生活を明確に否定している。誓願を立てることは禁止されており、修道的な特性を持つ者は信仰上の犯罪者と見なされる。"
 monasticism_group_name: "修道院制"
 doctrine_christianity_monasticism_latin_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_latin$\n\n[Glossary('修道院制の歴史的背景','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_greek_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_greek$\n\n[Glossary('修道院制の歴史的背景','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_default_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_default$\n\n[Glossary('修道院制の歴史的背景','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_monasticism_general_desc: "$tenet_monasticism_desc$\n\n[Glossary('修道院制の歴史的背景','doctrine_monasticism_general_historical_desc')]"
 doctrine_monasticism_christianity_historical_desc: "修道院制は中世を通してカトリック世界全体に広がり、ヨーロッパ、北アフリカ、中東各地に修道院が設立された。修道士と修道女は清貧・貞潔・服従の誓願を立て、隠遁者として孤立した小部屋で生活するか、あるいは厳格な規則の下で共同生活を送った。\n\nこれらの修道施設は複数の役割を担い、写本や古典文献の保存、教育の提供、病院や施療院の運営、農地の管理、旅人のもてなしなどを行った。ベネディクト会、シトー会、カルトジオ会といった修道会はそれぞれ、祈り、労働、共同生活に関して独自の伝統を発展させた。"
 doctrine_monasticism_general_historical_desc: "修道共同体はキリスト教に限らず、仏教、ヒンドゥー教、ジャイナ教など、数多くの宗教的伝統に見られる。こうした共同体では一般的に、個人が世俗社会から離れ、祈り、瞑想、学問、苦行を通して宗教的献身を追求する。\n\n修道院はしばしば学問の中心として機能し、聖典の保存や教育を行うこともある。修道共同体は、地域社会から完全に隔絶されている場合もあれば、慈善活動、医療の提供、農業生産などを通して社会と積極的に関っている場合もある。修道生活を規定する具体的な規則は、個々の伝統や共同体によって大きく異なる。"
 sacraments_group_name: "秘跡"
 doctrine_sacraments_central_name: "中心的"
 doctrine_sacraments_central_desc: "$doctrine_sacraments_general_desc$"
 doctrine_sacraments_central_latin_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_latin$"
 doctrine_sacraments_central_greek_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_greek$"
 doctrine_sacraments_absent_name: "秘跡なし"
 doctrine_sacraments_absent_desc: "この伝統では、秘跡や正式な聖礼典の体系を重視していない。また、信仰生活は聖職者による儀式の執行を中心としたものではなく、特定の儀式に重要性を置いてもいない。"
 doctrine_communion_historical_desc: "キリストは十字架にかけられる前夜、弟子たちを集めて過越の食事を行い、それを新しい意味を持つものへと変えた。キリストはパンを手に取って祝福し、裂いて弟子たちに与え、こう言った。#weak 「これは、あなたがたのために与えられるわたしのからだです。わたしを記念して、このように行いなさい」#!そしてぶどう酒の杯を取ると、それを罪の赦しのために流される、新しい契約の血であると宣言した。\n\n最後の晩餐におけるこの聖体の制定は、キリスト教礼拝の中心的な儀式となり、あらゆるミサや聖体礼儀で繰り返し行われている。信者にとって、聖体拝領は単なる記念ではなく、キリストの犠牲に与ることであり、信徒を救い主と、そして互いと結びつけるものである。"
 doctrine_sacraments_general_desc: "この信仰では、秘跡と聖なる儀式を中心に据えて重視している。儀式は単なる象徴ではなく、神の存在を招き寄せるものである。儀式は聖職者によって執行され、信徒はその権威のもとで破門されることもある。"
