 #Ṣadr al-Islām
 sadr_al_islam: "サドル・アル＝イスラーム"
 sadr_al_islam_adj: "イスラム教"
 sadr_al_islam_adherent: "イスラム教徒"
 sadr_al_islam_adherent_plural: "イスラム教徒"
 sadr_al_islam_desc: "イスラム教徒は、諸学派が成立する前の最も純粋な信仰において、預言者自身による神の啓示に導かれていた。預言者の教友やタービウーンといった初期世代は、そのスンナに従った。"
 #Sunni
 sunni: "スンナ派"
 sunni_adj: "スンナ派"
 sunni_adherent: "スンナ派"
 sunni_adherent_plural: "スンナ派"
 sunni_desc: "スンナ派とは、ムハンマドの慣行（スンナ）に従う信徒を指す。スンナ派のイスラム法学は、主にクルアーン、ハディース、およびイジュマー（学者の合意）を基礎的な根拠としている。"
 #Shia
 shia: "シーア派"
 shia_adj: "シーア派"
 shia_adherent: "シーア派"
 shia_adherent_plural: "シーア派"
 shia_desc: "イスラム教の宗派の一つ。指導者の地位は預言者ムハンマドの家系に限定され、神に導かれたイマームへと受け継がれるべきだと信じており、預言者一族への献身を重視している。"
 islam_shia_priest: "ムッラー"
 islam_shia_priest_plural: "ムッラー"
 islam_shia_religious_head_title: "イマーム"
 islam_shia_religious_head_title_name: "イマーム領"
 #Kharijite
 kharijite: "ハワーリジュ派"
 kharijite_adj: "ハワーリジュ派"
 kharijite_adherent: "ハワーリジュ派"
 kharijite_adherent_plural: "ハワーリジュ派"
 kharijite_desc: "初期イスラム教の一派。指導者は血統ではなく敬虔さによって選ばれるべきだとし、罪を犯した統治者は排除できると考えていた。シーア派をめぐる動乱の中で出現し、両陣営を拒否するとともに、重大な罪を犯した者は信者と認めないと宣言した。"
 #Masmudism
 masmudi: "ムワッヒド派"
 masmudi_adj: "ムワッヒド派"
 masmudi_adherent: "ムワッヒド派信徒"
 masmudi_adherent_plural: "ムワッヒド派信徒"
 masmudi_desc: "北アフリカのベルベル人部族に端を発するスンナ派の改革分派であり、ムワッヒド派改革運動は彼ら自身を一神論者とみなし、純粋な一神教の教義を説いた。"
 masmudi_religious_head_title: "カリフ"
 masmudi_religious_head_title_name: "カリフ領"
 #Quranism
 quranist: "クルアーン派"
 quranist_adj: "クルアーン派"
 quranist_adherent: "クルアーン派信徒"
 quranist_adherent_plural: "クルアーン派信徒"
 quranist_desc: "クルアーンのみが神聖な知恵の典拠なのだから、その文言に従うべきであり、ハディースやファトワーを無視するべきと強く説いているイスラム解釈の直解主義者。"
 #Druze
 druze: "ドゥルーズ派"
 druze_adj: "ドゥルーズ派"
 druze_adherent: "ドゥルーズ派信徒"
 druze_adherent_plural: "ドゥルーズ派信徒"
 druze_desc: "ドゥルーズ山に由来するドゥルーズ派の信仰は多くのイスマーイール派の原理に従っているが、存在の真理に焦点を当てた深遠な神学理論のグノーシス主義的信念も含んでいる。"
 druze_religious_text: "知恵の書簡集"
