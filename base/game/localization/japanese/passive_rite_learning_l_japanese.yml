l_japanese:
 msg_passive_learned_rite: "学んだ流派：[LEFT_CHARACTER.GetRite.GetNameNoTooltip]"
 msg_passive_learned_rite_desc: "長年にわたってあなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]を観察した結果、あなたは[passive_learn_source.GetRite.GetName]の[rite|E]の[core_tenets|E]と[doctrines|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet: "学んだ信条：[RIGHT_TENET.GetBaseNameNoTooltip]"
 msg_passive_learned_tenet_desc: "あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]が、[passive_learn_source.GetRite.GetName]の[rite|E]の[core_tenet|E]である[passive_learn_tenet.GetBaseName]を実践するのを見た結果、あなた自身もそれに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_special: "$msg_passive_learned_tenet$"
 msg_passive_learned_tenet_special_desc: "$msg_passive_learned_tenet_desc$"
 msg_passive_learned_tenet_cranial_trophies_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]を堅持しており、あなたもこの人物を通じて、その忌まわしい目的についての[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_ritual_cannibalism_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]を尊んでおり、あなたもこの人物の観点から、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_human_sacrifice_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]をあなたの前で執り行い、あなたもそれに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_warmonger_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]に従って生きており、あなたもその論理に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_takamin_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]を毎日実践しており、あなたもその営みに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_exaltation_of_pain_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]を観察した結果、あなたは極めて奇異な[passive_learn_tenet.GetBaseName]の[core_tenet|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_sacrificial_ceremonies_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]をあなたに順を追って説明し、あなたもそれに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_gruesome_festivals_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]の全容をあなたに見せ、あなたもそれに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_adorcism_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]を観察した結果、あなたもこの人物の観点から、[passive_learn_tenet.GetBaseName]の[core_tenet|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_tenet_hedonistic_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_tenet.GetBaseName]の[core_tenet|E]を大いに楽しんでおり、あなたもその魅力に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine: "学んだ教義：[RIGHT_DOCTRINE.GetDescriptiveNameNoTooltip( GetPlayer.GetFaith )]"
 msg_passive_learned_doctrine_desc: "あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]が、[passive_learn_source.GetRite.GetName]の[rite|E]の[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]に従って生きる姿を見た結果、あなた自身もそれに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_polygamy_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]に従って生きており、あなたもその仕組みに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_concubines_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]を堅持しており、あなたもその考え方に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_consanguinity_unrestricted_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]を観察した結果、あなたも[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]に関する[agnostic_knowledge|E]を獲得し、もはやそれは以前ほど奇妙なものには思えなくなった。"
 msg_passive_learned_doctrine_deviancy_virtuous_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]を公然と実践しており、あなたもこの人物の観点から、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_kinslaying_accepted_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]をあなたに教えた。身の毛もよだつような教えであったが、あなたもそれに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_witchcraft_virtuous_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]を重んじており、あなたもこの人物を通じて、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_funeral_sky_burial_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]を遵守しており、あなたもその意味に関する[agnostic_knowledge|E]を獲得した。"
 msg_passive_learned_doctrine_funeral_mummification_desc: "[passive_learn_source.GetRite.GetName]の[rite|E]に属する、あなたの[GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)]である[passive_learn_source.GetTitledFirstNameNoTooltip]は、[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]の[doctrine|E]を堅持しており、あなたもその習わしに関する[agnostic_knowledge|E]を獲得した。"
 message_filter_passive_religious_learning: "@religious_icon! 受動的な宗教の学習"
 message_filter_passive_religious_learning_desc: "あなたは異国の[faith|E]を信仰する親しい間柄の人物または廷臣から、[core_tenet|E]、[doctrine|E]、または[rite|E]全体を受動的に学ぶ"
 clerical_justifications_perk_passive_learning_effect: "親しい間柄の人物#weak （配偶者や友人など）#!から[core_tenet|E]、[doctrine|E]、または[rite|E]全体を受動的に学ぶ。[traveling|E]中はその頻度が2倍になる"
 apa_passive_religious_learning_host_title: "[first.GetShortUINameNoTooltip]による[rite|E]の実践"
 apa_passive_religious_learning_host_tt: "あなたは[first.GetShortUIName]が[first.GetRite.GetName]の[rite|E]を実践しているのを観察する"
 apa_passive_religious_learning_guest_title: "[first.GetShortUINameNoTooltip]による[rite|E]の実践"
 apa_passive_religious_learning_guest_tt: "あなたは[first.GetShortUIName]が[first.GetRite.GetName]の[rite|E]を実践しているのを観察する"
 apa_passive_religious_learning_pilgrimage_pool_title: "[first.GetShortUINameNoTooltip]の教え"
 apa_passive_religious_learning_pilgrimage_pool_tt: "あなたは地元の人物である[first.GetShortUIName]が[first.GetRite.GetName]の[rite|E]を実践しているのを観察する"
 apa_passive_religious_learning_pilgrimage_rite_title: "地元の[rite|E]"
 apa_passive_religious_learning_pilgrimage_rite_tt: "あなたは地元の人々が[passive_learn_rite.GetName]の[rite|E]を実践しているのを観察する"
 ### HoR passive learning
 msg_hor_learned_tenet_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、近隣の[passive_learn_source_faith.GetAdjective][faith|E]を研究した結果、あなたは[passive_learn_tenet.GetBaseName]の[core_tenet|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、近隣の[passive_learn_source_faith.GetAdjective][faith|E]を研究した結果、あなたは[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]に関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_cranial_trophies_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]における[passive_learn_tenet.GetBaseName]の[core_tenet|E]を研究し、その残酷な目的を記録して、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_ritual_cannibalism_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]における[passive_learn_tenet.GetBaseName]の[core_tenet|E]をその流儀に沿って観察し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_human_sacrifice_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]によって実践されている[passive_learn_tenet.GetBaseName]の[core_tenet|E]を体系的に記録し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_warmonger_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective]の[faith|E]がどのように[passive_learn_tenet.GetBaseName]の[core_tenet|E]を実践に移しているかを研究し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_takamin_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]から[passive_learn_tenet.GetBaseName]の[core_tenet|E]における日常的な営みを学び、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_exaltation_of_pain_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、[passive_learn_source_faith.GetAdjective][faith|E]を研究した結果、あなたは極めて奇異な[passive_learn_tenet.GetBaseName]の[core_tenet|E]について学び、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_sacrificial_ceremonies_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]における[passive_learn_tenet.GetBaseName]の[core_tenet|E]を一つずつ紐解き、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_gruesome_festivals_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]における[passive_learn_tenet.GetBaseName]の[core_tenet|E]の全容を目撃し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_adorcism_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]がどのように[passive_learn_tenet.GetBaseName]の[core_tenet|E]を体言しているかを観察し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_tenet_hedonistic_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、[passive_learn_source_faith.GetAdjective][faith|E]を研究した結果、あなたは[passive_learn_tenet.GetBaseName]の[core_tenet|E]の魅力を知り、その[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_polygamy_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]がどのように[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]のもとで信徒の家族のあり方を定めているかを研究し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_concubines_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]がどのように[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]を論じているかを学び、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_consanguinity_unrestricted_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、[passive_learn_source_faith.GetAdjective][faith|E]を読み解いた結果、あなたはもはや[passive_learn_tenet.GetBaseName]の[core_tenet|E]を異質なものと感じなくなり、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_deviancy_virtuous_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]がどれほど公然と[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]を実践しているかを観察し、それに関する[agnostic_knowledge|E]を彼らの観点から獲得した。"
 msg_hor_learned_doctrine_kinslaying_accepted_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]がどのように[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]を正当化しているのかを、少なからぬ不安を抱きながらも読み解き、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_witchcraft_virtuous_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]がどのように[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]を重んじているかを研究し、それに関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_funeral_sky_burial_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]が実践する[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]を観察し、その意味に関する[agnostic_knowledge|E]を獲得した。"
 msg_hor_learned_doctrine_funeral_mummification_desc: "[passive_learn_hor.GetRite.GetName]の[rite|E]の指導者として、あなたは[passive_learn_source_faith.GetAdjective][faith|E]が実践する[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]の[doctrine|E]を研究し、その習わしに関する[agnostic_knowledge|E]を獲得した。"
