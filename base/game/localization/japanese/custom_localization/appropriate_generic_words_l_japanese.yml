 #Food and drink glosses
 ABALONE_GLOSS: "身が締まって肉厚な、珍重される貝類。"
 SEA_CUCUMBER_GLOSS: "中国の高級料理で珍味として扱われる、柔らかな海産物。"
 SWALLOW_NEST_GLOSS: "高級スープに溶かして使われる、希少な鳥の巣。"
 ENTREMETS_GLOSS: "コース料理の合間に出される、手の込んだ甘味や趣向を凝らした料理。"
 MOCHI_GLOSS: "もち米をついて作る、弾力のある菓子。"
 DURIAN_GLOSS: "強い香りとカスタードのように濃厚な果肉で知られる大きな熱帯果実。"
 AQUA_VITAE_GLOSS: "薬用飲料として珍重された、度数の高い蒸留酒。"
 TRIBUTE_CHILLED_TEA_GLOSS: "宮廷への献上品として、氷や雪で冷やして供された高級茶。"
 EMPEROR_TEA_GLOSS: "宮廷専用の最高級の皇帝茶葉。"
 BAIJIU_GLOSS: "穀物を原料とする、中国の度数の高い蒸留酒。"
 HANAKUSA_GLOSS: "日本の花や葉を混ぜ合わせた薬草茶。"
 PEARL_POWDER_GLOSS: "高価な滋養薬として用いられる、粉末にした真珠。"
 CHRYSANTHEMUM_BEER_GLOSS: "菊の風味を加えた軽い醸造酒。"
 SHARBAT_GLOSS: "甘味を加えた果実飲料。冷やして香辛料を加えることが多い。"
 SAMBUSA_GLOSS: "香辛料で味付けした肉や野菜を生地で包んで揚げた料理。"
 PAKHALA_GLOSS: "米を水に浸して発酵させた、インド東部の冷たい料理。"
 PILAU_GLOSS: "香辛料と肉や野菜を加えて炊いた、風味豊かな米料理。"
 PASTILLA_GLOSS: "マグリブ地方のパイ料理。香辛料で味付けした肉を薄い生地で包む。"
 BOTUO_GLOSS: "小麦の団子か麺が入った、中国の濃厚なスープ。"
 SPHOUNGATA_GLOSS: "溶き卵で作るビザンツ風オムレツ。"
 TARICHOS_GLOSS: "塩漬けして乾燥させた魚。ビザンツ料理の定番食品。"
 BING_GLOSS: "中国の平たいパンまたは鉄板で焼く平たい生地料理。"
 MANTOU_GLOSS: "中国の柔らかい小麦蒸しパン。"
 ZOSUI_GLOSS: "出汁で煮込んだ日本の米粥。"
 KIMCHI_GLOSS: "塩と香辛料で発酵させた韓国の野菜料理。"
 BUBUR_GLOSS: "マレー諸島の米粥。"
