 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "貴君の悪行はアイルランドからキャセイまで知れ渡っている"
 greeting_supplimentary.negative.greek: "貴君の下劣さはギリシャ演劇の題材にふさわしい"
 greeting_supplimentary.negative.insult.1: "貴君の体液が腐らんことを"
 greeting_supplimentary.negative.insult.2: "貴君の一生が儚く惨めなものにならんことを"
 greeting_supplimentary.negative.insult.3: "愚かな一生を過ごすがいい"
 greeting_supplimentary.negative.insult_muslim.1: "貴君の7番目の祖父に呪いあれ"
 greeting_supplimentary.negative.insult_muslim.2: "死んだラクダの腹の中に生きたまま縫い付けられるがいい"
 greeting_supplimentary.negative.insult_muslim.3: "アラーの呪いがあらんことを"
 greeting_supplimentary.negative.insult_muslim.4: "汚らわしい犬の子め"
 greeting_supplimentary.negative.insult_muslim.5: "埋葬されぬお前の骨をジャッカルどもが奪い合うことを願う。"
 greeting_supplimentary.negative.insult_muslim.6: "お前の井戸が砂に埋まり、天幕がサソリで満ちることを願う。"
 greeting_supplimentary.negative.insult_christian.1: "聖人たちがお前の大義を見放すことを願う。"
 greeting_supplimentary.negative.insult_christian.2: "お前の名は、あらゆる祈りから消し去られるだろう。"
 greeting_supplimentary.negative.insult_norse.1: "お前の祖先が、お前の影につばを吐くことを願う。"
 greeting_supplimentary.negative.insult_norse.2: "お前の勇気など、冬の氷よりも薄い。"
 greeting_supplimentary.negative.insult_byzantine.1: "コンスタンティノープルの鼠でさえ、お前の悪臭から逃げ出すだろう。"
 greeting_supplimentary.negative.insult.4: "お前の畑が荒れ果て、井戸が干上がることを願う。"
 greeting_supplimentary.negative.insult.unreliable_swine: "当てにならない豚め。"
 greeting_supplimentary.negative.insult.oathbreaker: "お前は嘘つきで、誓いを破る者だ。"
 greeting_supplimentary.negative.insult_jewish.1: "お前の名が、生者の書から消え去ることを願う。"
 greeting_supplimentary.negative.insult_zoroastrian.1: "お前が守るとうそぶく炎を、闇が呑み込むことを願う。"
 greeting_supplimentary.negative.insult_hindu.1: "お前は正義の道から遠く外れている。そして私がさらに遠くへ追いってやろう。"
 greeting_supplimentary.negative.insult_christian.3: "地獄が大口を開けてお前を迎え入れることを願う。"
 greeting_supplimentary.negative.insult_norse.3: "烏どもは、お前の亡骸で存分に宴を楽しむだろう。"
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "貴君とその家系に祝福を"
 greeting_supplimentary.positive.flattery.2: "貴君の知恵と慈悲深さは実に素晴らしい"
 greeting_supplimentary.positive.flattery.3: "貴君に平穏があらんことを"
 greeting_supplimentary.positive.flattery.4: "貴君に平穏と充足があらんことを"
 greeting_supplimentary.positive.flattery.5: "貴君の冷酷さが羨ましい"
 greeting_supplimentary.positive.flattery.6: "貴君の飽くなき欲求は世界的に有名だ"
 greeting_supplimentary.positive.flattery.7: "貴君の名声は、貴君自身より先にあらゆる国境を越えて届いている。"
 greeting_supplimentary.positive.flattery.8: "貴君の血筋が千年続きますように。"
 greeting_supplimentary.positive.flattery.9: "神が貴君の剣を振るう腕を強く保ってくださいますように。"
 greeting_supplimentary.positive.flattery.10: "貴君の一族に平安と豊かさがありますように。"
 greeting_supplimentary.positive.flattery.11: "幸運が貴君の旗に微笑みますように。"
 greeting_supplimentary.positive.flattery_chinese.1: "貴君に天の祝福がありますように。"
 greeting_supplimentary.positive.flattery_chinese.2: "貴君の領地が栄え続きますように。"
 greeting_supplimentary.positive.flattery_chinese.3: "武威と活力が貴君の治世を祝福しますように。"
 greeting_supplimentary.positive.flattery_norse.1: "神々が貴君に順風と肥えた牛を授けますように。"
 greeting_supplimentary.positive.flattery_byzantine.1: "都の栄光が貴君の家を照らしますように。"
 greeting_supplimentary.positive.flattery_jewish.1: "聖なる御方が貴君の一族に平安をもたらしますように。"
 greeting_supplimentary.positive.flattery.12: "貴君の知恵は、助言を求める者を照らす光だ。"
 greeting_supplimentary.positive.flattery.13: "天が貴君を寵愛し続けますように。"
