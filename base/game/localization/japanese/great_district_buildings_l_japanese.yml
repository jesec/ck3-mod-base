 building_type_republic_council_chamber_01: "大評議会議場"
 building_type_republic_council_chamber_01_desc: "資格のある市民全員が座れるだけの長椅子が並ぶ。評議会はここで税収簿をめぐって議論し、その年の会計を承認し、都市の公職を決定するくじ引きを行う。"
