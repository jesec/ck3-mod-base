 building_type_republic_civic_hospital_01_desc: "コミューンの寄付によって設立され、職員の経費も共同体が負担している病棟。病に苦しむ貧しい者たちを路上で死なせることなく収容する。市民の健康こそが、その生産性を約束するのだ。"
