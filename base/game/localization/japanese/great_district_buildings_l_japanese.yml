 building_type_republic_weigh_house_01_desc: "都市が所有する秤と封印付きの計量器が厳重に施錠され、宣誓した役人たちによって検査される施設。ここを通るすべての荷は手数料を払って計量され、商人がその結果に異議を唱えることはできない。"
