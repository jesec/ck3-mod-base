l_japanese:
 yearly_republic.1001.t: "さあベッドへ、愛しい人よ"
 yearly_republic.1001.desc: "真夜中が近づくころ、[spouse_target.GetWifeHusband]である[spouse_target.GetTitledFirstName]は、私が書類に埋もれて、またしても帳簿を見直しているのを見つけた。\n\n「ベッドへいらっしゃい、我が[ROOT.Char.GetWifeHusband]よ」と、[spouse_target.GetSheHe]は懇願する。「仕事は明日まで待てるはずでは？」\n\n「それとも」と、[spouse_target.GetFirstNameNoTooltip]は思案深げな顔をして言う。「私があなたの仕事を手伝いましょうか？」"
 yearly_republic.1001.a: "もっと蝋燭を持ってきてくれ、愛しい人よ。"
 yearly_republic.1001.b: "仕事が大幅に遅れていて手が離せない。放っておいてくれ！"
 yearly_republic.1001.c: "あなたさえいれば、他のことなどどうでもいい。"
 yearly_republic.1001.communal: "[vassals|E]全員の#value あなた#!に対する好感度が#P 10#!増加する"
 yearly_republic.1002.t: "棘のある結婚"
 yearly_republic.1002.desc: "[spouse_target.GetTitledFirstName]との結婚生活には、数々の不和があった。我々はまるで意見が合わない。[spouse_target.GetSheHe]は頻繁に身内に手紙を送り、私の「欠点」を逐一伝えているに違いない。\n\n婚姻によって[spouse_target.GetDynastyHouseName]家との商売上の結びつきがより強固になることを期待していたが、都市内で彼らの代理人や顧客に会うたび、その瞳には不信の色が見て取れる。\n\n何らかの対策を講じなければ、この毒々しい感情は両家の隅々にまで広がり、まるで膿んだ傷から滲み出る悪しき血のようにお互いの関係を蝕み続けるだろう。"
 yearly_republic.1002.a: "[spouse_target.GetFirstNameNoTooltip]とその一族の恩義を金で買ってやろう。"
 yearly_republic.1002.b: "[spouse_target.GetHerHis]の名を騙って、私を称賛する手紙を偽造しよう。"
 yearly_republic.1002.c: "[ROOT.Char.GetFaith.random_GoodGodNames]に誓う。あなたに認めてもらえるように、自分を改めよう。"
 yearly_republic.1002.d: "彼らにどう思われようと構うものか。"
 yearly_republic.1002.tt.falsifying_success.desc: "配偶者の手紙を書き換え、自分をよく見せる"
 yearly_republic.1002.falsifying_success.toast: "[spouse_target.GetDynastyHouseName]家はあなたが改心したと確信する"
 yearly_republic.1002.tt.falsifying_failure.desc: "配偶者の手紙の偽造に失敗する"
 yearly_republic.1002.falsifying_failure.toast: "[spouse_target.GetDynastyHouseName]のあなたに対する好感度がさらに悪化する"
 yearly_republic.1002.tt.impress_spouse_success.desc: "配偶者があなたの努力に感心する"
 yearly_republic.1002.impress_spouse_success.toast: "[spouse_target.GetDynastyHouseName]家があなたの努力を認める"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "配偶者はあなたの努力に感心していない"
 yearly_republic.1002.impress_spouse_failure.toast: "[spouse_target.GetDynastyHouseName]家はあなたを救いようのない人間だと見なしている"
 yearly_republic.1003.t: "裏通りの名誉"
 yearly_republic.1003.desc: "「この愚か者め！通りで喧嘩などすれば家同士の抗争になりかねない！自分の姿を見ろ、血だらけではないか！」と我が[spouse_target.GetWifeHusband]の[spouse_target.GetTitledFirstName]が、我が[ROOT.Char.Custom2('RelationToMeShort', rook_01)]の[rook_01.GetTitledFirstName]の姿を見て叫ぶ——だが、若き放蕩者はただ笑うばかりだ。その間も、[rook_01.GetHerHis]の血が私の床に滴り落ちている。\n\n「相手のほうがよっぽどひどい有様だったさ！あの[rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))]め。[rook_02.GetFirstName]は恥をかいて足を引きずりながら家路についたところだ」\n\nくそっ、この荒くれ者どもめ！武器と虚勢を振りかざして街を徘徊し、喧嘩に明け暮れ、自分たちの楽しみのためにあらゆる悪事を働いている。\n\n「ちょっとした小競り合いさ。心配するな、[rook_01.Custom2('RelationToMeShort', spouse_target)]——中傷を浴びせられて、ただ一族の名誉を守っただけだ」"
 yearly_republic.1003.a: "ああ、若気の至りというやつか。"
 yearly_republic.1003.b: "明らかに[rook_02.GetNameNoTooltip]に非がある。賠償を要求する！"
 yearly_republic.1003.c: "[rook_02.GetDynastyHouseNameNoTooltip]家に贈り物をして事を穏便に済ませよう。"
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "我が一族に対する貴殿の非難は根拠がなく、虚偽であり、全くもって的外れだ。\n\n貴殿にくれてやるものなど何もない——万が一、この件をなお追及するというなら、挨拶代わりに、我が一族の刃を貴殿の喉元につきつけてやろう。"
 yearly_republic.1004.b.desc: "[other_house_character_01.GetDynastyHouseName]家の当主として、両家の間に生じたこの不愉快な事態を深く遺憾に思う。ご迷惑をおかけしたことをお詫び申し上げるとともに、我が謝罪の意としてこの贈り物を受け取っていただきたい。"
 yearly_republic.1004.a: "奴らはこの無礼な振る舞いを後悔することになるだろう！"
 yearly_republic.1004.b: "いいだろう、然るべき時に賠償は回収させてもらう。"
 yearly_republic.1004.c: "当然の償いを受け取ろう。"
 yearly_republic.1004.d: "これを機に、両家の不和に終止符を打とう。"
 yearly_republic.1005.t: "民衆の抗議"
 yearly_republic.1005.desc: "我が家と[other_house_character_01.GetDynastyHouseName]家の不和が再び[capital_01.GetName]の街中に飛び火した。我が家の荷車の御者たちが通行権を巡って乱闘を繰り広げ、ついには道そのものが塞がれてしまったのだ。いつものつまらぬ揉め事だと思っていたが、それは我が家の扉の前に群衆が集まるまでの話だった。\n\n「もううんざりだ！」と、一人の男が怒鳴る。「[ROOT.Char.GetDynastyHouseName]と[other_house_character_01.GetDynastyHouseNameNoTooltip]が小競り合いを続けるせいで、我々は商売もままならない。お前たちのいざこざに街を巻き込むのは止めろ！」\n\n我が[ROOT.Char.Custom2('RelationToMeShort', house_member_01)]である[house_member_01.GetTitledFirstName]は、彼らの横柄な態度を嘲笑った。「我々の振る舞いに口出しするなど何様のつもりだ？」"
 yearly_republic.1005.a: "いや、[ROOT.Char.Custom2('RelationToMeShort', house_member_01)]。そろそろ[other_house_character_01.GetDynastyHouseNameNoTooltip]と話し合う時だ。"
 yearly_republic.1005.b: "私の弁舌の力で、すべての責任を[other_house_character_01.GetDynastyHouseNameNoTooltip]家になすりつけてやろう。"
 yearly_republic.1005.c: "衛兵！この愚民どもを我が家の前から追い払え。"
 yearly_republic.1005.tt.oratory_blame.desc: "弁舌で群衆を圧倒する"
 yearly_republic.1005.tt.oratory_blame.toast: "あなたは[other_house_character_01.GetDynastyHouseName]家に責任を押し付けた"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "群衆の野次にあなたの声がかき消される"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "[other_house_character_01.GetDynastyHouseName]家に罪を着せることに失敗する"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "その通りだ。今こそ腰を据え、冷静な判断を優先すべき時が来た——未来の世代のため、そして共和国の永続的な繁栄のためにも。我々は貴殿との会談に応じよう。"
 yearly_republic.1006.b.desc: "あいにく、我々に面と向かって嘘をつく機会を貴殿に与える理由など、どこにも見当たらない。どうせ、我々に害をなすための都合の良い口実を探しているだけなのだろう。交渉には応じない。"
 yearly_republic.1006.a: "素晴らしい！"
 yearly_republic.1006.b: "くそっ！"
 yearly_republic.1007.t: "[ROOT.Char.GetDynastyHouseNameNoTooltip]家と[other_house_character_01.GetDynastyHouseNameNoTooltip]家の間の緊張緩和"
 yearly_republic.1007.desc: "中立の施設で、私は[other_house_character_01.GetTitledFirstName]と向かい合って座っている。室内には緊張感が張り詰めている。我々の顧客たちが部屋を埋め尽くし、戦場で睨み合う二つの軍勢のように二派に分かれている。マントの下には間違いなく短剣を隠し持っていることだろう。\n\n「さて」と、[other_house_character_01.GetFirstNameNoTooltip]は控えめな口調で言った。「言いたいことがあるなら言うがいい」\n\n部屋中の者の視線が私に向けられるなか、私は気持ちを落ち着かせて話しはじめた。"
 yearly_republic.1007.a: "この抗争は商売の妨げになっている。"
 yearly_republic.1007.b: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]として、我々は和解すべきだ。"
 yearly_republic.1007.c: "血が流された。その血によって絆を結ぼう。"
 yearly_republic.1007.d: "今ここで、剣を交えて決着をつけよう！"
 yearly_republic.1007.tt.detente_business.desc: "[other_house_character_01.GetShortUINameNoTooltip]があなたの主張に納得する"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip]が納得する"
 yearly_republic.1007.tt.detente_business_failure.desc: "[other_house_character_01.GetShortUINameNoTooltip]はあなたの主張に納得しない"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip]は完全には納得していない"
 yearly_republic.1007.detente_business.change.desc: "両家は商売のため対立を水に流すことに合意した"
 yearly_republic.1007.piety.change.desc: "両家は[ROOT.Char.GetFaith.HighGodName]への愛ゆえに、対立を収めることに合意した"
 yearly_republic.1007.detente_marriage.change.desc: "両家は婚姻によって対立を水に流すことに合意した"
 yearly_republic.1007.duel_win.desc: "あなたは決闘に勝利する"
 yearly_republic.1007.duel_win.toast: "あなたは[other_house_character_01.GetShortUINameNoTooltip]を刺す"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip]が決闘に勝利する"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip]があなたを刺す"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip]が負傷または死亡する"
 yearly_republic.1007.duel_loss.custom: "あなたは負傷または死亡する"
 yearly_republic.1007.c.tt.suitable_pair: "両家には互いに結婚可能な未婚の成員がいる"
 house_relation_reason_falsify_good_desc: "一族の当主の人柄を称える手紙を受け取った"
 house_relation_reason_falsify_bad_desc: "一族の当主が手紙を偽造していたことが判明した"
 house_relation_reason_thorny_desc: "不仲な婚姻関係が不和を広げている"
 house_relation_reason_bribery_good_desc: "配偶者に金品や宝飾品を惜しみなく与えた"
 house_relation_reason_street_combat_desc: "街頭で両家の若者たちによる小競り合いが起きている"
 house_relation_reason_business_argument_desc: "商売上の利点について話し合った"
 house_relation_reason_house_blamed_desc: "社会混乱の責任を問われた"
 house_relation_reason_houses_aligned_desc: "志を同じくする家々の集まりで団結した"
 house_relation_reason_cooperation_desc: "家同士の協力関係が深まった。"
 demand_reparation_for_fight_desc: "賠償を求める手紙を送る"
 pay_reparation_for_fight_desc: "贈り物と謝罪を添えた手紙を送る"
 offer_a_sitdown_desc: "緊張緩和を提案する手紙を送る"
 yearly_republic.1008.t: "商人の皮を被った狼"
 yearly_republic.1008.desc: "なんとも興味深い情報が耳に入ってきた。\n[other_patrician_01.GetTitledFirstNamePossessive]に雇われている商船長の一人が、地中海周辺での交易の傍ら無差別に海賊行為を働き、強奪した積み荷を個人的な利益のために売りさばいているという。まさに羊の皮を被った狼だ！\n\n[other_patrician_01.GetFirstNameNoTooltip]がこの陰謀に加担しているかどうかは定かではないが、船や積み荷を略奪された議員たちにとっては、そんなことはどちらでもいい問題だろう。"
 yearly_republic.1008.a: "直ちにその船長を我が方に雇い入れる。"
 yearly_republic.1008.b: "[bandit_01.GetSheHe]を脅し、戦利品の分け前をよこさせる。"
 yearly_republic.1008.c: "[other_patrician_01.GetFirstNameNoTooltip]を脅して、影響力を得る。"
 yearly_republic.1009.t: "秘密のサロン"
 yearly_republic.1009.desc: "私は[patrician_spouse_01.GetTitledFirstName]が所有する居心地の良いサロンで午後のひとときを過ごしている。\n\n我が[ROOT.Char.Custom2('RelationToMeShort', relation_01)]である[relation_01.GetTitledFirstName]と話し、[patrician_spouse_01.Custom('GetExpensiveDrink')]を味わっていると、大きな衝立のすぐ近くの壁で、小さな影が動いているのに気づいた。よく観察すると、それは細かく正確な動きをする腕の影だとわかる。[relation_01.GetFirstNameNoTooltip]が話を止めると、その動きもぴたりと止まった。誰かが、あの衝立の裏から、サロン内で交わされる言葉を一つ残らず書き留めているのだ！\n\nどうやら、[patrician_spouse_01.Custom('HostessHost')]である[patrician_spouse_01.GetFirstNameNoTooltip]、そして[patrician_spouse_01.GetHerHis]の[patrician_husband_01.GetWifeHusband]である[patrician_husband_01.GetTitledFirstName]は客人の会話を盗聴しているようだ。"
 yearly_republic.1009.a: "この邪悪な企みを皆に知らせなければ！"
 yearly_republic.1009.a.tt: "#value あなた#!に対する好感度が#P 20#!、[patrician_spouse_01.GetShortUINameNoTooltip]と[patrician_husband_01.GetShortUINameNoTooltip]に対する好感度が#N -25#!となる"
 yearly_republic.1009.b: "なんと素晴らしい案だ！私も真似しよう。"
 yearly_republic.1009.c: "盗聴の事実をばらすと言って、[patrician_spouse_01.GetFirstNameNoTooltip]とその[patrician_spouse_01.GetWifeHusband]を脅迫する"
 yearly_republic.1009.c.success.desc: "[patrician_spouse_01.GetShortUINameNoTooltip]が脅しに屈する"
 yearly_republic.1009.c.success.toast: "あなたは[patrician_husband_01.GetShortUINameNoTooltip]に対して強いフックを獲得する"
 yearly_republic.1009.c.failure.desc: "[other_house_character_01.GetShortUINameNoTooltip]の方が一枚上手である"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip]があなたの好敵手になる可能性が高まる"
 yearly_republic.1009.flavor: "どんな秘密が聞き出せることやら？"
 yearly_republic.1009.b.secret_learned: "諜報活動によって秘密が暴かれた"
 yearly_republic.1010.t: "屋根裏のパトリシアン"
 yearly_republic.1010.desc: "のんびりと散歩をしていると、我が[ROOT.Char.Custom2('RelationToMeShort', relation_01)]である[relation_01.GetTitledFirstName]が近づいてきて耳打ちした。\n\n「[ambassador_01.GetFirstName]大使が[ambassador_mission_location_01.GetName]から戻り、今夜、宮殿で行われる非公開の評議会で報告を行うそうです」\n\n[relation_01.GetSheHe|U]は首を横に振った。「ああ、報告が議会に提出される前にその内容を聞くことができたら、どれほど商売上の利点となることか！」[relation_01.GetFirstNameNoTooltip]がそう言うころ、遠くに宮殿の屋根が見えてきた。"
 yearly_republic.1010.a: "宮殿の屋根瓦を剥がして盗み聞きしよう。"
 yearly_republic.1010.b: "もしかしたら[ambassador_01.GetFirstNameNoTooltip]を説得できるだろうか？"
 yearly_republic.1010.c: "時が来ればわかるだろう。"
 yearly_republic.1010.a.success.desc: "あなたは報告を盗み聞きする"
 yearly_republic.1010.a.success.toast: "あなたは報告を盗み聞きする"
 yearly_republic.1010.a.mixed.desc: "あなたは屋根から転落する"
 yearly_republic.1010.a.mixed.toast: "あなたは屋根から転落する"
 yearly_republic.1010.a.failure.desc: "あなたは部屋の中に落ちる"
 yearly_republic.1010.a.failure.toast: "あなたは部屋の中に落ちる"
 yearly_republic.1010.a.mixed.custom: "あなたと[relation_01.GetShortUIName]は[trait|E]「[GetTrait('wounded_1').GetName( GetNullCharacter )|LV]」を獲得する"
 yearly_republic.1010.a.failure.custom: "あなたと[relation_01.GetShortUIName]に対する[republic_ruler.GetShortUIName|U]の[opinion|E]が#N 25#!低下する#weak （$spy_opinion$）#!\n@portrait_punishment_icon! #TUT_KW 犯罪——[republic_ruler.GetShortUIName]があなたたち二人を正当に投獄できるようになる#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip]は賄賂を受け入れる"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip]はあなたの要求に気分を害する"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip]があなたに報告書を渡す"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip]は賄賂を拒絶する"
 yearly_republic.1011.t: "評議会への招集"
 yearly_republic.1011.desc: "またしても、共和国の運営を支える数ある秘密評議会の一つへ招集された。\n\nこのような義務は家族や商売のための時間を奪っていくが、パトリシアンである以上、正当な理由や議会からの許可なしに招集を拒むことはできない。"
 yearly_republic.1011.a: "主治医に頼んで寝たきりだと証明してもらおう。"
 yearly_republic.1011.b: "愛する[ROOT.Char.Custom2('RelationToMeShort', sick_person_01)]が病気なのだから、家に留まるのに十分な理由がある。"
 yearly_republic.1011.c: "議会に5年間の例外許可を申請しよう。"
 yearly_republic.1011.d: "行くのが私の責務だ。"
 yearly_republic.1011.c.success.desc: "議会が許可を承認する"
 yearly_republic.1011.c.success.toast: "議会が許可を承認した"
 yearly_republic.1011.c.failure.desc: "議会が許可を却下する"
 yearly_republic.1011.c.failure.toast: "議会が許可を却下した"
 yearly_republic.1012.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip]の行列"
 yearly_republic.1012.desc: "[ROOT.Char.GetTitleAsNamePossessive]の行列が宮殿の門を出て市中へと行進を始めると、群衆の期待感がひしひしと伝わってくる。\n\n先頭を行くのは地位と威信の高い順に並んだ官僚たち、そしてその後ろには私——最高級の正装に身を包んだ[ROOT.Char.GetTitleAsNameNoTooltip]が続く。民衆が畏敬の念を抱くよう、私の権威の象徴が高々と掲げられている。\n私の背後には、各家の威信の順に列を成したパトリシアンたちが行進する。\n\n誰もが各々のしかるべき場所につき、この由緒ある式典において、我が共和国の階層秩序と栄光が万民の前に示されるのだ！"
 yearly_republic.1012.a: "共和国のために！民のために！"
 yearly_republic.1012.b: "議会に栄光あれ！"
 yearly_republic.1012.c: "すべては我が栄光を映し出しているのだ！"
 yearly_republic.1012.c.tt: "今後#V 10#!年間、$republican_despot_succession_law$の[succession_law|E]を可決する際に必要な[prestige|E]が#N 50%#!減少する"
 yearly_republic.1013.t: "海との婚礼"
 yearly_republic.1013.desc: "[Glossary( '#bold ブチェンタウロ#!', 'BUCENTAUR_GLOSS' )]が最後の砂州を通り過ぎると、アドリア海の塩気漂う広大な海原が私の目の前に広がっている。[bishop_01.GetTitledFirstName]が儀礼用の指輪を手渡し、一歩下がる。\n私は集まった要人たちに見せるようにそれを掲げ、古来からの儀式に従って、緑色の波間に指輪を投げ入れた。\n\n「[Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii#!', 'DESPONSAMUS_GLOSS' )]」と、私は宣言する。船上の群衆が歓声を上げて沸き立つなか、我が富と力の源泉である海と共和国の婚礼が結実したのだ。"
 yearly_republic.1013.a: "我らが波を支配する！"
 yearly_republic.1013.b: "愚かで中身のない儀礼だな。"
 yearly_republic.1013.c: "今行くぞ、愛する人よ！"
 yearly_republic.1013.d: "私は海に対して誠実であり続ける！"
 yearly_republic.1014.t: "諸家の結束"
 yearly_republic.1014.desc: "[faction_head_01.GetTitledFirstName]の招待により、[faction_head_01.GetHouse.GetHouseAspiration.GetName]の野心を抱く諸家の当主たちが集まった。\n\n「友よ！今こそ我々は団結し、利害を一致させなければならない。さもなくば、我らが愛する共和国の他の勢力が、隙をついて我々を分裂させ、打ち砕いてしまうだろう」\n\n夜遅くまで議論が交わされた。意見の相違は多々あるものの、誰かが力強い声を上げれば、その溝を埋め、皆を結束に導くことができるだろう。"
 yearly_republic.1014.a: "「皆でゲルフ派に加わるべきだ」"
 yearly_republic.1014.b: "「皆でギベリン派に加わるべきだ」"
 yearly_republic.1014.c: "「家門同士の絆を強めよう」"
 yearly_republic.1014.d: "「我々の間のあらゆる対立を終わらせなければならない」"
 yearly_republic.1014.e: "「我々の商取引の利害を一致させよう」"
 yearly_republic.1014.e.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName]の[house_ambition|E]を持つすべての[patricians|E]が[GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip]を2年間獲得する"
 yearly_republic.1014.a.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName]の[house_ambition|E]を持つすべての[patricians|E]が[situation_participant_group|E]「[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName]」の一員となる"
 yearly_republic.1014.b.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName]の[house_ambition|E]を持つすべての[patricians|E]が[situation_participant_group|E]「[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName]」の一員となる"
 yearly_republic.1014.c.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName]の[house_ambition|E]を持つすべての[patricians|E]が互いの[house_relations|E]を改善する"
 yearly_republic.1014.d.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName]の[house_ambition|E]を持つ[patricians|E]間の好敵手関係と宿敵関係が解消される"
 yearly_republic.1014.tt.align_guelphs_success.desc: "集まった当主たちが説得され、各家はゲルフ派への忠誠を誓う"
 yearly_republic.1014.align_guelphs_success.toast: "各家がゲルフ派に転向する"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "議論は険悪なものとなり、各家は独自の路線を堅持する"
 yearly_republic.1014.align_guelphs_failure.toast: "諸家の分裂は続く"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "集まった当主たちが説得され、各家はギベリン派への忠誠を誓う"
 yearly_republic.1014.align_ghibellines_success.toast: "各家がギベリン派に転向する"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "議論は険悪なものとなり、各家は独自の路線を堅持する"
 yearly_republic.1014.align_ghibellines_failure.toast: "諸家の分裂は続く"
 yearly_republic.1014.d.toast: "古い確執が解消される"
 yearly_republic.1014.e.toast: "諸家が利害を一つにする"
 yearly_republic.1015.t: "金による票の買収"
 yearly_republic.1015.desc: "私が市場を散策していると、[patrician.GetTitledFirstName|U]が近づいてきた。[patrician.GetSheHe|U]は愛想のよい笑顔を浮かべ、周囲を気にするように声をひそめて話しかけてくる。\n\n「ああ、議会での退屈な投票から一息つけるのは嬉しいものだ。どのように投票すべきかいつも頭を悩ませていてね。あなたのような賢明なお方は、霧の立ち込める海に浮かぶ黄金の灯台のようなもので、私のような愚か者がこうした複雑な政治問題の中で進むべき方向を見出す助けになる」と、[patrician.GetSheHe|U]は言うと、大げさにため息をつく。\n\n「だが、どうも手元に金がない。次に議会が投票を呼びかけた時、しがない船乗りはどちらに舵を切ればいいものだろうか？」"
 yearly_republic.1015.a: "希望の金額を言うがいい。"
 yearly_republic.1015.c: "私の提案は、内容の正当性によって支持を得るだろう。"
 yearly_republic.1016.t: "暴力による投票の強要"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U]は生意気な小物だが、それでも議会での投票権を持っている。しかもその一票は、[patrician.GetSheHe]を「説得」さえすれば、私の意のままに動かすことができる。\n\n[patrician.GetHerHim]に少し圧力をかければ、私のような存在を失望させたらどうなるかを思い知るはずだ。"
 yearly_republic.1016.a: "[patrician.GetHerHis]の事業に妨害工作を仕掛ける。"
 yearly_republic.1016.b: "ごろつきを差し向け、[patrician.GetHerHis]の廷臣を待ち伏せして痛めつける。"
 yearly_republic.1016.c: "[patrician.GetHerHis]の家に火を放つ。"
 yearly_republic.1016.d: "[patrician.GetHerHim]に恐怖を味わわせてやろう！"
 yearly_republic.1016.e: "[patrician.GetHerHis]には自身の良心に従って投票させよう。"
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip]はあなたと同じ側に投票することを誓う"
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip]を見せしめにする。"
 yearly_republic.1017.t: "哲人王"
 yearly_republic.1017.desc: "晩餐は明け方まで続き、酒が注がれるにつれて皆の舌も滑らかになっていく。\n[debater_01.GetFirstName]、[debater_02.GetFirstName]、[debater_03.GetFirstName]、そして私は、この世のあらゆる話題について議論を交わした。\n\n今、私は共和国でも最も博識なパトリシアンたちと対話しているのだと痛感する——実に輝かしい面々だ。次に議会が開かれる際、優れた論拠と鋭い知性をもってすれば、私の側に投票するよう説得できるかもしれない人々である。"
 yearly_republic.1017.a: "見事な弁論術で彼らを説得する。"
 yearly_republic.1017.b: "推論の正しさで彼らを圧倒する。"
 yearly_republic.1017.c: "耳を傾けて学ぶほうが賢明かもしれない。"
 yearly_republic.1017.a.success.desc: "卓抜した弁舌家である[debater_orator.GetFirstNameNoTooltip]を論破する"
 yearly_republic.1017.a.success.toast: "一同が説得され、味方になった"
 yearly_republic.1017.a.failure.desc: "卓抜した弁舌家である[debater_orator.GetFirstNameNoTooltip]に言いくるめられる"
 yearly_republic.1017.a.failure.toast: "あなたの弁舌は通用しなかった"
 yearly_republic.1017.b.success.desc: "最も学識深い[debater_scholar.GetFirstNameNoTooltip]を論理で打ち負かす"
 yearly_republic.1017.b.success.toast: "一同が納得した"
 yearly_republic.1017.b.failure.desc: "最も学識深い[debater_scholar.GetFirstNameNoTooltip]に論理の穴を突かれる"
 yearly_republic.1017.b.failure.toast: "あなたの主張が徹底的に論破された"
 yearly_republic.1017.c.toast: "耳を傾けて過ごす夜"
 yearly_republic.1017.c.tt: "この夜の討論が、あなたに永続的な影響を与える可能性がわずかにある"
 yearly_republic.1017.c.insight.toast: "討論が心に刻まれた"
 yearly_republic.1018.t: "贈り物を携えて"
 yearly_republic.1018.desc: "私の[ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]である[benefactor_01.GetName]が、何の前触れもなく門前に現れた。挨拶を交わし、熱い抱擁を交わした後、[benefactor_01.GetFirstNameNoTooltip]は私を外へ連れ出した。そこで待っていたのは、品物や小さな珍品を満載した荷車だった。\n\n「突然訪問して申し訳ない。近くを通りかかって、最近旅で手に入れたこの[new_curio.GetType]を、君なら気に入ってくれるかと思いましてね」\n\n[benefactor_01.GetSheHe|U]は荷車に掛けられた覆いを持ち上げ、[new_curio.GetName]を見せた。"
 yearly_republic.1018.a: "「ありがとうございます、我が[ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]よ！」"
 yearly_republic.1018.b: "これはなかなかいい値で売れるかもしれない。"
 yearly_republic.1018_domicile_curio_sold_tt: "後日、[new_curio.GetName]を売却する。"
 yearly_republic.1019.t: "細部を見る目"
 yearly_republic.1019.desc: "今日もまた、私の[ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]である[benefactor_01.GetShortUIName]と一緒に、[event_location_01.GetName]の街を歩いている。見たり語り合ったりすることは常に何かしらあるものだ。\n\n「あの商品の保管の仕方を見てごらんなさい。[target_city.GetNameNoTooltip]では、もっと上手くやっていましたよ。いいですか、[ROOT.Char.GetFirstNameNoTooltip]よ。少し注意を払うだけで、周りの人々から学べることは実にたくさんあるものです」"
 yearly_republic.1019.a: "「旅先で[experience_trade_category_01.GetNameNoTooltip]について学んだのですか？」"
 yearly_republic.1019.b: "「市場で[experience_trade_category_02.GetNameNoTooltip]の商売について話し合いましょう」"
 yearly_republic.1019.c: "周囲を観察することを日課にしよう。"
 yearly_republic.1020.t: "浴場での取引"
 yearly_republic.1020.desc: "「…何しろ、商売は信頼できる相手と組んでこそ繁盛するものだ」\n\n[house_benefactor_01.GetFirstName]は頭に桶一杯の湯をかぶると、真剣な表情で再び私に向き直った。「[ROOT.Char.GetFirstName]よ、あなたの一族には我が一族も敬意を抱いています」\n\n浴場の湯気で視界がぼやけ、湯の温かさが筋肉の緊張をほぐしていく。\n\n「あなた方は、我が[house_benefactor_01.GetDynastyHouseNameNoTooltip]家にとって、これまでよき友人でした。ですから、互いの協力関係を深めるのはごく自然なことだと思うのです。それは両家にとって利益になるでしょう」"
 yearly_republic.1020.a: "「互いの代理人や異国の人脈を共有し、活動範囲を広げましょう」"
 yearly_republic.1020.b: "「互いの専門知識を共有し、ともに力をつけましょう」"
 ## GLOSS
 BUCENTAUR_GLOSS: "ブチェンタウロはヴェネツィアの金箔を施された公用船であり、アルセナーレの漕ぎ手によって漕がれ、儀式にのみ使用された。"
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#!——ラテン語で「我らは、真かつ永続的な支配の証として、汝、海と結ばれる」の意。"
