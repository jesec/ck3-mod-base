l_japanese:
 gdp_travel_events.1000.t: "$travel_danger_prefix$熱波に捕らわれて"
 gdp_travel_events.1000.desc: "[ROOT.Char.GetCurrentLocation.GetName]の砂丘は、果てしない砂の海となって地平線の彼方まで続いている。照りつける陽光が、砂の表面に揺らめく蜃気楼を作り出している。汗だくになりながらも日陰ひとつ見当たらず、私たちは休憩のため足を止めた。すると、目を見開いた私の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))]、[entourage_member_one.GetFirstName]がこちらを向く。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')|U]、暑さを恐れることはありません。昨夜、[entourage_member_one.GetFaith.HighGodName]のお告げがありました！この近くにオアシスがあるという幻視を授かったのです」"
 gdp_travel_events.1000.a: "いや、進むべきはあちらだ！"
 gdp_travel_events.1000.b: "他に手はない。行ってみよう。"
 gdp_travel_events.1000.b.success: "[entourage_member_one.GetFaith.HighGodName]に感謝を。オアシスは実在した"
 gdp_travel_events.1000.b.failure: "それはただの蜃気楼だった"
 gdp_travel_events.1000.c: "幻視を当てにはしない。"
 low_caravaneer_experience_reason_tooltip: "$trait_track_caravaneer$系統の[trait_level_track_xp|E]が#V 100#!以上必要（[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）"
 gdp_travel_events.1010.t: "迷える旅人たち"
 gdp_travel_events.1010.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の[ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')]を出て少し行った街道で、私たちの隊商は野営の支度を始めていた。ようやく腰を落ち着けて夜を迎えようとしたその時、背後からか細い声が聞こえてきた。\n\n「すみません、[ROOT.Char.Custom('FormOfAddressForLiege')]。家族と一緒に旅をしていたのですが、隊商とはぐれてしまいました。大したお礼はできませんが、今夜だけでも、私の[traveler_child.Custom('GetDaughterSon')]が無事でいられるなら、何でも差し上げます」"
 gdp_travel_events.1010.a: "金はいらない。こちらへ来なさい。"
 gdp_travel_events.1010.b: "安全な場所を提供してもいいが…少しばかり料金はもらう。"
 gdp_travel_events.1010.c: "#EMP 何でも#!だと…"
 gdp_travel_events.1010.d: "食料に余裕がない。"
 gdp_travel_events.1020.t: "旅の小話"
 gdp_travel_events.1020.desc.intro: "[journey_start.GetName]を発ってからの長旅で尻はすっかり痛んでいるが、私の[ROOT.Char.Custom('GetDonkeyDromedary')]は[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]を小走りに進んでいく。長旅などものともしていない様子の[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))]、[associate.GetFirstName]が近付いてきて、何やら話したそうに口を開いた。\n\n"
 gdp_travel_events.1020.desc.caravaneer: "「ここで小話をひとつ、[ROOT.Char.Custom('FormOfAddressForLiege')]。先日、[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]から来た隊商長と話したのですが、実に見事な方位を知る道具があると聞きまして…」"
 gdp_travel_events.1020.desc.artisan: "「[ROOT.Char.Custom('FormOfAddressForLiege')|U]、ご存じですか？[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]は素晴らしい染料になるんです。花びらをすり潰して…」"
 gdp_travel_events.1020.desc.creditor: "「面白い話がありますよ、[ROOT.Char.Custom('FormOfAddressForLiege')]。土地によっては、借金を返さない相手から略奪することが#EMP 合法#!だったりするんです。それで思い出したんですが、昔、いとこたちと…」"
 gdp_travel_events.1020.desc.war_profiteer: "「面白い話がありますよ、[ROOT.Char.Custom('FormOfAddressForLiege')]。この[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]は、昔、大きな戦いの舞台だったそうです。伝説の剣士がここで命を落としたそうですが、その者はなんでも、[ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]さながらに敵をなぎ倒したとか…」"
 gdp_travel_events.1020.a: "実に興味深い。続きを聞かせてくれ。"
 gdp_travel_events.1020.b: "それより、[ROOT.Char.Custom('my_subject_of_interest')]について話そう。"
 gdp_travel_events.1020.c: "静かに旅を続けたい。"
 gdp_travel_events.1020.b.success: "話題を変える"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip]はあなたの話に興味を示さない"
 gdp_travel_events.1030.t: "不穏な囁き"
 gdp_travel_events.1030.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))]の[ambitious_associate.GetFirstName]が、周囲を見回して人目がないことを確かめると、私に身を寄せてこう囁いてきた。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')|U]、あなたの共同経営者である[current_partner.GetFirstName]について、気がかりな話を耳にしました。商会では、[current_partner.GetSheHe]#EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!という噂でもちきりです。本当なら、[current_partner.GetHerHim]には裁きを受けさせなければなりません！\n\n…それで、この大事な知らせをお伝えした私にも、何か褒美をいただけませんか？」"
 gdp_travel_events.1030.a: "真相を確かめなければ！"
 gdp_travel_events.1030.a.unity_loss.desc: "共同経営者の秘密を知った"
 gdp_travel_events.1030.b: "憶測で判断するつもりはない。"
 gdp_travel_events.1030.b.unity_gain.desc: "共同経営者に関する根拠のない噂に惑わされることを拒んだ"
 gdp_travel_events.1040.t: "$travel_danger_prefix$荒れ果てた井戸"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName]は古びた井戸を覗き込み、鼻をしかめた。\n\n井戸は長年放置され、石積みに草木が茂り、汲み桶は半ば腐り果て、その水は喉が渇ききった男ですら飲むのを躊躇うほどの悪臭を放っている。\n\n不運にも、我々の水袋はすでにしぼんでしまい、喉の渇きは耐え難いほどに強まってる。"
 gdp_travel_events.1040.a: "少しの汚れくらい、自分のような者の体にはどうってことない！"
 gdp_travel_events.1040.b: "水を浄化する方法を知っている。"
 gdp_travel_events.1040.c: "残された水は割り当てて使わなければならない。"
 gdp_travel_events.1040.d: "これから先は、喉の渇きに悩まされる長い道のりになりそうだ。"
 gdp_travel_events.1040.e: "ほんの一口だけなら…"
 gdp_travel_events.1040.e.critical_failure.tt: "病状が悪化する。"
 gdp_travel_events.1040.e.success: "この水は飲んでも安全だ。"
 gdp_travel_events.1040.e.success.desc: "井戸の水を飲み、清々しい気分になる。"
 gdp_travel_events.1050.t: "$travel_danger_prefix$倒木"
 gdp_travel_events.1050.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]の[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]を嵐が襲い、木々が根こそぎ倒れ、道に散乱している。地元の労働者たちが瓦礫を切り払っているが、通り抜けられるようになるにはしばらく時間がかかりそうだ。\n\n周辺の[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]は通行可能だが、今にも倒れそうな木々が立ち並んでおり、危険な迂回路となっている。"
 gdp_travel_events.1050.x: "私の馬、[ROOT.Char.Custom('WarhorseStoryName')]にこの瓦礫をどけさせよう！"
 gdp_travel_events.1050.a: "せっかくだ、私も手を貸そう。"
 gdp_travel_events.1050.b: "彼らのやり方から学ぶとしよう。"
 gdp_travel_events.1050.c: "倒木を迂回する方法を探そう。"
 gdp_travel_events.1050.d: "労働者たちが作業を終えるのを待とう。"
 gdp_travel_events.1050.c.success: "倒木を迂回する道を見つける。"
 gdp_travel_events.1050.c.failure: "荒野で負傷する。"
 gdp_travel_events.1060.t: "$travel_danger_prefix$鼠だらけの船倉"
 gdp_travel_events.1060.desc: "船倉は鼠で埋め尽くされ、食料が貪り食われている。保管方法に問題があり、蓋がきちんと閉まっていなかっただとか、袋が古くなっていたことが原因だという者がいる一方、単純に鼠の数があまりにも多すぎるせいだという者もいる。\n\n理由はともかく、こちらは急速に劣勢に追い込まれている。薄汚い鼠どもに食料をすべて食い尽くされ、何もかも失う前に、手を打たなければならない。"
 gdp_travel_events.1060.x: "飼い猫の[ROOT.Char.Custom('CatStoryName')]に任せよう。"
 gdp_travel_events.1060.a: "「銛と丈夫な網を持ってこい！」"
 gdp_travel_events.1060.b: "保管方法の問題は、私が自分で解決する！"
 gdp_travel_events.1060.c: "港へ向かい、物資を補充する。"
 gdp_travel_events.1060.d: "全員、鼠捕りにかかれ！"
 gdp_travel_events.1060.b.tt: "あなたの[GetTradeGoodCategory('trade_category_cereals').GetName]の[expertise|E]が#V 25#!以上でなければならない"
 gdp_travel_events.1070.t: "$travel_danger_prefix$背後に迫る危険"
 gdp_travel_events.1070.desc: "地平線に土煙が見えたかと思うと、次の瞬間、盗賊団が現れた。馬を躍らせ、瓦礫の山を越えてくる。\n\n「止まれ！」と盗賊団の頭が私に呼びかける。「交易で手に入れた金を大人しく渡せ、[ROOT.Char.GetTitleAsNameNoTooltip|l]。そうすれば誰も傷つかずに済む」"
 gdp_travel_events.1070.a: "「私は[ROOT.Char.GetSuzerain.GetShortUINamePossessive]の庇護を受けて旅をしているのだぞ、下郎どもめ！」"
 gdp_travel_events.1070.a.success: "後援者の名を出すことで無事に通行する"
 gdp_travel_events.1070.b: "「奪いたければ、力ずくで奪ってみろ！」"
 gdp_travel_events.1070.b.success: "盗賊を追い払う"
 gdp_travel_events.1070.b.failure: "盗賊に金を奪われる"
 gdp_travel_events.1070.c: "「通してくれるなら、何でもやろう」"
 gdp_travel_events.2000.t: "傾いた塔"
 gdp_travel_events.2000.desc: "これは…目の錯覚か？足元はしっかりしているように感じるのに、本当は違うのか？いや、目の前の光景は現実離れしているが、私の感覚がおかしくなったわけではない。#EMP 偉大な[GetBuildingType('tower_of_pisa').GetNameNoTooltip]が傾いている#!！\n\n「ここの地盤は、固まった牛乳ほど頼りないですな、[ROOT.Char.Custom('FormOfAddressForLiege')]」と、隣に立つ石工の棟梁[mason.GetFirstName]が言った。「建設がまだ4分の1ほどしか進んでいないうちから傾きはじめましたが、どうにか仕上げました」\n\n「見事でしょう？」"
 gdp_travel_events.2000.a: "もしかすると、この#EMP 風変わりな特徴#!が旅行者を惹きつけるかもしれない…"
 gdp_travel_events.2000.b: "君は天才か、あるいは頭のおかしい[mason.GetWomanMan]だな。採用だ！"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip]、"
 gdp_travel_events.2002.desc: "我が石工たちが、堂々たる[GetBuildingType('tower_of_pisa').GetNameNoTooltip]がついに完成したと喜んで報告した。\n\nだが、ピサからは奇妙な噂も耳にしている。旅人たちが、これまでに見たどんな建造物とも#EMP まったく#!異なる建物について噂しているというのだ。私は建設に何か問題があったのではないかと懸念している。"
 gdp_travel_events.2002.a: "自分の目で彼らの仕事を確かめよう。"
 gdp_travel_events.2002.b: "倒れずに立っている限り、どうでもいい。"
