l_japanese:
 study_scripture_outcome.10.t: "$study_scripture_title$学びの規律"
 study_scripture_outcome.10.desc: "書見台には書物が開かれている。[ROOT.Char.GetFaith.GetAdjective]の教義条項が、丁寧な筆致で書き写されている。闇の中、蝋燭の火がかすかに揺らめく。下の[ROOT.Char.GetFaith.HouseOfWorship]には、いつものように信徒たちの姿がある。\n\n"
 study_scripture_outcome.10.desc_quote: "開かれた頁には、かつてこれを読んだ誰かが、一節だけに下線を引いている。#EMP 「[ROOT.Char.Custom('RandomStudyVerseFragment')]」#!\n\nこの聖なる頁に、どこまで我が身を捧げようか？"
 study_scripture_outcome.10.desc_generic: "この聖なる学びに、どこまで我が身を捧げようか？"
 study_scripture_outcome.10.a: "修道院の外のことなど、今は構うまい。"
 study_scripture_outcome.10.b: "[ROOT.Char.Custom('StudyOfficesWord')]と同じく、学びにも決まった時間を設けよう。"
 study_scripture_outcome.10.c: "心の赴くままに読み進めよう。"
 no_change_study_scripture_tt: "あなたの[scheme|E]「[GetScheme('study_scripture').GetTypeName]」が補正されずに進行する"
 study_scripture_outcome.110.t: "$study_scripture_title$聖なる頁"
 study_scripture_outcome.110.desc: "[ROOT.Char.GetFaith.GetName]の聖なる書物を、一行ずつ読み解いていく。燃えさしの蝋燭の下には溶けた蝋が溜まり、欄外に描かれた兎とカタツムリは、互いに言い争っている。\n\n"
 study_scripture_outcome.110.desc_quote: "ある一節が、心に深く響く。\n#EMP 「[ROOT.Char.Custom('RandomRelevantBibleQuote')]」#!\n\n[ROOT.Char.GetFaith.HighGodNamePossessive]の信徒を導く務めを担うなら、この言葉を胸に刻まねばならない。"
 study_scripture_outcome.110.desc_generic: "[ROOT.Char.GetFaith.HighGodNamePossessive]の信徒を導く務めを担うなら、この言葉を胸に刻まねばならない。"
 study_scripture_outcome.110.a: "どんな代償を払ってでも、学ばねばならない。"
 study_scripture_outcome.110.b: "時が来れば、いずれ理解できるだろう。"
 study_scripture_outcome.120.t: "$study_scripture_title$長大な注釈書"
 study_scripture_outcome.120.desc: "信徒たちを導く前に、まずは自らを律する術を学ばねばならない。[commentary_writer.GetTitledFirstName]の注釈書が目の前に開かれている。[ROOT.Char.GetFaith.ReligiousText]をめぐって、一人の学者が生涯をかけて積み重ねた労作だ。茨の茂みのように入り組み、その言葉は棘のように鋭い。1行を読み解けば、さらに3行が待ち受ける。\n\nこの難物を読み解くには、ただ規律をもって学びつづけるほかない。"
 study_scripture_outcome.120.a: "隅々まで読み込み、より深い意味を探ろう。"
 study_scripture_outcome.120.b: "日々、決まった時間を割けば、着実に進む。"
 study_scripture_outcome.120.c: "一夜に1頁で十分だ。"
 scholar_xp_high_tt: "学識が大幅に深まる"
 scholar_xp_low_tt: "学識がわずかに深まる"
 study_scripture_outcome.130.t: "$study_scripture_title$忍耐の一頁"
 study_scripture_outcome.130.desc: "なぜ意味がつかめないのだろう。4度目にその一節を読み返す。それでも、何ひとつ見えてこない。そっと机に額を預ける。\n\n「蝋燭を持ってきました」と、戸口から[ROOT.Char.Custom2('RelationToMeShort', tutor)]の[tutor.GetFirstName]が声をかける。「ああ、昔の注釈書ですね。このあたりならよく知っています。少し一緒に読み解いてみましょうか？」\n\n顔を上げる。今の自分に必要なのは、誰かの助けなのかもしれない。"
 study_scripture_outcome.130.a: "頼む。教えを乞うことを恥とは思わない。"
 study_scripture_outcome.130.b: "しばらくここにいてくれ。書物はあとでいい。"
 study_scripture_outcome.140.t: "$study_scripture_title$[ROOT.Char.Custom('StudyParishWord')|U]への説教"
 study_scripture_outcome.140.desc: "ため息とともに書物を閉じる。教義はすべてここに記されている。だが、先日[preacher.GetTitledFirstName]が目の前で説教したとき、そこに三段論法などひとつもなく、ただ[ROOT.Char.GetFaith.HighGodNamePossessive]の飾らぬ真理だけがあった。[ROOT.Char.Custom('StudyParishWord')]の人々は涙した。#EMP 私も#!涙した。"
 study_scripture_outcome.140.a: "教義だけでなく、伝え方も学ばねばならない。"
 study_scripture_outcome.140.b: "我が務めは書物と向き合うことだ。[ROOT.Char.Custom('StudyPulpitWord')]に立つことではない。"
 study_scripture_outcome.150.t: "$study_scripture_title$世俗財産"
 study_scripture_outcome.150.desc: "「少し歩きましょう」と、[ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )]の[steward_scope.GetFirstName]が帳簿を小脇に抱え、朝の戸外へと手招きする。\n\n「寺院の畑、水車小屋、十分の一税の倉——蓄えは十分か、修繕が必要なところはないか、同じものが二重に割り当てられてはいないか、よく見ておいてください。信徒は恩寵だけでは養えません」"
 study_scripture_outcome.150.a: "帳簿の見方を教えてくれ。"
 study_scripture_outcome.150.b: "歩けば少しは頭もすっきりするだろう。"
 study_scripture_outcome.160.t: "$study_scripture_title$学問の友"
 study_scripture_outcome.160.desc: "学びを続けるうちに、[colleague.GetTitledFirstName]と文を交わすようになった。その篤い信仰は、遠く離れた地にまで聞こえている。\n\n"
 study_scripture_outcome.160.desc_distant: "我々は信仰について書簡を交わし、問いを投げかけ、議論を重ね、ときには互いの誤りを正す。[colleague.GetHerHis|U]の字はひどいものだが、論にはしっかり筋が通っている。"
 study_scripture_outcome.160.a: "腰を据えて論じ合おう。"
 study_scripture_outcome.160.b: "学識ある者なら、自身の教区がどう治められているか知っておくべきだ。"
 study_scripture_outcome.160.c: "ともに書物へ戻ろう。"
 piety_gain_high_tt: "敬虔点が大幅に増加する"
 piety_gain_low_tt: "敬虔点がわずかに増加する"
 study_scripture_outcome.170.t: "$study_scripture_title$封印された書簡"
 study_scripture_outcome.170.desc: "[ROOT.Char.Custom2('RelationToMeShort', letterman)]の[letterman.GetFirstName]が、まるで聖遺物でも扱うかのように、一通の書簡を持ってくる。[senior.GetTitledFirstName]の印章が押されたものだ。\n\n「そなたが学びに励んでいるとの評判は、遠くまで届いている。学びを怠らぬ牧者がいることは、我らが信仰にとって大きな恵みだ。その歩みを続けよ。我が恩顧もまた、変わることはない」\n\n"
 study_scripture_outcome.170.desc_quote: "書簡の末尾には、本文とは別に、ひとつの聖句だけが記されている。\n#EMP 「[ROOT.Char.Custom('RandomBibleQuoteShort')]」#!"
 study_scripture_outcome.170.desc_generic: "書簡の末尾には、[ROOT.Char.GetFaith.HighGodNamePossessive]の御名における祝福が、ひときわ大きな文字で記されている。"
 study_scripture_outcome.170.a: "ふさわしい返書をしたためよう。"
 study_scripture_outcome.170.b: "もう少し公に、この学識を認めてくれてもよいのでは…？"
 study_scripture_outcome.170.c: "もう一度読もう。今度はゆっくりと。"
 study_scripture_outcome.171.t: "$study_scripture_title$信徒への書簡"
 study_scripture_outcome.171.desc: "[ROOT.Char.GetFaith.GetName]を信仰する各地から書簡が届く。典礼の一語をめぐって争う聖職者、信仰への疑念に怯える村の[ROOT.Char.GetFaith.PriestNeuterPlural]、正誤を確かめられない訳文について判断を仰ぐ学者。そうした論争に裁定を下すのは私だ。\n\n"
 study_scripture_outcome.171.desc_quote: "今夜の書簡には、期待を込めて聖句が引かれている。\n#EMP 「[ROOT.Char.Custom('RandomBibleQuoteShort')]」#!\n\n机の上には書簡が積み上がっていく。それとともに、私の学識も静かに深まっていく。"
 study_scripture_outcome.171.desc_generic: "机の上には書簡が積み上がっていく。それとともに、私の学識も静かに深まっていく。"
 study_scripture_outcome.171.a: "すべてに答えよう。それが牧者の務めだ。"
 study_scripture_outcome.171.b: "写字生たちに返書を写させ、各地の信徒へ広めよう。"
 study_scripture_outcome.171.c: "今夜は一人の学徒だ。書簡はあとでいい。"
 study_scripture_outcome.172.t: "$study_scripture_title$牧会書簡"
 study_scripture_outcome.172.desc: "今夜は、牧者たちが遠方の[ROOT.Char.Custom('StudyParishWord')]へ宛てた書簡を読む。説教も教えの言葉も、[ROOT.Char.Custom('StudyParishWord')]ごとに実にさまざまだ。\n\nふと、[pastoral_lord.GetTitledFirstName]の領内にある[pastoral_county.GetNameNoTier]の信徒たちに思いをはせる。かの地にも教会がある。だが、遠く離れた彼らに私の導きは届いていない。そろそろ、こちらから書簡を送るべきかもしれない。\n\n羽根ペンを取る。#EMP 「[pastoral_county.GetNameNoTier]の信徒たちへ…」#!"
 study_scripture_outcome.172.a: "これを送ろう。"
 study_scripture_outcome.172.b: "書き上げること自体が学びだった。それで十分だ。"
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName]は[pastoral_county.GetNameNoTier]の人々に書簡を送った"
 study_scripture_outcome.180.t: "$study_scripture_title$重荷を下ろす"
 study_scripture_outcome.180.desc: "顎に力を込め、肩をこわばらせながら読みはじめる。またひとつ、耐え忍ぶべき務めだと思っていた。\n\n"
 study_scripture_outcome.180.desc_confession: "だが、頁を読み進めるうちに、ふいに心の堰が切れる。これまで抱えてきたすべてを、[ROOT.Char.GetFaith.HighGodName]にだけ声に出して打ち明ける。気づけば、重荷は消えている。\n\n数か月ぶりに、進むべき道がはっきりと見える。"
 study_scripture_outcome.180.desc_generic: "だが、頁を読み進めるうちに、いつしか肩の重荷が消えている。まるで目の前を覆っていた幕が上がったかのようだ。\n\n数か月ぶりに、進むべき道がはっきりと見える。"
 study_scripture_outcome.180.a: "さて、次は何を読もうか…"
 study_scripture_outcome.190.t: "$study_scripture_title$学識ある者への後援"
 study_scripture_outcome.190.desc: "学問にもまた、駆け引きがある。どの評議会に写本を送り、どの席に有望な講師を着かせ、どの場で我が名を好意的に語らせるか…\n\n学びには怠りなく励んできた。だが、誰の目にも留まらぬ努力では、その甲斐もない。"
 study_scripture_outcome.190.a: "宗教会議に我が名を知らしめよう。"
 study_scripture_outcome.190.b: "神学者たちに、書き留めたものを分けてもらおう。"
 study_scripture_outcome.190.c: "神秘主義者たちにも、我が学びの成果を知ってもらおう。"
 study_scripture_outcome.190.d: "我が信心は、それだけで十分だ。"
 study_scripture_outcome.200.t: "$study_scripture_title$幻視者"
 study_scripture_outcome.200.desc: "文字が途切れ、そこから先は別の何かへと変わっていく頁がある。[GetTrait('lifestyle_mystic').GetName( mystic )]として知られる[mystic.GetTitledFirstName]は、真昼よりも明るい闇について、言葉が尽きたあともなお続く祈りについて記している。そして[ROOT.Char.GetFaith.GetName]も、勇気をもって扉を叩く者には、その先へ通じる道があると説いている。\n\n蝋燭が消えるまで読みつづけた。それから長いあいだ、闇の中でじっと耳を澄ませていた。"
 study_scripture_outcome.200.a: "あの闇の中には、何かが待っていた。それを探し求めよう。"
 study_scripture_outcome.200.b: "神秘よ、我を試せ。恐れるものか。"
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip]には、称賛の書簡を送ろう。"
 study_scripture_outcome.200.d: "その扉のことは心に留め、もっと堅実な学びを続けよう。"
 study_scripture_outcome.300.t: "$study_scripture_title$夜の祈り"
 study_scripture_outcome.300.desc: "[ROOT.Char.GetFaith.HouseOfWorship]は冷え切り、物音ひとつしない。最後の祈りと最初の祈りの狭間には、誰のものでもないひとときがある。今夜は、そのひとときを私だけのものにした。一本の蝋燭と闇、そしてその小さな炎を取り囲む神秘。\n\n沈黙の向こうで、何かが待っている。急ぐ気配はない。今夜の私も同じだ。"
 study_scripture_outcome.300.a: "もっと深く。さらに奥へ踏み込もう。"
 study_scripture_outcome.300.b: "あと1時間、静寂に身を置いてから眠ろう。"
 study_scripture_outcome.300.c: "夜の祈りは果たした。それで十分だ。"
 study_scripture_outcome.100.t: "$study_scripture_title$継承をめぐる問題"
 study_scripture_outcome.100.desc: "夜が更けるころ、選挙に関する教会法規を目の前に広げる。その頁を照らすのは、かすかな灯りだけだ。誰に選ばれる資格があるのか、誰に選ぶ権利があるのか、どの先例が守られ、どれが曲げられてきたのか——読む根気さえあれば、すべてここに記されている。\n\n老いた者が死ねば、コンクラーベが開かれる。そして枢機卿たちは、いざという時に法を知っていた者を忘れない。"
 study_scripture_outcome.100.a: "いつか、誰を選ぶべきかが問われる時が来る。その答えは私だ。"
 study_scripture_outcome.100.b: "知恵を得るには時がかかる。野心はまだ先でいい。"
 study_scripture_outcome.100.c: "もう寝てしまおう…"
 pam_ss_papabile_tt: "教皇継承におけるあなたの[papabile_score|E]が#P +10#!上昇する"
 study_scripture_outcome.101.t: "$study_scripture_title$名高き聖典解釈者"
 study_scripture_outcome.101.desc: "冷めた夕食を口に運んでいると、ふと答えが浮かぶ。ようやく、この一節をどう読み解けばよいのかがわかった。\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP 「[ROOT.Char.Custom('RandomRelevantBibleQuote')]」#!\n\n幾世代もの[Glossary('聖典解釈者', 'GLOSS_EXEGETE')]たちが、この言葉をめぐって議論を重ねてきた。だが今、その意味がはっきりと見えている。残るのは、この解釈をどう生かすかということだ。"
 study_scripture_outcome.101.desc_generic: "幾世代もの[Glossary('聖典解釈者', 'GLOSS_EXEGETE')]たちが、この言葉をめぐって議論を重ねてきた。だが今、その意味がはっきりと見えている。残るのは、この解釈をどう生かすかということだ。"
 study_scripture_outcome.101.a: "次の祭日には、[ROOT.Char.Custom('StudyPulpitWord')]からこの解釈を説こう。"
 study_scripture_outcome.101.b: "学識ある者たちのあいだだけで、ひそかにこの解釈を広めよう。"
 study_scripture_outcome.101.c: "静寂の中で授かったものだ。ならば、静寂の中に留めておこう。"
 GLOSS_EXEGETE: "釈義を行う者。特に宗教上の聖典について、その内容を精査し、説明・解釈することに通じた専門家や学者。"
 study_scripture_outcome.102.t: "$study_scripture_title$教義への理解"
 study_scripture_outcome.102.desc: "[ROOT.Char.GetFaith.GetName]の教義を長年学んできたが、それでも、どうしても腑に落ちない教えがいくつかあった。\n\n"
 study_scripture_outcome.102.desc_tenet: "だが今夜、ついに[pam_ss_clarity_tenet.GetBaseName|U]の教えがはっきりと理解できた。何を求め、何を赦し、どこに一線を引くのか。今なら、どんな学者を前にしてもその教えを擁護でき、子供にもわかるように説き明かせる。"
 study_scripture_outcome.102.desc_generic: "だが今夜、ついにその教えがはっきりと理解できた。何を求め、何を赦し、どこに一線を引くのか。今なら、どんな学者を前にしてもその教えを擁護でき、子供にもわかるように説き明かせる。"
 study_scripture_outcome.102.desc_quote: "\n\n#EMP 「[ROOT.Char.Custom('RandomRelevantBibleQuote')]」#!"
 study_scripture_outcome.102.a: "このひらめきが消えぬうちに、書き留めておこう。"
 study_scripture_outcome.102.b: "この喜びだけで十分だ。"
 study_scripture_outcome.102.c: "啓示のことは、明日の朝にしよう。"
 study_scripture_outcome.121.t: "$study_scripture_title$教師"
 study_scripture_outcome.121.desc: "蝋燭を消しているはずの時刻だというのに、書庫で[ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )]の[student_courtier.GetTitledFirstName]を見つける。今の学識では手に余る書物を前に、かがみ込んで読みふけっている。\n\n「お許しください、[ROOT.Char.Custom('FormOfAddressForLiege')]」と、不意を突かれた[student_courtier.GetSheHe|U]がしどろもどろに言う。「わ、私はただ…この本を読めるようになりたくて…」\n\nかつて、その本を実際に#EMP 読んだ#!ことのある教師を、どれほど切望したことか。"
 study_scripture_outcome.121.a: "一緒に、じっくり読み解こう。"
 study_scripture_outcome.121.b: "この者の学びを後援しよう。"
 study_scripture_outcome.121.c: "一人で学ばせよう。それも本人を鍛えることになる。"
 study_scripture_outcome.122.t: "$study_scripture_title$教理問答"
 study_scripture_outcome.122.desc: "学びが実を結んだ。今夜、[ROOT.Char.Custom('ResidenceBuilding')]の[ROOT.Char.Custom('ResidenceBuildingHallsType')]に家中の者たちを集め、その前で[ROOT.Char.GetFaith.ReligiousText]を開く。\n\n私が読み、皆が耳を傾ける。やがて問いが続く。単純な問いもあれば、思いのほか鋭い問いもある。どうやら、信仰の教えをもっと深く学びたいのは、私だけではないようだ。"
 study_scripture_outcome.122.a: "一行ずつ、皆に説き聞かせよう。それが私の務めだ。"
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U]は聡い。もっと教えてやろう。"
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U]は皆が去ったあとも残っていた。学ぶ意志があるなら、受け入れよう。"
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U]はもう十分に学んだ。祝福を授けよう。"
 study_scripture_outcome.123.t: "$study_scripture_title$[ROOT.Char.Custom('StudySeminaryWord')|U]の門"
 study_scripture_outcome.123.desc: "私が学びに励んでいるとの評判は、巡礼者や行商人とともに各地へ広まっていた。そして今日、その噂を聞きつけた一人の弟子志願者がやってきた。[aspirant.GetTitledFirstName]は旅に疲れ果てながらも、強い意志をにじませて門前に立っている。震える手で、借り物の書物をしっかりと抱えている。\n\n「説いておられる教えを、ご自身でも実際に読んでおられると聞きました。どうか私にお教えください。そうすれば、お仕えいたします」"
 study_scripture_outcome.123.a: "では、信仰の初歩から始めよう。"
 study_scripture_outcome.123.b: "我が宮廷は[ROOT.Char.Custom('StudySeminaryWord')]ではない。"
 study_scripture_outcome.400.t: "$study_scripture_title$医者よ、己を癒せ"
 study_scripture_outcome.400.desc: "その一節に、思わず手が止まる。そこにある非難は、嫌になるほど身に覚えのあるものだ。\n\n"
 study_scripture_outcome.400.desc_generic: "文中に私の名はない。だが、名指しされているも同然だ。私が[penance_sin.GetName( ROOT.Char )]であると、容赦なく、はっきりと突きつけてくる。まるで、書き手が私を知っていたかのように。"
 study_scripture_outcome.400.desc_end: "\n\n本を閉じ、これ以上読まないこともできる。だが、その非難から逃れられるわけではない。"
 study_scripture_outcome.400.a: "癒す術はひとつ。贖罪だ。"
 study_scripture_outcome.400.b: "何があろうと、読みつづけるしかない。"
 study_scripture_outcome.400.c: "聖人は教えを説く。国を治めるのは罪人だ。"
 study_scripture_outcome.410.t: "$study_scripture_title$奇妙な注釈"
 study_scripture_outcome.410.desc: "その写本は借り物で、以前これを読んだ者が欄外に自身の考えを書き残している。異論、祈り、そして[pam_ss_margin_tenet.GetBaseName]と呼ばれる信条についての覚え書き。\n\nこんな走り書きは無視すべきだが、気づけば2度も読み返している。"
 study_scripture_outcome.410.a: "ならば3度目だ。今度はじっくり読もう。"
 study_scripture_outcome.410.b: "ここまで真剣に書かれているなら、こちらも正面から反駁してやろう。"
 study_scripture_outcome.410.c: "頁ごと火にくべてしまおう。"
 study_scripture_outcome.430.t: "$study_scripture_title$信条と心"
 study_scripture_outcome.430.desc: "[ROOT.Char.GetFaith.GetName]の教えの中でも、とりわけ心に深く根づいているものがある。[pam_ss_heart_tenet.GetBaseName]——その教えを理屈で語れるようになるずっと前から、胸に抱いてきたものだ。今夜はあえて、その教えに誤りがないかを丹念に探ってみる。\n\n"
 study_scripture_outcome.430.desc_quote: "だが、どの書も同じ答えを返す。\n#EMP 「[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]」#!\n\n教えに誤りなどなかったのだ。"
 study_scripture_outcome.430.desc_generic: "だが、どの書も、私よりはるかに古く、揺るぎない声でひとつの答えを返す。教えに誤りなどなかったのだ。"
 study_scripture_outcome.430.a: "信じよう。[ROOT.Char.Custom('StudyParishWord')]の皆に、この教えを身をもって示すのだ。"
 study_scripture_outcome.430.b: "この教えを擁護するため、筆を執ろう。"
 study_scripture_outcome.430.c: "どんな教えも、細かく突き詰めれば綻びは見つかる…"
 pam_ss_spread_tenet_tt: "あなたの擁護論により、最大#V 3#!人の[rulers|E]が[pam_ss_heart_tenet.GetBaseName]を受け入れる可能性がある"
 pam_ss_conviction_spread_tt: "$study_scripture_title$個人的信条を採用"
 study_scripture_outcome.1000.t: "$study_scripture_title$咎められた牧者"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U]は声を荒らげない。その必要もない。\n\n「学びを怠っていると聞いた。学ぼうとしない牧者に導かれれば、群れは道を見失う。人より多くを与えられていながら、それをどう生かしてきた？」\n\nそのあとの沈黙は、どんな怒声よりもこたえた。"
 study_scripture_outcome.1000.desc_letter: "書簡には[senior.GetTitledFirstName]の印章が押されている。抑えた調子の一文一文が、ずしりと重くのしかかる。\n\n「学びが滞っていると聞いた。学ぼうとしない牧者は、群れを迷わせる。そなたは人より多くを与えられている。次には、もっとよい報せを聞きたい」\n\n署名はない。印章だけで、誰からのものかはわかる。"
 study_scripture_outcome.1000.desc_dream: "夢の中で、広大な書庫に立っている。並ぶ書物のすべてに私の名が記されている。だが、どの頁も白紙だ。聖画で幾度となく目にした姿が、最後の一冊をそっと閉じる。まるで、死者の瞼を閉じるかのように。\n\n「そなたは人より多くを与えられている」と聖人が告げたところで、目が覚める。それでも、その言葉はまだその場に残っているように感じられる。"
 study_scripture_outcome.1000.a: "二度と、期待を裏切るまい。"
 study_scripture_outcome.1000.b: "もうこれ以上は背負いきれない。終わりにしよう。"
 study_scripture_outcome.1000.c: "もう十分だ。少し休もう。"
 never_study_scripture_again_tt: "[scheme|E]「[GetScheme('study_scripture').GetTypeName]」を#N 二度と#!開始できない"
 study_scripture_outcome.1010.t: "$study_scripture_title$インクの贈り物"
 study_scripture_outcome.1010.desc: "[sender.GetTitledFirstName]から小包が届いた。"
 study_scripture_outcome.1010.end_christian: "栞が挟まれているのは、まさにこれまで読み解けずにいた一節だ。\n\n#EMP 「[ROOT.Char.Custom('RandomRelevantBibleQuote')]」#!\n\n実にありがたい贈り物だ。それに、学びにも役立つ。"
 study_scripture_outcome.1010.end: "中には、美しく装丁された祈祷書が入っている。頁には祈りや注釈が記され、丹念な彩飾が施されている。\n\n実にありがたい贈り物だ。それに、学びにも役立つ。これまで見いだせなかった答えが、この書のどこかにあるのかもしれない。"
 study_scripture_outcome.1010.a: "存分に役立てよう。"
 study_scripture_outcome.1010.b: "立派な本だ。書棚に置けばよく映えるだろう。"
 pam_ss_devotional_book_name: "祈祷書"
 pam_ss_devotional_book_description: "聖典と注釈を収めた彩飾写本。丹念に書き写され、金彩が施されており、随所に篤い信仰がうかがえる。栞は、これを受け取った者が最も読むべき一節に挟まれている。"
 study_scripture_outcome.1020.t: "$study_scripture_title$肉体の苦行"
 study_scripture_outcome.1020.desc: "今夜も聖典を読み解けない。昨夜も、その前の夜も同じだった。目は頁の上を滑るばかりで、心は夕食や寝床へ、教義以外のことばかりにさまよっていく。\n\n問題は肉体だ。昔の苦行者たちはそれを知っていた。安逸こそ、[ROOT.Char.GetFaith.DevilName]が人を惑わす最も気づかれにくい手段だ。飢えは魂を研ぎ澄ます。魂を高めるには、まず肉体を屈服させねばならないのかもしれない。"
 study_scripture_outcome.1020.a: "鞭で雑念を払おう。"
 study_scripture_outcome.1020.b: "肉体を飢えさせ、魂を養おう。"
 study_scripture_outcome.1020.c: "今夜は食事をして眠り、明日また仕切り直すか。"
 study_scripture_outcome.1030.t: "$study_scripture_title$修道院への隠遁"
 study_scripture_outcome.1030.desc: "学びが進まない。同じ机、同じ蝋燭、同じつまずきの繰り返しだ。そこで、身分に左右されぬ信仰心を持つ[ROOT.Char.Custom2( 'RelationToMeShort', counselor )]の[counselor.GetTitledFirstName]を訪ねる。\n\n"
 study_scripture_outcome.1030.desc_hermitage: "「あなたは、あまりにも多くのものを背負い込んでいます」[counselor.GetFirstNameNoTooltip]はそう言って、灯火がひとつ灯るだけの、何もない静かな独房を指し示す。「昔の隠修士たちは知っていました。すべてを削ぎ落とせば、最後に残るものこそ、求めていたものなのだと」"
 study_scripture_outcome.1030.desc_monastery: "「まるで領地を治めるような読み方ですね」と、[counselor.GetFirstNameNoTooltip]は穏やかに言う。「読み終えた頁を、まるで税の勘定でもするように数えておられる。ですが、ここでは同じ一節に1週間かけることもあります。その言葉の中に、自分自身が見えてくるまで」"
 study_scripture_outcome.1030.a: "では、学びのために祝福を授けてもらおう。"
 study_scripture_outcome.1030.b: "ならば、同じ一節を2週間読みつづけよう。"
 study_scripture_outcome.1030.c: "その言葉について祈り、それ以上は求めまい。"
 study_scripture_outcome.1040.t: "$study_scripture_title$助けの手"
 study_scripture_outcome.1040.desc_acolyte: "助けを頼んだ覚えはない。だが、頼まずとも手を差し伸べてくれる者がいた。[ROOT.Char.Custom2( 'RelationToMeShort', helper )]の[helper.GetTitledFirstName]は、覚え書きを整理し、必要な注釈書を探し出し、蝋燭の芯まで切り揃えてくれた。いつの間にか私の癖まで覚えている——どの一節でため息が出るのかまで。\n\n「祈るにも、少し休んだほうがよいですよ」と、[helper.GetSheHe]は何気なく言い、書物の脇に温かい[helper.Custom('GetLocalStreetFood')]を置く。"
 study_scripture_outcome.1040.desc_partner: "[ROOT.Char.Custom2( 'RelationToMeShort', helper )]の[helper.GetTitledFirstName]がそっと入ってきて、私の手から写本を取り、その一節を声に出して読む。その言葉は聖なるものだ。[ROOT.Char.GetFaith.HighGodName]よ、どうかお許しを——今夜ばかりは、[helper.GetHerHis]の[helper.Custom('ObjectifiedFeature')]のほうが、それ以上に神聖に思える。\n\n「手伝わせてください」と、[helper.GetSheHe]は蝋燭のぬくもりをともに感じるほど近くで囁く。「そうしたいんです」"
 study_scripture_outcome.1040.a: "では、夜明けまで私の言葉を書き取ってくれ。今夜で終わらせる。"
 study_scripture_outcome.1040.b: "では、1時間だけ付き合ってもらおう。"
 study_scripture_outcome.1040.c: "その心遣いだけで十分だ。"
 study_scripture_outcome.1040.d: "もっと近くへ。蝋燭の明かりは、そう遠くまでは届かない…"
 study_scripture_outcome.1050.t: "$study_scripture_title$魂の暗夜"
 study_scripture_outcome.1050.desc: "深く読み込みすぎた。真夜中を過ぎたころ、答えは問いへと変わり、確信は疑念へと揺らいでいった。\n\n"
 study_scripture_outcome.1050.desc_quote: "この沈黙に直面したのは、私が初めてではない。#EMP 「我が神、我が神よ、なぜ私をお見捨てになったのか？」#!\n\n蝋燭は燃えつづけ、沈黙は破られない。さて、どうする？"
 study_scripture_outcome.1050.desc_generic: "いつの時代にも、信仰に生きた者たちはこのような疑念を知っていた——[ROOT.Char.GetFaith.HighGodName]が息を潜め、その理由を明かさぬ時があることを。\n\n蝋燭は燃えつづけ、沈黙は破られない。さて、どうする？"
 study_scripture_outcome.1050.a: "疑念もまた、読み解けばよい。"
 study_scripture_outcome.1050.b: "この沈黙こそが答えなのかもしれない。"
 study_scripture_outcome.1050.c: "言葉も疑念も越え、神秘そのものへ踏み込もう。"
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, '戒律の姉妹たち', '戒律の兄弟たちBrothers' )]"
 study_scripture_outcome.1060.desc_house: "学びは思うように進まず、得るものもほとんどない。だが、そのことが、[order_house_county.GetNameNoTier]に拠点を構える[order_head.GetPrimaryTitle.GetNameNoTier|l]にまで伝わった。今日、荷馬車が軋みながら中庭へ入ってきた。積まれているのは、注釈書の写本、木箱いっぱいの蝋燭、そして[order_head.GetTitledFirstName]の印章が押された一通の書簡だ。\n\n「戒律に生きる我らがいるかぎり、牧者が一人で学ぶことはない。ひと言くだされば、我らのものはすべてお使いいただける」"
 study_scripture_outcome.1060.desc_far: "私が学びに行き詰まっていることが遠くまで伝わり、ついには[order_head.GetPrimaryTitle.GetNameNoTier|l]にまで届いた。今日、荷馬車が軋みながら中庭へ入ってきた。積まれているのは、注釈書の写本、木箱いっぱいの蝋燭、そして[order_head.GetTitledFirstName]の印章が押された一通の書簡だ。\n\n「戒律に生きる我らがいるかぎり、牧者が一人で学ぶことはない。ひと言くだされば、我らのものはすべてお使いいただける」"
 study_scripture_outcome.1060.a: "写本に携わったすべての者に、礼を伝えてくれ。"
 study_scripture_outcome.1060.b: "学識ある聖職者を1人、こちらへ遣わしてくれ。"
 study_scripture_outcome.1060.c: "[ROOT.Char.GetFaith.HighGodName]の加護が、皆にあらんことを。"
 pam_ss_lettered_brother_tt: "修道会の#EMP 学識ある聖職者#!があなたの[court|E]に加わる"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U]が[order_head.GetPrimaryTitle.GetNameNoTier|l]から到着する"
