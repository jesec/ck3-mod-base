l_japanese:
 influence_house_ambition_ongoing.1001.tt: "好意的な聞き手"
 influence_house_ambition_ongoing.1001.desc: "[target.GetFirstName]の取り巻きの中で話のわかる人間を見つけられれば、[target.GetHerHis]の考えを変え、こちらの見方を理解させる助けになるかもしれない。\n\n話していて心地よく、弁が立つ人物がいい。見目が良ければなおさらだ。\n\n[target.GetFirstNamePossessive]の廷臣について密かに調べた結果、候補者を2人見つけた。[target_associate_01.GetFirstName]と[target_associate_02.GetFirstName]だ。"
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip]が適任だ。"
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip]なら主を説得できるかもしれない。"
 influence_house_ambition_ongoing.1001.c: "いや、私の言葉だけで十分だ。"
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip]があなたに代わって説得力のある主張を展開する"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip]が説得に失敗する"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip]があなたに代わって説得力のある主張を展開する"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip]が説得に失敗する"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "協力の報酬として金銭を求める。"
 influence_house_ambition_ongoing.1001.cooltip.relation: "見返りは何も求めない。"
 influence_house_ambition_ongoing.1001.cooltip.lewd: "「別の」報酬を提案する"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "見返りを求める。"
 influence_house_ambition_ongoing.1002.tt: "強硬な交渉"
 influence_house_ambition_ongoing.1002.desc: "[target.GetFirstName]は、私の話をまともに聞く気があるのだろうか。聞こえてくるのは、その場しのぎの約束ばかりで、話は先に進まず、中身のない議論が延々と続く。\n\nいい加減、私の不満をわからせてやらねばならない。面と向かって言うのではなく、何らかの方法で、私ほどの[ROOT.Char.GetTitleAsNameNoTooltip]を軽んじれば相応の報いがあるのだと、[target.GetFirstName]に理解させなければならない！"
 influence_house_ambition_ongoing.1002.a: "[target.GetHerHis]の事業に妨害工作を仕掛ける。"
 influence_house_ambition_ongoing.1002.b: "ごろつきを差し向け、[target.GetHerHis]の廷臣を待ち伏せして痛めつける。"
 influence_house_ambition_ongoing.1002.c: "[target.GetHerHis]の家に火を放つ。"
 influence_house_ambition_ongoing.1002.d: "[target.GetHerHim]に恐怖を味わわせてやろう！"
 influence_house_ambition_ongoing.1002.e: "もうしばらく辛抱しよう。"
