l_japanese:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "[target.GetAdherentNameNoTooltip]を見つけた！"
 study_faith_outcome.0010.desc: "内密の調査と少額の賄賂が功を奏した！今や[study_faith_target.GetShortUIName]が、私の目の前に立っている。自称[target.GetAdherentName]の者が。\n\n"
 study_faith_outcome.0010.desc.in_realm: "領内の[target.GetAdherentName]との面会を要請してから、そう時間は経っていない。だが私の呼びかけに応えて、今や[study_faith_target.GetShortUIName]が私の目の前に立っている。\n\n"
 study_faith_outcome.0010.d.intimidated: "「何なりとお申し付けください、我が[ROOT.Char.GetTitleAsName]」と、[study_faith_target.GetSheHe]は震えながら述べる。衛兵たちは[study_faith_target.GetHerHim]を疑わしい眼差しで見つめ、魔術の兆候があれば即座に行動を起こす構えだ。"
 study_faith_outcome.0010.d.safe: "「どのようなご用命でしょうか、我が[ROOT.Char.GetTitleAsName]」と、[study_faith_target.GetSheHe]は少し怯えた様子で尋ねる。我が衛兵たちは、私が信者を探しているという噂を耳にしているだけに、[study_faith_target.GetHerHim]を好奇の眼差しで見ずにはいられない。"
 study_faith_outcome.0010.a: "[target.GetNameNoTooltip]のことを、君から教えてもらおう。"
 study_faith_outcome.0010.b: "気が変わった。"
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName]を解放し、[study_faith_target.GetSheHe]が望むように人生を送らせる。"
 study_faith_outcome.0101.t: "[actor.GetFaith.HighGodName]への精通"
 study_faith_outcome.0101.desc: "[actor.GetRite.GetName]に関する厳しい研鑽を通じて、自分の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]である[actor.GetName]、そして何よりも[actor.GetFaith.GoodGodNames]の道を歩む方法をより深く理解することができた。"
 study_faith_outcome.0101.a: "そろそろ改宗を決意するころだ。"
 study_faith_outcome.0101.b: "[ROOT.Char.GetFaith.GoodGodNames]を見捨てることはできない！"
 study_faith_outcome.0102.desc: "無知な私を導いてくれたあなたの忍耐と寛大さに感謝する。これより、私は[actor.GetFaith.GoodGodNames]の道を歩む。"
 study_faith_outcome.0102.a: "当然のことをしたまでだ。"
 study_faith_outcome.0103.desc: "我が忠誠は[recipient.GetFaith.GoodGodNames]にある！[recipient.GetRite.GetName]を見捨てるつもりはない。"
 study_faith_outcome.0103.a: "不服従には代償が伴う…"
 study_faith_outcome.0111.t: "[actor.GetRite.GetNameNoTooltip]の理解に苦しむ"
 study_faith_outcome.0111.desc: "[actor.GetRite.GetName]に関する厳しい研鑽は何の実りももたらさなかった！[actor.GetFaith.GoodGodNames]の道を歩むのに苦労しているだけでなく、自分の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]である[actor.GetName]の信念が間違っているのではないかと、私は恐れている。"
 study_faith_outcome.0111.a: "改宗すれば理解できるようになるかもしれない…"
 study_faith_outcome.0111.b: "より一層努力しよう。"
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$：大きな進展"
 study_faith_outcome.1000.desc: "努力の末、ついにすべてが一つに繋がった。書物と向き合った果てしない時間、夜通し儀式の練習を重ねた日々、[target.GetFaith.GetAdjective]神学を学ぶために受けた数え切れない講義。そのすべてが実を結び、ようやく[target.GetRite.GetAdjective]の教えを明瞭に理解するに至った。\n\nこの取り組みの中で、私は[target.GetTitledFirstName]を手本にしようとしてきた。今では[target.GetSheHe]が[target.GetRite.GetName]の「温かな抱擁」の中で安らぎを覚える感覚がわかりはじめた気がする。"
 study_faith_outcome.1000.a: "どんな信仰のどんな慣習も学んでみせる！"
 study_faith_outcome.1000.b: "[scheme.GetTargetCharacter.GetRite.GetNameNoTooltip]の教えの方がしっくりくる…"
 study_faith_outcome.1200.t: "$study_faith$：信条の理解"
 study_faith_outcome.1200.desc: "書斎の見慣れた壁に見守られながら、私は静かな勝利を収めた。[discovered_tenet.GetName( target.GetRite )]という[target.GetRite.GetAdjective]の価値観をついに理解したのだ。奇妙ではあるが、少し想像力を働かせれば、[target.GetTitledFirstName]や[target.GetHerHis]の親族がこの異質な慣習を受け入れていることも理解できる。\n\nこれは長い道のりのほんの一歩にすぎない。それでも、[target.GetRite.GetNameNoTooltip]を巡る私の旅は確かに前へ進んでいる。"
 study_faith_outcome.1200.a: "[target.GetRite.GetAdjectiveNoTooltip]の慣習をもっと知りたい！"
 study_faith_outcome.1200.b: "興味深い。[additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]とは、どう関わっているのだろう…？"
 study_faith_outcome.1200.c: "どうにも、落ち着かないな…"
 study_faith_outcome.1400.t: "$study_faith$：[target.GetRite.GetNameNoTooltip]の慣習"
 study_faith_outcome.1400.desc: "[target.GetRite.GetName]を理解するには、形而上学的な枠組みだけではなく、日々の暮らしに及ぼされる現実的な影響にも目を向けなくてはならない。\n\n[discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]の概念について思索を巡らせた末、私はその意味するところを十分に把握し、この概念が[target.GetRite.GetNameNoTooltip]全体の慣習とどう結びついているのかを理解できるようになった。"
 study_faith_outcome.1400.alt1.desc: "\n\nその結果、彼らが[third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]をどのように実践しているのか、その微妙な意味合いまで見えてきた！"
 study_faith_outcome.1400.alt2.desc: "\n\nそれは大いなる真理を形作る一つの断片にすぎない。だが一つ一つの断片が、[target.GetRite.GetNameNoTooltip]の全体像を理解する助けとなるのだ。"
 study_faith_outcome.1400.a: "有益な知識を得た。先へ進もう。"
 study_faith_outcome.1400.b: "夜を徹して励むとしよう。"
 study_faith_outcome.1400.c: "[target.GetShortUINameNoTooltip]にもっと詳しく聞いてみよう。"
 study_faith_outcome.1500.t: "$study_faith$：手の届かない領域"
 study_faith_outcome.1500.desc: "長きにわたる研究によって、私は外部の人間が到達できる限界までたどり着いた。[target.GetRite.GetName]の[rite|E]にまだ解き明かせていない神秘があるとしても、それはその内で育った者だけに明かされるものだ。それは信徒にのみ受け継がれ、いかなる文献や観察、どれほど根気強い師の教えをもってしても、知ることはできない。\n\n知り得ることは、すべて知った。"
 study_faith_outcome.1500.a: "学べることはすべて学んだ。"
 study_faith_outcome.1500.toast: "$study_faith$の完了"
 study_faith_outcome.1500.toast.desc: "[target.GetRite.GetName]について、外部の人間が知り得るすべての[core_tenet|E]と[doctrine|E]を学んだ。"
 study_faith_scheme_stays_active: "[scheme|E]はそのまま続く"
 study_faith_outcome.3000.t: "$study_faith$：研究再開？"
 study_faith_outcome.3000.desc: "あいにく[target.GetTitledFirstName]はもういない。[target.GetFaith.GetName]の細かな部分について、[target.GetHerHim]を頼りに手がかりを得ようとしていたのだから、実に惜しいことだ。\n\nとはいえ、研究を途中でやめる必要はない…誰か別の手本を見つければいいだけだ！"
 study_faith_outcome.3000.alt1.desc: "残念ながら、[target.GetFaith.GetName]の細かな部分についての手がかりを求める相手として、[target.GetTitledFirstName]は最善の人物ではなかったようだ。\n\nとはいえ、研究を途中でやめる必要はない…誰か別の手本を見つければいいだけだ！"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip]は熱心な信徒だ！"
 study_faith_outcome.3000.b: "[potential_continuation_target_2.GetTitledFirstNameNoTooltip]はどうだろう？[potential_continuation_target_2.GetHerHis|U]の神学は面白い。"
 study_faith_outcome.3000.c: "[potential_continuation_target_3.GetTitledFirstNameNoTooltip]はどうだろう？"
 study_faith_outcome.3000.d: "勉強をやめる理由を探していたんだ！やったぞ！"
 study_faith_scheme_retains_progress: "[scheme|E]のこれまでの進捗状況がすべて保存される"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U]が流派を研究！"
 child_studied_faith_desc: "あなたの[owner.Custom('GetDaughterSon')]は[target.GetRite.GetName]の[rite|E]についてさらに学んだ"
 child_studied_faith_invalidated_title: "子供の流派研究工作が無効化"
 child_studied_faith_invalidated_desc: "あなたの子供の[GetScheme('study_faith').GetTypeName][scheme|E]が無効になった"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$：若さゆえの理解力"
 study_faith_ongoing.1000.t.theologian: "$study_faith$：経験ゆえの理解力"
 study_faith_ongoing.1000.desc.young: "[scheme.GetTargetCharacter.GetFaith.GetName]の研究は驚くほど順調に進んでいる。まるで全世界の集中力と活力を手にしたかのようだ！"
 study_faith_ongoing.1000.desc.theologian: "[scheme.GetTargetCharacter.GetFaith.GetName]の研究は順調に進んでいる。彼らの教義体系は、他の宗派とまったく異なるというわけではないことが明らかになった！"
 study_faith_ongoing.1000.desc: "\n\n「#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!」\n\n多少は意訳になったかもしれないが、言葉の細部を読み解いている最中でも、この宗派の精神が明確になってきたのを感じる。\n\nこの綿密な分析を続けていけば、間もなく[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]のあらゆる奥義を手にすることができるだろう！"
 study_faith_ongoing.1000.a: "#EMP すべての#!時間をこのために捧げよう！"
 study_faith_ongoing.1000.b: "ほかのことに時間を使いたい…。"
 study_faith_ongoing.1010.t: "$study_faith$：親密な手ほどき"
 study_faith_ongoing.1010.desc: "#EMP 「[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]」#!\n\n気配を感じ、私は[scheme.GetTargetCharacter.GetFaith.GetAdjective]の聖典の解釈を中断して顔を上げた。[lover_target.GetFirstName]が、情欲を秘めた視線を向けて私の肩越しに覗き込んでいる。\n\n「それは[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]の文献ですか？」と[lover_target.GetSheHe]は尋ねる。\n\n「宮廷に同じ信仰を持つ方がいるとはなんと素晴らしいことでしょう。しかもそれが[ROOT.Char.GetTitleTierName]とは！よろしければ、私がもっと親密に…じっくり手ほどきして差し上げましょうか？」"
 study_faith_ongoing.1010.a: "邪魔が入らぬよう、私の私室へ場所を移そう。"
 study_faith_ongoing.1010.b: "私はそなたについて研究しているだけだ、この[lover_target.Custom('GetDerogatoryNonbeliever')]め！"
 study_faith_ongoing.1010.c: "立ち去れ、[lover_target.Custom2('InsultNounSexual', ROOT.Char)]。私は集中しなければならないんだ！"
 study_faith_ongoing.1010.c.tt: "#EMP あなたは[lover_target.GetHerHis]の目の前で扉を閉め、研究に戻る#!"
 study_faith_ongoing.1011.t: "$study_faith$：誤った道筋"
 study_faith_ongoing.1011.desc: "以前から疑念を抱いていたが、いくつか鎌をかけたところ、[scheme.GetTargetCharacter.GetTitledFirstNamePossessive]の嘘が露わになった。[scheme.GetTargetCharacter.GetSheHe]の主張とは裏腹に、[scheme.GetTargetCharacter.GetHerHis]の[scheme.GetTargetCharacter.GetFaith.GetName]への信仰は不誠実なものだったのだ！\n\n不信心者の欺瞞を知ること自体は興味深いが、[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]への理解を意味ある形で進めるには、より敬虔な信徒を探すのが最善だろう…"
 study_faith_ongoing.1011.a: "もはや[scheme.GetTargetCharacter.GetShortUINameNoTooltip]は頼りにならない。"
 study_faith_ongoing.1011.b: "[scheme.GetTargetCharacter.GetSheHe]がこれほど巧みに隠しおおせていたのなら、私にもできるかもしれない…"
 study_faith_ongoing.1011.c: "ならば、[scheme.GetTargetCharacter.GetShortUINameNoTooltip]はいったい何を#EMP 信じている#!のだ？"
 study_faith_ongoing.1011.c.tt: "[scheme.GetTargetCharacter.GetHerHis]の秘密の信仰を探ってみよう。"
 study_faith_ongoing.1012.t: "$study_faith$：古代の儀式の執行者"
 study_faith_ongoing.1012.desc: "[scheme.GetTargetCharacter.GetTitledFirstNamePossessive]の信仰を探る私の試みは、思いがけない形で成果を上げた。[scheme.GetTargetCharacter.GetSheHe]が[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]の信徒でないことは間違いないが、代わりに[scheme.GetTargetCharacter.GetSheHe]は、[actual_faith.GetName]の奇妙で忘れ去られた儀式に従っているようだ。その行為は…まるで魔術としか思えない。\n\nこの発見に私は動揺している。これを何らかの方法で利用する手はないだろうか？"
 study_faith_ongoing.1012.a: "まあ、これはこれで#EMP 興味深い#!話ではある。"
 study_faith_ongoing.1012.b: "私の研究には、新たな師が必要だ。"
 study_faith_ongoing.1012.b.tt: "あなたは[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]の研究を続けるため、似たような師を探そうとする"
 study_faith_ongoing.1012.c: "これは実際、[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]より遥かに魅力的に思える！"
 study_faith_ongoing.1012.c.tt: "あなたは今後、[actual_faith.GetNameNoTooltip]を研究する"
 study_faith_ongoing.1013.t: "$study_faith$：神秘主義者というよりもただの役者"
 study_faith_ongoing.1013.desc: "[scheme.GetTargetCharacter.GetTitledFirstNamePossessive]の信仰を探る試みは失敗に終わった。[scheme.GetTargetCharacter.GetHerHis]の敬虔な仮面の裏にある世界観には、神学的な裏付けが完全に欠落している。\n\nもしかすると[scheme.GetTargetCharacter.GetSheHe]は、便宜や影響力、あるいは身の安全のためだけに[scheme.GetTargetCharacter.GetFaith.GetName]の教えに従っているのかもしれない。\n\n理由はともかく、この[scheme.GetTargetCharacter.GetWomanMan]が自ら公言する宗派を本気で信じていないことは明らかだ。"
 study_faith_ongoing.1013.a: "時間の無駄だ！もう[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]のことなど放っておこう。"
 study_faith_ongoing.1020.t: "$study_faith$：地元の信徒"
 study_faith_ongoing.1020.desc: "私が[scheme.GetTargetCharacter.GetFaith.GetAdjective]の信仰を研究していることが、[faith_helper.GetTitledFirstName]の耳に届いたようだ。[faith_helper.GetSheHe|U]は地元の信徒であり、私の研究への協力を申し出ている。\n\n「私の労力に見合う、ごくわずかな報酬だけで結構です、[ROOT.Char.Custom('FormOfAddressForLiege')]様」と、[faith_helper.GetSheHe|U]は言って[faith_helper.Custom('quirk_pos_pp')]。"
 study_faith_ongoing.1020.a: "私に協力してくれるなら、この金をやる。"
 study_faith_ongoing.1020.b: "親切には親切で返そうか？"
 study_faith_ongoing.1020.c: "ああ、#EMP なんと無欲#!な方だ、タダで手伝ってくれるとは！"
 study_faith_ongoing.1020.d: "ありがたいが、一人でできる。"
 study_faith_ongoing.1020.c.success: "あなたは[faith_helper.GetFirstNameNoTooltip]をおだてて手伝わせる"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip]があなたの目論見を見抜く"
 study_faith_ongoing.1030.t: "$study_faith$：古い[scheme.GetTargetCharacter.GetFaith.ReligiousText|U]"
 study_faith_ongoing.1030.desc: "一人の[chosen_peasant.GetWomanMan]が、貪欲そうな笑みを浮かべて近づいてきた。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')|U]、あなたが[scheme.GetTargetCharacter.GetFaith.GetName]の教えを研究しているというのは本当ですか？父が[holy_site.GetNameNoTier]への旅の折に、この[scheme.GetTargetCharacter.GetFaith.ReligiousText]を持ち帰ったのです！」\n\n「私は字が読めないので、持っていてもなんの役にも立ちません。いくらかお金をいただけるなら、喜んであなたに差し上げましょう。"
 study_faith_ongoing.1030.a: "なんという幸運だ。この金を取っておけ。"
 study_faith_ongoing.1030.b: "これはお前が思っているほど貴重な物ではない…"
 study_faith_ongoing.1030.b.flavor: "この物売りと値切り交渉をする"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName]が取引に応じる"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName]があなたの申し出に気分を害する"
 study_faith_ongoing.1030.c: "衛兵、この異教の書物を[chosen_peasant.GetHerHim]から没収しろ。"
 study_faith_ongoing.1030.d: "ペテン師め！とっとと失せろ…"
 study_faith_ongoing.1040.t: "$study_faith$：称賛"
 study_faith_ongoing.1040.desc: "なんと有難いことか！[target.GetTitledFirstName]から、[scheme.GetTargetCharacter.GetFaith.GetAdjective]の信仰の機微を学ぼうとする私の努力を称賛する書簡が何通も届いている。[target.GetSheHe|U]は私を、[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]を研究する者の中で最も優れた[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]とまで呼んでいる！\n\n自分の努力が認められるのは、実にいい気分だ！"
 study_faith_ongoing.1040.a: "書記官！感謝の言葉を返信してくれ。"
 study_faith_ongoing.1040.b: "[target.GetFirstNamePossessiveNoTooltip]の信仰のあり方は実に示唆に富んでいる…"
 study_faith_ongoing.1040.c: "ふん！#EMP 自分#!以外の誰からも認めてもらう必要はないわ！"
 study_faith_ongoing.1050.t: "$study_faith$：妨害の臭い"
 study_faith_ongoing.1050.desc: "[scheme.GetTargetCharacter.GetFaith.GetName]の、時に難解で矛盾すら孕む教義についてまとめた私のノートが、書斎中に散乱している。数か月に及ぶ研究成果は引き裂かれ、窓辺に残された1枚の紙片は、少なくともその一部が外に投げ捨てられたことを物語っている。\n\nまた最初からやり直さねばならないのか！？\n\n#EMP くんくん…#!この鼻につく香りはなんだ？乳香か白檀に、何か…花の香りが混じっているようだが？その匂いに、私の[sabotage_rival.Custom2('InsultAdjective', ROOT.Char)][ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))]、[sabotage_rival.GetTitledFirstName]の得意げな顔が浮かんだ。私を破滅させようとしたのは、間違いなく[sabotage_rival.GetSheHe]だ…"
 study_faith_ongoing.1050.a: "私のノートが…ああ！あれほどの苦労が水の泡だ！"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip]は#EMP 万死#!に値する！"
 study_faith_ongoing.1050.c: "ハッハッハ！私は常に#EMP 予備のノート#!を取っているのだ！"
 study_faith_ongoing.1060.t: "$study_faith$：無知なる解釈"
 study_faith_ongoing.1060.desc: "自身の進歩を試すべく、私は[scheme.GetTargetCharacter.GetFaith.ReligiousText|U]の一節を、[scheme.GetTargetCharacter.GetFaith.GetAdjective]を信仰する私の[ROOT.Char.Custom2('RelationToMeShort', offended_character)]、[offended_character.GetTitledFirstName]に要約して聞かせることにした。#EMP 「…そして[offended_character.GetFaith.PriestNeuter]は[target.Custom('GetAccessory')]を掲げねばならぬ、そうして[target.Custom('FormOfAddressForLiege')]が[target.GetCurrentLocation.Custom('get_region_flower_type')]を摘み取れるよう——」#!\n\n「お前の解釈は支離滅裂だ！それでは我が[offended_character.GetFaith.PriestNeuterPlural]たちが[offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))]者に見えるではないか、それに[offended_character.GetFaith.HighGodName]がまるで[offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]のようではないか！？」\n\nどうやら私はまだ、[scheme.GetTargetCharacter.GetFaith.GetAdjective]の信仰実践における機微の理解が足りないらしい…"
 study_faith_ongoing.1060.a: "私の反省のしるしとして、これを受け取ってほしい。"
 study_faith_ongoing.1060.b: "私は[offended_character.GetFaith.PriestNeuter]の徳を称えるつもりだったのだ！"
 study_faith_ongoing.1060.c: "なんだと！？[offended_character.GetFaith.HighGodName]など#EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]#!存在ではないか！"
 study_faith_ongoing.1060.d: "私はただ[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]への理解を深めたかっただけなのだ！"
 study_faith_ongoing.1060.b.success: "[offended_character.GetHerHim]を騙して、あなたが#EMP [offended_character.GetHerHis][offended_character.GetFaith.PriestNeuterPlural]を褒めた#!ように思わせる"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip]があなたの嘘を見抜く"
 study_faith_ongoing.1060.d.success: "誤解だと納得させる"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip]はあなたを信じない"
 study_faith_ongoing.1070.t: "$study_faith$：下劣な神話"
 study_faith_ongoing.1070.desc: "[target.GetTitledFirstNamePossessive]から贈られた[scheme.GetTargetCharacter.GetFaith.GetAdjective]の神話集が、宮廷を騒然とさせている。多くの者が注目するなか、私はそれを熟読し、特に興味深い一節を朗読する。\n\n初めは、[ROOT.Char.GetFaith.EvilGodNames]が私に下劣な悪戯を仕掛けているのだと思っていた。しかし、ある刺激的な箇所を綿密に調べた結果、これはどうやら官能的な性質の書物に間違いないという結論に至った。\n\n聖典の中で、[scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive]の[ROOT.Char.Custom('ObjectifiedFeature')]について語られることなどあってなるものか！[ROOT.Char.Custom('CulturalCurse')|U]。"
 study_faith_ongoing.1070.a: "衛兵よ、この忌まわしい本を捨てろ！"
 study_faith_ongoing.1070.b: "よくも笑ったな！？#EMP 全員鞭打ちの刑だ。#!"
 study_faith_ongoing.1070.c: "いやいや、これはある意味で#EMP 実際#!勉強になると思う…"
 study_faith_ongoing.1080.t: "$study_faith$：偉大な教師"
 study_faith_ongoing.1080.desc: "私の[ROOT.Char.Custom2('RelationToMeShort', court_tutor)]である[court_tutor.GetFirstName]は、[scheme.GetTargetCharacter.GetFaith.GetName]の機微を理解しようとする私の努力を、飽くことなく支えてくれている。\n\n教育に対する[court_tutor.GetHerHis|U]の献身ぶりには、感銘を受けるばかりだ！[court_tutor.GetSheHe]は常に[scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]の聖典を手元に置いているか、あるいは私の対話相手として、博識な[scheme.GetTargetCharacter.GetFaith.PriestNeuter]を探してきてくれる。\n\nまさに、[court_tutor.GetHerHis]の助けがなければ、私の理解はここまで深まることはなかっただろう。"
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip]は褒美を取らすのにふさわしい！"
 study_faith_ongoing.1080.b: "[court_tutor.GetSheHe|U]はしっかり仕事をしている。"
 study_faith_ongoing.1090.t: "$study_faith$：なんと不可解な！"
 study_faith_ongoing.1090.desc.intro: "[scheme.GetTargetCharacter.GetFaith.GetName]の神学など、到底理解できないものだ！"
 study_faith_ongoing.1090.tenet.desc: "特に、[discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )]の教義については、私にはまるで理解できない。"
 study_faith_ongoing.1090.doctrine.desc: "特に、[discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )]については、私にはまるで理解できない。"
 study_faith_ongoing.1090.desc.main: "\n\n私の頭はもういっぱいだ！1つの概念が頭に入ると、すぐさま別の記憶が忘却の彼方に押しやられてしまう。"
 study_faith_ongoing.1090.friend.desc: "\n\n「頑張れ、私の[ROOT.Char.Custom('ComplimentAdjective')]友人よ、あなたならやれる！」\n\n幸いなことに、[helpful_friend.GetTitledFirstName]がはいつも、こうした馴染みのない教えを紐解く助けになってくれる。私は本当に恵まれている。"
 study_faith_ongoing.1090.no_friend.desc: "\n\n休息が必要なのだろうか？"
 study_faith_ongoing.1090.a: "私はいつでも[helpful_friend.GetFirstNameNoTooltip]に導いてもらえる！"
 study_faith_ongoing.1090.b: "どんなに奇妙に思えようとも、やり抜かねば！"
 study_faith_ongoing.1090.c: "しばらく本を置くだけでいい…"
 study_faith_ongoing.1090.d: "もうダメだ！"
 study_faith_ongoing.1100.t: "$study_faith$：[target.GetFaith.GetAdjectiveNoTooltip]の[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1100.desc: "私が[scheme.GetTargetCharacter.GetFaith.GetName]を熱心に学んでいるという噂が広がっている。\n\n人々は私のことを「[target.GetFaith.GetAdjectiveNoTooltip]の[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]」と呼んでいるが、その呼び名は誤解を招きかねない…"
 study_faith_ongoing.1100.a: "巧みな演説を行えば、我が臣民と[target.GetFaith.GetAdherentNamePluralNoTooltip]の両方をなだめることができるはずだ！"
 study_faith_ongoing.1100.b: "研究は私一人の問題だ。邪魔をするな！"
 study_faith_ongoing.1100.c: "きっと[scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]も感銘を受けるに違いない！"
 study_faith_ongoing.1100.a.success: "あなたは素晴らしい演説を行う"
 study_faith_ongoing.1100.a.success.tt: "[root_scope.GetFaith.GetNameNoTooltip]または[target.GetFaith.GetNameNoTooltip]であるすべての廷臣と客人"
 study_faith_ongoing.1100.a.failure: "あなたは醜態をさらす"
 study_faith_ongoing.1110.t: "$study_faith$：[target.GetFaith.GetAdjectiveNoTooltip]の詩の魅力"
 study_faith_ongoing.1110.desc: "ああ、[poet_location.GetCounty.GetName]の[the_poet.GetFirstName]による『[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U]の[poet_location.Custom('GetTerrainTypePlural')|U]』か。実に見事な[scheme.GetTargetCharacter.GetFaith.GetAdjective]の詩集だ！\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nもしかすると、詩とは信仰を覗き見る窓なのだろうか？"
 study_faith_ongoing.1110.a: "私も[target.GetFaith.GetAdjectiveNoTooltip]の詩を作ってみよう！"
 study_faith_ongoing.1110.b: "私の[ROOT.Char.Custom2('RelationToMeShort', lover_to_be)]である[lover_to_be.GetFirstNameNoTooltip]のために#EMP ロマンチックな#!詩を諳んじるべきだろう。"
 study_faith_ongoing.1110.c: "この詩が持つ宗教的な性質を分析するとしよう。"
 study_faith_ongoing.1110.a.success: "あなたは自分に詩の才能があることに気付く"
 study_faith_ongoing.1110.a.failure: "あなたの詩作は聞くに耐えない"
 study_faith_ongoing.1120.t: "$study_faith$：異端者の噂"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n「[ROOT.Char.GetTitleTierName]ともあろうお方が、異教の寓話などを学んでいるのですか？恥ずかしいとは思わないのですか！」私の[ROOT.Char.Custom2('RelationToMeShort', zealot)]である[zealot.GetTitledFirstName]が叫ぶ。\n\n「もし敵どもがあなたが異端の思想に親しんでいると知れば、あらゆる手を使ってあなたを異端者に仕立て上げようとするでしょう！」\n\nどうやら、私が選んだ[scheme.GetTargetCharacter.GetFaith.GetAdjective]の書物は、[ROOT.Char.Custom('GetCourt')]にいる愚か者や敵対者たちの目には誤解を招くものに映るようだ。"
 study_faith_ongoing.1120.a: "違う！これは…#EMP 尊ぶべき[target.GetFaith.GetAdjectiveNoTooltip]の神学論文なのだ！#!"
 study_faith_ongoing.1120.b: "私が異端だと糾弾するつもりか！？ならば思い知らせてやろう！"
 study_faith_ongoing.1120.c: "そのとおりだ。これらは[ROOT.Char.GetTitleTierName]にふさわしくない。"
 study_faith_ongoing.1120.d: "どう思われようと構うものか。これらの書物は示唆に富んでいるのだから！"
 study_faith_ongoing.1120.a.success: "あなたは[zealot.GetFirstNameNoTooltip]を言いくるめる"
 study_faith_ongoing.1120.a.failure: "あなたが異端の書物を好んでいることが、広く知れ渡る"
 study_faith_ongoing.1120.b.tt: "#V 決闘#!で[zealot.GetFirstName]の無礼な態度に罰を与える。\n#weak この決闘は死で決着をつけるものではない。#!\n勝てば[prestige_i] [prestige|E]と[scheme|E]の[modifier|E]を獲得し、負ければ嘲笑される。\n\nあなたの[prowess|E]：[prowess_i]#V [root_for_loc.GetProwess]#!\n[zealot.GetFirstNamePossessive]の[prowess|E]：[prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "私と[zealot.GetFirstNameNoTooltip]の決闘は無効になった"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "「参りました！どうかお許しを、あなたは決して愚鈍ではありません！どうか命ばかりは！」[zealot.GetTitledFirstName]が叫ぶ。\n\n#EMP この私#!を侮辱するとどうなるか思い知ったか。"
 study_faith_ongoing.1123.a: "聡明なる[ROOT.Char.Custom('GetAnimalType')|U]がかつて言っていた。「目上の者を侮辱するな！」"
 study_faith_ongoing.1123.b: "貴殿はその無礼のために地下牢で朽ち果てるのだ！"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName]が地面に倒れた私のそばに唾を吐く。\n\n「あなたは貧弱で哀れな出来損ないの[ROOT.Char.GetTitleTierName]です。この愚かしい本は私が処分してあげましょう」と[zealot.GetSheHe]は言う。"
 study_faith_ongoing.1124.a: "勉強が遅れてしまった…。"
 study_faith_ongoing.1130.t: "$study_faith$：信仰の喜び"
 study_faith_ongoing.1130.desc: "「ああ、愛しの[ROOT.Char.GetFirstNameNoTooltip]様！私の大好きな[scheme.GetTargetCharacter.GetFaith.GetName]を勉強してくれているのですか？私のことを理解しようと努力してくれるなんて、本当に嬉しい！」[lover_to_help.GetTitledFirstName]はそう言って、[lover_to_help.Custom('quirk_pos_pp')]。\n\n「私にできることなら、#EMP どんな#! ことでも喜んでお手伝いします」"
 study_faith_ongoing.1130.a: "どんな助けでもありがたい！"
 study_faith_ongoing.1130.b: "喜びといえば…最高の方法が一つある。"
 study_faith_ongoing.1130.c: "私は一人で学びたいのだ。"
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip]は思わせぶりだがいい先生だ"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip]は、神学の中でもごく限られた、官能的な要素ばかり取り上げて教えるため、それらが信仰全体とどう整合するのか理解できない"
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip]は色気が過ぎて助けにならない。"
 study_faith_ongoing.1140.t: "$study_faith$：導き手"
 study_faith_ongoing.1140.desc: "「[scheme.GetTargetCharacter.GetFaith.GetName]についての学びを深めるとは感服いたしました。それは必ずや[ROOT.Char.GetTitleTierName]としての地位を強固なものにするでしょう」と、私の[SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))]、[close_one_to_help.GetFirstName]が言った。\n\n「私は生まれた時から[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]の教えに親しんできました。[SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]、よければ何か手伝いましょうか？」"
 study_faith_ongoing.1140.a: "この信条を解説してくれないだろうか？"
 study_faith_ongoing.1140.b: "今から私の研究会に参加しないか？"
 study_faith_ongoing.1200.t: "$study_faith$：異教徒の犬"
 study_faith_ongoing.1200.desc: "私は[scheme.GetTargetCharacter.GetFaith.GetName]の奥義を学ぶべく、要点を整理したメモを保管している。異なる宗派の混沌とした教義を整理するには、まさにこれだけが頼みの綱なのだ。だが、どうしたことか、そのメモがどこかに行ってしまった。\n\nその時、[ROOT.Char.Custom('DogStoryName')]のいつもの湿った鼻先が、私の手にすり寄ってきた。苛立ちから逃れたくて、私は愛犬を見下ろした。\n\n[ROOT.Char.Custom('DogStorySheHe')]は私を見上げ、誇らしげにその尾を振っている。その時ようやく、[ROOT.Char.Custom('DogStorySheHe')]が私のメモをしっかりとくわえていることに気づいた。"
 study_faith_ongoing.1200.a: "仕方がないやつだ！"
 study_faith_ongoing.1200.b: "散歩に行きたいのか？なら、おいで。"
 study_faith_ongoing.1200.c: "それはおもちゃじゃないんだぞ！まったく#EMP 悪い#!子め！"
 study_faith_ongoing.1300.t: "$study_faith$：実践で学ぶ"
 study_faith_ongoing.1300.desc: "[ROOT.Char.GetCurrentLocation.GetTitle.GetName]を通りかかると、地元の人々が[scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]の祭事に興じているようだった。一人の[interlocutor.GetWomanMan]がこちらに歩み寄り、我々が[ROOT.Char.GetFaith.GetAdherentNamePlural]であるにもかかわらず、参加しないかと誘ってくる。\n\n供の者たちは罠ではないかと警戒し、我々の間に割って入ろうとする。\n\nだが危険など知ったことか。[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]について直に学ぶのに、これほどの好機などなかなかあるものではない！"
 study_faith_ongoing.1300.a: "案内してもらおう！"
 study_faith_ongoing.1300.a.flavor: "単なる[scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]の儀式だ。なんの害があるというのだ？"
 study_faith_ongoing.1300.b: "[interlocutor.GetHerHis]の宗派の詳しい教義について議論することこそ、最も実りある学びになるだろう。"
 study_faith_ongoing.1300.b.flavor: "あなたは[interlocutor.GetFirstNameNoTooltip]との友好的な議論を試みる"
 study_faith_ongoing.1300.b.success: "あなたは[interlocutor.GetFirstNameNoTooltip]と興味深い議論をする"
 study_faith_ongoing.1300.b.failure: "あなたは[interlocutor.GetFirstNameNoTooltip]と意思疎通ができない"
 study_faith_ongoing.1300.c: "「我々の[next_destination.GetNameNoTooltip]への旅に加わってくれ！」"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "蛾が星々の真理を知らずとも炎に魅かれるように、魂も神なるものの名を知らずとも、それに身を焦がすものなのだ。"
 holy_text_indeterminate_quote_2: "砂漠の風が暴君の足跡を消した時、砂が記憶していたのは、渇いた者と慈しみ深き者の踏み跡だけであった。"
 holy_text_indeterminate_quote_3: "川は磨くべき石を選ぶことはない。だが、その忍耐強い流れの中で、どの石も王冠にふさわしい宝石に整えられていく。"
 holy_text_indeterminate_quote_4: "知識の泉から水を飲めば、その重みに人は首を垂れるだろう。"
 holy_text_indeterminate_quote_5: "その日、山が身を屈めたのは王にでも軍勢にでもなく、山に問いを投げかけた、一人の子供に対してであった。"
 holy_text_indeterminate_quote_6: "隠れし者がまず語るのは疑念の囁きである。それによって汝が答えを見出したとき、その信仰は汝自身のものとなるのだ。"
 holy_text_indeterminate_quote_7: "祭壇の前で捧げられた嘘は煙となって還るが、誠実な涙は天の庭に種となって落ちる。"
 holy_text_indeterminate_quote_8: "行く手を覆う闇を呪ってはならない。それは、汝自身の炎が燃え続ける勇気を学ぶためにあるのだから。"
 holy_text_indeterminate_quote_9: "輝ける者が数えるのは傲慢な者が捧げる祈りではなく、誰の目も留まらぬところで密かに行われた慈悲のみである。"
 holy_text_indeterminate_quote_10: "世界が「我がもの」と「汝のもの」に分かたれたとき、神はただお笑いになった。神の瞳に映るのは、ただ「我々のもの」だったからだ。"
