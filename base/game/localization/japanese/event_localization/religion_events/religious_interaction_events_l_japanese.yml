l_japanese:
 religious_interaction.1.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.desc: "祈りと審議を重ねた結果、あなたの[secondary_recipient.GetWifeHusband]、[secondary_recipient.GetFirstNameNoTooltip]との離婚を"
 religious_interaction.1.consanguinity: "近親婚であるとの理由から認めることを決定しました。"
 religious_interaction.1.fallback: "不倫の疑いがあるとの理由から認めることを決定しました。"
 religious_interaction.1.adultery: "不倫を理由として認めることを決定しました。"
 religious_interaction.1.different_faith: "[secondary_recipient.GetHerHim]が敵対宗派を信仰しているとの理由から認めることを決定しました。"
 religious_interaction.1.eunuch: "[secondary_recipient.GetHerHim]が[secondary_recipient.GetWomanMan]としての資質を欠いているとの理由から認めることを決定しました。"
 religious_interaction.1.a: "申し訳ない、[secondary_recipient.GetFirstNameNoTooltip]。"
 religious_interaction.1.price_feud: "\n\nですが、これでは二人の仲を引き裂くには不十分だと思われませんか？そこで、あなたに代わり、[secondary_recipient.GetFirstName]に対する卑劣な告発を[secondary_recipient.GetHouse.GetName]家の者全員にお送りしておきました。\n\nあなたの[actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))]の一族は、今や…#EMP 永久的な#!離別に関心を示しているようです。"
 religious_interaction.1.price_lease: "\n\nこの虚偽の宣言には代償が伴います。それは[barony_to_lease.GetName]の[lease_order.GetName]への貸与です。そして、あなたが[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]を遠ざけたように、この信仰のしもべたちをも遠ざけるならば…あなたの魂は二重に穢されることになるでしょう。"
 religious_interaction.1.price_hook: "\n\nこの疑わしい宣言によって、[recipient.GetTitleAsName]があなたにどれほどの便宜を図ったかをよく考えてみてください。そして、与えることは受け取ることと同等に尊いということも。"
 religious_interaction.1.price_vows: "\n\nこれらは薄弱な根拠にすぎません…だからこそ私は証拠を用意しました。すなわち、[secondary_recipient.GetFirstNameNoTooltip]があなたの[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]となる前に、[joining_order_title.GetAdjective]の修道士としての誓いを立てていたという証拠です。\n\n[secondary_recipient.GetHerHis]が生涯信仰を貫くよう、私が責任を持って見届けましょう。"
 religious_interaction.1.price_none: "\n\nもちろん、これは茶番劇——私の魂を穢す下劣な取引です。ですが、良心に照らして、これ以上[secondary_recipient.GetFirstNameNoTooltip]と夫婦の寝床を共にするようあなたに強いることはできません。"
 religious_interaction.1.a_feud: "この邪悪な[recipient.GetFaith.PriestNeuter]め！一体何をしてくれたのだ！？"
 religious_interaction.1.a_hook: "[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]からの束縛は解かれた…そしてその代わりに[recipient.GetTitleAsNameNoTooltip]という重荷を背負わされた。"
 religious_interaction.6.price_feud: "\n\nですが、これでは二人の仲を引き裂くには不十分だと思われませんか？そこで、[actor.GetFirstNamePossessiveNoTooltip]に代わり、[secondary_recipient.GetFirstName]に対する卑劣な告発を[secondary_recipient.GetHouse.GetName]家の者全員にお送りしておきました。\n\n[actor.GetHerHis|U]の[actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))]の一族は、今や…#EMP 永久的な#!離別に関心を示しているようです。"
 religious_interaction.6.price_lease: "\n\nこの虚偽の宣言には代償が伴います。それは[barony_to_lease.GetName]の[lease_order.GetName]への貸与です。そして、[secondary_recipient.GetFirstNameNoTooltip]が[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]を遠ざけたように、この信仰のしもべたちをも遠ざけるならば…[actor.GetHerHis]の魂は二重に穢されることになるでしょう。"
 religious_interaction.6.price_hook: "\n\nこの疑わしい宣言によって、[recipient.GetTitleAsName]があなたにどれほどの便宜を図ったかをよく考えてみてください。そして、与えることは受け取ることと同等に尊いということも。"
 religious_interaction.6.price_vows: "\n\nこれらは薄弱な根拠にすぎません…だからこそ私は証拠を用意しました。すなわち、[actor.GetFirstNamePossessiveNoTooltip]の[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]となる前に、[secondary_recipient.GetFirstNameNoTooltip]が[joining_order_title.GetAdjective]の修道士としての誓いを立てていたという証拠です。\n\n[secondary_recipient.GetHerHis]が生涯信仰を貫くよう、私が責任を持って見届けましょう。"
 religious_interaction.6.price_none: "\n\nもちろん、これは茶番劇——私の魂を穢す下劣な取引です。ですが、良心に照らして、これ以上[secondary_recipient.GetFirstNameNoTooltip]と夫婦の寝床を共にするよう[actor.GetFirstNameNoTooltip]に強いることはできません。"
 religious_interaction.2.desc: "審議を重ねた結果、家系の最善の利益のために、あなたの[secondary_recipient.GetWifeHusband]、[secondary_recipient.GetFirstNameNoTooltip]との離婚を、"
 religious_interaction.2.infertility: "相手が婚姻を完全なものとすることを拒否しているとの理由から認めることを決定しました。"
 religious_interaction.2.adultery: "他人と寝たことで婚姻の尊厳を冒したとの理由から認めることを決定しました。"
 religious_interaction.3.desc_subordinate: "地上における[actor.GetFaith.HighGodNamePossessive]の全代理人を代表し、あなたの願いを認めましょう。"
 religious_interaction.3.desc: "あなたの窮状を考慮し、申請を認めることを決定しました。"
 religious_interaction.3.defensive_war: "どうかこの資金が、[war_target.GetTitledFirstName]と侵略を企むその[war_target.GetFaith.GetAdjective]軍勢から信仰を守る助けとなりますよう！"
 religious_interaction.2.offensive_war: "どうかこの資金が、[war_target.GetTitledFirstName]との戦いで勝利をもたらす助けとなりますよう！"
 religious_interaction.3.fallback: "どうかこの資金が、あなたの領地で真の信仰を広める助けとなりますよう！"
 religious_interaction.3.a: "[ROOT.Char.GetFaith.WealthGodName]を称えよ、税金の還付が手に入るぞ！"
 religious_interaction.3.b: "この資金が私に勝利をもたらす！"
 religious_interaction.3.c: "この資金は慎重に使おう。"
 religious_interaction.3.d: "この金は枯渇していた財源の大きな足しになる！"
 religious_interaction.32.desc: "あなたの申請を考慮し、却下することを決定しました。"
 religious_interaction.32.a: "そんな！"
 religious_interaction.4.desc: "あなたの要求を熟慮した結果、あなたの[target.GetName]の請求権を認めることを決定しました。"
 religious_interaction.4.child: "[secondary_recipient.GetTitledFirstName]はまだ子供であるため、あなたには介入する権利があります。"
 religious_interaction.4.they_are_female: "[secondary_recipient.GetTitledFirstName]は女性であるため、あなたには介入する権利があります。"
 religious_interaction.4.they_are_male: "[secondary_recipient.GetTitledFirstName]は男性であるため、あなたには介入する権利があります。"
 religious_interaction.4.fallback: "あなたの祖先が、確かに古代においてこの所領を統治していたという動かぬ証拠が明らかになりました。"
 religious_interaction.4.a: "私が統治者に相応しいことを証明する！"
 religious_interaction.42.desc: "[target.GetName]の請求権を求めるあなたの申請を考慮し、却下することを決めました。"
 religious_interaction.42.a: "くそっ！"
 religious_interaction.5.child: "あなたが未成年であることは、"
 religious_interaction.5.they_are_female: "あなたが女性であることは、"
 religious_interaction.5.they_are_male: "あなたが男性であることは、"
 religious_interaction.5.fallback: "あなたが明らかに信心に欠けていることは、"
 religious_interaction.5.outro: "教会にとって大きな懸念となるため、"
 religious_interaction.5.outro_different_recipient: "[actor.GetName]の要求どおり、[target.GetName]の請求権を認めました。"
 religious_interaction.5.self: "当然の権利として[target.GetName]の請求権を主張することを決めました。"
 religious_interaction.5.a: "これは茶番だ！"
 religious_interaction.6.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.desc: "祈りと審議を重ねた結果、[secondary_actor.GetFirstNameNoTooltip]と[secondary_recipient.GetFirstNameNoTooltip]の離婚を"
 religious_interaction.6.consanguinity: "近親婚であるとの理由から認めることを決定しました。"
 religious_interaction.6.fallback: "不倫の疑いがあるとの理由から認めることを決定しました。"
 religious_interaction.6.adultery: "不倫を理由として認めることを決定しました。"
 religious_interaction.6.different_faith: "[secondary_recipient.GetHerHim]が敵対宗派を信仰しているとの理由から認めることを決定しました。"
 religious_interaction.6.eunuch: "[secondary_recipient.GetHerHim]が[actor.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]としての資質を欠いているとの理由から認めることを決定しました。"
 religious_interaction.6.a: "[actor.GetFirstNameNoTooltip]と[secondary_recipient.GetFirstNameNoTooltip]の仲はもはや終わりだ。"
 religious_interaction.1001.t.fatwa: "ファトワー発令！"
 religious_interaction.1001.t: "法的な非難！"
 religious_interaction.1001.desc: "我が[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]、[actor.GetTitledFirstName]に、[actor.GetHerHis]の[actor.GetFaith.PriestNeuterPlural]による令状で、私が罪人として非難されているのを見られてしまった！\n\nこれは私が[recipient.GetFaith.GetAdjective]所領を統治するのに相応しくないという主張の法的根拠として利用されてしまうかもしれない。"
 religious_interaction.1001.a: "[actor.GetSheHe]が我が主君でなかったら…"
 religious_interaction.1001.a.revoke_tt: "[actor.GetTitledFirstName]は私の称号の一つを[revoke|E]できる"
 #Religious Head of Faith Interactions
 religious_interaction.1010_subordinate: "[actor.GetFaith.GetAdjective]の最も神聖なる御耳、[actor.GetFaith.GetAdjective]の最も聖なる御心へと通じる仲介者として、私はあなたに罪の重荷からの赦しを授けましょう。\n\nあなたの寛大なる寄付により、赦しがもたらされたのです。"
 religious_interaction.1010: "罪を償おうとするその姿勢は称賛に値します。あなたの寛大な寄付を受け取り、お返しに私の祝福を送りましょう。"
 religious_interaction.1011: "あなたの罪は金だけでは償いきれないほど、あまりに深刻です。真に罪を償うことを願っているのならば、生き方を変え、心から許しを求めていることを証明する必要があります。それまで、あなたの寄付は受け取りません。"
 religious_interaction.excommunication.opening: "[excommunication_issuer.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1020: "あなたの悪行について[actor.GetTitledFirstName]から不穏な知らせを聞きました。"
 religious_interaction.1020.requested: "あなたの悪行について[actor.GetTitledFirstName]から不穏な報告を耳にしました。[actor.GetHerHis]の強い要請により、私はあなたを[recipient.GetFaith.GetAdjective]信仰から破門しました。\n\nあなたの魂に[recipient.GetFaith.HighGodName]の慈悲がありますように。"
 religious_interaction.1020.sin: "[actor.GetTitledFirstName]からの不穏な報告は、あなたの[my_sinful_trait.GetName( ROOT.Char )]の本性を物語っています。[actor.GetHerHis]の強い要請により、私はあなたを[recipient.GetFaith.GetAdjective]信仰から破門しました。\n\nあなたの魂に[recipient.GetFaith.HighGodName]の慈悲がありますように。"
 religious_interaction.1020.empire: "帝国支配を求めるあなたの主張は、[recipient.GetFaith.GetAdjective]信仰を分裂させました。[actor.GetTitledFirstNamePossessive]の強い要請により、私はあなたを破門しました。"
 religious_interaction.1020.a.tt_petition: "#help [piety|E]を獲得します。1年後、[head_of_faith|E]に直接嘆願し、#high $petition_head_of_faith_decision_option_repentance$#!を選択します。[Concept( 'excommunicated_recovery', '破門からの復帰方法' )|E]を参照してください。#!"
 religious_interaction.1020.a.tt_declaration: "#help [piety|E]を獲得します。1年後、有効な聖職者に対して#high $declaration_of_repentance_interaction$#!を使用します。[Concept( 'excommunicated_recovery', '破門からの復帰方法' )|E]を参照してください。#!"
 religious_interaction.1020.a: "罪を償い、赦しを求めよう。"
 religious_interaction.1020.b: "[actor.GetFirstNameNoTooltip]を呪ってやる！"
 religious_interaction.1020.b.tt: "#help [stress|E]が減少します。[actor.GetShortUIName]との関係が[rivalry|E]に近づきます。#!"
 religious_interaction.1020.c: "[actor.GetHerHim]に耳を貸した[recipient.GetTitleAsNameNoTooltip]を呪ってやる！"
 religious_interaction.1020.c.tt: "#help [stress|E]が減少します。[recipient.GetShortUIName]との関係が[rivalry|E]へと近づきます。[GetTrait('cynical').GetName( GetNullCharacter )]、[GetTrait('wrathful').GetName( GetNullCharacter )]、および[GetTrait('arbitrary').GetName( GetNullCharacter )]の[courtiers|E]が賛同します。#!"
 religious_interaction.1021.generic: "我らは皆、罪の中に生まれし者ゆえ、過ちを犯すこともあります。しかし嘆かわしいことに、あなたには、キリストの道を歩もうとする気配すらうかがえません。"
 religious_interaction.1021.empire: "この終末の世において、あなたはキリスト教世界の安寧よりも自らの野心を優先させました。帝国支配を求めるあなたの主張は、教会の体を蝕む毒腫にほかなりません！"
 religious_interaction.1021.clergy_hostility: "我々の敵対関係は公然の事実です。しかし私があなたを追放するのは、あなたが罪を愛し、教えに逆らうからにほかなりません。"
 religious_interaction.1021.sin: "あなたの[my_sinful_trait.GetName( ROOT.Char )]という本性は誰もが知るところです。あなたの行いによって、信徒たちが道を踏み外すのを許すわけにはいきません。"
 religious_interaction.1021.conclusion: "\n\nあなたを[actor.GetFaith.GetAdjective]信仰から破門します。あなたの魂に[actor.GetFaith.HighGodName]の慈悲があらんことを。"
 religious_interaction.1021.a: "教会の裁きに従おう。"
 religious_interaction.1021.b: "我が冠は[actor.GetTitleAsNameNoTooltip]からではなく、[recipient.GetFaith.HighGodName]より授かりしものだ！"
 religious_interaction.1021.b.tt: "#help [stress|E]が減少します。[actor.GetShortUIName]との関係が[rivalry|E]へと近づきます。[GetTrait('cynical').GetName( GetNullCharacter )]、[GetTrait('wrathful').GetName( GetNullCharacter )]、および[GetTrait('arbitrary').GetName( GetNullCharacter )]の[courtiers|E]が賛同します。#!"
 religious_interaction.1022: "あなたの語る[secondary_recipient.GetTitledFirstNamePossessive]の悪行は実に不安なものです。心苦しいですが、[secondary_recipient.GetSheHe]を破門とするのが[actor.GetFaith.GetAdjective]信仰のためであると同意します。"
 religious_interaction.1022.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]の破門の要請を承認した"
 religious_interaction.1023: "[actor.GetFaith.GetAdherentName]を破門にしようとするとは、どういうつもりですか？[actor.GetFaith.GetAdjective]信仰は政治的利益のための道具ではありません！そのような要求をしたことで、自身が破門されなかったことを幸運に思うべきです。 "
 religious_interaction.1023.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]の破門の要請を拒否した"
 religious_interaction.1024: "真に罪を悔い改め、自身を償うために努力を重ねたのですね。あなたの[actor.GetFaith.GetAdjective]信仰に対する罪は実に嘆かわしいものでしたが、最近のあなたの行動を見て、もう一度機会を与えるに相応しいと感じました。\n\nこれを考慮し、ここにあなたの破門を解き、[actor.GetFaith.GetAdjective]信仰へ再び歓迎します。"
 religious_interaction.1024.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]の破門を解除した"
 religious_interaction.1025: "私が軽々しく人を破門にすると思っているのですか？誠意のない謝罪が償いをするのに十分だとでも？好きに言い訳をしなさい。その悪しき考えを変えたことを証明するまで、あなたが[actor.GetFaith.GetAdjective]信仰に戻ることは許しません。"
 religious_interaction.1025.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]の破門の解除を拒否した"
 religious_interaction.1030: "熟慮した結果、あなたの言葉は正直で賢明であると判断しました。私は修道会に入り、一人で[actor.GetFaith.HighGodName]に仕える新たな人生を歩み始めます。"
 religious_interaction.1031: "聖なる誓願を立てるよう勧めてくださったこと、光栄に存じます。しかし、[recipient.GetFaith.HighGodName|U]は私に、修道院の外で果たすべき務めをお与えになっているようです。我が魂と良心は、その誓いの言葉を口にすることを許しません。"
 religious_interaction.1031.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの修道誓願の要請を拒否した"
 religious_interaction.1000.positive: "[recipient.GetFirstNameNoTooltip]が私の要求を正しいと思ったのは喜ばしい。"
 religious_interaction.1000.negative: "非常に残念だ…"
 religious_interaction.1000.strong_negative: "くそっ！"
 religious_interaction.1024.positive: "[recipient.GetFirstNameNoTooltip]がこの行動を正しいと思ったのは喜ばしい。"
 religious_interaction.2002.desc: "私はあなたとともに光へ向かうべく、[ROOT.Char.GetFaith.GetName]に改宗することにしました！"
 religious_interaction.2002.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの改宗の要求を受け入れた"
 religious_interaction.2002.a: "[ROOT.Char.GetFaith.HighGodName]に祝福を！"
 religious_interaction.2003.desc: "あなたの世俗的な言葉で私の強い信心が揺らぐことはありません。私はむしろ[recipient.GetFaith.DivineRealm]で報われることを望みます。"
 religious_interaction.2003.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの改宗の要求を拒否した"
 religious_interaction.2003.hooking_out: "\n\nそれに、あなたは私に借りがありますし、単に真の信者であるという理由で私を追うのはやめるべきです。"
 religious_interaction.2003.a: "私はあなたの救済を望んだだけだ。"
 religious_interaction.2003.b: "ならばこの世界で代償を払うことになる！"
 religious_interaction.2003.c: "このままで済むとは思わないことだ！"
 religious_interaction.2003.d: "私の言うことをそのまま信じることになるだろう。"
 religious_interaction.2011.desc: "あなたとともに喜びたいところではありますが、[recipient.GetFaith.HouseOfWorshipPlural]を改装し、農民を改宗させる費用のことを思うと…\n\nもしあなたが支払いを補助してくださいましたら、私は喜んで[ROOT.Char.GetFaith.HighGodName]に祈ります。"
 religious_interaction.2011.toast_puppeteer: "[recipient.GetShortUIName]は、金での支払いがない限り応じないとして[puppet_or_actor.GetShortUINamePossessive]からの改宗の要求を拒否した"
 religious_interaction.2011.a: "信仰のためならば何でもしよう。"
 religious_interaction.2011.b: "お前の永遠の救いのために支払う金はない！"
 religious_interaction.2011.c: "お前は金よりも価値あるもののためにそうすべきだ。"
 religious_interaction.2012.desc: "あなたの信仰の知恵は理解しましたが、闇から光への道がどれほど長く険しいかをあなたに理解していただきたく思っています。\n\n私に必要な支援を提供してくだされば、旅はより容易になるでしょう。"
 religious_interaction.2012.toast_puppeteer: "[recipient.GetShortUIName]は、便宜を与えられない限り応じないとして[puppet_or_actor.GetShortUINamePossessive]からの改宗の要求を拒否した"
 religious_interaction.2012.a: "あらゆる地にいる信徒のために容認しよう。"
 religious_interaction.2012.b: "お前の魂のために取引はしない！"
 religious_interaction.2012.c: "先に返すべき借りがあるだろう。"
 religious_interaction.2015.desc: "[actor.GetRite.GetName]は明らかにあなたに力をもたらしました。[actor.GetFaith.HighGodName]から得ているその力の源を、ぜひより深く理解したいと考えています。"
 religious_interaction.2015.toast_puppeteer: "[recipient.GetShortUIName]は、信仰について研究するため、[puppet_or_actor.GetShortUIName]に待つよう求めた"
 religious_interaction.2015.a: "[actor.GetFaith.GoodGodNames]の教えを授けよう。"
 religious_interaction.2015.b: "今日、あなたは[actor.GetFaith.GoodGodNames]に頭を垂れることになるだろう！"
 religious_interaction.2015.c: "おそらく実践を通して学ぶのが一番だろう。"
 religious_interaction.2016.desc: "要望通り、私が厳しく見守るなかで、[actor.GetFaith.GoodGodNames]の教えを学ぶといい。"
 religious_interaction.2016.a: "さあ始めよう。"
 religious_interaction.2016.a.tt: "[actor.GetShortUINameNoTooltip]を対象に[GetScheme('study_faith').GetTypeName]を開始する。"
 religious_interaction.2021.opening: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2021.desc: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]\n我が[puppet_or_actor.Custom2('RelationToMe', SCOPE.sC('recipient'))]よ、今こそ私とともに光へと歩む時だ。私に対するすべての負い目を鑑み、[puppet_or_actor.GetFaith.GetName]に改宗するよう要求する！"
 religious_interaction.2021.a: "…分かりました、我が[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('puppet_or_actor'))]。"
 #######################################################
 ### Sun Trial by Mathilda Bjarnehed & Nick Meredith ###
 #######################################################
 #I have been left in the sun to die!
 religious_interaction.2100.t: "[imprisoner.GetFaith.HighGodNamePossessive|U]の審判"
 religious_interaction.2100.desc: "どれほど長い間、暗い独房で過ごしていたのだろう。強い日の光に目がくらむ。私を[imprisoner.Custom('FortifiedBuilding')]の中から荒野へと護衛する衛兵は驚くほど厳粛で、儀式的とも言える。\n\n"
 religious_interaction.2100.descwaterlogged: "太陽が明るく照らす中、私が立っている湿地の地面が足元でぐしゃぐしゃと音を立てる。やがて、私の監禁者[imprisoner.GetTitledFirstName]が得意げに、しかしやや慎重にぬかるんだ芝生を歩いて近づいてくるのが見える。その後ろに数人の[imprisoner.Custom('DefaultPriestTitlePlural')]が続いている。\n\n"
 religious_interaction.2100.descpleasant: "太陽が明るく照らす中、私が立っている地面は豊かで生き生きとした様子を見せている。やがて、私の監禁者 [imprisoner.GetTitledFirstName]が不安な様子で近づいてくるのが見える。その後ろには数人の [imprisoner.Custom('DefaultPriestTitlePlural')] が続いている。\n\n"
 religious_interaction.2100.descforest: "太陽が明るく輝き、木々の間からまだら模様の光が降り注いでいる。やがて、茂みをかき分けながら前進する私の監禁者の[imprisoner.GetTitledFirstName]の姿が見えてきた。その背後には数人の[imprisoner.Custom('DefaultPriestTitlePlural')]が続きいている\n\n"
 religious_interaction.2100.descoasis: "太陽が砂漠に照りつけ、オアシスの水面に眩しい光がきらめいている。やがて、私の監禁者の[imprisoner.GetTitledFirstName]が水しぶきを上げながら進んでくるのが見え、その背後には数人の[imprisoner.Custom('DefaultPriestTitlePlural')]が続いている。\n\n"
 religious_interaction.2100.deschostile: "両脇を数十人の[imprisoner.Custom('DefaultPriestTitlePlural')]に守られた[imprisoner.GetTitledFirstName]の姿を見て、この移動が何を意味しているのかを理解した。\n\n「[ROOT.Char.GetFullNameNoTooltip]。お前をこの磔柱に縛り、ここに置く。[imprisoner.GetFaith.HighGodName]がその運命を決定するだろう。お前が無罪ならば生きるだろう。だが有罪ならば、ここで死ぬ」"
 religious_interaction.2100.middledefault: "「お前の罪は、全能の[imprisoner.GetFaith.HighGodName|U]によって裁かれるであろう。」と[imprisoner.GetSheHe|U]が轟く。衛兵たちは前に進み、私の手足を杭に縛り付ける。[imprisoner.Custom('DefaultPriestTitlePlural')]は腕を広げ、哀歌を歌い始める。そして、一行は退いていく。私は一人きりで、渇き死ぬ運命を待つのみだ。"
 religious_interaction.2100.middleoasis: "「お前の罪は、全能の[imprisoner.GetFaith.HighGodName|U]によって裁かれるであろう。」と[imprisoner.GetSheHe|U]が轟く。衛兵たちは前に進み、私の手足をオアシスの水中にある胸の高さの杭に縛り付ける。[imprisoner.Custom('DefaultPriestTitlePlural')]は腕を広げ、哀歌を歌い始める。そして、一行は退いていく。私は一人きりで、渇き死ぬ運命を待つのみだ。"
 religious_interaction.2100.endwaterlogged: "\n\n水浸しの周囲を見渡す。"
 religious_interaction.2100.endpleasant: "\n\n心地よい周囲を見渡す。"
 religious_interaction.2100.endforest: "\n\n緑豊かな周囲を見渡す。"
 religious_interaction.2100.endoasis: "\n\n水面を見下ろす。"
 religious_interaction.2100.a.believer: "[imprisoner.GetFaith.HighGodName|U]は私に公正な審判を下すだろう！"
 religious_interaction.2100.a.unbeliever: "ここに私を#EMP 置いていく#! のか！？"
 religious_interaction.2100.a.confused: "えっと…"
 religious_interaction.2100.a.success: "試練を生き延びる"
 religious_interaction.2100.a.failure: "太陽の下で死ぬ"
 #I have survived!
 religious_interaction.2101.t: "[imprisoner.GetFaith.HighGodNamePossessive|U]の慈悲"
 religious_interaction.2101.start.desc: "水、水が欲しい！ 喉が、頭が、肌が… 何もかも燃えそうだ！\n\n[ROOT.Char.GetFaith.DevilName]は本当にここに来て、惨めな私をただあざ笑ったのか？ [ROOT.Char.GetFaith.WaterGodName]は私に水筒を与えたのか？どれほど飲もうと、渇きは癒えなかった。"
 religious_interaction.2101.end.desc: "\n\n[imprisoner.GetTitledFirstName]が戻り、私の唇に水筒を押し当てると、霧がかった意識がはっきりとした。私が生きていたことに[imprisoner.GetTitleAsNameNoTooltip]は少し残念そうにしたが、神は意志を示したのだ。"
 religious_interaction.2101.desc.pleasant: "外に縛られた日々も、ほとんど#EMP 楽しんでいた#!。鳥たちはさえずり、太陽が肌を温め、雨のしぶきが私を潤し、渇きを癒してくれたのだ。\n\n[imprisoner.GetTitledFirstName]が戻ってくると、[imprisoner.GetSheHe]は私の元気さと晴れやかな気分に明らかに苛立っているが、[imprisoner.GetSheHe]が定めた条件から逃れることはできない。神がその意志を示したのだ！"
 religious_interaction.2101.desc.oasis: "オアシスの冷たい水の中に吊るされた日々さえ、ほとんど#EMP 楽しんでいた#!。激しく照りつける太陽の下でも、縄は十分に緩んでおり、身を屈めてオアシスの水をたっぷりと飲むことができるのだ。\n\n[imprisoner.GetTitledFirstName]が戻ると、[imprisoner.GetSheHe]は私の健康に明らかに苛立っているが、[imprisoner.GetSheHe]が定めた条件から逃れることはできない。神がその意志を示したのだ！"
 religious_interaction.2101.a: "私は無罪だ！"
 #They survived...
 religious_interaction.2102.desc: "[prisoner.GetTitledFirstNamePossessive]の試練の最終日前夜、[prisoner.GetHerHim]は意識を失っていたが、まだ息はあった。\n\n「奇跡だ！」[ROOT.Char.Custom('DefaultPriestTitle')]は両手を天に挙げながら宣言した。「[ROOT.Char.GetFaith.HighGodName|U]は審判を下された！この[prisoner.GetWomanMan]は無罪だ！」"
 religious_interaction.2102.oasis: "私がオアシスの水をかき分けながら[prisoner.GetTitledFirstName]に近づくと、[prisoner.GetSheHe]は杭に縛られたまま意識があるだけでなく、健康そのものだった。\n\n「奇跡だ！」と[ROOT.Char.Custom('DefaultPriestTitle')]が両手を天に向けて叫ぶ。「[ROOT.Char.GetFaith.HighGodName|U]は審判を下された！[prisoner.GetWomanMan]は無罪だ！」\n\n私は歯ぎしりしながら、[ROOT.Char.Custom('DefaultPriestTitlePlural')]が[prisoner.GetFirstNameNoTooltip]の縄を解くのを見守る。なぜ私たちは[prisoner.GetSheHe]を#EMP ここ#!に置いておかなければならなかったのか？！"
 religious_interaction.2102.pleasant: "私がオアシスの水をかき分けながら[prisoner.GetTitledFirstName]に近づくと、[prisoner.GetSheHe]は杭に縛られているにもかかわらず、まるで#EMP 笑みを浮かべている#!かのようだった。\n\n「奇跡だ！」と[ROOT.Char.Custom('DefaultPriestTitle')]が両手を天に向けて叫ぶ。「[ROOT.Char.GetFaith.HighGodName|U]は審判を下された！[prisoner.GetWomanMan]は無罪だ！」\n\n私は歯ぎしりしながら、[ROOT.Char.Custom('DefaultPriestTitlePlural')]が[prisoner.GetFirstNameNoTooltip]の縄を解くのを見守る。なぜ私たちは[prisoner.GetSheHe]を#EMP ここ#!に置いておかなければならなかったのか？！"
 religious_interaction.2102.a: "[ROOT.Char.GetFaith.HighGodNamePossessive|U]の意志だ。"
 religious_interaction.2102.b: "私からすれば、死んでいるように見えるが…"
 religious_interaction.2102.b.tt: "[ROOT.Char.GetFaith.HighGodName|U]が正しいとは#EMP 限らない#! ！"
 religious_interaction.2102.b.success: "あなたが干渉したことが気づかれない"
 religious_interaction.2102.b.failure: "あなたが殺人者であると暴かれる"
 #I have died...
 religious_interaction.2103.t: "[imprisoner.GetFaith.HighGodNamePossessive|U]の怒り"
 religious_interaction.2103.end.desc: "\n\n[ROOT.Char.GetFaith.HighGodHerHis|U]の意志であるのならば、これは私に相応しいのかもしれない。私は… 邪悪なのかもしれない。"
 religious_interaction.2103.desc.pleasant: "私はなんと自信過剰で、愚かだったのだろう。このように長時間、無防備に晒されていると、どんな[ROOT.Char.GetWomanMan]も打ちのめされることになると、今になって気づいた。昼は容赦なく太陽が照りつけ、夜は風が吠えるように私を叩きつけ、空には恐ろしいほど無慈悲に雲ひとつないままだ。\n\n水、水。自然の抱擁の中に囲まれているのに、一滴も口にできない。絶望に打ちひしがれる。"
 religious_interaction.2103.desc.waterlogged: "風が叩きつけ、太陽が肌を焼きつけるように照りつける中、それでもこの地域を潤す雨雲からの絶え間ない水の流入でわずかなリフレッシュを得ていた。私は空を見上げて微笑む。\n\nその瞬間、突然世界が揺れ始める。最初はかすかだった揺れが、次第に速く、そして激しくなっていく。数秒後、自分の杭がバランスを崩し、目の前の池に倒れ込んでいくことに気づく！\n\n水にぶつかり、必死にもがくが、全く効果がない。手足は縛られ、丸太の重みでさらに浅瀬の底へと押し込まれていく。叫びたいが、声は出ず、口内に水が押し寄せて空虚を満たしていく。"
 religious_interaction.2103.desc.oasis: "試練に臨む中、激しい太陽が私の肌を照りつける。オアシスの水の中に立ち尽くし、胸に水が寄せてくることで、少なくともリフレッシュされている。\n\n突然、世界が揺れ始める。最初は気づかないだったが、そして次第に速くなっていく。杭の下にある柔らかい砂が沈んでいることにすぐに気づけずに、私は目の前のオアシスに真っ直ぐ倒れ込んで行く！\n\n水に衝突した瞬間、必死にもがいて逃げようとするが、無駄だ。私の手足はすべて縛られており、丸太の重さが私を水の奥深くに押し込む。叫ぶが声は出ず、水が口の中に押し寄せて空虚を満たしていく。"
 religious_interaction.2103.a: "つ… 疲れた…"
 religious_interaction.2103.b: "#DIE1 ブ…#!#DIE2 ブク…#!"
 #They died!
 religious_interaction.2104.desc: "[prisoner.GetTitledFirstNamePossessive]の試練の最終日前夜、[prisoner.GetSheHe]は私たちが近づいても微動だにしない。少し開いた唇に使用人が水筒を押し当てたが、[prisoner.GetHerHis]は反応せず、水はただ顎を伝って流れていく。\n\n「[ROOT.Char.GetFaith.HighGodName|U]は審判を下された！」[ROOT.Char.Custom('DefaultPriestTitle')]は両手を天に挙げながら宣言した。「この[prisoner.GetWomanMan]は無罪だ！」"
 religious_interaction.2104.desc.drowned: "私たちが[prisoner.GetTitledFirstName]を杭に縛りつけていた場所に近づくと、すぐに異変に気づく。[prisoner.GetHerHis|U]の杭はおそらく前に倒れ、そのままそばにあった水たまりに落ちていた。[prisoner.GetHerHis]の手足に巻かれた縄はしっかりと締まっており、丸太の重みが[prisoner.GetHerHim]にのしかかっているため、[prisoner.GetSheHe]はどうすることもできなかった。\n\n「[ROOT.Char.GetFaith.HighGodName|U]は審判を下された！」と[ROOT.Char.Custom('DefaultPriestTitle')]が天に向かって両手を挙げて宣言する。「[prisoner.GetWomanMan]は有罪だ！」"
 religious_interaction.2104.desc.oasisdrowned: "私たちが[prisoner.GetTitledFirstName]を杭に縛りつけていた場所に近づくと、すぐに異変に気づく。[prisoner.GetHerHis|U]の杭はおそらく前に倒れ、そのまま近くのオアシスに倒れ込んでいた。[prisoner.GetHerHis]の手足に巻かれた縄はしっかりと締まっており、丸太の重みが[prisoner.GetHerHim]にのしかかっているため、[prisoner.GetSheHe]はどうすることもできなかった。\n\n「[ROOT.Char.GetFaith.HighGodName|U]は審判を下された！」と[ROOT.Char.Custom('DefaultPriestTitle')]が天に向かって両手を挙げて宣言する。「[prisoner.GetWomanMan]は有罪だ！」"
 religious_interaction.2104.b.drowned: "まあ、それが一つの見方かもしれない…"
 ##############################################
 ### Literalist Debate by Ewan Cowhig Croft ###
 ##############################################
 religious_interaction.2400.t: "大討論"
 religious_interaction.2400.desc: "小姓が震えながら[puppet_or_actor.GetTitledFirstNamePossessive]の怒りの手紙を読み上げる。私たちが共有する信仰の美徳と悪徳について公開討論を求め、さらに私が[recipient.GetFaith.GetNameNoTooltip]の基本的な信条を守っているのか疑問を呈しているのだ。\n\n小姓は言葉に詰まりながら読み進める。手紙の文面から、[puppet_or_actor.GetShortUINamePossessiveNoTooltip]が私の信仰心をどう評価しているかは明白だ。"
 religious_interaction.2400.a: "あの野良犬め！受けて立つ！"
 religious_interaction.2400.a.tt_success: "公開討論で[puppet_or_actor.GetShortUINameNoTooltip]は恥をかいた"
 religious_interaction.2400.a.tt_fail: "[puppet_or_actor.GetShortUINameNoTooltip]は私の信仰心に疑問を投げかけることに成功した"
 religious_interaction.2400.b: "このような茶番で[recipient.GetFaith.HighGodNamePossessive]の名を汚すようなことはしない。"
 religious_interaction.2400.b.tt: "[puppet_or_actor.GetShortUINameNoTooltip]に知らせが届く"
 religious_interaction.2400.b_turned_down: "[recipient.GetShortUIName|U]は私の討論への挑戦を断った"
 religious_interaction.2400.b_turned_down_puppeteer: "[recipient.GetShortUIName|U]は[puppet_or_actor.GetShortUINamePossessive]の討論への挑戦を断った"
 used_literalist_debate_modifier: "最近討論をした"
 used_literalist_debate_modifier_desc: "この人物は最近、信仰の原理について討論を始めた。"
 literally_debated_modifier: "最近討論をした"
 literally_debated_modifier_desc: "この人物は最近、信仰の原理についての討論を挑まれた。"
 religious_interaction.2401.desc_intro: "私は[debate_locale.GetNameNoTierNoTooltip]の大広間で相手と対面した。私たちは僅か数フィートしか離れていない、不安定に揺れる机の上にそれぞれ立ち、熱心な様子の観衆に囲まれている。討論が始まるのを待ち、人々が静まり返る。\n\n"
 religious_interaction.2401.desc_won: "私は1時間にわたり[recipient.GetTitledFirstName]を徹底的に論破し、その信仰心や徳に対する考え方を糾弾し、さらには[puppet_or_actor.GetFaith.HighGodName]への忠誠心にまで疑問を呈した。観衆は容赦なく、[recipient.GetTitledFirstNameNoTooltip]が逃げ出すまで腐った卵やカビの生えたキャベツを投げつけ続けた。"
 religious_interaction.2401.desc_lost: "[recipient.GetTitledFirstNamePossessive]の言葉の猛攻はすぐに始まり、私に反撃の猶予はほとんど与えられなかった。そしてほどなくして、聴衆は勝者を決めた。\n\n私は投げつけられる腐った野菜の雨に数分耐えたが、農民に生きたニワトリを投げつけられると、撤退を余儀なくされた。"
 religious_interaction.2401.a_won: "私は[puppet_or_actor.GetFaith.HighGodName]に愛されているではないか？"
 religious_interaction.2401.a_lost: "この者たちは[puppet_or_actor.GetFaith.GetReligion.GetNameNoTooltip]を理解していない！"
 religious_interaction.2402.desc_won: "[puppet_or_actor.GetTitledFirstNamePossessive]は自信満々に私に討論を挑んできたが、私の痛烈な言葉と敬虔な立場からの批判の嵐を前に、その決意はたちまち揺らいでいく。やがて観衆も加勢し、カビの生えた野菜と、やたらと攻撃的な雄鶏が飛び交う中、相手は退散していった。"
 religious_interaction.2402.desc_lost: "全力を尽くしたものの、[puppet_or_actor.GetTitledFirstName]が自身の主張について入念に調べてきたことは明らかで、たちまち観衆を味方につけてしまった。それだけでは飽き足らず、[puppet_or_actor.GetSheHe|U]は1時間以上も私を非難し続け、ありとあらゆる悪徳を私になすりつけ、さらには[recipient.GetFaith.HighGodName]に対する私の忠誠心すら疑わしいとほのめかしてきた。\n\nついに私は、観衆から痛んだ野菜や果物を雨あられと投げつけられながら逃げ出した。"
 religious_interaction.2403.desc: "[victim.GetTitledFirstName]は手も足も出ない。しっかりと準備してきたつもりだったようだが、私はハエを叩くように[victim.GetHerHis]の貧弱な主張を潰していく。反論されるたびに、[victim.GetFirstNameNoTooltip]はまるで一撃を食らったかのように顔をしかめた。時間が過ぎていくにつれ、[victim.GetSheHe]が自己弁護をまったくできない様子を見て、観客すらも黙り込んでしまった。\n\n「…だからこそ」私は芝居がかった調子で腕を上げ、責めるように広間を指差す。「お前は決して――」\n私は異変に気づき、言葉を止める。[victim.GetFirstNameNoTooltip]が苦しそうに喘ぎながら"
 religious_interaction.2403.conclusion_either: "自身の胸を押さえている。"
 religious_interaction.2403.conclusion_man: "自身の腕を押さえている。"
 religious_interaction.2403.conclusion_woman: "自身の腹を押さえている。"
 religious_interaction.2403.a.low_compassion: "「卑怯者のように逃げるつもりだな」"
 religious_interaction.2403.a.zealous: "「[ROOT.Char.GetFaith.PantheonTerm]が勝者を決めたようだ」"
 religious_interaction.2403.a.stubborn: "「おい、まだ終わっていないぞ！」"
 religious_interaction.2403.a: "「だ… 大丈夫か？」"
 religious_interaction.2403.a.tt: "[victim.GetShortUIName]は心臓発作を起こし、[character_death_dies|E]した。"
 religious_interaction.2500.desc: "あなたが目覚めるとは… [ROOT.Char.GetFaith.HighGodNameAlternate]の啓示に違いありません！ 真の信仰はあなたを歓迎します。"
 religious_interaction.2500.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの戦争中に改宗するとの申し出を受け入れた"
 religious_interaction.2500.a: "[ROOT.Char.GetFaith.HighGodName]を称えよ！"
 religious_interaction.2501.desc: "冗談のつもりですか？ 見え透いた政治的逃避を試みようと、[recipient.GetFaith.HighGodName]の怒りから逃れられはしません！"
 religious_interaction.2501.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの戦争中に改宗するとの申し出を拒否した"
