l_japanese:
 holy_order_hired_message: "騎士修道会を雇用"
 holy_order.hired_message: "[holy_order.GetName]が[actor.GetUIName]によって招集された"
 holy_order_hired_by_enemy_message: "敵対する騎士修道会"
 holy_order.hired_by_enemy: "[holy_order.GetName]が[actor.GetUIName]によって招集され、我々に敵対している"
 holy_order.destroyed_message: "[title.GetName]が壊滅した"
 holy_order_expanded: "騎士修道会の拡大"
 holy_order.new_lease: "[holy_order.GetName]は[former_holder.GetTitledFirstName]に[barony.GetName]を貸与されている"
 monastic_holy_order_expanded: "修道会の拡大"
 holy_order.0001.t: "騎士修道会"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U]は、旅支度を整え、従者たちを伴って、私の別れの言葉を待っている。\n\n"
 holy_order.0001.desc_demand: "「これも名誉のうちなのだろうが…」[recipient.GetSheHe]は不満げにこぼす。「見知らぬ異教徒の地を手に入れるために死ぬことになろうとは。[actor.GetPrimaryTitle.GetNameNoTier]のために戦って死ぬものと思っていたのに…」\n\n[recipient.GetSheHe|U]は馬にまたがり、問いかけた。「それで、私はどこへ向かえば？」"
 holy_order.0001.desc: "「[ROOT.Char.Custom('FormOfAddressForLiege')]、私は祈りの心と抜き身の刃をもって、いずれの騎士団に仕えればよいので？」"
 holy_order.0001.desc_relation: "「私の剣は、すでに飢えている——薄汚い異教徒の皮を切り裂きたくてたまらぬと。[recipient.Custom2('RelationToMeShort', ROOT.Char)]よ！私はどこへ馳せればよい？誰が私の新たな[recipient.Custom('SisterBrother')]となるのだ？」"
 holy_order.0001.a: "お前は[holy_order_1.GetName]に加わるのだ。"
 holy_order.0001.b: "[holy_order_2.GetName]こそがお前の居場所だ。"
 holy_order.0001.c: "[holy_order_3.GetName]がお前を受け入れてくれるだろう。"
 holy_order.0001.d: "これからお前の面倒は[holy_order_4.GetName]が見る。"
 holy_order.0001.e: "私が間違っていた。お前はここにいるべきだ！"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの騎士修道会への召集を受け入れた"
 holy_order.0002.desc_angry: "私は、聖なる言葉をもって誓いました。あなたの意志に縛られたのと同じように、今や[ROOT.Char.GetFaith.HighGodName]にも縛られたのです。"
 holy_order.0002.desc: "神に仕えるべきという呼びかけに応じます。私を正義の道に導いてくれたことに感謝します。"
 holy_order.0002.a_demand: "よろしい。あとは黙って[ROOT.Char.GetFaith.PositiveAfterLife]を待つがいい。"
 holy_order.0002.a: "きっと立派に[ROOT.Char.GetFaith.HighGodName]に仕えることだろう！"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]の要請に応じて誓願を立てた"
 char_interaction.0001.opening_low_piety: "[ROOT.Char.GetFaith.HighGodName]に奉仕する聖なる騎士団のもとに、お前のような[ROOT.GetCharacter.Custom('GetSinfulShameful')]者がやってくるとは…俗世の富を求める前に、自身の魂の救済について考えるのだな。"
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "金を求めるあなたの声は聞き入れた。[order.GetName]がそれに応じよう。"
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName]が私に微笑みかけた！"
 holy_order.0200.b: "だが…私には金が必要だ！"
 holy_order.0202.second_time: "再度の催促になるが、あなたは我が騎士団に金を#bold [ROOT.Var('loan_amount_owed').GetValue|0]#!支払う義務がある。"
 holy_order.0202.opening: "あなたは我が騎士団に金を#bold [ROOT.Var('loan_amount_owed').GetValue|0]#!支払う義務がある。"
 holy_order.0202.desc: "これを返還しなかった場合は、ほかに償う手段を模索することになる――[ROOT.Char.GetFaith.HighGodName]にとっては好ましいが、あなたにとってはそうでないかもしれない手段を。"
 holy_order.0202.a: "もちろん契約は尊重する。"
 holy_order.0202.a_no: "金は払う！少し探させてくれ…"
 holy_order.0202.a._not.tt: "@warning_icon! #X [gold_i] [gold|E]が足りません#!"
 holy_order.0202.b_christian: "忍耐は美徳ではなかったのか？"
 holy_order.0202.b: "同じ信者として頼む…どうかもっと時間をくれ！"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip]はあなたに5年の猶予を与える"
 holy_order.0202.c: "ほかに支払う方法を模索することもできるのでは…？"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip]はあなたに何かを要求します#!"
 holy_order.0202.d: "この金は私のほうが有効活用できるだろう！"
 holy_order.0203.desc: "私も[ROOT.Char.GetFaith.HighGodNameAlternate]も、約束を破る者には慈悲を見せない。この侮辱に報いるために、[province.GetName]を我々に貸与してもらおう。[ROOT.Char.GetFaith.HighGodNamePossessive]への奉仕をさらに推し進めるために利用する。"
 holy_order.0203.a: "もちろん、[province.GetNameNoTierNoTooltip]は渡そう。"
 holy_order.0203.b: "あまりに馬鹿げた要求だ！"
 holy_order.0204.desc: "私も[ROOT.Char.GetFaith.HighGodNameAlternate]も、約束を破る者には慈悲を見せない。この侮辱に報いるために、あなたの[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]、[child.GetTitledFirstName]をこちらに送り、[ROOT.Char.GetFaith.HighGodNamePossessive]のために働いてもらおう。"
 holy_order.0204.a: "わかった…[child.GetHerHim]をそちらへ送ろう。"
 holy_order.0204.a.tt: "騎士団への借金が帳消しになる"
 holy_order.0205.desc: "貸付にまつわるいざこざを通して、あなたの強欲さが明らかとなった。このことは必ず[ROOT.Char.GetFaith.ReligiousHeadName]に伝える！"
 holy_order.0205.a: "ちくしょう！"
 holy_order_letter.opening: "[ROOT.Char.GetFaith.HighGodNameAlternate]に仕える同胞よ"
 holy_order.1001.intro: "熱烈な魂が[holy_order.GetName]に集い、[ROOT.Char.GetFaith.GetAdjective]の信仰のために己の肉体を捨てる覚悟を決めている。我々には、[GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]を収容する兵舎を建設するための土地がさらに必要だ。"
 holy_order.1001.end: "\n\n[target_barony.GetName]はまさにうってつけの土地である。我らが聖なる大義のために、この地を借り受けることはできないだろうか？"
 holy_order.1001.a: "応じよう。[ROOT.Char.GetFaith.HighGodName]のために！"
 holy_order.1001.b: "[alternative_barony.GetNameNoTierNoTooltip]で十分ではないのか？"
 holy_order.1001.c: "いいや。この土地は与えられない。"
 holy_order.1011.intro: "[target_barony.GetName]には、耕作に適した良質な土地があり、我が修道士たちの修道院を置くのにふさわしい立派な[grandmaster.GetFaith.HouseOfWorship]がある。"
 holy_order.1011.end: "\n\n[holy_order.GetName]がそこに修道院を設立できるよう、仲介役を務めていただけないだろうか？"
 holy_order.1011.a: "騎士団の[target_barony.GetNameNoTierNoTooltip]の借り受けを承諾しよう。"
 holy_order.1011.b: "代わりに、静かな[alternative_barony.GetNameNoTierNoTooltip]の地はいかがだろうか？"
 holy_order.1011.c: "残念だが、修道士たちには他の場所へ行っていただきたい。"
 holy_order.2001.t: "神聖な目的"
 holy_order.2001.desc: "私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]、[child.GetFirstName]が私のところへ来ると、その様子から重要な話があることをすぐに察した\n\n「[ROOT.Char.Custom('MotherFather')|U]、ここにいても私の人生は誰かの影に隠され続けるだけです。それよりも[holy_order.GetName]に加わり、[child.GetFaith.HighGodName]に仕えることを許可してください。しっかりと考えたうえでの、私の望みなのです」"
 holy_order.2001.a: "[child.GetFaith.HighGodNameAlternate]のお導きに従うのだ、[child.Custom('DaughterSon')]よ。"
 holy_order.2001.b: "盛大ではないかもしれないが、お前にはここでやってほしいことがある。"
 holy_order.2002.desc: "私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))]、[sibling.GetTitledFirstName]が自身の計画を教えてくれた時、その様子からそれについて長い間考えていたことは明らかだった\n\n「ここで得られるものはほとんどない。それに、誰かに仕えるならば、[sibling.GetFaith.HighGodName][sibling.GetFaith.HighGodHerselfHimself]に仕えたい。私は[holy_order.GetName]に加わります」"
 holy_order.2002.a: "お前の選択は理解できる、[sibling.Custom('SisterBrother')]。"
 holy_order.2002.b: "そんなことは#EMP 絶対に#! 許さない！"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "[grandmaster.GetFaith.GetAdjective]の信仰を脅かすものを阻止する真の戦士は常に必要になる。\nあなたの[child.Custom('DaughterSon')]、[child.GetTitledFirstName]は多才だが相続の見込みは少ないようだ。[holy_order.GetName]に仕えたほうが、よりよい人生を送れるのではないだろうか。我々とともに訓練し学ぶことで、あなたの名に大きな名誉をもたらすことだろう。"
 holy_order.2003.a: "[child.GetHersHis|U]は真の[child.GetFaith.GetAdherentName]の人生を送ることができるだろう。"
 holy_order.2003.child_joins_order: "[child.GetFirstName]は[GetTrait('order_member').GetName( child.Self )]を獲得し、[grandmaster.GetTitledFirstNameNoTooltip]の宮廷に加わる"
 holy_order.2003.b: "代わりに[alternative_child.GetFirstNameNoTooltip]を訓練してくれないか？"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName]は[GetTrait('order_member').GetName( alternative_child.Self )]を獲得し、[grandmaster.GetTitledFirstNameNoTooltip]の宮廷に加わる"
 holy_order.2003.c: "[child.GetHerHis|U]の居場所は私の側にある。"
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "私は人生を[child.GetFaith.HighGodNameAlternate]に捧げてきましたが、[child.GetFaith.HighGodNameSheHe]は私が自分の家族をないがしろにすることは望まれないでしょう。\n\n[grandmaster.GetTitledFirstName]は、私が昔の生活に戻り、もう一度あなたの[ROOT.Char.Custom('GetCourt')]の一員となることを許してくださいました。"
 holy_order.2004.a: "よく戻ってきた、[child.Custom('DaughterSon')]よ！"
 holy_order.2004.b: "いいや。もはやここにお前の居場所はない。"
 holy_order.2005.t: "帰還"
 holy_order.2005.desc: "[child.GetTitledFirstNamePossessive]の滞在はいつもより長く続いた。[child.Custom('DaughterSon')]が[ROOT.Char.Custom('GetCourt')]にすっかり腰を落ち着け、私の食べ物を貪り、使用人たちに嫌がらせをするようになってきてようやく、私は[holy_order.GetName]に戻る話を切り出した。残念なことに、[child.GetHerHis|U]は熱心に返事をした。\n\n「聞いてないの、[ROOT.Char.Custom('MotherFather')]さん？[grandmaster.GetTitledFirstName]さんは優しいから、[child.GetFaith.GetName]のことはもういいんだって！やっと家族のいる家に帰ってこれたよ」"
 holy_order.2005.a: "お、お前は…ここに残るのか？"
 holy_order.destroyed_title: "騎士修道会の解散"
 holy_order.2010.t: "新たな修道会"
 holy_order.2010.desc: "隠者、神秘主義者、そして古い修道会に不満を抱いた弟子たちが[barony.GetNameNoTier]に集まり、長年にわたって荒野に新たな住まいを築いてきた。[leader.GetFirstName]という名の[leader.GetWomanMan]が、この芽吹きつつある修道会——[leader.GetPrimaryTitle.GetName]の長として、自然に頭角を現しつつある。だが、このような動きについて、#EMP 私#!はまだ裁可を下していない。加えて、この修道会の生活様式の中核として掲げるべき聖なる戒律も、私はまだ提案していない。\n\n[barony.GetNameNoTierNoTooltip]に集うこの清らかな信徒たちの合唱は、何を歌い上げるべきだろうか？彼らは何を全身全霊で実践し、何について考え、書き記すべきだろうか？そして、誰が彼らを導くべきだろうか？"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )]を実践し、修道者[monk_tenet_1.GetFirstNameNoTooltip]が導く。"
 holy_order.2010.5: "[tenet_5.GetName( order_rite )]を実践し、修道者[monk_tenet_2.GetFirstNameNoTooltip]が導く。"
 holy_order.2010.6: "[tenet_6.GetName( order_rite )]を実践し、修道者[monk_tenet_3.GetFirstNameNoTooltip]が導く。"
 holy_order.2010.d: "[tenet_1.GetName( order_rite )]を実践し、修道者[monk_tenet_1.GetFirstNameNoTooltip]が導く。"
 holy_order.2010.e: "[tenet_2.GetName( order_rite )]を実践し、修道者[monk_tenet_2.GetFirstNameNoTooltip]が導く。"
 holy_order.2010.f: "[tenet_3.GetName( order_rite )]を実践し、修道者[monk_tenet_3.GetFirstNameNoTooltip]が導く。"
 monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )]が[monastic_order.GetName]の掲げる[core_tenet|E]となる。"
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName]は[tenet_pick.GetName( order_rite )]を掲げる"
 founded_monastic_order_modifier: "修道会の創設"
 founded_monastic_order_modifier_desc: "この賢明な統治者は、新たな修道会の構想と創設を助け、それによって神へ直接訴えかける新たな道を開いた。"
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName]が[monastic_order.GetName]の[ruler|E]となる"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName]が[monastic_order.GetName]の[ruler|E]であり続ける"
 holy_order.2009.t: "修道院の建設"
 holy_order.2009.desc: "静けさに満ちた[province.GetTerrain.GetNameNoTooltip|l]のただ中、[province.GetCulture.GetCollectiveNoun]に愛されしこの地に、私はいずれ[province.GetName]修道院の礎となる最初の石を据えた。\n\n労働者たちは素朴な奉献者たちと力を合わせ、大地から壁を築き上げ、その勤勉な働きを通じて祈りの聖歌を響かせている。[potential_leader.GetName]のような、最初に迎えられた高名な修道者たちもこの地を歩み、礼拝堂や食堂の設計に取りかかっている。\n\n数年もすれば、この地に新たな修道会が生まれるだろう。そして、石と[ROOT.Char.Custom('GetWritingMaterial')]のほかにも、この修道会にはさらに多くの誓願を立てる者たちが必要となる。"
 holy_order.2009.a: "この新たな修道会は、私が支持する者たちに導かれるべきだ。"
 holy_order.2009.b: "現在の修道会に不満を抱く修道者は多い…"
 holy_order.2009.b.tt: "…彼らはこの新たな修道会の主導権と、新たな会則を記す自由を求めて、上長のもとを離れるだろう。"
 holy_order.2009.c: "荒野の修行者と熱意ある若者たちを集めよ。"
 monastic_order_creation_increased_spiritual_fulfillment: "#high 50年間#!、[monastic_holy_order|E]に対する[interactions|E]で得られる[spiritual_fulfillment|E]が上昇する"
 monastic_founder_become_saint_tt: "[chosen_leader.GetShortUIName]は、死亡時に#high 65以上#!の[GetTrait('devoted').GetName( chosen_leader.Self )][trait_level_track_xp|E]を有しているか、[piety_level|E]が少なくとも@piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]であれば、死後に[GetTrait('saint').GetName( chosen_leader.Self )]となる"
 holy_order.2020.t: "修道誓願"
 holy_order.2020.desc: "私の強い求めにより、新たに修道衣をまとった[recipient.GetFirstNamePossessive]は、私の[ROOT.Char.Custom('ResidenceBuilding')]、そして俗世の[ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]や貴族たちに背を向ける。[recipient.GetSheHe|U]は[archabbot.GetPrimaryTitle.GetName]へ迎え入れられた。\n\nその修道会に属するほかの[recipient.Custom('SistersBrothers')]たちと同じく、[recipient.GetFirstNameNoTooltip]は聖なる共同体への務めと忠誠を誓う。[recipient.GetSheHe|U]はその肉体を[recipient.GetFaith.HighGodName]に捧げ、その精神を[recipient.GetFaith.PositiveAfterLife]への崇敬に捧げる。\n\n[recipient.GetFirstNameNoTooltip]は[archabbot.GetCapitalLocation.GetName]、あるいは修道会の別の聖所に住まい、そこで学びと思索の日々を始めることになる。"
 holy_order.2020.aa: "修道会は、勤勉な魂を得たな。"
 holy_order.2020.aa.tt: "[recipient.GetFirstNamePossessiveNoTooltip]は物事を管理するのに長けている。果てなき労働において、大いに役立つことだろう。"
 holy_order.2020.a: "修道会は、賢き弟子を得たな。"
 holy_order.2020.a.tt: "博識な[recipient.GetFirstNameNoTooltip]にとって、この現世にこれほどふさわしい場所はない。"
 holy_order.2020.b: "後援者の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))]は、雑用係の[recipient.Custom('GirlBoy')]ではないぞ…"
 holy_order.2020.c: "「寄進」をすれば、[recipient.GetFirstNameNoTooltip]は手厚く扱われるだろう。"
 holy_order.2020.d: "[recipient.GetHerHis|U]の人生は、もはや修道会に委ねられた。"
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]の要請に応じて修道会に加わった"
 take_vows_improve_education_learning_tt: "@skill_learning_icon! [learning|E]の[education|E]結果が向上する"
 take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon! [stewardship|E]の[education|E]結果が向上する"
 recently_joined_holy_order_desc: "過去5年以内に、[recipient.GetShortUIName]は[recipient.GetHerHis]の修道会に入った"
 child_in_holy_order_desc: "[recipient.GetShortUIName]は[recipient.GetHerHis]の修道会に入ることを約束された子供である"
 custom.every_domain_monastic_order: "あなたの[domain|E]内のすべての[monastic_holy_order|E]"
 order_gains_minor_tenet_popularity_tt: "修道会の[core_tenet|E]の[tenet_popularity|E]が#P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#!上昇する"
 new_order_gains_minor_tenet_popularity_tt: "新しい[monastic_holy_order|E]により、その[core_tenet|E]の[tenet_popularity|E]がさらに#P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#!上昇する"
 holy_order.2030.t: "寄進：[recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "私の財は、[recipient.GetTitledFirstNamePossessive]の修道院の金庫へと送られる。その寄進は、敬虔な土地経営、聖典の写本、[recipient.GetPrimaryTitle.GetName]の世俗的な目的に資するものとなるだろう…\n\n…そして、この寄進により、彼らは私の不滅の魂のために、幾千の祈りを捧げてくれるだろう。修道者は祈るために生きる者であり、そのひたむきで正しき献身ゆえに、[ROOT.Char.GetFaith.random_GoodGodNames|U]は彼らの祈りに特別に耳を傾けてくださるという。\n\n#EMP [actor.GetFaith.HighGodName|U]よ、彼らが我が名を口にする声が聞こえていますか？#!"
 holy_order.2030.desc_desperate_plea: "#EMP 私がどれほど惨めに這いつくばり、あなたの慈悲を乞うてきたか、ご存じなのですか？#!"
 holy_order.2030.desc_huge_donation: "#EMP 私がどれほどの財を手放したか、ご存じなのですか…？#!"
 holy_order.2030.a: "我が魂の救済のために祈る者が、また増えた。"
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの修道会への寄付を受け入れた"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U]へ"
 holy_order.2031.desc: "貴殿の願いについて思案し、祈りのうちに答えを求めました。しかし恐れながら、いかなる寄進をもってしても、貴殿のために、修道士たちに[recipient.GetFaith.HighGodName]への祈りを捧げさせることはできません。貴殿の救済は、我らの手にも余るもののようです。"
 holy_order.2031.a: "フン！少なくとも、金ならまだある。"
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの修道会への寄付を拒否した"
