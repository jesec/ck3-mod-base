 holy_order.2040.opening: "我らが恩人、[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetFirstName]殿へ"
 holy_order.2040.desc: "事は成りました。[recipient.GetPrimaryTitle.GetNameNoTier]の支部が[target.GetNameNoTier]の[actor.GetFaith.HouseOfWorship]に隣接して設けられます。そして[target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier]の中心にあたるその地に、我らは[recipient.GetCapitalLocation.GetName]の書庫より運ばれし古き文書を収めることとなりましょう。\n\n"
 holy_order.2040.desc_nuns: "そしてその地で、我らの[recipient.GetFaith.DevoteeFemalePlural]が貴殿のために、[actor.GetFaith.HighGodName]への祈りを高らかに捧げましょう。"
 holy_order.2040.desc_monks: "そしてその地で、我らの[recipient.GetFaith.DevoteeMalePlural]が貴殿のために、[actor.GetFaith.HighGodName]への祈りを高らかに捧げましょう。"
 holy_order.2040.desc_huge_donation: "これが、貴殿の敬虔な施しに対する、修道会の感謝のしるしです。"
 holy_order.2040.desc_rite: "\n\nこの支部は、我らが修道会の他の修道院と同じく、[recipient.GetRite.GetName]の掟に従うことを、どうぞお知りおきください。"
 holy_order.2040.a: "あなたの修道会に栄えあれ！"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの男爵領の貸与の申し出を受け入れた"
 holy_order.2041.opening: "[actor.GetPrimaryTitle.GetNameNoTier]の[actor.GetFirstName]殿へ"
 holy_order.2041.desc: "我らは[recipient.GetFaith.HighGodNamePossessive]の最も清らかなる信奉者にして、この哀れな地上に[recipient.GetFaith.PositiveAfterLife]の完全なる聖性をもたらす者です。しかし、[actor.GetPrimaryTitle.GetNameNoTier]の領国には、我らの祈りをもってしても払えぬ災いが降りかかっているようです。\n\n貴殿の領国の魂が[recipient.GetFaith.HighGodName]から痛ましいほどに隔たっている限り、[recipient.GetPrimaryTitle.GetName]が[target.GetNameNoTier]へ赴くことはできません。"
 holy_order.2041.a: "何が「清らかなる」だ！「愚かなる」の間違いではないか！"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUINamePossessive]からの男爵領の貸与の申し出を拒否した"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial [monastic_order.GetName]が[holy_order_vicinity|E]に入り、[interactions|E]可能になります#!"
 holy_order.2050.t: "[barony.GetNameNoTierNoTooltip]で巻き起こる運動"
 holy_order.2050.desc: "「[target_order.GetName]は今でも、かつての砂漠の隠遁者たちのように、苦難に耐えているだろうか？」——[clerical_helper.GetNamePossessive]の熱烈な書簡はどれもこの言葉で始まっている。\n\n「[target_lessee.GetTitledFirstName]は黄金でその身を飾っているのではないか？」——[barony.GetNameNoTier]では改革派が説教の中でそう問いかけ、そしてこう締めくくる。#EMP 「新たな道を！新たな戒律を！」#!\n\nこの修道院は瞬く間に、敬虔な改革と反抗の温床と化している。そこに暮らす修道者たちはもはや[target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip]の一員とは呼び難く、[target_order_tenet.GetName( founder.GetRite )]についての陳腐な議論にもまったく納得していない。とはいえ、彼らの改革への熱意は、ひとつの新たな原則、そしてひとつの理念へと導いてやる必要がある。"
