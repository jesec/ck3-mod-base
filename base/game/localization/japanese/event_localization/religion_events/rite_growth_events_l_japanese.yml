l_japanese:
 rite_growth.0010.t: "新たな[origin_faith.GetReligion.GetAdjectiveNoTooltip]の流派"
 rite_growth.0010.desc.intro.relation: "新たに創設された流派の中心に立つのは、あなたの[GetPlayer.Custom2('RelationToMeShort', founder.Self)]である[founder.GetFirstName]だ。 "
 rite_growth.0010.desc.intro.descriptor_archbishop: "新たに創設された流派の中心に立つのは、[founder.GetCulture.GetName]の大司教[founder.GetFirstName]だ。 "
 rite_growth.0010.desc.intro.descriptor_ruler: "新たに創設された流派の中心に立つのは、[founder.GetTitledFirstName]だ。 "
 rite_growth.0010.desc.opener.archbishopric: "この人物は、[founder_clerical_title.GetNameNoTier]を司っている。\n\n"
 rite_growth.0010.desc.opener.lands: "この人物は、[founder.GetPrimaryTitle.GetBaseNameNoTier]の地を治めている。\n\n"
 rite_growth.0010.desc.divergence.minor: "[new_rite.GetName]として知られるこの流派は、[source_rite.GetAdjective]とはわずかに異なるだけである。 "
 rite_growth.0010.desc.divergence.moderate: "[new_rite.GetName]として知られるこの流派の教えは、[source_rite.GetAdjective]の信者の多くには馴染みのないものだ。 "
 rite_growth.0010.desc.divergence.major: "[new_rite.GetName]として知られるこの流派の慣習は、[source_rite.GetAdjective]の信者の多くにとって異端に近いものだ。 "
 rite_growth.0010.desc.differing.tenet: "その最大の相違点は[differing_tenet.GetBaseName]である。"
 rite_growth.0010.desc.differing.doctrine: "その最大の相違点は[differing_doctrine.GetDescriptiveName]である。"
 rite_growth.0010.desc.differing.fallback: "しかし教義上の違いはあまりに微妙で、容易には言い表せない。"
 rite_growth.0010.desc.outro.wildfire: "\n\n新たな教えは[origin_faith.GetAdjective]の信徒たちの間に急速に広まっている。"
 rite_growth.0010.a: "私の魂は[ROOT.Char.GetRite.GetNameNoTooltip]のもとで守られている。"
 rite_growth.0010.b: "[new_rite.GetNameNoTooltip]の教えを実践すべきだ！"
 rite_growth.0010.c: "異端の臭いがする…"
 counties_and_court_converts: "[source_rite.GetName]の[counties|E]と[courtiers|E]が[new_rite.GetName]へ改宗する"
 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNoTooltip]が流派を受容"
 rite_growth.0011.notification.desc: "[convert_ruler.GetTitledFirstName]は[founder.GetTitledFirstName]と共に[new_rite.GetName]の教えを実践するようになった"
 iberian_struggle_blocks_holy_war_tt: "[holy_war|E]の宣戦が[iberian_struggle|E]によって妨げられてはならない"
