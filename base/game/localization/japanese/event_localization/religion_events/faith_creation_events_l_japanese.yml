l_japanese:
 faith_creation.1001.t.schism: "[reformed_faith.GetAdjectiveNoTooltip]の分裂"
 faith_creation.1001.t.reformation: "[reformed_faith.GetAdjectiveNoTooltip]の改革"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetName]に新たな分派が生まれた。[reformer.GetTitledFirstName]とその信奉者たちは、母体となる宗派である[old_faith.GetName]から分離し、かつて守っていた[old_rite.GetAdjective]の流派の教えは、独立した信仰の礎となった。"
 faith_creation.1001.desc.reformation: "[reformer.GetTitledFirstName]は[reformed_faith.GetAdherentNamePlural]の中で有力な人物であり、所領内のすべての[reformer.Custom('DefaultPriestTitle')]を集め、各地に散在する教えを一つにまとめ上げ、そこから宗派の公式な教義を定めた。"
 faith_creation.1001.desc.schism.personal: "[old_faith.GetAdjective]の[old_faith.AltPriestTermPlural]は道を踏み外した。もはや我々を導く者として信頼できない。私は考えを同じくする[reformer.Custom('DefaultPriestTitlePlural')]を集めた。我々が[old_rite.GetName]から作り上げたものは、もはや我々の母体となる宗派には属さない。"
 faith_creation.1001.desc.reformation.personal: "ようやく世界中の重要な[reformer.Custom('DefaultPriestTitle')]をすべて集めることができた。これで、各地に散在する教えを一つにまとめ上げ、そこから今後我々の宗派を導く教義を定めることができる。"
 faith_creation.1001.desc.schism.personal.hof: "これ以上、[old_hof.GetTitledFirstName]と[old_faith.GetAdjective]の[old_faith.AltPriestTermPlural]が信徒を迷わせるのを、ひざまずいて見ているつもりはない。私は信念を同じくする[reformer.Custom('DefaultPriestTitlePlural')]を集め、我々が守ってきた[old_rite.GetAdjective]の流派の教えから、[old_faith.GetName]に何ら恩義を負わない宗派を作り上げた。"
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName]は[old_hof.GetTitledFirstName]の権威を捨て、信奉者たちを率いて[old_faith.GetName]から離脱した。彼らが守っていた[old_rite.GetAdjective]の教えは、今やほかの誰にも支配されない独立した宗派の根となっている。"
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\n情熱的な[reformer.Custom('DefaultPriestTitlePlural')]たちはすでに新たな信仰を世界に広めるために[reformed_faith.GHWNamePlural]を発足させると話しており、"
 faith_creation.1001.desc.outlook.pacifism: "\n\n[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]たちは暴力と殺人を非難し、戦争は苦しみと憎しみしか生まないと話しており、"
 faith_creation.1001.desc.outlook.dogmatic: "\n\n[reformer.Custom('DefaultPriestTitlePlural')]たちは[reformed_faith.GetNameNoTooltip]が唯一の正しき宗派であると宣言しており、"
 faith_creation.1001.desc.outlook.accepting: "\n\n[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]たちは、信者でない者も許容して協力することを促しており、"
 faith_creation.1001.desc.outlook.fallback: "\n\n[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]たちはほかの宗派に対して現実的で公平な視点を持つようになり、"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "確かな信心を示すには[reformed_faith.HighGodName]に人間を生贄に捧げるしかないとしている！"
 faith_creation.1001.desc.belief.indulgent: "肉体の欲求に従い、人生を謳歌するよう信者に促している。"
 faith_creation.1001.desc.belief.incest: "近親結婚を認めた。家族は神聖なもので、家族内の結婚は祝福されると主張している。"
 faith_creation.1001.desc.belief.aniconism: "単なる肖像では[reformed_faith.HighGodName]の偉大さは表現できないとし、いかなる宗教的な象徴の使用も否定している。"
 faith_creation.1001.desc.belief.ascetic: "物質的な欲求は精神的な充足への妨げになるとし、信者の間で禁欲主義を推進している。"
 faith_creation.1001.desc.belief.spirits: "信者が波乱の時代を乗り越えられるよう、精霊の助力を求めている。"
 faith_creation.1001.desc.belief.superstition: "古くからの迷信や神話が公式な教義に含められた。"
 faith_creation.1001.desc.belief.nature: "自然を大いに尊重し、個人の利益のために利用する者から守り、保護するとしている。"
 faith_creation.1001.desc.belief.community: "新たな宗派は信者の文化的伝統を取り入れることで、結び付きが強く、外部者を進んでは受け入れない[reformed_faith.GetAdherentNamePluralNoTooltip]の社会をつくり上げた。"
 faith_creation.1001.desc.belief.pain: "苦難と痛みを通じて肉体を戒めるべきだと説いている。苦しみが魂を清め、信徒を[reformed_faith.HighGodName]に近づけるからだ。"
 faith_creation.1001.desc.belief.iconoclasm: "偽りの神々の偶像や祭壇が残っているなら、どこであろうと打ち倒し、焼き払うよう求めている。"
 faith_creation.1001.desc.belief.militant: "信徒は何よりもまず兵士であり、刃の上に信仰を掲げるために召された者だと考えている。"
 faith_creation.1001.desc.belief.veneration: "聖なる死者を執り成し手として崇敬し、その聖遺物を敬い、その名に祈願している。"
 faith_creation.1001.desc.belief.sacraments: "恩寵は聖なる儀式を通してのみもたらされ、それを授けられるのは叙任された者の手だけだと考えている。"
 faith_creation.1001.desc.belief.penance: "すべての魂は穢れを負って生まれ、告解と悔悛によってのみ清められると説いている。"
 faith_creation.1001.desc.belief.christology: "神の本質とは何かという重大な教義上の問題に答えを出し、それをすべての信徒が信じるべき教義として定めている。"
 faith_creation.1001.desc.belief.rebirth: "魂は大いなる輪廻の輪に縛られており、それぞれの人生は前世の行いによって形作られると考えている。"
 faith_creation.1001.desc.belief.learning: "特に学問を重んじ、世界を知ることは[reformed_faith.HighGodName]の心をより深く知ることだと考えている。"
 faith_creation.1001.desc.belief.law: "聖なる法を何よりも重んじ、教義の一語一語を文字どおり守るよう求めている。"
 faith_creation.1001.desc.belief.missionary: "地の果てまで教えを伝え、闇の中に取り残される魂が一つもないようにすると誓っている。"
 faith_creation.1001.desc.belief.hierarchy: "すべてのものには定められた居場所があり、それぞれが上位の者が定めた秩序を尊ぶときにのみ調和が生まれると説いている。"
 faith_creation.1001.desc.belief.charity: "困窮する者に慈善をもって応え、貧者、病人、見知らぬ者にも等しく手を差し伸べることを信徒に求める。"
 faith_creation.1001.desc.belief.family: "血族の絆を神聖なものと考え、祖先を敬い、多くの子を育てること自体が礼拝であると説いている。"
 faith_creation.1001.desc.belief.sacred_sites: "信仰の証として巨大な石の記念碑を築き、何世代にもわたって残る聖地としている。"
 faith_creation.1001.desc.belief.worldly: "信仰を世俗的かつ実利的に捉え、金銭や妥協、そしてしかるべき沈黙も、祈りと同じように信仰のために役立つと考えている。"
 faith_creation.1001.desc.belief.syncretic: "隣人の信仰を自らの信仰に織り込み、多くの道がなお同じ真理へと至り得ると考えている。"
 faith_creation.1001.desc.belief.fallback: "昔の対立は一旦忘れ、新たな宗派のために手を取り合うようすべての信者に求めている。"
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip]はこの急成長をみせる[reformed_faith.GetAdjectiveNoTooltip]活動を率いることを決め、[reformed_faith.ReligiousHeadName]という高い地位に就いた。これは[reformer.GetHerHis]の後継者に引き継がれることが予想されている。"
 faith_creation.1001.desc.temporal.personal: "\n\n私はこの急成長をみせる[reformed_faith.GetAdjectiveNoTooltip]活動を率いることを決め、[reformed_faith.ReligiousHeadName]という高い地位に就いた。私はこれを子孫に引き継がせるだろう。"
 faith_creation.1001.desc.spiritual: "\n\n[reformed_faith.GetAdjectiveNoTooltip]の[reformer.Custom('DefaultPriestTitlePlural')]は、新たな[reformed_faith.ReligiousHeadName]として[reformed_hof.GetFirstNameNoTooltip]を選んだ。[reformed_hof.GetSheHe]は、他のすべての[reformed_faith.GetAdjectiveNoTooltip]の流派の基準となる本流派を形作り、宗派全体の争いを裁定することになる。"
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformed_faith.GetAdjectiveNoTooltip]の[reformer.Custom('DefaultPriestTitlePlural')]は、[reformed_hof.GetFirstNameNoTooltip]を[reformed_faith.ReligiousHeadName]として引き続き据えることを選んだ。[reformed_hof.GetSheHe]は、他のすべての[reformed_faith.GetAdjectiveNoTooltip]の流派の基準となる本流派を今後も形作り、宗派全体の争いを裁定し続けることになる。"
 faith_creation.1001.desc.no_head: "\n\n急成長をみせる活動は宗教的指導者を置かないことにし、代わりにそれぞれの流派が独自の教えを保ち、各[reformer.Custom('DefaultPriestTitle')]が自らの[reformed_faith.HouseOfWorship]に責任を負うこととした。"
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip]は、すべての信者を結集し、[reformed_faith.GetAdjectiveNoTooltip]の新たな黄金時代を導く偉大な指導者、[reformed_faith.ReligiousHeadName]の預言された出現を心待ちにしている。"
 faith_creation.1001.o.frightened: "[ROOT.Char.GetFaith.random_GoodGodNames]、血に飢えた[second.Custom('GetUnbelieverNamePlural')]から我々をお救いください！"
 faith_creation.1001.o.heretical: "異端者は[ROOT.Char.GetFaith.HighGodName]に対して犯した罪の報いを受けるだろう！"
 faith_creation.1001.o.crusader: "[ROOT.Char.GetFaith.GHWName]の一つや二つで[second.Custom('GetUnbelieverNamePlural')]に立場をわからせてやれるだろう！"
 faith_creation.1001.o.interested: "この新たな展開には目をつけておこう…"
 faith_creation.1001.o.uninterested: "[second.Custom('GetUnbelieverNamePlural')]が何を信じようと関係ない。"
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "[holy_sites|E]を作成、格下げ、格上げ、採用、または放棄できる無料のアクションを#V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!回分獲得する"
 faith_creation.1001.o.personal: "[ROOT.Char.GetFaith.HighGodName]は我々を支持していると、世界は知ることになる！"
 faith_creation.1002.t: "分離した流派"
 faith_creation.1002.t.new_faith: "独自の宗派"
 faith_creation.1002.desc.intro.founder: "我が流派、[old_rite.GetAdjective]は道を外れた。祈りを一つ重ねるごとに、教義を一つ重ねるごとに、ついに[old_faith.GetName]ではなくなった。"
 faith_creation.1002.desc.intro.member: "我らが流派、[old_rite.GetAdjective]は[founder.GetTitledFirstName]のもとで道を外れた。祈りを一つ重ねるごとに、教義を一つ重ねるごとに、ついに[old_faith.GetName]ではなくなった。"
 faith_creation.1002.desc.intro.observer: "[founder.GetTitledFirstName]の流派、[old_rite.GetAdjective]は道を外れた。祈りを一つ重ねるごとに、教義を一つ重ねるごとに、ついに[old_faith.GetName]ではなくなった。"
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName]が裁きを下した。道を外れた信徒たちは、根も枝も断ち切るように追放された。"
 faith_creation.1002.desc.anathema.no_hof: "\n\n[old_faith.GetName]の[old_faith.AltPriestTermPlural]が、すべての祭壇から裁きを下した。道を外れた信徒たちは、根も枝も断ち切るように追放された。"
 faith_creation.1002.desc.new_head.personal: "これから先の荷は私が背負う。今や私は、[new_faith.ReligiousHeadName|U]として[new_faith.GetName]を率いる。"
 faith_creation.1002.desc.new_head.founder: "彼らを率いて離脱させた者が、今も彼らを導いている。[new_faith.GetName]の[new_faith.ReligiousHeadName|U]、[founder.GetFirstNameNoTooltip]だ。"
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName]が[new_faith.GetName]の[new_faith.ReligiousHeadName|U]となった。"
 faith_creation.1002.desc.new_head.none: "新たな信徒たちを導く一人の牧者はいない。[new_faith.AltPriestTermPlural]は自らにのみ従う。"
 faith_creation.1002.desc.outro.new_faith: "\n\n我々の信仰、我々の法。だが、その火は新たに灯されたばかりだ。[old_faith.GetName]は非難だけでなく、剣をもって我々に迫ってくるかもしれない。"
 faith_creation.1002.desc.outro.old_faith: "\n\n[old_rite.GetName]を守ってきたすべての伯爵領と魂が、一挙に[old_faith.GetName]を離脱する。彼らはもはや同胞ではない。我々はまもなく、戦場で相まみえることになるかもしれない。"
 faith_creation.1002.a: "ついに我々自身の信仰を手に入れた。"
 faith_creation.1002.a.founder: "我々は常に自分たちの道を歩んできた。今や、その道の名も我々のものだ。"
 faith_creation.1002.b: "彼らは永遠に異端者だ。"
 faith_creation.1002.b.hof: "群れから外れるのがどれだけ過酷か、思い知るがいい。"
 faith_creation.1002.consequences.tt: "[new_faith.GetName]が完全に分離した[faith|E]となった：\n$EFFECT_LIST_BULLET$元の[rite|E]のすべての[followers|E]と[counties|E]が新たな宗派に属する\n$EFFECT_LIST_BULLET$[new_faith.GetName]と[old_faith.GetName]の間に[faith_hostility|E]が適用され、[holy_wars|E]が可能になる場合がある\n$EFFECT_LIST_BULLET$二つの宗派はもはや同じ[head_of_faith|E]を共有しない"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName]は、[holy_sites|E]を作成、格下げ、格上げ、採用、または放棄できる無料のアクションを#V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!回分獲得する"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName]は[GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]を失う"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip]が[faith.ReligiousHeadName|U]に決定"
 faith_creation.1010.desc.start: "私たちの宗派の正当性に疑いの余地はないが、宗派の指導者が不在の状態を耐えるのは非常に難しい。しかしそれもようやく解決する。なぜなら"
 faith_creation.1010.desc.temporal.personal: "私を唯一の[faith.ReligiousHeadName|U]として受け入れるよう、[faith.AltPriestTermPlural]をようやく説得したのだ。"
 faith_creation.1010.desc.temporal: "自身を唯一の[faith.ReligiousHeadName|U]として受け入れるよう、[HoF.GetTitledFirstName]は[faith.AltPriestTermPlural]を説得することができたのだ。"
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural]が集まり、本流派を守る唯一真の[faith.ReligiousHeadName|U]として、[HoF.GetFirstName]を選出したのだ。"
 faith_creation.1010.desc.end: "\n\nようやく信者が一人の指導者の元に結集することができた今、まるで[faith.GetNameNoTooltip]の黄金時代が到来したかのようだ。"
 faith_creation.1010.desc.end.personal: "\n\nようやく信者が私の元に結集した今、私が[faith.GetNameNoTooltip]を新たな黄金時代へと導こう！"
 faith_creation.1010.a: "[faith.HighGodName]に栄光あれ！"
 faith_creation.1011.message.title: "宗教指導者の任命"
 faith_creation.1011.message.desc: "[faith.GetAdjective]の[faith.AltPriestTermPlural]は[faith.ReligiousHeadName|U][HoF.GetFirstName]が彼らの[head_of_faith|E]であると宣言した"
 faith_creation.1021.t: "宗派内の流派"
 faith_creation.1021.t.founder: "独自の流派"
 faith_creation.1021.desc.intro.founder: "[new_rite.GetName]が創始され、その流派に従う者たちは私を頼っている。我々は今も[old_faith.GetAdherentNamePlural]だが、もはや[source_rite.GetAdjective]ではない。"
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName]が[old_faith.GetName]の中に新たな流派を創始した。信奉者たちはそれを[new_rite.GetName]と呼び、[old_faith.GetAdjective]の信仰を独自の流派を通じて守っている。"
 faith_creation.1021.desc.divergence.minor: "\n\n[source_rite.GetAdjective]とは、細かな点でのみ異なる。 "
 faith_creation.1021.desc.divergence.moderate: "\n\nその教えは、[source_rite.GetAdjective]を守る者の大半にとって、どこか奇妙に映るだろう。 "
 faith_creation.1021.desc.divergence.major: "\n\nその慣行は[source_rite.GetAdjectiveNoTooltip]から大きくかけ離れており、疑念を招いている。 "
 faith_creation.1021.desc.differing.tenet: "最も大きな違いは[differing_tenet.GetBaseName]だ。"
 faith_creation.1021.desc.differing.doctrine: "最も大きな違いは[differing_doctrine.GetDescriptiveName]だ。"
 faith_creation.1021.desc.differing.fallback: "両者を分ける決定的な慣行はない。"
 faith_creation.1021.desc.outro.founder.mainline: "\n\n我々は、[old_faith.GetNameNoTooltip]が他のすべての流派を評価する基準としてきた、本流派そのものから離れた。思い上がりと呼ばれても構わない。"
 faith_creation.1021.desc.outro.founder.branch: "\n\n我々は以前から一つの分派だったが、今後は独自の流派として、その責任も自分たちで負うことになる。"
 faith_creation.1021.desc.outro.observer: "\n\n新たな流派が生まれることは、そう珍しくない。これが根付くのか、枯れるのか、それとも異端へと腐っていくのかは、まだ分からない。"
 faith_creation.1021.a.founder: "敬虔な者たちの間で、静かに広めよう。"
 faith_creation.1021.b.founder: "領国全体に存在を知らしめよう。"
 faith_creation.1021.a: "生きた信仰には、多くの流派が共存する余地がある。"
 faith_creation.1021.b: "あらゆる異端は、最初は新しいものとして始まる。"
