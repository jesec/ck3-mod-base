l_japanese:
 culture_notification.0010.t: "伝統が捨てられた"
 culture_notification.0010.desc: "[this_player.GetCulture.GetName][culture|E]は[tradition.GetName]の[tradition|E]を捨てた"
 culture_notification.0011.t: "伝統が採用された"
 culture_notification.0011.desc: "[this_player.GetCulture.GetName][culture|E]は[tradition.GetName]の[tradition|E]を受け入れた"
 culture_notification.1001.t: "混合文化：[new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "[founder.GetTitledFirstName]が[parent_1.GetName]と[parent_2.GetName]の文化から、[new_culture.GetName|V]の[hybrid_culture|E]を形成した"
 culture_notification.1011.t: "[new_culture.GetNameNoTooltip]の混合"
 culture_notification.1011.intro: "長年にわたる交流によって、[parent_1.GetName]と[parent_2.GetName]の人々は次第に距離を縮めていった。やがてその結びつきから新たな民族が生まれた。自らを[new_culture.GetName]と呼ぶ人々だ。\n\n"
 culture_notification.1011.blend: "両者の融合は明白だ。[parent_1.GetNameNoTooltip]の伝統である[tradition_1.GetName]と、[parent_2.GetNameNoTooltip]の習わしである[tradition_2.GetName]が共存している。これらが一体となって、新たな民族を形作っている。"
 culture_notification.1011.blend_fallback: "どちらか一方がより大きな影響を及ぼすことはない。[new_culture.GetNameNoTooltip]は、両方の世界を見事に融合している。"
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "[parent_1.GetName]文化と[parent_2.GetName][cultures|E]から[hybrid_culture|E][new_culture.GetName]が形成された。"
 culture_notification.1101.t: "文化の分岐：[new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName]は[parent_1.GetName]の[divergent_culture|E]、[new_culture.GetName|V]を形成した"
 culture_notification.1111.t: "[new_culture.GetNameNoTooltip]の分枝"
 culture_notification.1111.intro: "言葉遣いが少し変わり、新たな習わしが一つ加わる。最初は気付きにくい変化だ。だが、もはや見過ごすことはできない。[founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]の[parent_1.GetCollectiveNoun]は、今や自らを[new_culture.GetName]と呼んでいる。\n\n"
 culture_notification.1111.tradition.new: "祖先から受け継いだ伝統に代わり、[new_tradition.GetName]が根付きつつある。"
 culture_notification.1111.tradition.lost: "[parent_1.GetCollectiveNounNoTooltip]の[lost_tradition.GetName]という習わしは捨て去られた。"
 culture_notification.1111.ethos.bellicose: "敵や競争相手に脅かされ、[new_culture.GetCollectiveNounNoTooltip]は[new_culture.GetEthos.GetName]へと変わり、武力こそが己の運命を切り開くと信じている。"
 culture_notification.1111.ethos.bureaucratic: "[new_culture.GetCollectiveNounNoTooltip]は[new_culture.GetEthos.GetName]へと変わり、長大な文書と、それにも増して長大な年代記に安らぎを見いだしている。"
 culture_notification.1111.ethos.courtly: "礼儀と儀礼を重んじる[new_culture.GetCollectiveNounNoTooltip]は、今や[new_culture.GetEthos.GetName]の生き方を貫いている。"
 culture_notification.1111.ethos.communal: "勝利と悲劇を分かち合う中で、[new_culture.GetCollectiveNounNoTooltip]は[new_culture.GetEthos.GetName]となり、隣人と強い結びつきを持つようになった。"
 culture_notification.1111.ethos.stoic: "危険で予測のつかない世界の中、[new_culture.GetCollectiveNounNoTooltip]は[new_culture.GetEthos.GetName]へと変わり、何よりも不屈の精神を重んじるようになった。"
 culture_notification.1111.ethos.spiritual: "答えを自らの内に求める[new_culture.GetCollectiveNounNoTooltip]は、これまで以上に信仰心の篤い[new_culture.GetEthos.GetName]の民族となった。"
 culture_notification.1111.ethos.egalitatian: "[new_culture.GetCollectiveNounNoTooltip]の間では、今や生まれよりも功績が重んじられ、[new_culture.GetEthos.GetName]な社会が築かれている。"
 culture_notification.1111.ethos.unchanged: "人生に対する彼らの見方は変わらない。それでも、政策と国境をめぐる分断が、一つの民族を二つに分けた。"
 culture_notification.1111.outro.other: "\n\n巧妙な策によってか信念によってか、[founder.GetTitledFirstName]は今やこの文化的覚醒の先頭に立っている。"
 culture_notification.1111.outro.founder: "\n\n[new_culture.GetNameNoTooltip]の人々は今や私を頼りとしている。我々の未来はここから始まるのだ。"
 culture_notification.1111.a.other: "状況がどのように変わっていくか見守ろう。"
 culture_notification.1111.a.founder: "新しい世代、新しい時代、新しい人々へ！"
 culture_notification_tooltip: "[divergent_culture|E][new_culture.GetName]が[parent_1.GetName][culture|E]から分枝した。"
