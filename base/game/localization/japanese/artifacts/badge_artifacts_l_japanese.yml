l_japanese:
 #Pilgrim Badges
 maria_conch_name: "聖マリアの貝殻"
 maria_conch_description: "巡礼の際に授かった巡礼記章。"
 maria_conch_description_protection: "[badge_location.GetProvince.GetBaronyNameExplicitly]への巡礼の際に授かった守護の巡礼記章。"
 maria_conch_description_prosperity: "[badge_location.GetProvince.GetBaronyNameExplicitly]への巡礼の際に授かった繁栄の巡礼記章。"
 santiago_badge_name: "聖ヤコブの貝殻"
 santiago_badge_description: "聖地サンティアゴ・デ・コンポステーラへと続く聖ヤコブの道（カミーノ・デ・サンティアゴ）の巡礼を記念する、ホタテ貝型の巡礼記章。"
 jerusalem_badge_name: "エルサレム十字"
 jerusalem_badge_description: "精巧かつ繊細な装飾が施された四角い十字型の巡礼記章。聖都エルサレムへの巡礼を記念するもの。"
 rome_badge_name: "聖ペトロの鍵"
 rome_badge_description: "一対の鍵をかたどった巡礼記章。光輪を戴いた聖ペトロと聖パウロが描かれている。聖都ローマへの巡礼を記念するもの。"
 generic_badge_name_1: "小さな[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の記章"
 generic_badge_name_2: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の記念品"
 generic_badge_name_3: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の紋章"
 generic_badge_name_4: "精巧な[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]のピン"
 protection_badge_name_1: "頑丈な[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]のピン"
 protection_badge_name_2: "強固な[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の記念品"
 prosperity_badge_name_1: "磨き上げられた[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の装飾品"
 prosperity_badge_name_2: "輝く[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の記章"
 prosperity_badge_name_3: "優美な[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]のピン"
 virility_badge_name_1: "強固な[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]のピン"
 virility_badge_name_2: "祝福された[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]の装飾品"
 wisdom_badge_name_1: "神秘的な[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]のピン"
