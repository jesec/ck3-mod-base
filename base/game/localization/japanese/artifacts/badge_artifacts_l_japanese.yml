 generic_badge_protection_desc: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]で入手した頑丈な巡礼記章。身につけた者に守護をもたらすと噂されている。"
 generic_badge_prosperity_desc: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]で入手した輝く巡礼記章。身につけた者に繁栄をもたらすと噂されている。"
 generic_badge_virility_desc: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]で入手した、熱情に輝く巡礼記章。身につけた者に精力をもたらすと噂されている。"
 generic_badge_wisdom_desc: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]で入手した謎めいた巡礼記章。身につけた者に知恵と思索をもたらすと噂されている。"
