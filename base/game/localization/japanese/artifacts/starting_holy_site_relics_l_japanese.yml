l_japanese:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "聖ペトロの骨"
 artifact_relic_peter_bones_desc: "使徒の筆頭でありローマの初代司教である使徒ペトロの遺骨。"
 artifact_relic_paul_bones_name: "聖パウロの骨"
 artifact_relic_paul_bones_desc: "アクアエ・サルヴィアエで殉教した使徒パウロの遺骨。"
 artifact_relic_crown_of_thorns_name: "いばらの冠"
 artifact_relic_crown_of_thorns_desc: "磔刑の前にキリストの頭に被せられたいばらの冠。"
 artifact_relic_baptist_arm_name: "洗礼者ヨハネの右腕"
 artifact_relic_baptist_arm_desc: "洗礼者ヨハネの右前腕。ヨルダン川でキリストに洗礼を授けたまさにその手といわれている。"
 artifact_relic_true_cross_name: "聖十字架のかけら"
 artifact_relic_true_cross_desc: "キリストが磔にされた十字架の木片。金箔を施した聖遺物箱に収められている。"
 artifact_relic_bones_of_james_name: "聖ヤコブの骨"
 artifact_relic_bones_of_james_desc: "大ヤコブの遺骨。キリスト教世界の各地から巡礼者を引きつけている。"
 artifact_relic_mark_name: "聖マルコの頭部"
 artifact_relic_mark_desc: "アレクサンドリア教会の創立者である福音記者マルコの切断された頭部。"
 artifact_relic_lance_antioch_name: "アンティオキアの聖槍"
 artifact_relic_lance_antioch_desc: "キリストの脇腹を突いたとされる鉄の槍先。"
 artifact_relic_tabot_name: "契約のタボット"
 artifact_relic_tabot_desc: "契約の箱を象徴する聖別された石板。エチオピアの最も神聖な聖遺物として崇敬されている。"
 artifact_relic_nine_saints_name: "九聖人の骨"
 artifact_relic_nine_saints_desc: "九聖人の遺骨。カルケドン公会議の論争からアクスムに逃れ、エチオピア初の修道院を創立して高地に合性論派キリスト教を根づかせたシリア人修道士。"
 artifact_relic_thomas_name: "使徒トマスの聖遺物"
 artifact_relic_thomas_desc: "使徒トマスの遺骨と血に染まった槍先。彼はケーララに信仰をもたらし、そこで殉教したとされている。"
 artifact_relic_augustine_pallium_name: "聖アウグスティヌスのパリウム"
 artifact_relic_augustine_pallium_desc: "初代大司教にしてイングランドへの使徒であるカンタベリーのアウグスティヌスが着用したパリウム。"
 artifact_relic_three_magi_name: "東方の三博士の聖遺物"
 artifact_relic_three_magi_desc: "星に従ってベツレヘムへと向かった三賢者の遺骨。"
 artifact_relic_becket_name: "聖トマス・ベケットの聖遺物"
 artifact_relic_becket_desc: "トマス・ベケットの血に染まった衣服と頭蓋骨。1170年に自身の大聖堂で殉教し、直ちにイングランド・キリスト教世界の偉大な聖人として讃えられた。"
 artifact_relic_ursula_name: "聖ウルスラの骨"
 artifact_relic_ursula_desc: "ウルスラと彼女に同行した処女殉教者たちの遺骨。ケルンの墓地から発掘された。"
 artifact_relic_ignatius_name: "聖イグナティウスの骨"
 artifact_relic_ignatius_desc: "アンティオキアの第2代総主教であり使徒ヨハネの弟子であるイグナティウスの遺骨。トラヤヌスの治下にローマで殉教した。"
 # Islamic
 artifact_relic_black_stone_name: "黒石のかけら"
 artifact_relic_black_stone_desc: "カアバの黒石から切り出され磨かれた黒い破片。預言者自らが口づけし、すべてのハッジ巡礼者から崇敬されている。"
 artifact_relic_dhulfiqar_name: "ズルフィカール"
 artifact_relic_dhulfiqar_desc: "預言者の二叉の剣。預言者自身からアリーに贈られたとされ、神の承認を受けた統治の証としてイスラム共同体全体で崇敬されている。"
 artifact_relic_buraq_footprint_name: "ブラークの足跡"
 artifact_relic_buraq_footprint_desc: "預言者がエルサレムの礎石から天へ昇った際、ブラークが残した蹄跡が刻まれた石。"
 artifact_relic_sword_of_ali_name: "アリーの剣"
 artifact_relic_sword_of_ali_desc: "バドルとスィッフィーンの戦いでアリー・イブン・アビー・ターリブが振るったと信じられている刀剣。"
 artifact_relic_abu_hanifa_turban_name: "アブー・ハニーファのターバン"
 artifact_relic_abu_hanifa_turban_desc: "ハナフィー派の創始者アブー・ハニーファ・アン＝ヌウマーンの学者のターバン。すべてのハナフィー派巡礼者にとってスンナ派法学の柱となっている。"
 artifact_relic_prophet_sandals_name: "預言者のサンダル"
 artifact_relic_prophet_sandals_desc: "預言者が着用したとされる革製のサンダル。イスラム共同体の敬虔な職人たちによってそのナール（サンダル）の形を模して数え切れないほど複製されている。"
 # Jewish
 artifact_relic_western_wall_name: "嘆きの壁の石"
 artifact_relic_western_wall_desc: "第二神殿の基壇の西側の壁から切り出された加工石。西暦70年のローマによる神殿破壊の後も現存する数少ない遺構の一つ。"
 artifact_relic_tablets_name: "石板のかけら"
 artifact_relic_tablets_desc: "モーセが怒りに任せてシナイ山で十戒の石板を投げ落とした際、そこから欠け落ちたとされる石の破片。"
 # Buddhist
 artifact_relic_bodhi_leaf_name: "菩提樹の葉"
 artifact_relic_bodhi_leaf_desc: "ブッダガヤの菩提樹から採取され、保存された葉。この菩提樹の下でブッダが悟りを開いた。"
 artifact_relic_vajrasana_name: "金剛座のかけら"
 artifact_relic_vajrasana_desc: "金剛座の磨かれた破片。これは菩提樹の下の金剛の座であり、ブッダが悟りの瞬間まで微動だにせず座っていた場所である。"
 artifact_relic_dhamek_name: "ダメーク仏塔の仏舎利"
 artifact_relic_dhamek_desc: "最初の弟子たちに法を説いたサールナートに由来する、ブッダの聖遺物。"
 artifact_relic_jowo_name: "ジョウォ・シャキャムニ"
 artifact_relic_jowo_desc: "中国からもたらされた若き日のブッダの聖像。チベット人に最も神聖な仏像とされている。"
 artifact_relic_sacred_tooth_name: "ブッダの聖歯"
 artifact_relic_sacred_tooth_desc: "ブッダの左の犬歯。4世紀にカリンガからもたらされた王権の守護の象徴（パラディウム）であり、これを所有することは、他の誰よりも正統な統治者であることの証となる。"
 # Hindu
 artifact_relic_lingam_name: "ヴィシュヴァナート・リンガ"
 artifact_relic_lingam_desc: "ガンジス沿いの最も神聖な都市、ヴァーラーナシーの大寺院のシヴァ・リンガに由来する神聖な破片。"
 artifact_relic_trishul_name: "シヴァのトリシュール"
 artifact_relic_trishul_desc: "シヴァ神自身が振るったとされる三叉槍。創造・維持・破壊に対する神の支配の象徴である。"
 artifact_relic_krishna_stone_name: "クリシュナ誕生の石"
 artifact_relic_krishna_stone_desc: "マトゥラーのクリシュナ・ジャンマブーミにある風化した石。伝承がクリシュナの生誕地とする、まさにその場所のものである。"
 artifact_relic_rama_footprint_name: "ラーマの足跡"
 artifact_relic_rama_footprint_desc: "ラーマ自身の足跡が残る石。彼の生誕地であるアヨーディヤーからもたらされた。"
 # Jain
 artifact_relic_palitana_tirtha_name: "パリタナのティールタ"
 artifact_relic_palitana_tirtha_desc: "ジャイナ教において最も神聖なティールタ（聖地）であるパリタナのシャトルンジャヤの丘から採られた、聖なる石。"
 artifact_relic_parshvanatha_paduka_name: "パールシュヴァナータのチャラン・パドゥカ"
 artifact_relic_parshvanatha_paduka_desc: "チャラン・パドゥカ——第23代ティールタンカラであるパールシュヴァナータの足跡が刻まれた石。"
 artifact_relic_shikharji_nishidhi_name: "ティールタンカラのニシディ"
 artifact_relic_shikharji_nishidhi_desc: "24人のティールタンカラのうち20人がモクシャ（解脱）に達したサムメッド・シカール山の峰々からもたらされた、ニシディ（記念石）。ジャイナ教で最も神聖なティールタである。"
 # Zoroastrian
 artifact_relic_atash_bahram_name: "アドゥール・ファルンバーグの残り火"
 artifact_relic_atash_bahram_desc: "火の神殿で今なお守りつづけられている、偉大なアタシュ・バフラム（神聖なる祭司の火）から運ばれた、赤く燃え続ける残り火。"
 # Norse
 artifact_relic_yggdrasil_branch_name: "ユグドラシルの枝"
 artifact_relic_yggdrasil_branch_desc: "ウプサラの神殿の聖なる木から落ちたと伝えられる枝。この聖なる木には、生贄として屠られた動物の死骸が今もなお吊るされている。"
 # Slavic
 artifact_relic_perun_idol_name: "ペルーンの像"
 artifact_relic_perun_idol_desc: "スラヴの神々の主である雷神ペルーンの木像。ウラジーミル公によって建てられた。"
 # Tengri
 artifact_relic_suldetug_name: "スゥルデ・トゥグ"
 artifact_relic_suldetug_desc: "戦神の精霊を宿すヤクの尾で作られた黒い旗で、軍勢を率いるステップのハンのすぐ前に掲げられる。"
 # Shinto
 artifact_relic_yata_kagami_name: "八咫鏡"
 artifact_relic_yata_kagami_desc: "青銅鏡。伝統的に三種の神器の一つとされ、天照大御神をその岩戸から連れ出したとされる。"
 artifact_relic_shin_no_mihashira_name: "心御柱"
 artifact_relic_shin_no_mihashira_desc: "心御柱の木片。内宮の最も奥の聖域に埋設された神聖な中央の柱であり、伊勢神社の秘儀の中で最も秘匿され、神聖視されており、式年遷宮のたびに新しく建て替えられる。"
 # Confucian
 artifact_relic_kong_tomb_name: "孔子の墓の碑文"
 artifact_relic_kong_tomb_desc: "曲阜にある孔子の墓の彫刻された石碑。孔子一族によって代々崇敬されてきた。"
 artifact_relic_analects_name: "孔子の『論語』"
 artifact_relic_analects_desc: "孔子の言行録である『論語』の初期の竹簡の写本。何世代にもわたり中国の学者たちによって研究されてきた。"
 # Hellenic
 artifact_relic_athena_promachos_name: "アテナ・プロマコスの像のかけら"
 artifact_relic_athena_promachos_desc: "かつてアクロポリスを見守っていたアテナの巨大像の青銅の破片。"
 # West African
 artifact_relic_opa_oranmiyan_name: "オパ・オランミヤン"
 artifact_relic_opa_oranmiyan_desc: "伝説の王オランミヤンの花崗岩製の杖。ヨルバの祖先の発祥の地であるイフェの神聖な大地に据えられている。"
 artifact_relic_oshe_shango_name: "オシェ・シャンゴ"
 artifact_relic_oshe_shango_desc: "オシェ・シャンゴ——嵐の神シャンゴの双子の雷石を模して鋳造された双頭の斧。祭司たちが狂喜の踊りの中で頭上に掲げる。"
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "神聖な像"
 artifact_misc_relic_idol_desc: "彫像。儀式の間、神が宿る肉体的な座である。"
 artifact_misc_relic_stele_name: "祖先の石碑"
 artifact_misc_relic_stele_desc: "祭司団の系譜が刻まれた石板。世代を超えた証である。"
 artifact_misc_relic_mask_name: "儀式の仮面"
 artifact_misc_relic_mask_desc: "最も重要な儀式で着用される仮面。神の臨在を宿す器である。"
 artifact_misc_relic_banner_name: "聖なる旗"
 artifact_misc_relic_banner_desc: "聖地でのあらゆる偉大な儀式を司ってきた聖別された旗。その布地には供物の煙が染み込んでいる。"
