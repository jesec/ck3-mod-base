 creature_type_lion_desc: "百獣の王にして、勇敢さの象徴——ではあるが、今や鎖につながれ、屈服させられている。檻の中で、鎖の届く範囲を行ったり来たりしている。"
 creature_type_caracal_desc: "大型の猫に似た生き物。檻の中をうろつき回り、飾りとして中に置かれたものを片っ端から引き裂いている。"
 creature_type_lynx_desc: "臆病でずんぐりしたネコ科動物。耳を伏せて身を低くし、足場の周囲を落ち着きなく見回している。"
 creature_type_tiger_desc: "恐るべき獣にして、山の動物たちの王。その怒りをかき立てるのは容易く、牙をむき出しにして来訪者を震え上がらせる。"
 creature_type_leopard_desc: "しなやかで優美、そして同じほどに危険な獣。辛抱強く狡猾な生き物で、目を見張る跳躍力を備えている。"
 creature_type_bear_desc: "獰猛な熊。絶えず餌を探して、のしのしと歩き回っている。その巨大な前脚は、小枝を折るようにたやすく骨を砕く。"
 creature_type_elephant_desc: "一見すると穏やかな巨獣。その鼻は驚くほど器用で、来訪者たちを驚かせ、喜ばせている。"
 creature_type_peacock_desc: "誇り高く威厳ある鳥。特徴的な鳴き声を持ち、どんな庭園においてもひときわ華やかな存在となる。"
 creature_type_parrot_desc: "人の声をまねることができる、活発な鳥。客人をもてなす際には、なかなか気の利いた芸を見せてくれる。"
 creature_type_crane_desc: "軽やかな翼を持つ、気高き動物。幸運と不老の象徴である。"
 creature_type_cockatoo_desc: "鮮やかな羽毛と、機敏で鋭い目を持つ色彩豊かな鳥。"
 creature_type_monkey_desc: "人懐っこい猿。愛らしい伴侶であり、人間めいた仕草や表情で見る者を楽しませてくれる。"
 creature_type_lion_reforged_desc: "百獣の王にして、勇敢さの象徴。$creature_history_entry$"
 creature_type_caracal_reforged_desc: "獰猛な生き物。$creature_history_entry$"
 creature_type_lynx_reforged_desc: "房毛のある耳を持つ、大型のネコ科動物。$creature_history_entry$"
 creature_type_tiger_reforged_desc: "恐るべき獣にして、山の動物たちの王。$creature_history_entry$"
 creature_type_leopard_reforged_desc: "斑点模様を持つ大型のネコ科動物。$creature_history_entry$"
 creature_type_bear_reforged_desc: "獰猛な熊。$creature_history_entry$"
 creature_type_elephant_reforged_desc: "一見すると穏やかな巨獣。$creature_history_entry$"
 creature_type_peacock_reforged_desc: "誇り高く威厳ある鳥。$creature_history_entry$"
 creature_type_parrot_reforged_desc: "色鮮やかな異国の鳥。$creature_history_entry$"
 creature_type_crane_reforged_desc: "幸運と繁栄の象徴。$creature_history_entry$"
 creature_type_cockatoo_reforged_desc: "鮮やかな羽毛を持つ鳥。$creature_history_entry$"
 creature_type_monkey_reforged_desc: "好奇心旺盛な動物。$creature_history_entry$"
 creature_history_entry: "かつては[artifact.MakeScope.Var('og_owner').Char.GetHouse.GetNameNoTooltip]家の動物園で飼われており、その姿を目にした者すべてを喜ばせ、畏敬の念を抱かせていた。"
