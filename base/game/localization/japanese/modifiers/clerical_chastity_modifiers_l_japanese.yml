l_japanese:
 clerical_chastity_vow_modifier: "聖職者に強いられた貞潔の誓い"
 clerical_chastity_vow_modifier_desc: "この人物は自分の意思ではなく、聖職者に迫られて貞潔を誓わされた。その誓いが有効である限り、誘惑や求愛をすることはできない。"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier: "破られた聖なる約束"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier_desc: "公に立てた貞潔の誓いを放棄したため、この人物は[clergy|E]から疑いの目を向けられている。"
