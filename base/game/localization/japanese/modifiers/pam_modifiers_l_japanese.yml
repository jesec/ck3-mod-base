l_japanese:
 christian_fulfillment_level_0: "絶望"
 christian_fulfillment_level_1: "孤絶"
 christian_fulfillment_level_2: "苦悩"
 christian_fulfillment_level_3: "悔悟"
 christian_fulfillment_level_4: "赦免"
 christian_fulfillment_level_5: "安寧"
 christian_fulfillment_level_6: "恩寵"
 default_fulfillment_level_0: "迷走"
 default_fulfillment_level_1: "模索"
 default_fulfillment_level_2: "信心"
 default_fulfillment_level_3: "敬虔"
 default_fulfillment_level_4: "安穏"
 industrious_junior_members_modifier: "勤勉な見習い修道者"
 foolish_convert_modifier: "愚かな改宗者"
 foolish_convert_modifier_desc: "この愚者は軽率にも全く異なる信仰体系を持つ[rite|E]への改宗を決めてしまったため、新しい信仰生活への適応にひどく苦労している。"
 reckless_convert_modifier: "無謀な改宗者"
 reckless_convert_modifier_desc: "この人物は、十分な準備もせずに全く異なる信仰体系を持つ[rite|E]への改宗を決めてしまったため、新しい信仰生活への適応に苦労している。"
 informed_convert_modifier: "有識の改宗者"
 informed_convert_modifier_desc: "この人物は、異なる信仰体系を持つ[rite|E]への改宗を決断し、この決断がもたらす新たな試練に十分備えている。"
 study_faith_learning_mannerism: "作法の習得"
 study_faith_learning_mannerism_desc: "効率的ではないものの、[rite|E]にまつわる作法や外面的な儀礼を学ぶことは、長い目で見れば具体的な成果につながる可能性がある。"
 study_faith_newfound_coherence: "新たな一貫性"
 study_faith_newfound_coherence_desc: "この[rite|E]の研究でこれまでに見つかった矛盾は、障害ではなくむしろ手がかりとなった。二つの信仰体系の違いを照らし合わせることで、研究対象の[core_tenets|E]や[doctrines|E]の真の意味をより深く理解できるようになった。"
 study_faith_cautious_studies: "慎重な研究"
 study_faith_cautious_studies_desc: "この[rite|E]は、時間をかけてじっくりと研究した方がいい。不快に感じられる解釈を理解しやすい形に再構成しつつ、異質な思考様式に慣れるために、十分な時間を取るべきである。"
 study_faith_slow_and_steady: "習得が遅い人物"
 study_faith_slow_and_steady_desc: "この人物は、数々の馴染みのない慣習に圧倒され、その知識を吸収しようとすることが精神的な負担となっている。"
 study_faith_cramming_side_studies: "詰め込み学習"
 study_faith_cramming_side_studies_desc: "この人物は、この[rite|E]の内的な仕組みに深く没頭しており、他の用事がある時でさえ、学んだことを書きつけている姿が頻繁に見られる。"
 followers_of_dead_faith_scheme_modifier: "時とともに失われた知識"
 followers_of_dead_faith_scheme_modifier_desc: "この[faith|E]はもはや公然とは信仰されておらず、信者を探すのは極めて困難である。"
 appealing_theology_modifier: "魅力的な神学"
 appealing_theology_modifier_desc: "この人物は、ひときわ魅力を感じる異国の神学文献を発見した。"
 suspicions_of_heresy_modifier: "異端の疑い"
 suspicions_of_heresy_modifier_desc: "この人物は、しばしば異国の神学書を読んでいるところを目撃されており、信仰心に疑念を抱かれている。"
 monastic_onslaught_modifier: "修道院の設立"
 monastic_onslaught_modifier_desc: "世俗の後援者から多大な支援を受けている修道会が、地域の経済活動を牽引している。"
 pam_monastic_order_improvement_modifier: "修道者の助け"
 pam_monastic_order_improvement_modifier_desc: "修道会が労働力と助言によって、この伯爵領を支援している。"
 pam_military_order_improvement_modifier: "祝福された武器"
 pam_military_order_improvement_modifier_desc: "騎士修道会の戦士たちが地元の徴募兵を訓練し、この伯爵領での規律を強化している。"
 pam_tithes_or_mercy_harsh_tithes_modifier: "強制的な十分の一税"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "十分の一税の苛烈な取り立てにより、地元の共同体は大君主に対して強い不満を抱いている。"
 pam_tithes_or_mercy_show_mercy_modifier: "寛大な十分の一税"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "税の徴収を寛大にしたことで、地元の共同体からの信頼と好意が向上した。"
 pam_blissful_harmony_gospel_modifier: "善き生活の福音"
 pam_blissful_harmony_gospel_modifier_desc: "この統治者の説教は、平和、敬虔さ、そして規律ある生活を称えている。"
 pam_blissful_harmony_restless_ambition_modifier: "飽くなき欲求"
 pam_blissful_harmony_restless_ambition_modifier_desc: "至福の瞬間を体験したこの人物は、渇望に突き動かされて落ち着きを失っている。"
 pam_stone_for_god_estate_build_discount_modifier: "神の家の石材"
 pam_stone_for_god_estate_build_discount_modifier_desc: "この人物の建築家としての鑑識眼が、石材の調達を可能にした。"
 pam_relocating_faithfuls_to_frontiers: "信徒の辺境移住"
 pam_relocating_faithfuls_to_frontiers_desc: "この伯爵領は、同じ[rite|E]の信徒に対し、別の[realm|E]へ移住して布教を行うことを奨励している。"
 pam_moving_faithfuls_to_frontiers: "信徒の流入"
 pam_moving_faithfuls_to_frontiers_desc: "この伯爵領には、異なる[faith|E]の信徒が移り住み、布教活動を行っている。\n#weak これにより、「#V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#!」の[interaction|E]コストが低下する。#!"
 pam_building_new_shrines: "新たな聖堂の建設"
 pam_building_new_shrines_desc: "この伯爵領には、異なる[faith|E]の信徒が移り住み、新たな聖堂を建設している。\n #weak これにより、「#V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#!」の[interaction|E]コストが低下する。#!"
 pam_grand_cathedral_started_modifier: "大聖堂の建設開始"
 pam_grand_cathedral_started_modifier_desc: "この人物は、大聖堂の建設に必要な資源を結集させ、作業を開始した。幾世代にも及ぶこの大事業は、すでに神への篤い信仰の証となっている。"
 pam_grand_cathedral_completed_modifier: "大聖堂の建設完了"
 pam_grand_cathedral_completed_modifier_desc: "この人物は、大聖堂の建設に必要な資源を結集させ、作業を完了した。幾世代にも及ぶこの大事業は、神への篤い信仰の証となっている。"
 pam_grand_cathedral_02_started_modifier: "大聖堂の拡張工事"
 pam_grand_cathedral_02_started_modifier_desc: "この人物は資源を結集させ、既存の大聖堂をさらなる高みへと引き上げた。幾世代にも及ぶこの大事業は、神への篤い信仰の証となっている。"
 pam_grand_cathedral_02_completed_modifier: "大聖堂の拡張完了"
 pam_grand_cathedral_02_completed_modifier_desc: "この人物は大聖堂の拡張を監督した。"
 pam_grand_cathedral_family_contributed_south_modifier: "大聖堂の礼拝堂への寄進"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "この王朝の一員は、大聖堂の礼拝堂の建設に必要な資金を援助した。幾世代にも及ぶこの大事業は、神への篤い信仰の証となっている。"
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "大聖堂地下室の後援者"
 pam_cathedral_founder_crypt_modifier_desc: "この人物は自身の王朝のための地下室を大聖堂の地下に建設する資金を提供した。"
 pam_cathedral_bell_cracked_lesson_modifier: "割れた鐘の教訓"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "この伯爵領の石工たちは、鐘の鋳造失敗という恥をそそぐため、より慎重に作業している。"
 pam_cathedral_bell_bronze_torture_implements_modifier: "青銅の拷問具"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "鋳造に失敗した聖堂の鐘の青銅屑は、改鋳されて恐怖の道具に作り直され、鐘職人がその最初の犠牲者になった。職人たちは今や、失敗の代償を知っている。"
 pam_cathedral_treadwheel_crane_modifier: "踏車式クレーン"
 pam_cathedral_treadwheel_crane_modifier_desc: "聖堂の建設現場で使われていた巨大な踏車式クレーンが首都に設置された。"
 pam_cathedral_cantoria_scam_modifier: "暴かれた策略"
 pam_cathedral_cantoria_scam_modifier_desc: "詐欺の策略を暴いたことで、建設者たちは心機一転し、無駄を減らして迅速に作業を進めている。"
 pam_cathedral_famed_choir_boy_modifier: "宮廷に響く天使の歌声"
 pam_cathedral_famed_choir_boy_modifier_desc: "この世のものとは思えない美声を持つ聖歌隊の少年が、この宮廷に優雅さをもたらしている。"
 pam_cathedral_sermon_peace_county_modifier: "平和の説教"
 pam_cathedral_sermon_peace_county_modifier_desc: "新設された大聖堂の入口で統治者が行った説教により、この伯爵領の人々はより満ち足り、巡礼者たちはより安全に街道を行き交うことができる。"
 pam_cathedral_sermon_peace_ruler_modifier: "平和への導き"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "この統治者は、キリストの平和について説いた大聖堂の説教に心を動かされた。"
 pam_cathedral_sermon_diligence_county_modifier: "勤勉の説教"
 pam_cathedral_sermon_diligence_county_modifier_desc: "新設された大聖堂の入口で統治者が行った説教により、教会の建築家や石工たちは意欲を高め、勤勉に作業にいそしんでいる。"
 pam_cathedral_sermon_diligence_ruler_modifier: "勤勉への導き"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "この統治者は、神聖な労働について説いた大聖堂の説教に心を動かされた。"
 pam_cathedral_sermon_unity_county_modifier: "結束の説教"
 pam_cathedral_sermon_unity_county_modifier_desc: "新設された大聖堂の入口で統治者が行った説教により、この伯爵領の人々の服従心は確固たるものになった。"
 pam_cathedral_sermon_unity_ruler_modifier: "協調への導き"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "この統治者は、キリスト教の同胞愛について説いた大聖堂の説教に心を動かされた。"
 pam_cathedral_sermon_charity_county_modifier: "慈善の説教"
 pam_cathedral_sermon_charity_county_modifier_desc: "新設された大聖堂の入口で統治者が行った説教により、この伯爵領の人々の心が温まり、財布の紐が緩んだ。"
 pam_cathedral_sermon_charity_ruler_modifier: "慈善への導き"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "この統治者は、寛大な慈悲について説いた大聖堂の説教に心を動かされた。"
 pam_cathedral_sermon_perseverance_county_modifier: "忍耐の説教"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "新設された大聖堂の入口で統治者が行った説教により、この伯爵領では敬虔な努力と秩序ある発展が蘇った。"
 pam_cathedral_sermon_perseverance_ruler_modifier: "熱意への導き"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "この統治者は、信仰の道を走り抜くべしと説いた大聖堂の説教に心を動かされた。"
 pam_cathedral_sermon_rejoice_county_modifier: "歓喜の説教"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "新設された大聖堂の入口で統治者が行った説教により、信徒たちは主の変わらぬ愛への希望で鼓舞された。"
 pam_cathedral_sermon_rejoice_ruler_modifier: "喜びへの導き"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "この統治者は、主にあって喜ぶことを説いた大聖堂の説教に心を動かされた。"
 pam_cardinal_order_improve_development_modifier: "枢機卿への開発促進命令"
 pam_cardinal_order_improve_development_modifier_desc: "上位者の命令により、枢機卿が大司教区の発展を促進する。"
 pam_cardinal_order_convert_faith_modifier: "枢機卿への改宗促進命令"
 pam_cardinal_order_convert_faith_modifier_desc: "上位者の命令により、枢機卿が大司教区および隣接する土地の改宗を促進する。\n\n$EFFECT_LIST_BULLET$この[county|E]の[convert_county|E]：#P +25%#!"
 pam_cardinal_order_increase_control_modifier: "枢機卿への伯爵領の統制強化命令"
 pam_cardinal_order_increase_control_modifier_desc: "上位者の命令により、枢機卿が大司教区内の民衆を鎮める。"
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "枢機卿への文化志向の加速命令"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "上位者の命令により、枢機卿が新技術の研究を加速させる。"
 pam_cardinal_order_improve_epidemic_resistance_modifier: "枢機卿への疫病耐性の向上命令"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "上位者の命令により、枢機卿が教会の資源を動員し、疫病対策を支援する。"
 pam_cardinal_order_improve_legitimacy_modifier: "枢機卿への正統性の向上命令"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "上位者の命令により、枢機卿が大司教区における統治者の正統性を高めようとする。"
 pam_cardinal_order_undermine_legitimacy_modifier: "枢機卿への正統性の毀損命令"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "上位者の命令により、枢機卿が大司教区における統治者の正統性を損なわせようとする。"
 heathen_mandate_modifier: "異教徒による正統性の説教"
 heathen_mandate_modifier_desc: "異教徒の統治者に仕える聖職者たちが、この地の人々の魂は自分たちのものだと主張している。邪教を根拠とする、不届きな主張である。"
 pam_recently_baptized_at_domicile_modifier: "洗礼直後"
 pam_recently_baptized_at_domicile_modifier_desc: "この人物は、自らの大司教区の大聖堂複合施設の洗礼堂で洗礼を受けた。"
 pam_khachkar_ancestral_county: "先祖のハチュカル"
 pam_khachkar_ancestral_county_custom_desc: "[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed]のために、[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetHerHis]の[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]によって建立された"
 pam_denied_new_pope_modifier: "新教皇を拒否"
 pam_denied_new_pope_modifier_desc: "この人物は新たに選出された教皇の承認を拒否した。"
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "聖別された名声"
 pam_dulia_relic_piety_per_dread_modifier: "殉教者の威光"
 pam_dulia_relic_piety_per_knight_modifier: "軍隊への祝福"
 pam_dulia_relic_stress_loss_per_piety_modifier: "慰めの恩寵"
 pam_dulia_relic_piety_per_legitimacy_modifier: "聖人からの塗油"
 pam_dulia_relic_learning_per_piety_modifier: "啓発された献身"
 pam_dulia_relic_monthly_piety_modifier: "恩寵の泉"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "信条の調停者"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "この人物は、公会議での議論が始まるよりも前に、信条の文言をめぐる論争を解決に導いた。"
 pam_ecumenical_council_primacy_upheld_modifier: "優位性の維持"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "この人物は公会議の席で、信仰の諸教会がどの権威の管轄下にあるのかと問われ、議長の座からその問いに決着をつけた。"
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "新たな仲介者"
 pam_dulia_new_saint_modifier_desc: "この人物は、最近の新たな聖人の宣言に触発されている。"
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "すべての総主教座を巡った者"
 pam_pilgrim_of_every_holy_site_modifier_desc: "この人物は、自らの信仰のすべての聖地で祈りの夜を過ごした。"
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "守られし絆"
 tenet_harmonious_society_five_bonds_modifier_desc: "君臣、父子、夫婦、長幼、朋友。この人物は、この五倫のうちの一つを正しく保っている。"
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "叙階の系譜"
 tenet_apostolic_succession_episcopate_modifier_desc: "この人物の信仰では、先任の司教から途切れることなく続く系譜を通じて各司教が叙階される。これは古くから尊ばれてきた正統性の源である。"
 modifier_definition_value_per_theocratic_vassal: "\t#weak [theocratic_vassal|E]1人につき増加（最大[EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')]）#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "信徒の聖歌"
 tenet_divine_liturgy_choirs_modifier_desc: "この人物の教会では、何世代にもわたって変わることなく、同じ時刻に同じ言葉が歌われている。"
 modifier_definition_value_per_held_temple: "\t#weak 領有する[temple_holding|E]1つにつき増加（最大[EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')]）#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "見事な司式"
 tenet_divine_liturgy_officiant_modifier_desc: "この人物は、自身の信仰における聖体礼儀を極めて真剣に受け止めている。"
 tenet_divine_liturgy_schola_cantorum_modifier: "スコラ・カントルム"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "聖歌の学校を支援する主君は、聞く価値のある典礼学者を抱える。"
 tenet_pentarchy_holy_site_modifier: "総主教座の管轄区"
 tenet_pentarchy_holy_site_modifier_desc: "この伯爵領の聖地は、信徒たちの管理のお陰で栄えている。"
 tenet_polyamory_new_beloved_modifier: "新しい愛の輝き"
 tenet_polyamory_new_beloved_modifier_desc: "新たに意中の人ができ、この人物は天にも昇る心地でいる。"
 modifier_definition_value_per_chaplain_learning: "\t#weak [court_chaplain|E]の[learning|E]1ポイントにつき増加（最大[EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')]）#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "残された償い"
 tenet_purgatory_sin_penalty_modifier_desc: "告解した罪は赦される。だが、その罪が招いた罰まで免れるわけではない。この世で果たさなかった償いは、来世で求められる。この人物がどちらを選んだのかは、信徒の目にも明らかである。"
 tenet_original_sin_sinners_insight_modifier: "罪人の知見"
 tenet_original_sin_sinners_insight_modifier_desc: "罪の重みを背負う者は、他人が隠す罪のありかをよく理解している。"
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
