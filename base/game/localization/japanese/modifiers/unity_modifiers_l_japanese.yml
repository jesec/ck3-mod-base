l_japanese:
 unity_antagonistic_maa_modifier: "忠実な軍の将校"
 unity_antagonistic_maa_modifier_desc: "この家の成員は、軍内の部隊を強化するために資源を集めた。\n\n"
 unity_competitive_spies_modifier: "策略網"
 unity_competitive_spies_modifier_desc: "この家の成員は互いに策略を共有し、自分たちの家だけの諜報網を築いている。\n\n"
 unity_competitive_spies_landless_merchant_modifier: "策略網"
 unity_competitive_spies_landless_merchant_modifier_desc: "この家の成員は互いに策略を共有し、自分たちの家だけの諜報網を築いている。\n\n"
 unity_impassive_tax_modifier: "改善された行政"
 unity_impassive_tax_modifier_desc: "この一族の者たちは行政の効率化の恩恵を受けている。\n\n"
 unity_friendly_bailiff_modifier: "強制的な廷吏"
 unity_friendly_bailiff_modifier_desc: "この家の成員は、主君と協力して領国全体の腐敗を減らそうとする。\n\n"
 unity_harmonious_placation_modifier: "鎮静化"
 unity_harmonious_placation_modifier_desc: "この家の成員は、主君の統治権を調和的に再確認した。\n\n"
 unity_house_organized_for_war_modifier: "戦争のため組織化した"
 unity_house_organized_for_war_modifier_desc: "この家の成員は皆、戦争の遂行を決意した。\n[rulers|E]は[warlike_i|E][ai_warlike_personality|L][economical_archetype|E]を採用する"
 unity_house_focused_on_economy_modifier: "経済の奨励"
 unity_house_focused_on_economy_modifier_desc: "この家の成員は、非常に熱心に経済を改善させている。\n[rulers|E]は[builder_i][ai_economical_boom_personality|L][economical_archetype|E]を採用する"
 unity_house_focused_on_diplomacy_modifier: "外交的努力"
 unity_house_focused_on_diplomacy_modifier_desc: "この家の成員は協力して効率的に影響力を行使している。"
 fp3_unity_promoted_prosperity_modifier: "繁栄の促進"
 fp3_unity_promoted_prosperity_modifier_desc: "この家の成員は、自分たちの土地開発のために協力している。"
 fp3_unity_improved_logistics_modifier: "共通の軍事物流"
 fp3_unity_improved_logistics_modifier_desc: "この家の成員は、軍の物流と物資を共有している。"
 unity_family_business_landless_merchant_modifier: "家業の組織化"
 unity_family_business_landless_merchant_modifier_desc: "この家の荘園は活気に満ち、その成員たちによって指示が忠実に遂行されている。\n\n"
 unity_regional_networks_landless_merchant_modifier: "地域の交易網"
 unity_regional_networks_landless_merchant_modifier_desc: "この家の成員がそれぞれ営むさまざまな事業は、家長によって承認されている。\n\n"
 unity_merchant_development_modifier: "開発の促進"
 unity_merchant_development_modifier_desc: "この伯爵領を拠点とする交易商人たちは、その都市開発を促進している。\n\n"
 unity_merchant_bailiffs_modifier: "都市の執行官"
 unity_merchant_bailiffs_modifier_desc: "この伯爵領を拠点とする交易商人たちは、法と秩序を促進している。\n\n"
 unity_merchant_prosperity_modifier: "共同体の支援"
 unity_merchant_prosperity_modifier_desc: "この共同体では、地元の交易商人たちがその富を慈善事業に投じて、すべての人々の暮らしを向上させている。"
 MODIFIER_DEFINITION_VALUE_PER_MERCHANT_UNITY_MEMBER: " \t#weak [house|E]の成員ごとに増加#!"
 MODIFIER_DEFINITION_MAIN_DESC_HOUSE_UNITY_LANDESS_MERCHANT: "この補正は、独立した[merchant|E]または[court_position|E]保有者である[house|E]の成員ごとに増加する（#bold $MULTIPLIER|0$#!/#bold 10#!）"
 unity_promoting_diligence_modifier: "勤勉さの奨励"
 unity_promoting_diligence_modifier_desc: "この家門の者は、商いの腕を磨き、商会の利益を伸ばすべく、帳簿をめくってはあらゆる好機を追い求め、骨身を惜しまず働くことを求められている。\n\n"
 unity_promoting_excess_modifier: "贅沢の奨励"
 unity_promoting_excess_modifier_desc: "この家門の者は、贅沢な娯楽に惜しみなく金を使うことで、自らの評判と商会の威信を高めている。\n\n"
