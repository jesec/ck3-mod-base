l_japanese:
 request_clerical_chastity_interaction: "貞潔の誓いを要求"
 request_clerical_chastity_interaction_desc: "[recipient.GetShortUINameNoTooltip]に[recipient.GetFaith.HighGodName]の前で貞潔の誓いを立てるよう求める。[recipient.GetSheHe]が受け入れた場合、誓いが終わるか放棄されるまで、[recipient.GetSheHe]は長期的な[fertility|E]ペナルティを受け、誘惑や求愛を開始できない。"
 request_clerical_chastity_notification_text: "[actor.GetFaith.HighGodName]の前で誓いを立て、肉欲を戒める。従順なる誓いは[actor.GetFaith.GetAdjectiveNoTooltip]の信仰に誉れをもたらすだろう。"
 clerical_chastity_offer_piety: "敬虔点を捧げる"
 clerical_chastity_recipient_must_be_in_reach_tt: "あなたは[head_of_faith|E]であるか、[duchy|E]以上の[title|E]を保持している必要がある。ただし、[recipient.GetShortUINameNoTooltip]があなたの[county|E]に隣接する[county|E]を個人で所有している場合は除く。"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip]は[head_of_faith|E]であるか、[duchy|E]以上の[title|E]を保持している必要がある。ただし、[recipient.GetShortUINameNoTooltip]が[puppet_or_actor.GetShortUINamePossessiveNoTooltip]の[county|E]に隣接する[county|E]を個人で所有している場合は除く。"
 clerical_chastity_vow_blocks_scheme_tt: "あなたは[GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|L]に縛られていてはならない"
 request_clerical_chastity_actor_toast: "要求を受諾した"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUIName]の要求を受諾した"
 request_clerical_chastity_recipient_toast: "貞潔を誓った"
 request_clerical_chastity_decline_actor_toast: "要求を拒否した"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName]は、[puppet_or_actor.GetShortUIName]の要求を拒否した"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName( recipient.Self )]は我が[faith|E]において美徳である：$VALUE|=+0$"
 clerical_chastity_ai_rival: "[actor.GetShortUINameNoTooltip|U]の好敵手：$VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[realm_capital|E]が我が[clerical_region|E]内にある：$VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "追加で捧げられた[piety|E]：$VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[recipient.GetSheHe|U]は[recipient.GetTitleAsNameNoTooltip|U]である：$VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "貞潔の誓いを放棄"
 renounce_clerical_chastity_vow_decision_confirm: "誓いを放棄する"
 renounce_clerical_chastity_vow_decision_desc: "聖職者に貞潔を求められたため、私はこの誓いを立てた。この誓いを捨てることはできるが、神聖な約束を破れば[piety|E]を失い、良心の呵責に苦しむことになる。"
 renounce_clerical_chastity_vow_decision_tooltip: "期限を迎える前に誓いを終了する。[piety|E]を失い、[stress|E]を受け、10年間[clergy_opinion|E]が低下する。"
 renounce_clerical_chastity_vow_toast: "誓いを放棄した"
 renounce_clerical_chastity_vow_toast_desc: "貞潔の誓いを放棄した。"
 clerical_chastity_vow.0001.toast_released: "誓いが終了した"
 clerical_chastity_vow.0001.toast_released_desc: "あなたが立てた誓いは、定められた期間を終えた。"
