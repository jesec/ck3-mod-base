 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$：尖塔に冠を"
 pam_great_projects_events.0020.desc: "ついに尖塔に十字架が据えられた。そのどれもが、遥か昔、あの[Glossary('ゴルゴダ','GOLGOTHA_GLOSS')]の丘でキリストが背負わされた十字架のように見える。それらは我らの救いのために主が受けた苦難を思い起こさせ、安息日のたびに主の血が流れ出て、我らの罪を洗い清めてくれるという約束のしるしでもある。\n\n建設が始まって以来、息子たちは父となり、父は老いて土へと還った。しかし、彼らの気高い辛苦、その汗と血は、この石造りの建築に不滅のものとして刻まれている。\n\n帝国は滅びるかもしれない。しかし[province.GetName]の[cathedral_building.GetName]は、神の愛と同様、永遠に立ち続けるだろう。"
 pam_great_projects_events.0020.a: "遠くの者も近くの者も、我らとともに礼拝を捧げよ！"
 GOLGOTHA_GLOSS: "「ゴルゴタ」はラテン語の#EMP Calvariae locus#!（「されこうべの場所」）に由来する。それはローマ時代のエルサレムにあった髑髏の形をした丘であり、イエスが磔刑に処された場所である。処刑は城壁の外、イエスが葬られた墓からさほど遠くない場所で行われた。この場所は現在、[GetBuilding('dome_of_the_rock_01').GetName|V]の近くにある聖墳墓教会の内部に含まれている。"
