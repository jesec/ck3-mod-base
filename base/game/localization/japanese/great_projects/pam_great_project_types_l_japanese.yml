l_japanese:
 great_project_type_pam_cathedral_01: "$building_type_great_project_cathedral_01$を建設する"
 great_project_type_pam_cathedral_01_desc: "堅固な石壁の上に、壮麗なドームと高い塔の頂に、輝く十字架を掲げよ！天の奇跡の光を地上に届け、聖なる高位聖職者の玉座と祭壇を照らすのだ。\n\n長年にわたる気高い労苦の末、一筋の偉大な光が近隣や遠方の信者たちを照らし出すであろう。"
 great_project_type_pam_cathedral_02: "$building_type_great_project_cathedral_02$を建設する"
 great_project_type_pam_cathedral_02_desc: "尖頭アーチを高く築き、ステンドグラスを輝かせよ！\n\nラザロのように、この高貴な聖堂は新たに生まれ変わり、我々を新たな時代に導く存在となる。"
 great_project_type_pam_cathedral_03: "$building_type_great_project_cathedral_03$を建設する"
 great_project_type_pam_cathedral_03_desc: "狭間飾りと渦巻く石彫が聖なる炎の冠となり、この長きにわたり栄光を誇る建造物の新たな時代を告げんことを！\n\n長期間にわたる増築によって、既存の[GetBuilding('great_project_cathedral_02').GetName|V]が[GetBuilding('great_project_cathedral_03').GetName|V]へと発展し、その尖塔は終末の日まで信徒を導くことになる。"
