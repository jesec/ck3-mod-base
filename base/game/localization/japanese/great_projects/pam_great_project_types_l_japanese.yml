 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$：[province.GetNameNoTooltip]の聖なるフレスコ画"
 pam_great_projects_events.0002.desc: "神の言葉を紐解くのは聖職者だが、主の真理と栄光を信徒たちに示すのは聖なるイコンである。\n\n必要な資金が集まり、イコン画家たちも揃った今、聖典のどの場面で丸天井、壁、そして天井を飾るかを決めなければならない。"
 pam_great_projects_events.0002.a: "キリスト降誕を祝福する東方の三博士"
 pam_great_projects_events.0002.b: "荒野の聖ヒエロニムスと獅子"
 pam_great_projects_events.0002.c: "エジプトを離れ、カナンへ向かうアブラハムとロト"
 pam_great_projects_events.0002.d: "聖母マリアへの受胎告知"
 pam_great_projects_events.0002.e: "主への知識によって燃え上がる聖アウグスティヌスの心臓"
 pam_great_projects_events.0002.f: "使徒たちの足を洗うキリスト"
 pam_great_projects_events.0002.mystic_xp: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]が[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]を持つ人物に付与する[trait_level_track_xp|E]が増加する"
 pam_great_projects_events.0002.scholar_xp: "[grand_cathedral|E]が完成すると、[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )][trait|E]を持つ人物はその[point_of_interest|E]から[trait_level_track_xp|E]を獲得できるようになる"
 pam_great_projects_events.0002.pilgrim_xp: "[grand_cathedral|E]が完成すると、[GetTrait('pilgrim').GetName( GetNullCharacter )][trait|E]を持つ人物はその[point_of_interest|E]から[trait_level_track_xp|E]を獲得できるようになる"
 pam_great_projects_events.0002.piety: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]から@piety_icon! [piety|E]を獲得できるようになる"
 pam_great_projects_events.0002.learning_xp: "[grand_cathedral|E]が完成すると、信徒はその[point_of_interest|E]から@skill_learning_icon! [learning|E][lifestyle_experience|lE]と[spiritual_fulfillment|E]を獲得できるようになる"
 pam_great_projects_events.0002.stress_loss: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]から@stress_loss_icon! [stress_loss|E]を獲得できるようになる"
 cathedral_stained_glass_contributor_tt: "あなたは[GetPrestigeLevelName('(int32)2')]以上の[prestige_level|E]、[GetPietyLevelName('(int32)3')]以上の[piety_level|E]、または[kingdom|E]階級の[title|E]を持っている"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$：[province.GetNameNoTooltip]を彩る光"
 pam_great_projects_events.0003.desc: "「#EMP 輝かしいものは輝かしいものと結びつくことでさらに輝き、その新たな光に満たされた高貴な業もまた輝かしいものになるのです#!」と、切り出されたガラスが陽光を受けて輝くのを目にしながら、[religion_buddy.GetTitledFirstName]は語る。\n\nガラス職人の[glazier.GetTitledFirstName]は、意匠の候補をじっくり吟味できるよう、白塗りの作業台の上に[Glossary('ポットメタルガラス','POT_METAL_GLOSS')]の欠片を並べて見せた。\n\n私は宣言する。「この窓は身廊からも[province.GetNameNoTooltip]各地からも見えるものだ。ここにふさわしいのは…」"
 pam_great_projects_events.0003.a: "[ROOT.Char.GetDynastyNameNoTooltip]の正統性を支えるエッサイの樹の絵だ。"
 pam_great_projects_events.0003.a.flavor: "[Glossary('エッサイの樹','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "[grand_cathedral|E]が完成すると、[travel|E]の指導者としてその[point_of_interest|E]を訪れた[dynasty|E]の成員は@dynasty_prestige_icon! [dynasty_prestige|E]を獲得できるようになる"
 pam_great_projects_events.0003.b: "寄進者である私の肖像と紋章をあしらったパネルだ。"
 pam_great_projects_events.0003.b.tt: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]を訪れた人物は@prestige_icon! [prestige|E]を獲得できるようになる"
 pam_great_projects_events.0003.c: "遠方から信者を招き寄せるための、巡礼者の奇跡の場面だ。"
 pam_great_projects_events.0003.c.tt: "[grand_cathedral|E]が完成すると、[trait|E]「[GetTrait('pilgrim').GetName( GetNullCharacter )]」を持つ人物はその[point_of_interest|E]からより多くの[trait_level_track_xp|E]を獲得できるようになる"
 pam_great_projects_events.0003.d: "聖母マリアを描いた窓と、その前に置かれた不滅の灯だ。"
 pam_great_projects_events.0003.d.flavor: "彼はガラスに描かれた[blessed_mary.GetTitledFirstName]の像の前で、油灯と蝋燭を絶やさず灯し続けるだろう。"
 pam_great_projects_events.0003.d.tt: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]から@stress_loss_icon! [stress_loss|E]と[spiritual_fulfillment|E]を獲得できるようになる"
 pam_great_projects_events.0003.d.dulia.tt: "[GetTenetType('tenet_dulia').GetBaseName]を[personal_tenet|E]として持つと、訪問時により大きな[spiritual_fulfillment|E]を得られる"
 pam_great_projects_events.0003.e: "王がもたらした殉教の連作だ。"
 pam_great_projects_events.0003.e.tt: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]を訪れた狂信的な人物は追加の@piety_icon! [piety|E]と@stress_loss_icon! [stress_loss|E]を獲得できるようになる。"
 pam_great_projects_events.0003.e.owner_msg.title: "ガラスに刻まれた殉教"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName]は[grand_cathedral|E]のために殉教を描いた一連のステンドグラスを依頼した。その主題ははあなたをより深い信心へと導く。"
 TREE_OF_JESSE_GLOSS: "エッサイの樹は、ダビデの父エッサイの横たわる姿から伸びるキリストの系譜を描いたものである。教会のステンドグラスでは、聖書上の王家と現在の王朝とが関連付けて描かれ、それによって神授による王権を示した。シャルトル大聖堂やサン＝ドニ大聖堂にその主な例が見られる。"
 POT_METAL_GLOSS: "ポットメタルガラスは、坩堝の中で原料に金属酸化物を混ぜ込んで着色するため、その色彩は表面だけでなくガラス全体に行き渡る。ラテン語で「ウィトレアリウス」と呼ばれる熟練したガラス職人たちは、冷えたガラス板を切って白塗りの板の上に並べ、鉛で組み立てる前に光の透け具合を確かめた。"
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$：礎石を据えて"
 pam_great_projects_events.0005.desc.intro: "最初の礎石が据えられた！団栗が樫の木に育つように、[owner.GetTitledFirstName]の座は人々を導く記念碑へと成長していくだろう。それぞれの石と材木が[owner.GetPrimaryTitle.GetNameNoTier]のすべての[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]、そしてキリスト教世界全体に向けて、[ROOT.Char.GetFaith.HighGodName]の栄光を放つのだ。\n\n建設資金を惜しみなく提供した[CharMyFirstNames(founder)|U]の寛大さは鐘の音とともに響き渡り、すべての礼拝者の口に上るだろう。"
 pam_great_projects_events.0005.desc.contributor: "\n\nとりわけ、[optional_contributor.GetTitledFirstNamePossessive]の寄付による[contribution.GetName]は、この[cathedral_building.GetName]をますます不朽のものとするだろう。"
 pam_great_projects_events.0005.desc.outro: "さあ、大事業を始めよう！"
 pam_great_projects_events.0005.a: "「我々の子供たちが、その完成を見るだろう」"
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$：神の秩序に従った配置"
 pam_great_projects_events.0006.desc.intro_architect: "私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))]である[architect.GetFirstName]が指すのは"
 pam_great_projects_events.0006.desc.intro_no_architect: "私の目線の先にあるのは"
 pam_great_projects_events.0006.desc.intro: "木の杭が立てられ、そこに固く張られた縄が描く巨大な十字の輪郭である。そこには、やがて建てられる十字形の建物の姿が示されていた。"
 pam_great_projects_events.0006.desc.steward_founder: "\n\n私はこの工法を書物で見たことがある！\n\n「あなたが用いているのは間違いなく$pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n「しかし、これほど壮大な建造物を、どうやって設計するのだ？」と私は尋ねる。"
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n「我々が採用しているのは$pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "[Glossary('アド・クアドラトゥム','AD_QUADRATUM_GLOSS')]だ！主は我々に神聖なる秩序を与えてくださった。正方形を用いれば、いかなる[ROOT.Char.Custom('ResidenceBuilding')]も超える、壮大な建造物の比例を導き出すことができる」"
 pam_great_projects_events.0006.desc.foundations: "\n\nまもなく土台を築くための掘削が始まるようだ。"
 pam_great_projects_events.0006.a: "[founder.GetDynastyNameNoTooltip]家の祖先のために地下納骨堂を掘れ。"
 pam_great_projects_events.0006.a.tt: "[owner.GetShortUINamePossessive]の[cathedral_complex|E]に、[founder.GetDynastyName][dynasty|E]を称える[GetDomicileBuilding('cathedral_crypt_01').GetName|V]が建てられる"
 pam_great_projects_events.0006.b: "巡礼者に対応できるよう身廊を拡張しろ。"
 pam_great_projects_events.0006.b.tt: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]を訪れた巡礼者は、より多くの[GetTrait('pilgrim').GetName( GetNullCharacter )]の[trait_level_track_xp|E]と@piety_icon! [piety|E]を獲得できるようになる"
 pam_great_projects_events.0006.c: "神のみがこの事業を導くことができる。"
 AD_QUADRATUM_GLOSS: "#EMP アド・クアドラトゥム#!——ラテン語で「正方形によって」を意味する語。中世の熟練石工たちは単純な比例体系を用いて建築現場の地割を行った。彼らが利用したのは正方形の一辺と対角線との比率で、この2つの長さを辺とする長方形は、調和の取れた形状であると考えられていたのである。このたった一つの基準単位から、石工は大小さまざまな四角形の連なりを導き出し、設計図の各部分が隣接する部分と確実に噛み合うようにした。"
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$：天を突き上げる肋材"
 pam_great_projects_events.0007.desc.intro_architect: "私の[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))]である[architect.GetFirstName]に案内され、私は林立する梁の間を進む。大聖堂の足場はそれ自体が一つの木造の教会のようにそびえ立ち、石造りのヴォールトの建造に精を出す石工たちを支えている。"
 pam_great_projects_events.0007.desc.intro_no_architect: "私は林立する梁の間を進む。大聖堂の足場はそれ自体が一つの木造の教会のようにそびえ立ち、ヴォールトの施工作業をする石工たちを支えている。"
 pam_great_projects_events.0007.desc.architect: "\n\n「完成すれば、このヴォールトは信徒たちを風雨から守り、我々の祈りを高い天へと導くだろう」"
 pam_great_projects_events.0007.desc.architect_says: "[architect.GetSheHe]は言う。"
 pam_great_projects_events.0007.desc.outro: "\n\n完成した一画のヴォールトに目を向けると、それはヨナを呑み込んだ巨大な魚の肋骨を思い起こさせた。神の家の栄光とは、まさにこのように人を海の底へ、あるいは星々の彼方へ運ぶものなのだ。"
 pam_great_projects_events.0007.a: "ヴォールトを夜空の絵で装飾しろ。"
 pam_great_projects_events.0007.a.tt: "[grand_cathedral|E]が完成すると、その[point_of_interest|E]が[trait|E]「[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]」を持つ人物に付与する[trait_level_track_xp|E]が増加する"
 pam_great_projects_events.0007.b: "ヨナのように懺悔の説教を行おう。"
 pam_great_projects_events.0007.b.tt: "あなたの[faith|E]は@fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#!の[fervor|E]を獲得する"
 pam_great_projects_events.0007.c: "石工たちにそのまま作業を進めさせよ。"
 fervor_gain_cathedral_jonah_sermon: "[grand_cathedral|E]の建設現場で説かれた懺悔"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$：神の声の鋳造"
 pam_great_projects_events.0008.desc.intro: "建設は順調に進んでいるが、この聖堂には[owner.GetPrimaryTitle.GetNameNoTier]全土から信徒を呼び寄せる「声」がない。"
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName]は、大きな青銅の鐘を鋳造しなければならないと言っている！"
 pam_great_projects_events.0008.desc.no_architect: "\n\n我々は鐘を鋳造しなければならない！"
 pam_great_projects_events.0008.desc.need_bell: "危険で費用のかかる事業だ。[founder.GetPrimaryTitle.GetNameNoTier]の財源は、原材料の費用だけでもすでに大きな打撃を受けている。"
 pam_great_projects_events.0008.desc.plague_named: "\n\n残念なことに、鐘職人は[epidemic.GetName]によって命を落としてしまった。"
 pam_great_projects_events.0008.desc.plague_generic: "\n\n残念なことに、鐘職人は先頃の疫病によって命を落としてしまった。"
 pam_great_projects_events.0008.desc.outro: "彼の息子である[bell_maker_son.GetFirstName]は、死の床で父から秘術を伝授されたため、鐘を鋳造できると私に請け合っている。"
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n地元の親方のもとで修業を積んだ野心溢れる若き青銅職人、[bell_maker_son.GetFirstName]が名乗りを上げた。[bell_maker_son.GetSheHe|U]は[owner.GetPrimaryTitle.GetNameNoTier]の[cathedral_building.GetName]にふさわしい鐘を鋳造し、自らの腕前を証明したいと意気込んでいる。"
 pam_great_projects_events.0008.a: "もし失敗したら、死をもって償ってもらう。"
 pam_great_projects_events.0008.a.tt: "鋳造に失敗した場合、あなたは[bell_maker_son.GetShortUIName]を処刑する"
 pam_great_projects_events.0008.belltower_may.tt: "[owner.GetShortUINamePossessive]の[cathedral_complex|E]に[GetDomicileBuilding('cathedral_belltower_02').GetName|V]を建設できる"
 pam_great_projects_events.0008.aa: "もし失敗したら、その身から皮を剥ぎ取ってやる。"
 pam_great_projects_events.0008.b: "彼は主の道具となり得るのかもしれない。"
 pam_great_projects_events.0008.b.tt: "[bell_maker_son.GetShortUIName]を信頼し、鐘の鋳造を任せる"
 pam_great_projects_events.0008.b.flavor: "ダビデがゴリアテを討ち取った時、彼も若い羊飼いに過ぎなかったではないか？"
 pam_great_projects_events.0008.c: "腕の確かな者を探せ。名人の息子でなくても構わない。"
 pam_great_projects_events.0008.duel.success: "鋳造は成功した！[owner.GetShortUINamePossessive]の[cathedral_complex|E]に[GetDomicileBuilding('cathedral_belltower_02').GetName|V]が建設される"
 pam_great_projects_events.0008.duel.failure: "鋳造は失敗した…これからどう進めるかを決めねばならない"
 pam_cathedral_bell_casting_duel: "[CHARACTER.GetShortUINamePossessive|U]の[learning|E]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]：\n$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]：\n$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]：\n$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]：\n$pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$：そして神は語られた"
 pam_great_projects_events.0009.desc.body: "[bell_maker_son.GetFirstName]が職人たちを指揮しながら、あちこち奔走する様子を私は見守っている。\n\n[bell_maker_son.GetSheHe|U]は父の代からの職人たちに絶えず異議を唱え、鋳造用の穴の場所、鋳型に使う粘土、そして炉の火入れ方法の選択に至るまで、どこまでも自分のやり方を貫こうとしている。"
 pam_great_projects_events.0009.desc.body.architect: "[bell_maker_son.GetFirstName]が職人たちを指揮しながら、あちこち奔走する様子を[architect.GetFirstName]と私は見守っている。\n\n[bell_maker_son.GetSheHe|U]は父の代からの職人たちと絶えず衝突して異議を唱え、鋳造用の穴の場所、鋳型に使う粘土、そして炉の火入れ方法の選択に至るまで、どこまでも自分のやり方を貫こうとしている。"
 pam_great_projects_events.0009.desc.success_end: "\n\n溶けた青銅はあたかも神の御手に導かれるかのように鋳型に流れ込み、形を成して現れた。そして吊り上げられ、すべての[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]に向けて高らかな声を響かせる。\n\n「主の家へ集え！」"
 pam_great_projects_events.0009.a: "[province.GetNameNoTooltip]の[province.Custom('GetTerrainType')|l]に、神の声を響き渡らせよ。"
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$：破滅の先触れ"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\n溶けた青銅は鋳型の中で叫び声を上げたが、それでも形を成して現れた。しかし、吊り上げられて舌が打口を打つと鈍い衝撃音が聞こえ、それに続いて亀裂が入った。破滅の先触れだ！"
 pam_great_projects_events.0010.a: "約束は守られねばならない。"
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U]は処刑される"
 pam_great_projects_events.0010.b: "あの割れた鐘こそが、奴にとって何よりの罰だ。"
 pam_great_projects_events.0010.b.faith: "主はまだ、あの者に役割を残しておられる。"
 pam_great_projects_events.0010.c: "青銅を溶かせ。もっと鋭いものを鍛えよ。"
 pam_great_projects_events.0010.c.tt: "割れた鐘は改鋳されて拷問道具に作り直され、[bell_maker_son.GetShortUIName]はその最初の犠牲者になった。[founder.GetCapitalLocation.GetNameNoTooltip]の職人たちは今後、服従のなんたるかを知るに違いない。"
 pam_great_projects_events.0010.c.intrigue_xp.tt: "あなたは代わりに[intrigue_lifestyle|E]の[experience|E]を得る"
 pam_great_projects_events.0010.d: "これを教訓として謙虚さを学べ。"
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$：主の御手によるかのように"
 pam_great_projects_events.0011.desc.intro: "[province.GetNameNoTooltip]の[cathedral_building.GetName]の建設状況を確認していると、巨大な木造構造物が軋みながら回転する、耳をつんざくような音に襲われた。"
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName]は巨大な踏み車を指さした。その中では2人の作業員が歩を進めている。"
 pam_great_projects_events.0011.desc.no_architect: "\n\n私はその音の発生源を突き止めた。それは巨大な踏み車で、中では2人の作業員が歩を進めている。"
 pam_great_projects_events.0011.desc.outro: "\n\nまるで主の御手によるかのように、その縄と滑車は切り出したばかりの[Glossary('切石','ASHLAR_GLOSS')]や、モルタルを入れた桶を建設中の屋根へと引き揚げていく。下の作業場にいる運搬人たちが運べば、背骨をへし折られてしまうであろうその重みに、私は息をのんで見入る。"
 pam_great_projects_events.0011.a: "我々[founder.GetCulture.GetCollectiveNounNoTooltip]は、この大いなる車輪から学べる限りのことを得ねばならない。"
 pam_great_projects_events.0011.a.tt: "あなたの[culture|E]が現在の[cultural_fascination|E]への進捗を@culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#!獲得する"
 pam_great_projects_events.0011.b: "[founder.GetCapitalLocation.GetNameNoTooltip]での多くの事業に、この技術を利用できるかもしれない！"
 pam_great_projects_events.0011.c: "実に見事だ。しかしそのような業は主にお任せしよう。"
 ASHLAR_GLOSS: "切石とは、地上で正確に切り出されて、四角く整形され、表面を滑らかに研磨された石材である。聖堂の建設に必要な高さまで吊り上げ、石材同士をぴったりと合わせるには、綿密な計画が不可欠であった。"
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$：高みからの声"
 pam_great_projects_events.0013.desc: "頭上から大工の槌音が響く。その重厚な音を聞くだけで、間もなくここで信徒たちを包むであろう神の言葉が、どのように響き渡るかを想像できるようだ。\n\n[architect.GetFirstName]は、「ここは聖職者たちが典礼を執り行う慎ましい高座、すなわち我々の[Glossary('カントリア','CANTORIA_GLOSS')]になる予定です！我々が主に語りかける時の声は、人に話しかける時のそれとは違うものでなければなりません」と説明する。そして[architect.GetSheHe|U]は、[choir_boy.GetFirstName]という幼い聖歌隊の少年を手招きした。\n\n少年は軽々と足場を登り、天使のように透き通った一音を響かせる。その声が壁にこだまして、あたかも神が私の中を通り過ぎたかのように、私の体を突き抜けた。"
 pam_great_projects_events.0013.a: "高座を拡張せよ。歌声は多ければ多いほどいい。"
 pam_great_projects_events.0013.b: "この天使には、我が宮廷こそがふさわしい。"
 pam_great_projects_events.0013.castrato: "主のカントリアのために、この声を残そう。"
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U]は声変わりを迎えないよう去勢される"
 pam_great_projects_events.0013.c: "この茶番劇は、私に金を出させるための策略だ！"
 pam_great_projects_events.0013.d: "胸がいっぱいになってしまった。もう退出しなければ。"
 CANTORIA_GLOSS: "カントリアとは教会内に設けられた高架状の歌唱壇である。主に内陣の上部や交差部付近に置かれ、聖歌隊、そして後にはオルガンがそこから典礼を導いた。"
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$：不変の主の愛"
 pam_great_projects_events.0012.desc: "西側の正面が完成した！その壮麗な門は[Glossary('ナルテックス','NARTHEX_GLOSS')]を通って参拝者を迎える準備が整っている。[cathedral_building.GetName]がすべて完成するには生涯がかかるかもしれないが、[owner.GetPrimaryTitle.GetNameNoTier]の良きキリスト教徒たちは、不変の主の愛の未来を信じなければならない。私の説教が始まる…\n\n#EMP 「[ROOT.Char.Custom('RandomBibleQuote')]」#!\n\n…そして、聖書からのこの教訓を彼らに残すことにしよう。"
 NARTHEX_GLOSS: "ナルテックスとは、教会の西側の扉と身廊の間に位置する、玄関前に設けられた広間である。信徒を聖なる空間へ迎え入れる場所であると同時に、より厳格な典礼では、ミサの最中に悔罪者や洗礼志願者を一般の参拝者とは別に収容する場所であった。"
 pam_great_projects_events.0012.a: "「平和を造る人々は幸いである…」"
 pam_great_projects_events.0012.a.flavor: "「[Glossary('…その人々は神の子と呼ばれる。','MATTHEW_5_9_GLOSS')]」"
 pam_great_projects_events.0012.a.tt: "[owner.GetPrimaryTitle.GetNameNoTier]のすべての[owner.GetFaith.GetAdjective]の[county|E]は、#V 10年間#!にわたって[GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]を得る\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "「怠け者よ、蟻のところへ行き…」"
 pam_great_projects_events.0012.b.flavor: "「[Glossary('…その道を見て、知恵を得よ。','PROVERBS_6_6_GLOSS')]」"
 pam_great_projects_events.0012.b.tt: "[owner.GetPrimaryTitle.GetNameNoTier]のすべての[owner.GetFaith.GetAdjective]の[county|E]は、#V 10年間#!にわたって[GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]を得る\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "「さて兄弟・姉妹たちよ…」"
 pam_great_projects_events.0012.c.flavor: "「[Glossary('…私たちの主イエス・キリストの名においてあなたがたにお願いします。みな語ることを一つにして、互いの間に分争がないようにし、同じ心、同じ思いになって、固く結び合うように。','1_CORINTHIANS_1_10_GLOSS')]」"
 pam_great_projects_events.0012.c.tt: "[owner.GetPrimaryTitle.GetNameNoTier]のすべての[owner.GetFaith.GetAdjective]の[county|E]は、#V 10年間#!にわたって[GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]を得る\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "「常に喜んでいるように。絶えず祈るように…」"
 pam_great_projects_events.0012.d.flavor: "「[Glossary('…すべての事について感謝するように。これがキリスト・イエスにおいて、神があなたがたに望んでおられることです。御霊を消してはならない。預言を軽んじてはならない。','1_THESSALONIANS_5_16_20_GLOSS')]」"
 pam_great_projects_events.0012.d.tt: "[owner.GetPrimaryTitle.GetNameNoTier]のすべての[owner.GetFaith.GetAdjective]の[county|E]は、#V 10年間#!にわたって[GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]を得る\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "「私たちの参加すべき競走を、耐え忍んで走り抜こうではありませんか…」"
 pam_great_projects_events.0012.e.flavor: "「[Glossary('一切の重荷と、纏わりつく罪とを捨て去り、私たちの参加すべき競走を、耐え忍んで走り抜こうではありませんか。','HEBREWS_12_1_GLOSS')]」"
 pam_great_projects_events.0012.e.tt: "[owner.GetPrimaryTitle.GetNameNoTier]のすべての[owner.GetFaith.GetAdjective]の[county|E]は、#V 10年間#!にわたって[GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V]を得る\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "「彼女は貧しい者に手を開き…」"
 pam_great_projects_events.0012.f.flavor: "「[Glossary('…乏しい人に手をさしのべる。','PROVERBS_31_20_GLOSS')]」"
 pam_great_projects_events.0012.f.tt: "[owner.GetPrimaryTitle.GetNameNoTier]のすべての[owner.GetFaith.GetAdjective]の[county|E]は、#V 10年間#!にわたって[GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V]を得る\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak [archdiocese|E]内の[owner.GetFaith.GetAdjective]の[rulers|E]の[behave|E]が、より高潔かつ慈悲深いものになる#!#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak [archdiocese|E]内の[owner.GetFaith.GetAdjective]の[rulers|E]の[behave|E]が、より勤勉かつ精力的なものになる#!#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak [archdiocese|E]内の[owner.GetFaith.GetAdjective]の[rulers|E]の[behave|E]が、より社交的かつ高潔なものになる#!#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak [archdiocese|E]内の[owner.GetFaith.GetAdjective]の[rulers|E]の[behave|E]が、より慈悲深く、強欲さを抑えたものになる#!#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak [archdiocese|E]内の[owner.GetFaith.GetAdjective]の[rulers|E]の[behave|E]が、信仰においてより熱心かつ大胆なものになる#!#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak [archdiocese|E]内の[owner.GetFaith.GetAdjective]の[rulers|E]の[behave|E]が、より熱心かつ精力的なものになる#!#!"
