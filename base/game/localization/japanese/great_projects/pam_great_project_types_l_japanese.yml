 great_project_type_pam_mass_rite_conversion_desc_christian: "十分な資源さえあれば、主の光を個々の異教徒だけでなく、異教の[realms|E]全体にも届けることができる。異教徒たちは、我らの導きを通して最も正しい[rite|E]を学ぶ。そうして[christendom|E]はさらに広がっていくのだ。"
 great_project_type_pam_mass_rite_conversion_desc_generic: "十分な資源さえあれば、我らの信仰を点在する改宗者たちの先へと広げ、今もなお敵対する[faiths|E]によって支配されている[realms|E]全体にまでもたらすができる。我らの導きによって異教の民は正しき[rite|E]を学び、結果的に領国全体で我々の立場が強化されることになる。"
