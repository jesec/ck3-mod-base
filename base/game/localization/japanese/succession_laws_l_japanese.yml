 female_only_law_subname: "女系"
 male_only_law_effects: "$EFFECT_LIST_BULLET$女性は相続資格を持たない\n$EFFECT_LIST_BULLET$女性は[claims|E]を相続できない\n$EFFECT_LIST_BULLET$男性の[rulers|E]は、その[faith|E]が[GetDoctrineType('doctrine_concubines').GetBaseName]または[GetDoctrineType('doctrine_polygamy').GetBaseName]の[doctrine|E]を持つ場合、[concubines|E]または複数の[spouses|E]を持つことができる"
 male_preference_law_effects: "$EFFECT_LIST_BULLET$継承において男性が女性より優先される\n$EFFECT_LIST_BULLET$男性の[rulers|E]は、その[faith|E]が[GetDoctrineType('doctrine_concubines').GetBaseName]または[GetDoctrineType('doctrine_polygamy').GetBaseName]の[doctrine|E]を持つ場合、[concubines|E]または複数の[spouses|E]を持つことができる"
 equal_law_effects: "$EFFECT_LIST_BULLET$継承において男女は平等である\n$EFFECT_LIST_BULLET$すべての[rulers|E]は、その[faith|E]が[GetDoctrineType('doctrine_concubines').GetBaseName]または[GetDoctrineType('doctrine_polygamy').GetBaseName]の[doctrine|E]を持つ場合、[concubines|E]、または複数の[spouses|E]を持つことができる"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$継承において女性が男性より優先される\n$EFFECT_LIST_BULLET$女性の[rulers|E]は、その[faith|E]が[GetDoctrineType('doctrine_concubines').GetBaseName]または[GetDoctrineType('doctrine_polygamy').GetBaseName]の[doctrine|E]を持つ場合、[concubines|E]または複数の[spouses|E]を持つことができる"
 female_only_law_effects: "$EFFECT_LIST_BULLET$男性は相続資格を持たない\n$EFFECT_LIST_BULLET$男性は[claims|E]を相続できない\n$EFFECT_LIST_BULLET$女性の[rulers|E]は、その[faith|E]が[GetDoctrineType('doctrine_concubines').GetBaseName]または[GetDoctrineType('doctrine_polygamy').GetBaseName]の[doctrine|E]を持つ場合、[concubines|E]または複数の[spouses|E]を持つことができる"
 gender_preference_law_not_for_clergy_tt: "聖界および神権制の[rulers|E]は、自身の[rite|E]の聖職者の性別に関する[doctrine|E]に基づき、[GetLaw('male_only_law').GetName]、[GetLaw('female_only_law').GetName]、または[GetLaw('equal_law').GetName]のいずれかの[gender_law|E]のみを使用できる"
 SUCCESSION_FORM_NAME: "[Character.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName] [Character.GetActiveLawInGroupWithFlag('succession_order_laws').GetName]"
 feudal_elective_succession_law: "封建選挙制"
 princely_elective_succession_law: "選挙王制"
 feudal_elective_succession_law_effects: "[ruler|E]とその[title|E]に属する1または2[ranks|E]下のすべての直接的な[de_jure|E][vassals|E]は、自分自身と統治者の[close_family|E]の中から[title_heir|E]を指名することができます。"
 princely_elective_succession_law_effects: "皇帝と#V 7#!人の[prince_electors|E]は、自分自身、皇帝の[legitimate|E]を持つ子供や兄弟姉妹、帝国の主要な[de_jure|E][vassals|E]の中から、[title_heir|E]を指名することができます。\n\nふさわしい[elector|E]の[title|E]が異教徒によって保持されている場合、[realm|E]の外にある場合、もしくは廃止されている場合は、別の慣習的な封臣が代わりを務めます。この[succession_law|E]は、[faith|E]と[piety|E]を非常に重要視します。"
 gaelic_elective_succession_law: "タニストリー選挙制"
 gaelic_elective_succession_law_effects: "[ruler|E]とその[title|E]に属する1または2[ranks|E]下のすべての[vassals|E]は、統治者の[dynasty|E]のメンバーから[title_heir|E]（タニスト）を指名することができます。封臣は[close_family|E]より、年長で遠縁の者を好む傾向があります。"
 saxon_elective_succession_law: "サクソン選挙制"
 saxon_elective_succession_law_subname: "賢人会議"
 saxon_elective_succession_law_effects: "[ruler|E]とその[title|E]に属する1または2[ranks|E]下のすべての直接的な成人の[de_jure|E]封臣は、自分たちのうち最も[powerful_vassal|E]、統治者の[legitimate|E]子供、その他の有効な[claimant|E]の中から、[title_heir|E]を指名することができます。"
 scandinavian_elective_succession_law: "スカンディナヴィア選挙制"
 scandinavian_elective_succession_law_subname: "ディング"
 scandinavian_elective_succession_law_effects: "[ruler|E]と[de_jure|E][vassals|E]（男爵を除く）は、統治者の[extended_family|E]と選択可能な[claimants|E]の中から[title_heir|E]を指名することができます。この[succession_law|E]における[voting_power|E]は、[elector|E]の[domain|E]の[county_development|E]と[capital|E]の[county_opinion|E]の合計値から影響を受けます。"
 feudal_elective_candidates: "近親、請求者、選挙人"
 feudal_elective_candidates_tooltip: "封建選挙制のもとで有効な候補者となるには、キャラクターが以下の条件のいずれかを満たしている必要があります\n$EFFECT_LIST_BULLET$現在の統治者の正当な[close_family|E]であり、神権制または共和制の継承権者ではない\n$EFFECT_LIST_BULLET$その称号の[claimant|E]であり、神権制または共和制の継承権者ではない\n$EFFECT_LIST_BULLET$その称号の有効な封建制の[elector|E]である"
 feudal_elective_electors: "統治者と封臣"
 feudal_elective_electors_tooltip: "封建選挙制のもとで有効な[elector|E]となるには、封臣が以下の条件のいずれかを満たしている必要があります\n$EFFECT_LIST_BULLET$その称号の[de_jure|E]封臣である\n$EFFECT_LIST_BULLET$その称号の直臣である\n$EFFECT_LIST_BULLET$その称号の1つまたは2つだけ下の[ranks|E]である"
 princely_elective_candidates: "$feudal_elective_candidates$"
 princely_elective_candidates_tooltip: "選挙王制のもとで有効な候補者となるには、キャラクターが以下の条件のいずれかを満たしている必要があります\n$EFFECT_LIST_BULLET$現在の統治者の正当な[close_family|E]であり、神権制または共和制の継承権者ではない\n$EFFECT_LIST_BULLET$その称号の[claimant|E]であり、神権制または共和制の継承権者ではない\n$EFFECT_LIST_BULLET$その称号の有効な封建制の[elector|E]である"
 princely_elective_electors: "選帝侯"
 princely_elective_electors_tooltip: "[SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsName]のほか、以下の[titles|E]の[holders|E]は[SuccessionElectionWindow.GetSuccessionLaw.GetName]の下で[prince_electors|E]として優先されます：[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\n上記のいずれも創設されていない、[de_jure|E]な帝国の[vassal|E]が保持していない、現時点でほかの選挙人が保持している、あるいは保持者の[religion|E]が皇帝のそれと異なる場合には、直接の帝国の封臣または[independent_ruler|E]が保持するほかの慣習的称号が、以下の基準に応じて選択されます：\n$EFFECT_LIST_BULLET$皇帝と同じ[faith|E]と[culture|E]を持つ[rulers|E]が優先される\n$EFFECT_LIST_BULLET$[theocratic|E]および[feudal|E]統治者が優先される"
 gaelic_elective_candidates: "王朝のメンバー"
 gaelic_elective_candidates_tooltip: "現在の統治者の[dynasty|E]の継承資格を持つメンバーで、神権制または共和制の継承権者ではない者は、タニストリー選挙制のもとで有効な候補者となります。"
 gaelic_elective_electors: "$feudal_elective_electors$"
 gaelic_elective_electors_tooltip: "タニストリー選挙制のもとで有効な[elector|E]となるには、封臣が以下の条件をすべて満たしている必要があります\n$EFFECT_LIST_BULLET$その称号の[de_jure|E]封臣である\n$EFFECT_LIST_BULLET$その称号の1つまたは2つだけ下の[ranks|E]である"
 saxon_elective_candidates: "子供、請求者、封臣"
 saxon_elective_candidates_tooltip: "賢人会議で有効な候補者となるには、その人物が以下の条件のいずれかを満たしている必要があります\n$EFFECT_LIST_BULLET$現在の統治者の正当な子供であり、神権制または共和制の継承権者ではない\n$EFFECT_LIST_BULLET$その称号の[claimant|E]であり、神権制または共和制の継承権者ではない。候補者の子供は指名できない\n$EFFECT_LIST_BULLET$その称号の[powerful_vassal_powerful|E]な[de_jure|E]封建制の封臣である"
 saxon_elective_electors: "$feudal_elective_electors$"
 saxon_elective_electors_tooltip: "賢人会議で有効な[elector|E]となるには、封臣が以下の条件をすべて満たしている必要があります\n$EFFECT_LIST_BULLET$その称号の[de_jure|E]封臣である\n$EFFECT_LIST_BULLET$その称号の直臣である\n$EFFECT_LIST_BULLET$成人である\n$EFFECT_LIST_BULLET$無能力ではない"
