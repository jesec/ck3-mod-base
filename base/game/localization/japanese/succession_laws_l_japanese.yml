 scandinavian_elective_candidates_tooltip: "ディングのもとで有効な候補者となるには、キャラクターが以下の条件のいずれかを満たしている必要があります\n$EFFECT_LIST_BULLET$現在の統治者の[extended_family|E]の正当なメンバーであり、神権制または共和制の継承権者ではない\n$EFFECT_LIST_BULLET$その称号の[claimant|E]であり、神権制または共和制の継承権者ではない"
