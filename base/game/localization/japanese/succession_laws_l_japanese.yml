 meritocratic_military_appointment_succession_law: "能力主義指揮官継承"
 meritocratic_military_appointment_succession_law_subname: "$celestial_military_appointment_succession_law_subname$"
 meritocratic_military_appointment_succession_law_effects: "\n[appointment_succession_law|E]の一種。$meritocratic_military_appointment_succession_law$では、[title|E]とそれに関連する[holdings|E]を、最も[candidate_score|E]が高い候補者が相続する。[realm|E]の[adult|E]は優れた[martial_skill|E]を持ったり、[commander_traits|E]の獲得や[influence|E]の消費といったさまざまな手段を講じて軍事[governorship|E]を争うことができる。\n\n"
 #Meritocratic Acclamation Succession Law (Korea, TGP)
 meritocratic_regency_succession_law: "能力主義摂政継承"
 meritocratic_regency_succession_law_subname: "$appointment_succession_law_subname$"
 meritocratic_regency_succession_law_effects: "$meritocratic_regency_succession_law$の下では、[title|E]とそれに関連する[holdings|E]を、最もスコアが高い候補者が相続することになります。[realm|E]の[noble_families|E]、[governors|E]やその一族の成員が候補者になることができます。"
 #PAM
 clerical_appointment_law: "聖職者の任命"
 clerical_appointment_law_subname: "$clerical_appointment_succession_law$"
 clerical_appointment_law_effects: "\n[christian|E]の[ecclesiastical|E]および[theocratic|E]の[governments|E]で用いられる[appointment_succession_law|E]の一種。$clerical_appointment_law$のもとでは、[candidate_score|E]が最も高い候補者が、[title|E]とそれに付随する[holdings|E]を継承します。\n\n[holder_possessive|E]の[close_family|E]、[house|E]、[councillors|E]、[court_position|E]保持者、[vassals|E]、または[clerical_region|E]の[clergy|E]のうち、同じ[faith|E]に属する[adult|E]は、[piety|E]を費やしてその称号の獲得を目指すことができます。\n"
 clerical_appointment_succession_law: "最もスコアが高い候補者が継承"
 theocratic_elective_succession_law: "神権選挙制"
 theocratic_elective_succession_law_subname: "枢機卿団"
 theocratic_elective_succession_law_effects: "\n[college_of_cardinals|E]を構成する[cardinals|E]は、互いの中から[title_heir|E]を選出します。すべての枢機卿が[elector|E]であると同時に、候補者でもあります。[papabile_score|E]が高い枢機卿ほど、多くの票を得やすくなります。"
 theocratic_elective_candidates: "枢機卿"
 theocratic_elective_candidates_tooltip: "$theocratic_elective_succession_law$のもとで候補者となるには、[college_of_cardinals|E]の[cardinal|E]でなければならない。"
 theocratic_elective_electors: "枢機卿団"
 theocratic_elective_electors_tooltip: "$theocratic_elective_succession_law$のもとで[elector|E]となるには、[college_of_cardinals|E]の[cardinal|E]でなければならない。"
