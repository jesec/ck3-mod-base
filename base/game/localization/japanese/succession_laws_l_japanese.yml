l_japanese:
 succession_order_laws: "[succession_laws|E]"
 succession_order_laws_singular: "[succession_law|E]"
 partition_succession_law: "分割相続制"
 partition_succession_law_subname: "すべての子供が平等に相続する"
 partition_succession_law_effects: "\n$partition_succession_law$[succession|E]のもとでは、あなたの[titles|E]はあなたの子供たちに平等に分配されます。\n\n#weak $partition_base_desc$#!"
 partition_base_desc: "#weak 継承時、亡き[ruler|E]が保持していたすべての[titles|E]は[eligible_children|E]の間で分けられ、[player_heir|E]は常に[primary_title|E]と[realm_capital|E]およびそれに関連する直接の[de_jure|E]称号を与えられます。\n\n若い子供たちには主要称号と同じ[rank|E]のものを始めとする称号が与えられますが、該当するものがない場合は低ランクの称号が与えられます。プレイヤーの後継者が継承資格を持たない称号を事前に付与することはできません。\n#!"
 high_partition_succession_law: "高度分割相続制"
 high_partition_succession_law_subname: "すべての子供が相続する"
 high_partition_succession_law_effects: "\n$high_partition_succession_law$[succession|E]のもとでは、[titles|E]の大部分があなたの[player_heir]に割り当てられ、残りは子供たちに分配されます。\n\n#weak $partition_base_desc$\n後継者は、亡くなった統治者の称号の半分以上を#emp 必ず#!相続します。\n#!"
 confederate_partition_succession_law: "分割連合相続制"
 confederate_partition_succession_law_subname: "すべての子供が平等に相続する"
 confederate_partition_succession_law_effects: "\n$confederate_partition_succession_law$のもとでは、あなたの[titles|E]はあなたの子供たちに平等に分配されます。年下の[realm_heirs|E]のために新たな称号が創設されることがあります。\n\n#weak $partition_base_desc$\n十分な所領があれば、年下の子供たちのために称号が創設されます。\n\n#!#X 部族制の統治者はこの継承方式に固定されています。#!\n"
 single_heir_succession_law: "長子相続制"
 single_heir_succession_law_subname: "最年長の子供が継承する"
 single_heir_succession_law_effects: "\n$single_heir_succession_law$[succession|E]のもとでは、あなたの最年長の子供があなたのすべての[titles|E]を継承します。\n\n#weak 継承時には、亡くなった統治者のすべての[titles|E]を、最年長の[eligible_child|E]である[player_heir|E]が継承します。年下の子供は何も相続しません。\n#!"
 single_heir_succession_law_youngest: "末子相続制"
 single_heir_succession_law_youngest_subname: "最年少の子供が継承する"
 single_heir_succession_law_youngest_effects: "\n$single_heir_succession_law_youngest$[succession|E]のもとでは、あなたの最年少の子供があなたのすべての[titles|E]を継承します。\n\n#weak 継承時には、亡くなった統治者のすべての[titles|E]を、最年少の[eligible_child|E]である[player_heir|E]が継承します。年上の子供は何も相続しません。\n#!"
 single_heir_dynasty_house: "年功序列制"
 single_heir_dynasty_house_subname: "[house]の最年長のメンバーが相続する"
 single_heir_dynasty_house_effects: "\n$single_heir_dynasty_house$[succession|E]のもとでは、あなたの[house|E]で最年長の一員があなたのすべての称号を相続します。\n\n#weak 継承時には、亡くなった統治者のすべての[titles|E]を、その[house|E]で継承資格を持つ最年長の一員が相続します。あなたの子供は、[house|E]の最年長者でない限り、何も相続しません。\n#!"
 same_faith_theocratic_succession_law: "同宗派制"
 same_faith_theocratic_succession_law_effects: "現在の[ruler|E]と同じ[faith|E]のキャラクターのみが相続できます。"
 same_faith_only_law: "$same_faith_theocratic_succession_law$"
 same_faith_only_law_effects: "$same_faith_theocratic_succession_law_effects$"
 bishop_theocratic_succession_law: "神権制"
 bishop_theocratic_succession_law_effects: "継承時には亡くなった[realm_priest_possessive|E]のすべての[titles|e]がその後継者に与えられます。この後継者が誰になるかは[faith|E]の教義によって定められます。"
 temporal_head_of_faith_succession_law: "世俗的神権制"
 temporal_head_of_faith_succession_law_effects: "[temporal_head_of_faith|E]の[title|E]が現在の[head_of_faith|E]の[player_heir|E]に与えられます。"
 succession_laws_must_not_be_temporal: "[temporal_head_of_faith|E]の[title|E]ではいけません。"
 holy_order_succession_law: "騎士修道会"
 holy_order_succession_law_effects: "継承時には総長のすべての[titles|e]がその後継者に与えられます。後継者は一般的には[martial|E]能力が最も高い[knight|E]です。"
 cultural_holy_order_succession_law: "文化的騎士修道会"
 cultural_holy_order_succession_law_effects: "継承時には総長のすべての[titles|e]がその後継者に与えられます。後継者は一般的には[martial|E]能力が最も高く、[heritage|E]が一致する[knight|E]です。"
 monastic_holy_order_succession_law: "修道会"
 monastic_holy_order_succession_law_effects: "継承時には、大修道院長のすべての[titles|E]を後継者が相続します。後継者は通常、[learning|E]が最も高い[courtier|E]です。現在の[ruler|E]と同じ[rite|E]の人物のみが相続できます。"
 female_monastic_holy_order_succession_law: "女子修道会"
 female_monastic_holy_order_succession_law_effects: "継承時には、大女子修道院長のすべての[titles|E]を後継者が相続します。後継者は通常、[learning|E]が最も高い女性の[courtier|E]です。現在の[ruler|E]と同じ[rite|E]の人物のみが相続できます。"
 male_monastic_holy_order_succession_law: "男子修道会"
 male_monastic_holy_order_succession_law_effects: "継承時には、大修道院長のすべての[titles|E]を後継者が相続します。後継者は通常、[learning|E]が最も高い男性の[courtier|E]です。現在の[ruler|E]と同じ[rite|E]の人物のみが相続できます。"
 mercenary_company_succession_law: "傭兵団"
 mercenary_company_succession_law_effects: "継承時には団長のすべての[titles|e]がその後継者に与えられます。後継者は一般的には[martial|E]能力が最も高い[knight|E]です。"
 city_succession_law: "共和制"
 city_succession_law_effects: "継承時には亡くなった統治者のすべての[titles|e]がその後継者に与えられます。"
 herder_succession_law: "遊牧集団の継承"
 herder_succession_law_effects: "継承時には亡くなった統治者のすべての[titles|e]がその後継者に与えられます。"
