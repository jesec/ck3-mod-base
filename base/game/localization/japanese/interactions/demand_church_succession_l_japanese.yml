l_japanese:
 demand_church_succession_interaction: "教会継承の要求"
 demand_church_succession_religious_head_interaction: "教会継承の勅令"
 demand_church_succession_interaction_desc: "[recipient.GetTitledFirstName|U]が正当な[heir|E]なくこの世を去った場合、その所領は、[actor.GetPrimaryTitle.GetName]の[holder|E]に[fallback_heir|E]として継承される。"
 demand_church_succession_religious_head_interaction_desc: "[actor.GetFaith.GetAdjective][faith|E]の[head_of_faith|E]として、[recipient.GetTitledFirstName]が後継者なく死去した場合、その領国は、[actor.GetPrimaryTitle.GetName]に帰属するよう布告する。"
 demand_church_succession_target_in_reach: "[recipient.GetShortUINamePossessive]の[realm|E]は[actor.GetShortUINamePossessive]の[realm|E]と国境を接しておらず、[actor.GetShortUINamePossessive]の[archdiocese|E]内にない"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName]はすでに、[recipient.GetHerHis]の継承者の座をほかの聖職者または[fallback_heir|E]に誓約している"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName]は、[elective_succession|E] または[advanced_succession|E]のもとで[primary_title|E]を保持している"
 demand_church_succession_recently_refused_tt: "[recipient.GetTitledFirstName]は最近、教会継承の要請を拒否し、今後10年間は​​同様の要請から保護されることになった"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "教会継承の要求"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.GetTitledFirstName]は、[recipient.GetTitledFirstName]が後継者なく死去した場合、その領国は[actor.GetPrimaryTitle.GetName]に渡るべきだと要求する。"
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName]は[faith|E]との誓約に縛られる"
 demand_church_succession_actor_toast_desc: "[recipient.GetSheHe]が後継者なく死去した場合、[actor.GetPrimaryTitle.GetName]が[recipient.GetHerHis]の領国を継承する。"
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName]は[recipient.GetTitledFirstName]を[faith|E]に従わせた"
 demand_church_succession_actor_toast_desc_puppeteer: "[recipient.GetSheHe]が後継者を残さず死去した場合、[puppet_or_actor.GetPrimaryTitle.GetName]がその領国を継承する。"
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "[actor.GetFaith.HighGodNamePossessive]の恩寵により、継承の件に関して汝に書状をしたためる。"
 demand_church_succession.0001.desc.archbishop: "貴殿の領地を見守る我が大司教区より、継承の件に関して書状をしたためる。"
 demand_church_succession.0001.desc.bishop: "継承の件に関して、汝の牧者が書状をしたためる。"
 demand_church_succession.0001.desc.head_of_faith_generic: "我らが信仰の[actor.GetTitleAsNameNoTooltip]として、継承の件に関して汝に書状をしたためる。"
 demand_church_succession.0001.desc.theocrat_generic: "[actor.GetFaith.HighGodName]の祭壇より、継承の件に関して書状をしたためる。"
 demand_church_succession.0001.flavour.zealous: "\n\n誤解してはいけない。"
 demand_church_succession.0001.flavour.ambitious: "\n\n率直に言おう。"
 demand_church_succession.0001.flavour.deceitful: "\n\nこれを聞けば間違いなく安堵するだろうが、"
 demand_church_succession.0001.flavour.greedy: "\n\n単刀直入に言えば、"
 demand_church_succession.0001.flavour.compassionate: "\n\n[recipient.GetTitledFirstName]よ、やむを得ぬ事情のためお許しいただきたいが、"
 demand_church_succession.0001.flavour.default: "\n\nはっきり言わせてもらえば、"
 demand_church_succession.0001.recipient.elderly_childless: "汝の炉端にある揺りかごは空のままであり、その血統は汝の代で絶える。信仰の徒は待ち——そして、やがては汝の領地を継承することになるだろう。"
 demand_church_succession.0001.recipient.childless: "汝には存命の子がない。[actor.GetFaith.HighGodName]がその運命を変えない限り、汝の領地は信仰に奉仕することとなる。"
 demand_church_succession.0001.recipient.one_child: "汝と終焉を隔てるのはただ一人の子のみだ。[actor.GetFaith.HighGodName]がその子を召し上げれば、信仰の徒がすぐにでも統治の座に就くことになる。"
 demand_church_succession.0001.recipient.default: "歳月はあらゆる約束を妬む。汝の約束が果たされぬなら、汝の領地は我々に渡り、[actor.GetFaith.HighGodNamePossessive]の名のもとに統治されることになる。"
 demand_church_succession.0001.a: "これは定めであり、そうあるべきなのだ。"
 demand_church_succession.0001.b: "ならば、世継ぎの[ROOT.Char.GetMotherFather]となるのが最善のようだな。"
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip]は一線を超えている。"
 demand_church_succession.0001.c.tt: "あなたは[fallback_heir_title|E]の取り決めを撤回し、今後10年間は​​同様の要請から保護されることになったが、[actor.GetTitledFirstName]はこの侮辱をそう簡単には許さない。"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "貴殿の要求は読んだが、拒絶する。我が領国が教会の手に落ちることは決してない。[actor.GetTitledFirstName]よ、貴殿は祭壇の手入れでもしているがいい——我が領土は、この私が統治する。"
 demand_church_succession.0002.a: "この不遜、決して忘れまい。"
 demand_church_succession_fertility_modifier: "後継者誕生への決意"
 demand_church_succession_fertility_modifier_desc: "自らの領国を教会の支配から守るべく、この人物は寝室での営みにさらに精を出している。"
 defied_church_succession_opinion: "継承要求を拒否した"
 meddling_church_opinion: "私の継承に干渉している"
