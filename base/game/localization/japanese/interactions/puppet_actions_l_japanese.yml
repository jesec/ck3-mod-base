 piety_level_3_dread_or_hook_tt: "[actor.GetShortUIName|U]は、以下のいずれかの条件を満たす必要がある：\n$EFFECT_LIST_BULLET$[piety_level|E]が@piety_level_3_icon_christian! [GetModifier( 'piety_level_3' ).GetNameWithTooltip]以上である\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]に対する@weak_hook_icon! [hook|E]を持っている\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]を[terrified_i] [cowed|E]させている\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive]の[head_of_faith|E]または[challenger_hof|E]である"
 piety_level_4_dread_or_strong_hook_tt: "[actor.GetShortUIName|U]は、以下のいずれかの条件を満たす必要がある：\n$EFFECT_LIST_BULLET$[piety_level|E]が@piety_level_4_icon_christian![GetModifier( 'piety_level_4' ).GetNameWithTooltip]以上である\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]に対する@unspent_strong_hook_icon![strong_hook|E]を持っている\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]を[terrified_i] [cowed|E]させている\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive]の[head_of_faith|E]または[challenger_hof|E]である"
 pam_empire_dread_or_strong_hook_tt: "[actor.GetShortUIName|U]は、以下のいずれかの条件を満たす必要がある：\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]に対する@unspent_strong_hook_icon![strong_hook|E]を持っている\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]を[terrified_i] [cowed|E]させている\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive]の[head_of_faith|E]または[challenger_hof|E]である"
 external_theocratic_puppet_reqs_tt: "[actor.GetShortUIName|U]は、以下のいずれかの条件を満たす必要がある：\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]に対する@weak_hook_icon! [hook|E]を持っている。または、[recipient.GetSheHe]が[king|E]ランク以上の場合、@unspent_strong_hook_icon![strong_hook|E]を持っている\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive]の[religious_superior|E]、またはそれ以上の立場にある\n$EFFECT_LIST_BULLET$以前に[recipient.GetShortUIName]を[puppeted|E]にしたことがある\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive]の[house|E]の[house_head|E]である\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]の[liege|E]、またはそれ以上の立場にあり、[recipient.GetHerHim]を[terrified_i][cowed|E]させている\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]と[friends|E]、[lovers|E]、または[soulmates|E]の関係にある\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]を@prison_icon! [imprisoning|E]している"
