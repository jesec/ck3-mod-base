 pam_interactions_events.0120.opening: "[recipient.GetFaith.GetReligion.GetAdjective]の光たる[recipient.GetFirstName]様へ"
 pam_interactions_events.0120.desc_religious_head_actor: "[recipient.GetFaith.CreatorName]が最初の[recipient.GetWomenMen]を生み出して以来、これほど立派な[recipient.GetTitleAsName]はかつておりません！仰せとあらば、喜んで従いましょう。\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "私ひとりで信徒を導くことはできません。[recipient.GetFaith.HighGodNamePossessive]の民の中でも第一の[recipient.GetTitleAsName]でさえ、俗世のしがらみからは逃れられぬものです。ゆえに、[actor.GetTitleAsName]よ、私はあなたに力を貸し、その意に従いましょう。\n\n"
 pam_interactions_events.0120.desc: "この務めを担えることを、ありがたく思います。[recipient.GetFaith.HighGodNamePossessive]の御心だけでなく、あなたの意にも従い、人々の魂を導くのですね？できる限り力を尽くしましょう。\n\n"
 pam_interactions_events.0120.desc_lunacy: "己の魂そのものが死につつあるようで、恐ろしい…もはや、あなたの言葉だけが慰めなのです…\n\n"
 pam_interactions_events.0120.desc_dread: "滅ぼすべき者を滅ぼしましょう。[recipient.GetFaith.HighGodName]に見放された者たちを… この私が見放されたように。\n\n"
 pam_interactions_events.0120.desc_piety: "[recipient.GetFaith.HighGodName|U]ご自身が、我らに聖なる使命を授けてくださったのです！\n\n"
 pam_interactions_events.0120.desc_friendly: "我が[recipient.Custom2('RelationToMe', SCOPE.sC('actor'))]への愛と、揺るぎない信頼が、これから先も私を導いてくれるでしょう。\n\n"
 pam_interactions_events.0120.desc_skill: "巧みなお導きのもとなら…私も大いなる偉業の一端を担えることでしょう。\n\n"
 pam_interactions_events.0120.outro: "あなたのどの望みを叶えればよろしいでしょうか？"
 pam_interactions_events.0120.a: "すべてだ、[recipient.GetTitleAsNameNoTooltip]よ！"
 pam_interactions_events.0121.opening: "尊き[ROOT.Char.GetTitleAsName]よ"
 pam_interactions_events.0121.desc_honor: "ここに、[recipient.GetPrimaryTitle.GetNameNoTier]の[recipient.GetTitleAsName]として抱いてきた誇りを捨て、これよりはあなたの言葉を何よりの拠り所といたします。\n\n"
 pam_interactions_events.0121.desc: "[recipient.GetPrimaryTitle.GetNameNoTier]の[recipient.GetTitleAsName]は、あなたの権力争いの一翼を担い、この俗世に干渉する手助けをしてくれるでしょう。\n\n"
 pam_interactions_events.0121.desc_lunacy: "おっしゃるとおり、私の宮廷は、くだらぬことをまくしたてる者と嘘つきばかり。見る夢さえ暗く陰っています。もはや、あなたの言葉だけが意味をなし、あなたの薬だけが癒しをもたらしてくれる…\n\n"
 pam_interactions_events.0121.desc_dread: "私は、あなたが振るう武器です。迷いも、ためらいもありません。\n\n"
 pam_interactions_events.0121.desc_piety: "どうかこの迷いを取り払い、[recipient.GetFaith.HighGodNamePossessive]の愛を得るための道をお示しください！\n\n"
 pam_interactions_events.0121.desc_friendly: "我が[recipient.Custom2('RelationToMe', SCOPE.sC('actor'))]よ、私は心からあなたを信じています。決してその信頼を裏切らぬと誓いましょう。\n\n"
 pam_interactions_events.0121.desc_skill: "あなたが我が領国の政務に目を配り、私が道を誤らぬよう導いてくださると信じています。\n\n"
 pam_interactions_events.0121.outro: "さぁ、あなたの計画を進めようではありませんか。"
 pam_interactions_events.0121.a: "[recipient.GetSheHe]は[recipient.GetTitleAsNameNoTooltip|U]ではあるが、[recipient.GetHerHis]の教会に仕えている。"
