 theological_agent_puppet: "領国祭司の傀儡"
 theological_agent_puppet_desc: "[realm_priest|E]である[puppet|E]は、教会におけるあなたの代弁者となります。あなたは[puppet|E]を通じて[ecumenical_councils|E]で投票し、[rites|E]を創設できるようになります。"
 puppet_type_no_candidates: "あなたには利用可能な[PuppetType.GetName|V]の[puppets|E]がない"
 puppet_action_description_puppet_action_give_gift: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('gift_interaction')]#!」を使用し、[gold|E]を消費して他の[character|E]からの[opinion|E]を向上させる"
 puppet_action_description_puppet_action_ask_excommunicate_character: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_excommunication_interaction')]#!」を使用し、[head_of_faith|E]に罪深い[character|E]を[excommunicate|E]させる"
 puppet_action_description_puppet_trigger_can_create_faith: "新たな[faith|E]を創設する"
 puppet_action_description_puppet_trigger_can_create_rite: "新たな[rite|E]を創設する"
 puppet_action_description_puppet_action_command_murder: "対象の[character|E]に[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('start_murder_interaction')]#!」を使用する"
 puppet_action_description_puppet_action_request_elevation: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_elevation_interaction')]#!」を使用し、より権威ある[clerical_title|E]を[head_of_faith|E]に請願する"
 request_clerical_region_title_cannot_request_hof_see_tt: "[head_of_faith|E]が保持する[clerical_title|E]は要請できない"
 request_clerical_region_title_capital_region_tt: "あなたの[capital|E]は、要請している[clerical_region|E]内になければならない"
 higher_piety_level_than_hof: "[piety_level|E]が[head_of_faith_possessive|e]より高い"
 lower_piety_level_than_hof: "[piety_level|E]が[head_of_faith_possessive|e]より低い"
 is_puppet_action_valid_first: "あなたは、「[PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]」を行えるようにする[puppet|E]を持っている"
 is_puppet_action_valid_third: "[CHARACTER.GetShortUIName|U]は、「[PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]」を行えるようにする[puppet|E]を持っている"
 is_puppet_action_valid_global: "「[PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]」を行えるようにする[puppet|E]を持っている"
 not_is_puppet_action_valid_first: "あなたは、「[PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]」を行えるようにする[puppet|E]を#bold 持っていない#!"
 not_is_puppet_action_valid_third: "[CHARACTER.GetShortUIName|U]は、「[PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]」を行えるようにする[puppet|E]を#bold 持っていない#!"
 not_is_puppet_action_valid_global: "「[PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]」を行えるようにする[puppet|E]を#bold 持っていない#!"
 request_elevation_interaction: "昇格の要請"
 request_elevation_interaction_desc: "あなたの[clerical_region|E]における[clerical_title|E]について、その地位が空位か、[superior|E]が保持しているかを問わず、[head_of_faith|E]に請願を行う"
 request_elevation_interaction_notification: "[target.GetNameNoTier]は、その座にふさわしい羊飼いを求めている。我をその座に据えれば、群れは決して迷うことのない導き手を知ることになるだろう。"
 request_elevation_cannot_unseat_player_tt: "他のプレイヤーに仕える[clerical_title|E]の[holder|E]を退かせることはできない"
 request_elevation_interaction_toast_title: "昇格した！"
 request_elevation_interaction_toast_title_puppeteer: "[puppet_or_actor.GetShortUIName]が昇格した！"
 request_ecclesiastical_title_expansion_interaction: "聖職称号の拡張を要請する"
 request_ecclesiastical_title_expansion_interaction_desc: "あなたの[head_of_faith|E]に請願し、あなたの[clerical_region|E]を隣接する[duchy|E]へ拡張させる\n\n選択した[duchy|E]のすべての[de_jure|E]伯爵領が、あなたの[clerical_region|E]に追加される"
 request_ecclesiastical_title_expansion_interaction_notification: "[target.GetNameNoTier]の信徒たちは霊的指導者を欠いている。[actor.GetFaith.HighGodName]の栄光のため、この地を我が大司教区の管轄下に置くことにする。"
 request_ecclesiastical_title_expansion_accepted_tt: "聖職称号が拡張された"
 recipient_secondary_request_ecclesiastical_title_expansion_interaction: "保持者"
 puppet_action_description_puppet_action_request_ecclesiastical_title_expansion: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_expansion_interaction')]#!」を使用し、あなたの[clerical_region|E]を隣接する[duchy|E]へ拡張するよう[head_of_faith|E]に請願する"
 request_ecclesiastical_title_merger_interaction: "聖職称号の統合を要請する"
 request_ecclesiastical_title_merger_interaction_desc: "あなたの[head_of_faith|E]に請願し、あなたの[capital_possessive|E]の[clerical_region_possessive|E]による隣接地域の編入を認可してもらう"
 request_ecclesiastical_title_merger_interaction_notification: "[target.GetNameNoTier]の民は、確かな導き手を欠いて道を外れている。だが、私のもとでは民が栄えている。その司教座も私にお任せいただきたい。さすれば、今は二つに分かれた群れを、ひとりの忠実な牧者が導くことになろう。"
 request_ecclesiastical_title_merger_accepted_tt: "聖職称号が統合された"
 request_ecclesiastical_title_merger_absorbed_tt: "聖職称号が失われた"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "対象となる隣接[clerical_region|E]がない。[clerical_region|E]は少なくとも1つの、宗派が同じ[clerical_region|E]と隣接していなければならない。"
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#!」を使用し、隣接する[clerical_region|E]をあなたの[clerical_region|E]に統合するよう[head_of_faith|E]に請願する"
 rival_ecclesiastical_title_merged: "[CHARACTER.GetShortUIName]は[TARGET_CHARACTER.GetShortUINamePossessive]の[clerical_title|E]を吸収した"
 request_ecclesiastical_title_creation_interaction: "聖職称号の創設を要請する"
 request_ecclesiastical_title_creation_interaction_desc: "あなたの[realm|E]内に新たな[clerical_title|E]を創設するよう、[head_of_faith|E]に請願する\n\nその[title|E]の拠点と最初の[holder|E]はあなたが選択する\n\n#weak 新たな[clerical_region|E]は、その座所の[de_jure|E][kingdom|E]に属する[de_jure|E][county|E]のうち、まだいずれの[clerical_region|E]にも属していないすべての[county|E]を管轄する#!"
 request_ecclesiastical_title_creation_interaction_notification: "我が領地の信徒たちは、遠方にいて彼らのこともろくに知らぬ者たちに導かれている。我が指定する拠点に新たな司教座を設けることをお認めいただきたい。さすれば、何ひとつ不足せぬよう取り計らおう。"
 request_ecclesiastical_title_creation_accepted_tt: "[new_title.GetNameNoTooltip]が創設された"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "あなたは、新たな[clerical_region|E]の拠点となる[de_jure|E][capital|E]を持つ[duchy|E]以上の[title|E]を保持していない"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip]は、新たな[clerical_region|E]の拠点となる[de_jure|E][capital|E]を持つ[duchy|E]以上の[title|E]を保持していない"
 pam_new_clerical_region_invalid_anchor_tt: "この[title|E]の[de_jure|E][capital|E]は、請願者の[faith|E]に属し、請願者の[realm|E]内にあり、まだ[clerical_region|E]内ではない必要がある"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "まだ[clerical_region|E]を保有していない[clergy|E]候補者が必要"
 recipient_secondary_request_ecclesiastical_title_creation_interaction: "保持者"
 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#!」を使用し、あなたの指定する[title|E]を基盤とする新しい[clerical_region|E][title|E]を創設するよう[head_of_faith|E]に請願する"
 request_create_new_ecclesiastical_title_effect_tt: "新しい[clerical_title|E]が[target_kingdom.GetName]の[de_jure|E][capital|E]を拠点に創設され、その座所の[de_jure|E][kingdom|E]の[de_jure|E][county|E]のうち、まだいずれの[clerical_region|E]にも含まれていないすべての[de_jure|E][county|E]を管轄範囲として、[new_ecclesiastical_holder.GetShortUIName]に授与される"
 request_ecclesiastical_title_split_interaction: "聖界称号の分割を要請する"
 request_ecclesiastical_title_split_interaction_desc: "既存の[clerical_region|E]から新たな聖界[title|E]を分割するよう、あなたの[head_of_faith|E]に請願する\n\nあなたが世俗[ruler|E]の場合、これはあなたの[capital|E]を基盤として創設され、あなたが選んだ[holder|E]に与えられる。あなたが所領持ちの聖職者の場合、あなたが最初の[holder|E]に任命される\n\n#weak 分割は領国の境界に従う。新しい[title|E]は、この[clerical_region|E]内であなた（聖職者の場合はあなたの[liege|E]）が保持する[counties|E]のみを対象とするため、[realm|E]が大きいほど分割される範囲が広くなる#!"
 request_ecclesiastical_title_split_interaction_notification: "ひとりの牧者だけで、これほど広い地を見守ることはできない。この地に新たな司教座を設ければ、誰ひとり取り残されることはあるまい。"
 clerical_title_split_tt: "[puppet_liege.GetTitledFirstNamePossessive]の[realm|E]を対象とする新たな聖界称号が[puppet_superior.GetName]の[clerical_region|E]から分割および創設され、[new_ecclesiastical_holder.GetName]がその初代[holder|E]になる"
 request_ecclesiastical_title_split_effect_tt: "[puppet_or_actor.GetTitledFirstNamePossessive]の[realm|E]を対象とする新たな[clerical_title|E]が[split_source_clerical_region.GetName]から分割され、[new_ecclesiastical_holder.GetShortUIName]に与えられる"
 request_ecclesiastical_title_split_accepted_tt: "聖界称号が分割された"
 request_ecclesiastical_title_split_lost_tt: "聖職管区が縮少した"
 actor_secondary_request_ecclesiastical_title_split_interaction: "新たな保持者"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "現在の保持者"
 pam_split_no_region_to_split_tt: "あなたの[realm|E]内に、[clerical_region|E]から切り分けることのできる領域が存在しなければならない"
 pam_split_no_region_to_split_tt_puppeteer: "[puppet_or_actor.GetShortUINamePossessiveNoTooltip]の[realm|E]内に、[clerical_region|E]から切り分けられる領域がなければならない"
 pam_split_capital_is_region_seat_tt: "[puppet_or_actor.GetShortUINamePossessiveNoTooltip|U]の[capital|E]は、分割される[clerical_region|E]の[clerical_region_capital|E]であってはならない"
 pam_split_no_eligible_holder_tt: "新しい[clerical_title|E]に適格な[holder|E]が存在しなければならない"
 pam_split_too_small_tt: "新しい[clerical_region|E]が小さすぎる。少なくとも#V 3#!つの[counties|E]を含んでいなければならない"
 pam_split_liege_capital_is_region_seat_tt: "あなたの[liege|E]の[capital|E]は、分割される[clerical_region|E]の[clerical_region_capital|E]であってはならない"
 pam_split_larger_than_superior_tt: "新しい[clerical_region|E]は、現在の[holder|E]が保持する部分より大きくすることはできない"
 pam_split_region_is_religious_head_seat_tt: "分割される[clerical_region|E]は、[head_of_faith|E]または[head_of_rite|E]の座所であってはならない"
 request_clerical_elector_title_interaction: "枢機卿職を要請する"
 request_clerical_elector_title_interaction_desc: "[head_of_faith|E]にあなたを[cardinal|E]に任命するよう請願する。あなたの[head_of_faith|E]があなたの[superior|e]になる"
 request_clerical_elector_title_interaction_notification: "これまで言葉でも行いでも信仰に尽くしてきた。今こそ、さらなる務めを担うために、緋色の帽子をお授けいただきたい。さすれば、枢機卿団で意見を述べる折、私が誰に与するかはおのずと明らかになるだろう。"
 request_clerical_elector_title_interaction_toast: "枢機卿職を授与された"
 request_clerical_elector_title_interaction_decline_toast: "[recipient.GetShortUINameNoTooltip|U]は、[puppet_or_actor.GetShortUINamePossessiveNoTooltip]の[cardinalate|E]を求める申し出を拒否した"
 request_clerical_elector_title_interaction_accept_tt: "[recipient.GetShortUINameNoTooltip|U]は、[puppet_or_actor.GetShortUINamePossessiveNoTooltip]の[cardinalate|E]を求める申し出を受け入れた"
 external_theological_agent_puppet: "聖職統治者の傀儡"
 external_clerical_puppet: "[external_clerical_puppet|E]"
 has_relation_external_clerical_puppet: "すでに[external_clerical_puppet|E]である"
 external_theological_agent_puppet_desc: "聖職者の[puppet|E]は、あなたの[realm|E]外にいる[archbishops|E]、[cardinals|E]、または[head_of_faith|E]である。いずれも強大な権力を持ち、[excommunicate|E]を行える。"
 external_ruler_puppet: "世俗統治者の傀儡"
 external_ruler_puppet_desc: "情、恐れ、あるいは恩義に縛られた[ruler|E]。命じれば、あなたのために[scheme|E]を行い、その[realm|E]をあなたの[realm|E]のために働かせることができる。"
 # Religious - PAM (additions)
 puppet_action_description_puppet_action_request_ecclesiastical_title_split: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_split_interaction')]#!」を使用し、既存の[clerical_region|E]から新しい[clerical_title|E]を分割するよう[head_of_faith|E]に請願する"
 puppet_action_description_puppet_action_demand_church_succession_hof: "[head_of_faith|E]として[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('demand_church_succession_religious_head_interaction')]#!」を使用し、同じ[faith|E]の[rulerpossessive|E]の主要[title|E]の代替継承を誓約させる"
 puppet_action_description_puppet_action_give_cardinal_order: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('give_cardinal_order_interaction')]#!」を使用し、その[baronies|E]に地域[modifiers|E]を適用する"
 puppet_action_description_puppet_action_appoint_cardinal: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('appoint_cardinal_interaction')]#!」を使用し、同じ[faith|E]の[clergy|E]を[cardinal|E]に任命する"
 puppet_action_description_puppet_action_destroy_cardinalate: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('destroy_cardinalate_interaction')]#!」を使用して[cardinalate|E]を廃止し、その保持者を[college_of_cardinals|E]から除名する"
 puppet_action_description_puppet_action_ecclesiastic_grant_claim: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('ecclesiastic_grant_claim_interaction')]#!」を使用し、同じ[faith|E]の[rulerpossessive|E]の[title|E]に対する[pressed_claim|E]を得る"
 puppet_action_description_puppet_action_sway_ruler_to_my_rite: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('sway_ruler_to_my_rite_interaction')]#!」を使用し、同じ[faith|E]の[ruler|E]を味方につける"
 # Religious
 puppet_action_description_puppet_action_demand_conversion: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('demand_conversion_interaction')]#!」を使用し、同じ[house|E]の[ruler|E]にあなたの[faith|E]に改宗するよう強制する"
 puppet_action_description_puppet_action_demand_conversion_vassal_ruler: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('demand_conversion_vassal_ruler_interaction')]#!」を使用し、[vassal|E]または[tributary|E]にあなたの[faith|E]に改宗するよう強制する"
 puppet_action_description_puppet_action_request_clerical_chastity: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('request_clerical_chastity_interaction')]#!」を使用し、同じ[faith|E]の成人に貞潔の誓願を立てさせる"
 puppet_action_description_puppet_action_take_vows: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('take_vows_interaction')]#!」を使用し、[courtier|E]を聖職者に加わらせる"
 puppet_action_description_puppet_action_take_monastic_vows: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('take_monastic_vows_interaction')]#!」を使用し、[courtier|E]を[monastic_holy_order|E]に送る"
 puppet_action_description_puppet_action_send_to_holy_order: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('send_to_holy_order_interaction')]#!」を使用し、[courtier|E]または[child|E]を奉仕のために送る"
 puppet_action_description_puppet_action_monastic_donation: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('monastic_donation_interaction')]#!」を使用し、[gold|E]を寄進して見返りに[spiritual_fulfillment|E]を得る"
 puppet_action_description_puppet_action_lease_monastic: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('lease_title_to_existing_monastic_order_interaction')]#!」を使用し、[church_holding|E]の[barony|E]を[holy_order|E]に貸与する"
 puppet_action_description_puppet_action_declaration_of_repentance: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('declaration_of_repentance_interaction')]#!」を使用し、[head_of_faith|E]にあなたの[excommunication|E]を解除してもらうよう請願する"
 puppet_action_description_puppet_action_inspire_conversion: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('inspire_conversion_interaction')]#!」を使用し、[nomadic|E]の[vassal|E]（およびその伯爵領）をあなたの本拠地の[faith|E]に改宗させる"
 puppet_action_description_puppet_action_literalist_debate: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('literalist_debate_interaction')]#!」を使用し、同じ宗派の同輩の相手と論戦を交わして[piety|E]を獲得する"
 puppet_action_description_puppet_action_strengthen_claim: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('strengthen_claim_interaction')]#!」を使用し、[bishop_possessive|E]の支持によって弱い[claim|E]を強化する"
 puppet_action_description_puppet_action_convert_to_religion: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('convert_to_religion_interaction')]#!」を使用し、自発的にあなたの[liege_possessive|E]の[faith|E]または[suzerain|E]の[faith|E]に改宗する"
 puppet_action_description_puppet_action_designate_theocratic_heir: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('designate_theocratic_heir_interaction')]#!」を使用し、同じ[faith|E]の[courtier|E]をあなたの後継者に指名する"
 puppet_action_description_puppet_action_demand_church_succession: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('demand_church_succession_interaction')]#!」を使用し、[clerical_title|E][holder|E]として隣接する[title|E]の代替相続権を獲得する"
 puppet_action_description_puppet_action_increase_theocratic_heir_candidacy: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('increase_theocratic_heir_candidacy')]#!」を使用し、[clerical_title|E]に対する候補者の[appointment_level|E]を上昇させる"
 puppet_action_description_puppet_action_excommunicate: "[sinful|E]特性を持つ同じ[faith|E]の[character|E]に、[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('excommunicate_interaction')]#!」を使用する"
 puppet_action_description_puppet_action_lift_excommunication: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('lift_excommunication_interaction')]#!」を使用し、[character|E]を赦免する"
 puppet_action_description_puppet_action_temporal_condemnation: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('temporal_condemnation_interaction')]#!」を使用し、同じ[religion|E]の成人[vassal|E]の非難を試みる"
 puppet_action_description_puppet_action_select_ghw_beneficiary: "[interaction|E]「#V [GetPlayer.GetPlayerInteractionName('select_ghw_beneficiary_interaction')]#!」を使用し、参加を誓約した[great_holy_war|E]でのあなたの[beneficiary|E]を選ぶ"
