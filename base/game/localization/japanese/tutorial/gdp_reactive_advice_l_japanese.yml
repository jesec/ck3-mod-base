l_japanese:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "建造物の需要"
 action_reactive_advice_building_needs: "アドバイス：$REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "あなたの[buildings|E]には、地元の[market|E]から供給される[trade_goods|E]の[needs|E]があります。ここを開いて、需要を満たす方法を確認しましょう。"
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "[domain|E]内の[buildings|E]を最大限に活用するには、建造物が必要とする[trade_goods|E]を利用できるようにする必要があります。\n\nその方法を見てみましょう！"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "まず、あなたの[domain|E]を見てみましょう。"
 reactive_advice_building_needs_step_open_domain_tab_prompt: "「領国」パネルで「直轄領」タブ（ハイライト）を開いてください"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "ここには、あなたの[domain|E]に含まれるすべての[holdings|E]が表示されます。\n\n各領分が置かれている[county|E]は、いずれかの[market|E]に属しています。[buildings|E]で生産・消費される[goods|E]はすべて、その市場で取引されます。"
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "次に、あなたの[holdings|E]を見てみましょう。"
 reactive_advice_building_needs_step_open_county_view_prompt: "あなたの領分（ハイライト）の1つをクリックしてください"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "これらがあなたの[holding|E]にある[districts|E]です。各地区には、[goods|E]を生産・消費する[buildings|E]があります。"
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "例として、[holding_district|E]の[needs|E]を見てみましょう。"
 reactive_advice_building_needs_step_open_district_view_prompt: "「$game_concept_holding_district$」（ハイライト）をクリックしてください#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "ここでは、[district|E]内にある各[building|E]の効果を確認できます。\n\n一部の効果は、[county|E]が属する[market|E]の[trade_goods|E]を消費しなければ発揮されません。\n\nたとえば、[holding_district|E]は、[GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon]と[GetTradeGoodCategory('trade_category_meat').GetNameWithIcon]を消費できれば、[holding|E]に[food_supply|E]をもたらします。\n\n[need|E]を満たせなくても悪影響はありません。また、必要な$game_concept_trade_goods$が手に入らなくても、どの$game_concept_buildings$も何らかの恩恵をもたらします。"
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "多くの場合、特定の[trade_good|E]が必要なわけではなく、指定された[trade_category_short|E]に属する$game_concept_goods$であれば、どう組み合わせても構いません。たとえば、[building|E]が[GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon]を必要としている場合、[GetTradeGoodType('trade_good_grain').GetNameWithIcon]、[GetTradeGoodType('trade_good_millet').GetNameWithIcon]、[GetTradeGoodType('trade_good_rice').GetNameWithIcon]のどれでも条件を満たせます。\n\nさらに、一部の[needs|E]は複数回満たすことができます。必要量を満たすごとに、効果が重ねて適用されます。"
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "では、[buildings|E]が必要とする[trade_goods|E]は、どこから来るのでしょうか？\n\n[county|E]で消費される各交易品は、その伯爵領の[market|E]から供給されます。"
 reactive_advice_building_needs_step_open_market_view_prompt: "伯爵領の市場（ハイライト）を開いてください#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "これが[county|E]の[market|E]です。通常、市場は[duchy|E]と同じ範囲の[counties|E]を含みます。"
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "ここでは、それぞれの[trade_good|E]について、[surplus|E]があるか、あるいは満たされていない[need|E]がないかを確認できます。\n\n需要が満たされていない場合（#N 負の収支#!）、[market|E]内には[needs|E]を満たせていない[buildings|E]があります。\n\n余剰がある場合（#P 正の収支#!）、市場内のすべての[buildings|E]でその交易品の需要が満たされ、その交易品を[trade_routes|E]を通じて輸出することができます。\n\n#I $game_concept_trade_good$をクリックすると、市場とマップ上でその状況を確認できます。#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "満たされていない[need|E]がある場合は、次のような方法で対処できます。\n\n$BULLET_WITH_TAB$その[trade_good|E]を生産する[buildings|E]を[market|E]内に建設する。\n$BULLET_WITH_TAB$[realm|E]内の2つの$game_concept_markets$を結ぶ[distribution_route|E]を設定する。\n$BULLET_WITH_TAB$いずれかの[client_merchants|E]に依頼して、その$game_concept_trade_good$を輸入する。\n\nただし、すべての$game_concept_needs$を簡単に満たせるとは限りません。また、$game_concept_need$を満たさずにおくほうがよい場合もあります。"
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "建設を予約する"
 action_reactive_advice_construction_queue: "アドバイス：$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "建設を予約しました。ここを開いて、すべての建設を管理する方法を確認しましょう。"
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "建設を予約しました！\n\n今すぐ[building|E]の費用を支払えなくても、支払えるようになった時点で建設が始まるよう、予約しておくことができます。\n\n予約一覧を見てみましょう。"
 reactive_advice_construction_queue_intro_prompt: "「$BUILD_QUEUE_WINDOW_TITLE$」パネル（ハイライト）を開いてください"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "これが、これまでに予約した、すべての[holdings|E]の建設です。\n\nコストを支払えるようになり、その他の条件もすべて満たされると、自動的にコストが支払われ、建設が始まります。\n\n建設は予約した順番に開始されますが、ここでドラッグ＆ドロップして順番を変更することもできます。"
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "[gold|E]やその他の資源を取っておきたい場合は、ここで保管できます。\n\n予備分は予約中の建設の開始には使われないため、緊急時のために備えておくことができます。"
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "建設の予約について知っておくべきことは以上です。それでは、建設をお楽しみください！"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "交易路"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "ある者は畑で汗を流し、またある者は貧しい民から税を取り立てています。一方、あなたは[goods|E]の流通によって利益を上げています。\n\n[merchants|E]や[republics|E]にとって、[trade_routes|E]は[gold|E]を稼ぐための主な手段です。"
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "まず、どの[trade_good|E]を取引するかを決める必要があります。\n\nここに表示されているのはおすすめの交易品ですが、目当ての品がある場合は、すべての交易品を表示することもできます。"
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "マップ上では、選択した[trade_good|E]が取引されているすべての[markets|E]を確認できます。\n\n交易を行うには、その交易品に[surplus|E]がある市場（#trade_surplus 青緑#!）と、[need|E]がある場所（#trade_need 金色#!）を結ぶ必要があります。\n\nほかの[merchants|E]が多く集まる市場では、[competitiveness|E]に応じて、取引できる交易品の量が制限されます。\n\n安く買って高く売れば、より大きな利益を得られます。\n\n#I 市場をクリックすると、交易路に追加したり、そこから外したりできます。#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "[route|E]に[markets|E]を追加すると、選択した[good|E]がその交易路で運ばれるようになり、ここに表示されます。\n\n一番左にある商品が[primary_good|E]です。この商品を取引すると[trade_expertise|E]を獲得でき、やがてその[trade_category|E]に応じたさまざまな恩恵を受けられるようになります。\n\n#I 複数の商品を運んでいる場合は、別の商品を先頭にドラッグすると、それを$game_concept_primary_good$に変更できます。#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "運べる[goods|E]の品目数と合計[capacity|E]には上限があります。\n\nこのような上限は、[company|E]に[company_buildings_short|E]を建設することで引き上げることができます。"
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "同様に、[trade_route_length|E]も上限があり、立ち寄れる[markets|E]の数にも限りがあります。"
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "最後に、[associates|E]の1人を[trader|E]に任命できます。与える任務によって、[route|E]のどの要素が強化されるかが変わります。"
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "[company|E]を発展させていくと、利用できる[routes|E]の数が増え、その距離や取引量も伸ばせるようになります。\n\nこうして、ますます多くの[gold|E]を稼げるようになるのです。"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "交易商人としての心得"
 action_reactive_advice_merchant_introduction: "アドバイス：$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "あなたは[merchant|E]です！これを開いて、商売の基本を学びましょう。"
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "あなたは[merchant|E]です！\n\n[trade|E]は[company|E]の生命線ですが、金儲けだけが商売ではありません。"
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "まずは、[company|E]を長期的にどう成長させていくかを見ていきましょう。"
 reactive_advice_merchant_introduction_open_overview_prompt: "「領国」パネルで「概要」タブを開いてください（ハイライトされています）"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "これはあなたの[company_size|E]です。$game_concept_company_possessive$の勢力を示す主な指標となります。\n\n$game_concept_company$が成長すると、[kings|E]や[emperors|E]といった高い[rank|E]の[rulers|E]からも注目されるようになります。"
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "これはあなたの[company|E]の活動拠点となる[domicile|E]です。\n\nここでは、[gold|E]や[prestige|E]を消費して[domicile_buildings|E]を建設し、$game_concept_company$をさらに発展させることができます。"
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "これはあなたの[company_purpose|E]です。$game_concept_company$がどのような事業に力を入れるかを決定します。\n\nデフォルトでは「交易担当者」が選ばれていますが、[artifacts|E]、贅沢品、または融資を重視する理念に変更することもできます。"
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "とはいえ、たとえ[merchant|E]であっても、土地の領主の支配からは逃れられません。"
 reactive_advice_merchant_introduction_open_patronage_prompt: "「$MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$」タブを開いてください（ハイライトされています）"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "これはあなたの[merchant_patron|E]です。[domicile|E]が置かれた[holding|E]の[ruler|E]が、$game_concept_merchant_patron$となります。\n\n$game_concept_merchant_patron$には税金を納めなければなりませんが、この関係から得られる恩恵もあります。\n\nたとえば、[client_contract|E]を変更すれば、$game_concept_merchant_patron$に交易活動を支援してもらったり、貴族との[marriages|E]を提案しやすくしたりできます。"
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "通常、[merchant_patron|E]の[client|E]となっている[merchant|E]は、あなただけではありません。\n\nほかの$game_concept_clients$もあなたと同じ場所を拠点に交易を行っていますが、特別な[charter|E]を保有できる$game_concept_client$は1人だけです。$game_concept_charter$を持っていれば、特別な[decisions|E]を通じて交易をさらに有利に進められます。"
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "最後に、ここまであえて触れずにきた本題に移りましょう。そう、金儲けです。"
 reactive_advice_merchant_introduction_open_trade_prompt: "「交易」パネルで「交易路」タブを開いてください（ハイライトされています）"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "これはあなたの[trade_routes|E]です。[gold|E]を稼ぐための主な手段となります。\n\n$game_concept_company$を発展させていくと、利用できる$game_concept_routes$の数が増え、より遠くまで、より多くの[goods|E]を運べるようになります。それに伴い、獲得できる$game_concept_gold$も増えていきます。"
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "[trade_routes|E]で[gold|E]を稼ぎ、それを元手に[prestige|E]を高め、[company_size|E]を拡大していく。これこそが[merchant|E]の流儀です。\n\n堅実で抜かりのない$game_concept_merchants$が営む事業は、いずれ裕福な[rulers|E]が所有する事業をも追い抜くでしょう！"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "商会風土"
 action_reactive_advice_company_direction: "アドバイス：$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "あなたの[company_direction|E]は、時間とともに変化することがあります。詳しい説明を見るには、ここを開いてください。"
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "[merchants|E]の目指すものは、人それぞれです。[gold|E]はそれだけで力となりますが、一族や貴族としての地位をより重んじる者もいます。"
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "[company_direction|E]は[house|E]に属するものなので、そちらを見てみましょう。"
 reactive_advice_company_direction_open_house_prompt: "あなたの「家」を選択してください（ハイライトされています）"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "続いて、「[sentiment|E]」タブに進みましょう。"
 reactive_advice_company_direction_open_direction_tab_prompt: "「風土」タブを開いてください（ハイライトされています）"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "これはあなたの[company_direction|E]です。最初は[company_sentiment_independent|E]ですが、[company_sentiment_divided|E]か[company_sentiment_concerted|E]のどちらかに傾くことがあります。\n\n[noble|E]の[houses|E]と婚姻を結ぶと$game_concept_company_sentiment_concerted$に、ほかの[merchants|E]と婚姻を結ぶと$game_concept_company_sentiment_divided$に傾きます。"
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "建設に出資する"
 action_reactive_advice_sponsor_construction: "アドバイス：$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "ほかの[characters_possessive|E]の[holdings|E]で、[buildings|E]の建設に出資できます。方法を確認するには、ここを開いてください。"
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "ほかの[characters_possessive|E]の[holdings|E]で、[buildings|E]のアップグレードに出資できます。"
 reactive_advice_sponsor_construction_select_holding_prompt: "マップ上で、いずれかの領分を選択してください"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "次に、その領分にある[districts|E]を1つ選択してください。"
 reactive_advice_sponsor_construction_open_district_prompt: "地区を選択してください（ハイライトされています）"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "ここでは、建設に出資できます。ただし、出資できるのは通常の[districts|E]にある[buildings|E]の#EMP アップグレード#!に限定されます。\n\n出資の主な目的は、[holding_possessive|E]の[market|E]における[trade_good|E]の[surplus|E]または[need|E]を増やすことです。そうすれば、その$game_concept_market$をあなたの[profit_routes|E]の1つにつなげて、得られる[gold|E]を増やすことができます。"
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "共和制の政治"
 action_reactive_advice_republican_politics: "アドバイス：$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "あなたは[republic|E]国家の一員です。その複雑な政治の仕組みについて知るには、ここを開いてください。"
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "[house_head|E]であるあなたは、高潔な[republic|E]国家の一員です！\n\n[patrician_family|E]を率いるあなたは、ほかの$game_concept_patrician_families$とともに、それなりに民主的な手続きを経て統治を行います。たとえ今は$game_concept_republic$国家の[ruler|E]でなくとも、[gold|E]と影響力さえあれば、いつでも政治に参加できます。"
 reactive_advice_republican_politics_intro_prompt: "「共和制」パネルで「概要」タブを開いてください（ハイライトされています）"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "市民がみな平等ではないのと同じく、[republics|E]国家もすべてが対等なわけではありません。ここに表示されているとおり、$game_concept_republic$国家にはそれぞれ[title_tier|E]と[republic_administration|E]があります。\n\n[ruler|E]は[prestige|E]と[treasury|E]を費やして$game_concept_republic$国家の$game_concept_title_tier$を引き上げ、ひいては国力を高めることができます。\n\nまた、現在の$game_concept_ruler$は、$game_concept_republic$国家の大まかな方向性を決める$game_concept_republic_administration$を変更することもできます。"
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "[ruler|E]といえば、この人物がそうです！\n\nほかの[governments|E]に見られる暴政とは異なり、[republic|E]国家の$game_concept_ruler$は選挙で選ばれ、その任期にも限りがあります。\n\nただし、同じ$game_concept_ruler$が再選されることもあるため、現職がそのまま最有力候補になっていることも珍しくありません。"
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "[ruler|E]の権力には、[assembly|E]による歯止めがかかっています。では、さっそく見てみましょう。"
 reactive_advice_republican_politics_open_assembly_prompt: "「議会」タブを開いてください（ハイライトされています）"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "[ruler|E]の権力は絶対ではありません。[law|E]の変更や[republic_decree_short|E]の発布には、必ず[assembly|E]の承認が必要です。$game_concept_assembly$の議員たちは、自ら$game_concept_law$の変更を提案することさえできます。\n\n通常、$game_concept_assembly$には[republic|E]国家の[patrician_families|E]が参加しています。現代的な意味でのイデオロギーこそ持っていませんが、それぞれに投票の判断を左右する[house_ambition|E]があります。\n\nなお、$game_concept_republic$国家だからといって、民主制につきものの雑多さや混乱に甘んじる必要はありません。$game_concept_laws$が可決されるにつれて、$game_concept_assembly$と$game_concept_ruler$の力関係も変わっていくことがあります。"
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "[assembly|E]は[patrician_families|E]で構成されていることが多いので、続いてそちらを見ていきましょう。"
 reactive_advice_republican_politics_open_families_prompt: "「一族」タブを開いてください（ハイライトされています）"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "ここに並んでいるのが、[republic|E]国家の[patrician_families|E]です。\n\nあなたの一族も含め、どの一族にも[patrician_rating|E]があります。[trade|E]による収入を増やしたり、[assembly|E]の議席を獲得したり、[ruler|E]の[council|E]に加わったりすると、$game_concept_patrician_rating$は上がっていきます。\n\n$game_concept_patrician_rating$が高いほど、[house_ambition|E]の効果が強まり、政権を転覆させることさえできるようになります。"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "[republic|E]国家の命運は、あなたの手に委ねられています。\n\nこの国をどのような姿にするかは、あなた次第です。権力を自分の一族で独占するのか、それともほかの者たちと分かち合うのか——\n\n[trade_routes|E]によって[patrician_rating|E]が高まるにつれ、あなたの権力と影響力も増していきます。"
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "ここでは、[distribution_routes|E]を自分で作成できます。\n\n流通交易路で[trade_goods|E]を運べば、自分の[realm|E]内にある[markets|E]の[needs|E]を満たすことができます。"
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "[distribution_route|E]で運べる[trade_goods|E]の量に上限はありませんが、運べるのはここに表示されている[basic_trade_goods|E]だけです。\n\nそのため、どの$game_concept_trade_good$を運ぶかを選択する必要はありません。\n\n#I いずれかの基本交易品を選択すると、マップ上でその[market_balance|E]を確認できます#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "マップ上では、各[market|E]の名前の下に、[surplus|E]が生じている[basic_trade_goods|E]が表示されます。つまり、その商品は、その市場から運び出しても構わないというわけです。"
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "同様に、未充足の[needs|E]も表示されます。つまり、どの[basic_trade_goods|E]をその[market|E]に運び込めばよいかがわかるのです。"
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "1本の[distribution_route|E]で結べる[markets|E]は2つだけであり、[goods|E]はその間を双方向に運ばれます。\n\n流通交易路に2つの市場を追加すると、ハイライトされたウィンドウで[needs|E]の充足状況を確認できます。\n\n流通交易路は自分の[realm|E]内を通るため、[buy_price|E]や[tolls|E]を支払う必要はありません。\n\n#I マップ上で市場をクリックすると、流通交易路に加えたり外したりできます#!"
