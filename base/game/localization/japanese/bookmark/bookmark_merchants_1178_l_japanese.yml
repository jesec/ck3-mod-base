l_japanese:
 bm_1178_merchants: "ゲルフ派とギベリン派"
 bm_1178_merchants_desc: "ゲルフ派とギベリン派の対立は、長年にわたって深まってきた。11世紀末の叙任権闘争に端を発し、両者の対立は1世紀にわたってくすぶり続けている。\n\nフリードリヒ・バルバロッサが皇帝に即位すると、対立は激化し、今やイタリア全土がいずれかの陣営を選ぼうとしている。ギベリン派は皇帝を支持し、ゲルフ派はローマ教皇を支持している。\n\n#bold この対立は、イタリアの共和制都市国家の内部でも、都市国家同士の間でも激しく燃え盛っている。どちらの陣営につくか選び、選んだ陣営を勝利へと導こう！#!"
 bookmark_merchants_1178_marco_sanudo: "マルコ・サヌード"
 bookmark_merchants_1178_marco_sanudo_subheading: "ヴェネツィアのパトリシアン"
 bookmark_merchants_1178_enrico_dandolo: "エンリコ・ダンドロ"
 bookmark_merchants_1178_marco_sanudo_desc: "サヌード家はヴェネツィアの古い貴族家門の一つであり、全盛期に幾度もドージェ（総督）を輩出した伝説的なカンディアーノ家と血縁関係にあるとされている。\n\n父の死後、若くして一族の当主となったマルコは、叔父のエンリコ・ダンドロと親しい間柄にある。エンリコは後に第4回十字軍を主導した人物として歴史に名を残すことになる。\n\n#bold あなたは群島公の座に就くという運命を、現実のものにできるだろうか？#!"
 bookmark_merchants_1178_humbert_savoy: "ウンベルト3世・ディ・サヴォイア"
 bookmark_merchants_1178_humbert_savoy_subheading: "サヴォイア公#b #bol （ゲルフ派）#!#!"
 bookmark_merchants_1178_thomas_savoy: "トンマーゾ"
 bookmark_merchants_1178_humbert_savoy_desc: "サヴォイア公ウンベルトは、地域の修道院に惜しみなく寄進し、3番目の妻が亡くなった後にはしばらく世俗の生活から完全に身を引くなど、敬虔な人物であることを示してきた。\n\nゲルフ派に味方して以来、フリードリヒ・バルバロッサと対立しており、領地を奪われ、略奪も受けている。\n\n#bold あなたは皇帝からサヴォイアの領土を守り抜くことができるだろうか？#!"
 bookmark_merchants_1178_guido_guerra: "グイド・グェッラ3世"
 bookmark_merchants_1178_guido_guerra_subheading: "カゼンティーノ伯爵#color_yellow #bol （ギベリン派）#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "リナルド"
 bookmark_merchants_1178_guido_guerra_desc: "グイディ家は何世紀にもわたってアルノ川上流域を治める伯爵家であり、トスカーナでこの一族より長い歴史を持つ家はほとんどない。\n\nグイド・グエッラは生涯を皇帝への奉仕に捧げてきた。ミラノ包囲戦にも参加し、バルバロッサ帝からは、アペニン山脈の両側にある城砦や諸権利、鉱山の保有を認める特許状を得ている。\n\n#bold あなたは歴史に名を残す伯爵領を築き上げることができるだろうか？#!"
 bookmark_merchants_1178_speronella_dalesmanni: "スペロネッラ・ダレスマンニ"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "パドヴァのパトリシアン#b #bol （ゲルフ派）#!#!"
 bookmark_merchants_1178_ezzelino_ii: "エッチェリーノ・ダ・ロマーノ"
 bookmark_merchants_1178_pietro_iii: "ピエトロ・トラヴェルサーリ"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "10代の頃、スペロネッラはパドヴァの皇帝代理官パガーノ・デッラ・トッレに誘拐された。やがてスペロネッラが自身の兄の手によって解放されると、皇帝代理官は失脚し、その没落とともにパドヴァ市は自治都市となった。\n\n#bold 自由の身となった今、あなたは伝説的な存在となった自分の名声を、政治的な権力や富に変えることができるだろうか？#!"
 bookmark_merchants_1178_konrad_urslingen: "コンラート・フォン・ウルスリンゲン"
 bookmark_merchants_1178_konrad_urslingen_subheading: "スポレート公 #color_yellow #bol（ギベリン派）#!#!"
 bookmark_merchants_1178_jutta_urslingen: "ユッタ"
 bookmark_merchants_1178_konrad_urslingen_desc: "若きドイツ人公爵コンラートは、皇帝の意向を受けて、イタリアのスポレート公国を治めている。スポレートは半島の中心に位置し、南北から伸びる街道がすべて交わる要衝である。コンラートの権威は皇帝の寵愛に支えられているが、その皇帝はアルプスの向こう側、はるか彼方だ。\n\n#bold あなたはイタリア半島の中核地帯を自らの支配下に置くことができるか、あるいは人々に統治を拒まれることになるだろうか？#!"
