l_japanese:
 bm_1066_merchants: "商業の動脈"
 bm_1066_merchants_desc: "領国が栄えるには、自らを支えるだけでなく、物資の流れを絶やさぬことが必要である。そもそも、大規模な遠征において統治者が勝利できるのは、生得の権利ゆえではない。軍勢を支える武器、物資、そして異国からの援助を得ることができるのは、ほかならぬ黄金のおかげなのである。\n\nあらゆる交易の背後に、あらゆる取引の成立に、商人たちの働きがある。彼らは伝説的な交易路に沿って隊商と商船を動かしている。しかるべき評価が与えられないなら、彼らは自らの居場所を切り開き、市民自らが統治する新たな都市の形を生み出すだろう。\n\n#bold 富が権力の尺度となるとき、あなたは一族を率いて市場を支配し、永く続く交易帝国を築き上げることができるだろうか？#!"
 bookmark_merchants_domenico_contarini: "ドメニコ・コンタリーニ"
 bookmark_merchants_domenico_contarini_subheading: "ヴェネツィアのドージェ"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "イブン・ジャラーダ"
 bookmark_merchants_ibn_jarada_subheading: "バグダッドの商人"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "孫忠"
 bookmark_merchants_sun_zhong_subheading: "明州の商人"
 bookmark_merchants_sun_zhong_desc: "明州の港は、宋の国土が東の海と接する場所だ。孫忠は、この港を活気づける立役者となった。彼の倉庫から絹や陶磁器が日本や高麗へと運ばれ、その代わりに香や銀がもたらされる。交易に課税する役人たちも、時宜にかなった贈り物を受け取るほうが、交易を正式に報告するより得だと心得ている。\n\n#bold シルクロードの東の果てにあるのは、隊商路ではなく港だ。あなたはどの朝廷にも妨げられない交易の大きな流れを築き、孫家の名を広めることができるだろうか？#!"
 bookmark_merchants_vitale_faliero: "ヴィターレ・ファリエロ"
 bookmark_merchants_vitale_faliero_subheading: "ヴェネツィアのパトリシアン"
 bookmark_merchants_vitale_faliero_desc: "ファリエロ家はヴェネツィアでも屈指の野心的な商家であり、ヴィターレは競合他社も踏み込めない東方へと商圏を広げてきた。ビザンツの交易路、アドリア海で勢力を伸ばすノルマン人、そして都市評議会にいる嫉妬深いライバルたちが、四方から圧力をかけてくる。\n\n#bold ヴェネツィアは東西世界が交わる要衝だ。果たしてあなたは、ファリエロ家の名を掲げ、その双方を制することができるか？#!"
 bookmark_merchants_wuhsha_al_dallala: "仲買人ウフシャ"
 bookmark_merchants_wuhsha_al_dallala_subheading: "カイロの仲買人"
 bookmark_merchants_wuhsha_al_dallala_desc: "莫大な富を築いた女性、ウフシャ・アル＝ダッララは、自らの財産だけでなく、敵の財産にも目を光らせている。\n\n自立心の強さゆえに、彼女はシナゴーグから追放されることになった。しかし、ウフシャは忍耐を心得ていた。自分に不当な仕打ちをした者たちへの復讐の機会をうかがいながら、じっとその時を待っている。\n\n#bold 貸付を利用して敵に屈辱を与える手腕が、あなたにはあるだろうか？#!"
 bookmark_merchants_greek_salvidi_1: "ヒレル・サルヴィディ"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "アブー・サイード"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "ウフシャの息子"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "ナッタル・サフ"
 bookmark_merchants_nattal_sahu_subheading: "デリーの商人領主"
 bookmark_merchants_nattal_sahu_desc: "ヨーギニープラの市場では、サフ家の名は深い敬意を集めている。ナッタルはデリーのジャイナ教商人共同体の長であり、またトマラ朝の王アナンガパーラ2世から信頼されている顧問でもある。ナッタルは西方の港からベンガルの市場に至る交易網を築き上げた。\n\n#bold 果たしてあなたは、王の信頼と商人の才覚を武器に、後世に残る偉業を成し遂げることができるか？#!"
 bookmark_merchants_new_merchant_company: "カスタムキャラクター"
 bookmark_merchants_new_merchant_company_subheading: "シルクロードの交易商人"
 bookmark_merchants_new_merchant_company_desc: "シルクロードは皇帝のものでも、王のものでもない。その道を歩む勇気を持つ者たちのものだ。\n\n東西が交わる要衝に、自らの商会を興そう。サマルカンドのバザールから地中海の港に至るまで交易路を切り拓き、隊商を一隊、また一隊と送り出して交易帝国を築き上げていこう。\n\n#bold 果たしてあなたは、一族の名を百の都市に響き渡らせることができるか？#!"
