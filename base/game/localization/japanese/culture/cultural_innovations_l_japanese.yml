 unlock_maa_cloud_ladder: "[GetMaA('cloud_ladder').GetName]を[men_at_arms|E]に採用できる"
 unlock_maa_siege_tower: "[GetMaA('siege_tower').GetName]を[men_at_arms|E]に採用できる"
 unlock_maa_cannon: "[GetMaA('cannon').GetName]を[men_at_arms|E]に採用できる"
 unlock_maa_bombard: "[GetMaA('bombard').GetName]を[men_at_arms|E]に採用できる"
 unlock_maa_trebuchet: "[GetMaA('trebuchet').GetName]を[men_at_arms|E]に採用できる"
 unlock_maa_mangonel: "[GetMaA('mangonel').GetName]を[men_at_arms|E]に採用できる"
 innovation_heavy_plow: "重量有輪すき"
 innovation_heavy_plow_desc: "車輪を取り付け、複数の牛や馬に引かせれば、より重い鉄製のすきも容易に牽引できる。この技術革新によって、これまでは耕作が困難、あるいは不可能だった土地も耕せるようになる。"
 innovation_heavy_plow_eri: "エリ灌漑方式"
 innovation_heavy_plow_eri_desc: "堤で囲んだ貯水池を連ねてモンスーンの雨水を集め、乾季に蓄えておくことで、一年を通して作付けや栽培を行えるようになる。"
 innovation_heavy_plow_transplanting: "移植と接ぎ木"
 innovation_heavy_plow_transplanting_desc: "植物の育成や増殖の技術を活用すれば、収穫量を大幅に増やすことができる。"
 culture_parameter_stone_forts: "[GetBuildingType('wall_wardens_offices_1').GetName]は[GetTradeGoodCategory('trade_category_carpentry_supplies').GetName]ではなく[GetTradeGoodType('trade_good_stone').GetNameWithIcon]を必要とする"
 culture_parameter_heavy_plow: "[GetDistrictType('grain_district').GetName]は[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]だけでなく、[GetTradeGoodType('trade_good_iron').GetNameWithIcon]と[GetTradeGoodCategory('trade_category_beasts_of_burden').GetName]も必要とするようになる"
 innovation_prospecting: "探鉱"
 innovation_prospecting_desc: "新たな鉱脈を積極的かつ体系的に探し求めることで、領国内の鉱業を大きく発展させることができる。"
 innovation_coppicing: "萌芽更新"
 innovation_coppicing_desc: "樹木を適切に管理し、計画的かつ体系的に伐採することで、木炭や薪の生産など、木材を必要とする産業向けの林業生産量を大幅に増やすことができる。"
 innovation_monasticism: "修道院制"
 innovation_monasticism_desc: "修道院そのものは新しいものではないが、規模が拡大し、数も増えてきた。かつての隠遁地の周囲に、宗教共同体が形成されている。それぞれが独自の経済活動を営み、在俗者の集落も形成されるようになっている。"
 innovation_craft_ordinances: "職人規約"
 innovation_craft_ordinances_desc: "職人たちは規制を好まないかもしれないが、自分たちの職業に関する規則を自ら定める権限は重視している。品質と価格が管理されていれば、誰にとっても都合がよい。"
 innovation_merchant_law: "商人法"
 innovation_merchant_law_desc: "交易のあり方を定めてきた慣習を明文化し、その規定の遵守を徹底させることで、領内の交易をより自由で秩序あるものにできる。"
 innovation_vaulting: "ヴォールト天井"
 innovation_vaulting_desc: "高く細長いヴォールト天井は、見た目が荘厳なだけでなく、大規模な建物の天井をより安全に構築する手段でもある。石工たちが今手掛けているヴォールトは、石材の使用量を抑え、建物の耐久性も高める。"
 innovation_putting_out_system: "問屋制家内工業"
 innovation_putting_out_system_desc: "領国内のあらゆる家や農家で日々行われている生産活動を商人が統括する仕組みを整えれば、効率を大幅に高めることができる。この体制では、商人が原材料の仕入れから完成品の販売までを担う。"
 innovation_deep_mining: "深部採掘"
 innovation_deep_mining_desc: "これまで届かなかった深さまで採掘を進めるため、坑道の木組みによる補強、排水設備の改良、巻き上げ機の導入など、さまざまな技術的解決策が考案された。こうした改良によって、これまで誰も到達できなかった深さまで鉱脈を追って掘り進められるようになった。"
 innovation_pilot_books: "航海案内書"
 innovation_pilot_books_desc: "航海には危険がつきものである。地元の水先案内人がいなければ、比較的安全な海岸沿いでも、見知らぬ航路を進む船の多くは遭難しかねない。岬、浅瀬、停泊地をすべて海図に記し、それぞれの方位と距離を記録しておけば、本来は一人の水先案内人とともに失われてしまう知識を、後世まで残すことができる。"
 innovation_pilot_books_portolan: "ポルトラーノ海図"
 innovation_pilot_books_portolan_desc: "航海には危険がつきものである。地元の水先案内人がいなければ、比較的安全な海岸沿いでも、見知らぬ航路を進む船の多くは遭難しかねない。羅針図を起点に方位線を引き、それに沿って岬や浅瀬、停泊地をすべて記録することで、本来は一人の水先案内人とともに失われてしまう知識を、後世まで残すことができる。"
 innovation_agronomy: "農学"
 innovation_agronomy_desc: "農作業は容易ではなく、その技術も多くの場合、農家から農家へと教え伝えられるだけである。こうした知識を集め、作物の栽培や農業の営みに関する文書にまとめれば、実証された知識を広め、伝統を体系的な手法へと発展させることができる。"
 innovation_bricks: "煉瓦"
 innovation_bricks_desc: "煉瓦は先人たちに知られていなかったわけではないが、煉瓦に関する知識は、かつてほど広く普及していない。この単純な人工建材を安定して製造し、使用する技術があれば、あらゆる建物をより迅速かつ効率的に建設できる。"
