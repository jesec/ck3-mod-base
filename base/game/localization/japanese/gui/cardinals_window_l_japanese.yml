 theocratic_elective_pious: "敬虔派"
 theocratic_elective_pious_desc: "#flavor 枢機卿会は、誰からも不適格と呼ばれない人物、すなわちすでに聖人のような生活を送っている枢機卿を擁立しなければならない。#!\n\n#EMP $theocratic_elective_pious$#!になるには、神聖さにおいてあらゆる[cardinal|E]を凌駕しなければならない。[piety_level|E]が最も重視され、次いで[learning|E]、さらに[GetTrait('lifestyle_scholar').GetName( GetPlayer )]、[GetTrait('pilgrim').GetName( GetPlayer )]、[GetTrait('lifestyle_mystic').GetName( GetPlayer )]として過ごした生涯が評価される。その名に刻まれたたった一つの[sin|E]は、一つの[virtue|E]が得る以上の代償を伴う。[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "民衆派"
 theocratic_elective_populist_desc: "#flavor 信徒が従わない教皇など教皇ではない。そのため枢機卿会は、すでに街頭で歓声を浴びている人物を擁立する。#!\n\n#EMP $theocratic_elective_populist$#!になるには、名声においてあらゆる[cardinal|E]を凌駕しなければならない。[prestige_level|E]と[diplomacy|E]を高め、[college_of_cardinals|E]内で[friends|E]を確保し、[tenet_popularity|E]の高い[personal_tenets|E]を持ち、[decision|E]「[GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName]」を使用せよ。[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "有力者"
 theocratic_elective_powerful_desc: "#flavor 聖ペトロの座には信奉者だけでなく敵も存在する。そのため枢機卿会は、その座を維持する力を持った高位聖職者を擁立する。#!\n\n#EMP $theocratic_elective_powerful$#!になるには、世俗的な影響力においてあらゆる[cardinal|E]を凌駕しなければならない。自分の[rite|E]をより多くの[counties|E]に広め、[holy_sites|E]を保持し、[dynasty_prestige_level|E]を高めよ。あるいは#V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! [character_interaction|E]を使用して、金で首位の座を買い取るのだ。[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
 CARDINALS_VIEW_VOTER_BUTTON: "支持者"
 CARDINALS_VIEW_VOTER_MISSING: "この候補にはまだ誰も投票していない。"
