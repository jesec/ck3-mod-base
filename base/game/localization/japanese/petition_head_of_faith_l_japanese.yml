 petition_head_of_faith_excommunication_tooltip: "$petition_head_of_faith_decision_option_excommunication_desc$"
 petition_head_of_faith_costs_refunded: "請願のコストが返還された"
 unavailable_petition_head_of_faith: "正式な請願を待っている"
 petition_head_of_faith_reclaim_offering_tt: "#weakこの請願のために用意していたものがあなたに返還される：#!"
 # Invalidation event
 petition_head_of_faith.0601.t: "請願の放棄"
 petition_head_of_faith.0601.desc.no_head: "私が申し立てを行う準備を整えるころには、もはや私の請願を受けるにふさわしい精神的指導者は存在しない。"
 petition_head_of_faith.0601.desc.head_dead: "私の請願が聞き届けられる前に、[recipient.GetTitledFirstName]が死亡した。"
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName]は投獄されており、正式な請願を受けることができない。"
 petition_head_of_faith.0601.desc.head_changed: "私の宗派の指導者が替わったため、[recipient.GetTitledFirstName]に請願を出すことはできなくなった。"
 petition_head_of_faith.0601.desc.at_war: "[recipient.GetTitledFirstName]と戦争中であるため、私は正式な請願を行うことができない。"
 petition_head_of_faith.0601.desc.repentance_resolved: "私が解除してもらうべき破門はもはや存在しない"
 petition_head_of_faith.0601.desc.repentance_too_soon: "前回の譴責から時間が経っていないため、私の悔悛は聞き届けられないだろう。"
 petition_head_of_faith.0601.desc.target_dead: "請願が聞き届けられる前に、[petition_target.GetTitledFirstName]が死亡した。"
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName]はもはや私の宗派に属していないため、正式な破門を要求することはできない。"
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName]はもはや王以上の君主ではないため、この正式な請願の対象外である。"
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName]はすでに破門されている。"
 petition_head_of_faith.0601.desc.fallback: "私の請願を進めることはもはや不可能であり、旅は無駄に終わった。"
 petition_head_of_faith.0601.desc.refund.piety: "この請願のために捧げると決めていた寄進物が返還される。"
 petition_head_of_faith.0601.desc.refund.none: "少なくともまだ何も手放していなかった。"
 petition_head_of_faith.0601.a: "仕方あるまい。"
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "請願：悔悛"
 petition_head_of_faith.1000.t.excommunication: "請願：破門"
 petition_head_of_faith.1000.desc.court_low_grandeur: "かつては栄華を誇った宮殿が、瓦礫となって周囲に散らばっている。これが[recipient.GetFaith.ReligiousHeadName]の精神的な貧しさを反映するものでないことを祈るばかりだ。\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "壮大な広間で知られるこの宮殿に足を踏み入れると、まさに身が引き締まる思いがする。その神々しい金箔の飾りが、ここに満ちる正義と精神的豊かさの表れであることを祈るばかりだ。\n\n"
 petition_head_of_faith.1000.desc.intro: "そこには、地上における神の代理人が鎮座している。 "
 petition_head_of_faith.1000.desc.recipient_sinful: "[recipient.GetSheHe]が[petition_hof_gravest_sin.GetName(recipient)]であることは周知の事実だが、何らかの悪魔の所業により、[recipient.GetSheHe]は聖ペトロの玉座へと上り詰めてしまった。"
 petition_head_of_faith.1000.desc.recipient_virtuous: "[recipient.GetHerHis]の判断は間違いなく、[recipient.GetHerHis]の[petition_hof_gravest_virtue.GetName(recipient)]としての性質に導かれるだろう。"
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.GetHerHis|U]の健康の衰えが、高貴なる労苦に満ちた人生の証であることは明らかだ。"
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.GetHerHis|U]の健康の衰えが、破壊的な放蕩生活の報いであることは明らかだ。"
 petition_head_of_faith.1000.desc.address: "\n\n私は[recipient.GetHerHim]に自分の請願を申し述べた。「聖なる[recipient.GetMotherFather|U]よ、 "
 petition_head_of_faith.1000.desc.repentance: "私は謙虚な心で参りました。我が魂に課せられた懲戒からの解放を請い、信徒たちの交わりに戻れるよう祈っております」"
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName]は神に対する罪を犯しました。私は一介の使者として参上いたしました。[petition_target.GetHerHis]の不滅の魂に裁きを下すのは、もちろんあなたの権限です」"
 petition_head_of_faith.1000.a.argue: "主張を述べて説得しよう。"
 petition_head_of_faith.1000.a.argue_tt: "謁見中に[recipient.GetShortUINameNoTooltip]の説得を試みる"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n「我が子よ、そなたの話は聞いた。願いを詳しく述べるがよい。そうすれば善処しようではないか」"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n「そなたの請願は受領した。教会法と聖なる教会の定めるところに従い、裁決を下すこととしよう」"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n「耳に心地よい言葉はいくらでも言える。主が求めたまう懐疑の心をもって、そなたの請願を受け取ることとしよう」"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n「ここに出向いてくるとは随分と不遜なことだ。次に発する言葉はよく吟味するがよい」"
 petition_head_of_faith.1000.desc.conclusion: "[recipient.GetSheHe]はそう言い、期待に満ちた様子で待っている。"
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "請願：[actor.GetTitledFirstNamePossessiveNoTooltip]の悔悛"
 petition_head_of_faith.1310.desc.intro: "「聖なる[ROOT.Char.GetMotherFather|U]よ、私は破門され、秘跡から締め出され、信徒たちからも切り離されております。どうかこの魂に対する非難を解き、信徒たちの交わりに戻してくださいますよう」と、ひざまずいた[actor.GetTitledFirstName]は言う。\n\n「神の前で、自らの悔悟の念を明確に示すのだ」と、私は答える。"
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n「聖なる[ROOT.Char.GetMotherFather|U]よ、あなたはいつも私に慈悲を示してくださいました。私は世俗の利益など望みません。ただ、神と聖なる教会に私の悔悟が真実であるとお認めいただきたいのです」"
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n「私は神の前に一人の悔悟者として立ち、教会法に則った正義のみを求めます」"
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n「どうか私を、甘言を弄してあなたを惑わそうとする[SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )]だなどと思わないでください。[ROOT.Char.GetFaith.HighGodName]と地上におけるその代理人の御前で、私は悔悟していると誓います」"
 petition_head_of_faith.1310.serpent.christian: "あの楽園の蛇"
 petition_head_of_faith.1310.serpent.generic: "蛇"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n「私たちはこの世では敵対してきました。世俗の事柄について私をよく言っていただこうとは思いません。ただ私の悔悛を認め、私の魂を危うくすることだけはお控えくださいますよう」"
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n「そなたが[petition_gravest_sin.GetName(actor)]であるとの知らせが我々のもとに届いている。美辞麗句を並べても、汚れた魂を救うことはできぬ。どのような償いをするつもりなのだ？」"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n「そなたの名にはほとんど悪徳の影がない。おそらく破門が功を奏したのであろう。そなたの魂がそなたの態度に見合うものか、見定めさせてもらうとしよう」"
 petition_head_of_faith.1310.a: "「立ちなさい、我が子よ。信徒の交わりへと戻るがよい」"
 petition_head_of_faith.1310.b: "「懲戒は継続される。そなたの悔悛が明らかになったときに再び来るがよい」"
 petition_head_of_faith.1320.t: "請願：[petition_target.GetTitledFirstNamePossessiveNoTooltip]の破門"
 petition_head_of_faith.1320.desc.intro: "「聖なる[ROOT.Char.GetMotherFather|U]よ、[petition_target.GetTitledFirstName]は神に対する罪を犯しました。この腐敗を断ち切らねば、我々すべての魂が脅かされるでしょう」と、[actor.GetTitledFirstName]は言う。\n\n「我々が破門を君主の私的な武器として振りかざすことはない。そなたの告発を神の前で明確に示せ」と、私は答える。"
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n「聖なる[ROOT.Char.GetMotherFather|U]よ、あなたはいつも私に公正さを示してくださいました。私は世俗の利益など望んでいません。ただ、神と聖なる教会に、[petition_target.GetTitledFirstNamePossessiveNoTooltip]の罪が真実であるとお認めいただきたいのです。"
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n「主イエス・キリストの一介の臣民として、神の御前にてこの告発を申し立てます。私はただ、聖なる教会が定める正当な裁きのみを望んでおります。"
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n「どうか私を、甘言を弄して私怨を晴らそうとする楽園の蛇だなどと思わないでください。[ROOT.Char.GetFaith.HighGodName]と地上におけるその代理人の御前で、この告発が正当なものであることを誓います。"
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n「私たちはこの世では敵同士ですが、どうか教会法の定めに従い、[petition_target.GetTitledFirstNamePossessiveNoTooltip]の魂をお量りください。"
 petition_head_of_faith.1320.desc.target_sinful: "[petition_target.GetTitledFirstNamePossessiveNoTooltip]の罪という腐敗は、[petition_target.GetHerHis]の[petition_gravest_sin.GetName(petition_target)]という性質から生じたものです」"
 petition_head_of_faith.1320.desc.finish: "そう述べて[actor.GetTitledFirstName]は話を終えた。"
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNamePossessiveNoTooltip]はその邪悪さを巧みに隠していますが、もしあなたが主の導きをお求めになれば、あの者の罪は明らかになると私は信じています」"
 petition_head_of_faith.1320.a: "「[petition_target.GetHerHim]を信徒の交わりから追放する」"
 petition_head_of_faith.1320.b: "「そなたの主張には説得力が掛けている。[petition_target.GetHerHim]に制裁が加えられることはない」"
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "破門の宣告"
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName]が立ち上がり、主の裁きを下す。\n\n「[petition_target.GetTitledFirstName]を破門する。この者を信徒の共同体から切り離し、真の悔悛がなされるまで、その魂は破滅の危機に晒されるものとする」"
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName]がその僕を通して語られた。"
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "請願の拒否"
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName]が立ち上がり、主の裁きを下す。\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "「そなたが挙げた罪状は、かくも恐ろしい裁きに値するほど重くはない。[petition_target.GetTitledFirstName]が破門されることはない」"
 petition_head_of_faith.2030.desc.finesse: "「王公の金銭のために信徒を追放することなどできない。カエサルのものによって、[recipient.GetFaith.HighGodName]の裁きを買い取ることはできないのだ」"
 petition_head_of_faith.2030.desc.learning_duel: "「そなたは教会法を意図的に歪曲し、[petition_target.GetTitleAsNameNoTooltip]を罠に嵌めようとでもいうのか？そなたのその…学識とやらを根拠に、[petition_target.GetTitledFirstName]を破門することはない」"
 petition_head_of_faith.2030.desc.fallback: "「なんとも不遜なことよ！[petition_target.GetTitledFirstName]を破門する理由など見当たらぬ」"
 petition_head_of_faith.2030.a: "[recipient.GetFaith.HighGodName]がその僕を通して語られたのだろう。"
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "議論"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "「聖書と教会法によって[petition_target.GetTitledFirstNamePossessiveNoTooltip]の犯罪を証明できるのか？[petition_target.GetSheHe]が刻まれた像を拝んでいたと言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "「石の十字架のもとで、[petition_target.GetTitledFirstNameNoTooltip]を告発すると言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "「[petition_target.GetTitledFirstNameNoTooltip]には聖母の慈悲を受ける資格がないというのか？そなた自身、清廉潔白の身でここに立っていると言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "「個人的な確執の勢いに任せ、重大な罪の証拠もなしに[petition_target.GetTitledFirstNameNoTooltip]を聖なる典礼から追放しろと言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "「[petition_target.GetTitledFirstNameNoTooltip]をキリストの祭壇から締め出そうと言うのか？[petition_target.GetHerHim]から我々の主の肉という糧を奪うつもりなのか？あの者にもはや主の血を飲ませぬようにせよと言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_communion: "「そなたは、[petition_target.GetTitledFirstNameNoTooltip]を信徒の交わりから追放するのがふさわしいとでも思うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_confession: "「告解の秘密のもとで語られたことを根拠に、[petition_target.GetTitledFirstNameNoTooltip]に罰を下せとでも言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "「より穏便な手段で[petition_target.GetHerHim]を罪から立ち直らせることを試みもせずに、[petition_target.GetTitledFirstNameNoTooltip]を追放せよと言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "「使徒らの権能を引き合いに出し、我々に地上のみならず、天上においても[petition_target.GetTitledFirstNameNoTooltip]を断罪せよというのか？」"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "「我らの教会法の研究を邪魔してまで、[petition_target.GetTitledFirstNameNoTooltip]を断罪しようとするのだな。そなたの主張は教父たちの著作や聖書に基づいたものなのだろうな？」"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "「聖なる時期の流血沙汰や教会領での暴力を理由に、我々を動かして[petition_target.GetTitledFirstNameNoTooltip]を処罰させようと言うのか？[petition_target.GetSheHe]は神の平和と神の休戦を破ったとでも言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "「[petition_target.GetTitledFirstNameNoTooltip]に対するそなたの不満を、ここで裁くのが最善なのか？二人とも十字架を手に取り、キリストの敵と戦うことこそ、よき道ではないのか？」"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "「我ら五大総大主教座が、不和に揺れるキリスト教世界をまとめようとしているときに、[petition_target.GetTitledFirstNameNoTooltip]を追放せよと我らのもとにやって来たのか？[Glossary( 'エクメーネ', 'OIKOUMENE_GLOSS' )]のすべての者がそなたの告発を支持するとでも思っているのか？」"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "「[petition_target.GetTitledFirstNameNoTooltip]は、公然たる侮蔑によって殉教者への崇敬を汚したと言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "「そなたは我々に、[petition_target.GetTitledFirstNameNoTooltip]を追放せよと言うのか。ならば、[petition_target.GetSheHe]が不服従と怠惰の中に生きてきたという証拠を示すがよい。魂の敵とは他ならぬ怠惰なのだから」"
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "「[petition_target.GetTitledFirstNameNoTooltip]だけがアダムの罪を受け継いだかのように、我々に[petition_target.GetSheHe]を断罪せよというのか？すべての魂は堕罪による傷を負ってこの世に生まれる。しかし教会が追放するのは、自らの罪深い性向を楽しむ者のみだ」"
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "「我々の修道士たちが着の身着のままで貧者の間を巡っているのに、そのような着飾った装いで[petition_target.GetTitledFirstNameNoTooltip]の裁きを声高に求めにくるとは何事か。託鉢修道士ならば忍耐を説くのではないのか？それほどまでにその罪が大きいと言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "「そなたは[petition_target.GetTitledFirstNameNoTooltip]から秘跡を奪おうと言うのか？あの者が天国でキリストと共に与かるべき永遠の命という富まで、危険に晒すつもりか？我々が清貧の誓いを求めるのは、この地上においてなのだぞ」"
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "「[petition_target.GetHerHis]に敵対する者の言葉を真に受けて、我々にキリストの兵士を追放せよとでも言うのか？」"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "「聖なる教会に[petition_target.GetTitledFirstNameNoTooltip]との争いをどう収めさせたいのだ？」"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n「我々が破門を君主の私的な武器として振りかざすことはないと知っておくがよい。いかなる裁きが下されるべきかは我々が判断する。神の御前で言い分を述べよ！」と聖なる[recipient.GetMotherFather|U]が求める。"
 petition_head_of_faith.2000.desc.target_sinful: "\n\n[recipient.GetFaith.GetReligiousHeadTitle.GetNamePossessive]の言葉は確かに中立を保っているように聞こえるが、[petition_target.GetTitledFirstNamePossessiveNoTooltip]の罪深い性質が、すでにこの神聖なる大堂にまで届いているのは明らかだ。私はただ、[petition_target.GetHerHis]の罪を裏付けるだけでよい。"
 petition_head_of_faith.2000.desc.target_clean: "\n\nどうやら[recipient.GetTitledFirstName]は、[petition_target.GetTitledFirstNameNoTooltip]が罪にまみれてなどいないことを見抜いているようだ。裁きの場で示せる明確な悪行の証拠がない以上、私が求める正義を果たすには、別の道を探す必要がある。"
 OIKOUMENE_GLOSS: "「人の住む世界」を意味するギリシャ語。東ローマ帝国で使われた#bold エクメーネ#!という言葉は文明世界、すなわち帝国そのものと、その教会が統括するより広範なキリスト教秩序の領域を指した。"
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "神の御前で、[petition_target.GetTitledFirstNameNoTooltip]が[petition_gravest_sin.GetName(petition_target)]であることを糾弾する。"
 petition_head_of_faith.2000.a.cite_sins_fallback: "神の御前で、[petition_target.GetTitledFirstNamePossessiveNoTooltip]の罪を列挙する。"
 petition_head_of_faith.2000.b.finesse: "「教会には多くの入り用があります。私にその一部を調達させてください」"
 petition_head_of_faith.2000.c.learning_duel: "通好みの聖句を引用し、邪悪な[petition_target.GetTitleAsNameNoTooltip]を罠に嵌めよう。"
 petition_head_of_faith.2000.d.hook: "[recipient.GetFaith.ReligiousHeadName]に対し、いくつかの…内密の事柄を思い出させる。"
 petition_head_of_faith.2000.e.withdraw: "…おそらくこれは[petition_target.GetFaith.HighGodName]と[petition_target.GetTitledFirstNameNoTooltip]の間の問題だ。"
 petition_head_of_faith.5000.e.withdraw: "…どうやら、私にはまだ準備ができていなかったようだ。"
 petition_head_of_faith_hook_committed_tt: "この件を取り計らってもらうために、あなたは[hook|E]を使用している"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip]は罪悪よりも美徳の方が勝っている"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName]は説得に応じる"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName]は納得する"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName]は納得しないままである"
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName]は感情を害している"
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName]はあなたの主張を退ける"
 petition_head_of_faith_affronted_opinion: "賄賂に憤慨した"
 petition_head_of_faith_affronted_opinion_desc: "この人物は、宗教上の裁きを金で買おうとする厚かましい請願者に憤慨した。"
 petition_head_of_faith_dismissed_debate_opinion: "主張に惑わされなかった"
 petition_head_of_faith_dismissed_debate_opinion_desc: "この人物は、教会法を歪曲して説得を試みた請願者の申し立てを拒絶した。"
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "赦しを求める"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "あなたの[head_of_faith|E]の元に赴き、あなたの[excommunication|E]を解除するよう懇願する。"
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "あなたは[recipient.GetCapitalLocation.GetName]に赴き、[recipient.GetTitledFirstName]にあなたの[excommunication|E]を解除するよう正式に請願する"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "告解"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "「そなたは赦しを求めにきた。自らを清めるものは聖書と悔悛のみと知りながら、そなたは偶像にひれ伏したのか？」"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "「そなたが来たのは、刻まれた石の十字架の足元で、罪の赦しを請うためだと願っているぞ」"
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "「聖母は慈悲に満ちておられる。だが、それだけでそなたの懲戒を解くわけにはいかぬ」"
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "「再び聖体礼儀を求めるのか。何がそなたを祭壇や信徒たちから遠ざけていたのか、よく考えるがよい」"
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "「お前はキリストの祭壇から拒否され、その肉と血という糧を受けることを拒まれたのだ」"
 petition_head_of_faith.5000.desc.atmosphere_communion: "「そなたは信徒の交わりから追放された身だ」"
 petition_head_of_faith.5000.desc.atmosphere_confession: "「告解の秘跡には、完全で誠実な説明が求められる」"
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "「破門は教会の薬である。それはそなたの人生を改め、浄罪の期間を短くするために与えられる賜物なのだ」"
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "「我々はペトロの鍵を預かっている。そなたが真に悔い改めるならば、この権威によってそなたの縛めを解くことができよう」"
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "「復帰を求めるというのだな。ならば教令集の章と区分に従って法を全うするがよい」"
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "「そなたの罪は神の平和と神の休戦を破ったことか？聖なる時期に血を流したのか？」"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "「名ばかりの十字架を掲げながらキリスト教世界に害をなしたのであれば、そなたは明らかに法に背いている」"
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "「五大総大主教座が見守っている。全[Glossary( 'エクメーネ', 'OIKOUMENE_GLOSS' )]の目前で、赦しを安売りすることはできない」"
 petition_head_of_faith.5000.desc.atmosphere_dulia: "「殉教者たちはその血をもって天国での地位を勝ち取ったのだ」"
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "「怠惰は魂の敵である。悔悛のためだけでなく、贖罪、祈り、そして労苦への覚悟をもって跪くがよい」"
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "「我々すべてがそうであるように、そなたも罪のうちに生まれた。その遺産たる罪に、なぜ新たな悪行を重ねるのか？」"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "「我々の修道士たちは擦り切れた修道服一つで貧者の間を巡っているのだ」"
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "「我々は地上における清貧の誓いを求めている。富や身分で秘跡を買い戻すことなどできない」"
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "「そなたは胸に十字架を掲げながら、キリスト教世界を侮辱したのだ」"
 petition_head_of_faith.5000.desc.atmosphere_fallback: "「赦しとは、長い巡礼を行っただけで得られるものではない」"
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n「我らが見せかけや世辞によって破門を解くことはないと知っておくがよい。神の前で、自らの悔悟の念を明確に示すのだ！」と聖なる[recipient.GetMotherFather|U]は要求する。"
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\n私が[petition_gravest_sin.GetName(actor)]であるという噂は、きっとこれらの聖なる殿堂にも届いている。"
 petition_head_of_faith.5000.desc.penitent_clean: "\n\n暴き立てるほどの大罪がない以上、破門がその有益な役目を果たしたと教会も理解するに違いない。"
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "己の罪を包み隠さず告白する。"
 petition_head_of_faith.5000.b.canon_law: "教会法に従えば、私の復帰を認めるべきだと主張する。"
 petition_head_of_faith.5000.c.weep: "裁きの場の慈悲に我が身を委ねる。"
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName]は心を動かされる"
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName]は心を動かされない"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName]はあなたの告解を受け入れる"
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.GetFaith.ReligiousHeadName]はあなたの言葉に納得しない"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.GetFaith.ReligiousHeadName]はあなたの謙虚さに心を動かされる"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.GetFaith.ReligiousHeadName]はあなたの態度に心を動かされない"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "赦し"
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName]が立ち上がり、主の慈悲を授ける。\n\n「立ちなさい、我が子よ。そなたは信徒の交わりへと戻るのだ。そなたの魂に科されていた破門は解かれた」"
 petition_head_of_faith.5020.a: "[recipient.GetFaith.HighGodName]に感謝を。"
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "叶わぬ赦免"
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName]が立ち上がり、主の裁きを下す。\n\n"
 petition_head_of_faith.5030.desc.confess: "「そなたの告解は虚ろに響く。"
 petition_head_of_faith.5030.desc.canon_law: "「そなたの未熟な学識は、そなたの魂の反映なのだ。"
 petition_head_of_faith.5030.desc.weep: "「涙は悔悛ではない。"
 petition_head_of_faith.5030.desc.fallback: "「そなたは真に厚かましい。"
 petition_head_of_faith.5030.desc.conclusion: " 破門は解かれぬ」"
 petition_head_of_faith.5030.a: "[recipient.GetFaith.HighGodName]がその僕を通して語られたのだろう。"
