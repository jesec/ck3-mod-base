 petition_antipope_decision_confirm: "請願の準備をする"
 petition_head_of_faith_decision_effects_major_piety: "請願を準備する際に[piety_i] [EmptyScope.ScriptValue('major_piety_value')|V0]の[piety|E]を消費する。あなたが請願を撤回、[travel|E]を中止、または請願を放棄した場合、これは払い戻される。[petition_recipient.GetShortUINameNoTooltip]に言い分を述べて説得するのに失敗した場合は、#EMP 没収#!される。"
 petition_head_of_faith_decision_effects_massive_piety: "請願を準備する際に[piety_i] [EmptyScope.ScriptValue('massive_piety_value')|V0]の[piety|E]を消費する。あなたが請願を撤回、[travel|E]を中止、または請願を放棄した場合、これは払い戻される。[petition_recipient.GetShortUINameNoTooltip]に言い分を述べて説得するのに失敗した場合は、#EMP 没収#!される。"
 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.GetShortUIName]はこの請願を#P 高い確率で聞き入れる#! #weak （あなたに対する[petition_recipient.GetHerHis]の[opinion|E]に基づく。謁見中に変化する可能性がある）#!"
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.GetShortUIName]はこの請願を#P 聞き入れる可能性がある#! #weak （あなたに対する[petition_recipient.GetHerHis]の[opinion|E]に基づく。謁見中に変化する可能性がある）#!"
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.GetShortUIName]はこの請願を#P 拒む可能性がある#! #weak （あなたに対する[petition_recipient.GetHerHis]の[opinion|E]に基づく。謁見中に変化する可能性がある）#!"
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.GetShortUIName]はこの請願を#P 高い確率で拒む#! #weak （あなたに対する[petition_recipient.GetHerHis]の[opinion|E]とあなたとの関係に基づく。謁見中に変化する可能性がある）#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak [petition_recipient.GetFaith.GetName]が請願の対象となっている人物の[traits|E]を[sinful|E]および[virtuous|E]のどちらに判断するかによって、あなたが謁見時に選択できる主張が変わる。#!"
 petition_head_of_faith_decision_hook_available: "[petition_recipient.GetTitledFirstName]に対して[hook|E]を使い、[piety|E]のコストを免除する"
 petition_head_of_faith_decision_cost_major_piety: "[piety_i] [EmptyScope.ScriptValue('major_piety_value')|V0]の[piety|E]または[hook|E]が必要"
