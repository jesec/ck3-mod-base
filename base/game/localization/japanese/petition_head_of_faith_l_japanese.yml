 petition_head_of_faith_excommunication_setup_interaction_accept_tt: "あなたは[recipient.GetCapitalLocation.GetName]に赴き、[recipient.GetTitledFirstName]に[secondary_recipient.GetTitledFirstName]を[excommunicate|E]するよう請願する"
 petition_head_of_faith_decision_option_repentance: "破門の解除"
 petition_head_of_faith_decision_option_excommunication: "破門の要請"
 petition_head_of_faith_decision_option_repentance_desc: "あなたの[excommunication|E]の解除を求める。"
 petition_head_of_faith_decision_option_excommunication_desc: "あなたの[faith|E]の別の[ruler|E]の[excommunication|E]を求める。"
