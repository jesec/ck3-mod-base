l_japanese:
 rule_empire_faith_gate: "組織化された宗派による帝国称号の制限"
 setting_empire_faith_gate_on: "#high 有効#!"
 setting_empire_faith_gate_no_hof_exempt: "#high 有効#!、宗教指導者なしの場合は免除"
 setting_empire_faith_gate_off: "無効"
 setting_empire_faith_gate_on_desc: "[organized|E][faith|E]と[head_of_faith|E]の承認がなければ、[empire|E][titles|E]を創設できない。[feudal|E]、[clan|E]、[tribal|E]の[rulers|E]に適用される。"
 setting_empire_faith_gate_no_hof_exempt_desc: "[organized|E][faith|E]と[head_of_faith|E]の承認がなければ、[empire|E][titles|E]を創設できないが、[head_of_faith|E]が存在しない[faiths|E]はその承認要件から免除される。[feudal|E]、[clan|E]、[tribal|E]の[rulers|E]に適用される。"
 setting_empire_faith_gate_off_desc: "誰でも通常の条件で[empire|E][titles|E]を創設できる。"
 empire_faith_gate_organized_faith_required: "[empire|E]を創設するには、あなたの[faith|E]が[organized|E]宗派でなければならない"
 empire_faith_gate_hof_spiritual_good_terms: "[head_of_faith|E]との関係が良好でなければならない"
 empire_faith_gate_hof_temporal_is_hof: "あなたが[head_of_faith|E]である"
 empire_faith_gate_hof_temporal_good_terms: "[head_of_faith|E]のあなたに対する[opinion|E]がプラスでなければならない"
 empire_faith_gate_powerful_vassals_approve: "大多数の[powerful_vassals|E]があなたに対しプラスの[opinion|E]を持っていなければならない#weak （[THIS.Char.MakeScope.ScriptValue('powerful_vassals_positive_opinion_value')|0]/[THIS.Char.MakeScope.ScriptValue('powerful_vassals_count_value')|0]）#!"
 empire_faith_gate_contested_legitimacy_applied: "帝国の覇権争い"
 empire_faith_gate_contested_legitimacy_applied_desc: "[THIS.Char.GetShortUINamePossessive|U]と[SCOPE.sC('efg_other_emperor').GetShortUINamePossessive]の[empires|E]は、今や覇権を争っている。"
 empire_faith_gate_create_title_contested_warning_1: "@warning_icon! #warning この[empire|E]を創設すると、あなたの[faith|E]に属する独立[empire|E]がすでに存在しているため、3年後に[GetModifier( 'multi_empire_same_faith_penalty_1' ).GetNameWithTooltip|L]の[modifier|E]を受けることになります。#!"
 empire_faith_gate_create_title_contested_warning_2: "@warning_icon! #warning この[empire|E]を創設すると、あなたの[faith|E]に属する独立[empire|E]がすでに複数存在しているため、3年後に[GetModifier( 'multi_empire_same_faith_penalty_2' ).GetNameWithTooltip|L]の[modifier|E]を受けることになります。#!"
 empire_faith_gate_create_title_contested_warning_3: "@warning_icon! #warning この[empire|E]を創設すると、あなたの[faith|E]に属する独立[empire|E]がすでにいくつか存在しているため、3年後に[GetModifier( 'multi_empire_same_faith_penalty_3' ).GetNameWithTooltip|L]の[modifier|E]を受けることになります。#!"
 empire_faith_gate_create_title_contested_warning_1_inline: "\n\n$empire_faith_gate_create_title_contested_warning_1$"
 empire_faith_gate_create_title_contested_warning_2_inline: "\n\n$empire_faith_gate_create_title_contested_warning_2$"
 empire_faith_gate_create_title_contested_warning_3_inline: "\n\n$empire_faith_gate_create_title_contested_warning_3$"
 EXCOMMUNICATION_CONTESTED_EMPIRE: "あなたの[faith|E]に属する複数の[empires|E]がある：$VALUE|=+0$"
 efg_contested_empire_rivalry: "同じ[faith|E]に属する新たな[empire|E]の出現が、対立を引き起こした。"
 efg_contested_empire_rivalry_corresponding: "同じ[faith|E]に属する新たな[empire|E]の出現が、対立を引き起こした。"
 dissolve_empire_war: "帝国の解体"
 DISSOLVE_EMPIRE_WAR_NAME: "[DEFENDER.GetShortUINameNotMe]の帝国の解体"
 dissolve_empire_war_desc: "我々の[faith|E]に属する[excommunicated|E]された[ruler|E]の[empire|E]を解体するため、宣戦布告する。"
 dissolve_empire_war_victory_desc: "[excommunicated|E]された[emperor|E]は[empire|E][title|E]を剥奪され、称号は消滅する。"
 dissolve_empire_war_victory_desc_defender: "[empire|E]は解体された。[empire|E][title|E]は消滅する。"
 dissolve_empire_war_white_peace_desc: "戦争は決着がつかないまま終結する。どちらの陣営も優位に立つことができない。"
 dissolve_empire_war_white_peace_desc_defender: "[empire|E]の解体を巡る戦争は、決着がつかないまま終結する。"
 dissolve_empire_war_defeat_desc: "[empire|E]解体の試みは失敗した。"
 dissolve_empire_war_defeat_desc_attacker: "[empire|E]解体の試みは失敗した。我々はその報いを受ける。"
 dissolve_empire_war_defeat_desc_defender: "[empire|E]解体の試みは退けられた。"
 dissolve_empire_war_invalidated_no_excommunication: "防衛側は[excommunicated|E]を解かれた。"
 dissolve_empire_war_invalidated_no_empire: "防衛側はもはや[empire|E][title|E]を保持しない。"
 game_concept_dissolve_empire_casus_belli: "$dissolve_empire_war$"
 game_concept_dissolve_empire_casus_belli_desc: "同じ[faith|E]の[ruler|E]が、[excommunicated|E]された[emperor|E]に対して[war|E]を宣言し、勝利するとその[empire|E][title|E]を消滅させることができる[casus_belli|E]。"
 multi_empire_same_faith_penalty_1: "覇権争い"
 multi_empire_same_faith_penalty_1_desc: "同じ[faith|E]の別の[emperor|E]が、我々の[empire|E]の覇権を巡り争っている"
 multi_empire_same_faith_penalty_2: "覇権への挑戦"
 multi_empire_same_faith_penalty_2_desc: "同じ[faith|E]の複数の[emperors|E]が、我々の[empire|E]の覇権に挑んでいる"
 multi_empire_same_faith_penalty_3: "覇権の分割"
 multi_empire_same_faith_penalty_3_desc: "同じ[faith|E]の複数の[emperors|E]が、我々の[empire|E]の覇権を分割している。"
 action_efg_request_excommunication: "@hof_icon! あなたの宗派に属する帝国が多すぎる"
 action_efg_request_excommunication_label: "@hof_icon! あなたの宗派に属する帝国が多すぎる"
 action_efg_request_excommunication_desc: "[recipient.GetShortUIName|U]は、あなたの[faith|E]に属する対立[empire|E]を統治しており、あなたが唯一真の[emperor|E]であるという主張に異議を唱えている。\n\n#help あなたの[head_of_faith|E]である[secondary_recipient.GetShortUIName]に、[recipient.GetHerHim]を破門するよう求めよう。[excommunicated|E]された皇帝は、[casus_belli|E]「[dissolve_empire_casus_belli|E]」で攻撃可能となり、その[empire|E]を滅ぼすことができる。#!"
 action_efg_request_excommunication_click: "#I クリックして「$request_excommunication_interaction$」を開く#!"
 action_efg_request_excommunication_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNoTooltip]"
 action_efg_request_excommunication_combined_group_name: "@hof_icon! あなたの宗派に属する帝国が多すぎる"
 action_efg_request_excommunication_combined_group_label: "@hof_icon! あなたの宗派に属する帝国が多すぎる"
 action_efg_request_excommunication_combined_group_description: "あなたの[faith|E]に属する複数の対立する[emperors|E]が、あなたが唯一真の[emperor|E]であるという主張に異議を唱えている。\n\n#help あなたの[head_of_faith|E]である[secondary_recipient.GetShortUIName]に、彼らを破門するよう求めよう。[excommunicated|E]された皇帝は、[casus_belli|E]「[dissolve_empire_casus_belli|E]」で攻撃可能となり、その[empire|E]を滅ぼすることができる。#!"
 empire_faith_gate_panel_organized_faith: "あなたはこの[organized|E][faith|E]の一員である"
 empire_faith_gate_panel_hof_approval: "あなたは[head_of_faith|E]の承認を受けている"
 empire_faith_gate_panel_vassals_approve: "大多数の[powerful_vassals|E]があなたを支持している"
 empire_faith_gate_reformation_piety_level: "[piety_level|E]は少なくとも[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]でなければならない"
 empire_faith_gate_reformation_tribal_authority: "$game_concept_absolute_tribal_authority$を有していなければならない"
 empire_faith_gate_reformation_holy_site: "少なくとも3つの[holy_sites|E]が、この[faith|E]の人物によって保持されている"
 empire_faith_gate.0002.t: "真の皇帝"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUIName]は、私だけに許された帝国の威厳を自らのものにしようとしている。これを放置すれば、信徒たちは私の[legitimacy|E]を疑うようになるだろう。"
 empire_faith_gate.0002.a: "皆に伝えよ。[efg_primary_rival.GetHerHis|U]の帝国が我が帝国より長く続くことはない。"
 empire_faith_gate.0002.b: "我らの信仰における皇帝はただ一人。この私だ。"
 empire_faith_gate.0002.c: "好機が来たら攻撃しよう。"
 efg_contested_wrath: "騎士のプロパガンダ"
 efg_contested_wrath_desc: "騎士たちに我々の帝国の正統性を広めさせることで、対抗する皇帝に対する優位を示し、戦士の士気と民衆からの敬意を獲得する。"
 efg_divine_mandate: "神聖な権威"
 efg_divine_mandate_desc: "俗世の対抗者たちを凌駕する神聖な権威を主張することで、信徒たちが我々のもとに集う。"
 efg_contested_patience: "忍耐ある強化"
 efg_contested_patience_desc: "攻撃の好機を待つ間、内政に目を向け、力を蓄えることで領国はより強くなる。"
