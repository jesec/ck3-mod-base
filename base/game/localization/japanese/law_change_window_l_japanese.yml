 LAW_CHANGE_WINDOW_POWERFUL_APPROVE: "#weak 賛同#!"
 LAW_CHANGE_WINDOW_POWERFUL_OPPOSE: "#X 反対#!"
 LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T 継承法の変更に賛同#!\n[Character.GetShortUIName]は[succession_law|E]の変更を支持しているか、反対できない状況にある。\n\n[Character.GetSheHe|U]は以下のいずれかの理由で賛同している\n$BULLET_WITH_TAB$あなたに対してプラスの[opinion|E]を持っている\n$BULLET_WITH_TAB$あなたに[cowed|E]した状態\n$BULLET_WITH_TAB$何者かに[imprisoned|E]された状態"
 LAW_CHANGE_WINDOW_POWERFUL_OPPOSE_TT: "#T 継承法の変更に反対#!\n[Character.GetShortUIName]はいかなる[succession_law|E]の変更も阻止するだろう。\n\n賛同するためには、[Character.GetShortUIName]は以下のいずれかの条件を満たす必要がある\n$BULLET_WITH_TAB$あなたに対してプラスの[opinion|E]を持っている\n$BULLET_WITH_TAB$あなたに[cowed|E]した状態\n$BULLET_WITH_TAB$何者かに[imprisoned|E]された状態"
 LAW_CHANGE_WINDOW_CLAN_TITLE: "氏族[succession_laws|E]を変更"
 LAW_CHANGE_WINDOW_CLAN_DESC: "[GetGovernment('clan_government').GetName][government|E]では、[succession_laws|E]は現在の[house_unity|E]スコアによって決定されます。各[house_unity_level|E]は対応する[succession_law|E]を有効化します。ただし、統治者が$single_heir_succession_law$等の$LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$を定める法律を使用している場合は除きます。"
 LAW_CHANGE_WINDOW_CLAN_CHANGE_LAW_BUTTON_TOOLTIP: "あなたは[clan|E]であり、この方法では[succession_laws|E]を変更できません。[clan|E]の[succession_laws|E]はその[house_unity_level|E]によって決定されます。"
 LAW_CHANGE_WINDOW_ASSEMBLY_MEMBERS_APPROVE: "議員の賛同"
 LAW_CHANGE_WINDOW_ASSEMBLY_MEMBERS_APPROVE_DESC: "この法律に賛同している議員"
 LAW_CHANGE_WINDOW_ASSEMBLY_MEMBERS_DISSENT: "議員の不賛成"
