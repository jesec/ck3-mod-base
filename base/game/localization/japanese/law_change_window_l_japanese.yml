 LAW_CHANGE_WINDOW_ASSEMBLY_OPPOSE: "@law_dissent_icon! #N 反対#!"
 LAW_CHANGE_WINDOW_ASSEMBLY_APPROVE_TT: "#T 法律の変更に賛同#!\n[Character.GetShortUIName]はこの変更を支持しているか、反対できない状況にある。\n\n[Character.GetSheHe|U]は以下のいずれかの理由で賛同している\n$BULLET_WITH_TAB$この法律に賛同している\n$BULLET_WITH_TAB$あなたに[cowed|E]した状態\n$BULLET_WITH_TAB$何者かに[imprisoned|E]された状態"
 LAW_CHANGE_WINDOW_ASSEMBLY_OPPOSE_TT: "#T 法律の変更に反対#!\n[Character.GetShortUIName]はこの法律の変更を阻止する。\n\n賛同させるには、[Character.GetShortUIName]が以下のいずれかの条件を満たす必要がある\n$BULLET_WITH_TAB$この法律に賛同している\n$BULLET_WITH_TAB$あなたに[cowed|E]した状態\n$BULLET_WITH_TAB$何者かに[imprisoned|E]された状態"
 LAW_CHANGE_WINDOW_ASSEMBLY_UNDECIDED: "#high 未定#!"
