 activity_ecumenical_council: "Sobór powszechny"
 activity_ecumenical_council_desc: "Wezwij najpotężniejszych prałatów i władców chrześcijańskich! Naszym celem powinno być zjednoczenie wiary i praktyk, wszystko, by chwalić imię [GetPlayer.GetFaith.HighGodNamePossessive].\n\nCzy zbierzemy się niczym apostołowie w Jerozolimie, zjednoczeni w wierze, a może pozwolimy, by Kościół pękł pod ciężarem naszej dumy?"
 activity_ecumenical_council_destination_selection: "[holding|E] musi być ważnym ośrodkiem religijnym."
 activity_ecumenical_council_host_desc: "$BULLET_WITH_TAB$Można odkryć, zatwierdzić lub zmienić [core_tenets|El] albo ich zakazać\n$BULLET_WITH_TAB$Można zmienić [doctrines|El]\n$BULLET_WITH_TAB$Można zwiększyć @fervor_icon! [fervor|El]\n$BULLET_WITH_TAB$Można zdobyć @piety_icon! [piety|El]\n$BULLET_WITH_TAB$Można zdobyć @opinion_icon! [Concept('opinion', 'opinię')|E] uczestniczących postaci\n$BULLET_WITH_TAB$Można zdobyć [Concept('trait', 'cechę')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] lub [trait_level_track_xp|El]"
 activity_ecumenical_council_guest_desc: "$activity_ecumenical_council_host_desc$"
 activity_ecumenical_council_selection_tooltip: "Zaproś najbardziej wpływowych i najlepiej wykształconych członków świata chrześcijańskiego do debaty na tematy teologiczne i doczesne.\n\nPrzewidywane nagrody:\n$BULLET_WITH_TAB$Zmiany [Concept('core_tenet', 'dogmatu')|E]\n$BULLET_WITH_TAB$Zmiany [Concept('doctrine', 'doktryny')|E]\n$BULLET_WITH_TAB$@fervor_icon! [fervor|E]\n$BULLET_WITH_TAB$@piety_icon! [piety|E]\n$BULLET_WITH_TAB$@opinion_icon! [opinion|E]\n$BULLET_WITH_TAB$[trait|E] lub [trait_level_track_xp|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]"
 activity_ecumenical_council_holy_site_province: "\n#p +++ Miejsce święte#!"
 activity_ecumenical_council_cathedral_province: "\n#P ++ Duży ośrodek religijny#!"
 activity_ecumenical_capital_province: "\n#P + To twoja stolica#!"
