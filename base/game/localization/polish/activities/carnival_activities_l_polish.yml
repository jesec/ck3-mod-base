l_polish:
 activity_carnival: "Karnawał"
 activity_carnival_name: "Karnawał osoby znanej jako [ACTIVITY.GetOwner.GetName]"
 activity_carnival_owner: "Gospodarz"
 activity_carnival_desc: "Dogódź obywatelom, urządzając huczny karnawał, który pozwoli im oddać się hucznej maskaradzie, rozrywkom i ucztowaniu ponad rangami i podziałami.\n\nLud z radością uhonoruje historię i kulturę twojej republiki, a ty będziesz mieć szansę popisać się bogactwem i wzbudzić zazdrość we wrogach… chyba że postanowisz zmieszać się z tłumem, by wreszcie poznać swobodnie wyrażane przez mieszczan myśli i obawy."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$Można zyskać [prestige_i] [prestige|El]\n$BULLET_WITH_TAB$Można zyskać [piety_i] [piety|El]\n$BULLET_WITH_TAB$Uczestnicy mogą poprawić [opinion_i|E] [Concept('opinion', 'opinię')|E] innych [Concept('activity_guest_short_possessive', 'gości')|E]\n$BULLET_WITH_TAB$Uczestnicy mogą zredukować [stress_loss_i] [stress|El]\n$BULLET_WITH_TAB$Można poprawić [control_i|E] [Concept('control', 'kontrolę')|E] w [Concept('county', 'hrabstwie')|E]\n$BULLET_WITH_TAB$Można poprawić [prosperity_i|E] [prosperity|El] w [Concept('county', 'hrabstwie')|E]\n$BULLET_WITH_TAB$Można poprawić [popular_opinion_i|E] [Concept('popular_opinion', 'powszechną opinię')|E]\n"
 activity_carnival_guest_help_text: "Karnawał to znakomita okazja, by odkryć wśród plebejuszy nowe talenty, nawiązać kontakty biznesowe albo po prostu zredukować [stress_loss_i] [stress|El]."
 activity_carnival_province_desc: "Organizujesz karnawał w miejscu znanym jako [ROOT.Province.GetName]."
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Uczestnicy mogą zyskać [prestige|El]\n$BULLET_WITH_TAB$ Uczestnicy mogą zyskać [Concept('opinion', 'opinię')|E] u innych uczestników\n$BULLET_WITH_TAB$ Uczestnicy mogą zredukować [stress_loss_i] [stress|El]"
 activity_carnival_conclusion_desc: "[GetActivityType( 'activity_carnival' ).GetName] dobiega końca."
 activity_carnival_selection_tooltip: "Zachwyć swoich ludzi huczną maskaradą\n\nPrzewidywane nagrody:\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$[control_i|E] [control|E]\n$BULLET_WITH_TAB$[prosperity_i|E] [prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]"
 carnival_decoration_basic: "Podstawowe dekoracje"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ Mniejszy wzrost [Concept('prestige', 'prestiżu')|E]\n\n#weak Miasto i tak jest już piękne, prawda?#!"
 carnival_decoration_extensive: "Obfite dekoracje"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$ Umiarkowany wzrost [Concept('prestige', 'prestiżu')|E]\n\n#weak Ozdób miasto kwiatami, tkaninami i innymi dekoracjami, które przeniosą obywateli w bajeczny, tak różny od codziennej rzeczywistości świat.#!"
 carnival_decoration_extravagant: "Wystawne dekoracje"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ Znacznie większy wzrost [Concept('prestige', 'prestiżu')|E]\n\n#weak Upiększ ulice i place, nie szczędząc środków ani wyobraźni, by przeistoczyć miasto nie do rozpoznania – w istną krainę cudów.#!"
 carnival_entertainment_basic: "Podstawowe rozrywki"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ Mniejszy wzrost [Concept('popular_opinion', 'powszechnej opinii')|E]\n\n#weak Wystarczy kilku żonglerów i jakiś śpiewak.#!"
 carnival_entertainment_extensive: "Obfite rozrywki"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ Umiarkowana poprawa [Concept('popular_opinion', 'powszechnej opinii')|E]\n\n#weak Zatrudnij trupę aktorów, żonglerów, błaznów i bardów, która wzbudzi zachwyt i zabawi tłum.#!"
 carnival_entertainment_extravagant: "Wystawne rozrywki"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ Znaczna poprawa [Concept('popular_opinion', 'powszechnej opinii')|E]\n\n#weak Niech place wypełnią się artystami z całego świata, którzy olśnią tłum rozmaitymi pokazami niecodziennych talentów.#!"
 go_incognito_intent: "Zachowaj anonimowość"
 go_incognito_intent_desc: "Weź udział w karnawale jako zamaskowany uczestnik i zmieszaj się z tłumem.\n#EMP #low Poznaj [secret_i] [secrets|El] i działaj anonimowo."
 flaunt_wealth_intent: "Szczyć się bogactwem"
 flaunt_wealth_intent_desc: "Przywdziej olśniewające szaty i poszukaj okazji, by szczodrze sypnąć groszem.\n#EMP #low Zyskaj [prestige_i] [prestige|El] i popraw [popular_opinion_i] [Concept('popular_opinion', 'powszechną opinię')|E]."
 activity_carnival_host_an_a: "$host_activity_a$"
 carnival_base_cost: "Koszt podstawowy"
 activity_carnival_destination_selection: ""
 carnival_option_decoration: "Dekoracje karnawałowe"
 carnival_option_entertainment: "Rozrywki karnawałowe"
 carnival_phase: "$activity_carnival$"
 carnival_phase_desc: "Widok uśmiechniętego i roześmianego ludu to radość, której nie sposób porównać z niczym innym."
 carnival_conc_reward_title: "Karnawał dobiega końca"
 carnival_conc_reward: "Karnawał, którego gospodarz to [ROOT.Char.GetShortUINameNotMeNoTooltip], był udany"
