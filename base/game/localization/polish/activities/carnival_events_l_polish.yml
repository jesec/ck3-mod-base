 ## Event - Gracious Host
 carnival.1011.t: "Łaskawy gospodarz"
 carnival.1011.desc: "Karnawał to idealna okazja, by zaprezentować moje bogactwo i gust, otwierając bramy mojego pałacu dla ludu. [house_member01.GetFirstNameNoTooltip] i ja dyskutujemy na ten temat, a w międzyczasie już zastanawiam się, kogo zaprosić. [house_member01.GetFirstNameNoTooltip] rzuca kilka dobrych sugestii, ale ostateczna decyzja należy do mnie. "
 carnival.1011.a: "Udekorujcie cały pałac, nie szczędźcie środków!"
 carnival.1011.b: "Otwórzcie bramy dla ubogich!"
 carnival.1011.c: "Zaproście tylko najznamienitszych gości!"
 carnival.1011.d: "Niech zaproszona zostanie tylko dalsza rodzina."
 ## Event - Puppet theater
 carnival.1012.t: "Teatr marionetek"
 carnival.1012.desc: "Plebejusze uwielbiają teatr marionetek – mogą wtedy pooglądać sprośne i zabawne sztuki. Groteskowe lalki parodiujące postaci ze wszystkich warstw społecznych dopuszczają się cudzołóstwa, walczą, kłócą się i wpadają w przeróżne nieprawdopodobne sytuacje.\n\nKarnawał w miejscu znanym jako [carnival_location.GetName] przyciągnął tłumy marionetkarzy, i choć ludzie ich uwielbiają, [carnival_host.GetFaith.PriestNeuterPlural|l] martwią się tym, jak prymitywna jest to rozrywka."
 carnival.1012.a: "Wybiorę się na wystawiane sztuki potajemnie."
 carnival.1012.b: "Przekupcie jedną z grup, by wystawiła moją sztukę!"
 carnival.1012.c: "Otwarcie wezmę udział w przedstawieniach!"
 carnival.1012.d: "Dyskretnie ocenzuruj odgrywane sztuki w kuluarach."
 carnival.1012.e: "Zakaż tak wulgarnych przedstawień."
 ## Event - The Mask Maker
 carnival.1013.t: "Wytwórca masek"
 carnival.1013.desc: "Przechodząc przez niemal całkowicie opustoszały dziedziniec, zauważam, jak [mask_maker.GetWomanMan|l] w sędziwym wieku rzeźbi maskę. Obok [mask_maker.Custom('PL_niego_niej')] stoi kramik pełen wykonanych przez [mask_maker.Custom('PL_niego_nia')] dzieł: całe rzędy masek wszelkiego rodzaju.\n\nKunszt ich wykonania jest doprawdy znakomity."
 carnival.1013.a: "Kup wszystkie maski i rozdaj je każdemu, kogo spotkasz!"
 carnival.1013.b: "Podaruj wytwórcy masek fundusze na otwarcie własnego warsztatu."
 carnival.1013.c: "Kup wytworną maskę dla siebie."
 carnival.1013.d: "Kup przerażającą maskę dla siebie."
 carnival.1013.maskmaker_workshop.log_title: "Zainwestowano w warsztat wytwórcy masek"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUINameNotMe] pomaga wytwórcy masek w otwarciu warsztatu"
 ## Event - Holy Fools
 carnival.1014.t: "Święte błazny"
 carnival.1014.desc: "Ulicą przechodzi parodia procesji religijnej. Kostiumy przedstawiają karykatury księży, mnichów, a nawet najwyższych przywódców naszej wiary! Duchowieństwo jest jawnie wyśmiewane."
 carnival.1014_2.a.desc: "\n\nPozostaję w ukryciu, w tłumie."
 carnival.1014_2.b.desc: "\n\nLud oczekuje, że zareaguję."
 carnival.1014.a: "Dyskretnie wezwij straże, aby położyły kres tej farsie."
 carnival.1014.b: "Potęp ich za ich grzeszność!"
 carnival.1014.c: "Dołącz do szyderców."
 carnival.1014.d: "Wtop się w tłum."
 carnival.1014.e: "Od lat nic mnie tak nie rozbawiło!"
 cooltip.carnival.1014.non_believer: "#weak #EMP Utrata [Concept('stress', 'stresu')|E] z powodu twojego [Concept('secret', 'sekretu')|E] (niewierzący)#!#!"
 carnival.1014.secret.tt.toast: "Zdajesz sobie sprawę, że w twoim sercu nigdy nie było miejsca na wiarę"
 carnival.1014.mockery.tt.toast: "Czujesz zarazem wyrzuty sumienia i ulgę"
 ## Event - The Cat
 carnival.1015.t: "Kot"
 carnival.1015.desc: "Niewielki cień śledzi mnie przez cały wieczór. Za każdym rogiem czeka na mnie dwoje błyszczących oczu i szorstkie #EMP „miau”#!.\n\n– Wygląda na to, że masz nowego przyjaciela – [observer_01.GetTitledFirstName] zanosi się śmiechem, wskazując palcem na ocierającego się znów o moje nogi kota."
 carnival.1015.a: "Widocznie tak miało być!"
 carnival.1015.b: "Z pewnością kot wolałby zostać z tobą."
 carnival.1015.c: "[family_member01.GetTitledFirstName] z pewnością ucieszy się z nowego kompana."
 carnival.1015.adopt_cat.log_title: "Przygarnięto kota"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUINameNotMe] przygarnia kota"
 ## Event - Lover's mask
 carnival.1016.t: "Maska kochanka"
 carnival.1016.desc: "Kiedy błąkam się ulicami miejsca znanego jako [carnival_location.GetName], pogrążonego w odświętnej atmosferze, słyszę niosącą się echem przez alejki muzykę i widzę, jak zabawa przenosi się z karczm na ulice. Wszędzie można dostrzec, jak plebejusze i patrycjusze ocierają się o siebie, a rangi i przywileje zastępuje maska.\n\nCzuję dotyk na swoim ramieniu i widzę, że stoi za mną [woo_character.GetWomanMan|l] w masce. Przybiera dramatyczną pozę, a chwilę później chichocze. Kiedy odsuwa na krótką chwilę maskę, rozpoznaję ukrytą pod nią twarz – to [woo_character.GetNameNoTooltip].\n\n #EMP – Witaj, wasza wysokość. Zechcesz spędzić ze mną wieczór? Ot, dwójka zamaskowanych obcych ciesząca się karnawałem#! – mówi, składając przesadnie dworski ukłon."
 carnival.1016.a: "Cóż za wspaniała niespodzianka! Prowadź, zupełnie #EMP „obca”#! mi osobo."
 carnival.1016.b: "Przydałoby mi się towarzystwo kogoś, kto darzy mnie #BOLD przyjaźnią.#!"
 carnival.1016.c: "Pozostaniemy sobie obcy."
 ## Event - In candle light
 carnival.1017.t: "W świetle świec"
 carnival.1017.desc: "Odnajduję osobę znaną jako [intent_target.GetNameNoTooltip] w cichej karczmie. Na zewnątrz wciąż trwa huczny karnawał, ale wewnątrz jest przytulnie – karczma oświetlona jest ciepłym światłem świec. [intent_target.GetNameNoTooltip] czyta, gdy wchodzę, a [intent_target.Custom('PL_jego_jej')] brew marszczy się w skupieniu.\n\nZ pewnością jakaś błyskotliwa rozmowa sprawi, że zwróci uwagę na moje wdzięki."
 carnival.1017.a: "Zaimponuj [intent_target.Custom('PL_mu_jej')] swoją wiedzą o literaturze."
 carnival.1017.b: "Spraw, że zapomni o książce, dzięki swoim dowcipnym ripostom."
 carnival.1017.c: "Zapytaj, czy możesz przeczytać tę książkę po [intent_target.Custom('PL_nim_niej')]."
 carnival.1017.a.tt.failure.desc: "Ach, dobra lektura dla kogoś prostego"
 carnival.1017.a.tt.success.desc: "To przypomina mi o innej książce"
 carnival.1017.b.tt.success.desc: "Odciągnij [intent_target.Custom('PL_jego_jej')] uwagę od książki"
 carnival.1017.a.tt.success.toast: "Twoja obszerna wiedza zwróciła uwagę osoby, którą jest [intent_target.GetTitledFirstName]"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName] uważa cię za osobę nudną i nadętą"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName] zupełnie zapomina o książce"
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName] dalej tkwi z nosem w swojej książce"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName] uznaje twoją błyskotliwość za mniej angażującą niż [intent_target.Custom('PL_jego_jej')] książka"
 carnival.1017.c.tt.toast: "Ty i [intent_target.GetTitledFirstName] zbliżacie się do siebie, rozmawiając o interesującej książce"
 ## Event - Flowers & song
 carnival.1018.t: "Miłość i gierki"
 carnival.1018.desc: "Na placu zgromadził się tłum, by obejrzeć zawody sprawdzające siłę i umiejętności uczestników. Przy dopingu widowni rozgrywają się tu konkurencje takie jak zapasy, biegi czy przeciąganie liny. Panuje przyjazna i wesoła atmosfera.\n\n[intent_target.GetTitledFirstName] zdaje się być pod wrażeniem waleczności, którą przedstawiają uczestnicy. [intent_target.Custom('PL_jego_jej')|U] oczy wciąż wędrują w kierunku osoby, którą jest [contender.GetTitledFirstName]. Muszę w jakiś sposób [contender.Custom('PL_go_ja')] pokonać, inaczej [intent_target.GetTitledFirstName] nie obdarzy mnie uznaniem."
 carnival.1018.a: "Pokonam [contender.Custom('PL_go_ja')] w zapasach!"
 carnival.1018.b: "Może uda się [contender.Custom('PL_go_ja')] przekonać do podłożenia się?"
 carnival.1018.c: "Ośmiesz [contender.Custom('PL_go_ja')] na oczach osoby, którą jest [intent_target.GetTitledFirstNameNoTooltip]"
 carnival.1018.d: "Nie chce mi się brać udziału w tych zawodach."
 carnival.1018.a.success.desc: "[contender.GetTitledFirstNameNoTooltip] przegrywa"
 carnival.1018.a.success.toast: " [intent_target.GetTitledFirstNameNoTooltip] jest pod wrażeniem twojej waleczności"
 carnival.1018.a.failure: "Lądujesz na swoich czterech literach"
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip] zapomina o twoim istnieniu"
 carnival.1018.b.success: "Udaje ci się sprawić, że wygląda to autentycznie"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip] ogłasza cię mistrzem"
 carnival.1018.b.failure: "Zawody są perfidnie ustawione"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip] zarzuca ci oszustwo"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip] czuje rozbawienie i zachwyt"
 ## Event - A mask in the crowd
 carnival.1019.t: "Maski w tłumie"
 carnival.1019.desc: "W tłumie ciągle dostrzegam tę samą maskę. Gdy przemierzam ulicę, ta sama twarz o zamrożonym wyrazie uśmiechniętego błazna wydaje się majaczyć na skraju mojego pola widzenia. Pojawia się raz po raz w rzece masek. Czy ktoś mnie śledzi? Sama ta myśl mrozi mi krew w żyłach.\n\nSchodzę z głównej ulicy, a zamaskowane postacie podążają za mną. Mam pewność, że chcą zrobić mi krzywdę!"
 carnival.1019.a: "Przygotuj zasadzkę."
 carnival.1019.b: "Zwab ich w kierunku grupy strażników."
 carnival.1019.c: "Wołaj o pomoc."
 cooltip.carnival.1019.tt.assassination_success: "Zabijasz napastnika"
 cooltip.carnival.1019.tt.assassination_fended: "Ranisz napastnika"
 cooltip.carnival.1019.tt.assassination_captured: "Napastnik zostaje uwięziony"
 cooltip.carnival.1019.tt.assassination_scream: "Twoje krzyki sprawiają, że zamachowcy uciekają"
 carnival.1019.tt.assassination_success.desc: "Uśmiercasz napastnika"
 carnival.1019.tt.assassination_fended.desc: "Odpierasz atak napastnika"
 carnival.1019.tt.assassination_wounded.desc: "Odnosisz rany"
 carnival.1019.tt.assassination_killed.desc: "Napastnik cię zabija"
 carnival.1019.tt.assassination_gotaway.desc: "Udaje ci się uciec"
 carnival.1019.tt.assassination_cornered.desc: "Jesteś w pułapce"
 carnival.1019.tt.assassination_captured.desc: "Strażnicy łapią napastnika"
 carnival.1019.tt.assassination_fended_toast: "Dźgasz podążającą za tobą postać i uciekasz, klucząc alejkami"
 carnival.1019.tt.assassination_wounded_toast: "Napastnik rani cię i z powrotem odsuwa się w cień"
 carnival.1019.tt.assassination_success_toast: "nieudolny zabójca, [murder_01.GetFirstNameNoTooltip], nie żyje"
 carnival.1019.tt.assassination_gotaway_toast: "Udaje ci się wymknąć napastnikom"
 carnival.1019.tt.assassination_captured_toast: "Zabójca, [murderer_01.GetFirstNameNoTooltip], trafia do celi."
 ## Event - Thundering hooves
 carnival.1020.t: "Grzmiące kopyta"
 carnival.1020.desc: "Zauważam, jak [murder_victim.GetNameNoTooltip] wraz z osobą, którą jest [bystander.GetFirstNameNoTooltip], a dla [murder_victim.Custom('PL_niego_niej')] [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))], opuszcza ucztę.\n\nŚciągam wodze mojego konia i czekam, aż [murder_victim.GetFirstNameNoTooltip] pożegna się z gospodarzem. Mój cel jest zupełnie nieświadomy zagrożenia, które tupie kopytami nieopodal.\n\nTo dogodny moment, ale wiąże się z ryzykiem, że oprócz mojego celu ucierpią niewinni ludzie."
 carnival.1020.a: "Przetnę tę dwójkę, przejeżdżając obok nich."
 carnival.1020.b: "Naprzód, [ROOT.Char.Custom('WarhorseStoryName')]! Dowiedzą się, że jestem kimś, kogo trzeba się bać."
 carnival.1020.c: "Stratuj osobę znaną jako [murder_victim.GetFirstNameNoTooltip]. Cóż za straszny wypadek."
 carnival.1020.d: "Daję znak zatrudnionym przeze mnie ludziom, żeby ruszyli w pościg za moją ofiarą."
 carnival.1020.e: "Nie dzisiaj, ryzyko jest zbyt duże."
 carnival.1020.tt.horse.hit.desc: "Ofiara zostaje stratowana"
 carnival.1020.tt.horse.miss.desc: "Koń nie trafia w cel"
 carnival.1020.tt.horse.hit.toast: "Ofiara została stratowana"
 carnival.1020.tt.horse.miss.toast: "Koń nie trafił w cel"
 carnival.1020.murder_horse.log_title: "Szaleństwo na koniu bojowym"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUINameNotMe] tratuje osobę znaną jako [murder_victim.GetShortUINameNotMe], jadąc na swoim koniu bojowym o imieniu [carnival_main.Custom('WarhorseStoryName')]"
 carnival.1020.accident.log_title: "Okropny wypadek"
 carnival.1020.accident.log: "[murder_victim.GetShortUINameNotMe] umiera po okropnym wypadku w wyniku stratowania przez konia."
 carnival.1020.both_accident.log_title: "Okropny wypadek"
 carnival.1020.both_accident.log: "[murder_victim.GetShortUINameNotMe] i [bystander.GetShortUINameNotMe] umierają po okropnym wypadku w wyniku stratowania przez konia"
 carnival.1020.bystander_accident.log_title: "Okropny wypadek"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUINameNotMe] umiera po okropnym wypadku w wyniku stratowania przez konia."
 carnival.1020.sword.log_title: "Morderstwo z siodła"
 carnival.1020.sword.log: "Osoby znane jako [murder_victim.GetShortUINameNotMe] i [bystander.GetShortUINameNotMe] zostają przecięte na pół przez jeźdźca."
 carnival.1020.miss.log_title: "Osoba znana jako [murder_victim.GetShortUINameNotMe] prawie zostaje stratowana przez konia"
 carnival.1020.miss.log: "[murder_victim.GetShortUINameNotMe] twierdzi, że osoba znana jako [carnival_main.GetShortUINameNotMe] próbowała [murder_victim.Custom('PL_go_ja')] stratować – to próba morderstwa!"
 ## Event - The Arrow
 carnival.1021.t: "Strzała"
 carnival.1021.desc: "W moim punkcie obserwacyjnym panuje cisza, jedynie drewno delikatnie skrzypi, a przez okiennice docierają przyciszone odgłosy ulicy. Na zewnątrz, na dziedzińcu poniżej, mój cel, [murder_victim.GetFirstNameNoTooltip], zupełnie nie zdaje sobie sprawy z mojego spojrzenia, ani z tego, że u mego boku spoczywa [SCOPE.Custom('UniqueBowOrJustBow')].\n\nNa wszelki wypadek jest ze mną wynajęty zbir, [bandit_01.GetFirstNameNoTooltip] – gdyby miała przydać się dodatkowa para rąk.\n\nNaciągam cięciwę, a [murder_victim.GetFirstNameNoTooltip] spogląda w górę, przeszukując wzrokiem okna!"
 carnival.1021.a: "Oddam strzał, zanim mnie zobaczy."
 carnival.1021.b: "Ty strzelaj, [bandit_01.GetFirstNameNoTooltip]. Ja zabezpieczę drogę ucieczki."
 carnival.1021.c: "Kryj się. Musimy poczekać na lepszą okazję."
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip] zabija nie tę osobę"
 carnival.1021.tt.arrow.hit.desc: "Strzała trafia w cel"
 carnival.1021.tt.arrow.miss.desc: "Strzała chybia, a cel cię zauważa"
 carnival.1021.tt.thug.arrow.hit.desc: "Strzała trafia w cel"
 carnival.1021.tt.thug.arrow.miss.desc: "Strzała trafia inną osobę"
 carnival.1021.tt.arrow.hit.toast: "Strzała trafiła w cel"
 carnival.1021.tt.arrow.miss.toast: "Strzała chybiła, a ciebie zauważono!"
 carnival.1021.tt.thug.arrow.hit.toast: "Strzała wystrzelona przez zbira trafiła cel"
 carnival.1021.tt.thug.arrow.miss.toast: "Strzała wystrzelona przez zbira trafiła inną osobę!"
 carnival.1021.arrow.log_title: "Nieznany łucznik"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip] umiera po trafieniu strzałą przez nieznanego łucznika"
 ## Event - Procession of My Own
 carnival.1022.t: "Moja własna procesja"
 carnival.1022.desc: "Miasto finansuje karnawał dla dobra wszystkich i choć złota wystarczy na odpowiednie rozrywki, przedsiębiorczy obywatel z zasobnym portfelem mógłby jeszcze bardziej wzbogacić blask naszych uroczystości.\n\nJeśli wniosę swój wkład, podobni mi będą patrzeć na mnie z zazdrością, a w oczach tych niższych rangą będę lśnić niczym patrycjusz z dawnych czasów. Tak, wystarczy tylko pomyśleć – wielcy z dawnych miast-państw obnosili się ze swoim bogactwem! Jeśli zasponsoruję wspaniałą procesję, moje imię będzie na ustach wszystkich!\n\n#BOLD Ale jaki powinien być motyw przewodni?#!"
 carnival.1022.a: "#BOLD Piękna#! procesja, która uhonoruje moje osiągnięcia!"
 carnival.1022.b: "#BOLD Onieśmielająca#! procesja, która wzbudzi strach i szacunek!"
 carnival.1022.c: "#BOLD Religijna#! procesja, która pokaże moją pobożność!"
 carnival.1022.d: "Z drugiej strony mogę wydać moje złoto na coś lepszego."
 custom.carnival.1022.guestopinion: "Każdy uczestnik karnawału"
 custom.zealot_carnival.1022.guestopinion: "Każdy uczestnik karnawału o postawie: [GetVassalStance( 'zealot' ).GetTextIcon|l]"
 ## Event - Legacy in marble
 carnival.1023.t: "Dziedzictwo w marmurze"
 carnival.1023.desc: "Od dzieciństwa opowiadano mi o starożytnych miastach-państwach. Patrycjusze byli wielkimi mecenasami sztuki i chociaż okazałe budowle z dawnych, wspaniałych czasów leżą dziś w ruinach, artyzm i piękno, które je wyróżnia, wciąż inspirują. Sponsorując artystów, mogę sprawić, że moje imię dołączy do tego dostojnego grona.\n\nWystarczy tylko pomyśleć: moja reputacja trwałaby dalej, nawet gdy mnie już nie będzie!\n\nNiech ludzie podziwiają piękno wykute w marmurze i kamieniu, rzeźbione w drewnie, pomalowane we wszystkie kolory tęczy! Niechaj [Glossary( '#bold patria#!', 'carnival_patria_GLOSS' )] okryje się chwałą, cześć niech będzie naszym przodkom, a ród [ROOT.Char.GetDynastyHouseName] uzyska właściwy mu prestiż!"
 carnival.1023.a: "Ufunduj zawody dla młodych artystów"
 carnival.1023.b: "Zamów nowe freski i dekoracje do ozdoby placu publicznego."
 carnival.1023.c: "Zamów komplet posągów przedstawiających założycieli miasta."
 carnival.1023.d: "Chwileczkę, dzieła sztuki są aż tak kosztowne!?"
 ## Event - Whispers behind the mask
 carnival.1024.t: "Szepty zza maski"
 carnival.1024.desc: "W roztańczonej atmosferze karnawału granice się zacierają, a ludzie tracą poczucie przyzwoitości. Nigdy nie wiadomo, kim naprawdę jest zamaskowana osoba obok ciebie ani co zapamięta.\n\n[hook_target.GetTitledFirstNameNoTooltip] zatraca się w szaleństwie. Spędza wieczór, tańcząc z każdym, kto przykuje [hook_target.Custom('PL_jego_jej')] wzrok, pijąc i jedząc, jakby jutra miało nie być. Śmieje się i rozmawia, zupełnie nie zwracając uwagi na to, kto słucha. Tańczy na granicy skandalu, w kompletnej nieświadomości, że #BOLD obserwuję [hook_target.Custom('PL_go_ja')] zza swojej maski.#!\n\n #BOLD Mogę oszczędzić [hook_target.Custom('PL_mu_jej')] wstydu lub wykorzystać tę sytuację przeciwko [hook_target.Custom('PL_niemu_niej')] i wpisać [hook_target.Custom('PL_go_ja')] na listę moich dłużników.#!"
 carnival.1024.a: "Będę po przyjacielsku [hook_target.Custom('PL_go_ja')] obserwować."
 carnival.1024.b: "Szkoda by było, gdyby ktoś później wykorzystał to przeciwko [hook_target.Custom('PL_niemu_niej')]."
 carnival.1024.c: "Lepiej będzie, jak po przyjacielsku ostrzegę [hook_target.Custom('PL_jego_jej')] ród."
 carnival.1024.d: "[hook_target.GetTitledFirstNameNoTooltip] musi popełniać własne błędy, a ja [hook_target.Custom('PL_mu_jej')] na to pozwolę."
 carnival.1025.t: "Świecidełka i fantastyczne stworzenia"
 carnival.1025.into_desc: "Znajduję się przed kramem zagranicznego kupca. Na wystawie leżą przedziwne przedmioty ze wszystkich zakątków świata, nie wspominając nawet o klatkach, w których siedzą egzotyczne stworzenia. Dźwięki wydawane przez tę menażerię, jak i jej zapach, to coś niebywałego.\n\n– Chodźcie! Spójrzcie, jak wspaniałe rzeczy mam na sprzedaż! – wykrzykuje kupiec, wskazując na swój towar.\n\n– [merchant_trinket.GetName] wysokiej jakości, a oprócz tego: [merchant_creature.GetName|l] –"
 carnival_1025_creature_lion_desc: "dziki stwór z legend pożerający ludzi."
 carnival_1025_creature_caracal_desc: "stwór niewielki, lecz zajadły!"
 carnival_1025_creature_lynx_desc: "stwór, który wbiega na drzewo w kilka sekund, a z jego moczu powstają kryształy o magicznych właściwościach!"
 carnival_1025_creature_tiger_desc: "zaciekły stwór ludojad z perskich legend!"
 carnival_1025_creature_leopard_desc: "stwór jak żyw wyjęty z antycznych zapisów!"
 carnival_1025_creature_bear_desc: "potrafi stanąć na przednich łapach i żonglować kamieniami wielkości ludzkiej głowy!"
 carnival_1025_creature_elephant_desc: "stwór stworzony przez szalonego alchemika!"
 carnival_1025_creature_peacock_desc: "stwór zrodzony z ognia!"
 carnival_1025_creature_parrot_desc: "potrafi mówi i wyśpiewywać pieśni!"
 carnival_1025_creature_cockatoo_desc: "niesamowicie rzadki stwór!"
 carnival_1025_creature_crane_desc: "spójrzcie, z jaką gracją się porusza!"
 carnival_1025_creature_monkey_desc: "z czeluści piekieł!"
 carnival.1025.a: "– Świetnie, wezmę tę błyskotkę."
 carnival.1025.b_1: "– Wspaniale, przygarnę tę bestię."
 carnival.1025.b_2: "– Mam sporą pewność, że to po prostu [merchant_creature.Custom('GetCarnival1025RealBeastName')|l]."
 carnival.1025.c: "Przynajmniej popatrzeć można za darmo"
 carnival.1025.embarrassed_merchant: "Kupiec ze wstydu daje ci zniżkę."
