 ## Event - Dead End
 carnival.1111.t: "Bez wyjścia"
 carnival.1111.desc: "Szarpię się z jednym z zabójców i czuję, jak mój kark przeszywa ból – jeden z atakujących dźgnął mnie, zachodząc mnie od tyłu. Ziemia usuwa mi się spod nóg. Moje kończyny leżą bezwładnie, zupełnie bez siły, a rwany oddech zostawia bąbelki krwi na moich ustach."
 carnival.1111.a: "To nie miało się tak skończyć."
