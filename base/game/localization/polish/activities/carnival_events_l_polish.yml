 ## Event - the duel
 carnival.1010.t: "Pojedynek"
 carnival.1010.desc: "Dwóch zamaskowanych nieznajomych staje naprzeciw siebie, a tłum robi miejsce, by walczący mogli okrążać się nawzajem. Dobyli ostrzy! Nienawiść w ich oczach wskazuje, że zamierzają zrobić coś więcej, niż tylko upuścić nieco krwi przeciwnikowi."
 carnival.1010.a.desc: "\n\nPozostaję jedynie kolejną maską w tłumie."
 carnival.1010.b.desc: "Ktoś mnie rozpoznał – tłum czeka, by zobaczyć, czy zainterweniuję."
 carnival.1010.a: "Nakaż straży przerwać pojedynek."
 carnival.1010.b: "Przekonaj ich, aby przerwali pojedynek."
 carnival.1010.c: "Rozkaż im przerwać pojedynek."
 carnival.1010.d: "Pozwól na rozpoczęcie pojedynku."
 cooltip.carnival.1010_duel_diplomacy_success: "Powstrzymujesz pojedynek"
 cooltip.carnival.1010_duel_diplomacy_fail: "Nie udaje ci się powstrzymać pojedynku"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUINameNotMe] przegrywa pojedynek i może odnieść rany lub umrzeć."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUINameNotMe] przegrywa pojedynek i może odnieść rany lub umrzeć."
