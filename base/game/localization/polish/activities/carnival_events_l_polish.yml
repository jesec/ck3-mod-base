 ## GLOSS
 carnival_GLOSS: "Słowo „karnawał” wywodzi się od łacińskiego wyrażenia „carnis levare”, oznaczającego „odstawić mięso”, i odnosi się do ostatniej uczty przed okresem wielkiego postu."
 carnival_patria_GLOSS: "#EMP Patria#! to łacińskie słowo oznaczające „kraj” lub „ojczyznę”. W średniowieczu użycie określenia #EMP patria#! wyrażało dumę i przynależność do prowincji, miasta lub republiki."
