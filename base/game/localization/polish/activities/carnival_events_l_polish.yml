l_polish:
 ## Event - Carnival Opening
 carnival.1001.t: "Czas cudów"
 carnival.1001.desc: "Przygotowania dobiegły końca.\n\nKolorowe chorągwie zdobią bulwary, a przez uliczki i alejki miejsca znanego jako [carnival_location.GetName] wiją się pochody. Tłumy gromadzą się na placach – bogaci, biedni, brzydcy czy piękni – wszyscy jesteśmy tacy sami w tym morzu zamaskowanych twarzy.\n\nCóż to będzie za widowisko!"
 carnival.1001.a: "Nadszedł czas, by założyć maskę. [Glossary( '#bold Carnis levare!#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "Spróbujcie znaleźć mnie teraz, mordercy!"
 carnival.1001.c: "Maska kryje zarówno wady, jak i blizny…"
 ## Event - Carnival Closing
 carnival.1002.t: "Powrót do codzienności"
 carnival.1002.desc: "Ulice usłane są pozostałościami po karnawale. Porzucone maski i dekoracje zalegają w rynsztokach, a świętujący wloką się z powrotem do domów. Ucztowaliśmy, tańczyliśmy, bawiliśmy się i śmialiśmy razem jako zjednoczone miasto, odkładając na bok nasze różnice.\n\nBlask karnawału jeszcze przez jakiś czas będzie unosił się w powietrzu, przypominając nam, kim jesteśmy, a potem wrócimy do naszego zwykłego życia – do hierarchii, trudów i obowiązków – aż karnawał nadejdzie ponownie."
 carnival.1002.a: "Czas zabrać się do pracy."
 carnival.1002.b: "A co, gdyby każdy dzień mógł tak wyglądać?"
 carnival.1002.c: "Dobrze jest wrócić do normalności."
 ## Event - A chance for mischief
 carnival.1003.t: "Okazja do psot"
 carnival.1003.desc: "Odwiedzając krzykliwą rezydencję rodu [house_target.GetDynastyHouseName], zauważam wspaniałe, uszyte z [house_target.Custom('RegionalFabric')] zasłony, [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')] rosnące całymi setkami, ogrom służących i osobę znaną jako [house_target.GetName] pouczającą swoich klientów. Ogarnia mnie chęć, by sprowadzić ich nieco na ziemię.\n\nTakie psoty pasują przecież do ducha karnawału, prawda?\n\nChyba zatrudnię potajemnie kilku łobuzów, aby…"
 carnival.1003.a: "Obrzucili osobę znaną jako [house_target.GetFirstNameNoTooltip] zgniłymi jajami!"
 carnival.1003.b: "Wpadli do pałacu osoby znanej jako [house_target.GetName] przebrani za diabły."
 carnival.1003.c: "Namalowali wulgarny mural przedstawiający rodzinę osoby znanej jako [house_target.GetName] wzdłuż bulwarów."
 carnival.1003.d: "Po namyśle – jednak nie."
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUINameNotMe] czuje zbyt wielki wstyd, aby wyjść na zewnątrz"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUINameNotMe] traci rozum"
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUINameNotMe] gotuje się od środka"
 carnival.1003.throw_eggs_log_title: "Obrzucona jajami"
 carnival.1003.throw_eggs_log: "Rezydencja rodu [house_target.GetDynastyHouseName] została obrzucona jajami"
 carnival.1003.mischief.insanity.log_title: "Diabelskie wybryki"
 carnival.1003.mischief.insanity.log: "Zamieszki wywołane przez przebranych za diabły chuliganów doprowadziły osobę znaną jako [house_member.GetShortUINameNotMe] do utraty zmysłów"
 carnival.1003.mischief.irritable.log_title: "Diabelskie wybryki"
 carnival.1003.mischief.irritable.log: "Zamieszki wywołane przez przebranych za diabły chuliganów sprawiły, że osoba znana jako [house_member.GetShortUINameNotMe] wściekła się i poirytowała wszystkimi wokół"
 carnival.1003.mischief.reclusive.log_title: "Diabelskie wybryki"
 carnival.1003.mischief.reclusive.log: "Zamieszki wywołane przez przebranych za diabły chuliganów sprawiły, że osoba znana jako [house_member.GetShortUINameNotMe] musiała się ukryć"
 ## Event - House Relations
 carnival.1004.t: "Relacja międzyrodowa"
 carnival.1004.desc: "Podzielone miasto nie przetrwa długo, dlatego moim obowiązkiem jest zawrzeć sojusz z potężnymi, zaangażowanymi w politykę miejsca znanego jako [carnival_location.GetName] rodami.\n\nPodczas bankietu odciągam na bok osobę, którą jest [other_house_leader01.GetName], i staram się przedstawić jej zalety dobrych relacji między moim rodem – rodem [ROOT.Char.GetDynastyHouseName] – a jej rodem – rodem [other_house_leader01.GetDynastyHouseName]."
 carnival.1004.a: "Nasze księgi są pełne, a kieszenie głębokie!"
 carnival.1004.b: "Kooperacja w biznesie przynosi obopólne korzyści."
 carnival.1004.c: "Twój ród nie dorównuje rodowi [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 carnival.1004.d: "Relacja między naszymi rodami powinna pozostać niezmieniona."
 ## Event - Prank a friend
 carnival.1005.t: "Żarty z przyjaciela"
 carnival.1005.desc: "Karnawał to idealna okazja, aby zrobić przyjacielowi psikusa – oczywiście takiego w dobrym tonie.\n\nWidzę, jak [friend.GetName] – bliska mi osoba – i [bystander.GetName] rozmawiają ze sobą, a mój umysł natychmiastowo podpowiada mi kilka zabawnych pomysłów!"
 carnival.1005.a: "Wyzwij obydwie osoby na pojedynek na drewniane kijki!"
 carnival.1005.b: "Wpadnij na [friend.Custom('PL_niego_nia')] w przebraniu, mówiąc wymyślonym językiem."
 carnival.1005.c: "Obrzucę tę dwójkę pomalowanymi skorupami jajek wypełnionymi perfumami!"
 carnival.1005.d: "Nie. Nie będę na siłę robić innym żartów."
 carnival.1005.tt.stick_success.desc: "Odbywasz przyjemną walkę na kije"
 carnival.1005.tt.stick_failure.desc: "Przekraczasz granice i bawisz się trochę zbyt ostro"
 carnival.1005.tt.success.desc: "Wszyscy śmieją się z twoich popisów"
 carnival.1005.tt.failure.desc: "Twoje ofiary nazywają cię głupim osłem"
 carnival.1005.tt.disguise_success.desc: "Udaje ci się rozbawić publikę"
 carnival.1005.tt.disguise_failure.desc: "Dezorientujesz i irytujesz twoją publikę."
 carnival.1005.tt.success.toast: "Wszyscy śmiali się z twoich popisów"
 carnival.1005.tt.failure.toast: "Twoje ofiary nazwały cię głupim osłem"
 carnival.1005.tt.egg_success.toast: "Osobie z kręgu twoich przyjaciół spodobała się pachnąca niespodzianka"
 carnival.1005.tt.egg_failure.toast: "Osoba z kręgu twoich przyjaciół nie mogła znieść tego zapachu."
 ## Event - The entertainer
 carnival.1006.t: "Artyści"
 carnival.1006.desc: "Karnawał to szczyt sezonu dla wszelkiej maści artystów. Słucham właśnie grupy muzyków, którzy snują opowieści, używając swoich głosów, napisanych wersów i instrumentów."
 carnival.1006.a: "Zapłacę muzykom, aby śpiewali wychwalające mą wspaniałość pieśni!"
 carnival.1006.b: "Każę pośrednikowi zatrudnić najlepszych spośród nich."
 carnival.1006.c: "Najlepiej będzie poprosić o popularną melodię."
 carnival.1006.d: "Zaproś stojącą w pobliżu osobę do tańca!"
 cooltip.carnival.1006.bawdy_song.tt: "Prosi o nieprzyzwoitą piosenkę"
 cooltip.carnival.1006.patriotic_song.tt: "Prosi o piosenkę wychwalającą [Glossary( '#bold patrię!#!', 'carnival_patria_GLOSS' )]"
 cooltip.carnival.1006.spiritual_song.tt: "Prosi o duchową piosenkę"
 carnival.1006.tt.dance_success.desc: "[dancer_character.GetWomanMan|U] przyjmuje zaproszenie do tańca"
 carnival.1006.tt.dance_failure.desc: "[dancer_character.GetWomanMan|U] odrzuca zaproszenie do tańca"
 carnival.1006.tt.dance_success.toast: "Tańczysz z osobą znaną jako [dancer_character.GetFirstNameNoTooltip]"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip] nie chce z tobą tańczyć."
 carnival.1006.bawdy_song.tt.toast: "Grają nieprzyzwoitą piosenkę!"
 carnival.1006.patriotic_song.tt.toast: "Grają piosenkę wychwalającą [Glossary( '#bold patrię!#!', 'carnival_patria_GLOSS' )]!"
 carnival.1006.spiritual_song.tt.toast: "Grają duchową piosenkę!"
 carnival.1006.recruit_entertainer.log_title: "Zwerbowany artysta"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip] rekrutuje osobę znaną jako [entertainer_character.GetFirstNameNoTooltip]"
 ## Event - Learning to juggle
 carnival.1007.t: "Nauka żonglerki"
 carnival.1007.desc: "Minstrele, żonglerzy i błazny zabawiają tłumy gromadzące się wzdłuż bulwarów miejsca znanego jako [carnival_location.GetName]. Moją uwagę szczególnie przykuwają żonglerzy. Trudno jest nie patrzeć z podziwem, jak ogromną kontrolę mają nad nożami i piłkami, które jak zawieszone utrzymują w powietrzu.\n\nJeden z żonglerów wychodzi naprzód i pyta, czy chcę ot tak, dla zabawy, spróbować tej sztuki.\n\n– Jedna, dwie, trzy? Jak wiele piłek jest [ROOT.Char.Custom('RandomLadyLord')] w stanie powstrzymać przed upadkiem na ziemię?"
 carnival.1007.a: "Założę się z każdym, że utrzymam w powietrzu trzy piłki!"
 carnival.1007.b: "Dwie zdecydowanie wystarczą."
 carnival.1007.c: "A czemu nie dwa noże?"
 carnival.1007.d: "Nie zniżę się do udziału w takiej błazenadzie."
 carnival.1007.juggling_success.tt.toast: "Udane żonglowanie"
 carnival.1007.juggling_fail.tt.toast: "Upuszczasz piłki"
 carnival.1007.juggling_athletic.tt.toast: "Żonglowanie to dobry trening ciała, jak i zmysłów"
 carnival.1007.juggling_k.success.tt.toast: "Udane żonglowanie nożami"
 carnival.1007.juggling_k.fail.tt.toast: "Zacinasz się, żonglując nożami"
 carnival.1007.blademaster.log_title: "Fascynacja ostrzami"
 carnival.1007.blademaster.log: "[carnival_main.GetFirstNameNoTooltip] uzyskuje fascynację ostrzami po próbie żonglowania nożami"
 ## Event - A wild dance
 carnival.1008.t: "Dziki taniec"
 carnival.1008.desc: "Plac centralny stał się morzem zamaskowanych tancerzy bawiących się w rytm muzyki pomieszanej ze śmiechami. Obcy sobie ludzie spotykają się, a później rozdzielają w wirującym tańcu, w którym co chwilę zmieniają się partnerzy.\n\nAtmosfera jest zaraźliwa, czuję to, nawet stojąc na obrzeżach placu!"
 carnival.1008.a: "– Wynagrodzę najlepszych tancerzy złotem!"
 carnival.1008.b: "Będę TAŃCZYĆ! TAŃCZYĆ – aż padnę z nóg!"
 carnival.1008.c: "Niech taniec poprowadzi mnie dokądkolwiek."
 carnival.1008.d: "Ciesz się chwilą."
 carnival.1008.strong.tt.toast: "Roztańczone nogi"
 carnival.1008.exhausted.tt.toast: "Taniec cię wyczerpał!"
 carnival.1008.hurt.tt.toast: "Podczas tańca stała ci się krzywda!"
 ## Event - A drink with a craftsman
 carnival.1009.t: "Ja i [craftsman_character.Custom('CraftsmanDescOption')|l] – drink z mistrzem rzemiosła"
 carnival.1009.desc: "W jednym z zakładów na ulicy, na której niemal każdy pracujący to [craftsman_character.Custom('CraftsmanDescOption')|l], wdaję się w rozmowę z mistrzem rzemiosła.\n\n"
 carnival.1009.1_a.desc: "Osoba ta jest w szoku, że spotyka na żywo kogoś takiego jak [carnival_host.GetTitleAsNameNoTooltip]."
 carnival.1009.1_b.desc: "Z pewnością nie ma [craftsman_character.GetSheHe] pojęcia, kto bezpiecznie skrywa się za tą maską."
 carnival.1009.2_a.desc: "Słucham z zainteresowaniem, jak [craftsman_character.Custom('CraftsmanDescOption')|l] narzeka na kiepskie zarządzanie miastem, twierdząc, że całą winę za stan, w jakim obecnie znajduje się [craftsman_character.Custom('PL_jego_jej')] rzemiosło, ponosi [carnival_host.GetTitleAsNameNoTooltip]."
 carnival.1009.2_b.desc: "Słucham z zainteresowaniem jak [craftsman_character.Custom('CraftsmanDescOption')|l] wychwala osobę, którą jest [carnival_host.GetTitleAsNameNoTooltip], za dobre zarządzanie miastem i wznosi kufel za jej zdrowie."
 carnival.1009.2_c.desc: "[craftsman_character.Custom('CraftsmanDescOption')] bardzo się cieszy z dobrego zarządzenia miastem i nie szczędzi mi pochwał."
 carnival.1009.2_d.desc: "[craftsman_character.Custom('CraftsmanDescOption')] milknie, po czym z ponurą miną mówi, że ostatnio nie wiedzie [craftsman_character.Custom('PL_mu_jej')] się najlepiej."
 carnival.1009.a: "Wezmę to sobie do serca i podwoję wysiłki."
 carnival.1009.b: "Wyślę strażników, żeby uczynili z tego prostaka przykład dla innych."
 carnival.1009.c: "– W takim razie może ty się tym zajmij, skoro tak umiesz doradzać!"
 carnival.1009.d: "Muszę ujawnić, kim jestem, i obiecać, że postaram się bardziej dla dobra miasta."
 carnival.1009.e: "To pierwsza szczera pochwała, która dotarła do mnie od miesięcy."
 carnival.1009.f: "I wszystko jasne! Nie muszę się martwić interesami w mieście."
 carnival.1009.g: "Można się było tego spodziewać. Nakażę wznieść posąg na moją cześć."
 carnival.1009.h: "Spraw, aby [craftsman_character.Custom('CraftsmanDescOption')|l] powiedział to, co myśli"
 carnival.1009.i: "– Ukryte siły próbują osłabić naszą republikę, przyjacielu."
 carnival.1009.j: "– Zasługuję chyba na nagrodę za moją ciężką pracę?"
 carnival.1009.k: "– Cała republika może przypisać sobie zasługi za nasze sukcesy!"
 carnival.1009.l: "Potakuję i kontynuuję popijanie mojego trunku."
 carnival.1009.m: "Nie jestem tu po to, żeby plotkować, tylko żeby walczyć!"
 carnival.1009.n: "– Naucz mnie czegoś o swoim rzemiośle, dobry człowieku."
 carnival.1009.o: "Zatrudnij mistrza przez pośrednika."
 carnival.1009.p: "– Ja stawiam, przyjacielu."
 custom.carnival.1009.spreading_ill_rumors: "Każdy [courtier|El] o innej [Concept('culture', 'kulturze')|E] lub [Concept('faith', 'wierze')|E]"
 custom.carnival.1009.shared_praise: "Każdy [courtier|El]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUINameNotMe] zyskuje [Concept('inspiration', 'inspirację')|E] #V rzemieślniczą#!"
 carnival.1009.drunk.tt.toast: "Oddajesz się piciu"
 carnival.1009.tasty.tt.toast: "Mmm… przepyszne!"
 carnival.1009.skillup.tt.toast: "Mistrz rzemiosła czegoś cię nauczył"
 carnival.1009.patron.tt.toast: "Zyskujesz partnera"
 carnival.1009.councilor.log_title: "Nowy radny"
 carnival.1009.councilor.log: "Osoba znana jako [craftsman_character.GetShortUINameNotMe] została mianowana na [Concept('councillor', 'radnego')|E]"
 carnival.1009.recruiting.log_title: "Zwerbowano mistrza rzemiosła, którym jest [craftsman_character.Custom('CraftsmanDescOption')|l]"
 carnival.1009.recruiting.log: "[carnival_main.GetFirstNameNoTooltip] werbuje osobę znaną jako [craftsman_character.GetShortUINameNotMe]"
 carnival.1009.learning_trade.log_title: "Przyjęto naukę od mistrza rzemiosła"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip] poszerza nieco swoją wiedzę, ucząc się od mistrza rzemiosła, którym jest [craftsman_character.Custom('CraftsmanDescOption')|l]"
