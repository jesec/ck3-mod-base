 trade_category_non_construction: "Towary inne niż budowlane"
 trade_category_non_construction_desc: "Każdy towar handlowy z wyjątkiem materiałów budowlanych. Nie obejmuje drewna, konopi ani kamienia."
 trade_category_non_food: "Towary inne niż spożywcze"
 trade_category_non_food_desc: "Każdy towar handlowy z wyjątkiem podstawowej żywności. Nie obejmuje ziarna, prosa, ryżu, owoców, mięsa, ryb ani sera."
 trade_category_non_medicinal: "Towary inne niż lecznicze"
 trade_category_non_medicinal_desc: "Każdy towar handlowy z wyjątkiem medykamentów."
 trade_category_non_luxury: "Towary inne niż luksusowe"
 trade_category_non_luxury_desc: "Każdy towar handlowy z wyjątkiem towarów luksusowych i przysmaków, a są to między innymi jedwab, przyprawy, biżuteria, ser, owoce, oliwa, miód i herbata."
 trade_category_food: "Żywność podstawowa"
 trade_category_food_desc: "Podstawowe artykuły żywnościowe, które zapewniają utrzymanie każdej populacji, w tym zboże, proso, ryż, owoce, mięso, ryby i ser. Stały dostęp do tych artykułów to pierwszy warunek istnienia każdej osady, armii i gospodarstwa domowego."
 trade_category_beasts_of_burden: "Zwierzęta juczne"
 trade_category_beasts_of_burden_desc: "Żywy inwentarz niezbędny w rolnictwie i transporcie, w tym konie i bydło. To dzięki tym zwierzętom funkcjonują gospodarstwa, możliwy jest transport towarów i utrzymanie wiejskiej gospodarki każdego państwa."
 trade_category_minerals: "Minerały"
 trade_category_minerals_desc: "Towary wydobywane z ziemi w kopalniach i kamieniołomach, w tym metale, kamienie szlachetne, sól i ałun. To one służą do zaopatrywania kuźni, mennic i warsztatów rzemieślniczych, na których polega cały przemysł."
 trade_category_luxury: "Luksusowe"
 trade_category_luxury_desc: "Rzadkie i kosztowne towary pożądane przez zamożne i wpływowe osoby, od jedwabiu i przypraw po kość słoniową i biżuterię. Dają posiadaczowi poczucie prestiżu i wyrafinowania, a stać na nie tylko najzamożniejsze dwory."
 trade_category_refined_goods: "Towary przetworzone"
 trade_category_alcohol: "Alkohol"
 trade_category_alcohol_desc: "Piwo i wino to coś więcej niż zwykłe przyjemności. Służą jako bezpieczna alternatywa zanieczyszczonej wody, sakramenty święte i społeczne artykuły pierwszej potrzeby w karczmach i na dworach."
 trade_category_liqour_raw_materials: "Destylaty"
 trade_category_precious_metals: "Metale szlachetne"
 trade_category_precious_metals_desc: "Srebro i złoto, fundament mennic i skarbców. Poza pełnieniem funkcji monetarnej, metale szlachetne są kluczowym elementem doskonałego rzemiosła oraz oznaką statusu."
 trade_category_jewelry_materials: "Kamienie szlachetne"
 trade_category_jewelry_materials_desc: "Rzadkie i egzotyczne surowce cenione za swoje piękno – klejnoty, bursztyn, kość słoniowa i jadeit. Osiągają wysokie ceny i są niezbędne w luksusowym rzemiośle oraz do wykonywania ozdób religijnych."
 trade_category_crops: "Rośliny uprawne"
 trade_category_crops_desc: "Rośliny uprawiane na polach, w tym zboża, trzcina cukrowa, bawełna i len. Rosną na działkach uprawnych i są sztucznie nawadniane. Stanowią naturalne bogactwo, na którym opierają się społeczności rolnicze."
 trade_category_base_metals: "Metale nieszlachetne"
 trade_category_base_metals_desc: "Żelazo i miedź, metale stosowane w przemyśle i wojskowości. Z żelaza powstają broń, narzędzia i zbroje, a miedź wykorzystuje się w stopach metali i do wytwarzania codziennych wyrobów metalowych."
 trade_category_cereals: "Zboża"
 trade_category_cereals_desc: "Podstawowe rośliny uprawne, w tym pszenica, proso i ryż. Stanowią fundament diety i należą do najczęściej sprzedawanych towarów, niezbędnych do wyżywienia miast i armii."
 trade_category_meat: "Mięsa"
 trade_category_meat_desc: "Mięso konserwowane, wędliny i ryby. Te bogate w białko zapasy żywności zapewniają pożywienie domostwom, garnizonom i podczas długich podróży bez możliwości świeżego zaopatrzenia."
 trade_category_comforts: "Udogodnienia"
 trade_category_comforts_desc: "Codzienne towary spożywcze niebędące podstawowym pożywieniem, w tym ser, owoce, oliwa, miód i herbata. Takie udogodnienia podnoszą jakość życia i cieszą się stałym popytem we wszystkich osiadłych społecznościach."
 trade_category_clothes: "Odzież"
 trade_category_clothes_desc: "Gotowe stroje oraz materiały odzieżowe, w tym tkaniny, futra i skóry. Od prostego ubioru roboczego po wykwintne szaty, ponieważ odzienie jest podstawową potrzebą każdego obywatela państwa."
 trade_category_luxury_consumption: "Luksusowe towary spożywcze"
 trade_category_luxury_consumption_desc: "Kosztowne i pożądane towary sprowadzane z odległych krain, w tym cukier i przyprawy korzenne. Wzbogacają smak potraw, znajdują zastosowanie w medycynie, a stać na nie tylko nieliczne uprzywilejowane osoby."
 trade_category_luxury_items: "Przedmioty luksusowe"
 trade_category_luxury_items_desc: "Wytworne przedmioty świadczące o statusie i kulturze, w tym ceramika, szkło, biżuteria, wyroby z laki i jedwab. To one wyróżniają zamożny i wyrafinowany dwór."
 trade_category_construction_materials: "Materiały budowlane"
 trade_category_mandala_arms: "Prymitywna broń"
 trade_category_mandala_arms_desc: "Proste materiały używane do uzbrojenia wojska, głównie miedź i drewno. Powstają z nich włócznie, tarcze i podstawowy oręż wojenny w państwach, w których kuźnie nie mają możliwości wytworzenia bardziej zaawansowanej broni."
 trade_category_carpentry_supplies: "Towary stolarskie"
 trade_category_carpentry_supplies_desc: "Drewno i konopie siewne, surowce niezbędne w budownictwie i żeglarstwie. Z drewna powstają konstrukcje budowli i statków, z konopi zaś tworzy się liny i takielunki niezbędne w handlu morskim."
 trade_category_rural_goods: "Towary wiejskie"
 trade_category_rural_goods_desc: "Naturalne bogactwo wsi obejmujące uprawy, zwierzęta hodowlane, drewno oraz cenne rudy pozyskane z ziemi. Te surowce napływają ze wsi do miasteczek i miast, gdzie poddaje się je obróbce."
 trade_category_agricultural_goods: "Towary rolne"
 trade_category_agricultural_goods_desc: "Wszelkiego rodzaju płody rolne z pól i gospodarstw, od zbóż i włókien po wino, miód i zwierzęta hodowlane. Te towary odzwierciedlają szeroki zakres produkcji osiadłej gospodarki rolnej."
 trade_category_bast_fibres: "Włókna łykowe"
 trade_category_fabrics: "Tkaniny"
 trade_category_fabrics_desc: "Surowe włókna tekstylne, w tym wełna, bawełna i len. To towary pośrednie między surowcami rolnymi a gotową tkaniną, dzięki którym w chatach tkackich w całym państwie jest co tkać na krosnach."
 trade_category_guild_goods: "Towary gildii"
 trade_category_guild_goods_desc: "Wyroby przetworzone i kunsztownie wykonane w warsztatach miejskich gildii, takie jak piwo, tkaniny, szkło i biżuteria. To efekty pracy wykwalifikowanych rzemieślników."
 trade_category_cheap_common: "Towary powszechne"
 trade_category_cheap_common_desc: "Niedrogie i powszechnie dostępne towary, spotykane niemal na każdym rynku, od zboża i ryb po drewno i kamień. Ich niska wartość i powszechność sprawiają, że stanowią codzienną podstawę lokalnego handlu."
 trade_category_fine_goods: "Towary luksusowe"
 trade_category_fine_goods_desc: "Wysokiej jakości towary, którymi handluje się na wielkich targowiskach świata. Są walutą zamożności, statusu i cywilizowanego życia."
 trade_category_staple_goods: "Towary podstawowe"
 trade_category_staple_goods_desc: "Towary masowe, które zapewniają utrzymanie miastom i armiom. W każdym bardziej zaludnionym miejscu napływ tych towarów powinien być nieprzerwany."
 trade_category_stone: "Kamień"
 trade_category_stone_desc: "Kamień budowlany wydobywany w kamieniołomach, przeznaczony do budowy fortyfikacji, kościołów i infrastruktury obywatelskiej. Tam, gdzie brakuje lokalnych złóż, trzeba go sprowadzać przy okazji każdego poważniejszego projektu budowlanego."
 trade_category_salt: "Sól"
 trade_category_salt_desc: "Niezbędny minerał konserwujący i podstawowy składnik diety. Sól umożliwia konserwację mięsa i ryb oraz garbowanie skór, a od czasów starożytnych pobudza handel dalekosiężny."
 trade_category_alum: "Ałun"
 trade_category_alum_desc: "Wszechstronna sól mineralna, stosowana przede wszystkim jako zaprawa barwierska utrwalająca barwniki na tekstyliach. Wykorzystywana również w garbarstwie i medycynie. Ze względu na ograniczoną dostępność stanowi towar o znaczeniu strategicznym."
 trade_category_dyes: "Barwniki"
 trade_category_dyes_desc: "Jaskrawe barwniki pozyskiwane z roślin, minerałów i owadów. Znajdują zastosowanie w wielu rzemiosłach: utrwalają kolor na tkaninach, służą do szkliwienia ceramiki oraz do iluminowania rękopisów barwnymi atramentami."
 trade_category_books: "Książki"
 trade_category_books_desc: "Rękopisy oraz papier lub pergamin, na którym je spisywano. Księgi odgrywają kluczową rolę w edukacji, administracji i przekazywaniu wiedzy, a popyt na nie pojawia się wszędzie tam, gdzie szerzy się umiejętność czytania i pisania."
 trade_category_incense: "Kadzidła"
 trade_category_incense_desc: "Aromatyczne żywice i mieszanki spalane podczas ceremonii religijnych na całym świecie. Stały dostęp do kadzideł jest kluczowy dla kościołów, świątyń i kapliczek w każdej pobożnej społeczności."
 trade_category_medicaments: "Medykamenty"
 trade_category_medicaments_desc: "Leki, zioła i preparaty medyczne stosowane przez lekarzy i uzdrowicieli. Dostęp do medykamentów ogranicza konsekwencje chorób i urazów, co ma kluczowe znaczenie dla każdej rozwijającej się osady."
 trade_good_wood: "Drewno"
 trade_good_wood_desc: "Drewno to podstawowy materiał budowlany wykorzystywany do wznoszenia domów, budowy statków i produkcji mebli. Dobrej jakości twarde drewno nie zawsze jest dostępne lokalnie i czasem trzeba je sprowadzać z regionów zalesionych."
 trade_good_stone: "Kamień"
 trade_good_stone_desc: "Kamień budowlany wydobywany ze złóż wapienia, piaskowca lub marmuru jest niezbędny w trakcie poważnych prac budowlanych. Jego transport jest trudny i kosztowny, często znajduje się z dala od naturalnych wychodni skalnych."
 trade_good_wool: "Wełna"
 trade_good_wool_desc: "Pozyskiwana dzięki strzyżeniu owiec, oczyszczona wełna to najważniejsze włókno tekstylne średniowiecznej Europy. Powstaje z niej przędza, z której wyplata się tkaninę, dostarczając surowca dla ogromnego przemysłu tkackiego."
 trade_good_cotton: "Bawełna"
 trade_good_cotton_desc: "Bawełnę uprawia się w ciepłych regionach od Indii po Egipt. Powstaje z niej lżejsze i bardziej przewiewne włókno niż z wełny. Przędzona i tkana stanowi podstawę znacznej części handlu tekstyliami w świecie islamu i poza nim."
 trade_good_leather: "Skóra"
 trade_good_leather_desc: "Garbowane skóry zwierzęce przetworzone w trwały i nadający się do obróbki materiał. Skóra służy do wyrobu butów, pasów, siodeł, zbroi i opraw książkowych, co czyni ją podstawowym surowcem rzemieślniczym w każdej kulturze."
 trade_good_flax: "Len"
 trade_good_flax_desc: "Len, uprawiany zarówno ze względu na włókna, jak i olej, który można uzyskać z jego nasion, jest jedną z najstarszych roślin uprawianych przez człowieka. Chociaż jego zbiór może być pracochłonny, len nie jest tak wymagający jak inne rośliny włókniste i można go uprawiać niemal wszędzie."
 trade_good_hemp: "Juta"
 trade_good_hemp_desc: "Wszechstronna roślina uprawiana ze względu na mocne włókna, z których plecie się liny, tka płótna żaglowe lub które wykorzystuje do uszczelniania. Juta jest rośliną niezbędną w każdej gospodarce morskiej oraz budownictwie na całym świecie."
 trade_good_salt: "Sól"
 trade_good_salt_desc: "Sól pozyskiwana z mis do parowania wody morskiej, kopalń soli kamiennej lub słonych źródeł jest niezbędnym konserwantem i podstawowym minerałem w diecie. Dzięki swojej zdolności zapobiegania psuciu się żywności stała się jednym z najczęściej poszukiwanych towarów w historii."
 trade_good_grain: "Ziarna"
 trade_good_grain_desc: "Zboże mielone na mąkę do wypieku chleba lub gotowania owsianki jest najważniejszą uprawą w średniowiecznym świecie. Od pszenicy na zachodzie po żyto na północy ziarna służą za pożywienie zarówno chłopom, jak i szlachcie."
 trade_good_fruit: "Owoce"
 trade_good_fruit_desc: "Świeże i suszone owoce wnoszą słodycz i urozmaicenie do średniowiecznej diety. Owoce z sadów, takie jak jabłka, gruszki i figi są sprowadzane z cieplejszych regionów, aby zaspokoić popyt na północy."
 trade_good_meat: "Wędliny"
 trade_good_meat_desc: "Solone, wędzone lub suszone wędliny nie psują się. Stanowią one niezbędne źródło białka i zapewniają wyżywienie armiom podczas kampanii oraz rodzinom w okresie zimy."
 trade_good_fish: "Ryby"
 trade_good_fish_desc: "Suszona, solona lub wędzona ryba może być transportowana na dalekie dystanse bez ryzyka zepsucia się, co czyni ją ważnym źródłem białka, gdy jest się daleko od wybrzeży i rzek. Szczególną rolę w napędzaniu dalekosiężnego handlu morskiego odegrały śledzie i dorsze."
 trade_good_cattle: "Bydło"
 trade_good_cattle_desc: "Bydło zapewnia siłę pociągową do orki, a dodatkowo mleko, mięso i skóry. To najbardziej wszechstronne zwierzęta hodowlane, a dostęp do dobrego bydła rozpłodowego usprawnia każdą gospodarkę rolną."
 trade_good_horses: "Konie"
 trade_good_horses_desc: "Konie to podstawowe zwierzęta pociągowe i jeździeckie średniowiecznego świata, niezbędne w rolnictwie, transporcie i wojskowości. Szczególnie cenione są szlachetne rasy ze stepów i Półwyspu Iberyjskiego."
 trade_good_cheese: "Ser"
 trade_good_cheese_desc: "Konserwowany produkt mleczny powstający poprzez zsiadanie się i dojrzewanie mleka. Ser zachowuje przydatność do spożycia znacznie dłużej niż świeże mleko i stanowi niezawodne źródło tłuszczu oraz białka niezależnie od pory roku."
 trade_good_beer: "Piwo"
 trade_good_beer_desc: "Warzone ze sfermentowanego zboża piwo jest napojem codziennym w północnej Europie. Ma niską zawartość alkoholu, ale za to jest pożywne. W wielu miasteczkach picie piwa jest bezpieczniejsze niż picie wody i raczy się nim każda warstwa społeczna."
 trade_good_wine: "Wino"
 trade_good_wine_desc: "Wytwarzane z fermentowanych winogron wino zajmuje uprzywilejowane miejsce w kulturze średniowiecznej jako trunek Kościoła, szlachectwa i ludzi zamożnych. Jest przedmiotem ożywionego handlu, prowadzonego z winnic w rejonie śródziemnomorskim i w dolinie Renu."
 trade_good_oil: "Oliwa"
 trade_good_oil_desc: "Tłoczona z oliwek oliwa w świecie śródziemnomorskim jest wykorzystywana w kuchni, służy jako paliwo do lamp i baza do mydła. Im dalej na północ, tym mniejsze ma znaczenie, ustępując miejsca tłuszczom zwierzęcym i masłu."
 trade_good_honey: "Miód"
 trade_good_honey_desc: "Miód to podstawowy słodzik średniowiecznego świata. Wykorzystywany również do wyrobu miodu pitnego, w medycynie oraz do konserwowania żywności. Pszczoły hoduje się na całym świecie, ale za miód najwyższej jakości trzeba słono zapłacić."
 trade_good_rice: "Ryż"
 trade_good_rice_desc: "Dominujące zboże Azji Południowej i Wschodniej. Ryż wymaga zalanych pól i ciepłego klimatu, ale jego plony są obfite. Stanowi podstawę w diecie ogromnych populacji."
 trade_good_millet: "Proso"
 trade_good_millet_desc: "Odporne na warunki zboże, które rośnie na słabej jakości glebach i w suchym klimacie, gdzie inne zboża zawodzą. Proso jest podstawowym pożywieniem w znacznej części Afryki, Azji Środkowej oraz suchszych regionach Indii."
 trade_good_iron: "Żelazo"
 trade_good_iron_desc: "Wszechstronny metal średniowiecznego świata. Żelazo wytapiane z rudy służy do wyrobu narzędzi, broni, podków i gwoździ. Żadna osada nie może się rozwijać bez jego stałego zaopatrzenia dla swoich rzemieślników i żołnierzy."
 trade_good_alum: "Ałun"
 trade_good_alum_desc: "Ałun to rzadka sól o właściwościach hamujących krwawienie, stosowana w wykańczaniu szkła czy garbowaniu skóry. Głównie wykorzystuje się go jako zaprawę, która zarówno wybiela, jak i sprawia, że barwniki lepiej przylegają do tkanin.\n\nAłun występuje w postaci naturalnej w ciepłych regionach, takich jak Bliski Wschód, ale można go również pozyskiwać z kamienia ałunowego w innych częściach świata."
 trade_good_jade: "Jadeit"
 trade_good_jade_desc: "Twardy, piękny kamień o wielkim znaczeniu kulturowym w Azji Wschodniej. Z jadeitu powstają narzędzia, ozdoby i przedmioty rytualne. Na dworach chińskich osiąga ogromne ceny i jest symbolem cnoty oraz rangi społecznej."
 trade_good_gold: "Złoto"
 trade_good_gold_desc: "Złoto, najcenniejszy z metali, stanowi podstawę królewskich skarbców i monet o najwyższej wartości. Jego rzadkość i blask sprawiają, że jest ulubionym materiałem do wyrobu koron, relikwiarzy i eksponatów."
 trade_good_silver: "Srebro"
 trade_good_silver_desc: "Srebro to najpowszechniejszy kruszec używany do bicia monet, które krążą w obiegu na całym znanym świecie. Jest nie tylko walutą, ale też służy do wytwarzania biżuterii, zastawy stołowej oraz przepięknych przedmiotów religijnych."
 trade_good_amber: "Bursztyn"
 trade_good_amber_desc: "Skamieniała żywica, występująca głównie na wybrzeżach Bałtyku. Handel bursztynem ma miejsce od czasów starożytnych. Jego ciepła, złocista barwa oraz łatwość obróbki sprawiają, że jest chętnie wykorzystywany do wyrobu koralików, wisiorków i przedmiotów dekoracyjnych."
 trade_good_copper: "Miedź"
 trade_good_copper_desc: "Miękki i łatwy w obróbce metal, wykorzystywany do wyrobu naczyń kuchennych, dzwonów kościelnych i wytwarzania stopów takich jak brąz i mosiądz. Dzięki swojej ciepłej barwie cieszy się popularnością w zdobniczej obróbce metalu."
 trade_good_gems: "Klejnoty"
 trade_good_gems_desc: "Kamienie szlachetne takie jak rubiny, szafiry i szmaragdy należą do najcenniejszych towarów na każdym szlaku handlowym. Szlifowane i polerowane zdobią korony, relikwiarze i biżuterię wpływowych postaci."
 trade_good_silk: "Jedwab"
 trade_good_silk_desc: "Najszlachetniejsze ze wszystkich włókien tekstylnych. Jedwab przędzie się z kokonów jedwabników, a następnie wyplata się z niego niezwykle miękką i błyszczącą tkaninę. Pochodzi z Chin i jest jednym z najcenniejszych towarów handlowych na świecie."
 trade_good_textiles: "Tekstylia"
 trade_good_textiles_desc: "Tkanina wykonana z wełny, bawełny, lnu lub włókien mieszanych. Luksusowe tekstylia należą do najczęściej sprzedawanych towarów średniowiecznego świata, a słynne tkalnie działały we Flandrii, Włoszech i na Bliskim Wschodzie."
 trade_good_furs: "Futra"
 trade_good_furs_desc: "Skóry lisów, gronostajów, soboli, bobrów i innych zwierząt, na które polowano w północnych lasach. Futrzane części garderoby są oznaką bogactwa i rangi, a popyt ze strony dworów szlacheckich sprzyja dochodowemu handlowi."
 trade_good_books_paper: "Książki i papier"
 trade_good_books_paper_desc: "Odręcznie spisane manuskrypty oraz pergamin lub papier, na którym je utrwalono. W księgach zapisywane są kodeksy prawne, teksty religijne i zgromadzona wiedza, a popyt na nie pojawia się wszędzie tam, gdzie rozwija się administracja i nauka."
 trade_good_spices: "Przyprawy"
 trade_good_spices_desc: "Pieprz, cynamon, goździki, gałka muszkatołowa i inne aromatyczne przyprawy z Azji Południowej i Południowo-Wschodniej należą do najcenniejszych towarów na świecie. Konserwują żywność, nadają jej smak i są oznaką bogactwa."
 trade_good_tea: "Herbata"
 trade_good_tea_desc: "Trunek przygotowywany z suszonych i poddanych obróbce liści krzewu herbacianego definiuje kulturę Dalekiego Wschodu. Herbata rozprzestrzeniała się na zachód wzdłuż Jedwabnego Szlaku, zyskując z czasem znaczenie jako samodzielny towar handlowy."
 trade_good_dyes: "Barwniki"
 trade_good_dyes_desc: "Pigmenty pozyskiwane z roślin takich jak urzet barwierski i marzanna barwierska, owadów takich jak czerwce, oraz z minerałów. Nadają tkaninom, ceramice i iluminowanym rękopisom jaskrawe barwy i są niezbędne w przemysłach, które od nich zależą."
 trade_good_jewelry: "Biżuteria"
 trade_good_jewelry_desc: "Gotowe wyroby łączące metale szlachetne z kamieniami szlachetnymi, emalią lub szkłem. Biżuteria to najbardziej widoczny przejaw osobistego bogactwa w średniowiecznym świecie. Wymieniano się nią w ramach darów i upominków dyplomatycznych."
 trade_good_ivory: "Kość słoniowa"
 trade_good_ivory_desc: "Kość słoniową rzeźbi się z kłów słoni. Jest to materiał, który ma świadczyć o prestiżu i pobożności. Wykorzystywana do wytwarzania rzeźb ozdobnych, figur szachowych, relikwiarzy z płaskorzeźbami oraz najwykwintniejszych przedmiotów dekoracyjnych."
 trade_good_glass: "Szkło"
 trade_good_glass_desc: "Dmuchane i formowane naczynia szklane, szyby okienne oraz przedmioty dekoracyjne. Luksusowe wyroby ze szkła z Wenecji i świata islamu osiągają wysokie ceny, podczas gdy prostsze szkło znajduje coraz szersze zastosowanie w kościołach i zamożnych domach."
 trade_good_sugar: "Cukier"
 trade_good_sugar_desc: "Cukier otrzymywany z trzciny cukrowej uprawianej w ciepłych regionach południowych jest rzadkim i kosztownym luksusem. Używa się go jako słodzika, leku, a także w kuchni jako składnika podkreślającego status ludzi zamożnych."
 trade_good_incense: "Kadzidła"
 trade_good_incense_desc: "Aromatyczne żywice, takie jak kadzidło i mirra, spalane podczas obrzędów religijnych niemal każdej wiary. Produkcja kadzideł wymaga ciepłego klimatu i specyficznych gatunków drzew, a eksportuje się je z Arabii, Etiopii i Indii."
 trade_good_ceramics: "Wyroby ceramiczne"
 trade_good_ceramics_desc: "Wykwintna ceramika i porcelana wytwarzana z zachowaniem najwyższych standardów rzemiosła i sztuki. Ceramika najwyższej jakości z Chin i świata islamu to pożądane towary luksusowe i przedmioty dekoracyjne."
 trade_good_lacquerware: "Wyroby z laki"
 trade_good_lacquerware_desc: "Przedmioty pokryte wieloma warstwami żywicy lakowej, cenione w Azji Wschodniej za trwałość i efekt lśniącego wykończenia. Lakierowane skrzynie, tace i meble to luksusowe towary eksportowe, które są eksportowane na dalekie dystanse szlakami jedwabnymi."
 trade_good_medicaments: "Medykamenty"
 trade_good_medicaments_desc: "Szeroki wybór suszonych ziół, związków mineralnych i przetworzonych leków wykorzystywanych przez lekarzy i aptekarzy. Dostęp do medykamentów ma kluczowe znaczenie w leczeniu ran, zwalczaniu chorób oraz utrzymaniu zdrowia populacji."
