 msg_market_toll_changed.t: "Zmieniono opłatę rynkową"
 msg_market_toll_changed.desc: "[market_owner.GetShortUINameNotMe] zmienia [Concept('market_toll', 'opłatę rynkową')|E] na rynku o nazwie [trade_market.GetName]: stawka była [old_toll_level.GetName|l] ([old_toll_level.GetRouteOwnerTollRate|%0]), a jest [new_toll_level.GetName|l] ([new_toll_level.GetRouteOwnerTollRate|%0])"
 msg_toll_exception_changed.t: "Zmieniono zwolnienie z opłaty"
 msg_toll_exception_changed.desc: "[market_owner.GetShortUINameNotMe] zmienia twoje zwolnienie z [Concept('market_toll', 'opłaty rynkowej')|E] na rynku o nazwie [trade_market.GetName]: stawka była [old_toll_level.GetName|l] ([old_toll_level.GetRouteOwnerTollRate|%0]), a jest [new_toll_level.GetName|l] ([new_toll_level.GetRouteOwnerTollRate|%0])"
 msg_toll_exception_ended.t: "Zwolnienie z opłaty wygasło"
 msg_toll_exception_ended.desc: "Twoje zwolnienie z [Concept('market_toll', 'opłaty rynkowej')|E] ([old_toll_level.GetName|l] opłata – [old_toll_level.GetRouteOwnerTollRate|%0]) na rynku o nazwie [trade_market.GetName] wygasło. Od teraz twoja opłata jest [new_toll_level.GetName|l] ([new_toll_level.GetRouteOwnerTollRate|%0])"
