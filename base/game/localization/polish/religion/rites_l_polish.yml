 roman_rite: "Obrządek rzymski"
 roman_rite_adj: "Rzymska"
 roman_rite_adherent: "chrześcijanin rzymski"
 roman_rite_adherent_plural: "chrześcijanie rzymscy"
 roman_rite_desc: "Obrządek rzymski to tradycja liturgiczna Kościoła rzymskiego, ukształtowana przez teologię łacińską, autorytet prawny oraz nacisk na dyscyplinę sakramentalną, hierarchię duchowną i jedność instytucjonalną."
 insular_celtic: "Obrządek iroszkocki"
 insular_celtic_adj: "Iroszkocka"
 insular_celtic_adherent: "iroszkot"
 insular_celtic_adherent_plural: "iroszkoci"
 insular_celtic_desc: "Prowincjonalny kościół, który oddalił się przed wiekami od rzymskokatolickiej ortodoksji, a z upływem czasu stracił wiele ze swych niegdyś odrębnych cech, ulegając wpływowi Kościoła rzymskiego. Wciąż jednak odróżnia się większym naciskiem na ideały życia monastycznego i pokuty, a także praktyką tradycyjnych celtyckich zwyczajów małżeńskich, obcych Kościołowi powszechnemu."
