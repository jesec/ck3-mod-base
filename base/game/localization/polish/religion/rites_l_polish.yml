 mozarabic_church: "Mozarabizm"
 mozarabic_church_adj: "Mozarabska"
 mozarabic_church_adherent: "mozarab"
 mozarabic_church_adherent_plural: "mozarabowie"
 mozarabic_church_desc: "Obrządek mozarabski, wywodzący się z wczesnych obrządków iberyjskich, zachował pewien stopień niezależności od Rzymu z powodu wielowiekowego panowania islamskiego. Długie współżycie z innymi wiarami sprawiło, że cechuje się on większą tolerancyjną dla różnic niż bardziej fundamentalistyczne sekty."
 ambrosian_rite: "Obrządek ambrozjański"
 ambrosian_rite_adj: "Ambrozjańska"
 ambrosian_rite_adherent: "chrześcijanin ambrozjański"
 ambrosian_rite_adherent_plural: "chrześcijanie ambrozjańscy"
 ambrosian_rite_desc: "Obrządek ambrozjański, właściwy archidiecezji mediolańskiej od czasów jej wielkiego biskupa św. Ambrożego, zachowuje własną liturgię i śpiew oraz tradycję teologiczną, w której ceni się myśl św. Augustyna z Hippony."
 beneventan_rite: "Obrządek benewentyński"
 beneventan_rite_adj: "benewentyńska"
 beneventan_rite_adherent: "chrześcijanin benewentyński"
 beneventan_rite_adherent_plural: "chrześcijanie benewentyńscy"
 beneventan_rite_desc: "Tradycja liturgiczna lombardzkiego południa, skupiona wokół Benewentu i wielkiego opactwa na Monte Cassino. Jej wyjątkowy śpiew i zwyczaje wyróżniają ją na tle praktyki rzymskiej, która spogląda na ten obrządek z rosnącą podejrzliwością."
 carolingian_christianity: "Chrześcijaństwo karolińskie"
 carolingian_christianity_adj: "Karolińska"
 carolingian_christianity_adherent: "chrześcijanin karoliński"
 carolingian_christianity_adherent_plural: "chrześcijanie karolińscy"
 carolingian_christianity_desc: "Forma chrześcijaństwa, która rozwinęła się za panowania dynastii Karolingów. Charakteryzuje się naciskiem na monastycyzm oraz działalność misyjną."
 byzantine_rite: "Obrządek grecki"
 byzantine_rite_adj: "Grecka"
 byzantine_rite_adherent: "chrześcijanin grecki"
 byzantine_rite_adherent_plural: "chrześcijanie greccy"
 byzantine_rite_desc: "Patriarchat Konstantynopola to jeden z najważniejszych ośrodków wschodniego chrześcijaństwa prawosławnego, znany ze swych bogatych tradycji teologicznych i historycznego znaczenia. Obrządek grecki wywodzi się bezpośrednio z tego patriarchatu."
 antiochian_rite: "Obrządek antiocheński"
 antiochian_rite_adj: "Antiocheńska"
 antiochian_rite_adherent: "chrześcijanin antiocheński"
 antiochian_rite_adherent_plural: "chrześcijanie antiocheńscy"
 antiochian_rite_desc: "Patriarchat Antiocheński to jedna z najstarszych wspólnot chrześcijańskich, założona przez świętych apostołów Piotra i Pawła. Jej zachodniosyryjska tradycja, zwana jakobicką od imienia Jakuba Baradeusza, który zreorganizował Kościół, podtrzymuje naukę miafizytyczną oraz starożytną liturgię św. Jakuba."
 slavic_rite: "Obrządek słowiański"
 slavic_rite_adj: "Słowiańska"
 slavic_rite_adherent: "chrześcijanin słowiański"
 slavic_rite_adherent_plural: "chrześcijanie słowiańscy"
 slavic_rite_desc: "Obrządek ten, zapoczątkowany wśród ludów słowiańskich przez Cyryla i Metodego, czerpie elementy liturgii bizantyjskiej, przystosowując je do słowiańskich języków i kultury przy użyciu głagolicy."
 georgian_rite: "Obrządek gruziński"
 georgian_rite_adj: "Gruzińska"
 georgian_rite_adherent: "wyznawca obrządku gruzińskiego"
 georgian_rite_adherent_plural: "wyznawcy obrządku gruzińskiego"
 georgian_rite_desc: "Obrządek gruziński reprezentuje tradycje chrześcijańskie Gruzji, charakteryzując się odrębną liturgią, spuścizną kościelną oraz silnymi związkami z teologią i praktyką prawosławną."
 coptic_rite: "Obrządek koptyjski"
 coptic_rite_adj: "Koptyjska"
 coptic_rite_adherent: "kopt"
 coptic_rite_adherent_plural: "koptowie"
 coptic_rite_desc: "Kościół koptyjski, którego początki sięgają czasów św. Marka Ewangelisty, słynie zarówno z tego, że jest kolebką chrześcijańskiego monastycyzmu, jak i z długiej tradycji propagowania edukacji i filozofii."
 ethiopian_rite: "Gyyz"
 ethiopian_rite_adj: "Gyyz"
 ethiopian_rite_adherent: "chrześcijanin gyyz"
 ethiopian_rite_adherent_plural: "chrześcijanie gyyz"
 ethiopian_rite_desc: "Mająca korzenie na wyżynach Etopii, wywodząca się z dziedzictwa Aksum, ta starożytna tradycja chrześcijańska odróżnia się od innych kościołów aleksandryjskich poprzez zachowanie szerszego kanonu pism świętych, silne tradycje monastyczne oraz przymierze ukształtowane dzięki królewskiemu dziedzictwu salomońskiemu."
 armenian_rite: "Obrządek apostolski"
 armenian_rite_adj: "Apostolska"
 armenian_rite_adherent: "wyznawca obrządku apostolskiego"
 armenian_rite_adherent_plural: "wyznawcy obrządku apostolskiego"
 armenian_rite_desc: "Założony przez apostołów Bartłomieja i Judę Tadeusza, Apostolski Kościół Ormiański w krótkim czasie zdobył rzesze wyznawców w regionie i uczynił Królestwo Armenii pierwszym państwem, które przyjęło chrześcijaństwo jako oficjalne wyznanie."
 apostolic_religious_head_title: "Katolikos"
 apostolic_religious_head_title_plural: "Katolikosi"
 apostolic_religious_head_title_name: "Kościół"
 # Nabi
 nabi: "Nabi"
 nabi_adj: "Nabicka"
 nabi_adherent: "nabita"
 nabi_adherent_plural: "nabici"
 nabi_desc: "Zgodnie z wyraźnym przesłaniem Koranu słowo Nabi oznacza proroka wybranego przez Wszechmogącego do niesienia Jego przesłania oraz przypomnienia ludziom o dniu, w którym zostaną przez Niego wezwani, aby odpowiedzieć za swoje czyny. Według głównych wierzeń ostatnim Nabi był prorok Mahomet."
 # Pre madhabs
 sahabah: "Sahaba"
 sahabah_adj: "Sahabicka"
 sahabah_adherent: "sahabita"
 sahabah_adherent_plural: "sahabici"
 sahabah_desc: "Byli to muzułmańscy wyznawcy, znani również jako towarzysze Mahometa, którzy spotkali lub widzieli proroka za jego życia. Towarzysze odegrali znaczącą rolę we wczesnych zmaganiach muzułmanów, budowie społeczeństwa, przekazywaniu hadisów oraz sprawowaniu rządów."
 tabiun: "Tabi’un"
 tabiun_adj: "Tabi’unicka"
 tabiun_adherent: "tabita"
 tabiun_adherent_plural: "tabici"
 tabiun_desc: "Opisuje się ich jako pokolenie muzułmanów, którzy podążali ścieżką towarzyszy proroka Mahometa (określanych mianem sahaba), a tym samym przyjmowali jego nauki z drugiej ręki, jeszcze przed powstaniem szkół sunnickich w późniejszych wiekach."
 # Sunni
 hanafi: "Hanafi"
 hanafi_adj: "Hanaficka"
 hanafi_adherent: "hanafita"
 hanafi_adherent_plural: "hanafici"
 hanafi_desc: "Obrządek powstał na podstawie nauk prawnika i teologa Abu Hanify, który usystematyzował wykorzystanie rozumowania. Hanafiicka teoria prawa czerpie reguły przede wszystkim z Koranu, sunny, konsensusu uczonych oraz rozumowania przez analogię."
 hanbali: "Hanbali"
 hanbali_adj: "Hanbalicka"
 hanbali_adherent: "hanbalita"
 hanbali_adherent_plural: "hanbalici"
 hanbali_desc: "Szkoła hanbalicka jest najmniejszą z czterech głównych szkół prawoznawstwa sunnickiego, opartą na naukach Ahmada ibn Hanbala. W przeciwieństwie do pozostałych szkół hanbalici sprzeciwiają się kodyfikowaniu prawa w kompleksowy system, kładąc największy nacisk na Koran i hadisy jako najwyższe źródła."
 maliki: "Maliki"
 maliki_adj: "Malikicka"
 maliki_adherent: "malikita"
 maliki_adherent_plural: "malikici"
 maliki_desc: "Jedna z czterech głównych sunnickich szkół prawoznawstwa muzułmańskiego. Została założona przez Malika ibn Anasa w VIII wieku. Szkoła malikicka odróżnia się od pozostałych sunnickich szkół prawa przede wszystkim źródłami wykorzystywanymi do tworzenia orzeczeń."
 shafii: "Szafi’i"
 shafii_adj: "Szafi’icka"
 shafii_adherent: "szafi’ita"
 shafii_adherent_plural: "szafi’ici"
 shafii_desc: "Nazwana na cześć Asz-Szafi’iego, żyjącego na początku IX wieku muzułmańskiego uczonego i prawnika zwanego ojcem prawoznawstwa muzułmańskiego. Główną myślą szafi’icką jest przekonanie, że każdy czyn wiernego podlegającego prawu ma swój odpowiednik w prawie objawionym lub szariacie."
 #Ismaili
 ismaili: "Ismailizm"
 ismaili_adj: "Ismailicka"
 ismaili_adherent: "ismailita"
 ismaili_adherent_plural: "ismailici"
 ismaili_desc: "Obrządek szyicki, który uznaje, że linia prawdziwych imamów – przesiąkniętych boską wiedzą i nieomylnością – wywodzi się od Isma’ila ibn Dżafara. Zwani są też siedmiowcami, ponieważ Ismail był siódmym imamem po Mahomecie."
 #Qarmatians
 qarmatian: "Karmatyzm"
 qarmatian_adj: "Karmacka"
 qarmatian_adherent: "karmata"
 qarmatian_adherent_plural: "karmaci"
 qarmatian_desc: "Odłam ismailizmu, który zapożyczył wiele elementów z zaratusztranizmu. Liczba imamów została ustalona przez Boga na siedem i dlatego nie może być więcej imamów, zanim siódmy – Muhammad ibn Isma’il – nie powróci, by poprowadzić wyznawców."
 #Nizari
 nizari: "Nizaryzm"
 nizari_adj: "Nizarycka"
 nizari_adherent: "nizaryta"
 nizari_adherent_plural: "nizaryci"
 nizari_desc: "Obrządek racjonalistyczny, który kładzie nacisk na rozumowanie interpretacji Koranu i hadisów. Bycie imamem jest dziedziczne w linii sukcecji wywodzącej się od Alego."
 #Zayidi
 zayidi: "Zajdyzm"
 zayidi_adj: "Zajdycka"
 zayidi_adherent: "zajdyta"
 zayidi_adherent_plural: "zajdyci"
 zayidi_desc: "Prawdziwy Imam nie jest nieomylny, o jego powołaniu świadczy walka z korupcją i złem. Zajdyci są zatem przekonani, że Zajd ibn Ali był prawowitym sukcesorem Imamatu, z powodu jego buntu przeciwko Umajjadom."
 #Imamism (Twelver)
 imami: "Imamizm"
 imami_adj: "Imamicka"
 imami_adherent: "imamita"
 imami_adherent_plural: "imamici"
 imami_desc: "Imamici wierzą, że według proroctw dwunastu imamów poprowadzi Ummę, a dwunasty Imam, Imam Zaman, czeka na powrót, by wprowadzić muzułmanów na Dzień Sądu."
 islam_ayatollah: "ajatollah"
 islam_ayatollah_plural: "ajatollahowie"
 ghulat: "Ichtilafizm"
 ghulat_adj: "Ichtilaficka"
 ghulat_adherent: "ichtilafita"
 ghulat_adherent_plural: "ichtilafici"
 ghulat_desc: "Ichtilafici wierzą w boską naturę nieomylnych Imamów, poczynając od Alego. Bóg nie tylko ich wyznaczył i zainspirował, ale częściowo zamieszkuje w nich, aby kierować ich czynami, a co za tym idzie, całą Ummą."
 alawite: "Alawizm"
 alawite_adj: "Alawicka"
 alawite_adherent: "alawita"
 alawite_adherent_plural: "alawici"
 alawite_desc: "Nauki religijne alawitów są tajemnicze, a Koran jest tylko jednym z ich świętych tekstów. Oprócz wiary w następstwo Imamów poprzez Alego, alawici wierzą również w reinkarnację i że wszystkie istoty były gwiazdami wyrzuconymi z nieba, które muszą teraz odzyskać swoje miejsce, prowadząc kolejne dobre i pobożne życia."
 #Alevis
 alevi: "Alewizm"
 alevi_adj: "Alewicka"
 alevi_adherent: "alewita"
 alevi_adherent_plural: "alewici"
 alevi_desc: "Alewici wierzą w sukcesję Dwunastu Imamów, ale również kierują się wieloma innymi tradycjami przedstawionymi w ich zbiorze świętych tekstów, Bujruku. W tradycji alewickiej Bóg jest Prawdą, a Mahomet i Ali są jego manifestacjami na świecie."
 alevi_house_of_worship: "cemewi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural: "cemewi"
 alevi_religious_text: "Bujruk"
 alevi_religious_text_2: "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3: "$alevi_religious_text$" # Optional translation alt
 #Ibadi (Muhakkima)
 ibadi: "Muhakkimska"
 ibadi_adj: "Muhakkimska"
 ibadi_adherent: "muhakkimita"
 ibadi_adherent_plural: "muhakkimici"
 ibadi_desc: "Obrządek muhakkimiski głosi, że wspólnota islamska nie potrzebuje kalifa ani imama, jeśli nie ma odpowiedniego kandydata. Odrzuca przekonanie, że następcy Alego oraz Abu Bakra są z natury godni przywództwa, kładąc nacisk na prawe postępowanie i zgodę wspólnoty."
 #Azariqa
 azariqa: "Azrakizm"
 azariqa_adj: "Azrakicka"
 azariqa_adherent: "azrakita"
 azariqa_adherent_plural: "azrakici"
 azariqa_desc: "Nie uznając żadnego godnego następcy Mahometa, azrakici uważają za swoje prawo i obowiązek walczyć z każdym przywódcą, który nie przestrzega wartości ich wiary. Rzeczywiście, najmniejsza różnica w interpretacji wiary, oznacza dla nich herezję."
 #Najdat
 najdat: "Nadżdyzm"
 najdat_adj: "Nadżdycka"
 najdat_adherent: "nadżdyta"
 najdat_adherent_plural: "nadżdyci"
 najdat_desc: "Nadżdyci to gałąź charydżyzmu, której zwolennicy mocno wierzą w ustanowienie muzułmańskiego przywództwa poprzez konsensus wiernych. Lider nie jest nieomylny, ale za pośrednictwem społeczności wybierany przez Boga."
 #Sufri
 sufri: "Sufryzm"
 sufri_adj: "Sufrycka"
 sufri_adherent: "sufryta"
 sufri_adherent_plural: "sufryci"
 sufri_desc: "Sufryci wierzą w boskie przewodnictwo i przywództwo poprzez interpretację słowa Bożego, a nie z racji dziedziczenia. Wola Boża staje się znana jako wyraz woli Ummy, o ile lud Ummy jest dobrze obeznany z Koranem."
 #Hafizi
 hafizi: "Hafizyzm"
 hafizi_adj: "Hafizycka"
 hafizi_adherent: "hafizyta"
 hafizi_adherent_plural: "hafizyci"
 hafizi_desc: "Hafizyci stawiają na pierwszym miejscu wspieranie tego, którego uważają za prawdziwego kalifa, a także przeciwstawiają się wszelkim próbom obalenia lub pozbawienia go władzy. W przypadku porażki cechuje ich bunt w słusznej sprawie, a w przypadku zwycięstwa – dumne podporządkowanie się woli swojego przywódcy."
