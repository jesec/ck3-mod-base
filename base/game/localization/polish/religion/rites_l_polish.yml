l_polish:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "[Rite.GetNameNoTooltip] – ten obrządek powstał w miejscu o nazwie [Character.GetCurrentLocation.GetTitle.GetName] za sprawą postaci znanej jako [Character.GetFullName], a miało to miejsce dnia [GetCurrentDate.GetStringLong]. Wiarą, z której wywodzi się ten obrządek, jest wiara [Faith.GetAdjective|l]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "[Rite.GetNameNoTooltip] – ten obrządek powstał za sprawą postaci znanej jako [Character.GetFullName], a miało to miejsce dnia [GetCurrentDate.GetStringLong]. Wiarą, z której wywodzi się ten obrządek, jest wiara [Faith.GetAdjective|l]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "W tym obrządku zostaje zachowany wyraźny nabożny charakter w ramach jego macierzystej wiary."
 generic_rite_focus_tenet_aniconism: "W tym obrządku odrzuca się święte wizerunki, dążąc do oddawania czci poprzez absencję, powściągliwość i świętość boskości bez wizerunku."
 generic_rite_focus_tenet_alexandrian_catechism: "W tym obrządku ceni się nauki oparte na wiedzy, subtelną doktrynę oraz cierpliwe nauczanie wiernych."
 generic_rite_focus_tenet_armed_pilgrimages: "W tym obrządku świętą wojnę i pielgrzymkę zbrojną traktuje się jako święte obowiązki wiernych."
 generic_rite_focus_tenet_carnal_exaltation: "W tym obrządku pożądanie i cielesna przyjemność są czczone i uznawane za dary sakralne."
 generic_rite_focus_tenet_communal_identity: "W tym obrządku ściśle łączy się kult ze zbiorowymi obyczajami, życiem wspólnotowym i strzeżoną tożsamością społeczności."
 generic_rite_focus_tenet_communion: "W tym obrządku wspólna pobożność, jałmużna oraz jedność spajają wiernych z ich duchowym zwierzchnikiem."
 generic_rite_focus_tenet_consolamentum: "W tym obrządku zmierza się ku ostatecznemu oczyszczeniu poprzez wyrzeczenia oraz przygotowanie się na śmierć bez strachu."
 generic_rite_focus_tenet_divine_marriage: "W tym obrządku sakralizuje się zarówno związek, jak i władzę, uznając święte małżeństwo za odzwierciedlenie boskiego porządku."
 generic_rite_focus_tenet_gnosticism: "W tym obrządku poszukuje się ukrytych za zasłoną świata prawd, powierzając zbawienie świętej wiedzy."
 generic_rite_focus_tenet_mendicant_preachers: "W tym obrządku wiarę szerzą wędrowni kaznodzieje, pokorne świadectwo i niestrudzone nauczanie."
 generic_rite_focus_tenet_pacifism: "W tym obrządku ceni się powściągliwość i pokój, uznając niepotrzebne przelewanie krwi za poważny upadek duszy."
 generic_rite_focus_tenet_pentarchy: "W tym obrządku ceni się dawne ośrodki władzy oraz uporządkowane zarządzanie szerszą wspólnotą wiary."
 generic_rite_focus_tenet_unrelenting_faith: "W tym obrządku wychwala się niezachwianą gorliwość, nieugiętą determinację oraz gotowość do walki o to, co święte."
 generic_rite_focus_tenet_vows_of_poverty: "W tym obrządku czci się święte ubóstwo, wzywając wiernych do odrzucenia bogactwa i namawiając do życia bez zbędnych rzeczy."
 generic_rite_focus_tenet_pastoral_isolation: "W tym obrządku bardziej ceni się strzeżoną wspólnotę wiernych, wybierając separację od rozległego świata zamiast kompromisu."
 generic_rite_focus_tenet_rite: "W tym obrządku kładzie się duży nacisk na liturgię, porządek duchowieństwa oraz zachowanie świętej tradycji."
 generic_rite_focus_tenet_adaptive: "W tym obrządku zmiany zachodzą bez wywoływania zniszczeń – lokalne zwyczaje są wchłaniane, podczas gdy święty rdzeń pozostaje nienaruszony."
 generic_rite_focus_tenet_esotericism: "W tym obrządku ceni się ukrytą mądrość, wtajemniczenie oraz prawdy ujawniane jedynie tym, którzy są przygotowani."
 generic_rite_focus_tenet_legalism: "W tym obrządku świętość jest zakorzeniona w przejrzystym prawie, właściwym osądzie i zdyscyplinowanym porządku życia."
 generic_rite_focus_tenet_literalism: "W tym obrządku ściśle przestrzega się świętych słów, ograniczając zaufanie wobec swobodnej interpretacji oraz odziedziczonych kompromisów."
 generic_rite_focus_tenet_reincarnation: "W tym obrządku wędrówkę duszy postrzega się jako cykliczną – każde życie kształtuje następne."
 generic_rite_focus_tenet_religious_legal_pronouncements: "W tym obrządku święte prawo i formalne zasady otacza się trwałym autorytetem duchowym."
 generic_rite_focus_tenet_struggle_submission: "W tym obrządku naucza się o tym, że dowodem wiary są zmaganie, podbój oraz podporządkowanie bezbożnych."
 generic_rite_focus_tenet_false_conversion_sanction: "W tym obrządku toleruje się pozorne uleganie normom i skrywanie się pod maską, gdy wymaga tego przetrwanie lub zdobycie korzyści."
 generic_rite_focus_tenet_tax_nonbelievers: "W tym obrządku niewiara staje się brzemieniem składanym jako trybut, a święta hierarchia umacniana jest przez doczesne należności."
 generic_rite_focus_tenet_asceticism: "W tym obrządku dąży się do świętości poprzez samowyrzeczenie, dyscyplinę oraz wytrwałe panowanie nad pożądaniem."
 generic_rite_focus_tenet_bhakti: "W tym obrządku uwagę skupia się na płynącej z głębi serca pobożności oraz naucza się o tym, że miłujące oddanie przybliża duszę do tego, co boskie."
 generic_rite_focus_tenet_dharmic_pacifism: "W tym obrządku ceni się nieszkodliwość i samokontrolę, uznając pokój za wartość wyższą niż gniew."
 generic_rite_focus_tenet_inner_journey: "W tym obrządku zwraca się ku wnętrzu, szukając przebudzenia poprzez refleksję, dyscyplinę i przemianę samego siebie."
 generic_rite_focus_tenet_ritual_hospitality: "W tym obrządku gościnność traktuje się jako święty obowiązek, który łączy gospodarza i gościa w ramach świętego zwyczaju."
 generic_rite_focus_tenet_adorcism: "W tym obrządku oddaje się duchom cześć i szacunek, licząc na ich przychylność i uniknięcie ich gniewu."
 generic_rite_focus_tenet_ancestor_worship: "W tym obrządku zwraca się ku czczonym zmarłym, szukając wskazówek, błogosławieństwa i nieprzerwanego istnienia wśród żyjących."
 generic_rite_focus_tenet_astrology: "W tym obrządku interpretuje się znaki niebios, ufając, że gwiazdy wskażą porządek, przeznaczenie i właściwy czas."
 generic_rite_focus_tenet_hedonistic: "W tym obrządku akceptuje się biesiadę, nadmiar i uświęcenie przyjemności w zbiorowym kulcie."
 generic_rite_focus_tenet_human_sacrifice: "W tym obrządku ofiarę z krwi traktuje się jako przerażający, ale święty układ między tym, co śmiertelne, a tym, co boskie."
 generic_rite_focus_tenet_mystical_birthright: "W tym obrządku uważa się, że w dniu narodzin niektóre dusze zostają naznaczone świętą mocą i duchową wielkością."
 generic_rite_focus_tenet_ritual_celebrations: "W tym obrządku wysławia się wspólne biesiady i świętowanie jako najpełniejszy wyraz czci."
 generic_rite_focus_tenet_sacred_childbirth: "W tym obrządku narodziny otacza się czcią, uznając macierzyństwo i nowe życie za akty mające święte znaczenie."
 generic_rite_focus_tenet_sanctity_of_nature: "W tym obrządku dostrzega się sakralność w świecie żywym, otaczając czcią rozwój, płodność i nieskrępowane tworzenie."
 generic_rite_focus_tenet_sun_worship: "W tym obrządku oddaje się cześć słońcu jako życiodajnemu symbolowi porządku, blasku i boskiej łaski."
 generic_rite_focus_tenet_warmonger: "W tym obrządku gloryfikuje się podbój i wojenną siłę, oczekując od wiernych, że udowodnią swoją wartość poprzez wojnę."
 generic_rite_focus_tenet_gruesome_festivals: "W tym obrządku akceptuje się przerażające biesiady, zamieniając strach, krew i widowisko w sakralną demonstrację."
 generic_rite_focus_tenet_cthonic_redoubts: "W tym obrządku czci się górskie szczyty i ukryte niedostępne miejsca jako przestrzenie szczególnej świętości."
 generic_rite_focus_tenet_household_gods: "W tym obrządku uwagę skupia się na domu, a ognisko domowe, więzi rodzinne i codzienna pobożność są objęte boską opieką."
 generic_rite_focus_tenet_sinitic_syncretism: "W tym obrządku tradycję splata się z myślą sinityczną, dążąc do harmonii, a nie rozłamu."
 generic_rite_focus_tenet_eastern_syncretism: "W tym obrządku ochoczo przyswaja się wschodnie nauki, odczytując obcą mądrość jako echo świętej prawdy."
 generic_rite_focus_tenet_unreformed_syncretism: "W tym obrządku bez przeszkód czerpie się z dawnych praktyk, włączając starożytne rytuały w nową, świętą jedność."
 generic_rite_focus_tenet_christian_syncretism: "W tym obrządku zamiast całkowicie odrzucać naukę chrześcijańską, interpretuje się ją na nowo w ramach własnych świętych fundamentów."
 generic_rite_focus_tenet_islamic_syncretism: "W tym obrządku czerpie się z wierzeń i zwyczajów islamu, odnajdując użyteczną prawdę w bliskim objawieniu."
 generic_rite_focus_tenet_jewish_syncretism: "W tym obrządku łączy się żydowską tradycję, prawo i pamięć z własnym rozumieniem tego, co święte."
 generic_rite_focus_tenet_exaltation_of_pain: "W tym obrządku ból uznaje się za oczyszczający, a oddanie objawia się poprzez wytrwałość i znoszenie cierpienia."
 generic_rite_focus_tenet_natural_primitivism: "W tym obrządku nie ufa się przepychowi cywilizacji, czci się natomiast surowszy i bardziej pierwotny sposób życia."
 generic_rite_focus_tenet_pursuit_of_power: "W tym obrządku błogosławi się ambicję i świeckie panowanie, uznając władzę za właściwe narzędzie tego, co święte."
 generic_rite_focus_tenet_ritual_cannibalism: "W tym obrządku spożywanie ludzkiego mięsa uznaje się za tabu kultu i świętą grozę."
 generic_rite_focus_tenet_sacred_shadows: "W tym obrządku używa się tajemnicy jako osłony, czyniąc świętym ukrywanie, zmierzch i to, czego większość nie widzi."
 generic_rite_focus_tenet_polyamory: "W tym obrządku błogosławi się wielość miłości, nie ograniczając świętej bliskości do jednej więzi."
 generic_rite_focus_tenet_sacrificial_ceremonies: "W tym obrządku uroczystą ofiarę stawia się w centrum kultu, łącząc ofiarność z przymierzem i przychylnością."
 generic_rite_focus_tenet_megaliths: "W tym obrządku sakralność objawia się w trwałym kamieniu, a pomniki mają służyć pielęgnowaniu pamięci i religijności."
 generic_rite_focus_tenet_fp3_fedayeen: "W tym obrządku uświęca się podstępność, szpiegostwo i ofiarną przemoc w imię wyższej sprawy."
 generic_rite_focus_tenet_communal_possessions: "W tym obrządku umniejsza się znaczenie prywatnego majątku, wzywając wiernych do posiadania wspólnych zasobów."
 generic_rite_focus_tenet_pure_land: "W tym obrządku nadzieję pokłada się w błogosławionej, pozbawionej cierpienia ziemi, do której prowadzą zaufanie, pamięć i oddanie."
 generic_rite_focus_tenet_no_mind: "W tym obrządku poszukuje się jasności wykraczającej poza zrozumienie myśli poprzez przestrzeganie dyscypliny, aby osiągnąć stan pustki i przejrzystej świadomości."
 generic_rite_focus_tenet_mountain_worship: "W tym obrządku w centrum uwagi są wysoko położone miejsca, które uznaje się za bliższe temu, co boskie, czyniąc szczyty i wysokie obiekty przedmiotami czci."
 generic_rite_focus_tenet_extinction_of_dharma: "W tym obrządku świat postrzega się jako ogarnięty zepsuciem, co uzasadnia bezwzględną przemoc w obronie prawdy."
 generic_rite_focus_tenet_cranial_trophies: "W tym obrządku szczątki wrogów traktuje się jako święty dowód zwycięstwa i budzący grozę prestiż."
 generic_rite_focus_tenet_pursuit_of_knowledge: "W tym obrządku wywyższa się naukę jako świętą pracę, poszukując prawdy poprzez studiowanie, debatę i zdyscyplinowaną ciekawość świata."
 generic_rite_focus_tenet_benevolent_governance: "W tym obrządku świętość mierzy się częściowo sprawiedliwym prawem, uporządkowanym zarządzaniem i dbaniem o państwo."
 generic_rite_focus_tenet_filial_piety: "W tym obrządku głosi się, że cześć wobec rodziców i starszyzny stanowią fundament porządku moralnego i sakralnego."
 generic_rite_focus_tenet_harmonious_society: "W tym obrządku ceni się równowagę, właściwe zachowanie i harmonię będące odzwierciedleniem kosmicznego porządku."
 generic_rite_focus_tenet_sacred_destruction: "W tym obrządku święte zniszczenie uważa się za oczyszczające, co czyni samo unicestwienie narzędziem sakralnej odnowy."
 generic_rite_focus_tenet_preservation: "W tym obrządku ceni się wytrwałość, ciągłość oraz staranną ochronę tego, co zostało powierzone."
 generic_rite_focus_tenet_takamin: "W tym obrządku niedźwiedź i pokrewne siły dzikiej natury otaczane są czcią, nabożnym podziwem i ostrożnym szacunkiem."
 generic_rite_focus_tenet_peace_of_god: "W tym obrządku ogranicza się przemoc, ustanawiając święte granice tego, kiedy przelanie krwi jest uzasadnione."
 generic_rite_focus_tenet_dulia: "W tym obrządku czci się świętych i święte wzorce, oddając cześć ich pamięci, ale nie utożsamia się ich z boskością."
 generic_rite_focus_tenet_transubstantiation: "W tym obrządku święte misteria traktuje się jako prawdziwie odmieniające, co czyni sakrament głównym elementem boskiej obecności."
 generic_rite_focus_tenet_ora_et_labora: "W tym obrządku łączy się modlitwę z wysiłkiem, ucząc, że zdyscyplinowana praca sama w sobie może stać się formą pobożności."
 generic_rite_focus_tenet_hyperdulia: "W tym obrządku otacza się szczególną czcią najświętszego orędownika ponad zwyczajne szeregi świętych."
 generic_rite_focus_tenet_simony: "W tym obrządku przyjmuje się, że święty urząd, patronat i doczesne bogactwo są ze sobą ściśle powiązane."
 generic_rite_focus_tenet_monophysitism: "W tym obrządku głosi się jedność natury Chrystusa, nie akceptując zbyt drastycznego podziału boskiej tajemnicy."
 generic_rite_focus_tenet_acts_of_apostles: "W tym obrządku wzorem do naśladowania jest apostolska wspólnota, miłość bliźniego i wspólne życie najstarszych wiernych."
 generic_rite_focus_tenet_purgatory: "W tym obrządku naucza się, że po śmierci dusze często muszą najpierw zaznać oczyszczenia, aby doświadczyć doskonałego błogostanu."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "W tym obrządku rodzinę, prokreację i dawanie początku nowemu życiu traktuje się jako święte obowiązki."
 generic_rite_focus_tenet_apostolic_succession: "W tym obrządku autorytet uzasadnia się nieprzerwanym łańcuchem przekazywania władzy sięgającym czasów apostołów."
 generic_rite_focus_tenet_confession: "W tym obrządku ceni się publiczną pokutę i rozgrzeszenie, ufając, że wyznany grzech staje się początkiem uzdrowienia."
 generic_rite_focus_tenet_original_sin: "W tym obrządku ludzka słabość jest postrzegana jako pierwotna, podkreślając, że żadna dusza nie przychodzi na świat nieskalana."
 generic_rite_focus_tenet_celestial_hierarchy: "W tym obrządku kosmos przedstawiany jest jako uporządkowany według świętej hierarchii, w której każda pozycja odzwierciedla boski zamysł."
 generic_rite_focus_tenet_miles_christi: "W tym obrządku wiernych przedstawia się jako żołnierzy świętości, którzy mają bronić prawdy ze zdyscyplinowaną gorliwością."
 generic_rite_focus_tenet_scholasticism: "W tym obrządku wiara jest pogłębiana poprzez argumentowanie, komentowanie i godzenie rozumu z wiarą."
 generic_rite_focus_tenet_adoptionism: "W tym obrządku podkreśla się wysławianie i boskie synostwo w sposób, który bagatelizuje wieczny podział."
 generic_rite_focus_tenet_love_thy_neighbour: "W tym obrządku miłosierdzie i dobrosąsiedzką miłość uznaje się za główne aspekty codziennego życia religijnego."
 generic_rite_focus_tenet_divine_liturgy: "W tym obrządku wysławia się uroczystą liturgię, traktując uporządkowany kult jako najczystsze okno na boskość."
 generic_rite_focus_tenet_miaphysitism: "W tym obrządku naucza się o nierozdzielnej jedności boskości i człowieczeństwa w tajemnicy Chrystusa."
 generic_rite_focus_tenet_hesychasm: "W tym obrządku dąży się do zjednoczenia poprzez ciszę, bezruch oraz wewnętrzne powtarzanie świętej modlitwy."
 generic_rite_focus_tenet_anachoresis: "W tym obrządku czci się wycofanie ze świata i szukanie świętości w samotności, trudzie oraz dystansie."
 generic_rite_focus_tenet_mortification_of_the_flesh: "W tym obrządku dąży się do świętości poprzez cielesne trudy, przygotowując ciało do osiągnięcia duchowego celu."
 generic_rite_focus_tenet_holy_myron: "W tym obrządku przywiązuje się szczególną wagę do świętego namaszczenia, traktując poświęcony olej jako pieczęć boskiej łaski."
 generic_rite_focus_tenet_khachkar: "W tym obrządku uświęca się rzeźbione kamienne krzyże i trwałe pomniki jako publiczne świadectwa sakralne."
 generic_tenet_focus_fallback: "W tym dogmacie zostaje zachowany wyraźny nabożny charakter w ramach jego macierzystej wiary."
 generic_tenet_focus_tenet_aniconism: "W obrządku o nazwie [GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )|l] odrzuca się święte wizerunki, dążąc do oddawania czci poprzez absencję, powściągliwość i świętość boskości bez wizerunku."
 generic_tenet_focus_tenet_alexandrian_catechism: "W obrządku o nazwie [GetTenetType('tenet_alexandrian_catechism').GetName( GetPlayer.GetRite )|l] ceni się nauki oparte na wiedzy, subtelną doktrynę oraz cierpliwe nauczanie wiernych."
 generic_tenet_focus_tenet_armed_pilgrimages: "W obrządku o nazwie [GetTenetType('tenet_armed_pilgrimages').GetName( GetPlayer.GetRite )|l] walkę i ochronę drogi do miejsca świętego traktuje się jako święte obowiązki pobożnych."
 generic_tenet_focus_tenet_carnal_exaltation: "W obrządku o nazwie [GetTenetType('tenet_carnal_exaltation').GetName( GetPlayer.GetRite )|l] pożądanie i cielesna przyjemność są czczone i uznawane za dary sakralne."
 generic_tenet_focus_tenet_communal_identity: "W obrządku o nazwie [GetTenetType('tenet_communal_identity').GetName( GetPlayer.GetRite )|l] ściśle łączy się kult ze zbiorowymi obyczajami, braterstwem i strzeżonym poczuciem przynależności."
 generic_tenet_focus_tenet_communion: "W obrządku o nazwie [GetTenetType('tenet_communion').GetName( GetPlayer.GetRite )|l] wspólna pobożność, jałmużna oraz wspólnota spajają wiernych z ich duchowym zwierzchnikiem."
 generic_tenet_focus_tenet_consolamentum: "W obrządku o nazwie [GetTenetType('tenet_consolamentum').GetName( GetPlayer.GetRite )|l] zmierza się ku ostatecznemu oczyszczeniu poprzez wyrzeczenia oraz przygotowanie się na śmierć bez strachu."
 generic_tenet_focus_tenet_divine_marriage: "W obrządku o nazwie [GetTenetType('tenet_divine_marriage').GetName( GetPlayer.GetRite )|l] sakralizuje się zarówno związek, jak i władzę, uznając święte małżeństwo za odzwierciedlenie porządku niebios."
 generic_tenet_focus_tenet_gnosticism: "W obrządku o nazwie [GetTenetType('tenet_gnosticism').GetName( GetPlayer.GetRite )|l] poszukuje się ukrytych za zasłoną świata prawd, powierzając zbawienie świętej wiedzy."
 generic_tenet_focus_tenet_mendicant_preachers: "W obrządku o nazwie [GetTenetType('tenet_mendicant_preachers').GetName( GetPlayer.GetRite )|l] wiarę szerzą wędrowni bracia, pokorne świadectwo i niestrudzone nauczanie."
 generic_tenet_focus_tenet_pacifism: "W obrządku o nazwie [GetTenetType('tenet_pacifism').GetName( GetPlayer.GetRite )|l] ceni się powściągliwość i pokój, uznając niepotrzebne przelewanie krwi za poważny upadek duszy."
 generic_tenet_focus_tenet_pentarchy: "W obrządku o nazwie [GetTenetType('tenet_pentarchy').GetName( GetPlayer.GetRite )|l] ceni się dawne ośrodki władzy oraz uporządkowane zarządzanie szerszą wspólnotą wiary."
 generic_tenet_focus_tenet_unrelenting_faith: "W obrządku o nazwie [GetTenetType('tenet_unrelenting_faith').GetName( GetPlayer.GetRite )|l] wychwala się niezachwianą gorliwość, nieugiętą determinację oraz gotowość do walki o to, co święte."
 generic_tenet_focus_tenet_vows_of_poverty: "W obrządku o nazwie [GetTenetType('tenet_vows_of_poverty').GetName( GetPlayer.GetRite )|l] czci się świętą potrzebę, wzywając wiernych do odrzucenia bogactwa i namawiając do życia bez zbędnych rzeczy."
 generic_tenet_focus_tenet_pastoral_isolation: "W obrządku o nazwie [GetTenetType('tenet_pastoral_isolation').GetName( GetPlayer.GetRite )|l] bardziej ceni się strzeżoną wspólnotę wiernych, wybierając separację od rozległego świata zamiast kompromisu."
 generic_tenet_focus_tenet_adaptive: "W obrządku o nazwie [GetTenetType('tenet_adaptive').GetName( GetPlayer.GetRite )|l] zmiany zachodzą bez wywoływania zniszczeń – lokalne zwyczaje są wchłaniane, podczas gdy święty rdzeń pozostaje nienaruszony."
 generic_tenet_focus_tenet_esotericism: "W obrządku o nazwie [GetTenetType('tenet_esotericism').GetName( GetPlayer.GetRite )|l] ceni się ukrytą mądrość, wtajemniczenie oraz prawdy ujawniane jedynie tym, którzy są przygotowani."
 generic_tenet_focus_tenet_legalism: "W obrządku o nazwie [GetTenetType('tenet_legalism').GetName( GetPlayer.GetRite )|l] świętość jest zakorzeniona w przejrzystym prawie, właściwym osądzie i zdyscyplinowanym porządku życia."
 generic_tenet_focus_tenet_literalism: "W obrządku o nazwie [GetTenetType('tenet_literalism').GetName( GetPlayer.GetRite )|l] ściśle przestrzega się świętych słów, ograniczając zaufanie wobec swobodnej interpretacji oraz odziedziczonych kompromisów."
 generic_tenet_focus_tenet_reincarnation: "W obrządku o nazwie [GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )|l] wędrówkę duszy postrzega się jako cykliczną – każde życie kształtuje następne."
 generic_tenet_focus_tenet_religious_legal_pronouncements: "W obrządku o nazwie [GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )|l] świętym postanowieniom i uroczystym osądom nadaje się trwały autorytet duchowy."
 generic_tenet_focus_tenet_struggle_submission: "W obrządku o nazwie [GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )|l] naucza się o tym, że dowodem wiary są trud, podbój oraz dławienie bezbożnych."
 generic_tenet_focus_tenet_false_conversion_sanction: "W obrządku o nazwie [GetTenetType('tenet_false_conversion_sanction').GetName( GetPlayer.GetRite )|l] toleruje się pozorne uleganie normom i skrywanie się pod maską, gdy wymaga tego przetrwanie lub zdobycie korzyści."
 generic_tenet_focus_tenet_tax_nonbelievers: "W obrządku o nazwie [GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )|l] osoby z poza wiary uznaje się za obarczone brzemieniem składanym jak trybut, a święta hierarchia umacniana jest przez doczesne należności."
 generic_tenet_focus_tenet_asceticism: "W obrządku o nazwie [GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )|l] dąży się do świętości poprzez samowyrzeczenie, dyscyplinę oraz wytrwałe panowanie nad pożądaniem."
 generic_tenet_focus_tenet_bhakti: "W obrządku o nazwie [GetTenetType('tenet_bhakti').GetName( GetPlayer.GetRite )|l] uwagę skupia się na płynącej z głębi serca pobożności oraz naucza się o tym, że miłujące oddanie przybliża duszę do tego, co boskie."
 generic_tenet_focus_tenet_dharmic_pacifism: "W obrządku o nazwie [GetTenetType('tenet_dharmic_pacifism').GetName( GetPlayer.GetRite )|l] ceni się nieszkodliwość i samokontrolę, uznając pokój za wartość wyższą niż gniew."
 generic_tenet_focus_tenet_inner_journey: "W obrządku o nazwie [GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )|l] zwraca się ku wnętrzu, szukając przebudzenia poprzez refleksję, dyscyplinę i przemianę samego siebie."
 generic_tenet_focus_tenet_ritual_hospitality: "W obrządku o nazwie [GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )|l] ugoszczenie nieznajomych traktuje się jako święty obowiązek, który łączy gospodarza i gościa w ramach świętego zwyczaju."
 generic_tenet_focus_tenet_adorcism: "W obrządku o nazwie [GetTenetType('tenet_adorcism').GetName( GetPlayer.GetRite )|l] oddaje się duchom cześć i szacunek, licząc na ich przychylność i uniknięcie ich gniewu."
 generic_tenet_focus_tenet_ancestor_worship: "W obrządku o nazwie [GetTenetType('tenet_ancestor_worship').GetName( GetPlayer.GetRite )|l] zwraca się ku czczonym zmarłym, szukając wskazówek, błogosławieństwa i nieprzerwanego istnienia wśród żyjących."
 generic_tenet_focus_tenet_astrology: "W obrządku o nazwie [GetTenetType('tenet_astrology').GetName( GetPlayer.GetRite )|l] interpretuje się znaki niebios, ufając, że gwiazdy wskażą porządek, przeznaczenie i właściwy czas."
 generic_tenet_focus_tenet_hedonistic: "W obrządku o nazwie [GetTenetType('tenet_hedonistic').GetName( GetPlayer.GetRite )|l] akceptuje się biesiadę, nadmiar i uświęcenie przyjemności w zbiorowym kulcie."
 generic_tenet_focus_tenet_human_sacrifice: "W obrządku o nazwie [GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )|l] ofiarę z krwi traktuje się jako przerażający, ale święty układ między tym, co śmiertelne, a tym, co boskie."
 generic_tenet_focus_tenet_mystical_birthright: "W obrządku o nazwie [GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )|l] uważa się, że niektórzy ludzie od kołyski są naznaczeni świętą mocą i duchową wielkością."
 generic_tenet_focus_tenet_ritual_celebrations: "W obrządku o nazwie [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )|l] wysławia się wspólne biesiady i świętowanie jako najpełniejszy wyraz czci."
 generic_tenet_focus_tenet_sacred_childbirth: "W obrządku [GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )|l] przyjście dzieci na świat otacza się czcią, uznając macierzyństwo i nowe życie za akty mające święte znaczenie."
 generic_tenet_focus_tenet_sanctity_of_nature: "W obrządku o nazwie [GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )|l] dostrzega się boskość w świecie żywym, otaczając czcią rozwój, płodność i nieskrępowane tworzenie."
 generic_tenet_focus_tenet_sun_worship: "W obrządku o nazwie [GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )|l] oddaje się cześć płonącemu dyskowi na niebie jako życiodajnemu symbolowi porządku, blasku i boskiej łaski."
 generic_tenet_focus_tenet_warmonger: "W obrządku o nazwie [GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )|l] gloryfikuje się podbój i wojenną siłę, oczekując od wiernych, że udowodnią swoją wartość podczas bitwy."
 generic_tenet_focus_tenet_gruesome_festivals: "W obrządku o nazwie [GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )|l] praktykuje się przerażające biesiady, zamieniając strach, krew i widowisko w sakralną demonstrację."
 generic_tenet_focus_tenet_cthonic_redoubts: "W obrządku o nazwie [GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )|l] czci się górskie szczyty i ukryte niedostępne miejsca jako przestrzenie szczególnej świętości."
 generic_tenet_focus_tenet_household_gods: "W obrządku o nazwie [GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )|l] uwagę skupia się na domu, a ognisko domowe, więzi rodzinne i codzienna pobożność są objęte boską opieką."
 generic_tenet_focus_tenet_sinitic_syncretism: "W obrządku o nazwie [GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )|l] tradycję splata się z myślą chińską, dążąc do harmonii, a nie rozłamu."
 generic_tenet_focus_tenet_eastern_syncretism: "W obrządku o nazwie [GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )|l] ochoczo przyswaja się nieznane nauki, odczytując obcą mądrość jako echo świętej prawdy."
 generic_tenet_focus_tenet_unreformed_syncretism: "W obrządku o nazwie [GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )|l] bez przeszkód czerpie się z dawnych praktyk, włączając starożytne rytuały w nową, świętą jedność."
 generic_tenet_focus_tenet_christian_syncretism: "W obrządku o nazwie [GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )|l] zamiast całkowicie odrzucać nauki Chrystusa, interpretuje się je na nowo w ramach własnych świętych fundamentów."
 generic_tenet_focus_tenet_islamic_syncretism: "W obrządku o nazwie [GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )|l] czerpie się z wierzeń i zwyczajów muzułmańskich, odnajdując użyteczną prawdę w bliskim objawieniu."
 generic_tenet_focus_tenet_jewish_syncretism: "W obrządku o nazwie [GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )|l] łączy się hebrajską tradycję, prawo i pamięć z własnym rozumieniem tego, co święte."
 generic_tenet_focus_tenet_exaltation_of_pain: "W obrządku o nazwie [GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )|l] cielesną udrękę uznaje się za oczyszczającą, a oddanie objawia się poprzez wytrwałość i znoszenie cierpienia."
 generic_tenet_focus_tenet_natural_primitivism: "W obrządku o nazwie [GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )|l] nie ufa się przepychowi cywilizacji, czci się natomiast surowszy i bardziej pierwotny sposób życia."
 generic_tenet_focus_tenet_pursuit_of_power: "W obrządku o nazwie [GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )|l] błogosławi się ambicję i świeckie panowanie, uznając dominium za właściwe narzędzie tego, co święte."
 generic_tenet_focus_tenet_ritual_cannibalism: "W obrządku o nazwie [GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )|l] spożywanie ludzkiego mięsa uznaje się za tabu kultu i świętą grozę."
 generic_tenet_focus_tenet_sacred_shadows: "W obrządku o nazwie [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )|l] używa się tajemnicy jako osłony, czyniąc świętym ukrywanie, zmierzch i to, czego większość nie widzi."
 generic_tenet_focus_tenet_polyamory: "W obrządku o nazwie [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )|l] błogosławi się wielość miłości, nie ograniczając świętej bliskości do jednej więzi."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "W obrządku o nazwie [GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )|l] uroczystą ofiarę uznaje się za najważniejszą część kultu, wiążąc ją z przymierzem i uznaniem."
 generic_tenet_focus_tenet_megaliths: "W obrządku o nazwie [GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )|l] sakralność objawia się w trwałym kamieniu, a pomniki mają służyć pielęgnowaniu pamięci i religijności."
 generic_tenet_focus_tenet_fp3_fedayeen: "W obrządku o nazwie [GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )|l] uświęca się podstępność, szpiegostwo i ofiarną przemoc w imię wyższej sprawy."
 generic_tenet_focus_tenet_communal_possessions: "W obrządku o nazwie [GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )|l] umniejsza się znaczenie prywatnego majątku, wzywając wiernych do posiadania wspólnych zasobów."
 generic_tenet_focus_tenet_pure_land: "W obrządku o nazwie [GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )|l] nadzieję pokłada się w błogosławionej, pozbawionej cierpienia ziemi, do której prowadzą zaufanie, pamięć i oddanie."
 generic_tenet_focus_tenet_no_mind: "W obrządku o nazwie [GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )|l] poszukuje się jasności wykraczającej poza zrozumienie myśli poprzez przestrzeganie dyscypliny, aby osiągnąć stan pustki i przejrzystej świadomości."
 generic_tenet_focus_tenet_mountain_worship: "W obrządku o nazwie [GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )|l] w centrum uwagi są wysoko położone miejsca, które uznaje się za bliższe temu, co boskie, czyniąc szczyty i wysokie obiekty przedmiotami czci."
 generic_tenet_focus_tenet_extinction_of_dharma: "W obrządku o nazwie [GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )|l] świat postrzega się jako ogarnięty zepsuciem, co uzasadnia bezwzględną przemoc w obronie prawdy."
 generic_tenet_focus_tenet_cranial_trophies: "W obrządku o nazwie [GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )|l] szczątki wrogów traktuje się jako święty dowód zwycięstwa i budzący grozę prestiż."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "W obrządku o nazwie [GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )|l] wywyższa się naukę jako świętą pracę, poszukując prawdy poprzez studiowanie, debatę i zdyscyplinowaną ciekawość świata."
 generic_tenet_focus_tenet_benevolent_governance: "W obrządku o nazwie [GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )|l] świętość mierzy się częściowo sprawiedliwym prawem, uporządkowanym zarządzaniem i dbaniem o państwo."
 generic_tenet_focus_tenet_filial_piety: "W obrządku o nazwie [GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )|l] głosi się, że cześć wobec rodziców i starszyzny stanowią fundament porządku moralnego i sakralnego."
 generic_tenet_focus_tenet_harmonious_society: "W obrządku o nazwie [GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )|l] ceni się równowagę, właściwe zachowanie i publiczną zgodność będące odzwierciedleniem kosmicznego porządku."
 generic_tenet_focus_tenet_sacred_destruction: "W obrządku o nazwie [GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )|l] święte unicestwienie uważa się za oczyszczające, co czyni samo zniszczenie narzędziem odnowy."
 generic_tenet_focus_tenet_preservation: "W obrządku o nazwie [GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )|l] ceni się wytrwałość, ciągłość oraz staranną ochronę tego, co zostało powierzone."
 generic_tenet_focus_tenet_takamin: "W obrządku o nazwie [GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )|l] niedźwiedź i pokrewne siły dzikiej natury otaczane są czcią, nabożnym podziwem i ostrożnym szacunkiem."
 generic_tenet_focus_tenet_peace_of_god: "W obrządku o nazwie [GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )|l] ogranicza się przemoc, ustanawiając święte granice tego, kiedy przelanie krwi jest uzasadnione."
 generic_tenet_focus_tenet_dulia: "W obrządku o nazwie [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )|l] czci się błogosławionych zmarłych i święte wzorce, miłując ich pamięć, ale nie utożsamia się ich z boskością."
 generic_tenet_focus_tenet_transubstantiation: "W obrządku o nazwie [GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )|l] święte misteria traktuje się jako prawdziwie odmieniające, co czyni sakrament głównym elementem boskiej obecności."
 generic_tenet_focus_tenet_ora_et_labora: "W obrządku o nazwie [GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )|l] łączy się oddanie i trud, twierdząc, że uczciwa praca sama w sobie może stać się modlitwą."
 generic_tenet_focus_tenet_hyperdulia: "W obrządku o nazwie [GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )|l] otacza się szczególną czcią najświętszego orędownika ponad zwyczajne szeregi świętych."
 generic_tenet_focus_tenet_simony: "W obrządku o nazwie [GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )|l] przyjmuje się, że święty urząd, patronat i doczesne bogactwo są ze sobą ściśle powiązane."
 generic_tenet_focus_tenet_monophysitism: "W obrządku o nazwie [GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )|l] głosi się jedność natury Chrystusa, nie akceptując zbyt drastycznego podziału boskiej tajemnicy."
 generic_tenet_focus_tenet_acts_of_apostles: "W obrządku o nazwie [GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )|l] wzorem do naśladowania jest apostolska wspólnota, miłość bliźniego i wspólne życie najstarszych wiernych."
 generic_tenet_focus_tenet_purgatory: "W obrządku o nazwie [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )|l] naucza się, że po śmierci dusze często muszą najpierw zaznać oczyszczenia, aby doświadczyć doskonałego błogostanu."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "W obrządku o nazwie [GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )|l] rodzinę, prokreację i dawanie początku nowemu życiu traktuje się jako święte obowiązki."
 generic_tenet_focus_tenet_apostolic_succession: "W obrządku o nazwie [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )|l] autorytet uzasadnia się nieprzerwanym łańcuchem przekazywania władzy sięgającym czasów pierwszych apostołów."
 generic_tenet_focus_tenet_confession: "W obrządku o nazwie [GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )|l] ceni się publiczną pokutę i rozgrzeszenie, ufając, że wyznany grzech staje się początkiem uzdrowienia."
 generic_tenet_focus_tenet_original_sin: "W obrządku o nazwie [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )|l] ludzka słabość jest postrzegana jako pierwotna, podkreślając, że żadna dusza nie przychodzi na świat nieskalana."
 generic_tenet_focus_tenet_celestial_hierarchy: "W obrządku o nazwie [GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )|l] kosmos przedstawiany jest jako uporządkowany według świętej hierarchii, w której każda pozycja odzwierciedla boski zamysł."
 generic_tenet_focus_tenet_miles_christi: "W obrządku o nazwie [GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )|l] wiernych przedstawia się jako wojowników świętości, którzy mają bronić prawdy ze zdyscyplinowaną gorliwością."
 generic_tenet_focus_tenet_scholasticism: "W obrządku o nazwie [GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )|l] wiara jest pogłębiana poprzez argumentowanie, komentowanie i godzenie jej z rozumem."
 generic_tenet_focus_tenet_adoptionism: "W obrządku o nazwie [GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )|l] podkreśla się wysławianie i boskie synostwo w sposób, który bagatelizuje wieczny podział."
 generic_tenet_focus_tenet_love_thy_neighbour: "W obrządku o nazwie [GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )|l] miłosierdzie i dobroczynność uznaje się za główne aspekty codziennego życia religijnego."
 generic_tenet_focus_tenet_divine_liturgy: "W obrządku o nazwie [GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )|l] wysławia się uroczystą liturgię, traktując uporządkowany kult jako najczystsze okno na świętość."
 generic_tenet_focus_tenet_miaphysitism: "W obrządku o nazwie [GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )|l] naucza się o nierozdzielnej jedności boskości i człowieczeństwa w tajemnicy Chrystusa."
 generic_tenet_focus_tenet_hesychasm: "W obrządku o nazwie [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l] dąży się do zjednoczenia poprzez ciszę, bezruch oraz wewnętrzne powtarzanie świętej modlitwy."
 generic_tenet_focus_tenet_anachoresis: "W obrządku o nazwie [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )|l] czci się wycofanie ze świata i szukanie świętości w samotności, trudzie oraz dystansie."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "W obrządku o nazwie [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l] dąży się do świętości poprzez cielesne trudy, wykorzystując niskie instynkty do osiągnięcia duchowego celu."
 generic_tenet_focus_tenet_holy_myron: "W obrządku o nazwie [GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )|l] przywiązuje się szczególną wagę do rytuału namaszczenia, traktując poświęcony olej jako pieczęć boskiej łaski."
 generic_tenet_focus_tenet_khachkar: "W obrządku o nazwie [GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )|l] uświęca się rzeźbione kamienne krzyże i trwałe pomniki jako publiczne świadectwa sakralne."
