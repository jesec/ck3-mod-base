 #Ṣadr al-Islām
 sadr_al_islam: "Sadr al-Islam"
 sadr_al_islam_adj: "Muzułmańska"
 sadr_al_islam_adherent: "muzułmanin"
 sadr_al_islam_adherent_plural: "muzułmanie"
 sadr_al_islam_desc: "Zanim w kolejnych wiekach pojawiły się poszczególne szkoły, muzułmanami kierował sam Prorok poprzez objawienie boże, co stanowiło najczystszą formę tej tradycji. Jego sunnę naśladowali towarzysze oraz tabi’un pierwszych kilku pokoleń."
 #Sunni
 sunni: "Sunnizm"
 sunni_adj: "Sunnicka"
 sunni_adherent: "sunnita"
 sunni_adherent_plural: "sunnici"
 sunni_desc: "Sunnici to wyznawcy praktyk Mahometa, które są znane jako sunna. Sunnickie prawoznawstwo islamskie opiera się przede wszystkim na Koranie, hadisach oraz idżmie (konsensusie uczonych) jako swoich podstawowych źródłach."
 #Shia
 shia: "Szyizm"
 shia_adj: "Szyicka"
 shia_adherent: "szyita"
 shia_adherent_plural: "szyici"
 shia_desc: "Nurt islamu, w którym uważa się, że przywództwo powinno pozostać w rodzinie proroka Mahometa i należy je przekazywać imamom prowadzonym przez Boga. Nurt ten kładzie nacisk na oddanie wobec rodziny Proroka."
 islam_shia_priest: "mułła"
 islam_shia_priest_plural: "mułłowie"
 islam_shia_religious_head_title: "Imam"
 islam_shia_religious_head_title_name: "Imamat"
 #Kharijite
 kharijite: "Charydżyzm"
 kharijite_adj: "Charydżycka"
 kharijite_adherent: "charydżyta"
 kharijite_adherent_plural: "charydżyci"
 kharijite_desc: "Wczesna grupa islamska, według której przywództwo powinno opierać się na pobożności, a nie na pochodzeniu, a grzesznych władców można się pozbyć. Powstała w czasie wstrząsów szyickich, odrzuciła obie strony i wykluczyła ciężkich grzeszników z islamu."
 #Masmudism
 masmudi: "Almohadyzm"
 masmudi_adj: "Almohadzka"
 masmudi_adherent: "almohada"
 masmudi_adherent_plural: "almohadzi"
 masmudi_desc: "Reformistyczny odłam sunnizmu, który powstał wśród berberskich plemion północnej Afryki. Almohadzi uważają się za unitarystów i głoszą doktrynę oczyszczonego monoteizmu."
 masmudi_religious_head_title: "Kalif"
 masmudi_religious_head_title_name: "kalifat"
 #Quranism
 quranist: "Koranizm"
 quranist_adj: "Koranistyczna"
 quranist_adherent: "koranista"
 quranist_adherent_plural: "koraniści"
 quranist_desc: "Dosłowna interpretacja islamu, która podkreśla, że Koran jako jedyne źródło boskiej mądrości i powinien być przestrzegany co do litery, ignorując hadisy i fatwy."
 #Druze
 druze: "Druzyzm"
 druze_adj: "Druzyjska"
 druze_adherent: "druz"
 druze_adherent_plural: "druzowie"
 druze_desc: "Druzowie dzielą wiele dogmatów z ismailizmem, dodając jednak wiele gnostycznych przekonań i tworząc ezoteryczną teologię opartą na Prawdzie Istnienia."
 druze_religious_text: "Listy Mądrości"
 druze_religious_text_2: "$druze_religious_text$" #Optional translation alt
 druze_religious_text_3: "$druze_religious_text$" #Optional translation alt
