 doctrine_parameter_can_use_islamic_artifacts: "Może używać islamskich [Concept('artifacts', 'artefaktów')|E]"
 doctrine_parameter_can_use_jewish_artifacts: "Może używać żydowskich [Concept('artifacts', 'artefaktów')|E]"
 tenet_christian_syncretism_name: "Chrześcijański synkretyzm"
 tenet_christian_syncretism_desc: "Jezus z Nazaretu może nie był prawdziwym bóstwem, ale nadal był wybitną i cnotliwą postacią. Powinniśmy czcić i szanować jego nauki."
 doctrine_parameter_christian_syncretic_actor_opinion_active: "$VALUE|=+0$ pkt premii do [Concept('opinion', 'opinii')|E] o sobie w przypadku [Concept('faiths', 'wiar')|E] z [Concept('core_tenet', 'dogmatem')|E] „$tenet_christian_syncretism_name$”"
 doctrine_parameter_christian_syncretic_recipient_opinion_active: "$VALUE|=+0$ pkt wzajemnej premii do [Concept('opinion', 'opinii')|E] w przypadku [Concept('faiths', 'wiar')|E] chrześcijańskich i ich [Concept('counties', 'hrabstw')|E]"
 doctrine_parameter_adoptionists_are_unilateral_hostile: "Inne chrześcijańskie [faiths|El] postrzegają ją następująco: $hostility_hostile_tooltippable$. Natomiast mniej wyszukani $adoptionist_adherent_plural$ postrzegani są następująco: $hostility_evil_tooltippable$"
 doctrine_parameter_adoptionists_are_unilateral_evil: "Inne chrześcijańskie [faiths|El] uważają, że wiara ta jest [GetHostilityLevelName( '(int32)3' )|Vl]"
 doctrine_parameter_adoptionists_are_mutual_evil: "Postrzega chrześcijan, i jest przez nich postrzegana następująco: $hostility_evil_tooltippable$"
 doctrine_parameter_adoptionist_school_removed_on_reformation: "Subtelne niuanse tej szkoły zostały #EMP na zawsze#! utracone podczas [Concept( 'reformation', 'reformacji' )|E]"
 doctrine_parameter_adoptionists_attractively_intuitive_theology: "[EmptyScope.ScriptValue('fp2_lyonese_monk_conversion_bonus_root_value')|=+%0] do szybkości nawracania wobec innych [Concept( 'faiths', 'wiar' )|E] chrześcijańskich"
 tenet_islamic_syncretism_name: "Muzułmański synkretyzm"
 tenet_islamic_syncretism_desc: "Słowa Proroka są bezsprzecznie mądre i sprawiedliwe, dlatego niezależnie od naszych wątpliwości, powinniśmy wziąć pod uwagę jego myśli i czyny."
 doctrine_parameter_islamic_syncretic_actor_opinion_active: "$VALUE|=+0$ pkt premii do [Concept('opinion', 'opinii')|E] o sobie w przypadku [Concept('faiths', 'wiar')|E] z [Concept('core_tenet', 'dogmatem')|E] „$tenet_islamic_syncretism_name$”"
 doctrine_parameter_islamic_syncretic_recipient_opinion_active: "$VALUE|=+0$ pkt wzajemnej premii do [Concept('opinion', 'opinii')|E] w przypadku [Concept('faiths', 'wiar')|E] islamskich i ich [Concept('counties', 'hrabstw')|E]"
 tenet_jewish_syncretism_name: "Żydowski synkretyzm"
 tenet_jewish_syncretism_desc: "Chociaż nie zgadzamy się z jej twierdzeniami dotyczącymi ludu wybranego przez Boga, mądrość żydowskiej Tory jest niezaprzeczalna, a z jej tekstu można się wiele nauczyć."
 doctrine_parameter_jewish_syncretic_actor_opinion_active: "$VALUE|=+0$ pkt premii do [Concept('opinion', 'opinii')|E] o sobie w przypadku [Concept('faiths', 'wiar')|E] z [Concept('core_tenet', 'dogmatem')|E] „$tenet_jewish_syncretism_name$”"
 doctrine_parameter_jewish_syncretic_recipient_opinion_active: "$VALUE|=+0$ pkt wzajemnej premii do [Concept('opinion', 'opinii')|E] w przypadku [Concept('faiths', 'wiar')|E] żydowskich i ich [Concept('counties', 'hrabstw')|E]"
 #Additional Tenets
 tenet_ritual_cannibalism_name: "Rytualny kanibalizm"
 tenet_ritual_cannibalism_desc: "Ludzkość jest błogosławiona, jako że została obdarzona iskrą boskości. Z tego względu ludzkie ciało jest święte. Jego obecnością należy się delektować, a nie grzebać czy palić."
 doctrine_parameter_cannibalism_legal: "Cecha [GetTrait('cannibal').GetName( GetNullCharacter )|l] nie jest już dłużej [Concept( 'criminal', 'karalna' )|E]"
 doctrine_parameter_tenet_ritual_cannibalism_devour_reward: "Można zjadać [Concept('prisoners', 'więźniów')|E], aby redukować [stress|El] i zyskiwać @spiritual_fulfillment_icon! [spiritual_fulfillment|El]"
 doctrine_parameter_tenet_ritual_cannibalism_feast_toast: "[honorary_guest|E] może zostać zjedzony, gdy [GetActivityType('activity_feast').GetName|l] dobiega końca"
 tenet_exaltation_of_pain_name: "Umiłowanie bólu"
 tenet_exaltation_of_pain_desc: "Ból jest uniwersalnym uczuciem, przemoc uniwersalnym językiem. Dać ból drugiemu człowiekowi to dać mu błogosławieństwo, a samemu przyjąć ból to otrzymać łaskę."
 doctrine_parameter_torturing_prisoners_grants_piety: "Torturowanie [Concept('prisoners', 'więźniów')|E] skutkuje zyskaniem @piety_icon! [Concept('piety', 'pobożności')|E] zamiast kosztować @piety_icon! [piety|El]"
 doctrine_parameter_reduced_stress_from_torture: "Wyznawcy nie zyskują [Concept('stress', 'stresu')|E], gdy są torturowani, lecz zyskują @spiritual_fulfillment_icon! [spiritual_fulfillment|El] dzięki udręce"
 doctrine_parameter_self_mutilation_active: "Można [Concept('decide', 'zdecydować')|E] o poddaniu się biczowaniu, aby zwiększyć swoją @piety_icon! [piety|El] kosztem zyskania następującej cechy: [GetTrait('wounded_1').GetName( GetPlayer )|l]"
 doctrine_parameter_no_epidemic_fulfillment_loss_active: "Wyznawcy nie tracą @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] z powodu [Concept('epidemic', 'zarazy')|E]"
 doctrine_parameter_no_epidemic_fulfillment_loss_personal_active: "Ta postać nie traci @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] z powodu [Concept('epidemic', 'zarazy')|E]"
 doctrine_parameter_tenet_exaltation_of_pain_flagellant_trait: "Zyskaj [Concept('trait', 'cechę')|E] [GetTrait('flagellant').GetName( GetPlayer )|l] przy wyborze tego [Concept('personal_tenet', 'dogmatu osobistego')|E]"
 doctrine_parameter_tenet_exaltation_of_pain_wounded_spiritual_fulfillment: "Zyskanie [Concept('trait', 'cechy')|E] [GetTrait('wounded_1').GetName( GetPlayer )|l] zapewnia @spiritual_fulfillment_icon! [spiritual_fulfillment|El] w zależności od dotkliwości ran"
 doctrine_parameter_tenet_exaltation_of_pain_wound_courtier_interaction: "Odblokowuje [Concept('interaction', 'interakcję')|E] #V „$exaltation_of_pain_wound_courtier_interaction$”#!, co pozwala na ranienie [Concept('courtiers', 'dworzan')|E] w zamian za @piety_icon! [piety|El]"
 exaltation_of_pain_wounded_spiritual_fulfillment_toast: "Błogosławieństwo przez cierpienie"
 self_mutilation_active_name: "[GetTenetType('tenet_exaltation_of_pain').GetBaseName]"
 self_mutilation_minor_piety_gain_tt: "[THIS.Char.GetShortUINameNotMe] zyskuje [piety_i] #P [THIS.ScriptValue('minor_piety_gain')]#! ze względu na swój [personal_tenet|El] „[GetTenetType('tenet_exaltation_of_pain').GetBaseName]”"
 self_mutilation_medium_piety_gain_tt: "[THIS.Char.GetShortUINameNotMe] zyskuje [piety_i] #P [THIS.ScriptValue('medium_piety_gain')]#! ze względu na swój [personal_tenet|El] „[GetTenetType('tenet_exaltation_of_pain').GetBaseName]”"
 self_mutilation_major_piety_gain_tt: "[THIS.Char.GetShortUINameNotMe] zyskuje [piety_i] #P [THIS.ScriptValue('major_piety_gain')]#! ze względu na swój [personal_tenet|El] „[GetTenetType('tenet_exaltation_of_pain').GetBaseName]”"
 tenet_sacred_shadows_name: "Święte kłamstwa"
 tenet_sacred_shadows_desc: "Kłamstwo jest najbardziej przenikliwą sztuką. Ci, którzy potrafią przekonać innych do swoich kłamstw, są święci. Ci, którzy potrafią skutecznie okłamywać samych siebie, są nie do powstrzymania."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Wyznawcy zdobywają pobożność za pomyślne ukończenie [Concept( 'schemes', 'spisków' )|E] dotyczących [Concept( 'intrigue', 'intrygi' )|E]"
 doctrine_parameter_adherents_more_likely_to_join_schemes: "Wyznawcy są bardziej skłonni dołączyć w charakterze wspólników do [Concept( 'schemes', 'spisków' )|E] innych postaci"
 doctrine_parameter_tenet_sacred_shadows_fabricate_hook: "Można użyć [Concept('scheme', 'spisku')|E] „[GetScheme('fabricate_hook').GetTypeName]”"
 doctrine_parameter_tenet_sacred_shadows_intrigue_scheme_fulfillment: "Zyskaj @spiritual_fulfillment_icon! [spiritual_fulfillment|El] za udane [Concept('schemes', 'spiski')|E] dotyczące [Concept('intrigue', 'intrygi')|E]"
 tenet_pursuit_of_power_name: "Pogoń za władzą"
 tenet_pursuit_of_power_desc: "To, co jest słuszne, a co nie, ulega zmianie i zależy tylko od tych, którzy sprawują obecnie władzę. Oznacza to, że pogoń za władzą jest jedynym naprawdę słusznym powodem jakiegokolwiek działania."
 doctrine_parameter_tenet_pursuit_of_power_war_victory_fulfillment: "Wygrywanie wojen zapewnia @spiritual_fulfillment_icon! [spiritual_fulfillment|El]"
 doctrine_parameter_tenet_pursuit_of_power_become_conqueror: "Odblokowuje [Concept('decision', 'decyzję')|E] „$pursue_conquerors_mantle_decision$”"
 tenet_pastoral_isolation_name: "Izolacja pasterska"
 tenet_pastoral_isolation_desc: "Wszystko, czego chcemy, to zostać sami. Nasze praktyki są naszą wyłączną sprawą i nikt więcej nie powinien się tym interesować."
 doctrine_parameter_unattractive_for_character_conversions: "[characters|E] są bardziej skłonne do odwrócenia się od tej [Concept('faith', 'wiary')|E]"
 tenet_natural_primitivism_name: "Naturalny prymitywizm"
 tenet_natural_primitivism_desc: "Cywilizacja jest nienaturalną, próżną i bluźnierczą próbą narzucenia porządku z natury nieuporządkowanemu stworzeniu. Odrzucamy tkaniny, rangi, prawo i dworską próżność, aby żyć tak, jak było nam przykazane z woli opatrzności – będziemy dzicy, prości oraz wolni."
 doctrine_parameter_naked_adherents_active: "Wyznawcy nie noszą ubrań"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Koszty prawa: #N +50%#!"
 doctrine_parameter_tenet_natural_primitivism_promote_naturism_decision: "Odblokowuje [Concept('decision', 'decyzję')|E] „#V Przyjmij naturalną wolność#!”"
 doctrine_parameter_unlock_jizya_contract: "Odblokowuje [vassal_contract|El] i [tax_decree|El] o dżizję"
 #FP3 tenets
 tenet_communal_possessions_name: "Własność komunalna"
 tenet_communal_possessions_desc: "Z woli [ROOT.Rite.GetFaith.HighGodNamePossessive] każdy powinien otrzymać równy udział w zasobach ziemi. Powinniśmy posiadać wszystko wspólnie i na nowo rozdzielić majątek skradziony przez możnych."
 doctrine_parameter_piety_from_gifts_active: "Zyskaj @piety_icon! [piety|El] za wysyłanie [Concept('gifts', 'podarunków')|E] i wręczanie [Concept('artifacts', 'artefaktów')|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Władcy zyskują @piety_icon! [piety|El] z małżeństwa z [Concept('lowborn', 'nisko urodzonymi')|E] [Concept('characters', 'postaciami')|E], nie tracąc przy tym @legitimacy_icon! [Concept('legitimacy', 'legitymacji')|E]"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "Odblokowuje [Concept('decision', 'decyzję')|E] „$redistribute_realm_wealth_decision$”"
 tenet_sacrificial_ceremonies_name: "Ceremonie ofiarne"
 tenet_sacrificial_ceremonies_desc: "Ofiara z ludzi, zarówno dobrowolna jak i mimowolna, zbliża nas do boskości. Zwyczajem i cnotą jest dobrowolne złożenie siebie w ofierze podczas ceremonii, podobnie jak cnotą jest złożenie w ofierze tych, którzy popełnili niewybaczalne zbrodnie przeciwko bogom."
 tenet_megaliths_name: "Megalityczne budowle"
 tenet_megaliths_desc: "Kult nie powinien odbywać się tylko w świątyni, są to prymitywne konstrukcje zbudowane przez człowieka, które odciągają go od boskich tworów otaczających nas wszystkich. Czcimy kamień i otwartą przestrzeń, układając kamienie, które dał nam Stwórca, w sposób, który sprawia mu przyjemność i przybliża nas do boskości."
 doctrine_parameter_can_build_megaliths: "Umożliwia budowę megalitów w posiadłościach [Concept( 'temple', 'świątynnych' )|E] oraz wielkich megalitów w stolicach księstw."
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "Podwójne nagrody w postaci doświadczenia za odwiedzanie [Concept('points_of_interest', 'ciekawych miejsc')|E] będących [Concept('buildings', 'budowlami')|E]"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "Zyskaj @spiritual_fulfillment_icon! [spiritual_fulfillment|El] za ukończenie budowy na następującym terenie: [GetTerrain( 'hills' ).GetName|l], [GetTerrain( 'terraced_hills' ).GetName|l], [GetTerrain( 'mountains' ).GetName|l] lub [GetTerrain( 'desert_mountains' ).GetName|l]"
 pam_megaliths_rough_terrain_construction_toast: "Ze względu na twój dogmat osobisty „[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )]”"
 province_is_of_a_megalith_faith_tt: "To [county|El] musi wyznawać [Concept( 'faith', 'wiarę' )|E], która wierzy w znaczenie megalitów."
 tenet_fp3_fedayeen_name: "Fedaini"
 tenet_fp3_sacred_murder_name: "Święte morderstwo"
 tenet_fp3_fedayeen_desc: "Gdy zwykłe działania wojenne nie przynoszą skutku, naszym obowiązkiem wobec [ROOT.Rite.GetFaith.HighGodNameAlternatePossessive] jest zgładzenie wrogów [ROOT.Rite.GetFaith.HighGodNameAlternatePossessive] poprzez infiltrację i podstęp. Nie wolno nam lękać się ani śmierci, ani bólu – z ochotą oddamy życie za wyższą sprawę."
 doctrine_parameter_master_assassin_court_position_unlocked: "Odblokowuje [court_position|El]: #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()|l]#!"
 master_assassin_court_position_unlocked_name: "$tenet_fp3_fedayeen_name$"
 doctrine_parameter_death_is_glory: "Prawdopodobieństwo poniesienia śmierci lub obrażeń w [Concept( 'battle', 'bitwie' )|E]: #N +10%#!"
 doctrine_parameter_sanctioned_assassinations: "Nie tracisz [Concept( 'piety', 'pobożności' )|E] za zabicie postaci wyznającej inną [Concept( 'faith', 'wiarę' )|E] w drodze [Concept( 'scheme', 'spisku' )|E] „Morderstwo”"
 doctrine_parameter_tenet_fp3_fedayeen_other_faith_kill_fulfillment: "Zyskaj @spiritual_fulfillment_icon! [spiritual_fulfillment|El] za zabijanie [Concept('characters', 'postaci')|E] wyznających inną [Concept('faith', 'wiarę')|E]"
 #EP3 Tenets
 tenet_household_gods_name: "Bóstwa ogniska domowego"
 tenet_household_gods_desc: "Czcimy nasze #EMP lary#! i naszych #EMP geniuszy#! – duchy opiekuńcze, które czuwają nad naszymi domostwami. Choć nade wszystko czcimy naszego chwalebnego cesarza, którego dusza jest odpowiedzialna za ochronę całego państwa."
 #BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ dla [Concept('temple_holdings', 'posiadłości świątynnych')|E]"
 #TGP
 immaterial_harmony_name: "Niematerialna harmonia"
 special_doctrine_immaterial_harmony_name: "Niematerialna harmonia"
 special_doctrine_immaterial_harmony_desc: "Nasze tradycje, nauki Buddy czy mędrców nie stoją ze sobą w sprzeczności. Praktykować można którąkolwiek z trzech nauk, a nawet wszystkie jednocześnie."
 tenet_extinction_of_dharma_name: "Wygaśnięcie Dharmy"
 tenet_extinction_of_dharma_desc: "Demony chodzą po ziemi pod postacią pobożnych i oddanych. Gdy ktoś zabije demona, zrobi jeden krok ku oświeceniu. Gdy ktoś zabije dziesięciu, zrobi dziesięć kroków ku oświeceniu."
 tenet_cranial_trophies_name: "Trofea z czaszek"
 tenet_cranial_trophies_desc: "Głowa jest naczyniem kwintesencji swojego właściciela. Możemy zyskać potężną energię duchową, odcinając ją i wydobywając jej zawartość."
 doctrine_parameter_killing_bestows_heads: "Możliwe jest zdobycie [Concept('artifact', 'artefaktu')|E] w formie trofeum z czaszki w chwili [Concept('executing', 'stracenia')|E] innej postaci lub zabicia jej w [Concept('single_combat_duel', 'pojedynku')|E] bądź [Concept('battle', 'bitwie')|E]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "W momencie zdobycia [Concept('artifact', 'artefaktu')|E] w formie trofeum z czaszki zabójca zyskuje również @piety_icon! [piety|El] w ilości proporcjonalnej do @prestige_icon! [Concept('prestige', 'prestiżu')|E] postaci zmarłej"
 doctrine_parameter_tenet_cranial_trophies_spiritual_fulfillment_from_trophies: "W momencie zdobycia [Concept('artifact', 'artefaktu')|E] w formie trofeum z czaszki zyskujesz również @spiritual_fulfillment_icon! [spiritual_fulfillment|El] w ilości proporcjonalnej do @prestige_icon! [Concept('prestige', 'prestiżu')|E] postaci zmarłej"
 tenet_benevolent_governance_name: "Łaskawe zarządzanie"
 tenet_benevolent_governance_desc: "Ci, którzy rządzą masami, mają moralny obowiązek promować to, co dobre, i wyrzekać się tego, co złe. Tylko stosując się do tej zasady, władca może być prawdziwie sprawiedliwy."
 tenet_filial_piety_name: "Synowska pobożność"
 tenet_filial_piety_desc: "Synowska pobożność i posłuszeństwo wobec starszyzny są fundamentem, dzięki któremu urzeczywistnia się ludzka dobroć. Dopóki nasi rodzice żyją, stosownie im służymy, wspieramy ich na miarę naszych możliwości i czerpiemy z ich nauk; gdy zaś umierają, sprawiamy im godny pochówek, a następnie oddajemy im należną cześć."
 tenet_harmonious_society_name: "Harmonijne społeczeństwo"
 tenet_harmonious_society_desc: "Wszystko musi być w równowadze: jednostki, natura, społeczeństwo. Syn niebios nadaje tempo, a my podążamy za jego śpiewem."
 doctrine_parameter_sway_scheme_better: "[scheme_success_chance|E] ([GetScheme('sway').GetTypeName|l]): [success_chance_i] #P +15%#!"
 doctrine_parameter_sway_scheme_piety: "Udane [schemes|El] „[GetScheme('sway').GetTypeName]” wymierzone przeciwko twojemu [Concept('liege', 'seniorowi')|E] lub twoim [Concept('vassals', 'wasalom')|E] zapewniają [piety_i] #P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! pkt [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_more_often_zealots: "[vassals|E] mają większą szansę przyjąć następującą [Concept('vassal_stance', 'postawę wasala')|E]: [GetVassalStance( 'zealot' ).GetTextIcon] [GetVassalStance( 'zealot' ).GetName|l]"
 doctrine_parameter_tenet_harmonious_society_sway_fulfillment: "Zyskaj #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! pkt @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] po udanym [Concept('scheme', 'spisku')|E] „[GetScheme('sway').GetTypeName]”, którego celem byli twój [liege|El] lub twoi [vassals|El]"
 doctrine_parameter_tenet_harmonious_society_five_bonds: "Zyskaj [piety_i] [piety|El] i [prestige_i] [prestige|El] za relacje mające #V 50#! lub więcej pkt [Concept('opinion', 'opinii')|E]: [liege|El] lub [vassal|El], rodzic lub dorosłe dziecko, małżonek, dorosłe rodzeństwo oraz [friend|El]"
 tenet_harmonious_society_sway_boon: "Twoja [faith|El] ma dogmat „[GetTenetType('tenet_harmonious_society').GetBaseName]”: $VALUE|+0=$"
 harmonious_society_sway_fulfillment_toast: "Dogmat „$tenet_harmonious_society_name$”"
 tenet_pursuit_of_knowledge_name: "Pogoń za wiedzą"
