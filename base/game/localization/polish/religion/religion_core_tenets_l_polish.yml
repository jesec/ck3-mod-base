l_polish:
 doctrine_core_tenets_name: "Dogmaty"
 tenets_name: "Dogmaty"
 #Abrahamic Tenets
 tenet_communion_name: "Komunia"
 tenet_communion_desc: "Nasze rytuały nie są czysto symboliczne – manifestują obecność samego Boga wśród nas. Ci, którzy nie mogą lub nie chcą przyłączyć się do naszych rytuałów, nie są prawdziwie wierzący."
 doctrine_parameter_tenet_communion_denied_sacrament: "[Concept('excommunicated', 'Ekskomunikowane')|E] [characters|El] praktykujące ten [rite|El] zyskują o #N 25%#! mniej punktów @piety_icon! [Concept('piety', 'pobożności')|E] i tracą #N 10#! pkt [Concept('opinion', 'opinii')|E] u osób wyznających tę samą wiarę"
 doctrine_parameter_tenet_communion_shared_table: "Organizacja aktywności, którą jest [GetActivityType('activity_feast').GetName|l], zapewnia #P 10#! pkt [Concept('opinion', 'opinii')|E] u każdego gościa wyznającego tę samą [Concept('faith', 'wiarę')|E]"
 doctrine_parameter_excommunication_active: "Duchowe [heads_of_faith|El] mogą [Concept('excommunicate', 'ekskomunikować')|E] inne postacie swojej [Concept('faiths', 'wiary')|E]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "Postacie praktykujące ten [rite|El] mogą podjąć [Concept('decision', 'decyzję')|E] „[GetDecisionWithKey('pam_decision_last_rites').GetName]”"
 doctrine_parameter_seek_indulgences_active: "Postacie tego [Concept('rite', 'obrządku')|E] mogą używać [Concept('interaction', 'interakcji')|E] #high „$seek_indulgences_interaction$”#!, o ile [faith|El] posiada [Concept('head_of_faith', 'głowę wiary')|E] lub [clerical_regions|El]"
 tenet_armed_pilgrimages_name: "Pielgrzymki zbrojne"
 tenet_armed_pilgrimages_desc: "Nasi pielgrzymi podróżują po całym świecie, aby odwiedzić miejsca święte – bez wahania chwycimy za miecz, aby chronić ich przed każdym, kto mógłby ich skrzywdzić"
 doctrine_parameter_cheaper_holy_wars_active: "Wypowiadanie [Concept('holy_wars', 'świętych wojen')|E] kosztuje [Concept('rulers', 'władców')|E] praktykujących ten [rite|El] o #P 20%#! mniej punktów @piety_icon! [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_great_holy_wars_active: "Jeśli [head_of_faith|El] istnieje, może wezwać do [Concept('great_holy_war', 'wielkiej świętej wojny')|E]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Jeśli [head_of_faith|El] nie istnieje, wyznawcy otrzymują bonus do [Concept('councillor_task', 'zadania doradcy')|El] „[convert_county|El]”, za każde kontrolowane [holy_site|El]"
 doctrine_parameter_pilgrimage_decision_active: "Postacie praktykujące ten [rite|El] zyskują premię po udanym zakończeniu [Concept('pilgrimage', 'pielgrzymki')|E]"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[leasing|E] [holdings|El] [Concept('holy_orders', 'zakonom rycerskim')|E] zapewnia dodatkowe @spiritual_fulfillment_icon! [spiritual_fulfillment|El]"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "Monastycyzm"
 tenet_monasticism_desc: "Pełny brzuch i dobry trunek jedynie odwracają nas od służby Bogu. Pustelnicze życie w odległych klasztorach to najlepszy sposób na uniknięcie doczesnych pokus."
 doctrine_parameter_take_vows_active: "[courtiers|E] mogą przyjąć śluby i zostać oddanymi"
 doctrine_parameter_devoted_trait_criminal: "Cecha [GetTrait('devoted').GetName( GetNullCharacter )|l] jest cechą [Concept('criminal', 'przestępcy')|E]"
 doctrine_parameter_cannot_take_the_vows: "Postacie praktykujące ten [rite|El] nie mogą użyć [Concept('character_interaction', 'interakcji z postacią')|E] #high „$take_vows_interaction$”#!"
 tenet_divine_marriage_name: "Uświęcone małżeństwo"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "Zawierając małżeństwo z bliskimi krewnymi, naśladujemy święte związki pierwszych istot w stworzeniu. Dobre cechy będą przekazywane naszym następnym pokoleniom i tym samym zyskamy czystość i przychylność w wiecznej walce ze złem."
 doctrine_parameter_divine_marriage_opinion: "Wyznawcy, którzy poślubili kogoś z [Concept('close_family', 'bliskiej rodziny')|E] otrzymują $VALUE|0+=$ [Concept('opinion', 'opinii')|E] od [Concept('vassals', 'wasali')|E] wyznających tę samą [Concept('faith', 'wiarę')|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Premia za małżeństwo podlegające doktrynie „[GetDoctrineType('doctrine_monogamy').GetBaseName]” zapewnia również dużą ilość @piety_icon! [Concept('piety', 'pobożności')|E], jeśli poślubiasz członka [Concept('close_family', 'bliskiej rodziny')|E]"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "Wkład do [skills|El] z [Concept('councillor_tasks', 'zadań radnego')|E] [Concept('spouse', 'małżonka')|E]: #P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Wyznawcy są znacznie mniej skłonni do tworzenia [Concept('factions', 'frakcji')|E] i dołączania do nich, jeśli są lulb mają być one nastawione przeciwko [Concept('liege', 'seniorowi')|E], który poślubił członka swojej [Concept('close_family', 'bliskiej rodziny')|E] lub [Concept('extended_family', 'dalszej rodziny')|E]"
 tenet_pacifism_name: "Pacyfizm"
 tenet_pacifism_desc: "Przemoc to odrażający czyn, który prowadzi jedynie do cierpienia, bólu i żalu. Dążąc do jej unikania, kiedy tylko jest to możliwe, możemy budować silniejsze i bezpieczniejsze społeczeństwa dla wiernych. Pacyfistyczne hrabstwa rozwijają się i prosperują w tym pokojowym porządku."
 doctrine_parameter_holy_wars_forbidden: "Nie możesz wezwać do [Concept('holy_wars', 'świętych wojen')|E] ani zorganizować [Concept('raid', 'najazdu')|E]"
 doctrine_parameter_pacifist_opinion_active: "Opinia pacyfisty: $VALUE|+=0$"
 pacifist_opinion_name: "Znajomy pacyfista"
 pacifist_county_opinion_name: "Hrabstwo znajomego pacyfisty"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[opinion|E] o innych pacyfistach: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Władcy utrzymujący stan pokoju przez co najmniej dwa lata otrzymują $VALUE|+$ pkt @piety_icon! [Concept('piety', 'pobożności')|E] każdego miesiąca"
 PIETY_LONG_PEACE: "Długi pokój"
 tenet_vows_of_poverty_name: "Śluby ubóstwa"
 tenet_vows_of_poverty_desc: "Pieniądze deprawują serca ludzi i odciągają ich od prawdziwej wiary. Musimy unikać gromadzenia dóbr materialnych, jeśli mamy skupić się na tym, co naprawdę ma znaczenie – wybierając skromne aktywności i odnajdując w nich pobożność."
 doctrine_parameter_vows_of_poverty_active: "[rulers|E] mogą [Concept('decide', 'zdecydować')|E], czy chcą złożyć śluby ubóstwa, zmniejszając miesięczny dochód z [Concept('tax', 'podatków')|E], ale zwiększając przyrost @piety_icon! [Concept('piety', 'pobożności')|E]"
 tenet_human_sacrifice_name: "Ofiary z ludzi"
 tenet_human_sacrifice_desc: "Najlepszym sposobem udowodnienia naszego oddania jest ofiara. Najcenniejszą ofiarą, jaką możemy złożyć, jest ofiara z życia ludzkiego."
 doctrine_parameter_human_sacrifice_active: "[executions|E] zapewniają @piety_icon! [piety|El] zamiast kosztować @piety_icon! [piety|El]"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[executions|E] nie kosztują @prestige_icon! [Concept('prestige', 'prestiżu')|E] w przypadku [Concept('sharing_power', 'dzielenia władzy')|E]"
 doctrine_parameter_flower_war_cb_active: "Dodaje [casus_belli|El] [flowery_war|El] przeciwko sąsiednim państwom"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "[executions|E] zapewniają dodatkową @piety_icon! [piety|El] i @spiritual_fulfillment_icon! [spiritual_fulfillment|El] zależne od [Concept('nobility', 'szlachectwa')|E] oraz [Concept('rank', 'rangi')|E] złożonej w ofierze osoby"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Znacznie zwiększona szansa pojmania postaci podczas [Concept('sieges', 'oblężeń')|E]"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Zwiększona szansa na [Concept('imprison', 'uwięzienie')|E] postaci bez ziemi"
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Makabryczne festiwale"
 tenet_gruesome_festivals_desc: "Wszyscy rodzimy się we krwi. Przetrwanie zawdzięczamy krwi naszych zwierząt, naszej rodziny i naszych wrogów. To naturalne, że [ROOT.Rite.GetFaith.PantheonTerm] to potęga, która żąda swojej należnej części."
 gruesome_festivals_active_name: "możliwość składania wielkich ofiar"
 doctrine_parameter_gruesome_festivals_active: "Odblokowuje [activity|El], którą jest [GetActivityType('activity_gruesome_festival').GetName|l], raz na dekadę, zapewniając @piety_icon! [piety|E], poddanego wyznającego tę samą [Concept('faith', 'wiarę')|E] i [Concept('county_opinion', 'powszechną opinię')|E]"
 tenet_volcanic_veneration_name: "Kult wulkanów"
 tenet_volcanic_veneration_desc: "Nie ma nic bardziej boskiego niż nowo narodzona ziemia wypluwana z ognistych otchłani naszego domu. Spędzamy życie na krawędzi katastrofy, a [ROOT.Rite.GetFaith.PantheonTerm] to siła, na której łaskę jesteśmy zdani."
 tenet_cthonic_redoubts_name: "Reduty chtoniczne"
 tenet_cthonic_redoubts_desc: "Nie ma lepszego schronienia niż korzenie Ziemi, nie ma fortecy twardszej niż jej wysokie góry, nie ma pielgrzymki bardziej świętej niż jej ukryte szlaki. Z tych wzniosłych szczytów spoglądamy na stworzenie i czujemy prawdziwą wagę boskości."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Szybkość [Concept( 'convert_county', 'nawracania hrabstwa' )|E] w [Concept( 'terrain', 'terenie' )|E] górskim: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "Szybkość [Concept( 'promote_culture', 'promowania kultury' )|E] w [Concept( 'terrain', 'terenie' )|E] górskim z tą samą [Concept( 'faith', 'wiarą' )|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Szybkość [Concept( 'convert_county', 'nawracania' )|E] wrogiego hrabstwa w [Concept( 'terrain', 'terenie' )|E] górskim: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Rytualne samobójstwo"
 tenet_consolamentum_desc: "Kiedy starzejemy się lub chorujemy, wykonujemy rytuał, aby oczyścić nasze dusze z grzechu. Gdy to nastąpi, szybko i definitywnie kończymy nasze życie, aby grzech nie miał szansy ponownie nas zainfekować."
 doctrine_parameter_consolamentum_active: "Wyznawcy mogą [Concept( 'decide', 'zdecydować' )|E] się na zakończenie swojego życia, gdy są starzy, niezdatni lub bliscy śmierci; takie postępowanie nie pociąga za sobą żadnej z normalnych kar za samobójstwo"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "Jeśli wyznawca umrze w wyniku [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('initiate_consolamentum_decision').GetName]”, jego dziedzic zyskuje #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! pkt @piety_icon! [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Twój dziedzic zyskuje dodatkowe #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! pkt @piety_icon! [Concept('piety', 'pobożności')|E] oraz modyfikator „$pam_blessed_passing_modifier$” na #P 10#! lat, jeśli umrzesz w wyniku [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('initiate_consolamentum_decision').GetName]”"
 tenet_gnosticism_name: "Gnostycyzm"
 tenet_gnosticism_desc: "Dzięki wiedzy, boska iskra, która spoczywa wewnątrz wszystkich ludzi, może zostać wyzwolona i przywrócona do swego niebiańskiego źródła w sferze duchowej."
 doctrine_parameter_granting_titles_gives_stress: "Rozdawanie [Concept('titles', 'tytułów')|E] zmniejsza poziom [Concept('stress', 'stresu')|E]"
 tenet_mendicant_preachers_name: "Żebracze kazania"
 tenet_mendicant_preachers_desc: "Nasi misjonarze przemierzają kraj wzdłuż i wszerz, mając tylko nic prócz łachmanów, które mają na sobie. Żyją z hojności tych, których odwiedzają, a w zamian dzielą się wiedzą o prawdziwej wierze."
 doctrine_parameter_mendicant_preachers_conversion_active: "Szybkość nawracania hrabstwa: #P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Nawrócenie [Concept('character', 'postaci')|E] zapewnia dodatkowe @spiritual_fulfillment_icon! [spiritual_fulfillment|El]"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "Przekonywanie [Concept('characters', 'postaci')|E] wyznających inną [Concept('faith', 'wiarę')|E] ma większą szansę powodzenia"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Goście innej [Concept('faith', 'wiary')|E] uczestniczący w twoich [Concept('activities', 'aktywnościach')|E] mogą zostać nawróceni na twoją wiarę"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Odblokowuje [Concept('interaction', 'interakcję')|E] #V „$attempt_conversion_of_local_ruler_interaction$”#! z [Concept('rulers', 'władcami')|E] w twoim obecnym [Concept('location', 'miejscu')|E]"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Odblokowuje [Concept('travel_option', 'opcje podróżną')|E] „[GetTravelOption('adventurers_proselytize_zealously_option').GetName]” bez [Concept('perk', 'atrybutu')|E] „[GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)]”"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNotMeNoTooltip] nawraca się na wiarę znaną jako [first.GetFaith.GetName|l]"
 must_be_in_same_county_tt: "Musisz znajdować się w [Concept('county', 'hrabstwie')|E] posiadanym przez tę osobę"
 tenet_communal_identity_name: "Tożsamość wspólnotowa"
 tenet_communal_identity_desc: "Nasza wiara i nasza kultura są ze sobą nierozerwalnie związane. Dzięki temu więź spajająca naszą społeczność jest szczególnie mocno, ale prowadzi to do wykluczenia obcokrajowców."
 doctrine_parameter_same_communal_identity_opinion_active: "#P +10#! [Concept('opinion', 'opinii')|E] wobec postaci tej samej [Concept('faiths', 'wiary')|E]"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "Przekonanie frakcji w trakcie [Concept('ecumenical_council', 'soboru powszechnego')|E] nie kosztuje @prestige_icon! [Concept('prestige', 'prestiżu')|E]"
 doctrine_parameter_tenet_communal_identity_sway_piety: "Zyskaj #P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! pkt [piety_i] [Concept('piety', 'pobożności')|E] za każdy udany spisek „[GetScheme('sway').GetTypeName]” przeciwko osobie praktykującej twój [rite|El]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "[scheme_success_chance|E] „[GetScheme('learn_language').GetTypeName]” przeciwko celom praktykującym twój [rite|El]: [success_chance_i] #P +20%#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "Nauczenie się [Concept('language', 'języka')|E] osoby praktykującej twój [rite|El] zapewnia @piety_icon! [piety|El] i @spiritual_fulfillment_icon! [spiritual_fulfillment|El]"
 doctrine_parameter_same_culture_conversion_bonus_active: "Szybkość nawracania [Concept('counties', 'hrabstw')|E] o tej samej [Concept('culture', 'kulturze')|E] co moja: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Rozprzestrzenianie się kultury w [Concept('counties', 'hrabstwach')|E] o tej samej [Concept('faith', 'wierze')|E] co moja: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Szybkość nawracania [Concept('counties', 'hrabstw')|E] o innej [Concept('culture', 'kulturze')|E] niż moja: #N -50%#!"
 tenet_pentarchy_name: "Eklezjarchat"
 tenet_pentarchy_alternate_name: "Pentarchia"
 tenet_pentarchy_desc: "Nasze miejsca święte to coś więcej niż tylko uświęcone sanktuaria – są to siedziby władzy, z których rządzą nasi przywódcy religijni."
 tenet_aniconism_name: "Anikonizm"
 tenet_aniconism_desc: "Kult rzeźbionych wizerunków zaślepił zbyt wielu, nie są w stanie dostrzec boskiej prawdy. Wyrzućmy wszystkie ikony z naszych świętych miejsc, aby nasi wierni nie wpadli w tę pułapkę."
 doctrine_parameter_reforging_artifacts_costs_piety: "[rulers|E] praktykujący ten [rite|El] muszą wydać @piety_icon! [piety|El], aby [reforge|El] lub [repair|El] [artifacts|El]"
 doctrine_parameter_destroying_artifacts_is_pious: "[rulers|E] praktykujący ten [rite|El] mogą niszczyć [artifacts|El] w zamian za @piety_icon! [piety|El]"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Można niszczyć [artifacts|El] w zamian za @piety_icon! [piety|El]"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Obleganie [Concept('rulers', 'władców')|E] wyznających [Concept('faith', 'wiarę')|E] bez tego [Concept('core_tenet', 'dogmatu')|E] niszczy więcej [Concept('development', 'rozwoju')|E], częściej uszkadza [Concept('artifacts', 'artefakty')|E] i zapewnia @piety_icon! [piety|El]"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Zyskaj @spiritual_fulfillment_icon! [spiritual_fulfillment|El] za niszczenie [Concept('artifacts', 'artefaktów')|E] oraz za oblężenia przeciwko [Concept('faith', 'wierze')|E] bez tego [Concept('core_tenet', 'dogmatu')|E]"
 pam_aniconism_siege_toast: "Ze względu na twój [personal_tenet|El] „[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]”"
 destroying_artifacts_is_not_pious_tt: "W twoim [Concept('rite', 'obrządku')|E] nie można niszczyć [Concept('artifacts', 'artefaktów')|E] w zamian za [piety|El]"
 artifact_is_rarer_than_masterwork_tt: "Ten [artifact|El] ma [rarity|El] wyższą niż mistrzowska"
 tenet_alexandrian_catechism_name: "Katechizm aleksandryjski"
 tenet_alexandrian_catechism_desc: "Szkoła aleksandryjska ma długą tradycję zachęcania teologów do myślenia krytycznego i kwestionowania status quo.\n\nMimo fizycznego zniszczenia szkoły kontynuujemy te tradycje."
 tenet_islamic_rationalism_name: "Muzułmański racjonalizm"
 tenet_islamic_rationalism_desc: "Skoro [ROOT.Rite.GetFaith.HighGodNameAlternatePossessive] cechuje sprawiedliwość i mądrość, nie leży w naturze [ROOT.Rite.GetFaith.HighGodNameAlternatePossessive] iść wbrew rozumowi ani lekceważyć dobra własnego dzieła. Tylko dzięki czystemu rozumowi możemy mieć nadzieję na zrozumienie naszej roli w tym wielkim dziele [ROOT.Rite.GetFaith.HighGodNameAlternatePossessive] i rozróżnienie dobra od zła."
 doctrine_parameter_scholasticism_is_holy: "[trait|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] zapewnia dodatkowe premie"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Dzieci kształcone z [Concept('education_focus', 'priorytetem edukacji')|E] w zakresie [Concept('learning', 'nauki')|E] mogą wchodzić w dorosłość z [Concept('experience', 'doświadczeniem')|E] w [Concept('learning_lifestyle', 'naukowym stylu życia')|E] częściej, gdy postać sama posiada wysokie wykształcenie"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "Szybkość nawracania hrabstwa: #P +25%#!"
 tenet_hedonistic_name: "Hedonizm"
