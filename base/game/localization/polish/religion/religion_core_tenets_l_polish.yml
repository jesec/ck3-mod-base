 tenet_religious_legal_pronouncements_hisbah: "Hisba"
 tenet_religious_legal_pronouncements_fatwa: "Fatwa"
 tenet_religious_legal_pronouncements_halakha: "Halacha"
 tenet_religious_legal_pronouncements_desc: "Granica między argumentami teologicznymi a prawnymi jest cienka, a kwestie duchowe mogą i powinny być uwzględniane w rozstrzygnięciach świeckich. Władca może dążyć do religijnego potępienia każdego dorosłego bezpośredniego [Concept('vassal', 'wasala')|E] tej samej [Concept('religion', 'religii')|E], lecz wynik zależy od [Concept('learning', 'nauki')|E] władcy i historii moralnej wasala."
 doctrine_parameter_temporal_condemnation_enabled: "Władcy mogą próbować potępić dorosłych [Concept('vassals', 'wasali')|E] bezpośrednich wyznających tę samą [Concept('religion', 'religię')|E]. Im bardziej [Concept('sinful', 'grzeszny')|E] jest wasal, tym mniej [Concept('learning', 'nauki')|E] wymaga jego władca, podczas gdy [virtuous|El] cechy utrudniają sukces."
