 petition_head_of_faith_excommunication_tooltip: "$petition_head_of_faith_decision_option_excommunication_desc$"
 petition_head_of_faith_costs_refunded: "Zwrócono koszty petycji"
 unavailable_petition_head_of_faith: "oczekiwanie na formalną petycję"
 petition_head_of_faith_reclaim_offering_tt: "#weak Kwota przeznaczona na tę petycję zostaje ci zwrócona:#!"
 # Invalidation event
 petition_head_of_faith.0601.t: "Porzucono petycję"
 petition_head_of_faith.0601.desc.no_head: "Zanim uda mi się przygotować do przedstawienia sprawy, nie będzie już duchowego pasterza, który mógłby przyjąć moją petycję."
 petition_head_of_faith.0601.desc.head_dead: "[recipient.GetTitledFirstName] umiera, zanim udaje mi się przedstawić moją petycję."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName] – ta osoba jest uwięziona i nie może odbierać formalnych petycji."
 petition_head_of_faith.0601.desc.head_changed: "Zmieniła się głowa mojej wiary. [recipient.GetTitledFirstName] nie może już odebrać mojej petycji."
 petition_head_of_faith.0601.desc.at_war: "Nie mogę składać formalnych petycji, kiedy prowadzę wojnę przeciwko osobie znanej jako [recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.repentance_resolved: "Nie ma już żadnej ekskomuniki, którą mogę znieść."
 petition_head_of_faith.0601.desc.repentance_too_soon: "Moja skrucha nie zostałaby przyjęta tak prędko po ostatniej naganie."
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.GetTitledFirstName] umiera, zanim udaje się przedstawić [petition_target.Custom('PL_jemu_jej')] petycję."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName] nie należy już do mojej wiary, więc nie mogę poprosić o formalną ekskomunikę."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName] nie jest już królem ani wielkim władcą, a zatem ta petycja już [petition_target.Custom('PL_go_jej')] nie dotyczy."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "Osoba znana jako [petition_target.GetTitledFirstName] została już ekskomunikowana."
 petition_head_of_faith.0601.desc.fallback: "Moja petycja nie może już zostać rozpatrzona, a cała podróż kończy się fiaskiem."
 petition_head_of_faith.0601.desc.refund.piety: "Odzyskuję ofiarę, która została złożona na poczet tej petycji."
 petition_head_of_faith.0601.desc.refund.none: "Przynajmniej nic nie przeszło jeszcze z rąk do rąk."
 petition_head_of_faith.0601.a: "Niechaj tak będzie."
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "Petycja: skrucha"
 petition_head_of_faith.1000.t.excommunication: "Petycja: ekskomunika"
 petition_head_of_faith.1000.desc.court_low_grandeur: "Niegdyś wspaniały pałac leży wokół mnie w ruinie. Modlę się, aby nie odzwierciedlało to duchowej nędzy osoby znanej jako [recipient.GetFaith.ReligiousHeadName].\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "Słynący z wielkich sala pałac po wejściu napełnia pokorą. Modlę się, by te niebiańskie złocenia były odbiciem sprawiedliwości i duchowych bogactw, jakie skrywa w swym wnętrzu.\n\n"
 petition_head_of_faith.1000.desc.intro: "To tutaj zasiada wiceregent Boga na ziemi. "
 petition_head_of_faith.1000.desc.recipient_sinful: "Choć dobrze wiadomo, że to osoba [petition_hof_gravest_sin.GetName(recipient)|l], to dzięki jakimś diabelskim sztuczkom udało jej się zająć tron świętego Piotra."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Z pewnością osąd tej osoby będzie kierowany tym, jak [petition_hof_gravest_virtue.GetName(recipient)|l] jest jej natura."
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.GetHerHis|U] wątłe zdrowie jest bez wątpienia owocem życia wypełnionego szlachetną pracą."
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.GetHerHis|U] wątłe zdrowie jest bez wątpienia owocem życia pełnego zgubnych ekscesów."
 petition_head_of_faith.1000.desc.address: "\n\nPrzedstawiam [recipient.Custom('PL_mu_jej')] swoją prośbę: – Niech wasza świątobliwość raczy posłuchać. "
 petition_head_of_faith.1000.desc.repentance: "Przychodzę w pokorze, prosząc o zwolnienie z kary nałożonej na mą duszę i przywrócenie mnie do grona wiernych."
 petition_head_of_faith.1000.desc.excommunication: "Osoba znana jako [petition_target.GetTitledFirstName] popełniła zbrodnie przeciw Bogu. Ja przychodzę tu jako pokorny posłaniec; osądzenie jej nieśmiertelnej duszy leży oczywiście w waszej gestii."
 petition_head_of_faith.1000.a.argue: "Przedstawię swoją sprawę."
 petition_head_of_faith.1000.a.argue_tt: "Spróbuj przekonać osobę znaną jako [recipient.GetShortUINameNotMeNoTooltip] podczas audiencji"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n– Wysłuchaliśmy cię, moje dziecko. Przedstaw szczegóły swojej prośby, a my przyjmiemy ją z życzliwością."
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n– Twoja petycja została nam przedłożona. Orzekniemy zgodnie z prawem kanonicznym i wymogami Kościoła Świętego."
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n– Piękne słowa łatwo wypowiedzieć. Przyjmujemy twą petycję z rezerwą, jakiej wymaga nasz Pan."
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n– Na wiele sobie pozwalasz, przychodząc tutaj. Dobrze zważ swoje następne słowa."
 petition_head_of_faith.1000.desc.conclusion: "– mówi [recipient.GetName], trwając w oczekiwaniu."
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "Petycja: [actor.GetTitledFirstNameNoTooltip] i skrucha"
 petition_head_of_faith.1310.desc.intro: "– Wasza świątobliwości, ekskomunikowano mnie, pozbawiono dostępu do sakramentów i odcięto od innych wiernych. Błagam was, zdejmijcie karę z mej duszy i przywróćcie mnie do wspólnoty – mówi [actor.GetTitledFirstName], klęcząc.\n\n– Okaż skruchę przed Bogiem – odpowiadam."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n– Wasza świątobliwość okazała mi kiedyś miłosierdzie. Nie proszę o ziemskie przysługi, a jedynie o to, aby Bóg i Kościół Święty dostrzegli szczerość mej skruchy."
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n– Stoję przed Bogiem jak każdy skruszony grzesznik i proszę jedynie o sprawiedliwość zgodną z prawem kanonicznym."
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n– Niech wasza świątobliwość nie myśli o mnie jak o [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], który słodkimi słowami prowadzi na manowce. Przysięgam przed obliczem [ROOT.Char.GetFaith.HighGodNamePossessive], a także namiestnika na ziemi, że okazuję skruchę."
 petition_head_of_faith.1310.serpent.christian: "wężu w ogrodzie"
 petition_head_of_faith.1310.serpent.generic: "wężu"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n– Byliśmy sobie wrogami na tym świecie. Nie proszę o dobre słowa na mój temat w sprawach doczesnych, ale o uznanie mej pokuty i nienarażanie mej duszy."
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n– Docierają do nas wieści, że z ciebie [petition_gravest_sin.GetName(actor)|l] osoba. Piękne słowa nie wystarczą przy splamionej duszy. Jakie zadośćuczynienie proponujesz?"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n– Niewiele występków splamiło twe imię. Być może zakaz spełnił swoją zbawienną rolę. Zobaczymy, czy twoja dusza dorównuje twojej postawie."
 petition_head_of_faith.1310.a: "– Powstań, moje dziecko. Przywracam cię do wspólnoty wiernych."
 petition_head_of_faith.1310.b: "– Twoja kara pozostaje w mocy. Wróć, gdy twoja skrucha będzie widoczna gołym okiem."
 petition_head_of_faith.1320.t: "Petycja: ekskomunika osoby znanej jako [petition_target.GetTitledFirstNameNoTooltip]"
 petition_head_of_faith.1320.desc.intro: "– Wasza świątobliwości, ma na sumieniu [petition_target.GetTitledFirstName] zbrodnie przeciwko Bogu. Jeśli nie wyplenimy tej zgnilizny, dusze nas wszystkich będą w niebezpieczeństwie – mówi [actor.GetTitledFirstName].\n\n– Ekskomunika nie jest prywatną bronią w rękach księcia. Przedstaw jasno swoje zarzuty przed Bogiem – odpowiadam."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n– Wasza świątobliwość okazała mi kiedyś miłosierdzie. Nie proszę o ziemskie przysługi, a jedynie o to, aby Bóg i Kościół Święty dostrzegli wykroczenia, jakich dopuszcza się [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n– Przedstawiam te zarzuty przed Bogiem jako sługa Pana Jezusa Chrystusa i proszę jedynie o to, co przewiduje sprawiedliwość Kościoła Świętego."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n– Niech wasza świątobliwość nie myśli o mnie jak o wężu w ogrodzie, który słodkimi słowami chce rozstrzygnąć prywatną zwadę. Przysięgam przed obliczem [ROOT.Char.GetFaith.HighGodNamePossessive], a także wiceregentem Boga na ziemi, że zarzuty te nie są bezpodstawne."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n– Byliśmy sobie wrogami na tym świecie, lecz proszę, osądź duszę osoby znanej jako [petition_target.GetTitledFirstNameNoTooltip] tak, jak wymaga tego prawo kanoniczne."
 petition_head_of_faith.1320.desc.target_sinful: "Za zgniliznę grzechów, które popełnia [petition_target.GetTitledFirstNameNoTooltip], odpowiada [petition_target.Custom('PL_jego_jej')] [petition_gravest_sin.GetName(petition_target)|l] natura."
 petition_head_of_faith.1320.desc.finish: "– kończy [actor.GetTitledFirstName]."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNameNoTooltip] skrzętnie ukrywa swoją niegodziwość, ale wierzę, że przy pomocy Pana [petition_target.Custom('PL_jego_jej')] grzechy wyjdą na jaw."
 petition_head_of_faith.1320.a: "– Wykluczam [petition_target.Custom('PL_go_ja')] ze wspólnoty wiernych."
 petition_head_of_faith.1320.b: "– Twoje argumenty nie są przekonujące. Nie nałożę na [petition_target.Custom('PL_niego_nia')] żadnej kary."
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "Ogłoszono ekskomunikę"
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName] wstaje, by wymierzyć sprawiedliwość w imieniu Pana:\n\n– Osoba znana jako [petition_target.GetTitledFirstName] zostaje ekskomunikowana i odcięta od grona wiernych, a jej dusza będzie w niebezpieczeństwie tak długo, aż okaże prawdziwą skruchę."
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName] przemawia przez swojego sługę."
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "Odrzucona petycja"
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName] wstaje, by wymierzyć sprawiedliwość w imieniu Pana:\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "– Grzechy, o których mówisz, nie są wystarczająco poważne, by zasługiwały na tak straszliwą karę. [petition_target.GetTitledFirstName] nie otrzyma z moich rąk ekskomuniki."
 petition_head_of_faith.2030.desc.finesse: "– Nie wyrzucamy wiernych za pieniądze księcia. Za to, co należy do Cezara, nie można kupić osądów [recipient.GetFaith.HighGodNamePossessive]."
 petition_head_of_faith.2030.desc.learning_duel: "– Chcesz sprawić, że [petition_target.GetTitleAsNameNoTooltip] celowo wypaczy prawo kanoniczne? [petition_target.GetTitledFirstName] nie otrzyma ekskomuniki tylko przez… twoją erudycję."
 petition_head_of_faith.2030.desc.fallback: "– Pozwalasz sobie na zbyt wiele! [petition_target.GetTitledFirstName] nie otrzyma ekskomuniki. Nie widzę ku temu powodu."
 petition_head_of_faith.2030.a: "Wygląda na to, że [recipient.GetFaith.HighGodName] przemawia przez swojego sługę."
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "Argument"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "– Czy możesz udowodnić przewiny osoby znanej jako [petition_target.GetTitledFirstNameNoTooltip], powołując się na Pismo Święte i prawo kanoniczne? Czy ta osoba kłaniała się przed figurami bożków?"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "– Czy oskarżysz osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip] u stóp kamiennego krzyża?"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "– Czy [petition_target.GetTitledFirstNameNoTooltip] nie zasługuje na łaskę Matki Bożej? Czy twoja własna szata jest nieskalana?"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "– Czy pragniesz, abyśmy wykluczyli osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip] z liturgii świętej na podstawie prywatnych sporów, a nie w oparciu o dowody popełnienia ciężkiego grzechu?"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "– Czy chcesz odsunąć osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip] od ołtarza Chrystusa? Odmówić jej pokarmu w postaci ciała naszego Pana? Czy nie powinna ona już pić jego krwi?"
 petition_head_of_faith.2000.desc.atmosphere_communion: "– Czy uznajesz za stosowne wykluczyć osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip] ze wspólnoty wiernych?"
 petition_head_of_faith.2000.desc.atmosphere_confession: "– Czy chcesz, żebyśmy działali przeciwko osobie znanej jako [petition_target.GetTitledFirstNameNoTooltip] na podstawie tego, co ujawniła w konfesjonale pod tajemnicą spowiedzi?"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "– Chcesz, żebyśmy wykluczyli osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip] ze wspólnoty, nim sprawdzimy, czy łagodniejsze środki nie zawiodą w próbie odwrócenia jej od grzechu?"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "– Czy odwołasz się do autorytetu apostołów i sprawisz, byśmy potępili osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip] zarówno na ziemi, jak i w niebie?"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "– Przeszkadzasz nam w studiowaniu kanonów po to, byśmy potępili osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip]. Czy twoja retoryka opiera się na pismach Ojców Kościoła i Piśmie Świętym?"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "– Czy chcesz nastawić nas przeciwko osobie znanej jako [petition_target.GetTitledFirstNameNoTooltip] z powodu przelanej przez nią w okresie świętym krwi, czy może aktów przemocy na terenach kościelnych? Czy osoba ta naruszyła pokój i Rozejm Boży?"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "– Czy twoja skarga przeciwko osobie znanej jako [petition_target.GetTitledFirstNameNoTooltip] powinna być rozpatrywana właśnie tutaj? Czyż nie lepiej by było, gdybyście pod wspólnym Krzyżem wyruszyli na wojnę z wrogami Chrystusa?"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "– Przychodzisz do nas, abyśmy wykluczyli ze wspólnoty osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip], podczas gdy my, pięć patriarchalnych tronów, próbujemy utrzymać jedność w podzielonym chrześcijaństwie? Czy wierzysz, że wszyscy [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] poprą twoje zarzuty?"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "– Czy osoba znana jako [petition_target.GetTitledFirstNameNoTooltip] dopuściła się zniewagi czci oddawanej męczennikom, jawnie nimi pogardzając?"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "– Chcesz, żebyśmy wygnali osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip]. Daj nam choć poszlakę, że dopuściła się ona lenistwa i nieposłuszeństwa, bowiem bezczynność właśnie jest wrogiem duszy."
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "– Chcesz, żebyśmy potępili osobę znaną jako [petition_target.GetTitledFirstNameNoTooltip], jak gdyby ona jedyna odziedziczyła winę Adama? Każda dusza przychodzi na świat naznaczona upadkiem, a jednak Kościół nie wyklucza nikogo, z wyjątkiem tych, którzy rozkoszują się swoimi grzesznymi skłonnościami"
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "– Przychodzicie tu w bogatych szatach, głośno domagając się sprawiedliwości wobec osoby znanej jako [petition_target.GetTitledFirstNameNoTooltip], podczas gdy nasi bracia wędrują wśród biednych, nie mając nic prócz własnego odzienia. Czy żebraczy brat nie doradziłby raczej cierpliwości, czy może grzech jest aż tak wielki?"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "– Odmówisz sakramentu osobie, którą jest [petition_target.GetTitledFirstNameNoTooltip]. Chcesz zagrozić jej obecności w bogactwie życia wiecznego z Chrystusem w Niebie? To tu, na ziemi, staramy się złożyć przysięgę życia w ubóstwie."
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "– Chcesz nas zmusić, aby wyrzucić żołnierza Chrystusa do świata jego wroga?"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "– W jaki sposób Kościół Święty ma rozstrzygnąć twój spór z osobą, którą jest [petition_target.GetTitledFirstNameNoTooltip]?"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n– Musisz zrozumieć, że nie wykorzystujemy ekskomuniki jako prywatnego oręża księcia. To my uznamy, w jaki sposób należy wymierzyć sprawiedliwość. Rozmów się z Bogiem w swojej sprawie! – żąda [recipient.Custom('PL_jego_jej')] świątobliwość."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nZdawało mi się, że [recipient.GetFaith.GetReligiousHeadTitle.GetName] musi wypowiadać się bezstronnie. To oczywiste, że wieść o grzesznej naturze osoby znanej jako [petition_target.GetTitledFirstNameNoTooltip] dotarła już za te święte mury. Wystarczy, że potwierdzę jej przewinienia."
 petition_head_of_faith.2000.desc.target_clean: "\n\nWygląda na to, że [recipient.GetTitledFirstName] wie o bezgrzesznym życiu osoby, którą jest [petition_target.GetTitledFirstNameNoTooltip]. Nie mając dowodów niegodziwości, które można by pokazać w sądzie, muszę szukać innej drogi do upragnionej sprawiedliwości."
 OIKOUMENE_GLOSS: "Z greckiego „zamieszkały świat”. W mowie wschodniorzymskiej #bold ekumena#! oznaczała cywilizowany świat: cesarstwo oraz szerszy porządek chrześcijański, nad którym pieczę sprawował Kościół."
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "Wyznaj przed Bogiem, że [petition_target.GetTitledFirstNameNoTooltip] dopuszcza się grzechu [petition_gravest_sin.GetName(petition_target)|l]."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Wymień przed Bogiem grzechy osoby, którą jest [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.2000.b.finesse: "– Kościół ma wiele potrzeb. Pozwól mi się nimi zająć."
 petition_head_of_faith.2000.c.learning_duel: "Posłużę się niszowym cytatem z Pisma Świętego, aby zmylić niegodziwą osobę, którą jest [petition_target.GetTitleAsNameNoTooltip]."
 petition_head_of_faith.2000.d.hook: "Przypomnij osobie, którą jest [recipient.GetFaith.ReligiousHeadName], o pewnych… sprawach osobistych."
 petition_head_of_faith.2000.e.withdraw: "…być może to sprawa pomiędzy osobami, którymi są [petition_target.GetFaith.HighGodName] i [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.5000.e.withdraw: "…być może potrzebuję więcej czasu na przygotowania."
 petition_head_of_faith_hook_committed_tt: "Wykorzystujesz [Concept('hook', 'haka')|E], aby to zorganizować"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip] to osoba raczej cnotliwa niż grzeszna"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName] daje się namówić"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName] daje się przekonać"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName] nie daje się przekonać"
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName] obraża się"
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName] odrzuca twój argument"
 petition_head_of_faith_affronted_opinion: "Urażono łapówką"
 petition_head_of_faith_affronted_opinion_desc: "Ta postać została urażona przez petenta, który rzekomo miał kupić osąd religijny za złoto."
 petition_head_of_faith_dismissed_debate_opinion: "Obojętność wobec argumentu"
 petition_head_of_faith_dismissed_debate_opinion_desc: "Ta postać odprawiła petenta, którego naciągana interpretacja prawa kanonicznego nie była przekonująca."
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "Dążenie do rozgrzeszenia"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Wyrusz w podróż do swojej [Concept('head_of_faith', 'głowy wiary')|E] i błagaj o zniesienie [Concept('excommunication', 'ekskomuniki')|E]."
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Wyruszysz w podróż do miejsca znanego jako [recipient.GetCapitalLocation.GetName] i oficjalnie złożysz petycję do osoby, którą jest [recipient.GetTitledFirstName], o zniesienie swojej [Concept('excommunication', 'ekskomuniki')|E]."
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "Spowiedź"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "– Przychodzisz po rozgrzeszenie, a kłaniasz się bożkom, wiedząc, że tylko Pismo Święte i pokuta cię oczyszczą?"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "– Mam nadzieję, że przychodzisz błagać o rozgrzeszenie u stóp kamiennego krzyża."
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "– Matka Boża jest pełna łaski, ale nie możemy uwolnić cię od potępienia wyłącznie ze względu na Nią."
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "– Znów liczysz na Boską Liturgię. Zastanów się, co stało między tobą a ołtarzem i wiernymi."
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "– Odmówiono ci dostępu do ołtarza Chrystusowego oraz pokarmu Jego Ciała i Krwi."
 petition_head_of_faith.5000.desc.atmosphere_communion: "– Wykluczono cię ze wspólnoty wiernych."
 petition_head_of_faith.5000.desc.atmosphere_confession: "– Sakrament spowiedzi wymaga pełnego i szczerego wyznania."
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "– Ekskomunika jest lekarstwem Kościoła. Darem, dzięki któremu poprawisz swoje życie i skrócisz czas oczyszczenia duszy."
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "– Mamy klucze Piotrowe. Ta władza może cię uwolnić, jeśli rzeczywiście okażesz skruchę."
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "– Szukasz pojednania. Zadośćuczyń prawu zgodnie z rozdziałem i dystynkcją z Dekretu."
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "– Czy twoim grzechem było złamanie pokoju i rozejmu Bożego? Przelanie krwi w świętym czasie?"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "– Jeśli przyjmujesz krzyż w swoim imieniu, a mimo to wyrządzasz szkodę chrześcijaństwu, jest to jawne naruszenie prawa."
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "– Pięć patriarszych tronów przygląda się. Nie będziemy ujmować znaczeniu rozgrzeszenia, gdy cała [Glossary( 'ekumena', 'OIKOUMENE_GLOSS' )] obserwuje."
 petition_head_of_faith.5000.desc.atmosphere_dulia: "– Męczennicy zasłużyli na swoje miejsce w niebie, oddając swoją krew."
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "– Bezczynność jest wrogiem duszy. Klękaj nie tylko w skrusze, ale okazując też gotowość na pokutę, modlitwę i trud."
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "– Wszyscy rodzimy się w grzechu. Po co dokładać do tego dziedzictwa świeżą niegodziwość?"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "– Nasi bracia wędrują wśród ubogich, nie mając nic prócz wyświechtanych habitów."
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "– Na ziemi dążymy do ślubów ubóstwa. Bogactwo ani ranga nie odkupią sakramentów."
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "– Nosisz krzyż na piersi, a jednocześnie obrażasz chrześcijaństwo."
 petition_head_of_faith.5000.desc.atmosphere_fallback: "– Twoja długa pielgrzymka sama w sobie nie zapewni rozgrzeszenia."
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n– Musisz wiedzieć, że nie uwalniamy od potępienia na pokaz ani dla pochlebstwa. Okaż jawnie swoją skruchę przed Bogiem! – żąda [recipient.Custom('PL_jego_jej')] świątobliwość."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nDopuszczam się grzechu [petition_gravest_sin.GetName(actor)|l], taka moja natura. Wieść o tym na pewno dotarła za te święte mury."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nBez obnażenia wielkiej niegodziwości sąd z pewnością uzna, że ekskomunika spełniła swe zbawienne zadanie."
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "Wyznaj swoje grzechy, nie ukrywaj niczego."
 petition_head_of_faith.5000.b.canon_law: "Argumentuj, że prawo kościelne wymaga twojego pojednania."
 petition_head_of_faith.5000.c.weep: "Oddaj się łasce sądu."
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName] wzrusza się"
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName] nie wzrusza się"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName] akceptuje twoją spowiedź"
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.GetFaith.ReligiousHeadName] nie wierzy w twoje słowa"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.GetFaith.ReligiousHeadName] wzrusza się twoją pokorą"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.GetFaith.ReligiousHeadName] nie wzrusza się twoim wystąpieniem"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "Udzielono rozgrzeszenia"
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName] wstaje, by wymierzyć sprawiedliwość w imieniu Pana:\n\n– Powstań, moje dziecko. Przywracam cię do wspólnoty wiernych. Klątwa nałożona na twoją duszę zostaje zniesiona."
 petition_head_of_faith.5020.a: "To dzięki łasce [recipient.GetFaith.HighGodNamePossessive]."
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "Nie udzielono rozgrzeszenia"
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName] wstaje, by wymierzyć sprawiedliwość w imieniu Pana:\n\n"
 petition_head_of_faith.5030.desc.confess: "– Twoja spowiedź to puste słowa."
 petition_head_of_faith.5030.desc.canon_law: "– Twoja nędzna nauka jest odbiciem twojej duszy."
 petition_head_of_faith.5030.desc.weep: "– Łzy nie świadczą o pokucie."
 petition_head_of_faith.5030.desc.fallback: "– Zbyt wiele sobie pozwalasz."
 petition_head_of_faith.5030.desc.conclusion: " Nie uwalniam cię od potępienia."
 petition_head_of_faith.5030.a: "Wygląda na to, że [recipient.GetFaith.HighGodName] przemawia przez swojego sługę."
