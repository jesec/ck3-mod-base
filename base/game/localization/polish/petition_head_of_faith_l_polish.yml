l_polish:
 petition_head_of_faith_decision: "Złóż petycję do osoby, którą jest [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 petition_head_of_faith_decision_desc: "Wyrusz na dwór swojej [Concept('head_of_faith', 'głowy wiary')|E] i przedstaw formalną petycję."
 petition_head_of_faith_decision_tooltip: "Wyrusz w podróż do swojej [Concept('head_of_faith', 'głowy wiary')|E], aby złożyć petycję o przysługę"
 petition_head_of_faith_decision_head_of_faith_exists: "Twoja [faith|El] ma obecnie [Concept('head_of_faith', 'głowę wiary')|E]"
 NOT_petition_head_of_faith_decision_head_of_faith_exists: "Twoja [faith|El] nie ma obecnie [head_of_faith|E]"
 petition_antipope_decision: "$anti_religious_head_name$ – przedstaw petycję tej osobie"
 petition_antipope_decision_desc: "$anti_religious_head_name$ – udaj się na dwór tej osoby i przedstaw oficjalną petycję. [ROOT.Char.GetFaith.ReligiousHeadTitleName] w miejscu o nazwie [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetName] nie jest już stroną, do której mogę udać się z petycją."
 petition_antipope_decision_tooltip: "Wyrusz w podróż do swojego [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E], aby złożyć petycję dotyczącą przysługi"
 petition_antipope_decision_confirm: "Przygotuj petycję"
 petition_head_of_faith_decision_effects_major_piety: "Wydaj [piety_i] [EmptyScope.ScriptValue('major_piety_value')|V0] pkt [Concept('piety', 'pobożności')|E] podczas przygotowywania petycji. Punkty zostaną zwrócone, jeśli się wycofasz, anulujesz [travel|El] lub porzucisz złożenie petycji. Punkty zostaną #EMP utracone#!, jeśli przedstawisz swoją sprawę i nie uda ci się przekonać osoby, którą jest [petition_recipient.GetShortUINameNotMeNoTooltip]."
 petition_head_of_faith_decision_effects_massive_piety: "Wydaj [piety_i] [EmptyScope.ScriptValue('massive_piety_value')|V0] pkt [Concept('piety', 'pobożności')|E] podczas przygotowywania petycji. Punkty zostaną zwrócone, jeśli się wycofasz, anulujesz [travel|El] lub porzucisz złożenie petycji. Punkty zostaną #EMP utracone#!, jeśli przedstawisz swoją sprawę i nie uda ci się przekonać osoby, którą jest [petition_recipient.GetShortUINameNotMeNoTooltip]."
 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.GetShortUINameNotMe] #P z dużym prawdopodobieństwem zaakceptuje#! tę petycję #weak (w oparciu o [petition_recipient.Custom('PL_jego_jej')] [Concept('opinion', 'opinię')|E] na twój temat; można na nią wpłynąć podczas audiencji)#!"
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.GetShortUINameNotMe] #P może zaakceptować#! tę petycję #weak (w oparciu o [petition_recipient.Custom('PL_jego_jej')] [Concept('opinion', 'opinię')|E] na twój temat; można na nią wpłynąć podczas audiencji)#!"
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.GetShortUINameNotMe] #N może odrzucić#! tę petycję #weak (w oparciu o [petition_recipient.Custom('PL_jego_jej')] [Concept('opinion', 'opinię')|E] na twój temat; można na nią wpłynąć podczas audiencji)#!"
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.GetShortUINameNotMe] #N z dużym prawdopodobieństwem odrzuci#! tę petycję #weak (w oparciu o [petition_recipient.Custom('PL_jego_jej')] [Concept('opinion', 'opinię')|E] na twój temat; można na nią wpłynąć podczas audiencji)#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak [traits|E] twojego celu, uznawane przez wiarę znaną jako [petition_recipient.GetFaith.GetName|l] za [sinful|El] i [virtuous|El], wpłyną na twoje możliwości argumentacji podczas audiencji.#!"
 petition_head_of_faith_decision_hook_available: "Użyj swojego [Concept('hook', 'haka')|E] na osobie znanej jako [petition_recipient.GetTitledFirstName], aby zrezygnować z ponoszenia kosztu w postaci [Concept('piety', 'pobożności')|E]"
 petition_head_of_faith_decision_cost_major_piety: "Wymaga [piety_i] [EmptyScope.ScriptValue('major_piety_value')|V0] pkt [Concept('piety', 'pobożności')|E] lub [Concept('hook', 'haka')|E]"
 NOT_petition_head_of_faith_decision_cost_major_piety: "$petition_head_of_faith_decision_cost_major_piety$"
 petition_head_of_faith_decision_cost_massive_piety: "Wymaga [piety_i] [EmptyScope.ScriptValue('massive_piety_value')|V0] pkt [Concept('piety', 'pobożności')|E] lub [Concept('hook', 'haka')|E]"
 NOT_petition_head_of_faith_decision_cost_massive_piety: "$petition_head_of_faith_decision_cost_massive_piety$"
 petition_head_of_faith_decision_confirm: "Przygotuj petycję"
 petition_head_of_faith_excommunication_setup_interaction: "Zażądaj ekskomuniki"
 petition_head_of_faith_excommunication_setup_interaction_extra_icon: "$hook_extra_icon$"
 recipient_secondary_petition_head_of_faith_excommunication_setup_interaction: "Cel"
 petition_head_of_faith_excommunication_setup_interaction_accept_tt: "Wyruszysz w podróż do miejsca znanego jako [recipient.GetCapitalLocation.GetName] i złożysz petycję do osoby, którą jest [recipient.GetTitledFirstName], o [Concept('excommunicate', 'ekskomunikowanie')|E] osoby znanej jako [secondary_recipient.GetTitledFirstName]"
 petition_head_of_faith_decision_option_repentance: "Znieś ekskomunikę"
 petition_head_of_faith_decision_option_excommunication: "Zażądaj ekskomuniki"
 petition_head_of_faith_decision_option_repentance_desc: "Poproś o zniesienie nałożonej na ciebie [Concept('excommunication', 'ekskomuniki')|E]."
 petition_head_of_faith_decision_option_excommunication_desc: "Poproś o nałożenie [Concept('excommunication', 'ekskomuniki')|E] na innego [Concept('ruler', 'władcę')|E], wyznającego twoją [Concept('faith', 'wiarę')|E]."
