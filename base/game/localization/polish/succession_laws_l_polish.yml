 female_only_law: "Tylko kobiety"
 male_only_law_subname: "Agnatyzm"
 male_preference_law_subname: "Agnato-kognatyzm"
 equal_law_subname: "Kognatyzm"
 female_preference_law_subname: "Enato-kognatyzm"
 female_only_law_subname: "Enatyzm"
 male_only_law_effects: "$EFFECT_LIST_BULLET$Kobiety zostają wykluczone z dziedziczenia\n$EFFECT_LIST_BULLET$Kobiety nie mogą dziedziczyć [Concept('claims', 'roszczeń')|E]\n$EFFECT_LIST_BULLET$Męscy [rulers|El] mogą posiadać [Concept('concubines', 'konkubiny')|E] lub wiele [Concept('spouses', 'małżonek')|E], jeżeli ich [faith|El] ma [Concept('doctrine', 'doktrynę')|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]” lub „[GetDoctrineType('doctrine_polygamy').GetBaseName]”"
 male_preference_law_effects: "$EFFECT_LIST_BULLET$Mężczyźni mają pierwszeństwo przed kobietami w kolejce do dziedziczenia\n$EFFECT_LIST_BULLET$Męscy [rulers|El] mogą posiadać [Concept('concubines', 'konkubiny')|E] lub wiele [Concept('spouses', 'małżonek')|E], jeżeli ich [faith|El] ma [Concept('doctrine', 'doktrynę')|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]” lub „[GetDoctrineType('doctrine_polygamy').GetBaseName]”"
 equal_law_effects: "$EFFECT_LIST_BULLET$Mężczyźni i kobiety mają równe prawo do dziedziczenia\n$EFFECT_LIST_BULLET$Wszyscy [rulers|El] mogą posiadać [concubines|El] lub [Concept('spouses', 'małżonków')|E], jeżeli ich [faith|El] ma [Concept('doctrine', 'doktrynę')|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]” lub „[GetDoctrineType('doctrine_polygamy').GetBaseName]”"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$Kobiety mają pierwszeństwo przed mężczyznami w kolejce do dziedziczenia\n$EFFECT_LIST_BULLET$[rulers|E] płci żeńskiej mogą posiadać [Concept('concubines', 'konkubentów')|E] lub wiele [Concept('spouses', 'małżonków')|E], jeżeli ich [faith|El] ma [Concept('doctrine', 'doktrynę')|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]” lub „[GetDoctrineType('doctrine_polygamy').GetBaseName]”"
 female_only_law_effects: "$EFFECT_LIST_BULLET$Mężczyźni są pozbawieni prawa do dziedziczenia\n$EFFECT_LIST_BULLET$Mężczyźni nie mogą dziedziczyć [Concept('claims', 'roszczeń')|E]\n$EFFECT_LIST_BULLET$[rulers|E] płci żeńskiej mogą mieć [Concept('concubines', 'konkubentów')|E] lub wielu [Concept('spouses', 'małżonków')|E], jeżeli ich [faith|El] ma [Concept('doctrine', 'doktrynę')|E] „[GetDoctrineType('doctrine_concubines').GetBaseName]” lub „[GetDoctrineType('doctrine_polygamy').GetBaseName]”"
 gender_preference_law_not_for_clergy_tt: "[rulers|E] duchowni i teokratyczni mogą stosować wyłącznie takie [gender_law|El], jak „[GetLaw('male_only_law').GetName]”, „[GetLaw('female_only_law').GetName]” lub „[GetLaw('equal_law').GetName]”, zgodnie z tym, co nakazuje [doctrine|El] płci duchowieństwa w ich [Concept('rite', 'obrządku')|E]"
 SUCCESSION_FORM_NAME: "[Character.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName] – [Character.GetActiveLawInGroupWithFlag('succession_order_laws').GetName|l]"
 feudal_elective_succession_law: "Elekcja feudalna"
 princely_elective_succession_law: "Elekcja książęca"
 feudal_elective_succession_law_effects: "[ruler|E] i wszyscy bezpośredni [Concept( 'vassals', 'wasale' )|E] [de_jure|El] z [Concept( 'title', 'tytułem' )|E] niższym o jedną lub dwie [Concept( 'ranks', 'rangi' )|E], mogą nominować [Concept( 'title_heir', 'sukcesora tytułu' )|E] spośród siebie oraz [Concept( 'close_family', 'bliskiej rodziny' )|E] władcy."
 princely_elective_succession_law_effects: "Cesarz i #V 7#! [Concept('prince_electors', 'elektorów Rzeszy')|E] mogą nominować spośród siebie [Concept('title_heir', 'dziedzica tytułu')|E], [Concept('legitimate', 'prawowite')|E] dzieci i rodzeństwo cesarza, jak również [Concept('vassals', 'wasali')|E] [de_jure|El] cesarstwa.\n\nJeśli preferowany [title|El] [Concept('elector', 'elektora')|E] należy do niewiernych, znajduje się poza [Concept('realm', 'państwem')|E] lub został zniszczony, inny wasal de iure zajmie jego miejsce. To [succession_law|El] przywiązuje dużą wagę do [Concept('faith', 'wiary')|E] i [Concept('piety', 'pobożności')|E]."
 gaelic_elective_succession_law: "Elekcja tanisty"
 gaelic_elective_succession_law_effects: "[ruler|E] i wszyscy [vassals|El] powyżej [Concept( 'rank', 'rangi' )|E] [Concept( 'baron', 'barona' )|E] będący o jedną lub dwie [Concept( 'ranks', 'rangi' )|E] niżej niż [title|El], mogą nominować [Concept('title_heir','sukcesora tytułu')|E] – tanistę – spośród członków panującej [Concept('dynasty', 'dynastii')|E]. Wasale będą bardziej skłonni wybierać starszych, dalekich członków rodu, niż [Concept('close_family','bliskich krewnych')|E] władcy."
 saxon_elective_succession_law: "Elekcja saska"
 saxon_elective_succession_law_subname: "Witenagemot"
 saxon_elective_succession_law_effects: "[ruler|E] i wszyscy dorośli bezpośredni wasale [de_jure|El] będący o jedną lub dwie [Concept( 'ranks', 'rangi' )|E] niżej niż [title|El] mogą nominować [Concept('title_heir','sukcesora tytułu')|E] spośród większości [Concept( 'powerful_vassal', 'potężnych wasali' )|E], [Concept( 'legitimate', 'prawowitych' )|E] dzieci władcy, a także innych istniejących [Concept( 'claimant', 'pretendentów' )|E]."
 scandinavian_elective_succession_law: "Elekcja skandynawska"
 scandinavian_elective_succession_law_subname: "Ting"
 scandinavian_elective_succession_law_effects: "[ruler|E] i wszyscy [vassals|El] [de_jure|El] (z wyjątkiem baronów) mogą nominować [Concept( 'title_heir', 'sukcesora tytułu' )|E] spośród [Concept( 'extended_family', 'dalszej rodziny' )|E] władcy i dowolnych dostępnych [Concept( 'claimants', 'pretendentów' )|E]. [voting_power|E] w tym [Concept( 'succession_law', 'prawie sukcesyjnym' )|E] zależy od całkowitego [Concept( 'county_development', 'rozwoju' )|E] [Concept( 'domain', 'domeny' )|E] oraz [Concept( 'county_opinion', 'powszechnej opinii' )|E] [Concept( 'capital', 'stolicy' )|E] [Concept( 'elector', 'elektora' )|E]."
 feudal_elective_candidates: "Bliska rodzina, pretendenci i elektorzy"
 feudal_elective_candidates_tooltip: "Aby być ważnym kandydatem w systemie feudalnej elekcji, postać musi spełniać jeden z poniższych warunków:\n$EFFECT_LIST_BULLET$Być prawowitym [Concept( 'close_family', 'bliskim' )|E] członkiem rodziny obecnego władcy, który nie jest w linii dziedziczenia teokracji lub republiki. Dzieci kandydata nie mogą być nominowane\n$EFFECT_LIST_BULLET$Być [Concept( 'claimant', 'pretendentem' )|E] do tytułu, który nie jest w linii dziedziczenia teokracji lub republiki\n$EFFECT_LIST_BULLET$Być ważnym feudalnym [Concept( 'elector', 'elektorem' )|E] tytułu"
 feudal_elective_electors: "Władca i wasale"
 feudal_elective_electors_tooltip: "Aby być ważnym [Concept( 'elector', 'elektorem' )|E] w systemie feudalnej elekcji, wasal musi spełniać wszystkie poniższe warunki:\n$EFFECT_LIST_BULLET$Być wasalem [de_jure|El] tego tytułu\n$EFFECT_LIST_BULLET$Być wasalem bezpośrednim tego tytułu\n$EFFECT_LIST_BULLET$Być o jedną lub dwie [ranks|El] niżej od tytułu"
 princely_elective_candidates: "$feudal_elective_candidates$"
 princely_elective_candidates_tooltip: "Aby być ważnym kandydatem w systemie elekcji książęcej, postać musi spełniać jeden z poniższych warunków:\n$EFFECT_LIST_BULLET$Być prawowitym [Concept( 'close_family', 'bliskim' )|E] członkiem rodziny obecnego władcy, który nie jest w linii dziedziczenia teokracji lub republiki. Dzieci kandydata nie mogą być nominowane\n$EFFECT_LIST_BULLET$Być [Concept( 'claimant', 'pretendentem' )|E] do tytułu, który nie jest w linii dziedziczenia teokracji lub republiki\n$EFFECT_LIST_BULLET$Być ważnym feudalnym [Concept( 'elector', 'elektorem' )|E] tytułu"
 princely_elective_electors: "Elektorzy Rzeszy"
 princely_elective_electors_tooltip: "[SuccessionElectionWindow.GetSuccessionLaw.GetName] to prawo, które sprawia, że jako [prince_electors|El] preferowani są [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsName] i [holders|El] następujących [Concept('titles', 'tytułów')|E]: [SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nJeśli którykolwiek z powyższych tytułów nie został utworzony, nie jest w posiadaniu [Concept('vassal', 'wasala')|E] cesarskiego [de_jure|E], jest już w posiadaniu innego elektora lub [religion|El] jego posiadacza różni się od religii cesarza, wybrany zostanie inny tytuł de jure posiadany przez bezpośredniego wasala cesarskiego lub [Concept('independent_ruler', 'władcę niezależnego')|E] na podstawie następujących kryteriów:\n$EFFECT_LIST_BULLET$Preferowani są [rulers|El] tej samej [Concept('faith', 'wiary')|E] i [Concept('culture', 'kultury')|E] co cesarz\n$EFFECT_LIST_BULLET$Preferowani są władcy [Concept('theocratic', 'teokratyczni')|E] i [Concept('feudal', 'feudalni')|E]"
 gaelic_elective_candidates: "Członkowie dynastii"
 gaelic_elective_candidates_tooltip: "Wszyscy prawowici członkowie [Concept( 'dynasty', 'dynastii' )|E] obecnego władcy, którzy nie są w kolejce do dziedziczenia teokracji lub republiki, są ważnymi kandydatami w myśl prawa tanistry. Dzieci kandydata nie mogą być nominowane."
 gaelic_elective_electors: "$feudal_elective_electors$"
 gaelic_elective_electors_tooltip: "Aby być ważnym [Concept( 'elector', 'elektorem' )|E] w myśl prawa Tanistry, wasal musi spełnić wszystkie poniższe warunki:\n$EFFECT_LIST_BULLET$Być wasalem [de_jure|El] tego tytułu\n$EFFECT_LIST_BULLET$Być o jedną lub dwie [ranks|El] niżej od tytułu"
 saxon_elective_candidates: "Dzieci, pretendenci i wasale"
