 confederation_elective_electors: "$feudal_elective_electors$"
 confederation_elective_electors_tooltip: "Aby być ważnym [Concept('elector', 'elektorem')|E] w systemie elekcji konfederacyjnej, wasal musi spełniać wszystkie poniższe warunki:\n$EFFECT_LIST_BULLET$ Mieć [Concept('rank', 'rangę')|E] [Concept('count', 'hrabiego')|E] lub wyższą\n$EFFECT_LIST_BULLET$ Być [Concept('vassal', 'wasalem')|E] bezpośrednim [Concept('title', 'tytułu')|E]\n$EFFECT_LIST_BULLET$ Posiadać [government|El] plemienny lub koczowniczy\n$EFFECT_LIST_BULLET$ Nie posiadać [Concept('trait', 'cechy')|E] [GetTrait('incapable').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$ Nie toczyć [Concept('war', 'wojny')|E] z właścicielem [Concept('title', 'tytułu')|E]"
