 single_heir_succession_kurultai_law_subname: "Dziedziczy najstarsze dziecko"
 single_heir_succession_kurultai_law_effects: "W przypadku sukcesji w ramach kurułtaju [council|El] odgrywa ważną rolę w podejmowaniu decyzji na temat następcy. Sprzeczne głosy wśród [Concept('kurultai', 'kurułtaju')|E] doprowadzą do niestabilnej sukcesji.\n\nW przypadku niestabilnej sukcesji linia decyzyjna nie jest jasno określona, a [heir|El] doświadczy negatywnych efektów na początku swoich rządów.\n\nJeśli cały kurułtaj podporządkuje się, państwo przejdzie stabilną sukcesję, gdzie tron obejmie [heir|El] ze wparciem wszystkich najbardziej wpływowych zwolenników."
