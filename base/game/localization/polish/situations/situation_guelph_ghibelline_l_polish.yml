 #Participant Groups
 gg_leader_group_help: "#help \n\nBrak przywódcy po którejkolwiek ze stron zakończy sytuację na korzyść strony przeciwnej.#!"
 guelph_ghibelline_participant_group_guelph_leader: "Przywódca gwelfów"
 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main' )]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "Przywódca [Concept('guelphs', 'gwelfów')|E] w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”.\n\nPodczas [Concept('situation_phase', 'faz sytuacji')|E] „[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]” i „[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]” w preludium [Concept('guelphs', 'gwelfom')|E] przewodzi papież, a zmagania eskalują z biegiem linii historycznych. Własne [decisions|El] przywódcy będą dostępne dopiero, gdy preludium zakończy się na rzecz otwartego konfliktu.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "Przywódca [Concept('guelphs', 'gwelfów')|E] w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”.\n\nTen przywódca ma do dyspozycji wyjątkowe [decisions|El] umożliwiające kierowanie przebiegiem konfliktu:\n$BULLET_WITH_TAB$Decyzje #V „$guelph_ghibelline_peace_decision$”#! i #V „$guelph_ghibelline_conflict_decision$”#!, które umożliwiają zmianę [Concept('situation_phase', 'faz')|E] [Concept('situation', 'sytuacji')|E] ze spokojniejszych na bardziej skoncentrowane na konflikcie i na odwrót\n$BULLET_WITH_TAB$Decyzję #V „$guelph_victory_decision$”#! umożliwiającą rozstrzygnięcie sytuacji na korzyść [Concept('guelphs', 'gwelfów')|E], gdy mają oni przewagę\n$BULLET_WITH_TAB$Decyzję umożliwiającą ustąpienie i przekazanie przywództwa odpowiedniemu zwolennikowi.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "Przywódca gibelinów"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "Przywódca [Concept('ghibellines', 'gibelinów')|E] w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”.\n\nPodczas [Concept('situation_phase', 'faz sytuacji')|E] „[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]” i „[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]” w preludium [Concept('ghibellines', 'gibelinom')|E] przewodzi władca miejsca o nazwie [GetTitleByKey('e_hre').GetName], a zmagania eskalują z biegiem linii historycznych. Własne [decisions|El] przywódcy będą dostępne dopiero, gdy preludium zakończy się na rzecz otwartego konfliktu.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "Przywódca [Concept('ghibellines', 'gibelinów')|E] w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”.\n\nTen przywódca ma do dyspozycji wyjątkowe [decisions|El] umożliwiające kierowanie przebiegiem konfliktu:\n$BULLET_WITH_TAB$Decyzje #V „$guelph_ghibelline_peace_decision$”#! i #V „$guelph_ghibelline_conflict_decision$”#!, które umożliwiają zmianę [Concept('situation_phase', 'faz')|E] [Concept('situation', 'sytuacji')|E] ze spokojniejszych na bardziej skoncentrowane na konflikcie i na odwrót\n$BULLET_WITH_TAB$Decyzję #V „$ghibelline_victory_decision$”#! umożliwiającą rozstrzygnięcie sytuacji na korzyść [Concept('ghibellines', 'gibelinów')|E], gdy mają oni przewagę\n$BULLET_WITH_TAB$Decyzję umożliwiającą ustąpienie i przekazanie przywództwa odpowiedniemu zwolennikowi.$gg_leader_group_help$"
