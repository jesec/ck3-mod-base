 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "W imię Pańskie – bulla papieska sporządzona przez papieża Mikołaja II w dniu 13 kwietnia 1059 roku. Była źródłem poważnych reform wyborów papieskich tamtego okresu, z których najbardziej znaczącą było wykluczenie monarchów z procesu wyboru i konfirmacji, czyniąc kardynałów-biskupów jedynymi elektorami."
 DICTATUS_PAPAE_GLOSS: "Dyktat papieża – zbiór 27 tez na temat władzy papieskiej. Zostały sporządzone przez papieża Grzegorza VII w 1075 roku, mniej więcej w tym samym okresie, w którym wybuchł spór o inwestyturę."
