 precursor_situation_leader_help: "#help W tej [Concept('situation_phase_phase', 'fazie')|E] władcą miejsca o nazwie [GetTitleByKey('e_hre').GetDefinitiveName] musi być [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName|l], natomiast papieżem musi być [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName|l].#!"
 situation_guelph_ghibelline_phase_in_nomine_domini: "Papieskie odrodzenie"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "Ta [situation_phase|El] „[GetSituation('guelph_ghibelline').GetName]” to stosunkowo spokojny okres, który niesie ze sobą niewiele bezpośrednich konsekwencji.\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "Po upływie około [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1' ), 'roku', 'lat' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1' ), 'miesiąca', 'miesięcy' ) )] sytuacja eskaluje i rozpocznie się [situation_phase_phase|El] „[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]”"
 gg_nomine_domini_transition_desc: "Chociaż większość zasad zawartych w Dictatus Papae (…)"
 dictatus_papae: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "Dictatus Papae"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "Ta [situation_phase|El] „[GetSituation('guelph_ghibelline').GetName]” stanowi zaostrzenie poprzedniej, znanej jako „[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]”.\n\nSzczególne relacje między monarchami a ich wasalami kościelnymi są teraz jeszcze bardziej napięte, ponieważ ci drudzy są rozdarci między papieżem roszczącym sobie prawo do powszechnej władzy a swoimi seniorami, pragnącymi utrzymać własną suwerenność.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "Po upływie około [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), 'roku', 'lat' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), 'miesiąca', 'miesięcy' ) )] sytuacja eskaluje i rozpocznie się [situation_phase_phase|El] „[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]” lub „[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]”"
 gg_dictatus_papae_transition_desc: "Chociaż większość zasad zawartych w Dictatus Papae (…)"
 ad_interim: "$situation_guelph_ghibelline_phase_ad_interim$"
 ad_interim_desc: "$situation_guelph_ghibelline_phase_ad_interim_desc_short$"
 situation_guelph_ghibelline_phase_ad_interim: "Konkordat wormacki"
 situation_guelph_ghibelline_phase_ad_interim_desc_short: "Ta [situation_phase|El] „[GetSituation('guelph_ghibelline').GetName]” to kluczowy moment, w którym [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName] i [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName] decydują, czy następną fazą będzie „[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]”, czy „[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]”…\n\n$precursor_situation_leader_help$"
 agitation: "$situation_guelph_ghibelline_phase_agitation$"
 agitation_desc: "$situation_guelph_ghibelline_phase_agitation_desc_short$"
 situation_guelph_ghibelline_phase_agitation: "Wzburzenie"
 situation_guelph_ghibelline_phase_agitation_desc_short: "Ten rodzaj [Concept('situation_phase', 'fazy sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]” wyróżnia się nasileniem i eskalacją konfliktów, w ramach których toczone są bitwy i wojny mające na celu zwiększenie potęgi zwycięskiej strony.\n\nJeżeli którakolwiek ze stron konfliktu zdobędzie co najmniej 70% władzy, natychmiast rozpocznie się jedna z następujących faz:\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
 guelph_advantage: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_advantage_desc: "$situation_guelph_ghibelline_phase_guelph_advantage_desc_short$"
 situation_guelph_ghibelline_phase_guelph_advantage: "Przewaga gwelfów"
 situation_guelph_ghibelline_phase_guelph_advantage_desc_short: "Ta [situation_phase|El] „[GetSituation('guelph_ghibelline').GetName]” oznacza, że [guelphs|El] mają przewagę w tej pełnej konfliktów [Concept('situation_phase_phase', 'fazie')|E].\n\nW rezultacie gwelfowie otrzymują dodatkowe premie, ale ci, którzy dysponują ogromną władzą, również mogą od czasu do czasu zostać wystawieni na próbę…"
 ghibelline_advantage: "$situation_guelph_ghibelline_phase_ghibelline_advantage$"
 ghibelline_advantage_desc: "$situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short$"
 situation_guelph_ghibelline_phase_ghibelline_advantage: "Przewaga gibelinów"
 situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short: "Ta [situation_phase|El] „[GetSituation('guelph_ghibelline').GetName]” oznacza, że [ghibellines|El] mają przewagę w tej pełnej konfliktów [Concept('situation_phase_phase', 'fazie')|E].\n\nW rezultacie gibelini otrzymują dodatkowe premie, ale ci, którzy dysponują ogromną władzą, również mogą od czasu do czasu zostać wystawieni na próbę…"
