 guelph_ghibelline_participant_group_ghibelline_member_desc: "Zwolennik strony [Concept('ghibelline', 'gibelinów')|E] w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”."
 guelph_ghibelline_participant_group_undecided: "Osoba niezdecydowana"
 guelph_ghibelline_participant_group_undecided_desc: "Strona niezdecydowana w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”. Może zostać przekonana do dołączenia do którejkolwiek ze stron, przy użyciu odpowiednich środków.\n\n#BOL Nie#! może wyzwolić [Concept('situation_catalysts', 'katalizatorów sytuacji')|E] i ma mniejsze szanse na zyskanie [Concept('gg_involvement', 'zaangażowania')|E]."
 guelph_ghibelline_participant_group_outsider: "Osoba postronna"
 guelph_ghibelline_participant_group_outsider_desc: "Strona postronna w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”. Zazwyczaj reprezentują ją bezrolni poszukiwacze przygód i inni najemnicy.\n\n#BOL Nie#! może wyzwolić [Concept('situation_catalysts', 'katalizatorów sytuacji')|E] #BOL ani#! zyskać [Concept('gg_involvement', 'zaangażowania')|E]."
