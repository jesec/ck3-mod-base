 #Tribal Era #
 ##############
 #Military
 innovation_motte: "Prace ziemne"
 innovation_motte_desc: "Proste, acz efektywne – budowanie naszych zamków na sztucznych wzniesieniach jest najlepszym sposobem na to, aby dosłownie mieć przewagę nad przeciwnikiem."
 innovation_motte_chinese: "Hāng Tu" #夯土
 innovation_motte_chinese_desc: "Proste, acz efektywne – budowanie naszych fortyfikacji z ubitej ziemi jest najlepszym sposobem na to, aby dosłownie mieć przewagę nad przeciwnikiem."
 innovation_motte_actual_motte: "Wzgórza"
 innovation_motte_actual_motte_desc: "$innovation_motte_desc$"
 innovation_catapult: "Onager"
 innovation_catapult_desc: "Chociaż dużo czasu zajmuje ładowanie i wystrzał, daleki zasięg strzału, osiągany dzięki sile skręconej liny, pozwala nam ostrzeliwać przeciwnika bez narażania się na ostrzał jego łuczników."
 innovation_catapult_chinese: "Kusza oblężnicza"
 innovation_catapult_chinese_desc: "Duże, przenośne kusze wyposażone w wiele przeciwstawnych łuków, które wydłużają naciąg i zwiększają siłę. Często montowane są na ramach jezdnych, co zapewnia mobilność."
 innovation_barracks: "Koszary"
 innovation_barracks_desc: "Wznoszenie budowli, w których nasi żołnierze mogą zostać zakwaterowani, pozwala znacznie zwiększyć liczebność naszych armii."
 innovation_mustering_grounds: "Tereny mobilizacyjne"
 innovation_mustering_grounds_desc: "Sama ochota do walki w naszym imieniu nie wystarcza żeby wygrywać wojny. Wyznaczenie przestrzeni, na której możemy dokonać przeglądu i przeszkolenia naszych wojsk, pozwoli nam oddzielić doświadczonych wojaków od amatorów."
 innovation_bannus: "Ban"
 innovation_bannus_desc: "Opierający się na prawie do dowodzenia ludźmi w bitwie, ban daje naszym władcom władzę powoływania ludzi pod broń, co jest podstawą prawną do tworzenia wielkich armii."
 eligible_accolade_vanguard_attribute_ACCOLADES_DLC: "[knights|E] tej [cultures|El] mogą otrzymać [Concept( 'accolades', 'wyróżnienie' )|E] [GetAccoladeType('vanguard_attribute').GetName|l]"
 eligible_accolade_vanguard_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_footmen: "[GetMaA('armored_footmen').GetName] – można zrekrutować jako [Concept('men_at_arms', 'zbrojnych')|E]"
 unlock_maa_onager: "[GetMaA('onager').GetName] – można zrekrutować jako [Concept('men_at_arms', 'zbrojnych')|E]"
 innovation_quilted_armor: "Pikowana zbroja"
 innovation_quilted_armor_desc: "Składające się z kilkunastu lub więcej zszytych ze sobą warstw płótna, te kaftany mogą zatrzymać nawet ciężkie strzały i są dla nas niedrogim sposobem na uzbrojenie całego pułku do bitwy."
 innovation_pattern_welding: "Dziwerowane ostrza"
 innovation_pattern_welding_desc: "Poprzez skręcanie i skuwanie ze sobą żelaznych oraz stalowych prętów nasi kowale mogą wykuwać ostrza, które są twardsze, elastyczniejsze i o wiele bardziej śmiercionośne niż te ze zwykłego żelaza. Tego rodzaju broń wymaga wprawnych dłoni i stałej troski, a wojownicy, którzy ją noszą, oczekują odpowiedniego żołdu."
 #Civic
 innovation_gavelkind: "Pryncypat"
 innovation_gavelkind_desc: "Stabilność i dobrobyt często idą w parze. Zamiast zawziętych walk wasali o tron po zmarłym władcy, powinniśmy wprowadzić jasny i sprawiedliwy system sukcesji, który zlikwiduje większość niestabilności występującej zazwyczaj w następstwie sukcesji."
 innovation_crop_rotation: "Płodozmian"
 innovation_crop_rotation_desc: "Zamieniając sposób uprawy roli z dwupolówki na trójpolówkę, nie tylko zwiększymy nasze zbiory, ale także zapobiegniemy wyjałowieniu się gleby."
 innovation_city_planning: "Planowanie miast"
 innovation_city_planning_desc: "Projektując miasta przed rozpoczęciem ich wznoszenia, możemy budować je w wybranych, strategicznych miejscach, a same miasta mogą być bardziej funkcjonalne i estetyczniejsze niż stare osiedla, które chaotycznie powstawały z biegiem lat."
 unlock_city_planning_holdings: "Odblokowuje [district_tiers|El]:\n$BULLET_WITH_TAB$[GetDistrictType('tribal_economy_prestige_district').GetName] poziomu II"
 innovation_casus_belli: "Casus belli"
 innovation_casus_belli_desc: "Zasadą „kto ma siłę, ten ma prawo” kierowali się ludzie od wielu pokoleń, lecz jeśli będziemy potrafili wskazać uzasadnienie wojen, które wszczynamy, uda nam się uniknąć gniewu naszych sąsiadów, a także odwetu strony zaatakowanej."
 innovation_plenary_assemblies: "Zjazdy plenarne"
 innovation_plenary_assemblies_desc: "Chcąc rządzić skutecznie, musimy zgromadzić wszystkich wolnych ludzi z naszego państwa, aby przedyskutować i ustalić najważniejsze sprawy państwowe. Obecność jest obowiązkowa, ci którzy się nie stawią, zostaną ukarani i stracą prawo wywierania wpływu na przyszłe decyzje."
 unlock_plenary_assemblies_building: "Odblokowuje [district_tiers|El]:\n$BULLET_WITH_TAB$[GetDistrictType('tribal_holding_district').GetName] poziomu II\n$BULLET_WITH_TAB$[GetDistrictType('household_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('tribal_wanua_district').GetName] poziomu II"
 innovation_prosperity_01: "Roboty publiczne"
 innovation_prosperity_01_desc: "Finansowanie robót publicznych, takich jak drogi, szkoły i akwedukty, pozwoli naszym osadom rozrosnąć się do większych rozmiarów, zapewniając dobrobyt kolejnym pokoleniom naszych poddanych."
 innovation_currency_01: "Waluta"
 innovation_currency_01_desc: "Handel wymienny jest powolny i nieefektywny; przyjęcie oficjalnie uznanej waluty, takiej jak muszelki lub bryłki metalu, wzmocni handel i przyspieszy rozprzestrzenianie się idei w naszym państwie."
 innovation_ledger: "Lustracje dóbr"
 innovation_ledger_desc: "W miarę jak nasze ziemie powiększają się, potrzebujemy lepszego sposobu na śledzenie tego, co posiadamy. Prowadzenie ewidencji naszego majątku zagwarantuje, że zawsze będziemy wiedzieć, jakie zasoby mamy do dyspozycji."
 #Regional
 innovation_viking_tradition: "Taktyka wikingów"
 innovation_viking_tradition_desc: "Mieszkańcy północy mają długą tradycję handlu oraz piractwa. Niewielu jest gotowych odeprzeć wroga, który może nagle i bez ostrzeżenia pojawić się na brzegach rzeki, a wikingowie są mistrzami takiej taktyki."
 innovation_longboats: "Langskipy"
 innovation_longboats_desc: "Nasze langskipy to potężne statki żeglarskie, które mogą dotrzeć niemal wszędzie, wbrew trudnym warunkom pogodowym, zapewniając nam wyjątkową mobilność na morzach."
 innovation_carpet_weaving: "Tkanie dywanów"
 innovation_carpet_weaving_desc: "Dywany i wykładziny mogą być zarówno ważnymi przedmiotami codziennego użytku, jak i eleganckimi produktami symbolizującymi prestiż dworski. W całej Anatolii i Persji istnieje długoletnia tradycja wytwarzania dywanów, które są zarówno trwałe, jak i piękne."
 unlock_carpet_weaving_buildings: "Odblokowuje linie [Concept('building', 'budowli')|E]:\n$BULLET_WITH_TAB$[GetBuildingType('rug_weaving_1').GetName] w następującej dzielnicy: [GetDistrictType('wool_district').GetName|l]\n$BULLET_WITH_TAB$[GetBuildingType('luxury_carpet_workshop_1').GetName] w następującej dzielnicy: [GetDistrictType('guild_district').GetName|l]"
 innovation_mead_brewing: "Warzenie miodu pitnego"
 innovation_mead_brewing_desc: "Stosowanie miodu w napojach alkoholowych jest szczególnie powszechne w północnych regionach Europy."
 culture_parameter_unlocks_mead_brewery: "Odblokowuje linie [Concept('building', 'budowli')|E]:\n$BULLET_WITH_TAB$[GetBuildingType('mead_brewery_1').GetName] w następującej dzielnicy: [GetDistrictType('honey_district').GetName|l]"
 unlocks_mead_brewery_name: "#V $innovation_mead_brewing$#!"
 innovation_stockfisk: "Sztokfisz"
 innovation_stockfisk_desc: "Poprzez suszenie ryb na drewnianych stojakach pod gołym niebem można zapewnić ich trwałość przez lata, co pozwala przechowywać je na własny użytek przez zimę lub podczas długich wypraw, a także eksportować je do odległych klientów."
 innovation_damascus_steel: "Stal damasceńska"
 innovation_damascus_steel_desc: "Kowale z Bliskiego Wschodu doprowadzili do perfekcji technikę pozwalającą im wykuwać bardziej wytrzymałe i ostrzejsze klingi. Te często bogato zdobione produkty kojarzą się obecnie z targowiskami w Damaszku."
 culture_parameter_damascus_steel_smithing: "Zwiększa efekt zapotrzebowania na towar z kategorii [GetTradeGoodCategory('trade_category_base_metals').GetName|l] w następujących [Concept('buildings', 'budowlach')|E]: [GetBuildingType('blacksmiths_guild_1').GetName|l] oraz [GetBuildingType('bladesmiths_of_toledo_1').GetName|l]"
 innovation_calicoes_and_muslin: "Kaliko i muślin"
 innovation_calicoes_and_muslin_desc: "Od niepamiętnych czasów Indie stanowią ośrodek produkcji i eksportu tekstyliów – zarówno pod względem ilości, jak i jakości. Dla Rzymian był to „tkany wiatr”, który kupcy przywozili z daleka, a później port w Kalikacie stał się symbolem kupowanej tam tkaniny „kaliko”."
 innovation_war_camels: "Wielbłądy bojowe"
 innovation_war_camels_desc: "Wielbłądy naturalnie nadają się do życia na pustynnym terenie, ale nie są z natury stworzeniami bojowymi. Nasi hodowcy i trenerzy mogą to zmienić, dzięki czemu uzyskamy świetną kawalerię, która pozwoli nam opanować tereny pustynne."
 eligible_accolade_camelry_attribute_ACCOLADES_DLC: "[knights|E] tej [cultures|El] mogą otrzymać [Concept( 'accolades', 'wyróżnienie' )|E] [GetAccoladeType('camelry_attribute').GetName|l]"
 eligible_accolade_camelry_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"
 innovation_elephantry: "Słonie bojowe"
 innovation_elephantry_desc: "Słonie trudno hodować w niewoli, tak więc kornacy muszą chwytać i wytresować dzikie zwierzęta. Nie jest więc łatwą sztuką, żeby użyć te majestatyczne stworzenia w walce, jest to jednak sztuka której gotowi jesteśmy się poświęcić."
 eligible_accolade_elephantry_attribute_ACCOLADES_DLC: "[knights|E] tej [cultures|El] mogą otrzymać [Concept( 'accolades', 'wyróżnienie' )|E] [GetAccoladeType('elephantry_attribute').GetName|l]"
 eligible_accolade_elephantry_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 innovation_wootz_steel: "Bułat"
 innovation_wootz_steel_desc: "Znany Arabom pod nazwą „Hinduwani”, a starożytnym Rzymianom jako „stal serycka”, bułat jest bogatym w węgiel typem stali, świetnie nadającym się do produkcji broni. Stal bułatowa, uważana za najlepszą na świecie, jest chodliwym towarem. Od wieków przyciągała uwagę handlarzy z całego świata – Arabów, Egipcjan, Chińczyków, a także Rzymian."
 innovation_african_canoes: "Zachodnioafrykańskie czółna"
 innovation_african_canoes_desc: "Wielkie czółna Afryki Zachodniej doskonale nadają się do żeglugi po rzekach i pozwalają nam szybko przewieźć wojska tam, gdzie ich potrzebujemy."
 innovation_table_of_princes: "Stół książęcy"
 innovation_table_of_princes_desc: "Stół książąt służy jako rodzaj tronu władców czeskich, ten z nich który zasiada za stołem jest uważany za prawowitego władcę. Zgodnie z zasadą senioratu, tytuł należał się najstarszemu żyjącemu członkowi dynastii panującej."
 unlock_single_heir_dynasty_house_changing: "Możesz wprowadzić seniorat na każdym poziomie [Concept('crown_authority', 'autorytetu korony')|E]"
 tradition_visigothic_codes_name: "$innovation_visigothic_codes$"
 tradition_visigothic_codes_desc: "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes: "Kodeksy Wizygotów"
 innovation_visigothic_codes_desc: "Chociaż wiele z najstarszych zwyczajów wizygockich zostało zapomniane, dzieci Pirenejów wciąż pamiętają o tradycjach przodków, o tym w jaki sposób dzieli oni ziemię między synów i córki – praktycznie, lecz sprawiedliwie."
 unlock_equal_succession_changing: "Można uchwalić [law|El] $equal_law$ na każdym poziomie [Concept('crown_authority', 'autorytetu korony')|E]"
 ######################
 #Early Medieval Era #
 ######################
 #Military
 innovation_battlements: "Blanki"
 innovation_battlements_desc: "Oprócz samych fortyfikacji, wybudowanie solidnej ściany zewnętrznej, którą mogą bezpiecznie obsadzić nasi łucznicy, zapewnia naszym zamkom dodatkową ochronę przed napastnikami. "
 innovation_mangonel: "Mangonela"
 innovation_mangonel_desc: "Mangonela to znaczące ulepszenie naszych istniejących konstrukcji katapult. Można ją przygotować o wiele szybciej do oddania strzału niż machiny wyposażone w tradycyjny napęd skrętny."
 innovation_mangonel_chinese: "Drabiny niebiańskie"
 innovation_mangonel_chinese_desc: "Składane drabiny oblężnicze, często wyposażone w tarcze ochronne, wciągarki, haki oraz mechanizmy linowe umożliwiające podnoszenie. Podczas oblężeń służyły również jako wyniesione punkty obserwacyjne."
 eligible_accolade_besieger_attribute_ACCOLADES_DLC: "[knights|E] tej [cultures|El] mogą otrzymać [Concept( 'accolades', 'wyróżnienie' )|E] [GetAccoladeType('besieger_attribute').GetName|l]"
 eligible_accolade_besieger_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"
 innovation_burhs: "Kamienne forty"
 innovation_burhs_desc: "Rozrzucone po okolicy, najlepsze place zbiórek i centra administracyjne są chronione przez solidne kamienne mury."
 innovation_burhs_japan: "Suki" #柵
 innovation_burhs_japan_desc: "Od czasu budowy zamku #italic Mizuki#! za panowania cesarza Tenjiego fortyfikacje zyskały nowe znaczenie. Ufortyfikowane ośrodki mogą służyć zarówno do gromadzenia wojsk, jak i jako centra administracyjne."
 innovation_burhs_chinese: "Wū bì" #塢壁
 innovation_burhs_chinese_desc: "Rozsiane po całej okolicy wū bì są ważnymi, ufortyfikowanymi osadami, które mogą służyć jako ośrodki administracyjne, a także do gromadzenia wojsk."
 innovation_burhs_anglo_saxon: "Burhy"
 innovation_burhs_anglo_saxon_desc: "Rozsiane po całej okolicy burhy są ważnymi, ufortyfikowanymi osadami, które mogą służyć jako ośrodki administracyjne, a także do gromadzenia wojsk."
 innovation_burhs_latin: "Castra"
 innovation_burhs_latin_desc: "Stare zasady tworzenia fortyfikacji są nadal przydatne. Możemy wykorzystywać tego rodzaju ufortyfikowane ośrodki zarówno do gromadzenia wojsk, jak i do pełnienia funkcji centrów administracyjnych."
 innovation_house_soldiers: "Oddziały nadworne"
 innovation_house_soldiers_desc: "Gdy nasze szlacheckie rodziny rosną w siłę, potrzebują żołnierzy, którzy będą egzekwować ich wolę. Ustanowienie oddanych oddziałów nadwornych sprawi, że będziemy mieć w ciągłej dyspozycji żołnierzy lepiej wyszkolonych i wyposażonych niż standardowi kmiecie."
 innovation_horseshoes: "Podkowy"
 innovation_horseshoes_desc: "Koń z rozłupanymi kopytami szybko zaczyna kuleć, co doprowadza do tego, że nie nadaje się do pracy ani walki. Podkuwając nasze konie podkowami z brązu lub żelaza możemy chronić końskie kopyta przed uszkodzeniami oraz utrzymywać je w należytym stanie."
 innovation_arched_saddle: "Siodło łękowe"
 innovation_arched_saddle_desc: "Kawaleria lekka to siła, z którą należy się liczyć, jednakże nie wykorzystuje ona tak naprawdę pełnego potencjału konia bojowego. Siodła łękowe pozwolą nam wystawić ciężko opancerzonych wojowników, uzbrojonych w lance, umożliwiając pełne wykorzystanie ich rozpędu w czasie szarży na linie wroga."
 eligible_accolade_lancer_attribute_ACCOLADES_DLC: "[knights|E] tej [cultures|El] mogą otrzymać [Concept( 'accolades', 'wyróżnienie' )|E] [GetAccoladeType('lancer_attribute').GetName|l]"
 eligible_accolade_lancer_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_horsemen: "[GetMaA('armored_horsemen').GetName] – można zrekrutować jako [Concept('men_at_arms', 'zbrojnych')|E]"
 innovation_riveted_mail: "Koszulka kolcza"
 innovation_riveted_mail_desc: "Kolczuga to najdoskonalszy sposób zapewnienia sobie bezpieczeństwa i do tej pory była często zarezerwowana wyłącznie dla szlachty. Dzięki uproszczeniu procesu produkcji możemy uczynić ją standardem dla wszystkich naszych zbrojnych."
 #Civic
 innovation_hereditary_rule: "Rządy dziedziczne"
 innovation_hereditary_rule_desc: "Równomierny podział naszego królestwa pomiędzy wszystkich prawowitych dziedziców rozdziera jedność naszego ludu. Zamiast rozrywać nasze królestwo na strzępy przy każdej sukcesji, możemy zapewnić sobie stabilną oraz rosnącą w siłę ojczyznę poprzez wprowadzenie systemu rządów dziedzicznych."
 innovation_manorialism: "Manorializm"
 innovation_manorialism_desc: "Wraz z skonsolidowaniem władzy przez naszą elitę, wiele mężczyzn i kobiet okazało się nie zdolnych do pracy. Stworzymy system dworski, gdzie wolni mężczyźni będą mogli pracować na naszych polach w zamian za odpracowanie czynszu, a ci, którzy nie mogą zapłacić, będą mogli wstąpić do naszej służby jako poddany."
 innovation_royal_prerogative: "Przywileje królewskie"
 innovation_royal_prerogative_desc: "Nasza szlachta posiada wielkie brzemię odpowiedzialności za zarządzanie naszym państwem, więc będą obdarzeni przywilejami zarezerwowanymi wyłącznie dla nich."
 innovation_chronicle_writing: "Kronikarstwo"
 innovation_chronicle_writing_desc: "Historie o wyczynach naszej rodziny nie będą już przekazywane tylko poprzez opowieści. Będziemy prowadzić rejestr wszystkiego, co osiągamy. Nie tylko, aby inspirować przyszłe pokolenia, ale także w celu udowodnienia roszczeń do ziem, które prawnie powinny należeć do nas."
 innovation_armilary_sphere: "Astrolabium"
 innovation_armilary_sphere_desc: "Dzięki astrolabiom można określić wysokość Słońca lub znanych gwiazd, co umożliwia obliczenie szerokości geograficznej. Takie przyrządy nawigacyjne, podobnie jak ich bardziej zaawansowana odmiana – sfera armilarna – pozwalają nam poruszać się po wodach bardziej oddalonych od lądu."
 innovation_baliffs: "Sędziowie"
 innovation_baliffs_desc: "Władca nie może być w wielu miejscach naraz. Mianując sędziów, którzy będą egzekwować prawo w całym państwie, możemy zarządzać większym obszarem skuteczniej niż gdybyśmy mieli to robić bez nich."
 innovation_baliffs_bailiffs: "Włodarze"
 innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"
 innovation_baliffs_latin: "Potestas"
 innovation_baliffs_latin_desc: "Starożytni Rzymianie definiowali uprawnienia urzędników do tworzenia, egzekwowania i oceniania prawa jako #italic potestas#!. To pojęcie używane do upoważniania sędziów do egzekwowania prawa na całym terytorium. Przyznając #italic potestas#! lokalnym urzędnikom, możemy skuteczniej rządzić większym obszarem, niż moglibyśmy to zrobić bez tego."
 innovation_prosperity_02: "Komunalizm"
 innovation_prosperity_02_desc: "Większe miasta regularnie borykają się z szeregiem coraz bardziej złożonych problemów. Przekazanie niektórych uprawnień radom lokalnym pozwoli im na rozwiązywanie problemów bez konieczności angażowania króla."
 innovation_currency_02: "System monetarny"
 innovation_currency_02_desc: "Nieuregulowane waluty są trudne do kontrolowania i brakuje im stabilności. Bite monety, o określonej wadze oraz z pieczęcią królewską zapewnią zaufane transakcje handlowe."
 #Regional
 innovation_reconquista: "Duchowy ekspansjonizm"
 innovation_reconquista_desc: "Rozkojarzeni walką zbyt długo tolerowaliśmy obecność niewiernych w Hiszpanii. Nadszedł czas, abyśmy zebrali nasze siły i raz na zawsze wypędzili ich z naszych ziem!"
 innovation_stem_duchies: "Stammesherzogtum"
 innovation_stem_duchies_desc: "Mimo, iż pochodzimy z różnych plemion, dostrzegamy znaczenie jedności i współpracy. Niezależność jest przeceniana – to stabilność jest tym, co prowadzi do bezpieczeństwa i dobrobytu."
 innovation_ghilman: "Ghilman"
 innovation_ghilman_desc: "Ghilman to żołnierze wzięci do niewoli. Są oni oddanymi wojownikami, którzy są lojalni wobec nas, a przede wszystkim tańsi, niż zwykli najemnicy."
 #####################
 #High Medieval Era #
 #####################
 #Military
 innovation_hoardings: "Hurdycje"
 innovation_hoardings_desc: "Umieszczone na szczycie naszych umocnień, te drewniane konstrukcje wystają ponad nasze mury zamkowe.\n\nPozwalają one naszym obrońcom strzelać, zrzucać kamienie lub wylewać wrzącą oliwę na atakujących, pozostając jednocześnie całkowicie chronionymi przed wrogimi łucznikami."
 innovation_trebuchet: "Trebusz"
 innovation_trebuchet_desc: "Inżynieryjny cud, przeciwwaga trebusza może miotać ciężkimi pociskami na odległość większą niż jakakolwiek inna znana do tej pory machina oblężnicza."
 innovation_trebuchet_chinese: "Przenośne wieże oblężnicze"
 innovation_trebuchet_chinese_desc: "Aby zdobyć kamienne wieże wroga, te wysokie, drewniane konstrukcje na kołach były dosuwane bezpośrednio do murów, umożliwiając żołnierzom bezpieczniejsze dotarcie na ich szczyt."
 innovation_castle_baileys: "Dziedzińce zamkowe"
 innovation_castle_baileys_desc: "Mimo że donżon jest sercem zamku, nie jest jedynym ważnym budynkiem. Budując na strzeżonym dziedzińcu budynki, takie jak stajnie i zbrojownie, zapewnimy odpowiednie rozmieszczenie i wyposażenie pospolitego ruszenia niezależnie od okoliczności."
 innovation_men-at-arms: "Zbrojni"
 innovation_men-at-arms_desc: "Wyszkoleni wojownicy zawsze będą potrzebni, ale nie zawsze są dostępni. Utrzymanie grup zbrojnych na wyłączność zapewni, że nigdy nie zabranie nam doświadczonych wojowników, gdy nieuchronnie wybuchnie wojna."
 innovation_knighthood: "Rycerstwo"
 innovation_knighthood_desc: "Nadając tytuł rycerza naszym najlepszym wojownikom oraz płacenie im w posiadłościami ziemskimi, a nie zwykłymi monetami, możemy ich należycie uhonorować – a także, zapewnić sobie ich lojalność."
 innovation_advanced_bowmaking: "Zaawansowane łuczarstwo"
 innovation_advanced_bowmaking_desc: "Podczas, gdy łucznicy tradycyjnie wytwarzają i konserwują swoje łuki, rzemieślnicy zaczęli tworzyć nowe rodzaje łuków, które są mocniejsze i bardziej złożone niż wcześniej. Wprowadzając te projekty, możemy uczynić to mistrzowskie łucznictwo nieocenionym atutem naszych armii."
 unlock_maa_crossbowmen: "[GetMaA('crossbowmen').GetName] – można zrekrutować jako [Concept('men_at_arms', 'zbrojnych')|E]"
 unlock_advanced_bowmaking_buildings: "Odblokowuje [district_tiers|El]:\n$BULLET_WITH_TAB$[GetBuildingType('archery_ranges_3').GetName] w dzielnicy, którą jest [GetDistrictType('military_district').GetName|l]"
 eligible_accolade_crossbower_attribute_ACCOLADES_DLC: "[knights|E] tej [cultures|El] mogą otrzymać [Concept( 'accolades', 'wyróżnienie' )|E] [GetAccoladeType('crossbowmen_attribute').GetName|l]"
 eligible_accolade_crossbower_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"
 innovation_coat_of_plates: "Zbroje kryte"
 innovation_coat_of_plates_desc: "Nitowanie zachodzących na siebie żelaznych płytek po wewnętrznej stronie mocnego płóciennego kaftana zapewnia naszym żołnierzom ochronę zbliżoną do pełnej zbroi płytowej przy zaledwie ułamku jej wagi. Wyposażenie całego pułku w te płaty to kosztowne zadanie dla naszych płatnerzy, lecz noszący je ludzie potrafią przetrwać ciosy, które powaliłyby nieopancerzonego wojownika."
 #Civic
 innovation_heraldry: "Heraldyka"
 innovation_heraldry_desc: "Ustalenie dziedzicznych wzorów identyfikacji naszych szlachetnych rodzin spowoduje, że ich członkowie będą postrzegać siebie jako część większej całości. Sprawi to, że będą chcieli poprawiać reputację swoich dynastii zamiast posiadania obsesji na punkcje swojego osobistego statusu."
 innovation_windmills: "Zaawansowane młyny"
 innovation_windmills_desc: "Pionowy wiatrak obraca się tam, gdzie wieje wiatr, co uwalnia młynarzy od zależności od spadającej wody. Te same wały zębate są teraz wykorzystywane nie tylko do mielenia zboża – młoty folują tkaniny, miechy zasilają kuźnię, a piły przecinają drewno, które niegdyś ludzie rąbali ręcznie."
 unlock_windmills_buildings: "Odblokowuje [district_tiers|El]:\n$BULLET_WITH_TAB$Poziom V dla wszystkich [Concept('resource_districts', 'dzielnic zasobów')|E] oprócz następującej: [GetDistrictType('fish_district').GetName|l]\n$BULLET_WITH_TAB$[GetDistrictType('villages_district').GetName] poziomu III"
 innovation_divine_right: "Boskie prawo"
 innovation_divine_right_desc: "Nadszedł czas, abyśmy uznali, że to boska wola umieściła naszych władców na ich tronach, a przeciwstawienie się im jest przeciwstawieniem się bogu. "
 innovation_land_grants: "Nadania ziemskie"
 innovation_land_grants_desc: "Ziemia to najcenniejsza nagroda, którą możemy obdarzyć naszych poddanych, ale jest jej tylko tyle ile sami posiadamy. Gdybyśmy jednak zezwolili im na uprawianie tej nieobrobionej ziemi… kto by się sprzeciwił? Nawet jeśli dojdzie do konfliktu, z pewnością będziemy mieli rację, gdy będziemy chcieli bronić swoich poddanych! "
 innovation_scutage: "Tarczowe"
 innovation_scutage_desc: "Od naszych poddanych zawsze oczekiwano służby wojskowej, ale są też tacy, którzy nie mogą lub nie chcą jej zapewnić. Oferując im sposób na wywiązanie się ze swoich zobowiązań za pomocą monety zamiast stali, możemy zapewnić, że otrzymamy nasze zależności od wszystkich."
 innovation_guilds: "Gildie"
 innovation_guilds_desc: "W miarę rozrastania się naszych ziem, bezpośrednie zarządzanie całym handlem, w obrębie naszej domeny, staje się coraz bardziej nieefektywne. Nadając przywilej gildii organizacjom kupców i rzemieślników, możemy zapewnić im większą autonomię w prowadzeniu działalności, a także czerpać zyski z ich przedsięwzięć."
 innovation_prosperity_03: "Urbanizacja"
 innovation_prosperity_03_desc: "Wielkie miasta Rzymu, Bizancjum oraz Delhi od dawna są reliktami wielkiego, niezrównanego dziedzictwa. Wraz ze wzrostem naszej infrastruktury i populacji, mamy wreszcie środki na rozwój nowych osad, które będą rywalizować z tymi starożytnymi ośrodkami miejskimi."
 innovation_currency_03: "Bankowość"
 innovation_currency_03_desc: "Szczególnie duże lub kosztowne transakcje często wymagają nieporęcznej ilości ciężkich monet. Zdeponowanie tego bogactwa w bezpiecznych skarbcach oraz przekazywanie własności bez przenoszenia fizycznych monet pozwoli na łatwiejszy handel dużymi ilościami towarów."
 innovation_blast_furnaces: "Wielkie piece"
 innovation_blast_furnaces_desc: "Dzięki wtłaczaniu powietrza do wysokiego pieca opalanego węglem drzewnym jesteśmy w stanie wytapiać żelazo w ilościach i o jakości, o jakich nasi przodkowie mogli tylko marzyć. Ruda, z której niegdyś kowal wydobywał garść metalu, teraz płynie w ilościach mierzonych w tonach."
 #Regional
 innovation_east_settling: "Ostsiedlung"
 innovation_east_settling_desc: "Ziemie na wschodzie są bogate w zasoby naturalne, ale mimo to są słabo zaludnione. Powołanie do życia inicjatywy na rzecz rozbudowy i zakładania tam gospodarstw, doprowadzi do wzrostu dobrobytu naszego ludu."
 innovation_seigneurialism: "Senioralizm"
 innovation_seigneurialism_desc: "Przekazując więcej obowiązków lokalnym szlachcicom, możemy zarówno uczynić ich szczęśliwszymi, jak i pozwolić nam skupić się na naszej własnej domenie."
 innovation_muladi: "Muwalladowie"
 innovation_muladi_desc: "Wojny, najazdy i prześladowania na całym świecie wypędziły wielu ludzi z ich domów. Przyjmując te wysiedlone dusze na nasze ziemie, niezależnie od ich pochodzenia, możemy stworzyć bogate i prosperujące społeczeństwo."
 innovation_french_peerage: "Parostwo"
 innovation_french_peerage_desc: "Dzięki prawowitemu wyróżnieniu najznakomitszych spośród szlachetnych wasali naszego królestwa, będziemy wzbudzać uczucie większej lojalności wobec korony."
 #####################
 #Late Medieval Era #
 #####################
 #Military
 innovation_machicolations: "Machikuły"
 innovation_machicolations_desc: "Znaczące ulepszenie w stosunku do naszych wcześniejszych hurdycji. Kamienne machikuły służą temu samemu celowi, będąc jednocześnie bardziej trwałą konstrukcją – zapewniającą większą ochronę naszym obrońcom."
 innovation_gunpowder: "Proch strzelniczy"
 innovation_gunpowder_desc: "Opracowanie wybuchowego prochu pozwoliło stworzyć nowe rodzaje broni. Pojawili się również obsługujący je wojownicy nowego typu. Wystawianie do walki tych potężnych broni wymaga łańcuchów produkcji i dostaw, jakie nie były dotąd potrzebne. Wszelkie koszty zwracają się jednak w postaci niesamowitej potęgi odblokowanej przez tę nową technologię."
 innovation_royal_armory: "Królewska zbrojownia"
 innovation_royal_armory_desc: "Wraz ze wzrostem liczebności naszych armii, musimy zagwarantować, że każdy żołnierz będzie odpowiednio uzbrojony i opancerzony. Utworzenie królewskiej zbrojowni, która będzie produkowała i przechowywała sprzęt dla naszej armii, znacznie przyczyni się do zaspokojenia tej potrzeby."
 innovation_standing_armies: "Stałe armie"
 innovation_standing_armies_desc: "Wojskowe pospolite ruszenie zapewnia nam dużą liczbę żołnierzy, ale bez względu na to, jak bardzo staramy się szkolić i wyposażyć tych ludzi, zawsze będą gorsi od zawodowych żołnierzy. Utworzenie dużej stałej armii zapewni, że interesy naszego królestwa będą egzekwowane przez najlepszych wojowników w okolicy."
 innovation_sappers: "Saperzy"
 innovation_sappers_desc: "Nie ma znaczenia, jak mocne są mury wroga, jeśli można wykopać pod nimi ziemię. Zatrudnianie saperów do niszczenia fortyfikacji wroga jest skutecznym sposobem na przełamanie nawet najmocniejszej obrony."
 innovation_plate_armor: "Zbroja płytowa"
 innovation_plate_armor_desc: "Najlepsza forma ochrony osobistej to dobrze wykonana płytowa zbroja. Posiada ona przegubowe połączenia, które zapewniają większy zakres ruchu niż wcześniejsze zbroje, a jednocześnie jest nieprzenikliwa przez broń przeciwnika."
 innovation_tempered_steel: "Stal odpuszczona"
 innovation_tempered_steel_desc: "Odkryliśmy sposób na to, by stal stała się twardsza i mniej krucha – najpierw ją podgrzewamy, potem szybko hartujemy, a następnie ponownie podgrzewamy. Dzięki temu powstaje broń, która jest twardsza i mniej krucha niż jakakolwiek stal, jaką otrzymywaliśmy do tej pory."
 #Civic
 innovation_primogeniture: "Primogenitura"
 innovation_primogeniture_desc: "Jedno królestwo, jeden następca. Choć młodsze dzieci naszego monarchy mogą czuć się urażone przez wyłączenie z dziedziczenia, to jest to najlepszy sposób zapewnienia stabilnego królestwa – nie zostanie rozerwane na strzępy przy sukcesji."
 innovation_cranes: "Żurawie"
 innovation_cranes_desc: "Zapomniany cud inżynierii. Rzymianie używali żurawi z kołem deptakowym do efektywnego budowania swojego imperium, więc i my będziemy."
 innovation_noblesse_oblige: "Szlachectwo zobowiązuje"
 innovation_noblesse_oblige_desc: "Szlachectwo to coś więcej niż tylko przywileje i prawa – to także obowiązek wobec państwa, obowiązkiem działania w sposób właściwy i sprawiedliwy. Jasne określenie tego, czego oczekuje się od naszej elity, da nam ideał, do którego będziemy dążyć, który nas zjednoczy – by go osiągnąć."
 innovation_rightful_ownership: "Prawowita własność"
 innovation_rightful_ownership_desc: "Nadszedł czas, aby świat uznał fakt, iż posiadanie naszych ziem de iure jest naszym boskim prawem. Nie będziemy już dłużej ograniczani przez przestarzałe protokoły i dekorum."
 innovation_ermine_cloaks: "Egzotyczne regalia"
 innovation_ermine_cloaks_desc: "Każdy może sięgnąć po tytuł, lecz prawdziwy monarcha musi wzbudzać u swoich poddanych podziw i zachwycać majestatem. Wykorzystywanie w naszych strojach monarszych najrzadszych i najbardziej egzotycznych materiałów z pewnością pomoże osiągnąć ten cel."
 innovation_ermine_cloaks_ermine: "Płaszcze gronostajowe"
 innovation_ermine_cloaks_ermine_desc: "Każdy może ubiegać się o tytuł, lecz prawdziwy monarcha musi wzbudzać u swoich poddanych podziw i majestat. Nasze nowe płaszcze podbite gronostajem są formą królewskiego stroju, który z pewnością spełni to zadanie."
 innovation_court_officials: "Urzędnicy dworscy"
 innovation_court_officials_desc: "Nasze państwo rozrosło się do tego stopnia, że nawet pomniejsi szlachcice nie są w stanie skutecznie wszystkim zarządzać. Mianowanie urzędników dworskich i biurokratów do wykonywania bardziej prozaicznych zadań sprawi, że aparat państwowy nadal będzie działać sprawnie."
 innovation_prosperity_04: "Myśl renesansowa"
 innovation_prosperity_04_desc: "Rozwój nauki i filozofii zmienił nasze miasta w cudowne centra edukacji oraz innowacji. Ogromne skoki technologiczne i kulturowe, które teraz dokonujemy, pozwoliły nam sięgnąć po niewyobrażalny dotąd potencjał."
 innovation_currency_04: "Weksle"
 innovation_currency_04_desc: "Weksle papierowe to ewolucja wcześniejszych systemów bankowych. Pozwalają naszym mieszkańcom na szybki i bezpieczny handel towarami oraz usługami na duże odległości – bez obciążania ich ciężkimi bilonami."
 #Regional
 innovation_wierdijks: "Wierdijki"
 innovation_wierdijks_desc: "Budowa silnych i niezawodnych grobli jest podstawowym zadaniem, jeśli chcemy żyć i rozwijać się w nizinnych krainach. Nowe techniki wzmacniania ziemnych wałów matami z liści tasiemnicy morskiej zwiększą ich wytrzymałość i trwałość."
 innovation_condottieri: "Kondotierzy"
 unlock_maa_condottieri_GDP_DLC: "[GetMaA('condottieri').GetName] – można zrekrutować jako [Concept('men_at_arms', 'zbrojnych')|E]"
 unlock_maa_condottieri: "[AddLocalizationIf( HasDlcFeature( 'silk_and_silver' ), 'unlock_maa_condottieri_GDP_DLC')]"
 innovation_condottieri_desc: "Włochy, będąc zarówno zamożnym, jak i centralnie położonym państwem, stały się głównym celem najemników. Podróżują tutaj, gdy nie posiadają aktualnie zajęcia. Skoro już tu są, powinniśmy być w stanie wynegocjować lepszą stawkę niż ta, którą by normalnie pobierali."
 innovation_deccan_unity: "Zjednoczony Dekan"
 innovation_deccan_unity_desc: "Napływ nowych wierzeń i religii do naszego społeczeństwa dał jasno do zrozumienia, że nasze skupianie się w przeszłości na regionalizmie było błędem. Powinniśmy połączyć się z innymi wyznawcami naszej wiary – zapewnić silne i trwałe państwo, które będzie w stanie sprostać zewnętrznym naciskom."
 students_of_knighthood: "Dzieci kończące [Concept( 'education', 'edukację' )|E] z [Concept( 'martial', 'wojskowym' )|E] [Concept( 'education_focus', 'priorytetem edukacji' )|E] zyskują [Concept( 'trait', 'cechę' )|E] $trait_education_martial_prowess$"
 #Sponsor Research Related
 fp3_innovation_mural_sextant: "Sekstant ścienny"
 fp3_innovation_mural_sextant_desc: "Te duże instrumenty ścienne mogą być wykorzystywane do precyzyjnego odczytu i pomiaru położenia ciał niebieskich."
 fp3_innovation_fritware: "Ceramika frytowa"
 fp3_innovation_fritware_desc: "Piękna kamienna ceramika na wzór wschodniej porcelany z domieszką materiałów takich jak kwarc czy szkło. Stanowi ona cenny towar lub imponujący prezent."
 fp3_innovation_fritware_tooltip: "Zysk [Concept( 'opinion', 'opinii' )|E] za [Concept( 'send_gift', 'wysłanie podarunku' )|E]: #P +20%#!"
 #################
 #The Silk Road #
 #################
 culture_parameter_silk_road_innovation_parameter: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'culture_parameter_silk_road_innovation_parameter_tgp', 'culture_parameter_silk_road_innovation_parameter_no_tgp' )]"
 culture_parameter_silk_road_innovation_parameter_tgp: "Można zdobyć tylko jako potencjalną [Concept('cultural_fascination', 'fascynację kulturową')|E], a służy do tego [Concept('heritage', 'spuścizna')|E] [GetCulturePillar('heritage_chinese').GetName|l], [tradition|El] „[GetCultureTradition('tradition_sinophilic').GetName]” lub [situation|El] „[GetSituation('silk_road_situation').GetName]”"
 culture_parameter_silk_road_innovation_parameter_no_tgp: "Można zdobyć tylko jako potencjalną [Concept('cultural_fascination', 'fascynację kulturową')|E], a służy do tego [Concept('heritage', 'spuścizna')|E] [GetCulturePillar('heritage_chinese').GetName|l], [GetCulturePillar('heritage_korean').GetName|l], [GetCulturePillar('heritage_buyeo').GetName] lub [GetCulturePillar('heritage_viet').GetName] albo [situation|El] „[GetSituation('silk_road_situation').GetName]”"
 innovation_fire_medicine: "Ogniste lekarstwo" #'Huoyao,' 火藥
 innovation_fire_medicine_desc: "Zgłębianie tajemnic życia pozwala czasem odkryć sposób na zadanie śmierci. Ogniste lekarstwo, będące potężną mieszanką siarki, saletry i łatwopalnego materiału, tworzy zabójczy płomień – gwałtowny, niemal wybuchowy."
 innovation_champa_rice: "Ryż z Czampy"
 innovation_champa_rice_desc: "Uprawa ryżu wymaga dużo czasu i wody – poza ryżem z Czampy. Odmiana ta rośnie szybciej, jest odporniejsza na susze i daje obfitsze plony niż inne znane rodzaje ryżu. Zdarza się, że możliwe są dwa zbiory rocznie. Sprawna uprawa tego ryżu wzmacnia gospodarstwa i może zapewnić wzrost populacji."
 culture_parameter_champa_rice_wet_land_paddies: "[GetDistrictType('rice_district').GetName] – można wznieść na terenie, którym są [GetTerrain( 'wetlands' ).GetName]"
 culture_parameter_champa_rice_building_bonuses: "Linia [Concept('building', 'budowli')|E] o nazwie [GetBuildingType('rice_resource_building_1').GetName|l] zyskuje dodatkowe premie na terenie, którym są [GetTerrain( 'wetlands' ).GetName]"
 building_paddy_fields_requirement_terrain_tt: "Jedno z następujących:\n$EFFECT_LIST_BULLET$[barony|E] znajduje się na terenie typu [GetTerrain( 'terraced_hills' ).GetName]\n$EFFECT_LIST_BULLET$[barony|E] znajduje się na terenie typu [GetTerrain( 'floodplains' ).GetName] i w [Concept('region', 'regionie')|E] o nazwie [GetGeographicalRegion('paddy_fields_region').GetName|l]\n$EFFECT_LIST_BULLET$[barony|E] znajduje się na terenie typu [GetTerrain( 'wetlands' ).GetName], a [culture|El] ma [Concept('innovation', 'innowację')|E] „#V $innovation_champa_rice$#!”\n$EFFECT_LIST_BULLET$[barony|E] znajduje się na terenie typu [GetTerrain( 'hills' ).GetName] lub [GetTerrain( 'jungle' ).GetName], a [culture|El] ma [Concept('tradition', 'tradycję')|E] „[GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V]”"
 innovation_sericulture: "Jedwabnictwo"
 innovation_sericulture_desc: "Sztuka wytwarzania jedwabiu to proces tyleż złożony, co satysfakcjonujący. Jego tajniki są zazdrośnie strzeżone przez osoby, które czerpią zyski z ich mistrzowskiego opanowania."
 culture_parameter_unlocks_silk_buildings_parameter: "Odblokowuje [domicile_buildings|El] z linii: [GetDomicileBuilding('silk_01').GetNameNoTooltip|Vl]"
 innovation_dragon_kiln: "Smocze piece"
 innovation_dragon_kiln_desc: "Najlepsza porcelana powstaje wyłącznie w wyspecjalizowanych piecach położonych w pobliżu cennych złóż. Piece te wznoszone są na stromych wzgórzach, które pomagają stworzyć wir cieplny konieczny do wypalania jak najtwardszej porcelany. Choć takie piece trudno zbudować, powstająca w nich porcelana jest niezwykle modna, a przez to ceniona na dworach (i do tego dochodowa)."
 innovation_lacquerware: "Wyroby z laki"
 innovation_lacquerware_desc: "Sztuka lakowania oraz przekształcania żywicy i drewna w kosztowne, prestiżowe przedmioty jest równie stara, co trudna do opanowania. Pochodzi ona z Japonii i Chin, skąd powoli rozprzestrzeniła się w całej Azji Wschodniej wraz z cennymi wyrobami wytwarzanymi w ten sposób."
 culture_parameter_unlock_lacquerware_buildings: "Odblokowuje linię [Concept('building', 'budowli')|E] ([GetBuildingType('lacquerware_workshop_1').GetName|l]) w dzielnicy, którą jest [GetDistrictType('forestry_district').GetName|l]"
 innovation_rocket_cart: "Wyrzutnie strzał"
 innovation_rocket_cart_chinese: "Huochē" #火車 (Huǒchē)
 innovation_rocket_cart_koreanic: "Hwacha" #火車 (화차)
 innovation_rocket_cart_desc: "Ustrojstwo to, korzystające z wybuchowych przepisów dużo prymitywniejszych niż mikstury używane w drogich bombardach, pozwala wystrzelić dużą salwę ognistych strzał. Jako że strzały te mają zaledwie moc… cóż, strzał… znaczenie lepiej sprawdzają się podczas strzelania #italic z#! murów niż #italic w#! mury."
 innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
 innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"
 innovation_tea_culture: "Kultura herbaty"
 innovation_tea_culture_desc: "Sztuka picia herbaty to coś więcej niż tylko parzenie liści we wrzącej wodzie. W niektórych społeczeństwach urosła ona do rangi zjawiska społecznego, a delektowanie się nią – zarówno w samotności, jak i w towarzystwie – stało się ważnym elementem tkanki społecznej."
 culture_parameter_unlocks_tea_house_buildings: "Odblokowuje linię [Concept('building', 'budowli')|E] o nazwie [GetBuildingType('tea_house_1').GetName|l] w następującej dzielnicy: [GetDistrictType('entertainment_district').GetName|l]"
 innovation_compass: "Kompas"
 innovation_compass_desc: "Zwykły fragment magnetytu pozwala określić kierunek, w którym dana osoba się przemieszcza. Kto wie, może w przyszłości, dzięki dalszym postępom, będzie można ustalić położenie bez potrzeby pytania kogoś o drogę."
 culture_parameter_cheaper_adventure_inspiration: "Koszt [Concept('inspiration', 'inspiracji')|E] z przygody: #P -50%#!"
 innovation_block_printing: "Druk stemplowy"
 innovation_block_printing_desc: "Wyżłobione drewniane stemple można wykorzystać do odbijania słów lub obrazów na każdym nadającym się do tego materiale. Technika ta znacząco usprawnia produkcję książek; koszty są dużo niższe, a dostęp do słowa pisanego staje się o wiele łatwiejszy."
 culture_parameter_block_printing_scriptorium_bonuses: "$culture_parameter_block_printing_scriptorium$"
 culture_parameter_block_printing_scriptorium: "Linia [Concept('building', 'budowli')|E] o nazwie [GetBuildingType('scriptorium_1').GetName|l] przyznaje dodatkowe premie"
 innovation_grenades: "Granaty"
 innovation_grenades_desc: "Pomimo postępów w technologii wojennej jedno starożytne narzędzie pozostaje niezastąpione: ludzkie ramię. Małe naczynia wypełnione łatwopalną lub wybuchową substancją są łatwe do wykonania, a użyć ich może każdy, kto opanował przyzwoitą technikę rzutu. Granaty rozdane żołnierzom przed bitwą to dodatkowa metoda ataku, a zarazem sposób na zaskoczenie wroga."
 innovation_cupellation: "Kupelacja"
 innovation_cupellation_desc: "Specjalistyczne piece wysokotemperaturowe mogą służyć do wytapiania cennych metali z próbek wydobywczych poprzez ich ekstrakcję z przetopionych rud i produkcję oczyszczonej próbki, która może później zostać dokładnie zbadana przez probierców. Kupelacja rudy z kopalni ołowiu to najlepszy sposób, aby określić zawartość srebra w danej kopalni, a kupelacja złota pozwala ustalić jego czystość w celu potencjalnego wybicia monet."
 innovation_lacquered_armor: "Lakierowana zbroja"
 innovation_lacquered_armor_desc: "Staranna aplikacja specyficznych żywic na zbroje znacznie je wzmacnia i pomaga zabezpieczyć cięższe żelazne płyty przed wodą. Choć proces ten znany jest od dawna, jego zastosowanie ograniczało się głównie do skrzyń, butelek i innych wyrobów. Lakierowana zbroja stanowi nowy sposób ochrony zarówno żołnierzy, jak i ich sprzętu."
 culture_parameter_higher_quality_armor_artifacts_parameter: "[artifacts|E] w postaci zbroi uzyskiwane z [Concept('sponsored', 'ufundowanych')|E] [Concept('inspirations', 'inspiracji')|E] oraz decyzji „[GetDecision('commission_artifact_decision').GetName]” są wyższej jakości"
 innovation_double_entry_bookkeeping: "System podwójnego księgowania"
 innovation_double_entry_bookkeeping_desc: "Rejestry muszą nadążać za rosnącą złożonością finansów i gospodarki. Zapisywanie wszystkich wpływów i wszystkich wydatków jako oddzielnych wpisów pomaga w utrzymaniu wiarygodności bilansów oraz zapewnia, że żadne pozycje nie zostaną przypadkowo – lub „przypadkowo” – pominięte przy przeglądzie ksiąg."
 culture_parameter_bookkeeping_collect_taxes_bonus: "[councillor_task|E] „$task_collect_taxes$”: [gold_i|E] #P +10%#!"
 innovation_waterworks: "Systemy wodne"
 innovation_waterworks_desc: "Woda jest źródłem życia, lecz poza zaspokajaniem pragnienia i nawadnianiem pól ma też inne zastosowania. Jeśli zostanie odpowiednio zebrana, może napędzać maszyny o wiele silniejsze niż zwierzęta gospodarskie, ułatwiać podróżowanie i handel, wykorzystując sztucznie utworzone kanały, lub po prostu sprawić, że tłoczne ulice pozostaną czyste i będą nadawać się do użytku."
 culture_parameter_waterworks_agricultural_bonuses: "Linie [Concept('buildings', 'budowli')|E] #V kanałów i łapaczy wiatru#!, #V zbiorników wodnych i cystern#!, #V sieci nawadniających#! i #V kanałów wodnych#! przyznają dodatkowy [agricultural_tax|El]"
 innovation_tiefutu: "$tiefutu$"
 innovation_tiefutu_desc: "$tiefutu_flavor$"
 innovation_bulkheads: "Grodzie"
 innovation_bulkheads_desc: "Najprostszym sposobem, aby zapobiec zatonięciu statku, jest unikanie uszkodzeń kadłuba. Jeśli jednak się to stanie, a kadłub został wcześniej podzielony na przedziały wodoszczelnymi ścianami, może udać się go uratować. Nawet jeśli statek ulegnie uszkodzeniu, grodzie mogą zapobiec całkowitemu zatonięciu, ratując ludzi, zapasy, a także samą jednostkę."
 innovation_coking: "Koksowanie"
 innovation_coking_desc: "Węgiel drzewny jest niezbędny w kowalstwie, ale, aby go uzyskać, potrzebne są rozległe lasy, które pozwalają na przetworzenie pozyskanego drewna na ten surowiec. Węgiel, podgrzewany w czymś przypominającym piec, może zostać przekształcony w koks. Koks, jak węgiel drzewny, jest równie przydatny w kowalstwie i innych przemysłowych piecach, a nie wymaga prowadzenia wycinki całych lasów."
 culture_parameter_coking_smith_bonuses: "Linia budowli [Concept('duchy_district', 'dzielnicy księstwa')|E] o nazwie [GetBuildingType('blacksmiths_01').GetName|l] przyznaje dodatkowe premie"
 innovation_composite_crossbow: "Kusze kompozytowe"
 innovation_composite_crossbow_desc: "Podobnie jak w przypadku łuków, to moc brzuśca określa potencjalną moc naciągu. Wzmacniając go rogiem, a nawet stalą, zwiększa się naciąg, przez co zasięg i siła kuszy mogą być o rzędy wielkości większe niż w przypadku drewnianych modeli. Kusza taka staje się więc wytrzymała i odporna na uszkodzenia."
 innovation_pharmacopoeia: "Farmakopea"
 innovation_pharmacopoeia_desc: "Każdy dobry lekarz musi wiedzieć, jak przygotować odpowiednie leki we właściwym czasie, używając odpowiednich składników, przygotowanych we właściwy sposób i w odpowiednich ilościach. Choć wiedza na ten temat często przekazywana jest z mistrza na terminującego w sposób indywidualny, #italic zapisanie#! sposobu wytwarzania konkretnych leków może w bardzo dużym stopniu pomóc w standaryzacji i rozpowszechnianiu przygotowywania różnych terapii."
 culture_parameter_physician_pharmacopoeia_bonus: "Skuteczność leczenia zapewnianego przez osobę zajmującą [court_position|El], którym jest [GetCourtPositionType('court_physician_court_position').GetName()|l]: #P +20%#!"
 innovation_glassmaking: "Szklarstwo"
 innovation_glassmaking_desc: "Poprzez ostrożne eksperymenty z wykorzystaniem piasku, ognia i popiołu nasi rzemieślnicy nauczyli się, jak wytwarzać i obrabiać czyste szkło. Znajomość tej sztuki umożliwia produkcję okien, naczyń i dekoracji, dzięki którym budowle i dwory mogą wypełnić się światłem dziennym i pięknem."
