 innovation_heavy_plow: "Pług ciężki"
 innovation_heavy_plow_desc: "Nawet cięższe żelazne pługi mogą być z łatwością ciągnięte przez woły lub konie, jeśli sprzęt wyposażono w koła, a zwierząt jest kilka. To nowatorskie rozwiązanie pozwala nam uprawiać ziemie, które w przeciwnym razie byłyby trudne, a nawet niemożliwe do wykorzystania."
 innovation_heavy_plow_eri: "System eri"
 innovation_heavy_plow_eri_desc: "Sieć zbiorników z wałami zatrzymuje deszcz padający w porze monsunowej i magazynuje wodę przez suche miesiące, co pozwala nam sadzenie, uprawę i siew przez cały rok."
 innovation_heavy_plow_transplanting: "Przesadzanie i szczepienie"
 innovation_heavy_plow_transplanting_desc: "Stosując odpowiednie techniki pielęgnacji i rozmnażania roślin, możemy znacznie zwiększyć nasze plony."
 culture_parameter_stone_forts: "[GetBuildingType('wall_wardens_offices_1').GetName] potrzebuje towaru o nazwie [GetTradeGoodType('trade_good_stone').GetNameWithIcon|l] (wcześniej: [GetTradeGoodCategory('trade_category_carpentry_supplies').GetName|l])"
 culture_parameter_heavy_plow: "[GetDistrictType('grain_district').GetName] będzie teraz potrzebować następujących towarów: [GetTradeGoodType('trade_good_iron').GetNameWithIcon|l] oraz [GetTradeGoodCategory('trade_category_beasts_of_burden').GetName|l]. Wcześniej: tylko [GetTradeGoodType('trade_good_cattle').GetNameWithIcon|l]"
 innovation_prospecting: "Poszukiwanie złóż"
 innovation_prospecting_desc: "Dzięki aktywnemu i metodycznemu poszukiwaniu nowych złóż rud możemy znacznie rozszerzyć działalność górniczą w naszym państwie."
 innovation_coppicing: "Gospodarka odroślowa"
 innovation_coppicing_desc: "Dzięki właściwej pielęgnacji drzew oraz ich wycince w sposób metodyczny i zorganizowany możemy znacznie zwiększyć wydajność naszego leśnictwa na potrzeby powiązanych branż, takich jak produkcja węgla drzewnego i drewna opałowego."
 innovation_monasticism: "Monastycyzm"
 innovation_monasticism_desc: "Chociaż klasztory nie są nowym zjawiskiem, stały się zarówno większe, jak i bardziej powszechne. Wokół niegdyś odizolowanych ośrodków powstają obecnie całe wspólnoty religijne z własnym zapleczem gospodarczym i powiązanymi osadami świeckimi."
 innovation_craft_ordinances: "Statuty cechowe"
 innovation_craft_ordinances_desc: "Chociaż rzemieślnicy nie przepadają za regulacjami, to jednak cenią sobie prawo do ustalania zasad dotyczących swoich specjalistycznych branż. Jeśli jakość i ceny są pod kontrolą, jest to korzystne dla wszystkich."
 innovation_merchant_law: "Prawo kupieckie"
 innovation_merchant_law_desc: "Spisując zwyczaje, którymi rządzi się handel, i egzekwując je, możemy sprawić, że wymiana dóbr na naszych ziemiach będzie przebiegała zarówno swobodniej, jak i w sposób bardziej uporządkowany."
 innovation_vaulting: "Sklepienia"
 innovation_vaulting_desc: "Wysokie i smukłe sklepienia nie tylko zachwycają wzrok, ale stanowią również znacznie bezpieczniejszy sposób wykonania stropu w dużych budowlach. Konstrukcje, które obecnie budują nasi kamieniarze, wymagają mniejszego zużycia budulca i zapewniają większą trwałość obiektów."
 innovation_putting_out_system: "System nakładczy"
 innovation_putting_out_system_desc: "Dzięki nadrzędnej strukturze organizacyjnej, która nadzoruje codzienną produkcję prowadzoną w każdej chacie lub każdym gospodarstwie na terenie naszego państwa, możemy osiągnąć znacznie większą wydajność. Kupcy zajmą się zarówno zakupem surowców, jak i sprzedażą gotowego produktu."
 innovation_deep_mining: "Górnictwo głębinowe"
 innovation_deep_mining_desc: "By wydrążyć kopalnie głębsze niż kiedykolwiek wcześniej, opracowaliśmy szereg rozwiązań technicznych, takich jak drewniane chodniki, ulepszone systemy odwadniające oraz wciągarki. Te udoskonalenia pozwoliły nam dosięgnąć złóż położonych tak głęboko, że nikt wcześniej do nich nie dotarł."
 innovation_pilot_books: "Mapy morskie"
 innovation_pilot_books_desc: "Żegluga jest niebezpiecznym zajęciem, a bez pomocy lokalnych pilotów większość statków byłaby skazana na zagładę nawet przy poruszaniu się wzdłuż stosunkowo bezpiecznego, ale nieznanego wybrzeża. Sporządzając mapy każdego cypla, mielizny i kotwicowiska wraz z ich azymutami oraz odległościami, możemy zachować na wieczność to, co w przeciwnym razie zginęłoby wraz ze śmiercią pilota."
 innovation_pilot_books_portolan: "Portolany"
 innovation_pilot_books_portolan_desc: "Żegluga jest niebezpiecznym zajęciem, a bez pomocy lokalnych pilotów większość statków byłaby skazana na zagładę nawet przy poruszaniu się wzdłuż stosunkowo bezpiecznego, ale nieznanego wybrzeża. Wyznaczając linie na naszych mapach za pomocą azymutów określanych różą wiatrów i zaznaczając na nich każdy cypel, mieliznę i kotwicowisko, możemy zachować na wieczność to, co w przeciwnym razie zginęłoby wraz ze śmiercią pilota."
 innovation_agronomy: "Agronomia"
 innovation_agronomy_desc: "Praca na roli bywa trudna, a wiedza na ten temat często przekazywana jest wyłącznie między rolnikami. Gromadząc tę wiedzę i spisując traktaty dotyczące upraw i hodowli, możemy szerzyć sprawdzone informacje oraz przekształcać tradycje w praktyczne metody."
 innovation_bricks: "Cegły"
 innovation_bricks_desc: "Chociaż cegły nie były obce naszym przodkom, wiedza na ich temat nie jest już tak powszechna, jak kiedyś. Technologia pozwalająca na niezawodną produkcję i wykorzystanie tego prostego, wytworzonego przez człowieka materiału budowlanego, umożliwia szybsze i bardziej efektywne wznoszenie domów."
