l_polish:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ fala upałów"
 gdp_travel_events.1000.desc: "Diuny obszaru znanego jako [ROOT.Char.GetCurrentLocation.GetName] rozciągają się poza horyzont w bezkresnym morzu piasku. Słoneczny żar maluje na powierzchni nieustannie zmieniający się, hipnotyzujący układ. Zatrzymujemy się, by odpocząć, zalani potem, bez choćby skrawka cienia w zasięgu wzroku. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))|U] [entourage_member_one.GetFirstName] odwraca się do mnie z szeroko otwartymi oczami.\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] nie obawia się upałów, poprzedniej nocy spłynęło na mnie błogosławieństwo [entourage_member_one.GetFaith.HighGodNamePossessive]! Ukazano mi wizję, w której niedaleko stąd była oaza!"
 gdp_travel_events.1000.a: "Droga do oazy powinna biec tędy!"
 gdp_travel_events.1000.b: "Nie mamy innych możliwości, spróbujmy."
 gdp_travel_events.1000.b.success: "Chwalmy łaskę [entourage_member_one.GetFaith.HighGodNamePossessive], oaza istnieje naprawdę"
 gdp_travel_events.1000.b.failure: "To był tylko miraż"
 gdp_travel_events.1000.c: "Nie zaufam tym wizjom."
 low_caravaneer_experience_reason_tooltip: "Wymaga #V 100#! punktów [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] na ścieżce koordynatora karawan ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])"
 gdp_travel_events.1010.t: "Zagubieni podróżnicy"
 gdp_travel_events.1010.desc: "Niedaleko miejsca, którym jest [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')] o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], nasza karawana szykuje się do rozbicia obozu. Kiedy właśnie szykujemy się na wieczorny odpoczynek, zza naszych pleców dobiega cichy głos.\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] mi wybaczy. Wraz z rodziną jesteśmy podróżnikami, którzy odłączyli się od swojej karawany. Niewiele możemy zaoferować, ale oddam wszystko, byleby tylko zapewnić mojemu dziecku bezpieczeństwo tej nocy."
 gdp_travel_events.1010.a: "Zachowaj swą monetę. Dołącz do nas."
 gdp_travel_events.1010.b: "Możemy zapewnić ci schronienie… za drobną opłatą."
 gdp_travel_events.1010.c: "#EMP Wszystko#!, powiadasz…"
 gdp_travel_events.1010.d: "Mamy już dość gąb do wyżywienia."
 gdp_travel_events.1020.t: "Ciekawostki ze szlaku"
 gdp_travel_events.1020.desc.intro: "Odległość podróży z miejsca znanego jako [journey_start.GetName] daje się we znaki moim czterem literom, gdy mój [ROOT.Char.Custom('GetDonkeyDromedary')] truchta przez teren, który jest całkowicie zdominowany przez [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))|U] [associate.GetFirstName], jakby nie przejmując się podróżą, jedzie u mego boku, chcąc mi coś powiedzieć.\n\n"
 gdp_travel_events.1020.desc.caravaneer: "– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] wysłucha małej anegdoty. Od mistrza karawany, z którym przecięły się moje drogi w miejscu znanym jako [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], wiem o cudownym ustrojstwie do nawigacji…"
 gdp_travel_events.1020.desc.artisan: "– Czy [ROOT.Char.Custom('FormOfAddressForLiege')] wie, że [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] to kwiat, który doskonale sprawdza się w farbowaniu tkanin? Jeśli tylko zmielimy płatki…"
 gdp_travel_events.1020.desc.creditor: "– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] wie, że w niektórych miejscach grabież #EMP może#! być legalna, jeśli ofiara ma wobec ciebie dług. To przypomina mi o sytuacji, w której wraz z kuzynami…"
 gdp_travel_events.1020.desc.war_profiteer: "– Wasza czcigodność, mam dla ciebie ciekawą informację. Ten teren był niegdyś świadkiem wielkiej bitwy. Tutaj swój żywot zakończył legendarny szermierz, który podobno rozrywał swoich przeciwników niczym [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]…"
 gdp_travel_events.1020.a: "Fascynujące. Proszę, powiedz mi więcej."
 gdp_travel_events.1020.b: "Zmieńmy temat. [ROOT.Char.Custom('my_subject_of_interest')|U] to coś, co bardziej mnie ciekawi."
 gdp_travel_events.1020.c: "Wolę jechać w ciszy."
 gdp_travel_events.1020.b.success: "Zmieniasz temat rozmowy"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip] nie chce cię wysłuchać"
 gdp_travel_events.1030.t: "Podłe szepty"
 gdp_travel_events.1030.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))|U] [ambitious_associate.GetFirstName] zbliża się do mnie, rozglądając się, czy nikt nas nie widzi. Gdy jest już blisko, szepcze:\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] wie, że do mych uszu dotarły niepokojące wieści o bliskiej ci osobie, którą jest [current_partner.GetFirstName]. W kompanii mówi się, że [current_partner.GetSheHe] #EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!. Jeśli to prawda, musi [current_partner.Custom('PL_go_ja')] dosięgnąć sprawiedliwość!\n\n– …a na osobę, która przyniosła te okropne wieści, może czeka nagroda?"
 gdp_travel_events.1030.a: "Muszę znać prawdę!"
 gdp_travel_events.1030.a.unity_loss.desc: "Poznano prawdziwą naturę bliskiej ci osoby"
 gdp_travel_events.1030.b: "Nie chcę spekulować."
 gdp_travel_events.1030.b.unity_gain.desc: "Odmówiono dania wiary plotkom na temat bliskiej ci osoby"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ zapuszczona studnia"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName] zagląda w głąb starej studni i marszczy nos.\n\nStudnia od dawna nie była konserwowana. Kamienie porosły zielskiem, wiadro spróchniało, a woda wydziela tak odrażający odór, że nawet człowiek umierający z pragnienia zawahałby się przed jej wypiciem.\n\nNiestety, nasze bukłaki są już sflaczałe, niemal puste, a pragnienie szybko staje się nie do zniesienia."
 gdp_travel_events.1040.a: "Komuś takiemu jak ja odrobina brudu nie zaszkodzi!"
 gdp_travel_events.1040.b: "Znam sposób, by oczyścić tę wodę."
 gdp_travel_events.1040.c: "Musimy racjonować wodę, która nam pozostała."
 gdp_travel_events.1040.d: "Czeka nas długa droga wypełniona pragnieniem."
 gdp_travel_events.1040.e: "Może chociaż łyczek…"
 gdp_travel_events.1040.e.critical_failure.tt: "Twoja choroba się nasila."
 gdp_travel_events.1040.e.success: "Woda nadaje się do picia."
 gdp_travel_events.1040.e.success.desc: "Łyk wody ze studni przynosi ci wyraźne orzeźwienie."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ powalone drzewa"
 gdp_travel_events.1050.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')|U] w miejscu o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] to teren, przez który przetoczyła się potężna burza, wyrywając z korzeniami drzewa. Teraz zalegają one na drodze. Miejscowi robotnicy usuwają zwaliska, lecz minie jeszcze trochę czasu, zanim będziemy mogli przejechać.\n\n[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')|U] wokół zatoru stwarza możliwość przejazdu, ale niebezpiecznie przechylone drzewa czynią ten objazd ryzykownym."
 gdp_travel_events.1050.x: "Mój rumak [ROOT.Char.Custom('WarhorseStoryName')] oczyści trakt z tych powalonych drzew!"
 gdp_travel_events.1050.a: "Równie dobrze i ja mogę zakasać rękawy."
 gdp_travel_events.1050.b: "Moglibyśmy się czegoś od nich nauczyć."
 gdp_travel_events.1050.c: "Spróbujmy obejść ten zator inną drogą."
 gdp_travel_events.1050.d: "Poczekamy, aż robotnicy dokończą pracę."
 gdp_travel_events.1050.c.success: "Znajdujesz objazd omijający powalone drzewa."
 gdp_travel_events.1050.c.failure: "Doznajesz obrażeń w dziczy."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ szczury w ładowni"
 gdp_travel_events.1060.desc: "W ładowni statku roi się od szczurów, które łapczywie pożerają nasze zapasy. Niektórzy obwiniają za to niewłaściwy sposób ich składowania – luźne pokrywy i zużyte worki. Inni twierdzą, że to kwestia wprost niewiarygodnych rozmiarów tego roju.\n\nNiezależnie od przyczyny szybko przegrywamy tę walkę i musimy podjąć odpowiednie działania, zanim te obrzydliwe szczury pożrą wszystko, co mamy, i pozostawią nas z niczym."
 gdp_travel_events.1060.x: "Niech mój kot [ROOT.Char.Custom('CatStoryName')] się tym zajmie."
 gdp_travel_events.1060.a: "– Przynieś mi harpun i solidną sieć!"
 gdp_travel_events.1060.b: "Zajmę problemem z ładunkiem bez niczyjej pomocy!"
 gdp_travel_events.1060.c: "Kurs na port i uzupełnić zapasy."
 gdp_travel_events.1060.d: "Niech wszyscy zabiorą się za łapanie szczurów!"
 gdp_travel_events.1060.b.tt: "Musisz mieć co najmniej #V 25#! pkt [Concept('expertise', 'biegłości')|E] w kategorii o nazwie [GetTradeGoodCategory('trade_category_cereals').GetName|l]"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ na celowniku"
 gdp_travel_events.1070.desc: "Nagle na horyzoncie widać tumany kurzu, a chwilę później dostrzegamy grupę bandytów, którzy pędzą na koniach przez rumowisko.\n\n– Stać! – krzyczy do mnie ich przywódca. – Oddaj złoto po dobroci, a nikomu nie stanie się krzywda."
 gdp_travel_events.1070.a: "– [ROOT.Char.GetSuzerain.GetShortUINameNotMe] zapewnia mi immunitet, wy łajdacy!"
 gdp_travel_events.1070.a.success: "Imię twojego patrona zapewnia ci bezpieczny przejazd"
 gdp_travel_events.1070.b: "– Będziecie musieli je nam zabrać siłą!"
 gdp_travel_events.1070.b.success: "Przepędzasz bandytów"
 gdp_travel_events.1070.b.failure: "Bandyci zabierają twoje złoto"
 gdp_travel_events.1070.c: "– Zrobię wszystko, tylko pozwólcie nam przejść."
 gdp_travel_events.2000.t: "Krzywa wieża"
 gdp_travel_events.2000.desc: "Czy… moje oczy mnie mylą? Czy nie stoję na stopach tak pewnie, jak mi się wydaje? Nie, zmysły mnie nie zawiodły, mimo niezwykłości widoku, który się przede mną roztacza. #EMP Wspaniała [GetBuildingType('tower_of_pisa').GetNameNoTooltip|l] jest pochylona#!!\n\n– Wasza czcigodność, grunt jest tu mniej więcej tak twardy, jak zsiadłe mleko – mówi, stojąc obok mnie, [mason.GetFirstName], osoba specjalizująca się murarstwie. – Zaczęła się przechylać, gdy byliśmy zaledwie w jednej czwartej budowy, ale w końcu udało nam się ją doprowadzić do końca.\n\n– Czyż nie jest wspaniała?"
 gdp_travel_events.2000.a: "Może ta #EMP osobliwość#! przynajmniej przyciągnie podróżnych…?"
 gdp_travel_events.2000.b: "Jesteś geniuszem albo szaleńcem. Masz u mnie robotę!"
 gdp_travel_events.2002.opening: "Wasza czcigodność!"
 gdp_travel_events.2002.desc: "Nasi murarze z radością informują, że ta okazała [GetBuildingType('tower_of_pisa').GetNameNoTooltip|l] została wreszcie ukończona.\n\nMuszę jednak wspomnieć, że dotarły do mnie również dziwne wieści z tego miasta – podróżnicy mówią o budowli #EMP zupełnie#! niepodobnej do niczego, co dotąd widzieli. Obawiam się, że coś może być nie tak z jej konstrukcją."
 gdp_travel_events.2002.a: "Chcę zobaczyć efekt ich prac na własne oczy."
 gdp_travel_events.2002.b: "Dopóki stoi prosto, nie obchodzi mnie to."
