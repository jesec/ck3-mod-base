l_polish:
 influence_house_ambition_ongoing.1001.tt: "Życzliwy słuchacz"
 influence_house_ambition_ongoing.1001.desc: "Może [target.GetFirstName] zmieni zdanie i spojrzy na sprawy jak ja, jeśli uda mi się znaleźć życzliwego słuchacza w towarzystwie, którym się otacza?\n\nMuszę wybrać kogoś charyzmatycznego, z kim przyjemnie się rozmawia; miła dla oka aparycja też z pewnością nie zaszkodzi.\n\nDyskretne rozeznanie na temat [target.Custom('PL_jego_jej')] dworzan pozwala mi zidentyfikować dwóch kandydatów. Są to [target_associate_01.GetFirstName] i [target_associate_02.GetFirstName]."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip] będzie dobrym wyborem."
 influence_house_ambition_ongoing.1001.b: "Może [target_associate_02.GetFirstNameNoTooltip] zdoła przekonać swojego pana."
 influence_house_ambition_ongoing.1001.c: "Nie. Moje słowa wystarczą."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip] przedstawia przekonujący argument w twoim imieniu"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip] nie jest w stanie sformułować solidnego argumentu"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip] przedstawia przekonujący argument w twoim imieniu"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip] nie jest w stanie sformułować solidnego argumentu"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "Oczekuje pieniędzy za pomoc."
 influence_house_ambition_ongoing.1001.cooltip.relation: "Nie chce nic w zamian."
 influence_house_ambition_ongoing.1001.cooltip.lewd: "Zaproponuj „innego rodzaju” wynagrodzenie"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "Oczekuje w zamian przysługi."
 influence_house_ambition_ongoing.1002.tt: "Twarde negocjacje"
 influence_house_ambition_ongoing.1002.desc: "Zaczynam się zastanawiać, czy [target.GetFirstName] w ogóle traktuje mnie poważnie: zalewa mnie tylko niejasnymi obietnicami, wymówkami o opóźnieniach i niekończącymi się, pozbawionymi konkretów wywodami.\n\nCzas dać wyraz niezadowoleniu – może niezupełnie wprost, ale [target.GetFirstName] musi zrozumieć, że [ROOT.Char.GetTitleAsNameNoTooltip] mojego kalibru nie będzie tolerować wodzenia za nos! Takie zachowania wiążą się z konsekwencjami."
 influence_house_ambition_ongoing.1002.a: "Pokrzyżuj [target.Custom('PL_jego_jej')] plany biznesowe poprzez sabotaż."
 influence_house_ambition_ongoing.1002.b: "Niech zbiry zasadzą się na jednego z [target.Custom('PL_jego_jej')] dworzan i go pobiją."
 influence_house_ambition_ongoing.1002.c: "Podpal [target.Custom('PL_mu_jej')] dom."
 influence_house_ambition_ongoing.1002.d: "Pokażę [target.Custom('PL_mu_jej')], czym jest terror!"
 influence_house_ambition_ongoing.1002.e: "Okażę jeszcze trochę cierpliwości."
