l_polish:
 study_scripture_outcome.10.t: "$study_scripture_title$ zasada badań"
 study_scripture_outcome.10.desc: "Księgi leżą otwarte na pulpicie – widnieją w nich przepisane cierpliwą ręką szczegóły doktryny, którą wyznaje religia [ROOT.Char.GetFaith.GetAdjective|l]. Świeca migocze pośród ciemności. [ROOT.Char.GetFaith.HouseOfWorship] wraz z wiernymi czeka na moje słowa.\n\n"
 study_scripture_outcome.10.desc_quote: "Jakiś lektor przede mną podkreślił fragment na pierwszej stronie: #EMP „[ROOT.Char.Custom('RandomStudyVerseFragment')]”.#!\n\nIle dodam od siebie, czytając tę świętą stronicę?"
 study_scripture_outcome.10.desc_generic: "Jak bardzo oddam się świętej nauce?"
 study_scripture_outcome.10.a: "Niech świat zaczeka za drzwiami klasztoru."
 study_scripture_outcome.10.b: "Na naukę przyjdzie czas, tak jak na [ROOT.Char.Custom('StudyOfficesWord')]."
 study_scripture_outcome.10.c: "Będę czytać tak, jak poruszy mnie duch."
 no_change_study_scripture_tt: "Postępy [Concept('scheme', 'spisku')|E] „[GetScheme('study_scripture').GetTypeName]” pozostają niezmienione"
 study_scripture_outcome.110.t: "$study_scripture_title$ święta stronica"
 study_scripture_outcome.110.desc: "Przeglądam wers po wersie wspaniałe święte teksty wiary znanej jako [ROOT.Char.GetFaith.GetName|l], podczas gdy wosk zbiera się pod ogarkiem świecy, a króliki i ślimaki kłócą się ze sobą na marginaliach.\n\n"
 study_scripture_outcome.110.desc_quote: "Jeden fragment przemawia do mnie szczególnie:\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!\n\nJeśli mam być pasterzem wiernych [ROOT.Char.GetFaith.HighGodNamePossessive], to muszę nosić te słowa w sercu."
 study_scripture_outcome.110.desc_generic: "Jeśli mam być pasterzem wiernych [ROOT.Char.GetFaith.HighGodNamePossessive], to muszę nosić te słowa w sercu."
 study_scripture_outcome.110.a: "Muszę się uczyć, to nie czas na wymówki."
 study_scripture_outcome.110.b: "Zrozumienie przyjdzie z czasem."
 study_scripture_outcome.120.t: "$study_scripture_title$obszerna krytyka"
 study_scripture_outcome.120.desc: "Zanim zdołam poprowadzić swoją trzodę, muszę nauczyć się kierować sobą. Komentarz osoby znanej jako [commentary_writer.GetTitledFirstName] leży przede mną otworem – owoc całego życia pracy innego uczonego nad tekstem o nazwie [ROOT.Char.GetFaith.ReligiousText], nieprzenikniony jak cierniowy gąszcz i dwakroć od niego ostrzejszy. Każdy wers, który przedrę, odsłania trzy następne.\n\nTylko dzięki dyscyplinie zdołam temu podołać."
 study_scripture_outcome.120.a: "Przeczeszę tekst w poszukiwaniu głębszego znaczenia."
 study_scripture_outcome.120.b: "Rzetelna praca przyniesie wymierne rezultaty."
 study_scripture_outcome.120.c: "Wystarczy jedna strona każdego wieczora."
 scholar_xp_high_tt: "Znacząco pogłębiasz swoją erudycję"
 scholar_xp_low_tt: "Nieznacznie pogłębiasz swoją erudycję"
 study_scripture_outcome.130.t: "$study_scripture_title$cierpliwość na wyczerpaniu"
 study_scripture_outcome.130.desc: "Dlaczego nie jestem w stanie zrozumieć tych treści? Czytam ten fragment po raz czwarty i jego sens wciąż mi umyka. Delikatnie opieram czoło o biurko.\n\n– Przynoszę świecę – mówi [ROOT.Char.Custom2('RelationToMeShort', tutor)] [tutor.GetFirstName], stając w progu drzwi. – Ach, stare krytyki. Dobrze znam te teksty. Może poczytamy razem?\n\nPodnoszę wzrok. Może pomocna dłoń jest właśnie tym, czego potrzebuję."
 study_scripture_outcome.130.a: "Naucz mnie. Chęć nauki jest silniejsza od poczucia dumy."
 study_scripture_outcome.130.b: "Usiądź ze mną na chwilę, tekst może poczekać."
 study_scripture_outcome.140.t: "$study_scripture_title$[ROOT.Char.Custom('StudyParishWord')] na kazaniu"
 study_scripture_outcome.140.desc: "Zamykam księgę z westchnieniem. Zawiera całą doktrynę, a jednak w trakcie ostatniego kazania, które wygłaszała osoba o imieniu [preacher.GetTitledFirstName]. nie było w tym żadnego sylogizmu: tylko prosta prawda [ROOT.Char.GetFaith.HighGodNamePossessive]. Cała [ROOT.Char.Custom('StudyParishWord')] była pogrążona w płaczu. #EMP Ja#! również."
 study_scripture_outcome.140.a: "Istnieje doktryna i istnieje też przekaz. Nauczę się jednego i drugiego."
 study_scripture_outcome.140.b: "Moim powołaniem jest pismo, a nie [ROOT.Char.Custom('StudyPulpitWord')]."
 study_scripture_outcome.150.t: "$study_scripture_title$sprawy doczesne"
 study_scripture_outcome.150.desc: "– Przejdźmy się – mówi [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )] [steward_scope.GetFirstName], trzymając księgę pod pachą i zapraszając na poranny spacer.\n\n– Pola świątynne, młyn, spichlerze na dziesięcinę – zwróć uwagę, które są pełne, które przeciekają, a które obiecano wznieść. Stado nie wykarmi się samą łaską."
 study_scripture_outcome.150.a: "Pokaż mi księgi."
 study_scripture_outcome.150.b: "Spacer pozwoli mi przynajmniej oczyścić głowę."
 study_scripture_outcome.160.t: "$study_scripture_title$wykształcone towarzystwo"
 study_scripture_outcome.160.desc: "Nauka umożliwiła mi nawiązanie korespondencji z osobą znaną jako [colleague.GetTitledFirstName], o której oddaniu mówi się także poza murami jej domu.\n\n"
 study_scripture_outcome.160.desc_distant: "Wymieniamy się listami na tematy wiary – zadajemy pytania, podajemy argumenty i uwagi. [colleague.Custom('PL_jego_jej')|U] pismo jest fatalne, ale rozumowanie – rozsądne."
 study_scripture_outcome.160.a: "Rozważmy to uczciwie."
 study_scripture_outcome.160.b: "Wykształcony człowiek powinien wiedzieć, jak zarządzana jest jego parafia."
 study_scripture_outcome.160.c: "Wróćmy do tekstów."
 piety_gain_high_tt: "Znaczny wzrost pobożności"
 piety_gain_low_tt: "Nieznaczny wzrost pobożności"
 study_scripture_outcome.170.t: "$study_scripture_title$zapieczętowany list"
 study_scripture_outcome.170.desc: "[ROOT.Char.Custom2('RelationToMeShort', letterman)|U] [letterman.GetFirstName] niesie go w relikwii – list opatrzony pieczęcią osoby znanej jako [senior.GetTitledFirstName].\n\n„Wieść o twojej nauce dotarła dalej, niż myślisz. Wiara jest bogatsza dla pasterza, który czyta. Wytrwaj i miej pewność mojej łaski”.\n\n"
 study_scripture_outcome.170.desc_quote: "List kończy się pojedynczym wersetem, wyróżniającym się od pozostałych:\n#EMP „[ROOT.Char.Custom('RandomBibleQuoteShort')]”#!"
 study_scripture_outcome.170.desc_generic: "List kończy się błogosławieństwem w imię [ROOT.Char.GetFaith.HighGodNamePossessive], zapisanym większymi literami niż pozostała treść."
 study_scripture_outcome.170.a: "Napiszę godną odpowiedź."
 study_scripture_outcome.170.b: "Może pochwali moją naukę w sposób bardziej… otwarty?"
 study_scripture_outcome.170.c: "Przeczytaj go jeszcze raz. Tym razem powoli."
 study_scripture_outcome.171.t: "$study_scripture_title$listy do wiernych"
 study_scripture_outcome.171.desc: "Otrzymuję listy z każdego zakątka świata wiary znanej jako [ROOT.Char.GetFaith.GetName|l]. Duchowni spierający się o słowo liturgii, wiejscy [ROOT.Char.GetFaith.PriestNeuterPlural] przerażeni własnymi wątpliwościami, uczony błagający o osąd w sprawie, której nikt z żyjących nie może zweryfikować. To moja pieczęć kładzie kres sporom.\n\n"
 study_scripture_outcome.171.desc_quote: "Dzisiejszy list zawiera cytaty z Pisma Świętego:\n#EMP „[ROOT.Char.Custom('RandomBibleQuoteShort')]”#!\n\nStosik naa moim biurku rośnie. A wraz z nim, po cichu, moja wiedza."
 study_scripture_outcome.171.desc_generic: "Stosik na moim biurku rośnie. A wraz z nim, po cichu, moja wiedza."
 study_scripture_outcome.171.a: "Odpowiem na każdy list. Takie jest zadanie pasterza."
 study_scripture_outcome.171.b: "Niech notariusze rozpowszechnią moje odpowiedzi w każdym zakątku świata wiary."
 study_scripture_outcome.171.c: "Dziś jestem uczniem. Listy mogą poczekać."
 study_scripture_outcome.172.t: "$study_scripture_title$list pastoralny"
 study_scripture_outcome.172.desc: "Dziś wieczorem studiuję listy pasterzy do odległych kongregacji: każda [ROOT.Char.Custom('StudyParishWord')] otrzymuje diametralnie różne kazania i słowa pouczeń.\n\nMoje myśli kierują się ku wiernym z hrabstwa o nazwie [pastoral_county.GetNameNoTier], położonego na ziemiach należących do osoby znanej jako [pastoral_lord.GetTitledFirstName]. Utrzymują tam kościół. Są daleko poza moim zasięgiem i bez mojego przewodnictwa… Może nadszedł czas napisać do nich osobiście.\n\nBiorę do ręki pióro. #EMP „Szanowni wierni w hrabstwie o nazwie [pastoral_county.GetNameNoTier]…”#!"
 study_scripture_outcome.172.a: "Wyślij go."
 study_scripture_outcome.172.b: "Lekcja polegała na tym, aby go napisać. To wystarczy."
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName] wysyła list mieszkańcom hrabstwa o nazwie [pastoral_county.GetNameNoTier]"
 study_scripture_outcome.180.t: "$study_scripture_title$niesienie ulgi"
 study_scripture_outcome.180.desc: "Zaczynam czytać z zaciśniętą szczęką i napiętymi ramionami, spodziewając się kolejnych obowiązków.\n\n"
 study_scripture_outcome.180.desc_confession: "Gdzieś między pierwszą a ostatnią stroną moja dusza rozpada się. Wszystko, co noszę w sobie, mówię na głos w obliczu [ROOT.Char.GetFaith.HighGodNamePossessive]. Ciężar znika.\n\nPo raz pierwszy od miesięcy droga przede mną jest jasna."
 study_scripture_outcome.180.desc_generic: "Gdzieś między pierwszą a ostatnią stroną ciężar spada mi z ramion. Jakby ktoś go ze mnie zdjął.\n\nPo raz pierwszy od miesięcy droga przede mną jest jasna."
 study_scripture_outcome.180.a: "Co by tu teraz przeczytać…"
 study_scripture_outcome.190.t: "$study_scripture_title$patronat wykształconych"
 study_scripture_outcome.190.desc: "Polityka ma swoje miejsce również w świecie nauki. Egzemplarz książki wysłany do właściwej rady, obiecujący lektor zasiadający przy właściwym stole, moje imię wypowiedziane ciepło we właściwych salach…\n\nSpędzam czas pracowicie. Jednak niewidoczna pracowitość to zmarnowana pracowitość."
 study_scripture_outcome.190.a: "Zadbajmy o to, aby synod usłyszał moje imię."
 study_scripture_outcome.190.b: "Poprośmy teologów, by podzielili się swoimi uwagami."
 study_scripture_outcome.190.c: "Mistycy powinni poznać owoce mojej pracy."
 study_scripture_outcome.190.d: "Moje oddanie mówi samo za siebie."
 study_scripture_outcome.200.t: "$study_scripture_title$wizjoner"
 study_scripture_outcome.200.desc: "Są takie strony, na których kończą się litery, a zaczyna coś innego. [GetTrait('lifestyle_mystic').GetName( mystic )] znany jako [mystic.GetTitledFirstName] pisze o ciemności jaśniejszej niż południe, o modlitwie, która trwa po jej zakończeniu, a wiara, którą jest [ROOT.Char.GetFaith.GetName|l] naucza o możliwościach dla tych, którzy odważą się po nie sięgnąć.\n\nCzytam, dopóki świeca nie zgaśnie. A później długo siedzę w ciemności, nasłuchując."
 study_scripture_outcome.200.a: "Coś czeka w tej ciemności. Poszukam tego."
 study_scripture_outcome.200.b: "Rzucam wyzwanie tajemnicom. Nie boję się."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] zasługuje na list z wyrazami uznania."
 study_scripture_outcome.200.d: "Skupię się na prostszych naukach, a możliwości pozostawię na zaś."
 study_scripture_outcome.300.t: "$study_scripture_title$nocne czuwanie"
 study_scripture_outcome.300.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] stoi w zupełnej ciszy. Między wieczornym a porannym oficjum jest godzina, która nie należy do nikogo, a ja uczyniłem ją swoją – jedna świeca, mrok i tajemnica napierająca wokół płomienia.\n\nCoś czeka za tą ciszą. Jest cierpliwe. Dziś w nocy cierpliwość mam w sobie i ja."
 study_scripture_outcome.300.a: "Głębiej. Wejdę głębiej."
 study_scripture_outcome.300.b: "Godzina ciszy i spokoju, a potem sen."
 study_scripture_outcome.300.c: "Długo już czuwam. Wystarczy tego."
 study_scripture_outcome.100.t: "$study_scripture_title$kwestia sukcesji"
 study_scripture_outcome.100.desc: "Zapada noc, gdy kładę przed sobą kanony elekcyjne, których strony rozświetla słabe światło. Kto może zostać wyniesiony i kto tego wyniesienia dokona, jakie precedensy należy uszanować, a które można nagiąć – wszystko to jest zapisane i dostępne dla tych, którzy mają dość cierpliwości, by to przeczytać.\n\nStarcy umierają. Zbierają się konklawe. A kardynałowie pamiętają, kto znał prawo, gdy miało to znaczenie."
 study_scripture_outcome.100.a: "Pewnego dnia padnie pytanie. Ja będę odpowiedzią."
 study_scripture_outcome.100.b: "Mądrość wymaga czasu. Ambicje muszą zaczekać."
 study_scripture_outcome.100.c: "Wolę się położyć…"
 pam_ss_papabile_tt: "Twój [papabile_score|El] w sukcesji papieskiej zwiększa się o #P 10#!"
 study_scripture_outcome.101.t: "$study_scripture_title$znany egzegeta"
 study_scripture_outcome.101.desc: "Odpowiedź przychodzi mi do głowy przy zimnej kolacji, między jednym kęsem a drugim. W końcu wiem, jak przeczytać ten fragment:\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!\n\nPokolenia [Glossary('egzegetów', 'GLOSS_EXEGETE')] ścierały się o te słowa. Teraz ich znaczenie wydaje się całkowicie jasne. Pozostaje pytanie, co zrobić z moją interpretacją."
 study_scripture_outcome.101.desc_generic: "Pokolenia [Glossary('egzegetów', 'GLOSS_EXEGETE')] ścierały się o te słowa. Teraz ich znaczenie wydaje się całkowicie jasne. Pozostaje pytanie, co zrobić z moją interpretacją."
 study_scripture_outcome.101.a: "Wygłoś go oficjalnie podczas kolejnej uczty."
 study_scripture_outcome.101.b: "Rozpowszechnij go po cichu wśród uczonych."
 study_scripture_outcome.101.c: "Dano mi go w milczeniu, więc takoż go zwrócę."
 GLOSS_EXEGETE: "Osoba zajmująca się egzegezą – ekspert lub uczony, który potrafi krytycznie wyjaśniać, interpretować i objaśniać tekst, zwłaszcza pisma religijne."
 study_scripture_outcome.102.t: "$study_scripture_title$jasność doktrynalna"
 study_scripture_outcome.102.desc: "Przez lata doktryny, które wyznaje wiara [ROOT.Char.GetFaith.GetAdjective|l], tkwiły w mojej głowie, lecz część z nich nigdy nie wydawała mi się sensowna.\n\n"
 study_scripture_outcome.102.desc_tenet: "Dziś wieczorem dogmat „[pam_ss_clarity_tenet.GetBaseName]” wreszcie stał się jasny: czego wymaga, co wybacza i gdzie leżą jego granice. Rozumiem go na tyle dobrze, że mogę go bronić przed uczonymi i tłumaczyć dzieciom."
 study_scripture_outcome.102.desc_generic: "Dziś wieczorem nauka wreszcie przynosi jasność: czego wymaga, co wybacza i gdzie leżą jej granice. Rozumiem ją na tyle dobrze, że mogę jej bronić przed uczonymi i tłumaczyć dzieciom."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!"
 study_scripture_outcome.102.a: "Muszę ją spisać, zanim zgaśnie światło."
 study_scripture_outcome.102.b: "Wystarczy mi satysfakcja."
 study_scripture_outcome.102.c: "Nawet objawienie może poczekać do rana."
 study_scripture_outcome.121.t: "$study_scripture_title$nauczyciel"
 study_scripture_outcome.121.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )|U] [student_courtier.GetTitledFirstName] przesiaduje w bibliotece długo po tym, jak powinny już zgasnąć świece, pochylając się nad tekstem zbyt trudnym dla [student_courtier.Custom('PL_jego_jej')] rozumu.\n\n– Niech mi [ROOT.Char.Custom('FormOfAddressForLiege')] wybaczy – wykrztusza z zaskoczeniem. – Ja… szkoda, że nie umiem przeczytać tego tomu…\n\nPamiętam, jak cenny był dla mnie nauczyciel, który faktycznie #EMP przeczytał#! tę księgę."
 study_scripture_outcome.121.a: "Przeczytamy to dokładnie. Razem."
 study_scripture_outcome.121.b: "Zasponsoruję [student_courtier.Custom('PL_go_ja')]."
 study_scripture_outcome.121.c: "Pozwól [student_courtier.Custom('PL_mu_jej')] uczyć się bez pomocy. To wzmacnia charakter."
 study_scripture_outcome.122.t: "$study_scripture_title$katechizm"
 study_scripture_outcome.122.desc: "Moje nauki przyniosły owoce. [ROOT.Char.Custom('ResidenceBuildingHallsType')|U] miejsca, którym jest [ROOT.Char.Custom('ResidenceBuilding')], to idealna przestrzeń, by zebrać moich domowników i przedstawić im tekst o nazwie [ROOT.Char.GetFaith.ReligiousText].\n\nJa czytam, oni słuchają. Wkrótce pojawiają się pytania – niektóre proste, inne zaskakująco trafne. Wygląda na to, że nie tylko ja mam apetyt na świętą naukę."
 study_scripture_outcome.122.a: "Wers po wersie. Na tym to polega."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip] ma bystry umysł. Nauczę [pupil.Custom('PL_go_ja')] też innych rzeczy."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip] zostaje jeszcze chwilę. Drzwi są otwarte."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip] ma już dość. Dam [devout.Custom('PL_mu_jej')] moje błogosławieństwo."
 study_scripture_outcome.123.t: "$study_scripture_title$[ROOT.Char.Custom('StudySeminaryWord')|l]"
 study_scripture_outcome.123.desc: "Wieść o moich studiach rozeszła się wśród pielgrzymów i handlarzy, którzy przyprowadzili mi dziś potencjalnego ucznia. [aspirant.GetTitledFirstName] stoi u moich bram z pożyczoną książką w drżących dłoniach. Widać w [aspirant.Custom('PL_nim_niej')] zmęczenie i upór.\n\n– Powiadają, że naprawdę czytasz to, co głosisz. Naucz mnie, a będę ci służyć."
 study_scripture_outcome.123.a: "Ach. Zaczynijmy od alfabetu wiary."
 study_scripture_outcome.123.b: "Mój dwór to nie [ROOT.Char.Custom('StudySeminaryWord')|l]."
 study_scripture_outcome.400.t: "$study_scripture_title$medyku, ulecz samego siebie"
 study_scripture_outcome.400.desc: "Ten fragment daje mi do myślenia. Jego potępienie wydaje się niepokojąco znajome.\n\n"
 study_scripture_outcome.400.desc_generic: "Tekst nie wymienia mojego imienia, a jednak to robi: autor napisał w nim, że jestem grzesznikiem – wprost i bez litości, zupełnie jakby mnie znał."
 study_scripture_outcome.400.desc_end: "\n\nMogę zamknąć książkę i nie czytać dalej. Ale oskarżenie pozostanie."
 study_scripture_outcome.400.a: "Jest tylko jedno lekarstwo: pokuta."
 study_scripture_outcome.400.b: "Muszę czytać dalej, choćby nie wiem co."
 study_scripture_outcome.400.c: "Święci głoszą kazania. Grzesznicy rządzą państwami."
 study_scripture_outcome.410.t: "$study_scripture_title$osobliwa krytyka"
 study_scripture_outcome.410.desc: "Kodeks jest zapożyczony, a jego poprzedni czytelnik pozostawił na marginesach własne myśli: sprzeciwy, modlitwy i notatki na temat dogmatu, który zwą „[pam_ss_margin_tenet.GetBaseName]”.\n\nNależałoby zignorować te bazgroły. Zamiast tego czytam je drugi raz."
 study_scripture_outcome.410.a: "A teraz trzeci raz, powoli."
 study_scripture_outcome.410.b: "Tak poważny błąd zasługuje na stosowne sprostowanie."
 study_scripture_outcome.410.c: "Całość musi pochłonąć ogień."
 study_scripture_outcome.430.t: "$study_scripture_title$dogmat i serce"
 study_scripture_outcome.430.desc: "Spośród nauk wiary znanej jako [ROOT.Char.GetFaith.GetName|l] jedna jest mi najbliższa: „[pam_ss_heart_tenet.GetBaseName]”. Choć od dawna noszę ją w sercu, dotąd nie jestem w stanie jej obronić. Dziś wieczorem przestudiuję ją w poszukiwaniu wad.\n\n"
 study_scripture_outcome.430.desc_quote: "Teksty odpowiadają jednym głosem:\n#EMP „[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]”#!\n\nBłąd nigdy nie leżał w samej nauce."
 study_scripture_outcome.430.desc_generic: "Teksty odpowiadają jednym głosem, starszym i pewniejszym niż mój własny. Wina nigdy nie leżała w naukach."
 study_scripture_outcome.430.a: "Wierzę w nią. Niech cała [ROOT.Char.Custom('StudyParishWord')] zobaczy, że żyję według jej zasad."
 study_scripture_outcome.430.b: "Stworzę dzieło broniące jej."
 study_scripture_outcome.430.c: "Jeśli przyjrzeć się bliżej, każda nauka ma swoje wady…"
 pam_ss_spread_tenet_tt: "Twoja pisemna obrona może przekonać #V 3#! [Concept('rulers', 'władców')|E], by przyjęli dogmat „[pam_ss_heart_tenet.GetBaseName]”"
 pam_ss_conviction_spread_tt: "$study_scripture_title$przyjęto dogmat osobisty"
 study_scripture_outcome.1000.t: "$study_scripture_title$skarcenie pasterza"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName] nie podnosi głosu. Nie musi.\n\n– Powiadają, że zaniedbujesz nauki. Pasterz, który się nie uczy, prowadzi trzodę donikąd. Wielu pozazdrościłoby ci tego, co ci dano – i cóż z tego wynikło?\n\nNastała cisza jest gorsza od jakiegokolwiek krzyku."
 study_scripture_outcome.1000.desc_letter: "List nosi pieczęć osoby znanej jako [senior.GetTitledFirstName], a każdy wyważony wers trafia niczym strzała:\n\n„Docierają do mnie wieści, że zaniedbujesz naukę. Pasterz, który się nie uczy, prowadzi trzodę na manowce. Wielu pozazdrościłoby ci tego, co ci dano – i cóż z tego wynikło?”\n\nList nie jest podpisany. Pieczęć mówi wszystko."
 study_scripture_outcome.1000.desc_dream: "We śnie stoję w wielkiej bibliotece, gdzie każda księga nosi moje imię, lecz ich strony są puste. Postać, którą znam ze stu świętych obrazów, delikatnie zamyka ostatnią z nich, jakby zamykała oczy zmarłemu.\n\n– Wielu pozazdrościłoby tego, co ci dano – mówi święty. Budzę się nagle, a echo tych słów wciąż rozbrzmiewa w komnacie."
 study_scripture_outcome.1000.a: "Nie będę znowu kimś niewystarczającym."
 study_scripture_outcome.1000.b: "Dłużej tego nie zniosę. Dość już, na dobre."
 study_scripture_outcome.1000.c: "Dosyć tego. Muszę odpocząć."
 never_study_scripture_again_tt: "Już #N nigdy#! nie możesz podjąć się realizacji [Concept('scheme', 'spisku')|E] „[GetScheme('study_scripture').GetTypeName]”"
 study_scripture_outcome.1010.t: "$study_scripture_title$dar atramentu"
 study_scripture_outcome.1010.desc: "Przybywa paczka z miejsca o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 study_scripture_outcome.1010.end_christian: "Wstążką zaznaczono strony z fragmentem, który sprawia mi trudność:\n\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!\n\nSzczodry to dar – i użyteczny."
 study_scripture_outcome.1010.end: "W środku znajduje się pięknie oprawiona, starannie zdobiona księga z modlitwami, komentarzami i pieczołowicie wykonanymi iluminacjami.\n\nSzczodry to dar – i użyteczny. Te strony mogą skrywać odpowiedzi, których nie udało mi się dotąd znaleźć."
 study_scripture_outcome.1010.a: "Dobrze wykorzystam ten prezent."
 study_scripture_outcome.1010.b: "To zacna książka. Będzie dobrze wyglądać na mojej półce."
 pam_ss_devotional_book_name: "Księga modlitewna"
 pam_ss_devotional_book_description: "Zdobiony tom zawierający święte teksty wraz z komentarzami, przepisany i wyzłocony z oczywistym oddaniem. Wstążką zaznaczono strony z fragmentem, który odbiorca najbardziej potrzebował przeczytać."
 study_scripture_outcome.1020.t: "$study_scripture_title$umartwianie ciała"
 study_scripture_outcome.1020.desc: "Tej nocy – podobnie jak poprzednich – teksty mnie przerastają. Uciekam spojrzeniem od strony; moje myśli krążą wokół kolacji, łóżka i czegokolwiek, co nie jest związane z doktryną.\n\nProblem tkwi w ciele. Starzy asceci wiedzieli, że wygoda to najdyskretniejszy ze sług [ROOT.Char.GetFaith.DevilNamePossessive], a głód utwardza ducha. Może ciało trzeba nauczyć pokory, by dusza mogła dostąpić oświecenia."
 study_scripture_outcome.1020.a: "Biczowanie pomoże mi oczyścić umysł."
 study_scripture_outcome.1020.b: "Wystawię ciało na głód, by nakarmić duszę."
 study_scripture_outcome.1020.c: "A może lepiej zjem kolację, położę się i zacznę jutro na świeżo?"
 study_scripture_outcome.1030.t: "$study_scripture_title$izolacja w klasztorze"
 study_scripture_outcome.1030.desc: "Moje postępy w nauce tkwią w miejscu. To samo biurko, ta sama świeca, te same porażki. [counselor.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', counselor )], nie baczy na rangi w swym oddaniu. Ruszam [counselor.Custom('PL_go_ja')] znaleźć.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "– Otaczasz się zbyt wieloma murami – oznajmia [counselor.GetFirstNameNoTooltip], wskazując gestem oświetloną pojedynczą lampą celę, cichą i pustą. – Starzy pustelnicy znali sposób. Trzeba odrzucić wszystko. To, co zostanie, jest tym, czego szukasz."
 study_scripture_outcome.1030.desc_monastery: "– Czytasz jak władca –  stwierdza bez cienia uszczypliwości [counselor.GetFirstNameNoTooltip]. – Pokonujesz strony i liczysz je jak podatki. Tutaj studiuje się jeden wiersz przez tydzień, by jego treść znalazła w nas odbicie."
 study_scripture_outcome.1030.a: "Potrzebuję błogosławieństwa w nauce."
 study_scripture_outcome.1030.b: "Będę więc studiować jeden wiersz przez dwa tygodnie."
 study_scripture_outcome.1030.c: "Pomodlę się nad tym. Tyle wystarczy."
 study_scripture_outcome.1040.t: "$study_scripture_title$druga para rąk"
 study_scripture_outcome.1040.desc_acolyte: "Dostaję pomoc, choć o nią nie proszę. [helper.GetTitledFirstName] – [ROOT.Char.Custom2( 'RelationToMeShort', helper )] – organizuje moje notatki, wyszukuje odpowiednie komentarze i przycina świecę. Szybko uczy się moich nawyków; wie nawet, przy których fragmentach wzdycham.\n\n– Modlitwy idą lepiej, gdy nie dręczy cię zmęczenie – mówi, stawiając przy moich notatkach ciepły posiłek. To [helper.Custom('GetLocalStreetFood')|l]."
 study_scripture_outcome.1040.desc_partner: "[helper.GetTitledFirstName] – [ROOT.Char.Custom2( 'RelationToMeShort', helper )] – wkrada się do pokoju, wyciąga mi kodeks z dłoni i odczytuje na głos wiersz. To święte słowa. Muszę jednak błagać [ROOT.Char.GetFaith.HighGodNamePossessive] o wybaczenie, gdyż tej nocy nie ma dla mnie nic świętszego niż [helper.Custom('PL_jego_jej')] [helper.Custom('ObjectifiedFeature')].\n\n– Pozwól, że pomogę – szepcze [helper.GetTitledFirstName], stojąc dość blisko, by dzielić ze mną ciepło świecy. – Chcę tego."
 study_scripture_outcome.1040.a: "Pisz więc, co dyktuję, do świtu. Skończymy to."
 study_scripture_outcome.1040.b: "Spędźmy więc razem godzinę."
 study_scripture_outcome.1040.c: "Już wystarczająco pomagasz mi swoją życzliwością."
 study_scripture_outcome.1040.d: "Chodź bliżej. Blask świecy nie sięga tak daleko…"
 study_scripture_outcome.1050.t: "$study_scripture_title$mrok duszy"
 study_scripture_outcome.1050.desc: "Tekst mnie przerasta. Po północy odpowiedzi zmieniają się w pytania, a pewność ustępuje wobec wątpliwości.\n\n"
 study_scripture_outcome.1050.desc_quote: "Nie jestem pierwszą osobą, która mierzy się z taką ciszą. #EMP „Panie mój, czemuś mnie opuścił?”#!\n\nŚwieca płonie. Cisza trwa. Co teraz?"
 study_scripture_outcome.1050.desc_generic: "To zwątpienie, z jakim mierzyli się święci w każdym stuleciu. Godzina, w której z nieznanych nam powodów nie słychać słów [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nŚwieca płonie. Cisza trwa. Co teraz?"
 study_scripture_outcome.1050.a: "Zwątpienie można odczytać – jak każdy inny tekst."
 study_scripture_outcome.1050.b: "Może cisza jest odpowiedzią."
 study_scripture_outcome.1050.c: "Czas zostawić za sobą słowa i wątpliwości, i zgłębić tajemnicę."
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, 'Siostry', 'Bracia' )] Reguły"
 study_scripture_outcome.1060.desc_house: "Mam trudności i wrażenie, że nie udało mi się nauczyć nic wartościowego. Dowiadują się jednak o tym [order_head.GetPrimaryTitle.GetNameNoTier] i głowa zakonu, który ma siedzibę w hrabstwie o nazwie [order_house_county.GetNameNoTier]. Dziś na mój dziedziniec wjeżdża skrzypiący wóz z kopiami analiz, skrzynią pełną świec i listem opatrzonym pieczęcią osoby znanej jako [order_head.GetTitledFirstName].\n\n„Żaden pasterz nie studiuje sam, póki istnieje Reguła. Powiedz słowo, a to, co nasze, będzie i Twoje”."
 study_scripture_outcome.1060.desc_far: "Wieści o moich trudnościach zawędrowały daleko – nawet do miejsca o nazwie [order_head.GetPrimaryTitle.GetNameNoTier]. Dziś na mój dziedziniec wjeżdża skrzypiący wóz z kopiami analiz, skrzynią pełną świec i listem opatrzonym pieczęcią osoby znanej jako [order_head.GetTitledFirstName].\n\n„Żaden pasterz nie studiuje sam, póki istnieje Reguła. Powiedz słowo, a to, co nasze, będzie i Twoje”."
 study_scripture_outcome.1060.a: "Dzięki niech będą każdej dłoni, która przepisała te teksty."
 study_scripture_outcome.1060.b: "Proszę o przysłanie do mnie oczytanego duchownego."
 study_scripture_outcome.1060.c: "Oby chroniła ich opatrzność [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_ss_lettered_brother_tt: "Do twojego [Concept('court', 'dworu')|E] dołącza #EMP oczytany duchowny#!"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUINameNotMe] przybywa z miejsca o nazwie [order_head.GetPrimaryTitle.GetNameNoTier]"
