l_polish:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "Znaleziony [target.GetAdherentNameNoTooltip|l]!"
 study_faith_outcome.0010.desc: "Moje dyskretne dochodzenie i niewielkie łapówki przyniosły efekty! [study_faith_target.GetShortUINameNotMe] stoi teraz przede mną jako rzekomy [target.GetAdherentName|l].\n\n"
 study_faith_outcome.0010.desc.in_realm: "Nie minęło dużo czasu, odkąd moja prośba o spotkanie z osobą, którą jest [target.GetAdherentName|l] z mojego państwa, poszła w świat. [study_faith_target.GetShortUINameNotMe] stoi teraz przede mną w odpowiedzi na moje wezwanie.\n\n"
 study_faith_outcome.0010.d.intimidated: "– Czego [ROOT.Char.GetTitleAsName] sobie ode mnie życzy? – pyta, trzęsąc się. Straż rzuca [study_faith_target.Custom('PL_mu_jej')] podejrzliwe spojrzenia, gotowa działać przy pierwszych oznakach czarów."
 study_faith_outcome.0010.d.safe: "– Czego [ROOT.Char.GetTitleAsName] sobie ode mnie życzy? – pyta nieśmiało. Moi strażnicy patrzą na [study_faith_target.Custom('PL_niego_nia')] z ciekawością, wiedząc o plotkach dotyczących moich poszukiwań."
 study_faith_outcome.0010.a: "Interesuje mnie [target.GetNameNoTooltip]. Naucz mnie, czego trzeba."
 study_faith_outcome.0010.b: "Zmieniam zdanie."
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUINameNotMe] wyjdzie na wolność, aby żyć tak, jak [study_faith_target.Custom('PL_mu_jej')] się podoba"
 study_faith_outcome.0101.t: "Przyjaciel [actor.GetFaith.HighGodNamePossessive]"
 study_faith_outcome.0101.desc: "Dzięki dogłębnej analizie obrządku znanego jako [actor.GetRite.GetName|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName] nie jest już dla mnie enigmą, a co ważniejsze – mogę teraz podążać zbożną ścieżką."
 study_faith_outcome.0101.a: "Nadszedł czas, by podjąć decyzję o nawróceniu."
 study_faith_outcome.0101.b: "O [ROOT.Char.GetFaith.GoodGodNames]! Nie mogę was odrzucić!"
 study_faith_outcome.0102.desc: "Dziękuję wam za cierpliwość i hojność, z jaką pomogliście mi przezwyciężyć moją niewiedzę. Teraz mogę podążać zbożną ścieżką."
 study_faith_outcome.0102.a: "Należało tak postąpić."
 study_faith_outcome.0103.desc: "Muszę podążać za świętymi naukami! Nie dam się zmusić do rezygnacji z obrządku znanego jako [recipient.GetRite.GetName|l]."
 study_faith_outcome.0103.a: "Nieposłuszeństwo ma swoją cenę…"
 study_faith_outcome.0111.t: "Trudności w pojęciu obrządku znanego jako [actor.GetRite.GetNameNoTooltip|l]"
 study_faith_outcome.0111.desc: "Dogłębna analiza obrządku znanego jako [actor.GetRite.GetName|l] sprowadziła mnie na manowce! Nie tylko nie jestem w stanie podążać ścieżką cnoty, lecz obawiam się też, że [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetFirstName] myli się w swoich przekonaniach."
 study_faith_outcome.0111.a: "Być może zrozumienie nadejdzie wraz z nawróceniem…"
 study_faith_outcome.0111.b: "Podwoję swoje wysiłki"
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$: punkt zwrotny"
 study_faith_outcome.1000.desc: "Po wielu latach ciężkiej pracy w końcu udało mi się opanować nauki. Niekończące się godziny spędzone nad książkami, nieprzespane noce praktykowania obrządków, niezliczone lekcje i teologia [target.GetFaith.GetAdjective|l]… W końcu wszystko zaowocowało poznaniem obrządku o nazwie [target.GetRite.GetName|l].\n\nMoje wysiłki były skupione na naśladowaniu osoby znanej jako [target.GetTitledFirstName], lecz teraz chyba zaczynam rozumieć, ile znaczy dla [target.Custom('PL_niego_niej')] ciepło, którym ogrzewa ducha obrządek znany jako [target.GetRite.GetName|l]."
 study_faith_outcome.1000.a: "Mogę poznać niemal każdy zwyczaj każdej wiary!"
 study_faith_outcome.1000.b: "Obrządek o nazwie [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip|l] przemawia do mnie bardziej niż moje własne zwyczaje…"
 study_faith_outcome.1200.t: "$study_faith$: dogmat w centrum uwagi"
 study_faith_outcome.1200.desc: "Tylko znajome ściany mojego gabinetu są świadkami skromnego zwycięstwa, gdy rozgryzam wartość dogmatu „[discovered_tenet.GetName( target.GetRite )]” obrządku, którym jest [target.GetRite.GetName|l]. Choć może wydawać się to dziwne, z odrobiną inwencji jestem w stanie wyobrazić sobie osobę znaną jako [target.GetTitledFirstName] i jej krewnych oddających się tej obcej praktyce.\n\nTo ledwie początek tej długiej drogi, ale obrządek znany jako [target.GetRite.GetNameNoTooltip|l] krok po kroku prowadzi mnie naprzód."
 study_faith_outcome.1200.a: "Chcę odkryć więcej zwyczajów obrządku o nazwie [target.GetRite.GetNameNoTooltip|l]!"
 study_faith_outcome.1200.b: "To fascynujące. Ciekawi mnie, jak to się odnosi do doktryny „[additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]”!"
 study_faith_outcome.1200.c: "To mnie niepokoi…"
 study_faith_outcome.1400.t: "$study_faith$: zwyczaje obrządku o nazwie [target.GetRite.GetNameNoTooltip|l]"
 study_faith_outcome.1400.desc: "Aby zrozumieć obrządek, którym jest [target.GetRite.GetName|l], należy studiować nie tylko jego ramy metafizyczne, ale także przyziemny wpływ na codzienne życie.\n\nPo zastanowieniu się nad samą koncepcją doktryny „[discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]”, udało mi się ją poznać na tyle, by powiązać ją bezpośrednio z praktykami obrządku o nazwie [target.GetRite.GetNameNoTooltip|l]."
 study_faith_outcome.1400.alt1.desc: "\n\nTo z kolei rzuciło światło na niuanse w praktykowaniu przez nich doktryny „[third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]”!"
 study_faith_outcome.1400.alt2.desc: "\n\nTo tylko jeden element znacznie większej układanki, lecz każdy kolejny przybliża mnie do zrozumienia obrządku o nazwie [target.GetRite.GetNameNoTooltip|l]."
 study_faith_outcome.1400.a: "Przydatna wiedza. Czytajmy dalej."
 study_faith_outcome.1400.b: "Będę pracować do późna."
 study_faith_outcome.1400.c: "Będę prosić o więcej, aż [target.GetShortUINameNotMeNoTooltip] ulegnie."
 study_faith_outcome.1500.t: "$study_faith$: poza moim zasięgiem"
 study_faith_outcome.1500.desc: "Długotrwałe studiowanie zaprowadziło mnie tak daleko, jak było to możliwe dla kogoś z zewnątrz. Wszelkie nieodkryte tajemnice [Concept('rite', 'obrządku')|E] o nazwie [target.GetRite.GetName|l] są przeznaczone dla tych, którzy wychowywali się zgodnie z jego praktykami. Tajemnice te przekazywano nowicjuszom i chroniono przed uwiecznieniem w formie tekstu, przed oczami ciekawskich, a nawet przed najcierpliwszym nauczycielem.\n\nTo, co było dane mi poznać, już wiem."
 study_faith_outcome.1500.a: "Wiem tyle, ile można było się nauczyć."
 study_faith_outcome.1500.toast: "$study_faith$: wnioski"
 study_faith_outcome.1500.toast.desc: "Udało ci się poznać wszystkie [Concept('core_tenet', 'dogmaty')|E] i [Concept('doctrine', 'doktryny')|E] [Concept('rite', 'obrządku')|E] o nazwie [target.GetRite.GetName|l], które mógł poznać obcy."
 study_faith_scheme_stays_active: "[scheme|E] pozostaje aktywny"
 study_faith_outcome.3000.t: "$study_faith$: wznowienie nauki?"
 study_faith_outcome.3000.desc: "Niestety [target.GetTitledFirstName] jest teraz gdzie indziej. Szkoda, ponieważ szukam pomocy w zrozumieniu szczegółów wiary, którą jest [target.GetFaith.GetName|l].\n\nNie muszę jednak przerywać nauki – wystarczy, że znajdę kogoś innego do naśladowania!"
 study_faith_outcome.3000.alt1.desc: "Niestety okazało się, że [target.GetTitledFirstName] nie jest najlepszym źródłem wiedzy o wierze, którą jest [target.GetFaith.GetName|l].\n\nNie muszę jednak przerywać nauki – wystarczy, że znajdę kogoś innego do naśladowania!"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] żarliwie wyznaje wiarę!"
 study_faith_outcome.3000.b: "A może [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? [potential_continuation_target_2.Custom('PL_jego_jej')|U] teologia jest interesująca."
 study_faith_outcome.3000.c: "Może [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d: "Ach, szukał[Select_CString(ROOT.Char.IsFemale, 'am', 'em' )] powodu, żeby przestać się uczyć! Hurra!"
 study_faith_scheme_retains_progress: "[scheme|E] zachowuje cały dotychczasowy postęp"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U] studiuje obrządek!"
 child_studied_faith_desc: "[owner.Custom('GetDaughterSon')|U] lepiej rozumie [rite|El], którym jest [target.GetRite.GetName|l]"
 child_studied_faith_invalidated_title: "Spisek „Studiuj obrządek” twojego dziecka został unieważniony"
 child_studied_faith_invalidated_desc: "[scheme|E] „[GetScheme('study_faith').GetTypeName]” twojego dziecka został unieważniony"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$: swoboda młodości"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: swoboda doświadczenia"
 study_faith_ongoing.1000.desc.young: "Nauka wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], przynosi niesamowite rezultaty. Czuję, że mam w sobie całe skupienie i energię tego świata!"
 study_faith_ongoing.1000.desc.theologian: "Nauka wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], idzie powoli, ale do przodu. Jej ramy nie różnią się znacząco od struktury innych wyznań!"
 study_faith_ongoing.1000.desc: "\n\n– #EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\nChoć mogę parafrazować, czuję, że duch wiary jest jasny, nawet gdy próbuję zrozumieć szczegóły tego słowa.\n\nDzięki tak intensywnej koncentracji niebawem posiądę wszystkie sekrety wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!"
 study_faith_ongoing.1000.a: "Poświęcę temu #EMP cały#! swój czas!"
 study_faith_ongoing.1000.b: "Wolał[Select_CString(ROOT.Char.IsFemale, 'abym', 'bym' )] poświęcić czas na coś innego…"
 study_faith_ongoing.1010.t: "$study_faith$: głębokie zrozumienie"
 study_faith_ongoing.1010.desc: "– #EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\nCzując czyjąś obecność, odwracam wzrok od pisma czczonego przez wyznawców wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]. [lover_target.GetFirstName] pochyla się nade mną z lubieżnością w oczach.\n\n– Czy ten tekst opisuje wiarę znaną jako [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]? – pyta.\n\n– To niesamowite spotkać na dworze współwyznawcę. W dodatku jest nim [ROOT.Char.GetTitleTierName]! Być może moje… głębokie zrozumienie będzie dla ciebie pomocne?"
 study_faith_ongoing.1010.a: "Udajmy się do moich komnat, aby nikt nam nie przeszkadzał."
 study_faith_ongoing.1010.b: "Bezczelny [lover_target.Custom('GetDerogatoryNonbeliever')]! Ja tu tylko studiuję."
 study_faith_ongoing.1010.c: "[lover_target.Custom2('InsultNounSexual', ROOT.Char)|U] z ciebie! Odejdź, muszę się skupić!"
 study_faith_ongoing.1010.c.tt: "#EMP Zamykasz drzwi przed [lover_target.Custom('PL_jego_jej')] nosem i wracasz do nauki#!"
 study_faith_ongoing.1011.t: "$study_faith$: fałszywy trop"
 study_faith_ongoing.1011.desc: "Od pewnego czasu sytuacja wydawała mi się podejrzana, a po zadaniu kilku podchwytliwych pytań kłamstwa osoby znanej jako [scheme.GetTargetCharacter.GetTitledFirstName] w końcu wychodzą na jaw. Pomimo tego, co twierdzi, wyznaje swoją wiarę, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], nieszczerze!\n\nChoć odkrycie szopki odstawianej przez bezbożnika już samo w sobie jest interesujące, to pełne zrozumienie przeze mnie wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l], wymaga znalezienia wierniejszego wyznawcy…"
 study_faith_ongoing.1011.a: "Nie mogę już polegać na osobie znanej jako [scheme.GetTargetCharacter.GetShortUINameNotMeNoTooltip]."
 study_faith_ongoing.1011.b: "Skoro [scheme.GetTargetCharacter.Custom('PL_jemu_jej')] udawało się tak dobrze to ukrywać, może i mi się uda…"
 study_faith_ongoing.1011.c: "W co #EMP faktycznie#! wierzy [scheme.GetTargetCharacter.GetShortUINameNotMeNoTooltip]?"
 study_faith_ongoing.1011.c.tt: "Spróbuję zgłębić [scheme.GetTargetCharacter.Custom('PL_jego_jej')] skryte przekonania."
 study_faith_ongoing.1012.t: "$study_faith$: praktykując starożytne obrządki"
 study_faith_ongoing.1012.desc: "Moje próby zgłębienia wiary osoby znanej jako [scheme.GetTargetCharacter.GetTitledFirstName] okazały się owocne, choć w nieoczekiwany sposób. Podczas gdy niewątpliwie nie wyznaje [scheme.GetTargetCharacter.GetSheHe] wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l], wydaje się, że praktykuje dziwne, zapomniane obrządki wiary o nazwie [actual_faith.GetName|l]. Jej praktyki przypominają… czary.\n\nTo odkrycie mną wstrząsnęło. Czy jest jakiś sposób, żeby to wykorzystać?"
 study_faith_ongoing.1012.a: "No cóż, nadal jest to #EMP ciekawe#!."
 study_faith_ongoing.1012.b: "Potrzebny mi będzie nowy nauczyciel."
 study_faith_ongoing.1012.b.tt: "Spróbujesz znaleźć podobnego nauczyciela, aby kontynuować naukę wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]"
 study_faith_ongoing.1012.c: "To wydaje się o wiele bardziej fascynujące niż wiara o nazwie [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1012.c.tt: "Od teraz będziesz studiować wiarę, którą jest [actual_faith.GetNameNoTooltip|l]"
 study_faith_ongoing.1013.t: "$study_faith$: bardziej mim niż mistyk"
 study_faith_ongoing.1013.desc: "Moje próby zgłębienia wiary osoby znanej jako [scheme.GetTargetCharacter.GetTitledFirstName] spełzły na niczym. Stwarza jedynie pozory pobożności, a pod fasadą kryje się wizja świata wydająca się całkowicie pozbawiona teologicznych fundamentów.\n\nA może przestrzega zasad wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], zwyczajnie dla wygody, wpływów lub bezpieczeństwa?\n\nJakiekolwiek byłyby tego powody, jasne jest, że  nie ma [scheme.GetTargetCharacter.GetSheHe] przekonania do wyznawanych przez siebie poglądów."
 study_faith_ongoing.1013.a: "To strata czasu! Mam dość wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]."
 study_faith_ongoing.1020.t: "$study_faith$: miejscowy wierny"
 study_faith_ongoing.1020.desc: "Wygląda na to, że wieści o mojej nauce praktyk, które oferuje wiara [scheme.GetTargetCharacter.GetFaith.GetAdjective|l], dotarły do uszu osoby znanej jako [faith_helper.GetTitledFirstName]. To miejscowy praktyk, który oferuje mi pomoc w nauce.\n\n– Nie oczekuję niczego poza wdzięcznością za moje wysiłki, wasza czcigodność – mówi, [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "Jeśli mi pomożesz, to złoto będzie twoje."
 study_faith_ongoing.1020.b: "Przysługa za przysługę?"
 study_faith_ongoing.1020.c: "Och, jesteś #EMP tak[Select_CString( language_helper.IsFemale, 'a bezinteresowna', 'i bezinteresowny' )]#! oferując mi swoją pomoc, za darmo!"
 study_faith_ongoing.1020.d: "Dziękuję, ale poradzę sobie sam[Select_CString( ROOT.Char.IsFemale, 'a', '' )]."
 study_faith_ongoing.1020.c.success: "Przymilasz się do osoby o imieniu [faith_helper.GetFirstNameNoTooltip] w nadziei na otrzymanie pomocy"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] odkrywa twoją próbę manipulacji"
 study_faith_ongoing.1030.t: "$study_faith$: stara księga znana jako [scheme.GetTargetCharacter.GetFaith.ReligiousText]"
 study_faith_ongoing.1030.desc: "Podchodzi do mnie [chosen_peasant.GetWomanMan] z zaborczym uśmiechem na twarzy.\n\n– Wasza czcigodność, czy to prawda, że zgłębiasz tajniki wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]? Z jednej ze swoich podróży do miejsca znanego jako [holy_site.GetNameNoTier] mój ojciec przywiózł dzieło o nazwie [scheme.GetTargetCharacter.GetFaith.ReligiousText]!\n\n– Nie mam z niego żadnego pożytku, bo nie umiem czytać. Chętnie oddam je tobie w zamian za kilka monet."
 study_faith_ongoing.1030.a: "Dobrze się składa. Moje złoto jest twoje."
 study_faith_ongoing.1030.b: "To dzieło nie jest tak rzadkie, jak mogłoby się wydawać…"
 study_faith_ongoing.1030.b.flavor: "Targuj się z tym handlarzem drobiazgów"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] akceptuje umowę"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] czuje się obrażon[Select_CString( chosen_peasant.IsFemale, 'a', 'y' )] twoją ofertą"
 study_faith_ongoing.1030.c: "Straż, zabierzcie [chosen_peasant.Custom('PL_mu_jej')] te pogańskie teksty."
 study_faith_ongoing.1030.d: "Oszust! Precz z tobą…"
 study_faith_ongoing.1040.t: "$study_faith$: podziw"
 study_faith_ongoing.1040.desc: "Cóż za błogosławieństwo! Dostarczono mi kilka listów, w których [target.GetTitledFirstName] chwali moje wysiłki w poznawaniu niuansów wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]. Pisze nawet o mnie „najwybitniejsza [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l] osobowość studiująca wiarę o nazwie [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]”!\n\nCieszę się, że moja ciężka praca została doceniona!"
 study_faith_ongoing.1040.a: "Skrybowie! Przekażcie słowa mojego uznania."
 study_faith_ongoing.1040.b: "Wyznanie wiary osoby o imieniu [target.GetFirstNameNoTooltip] jest pouczające…"
 study_faith_ongoing.1040.c: "Bah! Nie potrzebuję walidacji od nikogo poza #EMP sobą!#!"
 study_faith_ongoing.1050.t: "$study_faith$: smród kreciej roboty"
 study_faith_ongoing.1050.desc: "Moje notatki, w których zarysowuję niekiedy zagmatwane i sprzeczne zasady wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], walają się po całym gabinecie. Efekty miesięcy pracy leżą podarte i postrzępione, a luźna kartka na oknie sugeruje, że przynajmniej część moich notatek została wyrzucona.\n\nCzy muszę zaczynać od zera?!\n\n#EMP Niuch, niuch…#!Co to za mdły zapach? Kadzidło albo drzewo sandałowe zmieszane z czymś… kwiatowym? Odór przywodzi mi na myśl twarz… To ta gnida, [sabotage_rival.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))]. To [sabotage_rival.GetSheHe] pragnie mojej zguby…"
 study_faith_ongoing.1050.a: "Moje notatki… Nie! Tyle pracy, przepadło!"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] zasługuje na #EMP ŚMIERĆ!#!"
 study_faith_ongoing.1050.c: "Ha, ha! Zawsze robię #EMP kopię swoich notatek!#!"
 study_faith_ongoing.1060.t: "$study_faith$: interpretacja pełna ignorancji"
 study_faith_ongoing.1060.desc: "Aby sprawdzić swoje postępy, próbuję podsumować fragment dzieła znanego jako [scheme.GetTargetCharacter.GetFaith.ReligiousText] osobie, której przyświeca wiara [scheme.GetTargetCharacter.GetFaith.GetAdjective|l]. Ta osoba to [offended_character.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', offended_character)]:\n\n#EMP – [offended_character.GetFaith.PriestNeuter|U] musi podnieść przedmiot, którym jest [target.Custom('GetAccessory')], aby wasza czcigodność mogła zerwać kwiat o nazwie [target.GetCurrentLocation.Custom('get_region_flower_type')]…#!\n\n– Twoja interpretacja to nonsens! Sprawia, że [offended_character.GetFaith.PriestNeuterPlural] wyglądają jak idioci, a [offended_character.GetFaith.HighGodName] – niczym [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!\n\nByć może nadal nie do końca rozumiem istotę praktyki wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]…"
 study_faith_ongoing.1060.a: "Proszę przyjąć to jako dowód mojej skruchy."
 study_faith_ongoing.1060.b: "Moim celem było wychwalanie cnót, które prezentuje sobą [offended_character.GetFaith.PriestNeuter]!"
 study_faith_ongoing.1060.c: "Wiesz, co ci powiem?! Nie znam bardziej #EMP parszywej#! istoty od [offended_character.GetFaith.HighGodNamePossessive]!"
 study_faith_ongoing.1060.d: "Moim celem było tylko lepsze zrozumienie wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!"
 study_faith_ongoing.1060.b.success: "Wmawiasz [offended_character.Custom('PL_mu_jej')], że [offended_character.Custom('PL_jego_jej')] [offended_character.GetFaith.PriestNeuterPlural] są godni #EMP pochlebstw#!"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] dostrzega twoje kłamstwo"
 study_faith_ongoing.1060.d.success: "Udaje ci się wyjaśnić, że to było nieporozumienie"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] nie wierzy ci"
 study_faith_ongoing.1070.t: "$study_faith$: obrzydliwe mity"
 study_faith_ongoing.1070.desc: "Podarunek osoby znanej jako [target.GetTitledFirstName], którym są mitologiczne teksty wiary o nazwie [scheme.GetTargetCharacter.GetFaith.GetName|l], wywołał poruszenie na dworze. Wielu przygląda się, jak studiuję je i czytam na głos najciekawsze fragmenty.\n\nNa początku wydawało mi się, że jakaś siła nieczysta – [ROOT.Char.GetFaith.EvilGodNames] – stosuje nikczemne sztuczki, ale po wnikliwej analizie pewnych poruszających fragmentów staje się jasne, że musi to być tekst o charakterze erotycznym.\n\n[ROOT.Char.Custom('ObjectifiedFeature')] [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] w świętym tekście?! [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "Strażnicy, uwolnijcie mnie od tej przeklętej książki!"
 study_faith_ongoing.1070.b: "Macie odwagę się ze mnie śmiać!? #EMP Wychłostać ich wszystkich.#!"
 study_faith_ongoing.1070.c: "No cóż, w pewnym sensie #EMP jest#! to chyba kształcące…"
 study_faith_ongoing.1080.t: "$study_faith$: doskonały nauczyciel"
 study_faith_ongoing.1080.desc: "[ROOT.Char.Custom2('RelationToMeShort', court_tutor)|U] [court_tutor.GetFirstName] nieustannie pomaga mi w zrozumieniu niuansów wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l].\n\n[court_tutor.Custom('PL_jego_jej')|U] oddanie sztuce nauczania jest inspirujące! W [court_tutor.Custom('PL_jego_jej')] pobliżu zawsze znajdzie się jakaś [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l] księga albo [scheme.GetTargetCharacter.GetFaith.PriestNeuter], z którym można porozmawiać.\n\nSzczerze mówiąc, bez [court_tutor.Custom('PL_jego_jej')] pomocy moja wiedza wciąż byłaby nikła."
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], zasługujesz na nagrodę!"
 study_faith_ongoing.1080.b: "Dobrze wykonuje swoją pracę."
 study_faith_ongoing.1090.t: "$study_faith$: nieuchwytne!"
 study_faith_ongoing.1090.desc.intro: "Nie jestem w stanie zrozumieć teologii stojącej za wiarą, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]!"
 study_faith_ongoing.1090.tenet.desc: "Szczególnie dogmat „[discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )]” jest dla mnie niepojęty."
 study_faith_ongoing.1090.doctrine.desc: "Szczególnie doktryna „[discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )]” jest dla mnie niepojęta."
 study_faith_ongoing.1090.desc.main: "\n\nMoja głowa jest pełna! Gdy tylko pojawia się nowa koncepcja, poprzednia zostaje zepchnięta w otchłań zapomnienia."
 study_faith_ongoing.1090.friend.desc: "\n\n– Jesteś tak [ROOT.Char.Custom('ComplimentAdjective')]. Tylko tak dalej. Wierzę w ciebie!\n\nNa szczęście [helpful_friend.GetTitledFirstName] zawsze mi pomoże rozwikłać te zawiłe nauki. Czuję błogosławieństwo."
 study_faith_ongoing.1090.no_friend.desc: "\n\nMoże muszę odpocząć?"
 study_faith_ongoing.1090.a: "Zawsze mogę zwrócić się do osoby o imieniu [helpful_friend.GetFirstNameNoTooltip] po wskazówki!"
 study_faith_ongoing.1090.b: "Bez względu na to, jak dziwne się to wydaje, muszę wytrwać!"
 study_faith_ongoing.1090.c: "Muszę odłożyć książki choć na chwilę…"
 study_faith_ongoing.1090.d: "To jest beznadziejne!"
 study_faith_ongoing.1100.t: "$study_faith$: [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] studiujący wiarę o nazwie [target.GetFaith.GetNameNoTooltip|l]"
 study_faith_ongoing.1100.desc: "Wieść o moim pilnym studiowaniu wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], rozeszła się.\n\nMówią o mnie „[ROOT.Char.GetFaith.GetAdherentNameNoTooltip] studiujący wiarę o nazwie [target.GetFaith.GetNameNoTooltip]”, co może powodować zamieszanie…"
 study_faith_ongoing.1100.a: "Mądre przemówienie może sprawić, że tak mój lud, jak i [target.GetFaith.GetAdherentNamePluralNoTooltip] zachowają spokój!"
 study_faith_ongoing.1100.b: "Moja nauka to wyłącznie mój interes. Nie przeszkadzać mi!"
 study_faith_ongoing.1100.c: "To z pewnością zrobi wrażenie na osobie znanej jako [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]!"
 study_faith_ongoing.1100.a.success: "Wygłaszasz fantastyczną mowę"
 study_faith_ongoing.1100.a.success.tt: "Każdy dworzanin lub gość wyznający wiarę, którą jest [root_scope.GetFaith.GetNameNoTooltip|l] lub [target.GetFaith.GetNameNoTooltip|l]"
 study_faith_ongoing.1100.a.failure: "Robisz z siebie głupca"
 study_faith_ongoing.1110.t: "$study_faith$: [target.GetFaith.GetAdjectiveNoTooltip|l] poezja i jej uroki"
 study_faith_ongoing.1110.desc: "Ach, „[poet_location.Custom('GetTerrainTypePlural')|U] w [poet_location.Custom('RoamingLegendaryBeastProvinceWeather')]” autorstwa osoby o imieniu [the_poet.GetFirstName] z miejsca znanego jako [poet_location.GetCounty.GetName]. To doprawdy doskonała kolekcja poezji wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nCzy poezja może stanowić drogę do wiary?"
 study_faith_ongoing.1110.a: "Spróbuję swoich sił w pisaniu. Może zyska na tym [target.GetFaith.GetAdjectiveNoTooltip|l] poezja!"
 study_faith_ongoing.1110.b: "[lover_to_be.GetFirstNameNoTooltip], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] z pewnością doceni recytację #EMP romantycznego#! wiersza."
 study_faith_ongoing.1110.c: "Analizuję wiersz pod kątem jego cech religijnych."
 study_faith_ongoing.1110.a.success: "Masz talent do pisania poezji"
 study_faith_ongoing.1110.a.failure: "Twoje próby pisania poezji są żałosne"
 study_faith_ongoing.1120.t: "$study_faith$: heretyckie opowieści"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n– [ROOT.Char.GetTitleTierName], co studiuje legendy obcej wiary? Nie masz wstydu?! – woła [zealot.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', zealot)].\n\n– Jeśli twoi wrogowie dowiedzą się, że poznajesz heretyckie idee, zrobią wszystko, co w ich mocy, żeby przedstawić cię jako heretyka!\n\nMój wybór pism wiary znanej jako [scheme.GetTargetCharacter.GetFaith.GetName|l] mógłby zostać błędnie zinterpretowany przez kretynów i wrogów w miejscu, którym jest [ROOT.Char.Custom('GetCourt')]."
 study_faith_ongoing.1120.a: "Nie! To są…#EMP czcigodne opracowania teologiczne wiary, którą jest [target.GetFaith.GetNameNoTooltip|l]!#!"
 study_faith_ongoing.1120.b: "Ośmielasz się oskarżać mnie o herezję?! Ja ci pokażę!"
 study_faith_ongoing.1120.c: "Masz rację. [ROOT.Char.GetTitleTierName] nie może czytać takich rzeczy."
 study_faith_ongoing.1120.d: "Niech ludzie myślą, co chcą. Te pisma są pouczające!"
 study_faith_ongoing.1120.a.success: "Oszukujesz osobę o imieniu [zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a.failure: "Twoje zamiłowanie do heretyckich lektur staje się powszechnie znane"
 study_faith_ongoing.1120.b.tt: "#V Pojedynkuj się#! z osobą o imieniu [zealot.GetFirstName], aby ukarać ją za jej bezczelność!\n#weak To NIE jest pojedynek na śmierć i życie.#!\nGdy wygrasz, zdobędziesz [prestige_i] [prestige|El] i [modifier|El] wpływający na [scheme|El]. Gdy przegrasz, wystawisz się na pośmiewisko.\n\nTwoja [prowess|El]: [prowess_i] #V [root_for_loc.GetProwess]#!\n[prowess|E] osoby o imieniu [zealot.GetFirstName]: [prowess_i] #V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "Mój pojedynek z osobą o imieniu [zealot.GetFirstNameNoTooltip] został unieważniony"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "– Poddaję się! Błagam, wybacz mi, wcale nie masz upośledzenia umysłowego! Oszczędź mnie! – krzyczy [zealot.GetTitledFirstName].\n\nTo [zealot.Custom('PL_go_ja')] nauczy, że nie należy #EMP mnie#! znieważać."
 study_faith_ongoing.1123.a: "Jak mawia mądry zwierz, [ROOT.Char.Custom('GetAnimalType')]: „Nie obrażaj mądrzejszych od siebie”!"
 study_faith_ongoing.1123.b: "Zgnijesz w lochu przez swoją bezczelność!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName] spluwa obok miejsca, w którym leżysz na ziemi.\n\n– To jest [ROOT.Char.GetTitleTierName]? Co za słaby i żałosny żart. Teraz zrobię ci przysługę i pozbędę się tych niedorzecznych książek – mówi."
 study_faith_ongoing.1124.a: "To przeszkodzi w mojej nauce…"
 study_faith_ongoing.1130.t: "$study_faith$: przyjemności wiary"
 study_faith_ongoing.1130.desc: "„Och, [ROOT.Char.GetFirstNameNoTooltip], kochanie! Widzę, że moja ukochana wiara [scheme.GetTargetCharacter.GetFaith.GetAdjective|l] naprawdę przypadła ci do gustu. Doceniam, że wkładasz tyle wysiłku w zrozumienie mnie! – mówi [lover_to_help.GetTitledFirstName], [lover_to_help.Custom('quirk_pos_pp')].\n\n– Z przyjemnością pomogę w #EMP każdy#! możliwy sposób."
 study_faith_ongoing.1130.a: "Chętnie przyjmę każdą pomoc!"
 study_faith_ongoing.1130.b: "Przychodzi mi na myśl sposób, który byłby naprawdę przyjemny."
 study_faith_ongoing.1130.c: "Wolę uczyć się w odosobnieniu."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] jest [Select_CString( lover_to_help.IsFemale, 'dobrą, aczkolwiek filtrującą nauczycielką', 'dobrym, aczkolwiek flirtującym nauczycielem' )]"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] skupia swoje lekcje na tak niszowych, zmysłowych elementach teologii, że nie potrafisz odgadnąć, w jaki sposób są one zgodne z wiarą jako całością"
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip] pomaga w tak zalotny sposób, że nie jest to w ogóle przydatne."
 study_faith_ongoing.1140.t: "$study_faith$: pomocna dłoń"
 study_faith_ongoing.1140.desc: "– Wasza czcigodność ma moje uznanie za zgłębianie wiedzy na temat wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l]. [ROOT.Char.GetTitleTierName] na pewno na tym skorzysta! – woła [close_one_to_help.GetFirstName], a dla mnie [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))].\n\n– [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] doktryna jest mi znana od urodzenia. Może pozwolisz sobie pomóc?"
 study_faith_ongoing.1140.a: "Czy możesz pomóc mi zrozumieć ten dogmat?"
 study_faith_ongoing.1140.b: "Może chcesz towarzyszyć mi w nauce?"
 study_faith_ongoing.1200.t: "$study_faith$: niewierny kundel"
 study_faith_ongoing.1200.desc: "W trakcie zgłębiania tajemnic wiary, którą jest [scheme.GetTargetCharacter.GetFaith.GetName|l], prowadzę uporządkowany zbiór notatek. To mój jedyny sposób na opanowanie chaosu innego systemu wierzeń. Niestety, dostały chyba nóg i wyszły.\n\n[ROOT.Char.Custom('DogStoryName')] ociera mokry nos o moją rękę. Spoglądam na mojego kochanego psa, mając nadzieję, że to pomoże mi zapomnieć o frustracji.\n\nMacha ogonem z dumą, odwzajemniając moje spojrzenie. Dopiero wtedy zdaję sobie sprawę, że pomiędzy zębami ma strzępy moich notatek…"
 study_faith_ongoing.1200.a: "Nie [Select_CString(ROOT.Char.IsFemale, 'mogłabym', 'mógłbym' )] być na ciebie zł[Select_CString(ROOT.Char.IsFemale, 'a', 'y' )]!"
 study_faith_ongoing.1200.b: "Chcesz iść na spacer? No to chodź."
 study_faith_ongoing.1200.c: "To nie zabawka! #EMP Zły#! pies!"
 study_faith_ongoing.1300.t: "$study_faith$: nauka poprzez praktykę"
 study_faith_ongoing.1300.desc: "Przejeżdżamy przez miejsce znane jako [ROOT.Char.GetCurrentLocation.GetTitle.GetName], w którym odbywa się jakaś [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l] uroczystość. Podchodzi do nas [interlocutor.GetWomanMan] i zaprasza nas do świętowania, choć wyznajemy wiarę o nazwie [ROOT.Char.GetFaith.GetName|l].\n\nMoja świta próbuje stanąć między nami w obawie, że to pułapka.\n\nDo diabła z niebezpieczeństwem. Nie wyobrażam sobie lepszej okazji, by bezpośrednio poznać wiarę znaną jako [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!"
 study_faith_ongoing.1300.a: "Wskaż mi drogę!"
 study_faith_ongoing.1300.a.flavor: "To tylko niewielka [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l] ceremonia, co może nas tam spotkać?"
 study_faith_ongoing.1300.b: "Rozmowa o niuansach [interlocutor.Custom('PL_jego_jej')] wiary będzie z pewnością najbardziej pouczająca."
 study_faith_ongoing.1300.b.flavor: "Masz nadzieję, że [interlocutor.GetFirstNameNoTooltip] zgodzi się na polubowną debatę"
 study_faith_ongoing.1300.b.success: "Ty i [interlocutor.GetFirstNameNoTooltip] prowadzicie angażującą debatę"
 study_faith_ongoing.1300.b.failure: "Ty i [interlocutor.GetFirstNameNoTooltip] nie dochodzicie do porozumienia"
 study_faith_ongoing.1300.c: "„Dołącz do nas w naszej podróży do miejsca znanego jako [next_destination.GetNameNoTooltip]!”"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "Podobnie jak ćma nie zna pisma gwiazd, a jednak znajduje płomień, tak i dusza nie musi wzywać Boga, aby została przez niego pochłonięta."
 holy_text_indeterminate_quote_2: "Gdy pustynny wiatr zatarł ślady stóp tyrana, piasek zapamiętał tylko ślady spragnionych i życzliwych."
 holy_text_indeterminate_quote_3: "Rzeka nie wybiera kamieni, które poleruje, lecz płynąc cierpliwie sprawia, że ​​każdy z nich nadaje się do korony."
 holy_text_indeterminate_quote_4: "Pijcie ze źródła wiedzy, a ono ugnie wasze karki."
 holy_text_indeterminate_quote_5: "W dniu, w którym góra się ukłoniła, nie uczyniła tego przed królami ani armiami, lecz przed dzieckiem, które odważyło się zadać jej pytanie."
 holy_text_indeterminate_quote_6: "Ukryty przemawia najpierw szeptem pełnym wątpliwości, więc gdy w końcu odpowiesz, twoja wiara naprawdę będzie twoja."
 holy_text_indeterminate_quote_7: "Każde kłamstwo wypowiedziane przed ołtarzem powraca niczym dym, lecz każda szczera łza spada niczym nasienie do ogrodów nieba."
 holy_text_indeterminate_quote_8: "Nie przeklinaj ciemności, która spowija twoją ścieżkę. Jest ona tam po to, aby twój własny płomień nabrał odwagi, by płonąć."
 holy_text_indeterminate_quote_9: "Promienny nie zlicza modlitw dumnych, tylko ciche przejawy miłosierdzia, gdy nikt nie patrzy."
 holy_text_indeterminate_quote_10: "Gdy świat został podzielony na „mój” i „twój”, Bóg się śmiał, bo w jego oczach istniał tylko „nasz”."
