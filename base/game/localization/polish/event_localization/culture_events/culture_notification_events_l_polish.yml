l_polish:
 culture_notification.0010.t: "Porzucenie tradycji"
 culture_notification.0010.desc: "[culture|E] [this_player.GetCulture.GetName|l] odrzuciła [Concept('tradition', 'tradycję')|E] „[tradition.GetName]”"
 culture_notification.0011.t: "Przyjęto tradycję"
 culture_notification.0011.desc: "[culture|E] [this_player.GetCulture.GetName|l] przyjęła [Concept('tradition', 'tradycję')|E] „[tradition.GetName]”"
 culture_notification.1001.t: "Kultura hybrydowa: [new_culture.GetNameNoTooltip|Vl]"
 culture_notification.1001.desc: "[founder.GetTitledFirstName] tworzy [Concept('hybrid_culture', 'kulturę hybrydową')|E], którą jest kultura [new_culture.GetName|Vl], z połączenia kultur: [parent_1.GetName|l] i [parent_2.GetName|l]"
 culture_notification.1011.t: "[new_culture.GetNameNoTooltip] hybrydyzacja"
 culture_notification.1011.intro: "Zbiorowości [parent_1.GetName] i [parent_2.GetName] po latach wymiany zbliżyły się do siebie na tyle, że powstało coś nowego: kultura [new_culture.GetName|l].\n\n"
 culture_notification.1011.blend: "Integrację nietrudno jest zauważyć. Tradycja [parent_1.GetNameNoTooltip|l] o nazwie „[tradition_1.GetName]” i tradycja [parent_2.GetNameNoTooltip] znana jako „[tradition_2.GetName]” istnieją obok siebie, a ich połączenie określa tożsamość tego nowego ludu."
 culture_notification.1011.blend_fallback: "Żadna ze stron nie ma większego udziału niż druga: kultura [new_culture.GetNameNoTooltip|l] płynnie łączy obydwa światy."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "[hybrid_culture|E] [new_culture.GetName|l] została utworzona z [Concept( 'culture', 'kultur' )|E]: [parent_1.GetName|l] i [parent_2.GetName|l]."
 culture_notification.1101.t: "Kultura oddzielona: [new_culture.GetNameNoTooltip|Vl]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName] tworzy [Concept('divergent_culture', 'kulturę oddzieloną')|E], którą jest kultura [new_culture.GetName|Vl] wywodząca się z kultury: [parent_1.GetName]"
 culture_notification.1111.t: "Kultura [new_culture.GetNameNoTooltip|l] oddziela się"
 culture_notification.1111.intro: "Tu odmieniony dialekt, gdzieś indziej nowy zwyczaj… Zmiany z początku łatwo było przeoczyć, ale dziś są oczywiste: lud z miejsca znanego jako [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] – [parent_1.GetCollectiveNoun] – uznaje teraz, że jego tożsamość wyraża kultura [new_culture.GetName|l].\n\n"
 culture_notification.1111.tradition.new: "Zwyczaje ich przodków zanikają, a w ich miejsce zaczyna pojawiać się nowa tradycja: „[new_tradition.GetName]”."
 culture_notification.1111.tradition.lost: "Tradycja, z której słynęli [parent_1.GetCollectiveNounNoTooltip] – „[lost_tradition.GetName]” – została odrzucona."
 culture_notification.1111.ethos.bellicose: "Nękani przez wrogów i rywali [new_culture.GetCollectiveNounNoTooltip] utworzyli etos [new_culture.GetEthos.GetName|l]. Uzależniają swój los od siły bojowej."
 culture_notification.1111.ethos.bureaucratic: "[new_culture.GetCollectiveNounNoTooltip] przyjęli etos [new_culture.GetEthos.GetName|l]. Odnajdują spokój w obszernych statusach i jeszcze obszerniejszych kronikach."
 culture_notification.1111.ethos.courtly: "[new_culture.GetCollectiveNounNoTooltip] – lud przykładający wagę do manier i ceremonii – za swój drogowskaz powzięli etos [new_culture.GetEthos.GetName|l]."
 culture_notification.1111.ethos.communal: "We wspólnym triumfie i porażce [new_culture.GetCollectiveNounNoTooltip] przyjęli etos [new_culture.GetEthos.GetName|l], wiążący ich ściśle z sąsiednimi ludami."
 culture_notification.1111.ethos.stoic: "Wobec niebezpieczeństw i nieprzewidywalności świata [new_culture.GetCollectiveNounNoTooltip] przyjęli etos [new_culture.GetEthos.GetName|l], nade wszystko ceniąc sobie siłę charakteru."
 culture_notification.1111.ethos.spiritual: "Poszukując odpowiedzi w świecie wewnętrznym, [new_culture.GetCollectiveNounNoTooltip] przyjęli etos [new_culture.GetEthos.GetName|l], który uczynił ich ludem pobożniejszym niż kiedykolwiek wcześniej."
 culture_notification.1111.ethos.egalitatian: "[new_culture.GetCollectiveNounNoTooltip] tworzą teraz społeczność wyznającą etos [new_culture.GetEthos.GetName|l]. Zasługi są dla nich ważniejsze niż wysokie urodzenie."
 culture_notification.1111.ethos.unchanged: "Choć spojrzenie na życie tego ludu się nie zmieniło, wskutek podziałów politycznych i granicznych podzielił się on na dwie odrębne społeczności."
 culture_notification.1111.outro.other: "\n\nNa czele tego przebudzenia kulturowego stoi teraz [founder.GetTitledFirstName] – albo z przebiegłości, albo z przekonania."
 culture_notification.1111.outro.founder: "\n\nLudność [new_culture.GetNameNoTooltip|l] spogląda teraz na mnie. Nasza przyszłość zaczyna się tutaj."
 culture_notification.1111.a.other: "Zobaczymy, jak rozwinie się sytuacja."
 culture_notification.1111.a.founder: "Za nowy wiek, nową erę, nowy naród!"
 culture_notification_tooltip: "[divergent_culture|E] [new_culture.GetName|l] oddzieliła się od [cultures|El]: [parent_1.GetName|l]."
