l_polish:
 yearly_republic.1001.t: "Chodź do łóżka, skarbie"
 yearly_republic.1001.desc: "Choć zbliża się północ, [spouse_target.GetTitledFirstName], a dla mnie [spouse_target.GetWifeHusband], zastaje mnie, jak pochylam się nad dokumentami, raz jeszcze sprawdzając rachunki.\n\n– Chodź do łóżka, skarbie – nalega. – Obowiązki mogą poczekać do jutra.\n\n– A może… – mówi [spouse_target.GetFirstNameNoTooltip], przybierając zamyślony wyraz twarzy. – Może mogę ci w czymś?"
 yearly_republic.1001.a: "Przydałoby się więcej świec, kochanie."
 yearly_republic.1001.b: "Mam spore zaległości. Zostaw mnie w spokoju!"
 yearly_republic.1001.c: "Świat może zaczekać, dopóki ty jesteś przy mnie."
 yearly_republic.1001.communal: "Wszyscy [vassals|E] zyskują #P 10#! punktów opinii na #value twój#! temat"
 yearly_republic.1002.t: "Trudne małżeństwo"
 yearly_republic.1002.desc: "[spouse_target.GetTitledFirstName] i ja jesteśmy razem, ale to małżeństwo pełne jest konfliktów. Wydaje się, że nie zgadzamy się w żadnej kwestii, a [spouse_target.GetSheHe] z pewnością przekazuje swoim bliskim wieści o moich „niedociągnięciach” w kolejnych listach.\n\nMoja nadzieja, że ten związek zbliży moje przedsięwzięcia do rodu [spouse_target.GetDynastyHouseName] powoli zanika, gdy raz za razem spotykam ich przedstawicieli lub klientów w mieście i jedyne, co dostrzegam w ich oczach, to nieufność.\n\nJeśli nic nie zrobię, ta wroga atmosfera będzie się rozprzestrzeniać w szeregach obu rodzin, niczym zakażona krew z rany, która nie chce się zagoić."
 yearly_republic.1002.a: "Kupię sobie wdzięczność osoby znanej jako [spouse_target.GetFirstNameNoTooltip] i [spouse_target.GetHerHis] rodu."
 yearly_republic.1002.b: "Sfałszuję [spouse_target.GetHerHis] listy, by były pełne pochwał pod moim adresem."
 yearly_republic.1002.c: "W imię [ROOT.Char.GetFaith.random_GoodGodNamesPossessive] przyrzekam, że zasłużę na twoje uznanie."
 yearly_republic.1002.d: "Niech sobie myślą, co chcą."
 yearly_republic.1002.tt.falsifying_success.desc: "Wprowadź zmiany w listach małżonka, by przedstawiały cię w lepszym świetle"
 yearly_republic.1002.falsifying_success.toast: "Ród [spouse_target.GetDynastyHouseName] jest przekonany o twojej poprawie"
 yearly_republic.1002.tt.falsifying_failure.desc: "Nie udaje ci się podrobić listów małżonka"
 yearly_republic.1002.falsifying_failure.toast: "Opinia rodu [spouse_target.GetDynastyHouseName] na twój temat pogarsza się jeszcze bardziej"
 yearly_republic.1002.tt.impress_spouse_success.desc: "Twój małżonek jest pod wrażeniem twoich starań"
 yearly_republic.1002.impress_spouse_success.toast: "Ród [spouse_target.GetDynastyHouseName] pochwala twoje starania"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "Twoje starania nie robią wrażenia na twoim małżonku"
 yearly_republic.1002.impress_spouse_failure.toast: "Ród [spouse_target.GetDynastyHouseName] uznaje cię za beznadziejny przypadek"
 yearly_republic.1003.t: "Honor rodem z podwórka"
 yearly_republic.1003.desc: "– Mądrością to ty nie grzeszysz! Bijatyki na ulicach prowadzą do waśni między rodami! Spójrz na siebie. Krwawisz! – krzyczy [spouse_target.GetTitledFirstName], a dla mnie [spouse_target.GetWifeHusband], ujrzawszy osobę, którą jest [rook_01.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', rook_01)], ale zawadiacka natura tego dzieciaka sprawia, że tylko się śmieje, gdy jego krew kapie na moją posadzkę.\n\n– Mój przeciwnik wygląda znacznie gorzej! [rook_02.GetFirstName], nota bene to naprawdę [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))], kuśtyka teraz do domu z podkulonym ogonem.\n\nCholerne młodzieńcze bandy! Wałęsają się po ulicach z bronią, okazując swoją zuchwałość, wszczynają bójki i dopuszczają się wszelkiego plugastwa, byle tylko się zabawić.\n\n– To była ledwie mała sprzeczka. Niech [rook_01.Custom2('RelationToMeShort', spouse_target)] się nie martwi. Ktoś musiał bronić dobrego imienia naszego rodu przed oszczerstwem. Tym razem padło na mnie."
 yearly_republic.1003.a: "Młodość musi się wyszaleć."
 yearly_republic.1003.b: "To oczywiste, że winę ponosi [rook_02.GetNameNoTooltip]. Żądamy zadośćuczynienia!"
 yearly_republic.1003.c: "Wyślemy podarunek dla rodu [rook_02.GetDynastyHouseNameNoTooltip], by załagodzić sytuację."
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "Wasze oskarżenia pod adresem mojego rodu są bezpodstawne, próżne i całkowicie pozbawione słuszności.\n\nNie otrzymacie od nas nic – chyba że, jeśli nieszczęśliwie zdecydujecie się dalej naciskać w tej sprawie, łaskawe zainteresowanie naszych mieczy skierowane w stronę waszych gardeł."
 yearly_republic.1004.b.desc: "Jako głowa rodu [other_house_character_01.GetDynastyHouseName] głęboko ubolewam nad tym nieprzyjemnym zajściem między naszymi rodzinami. Szczerze przepraszam za wszelkie niedogodności i błagam, byście zechcieli przyjąć ten podarunek jako wyraz mojej skruchy."
 yearly_republic.1004.a: "Pożałują, że okazali taki brak szacunku!"
 yearly_republic.1004.b: "No dobrze, w odpowiednim czasie otrzymamy nasze zadośćuczynienie."
 yearly_republic.1004.c: "Przyjmujemy to, co nam się należy."
 yearly_republic.1004.d: "Niech to zakończy konflikt między nami."
 yearly_republic.1005.t: "Weto ludu"
 yearly_republic.1005.desc: "Konflikt między moim rodem a rodem [other_house_character_01.GetDynastyHouseName] po raz kolejny rozlał się na ulice miejsca o nazwie [capital_01.GetName]. Nasi woźnice wdali się w bójkę o pierwszeństwo przejazdu, aż droga została całkiem zablokowana. Można było sądzić, że to tylko kolejna błaha sprzeczka, ale przed moimi drzwiami zgromadził się tłum ludzi.\n\n– Dość tego! – krzyczy jeden z mężczyzn. – Nie możemy normalnie funkcjonować, gdy rody [ROOT.Char.GetDynastyHouseName] i [other_house_character_01.GetDynastyHouseNameNoTooltip] ciągle się kłócą. Przestańcie wciągać miasto w wasze spory!\n\n– Za kogo oni się mają, że chcą dyktować nam, jak mamy postępować? – [house_member_01.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', house_member_01)], prycha z pogardą na ich zuchwałość."
 yearly_republic.1005.a: "Nie. Niech [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] posłucha. Nadszedł czas, by zasiąść do rozmów z rodem [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.b: "Dzięki moim umiejętnościom oratorskim cała wina spadnie na ród [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.c: "Straże! Przegnajcie tę hołotę sprzed moich drzwi."
 yearly_republic.1005.tt.oratory_blame.desc: "Oczaruj tłum swoimi umiejętnościami oratorskimi"
 yearly_republic.1005.tt.oratory_blame.toast: "Zrzucasz całą winę na ród [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Zagłuszają cię szydercze okrzyki tłumu"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "Nie udaje ci się zrzucić winy na ród [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "Macie całkowitą rację. Nadszedł czas, by zasiąść do rozmów i pozwolić, by rozsądek zwyciężył – dla dobra tych, którzy dopiero się urodzą, i dla trwałego pożytku republiki. Spotkamy się z wami."
 yearly_republic.1006.b.desc: "Niestety, nie widzimy żadnego powodu, by dawać wam sposobność kłamać nam prosto w oczy. Niewątpliwie szukacie jedynie dogodniejszej okazji, by wyrządzić nam krzywdę. Nie będzie żadnych negocjacji."
 yearly_republic.1006.a: "Doskonale!"
 yearly_republic.1006.b: "Niech to diabli!"
 yearly_republic.1007.t: "Ocieplenie stosunków między rodami [ROOT.Char.GetDynastyHouseNameNoTooltip] i [other_house_character_01.GetDynastyHouseNameNoTooltip]"
 yearly_republic.1007.desc: "Napięcie w powietrzu jest niemal namacalne, gdy zasiadam w neutralnym pomieszczeniu, a naprzeciwko mnie siada [other_house_character_01.GetTitledFirstName]. Nasi klienci wypełniają izbę, dzieląc się na dwie strony – niczym dwie armie mierzące się wzrokiem ponad polem bitwy. Pod płaszczami bez wątpienia kryją sztylety.\n\n– A zatem – zaczyna [other_house_character_01.GetFirstNameNoTooltip] powściągliwym tonem – powiedz to, co chcesz powiedzieć.\n\nOczy wszystkich zgromadzonych w izbie kierują się ku mnie, gdy zbieram myśli i zaczynam."
 yearly_republic.1007.a: "Ta waśń szkodzi interesom."
 yearly_republic.1007.b: "Jako [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] powinniśmy się pogodzić."
 yearly_republic.1007.c: "Przelano krew, niech zatem krew nas zjednoczy."
 yearly_republic.1007.d: "Rozstrzygnijmy to w walce, tu i teraz!"
 yearly_republic.1007.tt.detente_business.desc: "Udaje ci się przekonać osobę znaną jako [other_house_character_01.GetShortUINameNotMeNoTooltip] do twoich racji"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNotMeNoTooltip] daje się przekonać"
 yearly_republic.1007.tt.detente_business_failure.desc: "Nie udaje ci się przekonać osoby znanej jako [other_house_character_01.GetShortUINameNotMeNoTooltip] do twoich racji"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNotMeNoTooltip] nie daje się przekonać"
 yearly_republic.1007.detente_business.change.desc: "Oba rody zgodziły się zakończyć waśń między nimi z uwagi na prowadzone interesy"
 yearly_republic.1007.piety.change.desc: "Oba rody zgodziły się zakończyć waśń między nimi z miłości do [ROOT.Char.GetFaith.HighGodNamePossessive]."
 yearly_republic.1007.detente_marriage.change.desc: "Oba rody zgodziły się zakończyć waśń między nimi poprzez zawarcie małżeństwa."
 yearly_republic.1007.duel_win.desc: "Wygrywasz pojedynek"
 yearly_republic.1007.duel_win.toast: "Zadajesz cios nożem osobie znanej jako [other_house_character_01.GetShortUINameNotMeNoTooltip]"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNotMeNoTooltip] wygrywa pojedynek"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNotMeNoTooltip] zadaje ci cios nożem"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNotMeNoTooltip] odnosi rany albo umiera"
 yearly_republic.1007.duel_loss.custom: "Odnosisz rany albo umierasz"
 yearly_republic.1007.c.tt.suitable_pair: "W obu rodach są osoby stanu wolnego, które mogą zawrzeć ze sobą związek małżeński"
 house_relation_reason_falsify_good_desc: "Otrzymanie listów wychwalających dobrą naturę przywódcy rodu"
 house_relation_reason_falsify_bad_desc: "Odkrycie, że głowa rodu sfałszowała listy"
 house_relation_reason_thorny_desc: "Nieszczęśliwe małżeństwo siejące niezgodę"
 house_relation_reason_bribery_good_desc: "Obsypanie małżonka złotem i klejnotami"
 house_relation_reason_street_combat_desc: "Bójki uliczne między młodymi przedstawicielami obu rodów"
 house_relation_reason_business_argument_desc: "Omówienie zalet prowadzenia interesów"
 house_relation_reason_house_blamed_desc: "Oskarżanie o wywołanie niepokojów społecznych"
 house_relation_reason_houses_aligned_desc: "Zjednoczenie sił podczas spotkania zrzeszającego podobnie myślące rody"
 house_relation_reason_cooperation_desc: "Pogłębiona współpraca między rodami."
 demand_reparation_for_fight_desc: "Wyślij list z żądaniem zadośćuczynienia"
 pay_reparation_for_fight_desc: "Wyślij list z podarunkiem i przeprosinami"
 offer_a_sitdown_desc: "Wyślij list z propozycją ocieplenia stosunków"
 yearly_republic.1008.t: "Wilki w kupieckich skórach"
 yearly_republic.1008.desc: "Dotarła do mnie pewna intrygująca wieść:\nJeden z kapitanów statków kupieckich, którego zatrudnia [other_patrician_01.GetFirstNameNoTooltip], para się rozbójnictwem podczas realizacji kontraktów handlowych na Morzu Śródziemnym, a następnie sprzedaje przejęty ładunek dla własnego zysku – zaiste wilk w owczej skórze!\n\nChoć nie sposób stwierdzić, czy [other_patrician_01.GetFirstNameNoTooltip] macza palce w tym procederze, dla członków zgromadzenia, których statki i ładunki zostały splądrowane, nie ma to większego znaczenia."
 yearly_republic.1008.a: "Niezwłocznie zatrudnij tego kapitana u siebie."
 yearly_republic.1008.b: "Zastrasz kapitana, by podzielił się swoim łupem."
 yearly_republic.1008.c: "Zastrasz osobę znaną jako [other_patrician_01.GetFirstNameNoTooltip], by zyskać przewagę."
 yearly_republic.1009.t: "Salon tajemnic"
 yearly_republic.1009.desc: "Popołudnie spędzam w przytulnym salonie należącym do osoby znanej jako [patrician_spouse_01.GetTitledFirstName].\n\n[relation_01.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', relation_01)], i ja rozmawiamy sobie, popijając wyborny trunek, czyli [patrician_spouse_01.Custom('GetExpensiveDrink')]. Nagle na ścianie, tuż obok dużego parawanu, dostrzegam niewielki cień. Po chwili obserwacji dochodzę do wniosku, że rzuca go ręka wykonująca delikatne, precyzyjne ruchy. Gdy [relation_01.GetFirstNameNoTooltip] milknie, ruch cienia natychmiast ustaje. Ktoś za parawanem skrupulatnie notuje każde wypowiedziane w salonie słowo!\n\nWygląda na to, że goszczący nas [patrician_spouse_01.GetFirstNameNoTooltip] i [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband] [patrician_husband_01.GetTitledFirstName] podsłuchują rozmowy swoich gości."
 yearly_republic.1009.a: "Muszę wszystkich ostrzec przed tym nikczemnym postępowaniem!"
 yearly_republic.1009.a.tt: "Zyskaj #P 20#! pkt do opinii na #value twój#! temat i obniż o #N 25#! pkt opinię na temat osób znanych jako [patrician_spouse_01.GetShortUINameNotMeNoTooltip] oraz [patrician_husband_01.GetShortUINameNotMeNoTooltip]"
 yearly_republic.1009.b: "Cóż za znakomity pomysł! Też będę tak robić."
 yearly_republic.1009.c: "Zastosuj szantaż. Niech [patrician_spouse_01.GetFirstNameNoTooltip] i [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband] dochowają tajemnicy."
 yearly_republic.1009.c.success.desc: "Przechytrz osobę znaną jako [patrician_spouse_01.GetShortUINameNotMeNoTooltip]"
 yearly_republic.1009.c.success.toast: "Zdobywasz haka mocnego na osobę znaną jako [patrician_husband_01.GetShortUINameNotMeNoTooltip]"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNotMeNoTooltip] przechytrza cię"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNotMeNoTooltip] coraz bardziej zbliża się do roli twojego rywala"
 yearly_republic.1009.flavor: "Kto wie, co można podsłuchać?"
 yearly_republic.1009.b.secret_learned: "Twoje działania szpiegowskie doprowadziły do odkrycia tajemnicy"
 yearly_republic.1010.t: "Patrycjusze na krokwiach"
 yearly_republic.1010.desc: "Podczas niespiesznego spaceru odnajduje mnie [relation_01.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', relation_01)]. Pochyla się ku mnie i szepcze:\n\n– Ambasador [ambassador_01.GetFirstName] już jest na miejscu po swojej podróży do miejsca znanego jako [ambassador_mission_location_01.GetName] i dziś wieczorem przedstawi sprawozdanie podczas zamkniętej narady w pałacu.\n\n– Och, wyobraź sobie, jaką przewagę w interesach dałoby nam wysłuchanie tego sprawozdania, zanim zostanie przedstawione całemu zgromadzeniu! – kręci głową.\n\nGdy [relation_01.GetFirstNameNoTooltip] to mówi, w oddali majaczy dach pałacu."
 yearly_republic.1010.a: "Podważymy kilka dachówek na dachu pałacu i podsłuchamy naradę."
 yearly_republic.1010.b: "Może [ambassador_01.GetFirstNameNoTooltip] da się przekonać?"
 yearly_republic.1010.c: "Dowiemy się w swoim czasie."
 yearly_republic.1010.a.success.desc: "Podsłuchujesz sprawozdanie"
 yearly_republic.1010.a.success.toast: "Podsłuchujesz sprawozdanie"
 yearly_republic.1010.a.mixed.desc: "Spadasz z dachu"
 yearly_republic.1010.a.mixed.toast: "Spadasz z dachu"
 yearly_republic.1010.a.failure.desc: "Wpadasz do komnaty"
 yearly_republic.1010.a.failure.toast: "Wpadasz do komnaty"
 yearly_republic.1010.a.mixed.custom: "Ty i [relation_01.GetShortUINameNotMe] zyskujecie [Concept('trait', 'cechę')|E]: [GetTrait('wounded_1').GetName( GetNullCharacter )|LVl]"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUINameNotMe] traci #N 25#! pkt [Concept('opinion', 'opinii')|E] na temat ciebie i osoby znanej jako [relation_01.GetShortUINameNotMe] #weak (nielegalne szpiegostwo)#!\n@portrait_punishment_icon! #TUT_KW Przestępstwo – pozwala osobie, którą jest [republic_ruler.GetShortUINameNotMe], zgodnie z prawem uwięzić ciebie i [relation_01.Custom('PL_jego_ja')]#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNotMeNoTooltip] daje się przekupić"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNotMeNoTooltip] czuje obrazę z powodu twojego pytania"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNotMeNoTooltip] przekazuje ci informacje"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNotMeNoTooltip] nie daje się przekupić"
 yearly_republic.1011.t: "Wezwanie na posiedzenie rady"
 yearly_republic.1011.desc: "Po raz kolejny wezwano mnie do udziału w jednym z wielu tajnych posiedzeń rady, dzięki którym republika może funkcjonować.\n\nTakie obowiązki zabierają mi czas, który można by poświęcić rodzinie i pracy, jednak jako patrycjusz nie mogę odmówić stawienia się bez ważnego powodu lub zezwolenia udzielonego przez zgromadzenie."
 yearly_republic.1011.a: "Zdobędę od lekarza świadectwo, że muszę leżeć w łóżku."
 yearly_republic.1011.b: "Skoro [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)] zmaga się z chorobą, mam dobry powód, aby zostać w domu."
 yearly_republic.1011.c: "Zwrócę się do zgromadzenia z prośbą o 5-letnie zezwolenie na nieobecność."
 yearly_republic.1011.d: "Moim obowiązkiem jest się tam udać."
 yearly_republic.1011.c.success.desc: "Zgromadzenie wydaje zezwolenie"
 yearly_republic.1011.c.success.toast: "Zgromadzenie wydało dla ciebie zezwolenie"
 yearly_republic.1011.c.failure.desc: "Zgromadzenie odmawia wydania zezwolenia"
 yearly_republic.1011.c.failure.toast: "Zgromadzenie odmawia wydania dla ciebie zezwolenia"
 yearly_republic.1012.t: "[ROOT.Char.GetTitleAsNameNoTooltip] idzie w procesji"
 yearly_republic.1012.desc: "Napięcie wśród tłumu jest namacalne, gdy [ROOT.Char.GetTitleAsNameNoTooltip] wraz z orszakiem opuszczają bramę pałacu i rozpoczynają przemarsz przez miasto.\n\nNajpierw kroczą urzędnicy, uszeregowani według rangi i prestiżu, a potem ja – [ROOT.Char.GetTitleAsNameNoTooltip] – w najwspanialszych szatach symbolizujących moją władzę, a w dłoniach trzymam wysoko znaki mojego autorytetu, tak aby lud mógł je podziwiać. \nZa mną maszerują patrycjusze, ustawieni w szeregach według rangi swoich rodów.\n\nKażdy zna swoje miejsce, a hierarchia i chwała naszej republiki ukazują się wszystkim podczas tej podniosłej uroczystości!"
 yearly_republic.1012.a: "Za republikę! Za lud!"
 yearly_republic.1012.b: "Chwała zgromadzeniu!"
 yearly_republic.1012.c: "Wszystko to jest odbiciem MOJEJ chwały!"
 yearly_republic.1012.c.tt: "Przez następne #V 10#! lat uchwalenie [Concept('succession_law', 'prawa sukcesyjnego')|E] „$republican_despot_succession_law$” wymaga o #P 50%#! mniej [Concept('prestige', 'prestiżu')|E]"
 yearly_republic.1013.t: "Zaślubiny z morzem"
 yearly_republic.1013.desc: "[Glossary( '#bold Bucentaur#!', 'BUCENTAUR_GLOSS' )] mija ostatnią z wysp barierowych, a przed moimi oczami rozciąga się słona tafla Morza Adriatyckiego. [bishop_01.GetTitledFirstName] podaje mi pierścień ceremonialny i cofa się o krok.\nPodnoszę pierścień, aby zgromadzeni dostojnicy mogli go zobaczyć, i zgodnie ze starożytnymi obrzędami wrzucam go w zielone odmęty.\n\n– [Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )] – wygłaszam, a tłum na pokładzie głośno wyraża aprobatę dla moich słów. Związek naszej republiki z morzem – źródłem naszego bogactwa i potęgi – został zawarty."
 yearly_republic.1013.a: "Panujemy nad falami!"
 yearly_republic.1013.b: "To głupi i pusty rytuał."
 yearly_republic.1013.c: "Już idę, moja miłości!"
 yearly_republic.1013.d: "Zachowam wierność wobec morza!"
 yearly_republic.1014.t: "Uzgadnianie interesów rodów"
 yearly_republic.1014.desc: "[faction_head_01.GetTitledFirstName] zaprasza głowy rodów z ambicją „[faction_head_01.GetHouse.GetHouseAspiration.GetName]” na wspólne zgromadzenie.\n\n– Przyjaciele! W czasach takich jak te musimy się zjednoczyć i uzgodnić nasze interesy, tak aby inne siły w naszej ukochanej republice nie znalazły okazji do podzielenia i zmiażdżenia nas.\n\nDyskutujemy do późnej nocy i choć dzieli nas wiele kwestii, istnieje szansa, aby silny głos zniwelował podziały i stworzył zjednoczony front."
 yearly_republic.1014.a: "– Powinniśmy wszyscy dołączyć do gwelfów."
 yearly_republic.1014.b: "– Powinniśmy wszyscy dołączyć do gibelinów."
 yearly_republic.1014.c: "– Umocnijmy więzi między naszymi rodami."
 yearly_republic.1014.d: "– Rywalizacja między nami musi się zakończyć."
 yearly_republic.1014.e: "– Powinniśmy uzgodnić nasze interesy biznesowe."
 yearly_republic.1014.e.tt: "Wszyscy [patricians|El] z [Concept('house_ambition', 'ambicją rodu')|E] „[faction_head_01.GetHouse.GetHouseAspiration.GetName]” zyskują modyfikator „[GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip]” na 2 lata"
 yearly_republic.1014.a.tt: "Wszyscy [patricians|El] z [Concept('house_ambition', 'ambicją rodu')|E] „[faction_head_01.GetHouse.GetHouseAspiration.GetName]” stają się członkami [Concept('situation_participant_group', 'grupy uczestników')|E] (teraz to [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName|l])"
 yearly_republic.1014.b.tt: "Wszyscy [patricians|El] z [Concept('house_ambition', 'ambicją rodu')|E] „[faction_head_01.GetHouse.GetHouseAspiration.GetName]” stają się członkami [Concept('situation_participant_group', 'grupy uczestników')|E] (teraz to [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName|l])"
 yearly_republic.1014.c.tt: "Wszyscy [patricians|El] z [Concept('house_ambition', 'ambicją rodu')|E] „[faction_head_01.GetHouse.GetHouseAspiration.GetName]” poprawiają wzajemne [house_relations|El]"
 yearly_republic.1014.d.tt: "Rywalizacja i wrogość między [Concept('patricians', 'patrycjuszami')|E] z [Concept('house_ambition', 'ambicją rodu')|E] „[faction_head_01.GetHouse.GetHouseAspiration.GetName]” dobiegają końca"
 yearly_republic.1014.tt.align_guelphs_success.desc: "Zgromadzenie zostaje przekonane, a rody deklarują poparcie dla gwelfów"
 yearly_republic.1014.align_guelphs_success.toast: "Rody przechodzą na stronę gwelfów"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "Debata przybiera negatywny obrót, a rody zostają przy swoim"
 yearly_republic.1014.align_guelphs_failure.toast: "Rody pozostają podzielone"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "Zgromadzenie zostaje przekonane, a rody deklarują poparcie dla gibelinów"
 yearly_republic.1014.align_ghibellines_success.toast: "Rody przechodzą na stronę gibelinów"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "Debata przybiera negatywny obrót, a rody zostają przy swoim"
 yearly_republic.1014.align_ghibellines_failure.toast: "Rody pozostają podzielone"
 yearly_republic.1014.d.toast: "Zapomnienie dawnych uraz"
 yearly_republic.1014.e.toast: "Rody łączą interesy"
 yearly_republic.1015.t: "Złoto za głosy"
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName] widzi, jak przechadzam się po rynku. Podchodzi do mnie, uśmiecha się ciepło i mówi stłumionym głosem.\n\n– Ach, jak miło jest odpocząć od tych nudnych głosowań na zgromadzeniu. Często nie mam pojęcia, po której stronie się opowiedzieć. Taki mądry umysł jak twój jest niczym złota latarnia morska na zamglonym morzu – pozwala nędznikowi takiemu jak ja odnaleźć drogę w tych zawiłych sprawach politycznych – wzdycha teatralnie.\n\n– Zaczyna mi jednak brakować grosza. Jak ubogi żeglarz ma skierować dziób swego okrętu, gdy zgromadzenie ponownie wezwie do głosowania?"
 yearly_republic.1015.a: "Po prostu podaj cenę."
 yearly_republic.1015.c: "Moja propozycja sama się obroni."
 yearly_republic.1016.t: "Wymuszenie głosów siłą"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName] zachowuje się bezczelnie, ale ma na zgromadzeniu taki sam głos jak inni. Może da się [patrician.Custom('PL_go_ja')] jednak „przekonać” do głosowania pod moje dyktando.\n\nMuszę tylko wywrzeć na [patrician.Custom('PL_nim_niej')] presję, a zrozumie konsekwencje, jakie niesie sprawienie zawodu osobie takiej jak ja."
 yearly_republic.1016.a: "Pokrzyżuj [patrician.Custom('PL_jego_jej')] plany biznesowe poprzez sabotaż."
 yearly_republic.1016.b: "Niech zbiry zasadzą się na jednego z [patrician.Custom('PL_jego_jej')] dworzan i go pobiją."
 yearly_republic.1016.c: "Podpal [patrician.Custom('PL_mu_jej')] dom."
 yearly_republic.1016.d: "Pokażę [patrician.Custom('PL_mu_jej')], czym jest terror!"
 yearly_republic.1016.e: "Niech zagłosuje zgodnie z własnym sumieniem."
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNotMeNoTooltip] zobowiązuje się głosować tak samo jak ty."
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip] posłuży jako przykład."
 yearly_republic.1017.t: "Królowie filozofowie"
 yearly_republic.1017.desc: "Kolacja przeciąga się do późnych godzin nocnych. Trunki leją się strumieniami, a języki coraz bardziej się rozwiązują.\n[debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName] i ja dyskutujemy na każdy możliwy temat.\n\nUświadamiam sobie, że prowadzę dialog z najbardziej uczonymi patrycjuszami w republice – to naprawdę znamienite grono. Właśnie takich ludzi można przekonać, posługując się rozsądnymi argumentami oraz błyskotliwością umysłu, aby podczas następnego zgromadzenia głosowali tak jak ja."
 yearly_republic.1017.a: "Znakomite umiejętności oratorskie ich przekonają."
 yearly_republic.1017.b: "Logika mojego rozumowania ich zachwyci."
 yearly_republic.1017.c: "Może lepiej jest słuchać i się uczyć."
 yearly_republic.1017.a.success.desc: "Niech [debater_orator.GetFirstNameNoTooltip], najlepszy mówca przy stole, przegra z tobą na argumenty"
 yearly_republic.1017.a.success.toast: "Osoby przy stole zostają przekonane"
 yearly_republic.1017.a.failure.desc: "[debater_orator.GetFirstNameNoTooltip], najlepszy mówca przy stole, zbija cię z tropu"
 yearly_republic.1017.a.failure.toast: "Twoja argumentacja do nich nie przemawia"
 yearly_republic.1017.b.success.desc: "Niech [debater_scholar.GetFirstNameNoTooltip], najbardziej uczony umysł przy stole, przekona się do twoich argumentów"
 yearly_republic.1017.b.success.toast: "Osoby przy stole przyznają ci rację"
 yearly_republic.1017.b.failure.desc: "[debater_scholar.GetFirstNameNoTooltip], najbardziej uczony umysł przy stole, podważa twoją argumentację"
 yearly_republic.1017.b.failure.toast: "Twoja argumentacja zostaje podważona"
 yearly_republic.1017.c.toast: "Noc spędzona na słuchaniu"
 yearly_republic.1017.c.tt: "Istnieje niewielka szansa, że debata prowadzona tej nocy wywrze na tobie trwały wpływ"
 yearly_republic.1017.c.insight.toast: "Debata odciska piętno"
 yearly_republic.1018.t: "Dary z podróży"
 yearly_republic.1018.desc: "[benefactor_01.GetName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)], pojawia się bez zapowiedzi u moich bram. Po wymianie pozdrowień i serdecznym uścisku prowadzi mnie na zewnątrz do czekającego tam wozu wyładowanego różnymi towarami i ozdobami.\n\n– Przepraszam, że przybywam bez zapowiedzi, ale akurat tędy przejeżdżam i tak sobie myślę, że ucieszy cię ta ciekawostka, którą udało mi się sprowadzić z moich ostatnich podróży – to [new_curio.GetType|l].\n\n[benefactor_01.GetFirstNameNoTooltip] podnosi płachtę z wózka. To, co widzę przed sobą, to [new_curio.GetName|l]."
 yearly_republic.1018.a: "– Bardzo dziękuję, [ROOT.Char.Custom2('RelationToMeShortVocative', benefactor_01)]!"
 yearly_republic.1018.b: "Może udałoby się to sprzedać za dobrą cenę?"
 yearly_republic.1018_domicile_curio_sold_tt: "Sprzedajesz później ten prezent."
 yearly_republic.1019.t: "Dobre oko do szczegółów"
 yearly_republic.1019.desc: "To kolejny dzień, gdy ja i [benefactor_01.GetShortUINameNotMe], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)], przechadzamy się ulicami w miejscu znanym jako [event_location_01.GetName]. Zawsze jest coś, na co warto popatrzeć i o czym warto porozmawiać.\n\n– Zobacz, jak przechowują te produkty. [target_city.GetNameNoTooltip] – tam robią to o wiele lepiej. Słuchaj, tak wiele można się nauczyć od ludzi wokół nas, jeśli tylko poświęci się temu odrobinę uwagi."
 yearly_republic.1019.a: "– Czy [experience_trade_category_01.GetNameNoTooltip|l] to również coś, o czym masz wiedzę dzięki twoim podróżom?"
 yearly_republic.1019.b: "– A [experience_trade_category_02.GetNameNoTooltip|l]? Porozmawiajmy o tym, jak idzie handel tym towarem na rynku."
 yearly_republic.1019.c: "Muszę sprawić, by obserwacja stała się moim codziennym nawykiem."
 yearly_republic.1020.t: "Interesy w łaźni"
 yearly_republic.1020.desc: "– …bo przecież interesy kwitną dzięki wzajemnemu zaufaniu wspólników.\n\n[house_benefactor_01.GetFirstName] wylewa sobie na głowę wiadro wody i obraca się w moim kierunku z poważną miną.\n\n– Twoja rodzina cieszy się naszym szacunkiem.\n\nPara z łaźni przesłania mi widok, a gorąca woda rozluźnia mi mięśnie.\n\n– Ty i twoi krewni jesteście dobrymi przyjaciółmi naszego rodu [house_benefactor_01.GetDynastyHouseNameNoTooltip], dlatego uważam, że pogłębienie naszej współpracy jest czymś oczywistym. Przyniosłoby to korzyści obu stronom."
 yearly_republic.1020.a: "– Podzielmy się wspólnikami i kontaktami za granicą, poszerzając w ten sposób nasze wpływy."
 yearly_republic.1020.b: "– Podzielmy się doświadczeniem i wspólnie urośnijmy w siłę."
 ## GLOSS
 BUCENTAUR_GLOSS: "Bucentaur był wenecką pozłacaną barką państwową obsługiwaną przez wioślarzy z Arsenału i używaną wyłącznie podczas uroczystości."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! – co po łacinie oznacza „poślubiamy cię, morze, na znak prawdziwej i wiecznej władzy”."
