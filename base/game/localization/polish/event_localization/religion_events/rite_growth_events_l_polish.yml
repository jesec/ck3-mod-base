l_polish:
 rite_growth.0010.t: "Nowy obrządek religii znanej jako [origin_faith.GetReligion.GetNameNoTooltip|l]"
 rite_growth.0010.desc.intro.relation: "Za nowo utworzony obrządek odpowiada przede wszystkim [founder.GetFirstName], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', founder.Self)]."
 rite_growth.0010.desc.intro.descriptor_archbishop: "Za nowo utworzony obrządek odpowiada przede wszystkim [founder.GetFirstName], arcybiskup wywodzący się z kultury znanej jako kultura [founder.GetCulture.GetName|l]."
 rite_growth.0010.desc.intro.descriptor_ruler: "Za nowo utworzony obrządek odpowiada przede wszystkim [founder.GetTitledFirstName]."
 rite_growth.0010.desc.opener.archbishopric: "sprawuje władzę nad miejscem o nazwie [founder_clerical_title.GetNameNoTier].\n\n"
 rite_growth.0010.desc.opener.lands: "[founder.GetFirstName] sprawuje rządy nad miejscem o nazwie [founder.GetPrimaryTitle.GetBaseNameNoTier].\n\n"
 rite_growth.0010.desc.divergence.minor: "Obrządek znany przez jego wyznawców jako [new_rite.GetName|l] tylko w niewielkim stopniu różni się od obrządku o nazwie [source_rite.GetName|l],"
 rite_growth.0010.desc.divergence.moderate: "Obrządek znany przez jego wyznawców jako [new_rite.GetName|l] ma zwyczaje, które są nieznane większości wyznawców obrządku o nazwie [source_rite.GetName|l],"
 rite_growth.0010.desc.divergence.major: "Obrządek znany przez jego wyznawców jako [new_rite.GetName|l] ma zwyczaje, które ocierają się o herezję w oczach większości wyznawców obrządku o nazwie [source_rite.GetName|l],"
 rite_growth.0010.desc.differing.tenet: "przy czym najbardziej istotną zmianą jest dogmat „[differing_tenet.GetBaseName]”."
 rite_growth.0010.desc.differing.doctrine: "przy czym najbardziej istotną zmianą jest doktryna „[differing_doctrine.GetDescriptiveName]”."
 rite_growth.0010.desc.differing.fallback: "ale różnica w doktrynie jest zbyt subtelna, by ją łatwo określić."
 rite_growth.0010.desc.outro.wildfire: "\n\nTe nowe nauki szybko się rozprzestrzeniają wśród wiernych wyznających wiarę, którą jest [origin_faith.GetName|l]."
 rite_growth.0010.a: "Moja dusza jest bezpieczna dzięki obrządkowi o nazwie [ROOT.Char.GetRite.GetNameNoTooltip|l]."
 rite_growth.0010.b: "Muszę postępować zgodnie z obrządkiem o nazwie [new_rite.GetNameNoTooltip|l]!"
 rite_growth.0010.c: "Pachnie mi to herezją…"
 counties_and_court_converts: "[counties|E] i [courtiers|El] wyznające obrządek o nazwie [source_rite.GetName|l] nawrócą się na obrządek, którym jest [new_rite.GetName|l]"
 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNotMeNoTooltip] przyjmuje obrządek"
 rite_growth.0011.notification.desc: "[convert_ruler.GetTitledFirstName] dołącza do osoby znanej jako [founder.GetTitledFirstName], aby praktykować obrządek o nazwie [new_rite.GetName|l]"
 iberian_struggle_blocks_holy_war_tt: "Wypowiedzenie [Concept('holy_war', 'świętej wojny')|E] nie może być blokowane przez [iberian_struggle|El]"
