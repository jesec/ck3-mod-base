l_polish:
 holy_order_hired_message: "Zatrudnienie zakonu wojskowego"
 holy_order.hired_message: "[actor.GetUINameNotMe] wezwał[Select_CString(actor.IsFemale, 'a', '' )] zakon: [holy_order.GetName]"
 holy_order_hired_by_enemy_message: "Wrogi zakon wojskowy"
 holy_order.hired_by_enemy: "[actor.GetUINameNotMe] wzywa zakon znany jako [holy_order.GetName], który teraz jest przeciwko nam"
 holy_order.destroyed_message: "Zakon [title.GetName] został zniszczony"
 holy_order_expanded: "Zakon wojskowy rozszerza się"
 holy_order.new_lease: "[holy_order.GetName] dzierżawi teraz [barony.GetName] od [former_holder.GetTitledFirstName]"
 monastic_holy_order_expanded: "Zakon monastyczny rośnie w siłę"
 holy_order.0001.t: "Zakon wojskowy"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] czeka, by mnie pożegnać. [recipient.Custom('PL_jego_jej')|U] dobytek i świta są przygotowane do drogi.\n\n"
 holy_order.0001.desc_demand: "– Sądzę, że jest w tym pewna chluba – utyskuje. – Umrzeć, byle tylko zdobyć jakąś obcą, pogańską ziemię. Moim marzeniem było zginąć za zakon o nazwie [actor.GetPrimaryTitle.GetNameNoTier]…\n\nWsiada na konia i zadaje pytanie:\n\n– Dokąd mam się udać?"
 holy_order.0001.desc: "– Tak więc, wasza czcigodność, któremu zakonowi mam służyć z sercem pełnym modlitwy i ostrzem gotowym do ataku?"
 holy_order.0001.desc_relation: "Wiedz, że mój miecz pragnie pogańskiej krwi! Gdzie mam się jednak udać? Kto będzie moim nowym bratem czy siostrą?"
 holy_order.0001.a: "Dołączysz do zakonu o nazwie [holy_order_1.GetName]."
 holy_order.0001.b: "Twoje miejsce jest w zakonie o nazwie [holy_order_2.GetName]."
 holy_order.0001.c: "Zakon o nazwie [holy_order_3.GetName] cię przyjmie."
 holy_order.0001.d: "Stanowisz teraz problem dla [holy_order_4.GetName]."
 holy_order.0001.e: "Popełnił[Select_CString(ROOT.Char.IsFemale, 'am', 'em' )] błąd, twoje miejsce jest tutaj!"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUINameNotMe] przyjmuje wezwanie osoby znanej jako [puppet_or_actor.GetShortUINameNotMe] do wstąpienia do zakonu wojskowego"
 holy_order.0002.desc_angry: "Z moich ust padły święte słowa i podobnie jak twoja wola mnie związała, tak teraz mam zobowiązania wobec [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0002.desc: "Odpowiem na wezwanie, by służyć sile wyższej i dziękuję za skierowanie mnie na tę ścieżkę prawości."
 holy_order.0002.a_demand: "Doskonale. Wzywa cię [ROOT.Char.GetFaith.PositiveAfterLife]. Czekaj w milczeniu."
 holy_order.0002.a: "Mam pewność, że [ROOT.Char.GetFaith.HighGodName] będzie mieć z ciebie pożytek!"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUINameNotMe] składa śluby na polecenie osoby znanej jako [puppet_or_actor.GetShortUINameNotMe]"
 char_interaction.0001.opening_low_piety: "Że też taki [ROOT.GetCharacter.Custom('GetSinfulShameful')] człowiek jak ty przychodzi na kolanach do świętego zakonu oddanego pamięci [ROOT.Char.GetFaith.HighGodNamePossessive]… Pomyśl o odkupieniu swojej duszy, zanim zaczniesz martwić się o ziemskie bogactwa."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "Powiedziano nam, że potrzebujesz złota. Jako [order.GetName] odpowiemy na twoje prośby."
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName] uśmiecha się do mnie!"
 holy_order.0200.b: "Ale… Ale ja potrzebuję pieniędzy!"
 holy_order.0202.second_time: "Jeszcze raz przypominam, że masz mojemu zakonowi do oddania #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! szt. złota."
 holy_order.0202.opening: "Masz mojemu zakonowi do oddania #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! szt. złota."
 holy_order.0202.desc: "Jeśli nie zwrócisz nam złota, znajdziemy inne sposoby na uzyskanie od ciebie spłaty. Sposoby, które podpowiada nam [ROOT.Char.GetFaith.HighGodName], ale które najpewniej ci się nie spodobają."
 holy_order.0202.a: "Oczywiście, że dotrzymam naszej umowy."
 holy_order.0202.a_no: "Zapłacę! Pozwólcie mi tylko znaleźć złoto…"
 holy_order.0202.a._not.tt: "@warning_icon! #X Za mało [gold_i][Concept( 'gold', 'złota' )|E]#!"
 holy_order.0202.b_christian: "Czy cierpliwość nie jest cnotą?"
 holy_order.0202.b: "Jako współwyznawc[Select_CString(ROOT.Char.IsFemale, 'zyni', 'a' )]… Proszę, daj mi więcej czasu!"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip] da ci jeszcze 5 lat"
 holy_order.0202.c: "Może znajdziemy jakiś inny sposób zapłaty…?"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip] poprosi cię o coś#!"
 holy_order.0202.d: "Złoto jest bardziej użyteczne w moich rękach!"
 holy_order.0203.desc: "Podobnie jak [ROOT.Char.GetFaith.HighGodNameAlternate], nie spoglądam łaskawie na tych, którzy łamią swoje słowo. Aby naprawić tę krzywdę, wydzierżawisz nam [province.GetName], abyśmy mogli kontynuować dzieło [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0203.a: "Oczywiście, [province.GetNameNoTierNoTooltip] będzie należeć do was."
 holy_order.0203.b: "To absurdalne żądanie!"
 holy_order.0204.desc: "Podobnie jak [ROOT.Char.GetFaith.HighGodNameAlternate], nie spoglądam łaskawie na tych, którzy łamią swoje słowo. Aby naprawić tę krzywdę, [Select_CString(child.IsFemale, 'twoja', 'twój' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetTitledFirstName], przejdzie do nas, aby wykonywać wolę [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0204.a: "W-wyślę [Select_CString(child.IsFemale, 'ją', 'go' )] w drogę."
 holy_order.0204.a.tt: "Twój dług wobec zakonu został spłacony"
 holy_order.0205.desc: "Cała ta afera związana z pożyczką była haniebnym przejawem twojej chciwości. Upewnię się, że [ROOT.Char.GetFaith.ReligiousHeadName] usłyszy o tym!"
 holy_order.0205.a: "Szlag!"
 holy_order_letter.opening: "Sługo [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]!"
 holy_order.1001.intro: "Do zakonu o nazwie [holy_order.GetName] przybywają gorliwi wyznawcy, gotowi poświęcić swoje śmiertelne ciała w imię wiary znanej jako [ROOT.Char.GetFaith.GetName|l]. [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )] będą potrzebować więcej przestrzeni."
 holy_order.1001.end: "\n\nMiejsce o nazwie [target_barony.GetName] jest stworzone do tego celu. Czy możemy wydzierżawić ten teren w służbie naszej świętej sprawy?"
 holy_order.1001.a: "Wasza prośba zostanie spełniona. W imię [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 holy_order.1001.b: "A czy [alternative_barony.GetNameNoTierNoTooltip] nie może pełnić tej roli?"
 holy_order.1001.c: "Nie, nie dam wam tej ziemi."
 holy_order.1011.intro: "Miejsce o nazwie [target_barony.GetName] ma dobre ziemie pod uprawy. Jest tam również [grandmaster.GetFaith.HouseOfWorship|l], któremu przysłużą się [grandmaster.Custom('SistersBrothers')] z mojego klasztoru."
 holy_order.1011.end: "\n\nCzy zechcesz zostać naszym pośrednikiem, aby zakon o nazwie [holy_order.GetName] mógł w tym miejscu założyć klasztor?"
 holy_order.1011.a: "Zakon może wydzierżawić ziemie o nazwie [target_barony.GetNameNoTierNoTooltip]."
 holy_order.1011.b: "Czy w miejscu o nazwie [alternative_barony.GetNameNoTierNoTooltip] zaznamy ciszy i spokoju?"
 holy_order.1011.c: "Obawiam się, że [grandmaster.Custom('SistersBrothers')] muszą znaleźć sobie inne miejsce."
 holy_order.2001.t: "Boski cel"
 holy_order.2001.desc: "Kiedy [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] mojej osoby, przychodzi do mnie, szybko pojmuję, że ma coś bardzo poważnego do omówienia.\n\n– Moje życie tutaj będzie zawsze toczyć się w cieniu innych. Zamiast tego chcę dołączyć do organizacji, którą jest [holy_order.GetName]. [child.GetFaith.HighGodName] tak mi każe, a ja chcę nieść ludziom boskie słowo. Myślę o tym od dawna i wiem, że naprawdę tego chcę."
 holy_order.2001.a: "Niech [child.GetFaith.HighGodNameAlternate] cię prowadzi, [Select_CString(child.IsFemale, 'moja córko', 'mój synu' )]."
 holy_order.2001.b: "Może nie są zbyt imponujące, ale mam co do ciebie plany."
 holy_order.2002.desc: "Kiedy [sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] mojej osoby, mówi mi o swoich planach, staje się jasne, że zastanawia się nad tym od długiego czasu.\n\n– Niewiele mnie tu czeka, a jeśli mam komuś służyć, niech to będzie [sibling.GetFaith.HighGodHerselfHimself] [sibling.GetFaith.HighGodName]. [holy_order.GetName] czeka na mnie."
 holy_order.2002.a: "Rozumiem twój wybór, [Select_CString( sibling.IsFemale, 'siostro', 'bracie' )]."
 holy_order.2002.b: "Och, absolutnie tego #EMP nie#! zrobisz!"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "Prawdziwi wojownicy, którzy powstrzymają każde zagrożenie, z jakim będzie zmagać się wiara [grandmaster.GetFaith.GetAdjective|l], zawsze będą potrzebni.\nMając wiele predyspozycji i mało perspektyw na dziedziczenie, wierzę, że twoje dziecko, [child.GetTitledFirstName], będzie mogło wieść lepsze życie służąc zakonowi o nazwie [holy_order_scope.GetName]. Z nami będzie trenować, uczyć się i przynosić wielki zaszczyt twojemu imieniu."
 holy_order.2003.a: "Będzie żyć, jak prawdziwy [child.GetFaith.GetAdherentName]."
 holy_order.2003.child_joins_order: "[child.GetFirstName] zyskuje cechę [GetTrait('order_member').GetName( child.Self )|l] i dołącza do dworu, którym zarządza [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b: "Może zamiast tego [alternative_child.GetFirstNameNoTooltip] [Select_CString(alternative_child.IsFemale, 'mogłaby', 'mógłby' )] się od ciebie czegoś nauczyć?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName] zyskuje cechę [GetTrait('order_member').GetName( alternative_child.Self )|l] i dołącza do dworu, którym zarządza [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.c: "[child.GetHerHis|U] miejsce jest przy mnie."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "Poświęcam swoje życie w imię [child.GetFaith.HighGodNameAlternatePossessive], ale nie wierzę, żeby ignorowanie własnej rodziny było tym, czego chce opatrzność.\n\n[grandmaster.GetTitledFirstName] pozwala mi wrócić do dawnego życia i znów zasilić moją obecnością twój [ROOT.Char.Custom('GetCourt')]."
 holy_order.2004.a: "Witaj w domu, [Select_CString(child.IsFemale, 'moja', 'mój' )] [Select_CString(child.IsFemale, 'córko', 'synu' )]!"
 holy_order.2004.b: "Nie, tutaj już nie ma dla ciebie miejsca."
 holy_order.2005.t: "Powrót do domu"
 holy_order.2005.desc: "[child.GetTitledFirstName] bawi u nas dłużej niż zwykle. Temat [child.Custom('PL_jego_jej')] powrotu do zakonu poruszam dopiero po tym, jak [child.Custom('DaughterSon')] zadomawia się na moich włościach, zapychając żołądek jadłem i nękając moich służących. [child.Custom('PL_jego_jej')|U] odpowiedź była niestety entuzjastyczna.\n\n– Czy nie dotarły do ciebie wieści? [grandmaster.GetTitledFirstName] w swojej szczodrości zwalnia mnie z moich zobowiązań wobec wiary, jaką jest [child.GetFaith.GetName]! W końcu jestem w domu, aby służyć mojej rodzinie."
 holy_order.2005.a: "Och, jesteś… tu, by zostać?"
 holy_order.destroyed_title: "Rozwiązano zakon wojskowy"
 holy_order.2010.t: "Nowy zakon monastyczny"
 holy_order.2010.desc: "Eremici, mistycy i niezadowoleni uczniowie ze starszych zakonów zebrali się w miejscu znanym jako [barony.GetNameNoTier] i przez lata pracowali nad budową swojego nowego domu na odludziu. Osoba znana jako [leader.Custom('SisterBrother')] [leader.GetFirstName] wyrosła na naturalnego przywódcę rozwijającego się zakonu o nazwie [leader.GetPrimaryTitle.GetName]… Wciąż nikt jednak nie usłyszał #EMP mojego#! dostojnego głosu w tej sprawie. Muszę także zaproponować świętą zasadę, która miałaby stanowić fundament sposobu życia w zakonie.\n\nO czym będzie śpiewał ten chór szczerych wyznawców w miejscu o nazwie [barony.GetNameNoTierNoTooltip]? Nad czym będą pracować, by żyć pełnią życia? O czym będą myśleć i pisać? I kto ich w tym poprowadzi?"
 holy_order.2010.4: "Dogmat „[tenet_4.GetName( order_rite )]” i [monk_tenet_1.Custom('SisterBrother')] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5: "Dogmat „[tenet_5.GetName( order_rite )]” i [monk_tenet_2.Custom('SisterBrother')] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6: "Dogmat „[tenet_6.GetName( order_rite )]” i [monk_tenet_3.Custom('SisterBrother')] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d: "Dogmat „[tenet_1.GetName( order_rite )]” i [monk_tenet_1.Custom('SisterBrother')] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.e: "Dogmat „[tenet_2.GetName( order_rite )]” i [monk_tenet_2.Custom('SisterBrother')] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f: "Dogmat „[tenet_3.GetName( order_rite )]” i [monk_tenet_3.Custom('SisterBrother')] [monk_tenet_3.GetFirstNameNoTooltip]."
 monastic_tenet_pick_tt: "Dogmat „[tenet_pick.GetName( order_rite )]” będzie [Concept('core_tenet', 'dogmatem')|E] propagowanym przez zakon o nazwie [monastic_order.GetName]"
 monastic_order_tenet_advocated_tt: "Zakon o nazwie [monastic_order.GetName] propaguje dogmat „[tenet_pick.GetName( order_rite )]”"
 founded_monastic_order_modifier: "Założyciel zakonu monastycznego"
 founded_monastic_order_modifier_desc: "Ten mądry władca przyczynił się do koncepcji i utworzenia nowego zakonu monastycznego, a przez to do zwrócenia się bezpośrednio do boskości."
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUINameNotMe] zostaje [Concept('ruler', 'władcą')|E] zakonu o nazwie [monastic_order.GetName]"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUINameNotMe] pozostaje [Concept('ruler', 'władcą')|E] zakonu o nazwie [monastic_order.GetName]"
 holy_order.2009.t: "Budowa klasztoru"
 holy_order.2009.desc: "[province.GetTerrain.GetNameNoTooltip|U] pośród ciszy, w miejscu, które kochają [province.GetCulture.GetCollectiveNoun|l], – to tutaj kładę pierwszy kamień pod fundamenty klasztoru miejsca o nazwie [province.GetName].\n\nMoi robotnicy dołączają do prostych oblatów, by wznosić mury i wydobywać modlitewne pieśni ze swoich zapracowanych ciał. Pierwsi szanowani mnisi – jak [potential_leader.Custom('SisterBrother')] [potential_leader.GetName] – również przybyli, by stąpać po tych ziemiach i tworzyć plany kaplic i refektarzy.\n\nZa kilka lat narodzi się tu nowy zakon. Kamień i [ROOT.Char.Custom('GetWritingMaterial')] nie wystarczą – zakon będzie potrzebował też wiernych członków."
 holy_order.2009.a: "Nowym zakonem muszą przewodzić osoby, które wspieram."
 holy_order.2009.b: "Wielu mnichów dusi się w swoim obecnym zakonie…"
 holy_order.2009.b.tt: "i porzuciłoby swoich przełożonych, by zgłębiać tajniki nowego zakonu, dla swobody ustanawiania nowych reguł."
 holy_order.2009.c: "Zbierzmy dzikich ascetów i gorliwą młodzież."
 monastic_order_creation_increased_spiritual_fulfillment: "[interactions|E] z [Concept('monastic_holy_order', 'zakonem monastycznym')|E] będą zapewniać więcej [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] przez #high 50 lat#!"
 monastic_founder_become_saint_tt: "[chosen_leader.GetShortUINameNotMe] po śmierci zyska cechę [GetTrait('saint').GetName( chosen_leader.Self )|l], o ile ma #high 65+#! pkt [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] [GetTrait('devoted').GetName( chosen_leader.Self )|l] lub [chosen_leader.Custom('PL_jego_jej')] [piety_level|El] to @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]"
 holy_order.2020.t: "Śluby monastyczne"
 holy_order.2020.desc: "Na moją prośbę [recipient.GetFirstName], przywdziawszy szaty zakonne odwraca się od świata świeckiego. [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] i szlachta to już przeszłość. Przyjęliśmy [recipient.Custom('PL_go_ja')] w zakonie o nazwie [archabbot.GetPrimaryTitle.GetName] z otwartymi ramionami.\n\nPodobnie jak [recipient.Custom('SistersBrothers')] w [recipient.Custom('PL_jego_jej')] zakonie, [recipient.GetFirstNameNoTooltip] ślubuje służbę i wierność świętej wspólnocie. Poświęca swoje ciało w imię [recipient.GetFaith.HighGodNamePossessive], a [recipient.Custom('PL_jego_jej')] duszę od teraz czeka [recipient.GetFaith.PositiveAfterLife].\n\n[recipient.GetFirstNameNoTooltip] zamieszka w miejscu o nazwie [archabbot.GetCapitalLocation.GetName] lub innym sanktuarium zakonnym i tam rozpocznie życie pełne nauki i kontemplacji."
 holy_order.2020.aa: "Zakon zyskał pracowity umysł."
 holy_order.2020.aa.tt: "Umiejętności zarządzania osoby znanej jako [recipient.GetFirstNameNoTooltip] przydadzą się w nieustannej pracy."
 holy_order.2020.a: "Zakon zyskał mądrego ucznia."
 holy_order.2020.a.tt: "Nie ma na tym świecie śmiertelników bardziej odpowiedniego miejsca dla osoby uczonej, którą jest [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U] patrona nie jest pomywaczem…"
 holy_order.2020.c: "„Datek” sprawi, że osoba o imieniu [recipient.GetFirstNameNoTooltip] poczuje się rozpieszczona."
 holy_order.2020.d: "[recipient.Custom('PL_jego_jej')|U] życie należy teraz do zakonu."
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUINameNotMe] dołącza do zakonu monastycznego na prośbę postaci znanej jako [puppet_or_actor.GetShortUINameNotMe]"
 take_vows_improve_education_learning_tt: "Efekt [Concept('education', 'edukacji')|E] @skill_learning_icon! [Concept('learning', 'nauki')|E] ulegnie poprawie"
 take_vows_improve_education_stewardship_tt: "Efekt [Concept('education', 'edukacji')|E] @skill_stewardship_icon! [Concept('stewardship', 'zarządzania')|E] ulegnie poprawie"
 recently_joined_holy_order_desc: "Postać znana jako [recipient.GetShortUINameNotMe] dołączyła do swojego zakonu w ciągu ostatnich 5 lat"
 child_in_holy_order_desc: "[recipient.GetShortUINameNotMe] jest dzieckiem obiecanym swojemu zakonowi"
 custom.every_domain_monastic_order: "Każdy [monastic_holy_order|El] w twojej [Concept('domain', 'domenie')|E]"
 order_gains_minor_tenet_popularity_tt: "Ich [core_tenet|El] zdobywa #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! pkt [Concept('tenet_popularity', 'popularności')|E]"
 new_order_gains_minor_tenet_popularity_tt: "Twój nowy [monastic_holy_order|El] zapewni dodatkowe pkt [Concept('tenet_popularity', 'popularności')|E] (#P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#!) swojemu [Concept('core_tenet', 'dogmatowi')|E]"
 holy_order.2030.t: "Datek: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "Moje bogactwa trafiają do skarbców klasztorów osoby znanej jako [recipient.GetFirstName]. Ten datek ma sfinansować pełne szacunku użytkowanie ziemi, przepisywanie świętych tekstów, doczesne cele zakonu o nazwie [recipient.GetPrimaryTitle.GetName]…\n\n…i tysiąc modlitw poświęconych sprawie mojej nieśmiertelnej duszy. Mnisi bowiem żyją, by się modlić, a ich niezwykła, sprawiedliwa pobożność – jak powiadają – oznacza, że ich modlitw wysłuchuje ze szczególną troską nie kto inny jak [ROOT.Char.GetFaith.random_GoodGodNames|U].\n\n#EMP Czy do uszu [actor.GetFaith.HighGodNamePossessive] dociera, jak wymawiają moje imię?#!"
 holy_order.2030.desc_desperate_plea: "#EMP Czy słychać, jak błagam, czy widać, jak się płaszczę – niczym nędznik – o miłosierdzie?#!"
 holy_order.2030.desc_huge_donation: "#EMP Przypomnę tylko, z jakim majątkiem trzeba było mi się rozstać…#!"
 holy_order.2030.a: "Nowi orędownicy mojego zbawienia."
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUINameNotMe] przyjmuje darowiznę na rzecz klasztoru od osoby znanej jako [puppet_or_actor.GetShortUINameNotMe]"
 holy_order.2031.opening: "Szanowny zakonniku,"
 holy_order.2031.desc: "myśleliśmy i modliliśmy się na Twoją prośbę, lecz obawiam się, że żaden datek nie skłoni moich mnichów do błagania [recipient.GetFaith.HighGodNamePossessive] w Twojej sprawie. Twoje zbawienie wydaje się być poza naszym zasięgiem."
 holy_order.2031.a: "Ech! Przynajmniej nadal mam swoje monety."
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUINameNotMe] odrzuca darowiznę na rzecz klasztoru od osoby znanej jako [puppet_or_actor.GetShortUINameNotMe]"
 already_has_monastic_lease_tt: "[target.GetNameNoTier] – to miejsce jest już [Concept('leased', 'wydzierżawione')|E] [Concept('monastic_holy_order', 'zakonowi monastycznemu')|E]"
 lease_title_to_existing_monastic_order_interaction: "Obdarowanie klasztoru"
 lease_title_to_existing_monastic_order_interaction_desc: "[Concept('lease', 'Wydzierżaw')|E] [Concept('temple_holding', 'posiadłość świątynną')|E] zakonowi o nazwie [recipient.GetPrimaryTitle.GetName], zyskując [spiritual_fulfillment|El], [piety|El] i szerszy dostęp do zakonu"
 INTERACTION_LEASE_DONATION: "Zakup włości pomocniczych"
 no_valid_temple_holdings_to_lease_tt: "W twojej [Concept('domain', 'domenie')|E] nie ma [Concept('temple_holdings', 'posiadłości świątynnych')|E] dostępnych pod [Concept('lease', 'dzierżawę')|E]"
 monastic_onslaught_modifier_tt: "[target_county.GetName] – to miejsce zyskuje modyfikator „[GetModifier('monastic_onslaught_modifier').GetNameWithTooltip]” na #high 20 lat#!"
 holy_order.2040.opening: "Do osoby znanej jako [actor.GetFirstName] z miejsca o nazwie [actor.GetPrimaryTitle.GetNameNoTier]. O, dobroczyńco,"
 holy_order.2040.desc: "Stało się. [actor.GetFaith.HouseOfWorship|U] w miejscu znanym jako [target.GetNameNoTier] przyjmie kapitułę zakonu o nazwie [recipient.GetPrimaryTitle.GetNameNoTier] i to w sercu miejsca znanego jako [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier] ukryjemy starożytne teksty z bibliotek miejscowości znanej jako [recipient.GetCapitalLocation.GetName].\n\n"
 holy_order.2040.desc_nuns: "I w tym miejscu nasze [recipient.GetFaith.DevoteeFemalePlural] będą śpiewać modlitwy do [actor.GetFaith.HighGodNamePossessive] w twoim imieniu."
 holy_order.2040.desc_monks: "I w tym miejscu nasi [recipient.GetFaith.DevoteeMalePlural] będą śpiewać modlitwy do [actor.GetFaith.HighGodNamePossessive] w twoim imieniu."
 holy_order.2040.desc_huge_donation: "Tak wielka jest wdzięczność zakonu za twoje święte miłosierdzie."
 holy_order.2040.desc_rite: "\n\nWiedz, że kapituła zachowa zwyczaje obrządku o nazwie [recipient.GetRite.GetName|l], tak jak to robi każdy konwent w naszym zakonie."
 holy_order.2040.a: "Niech wasz zakon kwitnie!"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUINameNotMe] przyjmuje propozycję postaci znanej jako [puppet_or_actor.GetShortUINameNotMe] dotyczącą dzierżawy baronii"
 holy_order.2041.opening: "Do osoby znanej jako [actor.GetFirstName] z miejsca o nazwie [actor.GetPrimaryTitle.GetNameNoTier],"
 holy_order.2041.desc: "my, najczystsi wyznawcy [recipient.GetFaith.HighGodNamePossessive], którzy przynoszą absolutną świętość, jaką oferuje [recipient.GetFaith.PositiveAfterLife], na tę nędzną ziemię… obawiamy się, że państwo o nazwie [actor.GetPrimaryTitle.GetNameNoTier] nawiedziła zaraza, której nawet nasze modlitwy nie będą w stanie odegnać.\n\nDopóki dusza Twojego państwa jest całkowicie oderwana od [recipient.GetFaith.HighGodNamePossessive], zakon o nazwie [recipient.GetPrimaryTitle.GetName] nie może postawić stopy na ziemiach znanych jako [target.GetNameNoTier]."
 holy_order.2041.a: "Ta ich „czystość” – co za bzdury!"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUINameNotMe] odrzuca propozycję postaci znanej jako [puppet_or_actor.GetShortUINameNotMe] dotyczącą dzierżawy baronii"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial Zakon o nazwie [monastic_order.GetName] wejdzie w [holy_order_vicinity|El], co umożliwi na wzajemne [interactions|El]#!"
 holy_order.2050.t: "W baronii o nazwie [barony.GetNameNoTierNoTooltip] powstaje ruch"
 holy_order.2050.desc: "„Czy zakon znany jako [target_order.GetName] wciąż podąża drogą cierpienia… tak jak robili to pustelnicy na pustyni?” – tak zaczynają się wszystkie płomienne listy, które wysyła [clerical_helper.GetName].\n\n„Czy [target_lessee.GetTitledFirstName] nie stroi się czasem w złoto?” – pytają w swoich kazaniach reformatorzy z baronii o nazwie [barony.GetNameNoTier], a kończą słowami: #EMP „Nowa droga! Nowa reguła!”.#!\n\nKlasztor szybko staje się wylęgarnią pobożnej reformy i sprzeciwu. Jego mieszkańcy ledwie przypominają dawnych ludzi [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] i mało kogo satysfakcjonują już jałowe nauki dogmatu „[target_order_tenet.GetName( founder.GetRite )]”. Ale ich reformatorskiego ducha trzeba jednak skierować ku jednej, nowej zasadzie i jednemu zamysłowi."
 msg_order_movement_took_monastery.t: "Ruch [chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 movement_took_monastery_notification_3_tt: "[new_holy_order.GetName] – ten zakon przejął od zakonu o nazwie [target_order.GetName] baronię znaną jako [barony.GetNameNoTier] i inne [leases|El]"
 movement_took_monastery_notification_2_tt: "[new_holy_order.GetName] – ten zakon przejął od zakonu o nazwie [target_order.GetName] baronię znaną jako [barony.GetNameNoTier] i miejsce o nazwie [lease_2.GetNameNoTier]"
 movement_took_monastery_notification_tt: "[new_holy_order.GetName] – ten zakon przejął od zakonu o nazwie [target_order.GetName] [Concept('lease', 'dzierżawę')|E] baronii znanej jako [barony.GetNameNoTier]"
 movement_took_monastery_patron_notification_tt: "[founder.GetShortUINameNotMe] sankcjonuje ten reformowany [monastic_holy_order|El]"
