l_polish:
 faith_creation.1001.t.schism: "[reformed_faith.GetAdjectiveNoTooltip|U] schizma"
 faith_creation.1001.t.reformation: "[reformed_faith.GetAdjectiveNoTooltip|U] reformacja"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetName] mierzy się z nowym rozłamem. [reformer.GetTitledFirstName] i [reformer.Custom('PL_jego_jej')] zwolennicy odrzucili wiarę znaną jako [old_faith.GetName|l], a ich dawny obrządek o nazwie [old_rite.GetName|l] stał się zalążkiem odrębnego wyznania."
 faith_creation.1001.desc.reformation: "Znacząca wśród zbiorowości znanej jako [reformed_faith.GetAdherentNamePlural|l] postać – [reformer.GetTitledFirstName] – zwołała zgromadzenie, w którym bierze udział każdy [reformer.Custom('DefaultPriestTitle')|l] z tych ziem. Celem jest połączenie rozproszonych obrządków w jedną tradycję i sformułowanie na jej podstawie oficjalnej doktryny wiary."
 faith_creation.1001.desc.schism.personal: "[old_faith.AltPriestTermPlural|l], których wyznaniem była wiara [old_faith.GetAdjective|l], zbłądzili – nie możemy już ufać, że doprowadzą nas do celu. Na szczęście otaczają mnie [reformer.Custom('DefaultPriestTitlePlural')|l] o takich samych poglądach. Po wprowadzonych przez nas zmianach [old_rite.GetName|l] nie jest już częścią naszej pierwotnej wiary."
 faith_creation.1001.desc.reformation.personal: "Wreszcie, po długich staraniach, otacza mnie każdy istotny [reformer.Custom('DefaultPriestTitle')|l] tego świata. Możemy teraz połączyć rozproszone obrządki w jedną tradycję i sformułować na jej podstawie doktrynę, która stanie się drogowskazem naszej wiary."
 faith_creation.1001.desc.schism.personal.hof: "Nie zamierzam klęczeć, dopóki [old_hof.GetTitledFirstName] i [old_faith.AltPriestTermPlural|l], za którymi podąża społeczność [old_faith.GetAdjective|l], prowadzą wiernych ku zgubie. Otaczają mnie [reformer.Custom('DefaultPriestTitlePlural')|l] o takich samych poglądach. Zachowany przez nas obrządek o nazwie [old_rite.GetName|l] stał się podstawą nowej, niezależnej wiary. [old_faith.GetName] to dla nas przeszłość – nie będziemy patrzeć wstecz."
 faith_creation.1001.desc.schism.hof: "Nie uznając już zwierzchnictwa postaci znanej jako [old_hof.GetTitledFirstName], [reformer.GetTitledFirstName] odwodzi swoich zwolenników od wiary znanej jako [old_faith.GetName|l]. Wciąż utrzymywany przez nich obrządek o nazwie [old_rite.GetName|l] stał się podstawą nowego, zupełnie niezależnego wyznania."
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\nGorliwi [reformer.Custom('DefaultPriestTitlePlural')] już mówią o tym, jak bardzo potrzebne są [reformed_faith.GHWNamePlural|l], aby szerzyć ich nową wiarę na całym świecie oraz"
 faith_creation.1001.desc.outlook.pacifism: "\n\n[reformer.Custom('DefaultPriestTitlePlural')|U] ci potępili przemoc oraz rozlew krwi, mówiąc, że wojna prowadzi jedynie do cierpienia i nienawiści, a także"
 faith_creation.1001.desc.outlook.dogmatic: "\n\n[reformer.Custom('DefaultPriestTitlePlural')|U] ci ogłosili, iż [reformed_faith.GetNameNoTooltip|l] jest jedyną prawdziwą wiarą i"
 faith_creation.1001.desc.outlook.accepting: "\n\n[reformer.Custom('DefaultPriestTitlePlural')|U] ci zachęcają do współpracy i tolerancji, nawet wobec niewierzących oraz"
 faith_creation.1001.desc.outlook.fallback: "\n\n[reformer.Custom('DefaultPriestTitlePlural')|U] ci przyjęli pragmatyczne i zrównoważone podejście do innych wyznań i religii oraz"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "twierdzą, że jedynym sposobem na okazanie właściwego oddania jest uhonorowanie [reformed_faith.HighGodNamePossessive] ofiarami z ludzi!"
 faith_creation.1001.desc.belief.indulgent: "nawołują wyznawców do oddawania się pożądliwościom ciała i życia pełnią piersią."
 faith_creation.1001.desc.belief.incest: "sankcjonują małżeństwa bliskich krewnych, twierdząc, że więzy rodzinne są święte, a małżeństwa błogosławione."
 faith_creation.1001.desc.belief.aniconism: "odrzucają używanie jakiejkolwiek symboliki religijnej, twierdząc, że zwykłe podobizny nie są w stanie oddać wielkości [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.ascetic: "promują ascezę wśród swoich wyznawców, twierdząc, że materialistyczne dążenia blokują drogę do duchowego spełnienia."
 faith_creation.1001.desc.belief.spirits: "zwrócili się o pomoc do duchów, aby pomogły poprowadzić wiernych przez te niespokojne czasy."
 faith_creation.1001.desc.belief.superstition: "wiele starożytnych przesądów i mitycznych opowieści zostało uznanych w oficjalnej doktrynie."
 faith_creation.1001.desc.belief.nature: "mają wielki szacunek dla samej natury, starając się ją chronić przed tymi, którzy chcieliby ją wykorzystać dla własnych korzyści."
 faith_creation.1001.desc.belief.community: "utworzyli zamknięte społeczności, które łączą tradycje kulturowe różnych wyznawców, w wyniku czego [reformed_faith.GetAdherentNamePluralNoTooltip] niechętnie akceptują osoby z zewnątrz."
 faith_creation.1001.desc.belief.pain: "nauczają, że ciało należy poskramiać poprzez niewygodę i ból, cierpienie bowiem oczyszcza duszę i zbliża wiernych do [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.iconoclasm: "domagają się obalenia i spalenia wszystkich posągów i ołtarzy poświęconych fałszywym bogom."
 faith_creation.1001.desc.belief.militant: "utrzymują, że wierni są przede wszystkim żołnierzami, którzy powinni szerzyć wiarę za pomocą miecza."
 faith_creation.1001.desc.belief.veneration: "czczą zmarłych świętych jako orędowników wiary, adorując ich relikwie i wzywając ich imiona w modlitwie."
 faith_creation.1001.desc.belief.sacraments: "wierzą, że łaskę można otrzymać wyłącznie z rąk wyświęconych kapłanów podczas świętych obrządków."
 faith_creation.1001.desc.belief.penance: "nauczają, że każda dusza rodzi się splamiona grzechem, który zmyć można wyłącznie poprzez spowiedź i pokutę."
 faith_creation.1001.desc.belief.christology: "rozwiązali fundamentalną zagadkę doktryny i ujęli boską naturę w koncepcji, do której wyznawania zobowiązani są wszyscy wierni."
 faith_creation.1001.desc.belief.rebirth: "utrzymują, że dusza związana jest z wielkim kołem życia, oraz że każdy żywot kształtowany jest przez czyny dokonane w poprzednim wcieleniu."
 faith_creation.1001.desc.belief.learning: "cenią naukę ponad niemalże wszystko inne, wierząc, że poznawanie świata zbliża człowieka do zrozumienia [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.law: "wyznają nade wszystko święte prawo i uważają, że doktryny należy przestrzegać w każdym, najdrobniejszym nawet aspekcie."
 faith_creation.1001.desc.belief.missionary: "przysięgli zanieść słowa wiary we wszystkie zakątki świata, ażeby żadna z dusz nie pozostała bez światła."
 faith_creation.1001.desc.belief.hierarchy: "nauczają, że wszystko ma swoje miejsce, a harmonia jest możliwa tylko wtedy, gdy wszystkie dusze szanują porządek ustanowiony wyżej."
 faith_creation.1001.desc.belief.charity: "wzywają wiernych, by na trud reagowali z miłością, otaczając troską ubogich, chorych i nieznajomych."
 faith_creation.1001.desc.belief.family: "uważają więzy rodzinne za święte i nauczają, że szanowanie pamięci przodków i wychowywanie licznego potomstwa samo w sobie stanowi akt oddawania czci."
 faith_creation.1001.desc.belief.sacred_sites: "na dowód wiary wznoszą potężne pomniki z kamienia, tworząc miejsca święte, które mają przetrwać wieki."
 faith_creation.1001.desc.belief.worldly: "praktykują przyziemne i pragmatyczne podejście do wiary, uznając, że pieniądze, kompromisy i zachowana w odpowiednich momentach cisza przysługują się jej równie skutecznie jak modlitwa."
 faith_creation.1001.desc.belief.syncretic: "łączą wierzenia sąsiednich ludów z własnymi, wierząc, że do tej samej prawdy można dojść na wiele sposobów."
 faith_creation.1001.desc.belief.fallback: "proszą wszystkich wyznawców, aby odłożyli na bok stare spory i zjednoczyli się dla dobra nowej wiary."
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip] postanowił[Select_CString( reformer.IsFemale, 'a', '' )] osobiście przewodzić rodzącemu się ruchowi, którego sedno stanowiła społeczność [reformed_faith.GetAdjectiveNoTooltip|l]. Przybierając odpowiedni tytuł, jako [reformed_faith.ReligiousHeadName], przekaże wyniosłe stanowisko swojemu następcy."
 faith_creation.1001.desc.temporal.personal: "\n\nPostanowił[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] osobiście stanąć na czele tego rodzącego się ruchu, którym główną rolę odgrywa społeczność [reformed_faith.GetAdjectiveNoTooltip|l]. Przybierając odpowiedni tytuł, jako [reformed_faith.ReligiousHeadName], przekażę zaszczytne stanowisko swoim następcom."
 faith_creation.1001.desc.spiritual: "\n\n[reformer.Custom('DefaultPriestTitlePlural')|U], których wyznaniem jest [reformed_faith.GetNameNoTooltip|l], zdecydowali: ich [reformed_faith.ReligiousHeadName|l] to teraz [reformed_hof.GetFirstNameNoTooltip]. Będzie [reformed_hof.GetSheHe] rozstrzygać wszystkie spory dotyczące wiary oraz kształtować obrządek tradycyjny. Względem obrządku tradycyjnego porównywane są wszystkie inne obrządki, których podstawą jest wiara [reformed_faith.GetAdjectiveNoTooltip|l]."
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformer.Custom('DefaultPriestTitlePlural')|U], których wyznaniem jest [reformed_faith.GetNameNoTooltip|l], zdecydowali: ich [reformed_faith.ReligiousHeadName|l] to nadal [reformed_hof.GetFirstNameNoTooltip]. W dalszym ciągu będzie [reformed_hof.GetSheHe] rozstrzygać wszystkie spory dotyczące wiary oraz kształtować obrządek tradycyjny. Względem obrządku tradycyjnego porównywane są wszystkie inne obrządki, których podstawą jest wiara [reformed_faith.GetAdjectiveNoTooltip|l]."
 faith_creation.1001.desc.no_head: "\n\nCzłonkowie rozwijającego się ruchu postanowili nie wyznaczać przywódcy religijnego. Chcą, by poszczególne obrządki wiązały się z własnymi naukami, a każdy [reformer.Custom('DefaultPriestTitle')|l] odpowiadał za własny dom wiary znany jako [reformed_faith.HouseOfWorship]."
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip|U] z niecierpliwością oczekują wypełnienia się proroctw o tym, że nadejdzie [reformed_faith.ReligiousHeadName|l], wielki przywódca, który zjednoczy wszystkich wiernych i sprawi, że [reformed_faith.GetNameNoTooltip|l] wkroczy w nowy złoty wiek."
 faith_creation.1001.o.frightened: "[ROOT.Char.GetFaith.random_GoodGodNames] to siła wyższa, która ocali nas od tych krwiożerczych bestii, jakimi są [second.Custom('GetUnbelieverNamePlural')]!"
 faith_creation.1001.o.heretical: "Ci heretycy zapłacą za swoje zbrodnie przeciwko sile wyższej, którą jest [ROOT.Char.GetFaith.HighGodName]!"
 faith_creation.1001.o.crusader: "Gdy rozpocznie się [ROOT.Char.GetFaith.GHWName|l], wtedy ci [second.Custom('GetUnbelieverNamePlural')] zobaczą, gdzie leży ich miejsce!"
 faith_creation.1001.o.interested: "Powinniśmy mieć oko na ten nowy twór…"
 faith_creation.1001.o.uninterested: "Nie ma znaczenia w co wierzą ci [second.Custom('GetUnbelieverNamePlural')]."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Zyskaj bezpłatne działania (#V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!), aby tworzyć, przyjmować lub porzucać [holy_sites|El], a także, aby obniżać lub podnosić ich rangę"
 faith_creation.1001.o.personal: "Świat zobaczy, że [ROOT.Char.GetFaith.HighGodName] nam sprzyja!"
 faith_creation.1002.t: "Oddzielony obrządek"
 faith_creation.1002.t.new_faith: "Nasza własna wiara"
 faith_creation.1002.desc.intro.founder: "Modlitwa za modlitwą, dogmat za dogmatem – uznawany przeze mnie obrządek o nazwie [old_rite.GetName|l] tak bardzo oddalił się od nauk, które głosi [old_faith.GetName|l], że nie ma już nic wspólnego z tą wiarą."
 faith_creation.1002.desc.intro.member: "Modlitwa za modlitwą, dogmat za dogmatem – uznawany przez nas obrządek o nazwie [old_rite.GetName|l] pod wodzą postaci znanej jako [founder.GetTitledFirstName] tak bardzo oddalił się od nauk, które głosi [old_faith.GetName|l], że nie ma już nic wspólnego z tą wiarą."
 faith_creation.1002.desc.intro.observer: "Modlitwa za modlitwą, dogmat za dogmatem – uznawany przez postać znaną jako [founder.GetTitledFirstName] obrządek [old_rite.GetName|l] tak bardzo oddalił się od nauk, które głosi [old_faith.GetName|l], że nie ma już nic wspólnego z tą wiarą."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName] ogłasza werdykt: zbuntowana grupa zostanie wygnana, a jej gałąź – oddzielona od korzeni."
 faith_creation.1002.desc.anathema.no_hof: "\n\n[old_faith.AltPriestTermPlural], których wyznaniem jest [old_faith.GetName|l], ogłaszają werdykt z każdego ołtarza: zbuntowana grupa zostanie wygnana, a jej gałąź – oddzielona od korzeni."
 faith_creation.1002.desc.new_head.personal: "Brzemię nadchodzących wydarzeń będzie dźwigać [new_faith.ReligiousHeadName|l] wiary znanej jako [new_faith.GetName|l] – a więc ja."
 faith_creation.1002.desc.new_head.founder: "Osoba, która im przewodziła, wciąż stoi na ich czele: [founder.GetFirstNameNoTooltip], [new_faith.ReligiousHeadName|l] wiary znanej jako [new_faith.GetName|l]."
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName] to teraz [new_faith.ReligiousHeadName|l] wiary znanej jako [new_faith.GetName|l]."
 faith_creation.1002.desc.new_head.none: "Nowe stado nie ma jednego pasterza. Jego [new_faith.AltPriestTermPlural|l] odpowiadają wyłącznie przed sobą."
 faith_creation.1002.desc.outro.new_faith: "\n\nNasza własna wiara, nasze własne prawo – jednak ten nowy płomień dopiero się tli, a ci, których wiarą jest [old_faith.GetName|l], mogą walczyć z nami mieczem i cenzurą."
 faith_creation.1002.desc.outro.old_faith: "\n\nWszystkie hrabstwa i serca, którym bliski był obrządek o nazwie [old_rite.GetName|l], odchodzą od wiary znanej jako [old_faith.GetName|l] za jednym zamachem. Nie jesteśmy już braćmi – być może wkrótce staniemy naprzeciw siebie w otwartej wojnie."
 faith_creation.1002.a: "Nasza własna wiara, nareszcie."
 faith_creation.1002.a.founder: "Ta droga zawsze należała do nas. Teraz mamy też nazwę."
 faith_creation.1002.b: "Heretycy, teraz i na wieki."
 faith_creation.1002.b.hof: "Pozwólmy im przekonać się, jak zimno jest z dala od stada."
 faith_creation.1002.consequences.tt: "[new_faith.GetName] to teraz zupełnie osobna [faith|El]:$EFFECT_LIST_BULLET$Wszyscy [followers|El] i wszystkie [counties|El] praktykujące dawny [rite|El] należą teraz do nowej wiary.\n$EFFECT_LIST_BULLET$[new_faith.GetName] i [old_faith.GetName|l] dzieli teraz [faith_hostility|El], co może skutkować [Concept('holy_wars', 'świętymi wojnami')|E].\n$EFFECT_LIST_BULLET$Wiary te nie mają już wspólnej [Concept('head_of_faith', 'głowy wiary')|E]"
 faith_creation.1002.a.free_holy_site_actions: "Wiara o nazwie [new_faith.GetName|l] zyskuje bezpłatne działania (#V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!) umożliwiające tworzenie, przyjmowanie lub porzucanie [Concept('holy_sites', 'miejsc świętych')|E], a także obniżanie lub podnoszenie ich rangi"
 faith_creation.1002.a.lost_ecumenism: "Wiara [new_faith.GetAdjective|l] traci doktrynę „[GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]”"
 faith_creation.1010.t: "Ogłoszon[Select_CString(HoF.IsFemale, 'a', 'y' )] [faith.ReligiousHeadName] [HoF.GetFirstNameNoTooltip] "
 faith_creation.1010.desc.start: "Chociaż słuszność naszej wiary nigdy nie była wątpliwa, to czas, który musieliśmy przetrwać bez duchowego przywódcy, był bardzo trudny. W końcu jednak ta męka się skończyła, ponieważ"
 faith_creation.1010.desc.temporal.personal: "Tylko ja mogę prawdziwie władać jako [faith.ReligiousHeadName|U]. [faith.AltPriestTermPlural|U] w końcu zgodzili się uznać ten fakt."
 faith_creation.1010.desc.temporal: "[faith.AltPriestTermPlural|U] zostali przekonani, aby [HoF.GetTitledFirstName] obj[Select_CString( HoF.IsFemale, 'ęła', 'ął' )] nowe zaszczytne stanowisko. Prawdziwy [faith.ReligiousHeadName|U] może być tylko jeden!"
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural|l] zebrali się, by zdecydować, kto stanie na ich czele. [faith.ReligiousHeadName], a zarazem osoba stojąca na straży obrządku tradycyjnego, to teraz [HoF.GetFirstName]."
 faith_creation.1010.desc.end: "\n\nTeraz, gdy wierni wreszcie zjednoczyli się wokół jednego przywódcy, wygląda na to, że [faith.GetNameNoTooltip|l] wkracza w złoty wiek."
 faith_creation.1010.desc.end.personal: "\n\nTeraz, gdy wierni wreszcie zjednoczyli się pod moim przywództwem, poprowadzę [faith.GetNameNoTooltip|l] w nowy złoty wiek!"
 faith_creation.1010.a: "[faith.HighGodName] to chwała!"
 faith_creation.1011.message.title: "Ustanowiono głowę wiary"
 faith_creation.1011.message.desc: "[faith.AltPriestTermPlural] ogłaszają, że [faith.ReligiousHeadName] [HoF.GetFirstName] zostaje [Concept('head_of_faith', 'głową')|E] ich wiary, którą jest [faith.GetName|l]"
 faith_creation.1021.t: "Obrządek wspólnoty"
 faith_creation.1021.t.founder: "Nasz własny obrządek"
 faith_creation.1021.desc.intro.founder: "Nasz nowy obrządek to teraz [new_rite.GetName|l]. Ci, którzy go praktykują, podążają za mną. Nadal określamy się jako [old_faith.GetAdherentNamePlural|l], ale obrządek o nazwie [source_rite.GetAdjective|l] już nas nie obowiązuje."
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName] wprowadza nowy obrządek w obrębie wiary znanej jako [old_faith.GetName|l]. Praktykujące go osoby mówią, że to [new_rite.GetName|l]. Nadal wyznają wiarę znaną jako [old_faith.GetName|l], ale czynią to zgodnie z własnym obrządkiem."
 faith_creation.1021.desc.divergence.minor: "\n\nObrządek o nazwie [source_rite.GetName|l] różni się od niego tylko w drobnych szczegółach. "
 faith_creation.1021.desc.divergence.moderate: "\n\nZwiązane z nim praktyki wydałyby się dziwne większości osób, którym bliski jest obrządek o nazwie [source_rite.GetName|l]. "
 faith_creation.1021.desc.divergence.major: "\n\nZwiązane z nim praktyki na tyle różnią się od tych, z których znany jest obrządek o nazwie [source_rite.GetNameNoTooltip|l], że ludzie są podejrzliwi. "
 faith_creation.1021.desc.differing.tenet: "Najbardziej rzucającą się w oczy różnicą jest dogmat „[differing_tenet.GetBaseName]”."
 faith_creation.1021.desc.differing.doctrine: "Najbardziej rzucającą się w oczy różnicą jest doktryna „[differing_doctrine.GetDescriptiveName]”."
 faith_creation.1021.desc.differing.fallback: "Nie ma takich praktyk, które uwydatniałyby ten podział."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nOdrzuciliśmy obrządek tradycyjny, według którego [old_faith.GetNameNoTooltip|l] ocenia wszystkie inne praktyki. Niech zwą to arogancją."
 faith_creation.1021.desc.outro.founder.branch: "\n\nJuż wcześniej byliśmy odgałęzieniem. Teraz jesteśmy niezależną wspólnotą, którą sami stworzyliśmy i za którą sami odpowiadamy."
 faith_creation.1021.desc.outro.observer: "\n\nNowe obrządki pojawiają się co jakiś czas. Czas pokaże, czy ten się przyjmie, czy też zaniknie lub zostanie okrzyknięty herezją."
 faith_creation.1021.a.founder: "Niech nowy obrządek cicho rozprzestrzenia się wśród wierzących."
 faith_creation.1021.b.founder: "Niech wszyscy o tym usłyszą."
 faith_creation.1021.a: "W żywej wierze jest miejsce dla wielu obrządków."
