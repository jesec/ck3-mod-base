l_polish:
 religious_decision.0001.t: "Adorcyzm"
 religious_decision.0001.desc: "[ROOT.Char.Custom('MyPriestTitle')] [realm_priest.GetFirstName] prowadzi mnie do spokojnej kotliny w pobliżu małego strumienia, gdzie miarowy szum spływającej po skałach wody tworzy relaksującą atmosferę.\n\n– Duchom się tu podoba, [ROOT.Char.GetFirstNameNoTooltip]. To najlepsze miejsce, by prosić je o pomoc.\n\n[realm_priest.GetFirstNameNoTooltip] unosi dwa przyniesione ze sobą kosze i dodaje: – Teraz musimy zdecydować, jaką zostawimy dla nich ofiarę."
 religious_decision.0001.desc_landless: "Wędrując przez odludzia z koszami, w których mam ofiarę dla duchów, szybko zauważam spokojny strumyk, wypływający z wejścia do jaskini.\n\nPowietrze wydaje się tutaj aż gęste od nadludzkiej obecności.\n\nNie wiedząc jednak, które z duchów są na miejscu, zastanawiam się nad zawartością moich koszy. Jaką ofiarę należy zostawić bytom?"
 religious_decision.0001.a: "Wielka ofiara z muszelek kauri, owoców i mirry."
 religious_decision.0001.b: "Tradycyjna libacja z ziarna i borassy."
 religious_decision.0001.c: "Ofiara? Phi! Czy moja obecność tutaj nie jest wystarczająca?"
 religious_decision.0001.d: "Po namyśle, nie przeszkadzajmy im…"
 religious_decision.0001.a.tt.1: "Duchy #P z pewnością zwrócą uwagę#! na tę ofertę"
 religious_decision.0001.a.tt.2: "To może przyciągnąć uwagę #Z potężnego ducha#! z różnymi konsekwencjami"
 religious_decision.0001.b.tt: "Duchy #P prawdopodobnie zwrócą uwagę#! na tę ofertę"
 religious_decision.0001.c.tt: "Duchy #N prawdopodobnie się obrażą#!, ale sama śmiałość może im #P zaimponować#!"
 religious_decision.0001.d.flavor: "Duchy są kapryśne. Najlepiej nie ryzykować ich zdenerwowania."
 religious_decision.0002.t: "Adorcyzm"
 religious_decision.0002.desc.start_offering: "[realm_priest.GetFirstName] wysypuje moją ofiarę na ziemię i zaczyna chodzić wokół niej w kółko."
 religious_decision.0002.desc.start_offering_alone: "Wysypuję swoją ofiarę na ziemię i zaczynam chodzić wokół niej."
 religious_decision.0002.desc.start_no_offering: "[realm_priest.GetFirstName] wpatruje się we mnie, zakłopotan[Select_CString( realm_priest.IsFemale, 'a', 'y' )]. „Oferujesz… siebie? To chyba działa…” – mówi, zaczynając chodzić wokół mnie w kółko."
 religious_decision.0002.desc.start_no_offering_alone: "Waham się przez chwilę, zastanawiając się nad tym, czy podarowanie duchom w ofierze jedynie siebie nie jest zbyt zuchwałe. A potem zaczynam chodzić w kółko, aby zacząć rytuał."
 religious_decision.0002.desc: "„Och duchy, wysłuchajcie mnie. Wzywam was, abyście udzielili pomocy zainteresowanym!” – śpiewa [realm_priest.GetFirstNameNoTooltip].\n\nZaczyna poruszać się coraz szybciej, tańczyć, jej ruchy stają się jeszcze bardziej szalone, a spływający pot lśni na [realm_priest.GetHerHis] twarzy. W końcu osiąga apogeum i ledwo kończąc taniec, upada na ziemię z wyczerpania."
 religious_decision.0002.desc_alone: "\n\n– Duchy, wysłuchajcie mnie. Uznajcie mą ofiarę i wesprzyjcie mnie w mojej prośbie! – wypowiadam słowa w głąb kotliny, w której zdążył już zapaść zmrok.\n\nKiedy tak chodzę w koło, nagle czuję, jak zalewa mnie przypływ energii. Czoło zraszają mi krople potu, a moje kończyny poruszają się jak oszalałe, wciąż szybciej i szybciej. Ruszam się, wiercę i #EMP kręcę#! – aż w końcu upadam na ziemię, ciężko dysząc."
 religious_decision.0002.desc.end_changed: "\n\nPo zakończeniu ceremonii czuję się nieco inaczej. Zmienion[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )] w jakiś sposób…"
 religious_decision.0002.desc.end_no_change: "\n\nKotlinę znów wypełnia cisza i spokój. Wszystko wydaje się dokładnie takie, jak przedtem."
 religious_decision.0002.shrewd: "Mój umysł nigdy nie był tak jasny!"
 religious_decision.0002.strong: "Co za energia! Co za wigor!"
 religious_decision.0002.good: "Co to za dziwne uczucie?"
 religious_decision.0002.bad: "To nie może być prawda…"
 religious_decision.0002.possessed: "Czuję się uwięzion[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )] we własnym ciele!"
 religious_decision.0002.no_change.zealous: "Czy w jakiś sposób obraził[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] duchy?"
 religious_decision.0002.no_change: "Co za strata czasu."
 religious_decision.0002.common_loot: "Duchy zostawiają po sobie pospolity drobiazg"
 religious_decision.0101.t: "Bhakti"
 religious_decision.0101.desc.start: "Koncepcję bhakti można przyrównać do czułości, oddania i uwielbienia, ale żadne z tych uczuć nie oddaje jej w pełni. Poświęcając się wcieleniom boskości, powierzam im ciało i duszę.\n\n[Select_CString(Or(ObjectsEqual(ROOT.Char.GetFaith.GetReligion, GetReligionByKey('hinduism_religion').MakeScope), ObjectsEqual(ROOT.Char.GetFaith.GetReligion, GetReligionByKey('buddhism_religion').MakeScope)), ROOT.Char.GetFaith.GetNameNoTooltip, GetFaithByKey('vaishnava_faith').GetNameNoTooltip)] koncentruje się na czci, której przedmiotem jest"
 religious_decision.0101.desc.generic: "tylko kilku z nich."
 religious_decision.0101.desc.sukhavati: "oświecona istota z Czystej Krainy, która wysłuchuje każdej modlitwy."
 religious_decision.0101.amitabha: "Amitabha, Budda Nieograniczonego Światła."
 religious_decision.0101.avalokiteshvara: "Awalokiteśwara, bodhisattwa uosabiający współczucie."
 religious_decision.0101.bhaisajyaguru: "Bhajszadźja, Budda Medycyny."
 religious_decision.0101.desc.vaishnavism: "różnych wcieleń Wisznu Obrońcy."
 religious_decision.0101.desc.shaivism: "wielu wcieleniach Śiwy Niszczyciela."
 religious_decision.0101.desc.smartism: "aspektach ostatecznej rzeczywistości."
 religious_decision.0101.desc.end: "Z tych aspektów jeden przemawia do mnie bardziej niż inne…"
 religious_decision.0101.ganga: "Ganga, bóg czystości i pokuty."
 religious_decision.0101.saraswati: "Saraswati, bogini nauki i sztuki."
 religious_decision.0101.kali: "Kali, bogini zniszczenia zła."
 religious_decision.0101.kubera: "Kubera, bóg bogactwa i sprawiedliwości."
 religious_decision.0101.lakishmi: "Lakszmi, bogini szczęścia i dobrobytu."
 religious_decision.0101.jagganath: "Dźagannath, Pan Wszechświata."
 religious_decision.0101.hayagriva: "Hajagriwa, bóg mądrości i wiedzy."
 religious_decision.0101.parvati: "Parwati, bogini płodności i piękna."
 religious_decision.0101.virabhadra: "Wirabhadra, bóg słusznego gniewu."
 religious_decision.0101.munishwarar: "Muniśwaran, bóg domu i rodziny."
 religious_decision.0101.dakshinamoorthy: "Dakszinamurti, bóg wszelkich form nauki."
 religious_decision.0101.ganesha: "Ganeśa, bóg mądrości i nowych początków."
 religious_decision.0101.vishnu: "Wisznu, bóg, który czuwa nad stworzeniem."
 religious_decision.0101.shiva: "Śiwa, bóg polujący na zło."
 religious_decision.0101.optout: "Nie jestem jeszcze gotow[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )] na podjęcie decyzji."
 religious_decision.0101.flavor: "Nie ma wstydu w czekaniu do momentu uzyskania pewności."
 religious_decision.0102.t: "Decyzja o wyborze bóstwa"
 religious_decision.0102.desc: "[Select_CString(ObjectsEqual(ROOT.Char.GetFaith.GetReligion, GetReligionByKey('germanic_religion').MakeScope), ROOT.Char.GetFaith.PantheonTerm, GetFaithByKey('norse_pagan').PantheonTerm)|U] to bóstwa niezliczone i niezgłębione, ale nie mogę powiedzieć, że nie ma wśród nich takich, które mają dla mnie szczególne znaczenie. Jeśli otwarcie poświęcę się oddawaniu czci jednemu z nich, z pewnością skupię wokół siebie ludzi o podobnych zapatrywaniach.\n\nBez względu na błogosławieństwa, jakie zapewnia mi mój patron, przebywanie tam, gdzie [Select_CString(ObjectsEqual(ROOT.Char.GetFaith.GetReligion, GetReligionByKey('germanic_religion').MakeScope), ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip, GetFaithByKey('norse_pagan').GetAdherentNamePluralNoTooltip)|l], może przynieść mi tylko zdrowie, bogactwo i chwałę."
 religious_decision.0102.odin: "Odyn, Wódz Asów!"
 religious_decision.0102.ullr: "Ullr, łowca i wojownik!"
 religious_decision.0102.tyr: "Tyr, Jednoręki Wojownik!"
 religious_decision.0102.thor: "Thor, Przyjaciel Ludzkości!"
 religious_decision.0102.freyr: "Frejr, Pan i Obrońca!"
 religious_decision.0102.optout: "$religious_decision.0101.flavor$"
 religious_decision.0102.flavor: "$religious_decision.0101.flavor$"
 religious_decision.0201.t: "Medytacja w odosobnieniu"
 religious_decision.0201.desc: "Wyruszenie w wewnętrzną podróż poprzez medytację nie jest rzeczą banalną. Wiele przygotowań będzie musiało być poczynionych, a najmniejszym z nich jest decyzja o tym, gdzie mam się wycofać.\n\nMiejsce, w którym zdecyduję się medytować, będzie miało duży wpływ na wynik mojej podróży."
 religious_decision.0201.home: "[ROOT.Char.Custom('ResidenceBuilding')|U] jest wystarczająco komfortowym miejscem."
 religious_decision.0201.plains: "Łagodne równiny krainy o nazwie [plains_location.GetNameNoTooltip]."
 religious_decision.0201.hills: "Faliste wzgórza krainy o nazwie [hills_location.GetNameNoTooltip]."
 religious_decision.0201.steppe: "Pod wielkim błękitnym niebem krainy o nazwie [steppe_location.GetNameNoTooltip]."
 religious_decision.0201.forest: "Zaciszne lasy krainy o nazwie [forest_location.GetNameNoTooltip]."
 religious_decision.0201.drylands: "Suchy busz krainy o nazwie [drylands_location.GetNameNoTooltip]."
 religious_decision.0201.mountains: "Odległe góry krainy o nazwie [mountains_location.GetNameNoTooltip]."
 religious_decision.0201.wetlands: "Cuchnące bagna krainy o nazwie [wetlands_location.GetNameNoTooltip]."
 religious_decision.0201.jungle: "Głośne dżungle krainy o nazwie [jungle_location.GetNameNoTooltip]."
 religious_decision.0201.desert: "Palący upał krainy o nazwie [desert_location.GetNameNoTooltip]."
 religious_decision.0201.optout: "Jestem zbyt zajęt[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )], aby medytować w tej chwili."
 religious_decision.0201.optout.flavor: "Nie ma pośpiechu. Świat nigdzie się nie wybiera."
 religious_decision.0201.difficulty.easy: "[tooltip_loc.GetName] to miejsce #P bezpieczne i sprzyjające#! medytacji"
 religious_decision.0201.difficulty.medium: "[tooltip_loc.GetName] to miejsce #Z umiarkowanie sprzyjające#! medytacji"
 religious_decision.0201.difficulty.hard: "[tooltip_loc.GetName] to miejsce #N niebezpieczne i niesprzyjające#! medytacji"
 religious_decision.0201.stress: "Bardziej prawdopodobne jest, że stracę [stress|el] w tym miejscu"
 religious_decision.0201.trait: "Bardziej prawdopodobne jest, że zyskam wgląd osobisty w tym miejscu"
 religious_decision.0201.learning: "Bardziej prawdopodobne jest, że zyskam wgląd teologiczny w tym miejscu"
 religious_decision.0210.toast: "Rozpoczynasz medytację"
 religious_decision.0211.t: "$religious_decision.0201.t$"
 religious_decision.0211.desc.beginning.home: "Wycofując się w zaciszu swoich komnat, rozpoczął[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] dłuższy okres postu i medytacji."
 religious_decision.0211.desc.beginning.plains: "Podczas mojej wędrówki na szerokie równiny obszaru o nazwie [meditation_location.GetName] mój umysł jest nieskrępowany i wolny."
 religious_decision.0211.desc.beginning.hills: "Dalekie widoki ze szczytów wzgórz obszaru o nazwie [meditation_location.GetName] zachęcają do zadumy."
 religious_decision.0211.desc.beginning.steppe: "Pod wielkim, otwartym niebem stepu w obszarze o nazwie [meditation_location.GetName] mój umysł jest nieskrępowany i wolny."
 religious_decision.0211.desc.beginning.forest: "Po przybyciu do dzikich lasów obszaru o nazwie [meditation_location.GetName] odkrywam spokojną polanę, na której mogę medytować."
 religious_decision.0211.desc.beginning.drylands: "Suche powietrze buszu w obszaru o nazwie [meditation_location.GetName] wypełnia moje płuca i oczyszcza skórę."
 religious_decision.0211.desc.beginning.mountains: "Rzadkie górskie powietrze obszaru o nazwie [meditation_location.GetName] przenika moje myśli, pozwalając mi skupić się na własnym wnętrzu."
 religious_decision.0211.desc.beginning.wetlands: "Wilgotne powietrze mokradeł obszaru o nazwie [meditation_location.GetName] sprawia, że moje ubrania przyklejają mi się do skóry. Siadam i zaglądam w głąb swojej duszy."
 religious_decision.0211.desc.beginning.jungle: "Bzyczące owady i śpiewające ptaki wypełniają dżunglę obszaru o nazwie [meditation_location.GetName], stanowiąc niecichnące tło dla moich prób wejrzenia w głąb mej duszy."
 religious_decision.0211.desc.beginning.desert: "Prażąc się w gorącym pustynnym słońcu obszaru o nazwie [meditation_location.GetName], spoglądam w głąb siebie, szukając lepszego zrozumienia dla mojego miejsca we wszechświecie."
 religious_decision.0211.desc.result.impatient: "\n\nSzybko jednak zacz[Select_CString( ROOT.Char.IsFemale, 'ęłam', 'ąłem' )] się niecierpliwić, bo niezależnie od tego, jak nieruchomo siedział[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] i jak bardzo się starał[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )], nie mogł[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] poczuć nic poza nudą."
 religious_decision.0211.desc.result.secret: "\n\nNiestety nie mogł[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] przestać myśleć o mrocznych sekretach, które skrywam. Co by się stało, gdyby świat się o nich dowiedział? Zajęt[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )] takimi myślami nie mogł[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] zaznać spokoju."
 religious_decision.0211.desc.result.hungry: "\n\nWkrótce jednak ogarnął mnie głód i zdał[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] sobie sprawę, że zabrany przeze mnie prowiant jest żałośnie niewystarczający. Pozostałe dni mojej wyprawy wypełniło poszukiwanie pożywienia w dziczy, nie pozostawiając zbyt wiele czasu na rozmyślania."
 religious_decision.0211.desc.result.thirsty: "\n\nZaraz potem zaczęły mi pękać wargi i rosnąć pragnienie, którego nie będę w stanie długo zaspokoić przy pomocy wody znajdującej się bukłaku. Szybko zdał[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] sobie sprawę, że będę musiał[Select_CString( ROOT.Char.IsFemale, 'a', '' )] schronić się, aby przetrwać upał, jednakże karczma, którą znalazł[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )], była zbyt zajęta, abym m[Select_CString( ROOT.Char.IsFemale, 'ogła', 'ógł' )] znaleźć ciszę i spokój, których tak bardzo potrzebował[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )]."
 religious_decision.0211.desc.result.headache: "\n\nNiestety, wkrótce zacz[Select_CString( ROOT.Char.IsFemale, 'ęłam', 'ąłem' )] odczuwać silny ból głowy, który nie ustępował. Wkrótce nie był[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] w stanie myśleć o niczym innym, jak tylko o bólu."
 religious_decision.0211.desc.result.distraction: "\n\nNiestety, niekończąca się kakofonia stale mnie rozpraszała, a rosnąca irytacja była dla mnie przeszkodą psychiczną, której nie mogł[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] pokonać."
 religious_decision.0211.desc.result.minor_stress: "\n\nBez brzemienia banalnych trosk, jakie niesie ze sobą [ROOT.Char.Custom('GetCourt')] i jego codzienne życie, wkrótce odkrywam, że spędzam coraz więcej czasu, po prostu ciesząc się prostymi przyjemnościami życia."
 religious_decision.0211.desc.result.medium_stress: "\n\nOddalenie od miejsca zamieszkania było dobrodziejstwem i pozwoliło mi odpocząć od codziennych problemów, z którymi zwykle borykam się na moich włościach."
 religious_decision.0211.desc.result.major_stress: "\n\nBędąc daleko na pustkowiu, w odosobnieniu, stwierdzam, że problemy, które ciążyły mi w miejscu, którym jest mój [ROOT.Char.Custom('GetCourt')], nie mają już żadnego znaczenia. Po raz pierwszy od zdecydowanie zbyt dawna czuję spokój."
 religious_decision.0211.desc.result.reflection: "\n\nPatrząc w głąb siebie, zdał[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] sobie sprawę, że moje życie było płytkie i niedoskonałe, skażone niezdrowymi pragnieniami. Po powrocie z podróży stwierdził[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )], że te rzeczy nie są już tak atrakcyjne jak kiedyś."
 religious_decision.0211.desc.result.epiphany: "\n\nMedytując w samotności, nagle doznał[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] objawienia. Obecność człowieka w świecie i to, jak wpisujemy się w naturalny porządek… Kolejny element uniwersalnej układanki trafił na swoje miejsce!\n"
 religious_decision.0211.desc.result.fugue: "\n\nPo wielu dniach zauważył[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )], że popadam w stan fugi, całkowicie tracąc poczucie własnego ja. Niezwiązan[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )] przez pragnienia i uprzedzenia, zobaczył[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] prawdę wszechświata zapisaną w samej tkance otaczającego mnie świata. Mogł[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] widzieć wszystko… rozumieć wszystko… wszechświat i ja, jako jedność.\n\nW końcu wrócił[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] do swojego starego ja, choć wciąż pamiętam fragmenty tego, czego nauczył[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] się w transie."
 religious_decision.0211.a.critical_success: "To doświadczenie zostanie ze mną na zawsze."
 religious_decision.0211.a.success: "Cieszę się, że poświęcił[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] na to czas."
 religious_decision.0211.a.failure: "Niestety…"
 religious_decision.0211.experience: "Poprawiasz swoje umiejętności medytacji"
 religious_decision.0291.toast: "Kończysz medytację"
 religious_decision.0302.t: "Niebiański pogrzeb"
 religious_decision.0302.desc.wilderness: "Zgodnie z tradycją mała grupa z miejsca, którym jest mój [ROOT.Char.Custom('GetCourt')], udaje się na pustkowie, gdzie [ROOT.Var('ancestor_to_bury').Char.GetFirstName] otrzyma godny pochówek.\n\nNie mija dużo czasu, zanim padlinożerne ptaki, zauważywszy procesję, zaczynają krążyć nad głowami żałobników. Chętnie, ale cierpliwie czekają, aż wypowiemy ostatnie słowa i odejdziemy, pozwalając im sfrunąć na ucztę."
 religious_decision.0302.desc.zoroastrian: "Aby uniknąć splamienia przez demona zwłok Nasu, nie wolno mi przebywać w wieży milczenia, gdzie ciało [ROOT.Var('ancestor_to_bury').Char.GetFirstName] zostanie oczyszczone.\n\nZamiast tego, specjalnie przeszkoleni w obchodzeniu się ze zmarłymi [ROOT.Char.GetFaith.PriestNeuterPlural] przenieśli ciało na szczyt wieży.\n\nPo pewnym czasie [ROOT.Char.GetFaith.PriestNeuterPlural] wracają: „Wszystko gotowe, [Select_CString(ROOT.Char.IsFemale, 'moja pani', 'mój panie' )]. Teraz padlinożerne ptaki pożrą [ROOT.Var('ancestor_to_bury').Char.GetHerHis] ciało, a promienie słoneczne wybielą [ROOT.Var('ancestor_to_bury').Char.GetHerHis] kości”."
 religious_decision.0302.a: "Spoczywaj w pokoju, [ROOT.Char.Custom2('RelationToMeVocative', ROOT.Var('ancestor_to_bury').Char)]."
 religious_decision.0401.t: "Wróżenie z gwiazd"
 religious_decision.0401.desc.beginning: "Spędził[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] wiele nocy patrząc w gwiaździste niebo, śledząc ruchy ciał niebieskich.\n\nZ czasem zauważył[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )] pewien wzór, a po wielu dniach analiz jestem teraz pewn[Select_CString( ROOT.Char.IsFemale, 'a', 'y' )] swoich przewidywań. Znaki są jasne –"
 religious_decision.0401.desc.great_battle: "czeka mnie wielka bitwa."
 religious_decision.0401.desc.new_friends: "nadszedł czas, aby uleczyć stare rany i nawiązać nowe przyjaźnie."
 religious_decision.0401.desc.hard_work: "ciężka praca doprowadzi mnie w przyszłości do wielkiej fortuny."
 religious_decision.0401.desc.betrayal: "moi sprzymierzeńcy nie są tymi, za których ich uważał[Select_CString( ROOT.Char.IsFemale, 'am', 'em' )]."
 religious_decision.0401.desc.new_beginnings: "jest to czas na nowe początki i przejrzyste umysły."
 religious_decision.0401.a: "Ciekawe, co jeszcze przyniesie przyszłość?"
 religious_decision.0501.t: "[ROOT.Char.GetTitleAsNameNoTooltip] i wiara [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|l]"
 religious_decision.0501.desc: "Od pokoleń szlachta z ziem znanych jako [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] wyznaje [ROOT.Char.GetFaith.GetNameNoTooltip|l], lecz lokalne społeczności opowiadają się raczej za pluralizmem religijnym opartym na kulcie tamtejszych bożków. Wskutek przywrócenia najwyższego kapłaństwa [ROOT.Char.GetFaith.ReligiousHeadTitleName] [ROOT.Char.GetFaith.ReligiousHeadName] nalega jednak, by zaprzestano tych pogańskich praktyk. Żąda przy tym, by wszyscy, którzy przysięgają wierność chanowi, przysięgali również wierność Bogu oraz oddawali mu cześć we właściwy sposób.\n\nJako [ROOT.Char.GetTitleAsNameNoTooltip] mam prawo decydować o przyszłości wiary, jaką praktykują poddani na moich ziemiach, gdyż przyszłość Stepu zależy od mojego słowa."
 religious_decision.0501.a: "Dobr[Select_CString(ROOT.Char.IsFemale, 'a', 'y' )] [ROOT.Char.GetTitleAsNameNoTooltip|l] pozwala swoim ludziom wierzyć w co chcą."
 religious_decision.0501.b: "Być może umiarkowana reforma zadowoliłaby obie strony."
 religious_decision.0501.c: "Wiara [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l] musi być niesiona całemu światu!"
 religious_decision.0501.jewish.tt: "Każdy żydowski [vassal|El]"
 religious_decision.0501.nonjewish.tt: "Każdy nieżydowski [vassal|El]"
 religious_decision.0501.diff_culture.tt: "Każdy [vassal|El] należący do innej [Concept('culture', 'kultury')|E]"
 can_never_reform_kuzarism_tt: "[GetFaithByKey('kabarism').GetName] zachowa swoje dotychczasowe dogmaty na stałe."
 religious_decision.0502.t: "[khazar_khan.GetTitleAsNameNoTooltip] i wiara [khazar_khan.GetFaith.GetAdjectiveNoTooltip|l]"
 religious_decision.0501.d: "[ROOT.Char.GetFaith.GetNameNoTooltip] to jedyna słuszna wiara, a [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] to posłańcy [ROOT.Char.GetFaith.HighGodNamePossessive]."
 religious_decision.0502.desc.intro: "Szlachta z ziem znanych jako [khazar_khan.GetPrimaryTitle.GetNameNoTierNoTooltip] od pokoleń wyznawała [ROOT.Char.GetFaith.GetNameNoTooltip|l], ale w społecznościach zamieszkujących ziemie o nazwie [khazar_khan.GetPrimaryTitle.GetNameNoTierNoTooltip] powszechny jest pluralizm religijny uznający istnienie lokalnych bogów."
 religious_decision.0502.desc.body: "Jednak od niedawna [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip|l] przypomina raczej pole bitwy, na którym [khazar_khan.GetTitleAsNameNoTooltip|l] oraz rabini w państwie toczą gorącą debatę na temat natury wierzeń ludowych i niewiernych.\n\nJednak [khazar_khan.GetTitleAsNameNoTooltip|l] podj[Select_CString(khazar_khan.IsFemale, 'ęła', 'ął' )] decyzję. "
 religious_decision.0502.desc.righteous: "Na mocy królewskiego dekretu ci, którzy nadal wyznają stare zwyczaje, zostaną pozbawieni przywilejów, które zapewnia [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip|l], a ci, którzy twierdzą, że [khazar_khan.GetTitleAsNameNoTooltip] dzierży nad nimi władzę, muszą też przysiąc wierność istocie wyższej, którą znamy jako [khazar_khan.GetFaith.HighGodName]."
 religious_decision.0502.desc.fundamentalist: "Nie tylko kończy się pluralizm religijny, lecz także [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] uznaje wszystkich niepraktykujących naszej ortodoksyjnej wiary za swojego wroga. [khazar_khan.GetTitleAsNameNoTooltip|U] pragnie rozprzestrzenić [khazar_khan.GetFaith.GetNameNoTooltip] na całym stepie i poza nim, ogłaszając, że wszyscy prawdziwi [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] powinni przyłączyć się do tej nowej ery wojen religijnych."
 religious_decision.0502.a: "[ROOT.Char.GetFaith.GetNameNoTooltip] czekają prawdziwie mroczne czasy"
 religious_decision.0502.b: "Najwyższy czas!"
 religious_decision.0503.t: "Język hebrajski"
 religious_decision.0503.desc: "[hebrew_language_adopter_scope.GetName] – rządząc ogromnym państwem żydowskim, przyczyniając się do tego, że kultura [hebrew_language_adopter_scope.GetCulture.GetName|l] jest silniejsza niż kiedykolwiek – ustanawia, że hebrajski staje się oficjalnym językiem państwowym i liturgicznym ludu tej kultury!\n\nHebrajski od tysiącleci jest językiem liturgicznym wiary żydowskiej, ale odkąd [hebrew_language_adopter_scope.GetNameNoTooltip] panuje nad żydowską większością, potrzeba używania innych języków w życiu codziennym maleje. Chociaż nie wszyscy obywatele praktykują obecnie żydowską wiarę, może się to zmienić już w ciągu jednego pokolenia bądź dwóch."
 religious_decision.0503.a.jewish: "L’chaim!"
 religious_decision.0503.a.non_jewish: "Lepiej zacząć się przyzwyczajać."
 religious_decision.0503.b: "Nigdy nie opanuję tego dziwnego języka!"
 religious_decision.0601.t: "Podział ummy: [founder.GetFaith.ReligiousHeadTitleName|U]"
 religious_decision.0601.desc: "Bez #EMP prawdziwego#! przywództwa jesteśmy zgubieni.\n\nOdkąd [old_caliph.GetTitledFirstName] piastuje to stanowisko, [founder.GetFaith.GetAdherentNamePlural] cierpią z powodu [old_caliph.GetHerHis] niezdolności do doradzania, rządzenia i wymierzania sprawiedliwości.\n\nZ bólem serca i poparciem części z najbardziej wpływowych duchownych oświadczył[Select_CString(founder.IsFemale, 'am', 'rm' )], że niestrudzoną wolą [founder.GetFaith.HighGodNamePossessive] jest, abym przej[Select_CString(founder.IsFemale, 'ęła', 'ął' )] urząd, jaki sprawuje [founder.GetFaith.ReligiousHeadTitleName|l].\n\nMoi następcy i ja będziemy ją dzierżyć ten tytuł od teraz do Dnia Sądu Ostatecznego, a pod moją twardą ręką prawdziwie wierzący będą prosperować!"
 religious_decision.0601.a: "Niosę teraz to ciężkie brzemię…"
 religious_decision.0601.b: "Ha, bierz #EMP to#!, [old_caliph.GetFirstNameNoTooltip]."
 religious_decision.0601.tt.some_rulers_converted_away: "[THIS.Var('schismed_caliphate_major_ruler_converted_count').GetValue|0] [Concept( 'rulers', 'władców' )|E] nawróci się w w proteście na [old_caliph.GetFaith.GetName|l]"
 religious_decision.0601.tt.all_rulers_stayed: "Żaden z głównych [Concept( 'rulers', 'władców' )|E], wyznających [founder.GetFaith.GetName|l] nie nawróci się w proteście na [old_caliph.GetFaith.GetName|l] "
 religious_decision.0602.t: "$religious_decision.0601.t$"
 religious_decision.0602.desc: "[founder.GetFirstName] nie ukrywał[Select_CString(founder.IsFemale, 'a', '' )], że nie podoba [Select_CString(founder.IsFemale, 'jej', 'mu' )] się sposób, w jaki [old_caliph.GetFaith.ReligiousHeadName|l] [old_caliph.GetTitledFirstName] sprawuje swój święty urząd, ale wątpię, by ktokolwiek myślał, że posunie się do #EMP tego#!.\n\n[Select_CString(founder.IsFemale, 'Ta wariatka zebrała', 'Ten szaleniec zebrał' )] wystarczające poparcie, by #EMP ogłosić się#! głową wiary i zasiąść jako [founder.GetFaith.ReligiousHeadName|l], rozbijając ummę!\n\nCo niepokojące, zwykli ludzie w dużej mierze zaakceptowali tę decyzję jako część machinacji swoich przełożonych. Jako [Select_CString(ROOT.Char.IsFemale, 'ta, która', 'ten, który' )] prowadzi [founder.GetFaith.GetName|l], muszę zadecydować, czy moje państwo podporządkuje się, czy też będzie się sprzeciwiać."
 religious_decision.0602.a: "[founder.GetTitledFirstNameNoTooltip] z pewnością okaże się godn[Select_CString(founder.IsFemale, 'a', 'y' )]."
 religious_decision.0602.a.tt: "Spokojnie zadomawiasz się z nowym porządkiem"
 religious_decision.0602.b: "Moja lojalność względem osoby znanej jako [old_caliph.GetTitledFirstNameNoTooltip] jest niezachwiana!"
 religious_decision.0602.c: "Ludzie wydają się być zdesperowani, by znaleźć prawdziwego przywódcę…"
 fp2_opportunistic_schismatic_modifier: "Oportunistyczny schizmatyk"
 fp2_opportunistic_schismatic_modifier_desc: "Ta postać jest na drodze ku objawieniu…"
 religious_decision.0603.t: "$religious_decision.0601.t$"
 religious_decision.0603.desc: "Ostatnio [founder.GetFirstName] i [old_caliph.GetShortUINameNotMeNoFormat] spierali się ze sobą, ale [founder.GetFirstNameNoTooltip] eskalował[Select_CString(founder.IsFemale, 'a', '' )] konflikt do niespotykanych rozmiarów.\n\nZ poparciem wielu czołowych duchownych [founder.GetFaith.GetName], [founder.GetFirstNameNoTooltip] z powodzeniem ogłosił[Select_CString(founder.IsFemale, 'a', '' )] się jako #EMP prawdziw[Select_CString(founder.IsFemale, 'a', 'y' )]#! [founder.GetFaith.ReligiousHeadName|l] swojej wiary, sprawiając, że [old_caliph.GetShortUINameNotMeNoTooltipNoFormat] stracił[Select_CString(old_caliph.IsFemale, 'a', '' )] autorytet nad tymi, którzy porzucili [old_caliph.GetFaith.GetName|l].\n\nWielu z bardziej wspólnotowo myślących muzułmanów na świecie otwarcie płacze na widok kolejnego rozłamu w ummie."
 religious_decision.0603.a: "Diabeł! Łajda[Select_CString(founder.IsFemale, 'czka', 'k' )]! Bluźnierc[Select_CString(founder.IsFemale, 'zyni', 'a' )]!"
 religious_decision.0603.b: "[old_caliph.GetTitledFirstNameNoTooltip] nie potrafi utrzymać porządku we własnym domu…"
 religious_decision.0603.c: "Ha! Co za dramat!"
 natural_primitivism.0001.t: "Wyzwolenie dworu"
 natural_primitivism.0001.desc.decree.council: "Niniejszym ogłaszam przed radą jednoznaczny dekret – próżne popisy rangą i źle pojęty wstyd nie będą już władać w tych salach!"
 natural_primitivism.0001.desc.decree.court: "Niniejszym ogłaszam przed dworem jednoznaczny dekret – próżne popisy rangą i źle pojęty wstyd nie będą już władać w tych salach!"
 natural_primitivism.0001.desc.reaction.supportive: " [naturism_councillor.GetTitledFirstName], prosty i niewinny człowiek, przyjmuje moje słowa z nieskrywaną radością.\n\nPrzed końcem dnia ceremoniał odchodzi w niepamięć. Stare zwyczaje ustępują miejsca nowym."
 natural_primitivism.0001.desc.reaction.ashamed: " [naturism_councillor.GetTitledFirstName], osoba nieszczęśliwa w swej pruderii, z niepokojem jąka się i bełkocze.\n\nA jednak, przed końcem dnia, ceremoniał odchodzi w niepamięć. Stare zwyczaje ustępują miejsca nowym."
 natural_primitivism.0001.desc.reaction.dissent: " Niektórzy ośmielają się sprzeciwiać, trzymając się kurczowo przyziemnych atrybutów i bojąc się nagiej prawdy.\n\nA jednak, przed końcem dnia, ceremoniał odchodzi w niepamięć. Stare zwyczaje ustępują miejsca nowym."
 natural_primitivism.every_adult_courtier: "Każdy dorosły dworzanin"
 natural_primitivism.0001.a: "Niech dworzanie będą tacy, jakimi ich stworzono."
 natural_primitivism.0001.a.flavor: "Jakiż jest pożytek z dworskich popisów w obliczu świętej wolności?"
 natural_primitivism.0002.t: "Powrót do porządku dworskiego"
 natural_primitivism.0002.desc.reluctant: "Dwór zaczął się nieco… za bardzo obnosić ze swoją nagą cnotą. Nawet [naturism_councillor.GetTitledFirstName] – osoba, która niegdyś skromnie wyznawała świętą prostotę – teraz obnosi się ze swoim ciałem i narzuca się innym nabrzmiałymi przymiotami naszych zwyczajów. Tak – nawet nadzy jesteśmy zepsuci przez próżność. Nie taki był zamysł [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nTeraz znów jesteśmy odziani we wstyd i dobrze, że się tak stało."
 natural_primitivism.0002.desc.relieved: "Dwór zaczął się nieco… za bardzo obnosić ze swoją nagą cnotą. Po wyswobodzeniu się przeze mnie z dawnych przekonań [naturism_councillor.GetTitledFirstName] – osoba, która odczuła z tego powodu największą ulgę – zadbała o to, aby dwór został na nowo przybrany.\n\nTeraz znów jesteśmy odziani we wstyd i dobrze, że się tak stało."
 natural_primitivism.0002.desc.no_councillor: "Dwór zaczął się nieco… za bardzo obnosić ze swoją nagą cnotą. W salach unosi się mdląco słodki zapach erotyzmu i sensualnych rozkoszy przytępiający nasze naturalne zmysły. Tak – nawet nadzy jesteśmy zepsuci przez próżność. Nie taki był zamysł [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nTeraz znów jesteśmy odziani we wstyd i dobrze, że się tak stało."
 natural_primitivism.0002.a: "Na dworze znów zapanuje porządek."
 natural_primitivism.0002.a.flavor: "Dość już skorzystali na moim dekrecie."
 natural_primitivism.0003.t: "Dworski przykład"
 natural_primitivism.0003.desc: "[naturism_liege.GetTitledFirstName] ogłasza nowy porządek w swoim dworze: dworzanie mają odrzucić rangi, pozory i powściągliwość, występując otwarcie jako ludzie prości, zgodnie z jego żądaniem.\n\nOczekiwania są jasne. Jeśli nie pójdę za [naturism_liege.Custom('PL_jego_jej')] przykładem, ukarze mnie chłodem."
 natural_primitivism.0003.a: "Podporządkuję się."
 natural_primitivism.0003.a.flavor: "Przyjęcie dworskiego przykładu to też korzystanie z wolności."
 natural_primitivism.0003.b: "Zachowam godność."
 natural_primitivism.0003.b.flavor: "Nikt inny nie ma prawa decydować o mojej godności."
 natural_primitivism.0003.b.tt: "[naturism_liege.GetTitledFirstName] traci #N 20#! punktów [Concept('opinion', 'opinii')|E] na twój temat. Dorośli dworzanie, którzy akceptują lub popierają ten dworski porządek, tracą #N 5#! punktów [Concept('opinion', 'opinii')|E] na twój temat."
 religious_decision.0901.t: "$visit_genizah_decision$: [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 religious_decision.0901.desc: "Wita mnie [priest.Custom('MyPriestTitle')] [priest.GetName] z miejscowego domu modlitwy, którym jest [ROOT.Char.GetFaith.HouseOfWorship]. Pokazuje mi [Glossary( 'genizę', 'genizah_GLOSS' )], nie interesując się za bardzo moimi zamiarami.\n\nWchodzimy do słabo oświetlonego pomieszczenia. W powietrzu unosi się smród stęchłego atramentu, a przy gołych ścianach piętrzą się ogromne stosy starych papierów.\n\nWszelkiego rodzaju dokumenty – od prywatnych listów po dokumenty prawne – czekają tu w ciszy, a brązowiejący papier zwija się i kruszy."
 religious_decision.0901.a: "To prawdziwa skarbnica dziedzictwa religijnego."
 religious_decision.0901.b: "Tyle tu korespondencji, tyle transakcji."
 religious_decision.0901.c: "Wszyscy ci ludzie, wszystkie te życia…"
 religious_decision.0901.learning: "Mam większą szansę lepiej zrozumieć tajniki teologiczne"
 religious_decision.0901.stewardship: "Mam większą szansę lepiej zrozumieć tajniki prowadzenia interesów"
 religious_decision.0901.personal: "Mam większą szansę lepiej zrozumieć siebie"
 religious_decision.0911.knowledge: "Poszerzasz swoją wiedzę na temat [Glossary( 'genizy', 'genizah_GLOSS' )] z miejsca znanego jako [THIS.Char.GetCapitalLocation.GetNameNoTooltip]"
 religious_decision.0911.t: "$religious_decision.0901.t$"
 religious_decision.0911.desc.beginning: "Wybieram stos, siadam obok niego, a [priest.Custom('MyPriestTitle')] zostawia mnie przy mojej pracy.\n\nOstrożnie przeglądając dokumenty, zdmuchuję grube warstwy kurzu i przebiegam wzrokiem po wyblakłych hebrajskich literach każdego z delikatnych rękopisów w poszukiwaniu interesujących fragmentów."
 religious_decision.0911.desc.result.stress_loss: "\n\nMoją uwagę przyciąga fragment korespondencji – jakaś umęczona dusza wylała na kartkę papieru lata zmartwień. Gdy w końcu go składam, moje własne troski wydają się lżejsze."
 religious_decision.0911.desc.result.penmanship: "\n\nWśród rachunków i petycji znajduję list, którego pismo jest tak eleganckie, że każda kreska koi moje serce, a ja już wyobrażam sobie, jak ta gracja mogłaby zmiękczyć moje własne słowa."
 religious_decision.0911.desc.result.business: "\n\nStos ksiąg rachunkowych na pierwszy rzut oka wydaje się nudny, dopóki na marginesach nie dostrzeże się zwięzłych notatek kupca dotyczących kredytów, przysług i terminów. Za kolumnami liczb kryje się lekcja, jak sprawić, by każde zobowiązanie przyniosło podwójną korzyść."
 religious_decision.0911.desc.result.seduction: "\n\nWśród surowych notatek prawnych kryje się prywatna korespondencja napisana z niebezpieczną powściągliwością. Każda linijka niewiele obiecuje, jeszcze mniej zdradza, a mimo to sprawia, że odbiorca pochyla się nad nią bliżej."
 religious_decision.0911.desc.result.theology: "\n\nOdkrywam zniszczony fragment, na którym gęste notki na marginesach cierpliwie polemizują z autorytetami, które już dawno obróciły się w proch. Spór ten jest stary, ale kwestia, wokół której się on kręci, wydaje mi się zupełnie nowa."
 religious_decision.0911.desc.result.expertise: "\n\nPęczek dokumentów przewozowych i listów handlowych został zebrany w jedną całość przez jakiegoś zapomnianego pragmatyka. Z listy cen, portów i towarów wyłaniają się pewne wzorce, które zamieniają suche zapisy w mapę opłacalnych tras."
 religious_decision.0911.desc.result.secret: "\n\nJeden złożony list ukryto w innym, jakby jego właściciel obawiał się nawet panującej w genizie ciszy. Jego ostrożne uniki ustępują miejsca wyznaniu, które nigdy nie było przeznaczone dla oczu osoby żyjącej."
 religious_decision.0911.desc.result.reflection: "\n\nNotatka pokutnika sprawia, że zamieram z wrażenia – nie chodzi tu o wielką niegodziwość, lecz o jasny opis drobnych uchybień, którym się ulegało, aż weszły one w nawyk. Wstyd płynący z tych słów jest dotkliwy i niepokojąco trafny."
 religious_decision.0911.desc.result.piety_1: "\n\nPrzewracam kartkę, a moją uwagę przyciąga niepozorny list. Dawno już nieżyjący człowiek zwraca się do osoby duchownej z prośbą o radę, ponieważ waha się w swojej wierze w obliczu licznych bolesnych cierpień…"
 religious_decision.0911.desc.result.piety_2: "\n\nMiędzy umowami znajduję modlitwę spisaną tak, że ostatnie zapiski wydają się drżeć. Ktokolwiek jest autorem, brakowało mu pewności, a jednak ostatnie wersy trzymają się [ROOT.Char.GetFaith.HighGodNamePossessive] z upartą, bolesną nadzieją."
 religious_decision.0911.desc.result.piety_3: "\n\nW podartej opinii prawnej rozważa się, czy dusza obciążana grzechem może trafić do chwały [ROOT.Char.GetFaith.HighGodNamePossessive]. Odpowiedź jest wyczerpująca i niełatwa, a ja czytam ją więcej niż raz."
 religious_decision.0911.desc.result.impatient: "\n\nPrzeglądam wiele stron pełnych zawiłych wywodów, z których każdy jest bardziej zagmatwany od poprzedniego. Im bardziej staram się wydobyć sens z atramentu, tym bardziej ten stos wydaje się rosnąć w moich rękach."
 religious_decision.0911.desc.result.lazy: "\n\nNa początku obiecuję sobie, że kolejna strona ujawni coś wartościowego. Potem jednak skaczę od imienia do imienia, wertuję orzeczenia i obserwuję, jak kurz leniwie unosi się w promieniach światła."
 religious_decision.0911.desc.result.unlucky: "\n\nGdy tylko obiecujący stos zaczyna zdradzać swoje sekrety, krucha nić, która go spaja, pęka. Strony wysuwają się, rozsypują we wszystkich kierunkach i mieszają z niepowiązaną z nimi stertą papierów, aż w tym bałaganie niknie jakikolwiek przydatny trop."
 religious_decision.0911.a.success: "To było oczywiste, że warto będzie się temu przyjrzeć!"
 religious_decision.0911.a.skill: "Jest jeszcze tyle rzeczy, których można się nauczyć…"
 religious_decision.0911.a.piety: "To zupełnie jakby dało się słyszeć głos [ROOT.Char.GetFaith.HighGodNamePossessive]…"
 religious_decision.0911.a.failure: "Wieczór się zbliża…"
