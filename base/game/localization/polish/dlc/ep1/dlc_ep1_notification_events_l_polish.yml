l_polish:
 ep1_notifications.0011.t: "Zmieniono język dworu"
 ep1_notifications.0011.desc: "Nasz [court_language|El] zmienił się na język [target_character.GetCourtLanguage.GetName|l]. Niech nasz dwór będzie jeszcze wspanialszy!"
 ep1_notifications.0012.t: "Porzucono język dworu"
 ep1_notifications.0012.desc: "[target_character.GetShortUINameNotMe] zmienia swój [court_language|El] z języka, którym jest [observer.GetCourtLanguage.GetName|l], na język [target_character.GetCourtLanguage.GetName|l]. Oby ta decyzja okazała się głupstwem!"
 ep1_notifications.0013.t: "Przyjęto język dworu"
 ep1_notifications.0013.desc: "[target_character.GetShortUINameNotMe] zmienia swój [court_language|El] na język [target_character.GetCourtLanguage.GetName|l]. To bardzo mądra decyzja!"
