 gdp_merchant.3000.t: "Wskazówka od tłumacza"
 gdp_merchant.3000.desc: "Mój tłumacz, [translator.GetTitledFirstName], od dłuższego czasu nie wychodzi z pracowni, najwyraźniej ślęcząc nad jakimś obcojęzycznym tekstem. W końcu się pojawia.\n\n– Raczy [ROOT.Char.GetTitleAsNameNoTooltip] posłuchać – mówi z promiennym uśmiechem. – Przeglądam raporty, których źródłem jest [market.GetName|l]. Skróty były trudne do odczytania, bo [saved_culture.GetLanguage.GetName|l] to niełatwy język, ale jest tu mnóstwo informacji o przepływie miejscowych towarów!"
 gdp_merchant.3000.a: "– [translator.GetFirstNameNoTooltip], chcę wszystko, co do joty!"
 gdp_merchant.3000.a.tt: "[company|E] zyskuje [trade_expertise|El] we wszystkich [Concept('trade_categories_short', 'kategoriach')|E] towarów, którymi obraca [market.GetName]"
 gdp_merchant.3000.b: "– Możesz nauczyć mnie tego języka?"
 gdp_merchant.3000.b.tt: "Twój [scheme|El] zyskuje modyfikator „[GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]”"
 gdp_merchant.3000.c: "– Sprzedaj ustalenia temu, kto da najwięcej."
 gdp_merchant.3000.d: "– Skup się na swoich umiejętnościach językowych."
 gdp_merchant_translator_buff_modifier: "Tłumacz-nauczyciel"
 gdp_merchant.3010.t: "Znalezisko agenta"
 gdp_merchant.3010.desc: "Mój pośrednik, [fixer.GetTitledFirstName], który od pewnego czasu wytrwale węszy w okolicy miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], wreszcie umawia spotkanie, przesyłając enigmatyczną wiadomość o odnalezieniu #EMP towaru#!.\n\nTajemniczo zajmuje swoje miejsce,"
 gdp_merchant.3010.desc.secret: "po czym się uśmiecha.\n\n– Nie było łatwo, ale mam tu dowód, że [secret_haver.GetName] to niemal na pewno [secret.GetName]!"
 gdp_merchant.3010.desc.scheme: "a na twarzy ma wymalowany niepokój.\n\n– Mam złe wieści. Wyszło na jaw, że [scheme_owner.GetName] spiskuje przeciwko tobie – przeciwko kompanii!"
 gdp_merchant.3010.a: "– Bardzo przydatne, przynoś mi więcej!"
 gdp_merchant.3010.b: "– Ale z ciebie cwana sztuka, prawda, [fixer.GetFirstNameNoTooltip]?"
 gdp_merchant.3010.c: "– Nie zajmuję się plotkami z nieczystego źródła."
 gdp_merchant.3010.d: "– To może mi się przydać w pracy…"
 gdp_merchant.3020.t: "Pogróżki windykatora"
 gdp_merchant.3020.desc: "Mój windykator, [bailiff.GetTitledFirstName], przegląda listę dłużników i waha się, jakie naciski można wywrzeć, by szybko odzyskać należne nam [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')].\n\n"
 gdp_merchant.3020.pressure: "– [pressure_debtor_1.GetTitledFirstName] nie ma pieniędzy, ale na znak dobrej woli może przynajmniej spłacać odsetki od długu… – warczy [bailiff.GetFirstNameNoTooltip].\n\n"
 gdp_merchant.3020.demand: "Wzdycha.\n\n– Wiem z pewnego źródła, że [demand_debtor_1.GetTitledFirstName] może zapłacić… Po prostu stawia się ponad nami!\n\n"
 gdp_merchant.3020.third: "– Jest jeszcze [portrait_3.GetTitledFirstName]… – mruczy."
 gdp_merchant.3020.a: "– Tak, [pressure_debtor_1.GetFirstNameNoTooltip] z pewnością może sobie pozwolić na #EMP drobną#! spłatę?"
 gdp_merchant.3020.a.tt: "Pomniejszy dług wobec ciebie o [gold_i] #V [THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#!"
 gdp_merchant.3020.b: "– Niech [demand_debtor_1.GetTitledFirstNameNoTooltip] znajdzie się pod naciskiem…"
 gdp_merchant.3020.c: "– [pressure_debtor_2.GetFirstNameNoTooltip] może sobie pozwolić na drobną spłatę."
 gdp_merchant.3020.d: "– [demand_debtor_2.GetFirstNameNoTooltip] wyraźnie się przed nami wykręca!"
 gdp_merchant.3020.e: "– [pressure_debtor_3.GetFirstNameNoTooltip] ma wobec nas zobowiązania. Przypomnij [pressure_debtor_3.Custom('PL_mu_jej')] o nich."
 gdp_merchant.3020.f: "– Pora wysłać jasny sygnał, który [demand_debtor_3.GetFirstNameNoTooltip] na pewno zrozumie."
 gdp_merchant.3020.g: "– Wolę, żeby [pressure_debtor_3.Custom('PL_jego_jej')] dług nadal czekał na spłatę."
 ho_loan_demand_refused_title: "Odrzucenie żądania spłaty pożyczki"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUINameNotMe] nadal ma u ciebie dług w wysokości [gold_i] [outstanding|V0]"
 ho_loan_reduced_title: "Zmniejszenie pożyczki"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUINameNotMe] ma teraz u ciebie dług w wysokości [gold_i] [outstanding|V0]"
 gdp_merchant.3031.t: "Zapał agenta"
 gdp_merchant.3031.desc: "Mój agent rynkowy, [market_agent.GetTitledFirstName], przesiaduje ostatnio do późnej nocy nad księgami rachunkowymi, a świece wokół [market_agent.Custom('PL_niego_niej')] powoli się dopalają. Tego ranka, gdy wchodzi do mojego gabinetu, mruga zaspanymi, przekrwionymi oczami.\n\n– Niech [ROOT.Char.GetTitledFirstName] posłucha! Przeglądam nasze księgi dotyczące rynku o nazwie [market.GetName|l] i widzę wyraźną szansę, którą… #weak *ziewa*#! …byłoby głupotą przepuścić!"
 gdp_merchant.3031.a: "– Dobra robota, [market_agent.GetFirstNameNoTooltip], a teraz idź się wyspać!"
 gdp_merchant.3031.a.tt: "[market.GetName|U] – pojawia się tu [trade_opportunity|El] ([trade_opportunity.GetType.GetName|Vl])"
 gdp_merchant.3031.b: "– Mniejsza z tym, priorytetem są nasze bieżące sprawy!"
 gdp_merchant.3040.t: "Troska kustosza"
 gdp_merchant.3040.desc: "Mój kustosz, [antiquarian.GetTitledFirstName], czuwa nad kolekcją, którą posiada [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], dba o to, by przedmioty były bezpieczne i w dobrym stanie, a od czasu do czasu raczy gości ciekawostkami.\n\nPewnego ranka zatrzymuję się, by podziwiać pewien przedmiot – [artifact.GetName] to prawdziwe cudo. Wtedy jak na zawołanie zjawia się [antiquarian.GetFirstName].\n\n– Ach, wie [ROOT.Char.GetTitleAsNameNoTooltip], to doprawdy wyjątkowy eksponat. Choć czasem się zastanawiam, czy dorównuje reszcie kolekcji."
 gdp_merchant.3040.b: "– Czas się z nim rozstać, znajdź kupca."
 gdp_merchant.3040.c: "– Może przydałaby mu się renowacja."
 gdp_merchant.3040.c.tt: "[artifact.GetName] to przedmiot, który już jest w nienagannym stanie"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName] to #V żywe stworzenie#!"
 gdp_merchant.3040.d: "– Bzdura, kolekcja jest bez skazy."
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "Zwykły mieszczanin z trudem uwierzyłby, jaką drogę może przebyć zwykły skrawek materiału – przez palące słońcem pustynie i wzburzone morza – by ostatecznie trafić na stragan.\n\nTe zmagania związane z handlem, zwierzętami i łodziami to chleb powszedni dla kompanii o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]. Nawet odległe miasta, gdzie język [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|l] praktycznie nie jest używany, polegają na naszych dostawach."
 gdp_merchant.8000.a: "Reputacja godna kompanii!"
 gdp_merchant.8000.b: "Jednak nie mogę zapominać o swoim pochodzeniu."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "Cenniejsze niż bele towarów wymienianych na targach czy drogocenne kamienie i metale wydobywane z ziemi, są cuda, które dzięki talentowi mogą zostać z nich wyczarowane ludzkimi rękami.\n\nPomysłowe urządzenia, zapierające dech w piersiach ozdoby i kunsztowne wyroby rzemieślnicze są siłą napędową kompanii o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], a nasze nazwisko jest symbolem jakości i zaufania."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "Nawet najpotężniejszy król może stać się bezsilny niczym nędzarz, jeśli strumień zysków przestanie płynąć, ale możliwości kredytowe oplatają go niczym liczne nici pajęczej sieci.\n\nNazwę kompanii znanej jako [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] słychać na dworach całego kraju. Ludzie polegają na wskazówkach stamtąd płynących, dobijając targu i zawierając umowy. Wierzą, że zawsze gotowa jest nieść pomoc w potrzebie, ale nie należy jej lekceważyć."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "Księga podróży"
 gdp_merchant.8010.desc: "Niewielu widziało tak wiele, a nikt nie doświadczył w całości moich wyjątkowych przeżyć. Od nędzarza po możnowładcę – dalekie krainy tego świata toną co najwyżej we mgle domysłów, a ludzie pragną informacji i rozrywki, które rozjaśnią tę mroczną otchłań.\n\nGdy zasiadam do pisania, rozważając najciekawsze fragmenty mych podróży po ziemiach znanych jako [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier], zastanawiam się, o czym obcy – i moi potomkowie – chcieliby przeczytać w pierwszej kolejności."
 gdp_merchant.8010.a: "Skupię się na zwyczajach i etykiecie obcych krajów."
 gdp_merchant.8010.a.tt: "Jakość tej książki będzie w dużej mierze zależeć od twojego [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] zdobytego jako [GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|Vl] #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#! oraz [GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|Vl] #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )|l])#!"
 gdp_merchant.8010.b: "Czytelnicy szukają wskazówek dotyczących handlu i analiz rynku."
 gdp_merchant.8010.c: "Moje dzieło skupi się na egzotycznych miastach i cudach świata."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "Trwało to nieco dłużej, książka przecież miała być gotowa wcześniej, ale w końcu odczuwam pewien rodzaj satysfakcji, spoglądając na swoje zapiski. Opisuję w nich moją podróż do miejsca znanego jako [poi.GetName], urozmaicając tę opowieść anegdotami z wędrówki ze szczególnym naciskiem na egzotyczne [author.Custom('GetTravelogueTopic')].\n\n"
 gdp_merchant.8011.weak: "Przerzucając kartki, czuję rozczarowanie i zastanawiam się, czy nie można było postarać się bardziej, ale niestety, pora odłożyć pióro."
 gdp_merchant.8011.mid: "Przerzucając kartki, ogarnia mnie duma z powodu wszechstronności mojego dzieła, choć mam wrażenie, że wciąż brak mu tego czegoś."
 gdp_merchant.8011.great: "Przerzucając kartki, śmieję się pod nosem z własnych słów, a kolejne ustępy poruszają mnie, jakby wszystko działo się od nowa. To pozycja, którą trzeba zapamiętać!"
 gdp_merchant.8011.a: "Na razie na tym poprzestanę."
 gdp_merchant.8011.b: "Pozycja ta musi trafić do biblioteki kompanii."
 travelogue_description_full: "To barwny dziennik z podróży po krainach miejsca o nazwie [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier] spisany przez kupca znanego jako [author.GetTitledFirstName]. Zawiera analizy będące wynikiem [author.GetHerHis] doświadczeń, których dostarczyły [author.Custom('PL_mu_jej')] zagraniczne [author.Custom('GetTravelogueTopic')].\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "[author.GetFirstNameNoTooltip] z rodu [author.GetHouse.GetNameNoTooltip] i [author.GetHerHis] podróże"
 travelogue_name_2: "Podróż do miejsca znanego jako [poi.GetCounty.GetName]"
 travelogue_name_3: "[author.GetFirstNameNoTooltip] z rodu [author.GetHouse.GetNameNoTooltip]: podróżnik"
 travelogue_name_4: "Do miejsca o nazwie [poi.GetCounty.GetName]"
 travelogue_name_5: "Przygody w miejscu o nazwie [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_6: "Podróże do [author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip]"
 travelogue_name_7: "Odległe krainy"
 travelogue_name_8: "Tam i z powrotem"
 travelogue_name_9: "[poi.GetCulture.GetCollectiveNounNoTooltip]"
 travelogue_name_10: "[poi.GetTitle.Custom('BaronyTownType')|U] [poi.GetNameNoTierNoTooltip], miejsce pełne tajemnic"
 travelogue_name_11: "Tysiąc"
 travelogue_name_12: "Podróże"
 travelogue_name_13: "Podróż"
 travelogue_name_14: "[author.GetFirstNameNoTooltip] i [author.GetHerHis] przygoda"
 travelogue_topic_customs: "zwyczaje"
 travelogue_topic_markets: "targowiska"
 travelogue_topic_places: "miejsca"
 travelogue_description_quality_weak: "Książka jest kiepsko napisana i zdecydowanie fantastyczna."
 travelogue_description_quality_mid: "Książka zawiera kilka przenikliwych spostrzeżeń."
 travelogue_description_quality_great: "Książka jest wciągająca, napisana z rozmachem i wyjątkową starannością."
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: osobliwy gość"
 gdp_merchant.8021.suzerain: "Największym zaszczytem jest dla mnie, gdy mój patron, [visitor.GetTitledFirstName],"
 gdp_merchant.8021.merchant: "[visitor.GetTitledFirstName], znany kupiec i właściciel kompanii o nazwie [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.laamp: "[visitor.GetTitledFirstName], przywódca wędrownego zespołu o nazwie [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.ruler: "Miło zaskakuje mnie, gdy [visitor.GetTitledFirstName], lokalny władca,"
 gdp_merchant.8021.fallback: "[visitor.GetTitledFirstName], pokorny podróżnik,"
 gdp_merchant.8021.desc: "składa mi wizytę.\n\nWyraźnie rozpromienia się na widok naszej kolekcji. Rozgląda się wokół, nie kryjąc swojego zachwytu nad cudami, które [visitor.Custom('PL_go_ja')] otaczają.\n\n– [ROOT.Char.GetTitledFirstNameNoTooltip], jak miło cię widzieć! Doszły mnie słuchy o wyczynach twej kompanii i waszej egzotycznej kolekcji… Możesz pokrótce opowie… – urywa w pół słowa, wstrzymując oddech na widok pewnego artefaktu. To [artifact.GetName].\n\n– Och! A co my tu mamy…?"
 gdp_merchant.8021.curio: "[visitor.GetTitledFirstNameNoTooltip] ogląda przedmiot ze wszystkich stron, nalegając na opowiedzenie całej jego historii, nim poczuje pełną satysfakcję."
 gdp_merchant.8021.library: "[visitor.GetTitledFirstNameNoTooltip] uważnie przegląda strony, zadając przy tym niezliczoną liczbę pytań."
 gdp_merchant.8021.creature: "[visitor.GetTitledFirstNameNoTooltip] zachwyca się jego pięknem i z radością obserwuje, jak się pożywia."
 gdp_merchant.8021.a: "Tak, to doprawdy coś niezwykłego."
 gdp_merchant.8021.b: "Chcesz to zatrzymać?"
 gdp_merchant.9021.opening: "Niech [merchant.GetTitledFirstNameNoTooltip] zechce przyjąć moje pozdrowienia!"
 gdp_merchant.9021.diarch.desc: "Jako [commissioner.GetDiarchTitle|l] miejsca znanego jako [commissioner.GetName] chcę zamówić usługi, które świadczy kompania o nazwie [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip]."
 gdp_merchant.9021.no_diarch.desc: "Chcę zamówić usługi, które świadczy kompania o nazwie [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip]."
 gdp_merchant.9021.desc: "\n\n[target.GetName] to towar, którego brakuje na rynku znanym jako [trade_market.GetName|l]. Sprowadź te dobra, a czeka cię sowita zapłata."
 gdp_merchant.9021.a: "Twoje zlecenie zostaje przyjęte."
 gdp_merchant.9021.b: "Bardzo przepraszam, ale muszę odmówić."
 gdp_merchant.9021.b.cooldown_tt: "Przez #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! l. nie otrzymasz kolejnego [Concept('commission', 'zlecenia')|E]"
 gdp_merchant.9005.t: "Wyparcie"
 gdp_merchant.9005.desc_intro: "[courtier.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))], wpada do kancelarii kompanii o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]. Twarz ma zarumienioną z uniesienia.\n\n– Nasz patron, [expeller.GetTitledFirstName], przekazuje wieści – oznajmia. – Nasza kompania ma niezwłocznie zamknąć księgi rachunkowe i opuścić miejsce o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]!\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName] rozkazuje, by kompania o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] opuściła miejsce znane jako [expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "Zaufanie osoby znanej jako [expeller.GetTitledFirstNameNoTooltip] do nas zbytnio się osłabiło."
 gdp_merchant.9005.desc_body.enemies: "Czy niechęć osoby znanej jako [expeller.GetTitledFirstNameNoTooltip] nigdy się nie kończy?"
 gdp_merchant.9005.desc_body.fallback: "Po tym wszystkim, czego tu dokonaliśmy…"
 gdp_merchant.9005.a: "A zatem do tego w końcu doszło."
 gdp_merchant.9005.a.tt: "Twoja [company|El] opuści [realm|El] osoby znanej jako [expeller.GetShortUINameNotMe]"
 gdp_merchant.9100.t: "Patrycjuszowski ród [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9100.desc: "Udowodniliśmy już swoją wartość wyniosłym rodom, których [new_patrician_liege.GetPrimaryTitle.GetTierAsName] to [new_patrician_liege.GetPrimaryTitle.GetNameNoTier], i zapewniliśmy odpowiednie #emp zachęty#! osobie znanej jako [new_patrician_liege.GetTitledFirstName], więc mój wniosek o podwyższenie rangi jest przesądzony.\n\nNareszcie mam dokumenty, które bez cienia wątpliwości stwierdzają, że ród [ROOT.Char.GetHouse.GetBaseName] nie jest zwykłym rodem kupieckim, lecz zasiada wśród innych szanownych rodów patrycjuszowskich w zgromadzeniu i w świetle prawa jest równy nawet rodowi [new_patrician_liege.GetHouse.GetBaseName]!"
 gdp_merchant.9100.a: "Z niecierpliwością czekam na moje pierwsze posiedzenie zgromadzenia."
 merchant_patrician_transition_domicile_tt: "Twoje [domicile_buildings|El] zostają zachowane"
 gdp_merchant.9110.t: "Kupiecki ród [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9110.desc: "Po upadku dawnej republiki ród [ROOT.Char.GetHouse.GetBaseName] i inne dumne rody patrycjuszowskie z miejsca znanego jako [new_merchant_location.GetBaronyNameExplicitly] stały się zwykłymi rodami kupieckimi, zdanymi na kaprysy losu i lokalnego władcy, którym jest [ROOT.Char.GetSuzerain.GetTitledFirstName].\n\nPozbawieni zgromadzenia i ochrony naszej republiki, musimy zaufać prawom, jakie ustanawia [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetName], jeśli chcemy zachować choć pozór dawnej pozycji."
 gdp_merchant.9110.a: "Jak do tego doszło – nie wiem…"
 broke_deal_opinion: "Zerwana umowa"
 gdp_repudiated_my_loan_opinion: "Odmowa spłaty mojej pożyczki"
 gdp_interest_free_loan_opinion: "Pożyczka bez odsetek"
 gdp_usurious_loan_opinion: "Lichwiarska pożyczka w złocie"
 gdp_merchant_unity_intermarriage_desc: "poślubia [Concept('merchant', 'kupca')|E] z innego [Concept('house', 'rodu')|E]"
 gdp_merchant_unity_noble_marriage_desc: "poślubia osobę z [Concept('house', 'rodu')|E] szlacheckiego"
 gdp_merchant.2000.t: "Braki na rynku: [needed_good.GetNameNoTooltip|l]"
 gdp_merchant.2000.desc.intro: "Kiedy przechadzam się po "
 gdp_merchant.2000.desc.disaster: "dotkniętych katastrofą "
 gdp_merchant.2000.desc.war: "zniszczonych wojną "
 gdp_merchant.2000.desc.plague: "dotkniętych zarazą "
 gdp_merchant.2000.desc.unrest: "ogarniętych wzburzeniem "
 gdp_merchant.2000.desc.stalls: "ulicach prowincji znanej jako [starving_province.GetNameNoTooltip], zauważam, że [starving_province.Custom('GetRegionalMarketTermGloss')], gdzie zwykle tętni życie, to teraz miejsce spowite ciszą.\n\nStragany z żywnością są prawie puste. Nieświeże przysmaki, takie jak [ROOT.Char.Custom('GetLocalStreetFoodPlural')], i zgniłe [ROOT.Char.Custom('RegionalRootVegetablePlural')], to wszystko, co na nich pozostało. I to ledwie kilka sztuk. Wychudzeni ludzie przekopują sterty odpadków zalegające wzdłuż ulic."
 gdp_merchant.2000.a: "Trzeba pilnować tego, co zostało."
 gdp_merchant.2000.b: "Ludzie będą szukać winnego."
 gdp_merchant.2000.c: "To nie mój problem."
 gdp_merchant.2010.t: "[craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip] – monopol:"
 gdp_merchant.2010.t.smith: "Kowal"
 gdp_merchant.2010.t.goldsmith: "Złotnik"
 gdp_merchant.2010.t.carpenter: "Cieśla"
 gdp_merchant.2010.t.tanner: "Garbarz"
 gdp_merchant.2010.t.potter: "Garncarz"
 gdp_merchant.2010.desc.intro: "[associate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], od tygodni bez ustanku rozprawia o rzemieślniku najlepszym w swoim fachu. To [craftsman.GetFirstName] z prowincji o nazwie [workshop_province.GetName]. Teraz, mając przed oczami efekty [craftsman.GetHerHis] pracy, rozumiem już, skąd to całe zamieszanie.\n\n[craftsman.GetFirstNameNoTooltip] wita mnie, nie odrywając wzroku od swego dzieła.\n\n– Proszę, obejrzyj moje wyroby. Nie musisz się spieszyć.\n\nJestem pod ogromnym wrażeniem "
 gdp_merchant.2010.desc.weapon: "wspaniałej broni."
 gdp_merchant.2010.desc.chalice: "misternie wykonanego kielicha."
 gdp_merchant.2010.desc.box: "misternie wyrzeźbionej drewnianej skrzyni."
 gdp_merchant.2010.desc.saddle: "idealnie wyrzeźbionego siodła."
 gdp_merchant.2010.desc.vase: "misternie pomalowanego ceramicznego wazonu."
 gdp_merchant.2010.desc.craftsmanship: "To nie jest zwykłe rzemiosło."
 gdp_merchant.2010.a: "Nie można zmarnować takiego talentu."
 gdp_merchant.2010.b: "Może [associate.GetFirstNameNoTooltip] się czegoś od ciebie nauczy."
 gdp_merchant.2010.c: "Chcę zostać i przyjrzeć się twojemu rzemiosłu."
 gdp_merchant.2015.t: "[counsel_good.GetNameNoTooltip] – cena towaru"
 gdp_merchant.2015.desc: "Niespodziewanie wzywa mnie [patron.GetTitledFirstName], mój patron. Wiedząc, jak jest [patron.Custom('quirk_neg_adjective')], wchodzę do sali tronowej z niepokojem.\n\n– Proszę mi coś wyjaśnić. [counsel_good.GetNameNoTooltip] – co możesz mi powiedzieć o właściwościach i wartości rynkowej tego towaru?"
 gdp_merchant.2015.a: "– Tak się składa, że znam się na tym jak mało kto."
 gdp_merchant.2015.a.tt: "Musisz osiągnąć co najmniej #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! [expertise_level|El] w [Concept('trade_category_short', 'kategorii')|E]: [counsel_category.GetName|l]"
 gdp_merchant.2015.b: "– Może coś tam wiem…"
 gdp_merchant.2015.a.monopoly.tt: "Akceptacja [monopoly_i] [Concept('trade_monopoly', 'monopolu handlowego')|E]: [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip] uważa cię za autorytet"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip] widzi, że kłamiesz"
 gdp_merchant.2015.b.monopoly.tt: "Akceptacja [monopoly_i] [Concept('trade_monopoly', 'monopolu handlowego')|E]: [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "– W życiu pragnę czegoś więcej niż tylko pracy."
 gdp_merchant.2020.t: "Miejsce przy stole"
 gdp_merchant.2020.desc: "Mam zaszczyt ucztować u mojego patrona, którym jest [patron.GetTitledFirstName]. Jego siedziba to [patron.GetCapitalLocation.GetHolding.GetType.GetName|l] w miejscu znanym jako [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. [courtier_1.GetTitledFirstName], [courtier_1.Custom('NoblewomanNobleman')], odprowadza mnie płonącym wzrokiem, gdy idę na swoje miejsce. Do innych gości szepcze tak cicho, że ledwie to słychać, ale wyłapuję słowa „hołota” i „łapówki od pospolitego handlarza”. Głosy milkną, gdy [patron.GetFirstNameNoTooltip] wstaje, by przemówić:\n\n– Zaufani towarzysze, nowi znajomi i dawno utraceni bracia, zapraszam was dziś wieczorem, byście nacieszyli się moją gościnnością. Ucztujmy!"
 gdp_merchant.2020.a: "– Wspaniale, musimy to częściej powtarzać!"
 gdp_merchant.2020.a.feast.tt: "[GetActivityType('activity_feast').GetTextIcon] [GetActivityType('activity_feast').GetName] zostanie zorganizowana przez osobę znaną jako [patron.GetShortUINameNotMe] jak najszybciej #weak (w ciągu 1–3 miesięcy)#!"
 gdp_merchant.2020.b: "Ród [ROOT.Char.GetHouse.GetBaseNameNoTooltip] zdobędzie uznanie, na jakie zasługujemy."
 gdp_merchant.2020.b.unity_gain.desc: "zdobywa miejsce wśród szlachty w imieniu naszego rodu"
 gdp_merchant.2020.c: "– Słusznie, słusznie, a teraz pomówmy o interesach!"
 gdp_merchant.2020.c.unity_loss.desc: "skupia się na tym, co naprawdę ważne: na interesach"
 gdp_merchant.2025.t: "Pomniejszy kupiec"
 gdp_merchant.2025.desc: "[charter_rival.GetTitledFirstName] jak zwykle nie stawia się, gdy wzywają obowiązki. Razem – [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] [patron.GetTitledFirstName] i ja – cierpliwie czekamy na [charter_rival.Custom('PL_jego_jej')] przybycie, aż w końcu postanawiamy przejrzeć księgi z tego miesiąca bez [charter_rival.Custom('PL_niego_niej')].\n\nNa stole wciąż leżą porozrzucane niezweryfikowane umowy handlowe, gdy [patron.GetFirstNameNoTooltip] odsuwa pergaminy i zwraca się do mnie:\n\n– [ROOT.Char.GetFirstNameNoTooltip], tak między nami, co #EMP naprawdę#! o [charter_rival.Custom('PL_nim_niej')] myślisz? [charter_rival.GetFirstNameNoTooltip] ma ode mnie koncesję – czy przyznanie jej było słuszną decyzją?"
 gdp_merchant.2025.a: "– Może lepiej by się sprawdziła w moich rękach?"
 gdp_merchant.2025.a.charter.tt: "Akceptacja interakcji [charter_i] „[request_merchant_charter|E]”: [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "– Niech [patron.Custom('FormOfAddressForLiege')] wie, że ufam twemu nieomylnemu osądowi."
 gdp_merchant.2025.b.unity_gain.desc: "pokazuje patronowi, że ufamy jego osądowi"
 gdp_merchant.4000.t: "Nasze miejsce poza Drogą"
 gdp_merchant.4000.desc.intro: "Wkraczam na targ w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] i widzę, że moich sprzedawców zepchnięto do odległego zaułka, a ich stoły ugrzęzły w błocie pobliskiego chlewu.\n\n"
 gdp_merchant.4000.desc.patron: "[market_character.GetName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))],"
 gdp_merchant.4000.desc.patron_representative: "[market_character.GetName], czyli [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))] osoby, którą jest [patron.GetTitledFirstName],"
 gdp_merchant.4000.desc.body: "stoi w oddali i uśmiecha się szyderczo, patrząc, jak moi partnerzy zasypują mnie skargami.\n\nGdy podchodzę, [market_character.GetFirstNameNoTooltip] mówi:"
 gdp_merchant.4000.desc.body.patron: "– Odpowiednie miejsce dla interesów, jakie prowadzi [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], nieprawdaż? – Wskazuje na świnie."
 gdp_merchant.4000.desc.body.patron_representative: "– Przychodzę w imieniu twojego patrona. – Sądząc po uniesionym podbródku i błysku w oczach, przekazywanie tych wieści sprawia [market_character.Custom('PL_mu_jej')] sporo przyjemności."
 gdp_merchant.4000.desc.outro: "– Nie przestrzegasz naszych zwyczajów i nigdy nie słuchasz słów, które głosi [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]. Dopóki tego nie zmienisz, takie będzie twoje miejsce."
 gdp_merchant.4000.b: "Muszę poznać Drogę."
 gdp_merchant.4000.b.tt: "Twoja następna [GetActivityType('activity_adult_education').GetName|l] kosztuje o #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#! mniej [Concept('gold', 'złota')|E], jeśli zorganizujesz ją w ośrodku, którego celem jest [GetTrait('confucian_education').GetName(GetNullCharacter)|l]"
 gdp_merchant.4000.c: "Jeszcze im pokażę…"
 gdp_merchant.4010.t: "Bramy wiedzy"
 gdp_merchant.4010.desc: "Pod koniec długiego dnia na targu raczę się herbatą. Raz po raz łapię na sobie zaciekawione spojrzenie kogoś z miejscowych uczonych.\n\n– [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] to banda bufonów. – Słyszę, jak mamrocze do przyjaciela. – Myślą, że są lepsi od nas, którzy przestrzegamy właściwych obrzędów. My zdawaliśmy egzaminy z należytą starannością. Co [ROOT.Char.GetFirstNameNoTooltip] potrafi oprócz wyzyskiwania innych?"
 gdp_merchant.4010.a: "Ten egzamin nie może być aż tak trudny."
 gdp_merchant.4010.b: "– A czyją herbatę pijesz?"
 gdp_merchant.4010.c: "– A bez czyich interesów to miejsce może się obyć?"
 gdp_merchant.4020.t: "Jedwabny Szlak"
 gdp_merchant.4020.desc: "Wkraczam do miejsca znanego jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] w ciżbie ludzi i zwierząt, która wlewa się przez bramy [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')], dołączając do niekończącej się procesji karawan. Dromadery są tu wysokie jak słonie. Dźwigają na swoich grzbietach ogromne ładunki, pod ciężarem których chwieją się na boki.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "Na każdym rogu ulicy kupcy wyładowują tak ogromne ilości towarów, że trudno w to uwierzyć.\n\nWidzę stragany, na których jedzenie się marnuje, bo produkcja jest tak wielka, że nie sposób sprzedać wszystkiego, zanim się zepsuje."
 gdp_merchant.4020.desc.steady_trading: "Nigdzie indziej nie ma w jednym miejscu takiego bogactwa. Ludzi jest tu tak wielu, że stajemy się wrzeszczącą masą, jednym organizmem.\n\nGdy jedna karawana się chwieje, zawsze znajdzie się pan skory strzelić z bicza."
 gdp_merchant.4020.desc.hardship: "Z tego, co udaje mi się wyłowić z urywków rozmów w obcych językach, ten rynek przeżywa obecnie trudności.\n\nJak to miejsce wygląda w czasach większego dobrobytu? Ilość towarów musi wtedy przechodzić wszelkie wyobrażenie…"
 gdp_merchant.4020.a: "To droga ku przyszłości."
 gdp_merchant.4030.t: "Odległe fortuny"
 gdp_merchant.4030.desc.intro: "Do kancelarii, którą zajmuje [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], wchodzi [associate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))], z oczami lśniącymi tak, jak zwykle lśnią tylko na widok stosu złota.\n\nWręcza mi szkatułkę, a ja otwieram ją i znajduję w środku"
 gdp_merchant.4030.desc.silk: "jedwab tak przedni, że nie ma sobie równych – cienki jak papier i niewiarygodnie lekki.\n\n"
 gdp_merchant.4030.desc.spice: "wonny proszek, świeżo zmielony.\n\n– Nazywają to „[rumoured_market_owner.Custom('RegionalSpice')]” – mówi."
 gdp_merchant.4030.desc.jade: "jadeit, wypolerowany tak, że jego powierzchnia jest gładka jak szkło.\n\n"
 gdp_merchant.4030.desc.ivory: "kawałek kości słoniowej wyrzeźbiony na kształt miniaturowej cytadeli.\n\n"
 gdp_merchant.4030.desc.outro: "– Mam to od kupca, który opowiadał o swoich kontaktach na Jedwabnym Szlaku – w kręgu kultury, którą jest kultura [rumoured_market_owner.GetCulture.GetNameNoTooltip|l]. Mówię ci, [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] i [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip] to niebo i ziemia. Złoto, które tu zarabiamy, to nic w porównaniu z tym, co zbierają tamtejsze [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')]."
 gdp_merchant.4030.a: "– Mówisz, Jedwabny Szlak?"
 gdp_merchant_4030_a_tt: "Jeśli w ciągu najbliższych #V 5#! lat przeniesiesz swoją [Concept('company', 'kompanię')|E] na rynek znany jako [rumoured_market.GetName], na #V 10 lat#! zyskasz na tym [Concept('market', 'rynku')|E] modyfikator „[GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]”"
 gdp_merchant.4030.b: "– Dziękuję, cóż za przemyślany podarunek."
 gdp_merchant.4030.c: "– Mamy tu ważne interesy, [associate.GetFirstNameNoTooltip]."
 merchant_unity_local_business: "przedkłada pobliskie interesy nad [silk_road|El]"
 gdp_merchant.4030.artifact.silk: "Jedwab z miejsca znanego jako [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant.4030.artifact.silk.desc: "Skrawek cienkiego jak papier jedwabiu przywieziony z targów Jedwabnego Szlaku, niewiarygodnie lekki i gładki w dotyku."
 gdp_merchant.4030.artifact.spice: "Sakiewka z przyprawami"
 gdp_merchant.4030.artifact.spice.desc: "Sakiewka pachnących przypraw przywiezionych z targowisk Jedwabnego Szlaku."
 gdp_merchant.4030.artifact.jade: "Polerowany jadeit"
 gdp_merchant.4030.artifact.jade.desc: "Jadeit z targów Jedwabnego Szlaku, wypolerowany tak, że jego powierzchnia jest gładka jak szkło."
 gdp_merchant.4030.artifact.ivory: "Cytadela z kości słoniowej"
 gdp_merchant.4030.artifact.ivory.desc: "Kawałek kości słoniowej z targów Jedwabnego Szlaku, pieczołowicie wyrzeźbiony na kształt miniaturowej cytadeli."
 gdp_merchant.5000.t: "Ujawnione odsetki"
 gdp_merchant.5000.desc.debtor: "Drzwi gabinetu, w którym urzęduje [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], otwierają się z hukiem i do środka wchodzi w asyście moich partnerów [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName]."
 gdp_merchant.5000.desc.debtor_paranoid: "Tylko skrzypnięcie drzwi zdradza, że do gabinetu, w którym urzęduje [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], bezszelestnie wkracza [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName]."
 gdp_merchant.5000.desc.bishop: "Próg siedziby, którą zajmuje [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], zaciemniają zakapturzone postacie. Wkrótce staje przede mną [accuser.Custom('GetActualBishopTitle')|l] [accuser.GetFirstName] w asyście moich własnych partnerów."
 gdp_merchant.5000.desc.clergy: "Próg siedziby, którą zajmuje [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], zaciemniają zakapturzone postacie. Wkrótce staje przede mną [accuser.Custom('PriestTitle')|l] [accuser.GetFirstName] w asyście moich własnych partnerów."
 gdp_merchant.5000.desc.steward: "Drzwi gabinetu, w którym urzęduje [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], otwierają się z hukiem i do środka wpada [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] osoby znanej jako [debtor.GetFirstName] w asyście moich własnych partnerów."
 gdp_merchant.5000.desc.break: "\n\n– Musi [ROOT.Char.GetTitledFirstNameNoTooltip] wiedzieć, że w kwestii pożyczki dla [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, '', 'osoby znanej jako' )] [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'mnie', debtor.GetTitledFirstName )] coś się nie zgadza – mówi [accuser.GetFirstName]."
 gdp_merchant.5000.desc.accepted: "– Nie lubię, gdy karmi się mnie kłamstwami. Pokaż mi księgi kompanii i wyjaśnijmy tę sprawę."
 gdp_merchant.5000.desc.discouraged.debtor: "– Wiesz, że [accuser.GetFaith.Custom('HouseOfWorshipBase')] potępia lichwę. Rozliczmy się teraz, a sprawa nie musi iść dalej."
 gdp_merchant.5000.desc.shunned.debtor: "– Gdy tylko [accuser.Custom('DefaultPriestTitlePlural')] się o tym dowiedzą, uwezmą się na ciebie i twoje interesy z całą surowością. Jestem tu, by dać ci szansę ratunku."
 gdp_merchant.5000.desc.accepted.steward: "– Twój patron nie lubi, gdy karmi się go kłamstwami. Pokaż mi księgi kompanii i doprowadźmy rachunki do porządku."
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "– Jako kupiec z pewnością rozumiesz, że nie można czegoś zyskać za nic? A jednak… Mamy nadzieję, że ta sprawa zostanie rozwiązana teraz, dyskretnie, aby twój biznes mógł uniknąć kłopotów wynikających z tego błędu, a tym samym aby cała ta sytuacja nie odbiła się negatywnie na handlu."
 gdp_merchant.5000.desc.shunned: "– Sposób, w jaki prowadzisz interesy, jest godny pogardy. Kupiecki fach, a sprzedajesz coś, co nie istnieje? Sprawa trafi do sądu, chyba że będziesz błagać o wybaczenie."
 gdp_merchant.5000.a: "– Czy nie wiesz, że działam w imieniu osoby znanej jako [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]?"
 gdp_merchant.5000.a.debtor: "– Chyba nie chcesz zaszkodzić naszemu handlowi?"
 gdp_merchant.5000.b: "– Możesz wziąć nasz majątek w ramach rekompensaty."
 gdp_merchant.5000.c: "– Proszę, przyjrzyjmy się zapisom drobnym drukiem."
 gdp_merchant.5000.c.success: "Twoje rachunki są nienaganne"
 gdp_merchant.5000.c.failure: "Rachunki są niechlujne"
 gdp_merchant.5000.c.critical: "Odsetki są źle zamaskowane"
 gdp_merchant.5000.d: "– Chyba mogę zrezygnować z odsetek…"
 gdp_merchant.5000.e: "– Uznajmy tę pożyczkę za niebyłą."
 gdp_usury_penance_seized_goods_modifier: "Odzyskane karawany"
 gdp_usury_penance_seized_goods_modifier_desc: "Interesy tej postaci cierpią po ujawnieniu jej ukrytych pożyczek na procent."
 gdp_usury_penance_same_faith_scandal_modifier: "Ujawniony lichwiarz"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "Ta postać cierpi, bo wyszła na jaw jej podstępna lichwa."
 gdp_usury_penance_forgive_interest_tt: "Zamaskowane [interest|El] zostają umorzone #weak ([TARGET_CHARACTER.GetShortUINameNotMe] ma dług: [gold_i|E] $VALUE|0V$)#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "[loan|E] z ukrytymi odsetkami pozostaje w mocy"
 gdp_merchant.5010.t: "Drobny druk"
 gdp_merchant.5010.desc: "Dochodzą mnie słuchy, że przy rozliczeniu mojej pożyczki wierzyciel, którym jest [lender.GetFirstName], nie postępuje do końca uczciwie.\n\nPrzeglądając ponownie liczby, widzę, że w zapisach drobnym drukiem są klauzule, które dają wyższą sumę, niż początkowo zostało uzgodnione.\n\nRozbieżność w naszej umowie jest oczywista dla każdego – jeśli zechcę to wykorzystać."
 gdp_merchant.5010.a: "Zachowaj tajemnicę."
 gdp_merchant.5010.b: "[lender.GetFirstName] zwróci mi odsetki."
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U] nie otrzyma żadnych odsetek."
 gdp_merchant.5010.c: "Odmów spłaty pożyczki."
 gdp_usury_debtor_discover_interest_tt: "Ukryte [interest|El] wynoszą #weak [gold_i|E] $VALUE|0V$#!"
 gdp_usury_debtor_keep_secret_tt: "Zamaskowane [interest|El] pozostają tajemnicą"
 gdp_usury_debtor_demand_repayment_tt: "Zażądaj zwrotu ukrytych [Concept('interest', 'odsetek')|E]"
 gdp_usury_debtor_inform_creditor_tt: "Do osoby znanej jako [lender.GetShortUINameNotMeNoTooltip] trafia list"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ Żądam natychmiastowego zwrotu ukrytych odsetek. Nawet nie myśl o tym, by znów mnie oszukać."
 gdp_merchant.5020.a: "Co za niefortunny obrót wydarzeń."
 gdp_merchant.5020.a.tt: "Zwrot ukrytych odsetek"
 gdp_usury_penance_interest_paid_back_tt: "Ukryte [interest|El] nie są już należne"
 gdp_merchant.5020.desc_intro: "Po przejrzeniu naszego kontraktu pożyczkowego jest dla mnie jasne jak słońce, że to była z twojej strony próba wykiwania mnie!"
 gdp_usury_debtor_kept_secret_message: "Tajemnica zachowana"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName] wie o zamaskowanych [Concept('interest', 'odsetkach')|E] i zachowa je w tajemnicy."
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "Pożyczkę od Ciebie uważam za nieważną. Następnym razem dobrze się zastanowię, zanim cokolwiek od Ciebie przyjmę."
 gdp_merchant.5040.a: "Co za tupet!"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "Z bólem piszę i przyznaję, że trudy podróży i nieustanne kłótnie na targach okazały się dla mnie nie do zniesienia.\n\nCzy znajdziesz w sercu dość wyrozumiałości, by wezwać kompanię do powrotu do domu, choćby na jakiś czas?"
 gdp_merchant.0060.a: "Skoro muszę."
 gdp_merchant.0060.a.tt: "Obiecujesz podjąć decyzję „[GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName]” w ciągu 2 lat."
 gdp_merchant.0060.b: "Musisz to przezwyciężyć."
 gdp_merchant.0060.b.tt: "[associate.GetShortUINameNotMe] ma [stress_i] #N [associate.GetStress|0]#! pkt [Concept('stress', 'stresu')|E]. Będzie nadal zyskiwać stres z powodu nieudanych [Concept('schemes', 'spisków')|E] na swoim szlaku."
