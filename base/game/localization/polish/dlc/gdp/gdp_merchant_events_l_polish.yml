l_polish:
 gdp_merchant.0001.t: "Droga wybrukowana złotem"
 gdp_merchant.0001.desc: "Wchodzę na lokalny targ jako wolna osoba. Z każdego rogu ulicy dobiegają okrzyki sprzedawców przeplatające się z brzękiem i stukotem metalu z pobliskich warsztatów. Gdziekolwiek się obrócę, widzę wózki pełne skrzyni wyśmienitego trunku, którym jest [ROOT.Char.Custom('RegionalDrink')], bele [ROOT.Char.Custom('RegionalFabric')] i klatki z ptactwem – [ROOT.Char.Custom('GetRandomRegionalBird')] to gatunek, który spotykam tu najczęściej. Wszystko to wożone jest tam i z powrotem.\n\nTo właśnie tutaj założę swoją dynastię."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "Od czego mam zacząć swoją działalność?"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "Po dokładnym rozważeniu wszystkich możliwości wybieram życie kupca. Jestem w sile wieku, a chęć podróżowania za granicę popycha mnie do działania. Mam nadzieję, że kiedyś uda nam się zawrzeć umowę biznesową korzystną dla obu stron. Zostawiam miejsce znane jako [old_primary_title.GetBaseNameNoTierNoTooltip] w twoich kompetentnych rękach."
 gdp_merchant.0002.a: "Ciekawy obrót spraw."
 gdp_merchant.0010.t: "Sprawy rodzinne"
 gdp_merchant.0010.desc: "Po zakończeniu dzisiejszego rodzinnego spotkania [associate.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], daje mi znak, że mam podejść. Determinacja na [associate.GetHerHis] twarzy jest jednoznaczna.\n\n– Może [associate.Custom2('RelationToMe', ROOT.Char)] zamienić ze mną słowo?"
 gdp_merchant.0010.desc.starting: "Jestem częścią tej kompanii od momentu jej powstania"
 gdp_merchant.0010.desc.starting_fallback: "Od dawna pracuję dla tej rodziny"
 gdp_merchant.0010.desc.cont: "– mówi, ostrożnie dobierając słowa."
 gdp_merchant.0010.desc.children: "– A ponieważ twój dziedzic i jednocześnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] nie jest jeszcze w odpowiednim wieku,"
 gdp_merchant.0010.desc.no_children: "– A ponieważ nie masz pełnoletnich dzieci,"
 gdp_merchant.0010.desc.outro: "tliła się we mnie nadzieja, że rozważysz adopcję mnie. Byłoby dla mnie zaszczytem reprezentować ten ród jako jego członek."
 gdp_merchant.0010.a: "– Jesteś dla mnie jak własne dziecko. Zawsze tak było."
 merchant_adoption_event_tt: "[associate.GetShortUINameNotMe] staje się częścią twojego [Concept('house', 'rodu')|E]"
 merchant_unity_adoption_loss: "poprzez adopcję przyjęto wspólnika do [Concept('house', 'rodu')|E]"
 gdp_merchant.0010.b: "– Musisz jeszcze udowodnić, że do czegoś się przydasz."
 gdp_merchant.0010.c: "– Wrócimy do tej rozmowy."
 gdp_merchant.0015.t: "Oblicze działalności"
 gdp_merchant.0015.desc: "Wraz z utworzeniem szlaku [trade_route.GetNameNoTooltip|l] wytyczyliśmy kierunek naszej działalności handlowej.\n\nMuszę jeszcze wybrać osobę, która mogłaby reprezentować nas w naszym nowym przedsięwzięciu. [courtier_1.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))], to [courtier_1.Custom('quirk_pos_adjective')] duszyczka"
 gdp_merchant.0015.desc_good_intellect: "dość rozsądnie myśląca. Kto wie, może zaskoczy nas jakimś ukrytym talentem."
 gdp_merchant.0015.desc_excellent_intellect: "o wyjątkowej inteligencji. Nietrudno przewidzieć, że przyniesie chlubę rodowi."
 gdp_merchant.0015.desc_poor_intellect: "niegrzesząca intelektem. Być może ta okazja zmusi [courtier_1.Custom('PL_go_ja')] do popracowania nad swoimi umiejętnościami."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip] to może być odpowiednia osoba do tego zadania…"
 gdp_merchant.0015.b: "…ale [courtier_2.GetFirstNameNoTooltip] może okazać się lepszym wyborem."
 gdp_merchant.0015.c: "Muszę trzymać utalentowanych ludzi blisko siebie."
 gdp_merchant.0015.c.fallback: "Nie. Muszę mieć tu wszystkich."
 gdp_merchant.0015.c.tt: "Uruchamiasz [trade_route|El] bez przypisanego [Concept('trader', 'handlarza')|E]"
 gdp_merchant.0020.t: "Wspólnik w interesach"
 gdp_merchant.0020.desc: "Głowa rodzinnej firmy działa tak skutecznie, jak szyja, która pozwala jej patrzeć w kierunku nowych perspektyw."
 gdp_merchant.0020.desc.partner_exists: "Mój wspólnik, którym jest [old_holder.GetFirstName], miał podjąć się tego zadania, a marnuje jedynie nasz czas i złoto na bezowocne przedsięwzięcia."
 gdp_merchant.0020.desc.fallback: "Obecnie nie zatrudniam nikogo, kto pełniłby tę funkcję, ani nie mam żadnego wspólnika."
 gdp_merchant.0020.desc.body: "Napięcie w firmie jest wyczuwalne, a to rodzi kłótnie i zaczepki ze strony każdego, kto ma jakieś ambicje.\n\n"
 gdp_merchant.0020.desc.outro_three: "Wśród nich są [candidate_2.GetTitledFirstName] i [candidate_3.GetTitledFirstName]. Przysięgają niezachwianą lojalność tylko po, by zdobyć miejsce przy stole.\n\n[candidate_1.GetTitledFirstName] nie może wygrać. Zrobią wszystko, co w ich mocy, by do tego nie dopuścić, choć nie dorastają [candidate_1.Custom('PL_mu_jej')] do pięt."
 gdp_merchant.0020.desc.outro_two: "Wśród nich jest [candidate_2.GetTitledFirstName]. Przysięga niezachwianą lojalność tylko po to, by zdobyć miejsce przy stole.\n\n[candidate_1.GetTitledFirstName] nie może wygrać. [candidate_2.GetTitledFirstName] zrobi wszystko, co w [candidate_2.GetHerHis] mocy, by do tego nie dopuścić, choć nie dorasta [candidate_1.Custom('PL_mu_jej')] do pięt."
 gdp_merchant.0020.desc.outro_one: "Wśród nich jest [candidate_1.GetTitledFirstName]. Przysięga niezachwianą lojalność tylko po to, by zdobyć miejsce przy stole.\n\nZrobi wszystko, co w [candidate_1.GetHerHis] mocy, by pozbyć się każdego, kto mógłby stanąć [candidate_1.Custom('PL_mu_jej')] na drodze do objęcia tego stanowiska."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip] zasługuje na szansę."
 gdp_merchant.0020.a.custom: "Każdy inny kandydat"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip] zasługuje na tę możliwość."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip] zdecydowanie najbardziej na to zasługuje."
 gdp_merchant.0020.d: "Oni mają już na głowie inne sprawy…"
 gdp_merchant.0020.d.custom: "Każdy kandydat"
 merchant_unity_partner_gain: "zatrudniono członka rodu jako partnera"
 merchant_unity_partner_loss: "zatrudniono osobę postronną rodu jako partnera"
 gdp_merchant.0025.t: "Szanowani rzemieślnicy"
 gdp_merchant.0025.desc: "– [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip]? – woła mnie nieznajomy głos z pobliskiej garbarni. Podążam za dźwiękiem, patrząc uważnie pod nogi, żeby nie wdepnąć w błoto z kadzi barwiarskich.\n\nNim się orientuję, stoję twarzą w twarz z… truchłem? Osoba, która upolowała zwierzę, uśmiecha się do mnie i z dumą prezentuje swoje trofeum.\n\n– [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] to miejsce, które ponoć słynie ze znakomitych rzemieślników. Z pewnością zdajesz sobie zatem sprawę, że sprzedawany produkt jest tak dobry, jak użyte do jego wytworzenia materiały. Zarabiam na życie samodzielnie, polując na zwierzynę i pozyskując najlepsze materiały dla tak wybitnych nabywców, jak ty."
 gdp_merchant.0025.a: "– Może należy rozważyć handel na większą skalę?"
 gdp_merchant.0025.b: "– Kontynuuj, proszę…"
 merchant_unity_artisan_recruit_loss: "zwerbowano obcego"
 merchant_unity_artisan_recruit_decline_gain: "poszerzono wiedzę o luksusowych materiałach"
 gdp_merchant.0030.t: "Siła, z którą trzeba się liczyć"
 gdp_merchant.0030.desc: "- Niech [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip] spojrzy tutaj! – słyszę, jak krzyczy jakaś osoba.\n\nOdwracam się i widzę, jak kowal macha do mnie ze swojego warsztatu. Kiedy pochodzę, zauważam, jak pręży się i wygina, ustawiając się tak, by płomienie odpowiednio oświetlały umięśnione ciało…\n\n– Długo przyszło mi czekać, by cię poznać. Ponieważ twoja kompania zdobyła #EMP imponującą#! reputację, dominując swoich rywali, chcę zaoferować twej sprawie moje pięści. Mogę rozwalać głowy, dzierżyć miecz – czegokolwiek potrzebujesz."
 gdp_merchant.0030.a: "– Podoba mi się twój entuzjazm"
 gdp_merchant.0030.b: "– #EMP Ehm…#! Pokaż mi więcej swoich dzieł."
 merchant_unity_creditor_recruit_loss: "zwerbowano obcego"
 merchant_unity_creditor_recruit_decline_gain: "zignorowano podlizującego się fanatyka kompanii"
 gdp_merchant.0035.t: "Rozległa reputacja"
 gdp_merchant.0035.desc: "Nadzwyczajny zgiełk odwraca moją uwagę od leżących przede mną ksiąg rachunkowych.\n\nWychodzę na zewnątrz z biura w miejscu znanym jako [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] i zauważam bystrego kupca, którego ubrania pokrywa kilkudniowa warstwa kurzu.\n\n– [ROOT.Char.GetTitledFirstNameNoTooltip], dobrze cię widzieć! – mówi. – Wszyscy podróżujący znają twe imię, a każdy człowiek, którego dane mi było spotkać, mówił, że kogoś takiego jak ty po prostu trzeba poznać. Trzymam się nadziei, że pozwolisz mi odtąd podróżować pod twoim sztandarem."
 gdp_merchant.0035.a: "– Cóż, wydaje się, że masz odpowiednie zdolności!"
 gdp_merchant.0035.b: "– Chętniej posłucham wieści o handlu z dalekich krajów."
 merchant_unity_caravaneer_recruit_loss: "zwerbowano obcego"
 merchant_unity_caravaneer_recruit_decline_gain: "poszerzono wiedzę o odległych rynkach"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 gdp_merchant.0101.desc_republic: "Choć początkowo [ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')] patrzyli na wszystko z pesymizmem, ostatecznie [recipient.GetTitledFirstName] przychyla się do naszej prośby i atmosfera natychmiast się odmienia! Wreszcie będziemy mieć własne miasto, własną republikę, którą pokierujemy wedle własnej woli!\n\nPo raz pierwszy w historii miejscem o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] będzie rządzić [ROOT.Char.GetTitleAsNameNoTooltip] i będę to ja."
 gdp_merchant.0101.liege: "Będę zarządzać miejscem znanym jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] i jego okolicami jako miastem podległym, pozostającym w równym stopniu zależnym od naszych panów z miejsca o nazwie [new_liege.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant.0101.independent: "Będę zarządzać w imieniu ludu miejscem znanym jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] i jego okolicami wraz z innymi miejscowymi wybitnymi rodzinami."
 gdp_merchant.0101.republic: "\n\nPo długotrwałych negocjacjach i podjęciu wielu działań wielki ród [ROOT.Char.GetHouse.GetBaseNameNoTooltip] może w końcu zbudować trwałe dziedzictwo…"
 gdp_merchant.0101.a: "Oto zaczyna się nowa epoka dla mieszkańców miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip]!"
 gdp_merchant.0102.desc: "Niezmiernie się cieszę, że nasz prośba spotkała się z twoją akceptacją!\n\nZłoto zostało już wysłane, a teraz planujmy sporządzić statut dla miejsca znanego jako [actor.GetPrimaryTitle.GetName],"
 gdp_merchant.0102.liege: "abyśmy mogli funkcjonować jako twoi skromni poddani."
 gdp_merchant.0102.top_liege: "aby zarządzać nią pod zwierzchnictwem osoby znanej jako [new_liege.GetTitledFirstName]."
 gdp_merchant.0102.independent: "aby mogło funkcjonować jako niezależne miasto."
 gdp_merchant.0103.desc: "Cóż za absurdalna propozycja! Naprawdę sądzisz, że moje tytuły są na sprzedaż? I miałyby trafić do kogoś tak mało znaczącego jak #EMP ty?!#!"
 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "Po długich rozmowach [recipient.GetTitledFirstName] nie potrafi już ukryć swojego zainteresowania moją hojną propozycją połączenia naszych kompanii i rodów.\n\nWreszcie kiwa głową."
 gdp_merchant.0110.desc.personality.ai_honor: "– Wygląda na to, że nie mam w tej sprawie wielkiego wyboru. Mimo to dotrzymam naszej części umowy i będę działać w twoim interesie tak samo sumiennie, jak w moim własnym."
 gdp_merchant.0110.desc.personality.ai_zeal: "– Ufam, że ta droga ukazała się nam z łaski [recipient.GetFaith.WealthGodNamePossessive]."
 gdp_merchant.0110.desc.personality.ai_greed: "– Jestem po przejrzeniu twoich i naszych ksiąg. Biorąc pod uwagę te dane, nie mam innego wyboru, jak tylko przyjąć ofertę."
 gdp_merchant.0110.desc.personality.ai_compassion: "– Po konsultacji z kompanią jesteśmy przekonani, że połączenie naszych przedsięwzięć przyniesie obopólne korzyści."
 gdp_merchant.0110.desc.personality.ai_boldness: "– Przyjmuję twoją propozycję. Niech nie będzie już między nami żadnych niedomówień."
 gdp_merchant.0110.desc.personality.ai_rationality: "– Po porównaniu naszych zysków i kosztów związanych z odrzuceniem twojej oferty przyjmuję ją."
 gdp_merchant.0110.desc.personality.ai_vengefulness: "– Nie mam wyboru. Udało ci się to dobrze rozegrać – wygrywasz tę rundę."
 gdp_merchant.0110.desc.personality.ai_energy: "– Zgadzam się. Niech twoi ludzie sporządzą kontrakt i niezwłocznie mi go prześlą!"
 gdp_merchant.0110.desc.personality.ai_sociability: "– Kompania [recipient.GetHouse.GetBaseNameNoTooltip] przyjmuje twoje warunki. Będzie mi brakowało działania pod własnym szyldem, ale nie warto się kurczowo trzymać swojej dumy."
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "– Po długim namyśle przyjmuję twoją propozycję połączenia naszych przedsięwzięć."
 gdp_merchant.0110.desc.closing: "\n\n– Nasze szlaki handlowe zostały zlikwidowane zgodnie z ustaleniami, a ród [recipient.GetHouse.GetBaseNameNoTooltip] będzie od dzisiaj pracować dla twojej kompanii."
 gdp_merchant.0110.a: "Rynki należące do rodu [recipient.GetHouse.GetBaseNameNoTooltip] są nasze!"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "Przesadzasz z pewnością siebie i zapominasz, jakie znaczenie ma [actor.GetPrimaryTitle.GetDefinitiveNameNoTooltip]. [recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip] nigdy nie ulegnie Twoim małostkowym zamiarom."
 gdp_merchant.0111.a: "To przedsięwzięcie okazało się nieudane."
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "Krążą plotki, że miejsce znane jako [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] pilnie potrzebuje pomocy finansowej. Mam możliwości, by rozwiązać ten problem… oczywiście w zamian za przysługę."
 gdp_purpose_events.0001.a: "W ten sposób mogę się z tego wyplątać…"
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName] rozważy twoją propozycję."
 gdp_purpose_events.0001.b: "Co za tupet!"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "Proszę o pomoc finansową w tej trudnej chwili. Podaj swoje warunki, a ja ich nie odrzucę, o ile tylko zdołasz je spisać."
 gdp_purpose_events.0002.a: "Sporządź umowę obligacji, uwzględniając odsetki i wszystkie inne warunki."
 gdp_purpose_events.0002.a.sin: "Sporządź umowę obligacji, uwzględniając lichwę i wszystkie inne warunki."
 gdp_purpose_events.0002.c: "Sporządź umowę obligacji tak, aby nikt nie mógł jej nazwać lichwą."
 gdp_purpose_events.0002.d: "Wyślij złoto i nie proś o nic w zamian."
 gdp_purpose_events.0002.b: "Muszę grzecznie odmówić…"
 gdp_purpose_events.0002_notification: "Udzielono pożyczki"
 gdp_purpose_events.0002_fail_notification: "Odmówiono udzielenia pożyczki"
 fund_maa: "Aby sfinansować @stationed_regiment_icon! [regiment|El] [Concept('men_at_arms', 'zbrojnych')|E]"
 fund_mercenaries: "Aby sfinansować kontrakt z [mercenary_i|E] z [Concept('mercenary', 'najemnikami')|E]"
 gdp_purpose_events.0003.desc: "Powszechnie wiadomo, że wojna zbiera żniwo w waszym państwie. Jestem w stanie wesprzeć wasze wysiłki, jeśli ty jako [ruler.GetTitleAsNameNoTooltip] okażesz mi w przyszłości życzliwość…"
 gdp_purpose_events.0003.a: "Potrzebuję wszelkiej możliwej pomocy!"
 gdp_purpose_events.0003.b: "Życzliwość? W życiu!"
 no_thanks.tt: "Pozwalasz, by okazja przeszła ci koło nosa…"
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "Z ciężkim sercem zwracam się do Ciebie w tej niespokojnej godzinie, ale moje państwo potrzebuje wsparcia w trwającej wojnie. Jeśli okażesz mi pomoc, w przyszłości wynagrodzę Cię życzliwością."
 gdp_purpose_events.0004.a: "Mogę zaproponować ci nowy, wyspecjalizowany pułk!"
 gdp_purpose_events.0004.b: "Mogę posmarować tu i ówdzie…"
 gdp_merchant.1002.t: "Założenie firmy"
 gdp_merchant.1002.desc: "Przede mną leży pusta księga rachunkowa. Przez otwarte okno mojego biura w miejscu znanym jako [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] dobiega gwar, którego źródłem jest [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]: nawoływania kupców, skrzypienie wozów, odgłosy zwierząt.\n\nMój gabinet jest skromny i ciemny – nie mogę działać w pojedynkę, jeśli mam rywalizować z handlarzami z miejsca o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Być może nadszedł czas, by znaleźć kogoś do pomocy w prowadzeniu interesów?"
 gdp_merchant.1002.a: "Potrzebuję ludzi z głową do interesów."
 gdp_merchant.1002.a.tt: "Rozpoczynasz z dwoma [Concept('associates', 'partnerami')|E] posiadającymi umiejętność [Concept('stewardship', 'zarządzania')|E]"
 gdp_merchant.1002.b: "Wzbudzimy niepokój u naszych przeciwników."
 gdp_merchant.1002.b.tt: "Rozpoczynasz z dwoma [Concept('associates', 'partnerami')|E] posiadającymi umiejętność [Concept('martial', 'walki')|E]"
 gdp_merchant.1002.c: "Doświadczeni negocjatorzy zawierają korzystne umowy handlowe."
 gdp_merchant.1002.c.tt: "Rozpoczynasz z dwoma [Concept('associates', 'partnerami')|E] posiadającymi umiejętność [Concept('diplomacy', 'dyplomacji')|E]"
 gdp_merchant.1002.d: "Uczonych tu nie brakuje!"
 gdp_merchant.1002.d.tt: "Rozpoczynasz z dwoma [Concept('associates', 'partnerami')|E] posiadającymi umiejętność [Concept('learning', 'nauki')|E]"
 gdp_merchant.1002.e: "Spryt da nam przewagę."
 gdp_merchant.1002.e.tt: "Rozpoczynasz z dwoma [Concept('associates', 'partnerami')|E] posiadającymi umiejętność [Concept('intrigue', 'intrygi')|E]"
 gdp_merchant.1002.f: "Nie, nikogo nie potrzebuję."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial Wykonywanie [Concept('task_contracts', 'kontraktów')|E] może być trudne lub niemożliwe, dopóki nie pozyskasz [Concept('associates', 'partnerów')|E]#!"
 gdp_merchant.1002.f.tt.associates: "Rozpoczynasz bez początkowych [Concept('associates', 'partnerów')|E] – tylko z członkami [Concept('family', 'rodziny')|E] i [Concept('friends', 'przyjaciółmi')|E]"
 gdp_merchant.1003.t: "Założenie kompanii"
 gdp_merchant.1003.desc: "Na moich oczach [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] wypełnia się tłumem. Bezustannie dobija się tu targu, a [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] zmieniają właściciela.\n\nGwar handlu jest wszechobecny: skrzypiące koła wozów, ryk zwierząt w ciasnych zagrodach, a ponad tym zgiełkiem wrzeszczący kupcy, pragnący wyprzedzić konkurencję.\n\nZ rąk do rąk przechodzą tu wszelkie dobra – jeśli mam rywalizować z tyloma handlarzami, chyba muszę skupić swe wysiłki."
 gdp_merchant.1003.a: "– Kluczowe znaczenie ma dbanie o transport towaru luzem."
 gdp_merchant.1003.b: "– Musimy wykorzystać opinię, jaką [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] ma na nasz temat."
 gdp_merchant.1003.b.tt: "Powstanie [patron_contract|El]"
 gdp_merchant.1003.c: "– Jesteśmy kupcami. Liczy się tylko zysk."
 gdp_merchant.1100.t: "Przeludniona kompania"
 gdp_merchant.1100.desc: "[plaintiff.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', plaintiff)], podchodzi do mnie w moim gabinecie, z namysłem dobierając słowa.\n\n– [ROOT.Char.GetFirstNameNoTooltip]… to przecież ma być rodzinny interes, a tymczasem coraz bardziej polegamy na osobach z zewnątrz.\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] musi pozbyć się nadmiaru pracowników, jeśli chcemy utrzymać naszą pozycję."
 gdp_merchant.1100.a: "– [associate_2.GetFirstNameNoTooltip] już nam się nie przyda."
 gdp_merchant.1100.b: "– Pora rozstać się z osobą znaną jako [associate_1.GetFirstNameNoTooltip]."
 gdp_merchant.1100.c: "– Pozbądźmy się zatem owego nadmiaru…"
 gdp_merchant.1100.d: "– Bzdura. Każda pomoc się przyda."
 merchant_overcrowding_ignored_loss: "ignoruje przeludnienie w kompanii"
 merchant_overcrowding_fired_gain: "zwalnia partnera w celu rozwiązania problemu przeludnienia"
 merchant_overcrowding_yeet_gain: "zwalnia partnerów w celu rozwiązania problemu przeludnienia"
 gdp_merchant.1200.t: "Pytanie partnera"
 gdp_merchant.1200.desc: "Po długim dniu spędzonym nad księgami widzę, jak [requester.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', requester)], kręci się przy moich drzwiach, czekając, by mnie zagadnąć.\n\n– Och, [ROOT.Char.Custom2('RelationToMeAddress', requester)]! Od dawna chcę o coś zapytać…\n\n"
 gdp_merchant.1200.desc.artifact: "– Kompania świetnie prosperuje pod twoim kierownictwem, a przez jej księgi przewija się masa cennych przedmiotów. Raczej nie zgodzisz się, żeby… jeden z nich został u mnie na stałe?"
 gdp_merchant.1200.desc.activity: "– Kompania ciężko pracuje, a ty prowadzisz nas pewną ręką, ale czy nie nadszedł już czas, żebyśmy uczcili nasze sukcesy czymś, co na długo pozostanie w naszej pamięci?"
 gdp_merchant.1200.desc.luxury_contract: "– Szlaki kompanii świetnie prosperują pod twoim kierownictwem, lecz na świecie z pewnością jest jeszcze wiele cudów, które tylko czekają, by je odkryć…"
 gdp_merchant.1200.a: "– Doskonale. Zobaczę, co da się zrobić."
 gdp_merchant.1200.b: "– Daj spokój, mam lepsze rzeczy do roboty."
