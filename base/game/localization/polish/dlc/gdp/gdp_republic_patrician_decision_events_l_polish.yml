l_polish:
 city_stroll_prefix: "Promenada miejska"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: znalezione, nie kradzione"
 gdp_republic_patrician_decision.1000.desc: "Skręcam w zaułek przy głównej ulicy i trafiam na środek rozmowy, jaką prowadzi ktoś z miejscowych przekupniów:\n\n– …i nikt nie przyszedł tego odebrać – mówi [local_character.GetWomanMan], wzruszając ramionami, i wskazuje swojemu towarzyszowi zaśmiecające zaułek skrzynie, które wypełnia towar – [abandoned_trade_good.GetNameNoTooltip|l].\n\nNikt się po to nie zgłasza, nikt nie rości sobie praw do tego. Szybko szacuję ładunek. To #EMP okazja#!."
 gdp_republic_patrician_decision.1000.a: "Może by tak stworzyć trochę popytu…"
 gdp_republic_patrician_decision.1000.a.flavor: "Skrzynie z towarem okazują się zniszczone, a ich zawartość roztrzaskana."
 gdp_republic_patrician_decision.1000.b: "– O-ho, to moje, widzisz!"
 gdp_republic_patrician_decision.1000.c: "– Ach, [abandoned_trade_good.GetNameNoTooltip|l]! [liege_scope.GetTitledFirstNameNoTooltip] szuka tej zguby! Stokrotne dzięki."
 gdp_republic_patrician_decision.1000.d: "Cóż, to nie moja sprawa."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: dzień w ogrodzie"
 gdp_republic_patrician_decision.1010.desc: "Odkrywam ukrytą oazę, prawdziwy nieoszlifowany klejnot: mały ogród schowany wśród zakamarków i zaułków miasta znanego jako [city_location.GetTitle.GetNameNoTier]. Ścieżki pamiętają lepsze czasy, a roślin jest niewiele, ale są zadbane. To miejsce ma bardzo oddanego opiekuna.\n\nWśród zieleni przebywają grupki szlachciców, ale i kupców, prostych ludzi i robotników, którzy cieszą się chwilą wytchnienia od pracy.\n\nPrzechadzam się niespiesznie, z nieco lżejszym duchem, a moje brzemiona wydają się nieco łatwiejsze do zniesienia."
 gdp_republic_patrician_decision.1010.a: "Zrobimy z tego najpiękniejszy ogród, jakim będzie się mogło poszczycić to miejsce!"
 gdp_republic_patrician_decision.1010.b: "A co to za roślinka?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "Znajdujesz intrygujące rośliny"
 gdp_republic_patrician_decision.1010.b.health_plant: "Znajdujesz dobroczynne zioła"
 gdp_republic_patrician_decision.1010.c: "Pozwolę sobie… trochę się wyluzować…"
 gdp_republic_patrician_decision.1010.c.flavor: "Pełen luz. Jakie to relaksujące!"
 gdp_republic_patrician_decision.1010.c.success: "Nikt cię nie zauważa"
 gdp_republic_patrician_decision.1010.c.failure: "Zauważono cię"
 gdp_republic_patrician_decision.1010.d: "Cudownie!"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: [city_location.GetTitle.GetNameNoTierNoTooltip] i tamtejszy wielki plac"
 gdp_republic_patrician_decision.1020.intro: "Bez względu na politykę i intrygi szlachty i władców z ziem [city_location.GetCounty.GetTitle.GetAdjective] życie na wielkim placu toczy się dalej."
 gdp_republic_patrician_decision.1020.intro.01: "[ROOT.Char.Custom('GetLocalStreetFood')|U] wypełnia swoim zapachem moje nozdrza, a w kuchniach buzuje ogień."
 gdp_republic_patrician_decision.1020.intro.02: "Krnąbrny osioł ryczy na właściciela, który wściekle próbuje go obmyć wodą, zmywając warstwy zaschniętego błota."
 gdp_republic_patrician_decision.1020.intro.03: "Kilkoro starszych mieszkańców przechadza się, z dezaprobatą pomrukując na ceny chleba i zarozumiałość dzisiejszej młodzieży."
 gdp_republic_patrician_decision.1020.intro.04: "Nad okolicą krążą liczne [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l], łakomie zerkając na miejscowe stragany z jedzeniem."
 gdp_republic_patrician_decision.1020.intro.rain: "Tego ranka wszystko nosi ślady wczorajszej ulewy."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nNieopodal zauważam grupę żołnierzy – nie są stąd. [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip] to dla nich obca ziemia. Wyglądają na zagubionych i rozglądają się z niepokojem. Z tego, co udaje mi się podsłuchać z ich chwilami gorących rozmów, szukają nowego patrona."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nNa skraju placu jakaś szorstka postać obrzuca przechodniów posępnym spojrzeniem. Gdy podchodzę bliżej, słyszę, jak lamentuje nad niedawnym zerwaniem prestiżowego kontraktu kupieckiego z rodem [liege_scope.GetHouse.GetBaseName]. Zasłużony kupiec, od którego odwróciło się szczęście?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nNa środku placu, na stosie skrzyń, medyk właśnie kończy wykład o płynach ustrojowych i o tym, jak łatwiej zrównoważyć czarną żółć. Z wahaniem kiwam głową na znak zgody.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nNa straganie w zacienionym kącie placu dostrzegam pewien idealny przedmiot, który z pewnością pomógłby w moim spisku „[scheme_to_boost.GetName]”…$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nSpoglądając na plac, zauważam, że coś odbija światło. Mrużę oczy, wpatrując się w ziemię, by znaleźć źródło, i dostrzegam małą błyskotkę niemal całkowicie przykrytą brudem.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nPo drugiej stronie placu grupkę zubożałych chłopów ktoś wyprowadza poza teren. Jedno z małych dzieci wydaje rozdzierający serce krzyk, pełen głodu i strachu, a gapie robią, co mogą, by nie zwracać uwagi na tę żałosną gromadkę."
 gdp_republic_patrician_decision.1020.outro: "\n\nMój sługa dyskretnie odchrząkuje, dając mi znać, że czas wracać do domu i zająć się innymi obowiązkami."
 gdp_republic_patrician_decision.1020.a: "Dam radę wykarmić jedną czy dwie gęby."
 gdp_republic_patrician_decision.1020.b: "Ci żołnierze mogą się przydać…"
 gdp_republic_patrician_decision.1020.c: "Hmm, kompetentny handlarz zawsze się przyda…"
 gdp_republic_patrician_decision.1020.d: "Ten medyk powinien dla mnie pracować."
 gdp_republic_patrician_decision.1020.e: "Najpierw praca, spacery później."
 gdp_republic_patrician_decision.1020.f: "Tylko to wyczyszczę…"
 gdp_republic_patrician_decision.1020.g: "Tyle miejsc do zobaczenia, tylu ludzi do poznania!"
 gdp_republic_patrician_decision.1020.g.alternate: "Ach, [GetPlayer.GetCapitalLocation.GetNameNoTooltip] – dzień jak co dzień."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: [city_location.GetTitle.GetNameNoTierNoTooltip] i tamtejszy port"
 gdp_republic_patrician_decision.1030.desc: "Zapach ryb i gnijących wodorostów gęstnieje, im bliżej jesteśmy miejscowego portu. Rybacy z rodzinami – matkami i małymi dziećmi – a także stado bezpańskich kotów kręcą się po okolicy, wykonując codzienne obowiązki.\n\nPrzechodząc obok, słyszę, jak dwóch rybaków się żali:\n\n– …i nowe haczyki my kupili. Ale ile więcej dałoby się zrobić z nowymi sieciami… – Milkną, gdy zauważają moją obecność."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nPomrukuję i kiwam głową."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nPomrukuję i kiwam głową, a bezpański kot łasi mi się do nogi, głośno mrucząc."
 gdp_republic_patrician_decision.1030.a: "– Może dam się przekonać do zakupu nowych sieci…"
 gdp_republic_patrician_decision.1030.a.flavor: "Te sieci mogą wyłowić niezły #EMP zysk#!!"
 gdp_republic_patrician_decision.1030.b: "– Ile zapłacę, jeśli kupię wasze ryby hurtem?"
 gdp_republic_patrician_decision.1030.c: "Kotek!"
 gdp_republic_patrician_decision.1030.d: "– Piękny dzień, prawda?"
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')|l]"
 gdp_republic_patrician_decision.1040.desc: "Podczas niespiesznego spaceru natrafiam na najnowsze przedsięwzięcie osoby znanej jako [liege_scope.GetTitledFirstNameNoTooltip] na wielkim placu – to [ROOT.Char.Custom('GetGreatProjectDescription')].\n\nNadzorca robót wydaje się jednak mieć mały kłopot – raz po raz zerka na arkusz z nazwiskami i pieczęciami, drapiąc się po głowie:\n\n– Ten… hojny datek… pieczęć jest ułamana… kto mógł go przysłać, hmm…\n\nAnonimowy datek na projekt? #EMP Intrygujące.#!"
 gdp_republic_patrician_decision.1040.a: "– To mój wkład! Myśmy go wnieśli!"
 gdp_republic_patrician_decision.1040.a.success: "Przypisujesz sobie zasługę za wkład"
 gdp_republic_patrician_decision.1040.a.failure: "Wszystko wychodzi na jaw"
 gdp_republic_patrician_decision.1040.b: "– Wkład od osoby znanej jako [liege_scope.GetTitledFirstNameNoTooltip]! Wspaniale!"
 gdp_republic_patrician_decision.1040.c: "Cóż, to nie moja sprawa."
 gdp_republic_patrician_decision.1040.c.flavor: "Mam pewność, że odkryją prawdę."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] – ten projekt zyskuje datek: [contribution_to_fund.GetName|l]"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: problemy na starcie"
 gdp_republic_patrician_decision.1100.desc: "Ostatni raz poklepuję sakiewkę, zanim wyjdę z gabinetu na przechadzkę po uroczych ulicach miasta znanego jako [city_location.GetTitle.GetNameNoTier].\n\nRozlega się głuche #EMP łup#!, gdy ocieram się czołem o drzwi. Przeklęte #EMP ani drgną#!! Czyżby spuchły?\n\nRozglądam się po pokoju – owszem, jest okno, ale upadek z pewnością skończyłby się złamaniem kości czy dwóch.\n\nPróbuję coś wymyślić."
 gdp_republic_patrician_decision.1100.a: "– Ha… halo? Straże? SŁUŻBO?!"
 gdp_republic_patrician_decision.1100.a.flavor: "Nie, ściany się do siebie nie zbliżają. Nie zbliżają się… prawda?"
 gdp_republic_patrician_decision.1100.b: "Lądowanie pod oknem powinno być dość miękkie!"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "Moje ciało domaga się ćwiczeń!"
 gdp_republic_patrician_decision.1100.d: "To ja po prostu… wrócę do swojego biurka."
