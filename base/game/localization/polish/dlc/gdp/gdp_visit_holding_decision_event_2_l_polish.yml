l_polish:
 gdp_visit_holding_decision_event.1200.t: "Wizyty u patrona"
 gdp_visit_holding_decision_event.1200.intro_desc: "Gdy wchodzę do miejsca znanego jako [ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l], którym jest [ROOT.Char.GetCurrentLocation.GetName], onieśmiela mnie jego przepych. Wszędzie, gdzie nie spojrzę, są bezcenne artefakty i ozdoby: gobeliny utkane z materiału o nazwie [patron.Custom('RegionalFabric')], rzeźby, a także meble wykonane po mistrzowsku. W powietrzu unosi się bogaty aromat dania znanego jako [patron.Custom('GetExpensiveMeal')].\n\nGubiąc się wśród pędzących służących,"
 gdp_visit_holding_decision_event.1200.all_available_desc: "dostrzegam osobę, którą jest [steward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], oznajmiającą moje przybycie, a w pobliżu stoi [patron.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Muszę się wyprostować i przedstawić swoją propozycję."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "dostrzegam osobę, którą jest [patron.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zapraszającą mnie gestem, by podejść bliżej. Zgaduję, że jestem [patron.Custom('PL_jego_jej')] najwyższym priorytetem. Muszę się wyprostować i przedstawić swoją propozycję."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "dostrzegam osobę, którą jest [steward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zapraszającą mnie gestem, by podejść bliżej. Nie wiem jednak, gdzie jest [patron.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Zgaduję, że ma zbyt wiele na głowie, by się ze mną spotkać. Muszę się wyprostować i przedstawić swoją propozycję."
 gdp_visit_holding_decision_event.1200.representative_desc: "dostrzegam osobę, którą jest [negotiator.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], czekającą, aby mnie przyjąć w imieniu osoby znanej jako [patron.GetTitledFirstNameNoTooltip], o której mi powiedziano, że jest niedysponowana. Muszę się wyprostować i przedstawić swoją propozycję."
 gdp_visit_holding_decision_event.1200.none_available_desc: "staram się znaleźć osobę znaną jako [patron.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] lub kogokolwiek innego, aby przedstawić swoją prośbę, lecz bez skutku. Chyba należało wcześniej umówić spotkanie."
 gdp_visit_holding_decision_event.1200.a: "Chcę zwiększonej kontroli nad rynkami kultury znanej jako [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip|l]."
 gdp_visit_holding_decision_event.1200.a.tt: "Twoja propozycja może stworzyć następujące możliwości:$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "Poszukam możliwości do inwestycji."
 gdp_visit_holding_decision_event.1200.b.tt: "Poszukiwania inwestycji finansowych mogą stworzyć następujące możliwości:$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.c: "Z drugiej strony…"
 gdp_visit_holding_decision_event.1200.c.tt: "Czas wrócić i sprawdzić, co miejsce znane jako [THIS.Char.GetCurrentLocation.GetName] ma jeszcze do zaoferowania"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "Lista moich partnerów robi wrażenie na osobie, którą jest [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "Wspomniane przeze mnie nazwiska są nieistotne"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "Wywołuję oburzenie swoimi słowami"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "Moje umiejętności organizacyjne przekonują osobę, którą jest [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "Gubię się w swoich argumentach"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "Moja księga sugeruje defraudację"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "Udaje mi się przekonać osobę, którą jest [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip] nie daje się przekonać"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip] czuje urazę, słysząc moje kłamstwa"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.GetTitledFirstNameNoTooltip] jest pod wrażeniem mojej wiedzy"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "Moje szczegółowe wywody o teorii ekonomicznej nudzą osobę, którą jest [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "W jakiś sposób sprawiam, że [negotiator.GetTitledFirstNameNoTooltip] czuje się głupio"
 gdp_visit_holding_decision_event.1200.a_martial.success: "[negotiator.GetTitledFirstNameNoTooltip] jest pod wrażeniem mojej wiedzy z zakresu logistyki wojskowej"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "Sprawiam wrażenie oszusta"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "Moje przykłady brzmią jak groźby"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.GetTitledFirstNameNoTooltip] jest pod wielkim wrażeniem mojej potęgi"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip] ziewa"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip] mylnie uznaje mój fizyczny gest za groźbę"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "Niedawno zwrócono się z prośbą do osoby znanej jako [patron.GetShortUINameNotMe] o przyznanie przywilejów handlowych – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "Niedawno przehandlowano złoto na prestiż z osobą znaną jako [patron.GetShortUINameNotMe] – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: konkurencyjny rynek"
 gdp_visit_holding_decision_event.1201.all_available_desc: "Osoba, którą jest [steward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zaprasza mnie bliżej zachęcającym gestem. Pospiesznie przeglądam swoją propozycję po raz ostatni, zanim podejdę. Dla kompani kupieckiej rodu [ROOT.Char.GetHouse.GetName] jest to sprawa najwyższej wagi, aby ta umowa doszła do skutku.\n\nPodchodząc bliżej, wyczuwam wyższość, jaką emanuje [patron.GetFirstName].\n\n– Przedstaw jasno swoją ofertę, a być może pozwolę sobie ją rozważyć…"
 gdp_visit_holding_decision_event.1201.patron_available_desc: "Osoba, którą jest [steward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zaprasza mnie bliżej onieśmielającym gestem. Pospiesznie przeglądam swoją propozycję po raz ostatni, zanim podejdę. Dla kompani kupieckiej rodu [ROOT.Char.GetHouse.GetName] jest to sprawa najwyższej wagi, aby ta umowa doszła do skutku.\n\nPodchodząc bliżej, wyczuwam wyższość, jaką emanuje [patron.GetFirstName].\n\n– Przedstaw jasno swoją ofertę, a być może pozwolę sobie ją rozważyć…"
 gdp_visit_holding_decision_event.1201.steward_available_desc: "Osoba, którą jest [steward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zaprasza mnie bliżej zachęcającym gestem. Pospiesznie przeglądam swoją propozycję po raz ostatni, zanim podejdę. Dla kompani kupieckiej rodu [ROOT.Char.GetHouse.GetName] jest to sprawa najwyższej wagi, aby ta umowa doszła do skutku.\n\n– Przedstaw jasno swoją ofertę, a ja ocenię, czy leży ona w najlepszym interesie osoby znanej jako [patron.GetTitledFirstName]…"
 gdp_visit_holding_decision_event.1201.representative_desc: "Osoba, którą jest [steward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zaprasza mnie bliżej miarowym gestem. Pospiesznie przeglądam swoją propozycję po raz ostatni, zanim podejdę. Dla kompani kupieckiej rodu [ROOT.Char.GetHouse.GetName] jest to sprawa najwyższej wagi, aby ta umowa doszła do skutku.\n\n– Przedstaw jasno swoją ofertę, a ja ocenię, czy leży ona w najlepszym interesie osoby znanej jako [patron.GetTitledFirstName]…"
 gdp_visit_holding_decision_event.1201.a: "– Pozwól, że przejrzę propozycję kontraktu…"
 gdp_visit_holding_decision_event.1201.b: "– Twoje słowa są wiążące, zgadza się?"
 gdp_visit_holding_decision_event.1201.c: "Nieważne."
 gdp_visit_holding_decision_event.1201.c.tt: "Czas wrócić na audiencję i przekonać się, co jeszcze można zaproponować"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: propozycja inwestycji"
 gdp_visit_holding_decision_event.1202.all_available_desc: "Stoję obok bezczynnie, gdy [patron.GetFirstName] czyta moją propozycję. Jego brwi marszczą się w lekkim grymasie, gdy unosi wzrok znad dokumentów.\n\n– Hmm… Rozumiem. Chyba mógłbym rozważyć poręczenie za ciebie i kompanię rodu [ROOT.Char.GetHouse.GetName] za tę sumę. Dzięki temu zapewne zyskasz nieco poważania, prawda?"
 gdp_visit_holding_decision_event.1202.patron_available_desc: "Osoba, którą jest [patron.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], wydaje się być dość zainteresowana odczytywaną przeze mnie propozycją, sądząc po jej czarującym wyrazie twarzy.\n\n– Dzięki temu zyskasz nieco poważania."
 gdp_visit_holding_decision_event.1202.steward_available_desc: "Cierpliwie stoję obok, gdy [steward.GetFirstName] czyta moją propozycję. Wyraźnie ciekawi [steward.Custom('PL_go_ja')] jej treść, znowu podnosi na mnie wzrok.\n\n– Przyznaję, ta propozycja jest dobrze napisana… Chyba mógłbym rozważyć poręczenie za ciebie i kompanię rodu [ROOT.Char.GetHouse.GetName] osobie znanej jako [patron.GetTitledFirstName]"
 gdp_visit_holding_decision_event.1202.representative_desc: "Cierpliwie stoję obok, gdy osoba, którą jest [negotiator.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], czyta moją propozycję w imieniu osoby znanej jako [patron.GetTitledFirstNameNoTooltip]. Po zakończeniu lektury podnosi na mnie wzrok; widać, że tekst [negotiator.Custom('PL_go_ja')] zaciekawił.\n\n– Ta propozycja jest dobrze napisana… [patron.GetTitledFirstNameNoTooltip] zapozna się z nią. Zadbam, żeby tak się stało."
 gdp_visit_holding_decision_event.1202.a: "– Może mamy szansę ponegocjować…"
 gdp_visit_holding_decision_event.1202.b: "– Przyjmuję twoją propozycję."
 gdp_visit_holding_decision_event.1202.b.success: "Udana transakcja!"
 gdp_guards_were_summoned.tt: "[patron.GetShortUINameNotMe] nie chce cię na razie widzieć – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]"
 gdp_caught_stealing.tt: "Niedawno przyłapano cię na okradaniu świętego miejsca – wygnanie skończy się [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]"
 gdp_visit_holding_decision_event.1000.b.tt: "Zwrócenie się do twojego [Concept('merchant_patron', 'patrona')|E] może stworzyć następujące możliwości:$gdp_visit_holding_decision_effect_competitiveness$$gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Twój [merchant_patron|El] lub [patron.Custom('PL_jego_jej')] przedstawiciel muszą być obecni"
 gdp_visit_holding_decision_event.1500.t: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] w baronii o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] – wizyta"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] i tutejsze okolice wyglądają tak jak przedtem. Słońce powoli przemierza niebo, a sąsiadujące z placem budowle na zmianę rzucają cienie na otwartą przestrzeń."
 gdp_visit_holding_decision_event.1500.desc_returned_02: "Intensywna woń kadzideł wkrada mi się do nosa, gdy wędruję w przyćmionych promieniach słońca w drodze do miejsca, którym jest [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] i okolice."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "Mrużę oczy, gdy wychodzę z półmroku spowijającego chatkę uzdrowiciela, wracając na plac, przy którym stoi [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "Wracam na plac, przy którym wznosi się [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], a kiedy przekraczam bramę, wciąż czuję arkadyjski spokój."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "Wracam z pogodnego ogrodu, czując przyjemną lekkość, i spoglądam na ruchliwy plac, przy którym wznosi się [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "Wracam krętymi uliczkami z miejsca, w którym [merchant_physician_recruit.GetFirstNameNoTooltip] ma swój gabinet, i docieram na tereny, przy których wznosi się [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U], a właściwie przyległy plac, przepełnia swego rodzaju spokój, mimo że dookoła kręcą się [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural] i ich pomocnicy, a wszędy kwitnie handel.\n\n[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U], wspaniały monument wiary, stoi pośrodku wszystkiego. Po bokach zauważam szyldy uzdrowicieli i dobudówkę z ogrodem, w którego ciszy można kontemplować bóstwo, którym jest [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nNa obrzeżu placu jakiś dewota wygłasza kazanie o utrzymywaniu ciała w zdrowiu. Zgodnie z wcześniejszymi ustaleniami, jako że [1500_sickly_minor.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))], choruje, oczekuje już na mnie w chatce uzdrowiciela."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nNa obrzeżu placu jakiś dewota wygłasza kazanie o tym, jak utrzymywanie ciała w zdrowiu zachowa też krzepkość ducha, nie ulegając przy tym okazjonalnym zaczepkom i pokrzykiwaniom zebranych wokół wieśniaków."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nZgodnie z ustaleniami [1500_sickly_minor.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))], czeka na mnie w chatce uzdrowiciela po odprowadzeniu przez jednego z moich sług."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] kiwa głową z uznaniem i rozgląda się po ruchliwym placu, od razu zwracając uwagę na interesujące stragany i przykuwające wzrok miejsca."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nCzuję zadowolenie, rozglądając się po placu. Biorę kilka głębokich wdechów i zastanawiam się nad tym, gdzie teraz pójść."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName] powoli zaczyna przegrywać ze zmęczeniem.\n\n– Nie chcę narzekać, ale… chyba udało nam się tu już wszystko załatwić, [visiting_partner.Custom2('RelationToMeVocative', ROOT.Char)]?"
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nPo spędzeniu znacznej ilości czasu na placu, przy którym stoi [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], czuję satysfakcję z dzisiejszego dnia i podjętych przeze mnie decyzji. Rozglądam się, szukając najkrótszej drogi powrotnej na główny rynek."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\nDewota dalej ciągnie swoje kazanie o zdrowiu, ale zdaje się już zmierzać ku końcowi."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nZ jakiegoś powodu na placu zaczęło roić się od dzieciaków. A może były tu od samego początku? Bawią się i spierają ze sobą, co i rusz znajdując nowe sposoby na robienie tych samych rzeczy co zawsze, ku rozczarowaniu i – mimo wszystko – niewielkiemu zaskoczeniu swych opiekunów.\n\n[1500_sickly_minor.GetFirstName] wciąż zajmuje mi głowę swoim stanem zdrowia. Rozglądam się po placu, szukając kolejnego miejsca, do którego można się udać."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\nPo mojej lewej [visiting_partner.GetFirstName] z ciekawością przygląda się stoisku zastawionemu najróżniejszego rodzaju maleńkimi buteleczkami, rzekomo wypełnionymi kroplami jadu niebezpiecznego zwierza, którym jest [ROOT.Char.Custom('VenomousCreature')].\n\nSamo myślenie o nim przyprawia mnie o dreszcze, dlatego próbuję się zdecydować, gdzie teraz pójść."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] trąca mnie w ramię, wskazując na strażników, którzy wyprowadzają stąd kogoś odzianego w same łachmany, wykrzykującego proroctwa o końcu świata.\n\nOdruchowo unoszę brwi, obserwując zamieszanie podczas rozważań co do kolejnych kroków."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] częstuje mnie jedzeniem, gdy przechodzimy przez plac.\n\nW wielkim skupieniu przeżuwam suchy prowiant, dumając nad tym, co teraz zrobić."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nW ciemnym zaułku przy placu jakiś cwaniak próbuje przekonać kogoś ze szlachty o leczniczych właściwościach czerwonego piasku.\n\nObserwuję ich dyskusję bez większego namysłu, jako że dumam nad tym, co teraz zrobić."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nNa pobliskim straganie obwieszonym obsydianowymi lustrami [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] stara się ukryć podniecenie, gdy w końcu może dokładnie przyjrzeć się swojemu odbiciu.\n\nTrochę mnie to bawi, ale staram się skupić na podjęciu decyzji o tym, gdzie teraz pójść."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nPrzy małej rotundzie jakiś cwaniak, ku uciesze skromnej widowni, czyta na głos kopię tekstu, który brzmi jak [ROOT.Char.Custom('RandomReligiousTextName')].\n\nSłucham go bez większej uwagi, obserwując plac i dumając nad tym, co teraz zrobić."
 gdp_visit_holding_decision_event.1500.a: "Będę szukać błogosławieństwa uzdrowicieli."
 gdp_visit_holding_decision_event.1500.a_second: "Wrócę do uzdrowicieli."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Może [1500_sickly_minor.GetFirstNameNoTooltip] otrzyma pomoc od uzdrowicieli."
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip] wciąż na mnie czeka."
 gdp_visit_holding_decision_event.1500.a.tt: "Dzięki wizycie u medyków możesz mieć okazję, aby:$gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "Niedawno odwiedzono uzdrowicieli – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]"
 gdp_visit_holding_decision_event.1500.b: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] w tym miejscu ma w sobie coś intrygującego."
 gdp_visit_holding_decision_event.1500.b_second: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] jest wystarczającym powodem dla kolejnej wizyty."
 gdp_visit_holding_decision_event.1500.b.tt: "Dzięki wizycie w lokalnym miejscu kultu możesz mieć okazje, aby:$gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "Niedawno odwiedzono lokalne miejsce kultu – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]"
 gdp_visit_holding_decision_event.1500.c: "Ogrody wyglądają interesująco."
 gdp_visit_holding_decision_event.1500.c_second: "Jeszcze raz obejrzę ogrody."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ Kontemplować wiarę i zmniejszyć poziom [Concept('stress', 'stresu')|E]"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ Zebrać zapasy"
 gdp_visit_holding_decision_event.1500.c.tt: "Dzięki wizycie w ogrodzie możesz mieć okazje, aby:$gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "Niedawno odwiedzono ogrody – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]"
 gdp_visit_holding_decision_event.1500.d: "Czy tam jest kaznodzieja?"
 gdp_visit_holding_decision_event.1500.d_second: "Ja i [merchant_physician_recruit.GetFirstNameNoTooltip] mamy niedokończone sprawy."
 gdp_visit_holding_decision_event.1500.d.tt: "Dzięki rozmowie z medykiem możesz mieć okazję, aby:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "Zajmę się innymi sprawami."
 gdp_visit_holding_decision_event.1501.intro: "Światło w chatce uzdrowiciela jest przygaszone, a w powietrzu unosi się specyficzny #EMP zapach#!. Nie jest #EMP nieprzyjemny#!, tylko nachalny.\n\n[merchant_healer_character.GetFirstName] stoi przy wysokim stole i zajmuje się przygotowywaniem jakiejś mikstury."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: uzdrowiciel"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ Od wejścia patrzy się na nas [merchant_healer_character.GetWomanMan] z uśmiechem na twarzy.\n\n– Witajcie w moim skromnym mieszkaniu! Jestem [merchant_healer_character.GetFirstNameNoTooltip]. Jak mogę wam pomóc?"
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "[1500_sickly_minor.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))], zmaga się z chorobą, dlatego zmierza ze mną do chatki uzdrowiciela i kaszle wątle, gdy znoszę [1500_sickly_minor.Custom('PL_go_ja')] po schodach.\n\nUzdrowiciel, którym jest [merchant_healer_character.GetFirstName], wstaje z drewnianego stołka i obdarza mnie ponurym spojrzeniem.\n\n– Potrzebujecie moich usług?"
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "Wchodzimy do chatki uzdrowiciela. [merchant_healer_character.GetFirstName] przeprowadza właśnie procedurę oczyszczania, której poddaje się [ROOT.Char.GetWomanMan] w podeszłym wieku. [visiting_partner.GetFirstName] przygląda się z uwagą wszystkiemu, co robi [merchant_healer_character.GetFirstNameNoTooltip], a w [visiting_partner.Custom('PL_jego_jej')] oku dostrzec można błysk podekscytowania.\n\n– Z chęcią spróbuję kiedyś przeprowadzić takie #EMP coś#!…\n\n[merchant_healer_character.GetFirstNameNoTooltip] podnosi wzrok, gdy docierają do [merchant_healer_character.Custom('PL_niego_niej')] nasze głosy.\n\n– Ach, przybysze! Czy coś wam dolega?"
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ Podnosi na mnie wzrok i unosi delikatnie brwi.\n\n– Widzę, że udało ci się wrócić w jednym kawałku! Jak mogę ci pomóc tym razem?"
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName] odpoczywa w chatce uzdrowiciela, wyczekując mojego powrotu na miękkim posłaniu nieopodal wciśniętego w róg piecyka. Instynktownie nachylam się, by sprawdzić, jak oddycha, i przeczesuję [1500_sickly_minor.Custom('PL_mu_jej')] włosy.\n\n[merchant_healer_character.GetFirstName] odkłada na bok [ROOT.Char.Custom('WritingInstrument')] i obdarza mnie ponurym spojrzeniem.\n\n– To jak się umawialiśmy?"
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "Wchodzimy do chatki uzdrowiciela. [merchant_healer_character.GetFirstName] pochyla się nad jakimiś ziołami, lecz gdy schodzimy po schodach, podnosi wzrok.\n\n– Czyżby zmiana zdania?\nPo mojej lewej [visiting_partner.GetFirstNameNoTooltip] przestępuje z nogi na nogę, wciąż chcąc spróbować własnoręcznie powtórzyć zabieg widziany wcześniej w wykonaniu osoby znanej jako [merchant_healer_character.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1501.desc_returned_01: "Gdy schodzę po schodach do chatki uzdrowiciela, [merchant_healer_character.GetFirstName] zajmuje się akurat innym chorym. Rzuca mi spojrzenie, a następnie wskazuje pacjentowi, by usiadł na posłaniu w głębi pomieszczenia.\n\n[merchant_healer_character.GetFirstName] zaciąga prowizoryczne zasłony wykonane z prześcieradła, które najlepsze dni ma już dawno za sobą, zapewniając tym jednak, zarówno nam, jak i pacjentowi, nieco prywatności.\n\n– Widzę, że powracasz – zauważa z zaangażowaniem. – Potrzebujesz mojej pomocy?"
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Schodząc do ledwie oświetlonej chatki uzdrowiciela, dostrzegam, że [merchant_healer_character.GetFirstName] siedzi nieco głębiej, wertując stronice wysłużonego dziennika lub jakiejś księgi. Z tej odległości ciężko stwierdzić, co ukazują zawarte w nim ilustracje, ale zdają się przedstawiać ludzkie ciało.\n\n[merchant_healer_character.GetFirstName] ostrożnie zamyka dziennik i chowa go gdzieś pod ręką, po czym spogląda na mnie i odzywa spokojnym głosem: – A więc powracasz. Czyżby jednak coś ci dolegało?"
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nKątem oka dostrzegam parę leczniczych błyskotek, spośród których moją uwagę przyciąga majestatyczny róg."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nNieco głębiej w pomieszczeniu [1500_health_artifact.GetName], wraz z całym swym majestatem, wciąż spoczywa obok przeróżnych medycznych błyskotek."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nNieco głębiej w pomieszczeniu, na półce wypełnionej po brzegi medycznymi błyskotkami, udaje mi się dostrzec coś interesującego. To [1500_health_artifact.GetName] i zdaje się wręcz błagać o moją uwagę."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nNieco głębiej w pomieszczeniu [1500_health_artifact.GetName] wciąż zdaje się wręcz błagać o moją uwagę."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "– Bardziej interesuje mnie [1500_health_artifact.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "– [1500_sickly_minor.GetFirstNameNoTooltip], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))], potrzebuje pomocy!"
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Nieudane leczenie"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "Leczenie zawodzi"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "Udane leczenie"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "Gdy docieramy do miejsca, którym jest [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], kazanie akurat się kończy. [merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] kręci się z miotłą w tę i we w tę, ostrożnie zamiatając świętą ziemię, by była gotowa dla odwiedzających, którzy przyjdą tu, aby się modlić lub pomyśleć nad życiem.\n\n[merchant_clergy_character.GetFirstName] podnosi na mnie wzrok, kiedy podchodzę bliżej, i rozciąga usta w delikatnym uśmiechu.\n\n– Witam ponownie w ciepłych, boskich objęciach. Może zostaniesz dłużej i nacieszysz się widokiem?"
 gdp_visit_holding_decision_event.1503.desc_returned_02: "Gdy [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] staje przede mną otworem, [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName] siedzi na jednej ze zwróconych w stronę ambony ławek i zdaje się pogrążać w rozmyślaniach.\n\nKiedy podchodzę bliżej, [merchant_clergy_character.GetFirstName] obraca się i spoziera na mnie znad ramienia.\n\n– Tyleż obowiązków. Daj tym zmęczonym stopom odpocząć choć na moment, moje dziecko. Jak mogę ci pomóc?"
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "Kiedy [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], a właściwie prowadzące do środka niezwykłe odrzwia stają przede mną otworem, widzę, jak osoby zajmujące się tym przybytkiem kończą dzielić między sobą dzisiejsze zadania.\n\nZerkam wzdłuż głównej nawy i, ku mojemu zaskoczeniu, widzę, jak nie kto inny, tylko [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName], podchodzi bliżej mnie i rzuca mi enigmatyczne spojrzenie.\n\n– Och, me krnąbrne dziecię. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] musi mieć cię w opiece, skoro stajesz w pełni zdrowia na mym progu!"
 gdp_visit_holding_decision_event.1503.desc: "Przekraczam bramę przybytku, którym jest [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]. Uderza mnie ogrom pracy włożonej w stworzenie tak okazałej budowli, ozdobionej świętymi dekoracjami.\n\nJedna z zajmujących się tym miejscem osób zauważa mnie i podchodzi spokojnym krokiem.\n\n– Witaj, moje dziecko. Jestem [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName]. Jak mogę ci pomóc?"
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "#EMP No dobrze#!…"
 gdp_visit_holding_decision_event.1503.b: "– Może [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] pobłogosławi naszą kompanię?"
 gdp_visit_holding_decision_event.1503.c: "To #EMP mnie#! należą się te datki."
 gdp_visit_holding_decision_event.1503.c_guarded: "Kolejna darowizna – prosto do #EMP mojej#! sakiewki."
 gdp_visit_holding_decision_event.1503.c_master_thief: "– Psst, [visiting_partner.GetFirstNameNoTooltip]! Stań na czatach!"
 gdp_visit_holding_decision_event.1503.c.flavor: "Odwrócić uwagę, zwinąć monety. Łatwizna."
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Hmm. Strażnicy na pewno nie bez powodu patrolują te miejsca zdecydowanie częściej niż pozostałe…"
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Udana kradzież"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "Udaje ci się ukraść datki"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "Wygnanie!"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "Od tej pory nie masz wstępu do miejsca, którym jest [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Wezwano straż"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "Gdy przekazuję datek, [merchant_clergy_character.GetFirstName] rozszerza w zdumieniu oczy.\n\n– Wyglądasz zupełnie jak [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]… [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]… Klnę się… – [merchant_clergy_character.GetFirstName] przygląda mi się przez chwilę, poruszając bezgłośnie ustami jak ryba wyrzucona na brzeg.\n\nWtedy, zrozumiawszy, co robi, bierze się w garść i odchrząkuje.\n\n– Poświęcenie życia #EMP twojej sprawie#! będzie dla mnie zaszczytem."
 gdp_visit_holding_decision_event.1504.desc: "[merchant_clergy_character.GetFirstName] uśmiecha się jeszcze szerzej, pochylając się nade mną i kładąc mi dłoń na ramieniu.\n\n– Cóż za łaskawość, moje dziecko. Domyślam się, że kupcowi takiemu jak ty wydawanie pieniędzy nie przychodzi łatwo.\n\n[merchant_clergy_character.GetFirstName] przytakuje własnym słowom. Gdy [merchant_clergy_character.Custom('PL_jego_jej')] ręka opada z mojego ramienia, [merchant_clergy_character.GetWomanMan] przygląda mi się uważnie."
 gdp_visit_holding_decision_event.1504.a: "– Może [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] pobłogosławi nasz interes?"
 gdp_visit_holding_decision_event.1504.a_epiphany: "– Interesuje mnie jedynie łaska [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]."
 gdp_visit_holding_decision_event.1504.b: "– Właściwie #EMP przydałby#! nam się kolejny sprawny człowiek."
 gdp_visit_holding_decision_event.1504.c: "– Niczym nie przejmuję się tak jak bliźnimi."
 gdp_visit_holding_decision_event.1504.c_epiphany: "Na tę chwilę nie szukamy nowych rekrutów."
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: ogród"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "W ogrodzie wciąż panuje spokój. Niektórzy odwiedzający rozsiedli się wygodnie i rozmawiają przyciszonymi głosami, a inni pogrążeni są w bezgłośnej kontemplacji natury.\n\nJa nasłuchuję szeptów i bryzy, wiatru w drzewach i… Nagle czuję, jak ogarnia mnie spokój."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "Tym razem moją uwagę przyciąga [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] – na gałęzi dostrzegam niewielkiego ptaszka, który przymierza się do swojego pierwszego lotu.\n\nGładko opada za krawędź gniazda, ale skrzydła mu się plączą i przez chwilę spada jak kamień… lecz za moment wiatr łagodnie przechwytuje ptaka i ponosi go w bezpieczne miejsce. W sercu czuję ulgę."
 gdp_visit_holding_decision_event.1505.desc: "Ogród okala żywopłot, a łagodne pagórki porośnięte są drzewami, pośród których dostrzec można czasem ptaka lub wiewiórkę.\n\nNapawając się tym pięknem, mocno odczuwam czyjąś obecność. Czy to możliwe, że w trakcie wszystkich moich perypetii cały czas towarzyszy mi [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]…?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nNa drodze, nieco przede mną, [visiting_partner.GetFirstName] po raz kolejny przygląda się jadalnym roślinom."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nNieco dalej na drodze dostrzegam w popołudniowym słońcu jeszcze więcej dziko rosnących smakołyków."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nSłyszę, jak za mną [visiting_partner.GetFirstName] mamrocze pod nosem za każdym razem, gdy natykamy się na kolejną (prawdopodobnie) jadalną roślinę."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nKątem oka dostrzegam przepysznie wyglądające dzikie owoce i zioła, które tylko podkreślają bujność ogrodu."
 gdp_visit_holding_decision_event.1505.a: "Ogarnia mnie spokój."
 gdp_visit_holding_decision_event.1505.a_convert: "Może wiara [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjectiveNoTooltip|l] ostatecznie nie jest taka zła."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "Niedawno kontemplowano ten ogród – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.b: "Byłoby szkoda, gdyby te smakołyki się zmarnowały."
 gdp_visit_holding_decision_event.1505.b_partner: "– [visiting_partner.GetFirstNameNoTooltip], może pozbieramy tu zapasy?"
 gdp_visit_holding_decision_event.1505.b_flavor: "Czas na zbiory!"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "Niedawno dokonano zbiorów w tym ogrodzie – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )]"
 gdp_visit_holding_decision_event.1505.c: "– #EMP [visiting_partner.GetFirstNameNoTooltip]#!, tyle tu ukrytych zakamarków…"
 gdp_visit_holding_decision_event.1505.c.flavor: "Coś wspaniałego."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "Niedawno odpoczywano w tym ogrodzie – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )]"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$: medyk"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "Drzwi do pracowni osoby znanej jako [merchant_physician_recruit.GetFirstName] są lekko uchylone. Przez szczelinę widzę, jak obcina włosy siedzącemu nieruchomo klientowi, używając przerażająco ostrych, smukłych nożyc.\n\nPukam do drzwi i wchodzę, a [merchant_physician_recruit.GetFirstNameNoTooltip] zwraca na mnie uwagę.\n\n– Nieźle się skradasz. Czego chcesz? – pyta."
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName] stoi przed drzwiami do swojej pracowni i bada czyjeś ramię; widać, że [ROOT.Char.GetWomanMan] odczuwa ból.\n\n[merchant_physician_recruit.GetFirstName] kończy wizytę, polecając pacjentowi jak najlepiej zadbać o chory staw, a następnie zwraca się do mnie.\n\n– Znowu ty. Czego chcesz tym razem?"
 gdp_visit_holding_decision_event.1507.desc_returned_03: "Wchodzę ostrożnie po schodach prowadzących do pracowni osoby znanej jako [merchant_physician_recruit.GetFirstName] i zaglądam do środka przez otwarte drzwi.\n\nWygląda na to, że oddaje się jakimś ćwiczeniom fizycznym, które wyciskają z [merchant_physician_recruit.Custom('PL_niego_niej')] siódme poty: co rusz robi przysiad, wstaje i zaczyna wszystko od nowa.\n\nPo określonej liczbie powtórzeń [merchant_physician_recruit.GetFirstName] przerywa ćwiczenia, ociera czoło, pociąga łyk z butelki, a następnie omiata mnie przenikliwym spojrzeniem.\n\n– Uparciuch z ciebie, prawda?"
 gdp_visit_holding_decision_event.1507_desc_intro: "Ruszam wąską alejką za osobą o imieniu [merchant_physician_recruit.GetFirstName], wchodzę po schodach i trafiam do [merchant_physician_recruit.Custom('PL_jego_jej')] pracowni. Od podłogi aż po sufit pomieszczenie wypełnione jest przeróżnymi przedmiotami; półki uginają się pod księgami i wydrukami na temat płynów humoralnych, zdrowia i duchowości.\n\n[merchant_physician_recruit.GetFirstName] siada za biurkiem na jedynym dostępnym krześle i w roztargnieniu bawi się niewielkim talizmanem. Wreszcie zauważa moją obecność."
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$\n\n– O, chyba skądś cię znam? Czego chcesz? Ostrożnie ważę słowa, zanim odpowiadam."
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$\"\n\n– O, to ty. Chcesz czegoś?– Przyszło mi wysłuchać twojego wykładu dla ubogich – odpowiadam i milknę w chwili zawahania, a potem ciągnę dalej:"
 gdp_visit_holding_decision_event.1507.a: "– Czy chcesz dla mnie pracować?"
 gdp_visit_holding_decision_event.1507.b: "– Pomóż mi wzmocnić ducha moich partnerów!"
 gdp_visit_holding_decision_event.1507.c: "– Musisz #EMP korzystać#! ze swoich umiejętności, by ich nie zatracić. Dołącz do mojej kompanii."
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUINameNotMe] zgadza się z twoim zdaniem"
 gdp_visit_holding_decision_event.1507.c.failure: "[merchant_physician_recruit.GetShortUINameNotMe] nie daje ci się zachęcić"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUINameNotMe] zaczyna cię ignorować"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "Czas wrócić i zobaczyć, co jeszcze [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] ma do zaoferowania"
