l_polish:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "Inwentaryzacja zapasów"
 gdp_trade_good_flavor.1001.desc: "Przed snem raz jeszcze przeliczam [tgf_good.Custom('GetTradeGoodUnitPlural')], w które spakowano towar o nazwie [tgf_good.Custom('GetTradeGood')]. Trzysta dwanaście sztuk i wszystkie już znalazły nabywców… przynajmniej w moich wyobrażeniach.\n\nLiczę je ponownie. Tak na wszelki wypadek."
 gdp_trade_good_flavor.1001.a: "Wszystkie są na swoim miejscu. Wszystkie należą do mnie."
 gdp_trade_good_flavor.1001.b: "Liczby w księgach muszą się zgadzać z moimi wyliczeniami."
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "Wieść się niesie"
 gdp_trade_good_flavor.1002.desc: "Dotarła do mnie wiadomość, że przy własnym stole [tgf_market_holder.GetTitledFirstName] nie szczędzi pochwał mojemu towarowi, którym są [tgf_good.Custom('GetTgfGoodLook')]. Pragnie zamówić więcej, a sąsiedzi słyszeli, jak otwarcie o tym mówi.\n\nPochwały są miłe dla ucha. Jeszcze milsze są pochwały płynące z ust człowieka, który wciąż wraca po kolejne zakupy."
 gdp_trade_good_flavor.1002.a: "Podarunek dla mego ulubionego klienta."
 gdp_trade_good_flavor.1002.b: "Zatem zapewne zapłaci więcej."
 gdp_trade_good_flavor.1002.c: "Niech sobie gadają."
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "Prosto ze źródła"
 gdp_trade_good_flavor.1003.desc: "„Tutejsi robotnicy, w których żyłach płynie [tgf_source_culture.GetName] krew, znają swoje rzemiosło co do [tgf_good.Custom('GetTgfGoodSmallest')]”, pisze mój handlarz, [tgf_trader.GetFirstName], z miejsca znanego jako [tgf_source_county.GetNameNoTier]. „To właśnie tutaj towar znany jako [tgf_good.Custom('GetTradeGood')] jest [tgf_good.Custom('GetTgfGoodMade')] i nikt nie idzie na skróty”.\n\nZnajomość źródła to połowa sukcesu w sprzedaży towaru."
 gdp_trade_good_flavor.1003.a: "Każdy szczegół ma swoją wartość."
 gdp_trade_good_flavor.1003.b: "Teraz już wiem, ile to powinno kosztować."
 gdp_trade_good_flavor.1003.c: "Wyrazy szacunku od jednego handlarza dla drugiego."
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "Szlak stoi otworem"
 gdp_trade_good_flavor.1004.desc: "Mój kupiec, [tgf_trader.GetFirstName], szczerzy się niczym człowiek, który zdążył już wydać swoją część zysku.\n\n– Cały szlak stoi przed nami otworem, a o twój towar, którym jest [tgf_good.Custom('GetTgfGoodLook')], pytają już, używając twojego nazwiska.\n\nDobre lata przemijają szybko. Trzeba zatem w pełni wykorzystać ten czas."
 gdp_trade_good_flavor.1004.a: "Sprzedaj towar, póki warunki sprzyjają."
 gdp_trade_good_flavor.1004.b: "Każdy pomyślny rok niesie ze sobą jakąś lekcję. Nie zmarnuj tej wiedzy."
 gdp_trade_good_flavor.1004.c: "Zainwestujcie w większą liczbę wozów!"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "Sny o zyskach"
 gdp_trade_good_flavor.1005.desc: "Znów ten sam sen… [tgf_good.Custom('GetTradeGood')]. [tgf_good.Custom('GetTradeGoodUnitPlural')|U] ułożone w stosy sięgające aż po krokwie, a na samym ich szczycie ja – przyglądam się kupcom na dole, którzy spierają się o to, kto zapłaci pierwszy.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "Znów ten sam sen… [tgf_good.Custom('GetTradeGood')]. Całe ich stada wypełniają każdy trakt wiodący na targ, a ja prowadzę tę kolumnę, licząc kupców, którzy pędzą nam na spotkanie.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "Budzę się ze śmiechem i zaczynam spisywać te liczby. Kiedyś zyskam bogactwo!"
 gdp_trade_good_flavor.1005.a: "Dlaczego miałoby to pozostać tylko snem?"
 gdp_trade_good_flavor.1005.a.tt: "Wkrótce pojawi się nowa [trade_opportunity|El]"
 gdp_trade_good_flavor.1005.b: "Moje rachunku okażą się słuszne. Dopilnuję tego osobiście."
 gdp_trade_good_flavor.1005.c: "Jeszcze pięć minut w bogactwie… Zz#DIE1 zz#!#DIE2 zz…#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "Głupcy, którzy to weryfikują"
 gdp_trade_good_flavor.1006.desc: "Mój handlarz, [tgf_trader.GetFirstName], bierze mnie na stronę w magazynie.\n\n– [tgf_good.Custom('GetTradeGood')|U] z miejsca znanego jako [tgf_source_county.GetNameNoTier]? [tgf_good.Custom('GetTgfGoodFlaw')|U]. Myślą, że mają do czynienia z głupcami, którzy niczego nie sprawdzają!\n\nPróbowali mnie oszukać. Zamiast tego zapewnili mi zniżkę."
 gdp_trade_good_flavor.1006.a: "Towar gorszej jakości powinien mieć niższą cenę."
 gdp_trade_good_flavor.1006.b: "Ha. Przechytrzyliśmy ich."
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "Poproś konkretnie o to"
 gdp_trade_good_flavor.1007.desc: "Mój handlarz, [tgf_trader.GetFirstName], przynosi dziwne wieści z miejsca znanego jako [tgf_source_county.GetNameNoTier].\n\n– [tgf_good.Custom('GetTradeGood')|U] to towar [tgf_good.Custom('GetTgfGoodSold')], a mimo to [tgf_source_culture.GetCollectiveNoun] domagają się konkretnie niego. Mówią: „#EMP [tgf_good.Custom('GetTradeGood')] od [ROOT.Char.GetHouse.GetName] proszę#!” i płacą więcej niż cena rynkowa! Zapasy są na wykończeniu!\n\nOkazuje się, że moje nazwisko samo w sobie ma wartość."
 gdp_trade_good_flavor.1007.a: "Oznaczcie wszystkie [tgf_good.Custom('GetTradeGoodUnit')] moją pieczęcią."
 gdp_trade_good_flavor.1007.b: "Sprzedawać, sprzedawać, sprzedawać!"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "[tgf_good.GetNameNoTooltip] – wycena"
 gdp_trade_good_flavor.1008.desc: "Dociera do mnie list opatrzony pieczęcią osoby znanej jako [tgf_market_holder.GetTitledFirstName].\n\n„Zaproponowano mi towar o nazwie [tgf_good.Custom('GetTradeGood')] sprzedawany na [tgf_good.Custom('GetTradeGoodUnitPlural')]. Chodzi o jedną sztukę, lecz mój zarządca nie ma oka do oceniania takich rzeczy. Zechcesz rzucić nań okiem wprawionego kupca?”\n\nSchlebia mi to, owszem, ale pochlebstwa zazwyczaj kosztują więcej."
 gdp_trade_good_flavor.1008.a: "Sama prawda, zważona i zmierzona."
 gdp_trade_good_flavor.1008.b: "Pierwszy raz widzę coś tak wspaniałego."
 gdp_trade_good_flavor.1008.c: "Za fachową opinię się płaci. Nie ma nic za darmo."
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "Nauka liczenia"
 gdp_trade_good_flavor.1009.desc: "Zastaję mego dziedzica w magazynie. Obiektem [tgf_heir.Custom('PL_jego_jej')] zainteresowania jest [tgf_good.Custom('GetTradeGoodUnit')]. W środku można znaleźć jedynie towar o nazwie [tgf_good.Custom('GetTradeGood')], ale [tgf_heir.GetFirstName] próbuje tam zajrzeć tak usilnie, jakby na samym dnie miały skrywać się monety.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "Zastaję mego dziedzica przy zagrodach. Obiektem [tgf_heir.Custom('PL_jego_jej')] zainteresowania jest [tgf_good.Custom('GetTradeGoodUnit')]. W środku można znaleźć jedynie towar o nazwie [tgf_good.Custom('GetTradeGood')], ale [tgf_heir.GetFirstName] przygląda się całości tak natarczywie, jakby pod skórą miały skrywać się monety.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "Masz dobry instynkt. Najwyższy czas, żeby ktoś go nieco wyostrzył."
 gdp_trade_good_flavor.1009.a: "Chodź popatrzeć, jak to robię."
 gdp_trade_good_flavor.1009.b: "Policz je. Dwa razy."
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "Naśladowca"
 gdp_trade_good_flavor.1010.desc: "Do miejsca znanego jako [tgf_source_county.GetNameNoTier] zwrócono mi skrzynię, jako powód podając „niezgodność z przyjętymi standardami”. Nie pochodzi ode mnie, ale ktoś skopiował moje oznaczenie w najdrobniejszych szczegółach.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "Do miejsca znanego jako [tgf_source_county.GetNameNoTier] zwrócono mi jedno z moich zwierząt, jako powód podając „niezgodność z przyjętymi standardami”. Nie pochodzi ode mnie, ale ktoś skopiował moje oznaczenie w najdrobniejszych szczegółach.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "Mój handlarz, [tgf_trader.GetFirstName], wskazuje fałszerza: to [tgf_rival.Custom('GetTgfCompanyWord')] [tgf_rival.GetHouse.GetBaseNameNoTooltip], a konkretnie [tgf_rival.GetFirstName]. Trzeba przyznać, że podróbki wykonuje doskonale."
 gdp_trade_good_flavor.1010.a: "Połóżcie kres temu fałszerstwu bez względu na cenę."
 gdp_trade_good_flavor.1010.b: "Niech każdy ród dowie się o tej zniewadze."
 gdp_trade_good_flavor.1010.c: "Dzięki podróbkom moje nazwisko staje się znane bez ponoszenia żadnych kosztów."
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe] sprawia, że fałszerstwa osoby znanej jako [tgf_rival.GetShortUINameNotMe] stały się kwestią sporu między ich rodami."
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe] sprawia, że fałszerstwa osoby znanej jako [target_char.GetShortUINameNotMe] stały się kwestią sporu między ich rodami."
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "[tgf_good.GetNameNoTooltip] – cena towaru"
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName], handlarz, którego zatrudnia [tgf_rival.Custom('GetTgfCompanyWord')] [tgf_rival.GetHouse.GetBaseNameNoTooltip], odnajduje mnie w magazynie i kładzie na stole ciężką sakiewkę.\n\n– Przysyła mnie [tgf_rival.GetFirstName]. Mojego pana interesuje pewien towar, mianowicie [tgf_good.Custom('GetTradeGood')]. Właściwie… pragnie poznać nazwiska tych, którzy nim handlują. Wszystkie. Ta sakiewka wyraża prośbę.\n\n[tgf_envoy.GetFirstName] nie próbuje kupić listy nazwisk. [tgf_envoy.GetSheHe|U] próbuje kupić lata mojej pracy."
 gdp_trade_good_flavor.1011.a: "To tylko kilka nazwisk skreślonych atramentem, ale najpierw zapłać."
 gdp_trade_good_flavor.1011.b: "Moje doświadczenie nie jest na sprzedaż."
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "Rozejm handlarzy"
 gdp_trade_good_flavor.1012.desc: "[tgf_good.Custom('GetTradeGood')|U] to towar, który sprzedaje [tgf_ally.GetFirstName] w miejscu znanym jako [tgf_source_county.GetNameNoTier]. Ja robię dokładnie to samo i z każdym sezonem coraz zacieklej rywalizujemy cenami, obniżając je do granicy opłacalności. Dziś dotarł do mnie list od [tgf_ally.Custom('PL_niego_niej')] z propozycją rozejmu: przestaniemy obniżać ceny i wszystkim nam będzie się dobrze żyć.\n\nOkazuje się, że pokój można kupić tak samo jak wszystko inne."
 gdp_trade_good_flavor.1012.a: "Zgoda. Każdy chce żyć godnie."
 gdp_trade_good_flavor.1012.b: "Potrafię wytrzymać bez jedzenia dłużej niż [tgf_ally.GetSheHe]."
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe] i [tgf_ally.GetShortUINameNotMe] uzgadniają, że przestaną wzajemnie zaniżać ceny towarów."
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe] i [target_char.GetShortUINameNotMe] uzgadniają, że przestaną wzajemnie zaniżać ceny towarów."
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "Cena tylko dla ciebie"
 gdp_trade_good_flavor.1013.desc: "Otrzymuję list opatrzony pieczęcią osoby znanej jako [tgf_market_holder.GetTitledFirstName].\n\n„[tgf_good.Custom('GetTradeGood')|U] to towar, który kupujesz na moim rynku. Jeśli będziesz nabywać ten towar wyłącznie tam, zapłacisz mniej, niż kiedykolwiek zapłacił jakikolwiek inny kupiec”.\n\nWyłączność to inne określenie smyczy. Trzeba jednak przyznać, że cena jest korzystna."
 gdp_trade_good_flavor.1013.a: "[tgf_market_holder.GetHerHis|U] rynek, moja zniżka. Załatwione."
 gdp_trade_good_flavor.1013.b: "Cudze rachunki nie będą mi dyktować warunków."
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "Zapytaj doświadczonych"
 gdp_trade_good_flavor.1014.desc: "Posiwiały tragarz składa ładunek w magazynie w miejscu o nazwie [tgf_source_county.GetNameNoTier].\n\n– Wybacz śmiałość, ale sprawdzasz swój towar w niewłaściwy sposób. To przecież [tgf_good.Custom('GetTradeGood')]. – Wskazuje mi dokładnie, na co zwracać uwagę.\n\nCałe życie spędził, nosząc [tgf_good.Custom('GetTradeGoodUnitPlural')], a to nauczyło go więcej, niż większość ludzi kiedykolwiek zdoła pojąć."
 gdp_trade_good_flavor.1014.desc.livestock: "Posiwiały poganiacz zatrzymuje swoje stado na rynku w miejscu o nazwie [tgf_source_county.GetNameNoTier].\n\n– Wybacz śmiałość, ale sprawdzasz swój towar w niewłaściwy sposób. To przecież [tgf_good.Custom('GetTradeGood')]. – Wskazuje mi dokładnie, na co zwracać uwagę.\n\nCałe życie, spędził, dostarczając ten towar na rynek, a to nauczyło go więcej, niż większość ludzi kiedykolwiek zdoła pojąć."
 gdp_trade_good_flavor.1014.a: "Weź to. Mądrość zasługuje na wynagrodzenie."
 gdp_trade_good_flavor.1014.b: "Mów dalej. Zamieniam się w słuch."
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "Błąd nowicjusza"
 gdp_trade_good_flavor.1015.desc: "Gdzieś w miejscu znanym jako [tgf_source_county.GetNameNoTier] handlarz uliczny, który sprzedał mi towar o nazwie [tgf_good.Custom('GetTradeGood')], zapewne wznosi toast za moje zdrowie. Zapłacona przeze mnie cena godna była głupca, a o całej sprawie dowiaduję się już po ptakach.\n\nCóż. Głupcy, którzy wyciągają wnioski ze swych błędów… przestają być głupcami."
 gdp_trade_good_flavor.1015.a: "Droga lekcja to wciąż lekcja."
 gdp_trade_good_flavor.1015.b: "Wystarczy. Nawet księgi muszą czasem odpocząć."
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "Podręcznik kupca"
 gdp_trade_good_flavor.1016.desc.intro: "W skrzyni wypełnionej towarem o nazwie [tgf_good.Custom('GetTradeGood')] znajduję zabezpieczony przed wilgocią egzemplarz dzieła, którym jest"
 gdp_trade_good_flavor.1016.desc.intro_livestock: "Wśród sprzętów przywiezionych wraz z ostatnią dostawą nabytego towaru o nazwie [tgf_good.Custom('GetTradeGood')] znajduję zabezpieczony przed wilgocią egzemplarz dzieła pod tytułem"
 gdp_trade_good_flavor.1016.desc.book_1: "„Praktyka handlu”"
 gdp_trade_good_flavor.1016.desc.book_2: "„Księga szlaków i rynków”"
 gdp_trade_good_flavor.1016.desc.book_3: "„Zwierciadło kupca”"
 gdp_trade_good_flavor.1016.desc.outro: "– kompendium mas, miar, szlaków i cen, spisane przez kupca, który najwyraźniej nigdy nie spał.\n\nKtoś zgubił prawdziwy skarb. Zamierzam zrobić z niego użytek."
 gdp_trade_good_flavor.1016.a: "Czytaj to dzieło, aż się rozpadnie."
 gdp_trade_good_flavor.1016.b: "Rzadkie książki osiągają wysokie ceny."
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "Nauka wyczucia"
 gdp_trade_good_flavor.1017.desc: "Sprzedawca należący do grupy ludności, którą są [tgf_seller.GetCulture.GetCollectiveNoun], w miejscu znanym jako [tgf_source_county.GetNameNoTier] wyciąga na ladę towar. To [tgf_good.Custom('GetTradeGood')]. Ledwie [tgf_good.Custom('GetTradeGoodUnit')], ale cenę podaje jak za trzy!\n\n– Dopiero zaczynasz, prawda? W takim razie nauka wyczucia będzie cię słono kosztować.\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "Sprzedawca należący do grupy ludności, którą są [tgf_seller.GetCulture.GetCollectiveNoun], w miejscu znanym jako [tgf_source_county.GetNameNoTier] prezentuje mi towar. To [tgf_good.Custom('GetTradeGood')]. Ledwie [tgf_good.Custom('GetTradeGoodUnit')], ale cenę podaje jak za trzy!\n\n– Dopiero zaczynasz, prawda? W takim razie nauka wyczucia będzie cię słono kosztować.\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "Bezczelny typ. Ma rację, ale jest bezczelny."
 gdp_trade_good_flavor.1017.a: "Chętnie zapłacę za naukę u ciebie."
 gdp_trade_good_flavor.1017.b: "Nie ma mowy."
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "Niewłaściwy pomiar"
 gdp_trade_good_flavor.1018.desc: "Mój handlarz, [tgf_trader.GetFirstName], odkrywa, że sprzedawaliśmy nasz towar o nazwie [tgf_good.Custom('GetTradeGood')] według rozmiarów, których używa kultura [ROOT.Char.GetCulture.GetName|l], czyli nieco mniejszych od tych, którymi posługują się [tgf_source_culture.GetCollectiveNoun] i których spodziewają się nabywcy. Wszystkie sprzedane przez nas [tgf_good.Custom('GetTradeGoodUnitPlural')] okazały się za małe.\n\nTo zwykła pomyłka. Ode mnie zależy, czy tak pozostanie."
 gdp_trade_good_flavor.1018.a: "Poprawcie rozmiary. Wszystkie bez wyjątku."
 gdp_trade_good_flavor.1018.b: "Różnica zasila moją sakiewkę."
 gdp_trade_good_flavor.1018.c: "Dokonajcie pomiarów według ich wytycznych i głośno o tym powiedzcie."
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "Dwa towary, jeden nabywca"
 gdp_trade_good_flavor.1019.desc: "Otrzymuję list od osoby znanej jako [tgf_market_holder.GetTitledFirstName].\n\n„Wyślij mi towar o nazwie [tgf_good.Custom('GetTradeGood')]. Wyślij też towar znany jako [tgf_good_b.Custom('GetTradeGood')], bo przecież jedno bez drugiego nie ma sensu”.\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "Otrzymuję list od osoby znanej jako [tgf_market_holder.GetTitledFirstName].\n\n„Wyślij mi towar o nazwie [tgf_good.Custom('GetTradeGood')]. W ramach tej samej dostawy wyślij też towar znany jako [tgf_good_b.Custom('GetTradeGood')]”.\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "Dwa towary, jeden nabywca, jedna cena. Lubię takie wyliczenia."
 gdp_trade_good_flavor.1019.a: "Sprzedawane razem, wyceniane razem."
 gdp_trade_good_flavor.1019.b: "Rozdzielimy to. Lepiej dostać zapłatę od razu niż na nią czekać."
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "Stawka budowlana"
 gdp_trade_good_flavor.1020.desc: "Ponad miejscem znanym jako [tgf_build_county.GetNameNoTier] pną się rusztowania. [tgf_market_holder.GetTitledFirstName] wznosi nowe budowle, a każdy wóz przybywający na plac robót załadowany jest moim towarem o nazwie [tgf_good.Custom('GetTradeGood')]. [tgf_market_holder.GetTitledFirstName] pisze do mnie z prośbą o stawkę budowlaną: do czasu zakończenia inwestycji chce kupować ten sam towar, lecz po niższej cenie.\n\nKażdy mur, który wznosi, już w połowie należy do mnie."
 gdp_trade_good_flavor.1020.a: "Niech będzie. Obowiązuje stawka budowlana."
 gdp_trade_good_flavor.1020.b: "Zgadzam się na obniżenie stawki, byle nie do zera."
 gdp_trade_good_flavor.1020.c: "Dziś ja zrobię coś dla ciebie, jutro odbiorę dług wdzięczności."
 gdp_trade_good_flavor.1020.d: "To, co najlepsze, zostaje u mnie."
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "Znajomość towarów"
 gdp_trade_good_flavor.1021.desc: "Każde rzemiosło ma swoich mistrzów, a mistrzowie #EMP nieustannie#! się uczą. Tej nocy towarzyszą mi jedynie lampa i najlepsze [tgf_good.Custom('GetTradeGoodUnitPlural')] towaru o nazwie [tgf_good.Custom('GetTradeGood')] z moich składów, które badam do czasu, aż lampa zaczyna przygasać.\n\nGdzieś tu kryje się powód, dla którego moje towary znajdują nabywców, a ich nie."
 gdp_trade_good_flavor.1021.desc.livestock: "Każde rzemiosło ma swoich mistrzów, a mistrzowie nieustannie się uczą. Tej nocy towarzyszą mi jedynie latarnia i najlepszy mój towar o nazwie [tgf_good.Custom('GetTradeGood')], który badam z niezwykłą dokładnością.\n\nGdzieś tu kryje się powód, dla którego moje towary znajdują nabywców, a ich nie."
 gdp_trade_good_flavor.1021.desc.books: "Każde rzemiosło ma swoich mistrzów, a mistrzowie #EMP nieustannie#! się uczą. Tej nocy towarzyszą mi jedynie lampa i najlepsze księgi z moich składów, które czytam do czasu, aż lampa zaczyna przygasać.\n\nGdzieś tu kryje się powód, dla którego moje towary znajdują nabywców, a ich nie."
 gdp_trade_good_flavor.1021.a: "To zachowam. Wszystkie pozostałe egzemplarze będę porównywać właśnie z tym."
 gdp_trade_good_flavor.1021.b: "Zawsze można się nauczyć czegoś więcej."
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "Nazwa rzemiosła"
 gdp_trade_good_flavor.1022.desc: "W miejscu znanym jako [tgf_source_county.GetNameNoTier] nie pada już moje nazwisko. Mówią „[tgf_good.Custom('GetTgfGoodNickname')]” i wszyscy wiedzą, o kogo chodzi. #bold O mnie.#!\n\nTytuły nadają seniorzy. Takie przydomki nadają rynki, a na uznanie rynku trzeba sobie zasłużyć."
 gdp_trade_good_flavor.1022.a: "Nieprzyzwoity przydomek. Efektywny, ale nieprzyzwoity."
 gdp_trade_good_flavor.1022.b: "Niech gadają. Taki przydomek sprzyja interesom."
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "Zakłócenie podaży"
 gdp_trade_good_flavor.1023.desc: "– Kupujecie tyle, że nie nadążamy z produkcją – mówi [tgf_foreman.GetFirstName], majster z miejsca znanego jako [tgf_source_county.GetNameNoTier], gdy przyglądam się, jak mój towar o nazwie [tgf_good.Custom('GetTradeGood')] jest [tgf_good.Custom('GetTgfGoodMade')].\n\n– Nie mamy więcej rąk do pracy.\n\nWięcej pracowników oznacza większe wydatki. Odprawianie kupców z kwitkiem kosztuje jednak jeszcze więcej."
 gdp_trade_good_flavor.1023.a: "Zatrudnij więcej ludzi. Na mój koszt."
 gdp_trade_good_flavor.1023.b: "Pracuj dla mnie."
 gdp_trade_good_flavor.1023.c: "W takim razie pokaż mi, jak to się robi."
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "Pod młotek"
 gdp_trade_good_flavor.1024.desc: "– [tgf_good.Custom('GetTradeGoodUnitPlural')|U] towaru o nazwie [tgf_good.Custom('GetTradeGood')], a dokładnie czterdzieści ich sztuk dla tego, kto zaproponuje najlepszą cenę! – [tgf_source_province.Custom('GetRegionalMarketTerm')|U] w miejscu znanym jako [tgf_source_county.GetNameNoTier] jest świadkiem tego, jak [tgf_rival.GetFirstName], którego zatrudnia [tgf_rival.Custom('GetTgfCompanyWord')] [tgf_rival.GetHouse.GetBaseNameNoTooltip], podnosi rękę, zanim licytator zdąży dokończyć wywołanie.\n\n[tgf_rival.GetFirstName] spogląda na mnie i się uśmiecha. Na pewno myśli, że ta partia już należy do [tgf_rival.Custom('PL_niego_niej')]…"
 gdp_trade_good_flavor.1024.a: "Przebijam każdą [tgf_rival.Custom('PL_jego_jej')] ofertę o jeden."
 gdp_trade_good_flavor.1024.b: "Licytuj jeszcze wyżej… W końcu wszystko będzie twoje, [tgf_rival.GetFirstNameNoTooltip]!"
 gdp_trade_good_flavor.1024.c: "Niech licytuje. Zobaczę, kto wygra."
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "Pierwszy na nabrzeżu"
 gdp_trade_good_flavor.1025.desc: "– Dwadzieścia statków na nabrzeżu i tylko jeden dźwig – mówi [tgf_docks_boss.GetFirstName], osoba, która kieruje pracą robotników portowych w miejscu znanym jako [tgf_source_county.GetNameNoTier]. – Kto pierwszy wyładuje swój towar o nazwie [tgf_good.Custom('GetTradeGood')], ustala cenę na cały sezon. To możesz być ty.\n\n[tgf_docks_boss.GetFirstName] sugestywnie wyciąga dłoń."
 gdp_trade_good_flavor.1025.a: "Kto pierwszy wyjdzie na brzeg, ustala cenę."
 gdp_trade_good_flavor.1025.b: "W takim razie sprzedaję wszystko tu i teraz, prosto z pokładu."
 gdp_trade_good_flavor.1025.c: "Niech inni wyładują towar pierwsi. Zobaczymy, ile będą za niego wołać."
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "Całymi garściami"
 gdp_trade_good_flavor.1026.desc: "– Na pojedyncze [tgf_good.Custom('GetTgfGoodSmallest')] kupują biedni – mówi [tgf_stallholder.GetFirstName]. Prowadzi stragan na targu w miejscu znanym jako [tgf_source_county.GetNameNoTier]. Dzieli mój towar o nazwie [tgf_good.Custom('GetTradeGood')], zwykle sprzedawany na [tgf_good.Custom('GetTradeGoodUnit')], na sto małych porcji i sprzedaje każdą za nieco więcej, niż jest warta.\n\n– Dostarczaj mi towar, a ja będę ci płacić."
 gdp_trade_good_flavor.1026.a: "[tgf_good.Custom('GetTradeGoodUnit')|U]. Sztuk jeden. Zawsze wtedy, gdy tylko potrzebujesz. Umowa stoi."
 gdp_trade_good_flavor.1026.b: "Sprzedaj im towar za cenę, którą są w stanie zapłacić."
 gdp_trade_good_flavor.1026.c: "Weź całość. Wolę gotówkę od ręki."
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "Dzień targowy"
 gdp_trade_good_flavor.1027.desc: "– [tgf_good.Custom('GetTradeGood')|U]! [tgf_good.Custom('GetTgfGoodLook')|U]! Komu [tgf_good.Custom('GetTradeGood')]? – Mamy dzień targowy w miejscu o nazwie [tgf_source_county.GetNameNoTier], a głos mojego herolda ledwie przebija się przez zgiełk. Wszyscy kupcy hrabstwa zgromadzili się w jednym miejscu, a każdy ma sakiewkę pełną monet.\n\nWystarczy tylko sprawić, by wydali je #EMP u mnie!#!"
 gdp_trade_good_flavor.1027.a: "Muszę zachęcić ich do zakupów za wszelką cenę."
 gdp_trade_good_flavor.1027.b: "Nie ma na co czekać. Namówię tłum do zakupów osobiście."
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "Zagraniczne pieniądze"
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], kupiec w miejscu znanym jako [tgf_source_county.GetNameNoTier], chce nabyć mój towar o nazwie [tgf_good.Custom('GetTradeGood')], a waluta, którą płaci, to [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')].\n\n– Pieniądz to pieniądz – mawia.\n\nPieniądz to pieniądz, przyznaję, po czym wyjaśniam [tgf_buyer.Custom('PL_mu_jej')], ile naprawdę warte są dla mnie [tgf_buyer.GetHerHis] monety. Uśmiech natychmiast znika z [tgf_buyer.GetHerHis] twarzy."
 gdp_trade_good_flavor.1028.a: "Niech będzie. Srebro to srebro."
 gdp_trade_good_flavor.1028.b: "Zapłać moją stawkę albo nici z transakcji."
 gdp_trade_good_flavor.1028.c: "Zamiast tego zapłać mi w towarze. Niech będzie to [tgf_good_b.Custom('GetTradeGood')]."
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "Całe lata w drodze"
 gdp_trade_good_flavor.1029.desc: "– Od trzech lat traktem tym przewożony jest twój towar o nazwie [tgf_good.Custom('GetTradeGood')] – oznajmia mój handlarz, [tgf_trader.GetFirstName], wznosząc kielich. – Odkąd nim podróżuję, wszystkie [tgf_good.Custom('GetTradeGoodUnitPlural')] dotarły do celu. Nic nie zaginęło!\n\nZaginęło ich pięć. Ale dziś wieczorem pozwalam [tgf_trader.Custom('PL_mu_jej')] napawać się chwałą."
 gdp_trade_good_flavor.1029.a: "Świetnie się spisujesz!"
 gdp_trade_good_flavor.1029.b: "Wypijmy za kolejne trzy lata."
 gdp_trade_good_flavor.1029.c: "Następnym razem udamy się dalej. Znacznie dalej."
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "Widok udanej sprzedaży"
 gdp_trade_good_flavor.1030.desc: "– To naprawdę [tgf_good.Custom('GetTradeGood')] [ROOT.Char.GetHouse.GetName] – oznajmia jeden z kupujących na targu w miejscu znanym jako [tgf_source_county.GetNameNoTier], wskazując na moje [tgf_good.Custom('GetTradeGoodUnitPlural')]. – [tgf_good.Custom('GetTgfGoodLook')|U]!\n\nNie ma pojęcia, że ktoś z rodu [ROOT.Char.GetHouse.GetName] stoi tuż za [tgf_buyer.Custom('PL_nim_nia')].\n\nMogę się odezwać. Mogę też po prostu rozkoszować się tą chwilą."
 gdp_trade_good_flavor.1030.a: "Nie mów nic. Posłuchaj, czego chce."
 gdp_trade_good_flavor.1030.b: "W rzeczy samej. Coś wiem na ten temat."
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "Środki zewnętrzne"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] i [tgf_investor_b.GetFirstName], [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] z miejsca znanego jako [tgf_source_county.GetNameNoTier], od lat kupują mój towar o nazwie [tgf_good.Custom('GetTradeGood')]. Teraz chcą mieć udział w zyskach.\n\n– Udziału w twoich zyskach – mówi [tgf_investor_a.GetFirstNameNoTooltip], podczas gdy [tgf_investor_b.GetFirstNameNoTooltip] odlicza monety. – Dobrze płacimy i nie zadajemy zbyt wielu pytań.\n\nBędą zadawać pytania. Inwestorzy zawsze to robią."
 gdp_trade_good_flavor.1031.a: "Wasze pieniądze, moje zyski. A przynajmniej ich część."
 gdp_trade_good_flavor.1031.b: "To rodzinny interes i tak zostanie."
 gdp_tgf_kept_in_family_unity_desc: "Interes pozostał rodzinny"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "Sala wystawowa"
 gdp_trade_good_flavor.1032.desc: "– Czy to [tgf_good.Custom('GetTradeGood')]? – pyta każdy gość, który przekracza próg mojej sali. Oto są: najprzedniejsze towary, jakie posiadam, [tgf_good.Custom('GetTgfGoodLook')], wystawione tak, by nikt nie mógł przejść obok nich obojętnie.\n\nNikt nie opuszcza mojego domu, nie dowiedziawszy się, czym handluję."
 gdp_trade_good_flavor.1032.desc.livestock: "– Czy to [tgf_good.Custom('GetTradeGood')]? – pyta każdy gość, ostrożnie lawirując między egzemplarzami towaru w mojej sali. Oto są: najprzedniejsze, jakie posiadam, [tgf_good.Custom('GetTgfGoodLook')], prezentowane tak, by nikt nie mógł ich przeoczyć.\n\nNikt nie opuszcza mojego domu, nie dowiedziawszy się, czym handluję. Ani bez sprawdzenia ich butów."
 gdp_trade_good_flavor.1032.a: "Niech się gapią. Dzięki temu ludzie się dowiedzą."
 gdp_trade_good_flavor.1032.b: "Proszę, to prezent ode mnie."
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "Nie tracić wprawy"
 gdp_trade_good_flavor.1033.desc: "Stary dostawca towaru o nazwie [tgf_good.Custom('GetTradeGood')] pisze do mnie w te słowa: „Czekają na ciebie najlepsze partie z tegorocznych zbiorów po dawnej cenie. Nie chcesz skorzystać z okazji?”\n\nTamtą transakcję odpuszczam, lecz wciąż potrafię rozpoznać, czy [tgf_good.Custom('GetTradeGood')] to towar warty swojej ceny. Szkoda z tego nie skorzystać, gdy nadal można coś zyskać."
 gdp_trade_good_flavor.1033.a: "Odpisz. Nie pozwól mi stracić czujności."
 gdp_trade_good_flavor.1033.b: "Moja wiedza jest na sprzedaż. Za odpowiednią cenę."
 gdp_trade_good_flavor.1033.c: "Odpuść. Czekają na mnie nowe możliwości handlowe."
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "Przewodnik"
 gdp_trade_good_flavor.1034.desc: "[tgf_pilgrim.GetFirstName], pielgrzym nocujący w miejscu znanym jako [tgf_source_county.GetNameNoTier], stuka palcem w sfatygowaną księgę.\n\n– Opisano w niej każdy trakt, każdą gospodę i każdy bród między tym miejscem a wybrzeżem. A na marginesach można znaleźć notatki o każdym rynku, na którym [tgf_good.Custom('GetTradeGood')] sprzedaje się w dobrej cenie. Księga może być twoja… za odpowiednią cenę.\n\nPrzebyła dalszą drogę niż którykolwiek z moich wozów."
 gdp_trade_good_flavor.1034.a: "Podaj swoją cenę, pielgrzymie."
 gdp_trade_good_flavor.1034.b: "Przepisz księgę dziś w nocy i oddaj ją przed świtem."
 gdp_trade_good_flavor.1034.c: "Po prostu powiedz mi, co udało ci się zobaczyć na rynkach."
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "Rozmowy o pracy"
 gdp_trade_good_flavor.1035.desc: "– A czym właściwie handlujesz? – pyta mój gość, [tgf_guest.GetFirstName], gdy po wieczerzy przechadzamy się razem. To był błąd. Zanim kończę wyjaśniać, skąd biorę mój towar o nazwie [tgf_good.Custom('GetTradeGood')] – [tgf_good.Custom('GetTgfGoodMade')] – zdążyliśmy dwukrotnie obejść cały targ.\n\n[tgf_guest.GetFirstName] nie próbuje nawet zmieniać tematu. Po tym poznaję, że mam przed sobą przyszłego nabywcę."
 gdp_trade_good_flavor.1035.a: "Może omówimy warunki przy deserze?"
 gdp_trade_good_flavor.1035.b: "Dość już o mnie. Gdzie kupujesz swoje towary?"
 gdp_trade_good_flavor.1035.c: "Pozwól, że ci opowiem, jak udało mi się zbić dzięki temu pierwszą fortunę."
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "Stanowisko pakowania"
 gdp_trade_good_flavor.1036.desc: "– Dodatkowe [tgf_good.Custom('GetTradeGoodUnitPlural')] na każdym wozie. O jedną trzecią więcej – mówi mój handlarz, [tgf_trader.GetFirstName], pokazując mi, jak to zrobić. – Część popęka w drodze i kupcy będą narzekać. Większość jednak nic nie powie.\n\n„Większość” to termin, który lubię. Z częścią strat potrafię się pogodzić."
 gdp_trade_good_flavor.1036.a: "Ułóż je ciasno. Zysk kryje się w każdej szczelinie."
 gdp_trade_good_flavor.1036.b: "Zapakujcie je porządnie. Kupcy oceniają cały ładunek po pierwszej sztuce, którą otworzą."
 gdp_trade_good_flavor.1036.c: "Nie zmieniajcie niczego. Do tej pory taki sposób się sprawdzał."
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "Pieczęć rynku"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "Urzędnik targowy, który sprawdzał towary pod kątem jakości i rzetelności miar, a te, które przeszły kontrolę, opatrywał pieczęcią z ołowiu lub wosku. W wielu miastach nie wolno było sprzedawać bez niej sukna ani innych towarów, a pieczętarz pobierał opłatę za każdą pieczęć."
 gdp_trade_good_flavor.1037.desc: "– Towar z pieczęcią sprzedaje się drożej. Każdy to wie – mówi [tgf_sealer.GetFirstName], [Glossary( 'pieczętarz', 'TGF_SEALER_GLOSS' )] z rynku z miejsca o nazwie [tgf_source_county.GetNameNoTier], nie odrywając wzroku od swojego stołu. – A pieczętuję w kolejności płacenia, nie proszenia.\n\nMoje wozy – a w nich [tgf_good.Custom('GetTradeGood')] – stoją w pełnym słońcu. Mój zysk też."
 gdp_trade_good_flavor.1037.a: "W takim razie czekamy. Pieczęć to pieczęć."
 gdp_trade_good_flavor.1037.b: "Proszę. A teraz pieczętuj szybciej."
 gdp_trade_good_flavor.1037.c: "Moje nazwisko wystarczy za pieczęć."
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "Pośrednik"
 gdp_trade_good_flavor.1038.desc: "– Znam kupujących, o których nie masz pojęcia, w miastach, w których nigdy nie stanęła twoja noga – mówi [tgf_broker.GetFirstName], pośrednik z rynku w miejscu o nazwie [tgf_source_county.GetNameNoTier], nalewając mi kubek, o który nie proszę. – Ty i twój towar – [tgf_good.Custom('GetTradeGood')], oni i ich monety, ja i moja prowizja.\n\nTrzy strony. Tylko jedna z nich dostaje darmowy trunek."
 gdp_trade_good_flavor.1038.a: "Znajdź ich. Weź swoją prowizję."
 gdp_trade_good_flavor.1038.b: "Dziękuję, kupujących znajdę na własną rękę."
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "Uczeń handlarza"
 gdp_trade_good_flavor.1039.desc: "– [tgf_youth.Custom('PL_jemu_jej')|U] liczenie idzie szybciej ode mnie – mówi mój handlarz, [tgf_trader.GetFirstName], popychając naprzód młodego człowieka o imieniu [tgf_youth.GetFirstName]. Zanim zdążę zapytać, [tgf_youth.GetFirstNameNoTooltip] podaje cenę towaru o nazwie [tgf_good.Custom('GetTradeGood')] na obu naszych rynkach.\n\nUtrzymanie bystrego dziecka kosztuje. Bystre dziecko, które dla mnie pracuje, zwraca ten koszt."
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip] zostaje ze mną."
 gdp_trade_good_flavor.1039.b: "Zatrzymaj to dziecko, [tgf_trader.GetFirstNameNoTooltip]. Naucz je dobrze."
 gdp_trade_good_flavor.1039.c: "Mamy dość gąb do wykarmienia."
 gdp_tgf_family_only_unity_desc: "Kompania pozostaje w rękach rodziny"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "Kąpiel w towarze"
 gdp_trade_good_flavor.1040.desc: "Późną nocą magazyn należy tylko do mnie: [tgf_good.Custom('GetTgfGoodLook')], wszystko na stosach wyższych ode mnie. [tgf_good.Custom('GetTgfGoodSmallest')|U] z pierwszej garści przesypują mi się kolejno przez palce.\n\nPrzychodzi mi do głowy pewna myśl. A gdyby tak… #EMP w tym popływać?#!"
 gdp_trade_good_flavor.1040.a: "Nurkujemy, jak kaczka w wodzie!"
 gdp_trade_good_flavor.1040.a.toast: "Twarde lądowanie"
 gdp_trade_good_flavor.1040.b: "Nie. Policzmy. Wszystkie [tgf_good.Custom('GetTgfGoodSmallest')] co do sztuki."
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "Pierwsza sprzedaż"
 gdp_trade_good_flavor.1041.desc: "Porządkując starą skrzynię, znajduję zawiniątko z płótna, a w nim pierwsze sprzedane przeze mnie [tgf_good.Custom('GetTgfGoodSmallest')] towaru o nazwie [tgf_good.Custom('GetTradeGood')]. Odkupienie ich lata temu kosztowało mnie dwa razy tyle.\n\nGdy nikt nie patrzy, unoszę je pod światło i opowiadam im, jak długa droga jest już za nami. Każda moneta zarobiona od tamtej pory to jedno z ich dzieci."
 gdp_trade_good_flavor.1041.a: "Oprawię w ramę i powieszę w jakimś dobrze widocznym miejscu."
 gdp_trade_good_flavor.1041.b: "Relikwia mojego wzlotu. Ktoś za to zapłaci."
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "Monety pod poduszką"
 gdp_trade_good_flavor.1042.desc: "– Dobranoc, monetki – mówię to teraz co wieczór sakiewce pod poduszką, w której jest wszystko, co przynosi mi w tym sezonie mój towar, a konkretniej [tgf_good.Custom('GetTradeGood')].\n\nTo najtwardsza poduszka w moim życiu i jedyna warta fortunę."
 gdp_trade_good_flavor.1042.a: "Będę na tym spać. Na tym wszystkim."
 gdp_trade_good_flavor.1042.b: "Pod poduszką na nic się nie zda. [tgf_good.Custom('GetTradeGood')|U] – muszę dokupić więcej."
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "Portret z monetami"
 gdp_trade_good_flavor.1043.desc: "– Ty przy stole. Z jednej strony [tgf_good.Custom('GetTradeGood')], z drugiej twoje monety – mówi [tgf_painter.GetFirstName], malarz będący przejazdem w miejscu o nazwie [tgf_source_county.GetNameNoTier], biorąc mnie w ramkę ze swoich kciuków. – Każda moneta namalowana, każda [Glossary( 'policzona', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )].\n\nLubię, gdy [tgf_painter.GetWomanMan] umie liczyć."
 gdp_trade_good_flavor.1043.a: "Namaluj to. Każdą monetę."
 gdp_trade_good_flavor.1043.b: "Namaluj monety… #EMP jako większe.#!"
 gdp_trade_good_flavor.1043.c: "Malarz to nie klient."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "Kupcy i wekslarze lubili być portretowani przy pracy, wśród monet i wag. W 1449 roku Petrus Christus namalował złotnika ważącego pierścień dla pary narzeczonych."
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "Za ciężka sakiewka"
 gdp_trade_good_flavor.1044.desc: "– Czy chce [ROOT.Char.Custom('FormOfAddressForLiege')], żeby sprowadzić drugiego sługę? – pyta [tgf_servant.GetFirstName].\n\nMoja sakiewka, wypchana pieniędzmi z tegorocznej sprzedaży towaru o nazwie [tgf_good.Custom('GetTradeGood')], potrzebuje teraz własnego sługi, który poniesie ją za mną.\n\nRozważam wóz."
 gdp_trade_good_flavor.1044.a: "Tak. Dwóch sług. Idź powoli."
 gdp_trade_good_flavor.1044.b: "Nie. Sprowadź wóz. Z moim nazwiskiem wymalowanym na boku!"
 gdp_trade_good_flavor.1044.c: "[tgf_servant.GetFirstNameNoTooltip], najpierw przez targ – tam, gdzie [tgf_good.Custom('GetTradeGood')]."
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "Zysk i pobożność"
 gdp_trade_good_flavor.1045.desc: "Moje księgi otwierają się [Glossary( 'starym zwyczajem', 'TGF_DATINI_GLOSS' )] – inwokacją w imię [ROOT.Char.GetFaith.HighGodNamePossessive] i zysku. W tym roku zysk zapełnia czterdzieści stron, a na rzecz [ROOT.Char.GetFaith.HighGodNamePossessive] nie trafia ani grosz.\n\nKażdy kupiec wie, że wspólnikowi należy się uczciwy udział."
 gdp_trade_good_flavor.1045.a: "Uczciwy udział dla mojego wspólnika w niebiosach."
 gdp_trade_good_flavor.1045.b: "Chwila ciszy w towarzystwie [ROOT.Char.GetFaith.HighGodNamePossessive], a potem z powrotem do ksiąg."
 gdp_trade_good_flavor.1045.c: "To z łaski [ROOT.Char.GetFaith.HighGodNamePossessive] otrzymuję ten talent. Przestać byłoby niegrzecznie."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "W opowieści o Józefie, znanej z Tory, Biblii i Koranu, władcy Egiptu śni się siedem tłustych krów pożartych przez siedem chudych. Józef odczytuje to jako siedem lat obfitości i siedem lat głodu, dzięki czemu Egipt w porę napełnia spichlerze."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "Francesco Datini, kupiec z Prato, opatrywał swoje księgi nagłówkiem „W imię Boga i zysku” i zmarł jako jeden z najbogatszych ludzi w Toskanii."
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "Swój wśród swoich"
 gdp_trade_good_flavor.1046.desc: "– W miejscu znanym jako [tgf_source_county.GetNameNoTier] połowa ludzi to [tgf_source_culture.GetCollectiveNoun], tak jak ja – mówi mój handlarz, [tgf_trader.GetFirstName]. – Przede mną otwierają się drzwi, które przed tobą pozostają zamknięte. Mnie obniżają ceny, a takim jak ty – nigdy. Wy to przecież [ROOT.Char.GetCulture.GetCollectiveNoun].\n\n[tgf_trader.GetFirstNameNoTooltip] mówi to życzliwie. Postanawiam usłyszeć tylko część o cenach."
 gdp_trade_good_flavor.1046.a: "Od teraz ty prowadzisz rozmowy."
 gdp_trade_good_flavor.1046.b: "Proszę. Nie daj się nikomu podkupić."
 gdp_trade_good_flavor.1046.c: "W takim razie poznam ich zwyczaje."
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "Zalany rynek"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetFirstName] z [tgf_rival.Custom('GetTgfCompanyWord')|l] [tgf_rival.GetHouse.GetBaseNameNoTooltip] sprzedaje w miejscu znanym jako [tgf_source_county.GetNameNoTier] pewien towar taniej, niż kosztuje jego sprowadzenie. Towar ten to [tgf_good.Custom('GetTradeGood')]. Mój handlarz, [tgf_trader.GetFirstName], wpada we wściekłość.\n\nMnie to ciekawi. Skoro coś jest aż tak tanie, ktoś powinien to kupować. Najlepiej ja."
 gdp_trade_good_flavor.1047.a: "Skoro [tgf_rival.GetFirstNameNoTooltip] chce to rozdawać, ja to biorę."
 gdp_trade_good_flavor.1047.b: "Niech [tgf_rival.GetFirstNameNoTooltip] sprzedaje ze stratą. Mój towar, [tgf_good.Custom('GetTradeGood')], poczeka."
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "Rękopis w beli"
 gdp_trade_good_flavor.1048.desc: "Ktoś w miejscu znanym jako [tgf_source_county.GetNameNoTier] przełożył starymi kartami moje ostatnie [tgf_good.Custom('GetTradeGoodUnitPlural')] towaru o nazwie [tgf_good.Custom('GetTradeGood')], żeby nie zamokły. Mój handlarz, [tgf_trader.GetFirstName], ostrożnie je rozwija.\n\n– To [Glossary( 'księga', 'TGF_HOUSE_OF_WISDOM_GLOSS' )], a przynajmniej większa jej część. Komuś będzie jej brakować.\n\nZapłata była za sam towar. Księga trafia się gratis i może być warta więcej."
 gdp_trade_good_flavor.1048.a: "Zatrzymam ją."
 gdp_trade_good_flavor.1048.b: "[tgf_good.Custom('GetTradeGood')|U] i księga zostaną sprzedane razem."
 gdp_trade_good_flavor.1048.c: "Odesłać ją do miejsca o nazwie [tgf_source_county.GetNameNoTierNoTooltip]."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "Księgi przekraczały granice, leżąc w tobołach kupców. W bagdadzkim Domu Mądrości uczeni przekładali dzieła greckie, perskie i indyjskie na arabski, a wiele z nich doczekało się potem przekładów na łacinę."
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "Kupcy z ojczyzny"
 gdp_trade_good_flavor.1049.desc: "Mój handlarz, [tgf_trader.GetFirstName], pisze z miejsca o nazwie [tgf_source_county.GetNameNoTier]:\n\n– Jest tu cała [Glossary( 'dzielnica', 'TGF_DIASPORA_GLOSS' )], w której mieszkają [ROOT.Char.GetCulture.GetCollectiveNoun], z dala od domu i z tęsknotą za nim. W ojczyźnie każdy zna nazwisko [ROOT.Char.GetHouse.GetBaseNameNoTooltip]. Gdy słyszą je tutaj, zbiegają się tłumnie.\n\nOkazuje się, że tęsknota za domem to też rynek."
 gdp_trade_good_flavor.1049.a: "Sprzedawać im tak jak w ojczyźnie."
 gdp_trade_good_flavor.1049.b: "Sprowadzić najstarsze z ich dzieci do mojej kompanii w ojczyźnie."
 gdp_trade_good_flavor.1049.c: "Za smak domu warto zapłacić."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "Kupcy osiadli na obczyźnie budowali własne dzielnice: Sogdiańczycy wzdłuż Jedwabnego Szlaku, Wenecjanie w Konstantynopolu, żydowscy kupcy od Kairu po Aden. Ich krewni w ojczyźnie handlowali za ich pośrednictwem."
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "[tgf_good.GetNameNoTooltip] na szlaku"
 gdp_trade_good_flavor.1050.desc: "Zostaje mi przedstawiona osoba, którą jest [tgf_smuggler.GetFirstName], [Glossary( 'przemytnik', 'TGF_SMUGGLER_GLOSS' )] z miejsca znanego jako [tgf_source_county.GetNameNoTier]. Zna jedną sztuczkę: na wierzchu każdego wozu układa [tgf_good.Custom('GetTradeGoodUnitPlural')] najgorszego sortu – [tgf_good.Custom('GetTgfGoodFlaw')] – więc poborcy podatkowi, których przysyła [tgf_market_holder.GetTitledFirstName], nigdy nie kopią głębiej.\n\n– Połowa ceny rynkowej – mówi [tgf_smuggler.GetFirstNameNoTooltip]. – Wierzchnie [tgf_good.Custom('GetTradeGoodUnitPlural')] skrywają pod spodem doskonały towar."
 gdp_trade_good_flavor.1050.a: "Połowa ceny to moja ulubiona cena."
 gdp_trade_good_flavor.1050.a.toast: "Wieści się rozchodzą"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] okaże wdzięczność. Za twoją głowę."
 gdp_trade_good_flavor.1050.c: "Wodzisz za nos poborców? Masz u mnie pracę."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "Gdziekolwiek władcy opodatkowywali towary, przemytnicy wymykali się ich poborcom. Najwięcej zarabiano na soli, obłożonej podatkiem niemal wszędzie: Huang Chao, przemytnik soli w Chinach za dynastii Tang, stanął na czele buntu, który zdobył stolicę Tangów, Chang’an."
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "Obfite żniwa"
 gdp_trade_good_flavor.2001.desc: "Docierają do mnie wieści z miejsca znanego jako [tgf_source_county.GetNameNoTier], skąd pochodzi mój towar – [tgf_good.Custom('GetTradeGood')]. Chłopi, w żyłach których płynie [tgf_source_culture.GetName|l] krew, zbierają plony, jakich nie było przez całe pokolenie i jakich spichrze nie mogą pomieścić.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "Docierają do mnie wieści z miejsca znanego jako [tgf_source_county.GetNameNoTier], skąd pochodzi mój towar – [tgf_good.Custom('GetTradeGood')]. Pasterze, w żyłach których płynie [tgf_source_culture.GetName|l] krew, mają rok, jakiego nie było przez całe pokolenie. Każda zagroda jest pełna, a trawy nie starcza dla wszystkich zwierząt.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "Ich dobry rok. Moja dobra cena."
 gdp_trade_good_flavor.2001.a: "Ustalić cenę, póki świętują."
 gdp_trade_good_flavor.2001.b: "Wyjeżdżamy. Dowiemy się, jak to uprawiają."
 gdp_trade_good_flavor.2001.b.livestock: "Wyjeżdżamy. Dowiemy się, jak je hodują."
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "Łup myśliwego"
 gdp_trade_good_flavor.2002.desc: "– [tgf_good.Custom('GetTgfGoodGatherers')|U] z miejsca znanego jako [tgf_source_county.GetNameNoTier] spisują się jak nigdy – mówi mi mój handlarz, [tgf_trader.GetFirstName]. – [tgf_good.Custom('GetTradeGood')]! Ładunek jak z całego sezonu w jednej dostawie, najlepszy w historii. Oferty już napływają.\n\nSprzedać wszystko czy zatrzymać najpiękniejszą sztukę? Ulubiony dylemat kupca."
 gdp_trade_good_flavor.2002.a: "Sprzedać wszystko, póki cena jest wysoka."
 gdp_trade_good_flavor.2002.b: "Najlepsza sztuka zostaje u mnie."
 gdp_trade_good_flavor.2002.c: "Zasypać stragany. Dla każdego po trochu."
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "Bogata żyła"
 gdp_trade_good_flavor.2003.desc: "Mój handlarz, [tgf_trader.GetFirstName], wraca z uśmiechem z miejsca znanego jako [tgf_source_county.GetNameNoTier].\n\n– Nowe złoże – bogate, płytkie, a każdy kopacz w hrabstwie ustawia się w kolejce, żeby z niego wydobywać. Dziś [tgf_good.Custom('GetTradeGood')] to towar tani. Będzie jeszcze tańszy, jeśli wykupimy udział w złożu.\n\nŻadne złoże nigdy nie pozostało tanie na długo."
 gdp_trade_good_flavor.2003.desc.amber: "Mój handlarz, [tgf_trader.GetFirstName], wraca z uśmiechem z miejsca znanego jako [tgf_source_county.GetNameNoTier].\n\n– [tgf_good.Custom('GetTradeGood')|U]! Jesienne sztormy wyrzucają tego więcej, niż ktokolwiek pamięta, a każda rodzina na wybrzeżu wychodzi to zbierać. Dziś [tgf_good.Custom('GetTradeGood')] to towar tani. Będzie jeszcze tańszy, jeśli to #EMP my#! zapłacimy zbieraczom.\n\nMorze nigdy nie jest tak hojne na długo."
 gdp_trade_good_flavor.2003.a: "Wykupić udział w wydobyciu."
 gdp_trade_good_flavor.2003.a.amber: "Zapłacić zbieraczom."
 gdp_trade_good_flavor.2003.b: "Kupować, póki wozy są przepełnione."
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "Sekret wart swojej ceny"
 gdp_trade_good_flavor.2004.desc: "– Nowy kolor!\n\nMój handlarz, [tgf_trader.GetFirstName], przywozi próbkę aż z miejsca znanego jako [tgf_source_county.GetNameNoTier], a farbiarnia przysięga, że nikt inny nie zna tego sekretu.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "– Nowe szkliwo!\n\nMój handlarz, [tgf_trader.GetFirstName], przywozi próbkę aż z miejsca znanego jako [tgf_source_county.GetNameNoTier], a warsztat przysięga, że nikt inny nie zna tego sekretu.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "Sekrety są drogie. Ale te na wyłączność są warte swojej ceny."
 gdp_trade_good_flavor.2004.a: "Podaj cenę. Sekret należy do mnie."
 gdp_trade_good_flavor.2004.b: "Podziwiać, zanotować, iść dalej."
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "Degustacja towaru"
 gdp_trade_good_flavor.2005.desc: "Kupiec musi wiedzieć, co sprzedaje. Mój towar to [tgf_good.Custom('GetTradeGood')], więc go próbuję – raz z obowiązku, drugi raz dla pewności, a potem już wyłącznie dla przyjemności. Do wieczora wszystkie [tgf_good.Custom('GetTradeGoodUnitPlural')] znikają.\n\nPyszne. [tgf_source_culture.GetCollectiveNoun] zapłacą za to podwójnie."
 gdp_trade_good_flavor.2005.a: "Podwójnie. Zapłacą podwójnie."
 gdp_trade_good_flavor.2005.b: "Mm. Wyłącznie na potrzeby kontroli jakości. Jeszcze troszkę."
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "Strój do roli"
 gdp_trade_good_flavor.2006.desc: "Jeśli chce się coś sprzedawać, to trzeba samemu tego używać. Przychodzę na targ w najlepszym, co mam w swoich zapasach, i patrzę, jak kupcy oglądają się za mną dwa razy.\n\n[tgf_good.Custom('GetTradeGood')|U] to towar, który mówi sam za siebie. Ja to tylko noszę."
 gdp_trade_good_flavor.2006.a: "Pasuje. Zostaje."
 gdp_trade_good_flavor.2006.a.tt_furs: "Od teraz nosisz swój futrzany płaszcz"
 gdp_trade_good_flavor.2006.a.tt_leather: "Od teraz nosisz swój skórzany płaszcz"
 gdp_trade_good_flavor.2006.a.tt_silk: "Od teraz nosisz swoje jedwabne okrycie"
 gdp_trade_good_flavor.2006.a.tt_textiles: "Od teraz nosisz swój wytworny płaszcz"
 gdp_trade_good_flavor.2006.b: "Niech towar mówi sam za siebie."
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "Wartość twarzy"
 gdp_trade_good_flavor.2007.desc: "– Nowe [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')] będą nosić moją twarz – mówi mi [tgf_market_holder.GetTitledFirstName]. – A wybijane będą z materiału o nazwie [tgf_good.Custom('GetTradeGood')] od ciebie. Chcę stałych dostaw po przyjaznej cenie.\n\nMój kruszec, [tgf_market_holder.Custom('PL_jego_jej')] twarz, jedna moneta. Wspólnie zapiszemy się na kartach historii."
 gdp_trade_good_flavor.2007.a: "Przyjazna cena! Pierwszą monetę wybij dla mnie."
 gdp_trade_good_flavor.2007.b: "Pełna cena. Moneta to moneta."
 gdp_trade_good_flavor.2007.c: "Przyjazna cena? Mam ciekawsze zajęcia."
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "W nienaruszonym stanie"
 gdp_trade_good_flavor.2008.desc: "– Wszystkie [tgf_good.Custom('GetTradeGoodUnitPlural')] się zachowały – mówi mój handlarz, [tgf_trader.GetFirstName], nie kryjąc zadowolenia z siebie. – Nic się nie zepsuło, nic się nie stłukło, nic nie zginęło – [tgf_good.Custom('GetTradeGood')] w stanie nietkniętym.\n\nTo nie szczęście. To umiejętność, a umiejętności można nauczyć."
 gdp_trade_good_flavor.2008.a: "Pokaż mi, jak to pakujesz."
 gdp_trade_good_flavor.2008.b: "Staranne ręce. Imponujące."
 gdp_trade_good_flavor.2008.c: "Powiedz kupującym. Nienaruszony towar osiąga wysokie ceny."
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "Zwykli ludzie widzą tylko armie"
 gdp_trade_good_flavor.2009.desc: "[tgf_market_holder.GetTitledFirstName] prowadzi wojnę, a [tgf_good.Custom('GetTradeGood')] to na wojnie coś, co szybko znika. Na [tgf_market_holder.Custom('PL_jego_jej')] zlecenie kwatermistrzowie kupują wszystko, co zdoła przewieźć mój szlak, i pytają, kiedy będzie więcej.\n\nGdzie inni wokół mnie widzą armie, ja widzę klientów."
 gdp_trade_good_flavor.2009.a: "Wojna płaci z góry."
 gdp_trade_good_flavor.2009.b: "Przywileje. Na piśmie. Natychmiast."
 gdp_trade_good_flavor.2009.c: "Pamiętaj, kto cię uzbroił."
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "Gildia puka do drzwi"
 gdp_trade_good_flavor.2010.desc: "Gildia [tgf_source_culture.GetName|l] z miejsca o nazwie [tgf_source_county.GetNameNoTier] pisze do mnie, bardzo uprzejmie. Moje ceny są niższe od ich cen, więc chcieliby je wspólnie ze mną ustalić, zanim komuś stanie się krzywda.\n\nGildie pukają uprzejmie, ale tylko raz."
 gdp_trade_good_flavor.2010.a: "Zapłacić składkę. Ustalić cenę."
 gdp_trade_good_flavor.2010.b: "Niech robią, co chcą."
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "Władcy dyktują modę"
 gdp_trade_good_flavor.2011.desc: "Wieści podróżują szybciej niż wozy. [tgf_good.Custom('GetTradeGood')|U] z moich magazynów to teraz gorący temat, bo [tgf_market_holder.GetTitledFirstName] pokazuje się w moim towarze całemu swojemu dworowi w miejscu znanym jako [tgf_source_county.GetNameNoTier], a połowa dworzan już dopytuje, skąd ten towar pochodzi.\n\nWładcy dyktują modę. Kupcy dyktują ceny."
 gdp_trade_good_flavor.2011.a: "Rozgłosić wszystkim, czyj to był towar."
 gdp_trade_good_flavor.2011.b: "Podnieść cenę, póki się gapią."
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "Próbka towaru"
 gdp_trade_good_flavor.2012.desc: "Patrzą na mnie [tgf_good.Custom('GetTradeGoodUnitPlural')] pełne towaru. Mam za sobą czarny miesiąc, w głowie huczy gonitwa myśli, a wokół mnie [tgf_good.Custom('GetTradeGood')] – najlepszy trunek, jaki można kupić za pieniądze.\n\nKontrola jakości. Nikt nie musi wiedzieć."
 gdp_trade_good_flavor.2012.a: "Kontrola jakości. Całego zapasu."
 gdp_trade_good_flavor.2012.a.toast: "O jedną próbkę za dużo"
 gdp_trade_good_flavor.2012.b: "Nie. Towar to towar."
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "Zamówienie na arcydzieło"
 gdp_trade_good_flavor.2013.desc: "– Daj mi najlepszą sztukę swojego towaru i mistrzowską zapłatę – mówi [tgf_crafter.GetFirstName], [tgf_good.Custom('GetTgfGoodCrafter')] numer jeden w miejscu znanym jako [tgf_source_county.GetNameNoTier] – a zrobię dla ciebie coś, czego nikt jeszcze nie widział.\n\nMoja sakiewka się zastanawia. Moja duma już się zgodziła."
 gdp_trade_good_flavor.2013.a: "Zapłata uzgodniona. Zadziw mnie."
 gdp_trade_good_flavor.2013.b: "Mój towar nie potrzebuje ozdób."
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "Ich potrawa, nasz towar"
 gdp_trade_good_flavor.2014.desc: "– [tgf_good.Custom('GetTradeGood')|U] od ciebie to teraz składnik ich przysmaku, którym jest [tgf_source_province.Custom('GetTgfLocalDish')] – mówi mój handlarz, [tgf_trader.GetFirstName], częstując się. – Robi tak każdy w miejscu o nazwie [tgf_source_county.GetNameNoTier]. Kucharze nazywają to nowym sposobem i nikt już nie pamięta starego.\n\nNawet nie wiem, jak smakuje [tgf_source_province.Custom('GetTgfLocalDish')]. A duma rozpiera mnie jak nigdy."
 gdp_trade_good_flavor.2014.a: "Skoro tak, niech płacą za nowy sposób."
 gdp_trade_good_flavor.2014.b: "Więcej wozów. Kucharze są głodni."
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "Zapłata w towarze"
 gdp_trade_good_flavor.2015.desc: "– „Chcemy więcej pieniędzy”, to chcą przekazać ci [tgf_good.Custom('GetTgfGoodGatherers')] z miejsca o nazwie [tgf_source_county.GetNameNoTier], których reprezentuję – mówi [tgf_spokesperson.GetFirstName].\n\nZamiast tego proponuję im towar o nazwie [tgf_good.Custom('GetTradeGood')].\n\n– Przecież jego pozyskiwaniem się zajmujecie – zauważam. – Na pewno go lubicie!\n\nNie lubią."
 gdp_trade_good_flavor.2015.a: "Zapłacić im. W monecie."
 gdp_trade_good_flavor.2015.b: "Dać im udział w zyskach."
 gdp_trade_good_flavor.2015.c: "Towar to też zapłata."
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "Pieniądze nie śmierdzą"
 gdp_trade_good_flavor.2016.desc: "– Coś mi tu śmierdzi – mówi kupujący w miejscu o nazwie [tgf_source_county.GetNameNoTier], trzymając wyprostowaną rękę, w której jest mój towar, [tgf_good.Custom('GetTradeGood')].\n\n– [tgf_good.Custom('GetTgfGoodFlaw')|U] – słyszę.\n\nBiorę od kupującego monetę i ją wącham. [Glossary( 'Nie pachnie niczym', 'TGF_PECUNIA_NON_OLET_GLOSS' )]."
 gdp_trade_good_flavor.2016.a: "Sprzedawaj kupującym z katarem."
 gdp_trade_good_flavor.2016.b: "Może jest coś na ten zapach?"
 gdp_trade_good_flavor.2016.c: "Trzymaj monetę pod nosem. Cały dzień."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#! – „pieniądze nie śmierdzą”. Podobno rzymski cesarz Wespazjan, by to udowodnić, podsunął synowi pod nos monetę z podatku od publicznych latryn."
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "Siedem tłustych lat"
 gdp_trade_good_flavor.2017.desc: "Śnię o siedmiu tłustych krowach i siedmiu chudych[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]. Budzę się i przed śniadaniem robię rachunki.\n\nIle chude lata by nie kosztowały, mój towar, [tgf_good.Custom('GetTradeGood')], będzie droższy."
 gdp_trade_good_flavor.2017.a: "Zmagazynuj wszystko. Wszystkie [tgf_good.Custom('GetTradeGoodUnitPlural')]."
 gdp_trade_good_flavor.2017.b: "Dokup teraz, póki tanio."
 gdp_trade_good_flavor.2017.c: "Krowy to nie księgi rachunkowe. Śpij dalej."
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "Czyjeś bydło"
 gdp_trade_good_flavor.2018.desc: "Wychodzę i widzę, że brama jest zablokowana. To [tgf_good.Custom('GetTradeGood')] w stadzie. Pośród niego szczerzy zęby mój handlarz, [tgf_trader.GetFirstName].\n\n– Osoba o imieniu [tgf_raider.GetFirstName], [Glossary( 'rabuś', 'TGF_CATTLE_RAID_GLOSS' )], przyprowadziła je z pastwisk, na których wypasa bydło [tgf_market_holder.GetTitledFirstName]. Nie pytaj jak. Połowa ceny rynkowej.\n\nNa każdym boku widnieje symbol, którym [tgf_market_holder.GetFirstNameNoTooltip] znakuje swoje bydło.\n\n– Znaki – dodaje [tgf_trader.GetFirstNameNoTooltip] – można zmienić."
 gdp_trade_good_flavor.2018.a: "Okazja to okazja, bez względu na znak."
 gdp_trade_good_flavor.2018.a.toast: "Ktoś rozpoznał znak"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUINameNotMe] ma na sumieniu świadomy zakup zwierząt skradzionych ze stad osoby znanej jako [CHARACTER.GetShortUINameNotMe]."
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUINameNotMe] ma na sumieniu świadomy zakup zwierząt skradzionych ze stad osoby znanej jako [TARGET_CHARACTER.GetShortUINameNotMe]."
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] będzie mieć wobec mnie dług za nie."
 gdp_trade_good_flavor.2018.c: "Szybko je zarżnąć."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "Napady na stada sąsiadów były zarówno dawną rozrywką, jak i poważnym interesem. Wielki irlandzki epos Táin Bó Cúailnge opowiada o wojnie stoczonej o jednego byka."
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "Pragnienie trzeźwego dworu"
 gdp_trade_good_flavor.2019.desc: "– Na dworze, którym rządzi [tgf_market_holder.GetTitledFirstName], [tgf_good.Custom('GetTradeGood')] to coś, czego nigdy się nie pije – mówi mi mój handlarz, [tgf_trader.GetFirstName]. – A jednak ten sam dwór składa u nas zamówienie na ten towar. I to nie 1 [tgf_good.Custom('GetTradeGoodUnit')], ale aż 40. Najwyraźniej jedno nie wyklucza drugiego.\n\nWiara, którą wyznaje [tgf_market_holder.GetFirstNameNoTooltip], [Glossary( 'zakazuje picia', 'TGF_ABU_NUWAS_GLOSS' )]. Nic nie zakazuje zawyżania cen."
 gdp_trade_good_flavor.2019.a: "Oznaczyć beczki jako ocet."
 gdp_trade_good_flavor.2019.b: "Podwoić cenę. Komu mieliby się poskarżyć?"
 gdp_trade_good_flavor.2019.b.toast: "Inny dostawca"
 gdp_trade_good_flavor.2019.b.toast_good: "Zapłacono w całości"
 gdp_trade_good_flavor.2019.c: "Nie warto ryzykować głowy. Sprzedajmy gdzie indziej."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "Na wielu dworach wino było zakazane, a na większości uwielbiane. Abu Nuwas, poeta na dworze kalifa Haruna ar-Raszida, napisał jedne z najpiękniejszych arabskich wierszy o winie."
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "Krąg idealny"
 gdp_trade_good_flavor.3001.desc: "Magazyn pachnie nim, zanim go dostrzegam. Krąg sera tak dojrzałego i tłustego, że tragarze wystawiają przy nim straż, na wpół żartem. Na wpół.\n\nZłoto z jego sprzedaży starczyłoby na całą ucztę. Zatrzymany sam będzie ucztą."
 gdp_trade_good_flavor.3001.a: "Strzeżcie go jak oka w głowie."
 gdp_trade_good_flavor.3001.b: "Wszystko ma swoją cenę. Nawet doskonałość."
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "Słynna reklamacja"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "Najstarsza znana skarga klienta: gliniana tabliczka z Ur, licząca już teraz blisko trzy tysiące lat, w której niejaki Nanni ostro gani kupca Ea-nasira za dostarczenie kiepskich sztab miedzi i pogardliwe potraktowanie jego posłańca."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName] pisze, że moja miedź jest kiepska, a sztaby za lekkie. Wszystko prawda.\n\n– Za kogo ty mnie masz, że traktujesz mnie z taką [Glossary( 'pogardą', 'TGF_EA_NASIR_GLOSS' )]?\n\nMam [tgf_market_holder.Custom('PL_go_ja')] za kogoś, kto płaci jak należy. Pieniądze od [tgf_market_holder.Custom('PL_niego_niej')] już są u mnie."
 gdp_trade_good_flavor.3002.a: "Kupi znowu. Zawsze kupuje."
 gdp_trade_good_flavor.3002.a.toast: "Nigdy więcej"
 gdp_trade_good_flavor.3002.a.toast_good: "Powrót po więcej"
 gdp_trade_good_flavor.3002.b: "Moja miedź jest pełnowartościowa. Niech to sprawdzi!"
 gdp_trade_good_flavor.3002.b.toast_bad: "Na gorącym uczynku"
 gdp_trade_good_flavor.3002.b.toast_good: "Próba wypada pomyślnie"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUINameNotMe] ma na sumieniu sprzedaż zbyt lekkich sztab osobie znanej jako [CHARACTER.GetShortUINameNotMe] i zapewnienia, że mają one pełną wagę."
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUINameNotMe] ma na sumieniu sprzedaż zbyt lekkich sztab osobie znanej jako [TARGET_CHARACTER.GetShortUINameNotMe] i zapewnienia, że mają one pełną wagę."
 gdp_trade_good_flavor.3002.c: "Przeprosiny, a następnym razem lepsze sztaby."
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "Zapłata w pieprzu"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "Wagowo pieprz był wart niemal tyle, co srebro, i często przyjmowano go jako zapłatę. W Londynie prawa króla Æthelreda z około 1000 roku ustalały, że niemieccy kupcy uiszczają część opłat w pieprzu."
 gdp_trade_good_flavor.3003.desc: "Jeden z moich dłużników w miejscu znanym jako [tgf_source_county.GetNameNoTier], [tgf_debtor.GetFirstName], nie ma już ani grosza. Spłaca więc dług w [Glossary( 'pieprzu', 'TGF_PEPPER_GLOSS' )], stopniowo, po trochu – aż mój stół pachnie jak targ z przyprawami.\n\nLiczę dwa razy. Niezła stawka. A [tgf_debtor.GetFirstNameNoTooltip] nie może być jedynym takim przypadkiem."
 gdp_trade_good_flavor.3003.a: "Odtąd przyjmuję pieprz."
 gdp_trade_good_flavor.3003.b: "Monety. Uzbieraj je jakoś."
 gdp_trade_good_flavor.3003.c: "Pracuj dla mnie. Dług może poczekać."
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "List pełen narzekań"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "Kupieckie listy przechowywane przez wieki – takie jak te z kairskiej genizy, synagogalnego składu na nieużywane już pisma – opisują śródziemnomorski handel z wyczerpującą, pełną pretensji szczegółowością. Najwięcej narzekają handlarze lnem."
 gdp_trade_good_flavor.3004.desc: "Mój handlarz, [tgf_trader.GetFirstName], sprzedaje w miejscu znanym jako [tgf_source_county.GetNameNoTier] każdą belę mojego lnu po dobrej cenie. Tak twierdzi [tgf_trader.Custom('PL_jego_jej')] [Glossary( 'list', 'TGF_GENIZA_GLOSS' )] – w jednej linijce. Pozostałe czterdzieści to narzekania: na wilgoć, tragarzy, kupujących, moje pakowanie.\n\nNajpierw zysk, potem utyskiwanie. Odwrotna kolejność by mnie martwiła."
 gdp_trade_good_flavor.3004.a: "Jedna linijka o zysku. Tę czytam dwa razy."
 gdp_trade_good_flavor.3004.b: "Czterdzieści linijek darmowych rad."
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "Cukrowa ozdoba"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "Ozdobna figura z cukru i masy migdałowej podawana między daniami uczty – zamki, statki i zwierzęta wyrzeźbione tak, by zadziwić gości. Najokazalsze z nich były w równym stopniu manifestami politycznymi, co deserami."
 gdp_trade_good_flavor.3005.desc: "– Osobie znanej jako [tgf_market_holder.GetTitledFirstName] marzy się [ROOT.Char.Custom('GetRandomRegionalBird')] z cukru – mówi mi mój handlarz, [tgf_trader.GetFirstName]. – Ptak ma być dwa razy większy niż w rzeczywistości, z każdym piórkiem wyrzeźbionym osobno, i ma trafić na [tgf_market_holder.Custom('PL_jego_jej')] stół do połowy lata. Ma to być [Glossary( 'cukrowa ozdoba', 'TGF_SUBTLETY_GLOSS' )] na zwieńczenie [tgf_market_holder.Custom('PL_jego_jej')] uczty.\n\nCukier się topi. Reputacja zostaje."
 gdp_trade_good_flavor.3005.a: "Zrobię to. Będzie większy niż w rzeczywistości."
 gdp_trade_good_flavor.3005.a.success: "Na uczcie zapada cisza"
 gdp_trade_good_flavor.3005.a.failure: "Krzywy ptak"
 gdp_trade_good_flavor.3005.b: "Odświętne ceny za odświętne dzieła."
 gdp_trade_good_flavor.3005.c: "Sprzedaję cukier, nie rzeźby."
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "Rój"
 gdp_trade_good_flavor.3006.desc: "Pszczoły przyleciały bez zaproszenia, zbudowały gniazdo między krokwiami i teraz wytwarzają miód w moim magazynie, nie płacąc czynszu.\n\nLokatorzy, którzy płacą miodem. Bywają gorsze układy – jeśli nie liczyć użądleń."
 gdp_trade_good_flavor.3006.a: "Darmowy miód. Co mi szkodzi?"
 gdp_trade_good_flavor.3006.a.toast: "Użądlenie!"
 gdp_trade_good_flavor.3006.b: "Niech pracują. Nie płacąc czynszu."
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "Jeszcze jeden dzbanek herbaty"
 gdp_trade_good_flavor.3007.desc: "Jedna filiżanka, żeby poznać towar. Potem druga, bo pierwsza podziałała. Do północy mam za sobą ponowne przeliczenie trzech ksiąg rachunkowych i dwa napisane listy, a czuję się wspaniale.\n\nTo albo bardzo dobry towar, albo bardzo kosztowny nałóg."
 gdp_trade_good_flavor.3007.a: "Jeszcze jeden dzbanek. Co rano."
 gdp_trade_good_flavor.3007.b: "Podać to całej kompanii."
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "Zanim się zepsuje"
 gdp_trade_good_flavor.3008.desc: "Mój handlarz, [tgf_trader.GetFirstName], coś trzyma. To [tgf_good.Custom('GetTradeGoodUnit')] towaru o nazwie [tgf_good.Custom('GetTradeGood')]. Otwiera i się krzywi.\n\n– Do środka wdarła się rzeczna mgła. Wszystko mięknie, a do końca tygodnia pokryje się pleśnią.\n\nSuszone owoce wytrzymują latami. Wilgotne – kilka dni. Czas to pieniądz."
 gdp_trade_good_flavor.3008.a: "Wysuszyć jeszcze raz, tym razem porządnie."
 gdp_trade_good_flavor.3008.b: "Zostawmy do fermentacji. Nazwiemy to winem."
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "Olej o północy"
 gdp_trade_good_flavor.3009.desc: "Olej w lampie kończy się godzinę przed dokończeniem rachunków, więc spalam własny zapas – [tgf_good.Custom('GetTradeGood')] wysokiej jakości z przeznaczeniem na sprzedaż. Mój towar pali się wcale nie jaśniej niż mętne popłuczyny, które wylewamy.\n\nWcale nie jaśniej. A jednak kupujący płacą za niego trzy razy więcej."
 gdp_trade_good_flavor.3009.a: "Resztki sprzedawaj do lamp, dobry olej na stoły."
 gdp_trade_good_flavor.3009.b: "Spalaj dalej. Rachunki są najważniejsze."
 gdp_trade_good_flavor.3009.c: "Do łóżka. Olej też powinien odpocząć."
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "Na pniu"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "Zboże kupowane „na pniu” opłacano, gdy jeszcze zieleniło się na polu, po cenie znacznie niższej od tej, jaką przyniosłyby zbiory. Kaznodzieje i kanoniści potępiali tę praktykę jako ukrytą lichwę."
 gdp_trade_good_flavor.3010.desc.condemned: "Moja wiara nazywa to lichwą. Moje księgi – rabatem."
 gdp_trade_good_flavor.3010.desc.permitted: "Niektóre wyznania nazywają to lichwą. Moje nazywa to przezornością."
 gdp_trade_good_flavor.3010.desc.intro: "– Pole jest dziś zielone, lecz do lata pokryje się barwą złota – mówi mi [tgf_peasant.GetFirstName] z miejsca o nazwie [tgf_source_county.GetNameNoTier], grzęznąc kolanem w błocie. – Zapłać mi dzisiejszą cenę, [Glossary( 'na pniu', 'TGF_IN_THE_BLADE_GLOSS' )], a plony będą twoje.\n\n"
 gdp_trade_good_flavor.3010.a: "Przyszłoroczne zbiory w tegorocznej cenie."
 gdp_trade_good_flavor.3010.b: "Zatrzymaj swoje uprawy, aż urosną."
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "Dziesięcioletnie proso"
 gdp_trade_good_flavor.3011.desc: "Za nowszymi zapasami znajduję [tgf_good.Custom('GetTradeGoodUnitPlural')] prosa sprzed lat – zapomniane, błędnie ujęte w ewidencji. Każde ziarno wciąż nadaje się do spożycia. Proso dobrze się przechowuje.\n\nDarmowe zapasy z przeszłości. Najlepszy rodzaj spadku."
 gdp_trade_good_flavor.3011.a: "Sprzedać je. Moja praca nie może pójść na marne."
 gdp_trade_good_flavor.3011.b: "Spakować je na drogę. Proso dobrze się przechowuje."
 gdp_trade_good_flavor.3011.c: "Przeliczyć cały magazyn."
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "Polerowany czy nie"
 gdp_trade_good_flavor.3012.desc: "Ryż polerowany jest biały, lekki i pożądany przy każdym wytwornym stole. Ryż niepolerowany jest ciężki, brązowy i poszukiwany wszędzie indziej. Mój handlarz, [tgf_trader.GetFirstName], chce wiedzieć, jakim typem kupca jestem.\n\nJestem takim, któremu płacą."
 gdp_trade_good_flavor.3012.a: "Wypolerować go. Wykwintne stoły oznaczają dobrą cenę."
 gdp_trade_good_flavor.3012.b: "Sprzedać brązowy, po taniości – każdemu chętnemu."
 gdp_trade_good_flavor.3012.c: "Wypolerować najlepsze ziarna. Resztę sprzedać jako brązowy."
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "Przed postem"
 gdp_trade_good_flavor.3013.desc: "– [tgf_source_faith.Custom('GetTgfFastName')] niebawem się zacznie! – pisze w pośpiechu mój handlarz, [tgf_trader.GetFirstName], przebywając w miejscu o nazwie [tgf_source_county.GetNameNoTier]. – Przez wiele tygodni nikt nie tknie mięsa – a potem każdy nadrobi braki z nawiązką.\n\nGłodny nabywca nigdy się nie targuje."
 gdp_trade_good_flavor.3013.desc_ramadan: "– Ramadan niebawem się zacznie! – pisze w pośpiechu mój handlarz, [tgf_trader.GetFirstName], przebywając w miejscu o nazwie [tgf_source_county.GetNameNoTier]. – Nikt nie je aż do zachodu słońca, a po zachodzie słońca wszyscy jedzą tylko mięso.\n\nGłodny nabywca nigdy się nie targuje."
 gdp_trade_good_flavor.3013.a: "Ja również przestrzegam postu. Mięso może poczekać."
 gdp_trade_good_flavor.3013.b: "Posolić je… i czekać na głód."
 gdp_trade_good_flavor.3013.c: "Sprzedać wszystko podczas ostatniej uczty przed postem."
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "Zajrzeć mu w zęby"
 gdp_trade_good_flavor.3014.desc: "Handlarz końmi o imieniu [tgf_dealer.GetFirstName] zarzeka się na wszystko, co dla [tgf_dealer.Custom('PL_niego_niej')] święte. – Cztery lata, najwyżej pięć. Spójrz na tę sierść! – Sierść jest bardzo ładna. Zauważam jednak, że [tgf_dealer.GetFirstName] wciąż odciąga mnie od zębów.\n\nIstnieje pewne powiedzenie dotyczące darowanych koni. Ale ten koń nie jest darem."
 gdp_trade_good_flavor.3014.a: "Otworzyć szeroko. Zerknijmy na te zęby."
 gdp_trade_good_flavor.3014.b: "Stary czy nie, będzie mój."
 gdp_trade_good_flavor.3014.c: "Dotrzymujesz słowa. Dołącz do mojej kompanii."
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "Płatne tuczenie"
 gdp_trade_good_flavor.3015.desc: "– Stado dotarło do miejsca o nazwie [tgf_source_county.GetNameNoTier] wychudzone i zmęczone – niczym własne widma – mówi mi mój handlarz, [tgf_trader.GetFirstName]. – [tgf_market_holder.GetTitledFirstName] ma w pobliżu dobre pastwisko i chce je nam udostępnić. Za opłatą, oczywiście.\n\nTłuszcz się sprzedaje. Trawa jest tańsza niż tłuszcz."
 gdp_trade_good_flavor.3015.a: "Zapłacić za trawę. Sprzedać tłuszcz."
 gdp_trade_good_flavor.3015.b: "Chude zwierzęta też mają swoją cenę."
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "Skóra cielęca dla skrybów"
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.GetTitledFirstName], kapelan osoby znanej jako [tgf_market_holder.GetTitledFirstName], przechadza się po mojej garbarni niczym pielgrzym wybierający relikwie. – Te cienko zeskrobane skóry mogłyby nieść święte słowa przez tysiąc lat – wyrzuca z siebie.\n\nTysiąc lat przydatności moich skór. Całkiem nieźle jak na krowę."
 gdp_trade_good_flavor.3016.a: "Weźcie te najlepsze – w prezencie."
 gdp_trade_good_flavor.3016.b: "To dla skrybów. Niech im służy."
 gdp_trade_good_flavor.3016.c: "Wolę je sprzedać szewcom."
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "Skupywanie rocznego zbioru"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "Opactwa cysterskie sprzedawały swój roczny zbiór wełny – pozyskany podczas strzyży – włoskim i flamandzkim kupcom z wieloletnim wyprzedzeniem, przyjmując zapłatę za runo, które jeszcze nawet nie urosło. Wiele rodów wpędziło się przez to w poważne długi."
 gdp_trade_good_flavor.3017.desc: "– [tgf_abbot.GetTitledFirstName] oferuje nam wełnę z miejsca o nazwie [tgf_abbey.GetNameNoTier] na kolejne lata – mówi mi mój handlarz, [tgf_trader.GetFirstName]. – [Glossary( 'Lata zbiorów', 'TGF_WOOL_CLIP_GLOSS' )], opłacone teraz, dostarczane runo po runie. Chce otrzymać zapłatę już dziś.\n\nPlanuje z dużym wyprzedzeniem. Podobnie czynią kupcy."
 gdp_trade_good_flavor.3017.a: "Zapłacimy teraz, a wełny będziemy mieli przez kolejne lata."
 gdp_trade_good_flavor.3017.b: "Wolę owce już ostrzyżone."
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "Roślinne jagnię"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "Legenda powtarzana zarówno przez podróżników, jak i uczonych, głosi, że na dalekim wschodzie rośnie roślina, na której łodydze pojawiają się żywe jagnięta; pasą się w pobliżu, dopóki łodyga nie zwiędnie. Był to jeden ze sposobów na wyjaśnienie istnienia bawełny – wełny wyrastającej z roślin."
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName], nabywca w miejscu o nazwie [tgf_source_county.GetNameNoTier], z podziwem obraca w dłoni kępkę mojej bawełny. – Czy to prawda? Mówią, że rośnie na roślinie, która wydaje na świat małe jagnięta; pasą się, dopóki łodyga nie opadnie.\n\n[Glossary( 'Roślinne jagnię', 'TGF_VEGETABLE_LAMB_GLOSS' )]. Cuda się sprzedają."
 gdp_trade_good_flavor.3018.a: "To prawda – każde słowo. I wielka rzadkość."
 gdp_trade_good_flavor.3018.b: "Nie ma żadnych jagniąt. Jest tylko bardzo puszysta roślina."
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "Spolium"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "Kamień pozyskany ze starych budowli i ponownie wykorzystany w nowych. Kolumny, rzeźby oraz bloki z inskrypcjami, pochodzące ze starożytnych ruin, trafiały do kościołów, murów i domów w całym średniowiecznym świecie."
 gdp_trade_good_flavor.3019.desc: "– Kamieniarze przestali wydobywać kamień – zwierza się mój handlarz, [tgf_trader.GetFirstName], w liście z miejsca o nazwie [tgf_source_county.GetNameNoTier]. – Zamiast tego wycinają go ze starych ruin – kolumny, rzeźbienia, wszystko po kolei.\n\n[Glossary( 'Spolium', 'TGF_SPOLIA_GLOSS' )]. Stary kamień, nowa cena."
 gdp_trade_good_flavor.3019.a: "Antyczny kamień za cenę antyków."
 gdp_trade_good_flavor.3019.b: "Zostawić dla mnie najwspanialszą rzeźbę."
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "Pień masztowy"
 gdp_trade_good_flavor.3020.desc: "– Stoczniowcy osoby znanej jako [tgf_market_holder.GetTitledFirstName] liczą na nasz towar – mówi mi mój handlarz, [tgf_trader.GetFirstName]. – [tgf_good.Custom('GetTradeGood')|U]. I to nie byle jakie drewno. Chcą najdłuższych, najprostszych pni, jakie mamy – na maszty. Wiedzą, że doskonałe drewno to rzadkość.\n\nRzadkich rzeczy nie należy sprzedawać w pośpiechu."
 gdp_trade_good_flavor.3020.a: "Najlepszy pień jest zarezerwowany dla mojego statku."
 gdp_trade_good_flavor.3020.b: "Sprzedać je. Budowa masztów nie może czekać."
 gdp_trade_good_flavor.3020.c: "Niech poczekają. Cena pójdzie w górę."
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "Zadymiony namiot"
 gdp_trade_good_flavor.3021.t_bhang: "Filiżanka bhang"
 gdp_trade_good_flavor.3021.t_hashish: "Słodkości za zamkniętymi drzwiami"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "Herodot pisał, że Scytowie wrzucali nasiona konopi na rozżarzone kamienie wewnątrz zamkniętych namiotów z filcu, a w kłębach dymu wyli z radości. Ludy stepowe podtrzymywały ten zwyczaj jeszcze długo potem."
 gdp_trade_good_flavor.3021.desc: "Rzuca nasiona konopi na rozgrzane kamienie w swoim namiocie, a dym unosi się w górę. – [Glossary( 'Oddychaj', 'TGF_HEMP_TENT_GLOSS' )], kupcze. Tak właśnie prowadzimy tu interesy.\n\nTo ma oczywiście cel wyłącznie biznesowy."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "W Atharwawedzie bhang wymieniany jest wśród pięciu świętych roślin. Liście konopi uciera się z mlekiem, ghi oraz przyprawami, tworząc napój spożywany podczas świąt i składany w ofierze Śiwie."
 gdp_trade_good_flavor.3021.desc_bhang: "Uciera liście konopi z mlekiem i przyprawami, po czym wręcza mi kubek. – To [Glossary( 'bhang', 'TGF_HEMP_BHANG_GLOSS' )], kupcze. W czasie uroczystości całe miasto to pije. Dziś ty również się go napijesz.\n\nOdmowa byłaby niegrzeczna, a niegrzeczność szkodzi interesom."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "Haszysz – żywica konopna spożywana w formie past i słodyczy – rozpowszechnił się w Egipcie i Syrii począwszy od XII wieku. Niektórzy sufici wychwalali go jako klucz do ekstazy, podczas gdy prawoznawcy potępiali go, a władcy nakazywali wypalanie całych pól uprawnych."
 gdp_trade_good_flavor.3021.desc_hashish: "Zamyka drzwi i rozwija niewielki smakołyk z prasowanej żywicy konopnej. – To [Glossary( 'haszysz', 'TGF_HEMP_HASHISH_GLOSS' )], kupcze. Prawoznawcy patrzą na niego niechętnie. Ale ich tu nie ma.\n\nOdmówienie kupującemu byłoby niegrzeczne."
 gdp_trade_good_flavor.3021.desc.intro: "– [tgf_good.Custom('GetTradeGood')|U] [tgf_good.Custom('GetTgfHempUse')]? – śmieje się [tgf_hemp_host.GetTitledFirstName] z miejsca o nazwie [tgf_source_county.GetNameNoTier]. – Znamy lepsze zastosowanie.\n\n"
 gdp_trade_good_flavor.3021.a: "Biznes to biznes. Podajcie ziarno."
 gdp_trade_good_flavor.3021.a_bhang: "Biznes to biznes. Podajcie kubek."
 gdp_trade_good_flavor.3021.a_hashish: "Biznes to biznes. Podajcie słodycz."
 gdp_trade_good_flavor.3021.b: "Sprzedać to. Zachowam jasność umysłu."
 gdp_trade_good_flavor.3021.a.toast_habit: "Nowy nawyk"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "Ostrze z najlepszych sztab"
 gdp_trade_good_flavor.3022.desc: "Kowal o imieniu [tgf_smith.GetFirstName] z miejsca o nazwie [tgf_source_county.GetNameNoTier] waży w dłoni jedną z moich żelaznych sztab i uśmiecha się szeroko. – Daj mi najlepsze z nich, a ja dostarczę ci ostrze warte dziesięć razy tyle, co sam metal.\n\nDziesięć razy. Wie, jak rozmawiać z kupcem."
 gdp_trade_good_flavor.3022.a: "Wykuj je. Sprawdźmy, co stoi za tymi przechwałkami."
 gdp_trade_good_flavor.3022.b: "Naucz mnie, które sztaby są najlepsze."
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "Twierdzenia szlifierza"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "Szlifierz i polerownik kamieni szlachetnych, często także czytelnik ksiąg wyliczających ukryte moce poszczególnych kamieni: od szafirów chroniących przed trucizną po ametysty zapobiegające upojeniu alkoholowemu."
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U], [Glossary( 'szlifierz kamieni szlachetnych', 'TGF_LAPIDARY_GLOSS' )] z miejsca o nazwie [tgf_source_county.GetNameNoTier], z wielką powagą trzyma jeden z moich klejnotów pod światło. – Ten kamień odpędza [ROOT.Char.Custom('GetTgfAilment')]. Tak zapisano w księgach.\n\nCena tego nie odzwierciedla. Jeszcze."
 gdp_trade_good_flavor.3023.a: "Twierdzenia mają wpływ na wartość. A cena musi ją odzwierciedlać."
 gdp_trade_good_flavor.3023.b: "Dołącz do mojej kompanii. Zabierz swoje księgi."
 gdp_trade_good_flavor.3023.c: "Nie będę podważać treści ksiąg."
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "Kamień jegomościa"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], znawca jadeitu, stuka każdym z moich okazów o swoje zęby i nasłuchuje. Dwa odstawia na bok. – Steatyt. Bardzo ładny okaz. – Reszta spotyka się z powolnym, pełnym aprobaty skinieniem głowy.\n\nCzłowiek, który potrafi odróżnić prawdę od fałszu, jest wart więcej niż jedno i drugie."
 gdp_trade_good_flavor.3024.a: "Zniszczyć podróbki. Znaleźć dostawcę."
 gdp_trade_good_flavor.3024.b: "Dołącz do mojej kompanii. Wynagrodzę cię za twoją wiedzę."
 gdp_trade_good_flavor.3024.c: "Naucz mnie tej sztuczki z zębami."
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "Porcelanowy balast"
 gdp_trade_good_flavor.3025.desc: "Mój handlarz o imieniu [tgf_trader.GetFirstName] jest z siebie bardzo zadowolony. – Statek potrzebował balastu, a nasze [tgf_good.Custom('GetTradeGoodUnitPlural')] ceramiki są ciężkie. Kapitan wziął od nas grosze.\n\nŁadunek, który sam na siebie zarabia. Takie lubię najbardziej."
 gdp_trade_good_flavor.3025.a: "Przeznaczyć oszczędności na poczet kolejnego ładunku."
 gdp_trade_good_flavor.3025.b: "Nauczymy się stosować je w formie balastu."
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "Niebezpieczna żywica"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "Lakier nie schnie na powietrzu. Każda warstwa żywicy drzewnej musi twardnieć przez wiele dni w ciepłym, wilgotnym pomieszczeniu, a wykonanie wartościowego przedmiotu wymaga nałożenia dziesiątek takich warstw. Zanim sok stwardnieje, powoduje powstawanie pęcherzy na skórze przy każdym kontakcie."
 gdp_trade_good_flavor.3026.desc: "Nowe [tgf_good.Custom('GetTradeGoodUnitPlural')] z laką dotarły, zanim ostatnia warstwa zdążyła [Glossary( 'stwardnieć', 'TGF_LACQUER_CURE_GLOSS' )]. Wykończenie wygląda perfekcyjnie – jest głębokie, lśniące, sprawia wrażenie niemal mokrego. Aż mnie korci, żeby go dotknąć.\n\nWytwórcy wyrobów lakierowanych ostrzegają, że żywica jest niebezpieczna. Podejrzewam, że przesadzają."
 gdp_trade_good_flavor.3026.a: "Wybudować wilgotne pomieszczenie, aby umożliwić prawidłowe stwardnienie."
 gdp_trade_good_flavor.3026.b: "Tylko jedno dotknięcie – żeby mieć pewność."
 gdp_trade_good_flavor.3026.b.toast_rash: "Lakier cię „ugryzł”"
 gdp_trade_good_flavor.3026.c: "Niech stwardnieje. Takie rzeczy wymagają cierpliwości."
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "Kamienie do czytania"
 gdp_trade_good_flavor.3027.desc.intro: "Szklarz o imieniu [tgf_glassmaker.GetFirstName] z miejsca o nazwie [tgf_source_county.GetNameNoTier] kładzie dwa wypolerowane kamienie na mojej księdze. Drobne cyfry powiększają się, stając się wyraźne i czarne.\n\n– To na stare oczy. Na zmęczone również.\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "Moje są zmęczone i stare. Po raz pierwszy od lat mogę przeczytać drobny druk w każdej umowie."
 gdp_trade_good_flavor.3027.desc.young_eyes: "Moje oczy nie są ani takie, ani takie. Ale teraz potrafię przeczytać drobny druk w każdej umowie."
 gdp_trade_good_flavor.3027.a: "Para skrojona dla mnie. Zapakuj je należycie."
 gdp_trade_good_flavor.3027.b: "Wyślij parę osobie znanej jako [tgf_market_holder.GetTitledFirstNameNoTooltip]."
 gdp_trade_good_flavor.3027.c: "Nie kamienie. Wieści o ich sekretnej mocy."
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "Świąteczne ceny"
 gdp_trade_good_flavor.3028.desc.christian: "– Nadchodzą święta – mówi mi mój handlarz, [tgf_trader.GetFirstName], niedługo po przybyciu z miejsca o nazwie [tgf_source_county.GetNameNoTier]. – Każdy nabywca pragnie kadzidła godnego króla i nikt nie targuje się o to, co składa w ofierze na ołtarzu.\n\n"
 gdp_trade_good_flavor.3028.desc: "– Nadchodzą święta – mówi mi mój handlarz, [tgf_trader.GetFirstName], niedługo po przybyciu z miejsca o nazwie [tgf_source_county.GetNameNoTier]. – Każdy nabywca pragnie kadzidła godnego najświętszego przybytku i nikt nie targuje się o to, co składa w ofierze na ołtarzu.\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "Nabywca, który się nie targuje, to dar od [ROOT.Char.GetFaith.HighGodNamePossessive]."
 gdp_trade_good_flavor.3028.a: "Ja też zapalę kadziło na czas uczty."
 gdp_trade_good_flavor.3028.b: "Świątynia ma pierwszeństwo wyboru. Za odpowiednią cenę."
 gdp_trade_good_flavor.3028.c: "Dni świąteczne oznaczają świąteczne ceny."
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "Teriak"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "Słynna uniwersalna mikstura lecznicza, sporządzana z dziesiątek składników – często z dodatkiem mięsa żmii oraz opium – i pozostawiana na lata w celu dojrzenia. Medycy zalecali ją na zatrucia, dżumę i niemal wszystkie inne dolegliwości."
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U], aptekarz z miejsca o nazwie [tgf_source_county.GetNameNoTier], wysyła pismo pachnące ziołami. – Twoje zapasy są dokładnie tym, czego potrzebuję do sporządzenia [Glossary( 'teriaku', 'TGF_THERIAC_GLOSS' )]. Na trucizny, zarazę i wszelkie inne dolegliwości.\n\nTo, czy działa, jest sprawą między [tgf_apothecary.Custom('PL_nim_nia')] a [tgf_apothecary.Custom('PL_jego_jej')] pacjentami. Moja rola ogranicza się do sprzedaży."
 gdp_trade_good_flavor.3029.a: "Przygotować go i sprzedawać na naszych drogach."
 gdp_trade_good_flavor.3029.b: "Wszystkie sześćdziesiąt cztery składniki. Nie ma za co."
 gdp_trade_good_flavor.3029.c: "Naucz mnie formuły. Chcę też znać dawkowanie."
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "Brak papieru na koncesje"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "W 1231 roku cesarz Fryderyk II zakazał notariuszom w Królestwie Sycylii sporządzania dokumentów urzędowych na papierze, który uważał za zbyt nietrwały, by można było mu zaufać. Dopuszczalny był wyłącznie pergamin."
 gdp_trade_good_flavor.3030.desc: "– Urzędnicy osoby znanej jako [tgf_market_holder.GetTitledFirstName] [Glossary( 'nie będą używać papieru', 'TGF_PAPER_GLOSS' )] do sporządzania oficjalnych dokumentów – mówi mi mój handlarz, [tgf_trader.GetFirstName], wciąż z niesmakiem po powrocie z miejsca o nazwie [tgf_source_county.GetNameNoTier]. – Powiadają, że nada się tylko pergamin. Jakby był święty.\n\nZ każdą zasadą można dyskutować."
 gdp_trade_good_flavor.3030.a: "Przedstaw argumenty. Papier to przyszłość."
 gdp_trade_good_flavor.3030.a.success: "Kancelaria wybiera papier"
 gdp_trade_good_flavor.3030.a.failure: "Kancelaria pozostaje przy pergaminie"
 gdp_trade_good_flavor.3030.b: "Będą więc kupować mój pergamin."
 gdp_trade_good_flavor.3030.c: "W takim razie dowiem się, czego chcą."
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "Gruit czy chmiel"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "Mieszanka ziół, takich jak woskownica czy krwawnik, która przed upowszechnieniem chmielu nadawała piwu smak i zapewniała jego trwałość. Wielu władców zastrzegło sobie wyłączne prawo do sprzedaży tej mieszanki, dzięki czemu mogli nakładać podatek na każde piwo."
 gdp_trade_good_flavor.3031.desc: "– Chmiel – szepcze [tgf_brewer.GetFirstName], piwowar z miejsca o nazwie [tgf_source_county.GetNameNoTier], stojąc nad moimi beczkami. – Daje piwo, które można przechowywać miesiącami. A chmielu nikt nie może opodatkować.\n\nW miejscu znanym jako [tgf_source_county.GetNameNoTier] każdy browarnik musi kupować [Glossary( 'gruit', 'TGF_GRUIT_GLOSS' )], którego właścicielem jest [tgf_market_holder.GetTitledFirstName], i płacić należny podatek.\n\nPostęp ma swoją cenę."
 gdp_trade_good_flavor.3031.a: "Niech będzie chmiel. Pozwólmy mu się roznieść."
 gdp_trade_good_flavor.3031.b: "Gruit, tak jak preferuje [tgf_market_holder.GetTitleAsNameNoTooltip]."
 gdp_trade_good_flavor.3031.c: "Dodać do każdej beczki odrobinę tego i tego."
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "Kosz owoców"
 gdp_trade_good_flavor.3032.desc: "[tgf_source_county.GetNameNoTier] to miejsce, w którym [tgf_fruit_province.Custom('get_region_fruit_plural')] je się całymi koszami i rzadko docierają dalej niż kolejna wioska.\n\nWysuszone – przetrwają długo. Wysłane – znajdą nabywców. Zjadam jeden owoc i sięgam po swoją księgę."
 gdp_trade_good_flavor.3032.a: "Dowiedzcie się, kto je uprawia i w jakich ilościach."
 gdp_trade_good_flavor.3032.b: "Jeszcze jedna sztuka. Do celów badawczych."
