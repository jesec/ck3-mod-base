l_polish:
 gdp_trader_work_scheme_failure_toast_title: "[trader.GetShortUINameNotMe] doświadcza trudności na rynku."
 # Trader scheme outcome modifier names and descriptions
 gdp_trader_negotiate_deals_modifier: "Korzystne warunki"
 gdp_trader_negotiate_deals_modifier_desc: "Na tym rynku wynegocjowano korzystne warunki handlowe, co poprawiło pozycję konkurencyjną kompanii."
 gdp_trader_capacity_boost_modifier: "Zwiększona przepustowość szlaku"
 gdp_trader_capacity_boost_modifier_desc: "Ulepszono logistykę karawan handlowych, zwiększając przepustowość szlaku."
 gdp_trader_lobby_advantages_modifier: "Uzyskane korzyści"
 gdp_trader_lobby_advantages_modifier_desc: "Udało się uzyskać preferencyjne warunki od właściciela rynku, co pozwoliło poprawić konkurencyjność."
 gdp_trader_undermine_competitor_modifier: "Osłabiona pozycja"
 gdp_trader_undermine_competitor_modifier_desc: "Reputacja i pozycja kompanii ucierpiały na tym rynku."
 gdp_trader_safe_passage_modifier: "Bezpieczny przejazd"
 gdp_trader_safe_passage_modifier_desc: "Podjęto działania, by zwiększyć bezpieczeństwo i szybkość przeprawy przez szlak."
 gdp_trader_exploring_new_markets_modifier: "Przebadany rynek"
 gdp_trader_exploring_new_markets_modifier_desc: "Rynek ten został zbadany, co pozwoliło zidentyfikować korzystne prawa zakupu."
 gdp_trader_studying_local_crafts_modifier: "Wiedza rzemieślnicza"
 gdp_trader_studying_local_crafts_modifier_desc: "Przyglądanie się pracy miejscowych warsztatów udoskonaliło kunszt tego handlarza, zwiększając przyrost doświadczenia stylu życia."
 gdp_trader_undivided_focus_modifier: "Pełna koncentracja"
 gdp_trader_undivided_focus_modifier_desc: "Ten [trader|El] może się skupić na własnej pracy.\nDodatkowe #P 15%#! do [Concept('scheme_success_chance', 'szansy powodzenia')|E] [Concept('schemes', 'spisków')|E] [Concept('trader', 'handlarza')|E]."
 # Merchant trait success chance bonus descs
 gdp_trader_merchant_trait_journeyman_bonus: "Wytrawny handlarz"
 gdp_trader_merchant_trait_expert_bonus: "Doświadczony handlarz"
 gdp_trader_merchant_trait_master_bonus: "Mistrz handlu"
 gdp_trader_house_member_success_bonus: "Członek [Concept('house', 'rodu')|E]"
 gdp_trader_scheme_shared_rules_tt: "\nCzłonek [Concept('house', 'rodu')|E] ma #P +10%#! [Concept('scheme_success_chance', 'szansy powodzenia spisku')|E].\n#weak W przypadku porażki:\n#![trader|E] zyskuje #N 10#! pkt [Concept('stress', 'stresu')|E]"
 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "Negocjowanie układów"
 gdp_trader_negotiate_deals_scheme_desc: "Twój handlarz spróbuje wynegocjować korzystne warunki z miejscowymi kupcami i urzędnikami w celu uzyskania lepszych cen kupna i sprzedaży na tym rynku.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] zyskuje premię do [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_negotiate_deals_scheme$” [trader|El] negocjuje korzystne warunki z miejscowymi kupcami i urzędnikami w celu uzyskania lepszych cen kupna i sprzedaży.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] zyskuje premię do [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_success_title: "Handlarz: wynegocjowano układ"
 gdp_trader_negotiate_deals_scheme_success_desc: "[trader.GetShortUINameNotMe] z powodzeniem zapewnia sobie jeszcze większy udział w handlu na rynkach w miejscu o nazwie [trader.GetCurrentLocation.GetName]."
 gdp_trader_finding_a_deal_scheme: "Zawieranie umów"
 gdp_trader_finding_a_deal_scheme_desc: "Twój handlarz będzie wypatrywał okazji do zysku i próbował zamieniać niewielkie marże na gotówkę.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [gold_i] [gold|El]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_finding_a_deal_scheme$” [trader|El] będzie wypatrywał okazji do zysku i próbował zamieniać niewielkie marże na gotówkę.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [gold_i] [gold|El]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_success_title: "Handlarz: ubito interes"
 gdp_trader_finding_a_deal_scheme_success_desc: "[trader.GetShortUINameNotMe] zawiera korzystny interes w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]"
 gdp_trader_securing_surplus_scheme: "Obsługa nadwyżki"
 gdp_trader_securing_surplus_scheme_desc: "Twój handlarz spróbuje wykryć nadwyżki towarów na tym rynku i zorganizować ich transport szlakiem, tymczasowo zwiększając przepustowość.\n\n#weak W przypadku powodzenia:\n#!Twoja [company|El] zyskuje większą [Concept('trade_route_capacity', 'przepustowość')|E] na tym [Concept('trade_route', 'szlaku handlowym')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_securing_surplus_scheme$” [trader|El] wykrywa nadwyżki towarów i organizuje ich transport szlakiem, tymczasowo zwiększając przepustowość.\n\n#weak W przypadku powodzenia:\n#![company|E] zyskuje większą [Concept('trade_route_capacity', 'przepustowość')|E] na tym [Concept('trade_route', 'szlaku handlowym')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_success_title: "Handlarz: obsłużono nadwyżkę"
 gdp_trader_securing_surplus_scheme_success_desc: "[trader.GetShortUINameNotMe] przyciska rzemieślników w miejscu znanym jako [trader.GetCurrentLocation.GetName], dzięki czemu pozyskuje dodatkowe towary."
 gdp_trader_appraising_market_scheme: "Analiza rynku"
 gdp_trader_appraising_market_scheme_desc: "Twój handlarz spróbuje poddać analizie lokalne warunki rynkowe i zidentyfikować najlepsze możliwości handlowe.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] zyskuje premię do [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_appraising_market_scheme$” [trader|El] poddaje analizie lokalne warunki rynkowe, aby zidentyfikować najlepsze możliwości handlowe.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] zyskuje premię do [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_success_title: "Handlarz: przeanalizowano rynki"
 gdp_trader_appraising_market_scheme_success_desc: "[trader.GetShortUINameNotMe] dostrzega nowe widoki na interesy w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_organizing_caravan_scheme: "Organizacja karawan"
 gdp_trader_organizing_caravan_scheme_desc: "Twój handlarz spróbuje poprawić efektywność i organizację karawan handlowych, co umożliwi przewóz większej ilości towarów na tym szlaku.\n\n#weak W przypadku powodzenia:\n#!Twoja [company|El] zyskuje większą [Concept('trade_route_capacity', 'przepustowość')|E] na tym [Concept('trade_route', 'szlaku handlowym')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_organizing_caravan_scheme$” [trader|El] poprawia efektywność i organizację karawan handlowych, aby umożliwić przewóz większej ilości towarów na tym szlaku.\n\n#weak W przypadku powodzenia:\n#![company|E] zyskuje większą [Concept('trade_route_capacity', 'przepustowość')|E] na tym [Concept('trade_route', 'szlaku handlowym')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_success_title: "Handlarz: przeorganizowano karawany"
 gdp_trader_organizing_caravan_scheme_success_desc: "[trader.GetShortUINameNotMe] znajduje lżejszy materiał na opakowania."
 gdp_trader_exploring_new_markets_scheme: "Ekspansja rynkowa"
 gdp_trader_exploring_new_markets_scheme_desc: "Twój handlarz spróbuje dokonać rozpoznania rynku, na który kompania jeszcze nie wkroczyła, przygotowując grunt pod przyszłą współpracę handlową.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] obniża ceny zakupu na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_exploring_new_markets_scheme$” [trader|El] dokonuje rozpoznania rynku, na który kompania jeszcze nie wkroczyła, i przygotowuje grunt pod przyszłą współpracę handlową.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] obniża ceny zakupu na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_success_title: "Handlarz: dokonano ekspansji rynkowej"
 gdp_trader_exploring_new_markets_scheme_success_desc: "[trader.GetShortUINameNotMe] trafia na sprzedawców oferujących niskie ceny w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_identifying_rare_goods_scheme: "Identyfikacja towarów rzadkich"
 gdp_trader_identifying_rare_goods_scheme_desc: "Twój handlarz spróbuje poszukać na tym rynku rzadkich lub luksusowych towarów w nadziei na znaczny zysk.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz sporo [gold_i] [Concept('gold', 'złota')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_identifying_rare_goods_scheme$” [trader|El] poszukuje na rynku rzadkich lub luksusowych towarów w nadziei na znaczny zysk\n\n#weak W przypadku powodzenia:\n#!Zyskujesz sporo [gold_i] [Concept('gold', 'złota')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_success_title: "Handlarz: zidentyfikowano towary rzadkie"
 gdp_trader_identifying_rare_goods_scheme_success_desc: "[trader.GetShortUINameNotMe] znajduje drogocenne klejnoty w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Diplomacy schemes
 gdp_trader_negotiating_with_ruler_scheme: "Negocjacje ze szlachtą"
 gdp_trader_negotiating_with_ruler_scheme_desc: "Twój handlarz spróbuje uzyskać przychylność właścicieli rynków.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [opinion_i] [Concept('opinion', 'opinię')|E] u lokalnego władcy na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_negotiating_with_ruler_scheme$” [trader|El] pracuje nad uzyskaniem przychylności właścicieli rynku.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [opinion_i] [Concept('opinion', 'opinię')|E] u lokalnego władcy na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_success_title: "Handlarz: negocjowano ze szlachtą"
 gdp_trader_negotiating_with_ruler_scheme_success_desc: "[trader.GetShortUINameNotMe] robi doskonałe wrażenie na władcy miejsca znanego jako [trader.GetCurrentLocation.GetName]."
 gdp_trader_building_connections_scheme: "Budowanie relacji"
 gdp_trader_building_connections_scheme_desc: "Twój handlarz spróbuje nawiązać trwałe relacje z miejscowymi urzędnikami, aby uzyskać dostęp do zasobów państwowych.\n\n#weak W przypadku powodzenia:\n#!Twoja [company|El] zyskuje większą [Concept('trade_route_capacity', 'przepustowość')|E] na tym [Concept('trade_route', 'szlaku handlowym')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_building_connections_scheme$” [trader|El] nawiązuje trwałe relacje z miejscowymi urzędnikami, aby uzyskać dostęp do zasobów państwowych.\n\n#weak W przypadku powodzenia:\n#![company|E] zyskuje większą [Concept('trade_route_capacity', 'przepustowość')|E] na tym [Concept('trade_route', 'szlaku handlowym')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_success_title: "Handlarz: zbudowano relacje"
 gdp_trader_building_connections_scheme_success_desc: "[trader.GetShortUINameNotMe] przekonuje urzędników w miejscu o nazwie [trader.GetCurrentLocation.GetNameNoTooltip], by przepuścili szlakiem więcej ładunku."
 gdp_trader_lobbying_advantages_scheme: "Wywieranie nacisku w celu uzyskania korzyści"
 gdp_trader_lobbying_advantages_scheme_desc: "Twój handlarz spróbuje wywrzeć nacisk na właściciela rynku, aby uzyskać preferencyjne traktowanie i poprawić konkurencyjność kompanii.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] zyskuje premię do [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_lobbying_advantages_scheme$” [trader|El] wywiera nacisk na właściciela rynku, aby uzyskać preferencyjne traktowanie i poprawić pozycję konkurencyjną kompanii.\n\n#weak W przypadku powodzenia:\n#!Odwiedzony [trade_market|El] zyskuje premię do [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_success_title: "Handlarz: wywarto nacisk w celu uzyskania korzyści"
 gdp_trader_lobbying_advantages_scheme_success_desc: "[trader.GetShortUINameNotMe] zapewnia sobie przychylne traktowanie w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_building_reputation_scheme: "Budowanie reputacji"
 gdp_trader_building_reputation_scheme_desc: "Twój handlarz spróbuje poprawić rozpoznawalność i reputację kompanii w tym regionie.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [prestige_i] [prestige|El]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_building_reputation_scheme$” [trader|El] poprawia rozpoznawalność i reputację kompanii w regionie.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [prestige_i] [prestige|El]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_success_title: "Handlarz: zbudowano reputację"
 gdp_trader_building_reputation_scheme_success_desc: "[trader.GetShortUINameNotMe] przynosi chwałę kompanii w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_championing_patron_scheme: "Dbanie o interesy patrona"
 gdp_trader_championing_patron_scheme_desc: "Twój handlarz spróbuje zabiegać o interesy handlowe [Concept('merchant_patron', 'patrona')|E] na tym rynku.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [opinion_i] [Concept('opinion', 'opinię')|E] u swojego [Concept('merchant_patron', 'patrona')|E] i niewielką ilość [prestige_i] [Concept('prestige', 'prestiżu')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_championing_patron_scheme$” [trader|El] zabiega o interesy handlowe [Concept('merchant_patron', 'patrona')|E] na rynku.\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [opinion_i] [Concept('opinion', 'opinię')|E] u swojego [Concept('merchant_patron', 'patrona')|E] i niewielką ilość [prestige_i] [Concept('prestige', 'prestiżu')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_success_title: "Handlarz: zadbano o interesy patrona"
 gdp_trader_championing_patron_scheme_success_desc: "[trader.GetShortUINameNotMe] pogłębia wpływy osoby znanej jako [route_owner.GetSuzerain.GetShortUINameNotMe] w miejscu o nazwie [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_entertaining_merchants_scheme: "Zabawianie kupców"
 gdp_trader_entertaining_merchants_scheme_desc: "Twój handlarz spróbuje ugościć przedstawicieli innych kompanii kupieckich, by wyrównać szanse względem konkurującego [Concept('merchant', 'kupca')|E].\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [opinion_i] [Concept('opinion', 'opinię')|E] u konkurującego [Concept('merchant', 'kupca')|E] na #V 5#!lat$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_entertaining_merchants_scheme$” [trader|El] ugości przedstawicieli innych kompanii kupieckich, by wyrównać szanse względem konkurującego [Concept('merchant', 'kupca')|E].\n\n#weak W przypadku powodzenia:\n#!Zyskujesz [opinion_i] [Concept('opinion', 'opinię')|E] u konkurującego [Concept('merchant', 'kupca')|E] na #V 5 lat#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_success_title: "Handlarz: zabawiono kupców"
 gdp_trader_entertaining_merchants_scheme_success_desc: "[trader.GetShortUINameNotMe] zaskarbia sobie przychylność konkurującego [Concept('merchant', 'kupca')|E] w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_hiring_local_talent_scheme: "Zatrudnianie miejscowych talentów"
 gdp_trader_hiring_local_talent_scheme_desc: "Twój handlarz spróbuje znaleźć zdolne osoby, które dołączą do kompanii jako [associates|El].\n\n#weak W przypadku powodzenia:\n#!Twoja [company|El] werbuje miejscowego [Concept('associate', 'partnera')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_hiring_local_talent_scheme$” [trader|El] poszukuje zdolnych osób, które dołączą do kompanii jako [associates|El].\n\n#weak W przypadku powodzenia:\n#![company|E] werbuje miejscowego [Concept('associate', 'partnera')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_success_title: "Handlarz: zatrudniono miejscowy talent"
 gdp_trader_hiring_local_talent_scheme_success_desc: "[trader.GetShortUINameNotMe] zatrudnia utalentowaną osobę w miejscu znanym jako [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Learning schemes
 gdp_trader_learning_from_locals_scheme: "Uczenie się od mieszkańców"
 gdp_trader_learning_from_locals_scheme_desc: "Twój handlarz spróbuje zanurzyć się w lokalnej kulturze handlowej oraz zdobyć wiedzę o towarach na tym rynku.\n\n#weak W przypadku powodzenia:\n#!Twoja [company|El] zyskuje [trade_expertise|El]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „$gdp_trader_learning_from_locals_scheme$” [trader|El] zanurza się w lokalnej kulturze handlowej oraz zdobywa wiedzę o towarach na danym rynku.\n\n#weak W przypadku powodzenia:\n#![company|E] zyskuje [trade_expertise|El]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_success_title: "Handlarz: uczono się od mieszkańców"
