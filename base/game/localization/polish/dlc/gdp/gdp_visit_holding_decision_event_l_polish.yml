 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$: wypatrywanie możliwości"
 gdp_visit_holding_decision_event.1310.desc: "Ostatnio doszły mnie słuchy o nieznanych bestiach i bogactwach. Dziś postaram się znaleźć na targowisku kogoś, kto może wiedzieć coś więcej o tych plotkach.\n\nDostrzegam wśród handlarzy osobę, która z dziwnym zagranicznym akcentem wygłasza niezbyt zainteresowanemu miejscowemu handlarzowi przechwałki o swoich wyprawach do odległych ziem. Może to bujdy… a może jest w tych historiach ziarnko prawdy? Trochę złota powinno być wystarczającą zachętą do rozmowy…"
 spawn_merchant_contract_interaction_duplicate_tt: "Posiadasz już zaakceptowany lub dostępny [task_contract|El] tego rodzaju"
