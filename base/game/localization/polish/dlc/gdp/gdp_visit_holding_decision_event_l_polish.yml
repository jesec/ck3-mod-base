 gdp_visit_holding_decision_event.1300.g: "Rzucę okiem na karawany."
 gdp_visit_holding_decision_event.1300.g.tt: "Porozmawiaj z koordynatorem karawany\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.g_second: "Tamte karawany wciąż czekają."
