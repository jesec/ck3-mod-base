 gdp_visit_holding_decision_event.1320.desc: "Gdy rozglądam się po tłumie, moją uwagę przyciągają trzej potencjalni kandydaci."
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "Gromadzi się tłum, zahipnotyzowany błyskiem srebra. [ROOT.Char.GetName] pokazuje sztuczki, a ludzie ustawiają się w kolejce niczym owce na rzeź."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "[ROOT.Char.GetFirstName], w mocno zużytej zbroi, opiera swoje muskularne ciało o ścianę, niespokojnie obracając w dłoni sztylet."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName] sprawdza trybuny jedna po drugiej, skrupulatnie zapisując szczegóły w swoim kajeciku."
 gdp_visit_holding_decision_event.1320.traveler.desc: "[ROOT.Char.GetFirstName], w obcym stroju, próbuje rozstrzygnąć spór między dwoma handlarzami, wykorzystując w tym celu swój łamany [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|l]."
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName] skrada się w cieniu. Jedną ręką trzyma owinięte w kocyk niemowlę, a drugą wyciąga przed siebie, wypatrując kolejnej niczego niepodejrzewającej ofiary."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "[ROOT.Char.GetFirstName] siedzi obok rannego przywódcy karawany, naprędce szykując okład leczniczy z pobliskich chwastów."
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip] sprawia wrażenie interesującej osoby."
 gdp_visit_holding_decision_event.1320.option.tt: "Możesz mieć możliwość zrekrutowania osoby o imieniu [THIS.Char.GetFirstName] jako [Concept('associate', 'partnera')|E], postępując w następujący sposób:"
