 gdp_visit_holding_decision_event.1300.h_second: "Ja i [carnival_jester.GetFirstNameNoTooltip] musimy pomówić, zanim rozejdzie się tłum."
 gdp_visit_holding_decision_event.1300.i: "Takie frykasy… za darmo?"
 gdp_visit_holding_decision_event.1300.i.tt: "Porozmawiaj z piekarzem\n$gdp_visit_holding_rare_spawn_alert.tt$"
