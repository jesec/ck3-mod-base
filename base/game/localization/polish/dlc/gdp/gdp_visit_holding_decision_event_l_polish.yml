 gdp_visit_holding_decision_event.1320.herbalist.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Wygraj [skill_challenge_no_prefix|El] dotyczące @skill_learning_icon! [Concept('learning', 'nauki')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip] zapowiada się obiecująco."
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip] przyciąga moją uwagę."
 gdp_visit_holding_decision_event.1320.d: "Nikt nie przyciągnął mojej uwagi…"
 gdp_visit_holding_decision_event.1320.d.tt: "Wróć na targowisko i zobacz, co jeszcze miejsce o nazwie [THIS.Char.GetCurrentLocation.GetName] ma do zaoferowania"
 gdp_visit_holding_decision_event.1320.e: "Nikt nie przyciągnął mojej uwagi…"
 gdp_visit_holding_decision_event.1320.e.tt: "Wróć do doków i zobacz, co jeszcze miejsce o nazwie [THIS.Char.GetCurrentLocation.GetNameNoTooltip] ma do zaoferowania"
 gdp_visit_holding_decision_event.1320.tt: "Wróć i sprawdź, czy są jacyś inni interesujący rekruci"
