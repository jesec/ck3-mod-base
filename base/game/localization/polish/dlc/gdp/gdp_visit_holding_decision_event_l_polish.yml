 gdp_visit_holding_rare_recruit_skill.martial: "[ROOT.Char.GetFirstName] ma następującą [martial_skill|El]: [ROOT.Char.Custom('GetVisitHoldingColoredMartialSkillLevel')] ([martial_i] [ROOT.Char.GetSkill( 'martial' )|V])"
 gdp_visit_holding_rare_recruit_skill.stewardship: "[ROOT.Char.GetFirstName] ma następującą [stewardship_skill|El]: [ROOT.Char.Custom('GetVisitHoldingColoredStewardshipSkillLevel')] ([stewardship_i] [ROOT.Char.GetSkill( 'stewardship' )|V])"
 gdp_visit_holding_rare_recruit_skill.intrigue: "[ROOT.Char.GetFirstName] ma następującą [intrigue_skill|El]: [ROOT.Char.Custom('GetVisitHoldingColoredIntrigueSkillLevel')] ([intrigue_i] [ROOT.Char.GetSkill( 'intrigue' )|V])"
 gdp_visit_holding_rare_recruit_skill.learning: "[ROOT.Char.GetFirstName] ma następującą [learning_skill|El]: [ROOT.Char.Custom('GetVisitHoldingColoredLearningSkillLevel')] ([learning_i] [ROOT.Char.GetSkill( 'learning' )|V])"
 gdp_visit_holding_rare_recruit_court_position.partner: "[ROOT.Char.GetFirstNameNoTooltip] ma następujące [aptitude|El] jako [GetCourtPositionType('partner_court_position').GetName()|l] na twoich usługach: [ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('partner_court_position') )]"
 gdp_visit_holding_rare_recruit_court_position.translator: "[ROOT.Char.GetFirstNameNoTooltip] ma następujące [aptitude|El] jako [GetCourtPositionType('translator_court_position').GetName()|l] na twoich usługach: [ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('translator_court_position') )]"
 gdp_visit_holding_rare_recruit_court_position.fixer: "[ROOT.Char.GetFirstNameNoTooltip] ma następujące [aptitude|El] jako [GetCourtPositionType('fixer_court_position').GetName()|l] na twoich usługach: [ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('fixer_court_position') )]"
 gdp_visit_holding_rare_recruit_court_line.empty: ""
 market_recruitment_success.t: "Udana rekrutacja"
 gdp_visit_holding_decision_event.1400.t: "Wizyta w dokach miejsca znanego jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1400.intro: "Przy tętniącym życiem porcie w miejscu o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] dokerzy pilnie rozładowują ładunki we wszystkich kształtach i rozmiarach."
 gdp_visit_holding_decision_event.1400.asia: "Zesztywniałe dłonie ostrożnie przenoszą skrzynie z jedwabiem i worki z liśćmi herbaty. Wkrótce zaopatrzą resztę znanego świata w swoje cuda, przewożone bezpiecznie na pokładach dżonek przez wzburzone morza."
 gdp_visit_holding_decision_event.1400.mena_india: "W samym środku tego chaosu kupiec sprawdza zawartość niektórych uszkodzonych skrzyń. Na drugim końcu portu trwa staranne zabezpieczanie skrzyń z przyprawami, aby przetrwały niebezpieczną podróż przez ocean."
 gdp_visit_holding_decision_event.1400.default: "Worki ze zbożem i solą są wysyłane do odległych ziem. W porcie właśnie zacumowała okazała dębowa koga, z której schodzi grupa zagranicznych kupców w barwnych strojach."
 gdp_visit_holding_decision_event.1400.outro: "Moje płuca wypełnia świeże powietrze. Czuję narastającą chęć, by sprawdzić, czy dziś sprzyja mi los.\n\nGdzie mam się teraz udać?\n\n"
 gdp_visit_holding_decision_event.1400.b: "Muszę wypatrywać interesujących ludzi."
 gdp_visit_holding_decision_event.1400.b.tt: "Dzięki przeszukiwaniu doków możesz mieć okazję, aby:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "Muszę zamienić słowo z tym kapitanem."
 gdp_visit_holding_decision_event.1400.d.tt: "Porozmawiaj z kapitanem\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "Ja i [sea_captain.GetFirstNameNoTooltip] musimy znowu porozmawiać."
 gdp_visit_holding_decision_event.1400.c.tt: "Na razie opuść doki"
 DECISION_ALREADY_VISITING_HOLDING: "[CHARACTER.Custom('IsAlreadyVisitingHolding')]"
 DECISION_ALREADY_VISITING_HOLDING_TIME: "Działanie będzie dostępne ponownie, ale musisz poczekać do [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'gdp_visit_holding_is_visiting') )]"
 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "Odwiedzasz już posiadłość"
 gdp_visit_holding_decision_event.1340.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] i chwila przerwy"
 gdp_visit_holding_decision_event.1340.desc: "Świat handlu potrafi być męczący, a ileż można przeglądać kolejne umowy i uśmiechać się fałszywie do ludzi, zanim człowiek będzie potrzebować porządnej przerwy.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "Tu, w herbaciarni, mogę na chwilę zapomnieć o problemach kompanii.\n\nPrawdziwą ulgą jest sączyć parującą herbatę i gawędzić z miejscowymi o błahostkach, plotkach i nowinach."
 gdp_visit_holding_decision_event.1340.hashish: "Tu, w palarni haszyszu, mogę na chwilę zapomnieć o problemach kompanii.\n\nPrawdziwą ulgą jest usiąść w cichej, chłodnej przestrzeni i gawędzić z miejscowymi o błahostkach, plotkach i nowinach."
 gdp_visit_holding_decision_event.1340.drink: "Tu, w karczmie, mogę na chwilę zapomnieć o problemach kompanii.\n\n[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] to wszystko, czego mi trzeba, by odetchnąć i pogawędzić z miejscowymi o błahostkach, plotkach i nowinach."
 gdp_visit_holding_decision_event.1340.food: "Tu, w sali biesiadnej, mogę na chwilę zapomnieć o problemach kompanii.\n\n[ROOT.Char.Custom('FavoriteTreat')|U] na talerzu to wszystko, czego mi trzeba, by odetchnąć i pogawędzić z miejscowymi o błahostkach, plotkach i nowinach."
 gdp_visit_holding_decision_event.1340.bath: "Tu, w łaźni, mogę na chwilę zapomnieć o problemach kompanii.\n\nPrawdziwą ulgą jest zanurzyć się w ożywczych wodach i gawędzić z miejscowymi o błahostkach, plotkach i nowinach."
 gdp_visit_holding_decision_event.1340.a: "Warto robić to częściej."
