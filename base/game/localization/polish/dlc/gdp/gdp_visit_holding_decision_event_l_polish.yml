 spawn_merchant_contract_interaction_cooldown_tt: "Trwa czas odnowienia tego rodzaju [Concept('task_contract', 'kontraktu')|E]"
 gdp_visit_holding_decision_event.1310.a: "Chcę dowiedzieć się więcej o tych egzotycznych stworzeniach."
 gdp_visit_holding_decision_event.1310.a.tt: "Utwórz na mapie [luxury_contract_i] [luxury_contract|El] dotyczący [Concept('menagerie', 'menażerii')|E]"
 gdp_visit_holding_decision_event.1310.b: "Bardzo mnie ciekawi pozyskiwanie tych unikatów."
 gdp_visit_holding_decision_event.1310.b.tt: "Utwórz na mapie [luxury_contract_i] [luxury_contract|El] dotyczący [Concept('curio', 'unikatu')|E]"
 gdp_visit_holding_decision_event.1310.c: "Zamiast tego trzeba było zainwestować w kompanię rodu [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_visit_holding_decision_event.1310.c.tt: "Utwórz na mapie [company_purpose|El][trade_opportunity_i] [Concept('trade_opportunity', 'okazji handlowej')|E]"
 gdp_visit_holding_decision_event.1310.d: "Dzisiaj wolę zajrzeć gdzie indziej…"
