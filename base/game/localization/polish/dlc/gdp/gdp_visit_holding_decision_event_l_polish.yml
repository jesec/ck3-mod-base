 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1321.t: "Szarlatan"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName] przywołuje mnie gestem. Wykonując szeroki ruch ręką, obwieszcza:\n\n– No cóż… Wygląda na to, że mamy ochotnika! Jeśli zgadniesz, na którą stronę upadnie ta moneta, otrzymasz godziwą nagrodę.\n\n[charlatan_recruit.GetFirstName] ruchem nadgarstka sprawia, że moneta zniknęła. Publiczność bezgłośnie oczekuje na mój ruch."
 gdp_visit_holding_decision_event.1321.a: "To #EMP oczywiste#!, że masz w rękawie fałszywą monetę."
 gdp_visit_holding_decision_event.1321.a.success: "Udaje ci się rozpoznać blef"
 gdp_visit_holding_decision_event.1321.a.failure: "Nie udaje ci się rozpoznać blefu"
 gdp_visit_holding_decision_event.1321.b: "Zręczne kłamstwo. Chyba muszę cię zatrudnić."
 gdp_visit_holding_decision_event.1321.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon! [charlatan_recruit_cost|V0] szt. [Concept('gold', 'złota')|E], więc [charlatan_recruit.GetFirstNameNoTooltip] nie da się zrekrutować "
 gdp_visit_holding_decision_event.1321.c: "Nie mam czasu na sztuczki…"
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1322.t: "Gburowaty łotr"
 gdp_visit_holding_decision_event.1322.desc: "Czuję, jak [hired_muscle_recruit.GetFirstName] mierzy mnie podejrzliwym wzrokiem, gdy podchodzę do [hired_muscle_recruit.Custom('PL_niego_niej')] coraz bliżej.\n\n– Chyba nie masz pojęcia na kogo się gapisz. Jestem niepokonanym czempionem miejsca o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Masz tupet, myśląc, że byle [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] jak ty będzie mieć szanse w walce ze mną.\n\n[hired_muscle_recruit.GetFirstName] unosi pięść w groźnym geście."
 gdp_visit_holding_decision_event.1322.a: "Sprawię, że [hired_muscle_recruit.GetFirstName] odszczeka swoje słowa!"
 gdp_visit_holding_decision_event.1322.a.success: "[hired_muscle_recruit.GetFirstName] przegrywa z tobą"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName] pokonuje cię"
 gdp_visit_holding_decision_event.1322.b: "Walcz po mojej stronie."
 gdp_visit_holding_decision_event.1322.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon! [hired_muscle_recruit_cost|V0] szt. [Concept('gold', 'złota')|E], więc [hired_muscle_recruit.GetFirstNameNoTooltip] nie da się zrekrutować "
 gdp_visit_holding_decision_event.1322.c: "Chyba muszę już iść…"
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1323.t: "Uczony biegły w rachunkach"
 gdp_visit_holding_decision_event.1323.desc: "Z nosem niemal wtulonym w książkę [numerate_recruit.GetFirstName] praktycznie mnie nie zauważa, dopóki nie podchodzę bardzo blisko. Podnosi wzrok i spogląda na mnie z zamyśleniem.\n\n– Wyglądasz na zdolną osobę… Może pomożesz mi rozwiązać pewien drobny problem?\n\nArkusz, który mi pokazuje, jest starannie zapisany cyframi i obliczeniami. Wygląda jak księga rachunkowa przychodów i wydatków ze straganów."
 gdp_visit_holding_decision_event.1323.a: "A co jeśli tę cyfrę przeniesiemy tutaj…"
 gdp_visit_holding_decision_event.1323.a.success: "Rozwiązujesz równanie"
 gdp_visit_holding_decision_event.1323.a.failure: "Nie udaje ci się rozwiązać równania"
 gdp_visit_holding_decision_event.1323.b: "Może zechcesz to robić dla #EMP mojej#! kompanii?"
 gdp_visit_holding_decision_event.1323.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon! [numerate_recruit_cost|V0] szt. [Concept('gold', 'złota')|E], więc [numerate_recruit.GetFirstNameNoTooltip] nie da się zrekrutować "
 gdp_visit_holding_decision_event.1323.c: "Z drugiej strony…"
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1324.t: "Wytrawny podróżnik"
 gdp_visit_holding_decision_event.1324.desc: "Napięcie między dwoma handlarzami sięga zenitu. [traveler_recruit.GetFirstName] stara się załagodzić konflikt, wykonując uspokajające gesty. Choć [traveler_recruit.Custom('PL_jego_jej')] [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|l] pozostawia wiele do życzenia, poniekąd odnosi to skutek; wysiłek jest godny podziwu jak na kogoś, kto ewidentnie nie zna tutejszej kultury.\n\nJednak żaden z handlarzy nie jest w stanie stwierdzić, czy chodzi [traveler_recruit.Custom('PL_mu_jej')] o jakość, towary, czy o coś zupełnie innego, i spór utyka w martwym punkcie."
 gdp_visit_holding_decision_event.1324.a: "– Spróbujmy dojść do porozumienia."
 gdp_visit_holding_decision_event.1324.a.success: "Twoja interpretacja jest przekonująca"
 gdp_visit_holding_decision_event.1324.a.failure: "Twoja ingerencja jest niepożądana"
 gdp_visit_holding_decision_event.1324.b: "Przydałby mi się ktoś obdarzony taką wiedzą."
 gdp_visit_holding_decision_event.1324.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon! [traveler_recruit_cost|V0] szt. [Concept('gold', 'złota')|E], więc [traveler_recruit.GetFirstNameNoTooltip] nie da się zrekrutować "
 gdp_visit_holding_decision_event.1324.c: "Nie mam na to ochoty…"
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1325.t: "Urwis"
 gdp_visit_holding_decision_event.1325.desc: "Taką sytuację dane mi było widzieć wiele razy, więc wiem, że [urchin_recruit.Custom('GirlBoy')] wymaga ostrożnego podejścia. Zanim mogę cokolwiek powiedzieć, drobna dłoń wciska mi do rąk zawiniątko.\n\n– Proszę, dobry człowieku, masz może coś do jedzenia dla mnie i niemowlęcia?\n\n[urchin_recruit.Custom('PL_jego_jej')|U] druga dłoń od razu sięga do mojej sakwy. Zawiniątko wyślizguje się z rąk i upada na ziemię – trzy kamienie owinięte w koc, zgodnie z przewidywaniami. Oczywisty podstęp, ale dość zuchwały."
 gdp_visit_holding_decision_event.1325.a: "Natychmiast wyjmij tę rękę z mojej torby!"
 gdp_visit_holding_decision_event.1325.a.success: "Łapiesz złodzieja"
 gdp_visit_holding_decision_event.1325.a.failure: "Reagujesz zbyt wolno"
 gdp_visit_holding_decision_event.1325.b: "Mojej kompanii przydałaby się para zręcznych rąk."
 gdp_visit_holding_decision_event.1325.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon! [urchin_recruit_cost|V0] szt. [Concept('gold', 'złota')|E], więc [urchin_recruit.GetFirstNameNoTooltip] nie da się zrekrutować "
 gdp_visit_holding_decision_event.1325.c: "Dosyć tego!"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1326.t: "Zielarz"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName] nie reaguje na to, że podchodzę. Całkowicie pochłonęły [herbalist_recruit.Custom('PL_go_ja')] ruchy tłuczka, którym rozdrabnia składnik, tworząc niejednoznaczną miksturę.\n\n– [ROOT.Char.Custom('Abortifacient')|U], [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] i [ROOT.Char.Custom('RegionalDrink')], aby całość ugotować. Tak… To powinno wystarczyć, co o tym myślisz?\n\nNiemal nie zwracając na mnie uwagi, [herbalist_recruit.GetFirstName] odwraca się do mnie i przykłada moździerz do mojego nosa; uderza mnie ostry zapach."
 gdp_visit_holding_decision_event.1326.a: " #EMP Hmm#!, a może jeszcze [ROOT.Char.Custom('Abortifacient')]?"
 gdp_visit_holding_decision_event.1326.a.success: "Twój wkład jest pomocy"
 gdp_visit_holding_decision_event.1326.a.failure: "Twój wkład nie jest pomocy"
 gdp_visit_holding_decision_event.1326.b: "Przydałby mi się ktoś obdarzony takimi umiejętnościami."
 gdp_visit_holding_decision_event.1326.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon! [herbalist_recruit_cost|V0] szt. [Concept('gold', 'złota')|E], więc [herbalist_recruit.GetFirstNameNoTooltip] nie da się zrekrutować "
 gdp_visit_holding_decision_event.1326.c: "To chyba nie jest dla mnie."
 gdp_visit_holding_decision_event.1330.t: "Mnich"
 gdp_visit_holding_decision_event.1330.desc: "W cichym kącie miejscowej herbaciarni znajduję uduchowioną osobę, która odczytuje znaczenie z rozłożonych na stole łodyg krwawnika, oświetlonych wątłym blaskiem świec. [monk.GetWomanMan|U] spogląda na mnie, wyczuwając moje zainteresowanie.\n\n– Jesteś uczniem wyroczni? Jeśli umysł masz otwarty i szczery, Droga ma ci wiele do pokazania."
 gdp_visit_holding_decision_event.1330.desc_returned_01: "Herbaciarnia niemal opustoszała, a [monk.GetFirstName] wciąż siedzi, wpatrując się w rozłożone przed [monk.Custom('PL_nim_nia')] łodygi krwawnika. Świeca powoli się dopala.\n\n[monk.GetWomanMan|U] nie podnosi wzroku."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "Kiedy wracam, [monk.GetFirstName] zgarnia łodygi w płócienne zawiniątko. Świeca ledwo migoce.\n\n– Ktoś tu jest wytrwały – mówi. – Drodze nie przeszkadza druga wizyta. A tobie?"
 gdp_visit_holding_decision_event.1330.a: "Mojej kompanii przydałby się ktoś uczony."
 gdp_visit_holding_decision_event.1330.a.tt: "Jeśli [monk.GetFirstNameNoTooltip] ma do ciebie dołączyć, potrzebujesz @gold_icon! [monk_recruit_cost|V0] szt. [Concept('gold', 'złota')|E]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "Powiedz mi, co tak analizujesz."
 gdp_visit_holding_decision_event.1330.c: "Wiem co nieco o niebiosach."
 gdp_visit_holding_decision_event.1330.c.success: "[monk.GetFirstNameNoTooltip] jest pod wrażeniem"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName] odchodzi obojętnie"
 gdp_visit_holding_decision_event.1330.d: "Może innym razem."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1333.t: "Wytrawny koordynator karawany"
 gdp_visit_holding_decision_event.1333.desc: "Dromadery tłoczą się jeden przy drugim, szukając w zagrodach choć odrobiny osłony. Ze stada dobiega od czasu do czasu pomruk, tupnięcie kopyta i… #EMP chrapanie#!?\n\nPrzyjrzawszy się bliżej, dostrzegam koordynatora karawany, leżącego wygodnie na jukach. Budzi się na odgłos moich kroków i szybko zrywa na nogi, ocierając ślinę z ust.\n\n– Zapewniam, że właściciel stajni wie, że tu jestem. Nigdy nie zostawiam swoich zwierząt; to dla ich bezpieczeństwa i mojego własnego spokoju – wyjaśnia."
 gdp_visit_holding_decision_event.1333.desc_returned_01: "Dromadery wciąż tłoczą się w zagrodzie. Tym razem [caravaneer.GetFirstName] nie śpi i przesuwa dłoń po popręgu.\n\n[caravaneer.GetWomanMan|U] zerka przez ramię. – To znowu ty."
 gdp_visit_holding_decision_event.1333.desc_returned_02: "Z zagrody dochodzi pomruk, a potem odzywa się [caravaneer.GetFirstName]:\n\n– Natrętom za zwierzęta liczymy dodatkowo.\n\n[caravaneer.GetWomanMan|U] tym razem siedzi na jukach, w pełnym odzieniu. Zastanawia się, czy chcę rozmawiać."
 gdp_visit_holding_decision_event.1333.a: "– Będę chronić twoje zwierzęta."
 gdp_visit_holding_decision_event.1333.a.tt: "Jeśli [caravaneer.GetFirstNameNoTooltip] ma do ciebie dołączyć, potrzebujesz @gold_icon! [caravaneer_recruit_cost|V0] szt. [Concept('gold', 'złota')|E]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "– Jakieś nowiny z drogi?"
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "Niedawno już przyszło ci pytać o drogę – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]"
 gdp_visit_holding_decision_event.1333.c: "– Wiem co nieco o organizowaniu karawan…"
 gdp_visit_holding_decision_event.1333.c.success: "[caravaneer.GetFirstNameNoTooltip] jest pod wrażeniem"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName] zabiera zwierzęta i odchodzi"
 gdp_visit_holding_decision_event.1333.d: "Może innym razem."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1334.t: "Wilk morski"
 gdp_visit_holding_decision_event.1334.desc: "Grupa kobiet i mężczyzn tłoczy się przy nabrzeżu wokół ogorzałego żeglarza w nadziei, że wpuści ich na statek.\n\nŁapię urywki szeptów dwójki przechodniów:\n\n– Za późno! [sea_captain.GetTitledFirstName] nie będzie już mieć dla nas miejsca.\n\nZamiast zwrócić się do innego żeglarza, zebrani wolą zaczekać na kolejną wizytę właśnie tego.\n\nCo to właściwie za osobistość i czy to nie #EMP złoto#! pobrzękuje w jej drewnianej nodze?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "Tłum przy nabrzeżu zelżał. [sea_captain.GetFirstName] wrzuca monety do swojej drewnianej nogi, jedna po drugiej, w miarę jak rozchodzą się ostatni zainteresowani.\n\nKiedy podchodzę, [sea_captain.GetSheHe] nawet się nie odwraca.\n\n– Wracasz? Kto by się spodziewał."
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName] macha, odprawiając spóźnialskiego gościa do innej łodzi, po czym odwraca się do mnie, stukając drewnianą nogą o deski.\n\n– Chodzi ci o miejsce w koi czy jednak o mnie?"
 gdp_visit_holding_decision_event.1334.a: "– Zapłacę dwakroć tyle, co inni."
 gdp_visit_holding_decision_event.1334.a.tt: "Jeśli [sea_captain.GetFirstNameNoTooltip] ma do ciebie dołączyć, potrzebujesz @gold_icon! [sea_captain_recruit_cost|V0] szt. [Concept('gold', 'złota')|E]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "– Podzielisz się jakąś historią?"
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "Niedawno wysłuchano opowieści kapitana – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]"
 gdp_visit_holding_decision_event.1334.c: "– Handel towarami to o wiele bardziej dochodowe przedsięwzięcie."
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip] daje się przekonać"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName] odbija od brzegu"
 gdp_visit_holding_decision_event.1334.d: "Może innym razem."
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1335.t: "Karnawałowy błazen"
 gdp_visit_holding_decision_event.1335.desc: "[carnival_jester.GetWomanMan|U] w stroju błazna występuje na ulicy, a wokół [carnival_jester.Custom('PL_niego_niej')] gromadzi się zaciekawiona publiczność, odciągając kupujących od pobliskich straganów i wstrzymując interesy na targowisku.\n\n[carnival_jester.GetWomanMan|U] rozkłada ręce i mówi:\n\n– Patrzcie no wy wszyscy, którzyście mi wmawiali, że miejscem dla mojej sztuki są karnawałowe budy. Ja, w przeciwieństwie do was, nie muszę kryć się za maską."
 gdp_visit_holding_decision_event.1335.desc_returned_01: "Ten sam róg ulicy, tym razem mniej zatłoczony. [carnival_jester.GetFirstName] kończy popis, dostrzega mnie i rozkłada ramiona, jakby włączając mnie w przedstawienie.\n\n– Bis?"
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName] pakuje swoje rekwizyty w płócienne zawiniątko.\n\n– Zaczynam mieć wrażenie, że to na mnie polujesz."
 gdp_visit_holding_decision_event.1335.a: "– Mojej kompanii przyda się ktoś tak błyskotliwy."
 gdp_visit_holding_decision_event.1335.a.tt: "Jeśli [carnival_jester.GetFirstNameNoTooltip] ma do ciebie dołączyć, potrzebujesz @gold_icon! [carnival_jester_recruit_cost|V0] szt. [Concept('gold', 'złota')|E]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "– Powiedz mi więcej o tych karnawałach."
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "Niedawno już przyszło ci pytać o karnawały – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]"
 gdp_visit_holding_decision_event.1335.c: "– Mniemam, że nie musisz im tu niczego więcej udowadniać?"
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip] daje się przekonać"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName] pakuje się i odchodzi"
 gdp_visit_holding_decision_event.1335.d: "Może innym razem."
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1336.t: "Piekarz"
 gdp_visit_holding_decision_event.1336.desc_intro: "Z pobliskiego straganu dolatuje jakiś słodki zapach świeżych wyrobów… to chyba [ROOT.Char.Custom('FavoriteTreat')]. Kosze wypieków piętrzą się na każdej wolnej przestrzeni.\n\nOsoba, do której należy kram, stoi z boku, chowając głowę w dłoniach. Gdy mnie dostrzega, mówi:"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "– [local_noble.GetTitledFirstNameNoTooltip]… kiedyś było mi dane dla [local_noble.Custom('PL_niego_niej')] pracować, ale teraz dba o linię i już mnie nie potrzebuje. – Przygryza wargi. – Może ty zdołasz to sprzedać? Bo ja… po prostu nie starcza mi na to czasu."
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "– Z dworu już po mnie nie poślą. Mam więcej wypieków, niż zdołam sprzedać!"
 gdp_visit_holding_decision_event.1336.desc_returned_01: "Stragan wciąż pachnie, a jego właściciel przygotowuje kolejne zawiniątko – jego specjał, [ROOT.Char.Custom('FavoriteTreat')], znów trafi do jakiegoś przechodnia zupełnie za darmo.\n\n[cook.GetFirstName] dostrzega mnie i wzdycha.\n\n– Wciąż po mnie nie posłali. Nie mogę tak po prostu tego rozdawać."
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Koszy jest już mniej. [cook.GetFirstName] opiera się o ladę, z mąką na rękawach, i patrzy, jak znikają ostatnie wypieki.\n\n– Jeśli masz mi do zaoferowania jakieś zajęcie – mówi – powiedz to, nim stragan opustoszeje."
 gdp_visit_holding_decision_event.1336.a: "– Mam w kompanii wiele gęb do wyżywienia."
 gdp_visit_holding_decision_event.1336.a.tt: "Jeśli [cook.GetFirstNameNoTooltip] ma do ciebie dołączyć, potrzebujesz @gold_icon! [cook_recruit_cost|V0] szt. [Concept('gold', 'złota')|E]"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.b: "Pokaż, jak wyżywić całą kompanię."
 gdp_visit_holding_decision_event.1336.c: "Zobaczmy, kto lepiej zna się na gotowaniu."
 gdp_visit_holding_decision_event.1336.c.success: "[cook.GetFirstNameNoTooltip] jest pod wrażeniem"
 gdp_visit_holding_decision_event.1336.c.failure: "[cook.GetFirstName] zamyka kram i odchodzi"
 gdp_visit_holding_decision_event.1336.d: "Może innym razem."
 gdp_visit_holding_rare_recruit_duel_loss.tt: "@alert_icon! #alert_trial [SCOPE.sC('visit_holding_rare_recruit').GetFirstNameNoTooltip] odejdzie i nie da się zrekrutować podczas tej wizyty#!"
