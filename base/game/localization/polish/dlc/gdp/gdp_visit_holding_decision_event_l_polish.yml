l_polish:
 gdp_visit_holding_decision: "Odwiedź posiadłość"
 gdp_visit_holding_decision_tooltip: "$visit_local_settlement_decision_tooltip$\n[ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasWorship')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasWorship')]"
 gdp_visit_holding_decision_confirm: "Pora działać!"
 gdp_visit_holding_decision_desc: "Możliwości mają ci, którzy potrafią je sobie stworzyć. Miejsce znane jako [ROOT.Char.Custom('LocalHoldingTypeConcept')] w baronii o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] jest pełne niewykorzystanego potencjału! Nowi klienci, kontrakty i interesy czekają."
 gdp_visit_holding_decision_effect_intro: "Możesz mieć okazję, aby:"
 gdp_visit_holding_decision_effect_artifact: "\n$EFFECT_LIST_BULLET$ Ulepszyć lub kupić [artifact_i] [artifacts|El]"
 gdp_visit_holding_decision_effect_guild: "\n$EFFECT_LIST_BULLET$ Zwiększyć [skill_i] [skills|El] swojej [family_i] [Concept('family', 'rodziny')|E]"
 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$ Zwiększyć swoją [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjność handlową')|E]"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$ Wymienić [gold_i] [gold|El] na [prestige_i] [prestige|El]"
 gdp_visit_holding_decision_effect_recruit: "\n$EFFECT_LIST_BULLET$ Spotkać i zrekrutować [associate_i] [Concept('associates', 'partnerów')|E]"
 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$ Odkryć [luxury_contract_i] [luxury_contracts|El]"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$ Obniżyć poziom [stress_loss_i] [Concept('stress', 'stresu')|E]"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$ $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$ $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$ $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak Wciąż masz okazje w następujących miejscach:#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$Gildie"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$Targowisko"
 VISIT_HOLDING_DECISION_AVAILABLE_DOCKS: "\n$EFFECT_LIST_BULLET$Doki"
 VISIT_HOLDING_DECISION_AVAILABLE_PATRON: "\n$EFFECT_LIST_BULLET$Dwór osoby znanej jako [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]"
 VISIT_HOLDING_DECISION_AVAILABLE_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 VISIT_HOLDING_DECISION_EXHAUSTED_AREAS_HEADER: "\n#weak Miejsca te będą otwarte po:#!"
 VISIT_HOLDING_DECISION_EXHAUSTED_GUILDS: "\n$EFFECT_LIST_BULLET$Gildie – [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$Targowisko – [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$Doki – [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$Dwór osoby znanej jako [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] – [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] – [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "Sprawdzono wszystkie okazje w miejscu, którym jest [ROOT.Char.Custom('LocalHoldingTypeConcept')|l]. Nowe opcje będą dostępne po [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "Wizyta w miejscu znanym jako [ROOT.Char.Custom('LocalHoldingTypeCapitalized')|l] w baronii o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1000.desc: "Gdy w miejscu o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] wstaje słońce, budzą się też jego mieszkańcy. Poranny spokój szybko przerywa pełen życia gwar ludzi rozpoczynających swoje codzienne obowiązki. Bystry obserwator jest w stanie dostrzec możliwości na każdym rogu tych zatłoczonych ulic.\n\nDokąd się dziś udać, aby wyjść szczęściu na spotkanie?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "Wiedza ze składu przeładunkowego"
 gdp_visit_holding_decision_event.1000.a: "Najlepiej, jeśli udam się do gildii"
 gdp_visit_holding_decision_event.1000.a.tt: "Dzięki wizycie w gildiach możesz mieć okazje, aby: $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "Znasz już wszystko, co gildie mają do zaoferowania. Spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "Znasz już wszystko, co targowisko ma do zaoferowania. Spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "Znasz już wszystko, co doki mają do zaoferowania. Spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "Skorzystano już z każdej okazji, którą oferuje dwór osoby znanej jako [THIS.Char.GetSuzerain.GetTitledFirstNameNoTooltip]. Spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "Nie masz patrona, u którego możesz prosić o audiencję"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "Znasz już wszystko, co [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] ma do zaoferowania. Spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 gdp_visit_holding_caught_stealing.tt: "Niedawno przyłapano cię na okradaniu miejsca znanego jako [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] ([THIS.Char.Custom('LocalHoldingTypeConcept')]) – wygnanie skończy się [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]"
 gdp_visit_holding_decision_event.1000.b: "Najlepiej, jeśli poproszę o audiencję z patronem, którym jest [patron.GetTitledFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1000.c: "To doskonały dzień na odwiedzenie targowiska."
 gdp_visit_holding_decision_event.1000.c.tt: "Dzięki wizycie na lokalnym rynku możesz mieć okazje, aby: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "To świetny dzień na spacer w dokach."
 gdp_visit_holding_decision_event.1000.e.tt: "Dzięki wizycie w dokach możesz mieć okazje, aby: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] zdaje się wzbudzać zainteresowanie."
 gdp_visit_holding_decision_event.1000.f.tt: "Dzięki wizycie w lokalnym miejscu kultu możesz mieć okazje, aby: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_cure$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$ Ofiarować [gold_i] [gold|El], aby zyskać [piety_i] [piety|El]"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$ Ulepszyć swoje [health|El] lub wyleczyć [diseases|El]"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$ Otrzymać błogosławieństwo w formie [Concept('character_modifier', 'modyfikatora postaci')|E]"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ Ukraść [gold_i] [gold|El] przekazane w ofierze"
 gdp_visit_holding_decision_event.1000.d: "Myślę, że na dziś mam już wszystko załatwione."
 gdp_visit_holding_decision_event.1000.d.tt: "Na razie wróć do domu"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "– Zmieniam zdanie."
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Opuść [ROOT.Char.Custom('LocalHoldingTypeConcept')|l] bez sprawdzenia okazji"
 gdp_visit_holding_decision_event.1000.d.exhausted: "Wygląda na to, że nie ma tu już nic do zrobienia…"
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Wróć do domu. Nowe okazje będą dostępne po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Twoje [domicile|El] obecnie nie znajduje się w państwie twoich [Concept('merchant_patrons', 'patronów')|E]"
 gdp_visit_holding_decision_event.1110.t: "Wizyta w gildiach w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1110.desc: "Dźwięk młota uderzającego o metal niesie się echem po uliczkach należących do gildii. Gdzieś w okolicy młoda osoba terminująca niesie narzędzia swojego mistrza do warsztatu garncarskiego. Czeladnicy od pokoleń kształcą się w siedzibach gildii, aby zostać wykwalifikowanymi mistrzami swojego fachu.\n\nGildie oferują kupcom szeroki wachlarz usług. Którą mam dziś wybrać?"
 gdp_visit_holding_decision_event.1110.a: "Jeden z moich artefaktów mógłby zostać wypolerowany."
 gdp_visit_holding_decision_event.1110.a.tt: "Dzięki wizycie u kustosza możesz mieć okazję, aby:\n$EFFECT_LIST_BULLET$ Ulepszyć swoje zwykłe i mistrzowskie @artifact_icon! [artifacts|El]"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "Niedawno już przyszło ci korzystać z usług kustosza – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "Nie masz żadnych zwykłych ani mistrzowskich [Concept('artifacts', 'artefaktów')|E]"
 gdp_visit_holding_decision_event.1110.b: "Mam ochotę sprawić sobie nową broń i zbroję."
 gdp_visit_holding_decision_event.1110.b.tt: "Dzięki wyprawie do kowala możesz mieć okazję, aby:\n$EFFECT_LIST_BULLET$ Kupić zwykłe, mistrzowskie lub słynne bronie i zbroje będące @artifact_icon! [Concept('artifacts', 'artefaktami')|E]"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "Niedawno już przyszło ci kupować coś od kowala – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.c: "Muszę umówić spotkanie z mistrzem gildii."
 gdp_visit_holding_decision_event.1110.c.tt: "Dzięki spotkaniu z mistrzem gildii możesz mieć okazje, aby: $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "Niedawno już przyszło ci spotkać się z mistrzem gildii – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]"
 gdp_visit_holding_decision_event.1110.d: "Może udam się gdzieś indziej?"
 gdp_visit_holding_decision_event.1110.d.tt: "Na razie opuść gildie"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: kustosz"
 gdp_visit_holding_decision_event.1111.desc: "Wchodząc do pracowni kustosza, wszędzie zauważam fascynujące przedmioty. Przy stole roboczym w głębi pomieszczenia dostrzegam pochylającą się osobę, która graweruje sztylet, osadzając w jego rękojeści najdrobniejsze klejnoty. Gdy przyglądam się jednej z ozdób na wystawie, [curator.GetWomanMan] wytrąca się ze stanu skupienia.\n\n– Och, potencjalny klient! Niech [ROOT.Char.GetTitledFirstNameNoTooltip] powie, jak mogę pomóc?"
 gdp_visit_holding_decision_event.1111.a: "Mam artefakt do wypolerowania. To [artifact_target_1.GetNameNoTooltip|l]."
 gdp_visit_holding_decision_event.1111.a.tt: "Artefakt znany jako [artifact_target_1.GetName|l] zyska ulepszenie"
 gdp_visit_holding_decision_event.1111.b: "Mam artefakt, który potrzebuje nieco czułości. To [artifact_target_2.GetNameNoTooltip|l]."
 gdp_visit_holding_decision_event.1111.b.tt: "Artefakt znany jako [artifact_target_2.GetName|l] zyska ulepszenie"
 gdp_visit_holding_decision_event.1111.c: "Mam artefakt, któremu przydałaby się konserwacja. To [artifact_target_3.GetNameNoTooltip|l]."
 gdp_visit_holding_decision_event.1111.c.tt: "Artefakt znany jako [artifact_target_3.GetName|l] zyska ulepszenie"
 gdp_visit_holding_decision_event.1111.d: "Chyba muszę przyjść później…"
 gdp_visit_holding_decision_event.1111.d.tt: "Wróć do gildii i zobacz, co jeszcze miejsce o nazwie [THIS.Char.GetCurrentLocation.GetName] ma do zaoferowania"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: kowal"
 gdp_visit_holding_decision_event.1112.desc: "Gdy wchodzę do warsztatu kowala, czuję żar bijący z kuźni, który jest niemal nie do zniesienia. Swoją obecnością przerywam pracę rzemieślnika wykuwającego długi miecz. Wytarłszy z czoła mieszaninę potu i sadzy, kowal skupił swoją uwagę na mnie.\n\n– No proszę, co ja widzę? [ROOT.Char.GetTitleAsNameNoTooltip] chce dziś nabyć jakąś broń i zbroję? W miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] nie znajdziesz nic lepszego."
 gdp_visit_holding_decision_event.1112.a: "[arms_armor_artifact_1.GetNameNoTooltip|l] to będzie świetne uzupełnienie mojej kolekcji."
 gdp_visit_holding_decision_event.1112.b: "[arms_armor_artifact_2.GetNameNoTooltip|l]… Może kupię sobie właśnie to."
 gdp_visit_holding_decision_event.1112.c: "Przydałoby mi się coś takiego, jak [arms_armor_artifact_3.GetNameNoTooltip|l]."
 gdp_visit_holding_decision_event.1112.d: "Po namyśle, może nie dzisiaj."
 gdp_visit_holding_decision_event.1112.d.tt: "Udaj się z powrotem do gildii i zobacz, co jeszcze miejsce o nazwie [THIS.Char.GetCurrentLocation.GetName] ma do zaoferowania"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: wskazówki mistrza gildii"
 gdp_visit_holding_decision_event.1113.desc: "Spotkanie z mistrzem gildii, którym jest [guild_master.GetName], okazało się owocne dla kompanii rodu [ROOT.Char.GetHouse.GetName]. W zakurzonym gabinecie, wśród stert dokumentów i książek, godziny mijały jedna za drugą.\n\n[guild_master.GetNameNoTooltip] posiada wyjątkową wiedzę na temat [guild_master.Custom('highest_skill_noun')]. Sposób, w jaki się wypowiada, sprawia, że ja i [visiting_associate.GetName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))], nie możemy przestać [guild_master.Custom('PL_go_jej')] słuchać i chcemy dowiedzieć się więcej."
 gdp_visit_holding_decision_event.1113.a.success: "Ty i [visiting_associate.GetName] chłoniecie nową wiedzę bez trudu"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Odczytywanie starożytnych rękopisów nie jest łatwym zadaniem."
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "Równania są dla ciebie i osoby znanej jako [visiting_associate.GetName] zbyt trudne, by je zrozumieć"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Wielkie zmagania dyplomatyczne są zbyt złożone, by je pojąć"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "Nauki idą na marne."
 gdp_visit_holding_decision_event.1113.a: "– Może [visiting_associate.GetNameNoTooltip] i ja zostaniemy chwilę dłużej?"
 gdp_visit_holding_decision_event.1113.a.child: "Ta lekcja będzie miała korzystny wpływ na edukację osoby znanej jako [visiting_associate.GetName]"
 gdp_visit_holding_decision_event.1113.b: "– [visiting_associate.GetFirstNameNoTooltip] niech lepiej wysłucha jeszcze jednego wykładu na ten temat."
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName] będzie nauczać osobę znaną jako [visiting_associate.GetNameNoTooltip] następującego zagadnienia:"
 gdp_visit_holding_decision_event.1113.c: "– Ciekawe, muszę to od razu zapisać!"
 gdp_visit_holding_decision_event.1113.c.tt: "Wiedza osoby znanej jako [guild_master.GetName] będzie przydatna dla kompanii rodu [THIS.Char.GetHouse.GetName]"
 gdp_visit_holding_decision_event.1113.d: "Na dziś temat [guild_master.Custom('highest_skill_noun')] uważam za zamknięty."
 gdp_visit_holding_decision_event.1113.d.tt: "Udaj się z powrotem do gildii i zobacz, co jeszcze miejsce o nazwie [THIS.Char.GetCurrentLocation.GetName] ma do zaoferowania"
 gdp_visit_holding_decision_event.1300.t: "Wizyta na targowisku miejsca znanego jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1300.asia: "Podobnie jak na wszystkich rynkach wzdłuż Wielkiego Jedwabnego Szlaku, tutaj również nie brakuje towarów luksusowych, takich jak jadeit, jedwab czy herbata.\n\nPośrodku zatłoczonej ulicy mężczyzna ostrożnie rozładowuje wóz pełen delikatnych porcelanowych wazonów. Obok niego zagraniczny handlarz w barwnej odzieży przechadza się między straganami, wypatrując okazji do zakupu."
 gdp_visit_holding_decision_event.1300.mena_india: "Kolorowe tkaniny i wzorzysta ceramika rozjaśniają ponurą uliczkę. Powietrze wypełnia przyjemny zapach kadzideł i przypraw.\n\nW ciemnym zaułku handlarz rozpaczliwie próbuje przekonać sceptycznego przechodnia, by kupił jego wysokiej jakości miedziane talerze. To doskonały moment na zawarcie transakcji."
 gdp_visit_holding_decision_event.1300.default: "Zapach świeżych produktów miesza się z wonią gromadzącego się tłumu. Na zatłoczonym placu handlarze próbują przekrzyczeć siebie nawzajem.\n\n– [ROOT.Char.Custom('RegionalDrink')|U]! Specjalna oferta, tylko dzisiaj!\n\n– [ROOT.Char.Custom('RegionalEdibleMeat')|U]! Ostatnia szansa, żeby kupić najlepszy kawałek.\n\n"
 gdp_visit_holding_decision_event.monk_hint: "Jakiś mężczyzna wychodzi z pobliskiej herbaciarni ze spuszczoną głową, mamrocząc coś o złych wróżbach. Podobno ktoś w środku przepowiada przyszłość."
 gdp_visit_holding_decision_event.monk_hint_return: "W herbaciarni jest już ciszej, lecz wróżący mnich wciąż nie wyszedł."
 gdp_visit_holding_decision_event.caravaneer_hint: "Ulicę wypełnia sznur zniszczonych niepogodą karawan, a miejscowe stajnie ledwo nadążają ze wzmożonym ruchem handlowym."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "Karawany wciąż nie ruszyły w dalszą drogę. Ich poganiacz nadal przebywa pośród zwierząt, czekając."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\nKrążą plotki, że pewien wyjątkowo doświadczony kapitan przyjmuje dziś pasażerów na swój statek."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\nKapitan wciąż przyjmuje pasażerów, a tłum wokół statku nie rzednie ani na moment."
 gdp_visit_holding_decision_event.carnival_jester_hint: "Mimowolnie podsłuchuję, jak pewien kupiec narzeka na ulicznego kuglarza, który odciąga uwagę jego stałych klientów."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "Uliczny kuglarz wciąż skupia na sobie tłum, a pobliscy kupcy bynajmniej nie wyglądają na zadowolonych."
 gdp_visit_holding_decision_event.cook_hint: "Zauważam, że wielu ludzi przechadza się, trzymając w rękach smakołyk – to [ROOT.Char.Custom('FavoriteTreat')]. Ktoś mówi, że pewien piekarz rozdaje towar za darmo."
 gdp_visit_holding_decision_event.cook_hint_return: "Stragan piekarza wciąż jest otwarty."
 gdp_visit_holding_decision_event.1300.desc.fallback: "Monety i towary przechodzą z rąk do rąk w szalonym tempie. Rynek jest pełen możliwości."
 gdp_visit_holding_decision_event.1300.a: "Ciekawi mnie, jakie wieści przynoszą zagraniczni handlarze."
 gdp_visit_holding_decision_event.1300.a.tt: "Dzięki podsłuchiwaniu handlarzy możesz mieć okazję, aby:$gdp_visit_holding_decision_effect_contracts$ "
 gdp_visit_holding_decision_event.1300.a.cooldown.tt: "Niedawno już przyszło ci tworzyć kontrakty – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1310_has_created_contract_recently') )]"
 gdp_visit_holding_decision_event.1300.b: "Muszę wypatrywać nowych, kompetentnych współpracowników."
 gdp_visit_holding_decision_event.1300.b.cooldown.tt: "Niedawno już przyszło ci podejmować próbę rekrutowania partnerów – spróbuj ponownie po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_recruited_recently') )]"
 gdp_visit_holding_decision_event.1300.b.tt: "Dzięki przeszukiwaniu targowiska możesz mieć okazję, aby:$gdp_visit_holding_decision_effect_recruit$ "
 gdp_visit_holding_decision_event.1300.c: "Chyba udam się gdzie indziej…"
 gdp_visit_holding_decision_event.1300.d: "Jakiż czeka mnie los?"
