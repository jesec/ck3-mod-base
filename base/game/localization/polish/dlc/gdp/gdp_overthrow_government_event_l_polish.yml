 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "Obalenie rządu"
 overthrow_government_outcome.1001.desc: "Spisek osiągnął punkt kulminacyjny. Teraz albo nigdy. Kluczowi wspólnicy zostali umieszczeni w koszarach straży miejskiej, w siedzibie zgromadzenia oraz w pałacu. Na mój rozkaz przejmą stery władzy, co zapewni obalenie starego reżimu.\n\nJutro zgromadzenie nie będzie miało innego wyboru, jak tylko uznać moją władzę i potępić moich przeciwników jako wrogów publicznych."
 overthrow_government_outcome.1001.a: "Żadnej krwi. Żadnych wygnańców."
 overthrow_government_outcome.1001.b: "To moi osobiści wrogowie."
 overthrow_government_outcome.1001.c: "Każdy, kto nam się sprzeciwia, musi odejść."
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "Republika trwa"
 overthrow_government_outcome.1002.desc: "Wyszła na jaw konspiracja wśród moich patrycjuszy. Stoi za nią prawdziwie niegodziwa osoba – [owner.GetShortUINameNotMeNoTooltip]. Na szczęście zamach stanu szybko zderzył się ze ścianą, jaką jest mój chwalebny rząd!\n\nCi złoczyńcy próbowali pojmać moją dostojną osobę, ale straż do tego nie dopuściła. Zgromadzenie i wojsko pozostają mi wierne pomimo nikczemnych wysiłków wroga."
 overthrow_government_outcome.1002.a: "Pojmać ich!"
 overthrow_government_outcome.1002.b: "Zajmę się nimi w stosownym czasie."
 overthrow_government_outcome.1002.c: "Znajdę w sobie siłę, by im to wybaczyć."
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUINameNotMe] i [owner.Custom('PL_jego_jej')] [agents|El] przestają być traktowani jako [Concept('criminal', 'przestępcy')|E] i nie są już wrogami publicznymi."
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "Obalenie"
 overthrow_government_outcome.1003.desc: "– Wasza czcigodność! – wykrzykuje [craftsman_character.GetShortUINameNotMeNoTooltip], wpadając przez drzwi z duszą na ramieniu.\n\n– Konspiracja! Zdrada! [owner.GetShortUINameNotMeNoTooltip] wraz ze swoimi stronnikami chcą zmusić zgromadzenie, by potępić cię jako wroga publicznego! Zbiry są już w drodze!\n\nPosłaniec chodzi po pokoju jak lew po klatce. – Co powinniśmy zrobić? – pyta."
 overthrow_government_outcome.1003.b.desc: "– Wasza czcigodność! – wykrzykuje [craftsman_character.GetShortUINameNotMeNoTooltip], wpadając przez drzwi z duszą na ramieniu.\n\n– Konspiracja! Zdrada! [owner.GetShortUINameNotMeNoTooltip] wraz ze swoimi stronnikami chcą zmusić zgromadzenie do ogłoszenia nowego rządu. Wieść się niesie, że zdetronizowano cię, ale obecny rząd ułaskawił wszystkich wrogów politycznych.\n\n[craftsman_character.GetShortUINameNotMeNoTooltip] patrzy na mnie z przygnębioną miną. – Co powinniśmy zrobić? – pyta."
 overthrow_government_outcome.1003.a: "Pozwolę, by [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] i rada usłyszeli moje argumenty."
 overthrow_government_outcome.1003.b: "Udam się na wygnanie."
 overthrow_government_outcome.1003.c: "Odejdę z polityki i zostanę skromnym kupcem."
 overthrow_government_outcome.1003.d: "Póki co nic. Takie są zawirowania polityki."
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "Wróg publiczny"
 overthrow_government_outcome.1004.1.desc: "Ogłoszono mnie wrogiem publicznym!"
 overthrow_government_outcome.1004.2.desc: "\n\nAkt ten jest wywieszany na każdym rynku i na drzwiach każdego kościoła. Moje życie i majątek są w niebezpieczeństwie."
 overthrow_government_outcome.1004.3.desc: "\n\nW każdej chwili mogą mnie zaaresztować!"
 overthrow_government_outcome.1004.councilor.desc: "\n\nNiewątpliwie z powodu mojej znaczącej pozycji w radzie obalonego reżimu."
 overthrow_government_outcome.1004.personal.desc: "\n\n[owner.GetName] uważa mnie za osobistego wroga – nietrudno odgadnąć dlaczego."
 overthrow_government_outcome.1004.political.desc: "\n\nNiewątpliwie z powodu mojej pozycji wpływowego patrycjusza i głośnego przeciwnika programu „[owner.GetHouse.GetHouseAspiration.GetName]” nowego reżimu."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nNiewątpliwie z powodu mojego współudziału w spisku mającym na celu obalenie rządu."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "Kości zostały rzucone"
 overthrow_government_outcome.1005.desc: "W powietrzu czuć napięcie, gdy [speaker.GetShortUINameNotMeNoTooltip] wychodzi przed zgromadzenie i zabiera głos.\n\n– Patrycjusze! Niech żyje nasza ojczyzna i republika. Z bólem serca muszę wam oznajmić, że [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] [target.GetFirstNameNoTooltip] traci władzę z powodu dopuszczenia się korupcji i zdrady stanu…\n\nPrzez salę przetacza się fala okrzyków i pomruków, ale część wpływowych patrycjuszy wstaje i bije brawo.\n\n– Mocą nadzwyczajnego dekretu [owner.GetFirstNameNoTooltip] otrzymuje zadanie przywrócenia właściwego kursu statkowi, jakim jest nasze nowe państwo. [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] to tytuł, który będzie nosić.\n\nOklaski stają się coraz głośniejsze, a kolejni patrycjusze wstają z miejsc."
 overthrow_government_outcome.1005.a: "Niech żyje republika!"
 overthrow_government_outcome.1005.b: "Buu! Tyrania! Zdrada!"
 government_overthrow_enemies.1001.b.custom: "Następujący patrycjusze stają się [Concept('criminals', 'przestępcami')|E]:\n$EFFECT_LIST_BULLET$Obalony [liege|El] wraz z [Concept('councillors', 'radnymi')|E]\n$EFFECT_LIST_BULLET$Twoi [rivals|El] oraz twój [nemesis|El]\n$EFFECT_LIST_BULLET$Postacie mający o tobie [Concept('opinion', 'opinię')|E] na poziomie #N -60#! lub niższą\n$EFFECT_LIST_BULLET$[house_heads|E] z [Concept('house_relation', 'relacją międzyrodową')|E] typu [rivalry|El]\n$EFFECT_LIST_BULLET$Mogą oni poprosić o łaskę [assembly|El] lub udać się na wygnanie\n$EFFECT_LIST_BULLET$[friends|E], [lovers|El], [soulmates|El] oraz [blood_brothers|El] to osoby, których to nie dotyczy"
 government_overthrow_enemies.1001.c.custom: "Następujący patrycjusze stają się [Concept('criminals', 'przestępcami')|E]:\n$EFFECT_LIST_BULLET$Każdy [powerful_vassal|El] z inną [Concept('house_ambition', 'ambicją rodu')|E]\n$EFFECT_LIST_BULLET$Obalony [liege|El] wraz z [Concept('councillors', 'radnymi')|E]\n$EFFECT_LIST_BULLET$Twoi [rivals|El] oraz twój [nemesis|El]\n$EFFECT_LIST_BULLET$Postacie mający o tobie [Concept('opinion', 'opinię')|E] na poziomie #N -60#! lub niższą\n$EFFECT_LIST_BULLET$[house_heads|E] z [Concept('house_relation', 'relacją międzyrodową')|E] typu [rivalry|El]\n$EFFECT_LIST_BULLET$Osobiści wrogowie twoich [Concept('agents', 'wspólników')|E]\n$EFFECT_LIST_BULLET$Mogą oni poprosić o łaskę [assembly|El] lub udać się na wygnanie"
 government_overthrow_populace.1001.a.custom: "Każde [county|El] w twoim [Concept('realm', 'państwie')|E]"
 government_overthrow_populace.1001.a.description: "Oferujesz powszechne ułaskawienie przeciwnikom nowego reżimu."
 government_overthrow_forgiven.tt: "Twoje przestępstwa przeciwko państwu zostają ci wybaczone"
 overthrow_government_outcome.tt.success.desc: "Elokwentnie bronisz swoich działań"
 overthrow_government_outcome.tt.success.toast: "Udowadniasz, że twoje działania wynikały z miłości do republiki"
 overthrow_government_outcome.tt.failure.desc: "Twoja przemowa trafia w próżnię"
 overthrow_government_outcome.tt.failure.toast: "Rada cię wygwizduje i usuwa ze zgromadzenia"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNotMeNoTooltip] staje się skromnym kupcem"
 overthrow_government_enemy_of_the_state.tt: "Rada uznaje cię za wroga publicznego"
 overthrow_government_amnesty.tt: "Zgromadzenie udziela powszechnej amnestii wszystkim spiskującym"
 overthrow_government_arrested.tt: "[target.GetShortUINameNotMeNoTooltip] każe cię aresztować za udział w spisku przeciwko państwu"
 overthrow_government_blanket_pardon.tt: "Obalenie rządu: ułaskawienie"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNotMeNoTooltip] wydaje akt łaski wobec wszystkich swoich wrogów politycznych."
