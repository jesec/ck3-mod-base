l_polish:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "Niska powszechna opinia: niespokojni ludzie"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "Niska powszechna opinia: kryzys w mieście"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "Wysoka powszechna opinia: dobre nastroje"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "Wysoka powszechna opinia: rozkwit miasta"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "Stagnacja gospodarcza"
 gdp_popular_opinion_mild_neg_prosperity_desc: "Niezadowolenie społeczne sprawiło, że obywatele niechętnie inwestują w miasto, co spowalnia jego długoterminowy rozwój."
 gdp_popular_opinion_mild_neg_taxes: "Unikanie podatków"
 gdp_popular_opinion_mild_neg_taxes_desc: "Rozgoryczeni mieszkańcy znajdują sposoby na uniknięcie płacenia należności, co powoduje spadek dochodów we wszystkich dzielnicach miasta."
 gdp_popular_opinion_mild_neg_construction: "Opóźnienia budowy"
 gdp_popular_opinion_mild_neg_construction_desc: "Pracownicy i rzemieślnicy wykazują mniejszą niż zwykle chęć do współpracy, co powoduje wzrost kosztów i spowalnia postępy w budowie."
 gdp_popular_opinion_mild_neg_defense: "Niedobór personelu na murach obronnych"
 gdp_popular_opinion_mild_neg_defense_desc: "Obywatele nie chcą służyć w milicji obywatelskiej, przez co w siłach obronnych miasta brakuje ludzi."
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "Zapaść gospodarcza"
 gdp_popular_opinion_severe_neg_prosperity_desc: "Głębokie niepokoje doprowadziły do załamania gospodarki miasta. Wzrost gospodarczy uległ zahamowaniu, a dotychczasowy dobrobyt zaczyna się kurczyć."
 gdp_popular_opinion_severe_neg_taxes: "Sprzeciw wobec podatków"
 gdp_popular_opinion_severe_neg_taxes_desc: "Otwarty sprzeciw wobec podatków rozprzestrzenił się we wszystkich dzielnicach miasta, co spowodowało gwałtowny spadek dochodów publicznych."
 gdp_popular_opinion_severe_neg_construction: "Strajki budowlańców"
 gdp_popular_opinion_severe_neg_construction_desc: "Gildie i robotnicy odmawiają pracy. Roboty budowlane przebiegają niezwykle powoli i są bardzo kosztowne."
 gdp_popular_opinion_severe_neg_defense: "Dezercja w garnizonie"
 gdp_popular_opinion_severe_neg_defense_desc: "Żołnierze opuścili posterunki lub odmówili służby. Mury miasta pozostają niemal bez ochrony."
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "Inwestycje obywatelskie"
 gdp_popular_opinion_mild_pos_prosperity_desc: "Dojrzała społeczność inwestuje w przyszłość miasta, łagodnie wspierając jego długoterminowy dobrobyt."
 gdp_popular_opinion_mild_pos_taxes: "Ochoczy podatnicy"
 gdp_popular_opinion_mild_pos_taxes_desc: "Mieszkańcy płacą podatki bez narzekań, dzięki czemu z każdej dzielnicy miasta napływają większe dochody."
 gdp_popular_opinion_mild_pos_construction: "Entuzjazm mieszkańców"
 gdp_popular_opinion_mild_pos_construction_desc: "Gildie i rzemieślnicy chętnie przyczyniają się do rozwoju miasta, obniżając koszty i skracając czas realizacji nowych inwestycji."
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "Złoty wiek dobrobytu"
 gdp_popular_opinion_strong_pos_prosperity_desc: "Miasto tętni optymizmem. Zarówno mieszkańcy, jak i przedsiębiorcy chętnie inwestują, napędzając silny i trwały wzrost gospodarczy."
 gdp_popular_opinion_strong_pos_taxes: "Przepełniony skarbiec"
 gdp_popular_opinion_strong_pos_taxes_desc: "Duma mieszkańców z miasta bezpośrednio sprzyja przestrzeganiu obowiązków podatkowych we wszystkich dzielnicach."
 gdp_popular_opinion_strong_pos_construction: "Mistrzowskie rzemieślnictwo"
 gdp_popular_opinion_strong_pos_construction_desc: "Najlepsi rzemieślnicy rywalizują o zaszczyt pracy w mieście, co pozwala obniżyć koszty i przyspieszyć realizację każdego projektu."
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "Ostrożni sprzedawcy"
 gdp_popular_opinion_mild_neg_sell_price_desc: "Przez niepokoje w mieście handlowcy stali się ostrożni – wstrzymują dostawy towarów i obniżają ceny na całym rynku."
 gdp_popular_opinion_mild_neg_capacity: "Niepewność na rynku"
 gdp_popular_opinion_mild_neg_capacity_desc: "Spadek zaufania skłonił niektórych sprzedawców do ograniczenia działalności, co doprowadziło do zmniejszenia podaży na rynku."
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "Panika na rynku"
 gdp_popular_opinion_severe_neg_sell_price_desc: "Kryzys na ulicach spowodował gwałtowny spadek cen, ponieważ sprzedawcy usiłują jak najszybciej pozbyć się towarów na chwiejnym rynku."
 gdp_popular_opinion_severe_neg_capacity: "Uciekający kupcy"
 gdp_popular_opinion_severe_neg_capacity_desc: "Znani kupcy całkowicie wycofują się z miasta, co powoduje drastyczne zmniejszenie rynku handlowego."
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "Optymistyczni sprzedawcy"
 gdp_popular_opinion_mild_pos_sell_price_desc: "Dobre nastroje w mieście wzmocniły optymizm sprzedających, co spowodowało wzrost cen na całym rynku."
 gdp_popular_opinion_mild_pos_capacity: "Rozwój rynku"
 gdp_popular_opinion_mild_pos_capacity_desc: "Optymizm przyciąga do miasta nowych handlowców i kupców, co stopniowo zwiększa potencjał rynku."
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "Kwitnący handel"
 gdp_popular_opinion_strong_pos_sell_price_desc: "Niezwykła duma mieszkańców sprawiła, że targ miejski stał się synonimem jakości, a wszystkie towary osiągają tam najwyższe ceny."
 gdp_popular_opinion_strong_pos_capacity: "Kwitnący rynek"
 gdp_popular_opinion_strong_pos_capacity_desc: "Renoma miasta przyciąga kupców z dalekich miejsc, co znacznie zwiększa jego potencjał handlowy."
