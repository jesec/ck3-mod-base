l_polish:
 # Trade
 game_concept_trade: "Handel"
 game_concept_trade_desc: "$game_concept_trade$ stanowi podstawę egzystencji [Concept('republics', 'republik')|E], [Concept('trade_leagues', 'lig handlowych')|E] i [Concept('merchants', 'kupców')|E].\n\n[trade_routes|E] służą do importu i eksportu [Concept('goods', 'towarów')|E] na [trade_markets|El] i z nich, natomiast [needs|El] i [surpluses|El] rynku zależą od [Concept('buildings', 'budowli')|E] w poszczególnych [Concept('baronies', 'baroniach')|E].\n\nZ kolei ceny sprzedaży zależą od [Concept('prosperity', 'dobrobytu')|E] posiadłości, a postacie biorące udział w sprzedaży wykorzystują [competitiveness|El] i [monopolies|El], aby dominować na rynkach. W celu zwiększenia zysków każdy, kto prowadzi handel na rynku, powinien dążyć do zwiększenia [Concept('capacity', 'przepustowości')|E] i długości swoich szlaków, a także liczby obsługiwanych na szlaku rynków i towarów handlowych.\n\nHandlem mogą zajmować się wszystkie [government_forms|E] z wyjątkiem [Concept('adventurers', 'poszukiwaczy przygód')|E] i [Concept('nomads', 'koczowników')|E]."
 game_concept_trade_good: "Towar handlowy"
 game_concept_trade_goods: "Towary handlowe"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "Towaru handlowego"
 game_concept_trade_goods_possessive: "Towarów handlowych"
 game_concept_good: "Towar"
 game_concept_goods: "Towary"
 game_concept_basic_trade_good: "Podstawowy towar handlowy"
 game_concept_basic_trade_goods: "Podstawowe towary handlowe"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$ to [trade_goods|El], które można transportować [Concept('distribution_route', 'szlakiem dystrybucyjnym')|E].\n\n[profit_route|E] lub [commission_route|El] może z kolei obsługiwać dowolne towary handlowe."
 game_concept_market_toll: "Opłata rynkowa"
 game_concept_market_tolls: "Opłaty rynkowe"
 game_concept_toll: "Opłata"
 game_concept_tolls: "Opłaty"
 game_concept_market_toll_desc: "$game_concept_market_tolls$ to kwoty pobierane od każdej sprzedaży na [Concept('trade_market', 'rynku handlowym')|E].\n\nZarządza nimi [market_owner|El], który pobiera również wszystkie należności z tego tytułu.\n\nRynki o mniejszych opłatach rynkowych zapewniają [Concept('merchants', 'kupcom')|E] większe zyski.\n\nWyższe opłaty rynkowe zwiększają [income|El] właściciela rynku, ale zmniejszają zysk, jaki osiągają kupcy na każdym [Concept('profit_route', 'szlaku komercyjnym')|E] przy sprzedaży towarów na tym rynku. Odpowiednio wysokie opłaty mogą skłonić kupców do sprzedaży towarów na rynkach, gdzie pobierane kwoty są niższe.\n\n[market_owner|E] i jego [direct_vassals|El], [tributaries|El], i [clients|El] są zwolnieni z opłat."
 game_concept_good_possessive: "Towaru"
 game_concept_goods_possessive: "Towarów"
 game_concept_trade_good_desc: "$game_concept_trade_goods$ można kupować i sprzedawać na [Concept('market', 'rynku')|E]. Na całym świecie odbywa się handel wieloma różnymi towarami, aby zaspokoić [needs|El] [Concept('realms', 'państw')|E]."
 game_concept_trade_category: "Kategoria towarów"
 game_concept_trade_categories: "Kategorie towarów"
 game_concept_trade_category_short: "Kategoria"
 game_concept_trade_categories_short: "Kategorie"
 game_concept_trade_category_desc: "$game_concept_trade_categories$ to grupy [Concept('trade_goods', 'towarów handlowych')|E]. [trade_markets|E] często mają [need|El] na towary określonej kategorii. Każdy towar z tej kategorii może zaspokoić to zapotrzebowanie."
 game_concept_trade_expertise: "Doświadczenie handlowe"
 game_concept_expertise: "Biegłość"
 game_concept_trade_expertise_desc: "$game_concept_trade_expertise$ stanowi praktyczną znajomość handlu określoną [Concept('trade_category', 'kategorią towarów')|E]. Zdobywa się je dzięki [Concept('primary_good', 'towarowi podstawowemu')|E] na aktywnych [Concept('trade_routes', 'szlakach handlowych')|E]. Wraz ze zdobywaniem doświadczenia handel towarami z danej kategorii staje się bardziej opłacalny, a wyższe [expertise_levels|El] zapewniają dodatkowe premie zależne od danej kategorii."
 game_concept_trade_expertise_progress: "Postęp biegłości w handlu"
 game_concept_expertise_progress: "Postęp biegłości"
 game_concept_trade_expertise_progress_desc: "Każdy punkt [Concept('expertise', 'biegłości')|E] zwiększa postęp postaci w kierunku następnego [Concept('expertise_level', 'poziomu biegłości')|E]."
 game_concept_trade_expertise_level: "Poziom biegłości w handlu"
 game_concept_expertise_level: "Poziom biegłości"
 game_concept_expertise_levels: "Poziomy biegłości"
 game_concept_trade_expertise_level_desc: "$game_concept_trade_expertise_level$ [Concept('trade_category', 'kategorii handlu')|E] to stopniowany poziom odzwierciedlający doświadczenie [Concept('trade_company', 'kompanii handlowej')|E], jakie zdobyła w handlowaniu w danej kategorii.\n\nPoziom ten zwiększa się poprzez gromadzenie [Concept('expertise_progress', 'postępu biegłości')|E] dzięki aktywnym [Concept('trade_routes', 'szlakom handlowym')|E]. Każdy poziom zapewnia dodatkowe premie do [Concept('trade', 'handlu')|E].\n\nBez aktywnego handlu w danej kategorii poziom będzie stopniowo maleć (miesięczny postęp biegłości: #N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#!)."
 game_concept_trade_market: "Rynek handlowy"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "Rynki handlowe"
 game_concept_trade_market_possessive: "Rynku handlowego"
 game_concept_trade_markets_possessive: "Rynków handlowych"
 game_concept_market: "Rynek"
 game_concept_markets: "Rynki"
 game_concept_market_possessive: "Rynku"
 game_concept_markets_possessive: "Rynków"
 game_concept_trade_market_desc: "$game_concept_trade_market$ to centrum wymiany dóbr łączące [Concept('production', 'produkcję')|E] i [needs|El] wszystkich [holdings|El], które obejmuje.\n\nW ramach rynku najpierw wykorzystywana jest miejscowa produkcja, aby zaspokoić [needs|El] jego [Concept('buildings', 'budowli')|E]. To, co pozostaje, staje się [Concept('surplus', 'nadwyżką')|E], którą można sprzedać, natomiast o niezaspokojone zapotrzebowanie trzeba zadbać poprzez import. [trade_routes|E] łączą rynki, aby umożliwić między nimi transport [Concept('goods', 'towarów')|E].\n\nKażdy rynek skupia się wokół [Concept('market_capital', 'stolicy rynku')|E] należącej do [Concept('market_owner', 'właściciela rynku')|E], a im wyższy poziom [Concept('market_prosperity', 'dobrej koniunktury rynku')|E], tym lepsze [sell_prices|El] są oferowane handlarzom."
 game_concept_market_prosperity: "Dobra koniunktura rynku"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$ to średni poziom [Concept('prosperity', 'dobrobytu')|E] we wszystkich [Concept('counties', 'hrabstwach')|E] na [Concept('market', 'rynku')|E].\n\nLepsza koniunktura rynku wpływa na wzrost [Concept('sell_prices', 'cen sprzedaży')|E] [Concept('goods', 'towarów')|E] na rynku, co czyni go zyskowniejszym miejscem docelowym dla [Concept('merchants', 'kupców')|E]."
 game_concept_market_capital: "Stolica rynku"
 game_concept_market_capitals: "Stolice rynków"
 game_concept_market_capital_possessive: "Stolicy rynku"
 game_concept_market_capitals_possessive: "Stolic rynków"
 game_concept_market_capital_desc: "$game_concept_market_capital$ to [holding|El] w samym środku [Concept('market', 'rynku')|E], będąca zwykle stolicą [de_jure|El] [Concept('duchy', 'księstwa')|E] znajdującego się w danym rynku.\n\nUstawia się ją na początku gry i nie zmienia jej miejsca. Osoba, która posiada tę [Concept('barony', 'baronię')|E], staje się [Concept('market_owner', 'właścicielem rynku')|E] i go kontroluje."
 game_concept_market_owner: "Właściciel rynku"
 game_concept_market_owners: "Właściciele rynków"
 game_concept_market_owner_possessive: "Właściciela rynku"
 game_concept_market_owners_possessive: "Właścicieli rynków"
 game_concept_owner: "Właściciel"
 game_concept_owners: "Właściciele"
 game_concept_owner_possessive: "Właściciela"
 game_concept_owners_possessive: "Właścicieli"
 game_concept_market_owner_desc: "$game_concept_market_owner$ to osoba, do której należy [Concept('market_capital', 'stolica')|E] danego [Concept('market', 'rynku')|E]. Możliwość sprawowania kontroli nad tą stolicą przechodzi z rąk do rąk wraz ze zmianą posiadacza [Concept('barony', 'baronii')|E], w której się ona znajduje, poprzez wojnę lub dziedziczenie.\n\nWłaściciel rynku sprawuje nad nim kontrolę. Może tworzyć połączone z nim [distribution_routes|El], musi być wspólnikiem przy organizacji [Concept('commission_routes', 'zleconych szlaków')|E], może nadawać prawo do [Concept('monopolies', 'monopoli')|E] w ramach rynku, a także ustalać obowiązującą na nim [Concept('market_toll', 'opłatę rynkową')|E]."
 game_concept_market_priority: "Priorytet rynku"
 game_concept_market_priorities: "Priorytety rynku"
 game_concept_market_priority_desc: "$game_concept_market_priority$ to kolejność, w jakiej zaspokajane jest [needs|El] [holdings|El] na danym [Concept('market', 'rynku')|E].\n\nNa pierwszym miejscu znajduje się [market_capital|El], następnie reszta [Concept('county', 'hrabstwa')|E], a po nim pozostałe hrabstwa uszeregowane według [Concept('settlement_size', 'wielkości osady')|E] ich [Concept('county_capital', 'stolic')|E].\n\nW ramach każdego hrabstwa najpierw zaopatrywana jest jego [Concept('county_capital', 'stolica')|E], a potem pozostałe posiadłości w kolejności według ich [Concept('settlement_size', 'wielkości osady')|E].\n\nPo wejściu do [Concept('holding', 'posiadłości')|E] możesz zmienić kolejność [Concept('districts', 'dzielnic')|E] oraz [Concept('buildings', 'budowli')|E], aby [needs|El] odpowiedniej [Concept('building', 'budowli')|E] było zaspokajane w pierwszej kolejności."
 game_concept_market_share: "Udział w rynku"
 game_concept_market_shares: "Udziały w rynku"
 game_concept_market_share_desc: "Twój udział w rynku określa, jaką ilość danego [Concept('trade_good', 'towaru handlowego')|E] można sprzedać na twoim [Concept('profit_route', 'szlaku komercyjnym')|E] na określonym [Concept('market', 'rynku')|E], co zależy od twojej konkurencyjności.\n\nPrzykładowo jeśli masz tyle samo konkurencyjności co wszystkie inne osoby handlujące danym towarem wzięte razem, twój udział w rynku wyniesie 50%. Jeśli nikt inny nie handluje tym towarem, twój udział w rynku zawsze wynosi 100%.\n\nW takim przypadku możesz kupić całą [Concept('surplus', 'nadwyżkę')|E] lub sprzedać tyle, ile trzeba, aby zaspokoić całe [needs|El] na tym rynku, o ile dysponujesz wystarczającą [Concept('capacity', 'przepustowością')|E]."
 game_concept_trade_route: "Szlak handlowy"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "Szlaki handlowe"
 game_concept_trade_route_possessive: "Szlaku handlowego"
 game_concept_trade_routes_possessive: "Szlaków handlowych"
 game_concept_route: "Szlak"
 game_concept_routes: "Szlaki"
 game_concept_route_possessive: "Szlaku"
 game_concept_routes_possessive: "Szlaków"
 game_concept_trade_route_desc: "$game_concept_trade_route$ umożliwia [Concept('character', 'postaci')|E] prowadzenie [Concept('trade', 'handlu')|E] za [gold|El] lub w celu zaspokojenia zapotrzebowania jej [Concept('realm', 'państwa')|E]. Szlaki te służą do wymiany [Concept('goods', 'towarów')|E] między [Concept('markets', 'rynkami')|E], przekazując [Concept('surplus', 'nadwyżkę')|E] z jednego, aby zaspokoić [needs|El] innego.\n\nIstnieją trzy rodzaje szlaków:\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E]: wykorzystywany przez [Concept('dukes', 'książąt')|E] i osoby wyższej rangi do zaspokajania [Concept('needs', 'zapotrzebowania')|E] swoich [Concept('buildings', 'budowli')|E].\n$EFFECT_LIST_BULLET$[profit_route|E]: wykorzystywany przez [Concept('merchants', 'kupców')|E] i władców [Concept('republican', 'republikańskich')|E] do generowania [Concept('gold', 'złota')|E].\n$EFFECT_LIST_BULLET$[commission_route|E]: podobny do szlaku komercyjnego, ale jest on przyznawany kupcom przez władców z ziemią na ograniczony czas, za jednorazową, uiszczaną z góry opłatą w celu zaspokojenia zapotrzebowania.#!"
 game_concept_distribution_route: "Szlak dystrybucyjny"
 game_concept_distribution_routes: "Szlaki dystrybucyjne"
 game_concept_distribution: "Dystrybucja"
 game_concept_distribution_route_possessive: "Szlaku dystrybucyjnego"
 game_concept_distribution_routes_possessive: "Szlaków dystrybucyjnych"
 game_concept_distribution_route_desc: "$game_concept_distribution_route$ to rodzaj [Concept('trade_route', 'szlaku handlowego')|E] używany przez [Concept('dukes', 'książąt')|E] i osoby wyższe rangą do zaopatrywania własnego [Concept('realm', 'państwa')|E].\n\nŁączy on dwa [markets|El], a wszelka [surplus|El] na jednym z nich jest wykorzystywana do zaspokojenia [Concept('needs', 'zapotrzebowania')|E] na drugim. Szlakiem dystrybucyjnym można jednak przewozić tylko [basic_trade_goods|El]."
 game_concept_profit_route: "Szlak komercyjny"
 game_concept_profit_routes: "Szlaki komercyjne"
 game_concept_profit: "Zysk"
 game_concept_profit_route_possessive: "Szlaku komercyjnego"
 game_concept_profit_routes_possessive: "Szlaków komercyjnych"
 game_concept_profit_route_desc: "$game_concept_profit_route$ to rodzaj [Concept('trade_route', 'szlaku handlowego')|E] wykorzystywanego przez [Concept('merchants', 'kupców')|E] oraz [Concept('rulers', 'władców')|E] [Concept('republican', 'republikańskich')|E] w celu zarabiania [Concept('gold', 'złota')|E].\n\nW ramach tego szlaku [trade_goods|El] są kupowane tanio tam, gdzie występuje ich [surplus|El], a następnie sprzedawane w miejscach, w których [needs|El] jest duże, co zapewnia zysk wynikający z różnicy między [Concept('buy_price', 'ceną zakupu')|E] a [Concept('sell_price', 'ceną sprzedaży')|E]."
 game_concept_trade_route_modifier: "Modyfikator szlaków handlowych"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "Modyfikatory szlaków handlowych"
 game_concept_trade_route_modifier_desc: "Ten [modifier|El] ma zastosowanie do wszystkich [Concept('trade_routes', 'szlaków handlowych')|E] ich właściciela. Atrybuty, na które może mieć wpływ, to:\n$BULLET_WITH_TAB$[competitiveness_i] [trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i] [trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i] [route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i] [max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i] [max_trade_markets_short|E]"
 game_concept_commission_route: "Zlecony szlak"
 game_concept_commission_route_desc: "$game_concept_commission_route$ to [trade_route|El], na którym działa [merchant|El] w imieniu swojego [Concept('merchant_patron', 'patrona')|E].\n\n$game_concept_merchant$ otrzymuje od patrona zapłatę w zamian za dostarczanie wskazanego [Concept('trade_good', 'towaru handlowego')|E] na wyznaczony [trade_market|El] przez cały czas trwania zlecenia.\n\n$game_concept_merchant$ może mieć w danym momencie tylko #V 1#! zlecony szlak."
 game_concept_commission_routes: "Zlecone szlaki"
 game_concept_commission_route_possessive: "Zleconego szlaku"
 game_concept_commission_routes_possessive: "Zleconych szlaków"
 game_concept_commission: "Zlecenie"
 game_concept_commissions: "Zlecenia"
 game_concept_commission_possessive: "Zlecenia"
 game_concept_commissions_possessive: "Zleceń"
 game_concept_commissioned_route: "Zlecony szlak"
 game_concept_commissioned_routes: "Zlecone szlaki"
 game_concept_trade_route_length: "Długość szlaku handlowego"
 game_concept_route_length: "Długość szlaku"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$ to maksymalna liczba [Concept('baronies', 'baronii')|E], przez które może przebiegać [profit_route|El], z uwzględnieniem mórz i nadających się do żeglugi rzek. Liczbę tę można zwiększyć, ulepszając [company_buildings|El]."
 game_concept_max_trade_goods: "Maksymalna ilość towarów handlowych"
 game_concept_max_trade_goods_short: "Towary handlowe"
 game_concept_max_trade_goods_desc: "$game_concept_max_trade_goods$ to liczba różnych rodzajów [Concept('good', 'towarów')|E], którymi można handlować na [Concept('route', 'szlaku')|E]. Liczbę tę można zwiększyć, ulepszając [company_buildings|El].\n\n[Concept('goods', 'Towarów')|E] obsługiwanych na [Concept('profit_route', 'szlaku komercyjnym')|E] nie może nigdy być więcej niż #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#!, niezależnie od wszelkich premii."
 game_concept_max_trade_markets: "Maksymalna liczba rynków handlowych"
 game_concept_max_trade_markets_short: "Rynki handlowe"
 game_concept_max_trade_markets_desc: "$game_concept_max_trade_markets$ to liczba [Concept('markets', 'rynków')|E], które [character|El] może wyznaczyć jako przystanki na [Concept('profit_route', 'szlaku komercyjnym')|E]. Liczbę tę można zwiększyć, ulepszając [company_buildings|El]."
 game_concept_trade_route_capacity: "Przepustowość szlaku handlowego"
 game_concept_trade_route_capacity_short: "Przepustowość handlu"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "Przepustowość"
 game_concept_trade_route_capacity_desc: "$game_concept_trade_route_capacity$ określa liczbę [Concept('trade_goods', 'towarów handlowych')|E], którymi można handlować w danym momencie na [Concept('profit_route', 'szlaku komercyjnym')|E]. Liczbę tę można zwiększyć, ulepszając [company_buildings|El]."
 game_concept_primary_good: "Towar podstawowy"
 game_concept_primary_goods: "Towary podstawowe"
 game_concept_primary_good_desc: "[merchants|E] i [patricians|El] mają jeden [trade_good|El], który jest towarem podstawowym na ich [Concept('trade_routes', 'szlakach handlowych')|E].\n\nHandlowanie nim zapewnia [trade_expertise|El] w danej [Concept('trade_category', 'kategorii towarów')|E]."
 game_concept_road: "Droga"
 game_concept_roads: "Drogi"
 game_concept_road_possessive: "Drogi"
 game_concept_roads_possessive: "Dróg"
 game_concept_road_desc: "[road|E] łączy dwa [Concept('markets', 'rynki')|E], umożliwiając tworzenie między nimi [Concept('trade_routes', 'szlaków handlowych')|E].\n\n$game_concept_trade_routes$ prowadzące wzdłuż drogi korzystają z niej, głównie poprzez zwiększenie swojej [Concept('trade_route_length', 'długości')|E].\n\n$game_concept_road$ zapewnia też bezpośrednio korzyści [Concept('barony', 'baronii')|E], przez którą przebiega, na przykład zwiększając prędkość ruchu [Concept('armies', 'armii')|E].\n\nKorzyści zapewniane przez drogę zwiększają się wraz z jej [Concept('road_tier', 'poziomem')|E]."
 game_concept_road_tier: "Poziom drogi"
 game_concept_road_tiers: "Poziomy drogi"
 game_concept_road_tier_short: "Poziom"
 game_concept_road_tier_desc: "$game_concept_road_tier$ to poziom rozwoju [Concept('road', 'drogi')|E], od wyboistej, nieutwardzonej ścieżki aż po solidnie zbudowaną trasę.\n\nPoziom drogi wzrasta, im więcej [Concept('trade', 'handlu')|E] się nią odbywa. Osiągnięcie każdego kolejnego poziomu wymaga intensywniejszego wykorzystania dogi i więcej czasu niż osiągnięcie poprzedniego. Wyższe poziomy wzmacniają efekty drogi – zwiększają [Concept('trade_route_length', 'długość')|E] [Concept('trade_routes', 'szlaków handlowych')|E], które nią przebiegają, a także zapewniają większe premie dla [Concept('baronies', 'baronii')|E], przez które przebiega droga.\n\nPoczątkowy poziom drogi taki jak określony na mapie, a na początku gry wyświetlane są tylko te drogi, których poziom jest wyższy od najniższego."
 game_concept_building_need: "Zapotrzebowanie budowli"
 game_concept_building_needs: "Zapotrzebowanie budowli"
 game_concept_need: "Zapotrzebowanie"
 game_concept_needs: "Zapotrzebowanie"
 game_concept_building_need_desc: "[building|E] może mieć zapotrzebowanie na [trade_goods|El], które zapewniają premie, jeśli zostaną dostarczone.\n\n$game_concept_needs$ dotyczy albo konkretnego [Concept('good', 'towaru')|E] #weak (takiego jak [GetTradeGoodType('trade_good_wine').GetName|l])#!, albo dowolnego towaru z danej [Concept('trade_category_short', 'kategorii')|E] #weak (takiej jak [GetTradeGoodCategory('trade_category_alcohol').GetName|l])#!.\n\nKażde zapotrzebowanie jest zaspokajane przez towary handlowe na miejscowym [Concept('market', 'rynku')|E]. Jeżeli nie ma [Concept('surplus', 'nadwyżki')|E] towaru na miejscowym rynku, towary zostaną rozdysponowane zgodnie z [Concept('market_priority', 'priorytetem rynku')|E].\n\n$game_concept_needs$ jest zawsze opcjonalne – niezaspokojenie go nie wiąże się z żadnymi negatywnymi konsekwencjami."
 game_concept_market_balance: "Saldo rynkowe"
 game_concept_market_balances: "Salda rynkowe"
 game_concept_market_balance_short: "Saldo"
 game_concept_market_balances_short: "Salda"
 game_concept_market_balance_desc: "Każdy [market|El] ma saldo dotyczące każdego [Concept('trade_good', 'towaru handlowego')|E] lub kategorii [Concept('goods', 'towarów')|E].\n\nJeśli saldo jest dodatnie, występuje [surplus|El].\n\nJeśli saldo jest ujemne, w [Concept('buildings', 'budowlach')|E] na rynku istnieje wciąż niezaspokojone [needs|El]."
 game_concept_trade_surplus: "Nadwyżka rynkowa"
 game_concept_trade_surpluses: "Nadwyżki rynkowe"
 game_concept_surplus: "Nadwyżka"
 game_concept_surpluses: "Nadwyżki"
 game_concept_trade_surplus_desc: "$game_concept_surplus$ [Concept('trade_good', 'towaru handlowego')|E] na [Concept('market', 'rynku')|E] występuje, gdy [production|El] przekracza [need|El].\n\nTo oznacza, że wszystkie [buildings|El] na rynku mają zaspokojone zapotrzebowanie.\n\nNadwyżkę można wyeksportować poprzez [trade_routes|El] na inne rynki."
 game_concept_trade_deficit: "Deficyt rynkowy"
 game_concept_trade_deficits: "Deficyty rynkowe"
 game_concept_deficit: "Deficyt"
 game_concept_deficits: "Deficyty"
 game_concept_trade_deficit_desc: "$game_concept_deficit$ [Concept('trade_good', 'towaru handlowego')|E] na [Concept('market', 'rynku')|E] występuje, gdy [needs|El] przekracza [Concept('production', 'produkcję')|E] lub import.\n\nTo oznacza, że [buildings|El] na rynku nie będą miały zaspokojonego zapotrzebowania.\n\nImport poprzez [trade_routes|El] może pomóc w pokryciu deficytu."
 game_concept_production: "Produkcja"
 game_concept_productions: "Produkcja"
 game_concept_trade_goods_production: "Produkcja towarów handlowych"
 game_concept_produced: "Produkowane"
 game_concept_production_desc: "$game_concept_production$ oznacza ilość [Concept('trade_good', 'towaru handlowego')|E] wytwarzanego każdego miesiąca przez [districts|El] i znajdujące się w nich [buildings|El].\n\nGdy produkcja towaru na [Concept('market', 'rynku')|E] przekroczy jego [needs|El], dodatkowy towar staje się [Concept('surplus', 'nadwyżką')|E] dostępną do [Concept('trade', 'handlu')|E]. Gdy ilość produkcji jest niewystarczająca, zapotrzebowanie jest niepokryte."
 game_concept_potential_production: "Potencjał produkcyjny"
 game_concept_potential_productions: "Potencjał produkcyjny"
 game_concept_potential_production_desc: "Potencjał produkcyjny każdego [county_possessive|El] określa, które nieprzetworzone [trade_goods|El] można wyprodukować w [Concept('resource_district', 'dzielnicy zasobów')|E] [Concept('county_capital', 'stolicy hrabstwa')|E]."
 game_concept_sell_price: "Cena sprzedaży"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "Ceny sprzedaży"
 game_concept_sell_price_desc: "$game_concept_sell_price$ na [market_possessive|El] to wartość w [Concept('gold', 'złocie')|E] [Concept('trade_good', 'towaru handlowego')|E], na który jest [need|El].\n\nWłaściciele [Concept('profit_routes', 'szlaków komercyjnych')|E] otrzymują kwotę równą cenie sprzedaży towaru handlowego na rynku, gdy za pośrednictwem ich [Concept('route', 'szlaku')|E] sprzedaje się tam towary, aby zaspokoić zapotrzebowanie rynku.\n\n[rulers|E] [landed|El] również korzystają z wysokiej ceny sprzedaży, bo przyciąga to na rynek więcej [Concept('merchants', 'kupców')|E], co zwiększa dochód z [Concept('tolls', 'opłat')|E] lub prawdopodobieństwo zaspokojenia zapotrzebowania.\n\n$game_concept_tolls$ są uiszczane, ilekroć dochodzi do sprzedaży towaru, co zmniejsza rzeczywistą cenę sprzedaży.\n\nPodobnie jak w przypadku [Concept('buy_price', 'ceny zakupu')|E] cena sprzedaży zwiększa się wraz ze wzrostem [Concept('market_prosperity', 'dobrej koniunktury rynku')|E]."
 game_concept_buy_price: "Cena zakupu"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "Ceny zakupu"
 game_concept_buy_price_desc: "$game_concept_buy_price$ na [market_possessive|El] to koszt w [Concept('gold', 'złocie')|E] [Concept('trade_good', 'towaru handlowego')|E] będącego w [Concept('surplus', 'nadwyżce')|E].\n\nWłaściciele [Concept('profit_routes', 'szlaków komercyjnych')|E] płacą cenę zakupu towaru handlowego na rynku, gdy za pośrednictwem [Concept('route', 'szlaku')|E] dokonują tam zakupu towarów będących w nadwyżce.\n\nPodobnie jak w przypadku [Concept('sell_price', 'ceny sprzedaży')|E] cena zakupu zwiększa się wraz ze wzrostem [Concept('market_prosperity', 'dobrej koniunktury rynku')|E]."
 game_concept_trade_monopoly: "Monopol handlowy"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "Monopole handlowe"
 game_concept_monopoly: "Monopol"
 game_concept_monopolies: "Monopole"
 game_concept_trade_monopoly_desc: "$game_concept_monopoly$ pozwala właścicielowi (i tylko jemu) kupować i sprzedawać [goods|El] na [Concept('market', 'rynku')|E].\n\n$game_concept_monopoly$ może być stosowany na kilka sposobów:\n #indent_newline:4    $EFFECT_LIST_BULLET$Zwykły monopol dotyczy jednej [Concept('trade_category', 'kategorii towarów')|E], natomiast [complete_monopoly|El] dotyczy wszystkich kategorii.\n$EFFECT_LIST_BULLET$[exploitative_monopoly|E] pozwala jego właścicielowi kupować towary z [Concept('production', 'produkcji')|E] nawet przed zaspokojeniem [Concept('needs', 'zapotrzebowania')|E].\n$EFFECT_LIST_BULLET$Właścicielem monopolu może być [merchant|El], [republic|El] lub cała [trade_league|El].#!\n\n$game_concept_monopolies$ można zdobyć, wykorzystując interakcję „$request_trade_monopoly_for_character_interaction|V$”."
 game_concept_complete_monopoly: "Monopol całkowity"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "Monopole całkowite"
 game_concept_complete_monopoly_short: "Całkowity"
 game_concept_complete_monopoly_desc: "$game_concept_complete_monopoly$ obejmuje jednocześnie każdy [trade_good|El] na [Concept('market', 'rynku')|E]. W przeciwieństwie do podstawowego [Concept('monopoly', 'monopolu')|E] nie jest on ograniczony do jednej [Concept('trade_category', 'kategorii towarów')|E]."
 game_concept_exploitative_monopoly: "Monopol wyzyskowy"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "Monopole wyzyskowe"
 game_concept_exploitative_monopoly_short: "Wyzyskowy"
 game_concept_exploitative_monopoly_desc: "$game_concept_exploitative_monopoly$ to rodzaj [Concept('monopoly', 'monopolu')|E], który pozwala jego właścicielowi bezpośrednio kupować towary z [Concept('production', 'produkcji')|E] na danym [Concept('market', 'rynku')|E].\n\nZazwyczaj do zakupu dostępna jest tylko [surplus|El]. Właściciel monopolu wyzyskowego może jednak kupować towary produkowane przez [buildings|El] na rynku przed zaspokojeniem miejscowego [Concept('building_needs', 'zapotrzebowania budowli')|E]."
 game_concept_trade_competitiveness: "Konkurencyjność handlowa"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "Konkurencyjność"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "Każdy [profit_route|El] ma określoną konkurencyjność, od której zależy, jaką ilością [Concept('trade_goods', 'towarów handlowych')|E] na [Concept('market', 'rynku')|E] może handlować, konkurując z innymi szlakami komercyjnymi.\n\nIm większa twoja konkurencyjność w zakresie danego towaru handlowego, tym większy jest twój [market_share|El].\n\nJeżeli na rynku panuje [monopoly|El], tylko jego właściciele porównują swoją konkurencyjność."
 game_concept_competitive_pressure: "Presja konkurencji"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "$game_concept_competitive_pressure$ stanowi krótkotrwałą przewagę handlową uzyskaną przez [Concept('merchant', 'kupca')|E]. Można ją wykorzystać do podejmowania unikalnych [Concept('decisions', 'decyzji')|E] i [Concept('interactions', 'interakcji')|E], aby zyskać specjalne przewagi na konkretnych [Concept('trade_routes', 'szlakach handlowych')|E]."
 game_concept_put_on_notice: "Oficjalne ostrzeżenie"
 game_concept_put_on_notice_desc: "„$game_concept_put_on_notice$” to [character_interaction|El] odblokowywana dzięki [Concept('perk', 'atrybutowi')|E] „[GetPerk('prepared_conscription_perk').GetName(GetPlayer)]”. Jej użycie powoduje wydanie punktów [competitive_pressure_i] [Concept('competitive_pressure', 'presji konkurencji')|E] w celu rozpoczęcia wobec rywala [Concept('trade_opportunity', 'okazji handlowej')|E] wymierzonej w [Concept('merchant', 'kupca')|E] na jednym z [Concept('trade_markets', 'rynków handlowych')|E] twojego [Concept('trade_route', 'szlaku handlowego')|E]."
 game_concept_ruthless_oversight: "Bezwzględny nadzór"
 game_concept_ruthless_oversight_desc: "„$game_concept_ruthless_oversight$” to [character_interaction|El] odblokowywana dzięki [Concept('perk', 'atrybutowi')|E] „[GetPerk('fear_tax_perk').GetName(GetPlayer)]”. Może służyć do zwiększenia [Concept('aptitude', 'kompetencji')|E] [Concept('court_position', 'urzędu dworskiego')|E] postaci kosztem [Concept('dread', 'postrachu')|E], [Concept('opinion', 'opinii')|E] oraz [Concept('company_sentiment', 'wartości kompanii')|E]."
 game_concept_request_merchant_charter: "Wniosek o wydanie koncesji kupieckiej"
 game_concept_request_merchant_charter_desc: "„$game_concept_request_merchant_charter$” to [character_interaction|El] pozwalająca [Concept('merchant', 'kupcowi')|E] poprosić swojego [Concept('merchant_patron', 'patrona')|E] o [Concept('charter', 'koncesję')|E], dzięki której otrzyma specjalne prawa na swoim lokalnym [Concept('market', 'rynku')|E]."
 game_concept_monopolize_trade: "Zmonopolizuj handel"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "„$game_concept_monopolize_trade$” to [character_interaction|El], która pozwala [Concept('merchant', 'kupcowi')|E] zapłacić [Concept('market_owner', 'właścicielowi rynku')|E] w [Concept('gold', 'złocie')|E] w zamian za zyskanie [Concept('trade_monopoly', 'monopolu handlowego')|E]."
 game_concept_trader: "Handlarz"
 game_concept_traders: "Handlarze"
 game_concept_trader_possessive: "Handlarza"
 game_concept_traders_possessive: "Handlarzy"
 game_concept_trader_desc: "$game_concept_trader$ to [character|El] wyznaczona do nadzorowania [Concept('trade_route', 'szlaku handlowego')|E].\n\nMusi być [Concept('associate', 'partnerem')|E] lub [Concept('courtier', 'dworzaninem')|E] właściciela szlaku i w danym momencie może nadzorować tylko jeden szlak. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\nKażdemu handlarzowi przypisane jest zadanie, które ulepsza określony aspekt szlaku. [aptitude|E] handlarza w zakresie tego zadania bazują na jego [Concept('skills', 'umiejętnościach')|E].\n\nPracujący na szlaku handlarze prowadzą [schemes|El] osobiste na każdym [Concept('trade_market', 'rynku handlowym')|E]. W przypadku niepowodzenia spisku handlarz zyskuje [Concept('trait', 'cechę')|E] [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l], o ile jej jeszcze nie posiada. Jeśli handlarz posiada tę cechę, zamiast niej zyskuje [Concept('trait_level_track_xp', 'doświadczenie')|E] w losowym [Concept('trait_level_track', 'kierunku cechy')|E] [GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )|l] (może to być koordynator karawan, rzemieślnik lub wierzyciel)."
 game_concept_trader_council: "Z wyjątkiem [Concept('spouse', 'małżonka')|E] właściciela handlarze nie mogą zasiadać w [Concept('council', 'radzie')|E]."
 game_concept_trader_council_merchant: "Handlarzami mogą również zostać [spouse|El] i [deputies|El] właściciela, ale nie [GetCourtPositionType('partner_court_position').GetName()|l] ani [GetCourtPositionType('travel_leader_court_position').GetName()|l]."
 #Merchant
 game_concept_merchant: "Kupiec"
 game_concept_merchants: "Kupcy"
 game_concept_merchant_possessive: "Kupca"
 game_concept_merchants_possessive: "Kupców"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "$game_concept_merchant$ to [character|El] [unlanded|El], która prowadzi [trade|El] w ramach [Concept('company', 'kompanii')|E].\n\nKupcy dążą do zaspokojenia [Concept('building_needs', 'zapotrzebowania budowli')|E] na [Concept('trade_markets', 'rynkach handlowych')|E] i wspierają gospodarkę, starając się zgromadzić osobistą fortunę i poprawić status społeczny. Spośród tych dwóch celów [prestige|El] jest cenniejszy niż [gold|El], ponieważ pozwala umocnić swoją pozycję w oczach [Concept('merchant_patron', 'patrona')|E] i [Concept('associates', 'partnerów')|E]. Dzięki temu kupcy mają możliwość rozszerzenia [Concept('trade_routes', 'szlaków handlowych')|E], a ostatecznie zapewnienia sobie [Concept('trade_monopoly', 'monopolu handlowego')|E]."
 game_concept_merchant_family: "Rodzina kupiecka"
 game_concept_merchant_families: "Rodziny kupieckie"
 game_concept_merchant_family_possessive: "Rodziny kupieckiej"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$ to [houses|El], które prowadzą handel jako [merchants|El] lub [republicans|El]. Posiadają [Concept('company', 'kompanię')|E], będącą własnością [Concept('house_head', 'głowy rodu')|E] i znajdującą się pod jej kontrolą, oraz są istotną częścią [Concept('trade', 'handlu')|E] i [Concept('prosperity', 'dobrobytu')|E] państwa."
 game_concept_associate: "Partner"
 game_concept_associates: "Partnerzy"
 game_concept_associate_possessive: "Partnera"
 game_concept_associates_possessive: "Partnerów"
 game_concept_associate_desc: "$game_concept_associates$ to postacie [unlanded|El], które należą do [Concept('company', 'kompanii')|E] [Concept('merchant', 'kupieckiej')|E]. Pełnią podobną rolę do [Concept('courtiers', 'dworzan')|E] służących władcy z ziemią i mogą zarządzać [Concept('trade_routes', 'szlakami handlowymi')|E] jako [traders|El] oraz zostać [Concept('deputies', 'delegatami')|E]."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "Delegat"
 game_concept_deputies: "Delegaci"
 game_concept_deputy_possessive: "Delegata"
 game_concept_deputies_possessive: "Delegatów"
 game_concept_deputy_desc: "$game_concept_deputies$ służą [Concept('merchant_families', 'rodzinom kupieckim')|E] i ich [Concept('companies', 'kompaniom')|E], pełniąc przeróżne funkcje, które są podobne do [Concept('court_positions', 'urzędów dworskich')|E] i nadawane [Concept('associates', 'partnerom')|E] [Concept('company', 'kompanii')|E], a ich [aptitude|El] określają ich skuteczność w realizacji zadań."
 game_concept_company: "Kompania"
 game_concept_companies: "Kompanie"
 game_concept_company_possessive: "Kompanii"
 game_concept_trade_company: "Kompania handlowa"
 game_concept_trade_companies: "Kompanie handlowe"
 game_concept_company_desc: "$game_concept_trade_companies$ stanowią bazy operacyjne [merchant_family_possessive|El], w których zaczynają się wszystkie jej [trade_routes|El].\n\nKażdy [GetGovernment( 'merchant_government' ).GetName|l] ma [Concept('domicile', 'siedzibę')|E] kompanii handlowej. W przypadku obecności [Concept('merchant_patron', 'patrona')|E] siedziba kupca zazwyczaj znajduje się w [Concept('holding', 'posiadłości')|E] jego [merchant_patron_possessive|El].\n\n[company_buildings|E] to jej [domicile_buildings|El], które zapewniają premie wpływające na handel i osoby z nim powiązane. $game_concept_company$ oferuje również pobyt swoim [Concept('associates', 'partnerom')|E], a także członkom rodziny oraz [Concept('knights', 'rycerzom')|E], których można zatrudnić jako [Concept('deputies', 'delegatów')|E].\n\n#WEAK Podobnie do [Concept('courts', 'dworów')|E] w kompaniach można spotkać bezimienne [characters|El], które nie są na tyle ważne, aby je przedstawiać – choć jest ich mniej.#!"
 game_concept_company_building: "Budowla kompanii"
 game_concept_company_buildings: "Budowle kompanii"
 game_concept_company_buildings_short: "Budowle"
 game_concept_company_building_desc: "$game_concept_company_buildings$ to [domicile_buildings|El] [Concept('company', 'kompanii')|E]. Ulepszają one przede wszystkim [trade|El], w tym [capacity|El], [route_length|El] oraz maksymalną ilość [Concept('max_trade_goods_short', 'towarów handlowych')|E] i maksymalną liczbę [Concept('max_trade_markets_short', 'rynków handlowych')|E] na [Concept('trade_routes', 'szlakach handlowych')|E]."
 game_concept_usury: "Lichwa"
 game_concept_usurer: "Lichwiarz"
 game_concept_usurers: "Lichwiarze"
 game_concept_usurer_possessive: "Lichwiarza"
 game_concept_usurers_possessive: "Lichwiarzy"
 game_concept_usurious: "Lichwiarski"
 game_concept_interest: "Odsetki"
 game_concept_usury_desc: "$game_concept_usury$ to [lending|El] [Concept('gold', 'złota')|E] z odsetkami. To, czy proceder ten stanowi uczciwy interes, czy [sin|El], zależy od [Concept('doctrine', 'doktryny')|E] „[GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip]” danego [Concept('rite', 'obrządku')|E].\n\nTam, gdzie lichwa jest potępiana, [merchant|El] traci [piety|El] za każą [Concept('loan', 'pożyczkę')|E] udzieloną poprzez [Concept('interaction', 'interakcję')|E] „$loan_money_interaction|V$”, a [company|El] z celem „$company_purpose_creditor|V$” zapewnia swojemu właścicielowi trwałą reputację lichwiarza, gdy naliczanie odsetek wyjdzie na jaw.\n\n#weak Niektóre obrządki zakazują pożyczania złota z odsetkami jedynie w ramach własnej [Concept('religion', 'religii')|E], pozwalając ich kupcom udzielać kredytów innym.#!"
 game_concept_loan: "Pożyczka"
 game_concept_loans: "Pożyczki"
 game_concept_loan_possessive: "Pożyczki"
 game_concept_loans_possessive: "Pożyczek"
 game_concept_loaned: "Pożyczone"
 game_concept_lending: "Pożyczanie"
 game_concept_loan_desc: "$game_concept_loan$ to określona ilość [gold_i|E] [Concept('gold', 'złota')|E] przekazana innej osobie z oczekiwaniem spłaty z odsetkami lub bez nich.\n\n$game_concept_loans$ są zazwyczaj zaciągane przez [Concept('ruler', 'władcę')|E], który wpadł w [debt|El] lub który potrzebuje dodatkowych funduszy na [Concept('war', 'wojnę')|E] lub inne wydatki.\n\nPożyczek można udzielać z jawnie wskazanymi odsetkami, ukrytymi odsetkami lub bez odsetek, a poszczególne [faiths|El] mogą mieć różne poglądy na temat [Concept('usury', 'lichwy')|E]\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help $game_concept_loan$ może przetrwać dłużej niż jej strony. Gdy jedna z nich umiera, kredyt przechodzi na jej [Concept('heir', 'dziedzica')|E] (jeśli taki istnieje)#!"
 loan_repayment_help: "#help [debtor|E] może spłacić pożyczki, używając [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('repay_loan_decision').GetName]”, a [creditor|El] może zażądać spłaty, wykorzystując [Concept('interaction', 'interakcję')|E] #V „$demand_repayment_interaction$”#! po upływie co najmniej #V 2#! lat\n\n[merchants|E], których [Concept('company_purpose', 'celem kompanii')|E] jest „[GetLaw('company_purpose_creditor').GetName]”, mogą również z czasem ściągnąć należności z [Concept('loans', 'pożyczek')|E], jeśli zacznie dla nich pracować [GetCourtPositionType( 'bailiff_court_position' ).GetName()|l] i zlecą mu [court_position_task|El] #V „$bailiff_collect_loans$”#!#!"
 game_concept_merchant_patron: "Patron"
 game_concept_merchant_patrons: "Patroni"
 game_concept_merchant_patron_possessive: "Patrona"
 game_concept_merchant_patron_desc: "$game_concept_merchant_patron$ to [ruler|El] [Concept('holding', 'posiadłości')|E], w której znajduje się [domicile|El] [merchant_possessive|El]\n\nW takim przypadku kupiec jest uznawany za [Concept('client', 'klienta')|E] danego patrona i musi płacić mu [taxes|El]."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "Kupiec kliencki"
 game_concept_client_merchants: "Kupcy klienccy"
 game_concept_client_merchant_possessive: "Kupca klienckiego"
 game_concept_client: "Klient"
 game_concept_client_possessive: "Klienta"
 game_concept_clients: "Klienci"
 game_concept_client_merchant_desc: "$game_concept_client_merchant$ to [character|El] będąca [Concept('merchant', 'kupcem')|E]. Posiada [Concept('company', 'kompanię')|E] w [Concept('realm', 'państwie')|E] należącym do [Concept('ruler', 'władcy')|E] [landed|El], który staje się jej [Concept('merchant_patron', 'patronem')|E].\n\n$game_concept_client_merchant$ przekazuje patronowi część wpływów z [Concept('trade', 'handlu')|E]. Nie może dołączać do wojny przeciwko swojemu patronowi ani do sprzeciwiającej się mu [Concept('faction', 'frakcji')|E], a także nie może się uwolnić bez przeniesienia kompanii w inne miejsce."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "Przejmij państwo"
 game_concept_seize_realm_cb_desc: "[casus_belli|E], który umożliwia [Concept('merchant', 'kupcowi')|E] utworzenie [Concept('republic', 'republiki')|E] i uzyskanie ziemi. Atakujący, w celu zmuszenia [Concept('independent', 'niezależnych')|E] [Concept('rulers', 'władców')|E] do dołączenia do tej [Concept('war', 'wojny')|E] w roli [Concept('allies', 'sojuszników')|E], może użyć [Concept('interaction', 'interakcji')|E] „#V $gdp_merchant_seize_realm_call_debtor_interaction$#!”, aby wykorzystać @unspent_strong_hook_icon! [strong_hooks|El] #weak („$strong_indebted_hook$” lub „$strong_loan_hook$”)#!."
 game_concept_company_purpose: "Cel kompanii"
 game_concept_company_purposes: "Cele kompanii"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$ to dyrektywy, które kształtują [Concept('company', 'kompanię')|E] i jej [Concept('merchant_family', 'rodzinę kupiecką')|E].\n\nKompania może skupić się na udzielaniu pożyczek, zaufaniu rodzinnym, jakości i rzadkości swojego asortymentu lub na zasięgu swojej sieci, łączącej zarówno odległe miejsca, jak i kultury.\n\nRóżne cele umożliwiają unikalne [interactions|El], stanowiska [Concept('deputy', 'delegatów')|E] i premie do [Concept('trade', 'handlu')|E]."
 game_concept_trade_acumen: "Handlowy zmysł biznesowy"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "Zmysł biznesowy"
 game_concept_trade_acumen_desc: "$game_concept_acumen$' reprezentuje łączną ilość [Concept('gold', 'złota')|E], które [company|El] [Concept('merchant', 'kupca')|E] zgromadziła poprzez [trade|El] we wszystkich [Concept('trade_categories', 'kategoriach handlu')|E].\n\nZmysł biznesowy jest używany do odblokowywania różnych [company_sizes|El] i nie można go wydawać."
 game_concept_company_size: "Wielkość kompanii"
 game_concept_company_sizes: "Wielkości kompanii"
 game_concept_company_size_desc: "$game_concept_company_size$ odzwierciedla dominację [merchant_family_possessive|El] w [Concept('trade', 'handlu')|E], a każdy kolejny poziom istotnie zwiększa jej [competitiveness|El] i zdolności handlowe. Zwiększenie wielkości wymaga zgromadzenia [Concept('acumen', 'zmysłu biznesowego')|E].\n\nIstnieją cztery różne wielkości: „[GetLaw('company_size_small').GetName]”, „[GetLaw('company_size_medium').GetName]”, „[GetLaw('company_size_large').GetName]” i „[GetLaw('company_size_huge').GetName]”."
 #Contracts
 game_concept_trade_contract: "Kontrakt handlowy"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "Kontrakty handlowe"
 game_concept_trade_contract_possessive: "Kontraktu handlowego"
 game_concept_trade_contracts_possessive: "Kontraktów handlowych"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$ pozwalają [Concept('companies', 'kompaniom')|E] [Concept('merchant', 'kupieckim')|E] wpływać na ich [trade_routes|El] lub szukać cennych bogactw w odległych krainach.\n\nTe pierwsze nazywane są [Concept('trade_opportunities', 'okazjami handlowymi')|E], natomiast drugie – [Concept('luxury_contracts', 'kontraktami na towary i usługi luksusowe')|E]."
 game_concept_trade_contract_tier: "Poziom kontraktu handlowego"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "Poziom"
 game_concept_trade_contract_tier_desc: "Każdy [trade_contract|El] ma określony poziom, od którego zależą zarówno poziom trudności kontraktu, jak i związana z kontraktem handlowym nagroda. Poziom ten zazwyczaj wynika z [Concept('prosperity', 'dobrobytu')|E] lokalizacji kontraktu."
 game_concept_luxury_contract: "Kontrakt na towary i usługi luksusowe"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "Kontrakty na towary i usługi luksusowe"
 game_concept_luxury_contract_possessive: "Kontraktu na towary i usługi luksusowe"
 game_concept_luxury_contracts_possessive: "Kontraktów na towary i usługi luksusowe"
 game_concept_luxury_contract_desc: "$game_concept_luxury_contracts$ wymagają od [Concept('companies', 'kompanii')|E] [Concept('merchant', 'kupieckich')|E] zorganizowania [Concept('travel', 'podróży')|E] do odległego miejsca i podjęcia próby zakupu [Concept('domicile_artifact', 'artefaktu domowego')|E].\n\nKontrakty te mają szansę na pojawienie się co roku dla kupców z [Concept('company_purpose', 'celem kompanii')|E] „Koordynator karawan” i można je zdobyć dzięki [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('gdp_visit_holding_decision').GetName]”"
 game_concept_trade_opportunity: "Okazja handlowa"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "Okazje handlowe"
 game_concept_trade_opportunity_possessive: "Okazji handlowej"
 game_concept_trade_opportunities_possessive: "Okazji handlowych"
 game_concept_opportunity: "Okazja"
 game_concept_opportunities: "Okazje"
 game_concept_opportunity_possessive: "Okazji"
 game_concept_opportunities_possessive: "Okazji"
 game_concept_trade_opportunity_desc: "$game_concept_trade_opportunities$ wymagają od [Concept('companies', 'kompanii')|E] [Concept('merchant', 'kupieckich')|E] pomyślnego przeprowadzenia [Concept('scheme', 'spisku')|E].\n\nZazwyczaj mają one charakter czysto biznesowy (np. promowanie dochodowych [Concept('trade_goods', 'towarów handlowych')|E]), ale mogą też przybierać formę bardziej antagonistyczną (np. rywalizacja z konkurencyjną rodziną o kontrolę nad [Concept('market', 'rynkiem')|E]).\n\nJeśli spisek zakończy się niepowodzeniem lub zostanie z jakiegokolwiek powodu porzucony, to okazja handlowa również zakończy się niepowodzeniem."
 game_concept_trade_opportunity_tier: "Poziom okazji handlowej"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "Poziom"
 game_concept_trade_opportunity_tier_desc: "$game_concept_trade_opportunity_tier$ odzwierciedla [prosperity|El] miejsca realizacji kontraktu.\n\nIm wyższy poziom okazji handlowej, tym wyższe wynagrodzenie, choć poziom trudności zadania jest zwykle również wyższy."
 game_concept_trade_opportunity_scheme: "Spisek dotyczący okazji handlowej"
 game_concept_trade_opportunity_schemes: "Spiski dotyczące okazji handlowej"
 game_concept_trade_opportunity_scheme_possessive: "Spisku dotyczącego okazji handlowej"
 game_concept_trade_opportunity_schemes_possessive: "Spisków dotyczących okazji handlowej"
 game_concept_trade_opportunity_scheme_trade_opportunity: "Okazja handlowa"
 game_concept_trade_opportunity_scheme_opportunity: "Okazja"
 game_concept_opportunity_scheme: "Spisek dotyczący okazji"
 game_concept_opportunity_schemes: "Spiski dotyczące okazji"
 game_concept_opportunity_scheme_possessive: "Spisku dotyczącego okazji"
 game_concept_opportunity_schemes_possessive: "Spisków dotyczących okazji"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "Kontrakt patronacki"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "Kontrakty patronackie"
 game_concept_patron_contract_possessive: "Kontraktu patronackiego"
 game_concept_patron_contracts_possessive: "Kontraktów patronackich"
 game_concept_patron_contract_desc: "$game_concept_patron_contracts$ wymagają od [Concept('companies', 'kompanii')|E] [Concept('merchant', 'kupieckich')|E] pomyślnego przeprowadzenia [Concept('scheme', 'spisku')|E] przeciwko ich [Concept('merchant_patron', 'patronowi')|E].\n\nSą to zwykle spiski [Concept('diplomacy', 'dyplomatyczne')|E] mające na celu spełnienie próśb patrona (np. rozstrzygnąć spór rynkowy) lub zmuszenie go do podporządkowania się woli kupca (np. wyparcie konkurencyjnej rodziny kupieckiej).\n\nJeśli spisek zakończy się niepowodzeniem lub zostanie z jakiegokolwiek powodu porzucony, to kontrakt patronacki również zakończy się niepowodzeniem."
 game_concept_patron_contract_scheme: "Spisek dotyczący kontraktu patronackiego"
 game_concept_patron_contract_schemes: "Spiski dotyczące kontraktu patronackiego"
 game_concept_patron_contract_scheme_possessive: "Spisku dotyczącego kontraktu patronackiego"
 game_concept_patron_contract_schemes_possessive: "Spisków dotyczących kontraktu patronackiego"
 game_concept_patron_contract_scheme_patron_contract: "Kontrakt patronacki"
 game_concept_patron_scheme: "Spisek patronacki"
 game_concept_patron_schemes: "Spiski patronackie"
 game_concept_patron_scheme_possessive: "Spisku patronackiego"
 game_concept_patron_schemes_possessive: "Spisków patronackich"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "Kontrakt w sprawie wartości"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "Kontrakty w sprawie wartości"
 game_concept_unity_contract_possessive: "Kontraktu w sprawie wartości"
 game_concept_unity_contracts_possessive: "Kontraktów w sprawie wartości"
 game_concept_unity_contract_desc: "$game_concept_unity_contracts$ powstają, gdy [company_sentiment|El] [merchant_possessive|El] są na niskim poziomie, tworząc problem, który należy rozwiązać."
 game_concept_domicile_artifact: "Artefakt domowy"
 game_concept_domicile_artifacts: "Artefakty domowe"
 game_concept_domicile_artifact_desc: "$game_concept_domicile_artifact$ to [artifact|El] wystawiany w [Concept('company', 'kompanii')|E] [merchant_possessive|El] – są to np. [curios|El] i [creatures|El].\n\nArtefakty domowe kupca są głównym źródłem pasywnego przyrostu punktów [Concept('prestige', 'prestiżu')|E].\n\n[character|E] może mieć dowolną liczbę artefaktów, lecz ich efekty mają zastosowanie wyłącznie, gdy artefakty te są wystawione w wyznaczonym dla nich miejscu.\n\n$game_concept_merchants$ mogą pozyskiwać artefakty domowe, pomyślnie realizując [luxury_contracts|El]."
 game_concept_menagerie: "Menażeria"
 game_concept_menagerie_creature: "Stworzenie w menażerii"
 game_concept_menagerie_creatures: "Stworzenia w menażerii"
 game_concept_creature: "Stworzenie"
 game_concept_creatures: "Stworzenia"
 game_concept_creature_desc: "$game_concept_creature$ to żywe zwierzę pozyskiwane przez [Concept('merchants', 'kupców')|E] w momencie realizacji [Concept('luxury_contracts', 'kontraktów na towary i usługi luksusowe')|E]. \n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "Unikat"
 game_concept_curios: "Unikaty"
 game_concept_curio_desc: "$game_concept_curio$ to rzadki rodzaj [Concept('artifact', 'artefaktu')|E] pozyskiwany przez [Concept('merchants', 'kupców')|E] w momencie realizacji [Concept('luxury_contracts', 'kontraktów na towary i usługi luksusowe')|E].\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "Można je wystawić jako [domicile_artifact|El] w [Concept('company', 'kompanii')|E], aby zapewnić sobie stały przypływ punktów [Concept('prestige', 'prestiżu')|E]."
 game_concept_guelph_ghibelline_precursor_situation: "$game_concept_guelph_ghibelline_situation$ – wprowadzenie"
 game_concept_guelph_ghibelline_precursor_situation_desc: "Wprowadzenie do [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]” to zbiór wydarzeń, które pogłębiają konflikt pomiędzy Świętym Cesarstwem Rzymskim a papiestwem.\n\n#F Wszystko zaczęło się od ponownego wprowadzenia przez papieża zasady [Glossary( 'In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS' )], zgodnie z którą ówczesny papież ogłosił, że szlachta nie powinna brać udziału w wyborach papieskich, a decyzję powinni podejmować wyłącznie kardynałowie zgromadzeni w Rzymie.\n\nW późniejszym okresie, w momencie opublikowania dokumentu [Glossary( 'Dictatus papae', 'DICTATUS_PAPAE_GLOSS' )] i w trakcie sporu o inwestyturę, papież ogłosił, że władza papieska, którą powierzył mu Bóg, ma charakter powszechny i że tylko on ma prawo mianować lub odwoływać duchownych. Negatywnie postrzegano biskupów, którzy przyjmowali świeckie symbole swojego urzędu."
 game_concept_guelph_ghibelline_situation: "Gwelfowie i gibelini"
 game_concept_guelph_ghibelline_situation_desc: "Sytuacja, która wywołała konflikt pomiędzy papieżem ([guelphs|El]) a Świętym Cesarstwem Rzymskim ([ghibellines|El]).\n\nZ biegiem czasu stało się to kwestią lokalną – chodziło o to, czy władcy północnych Włoch pragnęli większego zaangażowania ze strony Cesarstwa, czy też woleli zachować swoją niezależność."
 game_concept_gg_involvement: "Zaangażowanie"
 game_concept_gg_involvement_desc: "$game_concept_gg_involvement$ [Concept('ruler', 'władcy')|E] w [Concept('situation', 'sytuację')|E] „[guelph_ghibelline_situation|E]” wskazuje, w jakim stopniu dana postać wpłynęła na przebieg wydarzeń. Osiąga się to głównie poprzez podejmowanie działań przeciwko drugiej stronie.\n\nDziałania te obejmują:\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[interactions|E] dotyczące [Concept('imprison', 'więzienia')|E], [Concept('torture', 'torturowania')|E] i [Concept('execution', 'egzekucji')|E]\n$BULLET_WITH_TAB$[scheme|E] „[GetScheme('gg_switch_sides').GetTypeName]”, [Concept('interaction', 'interakcję')|E] „$gg_recruit_partisan_interaction|V$”, [casus_belli|El] „[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]”, itd.\n$BULLET_WITH_TAB$Aktywowanie [Concept('situation_catalysts', 'katalizatorów sytuacji')|E]\n\nW rezultacie zaangażowanie:\n$BULLET_WITH_TAB$Nakłada skalujący się [modifier|El] „[GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip]” za każdy wzrost o wartości #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#!\n$BULLET_WITH_TAB$Działa jak czynnik zwielokrotniający nagrody, jeśli to twoja strona zakończy sytuację.\n\n#F W trakcie sytuacji „[guelph_ghibelline_precursor_situation|E]” nie można jeszcze zyskiwać zaangażowania, a jego wartość rośnie wolniej aż do pełnego wybuchu konfliktu.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "Gwelf"
 game_concept_guelphs: "Gwelfowie"
 game_concept_guelph_desc: "Gwelfowie to strona [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]” orędująca za uniezależnieniem się od Świętego Cesarstwa Rzymskiego, a co za tym idzie, za suwerennością boską.\n\n#F Nazwa „gwelfowie” wywodzi się od rodu Welfów, historycznych książąt Bawarii, i uległa zmianie w wyniku przekazów ustnych oraz ewolucji wymowy.#!"
 game_concept_ghibelline: "Gibelin"
 game_concept_ghibellines: "Gibelini"
 game_concept_ghibelline_desc: "Gibelini to strona [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]” opowiadająca się za zwiększeniem wpływów i kontroli Świętego Cesarstwa Rzymskiego nad wtrącającymi się do jego spraw państwami-miastami północnych Włoch.\n\n#F Nazwa „gibelini” wywodzi się od okrzyku bojowego rodu Hohenstaufenów, nawiązującego do zamku Wibellingen podczas oblężenia Weinsbergu.#!"
 game_concept_lombard_league: "Liga Lombardzka"
 game_concept_lombard_league_desc: "Liga utworzona przez miasta północnych Włoch, sprzeciwiająca się rosnącym dążeniom do centralizacji ze strony Świętego Cesarstwa Rzymskiego."
 game_concept_confederation_cohesion: "Spójność konfederacji"
 game_concept_cohesion: "Spójność"
 game_concept_confederation_cohesion_desc: "$game_concept_cohesion$ określa, jak mocno zespolona jest [confederation|El], i może przyjąć wartości od #V 0#! do #V 100#!. Każdy członek wnosi do niej miesięczny wkład (pozytywny lub negatywny), a zyski maleją przy wysokiej spójności.\n\nKażdy kolejny poziom zapewnia członkom coraz większe korzyści. Czynniki generujące spójność, a także nagrody za kolejne poziomy, zależą od rodzaju konfederacji.\n\nKonfederacje wykorzystują następujące rodzaje spójności:\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "Liga handlowa"
 game_concept_trade_league_desc: "$game_concept_trade_league$ to [confederation|El] [Concept('republics', 'republik')|E], którą mogą tworzyć lub do której mogą dołączać [rulers|El] republikańscy, aby czerpać wspólne korzyści handlowe oraz obronne.\n\nJeden z członków dzierży [leading_title|El] i pełni funkcję [Concept('trade_league_leader', 'przywódcy ligi handlowej')|E] – jest to jedyna osoba, która może zapraszać innych do ligi lub ich z niej usuwać – natomiast pozostałym przysługuje [member_title|El].\n\nKorzyści dla członków rosną wraz z pogłębianiem się [Concept('league_cohesion', 'spójności ligi')|E]."
 game_concept_trade_leagues: "Ligi handlowe"
 game_concept_trade_league_short: "Liga"
 game_concept_league_cohesion: "Spójność ligi"
 game_concept_league_cohesion_desc: "$game_concept_cohesion$ określa poziom jedności [Concept('trade_league', 'ligi handlowej')|E], a każdy jej poziom zapewnia członkom coraz większe korzyści [Concept('trade', 'handlowe')|E]. Poniżej #V 20#! poziomu liga jest zbyt mało spójna, aby jej członkowie dołączali do [Concept('wars', 'wojen')|E] innych członków lub składali prośby o [trade_monopolies|El].\n\nCzłonkowie generują spójność na podstawie swojego [Concept('title_tier', 'poziomu')|E], [Concept('capital', 'stolicy')|E] oraz [Concept('opinion', 'opinii')|E] o [Concept('trade_league_leader', 'przywódcy ligi handlowej')|E]. Posiadane monopole zapewniają więcej spójności, natomiast niedobór lub nadmiar [Concept('trade_league_members_short', 'członków')|E] skutkują jej utratą."
 game_concept_trade_league_leader: "Przywódca ligi handlowej"
 game_concept_trade_league_leader_desc: "Przywódca ligi handlowej jest oficjalną głową [Concept('trade_league', 'ligi handlowej')|E].\n\nPrzywódca jest jedynym [Concept('trade_league_member_short', 'członkiem')|E] ligi handlowej, który może zapraszać nowych członków lub usuwać obecnych. Pierwszym przywódcą ligi zostaje jej założyciel. Członkowie mogą później wysuwać roszczenia o przywództwo. W przypadku opuszczenia ligi przez przywódcę jego następcą zostaje inny jej członek wybierany na podstawie jego [Concept('title_tier', 'poziomu')|E], [Concept('settlement_size', 'wielkości osady')|E] w [Concept('capital', 'stolicy')|E] oraz [Concept('prestige', 'prestiżu')|E]."
 game_concept_trade_league_leader_short: "Przywódca"
 game_concept_trade_league_member: "Członek ligi handlowej"
 game_concept_trade_league_members: "Członkowie ligi handlowej"
 game_concept_trade_league_member_short: "Członek"
 game_concept_trade_league_members_short: "Członkowie"
 game_concept_trade_league_member_desc: "Członek [Concept('trade_league', 'ligi handlowej')|E] należy do niej, gdy jest właścicielem [Concept('member_title', 'tytułu członkowskiego')|E]. Tytuły członkowskie stanowią [Concept('primary_title', 'tytuły główne')|E] [Concept('republics', 'republik')|E] wchodzących w skład ligi.\n\nJeden z członków jest posiadaczem [Concept('leading_title', 'tytułu przewodzącego')|E] i pełni funkcję [Concept('trade_league_leader', 'przywódcy ligi handlowej')|E]."
 game_concept_league_focus: "Priorytet ligi"
 game_concept_league_focuses: "Priorytety ligi"
 game_concept_league_focus_desc: "$game_concept_league_focus$ to [trade_category|El] wybrana przez [Concept('trade_league_leader', 'przywódcę')|E] [Concept('trade_league', 'ligi handlowej')|E]. [holder|E] każdego [Concept('member_title', 'tytułu członkowskiego')|E] zyskuje premie do [Concept('trade_expertise', 'doświadczenia handlowego')|E], [Concept('production', 'produkcji')|E] oraz [Concept('sell_price', 'ceny sprzedaży')|E] w tej kategorii."
 game_concept_patrician: "Patrycjusz"
 game_concept_patricians: "Patrycjusze"
 game_concept_patrician_possessive: "Patrycjusza"
 game_concept_patrician_desc: "Patrycjusz to [house_head|El] wiodącej rodziny [Concept('merchant', 'kupieckiej')|E] w [Concept('republic', 'republice')|E]."
 game_concept_patrician_family: "Rodzina patrycjuszowska"
 game_concept_patrician_families: "Rodziny patrycjuszowskie"
 game_concept_patrician_family_short: "Rodzina"
 game_concept_patrician_family_desc: "$game_concept_patrician_family$ to [merchant_family|El] będąca częścią [Concept('republic', 'republiki')|E]. Jest to szlachetna elita posiadająca władzę i wpływy w republice oraz wykorzystująca [consortery|El] jako swoją [Concept('domicile', 'siedzibę')|E].\n\nRepublika o [Concept('title_tier', 'poziomie')|E] [Concept('county', 'hrabstwa')|E] może mieć tylko jedn ród patrycjuszowski, podczas gdy republiki wyższego poziomu mogą, a wręcz powinny, mieć ich więcej."
 game_concept_patrician_rating: "Wskaźnik arystokratyczny"
 game_concept_patrician_rating_short: "Wskaźnik"
 game_concept_patrician_rating_desc: "[patrician_family|E] ma określony wskaźnik arystokratyczny, który odzwierciedla, jak ważną i wpływową rolę odgrywa ta rodzina i jej [patrician|El] w ramach [Concept('republic', 'republiki')|E].\n\nWysoki wskaźnik zapewnia patrycjuszowi i jego [Concept('house', 'rodowi')|E] premie podzielone na trzy odrębne poziomy. Każdy poziom odblokowuje dodatkowe korzyści, takie jak:\n$BULLET_WITH_TAB$Zwiększona [house_ambition|El]\n$BULLET_WITH_TAB$Zwiększona akceptacja przy [Concept('interactions', 'interakcjach')|E]\n$BULLET_WITH_TAB$Zwiększone [governor_salary|El]\n\nIstnieje wiele sposobów na podniesienie tego wskaźnika. Kluczowe czynniki, które na niego wpływają, to:\n$BULLET_WITH_TAB$Dochód [patrician_possessive|El] z [Concept('trade', 'handlu')|E]\n$BULLET_WITH_TAB$Sprawowanie władzy nad [Concept('republic', 'republiką')|E]\n$BULLET_WITH_TAB$Zajmowanie miejsc na [Concept('assembly', 'zgromadzeniu')|E] oraz w [Concept('council', 'radzie')|E] [liege_possessive|El][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$Członkowie [Concept('house', 'rodu')|E] posiadający [clerical_region|El]\n$BULLET_WITH_TAB$Posiadanie [Concept('modifier', 'modyfikatora')|E] „[GetModifier('favored_by_pope_modifier').GetNameWithTooltip]”"
 game_concept_patrician_rating_penalties_PAM: "Wskaźnik maleje, gdy patrycjusz jest [Concept('excommunicated', 'ekskomunikowany')|E], jest znanym [Concept('criminal', 'przestępcą')|E] lub gdy ma modyfikator „[GetModifier('scorned_pope_modifier').GetNameWithTooltip]”."
 game_concept_patrician_rating_penalties_NO_PAM: "Wskaźnik maleje, gdy patrycjusz jest [Concept('excommunicated', 'ekskomunikowany')|E] lub jest znanym [Concept('criminal', 'przestępcą')|E]."
 game_concept_consortery: "Konsorcjum patrycjuszowskie"
 game_concept_consorteries: "Konsorcja patrycjuszowskie"
 game_concept_consortery_possessive: "Konsorcjum patrycjuszowskiego"
 game_concept_consortery_desc: "$game_concept_consortery$ to miejsce zamieszkania i [domicile|El] [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E]. Zazwyczaj znajduje się ono w [Concept('capital', 'stolicy')|E] jej [liege_possessive|El].\n\nPodobnie jak w przypadku [Concept('trade_companies', 'kompanii handlowych')|E] [merchant_possessive|E] konsorcjum patrycjuszowskie wykorzystuje [company_buildings|El] jako [domicile_buildings|El], aby wzmocnić potęgę i konkurencyjność rodu w dziedzinie handlu.\n\nKonsorcjum patrycjuszowskie dziedziczy się wraz z tytułem [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E]."
 game_concept_assembly: "Zgromadzenie"
 game_concept_assembly_possessive: "Zgromadzenia"
 game_concept_assembly_desc: "Zgromadzenie jest organem zarządzającym [Concept('realm', 'państwem')|E].\n\nobowiązki zgromadzenia są określane przez [laws|El] i zalicza się do nich głosowanie nad prawami, [Concept('republic_decrees', 'dekretami republiki')|E] i zatwierdzanie ich lub głosowanie na kandydatów w niektórych formach [Concept('succession', 'sukcesji')|E] z wyboru, takich jak „[GetLaw('republican_elective_succession_law').GetName]”."
 game_concept_republic_senate: "Senat"
 game_concept_republic_senate_possessive: "Senatu"
 game_concept_voting_session: "Głosowanie"
 game_concept_voting_sessions: "Sesje głosowania"
 game_concept_voting_session_desc: "$game_concept_voting_session$ to proces, w ramach którego [assembly|El] podejmuje decyzję w sprawie proponowanego [Concept('law', 'prawa')|E] lub [Concept('republic_decree', 'dekretu republiki')|E].\n\nW trakcie sesji jej uczestnicy głosują za propozycją lub przeciw niej zgodnie ze swoim wskaźnikiem aprobaty. Jeśli przed zakończeniem sesji wystarczająca liczba uczestników poprze projekt, zostaje on przyjęty i wchodzi w życie.\n\nWskaźnik aprobaty można zwiększyć przed sesją za sprawą [Concept('councillor_task', 'zadania radnego')|E] lub dzięki niektórym [Concept('perks', 'atrybutom')|E]. Można też wykorzystać [Concept('hook', 'haka')|E], aby zmusić uczestnika zgromadzenia do głosowania zgodnie z twoją wolą."
 game_concept_republic_decree: "Dekret republiki"
 game_concept_republic_decrees: "Dekrety republiki"
 game_concept_republic_decree_short: "Dekret"
 game_concept_republic_decrees_short: "Dekrety"
 game_concept_republic_decree_desc: "$game_concept_republic_decree$ to rodzaj [Concept('decision', 'decyzji')|E] podejmowanej przez [Concept('republic', 'republikę')|E], który musi zostać zatwierdzony przez [assembly|El].\n\nChoć istnieje kilka rodzajów dekretów, najczęściej dotyczą one [Concept('patricians', 'patrycjuszy')|E], [Concept('realm_capital', 'stolicy państwa')|E] lub całej republiki."
 game_concept_house_ambition: "Ambicja rodu"
 game_concept_house_ambitions: "Ambicje rodu"
 game_concept_house_ambition_desc: "Każdy [house|El] w [Concept('republic', 'republice')|E] ma ambicję, która wskazuje, w jaki sposób jego członkowie chcą wpływać na losy republiki."
 game_concept_republic_administration: "Administracja republikańska"
 game_concept_republic_administration_short: "Administracja"
 game_concept_republic_administrations: "Administracje republikańskie"
 game_concept_republic_administration_desc: "Wszystkie [republics|El] posiadają wyznaczoną administrację republikańską, która określa specjalizację republiki.\n\nAdministrację może zmienić tylko [ruler|El] republiki.\n\nIstnieje kilka rodzajów administracji, które można wybrać. Każda z nich daje wyjątkowe korzyści.\n\n#help Najczęściej spotykane administracje to administracja „[GetLaw( 'republic_type_communal' ).GetName]”, administracja „[GetLaw( 'republic_type_maritime' ).GetName]” i administracja „[GetLaw( 'republic_type_civic' ).GetName]”.#!"
 game_concept_republic_senator: "Senator"
 game_concept_republic_senators: "Senatorowie"
 game_concept_republic_senator_desc: "$game_concept_republic_senator$ to mianowany członek [Concept('assembly', 'zgromadzenia')|E] wykorzystującego prawo „[GetLaw( 'republic_assembly_composition_roman_senate' ).GetName]”.\n\nSenatorowie są mianowani przez [Concept('ruler', 'władcę')|E] [republic_possessive|El] lub przez cenzora.\n\nW danym momencie mianowanych może być ograniczona liczba senatorów, która zależy od [Concept('law', 'prawa')|E] „Rozmiar senatu”."
 game_concept_mercenary_limit: "Limit najemników"
 game_concept_mercenary_limit_desc: "Limit najemników określa, ilu [Concept('mercenaries', 'najemników')|E] [character|El] może zatrudnić jednocześnie.\n\nNa limit najemników wpływ mają następujące czynniki:\n$BULLET_WITH_TAB$[martial_i] [skill|E] [Concept('martial', 'walki')|E]\n$BULLET_WITH_TAB$[title_tier_i] [title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
 # No tooltip versions
 tributary_default_no_tooltip: "Trybutariusz"
 tributary_default_no_tooltip_plural: "Trybutariusze"
 merchant_tributary_client_no_tooltip: "Klient"
 merchant_tributary_client_no_tooltip_plural: "Klienci"
 suzerain_default_no_tooltip: "Suzeren"
 suzerain_default_no_tooltip_plural: "Suzereni"
 merchant_tributary_patron_no_tooltip: "Patron"
 merchant_tributary_patron_no_tooltip_plural: "Patroni"
 # Lowercase versions
 tributary_default_no_tooltip_lowercase: "trybutariusz"
 tributary_default_no_tooltip_lowercase_plural: "trybutariusze"
 tributary_default_no_tooltip_lowercase_plural_possessive: "trybutariuszy"
 merchant_tributary_client_no_tooltip_lowercase: "klient"
 merchant_tributary_client_no_tooltip_lowercase_plural: "klienci"
 merchant_tributary_client_no_tooltip_lowercase_plural_possessive: "klientów"
 suzerain_default_no_tooltip_lowercase: "suzeren"
 suzerain_default_no_tooltip_lowercase_plural: "suzereni"
 suzerain_default_no_tooltip_lowercase_plural_possessive: "suzerenów"
 merchant_tributary_patron_no_tooltip_lowercase: "patron"
 merchant_tributary_patron_no_tooltip_lowercase_plural: "patroni"
 merchant_tributary_patron_no_tooltip_lowercase_plural_possessive: "patronów"
 # Game Concept Versions
 merchant_tributary_patron: "[merchant_patron|E]"
 merchant_tributary_patron_plural: "[merchant_patrons|E]"
 merchant_tributary_client: "[client|E]"
 merchant_tributary_client_plural: "[clients|E]"
 tributary_default: "[tributary|E]"
 tributary_default_plural: "[tributaries|E]"
 suzerain_default: "[suzerain|E]"
 suzerain_default_plural: "[suzerains|E]"
 game_concept_merchant_charter: "Koncesja kupiecka"
 game_concept_merchant_charters: "Koncesje kupieckie"
 game_concept_charter: "Koncesja"
 game_concept_charters: "Koncesje"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "$game_concept_charter$ to będący dokumentem [artifact|El] wydawany przez [Concept('merchant_patron', 'patrona')|E] jednemu z jego [Concept('clients', 'klientów')|E].\n\n$game_concept_merchants$ posiadający artefakty w postaci koncesji opatrzonej pieczęcią swojego patrona mają dostęp do:\n$EFFECT_LIST_BULLET$[Concept('decision', 'Decyzji')|E] #EMP #V „$abuse_charter_authority_decision$#!#!”\n$EFFECT_LIST_BULLET$[Concept('decision', 'Decyzji')|E] #EMP #V „$benevolent_charter_authority_decision$#!#!”\n$EFFECT_LIST_BULLET$[Concept('interaction', 'Interakcji')|E] #EMP #V „$leverage_charter_authority_interaction$#!#!”"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "„$game_concept_make_a_request$” to [interaction|El] wykorzystywana do zwracania się do [Concept('merchant_patron', 'patrona')|E] z prośbą o przysługi, wsparcie finansowe lub inną formę pomocy."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "„$game_concept_request_contract_change$” to [interaction|El] wykorzystywana przez [Concept('vassal', 'wasala')|E], [Concept('tributary', 'trybutariusza')|E] lub [Concept('client', 'klienta')|E] do renegocjowania swoich zobowiązań z [Concept('liege', 'seniorem')|E] lub [Concept('suzerain', 'suzerenem')|E]."
 game_concept_leading_title: "Tytuł przewodzący"
 game_concept_leading_title_desc: "[title|E], który stoi na czele konfederacji opartej na tytułach, takiej jak [trade_league|El].\n\n[holder|E] tytułu przewodzącego jest [Concept('trade_league_leader', 'przywódcą ligi handlowej')|E] danej konfederacji."
 game_concept_client_contract: "Kontrakt kliencki"
 game_concept_client_contracts: "Kontrakty klienckie"
 game_concept_client_contract_desc: "$game_concept_client_contracts$ regulują [obligations|El] między [Concept('client', 'klientem')|E] a jego [Concept('merchant_patron', 'patronem')|E].\n\nMożna negocjować cztery zobowiązania: część dochodu z [Concept('trade', 'handlu')|E] przekazywaną patronowi; wsparcie w postaci [Concept('prestige', 'prestiżu')|E] od patrona; wsparcie w [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E]; ułatwianie [Concept('marriages', 'małżeństw')|E] w imieniu rodziny kupieckiej.\n\nKontrakt jest dziedziczony podczas sukcesji i nie można go rozwiązać, dopóki kupiec nie przeniesie swojej [Concept('company', 'kompanii')|E] do nowej [Concept('holding', 'posiadłości')|E]."
 game_concept_member_title: "Tytuł członkowski"
 game_concept_member_title_desc: "[title|E], który jest członkiem konfederacji opartej na tytułach, takiej jak [trade_league|El]."
 game_concept_company_sentiment: "Wartości kompanii"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "Wartości"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "$game_concept_company_sentiment$ odzwierciedlają sposób działania [merchant_family_possessive|El] oraz wzajemne stosunki jej członków.\n\nIstnieje kilka [Concept('company_sentiment_levels', 'statusów wartości kompanii')|E], które zapewniają członkom [Concept('house', 'rodu')|E] różne korzyści i kary.\n\n$game_concept_company_sentiment$ zmieniają się w zależności od działań kompanii jako całości. [company_sentiment_positive_actions|E] zazwyczaj posuwają wartości kompanii w kierunku [company_sentiment_concerted_i] [Concept('company_sentiment_concerted', 'szlachetności')|E], natomiast [company_sentiment_negative_actions|El] popychają je ku [company_sentiment_divided_i] [Concept('company_sentiment_divided', 'zachłanności')|E].\n\n[house_heads|E] mają zazwyczaj większy wpływ na wartości swojego [Concept('house', 'rodu')|E] niż inni jego członkowie."
 game_concept_company_sentiment_level: "Status wartości kompanii"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "Statusy wartości kompanii"
 game_concept_company_sentiment_level_desc: "$game_concept_company_sentiment_level$ to obecny stan [Concept('company_sentiment', 'wartości kompanii')|E]. Aktywny status zmienia się, gdy wartości kompanii są posuwane w kierunku [company_sentiment_concerted_i] [company_sentiment_divided_i] [Concept('company_sentiment_concerted', 'szlachetności')|E] poprzez [company_sentiment_positive_actions|El] lub ku [Concept('company_sentiment_divided', 'zachłanności')|E] poprzez [company_sentiment_negative_actions|El], a każdy status zapewnia członkom [Concept('house', 'rodu')|E] różne korzyści i kary.\n\nIstnieje pięć statusów:\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i] [company_sentiment_divided|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i] [company_sentiment_fractious|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i] [company_sentiment_independent|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i] [company_sentiment_cooperative|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i] [company_sentiment_concerted|E]"
 game_concept_company_sentiment_divided: "Zachłanność"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "Oportunizm"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "Równowaga"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "Drapieżność"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "Szlachetność"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"
 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
