 game_concept_company_sentiment_divided_desc: "[company_sentiment_level|E] „$game_concept_company_sentiment_divided$” to status w największym stopniu sprzyjający rywalizacji. Gdy [company|El] go przyjmuje, każdy członek rodziny skupia się przede wszystkim na zysku, nawet jeśli wiąże się to ze wzajemnym wchodzeniem sobie w drogę.\n\n#bold Efekty tego statusu wartości kompanii:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$Opinia [Concept('merchant_patron', 'patrona')|E]: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i] [competitiveness|E]: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_regional_networks_decision$”#!#!"
 game_concept_company_sentiment_fractious_desc: "[company_sentiment_level|E] „$game_concept_company_sentiment_fractious$” to bardzo konkurencyjny status, który pod tym względem ustępuje tylko [Concept('rapacious', 'zachłanności')|E]. Gdy [company|El] go przyjmuje, członkowie stawiają osobiste interesy przed obowiązkami rodzinnymi.\n\n#bold Efekty tego [Concept('company_sentiment_level', 'statusu wartości kompanii')|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i] [competitiveness|E]: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_establish_network_decision$”#!#!"
 game_concept_company_sentiment_independent_desc: "[company_sentiment_level|E] „$game_concept_company_sentiment_independent$” to pośredni status. Gdy [company|El] go przyjmuje, rodzina wciąż potrzebuje przywódcy, ale członkowie kompanii mogą prowadzić własne sprawy bez żadnych ingerencji czy osądzania.\n\n#bold Efekty tego [Concept('company_sentiment_level', 'statusu wartości kompanii')|E]:#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_consult_house_decision$”#!#!"
 game_concept_company_sentiment_cooperative_desc: "[company_sentiment_level|E] „$game_concept_company_sentiment_cooperative$” to status silnie skupiony na legitymacji, który pod tym względem ustępuje tylko [Concept('ennobled', 'szlachetności')|E]. Gdy [company|El] go przyjmuje, reputacja jej oraz wszystkich jej członków stają się jednym i tym samym, a każdy członek musi dążyć do poprawy zarówno swojego wizerunku, jak i statusu społecznego.\n\n#bold Efekty tego [Concept('company_sentiment_level', 'statusu wartości kompanii')|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$: #P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_merchant_prosperity_decision$”#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_merchant_bailiffs_decision$”#!#!"
 game_concept_company_sentiment_concerted_desc: "[company_sentiment_level|E] „$game_concept_company_sentiment_concerted$” to status najbardziej skupiony na legitymacji. Gdy [company|El] go przyjmuje, lojalność wynikająca z obowiązku i szacunku wiąże interesy całej organizacji z interesami jej głowy, a kompania może stanąć na równi z rodami szlacheckimi.\n\n#bold Efekty tego [Concept('company_sentiment_level', 'statusu wartości kompanii')|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_family_business_decision$”#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_merchant_prosperity_decision$”#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V „$unity_merchant_bailiffs_decision$”#!#!"
 game_concept_company_sentiment_positive_actions: "Działania legitymizujące"
 game_concept_company_sentiment_positive_actions_desc: "Działania legitymizujące twojej [Concept('company', 'kompanii')|E] popychają [company_sentiment|El] w kierunku [company_sentiment_concerted_i] [Concept('company_sentiment_concerted', 'szlachetności')|E].\n\n[house_heads|E] mogą użyć [Concept('decision', 'decyzji')|E] #V „$unity_merchant_promote_excess_decision$”#!, aby znacząco przesunąć [company_sentiment|El] ku [company_sentiment_concerted_i] [Concept('company_sentiment_concerted', 'szlachetności')|E].\n\n#weak Oto kilka przykładów działań legitymizujących:$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "Działania ukierunkowane na zysk"
 game_concept_company_sentiment_negative_actions_desc: "Działania twojej [Concept('company', 'kompanii')|E] ukierunkowane na zysk popychają [company_sentiment|El] w kierunku [company_sentiment_divided_i] [Concept('company_sentiment_divided', 'zachłanności')|E].\n\n[house_heads|E] mogą użyć [Concept('decision', 'decyzji')|E] #V „$unity_merchant_promote_diligence_decision$”#!, aby znacząco przesunąć [company_sentiment|El] ku [company_sentiment_divided_i] [Concept('company_sentiment_divided', 'zachłanności')|E].\n\n#weak Oto kilka przykładów działań ukierunkowanych na zysk:$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ Interakcja „$arrange_marriage_interaction$” między rodem a szlachtą\n$EFFECT_LIST_BULLET$ Interakcja „$gift_artifact_interaction$”\n$EFFECT_LIST_BULLET$ Spełnienie prośby partnera\n$EFFECT_LIST_BULLET$ Interakcja „$pay_ransom_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$offer_guardianship_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$restore_inheritance_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$abandon_hook_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$fund_inspiration_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$propose_best_friendship_interaction$”"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ Interakcja „$arrange_marriage_interaction$” z innym rodem kupieckim\n$EFFECT_LIST_BULLET$ Zaproszenie do kompanii\n$EFFECT_LIST_BULLET$ Niewykonanie prośby partnera\n$EFFECT_LIST_BULLET$ Interakcja „$merchant_adopt_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$declare_war_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$imprison_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$move_to_dungeon_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$disinherit_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$denounce_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$expose_secret_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$blackmail_interaction$”\n$EFFECT_LIST_BULLET$ Interakcja „$break_betrothal_interaction$”"
 game_concept_republican_army: "Armia republikańska"
 game_concept_republican_armies: "Armie republikańskie"
 game_concept_republican_army_desc: "$game_concept_republican_army$ to [army|El] werbowana i utrzymywana przez [realm|El] z [Concept('government', 'rządem')|E] [Concept('republican', 'republikańskim')|E].\n\nSkłada się ona wyłącznie ze [Concept('title_men_at_arms', 'zbrojnych tytułu')|E], a kontrolę nad nią sprawuje osoba piastująca urząd [Concept('liege', 'seniora')|E]."
