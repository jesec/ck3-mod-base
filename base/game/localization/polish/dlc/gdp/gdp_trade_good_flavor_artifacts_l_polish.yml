l_polish:
 gdp_tgf_coin_artifact: "Pierwsza moneta osoby znanej jako [tgf_market_holder.GetFirstNameNoTooltip]"
 gdp_tgf_coin_artifact_desc: "Z jednej strony twarz osoby znanej jako [tgf_market_holder.GetFirstName], a na pierścieniu, wybity literami na tyle małymi, że przeczyta je wyłącznie kupiec, napis: [tgf_good.Custom('GetTradeGood')] z magazynów, którymi zarządza [tgf_coin_merchant.GetFirstName]."
 gdp_tgf_smith_weapon_axe: "Siekiera osoby znanej jako [tgf_smith_patron.GetFirstNameNoTooltip] z materiału o nazwie [tgf_good.Custom('GetTradeGood')]"
 gdp_tgf_smith_weapon_dagger: "Sztylet osoby znanej jako [tgf_smith_patron.GetFirstNameNoTooltip] z materiału o nazwie [tgf_good.Custom('GetTradeGood')]"
 gdp_tgf_smith_weapon_hammer: "Młot osoby znanej jako [tgf_smith_patron.GetFirstNameNoTooltip] z materiału o nazwie [tgf_good.Custom('GetTradeGood')]"
 gdp_tgf_smith_weapon_mace: "Buzdygan osoby znanej jako [tgf_smith_patron.GetFirstNameNoTooltip] z materiału o nazwie [tgf_good.Custom('GetTradeGood')]"
 gdp_tgf_smith_weapon_spear: "Włócznia osoby znanej jako [tgf_smith_patron.GetFirstNameNoTooltip] z materiału o nazwie [tgf_good.Custom('GetTradeGood')]"
 gdp_tgf_smith_weapon_sword: "Miecz osoby znanej jako [tgf_smith_patron.GetFirstNameNoTooltip] z materiału o nazwie [tgf_good.Custom('GetTradeGood')]"
 gdp_tgf_smith_weapon_desc: "Broń wykuta przez osobę o imieniu [tgf_smith.GetFirstName] z miejsca o nazwie [tgf_source_county.GetNameNoTier], z najlepszej sztaby, którą kiedykolwiek kupiła osoba znana jako [tgf_smith_patron.GetFirstName]. Warta dziesięciokrotnej ceny metalu, a przynajmniej tak twierdzi kowal."
 gdp_tgf_reading_stones_artifact_merchant: "Kamienie do czytania osoby znanej jako [tgf_lens_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_reading_stones_artifact_lord: "Kamienie do czytania osoby znanej jako [tgf_market_holder.GetFirstNameNoTooltip]"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "Dwie soczewki z przezroczystego szkła, oszlifowane przez osobę o imieniu [tgf_glassmaker.GetFirstName] z miejsca o nazwie [tgf_source_county.GetNameNoTier]. Seneka pisał, że w szklanej kuli wypełnionej wodą litery stają się większe. Dzięki tym soczewkom drobny druk w każdej umowie staje się wyraźny."
 gdp_tgf_showpiece_artifact: "Gablota osoby znanej jako [tgf_showpiece_merchant.GetFirstNameNoTooltip] ([tgf_good.GetNameNoTooltip|l])"
 gdp_tgf_showpiece_artifact_desc: "Wykonał ją doświadczony [tgf_good.Custom('GetTgfGoodCrafter')], [tgf_crafter.GetFirstName], a najlepszej jakości [tgf_good.Custom('GetTradeGood')] osoby o imieniu [tgf_showpiece_merchant.GetFirstName] to coś, co znajduje się w każdej szufladzie. Jest otwarta dla nabywców i zamknięta dla wszystkich pozostałych."
 gdp_tgf_curio_grain: "Snop drogocennego zboża"
 gdp_tgf_curio_grain_desc: "Zebrany z najlepszego pola w bardzo dobrym roku."
 gdp_tgf_curio_millet: "Słój starego prosa"
 gdp_tgf_curio_millet_desc: "Ma już swoje lata, a jest jak nowe. Proso dobrze się przechowuje."
 gdp_tgf_curio_rice: "Miska białego ryżu"
 gdp_tgf_curio_rice_desc: "Łuskany i wypolerowany – zbyt piękny, by go zjeść."
 gdp_tgf_curio_meat: "Idealnie solony kawałek"
 gdp_tgf_curio_meat_desc: "Tak dobrze zasolony, że może przetrwać swojego właściciela."
 gdp_tgf_curio_fish: "Ususzona, oprawiona ryba"
 gdp_tgf_curio_fish_desc: "Sztywna jak deska i dwa razy bardziej dostojna."
 gdp_tgf_curio_cheese: "Krąg dojrzałego sera"
 gdp_tgf_curio_cheese_desc: "Prasowany w czasie lata, którego nikt już nie pamięta."
 gdp_tgf_curio_fruit: "Słój owocowych przetworów"
 gdp_tgf_curio_fruit_desc: "Kandyzowane, szczelnie zamknięte i zachowane na dzień, który będzie na nie zasługiwał."
 gdp_tgf_curio_oil: "Butelka oleju z pierwszego tłoczenia"
 gdp_tgf_curio_oil_desc: "Zielonozłoty, z pierwszego w roku tłoczenia."
 gdp_tgf_curio_honey: "Zapieczętowany garnek z miodem"
 gdp_tgf_curio_honey_desc: "Ciemny niczym bursztyn. Starszy niż niejeden rocznik wina."
 gdp_tgf_curio_tea: "Cegiełka prasowanej herbaty"
 gdp_tgf_curio_tea_desc: "Warta tyle, ile waży – a przebyła długą drogę od ogrodu, w którym powstała."
 gdp_tgf_curio_horses: "Podkowa czempiona"
 gdp_tgf_curio_horses_desc: "Należała do konia, który nigdy nie przegrał wyścigu – a przynajmniej tak zarzekał się sprzedawca."
 gdp_tgf_curio_cattle: "Wypolerowany róg bydlęcy"
 gdp_tgf_curio_cattle_desc: "Wypolerowany na wysoki połysk. Świetnie sprawdza się podczas uczt."
 gdp_tgf_curio_silver: "Nieskazitelna srebrna sztabka"
 gdp_tgf_curio_silver_desc: "Na tyle czysta, że paznokieć zostawi na niej ślad – lecz nikt się nie ośmieli."
 gdp_tgf_curio_gold: "Samorodek rzecznego złota"
 gdp_tgf_curio_gold_desc: "Wypłukany z rzeki, której nazwy nikt nie chce zdradzić."
 gdp_tgf_curio_iron: "Doskonały kawałek żelaza"
 gdp_tgf_curio_iron_desc: "Gęsty, ciemny i pozbawiony choćby jednej skazy."
 gdp_tgf_curio_copper: "Lśniący miedziany krążek"
 gdp_tgf_curio_copper_desc: "Odlany w kopalni, jasny niczym w dniu, w którym wystygł."
 gdp_tgf_curio_beer: "Rzeźbiony kufel"
 gdp_tgf_curio_beer_desc: "Mieści dokładnie jedną pintę. Rzadko jednak się z niego pije."
 gdp_tgf_curio_wine: "Wino z legendarnego rocznika"
 gdp_tgf_curio_wine_desc: "Butelka z roku, o którym winiarze wciąż szepczą."
 gdp_tgf_curio_gems: "Nieoszlifowany kamień szlachetny"
 gdp_tgf_curio_gems_desc: "Szorstki niczym żwir, a wart tyle, co cała wioska."
 gdp_tgf_curio_amber: "Bryłka bursztynu"
 gdp_tgf_curio_amber_desc: "Miodowa, z muchą na zawsze uwięzioną w środku."
 gdp_tgf_curio_ivory: "Wyrzeźbiony odłamek kości słoniowej"
 gdp_tgf_curio_ivory_desc: "Czubek ciosu, wyrzeźbiony przez osobę niezwykle cierpliwą."
 gdp_tgf_curio_jade: "Rzeczny otoczak z jadeitu"
 gdp_tgf_curio_jade_desc: "Chłodny w dotyku, jak to zawsze bywa w przypadku prawdziwego jadeitu."
 gdp_tgf_curio_wood: "Sęk w drewnie o ozdobnym usłojeniu"
 gdp_tgf_curio_wood_desc: "Wzory przypominają płynącą wodę. Rzeźbiarze co roku biją się o niego."
 gdp_tgf_curio_hemp: "Idealny zwój liny"
 gdp_tgf_curio_hemp_desc: "Lina tak równa, że wygląda, jakby była narysowana."
 gdp_tgf_curio_wool: "Złote runo"
 gdp_tgf_curio_wool_desc: "Niedoskonałe, ale pasterz powiada, że bliskie ideału."
 gdp_tgf_curio_cotton: "Kępka najdelikatniejszej bawełny"
 gdp_tgf_curio_cotton_desc: "Lekka niczym puch i biała jak szron."
 gdp_tgf_curio_flax: "Motek jedwabistego lnu"
 gdp_tgf_curio_flax_desc: "Len tak delikatny, że o zmierzchu można go wziąć za jedwab."
 gdp_tgf_curio_textiles: "Belka materiału od mistrza tkackiego"
 gdp_tgf_curio_textiles_desc: "Splot tak gęsty, że nie przepuszcza wody."
 gdp_tgf_curio_furs: "Nieskazitelne zimowe futro"
 gdp_tgf_curio_furs_desc: "Pozyskane w środku zimy, gdy sierść jest najgęstsza."
 gdp_tgf_curio_leather: "Panel ze skóry tłoczonej"
 gdp_tgf_curio_leather_desc: "Wyprawiony, zdobiony tłoczeniami, miękki niczym tkanina."
 gdp_tgf_curio_sugar: "Wierzchołek głowy cukru"
 gdp_tgf_curio_sugar_desc: "Najbielsza część bryły cukru, zachowywana na pokaz."
 gdp_tgf_curio_spices: "Pudełko rzadkich przypraw"
 gdp_tgf_curio_spices_desc: "Otwierane raz w roku, by dowieść, że istnieje."
 gdp_tgf_curio_ceramics: "Nieskazitelna glazurowana misa"
 gdp_tgf_curio_ceramics_desc: "Zabrzmiałaby jak dzwon, gdyby w nią uderzyć. Nikt tego jednak nie robi."
 gdp_tgf_curio_glass: "Przezroczysta szklana fiolka"
 gdp_tgf_curio_glass_desc: "Ani jednego pęcherzyka powietrza. Szklarz z dumą odszedł ze stanowiska."
 gdp_tgf_curio_jewelry: "Mistrzowsko wykonana brosza"
 gdp_tgf_curio_jewelry_desc: "Sama igła wymagała miesiąca pracy."
 gdp_tgf_curio_lacquerware: "Lakierowane pudełko na pamiątki"
 gdp_tgf_curio_lacquerware_desc: "Pokryte trzydziestoma warstwami lakieru. Przyćmiło prezent, który skrywało wewnątrz."
 gdp_tgf_curio_silk: "Skrawek doskonałego jedwabiu"
 gdp_tgf_curio_silk_desc: "Najlepsze dzieło krosna, które nie trafiło do sprzedaży."
 gdp_tgf_curio_incense: "Bryłka jasnej żywicy"
 gdp_tgf_curio_incense_desc: "Niepalona jest słodka. Gdy się pali – jeszcze słodsza. Nigdy nie została zapalona."
 gdp_tgf_curio_medicaments: "Zbiór próbny aptekarza"
 gdp_tgf_curio_medicaments_desc: "Jedna dawka wszystkiego – na wszystko."
 gdp_tgf_curio_stone: "Fragment rzeźbionego kamienia"
 gdp_tgf_curio_stone_place: "Rzeźbiony kamień z miejsca o nazwie [tgf_source_county.GetNameNoTierNoTooltip]"
 gdp_tgf_curio_stone_desc: "Starszy od każdego żyjącego kamieniarza i lepiej obrobiony."
 gdp_tgf_curio_salt: "Bryła czystej, białej soli"
 gdp_tgf_curio_salt_desc: "Biała jak śnieg – czego o szarej soli powiedzieć nie można."
 gdp_tgf_curio_alum: "Kryształ ałunu wielkości pięści"
 gdp_tgf_curio_alum_desc: "Przejrzysty niczym lód i ostry w smaku."
 gdp_tgf_curio_dyes: "Fiolka prawdziwej purpury"
 gdp_tgf_curio_dyes_desc: "Kolor niegdyś zarezerwowany dla cesarzy. W praktyce wciąż tak jest."
 gdp_tgf_curio_books_paper: "Iluminowana karta"
 gdp_tgf_curio_books_paper_desc: "Jedna doskonała karta z księgi, której nikt nie potrafi odnaleźć."
 gdp_tgf_itinerary_artifact: "Przewodnik pielgrzyma"
 gdp_tgf_itinerary_artifact_desc: "Niewielka, zniszczona książeczka z wykazem dróg, zajazdów i brodów, spisana starannym pismem. Niektórych z tych miejsc nie ma na żadnej mapie."
 gdp_tgf_first_sale_artifact: "[tgf_good.GetNameNoTooltip] – pierwsza sztuka osoby o imieniu [tgf_first_seller.GetFirstNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "Pierwsze [tgf_good.Custom('GetTgfGoodSmallest')] towaru o nazwie [tgf_good.Custom('GetTradeGood')] sprzedane przez osobę o imieniu [tgf_first_seller.GetFirstName], odkupione za podwójną cenę i oprawione. Nie są na sprzedaż. Chyba."
 gdp_tgf_merchant_portrait_artifact: "Portret kupca"
 gdp_tgf_merchant_portrait_artifact_desc: "Kupiec przy stole do liczenia, przedstawiony ze stosem monet i bardzo zadowoloną miną."
 gdp_tgf_bale_book_artifact: "Księga z ładunku"
 gdp_tgf_bale_book_artifact_desc: "Ktoś użył jej, by chronić towary kupieckie przed wilgocią. Spełniła swoje zadanie – mniej więcej."
 gdp_tgf_handbook_practice_artifact: "Praktyka handlu"
 gdp_tgf_handbook_practice_artifact_desc: "Masy, miary, szlaki i ceny, spisane przez kupca, który najwyraźniej nigdy nie spał. Na marginesach widnieją czyjeś obliczenia."
 gdp_tgf_handbook_roads_artifact: "Księga szlaków i rynków"
 gdp_tgf_handbook_roads_artifact_desc: "Każdy szlak łączący wielkie rynki, wraz z informacjami o opłatach drogowych, zajazdach oraz przewoźnikach, którzy oszukują podróżnych."
 gdp_tgf_handbook_mirror_artifact: "Zwierciadło kupca"
 gdp_tgf_handbook_mirror_artifact_desc: "Porady dla kupca – co kupować i komu ufać. Większość z nich dotyczy jednak tego, komu ufać nie należy."
