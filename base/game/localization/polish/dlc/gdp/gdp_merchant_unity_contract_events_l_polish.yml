l_polish:
 option_boilerplate.tt.partner_aptitude: "#WEAK O losach tego pojedynku zadecydują [aptitude|El] twojego [deputy_possessive|El]#!"
 option_boilerplate.tt.partner_aptitude.success: "Twój delegat odnosi sukces"
 option_boilerplate.tt.partner_aptitude.failure: "Twój delegat ponosi porażkę"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: narzekania w miejscu o nazwie [destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_unity_contract.1004.desc: "[local_ruler.GetTitledFirstName] pisze krótko i rzeczowo: zachowanie, jakie przejawia mój handlarz [trader.GetTitledFirstName], a tym samym moja kompania, zostało zakwestionowane przez wzburzonych mieszkańców miejsca znanego jako [destination.GetBaronyNameExplicitly].\n\nMiejscowi kupcy, przedsiębiorcy i zwykli mieszkańcy składają skargi na nieprawidłowości w działaniach mojej kompanii. [local_ruler.GetTitledFirstNameNoTooltip] pragnie jak najszybciej wyjaśnić tę sprawę i uciszyć petentów.\n\nWygląda na to, że [trader.GetTitledFirstNameNoTooltip], nie czując nad sobą nadzoru, jaki byłby sprawowany tutaj, w miejscu o nazwie [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], pozwala sobie na zbyt wiele.\n\nPozostaje tylko wyruszyć w drogę do miejsca znanego jako [destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_unity_contract.1004.a: "Ruszajmy w drogę."
 gdp_merchant_unity_contract.1004.tt.destination_list: "Natychmiast wyruszasz w podróż do miejsca znanego jako [destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT Aby sfinalizować [task_contract|El]:\n$EFFECT_LIST_BULLET$Będziesz mieć #V 3#! okazje, aby udzielić zapewnień:\n$TAB$$EFFECT_LIST_BULLET$#V 2#! zapewnienia gwarantują odniesienie #P sukcesu#!\n$TAB$$EFFECT_LIST_BULLET$#V 3#! zapewnienia gwarantują odniesienie #P niebywałego sukcesu#!\n$TAB$$EFFECT_LIST_BULLET$#V 1#! zapewnienie może prowadzić do odniesienia #P sukcesu#!, #P względnego sukcesu#! lub poniesienia #N porażki#!\n$EFFECT_LIST_BULLET$Wyzwania mogą poddawać próbie:\n$TAB$$EFFECT_LIST_BULLET$[stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$[aptitude|E] [deputy_possessive|El], którym jest [GetCourtPositionType('partner_court_position').GetName()|l]\n$TAB$$EFFECT_LIST_BULLET$Umiejętności w zakresie [Concept('diplomacy', 'dyplomacji')|E], [Concept('learning', 'nauki')|E] lub snucia [Concept('intrigue', 'intrygi')|E]#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: rynek miejski"
 gdp_merchant_unity_contract.1010.desc.intro: "– [ROOT.Char.GetTitledFirstNameNoTooltip], jak mniemam? – [local_ruler.GetTitledFirstName] wzdycha, gdy moja świta spotyka [local_ruler.GetHerHis] orszak w miejscu znanym jako [destination.GetBaronyNameExplicitly]. [trader.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))], stoi z tyłu pod czujnym okiem straży."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "[GetCourtPositionType('partner_court_position').GetName()|U] [partner.GetFirstName] jest tuż za mną, w gotowości do pomocy."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n– Ten twój kupiec narobił niezłego zamieszania, co potwierdzą nasi świadkowie – ciągnie [local_ruler.GetFirstNameNoTooltip]. – Ufam, że szybko załatwisz tę sprawę, bo nie chcę tracić na nią czasu!"
 gdp_merchant_unity_contract.1010.desc.outro: "\n\n[person_c.GetTitledFirstName] i [person_d.GetTitledFirstName] mają przyjść na spotkanie ze mną i mam wysłuchać ich skarg. [trader.GetFirstNameNoTooltip] spogląda na mnie w sposób, który zdaje się mówić: „[ROOT.Char.GetTitleAsNameNoTooltip], daj spokój, przecież na pewno rozumiesz…”."
 gdp_merchant_unity_contract.1010.a: "[local_ruler.GetTitledFirstNameNoTooltip], proszę, powiedz, o co chodzi."
 gdp_merchant_unity_contract.1010.a.tt: "Domagasz się natychmiastowych wyjaśnień od osoby znanej jako [THIS.Char.GetTitledFirstName]"
 gdp_merchant_unity_contract.1010.b: "[person_c.GetTitledFirstNameNoTooltip] się z nami spotka."
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip] chętnie z nami porozmawia."
 gdp_merchant_unity_contract.1010.d: "Zakończmy to raz na zawsze."
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "Zostajemy odprowadzeni do prywatnych i zdecydowanie nazbyt wystawnych komnat należących do osoby znanej jako [char_current.GetTitleAsNameNoTooltip]. Prowadzi mnie do pokoju, w którym ewidentnie spotykają się najważniejsi ludzie [destination.GetTitle.Custom('BaronyTownTypePossessive')], i wskazuje mi miejsce."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName] prowadzi mnie do siedziby swojej kompanii nieopodal, gdzie [char_current.GetHerHis] partnerzy gorączkowo zapisują w księgach wyniki dzisiejszych transakcji."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName] nadzoruje miejskie doki. Stojąc na nabrzeżu, obserwuje nieustanny ruch statków. W niezliczonych stosach dokumentów odnotowywane są należne opłaty portowe oraz rozliczenia dostarczonego i załadowanego ładunku."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName] nadzoruje rynek główny w miejscu o nazwie [destination.GetTitle.GetBaseNameNoTier], dbając o to, by handlarze posiadali należyte koncesje, a prawo ustanowione przez osobę znaną jako [local_ruler.GetTitleAsNameNoTooltip] było przestrzegane."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "[char_current.GetFirstName] jest w swojej kuźni, gdzie z zapałem kuje podkowy. Tam [char_current.Custom('PL_go_ja')] zastaję. Ledwie zauważa, że podchodzę. Gdy nasze spojrzenia się spotykają, przeprasza i przekazuje pracę czeladnikowi."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "[char_current.GetFirstName] jest w swojej garbarni – cuchnącym miejscu na obrzeżach miasta. Tam [char_current.Custom('PL_go_ja')] zastaję. Zdaje się w ogóle nie reagować na odór. Liczne skóry i kolejni klienci wyraźnie świadczą o tym, że zysk zdecydowanie rekompensuje fetor."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "[char_current.GetFirstName] jest w swoim warsztacie, gdzie pięknie pachnie [char_current.Custom('GetRandomAppropriateTree')]. Tam [char_current.Custom('PL_go_ja')] zastaję. Gdy mnie dostrzega, odkłada na bok elementy, które właśnie rzeźbi."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName] stoi na czele straży miejskiej w miejscu o nazwie [destination.GetTitle.GetNameNoTierNoTooltip], a ja zastaję [char_current.Custom('PL_go_ja')], jak drzemie w zbrojowni. Gdy się budzi, mówi, że mogę usiąść, mamrocząc jednocześnie coś o swojej przerwie."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "– Powiedzmy to sobie wprost, [ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip] – zaczyna. – Podobno ta osoba dopuściła się wszelkiej maści oszustw i"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n– Doprowadź swoją kompanię do porządku, bo inaczej będziecie musieli poszukać sobie innego miejsca do prowadzenia działalności."
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "– Czy to naprawdę takie trudne? – uśmiecha się. – Prowadzić interesy uczciwie? W świetle twoich ostatnich działań miejsce znane jako [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] wypada nader niekorzystnie…"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "– Ostrzegam – uśmiecha się. – [local_ruler.GetTitleAsNameNoTooltip] jak dotąd wykazuje się dużą cierpliwością, lecz radzę nie wystawiać jej na próbę."
 gdp_merchant_unity_contract.1011.desc.personality.market: "– Działa tu wielu kupców – mówi z uśmiechem, rozkładając ramiona – ale to na #EMP twojego#! – wskazuje na mnie oskarżycielsko – co chwilę spływają skargi."
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "– Mawia się tutaj – mówi z grymasem – że #EMP nie ma dymu bez ognia#!. A wierz mi: twój kupiec robi #EMP bardzo#! dużo dymu!"
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "– Od samego początku prowadzę swoją działalność w sposób rzetelny. Dbam o dobre imię i zdrowe relacje z klientami. Wielka szkoda, że nie każdy ma takie podejście…"
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "– Nie ma żadnej drogi na około. Oczy [char_current.GetFaith.WealthGodNamePossessive] są skierowane na nas wszystkich, a ja dbam o to, by widziały we mnie dobrą osobę. Ci, którzy postępują inaczej, wkrótce się doigrają…"
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "– Lubię pieniądze tak samo jak kolejna osoba, a może nawet bardziej, ale nie mogę prowadzić działalności, gdy na każdym kroku ktoś mnie oszukuje."
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "– Myślę sobie, że [ROOT.Char.GetTitledFirstNameNoTooltip] to rozsądna osoba. Prosimy, zrozum: twój człowiek wyrządził nam krzywdę i nie możemy sobie na to pozwolić."
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "– Uważam, że jestem osobą, która nigdy nie prawi od rzeczy. Zawszę mówię wszystko wprost i po innych spodziewam się tego samego. Twój człowiek to kłamca. Tyle."
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "– Wiem, wiem. Wygląda, jakby nieźle się nam powodziło. Mój biznes uzależniony jest jednak od dostaw, a twój człowiek zawiódł mnie zbyt wiele razy."
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "– Wolę grać uczciwie, [ROOT.Char.GetTitledFirstNameNoTooltip]. Zarówno jeśli chodzi o sprawy z moimi podwładnymi, jak i przełożonymi. Ale o uczciwości można mówić tylko wtedy, gdy wszyscy ją wyznają. W przeciwnym wypadku, cóż, tak właśnie #EMP niektórzy#! mogą napsuć sobie krwi."
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "– Jestem zapracowaną osobą, podobnie jak ty, więc pozwolę sobie na bezpośredniość. Jeśli nie dostanę, czego mi trzeba, nie będę w stanie wyżywić swoich ludzi. Ten problem musi zostać rozwiązany."
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "– Głęboko wierzę, że [trader.GetFirstName] ma dobre serce, ale moja tolerancja ma granice, a te już dawno zostały przez [trader.Custom('PL_niego_nia')] przekroczone."
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "– Co więc zamierzasz? Twój człowiek narobił sobie tutaj wielu wrogów, i to zupełnie bez potrzeby. Chcemy tylko godnego traktowania."
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "odpowiada za zaginięcie kilku dostaw."
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "odpowiada za dostawę kiepskiej jakości towarów."
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "ma nieuregulowane należności."
 gdp_merchant_unity_contract.1011.a: "Spróbuj wyjaśnić nieprawidłowości."
 gdp_merchant_unity_contract.1011.b: "Spróbuj przekonać [char_current.Custom('PL_go_ja')], że jesteś osobą uczciwą."
 gdp_merchant_unity_contract.1011.c: "Sprzedaj jakąś bajkę."
 gdp_merchant_unity_contract.1011.d.gold: "– Oto rekompensata za niedogodności."
 gdp_merchant_unity_contract.1011.d.competitiveness: "– Wszystko naprawię."
 gdp_merchant_unity_contract.1011.e: "– Może uda nam się dojść do #EMP porozumienia#!?"
 gdp_merchant_unity_contract.1011.f.partner: "[courtier.GetFirstNameNoTooltip] może to wyjaśnić."
 gdp_merchant_unity_contract.1011.f.partner_away: "Szkoda, że [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] nie jest tu ze mną…"
 gdp_merchant_unity_contract.1011.f.partner_diff: "Szkoda, że [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] to nie ktoś inny…"
 gdp_merchant_unity_contract.1011.f.no_partner: "Przydałby mi się [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…"
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT Udało ci się udzielić [task_contract.MakeScope.Var('assurances_given').GetValue|0V] z maksymalnie #V 3#! zapewnień#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT Udało ci się porozmawiać z [task_contract.MakeScope.Var('chars_checked').GetValue|0V] z maksymalnie #V 3#! [Concept('characters', 'postaci')|E]#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "Udzielasz #P +1#! zapewnienia"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "Nie udzielono zapewnień"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Tu coś dodać, tam coś ująć"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "Zaraz, nie. Och. Czyżby?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "To głupi błąd z [char_current.Custom('PL_jego_jej')] strony"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Słowa są spójne"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "Ta osoba nie jest taka mądra, za jaką się uważa"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Ma ze dwa razy więcej oleju w głowie niż ty"
 gdp_merchant_unity_contract.1011.learning.tt.success: "Wiesz, gdzie patrzeć"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "Sprawdzasz wszędzie, ale nie możesz nic znaleźć"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: sukces!"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: porażka!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: zadanie zignorowane"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "Przeglądając swoje księgi, [char_current.GetTitledFirstName] wskazuje przykłady nadużyć oraz wydatków, które nie przyniosły spodziewanych zysków lub których efekty okazały się rażąco gorsze od obiecanych."
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "Długo mówię o dobrej reputacji mojej kompanii w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] i przytaczam liczne referencje od szanowanych mieszkańców okolicy. Ostatnie transakcje są zdecydowanie odstępstwem od normy, na które należy przymknąć oko dla dobra wymiany handlowej."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "Snuję zawiłą opowieść o napotykanych ostatnio trudnościach, wzbogacając ją mnóstwem pozbawionych sensu dygresji przeplatanych roztropnie przedstawianymi faktami – aż w końcu nawet ja zaczynam się gubić w tej sieci kłamstw."
 gdp_merchant_unity_contract.1012.desc.method.learning: "Rozmawiamy przez, #EMP jak się zdaje#!, większą część dnia, dyskutując o wszelkich możliwych aspektach działalności, którą [char_current.GetTitledFirstName] prowadzi w miejscu znanym jako [destination.GetBaronyNameExplicitly]. Niczego nie pominięto, pytano o wszystko."
 gdp_merchant_unity_contract.1012.desc.method.partner: "[partner.GetFirstName] prowadzi rozmowę, a [char_current.GetTitledFirstName] siada, by odpowiedzieć na istną nawałnicę pytań, która zdaje się nie mieć końca. Na początku wykazuje się cierpliwością, ale z czasem zaczyna ją tracić."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "– Twoje zrozumienie byłoby w tej sprawie #EMP bardzo#! mile widziane. – Uśmiecham się i sięgam po sakiewkę, by wysypać na stół nieco monet. [char_current.GetTitledFirstName] zamiera na chwilę, spoglądając to na połyskujący stosik, to na moją uniesioną brew."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "– [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] pragnie wyrazić głęboki żal z powodu niedogodności, jakie spotkały cię w związku z tym nieporozumieniem – recytuję. – #EMP Osobiście#! wynagrodzę ci straty."
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "Nic więcej nie mogę już zrobić. Czas doprowadzić to do końca."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip] posyła mi porozumiewawcze spojrzenie i przesuwa monety w swoim kierunku."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "[char_current.GetFirstNameNoTooltip] spogląda na mnie z zaskoczeniem, które szybko przeradza się w złość. Chwilę później ląduję za drzwiami."
 gdp_merchant_unity_contract.1012.desc.result.success: "Wymaga to odrobiny lamentowania i perswazji, ale w końcu [char_current.GetFirstNameNoTooltip] przyjmuje moje wyjaśnienia dotyczące poszczególnych nieprawidłowości. Ot, smutne realia wymiany handlowej na dużą odległość."
 gdp_merchant_unity_contract.1012.desc.result.failure: "Choć staram się, jak mogę, [char_current.GetFirstNameNoTooltip] odpiera każdy z moich argumentów, przedstawiając rozwiązania, kontrargumenty lub przykłady z własnego doświadczenia. Nijak nie potrafię zmniejszyć [char_current.Custom('PL_jego_jej')] niezadowolenia."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "Wróbel w garści wart jest dwóch gołębi na dachu, a te bezprawnie zarobione przez [char_current.Custom('PL_niego_nia')] zyski dobrze leżą mi w dłoni – nawet jeśli na skutek tego przechwycenia nie możemy już [char_current.Custom('PL_jego_jej')] przesłuchać."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "Niech szczęście dopisze nam i przy następnej osobie."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Oby przy następnej osobie poszło nam lepiej."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.GetTitledFirstName] nie ma kontrargumentów."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "Oby moja sakiewka wytrzymała naszą kolejną wizytę…"
 gdp_merchant_unity_contract.1012.a: "Niech to będzie [local_ruler.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1012.b: "Ruszajmy – [person_c.GetTitledFirstNameNoTooltip] czeka."
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip] nas oczekuje…"
 gdp_merchant_unity_contract.1012.d: "Zakończmy to wreszcie…"
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "Próbujesz dalej udzielać zapewnień"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "Decydujesz, jak rozwiązać sytuację"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: rozstrzygnięcie"
 gdp_merchant_unity_contract.1021.desc.intro: "Raz jeszcze spotykamy się na placu miejskim, gdzie [local_ruler.GetTitledFirstName] zwołuje zniecierpliwionych oskarżycieli i mojego kupca, by mogli wysłuchać mojego ostatecznego werdyktu w sprawie.\n\n[person_c.GetFirstName] i [person_d.GetFirstName] zwracają się do mnie, podczas gdy [trader.GetFirstName] nerwowo wierci się pod ich spojrzeniami, po raz pierwszy od mojego przybycia chyba nie radząc sobie ze stresem.\n\nMam przeczucie, że"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "miejscowi zostali z powodzeniem przekonani."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "miejscowi są dość zadowoleni wskutek podjętych przeze mnie działań."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "nie udało mi się w żaden sposób zdobyć zaufania miejscowych."
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip] ziewa.\n\n– No dobrze, a co z"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "zaginionymi dostawami?"
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "marnej jakości towarami?"
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "nieuregulowanymi należnościami?"
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Ponieważ udzielono wszystkich możliwych zapewnień, twoje gorliwe starania gwarantują ci niebywały sukces, nawet jeśli [trader.GetTitledFirstNameNoTooltip] nie otrzyma kary#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT Za sprawą wystarczających zapewnień twoje wysiłki prawdopodobnie zakończą się sukcesem, nawet jeśli [trader.GetTitledFirstNameNoTooltip] nie otrzyma kary#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT Ponieważ udzielone przez ciebie zapewnienia były niewystarczające, twoje niedbałe działania mogą wywołać opór, jeśli [trader.GetTitledFirstNameNoTooltip] nie otrzyma kary#!"
 gdp_merchant_unity_contract.1021.a: "– Powtórzę raz jeszcze: to było zwykłe, nieszczęśliwe w skutkach nieporozumienie."
 gdp_merchant_unity_contract.1021.a.tt: "Uważasz swoje zapewnienia za wystarczające"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "Jeśli udzielono wielu zapewnień"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "Jeśli udzielono pewnych zapewnień, a miejscowi dali się przekonać"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "Jeśli nie udało ci się udzielić zapewnień, a reakcja miejscowych była nieprzychylna"
 gdp_merchant_unity_contract.1021.b: "Zapłacicie – połowę kwoty."
 gdp_merchant_unity_contract.1021.b.tt: "Choć wydajesz decyzję na korzyść osoby znanej jako [local_ruler.GetTitledFirstName], [trader.GetTitledFirstName] zgodnie z twoją wolą i tak będzie płacić niższe podatki"
 gdp_merchant_unity_contract.1021.c: "– Cała ta sprawa to ściek. Ściek i oszczerstwa!"
 gdp_merchant_unity_contract.1021.c.tt: "Sucho wypierasz się jakichkolwiek przewinień ze strony kompanii"
 gdp_merchant_unity_contract.1021.d: "– Winę ponosi [trader.GetTitledFirstNameNoTooltip] i należy [trader.Custom('PL_go_ja')] ukarać."
 gdp_merchant_unity_contract.1021.d.tt: "[trader.GetTitledFirstNameNoTooltip] zostaje kozłem ofiarnym dla dobra kompanii"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: zwykłe nieporozumienie"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: problem rozwiązany"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: sprawa bez rozwiązania"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: bez satysfakcji"
 gdp_merchant_unity_contract.1022.desc.success_critical: "Miejscowi spoglądają po sobie, potakując zapalczywie, a [trader.GetFirstName] uśmiecha się promiennie. [local_ruler.GetTitledFirstName] wyraźnie odczuwa ulgę, której towarzyszy jednak pewne zaskoczenie.\n\n– Wspaniale. Wobec tego zamykam sprawę! – ogłasza.\n\nOskarżyciele gorliwie dziękują mi za wizytę i zdają się nie mieć już wątpliwości. [destination.GetBaronyNameExplicitlyNoTooltip] to zadziwiające miejsce: kompania cieszy się tu teraz zaufaniem #EMP większym#! niż kiedykolwiek wcześniej."
 gdp_merchant_unity_contract.1022.desc.success_standard: "Miejscowi spoglądają po sobie, dość zachowawczo kiwając głowami, a [trader.GetFirstName] się uśmiecha. [local_ruler.GetTitledFirstName] wygląda, jakby brakowało [local_ruler.Custom('PL_mu_jej')] przekonania, jednak szybko przechodzi dalej.\n\n– Cóż, w takim razie zamykam sprawę… – ni to oznajmia, ni dopytuje.\n\nOskarżyciele zdają się w miarę zadowoleni, gdy rozmawiają o argumentach. Póki co reputacja kompanii w baronii znanej jako [destination.GetBaronyNameExplicitlyNoTooltip] nie jest zagrożona."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "Przez krótką, pełną napięcia chwilę [local_ruler.GetTitledFirstName] i [local_ruler.Custom('PL_jego_jej')] poplecznicy wyglądają, jakby zamierzali zanegować mój niezbyt przekonujący wniosek; czas jednak mija i nie pada żadne słowo.\n\n– Dobrze więc… – wzdycha [local_ruler.GetTitleAsNameNoTooltip], spoglądając na niezadowolonych oskarżycieli. – Proszę dopilnować, by coś takiego już nigdy się nie powtórzyło.\n\nMiejscowi wyraźnie mają wątpliwości, ale to problem, z którym musi poradzić sobie [trader.GetFirstName]."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "Na placu zapada pełna napięcia, niezręczna cisza, w której miejscowi spoglądają po sobie z grymasami niezadowolenia.\n\n– To wszystko? – cedzi [local_ruler.GetTitledFirstName], a rozwścieczeni oskarżyciele gotowi są przytaknąć każdemu [local_ruler.Custom('PL_jego_jej')] słowu.\n\n[trader.GetFirstName] nerwowo przełyka ślinę.\n\n– Bardzo przepraszam za niedogodności – odzywa się. – Nic więcej nie można jednak zrobić. Takie rzeczy się… zdarzają."
 gdp_merchant_unity_contract.1022.a: "Właściwie nie mogło pójść lepiej."
 gdp_merchant_unity_contract.1022.b: "Wszystko dobre, co się dobrze kończy…"
 gdp_merchant_unity_contract.1022.c: "Cóż… Nie poszło najlepiej."
 gdp_merchant_unity_contract.1022.d: "Uch… czas ruszać."
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: odmowa"
 gdp_merchant_unity_contract.1023.desc: "Po przepełnionych wściekłością szeptach wnioskuję, że oskarżyciele są w głębokim szoku. [local_ruler.GetTitleAsName] wyraźnie nie wie, co zrobić.\n\nGdy znów zabieram głos, [trader.GetFirstName] puszy się zuchwale, zapominając o zaskoczeniu.\n\n– Nie pozwolę, by dobre imię mojej kompanii ucierpiało przez coś takiego. – Zadzieram nos. – Dość już zmarnowaliście mojego czasu. Mam pilne sprawy do załatwienia; ruszam do miejsca o nazwie [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_unity_contract.1023.a: "W drogę."
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: pod wozem"
 gdp_merchant_unity_contract.1024.desc: "Oskarżyciele wiwatują, gdy [local_ruler.GetTitledFirstName], wciąż w lekkim szoku, wydaje strażnikom miejskim rozkaz, po którym [trader.GetFirstName] kończy w kajdanach z wymalowanym na twarzy zaskoczeniem.\n\n– A-ale przecież… Niech [ROOT.Char.GetTitleAsNameNoTooltip] coś zrobi! – jąka się mój handlarz, ale zbywam [trader.Custom('PL_go_ja')] niedbałym machnięciem dłoni. – Wyjdzie nam to na dobre. Marny był z [trader.Custom('PL_niego_niej')] handlarz…"
 gdp_merchant_unity_contract.1024.a: "Ofiara, którą trzeba było ponieść."
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: bystry umysł"
 gdp_merchant_unity_contract.1031.desc: "– [ROOT.Char.GetTitledFirstNameNoTooltip]?\n\nSpoglądam znad ksiąg na dość znajomo wyglądającą osobę. [hopeful.GetWomanMan|U], kultura [hopeful.GetCulture.GetName]… Ale skąd ja kojarzę tę twarz?\n\n– Jestem [hopeful.GetTitledFirstName], [ROOT.Char.GetTitleAsNameNoTooltip]. Moje rodzinne miasto to [destination_1.GetBaseNameNoTier]. Kilka lat temu podczas wizyty w nim udało ci się rozstrzygnąć nieporozumienie, według mnie z godnością i spokojem – słyszę. – Niestety moje przedsięwzięcia dawno runęły i szukam nowego zajęcia. Może w twojej kompanii znalazłoby się dla mnie miejsce?"
 gdp_merchant_unity_contract.1031.a: "Czemu nie? Witaj na pokładzie!"
 gdp_merchant_unity_contract.1031.b: "Nie będzie z ciebie pożytku w tej kompanii."
