 loan_money_interaction_depose_risk_tt: "@alert_icon! #M Dłużnik prowadzi [Concept('war', 'wojnę')|E] lub jest celem [Concept('faction', 'frakcji')|E], która może pozbawić go władzy#!"
 loan_money_interaction_dissolution_risk_tt: "@alert_icon! #M Dłużnik prowadzi [Concept('war', 'wojnę')|E] lub jest celem [Concept('faction', 'frakcji')|E], której działania mogą doprowadzić do rozłamu lub znacznego pomniejszenia jego [Concept('realm', 'państwa')|E]#!"
 loan_money_interaction_faith_astray_risk_tt: "@alert_icon! #M Dłużnik uważa twoją [Concept('faith', 'wiarę')|E] za [Concept('faith_astray', 'błędną')|E]#! #weak ([actor.GetFaith.GetName|l])#!"
