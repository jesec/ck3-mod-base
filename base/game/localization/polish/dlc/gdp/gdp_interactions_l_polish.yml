 merchant_join_republic_hook_auto_accept_tt: "[TARGET_CHARACTER.GetShortUINameNotMe] nie może odmówić, gdy masz na [TARGET_CHARACTER.Custom('PL_niego_nia')] [hook_i|E] [Concept('hook', 'haka')|E]"
 merchant_join_republic_interaction_offer_gold: "Podwój wkupne"
 merchant_join_republic_interaction_offer_gold_desc: "Zapłać podwójną stawkę w [gold_i|E] w [Concept('gold', 'złocie')|E], aby zdobyć większą przychylność [Concept('assembly', 'zgromadzenia')|E]"
 merchant_join_republic_forgive_debt_tt: "Umarzasz osobie znanej jako [CHARACTER.GetShortUINameNotMe] [Concept('loan', 'pożyczkę')|E] w wysokości [gold_i|E] $VALUE|0V$"
