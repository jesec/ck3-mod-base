 LOAN_MONEY_INTERACTION_NOTIFICATION: "Do mojej kompanii dotarły wieści o twoich trudnościach finansowych."
 LOAN_MONEY_INTERACTION_OPEN_NOTIFICATION: "$LOAN_MONEY_INTERACTION_NOTIFICATION$ Możemy pomóc twojemu państwu w tym trudnym czasie, ale oczywiście oczekujemy, że takie ryzyko zostanie nam wynagrodzone."
 LOAN_MONEY_INTERACTION_DISGUISED_NOTIFICATION: "$LOAN_MONEY_INTERACTION_NOTIFICATION$ Nie posiadalibyśmy się z radości, mogąc pomóc twojemu państwu przetrwać ten smutny i trudny czas."
 LOAN_MONEY_INTERACTION_FREE_NOTIFICATION: "$LOAN_MONEY_INTERACTION_NOTIFICATION$ Możemy pomóc twojemu państwu w tym trudnym czasie, nie oczekując zysku, a jedynie zwrotu pożyczonej sumy."
 demand_repayment_interaction: "Zażądaj spłaty"
 demand_repayment_interaction_desc: "Wezwij osobę znaną jako [recipient.GetShortUINameNotMeNoTooltip] do spłaty zaległej [Concept('loan', 'pożyczki')|E] w [gold_i|E] [Concept('gold', 'złocie')|E]"
 demand_repayment_interaction_afford_tt: "[recipient.GetShortUINameNotMe] nie jest w stanie spłacić żadnych [Concept('loans', 'pożyczek')|E] zaciągniętych u osoby znanej jako [actor.GetShortUINameNotMe]"
 demand_repayment_interaction_loan_exists_tt: "Osobie znanej jako [recipient.GetShortUINameNotMe] udzielono [Concept('loan', 'pożyczki')|E] ponad #V 2#! lata temu"
 demand_repayment_interaction_duration_tt: "Nie możesz żądać spłaty [Concept('loan', 'pożyczki')|E] przed upływem co najmniej #V 2#! lat #weak ([GetCurrentDateWithDiff( GetVarTimeRemaining( loan_temp.MakeScope, 'demand_cooldown') )])#!"
 demand_repayment_refusal_warning_tt: "@warning_icon! #X Kolejne odmowy spłaty jeszcze bardziej obniżą [prestige_i|E] [prestige|El] oraz [Concept('opinion', 'opinię')|E]#!"
 DEMAND_REPAYMENT_INHERITED_DEBT_NOTIFICATION: "Zdarzyło mi się kiedyś pożyczyć twojemu poprzednikowi pewną sumę złota.\n\nJako że jesteś jego następcą, teraz na tobie spoczywa obowiązek spłaty tej pożyczki."
 DEMAND_REPAYMENT_INHERITED_LOAN_NOTIFICATION: "Mój poprzednik udzielił ci kiedyś pożyczki.\n\nJako jego następca przychodzę prosić cię o jej spłatę."
 DEMAND_REPAYMENT_ALL_NEW_CHAR_NOTIFICATION: "Mój poprzednik pożyczył kiedyś twojemu pewną sumę złota.\n\n– Jako że jesteś jego następcą, teraz na tobie spoczywa obowiązek spłaty tej pożyczki."
 DEMAND_REPAYMENT_FIRST_TIME_NOTIFICATION: "Pożyczka okazała się przydatna, jak mniemam?\n\n[lender.GetTitledFirstName], przychodzi, wzywając do zwrotu przekazanego mi niegdyś złota."
 DEMAND_REPAYMENT_SECOND_TIME_NOTIFICATION: "Nie podoba mi się to, jak ze mną pogrywasz. Masz u mnie dług i ufam, że twoja obietnica spłaty nie była kłamstwem.\n\n[lender.GetTitledFirstName] [lender.Custom('quirk_neg_present')], stając przede mną po raz drugi."
 DEMAND_REPAYMENT_THIRD_TIME_NOTIFICATION: "Musi [actor.Char.Custom('FormOfAddressForLiege')|l] wiedzieć, że męczy mnie to! To ostatni raz, gdy proszę kulturalnie; gdzie są pieniądze, które mi się od ciebie należą?"
 DEMAND_REPAYMENT_FOURTH_TIME_NOTIFICATION: "Gdyby było dla mnie jasne, żeś [actor.Char.Custom2('InsultNoun', SCOPE.sC('recipient'))] bez kręgosłupa moralnego, nigdy nie przyszłoby mi do głowy wyświadczyć ci taką przysługę."
 gdp_usury_discouraged_modifier: "Pożyczkodawca"
 gdp_usury_discouraged_modifier_desc: "Ta postać udziela pożyczek w [Concept('gold', 'złocie')|E] na bieżące wydatki, wymagając ich spłaty wraz z [Concept('interest', 'odsetkami')|E], a [usury|El] nie jest dobrze widziana w jej [Concept('rite', 'obrządku')|E]."
 gdp_usury_outsider_lending_modifier: "Kredytor innowierców"
 gdp_usury_outsider_lending_modifier_desc: "Ta postać udziela osobom wyznającym inną [Concept('religion', 'religię')|E] pożyczek w [Concept('gold', 'złocie')|E], wymagając ich spłaty wraz z [Concept('interest', 'odsetkami')|E]. Jest to dopuszczalne w jej [Concept('rite', 'obrządku')|E], choć nie spotyka się z powszechnym uznaniem."
 gdp_usury_condemned_modifier: "Lichwiarz"
 gdp_usury_condemned_modifier_desc: "Ta postać żyje z pożyczania [Concept('gold', 'złota')|E], wymagając jego spłaty wraz z [Concept('interest', 'odsetkami')|E], a w jej [Concept('rite', 'obrządku')|E] [Concept('usury', 'lichwę')|E] uznaje się za grzech."
 loan_money_interaction_open_interest: "Pożyczka z jawnym oprocentowaniem"
 loan_money_interaction_open_interest_desc: "Pożycz [gold_i|E] [gold|El] osobie znanej jako [recipient.GetShortUINameNotMe], naliczając jawne [interest|El] tak, aby kwota do spłaty była o #V 25%#! wyższa od pożyczonej"
 loan_money_interaction_open_interest_sin_desc: "Udziel osobie znanej jako [recipient.GetShortUINameNotMe] [Concept('loan', 'pożyczki')|E] w [gold_i|E] [Concept('gold', 'złocie')|E], naliczając jawne [interest|El] tak, aby kwota do spłaty była o #V 25%#! wyższa od pożyczonej. Udzielenie takiej pożyczki odbędzie się kosztem [piety_i|E] [Concept('piety', 'pobożności')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E], gdyż w twoim [Concept('rite', 'obrządku')|E] [usury|El] jest potępiana"
 loan_money_interaction_disguised_interest: "Niejawne odsetki"
 loan_money_interaction_disguised_interest_sin_desc: "Udziel osobie znanej jako [recipient.GetShortUINameNotMe] pożyczki w [gold_i|E] [Concept('gold', 'złocie')|E], ukrywając [interest|El] pośród opłat i bonusów tak, aby kwota do spłaty była o #V 15%#! wyższa od pożyczonej. Zdobywasz [secret|El] „$secret_disguised_usury$”. Twoje [clergy|El] nie dostrzega w pożyczce [Concept('usury', 'lichwy')|E], o ile [secret|El] nie zostanie odkryty"
 loan_money_interaction_interest_free: "Pożyczka bez odsetek"
 loan_money_interaction_interest_free_desc: "Udziel osobie znanej jako [recipient.GetShortUINameNotMe] [Concept('loan', 'pożyczki')|E] w [gold_i|E] [Concept('gold', 'złocie')|E] bez naliczania jakichkolwiek [Concept('interest', 'odsetek')|E], zyskując #P [actor.MakeScope.ScriptValue('gdp_interest_free_loan_opinion_value')|0]#! pkt [Concept('opinion', 'opinii')|E] od swojego dłużnika"
 loan_money_interaction_interest_free_pious_desc: "Udziel osobie znanej jako [recipient.GetShortUINameNotMe] [Concept('loan', 'pożyczki')|E] w [gold_i|E] [Concept('gold', 'złocie')|E] bez naliczania jakichkolwiek [Concept('interest', 'odsetek')|E], zyskując #P [actor.MakeScope.ScriptValue('gdp_interest_free_loan_opinion_value')|0]#! pkt [Concept('opinion', 'opinii')|E] oraz [piety_i|E] [piety|El] dzięki temu, że w twoim [Concept('rite', 'obrządku')|E] taki gest uznaje się za miłosierdzie"
 loan_money_interaction_income_risk_tt: "@alert_icon! #M [income|E] dłużnika jest niski#!"
