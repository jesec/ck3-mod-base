 merchant_procure_estate_noble_family_tt: "Twoja rodzina zyskuje w [Concept('realm', 'państwie')|E] osoby znanej jako [recipient.GetShortUINameNotMe] status [Concept('noble_family', 'rodziny szlacheckiej')|E] [unlanded|El] i zyskuje [estate|El]"
