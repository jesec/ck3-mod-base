 merchant_join_republic_no_assembly_tt: "[recipient.GetShortUINameNotMe] musi należeć do [Concept('republic', 'republiki')|E] ze [Concept('assembly', 'zgromadzeniem')|E]"
 merchant_join_republic_house_seated_tt: "Żaden inny członek rodu [actor.GetHouse.GetName] nie może już posiadać [Concept('title', 'tytułu')|E] rodzinnego w tym [Concept('realm', 'państwie')|E]"
 merchant_join_republic_patrician_tt: "Dołączasz do [Concept('assembly', 'zgromadzenia')|E] jako [patrician|El]"
 merchant_join_republic_company_kept_tt: "Twoja [company|El] zachowuje swoje [Concept('trade_routes', 'szlaki')|E] i [trade_monopolies|El]"
