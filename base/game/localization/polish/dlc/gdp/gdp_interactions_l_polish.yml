 action_merchant_company_in_debt_label: "@debt_icon! Twoja kompania jest zadłużona"
 action_merchant_company_in_debt_desc: "Masz mniej niż [gold_i|E] #V [EmptyScope.ScriptValue('company_debt_gold_threshold_value')|0]#! szt. [Concept('gold', 'złota')|E], co oznacza, że twoja [company|El] jest [Concept('debt', 'zadłużona')|E]!\n\nDopóki kompania ma dług:\n$BULLET_WITH_TAB$[company_direction|E] – co [EmptyScope.ScriptValue('company_debt_direction_interval_months_value')|V0] mies. [EmptyScope.ScriptValue('company_debt_direction_shift_value')|V0] pkt postępu w kierunku [company_sentiment_divided_i] [Concept('company_sentiment_divided', 'zachłanności')|E]\n$BULLET_WITH_TAB$Nie można wypowiedzieć [Concept('war', 'wojny')|E]\n\nIm większe masz zadłużenie, tym surowsze czekają kary. Obecny poziom długu ma następujące dodatkowe skutki:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Popadnięcie w długi kosztowało już kompanię [trade_acumen_i] [acumen|El], hamując wzrost [Concept('company_size', 'wielkości kompanii')|E]. Spłać dług, aby nie dopuścić do dalszego osłabienia [company_sentiment|El].#!"
