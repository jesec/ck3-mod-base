 gdp_sponsor_craft_guild_decision: "Zasponsoruj gildię rzemieślniczą"
 gdp_sponsor_craft_guild_decision_desc: "W republice uznanie za gildię rzemieślniczą przynosi ogromne korzyści. Z tego powodu rzemieślnicy różnych profesji zabiegają o opracowanie i zatwierdzenie przez zgromadzenie oficjalnego statutu. Patrycjusz, który przedstawi projekt zgromadzeniu, nie tylko przysłuży się miastu, ale też zostanie uznany przez nową gildię za swojego patrona."
 gdp_sponsor_craft_guild_decision_tooltip: "Sponsorowanie gildii rzemieślniczej zwiększy [prosperity_growth|El] i [urban_tax|El] w [Concept('county', 'hrabstwie')|E] [Concept('capital', 'stołecznym')|E] oraz przyspieszy wzrost [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] i [Concept('trade_expertise', 'doświadczenia handlowego')|E] twojego [house_possessive|El]"
 gdp_sponsor_craft_guild_decision_confirm: "Zasponsorowano nową gildię rzemieślniczą"
 gdp_request_noble_magistracy_decision: "Poproś o magistrat szlachecki"
 gdp_request_noble_magistracy_decision_desc: "Choć większość stanowisk urzędniczych jest zamknięta dla osób stanu patrycjuszowskiego, niektóre zarezerwowano dla szlacheckich sędziów – to idealna okazja dla młodego i ambitnego patrycjusza, by poznać mechanizmy władzy i wyrobić sobie nazwisko."
 gdp_request_noble_magistracy_decision_tooltip: "Magistrat szlachecki zwiększy przyrost [Concept('dynasty_prestige', 'renomy')|E] i [Concept('lifestyle_experience', 'doświadczenia życiowego')|E], a także [Concept('opinion', 'opinię')|E] twojego [heir_possessive|El] i jego [stress_gain|El]"
 gdp_request_noble_magistracy_decision_confirm: "Złożono prośbę o magistrat szlachecki dla twojego dziedzica"
 gdp_request_relief_from_bankruptcy_decision: "Poproś o ratunek przed bankructwem"
 gdp_request_relief_from_bankruptcy_decision_desc: "Aby znamienite rody nie popadły w nędzę, zgromadzenie może spłacić wierzycieli i pokryć nieściągalne długi ze środków skarbca republiki. Dzięki temu zrujnowany patrycjusz otrzyma szansę na uniknięcie bankructwa."
 gdp_request_relief_from_bankruptcy_decision_tooltip: "Ratunek przed bankructwem spłaci twój dług w [Concept('gold', 'złocie')|E] ze [Concept('treasury', 'skarbca')|E] [Concept('republic', 'republiki')|E]"
