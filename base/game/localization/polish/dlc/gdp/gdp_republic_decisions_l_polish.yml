 gdp_enforce_curfew_decree_decision_desc: "#bold Zgodnie z wolą zgromadzenia:#!\nNiniejszym wprowadza się ścisłe godziny porządkowe, aby ograniczyć działalność przestępczą w godzinach wieczornych."
