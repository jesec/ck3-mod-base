 gdp_republic_city_stroll_decision: "Przespaceruj się po miejscu znanym jako [GetPlayer.GetCapitalLocation.GetNameNoTooltip]"
 gdp_republic_city_stroll_decision_desc: "Przewidywanie potrzeb rynku i gromadzenie bogactwa jako handlarz to po prostu kwestia podążania z duchem czasu. A jak to robić? Najlepiej poznając mieszkańców miasta i wczuwając się w atmosferę miejsca znanego jako [GetPlayer.GetCapitalLocation.GetNameNoTooltip]!"
