 gdp_renounce_noble_family_title_decision_republic_no_heir_desc: "Wycofaj się do rodzinnego [Concept('consortery', 'konsorcjum patrycjuszowskiego')|E] i zrzeknij się wszystkich [Concept('titles', 'tytułów')|E], w tym tytułu [Concept('house_head', 'głowy rodu')|E]. Przekaż stery dziedzicowi twojego [house_possessive|El] i pozwól mu poprowadzić [house|El] [ROOT.Char.GetHouse.GetName] w nowym kierunku."
