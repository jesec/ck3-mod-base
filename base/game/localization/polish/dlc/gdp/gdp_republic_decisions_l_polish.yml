l_polish:
 gdp_adopt_republic_government_decision: "Przyjmij ideały republikańskie"
 gdp_adopt_republic_government_decision_desc: "Patrzę, jak tłum zmęczony codziennym zmaganiem brnie przez ulicę. Zastanawiam się, czy nasze zwyczaje rządu znanego jako [ROOT.Char.GetGovernment.GetNameNoTooltip|l] naprawdę są jedyną ścieżką, którą może podążać władca. Czy zdobędę lojalność poprzez zasłużoną aprobatę, a nie wyłącznie przez więzy krwi? Może nadszedł czas, by przyjąć nowe ideały i zmienić nasz sposób życia."
 gdp_adopt_republic_government_decision_tooltip: "Przyjmij ideały republikańskie i przekształć się w następujący rząd: [GetGovernment('republic_government').GetName|l]"
 gdp_adopt_republic_government_decision_confirm: "Przyjmij ideały republikańskie"
 liege_has_granted_city_charter: "Twój [liege|El] przyznał ci koncesję miejską"
 liege_has_granted_city_charter_duration: "Twój [liege|El] przyznał ci koncesję miejską #weak (do dnia [GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )])#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X Nie będziesz już [Concept('elector', 'elektorem')|E] w miejscu znanym jako [GetTitleByKey('e_hre').GetName]#!"
 gdp_adopt_republican_ways_decision: "Przyjmij ustrój republikański"
 gdp_adopt_republican_ways_decision_desc: "Spotkania, które niegdyś nas jednoczyły, dziś wyraźnie tracą na znaczeniu w cieniu miejskich targów i murów. Jeśli [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ma rozkwitać, musimy porzucić dawne plemienne zwyczaje i nadać miastu samorządność w formie republiki."
 gdp_adopt_republican_ways_decision_tooltip: "Porzuć [Concept('tribal', 'plemienne')|E] obyczaje i stań się [Concept('republic', 'republiką')|E]"
 gdp_adopt_republican_ways_decision_confirm: "Przyjmij ustrój republikański"
 gdp_tribal_capital_becomes_city_tt: "Twoja [realm_capital|El] stanie się [Concept('city_holding', 'posiadłością miejską')|E]"
 gdp_other_tribal_holdings_become_castles_tt: "Wszystkie pozostałe [tribal_holdings|El] w państwie zostaną przekształcone w [castle_holdings|El]"
 gdp_tribal_vassals_will_feudalize_tt: "Twoi [vassals|El] [Concept('tribal', 'plemienni')|E] przyjmą [government|El] [feudal|El] lub [government|El] [Concept('clan', 'klanowy')|E]"
 convert_to_feudalism_from_republic_decision: "Przyjmij ustrój [ROOT.Char.Custom('GetTribalReformGovernment')]"
 convert_to_feudalism_from_republic_decision_desc: "Zgromadzenia, procedury i biurokracja obniżają sprawność naszego rządu. Jeśli miejsce o nazwie [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ma się rozwijać, musimy pozbyć się tego balastu."
 convert_to_feudalism_from_republic_decision_confirm: "Przyjmij ustrój [ROOT.Char.Custom('GetTribalReformGovernment')]"
 convert_to_feudalism_from_republic_decision_tooltip: "Zmień rodzaj [Concept('government', 'rządu')|E]"
 patricians_becomes_merchants_desc: "[vassals|E] [Concept('patrician', 'patrycjuszowscy')|E] zostają [Concept('merchants', 'kupcami')|E]"
 gdp_restore_roman_republic_decision: "Odbuduj Republikę Rzymską"
 gdp_restore_roman_republic_decision_desc: "Republika Rzymska była symbolem wolności i dobrobytu, wzorem dla wszystkich. Z czasem jednak i ona popadła w ruinę. Nadszedł czas, by tchnąć w nią nowe życie i przywrócić jej dawną świetność!"
 gdp_restore_roman_republic_decision_tooltip: "Odbuduj Republikę Rzymską"
 gdp_restore_roman_republic_decision_confirm: "Odbuduj Republikę Rzymską"
 restore_roman_republic_make_rome_capital_desc: "Możesz ogłosić, że [GetTitleByKey('c_roma_urbs').GetName] to [realm_capital|El]"
 assembly_members_appointed_as_senators_desc: "Wszyscy członkowie [Concept('assembly', 'zgromadzenia')|E] zostaną mianowani [Concept('republic_senators', 'senatorami')|E]"
 gdp_popular_mandate_decision: "Zaapeluj o poparcie ludu"
 gdp_popular_mandate_decision_desc: "Lud zamieszkujący miejsce znane jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] darzy mnie uwielbieniem. Mogę wykorzystać jego przychylność już teraz, mobilizując ludność do walki o moje dalsze rządy. Wszak głos tłumu ma swoją wagę na zgromadzeniu, a osoba taka jak [ROOT.Char.GetTitleAsNameNoTooltip], mając za sobą lud, dysponuje silniejszą pozycją podczas liczenia głosów.\n\nMoże mnie to kosztować część ich przychylności, lecz głosowanie jest do wygrania dziś, a nie jutro."
 gdp_popular_mandate_decision_tooltip: "Wydaj [Concept('popular_opinion', 'powszechną opinię')|E] w miejscu o nazwie [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aby zyskać dodatkowy głos w następnej [Concept('election', 'elekcji')|E]"
 gdp_popular_mandate_decision_confirm: "Niech lud stanie za mną"
 gdp_popular_mandate_no_active_mandate_desc: "Nie cieszy się jeszcze poparciem ludu"
 gdp_civic_labor_decision: "Pokieruj pracą obywateli"
 gdp_civic_labor_decision_desc: "Przychylność mieszkańców miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to zasób równie pewny jak złoto. Wezwę obywateli, by wsparli moje przedsięwzięcia budowlane swoją pracą i wiedzą, co będzie mnie kosztować część tej przychylności."
 gdp_civic_labor_decision_tooltip: "Wydaj [Concept('popular_opinion', 'powszechną opinię')|E] w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aby zyskać premie do rozbudowy siedziby, którą zajmuje [ROOT.Char.GetTitleAsNameNoTooltip]"
 gdp_civic_labor_decision_confirm: "Wezwij obywateli"
 gdp_popular_gifts_decision: "Zabiegaj o patronat"
 gdp_popular_gifts_decision_desc: "Moja pozycja wśród mieszkańców miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] daje mi przewagę. Rozpuszczę wieść, że [ROOT.Char.GetTitleAsNameNoTooltip] przyjmuje oferty od wielkich rodów patrycjuszowskich. Będą się wzajemnie prześcigać. Pałac zyska tak czy inaczej."
 gdp_popular_gifts_decision_tooltip: "Wydaj [Concept('popular_opinion', 'powszechną opinię')|E], aby skłonić bogate rody patrycjuszowskie do rywalizacji o względy, co przyniesie pałacowi [gold|El] i dary"
 gdp_popular_gifts_decision_confirm: "Otwórz przyjmowanie ofert"
 gdp_popular_gifts_artifact_tt: "Otrzymujesz w podarunku losowy [artifact|El]"
 gdp_glorification_decision: "Przyjmij uwielbienie"
 gdp_glorification_decision_desc: "Mieszkańcy miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] darzą mnie szacunkiem wykraczającym poza politykę i popularność. Pragną oddać mi cześć nie jako swojemu przywódcy, lecz jako ucieleśnieniu miasta. Przyjmę tę chwilę taką, jaka jest."
 gdp_glorification_decision_tooltip: "Przyjmij hołd składany ci przez miasto. To zaszczyt, jaki zdarza się raz w życiu."
 gdp_glorification_decision_confirm: "Niech świętują"
 gdp_glorification_artifact_tt: "Otrzymujesz [artifact|El] – #V medalion chwały obywatelskiej#!"
 gdp_glorification_artifact_name: "Medalion chwały obywatelskiej"
 gdp_glorification_artifact_desc: "Pamiątkowy medalion wręczony przez obywateli miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ku czci ukochanego władcy, którym jest [ROOT.Char.GetTitleAsNameNoTooltip]."
 gdp_popular_mandate_decision_toast: "Poparcie ludu zapewnione"
 gdp_civic_labor_decision_toast: "Obywatele zmobilizowani do pracy"
 gdp_popular_gifts_decision_toast: "Patrycjusze odpowiadają na wezwanie"
 gdp_glorification_decision_toast: "Miasto świętuje"
 gdp_fund_alms_decree_decision: "Rozdaj jałmużnę w stolicy"
 gdp_fund_alms_decree_decision_desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] mam obowiązek zapewnić dobrobyt mieszkańcom miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Istnieje wiele powodów, by dawać jałmużnę, na przykład pomoc potrzebującym, zwiększanie dobrobytu miasta oraz wzmacnianie więzi spajających nasze społeczeństwo.\n\nNiezależnie od motywacji, troska o ubogich jest niezawodnym sposobem na zadbanie o przychylność ludu."
 gdp_fund_alms_decree_decision_tooltip: "Daj jałmużnę ubogim w miejscu o nazwie [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 gdp_fund_alms_decree_decision_confirm: "Daj jałmużnę"
 gdp_tax_holiday_decree_decision: "Ulga podatkowa"
 gdp_tax_holiday_decree_decision_desc: "W nadchodzących latach podatki nakładane na obywateli miejsca znanego jako [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] zostaną obniżone. Skarb poniesie koszty, ale przychylność ludu jest warta swojej ceny."
 gdp_tax_holiday_decree_decision_tooltip: "Obniż podatki miejskie w mieście [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aby poprawić [Concept('popular_opinion', 'powszechną opinię')|E]"
 gdp_tax_holiday_decree_decision_confirm: "Umórz podatki miejskie"
 gdp_debt_forgiveness_decree_decision: "Umorzenie długu"
 gdp_debt_forgiveness_decree_decision_desc: "Wielu obywateli miasta [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] jest obciążonych długami, których nie są w stanie spłacić. Umarzając ich zobowiązania wobec miasta, możemy przynieść im ulgę, a w zamian zyskać ich lojalność. Nie wszyscy pochwalą takie wykorzystanie skarbu, ale władca, za którym stoi lud, stąpa po pewnym gruncie."
 gdp_debt_forgiveness_decree_decision_tooltip: "Umórz długi obywateli w mieście [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aby znacznie poprawić [Concept('popular_opinion', 'powszechną opinię')|E]"
 gdp_debt_forgiveness_decree_decision_confirm: "Anuluj długi"
 gdp_debt_forgiveness_upset_patricians_tt: "Każdy [vassal|El] bez [Concept('house_ambition', 'ambicji rodu')|E] „[GetHouseAspiration( 'republic_communal' ).GetName|V]”"
 gdp_debt_forgiveness_pleased_patricians_tt: "Każdy [vassal|El] z [Concept('house_ambition', 'ambicją rodu')|E] „[GetHouseAspiration( 'republic_communal' ).GetName|V]”"
 gdp_finance_war_decree_decision: "Sfinansuj działania wojenne"
 gdp_finance_war_decree_decision_desc: "Wojna jest straszna, a przede wszystkim #EMP kosztowna#!. Jeśli zajdzie taka potrzeba, możemy pobrać dodatkowe podatki wojenne, aby zdobyć środki na prowadzenie działań wojennych."
 gdp_finance_war_decree_decision_tooltip: "Pobierz dodatkowe podatki, aby sfinansować trwające wojny"
 gdp_finance_war_decree_decision_confirm: "Pobór podatku wojennego"
 finance_war_patrician_tax_name: "Podatek arystokratyczny"
 finance_war_patrician_tax_desc: "$finance_war_patrician_tax_name$"
 finance_war_patrician_tax_tooltip: "Nałóż na [Concept('patricians', 'patrycjuszy')|E] dodatkowy podatek"
 finance_war_citizen_tax_name: "Podatek obywatelski"
 finance_war_citizen_tax_desc: "$finance_war_citizen_tax_name$"
 finance_war_citizen_tax_tooltip: "Nałóż na [counties|El] dodatkowy podatek"
 every_patrician_tt: "Każdy [patrician|El]"
 gdp_war_approval_decree_decision: "Zażądaj aprobaty wojny"
 gdp_war_approval_decree_decision_desc: "Tylko z woli zgromadzenia możemy wypowiedzieć wojnę. Może się nie obejść bez posmarowania komu trzeba, aby zapewnić wystarczającą liczbę głosów, ale służy to wyższemu dobru."
 gdp_war_approval_decree_decision_tooltip: "Zażądaj od [Concept('assembly', 'zgromadzenia')|E] zgody na wypowiedzenie [Concept('war', 'wojny')|E]"
 gdp_war_approval_decree_decision_confirm: "Zażądaj aprobaty wojny"
 gdp_war_approval_decree_decision_effect_desc: "Masz już pozwolenie na wypowiedzenie [Concept('war', 'wojny')|E]"
 must_have_assembly_approval_declare_war_desc: "#bold Nie#! masz aprobaty [assembly_possessive|El] na wypowiedzenie [Concept('war', 'wojny')|E]"
 gained_assembly_approval_declare_war_desc: "Zyskujesz aprobatę [assembly_possessive|El] na wypowiedzenie [Concept('war', 'wojny')|E]"
 gdp_banishment_approval_decree_decision: "Poproś o zgodę na wygnanie"
 gdp_banishment_approval_decree_decision_named: "Poproś o wygnanie osoby znanej jako [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNotMeNoTooltipNoFormat]"
 gdp_banishment_approval_decree_decision_desc: "Są wśród nas tacy, którzy nie mogą znieść naszych rządów i których nasze rządy nie mogą już dłużej znosić. Za zgodą zgromadzenia możemy [banish|El] ich z naszego państwa, usuwając niebezpieczny element bez ryzyka śmiertelnej waśni, jaką pociągnęłoby za sobą bardziej drastyczne rozwiązanie."
 gdp_banishment_approval_decree_decision_tooltip: "Zażądaj od [Concept('assembly', 'zgromadzenia')|E] zgody na [Concept('banish', 'wygnanie')|E] postaci, którą oskarżasz"
 gdp_banishment_approval_decree_decision_confirm: "Poproś o zgodę na wygnanie"
 gdp_banishment_approval_decree_decision_effect_desc: "Uzyskujesz zgodę na [Concept('banish', 'wygnanie')|E] osoby znanej jako [indicted_character.GetShortUINameNotMe]"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "Uzyskujesz zgodę na [Concept('banish', 'wygnanie')|E] postaci, którą oskarżasz"
 must_have_assembly_approval_banishment_desc: "#bold Nie#! masz zgody [assembly_possessive|El] na [Concept('banish', 'wygnanie')|E]"
 gained_assembly_approval_banishment_desc: "Masz już zgodę [assembly_possessive|El] na [Concept('banish', 'wygnanie')|E] osoby znanej jako [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNotMe]"
 gdp_proscription_approval_decree_decision: "Poproś o zgodę na proskrypcję"
 gdp_proscription_approval_decree_decision_named: "Poproś o proskrypcję rodu [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip]"
 gdp_proscription_approval_decree_decision_desc: "Genów nie oszukasz: krewni zdrajcy mają udział w jego skazie i noszą tę samą złość w swych wiarołomnych sercach. Jeśli zgromadzenie wyrazi zgodę, możemy [banish|El] całą ich rodzinę i pozbyć się zdradzieckiego rodu."
 gdp_proscription_approval_decree_decision_tooltip: "Poproś [assembly|El] o zgodę na [Concept('banish', 'wygnanie')|E] całej rodziny oskarżonej przez ciebie postaci"
 gdp_proscription_approval_decree_decision_confirm: "Poproś o zgodę na proskrypcję"
 gdp_proscription_approval_decree_decision_effect_desc: "Uzyskujesz zgodę na [Concept('banish', 'wygnanie')|E] całej rodziny osoby znanej jako [indicted_character.GetShortUINameNotMe]"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "Uzyskujesz zgodę na [Concept('banish', 'wygnanie')|E] całej rodziny oskarżonej przez ciebie postaci"
 must_have_assembly_approval_proscription_desc: "#bold Nie#! masz zgody [assembly_possessive|El] na [Concept('banish', 'wygnanie')|E] całej rodziny tej postaci"
 gained_assembly_approval_proscription_desc: "Masz już zgodę [assembly_possessive|El] na [Concept('banish', 'wygnanie')|E] całej rodziny osoby znanej jako [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNotMe]"
 gdp_execution_approval_decree_decision: "Poproś o zgodę na egzekucję"
 gdp_execution_approval_decree_decision_named: "Poproś o egzekucję osoby znanej jako [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNotMeNoTooltipNoFormat]"
 gdp_execution_approval_decree_decision_desc: "Mimo dobrotliwości naszych rządów wciąż są tacy, którzy zagrażają samym ich fundamentom. Stanowią tak wielkie niebezpieczeństwo, że nie zaznamy spokoju, dopóki oddychają; za zgodą zgromadzenia możemy ich [execute|El] i uspokoić nasz lud."
 gdp_execution_approval_decree_decision_tooltip: "Poproś [assembly|El] o zgodę na [Concept('execute', 'stracenie')|E] oskarżonej przez ciebie postaci"
 gdp_execution_approval_decree_decision_confirm: "Poproś o zgodę na egzekucję"
 gdp_execution_approval_decree_decision_effect_desc: "Uzyskujesz zgodę na [Concept('execute', 'stracenie')|E] osoby znanej jako [indicted_character.GetShortUINameNotMe]"
 gdp_execution_approval_decree_decision_effect_no_indicted_desc: "Uzyskujesz zgodę na [Concept('execute', 'stracenie')|E] oskarżonej przez ciebie postaci"
 must_have_assembly_approval_execution_desc: "#bold Nie#! masz aprobaty [assembly_possessive|El] na [Concept('execute', 'stracenie')|E] tej postaci"
 gained_assembly_approval_execution_desc: "Masz już aprobatę [assembly_possessive|El] na [Concept('execute', 'stracenie')|E] osoby znanej jako [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNotMe]"
 gdp_has_no_valid_indicted_character_desc: "#bold Nie#! masz nikogo oskarżonego przed [Concept('assembly', 'zgromadzeniem')|E]"
 gdp_has_no_valid_indicted_family_desc: "#bold Nie#! masz oskarżonej głowy [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E] przed [Concept('assembly', 'zgromadzeniem')|E]"
 gdp_indicted_family_head_is_player_desc: "Głowa oskarżonej [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E] #bold nie#! może być graczem"
 gdp_overthrow_government_decision: "Obal rząd"
 gdp_overthrow_government_decision_desc: "Władze tej republiki są zgniłe do szpiku kości. Nadszedł czas, aby przywrócić ten statek, jakim jest państwo, na właściwy kurs i usunąć z urzędów skorumpowane oraz nieudolne osoby, tak aby cnoty republikańskie znów mogły panować w miejscu znanym jako [ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nZnajdę stronników i razem sprawimy, że [ROOT.Char.GetLiege.GetNameNoTooltip] straci władzę."
 gdp_overthrow_government_decision_tooltip: "Obal obecny rząd [Concept('republic', 'republiki')|E] i obejmij nad nią władzę"
 gdp_overthrow_government_decision_confirm: "Precz z tyranami!"
 you_are_patrician_desc: "Jesteś [Concept('patrician', 'patrycjuszem')|E] bez ziemi."
 overthrow_government_effect_tooltip: "#WEAK Ta decyzja rozpocznie [hostile_scheme|El] mający na celu obalenie rządu.#!\n$EFFECT_LIST_BULLET$ Możesz zostać nowym [Concept('liege', 'seniorem')|E]\n$EFFECT_LIST_BULLET$ Twoi [rivals|El] lub wrogowie polityczni mogą opuścić [Concept('republic', 'republikę')|E]\n$EFFECT_LIST_BULLET$ Prawa republiki zostaną zmienione bez zgody [assembly_possessive|El] tak, aby dostosować je do ambicji twojego rodu\n@alert_icon! #alert_trial Spisek przeciwko państwu stanowi poważne [crime|El], jeśli zostanie odkryty#!"
 gdp_overthrow_agent_focus_balance: "Zrównoważony skład [Concept('agents', 'wspólników')|E]"
 gdp_overthrow_agent_focus_success: "Koncentracja na [Concept('agents', 'wspólnikach')|E] zwiększających [scheme_potential|El]"
 gdp_overthrow_agent_focus_speed: "Koncentracja na [Concept('agents', 'wspólnikach')|E] skracających [scheme_speed|El]"
 gdp_overthrow_agent_focus_secrecy: "Koncentracja na [Concept('agents', 'wspólnikach')|E] zwiększających [secrecy|El]"
 agent_focus_balance_tooltip: "$overthrow_government_interaction.tt.agent_focus_balance$"
 agent_focus_success_tooltip: "$overthrow_government_interaction.tt.agent_focus_success$"
 agent_focus_speed_tooltip: "$overthrow_government_interaction.tt.agent_focus_speed$"
 agent_focus_secrecy_tooltip: "$overthrow_government_interaction.tt.agent_focus_secrecy$"
 gdp_quarantine_ship_decree_decision: "30-dniowa kwarantanna"
 gdp_quarantine_ship_decree_decision_desc: "#bold Zgodnie z wolą zgromadzenia:#!\nWprowadzona zostanie trzydziestodniowa kwarantanna, aby powstrzymać rozprzestrzenianie się szkodliwych oparów, które są przyczyną zarazy i innych dolegliwości."
