l_polish:
 gdp_merchant_starting_capacity_modifier: "Przepustowość zwiększona"
 gdp_merchant_starting_capacity_modifier_desc: "Kompania tej postaci może przewozić większą ilość towarów."
 gdp_voluntary_merchant_modifier: "Kupiec z wyboru"
 gdp_voluntary_merchant_modifier_desc: "Ta postać zrzekła się swoich tytułów, by zdobyć renomę jako kupiec."
 gdp_patron_competitiveness_modifier: "Zachęta do konkurowania"
 gdp_patron_competitiveness_modifier_desc: "Patron tej postaci dał się przekonać, by rozszerzyć działalność jej kompanii."
 gdp_romance_fan_modifier: "Beznadziejny romantyk"
 gdp_romance_fan_modifier_desc: "Ta postać nie potrafi się oprzeć dobrej historii miłosnej."
 gdp_nepotism_modifier: "Wspieranie nepotyzmu"
 gdp_nepotism_modifier_desc: "Ta postać uważa, że rodzina jest najważniejsza bez względu na koszty."
 gdp_merit_modifier: "Wspieranie zasług"
 gdp_merit_modifier_desc: "Ta postać nie dba o źródło zysków."
 gdp_full_attention_modifier: "Biznesowe nastawienie"
 gdp_full_attention_modifier_desc: "Ta postać nie marnuje czasu na błahostki."
 gdp_responsible_modifier: "Obowiązkowość"
 gdp_responsible_modifier_desc: "Ta postać bierze na siebie swoje obowiązki, przynajmniej na razie."
 gdp_cooperation_modifier: "Współpraca między rodami"
 gdp_cooperation_modifier_desc: "Ta postać zdecydowała się współpracować z innym rodem dla wspólnych korzyści."
 gdp_guild_master_inpiration_diplomacy_modifier: "Wskazówki dyplomatyczne"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "Ta postać zwróciła się po wskazówki do mistrza gildii posiadającego duże umiejętności dyplomatyczne."
 gdp_guild_master_inpiration_learning_modifier: "Porada naukowa"
 gdp_guild_master_inpiration_learning_modifier_desc: "Ta postać zwróciła się o radę do uczonego mistrza gildii."
 gdp_guild_master_inpiration_stewardship_modifier: "Lekcja finansów"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "Ta postać zwróciła się o pomoc do mistrza gildii."
 gdp_boasted_market_competence_modifier: "Sprawdzone kompetencje rynkowe"
 gdp_boasted_market_competence_modifier_desc: "Kiedy patron poprosił tę postać, by przed szlachtą odgrywała rolę błazna, ta obróciła sytuację na swoją korzyść."
 gdp_driven_by_motivation_modifier: "Kierowanie się ambicją"
 gdp_driven_by_motivation_modifier_desc: "Ta postać dokłada wszelkich starań, by zapewnić korzyści właścicielowi swojej kompanii."
 gdp_promoted_diligence_modifier: "Skrupulatność promowana"
 gdp_promoted_diligence_modifier_desc: "Ta postać została zmuszona przez głowę swojego rodu do podwojenia wysiłków w pracy, nawet kosztem własnego zdrowia."
 gdp_promoted_excess_modifier: "Nadmiar promowany"
 gdp_promoted_excess_modifier_desc: "Ta postać została zachęcona do odłożenia interesów na bok i życia w nadmiarze, czego efektem jest poprawa dyplomacji i pozycji publicznej kompanii."
 gdp_oasis_of_hope_modifier: "Oaza nadziei"
 gdp_oasis_of_hope_modifier_desc: "Ta grupa podróżników w cudowny sposób odnalazła na pustyni oazę i zdołała odzyskać siły."
 gdp_low_morale_entourage_modifier: "Świta o niskim morale"
 gdp_low_morale_entourage_modifier_desc: "Ta postać postanowiła kontynuować wędrówkę przez pustynię pomimo fali upałów."
 organize_the_venture_scheme_modifier: "Zorganizowane przedsięwzięcie"
 organize_the_venture_scheme_modifier_desc: "Ten spisek dotyczący kontraktu został objęty bardziej rygorystycznym harmonogramem i ściślejszym nadzorem."
 merchant_undercut_the_competition_modifier: "Bezwzględne zaniżanie cen"
 merchant_undercut_the_competition_modifier_desc: "Ta postać godzi się na niższe marże, aby wypchnąć rywali."
 merchant_cornering_the_market_modifier: "Opanowanie rynku"
 merchant_cornering_the_market_modifier_desc: "Ta postać wykorzystuje ostatnią presję handlową, aby umocnić swoją pozycję na rynku."
 merchant_public_benefactor_modifier: "Dobroczyńca publiczny"
 merchant_public_benefactor_modifier_desc: "Ta postać wspiera projekty publiczne w pobliżu siedziby swojej kompanii, przeznaczając zyski na budowanie pozytywnego wizerunku."
 merchant_private_profit_focus_modifier: "Prywatny zysk"
 merchant_private_profit_focus_modifier_desc: "Ta postać kieruje swoją kompanią, skupiając się na prywatnych marżach i korzyściach handlowych kosztem wizerunku w społeczeństwie."
 merchant_sponsored_public_works_county_modifier: "Sponsorowane projekty publiczne"
 merchant_sponsored_public_works_county_modifier_desc: "To hrabstwo odniosło korzyści dzięki projektom publicznym i sponsorowaniu infrastruktury przez kompanię kupiecką."
 gdp_merge_company_competitiveness_modifier: "Dominujący handlarz"
 gdp_merge_company_competitiveness_modifier_desc: "Ta postać zlikwidowała szlaki konkurencyjnej kompanii i zdominowała te rynki."
 gdp_merchant_full_larder_modifier: "Pełna spiżarnia"
 gdp_merchant_full_larder_modifier_desc: "Ta postać zachowała dla siebie żywność z głodującego rynku i od tamtej pory niczego jej nie brakowało."
 gdp_merchant_staying_vigilant: "Utrzymanie czujności"
 gdp_merchant_staying_vigilant_desc: "Ta postać spodziewa się odwetu za głód, który wywołała jej działalność handlowa, i bacznie obserwuje każdy cień."
 gdp_merchant_master_craft_tutelage_modifier: "Uczeń mistrza"
 gdp_merchant_master_craft_tutelage_modifier_desc: "Ta postać spędziła czas w warsztacie mistrza rzemiosła."
 gdp_thirsty_traveler_modifier: "Spragniony podróżnik"
 gdp_thirsty_traveler_modifier_desc: "Ta postać musiała odbyć długą podróż bez dostępu do wody."
 gdp_pure_waters_modifier: "Czysta woda"
 gdp_pure_waters_modifier_desc: "Kompania tej postaci jest zaopatrzona w czystą wodę i nie cierpi pragnienia."
 gdp_rationing_water_modifier: "Racjonowanie wody"
 gdp_rationing_water_modifier_desc: "Kompania tej postaci podlega ścisłemu, lecz skutecznemu racjonowaniu wody i zwalnia, poszukując jej źródeł."
 gdp_workout_modifier: "Zmęczone mięśnie"
 gdp_workout_modifier_desc: "Ścinanie drzew było dla tej postaci dobrym, choć wyczerpującym ćwiczeniem. Z czasem odzyska ona siły."
 gdp_cat_rats_modifier: "Koci pazur"
 gdp_cat_rats_modifier_desc: "Ta postać dzięki gorliwemu kotu mogła cieszyć się rejsem wolnym od gryzoni."
 gdp_fishing_modifier: "Radość z wędkowania"
 gdp_fishing_modifier_desc: "Ta postać z własnego doświadczenia wie, ile wart jest udany połów."
 gdp_catch_rats_modifier: "Polowanie na szczury"
 gdp_catch_rats_modifier_desc: "Ta postać została zmuszona do łapania szczurów w ciemnej, ciasnej ładowni statku, przypłacając to własnym zdrowiem."
 dedicated_trade_studies: "Poświęcenie naukom handlowym"
 dedicated_trade_studies_desc: "Ta postać zamiast służby cywilnej wybrała drogę handlu, z zaangażowaniem zgłębiając tajniki rynku."
 gdp_local_business_modifier: "Interesy lokalne"
 gdp_local_business_modifier_desc: "Ta postać zamiast gonić za majątkiem na dalekim Jedwabnym Szlaku postanowiła skupić swoje siły na pobliskich rynkach."
 gdp_silk_road_market_foothold_modifier: "Przyczółek na Jedwabnym Szlaku"
 gdp_silk_road_market_foothold_modifier_desc: "Ta postać niedawno przeniosła swoją kompanię na rynek Jedwabnego Szlaku i czerpie korzyści z nawiązanych tam kontaktów."
 tgp_silk_road_interesting_innovations_modifier: "Interesujące innowacje"
 tgp_silk_road_interesting_innovations_modifier_desc: "Ta postać zainteresowała się innowacjami Jedwabnego Szlaku i wróciła z podróży mądrzejsza."
 gdp_silk_road_bargain_modifier: "Targowanie się na Jedwabnym Szlaku"
 gdp_silk_road_bargain_modifier_desc: "Ta postać znalazła okazję do ubicia świetnego interesu na rynku Jedwabnego Szlaku."
 gdp_silk_road_market_investment_modifier: "Inwestycja w rynek Jedwabnego Szlaku"
 gdp_silk_road_market_investment_modifier_desc: "Ta postać zdecydowała, że inwestycja w rynek Jedwabnego szlaku może jej dać przewagę."
 gdp_merchant_legacy_3_ennobled_modifier: "Wiarygodny kupiec"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "Wybitny zmysł biznesowy tej postaci i jej kompanii doceniany jest na najznamienitszych salonach."
 gdp_merchant_legacy_3_rapacious_modifier: "Precyzja w księgowości"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "Ta postać przegląda wszystkie księgi kompanii i dzieli się wnioskami z kluczowymi partnerami."
