l_polish:
 #Side Switch Scheme
 gg_switch_sides: "Nakłoń do zmiany strony"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNotMeNoTooltip] wkrótce zrozumie, po której stronie #EMP należy#! stanąć w tej sytuacji…"
 gg_switch_sides_desc_general: "[scheme|E] „$gg_switch_sides$” to [political_scheme|El], który ma na celu przekonanie [Concept('scheme_target', 'celu spisku')|E] do zmiany stron w [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]”"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINameNotMe] dołącza do strony znanej jako [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_switch_sides_invalidated_title: "Zakończono @scheme_icon! spisek „$gg_switch_sides$”"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (spisek)#!"
 gg_switch_sides_action: "Nakłoń"
 scheme_interaction_tt_gg_switch_sides: "Spróbuj nakłonić osobę znaną jako [recipient.GetShortUINameNotMeNoTooltip] do przyłączenia się do strony, którą są [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNotMeNoTooltip] wciąż odczuwa rozczarowanie twoją ostatnią prośbą przekonania [recipient.Custom('PL_go_jej')] do przyłączenia się do strony, którą są [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 #Claim Leadership Scheme
 gg_claim_leadership: "Przejmij przywództwo"
 gg_claim_leadership_desc: "[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')] wkrótce zrozumieją, kto najlepiej nadaje się na ich przywódcę"
 gg_claim_leadership_desc_general: "[scheme|E] „$gg_claim_leadership$” to [political_scheme|El], którego celem jest, by [scheme_owner|El] stał się przywódcą swojej strony w [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]”. To [secret_scheme|El] oparty na [Concept('diplomacy', 'dyplomacji')|E], do którego można rekrutować [Concept('agents', 'wspólników')|E].\n\nIm wyższe [gg_involvement|El] [Concept('scheme_owner', 'inicjatora spisku')|E] w porównaniu do obecnego przywódcy, tym większa [scheme_success_chance|El]. Przewyższanie obecnego przywódcy [Concept('prestige_level', 'poziomem sławy')|E] również wspiera powodzenie spisku."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUINameNotMe] zostaje nowym przywódcą strony, którą są [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "Unikasz utraty [Concept('prestige', 'prestiżu')|E] i pogorszenia stosunków z osobą znaną jako [TARGET_CHARACTER.GetShortUINameNotMe]"
 gg_claim_leadership_invalidated_title: "Zakończono @scheme_icon! spisek „$gg_claim_leadership$”"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (spisek)#!"
 gg_claim_leadership_action: "Przejmij przywództwo"
 scheme_interaction_tt_gg_claim_leadership: "Spróbuj przejąć od osoby znanej jako [recipient.GetShortUINameNotMe] przywództwo nad stroną, którą są [recipient.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "Przekonaj niezdecydowanych"
 gg_align_undecided_desc: "Próba zmuszenia osoby znanej jako [SCHEME.GetTargetCharacter.GetShortUINameNotMeNoTooltip] do poparcia strony, którą są [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')|l]"
 gg_align_undecided_desc_general: "[scheme|E] „$gg_align_undecided$” to [political_scheme|El], którego celem jest, by [scheme_target|El] dołączył do strony [Concept('scheme_owner', 'inicjatora spisku')|E] w [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]”"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINameNotMe] to od teraz [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]"
 gg_align_undecided_invalidated_title: "Zakończono @scheme_icon! spisek „$gg_align_undecided$”"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (spisek)#!"
 gg_align_undecided_action: "Przekonaj"
 scheme_interaction_tt_gg_align_undecided: "Spróbuj przekonać osobę znaną jako [recipient.GetShortUINameNotMe] do dołączenia do strony, którą są [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "Zastąp władcę"
 gg_replace_ruler_desc: "Służba osoby znanej jako [SCHEME.GetTargetCharacter.GetShortUINameNotMeNoTooltip] nie jest nam już potrzebna – trzeba ją zastąpić kimś nieco bardziej… #EMP rozsądnym#!."
 gg_replace_ruler_desc_general: "[scheme|E] „$gg_replace_ruler$” to [political_scheme|El], którego celem jest, by [scheme_target|El] został zastąpiony władcą bardziej lojalnym wobec strony [Concept('scheme_owner', 'inicjatora spisku')|E] w [Concept('situation', 'sytuacji')|E] „[guelph_ghibelline_situation|E]”"
 GG_REPLACE_RULER_SUCCESS_DESC: "Osoba znana jako [TARGET_CHARACTER.GetShortUINameNotMe] zostaje zastąpiona przez lojalistę strony, którą są [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 GG_REPLACE_RULER_DISCOVERY_DESC: "Unikasz utraty [Concept('prestige', 'prestiżu')|E] i pogorszenia stosunków z osobą znaną jako [TARGET_CHARACTER.GetShortUINameNotMe]"
 gg_replace_ruler_invalidated_title: "Zakończono @scheme_icon! spisek „$gg_replace_ruler$”"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (spisek)#!"
 gg_replace_ruler_action: "Zastąp"
 scheme_interaction_tt_gg_replace_ruler: "Spróbuj zastąpić osobę znaną jako [recipient.GetShortUINameNotMe] lojalistą strony, którą są [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNotMeNoTooltip] wciąż ma się na baczności po twojej ostatniej próbie zastąpienia [recipient.Custom('PL_go_jej')]"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "W [Concept('situation_phase_phase', 'fazie')|E] „[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]” nie można zastąpić przywódcy strony ([GetSituation('guelph_ghibelline').GetName|l])"
 #Invalidation
 scheme_gg_situation_ended: "Zakończono sytuację „[guelph_ghibelline_situation|E]”"
 scheme_owner_not_aligned: "Nie jesteś już [Concept('guelph', 'gwelfem')|E] ani [Concept('ghibelline', 'gibelinem')|E]"
 scheme_target_not_aligned: "[target.GetShortUINameNotMe] nie jest już [Concept('guelph', 'gwelfem')|E] ani [Concept('ghibelline', 'gibelinem')|E]"
 scheme_target_not_undecided: "[target.GetShortUINameNotMe] to już nie [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'undecided' ).GetName|l]"
 scheme_owner_not_in_gg_situation: "Nie bierzesz już udziału w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”"
 scheme_target_not_in_gg_situation: "[target.GetShortUINameNotMe] nie bierze już udziału w [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”"
 scheme_target_already_your_side: "[target.GetShortUINameNotMe] to już [target.Custom('GetGuelphsGhibellinesConcept')|l]"
 scheme_target_is_titleless: "[target.GetShortUINameNotMe] nie posiada już żadnych tytułów"
 scheme_target_might_get_displaced: "[target.GetShortUINameNotMe] jest głównym obrońcą w [Concept('war', 'wojnie')|E] o nazwie [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]"
 scheme_target_might_get_reinstated: "[target.GetShortUINameNotMe] jest głównym obrońcą w [Concept('war', 'wojnie')|E] o nazwie [GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|V]"
 scheme_owner_is_already_leader: "Jesteś już przywódcą strony, którą są [owner.Custom('GetGuelphsGhibellinesConcept')|l]"
 scheme_target_no_longer_gg_leader: "[target.GetShortUINameNotMe] nie jest już dłużej przywódcą grupy, którą są [owner.Custom('GetGuelphsGhibellinesConcept')|l]"
