 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$: sukces"
 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U] – transporty na tym szlaku nie będą miały możliwości przewiezienia wszystkich towarów, które niegdyś mogły zabrać. Niech [target.GetShortUINameNotMe] zachodzi w głowę, czemu nie zgadzają [target.Custom('PL_mu_jej')] się rachunki."
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U] – transporty na tym szlaku straciły pierwszeństwo i przywileje, jakimi niegdyś cieszyły się na rynkach. Niech [target.GetShortUINameNotMe] przekona się, jak trudno teraz zarobić."
 gdp_trade_scheme.0012.desc_discovered: "\n\nJednego z moich ludzi jednak nakryto, a trop może doprowadzić do mnie."
 gdp_trade_scheme.0012.a: "Życzę powodzenia."
 gdp_trade_scheme.0012.a_discovered: "Gra warta świeczki."
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$: porażka"
 gdp_trade_scheme.0013.desc: "Mimo naszych usilnych starań [target.GetShortUINameNotMe] radzi sobie w handlu równie dobrze jak zawsze."
 gdp_trade_scheme.0013.desc_discovered: "\n\nNa dodatek jednego z moich handlarzy przyłapano na gorącym uczynku. To plama na honorze mego rodu."
 gdp_trade_scheme.0013.a: "Aż krew się burzy."
 gdp_destroyed_republic_opinion: "Zniszczono moją republikę"
 gdp_smuggler_opinion: "Przemytnictwo"
