l_polish:
 gdp_improve_trade_capacity: "Zwiększ przepustowość handlu"
 gdp_improve_trade_capacity_action: "Zwiększ przepustowość handlu"
 gdp_improve_trade_capacity_desc: "Z mojego polecenia ludzie szukają sposobów, by zwiększyć przepustowość szlaków handlowych pod moją kontrolą."
 gdp_improve_trade_capacity_desc_general: "„$gdp_improve_trade_capacity$” to [trade_scheme|El], w ramach którego [merchant|El] lub [patrician|El] kieruje swoich ludzi do pracy nad zwiększeniem [Concept('trade_route_capacity', 'przepustowości')|E] jednego ze swoich [Concept('trade_routes', 'szlaków handlowych')|E]."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "[capacity|E] wybranego [Concept('trade_route', 'szlaku handlowego')|E] wzrasta na #V 15 lat#!"
