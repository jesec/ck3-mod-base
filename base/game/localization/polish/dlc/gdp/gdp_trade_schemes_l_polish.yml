 gdp_improve_trade_capacity_decision_success_tt: "Jeśli [scheme|El] się powiedzie – [selected_item.GetName|l] pod wpływem modyfikatora „[GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip]” na #V 15#!lat"
 gdp_improve_trade_competitiveness_decision_success_tt: "Jeśli [scheme|El] się powiedzie – [selected_item.GetName|l] pod wpływem modyfikatora „[GetModifier('gdp_improve_trade_routes_competitiveness_modifier').GetNameWithTooltip]” na #V 15#!lat"
 gdp_improve_trade_expertise_decision_success_tt: "Jeśli [scheme|El] się powiedzie – [selected_item.GetName|l] pod wpływem modyfikatora „[GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip]” na #V 15#!lat"
 gdp_improve_trade_routes_capacity_modifier: "Ulepszona logistyka"
 gdp_improve_trade_routes_competitiveness_modifier: "Ugruntowane interesy"
 gdp_improve_trade_routes_expertise_modifier: "Wytrawni handlarze"
 gdp_improve_trade_capacity_decision: "Spisek handlowy: przepustowość"
 gdp_improve_trade_capacity_decision_desc: "Wiem, że część towarów zostawiamy, bo nasi handlarze nie są w stanie zabrać wszystkiego naraz. Trochę inwestycji, kilka usprawnień i już wkrótce zaznaczymy swoją obecność na każdym rynku, który odwiedzimy. Kwestia czasu."
 gdp_improve_trade_capacity_decision_tooltip: "Rozpocznij [scheme|El] „[GetScheme('gdp_improve_trade_capacity').GetTypeName]” na wybranym [Concept('trade_route', 'szlaku handlowym')|E]"
 gdp_improve_trade_capacity_decision_confirm: "Znajdź ręce do pracy i miejsce na towar."
 gdp_improve_trade_capacity_decision_effect_tt: "Rozpocznij [scheme|El] „[GetScheme('gdp_improve_trade_capacity').GetTypeName]”, którego cel to [selected_item.GetName|l]"
 gdp_improve_trade_competitiveness_decision: "Spisek handlowy: konkurencyjność"
 gdp_improve_trade_competitiveness_decision_desc: "Na części rynków, które moi handlarze odwiedzają regularnie, panuje zacięta rywalizacja. Wystarczy wcisnąć trochę monet we właściwe ręce i ubić parę interesów z miejscowymi, a moi handlarze zyskają pierwszeństwo przed konkurencją."
 gdp_improve_trade_competitiveness_decision_tooltip: "Rozpocznij [scheme|El] „[GetScheme('gdp_improve_trade_competitiveness').GetTypeName]” na wybranym [Concept('trade_route', 'szlaku handlowym')|E]"
 gdp_improve_trade_competitiveness_decision_confirm: "Załatw nam lepsze przyjęcie."
 gdp_improve_trade_competitiveness_decision_effect_tt: "Rozpocznij [scheme|El] „[GetScheme('gdp_improve_trade_competitiveness').GetTypeName]”, którego cel to [selected_item.GetName|l]"
 gdp_improve_trade_expertise_decision: "Spisek handlowy: doświadczenie"
 gdp_improve_trade_expertise_decision_desc: "Handlarze donoszą mi, że na części szlaków raz po raz popełniamy te same błędy. Czas wyciągnąć wnioski z naszych doświadczeń i zadbać, by działalność na szlakach przebiegała najsprawniej, jak to możliwe."
 gdp_improve_trade_expertise_decision_tooltip: "Rozpocznij [scheme|El] „[GetScheme('gdp_improve_trade_expertise').GetTypeName]” na wybranym [Concept('trade_route', 'szlaku handlowym')|E]"
 gdp_improve_trade_expertise_decision_confirm: "Przydziel ich do jednego szlaku."
 gdp_improve_trade_expertise_decision_effect_tt: "Rozpocznij [scheme|El] „[GetScheme('gdp_improve_trade_expertise').GetTypeName]”, którego cel to [selected_item.GetName|l]"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$: sukces"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName] to szlak, który wreszcie funkcjonuje tak, jak powinien. Handlarze donoszą, że nareszcie przewozimy więcej towarów, zgodnie z moimi oczekiwaniami."
 gdp_trade_scheme.0002.a: "To było warte każdej wydanej monety."
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: porażka"
 gdp_trade_scheme.0003.desc: "Mimo moich usilnych starań szlak handlowy działa tak samo jak wcześniej. To frustrujące, ale czasem tak właśnie działa rynek."
 gdp_trade_scheme.0003.a: "Czas wrócić do ksiąg."
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: sukces"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName] to szlak, który wreszcie przynosi oczekiwane zyski. Moi handlarze mają pierwszeństwo przed konkurencją, dzięki czemu zarabiamy więcej niż wcześniej."
 gdp_trade_scheme.0004.a: "Dary i przysługi nie poszły na marne."
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$: sukces"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName] – nasza działalność na tym szlaku przebiega sprawniej. Popełniamy mniej błędów, a wnioski, które wyciągnęliśmy z naszych doświadczeń, staną się fundamentem pomyślności mojego rodu."
 gdp_trade_scheme.0005.a: "To dopiero początek."
 gdp_disrupt_trade_routes: "Zakłócaj funkcjonowanie szlaków handlowych"
 gdp_disrupt_trade_routes_action: "Zakłócaj funkcjonowanie szlaków handlowych osoby znanej jako"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNotMe] handluje na moich rynkach. Wystarczy przekupić paru urzędników i rozpuścić odpowiednią plotkę, by zaszkodzić działalności na jednym z [SCHEME.GetTargetCharacter.GetHerHis] [Concept('trade_routes', 'szlaków handlowych')|E]."
 gdp_disrupt_trade_routes_desc_general: "„$gdp_disrupt_trade_routes$” to [hostile_scheme|El], w ramach którego [merchant|El] lub [patrician|El] dąży do zakłócenia funkcjonowania [Concept('trade_route', 'szlaku handlowego')|E] rywala. Opiera się na [Concept('intrigue', 'intrydze')|E] i pozwala werbować [Concept('agents', 'wspólników')|E]."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "Funkcjonowanie jednego ze [Concept('trade_routes', 'szlaków handlowych')|E], których właścicielem jest [TARGET_CHARACTER.GetShortUINameNotMe], zostaje pogorszone na #N 20 lat#!"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "Twoje zakłócanie funkcjonowania [Concept('trade_routes', 'szlaków handlowych')|E] rywala nie wyszło na jaw"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "Ty i [target.GetShortUINameNotMe] dzielicie [trade_market|El]: $VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! Zakończono spisek „$gdp_disrupt_trade_routes$”"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.GetShortUINameNotMe] nie utrzymuje już własnych [Concept('trade_routes', 'szlaków handlowych')|E]"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUINameNotMe] nie utrzymuje już własnych [Concept('trade_routes', 'szlaków handlowych')|E]"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUINameNotMe] nie ma już ani jednego [Concept('trade_routes', 'szlaku handlowego')|E], którego funkcjonowanie można by zakłócić"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUINameNotMe] posiada co najmniej jeden [trade_route|El]"
 gdp_disrupt_trade_routes_capacity_modifier: "Zakłócona logistyka"
 gdp_disrupt_trade_routes_competitiveness_modifier: "Nadszarpnięta reputacja"
 gdp_disrupt_trade_routes_discovered_opinion: "Zakłócono funkcjonowanie moich szlaków handlowych"
 gdp_disrupt_trade_routes_target_notification: "[disrupted_trade_route.GetName] – problemy"
 gdp_disrupt_trade_routes_target_notification_tt: "Na jednym z moich [Concept('trade_routes', 'szlaków handlowych')|E] dzieje się coś złego. Moi handlarze nie potrafią powiedzieć, co."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "Jeden z moich [Concept('trade_routes', 'szlaków handlowych')|E] funkcjonuje fatalnie. Moi handlarze ustalili, że winę za to ponosi [owner.GetShortUINameNotMe]."
 gdp_disrupt_trade_routes_target_caught_notification: "Ujawniono sabotaż"
 gdp_disrupt_trade_routes_target_caught_tt: "Wychodzi na to, że [owner.GetShortUINameNotMe] spiskuje. Na moim [Concept('trade_routes', 'szlaku handlowym')|E] schwytano [owner.Custom('PL_jego_jej')] sługusa, który przyznał, po co go tam wysłano."
