 gdp_disrupt_trade_routes_effect_tt: "Jeśli się powiedzie: funkcjonowanie jednego ze [Concept('trade_routes', 'szlaków handlowych')|E], których właścicielem jest [recipient.GetShortUINameNotMe], zostanie pogorszone na #N 20 lat#!"
