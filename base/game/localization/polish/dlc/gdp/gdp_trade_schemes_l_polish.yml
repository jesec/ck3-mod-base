 gdp_improve_trade_competitiveness: "Zwiększ konkurencyjność handlową"
 gdp_improve_trade_competitiveness_action: "Zwiększ konkurencyjność handlową"
 gdp_improve_trade_competitiveness_desc: "Z mojego polecenia ludzie szukają sposobów, by zapewnić moim szlakom pierwszeństwo przed konkurencją."
 gdp_improve_trade_competitiveness_desc_general: "„$gdp_improve_trade_competitiveness$” to [trade_scheme|El], w ramach którego [merchant|El] lub [patrician|El] kieruje swoich ludzi do pracy nad zwiększeniem [Concept('trade_competitiveness', 'konkurencyjności handlowej')|E] na jednym ze swoich [Concept('trade_routes', 'szlaków handlowych')|E]."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "[competitiveness|E] wybranego [Concept('trade_route', 'szlaku handlowego')|E] wzrasta na #V 15 lat#!"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! Zakończono spisek „$gdp_improve_trade_competitiveness$”"
 gdp_improve_trade_expertise: "Zwiększ doświadczenie handlowe"
 gdp_improve_trade_expertise_action: "Zwiększ doświadczenie handlowe"
 gdp_improve_trade_expertise_desc: "Z mojego polecenia ludzie szukają sposobów na usprawnienie naszej działalności na szlakach, tak byśmy wszyscy znali właściwych ludzi i uczyli się na popełnionych błędach."
 gdp_improve_trade_expertise_desc_general: "„$gdp_improve_trade_expertise$” to [trade_scheme|El], w ramach którego [merchant|El] lub [patrician|El] kieruje swoich ludzi do pracy nad przyspieszeniem tempa wzrostu [Concept('trade_expertise', 'doświadczenia handlowego')|E] na jednym ze swoich [Concept('trade_routes', 'szlaków handlowych')|E]."
