l_polish:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "W końcu położono fundamenty naszej republiki! Małostkowi tyrani i ich najemni siepacze nie będą już przykuwać nas do pługa i orki. Ich waśnie nie będą już sprowadzać na nas bólu ani cierpienia.\n\nTeraz, zjednoczeni w jedną komunę, sami będziemy kształtować nasz los i obronimy ciężko wywalczoną wolność. Niech nasze miasto stanie się latarnią nadziei, a mury tarczą przeciw tyranii."
 republic_event.0001.a: "To początek nowej epoki!"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "Dawne obyczaje dobrze nam służyły i zawsze będziemy je szanować. Ale sala klanu nie pomieści już tego, czym się staliśmy. Targi, mury i wola ludu domagają się teraz innego rodzaju rządów.\n\nDziś porzucamy rządy [Concept('tribal', 'plemienne')|E] i zakładamy [Concept('republic', 'republikę')|E]. Niech miasto przemówi jednym głosem – i niech będzie to nasz głos."
 republic_event.0002.a: "Miasto to zapamięta"
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "Niniejszym informuję, że z dniem dzisiejszym cofam Twoje pozwolenie na prowadzenie faktorii w miejscu znanym jako [actor.GetCapitalLocation.GetBaronyNameExplicitly].\n\nLeży to, rzecz jasna, w najlepszym interesie miejsca o nazwie [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]. Z pewnością to zrozumiesz."
 republic_event.0010.a: "Ale to była #EMP moja#! faktoria!"
 republic_event.0012.desc: "Od dziś miejsce znane jako [trade_post_target_county.GetNameNoTierNoTooltip] zamyka przed Tobą swoje bramy! Twoje prawa handlowe zostają cofnięte. Wszystko, co masz tam wartościowego, zostanie skonfiskowane, a faktora zrównana z ziemią."
 republic_event.0012.a: "Muszę znaleźć nowy dom dla moich towarów…"
 republic_event.0020.t: "Skarbiec [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 republic_event.0020.intro: "Pora zweryfikować budżet, którym dysponuje republika."
 republic_event.0020.steward_desc: "[steward.GetShortUINameNotMe] stoi przede mną z marsową miną, ściskając w dłoni księgę. Za [steward.Custom('PL_nim_nia')] kroczy mała armia pomocników obładowanych zwojami, opasłymi tomiszczami i stosami notatek finansowych.\n\n– Niech [ROOT.Char.GetTitleAsNameNoTooltip] posłucha. #EMP Musimy#! pilnie omówić nasze wydatki i przygotować nowy budżet uwzględniający zasobność skarbca. Obawiam się, że ta sprawa nie może dłużej czekać."
 republic_event.0020.solo_desc: "Otacza mnie niewielka armia urzędników obładowanych zwojami, opasłymi tomiszczami i stosami notatek finansowych. Wszyscy oczekują, aż zakończę swoją analizę.\n\n"
 republic_event.0020.income_desc: "Nasze obecne dochody znacznie przekraczają wydatki. Można to wszystko lepiej wykorzystać."
 republic_event.0020.deficit_desc: "Nasze wydatki są zbyt duże i jeśli nie podejmiemy działań, skarbiec opustoszeje."
 republic_event.0020.fallback_desc: "Od uchwalenia ostatniego budżetu minęło już wiele lat."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUINameNotMe] przeprowadza analizę budżetu i stwierdza, że wszystko jest w porządku. Nie wprowadza żadnych zmian."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "Przede mną rozłożono kilka dokumentów z propozycjami, z których każda wyznacza inny kurs dla skarbca: jedne wskazują, gdzie inwestować, inne, gdzie należy zacisnąć pasa.\n\nKtórą ścieżkę obrać?"
 republic_event.0021.a: "Zadbaj, by wszyscy otrzymali godziwe wynagrodzenie."
 republic_event.0021.b: "Najlepiej stosować zrównoważone wynagrodzenia."
 republic_event.0021.c: "Najrozsądniej będzie przeznaczyć dodatkowe fundusze na potrzeby państwa."
 republic_event.0021.a.info_desc: "Priorytet [Concept('treasury_budget_category', 'kategorii budżetu')|E]: @gold_icon! [treasury_salary_budget_short|El]\nWysokie płace zwykle przypadają do gustu większości [Concept('patricians', 'patrycjuszy')|E]"
 republic_event.0021.b.info_desc: "Priorytet [Concept('treasury_budget_category', 'kategorii budżetu')|E]: @law_icon! równowaga\nDobrze zrównoważony budżet zapewnia [Concept('patricians', 'patrycjuszom')|E] godziwe wynagrodzenie, a jednocześnie pozostawia wystarczająco dużo środków w [Concept('treasury', 'skarbcu')|E] dla [Concept('liege', 'seniora')|E]"
 republic_event.0021.c.info_desc: "Priorytet [Concept('treasury_budget_category', 'kategorii budżetu')|E]: @treasury_icon! państwo\nSkromne wynagrodzenia pozostawiają w skarbcu więcej zasobów dla republiki, dając [Concept('liege', 'seniorowi')|E] dodatkowe fundusze do dowolnego rozdysponowania"
 republic_event.0030.desc: "Z przykrością informuję, że cofam wszystkie Twoje monopole na moich rynkach. Handel musi płynąć swobodnie."
 republic_event.0030.a: "Będziemy musieli konkurować jak wszyscy inni…"
 republic_event.0040.desc: "Z żalem informuję, iż nie ma już dla ciebie miejsca w konfederacji o nazwie [actor.GetConfederation.GetName]."
 republic_event.0040.a: "Znów rywalizujemy"
 republic_event.0050.desc: "Zgromadzenie, którego mocodawca to [title.GetName], powierzyło mi zaszczytny urząd, którym jest [new_holder.GetTitleAsNameNoTooltip], [new_holder.Custom('GetRepublicTermLength')]."
 republic_event.0051.desc: "Ponownie powierzono mi urząd – [new_holder.Custom('GetRepublicTermLength')]. Niech żyje [title.GetName]."
 republic_term_length_1_desc: "na okres [EmptyScope.ScriptValue('law_term_length_1_value')|0] lat"
 republic_term_length_2_desc: "na okres [EmptyScope.ScriptValue('law_term_length_2_value')|0] lat"
 republic_term_length_3_desc: "na okres [EmptyScope.ScriptValue('law_term_length_3_value')|0] lat"
 republic_term_length_4_desc: "na okres [EmptyScope.ScriptValue('law_term_length_4_value')|0] lat"
 republic_term_length_5_desc: "na okres [EmptyScope.ScriptValue('law_term_length_5_value')|0] lat"
 republic_term_length_indefinite_desc: "dożywotnio"
 republic_event.0052.desc: "Przedkładam dostojnym członkom zgromadzenia projekt nowego prawa.\n\nProjekt ustawy „[new_law.GetNameNoTooltip]” zostanie poddany pod głosowanie po dokładnym przeanalizowaniu go."
 republic_event.0053.pass.desc: "Projekt ustawy „[new_law.GetNameNoTooltip]” został zatwierdzony i stał się prawem obowiązującym w republice!"
 republic_event.0053.rejected.desc: "Projekt ustawy „[new_law.GetNameNoTooltip]” został odrzucony przez zgromadzenie."
 republic_event.law.TT: "#bold Zaproponowano:#! „[new_law.GetName]”"
 republic_event.law_passed.TT: "#bold #P Zatwierdzono:#!#! „[new_law.GetName]”"
 republic_event.law_rejected.TT: "#bold #N Odrzucono:#!#! „[new_law.GetName]”"
 republic_event.law_kept.TT: "#bold Zachowano:#! „[current_law.GetName]”"
 republic_event.assembly.response: "Rozumiem."
 republic_event.assembly.opening: "Drodzy obywatele!"
 rescind_trade_monopoly_notification_base_desc: "Anulowano wszystkie [trade_monopolies|El] na [Concept('trade_markets', 'rynkach handlowych')|E] osoby znanej jako [actor.GetShortUINameNotMe], które posiada:"
 rescind_trade_monopoly_notification_confederation_desc: "Konfederacja o nazwie [recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "Twoja [company|El]"
 republic_event.0100.t: "Republika Rzymska"
 republic_event.0100.desc: "Rzym. Wypowiadać to słowo nie jako nazwę miasta, lecz jako symbol, #EMP ideał#! – o tym od dawna marzyło wielu. Dziś to marzenie staje się rzeczywistością.\n\nSłyszę odgłosy świętowania dobiegające z każdego zakątka państwa. Obywatele – nie, #EMP Rzymianie#! – doczekają jutra, w którym znów będziemy centrum cywilizacji. Teraz zaczyna się praca nad przywróceniem utraconych ideałów starożytności. Musimy stać się latarnią nadziei, światłem, które poprowadzi nas w tych mrocznych czasach."
 republic_event.0100.a: "Wszystkie drogi znów będą prowadzić do Rzymu."
 republic_event.0100.b: "Rzym to nie tylko miejsce, to ideał."
