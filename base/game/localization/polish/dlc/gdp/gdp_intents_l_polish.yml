l_polish:
 schmooze_intent: "Spoufalanie się"
 schmooze_intent_desc: "Chcesz zwiększyć skuteczność handlu i poprawić [competitiveness|El]."
 gdp_merchant_schmooze_modifier: "Spoufalanie się ze szlachtą"
 gdp_merchant_schmooze_modifier_desc: "Ta postać nawiązała dobre relacje z miejscowym szlachectwem na tym rynku podczas uczty."
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNotMeNoTooltip] spoufala się z osobą znaną jako [TARGET_CHARACTER.GetShortUINameNotMeNoTooltip]"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName] korzysta z możliwości spoufalenia się z postacią znaną jako [TARGET_CHARACTER.GetShortUINameNotMeNoTooltip]"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNotMeNoTooltip] spoufala się ze szlachtą"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName] korzysta z możliwości spoufalenia się ze szlachectwem"
 gdp_schmooze_events.1000.t: "Spoufalanie się z osobą znaną jako [schmoozee.GetFirstNameNoTooltip]"
 gdp_schmooze_events.1000.desc: "My, kupcy, musimy korzystać z okazji do bratania się ze szlachectwem. Mądre słowo bądź zacny podarunek mogą zagwarantować, że nikt nie stanie na przeszkodzie naszemu przedsięwzięciu ani nie wesprze rywala.\n\nOstrożnie staram się balansować między przyprawiającym o mdłości pochlebstwem a zbytnią bezpośredniością, robiąc wszystko, co w mojej mocy, aby osoba znana jako [schmoozee.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))], była mi przychylna."
 gdp_schmooze_events.1000.a: "– Proszę, niech [schmoozee.GetTitleAsNameNoTooltip] przyjmie ten podarunek."
 gdp_schmooze_events.1000.b: "– Taki skromny kupiec jak ja musi wzorować się na lepszych."
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip] uważa, że to zaszczyt"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip] przewraca oczami"
 gdp_schmooze_events.1000.c: "– Rozmowa z tobą to zaszczyt."
 gdp_schmooze_events.1000.d: "– [schmoozee.GetTitleAsNameNoTooltip] może zainteresować się wieloma towarami, którymi handluję!"
 gdp_schmooze_events.1010.t: "Zdrowa konkurencja"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName] i ja dzielimy się posiłkiem, na zmianę chwaląc się sukcesami naszych kompanii i delektując się przysmakami takimi jak [ROOT.Char.Custom('RegionalDrink')] i [ROOT.Char.Custom('GetExpensiveMeal')]."
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName] i ja siedzimy w cieniu, które daje nam [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], na zmianę chwaląc się sukcesami naszych kompanii."
 gdp_schmooze_events.1010.outro: "\n\nMimo naszych przechwałek najwyraźniej w wielu kwestiach się zgadzamy. Kto wie – być może przydamy się sobie nawzajem."
 gdp_schmooze_events.1010.a: "– Mogę zostawić cię w spokoju za pewną sumę."
 gdp_schmooze_events.1010.b: "– Masz to. I nie wchodź nam w drogę."
 gdp_schmooze_events.1010.c: "– Ty wychwalaj mnie, a ja będę wychwalać ciebie."
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip] wyraża zainteresowanie"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip] nie wyraża zainteresowania"
 gdp_schmooze_events.1010.d: "To nieodpowiednia chwila."
 gdp_schmooze_events.1030.t: "Podzielona uwaga"
 gdp_schmooze_events.1030.feast: "W miarę upływu wieczoru znajduję się pomiędzy dwoma stronami. Są to: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], czyli [schmoozee_1.GetTitledFirstName], i [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], czyli [schmoozee_2.GetTitledFirstName]. Szlachta leniwie debatuje o teoretycznych zasadach rządzących biznesem i handlem, delektując się przysmakiem takim jak [schmoozer.Custom('GetRegionalFish')] w wersji pieczonej."
 gdp_schmooze_events.1030.hunt: "W miarę trwania polowania znajduję się pomiędzy dwoma stronami. Są to: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], czyli [schmoozee_1.GetTitledFirstName], i [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], czyli [schmoozee_2.GetTitledFirstName]. Szlachta leniwie debatuje o teoretycznych zasadach rządzących biznesem i handlem, podczas gdy ogary szukają tropu."
 gdp_schmooze_events.1030.outro: "\n\nW końcu [schmoozee_1.GetFirstNameNoTooltip] zwraca się do mnie, aby rozstrzygnąć tę kwestię.\n\n– Daj spokój, przecież parasz się handlem, musisz mieć chyba jakąś opinię!"
 gdp_schmooze_events.1030.a: "– Porusza [schmoozee_1.GetTitleAsNameNoTooltip] bardzo delikatną kwestię."
 gdp_schmooze_events.1030.b: "– [schmoozee_2.GetTitledFirstNameNoTooltip] ma doskonałe rozeznanie w sytuacji."
 gdp_schmooze_events.1030.c: "– Wasze przemyślenia są naprawdę inspirujące."
 gdp_schmooze_events.1030.c.success: "Obydwie osoby czują się pochlebione"
 gdp_schmooze_events.1030.c.failure: "Obydwie osoby przewracają oczami"
 gdp_schmooze_events.1030.d: "– W żadnym razie nie mogę tego skomentować."
 gdp_schmooze_events.1050.t: "Ruch na rynku"
 gdp_schmooze_events.1050.feast: "Uczta ustaje na chwilę, aby goście mogli swobodnie porozmawiać, słudzy zaś dokończyć swoje obowiązki,"
 gdp_schmooze_events.1050.hunt: "Zatrzymujemy się, by podziwiać [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')] [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')], podczas gdy ogary i naganiacze mkną przed nami,"
 gdp_schmooze_events.1050.outro: "a ja podświadomie wyłuskuję wzrokiem najważniejsze postacie na naszych rynkach.\n\n[schmoozee_1.GetTitledFirstName] to przydatna znajomość w miejscu o nazwie [market_1.GetLocationTitle.GetNameNoTier], podobnie jak [schmoozee_2.GetTitledFirstName] w miejscu o nazwie [market_2.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.three: "Dostrzegam też osobę znaną jako [schmoozee_3.GetTitledFirstName], która urzęduje w miejscu znanym jako [market_3.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.a: "– [schmoozee_1.GetFirstNameNoTooltip]! Od dawna chcę z tobą porozmawiać!"
 gdp_schmooze_events.1050.b: "– [schmoozee_2.GetFirstNameNoTooltip]! Dotarły do mnie bardzo ciekawe wieści."
 gdp_schmooze_events.1050.c: "– [schmoozee_3.GetFirstNameNoTooltip]! Musimy uciąć sobie pogawędkę!"
 gdp_schmooze_events.1050.d: "Rynki radzą sobie dobrze."
 gdp_schmooze_events.1060.t: "Rywalizacja o uwagę"
 gdp_schmooze_events.1060.feast: "Podczas gdy służący krążą wokół stołów, napełniając kielichy i serwując kolejne dania,"
 gdp_schmooze_events.1060.hunt: "Gdy zatrzymujemy się, by napić się z naszych bukłaków i rozprostować nogi,"
 gdp_schmooze_events.1060.outro: "dostrzegam moją konkurencję: [rival.GetName] bezwstydnie podlizuje się osobie znanej jako [schmoozee.GetName].\n\nTa oślizgła gnida przymila się, opowiadając o korzyściach, jakie przynoszą zrzeszeni z nią handlarze, jednocześnie gardząc moimi partnerami i nazywając ich niegodziwcami i samochwałami!"
 gdp_schmooze_events.1060.a: "– Daj spokój, to całe żałosne przedsięwzięcie rodu [rival.GetHouse.GetBaseNameNoTooltip] to jakiś żart!"
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip] wychodzi na głupca"
 gdp_schmooze_events.1060.a.failure: "Wychodzisz na głupca"
 gdp_schmooze_events.1060.b: "– Zaraz, zaraz! Wszystko w naszych księgach się zgadza."
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip] daje się przekonać"
 gdp_schmooze_events.1060.b.failure: "Twoje argumenty są słabo przekonujące"
 gdp_schmooze_events.1060.c: "Niech paplają."
 activity_used_trade_market_luxury_items_modifier: "Zapotrzebowanie społeczne"
 activity_used_trade_market_luxury_items_modifier_desc: "Dobra luksusowe z tego rynku zostały przekierowane przez kupca, aby wykorzystać je w aktywności."
 activity_used_trade_market_comforts_modifier: "Zapotrzebowanie społeczne"
 activity_used_trade_market_comforts_modifier_desc: "Udogodnienia z tego rynku zostały przekierowane przez kupca, aby wykorzystać je w aktywności."
