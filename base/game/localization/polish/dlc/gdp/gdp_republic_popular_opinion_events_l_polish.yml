l_polish:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "Narastające wrzenie"
 republic_popular_opinion_event.1001.desc: "W dzisiejszych czasach nie jest dobrze być rozpoznanym na ulicy jako patrycjusz.\n\n[relation_01.GetName] zauważa, jak niepewnie się rozglądam, a na mojej twarzy maluje się zdenerwowanie, po czym mówi:\n\n– Psiakrew! [event_location_01.GetName] to miejsce, w którym patrycjusze nie żyją w izolacji. Przemierzają ulice jako dumni obywatele!\n\n[relation_01.GetName] ma rację, ale ostatnio w mieście panuje napięta atmosfera. Pod powierzchnią wrze od niezadowolenia. Miasto nękają protesty i awantury, a mogę sobie tylko wyobrażać, co dzieje się po zmroku."
 republic_popular_opinion_event.1001.a: "– Masz rację. Musimy chodzić z podniesionym czołem."
 republic_popular_opinion_event.1001.b: "– Może to dobry moment, by sprawić sobie ochroniarza."
 republic_popular_opinion_event.1001.c: "– Tłum zabije nas wszystkich!"
 republic_popular_opinion_event.1001.d: "– Nie będę dla nich łatwą ofiarą."
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "Okres niezadowolenia"
 republic_popular_opinion_event.1002.desc_1: "Stojąc przy oknie, słyszę, jak rozbrzmiewają gniewne głosy. [event_location_01.GetName] to miejsce, które aż wrze od niezadowolenia. Robotnicy grożą, że odłożą narzędzia lub wyjdą na ulice. Pod osłoną nocy dochodzi do niszczenia lub bezczeszczenia symboli władzy.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "Gdziekolwiek się nie obrócę, spotykam się z ponurymi minami, przeszkodami i szeptanymi obelgami."
 republic_popular_opinion_event.1002.desc_control_firm: "Tłumy mogą sobie pozwolić tylko na symboliczne akty nieposłuszeństwa, ponieważ rząd z brutalną skutecznością rozprawia się z najmniejszymi nawet zalążkami nielegalnego zgromadzenia."
 republic_popular_opinion_event.1002.desc_control_strained: "Łaska [ROOT.Char.GetFaith.HighGodNamePossessive] nam sprzyja – niepokoje są tłumione przez straż miejską. Codziennie przywódcy zamieszek są zatrzymywani i umieszczani w dybach. Osoby próbujące wykorzystać panujący chaos są ścigane i demaskowane. Porządek na razie się utrzymuje."
 republic_popular_opinion_event.1002.desc_control_slipping: "Pomimo usilnych starań straży miejskiej prowokatorom udaje się prześlizgnąć, a na ulicach szerzy się przemoc. Gromadzą się tłumy, a nie wszystkie udaje się rozproszyć na czas. Noc należy do gangów i awanturników."
 republic_popular_opinion_event.1002.desc_control_broken: "Rząd stracił kontrolę nad ulicami. Straż miejska chowa się w koszarach, a tłum nęka patrycjuszy na schodach do pałacu! Krążą plotki o udziale zagranicznych szpiegów i sabotażystów."
 republic_popular_opinion_event.1002.a: "Stoję po stronie rządu!"
 republic_popular_opinion_event.1002.b: "Pokażę jasno, że stoję po stronie ludu."
 republic_popular_opinion_event.1002.c: "Lepiej się nie wychylać."
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "Świąteczna atmosfera"
 republic_popular_opinion_event.1003.desc: "Odwiedzam tętniący życiem targ w miejscu znanym jako [event_location_01.GetTitle.GetName]. Nawiązuję tam rozmowę z pewną osobą znaną jako [craftsman_character.GetName], która stroi sobie żarty ze swojego osiołka, tak że aż pękam ze śmiechu.\n\nOstatnio mam wrażenie, że miasto to jedna wielka rodzina – łatwiej nawiązuje się rozmowę z nieznajomymi, a wszyscy są w dobrym nastroju mimo trudów życia. Osiołek radośnie ryczy i szturcha mnie głową.\n\n– Zgromadzenie dobrze sobie radzi, co? – mówi [craftsman_character.GetFirstNameNoTooltip] i drapie osła za uchem. – Może byście to uczcili – zorganizowali jakąś ucztę? Gildie na pewno się do tego przyłączą, by zrobić dobre wrażenie i okazać wam swoje uznanie."
 republic_popular_opinion_event.1003.a: "– Co za fantastyczny pomysł!"
 republic_popular_opinion_event.1003.b: "– Dobrze słyszę? Darmowe złoto?"
 republic_popular_opinion_event.1003.c: "– Wolę cię lepiej poznać."
 republic_popular_opinion_event.1003.tt: "Twoja następna [activity|El], którą jest [feast|El], jest #P darmowa. #!"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "Poczucie ambicji"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName] i ja spędzamy wspólnie czas na placu niedaleko mojego domu. [ROOT.Char.Custom('RegionalDrink')|U] umila nam czas. Leniwie obserwujemy zgiełk i krzątaninę mieszkańców zajmujących się swoimi codziennymi sprawami. [relation_01.GetName] wzdycha z zadowoleniem po łyku napoju.\n\n– Mówię ci – trzeba kuć żelazo, póki gorące. Trzeba mieć ambicję! Gdy w mieście panuje tak dobry nastrój, wszystko wydaje się możliwe – podnosi kufel i uśmiecha się. – Wznieśmy toast za nowe możliwości i wielkie bogactwo!\n\nOdwzajemniam uśmiech i podnoszę kielich."
 republic_popular_opinion_event.1004.a: "– Za wspaniałe przygody!"
 republic_popular_opinion_event.1004.b: "– Za nową miłość i romanse!"
 republic_popular_opinion_event.1004.c: "– Za sławę i chwałę!"
 republic_popular_opinion_event.1004.d: "– Za rodzinę i przyjaciół!"
