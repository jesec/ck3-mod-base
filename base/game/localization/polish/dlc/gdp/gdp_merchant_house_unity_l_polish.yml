 house_unity_parameter_unity_very_high_risk_of_leaving: "Akceptacja, kiedy inni [rulers|El] zapraszają [Concept('associates', 'partnerów')|E] na swój [court|El]: #N +50#!"
 house_unity_parameter_unity_deputy_positions_cost_less: "Wynagrodzenie na stanowisku [Concept('deputy', 'delegata')|E] ulega zmniejszeniu: #P -50%#!"
