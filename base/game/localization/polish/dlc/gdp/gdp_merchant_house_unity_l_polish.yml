 unity_merchant_can_request_complete_exploitative_monopolies_tt: "Aby poprosić o [complete_monopoly|El] lub [exploitative_monopoly|El], [Concept('company_sentiment', 'wartością kompanii')|E] musi być #V #emp zachłanność#!#!"
 house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies: "Można poprosić o [complete_monopolies|El] i [exploitative_monopolies|El], używając [Concept('interaction', 'interakcji')|E] „#V $request_trade_monopoly_for_character_interaction$#!”"
 merchant_steady_hand_low_unity_modifier: "$merchant_house_unity$: pewna ręka"
