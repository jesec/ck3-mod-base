l_polish:
 merchant_house_unity: "Wartości kompanii"
 rapacious_cs: "Zachłanność"
 rapacious_cs_desc: "#weak W atmosferze narastającej niechęci i ambicji dawno już zapomniano o obowiązkach wynikających z więzów rodzinnych. Potrzeby kompanii są ważniejsze od potrzeb jej członków, a zysk stawia się ponad wszystko.#!"
 opportunistic_cs: "Oportunizm"
 opportunistic_cs_desc: "#weak Nieposłuszni krewni buntują się przeciwko hierarchii opartej na więzach krwi, uznając obowiązki za mniej ważne od własnych interesów.#!"
 balanced_cs: "Równowaga"
 balanced_cs_desc: "#weak Choć rodzina potrzebuje przywódcy, jej członkowie muszą mieć swobodę w załatwianiu własnych spraw bez ingerencji i osądu.#!"
 grasping_cs: "Drapieżność"
 grasping_cs_desc: "#weak Reputacja kompanii i reputacja jej członków to jedno i to samo. Aby stać się cenionym członkiem kompanii, należy dążyć do poprawy zarówno swojego wizerunku, jak i pozycji społecznej.#!"
 ennobled_cs: "Szlachetność"
 ennobled_cs_desc: "#weak Dzięki niezłomnej lojalności, wynikającej z poczucia obowiązku i szacunku, interesy grupy są tożsame z interesami jej przywódcy. Jako zespół ściśle spajany więzami rodzinnymi kompania może stanąć na równi z najszlachetniejszymi rodami.#!"
 house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts: "Członkowie [Concept('house', 'rodu')|E] służący jako [traders|El] są bardziej skłonni przedstawiać [trade_opportunities|El]"
