l_polish:
 tradition_fortune_seekers_name: "Poszukiwacze szczęścia"
 tradition_fortune_seekers_desc: "W tej kulturze nie uważa się, że opuszczenie domu z pustymi rękami to coś hańbiącego i oczekuje się, że ci, którym przypadnie w spadku niewiele, będą szukać szczęścia za granicą. Tam poznają zawiłości niezliczonych dróg, a wraz z nimi wartość każdego towaru i warunki każdej pożyczki."
 culture_parameter_fortune_seekers_merchant_propensity: "[characters|E] reprezentujące tę [Concept('culture', 'kulturę')|E] częściej zostają [Concept('merchants', 'kupcami')|E]"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "Odblokowuje następującą [Concept('domicile_building', 'budowlę siedziby')|E]: #V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName|l]#!"
 tradition_saharan_traders_name: "Kupcy saharyjscy"
 tradition_saharan_traders_desc: "Od dawna wiadomo, że pustynia Sahara nie jest barierą, lecz raczej szlakiem handlowym łączącym region Sahelu i śródlądzie Afryki Zachodniej z Morzem Śródziemnym. Tutejsza kultura w pełni zaakceptowała swoją rolę w tej wymianie, a wielu jej przedstawicieli spędza całe życie w karawanach."
 culture_parameter_oasis_villages_building_slot: "[districts|E]: #V [GetDistrictType('villages_district').GetName|l]#!, #V [GetDistrictType('religious_community_district').GetName|l]#! i #V [GetDistrictType('manor_houses_district').GetName|l]#! mają #P 1#! dodatkowe miejsce na [Concept('building', 'budowlę')|E] w następującym terenie: [GetTerrain( 'oasis' ).GetName|l]"
 culture_parameter_saharan_seasoned_traveler_route_length: "Każdy poziom kierunku #V „$trait_track_danger$”#! [Concept('trait', 'cechy')|E] [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )|l] daje #P 1#! dodatkowy punkt [Concept('trade_route_length', 'długości szlaku handlowego')|E]"
 culture_parameter_saharan_merchant_domicile_buildings: "Odblokowuje następujące [domicile_buildings|El]: #V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName|l]#! i #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName|l]#!"
 culture_parameter_caravan_escort_compound_domicile_building: "Odblokowuje następującą [Concept('domicile_building', 'budowlę siedziby')|E]: #V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName|l]#!"
 tradition_silk_road_traders_name: "Przedsiębiorcy Jedwabnego Szlaku"
 tradition_silk_road_traders_desc: "Jedwabnym Szlakiem płynie stały strumień towarów między Wschodem a Zachodem. Tą długą trasą z jednego punktu do drugiego przewozi się jedwab, herbatę, wyroby lakowe, jadeit i wiele innych drogich towarów, co ukształtowało społeczeństwa żyjące wzdłuż szlaku. Bogate miasta albo same angażują się w handel dalekosiężny, albo sprzedają tym, którzy się nim parają."
 tradition_monsoon_traders_name: "Kupcy monsunowi"
 tradition_monsoon_traders_desc: "Od nachudów na zachodzie po gildie kupieckie i kasty na wschodzie, kupcy znad Oceanu Indyjskiego od pokoleń wprowadzają na rynek pieprz, bawełnę i cenne dobra."
 culture_parameter_caravanserai_hospitality: "[characters|E] reprezentujące tę [Concept('culture', 'kulturę')|E] mogą użyć [Concept('interaction', 'interakcji')|E] „#V $host_honored_guest_interaction$#!”"
 culture_parameter_stewardship_gain_from_foreign_poi: "Odwiedzenie [Concept('point_of_interest', 'ciekawego miejsca')|E] na terenach należących do innej [Concept('culture', 'kultury')|E] zapewnia [lifestyle_experience|El] w zakresie [Concept('stewardship', 'zarządzania')|E]"
 culture_parameter_silk_road_market_expertise: "[decision|E] „#V $visit_silk_road_market_decision$#!” przynosi ci więcej korzyści"
 culture_parameter_silk_road_oasis_urban_building_slots: "[districts|E]: #V [GetDistrictType('urban_housing_district').GetName|l]#! i #V [GetDistrictType('guild_district').GetName|l]#! mają #P 1#! dodatkowe miejsce na [Concept('building', 'budowlę')|E] w następującym terenie: [GetTerrain( 'oasis' ).GetName|l]"
 culture_parameter_silk_road_market_owner_bonuses: "[buildings|E] rynku na Jedwabnym Szlaku przynoszą dodatkowy [commerce_tax|El]"
 culture_parameter_silk_road_merchant_domicile_buildings: "Odblokowuje następujące [domicile_buildings|El]: #V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName|l]#! i #V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName|l]#!"
 culture_parameter_monsoon_traveler_trade_bonuses: "Kierunek #V „$trait_track_travel$”#! [Concept('trait', 'cechy')|E] [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )|l] daje dodatkową [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjność handlową')|E], a kierunek #V „$trait_track_danger$”#! – dodatkową [trade_route_capacity_i] [capacity|El]"
 culture_parameter_monsoon_port_buildings_settlement_size: "[buildings|E] w [Concept('district', 'dzielnicy')|E], którą jest #V [GetDistrictType('port_district').GetName|l]#!, dają #P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#! pkt [Concept('settlement_size', 'wielkości osady')|E]"
 culture_parameter_monsoon_merchant_domicile_buildings: "Odblokowuje następujące [domicile_buildings|El]: #V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName|l]#! i #V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName|l]#!"
 tradition_binding_oaths_name: "Wiążące przysięgi"
 tradition_binding_oaths_desc: "Umów należy dotrzymywać. Ci ludzie uważają, że zawarty kontrakt nigdy nie może zostać zerwany. Nie ma tolerancji dla krzywoprzysięzców."
 culture_parameter_binding_oaths_harsh_break_penalties: "Złamanie [Concept('truce', 'rozejmu')|E], potępienie [Concept('creditor', 'wierzyciela')|E] lub ujawnienie posiadania cechy [GetTrait('dealbreaker').GetName( GetNullCharacter )|l] powoduje znacznie większy spadek [Concept('opinion', 'opinii')|E] wśród przedstawicieli danej [Concept('culture', 'kultury')|E] i powoduje spadek [Concept('acumen', 'zmysłu biznesowego')|E] [Concept('company', 'kompanii')|E] o #N 10%#!"
 culture_parameter_binding_oaths_word_is_trusted: "Inni [rulers|El] znacznie chętniej akceptują ich [Concept('interaction', 'interakcję')|E] „#V $negotiate_alliance_interaction$#!” i reagują na ich [Concept('interaction', 'interakcję')|E] „#V $call_ally_interaction$#!”, co powoduje spadek [prestige_i] o #P 50%#!"
 culture_parameter_good_faith_traits_more_common: "[traits|E] [GetTrait('honest').GetName( GetNullCharacter )|l] i [GetTrait('trusting').GetName( GetNullCharacter )|l] są bardziej powszechne"
 culture_parameter_good_faith_trait_bonuses: "[traits|E] [GetTrait('honest').GetName( GetNullCharacter )|l] i [GetTrait('trusting').GetName( GetNullCharacter )|l] zapewniają dodatkowe premie"
 culture_parameter_better_stewardship_education: "[children|E] reprezentujące tę [Concept('culture', 'kulturę')|E] mają większe szanse na uzyskanie dobrego [Concept('education', 'wykształcenia')|E] w zakresie [Concept('stewardship', 'zarządzania')|E]"
 binding_oaths_broke_word_modifier: "Złamane przysięgi"
 binding_oaths_alliance_accept_reason: "Twoja [tradition|El] „[GetCultureTradition('tradition_binding_oaths').GetName]” zobowiązuje cię do dotrzymania słowa: $VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "Moja [tradition|E] „[GetCultureTradition('tradition_binding_oaths').GetName]” zobowiązuje mnie do przestrzegania warunków naszego [Concept('alliance', 'sojuszu')|E]: $VALUE|=+0$"
 culture_parameter_unlock_carnival_activity: "[rulers|E] [Concept('republican', 'republikańscy')|E] mogą być gospodarzami następującej [Concept('activity', 'aktywności')|E]: [GetActivityType('activity_carnival').GetName|l]"
 culture_parameter_merchant_propensity_bonus: "[characters|E] reprezentujące tę [Concept('culture', 'kulturę')|E] częściej zostają [Concept('merchants', 'kupcami')|E]"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line' )]"
 culture_parameter_trade_league_cohesion_bonus_has_dlc: "Każdy [title|El] tej [Concept('culture', 'kultury')|E] w [Concept('trade_league', 'lidze handlowej')|E] zapewnia miesięcznie #P +0,02#! pkt [Concept('league_cohesion', 'spójności ligi')|E]"
 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line' )]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "[rulers|E] ziem na poziomie [Concept('county', 'hrabstwa')|E] mogą zakładać [Concept('trade_league', 'ligi handlowe')|E]"
 tradition_roman_law_name: "Prawo rzymskie"
 tradition_roman_law_desc: "Prawo rzymskie ukształtowało niegdyś tę krainę. W tej kulturze nadal naucza się tego prawa wszystkich, którzy zajmują ważne stanowiska, a jego zastosowanie jest widoczne w całym społeczeństwie. Chłopi, rzemieślnicy, wdowy, szlachta, kupcy – wszyscy polegają na literze prawa w kwestii rozwiązywania konfliktów."
 culture_parameter_roman_law_cheaper_university: "Wysłanie [Concept('ward', 'wychowanka')|E] na uniwersytet i organizacja [Concept('activity', 'aktywności')|E] o nazwie [GetActivityType('activity_adult_education').GetName|l] są tańsze o [gold_i] #P [EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#! szt. złota"
 culture_parameter_roman_law_university_bonuses: "[buildings|E] uniwersyteckie dają dodatkowe korzyści"
 culture_parameter_roman_law_education_bonuses: "[education_traits|E] z zakresu [Concept('learning', 'nauki')|E] i [Concept('stewardship', 'zarządzania')|E], [education_traits|El] piątego poziomu, zapewniają dodatkową [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjność handlową')|E] oraz premie do [stewardship_i] [Concept('stewardship_skill', 'umiejętności zarządzania')|E]."
 culture_parameter_roman_law_legal_buildings_in_guild_district: "[buildings|E] z linii o nazwie #V [GetBuildingType('notary_1').GetName|l]#! i #V [GetBuildingType('court_of_law_1').GetName|l]#! można wznosić w dzielnicy, którą jest #V [GetDistrictType('guild_district').GetName|l]#!"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "[buildings|E] z linii #V dziedzińców targowych#!, #V biur notariuszy#! i #V sądów#! poprawiają [popular_opinion_i] [Concept('popular_opinion', 'powszechną opinię')|E]"
 culture_parameter_roman_law_notariate_domicile_building: "Odblokowuje następującą [Concept('domicile_building', 'budowlę siedziby')|E]: #V [GetDomicileBuilding('merchant_company_notariate_01').GetName|l]#!"
 tradition_civic_religion_name: "Religia obywatelska"
 tradition_civic_religion_desc: "Ten lud powierza zajmowanie się sprawami religii gildiom i konfraterniom. Wszystko, począwszy od opieki nad biednymi, przez obronę miasta, po budowę kościoła, jest obowiązkiem pobożnych grup obywateli."
 culture_parameter_civic_religion_temple_district_restriction: "[district|E] znana jako #V [GetDistrictType('temple_district').GetName|l]#! nie jest dostępna dla [Concept('secular_rulers', 'władców świeckich')|E]"
 culture_parameter_civic_religion_guild_building_slots: "W dzielnicy znanej jako #V [GetDistrictType('guild_district').GetName|l]#! są #P 2#! dodatkowe miejsca na [Concept('building', 'budowlę')|E]"
 culture_parameter_civic_religion_guild_charity_buildings: "[buildings|E] z linii o nazwie #V [GetBuildingType('charities_1').GetName|l]#!, #V [GetBuildingType('hospitals_1').GetName|l]#!, #V [GetBuildingType('scribe_shop_1').GetName|l]#! i #V [GetBuildingType('scholarly_guilds_1').GetName|l]#! można wznosić w dzielnicy, którą jest #V [GetDistrictType('guild_district').GetName|l]#!"
 culture_parameter_civic_religion_basilica: "Odblokowuje następującą linię [Concept('building', 'budowli')|E]: [GetBuildingType('republic_basilica_01').GetName|Vl] w dzielnicy, którą jest [GetDistrictType('republic_great_plaza_district').GetName|l] – dotyczy [Concept('republics', 'republik')|E]"
 culture_parameter_civic_religion_cathedral_civic_tax: "[buildings|E] katedralne także zapewniają [civic_tax|El]"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "Zmiana [Concept('personal_tenet', 'dogmatu osobistego')|E] powoduje mniejszy [stress|El]"
 culture_parameter_civic_religion_education_piety_bonuses: "[education_traits|E] dotyczące [Concept('diplomacy', 'dyplomacji')|E] i następująca linia [Concept('traits', 'cech')|E]: [GetTrait('education_republican_knowledge_3').GetName( GetNullCharacter )|l] zapewniają dodatkową [piety_i] [piety|El]"
 culture_parameter_civic_religion_trait_piety_bonuses: "[traits|E] [GetTrait('gregarious').GetName( GetNullCharacter )|l] i [GetTrait('family_first').GetName( GetNullCharacter )|l] zapewniają dodatkową [piety_i] [piety|El]"
 culture_parameter_unlock_improved_republic_militia: "[rulers|E] [Concept('republican', 'republikańscy')|E] mogą uchwalić następujące [law|El]: #V „$republic_army_organization_2_improved_levy$”#!"
 tradition_contado_name: "Contado"
 tradition_contado_desc: "Na terenach należących do tej kultury rozsiane są niewielkie, ale ufortyfikowane miasteczka, często pierwotnie założone przez lokalnego właściciela ziemskiego. Dzięki systemowi dzierżawy udziałowej miejscy właściciele ziemscy oddalili się od codziennego życia na wsi."
 culture_parameter_contado_castello_buildings: "[buildings|E] z linii o nazwie #V [GetBuildingType('castello_1').GetName|l]#! można wznosić w dzielnicy, którą jest #V [GetDistrictType('villages_district').GetName|l]#!"
 culture_parameter_contado_borghi_buildings: "[buildings|E] z linii o nazwie #V [GetBuildingType('borghi_1').GetName|l]#! można wznosić w dzielnicy, którą jest #V [GetDistrictType('walls_district').GetName|l]#!"
 culture_parameter_contado_towers_domicile_building: "Odblokowuje następującą [Concept('domicile_building', 'budowlę siedziby')|E]: #V [GetDomicileBuilding('merchant_company_towers_01').GetName|l]#!"
 tradition_contract_warfare_name: "Wojna na kontrakcie"
 tradition_contract_warfare_desc: "Ta kultura zinstytucjonalizowała działania wojenne, sięgając daleko poza pospolite ruszenie i armie obywatelskie. Oddziały są kontraktowane, a oficerowie negocjują cele kampanii z miastami i możnymi. Zabijanie przeniosło się ze sfery osobistej do zawodowej."
 culture_parameter_unlock_innovation_condottieri: "[innovation|E] #high „$innovation_condottieri$”#! będzie dostępna w [Concept('era', 'epoce')|E] późnośredniowiecznej"
 culture_parameter_contract_warfare_single_combat: "[rulers|E], których charakteryzuje [commander_trait|El], [education_trait|El] w zakresie [Concept('martial', 'walki')|E] lub [trait|El] [GetTrait('brave').GetName( GetNullCharacter )|l], mogą użyć [Concept('interaction', 'interakcji')|E] #V „$challenge_to_single_combat_nomadic_interaction$#!” na [Concept('characters', 'postaciach')|E] o tym samym co oni lub niższym [Concept('title_tier', 'poziomie')|E], które nie są ich [Concept('liege', 'seniorami')|E]"
 culture_has_university_desc: "Ta [culture|El] nie jest obecna w żadnym [Concept('county', 'hrabstwie')|E] z uniwersytetem"
 cultrad_republic_government_type: "Twój [government|El] to [GetGovernment( 'republic_government' ).GetName|l]"
 cultrad_has_military_district: "Masz [holding|El], w której jest #V [GetDistrictType('military_district').GetName|l]#!"
 culture_in_oasis_desc: "Ta [culture|El] nie jest obecna w żadnym [Concept('county', 'hrabstwie')|E] z [Concept('terrain', 'terenem')|E] określanym jako [GetTerrain( 'oasis' ).GetName|l]"
 oasis_count_desc: "Ta [culture|El] nie jest obecna w co najmniej #V 2#! [Concept('counties', 'hrabstwach')|E] z [Concept('terrain', 'terenem')|E], którym jest [GetTerrain( 'oasis' ).GetName|l]"
 culture_in_silk_road_region_desc: "Ta [culture|El] nie jest obecna na terenie znanym jako [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 silk_road_percentage_desc: "Ta [culture|El] nie posiada #V 30%#! swoich [Concept('counties', 'hrabstw')|E] wzdłuż traktu, którym jest [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 culture_on_monsoon_coast_desc: "Ta [culture|El] nie jest obecna w żadnym przybrzeżnym [Concept('county', 'hrabstwie')|E] miejsc znanych jako [GetGeographicalRegion('world_india').GetName], [GetGeographicalRegion('world_africa_east').GetName] oraz [GetGeographicalRegion('world_middle_east').GetName]"
 only_one_caravan_trade_tradition: "Dopuszczalna jest wyłącznie jedna [tradition|El] związana z handlem karawanowym, a następujących tradycji nie można łączyć: kupcy saharyjscy i kupcy Jedwabnego Szlaku"
 only_one_seaborne_trade_tradition: "Dopuszczalna jest wyłącznie jedna [tradition|El] związana z handlem morskim, a następujących tradycji nie można łączyć: morski merkantylizm i kupcy monsunowi"
