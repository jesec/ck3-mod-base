l_polish:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]: to, co przepadło"
 gdp_guelph_ghibelline_scheme.1000.desc: "Jestem na dorocznych targach w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], gdzie panuje atmosfera radości i wspólnoty.\n\nNa ulicach słychać szum hucznych zabaw, widać kolorowe ozdoby z tkaniny i czuć zapach pysznych potraw, z których słynie kuchnia [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] – to prawdziwa rozkosz dla moich znużonych zmysłów.\n\nNagle zupełnie przypadkowo widzę, jak [target.GetTitledFirstName] z zachwytem przygląda się towarom na pobliskim straganie, i dostrzegam okazję, by wykorzystać mój urok."
 gdp_guelph_ghibelline_scheme.1000.a: "– Wiesz, #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l]#! chcieli zakazać tego święta."
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "Udaje ci się przekonać rozmówcę, że [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l] mają złą wolę."
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUINameNotMe] cię zbywa"
 gdp_guelph_ghibelline_scheme.1000.b: "– Ta przypinka doskonale by ci pasowała!"
 gdp_guelph_ghibelline_scheme.1000.c: "Nie muszę interweniować."
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]: krążą plotki…"
 gdp_guelph_ghibelline_scheme.1010.desc: "Moi informatorzy przekazali mi, że [target.GetTitledFirstName], nasz #EMP ceniony#! przywódca frakcji i [ROOT.Char.Custom('GetGuelphGhibelline')|l], ostatnio zmaga się jakby z przytłoczeniem, uginając się pod ciężarem swoich uciążliwych obowiązków.\n\nKilka odpowiednio sformułowanych listów skierowanych do naszych stronników mogłoby utrwalić to wrażenie i zasugerować osobę bardziej #EMP godną#!, by wziąć na siebie ten ciężar."
 gdp_guelph_ghibelline_scheme.1010.a: "Chcę mieć te listy przygotowane bezzwłocznie."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "Szansa powodzenia jest modyfikowana przez twoje @gg_involvement_icon! [gg_involvement|El] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Twoje listy sprawiają, że [ROOT.Char.Custom('GetGuelphsGhibellines')] zostają w większości przekonani do twoich wybitnych zdolności przywódczych"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Twoje listy przynoszą twojej sprawie więcej szkody niż pożytku"
 gdp_guelph_ghibelline_scheme.1010.b: "Każda osoba z rodu [ROOT.Char.GetHouse.GetName] byłaby wspaniałym przywódcą!"
 gdp_guelph_ghibelline_scheme.1010.c: "Kto może powiedzieć, czy to w ogóle prawda?"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]: złote usta"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "Wygląda na to, że mój szpieg – [court_agent.GetTitledFirstName] – przyciągnął uwagę grupy wzgardzonych dworzan i dysydentów na dworze, na którym rządzi [target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "Wygląda na to, że mój szpieg – [court_agent.GetTitledFirstName] – sprawił, iż [target.Custom('GetGuelphsGhibellines')] niezadowoleni z przywództwa osoby znanej jako [target.GetTitledFirstName] zaczęli nas słuchać"
 gdp_guelph_ghibelline_scheme.1020.intro: "Wygląda na to, że mój szpieg – [court_agent.GetTitledFirstName] – przyciągnął uwagę postaci, którą jest [target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nSpóźniam się z napisaniem listu do mojego szpiega, którym jest [court_agent.GetTitledFirstNameNoTooltip]."
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "Czy powinniśmy nawiązać kontakt z tymi miejscowymi podżegaczami, aby zrealizować nasze plany?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "Mam kazać [court_agent.Custom('PL_mu_jej')] podsycać ich wątpliwości co do osoby o imieniu [target.GetFirstNameNoTooltip]?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "Czy mam skorzystać z okazji, aby [ROOT.Char.Custom('GetGuelphsGhibellines')|l] otrzymali wsparcie mojego szpiega przed osobą, którą jest [target.GetTitleAsNameNoTooltip]?"
 gdp_guelph_ghibelline_scheme.1020.a: "Wykorzystam zamiast tego moje wysiłki."
 gdp_guelph_ghibelline_scheme.1020.b: "Wykorzystajmy tych… łotrów."
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip] musi na siebie zarobić."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUINameNotMe] skutecznie realizuje twoje plany"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUINameNotMe] nie brzmi wiarygodnie"
 gdp_guelph_ghibelline_scheme.1020.d: "Niech skupi się na mojej reputacji."
 gdp_guelph_ghibelline_scheme.1020.prestige: "Nadszarpnięty prestiż"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Twój prestiż został nieco nadszarpnięty."
 gdp_guelph_ghibelline_scheme.1020.piety: "Nadszarpnięta pobożność"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Twoja pobożność została nieco nadszarpnięta."
 gdp_guelph_ghibelline_scheme.1020.e: "Moja pobożność mówi sama za siebie!"
 gdp_guelph_ghibelline_scheme.1020.f: "Nie warto się w to wtrącać."
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]: naoliwianie trybów"
 gdp_guelph_ghibelline_scheme.1030.desc: "Pewnego ranka podczas obchodu podbiega do mnie mój wieloletni towarzysz.\n\n– Wasza czcigodność, nasi informatorzy na dworze, na którym rządzi [target.GetTitledFirstName], donoszą, że [target.Custom('PL_jego_jej')] [ROOT.Char.Custom('DescribeTargetSkill')] to coś godnego co najwyżej wyśmiania.\n\n– Może udałoby się nam to jakoś wykorzystać…?"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "[sly_character.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', sly_character )], dyskretnie podchodzi do mnie pewnego ranka podczas obchodu.\n\n– Próbujemy #EMP uratować#! ziemie znane jako [target.GetPrimaryTitle.GetDefinitiveName] przed głupim stronnictwem, którym są [target.Custom('GetGuelphsGhibellines')|l]. Może powinniśmy poddać w wątpliwość fakt, że [ROOT.Char.Custom('DescribeTargetSkill')] osoby znanej jako [target.GetTitledFirstName] jest na przyzwoitym poziomie?\n\n– Podobno ma [target.GetSheHe] pewna braki w tej kwestii."
 gdp_guelph_ghibelline_scheme.1030.a: "– Niech wysiłek przeważy nad plotkami."
 gdp_guelph_ghibelline_scheme.1030.a.tt: "Szansa powodzenia jest modyfikowana przez twoje @gg_involvement_icon! [gg_involvement|El] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "[target.GetShortUINameNotMe] daje ci podważyć swój autorytet"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Twoje wysiłki nie odnoszą skutku"
 gdp_guelph_ghibelline_scheme.1030.b: "– Powinniśmy to wykorzystać, by podważyć [target.Custom('PL_jego_jej')] autorytet na [target.Custom('PL_jego_jej')] dworze."
 gdp_guelph_ghibelline_scheme.1030.c: "– Podsycajmy te plotki."
 gdp_guelph_ghibelline_scheme.1030.d: "– Nie wydaje mi się, że powinniśmy tak zrobić."
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.1262.desc: "To wielki sukces! [target.GetTitledFirstName] w końcu zaczyna myśleć rozsądnie i teraz stoi u naszego boku jako prawdziwy [owner.Custom('GetGuelphGhibelline')|l].\n\nTkwiło we mnie głębokie przekonanie, że prędzej czy później zmieni zdanie."
 scheme_critical_moments.1262.a: "Znakomicie!"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.1263.desc: "#EMP Niektórym nie przetłumaczysz.#! Ku powszechnemu rozczarowaniu, bez względu na to, jakich argumentów próbuję używać, [target.GetTitledFirstName] uparcie twierdzi, że to [target.Custom('GetGuelphsGhibellines')|l] mają rację w tym sporze.\n\nNie trzeba chyba dodawać, że tym razem #EMP nie#! rozstaliśmy się w przyjacielskich stosunkach."
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')|U]#!!"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.1272.desc: "Czas na świętowanie! [owner.Custom('GetGuelphsGhibellines')|U] jeden po drugim wycofują swoje poparcie dla osoby o imieniu [target.GetTitledFirstName] i zamiast tego zwracają się do mnie, oczekując pomocy.\n\nNie ma wyboru: [target.GetSheHe] musi odejść."
 scheme_critical_moments.1272.a: "Doskonale!"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.1273.desc: "Pomimo naszych wysiłków [target.GetTitledFirstName] pozostaje nieugięcie przywódcą frakcji, którą są [owner.Custom('GetGuelphsGhibellines')], a zgromadzone przeze mnie wsparcie zwiędło i zniknęło."
 scheme_critical_moments.1273.desc.secret: "\n\nPrzynajmniej wciąż nie wie nic o moich planach."
 scheme_critical_moments.1273.desc.discovered: "\n\nCo gorsze, [target.GetSheHe] wie, że to moja sprawka, i raczej tego nie zapomni."
 scheme_critical_moments.1273.a: "No, no, nieładnie."
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.1282.desc: "To wielki sukces! [target.GetTitledFirstName] w końcu zaczyna myśleć rozsądnie i teraz stoi u naszego boku jako prawdziwy [owner.Custom('GetGuelphGhibelline')|l].\n\nTkwiło we mnie głębokie przekonanie, że prędzej czy później zmieni zdanie."
 scheme_critical_moments.1282.a: "Znakomicie!"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.1283.desc: "#EMP Niektórym nie przetłumaczysz.#! Ku powszechnemu rozczarowaniu, bez względu na to, jakich argumentów próbuję używać, [target.GetTitledFirstName] uparcie twierdzi, że to [target.Custom('GetGuelphsGhibellines')|l] mają rację w tym sporze.\n\nNie trzeba chyba dodawać, że tym razem #EMP nie#! rozstaliśmy się w przyjacielskich stosunkach."
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')|U]#!!"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.1292.desc.intro: "Świetna wiadomość – [target_character.GetTitledFirstName] ma znacznie łagodniejsze podejście i zastąpi osobę znaną jako [target.GetTitledFirstName]."
 scheme_critical_moments.1292.desc.intro.unknown: "Świetna wiadomość – osobę znaną jako [target.GetTitledFirstName] zastąpi ktoś, kto jest naprawdę oddany sprawie!"
 scheme_critical_moments.1292.desc: "\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')] mają prawdziwy powód do dumy. Teraz możemy mieć pewność, że w miejscu znanym jako [target.GetPrimaryTitle.GetDefinitiveName] rządy będą sprawowane sprawiedliwie i uczciwie."
 scheme_critical_moments.1292.desc.discovered: "\n\nMoje zaangażowanie nie pozostało jednak niezauważone, więc od tej pory muszę na siebie uważać…"
 scheme_critical_moments.1292.a: "Racja!"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.1293.desc: "Najlepiej ułożone plany…\n\n#EMP Ktoś gdzieś musiał namieszać.#! Dowiem się kto, ale na razie nie da się zaprzeczyć, że tym razem [target.GetTitledFirstName] wymyka mi się z rąk. Jeszcze przez chwilę będziemy musieli zadowolić się złudzeniem władzy, którą sprawuje [target.Custom('GetGuelphGhibelline')|l] w miejscu znanym jako [target.GetPrimaryTitle.GetDefinitiveName]."
 scheme_critical_moments.1293.a: "#EMP Niech to szlag!#!"
