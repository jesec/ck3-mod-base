l_polish:
 gdp_merchant_activity_events.0001.t: "Niezaspokojony apetyt"
 gdp_merchant_activity_events.0001.desc: "W miarę jak zabawa się rozkręca, słyszę narzekania głodnych i coraz bardziej poirytowanych gości. Na tacach z jedzeniem zostały już tylko okruchy, a nikt ze służby nie kwapi się, by uzupełnić braki.\n\n[guest.GetTitledFirstName] [guest.Custom('quirk_neg_present')], stawia pustą szklankę obok siebie i cedzi przez zęby:\n\n– Co trzeba zrobić, żeby dostać coś do picia na tej przeklętej uczcie?"
 gdp_merchant_activity_events.0001.host: "\n\nMoże to dla mnie okazja, aby nieco ożywić to wydarzenie?"
 gdp_merchant_activity_events.0001.guest: "\n\nMoże to dla mnie okazja, aby nieco ożywić wydarzenie naszego gospodarza, którym jest [host.GetTitledFirstName]?"
 gdp_merchant_activity_events.0001.a: "– Niech [host.GetTitledFirstNameNoTooltip] widzi, jak praca w [host.Custom('PL_jego_jej')] kuchni wre, nie szczędzić środków!"
 gdp_merchant_activity_events.0001.a.host: "– Dobrze, #EMP naprawdę#! rozruszam tę kuchnię!"
 gdp_merchant_activity_events.0001.b: "Wygląda na to, że mam dobrą pozycję negocjacyjną."
 gdp_merchant_activity_events.0001.c: "– Niech [guest.GetTitledFirstNameNoTooltip] okaże większą wdzięczność!"
 gdp_merchant_activity_events.0001.d: "– Jeśli ci się nie podoba, wynocha!"
 gdp_merchant_activity_events.0001.e: "– Czas sięgnąć do magazynów kompanii."
 gdp_merchant_activity_events.0005.t: "Niecodzienna prośba"
 gdp_merchant_activity_events.0005.desc: "[admirer.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))], daje mi znak, by dołączyć do rozmowy z [admirer.Custom('PL_jego_jej')] gościem, którym jest [guest.GetTitledFirstName].\n\n[admirer.GetFirstNameNoTooltip] uśmiecha się"
 gdp_merchant_activity_events.0005.desc_esteemed: "serdecznie"
 gdp_merchant_activity_events.0005.desc_fallback: "figlarnie"
 gdp_merchant_activity_events.0005.desc_outro: "i mówi:\n\n– Ja i [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))] jesteśmy właśnie po rozmowie o twoim odkryciu za granicą. [luxury_artifact.Custom('GetLuxuryArtifactSentiment')|U] przedmiot. Śmiało, opowiedz nam, jak udało ci się zdobyć coś tak niesamowitego jak [luxury_artifact.GetName]!\n\nJest aż nazbyt jasne, że ta szlachetnie urodzona osoba oczekuje, iż będę żartować i popisywać się, aby zapewnić rozrywkę jej oraz jej gościowi."
 gdp_merchant_activity_events.0005.a: "– To żadne wielkie osiągnięcie…"
 gdp_merchant_activity_events.0005.b: "– Stawką były moje zdrowie i życie!"
 gdp_merchant_activity_events.0005.b.success: "Twoja opowieść brzmi autentycznie"
 gdp_merchant_activity_events.0005.b.failure: "Przyłapano cię na kłamstwie"
 gdp_merchant_activity_events.0005.c: "– Słuchajcie uważnie!"
 gdp_merchant_activity_events.0005.d: "– To nic w porównaniu z luksusowymi dobrami, którymi handluję w miejscu znanym jako [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_activity_events.0010.t: "Radość dawania"
 gdp_merchant_activity_events.0010.desc: "Gdy tylko zjawia się [merchant.GetTitledFirstName], postać znana mi z branży handlowej, od razu zaczyna popisywać się swoim bogactwem – palcami przebiega po kosztownej biżuterii, pokazuje eleganckie szaty z [merchant.Custom('RegionalFabric')] i bezwstydnie promuje swoje towary, czyli [good.Custom('GetTradeGood')], które sprzedaje na targowisku w miejscu znanym jako [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip].\n\nŁapię [merchant.Custom('PL_go_ja')] na gorącym uczynku, gdy na oczach gromady gapiów patrzących z podziwem wręcza prezent osobie, którą jest [receiver.GetTitledFirstName], dla mnie [ROOT.Char.Custom2('RelationToMeShort', receiver)]."
 gdp_merchant_activity_events.0010.a: "Kto mieczem wojuje, od miecza ginie…"
 gdp_merchant_activity_events.0010.b: "– [merchant.GetFirstNameNoTooltip], to naprawdę przeuroczy prezent!"
 gdp_merchant_activity_events.0010.b.success: "Sprawiasz, że [merchant.GetFirstNameNoTooltip] czuje wstyd"
 gdp_merchant_activity_events.0010.b.failure: "Wypadasz głupio"
 gdp_merchant_activity_events.0010.c: "Wszystko mi jedno."
 gdp_merchant_activity_events.0010.d: "– Nie wypada przechwalać się przed lepszymi od siebie."
 gdp_merchant_activity_events.0015.t: "Los chłopa"
 gdp_merchant_activity_events.0015.desc: "Uczta obfitująca w szlachetne trunki, suto zastawione stoły i kojące ciepło kominka. To wszystko jawi się jako wyraźny kontrast wobec przenikliwego chłodu nocy.\n\nGdy oddalam się od gwaru uroczystości, pragnąc zaczerpnąć świeżego powietrza, dostrzegam ubogą gromadkę – zwykłych ludzi kręcących się przy murach, żywiących nadzieję, że po zakończeniu uczty zdołają pochwycić choćby resztki tego, czym dziś raczą się możni."
 gdp_merchant_activity_events.0015.a: "Niech jedzą i bawią się – ja stawiam!"
 gdp_merchant_activity_events.0015.b: "Wolę raczej napić się ze szlachtą. [ROOT.Char.Custom('RegionalDrink')|U] to jest to, czego mi potrzeba."
 gdp_merchant_activity_events.0015.b.alcohol: "Wolę raczej napić się ze szlachtą. [ROOT.Char.Custom('RegionalAlcoholicDrink')|U] to jest to, czego mi potrzeba."
 gdp_merchant_activity_events.0015.c: "To jest moje #EMP prawdziwe#! miejsce."
 gdp_merchant_activity_events.0015.d: "Precz, szumowino!"
 custom.every_attending_noble: "Każda uczestnicząca [character|El] należąca do [Concept('noble', 'szlachty')|E]"
 gdp_merchant_activity_events.0020.t: "Co się komu podoba"
 gdp_merchant_activity_events.0020.desc: "Dotarła do mnie wiadomość, że [other.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))], ma na sobie na tę okazję coś wyjątkowego. To [fake_artifact.GetNameNoTooltip|l].\n\nW wielkiej sali dostrzegam olśniewającą postać spowitą w szatę z naszyjnikiem spoczywającym na jej piersi. Gdy podchodzę, [other.Custom('quirk_pos_present')] i mówi:\n\n– To mój najnowszy nabytek. Cena niebagatelna, nie sądzisz?\n\nCiepłe światło wielu świec w sali ładnie oświetla klejnot, lecz moim wprawnym okiem nie mogę nie zauważyć jego licznych skaz."
 gdp_merchant_activity_events.0020.a: "– Paradne! [other.GetFirstNameNoTooltip] uważa, że ta błyskotka jest coś warta."
 gdp_merchant_activity_events.0020.b: "#weak *szeptem*#! – Pozwól, że pozbędę się tej felernej ozdóbki. Zrobię to dla ciebie."
 gdp_merchant_activity_events.0020.b.tt: "Zyskujesz [artifact|El] zwiększający [Concept('opinion', 'opinię')|E] na temat [Concept('attraction', 'pociągu')|E]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "[other.GetTitledFirstName] przekazuje ci ozdobę. To [fake_artifact.GetName|l]."
 gdp_merchant_activity_events.0020.c: "– Zaiste, to niezwykle cenny przedmiot."
 fake_artifact_name: "Naszyjnik z klejnotami"
 fake_artifact_desc: "Całkiem ładny naszyjnik, który pięknie błyszczy, choć przy bliższym przyjrzeniu się widać, jak niedbale oszlifowano klejnoty."
 gdp_merchant_activity_events.0025.t: "Droga dobrze znana"
 gdp_merchant_activity_events.0025.desc: "Wśród śmiechu i gwaru panującego na sali słyszę nieoczekiwany dźwięk…"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP Ooo, ooo!#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP Kii, kii!#!"
 gdp_merchant_activity_events.0025.desc_cont: "To [luxury_artifact.Custom('GetDomicileArtifactCreatureType')]? Czyżby ktoś przyniósł zwierzaka na ucztę?\n\nW tłumie dostrzegam kupca znanego jako [merchant.GetTitledFirstName] – zwierzak należy do [merchant.Custom('PL_niego_niej')]. Dostrzega moje zaciekawione spojrzenie, [merchant.Custom('quirk_pos_present')] i mówi:\n\n– Ten wspaniały okaz udało mi się nabyć podczas jednej z moich licznych podróży. Jest taki uroczy targ, który często odwiedzam. To tajemnica firmowa. – Dotyka się po nosie, złośliwie się uśmiechając, co świadczy o [merchant.Custom('PL_jego_jej')] zadowoleniu z siebie."
 gdp_merchant_activity_events.0025.a: "– Chyba znam to miejsce!"
 gdp_merchant_activity_events.0025.b: "– Dasz się przekonać, żeby zdradzić, co to za miejsce?"
 gdp_merchant_activity_events.0025.b.success: "Wysuwasz przekonujące argumenty"
 gdp_merchant_activity_events.0025.b.failure: "Nie udaje ci się wysunąć przekonujących argumentów"
 gdp_merchant_activity_events.0025.c: "Opowiedz mi więcej o swoich podróżach!"
 gdp_merchant_activity_events.0025.tt.menagerie: "Utwórz [luxury_contract_i] [luxury_contract|El] #V „$menagerie_acquisition_contract$”#!"
 gdp_merchant_activity_events.0025.tt.curio: "Utwórz [luxury_contract_i] [luxury_contract|El] #V „$find_curio_contract$”#!"
