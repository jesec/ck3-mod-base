l_polish:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: [patron.Custom('GetRoomPlural')] osoby znanej jako [patron.GetTitleAsNameNoTooltip] "
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName] to osoba wielkiego formatu – tak znakomita, iż szlachta, duchowieństwo, kupcy i pospólstwo z całego miejsca znanego jako [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] i okolic zabiegają o [patron.GetHerHis] względy oraz poparcie.\n\nMusimy mówić otwarcie, ale też postępować ostrożnie, jeśli chcemy zapewnić naszej kompanii [patron.GetHerHis] łaskę, nie dając się przyćmić bardziej przebiegłym rywalom ani też nie tracąc całkiem [patron.GetHerHis] uwagi.\n\nNasze przedsięwzięcia muszą nieustannie przewijać się na ustach wielkich i wpływowych osób w miejscu znanym jako [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: sukces!"
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName] nie potrafi oprzeć się moim opowieściom o dalekich krainach i splątanych szlakach kupieckiego świata i co wieczór z zapartym tchem słucha mnie przy bankietowym stole.\n\nMogę wrócić do kompanii z pewnością, że [patron.GetFirstNameNoTooltip] widzi w nas cennych partnerów i mile widzianych przyjaciół.\n\nNasza reputacja w miejscu znanym jako [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] wzrosła niepomiernie, a wieści o moich wpływach bez wątpienia dotrą jeszcze dalej."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: porażka!"
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName] wzywa mnie do siebie coraz rzadziej. Coś się stało? To moja wina? Zmiana w uprzejmości dworzan w miejscu znanym jako [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] tylko potwierdza [patron.GetHerHis] niezadowolenie.\n\nZnudziły [patron.Custom('PL_go_ja')] moje anegdoty? Chodzi o zbyt częste komentarze o kaprysach handlu? O przekroczenie jakiejś niewidzialnej granicy #EMP szlachetności#!?\n\nNie pozostaje mi nic innego, jak powrócić do kompanii, ograniczyć szkody i spróbować sprowadzić sprawy z powrotem na właściwe tory…"
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "Patron pod wrażeniem"
 gdp_impressed_patron_modifier_desc: "Patron docenił starania kupca, który próbował mu się przypodobać."
 gdp_impressed_patron_critical_modifier: "Patron pod wrażeniem"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "Patron lekceważący"
 gdp_dismissive_patron_modifier_desc: "Patron nie docenił starań kupca, który próbował mu się przypodobać."
