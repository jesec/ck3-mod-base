 GENERIC_HANSE_NAME: "Hanza miejsca znanego jako [hanse_lead_town.GetName]"
 gdp_burgher.0001.desc: "My, [burgher_county.Custom('BurgherPluralNoun')] z miejsca o nazwie [burgher_county.GetNameNoTier], domagamy się nadania nam przywileju „[burgher_county.Custom('BurgherDemandedPrivilege')]”, aby nasze miasto mogło rozkwitać i przynosić większe bogactwo twemu państwu."
 gdp_burgher.0001.a: "Ich żądanie nie jest bezpodstawne. Wyrażam zgodę."
 gdp_burgher.0001.b: "Odmawiam!"
 gdp_burgher.0001.opening: "Za naszego władcę!"
 gdp_burgher.0010.desc: "My, [burgher_county.Custom('BurgherPluralNoun')] z miejsca o nazwie [burgher_county.GetNameNoTierNoTooltip], prosimy o przyznanie nam swobody samorządności, wyboru własnych przywódców i prowadzenia spraw we własnym imieniu, a jeśli nie dasz nam z łaski tego, o co prosimy, możemy być zmuszeni wziąć to siłą."
 gdp_burgher.0010.a: "Przyznaj im swobodę."
 gdp_burgher.0010.b: "Niech walczą o swoje #EMP „prawa”#!."
 gdp_burgher.0020.t: "[freed_county.GetNameNoTierNoTooltip] – nareszcie wolność"
 gdp_burgher.0020.desc: "Miejsce znane jako [freed_county.GetNameNoTier] uzyskało wolność, a wraz z nią przywilej samorządności i wyznaczania własnych sędziów.\n\nNic takiego nie byłoby oczywiście możliwe, gdyby nie #EMP moje#! wsparcie."
 gdp_burgher.0020.desc.assembly_head: "Miejsce znane jako [freed_county.GetNameNoTier] uzyskało wolność, a wraz z nią przywilej samorządności i wyznaczania własnych sędziów.\n\nNic takiego nie byłoby oczywiście możliwe, gdyby nie #EMP moje#! wsparcie."
 gdp_burgher.0020.a: "Ciężar przywództwa to brzemię, które chętnie wezmę na swoje barki."
 gdp_burgher.0020.b: "Zajmę miejsce wśród ich możnowładców."
 gdp_burgher.0020.c: "Ich przychylność będzie dla mnie wystarczającą nagrodą."
 gdp_burgher_agitator_not_republic_head_tt: "#bold Nie#! możesz mieć już głowy [Concept('republic', 'republiki')|E]"
 gdp_burgher_agitator_outranks_republic_head_tt: "Twój [title_tier|El] musi być niż niższy niż poziom osoby, którą jest [burgher_ruler.GetTitledFirstName]"
 gdp_civic_agitation.0001.t: "Rozpalono płomień wolności"
 gdp_civic_agitation.0001.desc: "Wszystko układa się po mojej myśli. Mieszkańcy miejsca znanego jako [target.GetNameNoTier] pałają najgorętszym pragnieniem wolności obywatelskiej, jakie moi wspólnicy zdołali w nich rozniecić, a ich przywódcy wygłaszają na rynku płomienne mowy o uciążliwych podatkach i niesprawiedliwych sędziach.\n\nPodobno delegacja szykuje się, by ruszyć konno do swego pana i zażądać prawa do samorządności. Pozostaje zdecydować, czy wyruszę razem z nimi."
 gdp_civic_agitation.0001.a: "Udało mi się zrobić już tak dużo w tej sprawie. Dopilnuję tego do końca."
 gdp_civic_agitation.0001.b: "Niech ruszą w pełnej sile, uzbrojeni i na wierzchowcach. Ja to sfinansuję."
 gdp_civic_agitation.0001.c: "Niech pospólstwo myśli, że to ich pomysł. Ważni wiedzą, jak jest."
 gdp_civic_agitation.0001.c.exposed: "Przyznaj się, że za tym stoisz i nie obiecuj im nic więcej"
 gdp_civic_agitation_sponsor_joins_war_tt: "Dołączysz do [Concept('war', 'wojny')|E], a obok ciebie staną [agitated_county.Custom('BurgherPluralNoun')], jeśli ich władca odeśle ich z kwitkiem"
 gdp_civic_agitation_sponsor_war_chest_tt: "Na wypadek wojny sfinansujesz kompanię zawodowych żołnierzy"
 gdp_civic_agitation.0002.t: "Nierozsądnie wydane złoto"
 gdp_civic_agitation.0002.desc: "Lista skarg została sporządzona i odczytana przed mieszkańcami miejsca znanego jako [target.GetNameNoTier], a ich przywódcy spotkali się i #EMP nic#! nie zrobili.\n\nMoi wspólnicy nie mają pojęcia, co tam zaszło, poza tym, co widać gołym okiem. Moje złoto kupiło im wszystko, czego potrzebowali, poza odwagą, by faktycznie zrobić z tego #EMP użytek#!."
 gdp_civic_agitation.0002.a: "Nieprędko zapomnę o tej tchórzliwej zdradzie."
 found_the_hanseatic_league_decision: "Założono ligę hanzeatycką"
 found_the_hanseatic_league_decision_tooltip: "Połącz [counties|El] swojej [Concept('trade_league', 'ligi handlowej')|E] w jeszcze potężniejszą konfederację kupiecką"
 found_the_hanseatic_league_decision_confirm: "Zgoda przynosi dobrobyt"
 found_the_hanseatic_league_decision_desc: "Królowie wyobrażają sobie, że władza nosi koronę i dzierży miecz. My znamy inną prawdę. Władza przychodzi otulona w futra, cuchnie rybami i nosi księgi rachunkowe z sumami, które doprowadziłyby królestwa do bankructwa.\n\nW pojedynkę jesteśmy obkładani podatkami, łupieni i zmuszani do posłuszeństwa groźbami; zjednoczeni stajemy się siłą, której nie oprze się żadna potęga na północnych morzach. Żaden port nie odmówi wstępu naszym statkom, żaden obcy kupiec nie przebije naszych cen i żaden książę nie waży się targnąć na nasze przywileje."
 found_the_hanseatic_league_cohesion_tt: "[trade_league|E] musi mieć co najmniej #V 95#! pkt [Concept('cohesion', 'spójności')|E]"
 found_the_hanseatic_league_members_tt: "[trade_league|E] musi mieć co najmniej #V 4#! członków"
 found_the_hanseatic_league_message_title: "Narodziny Hanzy"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUINameNotMe] jednoczy ligę przysięgą, dając początek Hanzie."
 league_needs_liege_consent_tt: "Jako [vassal|El] musisz uzyskać zgodę [Concept('liege', 'seniora')|E], chyba że reprezentujesz wolne miasto, które może dołączyć do związku samodzielnie"
 gdp_hanseatic.0010.opening: "Nadawca: [the_league.GetName]"
 gdp_hanseatic.0010.desc: "Posiadasz prawa handlowe we własnym imieniu, dla swoich wyłącznych korzyści.\n\nTakie indywidualne ustalenia działają na naszą niekorzyść. Prosimy o ich odstąpienie na naszą rzecz, abyśmy mogli wspólnie lepiej prosperować."
 gdp_hanseatic.0010.a: "Oddamy prawa lidze o nazwie [the_league.GetName]."
 gdp_hanseatic.0010.b: "Nadam prawa miastu o nazwie [hanse_city_title.GetNameNoTier]."
 gdp_hanseatic.0010.c: "Rzeczone prawa są moje #EMP i takimi pozostaną#!."
