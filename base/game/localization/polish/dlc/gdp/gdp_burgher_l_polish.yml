 building_type_hanseatic_kontor_01_desc: "Kupcy Hanzy w tym kantorze żyją według własnego prawa i rozkładu dnia. Czeladnicy nie mogą wchodzić w związku małżeńskie, dopóki nie wrócą do domu."
