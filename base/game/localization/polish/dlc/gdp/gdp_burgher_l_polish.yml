 burgher_sponsor_refused_toast: "Odrzucono żądania"
 burgher_sponsor_refused_toast_desc: "Sponsorowani przez ciebie [sponsor_town.Custom('BurgherPluralNoun')] z miejsca znanego jako [sponsor_town.GetNameNoTier] dowiedzieli się, że ich żądania zostały odrzucone"
