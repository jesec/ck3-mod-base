 dissolve_the_hanse_cb_victory_desc: "Ugrupowanie o nazwie [defender.GetConfederation.GetName] zostaje rozwiązane, a [defender.GetShortUINameNotMe] staje się [Concept('vassal', 'wasalem')|E] osoby znanej jako [attacker.GetShortUINameNotMe]."
