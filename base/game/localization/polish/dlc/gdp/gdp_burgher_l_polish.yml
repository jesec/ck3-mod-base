 hanseatic_league_member_modifier: "Handlarz Hanzy"
 hanseatic_league_member_modifier_desc: "Ta postać jest członkiem Hanzy i handluje pod jej uprzywilejowaną egidą."
 hanseatic_league_county_modifier: "Hrabstwo Hanzy"
 hanseatic_league_county_modifier_desc: "To hrabstwo należy do członka Hanzy, a jego rynki rozkwitają dzięki przywilejom ligi."
 every_hanseatic_county: "Każde [county|El] w Hanzie"
 every_hanseatic_family: "Każda [family|El] w Hanzie"
 gdp_caught_agitating_modifier: "Zdemaskowany agitator"
 gdp_caught_agitating_modifier_desc: "Ta postać została przyłapana na podburzaniu innego [Concept('ruler', 'władcy')|E]. W wyniku tego inni [rulers|El], co zrozumiałe, patrzą na nią z podejrzliwością."
 merchant_civic_advantage_modifier: "Sponsor obywatelski"
 merchant_civic_advantage_modifier_desc: "Ta postać wsparła dążenia do wolności obywatelskiej, zyskując tym samym przychylność ludu, co może okazać się niezwykle opłacalne."
 STEAL_TRADE_POST_KONTOR_DEFENDED_DESC: "Ma kantor: $VALUE|+=0$"
 hanseatic_staple_right_county_modifier: "Prawo składu"
 hanseatic_staple_right_county_modifier_desc: "To hrabstwo otrzymało prawo składu, które zobowiązuje przejezdnych kupców do rozładunku towarów i wystawienia ich na sprzedaż tutaj w pierwszej kolejności."
