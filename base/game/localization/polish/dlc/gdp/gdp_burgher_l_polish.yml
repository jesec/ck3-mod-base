 burgher_self_rule_chartered_city_tt: "Nowa [republic|El] rozpoczyna, mając [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|Vl]"
 burgher_self_rule_new_capital_tt: "Nowa [republic|El] wyznacza miejsce o nazwie [burgher_new_capital.GetNameNoTier] na swoją [Concept('capital', 'stolicę')|E]"
 BURGHER_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip] rewolta obywatelska"
 burgher_war_victory_desc: "Każde zbuntowane [county|El] staje się samorządną [Concept('republic', 'republiką')|E] mającą [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|Vl] i przenosi [Concept('capital', 'stolicę')|E] do największego miasta w [Concept('county', 'hrabstwie')|E] – jeśli jest to konieczne. Grupa co najmniej trzech utworzy #V ligę handlową#!"
 burgher_war_victory_free_city_desc: "Każde zbuntowane [county|El] staje się samorządną [Concept('republic', 'republiką')|E] mającą [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|Vl] i przenosi [Concept('capital', 'stolicę')|E] do największego miasta w [Concept('county', 'hrabstwie')|E] – jeśli jest to konieczne. Grupa co najmniej trzech utworzy #V ligę handlową#!"
 burgher_war_white_peace_desc: "[faction|E] zostaje rozwiązana, a [county|El] przewodzące otrzymuje pomniejsze przywileje obywatelskie. Jej hrabstwa nie zawiążą innej [Concept('faction', 'frakcji')|E] $FACTION_BURGHER_AUTONOMY_NAME$ przez [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] l."
 burgher_war_defeat_desc: "[faction|E] zostaje rozwiązana, a każde zbuntowane [county|El] traci wszelkie dotychczasowe przywileje obywatelskie wraz z [Concept('popular_opinion', 'powszechną opinią')|E]. Jej hrabstwa nie zawiążą innej [Concept('faction', 'frakcji')|E] $FACTION_BURGHER_AUTONOMY_NAME$ przez [EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0] l."
 burgher_war_ended_invalid.desc: "$BURGHER_WAR_CB_NAME$ unieważniona: [faction|El] $FACTION_BURGHER_AUTONOMY_NAME$ nie ma już przywódcy!"
 civic_privileges_county_modifier: "Przywileje obywatelskie"
 civic_privileges_county_modifier_desc: "To hrabstwo otrzymało kilka pomniejszych przywilejów obywatelskich, ale żaden z nich nie został zapisany w akcie nadania."
 civic_privilege_market_rights_1_county_modifier: "Ograniczone prawa targowe"
 civic_privilege_market_rights_1_county_modifier_desc: "Temu hrabstwu przyznano prawo do organizowania targu według miar i pod nadzorem tamtejszego pana."
 civic_privilege_market_rights_2_county_modifier: "Prawa targowe"
 civic_privilege_market_rights_2_county_modifier_desc: "Hrabstwo to otrzymało własne dni targowe i wagi oraz prawo do zachowania pokaźnej części utargu."
 civic_privilege_market_rights_3_county_modifier: "Szerokie prawa targowe"
 civic_privilege_market_rights_3_county_modifier_desc: "To hrabstwo uzyskało prawie całkowitą kontrolę nad targiem, pozostawiając swojemu panu niewielką część utargu."
 civic_privilege_guild_rights_1_county_modifier: "Ograniczone prawa gildyjne"
 civic_privilege_guild_rights_1_county_modifier_desc: "Rzemieślnicy tego hrabstwa uzyskali prawo do zakładania organizacji, chociaż ich mistrzowie nadal odpowiadają przed dworem swego pana."
 civic_privilege_guild_rights_2_county_modifier: "Prawa gildyjne"
 civic_privilege_guild_rights_2_county_modifier_desc: "Gildie tego hrabstwa otrzymały prawo do ustanawiania własnych standardów i przyjmowania własnych mistrzów."
 civic_privilege_guild_rights_3_county_modifier: "Szerokie prawa gildyjne"
 civic_privilege_guild_rights_3_county_modifier_desc: "Gildie tego hrabstwa uzyskały niemal całkowitą kontrolę nad swoimi rzemiosłami i tym, co wytwarzają."
 civic_privilege_tax_exemption_1_county_modifier: "Częściowe zwolnienie z podatku publicznego"
 civic_privilege_tax_exemption_1_county_modifier_desc: "Miasto w tym hrabstwie zostało zwolnione z części należnych jego panu powinności."
 civic_privilege_tax_exemption_2_county_modifier: "Zwolnienie z podatku publicznego"
 civic_privilege_tax_exemption_2_county_modifier_desc: "Miastu tego hrabstwa przyznano prawo do uiszczania podatków w wybranej przez siebie stawce."
 civic_privilege_tax_exemption_3_county_modifier: "Szerokie zwolnienie z podatku publicznego"
 civic_privilege_tax_exemption_3_county_modifier_desc: "Miasto tego hrabstwa uzyskało ulgę w zakresie większości podatków i płaci zaledwie symboliczną kwotę."
 civic_privilege_militia_charter_1_county_modifier: "Ograniczona koncesja na milicję"
 civic_privilege_militia_charter_1_county_modifier_desc: "Miasto tego hrabstwa otrzymało własną straż pod warunkiem ograniczenia jej jurysdykcji do murów miasta."
 civic_privilege_militia_charter_2_county_modifier: "Koncesja na milicję"
 civic_privilege_militia_charter_2_county_modifier_desc: "Miasto tego hrabstwa otrzymało własną milicję, a służbę u jego pana pełni teraz mniej żołnierzy."
 civic_privilege_militia_charter_3_county_modifier: "Szeroka koncesja na milicję"
 civic_privilege_militia_charter_3_county_modifier_desc: "Miasto tego hrabstwa otrzymało prawo do zbrojenia się, a swojemu panu oddaje już tylko symboliczną garstkę żołnierzy."
 burgher_grievance_county_modifier: "Skargi obywatelskie"
 burgher_grievance_county_modifier_desc: "Odmówiono spełnienia żądań tego hrabstwa, a jego mieszkańcy nie zamierzają puścić urazy w niepamięć."
 gdp_civic_agitation_county_modifier: "Agitacja obywatelska"
 gdp_civic_agitation_county_modifier_desc: "Ktoś z zewnątrz podburza to hrabstwo przeciwko jego władcy."
 gdp_civic_agitation_popular_republic_modifier: "Głos ludu"
 gdp_civic_agitation_popular_republic_modifier_desc: "Ten spisek ma wsparcie głowy formy rządu, którą jest [GetLaw('republic_type_popular').GetName|l], symbol wolności obywatelskiej."
 bestow_civic_liberties_interaction: "Przyznaj wolności obywatelskie"
 bestow_civic_liberties_options_heading: "Wolność do przyznania"
 bestow_civic_liberties_option_market_rights: "Prawa targowe"
 bestow_civic_liberties_option_guild_rights: "Prawa gildyjne"
 bestow_civic_liberties_option_tax_exemption: "Zwolnienie z podatku"
 bestow_civic_liberties_option_militia_charter: "Koncesja na milicję"
 bestow_civic_liberties_interaction_desc: "Przyznaj przywilej obywatelski jednemu ze swoich [Concept('counties', 'hrabstw')|E], podnosząc tam [Concept('popular_opinion', 'powszechną opinię')|E]"
 bestow_civic_liberties_no_charter_left_tt: "Temu [Concept('county', 'hrabstwu')|E] musi przysługiwać jeszcze jakiś przywilej obywatelski, którego dotąd nie otrzymało"
 agitate_civic_unrest_interaction: "Wzbudź niepokoje społeczne"
 agitate_civic_unrest_interaction_desc: "Dokonaj próby podburzenia jednego z [Concept('counties', 'hrabstw')|E] należących do postaci znanej jako [recipient.GetShortUINameNotMeNoTooltip] do zażądania samorządności. Jeśli żądanie zostanie odrzucone, wywołaj [Concept('war', 'wojnę')|E], używając [casus_belli|El] #V „$BURGHER_WAR_CB_NAME$”#!"
 agitate_civic_unrest_eligible_tt: "Musisz być w stanie rozpocząć [scheme|El] #V „$gdp_civic_agitation_scheme$”#! przeciwko temu [Concept('county', 'hrabstwu')|E]"
 revoke_civic_liberties_interaction: "Odbierz wolności obywatelskie"
 revoke_civic_liberties_interaction_desc: "Zabierz wszystkie przywileje obywatelskie jednemu z twoich [Concept('counties', 'hrabstw')|E] kosztem znacznego uszczerbku na [Concept('popular_opinion', 'powszechnej opinii')|E]"
 revoke_civic_liberties_authority_tt: "Musisz mieć [crown_authority|El] na poziomie „[GetLaw('crown_authority_1').GetName]” lub wyższym"
 revoke_civic_liberties_no_privileges_tt: "To [county|El] musi posiadać przywileje obywatelskie, które można by odebrać"
 gdp_civic_agitation_scheme: "Wzbudź niepokoje społeczne"
 gdp_civic_agitation_scheme_action: "Wzbudź niepokoje społeczne przeciwko osobie znanej jako"
 gdp_civic_agitation_scheme_desc: "Podburzę zacnych mieszkańców miejsca znanego jako [SCHEME.GetTargetTitle.GetBaseNameNoTier], by zażądali prawa do samorządności, na które w pełni zasługują!"
 gdp_civic_agitation_scheme_desc_general: "Spisek „$gdp_civic_agitation_scheme$” to [hostile_scheme|El], którego celem jest podburzyć [county|El] do zażądania samorządności od swojego [Concept('ruler', 'władcy')|E]. Jest to [secret_scheme|El] oparty na [Concept('intrigue', 'intrydze')|E], do którego można zrekrutować [Concept('agents', 'wspólników')|E].\n\nW przypadku powodzenia spisku „$gdp_civic_agitation_scheme$” [county|El] będące jego celem zawiąże [Concept('faction', 'frakcję')|E] $FACTION_BURGHER_AUTONOMY_NAME$, która rozpocznie [Concept('war', 'wojnę')|E], jeśli jej żądania nie zostaną spełnione.\n\nKażdy [merchant|El] może wywołać wzburzenie, tak jak i głowa republiki powszechnej. Każda [republic|El] wyzwolona w ten sposób przyjmie ten sam rodzaj rządów. [patrician_rating|E] pozostałych głów [Concept('republic', 'republiki')|E] musi wynosić co najmniej [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V], a pozostałych [Concept('republican', 'republikańskich')|E] [Concept('house_heads', 'głów rodów')|E] – co najmniej [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]."
 gdp_civic_agitation_scheme_desc_success: "[county|E] będące celem zawiązuje [Concept('faction', 'frakcję')|E] $FACTION_BURGHER_AUTONOMY_NAME$ i domaga się prawa do samorządności"
 gdp_civic_agitation_scheme_discovery_desc: "Twoje podburzanie [Concept('county', 'hrabstwa')|E] nie wyszło na jaw"
 gdp_civic_agitation_scheme_invalidated_title: "@scheme_icon! Zakończono spisek „$gdp_civic_agitation_scheme$”"
 gdp_civic_agitation_scheme_invalidated_desc: "[scheme|E] „$gdp_civic_agitation_scheme$” stracił ważność"
