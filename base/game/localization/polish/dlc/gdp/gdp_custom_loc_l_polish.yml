l_polish:
 dinar: "dinar"
 dinar_plural: "dinary"
 dinar_gloss: "[Glossary('dinar', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('dinary', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "#bold Dinar#! był złotą monetą wprowadzoną w VII wieku przez Umajjadów w odpowiedzi na bizantyjskiego, złotego [Glossary('solidusa', 'SOLIDUS_GLOSS')], choć nazwa dinara pochodziła od srebrnego [Glossary('denara', 'DENARIUS_GLOSS')].\n\nRozprzestrzenił się w całym świecie arabskim, a jego nazwa jest wciąż używana jako jednostka miary wartości w kilku współczesnych walutach."
 denarius: "denar"
 denarius_plural: "denary"
 denarius_gloss: "[Glossary('denar', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('denary', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "#bold Denar#! pierwotnie był używaną w Republice Rzymskiej srebrną monetą, której wartość uległa znacznemu obniżeniu w okresie cesarstwa.\n\nMimo to jego nazwa przetrwała jako skrótowe określenie waluty w obszarze wpływów rzymskich i była wciąż używana w odniesieniu do późniejszego srebrnego karolingowskiego [Glossary('denara', 'PENNY_GLOSS')] i arabskiego [Glossary('dinara', 'DINAR_GLOSS')]."
 ducat: "dukat"
 ducat_plural: "dukaty"
 ducat_gloss: "[Glossary('dukat', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('dukaty', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "#bold Dukat#! lub #emp dogado#!, którego nazwa wywodzi się od tytułu #emp doży#! Wenecji, to złota moneta wprowadzona przez Wenecję w XIII wieku, mająca stanowić odpowiednik florenckiego [Glossary('florena', 'FLORIN_GLOSS')] i genueńskiego #emp genovino#! w odpowiedzi na obniżanie wartości bizantyjskiego złotego [Glossary('solidusa', 'SOLIDUS_GLOSS')].\n\nWkrótce dukat stał się bardzo ceniony w obrocie handlowym, rozprzestrzenił się w całej Europie i poza nią, a także był wzorem i standardem."
 dirham: "dirham"
 dirham_plural: "dirhamy"
 dirham_gloss: "[Glossary('dirham', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('dirhamy', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "#bold Dirham#! lub #emp dram#! to srebrna moneta wprowadzona przez Umajjadów w VII wieku i przyjęta w całym świecie arabskojęzycznym. Jej nazwa wywodzi się od starożytnej greckiej srebrnej #emp drachmy#! z okresu klasycznego i hellenistycznego.\n\nStała się ona standardową jednostką wagi w świecie muzułmańskim, rozprzestrzeniając się na szeroką skalę, a jej nazwa jest nadal używana jako nazwa kilku współczesnych walut."
 aureus: "aureus"
 aureus_plural: "aureusy"
 aureus_gloss: "[Glossary('aureus', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('aureusy', 'AUREUS_GLOSS')]"
 solidus: "solidus"
 solidus_plural: "solidusy"
 solidus_gloss: "[Glossary('solidus', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('solidusy', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "#bold Solidus#! lub #emp nomisma#! (w dosłownym znaczeniu „moneta”) był złotą monetą wprowadzoną w IV wieku przez Bizantyjczyków, mającą zastąpić wcześniejszego rzymskiego [Glossary('aureusa', 'AUREUS_GLOSS')], zanim sam został zastąpiony przez [Glossary('hyperpyron', 'HYPERPYRON_GLOSS')] w XI wieku.\n\nZłote monety republik włoskich, takie jak [Glossary('dukat', 'DUCAT_GLOSS')], [Glossary('floren', 'FLORIN_GLOSS')] czy #emp genovino#!, zostały wprowadzone w odpowiedzi na zmniejszenie wartości solidusa w XIII wieku.\n\nW północnej Europie solidus znany był jako #emp szeląg#!, dopóki reformy Karola Wielkiego nie ujednoliciły w VIII wieku wartości wymiany srebra pod tą nazwą."
 hyperpyron: "hyperpyron"
 hyperpyron_plural: "hyperpyrony"
 hyperpyron_gloss: "[Glossary('hyperpyron', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('hyperpyrony', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "#bold Hyperpyron#! – oznaczający dosłownie „wysoce udoskonalony” – znany w Europie jako #emp bizant#! był wprowadzoną przez Bizantyjczyków w XI wieku złotą monetą, która zastąpiła wcześniejszego [Glossary('solidusa', 'SOLIDUS_GLOSS')].\n\nChoć nie był tak zdewaluowany jak #emp solidus#!, jego wartość do XIII wieku znacząco spadła, co zainspirowało wprowadzenie przez republiki włoskie monet takich jak [Glossary('dukat', 'DUCAT_GLOSS')], [Glossary('floren', 'FLORIN_GLOSS')] czy #emp genovino#!."
 bezant: "bizant"
 bezant_plural: "bizanty"
 bezant_gloss: "[Glossary('bizant', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('bizanty', 'HYPERPYRON_GLOSS')]"
 florin: "floren"
 florin_plural: "floreny"
 florin_gloss: "[Glossary('floren', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('floreny', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "#bold Floren#! był złotą monetą wprowadzoną w Republice Florenckiej w XIII wieku, w odpowiedzi na dewaluację bizantyjskich [Glossary('solidusa', 'SOLIDUS_GLOSS')] i [Glossary('hyperpyrona', 'HYPERPYRON_GLOSS')], w ślad za którą niedługo później zostały wprowadzone genueńskie #emp genovino#! i wenecki [Glossary('dukat', 'DUCAT_GLOSS')].\n\nTak jak #emp dukat#!, floren również stał się powszechnie używaną monetą, której kopie biło wiele mennic w całej Europie. Jego nazwa przetrwała w węgierskim #emp forincie#!."
 penny: "pens"
 penny_plural: "pensy"
 penny_gloss: "[Glossary('pens', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('pensy', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "#bold Fenig#! lub #emp pens#! był ustandaryzowaną srebrną monetą wprowadzoną w VIII wieku przez Karola Wielkiego, będącą odpowiednikiem wcześniejszego srebrnego [Glossary('denara', 'DENARIUS_GLOSS')], powszechnego w rzymskim świecie.\n\nNiedługo później stał się standardem i był kopiowany w całej Europie, a nazwy takie jak #emp denar#!, #emp denier#! czy #emp dinero#! były przez kolejne stulecia używane naprzemienne w odniesieniu do srebrnych monet o określonej wadze."
 pfennig: "fenig"
 pfennig_plural: "fenigi"
 pfennig_gloss: "[Glossary('fenig', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('fenigi', 'PENNY_GLOSS')]"
 denier: "denier"
 denier_plural: "deniery"
 denier_gloss: "[Glossary('denier', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('deniery', 'PENNY_GLOSS')]"
 dinero: "dinero"
 dinero_plural: "dinero"
 dinero_gloss: "[Glossary('dinero', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('dineros', 'PENNY_GLOSS')]"
 denaro: "denar"
 denaro_plural: "denary"
 denaro_gloss: "[Glossary('denar', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('denary', 'PENNY_GLOSS')]"
 denar: "denar"
 denar_plural: "denary"
 denar_gloss: "[Glossary('denar', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('denary', 'PENNY_GLOSS')]"
 groschen: "grosz"
 groschen_plural: "grosze"
 groschen_gloss: "[Glossary('grosz', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('grosze', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "#bold Grosz#! lub „gruby pens” był cięższą srebrną monetą wprowadzoną w XIII wieku przez księcia Meinharda II Tyrolskiego, w odpowiedzi na podobną wenecką monetę – #emp grosso#! – i pierwotnie miał wartość 12 [Glossary('fenigów', 'PENNY_GLOSS')].\n\nSzybko rozprzestrzenił się w całej Europie, a do jego najważniejszych źródeł należały mennice czeskie w Kutnej Horze oraz mennice miśnieńskie we Fryburgu."
 tongbao: "tongbao"
 tongbao_plural: "tongbao"
 tongbao_gloss: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold Tongbao#! – w dosłownym znaczeniu „krążący skarb” – to nazwa nadana wprowadzonym po raz pierwszy przez dynastię Tang w VII wieku, bitym z brązu monetom [Glossary('qian', 'QIAN_GLOSS')].\n\nStały się one standardową jednostką wymiany w strefach wpływów chińskich i po dziś dzień używane są w tradycyjnej medycynie chińskiej jako talizmany przynoszące szczęście."
 qian: "qian"
 qian_plural: "qian"
 qian_gloss: "[Glossary('qian', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('qiany', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold Qian#! – w dosłownym znaczeniu „pieniądze” – to ogólne określenie powszechnie spotykanych monet odlewanych ze stopu miedzi, używanych jako jednostki wymiany w Chinach od okresu Walczących Królestw.\n\nIch kwadratowe otwory ułatwiały masowe wygładzanie odlewanych krawędzi na pręcie, a także pozwalały na nawlekanie ich w większych nominałach w celu wymiany, zazwyczaj w sznurkach po 1000 sztuk. Monety te zainspirowały powstanie podobnych monet odlewanych w Japonii, Korei, Wietnamie i innych krajach."
 mon_coin: "mon"
 mon_coin_plural: "mon"
 mon_coin_gloss: "[Glossary('mon', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('mony', 'QIAN_GLOSS')]"
 tanka: "tanka"
 tanka_plural: "tanki"
 tanka_gloss: "[Glossary('tanka', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('tanki', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "#bold Tanka#! lub #emp taka#! była srebrną monetą wprowadzoną przez Sułtanat Delhi w XIII wieku.\n\nRozpowszechniła się w całych Indiach i sąsiednich regionach, gdzie była często kopiowana, i stała się standardową jednostką wymiany na Jedwabnym Szlaku."
 jital: "jital"
 jital_plural: "jitale"
 jital_gloss: "[Glossary('jital', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('jitale', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold Jital#! był pierwotnie srebrną monetą z motywem byka i jeźdźca, wprowadzoną w Kabulu w VIII wieku.\n\nJego wzór rozpowszechnił się w regionie, gdzie był wielokrotnie kopiowany. Z czasem uległ dewaluacji, gdyż zaczęto dodawać do niego coraz większe ilości miedzi. W XVI wieku #emp jitale#! stały się w całości miedziane."
 coin: "moneta"
 coin_plural: "monety"
 coin_gloss: "moneta"
 coin_gloss_plural: "monety"
 bazaar: "bazar"
 bazaar_plural: "bazary"
 bazaar_gloss: "[Glossary('bazar', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('bazary', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold Bazar#! lub #emp bazaar#! to perska nazwa targowiska, pochodząca z języka praindoeuropejskiego. Z czasem przeniknęła do języka arabskiego i obecnie jest powszechnie używana w całej Azji Zachodniej, Indiach i poza nimi."
 khrom: "chrom"
 khrom_plural: "chromy"
 khrom_gloss: "[Glossary('chrom', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('chromy', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold Chrom#! to tybetański termin określający targowisko. Rozpowszechnił się regionalnie na terenach, przez które przebiegał Jedwabny Szlak."
 shuka: "szuka"
 shuka_plural: "szuki"
 shuka_gloss: "[Glossary('szuka', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('szuki', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold Szuka#! to termin oznaczający targowisko w językach kaukaskich. Podobnie jak arabskie słowo [Glossary('suk', 'SUQ_GLOSS')] ma swoje korzenie w języku akadyjskim, w którym oznaczało „ulicę”, ale zapożyczone zostało z języka syryjskiego."
 suq: "suk"
 suq_plural: "suki"
 suq_gloss: "[Glossary('suk', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('suki', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold Suk#! – zapisywane również jako #emp souk#! – to arabskie słowo oznaczające targowisko, pierwotnie zapożyczone z języka akadyjskiego (w którym oznaczało „ulicę”), za pośrednictwem języka aramejskiego. Obecnie jest powszechnie używane w świecie muzułmańskim i poza nim."
 market_custom: "targ"
 market_custom_plural: "targi"
 market_custom_gloss: "targ"
 market_custom_gloss_plural: "targi"
 burgher: "mieszczanin"
 burgher_plural: "mieszczanie"
 patrician: "mieszczanin"
 patrician_plural: "mieszczanie"
