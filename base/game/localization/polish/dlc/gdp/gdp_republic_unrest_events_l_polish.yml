l_polish:
 gdp_republic_unrest.0001.t: "Powstanie w stolicy: skargi"
 gdp_republic_unrest.0001.desc: "Na dziedzińcu zebrała się grupa robotników i czeladników. Jeden z nich występuje naprzód.\n\n– Wasza czcigodność, podatki zamieniają nas w nędzarzy…\n\nZnam dobrze te słowa. Oni nie są ani pierwszymi, ani ostatnimi, którzy zgłaszają mi te skargi."
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "Straż! Pozbyć się tych… ludzi."
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "Nie będę negocjować z chłopstwem."
 gdp_republic_unrest.0001.b.success: "Rozchodzą się bez dalszych problemów"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "Odmowa sprawia, że są wściekli"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "Niech rada się tym zajmie."
 gdp_republic_unrest.0001.c.success: "Zostali przekonani. Na razie"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "Udaje im się przejrzeć to opóźnienie"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "Tym razem pójdę na ustępstwo."
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "Powstanie w stolicy: zimne przyjęcie"
 gdp_republic_unrest.0011.desc: "Kiedy przechodzę przez rynek, słyszę zwyczajowy gwar, ale coś wydaje się inne niż zwykle. Przy straganach zapada cisza, podobnie jak wśród ludzi, którzy tylko niezręcznie na mnie spoglądają.\n\nChodzę tymi ulicami od lat i nigdy wcześniej tak nie było."
 gdp_republic_unrest.0011.a: "Na pewno coś mi się tylko wydaje."
 gdp_republic_unrest.0011.b: "Niech ktoś wybada, jakie chodzą plotki."
 gdp_republic_unrest.0011.b.success: "Moi ludzie znajdują źródło"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "Plotki nie ustają"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "Zatrzymam się i porozmawiam z ludźmi."
 gdp_republic_unrest.0011.c.success: "Ludzie doceniają ten gest"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "Nikt nie jest skłonny zabrać głosu"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "Rozdaj jedzenie i wino, nie szczędząc zapasów."
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "Powstanie w stolicy: anonimowy list"
 gdp_republic_unrest.0021.desc: "Dzisiaj rano na biurku czekał na mnie list. Nie ma na nim pieczęci ani podpisu. Bardzo szczegółowo opisano w nim, jak bardzo pogorszyła się sytuacja w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], odkąd panuję jako [ROOT.Char.GetTitleAsName]."
 gdp_republic_unrest.0021.a: "Wrzuć list do ognia."
 gdp_republic_unrest.0021.b: "Ktoś zadał sobie trudu. Dowiedz się, kto to był."
 gdp_republic_unrest.0021.b.success: "Zidentyfikowano autora"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "Autor pozostaje nieznany"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "Wystosuję publiczną odezwę."
 gdp_republic_unrest.0021.c.success: "Odpowiedź zostaje dobrze przyjęta"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "Odpowiedź budzi niechęć"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "Powstanie w stolicy: plac należy teraz do nich"
 gdp_republic_unrest.0101.desc: "– Wasza czcigodność, kilku obywateli przejęło kontrolę nad rynkiem… i to już trwa od kilku dni – informuje mnie jeden z moich strażników. – Wygląda na to, że ktoś o imieniu [demagogue.GetFirstName] głośno podburza lud.\n\nPo co w ogóle płacę tym głupcom, skoro rynek może być zamknięty przez kilka dni, a nikt mnie o tym nie informuje?"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "Natychmiast oczyścić rynek!"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "Podważmy wiarygodność tego demagoga."
 gdp_republic_unrest.0101.b.success: "Osoba znana jako [demagogue.GetFirstName] zostaje skompromitowana"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "Moje próby kończą się porażką"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "Porozmawiam z nimi osobiście."
 gdp_republic_unrest.0101.c.success: "Tłum się rozchodzi"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "Słyszę głośne drwiny"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "Niech dostaną to, czego chcą."
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "Powstanie w stolicy: zamknięta dzielnica"
 gdp_republic_unrest.0111.desc: "Doszły mnie słuchy, że [closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )|l] odmawia wszelkiego kontaktu. Nie chce się tam uznać naszych poborców podatkowych ani słuchać naszych strażników."
 gdp_republic_unrest.0111.a: "Wyślij z tymi poborcami podatkowymi kilku strażników."
 gdp_republic_unrest.0111.b: "Opłaćmy ich."
 gdp_republic_unrest.0111.b.success: "Dostają to, czego chcą"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "Nie zgadzają się na negocjacje"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "Porozmawiam z nimi osobiście."
 gdp_republic_unrest.0111.c.success: "Wysłuchują cię"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "Nic do nich nie dociera"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "W końcu się zmęczą. Taką mam nadzieję."
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "Powstanie w stolicy: kukła"
 gdp_republic_unrest.0121.desc: "Gdy przechadzam się ulicami, nagle zatrzymuję się na widok wiszącego na widoku odrażającego manekina ubranego w coś przypominającego mój strój. Tłum milczy i patrzy najpierw na manekina, a potem na mnie.\n\n– Wygląda jak prawdziwy! – krzyczy ktoś z tyłu, a z tłumu rozlegają się głośne szyderstwa."
 gdp_republic_unrest.0121.a: "Zabierać to! NATYCHMIAST!"
 gdp_republic_unrest.0121.a.flavor: "Zadbam o to, by nikt nie powiedział słowa o tym, co tu widział."
 gdp_republic_unrest.0121.b: "Dowiedz się, kto za tym stoi."
 gdp_republic_unrest.0121.b.success: "Organizatorzy zostają spacyfikowani"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "Nie udaje się znaleźć organizatorów"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "Odniosę się do tego publicznie."
 gdp_republic_unrest.0121.c.success: "Ludzie wysłuchują cię"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "Tłum drwi i buczy"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "Nie zniżaj się do reakcji."
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "Powstanie w stolicy: miasto płonie"
 gdp_republic_unrest.0201.desc: "Dostrzegam unoszący się dym, a po chwili podbiegają do mnie strażnicy.\n\n– Wasza czcigodność, jakaś osoba o imieniu [demagogue.GetFirstName] podżega lud do podpalenia jednej z dzielnic miasta.\n\nCo się dzieje z moim miastem?"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "Zbierzcie cały garnizon. Zajmijcie się tym."
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "Przygotujcie mojego konia!"
 gdp_republic_unrest.0201.b.success: "Uczestnicy zamieszek rozpraszają się"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "Muszę uciec do pałacu"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "Spotkam się z tą osobą na rynku."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "Tłum zwraca się przeciwko mnie"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "Jeśli trzeba, niech dostanie wszystko, co mamy w skarbcu."
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "Powstanie w stolicy: uderzenie"
 gdp_republic_unrest.0211.desc: "Gdy przechodzę przez rynek, protest od razu rzuca się w oczy. Nikt nie zachwala swoich towarów, stragany są puste, a warsztaty pogrążone w ciszy.\n\nWidać wyraźnie, że gildie podjęły wspólną decyzję, a wszyscy robotnicy się jej trzymają."
 gdp_republic_unrest.0211.a: "Każ przyprowadzić mistrzów gildii na rozmowy."
 gdp_republic_unrest.0211.a.success: "Dochodzi do osiągnięcia porozumienia"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "Nie przychodzą na miejsce"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "Tym razem ich opłacimy."
 gdp_republic_unrest.0211.b.success: "Uzgodniono cenę"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "Odrzucają mój kompromis"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "Spraw, by wrócili do pracy. Już."
 gdp_republic_unrest.0211.d: "Spełnij ich żądania."
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "Powstanie w stolicy: rękopis"
 gdp_republic_unrest.0221.desc: "– Wasza czcigodność, oni to teraz… rozpowszechniają – mówi jeden z moich strażników, wręczając mi pewien rękopis. – Można je spotkać w całym mieście.\n\nRękopis zawiera mnóstwo szczegółów, zarówno obrażających mnie osobiście, jak i oskarżających mnie o najróżniejsze występki."
 gdp_republic_unrest.0221.a: "Znajdź autora rękopisu i rozpraw się z nim."
 gdp_republic_unrest.0221.a.success: "Sprawca zostaje znaleziony i uciszony"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "Autor pozostaje nieznany"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "Wyprę się tego publicznie."
 gdp_republic_unrest.0221.b.success: "Oskarżenia zaczynają się rozmywać"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "Ludzie ze mnie drwią"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "Kup każdy egzemplarz."
 gdp_republic_unrest.0221.d: "Takie rzeczy zazwyczaj rozchodzą się po kościach."
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "Powstanie w stolicy: u bram"
 gdp_republic_unrest.0301.desc: "Kilku strażników budzi mnie, mówiąc, że w naszą stronę zbliża się jakiś tłum. Idąc korytarzami, widzę, jak bardzo są one puste… większość moich gwardzistów mnie opuściła.\n\nWychylam się przez okno i dostrzegam, jak motłoch powoli się zbliża, krzycząc i wiwatując. Idą po mnie."
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "[ROOT.Char.GetTitleAsNameNoTooltip] to nie byle kto. Jak chcecie, to po [ROOT.Char.Custom('PL_niego_nia')] chodźcie."
 gdp_republic_unrest.0301.a.success: "Zabijam ich po kolei, aż nie ma już nic prócz moich trzęsących się dłoni i cichego, zakrwawionego pałacu"
 gdp_republic_unrest.0301.a.fail: "Motłoch mnie dorwał"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "Nigdy nie wezmą mnie żywcem!"
 gdp_republic_unrest.0301.b.success: "Ja i moi ludzie przedzieramy się siłą"
 gdp_republic_unrest.0301.b.fail: "Mają przewagę liczebną"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "Ucieknij przez bramę dla służby."
 gdp_republic_unrest.0301.c.success: "Udaje mi się wykraść"
 gdp_republic_unrest.0301.c.fail: "Złapali mnie"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "Moje panowanie dobiegło końca."
 gdp_republic_unrest.0301.d.flavor: "Podejdę do okna i ogłoszę rezygnację. Potem wyjdę bez broni i będę modlić się, by pozwolili mi żyć."
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "Powstanie w stolicy: wielka cisza"
 gdp_republic_unrest.0302.desc: "W pałacu zapanowała teraz cisza.\n\nCiała leżą tam, gdzie leżały, a bramy wciąż stoją otworem po ucieczce ostatnich buntowników. Moje dłonie prawie przestały się trząść.\n\nWciąż tu jestem."
 gdp_republic_unrest.0302.a: "Wciąż… żyję?"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "Powstanie w stolicy: nowe imię, nowe życie"
 gdp_republic_unrest.0303.desc: "Żyję.\n\nMiasto zostawiam za plecami, a na tej ulicy nikt nie wie, kim jestem. Nie mam już tytułu ani pałacu, a wszystko, co określało mnie przez lata, zniknęło.\n\nLecz żyję. To musi mieć jakieś znaczenie. Tylko dokąd mam się teraz udać?"
 gdp_republic_unrest.0303.a: "[destination_a.GetNameNoTierNoTooltip] to najlepszy wybór na nowy początek."
 gdp_republic_unrest.0303.a.tt: "[destination_a.GetNameNoTier] to najlepsze miejsce na nową siedzibę"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip] to dostatecznie oddalone miejsce. Mogę tam odbudować moje życie."
 gdp_republic_unrest.0303.b.tt: "[destination_b.GetNameNoTier] to najlepsze miejsce na nową siedzibę"
 gdp_republic_unrest.0303.c: "Gdzieś, gdzie nikt mnie nie zna. [destination_c.GetNameNoTierNoTooltip] – tam będzie doskonale."
 gdp_republic_unrest.0303.c.tt: "[destination_c.GetNameNoTier] to najlepsze miejsce na nową siedzibę"
 gdp_republic_unrest.0303.d: "Nie mam gdzie się udać. Zostanę tu i zajmę się czymś pożytecznym."
 gdp_republic_unrest.0303.tt: "Zwrócono wszystkie [domicile_buildings|El]"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.GetTitleAsNameNoTooltip] ginie"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName] nie żyje. Zamordowano [old_doge.Custom('PL_go_ja')] podczas powstania, a w pałacu zapadła cisza.\n\nMożna tylko zgadywać, co będzie dalej."
 gdp_republic_unrest.0304.a: "To zmienia wszystko."
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.GetTitleAsNameNoTooltip] znika"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName] znika. Nie żegna się, nikt też nie znajduje ciała – po prostu znika nocą, gdy motłoch stoi u bram.\n\nMożna tylko zgadywać, co będzie dalej."
 gdp_republic_unrest.0305.a: "To zmienia wszystko."
 gdp_republic_unrest.0306.t: "Powstanie w stolicy: nowe miasto, nowe życie"
 gdp_republic_unrest.0306.desc: "Droga za moimi plecami jest długa, a ja staram się nie odwracać.\n\nW tym miejscu nikt jeszcze nie wie, jak mam na imię. Rynki są mi obce, a twarze jeszcze bardziej. Ale można tu zarobić, zawrzeć nowe sojusze i odbudować życie z tej resztki, która mi pozostała."
 gdp_republic_unrest.0306.a: "Pora zabrać się do pracy."
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "Powstanie w stolicy: zabójca na rynku"
 gdp_republic_unrest.0311.desc: "Gdy przechodzę przez rynek, przed mną rozstępuje się tłum. Gwar nagle cichnie. Widzę postać, która nagle pędzi w moim kierunku z wyciągniętym mieczem.\n\nMoi strażnicy są zbyt daleko, by mi pomóc, a ja mam tylko chwilę na reakcję."
 gdp_republic_unrest.0311.a: "Gdzie jest mój miecz?!"
 gdp_republic_unrest.0311.a.success: "Udaje mi się w porę odparować cios"
 gdp_republic_unrest.0311.a.fail: "Postać dociera do mnie, zanim moja straż zdąża to zrobić"
 gdp_republic_unrest.0311.b: "Muszę się stąd wydostać. Natychmiast."
 gdp_republic_unrest.0311.b.success: "Udaje mi się uchylić przed zabójcą"
 gdp_republic_unrest.0311.b.fail: "Nie mam gdzie uciec"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "Powstanie w stolicy: nadal żyję"
 gdp_republic_unrest.0312.desc: "W całym zamieszaniu tłum się rozbiega, a ja jakoś wciąż żyję.\n\nSpoglądam na zwłoki zabójcy, którego strażnicy dogonili i z którym się rozprawili. Osoba ta wygląda jak każdy rzemieślnik w mieście.\n\nGdzie znajdę bezpieczeństwo, skoro nawet zwykli obywatele próbują mnie zabić?"
 gdp_republic_unrest.0312.a: "Ja… muszę wrócić do domu."
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "Powstanie w stolicy: oko za oko"
 gdp_republic_unrest.0321.desc: "Późną nocą do mojego gabinetu wprowadzono posłańca, który wręcza mi list.\n\n[heir.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))], pada ofiarą porwania, za którym stoi kilkoro uczestników zamieszek w mieście. Jeśli do rana nie wyjadę, odeślą [heir.GetHerHis] zwłoki z powrotem do mojej rezydencji."
 gdp_republic_unrest.0321.rival: "Mogą [heir.Custom('PL_go_ja')] sobie wziąć."
 gdp_republic_unrest.0321.a: "Zmobilizuj straż, niech sprowadzi [heir.Custom('PL_go_ja')] z powrotem."
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUINameNotMe] uchodzi z życiem"
 gdp_republic_unrest.0321.a.success: "Moi ludzie ratują [heir.Custom('PL_go_ja')] rychło w czas"
 gdp_republic_unrest.0321.a.fail: "Jest za późno"
 gdp_republic_unrest.0321.b: "Dowiedz się, gdzie [heir.Custom('PL_go_ja')] trzymają."
 gdp_republic_unrest.0321.b.success: "Udaje im się [heir.Custom('PL_go_ja')] odnaleźć"
 gdp_republic_unrest.0321.b.fail: "Nie udaje się [heir.Custom('PL_go_jej')] odnaleźć"
 gdp_republic_unrest.0321.c: "Zapłacę każde pieniądze. Tylko [heir.Custom('PL_go_ja')] mi oddajcie."
 gdp_republic_unrest.0321.d: "Bez [heir.Custom('PL_niego_niej')] ten tytuł nic nie znaczy."
 gdp_republic_unrest.0321.d.flavor: "Jeśli dzięki temu uda się [heir.Custom('PL_go_ja')] ocalić, to cena nie gra roli."
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "Powstanie w stolicy: bezpieczna ucieczka"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip] wchodzi do mojego gabinetu z lekkim, niepewnym uśmiechem. Nic [heir.Custom('PL_mu_jej')] nie jest – żyje. Na razie tylko to się liczy.\n\nMuszę zadbać o to, by ta sytuacja się nie powtórzyła."
 gdp_republic_unrest.0322.desc.rival: "Do mojego pokoju wchodzi sługa z wiadomością. [heir.GetFirstNameNoTooltip] jest już w domu.\n\nTo dobrze, na razie sukcesja pozostaje zabezpieczona. Muszę zadbać o to, by ta sytuacja się nie powtórzyła."
 gdp_republic_unrest.0322.a: "Och, jesteś z powrotem!"
 gdp_republic_unrest.0322.a.rival: "Dobrze. Możemy wrócić do ważnych spraw."
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "Powstanie w stolicy: za późno"
 gdp_republic_unrest.0323.desc: "Po zmroku rozlega się pukanie do bram. Słyszę głosy na zewnątrz, a następnie zapada cisza.\n\nGdy docieram na dziedziniec, już wiem, co się stało. Na bruku leży tam [heir.GetFirstNameNoTooltip]. To, co z [heir.Custom('PL_niego_niej')] zostało, motłoch odesłał do domu."
 gdp_republic_unrest.0323.desc.rival: "Po zmroku rozlega się pukanie do bram. Gdy docieram na dziedziniec, już wiem, co się stało.\n\nNa bruku leży tam [heir.GetFirstNameNoTooltip]. To, co z [heir.Custom('PL_niego_niej')] zostało, motłoch odesłał do domu. Stoję tam przez dłuższy czas, szukając tego, co zostało z mojego dziedzica."
 gdp_republic_unrest.0323.a.child: "Spójrz, jak zmasakrowali mi dziecko…"
 gdp_republic_unrest.0323.a: "[heir.GetFirstNameNoTooltip]… co oni ci uczynili?"
