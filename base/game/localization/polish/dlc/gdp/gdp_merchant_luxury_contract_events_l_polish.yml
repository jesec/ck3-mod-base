l_polish:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "Przemierzając [local_province.Custom('GetTerrainLandPlural')] miejsca znanego jako [local_county.GetNameNoTierNoTooltip], moja grupa dociera w pobliże osady i widząc wokoło [local_province.Custom('GetProvinceFoliageDescAdjective')] peryferia, rozbija obóz w okolicy,"
 gdp_merchant_luxury_contract.0001.desc.locals: "Grupa przechodzących wieśniaków odpowiada na nasze nieporadne pytania o lokalną przyrodę, odgrywając przed nami dziwaczne, lecz zaskakująco jednoznaczne scenki z udziałem"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "Grupa przechodzących wieśniaków odpowiada na nasze pytania, opowiadając lokalne historie z udziałem"
 gdp_merchant_luxury_contract.0001.desc.jungle: "gdzie powietrze jest nasycone słodkim zapachem nektaru."
 gdp_merchant_luxury_contract.0001.desc.mountain: "gdzie wśród gałęzi szumi orzeźwiający wiatr."
 gdp_merchant_luxury_contract.0001.desc.desert: "gdzie palące słońce ogrzewa niczym niezakłócony krajobraz."
 gdp_merchant_luxury_contract.0001.desc.plains: "gdzie powietrze wypełnia zapach polnych kwiatów."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "przerażających kotów."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "przebiegłych kotów"
 gdp_merchant_luxury_contract.0001.desc.bear: "groźnych niedźwiedzi."
 gdp_merchant_luxury_contract.0001.desc.monkey: "psotnych małp."
 gdp_merchant_luxury_contract.0001.desc.elephant: "majestatycznych słoni."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "przerażających kotów i groźnych niedźwiedzi."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "groźnych niedźwiedzi i majestatycznych słoni."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "przerażających kotów i majestatycznych słoni."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "psotnych małp i przerażających kotów."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "psotnych małp i majestatycznych słoni."
 gdp_merchant_luxury_contract.0001.desc.bird: "urzekających ptaków."
 gdp_merchant_luxury_contract.0001.desc.close: "Wygląda na to, że w końcu jesteśmy na dobrej drodze!"
 gdp_merchant_luxury_contract.0001.a: "Dzikie bestie czekają!"
 gdp_merchant_luxury_contract.0001.a.flavor: "Postać ceni umiejętności [martial_i|E] [Concept('martial', 'walki')|E], [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i [prowess_i|E] [Concept('prowess', 'waleczności')|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "Spróbuj pozyskać [domicile_artifact|El], którym jest #V stworzenie#!, w dziczy"
 gdp_merchant_luxury_contract.0001.b: "Zobaczmy, jakie skarby skrywa [local_barony.Custom('BaronyTownType')]."
 gdp_merchant_luxury_contract.0001.b.flavor: "Postać ceni umiejętności [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [stewardship_i|E] [Concept('stewardship', 'zarządzania')|E] oraz [gold_i|E] [gold|El]"
 gdp_merchant_luxury_contract.0001.b.tt: "Spróbuj pozyskać [domicile_artifact|El], którym jest #V stworzenie#!, w centrum miasta"
 gdp_merchant_luxury_contract_back_to_town_tt: "Wracasz, a twoim celem jest [local_barony.Custom('BaronyTownType')]"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "Wracasz do dziczy"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: lokalny koloryt"
 gdp_merchant_luxury_contract.0011.desc: "Gdy wędruję nieznanymi uliczkami miejsca o nazwie [local_province.GetBaronyNameExplicitlyNoTooltip], gdzie okolice są [local_province.Custom('GetProvinceAdjective')], moim oczom ukazuje się [local_province.Custom('GetRegionalMarketTermGloss')]. Przemawia tam dobrze ubrana miejscowa postać, której nie sposób nie zauważyć,"
 gdp_merchant_luxury_contract.0011.cage: "a w klatce obok niej siedzi [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0011.shoulder: "a na jej ramieniu siedzi [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0011.leashed: "a obok na smyczy siedzi [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0011.close: "\n\nOd okolicznych handlarzy dowiaduję się, że to [rich_local.GetTitledFirstName], [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)] lokalna osobistość znana z upodobania do dzikich i egzotycznych stworzeń.\n\nMoże udałoby nam się dojść do porozumienia?"
 gdp_merchant_luxury_contract.0011.a: "– Dobry człowieku, możemy porozmawiać o tym wspaniałym stworzeniu?"
 gdp_merchant_luxury_contract.0011.a.success: "Kupujesz od [rich_local.Custom('PL_niego_niej')] zwierzę, którym jest [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetTitledFirstName] odrzuca twoją ofertę"
 gdp_merchant_luxury_contract.0011.b: "Znajdę sobie własne zwierzę…"
 gdp_merchant_luxury_contract.some_other_way: "Musisz znaleźć inny sposób, by zdobyć stworzenie"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.GetTitledFirstName] mierzy mnie od stóp do głów zaciekawionym spojrzeniem, gdy się przedstawiam i nie szczędzę pochwał pod adresem bestii, która [rich_local.Custom('PL_mu_jej')] towarzyszy.\n\n"
 gdp_merchant_luxury_contract.0012.success: "Słysząc moje słowa, [rich_local.GetTitledFirstName] rozpromienia się. Chłonie moje komplementy i z dziecięcą wręcz ciekawością dopytuje, jak to się stało, że jestem tak daleko od domu.\n\nWkrótce uzgadniamy cenę i nim się obejrzę, [rich_local.Custom('GetAnimalType')] staje się moją własnością, co napawa mnie wyjątkową dumą!"
 gdp_merchant_luxury_contract.0012.failure: "Mina szybko [rich_local.Custom('PL_mu_jej')] rzednie. Najpierw marszczy brwi, a potem na [rich_local.Custom('PL_jego_jej')] usta wypełza pogardliwy uśmieszek. Odprawia mnie stanowczo, dając znak służbie, by mnie wyprowadzili.\n\nTa nadęta ciapa okropnie mnie traktuje. Chyba myśli, że #EMP ja#! to [rich_local.Custom('GetAnimalType')]…"
 gdp_merchant_luxury_contract.0012.a: "Całe miejsce znane jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] będzie o tym mówić!"
 gdp_merchant_luxury_contract.0012.b: "Chwileczkę, mogę zaoferować więcej!"
 gdp_merchant_luxury_contract.0012.c: "Któż śmiałby mi odmówić? [rich_local.Custom('GetAnimalType')|U] #EMP będzie#! należeć do mnie!"
 gdp_merchant_luxury_contract.0012.c.success: "Kradniesz zwierzę, którym jest [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0012.c.failure: "Ledwo uchodzisz straży"
 gdp_merchant_luxury_contract.0012.d: "#weak *kręcąc głową*#! – Nie ma mowy. Upoluję coś samodzielnie."
 gdp_merchant_luxury_contract.0012.e: "Mam tego dość…"
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "Nietrudno było odnaleźć posiadłość należącą do osoby znanej jako [rich_local.GetTitledFirstName] w miejscu o nazwie [local_province.GetBaronyNameExplicitlyNoTooltip] oraz zwerbować w tawernie kilku miejscowych prostaków, by po zapadnięciu zmroku wślizgnąć się do środka.\n\n"
 gdp_merchant_luxury_contract.0013.success: "Pokonanie zabezpieczeń przyszło nam niemal zbyt łatwo i nim się obejrzeliśmy, byliśmy już kilka ulic dalej, nasłuchując uważnie, czy nie rozlegnie się jakiś sygnał alarmowy.\n\nSłychać było jedynie, jak [rich_local.Custom('GetAnimalType')] [rich_local.Custom('GetAnimalSoundPresent')]!"
 gdp_merchant_luxury_contract.0013.failure: "Niestety tu wyczerpało się moje szczęście! Ledwo udało mi się umknąć straży, którą przyciągnęło to, że [rich_local.Custom('GetAnimalType')] głośno [rich_local.Custom('GetAnimalSoundPresent')], i cały plan legł w gruzach…\n\nLudzie osoby znanej jako [rich_local.GetFirstNameNoTooltip] z pewnością będą mnie teraz szukać!"
 gdp_merchant_luxury_contract.0013.a: "Trzeba było sprzedać mi zwierzę!"
 gdp_merchant_luxury_contract.0013.b: "Muszę się stąd natychmiast ulotnić!"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]: bestiariusz"
 gdp_merchant_luxury_contract.0021.desc: "[local_barony.Custom('BaronyTownType')|U] to ciekawe miejsce – jest tam [local_province.Custom('GetRegionalMarketTermGloss')], gdzie można zgubić się wśród krętych uliczek i ciemnych zakamarków. Smród i zwierzęce odgłosy prowadzą mnie prosto do [dealer.Custom('PL_niego_niej')]. [local_province.Custom('GetProvinceAdjective')|U] przestrzeń, a na niej zniszczony stragan i ta [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)] osoba. Wokół pełno wszelkiego rodzaju klatek, których budulcem jest [local_province.Custom('GetRandomRegionalWood')].\n\nDostrzegając moje zainteresowanie, [dealer.GetWomanMan] usilnie macha w moją stronę. To prawdziwa uczta dla oczu! Wspaniałe stworzenie natychmiast przyciąga moją uwagę. To [ROOT.Char.Custom('GetAnimalType')]. Gdy podziwiam [ROOT.Char.Custom('GetAnimalFeature')] zwierzęcia, [dealer.Custom('GetAnimalType')] [dealer.Custom('GetAnimalSoundPresent')] żałośnie w proteście.\n\nPrzeglądam towary, a oczy sprzedawcy błyszczą z wyczekiwaniem."
 gdp_merchant_luxury_contract.0021.a: "– Cudo… [ROOT.Char.Custom('GetAnimalType')|U] musi należeć do mnie!"
 gdp_merchant_luxury_contract.0021.b: "W miejscu znanym jako [local_province.GetBaronyNameExplicitlyNoTooltip] na pewno też można się potargować…"
 gdp_merchant_luxury_contract.0021.b.success_critical: "Robisz świetny interes"
 gdp_merchant_luxury_contract.0021.b.success: "Udaje ci się zaoszczędzić nieco grosza"
 gdp_merchant_luxury_contract.0021.b.failure: "Tylko pogarszasz sprawę"
 gdp_merchant_luxury_contract.0021.b.tt: "Będziesz mieć możliwość odmowy"
 gdp_merchant_luxury_contract.0021.c: "#weak *wskazując*#! – Niech będzie [dealer.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0021.d: "– Tylko oglądam."
 task_contract_success_pseudo: "#P Sukces:#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "Sprzedawca mruga do nas okiem – to z pewnością urodzony handlarz. Całe negocjacje zdają się trwać wieki, bowiem dyskutujemy o każdym szczególe [ROOT.Char.Custom('GetAnimalHide')] [ROOT.Char.Custom('GetAnimalPossessive')] i nad walorami tego, jak [ROOT.Char.Custom('GetAnimalSoundPresent')].\n\n"
 gdp_merchant_luxury_contract.0022.success: "Przedstawiam mocne argumenty i zdaje się, że [dealer.Custom('PL_go_ja')] one nieco poruszyły. Wkrótce ustępuje, znacznie obniżając cenę, choć, rzecz jasna, zawsze istnieją pewne granice…"
 gdp_merchant_luxury_contract.0022.neutral: "Moje argumenty musiały wywrzeć na [dealer.Custom('PL_nim_niej')] jakieś wrażenie, bo nieco obniża cenę, ale dalsze dyskusje nie mają sensu…"
 gdp_merchant_luxury_contract.0022.failure: "Wygląda na to, że tylko [dealer.Custom('PL_go_ja')] drażnię. [dealer.Custom('PL_jego_jej')|U] irytacja ciągle rośnie i nie chce ustąpić ani o krok…"
 gdp_merchant_luxury_contract.0022.a: "– Umowa stoi."
 gdp_merchant_luxury_contract.0022.b: "– Właściwie to interesuje mnie [dealer.Custom('GetAnimalType')]…"
 gdp_merchant_luxury_contract.0022.c: "#weak *kręcąc głową*#! – Nie ma mowy."
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "Wreszcie dopinam swego! [ROOT.Char.Custom('GetAnimalType')|U] należy teraz do mnie i to napawa mnie dumą! Ta szlachetna istota została starannie zabezpieczona i wkrótce wyruszy wraz z naszą karawaną w drogę powrotną.\n\nNiech tylko ujrzą to zwierzę w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_luxury_contract.0023.a: "Ruszajmy."
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: polowanie"
 gdp_merchant_luxury_contract.0041.desc: "Zbaczam ze znanych szlaków, a przede mną rozpościera się [local_province.Custom('GetTerrainType')]. Podążam dalej w poszukiwaniu śladów bestii, torując sobie drogę przez [local_province.Custom('GetProvinceFoliageDesc')]. Jedynie śpiew ptaków zakłóca panującą wokół upiorną ciszę. Mocniej ściągam poły płaszcza.\n\nGdy obracam się, by opuścić gęstwinę, dostrzegam, że [local_province.Custom('GetProvinceGroundDesc')] zdobią wyraźne ślady. To [ROOT.Char.Custom('GetAnimalTrack')]. Nagle w oddali słychać [ROOT.Char.Custom('GetAnimalSound')] – nieomylny zwiastun, że w pobliżu czai się [ROOT.Char.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0041.a: "Szybko, zanim nam ucieknie!"
 gdp_merchant_luxury_contract.0041.a.tt: "[THIS.Char.Custom('GetAnimalType')|U] to twoja zdobycz"
 gdp_merchant_luxury_contract.0041.b: "D… daj spokój, wracajmy!"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "Gdy przedzieram się przez [local_province.Custom('GetProvinceFoliageDesc')], kątem oka dostrzegam [ROOT.Char.Custom('GetAnimalColor')] fragmenty [ROOT.Char.Custom('GetAnimalHide')]. Obawiając się najgorszego, odwracam się gwałtownie, a serce niemal wyskakuje mi z piersi!\n\nPrzede mną stoi [ROOT.Char.Custom('GetAnimalType')] – to ledwie [ROOT.Char.Custom('GetAnimalChild')], a do tego jest w opłakanym stanie. Szerokie, ciekawskie oczy patrzą na mnie bez cienia strachu. Rozglądam się uważnie, lecz wydaje się, że zwierzak jest zupełnie sam – nigdzie nie widać rodziców, a [ROOT.Char.Custom('GetAnimalGroup')] też raczej nie czai się w pobliżu…"
 gdp_merchant_luxury_contract.0042.a: "Chcę znaleźć dorosłego osobnika!"
 gdp_merchant_luxury_contract.0042.a.tt: "Kontynuujesz poszukiwania [Concept('artifact', 'artefaktu')|E], którym jest [THIS.Char.Custom('GetAnimalType')] (dorosły osobnik)"
 gdp_merchant_luxury_contract.0042.b: "Może zastawię pułapkę…"
 gdp_merchant_luxury_contract.0042.b.success: "[ROOT.Char.Custom('GetAnimalChild')|U] służy ci za przynętę"
 gdp_merchant_luxury_contract.0042.b.success.tt: "Zyskujesz [artifact|El], którym jest [THIS.Char.Custom('GetAnimalType')] (dorosły osobnik)"
 gdp_merchant_luxury_contract.0042.b.failure: "Nie udaje ci się i [ROOT.Char.Custom('GetAnimalChild')] ucieka"
 gdp_merchant_luxury_contract.0042.c: "Czas ruszać. A #EMP ty#! idziesz ze mną, maluszku!"
 baby_creature_artifact_name: "[ROOT.Char.Custom('GetAnimalChild')|U] [baby_creature.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "Zaskakuje mnie błysk przecinający [local_province.Custom('GetProvinceFoliageDesc')]. Przez moment sądzę, że jakaś bestia podkradła się do mnie i obawiam się najgorszego!\n\nZ niemałą ulgą odkrywam, że to jedynie miejscowy traper spogląda na mnie podejrzliwie znad naciągniętej strzały.\n\n– Ha! Chcesz znaleźć [ROOT.Char.Custom('GetAnimalPlural')]? Pierwszy raz w życiu spotykam kogoś takiego jak ty."
 gdp_merchant_luxury_contract.0043.a: "Czy możesz… mi pomóc?"
 gdp_merchant_luxury_contract.0043.b: "Polowanie u twego boku będzie dla mnie zaszczytem."
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip] ci pomaga"
 gdp_merchant_luxury_contract.0043.b.success_tt: "Będziesz mieć większą szansę powodzenia"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip] zbywa cię"
 gdp_merchant_luxury_contract.0043.c: "Nie wchodź mi w drogę."
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "Wystarczy, że [ROOT.Char.Custom('GetAnimalChild')] trafi na odpowiednią polanę. Tam trzeba zwierzaka przywiązać do ziemi liną i zostawić. Prosta sprawa.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName] stanowi dla nas nieocenioną pomoc, dysponując rozległą wiedzą na temat tego, co skrywa [local_province.Custom('GetTerrainType')] i kto zamieszkuje te tereny. Wkrótce ruszamy tropem [ROOT.Char.Custom('GetAnimalPossessive')]!\n\n"
 gdp_merchant_luxury_contract.0044.desc: "Ten teren jest dla nas kompletnie nieznany, więc poruszamy się powoli, raz po raz gubiąc trop i podążając tą samą drogą, lecz w końcu natrafiamy na ślady [ROOT.Char.Custom('GetAnimalPossessive')]!\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "Jak można było się spodziewać, maluch [ROOT.Char.Custom('GetAnimalSoundParticiple')] cicho, szybko przyciągając uwagę dorosłego osobnika. Patrzymy, jak [ROOT.Char.Custom('GetAnimaltype')] bacznie obserwuje [local_province.Custom('GetProvinceFoliageDesc')]. W końcu niepewnym krokiem podchodzi do miejsca, w którym stoi [ROOT.Char.Custom('GetAnimalChild')], a my uruchamiamy pułapkę!"
 gdp_merchant_luxury_contract.0044.bait_failure: "A przynajmniej powinna taka być… Zwierzak nie wytrzymuje zbyt długo, siedząc spokojnie i cicho [ROOT.Char.Custom('GetAnimalSoundParticiple')]. Ta przeklęta bestia nagle rzuca się do ucieczki z całą siłą, zrywa się z uwięzi i daje nura w [local_province.Custom('GetProvinceFoliageDesc')]…"
 gdp_merchant_luxury_contract.0044.success: "My to mamy szczęście! Prawie zupełnym przypadkiem natrafiamy na zwierzaka, przeczesując [local_province.Custom('GetProvinceFoliageDesc')]. [ROOT.Char.Custom('GetAnimalType')|U], [ROOT.Char.Custom('GetAnimalSoundParticiple')], wykonuje gwałtowne ruchy, co sprawia, że wyraźnie widać [ROOT.Char.Custom('GetAnimalColor')] fragmenty ciała zwierzaka, które wpada prosto w sieć!"
 gdp_merchant_luxury_contract.0044.failure: "Sytuacja szybko jednak wymyka się spod kontroli. Jak tylko go dostrzegamy, [local_province.Custom('GetTerrainLand')] przysłania zwierzaka, który umyka w pośpiechu, [ROOT.Char.Custom('GetAnimalSoundParticiple')]. Widzimy tylko [ROOT.Char.Custom('GetAnimalColor')] fragmenty jego ciała. Stworzenie jest zbyt wystraszone, by dać się złapać."
 gdp_merchant_luxury_contract.0044.a: "Ależ z was zgrana para!"
 gdp_merchant_luxury_contract.0044.b: "Przeklęte bestie!"
 gdp_merchant_luxury_contract.0044.c: "Mam cię!"
 gdp_merchant_luxury_contract.0044.d: "Przeklęta bestia!"
 gdp_merchant_luxury_contract.0044.e: "[hunter.GetFirstNameNoTooltip], co powiesz na odwiedziny w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]?"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: kłusownictwo"
 gdp_merchant_luxury_contract.0051.desc: "Trafiamy na [local_province.Custom('GetProvinceGroundDescAdjective')] tereny wioski i pytamy w niej o lokalną faunę. Sołtys poważnym tonem ostrzega nas, byśmy jak najszybciej się stąd oddalili, wyjaśniając, że miejscowa gruba ryba, „[rich_local.GetName]”, poluje w okolicy na [rich_local.Custom('GetAnimalPlural')].\n\nZanim zdążyliśmy wyruszyć dalej, zjawia się [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)] wieśniak i szeptem przekonuje nas, że złapanie jednego osobnika należącego do osoby znanej jako [rich_local.GetTitleAsNameNoTooltip] byłoby dziecinnie proste!\n\nTo zuchwały pomysł… ale też zbyt kusząca okazja, by tak po prostu ją przepuścić."
 gdp_merchant_luxury_contract.0051.a: "[rich_local.Custom('GetAnimalType')|U]? Ruszajmy natychmiast!"
 gdp_merchant_luxury_contract.0051.a.flavor: "Miejscowych może czekać kara…"
 gdp_merchant_luxury_contract.0051.a.tt: "Spróbujesz upolować zwierzynę należącą do osoby znanej jako [rich_local.GetShortUINameNotMe]"
 gdp_merchant_luxury_contract.0051.b: "Wolę nie zadzierać z osobą znaną jako [rich_local.GetTitleAsNameNoTooltip]…"
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "Mój przewodnik, [hunter.GetFirstName], szybko prowadzi nas przez [local_province.Custom('GetProvinceFoliageDesc')], przemierzając [local_province.Custom('GetTerrainTypePlural')] w imponującym tempie. Dochodząc do polany, nagle zatrzymuje się i nastawia ucho.\n\n– Cisza – syczy, odciągając mnie z pola widzenia. – Jesteśmy blisko.\n\nW ułamku sekundy tuż obok nas z łoskotem przetacza się cały tabun, wzburzając [local_province.Custom('GetProvinceGroundDesc')], a myśliwi krzyczą w oddali.\n\nWtedy słyszę [rich_local.Custom('GetAnimalSound')]. To z pewnością [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0052.a: "Biegnie! Dajcie sieć!"
 gdp_merchant_luxury_contract.0052.a.success: "[rich_local.Custom('GetAnimalType')|U] wpada w twoje ręce"
 gdp_merchant_luxury_contract.0052.a.neutral: "[rich_local.Custom('GetAnimalType')|U] ci umyka"
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('GetAnimalType')|U] cię rani"
 gdp_merchant_luxury_contract.0052.b: "Kryć się! Już po nas!"
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('GetAnimalType')|U] ucieka"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "Wracamy do wioski, a tam z jednego z domów wybiega wściekły sołtys, krzycząc, że przed chwilą byli tu ludzie osoby znanej jako [rich_local.GetTitledFirstName] i szukali kłusowników!\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName] spogląda z poczuciem winy na skrępowane zwierzę, jednak owo poczucie winy nie jest na tyle duże, by ukryć [hunter.GetHerHis] zadowolenie."
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName] stoi ze spuszczoną głową, gdy reszta mieszkańców wioski spogląda na [hunter.Custom('PL_niego_nia')] z wyraźnym niezadowoleniem.\n\n[hunter.Custom('GetAnimalType')|U], [hunter.Custom('GetAnimalWalkParticiple')] na uwięzi, staje [hunter.Custom('PL_mu_jej')] na drodze, gdy wraca do swojego domostwa."
 gdp_merchant_luxury_contract.0053.a: "– Cóż za cudowne stworzenie…"
 gdp_merchant_luxury_contract.0053.b: "– …[rich_local.GetTitleAsNameNoTooltip] dowie się, kto je zabrał!"
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip] jest pod wrażeniem twojej śmiałości"
 gdp_merchant_luxury_contract.0053.c: "– To był fatalny pomysł…"
 gdp_merchant_luxury_contract.0053.d: "– …ale przydałby mi się ktoś taki jak ty, [hunter.GetFirstNameNoTooltip]."
 gdp_merchant_luxury_contract.0053.e: "– [hunter.Custom('GetAnimalType')|U]? Pierwsze słyszę, że masz zwierzaka!"
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "Tego ranka w miejscu znanym jako [local_province.GetBaronyNameExplicitlyNoTooltip] udaje nam się dostrzec cel, którego tak długo szukaliśmy. [local_province.Custom('GetTerrainLandPlural')|U], a spośród nich wyłania się [local_barony.Custom('BaronyTownType')]"
 gdp_merchant_luxury_contract.1001.desc.locals: "Język [local_county.GetCountyData.GetCulture.GetLanguage.GetName|l] nie jest naszą mocną stroną. Gdy stajemy u bram, przechodzący mieszkańcy wioski z trudem odpowiadają na nasze nieporadne pytania, ale wskazują"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "Znamy nieco język [local_county.GetCountyData.GetCulture.GetLanguage.GetName|l], więc gdy stajemy u bram, możemy podpytać mieszkańców wioski o kierunek. Grupa, z którą rozmawiamy, wskazuje nam"
 gdp_merchant_luxury_contract.1001.desc.religious: "wielki i czczony grobowiec w miejscu znanym jako [religious_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "renomowany ośrodek nauki w miejscu znanym jako [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.fallback: "miejscowy targ."
 gdp_merchant_luxury_contract.1001.a: "[local_province.Custom('GetRegionalMarketTerm')|U] to miejsce, w którym powinniśmy coś znaleźć."
 gdp_merchant_luxury_contract.1001.a.flavor: "Postać ceni umiejętność [stewardship_i|E] [Concept('stewardship', 'zarządzania')|E] i [gold_i|E] [gold|El]"
 gdp_merchant_luxury_contract.1001.a.tt: "Próba nabycia na rynku #V unikatowego#! [Concept('domicile_artifact', 'artefaktu domowego')|E]"
 gdp_merchant_luxury_contract.1001.d: "Wzywa nas [local_province.Custom('GetRegionalMarketTerm')]!"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "Wybierzmy się do tego świętego miejsca."
 gdp_merchant_luxury_contract.1001.e.flavor: "Postać ceni [piety_i|E] [piety|El] i umiejętność [learning_i|E] [Concept('learning', 'nauki')|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "Spróbuj pozyskać [domicile_artifact|El], którym jest #V unikat#!, w miejscu sakralnym"
 gdp_merchant_luxury_contract.1001.f: "Z pewnością możemy się tu wiele nauczyć."
 gdp_merchant_luxury_contract.1001.f.flavor: "Postać ceni umiejętności [learning_i|E] [Concept('learning', 'nauki')|E] i [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "Spróbuj pozyskać [domicile_artifact|El], którym jest #V unikat#!, w centrum miasta"
 gdp_merchant_luxury_contract.1001.return.religious: "Wróćmy do miejsca świętego…"
 gdp_merchant_luxury_contract.1001.return.scholarly: "Znajdźmy ośrodek nauki…"
 gdp_merchant_luxury_contract.1001.return.urban: "Pójdę po prostu na targ…"
 gdp_merchant_luxury_contract.1001.give_up: "Pff, zapomnij!"
 gdp_merchant_luxury_contract.1001.fallback: "Nie opuszczę miejsca znanego jako [local_province.GetBaronyNameExplicitlyNoTooltip] z pustymi rękoma."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "[local_province.Custom('GetRegionalMarketTermGloss')|U] ma wiele do zaoferowania. Znajdujesz tam kilka ozdób"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: centrum handlu"
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetTitle.Custom('BaronyTownType')|U] w miejscu znanym jako [local_province.GetBaronyNameExplicitlyNoTooltip] tętni życiem, a mieszkańcy i podróżni poszukują wszelkiego rodzaju towarów wśród atrakcji, dźwięków i zapachów, jakie oferują [local_province.Custom('GetRegionalMarketTermGloss')] i [local_province.Custom('GetProvinceAdjective')] okolice.\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "W ciemnym zakątku dostrzegam ponurego ulicznego łobuza. [urchin.GetHerHis|U] małe, bystre oczy w milczeniu obserwują niekończący się strumień przechodniów."
 gdp_merchant_luxury_contract.1101.antiques: "Sękate stoisko z antykami, usiane drobiazgami, których budulcem jest [local_province.Custom('GetRandomRegionalWood')], i zaśniedziałym metalem, pobudza moją ciekawość, ku wielkiej radości jego zarządcy."
 gdp_merchant_luxury_contract.1101.bookseller: "Podniszczona markiza z [ROOT.Char.Custom('RegionalFabric')] nad obskurnym sklepikiem skrywa piętrzące się przy ścianach stosy podniszczonych zwojów i tomów, nad którymi czuwa [dealer.Custom('GetYoungMiddleAgedOld')] [dealer.GetWomanMan]."
 gdp_merchant_luxury_contract.1101.travelers: "Nieco szpakowaci [traveler.GetCulture.GetCollectiveNoun] rozsiedli się na pobliskim placu, a ich stroje i sposób mówienia sprawiają, że są wyraźnie inni niż miejscowa ludność [local_province.GetCulture.GetName|l]."
 gdp_merchant_luxury_contract.1101.tavern: "Rubaszna wrzawa tawerny po drugiej stronie ulicy przyciąga moją uwagę. Pewna osoba, która nie stroni od hazardu i wygląda dość groźnie, beztrosko podrzuca sakiewkę z monetami. [gambler.Custom('PL_jego_jej')|U] zrozpaczony przeciwnik właśnie ją stracił."
 gdp_merchant_luxury_contract.1101.merchant: "Dostrzegam elegancko ubraną osobę, która gani karawanę za jej powolny przejazd przez miasto. To jest najwyraźniej miejscowy kupiec z prawdziwego zdarzenia – moja bratnia dusza."
 gdp_merchant_luxury_contract.1101.a: "To dziecko wygląda na… #EMP przebiegłe#!."
 gdp_merchant_luxury_contract.1101.a.flavor: "Postać ceni umiejętności [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i [Concept('diplomacy', 'dyplomacji')|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "Widzisz, co mówi ten urwis"
 gdp_merchant_luxury_contract.1101.b: "Ten sprzedawca może mieć coś interesującego…"
 gdp_merchant_luxury_contract.1101.b.flavor: "Postać ceni umiejętność [learning_i|E] [Concept('learning', 'nauki')|E] i [gold_i|E] [gold|El]"
 gdp_merchant_luxury_contract.1101.b.tt: "Próbujesz kupić interesujący antyk"
 gdp_merchant_luxury_contract.1101.c: "Z pewnością znajdzie się tu jakaś interesująca księga."
 gdp_merchant_luxury_contract.1101.c.flavor: "Postać ceni umiejętność [learning_i|E] [Concept('learning', 'nauki')|E] i [gold_i|E] [gold|El]"
 gdp_merchant_luxury_contract.1101.c.tt: "Próbujesz kupić interesującą księgę"
 gdp_merchant_luxury_contract.1101.d: "Ci [traveler.GetCulture.GetCollectiveNounNoTooltip] na pewno niejedno widzieli."
 gdp_merchant_luxury_contract.1101.d.lingua: "To okazja, by sprawdzić moją znajomość języka, którym jest język [traveler.GetCulture.GetLanguage.GetNameNoTooltip|l]."
 gdp_merchant_luxury_contract.1101.d.flavor: "Postać ceni umiejętności [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [learning_i|E] [Concept('learning', 'nauki')|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "Rozmawiasz z podróżnymi"
 gdp_merchant_luxury_contract.1101.e: "Nie potrafię się oprzeć hazardowi…"
 gdp_merchant_luxury_contract.1101.e.flavor: "Postać ceni umiejętność [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i okazje"
 gdp_merchant_luxury_contract.1101.e.tt: "Sprawdź, co można wygrać od hazardzisty"
 gdp_merchant_luxury_contract.1101.f: "Ach, konkurent chyba mnie zrozumie."
 gdp_merchant_luxury_contract.1101.f.flavor: "Postać ceni umiejętność [stewardship_i|E] [Concept('stewardship', 'zarządzania')|E] i [prestige_i|E] [prestige_level|El]"
 gdp_merchant_luxury_contract.1101.f.tt: "Sprawdź, co ma do powiedzenia sprzedawca"
 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstName] zachowuje czujność i naprawdę trudno [urchin.Custom('PL_go_ja')] zmiękczyć. Próbuję więc zjednać [urchin.Custom('PL_go_ja')] sobie, szydząc z przechodniów i snując opowieści o mrocznych zaułkach miejsca znanego jako [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "Moje opowieści o odległych krainach i zyskach płynących z kupieckiego życia wyraźnie budzą [urchin.GetHerHis] zainteresowanie. Gdy mam zamiar złożyć ofertę, [urchin.GetSheHe] niespodziewanie proponuje mi biżuterię za darmo – jeśli tylko zabiorę [urchin.Custom('PL_go_ja')] ze sobą!"
 gdp_merchant_luxury_contract.1102.urchin.success: "W końcu czuję, że udało mi zdobyć [urchin.GetHerHis] zaufanie i mogę przejść do rzeczy. Pytam zatem, ile chce za tę biżuterię. [urchin.GetFirstNameNoTooltip] z chytrym uśmiechem podaje mi swoją cenę."
 gdp_merchant_luxury_contract.1102.urchin.failure: "W końcu czuję, że udało mi zdobyć [urchin.GetHerHis] zaufanie i mogę przejść do rzeczy. Pytam zatem, ile chce za tę biżuterię. [urchin.GetFirstNameNoTooltip] wykrzywia usta w pogardliwym uśmiechu i każe mi się wynosić."
 gdp_merchant_luxury_contract.1102.antiques: "Przez dłuższą chwilę przerzucamy się argumentami – o jakości wykonania przedmiotu, jego wieku i stanie.\n\nW końcu ja i ten [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] gagatek dochodzimy do sytuacji patowej."
 gdp_merchant_luxury_contract.1102.antiques.success: "Muszę przyznać, że cena nie jest wygórowana – ba, jest znacznie lepsza, niż można było oczekiwać."
 gdp_merchant_luxury_contract.1102.antiques.failure: "Nie powiem, żeby ten wynik mnie cieszył. Mam wrażenie, że mnie wyzyskano."
 gdp_merchant_luxury_contract.1102.bookseller: "Przez dłuższą chwilę przerzucamy się argumentami – o pochodzeniu księgi, jej wieku i stanie.\n\nW końcu ja i ten [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] gagatek dochodzimy do sytuacji patowej."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "Grupa nieco się do mnie przekonuje – najwyraźniej jestem dla nich najciekawszym widokiem, jaki mieli dziś przed oczami – i wkrótce wymieniamy się opowieściami z naszych podróży."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nNiedługo potem dzielimy się chlebem, śmiejemy się i żartujemy z naszych wspólnych nieszczęść oraz doświadczeń z miejsca znanego jako [local_province.GetBaronyNameExplicitly]. Przy pożegnaniu [traveler.GetFirstName] wciska mi w dłoń pakunek i obejmuje mnie serdecznie."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nPo wymianie kilku ciekawostek szybko kończą mi się tematy, a [traveler.GetCulture.GetCollectiveNoun] nie potrafią ukryć, że woleliby, żeby już mnie tu nie było."
 gdp_merchant_luxury_contract.1102.tavern: "Po pierwszych kilku rundach zdaje się, że idziemy łeb w łeb – raz wygrywam ja, raz [gambler.GetSheHe]. Wymieniamy się monetami i docinkami, ale [gambler.GetFirstName] to cwana bestia, co do tego nie ma najmniejszych wątpliwości.\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "Doznaję dziś łaski [merchant.GetFaith.WealthGodNamePossessive]! Miażdżąca przewaga na początku gry zapewnia mi wygraną, a [gambler.GetFirstNameNoTooltip] zamiera, nie dowierzając. Klnie pod nosem, nakręcając się coraz bardziej, aż w końcu wybiega z krzykiem i ciska kości na ulicę!"
 gdp_merchant_luxury_contract.1102.tavern.failure: "Chwilę to trwa, ale w końcu udaje mi się wyjść na prowadzenie. [gambler.GetFirstNameNoTooltip] wykazuje sporo cierpliwości, jednak ostatecznie daje za wygraną, a ja cieszę się ze zwycięstwa."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "Niezbyt długo to trwało. [gambler.GetFirstNameNoTooltip] naprawdę szybko się rozkręca i w mgnieniu oka przegrywam rundę za rundą, tracąc cierpliwość i uszczuplając zasobność mojej sakiewki. W końcu wycofuję się z ponurą miną, a [gambler.GetFirstNameNoTooltip] chełpi się wygraną."
 gdp_merchant_luxury_contract.1102.merchant: "W jednej z zacisznych kancelarii nieopodal lokalnego targu ja i [other_merchant.GetTitledFirstName] omawiamy nasze interesy, snując rozważania na temat wspólnych znajomych w odległych zakątkach świata. Zarówno ja, jak i [other_merchant.GetSheHe], podkreślamy własne sukcesy.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "Szybko znajdujemy wspólny język. [other_merchant.Custom('RegionalDrink')|U] i chleb idealnie nadają się do tego, by delektując się nimi, wymieniać się poradami oraz omawiać przyszłe możliwości, które przyniosą nam obopólne korzyści. Trudno się było rozejść, więc na pożegnanie [other_merchant.GetFirstNameNoTooltip] wręcza mi kilka wybornych próbek."
 gdp_merchant_luxury_contract.1102.merchant.failure: "Wygląda na to, że niezbyt wiele nas łączy. Irytują nas wzajemne przechwałki i niechęć do podzielenia się jakimiś naprawdę użytecznymi informacjami. Wkrótce więc żegnam się i opuszczam tę bezbarwną postać."
 gdp_merchant_luxury_contract.1102.a: "To będzie w sam raz."
 gdp_merchant_luxury_contract.1102.b: "To musi wystarczyć…"
 gdp_merchant_luxury_contract.1111.desc: "Przechodzę przez ulicę w miejscu, w którym okolica jest [local_province.Custom('GetProvinceAdjective')], kierując się w stronę, gdzie stoi [urchin.Custom('GirlBoy')]. Gdy mnie dostrzega, [urchin.GetHerHis] przenikliwe spojrzenie domaga się wyjaśnienia, lecz daję jasno do zrozumienia, że nie stanowię zagrożenia, i przysuwam się do muru, o który się opiera.\n\nW [urchin.GetHerHis] dłoni błyszczy kusząco ozdoba, ale szybko ją chowa, gdy widzi mój wzrok.\n\n– Czego chcesz? – syczy. – Jestem [urchin.GetFirstName]. To #EMP moje#! ulice."
 gdp_merchant_luxury_contract.1111.a: "Wyglądasz na kogoś, kto zna się na rzeczy."
 gdp_merchant_luxury_contract.1111.a.success_critical: "Wzbudzasz [urchin.GetHerHis] zaufanie"
 gdp_merchant_luxury_contract.1111.a.success: "Kupujesz [urchin.GetHerHis] łupy"
 gdp_merchant_luxury_contract.1111.a.failure: "Wzbudzasz w [urchin.Custom('PL_nim_niej')] pogardę"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "Osoba znana jako [urchin.GetFirstName] ukradła ten artefakt na ulicach miejsca o nazwie [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1111.artifact.ring: "Pierścień [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "Broszka [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "Naszyjnik [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "Udając obojętność, oglądam wystawione towary, starannie ukrywając, jak bardzo mnie interesują – choć trudno powiedzieć, na ile sklepikarz daje się na to nabrać.\n\nWkrótce moją uwagę przykuwa konkretny przedmiot, który wyróżnia się wśród reszty. Upływ czasu uczynił go na tyle osobliwym, że nawet tutaj, w miejscu jego powstania, wygląda egzotycznie."
 gdp_merchant_luxury_contract.1121.a: "Porozmawiajmy o cenie…"
 gdp_merchant_luxury_contract.1121.a.success_critical: "Udało ci się wynegocjować znakomitą cenę"
 gdp_merchant_luxury_contract.1121.a.success: "Udało ci się wynegocjować dobrą cenę"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetWomanMan|U] ostro się targuje"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "[artifact.GetName] – antyk"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] Upływ czasu sprawił, że nie nadaje się już do użycia w walce."
 gdp_merchant_luxury_contract.1121.artifact.bowl: "Antyczna [local_province.GetCounty.GetCulture.GetNameNoTooltip|l] misa"
 gdp_merchant_luxury_contract.1121.artifact.plate: "Antyczna [local_province.GetCounty.GetCulture.GetNameNoTooltip|l] taca"
 gdp_merchant_luxury_contract.1121.artifact.urn: "Antyczna [local_province.GetCounty.GetCulture.GetNameNoTooltip|l] urna"
 gdp_merchant_luxury_contract.1131.desc: "Udając obojętność, oglądam wystawione dzieła, starannie ukrywając, jak bardzo mnie interesują – choć trudno powiedzieć, na ile sklepikarz daje się na to nabrać.\n\nWkrótce moją uwagę przykuwa konkretna oprawa, która wyróżnia się wśród reszty. Z tego, co widzę, jest to rzadkie i niedoceniane dzieło."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Przedmiot ten został nabyty od sprzedawcy w miejscu znanym jako [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1141.desc: "Z ciepłym uśmiechem podchodzę w miejsce, gdzie stoi [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )] przywódca grupy, licząc na to, że nasza wspólna obcość okaże się czynnikiem jednoczącym w tym dziwnym miejscu.\n\n[traveler.GetWomanMan|U] przedstawia się imieniem [traveler.GetFirstName].\n\n– [merchant.GetNameNoTooltip]. Z pewnością o mnie słyszeliście? – skłaniam głowę, blefując i żartując zarazem."
 gdp_merchant_luxury_contract.1141.a: "Na pewno masz jakieś ciekawe opowieści!"
 gdp_merchant_luxury_contract.1141.a.flavor: "Próba umiejętności [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [prestige_i|E] [Concept('prestige_level', 'poziomu sławy')|E]"
 gdp_merchant_luxury_contract.1141.a.success: "Ty i [traveler.GetFirstNameNoTooltip] dogadujecie się"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip] ma ciebie dość"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] Przedmiot ten został nabyty od sprzedawcy w miejscu znanym jako [local_province.GetBaronyNameExplicitly]. Upływ czasu sprawił, że nie nadaje się już do użycia w walce."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip] broszka"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ Przedmiot ten został nabyty od podróżnych w miejscu znanym jako [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1151.desc: "Przeciskam się przez kotarę do obskurnej nory, gdzie dostrzegam rozpustników i włóczęgów. W samym środku izby siedzi hazardzista, radośnie przeliczając monety.\n\nSiadam naprzeciwko, a [gambler.GetWomanMan] mierzy mnie spojrzeniem, unosząc brew.\n\n– Chcesz zagrać? – Uśmiecha się. – Jestem [gambler.GetFirstName]. Tylko nie płacz, gdy opróżnię twoją sakiewkę."
 gdp_merchant_luxury_contract.1151.a: "Zagrajmy."
 gdp_merchant_luxury_contract.1151.a.flavor: "Próba umiejętności [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i tego, czy sprzyja ci szczęście"
 gdp_merchant_luxury_contract.1151.a.success: "Ogrywasz [gambler.Custom('PL_go_ja')] do zera"
 gdp_merchant_luxury_contract.1151.a.failure: "Wygrywasz kilka monet"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "Przegrywasz kilka monet"
 gdp_merchant_luxury_contract.1151.artifact.dice: "Szczęśliwe kości hazardzisty"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "Wywalczone z trudem kości należące do osoby znanej jako [gambler.GetFirstName], którą można określić mianem złodzieja i oszusta z miejsca o nazwie [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1161.desc: "Przerywając utyskiwania kupca, przedstawiam się jako zwierzchnik miejsca znanego jako [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip] rezydujący w miejscu o nazwie [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], zaznaczając przy tym, że nie przybywam tu w interesach.\n\nW odpowiedzi dowiaduję się, że to [other_merchant.GetName] z baronii znanej pod nazwą [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly]. Zajmuje się [other_merchant.GetSheHe] tu handlem towarem o nazwie [merchant_good.GetName|l]. Po wymianie uprzejmości [other_merchant.GetName] proponuje mi nocleg w pobliżu."
 gdp_merchant_luxury_contract.1161.a: "Mamy wiele tematów do omówienia."
 gdp_merchant_luxury_contract.1161.a.flavor: "Próba umiejętności [stewardship_i|E] [Concept('stewardship', 'zarządzania')|E] i [prestige_i|E] [Concept('prestige_level', 'poziomu sławy')|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip] zaczyna cię lubić"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip] okazuje nieprzejednanie"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Próbki tkanin"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Próbki [other_merchant.Custom('RegionalFabric')] z miejsca znanego jako [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip] wykorzystywane przez kupców w ich codziennych transakcjach."
 gdp_merchant_luxury_contract.1161.artifact.gem: "Próbki klejnotów"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Próbki drogocennych kamieni z miejsca znanego jako [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip] wykorzystywane przez kupców w ich codziennych transakcjach."
 gdp_merchant_luxury_contract.1161.artifact.gold: "Próbki metali"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Próbki drogocennych metali z miejsca znanego jako [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip] wykorzystywane przez kupców w ich codziennych transakcjach."
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: ośrodek religijny"
 gdp_merchant_luxury_contract.1501.desc: "Podążamy ścieżkami niezliczonych pielgrzymów i wiernych, aż naszym oczom ukazuje się wspaniałą budowla – [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l] w miejscu znanym jako [religious_building_province.GetName].\n\n"
 gdp_merchant_luxury_contract.1501.site: "Sarkofag jest okazałym pomnikiem żarliwości wobec [religious_building_faith.HighGodNamePossessive], jaką wykazywali dawni władcy wyznający religię, którą jest [religious_building_faith.GetReligion.GetName|l]. Z wnętrza dobiega melodyjny pomruk trwającego nabożeństwa."
 gdp_merchant_luxury_contract.1501.tombs: "Niedaleko stąd znajduje się grupa zniszczonych przez upływ czasu i porośniętych chwastami kamiennych grobowców oznaczonych religijnym symbolem, którym jest [religious_building_faith.ReligiousSymbol]."
 gdp_merchant_luxury_contract.1501.pilgrim: "Przed wejściem ustawiają się nieprzerwane kolejki wiernych. Sądząc po ich strojach, to pielgrzymi. Szczególnie wyróżnia się jedna grupa. Niosą wspólnie coś w rodzaju relikwiarza."
 gdp_merchant_luxury_contract.1501.monks: "Nieopodal, w cieniu, zgromadziła się grupa mnichów trwających w zadumie, wymieniających półgłosem myśli, podczas gdy świat leniwie kręci się dalej."
 gdp_merchant_luxury_contract.1501.keepsake: "Zbliżając się do gmachu, dostrzegam zniszczony fragment muru – miejsce, gdzie kilka kamieni poluzowało się i popękało pod naporem mijających stuleci."
 gdp_merchant_luxury_contract.1501.apostate: "Nieco na uboczu [pilgrim.GetWomanMan] o zmartwionym obliczu przysiada samotnie w cieniu budowli, łokcie wspierając na kolanach. W jednej dłoni kryje twarz, w drugiej zaś dzierży niedużą księgę."
 gdp_merchant_luxury_contract.1501.a: "Chcę zajrzeć do środka."
 gdp_merchant_luxury_contract.1501.a.flavor: "Postać ceni umiejętność [learning_i|E] [Concept('learning', 'nauki')|E] i [piety_i|E] [piety|El]"
 gdp_merchant_luxury_contract.1501.a.tt: "Sprawdzasz, co skrywa [religious_building_faith.HouseOfWorship]"
 gdp_merchant_luxury_contract.1501.b: "W tych grobowcach musi coś być…"
 gdp_merchant_luxury_contract.1501.b.flavor: "Postać ceni umiejętności [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i [prowess_i|E] [Concept('prowess', 'waleczności')|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "Wracasz nocą, by splądrować grób"
 gdp_merchant_luxury_contract.1501.c: "Ci pielgrzymi wyglądają na łatwowiernych…"
 gdp_merchant_luxury_contract.1501.c.flavor: "Postać ceni umiejętności [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "Próbujesz oszukać pielgrzyma"
 gdp_merchant_luxury_contract.1501.d: "Chcę porozmawiać z tymi mnichami."
 gdp_merchant_luxury_contract.1501.d.flavor: "Postać ceni umiejętność [learning_i|E] [Concept('learning', 'nauki')|E] i [piety_i|E] [piety|El]"
 gdp_merchant_luxury_contract.1501.d.tt: "Rozpoczynasz rozmowę z mnichami"
 gdp_merchant_luxury_contract.1501.e: "Nikt nie zauważy brakującego kamienia…"
 gdp_merchant_luxury_contract.1501.e.flavor: "Postać ceni umiejętności [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i [prowess_i|E] [Concept('prowess', 'waleczności')|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "Próbujesz ukraść fragment gmachu"
 gdp_merchant_luxury_contract.1501.f: "Wygląda na to, że [pilgrim.GetWomanMan] potrzebuje pomocy."
 gdp_merchant_luxury_contract.1501.f.flavor: "Postać ceni umiejętność [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [piety_i|E] [piety|El]"
 gdp_merchant_luxury_contract.1501.f.tt: "Rozpoczynasz rozmowę z pielgrzymem"
 gdp_merchant_luxury_contract.1502.site: "[priest.Custom('PriestTitle')|U] mierzy mnie uważnym spojrzeniem od stóp do głów, rozważając moje słowa i wyraz twarzy, podczas gdy obok nas przechodzą wierni, mamrocząc modlitwy i prośby.\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "– Nie mogę odmówić twojej gorącej prośbie – wzdycha w końcu. Sięga po leżącą obok księgę i przez chwilę gładzi palcami jej okładkę, po czym mi ją podaje.\n\n– Weź to. Niech słowo [religious_building_faith.HighGodNameAlternatePossessive] znajdzie drogę do ciebie."
 gdp_merchant_luxury_contract.1502.site.failure: "W końcu marszczy brwi.\n\n– Wynoś się stąd, nie ma tu dla ciebie miejsca. To [religious_building_faith.HouseOfWorship], miejsce kultu. Nie mam dziś czasu wysłuchiwać bzdur, które wygadujesz.\n\nKilku wiernych odwraca głowy, czekając, aż odejdę."
 gdp_merchant_luxury_contract.1502.pilgrim: "Po kilku uprzejmych pytaniach dowiaduję się w końcu, że nabyli tę relikwię niedaleko ich rodzinnego miasta i przywieźli ją tutaj, ponieważ [pilgrim.GetFaith.HouseOfWorship] to dla niej odpowiednie miejsce. Chcą ją tu zostawić.\n\nUdaję zaniepokojenie, okazując rzekomą troskę, że zostali tak haniebnie oszukani!\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Z żalem, choć bez gniewu, śledzę wzrokiem ich oddalające się sylwetki, aż dostrzegam, jak ciskają niewielkie pudełko na ugór za obrzeżem dziedzińca."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Ich reakcja nieco mnie zaskakuje, ponieważ rzucają relikwię na ziemię, rozbijając ją w drobny mak ku wielkiemu zgorszeniu zgromadzonych.\n\nLepiej będzie, jeśli się oddalę…"
 gdp_merchant_luxury_contract.1502.tomb: "Te grobowce są znacznie trudniejsze do sforsowania, niż się wydaje! W końcu potężnym pchnięciem udaje nam się rozewrzeć jeden z bardziej okazałych pomników.\n\nOtarłszy pot z czoła, pochylam się, by zajrzeć w jego mroczne wnętrze. Dostrzegam coś, ostrożnie sięgam do środka i wyjmuję znalezisko.\n\n– Poświećcie tu! – szepczę niecierpliwie.\n\nW dłoniach trzymam…"
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "misternie wykonaną, bogato zdobioną urnę!"
 gdp_merchant_luxury_contract.1502.tomb.success: "zużytą i uszkodzoną urnę?"
 gdp_merchant_luxury_contract.1502.tomb.failure: "#EMP kość#!?"
 gdp_merchant_luxury_contract.1502.monks: "Ci mnisi okazują się ciekawsi, niż mi się wydawało! Życie w habitach dostarcza wielu intrygujących interpretacji i spostrzeżeń, niezależnie od tego, czy to [monk.GetFaith.ReligiousText], czy tajemnice [monk.GetFaith.TricksterGodNamePossessive] są ich przedmiotem.\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "Rozmawia nam się wyśmienicie, a mnisi zdają się szczerze zasmuceni, że muszą się ze mną pożegnać. Przy rozstaniu [monk.GetFirstName] wciska mi coś w dłoń, obdarzając mnie ciepłym uśmiechem."
 gdp_merchant_luxury_contract.1502.monks.failure: "Jednak za każdym razem, gdy przychodzi moja kolej, by zabrać głos, [monk.GetFirstName] zdaje się tracić zainteresowanie, przybierając minę znudzoną i niezadowoloną, i wkrótce daje mi jasno do zrozumienia, że nadużywam ich gościnności."
 gdp_merchant_luxury_contract.1502.keepsake: "Rzuciwszy ostatnie spojrzenie za siebie, staram się z całych sił, by jednym płynnym ruchem odłupać i schować kawałek muru.\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "Z gracją i zręcznością odłupuję niewielki fragment muru, chowam go pod płaszczem i ruszam dalej niedbałym krokiem. Wygląda na to, że nikt nie zauważył!"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "Moje żałosne podrygi kończą się tym, że z łoskotem ląduję na ziemi, sycząc z bólu, podczas gdy kilku ciekawskich pielgrzymów spogląda z niedowierzaniem to na mnie, to na mur."
 gdp_merchant_luxury_contract.1502.apostate: "[pilgrim.GetWomanMan|U] nie protestuje, gdy siadam obok [pilgrim.Custom('PL_niego_niej')]. [merchant.GetFaith.ReligiousText|U] cicho wybrzmiewa, kiedy przywołuję moje ulubione wersety. Wkrótce [pilgrim.GetWomanMan] przestaje płakać, zasłuchawszy się w moje słowa.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "Czuję, że moje słowa poruszają [pilgrim.Custom('PL_go_ja')] do głębi – i rzeczywiście, nie mija wiele czasu, a [pilgrim.GetFirstName] daje jasno do zrozumienia, że pragnie opuścić to miejsce i podążyć ze mną ścieżką [merchant.GetFaith.HighGodNameAlternatePossessive]!"
 gdp_merchant_luxury_contract.1502.apostate.success: "Czytając dalej, wyczuwam zmianę w [pilgrim.GetHerHis] usposobieniu, jakby ciężar spoczywający [pilgrim.Custom('PL_mu_jej')] na barkach nagle zniknął.\n\n[pilgrim.GetWomanMan|U] bez słowa wstaje i odchodzi, pozostawiając przy mnie swą podniszczoną księgę."
 gdp_merchant_luxury_contract.1502.apostate.failure: "Nie mija jednak wiele czasu, gdy [pilgrim.GetHerHis] oblicze przyjmuje surowy wyraz i ogarnia [pilgrim.Custom('PL_go_ja')] nowe uczucie: gniew.\n\nKrzyczy, że chcę [pilgrim.Custom('PL_go_ja')] przekonać do apostazji, a przecież to miejsce kultu, to [pilgrim.GetFaith.HouseOfWorship]! [pilgrim.GetHerHis|U] krzyki szybko przyciągają wzburzonych gapiów…"
 gdp_merchant_luxury_contract.1502.a.critical: "To będzie idealne!"
 gdp_merchant_luxury_contract.1502.a: "To będzie w sam raz."
 gdp_merchant_luxury_contract.1502.b: "To musi wystarczyć…"
 gdp_merchant_luxury_contract.1511.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName] – to tam wracamy ukradkiem, gdy zachodzi słońce. W pobliżu budowli szukamy skarbów wśród zapomnianych grobowców dawno zmarłych miejscowych.\n\nW obawie przed świadkami starannie unikamy zwykłych dróg i w końcu trafiamy na zimny, cichy cmentarz."
 gdp_merchant_luxury_contract.1511.a: "Otwórzmy ten grobowiec i to jak najszybciej!"
 gdp_merchant_luxury_contract.1511.a.flavor: "Próba umiejętności [intrigue_i|E] [Concept('intrigue', 'intrygi')|E] i [prowess_i|E] [Concept('prowess', 'waleczności')|E]"
 gdp_merchant_luxury_contract.1511.a.success_critical: "Znajdujesz cenny artefakt"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "Znajdujesz wysokiej jakości [domicile_artifact|El] w postaci #V unikatu#!"
 gdp_merchant_luxury_contract.1511.a.success: "Znajdujesz skromny artefakt"
 gdp_merchant_luxury_contract.1511.a.success.tt: "Znajdujesz niskiej jakości [domicile_artifact|El] w postaci #V unikatu#!"
 gdp_merchant_luxury_contract.1511.a.failure: "Nie znajdziesz nic godnego uwagi"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "Znajdujesz [domicile_artifact|El] w postaci #V unikatu#!"
 gdp_merchant_luxury_contract.1511.artifact.urn: "Dobra grobowe znalezione w miejscu, gdzie wyznawana jest wiara[religious_building_faith.GetAdjectiveNoTooltip|l]"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "Urna z grobowca osoby dawno zmarłej, którą ewidentnie był [religious_building_faith.GetAdherentName], zrabowana z budowli wyglądającej jak [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1511.artifact.skull: "Złupiona czaszka"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "Czaszka osoby dawno zmarłej, którą ewidentnie był [religious_building_faith.GetAdherentName], zrabowana z grobowca w budowli wyglądającej jak [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1511.artifact.bone: "Złupiona kość – [priest.Custom('RandomSaintBone')|l]"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "Kość osoby dawno zmarłej, którą ewidentnie był [religious_building_faith.GetAdherentName], zrabowana z grobowca w budowli wyglądającej jak [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1521.desc: "Przechodzę przez wielkie wrota w półmrok i znajduję się w zdobionym przedsionku, przesyconym egzotyczną wonią obrzędów i ofiar.\n\nW centrum zgromadzenia stoi [priest.GetWomanMan], [priest.Custom('PriestTitle')|l], i rozmawia z wiernymi, a po chwili od razu mnie dostrzega – najwyraźniej rzucam się tu w oczy.\n\nPodchodzi do mnie szybko i [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )]:\n\n– Witaj! Oto [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l].\n\n– Czego tu szukasz? – pyta, przyglądając mi się z zaciekawieniem. – Czy przestrzegasz nakazów, które głosi [religious_building_faith.GetNameNoTooltip|l]?"
 gdp_merchant_luxury_contract.1521.a: "Chcę dowiedzieć się jak najwięcej o wierze, którą jest [religious_building_faith.GetNameNoTooltip|l]."
 gdp_merchant_luxury_contract.1521.a.flavor: "Próba umiejętności [learning_i|E] [Concept('learning', 'nauki')|E] i [piety_i|E] [Concept('piety_level', 'poziomu religijności')|E]"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')|U] proponuje mi tekst"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')|U] nabiera podejrzeń"
 gdp_merchant_luxury_contract.1531.desc: "Gdy podchodzę bliżej, pielgrzymi z podejrzliwością śledzą każdy mój krok, kurczowo ściskając swą skromną relikwię, a ja tylko próbuję się jej lepiej przyjrzeć.\n\nTo z pewnością przedmiot, któremu [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] nadają pewne znaczenie, a w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] stanowiłby doskonały temat do rozmów.\n\nZ łatwością przekonam tych prostaków, że jakiś domokrążca albo pozbawiony skrupułów [pilgrim.GetFaith.PriestNeuter] zwyczajnie ich oszukał…"
 gdp_merchant_luxury_contract.1531.a: "To ewidentna podróbka, w miejscu znanym jako [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] jest ich mnóstwo…"
 gdp_merchant_luxury_contract.1531.a.success: "Pielgrzymi porzucają relikwię"
 gdp_merchant_luxury_contract.1531.a.failure: "Pielgrzymi są wściekli"
 gdp_merchant_luxury_contract.1541.desc: "Mnisi początkowo spoglądają na mnie podejrzliwie, zaskoczeni moimi cudzoziemskimi manierami, lecz nie potrafią ukryć ciekawości – zwłaszcza gdy daję jasno do zrozumienia, że pragnę rozmawiać o teologii.\n\nMłodsi spośród nich wahają się, lecz ich przywódca, [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )] [monk.GetFirstName], wita mnie w ich gronie i zasypuje pytaniami o moje podróże."
 gdp_merchant_luxury_contract.1541.a: "Tak, tak, ale jakie masz przemyślenia na temat [monk.GetFaith.WealthGodNamePossessive]?"
 gdp_merchant_luxury_contract.1541.a.flavor: "Próba umiejętności [learning_i|E] [Concept('learning', 'nauki')|E] i [piety_i|E] [Concept('piety_level', 'poziomu religijności')|E]"
 gdp_merchant_luxury_contract.1541.a.success: "Mnisi z przyjemnością uczestniczą w dyskusji"
 gdp_merchant_luxury_contract.1541.a.failure: "Mnisi są rozczarowani"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "Różaniec znaleziony w miejscu, gdzie wyznawana jest wiara[religious_building_faith.GetAdjectiveNoTooltip|l]"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "[religious_building_faith.GetAdjective] koronka z paciorkami modlitewnymi, dar od mnicha, którego siedziba to [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1541.artifact.icon: "Ikona [religious_building_faith.GetAdjectiveNoTooltip|l]"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "[SCOPE.Custom('ArtifactArticleWealth')], [SCOPE.Custom('ArtifactQuality')] ikona. Przedstawiona postać to [newly_created_artifact.GetFeatureText('icon_decoration')]. Ikona jest darem od mnicha o imieniu [monk.GetFirstName], którego siedziba to [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1551.desc: "Rozglądając się ukradkiem, niespiesznie spaceruję wokół budowli znanej jako [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l], uprzejmie uśmiechając się do przechodniów i ostentacyjnie podziwiając architekturę.\n\nStopniowo upatruję sobie fragment wyśmienitej kamieniarki, najwyraźniej już poluzowanej, w jednym z najcichszych zakątków na obrzeżach kompleksu."
 gdp_merchant_luxury_contract.1551.a: "Muszę tylko wyczuć odpowiedni moment…"
 gdp_merchant_luxury_contract.1551.a.success: "Zabierasz kawałek muru"
 gdp_merchant_luxury_contract.1551.a.failure: "Dajesz się złapać na gorącym uczynku"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Święte mury"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "Mały fragment kamieniarki z ośrodka religijnego ([religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]), zwędzony na pamiątkę."
 gdp_merchant_luxury_contract.1561.desc: "Gdy podchodzę bliżej, jasne staje się, że [pilgrim.GetWomanMan] jest pielgrzymem, podobnie jak wielu innych tu obecnych. Na plecach dźwiga swój bagaż, a skórę ma spaloną słońcem.\n\nDowiaduję się, że ma na imię [pilgrim.GetFirstName] i po wielu doznanych nieszczęściach [pilgrim.GetHerHis] wiara w istnienie [pilgrim.GetFaith.HighGodNamePossessive] zanika. Nawet ta pielgrzymka nie zdołała jej przywrócić.\n\nDostrzegam [pilgrim.GetHerHis] mokrą od łez, mocno sfatygowaną księgę. To [pilgrim.GetFaith.ReligiousText], prawdziwe świadectwo [pilgrim.GetHerHis] zmagań."
 gdp_merchant_luxury_contract.1561.a: "[merchant.GetFaith.ReligiousText|U]. To tam można znaleźć odpowiedzi…"
 gdp_merchant_luxury_contract.1561.a.flavor: "Próba umiejętności [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [piety_i|E] [Concept('piety_level', 'poziomu religijności')|E]"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip] daje się nawrócić"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip] czuje pokrzepienie"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip] czuje złość"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "Mokra od łez księga – [religious_building_faith.ReligiousText]"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "Osobiste zapiski, które sporządza strapiony [pilgrim.GetFaith.GetAdherentNameNoTooltip|l], [pilgrim.GetFirstName], po utracie wiary."
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: ośrodek wiedzy"
 gdp_merchant_luxury_contract.1601.desc: "[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] to budowla, której ogrom aż mnie uderza – jej dziedzińce i sale rozbrzmiewają gwarem niezliczonych pilnych umysłów, które dyskutują i rozmyślają.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "[scholar.GetWomanMan|U], jak zawsze [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )], krząta się pospiesznie w otoczeniu służby, z wyniosłą obojętnością zbywając swoich współpracowników. Najwyraźniej to właśnie [scholar.GetSheHe] tu rządzi."
 gdp_merchant_luxury_contract.1601.sages: "Pod drzewem na dziedzińcu siedzi w milczeniu pomarszczona, starsza osoba. Może rozważa jakąś głęboką tajemnicę wszechświata, a może po prostu drzemie."
 gdp_merchant_luxury_contract.1601.library: "Mijając drzwi, dostrzegam, że ktoś siedzi samotnie w imponującej bibliotece, otoczony stosami ksiąg. [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )|U] [scholar.GetWomanMan] zdaje się być w stanie błogiej zadumy, w ciszy oddając się lekturze."
 gdp_merchant_luxury_contract.1601.physician: "W innym pomieszczeniu [physician.GetWomanMan] dogląda upiornej kolekcji okazów – zarówno zwierzęcych, jak i ludzkich – oraz rozmaitych narzędzi. Pozostaje mieć nadzieję, że to medyk…"
 gdp_merchant_luxury_contract.1601.student: "Jedna szczególnie hałaśliwa grupa uczniów rzuca się w oczy – sprzeczają się serdecznie, śmieją na całe gardło i droczą ze sobą w zacienionym zakątku głównego dziedzińca."
 gdp_merchant_luxury_contract.1601.botanist: "W zacisznym zakątku kompleksu trafiam na pomieszczenie, w którym znajduje się osobliwa kolekcja roślin i stworzeń. To [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [botanist.GetWomanMan] odpowiada za ich zakonserwowanie i skatalogowanie."
 gdp_merchant_luxury_contract.1601.a: "To pewnie dziekan."
 gdp_merchant_luxury_contract.1601.a.flavor: "Postać ceni umiejętność [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [prestige_i|E] [prestige_level|El]."
 gdp_merchant_luxury_contract.1601.a.tt: "Podchodzisz do dziekana"
 gdp_merchant_luxury_contract.1601.b: "Przyciąga mnie ta starsza osoba…"
 gdp_merchant_luxury_contract.1601.b.flavor: "Postać ceni umiejętność [learning_i|E] [Concept('learning', 'nauki')|E] i [piety_i|E] [piety_level|El]"
 gdp_merchant_luxury_contract.1601.b.tt: "Podchodzisz do mędrca"
 gdp_merchant_luxury_contract.1601.c: "Wiedzę zawsze można znaleźć w bibliotece."
 gdp_merchant_luxury_contract.1601.c.flavor: "Postać ceni umiejętności [learning_i|E] [Concept('learning', 'nauki')|E] i [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "Wchodzisz do biblioteki"
 gdp_merchant_luxury_contract.1601.d: "Praktyki medyków są fascynujące."
 gdp_merchant_luxury_contract.1601.d.flavor: "Postać ceni umiejętność [learning_i|E] [Concept('learning', 'nauki')|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "Podchodzisz do medyka"
 gdp_merchant_luxury_contract.1601.e: "Ci uczniowie wyglądają na wesołą ekipę."
 gdp_merchant_luxury_contract.1601.e.flavor: "Postać ceni umiejętności [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [prowess_i|E] [Concept('prowess', 'waleczności')|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "Podchodzisz do uczniów"
 gdp_merchant_luxury_contract.1601.f: "Kolekcja okazów zapiera dech w piersiach."
 gdp_merchant_luxury_contract.1601.f.flavor: "Postać ceni umiejętności [learning_i|E] [Concept('learning', 'nauki')|E] i [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "Oglądasz kolekcję"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "Pierwotnie część zbiorów z budowli znanej jako [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName] podąża za tokiem mojego rozumowania, aż wszystko wyłożę zrozumiale. W końcu pochodzę z odległej krainy, gdzie taki skrawek papieru nic nie znaczy.\n\nPrzedstawiwszy wszystkie niezbędne argumenty, z niecierpliwością ustępuję [scholar.Custom('PL_mu_jej')] miejsca, by usłyszeć, co ma do powiedzenia."
 gdp_merchant_luxury_contract.1602.dean.success: "Na [scholar.GetHerHis] twarzy pojawia się szeroki uśmiech, gdy sięga po oficjalne dokumenty, potwierdzające moje… przymioty."
 gdp_merchant_luxury_contract.1602.dean.failure: "[scholar.GetHerHis|U] pozbawiona emocji twarz tężeje. [scholar.GetFirstName] z zakłopotaniem prosi mnie o odejście."
 gdp_merchant_luxury_contract.1602.sages: "Nieświadomi powoli ciemniejącego nieba i cichnącego gwaru kończącego się dnia rozmawiamy o filozofii tak długo, że zdaje się minęła cała wieczność; roztrząsamy kwestie, o których rzadko mówię na głos.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "Wreszcie [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan] wstaje, wyciąga coś spod swojej szaty, podaje mi to z wymownym skinieniem głowy, po czym znika bez pożegnania."
 gdp_merchant_luxury_contract.1602.sages.failure: "Wreszcie [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan] wstaje, szczelniej otula się szatą i znika bez pożegnania. Mnie zaś pozostaje przynajmniej miłe wspomnienie naszej rozmowy…"
 gdp_merchant_luxury_contract.1602.library: "Daję znak, że interesują mnie materiały, które czyta, a [scholar.GetSheHe] przedstawia się jako [scholar.GetFirstName]. Przez dłuższą chwilę wymienia liczne dzieła, które już zna, i te, które dopiero zamierza zgłębić w ramach swoich dociekań, prosząc mnie o opinię na temat każdego z nich.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip] wkrótce uśmiecha się jak dziecko, a gdy nadchodzi pora rozstania, wręcza mi niewielki tomik, puszczając przy tym do mnie oczko."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip] szybko traci zainteresowanie mną i moimi odpowiedziami, niegrzecznie odwracając się z powrotem do swoich notatek. Ja po prostu wychodzę."
 gdp_merchant_luxury_contract.1602.physician: "Wyrażam zainteresowanie anatomią i staram się wnieść do rozmowy jak najwięcej. [physician.GetFirstNameNoTooltip] długo opowiada o funkcjonowaniu ludzkiego ciała, posługując się modelami kości, by zilustrować swoje wywody.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.GetFirstNameNoTooltip] wydaje się pod wrażeniem mojej wiedzy; utyskuje na ignorancję swoich uczniów i współpracowników, po czym wręcza mi artykuł."
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetFirstNameNoTooltip] z niecierpliwością przewraca oczami, słysząc moje pytania i niepewne wyjaśnienia, po czym szybko znajduje jakąś banalną wymówkę, by wyrzucić mnie z pomieszczenia."
 gdp_merchant_luxury_contract.1602.student: "Świetnie bawimy się w miejscu o nazwie „[student.Custom('GetPubName')]”, gdzie pośród młodych jeszcze niezepsutych hulaków snuję opowieści z podróży i odpowiadam na ich liczne pytania.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "Wędrujemy od karczmy do karczmy, aż w końcu zastaje nas poranek. Żegnamy się po odśpiewaniu ostatniej serenady przy drodze, a jeden z nich wciska mi coś w dłoń. Cóż to była za noc!"
 gdp_merchant_luxury_contract.1602.student.failure: "Na początku wszystko zdaje się iść dobrze, lecz wkrótce nudzą się moim towarzystwem i zostaję sam na sam ze swoim kuflem po niewłaściwej stronie miasta. Chodziło o moje opowieści?"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName] z zapałem oprowadza mnie po ekspozycji, wskazując najciekawsze okazy pełne osobliwości i piękna.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "Wyraźnie ożywia się moim zainteresowaniem, z zapałem kiwając głową, gdy wskazuje na rzadkość i pochodzenie poszczególnych okazów.\n\nKiedy wreszcie muszę odejść, wręcza mi drobny upominek. To coś, co już wcześniej przyciągnęło moje spojrzenie i nie uszło to [botanist.Custom('PL_jego_jej')] uwagi."
 gdp_merchant_luxury_contract.1602.botanist.failure: "Wygląda na to, że nie potrafię należycie docenić ani [botanist.GetHerHis] zbiorów, ani wyjaśnień, więc [botanist.GetFirstNameNoTooltip] dość szybko daje mi do zrozumienia, że moja obecność jest zbędna…"
 gdp_merchant_luxury_contract.1602.a: "Będę tego pilnować!"
 gdp_merchant_luxury_contract.1602.b: "Zawsze to jakiś upominek."
 gdp_merchant_luxury_contract.1611.desc: "Początkowo lekceważący dziekan wyraźnie zmienia nastawienie, gdy daję do zrozumienia, że jestem zamożnym kupcem z odległego miejsca znanego jako [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], a następnie teatralnie przedstawiam towarzyszącą mi osobę, mówiąc, że to [scholar.Custom('MistressMaster')] [scholar.GetFirstName].\n\n[scholar.GetFirstNameNoTooltip] prowadzi mnie do swojej komnaty, po drodze wskazując architektoniczne osobliwości i ciekawostki.\n\n– A zatem, [merchant.GetTitledFirstNameNoTooltip], w czym mogę ci pomóc? – uśmiecha się szeroko."
 gdp_merchant_luxury_contract.1611.a: "Ach, mieć kiedyś możliwość uczyć się w tym miejscu…"
 gdp_merchant_luxury_contract.1611.a.flavor: "Próba umiejętności [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] i [prestige_i|E] [Concept('prestige_level', 'poziomu sławy')|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "Otrzymujesz dyplom honorowy"
 gdp_merchant_luxury_contract.1611.a.success: "Dostajesz ofertę otrzymania dyplomu honorowego za opłatą"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip] czuje urazę"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Dyplom honorowy"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "Honorowy certyfikat uczoności wręczony przez dziekana, którego placówka edukacyjna to [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName|l] w miejscu znanym jako [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1621.desc: "Ostrożnie podchodzę do mędrca, uważając, by nie zakłócić nadmiernie [sage.GetHerHis] głębokiej koncentracji, ale to [sage.GetSheHe] mnie zaskakuje!\n\n– Chcesz do mnie dołączyć? – pyta spokojnie, nie odwracając się ani nawet nie otwierając oczu. – Podejdź i usiądź.\n\nPokornie przyjmuję [sage.GetHerHis] zaproszenie, starając się usadowić obok możliwie elegancko.\n\n– Jestem [sage.GetFirstName] – chrypi. – Co cię tu sprowadza?"
 gdp_merchant_luxury_contract.1621.a: "Nie… Nie wiem."
 gdp_merchant_luxury_contract.1621.a.flavor: "Próba umiejętności [learning_i|E] [Concept('learning', 'nauki')|E] i [piety_i|E] [Concept('piety_level', 'poziomu religijności')|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetFirstNameNoTooltip] czuje wsparcie"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetFirstNameNoTooltip] czuje rozczarowanie"
 gdp_merchant_luxury_contract.1631.desc: "Wchodzę do komnaty pełnej niekończących się rzędów półek uginających się pod zwojami, gdzie powietrze przesycone jest duszną wonią starego atramentu i papieru.\n\nCicho podchodzę do milczącej postaci, by w końcu napotkać jej spojrzenie. Początkowo chce mnie zbyć z uwagi na swoją pracę, lecz moja obcość zdaje się budzić [scholar.GetHerHis] ciekawość i wzrok [scholar.Custom('PL_mu_jej')] łagodnieje."
 gdp_merchant_luxury_contract.1631.a: "Co tam czytasz, przyjacielu?"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.GetFirstNameNoTooltip] jest pod wrażeniem twojej wiedzy"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetFirstNameNoTooltip] uważa cię za prostaka"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "Czeka mnie iście makabryczny widok. Niezliczone kości – ludzkie i nie tylko – ułożone są w równiutkich rzędach, a [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)] [physician.GetWomanMan] grzebie w nich, by pokazać je garstce uczniów.\n\nW końcu mnie zauważa. Rzuca mi pytające spojrzenie i zaprasza do grupy. Domyślam się, że to [physician.GetFirstName], i z ulgą stwierdzam, że rzeczywiście zajmuje się medycyną."
 gdp_merchant_luxury_contract.1641.a: "Ach, czy to czasem nie [merchant.Custom('RandomSaintBone')|l]?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip] jest pod wrażeniem"
 gdp_merchant_luxury_contract.1641.a.failure: "[physician.GetFirstNameNoTooltip] się przez ciebie denerwuje"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "[physician.Custom('RandomSaintBone')] człowieka"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "Kość wykorzystywana jako pomoc dydaktyczna w medycynie. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "Czaszka ludzka"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "Czaszka wykorzystywana jako pomoc dydaktyczna w medycynie. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "Zbliżam się do grupy i przedstawiam się. Uczniowie tworzą wokół mnie krąg, chichocząc między sobą, ale są wyraźnie zaintrygowani pojawieniem się przybysza z zewnątrz.\n\nGdy tylko słyszą, że jestem obieżyświatem i kupcem z odległego miejsca znanego jako [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], ich ciekawość natychmiast wzrasta i zapraszają mnie do owianego złą sławą pobliskiego przybytku na… drobny poczęstunek."
 gdp_merchant_luxury_contract.1651.a: "Do karczmy!"
 gdp_merchant_luxury_contract.1651.a.success: "Zabawiasz uczniów"
 gdp_merchant_luxury_contract.1651.a.failure: "Zanudzasz uczniów"
 gdp_merchant_luxury_contract.1661.desc: "Wkroczywszy do osobliwej sali, oniemieję. Pierwszy raz w życiu widzę taką kolekcję – niewypowiedziana feeria barw, płatki i liście, futra i pióra, prawdziwa uczta dla zmysłów i kompendium natury…\n\nZ odrętwienia wyrywa mnie dopiero zarządca tego miejsca. Przedstawia się jako [botanist.GetFirstName] i proponuje, że mnie oprowadzi."
 gdp_merchant_luxury_contract.1661.a: "Serdecznie dziękuję!"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip] docenia twoje zainteresowanie"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip] okazuje rozczarowanie"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] zwierzęcia, którym jest [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "Pióro zwierzęcia, którym jest [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
