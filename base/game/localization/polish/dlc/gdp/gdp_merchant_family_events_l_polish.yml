l_polish:
 gdp_merchant_family.0001.t: "[house_member.Custom('GetBrideGroom')|U] ucieka"
 gdp_merchant_family.0001.desc: "Potykam się w ciemności i dostrzegam, jak [house_member.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', house_member)], plądruje skarbiec kompanii. U [house_member.GetHerHis] boku stoi [wedding_interest.GetWomanMan], szepcząc ponaglająco, że musi się spieszyć.\n\n– Co to ma znaczyć? – pytam. Oboje odwracają się, trzymając się kurczowo za ręce. Dopiero teraz rozpoznaję nieznajomą twarz. To [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)] osoby znanej jako [wedding_interest_house_head.GetTitledFirstName].\n\n– Nie zostaniemy tu ani chwili dłużej. Nienawiść między naszymi rodzinami będzie nas tylko od siebie odpychać, więc postanowiliśmy odejść – mówi [house_member.GetTitledFirstNameNoTooltip],"
 gdp_merchant_family.0001.desc.stubborn_outro: "wyzywająco unosząc brodę, a [wedding_interest.GetTitledFirstNameNoTooltip] wciska swoją dłoń w [house_member.GetHerHis]."
 gdp_merchant_family.0001.desc.fallback_outro: "puszczając dłoń ukochanej osoby, choć widać, że sprawia [house_member.Custom('PL_mu_jej')] to ból, i wyciągając do mnie rękę w niemej prośbie."
 gdp_merchant_family.0001.a: "– Zabierzcie złoto i odejdźcie w pokoju."
 gdp_merchant_family.0001.b: "– Co mogę zrobić, by przekonać was do pozostania tu?"
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName] dołącza do ciebie"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName] nie jest pod wrażeniem"
 gdp_merchant_family.0001.c: "– #EMP Nigdzie#! nie pójdziecie!"
 gdp_merchant_family.0002.t: "Krew nie woda"
 gdp_merchant_family.0002.desc_intro: "Przeglądam najnowsze raporty zysków, gdy do środka niczym burza wpada [blood.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\n– Co za [water.Custom('InsultNoun')]! Tego już za wiele – wyrzuca z siebie. – Igra z losem, ignoruje zasady i wystawia nas wszystkich na pośmiewisko. "
 gdp_merchant_family.0002.desc_adopted: "Takie zachowanie nie przystoi członkowi rodu [ROOT.Char.GetHouse.GetName]."
 gdp_merchant_family.0002.desc_associate: "Takie zachowanie nie przystoi zwykłemu partnerowi naszej kompanii."
 gdp_merchant_family.0002.desc_outro: "\n\nGdy wreszcie zapada cisza, znów pochylam się nad księgą. Bez względu na to, co się za tym wszystkim kryje, [water.GetFirstNameNoTooltip] przynosi zyski, a z wynikami nie sposób polemizować."
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip] musi znać swoje miejsce."
 gdp_merchant_family.0002.a.unity_gain.desc: "przedkłada więzy rodzinne ponad osiągnięcia zawodowe"
 gdp_merchant_family.0002.b: "Wróć, gdy będziesz mieć takie same wyniki, jak ma [water.GetFirstNameNoTooltip]."
 gdp_merchant_family.0002.b.unity_loss.desc: "przedkłada osiągnięcia zawodowe ponad więzy rodzinne"
 gdp_merchant_family.0002.c: "– Nie mam na to czasu…"
 gdp_merchant_family.0003.t: "Nie daj się zhańbić"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], podchodzi do mnie, a na [offended.Custom('PL_jego_jej')] twarzy widać wyraźne poirytowanie.\n\n– Nie uwierzysz, co mi właśnie powiedziano – mówi. – Nie kto inny, jak [offender.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], uważa za zabawne obrażać mnie, a tym samym znieważać cały nasz ród.\n\nZniewaga była drobna, lecz celowa."
 gdp_merchant_family.0003.a: "W imię [ROOT.Char.GetFaith.HighGodNamePossessive], ród [offender.GetHouse.GetNameNoTooltip] przeprosi!"
 gdp_merchant_family.0003.a.unity_gain.desc: "tworzy wspólny front w obliczu publicznej zniewagi"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUINameNotMe] publicznie znieważa ród, do którego należy [target_char.GetShortUINameNotMe]"
 gdp_merchant_family.0003.b: "Niech [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))] skupi się na tym, czego nie mówią…"
 gdp_merchant_family.0003.b.unity_loss.desc: "nie odpowiada na zniewagę tym samym"
 gdp_merchant_family.0003.c: "Zajmij się tym. Mam inne sprawy na głowie."
 gdp_merchant_family.0003.c.unity_loss.desc: "ignoruje zniewagę kierowaną pod adresem naszego rodu"
 gdp_merchant_family.0004.t: "Atrakcyjna oferta"
 gdp_merchant_family.0004.desc: "Gdy spaceruję spokojnie po dziedzińcu, z przeciwnej strony dobiega mnie nieznany głos.\n\n– Czy [ROOT.Char.Custom('FormOfAddressForLiege')] zechce zamienić ze mną słowo? – [offer_2.GetFullName] stoi już przede mną, przemawiając uprzejmym tonem.\n\n– Przybywam z propozycją, którą składa [foreign_liege.Custom2('MyCharacterIntroductionNoComma', offer_2)]. Niech poślubi mnie [offer.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. To wzmocni więzi między naszymi rodami.\n\nMimowolnie wstrzymuję oddech, rozważając ofertę.\n\n– No i co [ROOT.Char.Custom('FormOfAddressForLiege')] na to?"
 gdp_merchant_family.0004.a: "– [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))] mojej osoby uzna to za zaszczyt."
 gdp_merchant_family.0004.b: "– Co powiesz na umowę korzystną dla obu stron?"
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUINameNotMe] i [target_char.GetShortUINameNotMe] podpisują umowę korzystną dla obu stron"
 gdp_merchant_family.0004.c: "– Z całym szacunkiem muszę odmówić, ale oczywiście możesz tu zostać."
 gdp_merchant_family.0005.t: "Hańba dla rodu [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.0005.desc: "Dotarła do mnie wieść, że cenna przesyłka, za którą odpowiada [wayward.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], zaginęła. Jeśli nie zareaguję, może to poważnie nadszarpnąć naszą reputację. Wzywam zatem [wayward.Custom('PL_go_ja')] do siebie, by wysłuchać wyjaśnień.\n\n– Naprawdę mi przykro, [wayward.Custom2('RelationToMeVocative', ROOT.Char)], ale nie możesz obwiniać mnie za tę wpadkę. To mój własny ród, krew z mojej krwi, próbuje mnie zdyskredytować!"
 gdp_merchant_family.0005.a: "– Niech cię szlag!"
 gdp_merchant_family.0005.a.unity_loss.desc: "publicznie potępia członka rodu"
 gdp_merchant_family.0005.b: "– Zawsze stanowimy jedność."
 gdp_merchant_family.0005.b.unity_gain.desc: "postanawia wspólnie stawić czoła przeciwnościom losu"
 gdp_merchant_family.0005.c: "Zajmij się tym."
 gdp_merchant_family.0010.t: "Chwiejna równowaga"
 gdp_merchant_family.0010.desc: "Skrzynie z #EMP hukiem#! uderzają o ziemię, a zwyczajowy gwar, którego źródłem jest [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')], nagle zamiera. Odwracam się i widzę moich dwóch partnerów. [attacker.GetTitledFirstName] i [defender.GetTitledFirstName] stoją naprzeciwko siebie w gotowości, by skoczyć sobie do gardeł.\n\n– Zaharowuję się dla tej rodziny! – wybucha [attacker.GetTitledFirstNameNoTooltip] i [attacker.Custom('quirk_neg_present')], a w [attacker.Custom('PL_jego_jej')] oczach aż iskrzy gniew. – A ta łajza plącze się bez celu po miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Jeśli mnie nie powstrzymasz, słowo daję, że ręcznie wleję [defender.Custom('PL_mu_jej')] do głowy nieco oleju."
 gdp_merchant_family.0010.a: "Moi partnerzy nie mogą się tak zachowywać."
 gdp_merchant_family.0010.a.tt.success: "Udaje ci się rozwiązać ten konflikt"
 gdp_merchant_family.0010.a.tt.failure: "Nie udaje ci się rozwiązać tego konfliktu"
 gdp_merchant_family.0010.b: "Śmiało, pokaż wszystkim, jak wyrównujemy rachunki."
 gdp_merchant_family.0010.c: "Podnosisz rękę na osobę znaną jako [defender.GetTitledFirstNameNoTooltip]. Pożałujesz tego!"
 gdp_merchant_family.0010.d: "Rób, jak chcesz."
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUINameNotMe] i [defender.GetShortUINameNotMe] rozpoczną pojedynek przeciwko sobie i będą wykorzystywać [prowess_i] [prowess|El] oraz umiejętność [martial_i] [Concept('martial', 'walki')|E]! Ktoś zostanie ranny#!"
 merchant_unity_fight_stopped: "kładzie kres wewnętrznym sporom między pracownikami firmy"
 merchant_unity_fight_promoted: "podżega do wewnętrznych sporów między pracownikami firmy"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] wygrywa"
 gdp_merchant_family.0010.tt.attacker_won.tt: "Osoba ta zraniła postać, którą jest [defender.GetFirstName]"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip] wygrywa"
 gdp_merchant_family.0010.tt.defender_won.tt: "Osoba ta zraniła w samoobronie postać, którą jest [attacker.GetFirstName]"
 gdp_merchant_family.0015.t: "Zaufany doradca"
 gdp_merchant_family.0015.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|U] w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] to same znajome twarze. Spośród nich to właśnie [tip_giver.GetShortUINameNotMe] przykuwa mój wzrok i odciąga mnie na bok. Z chytrym uśmiechem wręcza mi księgę rachunkową.\n\n– Och, [ROOT.Char.GetTitledFirstName], właśnie ciebie szukam! Pozwól, że podzielę się kilkoma świeżymi spostrzeżeniami. Potraktuj to jako mój wkład w naszą dalszą współpracę."
 gdp_merchant_family.0015.a: "– Wspólnie możemy nieźle zarobić!"
 gdp_merchant_family.0015.b: "– Sprzedaj mi to."
 gdp_merchant_family.0015.b.artifact: "Rejestr poufnych transakcji"
 gdp_merchant_family.0015.b.artifact.desc: "Pilnie strzeżona księga zysków, marż i przydatnych kontaktów"
 gdp_merchant_family.0015.c: "– Miejsce znane jako #EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#! na tym skorzysta…"
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUINameNotMe] i [target_char.GetShortUINameNotMe] wymieniają się cennymi informacjami"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUINameNotMe] wykorzystuje informację uzyskaną od osoby znanej jako [target_char.GetShortUINameNotMe] przeciwko [target_char.Custom('PL_niemu_niej')]"
 gdp_merchant_family.0020.t: "Giełda talentów"
 gdp_merchant_family.0020.desc: "[house_friend.GetFirstName], osoba, z którą prowadzę interesy, spóźnia się na nasze zwyczajowe spotkanie. Gdy wreszcie się pojawia, towarzyszy [house_friend.Custom('PL_mu_jej')] ktoś, kogo się nie spodziewam.\n\n– To [nepo_hire.GetFirstName], a dla mnie [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))], "
 gdp_merchant_family.0020.desc.diplomacy: "osoba o rozległych umiejętnościach dyplomatycznych. "
 gdp_merchant_family.0020.desc.martial: "osoba wykazująca się nieustępliwością w planowaniu działań. "
 gdp_merchant_family.0020.desc.stewardship: "osoba niezwykle biegła w rachunkach. "
 gdp_merchant_family.0020.desc.intrigue: "[nepo_hire.GetWomanMan] o przenikliwym umyśle. "
 gdp_merchant_family.0020.desc.learning: "[nepo_hire.GetWomanMan] o wszechstronnej wiedzy. "
 gdp_merchant_family.0020.desc.outro: "Pod twoją pieczą w miejscu znanym jako [ROOT.Char.GetPrimaryTitle.GetName] [nepo_hire.GetFirstNameNoTooltip] z pewnością rozkwitnie."
 gdp_merchant_family.0020.a: "– [nepo_hire.GetFirstNameNoTooltip] może do nas dołączyć."
 gdp_merchant_family.0020.a.unity_loss.desc: "obsadza stanowisko partnera po znajomości"
 gdp_merchant_family.0020.b: "– Obawiam się, że nie mamy wolnych stanowisk."
 gdp_merchant_family.0020.b.unity_gain.desc: "odmawia zatrudnienia osoby postronnej"
 gdp_merchant_family.0020.c: "– Twoja propozycja to dla mnie czysta zniewaga."
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUINameNotMe] przyjmuje krewnego osoby, którą jest [target_char.GetShortUINameNotMe], do swojej kompanii"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUINameNotMe] odrzuca krewnego osoby, którą jest [target_char.GetShortUINameNotMe]"
 gdp_merchant_family.0025.t: "Nic osobistego"
 gdp_merchant_family.0025.desc: "Bolą mnie nadgarstki, gdy podpisuję ostatnią z wydawałoby się niekończącej się sterty umów handlowych. Właśnie gdy mam zamiar zakończyć pracę na dziś, podchodzi do mnie [leaving_associate.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Nerwowo grzebie w kieszeni, wyciąga niewielki skrawek pergaminu i zaczyna czytać jego treść.\n\n– „Wasza Czcigodność. Z przykrością informuję, że kompania o nazwie [rival_poacher.GetPrimaryTitle.GetName] przedstawiła mi ofertę, której po prostu nie mogę odrzucić. Nie o Ciebie chodzi. To po prostu świetna okazja”."
 gdp_merchant_family.0025.a: "– Masz moje błogosławieństwo."
 gdp_merchant_family.0025.b: "– Twoje miejsce jest tutaj z nami."
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUINameNotMe] zostaje w [Concept('company', 'kompanii')|E]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip] zgadza się zostać"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip] mimo wszystko odchodzi"
 gdp_merchant_family.0025.c: "– Pamiętaj, masz u mnie dług."
 gdp_merchant_family.0025.d: "– W porządku, odejdź."
 gdp_merchant_family.0025.d.rival: "– [rival_poacher.GetTitledFirstNameNoTooltip], będziesz przeklinać dzień, w którym zdarzyło ci się wejść mi w drogę!"
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUINameNotMe] podbiera [Concept('associate', 'partnera')|E] osobie, którą jest [CHARACTER.GetShortUINameNotMe]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUINameNotMe] w dobrej wierze przekazuje [Concept('associate', 'partnera')|E] do kompanii osoby, którą jest [target_char.GetShortUINameNotMe]"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUINameNotMe] podbiera [Concept('associate', 'partnera')|E] rodowi [char.GetHouse.GetName]"
 gdp_merchant_family.0030.t: "Interesy czy przyjemności?"
 gdp_merchant_family.0030.desc: "Dwóch moich partnerów, [house_member.GetTitledFirstName] i [associate.GetTitledFirstName], wraca do gabinetu, który zajmuje [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l], po #EMP dość#! długiej przerwie obiadowej, niosąc ze sobą dzban, w którym chlupie [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\n– …a ja mu na to, że ten kocur powinien mieszkać w chlewie! – rzuca [house_member.GetTitledFirstNameNoTooltip], a [associate.GetTitledFirstNameNoTooltip] wybucha gromkim śmiechem.\n\nJeśli nie zareaguję, ta dwójka nie zrobi dziś już niczego pożytecznego."
 gdp_merchant_family.0030.a: "– Pozwólcie, że sięgnę po coś lepszego."
 gdp_merchant_family.0030.a.flavor: "Jako [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] dostaniesz wszystko, co najlepsze"
 gdp_merchant_family.0030.b: "– Wracać do pracy, niewdzięcznicy!"
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] nie będzie tolerować lenistwa"
 gdp_merchant_family.0030.c: "Sprawdźmy, dokąd zaprowadzi nas ta przyjaźń."
 merchant_unity_breaks_encouraged: "pija jedynie najlepsze trunki dostępne na rynku"
 merchant_unity_breaks_discouraged: "nie pochwala przerw w pracy"
 gdp_merchant_family.9000.t: "[ROOT.Char.GetTitleAsNameNoTooltip] z nowego pokolenia rodu [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "Nareszcie dorastam i mogę zająć należne mi miejsce jako [ROOT.Char.GetTitleAsNameNoTooltip]. Niech [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] przyjmie mnie. Mój poprzednik, [ROOT.Char.Custom2('RelationToMeShort', predecessor)] [predecessor.GetFirstName], potrzebuje godnego następcy.\n\nMoi partnerzy oczekują teraz, że pokieruję naszym przedsięwzięciem, znajdę nowe kierunki i okazje w świecie handlu, nawet jeśli słyszę, że lepiej polegać na ich doświadczeniu i mądrości…"
 gdp_merchant_family.9000.a: "[educator.GetTitledFirstNameNoTooltip] udzieli mi bezcennych wskazówek."
 gdp_merchant_family.9000.b: "Od czego tu zacząć…?"
 gdp_merchant_family.9000.route_hint_tt: "Możesz teraz tworzyć i edytować [distribution_routes|El]"
 gdp_merchant_family.9010.t: "Kompania w żałobie"
 gdp_merchant_family.9010.desc: "Odchodzi od nas [ROOT.Char.Custom2('RelationToMeShort', previous_holder)] [previous_holder.GetFirstName] – osoba powszechnie szanowana, stojąca na czele kompanii. W naszych salach nie słychać już śmiechu, w gabinetach nie toczą się żarliwe spory, a wszyscy wyglądają na bardzo zmartwionych.\n\n"
 gdp_merchant_family.9010.interim_generated: "Wszyscy liczą, że [interim.GetWomanMan] o imieniu [interim.GetFirstName] pomoże w prowadzeniu spraw i"
 gdp_merchant_family.9010.interim_relation: "Wszyscy liczą na jedną osobę – to [interim.GetFirstName], dla mnie [ROOT.Char.Custom2('RelationToMeShort', interim)] – która"
 gdp_merchant_family.9010.interim: "Wszyscy liczą na zaufanego partnera poprzedniego właściciela, na osobę o imieniu [interim.GetFirstName], która"
 gdp_merchant_family.9010.close: "przejmie obowiązki, jakie pozostawia po sobie [previous_holder.GetFirstNameNoTooltip], oraz będzie prowadzić bieżące interesy, dopóki nie dorosnę na tyle, by samodzielnie wszystkim zarządzać."
 gdp_merchant_family.9010.a: "Wszystko zmienia się tak szybko."
 gdp_merchant_family.9110.t: "Kupieckie sztuczki"
 gdp_merchant_family.9110.desc: "[ROOT.Char.Custom2('RelationToMeShort', trader)] [trader.GetFirstName] należy do najbardziej doświadczonych kupców kompanii i rzadko bywa w biurze.\n\nOdpowiada za to, co dzieje się tam, gdzie przebiega [route.GetName|l], i dba o to, by wszystkie [good.Custom('GetTradeGoodUnitPlural')] bezpiecznie trafiły od sprzedającego do kupującego, a naszą sakiewkę zasilały po drodze coraz liczniejsze [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')].\n\n– Dobry kupiec jest wszędzie naraz. – Uśmiecha się. – [ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')|U] nie ma przed nim tajemnic, zna wszystkie twarze przy każdym straganie, ich kłopoty – i kłopoty każdego miasta i każdego strażnika karawan!"
 gdp_merchant_family.9110.a: "Gdy przejmę stery, będę jak [trader.GetNameNoTooltip]."
 gdp_merchant_family.9110.b: "– Opowiedz mi o karawanach!"
 gdp_merchant_family.9110.b.tt: "Po osiągnięciu dorosłości zyskasz #V 10#! pkt [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] #weak [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l]#! w kierunku „#emp $trait_track_caravaneer$#!”"
 gdp_merchant_family.9110.c: "– Ja też chcę handlować. Mój wymarzony towar to [good.Custom('GetTradeGood')]!"
 gdp_merchant_family.9110.c.tt: "Gdy osiągniesz dorosłość, [merchant.GetPrimaryTitle.GetDefinitiveName] zyska #V 450#! pkt [Concept('trade_expertise', 'doświadczenia handlowego')|E] w kategorii [category.GetNameWithIcon|l]"
 gdp_merchant_family.9130.t: "Ambicje młodości"
 gdp_merchant_family.9130.desc: "Wiele się uczę, obserwując codzienne sprawy kompanii, a moi partnerzy dokładają wszelkich starań, by mnie w nie włączać i poszerzać moją wiedzę."
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] handluje daleko i szeroko, a w księgach roi się od nazw miejsc, które ledwie potrafię wymówić, położonych daleko od ziem znanych jako [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]. Gdzie dokładnie – mogę tylko zgadywać."
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] słynie z dostarczania rzadkich i wysokiej jakości wyrobów oraz z patronatu nad rzemieślnikami z terytorium [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] słynie z tego, że wymienia [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] na przysługi, a w księgach roi się od nazwisk nieszczęśników i hazardzistów z terytorium [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ma ugruntowaną pozycję, ale nie słynie z niczego szczególnego. Należy po prostu do licznych domów handlowych [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip] i ma udziały w wielu przedsięwzięciach."
 gdp_merchant_family.9130.a: "Nie mogę się doczekać, aż stanę u steru."
 gdp_merchant_family.9130.a.caravaneer: "A my zajdziemy jeszcze dalej."
 gdp_merchant_family.9130.a.artisan: "Nasze nazwisko to znak jakości."
 gdp_merchant_family.9130.a.creditor: "Kredyt to nasz fach."
 gdp_merchant_family.9130.a.tt: "Po osiągnięciu dorosłości zyskasz #V 5#! pkt [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] #weak [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l]#! w każdym z następujących kierunków: #emp „$trait_track_caravaneer$”#!, #emp „$trait_track_artisan$”#! i #emp „$trait_track_creditor$”#!"
 gdp_merchant_family.9130.b: "Szeroki świat pełen jest możliwości."
 gdp_merchant_family.9130.b.tt: "Po osiągnięciu dorosłości #P bez żadnych kosztów#! przyjmiesz [company_purpose|El] „[GetLaw('company_purpose_caravaneer').GetName]” i zyskasz #V 20#! pkt [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] #weak [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l]#! w kierunku #emp „$trait_track_caravaneer$”#!"
 gdp_merchant_family.9130.c: "Wiele wydaje się na ładne błyskotki."
 gdp_merchant_family.9130.c.tt: "Po osiągnięciu dorosłości #P bez żadnych kosztów#! przyjmiesz [company_purpose|El] „[GetLaw('company_purpose_artisan').GetName]” i zyskasz #V 20#! pkt [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] #weak [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l]#! w kierunku #emp „$trait_track_artisan$”#!"
 gdp_merchant_family.9130.d: "Prawdziwa władza i bogactwo tkwią w przewadze."
 gdp_merchant_family.9130.d.tt: "Po osiągnięciu dorosłości #P bez żadnych kosztów#! przyjmiesz [company_purpose|El] „[GetLaw('company_purpose_creditor').GetName]” i zyskasz #V 20#! pkt [Concept('trait_level_track_xp', 'doświadczenia cechy')|E] #weak [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l]#! w kierunku #emp „$trait_track_creditor$”#!"
 company_purpose_child_blocker_tt: "Jesteś [Concept('child', 'dzieckiem')|E]"
 gdp_merchant_family.9140.t: "Rynkowy narybek"
 gdp_merchant_family.9140.desc: "W dusznych biurach w miejscu znanym jako [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly] uczę się o szlakach handlowych, na których [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] zbija nasz majątek – albo przynajmniej próbuje. Tyle miejsc i towarów do zapamiętania.\n\nZ marzeń wyrywa mnie [associate.GetFirstName], a raczej [associate.Custom('PL_jego_jej')] [ROOT.Char.Custom('WritingInstrument')], którym stuka w stół.\n\n– Do roboty! Co z ciebie będzie za [ROOT.Char.GetTitleAsNameNoTooltip], skoro nie znasz naszych interesów?"
 gdp_merchant_family.9140.a: "– [category_1.Custom('GetTradeGoodCategory')|U] to ciekawy temat. Opowiedz mi, jak się kupuje i sprzedaje ten towar."
 gdp_merchant_family.9140.a.tt: "Gdy osiągniesz dorosłość, [merchant.GetPrimaryTitle.GetDefinitiveName] zyska #V 450#! pkt [Concept('trade_expertise', 'doświadczenia handlowego')|E] w kategorii [category_1.GetNameWithIcon|l]"
 gdp_merchant_family.9140.b: "– Moja fascynacja, jeśli chodzi o handel, to [category_2.Custom('GetTradeGoodCategory')]."
 gdp_merchant_family.9140.b.tt: "Gdy osiągniesz dorosłość, [merchant.GetPrimaryTitle.GetDefinitiveName] zyska #V 450#! pkt [Concept('trade_expertise', 'doświadczenia handlowego')|E] w kategorii [category_2.GetNameWithIcon|l]"
 gdp_merchant_family.9140.c: "– Chcę się nauczyć, jak przemieszczają się towary takie jak [category_3.Custom('GetTradeGoodCategory')]."
 gdp_merchant_family.9140.c.tt: "Gdy osiągniesz dorosłość, [merchant.GetPrimaryTitle.GetDefinitiveName] zyska #V 450#! pkt [Concept('trade_expertise', 'doświadczenia handlowego')|E] w kategorii [category_3.GetNameWithIcon|l]"
 gdp_merchant_family.9150.t: "Prawa ręka"
 gdp_merchant_family.9150.desc: "Dopóki nie osiągnę dorosłego wieku, przez większość dnia pieczę nade mną sprawuje [partner.GetFirstName], partner kompanii. Towarzyszę [partner.Custom('PL_mu_jej')] w interesach i na spotkaniach, chłonąc każdą wiedzę.\n\nPewnego dnia, po wyczerpującej sesji nad księgami, [partner.GetFirstName] zwraca się do mnie:\n\n– Dobrze sobie radzisz jako [ROOT.Char.GetTitleAsNameNoTooltip] w tak młodym wieku. – Uśmiecha się szeroko, rzucając w moją stronę monetę. – Interesy nie są łatwe, ale nas na powierzchni utrzymuje tylko nasza własna harówka, czego nie może o sobie powiedzieć ta [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')] osoba, którą jest [ROOT.Char.GetSuzerain.GetTitleAsName]."
 gdp_merchant_family.9150.a: "– Nie zawiodę ani ciebie, ani kompanii."
 gdp_merchant_family.9150.b: "– W pełni na to zasługujesz, [partner.GetFirstNameNoTooltip]."
 gdp_merchant_family.9150.b.tt: "Na następne #V 10#! lat [GetCourtPositionType( 'partner_court_position' ).GetName()|l] [partner.GetShortUINameNotMe] otrzymuje #p +1#! pkt [Concept('aptitude', 'kompetencji')|E]"
 gdp_merchant_family.9150.c: "– A jednak co by z nami było, gdyby nie [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]?"
 gdp_merchant_family.9150.c.tt: "Po osiągnięciu dorosłości zyskasz [modifier|El] „[GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip]” na #V 10#! lat"
 merchant_childhood_suzerain_modifier: "Pochlebca patrona"
 merchant_childhood_suzerain_modifier_desc: "Ta postać rozumie, jak ważne jest utrzymywanie dobrych relacji z tymi, którzy dzierżą najgrubszy kij."
 merchant_childhood_desc: "Kupieckie dzieciństwo"
