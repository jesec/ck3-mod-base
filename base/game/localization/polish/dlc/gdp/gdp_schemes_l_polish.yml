 start_steal_trade_post_local_ruler_favors_you_tt: "Lokalny [ruler|El], [local_ruler.GetShortUINameNotMe], ci sprzyja: #P +[EmptyScope.ScriptValue('steal_trade_post_local_ruler_success_value')|0]#! do [Concept('scheme_success_chance', 'szansy powodzenia spisku')|E]"
