 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.8402.desc: "W sercu miejsca o nazwie [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] obserwuję urzędników osoby znanej jako [target_patron.GetTitledFirstName], ospale przeglądających sterty dokumentów. Każdy stempel potwierdza przekazanie kolejnego składnika majątku [target.GetHouse.GetName] kompanii o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\nSpokój muchy leniwie brzęczącej nad ich głowami zostaje przerwany, gdy [target.GetFirstName] wpada nagle do komnaty.\n\n#EMP – TY!#! – skrzeczy jadowicie. – Jak?! #DIE2 Dlaczego…#!"
 scheme_critical_moments.8402.a: "To po prostu dobry interes…"
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.8403.desc: "Po wielu perypetiach i naciskach na osobę znaną jako [target_patron.GetTitledFirstName] nie udaje nam się doprowadzić sprawy do końca – [target.GetTitledFirstName] w porę wietrzy, że coś jest na rzeczy…\n\nKompania o nazwie [target.GetPrimaryTitle.GetDefinitiveName] przyjęła mocną postawę obronną, co uniemożliwia nam przechytrzenie tych nadwornych świń…"
 scheme_critical_moments.8403.discovered: "\n\nNa domiar tego [target.GetTitledFirstNameNoTooltip] ewidentnie wie, że za tym stoimy…"
 scheme_critical_moments.8403.fallback: "\n\nEwidentna nieświadomość osoby znanej jako [target.GetTitledFirstNameNoTooltip] co do naszego udziału w sprawie jest jednak niewielkim promykiem nadziei…"
 scheme_critical_moments.8403.a: "Typowe…"
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUINameNotMe] – ta osoba podjęła próbę wrogiego przejęcia kompanii osoby znanej jako [target.GetShortUINameNotMe], lecz poniosła porażkę!"
 scheme_critical_moments.8404.t: "Wrogie przejęcie: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "Skupiliśmy się na codziennym rozliczaniu naszych szlaków i węszeniu w błocie za okazjami, lecz dziś dowiadujemy się, że zupełnie zaniedbaliśmy to, co istotne.\n\nZ miejsca o nazwie [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] przysłano krótkie pismo, formalność potwierdzającą dzisiejsze postępowanie sądowe, które doprowadzi do rozwiązania naszej kompanii i #EMP zajęcia#! jej majątku przez kompanię o nazwie [owner.GetPrimaryTitle.GetDefinitiveName]!\n\nGdy docieram na miejsce, jest już za późno… o ile kiedykolwiek istniała szansa, by wszystkiemu zapobiec.\n\nTa łajdaczyna, [owner.GetTitledFirstName], uśmiecha się do mnie drwiąco, gdy rozpaczliwie przeglądam dokumenty, a wszystko to potwierdza mój patron, którym jest [target_patron.GetTitledFirstName]!"
 scheme_critical_moments.8404.a: "Jak?! #DIE2 Dlaczego…#!"
