 steal_trade_post_desc_general: "„$steal_trade_post$” to [hostile_scheme|El], którego celem jest przejęcie [Concept('trade_post', 'faktorii')|E] konkurencyjnego [Concept('patrician', 'patrycjusza')|E]. Jest oparty na umiejętnościach [Concept('intrigue', 'intrygi')|E] i [Concept('stewardship', 'zarządzania')|E] oraz umożliwia rekrutację [Concept('agents', 'wspólników')|E].\n\nJeśli kradzież wybranej faktorii się powiedzie, przejdzie ona z rąk [Concept('scheme_target', 'celu spisku')|E] do rąk [Concept('scheme_owner', 'inicjatora spisku')|E]."
