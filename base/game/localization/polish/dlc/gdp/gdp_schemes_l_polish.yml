 start_patrician_find_secrets_interaction: "$patrician_find_secrets$ #weak (spisek)#!"
 scheme_interaction_tt_patrician_find_secrets_approved: "Spróbuj odkryć [secret|El] [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E], do której należy [recipient.GetShortUINameNotMeNoTooltip]"
 start_patrician_find_secrets_notification: "$patrician_find_secrets$"
 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "Niemal żal mi rodu [target.GetHouse.GetName], tak uczynni, #EMP gorliwi#! wręcz, okazali się ich służący i rzekomi stronnicy w odsłanianiu przed moimi agentami najbardziej plugawych sekretów familii. #EMP Prawie#! mi przykro.\n\nDowód w moich rękach jest niezbity – [secret_holder.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]!"
 gdp_patrician_find_secrets.0002.a: "[secret_holder.GetHerHis|U] reputacja jest w moich rękach."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "Moi agenci przetrząsnęli wyrzucone dokumenty rodu [target.GetHouse.GetName], zastraszyli jego służbę i solidnie dociążyli sakwy wszystkich plotkarzy na targu, a mimo to nie znaleźli nic wartego wykorzystania.\n\nJakiekolwiek sekrety [target.GetTitledFirstName] skrywa za drzwiami, są albo zbyt głęboko zakopane, by się do nich dostać, albo nie istnieją wcale."
 gdp_patrician_find_secrets.0003.desc.outmatched: "Moi agenci deptali członkom rodu [target.GetHouse.GetName] po piętach na każdym kroku, lecz nie zdołali dojrzeć nawet cienia ich sekretów. Ci lawiranci drzwi mają zamknięte szczelniej niż w skarbcach największych skąpców, a służba pilnuje języka tak pilnie, że równie dobrze mogłaby go nie mieć.\n\nJakiekolwiek nikczemne czyny [target.GetTitledFirstName] ma na sumieniu, wiemy o nich tyle samo, co na początku."
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]! Wszystko na marne."
