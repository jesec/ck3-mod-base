 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.8502.desc: "Skradzione księgi, plotki i zdobyte kąski krok po kroku malują obraz licznych nabywców, sprzedawców i innych powiązań kompanii o nazwie [target.GetPrimaryTitle.GetDefinitiveName].\n\nNiewątpliwie te informacje pozwolą nam konkurować o ulubione towary osoby znanej jako [target.GetTitledFirstName] na równiejszych zasadach."
 scheme_critical_moments.8502.discovered: "\n\nNasze knowania nie pozostały niestety niezauważone przez osobę znaną jako [target.GetTitledFirstNameNoTooltip]…"
 scheme_critical_moments.8502.a: "Doskonale!"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUINameNotMe] – ta osoba zdołała ukraść analizy rynku kompanii osoby znanej jako [target.GetShortUINameNotMe], lecz ją na tym przyłapano!"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.8503.desc: "Tyle dni przepychanek z handlarzami, tyle długich nocy cichych narad w świetle świec, a my dalej niewiele wiemy o działalności kompanii o nazwie [target.GetPrimaryTitle.GetDefinitiveName]…\n\nNawet dokumenty z biura osoby znanej jako [target.GetTitledFirstName] były tylko bezsensownymi bazgrołami i starymi podliczeniami."
 scheme_critical_moments.8503.discovered: "\n\nCo gorsze, wygląda na to, że [target.GetTitledFirstNameNoTooltip] przeczuwa nasze intrygi."
 scheme_critical_moments.8503.fallback: "\n\nMożemy jednak pocieszyć się faktem, że [target.GetTitledFirstNameNoTooltip] nie przeczuwa naszego spisku."
 scheme_critical_moments.8503.a: "Co za strata czasu…"
 scheme_critical_moments.8503.tt.failed: "[scheme.GetOwner.GetShortUINameNotMe] – ta osoba próbowała ukraść analizy rynku kompanii osoby znanej jako [target.GetShortUINameNotMe], lecz nie udało jej się!"
