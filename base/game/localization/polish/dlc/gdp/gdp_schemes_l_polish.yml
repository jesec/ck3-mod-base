 scheme_critical_moments.1142.desc_patrician_self: "Wszystkie wysiłki włożone w moją autopromocję się opłaciły.\n\nZajmuję lepszą pozycję na tle innych, w moim [Concept('house', 'rodzie')|E] pojawili się nowi zwolennicy i jestem bliżej swojego celu niż kiedykolwiek!"
 scheme_critical_moments.1142.desc_patrician_other: "Czas i zasoby poświęcone na promowanie osoby, którą jest [target.GetTitledFirstName], przyniosły efekty.\n\n[target.Custom('PL_jego_jej')|U] reputacja w towarzystwie się umocniła, nowi zwolennicy są przekonani o [target.Custom('PL_jego_jej')] wartości, a [target.GetSheHe] stoi o szczebel wyżej w hierarchii [Concept('republic', 'republiki')|E]!"
 scheme_critical_moments.1143.desc_patrician_self: "Wysiłki i zasoby włożone w moją autopromocję były niewystarczające. Nikt nie dał się przekonać co do mej wartości ani nie uległ składanym obietnicom i łapówkom, więc moja pozycja pozostaje bez zmian.\n\nMuszę znaleźć inny sposób na wypromowanie swojego [Concept('house', 'rodu')|E]."
 scheme_critical_moments.1143.desc_patrician_other: "$scheme_critical_moments.1143.desc_other$"
 patrician_promote_success_toast: "Pozycja podniesiona!"
 patrician_promote_toast_scheme_desc: "[owner.GetShortUINameNotMeNoTooltip], a dla ciebie [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))], podnosi twoją pozycję"
 patrician_find_secrets: "$laamp_help_find_secrets_scheme$"
