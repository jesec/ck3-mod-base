 hostile_takeover_desc_general: "$hostile_takeover$ to [hostile_scheme|El], którego celem jest przejęcie majątku [Concept('company', 'kompanii')|E] konkurencyjnego [Concept('merchant', 'kupca')|E]. Jest oparty na umiejętnościach [Concept('intrigue', 'intrygi')|E] i [Concept('stewardship', 'zarządzania')|E] oraz umożliwia rekrutację [Concept('agents', 'wspólników')|E].\n\nUdane wrogie przejęcie będzie skutkować zniszczeniem kompanii będącej [Concept('scheme_target', 'celem spisku')|E] i wzrostem [Concept('competitiveness', 'konkurencyjności')|E] [Concept('scheme_owner', 'inicjatora spisku')|E]."
