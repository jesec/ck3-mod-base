 start_steal_trade_post_cohesion_warning_desc: "@alert_icon! #alert_trial Ukradnięcie [Concept('trade_post', 'faktorii')|E] [Concept('patrician', 'patrycjuszowi')|E] należącemu do twojej [Concept('trade_league', 'ligi handlowej')|E] wpłynie na [cohesion|El]#!"
 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: sukces"
 scheme_critical_moments.8602.desc: "Sędziowie z miejsca znanego jako [trade_post_county.GetName] mają swoją cenę, a ta okazuje się skromna. Pieczęć po pieczęci dzierżawa na ziemiach o nazwie [trade_post_province.GetName] przechodzi w nasze ręce.\n\nZanim [target.GetTitledFirstName] się o tym dowie, nasi faktorzy zdążą już przegnać [target.GetHerHis] subiektów i zamalować [target.Custom('PL_mu_jej')] szyldy."
 scheme_critical_moments.8602.a: "Ten wspaniały adres jest już nasz."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: porażka"
 scheme_critical_moments.8603.desc: "Każdą łapówkę przyjęto skwapliwie, a mimo to obietnice nie znalazły żadnego pokrycia. Sędziowie z miejsca znanego jako [trade_post_county.GetName] zagarnęli moje srebro, nie kiwnąwszy nawet palcem w interesie mojej własności.\n\n[target.GetTitledFirstName] zachowuje niewzruszoną kontrolę nad tym miejscem."
 scheme_critical_moments.8603.discovered: "\n\nCo gorsza, [target.GetTitledFirstNameNoTooltip] wie dokładnie, czyja dłoń sięgała do [target.GetHerHis] sakwy…"
 scheme_critical_moments.8603.fallback: "\n\nNa szczęście nasz udział w sprawie pozostaje tajemnicą."
 scheme_critical_moments.8603.a: "Srebro zmarnowane na wiarołomnych ludzi."
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUINameNotMe] – ta osoba próbowała przejąć twoją [Concept('trade_post', 'faktorię')|E] w miejscu znanym jako [trade_post_province.GetNameNoTooltip], lecz poniosła porażkę!"
 scheme_critical_moments.8604.t: "Przejęto faktorię: [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "Posłaniec przynosi wieść z miejsca, które nosi nazwę [trade_post_county.GetName]: naszego faktora wyrzucono na ulicę, a miejscowi sędziowie ogłosili mnie persona non grata, wskazując kogoś innego jako właściciela faktorii w miejscu znanym jako [trade_post_province.GetName].\n\nLata handlu, składowania i mozolnie zyskanej przychylności zostały oddane ruchem pióra przez ludzi, którym zapłaciliśmy za lojalność."
 scheme_critical_moments.8604.discovered: "\n\nA teraz [owner.GetTitledFirstName] stoi na moim miejscu, jak gdyby zawsze należało do [owner.Custom('PL_niego_niej')]. #EMP Tego#! nie zapomnimy!"
 scheme_critical_moments.8604.a: "Wystawiono nas za nasz własny próg!"
 steal_trade_post_failed_toast: "Podjęto próbę przejęcia faktorii"
 steal_trade_post_host_toast: "Faktoria przechodzi w inne ręce"
 steal_trade_post_host_toast_desc: "[trade_post|E] w miejscu znanym jako [trade_post_province.GetName] przechodzi w inne ręce: jej właścicielem jest już nie [target.GetShortUINameNotMe], lecz [owner.GetShortUINameNotMe]"
