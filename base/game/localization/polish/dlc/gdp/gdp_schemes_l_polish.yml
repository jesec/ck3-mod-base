 patrician_find_secrets_desc: "Spróbuję odkryć [secret|El] [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E], do której należy [SCHEME.GetTargetCharacter.GetShortUINameNotMe]"
 patrician_find_secrets_desc_general: "W ramach [Concept('scheme', 'spisku')|E] „Szukaj sekretów” próbujesz odkryć [secret|El] dotyczący przestępstwa lub hańby, jaki skrywa inna [patrician_family|El]."
 PATRICIAN_FIND_SECRETS_SUCCESS_DESC: "Odkryjesz [secret|El] [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E], do której należy [SCHEME.GetTargetCharacter.GetShortUINameNotMe] (o ile taki istnieje)"
 PATRICIAN_FIND_SECRETS_DISCOVERY_DESC: "Twoja próba odkrycia [Concept('secret', 'sekretu')|E] nie zostaje ujawniona"
 patrician_find_secrets_invalidated_title: "@scheme_icon! Koniec spisku „$patrician_find_secrets$”"
