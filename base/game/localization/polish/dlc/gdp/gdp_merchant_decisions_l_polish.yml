 gdp_decision.2000.t: "$forge_charter_decision$"
 gdp_decision.2000.desc: "Dzięki kreatywnej kaligrafii oraz sprytnemu odwzorowaniu pieczęci, laków i innych atrybutów aparatu urzędniczego dzieło tego pozbawionego skrupułów fałszerza stanowi prawdziwą atrakcję.\n\nŚmiem twierdzić, że mogłoby ono oszukać nawet wprawne oko osoby zaznajomionej z tego typu dokumentami, o ile tylko nie przyjrzałaby się im zbyt dokładnie…"
 gdp_decision.2000.a: "Musimy zachować ostrożność."
 invite_merchants_decision: "Przyciągnij kupców"
 invite_merchants_decision_desc: "Jeśli mamy dostarczać towary do państwa, wywozić je i transportować na jego terytorium, musimy zapewnić sprzyjające warunki dla działalności kupców."
 invite_merchants_decision_tooltip: "Zaproś [Concept('merchants', 'kupców')|E] do osiedlenia się w twojej [Concept('capital', 'stolicy')|E], aby tworzyli [trade_routes|El] i oferowali swoje usługi jako twoi [clients|El]."
 invite_merchants_decision_confirm: "Należy zapewnić swobodny ruch towarów."
 invite_merchants_decision_capital_full_tt: "Mniej niż [EmptyScope.ScriptValue('invite_merchants_max_capital_merchants_value')|0] [Concept('merchants', 'kupców')|E] ma swoje [companies|El] w twojej [Concept('capital', 'stolicy')|E]"
 merchant_enticed_title: "Przybycie kupca"
 invite_merchants_decision_effect_1: "Kilku [Concept('merchants', 'kupców')|E] może przenieść swoje [companies|El] do twojej [Concept('capital', 'stolicy')|E]"
 invite_merchants_decision_effect_2: "Wszyscy [merchants|El], którzy zostaną twoimi [Concept('client', 'klientami')|E], zyskają na swoim nowym [Concept('market', 'rynku')|E] modyfikator „[GetModifier('gdp_enticed_merchant_market_modifier').GetNameWithTooltip]”"
 gdp_enticed_merchant_market_modifier: "Skuszony kupiec"
 gdp_enticed_merchant_market_modifier_desc: "Kompania tej postaci otrzymała korzystne zachęty, aby przenieść się na ten rynek."
 gdp_decision.3000.opening: "[new_patron.Custom2('AppropriateGreetingPositive', new_client)]"
 gdp_decision.3000.desc: "Poszukuję szanowanych i pracowitych kupców twojego pokroju, którzy przeniosą się do miejsca znanego jako [new_patron.GetPrimaryTitle.GetDefinitiveName].\n\nW zamian zapewnię ci korzystne warunki prowadzenia działalności na naszych rynkach."
 gdp_decision.3000.a: "@move_company_icon! Nasze księgi w miejscu znanym jako [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] możemy uznać za rozliczone."
 gdp_decision.3000.b: "Zmierzamy donikąd!"
 gdp_decision.3000.c: "[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] to nasz dom – teraz i na wieki."
 gdp_decision.3000.c.tt: "Nikt już więcej nie zaproponuje ci relokacji twojej [Concept('company', 'kompanii')|E]"
 gdp_sponsor_merchant_company_decision: "Zasponsoruj kupca"
 gdp_sponsor_merchant_company_decision_desc: "Handel to zajęcie brudne, nie dla kogoś tak wyrafinowanego jak ja. Z drugiej strony, z pewnością mam na dworze kogoś, kto mógłby zostać moim osobistym kupcem i robić to za mnie?"
 gdp_sponsor_merchant_company_decision_tooltip: "Ufunduj jednemu ze swoich [Concept('courtiers', 'dworzan')|E] założenie [Concept('company', 'kompanii')|E] [Concept('merchant', 'kupieckiej')|E], która zacznie działać jako twój [client|El]"
 gdp_sponsor_merchant_company_decision_confirm: "Ufunduj nową kompanię"
 gdp_sponsor_merchant_company_decision_no_item_selected: "Nie wybrano żadnego [Concept('courtier', 'dworzanina')|E]"
 gdp_sponsor_merchant_company_decision_cooldown_tt: "Ufundowano [Concept('company', 'kompanię')|E] [Concept('merchant', 'kupiecką')|E] w ciągu ostatnich 5 lat"
 gdp_sponsor_merchant_company_decision_candidate_tt: "Masz dorosłego [Concept('courtier', 'dworzanina')|E] w dobrym zdrowiu w swojej [Concept('capital', 'stolicy')|E], który nie jest [Concept('lowborn', 'nisko urodzonym')|E], ani [Concept('heir', 'dziedzicem')|E] żadnego [Concept('title', 'tytułu')|E], ani nie jest dla ciebie rodzicem, dzieckiem, bratem, siostrą, [Concept('spouse', 'małżonkiem')|E] ani [Concept('concubine', 'konkubiną')|E]"
