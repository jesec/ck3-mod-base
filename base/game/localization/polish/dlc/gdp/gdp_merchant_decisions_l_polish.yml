 gdp_sponsor_merchant_company_size_small_tt: "[company_size|E] będzie następująca: [GetLaw('company_size_small').GetName|l]"
 gdp_sponsor_merchant_company_size_medium_tt: "[company_size|E] będzie następująca: [GetLaw('company_size_medium').GetName|l]"
 gdp_sponsor_merchant_company_size_large_tt: "[company_size|E] będzie następująca: [GetLaw('company_size_large').GetName|l]"
 gdp_sponsor_merchant_company_size_huge_tt: "[company_size|E] będzie następująca: [GetLaw('company_size_huge').GetName|l]"
 gdp_decision.3010.t: "W kompanii osoby o imieniu [sponsored_courtier.GetNameNoTooltip]"
 gdp_decision.3010.desc: "– To wielki zaszczyt, móc wykonywać dla ciebie tak ważne zadanie! Dopilnuję, aby wszystkie twoje [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] przynosiły zysk.\n\n[sponsored_courtier.GetNameNoTooltip] okazuje entuzjazm, choć przed wejściem do tej komnaty nie było [sponsored_courtier.Custom('PL_mu_jej')] wiadome, że zostanie moim zaufanym kupcem.\nMoże bardziej niż spełnienie życiowego marzenia kusi [sponsored_courtier.Custom('PL_go_ja')] perspektywa początkowego kapitału i możliwość wydania go na założenie własnej kompanii."
 gdp_decision.3010.a: "Dam ci nie więcej niż trzeba."
 gdp_decision.3010.b: "Pokryte zostaną wszystkie podstawowe wydatki."
 gdp_decision.3010.c: "Pokaźny kapitał zapewni powodzenie przedsięwzięcia."
 gdp_decision.3010.d: "Nie będziemy szczędzić środków!"
 gdp_decision.3010.e: "Możemy to jeszcze rozważyć."
