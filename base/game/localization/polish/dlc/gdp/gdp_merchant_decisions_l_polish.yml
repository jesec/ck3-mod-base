 CRAFT_ARTIFACT_DECISION_NEXT_STEP_BUTTON: "Wybierz artefakt"
 craft_artifact: "Wytwórz artefakt"
 craft_artifact_action: "Wytwórz artefakt"
 craft_artifact_desc: "Spróbuję wyprodukować [domicile_artifact|El] [Concept('company', 'kompanii')|E]."
 craft_artifact_desc_general: "[scheme|E] „$craft_artifact$” to [personal_scheme|El], w którym przy pomocy swojej [Concept('company', 'kompanii')|E] usiłujesz wytworzyć całkowicie nowy [domicile_artifact|El]. Ten spisek opiera się przede wszystkim na twojej umiejętności [Concept('stewardship', 'zarządzania')|E].\n\n[success_chance|E] zależy od wielu aspektów, jednakże decydującą rolę odgrywają tutaj twoja [stewardship_skill|El] i [aptitude|El], jakie posiada twój kustosz."
 CRAFT_ARTIFACT_SUCCESS_DESC: "Utwórz nowy [domicile_artifact|El]"
 craft_artifact_invalidated_title: "Spisek „$craft_artifact$” dobiega końca"
 craft_artifact_scheme.1000.t: "$craft_artifact$: sukces"
 craft_artifact_scheme.1000.intro.curio: "Noc za nocą spędzam w warsztacie, z partnerem lub członkami miejscowych gildii, wytwarzając to i owo."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nAle dziś mogę wreszcie powiedzieć, że cały ten trud się opłacił! Gdy patrzę na to dzieło, każdy ślad mojej pracy wywołuje uśmiech i jedyne, o czym myślę, to gdzie dumnie je wyeksponować."
 craft_artifact_scheme.1000.intro.library: "Noc w noc pochylam się nad biurkiem w pracowni, z wysiłkiem kreśląc kolejne słowa cierpnącymi, poplamionymi atramentem dłońmi, podczas gdy knot świecy powoli dogasa."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nAle dziś mogę wreszcie powiedzieć, że cały ten trud się opłacił! Gdy przeglądam to dzieło, każdy fragment wywołuje uśmiech i myślę już tylko o innych, którzy będą czytać moje zapiski."
 craft_artifact_scheme.1000.desc.curator: "\n\n[curator.GetFirstName], mój kustosz, przygląda się dziełu z błyskiem w oczach.\n\n– Niech [ROOT.Char.GetTitleAsNameNoTooltip] wie, że to #EMP nie lada#! osiągnięcie."
 craft_artifact_scheme.1000.a: "Warto było się poświęcać."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nTwórca: [ROOT.Char.GetTitledFirstName], [ROOT.Char.GetPrimaryTitle.GetName]."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nAutor: [ROOT.Char.GetTitledFirstName], [ROOT.Char.GetPrimaryTitle.GetName]."
 craft_artifact_scheme.2000.t: "$craft_artifact$: porażka"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nKażda próba urzeczywistnienia mojego pomysłu kończyła się niepowodzeniem z powodu błędnych obliczeń lub złych założeń, a pokój usłany jest szczątkami porzuconych projektów, których w żaden sposób nie dało się już wykorzystać…"
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nCo rano podłoga usłana jest porzuconymi strzępami kartek z moimi zapiskami, a tych kilka zachowanych przeze mnie fragmentów wciąż w ten czy inny sposób nie oddaje pełni mojej wizji…"
 craft_artifact_scheme.2000.desc.curator: "\n\n[curator.GetFirstName], mój kustosz, wzdycha, spoglądając na mizerne owoce moich trudów.\n\n– Może czas przyznać się do porażki?"
 craft_artifact_scheme.2000.a: "Powoli zaczynam mieć tego dosyć…"
 craft_artifact_scheme.2000.b: "…ale moja praca nie może pójść na marne!"
