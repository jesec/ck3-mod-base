 craft_artifact_decision: "Wytwórz artefakt"
 craft_artifact_decision_desc: "Kupować i sprzedawać dzieła innych to jedno, lecz by naprawdę wyrobić sobie imię, musimy wydać na świat dzieła nowe i cudowne."
 craft_artifact_decision_effect: "Nowy [project|El] na twoim dworze"
 craft_artifact_decision_tooltip: "Rozpocznij [scheme|El] „[GetScheme('craft_artifact').GetTypeName]”, aby wytworzyć [domicile_artifact|El]"
