 wipe_slate_merchant_decision: "Zyskaj czystą kartę"
 wipe_slate_merchant_decision_desc: "Czy człowiek musi wiecznie cierpieć za zbrodnie popełnione w straszliwych okolicznościach? Czyż nie wszyscy [ROOT.Char.GetFaith.GetAdherentNamePlural] zasługują na drogę do odkupienia?\n\nWystarczy czas, energia i – co najważniejsze – #EMP pieniądze#!, a świat wybaczy nam wszystkie grzechy."
 wipe_slate_merchant_decision_tooltip: "Twoja postać jest znana jako [GetTrait('dealbreaker').GetName( GetNullCharacter )|l] – odpokutuj za swoją reputację"
 wipe_slate_merchant_decision_confirm: "Z każdym dniem czystsze sumienie!"
 merchant_spending_spree_decision: "Szał zakupowy"
 merchant_spending_spree_decision_desc: "Rok w rok ważę, wyceniam i targuję się o towary przeznaczone do cudzych domów, jednak ani razu do własnego. Dobrze by mi zrobił dzień wśród straganów z otwartą sakiewką, żeby kupić wszystko, co wpadnie mi w oko."
 merchant_spending_spree_decision_tooltip: "Wydawaj [gold|El] do woli na [Concept('market', 'rynku')|E], aby złagodzić [stress|El] swój i twoich [Concept('associates', 'partnerów')|E] oraz zyskać [prestige|El], a także mieć okazję na zakup [Concept('domicile_artifact', 'artefaktu domowego')|E]"
 merchant_spending_spree_decision_tooltip_greedy: "Wydawaj [gold|El] do woli na [Concept('market', 'rynku')|E], aby złagodzić [stress|El] twoich [associates_possessive|El] i zyskać [prestige|El], a także mieć okazję na zakup [Concept('domicile_artifact', 'artefaktu domowego')|E]"
 merchant_spending_spree_decision_confirm: "Nie szczędź środków!"
 merchant_spending_spree_decision_associates_tt: "Twoi [associates|El] pozbywają się [stress_loss_i] [Abs_CFixedPoint( GetPlayer.MakeScope.ScriptValue('medium_stress_impact_loss') )|P0] pkt [Concept('stress', 'stresu')|E]"
 merchant_spending_spree_decision_associates_tt_past: "Twoi [associates|El] pozbyli się [stress_loss_i] [Abs_CFixedPoint( GetPlayer.MakeScope.ScriptValue('medium_stress_impact_loss') )|P0] pkt [Concept('stress', 'stresu')|E]"
 merchant_spending_spree_decision_artifact_tt: "#V 25%#! szansy na zakup [Concept('domicile_artifact', 'artefaktu domowego')|E]"
