l_polish:
 gdp_repudiate_usurious_loan_decision: "Potęp lichwiarską pożyczkę"
 gdp_repudiate_usurious_loan_decision_desc: "Osoba znana jako [ROOT.Var('loan_holder').Char.GetShortUINameNotMeNoTooltip] wypisała skrypt dłużny, jawnie zastrzegając odsetki, a nasi [ROOT.Char.GetRite.PriestNeuterPlural|l] stoją na stanowisku, że taka umowa nikogo nie wiąże. Niechaj dług zostanie unieważniony, a nie spłacony.\n\nTo nie kradzież. To prawo, jakim kieruje się ludność [ROOT.Char.GetRite.GetAdjectiveNoTooltip|l] – choć każdy kupiec od naszych ziem aż po morze i tak nazwie to kradzieżą."
 gdp_repudiate_usurious_loan_decision_tooltip: "Namów swoje [clergy|El] do uznania pożyczki za [Concept('usury', 'lichwę')|E] i unieważnienia długu – zatrzymasz [gold|El], ale stracisz reputację wśród [Concept('merchants', 'kupców')|E]"
 gdp_repudiate_usurious_loan_decision_confirm: "Nie wiąże mnie żadna umowa zawarta w grzechu!"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "Nie stać cię na spłacenie tej [Concept('loan', 'pożyczki')|E]"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "Nie potępiono ostatnio [Concept('creditor', 'wierzyciela')|E]"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X  W najbliższej przyszłości [merchants|El] mogą nie być skłonni udzielać ci kredytu#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "W twoim [Concept('rite', 'obrządku')|E] pożyczka musi być uznawana za grzech, a władca z [Concept('clergy', 'duchowieństwa')|E] twojej [Concept('faith', 'wiary')|E] musi być wystarczająco blisko, aby móc ją unieważnić: jego [rite|El] musi zgadzać się z twoim, nie może być twoim [Concept('creditor', 'wierzycielem')|E] ani [Concept('rival', 'rywalem')|E] i nie może być z tobą w stanie wojny\n#weak Twoja [head_of_faith|El], posiadacz [Concept('clerical_region', 'regionu duchownego')|E] obejmującego twoją stolicę lub miejsce, w którym przebywasz, albo ktokolwiek z [Concept('clergy', 'duchowieństwa')|E] w państwie twojego [top_liege_possessive|El].#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "Twój [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|El] musi cię popierać: mieć na twój temat #P pozytywną#! [Concept('opinion', 'opinię')|E] lub być twoją [Concept('puppet', 'marionetką')|E], bo masz na niego [Concept('strong_hook', 'haka mocnego')|E]"
 become_merchant_decision: "Zostań kupcem"
 become_merchant_decision_desc: "Jaki sens ma służba na dworze, jeśli nie zna się zwyczajów panujących wśród ludzi? Pragnienie zagranicznych podróży, chęć łączenia państw – są one zbyt silne, by je zignorować."
 become_merchant_decision_tooltip: "Oddaj [titles|El] i załóż [Concept('company', 'kompanię')|E] [Concept('merchant', 'kupiecką')|E]"
 become_merchant_decision_confirm: "Nadszedł czas, by skupić się na handlu!"
 become_merchant_decision_house_head_tt: "Musisz być [Concept('house_head', 'głową rodu')|E]"
 gdp_recently_became_adventurer_decision_cooldown_tt: "Jesteś [Concept('adventurer', 'poszukiwaczem przygód')|E] od #V 5 lat#!"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUINameNotMe] nie będzie już mieć długu u osoby znanej jako [repudiated_lender.GetShortUINameNotMe] z tytułu pożyczki"
 abuse_charter_authority_decision: "Nadużyj uprawnień wynikających z koncesji"
 abuse_charter_authority_decision_tooltip: "Wykorzystaj swoją [Concept('charter', 'koncesję')|E], by zyskać [gold_i|E] [gold|El] i zwiększyć swoją [competitiveness_i|E] [competitiveness|El]"
 abuse_charter_authority_decision_desc: "Mam przy sobie koncesję, której autorem jest [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] z miejsca o nazwie [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], i która sprawia, że zamiary miejsca znanego jako [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] stały się prawem. Z pomocą władcy państwa nikt nie odważy się stanąć na drodze naszych interesów."
 abuse_charter_authority_decision_confirm: "Działam w imieniu osoby znanej jako [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]!"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "Autorytet [gurkhan_possessive|El] nie jest tutaj uznawany"
 abuse_charter_authority_decision.region_already_abused: "Na tych ziemiach doszło już do nadużycia władzy [gurkhan_possessive|El]"
 abuse_charter_authority_decision.nothing_to_abuse: "W tym [Concept('location', 'miejscu')|E] nie ma żadnych ziem, gdzie może dojść do nadużycia"
 gdp_charter_abused_market_modifier: "Nadużycie uprawnień wynikających z koncesji"
 gdp_charter_abused_market_modifier_desc: "Ta postać nadużyła uprawnień wynikających z koncesji, aby wspomóc swoją kompanię."
 gdp_charter_abused_market_county_modifier: "Nadużycie uprawnień wynikających z koncesji"
 gdp_charter_abused_market_county_modifier_desc: "To hrabstwo zostało wyeksploatowane przez kompanię kupiecką, która wykorzystała koncesję, by się wzbogacić."
 gdp_charter_leveraged_market_modifier: "Postać zepchnięta na margines przez posiadacza koncesji"
 gdp_charter_leveraged_market_modifier_desc: "Kompania tej postaci straciła swoją pozycję na rzecz rywala posiadającego koncesję udzieloną przez władcę państwa."
 gdp_charter_charitable_market_county_modifier: "Rozwój wspomagany koncesją"
 gdp_charter_charitable_market_county_modifier_desc: "To hrabstwo doświadczyło rozwoju dzięki kompanii kupieckiej, która wykorzystała koncesję do bezpośredniej interwencji."
 gdp_decision.1000.t: "Irytacja patrona"
 gdp_decision.1000.desc: "Posłaniec przybywa z wieściami pochodzącymi z dworu osoby znanej jako [patron.GetTitledFirstNameNoTooltipRegnal], gdzie w obecności mojego patrona o kamiennym wyrazie twarzy wygłoszono zarzuty dotyczące nadużyć mojej kompanii.\n\nPodobno urzędnicy szczegółowo wymieniali zarzuty dotyczące naszych przewinień i z każdą chwilą w osobie znanej jako [patron.GetTitleAsNameNoTooltip] wzbierał coraz większy gniew.\n\nMój patron domaga się teraz natychmiastowej odpowiedzi, w której wyjaśnimy swoje czyny…"
 gdp_decision.1000.a: "– Z pokorą przyjmuję osąd."
 gdp_decision.1000.b: "– Musicie zrozumieć, że to było dla dobra państwa…"
 gdp_decision.1000.b.success: "Twój patron jest miłosierny"
 gdp_decision.1000.b.failure: "Twój patron jest oburzony"
 gdp_decision.1000.a.effects: "Twój [merchant_patron|El] zyskuje wymierzony w ciebie [imprisonment_reason|El] i [execute_reason|El]"
 gdp_decision.1000.a.severe_effects: "Twój [merchant_patron|El] zyskuje wymierzony w ciebie i [Concept('close_family_members', 'członków twojej bliskiej rodziny')|E] [imprisonment_reason|El] i [execute_reason|El]."
 gdp_decision.1000.a.survived_patrons_wrath: "Nawet jeśli uda ci się przeżyć gniew [merchant_patron_possessive|El], nie będziesz już w stanie nadużywać jego uprawnień."
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "Ja, [ROOT.Char.GetTitleAsNameNoTooltip], potwierdzam, że kupcy z miejsca znanego jako [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] reprezentują mój autorytet, a w szczególności ci, którym przyznano koncesje opatrzone moją pieczęcią.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$Wygląda na to, że jeden z handlarzy ulicznych, znany jako [merchant.GetName], nadużył mojej łaski, wykorzystując swoje uprawnienia, by wzbogacić się kosztem ludu.\n\nTakie nadużycia są oburzające, ale muszę rozważyć korzyści, jakie państwu mogą przynieść tacy handlarze."
 gdp_decision.1010.a: "Odpowie za to!"
 gdp_decision.1010.a.tt: "Inni [clients|El] posiadający twoje [charters|El] będą mniej skłonni do nadużywania uzyskanych od ciebie uprawnień, jeśli osoba znana jako [merchant.GetShortUINameNotMe] zostanie [Concept('imprisoned', 'uwięziona')|E]"
 gdp_decision.1010.b: "Odpuszczę sobie tę kwestię… na razie."
 gdp_decision.1010.c: "Te gadki o kupcach są poniżej mojej godności."
 gdp_decision.1010.c.flavor: "Dalsze nadużywanie twoich uprawnień może mieć miejsce, ale nie będziesz już otrzymywać informacji na ten temat"
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]…? Przecież [merchant.GetSheHe] nie ma ode mnie koncesji!"
 gdp_decision.1020.t: "W imię osoby znanej jako [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1020.opening: "Wystarczy, że wyciągnę koncesję, a bramy miejsca o nazwie [market_province.GetBaronyNameExplicitly] i biura jego urzędników staną otworem w imię osoby znanej jako [patron.GetTitledFirstName].\n\n"
 gdp_decision.1020.market_holder: "Lokalna gruba ryba, znana jako [market_holder.GetTitledFirstName], jasno wyraziła swoje niezadowolenie, krzycząc, że [patron.GetTitleAsNameNoTooltip] usłyszy o tej sprawie, lecz [market_holder.Custom('PL_jego_jej')] paplanina nie ma znaczenia. Ten dokument jest niepodważalny.\n\n"
 gdp_decision.1020.closing: "Mając miasto pod swoją kontrolą, wspólnicy kompanii mogą przejąć obiekty handlowe, skonfiskować każdy towar bez stosownych dokumentów oraz nękać naszych konkurentów fałszywymi zarzutami i oskarżeniami."
 gdp_decision.1020.a: "Nikt nie stanie nam na drodze."
 gdp_decision.1020.b: "Osoba znana jako [market_holder.GetTitledFirstNameNoTooltip] powinna otrzymać swoją działkę."
 gdp_decision.1020.c: "Zmieniam zdanie."
 gdp_decision.1020.d: "– Na tym kończy się moja #EMP kontrola#!. Tym razem…"
 gdp_decision.1020.b.success: "[patron.GetTitleAsNameNoTooltip|U] nie ma pojęcia o tej sytuacji"
 gdp_decision.1020.b.failure: "[patron.GetTitleAsNameNoTooltip|U] otrzymuje wieści o tym nadużyciu"
 benevolent_charter_authority_decision: "Pokieruj lokalną inwestycją"
 benevolent_charter_authority_decision_tooltip: "Wykorzystaj swoją [Concept('charter', 'koncesję')|E], aby wznieść [building_i|E] [Concept('building', 'budowlę')|E] i poprawić lokalny [prosperity_i|E] [prosperity|El]"
 benevolent_charter_authority_decision_desc: "[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|U] miejsca o nazwie [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip] nadaje mi uprawnienia do przeprowadzania w państwie bezpośrednich interwencji, które zwykle wykraczałyby poza kompetencje zwykłej kompanii kupieckiej."
 benevolent_charter_authority_decision_confirm: "Wiele dobrego można zrobić w imię osoby znanej jako [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]."
 merchant_charter_intervention_county_cooldown: "W ciągu ostatnich #V 5#! lat#! nie przeprowadzono żadnej interwencji w miejscu znanym jako [THIS.Char.GetDomicile.GetLocation.GetName]"
 gdp_decision.1200.t: "Zadowolenie patrona"
 gdp_decision.1200.desc: "Dotarły do mnie słuchy z dworu osoby znanej jako [patron.GetTitledFirstNameNoTooltipRegnal], gdzie w obecności mojego zachwyconego patrona padły pełne entuzjazmu pochwały dotyczące inicjatywy mojej kompanii.\n\nKilku świadków nie szczędziło pochwał pod adresem miejsca o nazwie [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] i jego niedawnych interwencji.\n\nW wyniku tego [patron.GetTitleAsNameNoTooltip] przekazuje kompanii wiadomość: „Niech [ROOT.Char.GetTitledFirstNameNoTooltip] wie, że doceniamy wasze wysiłki na rzecz państwa!”"
 gdp_decision.1200.a: "– Wszyscy w kompanii cieszą się, że ich pomoc się przydała."
 gdp_decision.1200.b: "– Uznanie jest mile widziane, ale nagroda również."
 gdp_decision.1200.b.flavor: "Z całym szacunkiem…"
 gdp_decision.1200.b.success: "Twój patron jest hojny"
 gdp_decision.1200.b.failure: "Twój patron jest rozczarowany"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$Wygląda na to, że jeden z handlarzy ulicznych, znany jako [merchant.GetName], wykorzystał swoje uprawnienia z korzyścią dla państwa, inwestując w rozwój miejsca o nazwie [market_province.GetBaronyNameExplicitlyNoTooltip]!\n\nTakie godne uznania postępowanie należy pochwalić, choć przyznanie premii prawdopodobnie sprzyjałoby większej dobroczynności."
 gdp_decision.1210.a: "Należy wspierać tego typu inicjatywy."
 gdp_decision.1210.a.tt: "Inni [clients|El] posiadający twoje [charters|El] będą bardziej skłonni do wykorzystywania uzyskanych od ciebie uprawnień w sposób dobroczynny"
 gdp_decision.1210.b: "Na [ROOT.Char.GetFaith.HighGodNamePossessive], uczciwi kupcy #EMP jednak#! istnieją!"
 gdp_decision.1210.c: "Nie zawracaj mi głowy takimi sprawami."
 gdp_decision.1210.c.flavor: "Dalsze dobroczynne wykorzystywanie uzyskanych od ciebie uprawnień może mieć miejsce, ale nie będziesz już otrzymywać informacji na ten temat"
 gdp_decision.1220.t: "W imię osoby znanej jako [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1220.opening: "Moje pojawienie się w miejscu znanym jako [market_province.GetBaronyNameExplicitly] z koncesją w dłoni początkowo wywołuje konsternację wśród miejscowych urzędników, ale wkrótce udaje mi się wyjaśnić dobre intencje mojej kompani.\n\n"
 gdp_decision.1220.market_holder: "Miejscowa gruba ryba, [market_holder.GetTitledFirstName], wysłuchuje moich propozycji z pewnym zainteresowaniem, dostrzegając korzyści płynące ze wspierania produkcji i handlu wśród swoich poddanych.\n\n"
 gdp_decision.1220.closing: "Podczas zwiedzania mieszkańcy szybko wskazują nam kilka miejsc, które ewidentnie wymagają naprawy lub remontu."
 gdp_decision.1220.a: "– Na co więc czekamy?"
 gdp_decision.1220.d: "– To bardzo interesujące, ale mam inne sprawy na głowie…"
 press_the_advantage_decision: "Wykorzystaj przewagę"
 press_the_advantage_decision_desc: "Nasze ostatnie sukcesy zaskoczyły konkurencję i wywołały niepewność na rynkach. Nadszedł czas, by wykorzystać naszych wspólników, kontakty i ciężko wypracowaną przewagę, kierując się ścieżką, która pozwoli zamienić presję w zysk."
 press_the_advantage_decision_tooltip: "Użyj [competitive_pressure_i] [Concept('competitive_pressure', 'presji konkurencji')|E], aby zyskać większą [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjność handlową')|E] na [Concept('trade_route', 'szlaku handlowym')|E] przez określony czas"
 press_the_advantage_decision_confirm: "Wykorzystajmy swoją przewagę."
 merchant_competitive_pressure_gain_1_tt: "Zyskaj [competitive_pressure_i] #P 1#! pkt [Concept('competitive_pressure', 'presji konkurencyjnej')|E]"
 merchant_competitive_pressure_gain_2_tt: "Zyskaj [competitive_pressure_i] #P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! pkt [Concept('competitive_pressure', 'presji konkurencji')|E]"
 merchant_competitive_pressure_spend_tt: "Użyj [competitive_pressure_i] #N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! pkt [Concept('competitive_pressure', 'presji konkurencyjnej')|E]"
 merchant_competitive_pressure_spend_cost_tt: "Masz co najmniej [competitive_pressure_i] #V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! pkt [Concept('competitive_pressure', 'presji konkurencyjnej')|E]"
 merchant_competitive_pressure_below_max_tt: "Masz mniej [competitive_pressure_i] [Concept('competitive_pressure', 'presji konkurencji')|E], niż wynosi twój limit #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!"
 press_the_advantage_route_not_already_pressed_tt: "Masz aktywny [trade_route|El], który nie korzysta z modyfikatora „[GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]”"
 press_the_advantage_selected_route_has_trader_tt: "Do wybranego [Concept('trade_route', 'szlaku handlowego')|E] przypisano [Concept('trader', 'handlarza')|E]"
 press_the_advantage_selected_route_not_already_pressed_tt: "Wybrany [trade_route|El] nie korzysta z modyfikatora „[GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]”"
 merchant_competitive_pressure_route_modifier: "Wykorzystano przewagę"
 merchant_competitive_pressure_route_modifier_desc: "Ten szlak handlowy cieszy się szczególnym zainteresowaniem wspólników, którzy doskonale wiedzą, jakie są słabe punkty konkurencji."
 choose_specialized_market_decision: "Wybierz wyspecjalizowany rynek"
 choose_specialized_market_decision_desc: "Kompania, która rozumie zwyczaje rynku, jego przedstawicieli i ukryte kanały sprzedaży, potrafi poczuć się jak w domu nawet na nieznanym terenie. Skupiając uwagę inspektorów na jednym rynku na naszych szlakach, możemy przekształcić lokalną wiedzę w przewagę handlową."
 choose_specialized_market_decision_tooltip: "Wybierz [market_i] [market|El] na jednym ze swoich [route_i] [Concept('trade_routes', 'szlaków handlowych')|E], aby otrzymać premię za specjalizację inspektorów"
 choose_specialized_market_decision_confirm: "Przeanalizuj rynek"
 choose_specialized_market_decision_effect_tt: "Wybrany [market_i] [market|El] staje się twoim wyspecjalizowanym [market_i] [Concept('market', 'rynkiem')|E]"
 choose_specialized_market_has_valid_market_tt: "Masz odpowiedni [market_i] [market|E] na [route_i] [Concept('trade_route', 'szlaku handlowym')|E] lub w miejscu swojej [Concept('domicile', 'siedziby')|E]"
 choose_specialized_market_selected_market_has_valid_route_tt: "Wybrany [market_i] [market|El] znajduje się na jednym z twoich [route_i] [Concept('trade_routes', 'szlaków handlowych')|E] lub w miejscu twojej [Concept('domicile', 'siedziby')|E]"
 choose_specialized_market_selected_market_is_new_tt: "Wybrany [market_i] [market|El] nie jest twoim wyspecjalizowanym [market_i] [Concept('market', 'rynkiem')|E]"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "Ta kompania przeprowadziła analizę dotyczącą lokalnych zwyczajów, urzędników oraz praktyk handlowych na tym rynku."
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "Ta kompania stosuje na tym rynku system rygorystycznych inspekcji."
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "Ta kompania sporządziła niezwykle szczegółowy plan stoisk, magazynów i cichych układów obowiązujących na tym rynku."
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "Ta kompania zna ten rynek dzięki wieloletniemu doświadczeniu."
 pious_patronage_decision: "Pobożny patronat"
 pious_patronage_decision_desc: "Wiara jest kluczem do drzwi, których nie otworzą same pieniądze. Finansując miejsca kultu, duchownych i działania charytatywne na rynku, który już jest połączony z naszymi szlakami, możemy przekształcić zbiorową duchowość w zaufanie klientów."
 pious_patronage_decision_tooltip: "Wydaj [piety_i] [piety|El], aby polepszyć swoją [competitiveness_i] [Concept('trade_competitiveness', 'konkurencyjność handlową')|E] na [market_i] [Concept('market', 'rynku')|E]"
 pious_patronage_decision_confirm: "Wesprzyj finansowo wiernych"
 pious_patronage_has_valid_market_tt: "Masz [route_i] [trade_route|El] przechodzący przez odpowiedni [market_i] [market|El], który jeszcze nie korzysta z modyfikatora „[GetModifier('pious_patronage_market_modifier').GetNameWithTooltip]”"
 pious_patronage_selected_market_valid_faith_tt: "Na wybranym [market_i] [Concept('market', 'rynku')|E] wyznawana jest twoja [faith|El] #weak (lub masz atrybut „[GetPerk('prophet_perk').GetName(GetPlayer)]”)#!"
