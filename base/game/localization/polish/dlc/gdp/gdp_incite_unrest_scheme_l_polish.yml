l_polish:
 # Scheme
 gdp_incite_unrest_scheme: "Wznieć niepokoje"
 gdp_incite_unrest_scheme_desc: "Szerz buntownicze nastroje i niezadowolenie wśród prostego ludu stolicy, zwracając go przeciwko władcy."
 gdp_incite_unrest_scheme_desc_general: "Szerz buntownicze nastroje i niezadowolenie wśród prostego ludu stolicy, zwracając go przeciwko władcy."
 gdp_incite_unrest_scheme_action: "Podsycanie niepokojów przeciwko osobie znanej jako"
 GDP_INCITE_UNREST_SUCCESS_DESC: "Agitatorzy podburzyli prosty lud. Powszechna opinia w hrabstwie stołecznym seniora spadnie."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "Spisek mający na celu wzniecenie niepokojów w stolicy został wykryty."
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "Porzucono spisek"
 gdp_incite_unrest_scheme_owner_not_republic: "Nie mamy już rządu republikańskiego i nie możemy kontynuować tego spisku."
 # Interaction
 gdp_incite_unrest_start_interaction: "Wznieć niepokoje"
 gdp_incite_unrest_scheme_interaction_tt_approved: "Pracuj po kryjomu, aby szerzyć niepokój wśród prostego ludu obszaru znanego jako [recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V], obniżając [Concept('popular_opinion', 'powszechną opinię')|E] o postaci znanej jako [recipient.GetTitledFirstNameNoTooltip|V]"
 gdp_incite_unrest_scheme_start_notification: "Zawiązano spisek"
 gdp_incite_unrest_scheme_target_tt: "Ktoś spiskuje przeciwko tobie."
 # Success messages
 gdp_incite_unrest_scheme_success_t: "Szerzą się niepokoje"
 gdp_incite_unrest_scheme_success_liege_t: "Niepokoje w stolicy"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "Spisek spełza na niczym"
 gdp_incite_unrest_scheme_failure_desc: "Nasi agitatorzy nie zdołali podburzyć ludu przeciwko osobie znanej jako [scope:target.GetTitledFirstName]. Spisek spełzł na niczym i ludność pozostaje niewzruszona."
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "Zdemaskowano spisek"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "Agitatorzy zrobili to, co do nich należało. Niezadowolenie szerzy się na ulicach miejsca o nazwie [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], a [target.GetTitledFirstName] traci zaufanie ludu."
 gdp_incite_unrest_scheme_event.0005.a: "Ludzie są gotowi, by pójść o krok dalej."
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "Szepty o niezadowoleniu zakorzeniły się w miejscu o nazwie [This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. Ktoś podburza prosty lud przeciwko władcy, a głosy niezadowolenia przybierają na sile."
 gdp_incite_unrest_scheme_event.0006.a: "Muszę przywrócić porządek."
 # County modifier
 gdp_incite_unrest_county_modifier: "Zasiane buntownicze nastroje"
 gdp_incite_unrest_county_modifier_desc: "Agitatorzy byli tu aktywni, szerząc niezadowolenie i nastawiając prosty lud przeciwko władcy."
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "Zhańbiony intrygant"
 gdp_caught_inciting_unrest_modifier_desc: "Ta postać z patrycjatu została przyłapana na podsycaniu niepokojów przeciwko głowie republiki. Pozostałe rody i wyborcy patrzą na nią z podejrzeniem."
