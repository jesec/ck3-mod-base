l_polish:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]: w poszukiwaniu przewagi"
 gdp_merchant_scheme_advantage.1000.intro: "Zastanawiając się, jak usprawnić nasze działania w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_scheme_advantage.1000.intro.rival: "sprawdzam, jak nasz rywal, [rival.GetTitledFirstName], utrudnia nam pracę."
 gdp_merchant_scheme_advantage.1000.intro.partner: "zwracam się do mojego wspólnika, którym jest [portrait.GetTitledFirstName], aby znaleźć rozwiązania."
 gdp_merchant_scheme_advantage.1000.intro.agent: "zwracam się do mojego partnera, którym jest [portrait.GetTitledFirstName], aby znaleźć rozwiązania."
 gdp_merchant_scheme_advantage.1000.intro.trader: "zwracam się do mojego handlarza, którym jest [portrait.GetTitledFirstName], aby znaleźć rozwiązania."
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nJeśli tylko [portrait.GetTitledFirstNameNoTooltip] zachowa się poważnie i w pełni skupi się na tej sprawie, z pewnością szybko uda się nam ją załatwić…"
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nJeśli kompania się zjednoczy i naprawdę się postara, z pewnością szybko uda się nam załatwić tę sprawę…"
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nMoże dla dobra kompanii trzeba zakasać rękawy i spróbować zająć się prawdziwą robotą, byśmy mogli przejść do innych spraw…"
 gdp_merchant_scheme_advantage.1000.a: "– [portrait.GetFirstNameNoTooltip], za co ci płacę?!"
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.GetTitledFirstNameNoTooltip] czuje przytłoczenie"
 gdp_merchant_scheme_advantage.1000.b: "– Cała kompania musi wziąć się do roboty!"
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] [company|E] jest przytłoczona"
 gdp_merchant_scheme_advantage.1000.c: "– Dobra, muszę to zrobić osobiście!"
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] Czujesz przytłoczenie"
 gdp_merchant_scheme_advantage.1000.d.associate: "– Chodź, [portrait.GetFirstNameNoTooltip] z pewnością może zrobić więcej."
 gdp_merchant_scheme_advantage.1000.d.unity: "– W tej kompanii roi się od obiboków!"
 gdp_merchant_scheme_advantage.1000.d.stress: "– Czeka mnie tylko trochę więcej pracy…"
 gdp_merchant_scheme_advantage.1000.e: "– Och, zapomnij…"
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName] i ja codziennie siedzimy i zastanawiamy się, jak najlepiej zbliżyć się do naszego celu. Mój handlarz zwraca uwagę na ciągły brak rzetelnej siły roboczej w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitly].\n\n– Wiesz – wzdycha [trader.GetFirstNameNoTooltip] – jest pewna osoba, która może nam pomóc."
 gdp_merchant_scheme_advantage.1010.desc.liege: "To [recruit.GetFirstName]. [recruit_liege.GetTitledFirstName] z miejsca znanego jako [recruit_liege.GetPrimaryTitle.GetDefinitiveName|l] ma [recruit.Custom('PL_go_ja')] na służbie…"
 gdp_merchant_scheme_advantage.1010.desc.recruit: "To [recruit.GetFirstName], miejscowy szpieg i agent mieszający na rynku…"
 gdp_merchant_scheme_advantage.1010.a: "– Porozmawiam z [recruit.Custom('PL_nim_nia')]…"
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! Korzystasz ze swojego uroku"
 gdp_merchant_scheme_advantage.1010.b: "– Sprowadzić tę osobę bez względu na koszty."
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! Korzystasz z pieniędzy"
 gdp_merchant_scheme_advantage.1010.e: "– Phi, ta osoba nie jest warta zachodu."
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName] i ja codziennie siedzimy i zastanawiamy się, jak najlepiej zbliżyć się do naszego celu. W końcu mój handlarz porusza temat tego, jakie drzwi, które obecnie są dla nas zamknięte w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitly], może otworzyć nasza koncesja – [charter.GetName|l].\n\n– W sumie – uśmiecha się [trader.GetFirstNameNoTooltip] – skoro już mamy te papiery, to dlaczego by ich nie wykorzystać?"
 gdp_merchant_scheme_advantage.1020.a: "– Tak, z pewnością [patron.GetTitleAsNameNoTooltip] nas popiera!"
 gdp_merchant_scheme_advantage.1020.b: "– Nasza koncesja zdecydowanie przemawia sama za siebie."
 gdp_merchant_scheme_advantage.1020.e: "– To nie jest odpowiedni moment…"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "Wykorzystane przewagi: potencjał"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "Próby przyspieszenia tego spisku tylko zahamowały jego postępy."
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "Wykorzystane przewagi: rozwój"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "Wykorzystane przewagi: etap"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "Wykorzystane przewagi: konkurencyjność"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "Próby przyspieszenia tego spisku utrudniły handel."
 gdp_merchant_scheme_advantage_outcome: "Poszukaj przewag"
 gdp_merchant_scheme_advantage.desc: "szuka [Concept('scheme_opportunity_opportunities', 'przewag')|E] w [Concept('scheme', 'spisku')|E] dotyczącym [Concept('opportunity', 'okazji')|E]"
 gdp_merchant_scheme_advantage_add_1_opportunity_tt: "[scheme|E] zyskuje #P 1#! [scheme_opportunity_i|E] [Concept('scheme_opportunity_opportunity', 'przewagę')|E]"
 gdp_merchant_scheme_advantage_add_2_opportunities_tt: "[scheme|E] zyskuje #P 2#! [scheme_opportunity_i|E] [scheme_opportunity_opportunities|El]"
 gdp_merchant_scheme_advantage_subtract_opportunity_tt: "[scheme|E] traci #N 1#! [scheme_opportunity_i|E] [Concept('scheme_opportunity_opportunity', 'przewagę')|E]"
