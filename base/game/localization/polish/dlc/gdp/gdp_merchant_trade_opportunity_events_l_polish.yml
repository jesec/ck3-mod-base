l_polish:
 gdp_merchant_trade_opportunity.0001.t: "Wyzwanie przeciwko konkurentowi: ród [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "[task_contract_target.GetPrimaryTitle.GetName] to dla nas ciągłe utrapienie, ponieważ szkodzi naszym perspektywom i zyskom. Nigdzie nie odczuwamy tego bardziej dotkliwie niż na rynku o nazwie [local_market.GetShortName].\n\nTych wichrzycieli trzeba poskromić i w ten czy inny sposób pokazać im, że to my jesteśmy prawowitymi władcami tutejszych rynków."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "Po wielu dniach i nocach nagabywania miejscowych handlarzy i zgłębiania wszystkich tajników targowisk na rynku znanym jako [trade_market.GetShortName] odkryliśmy słabości, które przejawia [target_title.GetName].\n\nMając narzędzia do podkopania ich lokalnych relacji i przebijając oferty rywali w kluczowych obszarach, wkrótce możemy doprowadzić do załamania ich zysków i popsuć im reputację!"
 gdp_merchant_trade_opportunity.0002.a: "Pokażmy im, że mają się trzymać z dala od naszego terytorium."
 gdp_merchant_trade_opportunity.0002.b: "Jeśli ujawnimy nasze zamiary, zyskamy ich szacunek."
 gdp_merchant_trade_opportunity.0002.b.tt: "Musisz być [Concept('friend', 'przyjacielem')|E], [Concept('spouse', 'małżonkiem')|E] albo mieć co najmniej [SCOPE.ScriptValue('high_skill_rating')|V0] pkt [Concept('diplomacy', 'dyplomacji')|E] i nie mieć negatywnej [Concept('relation', 'szczególnej relacji')|E] ani nie być postacią [Concept('house_feuding', 'zwaśnioną')|E]"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "Nasze wysiłki zmierzające do zidentyfikowania sieci, którą dysponuje [target_title.GetName] na rynku znanym jako [trade_market.GetShortName] i poza nim, na niewiele się zdały. Co gorsza, zdaje się, że [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')] weryfikuje naszą pozycję i nadwyrężyliśmy nieco własną reputację.\n\nNasze nieudolne działania tylko wzmocniły pozycję rodu [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip], a w długich łańcuchach ich szlaków handlowych nie sposób znaleźć choćby jednego słabego ogniwa…"
 gdp_merchant_trade_opportunity.0003.a: "W imię [ROOT.Char.GetFaith.WealthGodNamePossessive]! To pochłonie całe nasze zyski!"
 gdp_merchant_trade_opportunity.0011.t: "Promowanie towarów: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "Gwarne [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')] w miejscu znanym jako [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] są areną zaciekłej rywalizacji handlarzy i kupców o wszelakie dobra.\n\nStojąc pośród tego zgiełku, otoczeni nieprzerwanym strumieniem przechodniów, zaczynamy zastanawiać się, jak wyróżnić nasze towary, by przyciągnęły spojrzenia zarówno klientów, jak i sklepikarzy…"
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "[trade_good_type.GetNameNoTooltip|U] to towar, który staraliśmy się promować w miejscu znanym jako [target_title.GetBaseNameNoTierNoTooltip]. Wydaje się, że te wysiłki przyniosły efekty – wielu klientów poszukuje naszych „doskonałych” produktów, a sprzedaż w całym regionie systematycznie rośnie.\n\nWygląda na to, że nasze zachęty i przekonywania poskutkowały!"
 gdp_merchant_trade_opportunity.0012.a: "Nie zmarnujemy takiej okazji."
 gdp_merchant_trade_opportunity.0012.b: "Już czuję [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]!"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "Staje się jasne, że wszystkie nasze wysiłki mające na celu przyciągnięcie klientów – przy pomocy, co prawda, nieco przesadzonych zapewnień o jakości produktów – nie przyniosły pożądanego efektu…\n\nSprzedaż raczej spada, a [trade_good_type.GetNameNoTooltip|l] to towar, na który popyt pikuje w całym miejscu znanym jako [target_title.GetBaseNameNoTierNoTooltip] wraz z utratą zaufania kupujących."
 gdp_merchant_trade_opportunity.0013.a: "Ale [trade_good_type.GetNameNoTooltip|l] u nas to #EMP jest#! najlepszy towar tego rodzaju!"
 gdp_merchant_trade_opportunity.0021.t: "Zachęcanie do inwestycji: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "Przemierzanie miejsca znanego jako [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] obnaża liczne niedociągnięcia w tutejszej infrastrukturze – od stanu dróg, przez mizerne możliwości magazynowania, aż po lokalny targ.\n\nTrzeba sprawić, by miejscowi władcy dostrzegli, jak bardzo opłaciłaby się choćby drobna inwestycja. Jeśli to zawiedzie, a chcemy jak najlepiej wykorzystać nasze kontakty w tym regionie, będziemy musieli zająć się tym sami…"
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "Umiejętne zdiagnozowanie niedociągnięć infrastruktury, które ma [target_title.GetTierAsName] o nazwie [target_title.GetNameNoTierNoTooltip], oraz korzyści płynących z jej ulepszenia przyciągnęło uwagę właściwych osób.\n\nNasze działania zaczynają przynosić efekty. Wygląda na to, że [local_ruler.GetTitledFirstName] widzi sens naszych argumentów i prace wkrótce ruszą. Wraz z zapowiadanym wzrostem obrotów towarami miejscowi handlarze i mieszczanie już teraz składają nam nieśmiałe gratulacje."
 gdp_merchant_trade_opportunity.0022.a: "Jeśli chcesz, by coś zostało zrobione, zrób to osobiście."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "Nasze próby zwrócenia uwagi tutejszych mieszkańców na liczne niedociągnięcia infrastruktury miejsca znanego jako [target_title.GetNameNoTierNoTooltip] przyniosły żenująco mizerne rezultaty i wydaje się mało prawdopodobne, by ci głupcy nas posłuchali.\n\nKolejne wpadki sprawią, że nic się praktycznie nie zmieni, a jedynym efektem naszych wysiłków będą zdezorientowani urzędnicy i handlarze. No chyba że weźmiemy sprawy w swoje ręce…"
 gdp_merchant_trade_opportunity.0023.a: "Interesy muszą się kręcić tak czy inaczej."
 gdp_merchant_trade_opportunity.0023.b: "Miejscowi to głupcy…"
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|U] na rynku znanym jako [local_market.GetShortName] noszą wyraźne ślady nieszczęść – zabite deskami i opuszczone kramy świadczą o zdławionym przepływie towarów po exodusie kupców w tych trudnych czasach.\n\nNależy jednak zrozumieć, że załamywanie rąk i ucieczka nie służą handlowi, a pokój nigdy nie jest dany raz na zawsze. Na nas spoczywa obowiązek przywrócenia porządku i zajęcia miejsca tych, którzy porzucili swe obowiązki."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0032.desc: "Wyglądając zza zamkniętych drzwi, mieszkańcy miejsca znanego jako [target_title.GetBaseNameNoTierNoTooltip] szybko pojęli, o co nam chodzi, a my błyskawicznie umocniliśmy swoją pozycję na rynku i przejęliśmy kontrolę nad zapasami.\n\nCi, którzy ponieśli straty w wyniku tych zmian, zostali zmuszeni do niechętnego zaakceptowania korzyści płynących z przywrócenia porządku oraz powolnego odradzania się handlu."
 gdp_merchant_trade_opportunity.0032.a: "To po prostu działa…"
 gdp_merchant_trade_opportunity.0032.b: "Skończyliśmy tutaj."
 every_county_province_custom: "Każda niedawno splądrowana [holding|El] w miejscu o nazwie [saved_county.GetName]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: porażka"
 gdp_merchant_trade_opportunity.0033.desc: "Nasza agresywna obecność w miejscu znanym jako [target_title.GetBaseNameNoTierNoTooltip] oraz próby nakłonienia tamtejszych mieszkańców do podporządkowania się naszym celom spotkały się z powszechną wrogością i upartą odmową współpracy.\n\nLudność i miejscowi kupcy zjednoczyli się przeciw nam, uznając narzucenie naszej dominacji za cenę zbyt wygórowaną za przywrócenie porządku i ożywienie handlu."
 gdp_merchant_trade_opportunity.0033.a: "Uparci głupcy!"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|U] na rynku znanym jako [local_market.GetShortName] skupiają mnóstwo grup rzemieślników, których pilnie strzeżone grono wytwarza wszystko – od lin po srebrne zastawy – zaspokajając potrzeby zarówno miejscowej ludności, jak i kupujących.\n\nPrzy odpowiednich kontaktach moglibyśmy uzyskać dostęp do tych sieci wykwalifikowanych rzemieślników, zbudować sobie reputację patronów w tym regionie, a przy okazji poznać kilka dochodowych metod lub trendów."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0042.desc: "Pieniądze pozwoliły nam nawiązać owocne kontakty w miejscu znanym jako [target_title.GetBaseNameNoTierNoTooltip] poprzez hojne wsparcie rzemieślników wszelkiej maści, którzy w ciszy swoich warsztatów tworzą przedmioty zarówno skromne, jak i zachwycające.\n\nSława patronów otwiera nam tu wszystkie drzwi i przyciąga uwagę szeroko komentowanego lokalnego rzemieślnika. [inspired_artisan.GetFirstName], bo to o [inspired_artisan.Custom('PL_nim_niej')] mowa, poszukuje właśnie funduszy, aby stworzyć [inspired_artisan.Custom('InspirationArtisanType')]."
 gdp_merchant_trade_opportunity.0042.a: "Nasze inwestycje przyniosły oczekiwane rezultaty."
 gdp_merchant_trade_opportunity.0042.b: "Nie możemy przegapić takiej okazji!"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: porażka"
 gdp_merchant_trade_opportunity.0043.desc: "Wszelkie nasze próby nawiązania kontaktów z lokalnymi rzemieślnikami w miejscu znanym jako [target_title.GetBaseNameNoTierNoTooltip] spotkały się z odmową. Zarówno nasze pieniądze, jak i propozycje przyjmowano z niechęcią i bez choćby pozorów wdzięczności.\n\nCzy naszą reputację nadszarpnęło jakieś nieporozumienie, knowania rywali, czy też sama śmiałość, z jaką wtrąciliśmy się w sprawy miejscowych? Tego zapewne nigdy się nie dowiemy…"
 gdp_merchant_trade_opportunity.0043.a: "Pff, ich towary i tak były do niczego…"
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|U] w miejscu znanym jako [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] tętnią żądzą zysku wyczuwalną w każdym spojrzeniu i geście. To miejsce samo woła o nasze pieniądze, przyciągając przyszłych klientów, którzy nie potrafią oprzeć się jego obietnicom.\n\nZnacznie łatwiej znaleźć tych, którzy chętnie wezmą nasze [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')], niż tych, którzy gotowi są je oddać, lecz musimy zachować rozwagę. Zarzucamy przynęty z myślą o grubych rybach z rynku o nazwie [local_market.GetShortName], a udany połów wymaga sprytu i cierpliwości."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0052.desc: "Rozpuściwszy w miejscu o nazwie [target_title.GetBaseNameNoTierNoTooltip] wieści o naszych usługach pożyczkowych, nie musieliśmy długo czekać, by otrzymać zaskakująco pokorne zaproszenie. Jego nadawcą jest [debtor.GetTitledFirstName] we własnej osobie.\n\nWygląda na to, że ta jakże szanowana osoba potrzebuje pewnej „elastyczności” w kwestii swoich rachunków. A nam, zwykłym kupcom, nie wypada przecież dociekać, skąd biorą się potrzeby osób tak poważanych…"
 gdp_merchant_trade_opportunity.0052.a: "– Wprowadźmy poprawki w księgach… #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip] miejsca o nazwie [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]…#!"
 gdp_merchant_trade_opportunity.0052.b: "– Obawiam się, że tym razem nie będzie to możliwe, wasza czcigodność."
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: porażka"
 gdp_merchant_trade_opportunity.0053.desc: "Choć rozpuściliśmy wieści o naszych usługach pożyczkowych, nie mamy się zbytnio czym pochwalić. Nasze hojne propozycje spotkały się ze zdecydowaną odmową ze strony lokalnych notabli z miejsca znanego jako [target_title.GetBaseNameNoTierNoTooltip].\n\nTrudno powiedzieć, czy źle poprowadziliśmy negocjacje, przeszkodziła nam działalność innych kupców, czy też tutejsi potentaci przeżywają rzadki okres powszechnego dobrobytu."
 gdp_merchant_trade_opportunity.0053.a: "To bez znaczenia. Wrócą z podkulonym ogonem. Zawsze tak jest…"
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: ród [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "[contract_employer.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] mojej osoby, przychodzi z ciekawymi wieściami. [trade_good_type.GetNameNoTooltip] to towar, którego potrzebuje [market_owner.GetName], w związku z czym poszukiwany jest kupiec, który zapewni dużą dostawę tego produktu. \n\n[task_contract_target.GetTitledFirstName] z kompanii [task_contract_target.GetHouse.GetBaseName] chełpliwie i z dumą ogłasza, że z pewnością sfinalizuje tę transakcję. Uważam, że dzięki sprytowi i przebiegłości moglibyśmy przebić tę ofertę i pokazać pyszałkom, gdzie ich miejsce."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0062.desc: "Nasze subtelne próby przejęcia kontroli nad handlem w miejscu znanym jako [target_title.GetName] przyniosły oczekiwany skutek. Podczas licytacji [target_title.GetHolder.GetTitledFirstName] może jedynie patrzeć z niedowierzaniem i przerażeniem, jak zwycięstwo wymyka [target_title.GetHolder.Custom('PL_mu_jej')] się z rąk i to my jesteśmy górą.\n\nReputacja miejsca o nazwie [target_title.GetNameNoTooltip] została poważnie nadszarpnięta, a powstałą lukę we władzy warto byłoby wykorzystać na naszą korzyść."
 gdp_merchant_trade_opportunity.0062.a: "Wszystko zgodnie z planem…"
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: porażka"
 gdp_merchant_trade_opportunity.0063.desc: "Mimo naszych podstępów [target_title.GetHolder.GetTitledFirstName] znów nas pokonuje. Ze wstydem musimy przyznać się do druzgocącej porażki w starciu o miejsce znane jako [target_title.GetNameNoTier].\n\nTrudno powiedzieć, gdzie popełniliśmy błąd – czy to pycha wzięła górę, czy może zabrakło nam finansowej ogłady? Na razie wiemy tylko tyle, że wychodzimy z tego starcia ze zwieszonymi głowami i pustymi sakiewkami."
 gdp_merchant_trade_opportunity.0063.a: "Następnym razem nam się uda…"
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "[contract_employer.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], sprawdza dostawę towaru. To [trade_good_type.Custom('GetTradeGood')]. Dokładnie ogląda [trade_good_type.Custom('GetTradeGoodUnitPlural')] w poszukiwaniu choćby najmniejszej skazy wynikającej z niewłaściwego obchodzenia się z towarem, sprawdzając każde mocowanie.\n\nTowar nie zawsze wykorzystywany jest w pełni – łatwo zmarnować jego potencjał przez zaniedbanie lub niewiedzę. Od najpodlejszego handlarza ulicznego po najznamienitszego hurtownika, każdy może się czegoś nauczyć."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0072.desc: "[destination.Custom('GetRegionalMarketTermGloss')|U] w miejscu znanym jako [destination.GetTitle.GetNameNoTierNoTooltip] tętni życiem. Przemierzając tamtejsze [destination.Custom('GetProvinceAdjective')] stragany oraz zaciszne hale handlowe, zgromadziliśmy mnóstwo ciekawostek, opowieści i wskazówek dotyczących sztuki handlu pewnym towarem. Towar ten to [trade_good_type.Custom('GetTradeGood')].\n\nOd tego, jak przechowywać i transportować [trade_good_type.Custom('GetTradeGoodUnitPlural')], po sezonowy popyt i ocenę jakości – zdobyta wiedza z pewnością przysłuży się naszej działalności handlowej. Zresztą [local_market.GetName|l] również wiele zyska."
 gdp_merchant_trade_opportunity.0072.a: "Kto by pomyślał, że [trade_good_type.Custom('GetTradeGood')] to tyle niuansów?"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: porażka"
 gdp_merchant_trade_opportunity.0073.desc: "[destination.Custom('GetRegionalMarketTermGloss')|U] w miejscu o nazwie [destination.GetTitle.GetNameNoTierNoTooltip] aż roi się od ludzi. Spędziliśmy niezliczone dni i godziny, przedzierając się przez [destination.Custom('GetProvinceAdjective')] stragany i zaciszne hale handlowe, ale wydaje się, że nie jesteśmy ani trochę mądrzejsi w sztuce handlu towarem takim jak [trade_good_type.Custom('GetTradeGood')].\n\nMrukliwi kramarze i lekceważący pośrednicy rzadko odpowiadali na nasze pytania czymś więcej niż pobłażliwą pogardą lub ostrożnym milczeniem, a strzępy wiedzy, którymi się dzielili, były trywialne albo niepotrzebnie zagmatwane. "
 gdp_merchant_trade_opportunity.0073.a: "Phi, nie potrzebujemy ich pomocy!"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "[contract_employer.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], przewraca oczami, gdy utyskujemy na ostatnie wyczyny kompanii o nazwie [contract_target.GetPrimaryTitle.GetDefinitiveName], których doświadcza [market.GetName|l].\n\n[contract_target.GetTitledFirstName] nie może się tak zachowywać. I jeszcze to wsparcie ze strony osoby znanej jako [contract_target.GetSuzerain.GetTitledFirstName]. Jeśli nie chcemy zostać daleko w tyle, musimy coś z tym zrobić…"
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0082.desc: "Nasze niestrudzone wysiłki polegające na podjudzaniu pośredników i rzucaniu oszczerstw pod adresem kompanii o nazwie [target_title.GetDefinitiveName], oraz ta przeklęta koncesja zdają się przynosić owoce. Wielu ludzie dwa razy się zastanowi, zanim uwierzy w to, co mówi [target_title.GetHolder.GetTitledFirstName].\n\nKwestionowana jest nawet autentyczność pieczęci osoby znanej jako [target_title.GetHolder.GetSuzerain.GetTitledFirstName] na dokumentach postaci, którą jest [target_title.GetHolder.GetTitledFirstNameNoTooltip], co z pewnością nie spotka się z entuzjastycznym przyjęciem żadnej ze stron."
 gdp_merchant_trade_opportunity.0082.a: "Niech te papiery [ROOT.Char.GetRite.NegativeAfterLife] pochłonie!"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: porażka"
 gdp_merchant_trade_opportunity.0083.desc: "Nasze niestrudzone zabiegi polegające na budowaniu sieci kontaktów i knuciu przeciw przeklętym agentom kompanii o nazwie [target_title.GetDefinitiveName], spełzły na niczym. Niewielu jest skłonnych choćby rozważyć nasze propozycje, gdy w grę wchodzi koncesja opatrzona pieczęcią osoby tak wysoko postawionej jak [target_title.GetHolder.GetSuzerain.GetTitledFirstName].\n\nReputacja osoby znanej jako [target_title.GetHolder.GetTitledFirstName] pozostaje nieskazitelna jak zawsze, a my jedynie splamiliśmy własne imię, zniżając się do takich podłości…"
 gdp_merchant_trade_opportunity.0083.a: "Ród [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] wciąż doświadcza łaski [target_title.GetHolder.GetRite.FateGodNamePossessive]…"
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip|l]"
 gdp_merchant_trade_opportunity.0091.desc: "Niebo przysłoniły chmury i [destination.Custom('GetRegionalMarketTermGloss')] kryje się w posępnym mroku. [associate.GetFirstName], dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], i ja błąkamy się alejkami miejsca znanego jako [destination.GetBaronyNameExplicitlyNoTooltip], a nędza, sprowadzona kaprysami wojny i głodu, bije po oczach na każdym kroku.\n\nNiepokojąco liczne rzesze żebraków – wdowy, sieroty, kaleki – tłoczą się w zaułkach, a nad opustoszałymi straganami, niczym dodatkowa zasłona chmur, wisi złowieszcza atmosfera."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0092.desc: "Przeczesując okolicę, zdołaliśmy odnaleźć miejscowych kramarzy i rzemieślników, którzy wciąż trzymają się na powierzchni mimo"
 gdp_merchant_trade_opportunity.0092.war: "wojennych grabieży,"
 gdp_merchant_trade_opportunity.0092.disaster: "bliskości nadciągającej katastrofy,"
 gdp_merchant_trade_opportunity.0092.epidemic: "niedawnych wybuchów epidemii chorób,"
 gdp_merchant_trade_opportunity.0092.closing: "a nawet nieco poprawiliśmy stan w ich księgach rachunkowych. Choć to niewiele, każda pomoc się liczy.\n\nZ dnia na dzień [destination.Custom('GetRegionalMarketTermGloss')] w miejscu znanym jako [destination.GetBaronyNameExplicitlyNoTooltip] zdaje się rozbrzmiewać coraz to nowymi głosami, na straganach pojawia się więcej towarów, a karczmy zapełniają się kolejnymi gośćmi."
 gdp_merchant_trade_opportunity.0092.a: "Miejsce znane jako [destination.GetBaronyNameExplicitlyNoTooltip] wkrótce znów rozkwitnie."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: porażka"
 gdp_merchant_trade_opportunity.0093.desc: "Przemierzyliśmy miejsce znane jako [destination.GetBaronyNameExplicitlyNoTooltip] wzdłuż i wszerz, szukając sposobności, by wcisnąć złoto w dłonie tych, którzy mogliby zrobić najwięcej dobrego i przywrócić kupiecką siłę napędową tego regionu, ale nasze wysiłki okazały się w większości daremne.\n\nCi, których spotykamy, to przeważnie zwykli wyzyskiwacze niegodni naszej hojności albo ludzie w takim położeniu, że nie są w stanie uczynić nic dobrego. Trudno zachować choć odrobinę optymizmu wobec takich niepowodzeń, więc pogrążamy się w rozpaczy i frustracji."
 gdp_merchant_trade_opportunity.0093.a: "Nie możemy zrobić nic więcej…"
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "Razem – [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] i ja – stoimy w zachwycie i patrzymy na wielkie i gwarne stragany. To [destination.Custom('GetRegionalMarketTermGloss')] w miejscu znanym jako [destination.GetTitle.GetNameNoTier]. Tutaj przepływ handlu nie jest czymś abstrakcyjnym – czuję go jak [ROOT.Char.Custom('GroundType')] pod stopami.\n\nJak w takim miejscu, pełnym kupców, którzy tak jak my starają się zawierać umowy, moglibyśmy nie znaleźć przewagi lub przychylności?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0102.desc: "Ostatnie tygodnie upłynęły w nieustannym ruchu – codziennie przemierzaliśmy miejsce znane jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] w pogoni za spotkaniami i w poszukiwaniu kontaktów, ale dzięki zręcznej dyplomacji i jeszcze zręczniejszym interesom zgromadziliśmy pokaźny plik umów z miejscowymi pośrednikami i kupcami.\n\nWidać wyraźnie, że nasz trud nie poszedł na marne, a praca tutaj zapewni nam dobrą pozycję w nadchodzącym sezonie."
 gdp_merchant_trade_opportunity.0102.a: "Oby nasze ziarna wydały plon!"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: porażka"
 gdp_merchant_trade_opportunity.0103.desc: "Mimo wszelkich prób przypodobania się miejscowym pośrednikom i kupcom, mimo codziennego przemierzania miejsca znanego jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] w pogoni za spotkaniami i w poszukiwaniu kontaktów, nie jesteśmy w lepszym położeniu niż na początku.\n\nTo z pewnością zwiastuje kłopoty w nadchodzącym sezonie…"
 gdp_merchant_trade_opportunity.0103.a: "Na litość [ROOT.Char.GetRite.WealthGodNamePossessive]…"
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0112.desc: "Pracowaliśmy pilnie, zarzucając sieci w całym mieście o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] i szukając miejsc, gdzie wystarczy wyświadczyć przysługę lub wręczyć łapówkę. W końcu nasze nadzieje potwierdziło kilka korzystnych aukcji i umów, a szlaki są bezpieczne.\n\nMożemy spokojnie odetchnąć, wiedząc, że nasza praca zapewniła stały dopływ towarów – i to na długo."
 gdp_merchant_trade_opportunity.0112.a: "Dobrotliwość [ROOT.Char.GetRite.WealthGodNamePossessive] nam sprzyja!"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: porażka"
 gdp_merchant_trade_opportunity.0113.desc: "Cała nasza wytężona praca – zarzucanie sieci w mieście o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] i szukanie miejsc, gdzie wystarczy wyświadczyć przysługę lub wręczyć łapówkę – spełzła na niczym, przepadła jak kropla deszczu w tym wzburzonym morzu handlu.\n\nJasne jest, że nie zdołamy zapewnić w karawanie miejsca ładunkowego potrzebnego do realizacji naszych planowanych dostaw – i nie będzie to możliwe jeszcze przez dłuższy czas…"
 gdp_merchant_trade_opportunity.0113.a: "Czym jest kupiec bez karawany…"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "Razem – [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] i ja – przechadzamy się po składzie przeładunkowym w mieście o nazwie [destination.GetBaronyNameExplicitly]. To ośrodek sprzedaży i odsprzedaży, gdzie krzyżują się drogi wszelkiej maści kupców, którzy przekazują towary do nieznanych i odległych miejsc.\n\nW takim miejscu, gdzie z rąk do rąk przechodzi tyle towarów, o fortunie kupca przesądzają transakcje na dużą skalę i handel hurtowy…"
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nJakimś cudem wychodzimy z tego gniazda żmij bez szwanku i z pokaźnym plikiem weksli, które dają nam gwarancję konkurencyjnych cen sprzedaży na [trade_good_type.Custom('GetTradeGoodUnitPlural')] towaru o nazwie [trade_good_type.Custom('GetTradeGood')] w mieście znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] w nadchodzącym sezonie!"
 gdp_merchant_trade_opportunity.0122.intro: "Dni zlewają się w jedno pasmo niekończących się negocjacji, przepychanek i namów; mój wzrok biega między trzepoczącymi językami a zgrzytającymi zębami, gdy na placach aukcyjnych wykrzykuje się ceny, a [ROOT.Char.Custom('GroundType')] zaśmiecają walające się porzucone kwity, bazgroły i stracone fortuny."
 gdp_merchant_trade_opportunity.0122.a: "Teraz to kupujący dyktują warunki!"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: porażka"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nWychodzimy z tego gniazda żmij poobijani i wyczerpani, bez gwarantowanych cen sprzedaży towaru o nazwie [trade_good_type.Custom('GetTradeGood')], które chcieliśmy zapewnić, i przelicytowani przez rywali…"
 gdp_merchant_trade_opportunity.0123.a: "Teraz to sprzedający dyktują warunki…"
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nJakimś cudem wychodzimy z tego gniazda żmij bez szwanku i z pokaźnym plikiem weksli, które dają nam gwarancję konkurencyjnych cen zakupu na [trade_good_type.Custom('GetTradeGoodUnitPlural')] towaru o nazwie [trade_good_type.Custom('GetTradeGood')] w mieście znanym jako [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] w nadchodzącym sezonie!"
 gdp_merchant_trade_opportunity.0132.a: "Teraz to sprzedający dyktują warunki!"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: porażka"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nWychodzimy z tego gniazda żmij poobijani i wyczerpani, bez gwarantowanych cen zakupu towaru o nazwie [trade_good_type.Custom('GetTradeGood')], które chcieliśmy zapewnić, i przelicytowani przez rywali…"
 gdp_merchant_trade_opportunity.0133.a: "Teraz to kupujący dyktują warunki…"
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "Być może to sprawiedliwe, że [task_contract_target.GetTitledFirstName] pobiera część zysków ze sprzedaży na rynku o nazwie [local_market.GetName|l] – jako stróż pokoju i obrońca prawa.\n\nNa negocjacje jest jednak #EMP zawsze#! miejsce. Wystarczy, że pokażemy [task_contract_target.Custom('PL_mu_jej')], ile są warte nasze szlaki, i wyjaśnimy, jakim ciężarem obarcza nasze biedne grzbiety…"
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0142.desc: "Spędziliśmy długie dni na namawianiu, schlebianiu i nakłanianiu w komnatach, w których urzęduje [task_contract_target.GetTitledFirstName], a policzki wciąż bolą nas od uśmiechania się, ale nasze wysiłki nie poszły na marne.\n\nUzyskaliśmy obniżoną stawkę opłat, co zapewni nam lepsze marże na długi czas."
 gdp_merchant_trade_opportunity.0142.a: "Taki jest koszt dobrych interesów."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: porażka"
 gdp_merchant_trade_opportunity.0143.desc: "Po tylu długich dniach namawiania, schlebiania i nakłaniania w komnatach, w których urzęduje [target.GetTitledFirstName], z policzkami obolałymi od uśmiechu i nogami osłabłymi od stania, musimy wrócić z pustymi rękami…\n\nDziś, gdy czekaliśmy na audiencję, strażnicy sztywno wyjaśnili, że niestety [target.GetTitleAsNameNoTooltip] nie może nam pomóc, bo ma pilne sprawy na głowie…"
 gdp_merchant_trade_opportunity.0143.a: "A przecież wszystko wskazywało na to, że łatwo pójdzie…"
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "Faktorzy i poborcy z rynku o nazwie [local_market.GetName|l] paradują w pełnej chwale. Te szakale drwią z nas, a u ich boków pobrzękują sakwy wypełnione przez [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')], pełne uczciwie zarobionego złota wytrząśniętego z kieszeni porządnych kupców – takich jak [associate.GetFirstName] i ja…\n\nOpłaty, jakie nakłada [owner.GetTitledFirstName], to zmora tutejszych interesów, a [owner.Custom('PL_jego_jej')] chciwość zmusiła nas do nieuczciwych praktyk."
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: powodzenie"
 gdp_merchant_trade_opportunity.0152.desc: "Po ciężkiej pracy nawiązaliśmy dobre kontakty wśród miejscowych łotrów i zapewniliśmy sobie niezawodne #EMP alternatywne#! trasy dla towarów wywożonych z rynku o nazwie [trade_market.GetName|l].\n\nSkrzynia po skrzyni, z każdym ładunkiem, który przemknie pod łatwowiernymi nosami strażników, oszczędności szybko się zsumują…"
 gdp_merchant_trade_opportunity.0152.a: "To #EMP nasze#! pieniądze i to my je zatrzymamy."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: porażka"
 gdp_merchant_trade_opportunity.0153.desc: "Nasze próby zorganizowania siatki przemytniczej na rynku o nazwie [trade_market.GetName|l] na każdym kroku udaremniały: niekompetencja naszych agentów, czujność miejscowych władz i nieuczciwość tutejszych łotrów…\n\nNie mamy wyboru – musimy nadal płacić, a cała nasza ciężka praca tylko zszargała nam reputację uczciwych pośredników."
 gdp_merchant_trade_opportunity.0153.a: "Trzeba było po prostu uiścić opłaty…"
 gdp_merchant_trade_opportunity.1001.t: "Sprzyjające warunki"
 gdp_merchant_trade_opportunity.1001.desc: "Nasi współpracownicy z miejsca znanego jako [task_contract_location.GetTitle.GetDeJureLiege.GetNameNoTooltip] zaczęli wykazywać niecodzienną powściągliwość w kontaktach i szybko stało się jasne, że źródłem tej sytuacji jest miejscowy władca, [local_ruler.GetTitledFirstName].\n\nI rzeczywiście – wkrótce [local_ruler.GetWomanMan] przekazuje nam wiadomość. Domaga się „#EMP próbki potencjalnych zysków#!”, które można uzyskać na [local_ruler.GetHerHis] ziemiach…"
 gdp_merchant_trade_opportunity.1001.a: "#weak *wzdycha*#! Dajcie [local_ruler.Custom('PL_mu_jej')] [local_ruler.GetHerHis] [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]…"
 gdp_merchant_trade_opportunity.1001.b: "Z pewnością ktoś o tak #EMP wybitnym#! umyśle zrozumie naszą sytuację."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip] jest pod wrażeniem"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip] irytuje się"
 gdp_merchant_trade_opportunity.1001.c: "– Wiesz, miejsce znane jako [other_merchant.GetPrimaryTitle.GetNameNoTooltip] #EMP naprawdę#! pozwala sobie na zbyt wiele."
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] daje się nabrać"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] uznaje to za zniewagę"
 gdp_merchant_trade_opportunity.1001.d: "Pff, jakoś sobie poradzimy."
 gdp_merchant_trade_opportunity.1011.t: "Wzajemna szczodrość"
 gdp_merchant_trade_opportunity.1011.desc: "Nasze działania na rynku o nazwie [local_market.GetShortName] najwyraźniej zwróciły uwagę miejscowego władcy, który wzywa kompanię na prywatną audiencję.\n\n[local_ruler.GetTitledFirstName] uśmiecha się, gdy przed [local_ruler.Custom('PL_nim_nia')] staję.\n\n– Handel przynosi spore korzyści, z których czerpie lud, szlachta i [local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Podziel się ze mną swymi troskami, a uczynię, co w mej mocy."
 gdp_merchant_trade_opportunity.1011.a: "#weak *ekhem*#! – Na szlakach jest #EMP bardzo#! ciężko, wasza czcigodność…"
 gdp_merchant_trade_opportunity.1011.b: "– Mam kilka pomysłów, dzięki którym [task_contract_location.Custom('GetRegionalMarketTerm')] tutaj może zyskać."
 gdp_merchant_trade_opportunity.1011.b.good: "Twoja rada jest sensowna"
 gdp_merchant_trade_opportunity.1011.b.bad: "Twoja rada jest nic nie warta"
 gdp_merchant_trade_opportunity.1011.c: "– Miejsce znane jako [other_merchant.GetPrimaryTitle.GetNameNoTooltip] bardzo wszystko utrudnia."
 gdp_merchant_trade_opportunity.1011.c.fallback: "– Konkurencja bardzo wszystko utrudnia."
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] cię popiera"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] popiera ród [other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "Konkurs popularności w oparciu o poziom [diplomacy_i|E] [Concept('diplomacy', 'dyplomacji')|E] oraz [opinion_i|E] [Concept('opinion', 'opinii')|E]"
 gdp_merchant_trade_opportunity.1011.d: "– [local_ruler.GetTitleAsNameNoTooltip], niech opatrzność błogosławi tobie i twym łaskawym rządom."
 gdp_merchant_trade_opportunity.1021.t: "Wspólny przeciwnik"
 gdp_merchant_trade_opportunity.1021.desc: "Bez reszty pochłaniają mnie kłopoty, jakie sprawiają nam te łachudry, których siedzibą jest [target.GetPrimaryTitle.GetName], dlatego nie zauważam nawet, gdy niespodziewanie pojawia się [other_merchant.GetTitledFirstName]. [other_merchant.Custom('PL_jego_jej')|U] [other_merchant.GetPrimaryTitle.GetTierAsName] to [other_merchant.GetPrimaryTitle.GetNameNoTier]. To kolejny gracz, który wkracza na [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')] na rynku znanym jako [local_market.GetShortName].\n\n– [ROOT.Char.GetTitledFirstNameNoTooltip], dobrze cię widzieć – rzuca. – Podobno [target.GetTitledFirstName], cwaniak z rodu [target.GetHouse.GetNameNoTooltip], sprawia ci problemy. Może ja i ty połączymy siły?"
 gdp_merchant_trade_opportunity.1021.a: "– Doskonale. Mam już plan…"
 gdp_merchant_trade_opportunity.1021.b: "– Skąd mam wiedzieć, że mogę ci ufać?"
 gdp_merchant_trade_opportunity.1021.b.good: "Dochodzicie do porozumienia"
 gdp_merchant_trade_opportunity.1021.b.bad: "Dochodzi między wami do rękoczynów"
 gdp_merchant_trade_opportunity.1021.c: "– Wspólnie możemy utrudnić im życie."
 gdp_merchant_trade_opportunity.1021.d: "– Nie ma mowy! Wy z rodu [other_merchant.GetHouse.GetNameNoTooltip] jesteście jeszcze gorsi!"
 gdp_merchant_trade_opportunity.1031.t: "Tajemnica handlowa"
 gdp_merchant_trade_opportunity.1031.desc: "Gdy przeglądam dokumenty kompanii w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip], kilka kartek wysuwa się i opada na podłogę. Schylam się, by je podnieść, a gdy się odwracam, z ponurą miną staje przede mną [associate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))].\n\nPrzebiegam wzrokiem dokumenty i brwi same mi się unoszą, gdy powód [associate.GetHerHis] niepokoju staje się oczywisty. Okazuje się, że [associate.GetFirstNameNoTooltip] ukrywa informacje kluczowe dla naszych interesów! I to wszystko z czystej złośliwości?"
 gdp_merchant_trade_opportunity.1031.a: "– [associate.GetFirstNameNoTooltip], cholera jasna! Po czyjej jesteś stronie?"
 gdp_merchant_trade_opportunity.1031.b: "Śmiało. Mów, co cię trapi."
 gdp_merchant_trade_opportunity.1031.c: "– #EMP WYNOCHA!#! Ta kompania już cię nie potrzebuje!"
 gdp_merchant_trade_opportunity.1041.t: "Praca zespołowa"
 gdp_merchant_trade_opportunity.1041.desc: "Nastroje w kompanii są wyśmienite, a w rozmowach wszyscy nieustannie wracają do ostatnich sukcesów w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip], za które, jak na ironię, odpowiada [associate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))].\n\nWszędzie słychać pochwały pod [associate.GetHerHis] adresem, w których urasta do rangi niemal geniusza handlu. W rzeczywistości jednak każde przedsięwzięcie to wynik ciężkiej pracy wielu rąk i długotrwałych rozmów w całej organizacji rodu [ROOT.Char.GetHouse.GetNameNoTooltip]."
 gdp_merchant_trade_opportunity.1041.a: "[associate.GetFirstNameNoTooltip], doskonała robota!"
 gdp_merchant_trade_opportunity.1041.b: "Najwyraźniej nie wymagaliśmy od ciebie wystarczająco dużo."
 gdp_merchant_trade_opportunity.1041.c: "Twoje dokonania budzą podziw. Stanowisz przykład dla nas wszystkich!"
 gdp_merchant_trade_opportunity.1051.t: "W poszukiwaniu ugody"
 gdp_merchant_trade_opportunity.1051.desc: "Gdy przechadzam się po okolicy, gdzie można znaleźć [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')], niespodziewanie staje przede mną nasz konkurent – [target.GetTitledFirstName], którego [target.GetPrimaryTitle.GetTierAsName] to [target.GetPrimaryTitle.GetNameNoTier]! Muszę przyznać, że [target.GetHerHis] nagła uprzejmość nieco mnie zaskakuje.\n\n– Posłuchaj – wzdycha. – Powiem wprost. Nasze interesy tutaj ze sobą kolidują i nic dobrego z tego nie wyniknie. Odpuść, proszę."
 gdp_merchant_trade_opportunity.1051.desc.gold: "W zamian za fatygę zapłacę ci gotówką."
 gdp_merchant_trade_opportunity.1051.desc.luxury: "W zamian dam ci wskazówkę dotyczącą wspaniałej okazji w odległej krainie."
 gdp_merchant_trade_opportunity.1051.a: "– Masz rację. Zgoda, niech tak będzie."
 gdp_merchant_trade_opportunity.1051.b: "– Coś jest na rzeczy… Negocjujmy."
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip] zgadza się"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip] odmawia"
 trade_opportunity_accept_feast_tt: "[target.GetShortUINameNotMe] zorganizuje na twoją cześć [activity|El], którą jest [GetActivityType('activity_feast').GetName|l]"
 gdp_merchant_trade_opportunity.1052.t: "Uczta unieważniona"
 trade_opportunity_gain_luxury_contract_tt: "Otrzymasz [luxury_contract|El]"
 gdp_merchant_trade_opportunity.1051.d: "– Ha, chyba interes #EMP naprawdę#! kiepsko ci idzie! Nie ma mowy."
 gdp_merchant_trade_opportunity.1061.t: "Na skraju wytrzymałości"
 gdp_merchant_trade_opportunity.1061.desc: "[associate.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], narzeka, że przez skupianie się na pilnowaniu interesów w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip], [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')] i ich codzienne funkcjonowanie zaczynają nam się wymykać spod kontroli.\n\n– Z czegoś trzeba zrezygnować. Doba jest za krótka, a w kompanii brakuje rąk, by utrzymać tu wszystko w ryzach, jeśli to ma dalej działać."
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetTierAsName] o nazwie [ROOT.Char.GetPrimaryTitle.GetNameNoTier] nie cofa się przed żadnym wyzwaniem!"
 gdp_merchant_trade_opportunity.1061.a.good: "Wszystko idzie zgodnie z planem"
 gdp_merchant_trade_opportunity.1061.a.bad: "Nazbyt się forsujesz"
 gdp_merchant_trade_opportunity.1061.b: "Dopóki ja tu rządzę, zyski nie spadną."
 gdp_merchant_trade_opportunity.1061.already_tt: "Co już zyskano: [stress|El] partnera znanego jako [associate.GetShortUINameNotMe] wzrasta o #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#!, [scheme|El] zyskuje #P 1#! pkt [scheme_opportunity_i|E] [Concept('scheme_opportunity_opportunity', 'przewagi')|E]"
 gdp_merchant_trade_opportunity.1071.t: "Wąskie gardło"
 gdp_merchant_trade_opportunity.1071.desc: "[associate.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], krąży tam i z powrotem bez końca, a [associate.GetHerHis] cierpliwość dodatkowo nadwątlają leniwie bzyczące muchy.\n\n– Argh! – warczy. – [ROOT.Char.GetTitleAsNameNoTooltip], spójrz tylko, twoje działania w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip] pochłaniają wszystkie moje zasoby!\n\nPrzyglądam się uważnie kwitom i księgom rachunkowym. Trudno odmówić [associate.Custom('PL_mu_jej')] racji. [associate.GetFirstNameNoTooltip] wzdycha ciężko:\n\n– Będziemy musieli pójść na jakiś kompromis. Inaczej nasze biuro tutaj zacznie się rozpadać przez tę presję…"
 gdp_merchant_trade_opportunity.1071.a: "Mamy jeden cel."
 gdp_merchant_trade_opportunity.1071.d: "Zostaw to mnie i skup się na swoich zadaniach."
 gdp_merchant_trade_opportunity.1081.t: "W dobrych rękach"
 gdp_merchant_trade_opportunity.1081.desc: "[associate.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], zajmuje się większością spraw związanych z naszymi obecnymi interesami w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip] – i to widać! Wykazuje się wyraźną dbałością o szczegóły oraz innymi przymiotami wykwalifikowanego handlarza.\n\nOdkąd rozpoczęliśmy tu naszą działalność, prawie w ogóle nie muszę zaglądać do ksiąg ani sprawdzać wykonania poleceń."
 gdp_merchant_trade_opportunity.1081.a: "[associate.GetFirstNameNoTooltip], tak trzymaj!"
 gdp_merchant_trade_opportunity.1081.b: "Taką inicjatywę należy docenić."
 gdp_merchant_trade_opportunity.1081.c: "Cała kompania powinna brać z tego przykład!"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip] daje przykład"
 gdp_merchant_trade_opportunity.1081.c.trigger: "Wartość umiejętności [stewardship_i|E] każdego innego [Concept('associate', 'partnera')|E] jest mniejsza niż [EmptyScope.ScriptValue('medium_skill_rating')|V0]"
 gdp_merchant_trade_opportunity.1081.c.tt: "Wartość umiejętności [Concept('stewardship', 'zarządzania')|E] kolejnego [associate_possessive|El] zwiększa się o [stewardship_i|E] #P 1#!"
 gdp_merchant_trade_opportunity.1081.d: "Członkowie rodu [ROOT.Char.GetHouse.GetNameNoTooltip] to po prostu najlepsi ludzie."
 gdp_merchant_trade_opportunity.1091.t: "Skromny partner"
 gdp_merchant_trade_opportunity.1091.desc: "[associate.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], przejmuje nadzór nad naszymi obecnymi interesami w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip], choć teraz zaczynam żałować, że do tego doszło…\n\nKażdego dnia odkrywam jakąś niedbale podliczoną kwotę albo muszę wysłuchiwać skarg kontrahentów, którzy bezsensownie czekają na wiadomość. Tak się nie da się prowadzić działalności!"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], przejrzyjmy razem księgi."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip] dowiaduje się czegoś nowego"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip] to beznadziejny przypadek"
 gdp_merchant_trade_opportunity.1091.c: "Kompania będzie musiała wyrównać te braki."
 gdp_merchant_trade_opportunity.1091.d: "[associate.GetFirstNameNoTooltip] chyba stara się, jak może."
 gdp_merchant_trade_opportunity.1101.t: "Kapitał zalążkowy"
 gdp_merchant_trade_opportunity.1101.desc: "Pożyczki mogą być dobrym przedsięwzięciem dla tych, którzy mają nadmiarowe [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] i cierpliwość, by przeczekać. Tak się składa, że ktoś chętny do inwestycji poprosił o spotkanie w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nWita mnie [investor.GetTitledFirstName],"
 gdp_merchant_trade_opportunity.1101.ruler: "lokalny władca miejsca znanego jako [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.1101.courtier: "dworzanin jakiegoś miejscowego szlachcica."
 gdp_merchant_trade_opportunity.1101.adventurer: "człowiek światowy, otoczony gronem zwolenników."
 gdp_merchant_trade_opportunity.1101.fallback: "[investor.GetWomanMan] bez żadnego doświadczenia."
 gdp_merchant_trade_opportunity.1101.end: "– Niech [ROOT.Char.GetTitledFirstNameNoTooltip] przyjmie moje pozdrowienia! – Uśmiecha się z zapałem. – Chętnie zostanę sponsorem, niech skorzysta na tym [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. A czego oczekuję w zamian? Cóż, nie martwmy się tym teraz."
 gdp_merchant_trade_opportunity.1101.a: "[investor.GetFirstNameNoTooltip], możesz na nas liczyć."
 gdp_merchant_trade_opportunity.1101.c: "Jeszcze odrobina, a zajdziemy daleko. Daję słowo."
 gdp_merchant_trade_opportunity.1101.d: "Miło to słyszeć, lecz w tej chwili musimy zachować umiar."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUINameNotMe] wezwie do zwrotu [gold_i|E] [interest|0V] (#M 20% odsetek#!) za #V 5#! lat"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "Nadszedł wreszcie czas, by zebrać owoce mojej inwestycji w Twoją renomowaną kompanię handlową.\n\nZ niecierpliwością oczekuję na moje [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]."
 gdp_merchant_trade_opportunity.1102.a: "Doskonale. Niechaj te fundusze służą ci należycie."
 gdp_merchant_trade_opportunity.1102.b: "Ach, [investor.GetFirstNameNoTooltip], niech spojrzę. To był trudny okres…"
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip] przyjmuje twoją wymówkę"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip] wyczuwa podstęp"
 gdp_merchant_trade_opportunity.1102.d: "Nie masz u nas żadnych inwestycji i to koniec."
 gdp_merchant_trade_opportunity.9000.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] i pilne sprawy"
 gdp_merchant_trade_opportunity.9000.desc: "Skoro ta sprawa została już załatwiona, pozostają jeszcze inne kwestie, które wymagają naszej uwagi tutaj w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l].\n\nCzy powinniśmy najpierw uporządkować sprawy na ziemiach o nazwie [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], zanim wyruszymy w drogę powrotną do celu znanego jako [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]?"
 gdp_merchant_trade_opportunity.9000.a: "Trzeba się temu przyjrzeć."
 gdp_merchant_trade_opportunity.9000.b: "Zajmijmy się tym."
 gdp_merchant_trade_opportunity.9000.c: "Zajmę się tym."
 gdp_merchant_trade_opportunity.9000.d: "Nie. [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] – to tam jesteśmy potrzebni."
 gdp_merchant_trade_opportunity.9000.accept_tt: "Zgadzasz się i rozpoczynasz realizację [Concept('trade_opportunity', 'okazji handlowej')|E] [Concept('trade_opportunity_tier_tier', 'poziomu')|E] [THIS.TaskContract.GetTaskContractTierValue|V], którą zapewnia [THIS.TaskContract.GetEmployer.GetUINameNotMe]. Jej przedmiot to kontrakt „[THIS.TaskContract.GetType.GetName|V]” w miejscu znanym jako [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.t: "Okazja handlowa: „[task_contract.GetType.GetName]”"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "Ważne sprawy kompanii czekają w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.intro: "Ważne sprawy kompanii czekają tutaj w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.desc: "a moje obowiązki muszą zostać powierzone partnerom do czasu mojego powrotu.\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip] [partner.GetFirstName] może sprawować pieczę nad tą sprawą, podczas gdy ja zajmę się innymi."
 gdp_merchant_trade_opportunity.9010.partner_busy: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip] [partner.GetFirstName] obecnie nie może się tym zająć. Może lepiej będzie, jak zrobię to osobiście…"
 gdp_merchant_trade_opportunity.9010.candidate: "Chyba muszę zająć się tym osobiście, o ile nie znajdę kogoś, komu można powierzyć tak ważną kwestię."
 gdp_merchant_trade_opportunity.9010.no_partner: "Nie znam nikogo, komu można powierzyć tak ważną kwestię, więc muszę zająć się tym osobiście."
 gdp_merchant_trade_opportunity.9010.a: "Nie ma czasu do stracenia."
 gdp_merchant_trade_opportunity.9010.c: "Tak, [partner.GetFirstNameNoTooltip] może się tym zająć."
 gdp_merchant_trade_opportunity.9010.c.no_partner: "Mój wspólnik się tym zajmie."
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUINameNotMe] zajmuje się już tą [Concept('trade_opportunity', 'okazją handlową')|E]"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "Twój wspólnik zajmuje się już inną [Concept('trade_opportunity', 'okazją handlową')|E]"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "Ta osoba zostaje przydzielona do twojej [Concept('trade_opportunity', 'okazji handlowej')|E] „[task_contract.GetType.GetName|V]”"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M Ta osoba będzie niedostępna aż do wypełnienia [Concept('task_contract', 'kontraktu')|E]#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M Szansa powodzenia zależy od [THIS.Char.Custom('PL_jego_jej')] [Concept('aptitude', 'kompetencji')|E] ([THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )])#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon! #X Kontrakt się nie powiedzie, jeśli ta osoba nie będzie już zajmować funkcji, którą jest [GetCourtPositionType('partner_court_position').GetName|l]#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "[THIS.Char.GetShortUINameNotMe] otrzymuje przypisanie do twojej [Concept('trade_opportunity', 'okazji handlowej')|E] „[task_contract.GetType.GetName|V]” w miejscu znanym jako [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.d: "Może [candidate.GetFirstNameNoTooltip] podoła temu zadaniu."
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "Może ktoś podoła temu zadaniu."
 gdp_merchant_trade_opportunity.9010.d.tt: "Masz [Concept('associates', 'partnerów')|E], którzy:\n$EFFECT_LIST_BULLET$Nie są [Concept('traders', 'handlarzami')|E]\n$EFFECT_LIST_BULLET$Mogą zajmować funkcję, którą jest [GetCourtPositionType('partner_court_position').GetName|l]"
 gdp_merchant_trade_opportunity.9010.e: "Nieważne, inne okazje biznesowe czekają."
 gdp_merchant_trade_opportunity.9010.e.tt: "[task_contract|E] zostanie unieważniony"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "Natychmiast rozpoczynasz [traveling|El] do miejsca o nazwie [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.tt.start: "Natychmiast rozpoczynasz [task_contract|El]"
 gdp_merchant_trade_opportunity.9020.t: "Okazja handlowa: „[task_contract.GetType.GetName]”"
 gdp_merchant_trade_opportunity.9020.intro: "[GetCourtPositionType('partner_court_position').GetNameNoTooltip] [partner.GetFirstName] nareszcie powraca z miejsca znanego jako [task_contract_location.GetBaronyNameExplicitly] z wieściami o swoich postępach.\n\n"
 gdp_merchant_trade_opportunity.9020.success: "Ochoczo wyjaśnia, jak udało się [partner.Custom('PL_mu_jej')] zgrabnie załatwić tę sprawę z korzyścią dla kompanii i dla [partner.Custom('PL_jego_jej')] własnych interesów, mimo wielu trudności…"
 gdp_merchant_trade_opportunity.9020.failure: "Nieco niechętnie wyjaśnia, jak trudne okazało się [partner.Custom('PL_jego_jej')] zadanie i że mimo [partner.Custom('PL_jego_jej')] wysiłków kompania ucierpiała…"
 gdp_merchant_trade_opportunity.9020.a.success: "Doskonale."
 gdp_merchant_trade_opportunity.9020.a.failure: "Trzeba się było tym zająć osobiście…"
 gdp_merchant_trade_opportunity.9050.t: "Utracona szansa"
 gdp_merchant_trade_opportunity.9050.desc_opening: "Obiecująca perspektywa została utracona.\n\nOkazja handlowa w miejscu znanym jako [trade_destination.GetBaronyNameExplicitlyNoTooltip], które było głównym celem naszej podróży, przepadła."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\nPozostaje pytanie, czy jest jakikolwiek sens w dalszym podążaniu tą złowróżbną ścieżką."
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "Szlak handlowy, od którego była zależna, już nie istnieje."
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "W miejscu o nazwie [trade_destination.GetBaronyNameExplicitlyNoTooltip] nie funkcjonuje już [trade_opportunity_route.GetName]."
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "Na szlaku o nazwie [trade_opportunity_route.GetName] nie ma już handlarza, od którego zależy ta okazja."
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "Tak się złożyło, że niepokoje na szlaku o nazwie [trade_opportunity_route.GetName] ustały."
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "Skoro nie nazywamy już samych siebie rzemieślnikami, byłoby niestosowne prowadzić działalność w takim charakterze."
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "Skoro nie nazywamy już samych siebie wierzycielami, byłoby niestosowne prowadzić działalność w takim charakterze."
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "Z tego, co mówią przejeżdżający handlarze, wynika, że nasza konkurencyjna kompania zniknęła."
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "Wygląda na to, że skład przeładunkowy w miejscu docelowym nie jest już dostępny."
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "W obecnej sytuacji nie uiszczamy już opłat drogowych, którymi mieliśmy zarządzać."
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "Jak to często bywa w zmiennych warunkach, Jedwabny Szlak nie jest już taki sam, jak wtedy, gdy rozpoczynaliśmy naszą podróż – a wraz z tą zmianą tracimy okazję, by wpływać na jego przebieg."
 gdp_merchant_trade_opportunity.9050.reason_unknown: "Na razie nie jest jasne, co uległo zmianie."
 gdp_merchant_trade_opportunity.9050.a: "Nie mamy tu już nic do roboty."
 gdp_merchant_trade_opportunity.9050.b: "Zobaczmy, co ma do zaoferowania miejsce o nazwie [trade_destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.9050.b.tt: "Kontynuuj podróż i #weak zwiedź miejsce znane jako [trade_destination.GetBaronyNameExplicitly]#! po przybyciu"
 gdp_merchant_trade_opportunity.9050.toast: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] – okazja handlowa w tym miejscu została utracona"
 gdp_merchant_trade_opportunity.9050.toast_route_destroyed: "Szlak handlowy do miejsca znanego jako [trade_destination.GetBaronyNameExplicitlyNoTooltip] został zniszczony"
 gdp_merchant_trade_opportunity.9050.toast_desc_route_destroyed: "[trade_route|E] związany z tą [Concept('trade_opportunity', 'okazją handlową')|E] już nie istnieje"
 gdp_merchant_trade_opportunity.9050.toast_desc_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] – to miejsce nie jest już [Concept('market', 'rynkiem')|E] na szlaku o nazwie [trade_opportunity_route.GetName]"
 gdp_merchant_trade_opportunity.9050.toast_desc_trader_changed: "[trade_opportunity_route.GetName] stracił swojego [Concept('trader', 'handlarza')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_upheaval_ended: "[trade_opportunity_route.GetName] nie prowadzi już przez [market|El] doświadczający wstrząsów"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_artisan: "Twoja [company|El] nie ma już [Concept('company_purpose', 'celu kompanii')|E] „[GetLaw('company_purpose_artisan').GetName]”"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_creditor: "Twoja [company|El] nie ma już [Concept('company_purpose', 'celu kompanii')|E] „[GetLaw('company_purpose_creditor').GetName]”"
 gdp_merchant_trade_opportunity.9050.toast_desc_competitor_gone: "Konkurencyjna [merchant_family|El] nie przewodzi już [Concept('company', 'kompanii')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_charter_gone: "Twój konkurent nie posiada już [Concept('charter', 'koncesji')|E] od swojego [Concept('merchant_patron', 'patrona')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_entrepot_gone: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] – w tym miejscu nie funkcjonuje już [entrepot_district|El]"
 gdp_merchant_trade_opportunity.9050.toast_desc_tolls_ended: "Nie uiszczasz już [Concept('tolls', 'opłat')|E] w miejscu o nazwie [trade_destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9050.toast_desc_silk_road: "Nie jesteś już uczestnikiem [Concept('silk_road', 'Szlaku Jedwabnego')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_imprisoned: "Zostajesz osobą [Concept('imprisoned', 'więzioną')|E]"
