l_polish:
 guelphs_ghibellines_prefix: "Gwelfowie i gibelini:"
 gdp_guelph_ghibelline.0500.t: "Gwelfowie i gibelini"
 gdp_guelph_ghibelline.0500.intro.all: "Podejrzliwe spojrzenie, lekceważące prychnięcie – konflikt, który toczą [pope_scope.GetTitledFirstName] i [ghibelline_leader.GetTitledFirstName], doprowadził do coraz głębszych podziałów w niegdyś tak zżytych społecznościach północnych Włoch.\n\nCi, którzy dla celów imperializmu i ochrony wspierają gibelinów, którym przewodzi [ghibelline_leader.GetTitleAsNameNoTooltip], stają naprzeciw zwolenników większej niezależności wspierających gwelfów po stronie papiestwa."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "Podejrzliwe spojrzenie, lekceważące prychnięcie – ten niedorzeczny konflikt, który toczą [ghibelline_leader.GetTitleAsName] i moi oddani urzędnicy, doprowadził do coraz głębszych podziałów w niegdyś tak zżytych społecznościach północnych Włoch.\n\nCi, którzy dla własnego bezpieczeństwa i ochrony wspierają imperialistycznych gibelinów, stają naprzeciw moich bogobojnych gwelfów, którzy w obliczu tego tyrana jedynie bronią własnej suwerenności.\n\nRazem sprawimy, że [ghibelline_leader.GetTitleAsNameNoTooltip] przejrzy na oczy. Moja [ROOT.Char.Custom('GetHighestSkillAdjective')] może się tu przydać."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "Podejrzliwe spojrzenie, lekceważące prychnięcie – ten niedorzeczny konflikt między głupcami z kręgów papieskich a mną doprowadził rzekomo do coraz głębszych podziałów w niegdyś tak zżytych społecznościach północnych Włoch.\n\nCi, którzy dla własnego bezpieczeństwa i ochrony wspierają #EMP moich#! gibelinów, stają naprzeciw tych, którzy – popierając naiwnych gwelfów sprzyjających papiestwu – dążą do niepewnej sytuacji i kruchej niezależności.\n\nPodobnie jak [ghibelline_leader.GetTitleAsNameNoTooltip], zaczynam mieć dość tych wtrącających się w sprawy świeckie stronników papieża. Zbyt długo już podważali mój autorytet; teraz muszą się podporządkować – tak czy inaczej…"
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nPobłogosław nas, aby nasz sumienny przywódca, [guelph_leader.GetFirstNameNoTooltip], stał się naszym głosem i podjął walkę przeciwko naszemu imperialistycznemu ciemiężycielowi. A ja odegram w tym swoją rolę."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nRozumiem, że [ghibelline_leader.GetTitleAsNameNoTooltip] jest jedyną osobą, która prawdziwie broni naszego ludu i naszych państw przeciwko tym, którzy chcą wyrządzić nam krzywdę. Jestem w związku z tym w stanie w pełni wesprzeć [ghibelline_leader.Custom('PL_jego_jej')] gibelinów."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nNie dane było mi się jeszcze opowiedzieć po żadnej ze stron, więc muszę uważnie rozważyć stanowiska zwaśnionych frakcji, aby móc działać w najlepiej pojętym interesie rodu [ROOT.Char.GetHouse.GetBaseName]."
 gdp_guelph_ghibelline.0500.a: "Naprzód!"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "Dotarły do mnie wieści, że niestrudzenie wspierasz i wzmacniasz pozycję, którą [ROOT.Char.Custom('GetGuelphsGhibellines')|l] mają w tym uciążliwym konflikcie.\n\nMasz wobec tego moją dozgonną wdzięczność."
 gdp_guelph_ghibelline.1000.a: "Serdecznie dziękuję."
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "Nie zamierzam w najbliższym czasie dołączać do stronnictwa tak zrujnowanego jak [actor.Custom('GetGuelphsGhibellines')|l]."
 gdp_guelph_ghibelline.5000.a: "To bardzo nierozsądne."
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUINameNotMe] przez kilka lat nie będzie mieć możliwości, by zażądać od postaci znanej jako [recipient.GetShortUINameNotMe] dołączenia do stronnictwa, którym są [actor.Custom('GetGuelphsGhibellines')|l]"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ konkordat wormacki"
 gdp_guelph_ghibelline.6500.desc: "Ten konflikt trwa już zbyt długo. Po intensywnych rozważaniach moi skrybowie przedstawiają mi pisemną umowę:\n\n[ghibelline_leader.GetTitleAsName|U] będzie mieć ograniczony wpływ w kwestii mianowań kościelnych, ale pozwoli on [ghibelline_leader.Custom('PL_mu_jej')] na powrót w celu obserwowania wyborów i rozstrzygania sporów dotyczących wyników.\n\nDrapię się po brodzie, w skupieniu zastanawiając się, jak to wpłynie na nas wszystkich."
 gdp_guelph_ghibelline.6500.a: "Tędy droga."
 gdp_guelph_ghibelline.6500.b: "Władza papiestwa jest #EMP nadrzędna#!!"
 concordat_of_worms_fulfilled.t: "Konkordat wormacki został wypełniony"
 concordat_of_worms_abandoned.t: "Konkordat wormacki został porzucony"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUINameNotMe] decyduje, czy zaakceptować warunki umowy"
 cow_phase_moves_to_agitation.tt: "Sytuacja „[GetSituation('guelph_ghibelline').GetName]” opuszcza etap preludium i przechodzi w fazę „[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]”"
 cow_phase_moves_to_repose.tt: "Sytuacja „[GetSituation('guelph_ghibelline').GetName]” opuszcza etap preludium i przechodzi w fazę „[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]”"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "Odłóżmy na chwilę nasze różnice i uzgodnijmy właściwy sposób regulowania spraw związanych z nominacjami kościelnymi.\n\nW zamian za to [ROOT.Char.GetTitleAsNameNoTooltip] może uczestniczyć w wyborach i rozstrzygać spory dotyczące wyników."
 gdp_guelph_ghibelline.6505.a: "Myślę, że to wystarczy…"
 gdp_guelph_ghibelline.6505.b: "To niedopuszczalne!"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "Gdy rozeszła się wieść, że [hre_kaiser.GetTitleAsName] zamierza skierować swoją uwagę na północne Włochy, chcąc scentralizować i umocnić swoją władzę w tym regionie, powrócili do mnie moi posłańcy."
 gdp_guelph_ghibelline.7000.desc.all: "\n\nWszyscy, którzy otrzymali moją wiadomość, przystąpili do Ligi Lombardzkiej.\n\nTeraz jesteśmy wystarczająco silni, by stawić opór wszelkim nagłym posunięciom, jakie planuje [hre_kaiser.GetTitleAsName]!"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nPonad połowa tych, którzy otrzymali moją wiadomość, przystąpiła do Ligi Lombardzkiej.\n\nTo powinno pozwolić nam na przetrwanie tego, co planuje [hre_kaiser.GetTitleAsName]. Miejmy nadzieję, że otrzymamy dodatkowe wsparcie od naszych świątobliwych przyjaciół…"
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nNiewielu z tych, którzy otrzymali moją wiadomość, dołączyło do Ligi Lombardzkiej, co niewątpliwie budzi we mnie pewne obawy.\n\n#EMP To bez znaczenia!#! Z niewielką, świętą pomocą będziemy w stanie obronić naszą nowo uzyskaną niepodległość."
 gdp_guelph_ghibelline.7000.a: "Czas na zmiany!"
 gdp_guelph_ghibelline.7000.b: "Nasz czas właśnie nadszedł!"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ dołączyć do Ligi Lombardzkiej?"
 gdp_guelph_ghibelline.7005.desc: "Wygląda na to, że [league_creator.GetTitledFirstName] to jednak [league_creator.GetWomanMan] z honorem.\n\nDotarły do mnie wieści, że została przez [league_creator.Custom('PL_niego_nia')] uformowana inicjatywa – [lombard_league_conf.GetName] – która ma na celu odparcie zakusów osoby, którą jest [hre_kaiser.GetTitleAsName].\n\nTen pomysł wydaje się rozsądny, szczególnie jeśli ktoś chce wyrwać się z okowów imperium…"
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "Nie działajmy tak pochopnie…"
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "Moi posłańcy donoszą, iż #EMP [league_creator.GetTitledFirstName]#! okazuje niezadowolenie z obecnego porządku w miejscu znanym jako [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier]. Udało [league_creator.Custom('PL_mu_jej')] się omamić inne zaślepione owce, by się do [league_creator.Custom('PL_niego_niej')] przyłączyły, a przecież to tak kontrowersyjna postać! Co za [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] i [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))]!\n\nCzymże jest ta cała #EMP Liga Lombardzka#!?!"
 gdp_guelph_ghibelline.7010.a: "Ich zuchwałość nie pozostanie bezkarna!"
 gdp_guelph_ghibelline.7010.b: "Mam na oku coś innego."
 league_creator_created_lombard_league.tt: "Osoba znana jako [league_creator.GetShortUINameNotMe] utworzyła konfederację o nazwie [league_creator.GetConfederation.GetName] #weak (liczba członków obecnie: #V [lombard_league_conf.GetMemberCount]#!)#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "Obawiam się, iż Liga Lombardzka zdoła przetrwać bez Waszych #EMP łaskawych#! datków."
 gdp_guelph_ghibelline.7015.a: "Hmmm."
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ osiągnięto kompromis"
 gdp_guelph_ghibelline.8500.desc: "Wśród zgromadzonych przebiega cichy szmer, gdy przedstawiciele gwelfów i gibelinów, [guelph_leader.GetName] i [ghibelline_leader.GetName], stają naprzeciw siebie, by złożyć podpis pod traktatem.\n\nJedni przyjmują to z ulgą, inni zaś z widocznym wzburzeniem, zmuszeni pogodzić się z kompromisem, który podważa ich głęboko zakorzenione przekonania o słuszności sprawy.\n\nGdy tłum w końcu powoli się rozchodzi, kierując się ku zwyczajowym przygotowaniom do kolacji, wokół wciąż rozbrzmiewają przyciszone rozmowy."
 gdp_guelph_ghibelline.8500.a: "Nareszcie już po wszystkim."
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "Widzę, iż wciąż nie pojmujesz własnej pomyłki. Dlaczego mielibyśmy czynić tak daleko idące ustępstwa, skoro wy, [actor.Custom('GetGuelphsGhibellines')|l], tak jawnie się mylicie?\n\nBawiłoby mnie to, gdyby cała sprawa nie była tak oburzająca."
 gdp_guelph_ghibelline.8510.a: "Co za bezczelność!"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUINameNotMe] odrzuca twoją propozycję zakończenia [Concept('situation', 'sytuacji')|E] „[GetSituation('guelph_ghibelline').GetName]”"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "Porozumienie to bez wątpienia było popisem dyplomacji.\n\n[guelph_leader.GetName] i [ghibelline_leader.GetName] poszli na ustępstwa, odnosząc niewielkie zwycięstwa, ale tracąc przychylność opinii publicznej.\n\nZawarcie traktatu, który przetrwa próbę czasu, to nie lada wyczyn. Zobaczymy, ilu z nas potrafi pozostawić przeszłość za sobą i skierować wzrok ku lepszemu jutru."
 gdp_guelph_ghibelline.8520.a: "Sądzę, że to najlepsze rozwiązanie."
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphGhibelline')|l] zwyciężają"
 gdp_guelph_ghibelline.9000.desc.guelph: "Sprawa jest zamknięta. Obroniliśmy prawa tego, co najświętsze – najwyższej władzy, która pozwala papieżowi chronić i wyznaczać naszych świętych pasterzy w nadchodzących latach.\n\nOgraniczyliśmy również wpływy miejsca znanego jako [GetTitleByKey('e_hre').GetName], którego ambicje ostatecznie zagrażają nam wszystkim.\n\nGibelińskie dusze, które #EMP zbłądziły#!, nie miały pojęcia, co je spotkało."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "W końcu dowiedliśmy naszego suwerennego prawa do rządzenia cesarstwem zgodnie z wolą [ROOT.Char.GetFaith.HighGodNamePossessive] – twardą ręką i trzeźwym umysłem.\n\nBo jakże wygnany święty pośrednik mógłby rozstrzygać, kto najlepiej włada ziemiami miejsca znanego jako [GetTitleByKey('e_hre').GetName]?\n\nNiech wierni papieżowi gwelfowie troszczą się o nasze dusze, a my zajmiemy się tym, co #EMP naprawdę#! się liczy."
 gdp_guelph_ghibelline.9000.a: "Myślę, że należy to uczcić."
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphGhibelline')|l] ponoszą porażkę"
 gdp_guelph_ghibelline.9010.desc.win: "W obliczu słabej opozycji stronnictwa, które tworzą [ROOT.Char.Custom('GuelphGhibellineGetOpposite')|l], raz po raz zdobywamy poparcie ludu.\n\nNasz wybitny przywódca [victorious_leader.GetTitledFirstName] wraz z niezależnymi ustawodawcami ogłosili, że rację mają [ROOT.Char.Custom('GetGuelphsGhibellines')|l], rozstrzygając tym samym raz na zawsze tę przedłużającą się #EMP sytuację#!.\n\nWreszcie w tej części świata zaczyna zwyciężać rozsądek!"
 gdp_guelph_ghibelline.9010.desc.lose: "Faktem jest, że nasze poparcie maleje.\n\nAni władza, ani wpływy, które mają [ROOT.Char.Custom('GetGuelphsGhibellines')|l], nie sięgają tak daleko, jak powinny, a ci tępi [ROOT.Char.Custom('GuelphGhibellineGetOpposite')|l] u władzy skłonili do poparcia ich przytłaczającą większość #EMP niezależnych#! ustawodawców.\n\nCzas, by [ROOT.Char.Custom('GetGuelphsGhibellines')|l] porzucili tę walkę i skupili się na celach, które rzeczywiście mogą osiągnąć."
 gdp_guelph_ghibelline.9010.a.win: "Rozkoszujmy się tą chwilą."
 gdp_guelph_ghibelline.9010.a.lose: "Podłe #EMP żmije#!!"
