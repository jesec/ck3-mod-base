l_polish:
 gdp_tgf_heavier_loads_modifier: "Większe obciążenie"
 gdp_tgf_seven_storehouses_modifier: "Siedem magazynów"
 gdp_tgf_seven_storehouses_modifier_desc: "Ten kupiec zbudował magazyny na czasy niedostatku i dba o to, aby każdy z nich był pełny."
 gdp_tgf_sweet_reputation_modifier: "Słodka reputacja"
 gdp_tgf_sweet_reputation_modifier_desc: "Ten kupiec wysłał kiedyś na książęcą ucztę cukrowego ptaka większego niż prawdziwy. Nikt, kto go spróbował, nie przestaje o nim mówić."
 gdp_tgf_beekeeper_modifier: "Pszczelarz"
 gdp_tgf_beekeeper_modifier_desc: "Ten kupiec hoduje pszczoły na krokwiach magazynu. Owady płacą czynsz w miodzie, a handlarz nauczył się o nich więcej, niż można by się dowiedzieć z jakiejkolwiek książki."
 gdp_tgf_alcohol_opportunist_modifier: "Winiarz z przypadku"
 gdp_tgf_alcohol_opportunist_modifier_desc: "Ten kupiec pozwolił kiedyś, aby ładunek owoców zgnił i zamienił się w wino, i od tamtej pory ciągle szuka tanich beczek."
 gdp_tgf_two_grades_modifier: "Dwie klasy oliwy"
 gdp_tgf_two_grades_modifier_desc: "Ten kupiec sprzedaje mętny osad do lamp, a klarowną oliwę do celów spożywczych – i pobiera opłatę za różnicę."
 gdp_tgf_road_millet_modifier: "Proso na drogę"
 gdp_tgf_road_millet_modifier_desc: "Ten kupiec nigdy nie wyrusza w podróż bez worka prosa. Zboże to wytrzymuje lata, podobnie jak każdy, kto ma je ze sobą."
 gdp_tgf_cheap_rice_modifier: "Tani ryż"
 gdp_tgf_cheap_rice_modifier_desc: "Brązowy ryż jest tani na miejscowych rynkach i dzięki temu nikt tu nie cierpi głodu."
 gdp_tgf_keeps_the_fast_modifier: "Zachowanie postu"
 gdp_tgf_keeps_the_fast_modifier_desc: "Ten kupiec sprzedaje mięso przez cały rok i pości razem z innymi. Nikt nie wie lepiej niż on, za co są gotowi zapłacić ludzie głodujący."
 gdp_tgf_parchment_supplier_modifier: "Dostawca pergaminu"
 gdp_tgf_parchment_supplier_modifier_desc: "Z najlepszych skór tego kupca wytwarzane są strony ksiąg. Gdzieś ktoś zapisuje na nich święte słowa."
 gdp_tgf_temple_supplier_modifier: "Dostawca świątynny"
 gdp_tgf_temple_supplier_modifier_desc: "Świątynie kupują kadzidło przede wszystkim od tego kupca i od czasu do czasu modlą się za niego."
 gdp_tgf_chancery_stationer_modifier: "Dostawca dla kancelarii"
 gdp_tgf_chancery_stationer_modifier_desc: "Ten kupiec zaopatruje kancelarię w papier, o którym mówi się wśród urzędników – każdy chce go mieć."
 gdp_tgf_tall_mast_modifier: "Wysoki maszt"
 gdp_tgf_tall_mast_modifier_desc: "Statek należący do tego kupca ma najwspanialszy maszt na całym wybrzeżu i dzięki temu może płynąć dalej."
 gdp_tgf_our_timber_modifier: "Wykonane z naszego drewna"
 gdp_tgf_our_timber_modifier_desc: "Statki z masztami wykonanymi z pochodzącego z tego szlaku drewna przewożą towary na większe odległości niż kiedyś."
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
 gdp_tgf_our_timber_renowned_modifier_desc: "$gdp_tgf_our_timber_modifier_desc$"
 gdp_tgf_heavier_loads_modifier_desc: "Ten szlak handlowy jest przeciążony ponad granicę bezpieczeństwa."
 gdp_tgf_builders_rate_castle_full_modifier: "Kamień na mury"
 gdp_tgf_builders_rate_castle_full_modifier_desc: "Zamek w tym hrabstwie jest zaopatrywany po stawce budowniczego."
 gdp_tgf_builders_rate_castle_small_modifier: "Drogo zakupione mury"
 gdp_tgf_builders_rate_castle_small_modifier_desc: "Zamek w tym hrabstwie jest zaopatrywany – za opłatą."
 gdp_tgf_builders_rate_church_full_modifier: "Kamień na świątynię"
 gdp_tgf_builders_rate_church_full_modifier_desc: "Świątynia w tym hrabstwie jest zaopatrywana po stawce budowniczego."
 gdp_tgf_builders_rate_church_small_modifier: "Drogo zakupiona świątynia"
 gdp_tgf_builders_rate_church_small_modifier_desc: "Świątynia w tym hrabstwie jest zaopatrywana – za opłatą."
 gdp_tgf_builders_rate_city_full_modifier: "Drewno na przystanie"
 gdp_tgf_builders_rate_city_full_modifier_desc: "Miasto w tym hrabstwie jest zaopatrywane po stawce budowniczego."
 gdp_tgf_builders_rate_city_small_modifier: "Drogo zakupione przystanie"
 gdp_tgf_builders_rate_city_small_modifier_desc: "Miasto w tym hrabstwie jest zaopatrzone – za opłatą."
 gdp_tgf_builders_rate_generic_full_modifier: "Przyjacielska stawka"
 gdp_tgf_builders_rate_generic_full_modifier_desc: "Budowniczowie w tym hrabstwie są zaopatrywani po przyjacielskiej stawce."
 gdp_tgf_builders_rate_generic_small_modifier: "Stawka kupca"
 gdp_tgf_builders_rate_generic_small_modifier_desc: "Budowniczowie w tym hrabstwie są zaopatrywani po stawce kupca."
 gdp_tgf_keep_the_best_modifier: "Najlepsze w asortymencie"
 gdp_tgf_keep_the_best_modifier_desc: "Ta postać zachowała najlepsze materiały budowlane na własne projekty."
 gdp_tgf_plentiful_stalls_modifier: "Bogate stragany"
 gdp_tgf_plentiful_stalls_modifier_desc: "Pewien kupiec zalał stragany w tym hrabstwie najlepszymi produktami z lasu."
 gdp_tgf_well_supplied_host_modifier: "Dobrze zaopatrzona armia"
 gdp_tgf_well_supplied_host_modifier_desc: "Armie tej postaci maszerują dzięki stałym dostawom kupca."
 gdp_tgf_bee_stung_modifier: "Użądlenie przez pszczołę"
 gdp_tgf_bee_stung_modifier_desc: "Ta postać wdała się w kłótnię z zamieszkującymi magazyn pszczołami i przegrała."
 gdp_tgf_awake_and_alert_modifier: "Pełna czujność"
 gdp_tgf_awake_and_alert_modifier_desc: "Ta postać pije herbatę z dzbanka i całymi nocami przegląda księgi rachunkowe."
 gdp_tgf_tea_drinker_modifier: "Koneser herbaty"
 gdp_tgf_tea_drinker_modifier_desc: "Ta postać przejęła od pewnego kupca nawyk picia herbaty, a dzięki temu zyskała większą jasność umysłu."
 gdp_tgf_well_grazed_meadows_modifier: "Dobrze wykorzystane pastwiska"
 gdp_tgf_well_grazed_meadows_modifier_desc: "Stada należące do kupca utuczyły się na łąkach w tym hrabstwie, a dzięki czemu trawa stała się jeszcze bardziej zielona."
 gdp_tgf_lacquer_rash_modifier: "Wysypka od laki"
 gdp_tgf_lacquer_rash_modifier_desc: "Ta postać dotknęła laki, zanim ta zdążyła wyschnąć. Laka wygrała."
 gdp_tgf_curing_room_modifier: "Suszarnia"
 gdp_tgf_curing_room_modifier_desc: "Ten kupiec suszy lakę w wilgotnym pomieszczeniu warstwa po warstwie, a klienci to dostrzegają."
 gdp_tgf_theriac_supply_modifier: "Zapasy teriaku"
 gdp_tgf_theriac_supply_modifier_desc: "Na rynkach w tym hrabstwie sprzedaje się teriak sporządzany z zapasów pewnego kupca."
 gdp_tgf_theriac_dose_modifier: "Dawka teriaku"
 gdp_tgf_theriac_dose_modifier_desc: "Ta postać zażyła dawkę teriaku i bardzo go sobie chwali."
 gdp_tgf_theriac_peddlers_modifier: "Sprzedawcy teriaku"
 gdp_tgf_theriac_peddlers_modifier_desc: "Teriak jest sprzedawany w każdym mieście na tym szlaku, więc tamtejsze karawany nigdy nie podróżują w połowie puste."
