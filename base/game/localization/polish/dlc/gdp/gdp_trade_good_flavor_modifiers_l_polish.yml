 gdp_tgf_kept_edge_modifier: "Tajemnice handlowe"
 gdp_tgf_kept_edge_modifier_desc: "Ta postać odmówiła przyjęcia pokaźnej sumy pieniędzy w zamian za ujawnienie swoich dostawców."
 gdp_tgf_price_war_modifier: "Ścięte do minimum"
 gdp_tgf_price_war_modifier_desc: "Ceny tej postaci są ścięte do minimum, podobnie jak zyski jej rywala."
 gdp_tgf_vein_share_modifier: "Wydobycie finansowane przez kupca"
 gdp_tgf_vein_share_modifier_desc: "Kupiec nabył udziały w przedsięwzięciach wydobywczych w tym hrabstwie i chce zachować dla siebie każdy wagonik urobku."
 gdp_tgf_ballast_trick_modifier: "Zyskowny balast"
