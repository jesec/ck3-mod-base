 gdp_ancient_craft_meat_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_cereals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_consumption_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_jewelry_materials_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_items_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_republic_disgraced_patrician_house_modifier: "Zhańbieni patrycjusze"
 gdp_republic_disgraced_patrician_house_modifier_desc: "Ten ród doprowadził republikę do ruiny i został wygnany w hańbie. Jego nazwisko nie ma większego znaczenia na rynkach, a jeszcze mniej osób wypowiada się o nim pozytywnie."
 gdp_republic_unrest_guild_district_shutdown: "Zamknięta dzielnica gildyjna"
 gdp_republic_unrest_guild_district_shutdown_desc: "Gildie rzemieślnicze zamknęły swoje podwoje. Wstrzymano pracę rzemieślników i warsztatów."
 gdp_republic_unrest_market_district_shutdown: "Zamknięta dzielnica handlowa"
 gdp_republic_unrest_market_district_shutdown_desc: "Dzielnica targowa została zamknięta i opuszczona. Życie gospodarcze w mieście zamarło."
 gdp_republic_unrest_port_district_shutdown: "Zamknięta dzielnica portowa"
 gdp_republic_unrest_port_district_shutdown_desc: "Port został odcięty od władz miejskich. Dochody z handlu morskiego zanikły."
 gdp_republic_unrest_bureaucratic_district_shutdown: "Zamknięta dzielnica biurokratyczna"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "W dzielnicy administracyjnej zapanowała cisza. Zaprzestano poboru opłat samorządowych."
 gdp_republic_unrest_temple_district_shutdown: "Dzielnica enklawy religijnej: zamknięta"
 gdp_republic_unrest_temple_district_shutdown_desc: "Dzielnica świątynna zaprzestała współpracy. Do skarbca nie napływają już datki od wiernych."
 gdp_republic_unrest_entertainment_district_shutdown: "Zamknięta dzielnica rozrywkowa"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "Dzielnica rozrywkowa pogrążyła się w ciemnościach i opustoszała. Odbija się to negatywnie na dochodach miasta."
 gdp_republic_unrest_urban_housing_district_shutdown: "Dzielnica mieszkalna: zamknięta"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "Zabarykadowano całą dzielnicę mieszkalną. Pobór podatków miejskich został przerwany."
 gdp_republic_riot_aftermath: "Pokłosie zamieszek"
 gdp_republic_riot_aftermath_desc: "Spalono ulice i splądrowano spichlerze, a tkanka społeczna uległa zniszczeniu. Odbudowa będzie przebiegać powoli."
 gdp_republic_uprising_aftermath: "Pokłosie powstania"
 gdp_republic_uprising_aftermath_desc: "Ludzie bezkarnie szaleli po całym mieście. Porządek prędko nie wróci."
 gdp_sponsored_guild_modifier: "Zasponsorowano gildię rzemieślniczą"
 gdp_sponsored_guild_modifier_desc: "Rzemieślnicy otrzymali zgodę na założenie nowej gildii, a wsparcia udzielił im zamożny dobroczyńca."
 gdp_secret_information_house_modifier: "Sekrety dyplomatyczne"
 gdp_secret_information_house_modifier_desc: "Ten ród korzysta na dostępie do tajnych negocjacji dyplomatycznych jego republiki."
 gdp_ambitions_aligned_house_modifier: "Zrównanie interesów rodu"
 gdp_ambitions_aligned_house_modifier_desc: "Ten ród zrównał swoje interesy z innymi rodami w republice mającymi podobne ambicje."
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "Reputacja tego rodu została zszargana przez potok bulwersujących oszczerstw.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_slander_rating_penalty_value' )|0=+]\nWynik poparcia dla członka [Concept('house', 'rodu')|E] w sukcesji według prawa „[GetLaw('republican_elective_succession_law').GetName]”: [EmptyScope.ScriptValue( 'republic_slander_election_value' )|0=+]"
 gdp_patrician_promoted_house_modifier: "Wzmocniona reputacja"
 gdp_patrician_promoted_house_modifier_desc: "Pozycja tego rodu w republice wzrosła dzięki udanej kampanii promocyjnej.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
 gdp_secured_republic_monopoly_modifier: "Zapewniono monopol republice"
 gdp_secured_republic_monopoly_modifier_desc: "Ta postać zapewniła swojej republice monopol.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'secured_republic_monopoly_rating_bonus_value' )|0=+]"
 gdp_head_held_high_modifier: "Z podniesioną głową"
 gdp_head_held_high_modifier_desc: "Ta postać nie daje się zgnębić drwinom."
 gdp_training_for_the_worst_modifier: "Przygotowania na najgorsze"
 gdp_training_for_the_worst_modifier_desc: "Ta postać postanowiła szlifować swoją sprawność bojową na wypadek, gdyby doszło do najgorszego."
 gdp_fear_of_the_mob_modifier: "Strach przed tłumem"
 gdp_fear_of_the_mob_modifier_desc: "Ta postać żyje w strachu przed kapryśnym ludem."
 gdp_champion_of_the_people_modifier: "Czempion ludu"
 gdp_champion_of_the_people_modifier_desc: "Ta postać mianowała się obrońcą prostego ludu."
 gdp_champion_of_the_state_modifier: "Czempion władzy"
 gdp_champion_of_the_state_modifier_desc: "Ta postać mianowała się obrońcą obecnego rządu."
 gdp_guild_sponsored_feast_modifier: "Uczta ufundowana przez gildie"
 gdp_guild_sponsored_feast_modifier_desc: "Gildie z miasta tej postaci wyprawiły dla niej darmową ucztę."
 gdp_broken_trust_modifier: "Nadszarpnięte zaufanie"
 gdp_broken_trust_modifier_desc: "Ta postać wykorzystała dobrą wolę ludu dla własnej korzyści."
 gdp_toast_to_adventure_modifier: "Żądza przygód"
 gdp_toast_to_adventure_modifier_desc: "Ta postać marzy o przygodach w dalekich krainach."
 gdp_toast_to_romance_modifier: "Pragnienie romansu"
 gdp_toast_to_romance_modifier_desc: "Ta postać ma ambicje związane z miłością i romansami."
 gdp_toast_to_glory_modifier: "Żądza chwały"
 gdp_toast_to_glory_modifier_desc: "Ta postać ma ambicje zdobycia chwały."
 gdp_toast_to_relations_modifier: "Pragnienie przyjaźni."
 gdp_toast_to_relations_modifier_desc: "Ta postać ma ambicje związane z przyjaźnią i rodziną.\nOdblokowuje [Concept('interaction', 'interakcję')|E] „$befriend_interaction$”"
 gdp_republic_bureaucrat_modifier: "Biurokrata republiki"
 gdp_republic_bureaucrat_modifier_desc: "Ta postać wykazała się ostatnio wielkimi umiejętnościami w procesie legislacyjnym, sprawnie zajmując się dokumentami.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\nPoparcie [Concept('assembly', 'zgromadzenia')|E] podczas [Concept('voting_sessions', 'sesji głosowania')|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "Prawodawca"
 gdp_republic_law_maker_modifier_desc: "Ta postać, dzięki sprytnym posunięciom lub odpowiednim wpływom, niedawno uzyskała zgodę zgromadzenia na wprowadzenie zaproponowanego przez siebie prawa.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "Wpływowe faktorie"
 gdp_dominate_market_trade_post_modifier_desc: "Na ten rynek silnie wpływają faktorie pewnego patrycjusza."
 gdp_trade_post_charity_modifier: "Zorganizowana akcja dobroczynna"
 gdp_trade_post_charity_modifier_desc: "Ta postać zorganizowała akcję dobroczynną dla prostego ludu na rzecz chorych, ubogich i potrzebujących."
 gdp_gather_popular_support_modifier: "Popularność wśród ludu"
 gdp_gather_popular_support_modifier_desc: "Ta postać zdobyła poparcie mieszkańców miasta, dzięki czemu zyskała rozgłos i większy wpływ."
 gdp_gather_popular_support_house_t3_modifier: "Ród wyjątkowo bliski ludowi"
 gdp_gather_popular_support_house_t3_modifier_desc: "Ten ród cieszy się wyjątkowym poparciem mieszkańców miasta.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName] – wynik poparcia członków [Concept('house', 'rodu')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "Ród bardzo bliski ludowi"
 gdp_gather_popular_support_house_t2_modifier_desc: "Ten ród cieszy się silnym poparciem mieszkańców miasta.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName] – wynik poparcia członków [Concept('house', 'rodu')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "Ród bliski ludowi"
 gdp_gather_popular_support_house_t1_modifier_desc: "Ten ród cieszy się poparciem mieszkańców miasta.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName] – wynik poparcia członków [Concept('house', 'rodu')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "Despotyczny burmistrz"
 gdp_signorial_execute_and_banish_modifier_desc: "Ta postać skazywała obywateli republiki na stracenie i wygnanie, a jej ambicje sięgają jeszcze dalej."
 gdp_ambition_promote_scheme_bonus_modifier: "Wypromowano patrycjuszy"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "Ta postać poświęciła czas i wysiłek na poprawę reputacji innego patrycjusza, zyskując w zamian jego przychylność.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (wskaźnik się nie kumuluje)#!"
 gdp_noble_magistrate_modifier: "Stanowisko szlacheckiego sędziego"
 gdp_noble_magistrate_modifier_desc: "Ta postać otrzymała pomniejszy szlachecki urząd sędziowski, by w oficjalnej roli służyć republice uczciwie i honorowo."
 gdp_republic_plaza_prestige_modifier: "Prestiżowy plac"
 gdp_republic_plaza_prestige_modifier_desc: "Ta postać wniosła wkład w budowę wielkiego placu, co przyniosło jej prestiż i przychylność ludu."
 gdp_republic_trader_competitiveness_modifier: "Twardy kupiec"
 gdp_republic_trader_competitiveness_modifier_desc: "Ta postać to kupiec o kamiennej twarzy, który się nie ugina – to druga strona musi ustąpić."
 gdp_republic_plaza_chancery_modifier: "Drewno z kancelarii"
 gdp_republic_plaza_chancery_modifier_desc: "Po wyposażeniu archiwum tej postaci zostało pod dostatkiem cieśli, pras i sezonowanego drewna, a nadwyżkę wykorzystuje ona teraz we własnym domu."
 gdp_republic_plaza_scriptorium_modifier: "Dobrze zaopatrzone skryptorium"
 gdp_republic_plaza_scriptorium_modifier_desc: "Ta postać posiada mnóstwo wysokiej jakości atramentów i pigmentów, którymi zaopatrywała kopistów komuny."
 gdp_republic_plaza_magistracy_modifier: "Szaty urzędowe"
 gdp_republic_plaza_magistracy_modifier_desc: "Ta postać na własny koszt odziała miejskich sędziów i wszędzie tam, gdzie przemawia prawo, jest witana z należnym szacunkiem."
 gdp_republic_plaza_popular_favor_modifier: "Popularny przywódca"
 gdp_republic_plaza_popular_favor_modifier_desc: "Ta postać po mistrzowsku urabia tłum i dba o to, by wszyscy dokładnie wiedzieli, czyja moneta opłaciła ich udogodnienia."
 gdp_republic_plaza_trade_capacity_modifier: "Zważone i opieczętowane"
 gdp_republic_plaza_trade_capacity_modifier_desc: "Towary tej postaci przechodzą przez wagę bez sporów, a z każdym sezonem z rąk do rąk płyną coraz większe ich ilości."
 gdp_republic_plaza_expertise_modifier: "Kupiec z placu"
 gdp_republic_plaza_expertise_modifier_desc: "Ta postać ma wpływ na wielu miejskich kupców, dzięki czemu zyskuje wiedzę o towarach i handlu, której zdobycie zajęłoby w innym razie dziesięciolecia."
 gdp_republic_plaza_estate_income_modifier: "Wierzyciel publiczny"
 gdp_republic_plaza_estate_income_modifier_desc: "Komuna jest winna tej postaci pieniądze, a odsetki punktualnie trafiają do jej rachuby."
 gdp_republic_plaza_physician_modifier: "Przychylność medyka"
 gdp_republic_plaza_physician_modifier_desc: "Ta postać opłaciła zaopatrzenie miejskich izb chorych w zioła i leki, dzięki czemu jej własnemu domowi nigdy nie brakuje ani jednego, ani drugiego."
 gdp_republic_plaza_hired_swords_modifier: "Płatnik kompanii"
 gdp_republic_plaza_hired_swords_modifier_desc: "Ta postać dba o to, by najemne kompanie dostawały zapłatę na czas i w całości, a one pamiętały, z czyjej sakiewki pochodzą pieniądze."
 gdp_republic_plaza_organized_worker_modifier: "Organizator siły roboczej"
 gdp_republic_plaza_organized_worker_modifier_desc: "Ta postać zorganizowała siłę roboczą do ogromnych przedsięwzięć budowlanych, zdobywając dużą wiedzę na temat logistyki przedsięwzięć o tak wielkiej skali."
 gdp_republic_civic_works_labor_modifier: "Zorganizowana siła robocza"
 gdp_republic_civic_works_labor_modifier_desc: "Republika zebrała i zorganizowała robotników, co przyspiesza przedsięwzięcia budowlane w całej stolicy."
 gdp_republic_civic_works_materials_modifier: "Pozyskane materiały"
 gdp_republic_civic_works_materials_modifier_desc: "Skoordynowane działania na rzecz pozyskania i zgromadzenia materiałów budowlanych obniżyły koszty budowy w całej stolicy."
 gdp_republic_civic_works_amenities_modifier: "Udogodnienia publiczne"
 gdp_republic_civic_works_amenities_modifier_desc: "Nowe łaźnie, fontanny i miejsca spotkań poprawiły nastroje mieszkańców miasta."
 gdp_republic_civic_works_market_modifier: "Powiększony rynek"
 gdp_republic_civic_works_market_modifier_desc: "Większa i lepiej zorganizowana dzielnica targowa przyciągnęła więcej kupców i poprawiła warunki handlu w stolicy."
 gdp_republic_civic_works_guilds_modifier: "Gildie rzemieślnicze otrzymały wsparcie finansowe"
 gdp_republic_civic_works_guilds_modifier_desc: "Sponsorowane gildie sprowadziły do stolicy wykwalifikowanych rzemieślników, co napędza inwestycje i stopniowo poprawia warunki w mieście."
 gdp_republic_civic_works_labor_character_modifier: "Sieć pracowników"
 gdp_republic_civic_works_labor_character_modifier_desc: "Organizowanie siły roboczej na potrzeby robót publicznych zapewniło temu władcy kontakty z wykwalifikowanymi robotnikami i wykonawcami w całej stolicy.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "Sieć dostaw"
 gdp_republic_civic_works_materials_character_modifier_desc: "Pozyskiwanie materiałów na potrzeby robót publicznych otworzyło niezawodne kanały dostaw kamienia, drewna i zaopatrzenia po korzystnych cenach.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "Patron miasta"
 gdp_republic_civic_works_amenities_character_modifier_desc: "Finansowanie publicznych udogodnień w mieście przyniosło temu władcy wyraźną życzliwość mieszkańców stolicy.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "Kontakty na rynku"
 gdp_republic_civic_works_market_character_modifier_desc: "Rozbudowa dzielnicy targowej w stolicy zapewniła temu władcy kontakty z kupcami i handlarzami, którzy pamiętają o tej przysłudze.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "Patron gildii"
 gdp_republic_civic_works_guilds_character_modifier_desc: "Dotowanie gildii rzemieślniczych zbudowało trwałe więzi z miejskimi rzemieślnikami, których wdzięczność dobrze wpływa na pozycję tego władcy.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "Rozwój osadnictwa"
 gdp_republic_civic_works_settlement_modifier_desc: "Inwestycje w miejską infrastrukturę stolicy zrobiły miejsce dla większej liczby ludzi, a ci już przybywają."
 gdp_republic_civic_works_settlement_character_modifier: "Inwestor miejski"
 gdp_republic_civic_works_settlement_character_modifier_desc: "Finansowanie rozbudowy stolicy republiki dało temu władcy wpływ na to, jak rozwija się miasto.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "Porządek miejski"
 gdp_republic_civic_works_order_modifier_desc: "Inwestycje w straż miejską i infrastrukturę obywatelską zaprowadziły w stolicy większy porządek i ułatwiły zarządzanie nią."
 gdp_republic_civic_works_order_character_modifier: "Autorytet obywatelski"
 gdp_republic_civic_works_order_character_modifier_desc: "Finansowanie porządku publicznego w stolicy przyniosło temu władcy reputację gwaranta stabilności i dobrych rządów.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "Szkoły publiczne"
 gdp_republic_civic_works_school_modifier_desc: "To hrabstwo otrzymało znaczne fundusze na budowę szkół publicznych."
 gdp_republic_civic_works_school_character_modifier: "Patron szkół"
 gdp_republic_civic_works_school_character_modifier_desc: "Ta postać sfinansowała budowę szkół w stolicy, zapewniając młodzieży wykształcenie i naukę.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
