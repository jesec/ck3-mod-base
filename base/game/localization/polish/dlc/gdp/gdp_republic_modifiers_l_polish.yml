l_polish:
 gdp_founded_republic_modifier: "Założyciel republiki"
 gdp_founded_republic_modifier_desc: "Ta postać utworzyła republikę."
 gdp_fund_alms_decree_modifier: "Jałmużnictwo"
 gdp_fund_alms_decree_modifier_desc: "Władcy tego miasta niedawno okazali hojność, rozdając jałmużnę biednym."
 gdp_taxed_county_modifier: "Zapłacony podatek wojenny"
 gdp_taxed_county_modifier_desc: "To hrabstwo niedawno zapłaciło wysokie podatki, aby sfinansować działania wojenne"
 gdp_tax_holiday_decree_modifier: "Ulga podatkowa"
 gdp_tax_holiday_decree_modifier_desc: "Podatki miejskie zostały obniżone dekretem, co zjednało przychylność mieszkańców."
 gdp_trade_support_modifier: "Wsparcie handlowe"
 gdp_trade_support_modifier_desc: "Ta postać otrzymała wsparcie handlowe od republiki w celu usprawnienia swoich szlaków handlowych."
 republic_reliable_caravans_modifier: "Niezawodne karawany"
 republic_reliable_caravans_modifier_desc: "Szlaki handlowe tej postaci są obsługiwane przez lepiej zorganizowane karawany."
 republic_premium_contracts_modifier: "Doskonałe kontrakty"
 republic_premium_contracts_modifier_desc: "Ta postać podpisała korzystne kontrakty na sprzedaż towarów."
 republic_inspector_bribery_modifier: "Łapówkarstwo inspektorów"
 republic_inspector_bribery_modifier_desc: "Inspektorzy rynkowi tej postaci zostali przekupieni."
 gdp_glorification_modifier: "Gloryfikacja"
 gdp_glorification_modifier_desc: "Miasto publicznie wysławia tego władcę – jego imię i wizerunek są czczone zarówno na ulicach, jak i w salach zgromadzeń.\n\n[GetLaw( 'republican_elective_succession_law' ).GetName] – [voting_strength|El]: +1"
 gdp_civic_labor_modifier: "Praca obywatelska"
 gdp_civic_labor_modifier_desc: "Mieszkańcy stolicy tej postaci zostali wezwani do wsparcia przedsięwzięcia swoją pracą i wiedzą, co obniża koszt i skraca czas budowy siedziby."
 gdp_popular_mandate_modifier: "Poparcie ludu"
 gdp_popular_mandate_modifier_desc: "Ta postać zjednała sobie mieszkańców stolicy, którzy popierają jej dalsze rządy. Dzięki temu jej głos zyska większą wagę podczas następnej elekcji.\n\n#weak Ten [modifier|El] obowiązuje przez jedną elekcję#!\n\n[GetLaw( 'republican_elective_succession_law' ).GetName] – [voting_strength|El]: #P +1#!"
 gdp_patrician_promoted_voter_modifier: "Wzmocniona reputacja"
 gdp_patrician_promoted_voter_modifier_desc: "Pozycja tej postaci w republice wzrosła dzięki udanej kampanii promocyjnej.\n[GetLaw( 'republican_elective_succession_law' ).GetName] – [voting_strength|El]: #P +1#!"
 republic_procedural_advantage_modifier: "Przewaga proceduralna"
 republic_procedural_advantage_modifier_desc: "Ta postać sporządziła procedury i formularze niezbędne do zwiększenia poparcia na głosowaniu zgromadzenia."
 gdp_pledged_assembly_vote_modifier: "Obiecane głosy zgromadzenia"
 gdp_pledged_assembly_vote_modifier_desc: "Członkowie [Concept('assembly', 'zgromadzenia')|E] zobowiązali się przekazać głosy tej postaci.\n$EFFECT_LIST_BULLET$#V Na następnym [Concept('voting_session', 'głosowaniu')|E] będą głosować tak jak ona.#!"
 gdp_bawdy_song_modifier: "Sprośna piosenka"
 gdp_bawdy_song_modifier_desc: "Tę postać zainspirował sprośny tekst piosenki."
 gdp_patriotic_song_modifier: "Patriotyczna piosenka"
 gdp_patriotic_song_modifier_desc: "Tę postać zainspirował tekst piosenki poświęcony [Glossary( '#bold ojczyźnie#!', 'carnival_patria_GLOSS' )]."
 gdp_spiritual_song_modifier: "Duchowa piosenka"
 gdp_spiritual_song_modifier_desc: "Tę postać zainspirował duchowy tekst piosenki."
 gdp_rejected_dancefloor_modifier: "Odrzucenie tańca"
 gdp_rejected_dancefloor_modifier_desc: "Ta postać została odrzucona przez osobę, z którą chciała zatańczyć"
 gdp_accepted_dancefloor_modifier: "Zaakceptowanie tańca"
 gdp_accepted_dancefloor_modifier_desc: "Ta postać zaprosiła do tańca, a jej prośba została zaakceptowana."
 gdp_exquisite_mask_modifier: "Znakomita maska"
 gdp_exquisite_mask_modifier_desc: "Ta postać nosiła znakomitą maskę podczas karnawału"
 gdp_terrifying_mask_modifier: "Przerażająca maska"
 gdp_terrifying_mask_modifier_desc: "Ta postać nosiła przerażającą maskę podczas karnawału"
 gdp_slanderous_grafitti_modifier: "Oszczercze graffiti"
 gdp_slanderous_grafitti_modifier_desc: "Rodzina tej postaci została zniesławiona poprzez rysunki w alejkach miasta."
 gdp_domestic_chaos_modifier: "Chaos w domu"
 gdp_domestic_chaos_modifier_desc: "Miejsce zamieszkania tej postaci przewrócono do góry nogami."
 gdp_fragrant_egg_modifier: "Jajeczna mgiełka zapachowa"
 gdp_fragrant_egg_modifier_desc: "Ta postać przesiąkła zapachem z rzuconej skorupki jajka."
 gdp_sympathetic_ear_scheme_modifier: "Życzliwy słuchacz"
 gdp_sympathetic_ear_scheme_modifier_desc: "Ta postać ma na swoim dworze kogoś przychylnego temu spiskowi."
 gdp_insane_arguments_modifier: "Szalone argumenty"
 gdp_insane_arguments_modifier_desc: "Ta postać wysłuchała szalonych argumentów."
 gdp_fatalistic_arguments_modifier: "Fatalistyczne argumenty"
 gdp_fatalistic_arguments_modifier_desc: "Ta postać wysłuchała fatalistycznych argumentów."
 gdp_beautiful_arguments_modifier: "Piękny argument"
 gdp_beautiful_arguments_modifier_desc: "Ta postać otrzymała radę od pięknej osoby."
 gdp_ugly_arguments_modifier: "Potworny argument"
 gdp_ugly_arguments_modifier_desc: "Ta postać otrzymała radę od potwornej osoby."
 gdp_intellectual_debate_modifier: "Debata intelektualna"
 gdp_intellectual_debate_modifier_desc: "Ta postać wysłuchała argumentów wprawnego uczestnika debaty."
 gdp_advise_of_a_fool_modifier: "Rada głupca"
 gdp_advise_of_a_fool_modifier_desc: "Ta postać wysłuchała argumentów nierozsądnej osoby."
 gdp_a_way_with_words_modifier: "Płynna mowa"
 gdp_a_way_with_words_modifier_desc: "Ta postać wysłuchała argumentów elokwentnej osoby."
 gdp_sympathetic_ear_scheme_modifier_tt: "\"Twój [scheme|El] zyskuje modyfikator „[GetModifier('gdp_sympathetic_ear_scheme_modifier').GetNameWithTooltip]”."
 gdp_business_sabotage_modifier: "Sabotaż interesu"
 gdp_business_sabotage_modifier_desc: "Tę postać sabotował konkurent"
 gdp_arson_modifier: "Tajemniczy ogień"
 gdp_arson_modifier_desc: "Dom tej postaci został podpalony przez nieznanych sprawców."
 gdp_hardened_position_modifier: "Umocniona pozycja"
 gdp_hardened_position_modifier_desc: "Ta postać umocniła swoją pozycję w odpowiedzi na zastraszanie."
 gdp_intimidated_modifier: "Zastraszono"
 gdp_intimidated_modifier_desc: "Ta postać została zastraszona."
 gdp_trentina_quarantine_county_modifier: "Kwarantanna morska"
 gdp_trentina_quarantine_county_modifier_desc: "Wprowadzono kwarantannę morską, aby ograniczyć rozprzestrzenianie się chorób."
 gdp_trentina_quarantine_character_modifier: "Kwarantanna morska"
 gdp_trentina_quarantine_character_modifier_desc: "Działalność gospodarcza tej postaci została zakłócona przez kwarantannę morską."
 gdp_curfew_character_modifier: "Nocne godziny porządkowe"
 gdp_curfew_character_modifier_desc: "Tę postać obowiązują nocne godziny porządkowe, dzięki czemu ona i inni unikną kłopotów."
 gdp_state_protection_modifier: "Ochrona państwowa"
 gdp_state_protection_modifier_desc: "Ta postać jest pod ochroną zgromadzenia."
 gdp_republic_grieving_parent_modifier: "Żałoba"
 gdp_republic_grieving_parent_modifier_desc: "Ta postać utraciła dziedzica w wyniku przemocy tłumu. Ciężar tej straty wciąż daje o sobie znać."
 gdp_exposed_spy_modifier: "Nielegalny szpieg"
 gdp_exposed_spy_modifier_desc: "Ta postać została zdemaskowana w związku ze szpiegowaniem innych postaci."
 gdp_dodging_council_modifier: "Unikanie obowiązków radnego"
 gdp_dodging_council_modifier_desc: "Ta postać znalazła sposób na unikanie obowiązków radnego, dzięki czemu ma więcej czasu na inne zajęcia."
 gdp_exemption_from_council_modifier: "Zwolnienie z obowiązków radnego"
 gdp_exemption_from_council_modifier_desc: "Ta postać została zwolniona z obowiązków radnego, aby mogła skupić się na własnych interesach biznesowych."
 gdp_wedded_to_the_sea_modifier: "Zaślubiny z morzem"
 gdp_wedded_to_the_sea_modifier_desc: "Ta postać przysięgła wierność morzu przed całą republiką."
 gdp_learning_from_the_masses: "Nauka od ludu"
 gdp_learning_from_the_masses_desc: "Ta postać chętnie uczy się handlu, obserwując zwykłych ludzi."
 gdp_cooperation_correspondenti_house_modifier: "Correspondenti"
 gdp_cooperation_correspondenti_house_modifier_desc: "Ten ród nawiązał współpracę z innym rodem kupieckim, co poszerza możliwości jego sieci handlowej."
 gdp_cooperation_compagnia_house_modifier: "Compagnia"
 gdp_cooperation_compagnia_house_modifier_desc: "Ten ród nawiązał współpracę z innym rodem kupieckim i dzieli się z nim zasobami oraz wiedzą."
 gdp_guild_sponsor_house_modifier: "Sponsor gildii rzemieślniczej"
 gdp_guild_sponsor_house_modifier_desc: "Ten ród sfinansował powstanie nowej gildii rzemieślniczej w zgromadzeniu i tym samym został jej patronem. "
 gdp_ancient_craft_house_modifier: "Starożytne rzemiosło"
 gdp_ancient_craft_carpentry_supplies_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_books_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_incense_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_base_metals_house_modifier: "$gdp_ancient_craft_house_modifier$"
