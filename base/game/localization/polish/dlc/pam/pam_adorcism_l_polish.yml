l_polish:
 pam_curse_enemy_decision: "Rzuć klątwę na wroga"
 pam_curse_enemy_decision_desc: "#F Kim jest ten głupiec, który staje przeciwko mnie? Wymienię jego imię przed obliczem duchów i wyleję na niego wszelką skargę, każdą zniewagę i każde przekleństwo. Niech się śmieje, póki może; rozliczenie nadejdzie wkrótce.#!"
 pam_curse_enemy_decision_tooltip: "Wykonaj rytuał przeciwko rywalowi lub przeciwnikowi w jednej ze swoich [Concept('wars', 'wojen')|E]"
 pam_curse_enemy_decision_confirm: "Rozpocznij obrządek"
 pam_curse_enemy_decision_valid_target: "Masz żyjącego dorosłego [Concept('rival', 'rywala')|E], [Concept('nemesis', 'śmiertelnego wroga')|E] lub wroga w wojnie"
 pam_curse_enemy_decision_selected_target_valid: "Wybrano wroga, który jest żyjącym dorosłym [Concept('rival', 'rywalem')|E], [Concept('nemesis', 'śmiertelnym wrogiem')|E] lub wrogiem w wojnie"
 pam_curse_enemy_decision_no_item_selected: "Nie wybrano wroga"
 pam_seek_war_aid_decision: "Proś o wsparcie w wojnie"
 pam_seek_war_aid_decision_desc: "#F Wojna to próba nie tylko oręża i liczebności wojsk. Będę błagać duchy o dość przenikliwości, wigoru i wytrwałości, by przeprowadzić moją sprawę przez nadchodzące próby.#!"
 pam_seek_war_aid_decision_tooltip: "Poproś duchy o pomoc w twoich obecnych wojnach"
 pam_seek_war_aid_decision_confirm: "Zwróć się z prośbą do duchów"
 pam_adorcism_events.0001.t: "Imię, które usłyszą duchy"
 pam_adorcism_events.0001.desc: "W odosobnionym miejscu wydrapuję w ziemi imię osoby znanej jako [pam_adorcism_curse_target.GetTitledFirstName] i wypowiadam na głos wszystkie żale. Ten obrzęd nie łamie kości ani nie sprawia, że plony marnieją, ale nie taki jest jego cel.\n\nKiedy wstaję, mój gniew stygnie i zamienia się w zimną determinację. Każda plotka o [pam_adorcism_curse_target.Custom('PL_nim_niej')] wydaje się teraz tropem, który wystarczy podjąć."
 pam_adorcism_events.0001.a: "Mój cel jest jasny."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], wiedz, że z ust moich padło twoje imię przed duchami i rzucone zostało na ciebie przekleństwo. Kiedy spotka cię nieszczęście, pamiętaj, że to moja wola je przywołała."
 pam_adorcism_events.0002.desc.default: "\n\nWiedz, że z ust moich padło twoje imię przed duchami i rzucone zostało na ciebie przekleństwo. Kiedy spotka cię nieszczęście, pamiętaj, że to moja wola je przywołała."
 pam_adorcism_events.0002.a: "Przyda się tu [ROOT.Char.GetFaith.PriestNeuter|l] – prędko!"
 pam_adorcism_events.0002.a.flavor: "Klątwa gryzie twoje myśli, a każdy cień wydaje się omenem."
 pam_adorcism_events.0101.t: "Porada z zaświatów"
 pam_adorcism_events.0101.desc: "Za ostatnimi ogniskami obozu składam ofiarę i nasłuchuję, podczas gdy gwar wojska cichnie za moimi plecami. Wiatr wznieca kurz, nie niosąc żadnego wyraźnego głosu, a jednak sam rytuał daje mym myślom ukojenie.\n\nMuszę zdecydować, jakiej pomocy szukać przed nadchodzącą kampanią."
 pam_adorcism_events.0101.a: "Wskaż mi drogę do zwycięstwa."
 pam_adorcism_events.0101.b: "Użycz siły mojemu ramieniu dzierżącemu miecz."
 pam_adorcism_events.0101.c: "Daj wytrwałość mojemu gospodarzowi."
 pam_adorcism_curse_focus_modifier: "Przekierowanie złości"
 pam_adorcism_curse_focus_modifier_desc: "Ta postać wypowiedziała na głos imię obiektu swojej wściekłości i wyrzuciła z siebie emocje poprzez rytuał."
 pam_adorcism_ill_omen_modifier: "Naznaczenie złowrogim omenem"
 pam_adorcism_ill_omen_modifier_desc: "Członkowie obrządku tej postaci traktują ją podejrzliwie po usłyszeniu plotek o klątwie."
 pam_adorcism_curse_anxiety_modifier: "W obawie przed klątwą"
 pam_adorcism_curse_anxiety_modifier_desc: "Ta postać nie może uwolnić się od dręczącego przekonania, że każde nadchodzące nieszczęście jest skutkiem rzuconej na nią klątwy."
 pam_adorcism_battle_guidance_modifier: "Strategia objawiona"
 pam_adorcism_battle_guidance_modifier_desc: "Ta postać wierzy, że duchy zesłały pomyślne wróżby na nadchodzącą bitwę."
 pam_adorcism_personal_vigor_modifier: "Siła zesłana przez duchy"
 pam_adorcism_personal_vigor_modifier_desc: "Wiara w moc rytuałów zapewnia tej postaci przewagę w pojedynkach."
 pam_adorcism_campaign_endurance_modifier: "Gospodarz ze wsparciem duchów"
 pam_adorcism_campaign_endurance_modifier_desc: "Armie tej postaci wytrzymują długie kampanie dzięki odzyskanej determinacji."
