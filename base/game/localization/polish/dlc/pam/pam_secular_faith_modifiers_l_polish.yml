l_polish:
 pam_sf_devotion_modifier: "Oddanie na rzecz dobrobytu"
 pam_sf_devotion_modifier_desc: "Ta postać złożyła prywatną przysięgę oddania, za co została po cichu wynagrodzona pobożnością i monetą."
 pam_sf_grace_modifier: "Dar łaski"
 pam_sf_grace_modifier_desc: "Ta postać dostąpiła łaski – podziękowania lub cichej przysięgi, która podnosi na duchu."
 pam_sf_consolation_modifier: "Wewnętrzny spokój"
 pam_sf_consolation_modifier_desc: "Ta postać odczuwa wewnętrzny spokój."
 pam_sf_visionary_renown_modifier: "Ogłoszenie wizji"
 pam_sf_visionary_renown_modifier_desc: "Ta postać ogłosiła przed dworem boską wizję, umacniając w ten sposób swoją pozycję."
 pam_sf_consecrated_arms_modifier: "Uświęcona broń"
 pam_sf_consecrated_arms_modifier_desc: "Broń rodowa tej postaci została pobłogosławiona w dniu świętej uczty."
 pam_sf_serenity_modifier: "Wychwalanie obrzędów publicznych"
 pam_sf_serenity_modifier_desc: "Publiczne okazywanie pobożności przez tę postać sprawiło, że zyskała ona sympatię duchowieństwa i dworu."
 pam_sf_humiliated_modifier: "Upokarzające ślubowanie"
 pam_sf_humiliated_modifier_desc: "Ta postać została zmuszona do złożenia świętego ślubowania i zamknięta w klasztorze."
 pam_sf_promised_acclaim_modifier: "Obietnica pielgrzyma"
 pam_sf_promised_acclaim_modifier_desc: "Kapłan państwowy tej postaci zobowiązał się ogłosić mieszkańcom stolicy informację o kolejnej zakończonej pielgrzymce.\n\nPo zakończeniu pielgrzymki jej [capital|El] zyska modyfikator „[GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]” na #V 15#! lat."
 pam_sf_extolled_pilgrimage_county_modifier: "Przywitanie pielgrzyma"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "Wieść o pielgrzymce władcy tej postaci rozchodzi się po całym hrabstwie ku ogromnej dumie mieszkańców."
 pam_sf_free_feast_discount_desc: "Zbliżająca się uczta"
 pam_sf_free_feast_modifier: "Pragnienie uczty"
 pam_sf_free_feast_modifier_desc: "Wizja świętego odpustu pobudziła apetyt tej postaci:\n$EFFECT_LIST_BULLET$Koszt kolejnej aktywności o nazwie [GetActivityType( 'activity_feast').GetName|l]: [gold_i] #P -100%#!\n#weak Ponoszony w momencie rozpoczęcia uczty.#!"
 pam_sf_pilgrimage_funded_modifier: "Sponsorowana pielgrzymka"
 pam_sf_pilgrimage_funded_modifier_desc: "Patron zobowiązał się pokryć część kosztów następnej pielgrzymki tej postaci:\n$EFFECT_LIST_BULLET$Koszt aktywności o nazwie [GetActivityType( 'activity_pilgrimage').GetName|l]: [gold_i] #P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "Sponsorowana pielgrzymka"
 pam_sf_ear_of_clergy_modifier: "Posłuch u duchowieństwa"
 pam_sf_ear_of_clergy_modifier_desc: "Kościół jest bardziej skłonny przystać na prośby tej postaci:\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $hof_ask_for_claim_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $hof_ask_for_gold_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $request_excommunication_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $request_legitimacy_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $ecclesiastic_grant_claim_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $strengthen_claim_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $request_enforce_succession_interaction$#!”: #P +25#!\n$EFFECT_LIST_BULLET$Akceptacja dla interakcji „#V $request_white_peace_interaction$#!”: #P +25#!"
 pam_religious_delirium_modifier: "Religijne uniesienie"
 pam_religious_delirium_modifier_desc: "Ta postać jest pewna, że przemawiają do niej same niebiosa:\n$EFFECT_LIST_BULLET$Zwiększenie [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]: #P +50%#!\n$EFFECT_LIST_BULLET$Utrata [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]: #N +50%#!"
 pam_sf_church_builder_modifier: "Budowniczy kościołów"
 pam_sf_church_builder_modifier_desc: "Po wybudowaniu pierwszego miejsca kultu ta postać wznosi kolejne kościoły nieco taniej i stopniowo zyskuje coraz większą pobożność."
 pam_sf_scriptorium_county_modifier: "U skrybów praca wre"
 pam_sf_scriptorium_county_modifier_desc: "Osiedleni uczeni przepisują i prowadzą księgi rachunkowe tej posiadłości."
 pam_sf_doctrine_clarity_modifier: "Objawienie"
 pam_sf_doctrine_clarity_modifier_desc: "Ta postać doświadczyła rzadkiej chwili olśnienia."
 pam_sf_favorable_omen_modifier: "Dobry znak"
 pam_sf_favorable_omen_modifier_desc: "Ta postać interpretuje znaki na niebie jako znak boskiej łaski, a wierni czerpią otuchę z tego błogosławieństwa."
 pam_sf_omen_of_victory_modifier: "Znak zwycięstwa"
 pam_sf_omen_of_victory_modifier_desc: "W przekonaniu, że niebiosa obiecały im zwycięstwo, ta postać i jej wojsko maszerują z odwagą."
 pam_sf_demon_torment_modifier: "Demoniczna męka"
 pam_sf_demon_torment_modifier_desc: "Ta postać jest przekonana, że dręczy ją demon i musi zbudować [holding|El], którą jest [GetBuilding('temple_01').GetName|l], lub oddać się następującej aktywności: [GetActivityType('activity_pilgrimage').GetName|l]."
 pam_sf_besieged_by_demons_modifier: "Demoniczne oblężenie"
 pam_sf_besieged_by_demons_modifier_desc: "Umysł tej postaci jest nękany przez demony; każdego dnia bredzi, miota się w konwulsjach i coraz popada w obłęd."
 pam_sf_grief_solace_modifier: "Widmowe pocieszenie"
 pam_sf_grief_solace_modifier_desc: "Ta postać odnalazła spokój i ukojenie po tym, jak rzekomo odwiedziła ją zjawa."
 pam_sf_grief_warning_modifier: "Widmowe ostrzeżenie"
 pam_sf_grief_warning_modifier_desc: "Ta postać uważa, że otrzymała ostrzeżenie od zjawy."
 pam_sf_peace_of_god_modifier: "Pokój Boży"
 pam_sf_peace_of_god_modifier_desc: "Ta postać przysięgła strzec Pokoju Bożego i egzekwuje go w całym państwie."
 pam_sf_immured_anchorite_modifier: "Zamurowany pustelnik"
 pam_sf_immured_anchorite_modifier_desc: "W murach tej świątyni zamurowano pustelnika."
 pam_sf_voice_of_jesus_modifier: "Głos Boży"
 pam_sf_voice_of_jesus_modifier_desc: "Bóg przemówił do tej postaci, ulęgnąwszy przemianie, z wyostrzonymi zmysłami, niczym dotknięta ręką Boga."
 pam_sf_stroke_of_god_modifier: "Cios Boży"
 pam_sf_stroke_of_god_modifier_desc: "Tę postać powalił nagły atak apopleksji. Lekarze nazywają to „ciosem Bożym”, który zalewa mózg i pozostawia po sobie okaleczone ciało oraz umysł."
 pam_sf_lingering_stench_modifier: "Nieustępujący smród"
 pam_sf_lingering_stench_modifier_desc: "Niezależnie od starań, ta postać nie może pozbyć się woni stóp nędzarza, które obmywała."
 pam_sf_site_of_miracle_county_modifier: "Miejsce cudu"
 pam_sf_site_of_miracle_county_modifier_desc: "W tym hrabstwie miało miejsce cudowne wydarzenie, które przyciąga zarówno pielgrzymów, jak i bandytów."
 pam_sf_consecrated_county_modifier: "Niedawne uświęcenie"
 pam_sf_consecrated_county_modifier_desc: "W tym hrabstwie znajduje się niedawno poświęcony kościół."
 pam_sf_flagellant_cults_county_modifier: "Sekty biczowników"
 pam_sf_flagellant_cults_county_modifier_desc: "Grupy pokutników biczują się na ulicach tego hrabstwa."
 pam_sf_relic_procession_county_modifier: "Objawienie świętego"
 pam_sf_relic_procession_county_modifier_desc: "Przez to hrabstwo niesiono w uroczystej procesji relikwię świętego, a mieszkańcy chodzą odtąd z wyżej podniesioną głową."
 pam_sf_blessed_bell_county_modifier: "Ochrzczony dzwon"
 pam_sf_blessed_bell_county_modifier_desc: "Dzwon kościelny w tym hrabstwie został umyty, namaszczony i nazwany. Mieszkańcy wierzą, że jego dźwięk rozprasza zarówno burzę, jak i złe moce."
 pam_sf_church_ale_county_modifier: "Piwo kościelne"
 pam_sf_church_ale_county_modifier_desc: "Władca tego hrabstwa wypił kościelne piwo w towarzystwie przedstawicieli parafii, a parafianie wciąż o tym plotkują."
 pam_sf_safe_passage_modifier: "Bezpieczny przejazd"
 pam_sf_safe_passage_modifier_desc: "Po akcji ratunkowej na drodze temu podróżnemu zapewniono eskortę i bezpieczny przejazd."
 pam_sf_waylaid_road_modifier: "Napaść na drodze"
 pam_sf_waylaid_road_modifier_desc: "Wyprawa tego podróżnika stała się niebezpieczna po napadzie, do którego doszło na drodze."
 pam_sf_penance_lustful_modifier: "Tłumienie żądzy"
 pam_sf_penance_lustful_modifier_desc: "Ta postać odpokutowuje za żądzę, opanowując swoje pragnienia kosztem mniejszej liczby dzieci."
 pam_sf_penance_chaste_modifier: "Odrzucenie powściągliwości"
 pam_sf_penance_chaste_modifier_desc: "Ta postać odrzuca cnotę czystości, którą jej wiara uznaje za grzeszną, wbrew własnej naturze."
 pam_sf_penance_gluttonous_modifier: "Post"
 pam_sf_penance_gluttonous_modifier_desc: "Ta postać pości w pokucie za obżarstwo, narażając ciało na wyczerpanie, by nakarmić duszę."
 pam_sf_penance_temperate_modifier: "Przerwanie długiego postu"
 pam_sf_penance_temperate_modifier_desc: "Ta postać porzuca wstrzemięźliwość, którą jej wiara uznaje za grzeszną, oddając się rozrzutności zarówno w sercu, jak i w wydatkach."
 pam_sf_penance_greedy_modifier: "Pokutne jałmużnictwo"
 pam_sf_penance_greedy_modifier_desc: "Ta postać rozdaje jałmużnę w ramach pokuty za chciwość, która ogołociła zarówno jej skarbiec, jak i sumienie."
 pam_sf_penance_generous_modifier: "Zwinięcie sakwy"
 pam_sf_penance_generous_modifier_desc: "Ta postać powstrzymuje się od okazywania hojności, którą jej wiara uznaje za grzeszną; jest dzięki temu bogatsza, ale budzi niechęć."
 pam_sf_penance_lazy_modifier: "Pokutna praca"
 pam_sf_penance_lazy_modifier_desc: "Ta postać podejmuje się wyczerpującej pracy w ramach pokuty za lenistwo."
 pam_sf_penance_diligent_modifier: "Wymuszony odpoczynek"
 pam_sf_penance_diligent_modifier_desc: "Ta postać rezygnuje z pracowitości, którą jej wiara uznaje za grzeszną – jest spokojniejsza, ale mniej produktywna."
 pam_sf_penance_wrathful_modifier: "Pohamowanie gniewu"
 pam_sf_penance_wrathful_modifier_desc: "Ta postać poskramia swój gniew w akcie pokuty; jej ręka łagodnieje, a ostrze staje się tępe."
 pam_sf_penance_calm_modifier: "Rozbudzanie ducha"
 pam_sf_penance_calm_modifier_desc: "Ta postać rozpala spokój, który jej wiara uznaje za grzeszny, w żarliwość – jest zacieklejsza, ale bardziej zmęczona."
 pam_sf_penance_patient_modifier: "Zwiększenie tempa"
 pam_sf_penance_patient_modifier_desc: "Ta postać odrzuca cierpliwość, którą jej wiara uznaje za grzeszną. Teraz działa pospiesznie i żyje w niepokoju."
 pam_sf_penance_impatient_modifier: "Kultywowanie cierpliwości"
 pam_sf_penance_impatient_modifier_desc: "Ta postać w ramach pokuty uczy się panować nad swoim niecierpliwym temperamentem. Czekanie działa jej na nerwy."
 pam_sf_penance_arrogant_modifier: "Praktykowanie pokory"
 pam_sf_penance_arrogant_modifier_desc: "Ta postać porzuca swoją wyniosłą postawę w akcie pokuty, a wraz z nią słabnie jej renoma."
 pam_sf_penance_humble_modifier: "Przyjęcie dumnej postawy"
 pam_sf_penance_humble_modifier_desc: "Ta postać przedkłada dumę, której wymaga od niej wiara, nad pokorę – jest znana, ale uchodzi za próżną."
 pam_sf_penance_deceitful_modifier: "Przysięga szczerości"
 pam_sf_penance_deceitful_modifier_desc: "Ta postać dotrzymuje ślubu uczciwości w akcie pokuty za oszustwo, a jej przebiegłość uległa osłabieniu."
 pam_sf_penance_honest_modifier: "Nauka udawania"
 pam_sf_penance_honest_modifier_desc: "Ta postać uczy się podstępności, którą jej wiara ceni bardziej niż uczciwość – staje się bardziej przebiegła, ale mniej godna zaufania."
 pam_sf_penance_craven_modifier: "Konfrontacja ze strachem"
 pam_sf_penance_craven_modifier_desc: "Ta postać wytrwale znosi karę za tchórzostwo i z przerażeniem przeżywa każdą jej chwilę."
 pam_sf_penance_brave_modifier: "Miarkowanie odwagi"
 pam_sf_penance_brave_modifier_desc: "Ta postać hamuje swoją waleczność, którą jej wiara uznaje za grzeszną, skłaniając się ku ostrożności. Przygasł w niej wojowniczy charakter."
 pam_sf_penance_shy_modifier: "Wymuszanie śmiałości"
 pam_sf_penance_shy_modifier_desc: "Ta postać stara się zachowywać śmiałą postawę, by odpokutować swoją nieśmiałość, a każde zebranie jest dla niej próbą."
 pam_sf_penance_gregarious_modifier: "Zanurzenie się w ciszy"
 pam_sf_penance_gregarious_modifier_desc: "Ta postać wycofuje się z grzesznej zabawy w ciszę, tracąc przez to część przyjaciół."
 pam_sf_penance_ambitious_modifier: "Pohamowanie ambicji"
 pam_sf_penance_ambitious_modifier_desc: "Ta postać spuszcza ambitne spojrzenie oczy w akcie pokuty, jednocześnie tracąc swoją renomę."
 pam_sf_penance_content_modifier: "Tlące się pragnienie"
 pam_sf_penance_content_modifier_desc: "Ta postać budzi w sobie pragnienie wbrew ukontentowania, które jej wiara uznaje za grzeszne – jest niespokojna i nienasycona."
 pam_sf_penance_arbitrary_modifier: "Sprawiedliwe rządy"
 pam_sf_penance_arbitrary_modifier_desc: "Ta postać sprawuje władzę z niezmienną sprawiedliwością, pokutując za dawne samowolne rządy – jest sprawiedliwsza, ale też uboższa."
 pam_sf_penance_just_modifier: "Kapryśne rządy"
 pam_sf_penance_just_modifier_desc: "Ta postać rządzi zgodnie z kaprysami, które jej wiara przedkłada nad sprawiedliwość – jest bogatsza, ale mniej kochana."
 pam_sf_penance_cynical_modifier: "Odnowienie wiary"
 pam_sf_penance_cynical_modifier_desc: "Ta postać na nowo roznieca w sobie wiarę, pokutując za cynizm – a ta uwiera niczym nierozchodzone buty."
 pam_sf_penance_zealous_modifier: "Miarkowanie zapału"
 pam_sf_penance_zealous_modifier_desc: "Ta postać hamuje zapał, który jej wiara nosi w nadmiarze, a wierni odnoszą się do niej z rezerwą."
 pam_sf_penance_paranoid_modifier: "Nauka zaufania"
 pam_sf_penance_paranoid_modifier_desc: "Ta postać uczy się pokładać ufność, pokutując za podejrzliwość – otwiera drzwi i opuszcza gardę."
 pam_sf_penance_trusting_modifier: "Ochrona serca"
 pam_sf_penance_trusting_modifier_desc: "Ta postać strzeże serca, które jej wiara uważa za zbyt ufne – jest bardziej ostrożna, ale postrzegana jako oziębła."
 pam_sf_penance_compassionate_modifier: "Uciszanie miłosierdzia"
 pam_sf_penance_compassionate_modifier_desc: "Ta postać ucisza miłosierdzie, które jej wiara uznaje za grzeszne, a jej surowa twarz budzi strach u innych."
 pam_sf_penance_callous_modifier: "Kultywowanie miłosierdzia"
 pam_sf_penance_callous_modifier_desc: "Ta postać kultywuje miłosierdzie, pokutując za swoje nieczułe serce – staje się łagodniejsza, a strach, na którym się opierała, zaczyna zanikać."
 pam_sf_penance_sadistic_modifier: "Odrzucenie okrucieństwa"
 pam_sf_penance_sadistic_modifier_desc: "Ta postać wyrzeka się okrucieństwa w ramach pokuty, a strach, jaki ono wywołało, powoli zanika."
 pam_sf_penance_stubborn_modifier: "Naginanie woli"
 pam_sf_penance_stubborn_modifier_desc: "Ta postać koryguje swoją upartą wolę w ramach pokuty, ustępując tam, gdzie wcześniej by tego nie zrobiła."
 pam_sf_penance_fickle_modifier: "Uspokojenie duszy"
 pam_sf_penance_fickle_modifier_desc: "Ta postać wytrwale podąża ścieżką pokuty za swoją kapryśną duszę, co jest dla niej irytujące."
 pam_sf_penance_eccentric_modifier: "Otwartość na konwencje"
 pam_sf_penance_eccentric_modifier_desc: "Ta postać odsuwa na bok dziwaczne myśli, pokutując za swoją ekscentryczność."
 pam_sf_penance_vengeful_modifier: "Praktykowanie wyrozumiałości"
 pam_sf_penance_vengeful_modifier_desc: "Ta postać porzuca dawne urazy w ramach pokuty za mściwość – jest łagodniejsza wobec jeńców, ale mniej skora do odwetu."
 pam_sf_penance_forgiving_modifier: "Pielęgnowanie urazy"
 pam_sf_penance_forgiving_modifier_desc: "Ta postać żywi urazę, której jej wiara wymaga zamiast przebaczenia – jest bardziej oschła i budzi większy strach."
 pam_mystical_birthright_spiritual_leader_modifier: "Przywilej od urodzenia"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Duchowe wychowanie tej postaci ukształtowała jej wrodzona cecha."
 pam_personal_sacrifice_of_wealth_county_modifier: "Pobożny dar"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "Pobożna ofiara władcy wspiera rozwój tego hrabstwa."
 pam_sf_grinding_modifier: "Bezduszna harówka"
 pam_sf_grinding_modifier_desc: "Ta postać przepracowuje się, na czym cierpi jej dusza."
