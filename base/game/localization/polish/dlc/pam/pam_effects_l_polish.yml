 pam_tenet_events.0004.opening.hof: "Wasza Czcigodność!"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "Piszę, by poinformować, że obrządek znany jako [diverged_rite.GetName|l] przyjął dogmat „[diverged_added_tenet.GetBaseName]” jako jeden ze swoich dogmatów.\n\nDzięki obrządkowi, który dobrze prowadzi swoich wyznawców, wzmocni się wiara [diverged_rite.GetFaith.GetAdjective|l]. To prosta mądrość."
 pam_tenet_events.0004.desc.forward_doctrine: "Piszę, by poinformować, że obrządek znany jako [diverged_rite.GetName|l] oficjalnie teraz przestrzega doktryny „[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )]”.\n\nDzięki obrządkowi, który dobrze prowadzi swoich wyznawców, wzmocni się wiara [diverged_rite.GetFaith.GetAdjective|l]. To prosta mądrość."
 pam_tenet_events.0004.desc.backward_tenet: "Piszę, by poinformować, że obrządek znany jako [diverged_rite.GetName|l] przestrzega teraz dogmatu „[diverged_added_tenet.GetBaseName]”.\n\nDzięki temu my i [diverged_rite.GetFaith.GetMainRite.GetName|l] jesteśmy bliżej siebie. Gdy wszystkie obrządki głoszą to samo, wiara [diverged_rite.GetFaith.GetAdjective|l] rozkwita!"
 pam_tenet_events.0004.desc.backward_doctrine: "Piszę, by poinformować, że obrządek znany jako [diverged_rite.GetName|l] teraz przestrzega doktryny „[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )]”.\n\nDzięki temu my i [diverged_rite.GetFaith.GetMainRite.GetName|l] jesteśmy bliżej siebie. Gdy wszystkie obrządki głoszą to samo, wiara [diverged_rite.GetFaith.GetAdjective|l] rozkwita!"
 pam_tenet_events.0004.a: "Niech tak będzie."
 pam_tenet_events.0004.a.tt.diverged: "[rite|E] o nazwie [diverged_rite.GetName|l] jeszcze bardziej oddzielił się od [Concept('mainline_rite', 'obrządku tradycyjnego')|E] znanego jako [diverged_rite.GetFaith.GetMainRite.GetName|l], przez co wartość [fervor_i] [Concept('fervor', 'gorliwości')|E] co roku spada szybciej"
 pam_tenet_events.0004.a.tt.consolidated: "[rite|E] o nazwie [diverged_rite.GetName|l] zbliżył się do [Concept('mainline_rite', 'obrządku tradycyjnego')|E] znanego jako [diverged_rite.GetFaith.GetMainRite.GetName|l], przez co wartość [fervor_i] [Concept('fervor', 'gorliwości')|E] co roku spada wolniej"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "Połowa mojego majątku trafiła w ręce ubogich, a dzięki temu moja dusza ubogaciła się.\n\nTeraz proszę, zrób to samo. Puste dłonie znajdują przebaczenie. Pełne pozostają zapamiętane."
 pam_tenet_events.0005.a: "Skoro [redistributing_liege.GetTitleAsNameNoTooltip] to zniesie, to ja również."
 pam_tenet_events.0005.b: "Moje dłonie są pełne i takie pozostaną."
 pam_tenet_events.0005.b.tt: "W waszych szkatułach będzie, jak jest, a wasze [counties|El] nie dostaną nic"
 pam_tenet_events.0006.t: "Ukryte nauki"
 pam_tenet_events.0006.desc_intro: "Przed moimi oczami leżą otwarte, nieoznaczone księgi z odsłoniętymi schematami i nazwami, których nikt nie powinien wymawiać. To wiedza, przed którą ostrzega się zwykłych wiernych, by jej nie zgłębiali, a ja mam zapewnioną całą noc z nią."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName] podchodzi aż do progu i tam się zatrzymuje.\n\n– Nie bez powodu te księgi są trzymane pod kluczem zapieczętowane modlitwą – szepcze. – Tego, co w nich przeczytasz, nie będziesz w stanie zapomnieć."
 pam_tenet_events.0006.desc_alone: "\n\nNikt z mojego otoczenia nie będzie mi towarzyszyć podczas tej lektury. Cokolwiek się kryje na tych kartach, zmierzę się z tym w pojedynkę."
 pam_tenet_events.0006.a: "W tych księgach wszystko jest dla mnie zrozumiałe. Czytaj dalej."
 pam_tenet_events.0006.b: "Czytaj, dopóki lampa świeci."
 pam_tenet_events.0007.t: "Sobór umarłych"
 pam_tenet_events.0007.desc: "Drzwi są zaryglowane, a lampy pogaszone. Świat kurczy się, aż pozostaje tylko pojedynczy, migoczący płomień i gęsty dym oplatający mnie ze wszystkich stron. Od razu wyczuwam obecność osoby znanej jako [guiding_forebear.GetTitledFirstName] miotającej się za zasłoną dymu.\n\nW ciemnościach obnażam bolesne troski, których nie śmiem nazwać w świetle dnia. Duchy nie odpowiadają tak jak śmiertelnicy, lecz poprzez grobowe szepty, trzask niespokojnego płomienia, ukradkowe muśnięcie niewidzialnego powietrza i zjawy poruszające się w dymie.\n\nDesperacko pragnąc wskazówek, wytężam wzrok, wypatrując każdego znaku niosącego odpowiedź, której tak bardzo potrzebuję."
 pam_tenet_events.0007.a: "Użycz mi mądrości, która cię prowadziła."
 pam_tenet_events.0007.b: "Obdarz mnie spokojem, który pozwoli mi wytrwać do rana."
 pam_tenet_events.0008.t: "Wspominam siebie"
 pam_tenet_events.0008.desc: "[remembered_forebear.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))]… Pieczęć i kielich wyjęte z [remembered_forebear.Custom('PL_jego_jej')] dłoni oraz pierścień zsunięty z [remembered_forebear.Custom('PL_jego_jej')] palca leżą przede mną, a ja siedzę nad nimi tak długo, aż przestają wydawać się pożyczone.\n\nNie mam żadnej wizji. Nie słyszę głosów. Nikt mi o [remembered_forebear.Custom('PL_nim_niej')] nie opowiada. Nawiedza mnie wspomnienie o mojej osobie, ale mam wrażenie, że wiązało się z życiem, a nie ze stratą."
 pam_tenet_events.0008.a: "To właśnie ja: [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l] w najczystszej postaci."
 pam_tenet_events.0008.b: "W moim sercu budzi się [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l] i wiem, że to właśnie ja."
 pam_tenet_events.0008.c: "[remembered_trait_3.GetNameNoTooltip( ROOT.Char )]. Tak można było mnie kiedyś opisać i tak będzie mnie można określić znowu."
 pam_tenet_events.0008.d: "Tamte żywota dobiegły końca. Ja wciąż pozostaję sobą."
 pam_tenet_events.0009.t: "Otwórz skrzynie"
 pam_tenet_events.0009.desc_intro: "Wniesiono skrzynie na podwórze i wciśnięto mi w dłoń klucze."
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.GetTitledFirstName] przechadza się alejką.\n\n– Hojny [ROOT.Char.GetTitleAsNameNoTooltip] to wciąż [ROOT.Char.GetTitleAsNameNoTooltip] – mówi. – Hojność nie zapewnia zbawienia. Ono przychodzi wtedy, gdy się nie ma już nic."
 pam_tenet_events.0009.desc_alone: " Nikt nie wyszedł, by stanąć u mego boku. Zarządcy trzymają się na dystans i czekają."
 pam_tenet_events.0009.desc_end: "\n\nMoje mogę otworzyć jednym skinieniem dłoni. Po resztę muszę sięgnąć."
 pam_tenet_events.0009.a: "Rozłupać zamki. Niech każdy weźmie swoją część."
 pam_tenet_events.0009.flavor: "Twoi wasale, którzy mają nadmiar pieniędzy, zostaną zmuszeni do otwarcia swych szkatuł. Twoje hrabstwa staną się bardziej swobodne i trudniej je będzie kontrolować, a ci, którzy nie pochwalają tej filozofii, będą żywić do ciebie urazę."
 pam_tenet_events.0009.b: "Zaczekajcie. Wystarczy, że pozbędę się własnego bogactwa."
 pam_tenet_events.0009.b.tt: "Rozdajesz tylko to, co należy do ciebie. Twoi [vassals|E] trzymają swe szkatuły zamknięte i nie żywią do ciebie urazy za twoje działania"
 pam_tenet_events.0010.t: "Co należne jest ciału"
 pam_tenet_events.0010.desc_intro: "Bicz spoczywa na swoim miejscu. Obok niego leżą kajdany i krótki nóż, sprowadzone po cichu wyłącznie z mojej inicjatywy."
 pam_tenet_events.0010.desc_alone: "\n\nNikt nie oświetli mi drogi tej nocy. Cokolwiek wezmę ze stołu, nikt tego nie zobaczy."
 pam_tenet_events.0010.a: "Będę się biczować, dopóki mój umysł nie zazna spokoju."
 pam_tenet_events.0010.b: "Nie chcę już patrzeć na ten świat."
 pam_tenet_events.0010.c: "Gdy znika żądza, znika też grzech."
