l_polish:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "Ampułka krzyżma"
 pam_holy_myron_artifact_desc_common: "Zamykane naczynie wypełnione konsekrowanym krzyżmem: [Glossary('balsam jerozolimski','pam_myron_gloss_balsam')] zmieszany z czystą oliwą, z kroplą z poprzedniej partii wmieszaną w nową, tak by łańcuch błogosławieństwa biegł nieprzerwanie od samych apostołów."
 pam_holy_myron_artifact_desc_masterwork: "Zamykane naczynie wypełnione konsekrowanym krzyżmem: [Glossary('balsam jerozolimski','pam_myron_gloss_balsam')], [Glossary('kadzidło','pam_myron_gloss_frankincense')] i [Glossary('mirra','pam_myron_gloss_myrrh')] zmieszane z czystą oliwą, z kroplą z poprzedniej partii wmieszaną w nową, tak by łańcuch błogosławieństwa biegł nieprzerwanie od samych apostołów."
 pam_holy_myron_artifact_desc_famed: "Zamykane naczynie wypełnione konsekrowanym krzyżmem: [Glossary('balsam jerozolimski','pam_myron_gloss_balsam')], [Glossary('kadzidło','pam_myron_gloss_frankincense')], [Glossary('mirra','pam_myron_gloss_myrrh')], [Glossary('olejek nardowy','pam_myron_gloss_spikenard')] i [Glossary('cynamon','pam_myron_gloss_cinnamon')] zmieszane z czystą oliwą, z kroplą z poprzedniej partii wmieszaną w nową, tak by łańcuch błogosławieństwa biegł nieprzerwanie od samych apostołów."
 pam_holy_myron_artifact_desc_illustrious: "Zamykane naczynie wypełnione konsekrowanym krzyżmem przygotowanym z głęboką wiarą według najstarszych receptur: [Glossary('balsam jerozolimski','pam_myron_gloss_balsam')], [Glossary('kadzidło','pam_myron_gloss_frankincense')], [Glossary('mirra','pam_myron_gloss_myrrh')], [Glossary('olejek nardowy','pam_myron_gloss_spikenard')], [Glossary('cynamon','pam_myron_gloss_cinnamon')], [Glossary('kalamus','pam_myron_gloss_calamus')] i [Glossary('kasja','pam_myron_gloss_cassia')] zmieszane z czystą oliwą, z kroplą z poprzedniej partii wmieszaną w nową, tak by łańcuch błogosławieństwa biegł nieprzerwanie od samych apostołów."
 pam_holy_myron_charges_line: "Pozostała liczba namaszczeń: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "Słynny balsam jerozolimski: wonna żywica, którą „płacze” niski krzew uprawiany w Jerychu i En Gedi nad Morzem Martwym. Jedna jego kropla stanowiła najdroższe perfumy starożytnego świata. To główny składnik krzyżma, a jego pilnie strzeżone gaje nie rosną nigdzie indziej."
 pam_myron_gloss_frankincense: "Złocista żywica pozyskiwana z sękatych drzew południowej Arabii, i niemal wyłącznie stamtąd. Palona przed ołtarzami od niepamiętnych czasów nadaje krzyżmu słodki zapach, gdy jego dym unosi modlitwy ku niebu."
 pam_myron_gloss_myrrh: "Gorzka, krwistoczerwona żywica pochodząca z ciernistych drzew południowej Arabii i Rogu Afryki. W Księdze Wyjścia wymieniona została wśród składników świętego oleju służącego do namaszczenia. Trzej Królowie złożyli ją przed Dzieciątkiem Jezus, a wierni przynieśli do Jego grobu."
 pam_myron_gloss_spikenard: "Gęsty, słodkawy olej tłoczony z korzeni rośliny rosnącej wyłącznie w wysokich górach Wschodu, znoszony stamtąd do portów Indii. Takim nardem namaszczono Pana w Betanii, a cena tego namaszczenia wywołała zgorszenie wśród uczniów."
 pam_myron_gloss_cinnamon: "Słodka, wewnętrzna kora drzew z Indii i wysp dalekiego Wschodu, wymieniona w Księdze Wyjścia wśród składników świętego oleju służącego do namaszczenia. Musi przemierzyć pół świata, zanim trafi na jakikolwiek chrześcijański ołtarz."
 pam_myron_gloss_calamus: "Słodka trzcina opisana w Piśmie Świętym: aromatyczna trawa zbierana z dalekich wschodnich mokradeł, wymieniona w Księdze Wyjścia wśród składników świętego oleju służącego do namaszczenia."
 pam_myron_gloss_cassia: "Grubszy odpowiednik cynamonu. Pozyskuje się ją z kory drzew dalekiego Wschodu. Została wymieniona w Księdze Wyjścia wśród składników świętego oleju służącego do namaszczenia."
 ### Modifiers
 pam_holy_myron_vessel_modifier: "Ampułka krzyżma"
 pam_holy_myron_vessel_modifier_desc: "W tym naczyniu przechowuje się konsekrowane krzyżmo, a woń [Glossary('balsamu jerozolimskiego','pam_myron_gloss_balsam')] uświęca tego, kto go strzeże."
 pam_holy_myron_vessel_potent_modifier: "Ampułka potężnego krzyżma"
 pam_holy_myron_vessel_potent_modifier_desc: "To naczynie kryje w sobie krzyżmo o rzadkiej mocy, nasycone [Glossary('kadzidłem','pam_myron_gloss_frankincense')] i [Glossary('olejkiem nardowym','pam_myron_gloss_spikenard')]. Sam jego zapach świadczy o świętości."
 pam_chrismated_artifact_modifier: "Namaszczony"
 pam_chrismated_artifact_modifier_desc: "Artefakt ten został namaszczony krzyżmem, a woń [Glossary('mirry','pam_myron_gloss_myrrh')] wciąż się nad nim unosi."
 pam_chrismated_regalia_modifier: "Namaszczone regalia"
 pam_chrismated_regalia_modifier_desc: "Artefakt ten został namaszczony krzyżmem podczas koronacji, a błogosławieństwo to nie straciło swojej mocy."
 pam_holy_myron_pilgrim_modifier: "Przewoźnik balsamów"
 pam_holy_myron_pilgrim_modifier_desc: "Postać ta podróżuje w poszukiwaniu składników potrzebnych do przygotowania krzyżma – [Glossary('balsamu','pam_myron_gloss_balsam')], [Glossary('kadzidła','pam_myron_gloss_frankincense')] i innych, jeszcze rzadszych. Na swej drodze nie podejmuje żadnego ryzyka."
 pam_chrismated_child_modifier: "Namaszczona"
 pam_chrismated_child_modifier_desc: "Ta postać została namaszczona wkrótce po narodzinach, a dar Ducha Świętego został przypieczętowany świętym olejem."
 pam_myron_chrismated_child_modifier: "Namszczona krzyżmem"
 pam_myron_chrismated_child_modifier_desc: "Ta postać została namaszczona krzyżmem wkrótce po narodzinach – na czole noworodka spoczęła kropla [Glossary('balsamu jerozolimskiego','pam_myron_gloss_balsam')] – i łaska ta nigdy nie przeminie."
 pam_anointed_with_holy_oil_modifier: "Namaszczona świętym olejem"
 pam_anointed_with_holy_oil_modifier_desc: "Ta postać przyjęła namaszczenie chorych: [Glossary('balsam','pam_myron_gloss_balsam')] w postaci słodkiego oleju naniesiono na czoło i dłonie, co ma wzmocnić ciało i duszę w czasie próby."
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "Przygotuj krzyżmo"
 pam_prepare_holy_myron_decision_tooltip: "Wyślij swojego [Concept('court_chaplain', 'nadwornego kapelana')|E], by zgromadził niespotykane balsamy i konsekrował #V ampułkę krzyżma#! – [artifact|El], którego porcje wykorzystuje się na święte namaszczenia"
 pam_prepare_holy_myron_decision_desc: "Krzyżmo nie jest mieszanką tego, co akurat uda się zdobyć w kuchni. Pismo Święte dokładnie wymienia jego składniki – [Glossary('mirrę','pam_myron_gloss_myrrh')], słodki [Glossary('cynamon','pam_myron_gloss_cinnamon')], [Glossary('kalamus','pam_myron_gloss_calamus')] i [Glossary('kasję','pam_myron_gloss_cassia')] zmieszane z czystą oliwą. Każdy składnik musi zostać zebrany na ziemiach, gdzie rośnie.\n\nIm dalej sięga wyprawa, tym bogatsza jest mieszanka, która przywożona jest do domu i konsekrowana. Ale droga jest długa i rzadko łaskawa – bandyci i choroby mogą uszczuplić ilość towaru lub odebrać życie przewoźnikowi."
 pam_prepare_holy_myron_decision_confirm: "Wyślij wyprawę"
 pam_prepare_holy_myron_decision_needs_chaplain: "Twój [court_chaplain|El] musi być osobą dorosłą, która jest dostępna i obecnie nie podróżuje"
 pam_prepare_holy_myron_decision_already_owned: "Nie możesz mieć ampułki krzyżma"
 pam_prepare_holy_myron_decision_journey_underway: "Twój [court_chaplain|El] już gromadzi balsamy"
 pam_prepare_holy_myron_decision_levant_name: "Balsam jerozolimski"
 pam_prepare_holy_myron_decision_levant_desc: "Twój [court_chaplain|El] zbiera [Glossary('balsam jerozolimski','pam_myron_gloss_balsam')] w miejscu znanym jako #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. Jego jedynym celem wyprawy jest najprostsza z możliwych mieszanek.\n\nW rezultacie powstanie [Concept('common', 'zwykła')|E] ampułka krzyżma."
 pam_prepare_holy_myron_decision_arabia_name: "Balsam i kadzidło"
 pam_prepare_holy_myron_decision_arabia_desc: "Twój [court_chaplain|El] zbiera [Glossary('balsam','pam_myron_gloss_balsam')] w miejscu znanym jako #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, a następnie [Glossary('kadzidło','pam_myron_gloss_frankincense')] i [Glossary('mirrę','pam_myron_gloss_myrrh')] w miejscu o nazwie #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. Musi odwiedzić dwa miejsca, by zdobyć składniki.\n\nW rezultacie postanie prawdziwie [Concept('masterwork', 'mistrzowska')|E] ampułka krzyżma."
 pam_prepare_holy_myron_decision_india_name: "Każdy poświęcony składnik"
 pam_prepare_holy_myron_decision_india_desc: "Twój [court_chaplain|El] zbiera [Glossary('balsam','pam_myron_gloss_balsam')] w miejscu znanym jako #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('kadzidło','pam_myron_gloss_frankincense')] i [Glossary('mirrę','pam_myron_gloss_myrrh')] na ziemiach o nazwie #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, a [Glossary('olejek nardowy','pam_myron_gloss_spikenard')] i [Glossary('cynamon','pam_myron_gloss_cinnamon')] w okolicy, która nosi nazwę #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Ma do przebycia długą drogę.\n\nW rezultacie powstanie [Concept('famed', 'słynna')|E] ampułka krzyżma. Jeśli [court_chaplain|El] będzie przestrzegać wiernie starej receptury, istnieje #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! szansa, której wartość zależy od [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis] poziomu [Concept('learning', 'nauki')|E], by zamiast niej powstała ampułka [Concept('illustrious', 'znamienita')|E]."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "Musisz być w stanie zapłacić [GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] szt. [gold_i] [Concept('gold', 'złota')|E]"
 pam_prepare_holy_myron_decision_afford_india_tt: "Musisz być w stanie zapłacić [GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] szt. [gold_i] [Concept('gold', 'złota')|E]"
 pam_prepare_holy_myron_journey_toast: "Wyrusza wyprawa po krzyżmo"
 pam_prepare_holy_myron_journey_toast_tt: "Twój [court_chaplain|El] wyrusza, żeby zebrać składniki krzyżma"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Twój [court_chaplain|El] wyrusza do miejsca znanego jako #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. Gdy wróci, konsekrowana zostanie [Concept('common', 'zwykła')|E] ampułka krzyżma – o ile droga okaże się dla [ROOT.Char.GetCouncillor('councillor_court_chaplain').Custom('PL_niego_niej')] łaskawa"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Twój [court_chaplain|El] wyrusza do miejsca znanego jako #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, by następnie dotrzeć do ziem o nazwie #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. Gdy wróci, konsekrowana zostanie [Concept('masterwork', 'mistrzowska')|E] ampułka krzyżma. Jednak bandyci napotkani na szlaku lub inne nieszczęścia mogą uszczuplić ilość towarów"
 pam_prepare_holy_myron_decision_india_effect_tt: "Twój [court_chaplain|El] odwiedzi kolejno miejsca znane jako #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! i #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Gdy wróci, konsekrowana zostanie [Concept('famed', 'słynna')|E] ampułka krzyżma. Istnieje #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! szansa, by zamiast niej powstała ampułka [Concept('illustrious', 'znamienita')|E], jednak bandyci napotkani na szlaku lub inne nieszczęścia mogą uszczuplić ilość towarów"
 ### Journey events
 pam_holy_myron.0011.opening: "Wieści dla osoby, którą jest [ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)]."
 pam_holy_myron.0011.desc_levant: "Piszę znad brzegu Morza Słonego, gdzie [Glossary('balsam jerozolimski','pam_myron_gloss_balsam')] sączy się z naciętej kory jak złote łzy. Plantatorzy zaciekle się targowali, ale żywica jest autentyczna – jedna kropla na nadgarstku napełnia wonią całe pomieszczenie. Pierwszy ze składników już mam."
 pam_holy_myron.0011.desc_arabia: "Droga po kadzidło była długa, a studnie oddalone od siebie, ale w Zufarze znaleźliśmy to, po co przybyliśmy: [Glossary('kadzidło','pam_myron_gloss_frankincense')] blade jak poranny lód oraz [Glossary('mirrę','pam_myron_gloss_myrrh')] ciemną jak stara krew. Tutejsi mistrzowie karawan twierdzą, że żadna żywica na świecie nie dorównuje tej, która przechodzi przez tutejsze porty. Wierzę im i zapłaciłem odpowiednią cenę."
 pam_holy_myron.0011.desc_india: "Przeprawa morska wystawiła na próbę każdego na pokładzie, ale targi u wybrzeży Malabaru kryją prawdziwe cuda: [Glossary('olejek nardowy','pam_myron_gloss_spikenard')] z wysokich gór oraz [Glossary('cynamon','pam_myron_gloss_cinnamon')] słodszy niż wszystkie, jakie znam. Ostatni ze składników jest już w naszych rękach. Wracamy do domu."
 pam_holy_myron.0011.a: "Oby reszta drogi minęła nam szybko."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U] musi wiedzieć, że doszło do nieszczęścia!"
 pam_holy_myron.0012.desc: "Uzbrojeni ludzie blokują nam drogę. Nazywają siebie poborcami myta, choć żaden władca nigdy nie dał im takiego prawa. Policzyli nasze skrzynie i znają ich wartość, a przepuszczą nas bez grabieży za odpowiednią opłatą.\n\nCzekam na Twój rozkaz i pilnuję balsamów."
 pam_holy_myron.0012.a: "Zapłać im. Krzyżmo jest warte więcej niż złoto."
 pam_holy_myron.0012.b: "Kościelne fundusze nie służą do opłacania rzezimieszków."
 pam_holy_myron.0012.b.tt: "Zebrane balsamy zostaną zrabowane, a powstałe krzyżmo będzie #N niższej jakości#!"
 pam_holy_myron.0013.opening: "Wieści dla osoby, którą jest [ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)]."
 pam_holy_myron.0013.desc: "Dopadła mnie w drodze gorączka. Ręce drżą, gdy piszę ten list, a żona karczmarza zaklina się o skuteczności trzech różnych lekarstw, z których każde podlejsze jest od poprzedniego. Nie lękaj się o balsamy – są szczelnie zamknięte, zapieczętowane i strzeżone lepiej niż ja. Wyruszę w dalszą podróż, gdy tylko zdołam ustać na nogach."
 pam_holy_myron.0013.a: "Będę się za [myron_chaplain.Custom('PL_niego_nia')] modlić."
 pam_holy_myron_journey_abandoned_toast: "Wyprawa po krzyżmo zostaje przerwana"
 pam_holy_myron.0020.t: "Koniec podróży"
 pam_holy_myron.0020.desc: "List od kupca zawiera najświeższe wieści: [myron_chaplain.GetTitledFirstName], osoba wysłana przeze mnie po składniki krzyżma, umiera daleko od domu. Balsamy rozeszły się wśród obcych. Ani dzięki moim środkom, ani dzięki [myron_chaplain.GetHerHis] pracy nie powstanie żadne krzyżmo."
 pam_holy_myron.0020.a: "Niech otoczy [myron_chaplain.Custom('PL_go_ja')] łaska [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_holy_myron.0100.t: "Konsekracja krzyżma"
 pam_holy_myron.0100.desc.intro: "Po długiej i męczącej podróży wreszcie wraca do mnie [myron_chaplain.GetTitledFirstName], a mój dwór wyczuwa ładunek, zanim jeszcze go ujrzy. Za zamkniętymi drzwiami przygotowywana jest mieszanka olejów i do nowego krzyżma dodawana jest kropla starego – tak jak czyniono to od czasów apostołów.\n\n"
 pam_holy_myron.0100.desc_full: "Wszystkie składniki przetrwały podróż. Złociste i wonne gotowe krzyżmo zostaje przelane do ampułki i postawione przed moim ołtarzem."
 pam_holy_myron.0100.desc_robbed: "Sporą część balsamów utracono w czasie podróży, więc mieszanka jest rzadsza, niż w moich marzeniach. Jednak konsekracja dopełnia to, co zostało uszczuplone i mimo wszystko przed moim ołtarzem staje ampułka krzyżma."
 pam_holy_myron.0100.a: "Łańcuch błogosławieństwa nie został przerwany."
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "Ostatnie namaszczenie"
 pam_holy_myron.0200.desc: "Żałobnicy rozstępują się, gdy podchodzę do mar. Przede mną niesiony jest niezwykły artefakt. To [pam_holy_myron_artifact.GetName|l]. Na oczach zgromadzonego dworu znak krzyża wykonany krzyżmem na czole wyniesie zmarłą osobę, którą jest [deceased.GetTitledFirstName], przed tron [ROOT.Char.GetFaith.HighGodNamePossessive], naznaczając [deceased.Custom('PL_go_ja')] jako osobę namaszczoną. To zaszczyt, którego świadkami będą wszyscy obecni i o którym będą długo opowiadać. Jednak każda kropla, którą wylewam na osobę zmarłą, to kropla, której żywi nigdy nie ujrzą."
 pam_holy_myron.0200.a: "Niech [deceased.GetFirstNameNoTooltip] otrzyma namaszczenie."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#! zyska większą przychylność w oczach tych, którzy będą rozważać przyjęcie [deceased.Custom('PL_jego_jej')] do grona świętych"
 pam_holy_myron.0200.b: "Krzyżmo jest dla żyjących."
 pam_holy_myron.0200.b.tt: "Zachowujesz krzyżmo dla tych, którym wciąż może ono pobłogosławić"
 ### Spending the oil
 pam_holy_myron_spend_tt: "Wykorzystano jedną porcję z ampułki krzyżma"
 pam_holy_myron_spend_last_tt: "Wykorzystano #N ostatnią#! porcję z ampułki krzyżma – #N stracisz#! opróżnione naczynie"
 pam_holy_myron_vessel_spent_toast: "Ampułka wysycha"
 pam_holy_myron_vessel_spent_tt: "Po wykorzystaniu ostatniej porcji krzyżma, naczynie zostaje usunięte"
 ### Coronation
 pam_holy_myron_coronation_option: "Niech krzyżmo przypieczętuje tę władzę."
 pam_holy_myron_coronation_option.flavor: "Wykorzystaj ostatnią porcję krzyżma na własne namaszczenie."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nArtefakt ten został namaszczony krzyżmem podczas koronacji i wciąż zapewnia błogosławieństwo."
 pam_holy_myron_coronation_memory: "– namaszczono krzyżmem"
 pam_holy_myron_coronation_memory_desc: "Podczas mojej koronacji osoba znana jako [anointer.GetTitledFirstName] namaściła mnie krzyżmem."
 pam_holy_myron_coronation_memory_desc_second_perspective: "podczas twojej koronacji osoba znana jako [anointer.GetTitledFirstName] namaściła cię krzyżmem."
 pam_holy_myron_coronation_memory_desc_third_perspective: "Podczas swojej koronacji osoba znana jako [owner.GetTitledFirstName] została namaszczona krzyżmem."
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "Namaść artefakt krzyżmem"
 pam_anoint_artifact_decision_tooltip: "Wykorzystaj porcję krzyżma, aby oznaczyć jeden ze swoich [Concept('artifacts', 'artefaktów')|E] jako [sanctified|El], niezależnie od tego, na co zwykle pozwalają twoje dogmaty"
 pam_anoint_artifact_decision_desc: "Krzyżmo nie potrzebuje zgody duchowieństwa. Czegokolwiek dotknie – ostrza, księgi czy błyskotki – zostaje [Concept('sanctified', 'uświęcone')|E] dla wiary znanej jako [ROOT.Char.GetFaith.GetName|l] dzięki samemu tylko olejowi i żaden dogmat czy biskup nie może się temu przeciwstawić."
 pam_anoint_artifact_decision_confirm: "Namaść"
 pam_anoint_artifact_decision_no_item_selected: "Nie wybrano [Concept('artifact', 'artefaktu')|E]"
 pam_anoint_artifact_needs_myron_tt: "Musisz posiadać #V ampułkę krzyżma#!, w której pozostał jeszcze olej"
 pam_anoint_artifact_has_eligible_artifact_tt: "Musisz posiadać [artifact|El], który nie został jeszcze [sanctified|El]"
 pam_anoint_artifact_not_myron_tt: "Krzyżmo nie może namaścić samo siebie"
 pam_anoint_artifact_not_already_chrismated_tt: "Nie może być już namaszczone krzyżmem"
 pam_anoint_artifact_toast: "Namaszczony krzyżmem artefakt"
 pam_chrismated_artifact_name: "[pam_anointed_artifact.GetNameNoTooltip] – artefakt namaszczony krzyżmem"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\nTen artefakt został namaszczony krzyżmem i delikatnie połyskuje świętym olejem."
 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "Podaruj krzyżmo"
 pam_give_holy_myron_interaction_desc: "Napełnij nową ampułkę własnym krzyżmem i podaruj ją osobie znanej jako [recipient.GetShortUINameNotMe]. Liczba ładunków w twoim naczyniu zmniejszy się o jeden, ale uzyskasz [piety|El] i wdzięczność osoby obdarowanej."
 pam_give_holy_myron_recipient_toast: "Dar krzyżma"
 pam_give_holy_myron_recipient_tt: "Otrzymujesz [common|El] [artifact|El] – ampułkę krzyżma z jednym ładunkiem do wykorzystania"
 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "Chryzmacja noworodka"
 pam_holy_myron_unction_toast: "Namaszczenie chorych"
 pam_holy_myron.0300.t: "Pieczęć ducha"
 pam_holy_myron.0300.desc: "[child.GetFirstName] wyje, gdy [myron_officiant.GetFaith.PriestNeuter|l] trzyma [child.Custom('PL_jego_ja')] w ramionach i przynoszą krzyżmo.\n\nKościół przechowuje wystarczającą ilość świętego oleju, żeby namaścić każdego noworodka, ale moja ampułka krzyżma jest w zasięgu ręki i wystarczy jedna lśniąca kropla jej zawartości, a [child.Custom('GetDaughterSon')] otrzyma namaszczenie na całe życie."
 pam_holy_myron.0300.desc_twin: "\n\nI nie jedną brew, lecz dwie – [pam_myron_twin.GetFirstName] leży w powijakach obok swojego bliźniaka, oczekując na tę samą pieczęć."
 pam_holy_myron.0300.a: "Poświęcony olej z kościoła wystarczy."
 pam_holy_myron.0300.b: "Tylko moje krzyżmo będzie ku temu odpowiednie."
