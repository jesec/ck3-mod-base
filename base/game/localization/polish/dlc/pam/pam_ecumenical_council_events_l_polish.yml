 ecumenical_council_events.0126.t: "Wśród rywali"
 ecumenical_council_events.0126.desc: "Cóż za udręka – wśród zgromadzonych jest [rival.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', rival)].\n\n– Z pewnością wiesz, dlaczego tu jestem – rzuca. – Powiedz, co masz do powiedzenia, wybierz stronnictwo… Tylko czekam, aby zagłosować przeciwko tobie."
 ecumenical_council_events.0126.a: "Zagłosuj zgodnie z sumieniem, a nie kierując się nienawiścią."
 ecumenical_council_events.0126.b: "Zachowaj swoją złośliwość dla siebie. Nie dam się sprowokować."
 ecumenical_council_events.0126.c: "Sobór odwraca [rival.Custom('PL_jego_jej')] uwagę…"
 ecumenical_council_events.0126.c.tt: "[scheme|E] będzie mieć #P większą#! [Concept('success_chance', 'szansę powodzenia')|E]"
 ecumenical_council_events.0126.conservatives_custom: "[ec_conservatives|E] wśród twoich [Concept('rivals', 'rywali')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0126.innovators_custom: "[ec_innovators|E] wśród twoich [Concept('rivals', 'rywali')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0129.t: "Strach na sali"
 ecumenical_council_events.0129.desc: "Ci, którzy drżą przede mną, śledzą debatę, trzęsąc jak galareta. [lead_conservative.GetTitledFirstName] nawet nie spogląda mi oczy.\n\n– Powiedz, co masz do przekazania – szepcze. – Ja już wiem, co się stanie, jeśli odmówię."
 ecumenical_council_events.0129.support: "Okrucieństwo nigdy mnie nie zawiodło."
 ecumenical_council_events.0129.support_duel: "Dopilnuję, żeby wszyscy inni też o tym wiedzieli."
 ecumenical_council_events.0129.support_duel.success: "Strach skłania ich ku tobie"
 ecumenical_council_events.0129.support_duel.success_halved: "Strach zniewala tylko nielicznych"
 ecumenical_council_events.0129.support_duel.failure: "Ich strach przeradza się w bunt"
 ecumenical_council_events.0129.oppose: "I w ten sposób strach pożera nadzieję."
 ecumenical_council_events.0129.oppose_duel: "Nie pozwolę, aby ktokolwiek mi się sprzeciwił."
 ecumenical_council_events.0129.oppose_duel.success: "Przerażeni się podporządkowują"
 ecumenical_council_events.0129.oppose_duel.success_halved: "Nieliczni się podporządkowują"
 ecumenical_council_events.0129.oppose_duel.failure: "Ich strach przeradza się w bunt"
