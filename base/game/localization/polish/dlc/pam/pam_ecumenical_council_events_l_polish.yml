 ecumenical_council_events.0102.t: "Konkurencyjne modlitwy"
 ecumenical_council_events.0102.desc: "Najbardziej pobożni spośród zgromadzonych utworzyli dwie grupy modlitewne dotyczące propozycji.\n\n[lead_innovator.GetTitledFirstName] domaga się interwencji [lead_innovator.GetFaith.HighGodNamePossessive], aby potwierdzić, że [lead_innovator.Custom('PL_jego_jej')] objawienia są odzwierciedleniem woli istoty najwyższej. Grupa, którą prowadzi [lead_conservative.GetTitledFirstName], natychmiast na to odpowiada, kierując błagania, aby niebiosa chroniły tradycje, które od dawna służą kościołowi."
 ecumenical_council_events.0102.support: "Włącz się w modlitwy na rzecz zmiany."
 ecumenical_council_events.0102.support_duel: "Głoś zmianę, aż ich grupa ulegnie."
 ecumenical_council_events.0102.support_duel.success: "Twoje kazanie przekonuje opornych duchownych"
