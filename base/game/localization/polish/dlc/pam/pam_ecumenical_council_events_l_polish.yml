 ecumenical_council_events.0120.t: "Imiona w kronice"
 ecumenical_council_events.0120.desc: "Niektórzy z najbardziej uznanych gości trzymają się z boku i zastanawiają się, jak to wszystko wpłynie na ich reputację, gdy wydarzenia zostaną spisane.\n\n– Moje imię pojawia się w każdej z ostatnio napisanych kronik. Po co mam się wiązać z dekretem, który stanie się przedmiotem kpin na całą wieczność? – mówi [lead_conservative.GetTitledFirstName].\n\n– Ludzie pamiętają tego, kto załagodził spór, a nie tego, kto nie pobrudził sobie rąk. I tak właśnie zapiszę się w historii – odpowiada [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0120.support: "– Czy nie jesteśmy przywódcami Kościoła?"
 ecumenical_council_events.0120.support_duel: "– Nikt nie zostanie sam!"
 ecumenical_council_events.0120.support_duel.success: "Sceptycy poddają się osądowi historii"
 ecumenical_council_events.0120.support_duel.success_halved: "Nieliczni poddają się osądowi historii"
 ecumenical_council_events.0120.support_duel.failure: "Pozostają nieprzekonani"
 ecumenical_council_events.0120.oppose: "Nie wystawię swojego imienia na śmieszność."
 ecumenical_council_events.0120.oppose_duel: "– Głupcy rozstrzygają spory… narzucając farsę."
 ecumenical_council_events.0120.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0120.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0120.oppose_duel.failure: "Nie dają się sprowokować twoją zniewagą"
