 ecumenical_council_events.0112.t: "Choroba w państwie"
 ecumenical_council_events.0112.desc: "– Na moich ziemiach piętrzą się trupy! Początkowo nie było wiadomo, jaka jest przyczyna tej kary [lead_conservative.GetFaith.HighGodNamePossessive], ale teraz wszystko stało się aż nader jasne! Ludzkość cierpi, ponieważ nasz świat odrzuca tę zmianę prawa kanonicznego – mówi [lead_conservative.GetTitledFirstName].\n\n– Czy nienawiść do tego soboru tak bardzo cię zaślepia, że nie dostrzegasz swojego zbawienia? – odpowiada [lead_innovator.GetTitledFirstName]. – Nasza reforma załagodzi gniew [lead_conservative.GetFaith.HighGodNamePossessive]!"
 ecumenical_council_events.0112.support: "Tak, wola [lead_conservative.GetFaith.HighGodNamePossessive] domaga się reformy Kościoła."
 ecumenical_council_events.0112.support_duel: "Wykorzystanie logiki tej zaciekłej osoby przeciwko niej samej może zadziałać!"
 ecumenical_council_events.0112.support_duel.success: "Wielu dostrzega koniec boskiego gniewu"
 ecumenical_council_events.0112.support_duel.success_halved: "Nieliczni spróbują załagodzić gniew [lead_conservative.GetFaith.HighGodNamePossessive]"
 ecumenical_council_events.0112.support_duel.failure: "Zniszczenie prawa kanonicznego to zbyt poważne ryzyko"
 ecumenical_council_events.0112.oppose: "Albo gniew [lead_conservative.GetFaith.HighGodNamePossessive] będzie jeszcze większy!"
 ecumenical_council_events.0112.oppose_duel: "Ostrzeż, że to doprowadzi do zniszczenia prawa kanonicznego."
 ecumenical_council_events.0112.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0112.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
