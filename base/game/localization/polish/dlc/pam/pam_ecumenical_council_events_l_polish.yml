 ecumenical_council_events.0113.t: "Wiara pod bronią"
 ecumenical_council_events.0113.desc: "Ci, których państwa cierpią przez okrutnych wyznawców innych religii, oddalają się z sali obrad i okazują sobie wzajemne współczucie.\n\n– Gdy wrogowie wiary palą moje pola – oświadcza [lead_conservative.GetTitledFirstName] – czy mamy się kłócić o głupie złudzenia? Zupełnie jakby miecz nie przeszywał naszych serc?\n\n– Rozdarta wspólnota jest jak pęknięta tarcza – odpowiada [lead_innovator.GetTitledFirstName] Ustalmy wspólne fundamenty wiary, a będziemy walczyć zjednoczeni i odnowieni!"
 ecumenical_council_events.0113.support: "Dobrze byłoby znów poczuć smak nadziei."
 ecumenical_council_events.0113.support_duel: "Naprawmy Kościół – naszą tarczę!"
 ecumenical_council_events.0113.support_duel.success: "Zgadzają się – będziemy walczyć zjednoczeni"
 ecumenical_council_events.0113.support_duel.success_halved: "Nieliczni przekonują się do reformy"
 ecumenical_council_events.0113.support_duel.failure: "Nie pamiętają nadziei"
 ecumenical_council_events.0113.oppose: "Nie ma ważniejszych spraw niż te bzdury?"
 ecumenical_council_events.0113.oppose_duel: "Ostrzeż ich przed tą nierozwagą."
