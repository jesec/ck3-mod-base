 ecumenical_council_events.0123.t: "Wkrótce nadejdzie wojna"
 ecumenical_council_events.0123.desc: "Widzę, jak moi sojusznicy się kłócą – przypominają oddziały stojące naprzeciw siebie na polu bitwy. To zły znak.\n\n– Do diabła, mamy tylko jedną wspólną sprawę! Nie proś mnie o głosowanie! Nie jestem jakimś zwierzęciem, szczekającym psem, którego [ROOT.Char.GetTitledFirstName] trzyma na smyczy! – burzy się [lead_conservative.GetTitledFirstName].\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTier] to miejsce, z którym wiąże cię przysięga – jak mam postrzegać sojusznika, który nie potrafi prostymi słowami dotrzymać przyrzeczenia w życiu doczesnym? – odpiera [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0123.support: "– Tak, muszę wykorzystać wszystkie zobowiązania."
 ecumenical_council_events.0123.support_duel: "Ostrzeż, że traktujesz to jako hańbę."
 ecumenical_council_events.0123.support_duel.success: "Twoi sojusznicy staną po twojej stronie"
 ecumenical_council_events.0123.support_duel.success_halved: "Nieliczni z twoich sojuszników staną po twojej stronie"
 ecumenical_council_events.0123.support_duel.failure: "Twoi sojusznicy nie dają się zastraszyć"
 ecumenical_council_events.0123.oppose: "– W tym miejscu obowiązuje tylko lojalność wobec świętych pism."
 ecumenical_council_events.0123.oppose_duel: "– Będę wymagać lojalności… od sojuszników takich jak [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.oppose_duel.success: "Twoi sojusznicy ustępują"
 ecumenical_council_events.0123.oppose_duel.success_halved: "Nieliczni z twoich sojuszników ustępują"
 ecumenical_council_events.0123.oppose_duel.failure: "Twoi sojusznicy nie zostaną zmobilizowani do sprzeciwu"
