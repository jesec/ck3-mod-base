 ecumenical_council_events.0116.t: "Kto za to zapłaci?"
 ecumenical_council_events.0116.desc: "Widzę, jak zarządcy kilku stolic biskupich pochylają się nad skrawkiem pergaminu i spierają się o liczby, jakby sala była kantorem.\n\n– Moja diecezja nie może sobie pozwolić na kolejne wstrząsy – mówi [lead_conservative.GetTitledFirstName]. – Nowe książki dla każdej parafii. W każdej wsi [lead_conservative.GetFaith.HouseOfWorship] będzie wymagać własnego wędrownego kaznodziei. Jeśli ta propozycja przejdzie, dziesięcina nie wystarczy.\n\n– A jeśli upadnie? – pyta [lead_innovator.GetTitledFirstName]. – Spieramy się od lat. To srebro i tak już przepadło. Lepiej przeznaczyć pozostałe środki na prawo, którego wierni będą przestrzegać."
 ecumenical_council_events.0116.support: "Tak, po co opłakiwać srebro, które już zostało wydane?"
 ecumenical_council_events.0116.support_duel: "Argumentuj, że wsparcie propozycji to inwestycja!"
 ecumenical_council_events.0116.support_duel.success: "Zostają przekonani do reformy"
 ecumenical_council_events.0116.support_duel.success_halved: "Nieliczni przyjmują to stanowisko"
 ecumenical_council_events.0116.support_duel.failure: "Wciąż narzekają na wydatki"
 ecumenical_council_events.0116.oppose: "Mojej diecezji nie stać na taki wstrząs."
 ecumenical_council_events.0116.oppose_duel: "– Na litość [ROOT.Char.GetFaith.HighGodNamePossessive]! To finansowa nieodpowiedzialność!"
 ecumenical_council_events.0116.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] wycofują się ze swojego stanowiska"
 ecumenical_council_events.0116.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] wycofują się ze swojego stanowiska"
