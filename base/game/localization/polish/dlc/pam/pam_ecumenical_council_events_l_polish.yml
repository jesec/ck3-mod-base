 ecumenical_council_events.0080.t: "Głosowanie soboru"
 ecumenical_council_events.0080.desc.passed: "Głosy zostały policzone. [lead_portrait.GetTitledFirstName] wychodzi naprzód.\n\n– Duch Święty prowadził nas przez całe obrady soboru i podjęliśmy decyzję. Sprawa została rozpatrzona pozytywnie!"
 ecumenical_council_events.0080.desc.failed: "Głosy zostały policzone. [lead_portrait.GetTitledFirstName] wychodzi naprzód.\n\n– Duch Święty prowadził nas przez całe obrady soboru i podjęliśmy decyzję. Propozycja zostaje odrzucona. Wiara [host.GetFaith.GetAdjective|l] pozostaje bez zmian."
 ecumenical_council_events.0080.desc.outcome.passed: "\n\nDogmat „[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )]” staje się [activity.Custom('GetEcumenicalCouncilCurrentProposal')|l]."
 ecumenical_council_events.0080.desc.outcome.passed.make_core: "\n\nDogmat „[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )]” staje się fundamentalny i zastępuje dogmat „[core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]”."
 ecumenical_council_events.0080.desc.outcome.failed: "\n\nDogmat „[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )]” nie staje się [activity.Custom('GetEcumenicalCouncilCurrentProposal')|l]."
 ecumenical_council_events.0080.a: "A zatem postanowiono."
