 ecumenical_council_events.0118.t: "Tradycje odległej stolicy"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName], znana na soborze osoba, w której żyłach płynie [lead_conservative.GetCulture.GetNameNoTooltip|l] krew, stoi wraz z grupą innych duchownych, którzy przybyli z daleka, aby bronić tradycji Kościoła.\n\n– Domena [lead_conservative.GetFaith.GetAdjective|l] jest tak wielka, jak miłość [lead_conservative.GetFaith.HighGodNamePossessive] – mówi. – Mamy nadzieję, że nie odbyliśmy tej pielgrzymki po to, aby patrzeć, jak [lead_innovator.GetTitledFirstName] głosi zagładę dzieła Ojców Kościoła."
 ecumenical_council_events.0118.support: "Najtrudniejsze pielgrzymki przynoszą najdonioślejsze objawienia."
 ecumenical_council_events.0118.support_duel: "Przekonaj ich, że [lead_innovator.GetFirstNameNoTooltip] ma słuszną wizję."
 ecumenical_council_events.0118.support_duel.success: "Uznają, że tradycje ojców są bezpieczne"
 ecumenical_council_events.0118.support_duel.success_halved: "Nieliczni uznają, że tradycje ojców są bezpieczne"
 ecumenical_council_events.0118.support_duel.failure: "Wciąż boją się tego, co głosi [lead_innovator.GetTitledFirstNameNoTooltip]"
 ecumenical_council_events.0118.oppose: "– Uczcijmy wszyscy wasze poświęcenie."
 ecumenical_council_events.0118.oppose_duel: "– Będę się sprzeciwiać temu, co głosi [lead_innovator.GetTitledFirstNameNoTooltip]."
