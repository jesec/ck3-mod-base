 ecumenical_council_events.0108.t: "Wśród przyjaciół"
 ecumenical_council_events.0108.desc: "To dla mnie radość, że [friend.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', friend)], jest wśród zgromadzonych.\n\n– Z pewnością wiesz, po czyjej jestem stronie – mówi. – Powiedz tylko słowo, a cię poprę."
 ecumenical_council_events.0108.a: "Poprzyj mnie."
 ecumenical_council_events.0108.b: "Możesz pozostać przy swoich przekonaniach."
 ecumenical_council_events.0108.conservatives_custom: "[ec_conservatives|E] wśród twoich [Concept('friends', 'przyjaciół')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.innovators_custom: "[ec_innovators|E] wśród twoich [Concept('friends', 'przyjaciół')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.t: "Ciche niezadowolenie"
 ecumenical_council_events.0109.desc: "Najwyraźniej z dala od sali obrad szykuje się jakieś posiedzenie w wąskim gronie. Kto próbuje przeobrazić wiarę beze mnie?\n\n– Skoro tę sprawę można podać w wątpliwość, to czemu nie inne – ostrzega [lead_conservative.GetTitledFirstName]. – Nie otworzę tych drzwi i nie wpuszczę niepewności do domu [lead_conservative.GetFaith.HighGodNamePossessive].\n\n– Czy nie kusi cię, aby zerwać z tradycjami, które już nam nie służą? – odpowiada [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0109.support: "Wystarczy, że ktoś tego wysłucha."
 ecumenical_council_events.0109.support_duel: "Wiem, jak sprawić, by ostrożni mnie wysłuchali…"
 ecumenical_council_events.0109.support_duel.success: "Nie staną nam na drodze"
 ecumenical_council_events.0109.support_duel.success_halved: "Nieliczni cię wysłuchują"
 ecumenical_council_events.0109.support_duel.failure: "Zacieśniają szeregi przeciwko tobie"
 ecumenical_council_events.0109.oppose: "Po cichu zamknij drzwi."
 ecumenical_council_events.0109.oppose_duel: "– [lead_innovator.GetFirstNameNoTooltip], zawsze tak wichrzysz?"
 ecumenical_council_events.0109.oppose_duel.success: "Nie zaryzykują chaosu"
 ecumenical_council_events.0109.oppose_duel.success_halved: "Nieliczni wycofują swoje poparcie"
 ecumenical_council_events.0109.oppose_duel.failure: "Wciąż pragną niezgody i zguby"
 ecumenical_council_events.0109.conservatives_custom: "Reformistyczni [ec_conservatives|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0109.conservatives_custom_halved: "Reformistyczni [ec_conservatives|El] (#V [feature_conservatives_size_halved]#!)"
