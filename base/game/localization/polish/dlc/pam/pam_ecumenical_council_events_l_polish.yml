 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "Głosowanie soboru"
 ecumenical_council_events.0081.desc.innovator_passed: "Wygraliśmy my, zwolennicy zmiany. Nasze argumenty przekonały wystarczającą liczbę uczestników soboru i ustanowiliśmy nowy porządek."
 ecumenical_council_events.0081.desc.innovator_failed: "Chociaż naciskaliśmy na wprowadzenie zmian, nie udało się ich przeforsować. Stare zwyczaje nadal obowiązują, a nasze argumenty poszły w odstawkę."
 ecumenical_council_events.0081.desc.conservative_passed: "Choć staraliśmy się bronić tradycji, reformatorzy wygrali głosowanie. Zmiana została przyjęta i nikt nie przejmuje się naszymi zastrzeżeniami."
 ecumenical_council_events.0081.desc.conservative_failed: "My, którzy opowiadaliśmy się za tradycją, nie ustąpiliśmy. Propozycja przepadła, a nasz obrządek pozostaje taki jak dotąd."
 ecumenical_council_events.0081.desc.neutral: "Sobór ogłasza decyzję i kwestia ta zostaje uznana za rozstrzygniętą."
 ecumenical_council_events.0081.a: "A zatem postanowiono."
