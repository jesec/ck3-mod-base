 ecumenical_council_events.0115.t: "Szepty i przewagi"
 ecumenical_council_events.0115.desc: "Choć przyznaję to z bólem serca, nie wszyscy duchowni zasłużyli sobie na swoje szaty w uczciwy sposób. Nawet w tym dostojnym gronie muszę mieć świadomość tych, którzy wolą cienie od czystego światła Pisma Świętego. Nie trzeba długo czekać, aby natknąć się na szepty w ciemności.\n\n– Każda zgromadzona tu dusza pragnie… czegoś. My, mędrcy, musimy się zastanowić, kto zapłaci cenę za ten głód” – [lead_conservative.GetTitledFirstName] podsuwa swoje słowa chętnym słuchaczom – Zuchwała ideologia, pełna pasji reforma… nic nie jest bardziej kosztowne…\n\nKolejna żmija, [lead_innovator.GetTitledFirstName], rzuca [lead_conservative.Custom('PL_mu_jej')] wyzwanie.\n\n– Wydaje ci się, że to #EMP ty#! zapłacisz cenę za chaos? W nadchodzącym okresie zamętu, kiedy będziemy mogli postępować według własnego uznania…?"
 ecumenical_council_events.0115.support: "Zamęt bywa użyteczny."
 ecumenical_council_events.0115.support_duel: "Wspomnij o nadarzającej się okazji tym, którzy są na tyle bystrzy, aby cię słuchać."
 ecumenical_council_events.0115.support_duel.success: "Ich chciwość sprawia, że zwracają się ku tobie"
 ecumenical_council_events.0115.support_duel.success_halved: "Nieliczni będą dążyć do zamętu"
 ecumenical_council_events.0115.support_duel.failure: "Okazują się ślepi na nadarzającą się okazję"
 ecumenical_council_events.0115.oppose: "To jeden skromny posiłek, po którym my, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], będziemy wiecznie głodować."
 ecumenical_council_events.0115.oppose_duel: "Szukaj prawdy w Piśmie, bo inaczej się zagubisz."
 ecumenical_council_events.0115.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0115.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
