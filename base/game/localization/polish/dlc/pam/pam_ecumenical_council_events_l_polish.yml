 ecumenical_council_events.0117.t: "Zbyt wiele zmian"
 ecumenical_council_events.0117.desc: "Zauważam, jak para doświadczonych negocjatorów robi notatki na marginesie dekretu, skreślając i dopisując ustępy, jakby to był traktat.\n\n– Zostaw to bez zmian! Ryzykujemy, że połowa z nich odejdzie, zanim jeszcze zajmiemy się bardziej drażliwymi kwestiami – mówi [lead_conservative.GetTitledFirstName]. – Od miesięcy staram się utrzymać tych ludzi przy jednym stole. Złagodź ten zapis, bo inaczej stracimy sobór.\n\n– I mam zostawić ten bałagan, którego nikt nie wprowadzi w życie po zakończeniu soboru? – odpowiada [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0117.support: "Musimy być przekonujący. Musimy wyrażać się jasno."
 ecumenical_council_events.0117.support_duel: "Stanowczy dekret jest lepszy niż milczenie, prawda?"
 ecumenical_council_events.0117.support_duel.success: "Zgadzają się, że ten niejasny przepis nie zostanie wdrożony"
 ecumenical_council_events.0117.support_duel.success_halved: "Nieliczni zgadzają się, że ten niejasny przepis nie zostanie wdrożony"
 ecumenical_council_events.0117.support_duel.failure: "Wciąż boją się wyobcowania"
 ecumenical_council_events.0117.oppose: "Nie możemy ryzykować utraty soboru!"
 ecumenical_council_events.0117.oppose_duel: "To jest prymitywne, tego nie można uchwalić!"
 ecumenical_council_events.0117.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
