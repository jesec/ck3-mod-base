l_polish:
 ecumenical_council_events.0001: "Sobór w miejscu znanym jako [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "[ROOT.Char.GetFaith.HouseOfWorshipPlural] baronii o nazwie [my_location.GetBaronyNameExplicitly] została przepięknie udekorowana na tę okazję. Najznamienitsze osobowości świata chrześcijańskiego przyjęły"
 ecumenical_council_events.0001.host: "moje zaproszenie."
 ecumenical_council_events.0001.dislikes_host: "zaproszenie osoby, którą jest [host.Custom('InsultAdjective')] [host.GetTitledFirstName]."
 ecumenical_council_events.0001.likes_host: "zaproszenie osoby, którą jest [host.Custom('ComplimentAdjective')] [host.GetTitledFirstName]."
 ecumenical_council_events.0001.neutral: "zaproszenie osoby, którą jest [host.GetTitledFirstName]."
 ecumenical_council_events.0001.intent_arrived: "\n\nI już widzę, że [intent_target.GetTitledFirstName] jest na zgromadzeniu. Doskonale!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nTo tylko kwestia czasu, zanim [intent_target.GetTitledFirstName] przybędzie…"
 ecumenical_council_events.0001.no_intent_target: "\n\nMuszę tylko poczekać, aż przybędą!"
 ecumenical_council_events.0001.a.bad: "Skoro musimy."
 ecumenical_council_events.0001.a.good: "Świętość jest naszym obowiązkiem."
 ecumenical_council_events.0002.t: "Wezwanie"
 ecumenical_council_events.0002.desc_intro: "[host.GetFaith.HouseOfWorship|U] otwiera swoje podwoje i nasze wspaniałe dzieło może się rozpocząć. W ramach przygotowań nadszedł czas na zawieranie sojuszy"
 ecumenical_council_events.0002.reformist: "między królami i kapłanami."
 ecumenical_council_events.schism_crisis_intro: "\n\nPozdrowienia są ciepłe, ale cisza między nimi nie. Rzym i Konstantynopol nie wymieniają się już uprzejmościami, a każdy nierozliczony spór jest kolejną raną na Ciele Chrystusa."
 ecumenical_council_events.0002.first_tenet: "\n\nW powietrzu rozbrzmiewa gwar rozmów. Wezwani zaczynają zajmować stanowiska na temat dogmatu „[ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]” oraz innych ważnych spraw."
 ecumenical_council_events.0002.host: "\n\nRozkładam ramiona i witam moje dzieci, abyśmy wspólnie podjęli to doniosłe zadanie."
 ecumenical_council_events.0002.guest: "\n\n– Witajcie, moje dzieci. Niech pan prowadzi nas w tym doniosłym zadaniu! – [host.GetTitledFirstName] zaprasza nas do siebie gestem."
 ecumenical_council_events.0002.a: "Amen."
 ecumenical_council_events.0010.t: "Nasze stanowisko na temat dogmatu „[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]”"
 ecumenical_council_events.0010.desc.intro: "Pierwsza debata dotyczy dogmatu „[ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]”. Zgodnie z obecnym prawem kanonicznym jest on [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.GetTitledFirstName] wygłasza słowo wstępne:\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n– Coraz więcej osób uważa to za fundament swojej wiary – mówi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n– Zwykle zakazanie jakiejś praktyki niesie ze sobą ryzyko, ale w tym przypadku jest ono bardzo uzasadnione – zapewnia [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n– Ta praktyka nadal cieszy się popularnością. Potępienie jej… wiąże się z pewnym ryzykiem – wyraża swoje obawy [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n– Ta praktyka traci popularność. To odpowiedni moment, by zaprzestać jej wspierania – radzi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n– Ta praktyka zyskuje na popularności. Warto rozważyć jej poparcie – sugeruje [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n– Ta praktyka jest nieznana. Niebezpiecznie jest ją popierać – ostrzega [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.fallback.explanation: "– To kwestia, w której nasza wiara nie osiągnęła jeszcze konsensusu. To decyzja, która została przedłożona soborowi."
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "– Pyta się nas, czy należy podtrzymać pokój i rozejm [ROOT.Char.GetFaith.HighGodNamePossessive]. Czy nasze narody muszą składać przysięgi, że oszczędzą kościoły, duchowieństwo i osoby nieuzbrojone przed grabieżami oraz rozlewem krwi? Czy nie możemy sprawić, aby nikt nie chwytał za broń podczas świąt ze względu na zakaz, jaki nałożyła wiara [ROOT.Char.GetFaith.GetAdjective|l]?"
 ecumenical_council_events.0010.desc.dulia.explanation: "– Pyta się nas, czy należy gorliwie wielbić świętych. Czy można czcić ich relikwie, obchodzić poświęcone im dni i prosić ich o wstawiennictwo, podczas gdy nasz kult pozostaje zarezerwowany dla chwały [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "– Pyta się nas, czy w wyniku dokonanej przez kapłana konsekracji chleb i wino na ołtarzu rzeczywiście przemieniają się w Ciało i Krew Chrystusa."
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "– Pyta się nas, czy pobożne życie musi łączyć modlitwę z pracą. Czy bezczynność jest wrogiem duszy? Czy nasza praca w polu lub w skryptorium powinna być tak samo szanowana jak [ROOT.Char.Custom('GetReligiousRite')]?"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "– Pyta się nas, czy Najświętszą Maryję Pannę, Bogurodzicę, należy czcić ponad wszystkich innych świętych."
 ecumenical_council_events.0010.desc.simony.explanation: "– Pyta się nas, czy święte urzędy, błogosławieństwa lub sakramenty można kupować i sprzedawać za złoto."
 ecumenical_council_events.0010.desc.monophysitism.explanation: "– Pyta się nas, czy Chrystus ma tylko jedną naturę, całkowicie boską, a Jego człowieczeństwo zostało wchłonięte, zaś w Słowie, które stało się ciałem, pozostał tylko pierwiastek boski."
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "– Pyta się nas, czy społeczność [ROOT.Char.GetFaith.GetAdjective|l] powinna żyć tak, jak opisano w Dziejach Apostolskich. Czy powinniśmy wysyłać naszych misjonarzy, aby z gorliwością Ojców Kościoła nieśli Słowo tym, którzy wciąż pozostają w ciemności?"
 ecumenical_council_events.0010.desc.purgatory.explanation: "– Pyta się nas, czy dusze, które nie są ani potępione, ani jeszcze niewinne, zostają oczyszczone po śmierci. Czy modlitwy i obrządki żyjących przyjdą im z pomocą, zanim staną one przed obliczem [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "– Pyta się nas, czy spłodzenie potomstwa jest świętym obowiązkiem. Czy wierni powinni zaludniać ziemię?"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "– Pyta się nas, czy władza biskupów rzeczywiście wywodzi się z nieprzerwanej linii sukcesji od apostołów."
 ecumenical_council_events.0010.desc.confession.explanation: "– Pyta się nas, czy każdy [ROOT.Char.GetFaith.GetAdherentName] musi wyznać swoje grzechy kapłanowi, aby uzyskać rozgrzeszenie. Czy tajemnica spowiedzi musi pozostać nienaruszona?"
 ecumenical_council_events.0010.desc.original_sin.explanation: "– Pyta się nas, czy każda dusza dziedziczy grzech Adama. Czy od urodzenia jesteśmy splamieni winą i potrzebujemy łaski chrztu?"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "– Pyta się nas, czy święci aniołowie stoją w ustalonych szeregach pod władzą [ROOT.Char.GetFaith.HighGodNamePossessive], a każdy rząd przewyższa rangą kolejny. Czy wiara [ROOT.Char.GetFaith.GetAdjective|l] powinna się charakteryzować urzędami odzwierciedlającymi ten niebiański porządek?"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "– Pyta się nas, czy wierni powinni być żołnierzami Chrystusa. Czy wiara [ROOT.Char.GetFaith.GetAdjective|l] domaga się, byśmy chwycili za miecz i bronili religii, gdy zostaniemy do tego wezwani?"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "– Pyta się nas, czy wiara może dążyć do racjonalnego zrozumienia. Czy szkoły powinny wykorzystywać dialektykę i filozofię do uporządkowania oraz obrony doktryny?"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "– Pyta się nas, czy Chrystus w swojej ludzkiej naturze jest adoptowanym Synem [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "– Pyta się nas, czy każdy [ROOT.Char.GetFaith.GetAdherentName] musi kochać bliźniego, nawet nieznajomego i wroga, co stanowi niezawodną miarę miłości [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "– Pyta się nas, czy [ROOT.Char.Custom('GetReligiousRite')|l] – z pieśniami, kadzidłem i ustalonym obrządkiem – to główna droga, jaką wierni zbliżają się do [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "– Pyta się nas, czy w Chrystusie pierwiastki boskie i ludzkie stanowią jedną wcieloną naturę, bez rozgraniczenia oraz bez sprzeczności."
 ecumenical_council_events.0010.desc.hesychasm.explanation: "– Pyta się nas, czy święta cisza i prosta modlitwa serca – powtarzana w nieskończoność – mogą obdarzyć duszę wizją niestworzonego światła [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0010.desc.anachoresis.explanation: "– Pyta się nas, czy wycofanie się ze świata jest czymś świętym. Czy samotność pustelnika jest prawdziwą drogą do [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "– Pyta się nas, czy dusza ubogaca się, gdy ciało poddawane jest wyrzeczeniom w postaci postu, noszenia włosienicy i samobiczowania."
 ecumenical_council_events.0010.desc.holy_myron.explanation: "– Pyta się nas, czy święte [Glossary( 'krzyżmo', 'CHRISM_GLOSS' )] powinno przypieczętować chrzest i koronację darem Ducha Świętego."
 CHRISM_GLOSS: "#bold Krzyżmo#!, z języka greckiego „namaszczenie”, to poświęcony przez biskupa wonny święty olej używany do namaszczania wiernych podczas chrztu i bierzmowania, a czasami także podczas koronacji królewskiej."
 ecumenical_council_events.0010.desc.khachkar.explanation: "– Pyta się nas, czy rzeźbione kamienne krzyże mogą stać wśród nas jako trwałe publiczne świadectwa wiary, wyznaczające świętą ziemię oraz miejsca pochówku."
 ecumenical_council_events.0010.desc.philanthropia.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] wymaga opieki nad ubogimi. Czy musimy zbierać jałmużnę oraz zakładać szpitale i przytułki?"
 ecumenical_council_events.0010.desc.aniconism.explanation: "– Pyta się nas, czy wszystkie święte obrazy należy usunąć z naszych kościołów. Czy oddawanie im czci jest rzeczywiście bałwochwalstwem wobec doczesnych wizerunków, co odwraca nasze oczy i umysły od [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "– Pyta się nas, czy w Piśmie Świętym należy szukać ukrytych duchowych znaczeń. Czy biegłość w grece i alegoria mogą odkryć to, co ukrywa litera?"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "– Pyta się nas, czy samo wzięcie krzyża i maszerowanie w świętej sprawie jest równoznaczne z oddaniem się Chrystusowi. Czy miecz może chronić pielgrzymów i odzyskać to, co wpadło w ręce niewiernych?"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "– Pyta się nas, czy cielesne rozkosze przybliżają duszę do boskości. Czy należy szanować pragnienia i do nich dążyć, czy raczej je odrzucać jako grzeszne?"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "– Pyta się nas, czy wiara i ludzie stanowią jedność pod panowaniem [ROOT.Char.GetFaith.HighGodNamePossessive]. Czy obcy muszą pozostać poza prawdziwą owczarnią?"
 ecumenical_council_events.0010.desc.communion.explanation: "– Pyta się nas, czy wspólne święte obrządki przywołują obecność [ROOT.Char.GetFaith.HighGodNamePossessive]. Czy tych, którzy nie chcą w nich uczestniczyć, należy uznać za wykluczonych z prawdziwej owczarni?"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "– Pyta się nas, czy w obliczu śmierci ostateczne duchowe oczyszczenie może zmyć każdy grzech oraz czy przyjmujący sakrament musi wówczas odmówić przyjmowania pokarmu i trzymania się życia, aby grzech nie powrócił."
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "– Pyta się nas, czy małżonkowie muszą pochodzić ze wspólnej świętej linii rodowej, a nawet być krewnymi na tyle bliskimi, że wiara [ROOT.Char.GetFaith.GetAdjective|l] uznałaby ten związek za niedopuszczalny."
 ecumenical_council_events.0010.desc.gnosticism.explanation: "– Pyta się nas, czy zbawienie tkwi w objawionej jedynie wtajemniczonym ukrytej wiedzy, która uwalnia boską iskrę i przywraca ją do źródła."
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "– Pyta się nas, czy zakonnicy powinni niczego nie posiadać. Czy mają wędrować od miasta do miasta, żyjąc z jałmużny, aby głosić Słowo [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.pacifism.explanation: "– Pyta się nas, czy [ROOT.Char.GetFaith.GetAdherentName] widzi w swoim życiu miejsce na miecz. Czy idea wojny sprawiedliwej jest błędna?"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] ma być zarządzana kolegialnie przez pięć patriarchatów. Czy oznacza to zaprzeczenie prymatu głównego orędownika [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "– Pyta się nas, czy należy trzymać się wiary bez ustępstw w obliczu prześladowań, trudów lub wątpliwości. Czy jesteśmy zobowiązani do trwania bez względu na cenę?"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "– Pyta się nas, czy najlepiej wypełniamy wolę [ROOT.Char.GetFaith.HighGodNamePossessive], składając śluby ubóstwa, tak jak uczynili to apostołowie."
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "– Pyta się nas, czy należy pozostawić wiernych samym sobie, by podążali własnymi drogami. Czy wiara [ROOT.Char.GetFaith.GetAdjective|l] nie powinna ani mieszać się w sprawy obcych, ani zachęcać ich do ingerencji?"
 ecumenical_council_events.0010.desc.adaptive.explanation: "– Pyta się nas, czy wymaganie powszechnego przestrzegania naszych zwyczajów i ograniczeń szkodzi wspólnocie. Tak długo, jak istota naszej wiary pozostaje niezmieniona, czy prawa mogą być dostosowywane do świata, w którym muszą funkcjonować?"
 ecumenical_council_events.0010.desc.esotericism.explanation: "– Pyta się nas, czy tajemnice [ROOT.Char.GetFaith.HighGodNamePossessive] skłaniają nas do poszukiwania wiedzy o otaczającym nas świecie."
 ecumenical_council_events.0010.desc.legalism.explanation: "– Pyta się nas, czy boskie zasady muszą regulować każdy aspekt życia, jakiego wymaga od nas wiara [ROOT.Char.GetFaith.GetAdjective|l]. Czy żaden grzesznik, bez względu na to, jak królewski lub władczy, nie stoi ponad naszym prawem?"
 ecumenical_council_events.0010.desc.literalism.explanation: "– Pyta się nas, czy Pismo Święte jest niezmienne i kompletne oraz stanowi jedyne źródło mądrości [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0010.desc.reincarnation.explanation: "– Pyta się nas, czy dusza powraca w kolejnych wcieleniach, zamiast stanąć przed sądem [ROOT.Char.GetFaith.HighGodNamePossessive] tylko raz."
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] pozwala duchownym wydawać wiążące orzeczenia w każdej nowej kwestii dotyczącej wiary i prawa."
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] wymaga, aby życie toczyło się wokół zmagań i podporządkowania. Czy wierzący musi całkowicie poddać się woli [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "– Pyta się nas, czy [ROOT.Char.GetFaith.GetAdherentName] może udawać wyznawcę innej wiary w obliczu prześladowań."
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "– Pyta się nas, czy władza [ROOT.Char.GetFaith.GetAdjective|l] może tolerować niewiernych, jeśli ci będą płacić podatek za ochronę."
 ecumenical_council_events.0010.desc.asceticism.explanation: "– Pyta się nas, czy obecności [ROOT.Char.GetFaith.HighGodNamePossessive] należy szukać poprzez głód, niedostatek i rezygnację z wygód."
 ecumenical_council_events.0010.desc.bhakti.explanation: "– Pyta się nas, czy każda dusza powinna się związać z jednym aspektem boskości w pełnym miłości oddaniu."
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "– Pyta się nas, czy krzywdzenie istot żywych jest zawsze zabronione. Czy powinniśmy unikać sprawiania cierpienia nawet najmniejszym zwierzętom i owadom?"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "– Pyta się nas, czy obecności [ROOT.Char.GetFaith.HighGodNamePossessive] szuka się przede wszystkim poprzez kontemplację i znajomość siebie."
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "– Pyta się nas, czy mamy święty obowiązek podejmować każdego nieznajomego przy naszym stole."
 ecumenical_council_events.0010.desc.adorcism.explanation: "– Pyta się nas, czy duchy tego świata należy czcić i je podejmować, aby nam pomagały, zamiast je wypędzać jako nieczyste moce."
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "– Pyta się nas, czy należy oddawać cześć przodkom poprzez modlitwy i ofiary, aby czuwali nad nami i nas prowadzili."
 ecumenical_council_events.0010.desc.astrology.explanation: "– Pyta się nas, czy w gwiazdach można odczytać wolę [ROOT.Char.GetFaith.HighGodNamePossessive]. Czy niebiosa skrywają tajemnice naszego losu?"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "– Pyta się nas, czy rozkosz jest darem, o który należy zabiegać jako o formę kultu."
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "– Pyta się nas, czy życie ludzkie można złożyć w ofierze na ołtarzu. Czy można przelać krew jako święty dar dla [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "– Pyta się nas, czy niektóre dusze są od urodzenia przeznaczone do sprawowania władzy duchownej i przywództwa w Kościele, jeszcze zanim namaściła je wiara [ROOT.Char.GetFaith.GetAdjective|l]."
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "– Pyta się nas, czy kalendarz, którym kieruje się wiara [ROOT.Char.GetFaith.GetAdjective|l], powinien obfitować w święta, aby jednoczyć wiernych."
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "– Pyta się nas, czy do porodu należy się przygotować poprzez święte obrządki. Czy miejsce przyjścia potomka na świat należy oczyścić, aby matka i dziecko otrzymali błogosławieństwo [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "– Pyta się nas, czy leśny zagajnik, rwąca rzeka i skąpana w rosie dolina są święte. Czy to właśnie na łonie natury powinniśmy szukać [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "– Pyta się nas, czy powinniśmy kierować modlitwy do słońca. Czy to życiodajne światło jest przejawem obecności [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.warmonger.explanation: "– Pyta się nas, czy wojna i podboje same w sobie są aktami świętej posługi. Czy miecz jest najpewniejszym środkiem szerzenia słowa [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "– Pyta się nas, czy święta można obchodzić, przelewając krew i urządzając okrutne widowiska. Czy takie uroczystości pozwalają prawdziwie oddawać cześć chwale [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "– Pyta się nas, czy wysokie góry oraz korzenie ziemi są święte. Czy powinniśmy szukać [ROOT.Char.GetFaith.HighGodNamePossessive] na szczytach oraz wzdłuż ukrytych kamienistych ścieżek?"
 ecumenical_council_events.0010.desc.household_gods.explanation: "– Pyta się nas, czy bogów domowego ogniska można czcić i oddawać im cześć w gospodarstwach, w których wyznawana jest wiara [ROOT.Char.GetFaith.GetAdjective|l]."
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "– Pyta się nas, czy obrządki i prawa Dalekiego Wschodu można wpleść w naszą wiarę."
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "– Pyta się nas, czy możemy czerpać naukę z religii Wschodu – których wyznawcy żyją wspólnie, nie wyzywając się nawzajem od złych – mimo że nie oddajemy czci ich orientalnym bogom."
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "– Pyta się nas, czy dawne zwyczaje ludowe nowo nawróconych można pozostawić w niezmienionej postaci – czerpać z nich po cichu, zamiast je odrzucać i potępiać."
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "– Pyta się nas, czy osoby nieznające Chrystusa mogą szanować Jego nauki i przykład, nie uznając Go za prawdziwego Boga."
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] może wykorzystać prawo Saracenów oraz połączyć ich nauki z Ewangelią."
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] może wykorzystać prawo i nauki żydów, nawet jeśli nie podzielamy wszystkich ich twierdzeń."
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "– Pyta się nas, czy ból jest święty. Czy zadawanie go jest błogosławieństwem, a znoszenie – łaską [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "– Pyta się nas, czy świętość polega na porzuceniu miast i życiu na łonie natury – czy trzeba wrócić do pierwotnego stanu istnienia?"
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "– Pyta się nas, czy panowanie nad światem żywych istot jest świętą sprawą. Czy przejęcie władzy spełnia wolę [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "– Pyta się nas, czy w ramach świętego obrządku można spożywać ciała zmarłych."
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "– Pyta się nas, czy oszustwo może być święte. Czy wierni mogą kłamać, a nawet wierzyć we własne nieprawdy, gdy rzeczywistość zagrażałaby wierze?"
 ecumenical_council_events.0010.desc.polyamory.explanation: "– Pyta się nas, czy wierni mogą dzielić się miłością z wieloma osobami i odrzucać twierdzenie, że tylko jedna dusza może mieć prawo do uczuć innej."
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "– Pyta się nas, czy w ramach świętej ceremonii można złożyć w ofierze ludzkie życie. Czy wiara [ROOT.Char.GetFaith.GetAdjective|l] zezwala, aby osoby chętne oraz winne zbrodni można było poświęcać na ołtarzach?"
 ecumenical_council_events.0010.desc.megaliths.explanation: "– Pyta się nas, czy dla chwały [ROOT.Char.GetFaith.HighGodNamePossessive] należy wznosić wielkie kamienne pomniki."
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "– Pyta się nas, czy wierni muszą współdzielić wszystkie dobra materialne."
 ecumenical_council_events.0010.desc.pure_land.explanation: "– Pyta się nas, czy do szczęśliwej krainy wolnej od cierpienia można dotrzeć tylko dzięki zaufaniu i oddaniu, a nie ze względu na bogactwa, naukę czy biegłość w rytuałach."
 ecumenical_council_events.0010.desc.no_mind.explanation: "– Pyta się nas, czy istotę [ROOT.Char.GetFaith.HighGodNamePossessive] znajduje się poprzez opróżnienie umysłu i wyciszenie własnego ja."
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "– Pyta się nas, czy wysokie szczyty są rzeczywiście wyniesione i święte. Czy [ROOT.Char.GetFaith.HighGodNamePossessive] najlepiej jest szukać wśród górskich wierzchołków?"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "– Pyta się nas, czy w naszej epoce zapada mrok, a demony przybierają postać ludzi pobożnych. Czy musimy zabijać takich wrogów, aby bronić świętego prawa, gdy ulega ono degradacji?"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "– Pyta się nas, czy głowy poległych należy traktować jako święte trofea."
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "– Pyta się nas, czy dążenie do wiedzy jest świętym obowiązkiem."
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] domaga się, aby sprawiedliwe rządy były świętą powinnością książąt."
 ecumenical_council_events.0010.desc.filial_piety.explanation: "– Pyta się nas, czy wola [ROOT.Char.GetFaith.HighGodNamePossessive] nakazuje szacunek wobec rodziców i osób starszych."
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "– Pyta się nas, czy wiara [ROOT.Char.GetFaith.GetAdjective|l] domaga się, aby społeczna harmonia, w ramach której każda dusza zajmuje ustalone miejsce, stanowiła sedno religijnego porządku."
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "– Pyta się nas, czy sam akt zniszczenia może być święty. Czy to właśnie burzenie starego świata jest tym, czego wymaga od nas wola [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ecumenical_council_events.0010.desc.preservation.explanation: "– Pyta się nas, czy świętość polega na wznoszeniu i utrzymywaniu tego, co zostało zbudowane. Czy wiara [ROOT.Char.GetFaith.GetAdjective|l] wymaga, abyśmy pielęgnowali świątynie oraz inne dzieła, dzięki czemu będą mogły wiecznie kwitnąć?"
 ecumenical_council_events.0010.desc.takamin.explanation: "– Pyta się nas, czy potężny niedźwiedź jest boskim pośrednikiem. Czy podczas polowania należy czcić tę wielką bestię jako świętą, a zabijać ją tylko z nabożnym szacunkiem?"
 ecumenical_council_events.0010.a_1: "Zastąpi to dogmat „[current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]”."
 ecumenical_council_events.0010.a_2: "Zrobię na to miejsce, rezygnując z dogmatu „[current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]”."
 ecumenical_council_events.0010.a_3: "Dogmat „[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]” musi odejść w zapomnienie."
 ecumenical_council_events.0010.b: "Zakażmy tego zwyczaju!"
 ecumenical_council_events.0010.c: "Na razie po prostu pozwolę tego przestrzegać."
 ecumenical_council_events.0010.d: "Przynajmniej uznajmy ten dogmat."
 ecumenical_council_events.0011.t: "$ecumenical_council_events.0010.t$"
 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$"
 ecumenical_council_events.0011.desc.outro: "Nasz gospodarz, [host.GetTitledFirstName], oświadcza:\n\n– Proponuję, aby dogmat „[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]”"
 ecumenical_council_events.0011.desc.permit: "uznano za dozwolony."
 ecumenical_council_events.0011.desc.prohibit: "uznano za zakazany."
 ecumenical_council_events.0011.desc.learn: "uznano za znany."
 ecumenical_council_events.0011.desc.make_core: "uznano za fundamentalny, zastępując dogmat „[core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]”."
 ecumenical_council_events.0011.a: "Jestem za zmianą."
 ecumenical_council_events.0011.b: "Nie zgadzam się."
