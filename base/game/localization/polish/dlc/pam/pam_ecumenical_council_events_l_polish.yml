 # Flavor Events
 ecumenical_council_summons_events.0001.t: "Zmartwienia osoby znanej jako [guest_1.GetTitleAsNameNoTooltip|U]"
 ecumenical_council_summons_events.0001.desc: "– A co do mojej sprawy… Na litość [guest_1.GetFaith.HighGodNamePossessive], ona mnie pochłania… Nie mogę zmrużyć oka… – [guest_1.GetTitledFirstName] mówi szeptem pełnym bólu, a [guest_2.GetTitledFirstName] słucha tych zwierzeń.\n\n– Rozumiem… – kiwa głową [guest_2.GetFirstNameNoTooltip]. – Być może [host.GetTitleAsNameNoTooltip] będzie w stanie coś na to zaradzić? Udzielić jakiejś porady duchowej?"
 ecumenical_council_summons_events.0001.a: "Co może [guest_1.Custom('PL_go_ja')] tak pochłaniać…"
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Poznajesz sekret, który skrywa [guest_1.GetShortUINameNotMe]"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip] potrzebuje odrobiny przyjacielskiego pocieszenia."
 ecumenical_council_summons_events.0001.c: "Niech to pozostanie tajemnicą."
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUINameNotMe] pociesza podczas soboru powszechnego osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe] w kwestii [TARGET_CHARACTER.Custom('PL_jego_jej')] sekretu."
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] pociesza podczas soboru powszechnego osobę znaną jako [CHARACTER.GetShortUINameNotMe] w kwestii [CHARACTER.Custom('PL_jego_jej')] sekretu."
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUINameNotMe] daje się złapać, gdy próbuje podczas soboru powszechnego poznać sekret osoby znanej jako [TARGET_CHARACTER.GetShortUINameNotMe]."
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUINameNotMe] przyłapuje podczas soboru powszechnego osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe] na próbie poznania [CHARACTER.Custom('PL_jego_jej')] sekretu."
 ecumenical_council_summons_events.0010.t: "Sekret"
 ecumenical_council_summons_events.0010.desc: "Nasz gospodarz, którym jest [host.GetTitledFirstName], zdaje się nie zauważać mojej obecności, gdy sługa próbuje pomóc [host.Custom('PL_mu_jej')] poprawić szaty.\n\n– Na litość [host.GetFaith.HighGodNamePossessive]… – pomrukuje. – Te plotki o moich… skłonnościach. Jak można pomyśleć, że Wikariusz Chrystusa przejawia takie inklinacje! Moi kardynałowie nie mogą dowiedzieć się o tych plotkach."
 ecumenical_council_summons_events.0010.a: "– Widzę, że [host.GetTitleAsNameNoTooltip] żałuje."
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Poznajesz sekret, który skrywa [host.GetShortUINameNotMe]"
 ecumenical_council_summons_events.0010.b: "„[ROOT.Char.Custom('RandomBibleQuoteShort')]”"
 ecumenical_council_summons_events.0010.b.flavor: "Znajdzie pocieszenie w pismach świętych!"
 ecumenical_council_summons_events.0010.c: "Niektóre rzeczy nie powinny wychodzić na światło dzienne."
 ecumenical_council_summons_events.0020.t: "Problemy logistyczne"
 ecumenical_council_summons_events.0020.desc.intro: "– Skoro tak musi być… – [host.GetTitledFirstName] gestem odprawia jednego z kapłanów.\n\n– Wasza czcigodność! – zwraca się do mnie."
 ecumenical_council_summons_events.0020.desc.caravans: "– Karawany przewożące nasze zapasy jeszcze nie dotarły."
 ecumenical_council_summons_events.0020.desc.servants: "– Nie mamy wystarczającej liczby służących, aby obsłużyć wszystkich naszych gości."
 ecumenical_council_summons_events.0020.desc.overcrowded: "– Liczba gości przewyższa liczbę kwater zapewnionych na czas soboru w miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetName]."
 ecumenical_council_summons_events.0020.desc.outro: "Zakładam, że nie masz dla nas rozwiązania?"
 ecumenical_council_summons_events.0020.aaa: "– To moje ziemie, Wasza Świątobliwość. Załatwię to."
 ecumenical_council_summons_events.0020.aa: "#EMP Wielu#! ludzi jest mi winnych przysługę…"
 ecumenical_council_summons_events.0020.a: "– Nie jest to problem, którego nie da się rozwiązać przy użyciu złota, wasza świątobliwość!"
 ecumenical_council_summons_events.0020.b: "– Wezwę do pomocy osoby, które są mi winne przysługę!"
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUINameNotMe] zapamięta mnie jako wpływowego kandydata…"
 ecumenical_council_summons_events.0020.c: "Mogę zaproponować tylko skromną modlitwę…"
 ecumenical_council_summons_events.0020.papabile_tt: "Twój [papabile_score|El] w sukcesji papieskiej zwiększa się o #P 10#! punktów"
 ecumenical_council_summons_events.0030.t: "Na łasce żywiołów"
 ecumenical_council_summons_events.0030.desc.intro: "Zbliża się czas soboru, wiatr wyje, a deszcz smaga ulice."
 ecumenical_council_summons_events.0030.desc.dry_season: "Jest to dość niezwykłe o tej porze roku."
 ecumenical_council_summons_events.0030.desc.wet_season: "Taka niepogoda o tej porze roku nie jest niczym niezwykłym."
 ecumenical_council_summons_events.0030.desc.outro: "[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )|U] [chaplain.GetFirstName] trzęsie się niepohamowanie.\n\n– Mój seniorze… obawiam się, że nie dam rady uczestniczyć w naradzie. Ta burza, ten ziąb… to nie służy mojemu ciału. Za dużo tej plwociny…"
 ecumenical_council_summons_events.0030.aa: "– Znam #EMP wiele#! źródeł rozprawiających o tej przypadłości!"
 ecumenical_council_summons_events.0030.a: "Muszę wezwać najlepszego medyka!"
 ecumenical_council_summons_events.0030.b: "– Pomodlę się za ciebie."
 ecumenical_council_summons_events.0030.c: "Życie pójdzie swoim torem."
 ecumenical_council_summons_events.0040.t: "Trema"
 ecumenical_council_summons_events.0040.desc: "Gdy zbliża się pora soboru, odkrywam, że [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] nerwowo krąży po dziedzińcu.\n\n– Pozostała jeszcze jedna kwestia – [ROOT.Char.GetFaith.ReligiousSymbol|l]. No tak… I jeszcze [chaplain.CustomFixedRandom('random_learning_topic')]… – Słyszę, jak mruczy do siebie."
 ecumenical_council_summons_events.0040.aa: "– [chaplain.GetFirstNameNoTooltip], musisz mieć w pamięci [ROOT.Char.GetFaith.KnowledgeGodNamePossessive]."
 ecumenical_council_summons_events.0040.aa.flavor: "Duchowe wskazówki z pewnością dadzą ukojenie."
 ecumenical_council_summons_events.0040.a: "Trzeba [chaplain.Custom('PL_mu_jej')] przypomnieć, że reprezentuje również mnie."
 ecumenical_council_summons_events.0040.a.tt.success: "Twoja dyplomacja przynosi owoce"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUINameNotMe] nie ma pewności, co do twoich intencji"
 ecumenical_council_summons_events.0040.b: "Zawsze mogę wykorzystać swoją pozycję na [chaplain.Custom('PL_jego_jej')] korzyść…"
 ecumenical_council_summons_events.0040.c: "Nie jest to nic, czemu modlitwa nie zaradzi."
 friend_reassured_at_council: "Podczas soboru powszechnego [CHARACTER.GetShortUINameNotMe] pociesza osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe]."
 friend_reassured_at_council_corresponding: "Podczas soboru powszechnego osoba, którą jest [CHARACTER.GetShortUINameNotMe], doznaje ukojenia dzięki osobie znanej jako [TARGET_CHARACTER.GetShortUINameNotMe]."
 ecumenical_council_summons_events.0050.t: "Kwestionowana wiara"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName] z trudem powstrzymuje śmiech na widok osoby znanej jako [non_pious_guest.GetTitledFirstName].\n\n– Czy [ROOT.Char.GetTitleAsNameNoTooltip] to widzi? – zwraca się do mnie. – Należy [non_pious_guest.Custom('PL_mu_jej')] się pochwała! Człowiek myślał, że jedynym znanym [non_pious_guest.Custom('PL_mu_jej')] miejscem są [Glossary( 'łaźnie', 'BATHHOUSES_GLOSS' )]."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "I pomyśleć, że ogłasza się głową wiary, którą wyznają [ROOT.Char.GetFaith.GetAdherentNamePlural|l]."
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip] to idealny kandydat na to stanowisko."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Zadziwia mnie, że dołącza [non_pious_guest.GetSheHe] do nas na tym soborze."
 ecumenical_council_summons_events.0050.aa: "Dobry pasterz musi stanąć na czele swoich owiec…"
 ecumenical_council_summons_events.0050.a: "– Mogę sprawić, że dowiedzą się o tym #EMP wszyscy#!… za określoną cenę."
 ecumenical_council_summons_events.0050.b: "– A skąd [pious_guest.GetTitleAsNameNoTooltip] wie, #EMP kto#! uczęszcza do łaźni?"
 ecumenical_council_summons_events.0050.c: "Chwalmy [ROOT.Char.GetFaith.HighGodNamePossessive] za odrobinę rozrywki."
 BATHHOUSES_GLOSS: "W wielu średniowiecznych miastach łaźnie – niegdyś przeznaczone do skromnych ablucji – zyskały złą sławę. Ich zaciemnione pomieszczenia zapewniały wystarczającą prywatność, by osoby świadczące usługi seksualne mogły zajmować się swoimi sprawami."
 friend_defended_piety_at_ec_reason: "Podczas soboru powszechnego [CHARACTER.GetShortUINameNotMe] broni pobożności osoby znanej jako [TARGET_CHARACTER.GetShortUINameNotMe]."
 friend_defended_piety_at_ec_reason_corresponding: "Wielu świadków podaje, że osoba, którą jest [TARGET_CHARACTER.GetShortUINameNotMe], broniła pobożności postaci znanej jako [CHARACTER.GetShortUINameNotMe] na soborze powszechnym."
 rival_accused_at_council_reason: "[TARGET_CHARACTER.GetShortUINameNotMe] oskarża osobę znaną jako [CHARACTER.GetShortUINameNotMe] o bezbożne zachowanie podczas soboru powszechnego."
 rival_accused_at_council_reason_corresponding: "Osoba, którą jest [CHARACTER.GetShortUINameNotMe], została oskarżona o bezbożne zachowanie podczas soboru powszechnego przez osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe]."
 pam_ecumenical_council_rite_quarrel_defused_tt: "Spór zostaje zażegnany: #P [EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_defused_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_ecumenical_council_rite_quarrel_side_taken_tt: "Wybór strony: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_side_taken_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_ecumenical_council_rite_quarrel_escalated_tt: "Spór przybiera na sile: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_escalated_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_ecumenical_council_rite_quarrel_ruled_tt: "Decyzja błyskawicznie zamyka sprawę: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_overruled_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_head_of_rite_murdered_tt: "Morderstwo [Concept('head_of_rite', 'głowy obrządku')|E]: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_head_of_rite_murdered_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_head_of_rite_excommunicated_tt: "Anatema [Concept('head_of_rite', 'głowy obrządku')|E]: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_head_of_rite_excommunicated_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_excommunication_tt: "Ekskomunika w obrządkach: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_excommunication_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_rite_war_tt: "Wojna pomiędzy obrządkami: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_war_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_holy_site_tt: "Obniżono rangę miejsca świętego: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_holy_site_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_county_conversion_tt: "Zmienił się obrządek miejsca świętego: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_county_conversion_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_county_conversion_edge_tt: "Utrata miejsca świętego wskutek obrządku schizmatycznego: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_county_conversion_edge_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_great_schism_progress_rite_conversion_tt: "Władca zmienił obrządek: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_conversion_value')|0]#! pkt postępu w kierunku [Concept('schism', 'schizmy')|E]"
 pam_ecumenical_council_roman_guests_custom: "Każdy [GetRiteByKey('roman_rite').GetAdherentName] goszczący na soborze"
 pam_ecumenical_council_greek_guests_custom: "Każdy [GetRiteByKey('byzantine_rite').GetAdherentName] goszczący na soborze"
 pam_ecumenical_council_overruled_guests_custom: "Nikt nie słuchał gości praktykujących obrządek, przeciwko któremu wydano orzeczenie – jedynie ich pouczano"
 pam_rite_quarrel_championed_opinion: "Podczas soboru powszechnego bierze stronę mojego obrządku"
 pam_rite_quarrel_slighted_opinion: "Podczas soboru powszechnego opowiada się po stronie innego obrządku niż mój"
 pam_rite_quarrel_overruled_opinion: "Podczas soboru powszechnego odrzuca mój obrządek"
 ecumenical_council_summons_events.0060.t: "Na czele pośród równych"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.GetTitledFirstName], mówiąc w imieniu wyznawców obrządku, którym jest [GetRiteByKey('roman_rite').GetName|l], nie puści tego w niepamięć:\n\n– Każdy Kościół podlega Rzymowi, a Rzym nie podlega nikomu!\n\n[ec_greek_champion.GetTitledFirstName] zlicza pięciu patriarchów na palcach:\n\n– Który z nich kiedykolwiek klęczał?"
 ecumenical_council_summons_events.0060.a: "– Spokojnie. Rada nawet się jeszcze nie zaczęła."
 ecumenical_council_summons_events.0060.a.success: "Ta dwójka zostaje utemperowana, zanim sala zdąży opowiedzieć się po czyjejś stronie"
 ecumenical_council_summons_events.0060.a.failure: "Nikt z nich mnie nie słucha, a sala dzieli się na strony"
 ecumenical_council_summons_events.0060.b: "Piotr otrzymał klucze, a Rzym je dzierży."
 ecumenical_council_summons_events.0060.c: "Rzym stoi na czele pośród równych. Nic więcej."
 ecumenical_council_summons_events.0060.d: "To ja sprawuję ten urząd. Sprawa zamknięta."
 ecumenical_council_summons_events.0061.t: "I syn"
 ecumenical_council_summons_events.0061.desc: "– Dwa słowa – mówi [ec_greek_champion.GetTitledFirstName] praktykujący obrządek znany jako [GetRiteByKey('byzantine_rite').GetName|l]. – Dwa słowa, które [GetRiteByKey('roman_rite').GetAdherentNamePlural] wtrącili do wyznania wiary; dwa słowa, o które świat wschodni nigdy nie prosił.\n\n– Prawda nie potrzebuje niczyjego przyzwolenia poza Bożym – ripostuje [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0061.a: "Wyznanie wiary przetrwało już gorsze spory."
 ecumenical_council_summons_events.0061.a.success: "Kwestia sformułowania wyznania zostaje odłożona, zanim spór zdąży się zaostrzyć"
 ecumenical_council_summons_events.0061.a.failure: "Spór się zaostrza i owocuje powstaniem dwóch różnych doktryn"
 ecumenical_council_summons_events.0061.b: "Te słowa zostały dodane, ponieważ są prawdziwe."
 ecumenical_council_summons_events.0061.c: "Wyznanie wiary napisał sobór. Tylko on może je zmienić."
 ecumenical_council_summons_events.0061.d: "Wyznanie wiary będzie brzmiało tak, jak powiem."
 ecumenical_council_summons_events.0062.t: "Chleb z ołtarza"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName] unosi opłatek, cienki i blady niczym moneta, i mówi:\n\n– [GetRiteByKey('roman_rite').GetAdherentNamePlural|U] nigdy nie potrzebowali więcej.\n\n[ec_greek_champion.GetTitledFirstName] kładzie obok niego bochen i pyta:\n\n– Czy zatem [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] tkwili w błędzie od czasów apostolskich?"
 ecumenical_council_summons_events.0062.a: "Jutro oba chleby zostaną poświęcone na moim ołtarzu i z każdego będziemy jeść."
 ecumenical_council_summons_events.0062.a.success: "Oba chleby zostają zjedzone, a razem z nimi znika spór"
 ecumenical_council_summons_events.0062.a.failure: "Tego wieczoru przygotowano dwa ołtarze, a między jednym i drugim nikt nie przechodził"
 ecumenical_council_summons_events.0062.b: "Przaśny, jak podczas Ostatniej Wieczerzy."
 ecumenical_council_summons_events.0062.c: "Chleb wyrosły ku czci Pana, który powstał z martwych."
 ecumenical_council_summons_events.0062.d: "Chleb to chleb. Liczy się błogosławieństwo."
 ecumenical_council_summons_events.0063.t: "Kwestia języka"
 ecumenical_council_summons_events.0063.desc: "Modlitwy są odczytywane po łacinie. [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|U] w ławkach czekają na tłumaczenie, ale to, które słyszą, nie jest do końca wierne. [ec_greek_champion.GetTitledFirstName] mamrocze:\n\n– Rzymianie dowodzą swoich racji jak mecenasi. Pełno u nich słów, a treści żadnej.\n\n– Grecy za to jak filozofowie. Nie rozstrzygają niczego – odpowiada [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0063.a: "Znajdźmy więc słowa, które nie zatracą znaczenia w żadnym tych z języków."
 ecumenical_council_summons_events.0063.a.success: "Znaleziono sformułowanie, które zachowuje znaczenie dla obu stron"
 ecumenical_council_summons_events.0063.a.failure: "Obie strony tkwią w przekonaniu, że adwersarz grał nieczysto"
 ecumenical_council_summons_events.0063.b: "Należy mówić to po łacinie, prosto."
 ecumenical_council_summons_events.0063.c: "Nasi ojcowie posługiwali się greką. Damy radę ją odczytać."
 ecumenical_council_summons_events.0063.d: "Modlitwy będą funkcjonować w obu językach, ja się pod tym podpisuję. Koniec tematu."
