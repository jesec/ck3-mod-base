 ecumenical_council_events.0104.t: "Duchowni z mojej krwi"
 ecumenical_council_events.0104.desc: "Duchowni z mojej rodziny dyskutują, gdzie ród [ROOT.Char.GetHouse.GetName] powinien wykorzystać swoje wpływy.\n\n– Nasz ród nie powinien być jawnie podzielony. [host.GetTitledFirstName] nie może liczyć, że stanę po [host.GetTitledFirstName.Custom('PL_jego_jej')] stronie! – mówi [lead_conservative.GetTitledFirstName]\n\n[lead_innovator.GetTitledFirstName] robi za [lead_conservative.Custom('PL_jego_jej')] plecami szydercze gesty, sugerując, że nie wszyscy członkowie mojego rodu są przeciwni innowacjom."
 ecumenical_council_events.0104.support: "Wezwij ród [ROOT.Char.GetHouse.GetNameNoTooltip] do poparcia tej sprawy."
 ecumenical_council_events.0104.support_duel: "Zjednaj sobie tych, którzy sprzeciwiają się innowacjom."
 ecumenical_council_events.0104.support_duel.success: "Twój ród poprze tę sprawę"
 ecumenical_council_events.0104.support_duel.success_halved: "Nieliczni poprą tę sprawę"
 ecumenical_council_events.0104.support_duel.failure: "Twój ród jest podzielony"
 ecumenical_council_events.0104.oppose: "Ty i [lead_conservative.GetFirstNameNoTooltip] stańcie wspólnie przeciwko innowacjom."
 ecumenical_council_events.0104.oppose_duel: "Niech [lead_innovator.GetFirstNameNoTooltip] usłyszy twoje ostrzeżenie – ród nie może być podzielony."
 ecumenical_council_events.0104.oppose_duel.success: "Twój ród decyduje się sprzeciwić zmianie"
 ecumenical_council_events.0104.oppose_duel.success_halved: "Nieliczni członkowie twojego rodu odrzucają zmianę"
