 ecumenical_council_events.0111.t: "Zrzędliwi starcy"
 ecumenical_council_events.0111.desc: "Siwowłosi starcy krążą, kłócąc się między sobą.\n\n– Byliśmy świadkami wielu soborów, a każdy z nich popełniał błędy. Zamiast jednak naprawiać te wypaczenia, wygląda na to, że wkrótce wprowadzimy ich jeszcze więcej! – narzeka [lead_conservative.GetTitledFirstName].\n\n– Na starość tracisz rozum! Zawsze mówisz to samo i będziesz tak paplać aż do grobowej deski! – odgryza się [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0111.support: "Ta zmiana naprawi stare błędy!"
 ecumenical_council_events.0111.support_duel: "Powtórz argumenty na rzecz zmiany przemawiające do starszych."
 ecumenical_council_events.0111.support_duel.success: "Mimo narzekań zgadzają się"
 ecumenical_council_events.0111.support_duel.success_halved: "Nieliczni zgadzają się z tą korektą"
 ecumenical_council_events.0111.support_duel.failure: "Wciąż lamentują: „To zepsucie!”"
 ecumenical_council_events.0111.oppose: "Niech [lead_conservative.GetTitledFirstNameNoTooltip] otrzyma twoje poparcie – koniec z głupotami."
 ecumenical_council_events.0111.oppose_duel: "Zetrzyj tych starych marzycieli w intelektualny proch!"
