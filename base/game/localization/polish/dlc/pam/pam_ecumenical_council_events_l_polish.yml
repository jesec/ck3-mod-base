 ecumenical_council_events.0106.t: "Dług lojalności"
 ecumenical_council_events.0106.desc: "Ja i moi wasale zbieramy się w jednej z sal.\n\n– Nawet tutaj odpowiadacie przed waszym seniorem – [lead_conservative.GetTitledFirstName] ostrzega pozostałych. – Jeśli [ROOT.Char.GetTitleAsName] nie opowie się za tą heretycką nowinką, to i wy musicie zamilknąć.\n\n– [ROOT.Char.GetTitleAsNameNoTooltip] ma nad nami władzę w innych miejscach, ale nie tutaj! – odpowiada [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0106.desc_innovator: "Ja i moi wasale zbieramy się w jednej z sal.\n\n– Senior domaga się odpowiedzi – mówi [lead_conservative.GetTitledFirstName]. – Niestety, obawiam się, że ta sprawa może [ROOT.Char.Custom('PL_go_ja')] przerastać. Tylko wola [lead_conservative.GetFaith.HighGodNamePossessive] kieruje naszymi sercami i to ona wyznacza granicę, której musimy stanowczo bronić!\n\n– Ach, ale życzenia, jakie wyraża [ROOT.Char.GetTitleAsNameNoTooltip], nie sprzeciwiają się woli [lead_conservative.GetFaith.HighGodNamePossessive] – odpowiada [lead_innovator.GetTitledFirstName]. – Pamiętaj o swojej przysiędze i wsłuchuj się w [ROOT.Char.Custom('PL_jego_jej')] mądrość."
 ecumenical_council_events.0106.support: "– Jako [ROOT.Char.GetTitleAsNameNoTooltip] jestem pośrednikiem [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0106.support_duel: "Zażądaj lojalności, którą przysięgali ci wasale."
 ecumenical_council_events.0106.support_duel.success: "Będą ci posłuszni"
 ecumenical_council_events.0106.support_duel.success_halved: "Nieliczni są ci posłuszni"
 ecumenical_council_events.0106.support_duel.failure: "Twoi wasale są lojalni wyłącznie wobec [lead_conservative.GetFaith.HighGodNamePossessive]"
 ecumenical_council_events.0106.oppose: "Niech [lead_conservative.GetTitledFirstNameNoTooltip] cieszy się twoim poparciem – ta sprawa wykracza poza kompetencje seniora."
 ecumenical_council_events.0106.oppose_duel: "Upieraj się, że życzenia seniora nie są sprzeczne z wolą Boga."
 ecumenical_council_events.0106.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0106.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0106.oppose_duel.failure: "Zostają przy swoim stanowisku"
