 ecumenical_council_events.0122.t: "Póki jeszcze mogę"
 ecumenical_council_events.0122.desc: "Grupa schorowanych kapłanów siedzi z dala od tłumu zgromadzonego w sali, ogrzewając się w cieple słońca.\n\n– Ciekawe, czy będzie mi dane usłyszeć ostatnie słowa tego soboru, zanim zobaczę oblicze [ROOT.Char.GetFaith.HighGodNamePossessive]… i przywitają mnie [lead_conservative.GetFaith.NegativeAfterLife] oraz panujący tam smród świeżej zgrozy – jęczy [lead_conservative.GetTitledFirstName].\n\n– Masz tak mało do stracenia, ale z pewnością pozostała ci jeszcze odrobina nadziei, którą możesz ofiarować światu, a wtedy [lead_innovator.GetFaith.PositiveAfterLife] – to tam trafisz. Mam rację? – odpowiada [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0122.support: "– Na litość [ROOT.Char.GetFaith.HighGodNamePossessive], te ostatnie chwile są cenne!"
 ecumenical_council_events.0122.support_duel: "Nie stanę przed obliczem [ROOT.Char.GetFaith.HighGodNamePossessive], jeśli będę milczeć."
 ecumenical_council_events.0122.support_duel.success: "Zostają zainspirowani do przeprowadzenia ostatniej reformy"
 ecumenical_council_events.0122.support_duel.success_halved: "Nieliczni zostają zainspirowani do przeprowadzenia ostatniej reformy"
 ecumenical_council_events.0122.support_duel.failure: "Odejdą z tego świata w goryczy"
 ecumenical_council_events.0122.oppose: "Nasze ostatnie siły należą do [ROOT.Char.GetFaith.HighGodNamePossessive] i świętego Słowa."
 ecumenical_council_events.0122.oppose_duel: "– Nie pozwólmy zhańbić tym naszego życia!"
 ecumenical_council_events.0122.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0122.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
