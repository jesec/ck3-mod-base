 ecumenical_council_events.0082.opening: "Wasza Czcigodność!"
 ecumenical_council_events.0082.desc: "Duchowieństwo zwarło szyki. To, co zarządzili podczas Twojej nieobecności, ciąży teraz nad nami, a nasze zdanie na ten temat nie miało żadnego znaczenia."
 ecumenical_council_events.0082.desc.unchanged: "Duchowieństwo zwarło szyki, ale, mimo ich burzliwych dysput, nic się nie zmieniło. Jesteśmy w punkcie wyjścia."
