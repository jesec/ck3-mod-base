 ecumenical_council_events.0102.support_duel.failure: "Ich modlitwy się utrzymują, a twoje kazanie nie robi na nikim wrażenia"
 ecumenical_council_events.0102.oppose: "Włącz się w modlitwy na rzecz starego prawa."
 ecumenical_council_events.0102.oppose_duel: "Głoś stare prawo, aż ich grupa ulegnie."
