 ecumenical_council_events.0107.t: "Ich pierwszy sobór"
 ecumenical_council_events.0107.desc: "Grupa młodych duchownych rozprawia ożywionym tonem, wyraźnie podekscytowana tym, że dla wielu z nich to pierwszy sobór.\n\n– Narasta tu poruszenie – czy czujecie dotyk [lead_innovator.GetFaith.HouseholdGodNamePossessive]? Zostawmy swój ślad w Kościele, wykażmy się dawno zapomnianą odwagą! – mówi [lead_innovator.GetTitledFirstName].\n\n– Nędzni głupcy! Musimy się kierować nauką Ojców Kościoła i odrzucić te obrzydliwe nowinki – podkreśla [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0107.support: "Nowy świt dla wiary!"
 ecumenical_council_events.0107.support_duel: "Odrzuć to konserwatywne tchórzostwo."
 ecumenical_council_events.0107.support_duel.success: "W ich oczach pojawia się blask nadziei"
 ecumenical_council_events.0107.support_duel.success_halved: "Nieliczni deklarują swoje poparcie"
 ecumenical_council_events.0107.support_duel.failure: "Nadal okazują pogardę"
 ecumenical_council_events.0107.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] ma rację."
 ecumenical_council_events.0107.oppose_duel: "Potęp zagrożenia płynące z zuchwałości!"
 ecumenical_council_events.0107.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0107.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0107.oppose_duel.failure: "Gardzą twoim tchórzostwem"
