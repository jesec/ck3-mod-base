 ecumenical_council_events.0040.t: "Koniec soboru"
 ecumenical_council_events.0040.desc: "Po żmudnych pracach obrady soboru dobiegają końca."
 ecumenical_council_events.0040.desc.change: "Pod moim przewodnictwem wiara [ROOT.Char.GetFaith.GetAdjective|l] zmienia swoje fundamenty. Musimy teraz podzielić się tymi wspaniałymi informacjami ze zwykłym ludem!"
 ecumenical_council_events.0040.desc.status_quo: "Nie udało mi się przeforsować żadnej z zaproponowanych przeze mnie reform. Wiara [ROOT.Char.GetFaith.GetAdjective|l] pozostaje bez zmian."
 ecumenical_council_events.0040.a: "Pora iść do domu."
 ecumenical_council_events.0041.t: "Koniec soboru"
 ecumenical_council_events.0041.desc: "Po żmudnych pracach obrady soboru dobiegają końca."
 ecumenical_council_events.0041.desc.change: "Pod przewodnictwem osoby, którą jest [host.GetName], wiara [host.GetFaith.GetAdjective|l] zmienia swoje fundamenty. Musimy teraz podzielić się tymi wspaniałymi informacjami ze zwykłym ludem!"
 ecumenical_council_events.0041.desc.status_quo: "[host.GetName] nie przeprowadza żadnych z zaproponowanych przez siebie reform. Wiara [host.GetFaith.GetAdjective|l] pozostaje bez zmian."
 ecumenical_council_events.0041.a: "$ecumenical_council_events.0040.a$"
 ecumenical_council_events.schism_crisis_end: "\n\nKażda delegacja wraca do domu z własną wersją tego, kto ustąpił, a kto zdradził. Tak podzielony organizm nie może trwać wiecznie."
