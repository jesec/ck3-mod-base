 ecumenical_council_events.0110.t: "Niepohamowana ambicja"
 ecumenical_council_events.0110.desc: "– To tylko drobna zmiana! – mówi [lead_innovator.GetTitledFirstName]. – A jeśli to przeforsujemy, będzie spora szansa, że to ktoś z nas obejmie zwierzchnictwo jako [lead_innovator.GetFaith.ReligiousHeadName].\n\n– Twoja niepohamowana ambicja nie ma granic i doprowadzi nas wszystkich do zguby – drwi [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0110.support: "Odrobina ambicji nie zaszkodzi"
 ecumenical_council_events.0110.support_duel: "Stań po stronie postępu!"
 ecumenical_council_events.0110.support_duel.success: "Zgadzają się – to w końcu tylko drobna zmiana"
 ecumenical_council_events.0110.support_duel.success_halved: "Nieliczni uznają zasadność poparcia zmiany"
 ecumenical_council_events.0110.support_duel.failure: "Twoja chciwość jest ewidentna"
