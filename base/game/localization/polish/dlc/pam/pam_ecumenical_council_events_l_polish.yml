 ecumenical_council_events.0103.t: "Cena zmiany"
 ecumenical_council_events.0103.desc: "– Twoja nieustępliwość doprowadzi nas do zguby! – krzyczy [lead_innovator.GetTitledFirstName].\n\n[lead_conservative.GetPrimaryTitle.GetNameNoTooltip] i miejscowi wierni podziękują patronowi, dzięki któremu ich [lead_conservative.Custom('GetFaithTemple')] odzyska swój blask – mówi [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0103.support: "Zaoferuj patronat."
 ecumenical_council_events.0103.support_duel: "Wyjaśnij, w jaki sposób [lead_conservative.Custom('PL_jego_jej')] wierni mogą zostać ubogaceni."
 ecumenical_council_events.0103.support_duel.success: "Dostrzegają wartość innowacji"
 ecumenical_council_events.0103.support_duel.success_halved: "Nieliczni dostrzegają wartość innowacji"
 ecumenical_council_events.0103.support_duel.failure: "Wszyscy nadal wstrzymują się od głosu"
 ecumenical_council_events.0103.oppose: "Zaoferuj patronat."
 ecumenical_council_events.0103.oppose_duel: "Ostrzeż [lead_innovator.Custom('PL_go_ja')], że innowacje doprowadzą do zubożenia [lead_innovator.Custom('PL_jego_jej')] wiernych."
 ecumenical_council_events.0103.oppose_duel.success: "Uczą się lękać tego bluźnierstwa"
