 ec_sway_leave: "Niech się dzieje wola [ROOT.Char.GetFaith.HighGodNamePossessive|U]."
 ecumenical_council_events.0101.t: "Uczeni przemówili"
 ecumenical_council_events.0101.desc: "Uczeni wymieniają się cytatami z oponentami po drugiej stronie sali, a każdy werset zaostrza spór.\n\n– [lead_conservative.GetFaith.ReligiousText|U] – tam wszystko jest opisane jasno – stwierdza stanowczo [lead_conservative.GetTitledFirstName] – a [ec_current_topic.GetName( activity.GetHost.GetRite )] to podgląd, który musi pozostać bez zmian.\n\n– Przeczytaj przywołany przeze mnie fragment w całości – odpowiada [lead_innovator.GetTitledFirstName] – zauważysz, że święte pisma praktycznie domagają się tej zmiany!"
 ecumenical_council_events.0101.support: "Zwróć uwagę na brakujący kontekst przywołanego fragmentu."
 ecumenical_council_events.0101.support_duel: "Przekonaj ich lepszą znajomością tematu."
 ecumenical_council_events.0101.support_duel.success: "Przyjmują zmianę wynikającą z tekstu"
 ecumenical_council_events.0101.support_duel.success_halved: "Nieliczni przyjmują zmianę wynikającą z tekstu"
 ecumenical_council_events.0101.support_duel.failure: "Nadal twierdzą, że tekst to wyklucza"
 ecumenical_council_events.0101.oppose: "Niech [lead_conservative.GetTitledFirstNameNoTooltip] otrzyma twoje poparcie – tekst powinien pozostać bez zmian."
 ecumenical_council_events.0101.oppose_duel: "Twierdź, że zmiana wynika z tego fragmentu."
 ecumenical_council_events.0101.oppose_duel.success: "Stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0101.oppose_duel.success_halved: "Nieliczni stronnicy osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
