 ecumenical_council_events.0114.t: "Uzbrojeni w wiarę i stal"
 ecumenical_council_events.0114.desc.intro: "Jak to zwykle bywa w przypadku ludzi znających wojnę, starzy żołnierze z naszego grona wspólnie zabijają czas.\n\n– Na miłość [ROOT.Char.GetFaith.HighGodNamePossessive], dobrze będzie uzgodnić te zmiany. Wierni znów się zjednoczą pod jednym sztandarem! – stwierdza [lead_innovator.GetTitledFirstName]\n\n"
 ecumenical_council_events.0114.desc.conservative: "– Z naszych rąk zginął już niejeden [ec_hostile_faith.GetAdherentName] – mówi [lead_conservative.GetTitledFirstName]. – Czy nasze sztandary nie mają już błogosławieństwa [lead_conservative.GetFaith.WarGodNamePossessive]?"
 ecumenical_council_events.0114.desc.conservative_generic: "– Z naszych rąk zginął już niejeden wróg – mówi [lead_conservative.GetTitledFirstName]. – Czy nasze sztandary nie mają już błogosławieństwa [lead_conservative.GetFaith.WarGodNamePossessive]?"
 ecumenical_council_events.0114.support: "Wznieśmy wysoko nowy, pobłogosławiony sztandar."
 ecumenical_council_events.0114.support_duel: "Zwerbuj bojaźliwych pod błogosławiony sztandar [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 ecumenical_council_events.0114.support_duel.success: "Żołnierz musi służyć"
 ecumenical_council_events.0114.support_duel.success_halved: "Zwerbowano nielicznych"
 ecumenical_council_events.0114.support_duel.failure: "Z uporem trzymają się swojego stanowiska"
 ecumenical_council_events.0114.oppose: "Niech [lead_conservative.GetTitledFirstNameNoTooltip], obrońca ortodoksji, otrzyma twoje poparcie."
 ecumenical_council_events.0114.oppose_duel: "A więc stoczymy pojedynek na słowa!"
 ecumenical_council_events.0114.oppose_duel.success: "Towarzysze osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0114.oppose_duel.success_halved: "Nieliczni towarzysze osoby znanej jako [lead_innovator.GetTitledFirstNameNoTooltip] ustępują"
 ecumenical_council_events.0114.oppose_duel.failure: "Ich szarża na nic się zda"
