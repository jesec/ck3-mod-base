 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetNameNoTooltip] wrażliwość"
 ecumenical_council_events.0105.desc: "Wśród wielu dialektów, które można tutaj usłyszeć, wyróżniają się znajome dźwięki, którymi charakteryzuje się język [ROOT.Char.GetCulture.GetLanguage.GetName|l]. To oczywiście [lead_conservative.GetTitledFirstName] dręczy naszych ludzi.\n\n– My [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] nie lubimy takich nowinek! – narzeka.\n\nCzy jednak chcesz, aby obwiniano nas za to, że Kościół stoi w miejscu? – rzuca [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0105.support: "[lead_conservative.GetFirstNameNoTooltip] nie mówi za nas wszystkich."
 ecumenical_council_events.0105.support_duel: "My [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] słyniemy z innowacji."
 ecumenical_council_events.0105.support_duel.success: "Wszyscy obecni zgadzają się poprzeć tę sprawę"
 ecumenical_council_events.0105.support_duel.success_halved: "Nieliczni zgadzają się poprzeć tę sprawę"
 ecumenical_council_events.0105.support_duel.failure: "Wciąż odrzucają innowacje"
 ecumenical_council_events.0105.oppose: "[ROOT.Char.GetCulture.GetNameNoTooltip] tradycja jest warta poparcia!"
 ecumenical_council_events.0105.oppose_duel: "Stań po stronie tradycji."
