l_polish:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "Badania nad religią"
 study_scripture_action: "Badania nad religią"
 study_scripture_desc: "Oddam się studiowaniu rzeczy świętych – zbadam tekst znany jako [GetPlayer.GetFaith.ReligiousText], doktryny mojej wiary i tajemnice wykraczające poza nie."
 study_scripture_desc_general: "[personal_scheme|E] „$study_scripture$” to spisek, w którym próbujesz zyskać [piety|El], [Concept('skill', 'umiejętności')|E] oraz [Concept('trait', 'cechę')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "Zwiększasz swoje umiejętności, uzyskujesz pobożność lub znajdujesz okazję"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "Przyjmujesz dogmat „[GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]”: $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "Przyjmujesz dogmat „[GetTenetType('tenet_scholasticism').GetBaseName]”: $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "[learning|E] twojego zwierzchnika duchownego: $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "Posiadasz modyfikator „[GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip]”: $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "[stress|E] odbija się na twojej nauce: $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "Posiadasz cechę [GetTrait('zealous').GetName( owner )|l]: $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "Posiadasz cechę [GetTrait('cynical').GetName( owner )|l]: $VALUE|+0=$"
 pam_study_scripture_decision: "Studiuj następujące pismo: [ROOT.Char.GetFaith.ReligiousText]"
 pam_study_scripture_decision_desc: "Święte pismo – [ROOT.Char.GetFaith.ReligiousText] – nie przeczyta się samo, a doktryny wiary znanej jako [ROOT.Char.GetFaith.GetName|l] nie objawią swego znaczenia bezczynnym umysłom. [ROOT.Char.Custom('StudyOfficesWord')|U] – to musi zaczekać. Wyznacz godziny przerwy. Badaj, kontempluj i pokaż swojej trzódce, że nawet ich pasterz się uczy."
 pam_study_scripture_decision_tooltip: "Rozpocznij [scheme|El] „[GetScheme('study_scripture').GetTypeName]”, biorąc siebie za jego cel"
 pam_study_scripture_decision_tt: "Rozpoczynasz [scheme|El] „[GetScheme('study_scripture').GetTypeName]”, biorąc siebie za jego cel\n\nPrzewidywane nagrody:\n$EFFECT_LIST_BULLET$ [piety_i] [piety|E]\n$EFFECT_LIST_BULLET$ [trait|E] lub [trait_level_track_xp|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$ [skill|E] [learning_i] [stewardship_i] [diplomacy_i] #weak (do 8)#!\n$EFFECT_LIST_BULLET$ Możliwości pośród [Concept('clergy', 'duchowieństwa')|E]\n\nWady:\n$EFFECT_LIST_BULLET$ Możesz zyskać [stress_i] [stress|El]\n$EFFECT_LIST_BULLET$ Zmniejszenie zysku [prestige_i] [Concept('prestige', 'prestiżu')|E]"
 pam_study_scripture_decision_confirm: "Niech rozpocznie się lekcja."
 pam_study_scripture_decision_req_tt: "Nie przeprowadzasz obecnie [Concept('scheme', 'spisku')|E] „[GetScheme('study_scripture').GetTypeName]”"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon! #alert_trial Twój trwający [personal_scheme|El] zakończy się#!"
 study_scripture_title: "$study_scripture$: "
 study_scripture_outcome_piety: "$study_scripture_title$: nagrodzone oddanie"
 study_scripture_outcome_fragment_tt: "#EMP „[owner.Custom('RandomStudyVerseFragment')]”#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$: wgląd w pisma"
 study_scripture_outcome_mystery: "$study_scripture_title$: rzut oka na tajemnice"
 study_scripture_outcome_stress: "$study_scripture_title$: męcząca nauka"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "Słowo twe lampą dla mych stóp, światłem na mej drodze…"
 pam_ss_fragment_psalm_119_165: "Wielki spokój ogarnia tych, którzy miłują twe prawo…"
 pam_ss_fragment_proverbs_9_9: "Przekaż swą mądrość mędrcom…"
 pam_ss_fragment_proverbs_4_7: "Tutaj zaczyna się wiedza…"
 pam_ss_fragment_joshua_1_8: "Rozmyślaj nad tym w dzień i w nocy…"
 pam_ss_fragment_matthew_7_7: "Szukajcie, a znajdziecie…"
 pam_ss_fragment_james_1_5: "A jeśli komuś spośród was brak mądrości…"
 pam_ss_fragment_2_timothy_2_15: "Stań przed Bogiem jako ktoś godny…"
 pam_ss_fragment_verbum_domini: "Verbum Domini manet in aeternum…"
 pam_ss_fragment_generic_1: "Tajemnice pogłębiają się…"
 pam_ss_fragment_generic_2: "Wiedza się zakorzenia…"
 pam_ss_fragment_generic_3: "Pisma odkrywają swe znaczenie…"
 # Faith-flavored vocabulary for StudyParishWord/StudyPulpitWord/StudySeminaryWord/StudyOfficesWord
 pam_ss_word_parish: "parafia"
 pam_ss_word_congregation: "kongregacja"
 pam_ss_word_pulpit: "ambona"
 pam_ss_word_minbar: "minbar"
 pam_ss_word_lectern: "mównica"
 pam_ss_word_seminary: "seminarium"
 pam_ss_word_madrasa: "madrasa"
 pam_ss_word_school: "szkoła"
 pam_ss_word_offices: "biura"
 pam_ss_word_daily_prayers: "codzienne modlitwy"
 pam_ss_word_daily_rites: "codzienne rytuały"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "Porzucone badania"
 pam_lapsed_studies_modifier_desc: "Ta postać w desperacji porzuciła święte nauki."
 pam_renewed_zeal_modifier: "Odzyskana gorliwość"
 pam_renewed_zeal_modifier_desc: "Po otrzymaniu surowej reprymendy postać ta ponownie oddała się swoim badaniom.\n[success_chance|E] spisku „[GetScheme('study_scripture').GetTypeName]”: #P +10%#!"
 pam_inspired_study_modifier: "Zainspirowane badania"
 pam_inspired_study_modifier_desc: "Przemyślany podarunek sprawia, że badania posuwają się naprzód."
 pam_cloistered_rigor_modifier: "Dyscyplina w odosobnieniu"
 pam_cloistered_rigor_modifier_desc: "Badania te prowadzone są za zamkniętymi drzwiami, w niesłabnącym rygorze."
 pam_cloistered_rigor_personal_modifier: "Badania w odosobnieniu"
 pam_cloistered_rigor_personal_modifier_desc: "Ta postać wycofała się ze spraw doczesnych i w niesłabnącym rygorze bada święte zagadnienia."
 pam_measured_devotion_modifier: "Wyważone oddanie"
 pam_measured_devotion_modifier_desc: "Te badania posuwają się naprzód równym tempem, w godzinach, które zostały na nie przeznaczone."
 pam_measured_devotion_personal_modifier: "Oddany uczeń pisma"
 pam_measured_devotion_personal_modifier_desc: "Ta postać bada sprawy święte ze spokojnym, wyważonym oddaniem."
 pam_mortified_flesh_modifier: "Umartwianie ciała"
 pam_mortified_flesh_modifier_desc: "Post i czuwanie wyostrzyły ten umysł, przygotowując go do badań."
 pam_divine_favor_modifier: "Boska przychylność"
 pam_divine_favor_modifier_desc: "Badania te przebiegają z bożym błogosławieństwem."
 pam_devoted_acolyte_modifier: "Oddany akolita"
 pam_devoted_acolyte_modifier_desc: "Oddany pomocnik zajmuje się wszystkim potrzebami wynikającymi z tych badań."
 pam_amanuensis_modifier: "Wierny sekretarz"
 pam_amanuensis_modifier_desc: "Wierny asystent utrzymuje zapiski w perfekcyjnym porządku."
 pam_persistent_devotions_modifier: "Nieustanne modlitwy"
 pam_persistent_devotions_modifier_desc: "Opóźnienia tylko zwiększyły dyscyplinę, z jaką przeprowadzane są te badania."
 pam_renowned_exegete_modifier: "Słynny egzegeta"
 pam_renowned_exegete_modifier_desc: "Sposób, w jaki postać ta interpretuje święte teksty, czyni ją [Glossary('egzegetą', 'GLOSS_EXEGETE')]."
 pam_doctrinal_clarity_modifier: "Jasność doktrynalna"
 pam_doctrinal_clarity_modifier_desc: "Ta postać postrzega doktryny swojej wiary z niespotykaną jasnością.\n\nAkceptacja interakcji „$sway_ruler_to_my_rite_interaction$”: #p +20#!\nAkceptacja interakcji „$pam_evangelize_personal_tenet_interaction$”: #p +20#!\nKoszt [Concept('piety', 'pobożności')|E] interakcji „$pam_evangelize_personal_tenet_interaction$”: #p -50%#!"
 pam_known_in_the_synod_modifier: "Rozpoznawalność w synodzie"
 pam_known_in_the_synod_modifier_desc: "O badaniach tej postaci rozmawia się wśród duchownych."
 pam_assisted_by_theologians_modifier: "Pomoc teologów"
 pam_assisted_by_theologians_modifier_desc: "Wykształceni teologowie pomagają tej postaci."
 pam_known_by_mystics_modifier: "Sława wśród mistyków"
 pam_known_by_mystics_modifier_desc: "Ta postać jest poważana wśród mistyków i myślicieli."
 pam_monastic_copyists_modifier: "Klasztorni kopiści"
 pam_monastic_copyists_modifier_desc: "Niestrudzeni klasztorni kopiści dostarczają nowych tekstów do badań."
 pam_charterhouse_silence_modifier: "Cisza w kartuzji"
 pam_charterhouse_silence_modifier_desc: "Dyscyplina cichych myślicieli stabilizuje te badania."
 pam_pastoral_letter_county_modifier: "List pastoralny"
 pam_pastoral_letter_county_modifier_desc: "Podczas każdego nabożeństwa odczytywany jest na głos list pocieszający, a zarazem pouczający od odległego pasterza wiary."
