l_polish:
 pam_theocratic_ruler_events.0001.t: "Darowizna na rzecz Kościoła"
 pam_theocratic_ruler_events.0001.desc: "Zamożny kupiec zapisał na rzecz Kościoła niemałą sumę pieniędzy.\n\n[subordinate_priest.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))], ma ze sobą zestawienia i listy intencyjne. Liczy na moją opinię.\n\n– W testamencie zapisano, że fundusze powinny zostać wykorzystane na umocnienie wiary w [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0001.a: "Mam dowód, że osoba znana jako [subordinate_priest.GetFirstName] źle rozporządzała świętymi funduszami…"
 pam_theocratic_ruler_events.0001.b: "– Rozważmy to wspólnie jako duchowieństwo."
 pam_theocratic_ruler_events.0001.c: "Do skarbca, okazując wdzięczność i troskę."
 pam_theocratic_ruler_events.0001.b.success: "Niezbadane są wyroki boskie"
 pam_theocratic_ruler_events.0001.b.failure: "Kapłan nie widzi sensu"
 pam_theocratic_ruler_events.0001.b.toast.success: "Przekonujesz [subordinate_priest.Custom('PL_go_ja')] i zdobywasz darowiznę."
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.GetFirstName] zatrzymuje darowiznę na rzecz [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0002.t: "Podróżnik zza granicy"
 pam_theocratic_ruler_events.0002.desc: "Docierają do mnie wieści, że osoba będąca naszym sąsiadem i wyznająca dawne zwyczaje wiary znanej jako [foreign_ruler.GetFaith.GetName|l], [foreign_ruler.GetTitledFirstName], wkroczyła na moje ziemie.\n\nTen niewielki orszak zmierza w inne miejsce, ale ich trasa przebiega na tyle blisko, że oczekuje się ode mnie oficjalnego przyjęcia ich na moim dworze.\n\nJak mam ich ugościć?"
 pam_theocratic_ruler_events.0002.a: "Skromny podarunek i propozycja pokoju."
 pam_theocratic_ruler_events.0002.b: "– Liczę na szczere wzajemne zrozumienie naszych narodów."
 pam_theocratic_ruler_events.0002.b.success: "Przekonuję ich do siebie swoją uprzejmością"
 pam_theocratic_ruler_events.0002.b.failure: "Moje słowa nie brzmią przekonująco"
 pam_theocratic_ruler_events.0002.b.toast.success: "Dzięki twojej uprzejmości wzrasta wzajemna tolerancja waszych narodów."
 pam_theocratic_ruler_events.0002.b.toast.failure: "Twoje słowa nie robią na [foreign_ruler.Custom('PL_nim_niej')] wrażenia"
 pam_theocratic_ruler_events.0002.b.acceptance: "Dworska ambasada"
 pam_theocratic_ruler_events.0002.c: "Na naszych ziemiach nie ma miejsca dla pogan."
 TRUCE_PAM_NEIGHBOR_GIFT: "\nRozejm zbudowany na podarunkach i wzajemnym szacunku sąsiadów"
 pam_theocratic_ruler_events.0003.t: "Doradztwo w sprawie umocnienia granicy"
 pam_theocratic_ruler_events.0003.desc: "Moje ziemie nie potrzebują więcej wojen ani najeźdźców. Wzywam swoją zaufaną osobę, którą jest [advisor.GetCouncilTitle|l] [advisor.GetTitledFirstName], aby wspólnie zastanowić się, co należy uczynić.\n\n– [alliance_target.GetTitledFirstName] nas wysłucha. Jako teokratyczny władca wyznający naszą wiarę może nam pomóc.\n\nA może mam wziąć ten ciężar wyłącznie na swoje barki?"
 pam_theocratic_ruler_events.0003.a: "Poślij posłańców. Musimy się zjednoczyć."
 pam_theocratic_ruler_events.0003.a.tt: "Tworzysz [alliance|El] z postacią znaną jako [alliance_target.GetShortUINameNotMeNoTooltip]"
 pam_theocratic_ruler_events.0003.b: "Zmobilizuj bogobojnych chłopów do obrony granicy."
 pam_theocratic_ruler_events.0003.b.army: "Bogobojni chłopi"
 pam_theocratic_ruler_events.0003.c: "Wyślij pomoc, aby odbudować jedno niedawno najechane hrabstwo"
 pam_theocratic_ruler_events.0003.d: "Wszystko w rękach [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0004.t: "Bracia jako sąsiedzi"
 pam_theocratic_ruler_events.0004.desc: "Ponieważ miejsce o nazwie [monastic_order_head.GetPrimaryTitle.GetName] znajduje się tak blisko, zapraszam osobę znaną jako [monastic_order_head.GetTitledFirstName], aby wspólnie omówić, w jaki sposób możemy zacieśnić naszą współpracę.\n\n– Oby dla [monastic_order_head.GetFaith.HighGodNamePossessive] liczyła się nasza gotowość do służby, nie nasza duma – [monastic_order_head.GetTitledFirstNameNoTooltip] mówi łagodnie."
 pam_theocratic_ruler_events.0004.a: "Proszę, niech twoi bracia pobłogosławią moje ziemie."
 pam_theocratic_ruler_events.0004.b: "Twój adept, [monastic_monk.GetTitledFirstNameNoTooltip], wzmocniłby mój dwór."
 pam_theocratic_ruler_events.0004.c: "Pomódlmy się wspólnie."
 pam_theocratic_ruler_events.0005.t: "Obrońcy wiary"
 pam_theocratic_ruler_events.0005.desc: "Ponieważ miejsce o nazwie [military_order_head.GetPrimaryTitle.GetName] jest już stałym elementem mojego państwa, zapraszam osobę, którą jest [military_order_head.GetTitledFirstName], aby omówić, w jaki sposób miecze wiernych mogą służyć sobie nawzajem.\n\n– Łaski [military_order_head.GetFaith.HighGodNamePossessive] dostąpią ci, którzy zamiast tkwić bezczynnie, bronić będą wiernych. – Gdy [military_order_head.GetTitledFirstNameNoTooltip] wypowiada te słowa, [military_order_head.Custom('PL_jego_jej')] towarzysz, [order_knight.GetTitledFirstName], wykonuje w milczeniu ukłon."
 pam_theocratic_ruler_events.0005.a: "Niech moi [ROOT.Char.Custom('GetFighterTermPlural')] ćwiczą według dyscypliny twojego zakonu."
 pam_theocratic_ruler_events.0005.b: "Niech [order_knight.GetTitledFirstNameNoTooltip] zostanie moim osobistym strażnikiem"
 pam_theocratic_ruler_events.0005.c: "Pomówmy o słusznej wojnie."
 pam_theocratic_ruler_events.0006.t: "Dziesięciny albo miłosierdzie"
 pam_theocratic_ruler_events.0006.desc: "[local_peasant_leader.GetTitledFirstName], głowa wioski, staje przed mym obliczem. [local_peasant_leader.Custom('PL_jego_jej')|U] ludzie przestali płacić podatki kościelne i tłumaczą to swoją trudną sytuacją.\n\n– Niech [ROOT.Char.GetLadyLord] zrozumie, zima była surowa, a nasze spichlerze stoją niemal puste – mówi łamiącym się głosem.\n\nProblem jest oczywisty: albo wprowadzę w hrabstwie dyscyplinę poprzez strach, albo utrzymam pokój, okazując miłosierdzie."
 pam_theocratic_ruler_events.0006.a: "Żadnych wyjątków. I pojmać prowodyra."
 pam_theocratic_ruler_events.0006.a.tt: "Zyskujesz [gold_i] [EmptyScope.ScriptValue('minor_gold_value')|0], [local_peasant_leader.GetShortUINameNotMeNoTooltip] trafia do więzienia, a hrabstwo o nazwie [troubled_county.GetName] otrzymuje #N przymusowe dziesięciny#! przez 5 lat (#N -20#! pkt [Concept('popular_opinion', 'powszechnej opinii')|E])."
 pam_theocratic_ruler_events.0006.b: "Puść to płazem. Miłosierdzie również służy Bogu."
 pam_theocratic_ruler_events.0006.b.tt: "Zyskujesz [piety_i] [EmptyScope.ScriptValue('minor_piety_gain')|0], a hrabstwo o nazwie [troubled_county.GetName] otrzymuje #P miłosierdzie w kwestii dziesięcin#! przez 5 lat (#P +20#! pkt [Concept('popular_opinion', 'powszechnej opinii')|E])."
 pam_theocratic_ruler_events.0006.c: "Mój zarządca mnie zawiódł. To jego wina."
 pam_theocratic_ruler_events.0006.c.tt: "Jeśli to możliwe, zdobywasz [Concept('hook', 'haka')|E] na postać znaną jako [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNotMeNoTooltip] (mocniejszy hak zobowiązania zostanie użyty, gdy będzie dostępny). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNotMeNoTooltip] traci [Concept('opinion', 'opinię')|E] o tobie (#N -20#! pkt, wartość maleje w czasie 5 lat)."
 pam_theocratic_ruler_events.0007.t: "Błoga harmonia"
 pam_theocratic_ruler_events.0007.desc: "Gdy łagodne promienie słońca rozpraszają poranną rosę i ogrzewają kamienie na dziedzińcu kościelnym, uświadamiam sobie, że choć raz nie wzywają mnie żadne obowiązki. Nawet pracowita pszczoła miodna robi sobie przerwy, by ogrzać grzbiet w promieniach świtu.\n\nNa moich ziemiach panuje cichy porządek. W skarbcach zalega złoto, a moi poddani są zadowoleni i okazują mi szacunek. Nawet mój senior, [ROOT.Char.GetLiege.GetTitledFirstName], wyraża uznanie dla tego, jak prowadzę jego poddanych ku Chrystusowi."
 pam_theocratic_ruler_events.0007.a: "Pokój ma słodki smak, lecz plany [ROOT.Char.GetFaith.HighGodNamePossessive] przewidują dla mnie większe uczynki."
 pam_theocratic_ruler_events.0007.b: "Głoś ewangelię uporządkowanego, pobożnego życia."
 pam_theocratic_ruler_events.0007.c: "Pozwólcie mi po prostu zasłuchać się w ciszy."
 pam_theocratic_ruler_events.0008.t: "Kamień na kamieniu"
 pam_theocratic_ruler_events.0008.desc: "Odkąd dane mi było odziedziczyć miejsce znane jako [stone_province.GetName] – zamek oraz jego [GetBuilding('curtain_walls_01').GetName|l] – przyglądam się tej imponującej kamiennej budowli, wzniesionej za czasów władzy o charakterze bardziej świeckim. Ale czy wiernym naprawdę potrzebne są fortyfikacje?\n\nMój majątek obejmuje wiele budowli, lecz nie [GetDomicileBuilding('episcopal_palace_01').GetName|l] godny mojego imienia, a jednak leżą tu już kamienie wycięte ludzkimi rękoma."
 pam_theocratic_ruler_events.0008.a: "Mogę wykorzystać nadmiar kamienia z tych prymitywnych murów."
 pam_theocratic_ruler_events.0008.b: "Zburzcie mury i wznieście [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip|l]."
 pam_theocratic_ruler_events.0008.c: "Każde dzieło ludzkich rąk jest namacalną formą modlitwy."
 pam_theocratic_ruler_events.0008.c.flavor: "Masz dogmat „[GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]”"
 pam_theocratic_ruler_events.0008.d: "Mury mogą się przydać."
 pam_theocratic_ruler_events.0009.t: "Pasterska powinność"
 pam_theocratic_ruler_events.0009.desc: "Dotarły do mnie łzawe relacje członków mojej wspólnoty, z których wynika, że [heir.GetTitledFirstName] traci nad sobą panowanie podczas kazań i nie sposób sprostać [heir.Custom('PL_jego_jej')] rygorystycznym wymaganiom.\n\n[heir.GetTitledFirstName] wpada w szał, gdy próbuję z [heir.Custom('PL_nim_nia')] porozmawiać.\n\n– Ach, ci podli grzesznicy! Nie mogę znieść ich żałosnych prób odkupienia swoich win."
 pam_theocratic_ruler_events.0009.a: "– Pasterz zachowuje spokój. Powściągnij emocje."
 pam_theocratic_ruler_events.0009.a.success: "Udaje ci się do [heir.Custom('PL_niego_niej')] dotrzeć"
 pam_theocratic_ruler_events.0009.a.failure: "Twoje słowa [heir.Custom('PL_go_jej')] nie uspokajają"
 pam_theocratic_ruler_events.0009.a.toast.success: "Udana porada"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Nieudana porada"
 pam_theocratic_ruler_events.0009.b: "Kręcę lekko głową w rozczarowaniu."
 pam_theocratic_ruler_events.0009.b.flavor: "Nie ma mojego błogosławieństwa i nie nadaje się do sprawowania władzy"
 pam_theocratic_ruler_events.0009.c: "– Odmów modlitwę. Opanuj swoje ciało."
 pam_theocratic_ruler_events.0010.t: "Miecz albo pastorał"
 pam_theocratic_ruler_events.0010.desc: "Władając swoją ziemią, muszę wypełniać wolę [ROOT.Char.GetFaith.HighGodNamePossessive] zarówno mieczem, jak i błogosławieństwem.\n\nZ niezwykłą wyrazistością pamiętam, gdy [pilgrimage_memory.GetDescription], a także kiedy [battle_memory.GetDescription]. Trupy piętrzyły się na polu; moi zwolennicy wiedzą, że nie cofam się żadnym zadaniem.\n\nZ myślą o przyszłości mojego państwa zarówno [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName], jak i [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName] oczekują, że to właśnie ich narzędziu nadam priorytet w naszych działaniach."
 pam_theocratic_ruler_events.0010.a: "Oddaj cześć mieczu."
 pam_theocratic_ruler_events.0010.b: "Niech poprowadzi nas pastorał."
 pam_theocratic_ruler_events.0010.c: "Miecz i pastorał będą służyć mi równolegle."
 pam_theocratic_ruler_events.0011.t: "Odpoczynek dla poległego rycerza"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName] klęka przede mną i opowiada mi o krewniaku, który poległ, walcząc w imię [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n– Mężnie stawiał czoła wielu poganom, lecz odniósł zbyt głębokie rany. Przynajmniej mogliśmy się pożegnać.\n\n– Proszę o zapewnienie mu spoczynku pod ołtarzem, z mieczem u boku. Będziesz mieć za to mą dozgonną wdzięczność."
 pam_theocratic_ruler_events.0011.a: "Zapłać za kamień, a spocznie w tym miejscu."
 pam_theocratic_ruler_events.0011.a.flavor: "Rycerz spocznie w kościele."
 pam_theocratic_ruler_events.0011.b: "Możemy wykorzystać kryptę, o ile przekażesz mi ten miecz."
 pam_theocratic_ruler_events.0011.b.flavor: "Rycerz spocznie bez swojego miecza."
 pam_theocratic_ruler_events.0011.c: "Miejsce wojowników jest pod gołym niebem."
 pam_theocratic_ruler_events.0011.c.flavor: "Rycerz zostaje pochowany poza murami kościoła."
 pam_fallen_knight_crusader_sword_name: "Miecz krzyżowca"
 pam_fallen_knight_crusader_sword_desc: "Miecz, który nosił rycerz poległy w obronie wiary. Jest pokryty nacięciami pogańskich ostrzy, a na rękojeści wyryto mały krzyż."
 pam_theocratic_ruler_events.0012.t: "Zapomniany święty gaj"
 pam_theocratic_ruler_events.0012.desc: "Moja świta zwalnia w miejscu, gdzie las otacza ścieżkę. [grove_subject.GetTitledFirstName], współwyznawca z miejsca znanego jako [grove_county.GetNameNoTier], wychodzi z lasu z rękami wyciągniętymi w geście powitania.\n\n– Jeśli naprawdę pragniesz zdobyć serca wiernych tych ziem, musisz wsłuchać się w to, co tu zasiano w imię [ROOT.Char.GetFaith.HighGodNamePossessive]. Wybuduj świątynię obok starożytnych gajów miejsca o nazwie [grove_province.GetName], a ludzie zrozumieją, czyim jesteś pasterzem."
 pam_theocratic_ruler_events.0012.a: "Niech natura pokieruje naszą wiarą."
 pam_theocratic_ruler_events.0012.b: "Oprowadź mnie po tych lasach."
 pam_theocratic_ruler_events.0012.b.success: "Twoi ludzie wracają w późniejszym czasie, aby zebrać drewno"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNotMeNoTooltip] dostrzega twój podstęp"
 pam_theocratic_ruler_events.0012.b.toast.success: "Stare drzewa zostają wycięte dla zysku."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNotMeNoTooltip] rozpowszechnia wieści o twoim świętokradztwie."
 pam_theocratic_ruler_events.0012.c: "W tej dziczy cuchnie diabłem."
 pam_theocratic_ruler_events.0013.t: "Anielska inspiracja"
 pam_theocratic_ruler_events.0013.desc: "Podczas dzisiejszej mszy, jakby pod wpływem boskiej inspiracji, ponad głosem kantora rozległ się śpiew – czysty i nieziemski w swoim pięknie.\n\nWierni milkną, gdy [angelic_singer.GetTitledFirstName] kontynuuje popis wokalny, a mój trans trwa długo po wybrzmieniu ostatniej nuty."
 pam_theocratic_ruler_events.0013.a: "– Twój dar należy do [ROOT.Char.GetFaith.HighGodNamePossessive]. Złóż ślubowanie i pełnij swoją posługę."
 pam_theocratic_ruler_events.0013.a.success: "Twoje słowa budzą w [angelic_singer.Custom('PL_nim_niej')] oddanie"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNotMeNoTooltip] nie da się przekonać"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNotMeNoTooltip] składa ślubowanie i dołącza do twojego dworu."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNotMeNoTooltip] odmawia i odchodzi"
 pam_theocratic_ruler_events.0013.b: "Zostań moim gościem. Chętnie ponownie usłyszę ten głos."
 pam_theocratic_ruler_events.0013.c: "Niech nasi kantorzy zajmą się śpiewaniem."
 pam_theocratic_ruler_events.0014.t: "Błaganie osoby nawróconej"
 pam_theocratic_ruler_events.0014.desc: "[convert_peasant.GetTitledFirstName], osoba, w której żyłach płynie [convert_peasant.GetCulture.GetNameNoTooltip|l] krew, nawrócona ze starych zwyczajów praktykowanych przez [neighbour_faith.GetNameNoTooltip|l], przepycha się przez tłum podczas mojego kazania.\n\n– Z dawnych zwyczajów wciąż można się wiele nauczyć. Wiem, że gdybyście zechcieli wziąć je pod uwagę, nasz lud zrozumiałby, że szanujecie nasze tradycje. Moi ludzie przystaną do was i będą wspierać każde wasze przedsięwzięcie.\n\nCzeka na moje błogosławieństwo i skinienie głową w odpowiedzi."
 pam_theocratic_ruler_events.0014.a: "Zabierzcie mi z oczu tę zakałę."
 pam_theocratic_ruler_events.0014.a.flavor: "Masz [Concept('trait', 'cechę')|E] [GetTrait('arrogant').GetName( GetNullCharacter )|l]"
 pam_theocratic_ruler_events.0014.a.acceptance: "Odrzucono błaganie osoby nawróconej"
 pam_theocratic_ruler_events.0014.b: "Przyjmij dogmat „[offered_tenet_a.GetBaseNameNoTooltip]” za swój własny."
 pam_theocratic_ruler_events.0014.b.tt: "Twój kolejny wkład we „#V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#!” w ramach [Concept('great_project', 'wspaniałego projektu')|E] „[GetGreatProjectType('pam_mass_rite_conversion').GetName|V]” jest darmowy."
 pam_theocratic_ruler_events.0014.c: "Przyjmij dogmat „[offered_tenet_b.GetBaseNameNoTooltip]” za swój własny."
 pam_theocratic_ruler_events.0014.c.tt: "Twój kolejny wkład we „#V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#!” w ramach [Concept('great_project', 'wspaniałego projektu')|E] „[GetGreatProjectType('pam_mass_rite_conversion').GetName|V]” jest darmowy."
 pam_theocratic_ruler_events.0014.d: "Czy to owca prowadzi pasterza?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "Błaganie osoby nawróconej"
 pam_theocratic_ruler_events.0015.t: "Porady dla następców"
 pam_theocratic_ruler_events.0015.desc: "Gdy mnie zabraknie, owce będą potrzebowały pasterza, który potrafi przewodzić zarówno w modlitwie, jak i w podejmowaniu decyzji. Wzywam osobę znaną jako [succession_heir_first.GetTitledFirstName], pierwszą w linii sukcesji, a także osobę, którą jest [succession_heir_second.GetTitledFirstName], o stawienie się przede mną i wyrecytowanie fragmentów Pisma Świętego.\n\nJedno z nich przejmie mój ciężar, a nie jestem w stanie każdemu poświęcić dziś tyle samo uwagi.\n\n– Moje dzieci w wierze. Pokażcie mi nie tylko to, co udało wam się zapamiętać, ale i to, co macie już w sercu."
 pam_theocratic_ruler_events.0015.a: "Naucz osobę znaną jako [succession_heir_first.GetFirstNameNoTooltip] Pisma Świętego."
 pam_theocratic_ruler_events.0015.b: "Wprowadź osobę znaną jako [succession_heir_second.GetFirstNameNoTooltip] w treść świętych tekstów."
 pam_theocratic_ruler_events.0015.c: "Wciąż jestem pasterzem. Ja zajmę się recytacją."
 pam_theocratic_ruler_events.0015.c.success: "Twoja wiedza przyćmiewa ich recytację"
 pam_theocratic_ruler_events.0015.c.failure: "Masz problemy z fragmentem, który te osoby znają na pamięć"
 pam_theocratic_ruler_events.0015.c.toast.success: "Są pod wrażeniem twojej znajomości doktryny."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Twoi podwładni wymieniają spojrzenia, zauważywszy twój błąd."
