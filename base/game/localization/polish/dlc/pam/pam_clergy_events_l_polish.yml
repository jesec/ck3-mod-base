l_polish:
 pam_clergy_events.0001.t: "Quo nomine vis vocari?"
 pam_clergy_events.0001.desc: "[chaplain.GetCouncilTitle] [chaplain.GetFirstName] przechodzi do kolejnego pustego wiersza w rejestrze następców świętego Piotra – żywego świadectwa, że [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )|l] rzeczywiście ma miejsce.\n\n#emp – Imię, które wybierzesz, będzie pamiętane na długo po tym, jak ciebie już nie będzie.#!\n\n[chaplain.GetHerHis|U] pióro zaznacza miejsce, gdzie należy je zapisać.\n\n#emp – Quo nomine vis vocari?#!"
 pam_clergy_events.0001.a: "Niech wszyscy zapamiętają je po wsze czasy."
 pam_clergy_events.0003.t: "Zmiana dogmatu"
 pam_clergy_events.0003.desc: "Dogmat fundamentalny obrządku o nazwie [pam_recast_rite.GetNameNoTooltip|l] uległ zmianie pod panowaniem osoby znanej jako [pam_recast_pope.GetTitledFirstName]: dogmat „[tenet_to_remove.GetBaseName]” zostaje zamieniony na „[tenet_to_add.GetBaseName]”."
 pam_clergy_events.0010.t: "Co radzisz, [ROOT.Char.Custom2('RelationToMeShortVocative', SCOPE.sC('actor'))]?"
 pam_clergy_events.0010.desc.intro: "Jako [cardinalate.GetHolder.GetTitleAsNameNoTooltip] jestem narzędziem świętej woli [actor.Custom('GetMotherFatherPossessive')|U].\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U], osoba, którą cenię ponad wszystko, prowadzi mnie, gdy pełnię swoje obowiązki jako [cardinalate.GetHolder.GetTitleAsNameNoTooltip].\n\n"
 pam_clergy_events.0010.desc: "W swej nieskończonej mądrości [actor.GetTitledFirstName] uznaje za konieczne, aby moja osoba podjęła się"
 pam_clergy_events.0010.desc.develop: "pracy nad rozwojem dzieł publicznych, z których skorzystają wszyscy [recipient.GetFaith.GetAdherentNamePlural] w miejscu znanym jako [archdiocese.GetName]."
 pam_clergy_events.0010.desc.convert_faith: "misji mającej na celu wspieranie nawrócenia, któremu poddawani są [ROOT.Char.Custom('GetUnbelieverNamePlural')] w miejscu znanym jako [archdiocese.GetName] i w jego okolicach."
 pam_clergy_events.0010.desc.increase_control: "misji uspokojenia ludności w miejscu znanym jako [archdiocese.GetName]."
 pam_clergy_events.0010.desc.cultural_fascination: "misji przyspieszenia badań nad nowymi technologiami, z których skorzysta [actor.GetHerHis] społeczność [actor.GetCulture.GetName|l]."
 pam_clergy_events.0010.desc.epidemic_resistance: "działań mających na celu mobilizację zasobów kościelnych w celu wsparcia walki z zarazą w miejscu znanym jako [archdiocese.GetName]."
 pam_clergy_events.0010.desc.improve_legitimacy: "misji umocnienia legitymacji monarchów, których wyznawaną wiarą jest [recipient.GetFaith.GetName|l], w miejscu znanym jako [archdiocese.GetName]."
 pam_clergy_events.0010.desc.undermine_legitimacy: "misji podważenia legitymacji monarchów, których wyznawaną wiarą jest [recipient.GetFaith.GetName|l], w miejscu znanym jako [archdiocese.GetName]."
 pam_clergy_events.0010.a: "– Zrobię tak, jak [actor.Custom('FormOfAddressForLiege')] sobie życzy!"
 pam_clergy_events.0010.b: "Dziesięciny można spożytkować lepiej…"
 pam_clergy_events.0030.t: "Habemus papam"
 pam_clergy_events.0030.t.female: "Habemus mamam"
 pam_clergy_events.0030.desc: "Biały dym pojawiający się w centrum miejsca o nazwie [new_pope.GetCurrentLocation.GetName] obwieszcza, że nową głową Kościoła zostaje [new_pope.GetTitledFirstName].\n\n– Niechaj Święci Apostołowie Piotr i Paweł, w których moc i autorytet wierzymy, wstawiają się za nami u Pana. A błogosławieństwo Boga Wszechmogącego, Ojca i Syna, i Ducha Świętego niech zstąpi na was i pozostanie z wami na zawsze.\n\n– Amen."
 pam_clergy_events.0030.a: "Niech będzie chwała tronowi Świętego Piotra."
 pam_clergy_events.0030.b: "Wygląda na to, że pojawił się fałszywy prorok."
 pam_clergy_events.0030.b.tt: "[decision|E] „[GetDecisionWithKey('declare_antipope_decision').GetName]” jest tańsza przez #V 15 lat#!"
 pam_clergy_events.0030.aa: "Kogo obchodzą sprawy Kościoła?"
 pam_clergy_events.0030.aa.tt: "Kolejne wydarzenia „Habemus papam” będą odtąd pojawiać się w formie komunikatów"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName] zostaje nową [Concept('head_of_faith', 'głową wiary')|E]."
 pam_clergy_events.0040.opening: "Wasza Pobożność!"
 pam_clergy_events.0040.desc: "W związku z uszczupleniem kolegium mianuję Cię kardynałem. Niech Twoja gorliwość i mądrość wzmocnią Kościół w tej chwili próby."
 pam_clergy_events.0040.appoint_tt: "Mianowano cię [Concept('cardinal', 'kardynałem')|E]"
 pam_clergy_events.0040.a: "Przyjmuję to święte brzemię."
 pam_clergy_events.0041.opening: "Stolica Piotra Apostoła"
 pam_clergy_events.0041.desc: "Kolegium Kardynalskie nie jest w pełnym składzie i nie obsadzono stanowisk, które pozostawili najpobożniejsi z nas.\n\nNie pozostawię Kościoła bez ochrony! Przyjmuję czerwony kapelusz."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUINameNotMe] ogłasza się [Concept('cardinal', 'kardynałem')|E]"
 pam_clergy_events.0041.a: "Ta bezczelność nie zostanie zapomniana."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "Miejsca w Kolegium pozostawały nieobsadzone, a Kościół nie może czekać na ceremonialne procedury. Kilku naszych najpobożniejszych wspólnie przyjęło czerwony kapelusz i Kolegium znów jest w komplecie.\n\nUfamy, że wybaczycie nasz pośpiech."
 pam_clergy_events.0042.a: "Pełne Kolegium posłuży mi lepiej niż puste."
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "Wstrząs sejsmiczny w wierze"
 pam_clergy_events.0051.desc: "Moja pozycja w miejscu znanym jako [county.GetNameNoTier] chwieje się w posadach. Dusze, którym dane mi było poświęcić życie w posłudze, modlą się teraz jako [new_faith.GetAdherentNamePlural].\n\nMam zmienić wiarę, by zachować kontrolę? Wciąż mogę trzymać pieczę nad ludem z miejsca znanego jako [title.GetName], ale czy potrafię jeszcze realnie pomóc innowiercom, skoro to już nie [old_faith.GetAdherentNamePlural]? Czy jakiekolwiek dobro może wyniknąć z tego, że wiara [new_faith.GetAdjectiveNoTooltip|l] zostanie nam wszystkim narzucona?"
 pam_clergy_events.0051.a: "Zrobię wszystko, by służyć mojej trzódce."
 pam_clergy_events.0051.a.keep_see_tt: "Utrzymujesz kontrolę nad miejscem znanym jako [title.GetName]"
 pam_clergy_events.0051.b: "Tylko moi bracia w wierze, [old_faith.GetAdherentNamePluralNoTooltip], mogą liczyć na moją posługę."
 pam_clergy_events.0051.b.tt: "Wszystkie twoje [titles|El] [landed|El] zostają zniszczone"
 pam_clergy_events.0051.c: "Akceptuję koniec swojego urzędowania."
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Założysz [camp|El] [Concept('adventurer', 'poszukiwacza przygód')|E]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER [Concept('game_over', 'Kończysz grę')|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "Koniec miejsca o nazwie [title.GetNameNoTooltip]"
 pam_clergy_events.0052.desc: "Jakkolwiek do tego doszło, nie mam już prawa być duszpasterzem miejsca o nazwie [title.GetDefinitiveName]. To, co Kościół niegdyś złożył w moje ręce, teraz oddaję."
 pam_clergy_events.0052.a: "Niech tak będzie."
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "Dynastia [new_prelate.GetDynasty.GetNameNoTooltip] na tronie świętego Piotra."
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetFaith.ReligiousHeadName] z dynastii [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.antipope: "Dynastia [new_prelate.GetDynasty.GetNameNoTooltip] zgłasza roszczenie do tytułu o nazwie [new_prelate.GetFaith.ReligiousHeadTitleName|l]"
 pam_clergy_events.0060.t.archbishop: "Dynastia [new_prelate.GetDynasty.GetNameNoTooltip] sięga po pastorał"
 pam_clergy_events.0060.desc.intro: "Pragnęliśmy przewodzić chrześcijaństwu, czy to z tronu, czy z ambony. Teraz wolą [new_prelate.GetFaith.HighGodNamePossessive] jest wynieść na szczyt chwały dynastię [new_prelate.GetDynasty.GetName].\n\n"
 pam_clergy_events.0060.desc.pope: "[new_prelate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))], dostępuje wyniesienia na tron Świętego Piotra, wikariusza [new_prelate.GetFaith.HighGodNamePossessive] na ziemi."
 pam_clergy_events.0060.desc.head_of_faith: "[new_prelate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))], posiada obszar o nazwie [prelate_title.GetDefinitiveName]."
 pam_clergy_events.0060.desc.hof_outro: "Królowie i cesarze to tylko dzieci w cieniu świętości ich [new_prelate.Custom('GetMotherFatherPossessive')|U]. Niezliczeni [new_prelate.GetFaith.BishopMalePlural|l] są teraz na rozkazach dynastii [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope: "[new_prelate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))], otrzymuje miano nowej głowy wiary, mimo że poprzedni [new_prelate.GetFaith.ReligiousHeadName|l] wciąż jest u władzy. Każdy [new_prelate.GetFaith.GetAdherentName] musi teraz zadecydować, kto jest namiestnikiem woli [new_prelate.GetFaith.HighGodNamePossessive]. Dopóki to się nie rozstrzygnie, wszystkie nasze dusze są w niebezpieczeństwie."
 pam_clergy_events.0060.desc.archbishop: "[new_prelate.GetFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))], otrzymuje w darze obszar znany jako [prelate_title.GetDefinitiveName]. Dziesięciny, opactwa i konsekracja, jakiej dostępuje każdy podległy jej [new_prelate.GetFaith.BishopNeuter], są teraz w rękach dynastii [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.GetHerHis|U] wiara to [new_prelate.GetFaith.GetNameNoTooltip|l], nie [ROOT.Char.GetFaith.GetNameNoTooltip|l], ale to nie zmienia faktu, że wciąż jesteśmy rodziną."
 pam_clergy_events.0060.a: "To błogosławieństwo dla Kościoła i dla dynastii [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.a.antipope: "Nie mnie dziedziczyć ten spór."
 pam_clergy_events.0060.b: "Muszę przyjrzeć się bliżej miejscu znanemu jako [prelate_title.GetDefinitiveNameNoTooltip]."
 pam_clergy_events.0060.b.antipope: "Tylko ja mogę rozwiązać ten kryzys."
 pam_clergy_events.0060.b.tt: "@warning_icon! Porzucisz swoją obecną postać i nie będziesz już móc nią grać w przyszłości.\n\n#TUT Gdy [new_prelate.GetShortUINameNotMeNoTooltip] zginie, będziesz grać jako swój własny [player_heir|El], który odziedziczy ten urząd [ecclesiastical|El] w drodze [Concept('appointment', 'mianowania')|E] lub elekcji, nie w drodze sukcesji [Concept('dynasty', 'dynastycznej')|E].#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName] nie wyznaje tej samej wiary co ty. Dalej mówisz o sobie „[new_prelate.GetFaith.GetAdherentName]”."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName] sprawuje ten urząd na przekór wszystkiemu, a nie z woli wyborców. Każdy, kto kwestionuje jego roszczenie, prędzej czy później przyjdzie po władzę."
