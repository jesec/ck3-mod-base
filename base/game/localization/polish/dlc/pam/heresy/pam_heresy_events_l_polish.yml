l_polish:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "Kataryzm"
 cathar_rite_adj: "Katarska"
 cathar_rite_adherent: "katar"
 cathar_rite_adherent_plural: "katarzy"
 cathar_rite_desc: "Surowy obrządek dualistyczny, którego wyznawcy uważają, że dobra materialne to dzieło złego demiurga. Doskonali należący do tego ruchu składają śluby ubóstwa i czystości, odrzucają sakramenty oficjalnego Kościoła i odmawiają służby wojskowej w imię Boga."
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "Waldyzm"
 waldensian_rite_adj: "Waldeńska"
 waldensian_rite_adherent: "waldens"
 waldensian_rite_adherent_plural: "waldensi"
 waldensian_rite_desc: "Obrządek praktykowany przez bosych, żebrzących kaznodziejów, którzy twierdzą, że osoby świeckie mogą głosić Słowo Boże, Kościół instytucjonalny nie ma wyłącznego prawa do łaski i że chrześcijanie nie powinni posiadać majątku ani chwytać za broń."
 lollard_rite: "$lollard$"
 lollard_rite_name: "Lollardyzm"
 lollard_rite_adj: "Lollardzka"
 lollard_rite_adherent: "lollard"
 lollard_rite_adherent_plural: "lollardzi"
 lollard_rite_desc: "Reformatorski obrządek głoszony w językach narodowych, który odrzuca wyszukane rytuały, transsubstancjację, kult relikwii i bogactwo duchowieństwa. Biblia jest czytana w języku narodowym, a każdy wierzący uznawany jest za pełnoprawnego kapłana."
 hussite_rite: "$hussite$"
 hussite_rite_name: "Husytyzm"
 hussite_rite_adj: "Husycka"
 hussite_rite_adherent: "husyta"
 hussite_rite_adherent_plural: "husyci"
 hussite_rite_desc: "Czeski obrządek reformacyjny, który domaga się udostępnienia kielicha mszalnego osobom świeckim, odczytywania Pisma Świętego w języku narodowym oraz położenia kresu bogactwu duchowieństwa i sprzedaży odpustów. Jego kazania w znacznym stopniu opierają się na argumentach wiklefickich oraz na głębokim przekonaniu, że Rzym zboczył z drogi apostolskiej."
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "Joachimizm"
 joachimite_rite_adj: "Joachimistyczna"
 joachimite_rite_adherent: "joachimita"
 joachimite_rite_adherent_plural: "joachimici"
 joachimite_rite_desc: "Apokaliptyczny obrządek, który odczytuje historię jako podzieloną na trzy okresy: epoki Ojca i Syna oraz nadchodzącą erę Ducha Świętego, która doprowadzi do rozpadu Kościoła instytucjonalnego i powstania nowego zakonu kontemplacyjnego. Wyznawcy joachimizmu wędrują po świecie, żyjąc w apostolskim ubóstwie, głoszą kazania na targowiskach i z błyskiem w oku spoglądają ku zbliżającemu się końcowi świata."
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "Ikonoklazm"
 iconoclast_rite_adj: "Ikonoklastyczna"
 iconoclast_rite_adherent: "ikonolasta"
 iconoclast_rite_adherent_plural: "ikonoklaści"
 iconoclast_rite_desc: "Odrodzona forma dawnego wschodniego ruchu anikonistycznego potępiającego czczenie obrazów jako przejaw cichego bałwochwalstwa i domagającego się usunięcia wizerunków zarówno z kościołów, jak i z domów."
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "Bogomilizm"
 bogomilist_rite_adj: "Bogomilska"
 bogomilist_rite_adherent: "bogomił"
 bogomilist_rite_adherent_plural: "bogomiłowie"
 bogomilist_rite_desc: "Słowiański obrządek dualistyczny, którego korzenie sięgają kapłana Bogomiła. Kaznodzieje tej grupy podróżują boso, odrzucają hierarchię, odmawiają noszenia broni i nauczają, że Szatan jest stwórcą świata widzialnego."
 paulician_rite: "$paulician$"
 paulician_rite_name: "Paulicjanizm"
 paulician_rite_adj: "Paulicjańska"
 paulician_rite_adherent: "paulicjanin"
 paulician_rite_adherent_plural: "paulicjanie"
 paulician_rite_desc: "Pochodzący z Azji Mniejszej wojowniczy obrządek dualistyczny gardzący ikonami i ustaloną hierarchią, ceniący dosłowną interpretację listów Pawła. Paulicjanie są gotowi chwycić za broń w obronie czystości wiary."
 messalian_rite: "$messalian$"
 messalian_rite_name: "Mesalianizm"
 messalian_rite_adj: "Mesaliańska"
 messalian_rite_adherent: "mesalianin"
 messalian_rite_adherent_plural: "mesalianie"
 messalian_rite_desc: "Ezoteryczny i ascetyczny obrządek, zgodnie z którym nieustanna modlitwa jest jedynym istotnym sakramentem, a wierzącego po wygnaniu zamieszkującego w duszy demona nie zbezcześci już żaden cielesny czyn."
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "Adopcjanizm"
 adoptionist_rite_adj: "Adopcjańska"
 adoptionist_rite_adherent: "adopcjanista"
 adoptionist_rite_adherent_plural: "adopcjaniści"
 adoptionist_rite_desc: "Obrządek chrystologiczny z Hiszpanii, zgodnie z którym Chrystus w swojej ludzkiej naturze jest Synem Bożym przybranym, a nie prawdziwym – doktryna ta była postrzegana przez Kościół karoliński jako ukryty nestorianizm."
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "Wierni sprzeciwili się rosnącej [Concept('rite_divergence', 'dywergencji')|E]"
 pam_heresy_fervor_reset_component_2_desc: "Wierni sprzeciwili się nowemu schizmatyckiemu [Concept('rite', 'obrządkowi')|E]"
 pam_heresy_fervor_reset_component_3_desc: "Wierni sprzeciwili się odrodzeniu herezji"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "Heretycka dywergencja"
 heresy_light.0010.desc.intro.descriptor_archbishop: "Arcybiskup [founder.GetFirstName], w którego żyłach płynie [founder.GetCulture.GetName|l] krew, "
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName], "
 heresy_light.0010.desc.opener.archbishopric: "osoba sprawująca pieczę duchową nad terenem o nazwie [founder_clerical_title.GetNameNoTier], "
 heresy_light.0010.desc.opener.lands: "osoba z ziem znanych jako [founder.GetPrimaryTitle.GetBaseNameNoTier], "
 heresy_light.0010.desc.body.uneasy: "oddaliła obrządek o nazwie [new_rite.GetName|l] jeszcze dalej od doktryny, którą cechuje się wiara [source_rite.GetAdjective|l], "
 heresy_light.0010.desc.body.alarming: "oddaliła obrządek o nazwie [new_rite.GetName|l] niebezpiecznie daleko od przyjętych praktyk, którymi cechuje się wiara [source_rite.GetAdjective|l], "
 heresy_light.0010.desc.body.dangerous: "zmieniła obrządek o nazwie [new_rite.GetName|l], w coś, co wiara [source_rite.GetAdjective|l] ledwo może uznać za coś pokrewnego, "
 heresy_light.0010.desc.differing.tenet: "przy czym najbardziej istotną zmianą jest dogmat „[differing_tenet.GetBaseName]”."
 heresy_light.0010.desc.differing.doctrine: "przy czym najbardziej istotną zmianą jest doktryna „[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]”."
 heresy_light.0010.desc.differing.fallback: "przy czym nowe akcenty są zbyt subtelne, by można je było przyporządkować jednej nazwie."
 heresy_light.0010.desc.outro: "\n\nTo jeszcze nie są heretycy. Granica odstępstwa nie jest już jednak odległa."
 heresy_light.0010.desc.outro.own_rite: "\n\nNie jesteśmy jeszcze heretykami. Granica odstępstwa nie jest już jednak odległa."
 heresy_light.0010.a: "Będę się modlić o przewodnictwo."
 heresy_light.0010.b: "W obrządku, którym jest [new_rite.GetNameNoTooltip|l], kryje się mądrość. Będę kroczyć tą ścieżką."
 heresy_light.0010.c: "Pachnie mi to herezją…"
 heresy_light.0010.c.own_rite: "No to ruszajmy. Ta droga należy do nas."
 heresy_light.notification.member.title: "Nasz obrządek dryfuje"
 heresy_light.notification.member.tt: "Pod wodzą osoby, którą jest [founder.GetTitledFirstName], obrządek o nazwie [new_rite.GetName|l] oddala się od doktryny, którą cechuje się wiara [source_rite.GetAdjective|l]."
 heresy_light.notification.hof.title: "Obrządek dryfuje w stronę herezji"
 heresy_light.notification.hof.tt: "Pod wodzą osoby, którą jest [founder.GetTitledFirstName], obrządek o nazwie [new_rite.GetName|l] zboczył z drogi, którą kroczy wiara [source_rite.GetAdjective|l]."
 heresy_light.notification.mainline.title: "Sąsiedni obrządek dryfuje"
 heresy_light.notification.mainline.tt: "Pod wodzą osoby, którą jest [founder.GetTitledFirstName], obrządek o nazwie [new_rite.GetName|l] oddala się od doktryny, którą cechuje się wiara [source_rite.GetAdjective|l]."
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "Heretycki obrządek"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "Arcybiskup [founder.GetFirstName], w którego żyłach płynie [founder.GetCulture.GetName|l] krew, "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName], "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "osoba sprawująca pieczę duchową nad terenem o nazwie [founder_clerical_title.GetNameNoTier], "
 heresy_dangerous_rite.0010.desc.opener.lands: "osoba z ziem znanych jako [founder.GetPrimaryTitle.GetBaseNameNoTier], "
 heresy_dangerous_rite.0010.desc.body.alarming: "zdecydowanie zerwała z ideałami, którymi cechuje się wiara [source_rite.GetAdjective|l], i stworzyła nowy obrządek o nazwie [new_rite.GetName], "
 heresy_dangerous_rite.0010.desc.body.severe: "zerwała z ideałami, którymi cechuje się wiara [source_rite.GetAdjective]. Ma z nią już jedynie pozorny związek i stworzyła nowy obrządek, którym jest [new_rite.GetName], "
 heresy_dangerous_rite.0010.desc.differing.tenet: "a najśmielszy z jego nowych edyktów, „[differing_tenet.GetBaseName]”, jest otwarcie głoszony."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "a najśmielszy z jego nowych edyktów, „[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]”, jest otwarcie głoszony."
 heresy_dangerous_rite.0010.desc.differing.fallback: "ale nowych edyktów jest zbyt wiele, by je tu wymienić."
 heresy_dangerous_rite.0010.desc.outro: "\n\nKaznodzieje już rozchodzą się po całym państwie – u każdego w dłoniach [origin_faith.ReligiousText] i pochodnia. Starszyzna trzymająca pieczę nad wiarą znaną jako [origin_faith.GetName|l] odnosi się do tego jednoznacznie nieprzychylnie.\n\nZałożenia potencjalnej herezji zostały zapisane atramentem i wykrzyczane z ambony. Miecz oraz ogień odpowiedzą tam, gdzie kazania nie wystarczą."
 heresy_dangerous_rite.0010.a: "Do dzieła!"
 heresy_dangerous_rite.0010.c: "Pachnie mi to herezją…"
 heresy_dangerous_rite.spread.title: "Nowy obrządek się rozprzestrzenia"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "Herezja Wycliffe’a"
 heresy_historical.0050.t.hussite.first: "Herezja Husa"
 heresy_historical.0050.t.joachimite.first: "Herezja Joachima"
 heresy_historical.0050.t.cathar.first: "Herezja katarska"
 heresy_historical.0050.t.waldensian.first: "Herezja Waldo"
 heresy_historical.0050.t.bogomilist.first: "Herezja Bogomiła"
 heresy_historical.0050.t.resurgence: "Herezja [heresy_faith.GetAdjectiveNoTooltip|l] powraca"
 heresy_historical.0050.t.fallback: "Herezja [heresy_faith.GetAdjectiveNoTooltip|l]"
 heresy_historical.0050.desc.nearby.first: "[founder.GetTitledFirstName] głosi doktryny, którymi cechuje się herezja [heresy_faith.GetAdjective|l], w miejscu znanym jako [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] – to na tyle blisko, że nie da się już zaprzeczyć plotkom. Nasi [origin_faith.PriestMalePlural|l] potępiają odstępcę z ambony, ale coś sprawia, że przez to nowa nauka tylko się rozprzestrzenia.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "Wiara [heresy_faith.GetAdjective|l] na nowo powróciła do miejsca znanego jako [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], pod przewodnictwem osoby, którą jest [founder.GetTitledFirstName]. To stary płomień, który tak był od nas daleki. Zarówno dworzanie, jak i zwykli ludzie pamiętają, dlaczego za pierwszym razem był tak niebezpieczny.\n\n"
 heresy_historical.0050.desc.distant.first: "[epicenter_ruler.GetCapitalLocation.GetTitle.GetName] – z tego odległego miejsca napływają wieści o postaci znanej jako [founder.GetTitledFirstName], która wznieciła płomień wiary znanej jako [heresy_faith.GetName|l]. Pielgrzymi i kupcy głoszą [founder.Custom('PL_jego_jej')] kazania na traktach, a jedynym pytaniem pozostaje, kiedy ta pogłoska dotrze do nas.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "[epicenter_ruler.GetCapitalLocation.GetTitle.GetName] – z tego odległego miejsca napływają wieści, których obawiał się każdy prałat: wiara [heresy_faith.GetAdjective|l] została na nowo rozniecona dłonią osoby znanej jako [founder.GetTitledFirstName], jakby nie stłumiły jej nigdy żaden ogień, dekret ani rada.\n\n"
 heresy_historical.0050.desc.insider.first: "[founder.GetTitledFirstName] wprowadza wiarę o nazwie [heresy_faith.GetName|l] do przestrzeni publicznej w miejscu znanym jako [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Słyszane od lat szepty w końcu stały się kazaniem, które usłyszy cały świat.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName] przywraca wiarę o nazwie [heresy_faith.GetName|l] w miejscu znanym jako [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], rozniecając tym samym stary płomień. Nasz ruch nie został zapomniany.\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.GetTitledFirstName] głosi konieczność czytania Pisma Świętego w języku narodowym, zakaz możliwości posiadania ziemi przez kapłanów oraz zakaz traktowania ołtarza jak scenę teatralną."
 heresy_historical.0050.gloss.hussite: "[founder.GetTitledFirstName] głosi komunię pod dwiema postaciami dla osób świeckich, Pismo Święte po czesku oraz pozbawienie Kościoła nabytych godności."
 heresy_historical.0050.gloss.joachimite: "[founder.GetTitledFirstName] głosi rychłe nadejście wieku Ducha Świętego, w którym nakazy wydawane przez kapłanów z Rzymu ustępują kościołowi kontemplacyjnemu ubogich."
 heresy_historical.0050.gloss.cathar: "[founder.GetTitledFirstName] głosi ostry dualizm, twierdząc, że świat jest dziełem złego boga, a Kościół rzymski Nierządnicą z Babilonu."
 heresy_historical.0050.gloss.waldensian: "[founder.GetTitledFirstName] głosi konieczność stworzenia ubogiego kościoła złożonego z bosych, świeckich kaznodziejów – bez przysiąg, wojny ani kapłańskiego monopolu na słowo Boże."
 heresy_historical.0050.gloss.bogomilist: "[founder.GetTitledFirstName] głosi słowiański dualizm: świat należy do Szatana, a jedynie poprzez nieustanną modlitwę można odzyskać swą duszę."
 heresy_historical.0050.gloss.paulician: "[founder.GetTitledFirstName] głosi stary, wschodni ogień – dualizm, ikonoklazm i dogmatyczne czytanie listów Pawła. [founder.Custom('PL_jego_jej')|U] zwolennicy wolą miecz od stosu."
 heresy_historical.0050.gloss.iconoclast: "[founder.GetTitledFirstName] głosi odrodzenie misji ikonoklastów: każdy obraz Chrystusa i pozłacany święty to bożek, a drugi sobór nicejski to błąd, za który nigdy nie odpokutowano."
 heresy_historical.0050.gloss.adoptionist: "[founder.GetTitledFirstName] głosi na nowo stary hiszpański argument – Chrystus był przybranym, a nie prawdziwym synem Boga i miał naturę ludzką."
 heresy_historical.0050.gloss.messalian: "[founder.GetTitledFirstName] głosi wyższość bezustannej modlitwy nad wszelkimi sakramentami oraz obecność drzemiącego w każdym demona, którego żaden kapłan nie może wypędzić."
 heresy_historical.0050.gloss.generic: "[founder.GetTitledFirstName] głosi doktrynę gruntownych reform, której źródłem jest tradycja [heresy_faith.GetAdjective|l], tylko w ostrzejszej formie."
 heresy_historical.0050.history.lollard: "\n\nZaczęło się w Oksfordzie od magistrów zadających proste pytania o prawo kanoniczne – a teraz ruch rozlewa się z klasztorów do miast z pomocą Pisma Świętego w języku angielskim, szybciej, niż kapłani są w stanie je konfiskować."
 heresy_historical.0050.history.hussite: "\n\nPłomień został rozniecony w Kaplicy Betlejemskiej w Pradze – kazania po czesku, komunia w postaci wina dla ludności świeckiej oraz brak ingerencji ze strony korony. Ale z kurią będzie wręcz przeciwnie."
 heresy_historical.0050.history.joachimite: "\n\nZaczęło się w klasztorze w Kalabrii, gdzie opat potraktował Apokalipsę św. Jana jako kalendarz i obliczył, za ile lat nastąpi nowa era. Duchowi franciszkanie zaczęli odliczać czas, a świeccy kaznodzieje głoszą o tym teraz na każdym rynku."
 heresy_historical.0050.history.cathar: "\n\nRuch ten przyszedł z Bałkanów, zakorzenił się w Langwedocji, a teraz wyznają go zarówno tkacze, jak i wicehrabiowie. Doskonali chodzą boso i odmawiają składania przysiąg, a szeregi ich wyznawców rosną z miesiąca na miesiąc."
 heresy_historical.0050.history.waldensian: "\n\nZaczęło się od kupca z Lyonu, który rozdał swoje bogactwa biednym i wygłaszał kazania na ulicach. Synod go uciszył, więc kaznodzieje osiedlili się w alpejskich dolinach, udając się tam boso i parami."
 heresy_historical.0050.history.bogomilist: "\n\nWszystko zaczęło się za czasów cara Piotra I, gdy wiejscy kapłani nauczali, że chleb i wino są tylko tym i niczym więcej. Zostali obłożeni anatemą przez patriarchów, lecz doktryna zagnieździła się w słowiańskich wsiach i nigdy jej do końca nie wypleniono."
 heresy_historical.0050.history.paulician: "\n\nTen płomień jest starszy niż jakakolwiek katedra w cieśninie Bosfor i polegał na bezkrytycznym podejściu do listów Pawła. Został wzniecony na ormiańskich wyżynach, zagnieździł się w Tefrike i stamtąd zagroził niegdyś imperium."
 heresy_historical.0050.history.iconoclast: "\n\nDwukrotnie imperium opróżniło swe świątynie z malowanych wizerunków Chrystusa i pozłacanych podobizn świętych; dwukrotnie ikony powróciły i dwukrotnie sam spór został raczej zamieciony pod dywan, niż rozstrzygnięty. Teraz zaś dawna waśń znów powraca."
 heresy_historical.0050.history.adoptionist: "\n\nSpór ten ma swoje korzenie na Półwyspie Iberyjskim, w regionach przygranicznych, gdzie grono biskupów uznało, że syn cieśli został przysposobiony do rodziny boskiej, a nie się w niej narodził. Frankfurt i Akwizgran potępiły tę tezę; pogranicza jednak nie ustawały w poszukiwaniach odpowiedzi."
 heresy_historical.0050.history.messalian: "\n\nRuch ten narodził się na pustyniach Mezopotamii – byli to wędrowni mnisi, którzy modlili się bez snu i twierdzili, że każda dusza nosi w sobie demona, którego żaden kapłan nie zdoła wypędzić. Efez ich potępił; oni jednak kontynuowali swoją wędrówkę, nie zważając na to."
 heresy_historical.0050.history.generic: "\n\nKażda epoka rodzi własny taki ogień – klasztory, które złamały zasady, kaznodziejów, którzy opuścili katedrę i już do niej nie powrócili. Ten właśnie zapłonął."
 heresy_historical.0050.a: "Mają rację. Poprę ich."
 heresy_historical.0050.b: "Cóż za przekonanie… Szkoda, że to nie o mnie chodzi."
 heresy_historical.0050.c: "Heretycy…"
 heresy_historical.0050.c.insider: "Wytrwamy. Sprawa nabiera rozmachu."
 heresy_historical.spread.title: "Herezja się rozprzestrzenia"
