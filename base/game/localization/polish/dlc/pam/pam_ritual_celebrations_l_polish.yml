l_polish:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Odblokowuje [intent|El] „$praise_the_gods_intent$” dla [activities|El] typu [GetActivityType('activity_feast').GetName|l]"
 praise_the_gods_intent: "Szacunek wobec boskości"
 praise_the_gods_intent_desc: "Nadaj wspólnemu świętowaniu charakter nabożny, szukając przez całą ucztę wiedzy religijnej, duchowego poznania i poczucia wspólnoty."
 praise_the_gods_intent_not_valid_desc: "Nie wyznajesz już osobiście [Concept('tenet', 'dogmatu')|E] „[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )]”"
 pam_ritual_celebrations_events.0001.t: "Uczta objawienia"
 pam_ritual_celebrations_events.0001.desc: "Gdy półmiski pustoszeją, a kielichy co rusz napełniają się na nowo, jeden toast na cześć [ROOT.Char.GetFaith.WealthGodNamePossessive] rodzi kolejny. Wkrótce sala rozbrzmiewa modlitwami, opowieściami o wierze i żarliwą debatą teologiczną.\n\nW radosnej atmosferze poznanie zdaje się być na wyciągnięcie ręki – można je odnaleźć zarówno we wspólnocie, jak i w cichej modlitwie."
 pam_ritual_celebrations_events.0001.a: "Niech nasza radość przerodzi się w modlitwę."
 pam_ritual_celebrations_events.0001.b: "Wycofam się i w ciszy oddam modlitwie i refleksji."
 pam_praise_the_gods_revelation_outcome_tt: "Z gwaru świętowania wyłania się boska prawda."
 pam_praise_the_gods_belief_outcome_tt: "Na wpół zapomniana nauka otwiera nową ścieżkę wiary"
 pam_praise_the_gods_legend_outcome_tt: "Religijne opowieści padają tego wieczora jak ziarno, z którego wyrośnie legenda dla przyszłych pokoleń"
 pam_praise_the_gods_clergy_outcome_tt: "Wspólna modlitwa zbliża cię do członka [Concept('clergy', 'duchowieństwa')|E] przy twoim stole"
 pam_praise_the_gods_scholar_outcome_tt: "Wieczorna dysputa rozbudza w tobie nieprzemijające pragnienie świętej wiedzy"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Każda modlitwa i przypowieść pogłębia twoją znajomość świętej wiedzy"
 pam_praise_the_gods_revelation_toast: "Objawienie w atmosferze radości"
 pam_praise_the_gods_belief_toast: "Teologiczne rozważania"
 pam_praise_the_gods_legend_toast: "Zasiane ziarno opowieści"
 pam_praise_the_gods_clergy_toast: "Zjednoczenie w uwielbieniu [ROOT.Char.GetFaith.WealthGodNamePossessive]"
 pam_praise_the_gods_scholar_toast: "Mądrość odnaleziona przy uczcie"
 pam_praise_the_gods_scholar_xp_toast: "Pogłębiona wiedza"
 pam_praise_the_gods_clergy_bond_opinion: "Zjednoczenie w boskim świętowaniu"
 pam_praise_the_gods_log_title: "Uszanowano boskość"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUINameNotMe] – ta osoba szukała boskiego olśnienia w modlitwach, opowieściach i dysputach podczas uczty"
 pam_praise_the_gods_quiet_log_title: "Pogrążenie w cichej modlitwie"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUINameNotMe] – ta osoba opuściła biesiadę, by szukać boskiego spokoju w cichej modlitwie"
