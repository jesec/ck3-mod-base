l_polish:
 artifact_pedestal_bible_name: "Biblia $artifact_name_prefix$"
 artifact_pedestal_bible_description: "Iluminowana Biblia oprawiona w wysadzane klejnotami okładki, której każdy werset został przepisany ręcznie z wielką cierpliwością i oddaniem."
 artifact_pedestal_thurible_name: "Kadzielnica $artifact_name_prefix$"
 artifact_pedestal_thurible_description: "Kunsztownie wykonana kadzielnica zawieszona na wypolerowanych łańcuchach. Po rozpaleniu wypełnia salę wonnymi obłokami kadzidła, unosząc modlitwy ku niebiosom."
 artifact_pedestal_situla_name: "Situla $artifact_name_prefix$"
 artifact_pedestal_situla_description: "Bogato zdobione naczynie na wodę święconą, noszone w procesji, aby kropić wiernych w ramach błogosławieństwa."
 artifact_pedestal_crozier_name: "Pastorał $artifact_name_prefix$"
 artifact_pedestal_crozier_description: "Biskupi pastorał, wykonany na wzór pasterskiej laski, mający prowadzić wiernych i napominać błądzących."
