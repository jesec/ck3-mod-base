 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "Bóg stworzył złoto pod ziemią i obdarzył nas nim jako łaską dla swoich wybranych.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Simonia – tło historyczne','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "Bóg stworzył złoto pod ziemią i obdarzył nas nim jako łaską dla swoich wybranych.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Simōnía – tło historyczne','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "Bóg stworzył złoto pod ziemią i obdarzył nas nim jako łaską dla swoich wybranych.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Symonia – tło historyczne','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "Praktyka polegająca na sprzedawaniu urzędów kościelnych, relikwii i praktyk. Nazwa pochodzi od Szymona Maga, Samarytanina, który #weak czarował#! ludzi i oferował apostołom pieniądze za chrzest.\n\nWiele synodów – od synodu w Elwirze w 305 r. n.e. po Sobór Trydencki w 1545 r. n.e. – stanowczo potępiało symonię, nakładając za nią najsurowsze kary duchowe i świeckie. Jeśli jakaś praktyka była potępiana tak wiele razy przez tyle stuleci, oznacza to, że musiała być dość powszechna. Krytykowana była również w tezie 95 Marcina Lutra oraz w XIX pieśni „Piekła” Dantego: #weak „Zachłanni, którzy kradną rzeczy boskie, co winny być oblubienicami sprawiedliwości, i pogwałcają je za złoto i srebro!”#!"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[tax|E] z tytułu posiadania [Concept('castle_holdings', 'posiadłości zamkowych')|E] i [Concept('church_holdings', 'posiadłości kościelnych')|E] za każdy poziom @piety_icon! [Concept('piety', 'pobożności')|E]: #P +0,1 [gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "Można zapłacić @gold_icon! [gold|El], by zagwarantować akceptację [Concept('character_interaction', 'interakcji z postacią')|E] #high „$take_monastic_vows_interaction$”#!"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "Można zapłacić @gold_icon! [gold|El] za [titles|El] duchowne za pomocą [Concept('interaction', 'interakcji')|E] #high „$buy_ecclesiastical_title_interaction$”#!"
 tenet_simony_ecclesiastical_purchase_name: "[interaction|El] #high „$buy_ecclesiastical_title_interaction$”#!"
 doctrine_parameter_tenet_simony_gold_donations: "Darowizny @gold_icon! [Concept('gold', 'złota')|E] są #P 5 razy#! bardziej przekonujące przy składaniu petycji do [Concept('clergy', 'duchowieństwa')|E]"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "Roczna szansa na zdobycie #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! pkt @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] wynosi #P 25%#!–#P 75%#! (wyższa przy znacznym majątku)"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "[head_of_faith|E] zawsze przyjmuje @gold_icon! [gold|El] ofiarowywane w zamian za zniesienie [Concept('excommunication', 'ekskomuniki')|E]"
 doctrine_parameter_tenet_simony_personal_gifts: "Podarunki zmniejszają [stress|El], zapewniają nieco @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] i przynoszą dwukrotnie więcej punktów [Concept('opinion', 'opinii')|E]"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "Otwarty synkretyzm"
 pam_personal_syncretism_county_modifier_desc: "Miejscowa ludność szanuje synkretyczne tradycje swojego władcy i kwitnie pod jego rządami."
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "Monofizytyzm"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "Syn jest jeden i jego natura jest jedna, nawet jeśli wyobrażamy sobie, że przyjął ciało wraz z rozumną duszą.\n\n$pam_john_1_1_latin$\n\n[Glossary('Monophysitismus – tło historyczne','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "Jedyna natura słowa, które stało się ciałem.\n\n$pam_john_1_1_greek$\n\n[Glossary('Monophysitismós – tło historyczne','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "Chrystus ma tylko jedną naturę, w pełni boską.\n\n$pam_john_1_1_default$\n\n[Glossary('Monofizytyzm – tło historyczne','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "Nazwa tego dogmatu wywodzi się od greckich słów „monos” (#weak jedyny#!) i „physis” (#weak natura#!), a sam dogmat głosi, że Jezus Chrystus ma tylko jedną naturę boską – słowa Bożego, które stało się ciałem. Potępiony jako herezja na soborze chalcedońskim w 451 r. n.e. dogmat znalazł poparcie u cesarza Bazyliskusa i ochronę za panowania cesarza Justyniana I. Doprowadził do podziałów, takich jak schizma acefalitów, którzy odrzucili autorytet patriarchy Aleksandrii, oraz do powstania ruchów doketystycznych, których wyznawcy wierzyli, że ludzka natura Jezusa była jedynie pozorem."
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[characters|E] z cechą [GetTrait('theologian').GetName( GetNullCharacter )|l]: o #P 10%#! większy przyrost @piety_icon! [Concept('piety', 'pobożności')|E], #P +5#! pkt [Concept('opinion', 'opinii')|E] postaci fanatycznie religijnej, o #P 10%#! większe doświadczenie [Concept('lifestyle', 'stylu życia')|E]"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[characters|E] z cechą [GetTrait('stubborn').GetName( GetNullCharacter )|l]: o #P 10%#! większy przyrost @piety_icon! [Concept('piety', 'pobożności')|E], #P +10#! pkt [Concept('opinion', 'opinii')|E] [Concept('clergy', 'duchowieństwa')|E]"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[characters|E] z cechą [GetTrait('trusting').GetName( GetNullCharacter )|l]: o #N 10%#! mniejszy przyrost @piety_icon! [Concept('piety', 'pobożności')|E], #N -10#! pkt [Concept('opinion', 'opinii')|E] [Concept('clergy', 'duchowieństwa')|E]"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "Przeciwko innym [Concept('faiths', 'wiarom')|E] w obrębie twojej [Concept('religion', 'religii')|E]: o #P 25%#! szybsze [Concept('convert_county', 'nawracanie hrabstwa')|E], [characters|El] są o #P 20#! pkt bardziej skłonne zaakceptować nawrócenie"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "Żarliwy prozelityzm"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "Tak jak Mojżesz stanął przed faraonem i odważnie ogłosił powierzone mu zadanie, tak i nasi misjonarze stają przed innymi.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Actus Apostolorum – tło historyczne','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "Wracam do ciebie, ludu twój, darze twój dla mnie. Kieruj nim swą potężną prawicą i chroń go w cieniu swoich skrzydeł.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Práxeis tõn Apostólōn – tło historyczne','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "Przynieś światłość niebiańską tym, którzy trwają w ciemności, i nadzieję tym, którzy pogrążeni są w rozpaczy.\n\n$pam_acts_1_8_default$\n\n[Glossary('Żarliwy prozelityzm – tło historyczne','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "W pierwszych wiekach naszej ery chrześcijaństwo rozprzestrzeniało się błyskawicznie głównie dzięki działalności misyjnej apostołów i pierwszych uczniów. Podróże zaprowadziły ich w różne zakątki Cesarstwa Rzymskiego, gdzie zakładali wspólnoty chrześcijańskie i nawracali ludzi z najróżniejszych środowisk. Zapał do nawracania, podsycany głębokim przekonaniem o przesłaniu zbawienia przez Jezusa Chrystusa, sprawił, że chrześcijaństwo z niewielkiej sekty w obrębie judaizmu rozwinęło się w jedną z głównych religii świata.\n\nW średniowieczu wielu przyszłych świętych i męczenników podejmowało misje w krajach pogańskich, nieustannie szerząc wiarę chrześcijańską."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Mniejsze wymagania dotyczące [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('zealous_missionary_prep_decision').GetName]”, którą podejmie więcej [Concept('adventurers', 'poszukiwaczy przygód')|E]"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Nawrócenie [Concept('characters', 'postaci')|E] zapewnia #P 50#! pkt @legitimacy_icon!; twój [court_chaplain|El] nawracający [county|El] zapewnia #P 100#! pkt @legitimacy_icon! i #P 5#! pkt @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "Nawrócenie [Concept('character', 'postaci')|E] zapewnia #P 3#! pkt @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] lub #P 10#! pkt za nawrócenie [Concept('ruler', 'władcy')|E] z ziemią"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Twoja [head_of_rite|El] zyskuje #P 25#! pkt akceptacji podczas przekonywania [Concept('characters', 'postaci')|E] do tego [Concept('rite', 'obrządku')|E]"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "Twoja przewaga w zakresie [Concept('learning', 'nauki')|E] liczy się #P podwójnie#!, gdy żądasz od [Concept('characters', 'postaci')|E] nawrócenia"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "Nawrócenie [Concept('ruler', 'władcy')|E] zapewnia od #P 25#! do #P 1500#! pkt @piety_icon! [Concept('piety', 'pobożności')|E], a wartość ta jest skalowana w zależności od rangi jego [Concept('title', 'tytułu')|E]"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "Ze względu na dogmat „[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]”"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "Czyściec"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "O wiele bardziej lękam się kary, która czeka mnie w zaświatach. Dusza moja jest niespokojna, przepełniona niepewnością, bo już teraz odczuwam brzmię pierwszego tarasu.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Purgatorium – tło historyczne','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "A ci, którzy są już w niebie, nie posiadając ciała, nie mogą dalej uczestniczyć w przebóstwieniu, dlatego nasze modlitwy wspomagają ich w tym.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Kathartērion – tło historyczne','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "Ostateczne oczyszczenie tych, którzy umarli w stanie łaski, pozostawiające w nich jedynie świętość konieczną do wejścia do Królestwa Niebieskiego.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Czyściec – tło historyczne','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "Powszechnie akceptowano ideę stanu przejściowego po śmierci, w którym dusza oczekuje na pełnię chwały nieba, choć sama natura tego stanu była przedmiotem licznych debat. Poglądy na temat tego, czy jest on rzeczywistym miejscem, stanem umysłu, czystą metaforą czy fizycznym oczyszczeniem, różniły się między teologami i wyznaniami. Święta Katarzyna z Genui opisywała czyściec jako stan jednocześnie radości i dobrowolnego cierpienia za grzechy, natomiast Orygenes z Aleksandrii pisał o Bogu jako ogniu trawiącym.\n\nKościół katolicki sformalizował doktrynę czyśćca na soborach florenckim (1439) i trydenckim (1545–1563), określając go jako przejściowy stan oczyszczenia, oraz nauczając, że modlitwy i dobre uczynki żyjących mogą przynieść duszom w nim przebywającym duchowy pożytek."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[sinful|E] [characters|El] są mniej skłonne dołączyć do [Concept('factions', 'frakcji')|E] (#N -15#! pkt za każdy ciążący na ich sumieniu [sin|El])"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[Concept('sinful', 'Grzeszni')|E] [rulers|El] zyskują o #N 10%#! mniej @piety_icon! [Concept('piety', 'pobożności')|E] za każdy ciążący na ich sumieniu [sin|El]"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "Załamanie wywołane [Concept('stress', 'stresem')|E] może spowodować zastąpienie [Concept('sinful', 'grzesznych')|E] [Concept('traits', 'cech')|E] [Concept('virtues', 'cnotami')|E]; im poważniejsze załamanie, tym bardziej jest to prawdopodobne"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "[Concept('excommunicated', 'Ekskomunikowane')|E] [characters|El] praktykujące ten [rite|El] mogą odkupić grzechy poprzez pokutę: o #P 25%#! większy przyrost @piety_icon! [Concept('piety', 'pobożności')|E] i #P 10#! pkt do [Concept('opinion', 'opinii')|E] u osób wyznających tę samą wiarę"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|E] kosztuje mniej @prestige_icon! [Concept('prestige', 'prestiżu')|E] i nie obniża twojego [Concept('prestige_level', 'poziomu sławy')|E]"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "Zyskasz #P 50#! pkt @piety_icon! [Concept('piety', 'pobożności')|E] za każdy [sin|El] ciążący na sumieniu członka bliskiej [Concept('family', 'rodziny')|E], który umiera"
 pam_purgatory_prayers_for_the_dead_toast: "Ze względu na twój dogmat „[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]”: modlitwy za zmarłych"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "Crescite et multiplicamini" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì plēthýnesthe" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "Bądźcie płodni i rozmnażajcie się"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "Para daje nie tylko siebie, lecz także istotę dzieci, które są odbiciem ich miłości – żywą i nierozerwalną syntezą ich istnienia.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Crescite et multiplicamini – tło historyczne','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "Oto dzieci są dziedzictwem Pana, a owoc łona jest nagrodą.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Auxánesthe kaì plēthýnesthe – tło historyczne','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "W planie Bożym rodzina jest bliską wspólnotą życia i miłości, przedsięwzięciem, które – podobnie jak wszystko, co zostało stworzone i odkupione – znajdzie swoje spełnienie w Królestwie Bożym.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Bądźcie płodni i rozmnażajcie się – tło historyczne','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "Bądźcie płodni i rozmnażajcie się – to biblijne wezwanie zawarte w Księdze Rodzaju 1:28, gdzie Bóg nakazuje Adamowi i Ewie, by się rozmnażali i zaludnili ziemię."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Romantyczne gesty wobec małżonka przychodzą znacznie łatwiej i zapewniają znaczną premię do [Concept('fertility', 'płodności')|E]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "Zawsze można wziąć rozwód z małżonkiem o niskiej [Concept('fertility', 'płodności')|E]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "Noworodki zyskują premię do [Concept('health', 'zdrowia')|E] zależną od bliskości relacji między ich rodzicami"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "Troskliwe wychowanie"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "Wychowanie pełne miłości"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "Wychowanie pełne oddania"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "Dziecko zrodzone z pełnego miłości związku dorasta otoczone ciepłem obojga rodziców i dzięki temu rozkwita"
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "Po narodzinach i osiągnięciu dorosłości:\n$BULLET_WITH_TAB$#V Dziecko#! otrzymuje modyfikator „[GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip]” na 2 lata.\n$BULLET_WITH_TAB$#V Rodzice#! otrzymują modyfikator „[GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip]” na 2 lata."
 tenet_be_fruitful_and_multiply_child_modifier: "Rozpieszczenie"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "Żarliwe wielbienie płodności sprawia, że wszyscy wierni poświęcają więcej uwagi i troski dzieciom oraz ich rodzicom"
 tenet_be_fruitful_and_multiply_parent_modifier: "Sławienie płodności"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "Successio apostolica" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "Apostolikē diadokhē" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "Sukcesja apostolska"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "Prymat godności i władzy, który Chrystus przekazał apostołowi Piotrowi, a który przejmują jego następcy – papieże.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Successio apostolica – tło historyczne','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "Pierwszym duchownym Kościoła rzymskiego był Linus, syn Klaudii, wyświęcony przez Pawła.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Apostolikē diadokhē – tło historyczne','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "Nieprzerwana linia biskupów od czasów apostołów aż po dzień dzisiejszy zapewniająca autentyczny przekaz wiary.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Sukcesja apostolska – tło historyczne','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "Doktryna sukcesji apostolskiej głosi, że biskupi czerpią swoją władzę z nieprzerwanego łańcucha święceń sięgającego samych apostołów. Ireneusz z Lyonu w II wieku posłużył się sukcesją apostolską jako argumentem przeciw herezjom gnostyckim, dowodząc, że prawdziwe nauczanie Chrystusa zostało zachowane dzięki prawowitym biskupom Kościoła.\n\nOd XIII wieku papieże noszą Pierścień Rybaka jako symbol sukcesji po świętym Piotrze. Kościół prawosławny uznaje pochodzenie papieży zachodnich i ich rolę we wczesnym chrześcijaństwie, lecz nie przyznaje Piotrowi statusu wyższego niż innym apostołom, uznając Linusa za pierwszego biskupa Rzymu."
 tenet_apostolic_succession_requires_head_of_faith_tt: "Twoja [faith|El] musi mieć [Concept('head_of_faith', 'głowę wiary')|E]"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "[theocratic_vassals|E] mają niższe [legitimacy_expectations|El] wobec swojego [Concept('liege', 'seniora')|E], jeśli wyznaje tę samą [Concept('faith', 'wiarę')|E]"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "Zapewnia modyfikator „[GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]”"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "Awans [Concept('cardinal', 'kardynała')|E] zwiększa jego [papabile_score|El] o kolejne #P 10#! pkt"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "Ogłoszenie twojej @legitimacy_icon! [Concept('legitimacy', 'legitymacji')|E] osobiście przez [Concept('head_of_faith', 'głowę wiary')|E] zapewnia dodatkowe punkty @legitimacy_icon! [Concept('legitimacy', 'legitymacji')|E]"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "Pozbawienie władzy [Concept('antipope', 'antypapieża')|E] zapewnia @legitimacy_icon! [Concept('legitimacy', 'legitymację')|E] i @spiritual_fulfillment_icon! [spiritual_fulfillment|El]"
 # Confession tenet
 tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
 tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
 tenet_confession_default_name: "Sakrament spowiedzi"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "Pobłogosław mi, Ojcze, bo zgrzeszyłem. Całując ziemię u Twych stóp, pokornie błagam: wybacz mi, o miłosierny Panie – i zechciej wysłuchać szczerego wyznania grzechów, które dziś składam przed Tobą i Twym kapłanem.\n\n$pam_james_5_16_latin$\n\n[Glossary('Confessio – tło historyczne','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "Racz, Panie, wysłuchać modlitwy marnego grzesznika. Z pokorą proszę, byś zniszczył węża, który zgnilizną zatruwa me serce.\n\n$pam_james_5_16_greek$\n\n[Glossary('Exomológēsis – tło historyczne','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "Dzięki spowiedzi grzesznicy mogą otrzymać rozgrzeszenie i na powrót zjednoczyć się z Bogiem i Kościołem.\n\n$pam_james_5_16_default$\n\n[Glossary('Sakrament spowiedzi – tło historyczne','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "Praktyka wyznawania grzechów przechodziła wyraźne zmiany na przestrzeni dziejów chrześcijaństwa. U początków Kościoła powszechny był zwyczaj publicznego wyznawania grzechów śmiertelnych. Spowiedź prywatna – przed kapłanem – zyskała większą popularność w kościołach celtyckich w VI wieku i upowszechniła się w zachodnim odłamie chrześcijaństwa. Sobór laterański IV w 1215 roku narzucił na wszystkich chrześcijan obowiązek spowiadania się co roku. Nierozerwalna dla sakramentu stała się tajemnica spowiedzi, czyli bezwzględny obowiązek zachowania poufności co do treści wyznania. Spowiednicy prędzej byli gotowi na męczeństwo niż na jej zdradę."
 doctrine_parameter_tenet_confession_priests_secrets: "[court_chaplain|E] wyznający tę samą [Concept('faith', 'wiarę')|E], co ty, spowiadający się i albo darzący cię sympatią, albo będący pod działaniem haka mocnego, ma większą skuteczność realizacji [Concept('councillor_task', 'zadania radnego')|E] „$task_find_secrets$”"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "Użycie interakcji „#high $spiritual_counsel_interaction$#!” wobec [Concept('clergy', 'duchowieństwa')|E] tego [Concept('rite', 'obrządku')|E] zapewnia więcej punktów @piety_icon! [Concept('piety', 'pobożności')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[schemes|E] „[GetScheme('study_scripture').GetTypeName]” bardziej łagodzą [stress|El]"
 doctrine_parameter_tenet_confession_confess_sins_decision: "Można użyć [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('pam_decision_confession').GetName]”"
 # Original Sin tenet
 tenet_original_sin_latin_name: "Peccatum Originale" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "Propatorikē hamartía" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "Grzech pierworodny"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "Nieposłuszeństwo Adama odcisnęło się grzechem na całej ludzkości. Piętno tego czynu wciąż paczy naturę człowieka, czyniąc go słabym i skłonnym do ulegania nikczemnym pokusom – skazanym na duchową walkę.\n\n$pam_romans_5_12_latin$\n\n[Glossary('Peccatum Originale – tło historyczne','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "Nasza jest wina, nasz Ojcze i Stwórco. Gdy Adam i Ewa w swym samolubstwie dali się zwieść Szatanowi, dopuścili się bluźnierstwa, które wypaczyło naturę całej ludzkości. W naszych sercach drzemie zło.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Propatorikē Hamartía – tło historyczne','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "Każdy człowiek dziedziczy znamię pierwszego grzechu Adama – i tylko łaska boża w osobie Chrystusa może przynieść nam zbawienie.\n\n$pam_romans_5_12_default$\n\n[Glossary('Grzech pierworodny – tło historyczne','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "Doktrynę związaną z grzechem pierworodnym obszernie opracował na początku V wieku Augustyn z Hippony, przede wszystkim w odpowiedzi na herezję szerzoną przez pelagian, którzy zaprzeczali dziedziczeniu grzechu. Augustyn nauczał, że grzech Adama został przekazany wszystkim jego potomkom, wypaczając naturę ludzką i uniemożliwiając zbawienie bez otrzymania łaski bożej. Synod w Kartaginie w 418 roku przyjął ten pogląd, czyniąc go tym samym podstawą teologii chrześcijańskiej Zachodu. We wschodnim odłamie chrześcijaństwa kwestię postrzegano nieco inaczej: nacisk kładziony był nie na tyle na bezpośrednie dziedziczenie grzechu, co na grzech pokoleniowy."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "Postęp [Concept('councillor_task', 'zadania radnego')|E] „[promote_culture|E]” jest o #P 25%#! szybszy w [Concept('counties', 'hrabstwach')|E] praktykujących ten sam [rite|El]"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "[Concept('promote_culture', 'Zmiana kultury')|E] w [Concept('counties', 'hrabstwach')|E] wyznających tę [Concept('faith', 'wiarę')|E] zajmuje o #N 50%#! więcej czasu, jeśli [liege|El] wyznaje inną [Concept('faith', 'wiarę')|E]"
 doctrine_parameter_tenet_original_sin_sinners_insight: "Zyskujesz #P 10#! pkt maksymalnej szansy powodzenia [Concept('scheme', 'spisku')|E] wrogiego za każdy ciążący ci na sumieniu [sin|El]"
 doctrine_parameter_tenet_original_sin_baptism_piety: "Gdy rodzi ci się dziecko, zyskujesz #P 50#! pkt @piety_icon! [Concept('piety', 'pobożności')|E]; gdy noworodek zostaje ochrzczony, zyskujesz #P 250#! pkt @piety_icon! [Concept('piety', 'pobożności')|E]"
 pam_original_sin_baptism_toast: "Ze względu na twój dogmat „[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]”: grzech pierworodny zostaje zmyty"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "Hierarchia caelestis" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "Ouranía hierarkhía" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "Hierarchia niebiańska"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "Otoczcie opieką tron mój i krew, o anioły boże; Ty zaś, Ojcze Niebieski, pozwól im modlitwy nieść, które do Ciebie wznoszę, i każ uciszać tych, co biją we mnie i lęk sieją, pragnąc mi zaszkodzić.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Hierarchia Caelestis – tło historyczne','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "Rozsądnym bądź, Aniele Stróżu, doradcą i towarzyszem chrześcijańskiego ludu, mądrość mu niosąc, siłę, radość, spokój i pociechę.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Ouranía Hierarkhía – tło historyczne','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "Istnieje dziewięć chórów anielskich. Tak serafiny, jak i niższe rangą istoty w danych im rolach wypełniają wolę Boga i przewodzą ludziom.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Hierarchia niebiańska – tło historyczne','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "Koncepcję hierarchii niebiańskiej opisał szczegółowo Pseudo-Dionizy Areopagita w V lub VI wieku w swoim tekście „De Coelesti Hierarchia”. Podzielił anioły na trzy triady: najwyższa obejmowała serafinów, cherubinów i trony; do triady drugiej należały potęgi, moce i panowania, do najniższej zaś – zwierzchności, archanioły i anioły.\n\nHierarchia Pseudo-Dionizego miała dogłębny wpływ na średniowieczną teologię chrześcijańską i została przyjęta zarówno przez Kościoły wschodnie, jak i zachodnie. Tomasz z Akwinu uwzględnił tę koncepcję angelologiczną w dziele „Summa theologiae”; kształtowała ona wizualizacje artystyczne Nieba w średniowieczu."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Zatrudnianie postaci z wysokimi [Concept('aptitude', 'kompetencjami')|E] na [Concept('court_positions', 'urzędach dworskich')|E] zapewnia #P 3#! pkt @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E], natomiast zwalnianie takich postaci z urzędów dworskich lub ich odwołanie pomniejsza spełnienie duchowe o #N 3#! pkt"
 pam_celestial_hierarchy_hire_sp_toast: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )] (dogmat osobisty)"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "Posiadacze [Concept('court_positions', 'urzędów dworskich')|E] wyznający [Concept('faith', 'wiarę')|E] swojego [Concept('liege', 'seniora')|E] zyskują [aptitude|El] na podstawie swojego [Concept('piety_level', 'poziomu religijności')|E]"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "[clergy|E] zyskuje #P +20#! pkt akceptacji [Concept('interaction', 'interakcji')|E] wobec [Concept('rulers', 'władców')|E] świeckich"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "Efektywność [Concept('councillor_task', 'zadania radnego')|E] „[religious_relations|E]” jest zwiększona o #P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')]%#!"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "Akceptacja [Concept('interaction', 'interakcji')|E] pomiędzy postaciami wyznającymi tę samą [Concept('faith', 'wiarę')|E] zmienia się o #P +10#! pkt za każdy [piety_level|El] wyższy od poziomu celu i o #N -10#! pkt za każdy poziom niższy"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "[clergy|E] wobec [Concept('ruler', 'władcy')|E] świeckiego: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "Względny [piety_level|El]: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "Władza duchowieństwa nad [Concept('ruler', 'władcą')|E] świeckim: $VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "Miles Christi" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "Żołnierze Chrystusa"
 tenet_miles_christi_latin_desc: "Nie ustępuj więc, lędźwie prawdą oblekłszy, a pierś – sprawiedliwości zbroją. Walcz mężnie w imię wiary, jako by uczynił prawdziwy Żołnierz Chrystusa.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Miles Christi – tło historyczne','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "Każdy chrześcijanin oddany swej wierze musi być gotowy cierpieć w imię Chrystusa; stać niewzruszenie wobec duchowych sił zepsucia i trwać w trudzie z żołnierską odwagą.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Stratiōtēs Christoũ – tło historyczne','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "Wzywa się wiernych, by stali się wojownikami ducha; by w pancerzu Boga stawiali czoła grzechowi i złu, gotowi cierpieć za Chrystusa tak, jak żołnierz jest gotów poświęcić się dla dowódcy.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Żołnierze Chrystusa – tło historyczne','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "Idea Żołnierza Chrystusa (Miles Christi) jest głęboko osadzona w tradycji chrześcijańskiej, a wywodzi się z epistoły św. Pawła, w której metafory związane z walką służyły opisowi życia duchowego. W średniowieczu koncepcja Żołnierza Chrystusa odnosiła się do wojny w znaczeniu zarówno dosłownym, jak i duchowym.\n\nZakony rycerskie k templariusze i szpitalnicy – realizowały tę ideę, łącząc dyscyplinę zakonną ze zdolnościami bojowymi. W swoim dziele „Liber ad milites templi de laude novae militiae” Bernard z Clairvaux wysławiał mnichów bojowych jako bohaterów ucieleśniających cnotę chrześcijańską, którzy toczyli bój nie dla korzyści w życiu doczesnym, a w obronie wiary."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Kończenie [Concept('white_peace', 'białym pokojem')|E] [Concept('war', 'wojny')|E] przeciwko wyznawcom tej samej [Concept('faith', 'wiary')|E] jako obrońca zapewnia #P 100#! pkt @piety_icon! [Concept('piety', 'pobożności')|E] i @legitimacy_icon! [Concept('legitimacy', 'legitymacji')|E] (wartość obu skalowana przez rangę [Concept('title', 'tytułu')|E] obu stron) oraz #P 5#! pkt @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Dowodzenie w zwycięskiej [Concept('battle', 'bitwie')|E] lub w udanym [Concept('siege', 'oblężeniu')|E] zapewnia #P 3#! pkt @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "Zwycięstwo w [Concept('battles', 'bitwach')|E] przeciwko wyznawcom innej [Concept('religion', 'religii')|E], gdy ma się przy sobie broń będącą [Concept('holy_relic', 'świętą relikwią')|E], dodatkowo ulepsza tę broń poprzez cztery błogosławieństwa aż do #P 50#! zwycięstw"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "Miłosierdzie"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "Co uczyniliście najmniejszym z braci mych i sióstr, mnieście uczynili. Jałmużna i opieka nad biednymi nie są jedynie obywatelskim obowiązkiem – pozwalają nam zbliżyć się do Chrystusa.\n\n[Glossary('Caritas – tło historyczne','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "Philanthrōpia – umiłowanie ludzi – w pełni objawia się w cesarskich i kościelnych szpitalach, hospicjach i organizacjach charytatywnych Nowego Rzymu. Kto karmi głodnych i wykupuje pojmanych, ten upodabnia się do Chrystusa, który poświęcił się dla nas, ogołacając samego siebie.\n\n[Glossary('Philanthrōpía – tło historyczne','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "Według wiary szczodre jałmużny, pomoc biednym i zinstytucjonalizowana działalność charytatywna należą do podstawowych obowiązków chrześcijan. Powinniśmy podążać drogą Ojców i stawiać sobie za przykład pierwsze szpitale i hospicja.\n\n[Glossary('Miłosierdzie – tło historyczne','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "W chrześcijaństwie bizantyjskim terminem „philanthrōpia” określano zarówno cnotę miłości uniwersalnej, jak i konkretne instytucje (szpitale, ksenodochia, sierocińce i organizacje charytatywne) wspierane przez cesarzów, biskupów i wiernych. Bazyli Wielki, Jan Chryzostom i późniejsi cesarzowie, tacy jak Justynian, wiązali legitymację cesarską z obowiązkiem niesienia pomocy potrzebującym. Kościół nie pochwalał wojny jako drogi do świętości – utrzymywał natomiast, że bogactwo i władza znajdują częściowe uzasadnienie w stopniu, w jakim wykorzystywane są do pomocy ubogim."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "Można mianować na stanowisko o nazwie [GetCourtPositionType('high_almoner_court_position').GetName|l] już od rangi [Concept('county', 'hrabstwa')|E]"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Wpłacenie okupu za inną [character|El] zapewnia @piety_icon! [piety|El] i @spiritual_fulfillment_icon! [spiritual_fulfillment|El] proporcjonalnie do wpłaconego @gold_icon! [Concept('gold', 'złota')|E]"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[characters|E] z cechą [GetTrait('generous').GetName( GetNullCharacter )|l]: o #P 10%#! lepsza [opinion|El] u wyznawców tej samej wiary, o #P 20%#! większy [development_growth|El]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[characters|E] z cechą [GetTrait('greedy').GetName( GetNullCharacter )|l]: #N -10#! pkt [Concept('opinion', 'opinii')|E] wyznawców tej samej wiary, o #N 25%#! mniejszy przyrost @piety_icon! [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "Przesłanie [Concept('gift', 'podarunku')|E] [Concept('character', 'postaci')|E], która ma [debt|El], zapewnia @prestige_icon! [prestige|El] i @piety_icon! [piety|El]"
