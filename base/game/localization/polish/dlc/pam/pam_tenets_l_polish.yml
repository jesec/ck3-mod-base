 pam_genesis_3_6_greek: "[Glossary('Kaì eĩden hē gyne hóti kalòn tò xýlon eis brõsin kaì hóti arestòn toĩs ophthalmoĩs ideĩn kaì hōraĩón estin toũ katanoẽsai, kaì laboũsa toũ karpoũ autoũ éphagen kaì édōken kaì to andrì autẽs met autẽs, kaì éphagon.','GENESIS_3_6_GREEK_GLOSS')]" #καὶ εἶδεν ἡ γυνὴ ὅτι καλὸν τὸ ξύλον εἰς βρῶσιν καὶ ὅτι ἀρεστὸν τοῖς ὀφθαλμοῖς ἰδεῖν καὶ ὡραῖόν ἐστιν τοῦ κατανοῆσαι, καὶ λαβοῦσα τοῦ καρποῦ αὐτοῦ ἔφαγεν καὶ ἔδωκεν καὶ τῷ ἀνδρὶ αὐτῆς μετ᾽ αὐτῆς, καὶ ἔφαγον.
