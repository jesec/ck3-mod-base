 pam_luke_1_42_greek: "[Glossary('Eulogēménē sỳ en gynaixín, kaì eulogēménos ho karpòs tês koilías sou.', 'LUKE_1_42_GREEK_GLOSS')]" #εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
 pam_luke_1_79_greek: "[Glossary('Epiphãnai toĩs en skótei kaì skia thanátou kathēménois, toũ kateuthỹnai toùs pódas hēmõn eis hodòn eirenēs.', 'LUKE_1_79_GREEK_GLOSS')]" #ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
 pam_colossians_3_15_greek: "[Glossary('Kaì hē eirenē toũ Christoũ brabeuétō en taĩs kardíais hymõn, eis hen kaì eklethēte en henì somati; kaì euchάristoi gínesthe.', 'COLOSSIANS_3_15_GREEK_GLOSS')]" #καὶ ἡ εἰρήνη τοῦ Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
 pam_matthew_5_9_greek: "[Glossary('Makάrioi hoi eirēnopoioí, hóti autoì hyioì theoũ klēthesontai.', 'MATTHEW_5_9_GREEK_GLOSS')]" #μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
 pam_philippians_4_21_greek: "[Glossary('Aspásasthe pánta hágion en Christo Iēsoũ. aspázontai hymãs hoi sỳn emoì adelphoí.', 'PHILIPPIANS_4_21_GREEK_GLOSS')]" #ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
 pam_hebrews_12_1_greek: "[Glossary('Toigaroũn kaì hēmeĩs tosoũton ékhontes perikeímenon hēmĩn néphos martýrōn, ógkon apothémenoi pánta kaì ten euperístaton hamartían, di hypomones tréchōmen tòn prokeímenon hēmĩn agõna', 'HEBREWS_12_1_GREEK_GLOSS')]" #τοιγαροῦν καὶ ἡμεῖς τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι' ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα
 pam_acts_7_59_greek: "[Glossary('Kaì elithoboloun tòn Stéphanon epikaloúmenon kaì légonta; kýrie Iēsoũ, déxai tò pneũmá mou.', 'ACTS_7_59_GREEK_GLOSS')]" #καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου.
 pam_luke_22_19_greek: "[Glossary('Kaì labon árton eucharistesas éklasen kaì édōken autoĩs légōn; Toũtó estin tò sõmá mou tò hypèr hymõn didómenon; toũto poieĩte eis ten emen anάmnēsin.', 'LUKE_22_19_GREEK_GLOSS')]" #καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
 pam_1_corinthians_1_10_greek: "[Glossary('Parakalõ dè hymãs, adelphoí, dià toũ onómatos toũ kyríou hēmõn Iēsoũ Christoũ, hína tò autò légēte pántes kaì me e en hymĩn schísmata, ẽte dè katērtisménoi en to auto noï kaì en te aute gnome.', '1_CORINTHIANS_1_10_GREEK_GLOSS')]" #παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
 pam_1_corinthians_10_16_greek: "[Glossary('Tò poterion tẽs eulogías hò eulogoũmen, ouchì koinōnía estin toũ haímatos toũ Christoũ? tòn árton hòn klõmen, ouchì koinōnía toũ somatos toũ Christoũ estín?', '1_CORINTHIANS_10_16_GREEK_GLOSS')]" #τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστίν;
 pam_1_corinthians_10_17_greek: "[Glossary('hóti heĩs ártos, hèn sõma hoi polloí esmen, hoi gàr pántes ek toũ henòs ártou metéchomen.', '1_CORINTHIANS_10_17_GREEK_GLOSS')]" #ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
 pam_john_6_41_greek: "[Glossary('Egóggyzon oũn hoi Ioudaĩoi perì autoũ hóti eĩpen; Ego eimi ho ártos ho katabàs ek toũ ouranoũ', 'JOHN_6_41_GREEK_GLOSS')]" #ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ.
 pam_1_thessalonians_5_16_20_greek: "[Glossary('Pántote chaírete, adialeíptōs proseúchesthe, en pantì eucharistẽite; toũto gàr thélēma theoũ en Christo Iēsoũ eis hymãs. tò pneũma me sbénnyte, prophēteías me exoutheneĩte', '1_THESSALONIANS_5_16_20_GREEK_GLOSS')]" #πάντοτε χαίρετε, ἀδιαλείπτως προσεύχεσθε, ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς. τὸ πνεῦμα μὴ σβέννυτε, προφητείας μὴ ἐξουθενεῖτε
 pam_1_thessalonians_4_11_greek: "[Glossary('Kaì philotimeĩsthai hēsychάzein kaì prάssein tà ídia kaì ergάzesthai taĩs chersìn hymõn, kathos hymĩn parēngeílamen', '1_THESSALONIANS_4_11_GREEK_GLOSS')]" #καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν
 pam_proverbs_6_6_greek: "[Glossary('Noesei te parabolen kaì skoteinòn lógon rheseis te sophon kaì ainígmata.', 'PROVERBS_6_6_GREEK_GLOSS')]" #νοήσει τε παραβολὴν καὶ σκοτεινὸν λόγον ῥήσεις τε σοφῶν καὶ αἰνίγματα.
 pam_john_19_26_27_greek: "[Glossary('Iēsoũs oũn idon ten mētéra kaì tòn mathēten parestõta hòn ēgάpa légei te mētrí; Gýnai, íde ho hyiós sou. eĩta légei to mathēte; Íde hē metēr sou. kaì ap ekeínēs tẽs horas élaben ho mathētes auten eis tà ídia.', 'JOHN_19_26_27_GREEK_GLOSS')]" #Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ μητρί· Γύναι, ἴδε ὁ υἱός σου. εἶτα λέγει τῷ μαθητῷ· Ἴδε ἡ μήτηρ σου. καὶ ἀπ᾽ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
 pam_isaiah_7_14_greek: "[Glossary('Dià toũto dosei Kýrios autòs hymĩn sēmeĩon; idoù hē parthénos en gastrì héxei, kaì téxetai hyión, kaì kaléseis tò ónoma autoũ Emmanouel.', 'ISAIAH_7_14_GREEK_GLOSS')]" #διὰ τοῦτο δώσει Κύριος αὐτὸς ὑμῖν σημεῖον· ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει, καὶ τέξεται υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἐμμανουήλ·
 pam_proverbs_31_20_greek: "[Glossary('Ithi pròs tòn mýrmēka, o oknēré, kaì zelōson idon tàs hodoùs autoũ kaì genoũ ekeínou sophoteros;', 'PROVERBS_31_20_GREEK_GLOSS')]" #Ἰθι πρὸς τὸν μύρμηκα, ὦ ὀκνηρέ, καὶ ζήλωσον ἰδὼν τὰς ὁδοὺς αὐτοῦ καὶ γενοῦ ἐκείνου σοφώτερος·
 pam_revelation_12_1_greek: "[Glossary('Kaì sēmeĩon méga ophthē en to ourano, gyne peribeblēménē tòn helion, kaì hē selenē hypokάtō tõn podõn autẽs kaì epì tẽs kephalẽs autẽs stéphanos astérōn dodeka', 'REVELATION_12_1_GREEK_GLOSS')]" #καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα
 pam_acts_8_18_greek: "[Glossary('Idon dè ho Símōn hóti dià tẽs epithéseōs tõn cheirõn tõn apostólōn dídotai tò pneũma prosenenken autoĩs chremata', 'ACTS_8_18_GREEK_GLOSS')]" #ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
 pam_proverbs_21_20_greek: "[Glossary('Thēsauròs epithymētòs anapaúsetai epì stómatos sophoũ, áphrones dè ándres katapíontai autón.', 'PROVERBS_21_20_GREEK_GLOSS')]" #θησαυρὸς ἐπιθυμητὸς ἀναπαύσεται ἐπὶ στόματος σοφοῦ, ἄφρονες δὲ ἄνδρες καταπίονται αὐτόν.
 pam_luke_16_11_greek: "[Glossary('Ei oũn en to adíko mamōna pistoì ouk egénesthe, tò alēthinòn tís hymĩn pisteúsei?', 'LUKE_16_11_GREEK_GLOSS')]" #εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
 pam_john_10_30_greek: "[Glossary('Ego kaì ho pater hén esmen.', 'JOHN_10_30_GREEK_GLOSS')]" #ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
 pam_john_1_1_greek: "[Glossary('En arche ẽn ho lógos, kaì ho lógos ẽn pròs tòn theón, kaì theòs ẽn ho lógos.', 'JOHN_1_1_GREEK_GLOSS')]" #Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
 pam_hebrews_1_3_greek: "[Glossary('Hòs on apaúgasma tẽs dóxēs kaì charakter tẽs hypostάseōs autoũ, phérōn te tà pánta to rhemati tẽs dynάmeōs autoũ, katharismòn tõn hamartiõn poiēsάmenos ekάthisen en dexia tẽs megalōsýnēs en hypsēloĩs', 'HEBREWS_1_3_GREEK_GLOSS')]" #ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως αὐτοῦ, καθαρισμὸν τῶν ἁμαρτιῶν ποιησάμενος ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς
 pam_acts_1_8_greek: "[Glossary('Allà lempsesthe dýnamin epelthóntos toũ hagíou pneúmatos eph hymãs kaì ésesthé mou mártyres én te Ierousalem kaì en pάse te Ioudaía kaì Samarίa kaì héōs eschάtou tẽs gẽs.', 'ACTS_1_8_GREEK_GLOSS')]" #ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ' ὑμᾶς καὶ ἔσεσθέ μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρίᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
 pam_acts_2_4_greek: "[Glossary('Kaì eplesthēsan hápantes pneúmatos hagíou kaì erxanto laleĩn hetérais glossais kathos tò pneũma edídou apophthéngesthai autoĩs.', 'ACTS_2_4_GREEK_GLOSS')]" #καὶ ἐπλήσθησαν ἅπαντες πνεύματος ἁγίου καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι αὐτοῖς.
 pam_acts_2_38_greek: "[Glossary('Pétros dè pròs autoús; Metanoesate, kaì baptisthetō hékastos hymõn en to onómati Iēsoũ Christoũ eis áphesin tõn hamartiõn hymõn kaì lempsesthe ten dōreàn toũ hagíou pneúmatos.', 'ACTS_2_38_GREEK_GLOSS')]" #Πέτρος δὲ πρὸς αὐτούς· Μετανοήσατε, καὶ βαπτισθήτω ἕκαστος ὑμῶν ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
 pam_2_macabees_12_44_greek: "[Glossary('Ei gàr me toùs propeptōkótas anastenai prosedóka, perissòn àn en kaì lērodes hypèr nekron proseúkhesthai.','2_MACABEES_12_44_GREEK_GLOSS')]" #εἰ γὰρ μὴ τοὺς προπεπτωκότας ἀναστῆναι προσεδόκα, περισσὸν ἂν ἦν καὶ ληρῶδες ὑπὲρ νεκρῶν προσεύχεσθαι.
 pam_matthew_12_25_greek: "[Glossary('Pãsa basileía meristheĩsa kath heautẽs erēmoũtai, kaì pãsa pólis e oikía meristheĩsa kath heautẽs ou stathésetai.','MATTHEW_12_25_GREEK_GLOSS')]" #πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
 pam_matthew_12_32_greek: "[Glossary('Kaì hòs eàn eípe lógon katà toũ hyioũ toũ anthropou, aphethesetai auto; hòs d àn eípe katà toũ pneúmatos toũ hagíou, ouk aphethesetai auto oúte en toúto to aiõni oúte en to méllonti.','MATTHEW_12_32_GREEK_GLOSS')]" #καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ' ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
