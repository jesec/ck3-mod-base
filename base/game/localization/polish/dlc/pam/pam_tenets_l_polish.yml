 # Scholasticism tenet
 tenet_scholasticism_latin_name: "Sacra Doctrina" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "Scholastyka"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "Dążenie do wiedzy jest formą czci, albowiem próbując zrozumieć stworzenie, zbliżamy się do zrozumienia Stwórcy. Kto szuka mądrości, ten ją otrzyma.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Sacra Doctrina – tło historyczne','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "Nie ma sprzeczności między rozumem a wiarą: Bóg dał nam umysły, abyśmy poszukiwali prawdy, i serca, abyśmy Go miłowali. Poświęcenie nauce i kontemplacji jest drogą do wyższego zrozumienia.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Skholastikē – tło historyczne','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "Nieprzejednana dociekliwość umysłu i dialektyka są drogą do zjednoczenia wiary i rozumu, a zarazem kluczem do głębszego zrozumienia boskiej prawdy.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Scholastyka – tło historyczne','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "Scholastyka była dominującą nauką uprawianą na średniowiecznych uniwersytetach w Europie, a jej szczyt popularności przypadł na XII i XIII wiek. Scholastycy dążyli do pogodzenia teologii chrześcijańskiej z filozofią klasyczną, a w szczególności z przekazami zawartymi w tekstach Arystotelesa.\n\nWielcy myśliciele scholastyczni – między innymi Anzelm z Canterbury, Piotr Abelard, Albert Wielki i Tomasz z Akwinu – opracowali ustrukturyzowane podejścia do teologii propagujące bezwzględną logikę i debatowanie. Najwyższym osiągnięciem metody scholastycznej pozostaje dzieło „Summa theologiae” Tomasza z Akwinu, które stanowi próbę syntezy całej wiedzy ludzkiej z założeniami chrześcijańskimi."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Odwiedzanie [Concept('points_of_interest', 'ciekawych miejsc')|E] w [Concept('counties', 'hrabstwach')|E], w których wyznawana jest religia [GetReligionByKey('judaism_religion').GetAdjective|l], [GetReligionByKey('islam_religion').GetAdjective|l] lub [GetReligionByKey('zoroastrianism_religion').GetAdjective|l], zapewnia dodatkowe punkty @piety_icon! [Concept('piety', 'pobożności')|E], [Concept('experience', 'doświadczenia')|E] w [Concept('learning', 'nauce')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_scholasticism_university_bonus: "[GetActivityType('activity_adult_education').GetName] – ukończenie tej aktywności zapewnia długotrwały [modifier|El] „[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]”"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[scheme_success_chance|E] „[GetScheme('study_scripture').GetTypeName]”: [success_chance_i] #P +10%#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "Coroczna szansa na zdobycie modyfikatora „[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]” bez nauki, zwiększana przez [Concept('learning', 'naukę')|E], [piety_level|El] i liczbę znanych języków"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "Wzięcie udziału w aktywności, którą jest [GetActivityType('activity_adult_education').GetName|l], kosztuje o #P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')]%#! mniej @gold_icon! [Concept('gold', 'złota')|E]"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization( HasDlcFeature( 'legacy_of_persia' ), 'tenet_scholasticism_court_scholar_effect', 'blank_line' )]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "Może mianować osobę, którą jest [GetCourtPositionType('court_scholar_court_position').GetName|l], mimo braku [Concept('culture_tradition', 'tradycji kulturowej')|E] „$tradition_fp3_beacon_of_learning_name$” i #P nie wypłacać jej pensji#!"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "Dążenie do wiedzy jest formą czci, albowiem próbując zrozumieć stworzenie, zbliżamy się do zrozumienia Stwórcy."
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "Badania w podróży"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.GetTitledFirstName] spędza ostatni odcinek drogi, spierając się z tobą, i gdzieś pomiędzy jedną [Concept('barony', 'baronią')|E] a drugą dochodzi do wniosku, że tę sprawę lepiej rozstrzygnąć na piśmie."
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "Diliges proximum" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn plēsíon" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "Umiłowanie bliźniego"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "Obyśmy potrafili spojrzeć na innych tak, jak patrzysz Ty – bez osądu, a z umiłowaniem – i dojrzeć w nich, tak jak w sobie, dzieło, które we właściwym czasie dokona się Twoimi rękoma.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Diliges Proximum – tło historyczne','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "Cóż może być bardziej błogiego, i cóż piękniejszego, niż umiłowanie bliźniego? Miłość jest szczęściem, nienawiść – męką. Istotą wszystkich praw i wszelkich słów głoszonych przez proroków są dwa przykazania: całym sercem miłuj Pana swego i kochaj bliźniego jak siebie samego.\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Agapēseis tòn Plēsíon – tło historyczne','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "Umiłowanie bliźniego nierozerwalnie wiąże się z umiłowaniem Boga. Kto dokonuje aktów miłosierdzia i łaski, w całości wypełnia boskie prawo.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Umiłowanie bliźniego – tło historyczne','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "Przykazanie umiłowania bliźniego stanowi rdzeń etyki chrześcijańskiej; czerpie z Księgi Kapłańskiej 19:18 i zostało wyniesione przez Chrystusa na równi z umiłowaniem Boga jako zwieńczenie całego prawa bożego. Najstarsi ojcowie Kościoła, tacy jak Klemens Aleksandryjski i Jan Chryzostom, podkreślali, że prawdziwa miłość nie ogranicza się do rodziny i przyjaciół: twierdzili, że należy miłować całą ludzkość, w tym nieznajomych i wrogów. W średniowieczu nauki te przyczyniły się do powstawania chrześcijańskich instytucji charytatywnych i szpitali, a także do popularyzacji jałmużnictwa."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "[counties|E] wyznające tę [Concept('faith', 'wiarę')|E] ze wskaźnikiem [Concept('county_opinion', 'powszechnej opinii')|E] na poziomie co najmniej #P 60#! pkt mogą otrzymać [modifier|El] „[GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]”"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "[buildings|E], które są hospicjami, zmniejszają [travel_danger|El] w [Concept('county', 'hrabstwie')|E] o od #P 3#! do #P 10#! pkt, a wartość ta jest większa z każdym poziomem"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "[buildings|E], które są hospicjami, zapewniają od #P 2#! do #P 10#! pkt [Concept('epidemic_resistance', 'przeciwdziałania zarazie')|E] w danej [Concept('province', 'prowincji')|E], a wartość ta jest większa z każdym poziomem"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "[scheme_success_chance|E] „[GetScheme('sway').GetTypeName]” przeciwko [Concept('characters', 'postaciom')|E] spoza twojego [Concept('realm', 'państwa')|E]: [success_chance_i] #P +20%#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "Akceptacja interakcji „#high $offer_vassalization_interaction$#!”: #P +15#!"
 tenet_love_thy_neighbour_boon_reason: "Dogmat „$tenet_love_thy_neighbour_name$”: $VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "Umiłowanie bliźniego nierozerwalnie wiąże się z umiłowaniem Boga. Kto dokonuje aktów miłosierdzia i łaski, wypełnia boskie prawo."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "Divinum Officium" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "Theía Leitourgía" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "Boska Liturgia"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "Liturgia święta pozwala nam zjednoczyć się z niebem tu, na ziemi. Wraz z aniołami i świętymi trwamy w wiecznym uwielbieniu Pana. Święty, Święty, Święty Pan Bóg Zastępów, a cała ziemia pełna jest Jego chwały.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Divinum Officium – tło historyczne','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "Podczas Boskiej Liturgii wierni oddają cześć Bogu, przemierzając przestrzeń i czas, by u boku cherubinów i serafinów stanąć przed Jego tronem.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Theía Leitourgía – tło historyczne','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "Liturgia to podstawowy wyraz wiary; spotkanie niebios i świata ziemskiego, które pozwala wiernym oddawać się wiecznemu uwielbieniu Pana wraz z aniołami i świętymi.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Boska Liturgia – tło historyczne','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "Boska Liturgia wywodzi się z najstarszych chrześcijańskich posług duszpasterskich. We wschodnim odłamie chrześcijaństwa standardowymi formami stały się Boskie Liturgie św. Bazylego Wielkiego i św. Jana Chryzostoma stawiające w centrum mistyczny udział wiernych w niebiańskim uwielbieniu. Liturgie te przybierały formę złożonych ceremonii, które za sprawą kadzideł, ikon i śpiewu pozwalały na zmysłowe doświadczenie boskości. Liturgia nie była jedynie oddawaniem czci Bogu przez człowieka: otwierała wiernym drzwi do wiecznego uwielbienia wykraczającego poza granice czasu i przestrzeni."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "Zapewnia modyfikator „[GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]”"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "Zapewnia modyfikator „[GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]”\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "Twój [court_chaplain|El] zyskuje #P 2#! pkt umiejętności [Concept('learning', 'nauki')|E]"
 tenet_aniconism_latin_name: "Iconomachia" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "Tyś jeden, nasz Panie, godny jest chwały. Chroń nas przed kultem bałwochwalczym; pozwól nam wielbić Cię w duchu i prawdzie, i czyste serca wznosić ku Tobie – nie zaś ku ludzkich rąk dziełu.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Iconomachia – tło historyczne','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "Oddawanie czci wizerunkom nie znajduje uzasadnienia ani w Piśmie Świętym, ani w tradycji Ojców. Prawdziwą nauką Kościoła jest obrazoburstwo, które odwodzi wiernych od bałwochwalczego czczenia wizerunków.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Eikonomakhía – tło historyczne','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "Nie będziesz czynił sobie żadnych posągów i podobizn. Ten, kto oddaje cześć wizerunkom, wypacza prawdziwą wiarę.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Anikonizm – tło historyczne','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "Unikanie, zakazywanie i niszczenie wizerunków religijnych jest głęboko zakorzenione w tradycjach abrahamicznych. Kulminacja tych praktyk w świecie chrześcijańskim przypadła na okres pierwszego ikonoklazmu w Bizancjum (726–843 r.), w którym dominował trend powszechnego niszczenia wizerunków świętych i potępiania ikon zapoczątkowany przez cesarza Leona III i kontynuowany przez Konstantyna V.\n\nWedług obrazoburców kult ikon stanowił pogwałcenie biblijnego zakazu czynienia podobizn. W 787 roku, na drugim soborze nicejskim, ikonoklazm skrytykowano, wskazując na podobieństwo między kultem ikon a sławieniem Boga w tekstach ewangelii; ruch odrodził się jednak w roku 814 pod skrzydłami Leona V. Podobne nieprzychylne wizerunkom tendencje pojawiały się później w różnych odłamach protestanckich."
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "O Chryste, mądrości boża nieskończona, oświeć nasze umysły i pozwól odkryć to, co w Piśmie Świętym skryte. Obdarz nas wzrokiem, co sięga za litery – pomóż dojrzeć życiodajną duszę.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Catechesis Alexandrina – tło historyczne','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "Według tradycji aleksandryjskiej boską mądrość ukazują alegoryczne interpretacje Pisma Świętego. Chrystus to Logos – Słowo Boże, w którym objawia się cała prawda.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Alexandrinē Katēkhēsis – tło historyczne','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "Nauki aleksandryjskie są skoncentrowane na alegorycznych interpretacjach Pisma Świętego i syntezie teologii chrześcijańskiej z filozofią grecką, zachęcając do poszukiwania głębszego przekazu duchowego poza dosłownie rozumianym tekstem.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Katechizm aleksandryjski – tło historyczne','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "Powstała u schyłku II wieku szkoła aleksandryjska była pierwszą chrześcijańską instytucją oferującą wykształcenie wyższe. Pod okiem nauczycieli takich jak Klemens Aleksandryjski i Orygenes wypracowano w niej złożoną metodę interpretowania Biblii, która koncentrowała się na poszukiwaniu alegorycznych i duchowych znaczeń w Piśmie Świętym. Szkoła łączyła teologię chrześcijańską z filozofią Platona; jej przedstawiciele uważali, że nauki greckie dały podwaliny ewangelii.\n\nSpekulacje teologiczne i egzegetyczne metody Orygenesa wywarły ogromny wpływ na wschodni odłam chrześcijaństwa; nacisk na alegoryczne rozumienie Pisma kontrastował jednak z bardziej dosłownym podejściem praktykowanym w szkole antiocheńskiej."
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "Filius Adoptivus" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "Adopcjanizm"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "Ojcze – Ty, który popatrzyłeś na sprawiedliwego Jezusa i wziąłeś Go za Syna – uczyń i nas godnymi przybrania za dzieci. Jak Jego wyłoniłeś z wód i ogłosiłeś swym umiłowanym, tak nas wydobądź z nędzy i przyjmij do Rodziny Bożej.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Filius Adoptivus – tło historyczne','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "Bądź pochwalony, Boże – Ty, który wynosisz pokornych i wybierasz prawych – za tajemnicę filiacji bożej. Jako Chrystusa w swej łasce uczyniłeś Synem, tak i nas przyjmij za swoje dzieci.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Hyiothesía – tło historyczne','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "Pomóż nam, Panie, pojąć tajemnicę wyniesienia Twego Syna; kieruj nas słuszną Jego drogą, abyśmy i my stać się mogli dziećmi Boga.\n\n$pam_mark_1_11_default$\n\n[Glossary('Adopcjanizm – tło historyczne','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "Adopcjaniści utrzymywali, że Jezus urodził się jako zwyczajny człowiek i dopiero później został „adoptowany” przez Boga – według większości koncepcji podczas chrztu, gdy zstąpił na niego Duch Święty. Adopcjanizm we wczesnej formie wyłonił się w II wieku za sprawą Teodota z Bizancjum, który nauczał o dynamicznym monarchianizmie, podkreślając jedność osoby boskiej.\n\nNauki te ponownie zyskały popularność w VIII wieku w Hiszpanii, głoszone wówczas przez arcybiskupa Elipandusa z Toledo i biskupa Feliksa z Urgell, którzy traktowali odrębnie istniejącą od zawsze boską naturę Chrystusa i jego człowieczeństwo jako przybranego syna. Choć na synodzie we Frankfurcie w 794 roku adopcjanizm hiszpański okrzyknięto herezją, koncepcje adopcjanistów – mimo ich potępienia – wywarły wpływ na późniejsze ruchy antytrynitarystyczne."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "[interaction|E] „[Concept('adopt', 'Adoptuj')|E]” jest zawsze dostępna, bez zwykłych wymogów (choć jej cel wciąż musi się kwalifikować, a podległy współmałżonek nie może dokonać adopcji)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "[vassals|E] i dzieci praktykujące ten [rite|El] nie mają nic przeciwko [Concept('adopt', 'adopcji')|E] (uniknięto straty od #N 10#! do #N 25#! punktów [Concept('opinion', 'opinii')|E])"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "[interaction|E] „[Concept('adopt', 'Adoptuj')|E]” jest zawsze dostępna dla ciebie, bez zwykłych wymogów (choć jej cel wciąż musi się kwalifikować)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "@legitimacy_icon! [legitimacy|E], @piety_icon! [piety|El] i @spiritual_fulfillment_icon! [spiritual_fulfillment|El] przy [Concept('adopt', 'adoptowaniu')|E] [Concept('character', 'postaci')|E]"
 pam_adoptionism_adopt_sp_toast: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] (dogmat osobisty)"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "[interaction|E] „[Concept('legitimized_bastard', 'Legitymizuj bękarta')|E]” kosztuje o #P 50%#! mniej @prestige_icon! [Concept('prestige', 'prestiżu')|E], o ile twoja [faith|El] zezwala na nią"
