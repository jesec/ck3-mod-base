 pam_genesis_1_28_greek: "[Glossary('Kaì eulógēsen autoùs ho Theós, légōn; auxánesthe kaì plēthýnesthe kaì plērosate ten gen kaì katakyrieúsate autes kaì árkhete ton ikhthýōn tes thalássēs kaì ton peteinon toũ ouranoũ kaì pántōn ton ktēnon kaì pásēs tes ges kaì pántōn ton herpeton ton herpóntōn epì tes ges.','GENESIS_1_28_GREEK_GLOSS')]" #καὶ εὐλόγησεν αὐτοὺς ὁ Θεός, λέγων· αὐξάνεσθε καὶ πληθύνεσθε καὶ πληρώσατε τὴν γῆν καὶ κατακυριεύσατε αὐτῆς καὶ ἄρχετε τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ πάντων τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς.
 pam_matthew_19_5_greek: "[Glossary('Kaì eĩpen; héneka toútou kataleípsei ánthrōpos tòn patéra kaì ten mētéra kaì kollēthesetai te gynaikì autoũ, kaì ésontai hoi dýo eis sárka mían', 'MATTHEW_19_5_GREEK_GLOSS')]" #καὶ εἶπεν· ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν
 pam_ephesians_4_3_6_greek: "[Glossary('Spoudázontes tēreĩn ten henótēta toũ pneúmatos en to syndésmõi tẽs eirénēs. Hen sõma kaì hen pneũma, kathos kaì eklethēte en mia elpidi tẽs kléseōs hymõn. Heĩs kýrios, mía pístis, hen báptisma. Heĩs theòs kaì pater pántōn, ho epì pántōn kaì dià pántōn kaì en pãsin.', 'EPHESIANS_4_3_6_GREEK_GLOSS')]" #σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης· ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν· εἷς κύριος, μία πίστις, ἓν βάπτισμα· εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν πᾶσιν.
 pam_ephesians_5_25_greek: "[Glossary('Hoi ándres, agapãte tàs gynaĩkas, kathos kaì ho Christòs ēgάpēsen ten ekklēsían kaì heautòn parédōken hypèr autẽs', 'EPHESIANS_5_25_GREEK_GLOSS')]" #Οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς
 pam_matthew_16_18_greek: "[Glossary('Kago dé soi légō hóti sỳ eĩ Pétros, kaì epì taúte te pétra oikodomesō mou ten ekklēsían kaì pýlai hadou ou katischýsousin autẽs.', 'MATTHEW_16_18_GREEK_GLOSS')]" #κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς.
