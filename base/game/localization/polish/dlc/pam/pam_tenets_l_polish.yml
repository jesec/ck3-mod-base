 tenet_khachkar_default_name: "Chaczkary"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "Chaczkary są wiecznymi świadkami naszej wiary. Każda z ozdobionych wyrzeźbionymi krzyżami, winoroślami i świętymi symbolami stel zawiera wyrytą w kamieniu modlitwę ku chwale krzyża, dzięki któremu świat otrzymał zbawienie.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Chaczkary – tło historyczne','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "I my – jak Ormianie wznoszą ku niebu krzyże z kamienia – naznaczmy ten świat krzyżem Pana naszego Jezusa Chrystusa, symbolem zbawienia.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Crux Lapidea – tło historyczne','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "Kamienne posągi z rzeźbieniami świętych symboli są świadectwem tryumfu Chrystusa i wiecznymi pomnikami dla wiernych.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Líthinos Staurós – tło historyczne','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "Kamienne krzyże wyrzeźbione z misternymi symbolami religijnymi pełnią funkcję uświęconych pomników wyznaczających miejsca święte, upamiętniając zmarłych i wysławiając boską opatrzność.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Chaczkary – tło historyczne','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "Chaczkary – od ormiańskiego #weak khach#! (krzyż) i #weak k’ar#! (kamień) – to misternie rzeźbione kamienne stele przedstawiające krzyż, często umieszczony na rozecie lub kole wieczności. Te charakterystyczne dla ormiańskiej kultury chrześcijańskiej pomniki wyznaczają święte miejsca, upamiętniają istotne wydarzenia i zwycięstwa oraz służą jako tablice pamiątkowe na cześć zmarłych.\n\nTradycja ta wywodzi się z IX wieku, kiedy to św. Grzegorz Oświeciciel i jego następcy wznosili drewniane krzyże w zniszczonych pogańskich świątyniach po armeńskim nawróceniu w 301 roku n.e., a szczyt popularności osiągnęła w XII–XIII wieku pod rządami ormiańskich książąt z rodu Zakarydów. Każdy chaczkar, będący dziełem mistrzów rzeźbiarstwa, do których zalicza się Momik z Norawanku, jest wyjątkowy, a niektórym przypisywano cudowne moce, dzięki czemu stawały się celami pielgrzymek."
