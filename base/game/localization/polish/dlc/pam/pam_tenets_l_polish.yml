 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "Cáin Adomnáin" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "Pax et Treuga Dei" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "Ekekheiría Theoũ" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "Pokój Boży"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "Dogmat, znany także jako „Prawo niewinnych”, ustanawia zasady gwarantujące bezpieczeństwo osób nieuczestniczących w walce. Ci, którzy go naruszają, oraz świadkowie, którzy nie podjęli żadnych działań, by zapobiec występkowi, karani byli grzywnami zgodnie z prawem świeckim i nakładano na nich rytualne klątwy.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Cáin Adomnáin – tło historyczne','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "Zawieszenie broni należy bezwzględnie respektować od Adwentu aż do oktawy Objawienia Pańskiego. Ktokolwiek ośmieli się złamać ten święty czas pokoju, powinien zostać obłożony ekskomuniką przez swego biskupa.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Pax et Treuga Dei – tło historyczne','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "Uczniowie Chrystusa, który wszystko uczynił dla pokoju, winni być twórcami zgody między ludźmi. Kto szuka pokoju, ten szuka samego Chrystusa. A kto nie miłuje bliźnich i nie niesie pokoju wszystkim, których spotyka, nie może być nazwany prawdziwym sługą Pańskim.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Ekekheiría Theoũ – tło historyczne','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "Bezsensowna przemoc wymierzona w naszych braci i siostry jest zniewagą wobec samego Boga.\n\n[Glossary('Pokój Boży – tło historyczne','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "W średniowieczu liczne ruchy chrześcijańskie dążyły do ograniczania rozlewu krwi poprzez ustanawianie formalnych zasad postępowania. Od irlandzkiego Cáin Adomnáin z VII wieku po ruch Pokoju Bożego we Francji w X wieku inicjatywy te skupiały się na ochronie dóbr i osób kościelnych, na ograniczeniu przemocy wobec ludności cywilnej oraz na wyznaczaniu szlachcie określonych czasów i miejsc, w których wolno było prowadzić działania zbrojne.\n\nNiejednokrotnie zasady te stosowano również wobec niewierzących. Kanon XXI III soboru laterańskiego z 1179 roku rozszerzył okresowe rozejmy na całe chrześcijaństwo, zaś kanon XXVII wzywał do zbrojnego wystąpienia przeciwko katarom, Baskom i innym heretykom."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Wypowiedzenie [Concept('war', 'wojny')|E] [Concept('ruler', 'władcy')|E] wyznającemu tę samą [Concept('faith', 'wiarę')|E] będzie kosztować punkty @piety_icon! [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "[rulers|E] posiadający cechę [GetTrait('zealous').GetName( GetNullCharacter )|l] są mniej skłonni do wypowiedzenia [Concept('war', 'wojny')|E] tym, którzy wyznają tę samą [Concept('faith', 'wiarę')|E]"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "[rulers|E] praktykujący ten [rite|El] znacznie rzadziej reagują na [Concept('interaction', 'interakcję')|E] #high „$ecclesiastic_incite_holy_war_interaction$”#!"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "[interaction|E] #high „$purchase_truce_interaction$”#! kosztuje #P 50%#! mniej i jest chętniej akceptowana"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "Nie można zorganizować [Concept('raid', 'najazdu')|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "Za każde #V 5 lat#! [Concept('peace', 'pokoju')|E] [rulers|El] otrzymują nagrodę, najczęściej @legitimacy_icon! [Concept('legitimacy', 'legitymację')|E]"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "Każde #V 5 lat#! [Concept('peace', 'pokoju')|E] zapewnia #P 1#! pkt losowej [Concept('skill', 'umiejętności')|E]"
 doctrine_parameter_tenet_peace_of_god_excommunication: "Główni obrońcy nie ponoszą kosztu w @piety_icon! [Concept('piety', 'pobożności')|E] za [Concept('excommunicate', 'ekskomunikowanie')|E] atakujących wyznających tę samą [Concept('faith', 'wiarę')|E]"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "Złamanie [Concept('truce', 'rozejmu')|E] w obrębie własnej [Concept('faith', 'wiary')|E] sprowadza natychmiastową [Concept('excommunication', 'ekskomunikę')|E]"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "[clergy|E] znacznie chętniej rozstrzyga spory o ziemię i tytuły, pobierając o #P 25%#! mniej @gold_icon! [Concept('gold', 'złota')|E], punktów @piety_icon! [Concept('piety', 'pobożności')|E] i @prestige_icon! [Concept('prestige', 'prestiżu')|E]"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: odczuwasz spokój"
 # Dulia tenet
 tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
 tenet_dulia_default_name: "Kult świętych"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "Ci, którzy obrali Pana za swoją skałę, winni być otaczani czcią. Święte jest ich wieczne ciało, święte są ich relikwie i święta jest pamięć o nich.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Dulia – tło historyczne','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "Kościół oddaje cześć tym, którzy wykazali się niezwykłym oddaniem Bogu, od kapłanów męczenników i niewiast towarzyszących Chrystusowi po jego błaznów, obdarzając ich zaszczytnym tytułem i wyznaczając im własny dzień w kalendarzu liturgicznym.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Hagiokatátaxis – tło historyczne','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "Niech wszyscy, którzy szukają wstawiennictwa świętych, zwracają się do nich z należnym szacunkiem i pobożnością.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Kult świętych – tło historyczne','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "We wczesnym chrześcijaństwie czczono męczenników, czyli tych, którzy przelali krew za wiarę, a ich relikwie przechowywano jako przedmioty święte. Od IV wieku czcią otaczano również spowiedników, którzy wyznawali swoją wiarę nie poprzez śmierć, lecz poprzez słowa i życie.\n\nPoczątkowo ich świętość potwierdzał miejscowy biskup po zbadaniu ich życia i dokonanych cudów. Święty Udalryk, biskup Augsburga, którego świętość potwierdził papież Jan XV w roku 993, był pierwszym świętym spoza Rzymu kanonizowanym przez papieża. Dekret papieża Aleksandra III z 1170 roku przyznał papieżowi wyłączne prawo kanonizacji."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[decisions|E] „[GetDecisionWithKey('pam_canonize_saint_decision').GetName]” i „[GetDecisionWithKey('pam_extract_relic_decision').GetName]” kosztują o #P 15%#! mniej @gold_icon! [Concept('gold', 'złota')|E] i punktów @piety_icon! [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[artifacts|E] pozyskane dzięki podjęciu [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('pam_extract_relic_decision').GetName]” zapewniają #P 1#! dodatkowe losowe błogosławieństwo"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "[decision|E] „[GetDecisionWithKey('pam_extract_relic_decision').GetName]” podjęta względem członka [Concept('dynasty', 'dynastii')|E] zapewnia #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! pkt [Concept('dynasty_prestige', 'renomy')|E]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Kanonizacja świętego zapewnia każdemu [Concept('ruler', 'władcy')|E] wyznającemu wiarę, w której do niej doszło, modyfikator „$pam_dulia_new_saint_modifier$” na #EMP 5 lat#!"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "Przeistoczenie"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "W sakramencie Eucharystii konsekracja chleba nie prowadzi do nicości, lecz do przemiany w ciało Chrystusa. W przeciwnym razie nie sposób byłoby wyjaśnić, jak ciało Pańskie zaczyna istnieć pod postacią sakramentu. Nie staje się ono tam obecne poprzez przemieszczenie w przestrzeni, gdyż w takim wypadku przestałoby istnieć w niebie.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Transubstantiatio – tło historyczne','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "On zaś jest obecny prawdziwie i rzeczywiście, tak iż po konsekracji chleba i wina chleb zostaje przemieniony, przeistoczony i przekształcony w prawdziwe ciało Pana.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Metousíōsis – tło historyczne','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "Przed konsekracją nosi inną nazwę, po niej nazywa się krwią. A gdy wypowiadacie „Amen”, to oznacza „To jest prawda”.\n\n$pam_luke_22_19_default$\n\n[Glossary('Przeistoczenie – tło historyczne','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "Natura obecności Chrystusa w Eucharystii stanowi przedmiot teologicznych sporów od samych początków Kościoła. Choć boskość chleba i wina jako ciała i krwi Chrystusa rzadko była kwestionowana, to ich dokładna natura stała się źródłem licznych debat, sporów i schizm. Katolicką wykładnię rozwinął w XIII wieku Tomasz z Akwinu, a IV sobór laterański w 1215 roku nadał jej ostateczną formę. Podczas mszy świętej substancja chleba i wina przemienia się w substancję ciała i krwi Chrystusa, podczas gdy ich widzialna postać pozostaje niezmieniona."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Szybkość [Concept('fabricate_claim', 'fabrykowania roszczenia do hrabstwa')|E]: #p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "Ora et labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "Praca jest modlitwą"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "Bądź posłuszny swemu przełożonemu. Trwaj cierpliwie w obliczu trudności. Podejmuj się najpodlejszych zadań i uważaj się za nędznego sługę.\n#weak Rozdział VII „Reguły” św. Benedykta#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Ora et labora – tło historyczne','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "Mnisi winni dniem i nocą odprawiać nabożeństwa. Ich nieustające chóry i nieprzerwane psalmy niosą chwałę ich zakonowi i samemu Bogu.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Akoímētoi – tło historyczne','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "Modlitwa jest pracą, a praca modlitwą. Bezczynność jest bowiem wrogiem duszy, a pracowitość winna cechować zarówno myśli, jak i czyny.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('Praca jest modlitwą – tło historyczne','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "Wywodzące się z „Reguły” św. Benedykta motto #weak Ora et labora#! uosabia klasztorny ideał modlitwy i pracy. Od mnichów oczekiwano, że określone pory dnia będą poświęcać na wspólną modlitwę, osobistą medytację oraz pracę fizyczną. Taka równowaga uchodziła za niezbędną dla rozwoju duchowego i zachowania dyscypliny. Klasztory benedyktyńskie stały się dzięki temu ośrodkami nauki, rolnictwa i rzemiosła, wnosząc znaczący wkład w życie kulturalne i gospodarcze średniowiecznej Europy."
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "Theotókos" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "Matka Boża"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "W twoim miłosierdziu szukamy schronienia. Nie odrzucaj naszych próśb w trudnych chwilach, lecz wybaw nas od niebezpieczeństw, jedyna czysta i błogosławiona.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Hyperdulia – tło historyczne','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "Przyjmij nasze modlitwy i zanieś je przed oblicze swego syna i naszego Boga, aby przez wzgląd na ciebie oświecił i zbawił dusze nasze. Najświętsza Bogurodzico, ocal nas.\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Theotókos – tło historyczne','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "Najświętsza Maryja Panna, Matka Boża, Matka Miłosierdzia, Madonna.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Matka Boża – tło historyczne','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "Od pierwszych dni chrześcijaństwa Maryja, matka Jezusa, otaczana była wyjątkową czcią i szacunkiem. Sobór efeski w 431 roku potwierdził jej tytuł „Theotokos”, #weak Matki Bożej#!, odrzucając nestoriańskie określenie „Christotokos”, #weak Matka Chrystusa#!. W VIII wieku św. Jan Damasceński nauczał, że Maryja została wywyższona ponad wszystkich świętych ze względu na swoją wyjątkową rolę w historii zbawienia. Na przestrzeni wieków Kościoły chrześcijańskie rozwijały i definiowały różne doktryny maryjne, takie jak niepokalane poczęcie czy wniebowzięcie."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "[claims|E] kobiet nie tracą już na znaczeniu przez [gender_laws|El]"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Odblokowuje [laws|El] sukcesji: „[GetLaw('female_preference_law').GetName]”"
 # Simony tenet
 tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
 tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
