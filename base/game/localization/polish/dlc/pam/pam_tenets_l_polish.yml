 pam_luke_1_42_english: "Błogosławionaś Ty między niewiastami i błogosławiony owoc żywota Twojego."
 pam_luke_1_79_english: "Aby zajaśnieć nad tymi, co w mroku i cieniu śmierci przebywają, i skierować nasze kroki na drogę pokoju."
 pam_colossians_3_15_english: "Niech pokój Chrystusa panuje w waszych sercach, bo do takiej jedności zostaliście powołani jako jedno ciało. Trwajcie też we wdzięczności."
 pam_matthew_5_9_english: "Błogosławieni ci, którzy niosą pokój, albowiem synami Bożymi zostaną nazwani."
 pam_philippians_4_21_english: "Pozdrówcie wszystkich świętych w Chrystusie Jezusie. Pozdrawiają was bracia i siostry, którzy są ze mną."
 pam_hebrews_12_1_english: "Skoro otacza nas tak liczne grono świadków, odrzućmy wszystko, co nas obciąża, zwłaszcza grzech, który tak łatwo nas zwodzi, i biegnijmy wytrwale w wyścigu, jaki został nam wyznaczony."
 pam_acts_7_59_english: "Gdy kamienowali Szczepana, modlił się: „Panie Jezu, przyjmij ducha mego”."
 pam_luke_22_19_english: "Wziął chleb, podziękował, połamał go i podał, mówiąc: „To jest ciało moje, które za was będzie wydane. To czyńcie na moją pamiątkę”."
 pam_1_corinthians_1_10_english: "Dlatego proszę was, bracia, w imię naszego Pana Jezusa Chrystusa, aby panowała między wami zgoda, #bold by nie rodziły się podziały#!, lecz byście trwali w jedności myśli i ducha."
 pam_1_corinthians_10_16_english: "Kielich, nad którym wypowiadamy błogosławieństwo, jest przecież udziałem we krwi Chrystusa; a chleb, który łamiemy, włącza nas w jego ciało."
 pam_1_corinthians_10_17_english: "Ponieważ jeden jest chleb, my, choć liczni, tworzymy jedno ciało, jeden bowiem chleb spożywamy."
 pam_john_6_41_english: "A Żydzi zaczęli go krytykować, bo powiedział: „Jam jest chleb, który zstąpił z nieba”."
 pam_1_thessalonians_5_16_20_english: "Zawsze się radujcie, nie ustawajcie w modlitwie; w każdej sytuacji okazujcie wdzięczność – taką wolę wobec was wyraża Bóg w Chrystusie. Ducha nie tłamście i nie odrzucajcie daru proroctwa."
 pam_1_thessalonians_4_11_english: "Zachęcam was więc, byście żyli w spokoju, troszczyli się o własne sprawy i pracowali własnymi rękami, tak jak wam poleciliśmy."
 pam_proverbs_6_6_english: "Do mrówki tedy się udaj, leniwcze, drogi jej rozważaj, abyś rozumu nabrał."
 pam_john_19_26_27_english: "Gdy Jezus zobaczył swoją matkę i swego umiłowanego ucznia stojącego obok, powiedział do niej: „Niewiasto, oto syn twój”. Następnie zwrócił się do ucznia: „Oto matka twoja”. Od tej chwili uczeń wziął ją do siebie."
 pam_isaiah_7_14_english: "Pan zatem sam da wam znak: oto niewiasta pocznie i urodzi syna, i nada mu imię Emmanuel."
 pam_proverbs_31_20_english: "Dłoń swą otwiera przed ubogim, ku nędzarzowi wyciąga ramiona."
 pam_revelation_12_1_english: "I ukazał się na niebie potężny znak: niewiasta spowita blaskiem słońca, z księżycem u stóp i koroną z dwunastu gwiazd na skroniach."
 pam_acts_8_18_english: "Gdy Szymon zobaczył, że przez nałożenie rąk Apostołowie udzielają Ducha Świętego, zaproponował im zapłatę."
 pam_proverbs_21_20_english: "W domu męża roztropnego znajdziesz cenny skarb i oliwę, a głupiec trwoni je bez miary."
 pam_luke_16_11_english: "Skoro nie byliście wierni w zarządzaniu niesprawiedliwym bogactwem, któż powierzy wam prawdziwe dobra?"
 pam_john_10_30_english: "Ja i Ojciec stanowimy jedność."
 pam_john_1_1_english: "Na początku było słowo, i to słowo było u Boga i Bogiem było."
 pam_hebrews_1_3_english: "Syn ten, będący blaskiem chwały Boga i wiernym odbiciem jego istoty, mocą swego słowa podtrzymuje wszystko, a gdy dokonał oczyszczenia ludzi z grzechów, zasiadł po prawicy najwyższego majestatu."
 pam_acts_1_8_english: "A kiedy zstąpi na was Duch Święty, otrzymacie jego moc i staniecie się moimi świadkami w Jerozolimie, w całej Judei i Samarii, aż po najdalsze krańce ziemi."
 pam_acts_2_4_english: "I wszyscy zostali napełnieni Duchem Świętym i zaczęli przemawiać w różnych językach, tak jak Duch im to umożliwiał."
 pam_acts_2_38_english: "I Piotr rzekł do nich „Pokutujcie i bądźcie ochrzczeni w imię Jezusa Chrystusa, aby grzechy wasze zostały przebaczone, a otrzymacie dar Ducha Świętego.”"
 pam_2_macabees_12_44_english: "Gdyby bowiem nie wierzył, że zmarli powstaną z martwych, modlitwa za nich nie miałaby żadnego sensu i byłaby niedorzecznością."
 pam_matthew_12_25_english: "Każde królestwo skłócone samo ze sobą pustoszeje, a żadne miasto ani żaden dom skłócone same ze sobą nie ostoją się."
 pam_matthew_12_32_english: "Kto wypowie słowo przeciw synowi człowieczemu, zyska przebaczenie; lecz kto sprzeciwi się Duchowi Świętemu, temu nie będzie odpuszczone ani teraz, ani w przyszłości."
 pam_hebrews_12_29_english: "Albowiem nasz Bóg jest ogniem trawiącym."
 pam_genesis_1_28_english: "I pobłogosławił ich Bóg, mówiąc: „Bądźcie płodni i rozmnażajcie się, zapełnijcie ziemię i podporządkujcie ją sobie; panujcie nad rybami morskimi, nad ptactwem powietrznym i nad każdym żywym stworzeniem, które porusza się po ziemi”."
 pam_matthew_19_5_english: "Dlatego mężczyzna opuszcza dom ojca i matki, jednoczy się ze swoją żoną i oboje stają się jednym ciałem."
 pam_ephesians_4_3_6_english: "Starajcie się z całych sił zachować jedność Ducha dzięki więzi pokoju. Jedno jest bowiem ciało i jeden Duch, jedna jest też nadzieja, do której zostaliście powołani. Jeden jest Pan, jedna wiara, jeden chrzest."
 pam_ephesians_5_25_english: "Mężowie, miłujcie żony wasze, albowiem Chrystus sam umiłował kościół i samego siebie zań ofiarował."
 pam_matthew_16_18_english: "Dlatego powiadam ci: ty jesteś Piotr, Skała, i na tej skale wzniosę mój kościół, a moce piekieł nie zdołają go pokonać."
 pam_2_timothy_2_2_english: "To, co słyszysz ode mnie wobec wielu świadków, powierz ludziom godnym zaufania, którzy będą potrafili przekazać tę naukę dalej."
 pam_titus_1_5_english: "Zostawiłem cię na Krecie po to, abyś dokończył to, co jeszcze wymaga uporządkowania, i ustanowił w każdym mieście prezbiterów, tak jak ci poleciłem."
 pam_james_5_16_english: "Wyznawajcie więc sobie nawzajem winy i módlcie się jedni za drugich, aby przyszło uzdrowienie, bowiem modlitwa człowieka prawego ma wielką moc."
 pam_1_john_1_9_english: "Jeśli wyznamy nasze winy, wierny i sprawiedliwy Bóg odpuści je nam i oczyści nas z wszelkiego zła."
 pam_john_20_23_english: "Którym odpuścicie grzechy, są im odpuszczone; którym zatrzymacie, są im zatrzymane."
 pam_romans_5_12_english: "Dlatego – tak jak przez jednego człowieka grzech wszedł na świat, a wraz z nim śmierć – tak też śmierć ogarnęła wszystkich, bo każdy człowiek zgrzeszył."
 pam_psalm_51_5_english: "Zrodziła mnie matka w przewinieniu i w grzechu poczęła."
 pam_genesis_3_6_english: "Kobieta zauważyła, że owoce drzewa są dobre do jedzenia, piękne dla oka i obiecują mądrość. Sięgnęła więc po jeden, zjadła, a potem podała go mężowi, który był przy niej, i on również go spożył."
 # Celestial Hierarchy Tenet
 pam_hebrews_1_14_english: "Czyż nie są to anioły posłane do służby, by wspierać tych, którzy mają otrzymać zbawienie?"
 pam_psalm_91_11_english: "Aniołom swym wydał rozkaz, by cię strzegły, dokądkolwiek się udasz."
 pam_matthew_18_10_english: "Uważajcie więc, by nie lekceważyć żadnego z tych najmniejszych. Zapewniam was, że ich aniołowie w niebie nieustannie patrzą na oblicze Ojca mego."
 # Miles Christi Tenet
 pam_ephesians_6_11_english: "Przywdziejcie tedy zbroję Bożą, abyście ostać się mogli przeciw zdradliwym knowaniom czarta."
 pam_2_timothy_2_3_english: "Znoś trudy i przeciwności jako wierny żołnierz Chrystusa Jezusa."
 pam_1_timothy_6_12_english: "Tocz bój szlachetny o wiarę i zyskaj życie wieczne. Do tego bowiem cię wezwano i o tym mówi świadectwo twoje złożone wobec wielu świadków."
 # Scholasticism Tenet
 pam_proverbs_1_7_english: "Źródłem wiedzy wszelkiej jest bojaźń Pańska, i głupcy tylko gardzą mądrością i pouczeniem."
 pam_colossians_2_3_english: "W nim skryte są wszelkie skarby mądrości i poznania."
 pam_james_1_5_english: "A jeśli komuś spośród was brak mądrości, niech zwróci się do Boga, który obdarza wszystkich hojnie i bez niechęci, a z pewnością ją otrzyma."
 # Alexandrian Catechism Tenet
 pam_1_corinthians_1_30_english: "To dzięki niemu trwacie w Chrystusie Jezusie, który stał się dla nas Bożą mądrością, a także źródłem sprawiedliwości, uświęcenia i odkupienia."
 # Adoptionism Tenet
 pam_mark_1_11_english: "I głos z niebios zabrzmiał: „Tyś jest mój syn umiłowany, w tobie mam upodobanie”."
 pam_romans_1_4_english: "Jezus Chrystus, nasz Pan, przez swoje zmartwychwstanie mocą Ducha Świętego został uznany za Syna Bożego."
 pam_acts_13_33_english: "Wskrzeszając Jezusa, Bóg wypełnił daną obietnicę nam, dzieciom swoim. Dlatego w drugim psalmie czytamy: „Tyś jest moim Synem, dziś cię zrodziłem”."
 # Love Thy Neighbour Tenet
 pam_matthew_22_39_english: "Drugie jest podobne: będziesz miłował bliźniego swego jak siebie samego."
 pam_luke_10_27_english: "Rzekł: „Będziesz miłował Pana Boga twego z całego serca swego, z całej duszy swojej i ze wszystkich myśli swoich, a bliźniego swego, jak siebie samego”."
 pam_galatians_5_14_english: "Całe prawo sprowadzi się do tego jednego nakazu: będziesz miłował bliźniego swego jak siebie samego."
 # Divine Liturgy Tenet
 pam_isaiah_6_3_english: "I wołał jeden do drugiego: „Święty, Święty, Święty, Pan Bóg Zastępów. Pełne są niebiosa i ziemia chwały Twojej”."
 pam_psalm_134_2_english: "Wznieście ręce ku miejscu świętemu i błogosławcie Pana."
 pam_malachi_1_11_english: "„Od wschodu aż po zachód słońca moje imię będzie sławione pośród narodów, a w każdym miejscu składać mi będą kadzidło i ofiarę czystą, bo wielkie jest moje imię pośród narodów” – rzekł Pan Zastępów."
 # Aniconism Tenet
 pam_exodus_20_4_english: "Nie będziesz robić sobie bożka z podobizny niczego, co jest w niebiosach, na ziemi, czy w wodach pod ziemią."
 # Armed Pilgrimages Tenet
 pam_matthew_16_24_english: "Wtedy Jezus powiedział do uczniów: „Jeśli ktoś pragnie iść za mną, niech wyrzeknie się siebie, podejmie swój krzyż i podąża moimi śladami”."
 # Communal Identity Tenet
 pam_1_peter_2_9_english: "Wy zaś jesteście ludem wybranym, królewskim kapłaństwem, narodem świętym, ludem należącym do Boga, abyście głosili wielkość tego, który was powołał z ciemności do swojej cudownej światłości."
 # Consolamentum Tenet
 pam_2_timothy_4_7_english: "W dobrych zawodach udział wziąłem, bieg ukończyłem, wiarę zachowałem."
 # Divine Marriage Tenet
 pam_tobit_8_7_english: "Biorę tę siostrę za żonę nie z pożądania, lecz z wierności. Obdarz nas swoim miłosierdziem i spraw, byśmy razem dożyli sędziwego wieku. Pobłogosław nas potomstwem."
 # Gnosticism Tenet
 pam_1_corinthians_2_7_english: "Głosimy jednak ukrytą tajemnicę mądrości Bożej, którą Bóg przed wiekami przeznaczył dla naszej chwały."
 # Mendicant Preachers Tenet
 pam_matthew_10_9_english: "Nie zabierajcie ze sobą złota, srebra ani miedzi w sakiewkach."
 # Pentarchy Tenet
 pam_matthew_18_20_english: "Gdzie dwóch albo trzech zgromadzi się w imię moje, tam ja jestem pośród nich."
 # Unrelenting Faith Tenet
 pam_hebrews_11_1_english: "Wiara jest bowiem potwierdzeniem tego, czego się spodziewamy, i dowodem na to, czego nie widzimy."
 # Hesychasm Tenet
 pam_psalm_46_10_english: "Zatrzymajcie się i uznajcie Boga we mnie. Jam wywyższony wśród narodów, wywyższony na całej ziemi."
 pam_matthew_6_6_english: "Gdy zatem pragniesz się pomodlić, wejdź do swej izby, zamknij za sobą drzwi i zwróć się do Ojca obecnego w skrytości. A Ojciec, który widzi to, co dzieje się w ukryciu, wynagrodzi cię."
 pam_1_kings_19_12_english: "Po trzęsieniu ziemi pojawił się ogień, lecz Pan nie objawił się w płomieniach. A potem wszystko spowiła cisza absolutna."
 # Anachoresis Tenet
 pam_matthew_4_1_2_english: "Duch poprowadził Jezusa na pustkowie, aby stanął wobec pokusy diabła. Czterdzieści dni i nocy postu upłynęło i wtedy dopiero poczuł głód."
 pam_hebrews_11_38_english: "Świat nie był ich godzien. Tułali się więc po pustkowiach i górach, kryjąc się w jaskiniach i ziemnych rozpadlinach."
 pam_luke_5_16_english: "Udawał się w miejsce ustronne i tam się modlił."
 # Mortification of the Flesh Tenet
 pam_1_corinthians_9_27_english: "Lecz trzymam w ryzach własne ciało i podporządkowuję je sobie, aby głosząc innym, samemu nie okazać się kimś, kto nie sprostał wymaganiom."
 pam_galatians_5_24_english: "A ci, którzy do Chrystusa Jezusa należą, przybili do krzyża ciało wraz z jego żądzami i pragnieniami."
 pam_romans_8_13_english: "Bo jeśli będziecie kierować się zachciankami ciała, czeka was śmierć; lecz jeśli mocą Ducha będziecie usuwać to, co w was prowadzi ku złu, wtedy naprawdę będziecie żyli."
 # Holy Myron Tenet
 pam_john_3_5_english: "Jezus odrzekł: „Zaprawdę powiadam, że nikt nie wejdzie do królestwa Bożego, jeśli nie narodzi się z wody i Ducha”."
 pam_acts_10_38_english: "Jezusa z Nazaretu Bóg obdarzył Duchem Świętym i mocą. Przemierzał więc świat, czyniąc dobro i uwalniając od zła wszystkich, którzy byli dręczeni przez diabła, gdyż towarzyszył mu Bóg."
 pam_2_corinthians_1_21_22_english: "Tym zaś, który umacnia nas razem z wami w Chrystusie i który nas namaścił, jest sam Bóg. On także odcisnął na nas swoją pieczęć i złożył w naszych sercach zadatek Ducha."
 # Khachkar Tenet
 pam_galatians_6_14_english: "Nie będę się chlubić niczym innym niż krzyżem naszego Pana Jezusa Chrystusa. Przez ten krzyż świat stał się ukrzyżowany dla mnie, a ja dla świata."
 pam_1_corinthians_1_18_english: "Nauka o krzyżu wydaje się niedorzeczna tym, którzy zmierzają ku zgubie, lecz dla nas, którzy doświadczamy zbawienia, jest przejawem Bożej mocy."
 pam_isaiah_19_19_english: "W tym dniu pośrodku ziemi Egiptu stanie ołtarz Pana, a na jej granicy wzniesiona będzie stela ku jego czci."
 # Miaphysitism Tenet
 pam_john_1_14_english: "A Słowo ciałem się ciałem i mieszkało między nami. Ujrzeliśmy chwałę syna jedynego jednorodzonego pełnego łaski i prawdy."
 pam_colossians_2_9_english: "W nim bowiem mieszka cała pełnia boskości w postaci cielesnej."
 pam_philippians_2_6_7_english: "On to, choć istniał w postaci Boga, nie uważał równości z Bogiem za coś, do czego należy dążyć, lecz ogołocił samego siebie, przyjmując postać sługi i stając się podobnym do ludzi."
 # Philanthropia Tenet
 pam_matthew_25_40_english: "Zaprawdę powiadam wam – to, co uczyniliście najmniejszemu z członków mej rodziny, i mnie uczyniliście."
 # Sanctity of Nature Tenet
 pam_psalm_24_1_english: "Panu przynależy ziemia i wszelka jej pełnia, cały świat wraz z jego mieszkańcami."
 # Literalism Tenet
 pam_2_timothy_3_16_english: "Całe pismo natchnione jest przez Boga i użyteczne – do nauki, do przekonywania, do poprawiania, a także do kształcenia w sprawiedliwości."
 # Legalism Tenet
 pam_romans_2_13_english: "Gdyż nie ci, którzy słuchają prawa, będą przez Boga nazwani sprawiedliwymi, lecz ci, którzy prawo czynią, będą usprawiedliwieni."
 # Religious Law Tenet
 pam_matthew_18_18_english: "Zaprawdę powiadam wam – to, co na ziemi zwiążecie, związane będzie i w niebie. Jednakowoż to, co rozwiążecie na ziemi – będzie i w niebie rozwiązane."
 # Communal Possessions Tenet
 pam_acts_4_32_english: "I od teraz ci, którzy wierzyli, byli jednym sercem i duszą i nikt nie pragnął własności, lecz wszystko ich było wspólne."
 # Ritual Hospitality Tenet
 pam_hebrews_13_2_english: "Nie zapominajcie o gościnności dla obcych, bowiem niektórzy, nieświadomie, aniołów gościli."
 # Ritual Celebrations Tenet
 pam_psalm_150_3_4_english: "Chwalcie Go dźwiękiem trąby, i harfy i cytry. Chwalcie tamburynem i tańcem, wychwalajcie grając na strunach i flecie."
 # Adaptability Tenet
 pam_1_corinthians_9_22_english: "Stałem się wszystkim dla wszystkich, by choć paru z nich uratować."
 # Astrology Tenet
 pam_matthew_2_2_english: "Gdzież jest dziecię, narodzone jako król żydowski? Zobaczyliśmy gwiazdę jego i przybyliśmy, by oddać Mu pokłon."
 # Warmongering Tenet
 pam_psalm_144_1_english: "Błogosławiony Pan, Opoka moja, On uczy moje ręce walczyć i moje palce prowadzić bój."
 # Natural Primitivism Tenet
 pam_genesis_2_25_english: "A oboje byli nagimi, człowiek i żona jego, a nie wstydzili się."
 # Auspicious Birthright Tenet
 pam_jeremiah_1_5_english: "Zanim cię uformowałem w łonie matki, znałem cię, nim wyszedłeś na świat, poświęciłem cię."
 # Sacred Childbirth Tenet
 pam_psalm_127_3_english: "Oto potomstwo jest dziedzictwem od Pana, a owoc łona – nagrodą."
 # Hedonism Tenet
 pam_ecclesiastes_8_15_english: "Zalecałem więc radość, bo dla człowieka nic lepszego pod słońcem nie ma, niźli jeść, pić i radować się."
 # Pursuit of Power Tenet
 pam_psalm_2_8_english: "Proś Mnie, a oddam Ci narody jako dziedzictwo i krańce ziemi pod Twoje władanie."
 # Sanctioned False Conversions Tenet
 pam_2_kings_5_18_19_english: "Kiedy pan mój wchodzi do domu Rimmona, aby oddać pokłon, opierając się na mym ramieniu – i ja oddaję pokłon. Niech Pan przebaczy twemu słudze ten występek. On zaś rzekł mu: idź w pokoju."
