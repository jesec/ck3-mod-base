 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "Podaruj nam siłę, Panie, gdy dźwigamy krzyż, chwaląc Twoje święte imię. Prowadź nas ścieżką świętości i czuwaj, gdy bronimy wiary; czuwaj, gdy wyzwalamy ziemie święte spod jarzma niewiernych.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Peregrinatio Armata – tło historyczne','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "Podążajcie, wierni, śladem Chrystusa. Dźwigajcie krzyż nie tylko w duchu, lecz w obronie miejsc świętych. Pielgrzymka zbrojna to akt poświęcenia; droga wiary pod ochroną ostrza.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Énoplon Proskýnēma – tło historyczne','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "Pielgrzymka do ziem świętych to obowiązek wiernych. Miejsc tych i współpielgrzymów należy chronić – siłą, jeśli trzeba.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Pielgrzymki zbrojne – tło historyczne','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "Połączenie praktyk duchowych związanych z odwiedzaniem miejsc świętych z działaniami zbrojnymi w celu ich obrony lub przejęcia. Krucjaty rozpoczęły się w 1095 roku wraz z wezwaniem papieża Urbana II podczas synodu w Clermont i stanowiły najbardziej zorganizowaną formę pielgrzymek zbrojnych. Krzyżowcy otrzymywali odpust zupełny, a swoje usługi wojskowe uznawali za akt pokuty i oddania.\n\nPodstawą koncepcji były wcześniejsze tradycje propagujące pielgrzymki zbrojne i obronę chrześcijaństwa przed zagrożeniami z zewnątrz. Pielgrzymka przestała być pokojową wyprawą, a stała się zbrojną demonstracją wiary."
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "Populus Dei" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "Laòs Theoũ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "Jesteśmy rasą wybranych, królewskimi kapłanami, narodem świętym, który wyróżnił Pan. Obyśmy sławili Jego wielkie dzieła i czynili godnie jako Jego lud.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Populus Dei – tło historyczne','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "Oto my: wierni z narodu świętego, lud Boga wywołany z ciemności wprost w blask Jego chwały. Tożsamość nasza – w Chrystusie, który dał nam jedno ciało.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Laòs Theoũ – tło historyczne','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "Wierni – zjednoczeni jako lud wybrany przez Boga – tworzą społeczność ponad resztą świata, wspólną tożsamość i cel znajdując w Chrystusie.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Tożsamość wspólnotowa – tło historyczne','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "Podstawą koncepcji Kościoła w rozumieniu „Ludu Bożego” jest Stary Testament – przedstawiający naród izraelski jako lud wybrany przez Boga – interpretowany jednak z perspektywy Nowego Przymierza. U swoich początków chrześcijanie uważali się za nowy Izrael zjednoczony nie przez krew czy pochodzenie etniczne, a w wierze w Chrystusa.\n\nWspólna tożsamość wykraczała poza granice społeczne, etniczne i narodowościowe – królowała koncepcja powszechnego braterstwa. W uchwalonej przez drugi sobór watykański konstytucji „Lumen Gentium” Lud Boży został wyraźnie wyróżniony jako główna idea eklezjologiczna. Dokument kładł nacisk na pielgrzymkową naturę Kościoła i wspólną godność wszystkich ochrzczonych."
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "Consolamentum"
 tenet_consolamentum_latin_desc: "Prawą stoczyliśmy walkę, i goń zwieńczyliśmy, nie tracąc wiary. Racz teraz, o Panie, przyjąć swego sługę: niech w Duchu Świętym spokój odnajdzie, by duszę wyzwolić z więzów materii.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Consolamentum – tło historyczne','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "Dzięki dotykowi dłoni i modlitwie dusza wiernego otrzymuje łaskę duchowego pocieszenia. Prawa walka jest stoczona, goń zakończona, a wiara – zachowana.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Paráklēsis – tło historyczne','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "Poprzez święty obrządek duchowego pocieszenia wierni otrzymują dar Ducha Świętego i przygotowują się do wyprawy na tamten świat.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Consolamentum – tło historyczne','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "Consolamentum to centralny sakrament katarski łączący elementy chrztu, bierzmowania, święceń i ostatniego namaszczenia odbywający się poprzez ułożenie dłoni na ciele wiernego. Wierzono, że następuje w ten sposób zesłanie Ducha Świętego i wyzwolenie duszy z więzów świata materialnego.\n\nWiększość wierzących otrzymywała sakrament dopiero na łożu śmierci; ci zaś, którzy uzyskiwali go w pełni zdrowia, stawali się tzw. perfecti lub bons hommes i zobowiązywali się do życia w ścisłej ascezie. Ceremonia ma źródło we wczesnych chrześcijańskich praktykach chrztu duchowego i świadczy o potencjalnym wpływie tradycji bogomiłów ze Wschodu."
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "Hieros gámos" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "W święty nasz związek wstąpiliśmy nie z pożądania, lecz w prawdzie stojąc, z czystymi intencjami. O Panie, zmiłuj się nad nami, i w więzi nieskalanej doczekać pozwól wspólnej starości.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Matrimonium Sacrum – tło historyczne','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "Małżeństwa zawierane między członkami społeczności wiernych chronią uświęconą krew i pozwalają zachować czystość w oczach Boga. Błogosławione są związki zawierane nie z pożądania, lecz w prawdzie – i one jedyne mężowi i żonie zapewnić mogą łaskę.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Hieròs Gámos – tło historyczne','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "Uświęcone małżeństwa zawierane między członkami społeczności wiernych pozwalają utrzymać duchową czystość oraz chronić przed skalaniem krew wierzących na przestrzeni pokoleń.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Uświęcone małżeństwo – tło historyczne','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "Koncepcja uświęconego małżeństwa lub też endogamii – związku małżeńskiego zawieranego wyłącznie między członkami grup wyznaniowych – w wielu tradycjach wywodzi się ze starożytności. W zaratusztrianizmie praktykowano tzw. xwedodah (małżeństwa między bliskimi krewnymi), które miały uszlachetniać duszę i zapewnić zachowanie majątku rodzinnego. Uświęcone małżeństwa zawierano, by utrzymać czystość religijną, gromadzić moc duchową oraz chronić rody wiernych i arystokratów w ich hermetycznej formie.\n\nChoć małżeństwa tego rodzaju budziły kontrowersje i często spotykały się z niezrozumieniem ze strony osób postronnych, propagatorzy uważali je za zgodne z boskim przykazaniem chronienia czystości ich grupy."
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "O Boża Mądrości, coś skryta przez wieki, odsłoń przed nami arkana królestwa duchowego; uwolnij dusze z więzienia materii, poprowadź do światła i obdarz zrozumieniem!\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Gnosis – tło historyczne','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "Prawdziwe zbawienie odbywa się poprzez gnozę – poznanie niewidocznej dla świata materialnego prawdy o tym, co boskie. Głosimy Mądrość Bożą zawartą w tajemnicy; wiedzę ukrytą przed wiekami dla naszej chwały.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Gnõsis – tło historyczne','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "Drogą do zbawienia jest tajemna prawda o boskości: w niej jest schowana boska iskra, i w niej ukryta brama do świata duchowego, którą stworzył demiurg.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Gnostycyzm – tło historyczne','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "Gnostycyzm obejmuje spotykane u początków chrześcijaństwa rozmaite ruchy religijne, których przedstawiciele za drogę do zbawienia uznawali gnozę lub wiedzę tajemną. Typowym dla gnostyków był pogląd, że świat materialny to niedoskonałe dzieło pomniejszego bóstwa (demiurga), a prawdziwy Bóg jest ukryty i transcendentny. Według wierzeń dusze ludzkie miały skrywać uwięzione w materii boskie iskry, które można było uwolnić poprzez zgłębianie wiedzy tajemnej.\n\nWśród największych gnostyckich nauczycieli wyróżnić można Walentyna Egipcjanina, Bazylidesa i Marcjona. Ojcowie Kościoła, tacy jak Ireneusz z Lyonu i Tertulian, sprzeciwiali się w swoich obszernych tekstach naukom gnostyckim, uznając je za herezję wobec chrześcijaństwa apostolskiego."
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "Pax et bonum" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "Ptōkhoì kērykes" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "Jakoś posłał apostołów bez złota i srebra, tak my wędrujemy w biedzie, w Twej opatrzności jedyny mając pokarm. Prosimy Cię, Panie, byś łaską nas otoczył i głosić pozwolił, w prostocie i prawdzie, Słowo Twoje.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Pax et Bonum – tło historyczne','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "Mnisi żebracy dobrowolnie decydują się na życie w ubóstwie, jak Chrystus bez miejsca, gdzie mógłby złożyć głowę: ufając, iż opiekę znajdą w Bogu, bez dobytku idą głosić Jego Słowo.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Ptōkhoì Kērykes – tło historyczne','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "Żebraczy kaznodzieje należą do zakonów oddanych życiu w ubóstwie i głoszeniu nauk. Podróżują bez dobytku, szerząc wiarę z przekonaniem, że ich bieżące potrzeby zaspokoi Bóg.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Żebraczy kaznodzieje – tło historyczne','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "Zakony żebracze wyłoniły się w XIII wieku w odpowiedzi na bogactwo i zamiłowanie do dóbr doczesnych ugruntowanego Kościoła. Na soborze lyońskim II w 1274 roku uznano cztery zakony główne: karmelitów, franciszkanów Franciszka z Asyżu, dominikanów Dominika Guzmana i augustianów.\n\nZakony żebracze – w odróżnieniu od monastycznych, które posiadały wspólną własność – zarówno jako wspólnoty, jak i poszczególne należące do nich jednostki propagowały życie w ubóstwie, polegając niemal wyłącznie na jałmużnie. Ich głównym celem była działalność kaznodziejska w miastach oraz prowadzenie nauczania. Mnisi żebracy czerpali wzór bezpośrednio z uwiecznionej w ewangelii św. Mateusza (10:9–10) mowy, w której Chrystus poinstruował apostołów, by nie brali ze sobą nic na drogę."
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "Quinque Sedes" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "Gdzie wierni zebrani są w imię Chrystusa, tam On jest. Kościół opiera się na filarach pięciu wielkich stolic: Rzymu, Konstantynopolu, Aleksandrii, Antiochii i Jerozolimy.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Quinque Sedes – tło historyczne','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "Zarządzanie Kościołem należy do pięciu stolic patriarchalnych wyznaczonych w czasach apostołów. Gdzie dwaj lub trzej są zebrani w Jego imieniu, tam Chrystus jest, a poprzez pentarchię na świecie wypełniana jest Jego wola.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Pentarkhía – tło historyczne','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "Zarządzanie Kościołem uniwersalnym odbywa się w pięciu stolicach patriarchalnych stanowiących pentarchię. Każda z nich sprawuje władzę w swoim regionie, a spójny kierunek całej wspólnoty wyznaczają sobory.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Pentarchia – tło historyczne','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "Pentarchia była modelem zarządzania Kościołem, który zyskał charakter formalny na soborze chalcedońskim w 451 roku i uznawał zwierzchnictwo pięciu patriarchów rezydujących w głównych stolicach – Rzymie, Konstantynopolu, Aleksandrii, Antiochii i Jerozolimie – odzwierciedlając znaczenie polityczne tych miast dla Cesarstwa Rzymskiego. Każdy z patriarchów sprawował władzę nad podlegającym mu regionem, a spory rozstrzygane były na soborach powszechnych.\n\nSystem pentarchiczny nie został nigdy w pełni przyjęty przez Rzym, który uznawał zwierzchnictwo papieskie, i został osłabiony wskutek oblężenia Aleksandrii w 641 roku. Choć uległ rozpadowi w następstwie wielkiej schizmy z 1054 roku, jego założenia przetrwały we wschodnich Kościołach prawosławnych. Nowe patriarchaty ustanowiono później w Rosji, Serbii i innych miejscach."
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "Fides Indefessa" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "Pístis akatapónētos" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "O Panie, umocnij w nas wiarę, co istotą jest nadziei i niewidocznych sił uznaniem. Siłę nam podaruj, abyśmy wobec przeciwności trwali niezachwianie, bezwzględnym darząc Cię oddaniem.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Fides Indefessa – tło historyczne','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "Niezachwiana wiara – istota nadziei i przekonanie o istnieniu sił niewidocznych dla oka – daje wiernym siłę, by mogli przezwyciężyć każdą próbę, trwać w obliczu prześladowań i bez wahania zmierzyć się ze śmiercią.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Pístis Akatapónētos – tło historyczne','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "Wiara, którą nie zachwieją żadne prześladowania, próby czy wątpliwości. Wierni winni trwać w swoich przekonaniach, nie bacząc na konsekwencje w życiu doczesnym.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Nieubłagana wiara – tło historyczne','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "Na przestrzeni dziejów chrześcijańskich męczennicy i spowiednicy – od ofiar pierwszych prześladowań pod władzą Nerona i Dioklecjana, czy też późniejszych procesów, po misjonarzy, którzy podróżowali i ginęli podczas prób nawracania wrogiej ludności, jak Adalbert z Pragi – byli stawiani za wzór do naśladowania. Chrześcijan wzywano do podążania ich śladem i obstawania przy wierze nawet w obliczu śmierci.\n\nPrzekonanie, iż wiarę należy bronić, podtrzymywać i szerzyć bez względu na cenę, było podstawą wielu ruchów zakonnych i wypraw misyjnych. Historie świętych poddanych torturom i straconych za wiarę miały wzmacniać determinację wiernych i gwarantowały zbawienie."
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "Miafizytyzm"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "Sobór efeski nie stanowił latrocinium. Błąd soboru chalcedońskiego należy sprostować. Natury boska i ludzka stanowią uporządkowaną jedność – bez zmian, bez podziałów i odrębności – w jednej osobie Chrystusa.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Miaphysitismus – tło historyczne','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "Sobór efeski nie popełnił błędu, oczyszczając imię Eutychesa, a potępiając Flawiana. Chrystus ma jedną, bosko-ludzką naturę złączoną bez podziałów w uporządkowaną całość, i tak samo w pełni jest Bogiem, jak i człowiekiem.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Miaphysitismós – tło historyczne','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "Chrystus ma jedną naturę – tak samo boską, jak ludzką – złączoną nierozerwalnie i nieodrębnie w Jego Wcieleniu.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Miafizytyzm – tło historyczne','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "Miafizytyzm – od greckich słów mia (#weak jedna#!) i physis (#weak natura#!) – to doktryna, która utrzymuje, iż natura boska i ludzka łączą się w Chrystusie w spójną, uporządkowaną jedność, bez podziału i odrębności. Propagatorem miafizytyzmu był Cyryl z Aleksandrii, który posługiwał się formułą „#weak mia physis tou theou logou sesarkōménē#!” (jedna natura Boga – Słowa wcielonego). W odróżnieniu od monofizytyzmu miafizytyzm utrzymuje, że obie natury stanowią całkowitą, faktyczną jedność.\n\nNa soborze chalcedońskim w 451 r. odrzucono formułę monofizytyczną na rzecz diofizytyzmu głoszącego istnienie dwóch oddzielnych natur, a wschodnie Kościoły prawosławne (koptyjski, ormiański, etiopski, syryjski) oddzieliły się od Kościoła bizantyjskiego i głoszą nauki miafizytyczne do dziś."
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[characters|E] z cechą [GetTrait('honest').GetName( GetNullCharacter )|l]: o #P 10%#! większy przyrost @piety_icon! [Concept('piety', 'pobożności')|E], #P +10#! pkt [Concept('opinion', 'opinii')|E] [Concept('clergy', 'duchowieństwa')|E]"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[characters|E] z cechą [GetTrait('deceitful').GetName( GetNullCharacter )|l]: o #N 10%#! mniejszy przyrost @piety_icon! [Concept('piety', 'pobożności')|E], #N -10#! pkt [Concept('opinion', 'opinii')|E] [Concept('clergy', 'duchowieństwa')|E]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "[piety_i] #P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [Concept('piety', 'pobożności')|E] co roku, dopóki twój [liege|El] nie wyznaje tej samej [Concept('faith', 'wiary')|E] co ty"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "Hezychazm"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "Łaskę świętego spokoju podaruj nam, Panie; w świetle nieprzystępnym znaleźć Cię pomóż i modlitwy nieustannej naucz, ażeby serca nasze Twoją stać mogły się świątynią.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Hesychasmus – tło historyczne','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "Jezu Chryste, Synu Boży, zmiłuj się nade mną grzesznikiem i pomóż, w spokoju ciała i ducha, w Modlitwie Serca powtarzanej bez wytchnienia, osiągnąć theorię – wizję niestworzonego boskiego światła.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Hēsykhasmós – tło historyczne','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "Poprzez wewnętrzne wyciszenie, kontemplację i powtarzanie słów Modlitwy Jezusowej wierny ma szansę doświadczyć bezpośredniego obcowania z Bogiem i ujrzeć Jego niestworzone światło.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Hezychazm – tło historyczne','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "Hezychazm – od greckiego słowa #weak hēsykhía#! oznaczającego spokój – to wschodniochrześcijańska tradycja kontemplacji skoncentrowana na modlitwie serca, wywodząca się ze zwyczajów ojców pustyni z Egiptu z IV wieku. Jej główną praktyką stało się wielokrotne odmawianie, często w rytm oddechu i uderzeń serca, modlitwy Jezusowej: „#weak Panie Jezu Chryste, Synu Boży, zmiłuj się nade mną, grzesznikiem#!”.\n\nW XIV wieku Grzegorz Palamas bronił mnichów hezychastów i ich wizji niestworzonego światła przemiany z Taboru przed zarzutami o herezję stawianymi przez Barlaama z Kalabrii. Podczas synodów konstantynopolitańskich w 1341 i 1351 roku Grzegorz z Palamas został oczyszczony z zarzutów, a hezychazm uznano za doktrynę prawosławną."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "#P Więcej#! punktów @piety_icon! [Concept('piety', 'pobożności')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] za podjęcie [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]” w twojej [Concept('capital', 'stolicy')|E]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "Użycie interakcji „#high $spiritual_counsel_interaction$#!” wobec [Concept('clergy', 'duchowieństwa')|E] tego [Concept('rite', 'obrządku')|E] zapewnia więcej punktów @piety_icon! [Concept('piety', 'pobożności')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "[characters|E] z cechą [GetTrait('patient').GetName( GetNullCharacter )|l]: o #P 10%#! większy przyrost @piety_icon! [Concept('piety', 'pobożności')|E], o #P 10%#! większy przyrost @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[characters|E] z cechą [GetTrait('impatient').GetName( GetNullCharacter )|l]: o #N 10%#! mniejszy przyrost @piety_icon! [Concept('piety', 'pobożności')|E]"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[characters|E] z cechami [GetTrait('journaller').GetName( GetNullCharacter )|l], [GetTrait('contrite').GetName( GetNullCharacter )|l], [GetTrait('confider').GetName( GetNullCharacter )|l] i [GetTrait('flagellant').GetName( GetNullCharacter )|l]: o #P 10%#! zwiększone złagodzenie [Concept('stress', 'stresu')|E], o #P 5%#! większy przyrost @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "Zyskaj punkty @piety_icon! [Concept('piety', 'pobożności')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] po zmniejszeniu poziomu [Concept('stress', 'stresu')|E] (nie częściej niż raz w roku)"
 pam_hesychasm_meditation_toast: "Ze względu na twój dogmat „[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]”: premia za medytację w bezruchu w domowym zaciszu"
 pam_hesychasm_stillness_toast: "Ze względu na twój dogmat „[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]”: spokój serca"
 hesychasm_anachoresis_mortification_exclusivity_desc: "Postacie mogą w danej chwili mieć tylko jeden z następujących [Concept('core_tenets', 'dogmatów')|E]: „[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]”, „[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]”, „[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]”, „[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]”"
 # Anachoresis tenet
 tenet_anachoresis_latin_name: "Vita Eremitica" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "Anachoreza"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "Jakoś wyprowadził Syna swego na pustkowia, do służby go szykując, i nas powiedź, Panie, na pustynię serc naszych. Dopomóż nam, abyśmy chaos świata porzuciwszy, w ciszy i odosobnieniu odnaleźć mogli Ciebie.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Vita Eremitica – tło historyczne','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "Błogosławieni ci, którzy porzucili świat, albowiem na cichej pustyni znajdą oni Boga. Naśladując proroków zaszywających się w pieczarach i dołach, słudzy Chrystusa pragną toczyć w odosobnieniu walkę z pokusami.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Anakhōrēsis – tło historyczne','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "Wierni, którzy porzucą społeczność ziemską i ruszą na pustkowia, mogą osiągnąć czystość ducha, pokonać pokusy i zbliżyć się do Boga, oddając się samotnej modlitwie i ascezie.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Anachoreza – tło historyczne','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "Anachoreza – od greckiego słowa #weak anakhorēsis#! oznaczającego wycofanie – to praktyka pustelników, którzy opuszczali społeczeństwo i udawali się na odludzie, aby prowadzić życie pełne modlitwy, postu i duchowej walki z siłami demonicznymi. Ruch ten zapoczątkował w III wieku w Egipcie święty Paweł z Teb, tradycyjnie uznawany za pierwszego chrześcijańskiego pustelnika, który około 250 roku n.e. uciekł przed prześladowaniami cesarza Decjusza na pustynię tebańską.\n\nAnachoreci pozostawali powszechnym zjawiskiem przez całe średniowiecze, mieszkając w odizolowanych celach przylegających do klasztorów i przyjmując Eucharystię przez małe okienko zwane hagioskopem. Teksty przewodnie, takie jak XIII-wieczna angielska „Ancrene Wisse”, określały zasady obowiązujące anachoretów i anachoretki."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "Zyskuje [Concept('trait', 'cechę')|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "#P Więcej#! punktów @piety_icon! [Concept('piety', 'pobożności')|E] i @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] za podjęcie [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]” z dala od twojej [Concept('capital', 'stolicy')|E]"
 religious_decision.0211_anachoresis_tt: "#EMP Ze względu na twój [personal_tenet|El] „[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]”:#!"
 doctrine_parameter_tenet_anachoresis_always_cave_hermit: "Odblokowuje [court_position|El]: [GetCourtPositionType('cave_hermit_court_position').GetName()|l]"
 tenet_anachoresis_always_cave_hermit_name: "[court_position|El]: [GetCourtPositionType('cave_hermit_court_position').GetName()|l]"
 pam_anachoresis_meditation_toast: "Ze względu na twój dogmat „[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]”: premia za medytację w odosobnieniu"
 pam_anachoresis_tenet_title: "[core_tenet|E] „$tenet_anachoresis_default_name$”"
 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "Mortificatio Carnis" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "Umartwianie"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "Pobłogosław nam, Panie, w umartwianiu ciał naszych, pokus ich i pragnień. Na drodze uświęconej męki dzielimy cierpienie z Chrystusem; poskramiamy cielesność, aby stanąć w prawdzie.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Mortificatio Carnis – tło historyczne','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "Oddając się postom, czuwaniu i umartwianiu, słudzy Boga poskramiają ciała i biorą je w niewolę, aby uwięzione w nich dusze mogły wznieść się ku niebu.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Nékrōsis tẽs Sarkós – tło historyczne','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "Wierni poskramiają ciała i ich grzeszne pragnienia, dzieląc mękę z Chrystusem w nadziei na oczyszczenie duszy i osiągnięcie duchowej doskonałości.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Umartwianie – tło historyczne','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "[trait|E] [GetTrait('scarred').GetName( GetNullCharacter )|l] zapewnia @piety_icon! [piety|El] i lepszą [Concept('opinion', 'opinię')|E] wiernych"
 doctrine_parameter_tenet_mortification_revel_bonus: "Przyrost @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] i przyznanie [Concept('trait', 'cechy')|E] [GetTrait('flagellant').GetName( GetNullCharacter )|l], gdy podejmiesz [Concept('decision', 'decyzję')|E] „[GetDecisionWithKey('stress_loss_flagellant_decision').GetName]”"
 doctrine_parameter_tenet_mortification_holy_scars: "Zyskaj [Concept('trait', 'cechę')|E] [GetTrait('scarred').GetName( GetNullCharacter )|l], przyjmując ten [personal_tenet|El]"
 doctrine_parameter_tenet_mortification_suffering_sanctifies: "Zyskujesz @piety_icon! [piety|El] i tracisz [stress|El] za każdym razem, gdy odnosisz ranę"
 doctrine_parameter_tenet_mortification_mortify_flesh: "Można użyć [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('stress_loss_flagellant_decision').GetName]”"
 pam_mortification_revel_toast: "[personal_tenet|E] „[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]”"
 pam_mortification_flagellant_gain_toast: "Ze względu na twój dogmat „[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]”: przyjęcie następującej ścieżki – [GetTrait('flagellant').GetName( GetPlayer.Self )|El]"
 pam_mortification_holy_scars_toast: "Ze względu na twój dogmat osobisty „[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]”: biczowanie zostawiło święte blizny na twoim ciele"
 pam_mortification_suffering_sanctifies_toast: "Ze względu na twój dogmat osobisty „[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]”: ofiarowujesz męki cielesne Bogu"
 tenet_mortification_of_the_flesh_historical_desc: "Praktyka umartwiania, wywodząca się z wezwania świętego Pawła do „#weak uśmiercania popędów ciała#!” (Rz 8:13) oraz „#weak karcenia ciała i brania go w niewolę#!” (1 Kor 9:27), od najwcześniejszych wieków stanowiła centralny element chrześcijańskiej ascezy. Z najbardziej radykalnych praktyk w tym zakresie słynęli stylici: św. Symeon Starszy spędził 37 lat na szczycie słupa w pobliżu Aleppo, nieustannie modląc się zarówno w palącym upale, jak i w przenikliwym mrozie.\n\nSamobiczowanie rozprzestrzeniło się w średniowiecznym zachodnim chrześcijaństwie, a wśród duchowieństwa propagował je święty Piotr Damiani (1007–1072). Ruch biczowników w XIII i XIV wieku polegał na tym, że jego świeccy członkowie przemierzali miasta, biczując się w ramach pokuty w czasach zarazy i klęski."
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "Qeddus Meron" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "Sanctum Chrisma" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "Hágion Mýron" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "Krzyżmo"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "Za sprawą poświęconego przez abune krzyżma wierni otrzymują pieczęć Ducha Świętego. Podczas namaszczenia Duch – na podobieństwo gołębicy, która zstąpiła na Jezusa w trakcie chrztu w Jordanie – zstępuje na nowo ochrzczonych, by naznaczyć ich jako dzieci Boga.\n\n$pam_john_3_5_default$\n\n[Glossary('Qeddus Meron – tło historyczne','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "Za sprawą poświęconego przez biskupa krzyżma wierni otrzymują pieczęć daru Ducha Świętego. Namaszczenie dopełnia łaskę chrztu.\n\n$pam_john_3_5_latin$\n\n[Glossary('Sanctum Chrisma – tło historyczne','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "Poświęcone przez patriarchę krzyżmo jest pieczęcią daru Ducha Świętego. Poprzez namaszczenie nowo oświeceni otrzymują pełnię darów Ducha i stają się świątynią żywego Boga.\n\n$pam_john_3_5_greek$\n\n[Glossary('Hágion Mýron – tło historyczne','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "Krzyżmo jest specjalnie poświęconym olejem wykorzystywanym podczas sakramentu bierzmowania, w trakcie którego wierni otrzymują pieczęć daru Ducha Świętego, kończąc tym samym ostatni etap wtajemniczenia w Kościele.\n\n$pam_john_3_5_default$\n\n[Glossary('Krzyżmo – tło historyczne','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "Krzyżmo – od greckiego słowa #weak mýron#! oznaczającego olejek zapachowy – jest używane podczas bierzmowania. Na Wschodzie sakramentu tego udziela się bezpośrednio po chrzcie, nawet w przypadku niemowląt; na Zachodzie udziela go biskup osobno. Namaszczenie ma głębokie korzenie biblijne: zarówno #weak Chrystus#!, jak i #weak Mesjasz#! oznaczają #weak Namaszczonego#!.\n\nKonsekracja nowego krzyżma jest rzadkim i uroczystym wydarzeniem: do nowej partii zawsze dodaje się porcję poprzedniej, co tworzy nieprzerwany łańcuch sięgający, jak się uważa, czasów apostołów. Tradycja etiopska głosi, że recepturę #weak krzyżma#! sprowadziło Dziewięciu Świętych, syryjscy misjonarze z V wieku, a jego konsekrację zastrzega się dla patriarchy zwanego abuną."
 doctrine_parameter_tenet_holy_myron_artifact: "Możesz wysłać swojego [Concept('court_chaplain', 'nadwornego kapelana')|E], aby utworzył [artifact|El] – #V święte krzyżmo#! – podejmując [Concept('decision', 'decyzję')|E] „[GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName]”; jego ładunki służą do błogosławienia [Concept('artifacts', 'artefaktów')|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: ", twojej [Concept('coronation', 'koronacji')|E]"
 pam_holy_myron_param_funeral_append: ", i zmarłych na [Concept('funerals', 'pogrzebach')|E]"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Możesz ofiarować ładunki swojego [Concept('artifact', 'artefaktu')|E] – #V krzyżma#! – innym władcom, zyskując @piety_icon! [piety|El] i lepszą [Concept('opinion', 'opinię')|E]"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Twoje nowo narodzone dzieci otrzymają [modifier|El] „[GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip]” na #V 16#! lat; ładunek [Concept('artifact', 'artefaktu')|E] – #V krzyżma#! – zapewnia [modifier|El] „[GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip]” na stałe"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "Kiedy zapadniesz na [Concept('ill', 'chorobę')|E], zyskasz: zwiększenie @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E], zmniejszenie [Concept('stress', 'stresu')|E] i [modifier|El] „[GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip]” na #V 2#! lata"
