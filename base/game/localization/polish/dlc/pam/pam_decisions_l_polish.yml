 pam_bull_events.desc.intro: "Ja, [ROOT.Char.GetTitledFirstNameNoTooltip], sługa sług Boga, zwracam się do moich ukochanych dzieci w Chrystusie:\n\n"
 pam_bull_events.desc.outro: "\n\n#EMP W miejscu znanym jako [ROOT.Char.GetCurrentLocation.GetName], w dniu [GetCurrentDate.GetStringLong]#!"
 every_theocratic_vassal_tt: "Każdy [vassal|El] z [Concept('theocracy', 'teokracją')|E] lub [Concept('ecclesiastical_government', 'rządem kościelnym')|E] ([THIS.ScriptValue('number_of_theocratic_vassals')|V0])"
 pam_bull_events.0001.t: "Bulla z [GetCurrentDate.GetYear] roku"
 pam_bull_events.0001.desc: "„Wzywam was wszystkich, byście przeciwstawili się niewiernym z miejsca znanego jako [title.GetName], byście wyzwolili tę ziemię spod ich tyranii i wyrwali z ich rąk wiele tysięcy waszych uwięzionych braci”.\n\n„Aby w waszych czasach wzrosła godność chrześcijan, a wasza waleczność, chwalona na całym świecie, pozostała nienaruszona i niezachwiana”."
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!"
 pam_bull_events.0001.a.flavor: "#EMP W imię Pańskie.#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "„Niech każdy z was, kto przyjął obrządek znany jako [tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l], wie, że jest on teraz dozwolony na mocy pozwolenia wydanego w miejscu o nazwie [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]”."
 pam_bull_events.0002.desc.tenet_forbidden: "„W naszym domu nie ma miejsca na obrządek znany pod nazwą [tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l]. Niech każdy, kto go praktykuje, wie, że narusza świętość Kościoła i że popełnił grzech śmiertelny”."
 pam_bull_events.0002.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0002.a.flavor: "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0003.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0003.desc: "„Aby położyć kres złu obrządku znanego jako [heresy_rite.GetName|l], z apostolską władzą potępiam jego zwolenników jako heretyków i zaklinam permanentnie,"
 pam_bull_events.0003.desc.heresiarch: "a ich przywódca, [heresiarch.GetTitledFirstName], zostanie uznany za herezjarchę”."
 pam_bull_events.0003.desc.no_heresiarch: "na kolejne stulecia”."
 pam_bull_events.0003.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0003.a.flavor: "$pam_bull_events.0001.a.flavor$"
 IN_NOMINE_DOMINI_GLOSS: "W imię Pańskie."
 pam_bull_events.0004.opening: "Do osoby, którą jest [ROOT.GetCharacter.GetTitledFirstNameNoTooltip], wyznającej wiarę znaną jako [ROOT.GetCharacter.GetFaith.GetNameNoTooltip|l]."
 pam_bull_events.0004.desc.crusade: "Wzywam was wszystkich, byście sprzeciwili się niewiernym z miejsca znanego jako [title.GetName]."
 pam_bull_events.0004.desc.heresy: "Niechaj wszyscy wiedzą, że obrządek znany jako [heresy_rite.GetName|l] jest odtąd obłożony anatemą, a ci, którzy go praktykują, uznawani są za heretyków."
 pam_bull_events.0004.desc.tenet_permitted: "– Niech każdy z was, kto przyjął obrządek znany jako [tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l], wie, że jest on teraz dozwolony na mocy pozwolenia wydanego w miejscu o nazwie [bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_bull_events.0004.desc.tenet_forbidden: "– Wśród naszych wiernych nie ma miejsca na doktrynę „[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]”. Niech każdy, kto ją praktykuje, wie, że narusza świętość Kościoła i że popełnił grzech śmiertelny."
 pam_bull_events.0004.desc.fallback: "[bull_issuer.GetTitledFirstName] wydaje nową bullę obowiązującą władców wyznających tę wiarę."
 pam_bull_events.0004.a: "Niech tak będzie."
 pam_bull_events.0004.b: "Nawrócę się na obrządek znany jako [bull_issuer.GetRite.GetNameNoTooltip|l]."
 pam_bull_events.0004.c: "W imię [ROOT.GetCharacter.GetFaith.HighGodNamePossessive]!"
 enact_a_bull_decision_choose_type_tt: "Musisz zdecydować, czego dotyczy [papal_bull|El]."
 enact_a_bull_decision_option_crusade: "Wezwanie do krucjaty"
 enact_a_bull_decision_option_crusade_desc: "Wydaj [Concept('papal_bull', 'bullę papieską')|E] wzywającą wiernych do [Concept('great_holy_war', 'wielkiej świętej wojny')|E]"
