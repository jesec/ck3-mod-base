 pam_mend_great_schism_decision_desc: "Zerwanie dawnej jedności było błędem – świat chrześcijański musi się ponownie zjednoczyć! Przekonanie wpływowych przywódców duchowych do moich racji nieuchronnie doprowadzi do przywrócenia dawnego porządku."
