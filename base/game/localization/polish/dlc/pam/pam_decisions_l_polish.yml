 pam_rite_heresy_not_mainline_tt: "Nie może być głównym [Concept('rite', 'obrządkiem')|E] [Concept('faith', 'wiary')|E]"
 pam_rite_heresy_no_antipope_tt: "Nie może być praktykowany przez [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E] ani żadnego z jego zwolenników"
 pam_rite_heresy_divergence_tt: "[rite_divergence|E] względem [Concept('rite', 'obrządku')|E] tradycyjnego musi być większa niż [THIS.ScriptValue('faith_heresy_threshold')|0V]"
