 pam_unite_miaphysite_churches_effect_tt: "Wiara o nazwie [absorbed_faith.GetName|l], wraz ze wszystkimi jej [Concept('rites', 'obrządkami')|E], zostaje włączona do [Concept('faith', 'wiary')|E] znanej jako [uniting_faith.GetName|l]"
 pam_unite_miaphysite_churches_message: "Zjednoczone Kośioły miafizyckie"
 pam_unite_miaphysite_churches_message_desc: "[unifier.GetShortUINameNotMeNoTooltip] jednoczy wspólnotę miafizycką w jednej [Concept('faith', 'wierze')|E] znanej jako [uniting_faith.GetName|l]."
 pam_prevented_great_schism_dynasty_modifier: "Strażnicy jedności"
 pam_prevented_great_schism_dynasty_modifier_desc: "Ta dynastia zapobiegła całkowitemu rozpadowi chrześcijańskiego świata, utrzymując jedność kościelną na najbliższe wieki."
 pam_prevented_great_schism_character_modifier: "$pam_prevented_great_schism_dynasty_modifier$"
 pam_prevented_great_schism_character_modifier_desc: "Ta postać zapobiegła całkowitemu rozpadowi świata chrześcijańskiego, utrzymując jedność kościelną na najbliższe wieki."
 pam_caused_great_schism_dynasty_modifier: "Niszczyciele wspólnoty"
 pam_caused_great_schism_dynasty_modifier_desc: "Ta dynastia doprowadziła do ostatecznego rozłamu w świecie chrześcijańskim, kierując kolejne pokolenia wiernych na rozbieżne ścieżki."
 pam_caused_great_schism_character_modifier: "$pam_caused_great_schism_dynasty_modifier$"
 pam_caused_great_schism_character_modifier_desc: "Ta postać doprowadziła do ostatecznego rozłamu w świecie chrześcijańskim, kierując kolejne pokolenia wiernych na rozbieżne ścieżki."
 pam_mended_great_schism_military_dynasty_modifier: "Odnowiciele wspólnoty"
 pam_mended_great_schism_military_dynasty_modifier_desc: "Ta dynastia zebrała starożytne stolice biskupie pod jednym sztandarem i zbrojnie zażegnała rozłam w świecie chrześcijańskim."
 pam_mended_great_schism_military_character_modifier: "$pam_mended_great_schism_military_dynasty_modifier$"
 pam_mended_great_schism_military_character_modifier_desc: "Ta postać zebrała starożytne stolice biskupie pod jednym sztandarem i zbrojnie zażegnała rozłam w świecie chrześcijańskim."
 pam_mended_great_schism_diplomatic_dynasty_modifier: "Pojednawcy chrześcijańscy"
 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "Ta dynastia nakłoniła zwaśnionych patriarchów, by wrócili do jedności, zażegnując rozłam w świecie chrześcijańskim bez przelewu choćby kropli krwi."
 pam_mended_great_schism_diplomatic_character_modifier: "$pam_mended_great_schism_diplomatic_dynasty_modifier$"
 pam_mended_great_schism_diplomatic_character_modifier_desc: "Ta postać nakłoniła zwaśnionych patriarchów, by wrócili do jedności, zażegnując rozłam w świecie chrześcijańskim bez przelewu choćby kropli krwi."
 nick_the_reconciler: "Filar Pojednania"
 nick_the_reconciler_desc: "[CHARACTER.GetShortUINameNotMeNoTooltipNoFormat] przezwycięża rozłam w świecie chrześcijańskim i na powrót jednoczy starożytne stolice biskupie."
 nick_the_concordant: "Głos Zgody"
 nick_the_concordant_desc: "[CHARACTER.GetShortUINameNotMeNoTooltipNoFormat] zachowuje komunię w wieku rozłamu i niezgody."
 nick_the_schismat: "Zarzewie Schizmy"
 nick_the_schismat_desc: "[CHARACTER.GetShortUINameNotMeNoTooltipNoFormat] niszczy jedność świata chrześcijańskiego i kieruje wiernych na różne drogi."
 pam_promulgate_word_of_pious_deeds_decision: "Ogłoś światu pobożne uczynki"
 pam_promulgate_word_of_pious_deeds_decision_desc: "Moja kancelaria przygotowała enkomion chwalący moje chrystusowe czyny. Wychwalanie własnych cnót jest nieodpowiednie, jednak moi bliscy pragną szerzyć wieści o mojej pobożności, tak by usłyszeli o niej wszyscy [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nGdy wieść o tym się rozniesie, ludzie mogą uznać, że jestem osobą najbardziej godną Tronu Piotrowego… i nie tylko."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Zwiększ wynik w elekcji#! o tytuł o nazwie [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)|l]: #P +30#! pkt lub zwiększ szansę [Concept('canonization', 'kanonizacji')|E]"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Wybierz: \n\t$EFFECT_LIST_BULLET$Wykorzystaj [piety|El], aby #V wzmocnić pozycję w elekcji#!, której stawką jest tytuł o nazwie [praise_worthy_priest_superior_title.GetName] \n\t$EFFECT_LIST_BULLET$Zwiększ szanse na [Concept('canonization', 'kanonizację')|E] w przyszłości"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Pozwól na pochwały!"
 cardinal_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Jesteś [Concept('cardinal', 'kardynałem')|E]"
 domicile_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "W twojej [Concept('domicile', 'siedzibie')|E] musi znajdować się następująca [domicile_building|El]: [GetDomicileBuilding('chancery_01').GetName|l] lub budowla wyższego poziomu"
 pam_renounce_papal_candidacy_decision: "Wyrzeknij się następującego tytułu: [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_embrace: "Dąż do następującego tytułu: [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Niektórzy całe życie wspinają się ku tronowi, na którym zasiada [ROOT.Char.GetFaith.ReligiousHeadName|l], a ja widzę, co ta wspinaczka z nimi robi.\n\nNiech [cardinal|E]owie wiedzą, że nie zamierzam ubiegać się o ten urząd, gdy przyjdzie czas wybrać następcę jego piastuna. Moje miejsce jest tutaj, w mojej własnej stolicy biskupiej."
 pam_renounce_papal_candidacy_decision_desc_embrace: "Za moich młodszych lat wiara znana jako [ROOT.Char.GetFaith.GetName|l] spoczywała w łagodniejszych rękach, dlatego znany był wówczas mój sprzeciw wobec ubiegania się o tron, na którym zasiada [ROOT.Char.GetFaith.ReligiousHeadName|l].\n\nNiech [cardinal|El]owie usłyszą, że dziś nie widzę przeszkód, by ubiegać się o ten najwyższy urząd."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Wycofaj się z kandydowania na następną [Concept('head_of_faith', 'głowę wiary')|E]"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "Ponownie stań do wyborów następnej [Concept('head_of_faith', 'głowy wiary')|E]"
 pam_renounce_papal_candidacy_decision_renounce_tt: "Nie wejdziesz w grono kandydatów przy wyborze następnej [Concept('head_of_faith', 'głowy wiary')|E] i zachowasz możliwość oddania głosu"
 pam_renounce_papal_candidacy_decision_embrace_tt: "Możesz wejść do grona kandydatów przy wyborze następnej [Concept('head_of_faith', 'głowy wiary')|E]"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "Inny [cardinal|El] musi być gotów stanąć do wyborów"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "Wycofaj moją kandydaturę"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "Chcę kandydować"
 pam_decision_events.0015.t: "Ogłoś światu pobożne uczynki"
 pam_decision_events.0015.desc.intro.no_praiser: "Moi lojalni kapłani rozgłaszają"
 pam_decision_events.0015.desc.intro.praiser: "Wpływowa i bliska mi osoba, [my_praiser.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], rozgłasza"
 pam_decision_events.0015.desc.intro: "enkomion, który przygotowała moja [GetDomicileBuilding('chancery_01').GetName|l]:\n\n„Pobożne czyny są jak nasiona rozsiane przez Boga, by wydać pobożny plon. Wszyscy powinni wiedzieć, że [praise_worthy_priest.GetName] to osoba szlachetna,"
 pam_decision_events.0015.desc.virtuoustrait: "[my_virtuous_trait.GetName(praise_worthy_priest)|l],"
 pam_decision_events.0015.desc.mid: "osoba cnotliwa, a jej światło przewodnie to zawsze"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]…”"
 pam_decision_events.0015.desc.novirtuoustenet: "Bóg…”"
 pam_decision_events.0015.desc.bad: "\n\nMimo pochwalnych słów moje serce lęka się pocałunku ognia piekielnego."
 pam_decision_events.0015.desc.good: "\n\nZaprawdę jestem narzędziem w rękach Boga, świadectwem jego piękna na ziemi."
 pam_decision_events.0015.desc.neutral: "\n\nMimo pochwalnych słów dopiero po śmierci dowiem się, jaką wagę ma moja dusza w oczach Boga."
 pam_decision_events.0015.desc.outro: "\n\n„…zaprawdę, uczynki tej osoby sprawiają, że zasługuje ona, by kierować Kościołem!”"
 pam_decision_events.0015.b: "– Memu imieniu przypisuje się wiele cudów."
 pam_decision_events.0015.b.flavor: "Dlaczego mam zadowolić się papiestwem, skoro mogę sięgnąć po kanonizację?"
 pam_decision_events.0015.b.tt: "#V Zwiększ szansę na kanonizację#! po śmierci\n#weak Kanonizowana może być tylko postać należąca do [Concept('dynasty', 'dynastii')|E]#!"
 pam_decision_events.0015.c: "Jeśli Bóg pragnie mi powierzyć misję…"
 pam_decision_events.0015.c.flavor: "…muszę podjąć wyzwanie"
 pam_decision_events.0015.c.tt: "#V Zwiększ wynik w elekcji#! o tytuł o nazwie [praise_worthy_priest_superior_title.GetName|l]: #P +30#! pkt"
 pam_decision_events.0015.d: "Niech nie padnie żadne inne imię."
 pam_decision_events.0015.d.flavor: "Wykorzystam całe moje oddanie, by nikomu nie ustąpić"
 pam_decision_events.0015.d.tt: "#V Zwiększ wynik w elekcji#! o tytuł o nazwie [praise_worthy_priest_superior_title.GetName|l]: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#! pkt – dość, by uplasować się na czele jako ucieleśnienie popularności\nWymaganie: @piety_icon! [praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] pkt [Concept('piety', 'pobożności')|E]"
 pam_evangelize_personal_tenet_decision: "Szerz dogmat osobisty"
 pam_evangelize_personal_tenet_decision_desc: "Chcę, by wszyscy poznali moje przekonania. Kierując się naukami Jezusa, będę głosić ewangelię w jego imieniu."
 pam_evangelize_personal_tenet_decision_tooltip: "Szerz swój [personal_tenet|El] wśród swoich [Concept('subjects', 'poddanych')|E] i [Concept('rulers', 'władców')|E] w [Concept('clerical_region', 'regionie duchownym')|E] twojej [Concept('realm_capital', 'stolicy państwa')|E], aby przyjęli go jako swój własny dogmat osobisty"
 pam_evangelize_personal_tenet_decision_confirm: "Szerz dogmat „[selected_item.GetNameNoTooltip(actor.GetRite)]” [GuiScope.SetRoot( actor.MakeScope ).AddScope( 'second', selected_item.MakeScope ).Custom( 'pam_tenet_popularity_status' )](#high [actor.GetFaith.GetTenetPopularityScore( selected_item.Self )]#!)"
 pam_evangelize_tenet_select_tt: "Należy wybrać [personal_tenet|El]"
 pam_evangelize_personal_tenet_decision_no_item_selected: "Nie wybrano [Concept('personal_tenet', 'dogmatu osobistego')|E]"
 pam_evangelize_personal_tenet_religious_authority_tt: "#V Twoja#! postać spełniać któryś z poniższych warunków:\n$BULLET_WITH_TAB$Być członkiem [Concept('clergy', 'duchowieństwa')|E]\n$BULLET_WITH_TAB$Ma [Concept('clerical_puppet', 'marionetkowego kapłana koronnego')|E]"
 pam_evangelize_personal_tenet_valid_targets_tt: "Musisz mieć co najmniej jednego [Concept('subject', 'poddanego')|E] lub [Concept('ruler', 'władcę')|E] w [Concept('clerical_region', 'regionie duchownym')|E] swojej [Concept('realm_capital', 'stolicy państwa')|E], który:\n$BULLET_WITH_TAB$Jest [Concept('adult', 'postacią dorosłą')|E]\n$BULLET_WITH_TAB$Dzieli z tobą [Concept('faith', 'wiarę')|E]\n$BULLET_WITH_TAB$Ma taki sam lub niższy [title_tier|El]\n$BULLET_WITH_TAB$Ma inny od ciebie [personal_tenet|El]"
 can_pick_one_option_tt: "Możesz wybrać jedną z poniższych opcji:"
 every_subject_evangelized_personal_tenet_tt: "Każdy nawrócony [subject|El] ([evangelized_subjects_count])"
 decision_every_subject_evangelized_personal_tenet_tt: "Każdy nawrócony [subject|El] ([evangelized_subjects_count]):\n$BULLET_WITH_TAB$Ma #V [actor.MakeScope.ScriptValue('pam_evangelize_tenet_adoption_chance_value')|0]%#! szansy na przyjęcie dogmatu „[selected_item.GetNameNoTooltip(actor.GetRite)]” jako [Concept('personal_tenet', 'dogmatu osobistego')|E]"
 every_clerical_region_ruler_evangelized_personal_tenet_tt: "Każdy nawrócony [ruler|El] w regionie duchownym o nazwie [clerical_region.GetName] ([evangelized_clerical_region_rulers_count])"
 pam_evangelize_tenet_adopted_message_title: "[tenet_adopter.GetTitledFirstNameNoTooltip] przyjmuje dogmat „[pam_evangelize_tenet.GetNameNoTooltip(tenet_adopter.GetRite)]”"
 decision_every_clerical_region_ruler_evangelized_personal_tenet_tt: "Każdy nawrócony [ruler|El] w regionie duchownym o nazwie [clerical_region.GetName] ([evangelized_clerical_region_rulers_count]):\n$BULLET_WITH_TAB$Ma #V [actor.MakeScope.ScriptValue('pam_evangelize_tenet_adoption_chance_value')|0]%#! szansy na przyjęcie dogmatu „[selected_item.GetNameNoTooltip(actor.GetRite)]” jako [Concept('personal_tenet', 'dogmatu osobistego')|E]"
 pam_evangelize_tenet_adopt_personal_tenet_tt: "Przyjmuje dogmat „[pam_evangelize_tenet.GetNameNoTooltip(actor.GetRite)]” jako [personal_tenet|El]"
 pam_decision_events.0020.t: "Szerz dogmat „[selected_item.GetNameNoTooltip(actor.GetRite)]”"
 pam_decision_events.0020.desc: "Po mszy w regionie o nazwie [clerical_region.GetName] zbieram grupę wiernych, aby mogli ode mnie usłyszeć słowo [ROOT.Char.GetFaith.HighGodNamePossessive]. Wybieram fragment z księgi znanej jako [ROOT.Char.GetFaith.ReligiousText|U], chcąc szerzyć moje wierzenia dotyczące dogmatu, którym jest [selected_item.GetName( actor.GetRite )]:\n\n„[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]”"
 pam_decision_events.0020.a: "W dalszej części tekstu skupię się na pozostałych panach."
 pam_decision_events.0020.b: "Kolejną przypowieść zadedykuję moim wasalom."
 pam_decision_events.0020.c: "Zanurz się w księdze znanej jako [ROOT.Char.GetFaith.ReligiousText|U]."
 pam_persecute_tenet_decision: "Zwalczaj dogmat"
 pam_persecute_tenet_decision_desc: "Nie każdą naukę warto głosić z ambony. Zjadliwymi kazaniami i szeptami kierowanymi w odpowiednie uszy zszargam tę doktrynę, aż nikt nie będzie mieć odwagi jej głosić."
 pam_persecute_tenet_decision_tooltip: "Rozsiewaj oszczerstwa przeciw [Concept('core_tenet', 'dogmatowi')|E] [Concept('known_tenet_status', 'znanemu')|E] wyznawcom twojej [Concept('faith', 'wiary')|E], zmniejszając jego [Concept('tenet_popularity', 'popularność')|E]"
 pam_persecute_tenet_decision_confirm: "[selected_item.GetBaseNameNoTooltip] – zwalczaj"
 pam_persecute_tenet_decision_toast: "Zwalczasz dogmat „[pam_persecute_tenet.GetNameNoTooltip(pam_tenet_persecutor.GetRite)]”"
 pam_persecute_tenet_decision_toast_tt: "Obecna [tenet_popularity|El]: [GuiScope.SetRoot( pam_tenet_persecutor.MakeScope ).AddScope( 'second', pam_persecute_tenet.MakeScope ).Custom( 'pam_tenet_popularity_status' )](#high [pam_tenet_persecutor.GetFaith.GetTenetPopularityScore( pam_persecute_tenet.Self )]#!)"
 pam_persecute_tenet_select_tt: "Należy wybrać [core_tenet|El]"
 pam_persecute_tenet_decision_no_item_selected: "Nie wybrano żadnego [Concept('core_tenet', 'dogmatu')|E]"
 pam_tenet_can_be_persecuted_tt: "Ten [personal_tenet|El] jest #V twój#!"
 # HoF Tenet Stance — shared selection requirement
 pam_tenet_stance_select_tt: "Należy wybrać [core_tenet|El]"
 pam_tenet_stance_can_be_permitted_tt: "Jest już [Concept('permitted_tenet_status', 'dozwolonym')|E] lub [Concept('core_tenet_status', 'fundamentalnym')|E] dogmatem w twojej [Concept('faith', 'wierze')|E]"
 pam_tenet_stance_can_be_prohibited_tt: "Jest już [Concept('prohibited_tenet_status', 'zakazanym')|E] lub [Concept('core_tenet_status', 'fundamentalnym')|E] dogmatem w twojej [Concept('faith', 'wierze')|E]"
 # HoF Tenet Stance — Permit a Tenet decision
 pam_permit_tenet_decision: "Zezwól na dogmat"
 pam_permit_tenet_decision_desc: "Wiedza od dawna przekazywana szeptem w naszej wierze zasługuje na szerszy rozgłos. Niech łaska [ROOT.Char.GetFaith.HighGodNamePossessive] pobłogosławi [core_tenet|El], aby stał się [permitted_tenet_status|El]."
 pam_permit_tenet_decision_tooltip: "Przyjmij [core_tenet|El] za [permitted_tenet_status|El] w wierze o nazwie [ROOT.Char.GetFaith.GetName|l] i ogłoś go każdemu władcy wyznającemu tę wiarę."
 pam_permit_tenet_decision_confirm: "Udziel błogosławieństwa [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pam_permit_tenet_decision_no_item_selected: "Nie wybrano żadnego [Concept('core_tenet', 'dogmatu')|E]"
 # HoF Tenet Stance — Forbid a Tenet decision
 pam_prohibit_tenet_decision: "Zakaż dogmatu"
 pam_prohibit_tenet_decision_desc: "Nauki zbaczające z drogi prawdy trzeba nazywać po imieniu. Uznaj [core_tenet|El] za [prohibited_tenet_status|El], aby wierni mogli go unikać."
 pam_prohibit_tenet_decision_tooltip: "Uznaj [core_tenet|El] za [prohibited_tenet_status|El] w wierze o nazwie [ROOT.Char.GetFaith.GetName] i ogłoś to każdemu władcy wyznającemu tę wiarę."
 pam_prohibit_tenet_decision_confirm: "Wydaj zakaz"
 pam_prohibit_tenet_decision_no_item_selected: "Nie wybrano żadnego [Concept('core_tenet', 'dogmatu')|E]"
 pam_decision_events.0011.opening: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] ze wszystkich stron!"
 pam_decision_events.0011.desc.permitted: "Zatwierdzam tę sprawę swoim imieniem. Od dziś dogmat „[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]” należy do akceptowanych nauk wiary.\n\nNiech ci, którzy praktykowali ten dogmat, przestaną kryć się w cieniu."
 pam_decision_events.0011.desc.prohibited: "Zatwierdzam tę sprawę swoim imieniem. Od dziś dogmat „[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]” zostaje wyklęty. Każda osoba, która zwróci się w jego stronę, odejdzie od wiary."
 pam_decision_events.0011.desc.fallback: "Wydaję proklamację dotyczącą dogmatu „[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]”."
 pam_decision_events.0011.b: "Wciąż jednak wierzę w tę naukę…"
 pam_decision_events.0012.opening: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] ze wszystkich stron!"
 pam_decision_events.0012.desc: "[bull_issuer.GetTitledFirstName] uznaje obrządek znany jako [heresy_rite.GetName|l] za herezję.\n\nNiech każdy władca wyznający naszą wiarę weźmie to sobie do serca."
 pam_decision_events.0012.a: "Niech tak będzie."
 pam_decision_events.0013.opening: "Do osoby niegdyś zaliczanej w poczet wiernych, którą jest [ROOT.Char.GetTitledFirstNameNoTooltip]."
 pam_decision_events.0013.desc.intro: "Stało się. [heresy_rite.GetName] uznaje się za herezję, a wszyscy, którzy praktykują ten obrządek, zostali całkowicie odcięci od wiary znanej jako [bull_issuer.GetFaith.GetName|l]."
 pam_decision_events.0013.desc.outro: "\n\nWybór należy do ciebie: uklęknij raz jeszcze i wróć na łono wspólnoty albo trwaj w błędzie, a wtedy czeka cię potępienie."
 pam_decision_events.0013.a: "Będziemy działać samodzielnie i z radością."
 pam_decision_events.0013.b: "Nie pozwolę, by mnie wyrzucono. Przyjmijcie mnie z powrotem."
 pam_tenet_stance_judgement_personal_permit: "Moja modlitwa została wysłuchana!"
 pam_tenet_stance_judgement_personal_prohibit: "Muszę chronić moje modlitwy przed wścibskimi oczami…"
 pam_tenet_stance_judgement_aligned_permit: "Przyjmuję to z radością!"
 pam_tenet_stance_judgement_aligned_prohibit: "Ta nauka to herezja? To dzieło sił nieczystych…"
