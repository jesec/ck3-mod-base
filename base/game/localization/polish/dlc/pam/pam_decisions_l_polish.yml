l_polish:
 pam_invite_syncretic_exiles_decision: "Zaproś wygnańców synkretycznych"
 pam_invite_syncretic_exiles_decision_desc: "Społeczności na wygnaniu wyznające religię, którą szanujemy, wędrują w poszukiwaniu bezpiecznego domu. Mogę ich zaprosić, aby osiedlili się w moim państwie i podzielili się swoimi tradycjami."
 pam_invite_syncretic_exiles_decision_tooltip: "Zaproś wygnańców wyznających religię z grupy uznawanej w twoim osobistym synkretyzmie. Zapewni to wzrost [Concept('development', 'rozwoju')|E], ale poskutkuje zmianą lokalnej [Concept('faith', 'wiary')|E] lub [Concept('rite', 'obrządku')|E].\n\nTo działanie kosztuje dużą ilość [Concept('piety', 'pobożności')|E]."
 pam_invite_syncretic_exiles_decision_confirm: "Zaproś wygnańców"
 pam_invite_syncretic_exiles_decision_effect: "Przybędzie do ciebie grupa wygnańców, prosząc o możliwość zamieszkania w twoich [Concept('counties', 'hrabstwach')|E]. Zapewni to wzrost [Concept('development', 'rozwoju')|E], ale poskutkuje zmianą lokalnej [Concept('faith', 'wiary')|E] lub [Concept('rite', 'obrządku')|E]."
 pam_invite_syncretic_exiles_no_pool: "Nie ma pasujących wygnańców religijnych, których można zaprosić"
 SELECT_TENET: "Wybierz dogmat"
 REPLACE_TENET: "Zastąp dogmat"
 SELECT_HOLY_SITE: "Wybierz miejsce święte"
 puppet_cost_desc: "[Character.GetName],"
 pam_decision_confession_name: "Wysłuchaj spowiedzi"
 pam_decision_confession_name_low: "Wyznaj swoje grzechy"
 pam_decision_confession_desc: "Gdy [ROOT.Char.GetWomanMan] uświadamia sobie winę, którą nosi w sercu, musi wyznać swoje grzechy."
 pam_decision_confession_tooltip: "Wyznaj swoje grzechy"
 pam_decision_confession_tooltip_sp_effect: "Zyskasz pewien stopień [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 pam_decision_confession_tooltip_stress_effect: "Zredukujesz trochę [Concept('stress', 'stresu')|E]"
 pam_decision_confession_confirm: "Wezwij osobę duchowną ([ROOT.Char.GetFaith.PriestNeuter|l])"
 sp_confession_decision_tooltip: "Twoje [spiritual_fulfillment|El] wynosi co najmniej #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_confession_sp_court_chaplain: "Zatrudniasz [Concept('court_chaplain', 'nadwornego kapelana')|E]"
 pam_decision_events.0001.t: "Spowiedź"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName] cierpliwie czeka w pustej kaplicy.\n\n"
 pam_decision_events.0001.desc.bad: "[chaplain.GetHerHis|U] surowe spojrzenie jest tym, czego oczekuję od ojca."
 pam_decision_events.0001.desc.good: "Nawet jeśli ciężar na moich barkach jest niewielki, wciąż mogę go zmniejszyć."
 pam_decision_events.0001.desc.neutral: "Podchodzę do [chaplain.Custom('PL_niego_niej')] niczym zagubiona owieczka niepewna czystości własnego serca."
 pam_decision_events.0001.desc.sin.preamble: "\n\nPoczucie winy, jakie odczuwam z powodu moich grzechów, nie jest mi obce."
 pam_decision_events.0001.desc.sin.lustful: "Pozwalam, by pożądanie zawładnęło moją wolą."
 pam_decision_events.0001.desc.sin.chaste: "Moja czystość jest zimną przystanią, do której uciekam przed obowiązkami."
 pam_decision_events.0001.desc.sin.gluttonous: "Karmię ciało ponad wszelkie granice."
 pam_decision_events.0001.desc.sin.temperate: "Moja powściągliwość sprawia, że ignoruję własne potrzeby."
 pam_decision_events.0001.desc.sin.greedy: "Trzymam złoto, podczas gdy należy się nim dzielić."
 pam_decision_events.0001.desc.sin.generous: "Moja hojność pokonuje rozsądek i pozostawia mnie w biedzie."
 pam_decision_events.0001.desc.sin.lazy: "Lenistwo powstrzymuje mnie od modlitwy i wypełniania obowiązków."
 pam_decision_events.0001.desc.sin.diligent: "Moja gorliwość w pracy wypiera miłosierdzie."
 pam_decision_events.0001.desc.sin.wrathful: "Gniew skłania mnie do grzechu."
 pam_decision_events.0001.desc.sin.calm: "Mój spokój jest obojętnością udającą cnotę."
 pam_decision_events.0001.desc.sin.patient: "Cierpliwość przeradza się w tchórzliwe zwlekanie."
 pam_decision_events.0001.desc.sin.impatient: "Niecierpliwość wywołuje we mnie szorstkość i porywczość."
 pam_decision_events.0001.desc.sin.arrogant: "Duma wypełnia moje serce."
 pam_decision_events.0001.desc.sin.humble: "Fałszywa pokora odciąga mnie od prawdy."
 pam_decision_events.0001.desc.sin.deceitful: "Wypowiadam kłamstwa i ukrywam to, co należy szczerze wyznać."
 pam_decision_events.0001.desc.sin.honest: "Moja bezceremonialna szczerość rani tam, gdzie należy okazać delikatność."
 pam_decision_events.0001.desc.sin.craven: "Strach sprawia, że porzucam to, co słuszne."
 pam_decision_events.0001.desc.sin.brave: "Moja śmiałość przeważa nad rozwagą i przeradza się w lekkomyślność."
 pam_decision_events.0001.desc.sin.shy: "Nieśmiałość powstrzymuje mnie przed czynieniem dobra."
 pam_decision_events.0001.desc.sin.gregarious: "Miłość do towarzystwa zagłusza moje sumienie."
 pam_decision_events.0001.desc.sin.ambitious: "Moja ambicja przeważa nad sumieniem."
 pam_decision_events.0001.desc.sin.content: "Zadowolenie z życia stępiło we mnie głód prawości."
 pam_decision_events.0001.desc.sin.arbitrary: "Rządzę, kierując się kaprysem, a nie sprawiedliwością."
 pam_decision_events.0001.desc.sin.just: "Wymierzana przeze mnie sprawiedliwość jest bezlitosna i dumna."
 pam_decision_events.0001.desc.sin.cynical: "Cynizm podkopuje moją wiarę."
 pam_decision_events.0001.desc.sin.zealous: "Zapał płonie silniej niż miłość do bliźniego."
 pam_decision_events.0001.desc.sin.paranoid: "Podejrzliwość zatruwa moje relacje z innymi."
 pam_decision_events.0001.desc.sin.trusting: "Ufność sprawia, że nie dostrzegam niegodziwości."
 pam_decision_events.0001.desc.sin.compassionate: "Współczucie skłania mnie do usprawiedliwienia uczynków, które należałoby potępić."
 pam_decision_events.0001.desc.sin.callous: "Moje serce stało się nieczułe na cierpienie innych."
 pam_decision_events.0001.desc.sin.stubborn: "Upór sprawia, że nie biorę pod uwagę rad."
 pam_decision_events.0001.desc.sin.fickle: "Zmienność sprawia, że moje słowo straciło na wiarygodności."
 pam_decision_events.0001.desc.sin.eccentric: "Moje ekscentryczne zachowanie wywołuje oburzenie wśród wiernych."
 pam_decision_events.0001.desc.sin.vengeful: "Pochłania mnie żądza zemsty."
 pam_decision_events.0001.desc.sin.forgiving: "Zbyt łatwo przebaczam poważne wykroczenia."
 pam_decision_events.0001.desc.sin.sadistic: "Czerpię przyjemność z okrucieństwa."
 pam_decision_events.0001.desc.outro: "\n\n„[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]”"
 pam_decision_events.0001.a: "Niech [chaplain.GetMotherFather] odpuści mi moje winy."
 pam_john_20_22_english: "Przyjmijcie Ducha Świętego. Którym odpuścicie grzechy, są im odpuszczone; którym zatrzymacie, są im zatrzymane."
 JOHN_20_22_GLOSS: "#weak J 20:22–23, tłum. własne#!"
 pam_decision_act_of_devotion: "Zaplanuj akt oddania"
 pam_decision_act_of_devotion_desc: "Moje uwielbienie wobec [ROOT.Char.GetFaith.HighGodNamePossessive] jest tak silne, że muszę to pokazać każdemu!\n\nNiech zjawi się tu [ROOT.Char.GetFaith.PriestNeuterPlural|l], odprawimy wielką mszę i zwołamy wszystkich poddanych. Zobaczą, jak oddany jest im ich senior."
 pam_decision_act_of_devotion_desc_tooltip: "Wymień [piety|El] na [prestige|El]"
 pam_decision_act_of_devotion_tooltip_effect: "Wybierzesz jedną z następujących opcji:\n$BULLET_WITH_TAB$ [prestige_i] [prestige|E]: #P [EmptyScope.ScriptValue('major_prestige_gain')|0]#!\n$BULLET_WITH_TAB$ [prestige_i] [prestige|E]: #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! i dodatkowy [prestige_level|El] w zamian za [piety_level|El]"
 pam_decision_act_of_devotion_confirm: "Niech zabiją dzwony!"
 pam_decision_act_of_devotion_sp_tooltip: "Twoje [spiritual_fulfillment|El] wynosi co najmniej #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "Twój [prestige_level|El] musi być poniżej następującego poziomu: „[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]”"
 pam_confession_penalty_modifier: "Kara za spowiedź"
 pam_confession_penalty_modifier_desc: "Ta postać musi podjąć działanie na polecenie swojego spowiednika"
 pam_meddled_in_clerical_appointments_modifier: "Ingerencja w mianowanie duchownych"
 pam_meddled_in_clerical_appointments_modifier_desc: "Ten [ruler|El] siłą zastąpił [Concept('holder', 'właściciela')|E] [Concept('clerical_title', 'tytułu duchownego')|E], wywołując tym gniew [Concept('clergy', 'duchowieństwa')|E]."
 pam_kowtowed_to_pope_modifier: "Uległość wobec Kościoła"
 pam_kowtowed_to_pope_modifier_desc: "Ten [ruler|El] ugiął się przed Kościołem i zobowiązał się poprzeć doktrynę #EMP „Duchowy, odwoływalny”#! podczas soboru kończącego [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]. Modyfikator zostanie usunięty, gdy sobór rozstrzygnie spór."
 pam_kowtow_to_pope_decision: "Okaż uległość wobec głowy wiary, którą jest [ROOT.Char.GetFaith.ReligiousHeadName|l]"
 pam_kowtow_to_pope_decision_desc: "Korona i pastorał pozostają w zaciekłym sporze o prawo mianowania duchownych. Zamiast ryzykować jawny sprzeciw, klęknij przed osobą, którą jest [ROOT.Char.GetFaith.ReligiousHeadName|l], i stań po stronie wiernych, gdy zwołany zostanie wielki sobór w celu rozstrzygnięcia tej kwestii."
 pam_kowtow_to_pope_decision_tooltip: "Zadeklaruj poparcie dla roszczeń Kościoła do prawa mianowania duchownych"
 pam_kowtow_to_pope_decision_confirm: "Okaż uległość"
 pam_kowtow_to_pope_effect_tt: "Podczas soboru kończącego [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] poprzesz doktrynę #EMP „Duchowy, odwoływalny”#!"
 pam_kowtow_to_pope_not_already_pledged_tt: "Nie zadeklarowano jeszcze poparcia dla Kościoła"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "Twoja [faith|El] musi mieć [Concept('head_of_faith', 'głowę wiary')|E]"
 pam_kowtow_to_pope_toast: "Okazujesz uległość wobec głowy wiary, którą jest [ROOT.Char.GetFaith.ReligiousHeadName|l]"
 pam_decision_events.0001.a.confession_random_outcome: "Twój [court_chaplain|El] może ci coś nakazać albo możesz usłyszeć coś podczas spowiedzi…"
 pam_decision_events.0001.a.piety: "Twoja spowiedź była szczera"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUINameNotMe] dowiaduje się czegoś nowego"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUINameNotMe] nie pochwala twoich grzesznych cech"
 pam_decision_events.0001.a.courtier_secret: "Słyszysz, jak [my_courtier.GetShortUINameNotMe] się spowiada"
 pam_decision_events.0001.a.random_confession: "Słyszysz, jak ktoś inny się spowiada"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.GetShortUINameNotMe] nakazuje ci udać się na [Concept('pilgrimage', 'pielgrzymkę')|E]"
 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUINameNotMe] nakazuje ci zatrudnić kogoś na stanowisku, którym jest [GetCourtPositionType('high_almoner_court_position').GetName()|l]"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUINameNotMe] nakazuje ci nie wypowiadać wojen ofensywnych przez #V 5 lat#!"
 pam_confession_penalty_var.no_war_toast: "Przysięgasz nie wypowiadać żadnych wojen"
 pam_decision_events.0001.a.conversion: "[chaplain.GetShortUINameNotMe] nakazuje ci nawrócić osobę znaną jako [target.GetShortUINameNotMe]"
 pam_decision_events.0001.a.conversion.toast: "Dotrzymujesz swojej obietnicy"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.GetShortUINameNotMe] dotrzymuje swojej obietnicy"
 pam_decision_events.0002.t: "Przejaw oddania"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName] stoi obok mnie, obok ołtarza. Delikatne promienie słońca oświetlają"
 pam_decision_events.0002.desc.uncrowned: "moje ubranie niczym święty płaszcz."
 pam_decision_events.0002.desc.crowned: "moją koronę, tworząc aureolę."
 pam_decision_events.0002.desc.mid: "\n\n„[ROOT.Char.Custom('RandomBibleQuote')]”. [my_chaplain.GetName] kontynuuje swoje kazanie,"
 pam_decision_events.0002.desc.bad: "a ja z trudem staram się skupić na nim uwagę."
 pam_decision_events.0002.desc.good: "a obecni wydają się skupiać wyłącznie na mnie."
 pam_decision_events.0002.desc.neutral: "a ja rozglądam się po obecnych, poszukując na ich twarzach zachwytu."
 pam_decision_events.0002.desc.outro: "\n\n„Niech [ROOT.Char.GetNameNoTooltip] oraz [ROOT.Char.Custom('PL_jego_jej')] mądrość i cnotliwość prowadzą nas w tych trudnych czasach”."
 pam_decision_events.0002.a: "Muszę przemówić do tłumu."
 pam_decision_events.0002.b: "Wystarczy krótkie potwierdzenie."
 pam_mentor_sp_decision: "Zapewnij duchowe przewodnictwo"
 pam_mentor_sp_decision_desc: "My, którzy kroczymy w świetle [ROOT.Char.GetFaith.HighGodNamePossessive], winni jesteśmy prowadzić tych, którzy błądzą w ciemności, oraz tych, których młodość może skłonić do zbłądzenia myślą lub czynem."
 pam_mentor_sp_decision_desc_tooltip: "Pomóż dziecku osiągnąć [spiritual_fulfillment|El]"
 pam_mentor_sp_decision_confirm: "Mów i słuchaj."
 pam_mentor_sp_decision_sp_tooltip: "Twoje [spiritual_fulfillment|El] wynosi co najmniej #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_mentor_sp_decision_tooltip_effect: "Zwiększysz [spiritual_fulfillment|El] swojego [Concept('primary_heir', 'dziedzica głównego')|E] lub [Concept('favorite_child', 'ulubionego dziecka')|E]"
 pam_mentor_sp_decision_valid_child_tt: "Musisz mieć [child|El], które:\n$BULLET_WITH_TAB$wyznaję tę samą [Concept('faith', 'wiarę')|E] co ty,\n$BULLET_WITH_TAB$ma co najmniej #V 16#! lat,\n$BULLET_WITH_TAB$jest twoim [Concept('primary_heir', 'dziedzicem głównym')|E] lub [Concept('favorite_child', 'ulubionym dzieckiem')|E],\n$BULLET_WITH_TAB$ma [spiritual_fulfillment|El] wynoszące mniej niż #V 75#!,\n$BULLET_WITH_TAB$nie miało wcześniej zapewnionego duchowego przewodnictwa."
 pam_mentor_sp_decision_primary_heir_tt: "Twój [primary_heir|El] musi:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "Dziedzic główny"
 pam_mentor_sp_decision_primary_favorite_child_tt: "Twoje [favorite_child|El] musi:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "Ulubione dziecko"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$wyznawać tę samą [Concept('faith', 'wiarę')|E] co ty,\n$BULLET_WITH_TAB$mieć co najmniej #V 16#! lat,\n$BULLET_WITH_TAB$mieć [spiritual_fulfillment|El] wynoszące mniej niż #V 75#!,\n$BULLET_WITH_TAB$nie mieć wcześniej zapewnionego duchowego przewodnictwa."
 pam_decision_events.0003.t: "Najważniejsza lekcja"
 pam_decision_events.0003.desc.intro: "Zapadła noc i w twierdzy panuje cisza. [target_child.Custom('GetDaughterSon')|U] siedzi obok mnie w prywatnej kaplicy.\n\nZerkam na [target_child.Custom('PL_niego_nia')]."
 pam_decision_events.0003.desc.bad: "Widzę [target_child.GetHerHis] zapadnięte policzki, obojętne spojrzenie, prawie śpi na siedząco.\n\n– Niech [ROOT.Char.GetMotherFather] mi powie – pyta z niecierpliwością – po co mnie tu wezwano?"
 pam_decision_events.0003.desc.good: "[target_child.GetHerHis|U] oczy błyszczą blaskiem świecy. To dobre dziecko.\n\n– Niech [ROOT.Char.GetMotherFather] mi powie, czy moje czyny cię uraziły? – pyta."
 pam_decision_events.0003.desc.neutral: "To cudowna osoba. I jest już w odpowiednim wieku.\n\n– Niech [ROOT.Char.GetMotherFather] mi powie – pyta cicho – jak żyć właściwie?"
 pam_decision_events.0003.a: "Zgnilizna osoby znanej jako [ROOT.Char.GetTitleAsNameNoTooltip] wkrótce zatruje miejsce, którym jest [target_child.GetHerHis] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 pam_decision_events.0003.b: "Po prostu… bądź dobrym człowiekiem."
 grudge_pressured_me_sp: "Osoba, którą jest [CHARACTER.GetShortUINameNotMe], zaczęła chować urazę wobec osoby znanej jako [TARGET_CHARACTER.GetShortUINameNotMe] za to, że wywiera na [CHARACTER.Custom('PL_niego_nia')] nacisk w sprawie spełnienia duchowego."
 grudge_pressured_me_sp_corresponding: "Osoba, którą jest [CHARACTER.GetShortUINameNotMe], stała się obiektem urazy chowanej przez osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe], [CHARACTER.GetShortUINameNotMe] wywiera bowiem na [TARGET_CHARACTER.Custom('PL_niego_nia')] nacisk w sprawie spełnienia duchowego."
 pam_decision_events.0003.after_tt: "Może dowiemy się czegoś, co dotyczy osoby znanej jako [target_child.GetFirstName]…"
 pam_decision_events.0003.secret: "[target_child.GetShortUINameNotMe] ci się zwierza"
 pam_decision_events.0003.mystic: "[target_child.GetShortUINameNotMe] wykazuje duże zainteresowanie tą sprawą"
 pam_decision_events.0003.learning: "[target_child.GetShortUINameNotMe] poszerza swoją wiedzę"
 pam_decision_events.0003.education: "[target_child.GetShortUINameNotMe] zdobywa lepsze wykształcenie"
 pam_decision_events.0003.stress: "[target_child.GetShortUINameNotMe] przechodzi kryzys"
 pam_decision_events.0003.lover: "[target_child.GetShortUINameNotMe] zrywa z osobą znaną jako [lover_scope.GetShortUINameNotMe]"
 pam_decision_events.0003.trait: "[target_child.GetShortUINameNotMe] doznaje olśnienia"
 pam_establish_theocratic_dynasty_decision: "Zapoczątkuj dynastię"
 pam_establish_theocratic_dynasty_decision_desc: "Z najskromniejszych korzeni może wyrosnąć najpotężniejsze drzewo."
 pam_establish_theocratic_dynasty_decision_desc_tooltip: "Zapoczątkuj własną [Concept('dynasty', 'dynastię')|E]"
 pam_establish_theocratic_dynasty_decision_confirm: "Nadszedł czas"
 pam_establish_theocratic_dynasty_decision_effects_tt: "Zapoczątkujesz własną [Concept('dynasty', 'dynastię')|E]"
 pam_decision_events.0004.t: "Nowy początek"
 pam_decision_events.0004.desc: "Od lat noszę szaty liturgiczne zamiast sztandaru, a jednak udało mi się zyskać pozycję i władzę.\n\nDlaczego zatem moje dziedzictwo miałoby zniknąć wraz ze mną tylko dlatego, że nie pochodzę ze znanej rodziny?"
 pam_decision_events.0004.a: "#EMP [ROOT.Char.GetHouse.GetMotto].#!"
 pam_decision_events.0004.tt: "#high Dynastia [THIS.Char.GetDynasty.GetName] została zapoczątkowana#!"
 pam_determine_patron_saint_decision: "Wybierz patrona spośród świętych"
 pam_determine_patron_saint_decision_desc: "Ze swoich niebiańskich tronów święci przyglądają się zmaganiom śmiertelnych władców i oceniają usposobienie naszych dusz.\n\nPozwól mi wybrać patrona, którego cnota wyznaczy moją ścieżkę, i którego wstawiennictwo zapewni mi wsparcie [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] i ludzi."
 pam_determine_patron_saint_decision_tooltip: "Wybierz patrona, którego cnotami będziesz się kierować w życiu"
 pam_determine_patron_saint_decision_confirm: "Decyzja zapadła."
 pam_determine_patron_saint_decision_dulia_tt: "Dogmat „[GetTenetType('tenet_dulia').GetBaseName]” musi być dozwolony albo musi być [Concept('core', 'fundamentem')|E] [Concept('faith', 'wiary')|E]"
 pam_determine_patron_saint_decision_personal_tenet_tt: "Musi posiadać dogmat „[GetTenetType('tenet_dulia').GetBaseName] jako [personal_tenet|El]"
 pam_determine_patron_saint_decision_peter: "Święty Piotr Skała"
 pam_determine_patron_saint_decision_paul: "Święty Paweł Apostoł Narodów"
