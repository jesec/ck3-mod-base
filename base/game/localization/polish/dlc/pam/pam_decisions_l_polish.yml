 pam_decision_last_rites_name_low: "Przyjmij ostatnie namaszczenie"
 pam_decision_last_rites_desc: "#EMP Zmiłuj się nade mną. Obmyj mnie dokładnie z mojej nieprawości i oczyść z mojego grzechu.#!\n\nW obliczu rychłego odejścia z tego cielesnego bytu pragnę przygotować moją duszę. Odporność przeciw piekielnym wpływom da mi szansę zaznać dobrej śmierci i życia wiecznego w Królestwie Niebieskim."
 pam_decision_last_rites_tooltip: "Przygotuj swoją duszę na odejście"
 pam_decision_last_rites_tooltip_sp_effect: "Zyskasz pewien stopień @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E]"
 pam_decision_last_rites_confirm: "Zgromadźcie się przy moim łożu"
 pam_decision_last_rites_sp_tooltip: "Twoje [spiritual_fulfillment|El] wynosi co najmniej #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_doctrine_tt: "[faith|E] musi mieć [Concept('doctrine', 'doktrynę')|E] „[GetDoctrineType('doctrine_sacraments_central').GetBaseName]”"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X Jeśli nie przyjmiesz ostatniego namaszczenia:\n$BULLET_WITH_TAB$stracisz [legitimacy_i] [EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$każdy [GetVassalStance( 'zealot' ).GetTextIcon] fanatycznie religijny [vassal|El] ([THIS.ScriptValue('number_of_zealot_vassals')|V0]):\n$TAB$$BULLET_WITH_TAB$straci #N 30#! pkt [Concept('opinion', 'opinii')|E] na #V twój#! temat #!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Być może zajdzie konieczność zdradzenia przez ciebie [Concept('secret', 'sekretu')|E]"
 pam_decision_events.0005.details: "Będziesz mieć możliwości [Concept('lease', 'dzierżawy')|E] [Concept('titles', 'tytułów')|E], a jeśli żaden nie będzie dostępny, możesz przekazać [gold|El] na rzecz [Concept('monastic_holy_orders', 'zakonów monastycznych')|E], [Concept('holy_orders', 'zakonów wojskowych')|E] lub [Concept('the_christian_church', 'kościoła chrześcijańskiego')|E] – to zapewni korzystne [modifiers|El] twojemu [Concept('player_heir', 'następcy')|E]"
 pam_decision_events.0005.t: "Ostatnie namaszczenie: nadszedł mój kres"
 pam_decision_events.0005.desc.healthtrait: "[death_trait.GetName(soon_dead)] to ja. Grzech to sprawił i jest prawdopodobną przyczyną mojej nieuchronnej śmierci."
 pam_decision_events.0005.desc.bad: "Z trudem czczę [ROOT.Char.GetFaith.HighGodNamePossessive], a w swej arogancji staram się ukryć mój grzech przed jego wszystkowidzącymi oczami.\n\n"
 pam_decision_events.0005.desc.good: "Na szczęście czuję bliską obecność aniołów. Strzegą one mojej duszy przed demonami, które chciałyby ją posiąść.\n\n"
 pam_decision_events.0005.desc.neutral: "Choć staram się czcić [ROOT.Char.GetFaith.HighGodNamePossessive], stając u progu wieczności, martwię się, czy moja dusza zostanie uznana za godną Królestwa Niebieskiego.\n\n"
 pam_decision_events.0005.desc.notalone: "U mego boku trwają [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))], [fam_or_friend_1.GetFirstName] i inni, i wszyscy będą się modlić za moją duszę."
 pam_decision_events.0005.desc.alone: "Trzęsę się ze strachu. Nie ma przy mnie nikogo bliskiego, kto mógłby pomodlić się za moją duszę."
 pam_decision_events.0005.desc.outro: "Mój spowiednik, trzymając w ręku [Glossary('sakramentarz','SACRAMENTARY_GLOSS')], radzi mi:\n\n– Stań w obliczu [ROOT.Char.GetFaith.HighGodNamePossessive], niczego nie ukrywając!\n\nNawet król Dawid, splamiony grzechem, został oczyszczony po swojej spowiedzi… [Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "Przed nami sakrament pokuty."
 pam_decision_events.0005.b: "Niech mnie diabli! Pozbądźcie się tego księdza."
 pam_psalm_51_english: "„Przeciw Tobie grzeszę i czynię, co złe jest w Twoich oczach, a ty okazujesz sprawiedliwość w swym wyroku i prawość w osądzie”."
 SACRAMENTARY_GLOSS: "Sakramentarz, czyli #EMP liturgikon#!, to księgi używane podczas nabożeństw przez chrześcijańskiego biskupa lub kapłana. W zależności od epoki i regionu mogły zawierać teksty do recytacji lub śpiewu, a także formuły do udzielania sakramentów."
 pam_decision_events.0006.t: "Ostatnie namaszczenie: grzech mój zawsze stoi przede mną"
 pam_decision_events.0006.intro: "– Błądzić jest rzeczą ludzką. Ale bez spowiedzi nie ma rozgrzeszenia – mówi [confessor.GetTitledFirstName]."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\nMoje grzechy są poważne i liczne. Dusza moja przytłoczona jest nimi, uwięziona w palących szponach szatana, który zamierza zabrać to, co ewidentnie mu się należy.\n\n"
 pam_decision_events.0006.desc.good: "\n\nCzuję w sercu spokój, gdyż moje postępowanie jest zgodne z wolą Pana.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nJestem tylko człowiekiem i mimo najlepszych chęci nie udało mi się uniknąć grzechu.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "[my_sinful_trait.GetName(soon_dead)] to ja. Jakże często moja natura sprowadzała mnie na manowce!"
 pam_decision_events.0006.desc.secret_sin: "W najciemniejszych zakamarkach duszy coś ukrywam. Moją tajemnicą jest [my_secret.GetName|l]"
 pam_decision_events.0006.desc.my_criminal_trait_sin: "[my_criminal_trait.GetName(soon_dead)] to ja! Nic gorszego nie mogło mnie spotkać! Duszące poczucie winy dławi każdy mój oddech."
 pam_decision_events.0006.desc.sin_default: "Trudno mi przywołać w pamięci moje grzechy, choć z pewnością są liczne. Gdy [confessor.GetTitledFirstNameNoTooltip] zwróci się ku mnie i zacznę mówić, ani chybi popłyną niczym ocean przelewający się przez tamę."
 pam_decision_events.0006.desc.sin_default_good_sp: "Niech [ROOT.Char.GetFaith.HighGodName] skruszy moje kości i wymaże nieprawość."
 pam_decision_events.0006.desc.outro: "Muszę wyznać swoje grzechy i okazać należytą skruchę, inaczej odmówią mi Eucharystii."
 pam_decision_events.0006.a: "„Niech [confessor.GetMotherFather] mi wybaczy…”"
 pam_decision_events.0006.b: "Niektóre grzechy lepiej zabrać ze sobą do grobu."
 pam_decision_events.0006.b.flavor: "Wyznajesz niektóre grzechy, ale nie zdradzasz tajemnic, które mogłyby zaszkodzić innym."
 pam_decision_events.0007.t: "Ostatnie namaszczenie: ciało, krew i olej"
 pam_decision_events.0007.intro: "– Tak oto minął rachunek moich grzechów. Czym innym jest być dłużnym zaledwie grosz, a czym innym dziesiątki tysięcy talentów.\n\nMój spowiednik podaje konsekrowane chleb i wino."
 pam_decision_events.0007.desc.bad: "Nawet teraz, gdy ofiarowane są ciało i krew mojego Pana, słyszę podszepty zła, które błaga mnie o moją duszę. To pozwoliłoby mi żyć dalej i oddawać się przyjemnościom tego świata.\n\n"
 pam_decision_events.0007.desc.good: "Zrzuciwszy z siebie ciężar grzechu, rzucam się w objęcia śmierci. Pragnę spożyć ciało i krew mojego Pana, u boku którego wkrótce stanę.\n\n"
 pam_decision_events.0007.desc.neutral: "Niech ciało i krew Pana chronią mnie przed demonami, które czyhają niczym wilki, by porwać mnie, zanim nadejdzie mój czas.\n\n"
 pam_decision_events.0007.desc.oil.intro: "Następnie namaszcza moje czoło, dłonie i stopy świętym olejem."
 pam_decision_events.0007.desc.oil.bad: "Moja dusza pozostaje niespokojna.\n\n"
 pam_decision_events.0007.desc.oil.good: "Moja dusza promienieje miłością Pana.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "Moja dusza jest gotowa do swojej podróży.\n\n"
 pam_decision_events.0007.desc.outro: "[Glossary('Wiatyk','VIATICUM_GLOSS')] i [Glossary('namaszczenie','UNCTION_GLOSS')] zostały mi udzielone, zatem mogę zająć się tym, kto będzie się za mnie modlić."
 VIATICUM_GLOSS: "Łacińskie słowo viaticum oznacza „zaopatrzenie na drogę”. W chrześcijaństwie jest to nazwa Komunii Świętej udzielanej w czasie ostatniego namaszczenia. Człowiek, który ją przyjmuje, wyrusza w swoją ostateczną wędrówkę – przejście do życia wiecznego."
 UNCTION_GLOSS: "Ostatnie namaszczenie to określenie namaszczenia chorych olejem świętym, udzielanego „w ostateczności”, czyli w obliczu zbliżającej się śmierci. Obrzęd ten ma przygotować człowieka na przejście do życia wiecznego."
 pam_decision_events.0007.a: "Niech zakon znany jako [monastic_order.GetName] modli się za mnie."
 pam_decision_events.0007.b: "Zakon znany jako [military_order.GetName] zyskałby moje poparcie."
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip] może wziąć mój dobytek, a ja skorzystam z [religious_head.GetHerHis] modlitw."
 pam_decision_events.0007.d: "Wystarczy pobożne słowo skierowane do osoby znanej jako [confessor.GetTitledFirstNameNoTooltip]."
 pam_last_rites_monastic_order_donation_modifier: "Poprzednik podczas ostatniego namaszczenia przekazał darowiznę na rzecz zakonu monastycznego"
 pam_last_rites_military_order_donation_modifier: "Poprzednik podczas ostatniego namaszczenia przekazał darowiznę na rzecz zakonu wojskowego"
 pam_last_rites_church_donation_modifier: "Poprzednik podczas ostatniego namaszczenia przekazał darowiznę na rzecz kościoła"
