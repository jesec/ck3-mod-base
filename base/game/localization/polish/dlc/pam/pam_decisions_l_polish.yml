 pam_decision_events.0019.t: "Obrońca pielgrzymów"
 pam_decision_events.0019.desc: "Wszyscy [ROOT.Char.GetFaith.GetAdherentNamePlural|l] otrzymają ode mnie list:\n\n„Szlaki prowadzące do miejsc świętych stały się niebezpieczne. Niniejszym ogłaszam, że wierni mogą nosić broń podczas pielgrzymki i bronić się przed każdym, kto stanie na drodze do raju”."
 pam_decision_events.0019.a: "Panie, wzmocnij nasze ramiona."
 pam_decision_events.0018.opening: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] ze wszystkich stron!"
 pam_decision_events.0018.desc.armed_pilgrimages: "Przypieczętowuję tę sprawę. Od dziś dogmat „[GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )]” będzie należeć do podstawowych nauk, które uznaje wiara [hof_scope.GetFaith.GetAdjective|l].\n\nNiech każdy przywódca tego wyznania ma to na uwadze."
 pam_decision_events.0018.desc.struggle_submission: "Przypieczętowuję tę sprawę. Od dziś dogmat „[GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )]” będzie należeć do podstawowych nauk, które uznaje wiara [hof_scope.GetFaith.GetAdjective|l].\n\nNiech każdy przywódca tego wyznania ma to na uwadze."
 pam_decision_events.0018.a: "Niech tak będzie."
 pam_decision_events.0017.t: "Wznieś chaczkar przodków"
 pam_decision_events.0017.desc: "Wybieram wzniesienie z widokiem na miejsce o nazwie [khachkar_location.GetNameNoTier], aby postawić tam kamienny krzyż.\n\nPozwolę mistrzom rzeźbiarstwa stworzyć coś prawdziwie wzniosłego, co należycie upamiętni osobę znaną jako [khachkar_ancestor.GetTitledFirstNameNicknamed] – krzyż otoczony rozetami, ornamentami i napisem potwierdzającym, że [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] zmarłej osoby oddaje hołd jej pamięci.\n\nNiech miejscowi pielgrzymi modlą się pod nim, a wszyscy zobaczą, że jesteśmy prawowitymi władcami tej ziemi."
 pam_decision_events.0017.a: "Niech krzyż stoi na wieki."
 pam_decision_events.0017.b: "To nie jest właściwy moment."
 declare_antipope_decision: "Ogłoś, że postać to anty[ROOT.Char.GetFaith.ReligiousHeadName|l]"
 declare_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHeadTitle.GetName] nie przemawia już w imieniu wyznawców znanych jako [ROOT.Char.GetRite.GetAdherentNamePlural]. Niech żyje [ROOT.Char.GetFaith.ReligiousHeadName|l] z mojego powołania, który będzie odpowiadać przed naszą tradycją – i przede mną."
