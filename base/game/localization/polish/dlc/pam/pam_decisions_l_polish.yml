 consecrate_kingdom_decision_desc_self: "Monarchowie są namaszczani przez [ROOT.Char.GetFaith.HighGodNamePossessive], a ja realizuję boską wolę. Czy istnieje osoba, która bardziej nadawałaby się do władania ziemiami wiernych?"
 consecrate_kingdom_decision_desc: "Monarchowie są namaszczani przez [ROOT.Char.GetFaith.HighGodNamePossessive]. W czasach potrzeby za wolą boską nawet najpokorniejszy szlachcic może zostać monarchą.\n\nTe czasy nadeszły. Będę prosić, aby na mojej gołej głowie spoczęła święta korona."
 consecrate_kingdom_decision_confirm: "Przyjmij mandat królewski"
 consecrate_kingdom_decision_tooltip: "Stwórz nowy [title|El] [Concept('kingdom', 'królestwa')|E] dzięki poparciu wysokiego autorytetu duchowego, a nie z racji siły [Concept('realm', 'państwa')|E]"
 consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.GetShortUINameNotMe] może odmówić pobłogosławienia twojego [Concept('kingdom', 'królestwa')|E], co unieważni tę [Concept('decision', 'decyzję')|E]!#!"
