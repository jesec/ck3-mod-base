 pam_unite_miaphysite_churches_decision_desc: "Choć zjednoczone w wierze, Kościoły wspólnoty miafizyckiej od dawna kroczą osobnymi drogami, każdy pod własnym najwyższym hierarchą. Gdyby ich pasterze doszli do porozumienia, nic nie stanęłoby między wiernymi a pełną jednością."
