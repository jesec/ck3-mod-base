 pam_raise_khachkar_decision_desc: "Dogmat „[GetTenetType('tenet_khachkar').GetName( ROOT.Char.GetRite )]” głosi, że pamięć o zmarłych najlepiej zamknąć w rzeźbionym kamieniu. Muszę wznieść ozdobny krzyż, by oddać hołd moim bliskim. Połączyć żywych, zmarłych i ziemię."
