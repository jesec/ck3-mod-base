 pam_declare_rite_heresy_decision: "Ogłoś obrządek innowierstwem"
 pam_declare_rite_heresy_decision_desc: "Obrządek, który zbytnio zboczył z właściwej drogi, należy nazwać tym, czym w istocie jest.\n\nUznam go za herezję, aby wierni wiedzieli, że powinni się go wystrzegać."
 pam_declare_rite_heresy_decision_tooltip: "Wybierz dywergentny [rite|El] wiary o nazwie [ROOT.Char.GetFaith.GetName|l] i uznaj go za [Concept('heresy', 'herezję')|E]"
 pam_declare_rite_heresy_decision_confirm: "Ogłoś potępienie"
 pam_declare_rite_heresy_decision_valid_tt: "Musi istnieć inny [rite|El] tej samej [Concept('faith', 'wiary')|E] o [Concept('rite_divergence', 'dywergencji')|E] większej niż #V [THIS.ScriptValue('faith_heresy_threshold')|0V]#! względem [Concept('rite', 'obrządku')|E] tradycyjnego"
 pam_declare_rite_heresy_decision_valid_zealous_tt: "Musi istnieć inny [rite|El] tej samej [Concept('faith', 'wiary')|E] o [Concept('rite_divergence', 'dywergencji')|E] większej niż #V [THIS.ScriptValue('faith_heresy_threshold_times_4_over_5')|0V]#! względem obrządku tradycyjnego"
 pam_declare_rite_heresy_bull_decision_desc: "Obrządek, który zbytnio zboczył z właściwej drogi, należy nazwać tym, czym w istocie jest.\n\nWydana zostanie [papal_bull|El] potępiająca go jako herezję."
