 declare_antipope_decision_effect_tt: "Wybrany przez ciebie kandydat przyjmie twój [rite|El], zostanie ogłoszony [Concept('challenger_hof', 'pretendentem do miana głowy wiary')|E] jako [ruler|El] niezależny i zostanie twoim [Concept('external_clerical_puppet', 'marionetkowym władcą duchownym')|E]"
