 declare_yourself_antipope_decision: "Przedstaw się jako anty[ROOT.Char.GetFaith.ReligiousHeadName|l]"
 declare_yourself_antipope_decision_caliph: "Rzuć wyzwanie kalifowi"
 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] jest figurą odległą, niegodną i nieprzygotowaną, by przewodzić wierze znanej jako [ROOT.Char.GetFaith.GetName|l]. Mimo całej wiedzy, jaką sobie przypisuje, po prostu nie #EMP rozumie#! wielu subtelnych prawd myśli [ROOT.Char.GetFaith.GetAdjective|l].\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] może nie, ale #EMP ja#! owszem…"
