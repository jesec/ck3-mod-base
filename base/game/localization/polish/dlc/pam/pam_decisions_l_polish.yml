 pam_founded_kingdom_of_heaven_modifier: "Krew Nowej Jerozolimy"
 pam_proclaim_living_word_decision: "Głoś słowo Boże"
 pam_proclaim_living_word_decision_desc: "Wierni szepcą, że namaszczono mnie ku chwale [ROOT.Char.GetFaith.HighGodNamePossessive]. Pielgrzymi wymawiają moje imię przy przydrożnych kapliczkach, a [ROOT.Char.GetFaith.PriestNeuterPlural|l] powołują się na moje wyroki jak na prawdy ze świętych pism.\n\nNiech z każdego ołtarza wybrzmi, że przeze mnie objawia się słowo Boże."
 pam_proclaim_living_word_decision_tooltip: "Zostań heroldem swojej [Concept('faith', 'wiary')|E]"
 pam_proclaim_living_word_decision_confirm: "Niech słowo się rozniesie."
 pam_proclaim_living_word_decision_sf_tt: "Twoje [spiritual_fulfillment|El] wynosi co najmniej #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_proclaim_living_word_decision_archbishop_tt: "Jesteś [Concept('archbishop', 'arcybiskupem')|E]"
 pam_proclaim_living_word_decision_puppet_tt: "Jedna z twoich [Concept('puppets', 'marionetek')|E] jest [Concept('archbishop', 'arcybiskupem')|E] lub duchownym wyższej rangi"
 pam_proclaim_living_word_decision_realm_rite_tt: "Każde [county|El] w twoim [Concept('realm', 'państwie')|E] praktykuje twój [rite|El] i jest ich co najmniej #V 5#!"
 pam_proclaim_living_word_decision_effect_tt: "Wybierzesz jedną z następujących opcji:\n$BULLET_WITH_TAB$ Modyfikator „[GetModifier( 'pam_herald_shepherd_of_the_faithful_modifier' ).GetNameWithTooltip]”\n$BULLET_WITH_TAB$ Modyfikator „[GetModifier( 'pam_herald_fire_and_sword_modifier' ).GetNameWithTooltip]”"
 pam_decision_events.0021.t: "Słowo Boże"
 pam_decision_events.0021.desc: "[ROOT.Char.Custom('GetFaithTemple')|U] nie pomieści już więcej wiernych. Pielgrzymi tłoczą się, a razem z nimi [ROOT.Char.GetFaith.PriestNeuterPlural|l], baronowie i żebracy. Przy drzwiach czekają kolejne tłumy.\n\nMoje czyny zostały odnotowane dokładniej, niż potrafiłby to zrobić jakikolwiek kronikarz – każda przebyta droga, każda modlitwa, każda moneta ofiarowana w imię [ROOT.Char.GetFaith.HighGodNamePossessive]. [ROOT.Char.GetFaith.PriestNeuterPlural] patrzą na mnie, a jeden z nich chwyta mnie za dłoń i kładzie ją na ołtarzu [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n– Mów, a my będziemy słuchać. – Cisza, która po tym zapada, należy do mnie. To, czym ją wypełnię, odbije się echem daleko poza tymi murami."
 pam_decision_events.0021.a: "Niech miłosierdzie będzie moim kazaniem."
 pam_decision_events.0021.b: "Będę głosić słowo ogniem i mieczem."
 pam_herald_shepherd_of_the_faithful_modifier: "Pasterz wiernych"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Ta postać obwieściła swoje święte powołanie słowami miłosierdzia, a wierni czczą ją za to."
 pam_herald_fire_and_sword_modifier: "Ogniem i mieczem"
 pam_herald_fire_and_sword_modifier_desc: "Ta postać obwieściła swoje święte powołanie jako wezwanie do walki, a wojownicy wiary gromadzą się pod jej sztandarem."
 pam_convert_to_theocracy_decision: "Wprowadź rządy teokratyczne"
 pam_convert_to_theocracy_decision_desc: "Bieżąca hierarchia jest wypaczeniem zasad ustalonych przez opatrzność. Wskazano mi jedyną drogę, by to naprawić. Taką, w której należy chwalić Stwórcę i spełniać jednocześnie obowiązki wobec mojego ludu. Takie nauki głosi nasz autorytet – [ROOT.Char.GetFaith.GoodGodNames]."
 pam_convert_to_theocracy_decision_confirm: "Dzierż władzę [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pam_convert_to_theocracy_decision_tooltip: "Zmień swój [government|El] w [Concept('theocracy', 'teokrację')|E]"
 pam_convert_theocracy_to_feudal_decision: "Przywróć rządy świeckie"
 pam_convert_theocracy_to_feudal_decision_desc: "Pełnię rolę nominalnego autorytetu prawa [ROOT.Char.GetFaith.HighGodNamePossessive], dlatego [ROOT.Char.GetFaith.GetAdherentNamePlural] spoglądają na mnie w poszukiwaniu porady duchowej. Nie czuję się osobą odpowiednią do tego zadania, dlatego z takimi osądami lepiej poradzi sobie [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l].\n\nMoja wiedza ogranicza się do kwestii świeckich, dlatego słusznym jest, aby na mojej głowie znajdowała się świecka korona! Niech ludzie wiedzą, że to ja dzierżę władzę, a nie [ROOT.Char.GetFaith.PriestNeuterPlural|l], ani nawet [ROOT.Char.GetFaith.HighGodName]."
 pam_convert_theocracy_to_feudal_decision_tooltip: "Zmień system swojego [Concept('realm', 'państwa')|E] z [Concept('theocracy', 'teokracji')|E] na system [feudal|El]"
 pam_convert_theocracy_to_feudal_decision_confirm: "Zwróć państwo w ręce śmiertelników"
