 pam_antipope_events.0001.t: "[ROOT.Char.GetFaith.ReligiousHeadName] numer dwa"
 pam_antipope_events.0001.desc.intro: "Zdaje się, że [ROOT.Char.GetFaith.HouseOfWorship|l] łączy wszystkich wiernych praktykujących [ROOT.Char.GetRite.GetName|l].\n\n"
 pam_antipope_events.0001.desc.self: "Unoszę dłoń wysoko w górę. Fałszywe rządy osoby znanej jako [pope.GetTitledFirstName] wkrótce dobiegną końca. Teraz na mnie spada obowiązek przewodzenia [pope.Custom('PL_jego_jej')] poniewieranej trzódce."
 pam_antipope_events.0001.desc.sponsor: "– Niech heroldowie głoszą, że [ROOT.Char.GetFaith.ReligiousHeadName|l] to #EMP ja#!! – grzmi [antipope.GetTitledFirstName]. – Niech wszyscy dowiedzą się, że [pope.GetTitledFirstName] ukrywa się w swoim pałacu, podczas gdy wierni są poniewierani i zagubieni. [pope_capital.GetName] to gniazdo obłudy!\n\nPo chwili odwraca się do mnie. – Nie trwóżcie się jednak. [ROOT.Char.GetTitledFirstName], osoba pobożna, postanawia położyć kres waszym smutkom. A ja wraz z [ROOT.Char.Custom('PL_nim_nia')]."
 pam_antipope_events.0001.a: "Niech wiara [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l] zadrży w posadach."
 pam_antipope_events.0002.opening: "Do osoby, którą jest [ROOT.Char.GetTitledFirstNameNoTooltip], wyznającej wiarę znaną jako [ROOT.Char.GetFaith.GetNameNoTooltip|l]."
 pam_antipope_events.0002.desc.challenger_sponsor: "Wiedz, że ja, [sponsor.GetTitledFirstName], powołuję osobę znaną jako [antipope.GetTitledFirstName]"
 pam_antipope_events.0002.desc.antipope_self: "Wiedz, że ja, [sponsor.GetTitledFirstName], powołuję siebie"
 pam_antipope_events.0002.desc.outro: "do wystąpienia jako [ROOT.Char.GetFaith.ReligiousHeadName|l] przeciw obłudnej osobie, którą jest [pope.GetTitledFirstName], i poprowadzenia wiernych praktykujących [antipope.GetRite.GetName|l] zgodnie z naszą tradycją."
