 pam_decision_events.0030.b.decline: "[religious_authority.GetTitleAsName] piętnuje twoje królestwo"
 pam_decision_events.0030.opening: "Najświętszy z rodziców!"
 pam_decision_events.0030.desc: "Z woli [religious_authority.GetFaith.HighGodNamePossessive] tylko nieliczni szlachetni służą jako najwyżsi opiekunowie dzieci Bożych, których wiara to [religious_authority.GetFaith.GetReligion.GetNameNoTooltip|l]. Sprawiedliwi ci pełnią rolę suwerenów, dbających o piękne tereny podarowane Ziemi przez niebiosa.\n\nPragnę służyć w gronie tych błogosławionych szczęśliwców. Stwórz królestwo na ziemiach znanych jako [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], a ja będę go bronić przed wszelkim złem."
 pam_decision_events.0030.a: "Niniejszym konsekrowane jest nowe królestwo wyznawców wiary znanej jako [religious_authority.GetFaith.GetReligion.GetNameNoTooltip|l]."
 pam_decision_events.0030.b: "[king_aspirant.GetFirstNameNoTooltip], nie figurujesz w planach [religious_authority.GetFaith.HighGodNamePossessive]…"
 pam_decision_events.0031.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] wyznawców wiary znanej jako [ROOT.Char.GetFaith.GetNameNoTooltip|l]"
 pam_decision_events.0031.desc.self_crowning: "Które ziemie są dziś bardziej błogosławione niż [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Które lenno bardziej zasługuje na opiekę królewską? Czy lud nie był chroniony przez [ROOT.Char.GetFaith.WarGodNamePossessive] przed wszelkim złem? Czy mój tron nie został zachowany w granicach królestwa?\n\n Z woli [ROOT.Char.GetFaith.HighGodNamePossessive] nastąpiła konsekracja ziemi, którą jest [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] w miejscu znanym jako [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Jestem świętym strażnikiem tej ziemi i nigdy więcej moja wola nie zostanie wzgardzona.\n\nWasale i czciciele – pokłońcie się! Dobrzy [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural|l] wiedzą, że [ROOT.Char.GetTitleAsName] zasługuje na szacunek."
 pam_decision_events.0031.desc_three_duchies: "Na mocy dekretu osoby znanej jako [religious_authority.GetTitledFirstNameRegnal] ziemie mojego królestwa układają się niczym gwiazdy na wiecznie wirującym niebie. Miejsca znane jako [duchy_1.GetName], [duchy_2.GetName] i [duchy_3.GetName] zostają połączone w świętą, zjednoczoną całość, którą jest [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\nA z duszy prawej i godnej wyłania się [ROOT.Char.GetTitleAsName]! [religious_authority.GetTitleAsNameNoTooltip] nadaje mi prawa i teraz muszę przewodzić według [religious_authority.Custom('PL_jego_jej')] woli."
 pam_decision_events.0031.desc: "Na mocy dekretu osoby znanej jako [religious_authority.GetTitledFirstNameRegnal] do annałów wpisany został nowy teren – [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]. [ROOT.Char.GetFaith.PriestNeuterPlural] i lud wychwalają mnie pod niebiosa! Dopóki ziemie znane jako [ROOT.Char.GetPrimaryTitle.GetNameNoTier] będą wymykać się spod władzy pogan i heretyków, będę sprawować prawowite rządy jako [ROOT.Char.GetTitleAsName], wyznawca wiary znanej pod nazwą [ROOT.Char.GetFaith.GetName|l].\n\n[religious_authority.GetTitleAsNameNoTooltip], mój stworzyciel, błogosławi to skromne królestwo… i na pewno zainteresuje się moimi królewskimi poczynaniami."
 pam_decision_events.0031.a: "Niech [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] na zawsze będzie umiłowaną ziemią [ROOT.Char.GetFaith.HighGodNamePossessive]."
 any_landed_duchy_title_tt: "Co najmniej jedno posiadane przez ciebie [duchy|El] to [title|El] [landed|El] #weak #EMP (nie [clerical_region|El] ani [noble_family|El])#!#!"
 head_of_faith_tt: "Twoja [faith|El] ma [Concept('head_of_faith', 'głowę wiary')|E]"
 custom.every_empire_secular_ruler: "Każdy świecki [ruler|El] wyznający tę samą [Concept('faith', 'wiarę')|E] w [empire|El] [de_jure|El] twojego [Concept('realm', 'państwa')|E]"
 NEW_CREATED_TITLE_NAME_LANDLESS: "[name_title.GetBaseNameNoTierNoTooltip]"
 head_of_rite_is_not_lieges_head_of_rite_tt: "Twoja [head_of_rite|El] nie jest [Concept('head_of_rite', 'głową obrządku')|E] twojego [Concept('liege', 'seniora')|E]"
 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "Jesteś [Concept('head_of_rite', 'głową obrządku')|E] osoby znanej jako [recipient.GetShortUINameNotMe], ale nie jesteś [Concept('head_of_rite', 'głową obrządku')|E] [recipient.Custom('PL_jego_jej')] [Concept('liege', 'seniora')|E]"
 pam_personal_sacrifice_of_wealth_decision: "Poświęć bogactwo"
 pam_personal_sacrifice_of_wealth_decision_desc: "Ofiaruj część swego bogactwa w akcie pobożności, wspierając rozwój hrabstwa pod twoją opieką."
 pam_personal_sacrifice_of_wealth_decision_tooltip: "Wydaj [gold|El], aby zwiększyć [development_growth|El] wybranego [Concept('county', 'hrabstwa')|E] i zyskać [spiritual_fulfillment|El]."
 pam_personal_sacrifice_of_wealth_decision_confirm: "Złóż ofiarę"
 pam_personal_sacrifice_of_wealth_decision_toast: "Ustanowiono inwestycję religijną"
 pam_develop_clerical_court_decision: "Kształć duchowieństwo z twojego dworu"
 pam_develop_clerical_court_decision_desc_christian: "Bezczynni duchowni to marni słudzy [ROOT.Char.GetFaith.HighGodNamePossessive]. Niechże zbiorę swój dwór – godnych wyświęcę, wyświęconych wykształcę i sprowadzę w swoje progi nowicjuszy."
 pam_develop_clerical_court_decision_desc: "Bezczynni słudzy nie są chlubą [ROOT.Char.GetFaith.HighGodNamePossessive]. Niechże zbiorę swój dwór – godnych wyniosę do [Concept('clergy', 'duchowieństwa')|E], służących wykształcę i sprowadzę w swoje progi nowicjuszy."
 pam_develop_clerical_court_decision_tooltip: "Wyświęcaj, kształć lub rekrutuj [clergy|El] na swój dwór"
 pam_develop_clerical_court_decision_confirm: "Zbierz dwór"
 pam_develop_clerical_court_decision_tt: "Zbierasz swój dwór i wybierasz #EMP jedno#! z poniższych:\n$EFFECT_LIST_BULLET$ Do [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [Concept('courtiers', 'dworzan')|E] świeckich wstępuje do [Concept('clergy', 'duchowieństwa')|E], a każdy z nich daje ci dodatkową [piety_i] [piety|El]\n$EFFECT_LIST_BULLET$ Do [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] dworskich [Concept('clergy', 'duchownych')|E] zyskuje pkt [learning_i] [Concept('learning', 'nauki')|E] oraz [Concept('trait', 'cechę')|E] / [Concept('trait_level_track_xp', 'doświadczenie cechy')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] lub [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$ Do [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] nowicjuszy z okolicznych ziem wstępuje na twój dwór i do [Concept('clergy', 'duchowieństwa')|E]\n\nNiezależnie od wybranej drogi zyskujesz [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] pkt [piety_i] [Concept('piety', 'pobożności')|E]\n\n#weak Nagrody rosną wraz z punktami [Concept('learning', 'nauki')|E], [Concept('piety_level', 'poziomem religijności')|E] i [Concept('traits', 'cechami')|E] religijnymi; niekiedy nadarza się rzadka sposobność#!"
 pam_develop_clerical_court_decision_candidates_tt: "Masz [Concept('courtier', 'dworzanina')|E] godnego wyświęcenia lub wykształcenia albo w pobliżu żyje godny kandydat"
 pam_clerical_court_joins_clergy_tt: "Wstępuje do [Concept('clergy', 'duchowieństwa')|E] wiary znanej jako [pam_clerical_patron.GetFaith.GetName|l]"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUINameNotMe] wstępuje do duchowieństwa"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUINameNotMe] dojrzewa w mądrości"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUINameNotMe] odpowiada na wezwanie"
 pam_oblate_patron_reason: "Słynny patron nowicjuszy"
 pam_oblate_patron_modifier: "Patron nowicjuszy"
 pam_oblate_patron_modifier_desc: "Ta postać słynie ze wspierania tych, których powołano do służby religijnej. Złożenie ślubów kosztuje mniej, a rodzice chętniej rozstają się ze swoimi dziećmi."
 pam_scriptorium_modifier: "Sala skrybów"
 pam_scriptorium_modifier_desc: "Ta postać utrzymuje salę skrybów, których praca ściąga do stolicy uczone umysły."
 pam_decision_events.0032.t: "Piecza nad stadem"
 pam_decision_events.0032.desc.intro.christian: "Zwracam się do urzędników i duchownych mego dworu, rozważając, kogo wyświęcić, a kto wciąż potrzebuje przewodnictwa."
 pam_decision_events.0032.desc.intro: "Zwracam się do służących na moim dworze: kto poświęci się wierze znanej jako [ROOT.Char.GetFaith.GetName|l], a kto potrzebuje jeszcze przewodnictwa?"
 pam_decision_events.0032.desc.pupil: "\n\nMój uczeń, [pam_clerical_pupil.GetFirstName], trwa w modlitwie, pragnąc dowieść swej wartości."
 pam_decision_events.0032.desc.no_pupil: "\n\nZbyt niewielu z nich poświęciło się wierze – i zamierzam to zmienić."
 pam_decision_events.0032.desc.novice: "\n\nPełna nadziei nieznajoma osoba spoza mojego dworu imieniem [pam_clerical_novice.GetFirstName] błaga, by dopuścić ją do posługi w imię wiary."
 pam_decision_events.0032.desc.outro.christian: "\n\nJak mam zajmować się powierzoną mi trzodą [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_decision_events.0032.desc.outro: "\n\nJak mam rozwinąć duchowo powierzoną mi trzodę [ROOT.Char.GetFaith.HighGodName]?"
 pam_decision_events.0032.prodigy: "Mój uczeń ma boski dar!"
 pam_decision_events.0032.oblates: "Niech wszyscy wiedzą, że powołani do służby są u mnie mile widziani."
 pam_decision_events.0032.piety: "Ich oddanie umacnia moje własne."
 pam_decision_events.0032.novice: "Obiecująca dusza – należy przyjąć ją bezzwłocznie."
 pam_decision_events.0032.miracle: "Powiadają, że mój uczeń czyni cuda."
 pam_decision_events.0032.relic.christian: "Ten święty tekst powinien spocząć w moim skarbcu!"
 pam_decision_events.0032.relic: "Niech te pisma wzbogacą mój dwór."
 pam_decision_events.0032.language: "Poślijcie mego ucznia do studiowania świętych tekstów."
 pam_decision_events.0032.scriptorium.christian: "Niech w skryptorium żadne pióro nie leży bezczynnie."
 pam_decision_events.0032.scriptorium: "Zagonić do pracy każdego skrybę na mym dworze."
 pam_decision_events.0032.a.christian: "Wyświęcić najgodniejszych z mego dworu."
 pam_decision_events.0032.a: "Wynieść najgodniejszych z mego dworu do posługi w imię wiary."
 pam_decision_events.0032.a.tt: "Do [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] twoich najbardziej uczonych [Concept('courtiers', 'dworzan')|E] świeckich #weak (w tym krewnych)#!, z których każdy:\n$EFFECT_LIST_BULLET$ Wstępuje do [Concept('clergy', 'duchowieństwa')|E] wiary znanej jako [pam_clerical_patron.GetFaith.GetName|l]\n$EFFECT_LIST_BULLET$ Zyskuje [learning_i] [Concept('learning', 'naukę')|E] i [Concept('opinię', 'opinię')|E] o tobie\n$EFFECT_LIST_BULLET$ Zapewnia ci [piety_i] [piety|El]"
 pam_decision_events.0032.b: "Należy kształcić duchownych już mi powierzonych."
 pam_decision_events.0032.b.tt: "Do [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] najbardziej uczonych członków [Concept('clergy', 'duchowieństwa')|E] z twojego dworu, z których każdy:\n$EFFECT_LIST_BULLET$ Zyskuje [learning_i] [Concept('learning', 'naukę')|E] #weak (maksymalnie [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0] pkt)#!\n$EFFECT_LIST_BULLET$ Zyskuje lub rozwija [Concept('trait', 'cechę')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] bądź [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]"
 pam_decision_events.0032.c.named: "Niech [pam_clerical_novice.GetFirstNameNoTooltip] wstąpi na mój dwór. Głoście wszędzie, że nowicjusze są tu mile widziani."
 pam_decision_events.0032.c: "Głoście wszędzie, że nowicjusze są tu mile widziani."
 pam_decision_events.0032.c.tt: "Do [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] nowicjuszy z okolicznych ziem, z których każdy:\n$EFFECT_LIST_BULLET$ Wstępuje na twój dwór i do [Concept('clergy', 'duchowieństwa')|E] wiary znanej jako [pam_clerical_patron.GetFaith.GetName|l]\n$EFFECT_LIST_BULLET$ Przechodzi na twój [rite|El]"
 pam_seize_capital_clerical_region_decision: "Zajmij region duchowny"
 pam_seize_capital_clerical_region_decision_desc: "Moja własna stolica leży w [Concept('clerical_region', 'regionie duchownym')|E] poza mym władaniem. Żaden [archbishop|El] nie powinien górować nad siedzibą, z której sprawuję władzę – ten [title|El] należy do [Concept('head_of_faith', 'głowy wiary')|E]."
 pam_seize_capital_clerical_region_decision_tooltip: "Przejmij [clerical_region|El], w którym leży twoja stolica, usuwając urzędującego [Concept('archbishop', 'arcybiskupa')|E] (jeśli taki jest)"
 pam_seize_capital_clerical_region_decision_confirm: "Przejmij stolicę biskupią"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUINameNotMe] traci stanowisko"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName] – to miejsce przechodzi w twoje ręce"
