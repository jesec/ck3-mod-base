 pam_kingdom_of_heaven.0001.t: "Królestwo Niebieskie"
 pam_kingdom_of_heaven.0001.desc: "– Z Królestwem Bożym jest tak, jak gdyby człowiek rzucił ziarno w ziemię. Czy śpi, czy nie, we dnie i w nocy, ziarno kiełkuje i rośnie, a człowiek nawet nie wie jak.\n\nOdwracam się w stronę chrześcijańskiego świata. W palcach trzymam garść piachu z Ziemi Świętej.\n\n– Ziemia najpierw sama z siebie wydaje źdźbło – otwieram dłoń, a piach rozprasza się w powietrzu – potem kłos – wskazuję palcem na ludzi – a na końcu pełne ziarno w kłosie – mówię, unosząc pastorał.\n\n– Lecz gdy ziarno dojrzeje… czas sięgnąć po sierp, bo nadeszły żniwa."
 pam_kingdom_of_heaven.0001.a: "[previous_capital.GetNameNoTooltip] to miejsce, którego nigdy nie opuszczę."
 pam_kingdom_of_heaven.0001.b: "Czym jest Tron Piotrowy przy Tronie Chrystusowym?"
 kingdom_of_heaven_lower_vassals_gained_tt: "Następująca liczba [Concept('dukes', 'książąt')|E] i [Concept('counts', 'hrabiów')|E] została twoimi [Concept('vassals', 'wasalami')|E]: [SCOPE.ScriptValue('kingdom_of_heaven_lower_vassals_gained_value')|V0]"
 kingdom_of_heaven_lower_de_jure_gained_tt: "[empires|E], które twoja postać posiadała lub które nie miały [Concept('holder', 'właściciela')|E] i które są przez twoją postać [Concept('completely_controlled', 'w pełni kontrolowane')|E], stały się częściami [de_jure|El] ziem o nazwie [GetTitleByKey('h_kingdom_of_heaven').GetName]"
 pam_kingdom_of_heaven_news_title: "Proklamowano Królestwo Niebieskie"
