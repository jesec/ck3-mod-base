 pam_decision_events.0009.t: "Administracja uświęcona"
 pam_decision_events.0009.desc: "[ROOT.Char.Custom('ReligiousHeadHeadgear')|U] to naprawdę pięknie wykonana rzecz. Z przystrojoną głową staję przed mym oddanym ludem. [ROOT.Char.GetFaith.GetAdherentNamePlural|U] słuchają mnie uważnie.\n\n– Dawny system lenn i przywilejów dobrze nam służył, nim zaczął sprowadzać nas na manowce. Kierując się słowem [ROOT.Char.GetFaith.HighGodNamePossessive], wiemy, jak mamy władać miejscem o nazwie [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Ja jedynie pokornie służę, tak jak i wy, spełniając wolę [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_decision_events.0009.a: "[ROOT.Char.Custom('GetFaithTemple')|U] w miejscu o nazwie [new_capital.GetNameNoTierNoTooltip] to nowa stolica!"
 church_holding_as_new_capital: "Ustanów miejsce o nazwie [new_capital.GetNameNoTier] [Concept('realm_capital', 'stolicą państwa')|E]"
 pam_decision_events.0009.b: "Taka jest bowiem wola [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_decision_events.0009.liege_msg_title: "Przyjęto teokrację"
 pam_decision_events.0009.liege_msg_desc: "[ROOT.Char.GetShortUINameNotMe] przeorganizowuje swoje państwo, by stało się [Concept('theocracy', 'teokracją')|E]."
 pam_decision_events.0010.opening: "[theocratic_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_decision_events.0010.desc: "Podążam ścieżką świętego porządku ustrojowego. Oczekuje się, że Twoje ziemie również podążą tą boską ścieżką. Taka jest wola opatrzności."
