l_polish:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "Szerz dogmat"
 spread_personal_tenet_intent_desc: "Chcesz nauczać o swoim [Concept('personal_tenet', 'dogmacie osobistym')|E] chętne do wysłuchania osoby, aby mogły przyjąć go za swój własny, zwiększając [tenet_popularity|El]."
 spread_personal_tenet_intent_not_valid_desc: "Nie posiadasz już [Concept('personal_tenet', 'dogmatu osobistego')|E]"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Odblokowuje [intent|El]: #EMP „$spread_personal_tenet_intent$”#! podczas [activities|El], w których biorą udział goście, pozwalając ci na zwiększenie [Concept('tenet_popularity', 'popularności dogmatu')|E]"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNotMeNoTooltip] przekonuje osobę znaną jako [second.GetShortUINameNotMeNoTooltip]"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNotMeNoTooltip] przekonuje osobę znaną jako [second.GetShortUINameNotMeNoTooltip]"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nLecz to, co przepełnia me serce, to „[spread_tenet.GetBaseName]” – przekonanie, które potępia moja własna wiara. Mówienie o tym tutaj jest jak składanie mojego losu w ręce słuchających."
 pam_spread_tenet_option_scripture: "Samo pismo do mnie przemawia."
 pam_spread_tenet_option_preach: "Usłyszcie to, co uważam za prawdę!"
 pam_spread_tenet_option_forbidden: "Prawda jest warta ryzyka. Podejdź bliżej."
 pam_spread_tenet_option_decline: "Może innym razem."
 pam_spread_tenet_forbidden_flavor: "Nie każde nadstawione ucho jest mi przychylne…"
 pam_spread_tenet_overheard_toast: "Nieprzyjazne uszy"
 pam_spread_tenet_events.0001.t: "Rozmowa przy stole"
 pam_spread_tenet_events.0001.desc: "Stół ugina się, kiedy staje na nim [ROOT.Char.Custom('GetExpensiveMeal')|l], a sala wypełnia się śmiechem i głośnymi toastami.\n\n– Mówisz jak ktoś, kto długo rozmyślał nad świętymi sprawami – rzecze [pam_spread_listener_1.GetTitledFirstName], pochylając się nad deską do krojenia, na której leży [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]. – Mów dalej.\n\nPrzy stole zapada cisza, a rozentuzjazmowana publiczność nadstawia uszu…"
 pam_spread_tenet_events.0101.t: "Przy ognisku"
 pam_spread_tenet_events.0101.desc: "Chwila wytchnienia w czasie polowania. Siedzimy blisko ogniska, a na rożnie skwierczy nasza zdobycz – [ROOT.Char.Custom('GetRandomRegionalSmallGame')|l].\n\n– Taka pogoń sprawia, że dusza kieruje się ku wyższym wartościom – szepcze [pam_spread_listener_1.GetTitledFirstName] ze wzrokiem utkwionym w płomieniach.\n\nBlask ogniska, cisza i uszy gotowe, by słuchać."
 pam_spread_tenet_events.0201.t: "Między pojedynkami"
 pam_spread_tenet_events.0201.desc: "Między kolejnymi pojedynkami arena, na której odbywa się turniej, pustoszeje. Giermkowie odciągają potrzaskane kopie, a tłum szuka cienia i oddaje się pogawędkom.\n\n– Każdy zwycięzca w podzięce wzywa imię [ROOT.Char.GetFaith.HighGodNamePossessive], a przegrani przeklinają [ROOT.Char.GetFaith.DevilNamePossessive] – rzuca żartem [pam_spread_listener_1.GetTitledFirstName], siedząc obok mnie. – Czy ktokolwiek z nich zastanawia się, dlaczego?\n\nChwila wytchnienia, ławeczka zapełniona leniwymi dostojnikami i wiszące w powietrzu pytanie."
 pam_spread_tenet_events.0301.t: "Toast w imię przekonań"
 pam_spread_tenet_events.0301.desc: "Puchary wznoszą się jeden za drugim – za nowożeńców, za jeszcze nienarodzonych dziedziców…\n\n– I za [ROOT.Char.GetFaith.HighGodNamePossessive], siłę, które wiąże ze sobą wszystkie dusze! – dodaje [pam_spread_listener_1.GetTitledFirstName] przy huku aprobaty.\n\nSerca zgromadzonych są otwarte – na miłość, nadzieję i rzeczy święte. Wypowiedziane teraz słowa zakorzenią się w duszach zebranych."
 pam_spread_tenet_events.0401.t: "Słowa wygłoszone podczas czuwania"
 pam_spread_tenet_events.0401.desc: "Żałobnicy gromadzą się w luźnych grupkach i wymieniają ciepłe słowa o zmarłym i losie, który czeka nas wszystkich.\n\n– Śmierć przyjdzie po nas wszystkich – mówi cicho [pam_spread_listener_1.GetTitledFirstName], stojąc przy mnie. – A my nadal spieramy się o drobnostki.\n\nSmutek potrafi otworzyć duszę człowieka…"
