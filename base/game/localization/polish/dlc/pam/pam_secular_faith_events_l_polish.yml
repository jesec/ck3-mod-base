l_polish:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "W twoich myślach zakorzeniła się praktyka wykraczająca poza twoją własną [Concept('faith', 'wiarę')|E] i zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] na temat [Concept('core_tenet', 'dogmatu')|E] „[pam_sf_seeded_tenet.GetBaseName]”."
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUINameNotMe] to rodzic chrzestny osoby znanej jako [TARGET_CHARACTER.GetShortUINameNotMe], a duchowa więź przerodziła się w przyjaźń."
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] to rodzic chrzestny osoby znanej jako [CHARACTER.GetShortUINameNotMe], a duchowa więź przerodziła się w przyjaźń."
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] są teraz bliżej siebie dzięki wspólnym przekonaniom religijnym."
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] trwają teraz w największej przyjaźni, a ich więź umocniła się dzięki wspólnym przekonaniom religijnym."
 pam_sf_friend_shielded: "[CHARACTER.GetShortUINameNotMe] broni osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe] przed prześladowaniem na tle religijnym."
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] broni osobę znaną jako [CHARACTER.GetShortUINameNotMe] przed prześladowaniem na tle religijnym."
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] zostają kochankami zjednoczonymi przez wspólne przekonania religijne."
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] zostają kochankami podczas nocy wzajemnego świętego oddania."
 pam_sf_lover_confessional: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] znajdują w konfesjonale coś więcej niż tylko rozgrzeszenie i zostają kochankami."
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] zostają kochankami po rozmowie na temat arkanów wiary."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUINameNotMe] i [TARGET_CHARACTER.GetShortUINameNotMe] zostają bratnimi duszami, a ich miłość umacnia się dzięki wspólnym przekonaniom religijnym."
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUINameNotMe] sprzedaje stanowisko kościelne, które zajmuje [TARGET_CHARACTER.GetShortUINameNotMeNoTooltip], nieznajomemu, który jest w stanie za nie zapłacić."
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] sprzedaje stanowisko kościelne, które zajmuje [CHARACTER.GetShortUINameNotMeNoTooltip], nieznajomemu, który jest w stanie za nie zapłacić."
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUINameNotMe] zmusza osobę znaną jako [CHARACTER.GetShortUINameNotMe] do wstąpienia do zakonu i złożenia ślubów."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUINameNotMe] zmusza osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe] do wstąpienia do zakonu i złożenia ślubów."
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "wielebny ojciec"
 pam_my_liege_reverend_mother: "wielebna matka"
 pam_my_liege_captain: "kapitan"
 pam_my_liege_khan: "wielki chan"
 pam_my_liege_khatun: "wielki chatun"
 pam_my_liege_chieftain: "mój wódz"
 pam_my_liege_serene_lord: "najjaśniejszy pan"
 pam_my_liege_serene_lady: "najjaśniejsza pani"
 pam_my_liege_lord: "mój pan"
 pam_my_liege_lady: "moja pani"
 pam_my_liege_liege: "mój senior"
 pam_secular_faith_events.0001.t: "Święte opary"
 pam_secular_faith_events.0001.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] przechodzi z kadzielnicą wzdłuż nawy. Święte opary unoszą się pod sufit, niosąc szeptane modlitwy wiernych.\n\nPrzez moment [ROOT.Char.GetFaith.PositiveAfterLife] to miejsce w zasięgu całego stworzenia, w tym także mnie."
 pam_secular_faith_events.0001.a: "Zatracę się w modlitwie."
 pam_secular_faith_events.0001.b: "Ten obrządek powinien być poświęcony chwale [ROOT.Char.GetFaith.WealthGodNamePossessive]."
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('GetCourt')|U] musi podzielać to oddanie."
 pam_secular_faith_events.0002.t: "Pikuach nefesz"
 pam_secular_faith_events.0002.desc: "Będąc w podróży i przemierzając moje ziemie, [traveler_in_danger.GetTitledFirstName] pada ofiarą bandytów w miejscu znanym jako [background_terrain_scope.GetName]!\n\n[traveler_in_danger.GetHerHis|U] życie jest zagrożone, ale chwytanie za broń w święto [ROOT.Char.GetFaith.HighGodNamePossessive] jest zakazane. Nie do mnie należy łamanie szabatu. Jeśli poczekam do zachodu słońca, być może wyruszę tylko po to, by [traveler_in_danger.Custom('PL_go_ja')] pochować.\n\nCzy jednak mogę siedzieć z założonymi rękami, gdy czyjeś życie wisi na włosku?"
 pam_secular_faith_events.0002.a: "Życie jest najważniejsze. Wyruszamy."
 pam_secular_faith_events.0002.b: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstNameNoTooltip] musi wyrazić swoją opinię."
 pam_secular_faith_events.0002.c: "Nie naruszę szabatu."
 pam_secular_faith_events.0003.t: "Nocna wizja"
 pam_secular_faith_events.0003.desc: "Budzę się po czymś więcej niż zwykłym śnie – to był słup ognia, głos, który znał moje imię, twarz, której nie mogę zapomnieć…\n\nCzy to były odwiedziny [ROOT.Char.GetFaith.HighGodNamePossessive]? Albo [ROOT.Char.GetFaith.HealthGodNamePossessive]? Czy raczej [ROOT.Char.GetFaith.DevilNamePossessive] w pięknym przebraniu…\n\nA może była to tylko fantazja spowodowana gorączką."
 pam_secular_faith_events.0003.a: "Ten głos szeptał błogie prawdy…"
 pam_secular_faith_events.0003.b: "To gorączkowe fantazje… Muszę poczytać o takich przypadkach."
 pam_secular_faith_events.0003.c: "[ROOT.Char.Custom('GetCourt')|U] musi usłyszeć o mojej wizji!"
 pam_secular_faith_events.0004.t: "Zakazana prawda"
 pam_secular_faith_events.0004.desc: "[ROOT.Char.Custom('ResidenceBuilding')|U] rozbrzmiewa moimi krokami. Przemierzam ciemne [ROOT.Char.Custom('ResidenceBuildingHallsType')], nie mogę spać i mam wątpliwości.\n\nMoje myśli wciąż wracają do czegoś, co potępia moja wiara – do dogmatu „[pam_sf_forbidden_tenet.GetBaseName]”. Powinno mnie to niepokoić, a jednak wydaje mi się, że w tym przekonaniu tkwi jakaś słuszna prawda i nie potrafię się wyzbyć tej myśli."
 pam_secular_faith_events.0004.a: "Będę się trzymać tej prawdy – ale w tajemnicy."
 pam_secular_faith_events.0004.b: "Nie. Nie zboczę z właściwej drogi."
 pam_secular_faith_events.0005.t: "Przy blasku świec"
 pam_secular_faith_events.0005.desc_intro: "Wieczorna lektura miała mi pomóc się wyciszyć, a jednak pewien fragment wciąż nie daje mi spokoju.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "Dotyczy dogmatu nazywanego „[pam_sf_revelation_tenet.GetBaseName]”, którego moja wiara nigdy by nie zaakceptowała. Powtarzam sobie, że to barbarzyństwo."
 pam_secular_faith_events.0005.desc_doctrine: "Dotyczy doktryny nazywanej „[pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )]”, której moja wiara nigdy by nie zaakceptowała. Powtarzam sobie, że to błędna doktryna."
 pam_secular_faith_events.0005.desc_end: "Mimo to przy blasku świec zaczynam rozumieć, dlaczego ktoś mógłby podzielać opisywany pogląd."
 pam_secular_faith_events.0005.a: "Muszę przelać moje myśli na papier."
 pam_secular_faith_events.0005.b: "Nie ma nic złego w próbie zrozumienia tego tematu."
 pam_secular_faith_events.0005.c: "Modlitwa oczyści moje myśli."
 pam_secular_faith_events.0006.t: "Kości świętej osoby"
 pam_secular_faith_events.0006.desc: "Na rynku moją uwagę przyciąga zmęczona pielgrzymowaniem osoba. W jej drżących dłoniach spoczywa pożółkła kość palca.\n\n– To kość świętej osoby – zaklina się [relic_seller.GetWomanMan]. – Udało mi się ją znaleźć podczas podróży do miejsca znanego jako [GetTitleByKey('c_jerusalem').GetNameNoTier], ale [ROOT.Char.GetTitleAsNameNoTooltip] lepiej się nią zaopiekuje.\n\nKtoś znający się na rzeczy mógłby ocenić prawdziwość tych słów. Na szczęście relikwia jest na sprzedaż."
 pam_secular_faith_events.0006.a: "Najpierw się temu przyjrzę, zanim wydam pieniądze."
 pam_secular_faith_events.0006.b: "Wezmę to."
 pam_secular_faith_events.0006.c: "Nic mi po kościach obcej osoby. Zejdź mi z oczu."
 pam_sf_acquire_relic_tt: "Znajdujesz [artifact|El] będący relikwią o pospolitej [Concept('rarity', 'rzadkości')|E]"
 pam_sf_examine_relic_tt: "Znajdujesz [artifact|El] będący relikwią o [Concept('rarity', 'rzadkości')|E] zależnej od twojej [learning_i] [Concept('learning_skill', 'umiejętności nauki')|E]"
 pam_sf_acquire_relic_toast: "Zdobyto świętą relikwię"
 pam_sf_fingerbone_relic_name: "Kość palca – św. [SCOPE.Custom('PamFingerboneSaint')]"
 pam_sf_fingerbone_relic_desc: "Pożółkła kość palca czczona jako relikwia i trzymana w małym relikwiarzu podpisanym „św. [SCOPE.Custom('PamFingerboneSaint')]”."
 pam_secular_faith_events.0007.t: "Arogancki biskup"
 pam_secular_faith_events.0007.desc: "[defiant_bishop.GetFirstName], [defiant_bishop.GetTitleAsNameNoTooltip] z mojego państwa, to dumna postać o szerokich kontaktach, w głębi duszy przekonana, że jest ode mnie lepsza. Ostatnio kilkoro moich sług zachorowało i potrzebuję, aby osoba ta pobłogosławiła mój dom.\n\nOstatecznie po kilku dniach ignorowania moich wezwań wreszcie pojawiła na miejscu.\n\n– Proszę mi wybaczyć opóźnienie – uśmiecha się lekko – ale [ROOT.Char.GetTitleAsNameNoTooltip] to tytuł znacznie niższej rangi niż ten należący do mojego władcy."
 pam_secular_faith_events.0007.a: "Działajmy więc z godnością, jaka przystoi twojemu urzędowi."
 pam_secular_faith_events.0007.b: "Proszę, po prostu przeprowadź ten obrzęd."
 pam_secular_faith_events.0007.c: "Może służysz woli [ROOT.Char.GetFaith.HighGodNamePossessive], ale ja jestem twoim seniorem. Wynocha!"
 pam_secular_faith_events.0008.t: "Ciężar grzechu"
 pam_secular_faith_events.0008.desc: "Świece już prawie zgasły i powraca do mnie ta sama myśl. [penance_sin.GetName( ROOT.Char )|U] – te słowa pasują do mnie doskonale, lecz w świetle mojej wiary jest to grzech.\n\nNieważne, jak często staram się odsunąć tę myśl, poczucie winy mnie nie opuszcza.\n\n– Zachowaj dyscyplinę, a twoja dusza znajdzie ukojenie od brzemion. – [ROOT.Char.Custom2( 'RelationToMeShort', confessor )|U] [confessor.GetFirstName] nie karci ani nie potępia mnie. – Wypełnij tę pokutę. Nie zbaczaj z drogi."
 pam_secular_faith_events.0008.a: "Zrobię, jak [confessor.GetFirstNameNoTooltip] radzi."
 pam_secular_faith_events.0008.b: "Jeszcze nie teraz."
 pam_secular_faith_events.0009.t: "Nieznajoma osoba niczym Chrystus"
 pam_secular_faith_events.0009.desc: "Przed moimi bramami stoi samotna, pokryta bliznami nieznajoma osoba z ręką wyciągniętą po jałmużnę.\n\n– Raczy [ROOT.Char.GetTitleAsNameNoTooltip] wybaczyć, mam nadzieję, że nadmiernie cię nie niepokoję – mówi, kłaniając się wdzięcznie. – Jeśli twój majątek na to pozwoli, daj mi, proszę, niewielką jego część.\n\nPostać ta, jak na osobę trudniącą się żebractwem, jest niezwykle elokwentna. Nigdy nie wiadomo, kogo tak naprawdę się zbywa."
 pam_secular_faith_events.0009.a: "Wejdź, [ROOT.Char.Custom('ResidenceBuilding')] stoi dla ciebie otworem."
 pam_secular_faith_events.0009.b: "Weź ten chleb i odejdź w pokoju."
 pam_secular_faith_events.0010.t: "Tajemniczy przybysz"
 pam_secular_faith_events.0010.desc_blessed: "Osoba, która weszła przez moją bramę, to nie zwykły włóczęga – [stranger.GetFirstName] mówi o pismach i sztuce politycznej z taką swobodą, że nawet moi uczeni milczą, aby [stranger.Custom('PL_go_jej')] wysłuchać.\n\nWygląda na to, że jednak zaszczyciła nas obecność [ROOT.Char.GetFaith.HighGodNamePossessive]. Nie pozwolę, aby osoba ta dalej się włóczyła."
 pam_secular_faith_events.0010.desc_thief: "Budzę się przy zimnym palenisku i otwartej skrzyni.\n\nZa zapewnienie chleba i schronienia odpłacono mi najstarszą z form zdrady.\n\n[stranger.GetFirstName] jest już poza moim domem wraz z moimi kosztownościami.\n\nZanim domownicy się obudzili, osoba ta opuściła mury i nie mam jej już jak znaleźć."
 pam_secular_faith_events.0010.a: "Przysłano cię tutaj nie bez powodu."
 pam_secular_faith_events.0010.b: "Do mojego stołu zasiadła żmija."
 pam_secular_faith_events.0011.t: "Pokutnicy"
 pam_secular_faith_events.0011.desc: "Budzi mnie nie grzmot, lecz trzask biczów.\n\nGromada pokutników zgromadziła się przed moją siedzibą, którą jest [ROOT.Char.Custom('ResidenceBuilding')]. Mają poranione, krwawiące plecy i głoszą, że z woli [ROOT.Char.GetFaith.HighGodNamePossessive] musimy przestrzegać dogmatu „[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )]”.\n\nMoi domownicy oczekują ode mnie wskazówek."
 pam_secular_faith_events.0011.a: "Czy kryje się za tym jakaś głębsza prawda?"
 pam_secular_faith_events.0011.b: "Dajcie mi bicz – mnie również splamił grzech."
 pam_secular_faith_events.0011.c: "Wypędzić to szaleństwo z moich ziem!"
 pam_secular_faith_events.0012.t: "Błogosławieństwo broni"
 pam_secular_faith_events.0012.desc: "Pokój jest pożyczką, nigdy darem.\n\nPodczas uczty sławiącej imię [ROOT.Char.GetFaith.WarGodNamePossessive] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] proponuje poświęcenie oręża moich domowników.\n\n– Bóg, który dał Dawidowi siłę w walce z Goliatem, niech ześle tę samą siłę rodowi [ROOT.Char.GetHouse.GetBaseName]. Oby zawsze było wam dane stawać w obronie słabych – modli się [chaplain.GetFirstName]."
 pam_secular_faith_events.0012.a: "Pobłogosław moje sztandary i ostrza na czas potrzeby."
 pam_secular_faith_events.0012.b: "Módlmy się zamiast tego o pokój."
 pam_secular_faith_events.0012.c: "Skromne błogosławieństwo wystarczy."
 pam_secular_faith_events.0013.t: "Przepowiedziana śmierć"
 pam_secular_faith_events.0013.desc: "Przywleczono przede mnie kaznodzieję o obłąkanym wzroku. Oskarżony o podjudzanie gawiedzi i wróżbiarstwo, bez wahania wskazuje drżącym palcem na osobę, którą jest [doomed_soul.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )].\n\n– Zważcie na tę osobę! Nim minie kolejny księżyc, spocznie ona zimna w ziemi. Mądrość [ROOT.Char.GetFaith.HighGodNamePossessive] objawiła mi dokładną godzinę! – krzyczy.\n\nPewność kaznodziei jest niepokojąca. A strach, jaki okazuje [doomed_soul.GetTitledFirstName] – jeszcze bardziej."
 pam_secular_faith_events.0013.a: "Słowa [ROOT.Char.GetFaith.HighGodNamePossessive] znajdują swoje ujścia w dziwnych źródłach…"
 pam_secular_faith_events.0013.b: "Precz, obłąkany głupcze!"
 prophecy_foretold_tt: "Wygłoszono proroctwo. A co, jeśli jest prawdziwe?"
 prophecy_foretold_2_tt: "Wygłoszono proroctwo. Kompletna bzdura!"
 pam_secular_faith_events.0014.t: "Prorocze rozliczenie"
 pam_secular_faith_events.0014.desc_fulfilled: "Minął kolejny księżyc i [doomed_soul.GetTitledFirstName] nie żyje – śmierć nadeszła cicho we śnie.\n\nTen obdarty kaznodzieja wskazał dokładną godzinę. Nie potrafię o tym zapomnieć.\n\nCzy to było proroctwo… a może urzeczywistnienie obaw?"
 pam_secular_faith_events.0014.desc_failed: "Minął kolejny księżyc, a [doomed_soul.GetTitledFirstName] wciąż żyje. Godzina, którą wskazał obdarty kaznodzieja, nadeszła i minęła, nie zabierając ze sobą niczego.\n\nKaznodzieja to oszust albo głupiec, lecz z pewnością nie głosi przepowiedni [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nCzuję się dość głupio."
 pam_secular_faith_events.0014.a: "[prophet.GetFirstNameNoTooltip] to prawdziwy prorok!"
 pam_secular_faith_events.0014.b: "Niezbadane są ścieżki [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0014.c: "Dlaczego w ogóle przyszło mi uwierzyć w tę przeklętą przepowiednię kaznodziei!?"
 pam_secular_faith_events.0014.d: "Trzeba było uwierzyć w tę przepowiednię…"
 pam_secular_faith_events.0014.e: "Kaznodzieja był oszustem, zgodnie z moimi przypuszczeniami!"
 gains_religious_inspiration_tt: "[prophet.GetShortUINameNotMe] zyskuje [Concept('inspiration', 'inspirację')|E] religijną"
 pam_secular_faith_events.0015.t: "Płacząca ikona"
 pam_secular_faith_events.0015.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] zabiera mnie w pośpiechu ze sobą. [miracle_church.GetName] – tam właśnie zmierzamy. Wewnątrz namalowane oczy świętej postaci ronią łzy z wonnego oleju.\n\nWieści o cudzie wyprzedzają każdego posłańca, a cud to potężna, niebezpieczna sprawa."
 pam_secular_faith_events.0015.a: "Cud? Należy to zbadać."
 pam_secular_faith_events.0015.b: "Niech wierni przybędą. Przyjmiemy ich."
 pam_secular_faith_events.0015.c: "Tym błogosławieństwem nie należy się dzielić."
 pam_secular_faith_events.0015.d: "Moje państwo zostało pobłogosławione!"
 no_miracles_tt: "Ten cud wydaje się podejrzany…"
 pam_secular_faith_events.0016.t: "Cena za ambonę"
 pam_secular_faith_events.0016.desc_intro: "Odwiedza mnie jakaś [ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))] osoba – nie po to, by prosić o przysługę, lecz by ją kupić.\n\n– Wasza czcigodność! [old_realm_priest.GetFirstName] to wspaniały pasterz – szepcze mój gość, rzucając na stół pękatą sakiewkę. – Jednak ja potrafię okazać większą… wdzięczność. Mianuj mnie na [old_realm_priest.GetHerHis] stanowisko i zyskaj błogosławieństwo [ROOT.Char.GetFaith.WealthGodNamePossessive]."
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nDogmat „[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )]” nie przynosi wstydu, a srebro jest dobre."
 pam_secular_faith_events.0016.desc_sinful: "\n\nDogmat „[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )]” to grzech. Przyjęcie tego złota splamiłoby moją duszę."
 pam_secular_faith_events.0016.a: "W końcu złoto waży więcej niż grzech…"
 pam_secular_faith_events.0016.b: "Uczciwa cena, uczciwie zapłacona. Stanowisko jest twoje."
 pam_secular_faith_events.0016.c: "Stanowisko nie jest na sprzedaż."
 pam_secular_faith_events.0017.t: "Heretyk wśród świty"
 pam_secular_faith_events.0017.desc: "– Heretyk! – [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] wskazuje oskarżycielsko palcem na inną osobę. To [accused.GetFirstName]. – Czy nie dostrzegasz, jak podły wpływ [accused.GetFirstNameNoTooltip] i wiara [accused.GetRite.GetAdjective|l] wywierają na twój [ROOT.Char.Custom('GetCourt')]? [accused.GetSheHe|U] musi odpokutować i zaakceptować wiarę [ROOT.Char.GetFaith.HighGodNamePossessive]!\n\n[accused.GetFirstNameNoTooltip] zachowuje stoicki spokój, choć to oskarżenie wyraźnie [accused.Custom('PL_go_ja')] rani."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], pozwól, że poprowadzę cię ku wierze."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip] nawraca się"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName] nie daje się przekonać"
 pam_secular_faith_events.0017.b: "W takim razie pokutuj w celi. Pojmać [accused.Custom('PL_go_ja')]."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip] jest pod moją ochroną. Dość."
 pam_secular_faith_events.0018.t: "Dziecko dla Boga"
 pam_secular_faith_events.0018.desc: "[pious_child.GetFirstName], moje dziecko, różni się od większości rówieśników. Gdy inne dzieci się bawią, [pious_child.GetSheHe] spędza całe dnie w kaplicy.\n\n– Pierwszy raz widzę takie dziecko – mówi cicho [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName]. – Spędza godziny na modlitwie i roni łzy podczas mszy. To oczywiste: [pious_child.GetFirstNameNoTooltip] pragnie wieść życie jako [GetTrait('devoted').GetName( pious_child )|l]."
 pam_secular_faith_events.0018.a: "Poświęć życie służbie wobec [ROOT.Char.GetFaith.HighGodNamePossessive], lecz zostań tutaj."
 pam_secular_faith_events.0018.b: "Kościół otrzyma moje dziecko."
 pam_secular_faith_events.0018.c: "Nie, [pious_child.GetFirstNameNoTooltip] należy do rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0019.t: "Pokój Boży"
 pam_secular_faith_events.0019.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] przybywa z poważnymi wieściami.\n\n– Brat nie powinien zabijać brata na oczach [ROOT.Char.GetFaith.HighGodNamePossessive]! – głosi [chaplain.GetFirstNameNoTooltip]. – [feud_attacker.GetTitledFirstName] i [feud_defender.GetTitledFirstName] krzyżują ze sobą miecze, a przez ich waśń cierpią maluczcy!\n\n– Zakończ to. Niech dogmat „[GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )]” zwiąże te dwie postacie."
 pam_secular_faith_events.0019.a: "Zgodnie z wolą [ROOT.Char.GetFaith.HighGodNamePossessive] nastanie pokój."
 pam_secular_faith_events.0019.b: "Każdy lord, który dobył miecza, odpowie za to."
 pam_secular_faith_events.0019.c: "Osądzanie waśni moich wasali należy do mnie."
 pam_sf_peace_of_god_ends_wars_tt: "Każda [war|El] między twoimi [Concept('vassals', 'wasalami')|E] kończy się [Concept('white_peace', 'białym pokojem')|E]"
 pam_secular_faith_events.0020.t: "[temple_location.GetNameNoTooltip] i [ROOT.Char.GetFaith.HouseOfWorship]"
 pam_secular_faith_events.0020.desc: "Murarze układają ostatni kamień na pierwszej wzniesionej przeze mnie budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship] tutaj, gdzie [temple_location.Custom('TerrainTypeProvincePrefix')] tereny i [temple_location.Custom('TerrainTypeProvince')] dominują miejsce o nazwie [temple_location.GetName].\n\n[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] przechadza się po dziedzińcu z kadzielnicą w dłoni.\n\n– Zapamiętają cię ze względu na [ROOT.Char.GetFaith.HouseOfWorshipPlural], które oddajesz na chwałę [ROOT.Char.GetFaith.HighGodNamePossessive] – mówi [chaplain.GetFirstNameNoTooltip] – Niech to będzie pierwszy dar spośród wielu."
 pam_secular_faith_events.0020.a: "Niech [chaplain.GetFirstNameNoTooltip] poprowadzi nas w modlitwie."
 pam_secular_faith_events.0020.b: "Niech ziemie o nazwie [consecrated_county.GetNameNoTierNoTooltip] rozkwitają wokół budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship]."
 pam_secular_faith_events.0020.c: "Poszukam mądrości w tych murach."
 pam_secular_faith_events.0020.d: "Dopiero zaczynam dzieło [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0021.t: "Znak niebios"
 pam_secular_faith_events.0021.desc: "Sen nie nadchodzi. Szukam spokojnego mroku i spoglądam w niebo. Dziś widać na nim [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nTakie znaki nigdy nie są pozbawione znaczenia."
 pam_omen_blood_moon: "poczerwieniały księżyc"
 pam_omen_star_host: "rój gwiazd tam, gdzie nie powinno być żadnej"
 pam_omen_comet: "kometę o dwóch ogonach"
 pam_omen_falling_stars: "deszcz spadających gwiazd"
 pam_omen_moon_halo: "okrąg bladego światła wokół księżyca"
 pam_omen_eclipse: "księżyc zaćmiony do kształtu miedzianego sierpa"
 pam_omen_wandering_star: "jasną, wędrującą gwiazdę"
 pam_secular_faith_events.0021.a: "Zbadam ten omen."
 pam_secular_faith_events.0021.b: "Przez ten znak jaśnieje łaska [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0021.c: "Taki znak zwiastuje podbój!"
 pam_secular_faith_events.0021.d: "Niebiosa nie są mi winne żadnych odpowiedzi."
 pam_secular_faith_events.0022.t: "[ROOT.Char.GetTitleAsNameNoTooltip] i [ROOT.Char.Custom('PL_jego_jej')] dotyk"
 pam_secular_faith_events.0022.desc_intro: "[sick_courtier.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )], wlecze się w moim kierunku. Twarz ma bladą i chwieje się na nogach.\n\n"
 pam_secular_faith_events.0022.desc_ill: "– Wasza czcigodność, niknę w oczach. Okrutnie trawi mnie pewna przypadłość, na którą nie ma lekarstwa – [illness_trait.GetName( GetNullCharacter )|l]. Nawet medyk, [physician.GetTitledFirstName], nie wie, co mi jest! – zawodzi [sick_courtier.GetFirstNameNoTooltip].\n\n"
 pam_secular_faith_events.0022.desc_other: "– Niknę w oczach, okrutnie trawi mnie pewna przypadłość, na którą nie ma lekarstwa – [illness_trait.GetName|l]. Nawet [physician.GetTitledFirstName] nie wie, co mi jest! – krzyczy [sick_courtier.GetFirstNameNoTooltip].\n\n"
 pam_secular_faith_events.0022.desc_end: "– Mówią, że dłoń ukoronowanej osoby przenosi łaskę [ROOT.Char.GetFaith.HighGodNamePossessive]. To moja ostatnia nadzieja."
 pam_secular_faith_events.0022.a: "Podejdź. Niech moje dłonie spoczną na tobie."
 pam_secular_faith_events.0022.b: "Nie… pobłogosławię cię stąd, gdzie stoję."
 pam_sf_kings_touch_gamble_tt: "Mój dotyk może sprawić, że [sick_courtier.GetFirstName] ozdrowieje lub choroba przejdzie na mnie…"
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName] podnosi się z łoża boleści"
 pam_sf_kings_touch_infected_toast: "Z kolei choroba przechodzi na mnie"
 pam_sf_kings_touch_nothing_toast: "[sick_courtier.GetFirstName] nie odczuwa żadnej poprawy po moim dotyku"
 pam_secular_faith_events.0023.t: "Wędrowny skryba"
 pam_secular_faith_events.0023.desc: "Przyprowadzono do mnie wychudzonego skrybę z palcami umazanymi atramentem i tomami wsuniętymi pod pachę.\n\n– Nazywam się [scholar.GetFirstName], jestem skrybą i trudnię się nauką – ciągnie. – Nie mam domu ani patrona. Te dłonie nie zostały stworzone do harówki, lecz by przelewać słowa, które wypowiada [ROOT.Char.GetTitleAsNameNoTooltip], na materiał, jakim jest [ROOT.Char.Custom('GetWritingMaterial')].\n\n– Błagam cię, daj mi chleb i dach nad głową, a będę ci wiernie służyć."
 pam_secular_faith_events.0023.a: "Ktoś uczony? Naucz mnie tego, co wiesz."
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip] – tam potrzebują twoich usług."
 pam_secular_faith_events.0023.c: "Moje księgi rachunkowe potrzebują pewnej ręki."
 pam_secular_faith_events.0023.d: "Nie potrzebuję cię. Precz."
 pam_secular_faith_events.0024.t: "Do klasztoru"
 pam_secular_faith_events.0024.desc: "[rival_character.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )], to niezdarna oferma i paskudna gnida, z której [ROOT.Char.Custom('GetCourt')] nie ma żadnego pożytku. Jednak na duchu podnosi mnie list, którego autorem jest [archbishop.GetTitledFirstName] z miejsca znanego jako [archdiocese.GetName].\n\n– [rival_character.GetFirstName] wspaniale sprawdzi się w służbie na rzecz [ROOT.Char.GetFaith.HighGodNamePossessive] – pisze nadawca. – Klasztor z radością [rival_character.Custom('PL_go_ja')] przyjmie.\n\nŚwiat szybko zapomina o tych, którzy tam klęczą."
 pam_secular_faith_events.0024.a: "Tym samym kolejna osoba „ochoczo” trafia na służbę na rzecz [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 pam_secular_faith_events.0024.b: "Wolę mieć swojego wroga na oku."
 pam_secular_faith_events.0025.t: "Rodzic chrzestny"
 pam_secular_faith_events.0025.desc: "– Pragnę przyjąć wiarę znaną jako [ROOT.Char.GetFaith.GetName|l] ciałem i duchem – oświadcza uroczyście [converting_char.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )]. – Chcę przyjąć chrzest jako [ROOT.Char.GetRite.GetAdherentName]… i proszę cię o obecność przy chrzcielnicy jako mój rodzic chrzestny."
 pam_secular_faith_events.0025.a: "W takim razie niech wszyscy ujrzą naszą nową więź!"
 pam_secular_faith_events.0025.b: "Wiara nie wymaga wielkiego widowiska."
 pam_secular_faith_events.0025.c: "Nie mogę przyjąć tego zaszczytu."
 pam_secular_faith_events.0026.t: "Oblężona dusza"
 pam_secular_faith_events.0026.desc: "[afflicted.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )], to nigdy nie była osoba w pełni zdrowa na umyśle… ale teraz nie przypomina nawet samej siebie.\n\n– [ROOT.Char.GetFaith.EvilGodNames]! [ROOT.Char.GetFaith.EvilGodNames] w moim ciele! – majaczy, wijąc się na podłodze, a [ROOT.Char.GetFaith.HouseOfWorship] rozbrzmiewa krzykami.\n\n[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] blednie. – Wasza czcigodność, obawiam się, że [afflicted.Custom('PL_jego_jej')] duszę oblegają demony. Jedynym sposobem, by [afflicted.Custom('PL_mu_jej')] pomóc, jest odprawienie egzorcyzmu."
 pam_secular_faith_events.0026.a: "[afflicted.GetFirstName] potrzebuje właściwej opieki."
 pam_secular_faith_events.0026.b: "Osobiście przeprowadzę egzorcyzm."
 pam_secular_faith_events.0026.c: "To święte dzieło. Zajmij się tym."
 pam_secular_faith_events.0026.d: "Zabrać [afflicted.Custom('PL_go_ja')] stąd, nim panika się rozprzestrzeni!"
 pam_sf_exorcism_success_toast: "Egzorcyzm się udał"
 pam_sf_exorcism_failed_toast: "Egzorcyzm się nie udał"
 pam_secular_faith_events.0027.t: "Kryzys wiary"
 pam_secular_faith_events.0027.desc: "– Czy me słowa docierają do uszu [ROOT.Char.GetFaith.HighGodNamePossessive]? – szepczę, jednak w głębi duszy wiem, że nie wysłuchuje się osób o sumieniu tak splamionym jak moje.\n\n– Czy źle rozumiem wolę boską? Czy dogmat „[old_tenet.GetName( ROOT.Char.GetRite )]” nie jest prawdziwą formą mądrości [ROOT.Char.GetFaith.HighGodNamePossessive]?\n\nNa krzyż pada światło, a w mojej duszy budzi się nadzieja."
 pam_secular_faith_events.0027.a: "[new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )] – taka jest wola [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 pam_secular_faith_events.0027.b: "Może… dogmat „[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]”?"
 pam_secular_faith_events.0027.c: "Czeka mnie zguba. Podobnie jak wszystkich innych…"
 pam_secular_faith_events.0028.t: "Moja dusza zaznała spokoju"
 pam_secular_faith_events.0028.desc: "Klękam w budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship], a obecność [ROOT.Char.GetFaith.HighGodNamePossessive] przenika każdy zakątek mojej duszy.\n\nDogmat „[old_tenet.GetName( ROOT.Char.GetRite )]” ukazał mi prawdę. Nigdy nie wypełniał mnie taki spokój. Jak mogę zachować taką radość tylko dla siebie? Czy nie należy poprowadzić innych ku temu samemu światłu, aby ukazać im prawdę?"
 pam_secular_faith_events.0028.a: "Znajdę chętnych słuchaczy."
 pam_secular_faith_events.0028.b: "Jednak moją prawdziwą pasją jest dogmat „[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]”!"
 pam_secular_faith_events.0028.c: "Przeleję swoje uczucia na materiał. [ROOT.Char.Custom('GetWritingMaterial')|U] to idealne płótno."
 pam_secular_faith_events.0029.t: "Wizyta ze świata zmarłych"
 pam_secular_faith_events.0029.desc: "– [ROOT.Char.GetFirstNameNoTooltip], obudź się – rozlega się znajomy głos. – Jestem tu, [departed.Custom2( 'RelationToMeShortVocative', root_scope )]… w godzinie próby.\n\nPrzebudzam się, a moje czoło zroszone jest potem. Zjawa migocze przez krótką chwilę, po czym znika.\n\nCzy to ty… [ROOT.Char.Custom2( 'RelationToMeShortVocative', departed )]?"
 pam_secular_faith_events.0029.a: "[departed.GetFirstNameNoTooltip] jest w bezpiecznym miejscu i czuwa nade mną."
 pam_secular_faith_events.0029.b: "Czy to było… ostrzeżenie?"
 pam_secular_faith_events.0029.c: "To tylko figiel umysłu. Nic więcej."
 pam_secular_faith_events.0030.t: "Pustelnik"
 pam_secular_faith_events.0030.desc: "– Pragnę zbliżyć się do obecności [ROOT.Char.GetFaith.HighGodNamePossessive] – mówi uroczyście [would_be_anchorite.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )]. – Świat jest pełen rozproszeń, a ja pragnę całkowitej samotności.\n\n[would_be_anchorite.GetFirstNameNoTooltip] spogląda na ścianę mojej siedziby, którą jest [ROOT.Char.Custom('ResidenceBuilding')], wodząc po niej palcami.\n\n[ROOT.Char.GetFaith.HouseOfWorship|U] w miejscu o nazwie [church_scope.GetName] to coś pięknego. Chcę dać się zamknąć wśród tych ścian i spędzić resztę życia na nieprzerwanej modlitwie."
 pam_secular_faith_events.0030.a: "Jeśli takie jest twoje życzenie, moi murarze są do twojej dyspozycji."
 pam_secular_faith_events.0030.b: "Nie, nie spełnię tej prośby."
 pam_secular_faith_events.0031.t: "Kłótnia uczonych"
 pam_secular_faith_events.0031.desc: "– Jak ktokolwiek może podważyć świętość dogmatu „[tenet_1.GetBaseName]? – krzyczy [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )] [disputant_one.GetFirstName].\n\n– Nonsens! To oczywiste, że dogmat „[tenet_2.GetBaseName]” zbliża do świętości! Czy to niczego cię nie nauczyło? – odparowuje [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )] [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.a: "Debata uczonych? Muszę przynieść moje notatki…"
 pam_secular_faith_events.0031.b: "Przyciąga mnie dogmat „[tenet_1.GetBaseNameNoTooltip]”"
 pam_secular_faith_events.0031.c: "Dogmat „[tenet_2.GetBaseNameNoTooltip]” wydaje się głosić prawdę."
 pam_secular_faith_events.0031.d: "[ROOT.Char.Custom('GetCourt')|U], gdy tętni życiem, jest też pokazem mądrości."
 pam_secular_faith_events.0032.t: "Godzina pokuszenia"
 pam_secular_faith_events.0032.desc_food: "Budzę się, a moja poduszka jest mokra od śliny. Z kuchni dobiega zapach pieczeni – to [ROOT.Char.Custom('RegionalEdibleMeat')]. Czuję też inną potrawę – [ROOT.Char.Custom('GetRandomRegionalSmallGame')] z farszem, do którego dodano [ROOT.Char.Custom('GetFoodDetail')]. Z kolei brzęk kubków, w których podano trunki takie jak [ROOT.Char.Custom('RegionalDrink')], i wesołe głosy niosą się przez [ROOT.Char.Custom('ResidenceBuildingHallsType')].\n\n[vice_trait.GetName( GetNullCharacter )] – to określenie opisuje moją przywarę, z uwagi na którą [ROOT.Char.GetFaith.PriestNeuterPlural] nakazali mi post… ale dlaczego próba [ROOT.Char.GetFaith.HighGodNamePossessive] miałaby mnie czekać akurat tej nocy?\n\nCzuję, że im bardziej burczy mi w brzuchu, tym bardziej zanika moja silna wola."
 pam_secular_faith_events.0032.a: "Moje żądze usprawiedliwia wola [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 pam_secular_faith_events.0032.b: "Nie. Post trwa, a ja wytrwam."
 pam_secular_faith_events.0032.c: "Jeden mały kęs… kto się dowie?"
 pam_secular_faith_events.0033.t: "Nocne kazania"
 pam_secular_faith_events.0033.desc: "[believing_spouse.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )], postępuje zgodnie z naukami, które głosi [believing_spouse.GetRite.GetName|l], i z dumą wyszeptuje mi je w nocy.\n\n– [believing_spouse.Custom2( 'RelationToMeShortVocative', root_scope )|U], moja miłości, czy wiesz, co głosi ten obrządek? [new_tenet.Custom('GetGenericTenetSentence')]. Czy to nie #EMP fascynujące?#! – pyta, obejmując mnie.\n\nPasja, którą wykazuje [believing_spouse.GetFirstNameNoTooltip], jest równie urocza, co [believing_spouse.Custom('PL_jego_jej')] uśmiech."
 pam_secular_faith_events.0033.a: "Hm, powiedz mi więcej…"
 pam_secular_faith_events.0033.b: "#EMP Ty#! mnie fascynujesz! Chodź."
 pam_secular_faith_events.0033.c: "Proszę, kochanie, muszę spać."
 pam_secular_faith_events.0034.t: "Podrzutek"
 pam_secular_faith_events.0034.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] nie ma w zwyczaju się spóźniać. Cisza w budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship], zostaje zburzona przez cichy płacz noworodka.\n\n– Na miłość [ROOT.Char.GetFaith.HighGodNamePossessive]… – szepcze [chaplain.GetFirstNameNoTooltip], delikatnie kołysząc dziecko. – Porzucone jako [trait_scope.GetName( GetNullCharacter )|l]… – żadna dusza nie zasługuje na taki los.\n\n[chaplain.GetFirstNameNoTooltip] trzyma dziecko, a ono zaciska swoje malutkie palce na [chaplain.Custom('PL_jego_jej')]."
 pam_secular_faith_events.0034.a: "To dziecko to dar od [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip] przygarnie to dziecko."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip] wychowa to dziecko."
 pam_secular_faith_events.0034.d: "Nie obchodzi mnie, co się z nim stanie."
 pam_secular_faith_events.0035.t: "Umartwienie"
 pam_secular_faith_events.0035.desc: "Na ziemi widać krew. Podążając za odgłosem chłosty, odnajduję jego źródło – [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )] [sufferer.GetFirstName] w dłoniach trzyma karmazynowy bicz, a po [sufferer.Custom('PL_jego_jej')] policzkach płyną łzy.\n\n– Jam jest [sinful_trait.GetName( GetNullCharacter )|l] – dyszy. – Lepsze smaganie biczem niż ogień pokusy.\n\n– Ten ból przemija. [ROOT.Char.GetFaith.NegativeAfterLife|U] nie."
 pam_secular_faith_events.0035.a: "Intrygujące… daj mi bicz."
 pam_secular_faith_events.0035.b: "Niech [sufferer.GetFirstNameNoTooltip] dalej się umartwia."
 pam_secular_faith_events.0035.c: "Na litość [ROOT.Char.GetFaith.HighGodNamePossessive], skończ z tym szaleństwem."
 pam_sf_scourge_abandoned_toast: "Porzucony bicz"
 pam_secular_faith_events.0036.t: "Mądrość pustelnika"
 pam_secular_faith_events.0036.desc: "Pustelnik w łachmanach domaga się audiencji, utrzymując, że przybywa z odległego miejsca o nazwie [hermit_location.GetName], gdzie głównie można spotkać [hermit_location.Custom('TerrainTypeProvince')].\n\n– Przez siedem nocy z woli [ROOT.Char.GetFaith.HighGodNamePossessive] nie mogę spać – mówi surowo [hermit.GetFirstNameNoTooltip]. – Nie jest to forma kary, lecz chęć napełnienia mojej głowy prawdami przeznaczonymi dla innych. Dla ciebie.\n\n– Wysłuchaj moich słów i weź je sobie do serca. Wtedy wrócę do swojej samotni."
 pam_secular_faith_events.0036.a: "Jakie tajemnice możesz wyjawić?"
 pam_secular_faith_events.0036.b: "Łaknę wiedzy."
 pam_secular_faith_events.0036.c: "Precz, żebraku."
 pam_secular_faith_events.0037.t: "Cielesne odkrycie"
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] leje się dziś do późna, a goszcząca u mnie osoba – [reveler.GetFirstName] – nachyla się do mnie."
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] leje się dziś do późna, [ROOT.Char.Custom2( 'RelationToMeShort', reveler )] [reveler.GetFirstName] nachyla się do mnie."
 pam_secular_faith_events.0037.desc: "Wkrótce nic nie przykuwa mojej uwagi równie mocno jak [reveler.Custom('PL_jego_jej')] [reveler.Custom('ObjectifiedFeature')].\n\n– Są modlitwy wygłaszane słowem – mówi powoli, zdejmując [reveler.Custom('GetClothingArticle')]. – Są też modlitwy głoszone ciałem. Pokażę ci sztukę miłosną znaną jako [reveler.Custom('pam_sf_carnal_art')], [ROOT.Char.Custom('RaunchyComplimentNoun')].\n\n[reveler.GetFirstNameNoTooltip] wyciąga do mnie dłoń. – Nadchodząca ekstaza dorówna błogości, jaką dusza zaznaje w raju."
 pam_secular_faith_events.0037.a: "Pokaż mi. Zarygluj drzwi za sobą."
 pam_secular_faith_events.0037.b: "Zakryj się."
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "zwijający się wąż"
 pam_sf_carnal_art_2: "wzbierająca rzeka"
 pam_sf_carnal_art_3: "splątane pnącza"
 pam_sf_carnal_art_4: "ciasne objęcia"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "rozłupywanie bambusa"
 pam_sf_carnal_art_6: "sztuczka klaczy"
 pam_sf_carnal_art_7: "rozkwitający lotos"
 pam_sf_carnal_art_8: "żona Indry"
 pam_sf_carnal_art_9: "wznosząca się kobra"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "węzeł kochanków"
 pam_sf_carnal_art_11: "róża i cierń"
 pam_sf_carnal_art_12: "sekret trubadura"
 pam_sf_carnal_art_13: "osłonięty płomień"
 pam_secular_faith_events.0038.t: "Smak raju"
 pam_secular_faith_events.0038.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', reveler )] [reveler.GetFirstName] napełnia kolejny talerz owocami, którymi są [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')], i uśmiecha do mnie zza stołu.\n\n– Szukasz prawd [ROOT.Char.GetFaith.HighGodNamePossessive] z burczącym brzuchem i pustym kielichem. Ja odnajduję je w dojrzałych owocach, doskonałym mięsie, śmiechu i pieśni – mówi, unosząc pełny kielich.\n\nDarów [ROOT.Char.GetFaith.HighGodNamePossessive] należy kosztować. Marnować to, co zostało nam dane? To dopiero potworny grzech!"
 pam_secular_faith_events.0038.a: "Może świętość jest w kielichu…"
 pam_secular_faith_events.0038.b: "W takim razie wydam ucztę na cześć [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0038.c: "Dekadencja przebrana za oddanie. Nie."
 pam_secular_faith_events.0039.t: "Modlitwa w mroku"
 pam_secular_faith_events.0039.desc: "Gdy przychodzi do mnie [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )] [spymaster_scope.GetFirstName], widzę u [spymaster_scope.Custom('PL_niego_niej')] niepokój wywołany owocami własnego sprytu.\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] wyobrazi sobie taką oto sytuację. Klękam na modlitwę, obok mnie to samo robi [secret_keeper.GetTitledFirstName]. Postanawiam więc skłamać – wyszeptuję drobną, pobożną nieprawdę, by rozwiązać [secret_keeper.Custom('PL_mu_jej')] język.\n\n– Osoba ta przyznała się do grzechu, jakim jest [secret_keeper.Custom('GetSecretCrimeConfessionIndef')], i to w domu [ROOT.Char.GetFaith.HighGodNamePossessive] – zniża głos [spymaster_scope.GetFirstName]. – Moje słowa były zgodne z dogmatem „[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )|l]”… Może to oszustwo jest obowiązkiem, który mamy wobec [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_secular_faith_events.0039.a: "Działania [ROOT.Char.GetFaith.HighGodNamePossessive] rzeczywiście skrywa mrok…"
 pam_secular_faith_events.0039.b: "Żałosna sztuczka… po prostu wyjaw mi ten sekret."
 pam_secular_faith_events.0040.t: "Ciało wiernych"
 pam_secular_faith_events.0040.desc: "Podczas wieczornego posiłku [ROOT.Char.Custom2( 'RelationToMeShort', scholar )] [scholar.GetFirstName] otwiera wysłużony tom. Zaraz zacznie się kolejny wykład.\n\n– [Glossary( 'Issedonowie', 'ISSEDONES_GLOSS' )] nie grzebali swoich zmarłych. Oni się nimi karmili! – mówi, ledwie łapiąc oddech. – Ciało ojca mieszano z baraniną, a jego czaszkę złocono i czczono jako świętą relikwię. Dla nich to była najprawdziwsza forma miłości, jaką mogło okazać dziecko.\n\n– A co w tym wszystkim najlepsze? – szczerzy się w uśmiechu [scholar.GetFirstName]. – Sam Herodot nie uważał ich za niegodziwców ani szaleńców. #EMP „Zwyczaj”#! – mawiał – #EMP „jest panem wszystkiego”.#!"
 pam_secular_faith_events.0040.a: "Och, wiem wszystko na ten temat."
 pam_secular_faith_events.0040.b: "Cóż za ponury zwyczaj… powiedz mi więcej."
 pam_secular_faith_events.0040.c: "Na litość [ROOT.Char.GetFaith.HighGodNamePossessive], próbuję jeść!"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "Lud z dalekich północnych stepów opisywany przez starożytnego greckiego historyka, Herodota. Po śmierci ojca danej osoby jej bliscy zarzynali bydło, mieszali mięso z ciałem zmarłego i dzielili się nim podczas uroczystej uczty pogrzebowej. Następnie czaszkę obdzierano z tkanek, oczyszczano i ozłacano, po czym przechowywano jako świętą relikwię i czczono, składając coroczną ofiarę. Herodot zestawił te obrzędy z grecką kremacją nie po to, aby je potępić, lecz by pokazać, że „zwyczaj jest panem wszystkiego” – że każdy lud uważa swoje własne zwyczaje za najsłuszniejsze."
 pam_secular_faith_events.0041.t: "Naga prawda"
 pam_secular_faith_events.0041.desc: "Gdy przechadzam się po moich ogrodach, zauważam wśród grządek kwiatów, gdzie dominuje [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')], nieznajomą postać. Zrywa ona owoce z mojego drzewa, którym jest [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')] – naga jak w dniu narodzin, a jej jedynym odzieniem są opadające liście.\n\n– Och, [ROOT.Char.GetTitleAsName]! Czemu kryjesz się za szatą i koroną? – pyta nieznajoma osoba, nie czując wstydu przed obliczem [ROOT.Char.GetFaith.HighGodNamePossessive] ani moim. – Odzyskuję pierwotną niewinność z czasów, gdy żyliśmy nago i bez lęku.\n\nOsoba ta odgryza kolejny kawałek owocu, a sok spływa po jej skórze. – Może weźmiesz ze mnie przykład."
 pam_secular_faith_events.0041.a: "Ja również pragnę takiej wolności."
 pam_secular_faith_events.0041.b: "Jedz moje owoce, opowiedz swoją historię, a potem odejdź."
 pam_secular_faith_events.0041.c: "Zamknąć intruza."
 pam_secular_faith_events.0042.t: "Ułatwiona droga"
 pam_secular_faith_events.0042.desc: "[sponsor_character.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )], spotyka mnie w ogrodzie z otwartą sakiewką i ciepłym uśmiechem.\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] pozwoli, że poniosę koszty przedsięwzięcia, jakim jest twoja [GetActivityType( 'activity_pilgrimage').GetName|l]. Szlak pielgrzymi to nie miejsce na liczenie monet – podążaj nim swobodnie i pomódl się za mnie i za siebie.\n\nMoneta jest prawdziwa. Podobnie jak stojące za nią zaufanie."
 pam_secular_faith_events.0042.a: "Wyruszę w drogę z wdzięcznością w sercu."
 pam_secular_faith_events.0042.b: "Przyjmę monetę i zachowam ją."
 pam_secular_faith_events.0042.c: "Zachowaj swoją monetę."
 pam_sf_pilgrimage_sponsor_tt: "Jeśli [GetActivityType( 'activity_pilgrimage').GetName|l] zostanie ukończona w ciągu #V 7#! lat, [sponsor_character.GetFirstName] zyska #P 50#! punktów opinii na twój temat"
 pam_sf_pilgrimage_sponsor_toast: "Uradowany patron"
 pam_secular_faith_events.0043.t: "Przywitanie pielgrzyma"
 pam_secular_faith_events.0043.desc: "[holy_man.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )], chwyta mnie za dłonie przed ołtarzem.\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] kroczy drogą pielgrzyma. Gdy wrócisz, opowiem o przedsięwzięciu, jakim jest twoja [GetActivityType( 'activity_pilgrimage').GetName|l], na każdym placu w miejscu o nazwie [capital_county.GetNameNoTier]. Twoi poddani dowiedzą się, że ich [ROOT.Char.GetTitleAsNameNoTooltip] klęka w ich intencji."
 pam_secular_faith_events.0043.a: "W takim razie podążę drogą pielgrzyma."
 pam_secular_faith_events.0043.b: "Muszę zająć się sprawami doczesnymi."
 pam_sf_extolled_pilgrimage_toast: "Lud się raduje"
 pam_secular_faith_events.0044.t: "Posłuch u duchowieństwa"
 pam_secular_faith_events.0044.desc: "[friendly_bishop.GetFirstName], czyli [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )], przybywa w zaskakująco dobrym humorze.\n\n– Ostatnimi czasy cieszę się względami moich braci – biskupów, opatów, osób, których głos liczy się w Kościele. Jeśli potrzebujesz ich pobożnej mądrości lub autorytetu moralnego, mogę przemówić w twoim imieniu.\n\nWzględy, którymi cieszy się [friendly_bishop.GetFirstNameNoTooltip] wśród żądnych władzy postaci, jakimi są [ROOT.Char.GetFaith.PriestNeuterPlural|l], można łatwo utracić."
 pam_secular_faith_events.0044.a: "W takim razie zabierz głos w moim imieniu."
 pam_secular_faith_events.0044.b: "Sama przyjaźń z tobą jest wystarczającym błogosławieństwem."
 pam_secular_faith_events.0045.t: "Objawienie"
 pam_secular_faith_events.0045.desc: "Uderza niczym grom z jasnego nieba – jasność.\n\nDoktryna. Dogmaty. Obrzędy. Wiara. To, co niegdyś zdawało się tysiącem porozrzucanych myśli, teraz układa się przede mną w jedną prawdę."
 pam_secular_faith_events.0045.a: "Przyszłość wzywa mnie do przywództwa."
 pam_secular_faith_events.0045.b: "Nacieszę się tą chwilą."
 pam_secular_faith_events.0046.t: "Wspólne przekonania"
 pam_secular_faith_events.0046.desc: "[intimate.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', intimate )], nie może ukryć swojego przekonania, gdy mówi o dogmacie „[shared_tenet.GetName( intimate.GetRite )]”.\n\n[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )] to coś, co nadaje sens wszystkiemu, co robię – mówi [intimate.GetFirstName]. – Tylko jedna rzecz ma dla mnie równie wielkie znaczenie… ty.\n\nPojedyncza łza spływa po [intimate.Custom('PL_jego_jej')] policzku. – Po prostu muszę ci to wyznać."
 pam_secular_faith_events.0046.a: "Niech wspólne przekonania pogłębią naszą więź!"
 pam_secular_faith_events.0046.b: "Podzielanie tego przekonania… to niczym miłość."
 pam_secular_faith_events.0046.c: "Dziękuję za szczerość."
 pam_secular_faith_events.0047.t: "Duchowne oddanie"
 pam_secular_faith_events.0047.desc: "[chaplain.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], kreśli znak krzyża i pochyla głowę.\n\n– Z woli [ROOT.Char.GetFaith.HighGodNamePossessive] korona nie bez powodu znalazła się na twoich skroniach. Służąc wiernie tobie, służę woli [ROOT.Char.GetFaith.HighGodNamePossessive] – oświadcza.\n\n– Na mocy złożonej przysięgi oddaję się woli [ROOT.Char.GetFaith.HighGodNamePossessive]. Teraz pragnę złożyć tę przysięgę również tobie."
 pam_secular_faith_events.0047.a: "W takim razie służ mi w pełni."
 pam_secular_faith_events.0047.b: "Na pierwszym miejscu zawsze musisz stawiać służbę na rzecz [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0048.t: "Demoniczne sny"
 pam_secular_faith_events.0048.desc: "Budzę się, lecz nie mogę się ruszać.\n\nPrzede mną tańczy pokraczna postać, rechocząc. Demon? Powoli wypełnia mnie przerażenie.\n\n– Ha… ha… masz bardzo ciężkie grzechy na sumieniu. Wkrótce dosięgnie cię kara!\n\nSen czy demon, nie mogę zignorować tego, co mi się ukazało. Muszę szukać pojednania u [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0048.a: "Ten sen… musi coś znaczyć."
 pam_secular_faith_events.0048.b: "To tylko sen. Czas znowu zasnąć."
 pam_secular_faith_events.0048.c: "Błagam o łaskę [ROOT.Char.GetFaith.HighGodNamePossessive]! Muszę odpokutować!"
 pam_sf_demon_torment_modifier_tt: "Aby pozbyć się modyfikatora, musisz wznieść [holding|El], którą jest [GetBuilding('temple_01').GetName|l], lub wziąć udział w aktywności, jaką jest [GetActivityType('activity_pilgrimage').GetName|l]"
 pam_sf_demon_torment_lifted_toast: "Udręka ustępuje"
 pam_secular_faith_events.0049.t: "„Hierarchia niebiańska”"
 pam_secular_faith_events.0049.desc: "Dźwięki dobiegające z mojej kaplicy nie przypominają modlitwy.\n\n– Tak! #emp TAK#!, wasza wysokość! Pokaż tej grzesznej osobie jej właściwe miejsce zgodnie z dogmatem „[GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]”! – krzyczy w ekstazie [lustful_priest.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )]. – Jestem robakiem pełzającym w błocie, pełnym ziemskiego pożądania! #emp UKARZ MNIE!#!\n\nNa litość [ROOT.Char.GetFaith.HighGodNamePossessive], co się dzieje w mojej kaplicy?!"
 pam_secular_faith_events.0049.a: "To pewnie jakiś rytuał, muszę… wszystko zanotować."
 pam_secular_faith_events.0049.b: "Skoro to się dzieje w #EMP mojej#! kaplicy, to #emp ja też#! dołączam!"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip] oddaje się dewiacjom?! Odrażające, ale przydatne."
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U] [chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0050.desc: "Migoczące świece w budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship|l], wcale nie pomagają mi oderwać się od nieczystych myśli wypełniających mój umysł.\n\n– Niech [ROOT.Char.Custom('FormOfAddressForLiege')] pójdzie ze mną do konfesjonału – szepcze [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName]. [chaplain.Custom('PL_jego_jej')|U] atut – [chaplain.Custom('ObjectifiedFeature')] – przyciąga mój wzrok.\n\n– Cokolwiek ciąży na twojej duszy, wyznaj to bez lęku.\n\nDogmat „[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )]” to rzecz święta… ale jeden grzech ciąży mi bardziej niż wszystkie inne: [chaplain.GetFirstName] i [chaplain.Custom('PL_jego_jej')] [chaplain.Custom('AdmiredFeature')]."
 pam_secular_faith_events.0050.a: "…czy w twoim konfesjonale znajdzie się miejsce dla dwojga?"
 pam_secular_faith_events.0050.b: "Niech mi [chaplain.GetMotherFather] wybaczy, bo mam nieczyste myśli."
 pam_secular_faith_events.0051.t: "Pan, Bóg twój"
 pam_secular_faith_events.0051.desc: "#EMP – Jam jest Pan, Bóg twój.#! – Donośny głos odbija się echem w budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship|l]. #EMP – Pokłonisz się przede mną.#!\n\nPadam na kolana, wzrok mi zachodzi mgłą. Ocieram strużkę krwi z twarzy.\n\n#EMP – Ja, Pan, Bóg twój, nakazuję ci: okaż mi posłuszeństwo całym swoim sercem i całą swoją duszą.#! – Jeden głos zmienia się w sto. Sto staje się tysiącem. #EMP – Jeśli tego nie uczynisz, rzucę na ciebie klątwę, która cię zniszczy, albowiem porzucasz mnie – Pana, Boga twego.#!"
 pam_secular_faith_events.0051.a: "Okażę… posłuszeństwo…"
 pam_sf_lord_your_god_effect_tt: "@alert_icon! #alert_trial Wydarzy się coś strasznego lub pięknego…#!"
 pam_sf_lord_your_god_tt: "Proszę, litości…"
 pam_sf_voice_of_jesus_toast: "Głos Jezusa"
 pam_sf_stroke_of_god_toast: "Uderzenie Boga"
 pam_secular_faith_events.0052.t: "Gdy już odejdziesz"
 pam_secular_faith_events.0052.desc: "W budowli, jaką jest [ROOT.Char.GetFaith.HouseOfWorship|l] w miejscu o nazwie [resting_church.GetNameNoTier], [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] zatrzymuje się przed wytartymi płytami nagrobnymi tych, którzy rządzili przede mną.\n\n– Z łaski [ROOT.Char.GetFaith.HighGodNamePossessive] może [ROOT.Char.Custom('FormOfAddressForLiege')] przeżyć więcej zim niż większość. To nie grzech zdecydować o swoim spoczynku.\n\n– Twoja szlachetna podobizna wyryta w kamieniu czy [Glossary( 'zwykły kaptur', 'AD_SUCCURRENDUM_GLOSS' )] mnicha – wybór należy do ciebie."
 pam_secular_faith_events.0052.a: "Wykujcie moją podobiznę… ale młodszą i lepiej wyglądającą."
 pam_secular_faith_events.0052.b: "Zwykły kaptur wystarczy."
 pam_secular_faith_events.0052.c: "Grób jest cierpliwy."
 pam_sf_effigy_planned_tt: "Jeśli po twojej śmierci zostanie odprawiony [GetActivityType( 'activity_funeral').GetName|l], jego organizator zyska [prestige_i] #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! pkt [Concept('prestige', 'prestiżu')|E]"
 pam_sf_cowl_burial_planned_tt: "Jeśli po twojej śmierci zostanie odprawiony [GetActivityType( 'activity_funeral').GetName|l], jego organizator zyska [piety_i] #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! pkt [Concept('piety', 'pobożności')|E]"
 pam_sf_effigy_unveiled_toast: "Ujawniona podobizna"
 pam_sf_cowl_burial_toast: "Złożenie do spoczynku w kapturze"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "Umrzeć #G ad succurrendum#! – czyli złożyć śluby zakonne i przywdziać habit na łożu śmierci – było ostatnią deską ratunku dla możnowładców w całym średniowiecznym chrześcijaństwie. Umierający władca, pochowany w zwykłym kapturze zamiast w jedwabiach, żywił nadzieję, że na sądzie ostatecznym stanie przed Bogiem wśród skromnych braci, a nie wśród możnych."
 pam_secular_faith_events.0053.t: "Święty wyrusza"
 pam_secular_faith_events.0053.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] unosi wieko relikwiarza z troską akuszerki. W środku spoczywa skarb mojego rodu: [procession_relic.GetName].\n\n– Świętość trzymana pod kluczem nikomu nie służy, niech [ROOT.Char.Custom('FormOfAddressForLiege')] o tym wie – mówi [chaplain.GetFirstName]. – Pozwól swojemu ludowi na [Glossary( 'okazanie', 'OSTENSION_GLOSS' )] – niech ujrzy tę relikwię, i pobłogosław każdą ulicę stąd aż po same bramy."
 pam_secular_faith_events.0053.a: "Osobiście poniosę relikwiarz."
 pam_secular_faith_events.0053.b: "Samotnie odprawię to czuwanie."
 pam_secular_faith_events.0053.c: "Nie ośmielę się tego ruszyć."
 pam_sf_procession_gamble_tt: "Ulice to nie skarbiec, artefakt może ulec uszkodzeniu…"
 pam_sf_relic_jostled_toast: "Potrącenie w tłumie"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "Uroczyste okazanie relikwii świętego. W dni wielkich świąt relikwie wyjmowano ze skarbców i niesiono w procesji ulicami oraz polami, aby błogosławieństwo przypisane do jednego ołtarza mogło spłynąć na każdą duszę po drodze. Relikwia niesiona w procesji przyciągała tłumy, monety i rozgłos wszędzie tam, dokąd ją zabierano."
 pam_secular_faith_events.0054.t: "Miednica i płótno"
 pam_secular_faith_events.0054.desc: "Miednica paruje u moich stóp, a [ROOT.Char.Custom('GetCourt')] gromadzi się, by to obserwować. Na stołku przede mną siedzi z wyraźnym podenerwowaniem [pauper.Custom2('dummy_peasant_profession', pauper)|l], a [pauper.Custom('PL_jego_jej')] bose stopy są oblepione brudem. Zapach jest… dość charakterystyczny.\n\nTej samej nocy sam Zbawiciel uklęknął z miednicą i płótnem. [Glossary( 'Mandatum', 'MANDATUM_GLOSS' )] zostało przygotowane, woda jest ciepła, a wszystkie oczy w sali są zwrócone na mnie.\n\nPozostaje tylko klęknąć… albo zmienić zdanie."
 pam_secular_faith_events.0054.deviant: "#EMP Wyczyszczę te apetyczne stopy własnym językiem.#!"
 pam_secular_faith_events.0054.a: "Klęknij i chwyć za płótno."
 pam_secular_faith_events.0054.b: "Klęknij i ucałuj zmęczone stopy."
 pam_secular_faith_events.0054.c: "Ja… nie mogę. Zabierzcie tę miednicę."
 pam_sf_odorous_feet_tt: "Gdy uklęknę, może napełnić mnie świętość… albo zapach tych plebejskich stóp już nigdy mnie nie opuści"
 pam_sf_odorous_feet_toast: "Odór się utrzymuje"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "Obrzęd obmywania stóp, którego nazwa pochodzi od słów Chrystusa wypowiedzianych podczas Ostatniej Wieczerzy: #G „Mandatum novum do vobis”#! – „Daję wam nowe przykazanie”. Co roku w czwartek przed Wielkanocą cesarzowie w Konstantynopolu oraz królowie na całym Zachodzie klękali z miednicą i płótnem przed wybranymi ubogimi, obmywali im stopy i wciskali srebro w ich dłonie – na ten jeden wieczór najpotężniejsza głowa w sali pochylała się najniżej."
 pam_secular_faith_events.0055.t: "Głos z brązu"
 pam_secular_faith_events.0055.desc: "Stary dzwon z miejsca znanego jako [bell_church.GetName] pękł i w rezultacie został odlany na nowo. Dziś w wieży wisi już nowy, lśniący dzwon. Pod nim stoi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] – ma ze sobą wodę, święty olej i sól.\n\n– Dzwon musi zostać [Glossary( 'ochrzczony', 'BELL_BAPTISM_GLOSS' )], zanim przemówi na chwałę [ROOT.Char.GetFaith.HighGodNamePossessive] – upiera się [chaplain.GetFirstName] z podwiniętymi już rękawami. – Gdy zostanie obmyty, namaszczony i nazwany, żaden demon ani burza nie zdołają uciszyć jego głosu."
 pam_secular_faith_events.0055.a: "Niechaj zatem zostanie obmyty, namaszczony i nazwany."
 pam_secular_faith_events.0055.b: "To tylko brąz, a nie dusza – tak przynajmniej głoszą kapitularze."
 pam_secular_faith_events.0055.c: "Krótkie błogosławieństwo wystarczy. Niech dzwoni."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "Dzwony kościelne konsekrowano w bardzo podobny sposób, co chrześcijan: obmywano je wodą święconą, namaszczano olejem i nadawano im imię świętego – niektóre miały nawet własnych rodziców chrzestnych. Wydane w 789 r. dzieło #G Admonitio Generalis#! Karola Wielkiego zabraniało chrztu dzwonów, lecz mimo to zwyczaj ten przetrwał przez stulecia. Wierzono, że ochrzczony dzwon rozprasza burze, grad i demony wszędzie tam, dokąd dociera jego głos. W późniejszych czasach ludwisarze odlewali na swoich dzwonach motto #G Fulgura frango#! – „Rozbijam pioruny”."
 pam_secular_faith_events.0056.t: "Wróbel w sali"
 pam_secular_faith_events.0056.desc: "Wróbel wlatuje z zimowej ciemności, przelatuje przez całą długość pomieszczenia, jakim jest [ROOT.Char.Custom('ResidenceBuildingHallType')], pośród dymu pochodni oraz śmiechów, i po chwili wylatuje przez [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\n[ROOT.Char.Custom('GetCourt')|U] się śmieje. [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|U] [chaplain.GetFirstName] – bynajmniej.\n\n– [Glossary( 'Takie też jest życie człowieka', 'BEDE_SPARROW_GLOSS' )], niech [ROOT.Char.Custom('FormOfAddressForLiege')] o tym wie – to zaledwie chwila w świetle i cieple, wyjście z jednej ciemności i wejście w drugą. Co było przedtem i co nastąpi potem, wie tylko mądrość [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0056.scholar: "Beda pisał o tym samym, niemal słowo w słowo."
 pam_secular_faith_events.0056.a: "Niech więc ta chwila w świetle zostanie dobrze wykorzystana."
 pam_secular_faith_events.0056.b: "To był tylko ptak. Więcej wina."
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "W opowieści Bedy jeden z doradców króla Edwina z Nortumbrii przyrównał życie człowieka do wróbla przelatującego w zimową noc przez ciepłą salę biesiadną: to krótkie przejście przez światło i wygodę, ucieczka przed burzą tylko po to, by zaraz w nią powrócić, podczas gdy wszystko przedtem i potem pozostaje nieznane. Argumentował, że jeśli nowa wiara potrafi wyjaśnić, co kryje się poza tą salą, zasługuje na to, by ją przyjąć – Edwin dał się przekonać."
 pam_secular_faith_events.0057.t: "Piwo kościelne"
 pam_secular_faith_events.0057.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] stoi na dziedzińcu kościelnym w miejscu o nazwie [ale_church.GetName] pośród stołów, przy których zasiada połowa parafian, oraz beczek, które dostarczyły [GetBuilding('breweries_01').GetName|l], trzymając już w dłoni pełny kufel.\n\n– [ROOT.Char.Custom('FormOfAddressForLiege')|U] musi wiedzieć, że dach jest dziurawy i dziesięcina nie wystarcza. Dlatego bracia warzą [Glossary( 'piwo kościelne', 'CHURCH_ALE_GLOSS' )], my je sprzedajemy, a parafianie będą je pić, dopóki w pełni nie opłacimy naprawy dachu.\n\n– Każdy kufel to dobry uczynek. Czy wasza czcigodność weźmie jeden?"
 pam_secular_faith_events.0057.a: "Podaj mi kufel. Za dach."
 pam_secular_faith_events.0057.b: "Oszczędź piwo – zapłacę za dach."
 pam_secular_faith_events.0057.c: "Pić alkohol? Na świętej ziemi? Wylejcie to."
 pam_sf_church_ale_gamble_tt: "Dochód z każdego kufla ma iść na dach, a parafia warzy mocne piwo…"
 pam_sf_church_ale_toast: "Poranny ból głowy"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "Podczas uroczystości parafialnych na dziedzińcu kościelnym sprzedawano piwo warzone z podarowanego słodu, a dochody przeznaczano na utrzymanie kościoła – naprawę przeciekającego dachu, nowy dzwon, chleb dla ubogich. Synody potępiały picie alkoholu na świętej ziemi, a parafie nadal warzyły piwo; w przypadku wielu wiejskich kościołów piwo przynosiło większe dochody niż dziesięcina."
 pam_secular_faith_events.0058.t: "Quid mus sumit?"
 pam_secular_faith_events.0058.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] wpada do mojej komnaty, z twarzą bladą niczym obrus ołtarzowy, trzymając małe srebrne [Glossary('cyborium', 'PYX_GLOSS')] tak, jakby paliło [chaplain.Custom('PL_go_ja')] w dłonie.\n\n[ROOT.Char.Custom('FormOfAddressForLiege')|U] musi wiedzieć, że mamy myszy. Jedna z nich przedostała się w nocy do wnętrza cyborium i zjadła [Glossary('chleb święcony', 'RESERVED_HOST_GLOSS')]!\n\n[chaplain.GetFirstName] ledwo łapie oddech.\n\n– Uczeni pytają: [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )], co więc zjadła mysz? Cóż mam począć?"
 pam_secular_faith_events.0058.scholar: "Uspokójcie się. Mysz zjadła chleb, nic więcej."
 pam_secular_faith_events.0058.mean: "Pozwoliliście #EMP myszy#! posmakować [ROOT.Char.GetFaith.HighGodNamePossessive]?! Won, mój [ROOT.Char.Custom('GetCourt')] to nie miejsce dla takich, jak ty!"
 pam_secular_faith_events.0058.a: "Kupcie cyborium z wytrzymalszym zamknięciem."
 pam_secular_faith_events.0058.b: "A więc mysz została przeklęta? Ha!"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! Co zjada mysz? Pytanie, nad którym teologowie prowadzili gorącą dyskusję, sprowadzało się do następującego zagadnienia: jeśli mysz przegryzła konsekrowaną hostię, to czy zjadła Ciało Boże? Prawo kanoniczne przewidywało pokuty dla księży, którzy niedbale obchodzili się z sakramentem, a wielcy teologowie orzekli, że mysz przyjmuje jedynie zwykły chleb – sakrament bowiem wycofuje się przed niegodnymi zębami."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "Małe pudełko z pokrywką, zazwyczaj wykonane ze srebra lub pozłacane, w którym przechowuje się konsekrowany chleb mszalny. Prawo kanoniczne wymagało, by było ono utrzymywane w czystości, zamknięte na klucz i zabezpieczone przed profanacją – lub przed głodnymi gośćmi."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "Chleb konsekrowany podczas mszy świętej, a następnie odłożony na bok i przechowywany w kościele, aby chorzy i umierający mogli go przyjąć o dowolnej porze. Po konsekracji chleb ten uważano za prawdziwe Ciało Boże, co sprawiało, że jego ochrona miała ogromne znaczenie."
 pam_secular_faith_events.0059.t: "Dzień pański"
 pam_secular_faith_events.0059.desc: "Słowo dociera do mnie o świcie, gdy za cel obieram sobie zwierzynę, którą jest [sighting_county.Custom('GetAnimalType')], zamieszkującą [sighting_province.Custom('GetTerrainTypePlural')] w miejscu znanym jako [sighting_county.GetBaseNameNoTier]. Psy wyją, a konie tupią na podwórzu, lecz [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] stoi w zwartej pozycji w bramie.\n\n– [ROOT.Char.Custom('FormOfAddressForLiege')|U] musi wiedzieć, że mamy dziś [Glossary( 'dzień odpoczynku', 'LORDS_DAY_GLOSS' )]. Dzwony zabiły, msza czeka!\n\n– Wasza czcigodność otrzymała od [ROOT.Char.GetFaith.HighGodNamePossessive] sześć dni na jazdę. Nie można sobie tego jednego dnia darować?"
 pam_secular_faith_events.0059.a: "Rozsiodłać konie. Wysłuchajmy mszy."
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')|U] nie będzie czekać. Wyruszamy!"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "Pierwszy dzień tygodnia, uświęcony w na pamiątkę Zmartwychwstania. Sobory kościelne zakazały w tym dniu pracy fizycznej, targów i próżnych rozrywek, a chrześcijańscy królowie wprowadzili ten zakaz do prawa, choć niejeden władca uważał polowanie na jelenie, podobnie jak kazanie, za sprawę między nim a Bogiem."
 pam_secular_faith_events.0060.t: "Życie bez ciężaru"
 pam_secular_faith_events.0060.desc: "Gdy przejeżdżam przez ulice miejsca o nazwie [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], zamartwiając się brakiem pieniędzy i pogrążając w wewnętrznym zamęcie, zauważam żebraka.\n\nOsoba ta zdaje się nie przejmować dobrami doczesnymi: tańczy sobie ze spokojem i mądrością kogoś, kto pogodził się ze swoim miejscem na świecie i uwolnił duszę od tego, co dręczy takich ludzi jak ja.\n\nMoże zna prawdę, która mogłaby wyzwolić i mnie?"
 pam_secular_faith_events.0060.a: "Im mniej mam, tym bardziej jestem!"
 pam_secular_faith_events.0060.b: "Raz jeszcze ozłocę swoją klatkę!"
 pam_secular_faith_events.0060.c: "Zabierzcie mnie z tego deszczu."
