l_polish:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "Głagolica"
 slavic_rite.1000.desc: "– Niech brat [greek_preacher.GetFirstName] kontynuuje – [court_chaplain.GetActiveCouncilTask.GetPositionName|l] ponagla osobę, którą jest [greek_preacher.Custom('MyPriestTitle')|l], wyznającą [GetRiteByKey('byzantine_rite').GetName|l].\n\n– Niechaj [ROOT.Char.GetTitleAsNameNoTooltip] i państwo będą błogosławieni. Moi bracia robią spore postępy w pracy nad skryptem dla ludu waszej czcigodności. Działamy niestety w cieniu, gdyż księża [GetRiteByKey('carolingian_christianity').GetAdherentNamePlural] pragną przejąć władzę kościelną na twoich ziemiach. [Glossary('Cyryl i Metody', 'CYRIL_AND_METHODIUS_GLOSS')] proszą mnie o więcej czasu na opracowanie strategii, która pozwoli uniknąć konfliktów i znaleźć dyplomatyczne rozwiązanie."
 slavic_rite.1000.a: "Zaszliśmy już naprawdę daleko. Liczę na nich."
 slavic_rite.1000.a_tt: "[Glossary( 'Cyryl i Metody', 'CYRIL_AND_METHODIUS_GLOSS' )], bracia, którzy stworzyli nowe pismo słowiańskie, wkrótce poinformują cię o swoich kolejnych działaniach mających na celu szerzenie [Concept('rite', 'obrządku')|E] wiary znanej jako [court_chaplain.GetFaith.GetName|l] w twoim państwie."
 slavic_rite.1000.b: "Lepiej będzie zrezygnować z tego pomysłu, niż przekonać się, czym jest [GetRiteByKey('carolingian_christianity').GetAdjectiveNoTooltip|l] wściekłość."
 slavic_rite.1000.b_tt: "Wszelkie wysiłki [Glossary('Cyryla i Metodego', 'CYRIL_AND_METHODIUS_GLOSS')] zmierzające do stworzenia lokalnego pisma i ustanowienia nowego [Concept('rite', 'obrządku')|E] zostały zaniechane."
 slavic_rite.1000.b_tt_2: "Kończy się [story_cycle|El] pod tytułem „$story_slavic_rite$”."
 # Travel to Rome Initiation
 slavic_rite.0001.t: "Misja morawska"
 slavic_rite.0001.desc: "Czuję ulgę, że [Glossary('Cyryl i Metody', 'CYRIL_AND_METHODIUS_GLOSS')] są ponownie przy mnie i mam nadzieję, że dzięki nim [GetRiteByKey('carolingian_christianity').GetAdjective|l] ingerencja nie będzie stanowić dla nas problemu.\n\n– [ROOT.Char.GetTitleAsNameNoTooltip] musi wiedzieć, że jedynym sposobem zapewnienia bezpieczeństwa formie kultu naszej ludności wydaje się podróż do miejsca o nazwie [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] i otrzymanie błogosławieństwa osoby znanej jako [pope_scope.GetTitledFirstName].\n\nMam nadzieję, że autorytet tronu św. Piotra sprawi, iż despotyczni [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip] opanują się, ale wygląda na to, że szanują oni wyłącznie swoich."
 slavic_rite.0001.a: "Z Bogiem."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName] i [methodius_scope.GetFirstName] rozpoczną swoją podróż. Jeśli okaże się owocna, ich powrót może zapoczątkować nowy ruch religijny w twoim państwie."
 slavic_rite.0001.b: "Nie pozwolę ci odejść z pustymi rękoma."
 slavic_rite_travel_toast_title: "Cyryl i Metody wyruszają w podróż"
 slavic_rite_moravian_mission_gift_sent_tooltip: "Dary zostaną wysłane do miejsca znanego jako [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Po twoim powrocie bracia przekażą ci, jak zostały przyjęte."
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "Narodziny nowego obrządku znanego jako [methodius_scope.GetRite.GetName|l]"
 slavic_rite.0003.desc: "Doszły mnie słuchy, że [methodius_scope.GetFirstNameNoTooltip], z pomocą osoby znanej jako [moravia_liege_scope.GetTitledFirstNameNoTooltip], stara się rozpowszechnić nowy sposób praktykowania wiary, którą jest [methodius_scope.GetFaith.GetNameNoTooltip|l], na ziemiach należących do ludności, w której żyłach płynie [moravia_liege_scope.GetCulture.GetNameNoTooltip|l] krew. Moi uczeni nadali temu nazwę – [methodius_scope.GetRite.GetName|l].\n\nPomimo naszych wcześniejszych prób zjednania sobie miejscowej ludności, udaje się [methodius_scope.Custom('PL_mu_jej')] sprawić, że [pope_scope.GetTitledFirstName] wydaje zgodę na użycie wśród nich nowo powstałego pisma."
 slavic_rite.0003.a: "Zobaczmy, czy [methodius_scope.Custom('PL_jego_jej')] metody okażą się skuteczne."
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "Kultura [ROOT.Char.GetCulture.GetNameNoTooltip|l] i jej obrządek znany jako [methodius_scope.GetRite.GetNameNoTooltip|l]"
 slavic_rite.0004.desc_pagan: "Dziś rano do mojego dworu dotarły intrygujące wieści.\n\nJuż od jakiegoś czasu [liege_scope.GetTitledFirstNameNoTooltip] daje przyzwolenie, aby pełniąca posługę kapłańską osoba znana jako [methodius_scope.GetFirstName], w której żyłach płynie [methodius_scope.GetCulture.GetNameNoTooltip|l] krew, rozpowszechniała na naszych ziemiach swoje bluźnierstwa. Wiara, którą jest [methodius_scope.GetFaith.GetNameNoTooltip|l], zostanie ukształtowana tak, aby [ROOT.Char.GetCulture.GetNameNoTooltip|l] ludność miała w życiu łatwiej, o ile zdecyduje się ją praktykować.\n\nW ostatnim czasie rozpętało się za dużo zamieszania wokół duchowych aspektów naszych tradycji. Muszę w końcu pomyśleć, co z tym wszystkim zrobić."
 slavic_rite.0004.desc_chalcedonian: "[liege_scope.GetTitleAsNameNoTooltip] ogłasza ustanowienie obrządku o nazwie [methodius_scope.GetRite.GetNameNoTooltip|l] w swoim państwie. Moi uczeni twierdzą, że jest to wygodniejszy sposób praktykowania wiary, którą jest [methodius_scope.GetFaith.GetNameNoTooltip|l], bez konieczności rezygnowania z naszego stylu życia.\n\nMoże warto się nad tym zastanowić?"
 slavic_rite.0004.a_pagan: "Zwyczaje naszych przodków są lepsze."
 slavic_rite.0004.b_pagan: "Może jest w tym ziarno prawdy…"
 slavic_rite.0004.a_chalcedonian: "Nie mam zamiaru zbaczać z właściwej drogi."
 slavic_rite.0004.b_chalcedonian: "Wezwijcie uczonych."
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "Słodko-gorzka podróż"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName] staje przede mną, tym razem bez towarzystwa, po swoim powrocie z miejsca znanego jako [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Gdy pytam, gdzie jest [cyril_scope.GetFirstName], [methodius_scope.Custom('PL_jego_jej')] twarz markotnieje.\n\n– [ROOT.Char.GetTitleAsNameNoTooltip] musi wiedzieć, że przynoszę dobre wieści. [pope_scope.GetTitledFirstName] błogosławi nasze plany rozpowszechnienia wiary wśród ludzi, w których żyłach płynie [ROOT.Char.GetCulture.GetNameNoTooltip|l] krew, i w państwie waszej czcigodności, naszymi własnymi metodami i księgami. – Bierze głęboki oddech. – Niestety, nie było innego wyjścia i mój brat musiał tam zostać. Dołożę wszelkich starań, aby nasze wysiłki nie poszły na marne. Klnę się na [ROOT.Char.GetFaith.HighGodNamePossessive]."
 slavic_rite.0005.a: "Razem sprawimy, że twój brat będzie dumny!"
 slavic_rite.0005.b: "Uczczę jego pamięć, nawet jeśli będzie to ostatnia rzecz, którą zrobię."
 pam_cyril_statue_modifier: "Ku pamięci Cyrila"
 pam_brothers_travel_safety_modifier: "Ostrożna podróż"
 slavic_rite.0005.c: "Powodzenia w twojej misji."
 slavic_rite_mass_conversion_tooltip: "We wszystkich [Concept('duchies', 'księstwach')|E] miejsca znanego jako [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] planowane jest przeprowadzenie [Concept('great_project', 'wspaniałego projektu')|E] pod nazwą „Masowe nawrócenie”, którego celem jest nawrócenie ich [Concept('counties', 'hrabstw')|E] na obrządek znany jako [methodius_scope.GetRite.GetName|l]."
 slavic_rite_moravian_mission_gift_received_tooltip: "Twój podarunek przekazany do miejsca znanego jako [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] został przyjęty z wdzięcznością."
 slavic_rite_ecclesiastical_title_creation_tooltip: "Powstała $slavic_rite_ecclesiastical_title$, a [methodius_scope.GetFirstName] jest jej pierwszym [Concept('holder', 'właścicielem')|E]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ Moraw"
 slavic_rite_ecclesiastical_title_name: "Morawy"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "Koniec misji morawskiej"
 slavic_rite.0006.desc.brothers_are_dead: "Po śmierci braci [Glossary('Cyryla i Metodego', 'CYRIL_AND_METHODIUS_GLOSS')] nie ma nikogo, kto posiadałby wystarczające kwalifikacje, by kontynuować ich dzieło liturgiczne. Jeśli wciąż żywimy wolę doprowadzenia mego ludu do całkowitego nawrócenia, przyjdzie nam opracować własne sposoby, by tego dokonać."
 slavic_rite.0006.desc.no_longer_christian: "Objawiła mi się droga ku chwale. Dawne pobudki, które skłaniały mnie do troski o szczęście ludu i rodu, dziś jawią się jako marne i niegodne wzmianki. Los wyznaczył im inną przyszłość, niż przewidywały moje założenia. Na szczęście łaska [ROOT.Char.GetFaith.HighGodNamePossessive] wskazała nam drogę prawą."
 slavic_rite.0006.desc.no_longer_king: "Niedawne wydarzenia i utrata mej potężnej pozycji nauczyły mnie, by nie porywać się z motyką na słońce. Chwilowo nie możemy kontynuować misji morawskiej. Być może, gdy nasza sytuacja się poprawi, spróbujemy raz jeszcze – na nowych warunkach.\n\nDo tego czasu musimy zapewnić ochronę miejscu znanemu jako [ROOT.Char.GetPrimaryTitle.GetNameNoTier], by nie podzieliło tego samego losu."
 slavic_rite.0006.desc.no_longer_slav: "Moi przodkowie zapewne nie byliby dumni z tego, kim jestem.\n\nNiech tak będzie. Nie do nich należą decyzje o tym, jak rządzić miejscem znanym jako [ROOT.Char.GetPrimaryTitle.GetNameNoTier] – to prawo przysługuje jedynie mnie."
 slavic_rite.0006.a.brothers_are_dead: "Nie tak miało być…"
 slavic_rite.0006.a.no_longer_christian: "Chwalmy imię [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 slavic_rite.0006.a.no_longer_king: "Nie mogę sobie już pozwolić na takie plany."
 slavic_rite.0006.a.no_longer_slav: "Głagolica okazała się ciężarem dla mojego ludu."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ mająca na celu ewangelizację tego państwa przestała mieć rację bytu."
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "Państwo zjednoczone w imię [ROOT.Char.GetFaith.HighGodNamePossessive]"
 slavic_rite.0007.desc: "– #italic …że pod [ROOT.Char.GetHerHis] rządami wiedliśmy życie ciche i spokojne,\npełne pobożności i godności.\n\nAlbowiem Twoje jest królestwo, potęga i chwała,\nteraz i zawsze, i na wieki wieków. Amen.#!\n\nGdy [archdiocese_holder.GetTitledFirstName] kończy modlitwę, fala wieczystej błogości ogarnia mą duszę. Nasza misja, by niebiańska tradycja dotarła w każdy zakątek mego państwa, zakończyła się sukcesem. Niech łaska [ROOT.Char.GetFaith.HighGodNamePossessive] spłynie na mój dom, [Glossary( 'Cyryla i Metodego', 'CYRIL_AND_METHODIUS_GLOSS' )] oraz prawy lud miejsca znanego jako [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 slavic_rite.0007.a: "Przeznaczone nam było kroczyć drogą uświęconą."
 pam_slavic_rite_clergy_opinion_modifier: "Błogosławiony monarcha"
 slavic_rite.0007.b: "Mój lud zniesie wszystko."
 pam_slavic_rite_culture_opinion_modifier: "Monarcha ludu"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "Tajni kaznodzieje"
 slavic_rite.0010.desc: "Do mojej sali tronowej wkracza [undercover_preacher.Custom('MyPriestTitle')], osoba, w której żyłach płynie [undercover_preacher.GetCulture.GetNameNoTooltip|l] krew, wraz ze swą świtą kaznodziejów, a towarzyszy im mój kapelan, [court_chaplain.GetTitledFirstName]. Na twarzach przybyłych trudno doszukać się oznak wstydu, wyrażają raczej czystą bezczelność.\n\n– Niech [ROOT.Char.GetTitleAsNameNoTooltip] zechce przyjąć moje pozdrowienia. Złapaliśmy tych infiltratorów na gorącym uczynku. Głosili nauki [ROOT.Char.GetFaith.HighGodNamePossessive], nie okazując szacunku osobie znanej jako [court_chaplain_superior.GetTitledFirstName] ani waszej czcigodności. – [court_chaplain.GetTitledFirstNameNoTooltip] przerywa, by zmierzyć cudzoziemca spojrzeniem od stóp do głów, po czym znów zwraca się ku tobie.\n\n– Wieść niesie, że od dłuższego czasu kryli się w mroku, próbując przekabacić i plugawić dusze niczego nieświadomych poddanych. Co mamy z nimi zrobić?"
 slavic_rite.0010.a: "Precz! I nigdy więcej nie chcę was widzieć na moich ziemiach."
 slavic_rite.0010.b: "Zdaje się, iż poprzednie napomnienia nie przyniosły należytego skutku."
 slavic_rite.0010.c: "Nie ma potrzeby, byście wracali przed oblicze swych rozczarowanych zwierzchników."
 slavic_rite.0010.c.success: "[undercover_preacher.Custom('MyPriestTitle')|U] chce rozpocząć nowe życie na twoim dworze"
 slavic_rite.0010.c.failure: "Nie udało ci się [undercover_preacher.Custom('PL_go_jej')] przekonać"
 preacher_recruited.t: "Zwerbowano kaznodzieję"
 preacher_left.t: "Kaznodzieja odchodzi"
 # 0020
 slavic_rite.0020.t: "Dotacja na szczytny cel"
 slavic_rite.0020.desc: "– Niech [ROOT.Char.GetTitleAsNameNoTooltip] posłucha. Oni nie chcą wykorzystywać miejscowych. Wędrowni kaznodzieje pod zwierzchnictwem osoby znanej jako [court_chaplain_superior.GetTitledFirstName] są pod tym względem bardzo taktowni. Nawet poprosili mnie o rozmowę z wami w ich imieniu, a to wyraz wielkiej pokory i należy to pochwalać. Wasze przyzwolenie ułatwiłoby ich działalność, a i wasz lud wiele by na tym zyskał.\n\n[court_chaplain.GetTitledFirstName] bardzo się stara, by przekonać mnie do racji wędrowców i te starania są godne podziwu, ale nie mogę powstrzymać się od myśli, że [court_chaplain.Custom('PL_jego_jej')] zadaniem jest raczej wsparcie mego ludu i dążenie do tego, by odrzucili dawne tradycje.\n\n– Mam poczucie, że to sposób [ROOT.Char.GetFaith.HighGodNamePossessive], by umożliwić wam zbliżenie się jeszcze bardziej."
 slavic_rite.0020.a: "Im szybciej wytępimy bezbożność naszego ludu, tym lepiej."
 pam_slavic_rite_great_project_speed_modifier: "Sfinansowano projekt nawrócenia"
 slavic_rite.0020.b: "To wszystko, co mamy."
 slavic_rite.0020.c: "Wykluczone."
 # 0030
 slavic_rite.0030.t: "Debata na temat Wschodu i Zachodu"
 slavic_rite.0030.desc: "Delikatny podmuch wiatru porusza liśćmi w klasztornym ogrodzie, podczas gdy dwóch duchownych goszczących u osoby znanej jako [court_chaplain_superior.GetTitledFirstName] staje naprzeciw siebie pośród grup prowadzących ożywioną debatę. Jeden z nich reprezentuje wschodnią tradycję, a drugi stoi na czele zachodniego autorytetu. Z początku mówili skromnie, ale ich wypowiedzi stają się coraz odważniejsze i pełne pasji.\n\nPoruszają wiele zagadnień liturgicznych, a ich naukowa debata stopniowo przeradza się w fascynującą wymianę argumentów. Z każdym kolejnym zdaniem moje zainteresowanie rośnie.\n\nTo nie jest zwykła rozmowa. To symbol rywalizacji dwóch światów sugerujący kruchą harmonię albo jeszcze głębszy podział."
 slavic_rite.0030.a: "[visiting_byzantine_clergy.Custom('MyPriestTitle')] z kultury, którą jest kultura [visiting_byzantine_clergy.GetCulture.GetNameNoTooltip], brzmi przekonująco."
 slavic_rite.0030.b: "Argument osoby znanej jako [visiting_carolingian_clergy.GetNameNoTooltip] jest na swój sposób intrygujący."
 slavic_rite.0030.c: "Wiedza to wiedza, zgadzam się z nimi."
 slavic_rite.0030.d: "Nasze zwyczaje są lepsze od tych starożytnych zasad."
