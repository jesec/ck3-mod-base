l_polish:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "Region znany jako [GetSituation('the_christian_church').GetTopSubRegion.GetName] obejmuje wiele krain i składa się z niezliczonych, różnorodnych ludów posiadających własne języki, kultury i uwikłanych we własne konflikty.\n\nChoć spory doktrynalne są stare jak sam Kościół, w tych ostatecznych czasach, kiedy jesteśmy pustoszeni przez zarazę, wojnę i herezję, nasza jedność jest wystawiana na próbę.\n\nTak jak osoba znana jako [st_paul.GetName] Apostata nawoływała Koryntian do dążenia ku jedności, tak też wszyscy [christians|El] powinni wsłuchać się w [st_paul.Custom('PL_jego_jej')] wskazówki – [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. W przeciwnym razie pogrążymy się w herezji i staniemy się jedynie zabawkami Antychrysta.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Nasi słabi sąsiedzi, [christians|El], podążają za słabym i zazdrosnym bogiem, kłócąc się niczym dzieci o naturę swojej lalki. Tymczasem ich czujność przytępiała, a ich miecze głodują, bo tak dawno nie zaznały uczciwego rozlewu krwi.\n\nMają nadzieję posłać do naszych ziem świętych mężów, by szerzyli swoją słabość. Może więc to my złożymy im wizytę i splądrujemy ich skarbce! Być może dzięki naszemu przykładowi nauczą się ponownie, jak być silnymi."
 pam_the_christian_church.0051.desc.heathen_rulers: "Nasi [Concept('christian', 'chrześcijańscy')|E] sąsiedzi to prymitywny i kłótliwy lud. Są jak muł w czystej wodzie – surowe odbicie ludu podążającego za naukami [ROOT.Char.GetFaith.HighGodNamePossessive]. Przez ciągłe tkwienie w przeszłości ich wiara doprowadzi ich jedynie do upadku.\n\nIch skarbce – jakkolwiek niezbyt imponujące – czekają, aż ktoś do nich sięgnie, a ich lud – tak bardzo niezdyscyplinowany – jest gotowy, aby się podporządkować."
 pam_the_christian_church.0051.desc.heretic_rulers: "[st_peter.GetName], ta zasiadająca na tronie przygłupia postać nazwała by nas heretykami tylko za to, że jesteśmy prawdziwie wierzący. Gdyby Chrystus się odrodził, z pewnością zostałby faryzeuszem i ponownie wzywał do ukrzyżowania naszego Pana.\n\nSpójrzcie na podziały wśród nas, tych, którzy nazywają Chrystusa swoim Panem! Fałszywy kapłan w Rzymie jest tym, który sieję tę niezgodę.\n\nTen namiestnik szatana będzie próbował zrobić z nas męczenników. Zaprawdę należy wyciąć ten wrzód, aby wszyscy [christians|El] mogli dostąpić zbawienia!"
 pam_the_christian_church.0051.desc.western: "W obliczu osłabienia władzy biskupa Rzymu musimy pozbyć się tych rys w wierze, nim nadejdzie Sąd Ostateczny."
 pam_the_christian_church.0051.desc.eastern: "Otoczeni przez wrogów Chrystusa, w obliczu zbliżającego się Sądu Ostatecznego musimy porozumieć się z biskupem Rzymu."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nSobór pozostawił koronom swobodę odwoływania prałatów mianowanych przez Kościół."
 pam_the_christian_church.0051.desc.oriental_orthodox: "„[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]”. Musimy poprowadzić swych braci z powrotem ku światłu, zbliżając się do sądu ostatecznego."
 pam_the_christian_church.0051.a: "Z Chrystusem jako naszym przewodnikiem!"
 pam_the_christian_church.0051.b: "Musimy mieć oko na tych zwolenników Chrystusa."
 MIAPHYSITISM_GLOSS: "#bold „Jedna natura Słowa Bożego Wcielonego!”#! Rzekł Cyryl z Aleksandrii w czasie soboru efeskiego w 431 roku. Ten chrystologiczny pogląd, znany jako miafizytyzm, jest powszechnie wyznawany przez kościoły prawosławne."
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "W ciemności otaczającej miejsce znane jako [GetSituation('the_christian_church').GetTopSubRegion.GetName] rozbrzmiewa chór głosów.\n\n#EMP „Rzym stawia się w roli współczesnej Sodomy!”#!\n\n#EMP „Papież uczynił z siebie zarówno alfonsa, jak i prostytutkę!”#!\n\nNawet ci o bardziej wyważonych poglądach muszą przyznać, że Kościół przechodzi kryzys i konieczne są jego reformy."
 pam_the_christian_church.0052.desc.unreformed_pagan: "[christians|E], nasi sąsiedzi o słabowitym duchu, wykrzykują: „Nasz koniec jest bliski! Nasz papież jest dzikusem i poganinem”.\n\nPrzynajmniej jedna z tych rzeczy jest prawdziwa. Pomóżmy im odnaleźć ten koniec, który tak często i ochoczo próbują powołać do życia!"
 pam_the_christian_church.0052.desc.heathen_rulers: "„Nasz Kościół przechodzi kryzys!” – wykrzykują [christians|El].\n\nDobrze, że w końcu dostrzegli to, co wiedzieliśmy od zawsze. Ci pogańscy głupcy mogą jedynie marzyć o tym, że kiedyś – tak jak my – podążą śladami [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nIch skarbce – jakkolwiek niezbyt imponujące – czekają, aż ktoś do nich sięgnie, a ich lud – tak bardzo niezdyscyplinowany – jest gotowy, aby się podporządkować."
 pam_the_christian_church.0052.desc.heretic_rulers: "Należy powstrzymać antychrysta noszącego szaty św. Piotra!"
 pam_the_christian_church.0052.desc.western: "Zmiana musi najpierw nastąpić w Rzymie – dopiero wtedy region o nazwie [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] zazna uzdrowienia."
 pam_the_christian_church.0052.desc.eastern: "Otoczeni przez wrogów Chrystusa, musimy albo uleczyć zepsucie Rzymu, albo dać się mu pochłonąć."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "Niech Pan oświetli nam drogę!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "Radujmy się ogromnym postępem naszej misji! Miejsce znane jako [GetSituation('the_christian_church').GetTopSubRegion.GetName] rozrasta się wraz z każdym pogańskim dzikusem nawróconym na wiarę w Chrystusa.\n\nNiestety nie wszyscy z otwartymi ramionami przyjmują nauki kościoła. Ale bez obaw – jeśli odmówią nawrócenia naszym misjonarzom, sztychy mieczy nauczą ich naszych modlitw!\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "[christians|E] przybywają na nasze ziemie wraz ze swoimi świętymi mężami. Kiedy ich odsyłamy, wracają z mieczami w dłoni.\n\nChoć wielu z nas wciąż uznaje nauki [ROOT.Char.GetFaith.HighGodNamePossessive], są i tacy, którzy widzą zalety w służeniu temu ludzkiemu bogu, temu Chrystusowi. Władza zostaje nadana przez Boga, Kościół może pełnić tutaj rolę posłańca, a co ciekawe, pobiera też podatki."
 pam_the_christian_church.0053.desc.heathen_rulers: "Nasi sąsiedzi, [christians|El], siłą nawracają bałwochwalców, którzy warci są jedynie tego by ich zabić.\n\nChoć ich miecze nie są skierowane w naszą stronę, wielbienie [ROOT.Char.GetFaith.HighGodNamePossessive] otwiera przed nami pewne możliwości. Ich skarbce – jakkolwiek niezbyt imponujące – czekają, aż ktoś do nich sięgnie, a ich lud – tak bardzo niezdyscyplinowany – jest gotowy, aby się podporządkować."
 pam_the_christian_church.0053.desc.heretic_rulers: "Ten, który podaje się za mesjasza w Rzymie, ma nadzieję nawrócić pogan na swoją błędną religię! Ten antychryst nie zadowala się jedynie zatruwaniem umysłów [Concept('christians', 'chrześcijan')|E], ale jego wypaczona żądza każe mu wciągnąć tych niedojrzałych bałwochwalców w swoje piekielne objęcia."
 pam_the_christian_church.0053.desc.western: "Musimy zatroszczyć się o to, by ci nowo nawróceni chrześcijanie podążali drogą obrządku o nazwie [ROOT.Char.GetRite.GetName|l], zgodnie z wytycznymi Stolicy Piotrowej."
 pam_the_christian_church.0053.desc.eastern: "Chociaż Rzym twierdzi, że dąży jedynie do nawrócenia tych spoza miejsca znanego jako [GetSituation('the_christian_church').GetTopSubRegion.GetName], musimy zachować czujność, na wypadek gdyby próbowano odwrócić nas od obrządku o nazwie [ROOT.Char.GetRite.GetName|l] lub, co gorsza, zwrócić miecze wciąż ociekające świeżą pogańską krwią przeciw braciom i siostrom w wierze."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] ma przed sobą trudne zadanie, ale Kościół nie jest jeszcze stracony.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nA mimo tego, Kościół nie jest jeszcze stracony!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Nasza wiara w Boga może i jest niezachwiana, ale wielu utraciło wiarę w Kościół. Duchowni, niegdyś będący wzorem w swoich chrześcijańskich działaniach, utracili znaczną część swojej niezależności i stali się narzędziami wpływów cesarzy i królów."
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural|U] rozdzierają własne kapłańskie szaty, licząc na to, że Bóg nie dostrzeże łat. Jeśli zajmą się cerowaniem ornatów i reperowaniem kronik, może wyślą mniej duchownych, którzy mogliby zakłócać spokój w naszych gajach i nadbrzeżnych kapliczkach."
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural|U] przygotowują się do wielkiej reformy swoich praw i odnowy ołtarzy, a każda frakcja twierdzi, że poprzez swoje poświęcenie bardziej czci boga. Możemy dostrzec ich nowe hasła, lecz ostrze naszych toporów wciąż przemawia donośniej niż ich sobory."
 pam_the_christian_church.0054.desc.heretic_rulers: "Członkowie sekty z Rzymu kłócą się teraz o reformację! To, co nazywają odnową, to jedynie przeorganizowanie tego samego jarzma, dociśniętego mocniej przez jeszcze bardziej śmiertelne przekonanie o własnej nieomylności. Oby ich reforma roztrzaskała kilka czaszek w ich własnych bazylikach, zanim przypomną sobie o naszych."
 pam_the_christian_church.0054.desc.western: "Chociaż niektórzy mogą nazwać to „reformą polegającą na skorygowaniu kursu”, ludzie z rezerwą podchodzą do nowinek i chętniej przyjmą taką zmianę, jeśli przedstawi się ją jako „powrót do dawnych zwyczajów”."
 pam_the_christian_church.0054.desc.eastern: "Rzym – czy też jakakolwiek inna instytucja kurii, która mianuje się sędzią ekumeny – usilnie pracuje nad udoskonaleniem swoich obrzędów: nowe kanony, nowe przysięgi, nowe połajanki za dawne grzechy. Obserwujemy, upominamy i wzmacniamy nasze własne synody, by zachodnia wstrzemięźliwość nie została omyłkowo wzięta za jarzmo powszechne."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nSobór podjął decyzję w sprawie praw Kościoła do dożywotniego mianowania osób na urzędy."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nŚwieccy książęta wymuszają przysięgi na biskupach miejsca znanego jako [christianity.GetReligiousHeadTitle.GetName], jakby święcenia były kolejnym folwarkiem do wydzierżawienia. Tymczasem w miejscu o nazwie [christianity.GetReligiousHeadTitle.GetName] zabroniono koronowanym władcom błogosławić mitry, których sami nie poświęcili.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nWobec braku nieomylnego pasterza każdy władca wybiera własnych biskupów; szaty pozostają święte, jednak podczas święcenia czuć raczej zapach pieniędzy niż kadzidła.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "W całym miejscu znanym jako [GetSituation('the_christian_church').GetTopSubRegion.GetName] waśń między ołtarzem a tronem nie jest już zwykłą plotką."
 pam_the_christian_church.0055.desc.unreformed_pagan: "Podczas gdy [christianity.GetAdherentNamePlural] spierają się o to, czy do wyświęcenia biskupa potrzebna jest korona, czy kapa, coraz mniej misjonarzy zwraca na nas uwagę. Niech królowie i papieże wypchają się swoimi przywilejami; ich spory sprawiają, że w naszych gajach panuje większy spokój."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "Rzym głośno potępia tyranię inwestytury, choć sam gotów byłby nałożyć kajdany naszym nauczycielom, gdyby tylko mógł ich schwytać! Najpierw pozbądźcie się własnego jarzma, faryzeusze, potem możecie nas pouczać!"
 pam_the_christian_church.0055.desc.western: "Jeśli zbyt mocno pochylimy pastorał ku berłu, oba insygnia mogą w końcu zlać się w jedno.\n\n"
 pam_the_christian_church.0055.desc.eastern: "Zachodni królowie wadzą się z Rzymem o pierścienie i pastorały, a ich grzeszne swary rzucają cień na całą instytucję.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "W całym miejscu znanym jako [GetSituation('the_christian_church').GetTopSubRegion.GetName] wierni domagają się odzyskania Grobu Świętego. Krzyżowcy przygotowują się do wymarszu. Pod zastaw relikwii gromadzone są fundusze przeznaczone na wojnę.\n\nGorliwość rozpala serca, lecz jeśli ta gorączka ostygnie, zapał może się przerodzić w zwątpienie równie prędko, jak popiół opada z pogorzeliska.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Ich wojowniczy kaznodzieje głoszą krucjatę, zaniedbując własne ziemie. Niech Rzym wykrwawi się na odległych wydmach."
 pam_the_christian_church.0056.desc.western: "Czasem stal wymusi to, czego kazania nie zdołają wyprosić.\n\n"
 pam_the_christian_church.0056.desc.eastern: "Armie zachodnie ciągną w stronę Ziemi Świętej.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ Pieczę nad tym stanem rzeczy sprawuje miejsce o nazwie [christianity.GetReligiousHeadTitle.GetName].\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$\n\nChoć brak jednego niekwestionowanego przewodnika, wiara i tak na nowo odnajduje oparcie w rozumie.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "Kościelne waśnie ucichły. W miejscu znanym jako [GetSituation('the_christian_church').GetTopSubRegion.GetName] nastał czas zgody i jedności."
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "Uczeni mogą mnożyć argumenty, ale większość ludzi wciąż odnajduje Boga w słowach księdza.\n\nNie wolno nam zapominać, że nasza religia zrodziła się wśród zwykłych ludzi."
 pam_the_christian_church.0057.desc.eastern: "My wciąż modlimy się, śpiewając, podczas gdy zachodnie biurka uginają się pod ciężarem traktatów. Harmonia jest mile widziana, a ich szkolne swary nie powinny przenosić się do naszych kancelarii."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "Zwołanie soboru"
 pam_the_christian_church.0058.desc: "Po wielu latach [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] osiągają punkt kulminacyjny. Zwołano sobór, aby raz na zawsze rozstrzygnąć, kto powinien mianować duchownych – Kościół czy korona."
 pam_the_christian_church.0058.a: "Niech zostanie podjęta decyzja."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "Zbiera się sobór"
 pam_the_christian_church.0059.desc.located: "Wezwania zostały rozesłane, a ojcowie Kościoła zbierają się teraz na soborze w sprawie inwestytury. Gospodarzem jest [investiture_convene_host.GetTitledFirstName], a obradujący gromadzą się w miejscu znanym jako [investiture_convene_location.GetName]. Orzeczenia soboru rozstrzygną dla całego świata chrześcijańskiego, czy to Kościół, czy korona mianuje duchownych."
 pam_the_christian_church.0059.desc: "Wezwania zostały rozesłane, a ojcowie Kościoła zbierają się teraz na soborze w sprawie inwestytury. Jego orzeczenia rozstrzygną dla całego świata chrześcijańskiego, czy to Kościół, czy korona mianuje duchownych."
 pam_the_christian_church.0059.a: "Niech obradują."
 pam_the_christian_church_not_hof_trigger_tt: "Nie jesteś głową wiary"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "Wkrótce zbierze się specjalny sobór Kościoła, aby podjąć decyzję w sprawie kolejnej [Concept('doctrine', 'doktryny')|E] dotyczącej mianowań duchownych w ramach twojej [Concept('faith', 'wiary')|E]"
 pam_the_christian_church.0060.t: "Brak podziałów"
 pam_the_christian_church.0060.desc: "Chrześcijaństwo chwieje się w posadach. [schism_mainline_rite.GetName] rości sobie prawa do dziedzictwa apostołów, a [schism_competitor_rite.GetName|l] nie zamierza ustąpić.\n\nSam Chrystus ostrzegał: [Glossary( 'omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. Jeśli ta rana będzie się dalej jątrzyć w wyniku tego kryzysu, Kościół może już nigdy nie przemówić jednym głosem."
 pam_the_christian_church.0060.a: "[schism_mainline_rite.GetNameNoTooltip] to mój obrządek."
 pam_the_christian_church.0060.a.tt: "Wnosi wkład do [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]”"
 pam_the_christian_church.0060.b: "[schism_competitor_rite.GetNameNoTooltip] to mój obrządek"
 pam_the_christian_church.0060.b.tt: "Wnosi wkład do [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]”"
 pam_the_christian_church.0060.c: "Ciało potrzebuje dwóch rąk."
 pam_the_christian_church.0060.c.tt: "Wnosi wkład do [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]”"
 pam_the_christian_church.0061.t: "Wielka schizma"
 pam_the_christian_church.0061.desc: "Wysłannicy z miejsca o nazwie [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] ogłosili przed ołtarzem swój wyrok:\n\n– Niechaj osoba znana jako [schism_eastern_faith.GetReligiousHead.GetFirstName], fałszywie wywyższana jako [schism_eastern_faith.ReligiousHeadName|l], oraz wszyscy jej zwolennicy zostaną obłożeni anatemą. [Glossary( 'Maranatha', 'MARANATHA_GLOSS' )] ze wszystkimi heretykami! Ba, z diabłem i jego aniołami, chyba że odpokutują za swoje grzechy!\n\n– Ten bezbożny dokument zostanie obłożony ekskomuniką wraz z tymi, którzy go zredagowali, spisali lub mieli z nim cokolwiek wspólnego – odpowiada [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nWierni podzielili się na dwa obozy, którymi są [schism_western_faith.GetAdherentNamePlural] i [schism_eastern_faith.GetAdherentNamePlural]. [ROOT.Char.GetFaith.GetNameNoTooltip] to moja wiara."
 pam_the_christian_church.0061.desc.bystander: "Nadeszły wieści z miejsca znanego jako [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]: legaci złożyli na ołtarzu anatemę, a osoba znana jako [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] odpowiedziała im tym samym.\n\nCi, którzy mienili się jednym Kościołem, zostali podzieleni, a z rozłamu wyłonili się [schism_western_faith.GetAdherentNamePlural] i [schism_eastern_faith.GetAdherentNamePlural]. Ich spór nigdy nie był moją sprawą i nie ma wpływu na wiarę znaną jako [ROOT.Char.GetFaith.GetName|l]. Przykro jednak to oglądać."
 pam_the_christian_church.0061.a: "Niech tak będzie."
 pam_the_christian_church.0061.a.shame: "Wielka szkoda."
 pam_the_christian_church.0061.a.bystander: "Jaka szkoda, gdy bracia się kłócą."
 MARANATHA_GLOSS: "Aramejski okrzyk znaczący #bold „Panie, przybądź”#! pochodzący z 1. Listu do Koryntian (16:22), stał się formułą anatemy: wyklęci zostają odrzuceni aż do powrotu Pana."
 pam_the_christian_church.0062.t: "Zachowana wspólnota"
 pam_the_christian_church.0062.desc: "Rana, która groziła rozłamem chrześcijaństwa, została zasklepiona. Dzięki staraniom postaci znanej jako [schism_peacemaker.GetTitledFirstName] zwaśnione stolice biskupie znowu zasiadają do wspólnego stołu.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\nWiara [ROOT.Char.GetFaith.GetAdjective|l] pozostaje we wspólnocie."
 pam_the_christian_church.0062.a: "Niech Pan będzie błogosławiony."
 pam_the_christian_church.0062.a.peacemaker: "Nikt w pojedynkę nie będzie rządzić resztą."
 pam_the_christian_church.0062.b: "Niech [new_head_of_faith.GetTitledFirstNameNoTooltip] prowadzi nas wszystkich."
 pam_the_christian_church.0062.b.self: "Wobec tego niech całe stado będzie posłuszne mnie."
 pam_the_christian_church.0063.t: "W cieniu schizmy"
 pam_the_christian_church.0063.desc: "Gdy zapadła moja decyzja o przejściu na obrządek o nazwie [ROOT.Char.GetRite.GetName|l], osoba znana jako [schism_dissenter.GetTitledFirstName] nie podążyła w ślad za mną. Ciągle niepokoi się o moją duszę i moją dawną wspólnotę.\n\n– Opuszczasz nas – mówi cicho. – Kiedy Kościół pęknie na pół… a tak się stanie… ty i ja staniemy po przeciwnych stronach tej rany."
 pam_the_christian_church.0063.a: "Wysłuchuje nas ten sam Bóg."
 pam_the_christian_church.0063.b: "Pozwól, że pokażę ci, dlaczego udaję się inną ścieżką."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip] zmienia obrządek razem ze mną"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip] nie daje się przekonać"
 pam_the_christian_church.0063.c: "Zachowaj swoje obawy dla siebie."
 pam_the_christian_church.0064.t: "Rana się otworzy"
 pam_the_christian_church.0064.desc.opening.self_mainline: "[schism_competitor_head.GetTitledFirstName] i ja ścieramy się w rozmowie."
 pam_the_christian_church.0064.desc.opening.self_competitor: "[schism_mainline_head.GetTitledFirstName] i ja ścieramy się w rozmowie."
 pam_the_christian_church.0064.desc.opening: "[schism_mainline_head.GetTitledFirstName] i [schism_competitor_head.GetTitledFirstName] ścierają się w rozmowie."
 pam_the_christian_church.0064.desc: "Nie widzę już drogi do zgody między obrządkami znanymi jako [schism_mainline_rite.GetName|l] i [schism_competitor_rite.GetName|l]. „[Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]” – ostrzeżenie z Pisma Świętego stało się wyrokiem. Komunia [christianity.GetAdjective|l] jeszcze nie została zerwana, ale rana się otworzy. Jej czas jest policzony."
 pam_the_christian_church.0064.a: "Boże, nie opuszczaj nas."
 pam_the_christian_church.0064.a.tt: "Postęp wielkiej schizmy osiągnął swój próg"
