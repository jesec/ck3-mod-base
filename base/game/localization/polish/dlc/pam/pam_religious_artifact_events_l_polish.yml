l_polish:
 pam_religious_artifact_events.0001.t: "Święte przedsięwzięcie"
 pam_religious_artifact_events.0001.desc: "– Wasza czcigodność – do izby wchodzi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] z uśmiechem na ustach. – We śnie przyszło do mnie objawienie!\n\n– Piękne dzieło sztuki, starannie uformowane i wykonane z najwspanialszych kamieni szlachetnych ku czci [ROOT.Char.GetFaith.HighGodNamePossessive] i tylko [ROOT.Char.GetFaith.HighGodNamePossessive]. Podaruj mi niezbędne środki, a wrócę z najpiękniejszym artefaktem, jaki [ROOT.Char.GetTitleAsNameNoTooltip] może sobie wyobrazić!\n\nTo śmiała obietnica, ale jak często człowiek zostaje obdarzony wizją od [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_religious_artifact_events.0001.aa: "To brzmi jakby marzyło ci się opróżnienie mojej sakwy!"
 pam_religious_artifact_events.0001.a: "Moja pobożność nie zna granic!"
 pam_religious_artifact_events.0001.b: "Czym są ozdoby dla [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_religious_artifact_events.0002.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] wzywa mnie do kaplicy zamkowej. Powód staje się jasny, gdy z dumą prezentuje mi moje najważniejsze zamówienie.\n\n[newly_created_artifact.GetDesc]"
 pam_religious_artifact_events.0002.a: "[inspiration_owner.GetFirstNameNoTooltip], doskonała robota!"
 create_artifact_religious_artifact_tooltip: "Osoba znana jako [inspiration_owner.GetShortUINameNotMe] stworzyła artefakt o nazwie [newly_created_artifact.GetName] – [SCOPE.Custom('ArtifactQuality')] wykonanie"
