l_polish:
 ecumenical_council_events_josh.0001.t: "Morderstwo w czasie komplety"
 ecumenical_council_events_josh.0001.desc: "Wierzący są tak przewidywalni. [murder_target.GetTitledFirstName] schyla głowę do modlitwy, kiedy trwa [Glossary( 'kompleta', 'COMPLINE_GLOSS' )], ja natomiast czaję się w cieniu.\n\n[murder_target.Custom('PL_jego_jej')|U] długie modlitwy czynią z [murder_target.Custom('PL_niego_niej')] łatwą ofiarę. Kiedy zostajemy tylko we dwójkę, nawet najlepsze szaty, kamizelka czy aksamit, mogą stać się pętlą."
 ecumenical_council_events_josh.0001.a: "Porusz się i zaciśnij [murder_target.Custom('PL_jego_jej')] zdobienia."
 ecumenical_council_events_josh.0001.a.tt: "Trochę zbyt ciasno, żeby mogło być komfortowo"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetName] wymyka się z mojego uścisku"
 ecumenical_council_events_josh.0001.a.toast.success: "Morderstwo powiodło się"
 ecumenical_council_events_josh.0001.a.toast.failure: "Próba morderstwa nie powiodła się"
 ecumenical_council_events_josh.0001.a.flavor: "Ktoś, kto tak zagorzale się modli, musi być grzesznikiem…"
 ecumenical_council_events_josh.0001.b: "Nie, nie w trakcie świętego obrzędu…"
 COMPLINE_GLOSS: "Kompleta to modlitwa nocna. Jest to ostatnia modlitwa w ciągu dnia w ramach Liturgii Godzin, codziennym cyklu modlitw stosowanym w tradycji chrześcijańskiej."
 ecumenical_council_events_josh.0010.t: "Święta uroczystość"
 ecumenical_council_events_josh.0010.desc: "Duchowieństwo już się zgromadziło, a nie ma większej radości niż celebrowanie jednego z naszych duchowych przewodników. W tym miesiącu najbardziej odpowiednie wydają się celebracje ku czci świętego znanego jako [monthly_saint.GetTitledFirstName].\n\n„W imię [ROOT.Char.GetFaith.HighGodNamePossessive] poprowadzimy dzisiejsze nabożeństwo.”"
 ecumenical_council_events_josh.0010.a: "Odpraw mszę."
 ecumenical_council_events_josh.0010.b: "Wygłoszę kazanie."
 ecumenical_council_events_josh.0010.c: "Po prostu dodajmy jeden psalm lub hymn."
 ecumenical_council_events_josh.0011.t: "Niczym grom"
 ecumenical_council_events_josh.0011.desc: "Gdy witam gości, w oczy rzuca mi się ogromna sylwetka osoby znanej jako [guest_giant.GetTitledFirstName], wyróżniająca ją z tłumu. [guest_giant.Custom('PL_jego_jej')|U] prawdziwy potencjał widzę jednak dopiero, gdy przemawia: „Witajcie, moi towarzysze w wierze”. \n\nZ tak donośnym, niczym grzmot, głosem osoba ta może okazać się bardzo przydatna. [Glossary( 'Nieszpory', 'VESPER_GLOSS' )] mogłyby skorzystać na kolejnym basie…"
 ecumenical_council_events_josh.0011.a: "Niech [guest_giant.Custom('PL_jego_jej')] głos poniesie nasze modlitwy do [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName] i wszyscy zgromadzeni nie mogą wyjść z podziwu."
 ecumenical_council_events_josh.0011.b: "Zamiast tego mogę wykorzystać jego donośne poparcie podczas debaty."
 ecumenical_council_events_josh.0011.b.tt: "Można na [guest_giant.Custom('PL_nim_niej')] polegać"
 ecumenical_council_events_josh.0011.b.tt2: "Można [guest_giant.Custom('PL_mu_jej')] zaufać wyłącznie, gdy otrzyma swoją dolę"
 ecumenical_council_events_josh.0011.b.toast.success: "Przekonujesz [guest_giant.Custom('PL_go_ja')] do wsparcia cię."
 ecumenical_council_events_josh.0011.b.toast.failure: "Chce otrzymać coś w zamian za wsparcie cię."
 ecumenical_council_events_josh.0011.b.flavor: "Głośne uznane osoby znanej jako [guest_giant.GetTitledFirstName] w stosownych momentach zapewni mi przewagę."
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U] jest gościem, a nie narzędziem."
 ecumenical_council_events_josh.0011.c.flavor: "Niech znajdzie swoje miejsce pośród nas."
 ecumenical_council_events_josh.0011.c.tt: "Nie naciskasz na [guest_giant.Custom('PL_jego_jej')] dołączenie do chóru ani wsparcie w debacie"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUINameNotMe] decyduje się wesprzeć osobę znaną jako [CHARACTER.GetShortUINameNotMe] podczas soboru powszechnego."
 VESPER_GLOSS: "Nieszpory to modlitwa wieczorna. Zazwyczaj jest to modlitwa przed kolacją w ramach Liturgii Godzin, codziennym cyklu modlitw stosowanym w tradycji chrześcijańskiej."
 ecumenical_council_events_josh.0012.t: "Pierścień biskupa"
 ecumenical_council_events_josh.0012.desc: "Zauważam, że [guest_bishoplover.GetTitledFirstName] i [guest_bishop.GetTitledFirstName] są ciągle razem od momentu rozpoczęcia soboru. [guest_bishoplover.GetFirstName] spóźnia się na poranną [Glossary( 'jutrznię', 'LAUD_GLOSS' )] i wygląda niechlujnie. Czy na [guest_bishoplover.Custom('PL_jego_jej')] palcu widzę pierścień osoby znanej jako [guest_bishop.GetFirstName]? Delikatnie daję [guest_bishoplover.Custom('PL_mu_jej')] znać o moim odkryciu i unoszę brew.\n\nZdając sobie sprawę ze swojego błędu, rumieniąc się i jąkając, [guest_bishoplover.GetFirstName] odpowiada. \n\n– Proszę, nikt nie musi o tym wiedzieć…"
 ecumenical_council_events_josh.0012.b: "– Daj mi ten pierścień i siedź cicho."
 ecumenical_council_events_josh.0012.c: "– Tylko ja, ty i [ROOT.Char.GetFaith.HighGodName] będziemy o tym wiedzieć."
 ecumenical_council_events_josh.0012.bishopringname: "Pierścień biskupa"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nWidoczny znak apostolskiej posługi właściciela."
 LAUD_GLOSS: "Jutrznia to modlitwa poranna. Zazwyczaj jest to modlitwa przed śniadaniem w ramach Liturgii Godzin, codziennym cyklu modlitw stosowanym w tradycji chrześcijańskiej."
 ecumenical_council_events_josh.0013.t: "Zbrodnia stylu"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U] stoi w pełnym przepychu odzieniu. Ma na sobie świeżo utkaną szatę, uszytą na tę okazję, niewątpliwie jest to dar od [fashion_criminal.Custom('PL_jego_jej')] wiernej trzody. na jedwabnej stule widoczny jest haft z wizerunkiem [ROOT.Char.GetFaith.WealthGodNamePossessive]. \n\nCo za bezczelność! Czy [fashion_criminal.GetSheHe] otwarcie łamie dogmaty wiary znanej jako [fashion_criminal.GetFaith.GetName|l], czy to zwykła pawia próżność?"
 ecumenical_council_events_josh.0013.a: "– Zabierzcie mi z oczu tę zakałę."
 ecumenical_council_events_josh.0013.b: "– Odejdź. Nie masz w sobie godności."
 ecumenical_council_events_josh.0013.b.toast.success: "Twoja decyzja skutkuje [fashion_criminal.Custom('PL_jego_jej')] wydaleniem."
 ecumenical_council_events_josh.0013.b.toast.failure: "Udaje [fashion_criminal.Custom('PL_mu_jej')] się pozostać na soborze."
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUINameNotMe] podczas soboru powszechnego ma na sobie niestosowny ubiór."
 ecumenical_council_events_josh.0020.t: "Ostoja gorliwości"
 ecumenical_council_events_josh.0020.desc.intro: "– Spójrzcie na ten filar wiary znanej jako [ROOT.Char.GetFaith.GetName|l]! To prawdziwe świadectwo tego, że sprawiedliwi podążają drogą krzyża. \n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: " nawiązuje do tego, gdy [faith_battle_memory.GetDescription]. Poganom trzeba przeciwstawiać się na każdym kroku. Podnoszę miecz i przyjmuję jego pochwałę. „Za wiernych!”"
 ecumenical_council_events_josh.0020.desc.fallback: " docenia mój niedawny wkład na rzecz wiary. Gdy słyszę, że mówi się o mnie w towarzystwie zgromadzonych duchownych, duma wypełnia moją pierś."
 ecumenical_council_events_josh.0020.a: "– Na chwałę [ROOT.Char.GetFaith.HighGodNamePossessive]! Zwyciężymy!"
 ecumenical_council_events_josh.0020.a.flavor: "Moje czyny wywołały poruszenie wśród zgromadzonych duchownych."
 ecumenical_council_events_josh.0020.b: "Będę po prostu napawać się chwałą."
 ecumenical_council_events_josh.0021.t: "W światłości"
 ecumenical_council_events_josh.0021.desc: "Debata przeciąga się, a na podłodze rozlewa się snop światła. Wchodzę w niego i nagle wszystkie oczy zwracają się w moją stronę. \n\nJakby moje słowa nie wystarczyły, boskie światło wzmacnia moje argumenty. Mój oponent, [council_opponent.GetFirstName], schowany w cieniu. [council_opponent.Custom('PL_jego_jej')|U] argumenty wydają się jeszcze bardziej niejasne."
 ecumenical_council_events_josh.0021.a: "Wykorzystaj przewagę przeciw osobie o imieniu [council_opponent.GetFirstName]."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNotMeNoTooltip] porzuca [Concept('ec_conservatives', 'konserwatystów')|E] i dołącza do [Concept('ec_innovators', 'innowatorów')|E]"
 ecumenical_council_events_josh.0021.b: "Niech do zgromadzenia przemówi światło."
 ecumenical_council_events_josh.0021.b.ct: "Maks. #V 3#! [Concept('ec_conservatives', 'konserwatystów')|E] dołącza do [Concept('ec_innovators', 'innowatorów')|E]"
 ecumenical_council_events_josh.0021.c: "Niech nacieszą oczy moim blaskiem."
 ecumenical_council_events_josh.0021.c.ct: "Dodaj #V 50#! pkt [Concept('appointment', 'mianowania')|E] jako inwestycję na rzecz [Concept('clerical_title', 'tytułu duchownego')|E]"
 ecumenical_council_events_josh.0022.t: "Zjednoczeni w wierze"
 ecumenical_council_events_josh.0022.desc: "Podczas obchodu w trakcie soboru [host.GetTitledFirstName|U] dostrzega okazję, by zjednoczyć swoich zwolenników przeciwko zewnętrznym zagrożeniom. Wzywa mnie i osobę znaną jako [alliance_target.GetTitledFirstName] przed siebie.\n\n– Moi oddani, tak jak trwacie w wierze, powinniście również stać ramię w ramię, gdy stawiacie czoła przeciwnościom."
 ecumenical_council_events_josh.0022.a: "Niech kościół pobłogosławi nasz sojusz."
 ecumenical_council_events_josh.0022.a.flavor: "Wykorzystam swoją pobożną pozycję, aby przypieczętować ten sojusz."
 ecumenical_council_events_josh.0022.b: "Sojusz będzie budowany na zasadzie wzajemnego zrozumienia."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetTitledFirstName] wyraża zgodę na zawarcie sojuszu."
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetTitledFirstName] czuje urazę z powodu twoich awansów."
 ecumenical_council_events_josh.0022.b.flavor: "Mój czarujący sposób bycia z pewnością wystarczy."
 ecumenical_council_events_josh.0022.c: "Sobór nie jest miejscem na takie rzeczy."
 ecumenical_council_events_josh.0022.c.flavor: "Wystarczy pokłonić się z szacunkiem."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUINameNotMe] odmawia zawarcia niestosownego sojuszu."
 ecumenical_council_events_josh.0023.t: "Módl się za mnie"
 ecumenical_council_events_josh.0023.desc: "– Łaska i pokój niech będzie z wami – [host.GetTitledFirstName|U] błogosławi podchodzących gości. Mogę wykorzystać tę chwilę i rzucić się przed ten filar wiary. Jeśli uda mi się sprawić, że uwzględni mnie w swoich modlitwach podczas [Glossary( 'jutrzni', 'LAUD_GLOSS' )], na pewno przybliży mnie to do zbawienia. \n\n – Odsuń się i przestań bredzić. Blokujesz kolejkę – szepcze za mną [prayer_opponent.GetFirstName|U]."
 ecumenical_council_events_josh.0023.a: "– Spora darowizna, aby znalazło się dla mnie miejsce w modlitwach."
 ecumenical_council_events_josh.0023.b: "Ucałuj rąbek szaty liturgicznej"
 ecumenical_council_events_josh.0023.b.tt: "Upewniam się, że moja prośba zostanie wysłuchana"
 ecumenical_council_events_josh.0023.b.tt2: "Łamię zasady etykiety i spychają mnie na bok"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U] pomodli się za ciebie."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U] ignoruje twoją prośbę."
 ecumenical_council_events_josh.0023.c: "Lepiej jest przejść na bok i skupić się na pobożności."
 ecumenical_council_events_josh.0024.t: "Piękno tajemnic"
 ecumenical_council_events_josh.0024.desc: "Niektórzy przybyli tu z wielkim zapałem, aby dyskutować o świętych tajemnicach, pragnąc przedstawiać nowatorskie interpretacje i spierać się o nie. [tenet_target_a.GetName] to jedna z takich osób.\n\n– [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], moi bracia. Przestrzegajcie tych zasad, które pochodzą od [ROOT.Char.GetFaith.HighGodNamePossessive], szukajcie mądrości w świętym prawie, a dojdziecie do zrozumienia tego, co boskie!\n\nW tłumie podnoszą się i cichną głosy. W międzyczasie [tenet_target_b.Custom('FormalComplimentAdjective')] [tenet_target_b.GetTitledFirstName] czuje fascynację nieznanym tekstem. Jedyne słowa, które udaje mi się z niego odczytać, to: „[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )]”."
 ecumenical_council_events_josh.0024.a: "– Powiadasz, że to mądrość?"
 ecumenical_council_events_josh.0024.b: "Ta książka wygląda na całkiem interesującą."
 ecumenical_council_events_josh.0024.c: "Znam już prawdziwą ścieżkę [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events_josh.0025.t: "O jednego teologa za dużo"
 ecumenical_council_events_josh.0025.desc: "Na skraju wielkiego zgromadzenia wybucha zamieszanie. Kilkoro niezwykłych przybyszów strząsa z siebie kurz z drogi. Nasi dostojnicy szeptają, wpatrują się w nich i skinieniem ręki odsyłają gości. Osoba prowadząca przybyłych wykrzykuje:\n\n– Długo podróżuję, aby inni [theologian.GetFaith.GetAdherentNamePlural] usłyszeli moje świadectwo. Nasi ojcowie, święci apostołowie, byli jak bracia. Dlaczego więc nie przyjmiecie mnie do waszego grona?"
 ecumenical_council_events_josh.0025.a: "Wejście będzie kosztować…"
 ecumenical_council_events_josh.0025.a.flavor: "Mogę [theologian.Custom('PL_go_ja')] dodać na samym dole listy zaproszonych."
 ecumenical_council_events_josh.0025.b: "– Twoje nauki to hańba!"
 ecumenical_council_events_josh.0025.c: "– To fascynujące. Zorganizujmy później własny sobór."
 ecumenical_council_events_josh.0025.d: "Uprzejmie [theologian.Custom('PL_go_ja')] wyprowadź."
