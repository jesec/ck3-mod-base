l_polish:
 pam_generic_events.0001.t: "Uczony w dziedzinie wiary"
 pam_generic_events.0001.desc: "Gdy wchodzę do obiektu, którym jest [ROOT.Char.GetFaith.HouseOfWorship], [chaplain.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], sprawia wrażenie osoby całkowicie pochłoniętej wykładem.\n\n– Ach, [ROOT.Char.Custom('FormOfAddressForLiege')] – wreszcie zdaje się mnie dostrzegać. – Chcesz podążać za słowami [ROOT.Char.GetFaith.HighGodNamePossessive]? Mogę cię tego nauczyć."
 pam_generic_events.0001.a: "Warto podjąć ten wysiłek."
 pam_generic_events.0001.b: "Sprawowanie władzy wymaga całej mojej uwagi."
 pam_generic_events.0002.t: "Czy jest we mnie dobro?"
 pam_generic_events.0002.desc.intro: "[doubting_child.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )], wkrada się do mojej komnaty długo po tym, jak świece powinny były zostać zgaszone. Po policzkach spływają [doubting_child.Custom('PL_mu_jej')] łzy.\n\n– Czy jestem dobrym człowiekiem? – szepcze. – Skoro to, kim jestem, stanowi grzech…"
 pam_generic_events.0002.desc.sin: "taki #EMP obrzydliwy#! grzech…"
 pam_generic_events.0002.desc.sp: "skoro moja dusza wydaje się taka pusta…"
 pam_generic_events.0002.desc.outro: "jak mogę wciąż liczyć na łaskę [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_generic_events.0002.a: "Odrzuć to, co przynosi ci wstyd."
 pam_generic_events.0002.b: "Wiesz już, jak to jest być kimś darzonym miłością."
 pam_generic_events.0002.c: "Będziemy się więc modlić."
 friend_comforted_child_doubts: "[CHARACTER.GetShortUINameNotMe] pociesza osobę znaną jako [TARGET_CHARACTER.GetShortUINameNotMe], gdy ta wątpi w swoje dobro."
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] pociesza osobę znaną jako [CHARACTER.GetShortUINameNotMe], gdy ta wątpi w swoje dobro."
 pam_generic_events.0003.t: "Czym jesteś"
 pam_generic_events.0003.desc: "[worried_spouse.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )], zamartwia się i czeka wśród żywopłotów po zmroku z dłońmi skręconymi na kolanach.\n\n– Jesteś takim #EMP grzesznikiem#! – mówi cicho. – To przynosi wstyd w oczach [ROOT.Char.GetFaith.HighGodNamePossessive] zarówno dla ciebie, jak i dla mnie. Jak możesz tak lekceważyć wiarę? Czy nie widzisz, jak to na ciebie wpływa?"
 pam_generic_events.0003.a: "Dla ciebie? Poprawię się."
 pam_generic_events.0003.b: "Tak stworzyły mnie ręce [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_generic_events.0003.c: "Za bardzo się martwisz."
 lover_promised_to_change_ways: "[CHARACTER.GetShortUINameNotMe] obiecuje osobie znanej jako [TARGET_CHARACTER.GetShortUINameNotMe], że poprawi swoje zachowanie i pójdzie na pielgrzymkę."
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] obiecuje osobie znanej jako [CHARACTER.GetShortUINameNotMe], że poprawi swoje zachowanie i pójdzie na pielgrzymkę."
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUINameNotMe] odmawia skruchy, gdy [TARGET_CHARACTER.GetShortUINameNotMe] prosi [CHARACTER.Custom('PL_go_ja')] o zmianę zachowania."
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] odmawia skruchy, gdy [CHARACTER.GetShortUINameNotMe] prosi [TARGET_CHARACTER.Custom('PL_go_ja')] o zmianę zachowania."
 pam_generic_events.0004.t: "Światło w ciemności"
 pam_generic_events.0004.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] świeci pustkami. Mgła unosi się między filarami, a świece mienią się na pamiątkę zmarłego – jest to [deceased.GetFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', deceased )]. Osoba ta [deceased.GetDeathReasonHideKiller].\n\n[ROOT.Char.Custom2( 'RelationToMeShort', comforter )|U] [comforter.GetFirstName] siedzi na tyle blisko, że [comforter.Custom('PL_jego_jej')] rękaw dotyka mojego.\n\n– Żałoba jest drogą – mówi cicho. – Podążaj nią, a na jej końcu może ukazać ci się ostateczny cel podróży – [ROOT.Char.GetFaith.PositiveAfterLife]."
 pam_generic_events.0004.a: "To moje dzieło! #EMP Moje#!!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP W domu mego Ojca jest wiele mieszkań.#!"
 JOHN_14_2_GLOSS: "#weak J 14:2, tłum. własne#!"
 pam_generic_events.0004.c: "Będziemy się więc modlić."
 pam_generic_events.0004.d: "Chodź. Napijmy się na cześć tych, którzy odeszli."
 pam_generic_events.0005.t: "Lojalna pięść"
 pam_generic_events.0005.desc: "– Jak [clerical_holder.GetSheHe] #EMP śmie#!!\n\n[loyal_vassal.GetTitledFirstName], a dla mnie [ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )], wpada do sali obrad soboru z na wpół wyciągniętym mieczem.\n\n– Jak [clerical_holder.GetTitledFirstName] śmie cię wyrzucać? – spluwa. – [clerical_region.GetName] – mam tam swoich ludzi. Powiedz tylko słowo, a [clerical_holder.Custom('PL_go_ja')] odwiedzimy."
 pam_generic_events.0005.a: "Dobrze, ruszajcie."
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName] uda się do miejsca znanego jako [clerical_holder.GetCapitalLocation.GetName]. Po powrocie zyskasz [dread|El] oraz [Concept('opinion', 'opinię')|E] [GetVassalStance('belligerent').GetTextIcon] wojowniczych [Concept('vassal', 'wasali')|E]."
 pam_generic_events.0005.b: "Istnieją sprytniejsze sposoby."
 pam_generic_events.0005.b.tt: "Zyskujesz na #V 15 lat#! #P ogromną#! premię do [Concept('schemes', 'spisków')|E] (rodzaj: [GetScheme('murder').GetTypeName|l]) przeciwko osobie, którą jest [clerical_holder.GetShortUINameNotMe]"
 pam_generic_events.0005.c: "Nauczono mnie nadstawiać drugi policzek."
 pam_generic_events.0005.c.tt: "[character_interaction|E] „#V $declaration_of_repentance_interaction$#!” ma akceptację zwiększoną o #P 20#! punktów przez #V 10 lat#!"
 pam_generic_events.0005.c.tt2: "Przez następne #V 10 lat#! istnieje większa szansa, że [character_interaction|El] „#V $lift_excommunication_interaction$#!” zostanie użyta wobec ciebie"
 pam_turned_the_other_cheek_accept_reason: "Drugi policzek"
 PAM_GENERIC_0005_MURDER_BONUS: "Lojalny wasal ma swoich ludzi na terytorium w domenie tej osoby: $VALUE|+0=$"
 pam_generic_events.0007.opening: "Wasza Czcigodność!"
 pam_generic_events.0007.desc: "Stało się! [clerical_holder.GetTitledFirstName] ma nauczkę. Udało mi się [clerical_holder.Custom('PL_go_ja')] znaleźć i upuścić [clerical_holder.Custom('PL_mu_jej')] krwi."
 pam_generic_events.0007.a: "Dobrze."
 pam_generic_events.0008.t: "Głos w ciemności"
 pam_generic_events.0008.desc: "Wciąż jeszcze czując ciężar obiadu w żołądku, chwiejnym krokiem zmierzam do komnaty sypialnej. Korytarz rozmywa mi się w oczach, a podłoga zdaje się kołysać pod stopami.\n\nNagle dobiega mnie głos.\n\n– [ROOT.Char.GetTitleAsNameNoTooltip] jak ty to wzór dla innych – słyszę. – Twoja cnotliwość cieszy Pana.\n\nTo naprawdę [ROOT.Char.GetFaith.HighGodName], czy tylko choroba?"
 pam_generic_events.0008.a: "Tak. #EMP Tak!!!#!"
 pam_generic_events.0008.b: "To na pewno On!"
 pam_generic_events.0008.c: "Stare moce budzą się do życia…"
 pam_generic_events.0008.d: "Jedzenie ma czasem takie skutki."
 pam_generic_events.0008.e: "Może to coś w moim posiłku…?"
 pam_generic_events.0008.f: "Lepiej pomodlę się na wszelki wypadek."
 pam_generic_events.0009.t: "Ognie piekielne"
 pam_generic_events.0009.desc: "Budzę się w morzu własnego potu, z sercem kołatającym wściekle w klatce piersiowej.\n\nŚniło mi się, że płonę. Moje mięso odchodziło od kości jak masło.\n\n– Grzech! Grzech! – wołała do mnie horda demonów.\n\nMiejsce, do którego trafiają grzesznicy – [ROOT.Char.GetFaith.NegativeAfterLife] – stało w płomieniach; ogień trawił moje ciało, a każdy wrzask był moim własnym okrzykiem."
 pam_generic_events.0009.a: "Bicz potrafi uleczyć duszę."
 pam_generic_events.0009.b: "Grzeszne ciało wymaga kary cielesnej."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Obmyjcie ręce, grzesznicy, i oczyśćcie serca.#!"
 JAMES_4_8_GLOSS: "#weak Jk 4:8, tłum. własne#!"
 pam_generic_events.0009.d: "[comforting_courtier.GetTitledFirstName] mnie wysłucha. To zawsze mi pomaga."
 pam_generic_events.0009.e: "To tylko sen."
 friend_comforted_hell_nightmare_reason: "Po wybudzeniu się z koszmaru o potępieniu [CHARACTER.GetShortUINameNotMe] szuka pocieszenia u osoby, którą jest [TARGET_CHARACTER.GetShortUINameNotMe]."
 friend_comforted_hell_nightmare_reason_corresponding: "Po wybudzeniu się z koszmaru o potępieniu [TARGET_CHARACTER.GetShortUINameNotMe] szuka pocieszenia u osoby, którą jest [CHARACTER.GetShortUINameNotMe]."
 pam_generic_events.0010.t: "Błogosławiona zwierzyna"
 pam_generic_events.0010.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] to jedyne, co mnie otacza; dostrzegam jednak prześwit, a wkrótce dobiega mnie, niczym grzmienie burzy, tętent kopyt dziesiątek galopujących koni. Jeźdźcom dumnie przewodzi [hunting_ruler.GetName].\n\n– #EMP Staaaaaać!#! – woła, zatrzymując swój orszak i unosząc dłoń w geście pozdrowienia. – Chwalmy [ROOT.Char.GetFaith.HighGodNamePossessive] za tę pogodę, i za zwierzynę, na którą polujemy!"
 pam_generic_events.0010.a: "Chętnie podzielę się radą, jeśli pozwolisz…"
 pam_generic_events.0010.b: "Wzrok masz równie ostry jak włócznię."
 pam_generic_events.0010.b.success: "Twój komplement zostaje dobrze przyjęty"
 pam_generic_events.0010.b.failure: "Twój komplement jest nietrafiony"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetName] bierze sobie twój komplement do serca"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetName] uznaje twój komplement za próżne pochlebstwo"
 pam_generic_events.0010.b.tt: "Postać znana jako [hunting_ruler.GetTitledFirstName] będzie bardziej skłonna do zaakceptowania [Concept('character_interaction', 'interakcji z postacią')|E] „#high $negotiate_alliance_interaction$#!” przez kolejne #V 10 lat#!"
 pam_generic_events.0010.c: "Chwała ci!"
 pam_generic_events.0010.d: "Użycz mi kilku swoich jeźdźców na drogę."
 friend_praised_hunting_reason: "[CHARACTER.GetShortUINameNotMe] chwali umiejętności osoby, którą jest [TARGET_CHARACTER.GetShortUINameNotMe], na polowaniu."
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUINameNotMe] chwali umiejętności osoby, którą jest [CHARACTER.GetShortUINameNotMe], na polowaniu."
 pam_praised_hunting_alliance_accept_reason: "Pochwalono moje umiejętności łowieckie"
 pam_generic_events.0011.t: "Znamię grzechu"
 pam_generic_events.0011.desc: "[sinful_courtier.GetTitledFirstName] już zbyt długo grzeszy uczynkami. Mój dwór huczy od plotek o [sinful_courtier.Custom('PL_jego_jej')] występkach; zdarza się nawet, że służba na moich oczach wycofuje się na [sinful_courtier.Custom('PL_jego_jej')] widok.\n\n– [ROOT.Char.Custom('FormOfAddressForLiege')|U]! – woła [sinful_courtier.GetTitledFirstName], [sinful_courtier.Custom('quirk_neg_pp')], kiedy wchodzę do gabinetu. – To zaszczyt, przebywać w twej obecności."
 pam_generic_events.0011.a: "Masz zaniechać swych grzesznych uczynków."
 pam_generic_events.0011.b: "Posłuchaj nauk [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_generic_events.0011.b.success: "Lekcja okazuje się skuteczna"
 pam_generic_events.0011.b.failure: "Lekcja okazuje się nieskuteczna"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetTitledFirstName] rozumie powagę swojego grzechu"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetTitledFirstName] ignoruje twoją lekcję"
 pam_generic_events.0011.c: "To nie jest dla ciebie dobre…"
 pam_generic_events.0011.c.success: "Subtelna porada sprawia, że [sinful_courtier.GetTitledFirstName] pokornieje"
 pam_generic_events.0011.c.failure: "[sinful_courtier.GetTitledFirstName] gardzi twoją łagodnością"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetTitledFirstName] uznaje twoją troskę za poruszającą"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetTitledFirstName] uznaje twoją życzliwość za słabość"
 pam_generic_events.0011.d: "Może te występki nie są aż tak poważne."
