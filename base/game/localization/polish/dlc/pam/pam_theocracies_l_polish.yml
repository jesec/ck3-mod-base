l_polish:
 only_theocratic_tt: "[government|E] osoby, którą jest [THIS.Char.GetShortUINameNotMe], nie zezwala na mianowania [Concept('theocratic', 'teokratyczne')|E] #weak (mianowania, za które odpowiada określony rząd, tj. [THIS.Char.GetGovernment.GetName])#!"
 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U] muszą należeć do [Concept('clergy', 'duchowieństwa')|E] lub wiara o nazwie [THIS.Char.GetFaith.GetName|l] musi mieć [Concept('doctrine', 'doktrynę')|E] „$doctrine_theocracy_lay_clergy_name$”"
 can_be_appointed_interaction_can_inherit_tt: "[THIS.Char.GetWomenMen|U] muszą mieć możliwość dziedziczenia [Concept('titles', 'tytułów')|E] #weak (nie mogą mieć cechy [GetTrait('disinherited').GetName( THIS.Char )|l], [GetTrait('gallivanter').GetName( THIS.Char )|l] ani [GetTrait('order_member').GetName( THIS.Char )|l])#!"
 theocracy_lease: "Dzierżawa teokratyczna"
 theocracy_lease_desc: "Ta posiadłość jest [Concept('leased', 'dzierżawiona')|E] [Concept('realm_priest', 'kapłanowi koronnemu')|E] wyznającemu taką samą [Concept('faith', 'wiarę')|E] jak właściciel.\n\nKapłan koronny będzie wnosić wkład w postaci [Concept('tax', 'podatku')|E] i [Concept('levies', 'pospolitego ruszenia')|E] zarówno swojemu [Concept('liege', 'seniorowi')|E] (jeśli ma aprobatę), jak i [Concept('religious_superior', 'zwierzchnikowi religijnemu')|E].\n\nZwierzchnikiem religijnym dzierżawiącego kapłana jest [realm_priest|El] jego [Concept('liege', 'seniora')|E], jeśli wyznają tę samą wiarę. W innym wypadku będzie to [Concept('head_of_faith', 'głowa')|E] jego wiary."
 ecclesiastical_lease: "Dzierżawa kościelna"
 ecclesiastical_lease_desc: "Ta posiadłość jest [Concept('leased', 'dzierżawiona')|E] [Concept('realm_priest', 'kapłanowi koronnemu')|E] wyznającemu taką samą [Concept('faith', 'wiarę')|E] [Concept('ecclesiastical', 'kościelną')|E] jak właściciel.\n\nKapłan koronny będzie wnosić wkład w postaci [Concept('tax', 'podatku')|E] i [Concept('levies', 'pospolitego ruszenia')|E] bezpośrednio swojemu [Concept('liege', 'seniorowi')|E] (jeśli ma aprobatę), [Concept('religious_superior', 'zwierzchnikowi religijnemu')|E] i [Concept('head_of_faith', 'głowie wiary')|E].\n\nZwierzchnikiem religijnym dzierżawiącego kapłana jest [holder|El] kościelnego [Concept('clerical_title', 'tytułu duchownego')|E], do którego należy stolica jego seniora. W innym wypadku będzie to [Concept('head_of_faith', 'głowa')|E] jego wiary."
 budget_allocation_cardinal_law: "Przydział środków na budżet kardynalski"
