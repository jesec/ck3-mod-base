 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "Nawrócenie"
 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "Czas nowych chrztów. Królowie wznoszą krzyże w nadrzecznych fortach i osadach targowych, wędrowni kaznodzieje i królewskie armie targują się o dusze na rubieżach, a nawrócenie jednego władcy może pchnąć całe ludy ku tej samej chrzcielnicy."
 reform_phase: "Reforma"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "Dyscyplina, prawo i purytańska gorliwość powracają w szeregi duchowieństwa. Wewnętrzna struktura chrześcijaństwa zostaje poddana wnikliwej ocenie, a cena za czystszy Kościół jest często okupiona krwią."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 investiture_crisis: "Kontrowersje wokół inwestytury"
 investiture_crisis_icon: "@pam_the_christian_church_investiture_crisis_icon! $investiture_crisis$"
 investiture_crisis_desc: "Korona i pastorał toczą zaciekły bój o to, kto dzierży klucze do spichlerzy Boga.\n\nŚwieccy patroni wręczają dostojnikom pastorał i pierścień, lecz Kościół odmawia uznania ich legitymacji."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "Następny sobór: [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "Pozostały czas, zanim [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] osiągną swój punkt kulminacyjny i zostaną zażegnane.\n\nGdy czas się kończy, zwołany zostanie sobór w sprawie inwestytury, który ma podjąć decyzję dotyczącą [Concept('doctrine', 'doktryny')|E] mianowania duchownych „[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]”, zastępując ją – w zależności od głosów – doktryną „[GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]” lub „[GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]”. [rulers|E] świeccy mogą zmusić [clergy|El] do głosowania inaczej, korzystając z [casus_belli|El] „$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$” lub zdobywając [puppets|El]."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak Kościół ma przewagę#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak Korona ma przewagę#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak Wynik nadchodzącego głosowania pozostaje niepewny.#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "Postęp [Concept('schism', 'schizmy')|E]: [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0]/[Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "Jak daleko podzieleni [GetRiteByKey('roman_rite').GetAdherentNamePlural] i [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] popchną wspólnotę chrześcijańską w kierunku [Concept('schism', 'wielkiej schizmy')|E]?\n\nGdy przeleje się czara goryczy, Kościół rozpadnie się na pół.$GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial W wierze o nazwie [GetFaithByKey( 'christian_faith').GetName|l] nie można ustanowić [Concept('head_of_faith', 'głowy wiary')|E], dopóki nie dojdzie do [Concept('schism', 'wielkiej schizmy')|E] lub się jej nie zapobiegnie#!\n\n#help Co wpływa na wzrost:\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName] przegłosowuje usunięcie [Concept('core_tenet', 'dogmatu')|E] lub [Concept('doctrine', 'doktryny')|E] z [Concept('rites', 'obrządków')|E]\n$BULLET_WITH_TAB$Spór pomiędzy dwoma obrządkami przed debatami podjętymi przez [GetActivityType('activity_ecumenical_council').GetName|l]\n$BULLET_WITH_TAB$[war|E] pomiędzy postaciami o tytule co najmniej [Concept('kings', 'króla')|E] praktykującymi dwa obrządki i uczestniczącymi w sytuacji „[GetSituation('the_christian_church').GetName]”\n$BULLET_WITH_TAB$Zmiana obrządku [Concept('holy_site', 'miejsca świętego')|E] na drugi\n$BULLET_WITH_TAB$Obniżenie rangi [Concept('holy_site', 'miejsca świętego')|E] któregoś z obrządków\n$BULLET_WITH_TAB$Morderstwo [Concept('head_of_rite', 'głowy obrządku')|E] przez wyznawców drugiego obrządku#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "Następna epoka „[GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName]” spowoduje odblokowanie dostępu do [Concept('decisions', 'decyzji')|E] „[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]” i „[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]” oraz do [Concept('interaction', 'interakcji')|E] „#V $pam_sway_schism_stance_interaction$#!”"
