 the_christian_church_fragile_unity_situation_phase: "$fragile_unity$"
 fragile_unity: "Krucha jedność"
 fragile_unity_icon: "@pam_the_christian_church_fragile_unity_icon! $fragile_unity$"
 fragile_unity_desc: "Chrześcijańskiemu światu brakuje jednego tronu, któremu wszyscy winni są posłuszeństwo. Królowie, biskupi i heretycy utrzymują, że przemawiają w imieniu Boga, lecz zdaje się, że nikt ich nie słucha."
