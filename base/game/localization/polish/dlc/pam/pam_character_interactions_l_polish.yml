 pam_interactions_events.0010.opening: "Prawowity obrońco miejsca o nazwie [target.GetNameNoTier]!"
 pam_interactions_events.0010: "Od jak dawna przykazania [actor.GetFaith.HighGodNamePossessive] dotyczące ziem i tytułów są ignorowane? Od jak dawna ludzie, których domem jest [target.GetTierAsNameNoTooltip], cierpią bez pasterza z rodu [actor.GetHouse.GetName]?\n\nPoprę Twoje roszczenie do miejsca znanego jako [target.GetNameNoTierNoTooltip] na każdym dworze, na każdej radzie, w każdym traktacie.\n\nTwoje roszczenie nie wygaśnie wraz z Twoją śmiercią."
 pam_interactions_events.0010.a.low_zeal: "I tak powstaje dziedziczne prawo…"
 pam_interactions_events.0010.a.high_zeal: "Niech miejsce o nazwie [target.GetNameNoTierNoTooltip] osiągnie zbawienie na długo przed tym!"
 pam_interactions_events.0010.a: "Niech nigdy nie zostanie zapomniane."
 pam_interactions_events.0010.toast_puppeteer: "[recipient.GetShortUINameNotMe] zgadza się poprzeć roszczenie osoby znanej jako [puppet_or_actor.GetShortUINameNotMe] do tytułu miejsca o nazwie [target.GetNameNoTier]"
 pam_interactions_events.0011.opening: "Wasza Wiecznie Nienasycona Wysokość!"
 pam_interactions_events.0011: "Wysyłam tę wiadomość z troską i zaniepokojeniem. Czy takie bezwstydne roszczenia do tego, co do Ciebie nie należy, nie poniżają Twojej godności? Czy nie obawiasz się urazy [actor.GetFaith.HighGodNamePossessive]? Tego, co powiedzą Twoi bracia i siostry [actor.GetFaith.GetReligion.GetAdherentNamePlural]?\n\nGdy Twoja dusza spocznie w miejscu znanym jako [actor.GetFaith.PositiveAfterLife] lub – jeśli los okaże się mściwy – [actor.GetFaith.NegativeAfterLife], módlmy się, by ziemie o nazwie [target.GetNameNoTier] zaznały spokoju."
 pam_interactions_events.0011.a: "Ta podła kreatura mnie zdradziła?!?"
 pam_interactions_events.0011.toast_puppeteer: "[recipient.GetShortUINameNotMe] nie zgadza się poprzeć roszczenia osoby znanej jako [puppet_or_actor.GetShortUINameNotMe] do tytułu miejsca o nazwie [target.GetNameNoTier]"
