 must_be_same_tier_or_one_higher_tt: "Możesz podarowywać tylko [titles|El] o [Concept('title_tier', 'poziomie')|E] osoby znanej jako [recipient.GetShortUINameNotMe] lub o jeden poziom wyższe"
