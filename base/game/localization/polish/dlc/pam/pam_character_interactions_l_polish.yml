 demand_child_as_monk_interaction_desc: "Zażądaj, aby osoba znana jako [recipient.GetShortUINameNotMe] przekazała [child|El], potomka lub niepełnoletniego [Concept('courtier', 'dworzanina')|E] pozostającego pod opieką tej postaci jako [GetTrait('devoted').GetName( GetNullCharacter )|l], co uniemożliwi przekazanej osobie [Concept('succession', 'sukcesję')|E] i sprawi, że zostanie ona twoim [Concept('courtier', 'dworzaninem')|E]."
