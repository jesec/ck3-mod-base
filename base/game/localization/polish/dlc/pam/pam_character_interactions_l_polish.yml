 demand_child_as_monk_notification: "Nadszedł czas – niech [secondary_recipient.GetTitledFirstNameNoTooltip] odłoży troski tego świata i zacznie służbę, by głosić nauki [actor.GetFaith.HighGodNamePossessive]. Oddaj [secondary_recipient.Custom('PL_go_ja')] pod moją opiekę, a będzie mieć miejsce w klasztorze do końca swoich dni."
