 demand_divorce_family_widow_tt: "Osoba znana jako [recipient.GetTitledFirstName] jest związana przysięgą z inną osobą – jest nią [secondary_recipient.GetTitledFirstName], wdowa po członku rodziny"
 DEMAND_DIVORCE_NOTIFICATION: "Moim obowiązkiem jest zażądać od ciebie odprawienia twojego małżonka – niech [secondary_recipient.GetTitledFirstName] zniknie."
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\n[secondary_recipient.GetFirstNameNoTooltip] to osoba, z którą łączą cię więzi krwi, o czym wie cały świat. Takie kazirodztwo nie może się ostać przed obliczem [actor.GetFaith.HighGodNamePossessive]."
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nWasz związek jest kpiną z łoża małżeńskiego w kształcie, jaki nadaje mu wola [actor.GetFaith.HighGodNamePossessive]. To nie może się ostać."
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip] oddaje cześć obcym bogom, a mimo to dzieli z tobą łoże. Nie mogę pozwolić, by taki związek dłużej trwał."
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip] to osoba, która zboczyła z drogi prawdziwej wiary, a twoją duszę ciągnie za sobą. Ten związek nie może się ostać."
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\nCały świat wie, że [secondary_recipient.GetFirstNameNoTooltip] plami wasze łoże małżeńskie zdradą. To, co zostało złamane, musi zostać teraz zakończone."
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] to osoba, która jest jednym z wielu twoich współmałżonków – a to układ, który wywołuje obrzydzenie [actor.GetFaith.HighGodNamePossessive]. To nie może się ostać."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nUczeni mężowie prześledzili historię twojego rodu i odkryli, że [secondary_recipient.GetFirstNameNoTooltip] to osoba blisko z tobą spokrewniona. Ich ustalenia są jednoznaczne."
