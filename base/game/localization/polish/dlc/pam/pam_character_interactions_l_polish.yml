 # Clerical land transfer events
 # player Priest refuses event
 pam_interactions_events.0031.opening: "Moje drogie dziecko!"
 pam_interactions_events.0031.desc: "Z woli [actor.GetFaith.HighGodNamePossessive] masz usta do wypowiadania słusznych słów i dłonie do dzierżenia miecza. [actor.GetFaith.PriestNeuterPlural|U] też są darem od [actor.GetFaith.HighGodNamePossessive], by świat mógł usłyszeć ich mądrość. \n\nZżera Cię chciwość, toteż wypowiadasz niesprawiedliwe słowa. Ogarnia Cię lękliwe zwątpienie, toteż powstrzymujesz miecz, którego pragniesz użyć w miejscu znanym jako [target.GetNameNoTier].\n\nTak więc sprawa sprowadza się do tego: musisz uszanować moją mądrość… i zostawić to miejsce w spokoju."
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip] odrzuca mą prośbę!"
 # Player clergy response event
 pam_interactions_events.0033.opening: "Strażnico porządku na niebie i na ziemi!"
 pam_interactions_events.0033_de_jure: "Potrzebuję Twej pomocy. Ogłoś, że moje panowanie nad miejscem znanym jako [target.GetName] jest prawowite, albowiem tak jest de iure. Daj mi swe poparcie, aby udało mi się bez rozlewu krwi przekonać osobę, którą jest [recipient.GetName].\n\n"
 pam_interactions_events.0033_claim: "Pragnę wypełnić swoje roszczenie wobec miejsca znanego jako [target.GetNameNoTier]. Udziel mi błogosławieństwa, a [recipient.GetName] niech przekaże mi te ziemie tak, by [actor.GetFaith.GetAdjective|l] krew nie została przelana.\n\n"
 pam_interactions_events.0033_threaten: "Jeśli odmówisz mej prośbie… to #EMP Ty#! będziesz tłumaczyć się przed obliczem [ROOT.Char.GetFaith.HighGodNamePossessive] ze straszliwej rzezi i pożogi, jaką sprowadzę na wspomniane tereny."
 pam_interactions_events.0033_succession: "Jeśli przemówisz w moim imieniu, mogę Ci obiecać, co następuje: jeżeli umrę jako [actor.GetTitleAsName] miejsca znanego jako [actor.GetPrimaryTitle.GetNameNoTier] – a mój ród nie wyda potomka – ziemie te trafią wtedy do Kościoła."
 pam_interactions_events.0033_pilgrimage: "W zamian za Twą świętą zgodę w tej ziemskiej sprawie przyrzekam, że udam się na pielgrzymkę: będzie to akt wdzięczności za udzielone mi błogosławieństwa [actor.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0033_use_hook: "Zapewne pamiętasz, że podlegasz moim rozkazom, a cokolwiek napisze Twe pióro, musi być zgodne z mymi zachciankami?"
 pam_interactions_events.0033_offer_hook: "Użyczenie Twej pobożnej reputacji mojej sprawie jest niemałą przysługą. Poprzyj mnie w polityce śmiertelników, a ja poprę Cię w przyszłości."
 pam_interactions_events.0033_donate: "Użycz mi swej pomocy i poszerz me państwo o nowe ziemie, a ja z ochotą przekażę datek do Twego pobożnego skarbca."
 pam_interactions_events.0033_fallback: "Te negocjacje o ziemię i tytuł spełzną na niczym, chyba że rozpocznie je święty orędownik. Czy użyczysz swego świętego autorytetu mojej sprawie?"
 pam_interactions_events.0033.aa: "Tak. Już."
 pam_interactions_events.0033.a: "Na mocy mojego dekretu [actor.GetFirstNameNoTooltip] musi przejąć ziemie znane jako [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0033.a.tt: "Wyślij wiadomość do osoby znanej jako [recipient.GetTitledFirstNameNoTooltip]: trzymanie się nieprawowicie zdobytej ziemi jest obrazą dla [secondary_recipient.GetFaith.HighGodNamePossessive] oraz dla osoby, którą jest [secondary_recipient.GetTitleAsNameNoTooltip]!"
 pam_interactions_events.0033.b: "Nie mogę przychylić się do tej bezczelnej prośby."
 pam_interactions_events.0033.b.tt: "Świat już jest dobrze urządzony. [recipient.GetTitledFirstNameNoTooltipRegnal] musi zatrzymać miejsce znane jako [target.GetNameNoTierNoTooltip]."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUINameNotMe] spróbuje przekonać osobę, którą jest [recipient.GetShortUINameNotMe], do przekazania [actor.Custom('PL_mu_jej')] miejsca znanego jako [target.GetName], co może się nie udać#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUINameNotMe] może zmusić osobę, którą jest [recipient.GetShortUINameNotMe], do przekazania [actor.Custom('PL_mu_jej')] miejsca znanego jako [target.GetName], ale może zamiast tego wybrać ryzyko porażki#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUINameNotMe] odda miejsce znane jako [target.GetName] osobie, którą jest [actor.GetShortUINameNotMe], bez oporu#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Twoje [law|El] „[GetLaw('church_authority_3').GetName]” umożliwia ci zmuszenie osoby, którą jest [recipient.GetShortUINameNotMe], do tego, by bez oporu oddała miejsce znane jako [target.GetName] osobie, którą jest [actor.GetShortUINameNotMe]#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "Jako święty rozjemca niniejszym rozpoczynam negocjacje."
 pam_interactions_events.0032_intro: "Twoja opieka nad miejscem znanym jako [target.GetNameNoTier] była umiejętna, ale z woli [recipient.GetFaith.HighGodNamePossessive] [target.GetTierAsNameNoTooltip] to [actor.GetName] ma być teraz władcą tych ziem. Czy możesz [actor.Custom('PL_mu_jej')] je przekazać bez rozlewu krwi?\n\n"
 pam_interactions_events.0032_de_jure: "Albowiem [target.GetNameNoTierNoTooltip] to [actor.Custom('PL_jego_jej')] własność #EMP de iure#!."
 pam_interactions_events.0032_claim: "Albowiem w oczach Wszechmogącego [actor.Custom('PL_jego_jej')] roszczenie do miejsca znanego jako [target.GetNameNoTierNoTooltip] jest najsłuszniejszym ze wszystkich."
 pam_interactions_events.0032.aa: "Gdzie jest moje pióro…"
 pam_interactions_events.0032.aa.flavor: "Udowodnię to całemu światu: żadna cnota [recipient.GetFaith.GetAdjectiveNoTooltip|l] nie przysługuje tym grzesznym szarlatanom, bo taka jest wola [recipient.GetFaith.HighGodNamePossessive]. Posiadają oni jedynie bezwstydną zuchwałość – i tak pozostanie na wieki wieków."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP [actor.GetShortUINameNotMe] próbuje zdobyć miejsce znane jako [target.GetName], ale ponosi porażkę#!#!#!"
 pam_interactions_events.0032.a: "Jeśli taka jest wola [actor.GetFaith.HighGodNamePossessive], zrzeknę się miejsca znanego jako [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0032.b: "Nie. Nie przekonujecie mnie."
 pam_interactions_events.0032.b.tt: "Gdyby tylko osoby znane jako [actor.GetTitledFirstNameNoTooltip] i [secondary_recipient.GetTitledFirstNameNoTooltip] dało się tak łatwo uciszyć…"
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold Może skłonić cię do zaakceptowania [actor.Custom('PL_jego_jej')] przejęcia miejsca znanego jako [target.GetName] jedną z poniższych metod:#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "Negocjacje o miejsce znane jako [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0030.desc_intro_envoy: "Na świętej ziemi mój posłaniec, [secondary_recipient.GetTitledFirstNameRegnal], przedstawia moją sprawę dotyczącą ziem znanych jako [target.GetNameNoTier]."
 pam_interactions_events.0030.desc_intro: "[secondary_recipient.GetTitledFirstNameRegnal] mi błogosławi, chroni mnie też święta ziemia, a więc przedstawiam moją sprawę dotyczącą ziem znanych jako [target.GetNameNoTier]."
 pam_interactions_events.0030.desc: "Słowa pokojowego pojednania poprzetykane groźbami wojny. Deklaracje mych świętych praw. I tak dalej…\n\n"
 pam_interactions_events.0030.desc_target: "[target.GetTierAsNameNoTooltip] to nie miejsce, z którego [recipient.GetTitledFirstNameNicknamed] da się wygnać tak łatwo. Kwestia tej ziemi musi zostać przypieczętowana ziemskimi obietnicami lub niegodziwymi groźbami."
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed] nie poluzuje tak łatwo swego uścisku – [vassal.GetName] szybko się nie wywinie. Muszę zdobyć wasala za wszelką cenę, czy to obietnicą złota, czy straszliwymi groźbami."
 pam_interactions_events.0030.a: "[recipient.GetFirstNameNoTooltip] ma pewne zobowiązania – nie zapomnij [recipient.Custom('PL_mu_jej')] o tym przypomnieć."
 pam_interactions_events.0030.a.flavor: "I to [actor.GetTitleAsNameNoTooltip] z miejsca znanego jako [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] może o to prosić!"
 pam_interactions_events.0030.b: "[ROOT.Char.Custom2('RelationToMe', recipient)|U] mi się nie przyda. Za to [target.GetNameNoTierNoTooltip] – owszem."
 pam_interactions_events.0030.b.flavor: "Powiem wprost: jeśli [recipient.GetFirstNameNoTooltip] odmówi, jest dla ciebie nikim."
 pam_interactions_events.0030.c: "Jeśli [recipient.GetSheHe] nie ustąpi, musisz zhańbić tę świętą ziemię."
 pam_interactions_events.0030.c.tt: "Obrzućcie tego nikczemnego grzesznika podłymi oskarżeniami! Niech spadnie na was potępienie i pogarda! [secondary_recipient.GetTitledFirstNameNoTooltip] i wszyscy [actor.GetFaith.PriestNeuterPlural] sprawią, że [recipient.GetFirstNameNoTooltip] ustąpi!"
 pam_interactions_events.0030.d: "Zagroź, że uczynisz z tego kompromitujący skandal."
 pam_interactions_events.0030.d.flavor: "[recipient.GetTitleAsNameNoTooltip] nie ma za wiele poważania i za długo nie wytrwa, jeśli na szali postawione zostaną imiona i reputacje…"
 pam_interactions_events.0030.e: "Zaoferuj po prostu, że kupisz te ziemie."
 pam_interactions_events.0030.f: "Niech ocenią to [ROOT.Char.GetFaith.HighGodName] i [target.GetFirstNameNoTooltip]."
 clergy_land_no_method_warning_tt: "@warning_icon! #X #bold Przy braku zachęt to mało prawdopodobne, że [recipient.GetShortUINameNotMe] się zgodzi.#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Przy braku zachęt jest mniej prawdopodobne, że [recipient.GetShortUINameNotMe] się zgodzi.#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "[target.GetNameNoTierNoTooltip] przedmiotem sporów"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal] nadal spiera się o miejsce znane jako [target.GetNameNoTier] w imieniu osoby, którą jest [actor.GetName] – a także w imieniu, jak twierdzi, ziemskiego zakonu [recipient.GetFaith.HighGodNamePossessive] oraz całego duchowieństwa, którego wiara to [recipient.GetFaith.GetName|l]."
 pam_interactions_events.0034.desc_intro: "[actor.GetName] opowiada się za swoją sprawą dotyczącą miejsca o nazwie [target.GetNameNoTier]: powtarza prośbę, dysponując protekcją i poparciem wiary znanej jako [recipient.GetFaith.GetName|l]."
 pam_interactions_events.0034.desc_vassal: "A przecież [target.GetHolder.GetName] przysięga mi lojalność do śmierci. Wygląda na to, że tę lojalność można negocjować."
 pam_interactions_events.0034.desc_target: "A przecież [target.GetTierAsNameNoTooltip] to moja ziemia, zdobyta krwią i podbojami. Wszystko na tym świecie można negocjować."
 pam_interactions_events.0034.desc: "\n\nZbliżono się do mnie na świętej ziemi, a ja w spokoju znoszę te ataki na moje prawa. Mogę tylko dumać nad tym, co mi jest oferowane…\n\n"
 pam_interactions_events.0034.desc_method_hook: "Nad obietnicą, że zobowiązania, którymi krępuje mnie [actor.GetTitledFirstNameNoTooltip], będą unieważnione."
 pam_interactions_events.0034.desc_method_relation: "Nad tragicznym końcem wszelkiego ciepła, zaufania i miłości między nami. Jak mówi [actor.GetFirstNameNoTooltip], [actor.Custom('PL_jego_jej')] serce jest na tej ziemi.\n\nBędzie mnie nienawidzić do końca świata za to, że [actor.Custom('PL_go_ja')] tego pozbawiam."
 pam_interactions_events.0034.desc_method_piety: "Nad groźbą, że moja już i tak napięta relacja z tą wiarą całkowicie legnie w gruzach. Osłabi to też zaufanie do osoby znanej jako [actor.GetTitledFirstNameNoTooltip], ale jej pobożność jest głębiej osadzona niż moja."
 pam_interactions_events.0034.desc_method_legitimacy: "Nad poważnym zagrożeniem dla mojej legitymacji. Okropną publiczną sprzeczką o miejsce znane jako [target.GetNameNoTierNoTooltip], skandalem, przez który jesteśmy pośmiewiskiem…"
 pam_interactions_events.0034.desc_method_gold: "Nad stertą lśniących monet. To odpowiednia cena, jak twierdzi [actor.GetTitleAsNameNoTooltip], za wspomniane ziemie."
 pam_interactions_events.0034.desc_no_method: "…czyli nad #EMP zupełnie niczym#!. Chodzi tylko o to żądanie przekazania ziem i założenie, że [recipient.GetFaith.PriestNeuterPlural] i ich pogarda oraz okropieństwa wojny wywołują we mnie strach."
 pam_interactions_events.0034.a: "Może wznieść swoją chorągiew ponad miejscem znanym jako [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0034.b: "Dopóki żyję, [target.GetTierAsNameNoTooltip] należy do mnie."
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip] w nowych rękach"
 pam_interactions_events.0035.desc_intro: "Po namyśle [recipient.GetFirstNameNicknamed] się zgadza! Negocjacje w sprawie cesji miejsca znanego pod nazwą [target.GetNameNoTier] są szybkie i owocne.\n\n[secondary_recipient.GetTitledFirstName] wypełnia dekret przyznający mi prawa."
 pam_interactions_events.0035.desc_hook: "Moje zobowiązanie wobec osoby, którą jest [recipient.GetFirstNameNoTooltip], zostało honorowo wypełnione."
 pam_interactions_events.0035.desc_relation: "Tak, uroniono gorzkie łzy i nastąpił kres radości i podziwu. [recipient.GetFirstNameNoTooltip] odczuwa dotkliwą krzywdę wyrządzoną przez moją chęć zdobycia wspomnianych ziem. Ale…"
 pam_interactions_events.0035.desc_piety: "A zatem moje groźby, że [recipient.GetFirstNameNoTooltip] i ja okryjemy się niegodziwą hańbą… nie muszą zostać spełnione."
 pam_interactions_events.0035.desc_legitimacy: "A zatem moje groźby dotyczące sporu i oszczerstwa… nie muszą zostać spełnione."
 pam_interactions_events.0035.desc_gold: "Wysyłam wiadomość moim skarbnikom i wierzycielom – to cena, którą chętnie ponoszę."
 pam_interactions_events.0035.desc_fallback: "Z woli [actor.GetFaith.HighGodNamePossessive] tchnięto we mnie wielką moc, którą otrzymali również [actor.GetFaith.PriestNeuterPlural] wiary znanej jako [actor.GetFaith.GetName|l]. Możemy kształtować świat wedle życzenia, bez potrzeby powoływania armii i wypowiadania wojny."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName] przysięgnie mi swą lojalność."
 pam_interactions_events.0035.desc: "\n\n[target.GetTierAsNameNoTooltip] należy do mnie."
 pam_interactions_events.0035.a: "Niech moje sztandary powiewają wysoko nad całym miejscem znanym jako [target.GetNameNoTierNoTooltip]!"
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip] – nic z tego"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName] daje swą odpowiedź w asyście mężnych żołnierzy. Wygląda nieswojo mimo pojednawczej mediacji osoby, którą jest [secondary_recipient.GetTitledFirstName].\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName] daje swą odpowiedź w asyście niezłomnych wojowników – to [recipient.Custom('KnightCulturePluralNoTooltip')|l]. Wygląda nieswojo mimo pojednawczej mediacji osoby, którą jest [secondary_recipient.GetTitledFirstName].\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName] daje swą odpowiedź samotnie i z podniesioną głową. Emanuje śmiałością zaczerpniętą z pojednawczej mediacji osoby, którą jest [secondary_recipient.GetTitledFirstName].\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName] daje swą odpowiedź w asyście straży przybocznej, emanując pogardą wobec pojednawczej mediacji osoby, którą jest [secondary_recipient.GetTitledFirstName].\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName] daje swą odpowiedź w asyście niezłomnych wojowników – to [recipient.Custom('KnightCulturePluralNoTooltip')|l]. Emanuje pogardą wobec pojednawczej mediacji osoby, którą jest [secondary_recipient.GetTitledFirstName].\n\n"
 pam_interactions_events.0036.desc_hook: "– Ziemie znane jako [target.GetNameNoTier] mają szczególne miejsce w mym sercu, ważniejsze niż wszelkie zobowiązanie, jakie możesz chcieć mi narzucić."
 pam_interactions_events.0036.desc_relation: "– [actor.GetTitleAsName] miejsca znanego jako [actor.GetPrimaryTitle.GetNameNoTier] pluje mi prosto w serce. Rozdziera mą duszę na strzępy. Nie chcę już mieć z [actor.Custom('PL_nim_nia')] do czynienia."
 pam_interactions_events.0036.desc_piety: "– Jeśli ziemie znane jako [target.GetNameNoTier] do ciebie nie trafią, upokorzysz i mnie, i siebie grzechem i oskarżeniami? Jak sobie życzysz."
 pam_interactions_events.0036.desc_legitimacy: "– Rozsiewaj swe zatrute kłamstwa. Nastaw mieszkańców ziem o nazwie [target.GetNameNoTier] i wszystkich innych ludzi przeciwko sobie i mnie."
 pam_interactions_events.0036.desc_gold: "– Myślisz, że [target.GetNameNoTier] to ziemie, które możesz kupić za złoto i srebro? To o wiele za prosta transakcja, biorąc pod uwagę, że [target.GetTierAsNameNoTooltip] to tak szlachetne miejsce."
 pam_interactions_events.0036.desc_fallback: "– Czy [actor.GetTitleAsName] i [secondary_recipient.GetTitleAsNameNoTooltip] mogą zdobyć miejsce znane jako [target.GetNameNoTier] jedynie kilkoma prostymi słowami…? Nie."
 pam_interactions_events.0036.desc_afraid: "[recipient.GetFaith.PriestNeuterPlural|U] mogą przybyć w twoim imieniu, powitam ich. Jeśli wyślesz posłańców, będę z nimi pertraktować.\n\n– Ale [target.GetTierAsNameNoTooltip] to nie miejsce, które mogę tak po prostu oddać."
 pam_interactions_events.0036.desc_pious: "Kolejni skorumpowani [recipient.GetFaith.PriestNeuterPlural] mogą przybyć na twoje polecenie, możesz też wysłać zastępy uzbrojonych okrutników do miejsca znanego jako [target_capital.GetTitle.GetNameNoTier]…\n\n– [target.GetTierAsNameNoTooltip] pozostanie w moim posiadaniu. To dar dla mnie od [recipient.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0036.desc: "Kolejni zawodzący [recipient.GetFaith.PriestNeuterPlural] mogą przybyć na twoje polecenie, tak jak i [actor.Custom('GetFighterTermPlural')], całe ich zastępy, do miejsca znanego jako [target_capital.GetTitle.GetNameNoTier]…\n\n– [target.GetTierAsNameNoTooltip] nie zmieni tak łatwo właściciela."
 pam_interactions_events.0036.a_relation: "Jak [recipient.GetSheHe] może mi odmówić?!?"
 pam_interactions_events.0036.a: "Odrzucać wolę osoby, którą jest [secondary_recipient.GetTitleAsNameNoTooltip]? Haniebne…"
 clergy_land_transfer_refusal_tt: "Odmówiono przekazania ziem znanych jako [target.GetName] osobie, którą jest [actor.GetShortUINameNotMe]"
 pam_interactions_events.0037.opening: "Wasza Czcigodność!"
 pam_interactions_events.0037.desc: "Z przykrością przekazuję te wieści tak nagle, lecz to mój obowiązek: [actor.GetTitleAsName] miejsca znanego jako [actor.GetPrimaryTitle.GetNameNoTier] jest od teraz Twym seniorem.\n\n[secondary_recipient.GetTitledFirstNameRegnal] taką ma wolę – bo to właśnie ta osoba prowadziła negocjacje dotyczące ziem, które stanowi [ROOT.Char.GetPrimaryTitle.GetTierAsName], między mną a osobą, którą jest [actor.GetTitledFirstNameNicknamed]. Zachowaj wierność wobec swego nowego seniora, tak jak i ziemie i nazwie [recipient.GetPrimaryTitle.GetNameNoTier] cieszyły się twoją wiernością."
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUINameNotMe] zostaje twoim [Concept('liege', 'seniorem')|E]"
 pam_interactions_events.0037.a: "Moja przysięga zostaje niniejszym zaprzepaszczona. Już nikt nie może mi rozkazywać."
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip] zrzeka się swego zwierzchnictwa. A jeśli [actor.GetTitledFirstNameNoTooltip] chce je przejąć… musi przybyć do miejsca znanego jako [target.GetNameNoTierNoTooltip] z silną armią."
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? Naprawdę?"
 pam_interactions_events.0037.b.tt: "Niegdyś to ziemie znane jako [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] skupiały na sobie spojrzenia moich ludzi – a teraz to chyba [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
