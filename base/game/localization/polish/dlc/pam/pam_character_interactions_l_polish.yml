 pam_evangelize_recipient_prohibited_selected_tenet_reason: "[recipient.GetShortUINameNotMe] boi się twojego [Concept('prohibited_tenet_status', 'zakazanego')|E] [Concept('personal_tenet', 'dogmatu osobistego')|E]: $VALUE|=+0$"
