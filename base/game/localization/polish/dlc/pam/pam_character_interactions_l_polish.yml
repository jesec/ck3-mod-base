 request_victory_interaction_notification: "Losy tej wojny są już przesądzone, a każdy kolejny jej miesiąc przerodzi się jedynie w chrześcijańskie groby. Jako pasterz obszaru o nazwie [recipient.GetPrimaryTitle.GetDefinitiveName] ogłoś jej zakończenie i niech [secondary_recipient.GetShortUINameNotMe] ustąpi przed twoim osądem, a nie przed moimi armiami."
