 pam_interactions_events.0083.opening: "Na mocy autorytetu, którym cechuje się religia [recipient.GetFaith.GetReligion.GetAdjectiveNoTooltip|l], ogłaszam, co następuje!"
 pam_interactions_events.0083.desc: "Wiedz, że po rozpatrzeniu wojny, którą toczycie Ty i [puppet_or_actor.GetTitledFirstName], uznano ją za rozstrzygniętą. Dalsza walka oznaczałaby jedynie szafowanie życiem chrześcijan w imię i tak przegranej sprawy, a nie chcę mieć tej krwi na swoich rękach.\n\nNiniejszym ogłaszam, że ta wojna jest wygrana. Ci, którzy poddają się wyrokom Kościoła, nie pozostaną bez nagrody."
 pam_interactions_events.0083.a: "A więc moja porażka została przesądzona wyrokiem."
