 pam_interactions_events.0039.opening: "[ROOT.Char.GetFirstName]!"
 pam_interactions_events.0039.desc: "Służysz mi lojalnie, więc z przykrością przekazuję te wieści tak nagle, lecz to mój obowiązek: [target.GetName] to od teraz własność osoby, którą jest [actor.GetTitleAsName] miejsca znanego jako [actor.GetPrimaryTitle.GetNameNoTier].\n\nTaką decyzję podejmuje [secondary_recipient.GetTitledFirstNameRegnal], osoba prowadząca negocjacje dotyczące ziem znanych jako [ROOT.Char.GetPrimaryTitle.GetTierAsName], między mną a osobą, którą jest [actor.GetTitledFirstNameNicknamed]. Teraz twój cel to [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] – powróć tam, a wkrótce otrzymasz nowy przydział."
