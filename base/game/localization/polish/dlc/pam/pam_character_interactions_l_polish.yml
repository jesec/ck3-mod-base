 pam_interactions_events.0090.opening: "Drogi rodzicielu państwa,"
 pam_interactions_events.0090.desc: "zaprawdę, łaska [recipient.GetFaith.HighGodNamePossessive] spływa na miejsce znane jako [recipient.GetPrimaryTitle.GetNameNoTier]! Na mocy twego oświadczenia będę rządzić tą ziemią jako [recipient.GetTitleAsName], co uszczęśliwia wyznawców wiary znanej jako [recipient.GetFaith.GetName|l].\n\nPoświęcę swoje życie, by chronić [recipient.GetPrimaryTitle.GetTierAsName]. Rządź mądrze według mych praw. Rządź stanowczo, używając mojego miecza i berła. A ja będę uważnie słuchać twych rad."
 pam_interactions_events.0090.a: "Dzięki hojności [actor.GetFaith.HighGodNamePossessive] mamy nowego władcę. Oto [recipient.GetTitleAsNameNoTooltip]."
 pam_interactions_events.0090.a.flavor: "A dzięki mądrości [actor.GetFaith.HighGodNamePossessive] [recipient.GetFirstNameNoTooltip] to [recipient.GetTitleAsNameNoTooltip] z długiem wobec mnie."
 has_valid_exclave_duchy_tt: "[duchies|E], które zostaną dodane do [Concept('kingdom', 'królestwa')|E] osoby znanej jako [recipient.GetShortUINameNotMe], muszą graniczyć z księstwem, które zostanie eksklawą [de_jure|E] po jego utworzeniu: księstwem nie będącym stolicą, które nie będzie już graniczyć z innymi księstwami swojego królestwa."
