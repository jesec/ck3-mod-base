 pam_interactions_events.0100.t: "Nigdy więcej bękartem"
 pam_interactions_events.0100.desc: "W obecności [ROOT.Char.GetFaith.HighGodNamePossessive] oraz przed gronem zgromadzonych wiernych [actor.GetTitledFirstName] ogłasza mnie dzieckiem z prawego łoża. To, czego odmówiło mi moje pochodzenie, duchowni przyznali mi za sprawą świętych sakramentów i pociągnięcia piórem.\n\nNiechaj nikt nie nazywa mnie już bękartem."
 pam_interactions_events.0100.a: "Skaza została zmyta!"
 pam_interactions_events.0101.opening: "Niech Twój ród będzie błogosławiony!"
 pam_interactions_events.0101.desc: "Z radością przekazuję Ci te pomyślne wieści. Ogłaszam, że [recipient.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] Twojej osoby, jest od teraz w oczach [ROOT.Char.GetFaith.HighGodNamePossessive] dzieckiem z prawego łoża.\n\nŻadne prawo ani plotki nie mogą już być wykorzystywane przeciwko [recipient.Custom('PL_niemu_niej')] z powodu [recipient.Custom('PL_jego_jej')] narodzin."
 pam_interactions_events.0101.a: "To zaprawdę pomyślne wieści."
