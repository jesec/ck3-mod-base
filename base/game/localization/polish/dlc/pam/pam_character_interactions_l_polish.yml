 ecclesiastical_bestow_title_interaction_desc: "Używając swojego autorytetu duchowego, przyznaj obecnie nieutworzony [title|El] bezpośrednio osobie, którą jest [recipient.GetShortUINameNotMe], potencjalnie zwiększając jej [Concept('rank', 'rangę')|E]"
 ecclesiastical_bestow_title_interaction_toast: "Podarowano miejsce o nazwie [target.GetNameNoTierNoTooltip]"
 ecclesiastical_bestow_title_interaction_effect_tt: "[target.GetName] – to miejsce zostało utworzone i przyznane osobie, którą jest [recipient.GetShortUINameNotMe]"
 ECCLESIASTICAL_BESTOW_TITLE_NOTIFICATION: "Wszyscy wierni w twoim państwie wyznający wiarę, jaką jest [recipient.GetFaith.GetReligion.GetName|l] zasługują na pokój i dobrobyt, którym [recipient.GetFaith.GetReligion.GetAdjective|l] kraina znana jako [target.GetTierAsNameNoTooltip] została pobłogosławiona dzięki łasce [recipient.GetFaith.HighGodNamePossessive]. W tym celu chcę proklamować miejsce o nazwie [target.GetName] i oddać je pod twoją opiekę."
