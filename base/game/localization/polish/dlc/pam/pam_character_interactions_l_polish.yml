 pam_negotiate_land_possible_acceptance_tt: "Aby przekonać osobę, którą jest [recipient.GetShortUINameNotMe], do przekazania [Concept('title', 'tytułu')|E], [actor.GetShortUINameNotMe] wymaga jednego z poniższych:\n$BULLET_WITH_TAB$[hook_i] [Concept('hook', 'Haka')|E] na osobę, którą jest [recipient.GetShortUINameNotMe]\n$BULLET_WITH_TAB$[Concept('relation', 'Relacji')|E] na poziomie: [friend|El], [disciple|El] lub [soulmate|El]\n$BULLET_WITH_TAB$Wyższego @piety_icon! [Concept('piety_level', 'poziomu religijności')|E]\n$BULLET_WITH_TAB$Wyższego @legitimacy_icon! [Concept('legitimacy_level', 'poziomu legitymacji')|E]\n$BULLET_WITH_TAB$#high [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! szt. @gold_icon! [Concept('gold', 'złota')|E] lub środków ze @treasury_icon! [Concept('treasury', 'skarbca')|E]\n$BULLET_WITH_TAB$[recipient.GetShortUINameNotMe] odczuwa @intimidated_icon! [Concept('intimidated', 'zastraszenie')|E] i ma mniej niż #high 25%#! twojej siły wojskowej (w którą wliczają się [allies|El])\n$BULLET_WITH_TAB$[recipient.GetShortUINameNotMe] odczuwa @terrified_icon! [Concept('cowed', 'przerażenie')|E] i ma mniej niż #high 50%#! twojej siły wojskowej (w którą wliczają się [allies|El])"
