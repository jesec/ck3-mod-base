 pam_interactions_events.0096.opening: "Sprawiedliwa jest ręka opatrzności!"
 pam_interactions_events.0096.desc: "Odłączenie obszaru znanego jako [target.GetNameNoTier] od miejsca znanego jako [former_de_jure_liege.GetNameNoTier] to czyn wielce mądry i błogosławiony!\n\nNiechaj stanie się zadość Twojemu dekretowi: po wsze czasy ziemie o nazwie [de_jure_master.GetPrimaryTitle.GetNameNoTier] będą filarem, po którego obydwu stronach stać będą [target.GetTierAsNameNoTooltip] i [ROOT.Char.GetFaith.PositiveAfterLife], aby wierni [ROOT.Char.GetFaith.GetAdherentNamePlural] z [target.GetAdjectiveNoTooltip] byli na wieki prowadzeni ku światłości [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nWłączę to do mojej świętej przysięgi."
