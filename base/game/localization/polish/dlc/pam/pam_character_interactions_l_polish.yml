 pam_interactions_events.0050.d: "Módlcie się wspólnie, proście [recipient.GetFaith.HighGodNamePossessive] o pomoc."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nTo kazirodczy związek, nienaturalny układ, który należy skończyć!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nNasza wiara [puppet_or_actor.GetFaith.GetAdjective|l] zmusza mnie do pozbycia się tego człowieka z mojego łóżka!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nZwróć uwagę, że [secondary_recipient.GetFirstNameNoTooltip] to osoba oskarżona o beznadziejną impotencję…"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip] otwarcie dopuszcza się ohydnego kazirodztwa, gardząc naszym związkiem! To hańba!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip] nie okazuje mi wierności i wszyscy o tym wiedzą!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\nMoim przeznaczeniem jest poślubić mężczyznę, taka jest wola [puppet_or_actor.GetFaith.HighGodNamePossessive]! A [secondary_recipient.GetFirstNameNoTooltip] z męskością nie ma nic wspólnego."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\nNie do wiary! Ten pomiot szatana, a dla mnie [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], próbował mnie zamordować!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip] wyznaje poligamię! Jestem po prostu jednym z wielu przedmiotów w [secondary_recipient.Custom('PL_jego_jej')] dobytku. Uwolnij mnie!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\nMam dzielić łoże ze wstrętnym innowiercą wyznającym wiarę znaną jako [secondary_recipient.GetFaith.GetName|l]? Na pewno nie taka jest wola [puppet_or_actor.GetFaith.HighGodNamePossessive]."
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\nNie jest tajemnicą, dlaczego cię o to błagam! Ta rozpustna kanalia, [secondary_recipient.GetFirstNameNoTooltip], była wobec mnie nielojalna."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nNasze małżeństwo jest bezdzietne i nie mamy nadziei, że kiedykolwiek się to zmieni."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\nMusisz wymyślić jakieś usprawiedliwienie, ale niech moje słowa dotrą do [puppet_or_actor.GetFaith.HighGodNamePossessive]! Mój gniew wobec osoby, którą jest [secondary_recipient.GetFirstNameNoTooltip], powinien być wystarczający sam w sobie."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nNie mam żadnego uzasadnienia prawnego… wierzę jednak, że dzięki swojej znajomości prawa religijnego #EMP znajdziesz#! podstawy do unieważnienia małżeństwa."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\nTo kazirodczy związek, nienaturalny układ, który należy skończyć!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\nNasza wiara [puppet_or_actor.GetFaith.GetAdjective|l] zmusza mnie do pozbycia się tego człowieka z łóżka bliskiej mi osoby, którą jest [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE_SECONDARY: "\n\nZwróć uwagę, że [secondary_recipient.GetFirstNameNoTooltip] to osoba oskarżona o beznadziejną impotencję…"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] otwarcie dopuszcza się ohydnego kazirodztwa, gardząc swoim związkiem! To hańba!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY: "\n\nOsoba, którą jest [secondary_actor.GetFirstNameNoTooltip], a dla mnie [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], pada ofiarą niewierności ze strony osoby znanej jako [secondary_recipient.GetFirstNameNoTooltip], i wszyscy o tym wiedzą!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY: "\n\n[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))|U] mojej osoby ma poślubić mężczyznę, taka jest wola [puppet_or_actor.GetFaith.HighGodNamePossessive]! A [secondary_recipient.GetFirstNameNoTooltip] z męskością nie ma nic wspólnego."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\nNie do wiary! Osoba znana jako [secondary_actor.GetFirstNameNoTooltip], a dla mnie [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], prawie została zamordowana. Stoi za tym ten pomiot szatana, a dla mnie [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] wyznaje poligamię! Osoba znana jako [secondary_actor.GetFirstNameNoTooltip], a dla mnie [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], jest po prostu jednym z wielu trofeów w [secondary_recipient.Custom('PL_jego_jej')] kolekcji. Uwolnijcie [secondary_actor.Custom('PL_go_ja')]!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH_SECONDARY: "\n\n[puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))|U] mojej osoby ma dzielić łoże ze wstrętnym innowiercą wyznającym tak plugawą wiarę jak [secondary_recipient.GetFaith.GetName|l]? Na pewno nie taka jest wola [puppet_or_actor.GetFaith.HighGodNamePossessive]."
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT_SECONDARY: "\n\nNie jest tajemnicą, dlaczego cię o to błagam! Osoba znana jako [secondary_actor.GetFirstNameNoTooltip], a dla mnie [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], padła ofiarą nielojalności tej rozpustnej kanalii, którą jest [secondary_recipient.GetFirstNameNoTooltip]."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY_SECONDARY: "\n\nIch małżeństwo jest bezdzietne i nie mają nadziei, że kiedykolwiek się to zmieni."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED_SECONDARY: "\n\nMusisz wymyślić jakieś usprawiedliwienie, ale niech nasze słowa dotrą do [puppet_or_actor.GetFaith.HighGodNamePossessive]! Nasz gniew wobec osoby, którą jest [secondary_recipient.GetFirstNameNoTooltip], powinien być wystarczający sam w sobie."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED_SECONDARY: "\n\nNie mam żadnego uzasadnienia prawnego… wierzę jednak, że dzięki swojej znajomości prawa religijnego #EMP znajdziesz#! podstawy do unieważnienia małżeństwa."
 DIVORCE_INDUCEMENTS: "Namów odbiorcę do podporządkowania się:"
 cleric_divorce_fuckery_tt: "@alert_icon! #bold #alert_trial Ponieważ osoba, którą jest [puppet_or_actor.GetShortUINameNotMe], nie wybrała żadnej metody, aby #high namówić odbiorcę do podporządkowania się#! #weak (poniżej)#!:#!#!"
 cleric_cause_house_feud_tt: "Może wywołać [house_feud|El] pomiędzy [Concept('houses', 'rodami')|E] [divorcer.GetHouse.GetName] i [secondary_recipient.GetHouse.GetName]"
 cleric_force_holy_order_lease_tt: "Może oddać w [Concept('lease', 'dzierżawę')|E] [Concept('holy_order', 'zakonowi rycerskiemu')|E] jedną z [Concept('holdings', 'posiadłości')|E] osoby znanej jako [divorcer.GetShortUINameNotMe]"
 cleric_get_hook_tt: "Może zdobyć @hook_on_me_icon! [Concept('hook', 'haka')|E] na osobę, którą jest [divorcer.GetShortUINameNotMe]"
 cleric_get_hook_forcer_tt: "Może zdobyć @hook_on_me_icon! [Concept('hook', 'haka')|E] na osobę, którą jest [forcing_divorce.GetShortUINameNotMe]"
 cleric_put_spouse_in_monastery_tt: "Może zmusić osobę znaną jako [secondary_recipient.GetShortUINameNotMe], aby przyjęła cechę [GetTrait('devoted').GetName( secondary_recipient )|l]"
 JUSTIFY_DIVORCE_INTERACTION_OPTION: "Uzasadnienie na podstawie prawa religijnego"
 divorce_justified_tt: "Musi być spełniony dowolny z następujących warunków:\n$EFFECT_LIST_BULLET$Osoba, którą jest [secondary_recipient.GetShortUINameNotMe], próbowała cię zabić\n$EFFECT_LIST_BULLET$Osoba, którą jest [secondary_recipient.GetShortUINameNotMe] ma cechę [GetTrait('adulterer').GetName( secondary_recipient )|l]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] ma bardzo niską [fertility|El], a wasze małżeństwo jest bezdzietne\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] wyznaje [Concept('faith', 'wiarę')|E] [Concept('faith_hostile', 'antagonistyczną')|E] lub [Concept('faith_evil', 'złą')|E]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] ma wielu [Concept('spouses', 'małżonków')|E] pomimo zakazu poligamii\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] cierpi na impotencję\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] ma [Concept('incestuous', 'kazirodczy')|E] romans\n$EFFECT_LIST_BULLET$Twoje małżeństwo z osobą, którą jest [secondary_recipient.GetShortUINameNotMe], to związek [Concept('incestuous', 'kazirodczy')|E]\n$EFFECT_LIST_BULLET$Twoje małżeństwo z osobą, którą jest [secondary_recipient.GetShortUINameNotMe], to związek osób tej samej płci, co jest zakazane"
 divorce_justified_secondary_tt: "Musi być spełniony dowolny z następujących warunków:\n$EFFECT_LIST_BULLET$Osoba, którą jest [secondary_recipient.GetShortUINameNotMe], próbowała zabić osobę znaną jako [secondary_actor.GetShortUINameNotMe]\n$EFFECT_LIST_BULLET$Osoba, którą jest [secondary_recipient.GetShortUINameNotMe] ma cechę [GetTrait('adulterer').GetName( secondary_recipient )|l]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] ma bardzo niską [fertility|El], a ich małżeństwo jest bezdzietne\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] wyznaje [Concept('faith', 'wiarę')|E] [Concept('faith_hostile', 'antagonistyczną')|E] lub [Concept('faith_evil', 'złą')|E]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] ma wielu [Concept('spouses', 'małżonków')|E] pomimo zakazu poligamii\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] cierpi na impotencję\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINameNotMe] ma [Concept('incestuous', 'kazirodczy')|E] romans\n$EFFECT_LIST_BULLET$Małżeństwo osoby znanej jako [secondary_actor.GetShortUINameNotMe] z osobą, którą jest [secondary_recipient.GetShortUINameNotMe], to związek [Concept('incestuous', 'kazirodczy')|E]\n$EFFECT_LIST_BULLET$Małżeństwo osoby znanej jako [secondary_actor.GetShortUINameNotMe] z osobą, którą jest [secondary_recipient.GetShortUINameNotMe], to związek osób tej samej płci, co jest zakazane"
 JUSTIFY_DIVORCE_REASON: "Rozwód uzasadniony na podstawie prawa religijnego: $VALUE|=+0$"
 must_neighbor_recipient_tt: "[recipient.GetShortUINameNotMe] nie jest twoim sąsiadem ani nie znajduje się w twoim [Concept('realm', 'państwie')|E]"
 pam_interactions_events.0060.t: "Uzasadnienie rozwodu"
 pam_interactions_events.0060.desc: "Owszem, [puppet_or_actor.GetTitledFirstName] chce zakończyć swoje małżeństwo, ale mimo całej urazy, jaką [puppet_or_actor.GetSheHe] i [secondary_recipient.GetTitledFirstName] żywią do siebie, ich związek zawarty był w obliczu [puppet_or_actor.GetFaith.HighGodNamePossessive]. Nie mają też żadnej słusznej przyczyny, by go zakończyć.\n\nMuszę zatem wymyślić kłamstwo, które nada zasadność unieważnieniu małżeństwa. Jakieś bluźnierstwo, które być może wymaga jakiejś odpłaty…"
 pam_interactions_events.0060.a: "To rozstanie prosi się o krwawą aferę."
 pam_interactions_events.0060.a.tt: "Żadne szlachetne kłamstwa nie powinny paść z moich ust, tylko same wstrętne oskarżenia przeciwko osobie znanej jako [secondary_recipient.GetFirstNameNoTooltip]! [secondary_recipient.Custom('PL_jego_jej')|U] rodzina będzie musiała stanąć w [secondary_recipient.Custom('PL_jego_jej')] obronie. A [actor.GetFirstNameNoTooltip] będzie wymagać obrony swoich bliskich."
 pam_interactions_events.0060.b: "Niech [puppet_or_actor.GetTitleAsNameNoTooltip] przekaże ziemię wiernym."
 pam_interactions_events.0060.b.tt: "Oddanie tytułu zakonowi o nazwie [lease_order.GetName] pozwoli nam wszystkim pozbyć się tego brzemienia."
 pam_interactions_events.0060.c: "Przysługa, za którą należy się przysługa."
 pam_interactions_events.0060.d: "Powiedz, że osobę znaną jako [secondary_recipient.GetFirstNameNoTooltip] obiecano duchowieństwu."
 pam_interactions_events.0060.d.tt: "Jeśli dawno temu ten człowiek złożył śluby zakonne zakonu o nazwie [divorcee_joining_order.GetName], to małżeństwo byłoby nieważne! A kto lepiej pokierowałby jego nowym życiem, jeśli nie ja?"
 pam_interactions_events.0060.e: "Nie stawiaj żadnych żądań nieszczęsnej parze."
 divorce_cleric_perspective_tt: "[puppet_or_actor.GetShortUINameNotMe] rozwodzi się z osobą, którą jest [secondary_recipient.GetShortUINameNotMe]"
 ecclesiastic_incite_holy_war_interaction: "Namów do świętej wojny"
 ecclesiastic_incite_holy_war_interaction_notification: "Z woli [actor.GetFaith.HighGodNamePossessive] [secondary_recipient.GetShortUINameNotMe] musi wystąpić zbrojnie przeciw osobie znanej jako [recipient.GetShortUINameNotMe] o miejsce o nazwie [target.GetName]."
 recipient_secondary_ecclesiastic_incite_holy_war_interaction: "Atakujący"
