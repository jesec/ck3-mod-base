 pam_interactions_events.0081.desc: "Zapoznano się z twoją prośbą dotyczącą miejsca o nazwie [target.GetDefinitiveName] i zaakceptowano ją.\n\nOczekuje się, że [succession_holder.GetTitledFirstName] zrzeknie się miejsca znanego jako [target.GetNameNoTier]. Co więcej, oczekuje się, że osoba, którą jest [enforced_heir.GetTitledFirstName], zostanie uznana w oczach [recipient.GetFaith.HighGodNamePossessive] za prawowitego władcę tego miejsca."
