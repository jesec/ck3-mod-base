 request_court_chaplain_cardinalate_interaction_desc: "Zwróć się do [Concept('head_of_faith', 'głowy wiary')|E], aby osoba znana jako [actor.GetCouncillor( 'councillor_court_chaplain' ).GetCouncilTitleFirstName] została wyniesiona do [Concept('college_of_cardinals', 'Kolegium Kardynalskiego')|E]. Tylko [cardinal|El] może objąć stanowisko kolejnej [Concept('head_of_faith', 'głowy wiary')|E], a [cardinal|El] zawdzięczający ci czerwony kapelusz jest [Concept('cardinal', 'kardynałem')|E], którego warto przy sobie zatrzymać.\n\n#italic [actor.GetCouncillor( 'councillor_court_chaplain' ).GetCouncilTitleFirstName] obejmie własną [Concept('cardinalate', 'diecezję kardynalską')|E], zrezygnuje ze swojego miejsca w twojej [Concept('council', 'radzie')|E] i stanie się twoim [Concept('external_clerical_puppet', 'marionetkowym władcą duchownym')|E], o ile nie masz innych.#!"
 request_court_chaplain_cardinalate_interaction_notification: "Mój kapelan, [actor.GetCouncillor( 'councillor_court_chaplain' ).GetCouncilTitleFirstName], troszczy się o dusze w moim państwie z mądrością i niestrudzonym oddaniem. Wynieś tę osobę do Kolegium Kardynalskiego – nasza wiara nie znajdzie wierniejszego sługi."
