 pam_interactions_events.0094.opening: "Niech [ROOT.Char.GetTitleAsName] w swej prawości przyjmie moje pozdrowienia!"
 pam_interactions_events.0094.desc_conversion: "Szerz słowo płynące z mądrości [cleric.GetFaith.HighGodNamePossessive] na ziemiach znanych jako [target.GetNameNoTier]! Nie szczędź rózgi tamtejszemu krnąbrnemu ludowi ani potęgi hufców, które tworzą twoi [ROOT.Char.Custom('GetFighterTermPlural')], w obronie cnót tej ziemi.\n\n[target.GetTierAsNameNoTooltip] to Twoje ziemie, więc powinny podlegać Twoim rządom. Są poddane opatrzności każdej osoby sprawującej władzę jako [ROOT.Char.GetTitleAsName] [ROOT.Char.GetPrimaryTitle.GetAdjective], #EMP de iure#! aż po wsze czasy."
 pam_interactions_events.0094.desc: "[cleric.GetFaith.GetAdherentNamePlural|U] z obszaru znanego jako [target.GetNameNoTooltip] mogą się radować! O, jakże pragnęli zjednoczyć się ze swoimi braćmi i siostrami zamieszkującymi miejsce o nazwie [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nTo, co żyło w sercach mieszkańców [target.GetAdjectiveNoTooltip], [cleric.GetTitleAsName] wdraża jako prawo, spełniając wolę [cleric.GetFaith.HighGodNamePossessive] – od teraz w mniemaniu władców wielu krain [target.GetTierAsNameNoTooltip] to ziemie #EMP de iure#! należące do miejsca znanego jako [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTierNoTooltip]."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip] i [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] zostają złączone wieczną więzią."
 pam_interactions_events.0095.opening: "Niech [ROOT.Char.GetTitleAsName] ziem znanych jako [target_county.GetNameNoTier] oraz i licznych innych terenów przyjmie moje pozdrowienia!"
 pam_interactions_events.0095.desc: "Spłynęło na Ciebie błogosławieństwo [cleric.GetFaith.HighGodNamePossessive]! W ramach aktu mądrości [cleric.GetFaith.HighGodNamePossessive] całe terytorium znane jako [target.GetName] trafiło pod wieczną ochronę osoby, którą jest [de_jure_master.GetTitleAsName] miejsca o nazwie [de_jure_master.GetPrimaryTitle.GetName].\n\nJa, [cleric.GetTitleAsName], ogłaszam ten dekret w imieniu tych, którymi są [cleric.GetFaith.GetAdherentNamePlural] z ziem [target.GetAdjectiveNoTooltip], a także w imieniu osoby, którą jest [de_jure_master.GetTitleAsNameNoTooltip], oraz wszystkich tych, którzy dostrzegają mądrość w tym podziale #EMP de iure#! śmiertelnych państw poddanych woli [cleric.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0095.a: "Niech [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip] będą przeklęci w swej chciwości!"
