 pam_reaffirm_doctrine_interaction_tooltip: "Przyjmuje jedną [Concept('doctrine', 'doktrynę')|E] z [Concept('rite', 'obrządku')|E] znanego jako [actor.GetRite.GetName|l]"
 pam_reaffirm_doctrine_interaction_notification: "[recipient.GetRite.GetName] oddala się od cennej ortodoksji, jaką reprezentuje obrządek znany jako [actor.GetRite.GetName|l]. [actor.GetTitleAsName] wzywa was wszystkich do pokuty! Służcie woli [recipient.GetFaith.HighGodNamePossessive] i niech wszyscy [recipient.GetRite.GetAdherentNamePluralNoTooltip] dowiedzą się, co to jest [pam_reaffirm_doctrine.GetDescriptiveName( recipient.GetFaith )]."
