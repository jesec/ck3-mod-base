 pam_interactions_events.0070.t: "Wojna w imię osoby, którą jest [puppet_or_actor.GetTitleAsNameNoTooltip]"
 pam_interactions_events.0070.desc_intro_pagan: "– Niegodziwi poganie z miejsca o nazwie [target.GetNameNoTier] zasługują na"
 pam_interactions_events.0070.desc_intro_heretic: "– [recipient.GetFaith.GetAdherentNamePlural], heretycy, z miejsca o nazwie [target.GetNameNoTier] zasługują na"
 pam_interactions_events.0070.desc_intro_infidel: "– Niewierni z miejsca o nazwie [target.GetNameNoTier] wyznający [recipient.GetFaith.GetReligion.GetName|l] zasługują na"
 pam_interactions_events.0070.desc_intro_heathen: "– [recipient.GetFaith.GetReligion.GetAdherentNamePlural], innowiercy z miejsca o nazwie [target.GetNameNoTier] zasługują na"
 pam_interactions_events.0070.desc: "#EMP potępienie, upadek i śmierć od miecza!#! – wykrzykuje [puppet_or_actor.GetTitledFirstNameRegnal], a [puppet_or_actor.Custom('PL_jego_jej')] przesłanie dociera do niespokojnego tłumu w miejscu znanym jako [secondary_recipient.GetPrimaryTitle.GetNameNoTier].\n\n– Wznieście święty sztandar boskiej opatrzności osoby, którą jest [ROOT.Char.GetTitledFirstName]! Wzywam was do wygnania człowieka o imieniu [recipient.GetTitledFirstName] z ziemi znanej jako [target.GetNameNoTierNoTooltip]! Niech [recipient.Custom('PL_jego_jej')] [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] z obszaru o nazwie [recipient.GetPrimaryTitle.GetName] spłoną w ogniu piekielnym!\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "W rzeczy samej, [puppet_or_actor.GetTitleAsNameNoTooltip] pragnie poszerzyć dominium [puppet_or_actor.GetFaith.HighGodNamePossessive]! Zarzeka się, że ruszy na wojnę we własnej osobie i odda mi do dyspozycji swoje jednostki."
 pam_interactions_events.0070.desc_outro_funding_war: "Za tymi żądaniami stoi pieniądz. [puppet_or_actor.GetTitleAsNameNoTooltip] obiecuje zasoby wojenne w postaci funduszy, aby moi [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] z miejsca znanego jako [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] byli zagrzewani do walki nie tylko przez wiarę."
 pam_interactions_events.0070.a: "– Łaska [ROOT.Char.GetFaith.WarGodNamePossessive] nam sprzyja! #EMP Na wojnę!#!"
 pam_interactions_events.0070.b: "Zostaw ludzi osoby znanej jako [recipient.GetTitledFirstNameNoTooltip] w spokoju."
 cultural_acceptance_gain_refused_incited_holy_war: "Władca świecki nie dopuścił do rozpoczęcia świętej wojny"
 pam_interactions_events.0071.t: "Podbój miejsca o nazwie [target.GetNameNoTierNoTooltip] w imię [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pam_interactions_events.0071.desc_intro: "Do miejsca znanego jako [target.GetTierAsNameNoTooltip], gdzie żyją [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)|U], dociera święte słowo [ROOT.Char.GetFaith.HighGodNamePossessive] wybrzmiewające w okrzykach wojennych, pieśniach i modlitwach o wygraną! Z najważniejszej budowli, którą jest [ROOT.Char.GetFaith.HouseOfWorship] w miejscu o nazwie [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier], [secondary_recipient.GetName] ogłasza świętą wojnę przeciwko"
 pam_interactions_events.0071.desc_intro_pagan: "poganom zamieszkującym obszar znany jako [recipient.GetPrimaryTitle.GetName].\n\nNiczym bezrozumne zwierzęta, [recipient.GetTitledFirstName] i [recipient.Custom('PL_jego_jej')] [recipient.GetCulture.GetCollectiveNoun|l] z pewnością rozpierzchną się, gdy przybędą prawowici gospodarze miejsca o nazwie [secondary_recipient.GetPrimaryTitle.GetNameNoTier] wyznający [secondary_recipient.GetFaith.GetReligion.GetName|l]!"
 pam_interactions_events.0071.desc_intro_heretic: "heretykom zamieszkującym obszar znany jako [recipient.GetPrimaryTitle.GetName].\n\n[recipient.GetTitledFirstName] i [recipient.Custom('PL_jego_jej')] ohydni [recipient.GetFaith.GetAdherentNamePlural] zostaną zmieceni z tej ziemi w rozlewie krwi, jakiego świat nie widział! Taki los czeka tych, dla których słowo [ROOT.Char.GetFaith.HighGodNamePossessive] nic nie znaczy!"
 pam_interactions_events.0071.desc_intro_infidel: "osobie, którą jest [recipient.GetTitleAsName] z miejsca znanego jako [recipient.GetPrimaryTitle.GetNameNoTier].\n\nNiewierni wyznający [recipient.GetFaith.GetReligion.GetName|l] wkrótce się poddadzą, jak wszyscy, którzy ponieśli porażkę w obliczu #EMP dżihadu#! proroka Mahometa!"
 pam_interactions_events.0071.desc_intro_heathen: "osobie, którą jest [recipient.GetTitleAsName] z miejsca znanego jako [recipient.GetPrimaryTitle.GetNameNoTier].\n\nO niebiosa, [secondary_recipient.GetName] rozbije zastępy pogan! A wszystkie ludy wyznające [ROOT.Char.GetFaith.GetReligion.GetName|l] będą patrzeć w zdumieniu."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nMoje własne oddziały nie powinny się biernie przyglądać. Nie! Powinny nacierać na miejsce znane jako [recipient.GetCapitalLocation.GetTitle.GetNameNoTier], tak samo jak [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l] osoby, którą jest [secondary_recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nŻarliwi wojownicy z obszaru o nazwie [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] i nie tylko zbierają się już, aby zjednoczyć się pod sztandarem osoby znanej jako [secondary_recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nSama łaska [ROOT.Char.GetFaith.HighGodNamePossessive] daje osobie znanej jako [secondary_recipient.GetTitledFirstNameNoTooltip] obietnicę zwycięstwa. Lecz mój hojny datek zapewnia jej pewność siebie."
 pam_interactions_events.0071.a: "Niech ci, którzy zginą za tę sprawę, na wieki zaznają chwały."
