 bestow_empire_iberian_struggle_tt: "[recipient.GetShortUINameNotMe] nie może zdobyć [empire|El], gdy angażuje się w [iberian_struggle|El]"
 pam_interactions_events.0091.opening: "Mój dobroczyńco,"
 pam_interactions_events.0091.desc_hook_theocrat: "twoje wstawiennictwo wiążę się z wielkim zobowiązaniem. Jedna dłoń trzyma pastorał, a druga jest mocno ujęta przez samą dłoń [recipient.GetFaith.HighGodNamePossessive]. Nie może być więc inaczej, jestem [recipient.GetFaith.HighGodHerHis|U] wiernym sługą! Miejsce znane jako [target.GetNameNoTier] to wspaniały podarunek, a ja, czerpiąc z tego korzyści, chcę wyrazić swoja wdzięczność.\n\nNiech się wieść niesie, że zgodnie z wolą osoby, którą jest [ROOT.Char.GetTitledFirstNameRegnal], miejsce o nazwie [target.GetTierAsName] należy do duchowieństwa!"
 pam_interactions_events.0091.desc_hook: "twoje wstawiennictwo wiążę się z wielkim zobowiązaniem. Jedna dłoń trzyma berło władzy, a druga jest mocno ujęta przez samą dłoń [recipient.GetFaith.HighGodNamePossessive]. Nie może być więc inaczej. Miejsce znane jako [target.GetNameNoTier] to wspaniały podarunek, a ja, czerpiąc z tego korzyści, chcę wyrazić swoja wdzięczność.\n\nNiech się wieść niesie, że zgodnie z wolą osoby, którą jest [ROOT.Char.GetTitledFirstNameRegnal], miejsce o nazwie [target.GetTierAsName] jest moje!"
 pam_interactions_events.0091.desc: "Twoje wstawiennictwo jest błogosławieństwem większym, niż można było sobie wyobrazić. Niepojęte jest, jak daleko sięga boża świętość i ile niesie ze sobą dobra. Chwalmy [recipient.GetFaith.HighGodNamePossessive]!\n\n[target.GetName] to szlachetna ziemia. Będę nosić jej tytuł i dopilnuję, aby [recipient.GetFaith.GetAdherentNamePlural] zostali otoczeni rządami pełnymi pokory i łaski."
 pam_interactions_events.0091.a: "Miejsce znane jako [target.GetNameNoTierNoTooltip] wymaga bacznej obserwacji."
 pam_interactions_events.0092.opening_theocratic: "Wasza wielebność,"
 pam_interactions_events.0092.opening: "Moja [ROOT.Char.Custom('GetTitleTierAdjective')] dziecino,"
 pam_interactions_events.0092.desc_hook: "gdy modlisz się nad wielkim darem, którym [recipient.GetFaith.HighGodName] i [recipient.GetFaith.HighGodHerHis|U] prałaci cię obdarzyli, dobrze się zastanów, czy naprawdę zasługujesz na miejsce znane jako [target.GetTierAsName]. Być może wciąż czekają nabożne modlitwy, które należy odprawić w twoim imieniu.\n\nUdzielę ci w tej sprawie mojej rady. Musimy dopilnować, aby twoje panowanie w miejscu, którym jest [target.GetNameNoTierNoTooltip], służyło uciesze i woli [recipient.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0092.desc: "Miejsce znane jako [target.GetTierAsNameNoTooltip] zostaje ogłoszone twoim!\n\nDzięki moim modlitwom naprawdę udało mi się otoczyć szczególną troską twoje postępy. Proszę tylko o jedno: sprawuj swe rządy dobrze, aby [recipient.GetFaith.GetAdherentNamePlural] z miejsca o nazwie [target.GetNameNoTier] mogli uznać twoje panowanie za błogosławieństwo."
 pam_interactions_events.0092.a: "Mandat prosto z miejsca o nazwie [recipient.GetFaith.PositiveAfterLife]!"
 request_unformed_title_interaction: "Zabiegaj o tytuł"
 request_unformed_title_interaction_desc: "Poproś osobę znaną jako [recipient.GetShortUINameNotMe] o ogłoszenie nieutworzonego [Concept('title', 'tytułu')|E] przewyższającego rangą [de_jure|El] twoje ziemie i oddanie go w twoje ręce"
 REQUEST_UNFORMED_TITLE_NOTIFICATION: "Miejsce znane jako [target.GetName] zbyt długo pozostawało bez pana, a jego ziemie są już w istocie moje. Ogłoś mnie prawowitym władcą z woli [puppet_or_actor.GetFaith.HighGodNamePossessive] i twojej, aby żaden mieszkający w nim [puppet_or_actor.GetFaith.GetAdherentName] nie miał wątpliwości."
 request_unformed_title_no_hegemony_tt: "Nie można zabiegać o [titles|El] o [Concept('title_tier', 'poziomie')|E] [Concept('hegemony', 'hegemonii')|E] od [Concept('clergy', 'duchowieństwa')|E]"
 request_unformed_title_tier_range_tt: "Można zabiegać jedynie o [titles|El] o [Concept('title_tier', 'poziomie')|E] równym twojemu lub o jeden wyższym"
 request_unformed_title_hold_de_jure_vassal_tt: "Musisz posiadać [title|El] przynależący [de_jure|El] bezpośrednio do miejsca znanego jako [target.GetName]"
 request_unformed_title_third_of_de_jure_tt: "Co najmniej jedna trzecia [Concept('counties', 'hrabstw')|E] leżących w miejscu znanym jako [target.GetNameNoTier] musi znajdować się w twoim [Concept('realm', 'państwie')|E] i musi być w nich wyznawana wiara o nazwie [puppet_or_actor.GetFaith.GetName|l]"
 request_unformed_title_not_clerics_vassal_tt: "Nie możesz być [Concept('vassal', 'wasalem')|E] osoby znanej jako [recipient.GetShortUINameNotMe], która może przyznać ci [titles|El] w zwykły sposób"
 request_unformed_title_liege_two_tiers_higher_tt: "Musisz być postacią niezależną lub być co najmniej dwie [ranks|El] niżej niż [puppet_or_actor.GetLiege.GetName]"
 valid_request_unformed_title_tt: "Nieutworzony [title|El] przewyższający rangą [de_jure|El] tytuł należący do ciebie musi:\n$EFFECT_LIST_BULLET$Być pozbawiony [Concept('holder', 'właściciela')|E]\n$EFFECT_LIST_BULLET$Mieć [title_tier|El] równy poziomowi twojego tytułu lub o jeden wyższym\n$EFFECT_LIST_BULLET$Mieć co najmniej jedną trzecią [Concept('counties', 'hrabstw')|E] położonych w twoim [Concept('realm', 'państwie')|E] i musi być w nich wyznawana wiara o nazwie [puppet_or_actor.GetFaith.GetName|l]"
 request_unformed_title_empire_iberian_struggle_tt: "Nie możesz zdobyć [empire|El], gdy angażujesz się w [iberian_struggle|El]"
 valid_request_unformed_title_holy_war_option_tt: "Co najmniej jedna czwarta [Concept('counties', 'hrabstw')|E] [de_jure|El] w miejscu znanym jako [target.GetNameNoTier] musi należeć do [Concept('rulers', 'władców')|E], których [Concept('faith', 'wiarę')|E] [puppet_or_actor.GetFaith.GetAdherentNamePlural] uznają za [Concept('faith_hostile', 'antagonistyczną')|E] lub [Concept('faith_evil', 'złą')|E]"
