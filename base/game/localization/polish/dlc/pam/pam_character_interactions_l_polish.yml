 pam_interactions_events.0097.desc: "Twoja prośba została wysłuchana. Miejsce znane jako [target.GetName] zbyt długo pozostawało bez pana, przez co jego [ROOT.Char.GetFaith.GetAdjective|l] wspólnota pozostawała bez pasterza, a to nie był dobry sposób na umiłowanie [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nPrzyjmij je w pokorze. Kościół pamięta, jakie [Concept('title', 'tytuły')|E] nadaje."
 pam_interactions_events.0097.desc_holy_war: "Twoja prośba została wysłuchana, a twoje śluby spisane tam, gdzie nie zostaną zapomniane. Miejsce znane jako [target.GetName] należy do ciebie, choć w niektórych jego zakątkach wciąż lud kłania się tym, którzy zaprzeczają istnieniu [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nIdź i weź to, co z mocy tytułu już do ciebie należy. Żaden pobożny [ROOT.Char.GetFaith.PriestNeuter|l] nie zakwestionuje twojej wojny, lecz za pięć lat zapytamy, co z niej wynikło, a ślub złożony na próżno to ślub złamany."
