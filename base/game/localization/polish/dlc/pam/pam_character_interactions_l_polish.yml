 recipient_must_be_clerical_superior_tt: "[recipient.GetShortUINameNotMe] musi być przynajmniej twoim [Concept('vassal', 'wasalem')|E] lub [Concept('superior', 'zwierzchnikiem')|E]"
 secondary_recipient_must_have_superior_tt: "[secondary_recipient.GetShortUINameNotMe] musi podlegać [Concept('ecclesiastical', 'kościelnemu')|E] lub [Concept('theocratic', 'teokratycznemu')|E] [Concept('superior', 'zwierzchnikowi')|E] lub [Concept('liege', 'seniorowi')|E]"
 target_char_must_be_clerical_subordinate_tt: "Jako [ruler|El] [ecclesiastical|El] lub [theocratic|El], [target_char.GetShortUINameNotMe] może być co najwyżej [Concept('vassal', 'wasalem')|E] lub [Concept('subordinate', 'podwładnym')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe]"
 bishop_excommunication_target_secular_tt: "[target_char.GetShortUINameNotMe] musi spełnić jeden z poniższych warunków:\n$EFFECT_LIST_BULLET$Być co najwyżej [Concept('vassal', 'wasalem')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe]\n$EFFECT_LIST_BULLET$Być [Concept('ruler', 'władcą')|E] sąsiadującym z [Concept('clerical_region', 'regionem duchownym')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe] lub przebywającym w nim\n$EFFECT_LIST_BULLET$Mieć [Concept('court_chaplain', 'nadwornego kapelana')|E], który jest co najwyżej [Concept('subordinate', 'podwładnym')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe]\n$EFFECT_LIST_BULLET$[excommunicator.GetShortUINameNotMe] musi być [target_char.Custom('PL_jego_jej')] [Concept('court_chaplain', 'nadwornym kapelanem')|E] i [excommunicator.GetShortUINameNotMe] nie może mieć [Concept('superior', 'zwierzchnika')|E]\n$EFFECT_LIST_BULLET$Dowolna osoba będąca przynajmniej [Concept('liege', 'seniorem')|E] musi mieć [Concept('court_chaplain', 'nadwornego kapelana')|E], którym jest [excommunicator.GetShortUINameNotMe]"
 bishop_excommunication_target_courtier_tt: "[Concept('liege', 'Seniorem')|E] postaci, którą jest [target_char.GetShortUINameNotMe], musi być osoba znana jako [excommunicator.GetShortUINameNotMe], co najwyżej [vassal|El] osoby znanej jako [excommunicator.GetShortUINameNotMe], [ruler|El] sąsiadujący z [Concept('clerical_region', 'regionem duchownym')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe] lub przebywający w nim"
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U] musi znajdować się w [Concept('realm', 'państwie')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe], sąsiednim [Concept('county', 'hrabstwie')|E] lub [Concept('clerical_region', 'regionie duchownym')|E] osoby znanej jako [excommunicator.GetShortUINameNotMe]"
 can_excommunicate_directly: "[puppet_or_actor.GetShortUINameNotMe] może osobiście [excommunicate|El] osobę znaną jako [secondary_recipient.GetShortUINameNotMe]"
 no_valid_excommunicator_tt: "Ponieważ twoja [faith|El] nie ma [Concept('theocratic', 'teokratycznej')|E] [Concept('head_of_faith', 'głowy wiary')|E], osoba, którą jest [secondary_recipient.GetShortUINameNotMe], może zostać [Concept('excommunicated', 'ekskomunikowana')|E] tylko przez potężnego [Concept('ruler', 'władcę')|E] [Concept('ecclesiastical', 'kościelnego')|E], który spełnia jeden z następujących warunków:\n$EFFECT_LIST_BULLET$Jest przynajmniej [Concept('liege', 'seniorem')|E] tej osoby\n$EFFECT_LIST_BULLET$Jest sąsiednim [Concept('ruler', 'władcą')|E] lub w jego [Concept('clerical_region', 'regionie duchownym')|E] znajduje się [realm_capital|El] tej osoby\n$EFFECT_LIST_BULLET$Jest przynajmniej [Concept('superior', 'zwierzchnikiem')|E] [Concept('court_chaplain', 'nadwornego kapelana')|E] tej osoby\n$EFFECT_LIST_BULLET$Jest [Concept('court_chaplain', 'nadwornym kapelanem')|E] tej osoby i nie ma [Concept('superior', 'zwierzchnika')|E]"
 excommunicator_must_be_hof_tt: "Tylko [head_of_faith|El] może [excommunicate|El] osobę, którą jest [target_char.GetName]"
 pam_interactions_events.0072.opening: "Wstrętny [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)]!"
 pam_interactions_events.0072.desc_joined_war: "Przybywam do ciebie jako misjonarz, aby rozświetlić twój mrok. Jako [puppet_or_actor.GetMotherFather], by cię ukarać.\n\n[secondary_recipient.GetName], wojownik boży, i twoi rodziciele kroczą razem. [secondary_recipient.Custom('PL_jego_jej')|U] armie wyzwolą miejsce o nazwie [target.GetNameNoTier] ze zła wszelkiego."
 pam_interactions_events.0072.desc: "Dla ciebie jest już za późno. Nie licz na skruchę.\n\nOto niegodziwa ziemia obszaru znanego jako [recipient.GetPrimaryTitle.GetNameNoTier] zostanie rozszarpana! Oto [puppet_or_actor.GetFaith.DevilName] wraz ze swoimi sługami posmakuje żelaza! Chwytam za broń wiernych i posyłam osobę, którą jest [secondary_recipient.GetName], by sprowadziła na ciebie zagładę!"
 pam_interactions_events.0072.a: "Okrucieństwo [puppet_or_actor.GetFaith.HighGodNamePossessive] jest bezgraniczne, skoro zostaliśmy poszczuci takimi ludźmi!"
 incite_holy_war_past_tense_tt: "[puppet_or_actor.GetShortUINameNotMe] zmusza osobę, którą jest [secondary_recipient.GetShortUINameNotMe], do wypowiedzenia [Concept('holy_war', 'świętej wojny')|E] o miejsce znane jako [target.GetName]"
 incite_holy_war_joined_tt: "[puppet_or_actor.GetShortUINameNotMe] dołącza do [Concept('holy_war', 'świętej wojny')|E] przeciwko osobie znanej jako [recipient.GetShortUINameNotMe]"
 not_at_war_for_target_title_or_above_tt: "Jesteś w trakcie [Concept('war', 'wojny')|E], której celem jest miejsce znane jako [target.GetName] lub [title|El] znajdujący się w jego hierarchii [de_jure|El]"
 pam_reaffirm_doctrine_interaction: "Potwierdź doktrynę"
 pam_reaffirm_doctrine_interaction_extra_icon: "$hook_extra_icon$"
 pam_reaffirm_doctrine_interaction_desc: "Potwierdź [Concept('doctrine', 'doktrynę')|E] swojego [Concept('rite', 'obrządku')|E] przed osobą znaną jako [recipient.GetShortUINameNotMe], nakłaniając tę osobę do zastąpienia nią dotychczasowej doktryny w obrządku, którym jest [recipient.GetRite.GetName|l]"
