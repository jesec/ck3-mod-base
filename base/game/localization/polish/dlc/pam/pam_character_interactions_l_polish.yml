 ecclesiastic_incite_claim_war_interaction_toast: "Sfinansowano wojnę o roszczenia"
 ecclesiastic_incite_claim_war_interaction_attacker_toast: "Wypowiedziano wojnę o roszczenia"
 ecclesiastic_incite_claim_war_interaction_defender_toast: "Wypowiedziano wojnę o roszczenia przeciwko tobie"
 no_valid_sponsored_claim_war_attacker_tt: "[recipient.GetShortUINameNotMe] musi posiadać [title|El], do którego prawo rości sobie odpowiednio silny [ruler|El] świecki wyznający wiarę o nazwie [actor.GetFaith.GetName|l] #bold bez#! zablokowanej możliwości wypowiedzenia [Concept('war', 'wojny')|E] przez żaden z poniższych czynników:\n$EFFECT_LIST_BULLET$Posiadanie [Concept('debt', 'długu')|E]\n$EFFECT_LIST_BULLET$Posiadanie cechy [GetTrait('incapable').GetName( recipient )|l]\n$EFFECT_LIST_BULLET$Bycie postacią [Concept('nomadic', 'koczowniczą')|E]\n$EFFECT_LIST_BULLET$Bycie postacią [Concept('celestial', 'niebiańską')|E]\n$EFFECT_LIST_BULLET$Bycie postacią [Concept('ecclesiastical', 'kościelną')|E] lub [Concept('theocratic', 'teokratyczną')|E]\n$EFFECT_LIST_BULLET$[alliance|E] lub [truce|El] z osobą znaną jako [recipient.GetShortUINameNotMe]\n$EFFECT_LIST_BULLET$Bycie [Concept('tributary', 'trybutariuszem')|E] lub [Concept('puppet', 'marionetką')|E] osoby znanej jako [recipient.GetShortUINameNotMe]\n$EFFECT_LIST_BULLET$Podleganie [Concept('liege', 'seniorowi')|E], który toczy już [Concept('war', 'wojnę')|E] z osobą znaną jako [recipient.GetShortUINameNotMe]"
 sponsored_claim_war_attacker_must_have_claim_tt: "[secondary_recipient.GetShortUINameNotMe] musi posiadać [claim|El] dotyczące następującego miejsca: [target.GetName]"
 sponsored_claim_war_someone_must_have_claim_tt: "Odpowiedni [claimant|El] musi posiadać [claim|El] dotyczące następującego miejsca: [target.GetName]"
 sponsored_claim_war_target_must_be_held_by_recipient_tt: "Obszar o nazwie [target.GetName] musi być w posiadaniu osoby znanej jako [recipient.GetShortUINameNotMe] lub jej [Concept('vassals', 'wasali')|E]"
 incite_claim_war_use_on_liege_tt: "[recipient.GetShortUINameNotMe] nie jest postacią [Concept('independent', 'niezależną')|E]. Użyj tej [interaction|El] wobec [recipient.GetHerHis] [Concept('liege', 'seniora')|E], którym jest [recipient.GetLiege.GetShortUINameNotMe]"
 incite_claim_war_attacker_must_share_faith_tt: "Postać musi wyznawać tę samą [Concept('faith', 'wiarę')|E] co [actor.GetShortUINameNotMe]"
 incite_claim_war_attacker_must_be_landed_count_tt: "Postać musi być [Concept('ruler', 'władcą')|E] z ziemią o randze co najmniej [Concept('county', 'hrabstwa')|E]"
 incite_claim_war_attacker_must_not_be_at_war_tt: "Postać nie może prowadzić [Concept('war', 'wojny')|E]"
 not_incite_claim_war_attacker_must_not_be_at_war_tt_third: "[CHARACTER.GetShortUINameNotMe] bierze udział w [Concept('war', 'wojnie')|E]"
 incite_claim_war_attacker_must_not_be_in_debt_tt: "Postać nie może mieć [Concept('debt', 'długu')|E]"
 incite_claim_war_attacker_must_be_strong_enough_tt: "Postać musi wykazywać siłę wojskową na poziomie co najmniej jednej dziesiątej siły osoby znanej jako [recipient.GetShortUINameNotMe]"
 incite_claim_war_attacker_must_be_secular_tt: "Nie może to być postać [Concept('nomadic', 'koczownicza')|E], [celestial|El], [Concept('theocratic', 'teokratyczna')|E], [Concept('ecclesiastical', 'kościelna')|E] ani [landless_adventurer|El]"
 incite_claim_war_attacker_must_not_be_blocked_diplomacy_tt: "Postać nie może być [allied|El] z osobą znaną jako [recipient.GetShortUINameNotMe], nie może mieć z [recipient.Custom('PL_nim_nia')] zawartego [Concept('truce', 'rozejmu')|E], nie może być [recipient.Custom('PL_jego_jej')] [Concept('tributary', 'trybutariuszem')|E] ani [Concept('vassal', 'wasalem')|E], ani nie może z [recipient.Custom('PL_nim_nia')] dzielić [Concept('realm', 'państwa')|E]"
 incite_claim_war_attacker_liege_not_at_war_tt: "[liege|E] tej postaci nie może prowadzić [Concept('war', 'wojny')|E] z osobą znaną jako [recipient.GetShortUINameNotMe]"
 incite_claim_war_attacker_must_have_claim_on_recipient_tt: "Postać musi posiadać [claim|El] względem [Concept('title', 'tytułu')|E] należącego do osoby znanej jako [recipient.GetShortUINameNotMe] lub [recipient.GetHerHis] [Concept('vassal', 'wasala')|E]"
 incite_claim_war_attacker_must_have_claim_on_target_tt: "Postać musi posiadać [claim|El] dotyczące następującego miejsca: [target.GetName]"
 interaction_claim_war_attacked_tt: "Postać jest atakowana przez osobę znaną jako [secondary_recipient.GetShortUINameNotMe] w [Concept('war', 'wojnie')|E] o jej [claim|El] dotyczące następującego miejsca: [target.GetName]"
 interaction_claim_war_attacker_tt: "[secondary_recipient.GetShortUINameNotMe] atakuje osobę znaną jako [recipient.GetShortUINameNotMe] w celu wysunięcia [Concept('claim', 'roszczenia')|E] dotyczącego następującego miejsca: [target.GetName]"
