 clergy_transfer_instant_accept_piety_legitimacy_tt: "#Weak #EMP #bold Zaakceptuje#! tę [Concept('interaction', 'interakcję')|E] ze względu na @piety_icon! [piety_level|El] wynoszący #N 0#! oraz @legitimacy_icon! [legitimacy_level|El] wynoszący #N 0#!#!#!"
