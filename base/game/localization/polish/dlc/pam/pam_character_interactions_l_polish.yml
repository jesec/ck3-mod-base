 spiritual_counsel_interaction_desc: "Zaoferuj osobie, którą jest [recipient.GetShortUINameNotMe], prywatną poradę: mądre słowo lub wysłuchanie wyznania w zamian za [hook_i] [Concept('hook', 'haka')|E]."
 spiritual_counsel_notification_text: "Usiądź ze mną na chwilę, moje dziecko. Podziel się ze mną swoimi troskami, a ja pomogę ci wrócić do łask [actor.GetFaith.HighGodNamePossessive]."
