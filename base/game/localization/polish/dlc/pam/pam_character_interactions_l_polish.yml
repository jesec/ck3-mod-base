 demand_divorce_interaction_desc: "Niech na twoje żądanie [recipient.GetTitledFirstName] odprawi małżonka, z którym małżeństwo obraża [Concept('faith', 'wiarę')|E] – lub niech przynajmniej stworzy takie pozory."
 demand_divorce_prompt: "Wybierz małżonka do odprawienia"
