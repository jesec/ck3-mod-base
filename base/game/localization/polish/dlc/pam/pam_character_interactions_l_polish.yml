 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName], spotkała Cię tak wielka strata!"
 pam_interactions_events.0020_threatened: "Powstrzymaj sankcje, podłą krytykę i nikczemną siłę, którą chcesz skierować przeciwko domom modlitwy, którymi są [secondary_recipient.GetFaith.HouseOfWorshipPlural], gdzie wyznawana jest wiara [secondary_recipient.GetFaith.GetReligion.GetAdjective|l]! W nadchodzących dniach przyda Ci się Twoja straszliwa determinacja – albowiem roszczenie o miejsce znane jako [target.GetNameNoTier] należy do Ciebie."
 pam_interactions_events.0020_offer_hook: "Twoja obietnica, by faworyzować osobę, którą jest [secondary_recipient.GetPrimaryTitle.GetNameNoTier], skłoniła mnie do działania, dzięki czemu udało mi się odkryć Twoje od dawna zapominane prawo – roszczenie do miejsca znanego jako [target.GetNameNoTier]!"
 pam_interactions_events.0020_indebted: "Jako [secondary_recipient.GetFaith.PriestNeuter|l] mam u Ciebie dług i dlatego w toku poszukiwań udało mi się znaleźć niepodważalny dowód, że [target.GetNameNoTier] to miejsce, które zgodnie z prawem należy do Twojej linii, a tego tytułu Ci odmawiano!"
 pam_interactions_events.0020: "Możesz wysunąć roszczenie do miejsca znanego jako [target.GetNameNoTier] – to pradawne prawo ustanowione przez boską opatrzność! Twoja rada otrzymała ode mnie stosowne dowody."
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal] nie ucieszy się z tej wiadomości, ale sprzeciw szarlatana nie spotka się z akceptacją [secondary_recipient.GetFaith.FateGodNamePossessive]."
 pam_interactions_events.0020.a.low_zeal: "I tak historia zostaje napisana na nowo…"
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip] to miejsce, które należy do mnie z mocy świętego prawa!"
 pam_interactions_events.0020.a: "Moje roszczenie zostało wysunięte, niech [recipient.GetTitledFirstNameNoTooltip] idzie do diabła."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUINameNotMe] przyznaje osobie, którą jest [puppet_or_actor.GetShortUINameNotMe], roszczenie do tytułu miejsca znanego jako [target.GetNameNoTier]"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "Wasza Czcigodność!"
 pam_interactions_events.0021: "Jeśli byłoby Ci pisane rządzić miejscem znanym jako [target.GetNameNoTier], czy nie byłby to dar [secondary_recipient.GetFaith.HighGodNamePossessive] otrzymany przy urodzeniu?\n\nNie, nie obrażę kogoś takiego jak [recipient.GetTitledFirstNameRegnal] – i nie zdradzę śmiertelnych dusz, zarówno mojej, jak i Twojej – spisując fałszywe słowa na poparcie Twojej nikczemnej sprawy.\n\nRozważ swoje błędy na modlitwie."
 pam_interactions_events.0021.a: "Mury domu modlitwy, którym jest [secondary_recipient.GetFaith.HouseOfWorship], dają [secondary_recipient.Custom('PL_mu_jej')] odwagę, której pożałuje!"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUINameNotMe] odrzuca prośbę o nadanie roszczenia do tytułu miejsca o nazwie [target.GetNameNoTier] wystosowanego przez osobę znaną jako [puppet_or_actor.GetShortUINameNotMe]"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "Czcigodny strażniku mojego dziedzictwa!"
 pam_interactions_events.0022_shrimp: "Choć mój tytuł to zaledwie [actor.GetTitleAsName], [secondary_recipient.GetFaith.AltPriestTermPlural|l], których religią jest wiara [actor.GetFaith.GetAdjective|l], chwalą się odkryciem, że w mojej krwi płynie pradawne roszczenie do całych ziem znanych jako [target.GetName]."
 pam_interactions_events.0022_shark: "[target.GetName] należy do tytułów, które z woli [actor.GetFaith.HighGodNamePossessive] dzierży moja [actor.Custom('GetTitleTierAdjective')|l] linia. Zawsze tak było, choć do teraz nie było to wiadome."
 pam_interactions_events.0022: "Wśród uczonych od dawna wiadomo – a ostatnio zostało to potwierdzone – że [target.GetName] to miejsce, do którego mogę zgodnie z prawem wysunąć roszczenie."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal] udziela błogosławieństwa mojemu roszczeniu. Mam całkowite poparcie na ziemiach o nazwie [secondary_recipient.GetPrimaryTitle.GetName].\n\nDlatego zaczynam mieć nadzieję i modlić się, by pewnego dnia objąć władzę nad całym terenem znanym jako [target.GetNameNoTierNoTooltip]…"
 pam_interactions_events.0022.a: "Kłamstwa! To fałszywe roszczenie, które popiera [secondary_recipient.GetFaith.PriestNeuter|l] bez krzty uczciwości!"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "Wasza Czcigodność!"
 pam_interactions_events.0023_shrimp: "Gdyby przysługiwało mi uzasadnione roszczenie, czy moje rządy nad miejscem znanym jako [target.GetName] nie byłyby bardziej cnotliwe niż te, które sprawuje ta kanalia, [recipient.GetFirstNameRegnal]? Proszę, niech światło [actor.GetFaith.HighGodNamePossessive] rozjaśni drogę, którą skromnie kroczę."
 pam_interactions_events.0023_shark: "Z woli [actor.GetFaith.HighGodNamePossessive] władam już różnymi ziemiami i chronię ich ludy. Mimo to miejsce znane jako [target.GetName] znajduje się poza granicami mojego państwa i wykracza poza moje prawa."
 pam_interactions_events.0023: "Wśród wiernych panuje zamieszanie. Niektórzy przekonują mnie do zgłoszenia roszczeń do miejsca znanego jako [target.GetName], natomiast inni twierdzą, że nie mam praw do tego tytułu."
 pam_interactions_events.0023_end: "\n\nZ pewnością ktoś tak uczony jak ty #EMP odkryje#! konieczny dowód w historycznych zapiskach… i zapewni mi prawowite roszczenie do miejsca znanego jako [target.GetNameNoTierNoTooltip], prawda?"
 pam_interactions_events.0023.a: "Niech miejsce znane jako [target.GetNameNoTierNoTooltip] będzie twoje, moje dziecko."
 pam_interactions_events.0023.b: "To niewłaściwe, że [secondary_recipient.GetTitleAsNameNoTooltip] szerzy kłamstwa."
