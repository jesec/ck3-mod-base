 ecclesiastic_incite_holy_war_christian_phase_tt: "[the_christian_church|E] musi być w [Concept('the_christian_church_chapter_short', 'epoce')|E] „Nawrócenie” lub „Krucjata”"
 ecclesiastic_incite_claim_war_interaction: "Namów do wojny o roszczenia"
 ecclesiastic_incite_claim_war_interaction_notification: "Wypełniając wolę [actor.GetFaith.HighGodNamePossessive], [secondary_recipient.GetShortUINameNotMe] musi dochodzić swojego [Concept('claim', 'roszczenia')|E] dotyczącego miejsca znanego jako [target.GetName] przeciwko osobie, którą jest [recipient.GetShortUINameNotMe]."
