 petition_antipope_gold_interaction_notification: "Gdy inni uginają kark przed pretendentem, ja niezłomnie trwam przy twojej sprawie – lecz w czasach takich jak te lojalność sporo kosztuje. Otwórz przede mną swoją kasę, a moja wierność nigdy się nie zachwieje."
