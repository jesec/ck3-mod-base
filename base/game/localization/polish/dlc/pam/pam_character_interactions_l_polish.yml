 pam_clergy_land_possible_success_tt: "@warning_icon! #X #bold Osobę, którą jest [recipient.GetShortUINameNotMe], trzeba przekonywać, ale i tak może odmówić tej [Concept('interaction', 'interakcji')|E]#!#!"
