 pam_possible_negotiate_land_relation_tt: "Niszczenie pozytywnych [Concept('relations', 'relacji')|E], utrata [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] oraz zostanie @rival_icon! [Concept('rivals', 'rywalami')|E]"
 pam_forced_negotiate_land_piety_level_1_tt: "Sprawienie, że [actor.GetShortUINameNotMe] straci #N 250#! pkt, a [recipient.GetShortUINameNotMe] #N 500#! pkt @piety_icon! [Concept('piety_experience', 'religijności')|E]"
 pam_forced_negotiate_land_piety_level_2_tt: "Sprawienie, że [actor.GetShortUINameNotMe] straci #N 500#! pkt @piety_icon! [Concept('piety_experience', 'religijności')|E], a [recipient.GetShortUINameNotMe] straci #N 1#! @piety_icon! [piety_level|El]"
 pam_possible_negotiate_land_piety_level_tt: "Sprawienie, że [actor.GetShortUINameNotMe] straci #N 1#!, a [recipient.GetShortUINameNotMe] straci #N 2#! @piety_icon! [piety_levels|El]"
 pam_forced_negotiate_land_legitimacy_level_1_tt: "Sprawienie, że [actor.GetShortUINameNotMe] straci #N 100#! pkt, a [recipient.GetShortUINameNotMe] straci #N 200#! pkt @legitimacy_icon! [Concept('legitimacy', 'legitymacji')|E]"
 pam_forced_negotiate_land_legitimacy_level_2_tt: "Sprawienie, że [actor.GetShortUINameNotMe] straci #N 200#! pkt @legitimacy_icon! [Concept('legitimacy', 'legitymacji')|E], a [recipient.GetShortUINameNotMe] straci #N 1#! @legitimacy_icon! [legitimacy_level|El]"
 pam_possible_negotiate_land_legitimacy_level_tt: "Sprawienie, że [actor.GetShortUINameNotMe] straci #N 1#!, a [recipient.GetShortUINameNotMe] straci #N 2#! @legitimacy_icon! [legitimacy_levels|El]"
 pam_forced_negotiate_land_gold_tt: "Zapłacenie #N [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! szt. @gold_icon! [Concept('gold', 'złota')|E] osobie, którą jest [recipient.GetShortUINameNotMe]"
