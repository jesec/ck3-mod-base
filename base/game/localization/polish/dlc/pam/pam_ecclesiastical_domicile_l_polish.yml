 #Interaction reference tooltips
 pam_estate_interaction_tt_demand_child_as_monk_interaction: "Zażądaj, aby ktoś przekazał [child|El], potomka lub niepełnoletniego [Concept('courtier', 'dworzanina')|E] będącego pod jego opieką jako [GetTrait('devoted').GetName( GetNullCharacter )|l], co uniemożliwi przekazanej osobie [Concept('succession', 'sukcesję')|E] i sprawi, że zostanie ona twoim [Concept('courtier', 'dworzaninem')|E]."
 pam_estate_interaction_tt_demand_church_succession_interaction: "Jeśli ktoś odejdzie z tego świata bez prawowitego dziedzica, jego ziemie trafią do mnie, [Concept('fallback_heir', 'dziedzica zastępczego')|E]."
 pam_estate_interaction_tt_demand_divorce_interaction: "Niech na twoje żądanie wybrana osoba odprawi małżonka, z którym małżeństwo obraża [Concept('faith', 'wiarę')|E] – lub niech przynajmniej stworzy takie pozory."
 pam_estate_interaction_tt_ecclesiastic_consecrate_kingdom_interaction: "Utwórz dla kogoś nowe [kingdom|El], w zamian zyskując [Concept('hook', 'haka')|E]"
 pam_estate_interaction_tt_ecclesiastical_bestow_title_interaction: "Używając swojego autorytetu duchowego, przyznaj obecnie nieutworzony [title|El] bezpośrednio wybranej osobie, potencjalnie podnosząc jej [Concept('rank', 'rangę')|E]"
 pam_estate_interaction_tt_influence_papal_vote_interaction: "Wywrzyj nacisk na wybraną osobę, aby jej [cardinal|El] oddał swój głos na wybranego przez ciebie kandydata"
 pam_estate_interaction_tt_pam_evangelize_personal_tenet_interaction: "Nauczaj wybraną osobę swojego [Concept('personal_tenet', 'dogmatu osobistego')|E], nakłaniając ją do przyjęcia go jako własnego"
 pam_estate_interaction_tt_request_clerical_chastity_interaction: "Domagaj się, aby wybrana osoba złożyła śluby czystości przed obliczem [GetPlayer.GetFaith.HighGodNamePossessive]. Jeśli się zgodzi, otrzyma długotrwałą karę do [Concept('fertility', 'płodności')|E] i nie będzie mogła uwodzić ani inicjować zalotów, aż przysięga dobiegnie końca lub osoba ta się jej zrzeknie."
 pam_estate_interaction_tt_request_ecclesiastical_treasury_interaction: "[GetPlayer.GetPlayerInteractionTooltip('request_ecclesiastical_treasury_interaction')]"
 pam_estate_interaction_tt_request_realm_priest_replacement_interaction: "[GetPlayer.GetPlayerInteractionTooltip('request_realm_priest_replacement_interaction')]"
 pam_estate_interaction_tt_spiritual_counsel_interaction: "Zaoferuj komuś prywatną poradę: mądre słowo lub wysłuchanie wyznania w zamian za [hook_i] [Concept('hook', 'haka')|E]."
 pam_estate_interaction_tt_take_monastic_vows_interaction: "Poproś kogoś o dołączenie do [Concept('monastic_holy_order', 'zakonu monastycznego')|E]"
 pam_estate_interaction_tt_take_vows_interaction: "Poproś kogoś o złożenie ślubów i wstąpienie do duchowieństwa"
 pam_estate_interaction_tt_sway_ruler_to_my_rite_interaction: "Namów kogoś do przyjęcia twojego [Concept('rite', 'obrządku')|E]"
