l_polish:
 game_concept_puppet: "Marionetka"
 game_concept_puppets: "Marionetki"
 game_concept_puppeted: "Zmieniony w marionetkę"
 game_concept_puppeting: "Marionetkowanie"
 game_concept_puppet_type: "Rodzaj marionetki"
 game_concept_puppet_types: "Rodzaje marionetek"
 game_concept_puppet_type_desc: "[puppet|E] zawsze należy do konkretnego rodzaju, który wpływa na to, jakie działania może ona podejmować w twoim imieniu.\n\nChoć większość działań specjalnych jest wspólna dla wszystkich marionetek, to każdy ich rodzaj ma także własne, unikalne działania.\n\nNa przykład [clerical_puppet|El] może [excommunicate|El] kogoś w twoim imieniu, a [Concept('external_ruler_puppet', 'marionetkowego władcę świeckiego')|E] można zmusić do uwolnienia [Concept('tributary', 'trybutariusza')|E] lub wzięcia rozwodu z [Concept('spouse', 'małżonkiem')|E].\n\nMożesz mieć tylko po jednej marionetce danego rodzaju."
 game_concept_puppet_desc: "Marionetka to [character|El] znajdująca się pod kontrolą [Concept('puppeteer', 'marionetkarza')|E], który może podejmować specjalne działania za jej pośrednictwem.\n\nDziałanie za pośrednictwem marionetki otwiera drzwi, które w przeciwnym razie pozostałyby zamknięte: [clerical_puppet|El] może ubiegać się o [clerical_titles|El] lub [Concept('excommunication', 'ekskomunikę')|E] w twoim imieniu, zaś [Concept('external_ruler_puppet', 'marionetkowego władcę świeckiego')|E] można zmusić do uwolnienia [Concept('tributaries', 'trybutariuszy')|E], przyznania niepodległości lub wzięcia rozwodu z [Concept('spouse', 'małżonkiem')|E].\n\nDostępne działania zależą od [Concept('puppet_type', 'rodzaju marionetki')|E]."
 game_concept_puppeteer: "Marionetkarz"
 game_concept_puppeteers: "Marionetkarze"
 game_concept_puppeteer_possessive: "Marionetkarza"
 game_concept_puppeteers_possessive: "Marionetkarzy"
 game_concept_puppeteer_desc: "Marionetkarz to [character|El] sprawująca kontrolę nad jedną lub kilkoma [Concept('puppets', 'marionetkami')|E].\n\nDziałając za pośrednictwem swoich marionetek, marionetkarz zyskuje władzę niewynikającą z jego własnej pozycji – taką jak wpływy [Concept('clergy', 'duchowieństwa')|E] lub autorytet innego [Concept('realm', 'państwa')|E]."
 game_concept_clerical_puppet: "Marionetkowy kapłan koronny"
 game_concept_clerical_puppets: "Marionetkowi kapłani koronni"
 game_concept_clerical_puppet_desc: "[realm_priest|E] będący [Concept('puppet', 'marionetką')|E] swojego [Concept('liege', 'seniora')|E].\n\nZa jego pośrednictwem marionetkarz może ingerować w sprawy [Concept('faith', 'wiary')|E]: ubiegać się u [Concept('head_of_faith', 'głowy wiary')|E] o [clerical_titles|El] lub [Concept('excommunication', 'ekskomunikę')|E], zarządzać [Concept('holy_sites', 'miejscami świętymi')|E], ustanowić nowy [rite|El] lub zwołać [ecumenical_council|El]."
 game_concept_external_clerical_puppet: "Marionetkowy władca duchowny"
 game_concept_external_clerical_puppets: "Marionetkowi władcy duchowni"
 game_concept_external_clerical_puppet_desc: "Wpływowy członek [Concept('clergy', 'duchowieństwa')|E] – [archbishop|El] lub nawet [head_of_faith|El] – który stał się [Concept('puppet', 'marionetką')|E] innego [Concept('ruler', 'władcy')|E].\n\nIm potężniejszy duchowny, tym większy zasięg wpływów: zmarionetkowana głowa wiary może [Concept('excommunicate', 'ekskomunikować')|E] twoich wrogów, mianować [Concept('cardinals', 'kardynałów')|E], [Concept('pressed_claim', 'wysuwać roszczenie')|E] lub rozpętać [Concept('holy_war', 'świętą wojnę')|E] w twoim imieniu."
 game_concept_external_ruler_puppet: "Marionetkowy władca świecki"
 game_concept_external_ruler_puppets: "Marionetkowi władcy świeccy"
 game_concept_external_ruler_puppet_desc: "[ruler|E] nienależący do [Concept('clergy', 'duchowieństwa')|E], który stał się [Concept('puppet', 'marionetką')|E] innej [Concept('character', 'postaci')|E].\n\nZa pośrednictwem tej marionetki możesz wpływać na sprawy innych [Concept('realms', 'państw')|E], przykładowo sięgając po [schemes|El] lub [Concept('imprisonment', 'uwięzienie')|E].\n\n\nZyskanie marionetki tego rodzaju wymaga [Concept('interaction', 'interakcji')|E] „#V $make_external_ruler_puppet_interaction$#!”. Odblokowujesz ją, gdy spełniony jest przynajmniej jeden z poniższych warunków:\n$BULLET_WITH_TAB$Jesteś [Concept('vassal', 'wasalem')|E] celu i należysz do [Concept('clergy', 'duchowieństwa')|E]\n$BULLET_WITH_TAB$Masz cechę [GetTrait('seducer').GetName( GetNullCharacter )|l], a cel to twój [lover|El] albo twoja [soulmate|El], jeśli ma rangę [Concept('king', 'króla')|E] lub wyższą\n$BULLET_WITH_TAB$Masz cechę [GetTrait('torturer').GetName( GetNullCharacter )|l] i przetrzymujesz cel w [Concept('dungeon', 'lochu')|E]\n$BULLET_WITH_TAB$Masz cechę [GetTrait('family_first').GetName( GetNullCharacter )|l], a cel to twoja [close_family|El]\n$BULLET_WITH_TAB$Masz cechę [GetTrait('diplomat').GetName( GetNullCharacter )|l], a cel to [independent_ruler|El]\n$BULLET_WITH_TAB$Masz cechę [GetTrait('gallant').GetName( GetNullCharacter )|l], a cel to twój [spouse|El]\n$BULLET_WITH_TAB$Jesteś [Concept('diarch', 'koregentem')|E] celu w [Concept('entrenched_regency', 'zakorzenionej regencji')|E]"
 game_concept_ecumenical_council: "Sobór powszechny"
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$ to [activity|El], w której najwyżsi rangą przedstawiciele [Concept('clergy', 'duchowieństwa')|E] z całego chrześcijaństwa gromadzą się, by zdecydować o przyszłości Kościoła.\n\nW toku kolejnych debat zebrani prałaci rozstrzygają o [Concept('tenet_status', 'statusie')|E] kwestionowanych [Concept('core_tenets', 'dogmatów')|E] – ogłaszając je jako [Concept('permitted_tenet_status', 'dozwolone')|E] lub [Concept('prohibited_tenet_status', 'zakazane')|E], bądź też wynosząc je do rangi [Concept('core_tenet_status', 'fundamentalnych')|E] – oraz ustalają [doctrines|El] [Concept('faith', 'wiary')|E]."
 game_concept_ecumenical_councils: "Sobory powszechne"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "Schizma"
 game_concept_schism_desc: "Wielka schizma to moment, w którym zjednoczona w ramach chrześcijaństwa [faith|El] rozpada się w ramach swoich rzymskich i greckich [Concept('rites', 'obrządków')|E], dzieląc się na katolicyzm i prawosławie.\n\nZagrożenie pojawia się, gdy [situation|El] [Concept('the_christian_church', 'Kościoła chrześcijańskiego')|E] wkracza w określone [the_christian_church_chapters_short|El], a władcy w całym świecie chrześcijańskim muszą opowiedzieć się po jednej ze stron. Jeśli podziały te nie zostaną zażegnane – lub strony nie zostaną rozdzielone siłą – za pomocą [Concept('decisions', 'decyzji')|E], rozłam staje się trwały wraz z końcem epoki."
 game_concept_schisms: "Schizmy"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "Tytuł duchowny"
 game_concept_clerical_titles: "Tytuły duchowne"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ to [title|El] [ecclesiastical|El] będący w posiadaniu członka [Concept('clergy', 'duchowieństwa')|E], który zarządza [Concept('clerical_region', 'regionem duchownym')|E] w obrębie danej [Concept('faith', 'wiary')|E]. W przypadku wiar [Concept('christian', 'chrześcijańskich')|E] takim tytułem jest [archdiocese|El].\n\nJego posiadaczem jest [religious_superior|El] [Concept('clergy', 'duchowieństwa')|E] w regionie, który zwykle otrzymuje tytuł od [Concept('head_of_faith', 'głowy wiary')|E]."
 game_concept_the_christian_church: "Kościół chrześcijański"
 game_concept_the_christian_church_desc: "Kościół chrześcijański to instytucja kościelna nadzorująca i prowadząca wyznawców Jezusa Chrystusa, przedstawiona jako [situation|El] rozwijająca się w ciągu sekwencji [Concept('the_christian_church_chapters_short', 'epok')|E].\n\nJej granice obejmują każdą [Concept('archdiocese', 'archidiecezję')|E] na świecie. Każdy [ruler|El] [christian|El] o randze co najmniej [Concept('county', 'hrabstwa')|E], którego jakakolwiek część [Concept('realm', 'państwa')|E] znajduje się na terenie archidiecezji, jest uznawany za członka niezależnie od tego, czy jest władcą duchownym czy świeckim."
 game_concept_christendom: "Wspólnota państw chrześcijańskich"
 game_concept_christendom_desc: "$game_concept_christendom$ obejmuje [Concept('realm', 'państwa')|E] wszystkich [Concept('independent', 'niezależnych')|E] [Concept('ruler', 'władców')|E] [Concept('christian', 'chrześcijan')|E], którzy są członkami [Concept('situation', 'sytuacji')|E] „[the_christian_church|E]”."
 game_concept_christian: "Chrześcijanin"
 game_concept_christians: "Chrześcijanie"
 game_concept_christian_possessive: "Chrześcijanina"
 game_concept_christian_desc: "Wyznawca [Concept('religion', 'religii')|E] chrześcijańskiej."
 game_concept_papal_bull: "Bulla papieska"
 game_concept_papal_bulls: "Bulle papieskie"
 game_concept_bull: "Bulla"
 game_concept_bulls: "Bulle"
 game_concept_papal_bull_desc: "Bulla papieska to uroczysty dekret wydawany przez [Concept('head_of_faith', 'głowę')|E] [Concept('faith', 'wiary')|E] [Concept('christian', 'chrześcijańskiej')|E], w którym wolę autora pieczętuje pełny autorytet [Concept('the_christian_church', 'Kościoła chrześcijańskiego')|E], nadając jej moc prawną.\n\nBullę może wydać [head_of_faith|El] chrześcijańskiej posiadająca wystarczający [church_authority|El] poprzez [Concept('decision', 'decyzję')|E] „[GetDecisionWithKey('enact_a_bull_decision').GetName]”, wydając [piety|El] na:\n\n$EFFECT_LIST_BULLET$Wezwanie do [Concept('great_holy_war', 'wielkiej świętej wojny')|E]\n$EFFECT_LIST_BULLET$Potępienie [Concept('rite', 'obrządku')|E], uznając go za [Concept('heresy', 'herezję')|E]\n$EFFECT_LIST_BULLET$Ogłoszenie [Concept('core_tenet', 'dogmatu')|E] [Concept('permitted_tenet_status', 'dozwolonym')|E] lub [Concept('prohibited_tenet_status', 'zakazanym')|E]"
 game_concept_situation_the_christian_church_phase: "Epoka Kościoła chrześcijańskiego"
 game_concept_the_christian_church_chapter_short: "Epoka"
 game_concept_the_christian_church_chapters_short: "Epoki"
 game_concept_situation_the_christian_church_phases: "Epoki Kościoła chrześcijańskiego"
 game_concept_situation_the_christian_church_phase_desc: "Epoki to [situation_phases|El] „[the_christian_church|E]”. Łącznie jest ich siedem i podzielone są na cztery [Concept('the_christian_church_chapter_types', 'rodzaje epok')|E]."
 game_concept_the_christian_church_chapter_type: "Rodzaj epoki"
 game_concept_the_christian_church_chapter_types: "Rodzaje epoki"
 game_concept_the_christian_church_chapter_type_desc: "W [Concept('the_christian_church', 'Kościele chrześcijańskim')|E] wyróżnia się cztery rodzaje epok, które porządkują [situation_the_christian_church_phases|El].\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|El], [the_christian_church_crisis_short|El], [the_christian_church_zeal_short|El], and [the_christian_church_stability_short|El]"
 game_concept_the_christian_church_unstable: "Epoka destabilizacji"
 game_concept_the_christian_church_unstable_short: "Destabilizacja"
 game_concept_the_christian_church_unstable_desc: "#high $game_concept_the_christian_church_unstable$#! w [Concept('the_christian_church', 'Kościele chrześcijańskim')|E] to okres, w którym posłuszeństwo słabnie:\n\n[Concept('rulers', 'Władców')|E] łatwiej przekonać do przyjęcia innego [Concept('rite', 'obrządku')|E], częściej nakładane są ekskomuniki, a [gold|El] wydawane jest dla własnych korzyści.\n\nDo [Concept('the_christian_church_chapters_short', 'epok')|E] destabilizacji należą „#high $fragile_unity$#!” oraz „#high $reform_phase$#!”."
 game_concept_the_christian_church_zeal: "Epoka gorliwości"
 game_concept_the_christian_church_zeal_short: "Gorliwość"
 game_concept_the_christian_church_zeal_desc: "#high $game_concept_the_christian_church_zeal$#! rozpala ogień i kieruje go na zewnątrz:\n\nMoże dochodzić do masowych nawróceń, [great_holy_wars|El] są coraz powszechniejsze, [papal_bulls|El] wydawane są częściej, a nawrócenie na inną [Concept('faith', 'wiarę')|E] jest łatwiejsze.\n\nDo [Concept('the_christian_church_chapters_short', 'epok')|E] gorliwości należą #high „$conversion_phase$#!” oraz „#high $crusade_phase$#!”."
 game_concept_the_christian_church_stability: "Epoka stabilności"
 game_concept_the_christian_church_stability_short: "Stabilność"
 game_concept_the_christian_church_stability_desc: "#high $game_concept_the_christian_church_stability$#! to rzadka chwila spokoju w [Concept('the_christian_church', 'Kościele chrześcijańskim')|E]:\n\nBudowy w [Concept('temple_holding', 'posiadłościach świątynnych')|E] są tańsze, wielkie katedry powstają szybciej, [characters|El] częściej zyskują cechę [GetTrait('devoted').GetName( GetNullCharacter )|l], a wielka schizma może zostać zażegnana.\n\n„#high $concord$#!” to jedyna epoka stabilności."
 game_concept_the_christian_church_crisis: "Epoka kryzysu"
 game_concept_the_christian_church_crisis_short: "Kryzys"
 game_concept_the_christian_church_crisis_desc: "#high $game_concept_the_christian_church_crisis$#! to okres, w którym [the_christian_church|E] jest w najgorszej formie:\n\nOdpusty są tańsze, [ecumenical_councils|El] odbywają się częściej, [rulers|El] mogą mianować własnego [Concept('court_chaplain', 'nadwornego kapelana')|E], przedstawiciele [Concept('clergy', 'duchowieństwa')|E] mogą zawierać związki małżeńskie, [head_of_faith|El] może odmówić [Concept('anointment', 'namaszczenia')|E] gospodarzowi, a [taxes|El] mogą ulec obniżeniu.\n\nDo [Concept('the_christian_church_chapters_short', 'epok')|E] kryzysu należą „#high $saeculum_obscurum$#!” oraz „#high $investiture_crisis$#!”."
 game_concept_head_of_rite: "Głowa obrządku"
 game_concept_head_of_rite_desc: "Wiodąca [character|El] danego [Concept('rite', 'obrządku')|E]: [head_of_faith|El], jeśli sama go wyznaje; w przeciwnym razie właściciel [Concept('clerical_region', 'regionu duchownego')|E], w którym dany obrządek ma najwięcej zwolenników, a jeśli takiego brak – [ruler|El] rządzący największą liczbą [Concept('counties', 'hrabstw')|E] [rite_possessive|El].\n\nTylko głowa [rite_possessive|El] może modyfikować jego [core_tenets|El] i [doctrines|El], i to właśnie ten zwierzchnik przemawia w imieniu swojego stada, gdy Kościół zbliża się do [Concept('schism', 'schizmy')|E]."
 game_concept_ecclesiastical: "Kościelny"
 game_concept_ecclesiastical_government: "Rząd kościelny"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "Rząd kościelny to [Concept('theocratic', 'teokratyczna')|E] [government_form|El] kontrolowana przez [Concept('christian', 'chrześcijańskich')|E] [Concept('rulers', 'władców')|E] [Concept('clergy', 'duchownych')|E], takich jak [bishops|El] i [archbishops|El].\n\nWiększość władców kościelnych to [vassals|El] teokratyczni, którzy biorą w [Concept('lease', 'dzierżawę')|E] [temple_holdings|El] od [Concept('liege', 'seniora')|E] świeckiego i podlegają [Concept('head_of_faith', 'głowie wiary')|E], ale [bishop|El] posiadający [titles|El] [landed|El], które nie są [leased|El], może rządzić jako [independent|El] [ruler|El] kościelny na własną rękę. Władza, jaką taki władca posiada nad swoimi [Concept('vassals', 'wasalami')|E], jest ustalana przez jego [church_authority|El]."
 game_concept_lease_contract: "Umowa dzierżawy"
 game_concept_lease_contract_desc: "Warunki prawne, zgodnie z którymi postać [Concept('leasing', 'dzierżawi')|E] tytuł. Określa również [Concept('religious_superior', 'zwierzchnika religijnego')|E] danej postaci."
 game_concept_church_obligations: "Zobowiązania Kościoła"
 game_concept_church_obligations_desc: "Zobowiązania Kościoła określają łączny wymiar zobowiązań z dochodu [Concept('church_holding', 'posiadłości kościelnej')|E]. Zobowiązania te są wypłacane [Concept('superior', 'zwierzchnikowi')|E], [Concept('head_of_faith', 'głowie wiary')|E] i/lub miejscowemu [Concept('ruler', 'władcy')|E] świeckiemu. Przykładem są [church_centralization|El] oraz [secular_obligations|El]."
 game_concept_church_centralization: "Centralizacja Kościoła"
 game_concept_minimal_centralization: "Minimalna centralizacja"
 game_concept_mild_centralization: "Umiarkowana centralizacja"
 game_concept_strong_centralization: "Silna centralizacja"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$ określa stopień, w jakim Kościół przyjął scentralizowaną władzę oraz struktury finansowe. Silniejsza centralizacja oznacza, że większa część dochodów płynie w górę hierarchii duchownej.\n\nOto poszczególne typy:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "Zobowiązania świeckie"
 game_concept_personal_obligations: "Zobowiązania osobiste"
 game_concept_fixed_obligations: "Zobowiązania stałe"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$ określają sposób ustalania, jaka część dochodów z [Concept('church_holdings', 'posiadłości kościelnych')|E] należy do lokalnego [Concept('secular_ruler', 'władcy świeckiego')|E].\n\nPoszczególne rodzaje to:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nW niektórych epokach władcy świeccy dodatkowo dysponują lokalną władzą nad Kościołem:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "Zwierzchnik religijny"
 game_concept_religious_superiors: "Zwierzchnicy religijni"
 game_concept_superior: "Zwierzchnik"
 game_concept_religious_superior_desc: "Zwierzchnik religijny to [character|El] posiadająca jurysdykcję religijną nad co najmniej jednym [Concept('subordinate', 'podwładnym')|E] duchowieństwem religijnym w hierarchicznej strukturze religijnej."
 game_concept_religious_subordinate: "Podwładny religijny"
 game_concept_religious_subordinates: "Podwładni religijni"
 game_concept_subordinate: "Podwładny"
 game_concept_subordinates: "Podwładni"
 game_concept_religious_subordinate_desc: "Podwładny religijny to [character|El] posiadająca [Concept('religious_superior', 'zwierzchnika religijnego')|E] w hierarchicznej strukturze religijnej."
 game_concept_clerical_region: "Region duchowny"
 game_concept_clerical_regions: "Regiony duchowne"
 game_concept_clerical_region_possessive: "Regionu duchownego"
 game_concept_clerical_regions_possessive: "Regionów duchownych"
 game_concept_clerical_region_desc: "Region duchowny jest regionem geograficznym, który podlega jurysdykcji [Concept('clerical_title', 'tytułu duchownego')|E]. Każdy członek duchowieństwa w tym regionie będzie [Concept('subordinate', 'podwładnym')|E] właściciela [Concept('title', 'tytułu')|E] związanego z tym regionem.\n\n[ruler|E] podlega temu regionowi duchownemu, w którym znajduje się [county|El] będące jego [Concept('capital', 'stolicą')|E], a nowy region powstaje w oparciu o [Concept('capital', 'stolicę')|E] [Concept('primary_title', 'tytułu głównego')|E] jego założyciela. Region duchowny może obejmować wiele [Concept('realms', 'państw')|E] i mieć podwładnych położonych w różnych państwach.\n\n$game_concept_ruler$ może jedynie posiadać jeden region duchowny w danym momencie. Jeśli otrzyma nowy region, zrzeknie się wszystkich posiadanych ziem w obrębie poprzedniego."
 game_concept_clerical_region_capital: "Stolica regionu duchownego"
 game_concept_clerical_region_capitals: "Stolice regionów duchownych"
 game_concept_clerical_region_capital_desc: "Stolica regionu duchownego to [county|El], w którym [clerical_region|El] został założony wraz z [Concept('ecclesiastical_estate', 'majątkiem kościelnym')|E], pełniąc funkcję siedziby [Concept('clerical_title', 'tytułu duchownego')|E], który zarządza regionem. W przeciwieństwie do [Concept('de_jure_capital', 'stolicy de iure')|E] jest ona na stałe przypisana do regionu i nie można jej przenieść."
 clerical_electors: "Elektorzy duchowni"
 game_concept_archdiocese: "Archidiecezja"
 game_concept_archdioceses: "Archidiecezje"
 game_concept_archdiocese_desc: "Archidiecezja to [Concept('christian', 'chrześcijańska')|E] forma [Concept('clerical_region', 'regionu duchownego')|E]. Jest to domena kościelna posiadana przez [Concept('archbishop', 'arcybiskupa')|E] na mocy jego [Concept('clerical_title', 'tytułu duchownego')|E], z siedzibą w [Concept('county', 'hrabstwie')|E] będącym stolicą, gdzie można wznieść [Concept('grand_cathedral', 'wielką katedrę')|E].\n\nW sprawach duchowych [ruler|El] [christian|El] odpowiada przed [Concept('archbishop', 'arcybiskupem')|E] archidiecezji, w której mieści się [county|El] będące [Concept('capital', 'stolicą')|E], a terytoria podlegające archidiecezjom wspólnie tworzą [Concept('situation', 'sytuację')|E] „[the_christian_church|E]”."
 game_concept_grand_cathedral: "Wielka katedra"
 game_concept_grand_cathedrals: "Wielkie katedry"
 game_concept_grand_cathedral_desc: "Wielka katedra to [great_building|El] wzniesiona w ramach [Concept('great_project', 'wspaniałego projektu')|E] w stolicy [Concept('archdiocese', 'archidiecezji')|E], siedzibie jej [Concept('archbishop', 'arcybiskupa')|E].\n\nWzniesienie pierwszej katedry jest wielkim przejawem pobożności: jej założyciel trwale otrzymuje [piety|El], [Concept('legitimacy', 'legitymację')|E] i [spiritual_fulfillment|El], a także dodatkowe miejsce na [personal_tenet|El] oraz stałą premię do [Concept('opinion', 'opinii')|E] w obrębie tej samej [Concept('faith', 'wiary')|E]. Gdy zostanie wzniesiona, przyciąga chrześcijańskich pielgrzymów z całej [Concept('christendom', 'wspólnoty państw chrześcijańskich')|E] i powiększa [cathedral_complex|El] właściciela. W przyszłości może zostać rozbudowana i może z niej powstać [GetBuilding('great_project_cathedral_02').GetName|Vl] lub [GetBuilding('great_project_cathedral_03').GetName|Vl]."
 game_concept_monastic_holy_order: "Zakon monastyczny"
 game_concept_monastic_holy_orders: "Zakony monastyczne"
 game_concept_monastic_holy_order_possessive: "Zakonu monastycznego"
 game_concept_monastic_holy_orders_possessive: "Zakonów monastycznych"
 game_concept_monastic: "Monastyczne"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "Zakon monastyczny to rodzaj [Concept('holy_order', 'zakonu rycerskiego')|E] poświęconego modlitwie, nauce oraz szerzeniu jednego [Concept('core_tenet', 'dogmatu')|E]. Taki zakon należy do [Concept('rite', 'obrządku')|E] swojego założyciela i oręduje za jednym z [Concept('core_tenets', 'dogmatów')|E] tego [rite_possessive|El], szerząc tę praktykę wśród wiernych.\n\nZakon prowadzony jest przez [Concept('archabbot', 'arcyopata')|E] i utrzymuje się z [Concept('temple_holdings', 'posiadłości świątynnych')|E] oraz [Concept('gold', 'złota')|E] przekazywanych przez [Concept('monastic_order_patrons', 'patronów zakonu monastycznego')|E]. W zamian zakon zapewnia [spiritual_fulfillment|El] i [piety|El].\n\nTaki zakon może założyć każdy [ruler|El], którego [faith|El] zezwala na monastycyzm, za pomocą [Concept('decision', 'decyzji')|E] #high „Załóż zakon monastyczny”#!."
 game_concept_monastic_order_patron: "Patron zakonu monastycznego"
 game_concept_monastic_order_patrons: "Patroni zakonu monastycznego"
 game_concept_monastic_order_patronize: "Sprawować patronat"
 game_concept_monastic_order_patronized: "Objęte patronatem"
 game_concept_monastic_order_patronage: "Patronat"
 game_concept_monastic_order_patron_desc: "Patron zakonu monastycznego to [ruler|El] [ecclesiastical|El] lub świecki na [Concept('title_tier', 'poziomie')|E] [Concept('duchy', 'księstwa')|E] lub wyższym, który utrzymuje [monastic_holy_order|El]. Najczęściej jest to władca, który go założył. Patron obdarza zakon doczesnym bogactwem, oddając mu w dzierżawę [temple_holdings|El] oraz przekazując [gold|El] do jego kasy.\n\nW zamian za okazaną hojność patron otrzymuje [piety|El] i [spiritual_fulfillment|El]. Może również przejąć kontrolę nad przywódcą zakonu i sprawić, by podejmował on interakcje [Concept('clerical', 'duchowne')|E] jako [puppet|El]."
 game_concept_mendicant: "Żebracz"
 game_concept_rite: "Obrządek"
 game_concept_rite_possessive: "Obrządku"
 game_concept_rites_possessive: "Obrządków"
 game_concept_rite_desc: "Obrządek to gałąź [Concept('faith', 'wiary')|E] będąca lokalną odmianą jej praktyk religijnych. Przewodzi mu [head_of_rite|El], a wyznają go należące do niego [counties|El] i [characters|El]. Każda wiara ma swój [mainline_rite|El] i mogą wyrosnąć z niej kolejne.\n\nObrządek definiuje się przez [core_tenets|El] i [doctrines|El], które reprezentuje. O tym, czy dany dogmat ma status [Concept('permitted_tenet_status', 'dozwolonego')|E], czy [Concept('prohibited_tenet_status', 'zakazanego')|E], decyduje [faith|El] poprzez swój [mainline_rite|El], a im bardziej decyzje danego [rite_possessive|El] sprzeciwiają się tym osądom, tym większa jest jego [rite_divergence|El]. Dywergentne obrządki podkopują [fervor|El] [faithpossessive|El] i zaczynają być postrzegane jako [heresy|El], a przy #V 100#! punktach [Concept('divergence', 'dywergencji')|E] odłączają się jako osobna [faith|El].\n\nOsoby pobożne mogą zakładać nowe obrządki, [Concept('rulers', 'władców')|E] można nakłonić do zmiany jednego obrządku na inny, a modyfikować dany obrządek może wyłącznie jego [head_of_rite|El]."
 game_concept_rites: "Obrządki"
 game_concept_archabbot: "Opat"
 game_concept_archabbot_desc: "$game_concept_archabbot$ jest [Concept('ruler', 'władcą')|E] [Concept('monastic_holy_order', 'zakonu monastycznego')|E] oraz [Concept('head_of_rite', 'głową')|E] [Concept('rite', 'obrządku')|E] propagowanego przez jego zakon. Prowadzi członków zakonu w nauce, kontemplacji i szerzeniu [Concept('core_tenets', 'dogmatów')|E] danego obrządku.\n\nZakon może być wspierany przez [Concept('monastic_order_patron', 'patrona zakonu monastycznego')|E], którego [monastic_order_patronage|El] zapewnia mu bogactwo i wpływ.\n\nPo śmierci arcyopata jego [titles|El] zostają przekazane następcy, którym zazwyczaj jest jego [courtier|El] posiadający najwyższy poziom [Concept('learning', 'nauki')|E]."
 game_concept_archbishop: "Arcybiskup"
 game_concept_archbishops: "Arcybiskupi"
 game_concept_archbishop_possessive: "Arcybiskupa"
 game_concept_archbishops_possessive: "Arcybiskupów"
 game_concept_archbishop_desc: "Arcybiskup to chrześcijański właściciel [Concept('archdiocese', 'archidiecezji')|E], [Concept('clerical_title', 'tytułu duchownego')|E] poziomu księstwa, którego [clerical_region|El] może obejmować kilka [Concept('realms', 'państw')|E].\n\nJako [religious_superior|El] [Concept('bishops', 'biskupów')|E] i podległy [Concept('clergy', 'duchowieństwu')|E] w obrębie danego regionu, arcybiskup ma rangę wyższą niż zwykły [bishop|El], ale odpowiada przed [Concept('head_of_faith', 'głową wiary')|E]."
 game_concept_bishop: "Biskup"
 game_concept_bishops: "Biskupi"
 game_concept_bishop_possessive: "Biskupa"
 game_concept_bishops_possessive: "Biskupów"
 game_concept_bishop_desc: "$game_concept_bishop$ to członek [Concept('clergy', 'duchowieństwa')|E] [Concept('faith', 'wiary')|E] chrześcijańskiej, posiadający lub dzierżawiący [temple_holdings|El].\n\nBiskup zamieszkuje na obszarze [Concept('archdiocese', 'archidiecezji')|E] i odpowiada przed tamtejszym [Concept('archbishop', 'arcybiskupem')|E], który jest jego [Concept('religious_superior', 'zwierzchnikiem religijnym')|E]. Biskup bez ziemi, którego tytuły są [leased|El], służy [Concept('liege', 'seniorowi')|E] świeckiemu, natomiast biskup posiadający [titles|El] [landed|El], które nie są dzierżawione, może rządzić jako [ruler|El] [ecclesiastical|El]."
 game_concept_rite_divergence: "Dywergencja"
 game_concept_rite_divergent: "Dywergentny"
 game_concept_divergence: "Dywergencja"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "Dywergencja określa, jak daleko [core_tenets|El] i [doctrines|El] [rite_possessive|El] oddaliły się od [Concept('faith', 'wiary')|E] nadrzędnej. Obrządek przyjmujący [Concept('prohibited_tenet_status', 'zakazane')|E] dogmaty jako [Concept('core_tenet_status', 'fundamentalne')|E] jest bardziej dywergentny.\n\nWysoka dywergencja osłabia [fervor|El] wiary nadrzędnej, sprawiając, że wybuchy [Concept('heresy', 'herezji')|E] stają się częstsze. Obrządek, który osiągnie #V 100#! punktów dywergencji, zostanie automatycznie uznany za herezję i stanie się nową [Concept('faith', 'wiarą')|E]."
 game_concept_spiritual_fulfillment: "Spełnienie duchowe"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ jest miarą tego, jak bardzo [character|El] żyje w zgodzie ze swoją [Concept('faith', 'wiarą')|E].\n\nWartość bazowa jest obliczana w oparciu o [traits|El] postaci oraz tego, czy postać jest uznawana za [Concept('sinful', 'grzeszną')|E] czy [Concept('virtuous', 'cnotliwą')|E].\n\n$game_concept_spiritual_fulfillment$ można zyskać lub stracić, podejmując działania, które dana [faith|El] uznaje za stosowne. Aby zniwelować efekty szkodliwych cech, można przyjmować [personal_tenets|El]."
 game_concept_fulfillment: "Spełnienie"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "Poziom spełnienia duchowego"
 game_concept_spiritual_fulfillment_levels: "Poziomy spełnienia duchowego"
 game_concept_spiritual_fulfillment_level_desc: "[spiritual_fulfillment|E] [character_possessive|El] dzieli się za pomocą progów na poziomy, z których każdy zapewnia inne efekty.\n\nPostacie na najniższych poziomach mają trudniejsze życie, a grzeszne uczynki kosztują je mniej. Z kolei postaciom na wysokich poziomach religijność przychodzi łatwiej i zyskują one dostęp do nowych opcji dotyczących religii."
 game_concept_personal_tenet: "Dogmat osobisty"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$ to [core_tenet|El], który [ruler|El] przyjmuje jako fundamentalny element swojej duchowości.\n\nPrzyjęcie dogmatu osobistego, który jest [core_tenet_status|El] lub [permitted_tenet_status|El] w danej [Concept('faith', 'wierze')|E], zapewnia [spiritual_fulfillment|El]. Z kolei przyjęcie dogmatu [Concept('prohibited_tenet_status', 'zakazanego')|E] powoduje powstanie [Concept('secret', 'sekretu')|E]. $game_concept_personal_tenets$ zapewniają także dodatkowe efekty i odblokowują specjalne mechaniki.\n\nLiczba dogmatów osobistych, które postać może wyznawać, zależy od jej [Concept('piety_level', 'poziomu religijności')|E] oraz od posiadania [Concept('trait', 'cechy')|E] [GetTrait('theologian').GetName( GetNullCharacter )|l]."
 game_concept_personal_tenets: "Dogmaty osobiste"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "Kardynał"
 game_concept_cardinals: "Kardynałowie"
 game_concept_cardinal_possessive: "Kardynała"
 game_concept_cardinals_possessive: "Kardynałów"
 game_concept_cardinalate: "Diecezja kardynalska"
 game_concept_cardinalates: "Diecezje kardynalskie"
 game_concept_cardinal_desc: "Członek [Concept('clergy', 'duchowieństwa')|E] wybrany przez papieża, by skuteczniej szerzyć wolę [Concept('the_christian_church', 'Kościoła chrześcijańskiego')|E]. Przy wyborze nowego papieża wszyscy członkowie [Concept('college_of_cardinals', 'Kolegium Kardynalskiego')|E] są jednocześnie kandydatami oraz elektorami i mają [papabile_score|El]."
 game_concept_college_of_cardinals: "Kolegium Kardynalskie"
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$ to grono [Concept('cardinals', 'kardynałów')|E], którzy doradzają papieżowi i wybierają następną [Concept('head_of_faith', 'głowę wiary')|E] [Concept('the_christian_church', 'Kościoła chrześcijańskiego')|E].\n\nKażdy [cardinal|El] jest jednocześnie kandydatem i elektorem papiestwa."
 game_concept_papabile_score: "Wynik papabile"
 game_concept_papabile_scores: "Wyniki papabile"
 game_concept_papabile_score_desc: "Wszyscy członkowie [Concept('college_of_cardinals', 'Kolegium Kardynalskiego')|E] mają wynik papabile, który uwzględnia ich [traits|El], [piety_level|El], [rite|El] i [Concept('opinion', 'opinię')|E] o innych kardynałach.\n\n[cardinals|E] z najwyższym wynikiem papabile prawdopodobnie otrzymają większą liczbę głosów podczas wyboru papieża.\n\n$game_concept_papabile_score$ można zwiększyć poprzez [Concept('character_interaction', 'interakcję z postacią')|E] „#high $increase_papabile_score_interaction$#!” i [Concept('decision', 'decyzję')|E] „[GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]”."
 game_concept_mainline_rite: "Obrządek tradycyjny"
 game_concept_mainline_rite_desc: "[rite|E] tradycyjny obejmuje najistotniejszy zbiór wierzeń danej [Concept('faith', 'wiary')|E]. $game_concept_rite$ inny niż tradycyjny określa się mianem [Concept('rite_divergent', 'dywergentnego')|E] względem tradycyjnego.\n\nTo, który obrządek jest tradycyjny, zależy od tego, czy wiara posiada swoją [Concept('head_of_faith', 'głowę wiary')|E].\n\nJeśli tak, wówczas obrządkiem tradycyjnym jest obrządek przez nią praktykowany. Oznacza to, że może się on zmienić w przypadku zastąpienia głowy wiary jej następcą praktykującym inny obrządek, w tym potencjalnym [Concept('challenger_hof', 'pretendentem do miana głowy wiary')|E].\n\nW przypadku braku głowy wiary status obrządku tradycyjnego przechodzi na inny obrządek, pod warunkiem, że ten inny jest praktykowany w większej liczbie [Concept('counties', 'hrabstw')|E] i posiada nie mniej [Concept('holy_sites', 'miejsc świętych')|E], co dotychczasowy obrządek tradycyjny."
 game_concept_mainline_rites: "Obrządki tradycyjne"
 game_concept_mainline_rite_short: "Tradycyjny"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "Status dogmatu"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ określa stanowisko [rite_possessive|El] względem danego [Concept('core_tenet', 'dogmatu')|E] czy danej [Concept('doctrine', 'doktryny')|E]. Stosowana jest tu pięciostopniowa skala – od najmniejszego do największego zaangażowania:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] – obrządek nie zna dogmatu lub doktryny.\n$EFFECT_LIST_BULLET$[known_tenet_status|E] – obrządek zna dogmat lub doktrynę, ale ani nie popiera, ani nie zakazuje danej praktyki.\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] – obrządek aprobuje daną praktykę.\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] – obrządek wyraźnie zakazuje danej praktyki.\n$EFFECT_LIST_BULLET$[core_tenet_status|E] – obrządek aktywnie promuje praktykę danego dogmatu.\n\nStanowisko obrządku określa, czy dogmat lub doktrynę można wybrać podczas tworzenia bądź rozwijania obrządku, a także czy [followers|El] ponoszą duchowe konsekwencje za jego praktykowanie.\n\nRóżni się to od [Concept('tenet_knowledge', 'wiedzy o religii')|E] danej [character_possessive|El], która odnosi się raczej do jej osobistej świadomości niż do stanowiska obrządku."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "Nieznany"
 game_concept_unknown_tenet_status_desc: "[tenet_status|E] „$game_concept_unknown_tenet_status$” oznacza, że [rite|El] w ogóle nie zna danego [Concept('core_tenet', 'dogmatu')|E] czy danej [Concept('doctrine', 'doktryny')|E]. [followers|E] wyznający ten obrządek z założenia go nie znają i nie mogą go wybrać ani podczas tworzenia nowego obrządku, ani jako [personal_tenet|El]."
 game_concept_known_tenet_status: "Znany"
 game_concept_known_tenet_status_desc: "[tenet_status|E] „$game_concept_known_tenet_status$” oznacza, że [rite|El] zna dany [core_tenet|E] lub daną [Concept('doctrine', 'doktrynę')|E], lecz ani nie popiera, ani nie dopuszcza ich praktykowania. Można je uwzględnić przy tworzeniu lub rozwijaniu obrządku, a ich [Concept('tenet_status', 'status')|E] może zostać podniesiony do wyższego poziomu."
 game_concept_permitted_tenet_status: "Dozwolony"
 game_concept_permit_tenet_status: "Zezwól"
 game_concept_permitted_tenet_status_desc: "[tenet_status|E] „$game_concept_permitted_tenet_status$” oznacza, że [rite|El] aprobuje dany [core_tenet|El] lub daną [Concept('doctrine', 'doktrynę')|E], choć nie promuje ich aktywnie. [character|E] wyznająca dany obrządek może przyjąć taki dogmat jako [personal_tenet|El] bez ponoszenia duchowych konsekwencji."
 game_concept_prohibited_tenet_status: "Zakazany"
 game_concept_prohibit_tenet_status: "Zakaż"
 game_concept_prohibited_tenet_status_desc: "[tenet_status|E] „$game_concept_prohibited_tenet_status$” oznacza, że [rite|El] kategorycznie zabrania danego [Concept('core_tenet', 'dogmatu')|E] lub [Concept('doctrine', 'doktryny')|E]. [character|E] wyznająca obrządek i przyjmująca dogmat jako [personal_tenet|El] utrzymuje to w [Concept('secret', 'sekrecie')|E], a obrządek przyjmujący [Concept('prohibited_tenet_status', 'zakazane')|E] [core_tenets|El] jako [Concept('core_tenet_status', 'fundamentalne')|E] staje się o wiele bardziej [rite_divergent|El] wobec swojej [Concept('faith', 'wiary')|E]."
 game_concept_core_tenet_status: "Fundamentalny"
 game_concept_core_tenet_status_desc: "[tenet_status|E] „$game_concept_core_tenet_status$” oznacza, że [rite|El] aktywnie promuje dany [core_tenet|El] lub daną [Concept('doctrine', 'doktrynę')|E] jako jedną ze swoich praktyk definiujących. Wszyscy [followers|El] wyznający ten obrządek podlegają ich skutkom."
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "Wiedza o religii"
 game_concept_doctrine_knowledge: "Wiedza o doktrynie"
 game_concept_rite_knowledge: "Wiedza o obrządku"
 game_concept_agnostic_knowledge: "Wiedza"
 game_concept_tenet_knowledge_desc: "Postacie nie znają wszystkich szczegółów każdej praktyki religijnej.\n\nZnane dogmaty i doktryny można wykorzystać przy tworzeniu [Concept('rite_divergent', 'dywergentnego')|E] obrządku oraz można je przyjąć jako [personal_tenets|El]. Znajomość wszystkich dogmatów i doktryn danego obrządku ułatwia nawrócenie.\n\nZ założenia znasz wszystkie [core_tenets|El] i [doctrines|El] swojej [Concept('faith', 'wiary')|E]. Nową wiedzę możesz zdobyć poprzez nawiązanie relacji – np. jeśli ty i inna postać zostaniecie [Concept('spouses', 'małżonkami')|E] lub [Concept('friends', 'przyjaciółmi')|E], poprzez [traveling|El] i [activities|El] lub dzięki działaniom w ramach [Concept('scheme', 'spisku')|E] „Studiuj obrządek”."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "Złożony w relikwiarzu"
 game_concept_enshrine: "Złożyć w relikwiarzu"
 game_concept_enshrined_desc: "[holy_relic|E] złożona w relikwiarzu na terenie [Concept('holy_site', 'miejsca świętego')|E] aktywuje i zwiększa premie, jakie to miejsce święte zapewnia, przy czym skala takiego zwiększenia zależy od łącznego poziomu [Concept('rarity', 'rzadkości')|E] wszystkich złożonych tam artefaktów.\n\nArtefakt złożony w relikwiarzu przestaje być własnością postaci, lecz [holder|El], [top_liege|El] lub właściciel [Concept('clerical_region', 'regionu duchownego')|E] danego miejsca świętego może z nim wchodzić w interakcje. Stan artefaktu nie ulega już pogorszeniu. W relikwiarzu możesz złożyć święte relikwie właściwe wyłącznie twojej własnej [Concept('faith', 'wierze')|E]. Relikwie innych wiar nie będą zapewniać premii.\n\nZe złożeniem artefaktu w relikwiarzu lub jego późniejszym usunięciem mogą wiązać się nagrody lub koszty."
 game_concept_holy_relic: "Święta relikwia"
 game_concept_holy_relics: "Święte relikwie"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ to [artifact|El], który ma znaczenie religijne dla danej [Concept('faith', 'wiary')|E]. $game_concept_holy_relic$ może zostać [Concept('enshrined', 'złożona w relikwiarzu')|E] w [Concept('holy_site', 'miejscu świętym')|E] tejże wiary, aby zapewnić premie.\n\nNiektóre artefakty są same w sobie święte dla danej wiary, ale mogą też zostać [Concept('sanctified', 'uświęcone')|E], aby stać się świętymi relikwiami."
 game_concept_sanctified: "Uświęcony"
 game_concept_sanctify: "Uświęć"
 game_concept_sanctifying: "Uświęcanie"
 game_concept_sanctified_desc: "Uświęcanie [Concept('artifact', 'artefaktu')|E] czyni z niego [Concept('holy_relic', 'świętą relikwię')|E] dla danej [Concept('faith', 'wiary')|E]. Artefakt może zostać uświęcony dla wielu wiar."
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Majątek kościelny"
 game_concept_ecclesiastical_estates: "Majątki kościelne"
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$ lub kompleks katedralny to rodzaj [Concept('domicile', 'siedziby')|E] związanej z [Concept('clerical_title', 'tytułem duchownym')|E] – reprezentuje ona prywatne dobra ziemskie, którymi zarządza [archbishop|El] oraz jego stolica. Pomniejsze [clergy|El] w państwie, w którym funkcjonuje [GetGovernment('ecclesiastical_government').GetName|l], musi najpierw uzyskać taki [title|El], nim taka siedziba zostanie mu nadana.\n\nMożna tu wznosić [ecclesiastical_estate_buildings|El], aby zwiększyć bogactwo, [piety|El] oraz [spiritual_fulfillment|El] właściciela. $game_concept_ecclesiastical_estate$ nie zmienia położenia, a jego spadkobiercą zostaje kolejny [holder|El] tytułu."
 game_concept_ecclesiastical_estate_building: "Budowla majątku kościelnego"
 game_concept_ecclesiastical_estate_buildings: "Budowle majątku kościelnego"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$ to unikatowe i stałe ulepszenia [Concept('ecclesiastical_estate', 'majątku kościelnego')|E].\n\nWłaściciel może wznosić wiele różnorodnych budowli, by generować osobiste zyski, [piety|El] i [spiritual_fulfillment|El] oraz uzyskać dostęp do licznych [Concept('decisions', 'decyzji')|E], [Concept('interactions', 'interakcji')|E] i nie tylko."
 game_concept_cathedral_complex: "Kompleks katedralny"
 game_concept_cathedral_complexes: "Kompleksy katedralne"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "Budowla kompleksu katedralnego"
 game_concept_cathedral_complex_buildings: "Budowle kompleksu katedralnego"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "Kanonizowana"
 game_concept_canonized_desc: "[character|E], która po śmierci została ogłoszona świętą lub jej odpowiednikiem w innej wierze – takim jak wali bądź czczony przodek – przez co przypisana zostaje jej [trait|El]: [GetTrait('saint').GetName( GetNullCharacter )|l].\n\nCnotliwe życie może zakończyć się kanonizacją. Umożliwia to odpowiednia [decision|El], która może wymagać błogosławieństwa [Concept('head_of_faith', 'głowy wiary')|E], a cały proces przypieczętowuje konsekracja miejsca pochówku świętego. Miejsce spoczynku takiej postaci przyciąga odtąd pobożnych pielgrzymów, a z jej szczątków mogą powstać [holy_relics|El]."
 game_concept_canonization: "Kanonizacja"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Świętość"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "[interaction|E], która przekształca [unpressed_claim|El] w [Concept('pressed_claim', 'wysunięte')|E] dzięki poparciu ze strony odpowiedniego [Concept('ruler', 'władcy')|E] [Concept('ecclesiastical', 'kościelnego')|E] lub [Concept('theocratic', 'teokratycznego')|E]."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "[interaction|E], która zapewnia [claim|El] do [Concept('title', 'tytułu')|E] należącego do innego [Concept('ruler', 'władcy')|E]. Wymaga akceptacji odpowiedniej [Concept('character', 'postaci')|E] [Concept('ecclesiastical', 'kościelnej')|E] lub [Concept('theocratic', 'teokratycznej')|E]."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "[interaction|E], która umożliwia pokojowe przekazanie [Concept('title', 'tytułu')|E] lub [Concept('vassal', 'wasala')|E] między dwoma [Concept('rulers', 'władcami')|E], polegająca na akceptacji zarówno [Concept('ruler', 'władcy')|E] docelowego, jak i pośredniczącego orędownika.\n\nOdmowa zwykle kosztuje odbiorcę punkty [Concept('piety', 'pobożności')|E] oraz [Concept('legitimacy', 'legitymacji')|E], a także wiąże się z dodatkowym kosztem wybranym przez stronę jako środek wymuszenia zgody.\n\nOrędownik – odpowiedni władca [ecclesiastical|El] lub [theocratic|El] – może zablokować tę interakcję, a jeśli obowiązuje u niego [law|El] „[GetLaw('church_authority_3').GetName]”, może również wymusić jej akceptację."
 game_concept_challenger_hof: "Pretendent do miana głowy wiary"
 game_concept_antipope: "Antypapież"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$ to rywal [Concept('head_of_faith', 'głowy wiary')|E] przeciwstawiający się głowie wiary [Concept('mainline_rite', 'obrządku tradycyjnego')|E].\n\n[ruler|E] może zostać fundatorem członka swojego [Concept('clergy', 'duchowieństwa')|E] jako pretendenta do miana głowy wiary. Zaś jeśli [ruler|El] należy do [Concept('clergy', 'duchowieństwa')|E] lub wyznaje [Concept('faith', 'wiarę')|E] ze świecką głową wiary, sam może mianować się pretendentem.\n\n$game_concept_challenger_hof$ posiadający fundatora przejmuje jego [rite|El], staje się jego [Concept('external_clerical_puppet', 'marionetkowym władcą duchownym')|E], a fundator ma na niego [Concept('weak_hook', 'haka słabego')|E].\n\nGłowa wiary obrządku tradycyjnego nie może [excommunicate|El] żadnego zwolennika pretendenta do miana głowy wiary: fundatora i jego [Concept('vassals', 'wasali')|E].\n\nKażdy zwolennik pretendenta do miana głowy wiary z żądaniami dotyczącymi sfery duchownej przychodzi właśnie do niego zamiast do głowy wiary obrządku tradycyjnego, używając na przykład następujących [Concept('interactions', 'interakcji')|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\n$game_concept_challenger_hof$\nJego fundator może użyć też [casus_belli|El] „[pam_challenge_hof_cb|E]” przeciwko prawowitej głowie wiary.\n\n[kings|E] rywala lub jego postacie o wyższej randze, wyznający tę samą [Concept('faith', 'wiarę')|E], mogą natomiast użyć casus belli „[pam_antiking_cb|E]” przeciwko fundatorowi, detronizując pretendenta rywala."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "Pretenduj do miana głowy wiary"
 game_concept_pam_challenge_hof_cb_desc: "[casus_belli|E] użyty przez [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E] lub jego fundatora przeciwko prawowitej [Concept('head_of_faith', 'głowie')|E] ich [Concept('faith', 'wiary')|E]. Po zwycięstwie pretendent do miana głowy wiary obejmuje urząd głowy wiary, a jego [rite|El] staje się [Concept('mainline_rite', 'tradycyjny')|E]. Gdy fundator odniesie zwycięstwo w wojnie i zyska rangę wyższą od swojego pretendenta do miana głowy wiary, pretendent ten staje się dodatkowo jego [Concept('vassal', 'wasalem')|E]."
 game_concept_pam_antiking_cb: "Pozbaw antypapieża władzy"
 game_concept_pam_antiking_cb_desc: "[casus_belli|E] dostępny dla [Concept('kings', 'królów')|E] [Concept('christian', 'chrześcijan')|E] oraz postaci o wyższej randze niebędących [Concept('challenger_hof', 'pretendentami do miana głowy wiary')|E] ani ich fundatorami. Używany przeciwko fundatorowi [Concept('independent', 'niezależnemu')|E] wyznającemu tę samą [Concept('faith', 'wiarę')|E] w celu zdetronizowania jego pretendenta do miana głowy wiary i zdobycia wdzięczności prawowitej [Concept('head_of_faith', 'głowy wiary')|E]."
 game_concept_petition_antipope_indulgences_interaction: "Ubiegaj się o odpust od antypapieża"
 game_concept_petition_antipope_indulgences_interaction_desc: "[interaction|E] dostępna dla każdego zwolennika [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E]. Zapłać [Concept('gold', 'złotem')|E] swojemu antypapieżowi w zamian za przebaczenie i [piety|El], pomijając [Concept('head_of_faith', 'głowę wiary')|E] [Concept('mainline_rite', 'obrządku tradycyjnego')|E]. Fundator jest akceptowany automatycznie."
 game_concept_petition_antipope_gold_interaction: "Poproś antypapieża o złoto"
 game_concept_petition_antipope_gold_interaction_desc: "[interaction|E] dostępna dla każdego zwolennika [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E]. Zażądaj [Concept('gold', 'złota')|E] od swojego antypapieża. Fundator jest akceptowany automatycznie."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "[decision|E] dostępna dla prałatów i potężnych władców, kierująca [the_christian_church|E] ku wybranej epoce."
 game_concept_tenet_popularity: "Popularność dogmatu"
 game_concept_tenet_popularity_desc: "Gdy [personal_tenets|El] rozprzestrzeniają się w obrębie [Concept('faith', 'wiary')|E], praktykowanie ich staje się coraz powszechniejsze. $game_concept_tenet_popularity$ pokazuje, na ile dany [core_tenet|El] jest powszechny, i wpływa na to, jak prawdopodobne jest, że zostanie wybrany jako temat debaty podczas [Concept('ecumenical_council', 'soboru powszechnego')|E] lub jako cel [Concept('papal_bull', 'bulli papieskiej')|E].\n\nIm wyższa popularność dogmatu, tym mocniej [clergy|El] będzie się za nim opowiadać, jeśli będzie przedmiotem debaty podczas [Concept('ecumenical_council', 'soboru powszechnego')|E]. $game_concept_tenet_popularity$ na poziomie #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! skutkuje tym, że [head_of_faith|El] najprawdopodobniej ogłosi go [Concept('permitted_tenet_status', 'dozwolonym')|E], bez względu na własne przekonania."
 game_concept_ecumenical_council_innovator: "Innowator"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Innowatorzy"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Innowatorzy są [Concept('activity_guests_short', 'gośćmi')|E] uczestniczącymi w [Concept('activity', 'aktywności')|E], jaką jest [ecumenical_council|El]. Głosują wraz z [Concept('activity_host_short', 'gospodarzem')|E] nad wnioskami o zmianę statusu [Concept('core_tenet', 'dogmatu')|E] lub [Concept('doctrine', 'doktryny')|E].\n\nSą bezpośrednimi przeciwnikami [Concept('ec_conservatives', 'konserwatystów')|E], gości, którzy głosują przeciwko jakimkolwiek zmianom, chcąc zachować status quo.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help [characters|E], które mogą głosować: [clergy|El], [rulers|El] posiadający [Concept('clerical_puppet', 'marionetkowego kapłana koronnego')|E] i [activity_host|El]#!"
 game_concept_ecumenical_council_conservative: "Konserwatysta"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Konserwatyści"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "Konserwatyści są [Concept('activity_guests_short', 'gośćmi')|E] uczestniczącymi w [Concept('activity', 'aktywności')|E], którą jest [ecumenical_council|El]. Głosują przeciwko [Concept('activity_host_short', 'gospodarzowi')|E] nad wnioskami o zmianę statusu [Concept('core_tenet', 'dogmatu')|E] lub [Concept('doctrine', 'doktryny')|E].\n\nSą bezpośrednimi przeciwnikami [Concept('ec_innovators', 'innowatorów')|E], gości, którzy starają się uchwalić zmiany.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[interaction|E] używana przez [Concept('rulers', 'władców')|E] [Concept('ecclesiastical', 'kościelnych')|E] w celu przekształcenia swojego [Concept('clerical_region', 'regionu duchownego')|E] w [counties|El] [de_jure|El] sąsiedniego [Concept('duchy', 'księstwa')|E].\n\nJest to możliwe wyłącznie za zgodą [Concept('head_of_faith', 'głowy wiary')|E]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E], dzięki której [rulers|El] [Concept('ecclesiastical', 'kościelni')|E] mogą zmusić władców świeckich wyznających tę samą [Concept('faith', 'wiarę')|E] do wypowiedzenia [Concept('holy_war', 'świętej wojny')|E] władcom wrogiej wiary."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[interaction|E], dzięki której [rulers|El] [Concept('ecclesiastical', 'kościelni')|E] mogą zmusić władców świeckich wyznających tę samą [Concept('faith', 'wiarę')|E] do wypowiedzenia [Concept('war', 'wojny')|E] w celu wysunięcia [Concept('claim', 'roszczenia')|E] wobec [Concept('ruler', 'władcy')|E] świeckiego."
 game_concept_treasury_cardinal_budget: "Budżet kardynalski"
 game_concept_treasury_cardinal_budget_short: "Kardynalski"
 game_concept_treasury_cardinal_budget_benefices: "Beneficja kardynalskie"
 game_concept_treasury_cardinal_budget_desc: "Zasoby skarbca przyznawane [Concept('cardinal', 'kardynałom')|E] z centralnego skarbca Kościoła, stanowiące odzwierciedlenie bezpośrednich i pośrednich przypisanych im [Glossary( 'beneficjów', 'CARDINAL_BENEFICES_GLOSS' )]."
 CARDINAL_BENEFICES_GLOSS: "Beneficja stanowiły lokalne lub zamiejscowe dobra, urzędy bądź też udziały w dochodach papieskich, które można było przyznać duchowieństwu #i in commendam#! (powierniczo). Przynosiły one dochód, zazwyczaj bez konieczności sprawowania bezpośrednich obowiązków administracyjnych."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[interaction|E], w ramach której autorytet [clerical|El] wymienia komfort [Concept('spiritual_fulfillment', 'spełnienia duchowego')|E] na [Concept('hook', 'haka')|E]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "[interaction|E], która wymaga od innej [Concept('character', 'postaci')|E] złożenia ślubów czystości, co wiąże się z długoterminową karą do [Concept('fertility', 'płodności')|E]."
 game_concept_military_holy_order: "Zakon wojskowy"
 game_concept_military_holy_orders: "Zakony wojskowe"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "Zakonu wojskowego"
 game_concept_military_holy_orders_possessive: "Zakonów wojskowych"
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$ to rodzaj [Concept('holy_order', 'zakonu rycerskiego')|E] składającego się z wojowników, którzy poprzysięgli bronić ziemi swojej [Concept('faith', 'wiary')|E] i poszerzać ich granice.\n\nZakon może zostać zatrudniony przez władców wyznających tę samą wiarę, jeśli toczą oni [Concept('war', 'wojnę')|E] ze [Concept('faith_evil', 'złą')|L] lub [Concept('faith_hostile', 'antagonistyczną')|L] wiarą, gdzie kosztem jest [piety|El]. Po zakończeniu wojny zakon nie będzie już walczyć dla tego władcy.\n\n$game_concept_military_holy_order$ może mieć [Concept('military_holy_order_patron', 'patrona')|E], który nie musi płacić za korzystanie z ich usług."
 game_concept_military_holy_order_patron: "Patron zakonu wojskowego"
 game_concept_military_holy_order_patronage: "Patronat nad zakonem wojskowym"
 game_concept_military_holy_order_patronize: "Sprawować patronat"
 game_concept_military_holy_order_patron_desc: "Patronem [Concept('military_holy_order', 'zakonu wojskowego')|E] jest [ruler|El] na [Concept('title_tier', 'poziomie')|E] [Concept('duke', 'księcia')|E] lub wyższym, który wyznaje tę samą [Concept('faith', 'wiarę')|E] i w którego [Concept('realm', 'państwie')|E] znajduje się jego stolica.\n\n$game_concept_military_holy_order_patron$ może bezpłatnie wezwać na pomoc zakon przeciwko wrogom religijnym, zamiast płacić [Concept('piety', 'pobożnością')|E].\n\nW przypadku utraty kontroli nad stolicą zakonu patronat można utracić na rzecz [Concept('vassals', 'wasali')|E] na [Concept('title_tier', 'poziomie')|E] [Concept('duke', 'księcia')|E] lub wyższym."
