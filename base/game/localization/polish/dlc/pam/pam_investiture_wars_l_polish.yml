l_polish:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Konflikt w sprawie inwestytury"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "Ponieważ odnosisz zwycięstwo, [defender.GetShortUINameNotMe] i stronnicy tej osoby muszą zaakceptować twoje stanowisko w sprawie mianowania członków duchowieństwa."
 pam_investiture_conflict_cb_victory_desc_defender: "Ponieważ [attacker.GetShortUINameNotMe] odnosi zwycięstwo, ty i twoi sojusznicy musicie zaakceptować stanowisko tej osoby w sprawie mianowania członków duchowieństwa."
 pam_investiture_conflict_cb_victory_desc: "Ponieważ [attacker.GetShortUINameNotMe] zwycięża, [defender.GetShortUINameNotMe] i [defender.Custom('PL_jego_jej')] stronnicy muszą zaakceptować stanowisko tej osoby w sprawie mianowania członków duchowieństwa."
 pam_investiture_conflict_cb_white_peace_desc: "Spór dotyczący mianowania duchownych pozostaje nierozstrzygnięty i żadna ze stron nie ustępuje."
 pam_investiture_conflict_cb_defeat_desc_attacker: "Odnosisz porażkę, co zmusza ciebie i twoich stronników do zaakceptowania stanowiska w sprawie mianowania duchowieństwa, które popiera [defender.GetShortUINameNotMe]."
 pam_investiture_conflict_cb_defeat_desc_defender: "Odnosisz zwycięstwo i tym samym zmuszasz osobę znaną jako [attacker.GetShortUINameNotMe] i jej stronników do zaakceptowania twojego stanowiska w sprawie mianowania duchowieństwa."
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUINameNotMe] zwycięża i zmusza osobę znaną jako [attacker.GetShortUINameNotMe] i jej stronników do zaakceptowania [defender.Custom('PL_jego_jej')] stanowiska w sprawie mianowania członków duchowieństwa."
 msg_pam_investiture_conflict_cb_invalidated_message: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] dobiegły końca. Konflikt w sprawie inwestytury został rozstrzygnięty."
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "Sobór w sprawie inwestytury #EMP nie został#! jeszcze zwołany"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "Zmuszeni do poddania"
 pam_investiture_conflict_forced_stance_tt: "Przegrana w sporze o inwestyturę zmusi cię do przyjęcia stanowiska zwycięzcy w sprawie mianowania duchownych podczas zbliżającego się soboru."
