l_polish:
 # Canonizing Saints
 # Christian faiths use Saint/Canonize wording; religions with an attested term for the venerated dead use it (Wali, Divus, Siddha, Kami - see pam_saint_custom_loc.txt); everything else uses Venerated Ancestor/Venerate (matches the vanilla saint trait and 20_pam_flavorization.txt). Three mechanisms: (1) scopeless keys pick the _saint/_va variant via SelectLocalization on the local player's religion, and the _va branch pulls its per-religion noun from a custom loc on GetPlayer; (2) scope-bearing keys whose only divergence is a single word/phrase swap just that fragment via a custom loc, keeping the sentence one key so its saved scopes stay live (called on the saint's scope where one exists, so gendered terms resolve); (3) clause-level scope-bearing keys (petition_sent, 0001.a.tt, 0002.desc, 0003.desc) keep the _saint/_va split and branch in script (triggered_desc), because their wording diverges across several phrases and they lean on multiple saved scopes a custom loc can't carry.
 # Canonize decision
 pam_canonize_saint_decision: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] – [GetPlayer.Custom('PamVenerateObjectTitle')|l]"
 pam_canonize_saint_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_desc_saint', 'pam_canonize_saint_decision_desc_va' )]"
 pam_canonize_saint_decision_desc_saint: "Wniosę o uznanie jednego z moich zmarłych krewnych za świętego, aby został kanonizowany i spoczął w świetle."
 pam_canonize_saint_decision_desc_va: "Wyniosę jednego z moich zmarłych krewnych, by znany był jako [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], oraz by jego szczątki [GetPlayer.Custom('PamConsecratedEnshrined')] z należytym szacunkiem."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "Wynieś zmarłego członka swojej [Concept('dynasty', 'dynastii')|E] do [Concept('sainthood', 'świętości')|E]."
 pam_canonize_saint_decision_tooltip_va: "Wynieś zmarłego członka swojej [Concept('dynasty', 'dynastii')|E] do następującej rangi: [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]"
 pam_canonize_saint_decision_confirm: "Wybierz miejsce spoczynku"
 pam_canonize_saint_decision_req_candidate: "#EMP Zmarły#! przodek z twojej [Concept('dynasty', 'dynastii')|E] bez cechy [Concept('sinful', 'grzesznej')|E] i z co najmniej jedną cechą [Concept('virtuous', 'cnotliwą')|E] nie został jeszcze otoczony czcią"
 pam_canonize_saint_decision_req_site: "[Concept('ecclesiastical_domicile', 'Majątek kościelny')|E] z [Concept('ecclesiastical_domicile_building', 'katedrą')|E] w twoim [Concept('realm', 'państwie')|E], gdzie dokona się kanonizacja, lub – jeśli wszystkie są okupowane – sąsiednia prowincja"
 pam_canonize_saint_decision_req_site_holy_site: "[Concept('holy_site', 'Miejsce święte')|E] twojej [Concept('faith', 'wiary')|E] w twoim [Concept('realm', 'państwie')|E], gdzie dokona się kanonizacja, lub – jeśli wszystkie są okupowane – sąsiednia prowincja"
 pam_canonize_saint_decision_canonize_tt: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] wybranego członka dynastii i upewnij się, że jego szczątki [GetPlayer.Custom('PamConsecratedEnshrined')]"
 pam_canonize_saint_decision_choose_1_tt: "Wybierz [Concept('ecclesiastical_domicile_building', 'katedrę')|E] w swoim [Concept('realm', 'państwie')|E], gdzie dokona się kanonizacja"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "Wybierz [Concept('holy_site', 'miejsce święte')|E] twojej [Concept('faith', 'wiary')|E] w twoim [Concept('realm', 'państwie')|E], gdzie dokona się kanonizacja"
 # Clause-level split kept in script (triggered_desc): three phrases diverge and the sentence needs saint_candidate / consecration_province / petition_recipient, which a custom loc can't all carry.
 pam_canonize_saint_petition_sent_tt_saint: "Prośba o uznanie osoby o imieniu [saint_candidate.GetFirstName] za [Concept('canonized', 'świętą')|E] i kanonizowanie jej w miejscu o nazwie [consecration_province.GetName], zostanie wysłana do zatwierdzenia osobie znanej jako [petition_recipient.GetTitledFirstName]"
 pam_canonize_saint_petition_sent_tt_va: "Prośba o uhonorowanie osoby o imieniu [saint_candidate.GetFirstName] i wyniesienie jej do następującej rangi: [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], a także o jej [GetPlayer.Custom('PamConsecratingEnshrining')] w miejscu znanym jako [consecration_province.GetName], zostanie wysłana do akceptacji osobie, którą jest [petition_recipient.GetTitledFirstName]"
 # Sentence stays a single key (saint_candidate / canonizer saved scopes stay live via custom_tooltip); only the canonize/venerate verb swaps, via the PamCanonizeVenerateVerb custom loc.
 pam_canonize_saint_hof_chance_tt: "Szansa, że [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] zatwierdzi prośbę o [GetPlayer.Custom('PamCanonizeVenerateVerb')] osoby znanej jako [saint_candidate.GetShortUINameNotMe], zależy od jej cnotliwych [Concept('trait', 'cech')|E] i wynosi #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#!"
 pam_canonize_saint_hof_chance_cynical_tt: "Szansa, że [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] zatwierdzi prośbę o [GetPlayer.Custom('PamCanonizeVenerateVerb')] osoby znanej jako [saint_candidate.GetShortUINameNotMe], zależy od jej cnotliwych [Concept('trait', 'cech')|E], choć jest obniżona wskutek jej cynicznej natury, i wynosi #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#!"
 pam_canonize_saint_hof_chance_puppet_tt: "Skoro [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] jest osobą ci podległą, prośba o [GetPlayer.Custom('PamCanonizeVenerateVerb')] dotycząca osoby znanej jako [saint_candidate.GetShortUINameNotMe] #EMP z pewnością#! zostanie spełniona"
 # Custom-loc vocabulary fragments (Christian / per-religion / fallback), referenced only by pam_saint_custom_loc.txt. The surrounding sentences stay full keys so their saved scopes stay live. Terms match the saint flavorization (20_pam_flavorization.txt) and trait names.
 pam_canonize_verb_christian: "kanonizowanie"
 pam_canonize_verb_hellenism: "ubóstwienie"
 pam_canonize_verb_confucianism: "utytułowanie"
 pam_canonize_verb_taoism: "nadanie inwestytury"
 pam_canonize_verb_other: "otoczenie czcią"
 pam_saint_noun_christian: "osoba [Concept('canonized', 'święta')|E]"
 pam_saint_noun_islam: "[Concept('canonized', 'wali')|E]"
 pam_saint_noun_islam_female: "[Concept('canonized', 'walija')|E]"
 pam_saint_noun_hellenism: "[Concept('canonized', 'divus')|E]"
 pam_saint_noun_hellenism_female: "[Concept('canonized', 'diva')|E]"
 pam_saint_noun_jainism: "[Concept('canonized', 'siddha')|E]"
 pam_saint_noun_shintoism: "[Concept('canonized', 'kami')|E]"
 pam_saint_noun_confucianism: "[Concept('canonized', 'shengxian')|E]"
 pam_saint_noun_buddhism: "[Concept('canonized', 'а̄rya')|E]"
 pam_saint_noun_taoism: "[Concept('canonized', 'zhenren')|E]"
 pam_saint_noun_judaism: "[Concept('canonized', 'cadyk')|E]"
 pam_saint_noun_other: "przodek otoczony czcią"
 # Every branch carries its own article (a/an varies per term) - the calling sentence must not add one.
 pam_venerated_saint_christian: "osoba święta"
 pam_venerated_saint_christian_capitalized: "osoba Święta"
 pam_venerated_saint_islam: "wali"
 pam_venerated_saint_islam_female: "walija"
 pam_venerated_saint_hellenism: "divus"
 pam_venerated_saint_hellenism_female: "diva"
 pam_venerated_saint_jainism: "siddha"
 pam_venerated_saint_shintoism: "kami"
 pam_venerated_saint_confucianism: "shengxian"
 pam_venerated_saint_buddhism: "ārya"
 pam_venerated_saint_taoism: "zhenren"
 pam_venerated_saint_judaism: "cadyk"
 pam_venerated_saint_judaism_female: "cadeket"
 pam_venerated_saint_other: "przodek otoczony czcią"
 pam_blessed_ones_christian: "błogosławieni"
 pam_blessed_ones_islam: "awlija"
 pam_blessed_ones_hellenism: "divi"
 pam_blessed_ones_jainism: "siddha"
 pam_blessed_ones_shintoism: "kami"
 pam_blessed_ones_confucianism: "shengxian"
 pam_blessed_ones_buddhism: "ārya"
 pam_blessed_ones_taoism: "zhenren"
 pam_blessed_ones_judaism: "cadykowie"
 pam_blessed_ones_other: "przodkowie otoczeni czcią"
 # Plain bare noun for names/titles/possessives (no concept link, capitalized fallback), via PamSaintOrAncestorTitleNoun.
 pam_saint_title_noun_christian: "Osoba święta"
 pam_saint_title_noun_islam: "Wali"
 pam_saint_title_noun_hellenism: "Divus"
 pam_saint_title_noun_jainism: "Siddha"
 pam_saint_title_noun_shintoism: "Kami"
 pam_saint_title_noun_confucianism: "Shengxian"
 pam_saint_title_noun_buddhism: "Ārya"
 pam_saint_title_noun_taoism: "Zhenren"
 pam_saint_title_noun_judaism: "Cadyk"
 pam_saint_title_noun_other: "Przodek otoczony czcią"
 # Title-cased fallbacks for the name-context commands; the bespoke branches reuse the pam_venerated_saint_* fragments above.
 pam_venerated_saint_other_title: "przodek otoczony czcią"
 pam_venerate_object_other: "przodek"
 pam_consecrate_christian: "uświęć"
 pam_consecrate_others: "złóż w relikwiarzu"
 pam_consecrate_christian_past: "uświęcono"
 pam_consecrate_others_past: "złożono w relikwiarzu"
 pam_consecrate_christian_present: "uświęcenie"
 pam_consecrate_others_present: "złożenie w relikwiarzu"
 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "Kanonizuj świętego"
 pam_choose_consecration_site_decision_va: "[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')] – uświęć"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "Wybiorę [Concept('ecclesiastical_domicile_building', 'katedrę')|E] w swoim [Concept('realm', 'państwie')|E], w której osoba [Concept('canonized', 'święta')|E] zostanie kanonizowana, a jej szczątki spoczną tak, by przyciągały wiernych."
 pam_choose_consecration_site_decision_desc_va: "Wybiorę święte miejsce w swoim [Concept('realm', 'państwie')|E] i tam uświęcę i złożę szczątki osoby, która była znana jako [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')], by przyciągały wiernych."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "Wybiorę [Concept('holy_site', 'miejsce święte')|E] mojej [Concept('faith', 'wiary')|E] w swoim [Concept('realm', 'państwie')|E], gdzie osoba [Concept('canonized', 'święta')|E] zostanie kanonizowana, a jej szczątki spoczną tak, by przyciągały wiernych."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Wybiorę [Concept('holy_site', 'miejsce święte')|E] mojej [Concept('faith', 'wiary')|E] w swoim [Concept('realm', 'państwie')|E], gdzie osoba, która była znana jako [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] zostanie konsekrowana, a jej szczątki spoczną tak, by przyciągały wiernych."
 pam_choose_consecration_site_decision_tooltip: "Wybierz miejsce uświęcenia wybranej osoby, która była znana jako [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 pam_choose_consecration_site_decision_confirm: "Uświęć"
 pam_choose_consecration_site_decision_select_tt: "Wybierz miejsce uświęcenia osoby, która była znana jako [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|U]"
 # Extract relic decision
 pam_extract_relic_decision: "Pozyskaj relikwię"
 pam_extract_relic_decision_desc: "W moim państwie spoczywa osoba, która była znana jako [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')] i którą [GetPlayer.Custom('PamConsecratedEnshrined')]. Z należytym szacunkiem można pozyskać relikwię z jej szczątków, aby pobłogosławić wiernych."
 pam_extract_relic_decision_tooltip: "Pozyskaj relikwię osoby, która była znana jako [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')] i została pochowana na ziemiach, które kontrolujesz."
 pam_extract_relic_decision_confirm: "Pozyskaj relikwię"
 pam_extract_relic_decision_req_saint: "W twoim [Concept('realm', 'państwie')|E] spoczywa osoba, która była znana jako [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]. Wciąż możesz pozyskać jej relikwię."
 pam_extract_relic_decision_req_saint_count: "Pozyskano dotąd [CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] z [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact', 'relikwii')|E] osoby znanej jako [CHARACTER.GetShortUINameNotMe]"
 pam_extract_relic_decision_extract_tt: "Utwórz świętą [Concept('artifact', 'relikwię')|E] ze szczątków osoby, która była znana jako [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_extract_relic_decision_choose_tt: "Wybierz, z której pochowanej osoby znanej jako [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] chcesz pozyskać [Concept('artifact', 'relikwię')|E]"
 pam_extract_relic_decision_item_valid_tt: "Wciąż można pozyskać [Concept('artifact', 'relikwię')|E] tej osoby znanej jako [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "Prośba wyrusza w drogę"
 pam_saint_events.0001.desc: "Przygotowania w procesie uświęcenia osoby o imieniu [saint_candidate.GetFirstName] dobiegły końca, a miejsce uhonorowania na ziemiach znanych jako [consecration_province.GetName] oczekuje na jej błogosławione szczątki.\n\nTeraz sprawa wymyka się z moich rąk: [petition_recipient.GetTitledFirstName] wkrótce otrzyma mą prośbę, a ja mogę modlić się jeno o korzystne orzeczenie."
 pam_saint_events.0001.a: "Będziemy więc czekać i się modlić."
 pam_saint_events.0001.a.tt_saint: "[petition_recipient.GetTitledFirstName] otrzymuje prośbę o uznanie osoby o imieniu [saint_candidate.GetFirstName] za [Concept('canonized', 'świętą')|E] i kanonizowanie jej w miejscu o nazwie [consecration_province.GetName]. Odpowiedź nadejdzie z czasem."
 pam_saint_events.0001.a.tt_va: "Prośba, by osoba o imieniu [saint_candidate.GetFirstName] była znana jako [saint_candidate.Custom('PamVeneratedSaintOrAncestor')] i by jej szczątki spoczęły w miejscu o nazwie [consecration_province.GetName], została wysłana do osoby, którą jest [petition_recipient.GetTitledFirstName]. Odpowiedź nadejdzie z czasem."
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "Prośba o uznanie świętości"
 pam_saint_events.0002.t_va: "Prośba o otoczenie czcią"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName] prosi nas o włączenie osoby znanej jako [saint_candidate.GetFirstName] do grona błogosławionych świętych, kanonizowanych na ziemiach znanych jako [consecration_province.GetName]."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName] prosi nas o uhonorowanie osoby o imieniu [saint_candidate.GetFirstName] i włączenie jej do grona, które tworzą [saint_candidate.Custom('PamBlessedOnesOrAncestors')] spoczywający na ziemiach znanych jako [consecration_province.GetName]."
 pam_saint_events.0002.desc.traits_1: "\n\nZa życia osoba o imieniu [saint_candidate.GetFirstNameNoTooltip] słynęła z następującej cechy: [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nZa życia osoba o imieniu [saint_candidate.GetFirstNameNoTooltip] słynęła z następujących cech: [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] i [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nZa życia osoba o imieniu [saint_candidate.GetFirstNameNoTooltip] słynęła z następujących cech: [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] i [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "W tej duszy tli się światło; skromny płomień, choć nie każdy święty został wykuty w potężnym ogniu.\n\nOcena należy do nas."
 pam_saint_events.0002.desc.virtue_1_va: "W tej duszy tli się światło; skromny płomień, choć nie każde jestestwo otoczone czcią zostało wykute w potężnym ogniu.\n\nOcena należy do nas."
 pam_saint_events.0002.desc.virtue_2: "Dokonań tej duszy, czynionych w celu zadowolenia [saint_candidate.GetFaith.HighGodNamePossessive], nie sposób lekceważyć. To oznaka oczywistej, choć niedoskonałej, łaski.\n\nOcena należy do nas."
 pam_saint_events.0002.desc.virtue_3: "Cnota jest ucieleśnieniem tej duszy; rzadko trafia się śmiertelnik, który tak jawnie nosi w sobie tyle boskości.\n\nOcena należy do nas."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] to osoba zaprawdę godna."
 pam_saint_events.0002.a.dynasty_opinion_tt: "Członkowie [Concept('dynasty', 'dynastii')|E] osoby znanej jako [canonizer.GetShortUINameNotMe], znani [canonizer.GetFaith.GetAdherentNamePlural|l], zyskują #P 10#! pkt [Concept('opinion', 'opinii')|E] o tobie na 20 lat"
 pam_saint_events.0002.b: "Nie wyrażamy zgody."
 pam_saint_events.0002.b.dynasty_opinion_tt: "Członkowie [Concept('dynasty', 'dynastii')|E] osoby znanej jako [canonizer.GetShortUINameNotMe], znani [canonizer.GetFaith.GetAdherentNamePlural|l], tracą #N 10#! pkt [Concept('opinion', 'opinii')|E] o tobie na 20 lat"
 # Opinion Modifiers
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
 pam_canonization_approved_petitioner_opinion_saint: "Zatwierdzono kanonizację członka [Concept('dynasty', 'dynastii')|E]"
 pam_canonization_approved_petitioner_opinion_va: "Zatwierdzono otoczenie czcią członka [Concept('dynasty', 'dynastii')|E]"
 pam_canonization_approved_dynasty_opinion: "$pam_canonization_approved_petitioner_opinion$"
 pam_canonization_denied_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_denied_petitioner_opinion_saint', 'pam_canonization_denied_petitioner_opinion_va' )]"
 pam_canonization_denied_petitioner_opinion_saint: "Odmówiono kanonizacji członka [Concept('dynasty', 'dynastii')|E]"
 pam_canonization_denied_petitioner_opinion_va: "Odmówiono otoczenia czcią członka [Concept('dynasty', 'dynastii')|E]"
 pam_canonization_denied_dynasty_opinion: "$pam_canonization_denied_petitioner_opinion$"
 pam_canonization_celebrated_dynasty_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_celebrated_dynasty_opinion_saint', 'pam_canonization_celebrated_dynasty_opinion_va' )]"
 pam_canonization_celebrated_dynasty_opinion_saint: "Kanonizowano członka [Concept('dynasty', 'dynastii')|E]"
 pam_canonization_celebrated_dynasty_opinion_va: "Otoczono czcią członka [Concept('dynasty', 'dynastii')|E]"
 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "Nowy święty"
 pam_saint_events.0003.t_va: "Nowo wyniesiona osoba znana jako [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_saint_events.0003.desc_saint: "Dokonało się. [saint_candidate.GetFirstName] ma za sobą kanonizację na ziemiach znanych jako [consecration_province.GetName] i należy do grona świętych. Niech [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip|l] będą błogosławieni światłem tej czcigodnej osoby przez kolejne pokolenia."
 pam_saint_events.0003.desc_va: "Dokonało się. [saint_candidate.GetFirstName] należy do grona osób, które znano jako [saint_candidate.Custom('PamBlessedOnesOrAncestors')] i które [saint_candidate.Custom('PamConsecratedEnshrined')]. Spoczywa teraz na ziemiach znanych jako [consecration_province.GetName]. Niech błogosławi nasze państwo przez kolejne pokolenia."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Deo gratias."
 pam_saint_events.0003.a_va: "Bogu niech będą dzięki."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Członkowie twojej [Concept('dynasty', 'dynastii')|E] wyznający twoją [Concept('faith', 'wiarę')|E] zyskują #P 20#! pkt [Concept('opinion', 'opinii')|E] o tobie na 20 lat"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "Odmówiono uznania świętości"
 pam_saint_events.0004.t_va: "Odmówiono otoczenia czcią"
 pam_saint_events.0004.desc: "Nasza prośba o [GetPlayer.Custom('PamCanonizeVenerateVerb')] osoby o imieniu [saint_candidate.GetFirstName] została odrzucona przez osobę znaną jako [petition_recipient.GetTitledFirstName]. [GetPlayer.Custom('PamBlessedOnesOrAncestors')|U] nie zyskają dziś nowego członka."
 pam_saint_events.0004.a: "Niech tak będzie."
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "Przygotowania relikwiarza"
 pam_saint_events.0005.desc: "W miejscu znanym jako [extract_site.GetName] nabożne ręce przygotowują się do uroczystej pracy, aby pozyskać świętą relikwię osoby znanej jako [relic_saint.GetShortUINameNotMe] z jej błogosławionych szczątków.\n\nTrwają przygotowania do świętowania tej uroczystej okazji."
 pam_saint_events.0005.a: "Prace muszą zostać wykonane z należytym szacunkiem."
 pam_saint_events.0005.a.tt: "Niebawem z miejsca o nazwie [extract_site.GetName] zostanie pozyskana [Concept('artifact', 'relikwia')|E] osoby znanej jako [relic_saint.GetShortUINameNotMe]."
 # The relic is drawn
 pam_saint_events.0006.t: "Święta relikwia"
 pam_saint_events.0006.desc_relic: "Ze świętych szczątków osoby o imieniu [relic_saint.GetFirstName], którą [GetPlayer.Custom('PamConsecratedEnshrined')] w miejscu o nazwie [extract_site.GetName], pozyskaliśmy świętą relikwię: #EMP [relic_artifact.GetName]#!. Niech będzie błogosławieństwem dla wiernych w moim państwie przez kolejne pokolenia."
 pam_saint_events.0006.desc: "Ze świętych szczątków osoby o imieniu [relic_saint.GetFirstName], którą [GetPlayer.Custom('PamConsecratedEnshrined')] w miejscu o nazwie [extract_site.GetName], pozyskaliśmy świętą [Concept('artifact', 'relikwię')|E], aby pobłogosławić nasze państwo."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "Gloria Deo!"
 pam_saint_events.0006.a_va: "Chwała Bogu."
 pam_saint_events.0006.a.tt: "Relikwia o nazwie [relic_artifact.GetName] została pozyskana i obecnie znajduje się pod twoją opieką."
 pam_dulia_relic_dynasty_prestige_tt: "Ze względu na dogmat „[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]”:"
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "Ze względu na dogmat „[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]” każdy [ruler|El] twojej [Concept('faith', 'wiary')|E] zyskuje modyfikator „$pam_dulia_new_saint_modifier$” na #EMP 5#! lat"
 pam_dulia_new_saint_message_t: "Nowy orędownik"
 pam_dulia_new_saint_message_desc: "Osoba znana jako [pam_new_saint.GetTitledFirstName] została wyniesiona na ołtarze, a wierni wyznający [pam_new_saint.GetFaith.GetName|l] zyskali orędownika przed obliczem Boga."
 # Relic benefit requirement (can_benefit on pam_saint_relic_template).
 pam_saint_relic_benefit_faith_tt: "Właściciel wyznaje tę samą [Concept('religion', 'religię')|E] co [CHARACTER.GetShortUINameNotMe]"
