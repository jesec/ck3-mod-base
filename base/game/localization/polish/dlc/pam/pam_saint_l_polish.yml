 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "Elegancki relikwiarz, w którym przechowywany jest święty palec pozyskany z błogosławionych szczątków osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_desc: "Elegancki relikwiarz, w którym przechowywany jest święty ząb pozyskany z błogosławionych szczątków osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_desc: "Elegancki relikwiarz, w którym przechowywane jest święte żebro pozyskane z błogosławionych szczątków osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hair_desc: "Elegancki relikwiarz, w którym przechowywany jest kosmyk włosów pozyskany z błogosławionych szczątków osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_vestment_desc: "Elegancki relikwiarz, w którym przechowywany jest fragment szat należących niegdyś do osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hand_desc: "Elegancki relikwiarz, w którym przechowywana jest święta dłoń pozyskana z błogosławionych szczątków osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_arm_desc: "Elegancki relikwiarz, w którym przechowywana jest święta ręka pozyskana z błogosławionych szczątków osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_desc: "Elegancki relikwiarz, w którym przechowywana jest otoczona czcią czaszka osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_blood_desc: "Elegancki relikwiarz, w którym przechowywana jest fiolka krwi osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_heart_desc: "Elegancki relikwiarz, w którym przechowywane jest święte serce osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_effigy_desc: "Czcigodna podobizna osoby znanej jako [relic_creator_saint.GetShortUINameNotMe], otoczona czcią przez wiernych."
 pam_saint_relic_letter_desc: "Elegancki relikwiarz, w którym przechowywany jest list napisany przez osobę znaną jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_drawing_desc: "Sławny rysunek stworzony przez osobę znaną jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_stationery_desc: "Zestaw piśmienniczy, którego używała osoba znana jako [relic_creator_saint.GetShortUINameNotMe]. Mawiają, że przyniesie mądrość temu, kto go posiada."
 pam_saint_relic_ash_desc: "Elegancki relikwiarz, w którym przechowywane są święte prochy osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_canopic_jar_desc: "Urna zawierająca organy wewnętrzne osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_staff_desc: "Laska, której używała osoba znana jako [relic_creator_saint.GetShortUINameNotMe] podczas swojej pielgrzymki."
 pam_saint_relic_water_filter_desc: "Kawałek tkaniny, której osoba znana jako [relic_creator_saint.GetShortUINameNotMe] używała do filtrowania wody w czasie swoich podróży."
 pam_saint_relic_bowl_desc: "Misa, której osoba znana jako [relic_creator_saint.GetShortUINameNotMe] używała, żebrząc o jedzenie podczas swych podróży."
 pam_saint_relic_robe_desc: "Elegancki relikwiarz, w którym przechowywane są święte szaty osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_sword_desc: "Święty miecz, który dzierżyła osoba znana jako [relic_creator_saint.GetShortUINameNotMe]. Powiadają, że zapewnia boską ochronę i siłę wiernemu, który będzie go nosił."
 pam_saint_relic_sarira_desc: "Elegancki relikwiarz, w którym przechowywana jest sarira osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_buddhism_desc: "Elegancki relikwiarz, w którym przechowywana jest sarira – usznisza osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_finger_buddhism_desc: "Elegancki relikwiarz, w którym przechowywana jest sarira – palec osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_buddhism_desc: "Elegancki relikwiarz, w którym przechowywana jest sarira – ząb osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_buddhism_desc: "Elegancki relikwiarz, w którym przechowywana jest sarira – żebro osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "Talizman, który narysowała osoba znana jako [relic_creator_saint.GetShortUINameNotMe]. Powiadają, że potrafi odpędzać zło lub uleczyć tego, kto go nosi."
 pam_saint_relic_pellet_desc: "Butelka z nieśmiertelnymi cząstkami, którą uwarzyła osoba znana jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_footprint_desc: "Elegancki relikwiarz, w którym przechowywany jest odcisk stopy osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_afarganyu_desc: "Afarganju, które należało do osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_ring_desc: "Święty pierścień, który należał do osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_bracelet_desc: "Święta bransoleta, która należała do osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_commentary_desc: "Zbiór komentarzy napisanych przez osobę znaną jako [relic_creator_saint.GetShortUINameNotMe] i ukazujących jej interpretację pisma o nazwie [relic_creator_saint.GetFaith.ReligiousText]."
 pam_saint_relic_tzitzit_desc: "Święty warkocz – cicit – należący do osoby znanej jako [relic_creator_saint.GetShortUINameNotMe] i ukazujący jej pobożność."
 pam_saint_relic_relic_desc: "Elegancki relikwiarz, w którym przechowywana jest święta relikwia osoby znanej jako [relic_creator_saint.GetShortUINameNotMe]."
 # Buried-saint point of interest
 poi_buried_saint: "Grobowiec osoby, którą jest [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')|l]"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "Wizyta w grobowcu osoby świętej"
 poi_buried_saint.visit_va: "Wizyta w grobowcu przodka otoczonego czcią"
 poi_buried_saint.visit_desc: "Wizyta w grobowcu osoby, której godność to [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], przepełnia cię oddaniem."
 poi_buried_saint.preset_visit_desc: "Zatrzymujesz się przy grobie postaci [visited_saint.GetShortUIName] i składasz hołd."
 poi_buried_saint.foreign_visit: "Wizyta w starożytnym grobowcu"
 poi_buried_saint.foreign_visit_desc: "Twoja wiara nie czci postaci [visited_saint.GetShortUIName], lecz przy tym grobie wiele można się nauczyć."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Złóż wyrazy szacunku, aby zyskać nieco [piety_i|E][Concept('piety', 'pobożności')|E], i zyskaj możliwość pozyskania świętej [Concept('artifact', 'relikwii')|E] kosztem #EMP niższym#! niż wymagałoby wydobycie jej z daleka."
 pam_poi_buried_saint_on_visit_relic_tt: "Złóż osobie znanej jako [visited_saint.GetShortUINameNotMe] wyrazy szacunku i zyskaj możliwość pozyskania świętej [Concept('artifact', 'relikwii')|E] kosztem #EMP niższym#! niż wymagałoby wydobycie jej z daleka."
 pam_poi_buried_saint_on_visit_no_relic_tt: "W tym miejscu spoczywa [visited_saint.GetShortUINameNotMe], [visited_saint.Custom('PamSaintOrAncestorNoun')]. Złóż wyrazy szacunku."
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "W grobowcu osoby znanej jako [visited_saint.GetShortUINameNotMeNoTooltip]"
 pam_saint_events.0007.desc: "W trakcie swoich podróży odwiedzam miejsce, w którym spoczywa [visited_saint.GetShortUINameNotMe], [visited_saint.Custom('PamVeneratedSaintOrAncestor')]. Łączy nas ta sama wiara. Miejsce przenika świętość, a wokół grobu wierni klękają w cichej modlitwie."
 pam_saint_events.0007.a: "Złożę wyrazy szacunku i ponownie ruszę w drogę."
 pam_saint_events.0007.b: "Pzyskajmy świętą relikwię."
 pam_saint_events.0007.b.tt: "Ze szczątków osoby znanej jako [visited_saint.GetShortUINameNotMeNoTooltip] zostanie pozyskana święta [Concept('artifact', 'relikwia')|E]"
 pam_saint_events.0007.b.toast: "Pozyskanie świętej relikwii"
 pam_saint_events.0007.b.toast_desc: "Nabożne ręce pozyskały relikwię o nazwie [relic_artifact.GetName] ze szczątków osoby znanej jako [visited_saint.GetShortUINameNotMeNoTooltip], aby pobłogosławić moje [realm|El]."
