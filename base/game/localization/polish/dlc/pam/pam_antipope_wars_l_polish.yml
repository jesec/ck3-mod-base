l_polish:
 PAM_CHALLENGE_HOF_WAR_CB_NAME: "Pretenduj do miana [Concept('head_of_faith', 'głowy wiary')|E]"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "[challenger_hof|E], którego jesteś fundatorem, przejmuje tytuły [head_of_faith_possessive|El], a [Concept('mainline_rite', 'obrządkiem tradycyjnym')|E] zostaje obrządek o nazwie [attacker.GetRite.GetName|l]."
 pam_challenge_hof_cb_victory_desc_attacker: "Przejmujesz tytuły [head_of_faith_possessive|El], a obrządek znany jako [attacker.GetRite.GetName|l] staje się [Concept('mainline_rite', 'obrządkiem tradycyjnym')|E]."
 pam_challenge_hof_cb_victory_desc: "[challenger_hof|E] zostaje [Concept('head_of_faith', 'głową wiary')|E]."
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUINameNotMe] zachowuje miano [Concept('head_of_faith', 'głowy wiary')|E]."
 pam_challenge_hof_cb_defeat_desc_attacker: "Twoje pretendowanie do miana [Concept('head_of_faith', 'głowy wiary')|E] kończy się niepowodzeniem."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "Wojna zakończyła się: obrońca nie jest już [Concept('head_of_faith', 'głową wiary')|E]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "Wojna się skończyła: nie ma już pretendenta do miana głowy wiary."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUINameNotMe] zostaje [Concept('vassal', 'wasalem')|E] osoby znanej jako [sponsor.GetShortUINameNotMe]"
 PAM_ANTIKING_WAR_CB_NAME: "Zdetronizuj [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E]"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "Pozbywasz się [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E] osoby znanej jako [defender.GetShortUINameNotMe] i zyskujesz wdzięczność osoby, którą jest [attacker.GetFaith.GetReligiousHead.GetShortUINameNotMe]."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "Pozbywasz się [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E] osoby znanej jako [defender.GetShortUINameNotMe]."
 pam_antiking_cb_victory_desc: "[challenger_hof|E] zostaje zdetronizowany."
 pam_antiking_cb_white_peace_desc: "[challenger_hof|E] pozostaje."
 pam_antiking_cb_defeat_desc_attacker: "Twoja próba usunięcia [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E] kończy się fiaskiem."
 pam_antiking_cb_defeat_desc: "[challenger_hof|E] przeżył."
 msg_pam_antiking_cb_invalidated_message: "Wojna zakończyła się: obrońca nie jest już fundatorem [Concept('challenger_hof', 'pretendenta do miana głowy wiary')|E]."
 pam_humiliation_cb_papabile_score_loss_tt: "[papabile_score|E] osoby znanej jako [defender.GetShortUINameNotMe] w sukcesji papieskiej zmienił się o #N -25#!"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "[papabile_score|E] osoby znanej jako [attacker.GetShortUINameNotMe] w sukcesji papieskiej zmienił się o #N -25#!"
 pam_clerical_disgrace_modifier: "Hańba duchowna"
 pam_clerical_disgrace_modifier_desc: "Ta postać została upokorzona w wojnie religijnej, co osłabiło jej [candidate_score|El] przy ubieganiu się o [clerical_titles|El]."
 pam_clerical_disgrace_candidacy_penalty_desc: "Upokorzenie w wojnie religijnej"
 pam_antipope_events.0010.t: "Pokonany pretendent"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')|U] schizmatyk, [pam_ch_hof_challenger.GetTitledFirstName], klęka przede mną, już nie mogąc rościć sobie prawa do tytułu, którym jest [ROOT.Char.GetFaith.ReligiousHeadTitleName].\n\nZ niezmienną pychą w głosie mówi:\n\n– Arka jest tam, gdzie ja stoję. Nie u twych stóp.\n\n[pam_ch_hof_challenger.Custom('PL_jego_jej')|U] język wciąż wydaje się służyć szatanowi."
 pam_antipope_events.0010.desc: "Pretendent znany jako [pam_ch_hof_challenger.GetTitledFirstName] klęka przede mną, już nie mogąc rościć sobie prawa do tytułu, którym jest [ROOT.Char.GetFaith.ReligiousHeadTitleName].\n\nZ niezmienną pychą w głosie odpowiada:\n\n– [ROOT.Char.GetFaith.ReligiousHeadName] to ja."
 pam_antipope_events.0010.a.christian: "Cela mogłaby [pam_ch_hof_challenger.Custom('PL_mu_jej')] pomóc w okazaniu skruchy na wzór Jonasza."
 pam_antipope_events.0010.a: "Zamknąć [pam_ch_hof_challenger.Custom('PL_go_ja')]."
 pam_antipope_events.0010.b.christian: "Stracić [pam_ch_hof_challenger.Custom('PL_go_ja')]. Pan rozpozna swoich."
 pam_antipope_events.0010.b: "Stracić [pam_ch_hof_challenger.Custom('PL_go_ja')]. Resztę zostawmy sądom [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_antipope_events.0010.c: "Okaż litość."
 pam_antipope_events.0010.d: "Wykrzyczy imię, jakie nosi [ROOT.Char.GetFaith.ReligiousHeadName|l] o prawowitym mandacie."
 pam_challenge_hof_war_random_permanent_harm_tt: "Odnosi losowy trwały uraz"
 pam_antipope_events.0011.t: "Cena patronatu"
 pam_antipope_events.0011.desc.christian: "Sakwa osoby znanej jako [pam_ch_hof_sponsor.GetTitledFirstName] doprowadza do tego zgubnego rozłamu, który powoduje, że [ROOT.Char.GetFaith.ReligiousHeadName|l] rywala zwraca się przeciwko obrządkowi o nazwie [ROOT.Char.GetRite.GetName|l].\n\nPismo Święte nie jest łaskawe dla takich patronów: „[Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]”.\n\n[pam_ch_hof_sponsor.GetTitledFirstName] podnosząc wzrok, do samego końca bez cienia skruchy, mówi:\n\n– [ROOT.Char.GetFaith.ReligiousHeadName] to nie ty. Ty jesteś jedynie fałszywym mnichem. Ustąp, ustąp i niech trwa twoje wieczne potępienie."
 pam_antipope_events.0011.desc: "Osoba znana jako [pam_ch_hof_sponsor.GetTitledFirstName], wykorzystując swoje złoto, przyczynia się do tego, że [ROOT.Char.GetFaith.ReligiousHeadName|l] dzieli wspólnotę, którą tworzą [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip].\n\n[pam_ch_hof_sponsor.GetTitledFirstName] podnosi wzrok i mówi:\n\n– [ROOT.Char.GetFaith.ReligiousHeadName] to nie ty. Jesteś oszustem."
 pam_antipope_events.0011.a: "Skonfiskuj złoto, które to umożliwiło."
 pam_antipope_events.0011.b: "Strać [pam_ch_hof_sponsor.Custom('PL_go_ja')]. Zgoda ma swoją cenę."
 pam_antipope_events.0011.c: "Wstyd dla [pam_ch_hof_sponsor.Custom('PL_jego_jej')] rodu to wystarczająca kara."
 pam_antipope_events.0011.d: "Chłostaj [pam_ch_hof_sponsor.Custom('PL_go_ja')], aż ciało zmięknie pod batem."
 pam_romans_1_32_english: "Ci, którzy dopuszczają się takich czynów, zasługują na śmierć… a jednak nie dość, że tak postępują, to jeszcze przyklaskują innym, którzy czynią podobnie."
 ROMANS_1_32_GLOSS: "#weak Rz 1:32, tłum. własne#!"
 pam_antipope_events.0012.t: "Osąd w sprawie obalonego"
 pam_antipope_events.0012.t.christian: "Wyrok dla żołnierza szatana"
 pam_antipope_events.0012.intro.christian: "Lud praktykujący obrządek o nazwie [ROOT.Char.GetRite.GetName|l] ugina się przede mną. [ROOT.Char.GetFaith.ReligiousHeadName] o nieprawowitym mandacie, [pam_ch_hof_old_hof.GetTitledFirstName], klęka u mych stóp."
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|U] uginają się przede mną. [ROOT.Char.GetFaith.ReligiousHeadName] o nieprawowitym mandacie, [pam_ch_hof_old_hof.GetTitledFirstName], klęka u mych stóp."
 pam_antipope_events.0012.intro.sponsor: "[ROOT.Char.GetFaith.ReligiousHeadName] mojej wiary, [pam_ch_hof_new_hof.GetFirstName] zasiada na tronie. Pretendent zaś, którym jest [pam_ch_hof_old_hof.GetTitledFirstName], klęka u mych stóp."
 pam_antipope_events.0012.dialogue.christian: "\n\nZ niezmienną pychą w głosie [pam_ch_hof_new_hof.GetFirstName] wykrztusza:\n\n– Mieczem sięgasz po tron pokoju.\n\n– Pan uznał za stosowne dać mi narzędzia potrzebne do wypełnienia Jego planu – odpowiadam."
 pam_antipope_events.0012.dialogue: "\n\n– Zagarniasz urząd mieczem – mówi.\n\n– I mieczem będę go bronić – odpowiadam."
 pam_antipope_events.0012.a: "Cela może ochłodzić tę dumę."
 pam_antipope_events.0012.b: "Dwie głowy to już potwór; jednej trzeba się pozbyć."
 pam_antipope_events.0012.c: "Było wystarczająco dużo niezgody. Niech odejdzie w pokoju."
 pam_antipope_events.0012.d: "[pam_ch_hof_new_hof.GetFirstName] wykrzyczy imię, jakie nosi [ROOT.Char.GetFaith.ReligiousHeadName|l] o prawowitym mandacie."
 pam_antipope_events.0014.t: "Sąd nade mną"
 pam_antipope_events.0014.intro.judge: "– Niech wszyscy [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] będą zwolnieni z posłuszeństwa wobec ciebie – mówi [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy.christian: "– Idźcie i nie grzeszcie więcej – mówi [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy: "– Idźcie i nie wracajcie na tę ścieżkę – mówi [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.desc.condemned.christian: "\n\nSprawiedliwość wielbić mi było dane, a bezprawie nienawidzić, dlatego umieram."
 pam_antipope_events.0014.desc.condemned: "\n\nUmieram za to, co uważam za prawdę."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U] i [pam_ch_hof_judge.Custom('PL_jego_jej')] ludzie drwią ze mnie, biczując moje ciało. Jestem tylko plewą, ziarno zostało wymłócone."
 pam_antipope_events.0014.desc.captive.christian: "\n\nDali mi celę. Zawsze mi mówiono, że święty człowiek niczego więcej nie potrzebuje."
 pam_antipope_events.0014.desc.captive: "\n\nDali mi komórkę. Nie mogę mieć nic więcej."
 pam_antipope_events.0014.desc.spared.christian: "\n\nZdaje się, że kamienie pozostaną w ich dłoniach, a ja odejdę wolno. Nie wolno mi zmarnować tego miłosierdzia."
 pam_antipope_events.0014.desc.spared: "\n\nZdaje się, że odejdę wolno. Nie wolno mi zmarnować tego miłosierdzia."
 pam_antipope_events.0014.desc.generic: "\n\nWyrok zapadł. To, co będzie dalej, zależy ode mnie."
 pam_antipope_events.0014.a: "Niech mój ród zostanie zapamiętany jako wierny woli [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_antipope_events.0014.b: "Ich dłonie pozostaną splamione."
 pam_antipope_events.0014.b.toast: "Masz modyfikator „[GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]”"
 pam_antipope_events.0014.c: "Chroń mój dom przed tym wstydem."
 pam_antipope_events.0014.d: "[ROOT.Char.GetFaith.ReligiousHeadName] o prawowitym mandacie zasługuje na pokój ze mną."
 pam_antipope_events.0014.e: "Zło, którego nauczyła mnie osoba znana jako [pam_ch_hof_judge.GetTitledFirstNameNoTooltip], w czyn przekuję."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "Będę chodzić boso, dopóki moja pokuta się nie skończy."
 pam_antipope_events.0015.opening: "Do osoby, którą jest [ROOT.Char.GetTitledFirstNameNoTooltip], wyznającej wiarę znaną jako [ROOT.Char.GetFaith.GetNameNoTooltip|l]."
 pam_antipope_events.0015.desc.defender_victory.christian: "Wiedzcie, że schizmatycki bunt przeciwko osobie, którą jest [ROOT.Char.GetFaith.ReligiousHeadName], został stłumiony. Pozycja pretendenta legła w gruzach, a obrządek o nazwie [ROOT.Char.GetRite.GetName|l] trwa niewzruszony. Niech żaden książę ani prałat nie wątpi, komu winien jest wierność."
 pam_antipope_events.0015.desc.defender_victory: "Wiedzcie, że bunt przeciwko osobie, którą jest [ROOT.Char.GetFaith.ReligiousHeadName], został stłumiony. Pozycja pretendenta legła w gruzach, a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] trwają niewzruszeni. Niech żaden władca nie wątpi, komu winien jest wierność."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Wiedzcie, że konflikt o władzę, którą dzierży [ROOT.Char.GetFaith.ReligiousHeadTitleName] dobiegł końca. Udało mi się wyzwolić tron spod jarzma szatana. Niech wyznawcy obrządku o nazwie [ROOT.Char.GetRite.GetName|l] podporządkują się mojej woli."
 pam_antipope_events.0015.desc.attacker_victory: "Wiedzcie, że konflikt o władzę, którą dzierży [ROOT.Char.GetFaith.ReligiousHeadTitleName] dobiegł końca. Urząd należy do mnie, a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] niech podporządkują się mojej woli. Wierni mają wiedzieć, że odtąd rządzi [ROOT.Char.GetFaith.ReligiousHeadName|l] w nowej osobie."
 pam_antipope_events.0015.a: "Niech tak będzie."
