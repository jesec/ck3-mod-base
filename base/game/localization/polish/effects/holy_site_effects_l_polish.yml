l_polish:
 make_holy_site_eminent_global: "[HolySite.GetName] to [eminent_holy_site|El] wiary o nazwie [FAITH.GetName|l]"
 make_holy_site_eminent_third: "$make_holy_site_eminent_global$"
 make_holy_site_eminent_global_past: "[HolySite.GetName] to [eminent_holy_site|El] wiary o nazwie [FAITH.GetName|l]"
 make_holy_site_eminent_third_past: "$make_holy_site_eminent_global_past$"
 make_holy_site_not_eminent_global: "[HolySite.GetName] to nie będzie już [eminent_holy_site|El] wiary o nazwie [FAITH.GetName|l]"
 make_holy_site_not_eminent_third: "$make_holy_site_not_eminent_global$"
 make_holy_site_not_eminent_global_past: "[HolySite.GetName] to już nie [eminent_holy_site|El] wiary o nazwie [FAITH.GetName|l]"
 make_holy_site_not_eminent_third_past: "$make_holy_site_not_eminent_global_past$"
 remove_holy_site_global: "[HolySite.GetName] – to miejsce nie jest już [Concept('holy_site', 'miejscem świętym')|E] wiary znanej jako [FAITH.GetName|l]"
 remove_holy_site_third: "$remove_holy_site_global$"
 remove_holy_site_global_past: "[HolySite.GetName] – temu miejscu odebrano rangę [Concept('holy_site', 'miejsca świętego')|E] wiary znanej jako [FAITH.GetName|l]"
 remove_holy_site_third_past: "$remove_holy_site_global_past$"
 add_holy_site_global: "[HolySite.GetName] – to miejsce zostaje uznane za [holy_site|El] wiary znanej jako [FAITH.GetName|l]"
 add_holy_site_third: "$add_holy_site_global$"
 add_holy_site_global_past: "[HolySite.GetName] – to miejsce uznano za [holy_site|El] wiary znanej jako [FAITH.GetName|l]"
 add_holy_site_third_past: "$add_holy_site_global_past$"
 add_eminent_holy_site_global: "[HolySite.GetName] to [eminent_holy_site|El] wiary o nazwie [FAITH.GetName|l]"
 add_eminent_holy_site_third: "$add_eminent_holy_site_global$"
 add_eminent_holy_site_global_past: "[HolySite.GetName] to [eminent_holy_site|El] wiary o nazwie [FAITH.GetName|l]"
 add_eminent_holy_site_third_past: "$add_eminent_holy_site_global_past$"
