 msg_passive_learned_tenet_desc: "Obserwując, jak [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], praktykuje [core_tenet|El] „[passive_learn_tenet.GetBaseName]” [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_source.GetRite.GetName|l], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tymże dogmacie."
