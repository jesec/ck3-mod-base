l_polish:
 msg_passive_learned_rite: "Poznano obrządek: [LEFT_CHARACTER.GetRite.GetNameNoTooltip|l]"
 msg_passive_learned_rite_desc: "Po długich obserwacjach osoby, którą jest [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenets', 'dogmatach')|E] i [Concept('doctrines', 'doktrynach')|E] [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_source.GetRite.GetName|l]."
