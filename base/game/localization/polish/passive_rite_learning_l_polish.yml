 msg_passive_learned_tenet_cranial_trophies_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i przestrzega [Concept('core_tenet', 'dogmatu')|E] „[passive_learn_tenet.GetBaseName]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o ponurym przeznaczeniu tegoż dogmatu."
 msg_passive_learned_tenet_ritual_cannibalism_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i przestrzega zasad [Concept('core_tenet', 'dogmatu')|E] „[passive_learn_tenet.GetBaseName]”, więc na jej warunkach zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tymże dogmacie."
 msg_passive_learned_tenet_human_sacrifice_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName|l] i przeprowadziła w twojej obecności ceremonię [Concept('core_tenet', 'dogmatu')|E] „[passive_learn_tenet.GetBaseName]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tymże dogmacie."
 msg_passive_learned_tenet_warmonger_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i żyje według zasad [Concept('core_tenet', 'dogmatu')|E] „[passive_learn_tenet.GetBaseName]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o logice tegoż dogmatu."
 msg_passive_learned_tenet_takamin_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i codziennie praktykuje [core_tenet|El] „[passive_learn_tenet.GetBaseName]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o rytmach tegoż dogmatu."
 msg_passive_learned_tenet_exaltation_of_pain_desc: "Obserwując osobę wyznającą [rite|El] o nazwie [passive_learn_source.GetRite.GetName|l] znaną jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]”, choć wprawia cię to w niepokój."
 msg_passive_learned_tenet_sacrificial_ceremonies_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName|l] i szczegółowo, krok po kroku, zapoznaje cię z [Concept('core_tenet', 'dogmatem')|E] „[passive_learn_tenet.GetBaseName]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tymże dogmacie."
 msg_passive_learned_tenet_gruesome_festivals_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName|l] i pokazała ci, czym jest [core_tenet|El] „[passive_learn_tenet.GetBaseName]” w całej jego okazałości, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tymże dogmacie."
 msg_passive_learned_tenet_adorcism_desc: "Obserwując osobę wyznającą [rite|El] o nazwie [passive_learn_source.GetRite.GetName|l] znaną jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], zdobywasz na jej warunkach [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]”."
 msg_passive_learned_tenet_hedonistic_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i czerpie przyjemność z przestrzegania [Concept('core_tenet', 'dogmatu')|E] „[passive_learn_tenet.GetBaseName]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o atrakcyjności tegoż dogmatu."
 msg_passive_learned_doctrine: "Poznano doktrynę: „[RIGHT_DOCTRINE.GetDescriptiveNameNoTooltip( GetPlayer.GetFaith )]”"
 msg_passive_learned_doctrine_desc: "Obserwując, jak [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], żyje według zasad [Concept('doctrine', 'doktryny')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]” [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_source.GetRite.GetName|l], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tejże doktrynie."
 msg_passive_learned_doctrine_polygamy_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i żyje według zasad [Concept('doctrine', 'doktryny')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o zasadach funkcjonowania tejże doktryny."
 msg_passive_learned_doctrine_concubines_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i przestrzega [Concept('doctrine', 'doktryny')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o sposobach przedstawiania argumentów tejże doktryny."
 msg_passive_learned_doctrine_consanguinity_unrestricted_desc: "Obserwując osobę wyznającą [rite|El] o nazwie [passive_learn_source.GetRite.GetName|l] znaną jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, które nie wydaje się już tak niezwykła jak kiedyś."
 msg_passive_learned_doctrine_deviancy_virtuous_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i otwarcie praktykuje [Concept('doctrine', 'doktrynę')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, więc na jej warunkach zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tejże doktrynie."
 msg_passive_learned_doctrine_kinslaying_accepted_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName|l] i uczy cię, czym jest [doctrine|El] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tejże doktrynie, choć była to mrożąca krew w żyłach lekcja."
 msg_passive_learned_doctrine_witchcraft_virtuous_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i ściśle trzyma się [Concept('doctrine', 'doktryny')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tejże doktrynie."
 msg_passive_learned_doctrine_funeral_sky_burial_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i obserwuje [Concept('doctrine', 'doktrynę')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o znaczeniu tejże doktryny."
 msg_passive_learned_doctrine_funeral_mummification_desc: "Osoba znana jako [passive_learn_source.GetTitledFirstNameNoTooltip], a dla ciebie [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], wyznaje [Concept('rite', 'obrządek')|E] o nazwie [passive_learn_source.GetRite.GetName] i przestrzega [Concept('doctrine', 'doktryny')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”, dzięki czemu zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o zwyczajach tejże doktryny."
