 msg_hor_learned_tenet_takamin_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]”, poznając codzienny rytm praktyki [Concept('faith', 'wiary')|E] znanej jako [passive_learn_source_faith.GetName|l]."
 msg_hor_learned_tenet_exaltation_of_pain_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o niepokojącym [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]”, studiując [Concept('faith', 'wiarę')|E] znaną jako [passive_learn_source_faith.GetName|l]."
 msg_hor_learned_tenet_sacrificial_ceremonies_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]” [Concept('faith', 'wiary')|E] znanej jako [passive_learn_source_faith.GetName|l], krok po kroku zgłębiając jej praktyki."
 msg_hor_learned_tenet_gruesome_festivals_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]” [Concept('faith', 'wiary')|E] znanej jako [passive_learn_source_faith.GetName|l], obserwując jej praktyki w całej okazałości."
 msg_hor_learned_tenet_adorcism_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]”, obserwując, jak przeżywa go [faith|El] znana jako [passive_learn_source_faith.GetName|l]."
 msg_hor_learned_tenet_hedonistic_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] poznajesz atrakcyjność [Concept('core_tenet', 'dogmatu')|E] „[passive_learn_tenet.GetBaseName]”, studiując [Concept('faith', 'wiarę')|E] znaną jako [passive_learn_source_faith.GetName|l], i zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tymże dogmacie."
 msg_hor_learned_doctrine_polygamy_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]”, studiując, jak [faith|El] znana jako [passive_learn_source_faith.GetName|l] organizuje swoje gospodarstwa domowe zgodnie z nią."
 msg_hor_learned_doctrine_concubines_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]”, poznając, jak uzasadnia ją [faith|El] znana jako [passive_learn_source_faith.GetName|l]."
 msg_hor_learned_doctrine_consanguinity_unrestricted_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]”, która nie jest już ci obca dzięki lekturze tekstów poświęconych [Concept('faith', 'wierze')|E] znanej jako [passive_learn_source_faith.GetName|l]."
 msg_hor_learned_doctrine_deviancy_virtuous_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]”, obserwując, jak otwarcie praktykują ją wyznawcy [Concept('faith', 'wiary')|E] znanej jako [passive_learn_source_faith.GetName|l]."
 msg_hor_learned_doctrine_kinslaying_accepted_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] z niemałym niepokojem analizujesz, jak [faith|El] znana jako [passive_learn_source_faith.GetName|l] usprawiedliwia [Concept('doctrine', 'doktrynę')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]”, przez co zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o tejże doktrynie."
 msg_hor_learned_doctrine_witchcraft_virtuous_desc: "Jako głowa [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_hor.GetRite.GetName|l] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]”, studiując, jak ściśle trzyma się jej [faith|El] znana jako [passive_learn_source_faith.GetName|l]."
