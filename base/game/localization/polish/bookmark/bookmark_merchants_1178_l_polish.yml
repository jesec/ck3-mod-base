l_polish:
 bm_1178_merchants: "Gwelfowie i gibelini"
 bm_1178_merchants_desc: "Konflikt między gwelfami a gibelinami narasta od dawna. Począwszy od sporu o inwestyturę pod koniec XI wieku, waśń ta tli się przez całe stulecie.\n\nWraz z objęciem tronu cesarskiego przez Fryderyka Barbarossę konflikt nasilił się, a całe Włochy muszą teraz opowiedzieć się po jednej ze stron. Gibelini stoją po stronie cesarza, a gwelfowie po stronie papieża w Rzymie.\n\n#bold Konflikt szaleje zarówno w obrębie włoskich republik, jak i między nimi. Wybierz stronę w tym sporze i poprowadź ją do zwycięstwa.#!"
 bookmark_merchants_1178_marco_sanudo: "Marco Sanudo"
 bookmark_merchants_1178_marco_sanudo_subheading: "Patrycjusz z Wenecji"
 bookmark_merchants_1178_enrico_dandolo: "Enrico Dandolo"
 bookmark_merchants_1178_marco_sanudo_desc: "Rodzina Sanudów należy do najstarszych rodów szlacheckich Wenecji. Przypuszcza się, że jest spokrewniona z legendarnym rodem Candianich, którego członkowie wielokrotnie sprawowali urząd doży w okresie największej potęgi tego klanu.\n\nMarco jest młodym potomkiem stojącym na czele rodziny po śmierci ojca. Jest też blisko związany ze swoim wujem Enrico Dandolo, człowiekiem, który przeszedł do historii jako organizator czwartej krucjaty.\n\n#bold Czy zdołasz wypełnić swoje przeznaczenie i zostać księciem Archipelagu?#!"
 bookmark_merchants_1178_humbert_savoy: "Humbert III Sabaudzki"
 bookmark_merchants_1178_humbert_savoy_subheading: "Książę Sabaudii #b #bol (gwelf)#!#!"
 bookmark_merchants_1178_thomas_savoy: "Tomasz"
 bookmark_merchants_1178_humbert_savoy_desc: "Jako książę Sabaudii Humbert dał się poznać jako człowiek pobożny, który hojnie wspierał lokalne klasztory, a po śmierci trzeciej żony na pewien czas całkowicie wycofał się z życia świeckiego.\n\nPo opowiedzeniu się po stronie gwelfów popadł w konflikt z Fryderykiem Barbarossą, w wyniku czego ziemie Humberta zostały nie tylko zajęte, lecz także splądrowane.\n\n#bold Czy zdołasz ochronić ziemie sabaudzkie przed cesarzem?#!"
 bookmark_merchants_1178_guido_guerra: "Guido Guerra III"
 bookmark_merchants_1178_guido_guerra_subheading: "Hrabia Casentino #color_yellow #bol (gibelin)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "Rinaldo"
 bookmark_merchants_1178_guido_guerra_desc: "Guidi przez wieki byli hrabiami w górnym biegu Arno i mało który ród w Toskanii może poszczycić się dłuższą linią.\n\nGuido Guerra spędził życie w służbie cesarskiej – brał udział w oblężeniu Mediolanu, a przywilej nadany przez Barbarossę potwierdza przysługujące Guidowi prawa i należące do niego zamki oraz kopalnie po obu zboczach Apeninów.\n\n#bold Czy zdołasz sprawić, by twoje hrabstwo zapisało się w historii?#!"
 bookmark_merchants_1178_speronella_dalesmanni: "Speronella Dalesmanni"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Patrycjuszka z Padwy #b #bol (gwelfka)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "Ezzelino da Romano"
 bookmark_merchants_1178_pietro_iii: "Pietro Traversari"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "Jako nastolatka Speronella została porwana przez padewskiego wikariusza cesarskiego Pagano della Torre. Kiedy w końcu została uwolniona przez swojego brata, wikariusz został obalony, a wraz z jego upadkiem Padwa stała się wolnym miastem.\n\n#bold Czy jako wolna kobieta zdołasz wykorzystać swój legendarny status, by przekuć go we władzę polityczną lub fortunę?#!"
 bookmark_merchants_1178_konrad_urslingen: "Konrad von Urslingen"
 bookmark_merchants_1178_konrad_urslingen_subheading: "Książę Spoleto #color_yellow #bol (gibelin)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "Jutta"
 bookmark_merchants_1178_konrad_urslingen_desc: "Konrad, młody niemiecki książę rządzący włoskim księstwem z woli cesarza, sprawuje władzę nad Spoleto – miastem położonym w samym sercu półwyspu, gdzie krzyżują się wszystkie drogi biegnące z północy na południe. Jego władza opiera się na cesarskiej łasce, ale imperator przebywa daleko, po drugiej stronie Alp.\n\n#bold Czy uda ci się podporządkować sobie centrum włoskiego półwyspu, czy też lud odrzuci twoje rządy?#!"
