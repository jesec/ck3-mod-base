l_polish:
 bm_1066_merchants: "Kanały handlowe"
 bm_1066_merchants_desc: "Dobrze funkcjonujące państwo musi nie tylko być w stanie się utrzymać, ale też zapewniać przepływ towarów. Władca nie wygrywa wszak kampanii prawem urodzenia: za broń, zapasy i pomoc z zewnątrz na potrzeby armii płaci się złotem.\n\nZa każdą transakcją kryją się kupcy prowadzący karawany i statki wzdłuż legendarnych szlaków. Jeśli nie spotkają się z należytym uznaniem, sami znajdą sobie miejsce i stworzą własne miasto – takie, w którym władza należy do mieszkańców.\n\n#bold Czy zdołasz poprowadzić swój ród, by zdominować rynek i utrzymać imperium handlowe, gdy miarą władzy stanie się zamożność?"
 bookmark_merchants_domenico_contarini: "Domenico Contarini"
 bookmark_merchants_domenico_contarini_subheading: "Doża Wenecji"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "ibn Dżarada"
 bookmark_merchants_ibn_jarada_subheading: "Kupiec z Bagdadu"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "Sūn Zhōng"
 bookmark_merchants_sun_zhong_subheading: "Kupiec z Mingzhou"
 bookmark_merchants_sun_zhong_desc: "Port w Mingzhou leży tam, gdzie rzeka Song wpada do Morza Wschodniego, Sūn Zhōng natomiast został człowiekiem, który dba o jego ożywiony ruch. Z jego magazynów do Japonii i Goryeo wyruszają jedwab i porcelana; w drugą stronę płyną kadzidło i srebro. Urzędnicy pobierający podatki od handlu nauczyli się, że podarunek w odpowiednim momencie jest tańszy niż raport.\n\n#bold Wschodni brzeg Jedwabnego Szlaku to port, a nie szlak karawanowy. Czy uda ci się uczynić ród Sūnów tak potężnym, że żaden dwór nie będzie w stanie go powstrzymać?#!"
 bookmark_merchants_vitale_faliero: "Vitale Faliero"
 bookmark_merchants_vitale_faliero_subheading: "Szlachcic z Wenecji"
 bookmark_merchants_vitale_faliero_desc: "Ród Faliero należy do najambitniejszych rodów kupieckich w Wenecji, a Vitale zapuścił się ze swoją kompanią dalej na wschód, niż odważył się to zrobić którykolwiek z jego rywali. Bizantyjskie szlaki handlowe, normańskie naciski na Adriatyku oraz zawistni rywale w radach miasta – z każdej strony czuć presję.\n\n#bold Wenecja leży na rozdrożu dwóch światów. Czy pokierujesz rodem Faliero tak, aby zapanował nad nimi obydwoma?#!"
 bookmark_merchants_wuhsha_al_dallala: "Wuhsha al-dallala"
 bookmark_merchants_wuhsha_al_dallala_subheading: "Właścicielka lombardu z Kairu"
 bookmark_merchants_wuhsha_al_dallala_desc: "Jako kobieta niezwykle zamożna Wuhsha al-dallala skrupulatnie śledzi zarówno stan swojego majątku, jak i listę wrogów.\n\nJej niezależny charakter kosztował ją wykluczenie z synagogi. Wuhsha jednak cechuje się cierpliwością i czeka na odpowiedni moment, by zemścić się na tych, którzy ją skrzywdzili.\n\n#bold Czy masz to, czego potrzeba, by wykorzystać pożyczki do upokorzenia przeciwników?#!"
 bookmark_merchants_greek_salvidi_1: "Hillel Salvidi"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "Abu Sa’id"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "Syn Wuhshy"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "Nattal Sahu"
 bookmark_merchants_nattal_sahu_subheading: "Książę kupców z Delhi"
 bookmark_merchants_nattal_sahu_desc: "Na rynkach Yoginipuru miano Sahu wzbudza szacunek. Nattal, przywódca dżinijskiej społeczności kupieckiej w Delhi oraz zaufany doradca króla Anangapala II z dynastii Tomara, utkał sieć handlową rozciągającą się od zachodnich portów aż po rynki Bengalu.\n\n#bold Czy mając zaufanie króla i bystrość kupca, zdołasz zbudować coś, co przetrwa dłużej niż one?#!"
 bookmark_merchants_new_merchant_company: "Własna postać"
 bookmark_merchants_new_merchant_company_subheading: "Kupiec z Jedwabnego Szlaku"
 bookmark_merchants_new_merchant_company_desc: "Jedwabny Szlak nie należy do cesarzy ani królów. Należy do tych, którym nie brak odwagi, by go przemierzać.\n\nZałóż własną kompanię kupiecką na skrzyżowaniu Wschodu i Zachodu. Zbuduj imperium handlowe, karawana po karawanie, nawiązując kontakty w różnych miejscach – od bazarów Samarkandy aż po porty Morza Śródziemnego.\n\n#bold Czy imię twego rodu będzie odbijać się echem w setkach miast?#!"
