 greeting_supplimentary.negative.tales: "Opowieści o twoich występkach przekazywane są od Irlandii po Chiny."
 greeting_supplimentary.negative.greek: "Twoja tragiczna postać jest tematem greckich sztuk!"
 greeting_supplimentary.negative.insult.1: "Niech twoje soki wysuszą cię na wiór!"
 greeting_supplimentary.negative.insult.2: "Niech twoje życie będzie krótkie i nieszczęśliwe!"
 greeting_supplimentary.negative.insult.3: "Niech mądrość zawsze pozostanie Wam obca!"
 greeting_supplimentary.negative.insult_muslim.1: "Bądź przeklęty do siódmego pokolenia!"
 greeting_supplimentary.negative.insult_muslim.2: "Obyś został[Select_CString( second.IsFemale, 'a', '' )] zaszyt[Select_CString( second.IsFemale, 'a', 'y' )] żywcem w brzuchu martwego wielbłąda!"
 greeting_supplimentary.negative.insult_muslim.3: "Niech Allah zniszczy twój ród!"
 greeting_supplimentary.negative.insult_muslim.4: "Ty dzieciaku parszywego psa!"
 greeting_supplimentary.negative.insult_muslim.5: "Niech szakale walczą o twoje niezagrzebane kości."
 greeting_supplimentary.negative.insult_muslim.6: "Niech twoje studnie wypełnią się piaskiem, a namioty skorpionami."
 greeting_supplimentary.negative.insult_christian.1: "Niech święci się od ciebie odwrócą."
 greeting_supplimentary.negative.insult_christian.2: "Twoje imię zostanie wymazane z każdej modlitwy."
 greeting_supplimentary.negative.insult_norse.1: "Niech twoi przodkowie spluną na twój cień."
 greeting_supplimentary.negative.insult_norse.2: "Twoja odwaga jest kruchsza niż zimowy lód."
 greeting_supplimentary.negative.insult_byzantine.1: "Nawet szczury z Konstantynopola uciekają przed twoim smrodem."
 greeting_supplimentary.negative.insult.4: "Niech twoje pola leżą odłogiem, a studnie wysychają."
 greeting_supplimentary.negative.insult.unreliable_swine: "Ty niegodna zaufania świnio."
 greeting_supplimentary.negative.insult.oathbreaker: "Wciąż łżesz i krzywoprzysięgasz."
 greeting_supplimentary.negative.insult_jewish.1: "Niech twoje imię zostanie wymazane z księgi życia."
 greeting_supplimentary.negative.insult_zoroastrian.1: "Niech ciemność zdusi ogień, który podobno pielęgnujesz."
 greeting_supplimentary.negative.insult_hindu.1: "Odsuwasz się od drogi prawości – a ja zepchnę cię jeszcze dalej."
 greeting_supplimentary.negative.insult_christian.3: "Niech piekło przyjmie cię z szeroko otwartymi ramionami."
 greeting_supplimentary.negative.insult_norse.3: "Niech kruki posilą się obficie twoimi zmarłymi."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "Błogosławieństwo dla ciebie i twojego rodu!"
 greeting_supplimentary.positive.flattery.2: "Twoja mądrość i miłosierdzie są legendarne."
 greeting_supplimentary.positive.flattery.3: "Pokój z tobą!"
 greeting_supplimentary.positive.flattery.4: "Żyj w harmonii i zadowoleniu!"
 greeting_supplimentary.positive.flattery.5: "Twoja bezwzględność jest godna pozazdroszczenia!"
 greeting_supplimentary.positive.flattery.6: "Twoje niemal nienasycone pragnienia znane są na całym świecie!"
 greeting_supplimentary.positive.flattery.7: "Twoja sława wyprzedza Cię w każdym kraju."
 greeting_supplimentary.positive.flattery.8: "Niech Twój ród przetrwa tysiąc lat."
 greeting_supplimentary.positive.flattery.9: "Niech Bóg umocni rękę, którą trzymasz miecz."
 greeting_supplimentary.positive.flattery.10: "Niech pokój i dobrobyt zapanują w Twoim domu."
 greeting_supplimentary.positive.flattery.11: "Niech szczęście sprzyja Twoim sztandarom."
 greeting_supplimentary.positive.flattery_chinese.1: "Niech niebiosa Ci błogosławią."
 greeting_supplimentary.positive.flattery_chinese.2: "Niech Twoje ziemie zawsze kwitną."
 greeting_supplimentary.positive.flattery_chinese.3: "Niech siła i wigor towarzyszą Twoim rządom."
 greeting_supplimentary.positive.flattery_norse.1: "Niech bogowie obdarzą Cię sprzyjającymi wiatrami i tłustym bydłem."
 greeting_supplimentary.positive.flattery_byzantine.1: "Niech blask Miasta oświetli Twój dom."
 greeting_supplimentary.positive.flattery_jewish.1: "Niech Święty obdarzy twój dom pokojem."
 greeting_supplimentary.positive.flattery.12: "Twoja mądrość jest światłem dla poszukujących rady."
 greeting_supplimentary.positive.flattery.13: "Niech niebiosa Ci sprzyjają."
