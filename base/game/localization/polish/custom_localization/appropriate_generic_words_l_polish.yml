 #Food and drink glosses
 ABALONE_GLOSS: "Ceniony skorupiak o jędrnym, soczystym mięsie."
 SEA_CUCUMBER_GLOSS: "Miękkie zwierzę morskie wykorzystywane jako przysmak w chińskiej kuchni wykwintnej."
 SWALLOW_NEST_GLOSS: "Rzadkie ptasie gniazdo rozpuszczone w luksusowej zupie."
 ENTREMETS_GLOSS: "Wyszukany deser lub niespodzianka podawana między daniami."
 MOCHI_GLOSS: "Sprężyste ciasto z rozgniecionego kleistego ryżu."
 DURIAN_GLOSS: "Duży owoc tropikalny słynący z intensywnego zapachu i bogatego, kremowego miąższu."
 AQUA_VITAE_GLOSS: "Wysokoprocentowy trunek ceniony jako napój leczniczy."
 TRIBUTE_CHILLED_TEA_GLOSS: "Szlachetna herbata schłodzona lodem lub śniegiem i wysyłana jako reprezentacyjny podarek."
 EMPEROR_TEA_GLOSS: "Najszlachetniejsze liście herbaty cesarskiej zarezerwowane dla dworu."
 BAIJIU_GLOSS: "Mocny chiński trunek destylowany ze zboża."
 HANAKUSA_GLOSS: "Pochodząca z Japonii mieszanka ziołowa składająca się z kwiatów i liści."
 PEARL_POWDER_GLOSS: "Mielona perła stosowana jako kosztowny tonik."
 CHRYSANTHEMUM_BEER_GLOSS: "Delikatny trunek o smaku chryzantemy."
 SHARBAT_GLOSS: "Słodzony napój owocowy, często schłodzony i przyprawiony."
 SAMBUSA_GLOSS: "Smażone ciasto nadziewane przyprawionym mięsem lub warzywami."
 PAKHALA_GLOSS: "Orzeźwiający przysmak ze wschodnich Indii przygotowywany ze sfermentowanej wody ryżowej."
 PILAU_GLOSS: "Ryż gotowany z dodatkiem przypraw oraz mięsa lub warzyw."
 PASTILLA_GLOSS: "Placek z Maghrebu – przyprawione mięso zawinięte w cienkie ciasto."
 BOTUO_GLOSS: "Chińska zupa z grubymi kluskami pszennymi lub makaronem."
 SPHOUNGATA_GLOSS: "Omlet z ubitych jaj w stylu bizantyjskim."
 TARICHOS_GLOSS: "Solone i suszone ryby – podstawa kuchni bizantyjskiej."
 BING_GLOSS: "Placek lub naleśnik z Chin."
 MANTOU_GLOSS: "Miękka, gotowana na parze bułka pszenna z Chin."
 ZOSUI_GLOSS: "Japońska owsianka ryżowa gotowana w bulionie."
 KIMCHI_GLOSS: "Koreańskie warzywa sfermentowane z dodatkiem soli i przypraw."
 BUBUR_GLOSS: "Owsianka ryżowa z archipelagu malajskiego."
