 action_adult_player_heir_not_married_desc: "Tw[Select_CString( recipient.IsFemale, 'oja', 'ój' )] [Select_CString(recipient.IsFemale, Concept('player_heir', 'następczyni'), Concept('player_heir', 'następca'))] [recipient.GetUINameNotMe] nie ma [Select_CString(recipient.IsFemale, Concept('spouse', 'małżonka'), Concept('spouse', 'małżonki'))].\n\n$GENERAL_MARRIAGE_ACTION_HEIR_HELP$"
