 action_too_few_spouses_label: "$action_too_few_spouses$"
 action_too_few_spouses_desc: "Nie masz odpowiedniej liczby [Concept( 'spouses', 'małżonek' )|E] zgodnie z zasadami twojej [Concept( 'faith', 'wiary' )|E].\n\n#help Weź ślub, aby zanegować karę do [Concept( 'piety', 'pobożności' )|E], którą obecnie ponosisz.#!"
 action_too_few_spouses_click: "#I Kliknij, aby zobaczyć potencjalne małżonki na swoim dworze#!"
 action_grand_wedding_can_marry: "Zaręczeni mogą wziąć wielki ślub"
 action_grand_wedding_can_marry_label: "$action_grand_wedding_can_marry$"
 action_grand_wedding_can_marry_desc: "Możesz teraz zorganizować [GetActivityType( 'activity_wedding' ).GetName|l] dla [Concept( 'betrothed', 'zaręczonych' )|E] ([secondary_recipient.GetUINameNotMe] i [secondary_actor.GetUINameNotMe]).\n\n#help Chociaż nadal możesz zerwać zaręczyny, generalnie najlepiej jest dotrzymać obietnicy, ponieważ w przeciwnym razie grozi to poważnymi konsekwencjami.#!\n\nMasz [GetGameTimeDifferenceForDiffDays( actor.MakeScope.VarRemaining( 'promised_grand_wedding_marriage_countdown' ) )] na spełnienie swojej obietnicy."
 action_grand_wedding_can_marry_click: "#I Kliknij, aby zorganizować wielki ślub#!"
 action_can_choose_lifestyle: "Nie wybrano [Concept( 'lifestyle', 'stylu życia' )|E]"
