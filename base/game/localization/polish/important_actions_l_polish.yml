 action_send_yourself_to_university_click: "#I Kliknij, aby uczęszczać na uniwersytet#!"
 action_send_yourself_to_university_desc: "Możesz uczęszczać na uniwersytet\n\n#help Na terenie twojego [Concept('realm', 'państwa')|E] znajduje się [building|El] [Concept('holy_site', 'miejsca świętego')|E], taka jak [GetBuilding('holy_site_cathedral_01').GetName|l], [GetBuilding('generic_university').GetName|l] lub [realm_capital|El] o nazwie [GetTitleByKey('h_china').GetName]! Uczęszczanie na uniwersytet w ramach własnej [Concept('education', 'edukacji')|E] jest korzystne, ponieważ poprawi wyniki twojej nauki.#!"
