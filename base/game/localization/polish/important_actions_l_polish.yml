 action_legal_meddling_label: "@unpressed_claim! Jako [actor.GetLiege.GetDiarchTitle|l] możesz wysuwać roszczenia wobec hrabstw należących do osoby, którą jest [recipient.GetUINameNotMeNoTooltip], a dla ciebie [actor.Custom2('RelationToMe', recipient)] (#low @soldier_icon! [recipient.GetMilitaryStrengthText]#!)"
