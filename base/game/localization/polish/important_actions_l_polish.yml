 action_shift_privileges_combined_label: "[actor.Custom2('RelationToMe', recipient)] twojej osoby, [recipient.GetUINameNotMeNoTooltip] – #low @soldier_icon! [recipient.GetMilitaryStrengthText]#!"
 action_shift_privileges_desc: "Jako [actor.GetLiege.GetDiarchTitle|l], możesz sprzedawać fałszywe pozwolenia, certyfikaty i inne dokumenty dotyczące ziem swoich [Concept( 'vassals', 'wasali' )|E], aby generować [gold|El].$action_shift_privileges_help$"
