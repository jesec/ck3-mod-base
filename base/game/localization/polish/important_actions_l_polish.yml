 action_laamp_apprehension_threat_desc: "Twój [camp|El] znajduje się na terytorium [Concept('realm', 'państwa')|E] należącego do postaci, którą jest [actor.GetShortUINameNotMe] i która uważa cię za [Concept('criminal', 'przestępcę')|E]$action_laamp_apprehension_threat_HELP$"
 action_laamp_apprehension_threat_HELP: "\n\n#help Osoba ta może spróbować [Concept('imprison', 'uwięzić')|E] cię siłą oraz rozwiązać twój [camp|El]. Przyjmowanie [Concept('task_contracts', 'kontraktów')|E] na tych ziemiach nie jest możliwe.\n\nJeśli nie masz wystarczających sił, aby zaangażować się w [Concept('war', 'wojnę')|E], należy rozważyć opuszczenie tego [Concept('realm', 'państwa')|E]#!"
 action_laamp_apprehension_threat_combined_label: "Uciekinier w miejscu o nazwie [actor.GetPrimaryTitle.Custom('GetTierIcon')] [actor.GetPrimaryTitle.GetBaseNameNoTier|V] ([actor.GetTitledFirstNameRegnal])"
 action_laamp_apprehension_threat_combined_group_label: "@prison_icon! Jesteś uciekinierem w miejscu o nazwie [apprehender.GetPrimaryTitle.GetDefinitiveNameNoTooltip|V]"
 action_laamp_apprehension_threat_combined_group_name: "$action_laamp_apprehension_threat$"
 action_laamp_apprehension_threat_combined_group_description: "Kilku lokalnych [Concept('rulers', 'władców')|E] uznaje cię za [Concept('criminal', 'przestępcę')|E]$action_laamp_apprehension_threat_HELP$"
 action_laamp_apprehension_threat_click: "#I Kliknij, aby przenieść obóz#!"
 action_laamp_camp_purpose: "Dostępny [camp_purpose|El]"
 action_laamp_camp_purpose_click: "#I Kliknij, aby wybrać cel obozowania#!"
 action_laamp_camp_purpose_desc: "Możesz wybrać [camp_purpose|El] dla swojego [Concept('camp', 'obozu')|E].\n\n#help Zmiana [Concept('camp_purpose', 'celu obozu')|E] na inny może pomóc ci wyspecjalizować twój [camp|El] w wybranym kierunku i odblokować specjalne [domicile_buildings|El], bardziej precyzyjnie dobrane [task_contracts|El], a także, w niektórych przypadkach, unikalne [interactions|El] lub [casus_bellis|El]."
 action_laamp_camp_purpose_label: "@prison_icon! Uciekinier w miejscu o nazwie [apprehender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|V] ([actor.GetTitledFirstNameRegnal])"
 action_ep3_can_ask_hof_for_influence: "@influence_icon! Możesz poprosić głowę swojej wiary o wpływ"
 action_ep3_can_ask_hof_for_influence_label: "$action_ep3_can_ask_hof_for_influence$"
 action_ep3_can_ask_hof_for_influence_desc: "[recipient.GetUINameNotMe], twoja [head_of_faith|El], przyjmie podczas negocjacji ofertę dotyczącą [Concept('influence', 'wpływu')|E].\n\n#help Dzięki temu możesz wykorzystać swoje punkty [Concept('piety', 'pobożności')|E] do zdobycia punktów [Concept('influence', 'wpływu')|E], z pomocą których zyskasz przydatny modyfikator [Concept('house', 'rodu')|E]!#!"
 action_ep3_can_ask_hof_for_influence_click: "#I Kliknij, aby użyć interakcji „$ep3_hof_ask_for_influence_interaction$”#!"
 action_ep3_laamp_contract_travel: "@task_contract_icon! Możliwe przeniesienie obozu celem znalezienia nowych kontraktów"
 action_ep3_laamp_contract_travel_label: "@task_contract_icon! Przenieś obóz, aby znaleźć nowe kontrakty"
 action_ep3_laamp_contract_travel_desc: "Jeśli w twoim regionie skończyły się zlecenia lub jeśli szukasz bardziej ekscytującego zatrudnienia, możesz odbyć [travel|El] wraz ze swoim [Concept('camp', 'obozem')|E], aby odnaleźć nowe [Concept('task_contracts', 'kontrakty')|E].\n\n#help Upewnij się, że odbędziesz [travel|El] na odpowiedni dystans – z reguły niezbędne minimum to dwa [duchies|El] [de_jure|El] od twojego ostatniego miejsca obozowania.#!"
 action_ep3_laamp_contract_travel_click: "#I Kliknij, aby wyświetlić sugerowany cel podróży obozu#!"
 action_in_debt_landless: "$action_in_debt$"
 action_in_debt_landless_label: "$action_in_debt_label$"
 action_in_debt_landless_desc: "Masz mniej niż [gold_i|E] #V 0#! [Concept('gold', 'złota')|E], co oznacza [debt|El]!\n\nDług powoduje skutki:\n$BULLET_WITH_TAB$Nie można wypowiedzieć [Concept('war', 'wojny')|E].\n$BULLET_WITH_TAB$Nie można uzupełnić [Concept('men_at_arms', 'zbrojnych')|E] za pomocą [gold_i|E] [Concept('gold', 'złota')|E].\n\nIm większy masz dług, tym większe wynikają z tego kary. Twój obecny poziom długu powoduje efekty:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Rozważ przyjęcie [Concept('task_contract', 'kontraktu')|E], aby zarobić trochę złota#!"
 action_in_debt_landless_click: "$action_in_debt_click$"
 action_can_hire_court_astrologer: "@court_astrologer_icon! Zatrudnij gwiaździarza"
 action_can_hire_court_astrologer_label: "@court_astrologer_icon! Nie zatrudniasz gwiaździarza"
 action_can_hire_court_astrologer_desc: "Nie zatrudniasz nikogo na [Concept('court_position', 'urzędzie dworskim')|E] astrologa. Rozważ podjęcie [Concept('decision', 'decyzji')|E] #high „$recruit_court_position_decision$”#!, żeby znaleźć astrologa.\n\n#help $court_astrologer_court_position$ pomaga w obraniu kierunku [Concept('migration', 'migracji')|E] i przyczynia się do poprawy [Concept('county_fertility', 'płodności hrabstwa')|E], a przy tym zapewnia premie do [Concept('piety', 'pobożności')|E], [Concept('stress_loss', 'redukcji stresu')|E] i [Concept('learning', 'nauki')|E].#!"
 action_can_hire_court_astrologer_click: "#I Kliknij, aby wyświetlić#!"
