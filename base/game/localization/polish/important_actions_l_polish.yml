 action_not_rightful_liege_combined_group_label: "Nieprawowity senior wasali"
 action_not_rightful_liege_combined_group_name: "[Concept('rightful_liege', 'Nieprawowity')|E] senior wielu [Concept( 'vassals', 'wasali' )|E]"
 action_not_rightful_liege_desc: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetShortUINameNotMe], nie uznaje cię za [Concept('rightful_liege', 'prawowitego seniora')|E].\n\nSprawdź, czy możesz [create|El] lub [usurp|El] tytuł, który uczyniłby cię [recipient.Custom('PL_jego_jej')] [Concept('liege', 'seniorem')|E] [de_jure|El]. Poprawi to [recipient.Custom('PL_jego_jej')] [Concept('opinion', 'opinię')|E] o tobie, jak również zwiększy wpływy z [Concept('taxes', 'podatków')|E] i ilość [Concept('levies', 'pospolitego ruszenia')|E] przekazywanych ci przez [recipient.Custom('PL_niego_nia')].\n\nJeśli nie jest to możliwe, możesz rozważyć [Concept('transferring', 'przekazanie')|E] [recipient.Custom('PL_go_jej')] innemu wasalowi, zwłaszcza jeśli wasal ten byłby [recipient.Custom('PL_jego_jej')] [Concept('rightful_liege', 'prawowitym seniorem')|E]."
 action_not_rightful_liege_combined_group_description: "Nie jesteś [Concept( 'rightful_liege', 'prawowitym seniorem' )|E] kilku swoich wasali.\n\nSprawdź, czy możesz [Concept( 'create', 'utworzyć' )|E] lub [Concept( 'usurp', 'uzurpować' )|E] tytuły, które uczynią cię ich [Concept( 'liege', 'seniorem' )|E] [de_jure|El]; poprawi to ich [Concept( 'opinion', 'opinię' )|E] o tobie, jak również zwiększy ilość [Concept( 'taxes', 'podatków' )|E] i [Concept( 'levies', 'pospolite ruszenie' )|E], które od nich otrzymujesz.\n\nJeśli nie jest to możliwe, możesz rozważyć [Concept( 'transferring', 'przekazanie' )|E] ich innemu wasalowi, zwłaszcza jeśli ten wasal byłby ich [Concept( 'rightful_liege', 'prawowitym seniorem' )|E]."
 action_not_rightful_liege_label: "$action_not_rightful_liege$"
 action_not_rightful_liege_combined_label: "[recipient.GetShortUINameNotMeNoTooltip]"
 action_not_rightful_liege_click: "#I Kliknij, aby wyświetlić [Concept( 'vassals', 'wasali' )|E], których dotyczy problem#!"
 action_being_raided: "@raid_icon! Trwa najazd"
 action_being_raided_desc: "[recipient.GetShortUINameNotMe] przeprowadza [Concept( 'raiders', 'najazd' )|E] na twoje terytorium.\n\n#help Wystaw swoje [armies|El] i pokonaj najeźdźców w [Concept( 'battle', 'bitwie' )|E], aby zapobiec dalszym najazdom, a także przeciwdziałać zmniejszeniu [Concept( 'county_control', 'kontroli' )|E] nad hrabstwem znajdującym się w twoim [Concept( 'realm', 'państwie' )|E]#!"
 action_being_raided_click: "#I Kliknij, aby przejść do armii najeźdźców#!"
 ACTION_IS_VISIBLE_READ_UNREAD: "[Select_CString( ImportantActionItem.IsRead, '#same', '#medium')] [ImportantActionItem.GetLabel]#!"
 ACTION_IS_VISIBLE_READ_UNREAD_COMBINED: "[Select_CString( ImportantActionItem.IsRead, '#same', '#medium;italic')] [ImportantActionItem.GetCombinedLabel]#!"
 action_can_ransom: "@gold_icon! Można żądać okupu za więźnia"
 action_can_ransom_combined_group_label: "@gold_icon! Można żądać okupu za więźniów"
 action_can_ransom_combined_group_name: "$action_can_ransom$"
 action_can_ransom_desc: "Możesz żądać [Concept( 'gold', 'złota' )|E] za swojego [Concept( 'prisoner', 'więźnia' )|E], którym jest [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUINameNotMe].\n\nObecnie posiada @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! złota, którego możesz zażądać.$action_can_ransom_HELP$"
 action_can_ransom_combined_group_description: "Możesz żądać okupu za swoich [Concept( 'prisoners', 'więźniów' )|E] za [Concept( 'gold', 'złoto' )|E].$action_can_ransom_HELP$"
 action_can_ransom_label: "@gold_icon!Możesz żądać okupu za: [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUINameNotMeNoTooltip], @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_can_ransom_combined_label: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.Custom('GetPrimaryTitleTierIcon')] [recipient.GetShortUINameNotMeNoTooltip] – @gold_icon! #V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_can_ransom_click: "#I Kliknij, aby żądać okupu za [Concept('prisoner', 'więźnia')|E]#!"
 action_can_ransom_HELP: "\n\n#help Jeżeli więzień stanowi dla ciebie zagrożenie, będąc na przykład [Concept( 'rival', 'rywalem' )|E], możesz nie wyrazić zgody na jego wykupienie. Masz prawo go [Concept( 'execute', 'stracić' )|E] lub pozwolić mu gnić w lochu przez resztę jego życia…#!"
 action_should_pay_ransom: "@gold_icon! Warto zapłacić okup za ważną osobę"
 action_should_pay_ransom_combined_group_label: "@gold_icon! Warto zapłacić okupy za ważne osoby"
 action_should_pay_ransom_combined_group_name: "$action_should_pay_ransom_combined_group_label$"
 action_should_pay_ransom_desc: "Osoba znana jako [secondary_recipient.Custom('GetPrimaryTitleTierIcon')] [secondary_recipient.GetShortUINameNotMe], a dla ciebie [actor.Custom2('RelationToMe', secondary_recipient)] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], została pozbawiona wolności ([secondary_recipient.Custom('PrisonTypeModifier')|l]). Grozi [secondary_recipient.Custom('PL_mu_jej')] choroba lub nawet [Concept('execute', 'stracenie')|E], jeśli pozostanie w [Concept('prison', 'więzieniu')|E]. Zapłać za [secondary_recipient.Custom('PL_niego_nia')] okup, jeśli zależy ci na [secondary_recipient.Custom('PL_jego_jej')] [Concept('health', 'zdrowiu')|E].\n\nOkup ten wynosi @gold_icon! #V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! szt. [Concept('gold', 'złota')|E].$action_should_pay_ransom_HELP$"
 action_should_pay_ransom_combined_group_description: "Ważne dla ciebie postacie są [Concept( 'imprisoned', 'uwięzione' )|E]. Możesz zapłacić za nich okup, jeżeli ich [health|El] ma dla ciebie znaczenie.$action_vassal_ransom_gives_hook_HELP$"
 action_should_pay_ransom_label: "@gold_icon! Warto zapłacić okup za osobę znaną jako [secondary_recipient.Custom('GetPrimaryTitleTierIcon')] [secondary_recipient.GetShortUINameNotMeNoTooltip], a dla ciebie [actor.Custom2('RelationToMe', secondary_recipient)] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], wynoszący @gold_icon! #V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_should_pay_ransom_combined_label: "[actor.Custom2('RelationToMe', secondary_recipient)|U] twojej osoby, [secondary_recipient.Custom('GetPrimaryTitleTierIcon')] [secondary_recipient.GetShortUINameNotMeNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)] – @gold_icon! #V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_should_pay_ransom_click: "#I Kliknij, aby zapłacić okup#!"
 action_should_pay_ransom_HELP: "\n\n#help Upewnij się, że twoi [heirs|El] są cali i zdrowi, a zwłaszcza twój [player_heir|El].\n\nChyba że akurat #EMP tak się złożyło#!, że ich [skills|El] są słabe, a któreś z młodszego rodzeństwa ma lepsze – w takim przypadku ich nieuchronna śmierć w obcym lochu jest niczym innym jak straszną tragedią…#!"
 prisontype_dungeon_mod: "[GetModifier('dungeon').GetNameWithTooltip]"
 prisontype_house_arrest_mod: "[GetModifier('house_arrest').GetNameWithTooltip]"
 action_vassal_ransom_gives_hook: "@cs_weak_hook_icon! Można zapłacić wasalowi okup za hak"
 action_vassal_ransom_gives_hook_combined_group_label: "$action_vassal_ransom_gives_hook$"
 action_vassal_ransom_gives_hook_combined_group_name: "$action_vassal_ransom_gives_hook$"
 action_vassal_ransom_gives_hook_desc: "Twój [vassal|El], osoba znana jako [secondary_recipient.Custom('GetPrimaryTitleTierIcon')] [secondary_recipient.GetShortUINameNotMe], cechuje się honorową [Concept('personality', 'osobowością')|E]. Jeśli zapłacisz za [secondary_recipient.Custom('PL_niego_nia')] okup, uzyskasz na tę osobę [hook_i] [weak_hook|El].\n\nOkup ten wynosi @gold_icon! #V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! szt. [Concept('gold', 'złota')|E].$action_vassal_ransom_gives_hook_HELP$"
 action_vassal_ransom_gives_hook_combined_group_description: "Masz [Concept('vassals', 'wasali')|E] cechujących się honorową [Concept('personality', 'osobowością')|E]. Jeśli zapłacisz za nich okup, uzyskasz na nich [hook_i] [weak_hook|El].$action_vassal_ransom_gives_hook_HELP$"
 action_vassal_ransom_gives_hook_label: "@cs_weak_hook_icon! Możesz zapłacić za twojego wasala, osobę znaną jako [secondary_recipient.Custom('GetPrimaryTitleTierIcon')] [secondary_recipient.GetShortUINameNotMeNoTooltip], okup wynoszący @gold_icon! #V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_vassal_ransom_gives_hook_combined_label: "Osoba znana jako [secondary_recipient.Custom('GetPrimaryTitleTierIcon')] [secondary_recipient.GetShortUINameNotMeNoTooltip], a dla ciebie [actor.Custom2('RelationToMe', secondary_recipient)], @gold_icon! #V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_vassal_ransom_gives_hook_click: "#I Kliknij, aby zapłacić okup#!"
 action_vassal_ransom_gives_hook_HELP: "\n\n#help Uzyskanie haka na wasala może okazać się korzystne, szczególnie jeśli chcesz zwiększyć jego [obligations|El] wobec ciebie poprzez zmianę obowiązującego go [Concept('vassal_contract', 'kontraktu wasalnego')|E] – co jest możliwe w tym przypadku!#!"
 action_vassal_ransom_gives_hook_unimportant: "@warning_icon! #X Dbaj o to tylko wtedy, gdy masz do dyspozycji złoto!#!"
 action_vassal_ransom_gives_hook_combined_unimportant: "$action_vassal_ransom_gives_hook_unimportant$"
 action_can_vassalize: "@vassal_icon! Można zwasalizować sąsiada"
 action_can_vassalize_combined_group_label: "@vassal_icon! Można zwasalizować sąsiadów"
 action_can_vassalize_combined_group_name: "$action_can_vassalize_combined_group_label$"
 action_can_vassalize_desc: "Sąsiadujący [ruler|El], [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMe], pragnie twojej ochrony i zaakceptowałby twoją propozycję [Concept( 'vassalization', 'wasalizacji' )|E].$action_can_vassalize_HELP$"
 action_can_vassalize_combined_group_description: "Możesz [Concept( 'vassalize', 'zwasalizować' )|E] sąsiadujących [Concept( 'rulers', 'władców' )|E].$action_can_vassalize_HELP$"
 action_can_vassalize_label: "@vassal_icon! [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMeNoTooltip] może zostać zwasalizowan[Select_CString( recipient.IsFemale, 'a', 'y' )]"
 action_can_vassalize_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip]"
 action_can_vassalize_click: "#I Kliknij, aby zaoferować wasalizację#!"
 action_can_vassalize_HELP: "\n\n#help Słabi [Concept( 'independent', 'niezależni' )|E] władcy mogą szukać ochrony i prosić o zostanie twoimi [Concept( 'vassal', 'wasalami' )|E]. Poszerzanie swojego [Concept( 'realm', 'państwa' )|E] bez prowadzenia [Concept( 'war', 'wojny' )|E] jest praktycznie zawsze korzystne.#!"
 action_can_propose_alliance_to_family_member: "@alliance_icon! Możesz negocjować sojusz"
 action_can_propose_alliance_to_family_member_combined_group_label: "@alliance_icon! Możesz negocjować sojusze"
 action_can_propose_alliance_to_family_member_combined_group_name: "$action_can_propose_alliance_to_family_member_combined_group_label$"
 action_can_propose_alliance_to_family_member_desc: "Ty i [recipient.GetUINameNotMe], [actor.Custom2('RelationToMe', recipient)] twojej osoby, możecie negocjować zawarcie [Concept('alliance', 'sojuszu')|E], ponieważ jesteście połączeni więzami krwi.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]\n\n#help Zachowaj jednak ostrożność! Niektóre [alliances|El] mogą przysporzyć ci więcej kłopotów niż korzyści…\n\nUpewnij się, że naprawdę chcesz tego [Concept('alliance', 'sojuszu')|E], ponieważ każdy taki sojusz niesie za sobą ryzyko udziału w jałowych konfliktach członków twojej rodziny.#!"
 action_can_propose_alliance_to_family_member_combined_group_description: "Możesz negocjować [alliances|El] z niektórymi członkami swojej [Concept( 'family', 'rodziny' )|E] lub tymi, z którymi pozostają oni w związku małżeńskim bez aranżowania nowego [Concept( 'marriage', 'małżeństwa' )|E], jako że jesteście już połączeni więzią krwi.\n\n#help Zachowaj ostrożność! Niektóre [alliances|El] mogą sprawić więcej kłopotów, niż jest to wszystko warte…\n\nUpewnij się, że naprawdę chcesz tego [Concept( 'alliance', 'sojuszu' )|E], ponieważ możesz zostać wciągnięty w jałowe konflikty członków swojej rodziny.#!"
 action_can_propose_alliance_to_family_member_label: "@alliance_icon! Ty i [recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip], [actor.Custom2('RelationToMe', recipient)] twojej osoby, możecie negocjować zawarcie sojuszu – #low @soldier_icon! [recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
 action_can_propose_alliance_to_family_member_combined_label: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip] – #low @soldier_icon! [recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
 action_can_propose_alliance_to_family_member_click: "#I Kliknij, aby negocjować sojusz#!"
 action_can_propose_alliance_to_family_member_combined_unimportant: "@warning_icon! #X Nie będziesz w stanie wezwać ich na wojnę#!"
 action_can_propose_alliance_to_family_member_unimportant: "@warning_icon! #X Nie będziesz w stanie wezwać [Select_CString( recipient.IsFemale, 'jej', 'go' )] na wojnę#!"
 action_can_potentially_propose_alliance_to_family_member: "@alliance_icon! Potencjalne negocjacje dotyczące sojuszy"
 action_can_potentially_propose_alliance_to_family_member_combined_group_label: "@alliance_icon! Potencjalne negocjacje dotyczące sojuszy"
 action_can_potentially_propose_alliance_to_family_member_combined_group_name: "$action_can_potentially_propose_alliance_to_family_member_combined_group_label$"
 action_can_potentially_propose_alliance_to_family_member_desc: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetUINameNotMe], może #EMP nie#! zaakceptować teraz propozycji zawarcia z tobą [Concept('alliance', 'sojuszu')|E], ale może dać się przekonać później.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]\n\n#help Jeśli potrzebujesz tego sojuszu, poprawa [Concept('opinion', 'opinii')|E] lub zdobycie [Concept('hook', 'haka')|E] może umożliwić ci jego wynegocjowanie.\n\nMożesz sprawdzić, jak blisko zaakceptowania twojej oferty sojuszu jest dana postać, wskazując kursorem wynik akceptacji po otwarciu interakcji.#!"
 action_can_potentially_propose_alliance_to_family_member_combined_group_description: "Postacie nie zaakceptowałyby teraz zawarcia z tobą [Concept('alliance', 'sojuszu')|E], niemniej jednak możesz je do tego przekonać.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]\n\n#help Jeśli potrzebujesz zawrzeć sojusz, poprawienie [Concept( 'opinion', 'opinii' )|E] lub zdobycie [Concept( 'hook', 'haka' )|E] może umożliwić ci jego wynegocjowanie.\n\nMożesz sprawdzić, jak blisko zaakceptowania twojej oferty sojuszu jest dana postać, najeżdżając kursorem na wynik akceptacji, gdy interakcja jest otwarta.#!"
 action_can_potentially_propose_alliance_to_family_member_label: "@alliance_icon! Ty i [recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip], [actor.Custom2('RelationToMe', recipient)] twojej osoby, możecie negocjować zawarcie potencjalnego sojuszu – #low @soldier_icon! [recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
 action_can_potentially_propose_alliance_to_family_member_combined_label: "$action_can_propose_alliance_to_family_member_combined_label$"
 action_can_potentially_propose_alliance_to_family_member_click: "#I Kliknij, aby wyświetlić potencjalne negocjacje sojuszu#!"
 action_can_potentially_propose_alliance_to_family_member_combined_unimportant: "@warning_icon! #X Masz już dwa sojusze lub więcej#!"
 action_can_potentially_propose_alliance_to_family_member_unimportant: "$action_can_potentially_propose_alliance_to_family_member_combined_unimportant$"
 action_can_demand_payment: "@cs_weak_hook_icon! Możesz zażądać opłaty"
 action_can_demand_payment_combined_group_label: "@cs_weak_hook_icon! Możesz zażądać opłat"
 action_can_demand_payment_combined_group_name: "$action_can_demand_payment_combined_group_label$"
 action_can_demand_payment_desc: "[recipient.GetUINameNotMe] będzie zmuszon[Select_CString(recipient.IsFemale, 'a', 'y' )] zapłacić ci [gold|El], jeżeli wykorzystasz posiadanego na ni[Select_CString(recipient.IsFemale, 'ą', 'ego' )] [Concept( 'hook', 'haka' )|E].\n\nObecnie ma @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! złota, które możesz zażądać.$action_can_demand_payment_HELP$"
 action_can_demand_payment_combined_group_description: "Możesz wykorzystać [hooks|El], które posiadasz, aby zażądać opłaty w [Concept( 'gold', 'złocie' )|E].$action_can_demand_payment_HELP$"
 action_can_demand_payment_label: "@cs_weak_hook_icon! Możesz zażądać opłaty od osoby, którą jest [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUINameNotMeNoTooltip], @gold_icon! #V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#!"
 action_can_demand_payment_combined_label: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetUINameNotMeNoTooltip] – @gold_icon! #V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#!"
 action_can_demand_payment_click: "#I Kliknij, aby zażądać opłaty#!"
 action_can_demand_payment_HELP: "\n\n#help Możesz to zrobić, ponieważ posiadasz [perk|El] [GetPerk('golden_obligations_perk').GetName(GetPlayer)|l].\n\nŻądanie zapłaty od kogoś, na kogo posiadasz [Concept( 'hook', 'haka' )|El], spowoduje jego użycie, więc upewnij się, że na pewno chcesz to zrobić!#!"
 action_hook_expiring: "@cs_weak_hook_icon! Hak wkrótce wygaśnie"
 action_hook_expiring_combined_group_label: "@cs_weak_hook_icon! Haki wkrótce wygasną"
 action_hook_expiring_combined_group_name: "$action_hook_expiring_combined_group_label$"
 action_hook_expiring_desc: "Rozważ wkrótce użycie [Concept('hook', 'haka')|E] przeciwko osobie: [actor.Custom2('RelationToMe', recipient)] [recipient.GetUINameNotMe]. Hak wygasa w dniu [actor.GetHookOn( recipient.Self ).GetExpirationDate.GetString]."
 action_hook_expiring_combined_group_description: "Powinieneś wykorzystać wygasające [hooks|El], które posiadasz, albo po prostu znikną"
 action_hook_expiring_label: "@cs_weak_hook_icon! [hook|E], którego możesz użyć przeciwko osobie, którą jest [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUINameNotMeNoTooltip], wkrótce wygaśnie"
 action_hook_expiring_combined_label: "[recipient.GetUINameNotMeNoTooltip], [actor.Custom2('RelationToMe', recipient)] twojej osoby"
 action_hook_expiring_click: "#I Kliknij, aby otworzyć okno postaci#!"
