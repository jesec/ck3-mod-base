 action_opportunity_to_study_classics_label: "@merit_icon! Masz czas, by studiować dzieła konfucjańskie"
 action_opportunity_to_study_classics_desc: "Nie jesteś [Concept('governor', 'gubernatorem')|E], więc masz czas, aby przygotować się na [imperial_examinations|El]\n\n#help Nauka zwiększy twój poziom [Concept('stress', 'stresu')|E], lecz zapewnia szeroki wachlarz korzyści dla przyszłej kariery.#!"
 action_opportunity_to_study_classics_click: "#I Kliknij, aby rozpocząć naukę#!"
 action_opportunity_to_study_scripture: "@study_scripture_icon! Możesz studiować następujące pismo: [GetPlayer.GetFaith.ReligiousText]"
 action_opportunity_to_study_scripture_label: "@study_scripture_icon! Masz czas na studiowanie następującego pisma: [GetPlayer.GetFaith.ReligiousText]"
 action_opportunity_to_study_scripture_desc: "Czujesz spokój, a czas pomiędzy tym poświęconym na [GetPlayer.Custom('StudyOfficesWord')] rezerwujesz dla siebie.\n\nNauka rozpoczyna [personal_scheme|El] „[GetScheme('study_scripture').GetTypeName]”, który nagradza cię tak długo, jak nad nim pracujesz:\n$EFFECT_LIST_BULLET$ [piety_i] [piety|E]\n$EFFECT_LIST_BULLET$ [skill|E] [learning_i] [stewardship_i] [diplomacy_i]\n$EFFECT_LIST_BULLET$ [trait|E] / [trait_level_track_xp|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$ Możliwości wśród [Concept('clergy', 'duchowieństwa')|E]\n\n#help Studiowanie może cię kosztować [stress_i] [stress|El], a w trakcie nauki zyskujesz mniej [prestige_i] [Concept('prestige', 'prestiżu')|E].#!"
 action_opportunity_to_study_scripture_click: "#I Kliknij, aby rozpocząć naukę#!"
