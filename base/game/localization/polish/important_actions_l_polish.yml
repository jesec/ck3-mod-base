 action_appoint_tax_collector: "@tax_collector_icon! Wyznacz poborcę podatkowego"
 action_appoint_tax_collector_label: " @tax_collector_icon! Nie opodatkowujesz swoich wasali"
 action_appoint_tax_collector_desc: "Nie opodatkowujesz swoich [Concept( 'clan', 'klanowych' )|E] [Concept( 'vassals', 'wasali' )|E].\n\n#help [tax_collectors|E] są odpowiedzialni za pobieranie [Concept( 'gold', 'złota' )|E] i [Concept( 'levies', 'pospolite ruszenie' )|E] od twoich klanowych wasali. Zatrudnij poborcę podatkowego i przydziel [Concept( 'taxpayers', 'podatników' )|E] do swoich [Concept( 'tax_jurisdictions', 'jurysdykcji podatkowych' )|E].#!"
 action_appoint_tax_collector_click: "#I Kliknij, aby wyświetlić#!"
 action_assign_tax_payers: "@tax_collector_icon! Przydziel podatników"
 action_assign_tax_payers_label: "@tax_collector_icon! Do poborcy podatkowego nie przypisano podatników"
 action_assign_tax_payers_desc: "Nie nakładasz podatków na [Concept('vassals', 'wasali')|E] [Concept('clan', 'klanu')|E].\n\n#help [tax_jurisdiction|E], w ramach której działa [tax_collector|El], ale która nie ma [Concept('taxpayers', 'podatników')|E], nie zapewni ci [Concept('gold', 'złota')|E] ani [Concept('levy', 'kmieci')|E]. Wyznacz wasali klanu jako podatników, aby móc pobierać od nich podatki.#!"
 action_assign_tax_payers_click: "#I Kliknij, aby wyświetlić#!"
