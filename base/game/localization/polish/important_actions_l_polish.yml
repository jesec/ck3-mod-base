 action_county_in_dangerous_populist_faction_combined_group_description: "Chłopi w kilku twoich hrabstwach zjednoczyli się we [Concept( 'popular_faction', 'frakcji populistycznej' )|E] przeciwko twojemu seniorowi.\n\nZwiększ [Concept( 'county_opinion', 'powszechną opinię' )|E] tych hrabstw lub zaryzykuj ich całkowitą utratę, gdy przedstawią swoje żądania!"
 action_county_in_dangerous_populist_faction_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTierNoTooltip]"
