 action_heir_in_line_of_succession_for_title_desc: "[actor.GetShortUINameNotMe], osoba pełniąca rolę twojego [Concept('player_heir', 'następcy')|E], jest [actor.GetPlaceInSuccession(landed_title)|O] w [Concept('line_of_succession', 'linii sukcesji')|E] do tytułu: [landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTier].\n\n#help Choć istnieje możliwość, że odziedziczy ten tytuł samodzielnie, to odpowiedni spisek ([GetScheme('murder').GetTypeName|l]) może zarówno przyspieszyć zdobycie tych ziem, jak i zapobiec utracie miejsca w linii.#!"
 action_heir_in_line_of_succession_for_title_combined_group_description: "Tw[Select_CString( actor.IsFemale, 'oja', 'ój' )] [Select_CString(actor.IsFemale, Concept('player_heir', 'następczyni'), Concept('player_heir', 'następca'))|E], [actor.GetShortUINameNotMe], jest wysoko w [Concept( 'line_of_succession', 'linii sukcesji' )|E] do wielu [Concept( 'titles', 'tytułów')|E].\n\n#help Choć możliwe jest, że samodzielnie odziedziczy te tytuły, to [GetScheme('murder').GetTypeName|l] może przyspieszyć ich zdobycie, zapewniając jednocześnie, że nie straci miejsca w linii sukcesji.#!"
