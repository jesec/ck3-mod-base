 action_hegemonic_tributary_has_low_subject_standing_tributary_desc: "[ConcatIfNeitherEmpty(GetPlayer.Custom('SubjectStandingIcon'),' ')] [actor.Custom('SubjectStanding')] ma niebezpiecznie niski poziom i twój [suzerain|El] [recipient.GetShortUINameNotMe] może wkrótce wymusić od ciebie trybut.$action_hegemonic_tributary_has_low_subject_standing_tributary_help_desc$"
