 action_can_assign_guardian_HELP: "\n\n#help Twoim dzieciom można przydzielić opiekuna, który przekaże im swoje [skills|El] oraz zdobytą wiedzę. Opiekun z dobrą [Concept( 'education_trait', 'cechą edukacji' )|E] przekaże ją także dziecku. Jeśli oddasz dziecko pod wychowanie swojemu [Concept( 'vassal', 'wasalowi' )|E], będzie miał o tobie lepszą [Concept( 'opinion', 'opinię' )|E]. Możesz także sam zostać opiekunem, dzięki czemu zyskasz większą kontrolę nad jego edukacją.#!"
 action_in_line_of_succession_for_title: "@titles_icon! Jesteś #high [actor.GetPlaceInSuccession(landed_title)|O]#! w linii do odziedziczenia tytułu: [landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTierNoTooltip] [actor.Custom2('GetInOrOutsideRealm', landed_title.GetHolder)]"
