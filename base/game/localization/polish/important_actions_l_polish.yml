 action_can_lawfully_imprison_desc: "[recipient.GetUINameNotMe] popełnił[Select_CString( recipient.IsFemale, 'a', '' )] [crimes|El] ([recipient.GetImprisonmentReasons( actor.Self )]) pozwalające ci na uwięzienie [Select_CString( recipient.IsFemale, 'jej', 'go' )] bez zdobycia [Concept('tyranny', 'tyranii')|E].$action_can_lawfully_imprison_HELP$"
 action_can_lawfully_imprison_click: "#I Kliknij, aby [Select_CString( recipient.IsFemale, 'ją', 'go' )] uwięzić#!"
 action_can_lawfully_imprison_combined_group_label: "@prison_icon! Można uwięzić przestępców"
 action_can_lawfully_imprison_combined_group_name: "@prison_icon! Można uwięzić przestępców"
 action_can_lawfully_imprison_combined_group_description: "Niektórzy z twoich poddanych popełnili [Concept( 'crimes', 'przestępstwa' )|E], co pozwala ci uwięzić ich bez uzyskiwania [Concept( 'tyranny', 'tyranii' )|E].$action_can_lawfully_imprison_HELP$"
 action_can_lawfully_imprison_combined_unimportant: "@warning_icon! #X Żaden z przestępców nie jest dla ciebie ważny#!"
 action_can_lawfully_imprison_unimportant: "@warning_icon! #X [recipient.GetSheHe|U] nie jest dla ciebie ważn[Select_CString( recipient.IsFemale, 'a', 'y' )]#!"
 action_can_lawfully_imprison_HELP: "\n\n#help Jako [Concept( 'ruler', 'władca' )|E] nie musisz więzić każdego [Concept( 'criminal', 'przestępcy' )|E], jednakże posiadanie bogatego lub wpływowego więźnia może być przydatne. Możesz coś od nich zyskać w zamian za ich wolność lub też stracić ich, jeśli czujesz żądzę krwi.#!"
 action_can_create_title: "@titles_icon! Można utworzyć tytuł"
 action_can_create_title_combined_group_label: "@titles_icon! Można utworzyć tytuły"
 action_can_create_title_combined_group_name: "@titles_icon! Można utworzyć [titles|El]"
 action_can_create_title_desc: "Kontrolujesz wystarczającą liczbę [Concept('counties', 'hrabstw')|E] na ziemiach znanych jako [landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTier], aby móc [create|El] [title|El].$action_can_create_title_HELP$"
 action_can_create_title_combined_group_description: "Kontrolujesz wystarczającą liczbę [Concept( 'counties', 'hrabstw' )|E], aby [Concept( 'create', 'utworzyć' )|E] [titles|El] je zawierające.$action_can_create_title_HELP$"
 action_can_create_title_label: "@titles_icon! Możesz utworzyć tytuł: [landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTierNoTooltip]"
 action_can_create_title_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip]"
 action_can_create_title_click: "#I Kliknij, aby wyświetlić tytuł#!"
 action_can_create_title_combined_unimportant: "@warning_icon! #X Nie masz wystarczającej ilości [Concept( 'gold', 'złota' )|E], aby [Concept( 'create', 'utworzyć' )|E] którykolwiek z tych tytułów#!"
 action_can_create_title_unimportant: "@warning_icon! #X Nie masz wystarczającej ilości [Concept('gold', 'złota')|E], aby [Concept('create', 'utworzyć')|E] tytuł#!"
 action_can_create_title_HELP: "\n\n#help Tworzenie tytułu może kosztować [gold|El], jednakże ma to swoje zalety: $CREATE_USURP_TITLE_PROS_CONS$#!"
 action_can_usurp_title: "@titles_icon! Można uzurpować tytuł"
 action_can_usurp_title_combined_group_label: "@titles_icon! Można uzurpować tytuły"
 action_can_usurp_title_combined_group_name: "@titles_icon! Można uzurpować [title|El]"
 action_can_usurp_title_desc: "Kontrolujesz wystarczającą liczbę [Concept('counties', 'hrabstw')|E] na ziemiach znanych jako [landed_title.GetNameNoTier], aby móc [usurp|El] [title|El].$action_can_usurp_title_HELP$"
 action_can_usurp_title_combined_group_description: "Kontrolujesz wystarczającą liczbę [Concept( 'counties', 'hrabstw' )|E] zawartych w obrębie niektórych [Concept('titles', 'tytułów')|E], aby [Concept( 'usurp', 'uzurpować' )|E] te tytuły.$action_can_usurp_title_HELP$"
 action_can_usurp_title_label: "@titles_icon! Możesz uzurpować tytuł: [landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTierNoTooltip]"
 action_can_usurp_title_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip]"
 action_can_usurp_title_click: "#I Kliknij, aby wyświetlić tytuł#!"
 action_can_usurp_title_combined_unimportant: "@warning_icon! #X Nie masz wystarczającej ilość [Concept( 'gold', 'złota' )|E], aby uzurpować którykolwiek z tych tytułów#!"
 action_can_usurp_title_unimportant: "@warning_icon! #X Nie masz wystarczającej ilości [Concept( 'gold', 'złota' )|E], aby uzurpować ten tytuł#!"
 action_can_usurp_title_HELP: "\n\n#help Pokojowe uzurpowanie tytułu może kosztować [gold|El], jednakże ma to swoje zalety: $CREATE_USURP_TITLE_PROS_CONS$#!"
 CREATE_USURP_TITLE_PROS_CONS: "\n$BULLET_WITH_TAB$Możesz zwiększyć swoją [Concept( 'rank', 'rangę' )|E]\n$BULLET_WITH_TAB$Zdobędziesz [casus_bellis|El] [de_jure|El]\n$BULLET_WITH_TAB$[vassals|E] mogą mogą uważać cię teraz za swojego [Concept( 'rightful_liege', 'prawowitego seniora' )|E]\n$BULLET_WITH_TAB$Zdobywasz [prestige|El]\n\nJednakże są tego negatywne strony:\n$BULLET_WITH_TAB$Twoi wasale mogą chcieć tego tytułu\n$BULLET_WITH_TAB$Jeżeli twoje [realm|El] ma [Concept( 'succession_law', 'prawo sukcesji' )|E] obejmujące wielu [Concept( 'realm_heirs', 'sukcesorów' )|E], będzie to miało decydujący wpływ na dziedziczenie przez nich tytułów."
 action_above_domain_limit: "@domain_icon! Przekroczono [Concept( 'domain_limit', 'limit domeny' )|E]"
 action_above_domain_limit_label: "@domain_icon! Przekroczono [Concept( 'domain_limit', 'limit domeny' )|E]"
 action_above_domain_limit_desc: "Twój limit [Concept( 'domain', 'domeny' )|E], wynoszący [actor.GetDomainLimit|V], został przekroczony o [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [holdings|El], co skutkuje zmniejszeniem wysokości [Concept( 'taxes', 'podatków' )|E] i ilości [Concept( 'levies', 'pospolitego ruszenia' )|E].\n\n#help Jako [ruler|El] możesz posiadać jedynie ograniczoną liczbę posiadłości. Reszta posiadłości w twoim [Concept( 'realm', 'państwie' )|E] powinna być we władaniu twoich [Concept( 'vassals', 'wasali' )|E].\n\nAby uniknąć opisywanej wyżej kary, należy przekazać część swoich [Concept( 'titles', 'tytułów' )|E] wraz posiadłościami innym postaciom. [courtiers|E] i [guests|El] są odpowiednimi kandydatami, ponieważ będą za słabi, aby ci się przeciwstawić. Obecni wasale również mogą otrzymywać tytuły, jednakże staną się wtedy silniejsi i mogą stanowić zagrożenie w przyszłości!#!"
 action_above_domain_limit_click: "#I Kliknij, aby zobaczyć swoje tytuły#!"
 action_above_vassal_limit: "Przekroczono [Concept( 'vassal_limit', 'limit wasali' )|E]"
 action_above_vassal_limit_label: "Przekroczono [Concept( 'vassal_limit', 'limit wasali' )|E]"
 action_above_vassal_limit_desc: "Masz [actor.GetVassalLimitOverrun|V] [Select_CString( GreaterThan_int32(actor.GetVassalLimitOverrun, '(int32)1'), Concept( 'direct_vassals', 'bezpośrednich wasali'), Concept( 'direct_vassals', 'bezpośredniego wasala') )|E] powyżej limitu wasali wynoszącego [actor.GetVassalLimit|V], co zmniejszy [Concept( 'taxes', 'podatki' )|E] oraz ilość [Concept( 'levies', 'pospolitego ruszenia' )|E] otrzymywanych od [Concept( 'vassals', 'wasali' )|E].\n#help Każdy [Concept( 'ruler', 'władca' )|E] może kontrolować tylko określoną liczbę wasali bezpośrednich. Zamiast mieć ich jako wasali bezpośrednich, powinni być oni zarządzani przez jednego z twoich wasali. Aby było to możliwe, przekaż jednego wasala swojemu innemu wasalowi.#!"
 action_above_vassal_limit_click: "#I Kliknij, aby zobaczyć swoich wasali#!"
 action_too_many_held_duchies_combined_group_label: "@titles_icon! Zbyt wiele posiadanych księstw"
 action_too_many_held_duchies_label: "$action_too_many_held_duchies_combined_group_label$"
 action_too_many_held_duchies_combined_group_name: "$action_too_many_held_duchies_combined_group_label$"
 action_too_many_held_duchies_combined_group_description: "Będąc [Concept( 'king', 'królem' )|E] lub [Concept( 'emperor', 'cesarzem' )|E] posiadasz więcej niż dwa [Concept( 'duchies', 'księstwa' )|E], co powoduje obniżenie [Concept( 'opinion', 'opinii' )|E] twoich [Concept( 'vassals', 'wasali' )|E] o tobie.\n\n#help Im więcej księstw posiadasz powyżej dozwolonego limitu, tym bardziej zazdrośni będą twoi wasale. Chociaż możesz zignorować ich skargi, rozważ przyznanie im niektórych [Concept( 'titles', 'tytułów' )|E] księstw.\n\nPowinieneś zachować te księstwa, w których posiadasz wiele hrabstw, a zwłaszcza [Concept( 'realm_capital', 'stolicę państwa' )|E].#!"
 action_too_many_held_duchies: "$action_too_many_held_duchies_combined_group_label$"
 action_too_many_held_duchies_combined_label: "@duchy_icon! [landed_title.GetNameNoTooltip]"
 action_too_many_held_duchies_desc: "$action_too_many_held_duchies_combined_group_description$"
 action_too_many_held_duchies_click: "#I Kliknij, aby zobaczyć swoje księstwa#!"
 action_dying: "U progu śmierci"
 action_dying_desc: "Jesteś u progu śmierci.\n\n#help Jeżeli masz swojego [Concept( 'player_heir', 'następcę' )|E], będziesz nim kontynuować grę. Twoi [vassals|El] mogą nie być już tak samo lojalni względem niego. Dlatego dobrze jest nie wydawać zbyt wiele [Concept( 'gold', 'złota' )|E], aby pozwolić sobie na wynajęcie [Concept( 'mercenaries', 'najemników' )|E] lub [Concept( 'gift', 'prezenty' )|E].#!"
 action_dying_label: "Jesteś u progu śmierci."
 action_dying_click: "#I Kliknij, aby wyświetlić swoją postać!#!"
 action_empty_council_position: "[GetPlayer.Custom( 'GetCouncilConcept' )|E] – wolne stanowisko"
 action_empty_council_position_label: "[GetPlayer.Custom( 'GetCouncilConcept' )|E] – wolne stanowiska"
 action_empty_council_position_desc: "Jedno ze stanowisk w twojej instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|El], jest nieobsadzone.\n\n#help Jeśli jedno stanowisko jest nieobsadzone, zadania instytucji są zawieszone. Nowy [GetPlayer.Custom( 'GetCouncillorConcept' )|El] może zostać przez ciebie wybrany ze względu na określoną [skill|El] lub dlatego, że to [powerful_vassal|El] spodziewający się stanowiska.#!"
 action_empty_council_position_click: "#I Kliknij, a wyświetli się [GetPlayer.Custom( 'GetCouncilConcept' )|El]#!"
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Wasal wpływowy spodziewa się stanowiska w instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|l]"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Wpływowi wasale oczekują stanowisk w organizacji, którą jest [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )|l]"
 action_powerful_vassal_not_on_council_combined_group_name: "@powerful_vassal_icon! [powerful_vassals|E] spodziewają się stanowisk w instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|El]"
 action_powerful_vassal_not_on_council_desc: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMe] oczekuje, że będzie zasiadać w twojej instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|El], ponieważ jest [Concept('powerful_vassal', 'wasalem wpływowym')|E]. $action_powerful_vassal_not_on_council_HELP$"
 action_powerful_vassal_not_on_council_combined_group_description: "Twoi [powerful_vassals|El] oczekują, że będą zasiadać w twojej instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|El]. $action_powerful_vassal_not_on_council_HELP$"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Twój wasal wpływowy, [recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip], oczekuje stanowiska w instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|El] ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_powerful_vassal_not_on_council_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip] ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_powerful_vassal_not_on_council_click: "#I Kliknij, a wyświetli się [GetPlayer.Custom( 'GetCouncilConcept' )|El]#!"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Warto zastanowić się nad nadaniem wasalom wpływowym stanowiska, którym jest [GetPlayer.Custom( 'GetCouncillorConcept' )|El]. W przeciwnym razie ich [opinion|El] będzie gorsza, mogą też dołączyć do [Concept('faction', 'frakcji')|E] przeciwnej tobie.\n\nJednak nie każdy ma wystarczające [skills|El], żeby się na coś przydać, a jeżeli twoja [rank|El] jest dostatecznie wysoka, wasali wpływowych może być więcej niż miejsc w instytucji, którą jest [GetPlayer.Custom( 'GetCouncilConcept' )|El].#!"
 action_wrong_holding_type_combined_group_label: "@domain_icon! Posiadłości niewłaściwego typu"
 action_wrong_holding_type_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip] #low ([landed_title.GetProvince.GetHolding.GetType.GetName])#!"
 action_wrong_holding_type: "@domain_icon! [holding|E] niewłaściwego typu"
 action_wrong_holding_type_combined_group_name: "@domain_icon! Posiadłości niewłaściwego typu"
 action_wrong_holding_type_combined_group_description: "Niektóre posiadłości są złego [Concept('holding_type', 'typu')|E] dla twojej formy [Concept('government', 'rządów')|E] i zapewniają ci bardzo mało [Concept('taxes', 'podatków')|E] i [Concept('levies', 'pospolitego ruszenia')|E].$action_wrong_holding_type_HELP$"
 action_wrong_holding_type_label: "@domain_icon! [Select_CString( actor.IsFemale, 'Powinnaś', 'Powinieneś' )] przyznać komuś ziemie [landed_title.GetAdjectiveNoTooltip] #low ([landed_title.GetProvince.GetHolding.GetType.GetName|l])#!"
 action_wrong_holding_type_desc: "[landed_title.GetName] to tytuł, którego [holding_type|El] nie jest odpowiedni dla twojej formy [Concept('government', 'rządu')|E]. W rezultacie tytuł ten zapewnia ci bardzo mało wpływów z [Concept('taxes', 'podatków')|E] i [Concept('levies', 'pospolitego ruszenia')|E].$action_wrong_holding_type_HELP$"
 action_wrong_holding_type_click: "#I Kliknij, aby wybrać tytuł!#!"
 action_wrong_holding_type_HELP: "\n\n#help Każdy władca ma swoją formę rządów, która dyktuje jakiego typu [Concept('holdings', 'posiadłościami')|E] mogą sprawnie zarządzać. Przykładowo, feudalni władcy mogą sprawnie zarządzać tylko [Concept('castles', 'zamkami')|E]. Każda źle zarządzana posiadłość jest praktycznie bezwartościowa i tylko zajmuje miejsce w twoim [Concept('domain_limit', 'limicie domeny')|E].\n\nMusisz przyznać tego typu posiadłości swoim [Concept('unlanded', 'bez ziemnym')|E] członkom [Concept('court', 'dworu')|E] – staną się wtedy twoimi [Concept('vassal', 'wasalami')|E].#!"
 action_can_raze_holding_combined_group_label: "@raze_icon! Posiadłości można zrównać z ziemią"
 action_can_raze_holding_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip] #low ([landed_title.GetProvince.GetHolding.GetType.GetName|l])#!"
 action_can_raze_holding: "@raze_icon! [holding|E] można zrównać z ziemią"
 action_can_raze_holding_combined_group_name: "@raze_icon! Posiadłości można zrównać z ziemią"
 action_can_raze_holding_combined_group_description: "Możesz zrównać z ziemią [holdings|El], aby zdobyć [gold|E], a następnie zastąpić je [Concept('nomadic_holdings', 'osadami koczowników')|E], które są znacznie lepsze dla [Concept('county_fertility', 'płodności hrabstwa')|E].$action_can_raze_holding_HELP$"
 action_can_raze_holding_label: "@raze_icon! Możesz zrównać z ziemią miejsce znane jako [landed_title.GetNameNoTooltip] #low ([landed_title.GetProvince.GetHolding.GetType.GetName|l])#!"
 action_can_raze_holding_desc: "Możesz zrównać z ziemią miejsce znane jako [landed_title.GetName], aby zdobyć [gold|E], a następnie zastąpić je [Concept('nomadic_holding', 'osadą koczowników')|E], która jest znacznie lepsza dla [Concept('county_fertility', 'płodności hrabstwa')|E].$action_can_raze_holding_HELP$"
 action_can_raze_holding_click: "#I Kliknij, aby wybrać tytuł#!"
 action_can_raze_holding_HELP: "\n\n#help Jeśli nie planujesz osiedlić się, korzystając z [Concept('decisions', 'decyzji')|E] „$step_away_from_the_steppe_decision$” lub „$settle_people_decision$”, rozważ zrównanie z ziemią [holdings|El], aby przekształcić je w [nomadic_holdings|El].\n\n[nomadic_holdings|E] poprawiają [Concept('fertility_equilibrium', 'równowagę płodności')|E] i sprawiają, że ziemie stają się nieatrakcyjne do podboju dla osiadłych władców.\n\nAby zrównać z ziemią posiadłość, kliknij okrągły przycisk w lewym dolnym rogu widoku posiadłości.#!"
 action_upgrade_tribal_holding_type_combined_group_label: "@building_icon! Należy sfeudalizować posiadłości plemienne"
 action_upgrade_tribal_holding_type_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip]"
 action_upgrade_tribal_holding_type: "@building_icon! Należy sfeudalizować [holding|El] [Concept('tribal', 'plemienną')|E]"
 action_upgrade_tribal_holding_type_combined_group_name: "@building_icon! Należy sfeudalizować [holdings|El] [Concept('tribal', 'plemienne')|E]"
 action_upgrade_tribal_holding_type_combined_group_description: "Jako że jesteś [Concept('character', 'postacią')|El] nie[Concept('tribal', 'plemienną')|E], posiadane przez ciebie [holdings|El] plemienne nie zapewniają ci ani [Concept('levies', 'pospolitego ruszenia')|E], ani [Concept('taxes', 'podatków')|E]. Należy zreformować posiadłość, czyniąc z niej [castle|El]. $action_upgrade_tribal_holding_type_HELP$"
 action_upgrade_tribal_holding_type_label: "@building_icon! Powinniśmy sfeudalizować tytuł: [landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTierNoTooltip]"
 action_upgrade_tribal_holding_type_desc: "$action_upgrade_tribal_holding_type_combined_group_description$"
 action_upgrade_tribal_holding_type_click: "#I Kliknij, aby wybrać posiadłości#!"
 action_upgrade_tribal_holding_type_HELP: "\n\n#help Posiadłości plemienne są bardzo przydatne dla [Concept('rulers', 'władców')|E] z [Concept('government', 'rządami')|E] plemiennymi, ale nie mogą być właściwie zarządzane przez nikogo innego. Jednakże inwestując [gold|El] w reformowanie lokalnych plemion, [holding_type|El] może zostać trwale zmieniony na zamek, którym może zarządzać każdy!#!"
 action_can_call_ally: "@alliance_icon! Możesz wezwać sojusznika"
 action_can_call_ally_combined_group_label: "@alliance_icon! Możesz wezwać sojusznika do wojny"
 action_can_call_ally_combined_group_name: "@alliance_icon! Możesz wezwać sojuszników"
 action_can_call_ally_desc: "[recipient.GetUINameNotMe], osoba będąca twoim [Concept('ally', 'sojusznikiem')|E], może zostać wezwan[Select_CString( recipient.IsFemale, 'a', 'y' )] do prowadzonych przez ciebie [Concept( 'wars', 'wojen' )|E].\n\nMa @soldier_icon! [recipient.GetMilitaryStrengthText] [Concept( 'soldiers', 'żołnierzy' )|E], którymi może cię wesprzeć.$CALL_TO_WAR_HELP$"
 action_can_call_ally_combined_group_description: "Możesz wezwać swoich [Concept( 'allies', 'sojuszników' )|E] do toczonych przez siebie [Concept( 'wars', 'wojen' )|E].$CALL_TO_WAR_HELP$"
 action_can_call_ally_label: "@alliance_icon! Możesz wezwać swojego sojusznika: [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMeNoTooltip], #low @soldier_icon! [recipient.GetMilitaryStrengthText]#!"
 action_can_call_ally_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip], #low @soldier_icon! [recipient.GetMilitaryStrengthText]#!"
 action_can_call_ally_click: "#I Kliknij, aby wezwać sojusznika#!"
 CALL_TO_WAR_HELP: "#help Wezwanie innych [Concept( 'rulers', 'władców' )|E] do swojej wojny oznacza większe prawdopodobieństwo wygranej, jednakże pamiętaj, że musisz wydać [prestige|El] za każdego [Concept( 'ally', 'sojusznika' )|E], który dołączy. Przywołanie członków [Concept( 'dynasty', 'dynastii' )|E] kosztuje punkty [Concept( 'dynasty_prestige', 'renomy' )|E], podczas gdy członkowie [Concept( 'house', 'rodu' )|E] dołączą do ciebie za darmo pod warunkiem, że zaakceptują twoje wezwanie.#!"
 action_has_any_display_cb_on: "@war_icon! Możesz wypowiedzieć [Concept( 'war', 'wojnę' )|E] postaci [recipient.GetShortUINameNotMeNoTooltip]"
 action_has_any_display_cb_on_combined_group_label: "@war_icon! Możesz wypowiedzieć wojny"
 action_has_any_display_cb_on_combined_group_name: "@war_icon! Możesz wypowiedzieć wiele [Concept( 'wars', 'wojen' )|E]"
 action_has_any_display_cb_on_desc: "Masz jedno lub więcej [casus_bellis|El] przeciwko [recipient.GetUINameNotMe].$action_has_any_display_cb_on_HELP$"
 action_has_any_display_cb_on_combined_group_description: "Masz [casus_bellis|El] przeciwko wielu [Concept( 'rulers', 'władcom' )|E].$action_has_any_display_cb_on_HELP$"
 action_has_any_display_cb_on_label: "@war_icon! Możesz wypowiedzieć wojnę: [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMeNoTooltip], [actor.Custom2('GetMilitaryStrengthColoredCurrentSituation', recipient)]"
 action_has_any_display_cb_on_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip], [actor.Custom2('GetMilitaryStrengthColoredCurrentSituation', recipient)]"
 action_has_any_display_cb_on_click: "#I Kliknij, aby wyświetlić [Concept( 'casus_bellis', 'casus belli' )|E]#!"
 action_has_any_display_cb_on_combined_unimportant: "@warning_icon! #X Wszyscy mają silniejszą [Concept( 'army', 'armię' )|E] od ciebie#!"
 action_has_any_display_cb_on_unimportant: "@warning_icon! #X [recipient.GetSheHe|U] ma silniejszą [Concept( 'army', 'armię' )|E] od ciebie#!"
 action_has_any_display_cb_on_HELP: "\n\n#help Jeśli twoje wojsko i [allies|El] są silniejsi od wroga, wojna może być bardzo korzystna. W ten sposób możesz zdobyć [titles|El], rozszerzyć swoje [realm|El] i zyskać [Concept( 'prestige_experience', 'sławę' )|E].\n\nJednakże wojny mogą być bardzo kosztowne, szczególnie gdy musisz uznać własną [Concept( 'defeat', 'porażkę' )|E]. Ambitni sąsiedzi mogą wykorzystać twoje osłabione [realm|El].#!"
 military_strength_green_current_situation: "#P @soldier_icon! [second.GetMilitaryStrengthText]#!"
