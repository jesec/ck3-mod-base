 action_send_guardian_to_university_desc: "Możesz wysłać swoje dziecko na uniwersytet\n\n#help Na terenie [Concept('realm', 'państwa')|E] dziecka znajduje się [building|El] [Concept('holy_site', 'miejsca świętego')|E], taka jak [GetBuilding('holy_site_cathedral_01').GetName|l], [GetBuilding('generic_university').GetName|l] lub [realm_capital|El] o nazwie [GetTitleByKey('h_china').GetName]! Wysłanie tam dziecka na naukę jest korzystne, ponieważ poprawi to jego [Concept('education_trait', 'cechę edukacji')|E], gdy stanie się [Concept('adult', 'postacią dorosłą')|E].\n\nDziecko będzie jednak potrzebować [Concept('guardian', 'opiekuna')|E].#!"
