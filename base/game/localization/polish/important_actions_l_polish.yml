 action_not_endorsed_by_realm_priest_desc: "[Select_CString(recipient.IsFemale, 'Twoja', 'Twój' )] [recipient.GetCouncilTitle|l], [recipient.GetUINameNotMe], nie popiera cię. Obecnie [recipient.GetHerHis] [opinion|El] o tobie wynosi [recipient.GetOpinionOf( GetPlayer )|+=].\n\n#help Upewnij się, że ma o tobie #P pozytywną#! [Concept( 'opinion', 'opinię' )|E], w przeciwnym razie nie dostarczy ci żadnego [Concept( 'levies', 'pospolitego ruszenia' )|E] ani [Concept( 'taxes', 'podatków' )|E]! Najlepszym sposobem na zapobieżenie temu jest rozpoczęcie [Concept( 'scheme', 'spisku' )|E] „[GetScheme('sway').GetTypeName]”.\n\nJeśli [recipient.GetHerHis] opinia o tobie wynosi #N -10#! lub mniej, może zacząć ingerować w twoje sprawy.#!"
