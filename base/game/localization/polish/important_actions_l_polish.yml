 action_recent_hunt_sighting_desc: "Nadszedł dobry czas, aby na ziemiach znanych jako [landed_title.GetNameNoTier] zorganizować aktywność: [GetActivityType('activity_hunt').GetName|l].$action_recent_hunt_sighting_HELP$"
