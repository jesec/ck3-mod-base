 action_mega_duke_penalty_label: "@titles_icon! Zbyt wiele [Concept( 'counties', 'hrabstw' )|E]"
 action_mega_duke_penalty_desc: "Twój [realm_size|El] jest zbyt duży dla [Concept( 'duke', 'księcia' )|E], przez co cierpisz na [megaduke_penalty|El].\n\n#help Książęta nie mogą zbytnio się rozrastać i posiadać zbyt wielu [Concept( 'counties', 'hrabstw' )|E] w swoim [Concept( 'realm', 'państwie' )|E]. Tak długo, jak posiadasz zbyt wiele [Concept( 'counties', 'hrabstw' )|E], będziesz cierpisz z powodu zmniejszonego [Concept( 'income', 'dochodu' )|E]. Powinieneś utworzyć tytuł [Concept( 'kingdom', 'królestwa' )|E].#!"
