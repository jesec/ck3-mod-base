 action_legal_meddling_desc: "Jako [actor.GetLiege.GetDiarchTitle|l] możesz nadużywać swojej wyjątkowej pozycji, by wysuwać fałszywe [claims|El] wobec [Concept('counties', 'hrabstw')|E] w [Concept('realm', 'państwie')|E] twojego [Concept('liege', 'seniora')|E].$action_legal_meddling_help$"
 action_legal_meddling_help: "\n\n#help Gdy masz już roszczenie wobec [Concept('title', 'tytułu')|E] innego wasala, możesz skorzystać z możliwości odebrania tytułu przez regenta, by podjąć próbę [Concept('revoke', 'odebrania')|E] mu tego tytułu – jeśli [scales_of_power|El] są dostatecznie przechylone na twoją korzyść.#!"
