 action_dangerous_faction_targeting_me: "Niebezpieczna frakcja"
 action_dangerous_faction_targeting_me_label: "Jesteś celem niebezpiecznej frakcji"
 action_dangerous_faction_targeting_me_desc: "[faction|E] ma wystarczająco dużo [Concept('military_power', 'siły wojskowej')|E] i wkrótce wyśle ultimatum.\n\n#help Kiedy frakcja jest wystarczająco silna, jej [discontent|El] rośnie do momentu wysłania ultimatum. Musisz zaakceptować jej żądania albo przygotować się do [Concept('civil_war', 'wojny domowej')|E]!#!"
 action_dangerous_faction_targeting_me_click: "#I Kliknij, aby wyświetlić frakcję#!"
 action_county_in_dangerous_populist_faction: "@faction_icon! Hrabstwo we frakcji pupulistycznej"
 action_county_in_dangerous_populist_faction_label: "@faction_icon! [landed_title.GetNameNoTooltip] we frakcji populistycznej"
 action_county_in_dangerous_populist_faction_desc: "[landed_title.GetNameNoTierNoTooltip] to tytuł, który dołącza do [Concept('popular_faction', 'frakcji populistycznej')|E] działającej przeciwko twojemu seniorowi.\n\nZwiększ poziom [Concept('county_opinion', 'powszechnej opinii')|E] o tym hrabstwie lub zaryzykuj jego utratę, gdy frakcja przedstawi swoje żądania!"
 action_county_in_dangerous_populist_faction_click: "#I Kliknij, aby wyświetlić hrabstwo#!"
