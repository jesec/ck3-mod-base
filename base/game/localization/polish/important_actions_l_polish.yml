 action_appoint_co_emperor_junior_desc: "Zbliżasz się do sędziwego wieku. Wyznaczenie jednego z twoich [children|El] na [Concept('duumvirate', 'współcesarza nominalnego')|E] może pomóc twojej dynastii w utrzymaniu się na tronie, gdyby miało cię [Concept('character_death', 'zabraknąć')|E].$action_appoint_co_emperor_junior_help$"
 action_appoint_co_emperor_junior_help: "\n\n#help Możesz wybrać dowolne ze swoich prawowitych dzieci.\n\nJeśli zamiast tego wolisz wyznaczyć współcesarza z grona prawowitych członków [Concept('powerful_family', 'wpływowej rodziny')|E] w swoim [Concept('realm', 'państwie')|E], użyj akcji @declare_regent_icon! #high „$appoint_co_emperor_interaction$”#! na sobie.#!"
