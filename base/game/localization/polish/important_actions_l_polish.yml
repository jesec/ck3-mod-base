 action_regent_retract_help: "\n\n#help Co do zasady możesz odejmować wasali tylko swoim własnym wasalom.\n\nJeśli [recipient.GetTitledFirstName] odmówi, wciąż będziesz mieć szansę na wycofanie się bez konieczności rozpoczęcia [Concept('war', 'wojny')|E].#!"
