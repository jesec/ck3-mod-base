 action_station_men_at_arms_desc: "Masz co najmniej jeden [regiment|El] [Concept( 'men_at_arms', 'zbrojnych' )|E], który może [Concept( 'station', 'stacjonować' )|E] w [holdings|El] należącej do twojej [domains|El].$action_station_men_at_arms_HELP$"
 action_station_men_at_arms_HELP: "\n\n#help Najsilniejsi [men_at_arms|El] powinni stacjonować w [Concept( 'holdings', 'posiadłościach' )|E] z [Concept( 'buildings', 'budowlami' )|E], które zwiększają ich skuteczność.\n\nWyspecjalizowanie jednej lub dwóch z twoich posiadłości w celu znacznego zwiększenia siły konkretnych rodzajów zbrojnych może pomóc w [Concept( 'wars', 'wojnach' )|E].#!"
