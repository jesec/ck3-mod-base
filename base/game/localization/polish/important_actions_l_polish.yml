 action_non_adult_ruler_not_betrothed_label: "Nie jesteś [Concept('betrothed', 'zaręczony')|El]"
 action_non_adult_ruler_not_betrothed_desc: "Nie jesteś jeszcze [Concept( 'adult', 'osobą dorosłą' )|E], z tego też powodu możesz się [Concept( 'betrothed', 'zaręczyć' )|E].\n\n#help Zaręczyny zostaną przekształcone w [Concept( 'marriage', 'małżeństwo' )|E], gdy obie postacie będą dorosłe.#! $GENERAL_MARRIAGE_ACTION_HELP$"
