 action_can_send_to_childrens_examination_combined_label: "Osoba znana jako [recipient.GetShortUINameNotMeNoTooltip], a dla ciebie [actor.Custom2('RelationToMe', recipient)], [recipient.GetAge] lat"
 #tooltip heading
