 action_title_election: "@election_icon! Trwająca elekcja: [landed_title.Custom('GetTierIcon')] [landed_title.GetBaseNameNoTooltip|V]"
 action_title_election_combined_group_label: "@election_icon! Trwające elekcje"
 action_title_election_combined_group_name: "Można wyświetlić podgląd aktywnych wyborów"
 action_title_election_desc: "W miejscu o nazwie [election|El], którego [Concept('title', 'tytułem')|E] zarządza [landed_title.GetHolder.GetUINameNotMe], trwa [election|El].\n\nWiodącym kandydatem jest obecnie [landed_title.GetHeir.GetUINameNotMe].\n\n$action_title_election_help$"
 action_title_election_combined_group_description: "W twoim [Concept('realm', 'państwie')|E] trwają [elections|El].\n\n$action_title_election_help$"
 action_title_election_help: "#help Jeśli jesteś elektorem, pamiętaj, że trwające elekcje warto śledzić nawet po oddaniu głosów. Swój głos możesz zmienić w dowolnym momencie!\n\nŚledzenie elekcji to dobry pomysł również wtedy, gdy nie jesteś elektorem. Nie ma przecież rzeczy niemożliwych… A nuż #emp to ty#! zostaniesz wiodącym kandydatem?#!"
 action_title_election_label: "@election_icon! Trwająca elekcja: [landed_title.Custom('GetTierIcon')] [landed_title.GetBaseNameNoTooltip|V]"
 action_title_election_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip|V]"
 action_title_election_click: "#I Kliknij, aby wyświetlić proces elekcyjny#!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! Można przyznać wasala prawowitemu seniorowi"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Można przyznać wasali prawowitemu seniorowi"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Można przyznać wasali ich prawowitemu seniorowi"
 action_grant_vassal_to_rightful_liege_desc: "Przekazując [secondary_actor.GetNameNoTooltip] postaci [recipient.GetNameNoTooltip] pozbędziesz się kary [Concept( 'rightful_liege', 'prawowitego seniora' )|E].$action_grant_vassal_to_rightful_liege_HELP$"
 action_grant_vassal_to_rightful_liege_combined_group_description: "Możesz przekazać [Concept( 'vassal', 'wasala' )|E] jego [Concept( 'rightful_liege', 'prawowitemu seniorowi' )|E].$action_grant_vassal_to_rightful_liege_HELP$"
 action_grant_vassal_to_rightful_liege_label: "@vassal_icon! Możesz przekazać wasala [secondary_actor.GetPrimaryTitle.Custom('GetTierIcon')][secondary_actor.GetUINameNotMeNoTooltip] postaci [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMeNoTooltip]"
 action_grant_vassal_to_rightful_liege_combined_label: "Przyznaj wasala [secondary_actor.GetPrimaryTitle.Custom('GetTierIcon')][secondary_actor.GetUINameNotMeNoTooltip] postaci [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMeNoTooltip]"
 action_grant_vassal_to_rightful_liege_click: "#I Kliknij, aby przyznać wasala#!"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E], których nie jesteś prawowitym seniorem, zapewniają ci mniej zasobów i mają o tobie mniejszą [Concept( 'opinion', 'opinię' )|E]. Czasami najlepiej jest przyznać tych wasali ich prawowitemu seniorowi, zakładając, że oni również są twoimi wasalami.\n\nCzasami przyznanie wasala prawowitemu seniorowi oznacza, że otrzymasz mniej, ale i tak warto ich przyznać – ich prawowity senior będzie mieć wobec ciebie wysoką karę do opinii za posiadanie wasala, którego uważa za swojego.\n\nUtrzymanie dobrej drabiny feudalnej jest kluczem do stabilnego państwa.#!"
 action_can_create_head_of_faith_title: "@titles_icon! Możesz utworzyć [Concept( 'head_of_faith', 'głowę wiary' )|E] ([actor.GetFaith.GetNameNoTooltip])"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Tworząc tytuł głowy wiary stajesz się równocześnie [Concept('temporal_head_of_faith','świecką głową wiary')|E]!#!"
 action_can_create_head_of_faith_title_label: "@titles_icon! Możesz utworzyć [Concept( 'head_of_faith', 'głowę wiary' )|E] ([actor.GetFaith.GetNameNoTooltip])"
 action_can_create_head_of_faith_title_click: "#I Kliknij, aby wyświetlić wiarę#!"
 action_can_claim_liege_title: "@titles_icon! Możesz wysunąć roszczenie do tytułu swojego seniora"
 action_can_claim_liege_title_desc: "Kontrolujesz większość [Concept('counties', 'hrabstw')|E] należących [de_jure|El] do jednego z [Concept('titles','tytułów')|E] twojego [Concept('liege_possessive','seniora')|E]. Oznacza to, że możesz wydać [prestige|El], aby uzyskać [unpressed_claim|El] do tego tytułu!\n\n#help Posiadanie niewysuniętego roszczenia do tytułu wyższego poziomu daje ci możliwość podniesienia swojej rangi. Możesz to wykorzystać do założenia [Concept('claimant_faction','frakcji pretendenckiej')|E] lub wypowiedzenia [Concept('war', 'wojny')|E] swojemu seniorowi.#!"
