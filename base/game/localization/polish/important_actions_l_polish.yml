 action_can_reforge_artifact_label: "$action_can_reforge_artifact$"
 action_can_reforge_artifact_desc: "Twój [artifact|El] ([artifact.GetName]) ma niską [durability|El]. Artefakty, które stracą całą swoją trwałość, pękają i nie nadają się do użytku.\n\n#help [Concept('reforge', 'Przekuwaj')|E] lub [Concept('repair', 'naprawiaj')|E] artefakty o niskiej trwałości z pomocą osoby: [GetCourtPositionType('antiquarian_court_position').GetName()]. Dzięki temu możesz zapobiec ich zniszczeniu!#!"
 action_can_reforge_artifact_click: "#I Kliknij, aby otworzyć okno ekwipunku#!"
