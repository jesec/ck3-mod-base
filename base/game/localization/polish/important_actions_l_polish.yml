 action_disabled_building_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip]"
 action_disabled_building_desc: "Co najmniej jedna z twoich [Concept('buildings', 'budowli')|E] na terenie [landed_title.GetAdjective] jest wyłączona z użytku.$action_disabled_building_HELP$"
 action_disabled_building_click: "#I Kliknij, aby wyświetlić#!"
 action_disabled_building_combined_group_label: "@building_icon! Wyłączone budowle"
 action_disabled_building_combined_group_name: "@building_icon! Wyłączone budowle"
 action_disabled_building_combined_group_description: "Wiele [Concept( 'buildings', 'budowli' )|E] w twoich [Concept( 'holdings', 'posiadłościach' )|E] jest wyłączonych.$action_disabled_building_HELP$"
 action_disabled_building_HELP: "\n\n#help Wyłączona budowla nie zapewnia właścicielowi żadnych korzyści. Chociaż może być wiele powodów, dla których budowla została wyłączona, najczęstszym z nich jest niewłaściwa forma [Concept( 'government', 'rządu' )|E].#!"
 action_nominate_successor: "Nominuj następcę"
 action_nominate_successor_desc: "Nie oddano jeszcze głosu na [Concept( 'title_heir', 'sukcesora tytułu' )|E] [landed_title.GetAdjective].\n\n#help Niektóre [titles|El] korzystają z elekcyjnej formy [Concept( 'succession', 'dziedziczenia' )|E], w której tytuł jest przekazywany wybieralnemu dziedzicowi, a nie bezpośredniemu krewnemu. Musisz na kogoś zagłosować, najlepiej na jednego ze swoich [Concept( 'realm_heirs', 'następców' )|E] lub członka swojej [Concept('dynasty', 'dynastii')|E].#!"
 action_nominate_successor_click: "#I Kliknij, aby wyświetlić proces wyborczy#!"
