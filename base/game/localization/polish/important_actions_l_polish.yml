 action_close_family_can_marry_label: "@cs_arrange_marriage_icon! [actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetShortUINameNotMeNoTooltip], może zawrzeć związek małżeński [recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)]"
 action_close_family_can_marry_desc: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetShortUINameNotMe], wykazuje gotowość do zawarcia związku małżeńskiego. [recipient.Custom2('GetSuccessionLinePositionLongCurrentSituation', actor)]\n\n#help Zaaranżowanie dla [recipient.Custom('PL_niego_niej')] odpowiedniego [Concept('marriage', 'małżeństwa')|E] przyniesie twojej [Concept('dynasty', 'dynastii')|E] korzyści, a nawet może doprowadzić do zawiązania nowego [Concept('alliance', 'sojuszu')|E].#!"
