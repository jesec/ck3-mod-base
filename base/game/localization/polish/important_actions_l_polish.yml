 action_can_send_faction_demand_desc: "Twoja [faction|El] stała się wystarczająco silna, by stanowić zagrożenie. Powinieneś rozważyć nagłośnienie swoich żądań."
 action_can_send_faction_demand_click: "#I Kliknij, aby wyświetlić frakcję#!"
 action_primary_heir_wrong_dynasty_but_replacement_exists: "[primary_heir|E] nie należy do właściwej [Concept('dynasty', 'dynastii')|E]"
 action_primary_heir_wrong_dynasty_but_replacement_exists_label: "Twój [primary_heir|El] nie należy do twojej [Concept('dynasty', 'dynastii')|E]!"
 action_primary_heir_wrong_dynasty_but_replacement_exists_desc: "Twój [primary_heir|El] nie należy do twojej [Concept( 'dynasty', 'dynastii' )|E]!\n\n#help Twój [primary_title|El] zostanie odziedziczony przez kogoś spoza twojej dynastii. Oznacza to, że po swojej śmierci możesz utracić dużo ziem. W dalszej części [Concept( 'line_of_succession', 'linii sukcesji' )|E] są członkowie twojej [Concept( 'dynasty', 'dynastii' )|E]. Możesz upewnić się, że jeden z nich będzie głównym dziedzicem, zmieniając [Concept( 'succession_laws', 'prawa sukcesyjne' )|E], a nawet mordując…#!"
