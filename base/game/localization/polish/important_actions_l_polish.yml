 action_primary_heir_wrong_dynasty_no_replacement_exists_label: "$action_primary_heir_wrong_dynasty_but_replacement_exists_label$"
 action_primary_heir_wrong_dynasty_no_replacement_exists_desc: "$action_primary_heir_wrong_dynasty_but_replacement_exists_label$\n\n#help Twój [primary_title|El] zostanie odziedziczony przez kogoś spoza twojej dynastii. Oznacza to, że po swojej śmierci możesz utracić dużo ziem. Nadal masz możliwość dziedziczenia przez członków swojej dynastii, zmieniając obecną [Concept( 'line_of_succession', 'linię sukcesji' )|E] w [Concept( 'succession_laws', 'prawach sukcesyjnych' )|E], a nawet mordując…#!"
 action_primary_heir_wrong_dynasty_no_replacement_exists_click: "$action_primary_heir_wrong_dynasty_but_replacement_exists_click$"
 action_no_player_heir_but_replacement_exists_gameover_risk: "Brak [Concept('player_heir', 'następcy')|E] z twojej [Concept('dynasty', 'dynastii')|E]"
 action_no_player_heir_but_replacement_exists_gameover_risk_label: "$action_no_player_heir_but_replacement_exists_gameover_risk$"
 action_no_player_heir_but_replacement_exists_gameover_risk_desc: "Nie masz żadnych grywalnych [Concept('titles', 'tytułów')|E], które członkowie twojej [Concept('dynasty', 'dynastii')|E] odziedziczą po twojej śmierci!\n\n#help Oznacza to, że gra zakończy się, gdy umrzesz! Jednakże niektórzy członkowie twojej dynastii są w dalszej [Concept('line_of_succession', 'linii sukcesji')|E] do odziedziczenia przynajmniej jednego z twoich tytułów. Upewnij się, że jeden z nich ma szansę odziedziczyć tytuł o [Concept('title_rank', 'randze')|E] [Concept('count', 'hrabiego')|E] lub wyższej, poprzez zmianę [Concept('succession_laws', 'praw sukcesyjnych')|E] lub w następstwie zaplanowania spisku „[GetScheme('murder').GetTypeName]”…#![AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_theocracy' ), 'action_no_player_heir_but_replacement_exists_gameover_risk_theocracy_desc' )]"
 action_no_player_heir_but_replacement_exists_gameover_risk_theocracy_desc: "\n\n#help Aby rozpocząć [Concept('dynasty', 'dynastię')|E], użyj [Concept('decision', 'decyzji')|E] „#high $pam_establish_theocratic_dynasty_decision$#!”, jeśli jesteś postacią [Concept('lowborn', 'nisko urodzoną')|E]. Aby wybrać godnego następcę ze swojego [Concept('court', 'dworu')|E], użyj [Concept('character_interaction', 'interakcji z postacią')|E] „#high $designate_theocratic_heir_interaction$#!”#!"
 action_no_player_heir_but_replacement_exists_gameover_risk_click: "#I Kliknij, aby wyświetlić $game_concept_title$#!"
 action_no_heir: "Brak [Concept( 'player_heir', 'następcy gracza' )|E]"
 action_no_heir_label: "Nie posiadasz odpowiedniego [Concept( 'player_heir', 'następcy' )|E]!"
 action_no_heir_desc: "Żaden z twoich [Concept('titles', 'tytułów')|E] nie zostanie odziedziczony przez [Concept('heir', 'dziedzica')|E] z twojej [Concept('dynasty', 'dynastii')|E]!\n\n#help Jeżeli nie masz dziedzica w swojej dynastii, gra zakończy się. Ty lub jeden z twoich bliskich krewnych dynastycznych musicie spłodzić prawowite dziecko i dopilnować, aby [succession_laws|El] i [gender_laws|El] twojego [Concept('realm', 'państwa')|E] pozwoliły mu na dziedziczenie.#![AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_theocracy' ), 'action_no_player_heir_but_replacement_exists_gameover_risk_theocracy_desc' )]"
 action_no_heir_click: "#I Kliknij, aby wyświetlić swoją postać#!"
