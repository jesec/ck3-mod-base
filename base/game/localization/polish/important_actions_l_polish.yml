 action_can_send_to_childrens_examination_combined_group_name: "$action_can_send_to_childrens_examination_combined_group_label$"
 #tooltip contents
 action_can_send_to_childrens_examination_desc: "Możesz wysłać osobę znaną jako [recipient.GetShortUINameNotMe], a dla ciebie [actor.Custom2('RelationToMe', recipient)], na egzamin dziecięcy.$action_can_send_to_childrens_examination_HELP$"
 action_can_send_to_childrens_examination_combined_group_description: "Możesz wysłać niektórych swoich krewnych na egzamin dziecięcy.$action_can_send_to_childrens_examination_HELP$"
 action_can_send_to_childrens_examination_click: "#I Kliknij, aby wysłać na egzamin#!"
 action_can_send_to_childrens_examination_HELP: "\n\n#help Udział w egzaminie dziecięcym nie jest konieczny do udanej kariery w służbie cywilnej. Jednak w zależności od [Concept('learning_skill', 'umiejętności nauki')|E] [Concept('child', 'dziecka')|E] może ono uzyskać [merit|El] i przyspieszyć swoją drogę do [Concept('examinations', 'egzaminów')|E] wyższych poziomów.#!"
