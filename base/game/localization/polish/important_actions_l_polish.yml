 action_missing_ghw_beneficiary_desc: "Nie masz wybranego [Concept('beneficiary', 'beneficjenta')|E] wielkiej świętej wojny: [actor.GetFaith.GHWName].\n\n#help Każdy uczestnik wielkich świętych wojen może mieć beneficjenta, który w przypadku wygranej otrzyma część przejętych [Concept('titles', 'tytułów')|E]. Najlepiej wybrać takiego beneficjenta, który darzy cię sympatią lub wniesie do twojej [Concept('dynasty', 'dynastii')|E] [Concept('dynasty_prestige', 'renomę')|E].#!"
