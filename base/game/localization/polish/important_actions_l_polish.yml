 action_close_family_can_marry_combined_group_description: "Kilku członków twojej [Concept( 'close_family', 'bliskiej rodziny' )|E] może zawrzeć związek małżeński.\n\n#help Zaaranżowanie dla nich [Concept( 'marriages', 'małżeństw' )|E] mogłoby przynieść twojej [Concept( 'dynasty', 'dynastii' )|E] korzyści, a także pozwoliłoby na zawarcie nowych [Concept( 'alliances', 'sojuszy' )|E].#!"
 action_close_family_can_marry_combined_label: "[actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.GetShortUINameNotMeNoTooltip], [recipient.GetAge] #low [recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)]"
