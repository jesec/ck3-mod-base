 mercenary_contract_expiring_desc: "Kontakt z [SCOPE.sMercenary('target').GetName] wygaśnie za [SCOPE.sMercenary('target').GetHiredTimeLeft].\n\n#help Najemnicy będą walczyć dla ciebie tylko przez ograniczony czas. Jeżeli już ich nie potrzebujesz, możesz po prostu pozwolić, aby kontrakt wygasł.#!"
 mercenary_contract_expiring_click: "#I Kliknij, aby wyświetlić oddział najemników#!"
