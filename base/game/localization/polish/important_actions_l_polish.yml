 action_can_select_personal_tenet_desc: "Przyjęcie nowego [Concept('personal_tenet', 'dogmatu osobistego')|E] może przynieść ci korzyści."
 action_can_select_personal_tenet_click: "#I Kliknij, aby zobaczyć swoje [personal_tenets|El] i wybrać jeden#!"
 action_excommunicated_recovery_label: "@warning_icon! [GetTrait('excommunicated').GetName( GetPlayer )]"
 action_excommunicated_recovery: "$action_excommunicated_recovery_label$"
 action_excommunicated_recovery_desc: "[Concept('excommunicated', 'Ekskomunikowano')|E] cię. [modifier|E] „[GetModifier('recent_excommunication').GetNameWithTooltip]” blokuje ułaskawienie na rok od nałożenia ekskomuniki.\n\n$EFFECT_LIST_BULLET$Postacie o tytule książęcym lub niższym (miejscowa ekskomunika): użyj interakcji #high „Złóż deklarację skruchy”#! u właściwego duchownego #weak (lub u twojej [Concept('head_of_faith', 'głowy wiary')|E], jeśli żaden niższy rangą duchowny nie ma wyższej rangi od ciebie).#!\n$EFFECT_LIST_BULLET$Wszyscy [rulers|El] ekskomunikowani przez twoją [Concept('head_of_faith', 'głowę wiary')|E] lub rządzący królestwem bądź imperium: złóż petycję osobiście, używając interakcji #high „Znieś ekskomunikę”#![AddLocalizationIf( GetPlayer.IsIndependentRuler, 'action_excommunicated_recovery_independent_help' )]\n\nSprawdź [Concept('excommunicated_recovery', 'opcje zniesienia')|E] ekskomuniki, aby poznać szczegóły."
 action_excommunicated_recovery_independent_help: "\n$EFFECT_LIST_BULLET$@warning_icon! Ponieważ jesteś [Concept('ruler', 'władcą')|E] [Concept('independent', 'niezależnym')|E], sąsiadujący [rulers|El] wyznający tę samą [Concept('faith', 'wiarę')|E] mogą wypowiedzieć ci [Concept('excommunication_war', 'wojnę przeciwko ekskomunikowanemu władcy')|E]"
 action_excommunicated_recovery_click: "#I Kliknij, aby uzyskać rozgrzeszenie lub wyświetlić wskazówki dotyczące powrotu do wiary#!"
 action_excommunicated_recovery_penance_toast: "Wymagana pokuta"
 action_excommunicated_recovery_penance_toast_desc: "Musisz przeczekać rok pokuty, zanim uzyskasz możliwość zniesienia statusu osoby [Concept('excommunicated', 'ekskomunikowanej')|E]. Nie można prosić o rozgrzeszenie, jeśli modyfikator „[GetModifier('recent_excommunication').GetNameWithTooltip]” jest aktywny."
 action_excommunicated_recovery_no_cleric_toast: "Brak odpowiedniego duchownego"
 action_excommunicated_recovery_no_cleric_toast_desc: "Obecnie nie ma w pobliżu duchownego, który mógłby wysłuchać twojej deklaracji skruchy. Jeśli ekskomunikowała cię twoja [head_of_faith|El] lub zarządzasz królestwem bądź imperium, złóż petycję o zniesienie ekskomuniki osobiście."
 action_excommunication_at_risk: "@warning_icon! Ryzyko ekskomuniki"
 action_excommunication_at_risk_label: "$action_excommunication_at_risk$"
 action_excommunication_at_risk_desc: "Wkrótce może na ciebie zostać nałożona ekskomunika.\n\n$EFFECT_LIST_BULLET$Twoja [head_of_faith|El], [secondary_recipient.GetShortUINameNotMe], może cię ekskomunikować, jeśli jesteście [Concept('rivals', 'rywalami')|E], [Concept('nemeses', 'śmiertelnymi wrogami')|E] lub jeśli prowadzisz przeciwko tej głowie wiary [Concept('war', 'wojnę')|E]\n$EFFECT_LIST_BULLET$Wrogi sąsiadujący [ruler|E], posiadający wystarczającą ilość [Concept('piety', 'pobożności')|E], może zażądać twojej ekskomuniki, jeśli cię nie lubi\n\n#help Zwiększ jego [Concept('opinion', 'opinię')|E] na swój temat, zmniejszając ilość [Concept('traits', 'cech')|E] uznawanych za [sinful|El], i sprawdź [Concept('excommunicated_recovery', 'opcje zniesienia ekskomuniki')|E], aby poznać szczegóły.[AddLocalizationIf( GetPlayer.IsIndependentRuler, 'action_excommunicated_recovery_independent_help' )]#!"
 action_excommunication_at_risk_click: "#I Kliknij, aby wyświetlić swoją [Concept('head_of_faith', 'głowę wiary')|E]#!"
 action_excommunication_at_risk_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip]"
 action_excommunication_at_risk_combined_group_name: "@warning_icon! Ryzyko ekskomuniki"
 action_excommunication_at_risk_combined_group_label: "@warning_icon! Wrodzy [rulers|El] mogą chcieć twojej ekskomuniki"
 action_excommunication_at_risk_combined_group_description: "[recipient.GetShortUINameNotMe] może zażądać twojej ekskomuniki od osoby, którą jest [secondary_recipient.GetShortUINameNotMe], twoja [head_of_faith|El]\n\n#help Zwiększ [secondary_recipient.Custom('PL_jego_jej')] [Concept('opinion', 'opinię')|E] na swój temat, zmniejszając ilość [Concept('traits', 'cech')|E] uznawanych za [sinful|El], i sprawdź [Concept('excommunicated_recovery', 'opcje zniesienia ekskomuniki')|E], aby poznać szczegóły.[AddLocalizationIf( GetPlayer.IsIndependentRuler, 'action_excommunicated_recovery_independent_help' )]#!"
 action_losing_realm_to_clerical_region: "@warning_icon! Utrata ziemi przy sukcesji"
 action_losing_realm_to_clerical_region_label: "$action_losing_realm_to_clerical_region$"
 action_losing_realm_to_clerical_region_desc: "Jesteś następną osobą w kolejce do [Concept('title', 'tytułu')|E] [Concept('clerical_region', 'regionu duchownego')|E], który nie obejmuje żadnego [Concept('county', 'hrabstwa')|E] w twoim [Concept('realm', 'państwie')|E]. W momencie [Concept('succession', 'sukcesji')|E] utracisz swoje ziemie i zostaniesz [Concept('archbishop', 'arcybiskupem')|E]."
 action_losing_realm_to_clerical_region_click: "#I Kliknij, aby wyświetlić [clerical_region|El]#!"
 action_in_line_for_local_clerical_region: "@religious_icon! W kolejce po miejscową archidiecezję"
 action_in_line_for_local_clerical_region_label: "@religious_icon! Jesteś #high [actor.GetPlaceInSuccession(landed_title)|O]#! w kolejce do następującego tytułu: [landed_title.GetNameNoTooltip]"
 action_in_line_for_local_clerical_region_desc: "Jesteś [actor.GetPlaceInSuccession(landed_title)|O] w [Concept('line_of_succession', 'linii sukcesji')|E] do następującego tytułu: [landed_title.GetName]. Jest to [archdiocese|El] obejmująca twoją [Concept('realm_capital', 'stolicę państwa')|E]. Jeśli odziedziczysz ten [title|El] [Concept('clerical_region', 'regionu duchownego')|E], staniesz się jej [Concept('archbishop', 'arcybiskupem')|E]."
 action_in_line_for_local_clerical_region_click: "#I Kliknij, aby wyświetlić [clerical_region|El]#!"
 action_can_request_new_clerical_region: "@religious_icon! Poproś o nową archidiecezję"
 action_can_request_new_clerical_region_label: "$action_can_request_new_clerical_region$"
 action_can_request_new_clerical_region_desc: "Możesz poprosić osobę, którą jest [recipient.GetShortUINameNotMe], o utworzenie nowego [Concept('clerical_region', 'regionu duchownego')|E] z siedzibą w miejscu znanym jako [target_title.GetName]. Jako petent z ziemią staniesz się nowym [Concept('archbishop', 'arcybiskupem')|E]."
 action_can_request_new_clerical_region_click: "#I Kliknij, aby użyć interakcji „$request_ecclesiastical_title_creation_interaction$”#!"
 action_can_request_clerical_region_expansion: "@religious_icon! Wystąp o poszerzenie archidiecezji"
 action_can_request_clerical_region_expansion_label: "@religious_icon! Poszerz swoją archidiecezję o miejsce znane jako [target_title.GetNameNoTooltip]"
 action_can_request_clerical_region_expansion_desc: "Możesz poprosić osobę, którą jest [recipient.GetShortUINameNotMe], aby poszerzyła twój [clerical_region|El] o miejsce znane jako [target_title.GetName]."
 action_can_request_clerical_region_expansion_click: "#I Kliknij, aby użyć interakcji „$request_ecclesiastical_title_expansion_interaction$”#!"
 action_can_request_enforce_succession: "@religious_icon! Poproś o sukcesję przymusową"
 action_can_request_enforce_succession_label: "@religious_icon! Wystąp o sukcesję przymusową dla miejsca znanego jako [landed_title.GetNameNoTooltip]"
 action_can_request_enforce_succession_desc: "Możesz poprosić osobę, którą jest [recipient.GetShortUINameNotMe], aby zmusiła osobę znaną jako [landed_title.GetHolder.GetShortUINameNotMe] do przekazania prawowitemu [Concept('heir', 'dziedzicowi')|E] następującego miejsca: [landed_title.GetName]. Możesz o to wystąpić, ponieważ masz [claim|El] do tego [Concept('title', 'tytułu')|E]."
 action_can_request_enforce_succession_click: "#I Kliknij, aby użyć interakcji „$request_enforce_succession_interaction$”#!"
 action_can_request_enforce_succession_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip]"
 action_can_request_enforce_succession_combined_group_label: "@religious_icon! Poproś o sukcesję przymusową"
 action_can_request_enforce_succession_combined_group_name: "$action_can_request_enforce_succession_combined_group_label$"
 action_can_request_enforce_succession_combined_group_description: "Możesz poprosić swojego [Concept('archbishop', 'arcybiskupa')|E] o wymuszenie sukcesji wielu [Concept('titles', 'tytułów')|E], do których masz [claims|El]."
 action_can_demand_church_succession: "@religious_icon! Zażądaj sukcesji kościelnej"
 action_can_demand_church_succession_label: "@religious_icon! Zażądaj sukcesji kościelnej od osoby, którą jest [recipient.GetShortUINameNotMeNoTooltip]"
 action_can_demand_church_succession_desc: "[recipient.GetShortUINameNotMe] jest w podeszłym wieku i nie ma żyjących [children|El]. Możesz zażądać, aby w przypadku śmierci bez prawowitego [Concept('heir', 'dziedzica')|E] [recipient.Custom('PL_jego_jej')] [realm|El] zostało przekazane posiadaczowi twojego [Concept('primary_heir', 'tytułu głównego')|E] jako [Concept('fallback_heir', 'dziedzicowi zastępczemu')|E]"
 action_can_demand_church_succession_click: "#I Kliknij, aby użyć interakcji „$demand_church_succession_interaction$”#!"
 action_can_demand_church_succession_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip]"
 action_can_demand_church_succession_combined_group_label: "@religious_icon! Zażądaj sukcesji kościelnej"
 action_can_demand_church_succession_combined_group_name: "$action_can_demand_church_succession_combined_group_label$"
 action_can_demand_church_succession_combined_group_description: "Pobliscy bezdzietni [rulers|El] w podeszłym wieku mogą zostać zobowiązani, aby ich [realms|El] przypadły twojemu [Concept('title', 'tytułowi')|E] w przypadku wygaśnięcia ich linii."
 action_pam_decision_confession_label: "Dostępna decyzja: $pam_decision_confession_name$"
 action_pam_decision_confession: "$action_pam_decision_confession_label$"
 action_pam_decision_confession_desc: "Twoje [spiritual_fulfillment|El] jest niskie. Podjęcie [Concept('decision', 'decyzji')|E] „[GetDecisionWithKey('pam_decision_confession').GetName]” może odnowić twą duszę i zmniejszyć [stress|El]."
 action_pam_decision_confession_click: "#I Kliknij, aby otworzyć okno decyzji „$pam_decision_confession_name_low$”#!"
 action_can_request_preach_legitimacy: "@legitimacy_icon! Głoś legitymację"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! Głoś legitymację"
 action_can_request_preach_legitimacy_combined_group_name: "$action_can_request_preach_legitimacy_combined_group_label$"
 action_can_request_preach_legitimacy_desc: "Co najmniej jeden władca [ecclesiastical|El] wyznający twoją [Concept('faith', 'wiarę')|E] może zgodzić się na poparcie twojej [Concept('legitimacy', 'legitymacji')|E] w zamian za [piety|El] i inne możliwe ustępstwa.$action_can_request_preach_legitimacy_help_desc$"
 action_can_request_preach_legitimacy_combined_group_description: "[ecclesiastical|E] [rulers|El] mogą pomóc ci z interakcją „$request_legitimacy_interaction$”.$action_can_request_preach_legitimacy_help_desc$"
 action_can_request_preach_legitimacy_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip] może poprawić @legitimacy_icon! twoją legitymację"
 action_can_request_preach_legitimacy_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip]"
 action_can_request_preach_legitimacy_click: "#I Kliknij, aby użyć interakcji „$request_legitimacy_interaction$”#!"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help [legitimacy|E] [Concept('ruler', 'władców')|E] jest całkowicie zależna od aprobaty [actor.GetFaith.HighGodNamePossessive], a ta może objawić się jedynie przez duchowieństwo.#!"
 action_can_appoint_cardinals: "@religious_icon! Można wyznaczyć kardynałów"
 action_can_appoint_cardinals_combined_group_label: "@religious_icon! Możesz wyznaczyć kardynałów"
 action_can_appoint_cardinals_combined_group_name: "$action_can_appoint_cardinals$"
 action_can_appoint_cardinals_desc: "Możesz wyznaczyć osobę znaną jako [recipient.GetShortUINameNotMe] na [Concept('cardinal', 'kardynała')|E].$action_can_appoint_cardinals_help_desc$"
 action_can_appoint_cardinals_combined_group_description: "Twoją [Concept('faith', 'wiarę')|E] reprezentuje mniej niż #V 10#! [Concept('cardinals', 'kardynałów')|E]. Wyznacz godnych [Concept('archbishops', 'arcybiskupów')|E] na członków [Concept('college_of_cardinals', 'Kolegium Kardynalskiego')|E].$action_can_appoint_cardinals_help_desc$"
 action_can_appoint_cardinals_label: "@religious_icon! Możesz wyznaczyć osobę znaną jako [recipient.GetShortUINameNotMeNoTooltip] na [Concept('cardinal', 'kardynała')|E]"
 action_can_appoint_cardinals_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip] z miejsca o nazwie [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 action_can_appoint_cardinals_click: "#I Kliknij, aby skorzystać z interakcji „$appoint_cardinal_interaction$”#!"
 action_can_appoint_cardinals_help_desc: "\n\n#help Wyświetlani kandydaci to piątka [Concept('archbishops', 'arcybiskupów')|E] o najwyższym poziomie [Concept('piety', 'pobożności')|E], których można obecnie mianować.#!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon! Kapłan koronny może zostać marionetką"
 action_can_make_clerical_puppet_label: "@theological_agent_puppet_icon! [actor.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|U] może zostać marionetką"
 action_can_make_clerical_puppet_desc: "Osoba znana jako [recipient.GetShortUINameNotMe] – twój [court_chaplain|El] – zgodziłaby się zostać [Concept('clerical_puppet', 'marionetkowym kapłanem koronnym')|E].\n\n#help Wyznaczenie [Concept('puppet', 'marionetki')|E] umożliwia realizowanie [Concept('scheme', 'spisków')|E] i wykonywanie [Concept('interactions', 'interakcji')|E] za pośrednictwem wybranej [Concept('character', 'postaci')|E].\n\n#help Skorzystanie z [Concept('interaction', 'interakcji')|E] „$make_clerical_puppet_interaction$” pozwoli ci wykonywać za pośrednictwem swojej [Concept('puppet', 'marionetki')|E] [interactions|El], które standardowo dostępne są tylko dla przedstawicieli [Concept('clergy', 'duchowieństwa')|E]. Twój [clerical_puppet|El] sprawia też pasywnie, że inni [rulers|El] duchowni są bardziej skłonni przyjąć twoje żądania.#!"
 action_can_make_clerical_puppet_click: "#I Kliknij, aby skorzystać z interakcji „$make_clerical_puppet_interaction$”#!"
 action_can_make_external_clerical_puppet: "@external_theological_agent_puppet_icon! Władca duchowny może zostać marionetką"
 action_can_make_external_clerical_puppet_label: "@external_theological_agent_puppet_icon! [recipient.GetShortUINameNotMeNoTooltip] może zostać marionetką"
 action_can_make_external_clerical_puppet_desc: "Osoba znana jako [recipient.GetShortUINameNotMe] – [ruler|El] [ecclesiastical|El] lub [theocratic|El] twojej [Concept('faith', 'wiary')|E] – zgodziłaby się zostać [Concept('external_clerical_puppet', 'marionetkowym władcą duchownym')|E].\n\n#help Skorzystanie z [Concept('interaction', 'interakcji')|E] „$make_external_clerical_puppet_interaction$” zapewni ci dostęp do znaczących działań przeznaczonych wyłącznie dla przedstawicieli [Concept('clergy', 'duchowieństwa')|E].\n\nJeśli jesteś [Concept('christian', 'chrześcijaninem')|E], mogą one obejmować wywieranie wpływu na [ecumenical_councils|El] i na dystrybucję [Concept('clerical_titles', 'tytułów duchownych')|E].#!"
 action_can_make_external_clerical_puppet_click: "#I Kliknij, aby skorzystać z interakcji „$make_external_clerical_puppet_interaction$”#!"
 action_can_make_external_clerical_puppet_combined_group_label: "@external_theological_agent_puppet_icon! Władca duchowny może zostać marionetką"
 action_can_make_external_clerical_puppet_combined_group_name: "$action_can_make_external_clerical_puppet_combined_group_label$"
 action_can_make_external_clerical_puppet_combined_group_description: "[rulers|E] [Concept('ecclesiastical', 'kościelni')|E] lub [Concept('theocratic', 'teokratyczni')|E] twojej [Concept('faith', 'wiary')|E] zaakceptowaliby rolę [Concept('external_clerical_puppet', 'marionetkowego władcy duchownego')|E].\n\n#help Skorzystanie z [Concept('interaction', 'interakcji')|E] „$make_external_clerical_puppet_interaction$” pozwoli ci wykonywać za pośrednictwem swojej [Concept('puppet', 'marionetki')|E] znaczące [interactions|El], które standardowo dostępne są wyłącznie dla przedstawicieli [Concept('clergy', 'duchowieństwa')|E]. Jeśli jesteś [Concept('christian', 'chrześcijaninem')|E], mogą one obejmować wywieranie wpływu na [ecumenical_councils|El] i na dystrybucję [Concept('clerical_titles', 'tytułów duchownych')|E].#!"
 action_can_make_external_clerical_puppet_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip]"
 action_can_make_external_ruler_puppet: "@external_ruler_puppet_icon! Władca świecki może zostać marionetką"
 action_can_make_external_ruler_puppet_label: "@external_ruler_puppet_icon! [recipient.GetShortUINameNotMeNoTooltip] może zostać marionetką"
 action_can_make_external_ruler_puppet_desc: "Postać znana jako [recipient.GetShortUINameNotMe] – [ruler|El] niebędący osobą [Concept('clerical', 'duchowną')|E] – zgodziłaby się zostać [Concept('external_ruler_puppet', 'marionetkowym władcą świeckim')|E].\n\n#help Skorzystanie z [Concept('interaction', 'interakcji')|E] „$make_external_ruler_puppet_interaction$” pozwoli ci wykonywać [interactions|El] za pośrednictwem [Concept('puppet', 'marionetki')|E].\n\n[rulers|E] świeccy mają dostęp do pewnych działań, których Kościół odmawia. Dzięki kontroli nad nimi możesz kształtować przyszłość swojej [Concept('faith', 'wiary')|E] i [Concept('rite', 'obrządku')|E].#!"
 action_can_make_external_ruler_puppet_click: "#I Kliknij, aby skorzystać z interakcji „$make_external_ruler_puppet_interaction$”#!"
 action_can_make_external_ruler_puppet_combined_group_label: "@external_ruler_puppet_icon! Władcy świeccy mogą zostać władcami marionetkowymi"
 action_can_make_external_ruler_puppet_combined_group_name: "$action_can_make_external_ruler_puppet_combined_group_label$"
 action_can_make_external_ruler_puppet_combined_group_description: "[rulers|E] niebędący osobami [Concept('clerical', 'duchownymi')|E] zaakceptowaliby rolę [Concept('external_ruler_puppet', 'marionetkowego władcy świeckiego')|E].\n\n#help Skorzystanie z [Concept('interaction', 'interakcji')|E] „$make_external_ruler_puppet_interaction$” pozwoli ci wykonywać [interactions|El] za pośrednictwem [Concept('puppet', 'marionetki')|E].\n\n[rulers|E] świeccy mają dostęp do pewnych działań, których Kościół odmawia. Dzięki kontroli nad nimi możesz kształtować przyszłość swojej [Concept('faith', 'wiary')|E] i [Concept('rite', 'obrządku')|E].#!"
 action_can_make_external_ruler_puppet_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip]"
 action_can_upgrade_great_cathedral: "$action_can_upgrade_great_cathedral_label$"
 action_can_upgrade_great_cathedral_label: "@great_project_icon! Możesz wznieść lub rozbudować swoją wielką katedrę romańską"
 action_can_upgrade_great_cathedral_desc: "Możesz zaplanować [great_project|El], aby wznieść budowlę, którą jest [GetBuilding('great_project_cathedral_01').GetName|Vl], albo rozbudować istniejący obiekt!\n\n#help Na początku [GetBuilding('great_project_cathedral_01').GetName|Vl] to siedziba biskupa, która przyciąga pielgrzymów. Kolejny poziom to [GetBuilding('great_project_cathedral_02').GetName|Vl], a następnie [GetBuilding('great_project_cathedral_03').GetName|Vl] – etapy te rozwijają twój [cathedral_complex|El] i odblokowują kolejne [domicile_buildings|El].#!"
 action_can_upgrade_great_cathedral_click: "#I Kliknij, aby wyświetlić wspaniałe projekty#!"
 action_can_plan_mass_conversion: "$action_can_plan_mass_conversion_label$"
 action_can_plan_mass_conversion_label: "@great_project_icon! Możesz rozpocząć projekt „$great_project_type_pam_mass_rite_conversion$”"
 action_can_plan_mass_conversion_desc: "Możesz rozpocząć planowanie [Concept('great_project', 'wspaniałego projektu')|E] „$great_project_type_pam_mass_rite_conversion$”!\n\n#help Jest to wspaniały projekt dostępny dla [Concept('clergy', 'duchowieństwa')|E], który nawraca wyznawców pogańskich [Concept('faiths', 'wiar')|E] w sąsiednim [Concept('duchy', 'księstwie')|E] na twój [rite|El].#!"
 action_can_plan_mass_conversion_click: "#I Kliknij, aby wyświetlić wspaniałe projekty#!"
 action_can_found_holy_site_in_capital: "@religious_icon! Można założyć miejsce święte"
 action_can_found_holy_site_in_capital_label: "@religious_icon! Możesz założyć [holy_site|El] w miejscu, którym jest [landed_title.GetNameNoTooltip]"
 action_can_found_holy_site_in_capital_desc: "[landed_title.GetName] można przekształcić w [holy_site|El] wiary znanej jako [actor.GetFaith.GetName|l].\n\n#help Założenie [Concept('holy_site', 'miejsca świętego')|E] pozwala ci [enshrine|El] posiadane przez ciebie [holy_relics|E], co umożliwia szerzenie płynących z nich korzyści na całą twoją [Concept('faith', 'wiarę')|E].#!"
 action_can_found_holy_site_in_capital_click: "#I Kliknij, aby wyświetlić miejsce święte#!"
