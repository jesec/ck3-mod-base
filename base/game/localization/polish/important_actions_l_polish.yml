 action_title_lost_from_realm_on_succession_label: "@bad_icon! Twoje państwo straci ziemię, jeśli umrze [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMeNoTooltip]"
 action_title_lost_from_realm_on_succession_desc: "Twój [vassal|El], [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNotMe], posiada [titles|El], które zostaną odziedziczone przez [Concept( 'rulers', 'władców' )|E] niebędących twoimi [Concept( 'vassals', 'wasalami' )|E].\n\n$TLFR_CROWN_AUTHORITY_TIP$"
 action_title_lost_from_realm_on_succession_click: "#I Kliknij, aby wyświetlić#!"
 action_title_lost_from_realm_on_succession_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNotMeNoTooltip]"
 action_title_lost_from_realm_on_succession_combined_group_label: "@bad_icon! Państwo straci ziemię, gdy wasale umrą"
 action_title_lost_from_realm_on_succession_combined_group_name: "@bad_icon! Państwo straci ziemię, gdy wasale umrą"
 action_title_lost_from_realm_on_succession_combined_group_description: "Niektórzy z twoich [Concept( 'vassals', 'wasali' )|E] posiadają [titles|El], które zostaną odziedziczone przez [Concept( 'rulers', 'władców' )|E] niebędących twoimi [Concept( 'vassals', 'wasalami' )|E].\n\n$TLFR_CROWN_AUTHORITY_TIP$"
 TLFR_CROWN_AUTHORITY_TIP: "#help Najskuteczniejszym sposobem na uniknięcie tej sytuacji jest zwiększenie swojego [Concept('crown_authority', 'autorytetu korony')|E] do poziomu: „[GetLaw('crown_authority_2').GetName]”. Może się jednak okazać, że wasal, o którym mowa, nie ma prawowitych dzieci. Jeśli jest w [Concept('married', 'poślubiony')|E] i ma wysoki poziom płodności, sprawa może rozwiązać się samodzielnie.#!"
 action_title_lost_from_realm_on_foreign_ruler_succession: "@bad_icon! Państwo straci ziemię, gdy wasal odziedziczy zagraniczny tytuł"
 action_title_lost_from_realm_on_foreign_ruler_succession_label: "@bad_icon! Państwo straci ziemię, jeżeli [recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip] odziedziczy tytuł: [landed_title.Custom('GetTierIcon')] [landed_title.GetBaseNameNoTierNoTooltip]"
 action_title_lost_from_realm_on_foreign_ruler_succession_desc: "Twój [vassal|El], [recipient.GetShortUINameNotMe], jest [Concept('heir', 'dziedzicem')|E] ziem znanych jako [landed_title.GetBaseNameNoTier] i stanowiących obcy [title|El] wyższego [Concept('title_tier', 'poziomu')|E] niż [recipient.Custom('PL_jego_jej')] obecny [primary_title|El].\n\n$TLFR_FOREIGN_RULER_SUCCESSION_TIPS$"
 action_title_lost_from_realm_on_foreign_ruler_succession_click: "#I Kliknij, aby wyświetlić#!"
 action_title_lost_from_realm_on_foreign_ruler_succession_combined_label: "[recipient.GetUINameNotMeNoTooltip]"
 action_title_lost_from_realm_on_foreign_ruler_succession_combined_group_label: "@bad_icon! Państwo straci ziemię, gdy wasale odziedziczą zagraniczne tytuły"
 action_title_lost_from_realm_on_foreign_ruler_succession_combined_group_name: "@bad_icon! Państwo straci ziemię, gdy wasale odziedziczą zagraniczne tytuły"
 action_title_lost_from_realm_on_foreign_ruler_succession_combined_group_description: "Niektórzy z twoich [Concept( 'vassals', 'wasali' )|E] są [Concept( 'heir', 'dziedzicami' )|E] obcych tytułów na [Concept( 'title_tier', 'poziomie' )|E] wyższym niż ich obecny [primary_title|El].\n\n$TLFR_FOREIGN_RULER_SUCCESSION_TIPS$"
 TLFR_FOREIGN_RULER_SUCCESSION_TIPS: "#help Jeśli wasal zdobędzie tytuł w obcym państwie o [Concept( 'title_rank', 'randze' )|E] wyższej niż jego obecny [primary_title|El], przestanie być twoim wasalem.\n\nIstnieje kilka sposobów, aby powstrzymać ziemie wasala przed opuszczeniem twojego państwa:\n$BULLET_WITH_TAB$[Concept( 'revoke', 'Odebranie' )|E] tytułu twojemu wasalowi\n$BULLET_WITH_TAB$Nadanie wasalowi tytułu o tym samym [Concept('title_tier', 'poziomie')|E], co tytuł, który odziedziczy#!"
