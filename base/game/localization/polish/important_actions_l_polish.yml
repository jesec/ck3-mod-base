 action_can_take_concubine: "@concubine_icon! Za mało konkubin"
 action_can_take_concubine_label: "$action_can_take_concubine$"
 action_can_take_concubine_desc: "Masz obecnie mniej [Concept( 'concubines', 'konkubin' )|E] niż wynosi limit dla kogoś z twoją rangą.\n\n#help Musisz mieć więcej [Concept( 'concubines', 'konkubin' )|E], aby uniknąć kary do [Concept( 'prestige', 'prestiżu' )|E], którą obecnie posiadasz.#!"
 action_can_take_concubine_click: "#I Kliknij, aby znaleźć odpowiednią konkubinę#!"
