 action_in_line_of_succession_for_title_desc: "Jesteś [actor.GetPlaceInSuccession(landed_title)|O] w [Concept('line', 'linii')|E] do tytułu: [landed_title.GetNameNoTier].\n\n#help Chociaż istnieje możliwość, że odziedziczysz ten tytuł bez podejmowania jakichkolwiek działań, to odpowiedni spisek ([GetScheme('murder').GetTypeName|l]) może zarówno przyspieszyć zdobycie tych ziem, jak i zapobiec utracie miejsca w linii.#!"
 action_in_line_of_succession_for_title_combined_group_description: "Jesteś wysoko w [Concept( 'line_of_succession', 'linii sukcesji' )|E] do wielu [Concept( 'titles', 'tytułów' )|E].\n\n#help Chociaż jest możliwe, że odziedziczysz te tytuły bez podejmowania jakichkolwiek działań, to jednak spisek „[GetScheme('murder').GetTypeName]” może zarówno przyspieszyć ich zdobycie, jak i zapobiec utracie miejsca w kolejce.#!"
