 action_ask_for_pardon_label: "@prison_icon! Możesz poprosić o ułaskawienie"
 action_ask_for_pardon_desc: "Obecnie twój [top_liege|El] uważa cię za [Concept( 'criminal', 'przestępcę' )|E], ale może cię ułaskawić.\n\n#help Jeśli jesteś przestępcą, twój senior może cię [Concept( 'imprison', 'uwięzić' )|E] w każdej chwili! Chociaż może cię to kosztować [Concept( 'hook', 'haka' )|E], zazwyczaj najlepiej jest spróbować zostać ułaskawionym.#!"
 action_ask_for_pardon_click: "#I Kliknij, aby poprosić o ułaskawienie#!"
