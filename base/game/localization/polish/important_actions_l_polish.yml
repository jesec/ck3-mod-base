 action_can_choose_dynasty_perk_desc: "Masz wystarczająco dużo [Concept( 'dynasty_prestige', 'renomy' )|E], aby odblokować [dynasty_perk|El] dla twojej [Concept( 'dynasty', 'dynastii' )|E].\n\n#help Jako [dynast|El] możesz wydawać renomę na działania innych członków dynastii, jednakże dziedzictwa to długoterminowe premie dla całej twojej dynastii.#!"
