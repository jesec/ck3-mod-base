 action_can_lawfully_imprison: "@prison_icon! Przestępca może zostać uwięziony"
 action_can_lawfully_imprison_label: "@prison_icon! Możesz prawowicie uwięzić osobę, którą jest [actor.Custom2('RelationToMe', recipient)|U] twojej osoby, [recipient.Custom('GetPrimaryTitleTierIcon')] [recipient.GetShortUINameNotMeNoTooltip]"
