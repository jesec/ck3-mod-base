 action_can_reforge_artifact_combined_group_description: "Kilka z twoich [Concept( 'artifacts','artefaktów')|E] ma niską [durability|El]. Artefakty, które utraciły całą swoją trwałość, pękają i stają się niezdane do użytku.\n\n#help Z pomocą osoby takiej jak [GetCourtPositionType('antiquarian_court_position').GetName()|l] [Concept('reforge', 'przekuj')|E] lub [Concept('repair', 'napraw')|E] artefakty o niskiej trwałości, aby zapobiec ich bezpowrotnemu zniszczeniu!#!"
