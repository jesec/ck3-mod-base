 action_can_use_hook_to_change_contract_combined_group_label: "@cs_weak_hook_icon! Możesz zmodyfikować kontrakty"
 action_can_use_hook_to_change_contract_combined_group_name: "$action_can_use_hook_to_change_contract_combined_group_label$"
 action_can_use_hook_to_change_contract_desc: "W ustroju, jakim jest [GetGovernment( 'feudal_government' ).GetName|l], możesz użyć [Concept('hook', 'haka')|E], którego masz na swojego [Concept('vassal', 'wasala')|E], osobę znaną jako [recipient.GetUINameNotMe], do zmiany [Concept('vassal_contract', 'kontraktu wasalnego')|E] tej postaci.\n\n#help Zwiększenie [Concept('obligations', 'zobowiązań')|E] [vassals_possessive|El] względem ciebie jest jednym z najbardziej wartościowych zastosowań [Concept('hook', 'haka')|E].\n\nW normalnych warunkach zaproponowanie nieuczciwej zmiany [Concept('vassal_contract', 'kontraktu wasalnego')|E] powoduje zwiększenie poziomu [Concept('tyranny', 'tyranii')|E], jednak używając [Concept('hook', 'haka')|E], unikniesz tej konsekwencji. Możesz zaproponować tylko jedną niesprawiedliwą zmianę – każda kolejna będzie skutkować zwiększeniem poziomu [Concept('tyranny', 'tyranii')|E].\n\nPamiętaj, aby #high zaznaczyć pole „Użyj haka”#! podczas modyfikowania [Concept('vassal_contract', 'kontraktu wasalnego')|E]!#!"
 action_can_use_hook_to_change_contract_combined_group_description: "W ustroju, jakim jest [GetGovernment( 'feudal_government' ).GetName|l], możesz używać [Concept('hooks', 'haków')|E], które masz na swoich [Concept('vassals', 'wasali')|E], do zmieniania ich [Concept('vassal_contracts', 'kontraktów wasalnych')|E].\n\n#help Zwiększenie [Concept('obligations', 'zobowiązań')|E] [vassals_possessive|El] względem ciebie jest jednym z najbardziej wartościowych zastosowań [Concept('hook', 'haka')|E].\n\nW normalnych warunkach zaproponowanie nieuczciwej zmiany [Concept('vassal_contract', 'kontraktu wasalnego')|E] powoduje zwiększenie poziomu [Concept('tyranny', 'tyranii')|E], jednak używając [Concept('hook', 'haka')|E], unikniesz tej konsekwencji. Możesz zaproponować tylko jedną niesprawiedliwą zmianę – każda kolejna będzie skutkować zwiększeniem poziomu [Concept('tyranny', 'tyranii')|E].\n\nPamiętaj, aby #high zaznaczyć pole „Użyj haka”#! podczas modyfikowania [Concept('vassal_contract', 'kontraktu wasalnego')|E]!#!"
 action_can_use_hook_to_change_contract_label: "@cs_weak_hook_icon! Możesz zmienić kontrakt postaci: tw[Select_CString( recipient.IsFemale, 'oja', 'ój' )] [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUINameNotMeNoTooltip]"
 action_can_use_hook_to_change_contract_combined_label: "[recipient.GetUINameNotMeNoTooltip], [actor.Custom2('RelationToMe', recipient)] twojej osoby"
 action_can_use_hook_to_change_contract_click: "#I Kliknij, aby zmodyfikować kontrakt#!"
