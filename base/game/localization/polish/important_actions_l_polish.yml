 action_swing_scales_liege_entrenched_dangerous_desc: "[recipient.GetUINameNotMe] zaczyna mieć niepokojąco duży wpływ na kontrolę twojego [realms|El], poprzez wzmocnienie [Concept( 'diarch_powers', 'powierzonej' )|E] [recipient.GetHerHim] władzy.\n\nPowin[Select_CString( GetPlayer.IsFemale, 'naś', 'ieneś' )] rozważyć ograniczenie [recipient.GetHerHis] rosnącej władzy.$action_swing_scales_liege_entrenched_dangerous_help$"
 action_swing_scales_liege_entrenched_dangerous_help: "\n\n#help Jeśli [recipient.GetFirstNameNoTooltip] stanie się zbyt wpływo[Select_CString( recipient.IsFemale, 'a', 'y' )], trudno będzie usunąć [Select_CString( recipient.IsFemale, 'ją', 'go' )] ze stanowiska [Select_CString( EqualTo_string( actor.GetDiarchTitle , 'Diarcha' ), 'diarchy', Select_CString( EqualTo_string( actor.GetDiarchTitle , 'Regent' ), 'regenta', actor.GetDiarchTitle ))]#!"
