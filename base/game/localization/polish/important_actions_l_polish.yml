 action_betrothed_can_marry_desc: "[secondary_actor.GetUINameNotMe|U] i [secondary_recipient.GetUINameNotMe] [Select_CString( secondary_actor.IsLocalPlayer, 'jesteście', 'są' )] [Concept('betrothed', 'zaręczeni')|E] i jako [Concept( 'adults', 'osoby dorosłe' )|E] [Select_CString( secondary_actor.IsLocalPlayer, 'możecie', 'mogą' )] zawrzeć teraz [Concept( 'married', 'związek małżeński' )|E].\n\n#help Chociaż możesz zerwać zaręczyny, to jednak pożądanym będzie ich uhonorowanie.#!"
 action_betrothed_can_marry_click: "#I Kliknij, aby potwierdzić małżeństwo#!"
