 action_not_enough_knights_desc: "Zatrudniani przez ciebie [GetPlayer.Custom( 'KnightCulturePlural' )|l] nie osiągnęli jeszcze limitu liczebności (obecny stan: [GetKnightCount( GetPlayer.Self )|V]/[GetKnightLimit( GetPlayer.Self )|V]).\n\n#help Chociaż zatrudnienie ich maksymalnej liczby nie jest konieczne, [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l] odznaczający się wysoką [Concept('prowess', 'walecznością')|E] mają znaczny wpływ na przebieg [Concept('battles', 'bitew')|E].\n\n$knight_culture_player_plural_no_tooltip$ mogą zostać zatrudnieni zarówno przez rekrutowanie [Concept('guests', 'gości')|E], którzy zamieszkują twój [GetPlayer.Custom('GetCourtConcept')|l], jak i rozpowszechnianie wieści o poszukiwaniach chętnych na tę pozycję.#!"
 action_not_enough_knights_click: "#I Kliknij, aby otworzyć widok wojskowy#!"
