 action_subsidise_liege_authority: "Wzmocnij autorytet użyczany ci przez seniora"
 action_subsidise_liege_authority_label: "@icon_contract_modification_single! Wzmocnij autorytet swojego seniora, aby zdobyć dla siebie więcej powierzonych władz"
 action_subsidise_liege_authority_desc: "Władza nad [Concept('realm', 'państwem')|E], którą sprawuje [recipient.GetTitledFirstName], jest krucha, co uniemożliwia ci korzystanie z niektórych [Concept('diarch_powers', 'powierzonych władz')|E].\n\nPomagając [recipient.Custom('PL_mu_jej')] umocnić [recipient.Custom('PL_jego_jej')] władzę, możesz wymienić popularność na władzę.$action_subsidise_liege_authority_help$"
