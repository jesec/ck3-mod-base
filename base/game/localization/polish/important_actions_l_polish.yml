 action_swing_scales_regent_label: "@law_icon! Możesz przechylić szale władzy"
 action_swing_scales_regent_desc: "Możesz zdobyć więcej mocy w [Concept('realm', 'państwie')|E] twojego [Concept('liege', 'seniora')|E], wydając [gold|El], [prestige|El] lub [piety|El] (jeśli ty i [recipient.GetTitledFirstName] wyznajecie tę samą [Concept('faith', 'wiarę')|E]).$action_swing_scales_regent_help$"
