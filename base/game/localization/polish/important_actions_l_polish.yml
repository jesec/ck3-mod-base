 action_regent_revoke_desc: "Jako [actor.GetLiege.GetDiarchTitle|l] osoby, którą jest [actor.GetLiege.GetTitledFirstName], uzyskujesz wystarczające przechylenie [Concept('scales_of_power', 'szal władzy')|E], by [Concept('revoke', 'odebrać')|E] innym [Concept('vassals', 'współwasalom')|E] [titles|El], do których masz [claim|El]."
