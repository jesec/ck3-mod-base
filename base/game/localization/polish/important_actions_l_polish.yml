 action_convert_at_war_interaction_desc: "Możesz nawrócić się na [Concept( 'faith', 'wiarę' )|E] postaci [recipient.GetShortUINameNotMe], aby zakończyć [recipient.GetHerHis] [Concept( 'holy_war', 'świętą wojnę' )|E] przeciwko tobie.\n\n#help Choć zakończenie przegranej wojny jest przydatne, pamiętaj, że członkowie twojej byłej wiary stracą o tobie [Concept( 'opinion', 'opinię' )|E] !#!"
