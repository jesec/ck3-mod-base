 action_designate_regent_for_hook_label: "@declare_regent_icon! Jeśli już teraz wyznaczysz na stanowisko o nazwie [actor.GetLiege.GetDiarchTitle] osobę, którą cechuje #P bezinteresowność#!, może to pomóc postaci, którą jest [recipient.GetFirstNameNoTooltip|V], a dla ciebie [actor.Custom2('RelationToMe', recipient)], w przypadku twojej przedwczesnej śmierci"
 action_designate_regent_for_hook_desc: "Twoje [health|E] zaczyna podupadać – możesz wkrótce umrzeć, a twój dziedzic, [recipient.GetTitledFirstName], jest osobą bardzo młodą.\n\nJeśli z wyprzedzeniem wyznaczysz regenta charakteryzującego się #P bezinteresownością#!, będzie po twojej [Concept('character_death_death', 'śmierci')|E] lojalnie służyć osobie, którą jest [recipient.GetFirstNameNoTooltip].$action_designate_regent_for_hook_help$"
 action_designate_regent_for_hook_help: "\n\n#help [recipient.GetFirstNameNoTooltip] uzyska [strong_hook|El] na każdego #P bezinteresownego#! regenta, którego wyznaczysz, o ile osoba ta pozostanie #P bezinteresowna#! w momencie twojej śmierci. [hook|E] przestanie działać, gdy [recipient.GetFirstNameNoTooltip] skończy 21 lat.#!"
 action_designate_regent_for_hook_click: "#I Kliknij, aby otworzyć okno diarchii#!"
 action_appoint_co_emperor_junior: "Nadaj status współcesarza nominalnego"
