 action_unaligned_join_movement_desc: "Nie należysz do żadnego [Concept('movement', 'ruchu')|E] w tym [Concept('dynastic_cycle', 'cyklu dynastii')|E].\n\n#help Bycie w grupie niezrzeszonych oznacza, że nie czerpiesz żadnych korzyści z członkostwa w ruchu.#!"
 action_unaligned_join_movement_click: "#I Kliknij, aby dołączyć do ruchu#!"
 action_landless_admin_escape_to_realm: "Ucieknij do innego państwa"
