 action_in_debt: "Zadłużony"
 action_in_debt_label: "@debt_icon! Zmagasz się z zadłużeniem"
 action_in_debt_desc: "Masz mniej niż [gold_i|E] #V 0#! sztuk [Concept('gold', 'złota')|E], co oznacza [debt|El]!\n\nDług powoduje skutki:\n$BULLET_WITH_TAB$Nie można wypowiedzieć [Concept('war', 'wojny')|E].\n$BULLET_WITH_TAB$Nie można uzupełnić [Concept('men_at_arms', 'zbrojnych')|E], którzy wymagają [gold_i|E] [Concept('gold', 'złota')|E].\n$BULLET_WITH_TAB$W twojej [Concept('domain', 'domenie')|E] rozprzestrzenia się [county_corruption|El].\n$BULLET_WITH_TAB$[vassals|E] są bardziej skłonni dołączyć do [Concept('factions', 'frakcji')|E].\n\nIm większy masz dług, tym większe wynikają z tego kary. Twój obecny poziom długu powoduje efekty:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Jeśli nie zyskujesz złota w każdym miesiącu, rozważ zmniejszenie wydatków, na przykład poprzez:\n$BULLET_WITH_TAB$Rozwiązanie własnych [Concept('armies', 'armii')|E].\n$BULLET_WITH_TAB$Zmniejszenie wielkości lub zniszczenie własnych [Concept('men_at_arms', 'zbrojnych')|E].\n$BULLET_WITH_TAB$Zwiększenie [Concept('control', 'kontroli')|E] za pomocą swojego [Concept('marshal', 'marszałka')|E].\n$BULLET_WITH_TAB$Odebranie [Concept('court_positions', 'urzędów dworskich')|E].#!"
 action_in_debt_click: ""
 action_in_treasury_debt: "$action_in_debt$"
 action_in_treasury_debt_label: "$action_in_debt_label$"
 action_in_treasury_debt_desc: "Zawartość twojego [Concept('treasury', 'skarbca')|E] wynosi mniej niż [treasury_i|E] #V 0#!, co oznacza [treasury_debt|El]!\n\nDług powoduje następujące skutki:\n$BULLET_WITH_TAB$Nie można wypowiedzieć [Concept('war', 'wojny')|E].\n$BULLET_WITH_TAB$Nie można uzupełnić [Concept('men_at_arms', 'zbrojnych')|E], którzy wymagają [treasury_i|E] [Concept('treasury', 'skarbca')|E].\n$BULLET_WITH_TAB$W twojej [Concept('domain', 'domenie')|E] rozprzestrzenia się [county_corruption|El].\n$BULLET_WITH_TAB$[vassals|E] są bardziej skłonni dołączyć do [Concept('factions', 'frakcji')|E].\n\nIm większy masz dług, tym większe wynikają z tego kary. Twój obecny poziom długu powoduje efekty:\n\n[GetPlayer.GetTreasuryDebtModifierDescription]\n\n#help Jeśli zawartość skarbca nie rośnie w każdym miesiącu, rozważ zmniejszenie wydatków, na przykład poprzez:\n$BULLET_WITH_TAB$Rozwiązanie własnych [Concept('armies', 'armii')|E].\n$BULLET_WITH_TAB$Zmniejszenie liczebności własnych [Concept('men_at_arms', 'zbrojnych')|E] lub ich zniszczenie.\n$BULLET_WITH_TAB$Zwiększenie [Concept('control', 'kontroli')|E] z pomocą swojego [Concept('marshal', 'marszałka')|E].\n$BULLET_WITH_TAB$Odebranie [Concept('court_positions', 'urzędów dworskich')|E].#!"
 action_in_treasury_debt_click: "$action_in_debt_click$"
 action_send_child_to_university: "@child_icon! Wyślij dziecko na uniwersytet"
 action_send_child_to_university_label: "@child_icon! Wyślij dziecko na uniwersytet"
 action_send_child_to_university_click: "#I Kliknij, aby wysłać swoje dziecko na uniwersytet#!"
 action_send_child_to_university_desc: "Możesz wysłać swoje dziecko na uniwersytet\n\n#help Na terenie twojego [Concept('realm', 'państwa')|E] znajduje się [building|El] [Concept('holy_site', 'miejsca świętego')|E], taka jak [GetBuilding('holy_site_cathedral_01').GetName|l], [GetBuilding('generic_university').GetName|l] lub [realm_capital|El] o nazwie [GetTitleByKey('h_china').GetName]! Wysłanie tam dziecka na naukę jest korzystne, ponieważ poprawi to jego [Concept('education_trait', 'cechę edukacji')|E], gdy stanie się [Concept('adult', 'postacią dorosłą')|E].\n\nMożliwe jednak, że masz już wybranego odpowiedniego [Concept('guardian', 'opiekuna')|E].#!"
 action_send_child_to_university_unimportant: "@warning_icon! #X Nie masz wystarczającej ilości [Concept('gold', 'złota')|E], aby zapłacić za edukację#!"
