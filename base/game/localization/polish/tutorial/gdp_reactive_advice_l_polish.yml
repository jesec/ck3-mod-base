l_polish:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "Zapotrzebowanie budowli"
 action_reactive_advice_building_needs: "Porada: $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "Twoje [buildings|El] mają [needs|El] na [trade_goods|El] pozyskiwane na [Concept('market', 'rynku')|E] lokalnym. Otwórz tę lekcję, aby dowiedzieć się, jak zaspokoić ich zapotrzebowanie."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "Jeśli chcesz czerpać maksymalne korzyści z [Concept('buildings', 'budowli')|E] w swojej [Concept('domain', 'domenie')|E], zapewnij im dostęp do wymaganych [Concept('trade_goods', 'towarów handlowych')|E].\n\nDowiedz się, jak to zrobić!"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "Najpierw musimy przyjrzeć się twojej [Concept('domain', 'domenie')|E]."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Otwórz kartę „Domena” w panelu „Państwa” (podświetlone)"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "To są wszystkie twoje [holdings|El] w twojej [Concept('domain', 'domenie')|E].\n\n[county|E], w którym mieści się każda z posiadłości, jest częścią [Concept('market', 'rynku')|E]. Wszystkie [goods|El] produkowane i zużywane przez [buildings|El] są wymieniane na tych rynkach."
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "Rzućmy teraz okiem na jedną z twoich [holdings|El]."
 reactive_advice_building_needs_step_open_county_view_prompt: "Kliknij jedną ze swoich posiadłości (podświetlone)"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "To są [districts|El] twojej [Concept('holding', 'posiadłości')|E]. W każdej dzielnicy znajdują się [buildings|El], które produkują i zużywają [goods|El]."
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "Dla przykładu sprawdźmy [needs|El] [Concept('holding_district', 'dzielnicy twojej posiadłości')|E]."
 reactive_advice_building_needs_step_open_district_view_prompt: "Kliknij dzielnicę posiadłości (podświetlone)#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "Tutaj możesz zobaczyć efekty każdej z [Concept('building', 'budowli')|E] w [Concept('district', 'dzielnicy')|E].\n\nNiektóre z tych efektów zużywają [trade_goods|El] z [Concept('market', 'rynku')|E] [Concept('county', 'hrabstwa')|E], kiedy są aktywne.\n\n[holding_district|E], na przykład, zapewnia [Concept('holding', 'posiadłości')|E] [food_supply|El], jeśli może zużyć następujące towary: [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l] i [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon|l].\n\nNiezaspokojenie [Concept('need', 'zapotrzebowania')|E] nie przynosi żadnych złych skutków, a wszystkie budowle zapewniają pewne bonusy nawet wtedy, gdy nie mają dostępu do towarów handlowych, których potrzebują."
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "Często nie jest wymagany żaden konkretny [trade_good|El], a zamiast niego wystarczy zapewnić kombinację towarów z określonej [Concept('trade_category_short', 'kategorii')|E]. [building|E] może na przykład potrzebować następującego towaru: [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l], co oznacza, że do zaspokojenia zapotrzebowania nadadzą się [GetTradeGoodType('trade_good_grain').GetNameWithIcon|l], [GetTradeGoodType('trade_good_millet').GetNameWithIcon|l] lub [GetTradeGoodType('trade_good_rice').GetNameWithIcon|l].\n\nDodatkowo czasami [needs|El] można zaspokoić kilkukrotnie – za każdym razem, kiedy zbierze się wystarczająca ilość towarów, efekt zostanie nałożony ponownie."
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "Wiesz już, że [buildings|El] wymagają [Concept('trade_goods', 'towarów handlowych')|E]. Skąd jednak wziąć te towary?\n\nKażdy towar handlowy zużywany w [Concept('county', 'hrabstwie')|E] pochodzi z [Concept('market', 'rynku')|E] tego hrabstwa."
 reactive_advice_building_needs_step_open_market_view_prompt: "Otwórz rynek hrabstwa (podświetlone)#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "To jest [market|El] [Concept('county', 'hrabstwa')|E]. Zazwyczaj rynek obejmuje te same [counties|El], które obejmuje [duchy|El]."
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "Możesz tu zobaczyć każdy z [Concept('trade_good', 'towarów handlowych')|E] i dowiedzieć się, czy jest on dostępny z [Concept('surplus', 'nadwyżką')|E], czy też jego dostępność nie spełnia [Concept('need', 'zapotrzebowania')|E].\n\nW przypadku niespełniania zapotrzebowania (#N bilansu ujemnego#!) [needs|El] nie wszystkich [Concept('buildings', 'budowli')|E] na [Concept('market', 'rynku')|E] zostanie zaspokojone.\n\nW przypadku nadwyżki (#P bilansu dodatniego#!) zapotrzebowanie na dany towar wszystkich [Concept('buildings', 'budowli')|E] na rynku jest zaspokojone. Towar dostępny z nadwyżką można eksportować za pośrednictwem [Concept('trade_routes', 'szlaków handlowych')|E].\n\n#I Możesz kliknąć towar handlowy, aby zobaczyć jego status na rynku i na mapie.#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "Jeśli [need|El] jest niezaspokojone, możesz spróbować zmienić ten stan rzeczy na różne sposoby:\n\n$BULLET_WITH_TAB$Wznosząc na [Concept('market', 'rynku')|E] [buildings|El], w których dany [trade_good|El] jest produkowany.\n$BULLET_WITH_TAB$Uruchamiając [distribution_route|El] pomiędzy dwoma rynkami w twoim [Concept('realm', 'państwie')|E].\n$BULLET_WITH_TAB$Zlecając jednemu z twoich [Concept('client_merchants', 'kupców klienckich')|E] import towarów handlowych.\n\nSpełnienie wszystkich potrzeb jednakże może być czasami trudne. Niektóre z potrzeb warto wtedy zostawić niezaspokojone."
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Dodaj do kolejki przedsięwzięcia budowlane"
 action_reactive_advice_construction_queue: "Porada: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "Masz zaplanowane budowy w kolejce. Otwórz tę lekcję, aby dowiedzieć się, jak zarządzać swoimi budowami."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "Masz zaplanowaną budowę w kolejce!\n\nJeśli nie stać cię na [Concept('building', 'budowlę')|E] w danym momencie, zawsze możesz dodać ją do kolejki i wznieść, gdy tylko będzie to możliwe.\n\nRzućmy okiem na twoją kolejkę."
 reactive_advice_construction_queue_intro_prompt: "Otwórz panel „$BUILD_QUEUE_WINDOW_TITLE$” (podświetlone)"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "To są wszystkie budowy – z każdej z twoich [holdings|El] – dodane przez ciebie do kolejki do tej pory.\n\nGdy będziesz w stanie pokryć ich koszt i spełnisz wszystkie inne wymagania, opłata zostanie automatycznie pobrana, a budowa – rozpoczęta.\n\nBudowy rozpoczynane są zgodnie z porządkiem kolejki. Kolejność możesz zmienić, przeciągając i upuszczając budowle tutaj."
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "Jeśli chcesz zarezerwować [gold|El] lub inny zasób, możesz to zrobić tutaj.\n\nOdłożona ilość nie zostanie wykorzystana do rozpoczęcia budów w kolejce, będziesz więc dysponować środkami na potrzeby nagłych wydatków."
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "To już wszystko, co musisz wiedzieć o budowach w kolejce. Udanego budowania!"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Szlaki handlowe"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "Podczas gdy inni ciężko pracują w polach lub nakładają podatki na biednych, ty czerpiesz zyski z przepływu [Concept('goods', 'towarów')|E].\n\n[trade_routes|E] to główny sposób, w jaki [merchants|El] i [republics|El] zarabiają [gold|El]."
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "Najpierw musisz zdecydować, którym [Concept('trade_good', 'towarem')|E] chcesz handlować.\n\nTe towary są rekomendowane dla ciebie, ale możesz także przejrzeć wszystkie towary handlowe, jeśli szukasz czegoś konkretnego."
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "Na mapie możesz zobaczyć wszystkie [markets|El], które handlują wybranym przez ciebie [Concept('trade_good', 'towarem')|E].\n\nAby rozpocząć handel, należy połączyć rynek, w którym występuje [surplus|El] towarów (#trade_surplus zaznaczony na turkusowo#!), z miejscem, które ma na ten towar [need|El] (#trade_need zaznaczonym na złoto#!).\n\nJeśli rynek przepełniony jest innymi [Concept('merchants', 'kupcami')|E], możesz handlować jedynie częścią towarów, ograniczoną przez twoją [competitiveness|El].\n\nKupując po niskiej, a sprzedając po wysokiej cenie, możesz wypracować większy zysk.\n\n#I Kliknij na rynki, aby dodać lub usunąć je ze szlaku.#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "Kiedy dodasz [markets|El] do swojego [Concept('route', 'szlaku')|E], wybrany [good|El] będzie transportowany tym szlakiem i wyświetlony tutaj.\n\nPierwszy od lewej towar to [primary_good|El] – handlując nim, zdobywasz [trade_expertise|El]. Wraz z upływem czasu zapewni ci to bonusy zależne od [Concept('trade_category', 'kategorii towaru')|E].\n\n#I Jeśli transportujesz więcej niż jeden towar, możesz przeciągnąć kolejny na pierwszą pozycję i uczynić z niego towar podstawowy.#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "Możesz transportować ograniczoną liczbę [Concept('goods', 'towarów')|E] przy ograniczonej całkowitej [Concept('capacity', 'przepustowości')|E].\n\nWszystkie limity tego typu można zwiększyć dzięki wznoszeniu [Concept('company_buildings_short', 'budowli')|E] w twojej [Concept('company', 'kompanii')|E]."
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "W podobny sposób szlaki są ograniczone przez [trade_route_length|El], co powoduje, że możesz zatrzymać się na ograniczonej liczbie [Concept('markets', 'rynków')|E]."
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "Na koniec możesz mianować jednego ze swoich [Concept('associates', 'partnerów')|E] twoim [Concept('trader', 'handlarzem')|E]. W zależności od zadania, które mu przydzielisz, poprawi on różne aspekty twojego [Concept('route', 'szlaku')|E]."
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "Wraz z rozwojem twojej [Concept('company', 'kompanii')|E] uzyskasz dostęp do większej liczby [Concept('routes', 'szlaków')|E], poprawisz ich zasięg i zwiększysz ilość towarów, którymi możesz handlować.\n\nDzięki temu będziesz zarabiać coraz więcej i więcej [Concept('gold', 'złota')|E]!"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Bycie kupcem"
 action_reactive_advice_merchant_introduction: "Porada: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "Jesteś [Concept('merchant', 'kupcem')|E]! Otwórz, aby nauczyć się podstaw biznesu."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "Jesteś [Concept('merchant', 'kupcem')|E]!\n\nChoć [trade|El] to fundament twojej [Concept('company', 'kompanii')|E], biznes to coś więcej niż zarabianie pieniędzy."
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "Rozpocznijmy od sprawdzenia, w jaki sposób twoja [company|El] może rozwijać się w dłuższej perspektywie."
 reactive_advice_merchant_introduction_open_overview_prompt: "Otwórz kartę „Przegląd” w panelu „Państwo” (podświetlone)"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "To jest [Concept('company_size', 'wielkość')|E] twojej kompanii – główny wyznacznik jej skuteczności.\n\nRozwój twojej kompanii spowoduje, że [rulers|El] wyższej [Concept('rank', 'rangi')|E], tacy jak [kings|El] i [emperors|El], zaczną zwracać na ciebie uwagę."
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "To jest [domicile|El] twojej [Concept('company', 'kompanii')|E] – twoja główna baza operacyjna.\n\nTutaj możesz wydawać [gold|El] i [prestige|El], aby wznosić [domicile_buildings|El], które jeszcze bardziej usprawnią twoją kompanię."
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "To jest [Concept('company_purpose', 'cel')|E] twojej kompanii, który określa to, na czym będzie się ona skupiać.\n\nDomyślnym celem jest handel, ale możesz go zmienić, by skupić się na [Concept('artifacts', 'artefaktach')|E], towarach luksusowych lub udzielaniu pożyczek."
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "Jednak nawet będąc [Concept('merchant', 'kupcem')|E], podlegasz rządom miejscowych panów."
 reactive_advice_merchant_introduction_open_patronage_prompt: "Otwórz kartę „$MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$” (podświetloną)"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "To jest twój [merchant_patron|El] – [ruler|El] [Concept('holding', 'posiadłości')|E], w której zlokalizowana jest twoja [domicile|El].\n\nChociaż musisz płacić podatki swojemu patronowi, możesz również zyskać na tej relacji.\n\nMożesz, na przykład, zmienić swój [client_contract|El], aby poprosić swojego patrona o wsparcie w twoich wysiłkach handlowych lub łatwiej proponować [marriages|El] członkom szlachty."
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "Zazwyczaj nie będziesz jedynym [Concept('client', 'klientem')|E]–[Concept('merchant', 'kupcem')|E] swojego [Concept('merchant_patron', 'patrona')|E].\n\nInni klienci również będą handlować w tym samym miejscu, co ty, a tylko jeden klient może posiadać specjalną [Concept('charter', 'koncesję')|E]. Posiadanie koncesji wzmocni twój handel, odblokowując specjalne [decisions|El]."
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "Nadszedł czas, by porozmawiać o złotym „słoniu w pokoju” – zarabianiu pieniędzy."
 reactive_advice_merchant_introduction_open_trade_prompt: "Otwórz kartę „Szlaki handlowe” w panelu „Handel” (podświetlone)"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "To są twoje [trade_routes|El] – główny sposób, w który będziesz zarabiać [gold|El].\n\nWraz z rozwojem twojej kompanii będziesz mieć dostęp do większej liczby szlaków o większym zasięgu i możliwość transportowania większej ilości [Concept('goods', 'towarów')|E]. To z kolei przełoży się na więcej zarabianego złota."
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "Taki jest kodeks [Concept('merchant', 'kupca')|E]: zarabiać [gold|El] dzięki [Concept('trade_routes', 'szlakom handlowym')|E] i wydawać je, aby zwiększać swój [prestige|El] i [company_size|El].\n\nInteresy prowadzone przez odpowiedzialnych i zorganizowanych kupców z czasem przerosną nawet te, których właścicielami są zamożni [rulers|El]!"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "Wartości kompanii"
 action_reactive_advice_company_direction: "Porada: $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "Z czasem [Concept('company_direction', 'wartości')|E] twojej kompanii mogą ulec zmianie. Otwórz, aby dowiedzieć się więcej na ten temat."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "Nie wszyscy [merchants|El] mają takie same cele. Choć [gold|El] samo w sobie daje władzę, dla niektórych ród i szlachectwo są ważniejsze."
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "[Concept('company_direction', 'Wartości')|E] twojej kompanii są częścią wartości twojego [Concept('house', 'rodu')|E]. Przyjrzyjmy się im."
 reactive_advice_company_direction_open_house_prompt: "Wybierz swój ród (podświetlony)"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "Przejdź do karty „[sentiment|E]”."
 reactive_advice_company_direction_open_direction_tab_prompt: "Otwórz kartę „Wartości” (podświetloną)"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "To są [Concept('company_direction', 'wartości')|E] twojej kompanii. Początkowo jest to [company_sentiment_independent|El], później mogą zmierzać w kierunku [Concept('company_sentiment_divided', 'zachłanności')|E] lub [Concept('company_sentiment_concerted', 'szlachetności')|E].\n\nZwiązek małżeński z członkami [Concept('houses', 'rodów')|E] [Concept('noble', 'szlacheckich')|E] sprawi, że wartości będą zmierzały ku szlachetności, podczas gdy małżeństwo z innymi [Concept('merchants', 'kupcami')|E] skieruje je w stronę zachłanności."
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Sfinansowanie budowy"
 action_reactive_advice_sponsor_construction: "Porada: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "Możesz sfinansować wniesienie [Concept('buildings', 'budowli')|E] w [Concept('holdings', 'posiadłościach')|E] innych [characters_possessive|E]. Otwórz, aby nauczyć się, jak to zrobić."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "Możesz teraz finansować ulepszenia [Concept('buildings', 'budowli')|E] w [Concept('holdings', 'posiadłościach')|E] innych [characters_possessive|E]."
 reactive_advice_sponsor_construction_select_holding_prompt: "Wybierz dowolną posiadłość na mapie."
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "Teraz wybierz jedną z jej [Concept('districts', 'dzielnic')|E]."
 reactive_advice_sponsor_construction_open_district_prompt: "Wybierz dzielnicę (podświetloną)"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "W tym miejscu możesz sfinansować budowę! Zauważ, że możesz #EMP ulepszać#! tylko [buildings|El] i tylko w standardowych [Concept('districts', 'dzielnicach')|E].\n\nGłównym powodem do finansowania ulepszeń jest zwiększenie [Concept('surplus', 'nadwyżki')|E] danego [Concept('trade_good', 'towaru handlowego')|E] lub [Concept('need', 'zapotrzebowania')|E] na niego na [Concept('market', 'rynku')|E] [holding_possessive|El]. Dzięki temu możesz połączyć rynek z jednym z twoich [Concept('profit_routes', 'szlaków komercyjnych')|E] i zwiększyć ilość zarabianego [Concept('gold', 'złota')|E]."
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Polityka republikańska"
 action_reactive_advice_republican_politics: "Porada: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "Jesteś częścią [Concept('republic', 'republiki')|E]. Otwórz, aby poznać jej polityczne zawiłości."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "Jako [house_head|El] jesteś częścią cnotliwej [Concept('republic', 'republiki')|E]!\n\nJako przywódca [Concept('patrician_family', 'rodziny patrycjuszowskiej')|E] sprawujesz rządy razem z innymi rodzinami patrycjuszowskimi w sposób przypominający demokrację. Nawet jeśli nie jesteś obecnie [Concept('ruler', 'władcą')|E] republiki, możesz wziąć udział w zarządzaniu, jeśli posiadasz [gold|El] i wpływy."
 reactive_advice_republican_politics_intro_prompt: "Otwórz kartę „Przegląd” w panelu „Republika” (podświetlone)"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "Tak jak ich obywatele, nie wszystkie [republics|El] są sobie równe. Każda republika ma swój [title_tier|El] i [Concept('republic_administration', 'administrację republikańską')|E], które widać tutaj.\n\nWydając [prestige|El] i zawartość [Concept('treasury', 'skarbca')|E], [ruler|El] może zwiększyć poziom republiki – a przez to jego władzę.\n\nObecny władca może także zmienić administrację republikańską określającą ogólny kierunek, w którym zmierza republika."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "Jeśli chodzi o [Concept('ruler', 'władcę')|E] – oto on!\n\nW przeciwieństwie do tyranii w innych [Concept('governments', 'rządach')|E] władca [Concept('republic', 'republiki')|E] jest wybierany na trwającą pewien okres kadencję.\n\nTen sam władca może jednakże zostać wybrany ponownie, więc nierzadko zdarza się, że jest on także głównym kandydatem."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "Władza, którą posiada [ruler|El], jest ograniczana przez [assembly|El]. Przyjrzyjmy mu się."
 reactive_advice_republican_politics_open_assembly_prompt: "Otwórz kartę „Zgromadzenie” (podświetloną)"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "[ruler|E] nie posiada władzy absolutnej – każda zmiana w [Concept('law', 'prawie')|E] czy zmiany [Concept('republic_decree_short', 'dekretu')|E] muszą być zatwierdzone przez [assembly|El]. Członkowie zgromadzenia mogą nawet zaproponować własne zmiany w prawie.\n\nW skład zgromadzenia wchodzą zazwyczaj [patrician_families|El] danej [Concept('republic', 'republiki')|E]. Choć nie wyznają one żadnej ideologii – we współczesnym tego słowa znaczeniu – mają [Concept('house_ambition', 'ambicję rodu')|E], która wpływa na oddawane przez nie głosy.\n\nPamiętaj, że republika nie musi poddawać się różnorodności i chaosowi charakterystycznym dla demokracji. Wraz z uchwalaniem różnych praw równowaga sił między zgromadzeniem i władcą może ulec zmianie."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "Jako że [assembly|El] często składa się z [Concept('patrician_families', 'rodzin patrycjuszowskich')|E], zajmijmy się teraz nimi."
 reactive_advice_republican_politics_open_families_prompt: "Otwórz kartę „Rodziny” (podświetloną)"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "To są [patrician_families|El] [Concept('republic', 'republiki')|E].\n\nKażda rodzina – włączając w to twoją – posiada [patrician_rating|El]. Wraz ze zwiększaniem dochodu z [Concept('trade', 'handlu')|E] czy uzyskiwaniem miejsc w [Concept('assembly', 'zgromadzeniu')|E] lub [Concept('council', 'radzie')|E] [Concept('ruler', 'władcy')|E] twój wskaźnik arystokratyczny poprawi się.\n\nWysoki wskaźnik arystokratyczny zwiększa efekty twojej [Concept('house_ambition', 'ambicji rodu')|E], a nawet może pozwolić ci obalić rząd!"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "Los [Concept('republic', 'republiki')|E] spoczywa w twoich rękach.\n\nTo od ciebie zależy, jak ją ukształtujesz. Zachowasz całą władzę w rękach swego rodu czy podzielisz się nią z innymi?\n\nTak jak [patrician_rating|El] rośnie dzięki twoim [Concept('trade_routes', 'szlakom handlowym')|E], tak samo zwiększają się twoje władza i wpływy."
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "Tutaj możesz tworzyć własne [distribution_routes|El].\n\nSzlaki dystrybucyjne pozwalają ci przewozić [trade_goods|El], aby zaspokoić [needs|El] na [Concept('markets', 'rynkach')|E] we własnym [Concept('realm', 'państwie')|E]."
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "[distribution_route|E] pozwala przewozić dowolną ilość [Concept('trade_goods', 'towarów handlowych')|E], ale tylko takich, które zaliczają się do kategorii [Concept('basic_trade_goods', 'podstawowych towarów handlowych')|E], które tutaj pokazano.\n\nW związku z tym nie musisz wybierać, które towary handlowe mają być przewiezione.\n\n#I Możesz wybrać dowolny podstawowy towar, aby zobaczyć jego [market_balance|El] na mapie#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "Na mapie, pod nazwą każdego [Concept('market', 'rynku')|E], możesz zobaczyć, których [Concept('basic_trade_goods', 'podstawowych towarów handlowych')|E] występuje [surplus|El]. To oznacza, że możesz wywieźć towary z tego miejsca."
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "Podobnie widać tu też każde niezaspokojone [needs|El]. Oznacza to, że możesz przewieźć [basic_trade_goods|El] na ten [market|El]."
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "[distribution_route|E] może połączyć tylko dwa [markets|El], a [goods|El] mogą być przewożone w obu kierunkach.\n\nGdy dodasz dwa rynki do szlaku, w podświetlonym oknie będzie można zobaczyć, jak zaspokajane jest [needs|El].\n\nJako że szlak przechodzi przez twoje własne [realm|El], nie musisz płacić [Concept('buy_price', 'ceny zakupu')|E] ani żadnych [Concept('tolls', 'opłat')|E].\n\n#I Aby dodać rynek do szlaku lub go z niego usunąć, kliknij go na mapie#!"
