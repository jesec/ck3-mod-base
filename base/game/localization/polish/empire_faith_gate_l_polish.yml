l_polish:
 rule_empire_faith_gate: "Tytuły imperium ograniczone przez wiarę zorganizowaną"
 setting_empire_faith_gate_on: "#high Włączone#!"
 setting_empire_faith_gate_no_hof_exempt: "#high Włączone#!; nie dotyczy wiar bez głowy wiary"
 setting_empire_faith_gate_off: "Wyłączone"
 setting_empire_faith_gate_on_desc: "Aby utworzyć [titles|El] [empire|El], wymagane są [Concept('organized', 'zorganizowana')|E] [faith|El] i zgoda [Concept('head_of_faith', 'głowy wiary')|E]. Wpływa to na [Concept('rulers', 'władców')|E] [Concept('feudal', 'feudalnych')|E], [Concept('clan', 'klanowych')|E] i [Concept('tribal', 'plemiennych')|E]."
 setting_empire_faith_gate_no_hof_exempt_desc: "Aby utworzyć [titles|El] [empire|El], wymagane są [Concept('organized', 'zorganizowana')|E] [faith|El] i zgoda [Concept('head_of_faith', 'głowy wiary')|E]. [faiths|El] bez [Concept('head_of_faith', 'głowy wiary')|E] są zwolnione z wymogu zgody. Wpływa to na [Concept('rulers', 'władców')|E] [Concept('feudal', 'feudalnych')|E], [Concept('clan', 'klanowych')|E] i [Concept('tribal', 'plemiennych')|E]."
 setting_empire_faith_gate_off_desc: "Każdy może utworzyć [titles|El] [empire|El], jeśli spełnione są standardowe warunki."
 empire_faith_gate_organized_faith_required: "Aby stworzyć [empire|El], twoja [faith|El] musi być [Concept('organized', 'zorganizowana')|E]"
 empire_faith_gate_hof_spiritual_good_terms: "Wymagane są dobre stosunki z [Concept('head_of_faith', 'głową wiary')|E]"
 empire_faith_gate_hof_temporal_is_hof: "Jesteś [Concept('head_of_faith', 'głową wiary')|E]"
 empire_faith_gate_hof_temporal_good_terms: "[head_of_faith|E] musi mieć pozytywną [Concept('opinion', 'opinię')|E] o tobie"
 empire_faith_gate_powerful_vassals_approve: "Większość [Concept('powerful_vassals', 'wasali wpływowych')|E] musi mieć pozytywną [Concept('opinion', 'opinię')|E] o tobie #weak ([THIS.Char.MakeScope.ScriptValue('powerful_vassals_positive_opinion_value')|0]/[THIS.Char.MakeScope.ScriptValue('powerful_vassals_count_value')|0])#!"
 empire_faith_gate_contested_legitimacy_applied: "Sporne imperium"
 empire_faith_gate_contested_legitimacy_applied_desc: "[THIS.Char.GetShortUINameNotMe] i [SCOPE.sC('efg_other_emperor').GetShortUINameNotMe] walczą obecnie o wyższość swoich [Concept('empires', 'imperiów')|E]."
 empire_faith_gate_create_title_contested_warning_1: "@warning_icon! #warning Utworzenie tego [empire|El] zapewni ci [modifier|El] „[GetModifier( 'multi_empire_same_faith_penalty_1' ).GetNameWithTooltip|L]” w ciągu 3 lat, ponieważ istnieje już inne niezależne [empire|El] wyznające twoją [Concept('faith', 'wiarę')|E].#!"
 empire_faith_gate_create_title_contested_warning_2: "@warning_icon! #warning Utworzenie tego [empire|El] zapewni ci [modifier|El] „[GetModifier( 'multi_empire_same_faith_penalty_2' ).GetNameWithTooltip|L]” w ciągu 3 lat, ponieważ istnieje już wiele niezależnych [Concept('empires', 'imperiów')|E] wyznających twoją [Concept('faith', 'wiarę')|E].#!"
 empire_faith_gate_create_title_contested_warning_3: "@warning_icon! #warning Utworzenie tego [empire|El] zapewni ci [modifier|El] „[GetModifier( 'multi_empire_same_faith_penalty_3' ).GetNameWithTooltip|L]” w ciągu 3 lat, ponieważ istnieje już kilka niezależnych [Concept('empires', 'imperiów')|E] wyznających twoją [Concept('faith', 'wiarę')|E].#!"
 empire_faith_gate_create_title_contested_warning_1_inline: "\n\n$empire_faith_gate_create_title_contested_warning_1$"
 empire_faith_gate_create_title_contested_warning_2_inline: "\n\n$empire_faith_gate_create_title_contested_warning_2$"
 empire_faith_gate_create_title_contested_warning_3_inline: "\n\n$empire_faith_gate_create_title_contested_warning_3$"
 EXCOMMUNICATION_CONTESTED_EMPIRE: "Istnieje wiele [Concept('empires', 'imperiów')|E] wyznających naszą [Concept('faith', 'wiarę')|E]: $VALUE|=+0$"
 efg_contested_empire_rivalry: "Nowe [empire|El] wyznające tę samą [Concept('faith', 'wiarę')|E] zapoczątkowało rywalizację."
 efg_contested_empire_rivalry_corresponding: "Nowe [empire|El] wyznające tę samą [Concept('faith', 'wiarę')|E] zapoczątkowało rywalizację."
 dissolve_empire_war: "Rozwiąż imperium"
 DISSOLVE_EMPIRE_WAR_NAME: "Rozwiąż imperium osoby znanej jako [DEFENDER.GetShortUINameNotMe]"
 dissolve_empire_war_desc: "Wypowiedz wojnę [Concept('excommunicated', 'ekskomunikowanemu')|E] [Concept('ruler', 'władcy')|E] wyznającemu naszą [Concept('faith', 'wiarę')|E] w celu rozwiązania [empire|El]."
 dissolve_empire_war_victory_desc: "[Concept('excommunicated', 'Ekskomunikowany')|E] [emperor|El] zostaje pozbawiony [Concept('title', 'tytułu')|E] [empire|El], który zostaje zniszczony."
 dissolve_empire_war_victory_desc_defender: "[empire|E] zostało rozwiązane. Zniszczono [title|El] [empire|El]."
 dissolve_empire_war_white_peace_desc: "Wojna kończy się bez rozstrzygnięcia. Żadna ze stron nie uzyskuje przewagi."
 dissolve_empire_war_white_peace_desc_defender: "Wojna o rozwiązanie [empire|El] kończy się bez rozstrzygnięcia."
 dissolve_empire_war_defeat_desc: "Próba rozwiązania [empire|El] nie powiodła się."
 dissolve_empire_war_defeat_desc_attacker: "Nasza próba rozwiązania [empire|El] nie powiodła się. Poniesiemy konsekwencje."
 dissolve_empire_war_defeat_desc_defender: "Próba rozwiązania [empire|El] została odparta."
 dissolve_empire_war_invalidated_no_excommunication: "Obrońca nie jest już [Concept('excommunicated', 'ekskomunikowany')|E]."
 dissolve_empire_war_invalidated_no_empire: "Obrońca nie posiada już [Concept('title', 'tytułu')|E] [empire|El]."
 game_concept_dissolve_empire_casus_belli: "$dissolve_empire_war$"
 game_concept_dissolve_empire_casus_belli_desc: "[casus_belli|E] pozwalający [Concept('ruler', 'władcy')|E] wyznającemu tę samą [Concept('faith', 'wiarę')|E] wypowiedzieć [Concept('war', 'wojnę')|E] [Concept('excommunicated', 'ekskomunikowanemu')|E] [Concept('emperor', 'cesarzowi')|E] i zniszczyć dany [title|El] [empire|El] po zwycięstwie."
 multi_empire_same_faith_penalty_1: "Sporna wyższość"
 multi_empire_same_faith_penalty_1_desc: "Inny [emperor|El] wyznający tę samą [Concept('faith', 'wiarę')|E] podważa wyższość naszego [empire|El]"
 multi_empire_same_faith_penalty_2: "Zakwestionowana wyższość"
 multi_empire_same_faith_penalty_2_desc: "Wielu [Concept('emperors', 'cesarzy')|E] wyznających tę samą [Concept('faith', 'wiarę')|E] kwestionuje wyższość naszego [empire|El]"
 multi_empire_same_faith_penalty_3: "Podzielona wyższość"
 multi_empire_same_faith_penalty_3_desc: "Kilku [Concept('emperors', 'cesarzy')|E] wyznających tę samą [Concept('faith', 'wiarę')|E] osłabia wyższość naszego [empire|El]"
 action_efg_request_excommunication: "@hof_icon! Istnieje zbyt wiele imperiów wyznających twoją wiarę"
 action_efg_request_excommunication_label: "@hof_icon! Istnieje zbyt wiele imperiów wyznających twoją wiarę"
 action_efg_request_excommunication_desc: "[recipient.GetShortUINameNotMe], twój rywal, rządzi [empire|El] wyznającym twoją [Concept('faith', 'wiarę')|E], kwestionując twoje roszczenie do bycia jedynym prawdziwym [Concept('emperor', 'cesarzem')|E].\n\n#help Poproś twoją [Concept('head_of_faith', 'głowę wiary')|E], którą jest [secondary_recipient.GetShortUINameNotMe], o ekskomunikowanie twojego rywala. [Concept('excommunicated', 'Ekskomunikowanego')|E] cesarza można zaatakować przy użyciu [casus_belli|El] „[dissolve_empire_casus_belli|E]”, co umożliwi zniszczenie jego [empire|El].#!"
 action_efg_request_excommunication_click: "#I Kliknij, aby otworzyć interakcję „$request_excommunication_interaction$”#!"
 action_efg_request_excommunication_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNotMeNoTooltip]"
 action_efg_request_excommunication_combined_group_name: "@hof_icon! Istnieje zbyt wiele imperiów wyznających twoją wiarę"
 action_efg_request_excommunication_combined_group_label: "@hof_icon! Istnieje zbyt wiele imperiów wyznających twoją wiarę"
 action_efg_request_excommunication_combined_group_description: "Kilku rywalizujących z tobą [Concept('emperors', 'cesarzy')|E] wyznających twoją [Concept('faith', 'wiarę')|E] kwestionuje twoje roszczenie do bycia jedynym prawdziwym [Concept('emperor', 'cesarzem')|E].\n\n#help Poproś twoją [Concept('head_of_faith', 'głowę wiary')|E], którą jest [secondary_recipient.GetShortUINameNotMe], aby ich ekskomunikowała. [Concept('excommunicated', 'Ekskomunikowanego')|E] cesarza można zaatakować przy użyciu casus belli „[dissolve_empire_casus_belli|E]”, co umożliwi zniszczenie jego [empire|El].#!"
 empire_faith_gate_panel_organized_faith: "Jesteś częścią [Concept('faith', 'wiary')|E] [Concept('organized', 'zorganizowanej')|E]"
 empire_faith_gate_panel_hof_approval: "Masz aprobatę [Concept('head_of_faith', 'głowy wiary')|E]"
 empire_faith_gate_panel_vassals_approve: "Masz wsparcie większości swoich [Concept('powerful_vassals', 'wasali wpływowych')|E]"
 empire_faith_gate_reformation_piety_level: "[piety_level|El] musi być co najmniej następujący: [GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]"
 empire_faith_gate_reformation_tribal_authority: "Konieczny jest absolutny autorytet władzy plemiennej"
 empire_faith_gate_reformation_holy_site: "Co najmniej trzy [holy_sites|El] są w posiadaniu postaci wyznających tę [Concept('faith', 'wiarę')|E]"
 empire_faith_gate.0002.t: "Prawdziwy cesarz"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUINameNotMe] wysuwa roszczenie do godności cesarskiej, której nikt poza mną nie powinien otrzymać. Jeśli na to pozwolę, wierni wkrótce zwątpią w moją [Concept('legitimacy', 'legitymację')|E]."
 empire_faith_gate.0002.a: "Niech wszyscy wiedzą, że [efg_primary_rival.Custom('PL_jego_jej')] imperium nie przetrwa tak długo jak moje."
 empire_faith_gate.0002.b: "Nasza wiara ma tylko jednego prawdziwego cesarza – mnie."
 empire_faith_gate.0002.c: "Uderzę we właściwym czasie."
 efg_contested_wrath: "Rycerska propaganda"
 efg_contested_wrath_desc: "Wykorzystanie naszych rycerzy, by głosili legitymację naszego imperium przeciw cesarzowi, z którym rywalizujemy, motywuje naszych wojowników i zapewnia nam szacunek ludu."
 efg_divine_mandate: "Boskie roszczenia"
 efg_divine_mandate_desc: "Uznając boski autorytet za największy wśród ziemskich rywali, jednoczymy wokół siebie wiernych."
 efg_contested_patience: "Konsekwentne umacnianie"
 efg_contested_patience_desc: "Skupiając uwagę na sprawach wewnętrznych, umacniamy nasze państwo, czekając na właściwy moment do uderzenia."
