l_polish:
 county_corruption_inefficient_tax_collection_modifier: "Niekompetentny pobór podatku"
 county_corruption_inefficient_tax_collection_modifier_desc: "[county_corruption|E]\nW tym hrabstwie nie udaje się zebrać niezbędnej ilości podatków"
 county_corruption_inefficient_tax_collection_modifier_2: "Systemowe oszustwo podatkowe"
 county_corruption_inefficient_tax_collection_modifier_2_desc: "[county_corruption|E]\nW tym hrabstwie powszechne stały się oszustwa podatkowe"
 county_corruption_inefficient_tax_collection_modifier_3: "Upadek systemu podatkowego"
 county_corruption_inefficient_tax_collection_modifier_3_desc: "[county_corruption|E]\nNie istnieją już sensowne sposoby pobierania podatków w tym hrabstwie"
 county_corruption_deserting_levies_modifier: "Dezercja pospolitego ruszenia"
 county_corruption_deserting_levies_modifier_desc: "[county_corruption|E]\nW tym hrabstwie pospolite ruszenie licznie dezerteruje."
 county_corruption_deserting_levies_modifier_2: "Masowe dezercje"
 county_corruption_deserting_levies_modifier_2_desc: "[county_corruption|E]\nŻołnierze pospolitego ruszenia w tym hrabstwie dezerterują na zatrważającą skalę"
 county_corruption_deserting_levies_modifier_3: "Upadek systemu poborowego"
 county_corruption_deserting_levies_modifier_3_desc: "[county_corruption|E]\nSystem poborowy w tym hrabstwie uległ całkowitemu rozpadowi"
 county_corruption_smuggling_ring_modifier: "Szajka przemytników"
 county_corruption_smuggling_ring_modifier_desc: "[county_corruption|E]\nPrzemytnicy szaleją w całym hrabstwie"
 county_corruption_smuggling_ring_modifier_2: "Kwitnący przemyt"
 county_corruption_smuggling_ring_modifier_2_desc: "[county_corruption|E]\nPrzemytnicy stworzyli rozległą siatką przestępczą w tym hrabstwie"
 county_corruption_smuggling_ring_modifier_3: "Przemyt bez ograniczeń"
 county_corruption_smuggling_ring_modifier_3_desc: "[county_corruption|E]\nPrawie nic wartościowego nie podlega kontroli urzędników podatkowych w tym hrabstwie"
 county_corruption_bandits_rampant_modifier: "Pączkujący bandytyzm"
 county_corruption_bandits_rampant_modifier_desc: "[Concept( 'county_corruption', 'Korupcja w hrabstwie' )|E]\nBandyci bez przeszkód przemieszczają się po hrabstwie"
 county_corruption_bandits_rampant_modifier_2: "Szajki bandytów"
 county_corruption_bandits_rampant_modifier_2_desc: "[county_corruption|E]\nWpływowe szajki bandytów zajmują terytoria w tym hrabstwie"
 county_corruption_bandits_rampant_modifier_3: "Niekontrolowany bandytyzm"
 county_corruption_bandits_rampant_modifier_3_desc: "[county_corruption|E]\nW tym hrabstwie bandyci nie mają już skrupułów – traktują je jak własne królestwo"
 county_corruption_inefficient_census_modifier: "Nieudolny spis ludności"
 county_corruption_inefficient_census_modifier_desc: "Władcy tego hrabstwa nie mają pojęcia, kto i jak dużo ludzi tutaj mieszka"
 county_corruption_inefficient_census_modifier_2: "Niefunkcjonalny spis ludności"
 county_corruption_inefficient_census_modifier_2_desc: "Większa część populacji i posiadłości umyka pracownikom administracyjnym w tym hrabstwie"
 county_corruption_inefficient_census_modifier_3: "Brak administracji"
 county_corruption_inefficient_census_modifier_3_desc: "Nikt nie wie, kto tu mieszka, co posiada i – co gorsza – jakie ma długi"
 county_corruption_lack_of_sheriffs_modifier: "Niedostatek szeryfów"
 county_corruption_lack_of_sheriffs_modifier_desc: "[county_corruption|E]\nW tym hrabstwie nie ma wystarczającej liczby szeryfów, którzy mogliby sprawować kontrolę nad całym terytorium"
 county_corruption_lack_of_sheriffs_modifier_2: "Kraina bezprawia"
 county_corruption_lack_of_sheriffs_modifier_2_desc: "[county_corruption|E]\nW większości obszarów w tym hrabstwie służby porządkowe uległy rozpadowi"
 county_corruption_lack_of_sheriffs_modifier_3: "Hrabstwo poza kontrolą"
 county_corruption_lack_of_sheriffs_modifier_3_desc: "[county_corruption|E]\nWładza w tym hrabstwie istnieje tylko z nazwy"
 county_corruption_lack_of_courts_modifier: "Nieufność do sądów"
 county_corruption_lack_of_courts_modifier_desc: "[county_corruption|E]\nW tym hrabstwie nie ma wystarczającej liczby sądów, które mogłyby rozstrzygnąć sprawy chłopskie"
 county_corruption_lack_of_courts_modifier_2: "Pogarda wobec prawa"
 county_corruption_lack_of_courts_modifier_2_desc: "[county_corruption|E]\nMieszkańcy tego hrabstwa w dużej mierze zrezygnowali z poszukiwania sprawiedliwości u swoich władców"
 county_corruption_lack_of_courts_modifier_3: "Upadek systemu wymiaru sprawiedliwości"
 county_corruption_lack_of_courts_modifier_3_desc: "[county_corruption|E]\nMieszkańcy tego hrabstwa stracili cały szacunek dla systemu prawnego i jego sądów"
 county_corruption_thieves_guild_modifier: "Pączkujące złodziejstwo"
 county_corruption_thieves_guild_modifier_desc: "[county_corruption|E]\nZłodzieje w tym hrabstwie działają bez ograniczeń"
 county_corruption_thieves_guild_modifier_2: "Szajki złodziei"
 county_corruption_thieves_guild_modifier_2_desc: "[county_corruption|E]\nPrzestępcy zwiększyli zasięg swojej nikczemnej działalności w tym hrabstwie"
 county_corruption_thieves_guild_modifier_3: "Gildia złodziei"
 county_corruption_thieves_guild_modifier_3_desc: "[county_corruption|E]\nGildia złodziei skutecznie kontroluje handel i ruch w tym hrabstwie"
 county_corruption_unsafe_highways_modifier: "Niebezpieczne szosy"
 county_corruption_unsafe_highways_modifier_desc: "[county_corruption|E]\nW tym hrabstwie wędrówka nocą przez las jest bezpieczniejsza niż poruszanie się po szosach"
 county_corruption_unsafe_highways_modifier_2: "Zatrważające drogi"
 county_corruption_unsafe_highways_modifier_2_desc: "[county_corruption|E]\nDrogi w tym hrabstwie wprawiają w grozę wszystkich, którzy muszą je przemierzać"
 county_corruption_unsafe_highways_modifier_3: "Nieprzejezdne drogi"
 county_corruption_unsafe_highways_modifier_3_desc: "[county_corruption|E]\nPoczciwy lud nie jest w stanie poruszać się po drogach w tym hrabstwie"
 county_corruption_uncooperative_guilds_modifier: "Gildie niechętne do współpracy"
 county_corruption_uncooperative_guilds_modifier_desc: "[county_corruption|E]\nLokalne gildie niechętnie współpracują w władcami tego hrabstwa"
 county_corruption_uncooperative_guilds_modifier_2: "Obstrukcyjne działania gildii"
 county_corruption_uncooperative_guilds_modifier_2_desc: "[county_corruption|E]\nGildie aktywnie utrudniają realizację wszystkich oficjalnych inicjatyw w tym hrabstwie"
 county_corruption_uncooperative_guilds_modifier_3: "Zbuntowane gildie"
 county_corruption_uncooperative_guilds_modifier_3_desc: "[county_corruption|E]\nGildie prowadzą otwartą rewoltę przeciwko władcy tego hrabstwa"
 county_corruption_lackluster_administration_modifier: "Niewydolna administracja"
