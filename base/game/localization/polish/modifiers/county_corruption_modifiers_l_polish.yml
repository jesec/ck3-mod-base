 county_corruption_lackluster_administration_modifier_3: "Upadek systemu administracji"
 county_corruption_lackluster_administration_modifier_3_desc: "[county_corruption|E]\nResztki systemu administracyjnego w tym hrabstwie uległy całkowitemu rozpadowi"
 county_corruption_roaming_bandits_modifier: "Wędrujący bandyci"
