 christian_fulfillment_level_3: "Pokuta"
 christian_fulfillment_level_4: "Przebaczenie"
 christian_fulfillment_level_5: "Ukontentowanie"
 christian_fulfillment_level_6: "W łasce"
 default_fulfillment_level_0: "Zagubienie"
 default_fulfillment_level_1: "Poszukiwanie"
 default_fulfillment_level_2: "Gorliwość"
 default_fulfillment_level_3: "Pobożność"
 default_fulfillment_level_4: "Wewnętrzny spokój"
 industrious_junior_members_modifier: "Pracowici nowicjusze"
 foolish_convert_modifier: "Nierozsądny nawrócony"
 foolish_convert_modifier_desc: "Ten głupiec pochopnie podjął decyzję o przejściu na [rite|El] o zupełnie innym systemie wierzeń i bardzo trudno jest mu przystosować się do nowego życia duchowego."
 reckless_convert_modifier: "Lekkomyślny nawrócony"
 reckless_convert_modifier_desc: "Ta osoba pochopnie podjęła decyzję o przejściu na [rite|El] o zupełnie innym systemie wierzeń bez żadnego przygotowania i bardzo trudno jest jej przystosować się do nowego życia duchowego."
 informed_convert_modifier: "Zorientowany nawrócony"
 informed_convert_modifier_desc: "Ta osoba podjęła decyzję o przejściu na [rite|El] o zupełnie innym systemie wierzeń w pełni przygotowana do stojących przed nią wyzwań."
 study_faith_learning_mannerism: "Nauka zwyczajów"
 study_faith_learning_mannerism_desc: "Choć jest to mniej efektywne, poznanie zwyczajów i zewnętrznych rytuałów związanych z [Concept('rite', 'obrządkiem')|E] może przynieść wymierne korzyści w dłuższej perspektywie."
 study_faith_newfound_coherence: "Nowo odkryta spójność"
 study_faith_newfound_coherence_desc: "Niespójności odkryte dotychczas podczas nauki tego [Concept('rite', 'obrządku')|E] okazały się atutem, a nie przeszkodą. Porównując ze sobą różnice między dwoma systemami wierzeń, można lepiej zrozumieć prawdziwe znaczenie [Concept('core_tenets', 'dogmatów')|E] i [Concept('doctrines', 'doktryn')|E]."
 study_faith_cautious_studies: "Roztropna nauka"
 study_faith_cautious_studies_desc: "Lepiej jest studiować ten [rite|El] w wolniejszym tempie, poświęcając wystarczająco dużo czasu na oswojenie się z niewygodnymi treściami i przyzwyczajenie się do jego obcego sposobu rozumowania."
 study_faith_slow_and_steady: "Powolne przyswajanie wiedzy"
 study_faith_slow_and_steady_desc: "Ta osoba została przytłoczona ilością nieznanych jej praktyk, a wysiłki włożone w przyswojenie wiedzy odbiły się negatywnie na jej sprawności umysłowej."
 study_faith_cramming_side_studies: "Kucie po godzinach"
 study_faith_cramming_side_studies_desc: "Uczeń jest tak pochłonięty wewnętrznymi mechanizmami tego [Concept('rite', 'obrządku')|E], że często robi notatki w trakcie nauki… nawet gdy jest zajęty czymś innym."
 followers_of_dead_faith_scheme_modifier: "Wiedza zaginiona w mrokach dziejów"
 followers_of_dead_faith_scheme_modifier_desc: "Ta [faith|El] nie jest już otwarcie praktykowana, przez co niezwykle trudno znaleźć jej wyznawców."
 appealing_theology_modifier: "Pociągająca teologia"
 appealing_theology_modifier_desc: "Ta postać odkryła obcy tekst teologiczny, który uważa za szczególnie interesujący."
 suspicions_of_heresy_modifier: "Podejrzenia herezji"
 suspicions_of_heresy_modifier_desc: "Tę postać często można zobaczyć, jak czyta obce teksty teologiczne, co sprawia, że ​​inni wyznawcy tej samej wiary nabierają podejrzeń co do jej pobożności."
 monastic_onslaught_modifier: "Fundamenty monastyczne"
 monastic_onslaught_modifier_desc: "Zakon monastyczny, hojnie wspierany przez świeckiego patrona, napędza lokalną działalność gospodarczą."
 pam_monastic_order_improvement_modifier: "Wsparcie monastyczne"
 pam_monastic_order_improvement_modifier_desc: "Zakon monastyczny wspiera to hrabstwo, zapewniając pomoc w postaci siły roboczej i doradztwa."
 pam_military_order_improvement_modifier: "Błogosławieni wojacy"
 pam_military_order_improvement_modifier_desc: "Wojownicy zakonu wojskowego szkolą uczestników lokalnego pospolitego ruszenia i wzmacniają dyscyplinę w tym hrabstwie."
 pam_tithes_or_mercy_harsh_tithes_modifier: "Przymusowe dziesięciny"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "Dziesięciny ściągano tu z bezwzględną surowością, co wywołało u lokalnych społeczności głęboką niechęć wobec ich zwierzchnika."
 pam_tithes_or_mercy_show_mercy_modifier: "Miłosierdzie w kwestii dziesięcin"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "Łagodniejsze podejście do poboru podatków przyczyniło się do wzrostu zaufania i dobrej woli wśród lokalnych społeczności."
 pam_blissful_harmony_gospel_modifier: "Ewangelia dobrego życia"
 pam_blissful_harmony_gospel_modifier_desc: "Nauki władcy sławią pokój, pobożność i bogobojne życie."
 pam_blissful_harmony_restless_ambition_modifier: "Nieposkromiona ambicja"
 pam_blissful_harmony_restless_ambition_modifier_desc: "Chwila błogości sprawia, że postać ta nie zazna spokoju, póki nie sięgnie po więcej."
 pam_stone_for_god_estate_build_discount_modifier: "Kamień na Dom Boży"
 pam_stone_for_god_estate_build_discount_modifier_desc: "Bystre, architektoniczne oko tej postaci umożliwiło pozyskanie kamienia."
 pam_relocating_faithfuls_to_frontiers: "Przeniesienie wiernych na rubieże"
 pam_relocating_faithfuls_to_frontiers_desc: "W tym hrabstwie zachęca się osoby tego samego [Concept('rite', 'obrządku')|E] do przeniesienia się do innego [Concept('realm', 'państwa')|E] w celu głoszenia wiary."
 pam_moving_faithfuls_to_frontiers: "Napływ wiernych"
 pam_moving_faithfuls_to_frontiers_desc: "Do tego hrabstwa napływają wyznawcy innej [Concept('faith', 'wiary')|E], którzy nawracają.\n#weak Dzięki temu [interaction|El] „#V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#!” jest tańsza.#!"
 pam_building_new_shrines: "Budowa nowych kapliczek"
 pam_building_new_shrines_desc: "Do tego hrabstwa napływają wyznawcy innej [Concept('faith', 'wiary')|E], którzy budują nowe kapliczki.\n #weak Dzięki temu [interaction|El] „#V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#!” jest tańsza.#!"
 pam_grand_cathedral_started_modifier: "Rozpoczęto budowę wielkiej katedry"
 pam_grand_cathedral_started_modifier_desc: "Ta postać gromadzi zasoby niezbędne do rozpoczęcia budowy wielkiej katedry. Ten projekt, który obejmie wiele pokoleń, już teraz stanowi wymowne świadectwo jej oddania Bogu."
 pam_grand_cathedral_completed_modifier: "Ukończono budowę wielkiej katedry"
 pam_grand_cathedral_completed_modifier_desc: "Ta postać zgromadziła zasoby niezbędne do ukończenia budowy wielkiej katedry. Ten projekt, który obejmie wiele pokoleń, stanowi wymowne świadectwo jej oddania Bogu."
 pam_grand_cathedral_02_started_modifier: "Rozbudowa wielkiej katedry"
 pam_grand_cathedral_02_started_modifier_desc: "Ta postać zgromadziła zasoby, aby rozbudować istniejącą wielką katedrę. Ten projekt, który obejmie wiele pokoleń, stanowi wymowne świadectwo jej oddania Bogu."
 pam_grand_cathedral_02_completed_modifier: "Ukończona rozbudowa wielkiej katedry"
 pam_grand_cathedral_02_completed_modifier_desc: "Ta postać nadzorowała rozbudowę wielkiej katedry."
 pam_grand_cathedral_family_contributed_south_modifier: "Ufundowano wielką kaplicę katedralną"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "Jeden z członków tej dynastii sfinansował budowę kaplicy przy wielkiej katedrze. Ten projekt, który obejmie wiele pokoleń, stanowi wymowne świadectwo jej oddania Bogu."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Fundator katedralnej krypty"
 pam_cathedral_founder_crypt_modifier_desc: "Ta postać ufundowała kryptę dla swojej dynastii pod wielką katedrą."
 pam_cathedral_bell_cracked_lesson_modifier: "Nauczka z pękniętego dzwonu"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Ludwisarze w tym hrabstwie pracują staranniej, aby zmyć wstyd po nieudanym odlaniu dzwonu."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Narzędzia tortur z brązu"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Resztki brązu z wadliwie odlanego katedralnego dzwonu przetopiono na narzędzia grozy. Ludwisarz był ich pierwszą ofiarą. Rzemieślnicy znają teraz cenę porażki."
 pam_cathedral_treadwheel_crane_modifier: "Dźwig deptakowy"
 pam_cathedral_treadwheel_crane_modifier_desc: "Potężny dźwig deptakowy z placu budowy katedry został wzniesiony w stolicy."
 pam_cathedral_cantoria_scam_modifier: "Zdemaskowane oszustwo"
 pam_cathedral_cantoria_scam_modifier_desc: "Po zdemaskowaniu oszustwa budowniczowie pracują z nowym zapałem i większą gospodarnością."
 pam_cathedral_famed_choir_boy_modifier: "Anielski głos na dworze"
 pam_cathedral_famed_choir_boy_modifier_desc: "Chłopiec z chóru o niebiańskim głosie dodaje temu dworowi splendoru."
 pam_cathedral_sermon_peace_county_modifier: "Kazanie o pokoju"
 pam_cathedral_sermon_peace_county_modifier_desc: "Kazanie władcy w nowym portalu katedralnym przyniosło temu hrabstwu większe zadowolenie, a pielgrzymi mogą bezpieczniej podróżować jego drogami."
 pam_cathedral_sermon_peace_ruler_modifier: "Poprowadzony ku pokojowi"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "Ten władca został poruszony katedralnym kazaniem o Chrystusowym pokoju."
 pam_cathedral_sermon_diligence_county_modifier: "Kazanie o gorliwości"
 pam_cathedral_sermon_diligence_county_modifier_desc: "Kazanie władcy w nowym portalu katedralnym zachęciło budowniczych kościołów i kamieniarzy do gorliwej pracy."
 pam_cathedral_sermon_diligence_ruler_modifier: "Poprowadzony ku pracowitości"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "Ten władca został poruszony katedralnym kazaniem o pobożnej pracy."
 pam_cathedral_sermon_unity_county_modifier: "Kazanie o jedności"
 pam_cathedral_sermon_unity_county_modifier_desc: "Kazanie władcy w nowym portalu katedralnym umocniło posłuszeństwo społeczności w tym hrabstwie."
 pam_cathedral_sermon_unity_ruler_modifier: "Poprowadzony ku zgodzie"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "Ten władca został poruszony katedralnym kazaniem o chrześcijańskiej wspólnocie."
 pam_cathedral_sermon_charity_county_modifier: "Kazanie o dobroczynności"
 pam_cathedral_sermon_charity_county_modifier_desc: "Kazanie władcy w nowym portalu katedralnym rozwiązało sakiewki i rozgrzało serca w tym hrabstwie."
 pam_cathedral_sermon_charity_ruler_modifier: "Poprowadzony ku dobroczynności"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "Ten władca został poruszony katedralnym kazaniem o hojnym miłosierdziu."
 pam_cathedral_sermon_perseverance_county_modifier: "Kazanie o wytrwałości"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "Kazanie władcy w nowym portalu katedralnym odnowiło pobożne starania i uporządkowany rozwój w tym hrabstwie."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Poprowadzony ku gorliwości"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "Ten władca został poruszony katedralnym kazaniem o podążaniu ścieżką wiary."
 pam_cathedral_sermon_rejoice_county_modifier: "Kazanie o radości"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "Kazanie władcy w nowym portalu katedralnym napełniło wiernych nadzieją na niezawodną miłość Pana."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Poprowadzony ku radości"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "Ten władca został poruszony katedralnym kazaniem o radowaniu się w Panu."
 pam_cardinal_order_improve_development_modifier: "Rozkaz dla kardynała do usprawnienia rozwoju"
 pam_cardinal_order_improve_development_modifier_desc: "Kardynał działa na polecenie swojego przełożonego, aby wesprzeć rozwój lokalnej archidiecezji."
 pam_cardinal_order_convert_faith_modifier: "Rozkaz dla kardynała do nawracania wiernych"
 pam_cardinal_order_convert_faith_modifier_desc: "Kardynał działa na polecenie swojego przełożonego, aby wesprzeć nawracanie wiernych w lokalnej archidiecezji i w graniczących ziemiach.\n\n$EFFECT_LIST_BULLET$[Concept('convert_county', 'Nawracanie')|E] w tym [Concept('county', 'hrabstwie')|E]: #P +25%#!"
 pam_cardinal_order_increase_control_modifier: "Rozkaz dla kardynała do zwiększenia kontroli w hrabstwie"
 pam_cardinal_order_increase_control_modifier_desc: "Kardynał działa na polecenie swojego przełożonego, aby spacyfikować ludność w lokalnej archidiecezji."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Rozkaz do przyspieszenia fascynacji kulturowej"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "Kardynał działa na polecenie swojego przełożonego, aby przyspieszyć badania nad nowymi technologiami."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Rozkaz dla kardynała do poprawy odporności na zarazę"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "Kardynał gromadzi zasoby Kościoła na polecenie swojego przełożonego, aby pomóc w łagodzeniu skutków zarazy."
 pam_cardinal_order_improve_legitimacy_modifier: "Rozkaz dla kardynała do poprawy legitymacji"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "Kardynał działa na polecenie swojego przełożonego, aby poprawić legitymację władców w lokalnej archidiecezji."
 pam_cardinal_order_undermine_legitimacy_modifier: "Rozkaz dla kardynała do osłabienia legitymacji"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "Kardynał działa na polecenie swojego przełożonego, aby osłabić legitymację władców w lokalnej archidiecezji."
 heathen_mandate_modifier: "Poganie głoszący prawowitość"
 heathen_mandate_modifier_desc: "Święci mężowie pogańskiego władcy roszczą sobie prawo do dusz tej ziemi. To odrażające roszczenia wspierane przez ich fałszywą wiarę."
 pam_recently_baptized_at_domicile_modifier: "Niedawny chrzest"
 pam_recently_baptized_at_domicile_modifier_desc: "Ta postać została ochrzczona w baptysterium kompleksu katedralnego swojej archidiecezji."
 pam_khachkar_ancestral_county: "Chaczkar przodków"
 pam_khachkar_ancestral_county_custom_desc: "Ku pamięci osoby znanej jako [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed] – [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom('PL_jego_jej')] [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"
 pam_denied_new_pope_modifier: "Odrzucenie nowego papieża"
 pam_denied_new_pope_modifier_desc: "Ta postać odmówiła uznania nowo wybranego papieża."
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "Uświęcona pozycja"
 pam_dulia_relic_piety_per_dread_modifier: "Aura męczennika"
 pam_dulia_relic_piety_per_knight_modifier: "Błogosławieństwo Hostii"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Kojąca łaska"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Namaszczenie przez świętych"
 pam_dulia_relic_learning_per_piety_modifier: "Oświecone oddanie"
 pam_dulia_relic_monthly_piety_modifier: "Źródło łaski"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "Orzecznik w sprawach wiary"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "Ta postać rozstrzygnęła spór dotyczący brzmienia wyznania wiary, zanim jeszcze sobór powszechny rozpoczął obrady."
 pam_ecumenical_council_primacy_upheld_modifier: "Podtrzymana wyższość"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "Ta postać została zapytana podczas otwartego soboru, komu podlegają kościoły tej wspólnoty wyznaniowej i rozstrzygnęła tę kwestię nie wstając z miejsca."
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "Nowy orędownik"
 pam_dulia_new_saint_modifier_desc: "Ta postać została zainspirowana niedawnym ogłoszeniem nowego świętego."
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "Pielgrzym obieżyświat"
 pam_pilgrim_of_every_holy_site_modifier_desc: "Ta postać odbyła czuwanie w każdym świętym miejscu uznawanym przez jej wiarę."
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "Zachowana więź"
 tenet_harmonious_society_five_bonds_modifier_desc: "Władca i poddany, rodzic i dziecko, mąż i żona, osoba starsza i młodsza, przyjaciel i druh. Ta postać utrzymuje jedną z tych pięciu relacji w dobrej formie."
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "Łańcuch święceń"
 tenet_apostolic_succession_episcopate_modifier_desc: "Ta postać wyznaje wiarę, w której każdy biskup był wyświęcany przez osobę wyświęconą przed nim, co nadawało mu legitymację."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Przyrost za każdego [Concept('theocratic_vassal', 'wasala teokratycznego')|E] (maks. [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "Chóry wiernych"
 tenet_divine_liturgy_choirs_modifier_desc: "W każdym kościele należącym do tej postaci wyśpiewuje się te same słowa o takich samych porach – i tak jest od czasów, zanim urodził się ktokolwiek z obecnie żyjących."
 modifier_definition_value_per_held_temple: "\t#weak Przyrost za każdą posiadaną [Concept('temple_holding', 'posiadłość świątynną')|E] (maks. [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "Godna liturgia"
 tenet_divine_liturgy_officiant_modifier_desc: "Ta postać traktuje Boską Liturgię swojej wiary niezwykle poważnie."
 tenet_divine_liturgy_schola_cantorum_modifier: "Schola cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "Senior, który utrzymuje szkołę śpiewu liturgicznego, ma w swoich szeregach liturgistę, którego warto posłuchać."
 tenet_pentarchy_holy_site_modifier: "Stolica patriarchatu"
 tenet_pentarchy_holy_site_modifier_desc: "Miejsce święte w tym hrabstwie kwitnie dzięki trosce wiernych."
 tenet_polyamory_new_beloved_modifier: "Miłość dodaje skrzydeł"
 tenet_polyamory_new_beloved_modifier_desc: "Nowa miłość sprawia, że ta postać unosi się nad ziemią."
 modifier_definition_value_per_chaplain_learning: "\t#weak Przyrost za każdy punkt [Concept('learning', 'nauki')|E] [Concept('court_chaplain', 'nadwornego kapelana')|E] (maks. [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "Ciężar kary"
 tenet_purgatory_sin_penalty_modifier_desc: "Grzech wyznany to grzech wybaczony, ale wynikająca z niego kara nie zostaje przez to darowana. To, czego nie spłaci się w tym życiu, zostanie wyegzekwowane po śmierci, a wierni doskonale widzą, którą z tych dwóch dróg wybrała ta postać."
 tenet_original_sin_sinners_insight_modifier: "Tajemna wiedza grzesznika"
 tenet_original_sin_sinners_insight_modifier_desc: "Każdy, kto dźwiga ciężar grzechu, doskonale wie, gdzie kryje się on w innych."
