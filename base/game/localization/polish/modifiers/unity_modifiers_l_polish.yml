l_polish:
 unity_antagonistic_maa_modifier: "Lojalni oficerowie wojskowi"
 unity_antagonistic_maa_modifier_desc: "Członkowie tego rodu połączyli swoje zasoby, aby wzmocnić oddziały w swoich armiach.\n\n"
 unity_competitive_spies_modifier: "Siatka intryg"
 unity_competitive_spies_modifier_desc: "Członkowie tego rodu dzielą się ze sobą intrygami, tworząc siatkę szpiegowską dostępną tylko dla członków ich rodu.\n\n"
 unity_competitive_spies_landless_merchant_modifier: "Siatka intryg"
 unity_competitive_spies_landless_merchant_modifier_desc: "Członkowie tego rodu dzielą się ze sobą intrygami, tworząc siatkę szpiegowską dostępną tylko dla członków ich rodu.\n\n"
 unity_impassive_tax_modifier: "Usprawniona administracja"
 unity_impassive_tax_modifier_desc: "Członkowie tego rodu cieszą się zwiększoną efektywnością swojej administracji.\n\n"
 unity_friendly_bailiff_modifier: "Wzmocnienie włodarzy"
 unity_friendly_bailiff_modifier_desc: "Członkowie tego rodu współpracują ze swoim seniorem w celu ograniczenia korupcji w całym państwie.\n\n"
 unity_harmonious_placation_modifier: "Zjednanie"
 unity_harmonious_placation_modifier_desc: "Członkowie tego rodu potwierdzili prawo ich seniora do rządzenia w harmonii.\n\n"
 unity_house_organized_for_war_modifier: "Przygotowania do wojny"
 unity_house_organized_for_war_modifier_desc: "Członkowie tego rodu zobowiązali się do prowadzenia wojny.\n[rulers|E] przyjmą [warlike_i|E] [ai_warlike_personality|Ll] [economical_archetype|El]"
 unity_house_focused_on_economy_modifier: "Wspieranie gospodarki"
 unity_house_focused_on_economy_modifier_desc: "Członkowie tego rodu z wielkim entuzjazmem aktywnie rozwijają swoją gospodarkę.\n[rulers|E] przyjmą [builder_i] [ai_economical_boom_personality|Ll] [economical_archetype|El]"
 unity_house_focused_on_diplomacy_modifier: "Działania dyplomatyczne"
 unity_house_focused_on_diplomacy_modifier_desc: "Członkowie tego rodu współpracują ze sobą, aby skutecznie rozszerzać swoje wpływy."
 fp3_unity_promoted_prosperity_modifier: "Promowany dobrobyt"
 fp3_unity_promoted_prosperity_modifier_desc: "Członkowie tego rodu współpracują przy zagospodarowaniu swoich ziem."
 fp3_unity_improved_logistics_modifier: "Wspólna logistyka wojskowa"
 fp3_unity_improved_logistics_modifier_desc: "Członkowie tego rodu dzielą się swoją logistyką wojskową i zaopatrzeniem."
 unity_family_business_landless_merchant_modifier: "Zorganizowane przedsiębiorstwo rodzinne"
 unity_family_business_landless_merchant_modifier_desc: "W rezydencji tego rodu panuje ożywiony ruch, a jego członkowie sumiennie wykonują otrzymane polecenia.\n\n"
 unity_regional_networks_landless_merchant_modifier: "Sieci regionalne"
 unity_regional_networks_landless_merchant_modifier_desc: "Głowa tego rodu dostrzega zróżnicowane interesy biznesowe jego członków.\n\n"
 unity_merchant_development_modifier: "Promowany rozwój"
 unity_merchant_development_modifier_desc: "Kupcy w tym hrabstwie wspierają rozwój miejski.\n\n"
 unity_merchant_bailiffs_modifier: "Włodarze miejscy"
 unity_merchant_bailiffs_modifier_desc: "Kupcy w tym hrabstwie wspierają prawo i porządek.\n\n"
 unity_merchant_prosperity_modifier: "Wspieranie społeczności"
 unity_merchant_prosperity_modifier_desc: "Miejscowi kupcy dzielą się swoim majątkiem ze swoją społecznością, przyczyniając się do poprawy jakości życia wszystkich jej mieszkańców."
 MODIFIER_DEFINITION_VALUE_PER_MERCHANT_UNITY_MEMBER: " \t#weak Przyrost za każdego członka [Concept('house', 'rodu')|E]#!"
 MODIFIER_DEFINITION_MAIN_DESC_HOUSE_UNITY_LANDESS_MERCHANT: "Efekt tego modyfikatora zwiększa się za każdego członka [Concept('house', 'rodu')|E], który jest niezależnym [Concept('merchant', 'kupcem')|E] lub sprawuje [court_position|El] (#bold $MULTIPLIER|0$#!/#bold 10#!)"
 unity_promoting_diligence_modifier: "Promowanie skrupulatności"
 unity_promoting_diligence_modifier_desc: "Od członków tego rodu oczekuje się nieprzerwanej pracy – ciągłego przeglądania ksiąg w pogoni za znalezieniem najmniejszej nawet przewagi – by ulepszyć handel i zwiększyć zyski, które przynosi ich kompania.\n\n"
 unity_promoting_excess_modifier: "Promowanie zbytku"
 unity_promoting_excess_modifier_desc: "Członkowie tego rodu swobodnie wydają środki na luksusowe przyjemności, podtrzymując reputację i prestiż swojej kompanii.\n\n"
