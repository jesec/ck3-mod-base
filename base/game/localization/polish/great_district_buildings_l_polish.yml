 building_type_republic_statute_hall_01_desc: "Izba, w której przechowuje się, przepisuje i co roku odczytuje na głos prawa komuny, tak by żaden urzędnik nie mógł zasłaniać się ich nieznajomością, a żaden obywatel twierdzić, że nikt mu o nich nie powiedział."
