 building_type_republic_podesta_residence_01_desc: "Opłacany urzędnik sprowadzony z innego miasta na określony czas, utrzymywany z publicznych środków i pozbawiony prawa do posiadania tu majątku. Nie mając w mieście krewnych, nie opowiada się po żadnej ze stron w jego sporach."
