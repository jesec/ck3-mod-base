 building_type_republic_civic_hospital_01: "Szpital miejski"
 building_type_republic_civic_hospital_01_desc: "Sale ufundowane przez komunę i utrzymywane jej kosztem, gdzie chorych biedaków przyjmuje się pod dach, zamiast zostawiać ich na śmierć na ulicy. Zdrowy obywatel to obywatel produktywny."
