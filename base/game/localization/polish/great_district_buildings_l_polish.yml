 building_type_republic_loggia_01_desc: "Arkadowa galeria wzdłuż krawędzi placu. W jej cieniu kupcy dobijają targu, notariusze rozstawiają pulpity między kolumnami, a całe miasto chroni się tu, gdy nadejdzie deszcz."
