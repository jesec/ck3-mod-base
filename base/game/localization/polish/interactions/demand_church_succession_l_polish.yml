l_polish:
 demand_church_succession_interaction: "Zażądaj sukcesji kościelnej"
 demand_church_succession_religious_head_interaction: "Ogłoś sukcesję kościelną"
 demand_church_succession_interaction_desc: "Jeśli [recipient.GetTitledFirstName] odejdzie z tego świata bez prawowitego dziedzica, [recipient.Custom('PL_jego_jej')] ziemie trafią do osoby, do której należą ziemie znane jako [actor.GetPrimaryTitle.GetName], a która jest [Concept('fallback_heir', 'dziedzicem zastępczym')|E]."
 demand_church_succession_religious_head_interaction_desc: "Jako [Concept('head_of_faith', 'głowa')|E] [Concept('faith', 'wiary')|E] o nazwie [actor.GetFaith.GetName|l], ogłoś, że państwo osoby, którą jest [recipient.GetTitledFirstName], ma trafić do miejsca znanego jako [actor.GetPrimaryTitle.GetName], jeśli [recipient.GetTitledFirstName] umrze bezpotomnie."
 demand_church_succession_target_in_reach: "[realm|E] osoby znanej jako [recipient.GetShortUINameNotMe] nie graniczy z [Concept('realm', 'państwem')|E] osoby znanej jako [actor.GetShortUINameNotMe], nie leży też w [Concept('archdiocese', 'archidiecezji')|E] tej osoby"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName] obiecuje swoją sukcesję innemu duchownemu lub [Concept('fallback_heir', 'dziedzicowi zastępczemu')|E]"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName] posiada swój [primary_title|El] na mocy [Concept('elective_succession', 'sukcesji elekcyjnej')|E] lub [Concept('advanced_succession', 'zaawansowanej sukcesji')|E]"
 demand_church_succession_recently_refused_tt: "Osoba, którą jest [recipient.GetTitledFirstName], niedawno sprzeciwiła się żądaniu sukcesji kościelnej i przez dziesięć lat jest chroniona przed kolejnymi tego typu żądaniami"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Zażądaj sukcesji kościelnej"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "Jeśli [recipient.GetTitledFirstName] umrze bezpotomnie, [actor.GetTitledFirstName] żąda, by [recipient.Custom('PL_jego_jej')] ziemie zostały włączone do miejsca o nazwie [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName] przynależy do [Concept('faith', 'wiary')|E]"
 demand_church_succession_actor_toast_desc: "Jeśli [recipient.GetTitledFirstName] umrze bezpotomnie, [actor.GetPrimaryTitle.GetName] odziedziczy [recipient.Custom('PL_jego_jej')] państwo."
 demand_church_succession_actor_toast_puppeteer: "Postać znana jako [puppet_or_actor.GetShortUINameNotMe] zobowiązała osobę, którą jest [recipient.GetTitledFirstName], do wyznawania konkretnej [Concept('faith', 'wiary')|E]"
 demand_church_succession_actor_toast_desc_puppeteer: "Jeśli umrze bezpotomnie, [puppet_or_actor.GetPrimaryTitle.GetName] odziedziczy [recipient.Custom('PL_jego_jej')] państwo."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "Z łaski [actor.GetFaith.HighGodNamePossessive] piszemy do Ciebie w kwestii spuścizny."
 demand_church_succession.0001.desc.archbishop: "Z mej archidiecezji, która czuwa nad Twymi ziemiami, piszę do Ciebie w sprawie spuścizny."
 demand_church_succession.0001.desc.bishop: "Twój pasterz pisze do Ciebie w sprawie spuścizny."
 demand_church_succession.0001.desc.head_of_faith_generic: "Jako [actor.GetTitleAsNameNoTooltip] wiary piszę do Ciebie w sprawie spuścizny."
 demand_church_succession.0001.desc.theocrat_generic: "Sprzed ołtarza [actor.GetFaith.HighGodNamePossessive] piszę do Ciebie w kwestii spuścizny."
 demand_church_succession.0001.flavour.zealous: "\n\nPostawmy sprawę jasno:"
 demand_church_succession.0001.flavour.ambitious: "\n\nBądźmy szczerzy:"
 demand_church_succession.0001.flavour.deceitful: "\n\nTo bez wątpienia dla Ciebie pocieszenie:"
 demand_church_succession.0001.flavour.greedy: "\n\nPowiem wprost:"
 demand_church_succession.0001.flavour.compassionate: "\n\nWybacz tę konieczność, ale"
 demand_church_succession.0001.flavour.default: "\n\nPozwól, że będę mówić wprost:"
 demand_church_succession.0001.recipient.elderly_childless: "kołyska stojąca przy Twym palenisku jest pusta, a Twój ród kończy się na Tobie. Wierni są cierpliwi – a z czasem czeka na nich spuścizna."
 demand_church_succession.0001.recipient.childless: "nie masz żyjących dzieci. Jeśli z woli [actor.GetFaith.HighGodNamePossessive] to się nie zmieni, Twoje ziemie przysłużą się naszej wierze."
 demand_church_succession.0001.recipient.one_child: "tylko jedno dziecko dzieli Cię od końca wszystkiego. Jeśli z woli [actor.GetFaith.HighGodNamePossessive] umrze, wierni są gotowi, by władać ziemią."
 demand_church_succession.0001.recipient.default: "mijające lata zazdroszczą każdej obietnicy. Jeśli Twoja nie zostanie spełniona, Twoje ziemie trafią do nas i będą zarządzane w imię [actor.GetFaith.HighGodNamePossessive]."
 demand_church_succession.0001.a: "Tak zostało napisane i tak niechaj się stanie."
 demand_church_succession.0001.b: "W takim razie muszę doczekać się dziecka."
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip] pozwala sobie na zbyt wiele."
 demand_church_succession.0001.c.tt: "Udaje ci się unieważnić porozumienie w sprawie [Concept('fallback_heir_title', 'tytułu dziedzica zastępczego')|E] i masz ochronę przed kolejnymi żądaniami sukcesji kościelnej przez 10 lat, ale [actor.GetTitledFirstName] nie zapomni szybko tej urazy."
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "Odrzucam Twoje żądanie. Moje państwo nigdy nie trafi do Kościoła. Zajmij się swoim ołtarzem, a ja zajmę się moją ziemią."
 demand_church_succession.0002.a: "Bezczelność zostanie zapamiętana."
 demand_church_succession_fertility_modifier: "Pilna potrzeba potomka"
 demand_church_succession_fertility_modifier_desc: "Determinacja, by nie dopuścić do przekazania państwa w ręce kościoła, sprawiła, że ta postać zdwoiła wysiłki w łożu małżeńskim."
 defied_church_succession_opinion: "Podważono moje roszczenie do sukcesji"
 meddling_church_opinion: "Wtrącanie się w moją sukcesję"
