l_polish:
 puppet_excommunicate_interaction: "#D Excommunicate via your Puppet#!"
 actor_secondary_puppet_excommunicate_interaction: "$theological_agent_puppet$"
 theological_agent_puppet: "Marionetkowy kapłan koronny"
 theological_agent_puppet_desc: "[realm_priest|E] będący [Concept('puppet', 'marionetką')|E] jest twoim głosem w Kościele. Umożliwia ci głosowanie na [Concept('ecumenical_councils', 'soborach powszechnych')|E] oraz tworzenie [Concept('rites', 'obrządków')|E]."
 puppet_type_no_candidates: "Nie masz dostępnych [Concept('puppets', 'marionetek')|E] typu [PuppetType.GetName|Vl]"
 puppet_action_description_puppet_action_give_gift: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('gift_interaction')]#!”, aby wydać [gold|El] na [Concept('opinion', 'opinię')|E] u innej [Concept('character', 'postaci')|E]"
 puppet_action_description_puppet_action_ask_excommunicate_character: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_excommunication_interaction')]#!”, aby [head_of_faith|El] [Concept('excommunicate', 'ekskomunikowała')|E] grzeszną [character|El]"
 puppet_action_description_puppet_trigger_can_create_faith: "Utwórz nową [Concept('faith', 'wiarę')|E]"
 puppet_action_description_puppet_trigger_can_create_rite: "Utwórz nowy [rite|El]"
 puppet_action_description_puppet_action_command_murder: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('start_murder_interaction')]#!” wobec wybranej [Concept('character', 'postaci')|E]"
 puppet_action_description_puppet_action_request_elevation: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_elevation_interaction')]#!”, aby wystąpić z prośbą do [Concept('head_of_faith', 'głowy wiary')|E] o bardziej prestiżowy [clerical_title|El]"
 request_clerical_region_title_cannot_request_hof_see_tt: "Nie możesz wystąpić o [clerical_title|El] posiadany przez [Concept('head_of_faith', 'głowę wiary')|E]"
 request_clerical_region_title_capital_region_tt: "Twoja [capital|El] musi się znajdować w [Concept('clerical_region', 'regionie duchownym')|E], o który występujesz"
 higher_piety_level_than_hof: "[piety_level|E] jest wyższy niż u [head_of_faith_possessive|El]"
 lower_piety_level_than_hof: "[piety_level|E] jest niższy niż u [head_of_faith_possessive|El]"
 is_puppet_action_valid_first: "Masz [Concept('puppet', 'marionetkę')|E], która umożliwia następujące działanie: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 is_puppet_action_valid_third: "[CHARACTER.GetShortUINameNotMe] ma [Concept('puppet', 'marionetkę')|E], która umożliwia następujące działanie: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 is_puppet_action_valid_global: "Ma [Concept('puppet', 'marionetkę')|E], która umożliwia następujące działanie: [PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]"
 not_is_puppet_action_valid_first: "#bold Nie#! masz [Concept('puppet', 'marionetki')|E], która umożliwiałaby następujące działanie: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 not_is_puppet_action_valid_third: "[CHARACTER.GetShortUINameNotMe] #bold nie#! ma [Concept('puppet', 'marionetki')|E], która umożliwiałaby następujące działanie: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 not_is_puppet_action_valid_global: "#bold Nie#! ma [Concept('puppet', 'marionetki')|E], która umożliwiałaby następujące działanie: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 request_elevation_interaction: "Poproś o wywyższenie"
 request_elevation_interaction_desc: "Wystąp do [Concept('head_of_faith', 'głowy wiary')|E] z prośbą o [clerical_title|El] z twojego [Concept('clerical_region', 'regionu duchownego')|E], niezależnie od tego, czy tytuł ten jest niezajęty, czy jest w posiadaniu twojego [Concept('superior', 'zwierzchnika')|E]"
 request_elevation_interaction_notification: "Miejsce, którym jest [target.GetNameNoTier], czeka na pasterza godnego tej roli. Daj mi to stanowisko, a miejscowa trzódka pozna rękę, która nie pozwoli jej zboczyć z drogi."
 request_elevation_cannot_unseat_player_tt: "Nie można pozbawić stanowiska [Concept('holder', 'posiadacza')|E] [Concept('clerical_title', 'tytułu duchownego')|E] noszonego przez innego gracza"
 request_elevation_interaction_toast_title: "Wywyższono!"
 request_elevation_interaction_toast_title_puppeteer: "Ranga postaci znanej jako [puppet_or_actor.GetShortUINameNotMe] została podniesiona!"
 request_ecclesiastical_title_expansion_interaction: "Wystąp o poszerzenie tytułu duchownego"
 request_ecclesiastical_title_expansion_interaction_desc: "Złóż petycję do swojej [Concept('head_of_faith', 'głowy wiary')|E], aby rozszerzyła twój [clerical_region|El] na przyległe [duchy|El]\n\nWszystkie hrabstwa [de_jure|El] wybranego [Concept('duchy', 'księstwa')|E] zostaną dodane do twojego [Concept('clerical_region', 'regionu duchownego')|E]"
 request_ecclesiastical_title_expansion_interaction_notification: "Wiernym w miejscu znanym jako [target.GetNameNoTier] brakuje duchowego przywództwa. Włączmy te ziemie do mojej archidiecezji, na chwałę [actor.GetFaith.HighGodNamePossessive]."
 request_ecclesiastical_title_expansion_accepted_tt: "Rozszerzono tytuł duchowny"
 recipient_secondary_request_ecclesiastical_title_expansion_interaction: "Właściciel"
 puppet_action_description_puppet_action_request_ecclesiastical_title_expansion: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_expansion_interaction')]#!”, aby złożyć petycję do [Concept('head_of_faith', 'głowy wiary')|E] o rozszerzenie twojego [Concept('clerical_region', 'regionu duchownego')|E] na przyległe [duchy|El]"
 request_ecclesiastical_title_merger_interaction: "Zażądaj połączenia tytułu duchownego"
 request_ecclesiastical_title_merger_interaction_desc: "Złóż petycję do swojej [Concept('head_of_faith', 'głowy wiary')|E], aby usankcjonowała wchłonięcie sąsiadującego tytułu przez twoją [Concept('capital', 'stolicę')|E] [clerical_region_possessive|El]"
 request_ecclesiastical_title_merger_interaction_notification: "Moja zbiorowość prosperuje, a lud w miejscu znanym jako [target.GetNameNoTier] błądzi przez brak stanowczej ręki. Daj go pod moją opiekę; pozwól, by jeden wierny zwierzchnik poprowadził stado dzielone przez dwójkę pasterzy."
 request_ecclesiastical_title_merger_accepted_tt: "Połączono tytuł duchowny"
 request_ecclesiastical_title_merger_absorbed_tt: "Utracono tytuł duchowny"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "Brak właściwego [Concept('clerical_region', 'regionu duchownego')|E] – twój [clerical_region|El] musi graniczyć z co najmniej jednym [Concept('clerical_region', 'regionem duchownym')|E] przynależącym do tej samej wiary"
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#!”, aby złożyć petycję do [Concept('head_of_faith', 'głowy wiary')|E] o włączenie sąsiadującego [Concept('clerical_region', 'regionu duchownego')|E] do twojego własnego"
 rival_ecclesiastical_title_merged: "[CHARACTER.GetShortUINameNotMe] włącza do swojego regionu [clerical_title|El] osoby znanej jako [TARGET_CHARACTER.GetShortUINameNotMe]"
 request_ecclesiastical_title_creation_interaction: "Wystąp o utworzenie tytułu duchownego"
 request_ecclesiastical_title_creation_interaction_desc: "Wystąp do [Concept('head_of_faith', 'głowy wiary')|E] o utworzenie nowego [Concept('clerical_title', 'tytułu duchownego')|E] w twoim [Concept('realm', 'państwie')|E]\n\nWybierasz [title|El], który będzie jego siedzibą, a także jego pierwszego [Concept('holder', 'posiadacza')|E]\n\n#weak Nowy [clerical_region|El] obejmuje każde [county|El] [de_jure|El] [Concept('kingdom', 'królestwa')|E] [de_jure|El] swojej siedziby, które nie należy jeszcze do żadnego [Concept('clerical_region', 'regionu duchownego')|E]#!"
 request_ecclesiastical_title_creation_interaction_notification: "Wierni z mych ziem prowadzeni są z dali przez obcych, którzy nic o nich nie wiedzą. Pozwól na utworzenie nowej diecezji w miejscu, które wskażę, a nie braknie im niczego."
 request_ecclesiastical_title_creation_accepted_tt: "Utworzono: [new_title.GetNameNoTooltip]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "Nie posiadasz [Concept('duchy', 'księstwa')|E] ani [Concept('title', 'tytułu')|E] wyższego w hierarchii, którego [capital|El] [de_jure|El] może być siedzibą nowego [Concept('clerical_region', 'regionu duchownego')|E]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.GetShortUINameNotMeNoTooltip] nie posiada [Concept('duchy', 'księstwa')|E] ani [Concept('title', 'tytułu')|E] wyższego w hierarchii, którego [capital|El] [de_jure|El] może być siedzibą nowego [Concept('clerical_region', 'regionu duchownego')|E]"
 pam_new_clerical_region_invalid_anchor_tt: "[capital|E] [de_jure|El] tego [Concept('title', 'tytułu')|E] musi wyznawać [Concept('faith', 'wiarę')|E] petenta, znajdować się w jego [Concept('realm', 'państwie')|E] i nie być częścią innego [Concept('clerical_region', 'regionu duchownego')|E]"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "Wymaga kandydata należącego do [Concept('clergy', 'duchowieństwa')|E], który nie posiada jeszcze [Concept('clerical_region', 'regionu duchownego')|E]"
 recipient_secondary_request_ecclesiastical_title_creation_interaction: "Właściciel"
 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "Aby złożyć petycję do [Concept('head_of_faith', 'głowy wiary')|E] o utworzenie nowego [Concept('title', 'tytułu')|E] w [Concept('clerical_region', 'regionie duchownym')|E] przynależącym do wybranego przez ciebie [Concept('title', 'tytułu')|E], użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#!”"
 request_create_new_ecclesiastical_title_effect_tt: "Nowy [clerical_title|El] tworzony jest w [Concept('capital', 'stolicy')|E] [de_jure|El] miejsca znanego jako [target_kingdom.GetName] i obejmuje każde [county|El] [de_jure|El] w [Concept('kingdom', 'królestwie')|E] [de_jure|El] wspomnianej siedziby nienależące jeszcze do żadnego [Concept('clerical_region', 'regionu duchownego')|E] i przyznane osobie znanej jako [new_ecclesiastical_holder.GetShortUINameNotMe]"
 request_ecclesiastical_title_split_interaction: "Wystąp o podział tytułu kościelnego"
 request_ecclesiastical_title_split_interaction_desc: "Złóż petycję do swojej [Concept('head_of_faith', 'głowy wiary')|E] o utworzenie nowego [Concept('title', 'tytułu')|E] kościelnego w ramach istniejącego już [Concept('clerical_region', 'regionu duchownego')|E]\n\nJeśli jesteś [Concept('ruler', 'władcą')|E] świeckim, zostanie on utworzony w twojej [Concept('capital', 'stolicy')|E] i przydzielony [Concept('holder', 'właścicielowi')|E], którego wybierzesz. Jeśli jesteś duchownym posiadającym ziemię – to ty będziesz jego pierwszym [Concept('holder', 'właścicielem')|E]\n\n#weak Podział przebiega zgodnie z granicami królestwa: nowy [title|El] obejmuje wyłącznie [counties|El] wewnątrz [Concept('clerical_region', 'regionu duchownego')|E] posiadanego przez ciebie (lub – jeśli jesteś duchownym – twojego [Concept('liege', 'seniora')|E]), więc w przypadku większego [Concept('realm', 'państwa')|E] wyodrębniony zostanie większy obszar#!"
 request_ecclesiastical_title_split_interaction_notification: "Nie ma pasterza, który byłby w stanie czuwać nad tak wielkim stadem. Utwórzcie z tych ziem nową diecezję, a żadna z tutejszych owiec nie pozostanie niezauważona."
 clerical_title_split_tt: "Nowy tytuł kościelny obejmujący [realm|El] osoby znanej jako [puppet_liege.GetTitledFirstName] został wydzielony i utworzony z [Concept('clerical_region', 'regionu duchownego')|E] osoby, którą jest [puppet_superior.GetName], a [new_ecclesiastical_holder.GetName] zostaje jego pierwszym [Concept('holder', 'właścicielem')|E]"
 request_ecclesiastical_title_split_effect_tt: "Nowy [clerical_title|El] obejmujący [realm|El] osoby znanej jako [puppet_or_actor.GetTitledFirstName] zostaje wydzielony z regionu duchownego o nazwie [split_source_clerical_region.GetName] i przydzielony osobie, którą jest [new_ecclesiastical_holder.GetShortUINameNotMe]"
 request_ecclesiastical_title_split_accepted_tt: "Podzielono tytuł kościelny"
 request_ecclesiastical_title_split_lost_tt: "Pomniejszono region duchowny"
 actor_secondary_request_ecclesiastical_title_split_interaction: "Nowy właściciel"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "Obecny właściciel"
 pam_split_no_region_to_split_tt: "W twoim [Concept('realm', 'państwie')|E] musi istnieć część [Concept('clerical_region', 'regionu duchownego')|E], którą da się wydzielić"
 pam_split_no_region_to_split_tt_puppeteer: "W [Concept('realm', 'państwie')|E] postaci znanej jako [puppet_or_actor.GetShortUINameNotMe] musi istnieć część [Concept('clerical_region', 'regionu duchownego')|E], którą da się wydzielić"
 pam_split_capital_is_region_seat_tt: "[capital|E] osoby, którą jest [puppet_or_actor.GetShortUINameNotMeNoTooltip], nie może być [Concept('clerical_region_capital', 'stolicą')|E] dzielonego [Concept('clerical_region', 'regionu duchownego')|E]"
 pam_split_no_eligible_holder_tt: "Musi istnieć osoba, która może zostać [Concept('holder', 'właścicielem')|E] nowego [Concept('clerical_title', 'tytułu duchownego')|E]"
 pam_split_too_small_tt: "Nowy [clerical_region|El] byłby zbyt mały – musi zawierać co najmniej #V 3#! [counties|El]"
 pam_split_liege_capital_is_region_seat_tt: "[capital|E] twojego [Concept('liege', 'seniora')|E] nie może być [Concept('clerical_region_capital', 'stolicą')|E] dzielonego [Concept('clerical_region', 'regionu duchownego')|E]"
 pam_split_larger_than_superior_tt: "Nowy [clerical_region|El] nie może być większy niż część, którą posiada obecny [holder|El]"
 pam_split_region_is_religious_head_seat_tt: "Dzielony [clerical_region|El] nie może być siedzibą [Concept('head_of_faith', 'głowy wiary')|E] ani [Concept('head_of_rite', 'głowy obrządku')|E]"
 request_clerical_elector_title_interaction: "Zażądaj diecezji kardynalskiej"
 request_clerical_elector_title_interaction_desc: "Złóż petycję do swojej [Concept('head_of_faith', 'głowy wiary')|E], aby mianowała cię na stanowisko [Concept('cardinal', 'kardynała')|E]. Twoja [head_of_faith|El] zostanie twoim [Concept('superior', 'zwierzchnikiem')|E]"
 request_clerical_elector_title_interaction_notification: "Od dawna służę wierze słowem i uczynkiem. Teraz proszę o możliwość praktykowania jej jeszcze wierniej. Podaruj mi czerwony kapelusz, a gdy kolegium przemówi, będziesz wiedzieć, za kim się opowiem."
 request_clerical_elector_title_interaction_toast: "Przyznano diecezję kardynalską"
 request_clerical_elector_title_interaction_decline_toast: "[recipient.GetShortUINameNotMeNoTooltip] odrzuca prośbę o [Concept('cardinalate', 'diecezję kardynalską')|E] złożoną przez osobę, którą jest [puppet_or_actor.GetShortUINameNotMeNoTooltip]"
 request_clerical_elector_title_interaction_accept_tt: "[recipient.GetShortUINameNotMeNoTooltip] akceptuję prośbę o [Concept('cardinalate', 'diecezję kardynalską')|E] złożoną przez osobę, którą jest [puppet_or_actor.GetShortUINameNotMeNoTooltip]"
 external_theological_agent_puppet: "Marionetkowy władca duchowny"
 external_clerical_puppet: "[external_clerical_puppet|E]"
 has_relation_external_clerical_puppet: "Jest już [Concept('external_clerical_puppet', 'marionetkowym władcą duchownym')|E]"
 external_theological_agent_puppet_desc: "[puppet|E] duchowna znajduje się poza twoim [Concept('realm', 'państwem')|E]. Rolę tę mogą pełnić [archbishops|El], [cardinals|El] lub [head_of_faith|E]. Osoby te są wpływowe i mogą [excommunicate|El] innych."
 external_ruler_puppet: "Marionetkowy władca świecki"
 external_ruler_puppet_desc: "[ruler|E], który kieruje się miłością, strachem lub poczuciem zobowiązania. Każ mu realizować [Concept('scheme', 'spiski')|E] i wykorzystaj jego [realm|El] na potrzeby własnego."
 # Religious - PAM (additions)
 puppet_action_description_puppet_action_request_ecclesiastical_title_split: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_split_interaction')]#!”, aby złożyć petycję do [Concept('head_of_faith', 'głowy wiary')|E] o wydzielenie nowego [Concept('clerical_title', 'tytułu duchownego')|E] z istniejącego [Concept('clerical_region', 'regionu duchownego')|E]"
 puppet_action_description_puppet_action_demand_church_succession_hof: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('demand_church_succession_religious_head_interaction')]#!” jako [head_of_faith|El], aby obiecać główny [title|El] [rulerpossessive|El] wyznającego tę samą [Concept('faith', 'wiarę')|E] jako spuściznę zastępczą"
 puppet_action_description_puppet_action_give_cardinal_order: "Aby zastosować regionalne [modifiers|El] w [Concept('baronies', 'baroniach')|E] tej osoby, użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('give_cardinal_order_interaction')]#!”"
 puppet_action_description_puppet_action_appoint_cardinal: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('appoint_cardinal_interaction')]#!”, aby wywyższyć członka [Concept('clergy', 'duchowieństwa')|E] wyznającego tę samą [Concept('faith', 'wiarę')|E] do rangi [Concept('cardinal', 'kardynała')|E]"
 puppet_action_description_puppet_action_destroy_cardinalate: "Aby rozwiązać [Concept('cardinalate', 'diecezję kardynalską')|E] i usunąć jej posiadacza z [Concept('college_of_cardinals', 'Kolegium Kardynalskiego')|E], użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('destroy_cardinalate_interaction')]#!”"
 puppet_action_description_puppet_action_ecclesiastic_grant_claim: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('ecclesiastic_grant_claim_interaction')]#!”, aby zyskać [pressed_claim|El] do [Concept('title', 'tytułu')|E] [rulerpossessive|El] wyznającego tę samą [Concept('faith', 'wiarę')|E]"
 puppet_action_description_puppet_action_sway_ruler_to_my_rite: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('sway_ruler_to_my_rite_interaction')]#!”, aby zdobyć przychylność [Concept('ruler', 'władcy')|E] wyznającego tę samą [Concept('faith', 'wiarę')|E]"
 # Religious
 puppet_action_description_puppet_action_demand_conversion: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('demand_conversion_interaction')]#!”, aby zmusić [Concept('ruler', 'władcę')|E] z tego samego [Concept('house', 'rodu')|E] do przyjęcia twojej [Concept('faith', 'wiary')|E]"
 puppet_action_description_puppet_action_demand_conversion_vassal_ruler: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('demand_conversion_vassal_ruler_interaction')]#!”, aby zmusić [Concept('vassal', 'wasala')|E] lub [Concept('tributary', 'trybutariusza')|E] do przyjęcia twojej [Concept('faith', 'wiary')|E]"
 puppet_action_description_puppet_action_request_clerical_chastity: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('request_clerical_chastity_interaction')]#!”, aby zmusić dorosłą osobę wyznającą tę samą wiarę do złożenia ślubów duchownych"
 puppet_action_description_puppet_action_take_vows: "Użyj [Concept('interaction', 'interakcji')|E] „#V [GetPlayer.GetPlayerInteractionName('take_vows_interaction')]#!”, aby nakazać [Concept('courtier', 'dworzaninowi')|E] dołączenie do duchowieństwa"
