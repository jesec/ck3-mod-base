 pam_interactions_events.0120.opening: "Do osoby znanej jako [recipient.GetFirstName], ikony religii o nazwie [recipient.GetFaith.GetReligion.GetName|l]."
 pam_interactions_events.0120.desc_religious_head_actor: "Odkąd siła, która nas stworzyła – [recipient.GetFaith.CreatorName] – zdecydowała, że powstaną [recipient.GetWomenMen], nie istniała osoba, która dorównałaby ci jako [recipient.GetTitleAsName]. Przywilejem jest dla mnie wykonywanie Twych rozkazów.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "Nie mogę prowadzić wiernych w pojedynkę. Nawet pierwsze z dzieci [recipient.GetFaith.HighGodNamePossessive], [recipient.GetTitleAsName], musi przestrzegać reguł tego świata. Jako [actor.GetTitleAsName] możesz liczyć, że pomogę Ci i okażę posłuszeństwo.\n\n"
 pam_interactions_events.0120.desc: "Obdarzono mnie łaską, gdyż mam za zadanie przewodzić duszom zarówno w imieniu [recipient.GetFaith.HighGodNamePossessive], jak i… w Twoim? Zrobię wszystko, co będzie w mojej mocy.\n\n"
 pam_interactions_events.0120.desc_lunacy: "Lękam się bowiem, że moja dusza umiera… i tylko Twoje doradztwo niesie mi jakąkolwiek pociechę…\n\n"
 pam_interactions_events.0120.desc_dread: "Zniszczmy tych, których zniszczyć trzeba: ludzi opuszczonych przez [recipient.GetFaith.HighGodNamePossessive]… ponieważ ja dla [recipient.GetFaith.HighGodNamePossessive] już nie istnieję.\n\n"
 pam_interactions_events.0120.desc_piety: "Otrzymaliśmy bowiem świętą misję z woli [recipient.GetFaith.HighGodNamePossessive]!\n\n"
 pam_interactions_events.0120.desc_friendly: "Miłość, której ogniskiem jesteś Ty – [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] – i pełne zaufanie, poprowadzą mnie wobec nadchodzących wydarzeń.\n\n"
 pam_interactions_events.0120.desc_skill: "Wierzę, że dzięki Twojej mądrej radzie przyczynię się do wielkich rzeczy.\n\n"
 pam_interactions_events.0120.outro: "Które z Twych modlitw powinny zostać usłyszane?"
 pam_interactions_events.0120.a: "Wszystkie, jeśli [recipient.GetTitleAsNameNoTooltip] pyta."
 pam_interactions_events.0121.opening: "Do czcigodnej osoby, którą jest [ROOT.Char.GetTitleAsName]."
 pam_interactions_events.0121.desc_honor: "Niniejszym zrzekam się dumy jako [recipient.GetTitleAsName] miejsca o nazwie [recipient.GetPrimaryTitle.GetNameNoTier] i przysięgam sumiennie słuchać, co radzisz.\n\n"
 pam_interactions_events.0121.desc: "[recipient.GetTitleAsName] z miejsca znanego jako [recipient.GetPrimaryTitle.GetNameNoTier] odegra swoją rolę w Twojej grze o władzę i pomoże Ci wpływać na sprawy tego świata doczesnego.\n\n"
 pam_interactions_events.0121.desc_lunacy: "Jest tak, jak twierdzisz: na moim dworze roi się od plotkarzy i kłamców. Moje sny wypełnia mrok. Tylko Twoje słowa mają dla mnie sens. Tylko Twoje lekarstwo może mnie uleczyć…\n\n"
 pam_interactions_events.0121.desc_dread: "Jestem bronią w Twojej dłoni. Bez wątpliwości. Bez skrupułów.\n\n"
 pam_interactions_events.0121.desc_piety: "Uwolnij mnie od wątpliwości i pokaż, jak mogę zasłużyć na miłość [recipient.GetFaith.HighGodNamePossessive]!\n\n"
 pam_interactions_events.0121.desc_friendly: "Masz moje pełne zaufanie jako [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))]. Przysięgam, że Cię nie zawiodę.\n\n"
 pam_interactions_events.0121.desc_skill: "Wierzę, że uważnie pilnując spraw w moim państwie, nie pozwolisz mi upaść.\n\n"
 pam_interactions_events.0121.outro: "Będziemy realizować Twoje plany."
 pam_interactions_events.0121.a: "Choć rządzi jako [recipient.GetTitleAsNameNoTooltip], [recipient.Custom('PL_jego_jej')] namiestnikiem jest kościół."
