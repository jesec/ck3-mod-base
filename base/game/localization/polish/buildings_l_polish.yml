 building_type_zigong_mines_01: "Studnie solne w Ziliujing i Gongjing"
 building_type_zigong_mines_01_desc: "Dzięki swoim wyjątkowym walorom dla wydobycia obszar ten już od czasów panującej tysiące lat temu dynastii Shangów był miejscem pozyskiwania soli z głębi ziemi. Obecnie jest istotnym filarem regionalnej gospodarki i pozostanie nim w dającej się przewidzieć przyszłości."
