 building_type_lantian_mines_01: "Kopalnie jadeitu w Lantian"
 building_type_lantian_mines_01_desc: "Wzgórza Lantian od tysiącleci stanowią źródło wysokiej jakości jadeitu. Ten jasny kamień, na przestrzeni wieków umieszczany w pieczęciach cesarskich i wychwalany przez poetów dynastii Tang, ceniony jest nie z powodu jego obfitych złóż, lecz za charakterystyczne piękno i prestiż."
