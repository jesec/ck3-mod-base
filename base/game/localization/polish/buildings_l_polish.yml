 building_type_al_azhar_university: "Uniwersytet Al-Azhar"
 building_type_al_azhar_university_desc: "$building_type_generic_university_desc$\n\nUniwersytet Al-Azhar został nazwany na cześć Fatimy, córki Mahometa, która często była nazywana „al-Zahra” (Błyszcząca/Źródło światła)."
