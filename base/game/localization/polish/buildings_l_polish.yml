 building_type_pansjhir_mines_01_desc: "Dolina Pandższiru jest znanym źródłem srebra i szmaragdów od czasów Aleksandra Wielkiego. Hinduskie, buddyjskie i ostatecznie muzułmańskie dynastie wydobywały tu srebro i biły swoje monety."
