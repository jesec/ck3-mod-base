 building_type_sankore_university: "Uniwersytet Sankore"
 building_type_sankore_university_desc: "$building_type_generic_university_desc$\n\nUniwersytet w Sankoré, który postał jako meczet, a później przekształcił się w centrum nauki po skompletowaniu mnóstwa książek od podróżujących kupców."
 sankore_university: "$building_type_sankore_university$"
 sankore_university_desc: "$building_type_sankore_university_desc$"
 building_type_siena_university: "Uniwersytet w Sienie"
 building_type_siena_university_desc: "$building_type_generic_university_desc$\n\nUniwersytet Sieneński i służący w nim mistrzowie są w całości finansowani z podatków z samej Sieny, a dokładniej z podatku nakładanego na tych, którzy wynajmują pokoje studentom."
 siena_university: "$building_type_siena_university$"
 siena_university_desc: "$building_type_siena_university_desc$"
 building_type_nalanda_university: "Uniwersytet w Nalandzie"
 building_type_nalanda_university_desc: "$building_type_generic_university_desc$\n\nUniwersytet Nalanda jest ważną siedzibą stypendystów wedyjskich i przyciąga studentów z miejsc tak odległych jak Tybet i Chiny."
