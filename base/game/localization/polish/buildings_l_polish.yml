 building_type_capital_bureau_01: "Magistrat stołeczny"
 building_type_capital_bureau_01_desc: "Specjalnie wyznaczony sektor rządu, który przeznacza wszystkie zasoby na zarządzanie stolicą. Pracuje tu wielu urzędników i żołnierzy gotowych do działania na każde wezwanie eparcha."
 building_capital_bureau_01: "Gmach sądu"
 building_capital_bureau_01_desc: "Miasto prosperuje tylko dzięki prawu – a to utrzymuje w mocy sąd."
 building_capital_bureau_02: "Instytut bezpieczeństwa"
 building_capital_bureau_02_desc: "W tym instytucie urzędują pokaźne oddziały policyjne, które zajmują się aresztowaniem osób łamiących prawo i ochroną miasta przed przestępczością."
 building_capital_bureau_03: "Komenda główna straży pożarnej"
 building_capital_bureau_03_desc: "Każdy gęsto zaludniony obszar boryka się z ryzykiem wybuchu pożaru. Restrykcyjnie wyszkolony zespół strażaków ugasi ogień, zanim ten zdąży się rozprzestrzenić."
 building_capital_bureau_04: "Administracja gildyjna"
 building_capital_bureau_04_desc: "Dzięki wyznaczeniu urzędników do ich nadzorowania liczne gildie tego miasta będą działać wydajnie i z naciskiem na jakość, przestrzegając przy tym wszystkich wymaganych procedur."
 building_capital_bureau_05: "Departament sądowniczy"
 building_capital_bureau_05_desc: "Rozbudowany departament do spraw sądownictwa to jednostka niezbędna w każdej rozwijającej się metropolii. Cały oddział urzędników, sekretarzy i sędziów bez najmniejszego wysiłku egzekwuje prawo i pilnuje porządku."
 building_capital_bureau_06: "Miejski zakład karny"
 building_capital_bureau_06_desc: "W mieście funkcjonuje wprawdzie wiele pomniejszych zakładów karnych, ale jednostka solidnych rozmiarów da nam gwarancję, że każdy, kto złamie prawo, trafi do celi."
 building_capital_bureau_07: "Kolegium handlowe"
 building_capital_bureau_07_desc: "Handel to biznes zbyt lukratywny, by nie objąć go ściślejszymi regulacjami prawnymi. Kontrolując myto i przywożone do miasta towary, możemy skuteczniej zarządzać zaopatrzeniem stolicy – a potencjalnie nawet na tym zarobić."
 building_capital_bureau_08: "Pałac miejski"
 building_capital_bureau_08_desc: "Pałac miejski to potężnych rozmiarów rezydencja, która swoim majestatem i spektakularnym pięknem przyćmiewa niemal każdy inny pałac. Zamieszkujący ją główny administrator może być bliżej obywateli – przez cały czas dostępny na wyciągnięcie ręki. Jednak choć miasto nigdy nie zapada w prawdziwy sen, o administratorze bez wątpienia nie można powiedzieć tego samego."
 capital_bureau_custom_effect_desc: "#low Odblokowuje:#!\nZwiększenie [Concept('aptitude', 'kompetencji')|E] następującego [Concept('court_position', 'urzędu dworskiego')|E]: [GetCourtPositionType('eparch_court_position').GetName()|l]"
 #ACH
 building_type_oath_warriors_building_01: "Wojskowe darowizny"
 building_type_oath_warriors_building_01_desc: "Suweren tych ziem złożył przysięgę koronacyjną, że będzie dbał o wojowników."
 oath_warriors_building_01: "Małe gospodarstwa weteranów"
 oath_warriors_building_01_desc: "Arystokratyczni wojownicy z długim stażem otrzymali w hojnym darze lokalne działki, co wpłynęło na wzrost zainteresowania lojalną służbą."
 oath_warriors_building_02: "Posiadłości wojowników"
 oath_warriors_building_02_desc: "Ci z arystokratycznej klasy wojowników, którzy nie zginęli na polu bitwy, żyją wygodnie, a dzięki otrzymanym ziemiom mogą werbować wojów i stosownie się dozbrajać."
 oath_warriors_building_03: "Wiejskie lenna"
 oath_warriors_building_03_desc: "Wiele okolicznych wiosek przekazuje się oficerom rycerskim w formie prywatnych posiadłości, co pozwala im gromadzić siłę i bogactwo kosztem innych klas."
 oath_warriors_building_04: "Ogromne posiadłości wojowników"
 oath_warriors_building_04_desc: "Znaczna część lokalnych podatków trafia do pomniejszych arystokratycznych wojowników, posiadaczy zarówno tytułów ziemskich, jak i osadniczych. Ich potężne świty wciąż są oddane służbie."
 building_type_oath_faithful_building_01: "Religijne monumenty"
 building_type_oath_faithful_building_01_desc: "Suweren tych ziem złożył przysięgę koronacyjną, że będzie dbał o wiernych."
 oath_faithful_building_01: "Przydrożne kapliczki"
 oath_faithful_building_01_desc: "Przy drogach znaleźć można niewielkie schronienia, w których przechowywane są proste święte ikony."
 oath_faithful_building_02: "Święte bramy"
 oath_faithful_building_02_desc: "Nad wejściami do osady i w jej obrębie znajdują się misterne dzieła sztuki o charakterze religijnym, które budzą podziw i stanowią obietnicę bezpiecznego pobytu."
 oath_faithful_building_03: "Świątynne azyle"
 oath_faithful_building_03_desc: "Miejscowe kompleksy świątynne rozbudowano o ukryte pod łukowatymi sklepieniami ogrody – spokojne miejsca, w których znajdują się studnie z wodą pitną."
 oath_faithful_building_04: "Monumentalne place"
 oath_faithful_building_04_desc: "Dużo zainwestowano w ogromne centralne place, które obfitują w dzieła sztuki religijnej, są wolne od śmieci i lichwy oraz zaopatrują miejscową ludność w wodę."
 building_type_oath_poor_building_01: "Państwowe przytułki"
 building_type_oath_poor_building_01_desc: "Suweren tych ziem złożył przysięgę koronacyjną, że będzie dbał o biednych."
 oath_poor_building_01: "Charytatywne zwyczaje"
 oath_poor_building_01_desc: "Władze zachęcają osoby zamożne do oddawania nadwyżek żywności i dóbr uboższym, szczególnie w dni świąteczne."
 oath_poor_building_02: "Domy dla ubogich"
 oath_poor_building_02_desc: "Nędzarzom, wdowom i starcom zapewnia się podstawowe wyżywienie i opiekę w skromnych kwaterach."
 oath_poor_building_03: "Dobroczynne ministerstwa"
 oath_poor_building_03_desc: "Dobrze sytuowani ministrowie zapewniają biedocie przytułki i inne niezbędne zasoby."
 oath_poor_building_04: "Instytucje charytatywne"
 oath_poor_building_04_desc: "W całym kraju dba się o potrzebujących. Gustowne komnaty zapewniają schronienie potencjalnym włóczęgom, szpitale opiekują się chorymi i starszymi, a biedni chłopi otrzymują hojne dodatki."
