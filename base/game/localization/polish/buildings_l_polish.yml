 building_type_allaq_mines_01: "Kopalnie w Wadi al-Allaki"
 building_type_allaq_mines_01_desc: "Góry wschodniej pustyni egipskiej, znane kronikarzom po prostu jako kraina kopalń, kryją głębokie złoża złota. Głównym ośrodkiem tego regionu jest Wadi al-Allaki i jego kopalnie."
