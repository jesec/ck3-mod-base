 building_type_hpakant_mines_01: "Kopalnie jadeitu w Hpakant"
 building_type_hpakant_mines_01_desc: "Żyły jasnego jadeitu migoczą głęboko pod zalesionymi wzgórzami wśród wijących się rzek i wapiennych grzbietów. Przez wiele lat złoża te były ukryte przed przechodniami i zagranicznymi handlarzami, dostarczając miejscowym liczne głazy tego cennego zielonego kamienia."
