 building_type_chihu_mines_01_desc: "Kopalnie w Chihu działają od czasów trzech królestw, gdy Wu wytwarzało tu broń. Bogate złoża żelaza i miedzi sprawiają, że kopalnie te pozostają głównym źródłem surowca wykorzystywanego do produkcji uzbrojenia i bicia monet."
