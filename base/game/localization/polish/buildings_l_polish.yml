 nishapur_mines_02: "Kopalnia w Niszapurze"
 nishapur_mines_02_desc: "Kopalnie zostały rozbudowane – sprowadzono inżynierów, aby mogli skutecznie zwiększyć wydobycie turkusu."
 nishapur_mines_03: "Wielka kopalnia w Niszapurze"
 nishapur_mines_03_desc: "Wokół licznych kopalni powstała wioska, a robotnicy regularnie znajdują wysokiej jakości turkusy."
 nishapur_mines_04: "Kompleks górniczy w Niszapurze"
 nishapur_mines_04_desc: "Wydobycie turkusu osiągnęło skalę niemal przemysłową, zaś pracowników liczy się już w tysiącach. Wydaje się, że z kopalni wypływają nieskończone bogactwa."
 building_type_verespatak_mines_01: "Kopalnie w Verespataku"
 building_type_verespatak_mines_01_desc: "W Transylwanii wydobywano złoto jeszcze przed nastaniem dominacji rzymskiej. Mimo upływu czasu kopalnia pozostaje gotowa do dalszej eksploatacji."
