 building_type_taghaza_mines_01: "Solnisko w Taghazie"
 building_type_taghaza_mines_01_desc: "Kopalnie soli w Taghazie są miejscem pochodzenia większości soli z Maghrebu i Afryki Zachodniej."
 taghaza_mines_01: "Szyby wydobywcze w Taghazie"
 taghaza_mines_01_desc: "$building_type_taghaza_mines_01_desc$"
 taghaza_mines_02: "Kopalnia w Taghazie"
 taghaza_mines_02_desc: "Wraz z rozwojem osady wydobywa się coraz więcej soli. Napływ kompetentnych inżynierów pozwala na budowę prawdziwej kopalni."
 taghaza_mines_03: "Wielka kopalnia w Taghazie"
 taghaza_mines_03_desc: "Wraz z udoskonaleniem technik wydobywczych rozwijają się również same kopalnie. Budowane są kolejne wejścia i kopane są duże szyby kopalniane, aby umożliwić wydobycie większej ilości soli."
 taghaza_mines_04: "Kompleks górniczy w Taghazie"
 taghaza_mines_04_desc: "Wraz ze wzrostem wydobycia soli następuje wzmożony napływ kupców i rzemieślników z całego świata."
 building_type_ijil_mines_01: "Kopalnie soli w Idżil"
 building_type_ijil_mines_01_desc: "Idżil to jedna z najstarszych kopalni soli w Afryce i pod wieloma względami jeden z pierwszych ośrodków transsaharyjskiej sieci handlowej."
