 building_type_generic_silver_mines_01: "Kopalnie srebra"
 building_type_generic_silver_mines_01_desc: "Kopalnia bogata w srebro, zapewniająca stały dopływ tego cennego kruszcu."
 generic_silver_mines_01: "Osada górnicza wydobywająca srebro"
