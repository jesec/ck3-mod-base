 building_type_fengtian_mines_01: "Kopalnie jadeitu w Fengtian"
 building_type_fengtian_mines_01_desc: "Położone wzdłuż środkowych wzniesień wyspy kopalnie jadeitu w Fengtian ułatwiają handel morski kamieniami szlachetnymi. Ten lśniący zielony jadeit – ceniony przez władze, miejscowych oraz handlarzy z odległych krain – zajmuje szczególne miejsce w dochodach hrabstwa."
