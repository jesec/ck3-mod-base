 building_type_hetian_mines_01: "Kopalnie w Hotanie"
 building_type_hetian_mines_01_desc: "Hotan jest źródłem jadeitu od zarania dziejów. Wydobywany tutaj – zarówno z samej góry, jak i z okolicznych kopalni odkrywkowych czy rzek – biały minerał ceniony jest wyżej niż jakikolwiek inny jadeit; w oczach wielu ma wartość większą nawet od złota czy srebra."
 hetian_mines_01: "Osada górnicza w Hotanie"
 hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
 hetian_mines_02: "Kopalnia w Hotanie"
 hetian_mines_02_desc: "W miarę rozbudowy osady górniczej jadeit wydobywany jest w coraz większych ilościach. Jego sława rośnie, a wraz z nią napływ wykształconych inżynierów i kupców, co z kolei znacznie zwiększa rentowność operacji."
 hetian_mines_03: "Wielka kopalnia w Hotanie"
 hetian_mines_03_desc: "Skala prac górniczych rośnie – podobnie jak rozmiar samych kopalni. Coraz więcej pracowników znajduje zatrudnienie w górnictwie, a karawany podróżujące z miejsc wydobycia jadeitu oraz do nich zmierzające stanowią już stały element krajobrazu."
 hetian_mines_04: "Kompleks górniczy w Hotanie"
 hetian_mines_04_desc: "Z upływem czasu jadeit stał się nie tylko głównym towarem eksportowanym w regionie, ale i źródłem utrzymania wielu rzemieślników. Przy każdej ulicy można znaleźć teraz rozliczne warsztaty i sklepy należące do przemysłu jadeitowego."
 building_type_dushan_mines_01: "Kopalnie w Dushanie"
 building_type_dushan_mines_01_desc: "Jadeit dushański to jeden z czterech głównych rodzajów chińskiego jadeitu; wydobywa się go w Dushanie już od czasów dynastii Han. Tutejszy minerał różni się od innych rodzajów jadeitu bogatszym kolorem, na który nierzadko składa się znacznie większa mieszanina odcieni."
 dushan_mines_01: "Osada górnicza w Dushanie"
