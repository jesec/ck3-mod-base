 building_type_turda_mines_01: "Kopalnie soli w Tordzie"
 building_type_turda_mines_01_desc: "Ogromne masywy solne w Tordzie od wieków odgrywają kluczową rolę w gospodarce Transylwanii. Kopalnie i rynek solny pozostają dużym źródłem dochodu dla regionu."
