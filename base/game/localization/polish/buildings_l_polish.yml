 building_type_ratnapura_mines_01: "Kopalnie w Ratnapurze"
 building_type_ratnapura_mines_01_desc: "Ratnapura, zwana miastem klejnotów, jest jednym z głównych źródeł rubinów i szafirów na świecie. Od stuleci bogactwa te są wydobywane i sprzedawane kupcom z subkontynentu indyjskiego, Azji Południowo-Wschodniej i Chin."
 ratnapura_mines_01: "Szyby wydobywcze w Ratnapurze"
 ratnapura_mines_01_desc: "$building_type_ratnapura_mines_01_desc$"
 ratnapura_mines_02: "Kopalnia w Ratnapurze"
 ratnapura_mines_02_desc: "Kopalnie zostały rozbudowane: aby skutecznie zwiększyć wydobycie klejnotów, sprowadzono inżynierów."
 ratnapura_mines_03: "Wielka kopalnia w Ratnapurze"
 ratnapura_mines_03_desc: "Wokół rozlicznych kopalni rozrosła się wioska, a robotnicy regularnie znajdują pokaźne klejnoty."
 ratnapura_mines_04: "Kompleks górniczy w Ratnapurze"
 ratnapura_mines_04_desc: "Wydobycie klejnotów odbywa się już na skalę niemalże przemysłową. Liczba robotników sięga tysięcy, a z kopalń spływają niekończące się bogactwa."
 building_type_mogok_mines_01: "Kopalnie w dolinie Mogok"
 building_type_mogok_mines_01_desc: "Dolina Mogok słynie z rubinów i szafirów, ale też z mniej wartościowych kamieni, takich jak spinel czy granat.\n„Dolinę rubinów” wyróżnia ilość, ale przede wszystkim jakość wydobywanych minerałów: wydobyte z głębi ziemi kamienie barwy głębokiej czerwieni mienią się w promieniach słońca jak żadne inne."
