 building_type_xiuyan_mines_01: "Kopalnie jadeitu w Xiuyan"
 building_type_xiuyan_mines_01_desc: "Ten starożytny kamieniołom już od kilku tysiącleci dostarcza korzystającej z niego społeczności wysokiej jakości jadeit. Dzięki niemu ludność kultury Hongshan odkrywała i mogła zacząć wykorzystywać na co dzień wszelkiego rodzaju wyroby, takie jak bransoletki, narzędzia i artefakty, urozmaicając ich społeczne zastosowania i poprawiając rodzinną reputację."
