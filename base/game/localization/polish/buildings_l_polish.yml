 oath_poor_building_03_tooltip_default: "Co najmniej #V 1#! twoich [Concept('councillors', 'radnych')|E] (obecnie: #P [GetPlayer.MakeScope.ScriptValue('oath_poor_building_03_tooltip_value')|0]#!):\n ma [Concept('trait', 'cechę')|E] [GetTrait('compassionate').GetName(GetNullCharacter)|l] i jest twoim [Concept('vassal', 'wasalem')|E]"
 oath_poor_building_04_tooltip: "Udało ci się wypełnić [Concept('oath', 'przysięgę')|E] „#V Zadbaj o biednych#!”, a ta [barony|El] ma [modifier|El] „[GetModifier('oath_provide_for_the_poor_province').GetNameWithTooltip]”"
 building_type_powder_magazine_01: "Producent prochu strzelniczego"
 building_type_powder_magazine_01_desc: "Proch strzelniczy traci swoje właściwości, gdy nie jest odpowiednio produkowany, przechowywany i konserwowany. Aby rekrutować jednostki korzystające z jego destrukcyjnej mocy – takie jak [GetMaA('handgunners').GetName|l] – należy wznieść specjalnie przeznaczone do tego celu budowle."
 powder_magazine_01: "Magazyn prochu strzelniczego"
 building_powder_magazine_01_desc: "Magazyny, w których proch strzelniczy może być przechowywany bez narażania go na działanie czynników atmosferycznych, co minimalizuje ryzyko wypadków."
 building_powder_magazine_02: "Urząd ds. logistyki prochu strzelniczego"
 building_powder_magazine_02_desc: "Zatrudnienie wykwalifikowanych urzędników do nadzorowania kadry odpowiedzialnej za skomplikowaną logistykę prochu strzelniczego zagwarantuje jego właściwe przechowywanie i bezpieczny transport na terenie państwa, eliminując ryzyko wypadków."
 building_powder_magazine_03: "Kopalnia siarki"
 building_powder_magazine_03_desc: "Siarka występuje w dużych ilościach, lecz jej wydobycie na dużą skalę może stanowić nie lada wyzwanie. Specjalna kopalnia zagwarantuje nieprzerwane dostawy tego cennego surowca."
 building_powder_magazine_04: "Warsztat produkcji saletry"
 building_powder_magazine_04_desc: "Saletra, kluczowy składnik w procesie wytwarzania prochu strzelniczego, wymaga doświadczonych specjalistów oraz kontrolowanego środowiska, aby jej produkcja na dużą skalę mogła przebiegać bezpiecznie i bez ryzyka pożaru całego budynku."
 building_powder_magazine_05: "Magazyny prochu strzelniczego"
 building_powder_magazine_05_desc: "Przechowywanie prochu strzelniczego wymaga specjalnie przeznaczonych do tego celu budowli o wzmocnionych ścianach. Takie magazyny powinny znajdować się w bezpiecznej odległości od miejsc zamieszkałych i cennych."
 building_powder_magazine_06: "Wartownia"
 building_powder_magazine_06_desc: "Proch strzelniczy sam w sobie stanowi zagrożenie, a ryzyko wzrasta, gdy dostanie się w niepowołane ręce. Aby zapewnić jego ochronę przed nieautoryzowanym dostępem, można zatrudnić większą liczbę strażników, którzy skutecznie zabezpieczą go przed ciekawskimi spojrzeniami."
 building_powder_magazine_07: "Warsztat uszlachetniania prochu strzelniczego"
 building_powder_magazine_07_desc: "Oddzielny budynek przeznaczony do łączenia różnych składników w celu produkcji prochu strzelniczego. W razie wypadku jest nadzieja, że szkody nie obejmą całego zakładu."
 building_powder_magazine_08: "Zakład produkcji rusznic"
 building_powder_magazine_08_desc: "Rusznice mogą być zawodne i pękać podczas użytkowania, dlatego konieczne jest zaopatrzenie się w najwyższej jakości sprzęt oraz zatrudnienie najlepiej wykwalifikowanych rzemieślników, aby zapewnić produkcję broni o najwyższym standardzie"
 powder_magazine_1_effect_desc: "$unlocks_building_desc$limit rekrutacji [Concept('men_at_arms', 'zbrojnych')|E] [Concept('gunpowder', 'strzelców')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
 powder_magazine_2_effect_desc: "$unlocks_building_desc$limit rekrutacji [Concept('men_at_arms', 'zbrojnych')|E] [Concept('gunpowder', 'strzelców')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
 powder_magazine_3_effect_desc: "$unlocks_building_desc$limit rekrutacji [Concept('men_at_arms', 'zbrojnych')|E] [Concept('gunpowder', 'strzelców')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 building_type_mandala_capital_01: "Stołeczny kompleks świątynny"
 building_type_mandala_capital_01_desc: "[great_project|E] to nie tylko świątynia. To również świadectwo siły, dokonań i #EMP wielkości#! naszego ludu; symbol panowania i łaskawości potężnego, boskiego dewaradży."
 mandala_capital_01: "Bogato zdobiona świątynia"
 mandala_capital_01_desc: "Ta bogato zdobiona świątynia to skromny początek wielkiego dziedzictwa – miejsce kultu i modlitwy do rządzącego dewaradży."
 mandala_capital_02: "Majestatyczna świątynia"
 mandala_capital_02_desc: "Pierwotny budynek świątyni stołecznej zyskał dodatkowe kapliczki, elementy wyposażenia i dekoracje."
 mandala_capital_03: "Tereny świątynne"
 mandala_capital_03_desc: "Wzbogacona o kolejne kwatery mieszkalne świątynia zmieniła się w rozkwitające życiem tereny.\nObecnie mieści się tu kilka miejsc kultu pod postacią kapliczek, a także schronienie dla czcicieli, służby i duchownych."
 mandala_capital_04: "Wielki kompleks świątynny"
 mandala_capital_04_desc: "Kompleks świątynny rozrósł się do wielkości wioski i jest w dużej mierze samowystarczalny.\nDodanie niewielkiego relikwiarza i sadzawek rozciągających się od wschodu aż po zachód wpłynęło pozytywnie na wrażenie połączenia ze sferą duchową."
 mandala_capital_05: "Boski pałac"
 mandala_capital_05_desc: "Rzadki klejnot architektury – pałac świątynny – został rozbudowany o fantazyjne kwatery boskiego dewaradży.\nZ całego świata napływają podróżni, którzy chcą podziwiać przepych boskiego pałacu ze wszystkimi jego posągami, relikwiami i skarbami."
 building_type_wulingyuan_01: "$wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$wulingyuan_01_desc$"
 wulingyuan_01: "Wulingyuan"
 wulingyuan_01_desc: "Góry te najeżone są tysiącami zachwycających piaskowych filarów górujących nad otoczeniem – i choć to one przykuwają najwięcej uwagi, obszar ten skrywa również ogrom wąwozów, strumieni, małych jezior i jaskiń."
 building_type_leshan_giant_buddha_01: "$leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$leshan_giant_buddha_01_desc$"
 leshan_giant_buddha_01: "Wielki Budda z Leshan"
 leshan_giant_buddha_01_desc: "Wyrzeźbiony w zboczu klifu posąg Buddy zwrócony jest w stronę zbiegu rzek Min i Dadu, gdzie wita strudzonych podróżników."
 building_type_yungang_grottoes_01: "$yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$yungang_grottoes_01_desc$"
 yungang_grottoes_01: "Groty Yungang"
 yungang_grottoes_01_desc: "Potężny kompleks grot świątynnych obejmujący kilkadziesiąt dużych i setki niewielkich jaskiń, w których można podziwiać tysiące posągów Buddy."
 building_type_wudang_mountain_temples_01: "$wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$wudang_mountain_temples_01_desc$"
 wudang_mountain_temples_01: "Świątynie w górach Wudang"
 wudang_mountain_temples_01_desc: "Góry Wudang to jedne z kilku gór uznawanych przez taoistów za święte. Znajduje się w nich wielki kompleks świątynny, który swoją sławę zawdzięcza praktykowanej tam sztuce tai chi."
 building_type_shaolin_monastery_01: "$shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$shaolin_monastery_01_desc$"
 shaolin_monastery_01: "Szaolin"
 shaolin_monastery_01_desc: "Klasztor Szaolin prawdopodobnie najbardziej zasłynął jako kolebka szaolińskiego kung fu – niemal każdy słyszał o biegłości tutejszych mnichów w sztukach walki. Jest to jednak również miejsce zgłębiania wiedzy i tłumaczenia tekstów buddyjskich."
 building_type_lingyin_temple_01: "$lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$lingyin_temple_01_desc$"
 lingyin_temple_01: "Świątynia Lingyin"
 lingyin_temple_01_desc: "Świątynia Lingyin została założona przez indyjskiego mnicha i pielgrzyma w 328 r. n.e. z myślą o szerzeniu nauk buddyjskich. Od tego czasu bardzo się rozrosła: obejmuje kilka pawilonów, mnóstwo grot i pagód oraz dormitoria zdolne pomieścić tysiące mnichów."
 building_type_giant_wild_goose_pagoda_01: "$giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$giant_wild_goose_pagoda_01_desc$"
 giant_wild_goose_pagoda_01: "Wielka Pagoda Dzikich Gęsi"
 giant_wild_goose_pagoda_01_desc: "Wielką Pagodę Dzikich Gęsi wzniesiono w 652 r. n.e. jako miejsce przechowywania i konserwacji tekstów, rzeźb i rozmaitych figur. W późniejszych latach została przebudowana, zyskując imponujące dziesięć pięter, by ostatecznie – wskutek wielokrotnych rekonstrukcji i renowacji – skończyć jako budowla siedmiopiętrowa."
 building_type_kaifeng_palace_01: "$kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$kaifeng_palace_01_desc$"
 kaifeng_palace_01: "Pałac cesarski w Kaifengu"
 kaifeng_palace_01_desc: "Pałac cesarski w Kaifengu wzniesiono, gdy miasto stało się stolicą dynastii Song. Jest siedzibą silnego, wydajnego rządu, który troszczy się o dobrobyt zarówno stolicy, jak i całego państwa."
 kaifeng_examination_cost_bonus_desc: "[GetActivityType('activity_imperial_examination').GetTextIcon] [GetActivityType( 'activity_imperial_examination').GetName] – koszt [Concept('activity', 'aktywności')|E], gdy [Concept('realm_capital', 'stolicą państwa')|E] jest ta [barony|El]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuildingType('kaifeng_palace_01').GetName]"
 building_type_forbidden_city_01: "$forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$forbidden_city_01_desc$"
 forbidden_city_01: "Zakazane Miasto"
 forbidden_city_01_desc: "Zakazane Miasto to ogromny pałac cesarski składający się z blisko tysiąca odrębnych budynków. Cały kompleks otoczony jest wysokim murem i głęboką fosą, które zapewniają ochronę niestrudzenie pracującym za nimi urzędnikom i przedstawicielom rządu."
 building_type_qianling_mausoleum_01: "$qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$qianling_mausoleum_01_desc$"
 qianling_mausoleum_01: "Mauzoleum Qianling"
 qianling_mausoleum_01_desc: "Mauzoleum Qianling to przede wszystkim grobowiec cesarza Gaozonga i cesarzowej Wu Zetian, choć pochowano tu także kilku innych członków rodziny Li. Kurhan otoczony jest prostokątnym murem, a wyróżniające się w krajobrazie kamienne posągi są jedną z najbardziej charakterystycznych cech tego miejsca."
 building_type_quanzhou_seaport_01: "$quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$quanzhou_seaport_01_desc$"
 quanzhou_seaport_01: "Port morski w Quanzhou"
 quanzhou_seaport_01_desc: "Port Quanzhou przyciąga zagranicznych kupców z całego świata. Przybywają oni z Arabii i Anatolii, Japonii i Korei oraz ze wszystkich miejsc po drodze. Ten napływ statków handlowych zapewnia rozkwit lokalnego przemysłu i sprawił, że Quanzhou stało się czołowym producentem statków w regionie."
 building_type_angkor_wat_01: "$angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$angkor_wat_01_desc$"
 angkor_wat_01: "Angkor Wat"
 angkor_wat_01_desc: "Angkor Wat to rozległy kompleks świątynny poświęcony bóstwu Wisznu. Zaprojektowano go na wzór góry Meru, która w mitologii hinduskiej była domem bogów. Kompleks otoczony jest imponującą fosą. W jego skład wchodzi kilka świątyń galeryjnych pełnych sztuki religijnej, rzeźb i płaskorzeźb."
 building_type_citadel_thang_long_01: "Cytadela w Thăng Long" #昇龍
 building_type_citadel_thang_long_01_desc: "$citadel_thang_long_01_desc$"
 citadel_thang_long_01: "Cytadela w Đại La"
 citadel_thang_long_01_desc: "Cytadela będąca bazą wojskową dla lokalnych armii. Jej solidne fortyfikacje ułatwiają odpieranie najeźdźców."
 citadel_thang_long_02: "Cytadela Cesarska w Thăng Long" #昇龍
 citadel_thang_long_02_desc: "Cytadela Cesarska pełni funkcję zarówno twierdzy, jak i rezydencji królewskiej. Na kompleks składają się trzy części: główne fortyfikacje, cesarskie miasto i Zakazane Miasto."
 building_type_po_klong_garai_01: "$po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$po_klong_garai_01_desc$"
 po_klong_garai_01: "Świątynia Po Klon Garai"
 po_klong_garai_01_desc: "Świątynia Po Klong Garai to szczyt architektury Czamów. Podobno powstała na cześć legendarnego króla o tym samym imieniu. Składa się z trzech różnych wież zbudowanych z cegły. Najważniejszym dziełem sztuki, jakie można znaleźć w jej wnętrzu, jest imponująca rzeźba Śiwy."
 building_type_dau_temple_01: "$dau_temple_01$"
 building_type_dau_temple_01_desc: "$dau_temple_01_desc$"
 dau_temple_01: "Świątynia Dâu"
 dau_temple_01_desc: "Czczona świątynia znajdująca się w miejscu o nazwie Luy Lâu, gdzie mnisi z odległych krain zjednoczyli się po raz pierwszy. Ceglana wieża, relikwie i zmumifikowani mistrzowie, którzy tam spoczywają, uosabiają wieki poświęcania się buddyzmowi."
 building_type_liuhe_pagoda_01: "$liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$liuhe_pagoda_01_desc$"
 liuhe_pagoda_01: "Pagoda Liuhe"
 liuhe_pagoda_01_desc: "Wysoka pagoda wzniesiona przez królów, aby uspokoić wzburzoną wodę i uhonorować Buddę. Jej światło rozświetla ziemię, stanowiąc symbol harmonii między człowiekiem i niebem."
 building_type_muaro_jambi_01: "$muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$muaro_jambi_01_desc$"
 muaro_jambi_01: "Kompleks Muaro Jambi"
 muaro_jambi_01_desc: "Położony nad rzeką Batang Hari rozległy ceglany kompleks Muaro Jambi chronił zarówno handel, jak i wiarę. Jako śriwidżajańska twierdza zapewniał schronienie wielu władcom i zmobilizowanym armiom w samym centrum sumatrzańskiej ziemi."
 building_type_hanging_temple_01: "$hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$hanging_temple_01_desc$"
 hanging_temple_01: "Wisząca Świątynia"
 hanging_temple_01_desc: "Wisząca świątynia to klasztor zwisający ze ściany klifu góry Heng. Według legendy jego budowę rozpoczął wieki temu mnich o imieniu Liaoran. W jej drewnianych korytarzach wzniesionych na palach znajdują się kapliczki poświęcone mędrcom – buddystom, taoistom i konfucjanistom – łączące wiary i unoszące się z gracją wbrew prawu grawitacji."
 building_type_pagoda_of_fogong_temple_01: "$pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$pagoda_of_fogong_temple_01_desc$"
 pagoda_of_fogong_temple_01: "Pagoda świątyni Fogong"
 pagoda_of_fogong_temple_01_desc: "Pagoda świątyni Fogong jest wysoka, drewniana i zbudowano ją bez użycia gwoździ. W wysokiej na dziewięć pięter budowli mieszczą się relikty i posągi, a dzięki sprytnemu projektowi uchodzi ona za cud inżynierii i symbol wiary."
 building_type_plain_of_jars_01: "$plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$plain_of_jars_01_desc$"
 plain_of_jars_01: "Równina Dzbanów"
 plain_of_jars_01_desc: "Równina Dzbanów to rozległy płaskowyż pokryty olbrzymimi kamiennymi naczyniami, których przeznaczenie jest owiane tajemnicą. Kiedyś używane podczas starożytnych rytuałów przetrwały jako relikty zapomnianego ludu, wzbudzając podziw i szacunek miejscowych."
 building_type_dieng_plateau_01: "$dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$dieng_plateau_01_desc$"
 dieng_plateau_01: "Płaskowyż Dieng"
 dieng_plateau_01_desc: "Płaskowyż Dieng to spowity mgłą basen wulkaniczny, którego krajobraz dopełniają baseny siarki i ulatniające się gazy. Starożytne świątynie rozsiane po okolicy i obrzędowe legendy wywołują zarówno strach, jak i szacunek. To święte wzgórze, po którym kiedyś błąkały się starożytne dobre i złe bóstwa."
 building_type_mount_apo_01: "$mount_apo_01$"
 building_type_mount_apo_01_desc: "$mount_apo_01_desc$"
 mount_apo_01: "Góra Apo"
 mount_apo_01_desc: "Wznosząca się nad jeziorem Venado góra Apo w językach ludu Lumadów oznacza czczonego starszego. Pełna nazwa brzmi Apo Sandawa, czyli duch świętej góry – zwany inaczej Starszym Sandawą lub Dziadkiem Sandawą. Rytuały poświęcone Apo Sandawie odprawia szaman plemienia, który postrzegany jest jako medium starożytnych duchów."
 building_type_besakih_temple_01: "$besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$besakih_temple_01_desc$"
 besakih_temple_01: "Pura Besakih"
 besakih_temple_01_desc: "Pura Besakih, znana jako Balijska Matka Świątyń, jest najbardziej znaczącym i najświętszym hinduistycznym kompleksem świątynnym wyspy. Znajduje się na zboczach najwyższego balijskiego wulkanu, świętej góry Agung. Jest to religijne i kulturowe serce wyspy, gdzie odbywają się wielkie ceremonie dla wszystkich."
 building_type_gongsanseong_fortress_01: "$gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$gongsanseong_fortress_01_desc$"
 gongsanseong_fortress_01: "Forteca Gongsanseong"
 gongsanseong_fortress_01_desc: "Forteca Gongsanseong znajduje się na szczycie wzgórza rozpościerającego się nad rzeką Geum. Wzniesiono ją jako królewską cytadelę Baekje, a jej rozległe mury i kamienne bramy strzegły zarówno królów, jak i poddanych. To górska twierdza będąca symbolem siły i obrony dynastii."
 building_type_krakatoa_01: "$krakatoa_01$"
 building_type_krakatoa_01_desc: "$krakatoa_01_desc$"
 krakatoa_01: "Krakatoa"
 krakatoa_01_desc: "Krakatoa to imponujący wulkan położony na niewielkim archipelagu tuż przy wybrzeżu."
 building_type_borobudur_01: "$borobudur_01$"
 building_type_borobudur_01_desc: "$borobudur_01_desc$"
 borobudur_01: "Borobudur"
 borobudur_01_desc: "Borobudur to ogromna świątynia buddyjska składająca się z dziewięciu kamiennych tarasów ułożonych piramidalnie. Całość wieńczy centralna kopuła. Świątynię zdobią tysiące płaskorzeźb i setki posągów Buddy."
 building_type_hoshi_ryokan_01: "$hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$hoshi_ryokan_01_desc$"
 hoshi_ryokan_01: "Ryokan Hōshi"
 hoshi_ryokan_01_desc: "Ryokan Hōshi to stara tradycyjna gospoda, a jednocześnie rodzinny biznes. Oferuje podróżnym wytchnienie w drodze, odpoczynek, wyżywienie i dostęp do gorących źródeł."
 building_type_celestial_great_barracks_01: "Imponujące koszary"
 building_type_celestial_great_barracks_01_desc: "Te potężne koszary i twierdza stanowią dla lokalnego gubernatora źródło żołnierzy, którzy wzmacniają jego armię oraz znacznie poprawiają możliwości obronne okolicy. Po rozbudowie obiekt ten przekształca się w samodzielne miasto-twierdzę, z którego odbywa się obrona prowincji, jej zaopatrywanie i zarządzanie nią – zwłaszcza w chwilach, gdy urzędnicy cywilni nie dotrzymują swoich obowiązków."
 celestial_great_barracks_01: "$building_type_celestial_great_barracks_01$"
 building_celestial_great_barracks_01_desc: "Te potężne koszary i twierdza stanowią dla lokalnego gubernatora źródło żołnierzy, którzy wzmacniają jego armię oraz znacznie poprawiają możliwości obronne okolicy."
 celestial_great_barracks_enabled_desc: "[holder.GetShortUINameNotMe] to nie [governor|El] wojskowy"
 celestial_great_barracks_great_project_only_desc: "Można to zbudować tylko poprzez ukończenie [Concept('great_project', 'wspaniałego projektu')|E] „[GetGreatProjectType('construct_great_barracks').GetName|l]”"
 building_type_the_great_wall_01: "$the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$the_great_wall_01_desc$"
 the_great_wall_01: "Wielki Mur"
 the_great_wall_01_desc: "To najstarsza część Wielkiego Muru, w dużej mierze zbudowana przez dynastię Qin. Ząb czasu może nieco nadgryzł kamień, cegłę i zaprawę, ale nadal jest to potężny element fortyfikacji."
 building_type_the_great_wall_02: "$the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$the_great_wall_02_desc$"
 the_great_wall_02: "Wielki Mur"
 the_great_wall_02_desc: "Dynastia Han znacznie rozbudowała istniejące mury wzniesione przez swoich poprzedników. Zrealizowali część bardziej rozległych odcinków rozciągających się przez pustynie i góry na wiele kilometrów."
 building_type_the_great_wall_03: "$the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$the_great_wall_03_desc$"
 the_great_wall_03: "Wielki Mur"
 the_great_wall_03_desc: "Dynastie Wei, Qi i Sui rozbudowały mur w V i VI wieku naszej ery, ulepszając kilka jego odcinków wzmocnionymi fortyfikacjami."
 building_type_the_great_wall_04: "$the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$the_great_wall_04_desc$"
 the_great_wall_04: "Wielki Mur"
 the_great_wall_04_desc: "Najbardziej imponujący wyczyn inżynierii, jakim jest ten gigantyczny mur, od czasu jego powstania w VII wieku p.n.e. był wielokrotnie rozbudowywany. Obecnie rozciąga się na tysiące kilometrów i składa się z licznych wież strażniczych, koszar i posterunków garnizonowych. Z pewnością żaden barbarzyński najeźdźca nie pokona tej potężnej przeszkody."
 building_type_the_great_wall_shanhai_pass: "$the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 the_great_wall_shanhai_pass: "$the_great_wall_04$"
 the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 the_great_wall_liaodong: "$the_great_wall_04$"
 the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 special_building_improve_silk_road: "Gdy ta [special_building|El] zostanie ukończona, [situation_sub_region|El] ([sub_region_temp.GetName]) zbliży się do następującej [Concept('situation_phase', 'fazy sytuacji')|E] na [Concept('silk_road', 'Jedwabnym Szlaku')|E] #weak (o ile już się w niej nie znajduje)#!: [situation_silk_road_phase_exceptional_bounty|El]"
 building_type_herat_bazaar_01: "$herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$herat_bazaar_01_desc$"
 herat_bazaar_01: "Bazar w Heracie"
 herat_bazaar_01_desc: "Tętniące życiem targi w Heracie znane są od czasów starożytnych Achemenidów, kiedy to region ten nazywano #italic Arią#!. Karawany, które codziennie wjeżdżają do miasta i wyjeżdżają z niego, nadają bazarom w Heracie miano Perły Chorasanu."
 herat_bazaar_02: "Rozległy bazar w Heracie"
 herat_bazaar_02_desc: "Na bazarach w Heracie kwitnie handel. Perła Chorasanu lśni piękniej niż najbardziej wypolerowany klejnot zdobiący niejedną koronę."
 building_type_tabriz_bazaar_01: "$tabriz_bazaar_01$"
 building_type_tabriz_bazaar_01_desc: "$tabriz_bazaar_01_desc$"
 tabriz_bazaar_01: "Bazar w Tebrizie"
 tabriz_bazaar_01_desc: "Wiekowy targ w Tebrizie od niepamiętnych czasów jest wielkim centrum handlu. Jego ściany zdobią kolorowe płytki i barwione tynki odzwierciedlające bogactwo i prestiż tego starożytnego targowiska."
 tabriz_bazaar_02: "Rozległy bazar w Tebrizie"
 tabriz_bazaar_02_desc: "Czas w żadnym stopniu nie pozbawił dostojnego i starożytnego targowiska w Tebrizie jego witalności – wręcz przeciwnie, wiekowy bazar wydaje się tętnić życiem bardziej niż kiedykolwiek wcześniej."
 building_type_gurganj_bazaar_01: "$gurganj_bazaar_01$"
 building_type_gurganj_bazaar_01_desc: "$gurganj_bazaar_01_desc$"
 gurganj_bazaar_01: "Bazar w Gurgandżu"
 gurganj_bazaar_01_desc: "Tak zwane Stepowe Wrota – tętniące życiem miasto Gurgandż – słyną z obfitości handlarzy i podróżników, którzy poszukują na granicy bogactwa lub innych zysków."
 gurganj_bazaar_02: "Rozległy bazar w Gurgandżu"
 gurganj_bazaar_02_desc: "W palącym blasku słońca koczownicy, kupcy i poszukiwacze przygód zarabiają na życie i dzielą się plotkami o bogactwach odległych Chin, w zamian przyjmując egzotyczną walutę Huángdìego."
 building_type_lhasa_market_01: "$lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$lhasa_market_01_desc$"
 lhasa_market_01: "Targowisko w Lhasie"
 lhasa_market_01_desc: "Na ważnym skrzyżowaniu dróg łączących Indie z Chinami kupcy z Lhasy tłumnie walczą o uwagę podróżników w cieniu górującego nad wszystkim pałacu Potala."
 lhasa_market_02: "Rozległe targowisko w Lhasie"
 lhasa_market_02_desc: "W blasku słońca nie znajdziesz nic nowego – tak przynajmniej twierdzą kupcy z Lhasy, wierząc, że podczas przemierzania Jedwabnego Szlaku widzieli już wszystkie klejnoty i błyskotki, jakie ma do zaoferowania świat."
 building_type_changan_market_01: "$changan_market_01$"
 building_type_changan_market_01_desc: "$changan_market_01_desc$"
 changan_market_01: "Targowisko w Cháng’ānie"
 changan_market_01_desc: "Na rynkach wielkiego miasta Cháng’ānu, kolebki #EMP wiecznego pokoju#!, odbywa się handel wszelkiego rodzaju. To obowiązkowy przystanek wszystkich handlarzy, którzy zmierzają do Chin lub je opuszczają."
 changan_market_02: "Rozległe targowisko w Cháng’ānie"
 changan_market_02_desc: "Widok najwspanialszych skarbów znanych ludzkości nie zaskakuje zamożnych kupców z Cháng’ānu: wszystkie już widzieli, a niektóre z nich pewnie wręcz znajdują się w ich posiadaniu."
 building_type_dunhuang_market_01: "$dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$dunhuang_market_01_desc$"
 dunhuang_market_01: "Targowisko w Dūnhuángu"
 dunhuang_market_01_desc: "Leżące u połyskujących brzegów rzeki Shule miasto Dūnhuáng stanowi bramę między korytarzem Gansu a Kotliną Kaszgarską, a zarazem najważniejszy przystanek dla wszystkich podróżników przemierzających tę trasę."
 dunhuang_market_02: "Rozległe targowisko w Dūnhuángu"
 dunhuang_market_02_desc: "Wyblakłymi od słońca ulicami Dūnhuángu sennym krokiem maszerują niezliczeni ludzie w towarzystwie obładowanych wielbłądów i mułów – bez chwili wytchnienia, ze wschodu na zachód i w drugą stronę."
 building_type_lahur_bazaar_01: "$lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$lahur_bazaar_01_desc$"
 lahur_bazaar_01: "Bazar w Lahaur"
 lahur_bazaar_01_desc: "Stare miasto Lahaur zostało zbudowane wokół dwóch głównych rynków otoczonych domami, a wszystko to okalał długi mur z błota. To gwarne skupisko rynków tętni życiem, odkąd ktokolwiek pamięta i prawdopodobnie tak pozostanie przez kolejne pokolenia."
 lahur_bazaar_02: "Rozległy bazar w Lahaur"
 lahur_bazaar_02_desc: "Handel w Lahaur odbywa się tak naturalnie, jak naturalnie woda płynie korytem rzeki. Skupisko rynków przepełnione jest towarami, a kupcy zdają się posiadać całą mądrość płynącą z bogatej historii miasta. Widać to po ich bystrych oczach."
 building_type_hamadan_bazaar_01: "Bazar w Hamadanie"
 building_type_hamadan_bazaar_01_desc: "$hamadan_bazaar_01_desc$"
 hamadan_bazaar_01: "Bazar w Hamadanie"
 hamadan_bazaar_01_desc: "Hamadan, serce starożytnego ludu Medów, stanowi centrum handlu od czasów tabliczek glinianych i pisma klinowego. Na straganach głównego bazaru w Hamadanie setki pokoleń kupców sprzedawało swoje towary i trudniło się rzemiosłem."
 hamadan_bazaar_02: "Rozległy bazar w Hamadanie"
 hamadan_bazaar_02_desc: "Wielki bazar w Hamadanie przeżywa swój największy rozkwit, osiągając nowe szczyty bogactwa i aktywności, niespotykane dotąd w jego długiej i znamienitej historii."
 building_type_sunday_bazaar_01: "Bazar niedzielny"
 building_type_sunday_bazaar_01_desc: "$sunday_bazaar_01_desc$"
 sunday_bazaar_01: "Bazar niedzielny"
 sunday_bazaar_01_desc: "Miejscowi powiadają, że jeszcze zanim pojawiły się pieniądze, w Kaszgarze funkcjonował już niedzielny bazar. Spacerując między straganami, z pewnością można to poczuć – nie sposób wyobrazić sobie, że kiedyś tego miejsca mogło nie być."
 sunday_bazaar_02: "Rozległy bazar niedzielny"
 sunday_bazaar_02_desc: "Choć wielki niedzielny bazar w Kaszgarze istnieje od niepamiętnych czasów, rozkwit, jakiego obecnie doznaje, z pewnością na długo zostanie w pamięci."
 building_type_mount_fuji_01: "Fudżi"
 building_type_mount_fuji_01_desc: "Samotny, majestatyczny i spowity śniegiem szczyt Fudżi wyznacza granicę wschodniej Japonii i stanowi charakterystyczny punkt orientacyjny znany na wyspach. Jego imponująca sylwetka przyciąga podróżników i pielgrzymów, oferując chwilę wytchnienia każdemu, kto na niego spojrzy. Fudżi, jedna z najświętszych gór shintō, jest domem #EMP Konohanasakuya-hime#! – bogini wulkanów, kwitnącej wiśni oraz ulotnej delikatności życia."
 mount_fuji_01: "$building_type_mount_fuji_01$"
 mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 building_type_waterworks_01: "Zarządzanie wodą"
 building_type_waterworks_01_desc: "Od wody uzależnione jest całe życie. Silne państwo i niezachwiane rządy wymagają stałego zaopatrzenia w wodę i efektywnego jej wykorzystywania."
 waterworks_01: "Sztuczne stawy"
 building_waterworks_01_desc: "Jeśli chcemy zarządzać wodą, musimy ją najpierw pozyskać. Zwykły dół wyłożony w celu ograniczenia utraty cieczy gliną pozwala gromadzić wodę do późniejszego użytku."
 building_waterworks_02: "Cysterny"
 building_waterworks_02_desc: "Głębsze doły, szczelniejsze zbiorniki i proste zadaszenia umożliwiają dłuższe przechowywanie większych ilości wody i ograniczenie strat spowodowanych zanieczyszczeniami lub parowaniem."
 building_waterworks_03: "Kanały łączące"
 building_waterworks_03_desc: "Wydrążone między zbiornikami kanały znacznie zwiększają dostępność wody. Konstrukcja ogranicza zalania podczas powodzi, kiedy to wody jest w nadmiarze, a w czasie suszy zapewnia jej zapas na potrzeby obywateli, zwierząt gospodarskich i upraw. Odpowiednio rozplanowanymi kanałami łączącymi mogą też pływać lekkie łodzie."
 building_waterworks_04: "Zbiorniki melioracyjne"
 building_waterworks_04_desc: "Dzięki odpowiednio skonstruowanym wałom wszelkie wzgórza, wzniesienia i innego rodzaju nierówności terenu można wykorzystać do przechowywania wody. Po połączeniu kanałami otwarte zbiorniki w razie potrzeby wzajemnie się zasilają, co zapewnia większą kontrolę nad ilością przechowywanej i zużywanej w danym momencie wody."
 building_waterworks_05: "Studnie schodkowe"
 building_waterworks_05_desc: "W zarządzaniu wodą mogą pomóc studnie, które tworzą rozległe podziemne struktury i zapewniają stały dostęp do pewnej ilości wody pochodzącej z ziemi. Konstrukcje głębinowe można łączyć ze śluzami i kanałami na powierzchni, aby w zależności od potrzeb dostarczać więcej wody lub odprowadzać ją do innych obszarów."
 building_waterworks_06: "Śluzy kanałowe"
 building_waterworks_06_desc: "Głębokość kanału można kontrolować za pomocą śluz i odpływów. Woda zgromadzona za śluzami pozwala na tworzenie doskonale sprawdzających się jako drogi transportowe, funkcjonalnych kanałów żeglugowych dla barek i niewielkich statków."
 building_waterworks_07: "Sztuczne jeziora"
 building_waterworks_07_desc: "Ogromny zbiornik oznacza ogromną ilość przechowywanej wody. Zasilane przez rzeki i kanały sztuczne jeziora mogą zapewnić wodę na potrzeby rozległych pól uprawnych i rozlicznych wiosek. Ich pokaźne rozmiary zwiększają prestiż okolicy, która idealnie sprawdzi się jako miejsce kultu i sprawowania władzy."
 building_waterworks_08: "Systemy zaopatrzenia w wodę i odprowadzania ścieków"
 building_waterworks_08_desc: "Dzięki rurom i pompom woda płynie zarówno w górę, jak i w dół, docierając nawet do najwyższych wież i spychając nieczystości do odległych kloak. Wszędzie jest jej pod dostatkiem, a nadmiar zawsze można odprowadzić, zanim doprowadzi do niebezpiecznej powodzi."
 building_type_spice_plantation_01: "Plantacje roślin przyprawowych"
 building_type_spice_plantation_01_desc: "Najbardziej wyrafinowane smaki i zapachy pozyskuje się dzięki roślinom, które można znaleźć jedynie w pewnych częściach świata. Ich ekskluzywność i jakość czynią z produkcji takich przypraw wyjątkowo dochodowy biznes – o ile pozwala na nią gleba."
 building_spice_plantation_01: "Zbieranie przypraw"
 building_spice_plantation_01_desc: "Źródłem przypraw jest natura, a uściślając – niektóre drzewa, krzewy i kwiaty. Cały sekret polega na tym, by najpierw te rośliny #italic znaleźć#!."
 building_spice_plantation_02: "Ogrody przyprawowe"
 building_spice_plantation_02_desc: "Jeśli tylko włoży się w to odpowiednio dużo pracy, najbardziej pożądane przyprawy można pozyskać dzięki uprawie roślin – w odpowiednich warunkach i pod nadzorem właściwych specjalistów."
 building_spice_plantation_03: "Sady przyprawowe"
 building_spice_plantation_03_desc: "Zasadzenie roślin na dużym obszarze zgodnie z zasadami geometrii rok za rokiem umożliwia pozyskiwanie przewidzianej ilości przypraw."
 building_spice_plantation_04: "Suszarnie przypraw"
 building_spice_plantation_04_desc: "Wyznaczenie w pobliżu upraw przestrzeni do suszenia przypraw przed transportem pozwala na przetworzenie i uratowanie przed zepsuciem większych ilości zbiorów – a to oznacza mniejsze ogólne koszty produkcyjne."
 building_spice_plantation_05: "Młyny przyprawowe"
 building_spice_plantation_05_desc: "Choć zmielone przyprawy łatwiej się psują, ich przechowywanie jest bardziej wydajne. Młyny mogą jednak pomóc nie tylko w mieleniu, ale i w odsiewie zanieczyszczeń, zwiększając jakość gotowego produktu."
 building_spice_plantation_06: "Majątki przemysłu przyprawowego"
 building_spice_plantation_06_desc: "Budowa kwater pracowników oraz punktów przetwórczych i magazynów w pobliżu terenów uprawnych znacznie zwiększa wydajność produkcji i sprzedaży przypraw przy jednoczesnym ograniczeniu ponoszonych kosztów."
 building_spice_plantation_07: "Zarządzanie obszarami plantacji"
 building_spice_plantation_07_desc: "Nowe tereny pod uprawę można uzyskać poprzez modyfikacje krajobrazu w postaci tarasów i kanałów."
 building_spice_plantation_08: "Produkcja przypraw na skalę przemysłową"
 building_spice_plantation_08_desc: "Odpowiednio zarządzany obszar może w całości posłużyć do produkcji przypraw gwarantujących największy zysk. Każde zasadzone drzewo, każdy wyhodowany krzew, każdy zebrany liść i każdy wysuszony orzech to kolejna moneta, która trafia do kasy."
 building_type_examination_hall_01: "Sala egzaminacyjna"
 building_type_examination_hall_01_desc: "Nie da się przeprowadzić egzaminu cesarskiego bez miejsca na jego realizację. Miejscowy gubernator musi zapewnić egzaminatorom wszelkie niezbędne do należytego przeprowadzania egzaminów zasoby, a osobom zdającym – wymagane wsparcie, dokładając przy tym starań, by ograniczyć możliwość oszukiwania."
 examination_hall_01: "$building_type_examination_hall_01$"
 building_examination_hall_01_desc: "Aby sprawdzić kwalifikacje kandydatów na stanowiska rządowe, trzeba dysponować miejscem, w którym taki sprawdzian można przeprowadzić. Sala egzaminacyjna to absolutne minimum – i zaledwie początek."
 examination_hall_02: "$building_type_examination_hall_01$ II"
 building_examination_hall_02_desc: "Krótka modlitwa przed testem może dać człowiekowi więcej pewności siebie niż choćby i najbardziej intensywne przygotowania."
 examination_hall_03: "$building_type_examination_hall_01$ III"
 building_examination_hall_03_desc: "Kompleks obejmujący sale wykładowe, przestrzenie egzaminacyjne, biura dla kadry akademickiej i pomieszczenia magazynowe. Zapewnia wszystko, czego potrzeba do realizacji poszczególnych etapów egzaminu cesarskiego z maksymalną efektywnością i na najwyższym poziomie."
 examination_hall_04: "$building_type_examination_hall_01$ IV"
 examination_hall_05: "$building_type_examination_hall_01$ V"
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "Zmniejszony koszt za zorganizowanie [activities|El] takich jak [GetActivityType('activity_imperial_examination').GetTextIcon] [GetActivityType('activity_imperial_examination').GetName|l] i [GetActivityType('activity_local_examination').GetTextIcon] [GetActivityType('activity_local_examination').GetName|l] w tej [Concept('holding', 'posiadłości')|E]: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "W tym miejscu znajduje się sala egzaminacyjna"
 building_can_benefit_requirements: "#S Jeśli spełniasz wymagania:#!\n"
 rebuilding_grants_full_benefits: "#S Po [Concept('rebuilding', 'odbudowie')|E]:#!\n"
 building_requirements_header: "#S Wymagania:#!\n"
 building_fallback: "#S Jeśli nie spełniasz wymagań:#!\n"
 building_effects_header: "#S Efekty:#!\n"
 building_type_citadel_shrine_01: "Kapliczka w cytadeli"
 building_type_citadel_shrine_01_desc: "$building_type_temple_citadel_01$ nie jest kompletna, jeśli nie ma w niej miejsca, w którym można oddawać cześć panteonowi. Zarówno zwykli obywatele, jak i wojska stacjonujące w garnizonie znajdą ukojenie w świętej atmosferze emanującej z jej murów."
 building_citadel_shrine_01: "Prasada"
 building_citadel_shrine_01_desc: "Prasada wieńczy cytadelę świątynną, majestatycznie kreśląc jej królewską sylwetkę na horyzoncie. Pozwala to wiernym podziwiać sanktuarium z oddali."
 building_citadel_shrine_02: "Prang"
 building_citadel_shrine_02_desc: "Zdobiony misternymi rzeźbami prang wznosi się harmonijnymi kaskadami, potęgując wrażenie majestatycznej wysokości. Jego widok urzeka i koi zmysły. To miejsce duchowego wytchnienia, gdzie modlitwy płyną zarówno w wypowiedzianych słowach, jak i w ciszy kontemplacji."
 building_citadel_shrine_03: "Rzeźby bogów"
 building_citadel_shrine_03_desc: "Kolekcja rzeźb, niezmiennie zapatrzonych w eter, które zdają się kontemplować wieczność, budząc głębokie i złożone emocje w sercach wyznawców."
 building_citadel_shrine_04: "Posągi singha"
 building_citadel_shrine_04_desc: "Szczerząc zęby i świdrując wszystko wokół spojrzeniem, ci przerażający strażnicy przypominający lwy roztaczają aurę błogosławieństwa i ochrony nad bywalcami cytadeli świątynnej."
 building_citadel_shrine_05: "Strażnicy Naga"
 building_citadel_shrine_05_desc: "Siedmiogłowe węże misternie wyrzeźbione w piaskowcu, z kunsztownie wyrytą mandalą na piersi, roztaczają aurę pokoju i dobrobytu nad bywalcami kapliczki."
 building_citadel_shrine_06: "Płaskorzeźby"
 building_citadel_shrine_06_desc: "Ludzie często zatrzymują się, by podziwiać kunsztownie wykonane płaskorzeźby, które nie tylko ukazują dramatyczne sceny bitew, lecz także przedstawiają różne aspekty boskości i mitów o stworzeniu świata."
 building_citadel_shrine_07: "Relikwiarze"
 building_citadel_shrine_07_desc: "$building_type_temple_citadel_01$ to prawdziwa skarbnica niezwykłych posągów i rytualnych artefaktów, oferująca najbogatszą kolekcję religijnych i obrzędowych przedmiotów, jakiej nie znajdzie się nigdzie indziej."
 building_citadel_shrine_08: "Obraz dewaradży"
 building_citadel_shrine_08_desc: "Boska istota, uchwycona w majestatycznej pozie, otwiera się na swoich czcicieli, pozwalając im modlić się i składać hołd, by dostąpić jej błogosławieństwa."
 building_type_sacred_pool_01: "Święty basen"
 building_type_sacred_pool_01_desc: "Tak rozległy zbiornik wodny pełni wiele funkcji, lecz jego prawdziwa wyjątkowość ujawnia się w rytmie pór roku, gdy odbite w nim zjawiska optyczne stają się niemal transcendentne. Baseny te jako źródło zarówno nawodnienia, jak i duchowego wzmocnienia odgrywają kluczową rolę w codziennym życiu ich użytkowników."
 sacred_pool_01: "Lotosowy staw"
 building_sacred_pool_01_desc: "Staw dający ukojenie, urzekający swą spokojną aurą i niepowtarzalnym pięknem, który uchodzi za miejsce niezwykłych wydarzeń duchowych."
 sacred_pool_02: "Święty rezerwuar"
 building_sacred_pool_02_desc: "Stale powiększając swą powierzchnię, święty rezerwuar okazjonalnie odsłania piękno dzikiej przyrody, gdzie flora i fauna harmonijnie współistnieją, inspirując odwiedzających do refleksji nad cyklem życia."
 building_sacred_pool_03: "Zalew"
 building_sacred_pool_03_desc: "Ten niezwykły zbiornik wodny będący świadkiem osobliwych ceremonii i rytuałów niesie w sobie opowieść o rosnącej chwale jego zarządcy."
 building_sacred_pool_04: "Fosa"
 building_sacred_pool_04_desc: "Mieszkańcy tego miejsca kultu czują się teraz bezpieczniej, ponieważ święty basen zapewnia solidne umocnienia, skutecznie chroniące ich przed potencjalnymi zagrożeniami ze strony wrogich sił."
 building_sacred_pool_05: "Niewielki baraj"
 building_sacred_pool_05_desc: "Stado stróżujących lwów czuwa nad barajem, sprawiając, że każdy intruz dwa razy się zastanowi, zanim zakłóci spokój jego wód."
 sacred_pool_06: "Baraj"
 building_sacred_pool_06_desc: "$sacred_pool_06$ majestatycznie rozciągający się ze wschodu na zachód zachwyca swoim widokiem. Misternie wyrzeźbione węże czuwają nad jego brzegami."
 building_sacred_pool_07: "Wielki baraj"
 building_sacred_pool_07_desc: "Misternie rzeźbione posągi, bujna roślinność oraz malownicze krajobrazy stanowią symbole tego majestatycznego zbiornika wodnego, który zapewnia ochłodę i nawodnienie w okresach dokuczliwego upału."
 building_sacred_pool_08: "Święty baraj"
 building_sacred_pool_08_desc: "Podróżni i inni bywalcy często zatrzymują się w zachwycie przed tym imponującym sztucznym zbiornikiem wodnym, którego ogrom sprawia, że drugi brzeg zdaje się niemal niewidoczny. To prawdziwy dowód na boskie pochodzenie tego miejsca."
 building_type_vihara_halls_01: "Wzgórza wihary"
 building_type_vihara_halls_01_desc: "Klasztorny budynek wzniesiony jako schronienie dla mnichów w porze deszczowej stanowi przestrzeń cichej medytacji, modlitwy i wytchnienia. Otwarty plan sal sprzyja duchowemu wzrostowi oraz wzmacnia oddanie zamieszkujących je zakonników."
 vihara_halls_01: "Kapliczka modlitewna"
 building_vihara_halls_01_desc: "Wybudowanie kapliczki modlitewnej zapewnia odwiedzającym przestrzeń do głębokiej kontemplacji i oddawania czci."
 building_vihara_halls_02: "Biblioteka ze świętymi pismami"
 building_vihara_halls_02_desc: "W murach tego ho trai przechowywane są zarówno starożytne, jak i współczesne święte księgi dostępne dla wiernych pragnących zgłębić wiedzę i pogłębić swoje duchowe oświecenie w chwilach zadumy."
 building_vihara_halls_03: "Kolumnady nad kaplicami"
 building_vihara_halls_03_desc: "Nad kaplicami górują majestatyczne kolumnady zdobione misternymi inskrypcjami i religijnymi malowidłami, które mogą podziwiać wierni."
 building_vihara_halls_04: "Mandapa"
 building_vihara_halls_04_desc: "Imponujące rozmiary tej sali kolumnowej czynią ją idealnym miejscem do odprawiania publicznych rytuałów oraz uroczystych ceremonii religijnych."
 building_vihara_halls_05: "Pawilon"
 building_vihara_halls_05_desc: "Pawilon, harmonijnie wkomponowany w otaczającą zieleń, zachwyca swoim pięknem, które dorównuje jedynie jego duchowej aurze."
 building_vihara_halls_06: "Kamienie simy"
 building_vihara_halls_06_desc: "Kamienie graniczne wspomagają strażników wzgórz wihary w precyzyjnym określeniu rozmiarów i granic przestrzeni potrzebnych mnichom do właściwego wykonywania obrzędów religijnych."
 vihara_halls_07: "Dzwonnica"
 building_vihara_halls_07_desc: "Majestatyczna dzwonnica wznosi się ponad wzgórzami wihary, lśniąc w promieniach słońca za dnia i malowniczo majacząc na horyzoncie nocą."
 building_vihara_halls_08: "Wielkie sale"
 building_vihara_halls_08_desc: "Komfort i liczne udogodnienia tych sal przyciągają mnichów z odległych zakątków świata. Odwiedzają oni to miejsce, by umacniać i szerzyć nauki oraz idee. W ten sposób tworzą nieocenioną sieć wymiany wiedzy, promując harmonię wśród pobliskich społeczności."
 building_type_itsukushima_jinja_01: "$itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$itsukushima_jinja_01_desc$"
 itsukushima_jinja_01: "Itsukushima-jinja" #厳島神社
 itsukushima_jinja_01_desc: "Wzniesiony w VI wieku i poświęcony bóstwom shintō – boginiom morza i burz – chram Itsukushima-jinja majestatycznie góruje nad wodą, a jego słynna brama torii zdaje się unosić na spokojnych wodach zatoki Matsushima."
 itsukushima_jinja_02: "$itsukushima_jinja_01$"
 itsukushima_jinja_02_desc: "$itsukushima_jinja_01_desc$"
 building_type_heian_palace_01: "$heian_palace_01$"
 building_type_heian_palace_01_desc: "$heian_palace_01_desc$"
 heian_palace_01: "Pałac w Heian-kyō" #平安宮
 heian_palace_01_desc: "Rozległy kompleks pałacowy wzniesiony przez cesarza Kammu jako serce jego monumentalnego miasta Heian-kyō, znanego jako „stolica pokoju”. Mieści się tu cesarski dwór, rezydencja oraz centralne biura administracyjne Japonii. Jego korytarze tętnią życiem – to miejsca uroczystych ceremonii, politycznych rozgrywek i subtelnych intryg, gdzie dawne arystokratyczne rody rywalizują o władzę i wpływy."
 building_type_ise_jingu_01: "$ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$ise_jingu_01_desc$"
 ise_jingu_01: "Ise-jingū" #伊勢神宮
 ise_jingu_01_desc: "Ise-jingū, chram poświęcony bogini słońca #EMP Amaterasu#!, to jedno z najbardziej czczonych miejsc shintō. W jego świętych wnętrzach przechowywane są cesarskie insygnia rodu Yamato, a nad jego duchowym porządkiem czuwa westalka saigū, wybrana spośród członków cesarskiej dynastii."
 building_type_kofuku_ji_01: "$kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$kofuku_ji_01_desc$"
 kofuku_ji_01: "Świątynia Kōfuku-ji" #興福寺
 kofuku_ji_01_desc: "Wzniesiona w VII wieku świątynia Kōfuku-ji to jedna z Siedmiu Wielkich Świątyń w Narze oraz jeden z najstarszych i najbardziej wpływowych ośrodków buddyjskiej myśli i duchowej potęgi w Japonii."
 building_type_enryaku_ji_01: "$enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$enryaku_ji_01_desc$"
 enryaku_ji_01: "Świątynia Enryaku-ji" #延暦寺
 enryaku_ji_01_desc: "Założona przez $SaichO_$ pod koniec XVIII wieku świątynia Enryaku-ji położona jest na górze Hiei, skąd roztacza się widok na cesarską stolicę Kanmu – Heian-kyō. Stanowi ona ośrodek japońskiego buddyzmu pundarika, znanego również jako tendai."
 building_type_dazaifu_01: "$dazaifu_01$"
 building_type_dazaifu_01_desc: "$dazaifu_01_desc$"
 dazaifu_01: "Urząd Dazaifu" #興福寺
 dazaifu_01_desc: "Dazaifu, administracyjne centrum cesarskiego dworu na odległej Kiusiu, zostało ustanowione w celu nadzorowania obrony wyspy, wspierania handlu zagranicznego oraz przyjmowania zagranicznych dygnitarzy. Objęcie tam urzędu gubernatora często stanowi kluczowy etap kariery dla ambitnych biurokratów."
 building_type_chinjufu_01: "$chinjufu_01$"
 building_type_chinjufu_01_desc: "$chinjufu_01_desc$"
 chinjufu_01: "Dzielnica Chinjufu" #鎮守府
 chinjufu_01_desc: "Chinjufu, dzielnica Tagi, to ufortyfikowane centrum imperialnych działań mających na celu pacyfikację północnej Japonii. Nad jego funkcjonowaniem czuwa specjalny dowódca odpowiedzialny zarówno za obronę regionu, jak i nadzór nad podatkami."
 building_type_hakata_port_01: "$hakata_port_01$"
 building_type_hakata_port_01_desc: "$hakata_port_01_desc$"
 hakata_port_01: "Port Hakata" #博多
 hakata_port_01_desc: "Od najdawniejszych czasów rodu Yamato portowe miasto Hakata położone na północnym wybrzeżu Kiusiu pełni rolę morskiej bramy, będąc tętniącym życiem ośrodkiem handlowym nadzorowanym przez pobliski urząd Dazaifu. To właśnie tutaj kupcy oferują towary z odległych krain, a delegacje dyplomatyczne przybywają, by nawiązywać kontakty z Japonią."
 building_hakata_port_02: "$hakata_port_01$"
 building_hakata_port_02_desc: "$hakata_port_01_desc$"
 building_type_hwangnyongsa_01: "$hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$hwangnyongsa_01_desc$"
 hwangnyongsa_01: "Świątynia Hwangnyong sa" #皇龍寺 (황룡사)
 hwangnyongsa_01_desc: "Wybudowana w VII wieku świątynia Hwangnyong sa, czyli „Klasztor Złotego Smoka”, to imponujący kompleks wzniesiony przez króla Silla – Jinheunga – jako ośrodek nauk buddyjskich i symbol potęgi. Może się pochwalić jedną z najwyższych pagód na świecie."
 building_type_white_deer_grotto_academy_01: "$white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$white_deer_grotto_academy_01_desc$"
 white_deer_grotto_academy_01: "Akademia Groty Białego Jelenia"
 white_deer_grotto_academy_01_desc: "Akademia założona przez pustelnika Li Bo w miejscu, gdzie dziko pasły się białe jelenie, rozkwitała jako centrum neokonfucjanizmu."
 building_type_shigu_academy_01: "$shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$shigu_academy_01_desc$"
 shigu_academy_01: "Akademia Shigu"
 shigu_academy_01_desc: "Ta akademia przyciągała uczonych studiujących klasykę wśród spokojnych wzgórz Hunan. Będąc ośrodkiem poezji i filozofii, przenosiła tradycje dynastii Tang do okresu panowania dynastii Song."
 building_type_culai_academy_01: "$culai_academy_01$"
 building_type_culai_academy_01_desc: "$culai_academy_01_desc$"
 culai_academy_01: "Akademia Culai"
 culai_academy_01_desc: "Uczeni zbudowali akademię wśród szczytów góry Culai, aby w odosobnieniu studiować pisma konfucjańskie. W jej salach rozbrzmiewały debaty na temat harmonizacji natury i rządów."
 building_type_lize_academy_01: "$lize_academy_01$"
 building_type_lize_academy_01_desc: "$lize_academy_01_desc$"
 lize_academy_01: "Akademia Lize"
 lize_academy_01_desc: "Akademia Lize wspierała naukę wśród wód i trzcin Hebei, będąc północnym bastionem konfucjańskiego porządku pośród zmieniających się granic."
 building_type_maoshan_academy_01: "$maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$maoshan_academy_01_desc$"
 maoshan_academy_01: "Akademia Maoshan"
 maoshan_academy_01_desc: "Akademia kształcąca w zakresie rytuałów, medytacji i tekstów sakralnych, pełniąca rolę duchowego kontrapunktu wobec konfucjańskich akademii epoki Song."
 building_type_tiantai_monasteries_01: "$tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc: "$tiantai_monasteries_01_desc$"
 tiantai_monasteries_01: "Klasztory tiantai"
 tiantai_monasteries_01_desc: "Będąc instytucją naukową szkoły tiantai, ta akademia specjalizuje się w nauczaniu filozofii i medytacji."
 building_type_jizu_shan_temples_01: "$jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc: "$jizu_shan_temples_01_desc$"
 jizu_shan_temples_01: "Świątynie góry Jizu"
 jizu_shan_temples_01_desc: "Ten buddyjski kompleks klasztorny w górach służył jako twierdza buddyzmu ezoterycznego. Pielgrzymi porównywali go do Wzgórza Sępów w Indiach."
 building_type_nanhua_temple_01: "$nanhua_temple_01$"
 building_type_nanhua_temple_01_desc: "$nanhua_temple_01_desc$"
 nanhua_temple_01: "Świątynia Nanhua"
 nanhua_temple_01_desc: "Siedziba szóstego patriarchy buddyzmu chan, Huinenga. Pozostaje tętniącym życiem centrum nauk chan."
 building_type_byeokran_port_01: "$byeokran_port_01$"
 building_type_byeokran_port_01_desc: "$byeokran_port_01_desc$"
 byeokran_port_01: "Port Byeok-ran" #碧瀾渡 (벽란도)
 byeokran_port_01_desc: "Port Byeok-ran, usytuowany na zachód od miasta Kaesŏng u ujścia rzeki Rye-sŏng, jest najkrótszą trasą dla zagranicznych towarów oraz podróżnych zmierzających na Półwysep Koreański. Jego strategiczne położenie umożliwia ominięcie północnych granic i trudnych górskich szlaków."
 building_type_sado_mines_01: "$sado_mines_02$" #佐渡金山
 building_type_sado_mines_01_desc: "$sado_mines_01_desc$"
 sado_mines_01: "Szyby wydobywcze złota na wyspie Sado"
 sado_mines_01_desc: "Niewielu mogło przypuszczać, że odległa wyspa Sado, niegdyś miejsce wygnania, skrywa pod swoją powierzchnią ogromne złoża złota, pozostające przez lata tajemnicą."
 sado_mines_02: "Kopalnia złota na Sado"
 sado_mines_02_desc: "Kopalnie zostały rozbudowane i sprowadzono inżynierów, aby mogli skutecznie zwiększyć wydobycie złota."
 sado_mines_03: "Wielka kopalnia złota na Sado"
 sado_mines_03_desc: "Wokół rozlicznych kopalni rozrosła się wioska, a robotnicy regularnie odkrywają nowe żyły złota."
 sado_mines_04: "Kompleks wydobywczy złota na Sado"
 sado_mines_04_desc: "Wydobycie złota odbywa się już na skalę niemalże przemysłową. Liczba robotników sięga tysięcy, a z kopalń spływają niekończące się bogactwa."
 building_type_tada_mines_01: "$tada_mines_02$" #多田銀銅山遺
 building_type_tada_mines_01_desc: "$tada_mines_01_desc$"
 tada_mines_01: "Szyby wydobywcze miedzi Tada"
 tada_mines_01_desc: "Pod wioską Tada ukrytą wśród gór Hokusetsu spoczywają niewyczerpane zasoby metali szlachetnych gotowych do wytopu. Według legendy to właśnie tutaj powstał Wielki Budda z Tōdai-ji."
 tada_mines_02: "Kopalnia miedzi Tada"
 tada_mines_02_desc: "Kopalnie zostały rozbudowane i sprowadzono inżynierów, aby mogli skutecznie zwiększyć wydobycie miedzi."
 tada_mines_03: "Wielka kopalnia miedzi Tada"
 tada_mines_03_desc: "Wokół rozlicznych kopalni rozrosła się wioska, a robotnicy regularnie odkrywają nowe żyły miedzi."
 tada_mines_04: "Kompleks wydobywczy miedzi Tada"
 tada_mines_04_desc: "Wydobycie miedzi odbywa się już na skalę niemalże przemysłową. Liczba robotników sięga tysięcy, a z kopalń spływają niekończące się bogactwa."
 building_type_tsushima_mines_01: "$tsushima_mines_02$" #対馬銀山
 building_type_tsushima_mines_01_desc: "$tsushima_mines_01_desc$"
 tsushima_mines_01: "Szyby wydobywcze srebra na Cuszimie"
 tsushima_mines_01_desc: "Wyspa Cuszima słynie ze swych złóż srebra odkrytych pod koniec VII wieku za panowania cesarza Tenmu. Bogate w galenę ciemne rudy Morza Japońskiego stanowią źródło ogromnych zysków."
 tsushima_mines_02: "Kopalnia srebra na Cuszimie"
 tsushima_mines_02_desc: "Kopalnie zostały rozbudowane i sprowadzono inżynierów, aby mogli skutecznie zwiększyć wydobycie srebra."
 tsushima_mines_03: "Wielka kopalnia srebra na Cuszimie"
 tsushima_mines_03_desc: "Wokół rozlicznych kopalni rozrosła się wioska, a robotnicy regularnie odkrywają nowe żyły srebra."
 tsushima_mines_04: "Kompleks wydobywczy srebra na Cuszimie"
 tsushima_mines_04_desc: "Wydobycie srebra odbywa się już na skalę niemalże przemysłową. Liczba robotników sięga tysięcy, a z kopalń spływają niekończące się bogactwa."
 building_type_koganeyama_mines_01: "$koganeyama_mines_02$"
 building_type_koganeyama_mines_01_desc: "$koganeyama_mines_01_desc$"
 koganeyama_mines_01: "Szyby wydobywcze złota na górze Kinka"
 koganeyama_mines_01_desc: "Wyspa Kinka i związana z nią świątynia Koganeyama kojarzone są z najwcześniejszymi odkryciami złóż złota w Japonii występującego tu w postaci złotego pyłu. Wybudowana przez cesarza Shōmu w VIII wieku świątynia jest poświęcona #EMP Kanayamahiko#!, bogu górnictwa."
 koganeyama_mines_02: "Kopalnia złota na górze Kinka"
 koganeyama_mines_02_desc: "Kopalnie zostały rozbudowane i sprowadzono inżynierów, aby mogli skutecznie zwiększyć wydobycie złota."
 koganeyama_mines_03: "Wielka kopalnia złota na górze Kinka"
 koganeyama_mines_03_desc: "Wokół rozlicznych kopalni rozrosła się wioska, a robotnicy regularnie odkrywają nowe żyły złota."
 koganeyama_mines_04: "Kompleks wydobywczy złota na górze Kinka"
 koganeyama_mines_04_desc: "Wydobycie złota odbywa się już na skalę niemalże przemysłową. Liczba robotników sięga tysięcy, a z kopalń spływają niekończące się bogactwa."
 building_type_mount_baekdu_01: "Góra Pektu"
 building_type_mount_baekdu_01_desc: "Powiadają, że dumny szczyt góry Pektu dał początek wszystkim górom półwyspu koreańskiego, a jego wyżyny są świętym miejscem dla wielu religii i ludów tego regionu."
 mount_baekdu_01: "$building_type_mount_baekdu_01$"
 mount_baekdu_01_desc: "$building_type_mount_baekdu_01_desc$"
 building_type_mozu_tombs: "$mozu_tombs$"
 building_type_mozu_tombs_desc: "$mozu_tombs_desc$"
 mozu_tombs: "Kofuny w Mozu"
 mozu_tombs_desc: "Kopce w kształcie dziurki od klucza w Mozu są podobno miejscem spoczynku dawnych cesarzy. Dla statków w pobliskiej zatoce stanowią charakterystyczny punkt orientacyjny, a także przypomnienie minionych czasów."
 building_type_trosky_castle_01: "$trosky_castle_01$"
 building_type_trosky_castle_01_desc: "$trosky_castle_01_desc$"
 trosky_castle_01: "Zamek Trosky"
 trosky_castle_01_desc: "Zamek Trosky wznosi się pomiędzy dwiema bazaltowymi skałami dawno wygasłego wulkanu. Budowla wzięła swoją nazwę od kształtu skały, przywodzącego na myśl ruiny zawalonej twierdzy."
 building_type_great_project_cathedral_01: "$great_project_cathedral_01$"
 building_type_great_project_cathedral_01_desc: "$great_project_cathedral_01_desc$"
 great_project_cathedral_01: "Wielka katedra romańska"
 great_project_cathedral_01_desc: "Wczesna katedra murowana, siedziba biskupa oraz cel chrześcijańskich pielgrzymek. Pod ciężkimi, półkolistymi łukami i majestatycznymi sklepieniami na wiernych czekają święte relikwie oraz ołtarze.\n\nEfekty dotyczące [Concept('building', 'budowli')|E]: [GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName|l] w [Concept('cathedral_complex', 'kompleksie katedralnym')|E]"
 building_type_great_project_cathedral_under_construction: "Katedra"
 building_great_project_cathedral_under_construction: "Katedra w budowie"
 building_great_project_cathedral_under_construction_desc: "Ta wyrastająca pośród dźwigów kołowych i licznych rusztowań niedokończona konstrukcja z surowego kamienia pewnego dnia ma zostać siedzibą świętego autorytetu."
