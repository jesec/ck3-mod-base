 building_type_watchtowers_1_desc: "Gdy dostrzeżono najeźdźców, na szczycie wieży strażniczej rozpalono ogień – potem kolejny i jeszcze jeden. Wieść o najeździe rozchodziła się szybciej, niż mogłaby na grzbiecie jakiegokolwiek konia."
