 building_type_jiaodong_mines_01_desc: "Półwysep Jiaodong, który w końcu stał się jednym z kluczowych regionów wydobywczych Chin, kryje w sobie olbrzymie zasoby złota wciąż czekające na pełne wykorzystanie."
