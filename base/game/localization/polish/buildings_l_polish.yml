 building_type_zawar_mines_01: "Kopalnie w Zawarze"
 building_type_zawar_mines_01_desc: "Przez tysiące lat kopalnie w Zawarze były bogatym źródłem ołowiu, cynku i srebra. Zawarskie złoża są wyjątkowe nie tylko ze względu na ich obfitość, ale także ze względu na to, że są wyraźnie oddzielone w sposób, który umożliwia ręczne oddzielenie rud od siebie bez bardziej zaawansowanych procesów metalurgicznych."
