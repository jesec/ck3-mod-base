 building_type_itoigawa_mines_01: "Kopalnie jadeitu w Itoigawie"
 building_type_itoigawa_mines_01_desc: "Rzeka Kotakigawa przepływa przez wąwóz u podnóża góry Myojo i obfituje w duże złoża jadeitu. Dostarczają one jednego z najpiękniejszych jadeitów w regionie i poza nim, ciesząc oko intensywną zieloną barwą."
