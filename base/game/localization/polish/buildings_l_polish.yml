 building_type_bathhouses_1_desc: "Piece pod podłogami tych łaźni utrzymują wysoką temperaturę wody przez cały dzień. Dla wielu mieszkańców miasta wizyta w tym miejscu to jedyna godzina odpoczynku w tygodniu."
