 building_type_generic_gold_mines_01: "Kopalnie złota"
 building_type_generic_gold_mines_01_desc: "Niezwykle cenna i rzadka kopalnia złota – ważny cel każdego szlachcica w regionie."
 generic_gold_mines_01: "Osada górnicza wydobywająca złoto"
 generic_gold_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_gold_mines_02: "Kopalnia złota"
