 building_type_wieliczka_mines_01: "Kopalnia soli w Wieliczce"
 building_type_wieliczka_mines_01_desc: "Ogromne złoża soli na tym obszarze mogą zaopatrzyć cały region. Wydobycie soli zapewni mu dostatek na pokolenia."
