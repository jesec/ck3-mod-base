 virility_badge_name_1: "Niezawodna przypinka z miejsca o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 virility_badge_name_2: "Błogosławiona błyskotka z miejsca o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 wisdom_badge_name_1: "Osłonięta przypinka z miejsca o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 wisdom_badge_name_2: "Nieskazitelna błyskotka z miejsca o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 generic_badge_protection_desc: "Solidna odznaka pielgrzymia zdobyta w miejscu o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. Podobno chroni osobę, która ją nosi."
 generic_badge_prosperity_desc: "Błyszcząca odznaka pielgrzymia zdobyta w miejscu o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. Podobno przynosi dobrobyt osobie, która ją nosi."
 generic_badge_virility_desc: "Odznaka pielgrzymia emanująca gorliwością, zdobyta w miejscu o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. Podobno przynosi męskość osobie, która ją nosi."
 generic_badge_wisdom_desc: "Enigmatyczna odznaka pielgrzymia zdobyta w miejscu o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. Podobno budzi mądrość w osobie, która ją nosi, i skłania ją do kontemplacji."
