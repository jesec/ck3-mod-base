l_polish:
 #Pilgrim Badges
 maria_conch_name: "Muszla świętej Marii"
 maria_conch_description: "Odznaka pielgrzymia otrzymywana za odbycie pielgrzymki."
 maria_conch_description_protection: "Ochronna odznaka pielgrzymia otrzymywana za odbycie pielgrzymki do miejsca o nazwie [badge_location.GetProvince.GetBaronyNameExplicitly]."
 maria_conch_description_prosperity: "Odznaka pielgrzymia zwiastująca dobrobyt otrzymywana za odbycie pielgrzymki do miejsca o nazwie [badge_location.GetProvince.GetBaronyNameExplicitly]."
 santiago_badge_name: "Muszla świętego Jakuba"
 santiago_badge_description: "Odznaka pielgrzymia w kształcie muszli otrzymywana za odbycie pielgrzymki. Upamiętnia wędrówkę Drogą Świętego Jakuba (Camino de Santiago) do miejsca świętego w Santiago de Compostela."
 jerusalem_badge_name: "Krzyż jerozolimski"
 jerusalem_badge_description: "Odznaka pielgrzymia w kształcie kwadratowego krzyża otrzymywana za odbycie pielgrzymki. Wyróżnia się misterną kompozycją i delikatnymi detalami, upamiętniając wędrówkę do świętego miasta Jerozolimy."
 rome_badge_name: "Klucze Piotra Apostoła"
 rome_badge_description: "Odznaka pielgrzymia w kształcie kluczy otrzymywana za odbycie pielgrzymki. Przedstawia świętych Piotra i Pawła w aureolach, upamiętniając wędrówkę do świętego miasta Rzymu."
 generic_badge_name_1: "Miniaturowa odznaka z miejsca o nazwie [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
