 creature_type_lion_desc: "Zmuszony do posłuszeństwa król zwierząt, a zarazem symbol odwagi. Przechadza się po zagrodzie na tyle, na ile pozwala mu długość łańcucha."
 creature_type_caracal_desc: "Duże zwierzę, które przypomina kota. Skrada się po zagrodzie, gotowe rozerwać na strzępy każdą umieszczoną w niej dekorację."
 creature_type_lynx_desc: "Płochliwy, przysadzisty kot. Tuli się do ziemi, kładąc uszy po sobie i nerwowo badając wzrokiem otoczenie wokół swojej gałęzi."
 creature_type_tiger_desc: "Groźny król górskich zwierząt. Łatwo go rozdrażnić, a widok jego obnażonych gniewnie kłów budzi w gościach popłoch."
 creature_type_leopard_desc: "Zwierzę równie zwinne i pełne gracji, jak niebezpieczne. Charakteryzuje się cierpliwością i sprytem, a przy tym zachwyca spektakularnymi skokami."
 creature_type_bear_desc: "Dziki niedźwiedź wiecznie przetrząsający otoczenie w poszukiwaniu pożywienia. Pod jego potężnymi łapami kości pękałyby jak liche gałązki."
 creature_type_elephant_desc: "Zwodniczo łagodny gigant o niezwykle zręcznej – ku zaskoczeniu i uciesze gości – trąbie."
 creature_type_peacock_desc: "Dumny, wydający z siebie charakterystyczne dźwięki ptak z czubem przypominającym koronę. Stanowi znakomitą ozdobę każdego ogrodu."
 creature_type_parrot_desc: "Żwawy okaz zachwycający gości zdolnością do naśladowania odgłosów wydawanych przez ludzi."
 creature_type_crane_desc: "Szlachetne zwierzę o zwiewnych skrzydłach – symbol szczęścia i wiecznej młodości."
 creature_type_cockatoo_desc: "Barwny ptak o jaskrawych piórach i bystrym, wnikliwym spojrzeniu."
 creature_type_monkey_desc: "Przyjazna małpka – uroczy towarzysz prezentujący niezwykle ludzkie zachowania i wyrazy twarzy."
 creature_type_lion_reforged_desc: "Król zwierząt, symbol odwagi. $creature_history_entry$"
 creature_type_caracal_reforged_desc: "Dzikie zwierzę. $creature_history_entry$"
 creature_type_lynx_reforged_desc: "Duży kot ze szpiczastymi uszami. $creature_history_entry$"
 creature_type_tiger_reforged_desc: "Budzący postrach król gór. $creature_history_entry$"
 creature_type_leopard_reforged_desc: "Wielki cętkowany kot. $creature_history_entry$"
 creature_type_bear_reforged_desc: "Groźny niedźwiedź. $creature_history_entry$"
 creature_type_elephant_reforged_desc: "Zwodniczo łagodny gigant. $creature_history_entry$"
 creature_type_peacock_reforged_desc: "Dumny ptak. $creature_history_entry$"
 creature_type_parrot_reforged_desc: "Barwny egzotyczny ptak. $creature_history_entry$"
 creature_type_crane_reforged_desc: "Symbol szczęścia i fortuny. $creature_history_entry$"
 creature_type_cockatoo_reforged_desc: "Ptak o jaskrawym upierzeniu. $creature_history_entry$"
 creature_type_monkey_reforged_desc: "Fascynujące stworzenie. $creature_history_entry$"
 creature_history_entry: "Okaz ten zamieszkiwał kiedyś menażerię należącą do rodu [artifact.MakeScope.Var('og_owner').Char.GetHouse.GetNameNoTooltip] – ku uciesze i zachwytowi gości."
