l_polish:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "Kości Piotra Apostoła"
 artifact_relic_peter_bones_desc: "Kości apostoła Piotra, Księcia Apostołów i pierwszego biskupa Rzymu."
 artifact_relic_paul_bones_name: "Kości św. Pawła"
 artifact_relic_paul_bones_desc: "Kości apostoła Pawła, który poniósł męczeńską śmierć w miejscu o nazwie Aquae Salviae."
 artifact_relic_crown_of_thorns_name: "Korona cierniowa"
 artifact_relic_crown_of_thorns_desc: "Korona cierniowa wciśnięta na głowę Chrystusa przed jego ukrzyżowaniem."
 artifact_relic_baptist_arm_name: "Prawa ręka św. Jana Chrzciciela"
 artifact_relic_baptist_arm_desc: "Prawe przedramię Jana Chrzciciela, którym miał ochrzcić Chrystusa w Jordanie."
 artifact_relic_true_cross_name: "Fragment drzewa Krzyża świętego"
 artifact_relic_true_cross_desc: "Odłamek krzyża, na którym ukrzyżowano Chrystusa, umieszczony w pozłacanym relikwiarzu."
 artifact_relic_bones_of_james_name: "Kości św. Jakuba"
 artifact_relic_bones_of_james_desc: "Kości św. Jakuba Większego Apostoła, które przyciągają pielgrzymów z całej wspólnoty państw chrześcijańskich."
 artifact_relic_mark_name: "Głowa św. Marka Ewangelisty"
 artifact_relic_mark_desc: "Odcięta głowa Marka Ewangelisty, założyciela Kościoła w Aleksandrii."
 artifact_relic_lance_antioch_name: "Włócznia Przeznaczenia"
 artifact_relic_lance_antioch_desc: "Żelazny grot, którym rzekomo przebito ciało Chrystusa."
 artifact_relic_tabot_name: "Tabot Przymierza"
 artifact_relic_tabot_desc: "Konsekrowana kamienna tablica symbolizująca Arkę Przymierza, otoczona czcią jako najświętsza etiopska relikwia."
 artifact_relic_nine_saints_name: "Kości Dziewięciu Świętych"
 artifact_relic_nine_saints_desc: "Kości Dziewięciu Świętych, syryjskich mnichów, którzy uciekli przed sporami chalcedońskimi do Aksum i założyli w Etiopii pierwsze klasztory, krzewiąc miafizytyczny chrześcijanizm na wyżynach."
 artifact_relic_thomas_name: "Relikwie św. Tomasza Apostoła"
 artifact_relic_thomas_desc: "Kości i zakrwawiony grot włóczni św. Tomasza Apostoła, który rzekomo sprowadził wiarę do Kerali i tam poniósł męczeńską śmierć."
 artifact_relic_augustine_pallium_name: "Paliusz św. Augustyna"
 artifact_relic_augustine_pallium_desc: "Paliusz noszony przez Augustyna z Canterbury, pierwszego arcybiskupa i apostoła Anglików."
 artifact_relic_three_magi_name: "Relikwie Trzech Króli"
 artifact_relic_three_magi_desc: "Kości Trzech Króli, którzy podążyli za gwiazdą do Betlejem."
 artifact_relic_becket_name: "Relikwie św. Tomasza Becketa"
 artifact_relic_becket_desc: "Nasiąknięte krwią szaty i czaszka św. Tomasza Becketa, umęczonego we własnej katedrze w 1170 roku i prędko uznanego za największego świętego angielskiego świata chrześcijańskiego."
 artifact_relic_ursula_name: "Kości św. Urszuli"
 artifact_relic_ursula_desc: "Kości św. Urszuli i towarzyszących jej dziewic, męczennic, odnalezione na cmentarzach w Kolonii."
 artifact_relic_ignatius_name: "Kości św. Ignacego"
 artifact_relic_ignatius_desc: "Kości św. Ignacego, drugiego patriarchy Antiochii i adepta Jana Ewangelisty, który poniósł męczeńską śmierć w Rzymie za panowania Trajana."
 # Islamic
 artifact_relic_black_stone_name: "Fragment Hadżaru"
 artifact_relic_black_stone_desc: "Wypolerowany czarny fragment oddzielony od Hadżaru w świątyni Kaaba, który sam prorok Mahomet miał pocałować. Modli się do niego każdy pielgrzym podczas hadżdżu."
 artifact_relic_dhulfiqar_name: "Zulfikar"
 artifact_relic_dhulfiqar_desc: "Miecz proroka Mahometa o rozdwojonym ostrzu, który miał zostać podarowany Alemu. Przedmiot ten jest czczony w całej ummie jako symbol władzy z bożego nadania."
 artifact_relic_buraq_footprint_name: "Odcisk kopyta Buraka"
 artifact_relic_buraq_footprint_desc: "Kamień, na którym zostało odciśnięte kopyto Buraka, gdy prorok Mahomet wstępował do niebios ze Świętej Skały w Jerozolimie."
 artifact_relic_sword_of_ali_name: "Miecz Alego"
 artifact_relic_sword_of_ali_desc: "Ostrze, którym miał władać Ali ibn Abi Talib podczas bitew pod Badarem i Siffin."
 artifact_relic_abu_hanifa_turban_name: "Turban Abu Hanify"
 artifact_relic_abu_hanifa_turban_desc: "Turban uczonego Abu Hanify an-Nu’mana, twórcy mazhabu szkoły hanafickiej. Filar sunnickiego prawoznawstwa muzułmańskiego dla każdego hanafickiego pielgrzyma."
 artifact_relic_prophet_sandals_name: "Sandały proroka Mahometa"
 artifact_relic_prophet_sandals_desc: "Skórzane sandały, które podobno nosił prorok Mahomet. Pobożni rzemieślnicy w całej ummie bez końca kopiują ich kształt zwany na’l."
 # Jewish
 artifact_relic_western_wall_name: "Kamień ze Ściany Płaczu"
 artifact_relic_western_wall_desc: "Kamień po obróbce pochodzący z zachodniego muru oporowego platformy Drugiej Świątyni. Po zburzeniu świątyni przez Rzymian w 70 roku n.e., zachowały się tylko nieliczne fragmenty tego muru."
 artifact_relic_tablets_name: "Fragment tablic z Dekalogiem"
 artifact_relic_tablets_desc: "Odłamek kamienia, który podobno oderwał się od tablic z wyrytym na górze Synaj Dekalogiem, gdy Mojżesz w gniewie rzucił je na ziemię."
 # Buddhist
 artifact_relic_bodhi_leaf_name: "Liść z drzewa Bodhi"
 artifact_relic_bodhi_leaf_desc: "Przechowywany liść z drzewa Bodhi w Bodh Gaja, pod którym Budda osiągnął oświecenie."
 artifact_relic_vajrasana_name: "Fragment Wadżrasany"
 artifact_relic_vajrasana_desc: "Wypolerowany fragment Wadżrasany, diamentowego tronu pod drzewem Bodhi, na którym Budda siedział nieruchomo, aż doznał oświecenia."
 artifact_relic_dhamek_name: "Śarira stupy Dhamek"
 artifact_relic_dhamek_desc: "Święta relikwia Buddy z Sarnath, gdzie nauczał dharmy swoich pierwszych adeptów."
 artifact_relic_jowo_name: "Jowo Siakjamuni"
 artifact_relic_jowo_desc: "Święty wizerunek młodego Buddy, przywieziony z Chin, uznawany przez Tybetańczyków za najświętszą statuę."
 artifact_relic_sacred_tooth_name: "Święty ząb Buddy"
 artifact_relic_sacred_tooth_desc: "Lewy kieł Buddy, sprowadzony z Kalingi w IV wieku. Jest on palladium władzy królewskiej, a posiadanie tego artefaktu legitymizuje władcę ponad wszystkich innych."
 # Hindu
 artifact_relic_lingam_name: "Linga Wiśwanatha"
 artifact_relic_lingam_desc: "Święty fragment lingi Śiwy z wielkiej świątyni w Waranasi, najświętszym z miast nad Gangesem."
 artifact_relic_trishul_name: "Triśula Śiwy"
 artifact_relic_trishul_desc: "Trójząb, którym podobno władał sam Śiwa. Symbol boskiego panowania nad tworzeniem, ochroną i niszczeniem."
 artifact_relic_krishna_stone_name: "Kamień narodzin Kryszny"
 artifact_relic_krishna_stone_desc: "Wytarty kamień z Krishnajanmabhoomi w Mathurze – miejsca, które tradycja wskazuje jako miejsce narodzin Kryszny."
 artifact_relic_rama_footprint_name: "Odcisk stopy Ramy"
 artifact_relic_rama_footprint_desc: "Kamień, na którym widnieje odcisk stopy samego Ramy, przywieziony z miejsca jego narodzin, Ayodhyi."
 # Jain
 artifact_relic_palitana_tirtha_name: "Tritha w Palitanie"
 artifact_relic_palitana_tirtha_desc: "Święty zabytkowy kamień ze wzgórz Śatrundźaji w Palitanie, najświętszej tirthy w tradycji dźinijskiej."
 artifact_relic_parshvanatha_paduka_name: "Czaran paduka Parśwy"
 artifact_relic_parshvanatha_paduka_desc: "Czaran paduka, czyli kamień, na którym dwudziesty trzeci tirthankara, Parśwa, odcisnął swoje stopy."
 artifact_relic_shikharji_nishidhi_name: "Nishidhi tirthankarów"
 artifact_relic_shikharji_nishidhi_desc: "Kamienie pamiątkowe nishidhi ze szczytów góry Sammed-Shikhar, na których dwudziestu z dwudziestu czterech tirthankarów osiągnęło mokszę – najświętszej tirthy wiary dźinijskiej."
 # Zoroastrian
 artifact_relic_atash_bahram_name: "Żarzące się węgle Adur Farnbagu"
 artifact_relic_atash_bahram_desc: "Żarzące się węgle przeniesione z wielkiego Atasz Behramu, znajdującego się w świątyni ognia świętego ognia kapłanów, który nigdy nie gaśnie."
 # Norse
 artifact_relic_yggdrasil_branch_name: "Gałąź Yggdrasila"
 artifact_relic_yggdrasil_branch_desc: "Gałąź, która podobno oberwała się ze świętego drzewa przy Świątyni w Uppsali, gdzie wciąż wiszą ciała złożone w ofierze."
 # Slavic
 artifact_relic_perun_idol_name: "Podobizna Peruna"
 artifact_relic_perun_idol_desc: "Drewniany posąg Peruna, boga piorunów, pana słowiańskich bóstw. Został wzniesiony przez księcia Włodzimierza."
 # Tengri
 artifact_relic_suldetug_name: "Buńczuk bóstwa Sülde"
 artifact_relic_suldetug_desc: "Czarny buńczuk z ogona jaka, naczynie dla ducha boga wojny, niesiony przed chanami stepu."
 # Shinto
 artifact_relic_yata_kagami_name: "Ośmiogranne zwierciadło"
 artifact_relic_yata_kagami_desc: "Zwierciadło z brązu tradycyjnie utożsamiane z jednym z trzech japońskich regaliów cesarskich, o którym mówi się, że wywabiło boginię słońca Amaterasu z jaskini."
 artifact_relic_shin_no_mihashira_name: "Kolumna Shin-no-mihashira"
 artifact_relic_shin_no_mihashira_desc: "Odłamek drewnianej kolumny Shin-no-mihashira, świętego centralnego filaru zakopanego pod wewnętrznym sanktuarium, Naikū. Jest on uznawany za najbardziej skrytą i najświętszą tajemnicę miasta Ise. Odnawia się go przy każdej rytualnej przebudowie shikinen sengū."
 # Confucian
 artifact_relic_kong_tomb_name: "Stela z grobu Konfucjusza"
 artifact_relic_kong_tomb_desc: "Rzeźbiona tablica kamienna z grobu Konfucjusza w Qufu, czczona od pokoleń przez członków rodu Kongów."
 artifact_relic_analects_name: "Dialogi konfucjańskie"
 artifact_relic_analects_desc: "Wczesny egzemplarz dialogów zapisany na bambusowych listewkach. Zbiór wypowiedzi mistrza Konga studiowany przez pokolenia chińskich uczonych."
 # Hellenic
 artifact_relic_athena_promachos_name: "Fragment posągu Ateny Promachos"
 artifact_relic_athena_promachos_desc: "Fragment kolosalnego posągu z brązu Ateny, który niegdyś górował nad Akropolem."
 # West African
 artifact_relic_opa_oranmiyan_name: "Monolit Opa Oranmiyan"
 artifact_relic_opa_oranmiyan_desc: "Granitowa laska legendarnego króla Oranmiyana, wbita w świętą ziemię Ife, kolebkę ludu Joruba."
 artifact_relic_oshe_shango_name: "Oshe Shango"
 artifact_relic_oshe_shango_desc: "Oshe Shango to podwójny topór wykonany na wzór bliźniaczych kamieni piorunowych boga burzy Shango. Podczas ekstatycznego tańca kapłani wznoszą go wysoko."
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "Święty posąg"
 artifact_misc_relic_idol_desc: "Wyrzeźbiony posąg, namacalna siedziba boga podczas rytuału."
 artifact_misc_relic_stele_name: "Stela przodków"
 artifact_misc_relic_stele_desc: "Wyryta kamienna płyta z rodowodem kapłaństwa, świadectwo trwające przez pokolenia."
 artifact_misc_relic_mask_name: "Rytualna maska"
 artifact_misc_relic_mask_desc: "Uroczysta maska, którą zakłada się podczas najważniejszych obrządków, naczynie boskiej obecności."
 artifact_misc_relic_banner_name: "Święty sztandar"
 artifact_misc_relic_banner_desc: "Uświęcony sztandar, który rozciągał opiekę nad każdym wielkim obrządkiem w danym miejscu świętym. Jego tkanina jest ciężka od dymu ofiar."
