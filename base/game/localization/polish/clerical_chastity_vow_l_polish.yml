l_polish:
 request_clerical_chastity_interaction: "Żądaj czystości"
 request_clerical_chastity_interaction_desc: "Domagaj się, aby osoba, którą jest [recipient.GetShortUINameNotMeNoTooltip], złożyła śluby czystości przed obliczem [recipient.GetFaith.HighGodNamePossessive]. Jeśli się zgodzi, otrzyma długotrwałą karę do [Concept('fertility', 'płodności')|E] i nie będzie mogła uwodzić ani inicjować zalotów, aż przysięga dobiegnie końca lub postać się jej zrzeknie."
 request_clerical_chastity_notification_text: "Złóż te śluby i narzuć swojemu ciału wstrzemięźliwość w imię [actor.GetFaith.HighGodNamePossessive]. Twoje posłuszeństwo przyniesie chwałę wierze znanej jako [actor.GetFaith.GetNameNoTooltip]."
 clerical_chastity_offer_piety: "Zaoferuj pobożność"
 clerical_chastity_recipient_must_be_in_reach_tt: "Musisz być [Concept('head_of_faith', 'głową wiary')|E] albo mieć pod władaniem [duchy|El] lub [title|El] wyższego poziomu, chyba że [recipient.GetShortUINameNotMeNoTooltip] osobiście włada [Concept('county', 'hrabstwem')|E] graniczącym z jednym z twoich hrabstw"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNotMeNoTooltip] musi być [Concept('head_of_faith', 'głową wiary')|E] albo mieć pod władaniem [duchy|El] lub [title|El] wyższego poziomu, chyba że [recipient.GetShortUINameNotMeNoTooltip] osobiście włada [Concept('county', 'hrabstwem')|E] graniczącym z jednym z hrabstw należących do tej pierwszej osoby"
 clerical_chastity_vow_blocks_scheme_tt: "Nie może ograniczać cię modyfikator „[GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|L]”"
 request_clerical_chastity_actor_toast: "Przyjęto żądanie"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUINameNotMe] przyjmuje żądanie osoby znanej jako [puppet_or_actor.GetShortUINameNotMe]"
 request_clerical_chastity_recipient_toast: "Przysięgnięto czystość"
 request_clerical_chastity_decline_actor_toast: "Odrzucono żądanie"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUINameNotMe] odrzuca żądanie osoby znanej jako [puppet_or_actor.GetShortUINameNotMe]"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName( recipient.Self )] to ktoś pożądany w mojej [Concept('faith', 'wierze')|E]: $VALUE|=+0$"
 clerical_chastity_ai_rival: "Rywal osoby znanej jako [actor.GetShortUINameNotMeNoTooltip]: $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[realm_capital|E] w moim [Concept('clerical_region', 'regionie duchownym')|E]: $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "Zaoferowana dodatkowa [piety|El]: $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "Jest to [recipient.GetTitleAsNameNoTooltip]: $VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "Wyrzeknij się ślubów czystości"
 renounce_clerical_chastity_vow_decision_confirm: "Wyrzeknij się ślubów"
 renounce_clerical_chastity_vow_decision_desc: "Ta przysięga została przeze mnie złożona, bo kapłan wymagał ode mnie czystości. Mogę ją odwołać, jednak złamanie świętej obietnicy będzie kosztować mnie [piety|El] i ciążyć mi na sumieniu."
 renounce_clerical_chastity_vow_decision_tooltip: "Zakończ przysięgę, nim dobiegnie końca. Stracisz [piety|El], doświadczysz [Concept('stress', 'stresu')|E] i pogorszysz [Concept('clergy_opinion', 'opinię duchowieństwa')|E] na 10 lat."
 renounce_clerical_chastity_vow_toast: "Zrzeknięto się ślubów"
 renounce_clerical_chastity_vow_toast_desc: "Zrzekasz się ślubów czystości."
 clerical_chastity_vow.0001.toast_released: "Koniec przysięgi"
 clerical_chastity_vow.0001.toast_released_desc: "Złożona przez ciebie przysięga dobiegła końca."
