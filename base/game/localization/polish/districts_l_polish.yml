 ### Economy ###
 guild_district: "Dzielnica gildyjna"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[trade_goods_i] [trade_goods|E]\n$BULLET_WITH_TAB$[gold_i] [sell_prices|E]"
 guild_district_desc_flavor: "W tutejszych siedzibach gildii pracują najlepsi rzemieślnicy w mieście, którzy zazdrośnie strzegą swoich tajemnic zawodowych. Ich wyroby są doskonałe, ceny wysokie, a czeladnicy przepracowani."
 market_district: "Dzielnica handlowa"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[gold_i] [sell_prices|E]\n$BULLET_WITH_TAB$[gold_i] [buy_prices|E]\n$BULLET_WITH_TAB$[commerce_tax_i] [commerce_tax_short|E] i [artisan_tax_i] [artisan_tax|El]"
 market_district_desc_flavor: "Od świtu do zmierzchu ten tętniący życiem plac wypełniają miejscowi chłopi, rzemieślnicy i kupcy. Wszystko, czego miasto nie jest w stanie wyprodukować samodzielnie, można tu kupić za „uczciwą” cenę."
 port_district: "Dzielnica portowa"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i] [trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[maritime_tax_i] [maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E]"
 port_district_desc_flavor: "Wzdłuż nabrzeża ciągną się pomosty i magazyny. Pracownicy portowi wyładowują towary ze statków o różnej wielkości. Cokolwiek przypływa zza morza, najpierw trafia właśnie tutaj."
 entrepot_location_district: "Dzielnica przeładunkowa"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax_i] [commerce_tax|E]"
 entrepot_location_district_desc_flavor: "[Concept('entrepot', 'Umożliwia odsprzedaż towarów na duże odległości za pośrednictwem własnych budowli')|E]\n\nImportowane towary z tych magazynów są inwentaryzowane, sortowane i wysyłane dalej na rynek. Tutejsi kupcy zawsze wiedzą, czego występuje niedobór, i odpowiednio ustalają ceny."
 entrepot_holding_district_level_2_tt: "Wymagany jest poziom #V 2#! [Concept('holding_district', 'dzielnicy posiadłości')|E]"
 entrepot_holding_district_level_3_tt: "Wymagany jest poziom #V 3#! [Concept('holding_district', 'dzielnicy posiadłości')|E]"
 entrepot_holding_district_level_4_tt: "Wymagany jest poziom #V 4#! [Concept('holding_district', 'dzielnicy posiadłości')|E]"
 holding_district_level_2_tt: "Wymagany jest poziom #V 2#! [Concept('holding_district', 'dzielnicy posiadłości')|E]"
 holding_district_level_3_tt: "Wymagany jest poziom #V 3#! [Concept('holding_district', 'dzielnicy posiadłości')|E]"
 holding_district_level_4_tt: "Wymagany jest poziom #V 4#! [Concept('holding_district', 'dzielnicy posiadłości')|E]"
 ### Fortification ###
 border_forts_district: "Dzielnica fortów przygranicznych"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i] [garrison|E]\n$BULLET_WITH_TAB$[stationed_regiment_i] [stationed_regiment|E]\n$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[control_i] [control|E]"
 border_forts_district_desc_flavor: "Granic baronii strzeże łańcuch fortów, a w każdym z nich stacjonują żołnierze znający każdą drogę i każdy bród. Najeźdźcom, którzy tu zawędrują, rzadko kiedy udaje się dotrzeć daleko."
 walls_district: "Dzielnica murów"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i] [fort_level|E]\n$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[garrison_i] [garrison|E]"
 walls_district_desc_flavor: "Miasto otaczają solidne kamienne mury zapewniające doskonałą ochronę przed najeźdźcami. Mieszkańcy narzekają na opłatę pobieraną przy bramie, ale jest to i tak bardziej opłacalne niż bycie ofiarą rabunku."
 ### Military ###
 military_district: "Dzielnica wojskowa"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i] [stationed_regiment|E]\n$BULLET_WITH_TAB$[siege_weapon_i] [siege_weapons|E]\n$BULLET_WITH_TAB$[garrison_i] [garrison|E]\n$BULLET_WITH_TAB$[supply_i] [supply|E]"
 military_district_desc_flavor: "W solidnych koszarach żołnierze państwa mieszkają, mają zapewnione wyżywienie i szkolenie oraz utrzymują gotowość do wymarszu. Zachowanie ich w trzeźwości to już zupełnie inna sprawa."
 ### Civic ###
 bureaucratic_district: "Dzielnica biurokratyczna"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i] [vassals|E]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence_i] [influence|E]\n$BULLET_WITH_TAB$[tax_collector|E] i [governor_efficiency|El]"
 bureaucratic_district_desc_flavor: "W tych salach urzędnicy wszystkich szczebli sporządzają kopie dokumentów, opieczętowują je i archiwizują państwowe pisma. Ich praca rzadko spotyka się z uznaniem, ale bez niej system wkrótce stanąłby w miejscu."
 household_district: "Domostwo królewskie"
 imperial_household_district: "Domostwo cesarskie"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knight_i] [knights|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]"
 household_district_desc_flavor: "W tych wspaniałych salach mieści się dwór władcy. Za wysokimi murami blask królestwa podtrzymują służący, biegli rzemieślnicy i doradcy. Niektórzy nie opuszczają tej dzielnicy przez całe życie."
 mandala_district: "Dzielnica mandalowa"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i] [dynasty_prestige|E]\n$BULLET_WITH_TAB$[gold_i] [tax|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]"
 mandala_district_desc_flavor: "Wszystkie świątynie, posągi i ceremonie w tej świętej dzielnicy opowiadają tę samą historię – król rządzi z woli bogów. Powtarza się ją często i bardzo głośno."
 temple_district: "Enklawa religijna"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[religious_tax_i] [religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i] [epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]"
 temple_district_desc_flavor: "W tej dzielnicy znajduje się mnóstwo świątyń, a ich dzwony, śpiewy i wezwania do modlitwy wyznaczają każdą godzinę dnia. Tutaj duchowni mają niemal tak samo duże wpływy jak sam władca."
 temple_district_christian: "Enklawa kościelna"
 temple_district_islamic: "Dzielnica meczetu"
 ### Metropolitan ###
 entertainment_district: "Dzielnica rozrywkowa"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[urban_tax_i] [urban_tax|E]"
 entertainment_district_desc_flavor: "Muzyka, zabawy i wszelkiego rodzaju widowiska przyciągają do tej dzielnicy mieszkańców ze wszystkich warstw społecznych. Szlachta udaje, że jej się to nie podoba, a chłopi udają, że jej nie widzą."
 patrician_district: "Dzielnica arystokratyczna"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E]\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]"
 patrician_district_desc_flavor: "W tej zamieszkanej przez zamożne rodziny dzielnicy marmur, jedwab i importowane przyprawy są na porządku dziennym. Miejscowi zawierają małżeństwa między sobą, pożyczają sobie wzajemnie pieniądze i knują intrygi przeciwko sąsiadom."
 urban_housing_district: "Dzielnica mieszkalna"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i] [settlement_size|E] i jej [settlement_size_growth_short|El]\n$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E] i [urban_tax_i] [urban_taxes_short|El]\n$BULLET_WITH_TAB$Odblokowuje [urban_districts|El]"
 urban_housing_district_desc_flavor: "Większość ludności miasta mieszka na tych przepełnionych ulicach, gdzie pod jednym dachem tłoczy się kilka rodzin. Dla przybyszów ze wsi jest to pierwszy krok w kierunku lepszego życia."
 ### Rural ###
 manor_houses_district: "Dzielnica majątków dworskich"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[fort_level_i] [fort_level|E]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax_short|E] i [woodland_tax_i] [woodland_tax|El]\n$BULLET_WITH_TAB$[supply_i] [supply|E]"
 manor_houses_district_desc_flavor: "W wiejskich rezydencjach mieszkają przedstawiciele pomniejszych rodów szlacheckich, którzy zarządzają okolicznymi ziemiami. Do wyższych warstw społecznych płyną pieniądze i zboże, a wraz z nimi przekazywane są też różne skargi."
 religious_community_district: "Dzielnica wspólnoty religijnej"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[religious_tax_i] [religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i] [epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i] [travel_danger|E]"
 religious_community_district_desc_flavor: "W tej spokojnej wspólnocie gromadzą się ludzie pobożni, aby żyć z dala od świata, poświęcając się modlitwie, uprawie ziemi i kopiowaniu świętych tekstów. Świat jednak nieustannie zsyła im swoje problemy."
 villages_district: "Dzielnica wiosek"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i] Zmniejszona [settlement_size|El]\n$BULLET_WITH_TAB$[trade_goods_i] [trade_goods_production|E]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E] i [agricultural_tax_i] [agricultural_tax_short|El]\n$BULLET_WITH_TAB$[supply_i] [supply|E]\n$BULLET_WITH_TAB$Odblokowuje [rural_districts|El]"
 villages_district_desc_flavor: "Poza murami miasta na wsi rozsiane są wioski, z których każda ma własne pola i własną studnię. Tutejsi chłopi produkują żywność, którą mieszkańcy miasta uważają za coś oczywistego."
 ### Tribal ###
 tribal_economy_prestige_district: "Dzielnica sal biesiadnych"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[gold_i] [tax|E]"
 tribal_economy_prestige_district_desc_flavor: "W tych salach bankietowych plemię gromadzi się, aby jeść, pić i chwalić się swoimi wyczynami. Z każdym kielichem przygody stają się coraz bardziej wyolbrzymione."
 tribal_military_district: "Dzielnica kwater wojskowych"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[men_at_arms_i] [men_at_arms|E]"
 tribal_military_district_desc_flavor: "W tych chatach wojownicy plemienia ostrzą broń i wymieniają się opowieściami o dawnych najazdach. Młodzi słuchają z uwagą, już planując własne wyprawy."
 tribal_wanua_district: "Dzielnica pawilonów"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i] [barter_goods|E]\n$BULLET_WITH_TAB$[vassal_limit_i] [vassal_limit|E]\n$BULLET_WITH_TAB$[domain_limit_i] [domain_limit|E]"
 tribal_wanua_district_desc_flavor: "Ludzie gromadzą się w tych otwartych salach, aby przedstawić skargi starszyźnie, a ta z kolei dba o to, aby wódz również je usłyszał."
 ### Duchy ###
 bailiwick_district: "Dzielnica baliwatu"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax_short|E] i [woodland_tax_i] [woodland_tax|El]\n$BULLET_WITH_TAB$[trade_goods_i] [trade_goods_production|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]"
 bailiwick_district_desc_flavor: "Wieś płaci za wszystkie działania księstwa, a w tej dzielnicy włodarze o to dbają, sprawdzając osobno każde pole, każde stado i każdą miejscowość."
 staple_district: "Dzielnica składu"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i] [urban_taxes_short|E], [commerce_tax_i] [commerce_tax_short|El], [artisan_tax_i] [artisan_tax_short|El] i [maritime_tax_i] [maritime_tax|El]\n$BULLET_WITH_TAB$[gold_i] [sell_prices|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i] [trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 staple_district_desc_flavor: "Magazyny, wagi i pomieszczenia dla rachmistrzów wypełniają dzielnicę handlową, w której najcenniejsze towary w księstwie są ważone, opodatkowane i chronione."
 endowment_district: "Dzielnica uposażeń kościelnych"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i] [religious_tax|E]\n$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i] [epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i] [travel_danger|E]"
 endowment_district_desc_flavor: "Każda darowizna na rzecz tego dzieła ma charakter wieczny, a tutejsze duchowieństwo ma przywileje nadane przez władców, których imion nikt nie pamięta."
 assay_district: "Dzielnica probiercza"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E] i [civic_tax_i] [civic_tax|El]\n$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[influence_i] [influence|E]\n$BULLET_WITH_TAB$[vassal_i] [vassals|E]"
 assay_district_desc_flavor: "Garść monet z każdej partii wybitej w tej dzielnicy jest zamykana w skrzyni, aby można je było później sprawdzić, gdyby mincerze okazali się chciwi."
 military_duchy_capital_district: "Dzielnica terenów zbiórki"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i] [levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i] [stationed_regiment|E]\n$BULLET_WITH_TAB$[garrison_i] [garrison|E] i [fort_level|El]\n$BULLET_WITH_TAB$[knight_i] [knights|E]"
 military_duchy_capital_district_desc_flavor: "Każdy żołnierz, który zbiera się w tej dzielnicy, ma zapisane imię, broń i konia. Odnotowuje się również tych, którzy się nie pojawili."
 ducal_residence_district: "Dzielnica rezydencji książęcej"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[stress_i] [stress|E]"
 ducal_residence_district_desc_flavor: "Goście przebywający w tej dzielnicy są goszczeni w salach i ogrodach godnych księcia, a podczas kolacji załatwia się tu więcej spraw dotyczących księstwa niż na dworze."
 royal_residence_district: "Dzielnica rezydencji królewskiej"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i] [prosperity|E]\n$BULLET_WITH_TAB$[stress_i] [stress|E]"
 royal_residence_district_desc_flavor: "Goście przebywający w tej dzielnicy są goszczeni w salach i ogrodach godnych króla, a podczas kolacji załatwia się tu więcej spraw dotyczących królestwa niż na dworze."
 governance_district: "Dzielnica rządowa"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i] [control|E]\n$BULLET_WITH_TAB$[influence_i] [influence|E]\n$BULLET_WITH_TAB$[popular_opinion_i] [popular_opinion|E]\n$BULLET_WITH_TAB$[men_at_arms_i] [men_at_arms|E]"
 governance_district_desc_flavor: "W budynkach tej dzielnicy pracują urzędnicy wszystkich szczebli – to właśnie tam obliczane są podatki prowincji, kontrolowane są jej spichlerze i wypłacane są żołdy garnizonów."
 forestry_district: "Dzielnica leśniczych"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_glass').GetNameWithIcon|l], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_meat').GetNameWithIcon|l]"
 forestry_district_desc_flavor: "Tutejsze lasy dostarczają drewna na budowę domów i statków oraz do rozpalania ognia, a prawo do wycinki podlega zdecydowanej ochronie. Kradzież surowca jest karana niemal tak surowo jak nielegalne polowanie na jelenie."
 grain_district: "Dzielnica uprawy zboża"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l]"
 grain_district_desc_flavor: "Ziarna to podstawa każdej gospodarki, a na polach w tej dzielnicy uprawia się je w obfitości. To, z czego nie robi się chleba, jest wykorzystywane do warzenia piwa, destylacji lub sprzedaży."
 wool_district: "Dzielnica hodowli owiec"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l], [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon|l], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 wool_district_desc_flavor: "Na pastwiskach w tej dzielnicy można znaleźć mnóstwo owiec, a ich wełna jest sprzedawana w workach tkaczom w całym państwie. Niejedna wielka fortuna kupiecka zaczęła się od jednego stada."
 cattle_district: "Dzielnica hodowli bydła"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_meat').GetNameWithIcon|l], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l]"
 cattle_district_desc_flavor: "Na pastwiskach w tej dzielnicy można znaleźć wiele krów cenionych za mięso, mleko i pracę przy pługu. W wielu miejscach posag panny młodej nadal wycenia się w sztukach bydła."
 cotton_district: "Dzielnica uprawy bawełny"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 cotton_district_desc_flavor: "Na polach w tej dzielnicy dojrzewają białe torebki bawełny, które zbiera się ręcznie i sprzedaje w belach. Niektóre żyjące daleko ludy uważają, że materiał ten pochodzi z roślin, z których wyrastają maleńkie owieczki."
 stone_district: "Dzielnica wydobycia kamienia"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 stone_district_desc_flavor: "Wzgórza w tej dzielnicy są pokryte kamieniołomami, w których wydobywa się surowiec przeznaczony do budowy murów, świątyń i zamków w całym państwie. Niektóre z najwspanialszych budowli mają swój początek właśnie tutaj – na okolicznych zboczach."
 fish_district: "Dzielnica rybołówcza"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i] [maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 fish_district_desc_flavor: "Ryby z tej dzielnicy spożywa się na świeżo, z solą, uwędzone lub suszone, a także sprzedaje się je w głębi lądu, gdzie nie ma zbyt wiele wody. Dobry połów wystarcza do wyżywienia całej wioski przez miesiąc."
 wine_district: "Dzielnica winna"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 wine_district_desc_flavor: "W winnicach w tej dzielnicy uprawia się winogrona przeznaczone do spożycia, do suszenia, a przede wszystkim do produkcji wina. Dobry rocznik zapada w pamięć na dekady, a zły – na jeszcze dłużej."
 oil_district: "Dzielnica uprawy oliwek"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 oil_district_desc_flavor: "Oliwa z tej dzielnicy służy do zasilania lamp, gotowania posiłków, namaszczania wiernych oraz pielęgnacji skóry ludzi bogatych. Istnieje niewiele dziedzin, w których się ona nie przydaje, a także mało jest gospodarstw, które się bez niej obywają."
 rice_district: "Dzielnica uprawy ryżu"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l]"
 rice_district_desc_flavor: "Zalane pola ryżowe rozciągają się tu na całej okolicy, a pracują na nich całe wioski, które wspólnie sadzą, pielą i zbierają plony. Uprawa ryżu to zbyt pracochłonne zajęcie, aby mogła ją wykonać jedna rodzina."
 millet_district: "Dzielnica uprawy prosa"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_wood').GetNameWithIcon|l]"
 millet_district_desc_flavor: "Pola prosa i sorgo pokrywają tutejsze suche równiny. Rośliny są na tyle wysokie, że mógłby się między nimi ukryć jeździec. Małe, twarde ziarna nie psują się i zachowują świeżość przez lata."
 mine_district: "Dzielnica kopalniana"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon|l]"
 mine_district_desc_flavor: "Cokolwiek kryje się pod tą dzielnicą – czy to żelazo, srebro, czy sól – wydobywają górnicy, którzy większą część życia spędzają pod ziemią niż na powierzchni."
 salt_district: "Dzielnica wydobycia soli"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i] [mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 salt_district_desc_flavor: "Bez soli nie da się konserwować mięsa czy ryb na okresy nieurodzaju, ani też zapewnić wyżywienia armii. Ta dzielnica dostarcza jej ogromne ilości i ma tego świadomość."
 amber_district: "Dzielnica bursztynowa"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "Bursztyn jest wyrzucany na brzeg po burzach, a w głębi lądu wydobywa się go z piasków i bagien. Uważa się, że jego fragment z uwięzionym w środku owadem przynosi szczęście."
 silk_district: "Dzielnica jedwabnicza"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] i [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 silk_district_desc_flavor: "Jedwab z tego regionu powstaje dzięki maleńkim owadom, które dzień i noc są karmione liśćmi morwy. Do wyprodukowania jednej szaty potrzeba wielu tysięcy kokonów."
 furs_district: "Dzielnica kuśnierska"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l]"
 furs_district_desc_flavor: "Traperzy z tej dzielnicy wychodzą na łowy w najzimniejszych miesiącach, kiedy futro zwierząt jest najgrubsze i najcenniejsze. Za jedną dobrą skórkę można dostać tyle, co za cały sezon pracy."
 spices_district: "Dzielnica uprawy przypraw"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 spices_district_desc_flavor: "Oferowane tu przyprawy pozyskiwane są z każdej części rośliny: kory, pąków, jagód, korzeni lub słupków kwiatu. Wszystko zbierane jest ręcznie i suszone z ostrożnością."
 tea_district: "Dzielnica uprawy herbaty"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 tea_district_desc_flavor: "Krzewy herbaty rosną na stromych wzgórzach tej dzielnicy, gdzie w godzinach porannych wisi mgła. Najlepsze liście są zbierane na wczesnym stadium wzrostu, po jednym pączku i dwóch listkach na raz."
 dyes_district: "Dzielnica wytwarzania barwników"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 dyes_district_desc_flavor: "Barwniki z tej dzielnicy pozyskiwane są z korzeni, liści, jagód, a nawet zmiażdżonych owadów. Uzyskanie głębokiego, trwałego koloru może wymagać kilkunastu zanurzeń barwionego materiału."
 ivory_district: "Dzielnica kości słoniowej"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i] [woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 ivory_district_desc_flavor: "Słonie przebywające w tej dzielnicy są łapane, oswajane i szkolone na potrzeby wojny, pracy i kultu. Ich kość słoniowa stanowi tylko część ich wartości."
 sugar_district: "Dzielnica cukrownicza"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 sugar_district_desc_flavor: "Trzcina cukrowa uprawiana w tej dzielnicy rośnie do dużej wysokości. Łodygi pełne słodkiego soku miażdży się, a następnie gotuje do uzyskania twardych bloków, tzw. głów. W odległych rejonach pojedyncza głowa jest warta więcej niż krowa."
 incense_district: "Dzielnica wytwarzania kadzideł"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 incense_district_desc_flavor: "Kadzidło z tej okolicy to żywica pozyskiwana z kory drzew i pozostawiona do stwardnienia na słońcu. Jego dym unosi się w świątyniach na całym znanym świecie."
 medicaments_district: "Dzielnica uprawy roślin leczniczych"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 medicaments_district_desc_flavor: "Ogrody i dzikie tereny tej okolicy porastają zioła lecznicze, zbierane przez ludzi potrafiących odróżnić, które liście leczą, a które szkodzą."
 ceramics_district: "Dzielnica ceramiczna"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i] [artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_glass').GetNameWithIcon|l]"
 ceramics_district_desc_flavor: "Glina z tej dzielnicy jest tak drobnoziarnista, że garncarze podróżują tygodniami, by ją wydobyć. Najlepsze wypalone tu wyroby, gdy się w nie stuknie, dźwięczą jak dzwon."
 hemp_district: "Dzielnica uprawy juty"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l]"
 hemp_district_desc_flavor: "Tę dzielnicę pokrywają pola konopi, które po dojrzeniu są koszone, moczone i międlone w celu uzyskania włókien, z których wytwarza się liny, tkaniny i płótno."
 flax_district: "Dzielnica uprawy lnu"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 flax_district_desc_flavor: "Len wyrywa się tu z korzeniami, a nie ścina, dzięki czemu wykorzystuje się każdy cal włókna. Jego nasiona trafiają pod prasę, a uzyskane wytłoki służą jako pasza dla zwierząt."
 honey_district: "Dzielnica pasieczna"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l] i [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 honey_district_desc_flavor: "Tutaj, w ulach ze słomy, gliny lub wydrążonych pni, hodowane są pszczoły. Podczas miodobrania owady uspokaja się dymem. Dla większości ludzi miód jest jedyną słodkością, jakiej kiedykolwiek spróbują."
 fruit_district: "Dzielnica zbiorów owocowych"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E] i [artisan_tax_i] [artisan_tax|El]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i] Możliwa produkcja: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l]"
 fruit_district_desc_flavor: "Zbocza i doliny tej dzielnicy pokrywają sady drzew owocowych, których owoce spożywa się na świeżo, suszy na słońcu lub tłoczy."
 horses_district: "Dzielnica hodowli koni"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i] [agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i] [settlement_size_baseline|E]"
 horses_district_desc_flavor: "W tej dzielnicy rozciągają się otwarte pastwiska, wybiegi i stajnie, gdzie hoduje się konie, zajeżdża je i sprzedaje jeźdźcom z całego królestwa."
