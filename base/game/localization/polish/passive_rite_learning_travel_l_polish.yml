l_polish:
 msg_passive_learned_tenet_abroad_desc: "Dzięki obserwacji osoby znanej jako [passive_learn_source.GetTitledFirstName], która wyznaje [rite|El] o nazwie [passive_learn_source.GetRite.GetName|l] w miejscu o nazwie [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]”."
 msg_passive_learned_doctrine_abroad_desc: "Dzięki obserwacji osoby znanej jako [passive_learn_source.GetTitledFirstName], która wyznaje [rite|El] o nazwie [passive_learn_source.GetRite.GetName|l] w miejscu o nazwie [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]”."
 msg_passive_learned_rite_abroad_desc: "Dzięki osobie, którą jest [passive_learn_source.GetTitledFirstNameNoTooltip], zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenets', 'dogmatach')|E] i [Concept('doctrines', 'doktrynach')|E] [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_source.GetRite.GetName|l]."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "W miejscu znanym jako [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('core_tenet', 'dogmacie')|E] „[passive_learn_tenet.GetBaseName]” [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_rite.GetName|l]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "W miejscu znanym jako [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] zdobywasz [Concept('agnostic_knowledge', 'wiedzę')|E] o [Concept('doctrine', 'doktrynie')|E] „[passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )]” [Concept('rite', 'obrządku')|E] o nazwie [passive_learn_rite.GetName|l]."
 rite_travel_events.1000.t: "Podróżujący [passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "Zapada zmierzch, a podróżujący [passive_learn_rite.GetAdherentName] dołącza do nas przy ognisku.\n\nPóźną nocą [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')] i opowieści umilają nam czas. [passive_learn_rite.GetAdherentName|U] opowiada o świętych naukach swojego ludu, o tym, że w życiu codziennym praktykuje się obrządek o nazwie [passive_learn_rite.GetNameNoTooltip|l]. W każdym słowie słychać głębokie przekonanie."
 rite_travel_events.1000.a: "Wielce przenikliwe."
 rite_travel_events.1000.b: "Ta osoba powinna do mnie dołączyć."
 rite_travel_events.1000.c: "Uszy więdną od tej herezji."
 rite_travel_events.2000.t: "Objawienie"
 rite_travel_events.2000.desc: "Podróżując przez tereny znane jako [location.GetTerrain.GetNameNoTooltip] miejsca o nazwie [location.GetName], spotykam zgromadzony tłum.\n\nKaznodzieja mówi o czymś, co nazywa się „[passive_learn_tenet.GetBaseName]”. Pierwsze słyszę, a jednak te słowa przemawiają do mnie.\n\nZamiast przejść obok, zatrzymuję się i słucham.\n\nTo przecież… To jest prawda."
 rite_travel_events.2000.a: "Takie są oczekiwania [ROOT.Char.GetFaith.HighGodNamePossessive] wobec mnie."
 rite_travel_events.2000.b: "Nie mam nic wspólnego z pogaństwem!"
