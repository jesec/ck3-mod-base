 FAITH_CREATION_BASIC_UI_DESC: "#weak Mam wyjątkową okazję, aby na zawsze zmienić naszą wiarę. Muszę starannie to przemyśleć, ponieważ każdy nowy dogmat będzie nienaruszalny od momentu ustanowienia.\n\nKsięża i uczeni przybyli na mój dwór, aby omawiać wszelkie kwestie teologiczne, próbując skodyfikować pełną i solidną reinterpretację naszych starych ustnych tradycji, ale to ja jestem tym, który umożliwił tę reformację.#!\n\nMam ostateczne zdanie w sprawie [Concept( 'core_tenets', 'dogmatów' )|E] i [Concept( 'doctrines', 'doktryn' )|E] naszej nowej [Concept( 'faith', 'wiary' )|E]."
