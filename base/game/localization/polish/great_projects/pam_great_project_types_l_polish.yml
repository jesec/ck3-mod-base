 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$: święte freski dla miejsca o nazwie [province.GetNameNoTooltip]"
 pam_great_projects_events.0002.desc: "Chociaż kapłani mogą odwoływać się do Słowa Bożego, to święte obrazy ukazują wiernym prawdę i chwałę Pana.\n\nPo zebraniu niezbędnych środków i zgromadzeniu ikonopisarzy muszę zdecydować, które motywy z Pisma Świętego będą zdobić sklepienia, ściany oraz sufity."
 pam_great_projects_events.0002.a: "Trzej Mędrcy przy nowo narodzonym Chrystusie."
 pam_great_projects_events.0002.b: "Święty Hieronim na pustyni ze swoim lwem."
 pam_great_projects_events.0002.c: "Abraham i Lot opuszczający Egipt i udający się do Kanaanu."
 pam_great_projects_events.0002.d: "Zwiastowanie Najświętszej Maryi Pannie."
 pam_great_projects_events.0002.e: "Serce św. Augustyna gorejące wiedzą o Panu."
 pam_great_projects_events.0002.f: "Chrystus myjący stopy apostołom."
 pam_great_projects_events.0002.mystic_xp: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni zwiększone [trait_level_track_xp|El] postaciom, które mają następującą [Concept('trait', 'cechę')|E]: [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]"
 pam_great_projects_events.0002.scholar_xp: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni [trait_level_track_xp|El] postaciom, które mają następującą [Concept('trait', 'cechę')|E]: [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]"
 pam_great_projects_events.0002.pilgrim_xp: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni [trait_level_track_xp|El] postaciom, które mają następującą [Concept('trait', 'cechę')|E]: [GetTrait('pilgrim').GetName( GetNullCharacter )|l]"
 pam_great_projects_events.0002.piety: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni @piety_icon! [piety|El]"
 pam_great_projects_events.0002.learning_xp: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni @skill_learning_icon! [lifestyle_experience|El] w zakresie [Concept('learning', 'nauki')|E] i [spiritual_fulfillment|El] wiernym"
 pam_great_projects_events.0002.stress_loss: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni @stress_loss_icon! [Concept('stress_loss', 'redukcję stresu')|E]"
 cathedral_stained_glass_contributor_tt: "Należy mieć co najmniej następujący [prestige_level|El]: [GetPrestigeLevelName('(int32)2')|l], co najmniej następujący [piety_level|El]: [GetPietyLevelName('(int32)3')|l] albo [title|El] poziomu [Concept('kingdom', 'królestwa')|E]"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: [province.GetNameNoTooltip] – malowanie światłem"
 pam_great_projects_events.0003.desc: "– #EMP Lśni to, co ze lśniącym zestawimy, lśni nasze dzieło, które na światło wystawimy#! – mówi [religion_buddy.GetTitledFirstName], patrząc na błyszczące w słońcu cięte szkło.\n\nSzklarz, [glazier.GetTitledFirstName], ułożył fragmenty [Glossary('szkła witrażowego','POT_METAL_GLOSS')] na bielonych stołach, byśmy mogli obejrzeć propozycje projektów.\n\n– To okno będzie znajdowało się naprzeciwko nawy – mówię. – Wszyscy mieszkańcy ziem znanych jako [province.GetNameNoTooltip] też będą mieć na nie widok, dlatego witraż musi przedstawiać…"
 pam_great_projects_events.0003.a: "Drzewo Jessego stojące na straży legitymacji rodu [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.a.flavor: "[Glossary('Drzewo Jessego','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni @dynasty_prestige_icon! [Concept('dynasty_prestige', 'renomę')|E] członkom [Concept('dynasty', 'dynastii')|E] odwiedzającym ją jako przywódcy [Concept('travel', 'podróży')|E]"
 pam_great_projects_events.0003.b: "Panel darczyńcy z twoim portretem i herbem."
 pam_great_projects_events.0003.b.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni @prestige_icon! [prestige|El] odwiedzającym"
 pam_great_projects_events.0003.c: "Sceny ukazujące cuda wśród pielgrzymów, by zachęcić wiernych do przybycia z daleka."
 pam_great_projects_events.0003.c.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni zwiększone [trait_level_track_xp|El] postaciom, które mają [Concept('trait', 'cechę')|E] [GetTrait('pilgrim').GetName( GetNullCharacter )|El]"
 pam_great_projects_events.0003.d: "Okno witrażowe z wizerunkiem Maryi i stojącą przed nim wieczną lampką."
 pam_great_projects_events.0003.d.flavor: "[blessed_mary.GetTitledFirstName] – przed jej wizerunkiem w szkle zawsze mają palić się olejna lampka i świece."
 pam_great_projects_events.0003.d.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni @stress_loss_icon! [Concept('stress_loss', 'redukcję stresu')|E] i [spiritual_fulfillment|El]"
 pam_great_projects_events.0003.d.dulia.tt: "Posiadanie dogmatu „[GetTenetType('tenet_dulia').GetBaseName]” jako [personal_tenet|El] zapewnia większe [spiritual_fulfillment|El] podczas wizyty"
 pam_great_projects_events.0003.e: "Cykl męczeństwa z rąk króla."
 pam_great_projects_events.0003.e.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni gorliwym odwiedzającym dodatkową @piety_icon! [piety|El] oraz @stress_loss_icon! [Concept('stress_loss', 'redukcję stresu')|E]."
 pam_great_projects_events.0003.e.owner_msg.title: "Męczeństwo uwiecznione w szkle"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName] zleca wykonanie witrażu z cyklem męczeństwa do [Concept('grand_cathedral', 'wielkiej katedry')|E]. Ten temat jeszcze bardziej pogłębia twoją wiarę."
 TREE_OF_JESSE_GLOSS: "Drzewo Jessego to drzewo genealogiczne Chrystusa wyrastające z leżącej postaci Jessego, ojca Dawida. Kościelne witraże przedstawiały biblijnych królewskich przodków obecnie rządzącej dynastii, wskazując na jej boskie pochodzenie. Najważniejsze przykłady znajdują się w katedrach w Chartres i Saint-Denis."
 POT_METAL_GLOSS: "Szkło witrażowe zabarwia się, topiąc je w tyglu razem z tlenkami metali, co umożliwia zabarwienie całej masy, a nie tylko jej powierzchni. Mistrzowie szklarscy lub witrażyści tną następnie wystudzone tafle na kawałki i układają je na bielonych deskach, by zobaczyć, jak będzie wpadać przez nie światło, zanim wprawią je w okno."
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: pierwszy kamień"
 pam_great_projects_events.0005.desc.intro: "Położono kamień węgielny! [owner.GetTitledFirstName] będzie świadkiem przeradzania się swojej siedziby w imponujący pomnik – jak żołądź, z którego wyrasta dąb. Każda cegła i każda deska będzie głosić chwałę [ROOT.Char.GetFaith.HighGodNamePossessive], co będą słyszeć wszyscy [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] zamieszkujący miejsce znane jako [owner.GetPrimaryTitle.GetNameNoTier], a także wyznawcy Chrystusa spoza tego kraju.\n\nHojność fundatora będzie rozbrzmiewać z dzwonów i znajdzie się na ustach każdego wiernego."
 pam_great_projects_events.0005.desc.contributor: "\n\n[cathedral_building.GetName] to naprawdę wspaniały projekt, a co istotne, wkład osoby znanej jako [optional_contributor.GetTitledFirstName] – [contribution.GetName] – przyczyni się do jego uwiecznienia."
 pam_great_projects_events.0005.desc.outro: "Niech rozpoczną się prace!"
 pam_great_projects_events.0005.a: "„Nasze dzieci dożyją końca prac”."
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: w Boskim porządku"
 pam_great_projects_events.0006.desc.intro_architect: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))|U] [architect.GetFirstName] wskazuje"
 pam_great_projects_events.0006.desc.intro_no_architect: "Patrzę na"
 pam_great_projects_events.0006.desc.intro: "drewniane paliki, połączone ciasno naciągniętym sznurkiem, tworzące zarys ogromnego krzyża – taki kształt będzie miał budynek, który tu powstaje."
 pam_great_projects_events.0006.desc.steward_founder: "\n\nZnam ten proces z moich studiów!\n\n– Zapewne stosujecie $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n– Lecz jak można zaplanować tak ogromną budowlę? – pytam."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n– Stosujemy $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "metodę [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! Nasz Pan zapewnił nam boski porządek, a wykorzystując kwadrat, możemy obliczyć proporcje budynku znacznie większego niż [ROOT.Char.Custom('ResidenceBuilding')] czy inna, największa nawet budowla."
 pam_great_projects_events.0006.desc.foundations: "\n\nWidzę, że wkrótce rozpocznie się kopanie fundamentów."
 pam_great_projects_events.0006.a: "Wykop kryptę dla przodków z dynastii [founder.GetDynastyNameNoTooltip]"
 pam_great_projects_events.0006.a.tt: "W [Concept('cathedral_complex', 'kompleksie katedralnym')|E], którym zarządza [owner.GetShortUINameNotMe], powstaje [GetDomicileBuilding('cathedral_crypt_01').GetName|Vl] ku czci [Concept('dynasty', 'dynastii')|E] [founder.GetDynastyName]"
 pam_great_projects_events.0006.b: "Powiększ nawę, by pomieścić pielgrzymów."
 pam_great_projects_events.0006.b.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni wyższe [trait_level_track_xp|El] [GetTrait('pilgrim').GetName( GetNullCharacter )|l] oraz zwiększoną @piety_icon! [piety|El] odwiedzającym pielgrzymom"
 pam_great_projects_events.0006.c: "Jedynie sam Bóg może kierować biegiem wydarzeń."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#! – po łacinie oznacza „według kwadratu”. Średniowieczni mistrzowie kamieniarscy projektowali plan budowli za pomocą systemów prostych proporcji. Używali stosunku boku kwadratu do jego przekątnej. Prostokąt, którego boki miały takie proporcje, był uważany za harmonijny. Z tej podstawowej jednostki kamieniarz mógł zaprojektować serię większych i mniejszych kwadratów i prostokątów, mając pewność, że każdy element będzie pasował do kolejnego."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: żebra Niebios"
 pam_great_projects_events.0007.desc.intro_architect: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))|U] [architect.GetFirstName] wiedzie mnie przez gęsty las belek. Rusztowanie katedry przypomina pełnoprawny, drewniany kościół i dźwiga na swych barkach kamieniarzy, którzy w pocie czoła pracują nad kamiennym sklepieniem."
 pam_great_projects_events.0007.desc.intro_no_architect: "Przechadzam się przez gęsty las belek. Rusztowanie katedry przypomina pełnoprawny, drewniany kościół i dźwiga na swych barkach kamieniarzy, którzy w pocie czoła pracują nad kamiennym sklepieniem."
 pam_great_projects_events.0007.desc.architect: "\n\n– Gdy te sklepienia zostaną ukończone, staną się schronieniem dla wiernych przed żywiołami, a także uniosą nasze modlitwy prosto do nieba."
 pam_great_projects_events.0007.desc.architect_says: "– Tak mówi [architect.GetName]."
 pam_great_projects_events.0007.desc.outro: "\n\nGdy patrzę na ukończone sklepienie wykuszu, przywodzi mi ono na myśl żebra wielkiej ryby, która połknęła Jonasza. Tak wielka jest chwała Domu Bożego, że potrafi on przenieść człowieka na dno morza lub do gwiazd."
 pam_great_projects_events.0007.a: "Udekoruj sklepienie nocnym niebem."
 pam_great_projects_events.0007.a.tt: "Gdy [grand_cathedral|El] zostanie ukończona, jej [point_of_interest|El] zapewni ulepszone [trait_level_track_xp|El] postaciom, które mają [Concept('trait', 'cechę')|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]"
 pam_great_projects_events.0007.b: "Wygłoś kazanie na temat skruchy na miarę Jonasza."
 pam_great_projects_events.0007.b.tt: "Twoja [faith|E] zyskuje @fervor_icon! #P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! pkt [Concept('fervor', 'gorliwości')|E]"
 pam_great_projects_events.0007.c: "Niech kamieniarze biorą się do pracy."
 fervor_gain_cathedral_jonah_sermon: "Wygłoszono kazanie na temat skruchy na placu budowy [Concept('grand_cathedral', 'wielkiej katedry')|E]"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: odlewanie głosu Boga"
 pam_great_projects_events.0008.desc.intro: "Budowa idzie dobrze, lecz katedrze brakuje głosu, który wzywałby wiernych z całego terenu znanego jako [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName] mówi, że musimy odlać ogromny dzwon z brązu."
 pam_great_projects_events.0008.desc.no_architect: "\n\nMusimy odlać dzwon."
 pam_great_projects_events.0008.desc.need_bell: "To przedsięwzięcie jest drogie i ryzykowne: [founder.GetPrimaryTitle.GetNameNoTier] i skarbiec wciąż nie mogą pozbierać po tym, ile wydano na same materiały."
 pam_great_projects_events.0008.desc.plague_named: "\n\nNiestety ludwisarz zmarł podczas zarazy znanej jako [epidemic.GetName|l]."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nNiestety ludwisarz zmarł podczas ostatniej zarazy."
 pam_great_projects_events.0008.desc.outro: "Jego syn, [bell_maker_son.GetFirstName], zapewnia mnie, że jego ojciec przekazał mu swoją tajemną wiedzę na łożu śmierci, i że on sam potrafi odlać dzwon."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\nStaje przede mną [bell_maker_son.GetFirstName], ambitny młody kowal szkolony pod okiem miejscowego mistrza. Pragnie udowodnić swoje umiejętności, odlewając dzwon godny budowli o nazwie [cathedral_building.GetName] w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.a: "Jeśli mu się nie uda, zabiję go."
 pam_great_projects_events.0008.a.tt: "Jeśli nie uda się odlać dzwonu, [bell_maker_son.GetShortUINameNotMe] zostanie stracony"
 pam_great_projects_events.0008.belltower_may.tt: "W [Concept('cathedral_complex', 'kompleksie katedralnym')|E], którym zarządza [owner.GetShortUINameNotMe], może powstać [GetDomicileBuilding('cathedral_belltower_02').GetName|Vl]"
 pam_great_projects_events.0008.aa: "Jeśli zawiedzie, obiję go tak, że ciało odpadnie mu od kości."
 pam_great_projects_events.0008.b: "Mógłby stać się narzędziem Pana."
 pam_great_projects_events.0008.b.tt: "[bell_maker_son.GetShortUINameNotMe] – to w tej osobie pokładasz wiarę, że odleje dzwon"
 pam_great_projects_events.0008.b.flavor: "Czy Dawid nie był jedynie młodym pasterzem, gdy ubił Goliata?"
 pam_great_projects_events.0008.c: "Znajdź bezpieczne rozwiązanie, nawet jeśli nie będzie to syn mistrza."
 pam_great_projects_events.0008.duel.success: "Odlanie dzwonu się powiodło! W [Concept('cathedral_complex', 'kompleksie katedralnym')|E], którym zarządza [owner.GetShortUINameNotMe], powstanie [GetDomicileBuilding('cathedral_belltower_02').GetName|Vl]"
 pam_great_projects_events.0008.duel.failure: "Odlew się nie udał… Musisz zadecydować, co teraz"
 pam_cathedral_bell_casting_duel: "[learning|E] osoby znanej jako [CHARACTER.GetShortUINameNotMe]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUINameNotMe]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUINameNotMe]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUINameNotMe]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUINameNotMe]:\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: i przemówił Bóg"
 pam_great_projects_events.0009.desc.body: "Patrzę, jak [bell_maker_son.GetFirstName] biega w tę i z powrotem, mobilizując pracowników.\n\nNieustannie podważa decyzje robotników swego ojca, nalegając, że sam wybierze miejsce na dół odlewniczy, odpowiednią glinę na formę oraz opał do pieców."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] i ja patrzymy, jak [bell_maker_son.GetFirstName] biega w tę i z powrotem, mobilizując pracowników.\n\nNieustannie podważa decyzje robotników swego ojca, nalegając, że sam wybierze miejsce na dół odlewniczy, odpowiednią glinę na formę oraz opał do pieców."
 pam_great_projects_events.0009.desc.success_end: "\n\nPłynny brąz z łatwością wpływa do formy, jak gdyby prowadziła go ręka Boga, a potem wychodzi z formy w całości. Dzwon zostaje wciągnięty na górę i wydaje z siebie dźwięk, którzy wszyscy [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] rozumieją jako:\n\n„Przybywajcie do domu Pana!”."
 pam_great_projects_events.0009.a: "Niech [province.Custom('GetTerrainType')|l] miejsca znanego jako [province.GetNameNoTooltip] też usłyszy głos Boga."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: zwiastun zagłady!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nStopiony brąz w formie wydaje dźwięk przypominający wrzask, ale wychodzi z niej w całości. Dzwon zostaje wciągnięty na górę i rozkołysany, ale gdy jego serce uderza w wieniec, słychać jedynie głuche uderzenie, a potem pęknięcie. To zwiastun zagłady!"
 pam_great_projects_events.0010.a: "Obietnic należy dotrzymywać."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUINameNotMe] ginie"
 pam_great_projects_events.0010.b: "Pęknięty dzwon to dostateczna kara."
 pam_great_projects_events.0010.b.faith: "Bóg ma jeszcze dla niego plan."
 pam_great_projects_events.0010.c: "Stop brąz i wykuj coś porządniejszego."
 pam_great_projects_events.0010.c.tt: "Pęknięty dzwon zostaje przekuty na narzędzie tortur, a [bell_maker_son.GetShortUINameNotMe] to jego pierwsza ofiara. Rzemieślnicy, których w przyszłości wykształci miejsce znane jako [founder.GetCapitalLocation.GetNameNoTooltip], będą bardziej posłuszni."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Zyskujesz zamiast tego [experience|El] w [Concept('intrigue_lifestyle', 'intryganckim stylu życia')|E]"
 pam_great_projects_events.0010.d: "Niech to będzie lekcja pokory."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: jak za sprawą samego Boga"
 pam_great_projects_events.0011.desc.intro: "Gdy sprawdzam postępy projektu znanego jako [cathedral_building.GetName] w miejscu o nazwie [province.GetNameNoTooltip], moje uszy przeszywa nieznośny pisk ogromnej, obracającej się drewnianej konstrukcji."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] wskazuje mi gigantyczne koło deptakowe, w którym chodzi dwóch robotników."
 pam_great_projects_events.0011.desc.no_architect: "\n\nDostrzegam źródło hałasu – gigantyczne koło deptakowe, w którym chodzi dwóch robotników."
 pam_great_projects_events.0011.desc.outro: "\n\nJak za sprawą samego Boga jego sznury i podnośniki wciągają wielkie bloki dopiero co obrobionych [Glossary('ciosów','ASHLAR_GLOSS')] i wiadra zaprawy na konstruowany właśnie dach. Z podziwem przyglądam się ciężarom, pod którymi złamałyby się kręgosłupy robotników pracujących na dole."
 pam_great_projects_events.0011.a: "Jako [founder.GetCulture.GetCollectiveNounNoTooltip] musimy jak najlepiej wykorzystać to wielkie koło."
 pam_great_projects_events.0011.a.tt: "Twoja [culture|El] zyskuje @culture_icon! #P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! pkt postępu w kierunku swojej obecnej [Concept('cultural_fascination', 'fascynacji kulturowej')|E]"
 pam_great_projects_events.0011.b: "Mogłoby na tym skorzystać wiele projektów w mieście znanym jako [founder.GetCapitalLocation.GetNameNoTooltip]."
 pam_great_projects_events.0011.c: "To imponujące, ale wolę zostawić takie czyny naszemu Panu."
 ASHLAR_GLOSS: "Ciosy to precyzyjnie wycięte i obrobione kamienie, wygładzone i o prostych krawędziach. Sprawienie, by wciągnięte na wysokość konieczną do budowy katedry kamienie przylegały do siebie, wymagało dokładnych obliczeń."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: wyższe powołanie"
 pam_great_projects_events.0013.desc: "Stukot ciesielskich młotków odbija się echem, niczym zapowiedź dźwięków, które niebawem otoczą wiernych Słowem Bożym. [architect.GetFirstName] wyjaśnia:\n\n– Ma być to skromny podest, z którego kanonicy będą prowadzić liturgię, nasza własna [Glossary('empora','CANTORIA_GLOSS')]! Zaiste, zwracając się do Pana, musimy mówić innym głosem niż do bliźnich. [architect.GetFirstName] przywołuje następnie chłopca z chóru o imieniu [choir_boy.GetFirstName].\n\nDziecko wspina się po rusztowaniu i wydaje z siebie anielski wręcz dźwięk – odbija się on od ścian i wnika w me ciało, jak gdyby sam Bóg przeze mnie przeszedł."
 pam_great_projects_events.0013.a: "Powiększ podest – im więcej głosów, tym lepiej."
 pam_great_projects_events.0013.b: "Ten anioł musi zaszczycić swym głosem mój dwór."
 pam_great_projects_events.0013.castrato: "Zachowaj ten głos dla empory Pana."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUINameNotMe] przechodzi kastrację, aby [choir_boy.Custom('PL_jego_jej')] głos się nie załamywał"
 pam_great_projects_events.0013.c: "Te wybryki to podstęp, by wycisnąć ze mnie więcej pieniędzy!"
 pam_great_projects_events.0013.d: "Odczuwam przytłoczenie i muszę stąd wyjść."
 CANTORIA_GLOSS: "Empora to podwyższona galeria do śpiewania w kościele, zazwyczaj usytuowana nad chórem lub w pobliżu przejścia, gdzie chórzyści, a później organy, prowadzą liturgię."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: Jego niesłabnąca miłość"
 pam_great_projects_events.0012.desc: "Zachodnia fasada jest gotowa! Jej portal czeka już, by wpuścić wiernych przez [Glossary('narteks','NARTHEX_GLOSS')]. Budowa projektu takiego jak [cathedral_building.GetName] może i zajmuje całe ludzkie życie, ale dobrzy chrześcijanie z miejsca znanego jako [owner.GetPrimaryTitle.GetNameNoTier] muszą pokładać wiarę w przyszłość niesłabnącej miłości Boga. Moje kazanie właśnie się rozpoczyna…\n\n#EMP „[ROOT.Char.Custom('RandomBibleQuote')]”#!\n\n…I z tą lekcją z Pisma Świętego ich pozostawię."
 NARTHEX_GLOSS: "Narteks to przedsionek kościoła, znajdujący się między zachodnimi drzwiami a nawą. Witał wiernych w świętej przestrzeni, a w bardziej surowych obrządkach oddzielał pokutników i katechumenów od reszty kongregacji podczas mszy."
 pam_great_projects_events.0012.a: "„Błogosławieni, którzy niosą pokój…”"
 pam_great_projects_events.0012.a.flavor: "„[Glossary('…albowiem synami Bożymi zostaną nazwani.','MATTHEW_5_9_GLOSS')]”"
 pam_great_projects_events.0012.a.tt: "Każde [county|El], w którym wyznawana jest wiara [owner.GetFaith.GetAdjective|l], w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier], zyskuje modyfikator „[GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]” na #V 10 lat#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "„Do mrówki tedy się udaj, leniwcze…”"
 pam_great_projects_events.0012.b.flavor: "„[Glossary('…drogi jej rozważaj, abyś rozumu nabrał.','PROVERBS_6_6_GLOSS')]”"
 pam_great_projects_events.0012.b.tt: "Każde [county|El], w którym wyznawana jest wiara [owner.GetFaith.GetAdjective|l], w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier], zyskuje modyfikator „[GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]” na #V 10 lat#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "„Dlatego proszę was, bracia i siostry…”"
 pam_great_projects_events.0012.c.flavor: "„[Glossary('…w imię naszego Pana Jezusa Chrystusa, aby panowała między wami zgoda, by nie rodziły się podziały, lecz byście trwali w jedności myśli i ducha.','1_CORINTHIANS_1_10_GLOSS')]”"
 pam_great_projects_events.0012.c.tt: "Każde [county|El], w którym wyznawana jest wiara [owner.GetFaith.GetAdjective|l], w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier], zyskuje modyfikator „[GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]” na #V 10 lat#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "„Zawsze się radujcie, nie ustawajcie w modlitwie…”"
 pam_great_projects_events.0012.d.flavor: "„[Glossary('…w każdej sytuacji okazujcie wdzięczność – taką wolę wobec was wyraża Bóg w Chrystusie. Ducha nie tłamście i nie odrzucajcie daru proroctwa.','1_THESSALONIANS_5_16_20_GLOSS')]”"
 pam_great_projects_events.0012.d.tt: "Każde [county|El], w którym wyznawana jest wiara [owner.GetFaith.GetAdjective|l], w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier], zyskuje modyfikator „[GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]” na #V 10 lat#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "„Biegnijmy wytrwale w wyścigu, jaki został nam wyznaczony…”"
 pam_great_projects_events.0012.e.flavor: "„[Glossary('Odrzućmy wszystko, co nas obciąża, zwłaszcza grzech, który tak łatwo nas zwodzi, i biegnijmy wytrwale w wyścigu, jaki został nam wyznaczony.','HEBREWS_12_1_GLOSS')]”"
 pam_great_projects_events.0012.e.tt: "Każde [county|El], w którym wyznawana jest wiara [owner.GetFaith.GetAdjective|l], w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier], zyskuje modyfikator „[GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V]” na #V 10 lat#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "„Dłoń swą otwiera przed ubogim…”"
 pam_great_projects_events.0012.f.flavor: "„[Glossary('…ku nędzarzowi wyciąga ramiona.','PROVERBS_31_20_GLOSS')]”"
 pam_great_projects_events.0012.f.tt: "Każde [county|El], w którym wyznawana jest wiara [owner.GetFaith.GetAdjective|l], w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier], zyskuje modyfikator „[GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V]” na #V 10 lat#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak [rulers|E] wiary o nazwie [owner.GetFaith.GetName|l] w [Concept('archdiocese', 'archidiecezji')|E] będą [behave|El] bardziej honorowo i miłosiernie#!#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak [rulers|E] wiary o nazwie [owner.GetFaith.GetName|l] w [Concept('archdiocese', 'archidiecezji')|E] będą [behave|El] staranniej i energiczniej#!#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak [rulers|E] wiary o nazwie [owner.GetFaith.GetName|l] w [Concept('archdiocese', 'archidiecezji')|E] będą [behave|El] bardziej towarzysko i honorowo#!#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak [rulers|E] wiary o nazwie [owner.GetFaith.GetName|l] w [Concept('archdiocese', 'archidiecezji')|E] będą [behave|El] bardziej miłosiernie i mniej pazernie#!#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak [rulers|E] wiary o nazwie [owner.GetFaith.GetName|l] w [Concept('archdiocese', 'archidiecezji')|E] będą [behave|El] bardziej gorliwie i okazywać silniejszą wiarę#!#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak [rulers|E] wiary o nazwie [owner.GetFaith.GetName|l] w [Concept('archdiocese', 'archidiecezji')|E] będą [behave|El] bardziej gorliwie i energicznie#!#!"
 pam_cathedral_west_portal_sermon_toast: "Kazanie w katedrze w miejscu znanym jako [owner.GetPrimaryTitle.GetNameNoTier]"
 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: zwieńczenie iglic"
 pam_great_projects_events.0020.desc: "W końcu krzyże zostały umieszczone na iglicach. Każdy z nich przypomina ten niesiony dawno temu przez Chrystusa na wzgórze [Glossary('Golgota','GOLGOTHA_GLOSS')]. Są one przypomnieniem Jego męki dla naszego zbawienia oraz obietnicą, że w każdy szabat Jego krew będzie płynąć, by oczyścić nas z grzechów.\n\nOd początku budowy synowie stali się ojcami, a ojcowie – starcami spoczywającymi w ziemi. Ich szlachetny wysiłek, ich pot i krew zostały jednak uwiecznione w kamieniu.\n\nImperia upadają, ale zdobiący ziemię znaną jako [province.GetName] wspaniały projekt – [cathedral_building.GetName] – będzie trwać wiecznie niczym miłość Boża."
 pam_great_projects_events.0020.a: "Z bliska i z daleka – przybywajcie do nas na modlitwę!"
 GOLGOTHA_GLOSS: "Golgota, po łacinie #EMP Calvariae locus#! czyli „miejsce czaszki”, była wzgórzem w kształcie czaszki w rządzonej przez Rzymian Jerozolimie i miejscem ukrzyżowania Jezusa. Egzekucja odbyła się poza murami miasta, niedaleko grobu, w którym Chrystus został pochowany. Miejsce to znajduje się obecnie w bazylice Grobu Świętego, a w pobliżu stoi również [GetBuilding('dome_of_the_rock_01').GetName|Vl]."
 poi_grand_cathedral_visit: "Odwiedzono katedrę w miejscu o nazwie [province.GetNameNoTooltip]"
 great_project_base_contribution_cost_desc: "Koszt podstawowy"
