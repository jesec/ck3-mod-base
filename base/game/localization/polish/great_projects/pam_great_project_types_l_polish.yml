 great_project_type_pam_mass_rite_conversion: "Masowe nawrócenie"
 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "Dysponując odpowiednimi zasobami, możemy nieść światło Pana nie tylko pojedynczym poganom, lecz całym pogańskim [Concept('realms', 'państwom')|E]. Dzięki naszym naukom poznają najsłuszniejszy [rite|El], a tym samym przyczynią się do rozwoju [Concept('christendom', 'wspólnoty państw chrześcijańskich')|E]."
 great_project_type_pam_mass_rite_conversion_desc_generic: "Dysponując odpowiednimi zasobami, możemy dotrzeć z przekazem naszej wiary nie tylko do pojedynczych nawróconych, ale do całych [Concept('realms', 'państw')|E], w których wrogie [faiths|El] wciąż dzierżą władzę. Dzięki naszym naukom ich lud pozna prawowity [rite|El], a my umocnimy naszą wspólnotę na tych ziemiach."
