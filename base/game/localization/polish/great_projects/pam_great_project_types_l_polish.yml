l_polish:
 great_project_type_pam_cathedral_01: "Wznieś wielką katedrę romańską"
 great_project_type_pam_cathedral_01_desc: "Umieść lśniący krzyż na mocnych kamiennych murach, umieść go na majestatycznych kopułach i wysokich wieżach! Sprowadź cudowne światło Niebios na Ziemię, by padało na święty tron i ołtarz prałata.\n\nPo wielu latach szlachetnej pracy wspaniałe światło wreszcie olśni wyznawców z bliska i daleka."
 great_project_type_pam_cathedral_02: "Wznieś gotycką wielką katedrę"
 great_project_type_pam_cathedral_02_desc: "Niech strzeliste łuki pną się w górę, a witraże zapłoną kolorami!\n\nTa szlachetna katedra odrodzi się niczym Łazarz i wprowadzi nas w nowy wiek."
 great_project_type_pam_cathedral_03: "Wznieś płomienistą wielką katedrę"
 great_project_type_pam_cathedral_03_desc: "Niech ozdobne maswerki i kamienne zawijasy staną się koroną dla świętego ognia, albowiem oznacza on nowe rządy dla tej chwalebnej budowli!\n\nDzięki rozbudowie [GetBuilding('great_project_cathedral_02').GetName|Vl] stanie się budowlą znaną jako [GetBuilding('great_project_cathedral_03').GetName|Vl], której iglice będą prowadzić wiernych do końca świata."
