l_polish:
 #Descs
 fled_riot_at_races_memory_desc: "udało mi się uciec w bezpieczne miejsce, gdy na torze wyścigowym, na którym odbywał się mój turniej, wybuchły zamieszki, w wyniku których wielu gości zostało rannych"
 fled_riot_at_races_memory_desc_second_perspective: "udało ci się uciec w bezpieczne miejsce, gdy na torze wyścigowym, na którym odbywał się twój turniej, wybuchły zamieszki, w wyniku których wielu gości zostało rannych"
 fled_riot_at_races_memory_desc_third_perspective: "osobie znanej jako [owner.GetName] udało się uciec w bezpieczne miejsce, gdy na torze wyścigowym, na którym odbywał się jej turniej, wybuchły zamieszki, w wyniku których wielu gości zostało rannych"
 failed_riot_at_races_memory_desc: "nie udało mi się powstrzymać szalejącego tłumu, który zrujnował moje wyścigi i zranił wielu gości"
 failed_riot_at_races_memory_desc_second_perspective: "nie udało ci się powstrzymać szalejącego tłumu, który zrujnował twoje wyścigi i zranił wielu gości"
 failed_riot_at_races_memory_desc_third_perspective: "osobie znanej jako [owner.GetName] nie udało się powstrzymać szalejącego tłumu, który zrujnował jej wyścigi i zranił wielu gości"
 calmed_the_crowd_memory_desc: "siłą elokwencji i ważkimi argumentami udało mi się uspokoić rozszalały tłum"
 calmed_the_crowd_memory_desc_second_perspective: "siłą elokwencji i ważkimi argumentami udało ci się uspokoić rozszalały tłum"
 calmed_the_crowd_memory_desc_third_perspective: "dzięki wspaniałej przemowie i rozmaitym darom osobie znanej jako [owner.GetName] udało się uspokoić rozszalały tłum"
 #Titles
 fled_riot_at_races_memory: "ucieknięto przed zamieszkami podczas wyścigu"
 failed_riot_at_races_memory: "nie zdołano powstrzymać wściekłego tłumu przed gwałtownymi zamieszkami"
 calmed_the_crowd_memory: "uspokojono rozszalały tłum piękną przemową"
