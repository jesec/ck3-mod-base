 situation_guelph_ghibelline_phase_in_nomine_domini: "Papal Resurgence"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "This [GetSituation('guelph_ghibelline').GetName] [situation_phase|E] is a relatively dormant period of time with few immediate ramifications.\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "In approximately [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1' ), 'year', 'years' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1' ), 'month', 'months' ) )], the situation will escalate and enter the [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] [situation_phase_phase|E]"
 gg_nomine_domini_transition_desc: "While most of the principles of the Dictatus Papae (...)"

