 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main' )]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "The leader of the [guelphs|E] in the [GetSituation('guelph_ghibelline').GetName] [situation|E].\n\nDuring the [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] and [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] Prelude [situation_phase|E]s, the $religiousheadname_pope$ leads the [guelphs|E] and the struggle escalates along historical lines. A leader's own [decisions|E] only become available once the Prelude gives way to open conflict.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "The leader of the [guelphs|E] in the [GetSituation('guelph_ghibelline').GetName] [situation|E].\n\nThis leader wields unique [decisions|E] to steer the conflict:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! and #V $guelph_ghibelline_conflict_decision$#! to move the [situation|E] between its calmer and more conflict-driven [situation_phase|E]s\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#! to end the Situation in favor of the [guelphs|E] while they hold the advantage\n$BULLET_WITH_TAB$A decision to step down and pass leadership to a suitable supporter$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "$ghibelline$ Leader"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "The leader of the [ghibellines|E] in the [GetSituation('guelph_ghibelline').GetName] [situation|E].\n\nDuring the [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] and [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] Prelude [situation_phase|E]s, the ruler of [GetTitleByKey('e_hre').GetName] leads the [ghibellines|E] and the struggle escalates along historical lines. A leader's own [decisions|E] only become available once the Prelude gives way to open conflict.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "The leader of the [ghibellines|E] in the [GetSituation('guelph_ghibelline').GetName] [situation|E].\n\nThis leader wields unique [decisions|E] to steer the conflict:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! and #V $guelph_ghibelline_conflict_decision$#! to move the [situation|E] between its calmer and more conflict-driven [situation_phase|E]s\n$BULLET_WITH_TAB$#V $ghibelline_victory_decision$#! to end the Situation in favor of the [ghibellines|E] while they hold the advantage\n$BULLET_WITH_TAB$A decision to step down and pass leadership to a suitable supporter$gg_leader_group_help$"
