 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "In the name of the Lord — A papal bull written by $religiousheadname_pope$ Nicolaus II on April 13th 1059. It was a source of major reforms to the papal elections at the time, of which the most notable one is the exclusion monarchs in the election and confirmation process, making the Cardinal-Bishops the sole electors."
 DICTATUS_PAPAE_GLOSS: "Papal Dictation — A compilation of 27 statements of authority claimed by the $religiousheadname_pope$. It was dictated by $religiousheadname_pope$ Gregorius VII in the year 1075, around the same period of time that the Investiture Controversy arose."

