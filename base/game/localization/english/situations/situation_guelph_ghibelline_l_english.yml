 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "Dictatus Papae"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "This [GetSituation('guelph_ghibelline').GetName] [situation_phase|E] is an escalation of the former [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] Phase.\n\nNow the relationship between the monarchs and their ecclesiastical vassals hardens, as the vassals are torn one way by the $religiousheadname_pope$ claiming to have universal power and another way by their lieges, wanting to maintain their sovereignty.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "In approximately [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), 'year', 'years' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), 'month', 'months' ) )], the situation will escalate and enter either the [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] or [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName] [situation_phase_phase|E]"
 gg_dictatus_papae_transition_desc: "While most of the principles of the Dictatus Papae (...)"
 
