l_english:

  # Building Needs

 REACTIVE_ADVICE_BUILDING_NEEDS: "Building Needs"
 action_reactive_advice_building_needs: "Advice: $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "Your [buildings|E] have [needs|E] for [trade_goods|E] supplied from the local [market|E]. Open this to learn how to meet these needs."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"

 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "If you want to get the most out of the [buildings|E] in your [domain|E], you should ensure they have access to the [trade_goods|E] they need.\n\nLet's have a look at how to do that!"

 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "First, we should have a look at your [domain|E]."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Open the Domain Tab in the Realms Panel (highlighted)"

 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "These are all your [holdings|E] in your [domain|E].\n\nThe [county|E] of each Holding is part of a [market|E]. All the [goods|E] produced and consumed by [buildings|E] are exchanged in these Markets." 

 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "Now, let's have a look at one of your [holdings|E]."
 reactive_advice_building_needs_step_open_county_view_prompt: "Click on one of your Holdings (highlighted)"

 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "These are the [districts|E] of your [holding|E]. Inside each District are the [buildings|E] that produce and consume [goods|E]."

 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "As an example, we can look at the [needs|E] of your [holding_district|E]."
 reactive_advice_building_needs_step_open_district_view_prompt: "Click on the $game_concept_holding_district$ (highlighted)#!"

 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "Here you can see the effects of each [building|E] in the [district|E].\n\nCertain effects need to consume [trade_goods|E] from the [county|E]'s [market|E] in order to be active.\n\nFor example, the [holding_district|E] provides [food_supply|E] to the [holding|E], if it can consume [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon] and [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon].\n\nThere are no ill effects of not fulfilling a [need|E], and all $game_concept_buildings$ will provide some benefit even if they do not have access to the $game_concept_trade_goods$ they need." 

 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "Often, a specific [trade_good|E] is not needed, but instead any combination of $game_concept_goods$ of a certain [trade_category_short|E] is enough. For example, a [building|E] may need [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon], which means that either [GetTradeGoodType('trade_good_grain').GetNameWithIcon], [GetTradeGoodType('trade_good_millet').GetNameWithIcon] or [GetTradeGoodType('trade_good_rice').GetNameWithIcon] will do.\n\nIn addition, some [needs|E] can be provided multiple times; each time the amount is met, the effect is applied again."


 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "So, [buildings|E] need [trade_goods|E], but where do they come from? \n\nEach Trade Good consumed in a [county|E] comes from that County's [market|E]."
 reactive_advice_building_needs_step_open_market_view_prompt: "Open the Market of the County (highlighted)#!"

 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "This is the [market|E] of the [county|E]. Usually, the Market covers the same [counties|E] as a [duchy|E]."

 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "Here you can see each [trade_good|E], and if there is a [surplus|E] or unmet [need|E] for it.\n\nIf there is an unmet Need (#N negative balance#!), not all [buildings|E] in the [market|E] are receiving their [needs|E].\n\nIf there is a Surplus (#P positive balance#!), all [buildings|E] in the Market have their Need for that Trade Good fulfilled, and the Good can be exported via [trade_routes|E].\n\n#I You can click on a $game_concept_trade_good$ to see its status in the Market and on the map.#!"

 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "If there is an unmet [need|E], you can try to meet it in various ways:\n\n$BULLET_WITH_TAB$Construct [buildings|E] in the [market|E] that produce the [trade_good|E].\n$BULLET_WITH_TAB$Set up a [distribution_route|E] between two $game_concept_markets$ in your [realm|E].\n$BULLET_WITH_TAB$Commission one of your [client_merchants|E] to import the $game_concept_trade_good$.\n\nHowever, not all $game_concept_needs$ can be met easily, and sometimes it is best to leave the $game_concept_need$ unmet."

  # Construction Queue

 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Queue Constructions"
 action_reactive_advice_construction_queue: "Advice: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "You have queued a construction. Open this to learn how to manage all your constructions."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"

 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "You have queued a construction!\n\nEven if you cannot afford a [building|E] right now, you can still queue it to be built once you can.\n\nLet's have a look at your queue."
 reactive_advice_construction_queue_intro_prompt: "Open the $BUILD_QUEUE_WINDOW_TITLE$ Panel (highlighted)"

 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "These are all the constructions you have queued so far, in all your [holdings|E].\n\nOnce you can pay its cost, and all other requirements are met, the cost will be automatically paid and the construction will start.\n\nConstructions are started in the order queued, but you can drag and drop them here to reorder them."

 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "In case you want to save some [gold|E] or other resource, you can reserve it here.\n\nThis amount will not be used to start queued constructions, so that you always have a buffer to spend on emergencies."

 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "That's all there is to know about queuing constructions, happy building!"


 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Trade Routes"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"

 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "While others toil in the fields or tax the poor, you profit from the flow of [goods|E].\n\n[trade_routes|E] are the main way [merchants|E] and [republics|E] earn [gold|E]."

 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "First, you must decide what [trade_good|E] to trade.\n\nThese are recommended to you, but you can also see all Trade Goods if you are looking for something specific."

 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "On the map, you can see all [markets|E] that trade your selected [trade_good|E].\n\nTo make a trade, you need to connect a Market with a [surplus|E] of Goods (#trade_surplus teal#!), with a place that has a [need|E] for it (#trade_need gold#!).\n\nIf a Market is crowded with other [merchants|E], you can only trade in a portion of the Goods there, limited by your [competitiveness|E].\n\nBy buying low and selling high, you can make a greater profit.\n\n#I Click on Markets to add or remove them from the Route.#!"

 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "When you add [markets|E] to your [route|E], the selected [good|E] will be carried by the Route and shown here.\n\nThe leftmost good is the [primary_good|E]; you gain [trade_expertise|E] for trading in it. Over time, this will grant you various benefits depending on its [trade_category|E].\n\n#I If you carry more than 1 Good, you can drag another to the first position to make it the $game_concept_primary_good$.#!"

 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "You can only carry so many types of [goods|E], and only a certain total [capacity|E].\n\nAny limits like this can be improved by constructing [company_buildings_short|E] in your [company|E]."

 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "In a similar way, Routes are limited by [trade_route_length|E], and you only stop at a limited number of [markets|E]."

 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "Finally, you can assign one of your [associates|E] as a [trader|E]. Depending on which task you give them, they will improve different aspects of the [route|E]."

 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "As you develop your [company|E], you will gain access to more [routes|E], and improve how far they can go and how much you can trade.\n\nThis way, you can make more and more [gold|E]!"

 
 # Merchant Government introduction

 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Being a Merchant"
 action_reactive_advice_merchant_introduction: "Advice: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "You are a [merchant|E]! Open this to learn the basics of business."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"

 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "You are a [merchant|E]!\n\nWhile [trade|E] is the lifeblood of your [company|E], there is more to business than making money."

 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "We should begin by looking at how your [company|E] can grow over the long term."
 reactive_advice_merchant_introduction_open_overview_prompt: "Open the Overview Tab in the Realm Panel (highlighted)"

 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "This is your [company_size|E], the main measure of your $game_concept_company_possessive$ power.\n\nAs your $game_concept_company$ grows, higher [rank|E] [rulers|E] such as [kings|E] and [emperors|E] will take notice of you."

 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "This is your [company|E] [domicile|E], your base of operations.\n\nHere you can spend [gold|E] and [prestige|E] to construct [domicile_buildings|E] that further improve your $game_concept_company$."

 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "This is your [company_purpose|E], which determines the focus of your $game_concept_company$.\n\nThe Trader Purpose is the default, but you can change it to focus on [artifacts|E], luxuries or moneylending instead."

 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "Yet even as a [merchant|E], you are not free from the reign of local lords."
 reactive_advice_merchant_introduction_open_patronage_prompt: "Open the $MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$ Tab (highlighted)"

 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "This is your [merchant_patron|E], the [ruler|E] of the [holding|E] where your [domicile|E] is located.\n\nWhile you do have to pay taxes to your $game_concept_merchant_patron$, you can also benefit from this relationship.\n\nFor example, you can change your [client_contract|E] to ask your $game_concept_merchant_patron$ to support your trading efforts, or make proposing [marriages|E] to nobles easier."

 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "You are usually not the only [client|E] [merchant|E] of your [merchant_patron|E].\n\nOther $game_concept_clients$ will also trade out of the same location as you, and only one $game_concept_client$ can hold the special [charter|E]. Holding the $game_concept_charter$ will enhance your trading, in the form of special [decisions|E]."

 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "Finally, it's time to address the golden elephant in the room: making money."
 reactive_advice_merchant_introduction_open_trade_prompt: "Open the Trade Routes tab in the Trade Panel (highlighted)"
 
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "These are your [trade_routes|E], the main way that you earn [gold|E].\n\nAs you develop your $game_concept_company$, you will be able to have more $game_concept_routes$, that reach further, and move more [goods|E]. This will in turn earn you more $game_concept_gold$."

 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "This is the way of the [merchant|E]: Earn [gold|E] from your [trade_routes|E], and spend it to further your [prestige|E] and [company_size|E].\n\nBusinesses owned by responsible and organized $game_concept_merchants$ shall eventually surpass those owned by wealthy [rulers|E]!"

 # Company Direction

 REACTIVE_ADVICE_COMPANY_DIRECTION: "Company Direction"
 action_reactive_advice_company_direction: "Advice: $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "Over time, your [company_direction|E] may shift. Open this to learn more about it."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"

 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "Not all [merchants|E] have the same goals. While [gold|E] is power in itself, some hold family and nobility higher."

 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "Your [company_direction|E] is a part of your [house|E], so let us have a look."
 reactive_advice_company_direction_open_house_prompt: "Select your House (highlighted)"

 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "Continue to the [sentiment|E] Tab."
 reactive_advice_company_direction_open_direction_tab_prompt: "Open the Direction Tab (highlighted)"

 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "This is your [company_direction|E]. While it starts out as [company_sentiment_independent|E], it can tend toward either [company_sentiment_divided|E] or [company_sentiment_concerted|E].\n\nMarrying [noble|E] [houses|E] will tend it toward $game_concept_company_sentiment_concerted$, while marrying other [merchants|E] will tend it toward $game_concept_company_sentiment_divided$."

 # Sponsor Construction

 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Sponsor Construction"
 action_reactive_advice_sponsor_construction: "Advice: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "You can sponsor [buildings|E] in other [characters_possessive|E] [holdings|E]. Open this to learn how."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"

 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "You can now sponsor the upgrade of [buildings|E] in other [characters_possessive|E] [holdings|E]."
 reactive_advice_sponsor_construction_select_holding_prompt: "Select any Holding on the map"

 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "Now, select one of its [districts|E]."
 reactive_advice_sponsor_construction_open_district_prompt: "Select a District (highlighted)"

 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "Here you can sponsor a construction! Note that you can only #EMP upgrade#! [buildings|E], and only in the standard [districts|E].\n\nThe main reason for sponsorship is to either increase the [surplus|E] or [need|E] of a [trade_good|E] in the [holding_possessive|E] [market|E]. This way, you can connect the $game_concept_market$ to one of your [profit_routes|E] and increase the amount of [gold|E] you earn."

 
 # Republican Politics

 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Republican Politics"
 action_reactive_advice_republican_politics: "Advice: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "You are part of a [republic|E]. Open this to learn the intricacies of its politics."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"

 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "You, as the [house_head|E], are part of a virtuous [republic|E]!\n\nAs the leader of a [patrician_family|E], you rule together with other $game_concept_patrician_families$ in a somewhat democratic process. Even if you are not currently the [ruler|E] of the $game_concept_republic$, you can always participate, as long as you have the [gold|E] and influence."
 reactive_advice_republican_politics_intro_prompt: "Open the Overview tab in the Republic Panel (highlighted)"

 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "Just as its citizens, not all [republics|E] are equal. Each $game_concept_republic$ has a [title_tier|E], and a [republic_administration|E], as shown here.\n\nBy spending [prestige|E] and [treasury|E], the [ruler|E] can increase the $game_concept_title_tier$ of the $game_concept_republic$, and thus its power.\n\nThe current $game_concept_ruler$ can also change the $game_concept_republic_administration$, which determines the general direction of the $game_concept_republic$."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "Speaking of the [ruler|E], this is them!\n\nIn contrast with the tyranny of other [governments|E], the $game_concept_ruler$ of a [republic|E] is elected, and then only for a limited term.\n\nHowever, the same $game_concept_ruler$ can be re-elected, so it is not unusual for them to also be the leading candidate."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "The [ruler|E]'s power is tempered by the [assembly|E]. Let's have a look at it now."
 reactive_advice_republican_politics_open_assembly_prompt: "Open the Assembly tab (highlighted)"

 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "The [ruler|E] is not all-powerful: any [law|E] change or [republic_decree_short|E] must be approved by the [assembly|E]. $game_concept_assembly$ members can even propose their own $game_concept_law$ changes.\n\nThe $game_concept_assembly$ usually includes the [patrician_families|E] of the [republic|E]. While they don't have an ideology in the modern sense, they each have a [house_ambition|E] which affects how they vote.\n\nNote that a $game_concept_republic$ is not required to submit to the variety and disorder of democracy. As $game_concept_laws$ are passed, the power balance between the $game_concept_assembly$ and the $game_concept_ruler$ can change."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "As the [assembly|E] is often made up of [patrician_families|E], let's continue with them."
 reactive_advice_republican_politics_open_families_prompt: "Open the Families tab (highlighted)"

 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "These are the [patrician_families|E] of the [republic|E].\n\nEach Family, including yours, has a [patrician_rating|E]. As you increase your income from [trade|E] and get seats on the [assembly|E] or the [ruler|E]'s [council|E], your $game_concept_patrician_rating$ improves.\n\nHaving a high $game_concept_patrician_rating$ increases the effects of your [house_ambition|E], and can even let you overthrow the government!"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"

 reactive_advice_republican_politics_summary_desc: "The fate of the [republic|E] is in your hands.\n\nIt is up to you how you choose to shape it. Will you keep power only for your family, or share it with others?\n\nAs your [patrician_rating|E] grows from your [trade_routes|E], so does your power and influence."


 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"

 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "This is where you can create your own [distribution_routes|E].\n\nDistribution Routes allow you to move [trade_goods|E] to meet [needs|E] in [markets|E] inside of your own [realm|E]."

 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "While a [distribution_route|E] can carry any volume of [trade_goods|E], it can only move Goods which are considered [basic_trade_goods|E], which are shown here.\n\nAs such, you do not have to choose which $game_concept_trade_good$ to move.\n\n#I You may select any Basic Good to see its [market_balance|E] on the map#!"

 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "On the map, below the name of each [market|E], you can see which [basic_trade_goods|E] are in [surplus|E]. This means you can move Goods away from here."

 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "Likewise, any unmet [needs|E] are also shown. This means you can move [basic_trade_goods|E] to this [market|E]."

 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "A [distribution_route|E] can only connect two [markets|E], and [goods|E] travel in both directions.\n\nOnce you have added two Markets to the Route, you can see how the [needs|E] are met in the highlighted window.\n\nSince the Route moves through your own [realm|E], you do not have to pay the [buy_price|E] or any [tolls|E].\n\n#I To add or remove a Market from the Route, click on it on the map#!"
 
