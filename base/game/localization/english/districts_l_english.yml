l_english:
 DISTRICT_DEBUG_KEY: "#D DEBUG KEY:#! [DistrictType.GetKey]"
 DISTRICT_DEBUG_FULL: "#D DEBUG KEY AND DESC:#!\n[District.GetKey]\n[District.GetDescKey]"

 bureacratic_district_capital_trigger: "[root_scope.GetName] is your [realm_capital|E]"
 civic_district_capital_trigger: "[root_scope.GetName] is your [capital|E]"
 household_district_government_trigger: "Your [government|E] is [feudal|E], [clan|E], [administrative|E], [celestial|E], [meritocratic|E], [ritsuryo|E] or [soryo|E]"
 household_district_top_liege_trigger: "You are an [independent_ruler|E], as required for [administrative|E], [celestial|E] and [meritocratic|E] [governments|E]"
 bureaucratic_district_ledger_or_administrative_trigger: "The holder has an [administrative|E] [government|E], or this [barony|E]'s [culture|E] has discovered the #V $innovation_ledger$#! [innovation|E]"
 port_district_water_trigger: "This [barony|E] is #bol not#! by a coast or river"
 temple_district_trigger: "This is neither a [county_capital|E], a [temple|E], nor a [temple_citadel|E]"
 metropolitan_district_city_trigger: "This is a [city_holding|E]"

 ### Holdings ###
 castle_holding_district: "Castle Holding District"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "Tribal Holding District"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "City Holding District"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "Temple Holding District"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "Nomadic Settlement District"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "Herder Settlement District"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "Temple Citadel Holding District"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"

 DISTRICT_FOCUS_HEADING: "#low District Focus\n#!"
 UNLOCKS_DISTRICTS: "#low Unlocked [districts|E]#!"

 ### Economy ###
 guild_district: "Guild District"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]"
 guild_district_desc_flavor: "The guild halls here house the town's finest artisans, who guard their trade secrets jealously. Their work is excellent, their prices are high, and their apprentices are overworked."
 market_district: "Market District"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[gold_i][buy_prices|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax_short|E] & [artisan_tax_i][artisan_tax|E]"
 market_district_desc_flavor: "Local peasants, craftsmen, and merchants crowd this bustling square from dawn to dusk. Whatever the town cannot produce itself can be bought here, at a 'fair' price."
 port_district: "Port District"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]"
 port_district_desc_flavor: "Piers and warehouses line the waterfront, where dockhands haul cargo from ships of every size. Whatever comes from across the sea, it comes through here first."
 entrepot_location_district: "Entrepôt District"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax|E]"
 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', 'Allows reselling goods over long distances via its buildings' )|E]\n\nImported goods are counted, sorted, and sent onward to market from these warehouses. The merchants here always know what is scarce, and charge accordingly."
 entrepot_holding_district_level_2_tt: "Requires level #V 2#! of the [holding_district|E]"
 entrepot_holding_district_level_3_tt: "Requires level #V 3#! of the [holding_district|E]"
 entrepot_holding_district_level_4_tt: "Requires level #V 4#! of the [holding_district|E]"
 holding_district_level_2_tt: "Requires level #V 2#! of the [holding_district|E]"
 holding_district_level_3_tt: "Requires level #V 3#! of the [holding_district|E]"
 holding_district_level_4_tt: "Requires level #V 4#! of the [holding_district|E]"

 ### Fortification ###
 border_forts_district: "Border Forts District"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[control_i][control|E]"
 border_forts_district_desc_flavor: "A chain of forts guards the edges of the barony, each manned by soldiers who know every road and ford. Raiders who come this way rarely get far."
 walls_district: "Walls District"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]"
 walls_district_desc_flavor: "Sturdy stone walls surround the town, offering excellent protection from raiders. The townsfolk grumble about the toll at the gate, but it is still cheaper than being robbed."

 ### Military ###
 military_district: "Military District"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[siege_weapon_i][siege_weapons|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 military_district_desc_flavor: "Sturdy barracks house the soldiers of the realm, keeping them fed, drilled, and ready to march. Keeping them sober is another matter entirely."

 ### Civic ###
 bureaucratic_district: "Bureaucratic District"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i][vassals|E]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[tax_collector|E] & [governor_efficiency|E]"
 bureaucratic_district_desc_flavor: "In these halls, officials of every rank copy, seal, and file the business of the realm. Their work is rarely praised, but without it the realm would soon grind to a halt."
 household_district: "Royal Household"
 imperial_household_district: "Imperial Household"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 household_district_desc_flavor: "In these grand halls the ruler holds court. Behind high walls, the majesty of the realm is upheld by servants, skilled craftsmen and councillors alike. Some spend their entire lives without leaving this district."
 mandala_district: "Mandala District"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][dynasty_prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 mandala_district_desc_flavor: "Every temple, statue, and ceremony in this sacred quarter tells the same story: the king rules by the will of the gods. It is told often, and very loudly."
 temple_district: "Religious Enclave"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 temple_district_desc_flavor: "Holy places crowd this quarter, their bells, chants, or calls to prayer marking every hour of the day. Here, the clergy hold nearly as much sway as the lord."
 temple_district_christian: "Church Enclave"
 temple_district_islamic: "Mosque District"

 ### Metropolitan ###
 entertainment_district: "Entertainment District"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_tax|E]"
 entertainment_district_desc_flavor: "Music, games, and spectacles of every kind draw townsfolk of all classes to this quarter. The nobles pretend not to enjoy it, and the peasants pretend not to notice them."
 patrician_district: "Patrician District"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 patrician_district_desc_flavor: "Marble, silk, and imported spices are ordinary sights in this quarter of wealthy households. The families here marry each other, lend to each other, and plot against each other."
 urban_housing_district: "Housing District"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E] & [settlement_size_growth_short|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$Unlocks [urban_districts|E]"
 urban_housing_district_desc_flavor: "Most of the city's people live in these crowded streets, several families to a roof. For newcomers from the countryside, it is the first step toward a better life."

 ### Rural ###
 manor_houses_district: "Manor Houses District"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 manor_houses_district_desc_flavor: "Across the countryside, manor houses are home to minor noble families who oversee the surrounding lands. Grain and coin flow upward, and the complaints flow with them."
 religious_community_district: "Religious Community District"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 religious_community_district_desc_flavor: "The devout gather in this quiet community to live apart from the world, praying, farming, and copying holy texts. The world, however, keeps sending them its problems."
 villages_district: "Villages District"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i]Reduced [settlement_size|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]\n$BULLET_WITH_TAB$Unlocks [rural_districts|E]"
 villages_district_desc_flavor: "Villages dot the countryside beyond the town walls, each with its own fields and well. The peasants here grow the food that the town takes for granted."

 ### Tribal ###
 tribal_economy_prestige_district: "Feast Halls District"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]"
 tribal_economy_prestige_district_desc_flavor: "In these feasting halls, the tribe gathers to eat, drink, and boast of its deeds. The stories grow a little taller with every cup."
 tribal_military_district: "War Lodges District"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 tribal_military_district_desc_flavor: "The warriors of the tribe sharpen their weapons in these lodges and trade tales of past raids. The young listen closely, already planning raids of their own."
 tribal_wanua_district: "Wantilans District"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i][barter_goods|E]\n$BULLET_WITH_TAB$[vassal_limit_i][vassal_limit|E]\n$BULLET_WITH_TAB$[domain_limit_i][domain_limit|E]"
 tribal_wanua_district_desc_flavor: "The people gather in these open halls to air their grievances before the elders, and the elders, in turn, make sure the chief hears them too."

 ### Duchy ###

 bailiwick_district: "Bailiwick District"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 bailiwick_district_desc_flavor: "The countryside pays for everything the duchy does, and in this district the bailiffs make sure of it, one field, herd, and village at a time."
 staple_district: "Staple District"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E], [commerce_tax_i][commerce_tax_short|E], [artisan_tax_i][artisan_tax_short|E] & [maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 staple_district_desc_flavor: "Warehouses, scales, and counting rooms crowd the staple district, where the duchy's most valuable trade is weighed, taxed, and protected."
 endowment_district: "Endowment District"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 endowment_district_desc_flavor: "Every gift to this endowment is given in perpetuity, and the clergy here hold charters from rulers whose names nobody else remembers."
 assay_district: "Assay District"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E] & [civic_tax_i][civic_tax|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[vassal_i][vassals|E]"
 assay_district_desc_flavor: "A few coins from every batch struck in this district are locked away in a chest, to be tested later in case the minters grew greedy."
 military_duchy_capital_district: "Mustering Grounds District"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E] & [fort_level|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]"
 military_duchy_capital_district_desc_flavor: "Every soldier who musters in this district has their name, arms, and horse written into the roll. Those who fail to appear are written down too."
 ducal_residence_district: "Ducal Residence District"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 ducal_residence_district_desc_flavor: "Guests in this district are hosted in halls and gardens fit for a duke, and more of the duchy's business is settled over dinner here than in court."
 royal_residence_district: "Royal Residence District"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 royal_residence_district_desc_flavor: "Guests in this district are hosted in halls and gardens fit for a king, and more of the realm's business is settled over dinner here than in court."
 governance_district: "Governance Quarter"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 governance_district_desc_flavor: "Officials of every rank work in the halls of this district, where the province's taxes are counted, its granaries are inspected, and its garrisons are paid."

 forestry_district: "Forestry District"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_glass').GetNameWithIcon], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon] & [GetTradeGoodType('trade_good_meat').GetNameWithIcon]"
 forestry_district_desc_flavor: "The forests here provide timber for houses, ships, and fires, and the right to cut them is fiercely guarded. Stealing wood is punished almost as harshly as poaching deer."
 grain_district: "Grain Growing District"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 grain_district_desc_flavor: "Grain is the backbone of any economy, and the fields of this district grow it in plenty. What is not baked into bread is brewed, distilled, or sold."
 wool_district: "Sheep Rearing District"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon], [GetTradeGoodType('trade_good_leather').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon] & [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 wool_district_desc_flavor: "Flocks of sheep graze the pastures of this district, and their wool is sold by the sack to weavers across the realm. More than one great merchant fortune began with a single flock."
 cattle_district: "Cattle Rearing District"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_meat').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon] & [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 cattle_district_desc_flavor: "Cattle graze the pastures of this district, prized for their meat, their milk, and their strength at the plow. In many places, a bride's dowry is still counted in cows."
 cotton_district: "Cotton Growing District"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] & [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 cotton_district_desc_flavor: "White cotton bolls ripen across the fields of this district, picked by hand and sold by the bale. Some far-off peoples believe it grows on plants that sprout tiny sheep."
 stone_district: "Quarry District"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 stone_district_desc_flavor: "Quarries scar the hills of this district, where stone is cut for walls, temples, and castles across the realm. Some of its finest buildings began as a hillside here."
 fish_district: "Fishing District"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 fish_district_desc_flavor: "Fish from this district are eaten fresh, salted, smoked, or dried, and traded far inland where water is scarce. A good catch can feed a village for a month."
 wine_district: "Vineyard District"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 wine_district_desc_flavor: "The vineyards of this district grow grapes for the table, for drying, and above all for wine. A good vintage is remembered for decades, and a bad one for even longer."
 oil_district: "Olive Growing District"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 oil_district_desc_flavor: "Oil from this district lights lamps, cooks meals, anoints the faithful, and softens the skin of the rich. There is little it cannot do, and few households go without it."
 rice_district: "Rice Growing District"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] & [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 rice_district_desc_flavor: "Flooded paddies step across the land here, tended by entire villages who plant, weed, and harvest together. Growing rice is too much work for any family alone."
 millet_district: "Millet Growing District"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_wood').GetNameWithIcon]"
 millet_district_desc_flavor: "Fields of millet and sorghum cover the dry plains here, tall enough to hide a rider. Their small, hard grains keep for years without spoiling."
 mine_district: "Mining District"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon]"
 mine_district_desc_flavor: "Whatever lies beneath this district, be it iron, silver, or salt, is dug out by miners who spend more of their lives underground than above it."
 salt_district: "Salt Harvesting District"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 salt_district_desc_flavor: "Without salt there is no preserving meat or fish through the lean months, and no keeping an army fed. This district supplies a great deal of it, and knows it."
 amber_district: "Amber Harvesting District"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "Amber washes up here after storms and is dug from the sands and marshes inland. A piece with an insect trapped inside is thought to bring luck."
 silk_district: "Silk Growing District"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] & [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 silk_district_desc_flavor: "The silk of this district begins as tiny worms, fed on mulberry leaves day and night. A single robe takes the cocoons of thousands of them."
 furs_district: "Furrier District"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 furs_district_desc_flavor: "Trappers from this district go out in the coldest months, when the animals' fur is thickest and most valuable. A single fine pelt can be worth a season's wages."
 spices_district: "Spice Growing District"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 spices_district_desc_flavor: "Spices here come from every part of a plant: bark, buds, berries, roots, or the threads of a flower. All of it is gathered by hand and dried with care."
 tea_district: "Tea Growing District"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 tea_district_desc_flavor: "Tea bushes grow on the steep hillsides of this district, where mist hangs in the mornings. The finest leaves are picked young, a single bud and two leaves at a time."
 dyes_district: "Dyemaking District"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 dyes_district_desc_flavor: "The dyes of this district come from roots, leaves, berries, and even crushed insects. A deep, lasting color can take a dozen soakings to achieve."
 ivory_district: "Ivory Hunting District"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 ivory_district_desc_flavor: "Elephants in this district are captured, tamed, and trained for war, work, and worship. Their ivory is only part of their value."
 sugar_district: "Sugar Growing District"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 sugar_district_desc_flavor: "Sugar cane grows tall in this district and is crushed for its sweet juice, which is boiled down into hard loaves. Far away, a single loaf is worth more than a cow."
 incense_district: "Incense Harvesting District"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 incense_district_desc_flavor: "The incense of this district is resin bled from the bark of trees and left to harden in the sun. Its smoke rises in temples across the known world."
 medicaments_district: "Medicinal Plant Harvesting District"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 medicaments_district_desc_flavor: "Medicinal herbs grow in the gardens and wild places of this district, gathered by people who know which leaves heal and which ones harm."
 ceramics_district: "Ceramics Making District"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_glass').GetNameWithIcon]"
 ceramics_district_desc_flavor: "The clay of this district is so fine that potters travel for weeks to dig it. The best pieces fired here ring like a bell when tapped."
 hemp_district: "Hemp Growing District"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 hemp_district_desc_flavor: "Fields of hemp cover this district, cut, soaked, and beaten for the fibers that become rope, cloth, and canvas."
 flax_district: "Flax Growing District"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] & [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 flax_district_desc_flavor: "Flax is pulled up by the roots here rather than cut, so that every inch of fiber is saved. Its seeds are pressed, and the pressings fed to the animals."
 honey_district: "Apiary District"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] & [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 honey_district_desc_flavor: "Bees are kept here in hives of straw, clay, or hollow logs, and calmed with smoke when the honey is taken. For most people, it is the only sweetness they ever taste."
 fruit_district: "Fruit Harvesting District"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 fruit_district_desc_flavor: "Orchards of fruit trees cover the slopes and valleys of this district, and their fruit is eaten fresh, dried in the sun, or pressed."
 horses_district: "Horse Rearing District"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 horses_district_desc_flavor: "Open pastures, paddocks, and stables fill this district, where horses are bred, broken, and sold to riders from across the realm."
