# Gem Exchange #
building_type_trade_gem_exchange_01: "Gem Exchange"
building_type_trade_gem_exchange_01_desc: "Appraisers at this gem exchange judge stones only at midday, by windows facing away from the sun, where the light is steadiest."
trade_gem_exchange_01: "$building_type_trade_gem_exchange_01$"
trade_gem_exchange_02: "$building_type_trade_gem_exchange_01$ II"
trade_gem_exchange_03: "$building_type_trade_gem_exchange_01$ III"
