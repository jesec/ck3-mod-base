trade_gem_exchange_05: "$building_type_trade_gem_exchange_01$ V"

# Apothecary Guild #
building_type_trade_apothecary_guild_01: "Apothecary Guild"
building_type_trade_apothecary_guild_01_desc: "Members of this apothecary guild grade the spices, incense, and remedies that pass through the trade post, by smell, taste, and touch."
