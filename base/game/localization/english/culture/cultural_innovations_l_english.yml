  unlock_maa_cannon: "Can recruit [GetMaA('cannon').GetName] as [men_at_arms|E]"
  unlock_maa_bombard: "Can recruit [GetMaA('bombard').GetName] as [men_at_arms|E]"
  unlock_maa_trebuchet: "Can recruit [GetMaA('trebuchet').GetName] as [men_at_arms|E]"
  unlock_maa_mangonel: "Can recruit [GetMaA('mangonel').GetName] as [men_at_arms|E]"
  innovation_heavy_plow: "Heavy Plow"
  innovation_heavy_plow_desc: "Even heaver iron plows can easily be drawn by oxes or horses if mounted on wheels and drawn by multiple animals. This innovation lets us work grounds that would otherwise be hard or even impossible to cultivate."
  innovation_heavy_plow_eri: "Eri System"
  innovation_heavy_plow_eri_desc: "A chain of embanked tanks catches the monsoon and holds it through the dry months, enables us to plant, grow and sow throughout the year."
  innovation_heavy_plow_transplanting: "Transplanting & Grafting"
  innovation_heavy_plow_transplanting_desc: "By utilizing techniques for nursing and propagating plants we can greatly increase our harvests."
  culture_parameter_stone_forts: "[GetBuildingType('wall_wardens_offices_1').GetName] needs [GetTradeGoodType('trade_good_stone').GetNameWithIcon] rather than [GetTradeGoodCategory('trade_category_carpentry_supplies').GetName]"
  culture_parameter_heavy_plow: "[GetDistrictType('grain_district').GetName] will now need [GetTradeGoodType('trade_good_iron').GetNameWithIcon] and [GetTradeGoodCategory('trade_category_beasts_of_burden').GetName] instead of just [GetTradeGoodType('trade_good_cattle').GetNameWithIcon]"
  innovation_prospecting: "Prospecting"
  innovation_prospecting_desc: "By actively and methodically seeking out new veins of ore we can greatly expand the mining business in our realm."
  innovation_coppicing: "Coppicing"
  innovation_coppicing_desc: "By correctly curating and cutting trees in a methodical and organized way we can greatly increase the output of our forestry for supported trades such as charcoal and firewood production."
  innovation_monasticism: "Monasticism"
  innovation_monasticism_desc: "While monasteries are not new they have grown both bigger and more common. Entire religious communities now spring up around what was once isolated retreats, with their own economy and lay settlements to match."
  innovation_craft_ordinances: "Craft Ordinances"
  innovation_craft_ordinances_desc: "While artisans might not relish regulation they do put value in being given the right to fashion rules for their specialized trades. If quality and prices are controlled it is better for everyone."
  innovation_merchant_law: "Merchant Law"
  innovation_merchant_law_desc: "By writing down the customs that have come to govern trade, and enforcing their letter, we can ensure that trade flows both more freely and in a more orderly fashion through our lands."
  innovation_vaulting: "Vaulting"
  innovation_vaulting_desc: "High and slender vaults are both inspiring to look at and a much safer way to construct a ceiling for large buildings. The vaults our masons now construct use less stone and create buildings that last longer."
  innovation_putting_out_system: "Putting-Out System"
  innovation_putting_out_system_desc: "By having an overarching organization for the production that takes place daily in every cottage or homestead in our realm we can achieve much greater efficiency. Merchants will take care of buying raw materials as well as the sale of the final product."
  innovation_deep_mining: "Deep Mining"
  innovation_deep_mining_desc: "In order to create deeper mines than ever before we have come up with a number of technical solutions, timbered galleries, better drainage, and windlasses. These improvements have let us follow veins much deeper than anyone before us."
  innovation_pilot_books: "Pilot Books"
  innovation_pilot_books_desc: "Navigation is a dangerous business and without local pilots most ships would be doomed even along a relatively safe, but unknown, coast. By drawing up charts of every headland, shoal and anchorage, with their bearings and distances we can preserve for eternity what would otherwise die with a single person."
  innovation_pilot_books_portolan: "Portolan Charts"
  innovation_pilot_books_portolan_desc: "Navigation is a dangerous business and without local pilots most ships would be doomed even along a relatively safe, but unknown, coast. By ruling our charts with lines of bearing struck from the compass rose, and setting down every headland, shoal and anchorage along them, we can preserve for eternity what would otherwise die with a single person."
  innovation_agronomy: "Agronomy"
  innovation_agronomy_desc: "Working land can be hard and is often only taught from one farmer to another. By collecting such knowledge and writing down treatieses on crops and husbandry we can spread knowledge that has been proven, and refine traditions into methods."
  innovation_bricks: "Bricks"
  innovation_bricks_desc: "While bricks were not unknown to our ancestors the knowledge is not as widespread as it once was. The technology to reliably manufacture and use this simple man made building material allows any house to be built more quickly and more efficiently."

