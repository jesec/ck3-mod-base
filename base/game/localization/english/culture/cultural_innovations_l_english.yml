  unlock_maa_ballista: "Can recruit [GetMaA('ballista').GetName] as [men_at_arms|E]"
  unlock_maa_cloud_ladder: "Can recruit [GetMaA('cloud_ladder').GetName] as [men_at_arms|E]"
