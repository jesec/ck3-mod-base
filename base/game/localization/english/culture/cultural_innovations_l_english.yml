##############
# Tribal Era #
##############

 #Military
 innovation_motte: "Earthworks"
 innovation_motte_desc:0 "Simple yet effective, building our castles on raised earthen mounds is the best way to ensure we quite literally have the high ground over our enemies."

 innovation_motte_chinese: "Hāng Tu" # 夯土 
 innovation_motte_chinese_desc: "Simple yet effective, building our fortifications from rammed earth is the best way to ensure we quite literally have the high ground over our enemies."

 innovation_motte_actual_motte: "Mottes"
 innovation_motte_actual_motte_desc: "$innovation_motte_desc$"

 innovation_catapult:0 "Onager"
 innovation_catapult_desc:0 "While slow to load and fire, torsion-powered catapults like these allow us to assail enemy fortifications while staying out of their archers' range."

 innovation_catapult_chinese: "Siege Crossbow"
 innovation_catapult_chinese_desc: "Large portable crossbows with multiple opposite bows to extend the draw length and power, often mounted on a wheeled frame for mobility."

 innovation_barracks:0 "Barracks"
 innovation_barracks_desc:0 "By constructing dedicated buildings for us to quarter our soldiers in we can make sure that we have sufficient space to accommodate our growing armies."

 innovation_mustering_grounds:0 "Mustering Grounds"
 innovation_mustering_grounds_desc:0 "Simply having people willing to fight for us is not enough to win wars. Setting aside space for people to both train and muster for battle will allow us to support groups of more experienced fighters who can lead us to victory."

 innovation_bannus:0 "Bannus"
 innovation_bannus_desc:0 "Based on the authority to command men in battle, the bann gives our rulers the power to compel free men to fight for them, forming a legal basis for the mustering of large armies."
 eligible_accolade_vanguard_attribute_ACCOLADES_DLC:0 "[knights|E] of this [culture|E] become eligible for [GetAccoladeType('vanguard_attribute').GetName] [accolades|E]"
 eligible_accolade_vanguard_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_footmen: "Can recruit [GetMaA('armored_footmen').GetName] as [men_at_arms|E]"
 unlock_maa_onager: "Can recruit [GetMaA('onager').GetName] as [men_at_arms|E]"

 innovation_quilted_armor:0 "Quilted Armor"
 innovation_quilted_armor_desc:0 "Formed of a dozen or more layers of linen stitched together, these jackets can stop even heavy arrows and are an affordable way for us to armor an entire regiment for battle."

 innovation_pattern_welding:0 "Pattern-Welded Blades"
 innovation_pattern_welding_desc:0 "By twisting and forge-welding rods of iron and steel together, our smiths can produce blades that are harder, more flexible, and far deadlier than plain iron. Such weapons demand skilled hands and constant care, and warriors who carry them expect to be paid accordingly."

 #Civic
 innovation_gavelkind:0 "Gavelkind"
 innovation_gavelkind_desc:0 "Stability and prosperity go hand-in-hand. Instead of having vassals jockey for power when the old monarch passes away, we can define a predetermined, equitable system of inheritance which will eliminate much of the instability which traditionally occurs on succession."

 innovation_crop_rotation:0 "Crop Rotation"
 innovation_crop_rotation_desc:0 "By transitioning from the traditional two-field farming model to three-field crop rotation, we can grow more crops each year without depleting the soil on our farms."

 innovation_city_planning:0 "City Planning"
 innovation_city_planning_desc:0 "By designing our cities before we start constructing them, we can create new holdings in strategic locations which are both more functional and aesthetically pleasing than the older ones which haphazardly arose over time."
 unlock_city_planning_holdings: "Unlocks [district_tiers|E]:\n$BULLET_WITH_TAB$[GetDistrictType('tribal_economy_prestige_district').GetName] Tier II"

 innovation_casus_belli:0 "Casus Belli"
 innovation_casus_belli_desc:0 "Might makes right has been the law of the land for generations, but if we have a justification for our wars then we can avoid provoking the ire of our neighbors and the retaliation that often comes with it."

 innovation_plenary_assemblies:0 "Plenary Assemblies"
 innovation_plenary_assemblies_desc:0 "In order to effectively govern, we must bring all free men of the realm together to discuss and resolve legislative matters. Attendance is mandatory, and those who do not come will be fined and forfeit their ability to influence any decision made."
 unlock_plenary_assemblies_building: "Unlocks [district_tiers|E]:\n$BULLET_WITH_TAB$[GetDistrictType('tribal_holding_district').GetName] Tier II\n$BULLET_WITH_TAB$[GetDistrictType('household_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('tribal_wanua_district').GetName] Tier II"

 innovation_prosperity_01:0 "Public Works"
 innovation_prosperity_01_desc:0 "Funding the construction of public works like roads, schools, and aqueducts will allow our settlements to grow to larger sizes, ensuring the prosperity of our people for generations to come."

 innovation_currency_01:0 "Currency"
 innovation_currency_01_desc:0 "Bartering is slow and inefficient; adopting an officially-recognized currency like cowrie shells or metal nuggets will bolster trade and increase the spread of ideas within our realm."

 innovation_ledger:0 "Ledger"
 innovation_ledger_desc:0 "As our lands grow, we need a better way to keep track of what we own. Maintaining a ledger of our possessions will ensure that we always know what resources we have at our disposal."

 #Regional
 innovation_viking_tradition:0 "Viking Tactics"
 innovation_viking_tradition_desc:0 "The people of the north have a long tradition of trade, but also of piracy. Few are prepared to fight a threat that appears without warning from the banks of a river, and the viking warriors are masters of such warfare."
 
 innovation_longboats:1 "Longships"
 innovation_longboats_desc:1 "Our longships are formidable seafaring vessels which can travel almost anywhere and even brave rough weather, giving us exceptional mobility on the seas."

 innovation_carpet_weaving:0 "Carpet Weaving"
 innovation_carpet_weaving_desc:0 "Carpets and rugs can be important everyday objects as well as fine courtly prestige products. Throughout Anatolia and Persia there is a long-standing tradition of carpets that are both durable and beautiful."
unlock_carpet_weaving_buildings: "Unlocks [building|E] lines:\n$BULLET_WITH_TAB$[GetBuildingType('rug_weaving_1').GetName] in the [GetDistrictType('wool_district').GetName]\n$BULLET_WITH_TAB$[GetBuildingType('luxury_carpet_workshop_1').GetName] in the [GetDistrictType('guild_district').GetName]"

 innovation_mead_brewing:0 "Mead Brewing"
 innovation_mead_brewing_desc:0 "The use of honey in alcoholic beverages is especially common in the northern parts of Europe."
culture_parameter_unlocks_mead_brewery:0 "Unlocks [building|E] lines:\n$BULLET_WITH_TAB$[GetBuildingType('mead_brewery_1').GetName] in the [GetDistrictType('honey_district').GetName]"
 unlocks_mead_brewery_name: "#V $innovation_mead_brewing$#!"

 innovation_stockfisk: "Stockfisk"
 innovation_stockfisk_desc: "By drying fish on wooden racks under the open sky we can make it last for years, enabling us to store it for ourselves through winter or on long expeditions, as well as exporting it to faraway customers."

 innovation_damascus_steel: "Damascus Steel"
 innovation_damascus_steel_desc: "The smiths of the Near East have perfected a technique where they can forge more resilient and sharper blades. These blades, also often lavishly ornamented, have become associated with the markets of Damascus."
 culture_parameter_damascus_steel_smithing: "Increases the effect of [GetTradeGoodCategory('trade_category_base_metals').GetName] needs in the [GetBuildingType('blacksmiths_guild_1').GetName] and [GetBuildingType('bladesmiths_of_toledo_1').GetName] [buildings|E]"

 innovation_calicoes_and_muslin: "Calicoes & Muslin"
 innovation_calicoes_and_muslin_desc: "For as long as anyone can remember India has been a center of voluminous and high quality textile production and export. To the Romans this was the 'woven wind' that merchants brought from afar, and later the port of Calicut would become synonymous with the 'Calicoe' cloth bought there."

 innovation_war_camels:0 "War Camels"
 innovation_war_camels_desc:0 "Camels are naturally suited for living in desert terrain, but they aren't inherently creatures of battle. Our breeders and trainers can change this, giving us access to adaptive cavalry which will let us master the sands."
 eligible_accolade_camelry_attribute_ACCOLADES_DLC:0 "[knights|E] of this [culture|E] become eligible for [GetAccoladeType('camelry_attribute').GetName] [accolades|E]"
 eligible_accolade_camelry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"

 innovation_elephantry:0 "Elephantry"
 innovation_elephantry_desc:0 "Elephants are difficult to raise in captivity, so each mahout must capture their own wild elephants and train them. This means there is a delicate art to properly using these great creatures in battle, but it is an art we are dedicated to mastering."
 eligible_accolade_elephantry_attribute_ACCOLADES_DLC:0 "[knights|E] of this [culture|E] become eligible for [GetAccoladeType('elephantry_attribute').GetName] [accolades|E]"
 eligible_accolade_elephantry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 
 innovation_wootz_steel:0 "Wootz Steel"
 innovation_wootz_steel_desc:0 "Also known as Hinduwani or Seric steel, this carbon-rich metal is excellent for making weapons. Wootz steel is widely traded and is deemed the finest steel in the world. Throughout most of history, it has drawn the attention of Arab, Egyptian, Chinese, and even Roman traders."
 
 innovation_african_canoes:0 "West African Canoes"
 innovation_african_canoes_desc:0 "The great canoes of West Africa are excellent for navigating rivers and allows us to quickly ferry troops to where we need them."
 
 innovation_table_of_princes:0 "Table of Princes"
 innovation_table_of_princes_desc:0 "The Table of Princes is the royal seat of Bohemian rulers, with the one sitting at the table being recognized as the rightful ruler. Under the code of house seniority, titles were given to the eldest living member of the ruling dynasty."
 unlock_single_heir_dynasty_house_changing:0 "Can enact $single_heir_dynasty_house$ at any [crown_authority|E]"


 tradition_visigothic_codes_name:0 "$innovation_visigothic_codes$"
 tradition_visigothic_codes_desc:0 "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes:0 "Visigothic Codes"
 innovation_visigothic_codes_desc:0 "Although many of the older traditions of the Visigoths have long been wiped from the world, the children of the Pyrenees remember the ancient ways, and how land was divided between sons and daughters practically but fairly."
 unlock_equal_succession_changing:0 "Can enact $equal_law$ [law|E] at any [crown_authority|E]"

######################
# Early Medieval Era #
###################### 
 
 #Military 
 innovation_battlements:0 "Battlements"
 innovation_battlements_desc:0 "Beyond fortifying just the keep itself, building a durable outer wall which can be safely manned by our archers will give our castles an extra layer of protection against attackers."

 innovation_mangonel:0 "Mangonels"
 innovation_mangonel_desc:0 "A significant improvement to our existing catapult designs, traction-powered mangonels are much faster to load and fire than torsion-powered machines."

 innovation_mangonel_chinese: "Cloud Ladders"
 innovation_mangonel_chinese_desc: "Hinged folding siege ladders, often equipped with shields, winches, grappling hooks, and pulley-based lifting devices. They also served as a high vantage point for observation during sieges."
 eligible_accolade_besieger_attribute_ACCOLADES_DLC:0 "[knights|E] of this [culture|E] become eligible for [GetAccoladeType('besieger_attribute').GetName] [accolades|E]"
 eligible_accolade_besieger_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"

 innovation_burhs: "Stone Forts"
 innovation_burhs_desc: "Scattered across the countryside, the best mustering grounds and administrative centers are protected by solid walls of stone."

 innovation_burhs_japan: "Suki" # 柵
 innovation_burhs_japan_desc: "Since the construction of the #italic Mizuki#! in the reign of Emperor Tenji, the importance of fortifications has gained a new appreciation. We can use fortified centers like these both to muster troops and to serve as administrative centers."

 innovation_burhs_chinese: "Wū Bì" # 塢壁
 innovation_burhs_chinese_desc: "Scattered across the countryside, wū bì are important fortified settlements we can use both to muster troops and to serve as administrative centers."

 innovation_burhs_anglo_saxon: "Burhs"
 innovation_burhs_anglo_saxon_desc: "Scattered across the countryside, burhs are important fortified settlements we can use both to muster troops and to serve as administrative centers."

 innovation_burhs_latin: "Castra"
 innovation_burhs_latin_desc: "Old principles of fortification are still useful today, and we can use these sorts of fortified centers to both muster troops and to serve as administrative centers."

 innovation_house_soldiers:0 "Household Soldiers"
 innovation_house_soldiers_desc:0 "As our noble families grow in power, they need soldiers to enforce their will. Establishing an order of dedicated household soldiers will ensure that we have troops which are better trained and equipped than a standard levy."

 innovation_horseshoes:0 "Horseshoes"
 innovation_horseshoes_desc:0 "A horse with a split hoof will quickly go lame and be unable to work or be ridden into battle. By shoeing our horses with bronze or iron plates, we can keep their hooves healthy and protected from damage."

 innovation_arched_saddle:0 "Arched Saddle"
 innovation_arched_saddle_desc:0 "Light cavalry are a force to be reckoned with, but they do not truly exploit the potential of the warhorse. Arched saddles allow us to field heavily armored warriors with couched lances, which lets them take full advantage of their momentum as they charge into enemy lines."
 eligible_accolade_lancer_attribute_ACCOLADES_DLC:0 "[knights|E] of this [culture|E] become eligible for [GetAccoladeType('lancer_attribute').GetName] [accolades|E]"
 eligible_accolade_lancer_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_horsemen: "Can recruit [GetMaA('armored_horsemen').GetName] as [men_at_arms|E]"

 innovation_riveted_mail:0 "Haubergeon"
 innovation_riveted_mail_desc:0 "Mail is the gold standard for protecting yourself and has up until now often been reserved for only the nobles among us. Through simplified production we can make it the standard for all our men at arms."

 #Civic
 innovation_hereditary_rule:0 "Hereditary Rule"
 innovation_hereditary_rule_desc:0 "Evenly dividing the realm amongst all eligible heirs fractures the unity of our people. Instead of tearing our realm asunder on every succession we can ensure we have a stable and prosperous heartland by establishing a system of hereditary rule."

 innovation_manorialism:0 "Manorialism"
 innovation_manorialism_desc:0 "With land ownership consolidated under our elite, many men and women find themselves unable to work. We will establish a manor system where free men can work our fields in exchange for rent, while those who cannot pay may enter our service as bound serfs instead."

 innovation_royal_prerogative:0 "Royal Prerogative"
 innovation_royal_prerogative_desc:0 "As our royalty has a greater burden placed upon them by their responsibility to govern the realm, so too shall they be bestowed with privileges reserved exclusively for them."

 innovation_chronicle_writing:0 "Chronicle Writing"
 innovation_chronicle_writing_desc:0 "No more will the stories of our family's exploits be passed down just through oral tradition. We will keep a record of all that we accomplish, both to inspire future generations as well as to prove our claims over lands we should rightfully hold."

 innovation_armilary_sphere:0 "Astrolabe"
 innovation_armilary_sphere_desc:0 "Astrolabes let us know the altitude of the sun or known stars, allowing us to calculate our latitude. Navigational instruments like this, or its more advanced cousin the Armillary Sphere, let us navigate waters farther from land."

 innovation_baliffs: "Magistrates"
 innovation_baliffs_desc: "A ruler cannot be everywhere at once. By appointing magistrates and other representatives to enforce the lord's law throughout the realm, we can govern a larger area more effectively than we could otherwise."

 innovation_baliffs_bailiffs: "Bailiffs"
 innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"

 innovation_baliffs_latin: "Potestas"
 innovation_baliffs_latin_desc: "The ancient Romans defined the powers of officials to create, enforce, and judge law as #italic potestas#!, a concept used to empower magistrates to enforce the law throughout the realm. By granting #italic potestas#! to local officials, we can govern a larger area more effectively than we could otherwise."

 innovation_prosperity_02:0 "Communal Government"
 innovation_prosperity_02_desc:0 "Larger towns regularly face a series of increasingly complex problems. Delegating some authority to local councils will let them resolve these issues without needing to get the king involved."

 innovation_currency_02:0 "Coinage"
 innovation_currency_02_desc:0 "Unregulated currencies are difficult to control and lack stability. Minted coins, measured to specific weights and stamped with a royal seal, give new confidence to commercial transactions."

 #Regional

 innovation_reconquista:1 "Spiritual Expansionism"
 innovation_reconquista_desc:0 "Distracted by infighting, we have tolerated the presence of infidels in Hispania for too long. The time has come for us to rally our forces to drive them from this land once and for all!"

 innovation_stem_duchies:0 "Stammesherzogtum"
 innovation_stem_duchies_desc:0 "Despite coming from different tribes, we recognize the importance of unity and cooperation. Independence is overvalued when stability is what leads to safety and prosperity. "

 innovation_ghilman:0 "Ghilman"
 innovation_ghilman_desc:0 "Slave-soldiers taken as prisoners of war, ghilman are dedicated fighters who are both more loyal to us and cheaper to pay than common mercenaries."

#####################
# High Medieval Era #
#####################

 #Military
 innovation_hoardings:0 "Hoardings"
 innovation_hoardings_desc:0 "Placed on the top of our battlements, these wooden constructions extend out above the base of our castle walls.\n\nThey allow our defenders to fire arrows, drop stones, or pour boiling oil on attackers while remaining completely protected from enemy archers."

 innovation_trebuchet:0 "Trebuchet"
 innovation_trebuchet_desc:0 "An engineering marvel, the counterweight trebuchet can hurl heavy projectiles at distances further than any siege engine that came before it."

 innovation_trebuchet_chinese: "Mobile Towers"
 innovation_trebuchet_chinese_desc: "To conquer enemy stone towers, these tall wooden towers with wheels were pushed up against them, allowing soldiers to reach the enemy walls with a modicum of safety."

 innovation_castle_baileys:0 "Castle Baileys"
 innovation_castle_baileys_desc:0 "While the keep serves as the heart of a castle, it is far from the only important building. Constructing buildings like the stables and armory in a protected bailey will ensure we can properly garrison and equip our levies no matter the circumstances."
 
 innovation_men-at-arms:0 "Men-at-Arms"
 innovation_men-at-arms_desc:0 "Those skilled in the horse and the lance will always be in demand, but are not always available. Keeping groups of men-at-arms on retainer will ensure that we do not lack experienced fighters when war inevitably breaks out."

 innovation_knighthood:0 "Knighthood"
 innovation_knighthood_desc:0 "By bestowing knighthoods upon our best fighters and paying them with land holdings instead of mere coin, we can give them the honor they deserve as well as secure their loyalty to us."

 innovation_advanced_bowmaking:0 "Advanced Bowmaking"
 innovation_advanced_bowmaking_desc:0 "While archers have traditionally made and maintained their own bows, craftsmen have begun making new types of bows which are stronger and more complex than before. By embracing these new designs we can turn these master bowyers into an invaluable military asset."
 unlock_maa_crossbowmen: "Can recruit [GetMaA('crossbowmen').GetName] as [men_at_arms|E]"
 unlock_advanced_bowmaking_buildings: "Unlocks [district_tiers|E]:\n$BULLET_WITH_TAB$[GetBuildingType('archery_ranges_3').GetName] in the [GetDistrictType('military_district').GetName]"
 eligible_accolade_crossbower_attribute_ACCOLADES_DLC:0 "[knights|E] of this [culture|E] become eligible for [GetAccoladeType('crossbowmen_attribute').GetName] [accolades|E]"
 eligible_accolade_crossbower_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"

 innovation_coat_of_plates:0 "Coats of Plates"
 innovation_coat_of_plates_desc:0 "Riveting overlapping iron plates to the inside of a sturdy cloth garment gives our soldiers protection approaching that of solid armor at a fraction of the weight. Fitting an entire regiment with these coats is costly work for our armorers, but the men who wear them can weather blows that would fell an unarmored warrior outright."

 #Civic

 innovation_heraldry:0 "Heraldry"
 innovation_heraldry_desc:0 "Establishing hereditary designs to identify our noble families will cause their members to see themselves as part of a greater whole, encouraging them to improve their dynasty's reputation instead of merely being obsessed with personal status."

 innovation_windmills:0 "Advanced Mills"
 innovation_windmills_desc:0 "The vertical windmill turns wherever the wind blows, freeing our millers from the tyranny of falling water. The same geared shafts are now set to work far beyond grain: hammers full our cloth, bellows feed the forge, and saws bite through timber that men once cut by hand."
 unlock_windmills_buildings: "Unlocks [district_tiers|E]:\n$BULLET_WITH_TAB$Tier V for all [resource_districts|E] except the [GetDistrictType('fish_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('villages_district').GetName] Tier III"

 innovation_divine_right:0 "Divine Right"
 innovation_divine_right_desc:0 "It is time that we recognize that it is divine will that has placed our rulers on their thrones, and to oppose them is to oppose divinity itself."

 innovation_land_grants:0 "Land Grants"
 innovation_land_grants_desc:0 "Land is the most valuable reward we can bestow upon our subjects, but there is only so much that we directly own. However, if we were to grant them permission to start farming that unworked land over there... who would object? Even if conflict does result, we will clearly be in the right when we defend our subjects!"

 innovation_scutage:0 "Scutage"
 innovation_scutage_desc:0 "Military service has always been expected of our subjects, but there are some who are unable or unwilling to provide it. By offering a way for them to meet their obligations with coin instead of steel, we can ensure that we get our dues from everyone."

 innovation_guilds:0 "Guilds"
 innovation_guilds_desc:0 "As our lands expand it becomes increasingly inefficient to directly manage all trade going on within our domain. By granting guild charters to organizations of merchants and craftsmen we can give them more autonomy over their businesses while still ensuring we profit from their ventures."

 innovation_prosperity_03:0 "Urbanization"
 innovation_prosperity_03_desc:0 "The great cities of Rome, Byzantium, and Delhi have long stood out as relics of a great, unmatchable legacy. As our infrastructure and population grow, we finally have the means to develop new settlements which rival these ancient urban centers."

 innovation_currency_03:0 "Banking"
 innovation_currency_03_desc:0 "Particularly large or expensive trades often require an unwieldy amount of heavy coinage. Depositing that wealth in secure treasuries and transferring ownership without moving the physical coins will allow large quantities of goods to be traded more easily."

 innovation_blast_furnaces:0 "Blast Furnaces"
 innovation_blast_furnaces_desc:0 "By forcing air through a towering charcoal-fired furnace, we can smelt iron in quantities and qualities our forefathers could only dream of. Ore that once yielded a smith a handful now runs molten by the ton."

 #Regional

 innovation_east_settling:0 "Ostsiedlung"
 innovation_east_settling_desc:0 "The lands to our east are sparsely inhabited, but rich in natural resources. Establishing an initiative to expand and establish homesteads there will lead to the growth and prosperity of our people."

 innovation_seigneurialism:0 "Seigneurialism"
 innovation_seigneurialism_desc:0 "By delegating more responsibilities to local nobles, we can both make them happy as well as freeing up more of our attention to focus on our own domain."

 innovation_muladi:0 "Muladi"
 innovation_muladi_desc:0 "Wars, raids, and persecution all over the world have driven many people from their homes. By welcoming these displaced souls to our lands regardless of their background we can develop a rich and prosperous society."

 innovation_french_peerage:0 "Peerage"
 innovation_french_peerage_desc:0 "By rightfully recognizing the most illustrious amongst the noble vassals of our realm we will foster a sentiment of greater loyalty towards the crown."

#####################
# Late Medieval Era #
##################### 
 
 #Military
 innovation_machicolations: "Machicolations"
 innovation_machicolations_desc: "A notable improvement on our earlier hoardings, stone machicolations serve the same purpose while being significantly more durable and offering more protection for our defenders."

 innovation_gunpowder: "Gunpowder"
 innovation_gunpowder_desc: "The development of explosive powders has created new breeds of weapons, and new types of warriors to use them. Fielding these potent guns requires production and supply chains uncalled for in the past, but cost of these works pays for itself with the might unlocked by this new technology."

 innovation_royal_armory:0 "Royal Armory"
 innovation_royal_armory_desc:0 "As the size of our armies increases, we must guarantee that each and every soldier will be properly armed and armored. The establishment of a royal armory to produce and house all of our armies' equipment will go a long way towards meeting this need."

 innovation_standing_armies:0 "Standing Armies"
 innovation_standing_armies_desc:0 "Military levies provide us with large numbers of soldiers, yet no matter how well we try to train and equip them they will always be inferior to professional soldiers. Establishing a large standing army will ensure the interests of our realm are enforced by the best fighters around."

 innovation_sappers:0 "Sappers"
 innovation_sappers_desc:0 "It does not matter how strong our enemy's walls are if the earth beneath them can be dug through. Employing sappers to undermine enemy fortifications is an effective way to breach even the toughest defenses."

 innovation_plate_armor:0 "Plate Armor"
 innovation_plate_armor_desc:0 "The ultimate form of personal protection, a well-crafted suit of plate armor has articulated joints which give it a superior range of motion to earlier armors, while being all but impenetrable to enemy weapons."

 innovation_tempered_steel: "Tempered Steel"
 innovation_tempered_steel_desc: "We have discovered a way to make steel harder and less brittle by first heating it up and then quenching it quickly, and then heating it up again. This makes for a weapon that is harder and less brittle than any steel before it."

 #Civic

 innovation_primogeniture:0 "Primogeniture"
 innovation_primogeniture_desc:0 "One kingdom, one heir. While the younger children of our monarch may feel forsaken by being denied an inheritance, this is the best way to ensure we keep a stable realm which does not get torn apart by succession crises."

 innovation_cranes:0 "Cranes"
 innovation_cranes_desc:0 "A forgotten marvel of engineering, the Romans used tread-wheel cranes to great effect when building their empire, and so too shall we."

 innovation_noblesse_oblige:0 "Noblesse Oblige"
 innovation_noblesse_oblige_desc:0 "Nobility is more than just privileges and rights; it also comes with a duty to the realm, an obligation to act in ways that are proper and just. Clearly establishing what is expected from our elite will give us an ideal to aspire to and bring us together as we work to achieve it."

 innovation_rightful_ownership:0 "Rightful Ownership"
 innovation_rightful_ownership_desc:0 "It is our divine right to possess our de jure lands, and it is time the world recognizes this fact. No longer will we be held back by obsolete protocols and decorum."

 innovation_ermine_cloaks: "Exotic Regalia"
 innovation_ermine_cloaks_desc: "Anyone may claim a title, but in order to be a true monarch they must inspire awe and majesty in their subjects. Using the most rare and exotic materials in our regal clothing is sure to accomplish just that."

 innovation_ermine_cloaks_ermine: "Ermine Cloaks"
 innovation_ermine_cloaks_ermine_desc: "Anyone may claim a title, but in order to be a true monarch they must inspire awe and majesty in their subjects. Our new ermine cloaks are a form of regal dress which is sure to accomplish just that."

 innovation_court_officials:0 "Court Officials"
 innovation_court_officials_desc:0 "Our realm has expanded to the point where even minor nobles cannot administer everything effectively. Appointing court officials and bureaucrats to handle the more mundane court tasks will ensure that the wheels of government continue turning smoothly. "

 innovation_prosperity_04:0 "Renaissance Thought"
 innovation_prosperity_04_desc:0 "Developments in science, philosophy, and logic have turned our cities into wondrous centers of education and innovation. The massive technological and cultural leaps we are now making has put hitherto undreamed potential within our grasp."

 innovation_currency_04:0 "Promissory Notes"
 innovation_currency_04_desc:0 "An evolution of earlier banking systems, paper promissory notes allow our citizens to quickly and safely trade goods and services across large distances without being weighed down by heavy specie."

 #Regional

 innovation_wierdijks:0 "Wierdijks"
 innovation_wierdijks_desc:0 "Building strong and reliable dikes is an essential task if we wish to live and prosper within the low countries. New techniques of reinforcing earthen dikes with seaweed mats will increase their strength and durability."

 innovation_condottieri:0 "Condottieri"
 unlock_maa_condottieri_GDP_DLC:0 "Can recruit [GetMaA('condottieri').GetName] as [men_at_arms|E]"
 unlock_maa_condottieri:0 "[AddLocalizationIf( HasDlcFeature( 'silk_and_silver' ), 'unlock_maa_condottieri_GDP_DLC')]"
 innovation_condottieri_desc:0 "Being both wealthy and centrally located, Italy has become a major center for mercenary companies to travel to when not on active campaign. Since they are already here, we should be able to negotiate a better rate for them than they would normally charge."

 innovation_deccan_unity:0 "Deccan Unity"
 innovation_deccan_unity_desc:0 "The influx of new beliefs and religions into our society has made it clear that our past focus on regionalism has been a mistake. We should band together with others of our faith and ensure a strong and enduring state that can stand up to external pressures."

 students_of_knighthood:1 "Children completing their [education|E] with a [martial|E] [education_focus|E] gain a $trait_education_martial_prowess$ [trait|E]"

 # Sponsor Research Related
 fp3_innovation_mural_sextant: "Mural Sextant"
 fp3_innovation_mural_sextant_desc: "These large mural instruments can be used to precisely read and measure the position of heavenly objects."

 fp3_innovation_fritware: "Fritware"
 fp3_innovation_fritware_desc: "Beautiful stone pottery in the image of eastern porcelain, by mixing in materials such as quartz or glass. They make for valuable merchandise, or impressive gifts."
 fp3_innovation_fritware_tooltip: "[opinion|E] Gain from [send_gift|E]: #P +20%#!"

 #################
 # The Silk Road #
 #################

 culture_parameter_silk_road_innovation_parameter: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'culture_parameter_silk_road_innovation_parameter_tgp', 'culture_parameter_silk_road_innovation_parameter_no_tgp' )]"
 culture_parameter_silk_road_innovation_parameter_tgp: "May only be acquired as a potential [cultural_fascination|E] via [GetCulturePillar('heritage_chinese').GetName] [heritage|E], [GetCultureTradition('tradition_sinophilic').GetName] [tradition|E], or via [GetSituation('silk_road_situation').GetName] [situation|E]"
 culture_parameter_silk_road_innovation_parameter_no_tgp: "May only be acquired as a potential [cultural_fascination|E] via [GetCulturePillar('heritage_chinese').GetName], [GetCulturePillar('heritage_korean').GetName], [GetCulturePillar('heritage_buyeo').GetName], or [GetCulturePillar('heritage_viet').GetName] [heritage|E], or via [GetSituation('silk_road_situation').GetName] [situation|E]"

 innovation_fire_medicine: "Fire Medicine" # 'Huoyao,' 火藥
 innovation_fire_medicine_desc: "Plumbing the mysteries of life can sometimes uncover things that create only death. Fire medicine, a potent combination of sulfur, saltpeter, and some burnable material, creates a deadly flame that burns fiercely, almost explosively."

 innovation_champa_rice: "Champa Rice"
 innovation_champa_rice_desc: "Rice requires an abundance of time and water — except for the rice from Champa. This variety grows faster, survives droughts better, and gives a more bountiful yield than practically any other sort of rice known. In some cases, it can even be harvested twice in one year. Properly managed, this rice can boost farms and fuel a population boom."

 culture_parameter_champa_rice_wet_land_paddies: "The [GetDistrictType('rice_district').GetName] may be constructed in [GetTerrain( 'wetlands' ).GetName]"
 culture_parameter_champa_rice_building_bonuses: "The [GetBuildingType('rice_resource_building_1').GetName] [building|E] line gains additional bonuses in [GetTerrain( 'wetlands' ).GetName]"
 building_paddy_fields_requirement_terrain_tt: "One of the following:\n$EFFECT_LIST_BULLET$[barony|E] is [GetTerrain( 'terraced_hills' ).GetName]\n$EFFECT_LIST_BULLET$[barony|E] is [GetTerrain( 'floodplains' ).GetName] and in the [GetGeographicalRegion('paddy_fields_region').GetName] [region|E]\n$EFFECT_LIST_BULLET$[barony|E] is [GetTerrain( 'wetlands' ).GetName] and [culture|E] has the #V $innovation_champa_rice$#! [innovation|E]\n$EFFECT_LIST_BULLET$[barony|E] is [GetTerrain( 'hills' ).GetName] or [GetTerrain( 'jungle' ).GetName] and [culture|E] has the [GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V] [tradition|E]"

 innovation_sericulture: "Sericulture"
 innovation_sericulture_desc: "The art of silk production is a complex but very rewarding process, the knowledge of which is jealously guarded by those who profit from their mastery of this industry."
 culture_parameter_unlocks_silk_buildings_parameter: "Unlocks the [GetDomicileBuilding('silk_01').GetNameNoTooltip|V] line of [domicile_buildings|E]"

 innovation_dragon_kiln: "Dragon Kilns"
 innovation_dragon_kiln_desc: "The best porcelain can only be produced at highly-specialized kilns, located near valuable mining deposits. These kilns are built on steep slopes that help create a vortex of heat to fire the hardest ceramics possible. Although challenging to build, the products they make are some of the most fashionable (and the most lucrative) pottery known to any court."

 innovation_lacquerware: "Lacquerware"
 innovation_lacquerware_desc: "The art of lacquering, and the turning of sap and wood into expensive prestige objects is one that is as old as it is hard to master. Originating in Japan and China it has slowly spread throughout East Asia, along with the precious Lacquerware objects themselves."
 culture_parameter_unlock_lacquerware_buildings: "Unlocks the [GetBuildingType('lacquerware_workshop_1').GetName] line of [buildings|E] in the [GetDistrictType('forestry_district').GetName]"

 innovation_rocket_cart: "Rocket Carts"
 innovation_rocket_cart_chinese: "Huochē" # 火車 (Huǒchē)
 innovation_rocket_cart_koreanic: "Hwacha" # 火車 (화차)
 innovation_rocket_cart_desc: "Using explosive formulas cruder than anything needed by expensive bombards, massive volleys of fire arrows can be fired from a single device. Since these fire arrows still only have the impact of... an arrow, they are far better-suited for shooting #italic from#! walls than #italic at#! them."
 innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
 innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"

 innovation_tea_culture: "Tea Culture"
 innovation_tea_culture_desc: "The art of drinking tea is more than just putting leaves in a cup of hot water. In some societies it has grown into a social medium, and drinking it alone as well as together has become an important strand of the social fabric."
 culture_parameter_unlocks_tea_house_buildings: "Unlocks the [GetBuildingType('tea_house_1').GetName] [building|E] line in [GetDistrictType('entertainment_district').GetName]"

 innovation_compass: "Compass"
 innovation_compass_desc: "With a piece of simple lodestone, it becomes possible to always know what direction a person is traveling in. With time and further development, it may eventually become possible to navigate without ever having to stop and ask someone for directions."
 culture_parameter_cheaper_adventure_inspiration: "Adventure [inspiration|E] Cost: #P -50%#!"

 innovation_block_printing: "Block Printing"
 innovation_block_printing_desc: "Using a series of carved wooden blocks, it becomes possible to assemble an array of stamps that can be used several times over to reproduce the same words and images on any suitable material. This vastly simplifies the process of book production, reducing costs and making the written word that much more accessible to everyone."
 culture_parameter_block_printing_scriptorium_bonuses: "$culture_parameter_block_printing_scriptorium$"
 culture_parameter_block_printing_scriptorium: "The [GetBuildingType('scriptorium_1').GetName] [building|E] line grants additional bonuses"

 innovation_grenades: "Grenades"
 innovation_grenades_desc: "Despite all the advancements in warfare, one ancient tool remains invaluable: the arm. Small vessels filled with a flammable or explosive substance can be easily made and thrown by anyone with a decent pitching technique. Grenades distributed to soldiers before a battle can give them a secondary way to attack and shock the enemy."

 innovation_cupellation: "Cupellation"
 innovation_cupellation_desc: "Specialized high-temperature furnaces can melt precious metals out of mining samples, extracting them from smelted ores and producing a refined sample that can be further examined by assayers. Cupellating ore from a lead mine is the best way to determine the silver content of that mine, and cupellating gold can determine its purity for potential coinage."

 innovation_lacquered_armor: "Lacquered Armor"
 innovation_lacquered_armor_desc: "Meticulous application of certain resins to armors strengthens them considerably, and helps weatherproof heavier iron plates. While this process has been known for some time, its use has been largely limited to boxes, bottles, and other wares. Lacquered armor represents a new way to protect both soldiers and their equipment."
 culture_parameter_higher_quality_armor_artifacts_parameter: "Armor [artifacts|E] from [sponsored|E] [inspirations|E] and [GetDecision('commission_artifact_decision').GetName] are of higher Quality"

 innovation_double_entry_bookkeeping: "Double-Entry Bookkeeping"
 innovation_double_entry_bookkeeping_desc: "Records must keep up with the growing complexity of finances and the economy. Recording all payments in and all payments out as separate records helps maintain reliable balance sheets and ensure that entries aren't accidentally — or "accidentally" — overlooked when reviewing accounts."
 culture_parameter_bookkeeping_collect_taxes_bonus: "$task_collect_taxes$ [councillor_task|E]: [gold_i|E]#P +10%#!"

 innovation_waterworks: "Waterworks"
 innovation_waterworks_desc: "Water is the life giver, but has many uses besides quenching thirst or irrigating fields. Artfully harnessed, the sky-fallen resource may power machines many times stronger than any livestock, facilitate travel and trade along man-made canals, or simply keep keep bustling streets sanitary and livable."
 culture_parameter_waterworks_agricultural_bonuses: "The #V $qanat_system$#!, #V $monsoon_water_management$#!, #V $irrigation_network$#!, and #V $water_management$#! lines of [buildings|E] provide additional [agricultural_tax|E]"

 innovation_tiefutu: "$tiefutu$"
 innovation_tiefutu_desc: "$tiefutu_flavor$"

 innovation_bulkheads: "Bulkheads"
 innovation_bulkheads_desc: "The surest way to prevent a ship from sinking is to not breach its hull in the first place. But if that were to happen, the ship might still be saved if the hull was separated into compartments with watertight walls between them. Even if the ship was damaged, a bulkhead could prevent water from sinking the ship entirely, saving men, supplies, and the ship itself in the process."

 innovation_coking: "Coking"
 innovation_coking_desc: "Charcoal is a vital part of smithing, but it needs ample forests nearby in order to reduce wood down into this essential fuel. Coal, heated in something similar to a charcoal kiln, can be reduced down into coke. Coke is just as useful as charcoal in smithing and other industrial fires, without needing to clearcut an entire forest."
 culture_parameter_coking_smith_bonuses: "The [GetBuildingType('blacksmiths_01').GetName] [duchy_district|E] line grants additional bonuses"

 innovation_composite_crossbow: "Composite Crossbows"
 innovation_composite_crossbow_desc: "As with self bows, the strength of a bow's limb determines the potential power of its draw. By reinforcing the span with horn or even steel, the draw-weight and thus range and power of a crossbow can be made magnitudes higher than any wooden counterpart, as well as making it more hard-wearing and longer-lived."

 innovation_pharmacopoeia: "Pharmacopoeia"
 innovation_pharmacopoeia_desc: "All good doctors need to know how to produce the right medicines at the right time, using the right ingredients prepared the right way in the right amounts. While this knowledge is often passed down from master to apprentice on an individual basis, #italic writing down#! how to make specific medicines can help immensely in standardizing and propagating the preparation of different treatments."
 culture_parameter_physician_pharmacopoeia_bonus: "[GetCourtPositionType('court_physician_court_position').GetName()] [court_position|E] Treatment Effectiveness: #P +20%#!"

 innovation_glassmaking: "Glassmaking"
 innovation_glassmaking_desc: "Through careful experimentation with sand, ash, and fire, our artisans have learned to produce clear, workable glass. This craft enables the creation of windows, vessels, and ornamental wares that bring light and beauty to buildings and courts alike."
 unlocks_glassmakers_guild:0 "Unlocks a [building|E] line:\n$BULLET_WITH_TAB$[GetBuildingType('guild_glassmakers_1').GetName] in the [GetDistrictType('guild_district').GetName]"

