l_english:
 county_corruption_inefficient_tax_collection_modifier:0 "Incompetent Tax Collection"
 county_corruption_inefficient_tax_collection_modifier_desc:0 "[county_corruption|E]\nTax collection efforts are failing in the County"
 county_corruption_inefficient_tax_collection_modifier_2: "Systemic Tax Fraud"
 county_corruption_inefficient_tax_collection_modifier_2_desc: "[county_corruption|E]\nTax fraud has become endemic in this County"
 county_corruption_inefficient_tax_collection_modifier_3: "Tax Collapse"
 county_corruption_inefficient_tax_collection_modifier_3_desc: "[county_corruption|E]\nAll meaningful tax collection has collapsed in this County"

 county_corruption_deserting_levies_modifier:0 "Deserting Levies"
 county_corruption_deserting_levies_modifier_desc:0 "[county_corruption|E]\nLevies are deserting in great numbers in this County"
 county_corruption_deserting_levies_modifier_2: "Mass Desertions"
 county_corruption_deserting_levies_modifier_2_desc: "[county_corruption|E]\nLevies are deserting in staggering numbers across this County"
 county_corruption_deserting_levies_modifier_3: "Levy Collapse"
 county_corruption_deserting_levies_modifier_3_desc: "[county_corruption|E]\nThe levy system has completely broken down in this County"

 county_corruption_smuggling_ring_modifier:0 "Smuggling Ring"
 county_corruption_smuggling_ring_modifier_desc:0 "[county_corruption|E]\nSmugglers are running rampant throughout the County"
 county_corruption_smuggling_ring_modifier_2: "Entrenched Smugglers"
 county_corruption_smuggling_ring_modifier_2_desc: "[county_corruption|E]\nSmugglers have built a vast network throughout this County"
 county_corruption_smuggling_ring_modifier_3: "Endemic Smuggling"
 county_corruption_smuggling_ring_modifier_3_desc: "[county_corruption|E]\nBarely anything of worth passes under the eyes of the tax agents in this County"

 county_corruption_bandits_rampant_modifier:0 "Banditry Afoot"
 county_corruption_bandits_rampant_modifier_desc:0 "[county_corruption|E]\nBandits roam freely in the County"
 county_corruption_bandits_rampant_modifier_2: "Bandit Gangs"
 county_corruption_bandits_rampant_modifier_2_desc: "[county_corruption|E]\nPowerful bandit gangs have carved out territories within this County"
 county_corruption_bandits_rampant_modifier_3: "Bandits Running Rampant"
 county_corruption_bandits_rampant_modifier_3_desc: "[county_corruption|E]\nBandits in this County shamelessly behave as if it were their own realm"

 county_corruption_inefficient_census_modifier:0 "Inefficient Census"
 county_corruption_inefficient_census_modifier_desc:1 "This County's rulers have no idea who or how many people live here"
 county_corruption_inefficient_census_modifier_2: "Census Collapse"
 county_corruption_inefficient_census_modifier_2_desc: "The County's administration has lost track of most of its population and holdings"
 county_corruption_inefficient_census_modifier_3: "Administrative Blindness"
 county_corruption_inefficient_census_modifier_3_desc: "Nobody knows who lives here, what they own, and worst of all: what they owe"

 county_corruption_lack_of_sheriffs_modifier:0 "Lack of Sheriffs"
 county_corruption_lack_of_sheriffs_modifier_desc:0 "[county_corruption|E]\nThere are not enough sheriffs to handle all the territory in this County"
 county_corruption_lack_of_sheriffs_modifier_2: "Lawless Territory"
 county_corruption_lack_of_sheriffs_modifier_2_desc: "[county_corruption|E]\nLaw enforcement has broken down across most of this County"
 county_corruption_lack_of_sheriffs_modifier_3: "Ungovernable County"
 county_corruption_lack_of_sheriffs_modifier_3_desc: "[county_corruption|E]\nAuthority over this County exists in name only"

 county_corruption_lack_of_courts_modifier:0 "Distrust of Courts"
 county_corruption_lack_of_courts_modifier_desc:0 "[county_corruption|E]\nThere are not enough courts to sit in judgement in peasant cases in this County"
 county_corruption_lack_of_courts_modifier_2: "Contempt for Law"
 county_corruption_lack_of_courts_modifier_2_desc: "[county_corruption|E]\nThe people of this County have largely given up seeking justice from their rulers"
 county_corruption_lack_of_courts_modifier_3: "Judicial Collapse"
 county_corruption_lack_of_courts_modifier_3_desc: "[county_corruption|E]\nAll respect for the law and its courts has been lost in this County"

 county_corruption_thieves_guild_modifier:0 "Thievery Afoot"
 county_corruption_thieves_guild_modifier_desc:0 "[county_corruption|E]\nThieves are operating freely in this County"
 county_corruption_thieves_guild_modifier_2: "Robber Gangs"
 county_corruption_thieves_guild_modifier_2_desc: "[county_corruption|E]\nCriminals have spread their foul reach throughout this County"
 county_corruption_thieves_guild_modifier_3: "Thieves' Guild"
 county_corruption_thieves_guild_modifier_3_desc: "[county_corruption|E]\nThe thieves' guild effectively controls commerce and movement in this County"

 county_corruption_unsafe_highways_modifier:0 "Unsafe Highways"
 county_corruption_unsafe_highways_modifier_desc:0 "[county_corruption|E]\nThe highways of this County are less safe than wandering through the forest at night"
 county_corruption_unsafe_highways_modifier_2: "Perilous Paths"
 county_corruption_unsafe_highways_modifier_2_desc: "[county_corruption|E]\nThe roads of this County have become a source of terror to all who must travel them"
 county_corruption_unsafe_highways_modifier_3: "Impassable Roads"
 county_corruption_unsafe_highways_modifier_3_desc: "[county_corruption|E]\nThe roads of this County are all but impassable to honest folk"

 county_corruption_uncooperative_guilds_modifier:0 "Uncooperative Guilds"
 county_corruption_uncooperative_guilds_modifier_desc:1 "[county_corruption|E]\nThe local guilds are reluctant to cooperate with this County's rulers"
 county_corruption_uncooperative_guilds_modifier_2: "Obstructive Guilds"
 county_corruption_uncooperative_guilds_modifier_2_desc: "[county_corruption|E]\nThe guilds actively obstruct all official efforts in this County"
 county_corruption_uncooperative_guilds_modifier_3: "Rebellious Guilds"
 county_corruption_uncooperative_guilds_modifier_3_desc: "[county_corruption|E]\nThe guilds are in open revolt against the County's ruler"

 county_corruption_lackluster_administration_modifier:0 "Lackluster Administration"
 county_corruption_lackluster_administration_modifier_desc:1 "[county_corruption|E]\nThis County's ruler can no longer fund the proper administration here"
 county_corruption_lackluster_administration_modifier_2: "Faltering Administration"
 county_corruption_lackluster_administration_modifier_2_desc: "[county_corruption|E]\nAdministration across this County has largely failed"
 county_corruption_lackluster_administration_modifier_3: "Administrative Collapse"
 county_corruption_lackluster_administration_modifier_3_desc: "[county_corruption|E]\nWhat little administration remained in this County has been abandoned entirely"

 county_corruption_roaming_bandits_modifier: "Roaming Bandits"
 county_corruption_roaming_bandits_modifier_desc: "[county_corruption|E]\nGroups of bandits are terrorizing anyone traveling through this County!"
 county_corruption_roaming_bandits_modifier_2: "Bandit Infestation"
 county_corruption_roaming_bandits_modifier_2_desc: "[county_corruption|E]\nMerciless bandits infest every corner of this County"
 county_corruption_roaming_bandits_modifier_3: "Bandit Occupation"
 county_corruption_roaming_bandits_modifier_3_desc: "[county_corruption|E]\nFearsome bandits roam this County freely, terrorizing all honest folk who live here"

 county_corruption_wild_beast_attacks_modifier: "Wild Beast Attacks"
 county_corruption_wild_beast_attacks_modifier_desc: "[county_corruption|E]\nLarge groups of wild beasts are eating sheep and herder alike in this County"
 county_corruption_wild_beast_attacks_modifier_2: "Beast Infestation"
 county_corruption_wild_beast_attacks_modifier_2_desc: "[county_corruption|E]\nWild beasts have grown dangerously numerous throughout this County"
 county_corruption_wild_beast_attacks_modifier_3: "Plagued by Predators"
 county_corruption_wild_beast_attacks_modifier_3_desc: "[county_corruption|E]\nLarge predators roam this County freely, savaging livestock and their owners alike"

 county_corruption_upset_shepherds_modifier: "Upset Shepherds"
 county_corruption_upset_shepherds_modifier_desc: "[county_corruption|E]\nThe shepherds of this County are upset and actively mismanaging their herds"
 county_corruption_upset_shepherds_modifier_2: "Mutinous Shepherds"
 county_corruption_upset_shepherds_modifier_2_desc: "[county_corruption|E]\nThe shepherds of this County are in open defiance of their ruler"
 county_corruption_upset_shepherds_modifier_3: "Pastoral Collapse"
 county_corruption_upset_shepherds_modifier_3_desc: "[county_corruption|E]\nThe pastoral way of life has collapsed completely in this County"

 county_corruption_rogue_warriors_modifier: "Renegade Warriors"
 county_corruption_rogue_warriors_modifier_desc: "[county_corruption|E]\nHordes of warriors are fighting and extorting everyone in this County"
 county_corruption_rogue_warriors_modifier_2: "Renegade Warbands"
 county_corruption_rogue_warriors_modifier_2_desc: "[county_corruption|E]\nRogue warriors have organized themselves into warbands plaguing this County"
 county_corruption_rogue_warriors_modifier_3: "Renegade Warlords"
 county_corruption_rogue_warriors_modifier_3_desc: "[county_corruption|E]\nThis County is carved up between petty local warlords who answer to no one"

 county_corruption_unruly_nomads_modifier: "Unruly Nomads"
 county_corruption_unruly_nomads_modifier_desc: "[county_corruption|E]\nThe nomads living in this County are unruly and prone to quarreling"
 county_corruption_unruly_nomads_modifier_2: "Disobedient Nomads"
 county_corruption_unruly_nomads_modifier_2_desc: "[county_corruption|E]\nNomads in this County pay little heed to anyone not of their blood"
 county_corruption_unruly_nomads_modifier_3: "Rebellious Nomads"
 county_corruption_unruly_nomads_modifier_3_desc: "[county_corruption|E]\nNomads throughout this County are on the verge of open uprisings"

