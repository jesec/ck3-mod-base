l_english: 
 gdp_merchant_family.0001.t: "Runaway [house_member.Custom('GetBrideGroom')|U]"
 gdp_merchant_family.0001.desc: "A tumble in the dark reveals my [ROOT.Char.Custom2('RelationToMe', house_member)] [house_member.GetTitledFirstName] rifling the company coffer, a [wedding_interest.GetWomanMan] by [house_member.GetHerHis] side, urging [house_member.GetHerHim] to move in a hushed voice.\n\n"What is the meaning of this?" I ask, and the pair turns around, clutching at each other. Now, I recognize the stranger as [wedding_interest_house_head.GetTitledFirstNamePossessive] [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)].\n\n"We're not staying here any longer. The poison between our families will keep us apart, so we've decided to leave," [house_member.GetTitledFirstNameNoTooltip] says,"
 gdp_merchant_family.0001.desc.stubborn_outro: "chin raised in defiance, hand squeezing [wedding_interest.GetTitledFirstNamePossessiveNoTooltip]."
 gdp_merchant_family.0001.desc.fallback_outro: "letting go of [wedding_interest.GetTitledFirstNamePossessiveNoTooltip] hand, though it seems painful for [house_member.GetHerHim] to do so, and reaching out for me in a silent plea."
 gdp_merchant_family.0001.a: ""Take the gold, and go with my blessing.""
 gdp_merchant_family.0001.b: ""What can I do to convince you both to stay?""
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName] joins you"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName] is not impressed"
 gdp_merchant_family.0001.c: ""You're going #EMP nowhere#!!""

 gdp_merchant_family.0002.t: "Thicker Than Water"
 gdp_merchant_family.0002.desc_intro: "I am reviewing the latest profit reports when [blood.Custom2('MyCharacterIntroduction', ROOT.Char)] storms in.\n\n"This [water.Custom('InsultAdjective')] [water.Custom('InsultNoun')] is overstepping," [blood.GetSheHe] snaps. "[water.GetSheHe|U] takes risks, ignores boundaries, and makes the rest of us look like absolute fools. "
 gdp_merchant_family.0002.desc_adopted: "That is hardly proper for a member of House [ROOT.Char.GetHouse.GetName].""
 gdp_merchant_family.0002.desc_associate: "That is hardly proper for a mere associate of our company.""
 gdp_merchant_family.0002.desc_outro: "\n\nWhen the complaints finally end, I look back to the ledger. Whatever else may be true, [water.GetFirstNameNoTooltip] is bringing in profit, and results are hard to argue with."
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip] must learn [water.GetHerHis] place."
 gdp_merchant_family.0002.a.unity_gain.desc: "chose blood family over business merit"
 gdp_merchant_family.0002.b: "Come back when you have [water.GetFirstNamePossessiveNoTooltip] results."
 gdp_merchant_family.0002.b.unity_loss.desc: "chose business merit over blood family"
 gdp_merchant_family.0002.c: ""I am too busy for this...""

 gdp_merchant_family.0003.t: "Suffer No Dishonor"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me clearly annoyed.\n\n"You will not believe what I was just told," [offended.GetSheHe] says. "[offender.Custom2('MyCharacterIntroduction', ROOT.Char)] thought it amusing to insult me and by extension, our House."\n\nThe slight is petty, but deliberate."
 gdp_merchant_family.0003.a: "By [ROOT.Char.GetFaith.HighGodName], House [offender.GetHouse.GetNameNoTooltip] will apologize!"
 gdp_merchant_family.0003.a.unity_gain.desc: "presented a united front against a public insult"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U] publicly insulted [target_char.GetShortUINamePossessive] House"
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U], focus on what they are not saying..."
 gdp_merchant_family.0003.b.unity_loss.desc: "refused to answer an insult in kind"
 gdp_merchant_family.0003.c: "You sort this out. I have other matters to attend to."
 gdp_merchant_family.0003.c.unity_loss.desc: "ignored an insult made to our House"

 gdp_merchant_family.0004.t: "An Auspicious Offer"
 gdp_merchant_family.0004.desc: "As I go for a leisurely stroll, I hear an unfamiliar voice addressing me across the yard. "I would like a word, [ROOT.Char.Custom('FormOfAddressForLiege')]." [offer_2.GetFullName] stands right in front of me, speaking in a honeyed tone.\n\n"[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U] sends me with a proposal. I am to marry [offer.Custom2('YourCharacterIntroduction', ROOT.Char)] and strengthen the bonds between our two Houses." My breath is involuntarily held as I consider the offer.\n\n"So, what does [ROOT.Char.Custom('FormOfAddressForLiege')] say?""
 gdp_merchant_family.0004.a: ""My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))] would be honored.""
 gdp_merchant_family.0004.b: ""How about a mutually beneficial deal?""
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U] and [target_char.GetShortUINamePossessive] signed a mutually beneficial deal"
 gdp_merchant_family.0004.c: ""I must respectfully decline, but you are welcome to stay.""

 gdp_merchant_family.0005.t: "A Shame Upon the [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.0005.desc: "Word has come to me that [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)] has misplaced a pivotal shipment under [wayward.GetHerHis] responsibility, which would severely hinder our reputation if unaddressed. I call [wayward.GetHerHim] to my chambers to question [wayward.GetHerHim] about it.\n\n"I am truly sorry, [wayward.Custom2('RelationToMe', ROOT.Char)], but you should not blame me for this mishap. My own blood, my own House is trying to undermine me!""
 gdp_merchant_family.0005.a: ""Curse you, my [wayward.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]!""
 gdp_merchant_family.0005.a.unity_loss.desc: "public condemned a member of the House"
 gdp_merchant_family.0005.b: ""We stand as one, always.""
 gdp_merchant_family.0005.b.unity_gain.desc: "chose to face adversity together"
 gdp_merchant_family.0005.c: ""Sort this out.""

 gdp_merchant_family.0010.t: "The Tipping of the Scales"
 gdp_merchant_family.0010.desc: "With a — #EMP CRASH#! — crates hit the ground, and the usual [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] activity grinds to a halt. I turn to see my two associates [attacker.GetTitledFirstName] and [defender.GetTitledFirstName] on the verge of coming to blows.\n\n"I am working myself to death for this family," [attacker.GetTitledFirstNameNoTooltip] says and [attacker.Custom('quirk_neg_present')], rage shining madly in his eyes. "While this excuse of a [defender.GetWomanMan] idles about [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. If you do not stop me, I swear I will knock some sense into [defender.GetHerHim].""
 gdp_merchant_family.0010.a: "This is no way for my associates to behave."
 gdp_merchant_family.0010.a.tt.success: "You successfully mediate the conflict"
 gdp_merchant_family.0010.a.tt.failure: "You fail to mediate the conflict"
 gdp_merchant_family.0010.b: "Go on, show everyone how we settle a score."
 gdp_merchant_family.0010.c: "You will regret raising your hand against [defender.GetTitledFirstNameNoTooltip]!"
 gdp_merchant_family.0010.d: "Do as you will."
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUIName] and [defender.GetShortUIName] will start a combined [prowess_i][prowess|E] and [martial_i][martial|E] duel against each other! Someone will become wounded#!"
 merchant_unity_fight_stopped: "stopped in-fighting between members of the company"
 merchant_unity_fight_promoted: "promoted in-fighting between members of the company"

 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] Wins"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U] wounded [defender.GetFirstName]"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip] Wins"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.GetSheHe|U] wounded [attacker.GetFirstName] in self-defense"
 gdp_merchant_family.0015.t: "A Business Confidant"
 gdp_merchant_family.0015.desc: "Out of all the familiar faces of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]'s [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l], [tip_giver.GetShortUIName] catches my eye and draws me aside. With a sly smile, [tip_giver.GetSheHe] hands me a ledger.\n\n"Ah, [ROOT.Char.GetTitledFirstName], just the person I was looking for! Let me share some of my recent insights, consider it an offering for our continued collaboration.""
 gdp_merchant_family.0015.a: ""Together we could make a hefty profit!""
 gdp_merchant_family.0015.b: ""Let me purchase this from you.""
 gdp_merchant_family.0015.b.artifact: "Insider Ledger"
 gdp_merchant_family.0015.b.artifact.desc: "A closely guarded book of market profits, margins and useful contacts"
 gdp_merchant_family.0015.c: ""#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#! will benefit from this…""
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U] and [target_char.GetShortUIName] exchanged a profitable tip"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U] used [target_char.GetShortUINamePossessive] tip against [target_char.GetHerHim]"
 gdp_merchant_family.0020.t: "Talent Exchange"
 gdp_merchant_family.0020.desc: "My business contact [house_friend.Custom('MistressMaster')|U] [house_friend.GetFirstName] is running late for our usual meeting. When [house_friend.GetSheHe] finally arrives, it is with unexpected company.\n\n"[ROOT.Char.Custom('MistressMaster')|U], this is my [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))] [nepo_hire.GetFirstName], "
 gdp_merchant_family.0020.desc.diplomacy: "a skilled diplomat. "
 gdp_merchant_family.0020.desc.martial: "a headstrong strategist. "
 gdp_merchant_family.0020.desc.stewardship: "a master with the books. "
 gdp_merchant_family.0020.desc.intrigue: "a keen-witted [nepo_hire.GetWomanMan]. "
 gdp_merchant_family.0020.desc.learning: "a learned [nepo_hire.GetWomanMan]. "
 gdp_merchant_family.0020.desc.outro: "Under your supervision at [ROOT.Char.GetPrimaryTitle.GetName], [nepo_hire.GetSheHe] would surely flourish.""
 gdp_merchant_family.0020.a: ""[nepo_hire.GetFirstNameNoTooltip|U] is welcome to join us.""
 gdp_merchant_family.0020.a.unity_loss.desc: "handed out an associate position as a favor"
 gdp_merchant_family.0020.b: ""I am afraid we have no vacancies.""
 gdp_merchant_family.0020.b.unity_gain.desc: "declined to hire an outsider"
 gdp_merchant_family.0020.c: ""You insult me with this proposal.""
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U] took [target_char.GetShortUINamePossessive] kin into [char.GetHerHis] company"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U] declined [target_char.GetShortUINamePossessive] kin"
 gdp_merchant_family.0025.t: "Nothing Personal"
 gdp_merchant_family.0025.desc: "My wrists ache as I sign the last of a seemingly endless pile of trade agreements. Just as I am about to call it a night, [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)] approaches me. Fumbling nervously, [leaving_associate.GetSheHe] holds up a small parchment and begins to recite its contents.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I regret to inform you that I have received an offer from [rival_poacher.GetPrimaryTitle.GetName] that I simply cannot refuse. It is not you, it is just good business.""
 gdp_merchant_family.0025.a: ""Go with my blessing.""
 gdp_merchant_family.0025.b: ""Your place is here, with us.""
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U] stays with the [company|E]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip] agrees to stay"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip] leaves regardless"
 gdp_merchant_family.0025.c: ""Remember, you owe me.""
 gdp_merchant_family.0025.d: ""Fine, leave.""
 gdp_merchant_family.0025.d.rival: ""[rival_poacher.GetTitledFirstNameNoTooltip], you will curse the day you crossed me!""
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U] poached an [associate|E] from [CHARACTER.GetShortUIName]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U] released an [associate|E] to [target_char.GetShortUINamePossessive] company in good faith"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U] poached an [associate|E] from [char.GetHouse.GetName]"

 gdp_merchant_family.0030.t: "Business or Pleasure?"
 gdp_merchant_family.0030.desc: "Two of my associates, [house_member.GetTitledFirstName] and [associate.GetTitledFirstName], return to [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] office after a #EMP considerable#! mealtime excursion, and bring with them a jug of [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\n"... And I told him, that cat belongs in a pig sty!" [house_member.GetTitledFirstNameNoTooltip] says, getting a full-belly laugh from [associate.GetTitledFirstNameNoTooltip].\n\nIf I do not act, the pair of them are unlikely to get anything productive done for the rest of the day."
 gdp_merchant_family.0030.a: ""Let me fetch a proper bottle.""
 gdp_merchant_family.0030.a.flavor: "Only the best for [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]"
 gdp_merchant_family.0030.b: ""Get back to work, you ungrateful lot!""
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] will suffer no layabouts"
 gdp_merchant_family.0030.c: "Let's see where this friendship leads."
 merchant_unity_breaks_encouraged: "only drinks the finest the market has to offer"
 merchant_unity_breaks_discouraged: "discouraged work breaks" 

 gdp_merchant_family.9000.t: "Young [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "I am at last a [ROOT.Char.GetWomanMan], and old enough to take my rightful place as [ROOT.Char.GetTitleAsNameNoTooltip|l] of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. I must fill the boots left empty by my [ROOT.Char.Custom2('RelationToMeShort', predecessor)], [predecessor.GetFirstName].\n\nMy associates now look to me to steer our enterprise, to find new courses and opportunities in the world of commerce, even if I am told I should rely on their experience and wisdom..."
 gdp_merchant_family.9000.a: "[educator.GetTitledFirstNamePossessiveNoTooltip] guidance will be invaluable."
 gdp_merchant_family.9000.b: "Where to begin..."
 gdp_merchant_family.9000.route_hint_tt: "You can now create and edit [distribution_routes|E]"

 gdp_merchant_family.9010.t: "A Company Bereft"
 gdp_merchant_family.9010.desc: "My [ROOT.Char.Custom2('RelationToMeShort', previous_holder)], [previous_holder.GetFirstName], has left us. [previous_holder.GetSheHe|U] was the company's respected [previous_holder.Custom('MistressMaster')]. There is no more laughter in our halls, no heated debates in the offices, and everyone looks so worried.\n\n"
 gdp_merchant_family.9010.interim_generated: "All look to a [interim.GetWomanMan] named [interim.GetFirstName], who was called upon to help manage affairs and"
 gdp_merchant_family.9010.interim_relation: "All look to my [ROOT.Char.Custom2('RelationToMeShort', interim)], [interim.GetFirstName], who"
 gdp_merchant_family.9010.interim: "All look to my [ROOT.Char.Custom2('RelationToMePossessive', previous_holder)] trusted associate, [interim.GetFirstName], who"
 gdp_merchant_family.9010.close: "has made the arrangements in [previous_holder.GetFirstNamePossessiveNoTooltip] absence, and will see to the day-to-day business until I am old enough to manage."
 gdp_merchant_family.9010.a: "Things have changed so fast."

 gdp_merchant_family.9110.t: "Tricks of the Trade"
 gdp_merchant_family.9110.desc: "My [ROOT.Char.Custom2('RelationToMeShort', trader)], [trader.GetFirstName], is among the most experienced merchants of the company, and rarely in the office.\n\n[trader.GetSheHe|U] manages [route.GetName|l], ensuring every last [good.Custom('GetTradeGoodUnit')] safely finds its way from seller to buyer, fattening our purse with [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] on its way.\n\n"A good trader is everywhere at once." [trader.GetSheHe|U] smiles. "Knows the faces at every stall in the [ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')], their troubles - and those of every town and caravan guard!""
 gdp_merchant_family.9110.a: "When I'm in charge, I'll be like [trader.GetNameNoTooltip]."
 gdp_merchant_family.9110.b: ""Tell me of the caravans!""
 gdp_merchant_family.9110.b.tt: "Upon coming of age, you will gain #V 10#! [trait_level_track_xp|E] in #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9110.c: ""I want to be a [good.Custom('GetTradeGood')] trader too!""
 gdp_merchant_family.9110.c.tt: "Upon coming of age, [merchant.GetPrimaryTitle.GetDefinitiveName|l] will gain #V 450#! [category.GetNameWithIcon] [trade_expertise|E]"

 gdp_merchant_family.9130.t: "The Ambitions of Youth"
 gdp_merchant_family.9130.desc: "I learn much observing the daily business of the company, and my associates make every effort to include me to further my understanding."
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] trades far and wide, and its ledgers are full of places I can scarcely pronounce, far from [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]. Where, I can only guess."
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] are known as purveyors of rare and quality articles, and patrons of [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip] craftspeople."
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] are known for trading [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] for favors, its ledgers full of the names of [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip] misfortunates and gamblers."
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] is well-established, but not known for anything in particular. It is merely one of the [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip] trading houses, with fingers in many pies."
 gdp_merchant_family.9130.a: "I just cannot wait to be the helms[ROOT.Char.GetWomanMan]."
 gdp_merchant_family.9130.a.caravaneer: "And we shall go even further."
 gdp_merchant_family.9130.a.artisan: "Our name is a hallmark of quality."
 gdp_merchant_family.9130.a.creditor: "Credit is our business."
 gdp_merchant_family.9130.a.tt: "Upon coming of age, you will gain #V 5#! [trait_level_track_xp|E] in each of #emp $trait_track_caravaneer$#!, #emp $trait_track_artisan$#!, and #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9130.b: "The wider world is full of potential."
 gdp_merchant_family.9130.b.tt: "Upon coming of age, you will adopt the [GetLaw('company_purpose_caravaneer').GetName] [company_purpose|E] at #P no cost#! and gain #V 20#! [trait_level_track_xp|E] in #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9130.c: "Much is spent on pretty baubles."
 gdp_merchant_family.9130.c.tt: "Upon coming of age, you will adopt the [GetLaw('company_purpose_artisan').GetName] [company_purpose|E] at #P no cost#! and gain #V 20#! [trait_level_track_xp|E] in #emp $trait_track_artisan$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9130.d: "Real power and riches lie in leverage."
 gdp_merchant_family.9130.d.tt: "Upon coming of age, you will adopt the [GetLaw('company_purpose_creditor').GetName] [company_purpose|E] at #P no cost#! and gain #V 20#! [trait_level_track_xp|E] in #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 company_purpose_child_blocker_tt: "You are a [child|E]"

 gdp_merchant_family.9140.t: "Market Fodder"
 gdp_merchant_family.9140.desc: "From the stuffy offices in [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly], I am taught of the trade routes where [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] makes our fortune, or tries to. There are so many places and goods to remember.\n\nI am snapped out of my daydreaming by [associate.GetFirstName] rapping the table with [associate.GetHerHis] [ROOT.Char.Custom('WritingInstrument')]. "Come [ROOT.Char.Custom('GirlBoy')]! Some [ROOT.Char.GetTitleAsNameNoTooltip] you will be if you don't learn of our business!""
 gdp_merchant_family.9140.a: ""Tell me of the [category_1.Custom('GetTradeGoodCategory')] trade.""
 gdp_merchant_family.9140.a.tt: "Upon coming of age, [merchant.GetPrimaryTitle.GetDefinitiveName|l] will gain #V 450#! [category_1.GetNameWithIcon] [trade_expertise|E]"
 gdp_merchant_family.9140.b: ""Dealing in [category_2.Custom('GetTradeGoodCategory')] fascinates me.""
 gdp_merchant_family.9140.b.tt: "Upon coming of age, [merchant.GetPrimaryTitle.GetDefinitiveName|l] will gain #V 450#! [category_2.GetNameWithIcon] [trade_expertise|E]"
 gdp_merchant_family.9140.c: ""I want to learn about the movement of [category_3.Custom('GetTradeGoodCategory')].""
 gdp_merchant_family.9140.c.tt: "Upon coming of age, [merchant.GetPrimaryTitle.GetDefinitiveName|l] will gain #V 450#! [category_3.GetNameWithIcon] [trade_expertise|E]"

 gdp_merchant_family.9150.t: "Right Hand [partner.GetWomanMan|U]"
 gdp_merchant_family.9150.desc: "Awaiting my maturity, much of my day is spent in the train of the company's partner, [partner.GetFirstName]. I shadow [partner.GetHerHis] dealings and meetings, picking up any knowledge I can.\n\n[partner.GetSheHe|U] turns to me one day after an arduous session at the ledgers. "You are doing well, young [ROOT.Char.GetTitleAsNameNoTooltip]." [partner.GetSheHe] grins, flicking me a coin. "Business is not easy, but unlike the [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')] [ROOT.Char.GetSuzerain.GetTitleAsName], our graft alone keeps us afloat.""
 gdp_merchant_family.9150.a: ""I will not let you or the company down.""
 gdp_merchant_family.9150.b: ""You have more than earned it, [partner.GetFirstNameNoTooltip].""
 gdp_merchant_family.9150.b.tt: "For the next #V 10#! years, [partner.GetShortUINamePossessive] [GetCourtPositionType( 'partner_court_position' ).GetName()] [aptitude|E]: #p +1#!"
 gdp_merchant_family.9150.c: ""And yet without the [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip], where would be?""
 gdp_merchant_family.9150.c.tt: "Upon coming of age, you will gain the [GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip] [modifier|E] for #V 10#! years"
 merchant_childhood_suzerain_modifier: "Patron Pleaser"
 merchant_childhood_suzerain_modifier_desc: "This character understands the importance of maintaining good relationships with those who wield the largest stick."
 merchant_childhood_desc: "Merchant Childhood"
