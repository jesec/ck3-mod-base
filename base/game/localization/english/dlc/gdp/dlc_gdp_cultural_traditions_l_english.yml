l_english:

 tradition_fortune_seekers_name: "Fortune Seekers"
 tradition_fortune_seekers_desc: "This culture sees no shame in leaving home with nothing, and expects those who stand to inherit little to seek their fortune abroad. There they learn the ways of myriad roads, and with them the weight of every good and the terms of every loan."

 culture_parameter_fortune_seekers_merchant_propensity: "[characters|E] of this [culture|E] are more likely to become [merchants|E]"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "Unlocks the #V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName]#! [domicile_building|E]"

 tradition_saharan_traders_name: "Saharan Traders"
 tradition_saharan_traders_desc: "It is an old truth that the Sahara desert is not a barrier as much as it is a highway for trade, connecting the Sahel and West African inland with the Mediterranean sea. This culture has embraced its role in this exchange, many live their entire lives in caravans."

 culture_parameter_oasis_villages_building_slot: "The #V [GetDistrictType('villages_district').GetName]#!, #V [GetDistrictType('religious_community_district').GetName]#!, and #V [GetDistrictType('manor_houses_district').GetName]#! [districts|E] have #P +1#! [building|E] Slot in [GetTerrain( 'oasis' ).GetName]"
 culture_parameter_saharan_seasoned_traveler_route_length: "Each level of the #V $trait_track_danger$#! track of the [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] [trait|E] gives #P +1#! [trade_route_length|E]"
 culture_parameter_saharan_merchant_domicile_buildings: "Unlocks the #V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#! and #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#! [domicile_buildings|E]"
 culture_parameter_caravan_escort_compound_domicile_building: "Unlocks the #V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName]#! [domicile_building|E]"

 tradition_silk_road_traders_name: "Silk Road Entrepreneurs"
 tradition_silk_road_traders_desc: "The Silk Road brings a constant stream of goods between East and West. Silk, tea, lacquerware, jade and many other expensive goods are brought from station to station along the long trek. This has shaped the societies of the road. Rich cities either engage directly in long-distance trade or sell to those who do."

 tradition_monsoon_traders_name: "Monsoon Merchants"
 tradition_monsoon_traders_desc: "From the nakhudas of the west to the trade guilds and castes in the east, Indian Ocean merchants have brought pepper, cotton cloth and precious goods to market, generation after generation."

 culture_parameter_caravanserai_hospitality: "[characters|E] of this [culture|E] can use the #V $host_honored_guest_interaction$#! [interaction|E]"
 culture_parameter_stewardship_gain_from_foreign_poi: "Visiting a [point_of_interest|E] in the lands of another [culture|E] grants [stewardship|E] [lifestyle_experience|E]"
 culture_parameter_silk_road_market_expertise: "The #V $visit_silk_road_market_decision$#! [decision|E] benefits you more"
 culture_parameter_silk_road_oasis_urban_building_slots: "The #V [GetDistrictType('urban_housing_district').GetName]#! and #V [GetDistrictType('guild_district').GetName]#! [districts|E] have #P +1#! [building|E] Slot in [GetTerrain( 'oasis' ).GetName]"
 culture_parameter_silk_road_market_owner_bonuses: "Silk Road Market [buildings|E] give additional [commerce_tax|E]"
 culture_parameter_silk_road_merchant_domicile_buildings: "Unlocks the #V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName]#! and #V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName]#! [domicile_buildings|E]"

 culture_parameter_monsoon_traveler_trade_bonuses: "The #V $trait_track_travel$#! track of the [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] [trait|E] gives additional [competitiveness_i][trade_competitiveness|E], and the #V $trait_track_danger$#! track gives additional [trade_route_capacity_i][capacity|E]"
 culture_parameter_monsoon_port_buildings_settlement_size: "[buildings|E] in the #V [GetDistrictType('port_district').GetName]#! [district|E] give #P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#! [settlement_size|E]"
 culture_parameter_monsoon_merchant_domicile_buildings: "Unlocks the #V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName]#! and #V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName]#! [domicile_buildings|E]"

 tradition_binding_oaths_name: "Binding Oaths"
 tradition_binding_oaths_desc: "Agreements must be kept. This people believes that a contract that has been struck must never be broken. There can be no tolerance for an oathbreaker."

 culture_parameter_binding_oaths_harsh_break_penalties: "Breaking a [truce|E], denouncing a [creditor|E], or being exposed as a [GetTrait('dealbreaker').GetName( GetNullCharacter )], causes a far harsher loss of [opinion|E] within the [culture|E] and costs #N 10%#! of a [company|E]'s [acumen|E]"
 culture_parameter_binding_oaths_word_is_trusted: "Other [rulers|E] are far likelier to accept their #V $negotiate_alliance_interaction$#! [interaction|E] and to answer their #V $call_ally_interaction$#! [interaction|E], which costs [prestige_i]#P -50%#!"
 culture_parameter_good_faith_traits_more_common: "The [GetTrait('honest').GetName( GetNullCharacter )] and [GetTrait('trusting').GetName( GetNullCharacter )] [traits|E] are more common"
 culture_parameter_good_faith_trait_bonuses: "The [GetTrait('honest').GetName( GetNullCharacter )] and [GetTrait('trusting').GetName( GetNullCharacter )] [traits|E] have additional bonuses"

 culture_parameter_better_stewardship_education: "[children|E] of this [culture|E] are more likely to receive a good [education|E] in [stewardship|E]"

 binding_oaths_broke_word_modifier: "Breaker of Oaths"
 binding_oaths_alliance_accept_reason: "Your [GetCultureTradition('tradition_binding_oaths').GetName] [tradition|E] holds you to your word: $VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "My [GetCultureTradition('tradition_binding_oaths').GetName] [tradition|E] holds me to our [alliance|E]: $VALUE|=+0$"

 culture_parameter_unlock_carnival_activity: "[republican|E] [rulers|E] may host the [GetActivityType('activity_carnival').GetName] [activity|E]"
 culture_parameter_merchant_propensity_bonus: "[characters|E] of this [culture|E] are more likely to become [merchants|E]"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line' )]"
 culture_parameter_trade_league_cohesion_bonus_has_dlc: "Each [title|E] of this [culture|E] in a [trade_league|E] contributes #P +0.02#! monthly [league_cohesion|E]"
 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line' )]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "A [trade_league|E] may be founded by [county|E]-tier [rulers|E]"

 tradition_roman_law_name: "Roman Law"
 tradition_roman_law_desc: "Roman law once built this land. In this culture law is still taught to everyone of importance, and its use is everywhere in society. Peasants, artisans, widows, nobles, merchants, all rely on the letter of the law to settle conflicts."

 culture_parameter_roman_law_cheaper_university: "Sending a [ward|E] to University and hosting the [GetActivityType('activity_adult_education').GetName] [activity|E] cost [gold_i]#P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#!"
 culture_parameter_roman_law_university_bonuses: "University [buildings|E] give additional benefits"
 culture_parameter_roman_law_education_bonuses: "[learning|E] and [stewardship|E] [education_traits|E], fifth-level [education_traits|E], have additional [competitiveness_i] [trade_competitiveness|E] and [stewardship_i][stewardship_skill|E] bonuses."
 culture_parameter_roman_law_legal_buildings_in_guild_district: "The #V [GetBuildingType('notary_1').GetName]#! and #V [GetBuildingType('court_of_law_1').GetName]#! lines of [buildings|E] can be built in the #V [GetDistrictType('guild_district').GetName]#!"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "The #V [GetBuildingType('market_court_1').GetName]#!, #V [GetBuildingType('notary_1').GetName]#!, and #V [GetBuildingType('court_of_law_1').GetName]#! lines of [buildings|E] give additional [popular_opinion_i] [popular_opinion|E]"
 culture_parameter_roman_law_notariate_domicile_building: "Unlocks the #V [GetDomicileBuilding('merchant_company_notariate_01').GetName]#! [domicile_building|E]"

 tradition_civic_religion_name: "Civic Religion"
 tradition_civic_religion_desc: "This people is letting guilds and confraternities handle religious matters. Everything from caring for the poor, defending a city, or constructing a church, is the responsibility of pious groups of citizens."

 culture_parameter_civic_religion_temple_district_restriction: "The #V [GetDistrictType('temple_district').GetName]#! [district|E] is not available to [secular_rulers|E]"
 culture_parameter_civic_religion_guild_building_slots: "The #V [GetDistrictType('guild_district').GetName]#! has #P +2#! [building|E] Slots"
 culture_parameter_civic_religion_guild_charity_buildings: "The #V [GetBuildingType('charities_1').GetName]#!, #V [GetBuildingType('hospitals_1').GetName]#!, #V [GetBuildingType('scribe_shop_1').GetName]#!, and #V [GetBuildingType('scholarly_guilds_1').GetName]#! lines of [buildings|E] can be built in the #V [GetDistrictType('guild_district').GetName]#!"
 culture_parameter_civic_religion_basilica: "Unlocks the [GetBuildingType('republic_basilica_01').GetName|V] [building|E] line in the [GetDistrictType('republic_great_plaza_district').GetName|V] for [republics|E]"
 culture_parameter_civic_religion_cathedral_civic_tax: "Cathedral [buildings|E] also give [civic_tax|E]"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "Changing a [personal_tenet|E] causes less [stress|E]"
 culture_parameter_civic_religion_education_piety_bonuses: "[diplomacy|E] [education_traits|E] and the [GetTrait('education_republican_knowledge_3').GetName( GetNullCharacter )] line of [traits|E] give additional [piety_i][piety|E]"
 culture_parameter_civic_religion_trait_piety_bonuses: "The [GetTrait('gregarious').GetName( GetNullCharacter )] and [GetTrait('family_first').GetName( GetNullCharacter )] [traits|E] give additional [piety_i][piety|E]"
 culture_parameter_unlock_improved_republic_militia: "[republican|E] [rulers|E] may enact the #V $republic_army_organization_2_improved_levy$#! [law|E]"

 tradition_contado_name: "Contado"
 tradition_contado_desc: "A pattern of small but urban fortified towns dot the lands of this culture, often originally put in place by a local landlord. Through sharecropping urban landholders have become distant from the day to day of the countryside."

 culture_parameter_contado_castello_buildings: "The #V [GetBuildingType('castello_1').GetName]#! line of [buildings|E] can be built in the #V [GetDistrictType('villages_district').GetName]#!"
 culture_parameter_contado_borghi_buildings: "The #V [GetBuildingType('borghi_1').GetName]#! line of [buildings|E] can be built in the #V [GetDistrictType('walls_district').GetName]#!"
 culture_parameter_contado_towers_domicile_building: "Unlocks the #V [GetDomicileBuilding('merchant_company_towers_01').GetName]#! [domicile_building|E]"

 tradition_contract_warfare_name: "Contract Warfare"
 tradition_contract_warfare_desc: "This culture has institutionalized warfare far beyond levies and citizen armies. Troops work on a contract and officers negotiate campaign goals with cities and lords. Killing has gone from a personal to a professional matter."

 culture_parameter_unlock_innovation_condottieri: "The #high $innovation_condottieri$#! [innovation|E] becomes available in the $culture_era_late_medieval$ [era|E]"
 culture_parameter_contract_warfare_single_combat: "[rulers|E] with a [commander_trait|E], a [martial|E] [education_trait|E], or the [GetTrait('brave').GetName( GetNullCharacter )] [trait|E] may use the #V $challenge_to_single_combat_nomadic_interaction$#! [interaction|E] on [characters|E] of equal or lower [title_tier|E] who are not their [liege|E]"

 culture_has_university_desc: "The [culture|E] is not present in any [county|E] with a University"
 cultrad_republic_government_type: "Your [government|E] is [GetGovernment( 'republic_government' ).GetName]"
 cultrad_has_military_district: "You hold a [holding|E] with a #V [GetDistrictType('military_district').GetName]#!"

 culture_in_oasis_desc: "The [culture|E] is not present in any [county|E] with [GetTerrain( 'oasis' ).GetName] [terrain|E]"
 oasis_count_desc: "The [culture|E] is not present in at least #V 2#! [counties|E] with [GetTerrain( 'oasis' ).GetName] [terrain|E]"
 culture_in_silk_road_region_desc: "The [culture|E] is not present along the [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 silk_road_percentage_desc: "The [culture|E] does not have #V 30%#! of its [counties|E] along the [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 culture_on_monsoon_coast_desc: "The [culture|E] is not present in any coastal [county|E] of [GetGeographicalRegion('world_india').GetName], [GetGeographicalRegion('world_africa_east').GetName], or [GetGeographicalRegion('world_middle_east').GetName]"

 only_one_caravan_trade_tradition: "Only one caravan trade [tradition|E] is allowed and the following cannot be combined: $tradition_saharan_traders_name$ and $tradition_silk_road_traders_name$"
 only_one_seaborne_trade_tradition: "Only one seaborne trade [tradition|E] is allowed and the following cannot be combined: $tradition_maritime_mercantilism_name$ and $tradition_monsoon_traders_name$"
