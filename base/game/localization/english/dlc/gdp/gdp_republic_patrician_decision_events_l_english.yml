l_english:
 city_stroll_prefix: "City Promenade"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: Finders Keepers"
 gdp_republic_patrician_decision.1000.desc: "I turn a corner into the alleyway off the main street, and come across a local peddler, mid-conversation:\n\n"... and then nobody came to pick it up." the [local_character.GetWomanMan] shrugs at [local_character.GetHerHis] companion and points at the crates of [abandoned_trade_good.GetNameNoTooltip|l] littering the alleyway.\n\nNo one is stepping forward, claiming ownership of the lot. I quickly size the cargo up and down. An #EMP opportunity#!."
 gdp_republic_patrician_decision.1000.a: "How about we create some demand..."
 gdp_republic_patrician_decision.1000.a.flavor: "The crates of [abandoned_trade_good.GetNameNoTooltip|l] turn up broken, its contents shattered."
 gdp_republic_patrician_decision.1000.b: ""O-ho, that's mine, see!""
 gdp_republic_patrician_decision.1000.c: ""Ah, [liege_scope.GetTitledFirstNamePossessiveNoTooltip] lost [abandoned_trade_good.GetNameNoTooltip|l]! Many thanks.""
 gdp_republic_patrician_decision.1000.d: "Well, this is none of my business."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: A Day in the Garden"
 gdp_republic_patrician_decision.1010.desc: "I find a hidden oasis; a veritable gem in the rough, in a small garden nested in the nooks and alleyways of [city_location.GetTitle.GetNameNoTier]. The walkways have seen better days and the amount of plants are low, but well-kept. A place with a very dedicated caretaker.\n\nGroups of nobles but also merchants, commoners and laborers dwell in the greenery, enjoying a brief respite from their work.\n\nI saunter along, my spirit slightly lighter and my burdens slightly more bearable."
 gdp_republic_patrician_decision.1010.a: "We shall make this the best garden in [city_location.GetTitle.GetNameNoTierNoTooltip]!"
 gdp_republic_patrician_decision.1010.b: "Now, what's this lil' plant?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "You find intriguing plants"
 gdp_republic_patrician_decision.1010.b.health_plant: "You find benevolent herbs"
 gdp_republic_patrician_decision.1010.c: "Let me just... be a little more free..."
 gdp_republic_patrician_decision.1010.c.flavor: "Let it all hang out. How relaxing!"
 gdp_republic_patrician_decision.1010.c.success: "You remain undetected"
 gdp_republic_patrician_decision.1010.c.failure: "You are discovered"
 gdp_republic_patrician_decision.1010.d: "Delightful!"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: The Great Plaza of [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1020.intro: "No matter the politics and schemes of the [city_location.GetCounty.GetTitle.GetAdjective] nobles and rulers, life on the great plaza continues."
 gdp_republic_patrician_decision.1020.intro.01: "A delightful scent of fresh [ROOT.Char.Custom('GetLocalStreetFood')] fills my nostrils as the kitchens burn hot."
 gdp_republic_patrician_decision.1020.intro.02: "An antagonistic donkey bleats at its owner who furiously tries to hose it down, cleaning off layers of caked mud."
 gdp_republic_patrician_decision.1020.intro.03: "Several elderly citizens walk around making disapproving noises at the price of bread and the snootiness of today's youth."
 gdp_republic_patrician_decision.1020.intro.04: "A flock of [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l] circle the area, hungrily eyeing the local food stalls."
 gdp_republic_patrician_decision.1020.intro.rain: "This morning, set to the backdrop of yesterday's rain storm."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nOver yonder I notice a group of soldiers, not native to [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]. They look misplaced and carry an apprehensive gaze. From what I can overhear from their sometimes intense discussions, they also appear to be looking for a new patron."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nAt the edge of the plaza, a rough figure award passers-by with a sullen glance. As I close in on [local_character.GetHerHim], I overhear the lamentation of the recent termination of [local_character.GetHerHis] prestigious [liege_scope.GetHouse.GetBaseName] merchant contract. An esteemed trader down on their luck?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nIn the middle of the plaza, perched on a stack of crates, a physician is just rounding off a lecture on bodily fluids and how to more easily balance the black bile. I tentatively nod in agreement.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nIn a stall in a shady corner of the plaza, I spot the perfect [ROOT.Char.Custom('RandomMediumObject')], something that would surely assist in my [scheme_to_boost.GetName|l] scheme...$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nLooking out over the plaza, I notice something catching the light. I squint at the ground in order to find the source and spot a small piece of jewellery almost completely covered in dirt.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nAcross the plaza, a small group of down-on-their-luck peasants are being escorted off the premises. One of the young children lets out a heart-shattering cry, signalling hunger and fear while the on-lookers do their best to ignore the miserable following."
 gdp_republic_patrician_decision.1020.outro: "\n\nMy servant subtly clears [ROOT.Char.GetHerHis] throat, making me aware that it is time to head back home to manage my other responsibilities."
 gdp_republic_patrician_decision.1020.a: "I should be able to feed a mouth or two."
 gdp_republic_patrician_decision.1020.b: "Those soldiers could prove useful..."
 gdp_republic_patrician_decision.1020.c: "Hmm, I could always use another competent trader..."
 gdp_republic_patrician_decision.1020.d: "That physician should work for me."
 gdp_republic_patrician_decision.1020.e: "Work first, saunter later."
 gdp_republic_patrician_decision.1020.f: "I'll just clean this off..."
 gdp_republic_patrician_decision.1020.g: "Places to see, people to meet!"
 gdp_republic_patrician_decision.1020.g.alternate: "Another day in [GetPlayer.GetCapitalLocation.GetNameNoTooltip]."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: [city_location.GetTitle.GetNameNoTierPossessiveNoTooltip] Harbor"
 gdp_republic_patrician_decision.1030.desc: "The scent of fish and decaying seaweed grows heavier the closer we come to the local harbor. Fishermen with families — mothers and small children — as well as a flock of stray cats all linger in the area, performing their daily chores.\n\nAs we walk by, I overhear two of the fishermen lamenting: "... 'n get new hooks we did. But we could do so much more with a new set of nets..." They turn silent upon noticing my presence."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nI hum and nod."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nI hum and nod as a stray cat cozies up to my leg, purring intensely."
 gdp_republic_patrician_decision.1030.a: ""I could be convinced to procure new nets...""
 gdp_republic_patrician_decision.1030.a.flavor: "This might turn up a #EMP net#! profit!"
 gdp_republic_patrician_decision.1030.b: ""What's my rate if I buy your fish in bulk?""
 gdp_republic_patrician_decision.1030.c: "Cat!"
 gdp_republic_patrician_decision.1030.d: ""Lovely day, isn't it.""
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "On my leisurely stroll I come across [liege_scope.GetTitledFirstNamePossessive] latest installment on the great plaza: [ROOT.Char.Custom('GetGreatProjectDescription')].\n\nThe foreman appears in a bit of a pickle however, as [local_character.GetSheHe] keeps glancing at the sheet of names and seals while scratching [local_character.GetHerHis] head: "This... generous contribution... the seal is missing a piece... who might the sender be, hmm..."\n\nAn unmarked contribution to the project? #EMP Intriguing.#!"
 gdp_republic_patrician_decision.1040.a: ""My contribution! We made it!""
 gdp_republic_patrician_decision.1040.a.success: "You take credit for the contribution"
 gdp_republic_patrician_decision.1040.a.failure: "You get found out"
 gdp_republic_patrician_decision.1040.b: ""[liege_scope.GetTitledFirstNamePossessiveNoTooltip] contribution! Splendid!""
 gdp_republic_patrician_decision.1040.c: "Well, this is none of my business."
 gdp_republic_patrician_decision.1040.c.flavor: "I'm sure they'll figure it out."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] gains [contribution_to_fund.GetName]"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: Failure to Launch"
 gdp_republic_patrician_decision.1100.desc: "I pat at my pouch in one final motion before exiting my study for a stroll through [city_location.GetTitle.GetNameNoTierPossessive] lovely streets.\n\nThere's a low #EMP thud#! as my forehead grazes the door. The cursed thing #EMP does not budge#!! Did it swell?\n\nLooking around the room, there is a window, yes, but the fall would most certainly break a bone or two.\n\nI try to think."
 gdp_republic_patrician_decision.1100.a: ""H-hello? Guards? SERVANTS?!""
 gdp_republic_patrician_decision.1100.a.flavor: "No, the walls aren't closing in. They're not... right?"
 gdp_republic_patrician_decision.1100.b: "Plenty of cushioning beneath the window!"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "My body aches for a workout!"
 gdp_republic_patrician_decision.1100.d: "I'll just... go back to my desk, then."

