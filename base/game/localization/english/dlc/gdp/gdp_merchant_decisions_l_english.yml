 merchant_write_travelogue_decision: "Write Travelogue"
 merchant_write_travelogue_decision_desc: "From peasant to [ROOT.Char.GetSuzerain.GetTopLiege.GetTitleAsNameNoTooltip], the people of [ROOT.Char.GetSuzerain.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] and all the world thirst for tales of far off-lands and exotic peoples."
