l_english:
 gdp_repudiate_usurious_loan_decision: "Denounce a Usurious Loan"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip] wrote the bond openly at interest, and our [ROOT.Char.GetRite.PriestNeuterPlural] hold that no such contract binds anyone. Let the debt be struck down rather than paid.\n\nIt is not theft. It is [ROOT.Char.GetRite.GetAdjectiveNoTooltip] law, and every merchant between here and the sea will call it theft regardless."
 gdp_repudiate_usurious_loan_decision_tooltip: "Have your [clergy|E] void the debt as [usury|E], keeping the [gold|E] at the cost of your name among [merchants|E]"
 gdp_repudiate_usurious_loan_decision_confirm: "No contract made in sin binds me!"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "You cannot afford to repay this [loan|E]"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "You have not recently denounced a [creditor|E]"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X [merchants|E] may be unlikely to extend you credit for the foreseeable future#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "Your [rite|E] must count the loan a sin, and a [clergy|E] ruler of your [faith|E] must be close enough to void it: one whose [rite|E] agrees, who is not your [creditor|E] or [rival|E], and who is not at war with you\n#weak Your [head_of_faith|E], the holder of the [clerical_region|E] of your capital or your location, or any [clergy|E] in your [top_liege_possessive|E] realm.#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "Your [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E] must endorse you: a #P positive#! [opinion|E] of you, or held as your [puppet|E] with a [strong_hook|E]"
 become_merchant_decision: "Become Merchant"
 become_merchant_decision_desc: "What use is employment at court if one does not know the customs of men? The desire to travel abroad, to become a joiner of realms — these are too strong to ignore."
 become_merchant_decision_tooltip: "Withdraw your [titles|E] and found a [merchant|E] [company|E]"
 become_merchant_decision_confirm: "The time to trade is now!"
 become_merchant_decision_house_head_tt: "You must be a [house_head|E]"
 gdp_recently_became_adventurer_decision_cooldown_tt: "You have been an [adventurer|E] for #V 5 years#!"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U] will no longer owe [repudiated_lender.GetShortUIName] [repudiating_borrower.GetHerHisYour] loan"

 abuse_charter_authority_decision: "Abuse Charter Authority"
 abuse_charter_authority_decision_tooltip: "Use your [charter|E] to extract [gold_i|E][gold|E] and increase your [competitiveness_i|E][competitiveness|E]"
 abuse_charter_authority_decision_desc: "I carry a charter from the [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] of [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], making the will of [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] tantamount to law. With the sovereign of the realm at our back, no one will dare stand in the way of our interests."
 abuse_charter_authority_decision_confirm: "I act in the name of [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]!"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "[gurkhan_possessive|E] authority is not recognized here"
 abuse_charter_authority_decision.region_already_abused: "These lands have already seen the abuse of the [gurkhan_possessive|E] authority"
 abuse_charter_authority_decision.nothing_to_abuse: "There is no land ripe for abuse in this [location|E]"

 gdp_charter_abused_market_modifier: "Charter Authority Abused"
 gdp_charter_abused_market_modifier_desc: "This character has abused the authority given by a Charter to further their own company."
 gdp_charter_abused_market_county_modifier: "Charter Authority Abused"
 gdp_charter_abused_market_county_modifier_desc: "This county has been exploited by a Merchant Company using its Charter to enrich itself."
 gdp_charter_leveraged_market_modifier: "Sidelined by Charter Holder"
 gdp_charter_leveraged_market_modifier_desc: "This character's Company has seen its fortunes fall at the hands of a rival with a Charter from the realm's ruler."
 gdp_charter_charitable_market_county_modifier: "Charter-Mandated Development"
 gdp_charter_charitable_market_county_modifier_desc: "This county has been developed by a Merchant Company using its Charter to directly intervene."

 gdp_decision.1000.t: "A Patron's Pique"
 gdp_decision.1000.desc: "A messenger brings word from the halls of [patron.GetTitledFirstNameNoTooltipRegnal], where claims of my company's abuses were aired before my stony-faced patron.\n\nI am told magistrates minutely listed allegations of our misconduct, and the [patron.GetTitleAsNameNoTooltip] slowly turned against me.\n\nMy patron now demands an immediate response, explaining our exploits..."
 gdp_decision.1000.a: ""I welcome judgement.""
 gdp_decision.1000.b: ""Surely you understand, I did it for the realm...""
 gdp_decision.1000.b.success: "Your patron is merciful"
 gdp_decision.1000.b.failure: "Your patron is outraged"

 gdp_decision.1000.a.effects: "Your [merchant_patron|E] gets an [imprisonment_reason|E] and [execute_reason|E] targeting you"
 gdp_decision.1000.a.severe_effects: "Your [merchant_patron|E] gets an [imprisonment_reason|E] and [execute_reason|E] targeting you and your [close_family_members|E]"
 gdp_decision.1000.a.survived_patrons_wrath: "Despite weathering your [merchant_patron_possessive|E] wrath, you will not be able to abuse their authority again"

 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "As [ROOT.Char.GetTitleAsNameNoTooltip], the merchants of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] operate in my name, and none more so than those granted charters bearing my seal.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$It seems one such peddler, [merchant.GetName], has taken advantage of my grace, flaunting [merchant.GetHerHis] privileged authority to enrich [merchant.GetHerselfHimself] at the peoples' expense.\n\nSuch liberties are an outrage, but I must weigh up the benefits such traders bring to the realm."
 gdp_decision.1010.a: "[merchant.GetSheHe|U] will answer for this!"
 gdp_decision.1010.a.tt: "Other [clients|E] with your [charters|E] will be less willing to abuse your authority if [merchant.GetShortUIName] is [imprisoned|E]"
 gdp_decision.1010.b: "I will let this slide... for now."
 gdp_decision.1010.c: "This prattling about grocers is beneath me."
 gdp_decision.1010.c.flavor: "Further abuse of your authority may happen, but you will not be notified anymore"
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]...? I never gave them a charter!"

 gdp_decision.1020.t: "In the Name of the [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1020.opening: "With a mere wave of my charter, the gates of [market_province.GetBaronyNameExplicitly] and the offices of its magistrates fall open in the name of [patron.GetTitledFirstName].\n\n"
 gdp_decision.1020.market_holder: "The local bigwig, [market_holder.GetTitledFirstName], has made clear [market_holder.GetHerHis] displeasure, barking that the [patron.GetTitleAsNameNoTooltip] will hear of this, but [market_holder.GetHerHis] prattling means nothing. The document cannot be disputed.\n\n"
 gdp_decision.1020.closing: "With the town at my whim, company agents can secure the market facilities, seize any goods without proper documents, and trouble our competitors with spurious claims and accusations."
 gdp_decision.1020.a: "None can stand in our way."
 gdp_decision.1020.b: "We should cut [market_holder.GetTitledFirstNameNoTooltip] in."
 gdp_decision.1020.c: "I changed my mind."
 gdp_decision.1020.d: ""My #EMP inspection#! is concluded. This time...""
 gdp_decision.1020.b.success: "Not a word reaches the [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1020.b.failure: "The [patron.GetTitleAsNameNoTooltip] hears of this abuse"

 benevolent_charter_authority_decision: "Direct Local Investment"
 benevolent_charter_authority_decision_tooltip: "Use your [charter|E] to develop a [building_i|E][building|E] and increase local [prosperity_i|E][prosperity|E]"
 benevolent_charter_authority_decision_desc: "With sanction from the [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] of [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], I have the leverage to make direct interventions in the realm which would normally be beyond the remit of a mere merchant company."
 benevolent_charter_authority_decision_confirm: "Much good can be done in [ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] name."
 merchant_charter_intervention_county_cooldown: "Have not intervened in [THIS.Char.GetDomicile.GetLocation.GetName] in the last #V 5#! years#!"

 gdp_decision.1200.t: "A Patron's Pleasure"
 gdp_decision.1200.desc: "Word from the halls of [patron.GetTitledFirstNameNoTooltipRegnal] has reached me, where effusive praises of my company's initiative were aired before my delighted patron.\n\nSeveral witnesses waxed lyrical of the [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] and its recent interventions.\n\nAs a result, the [patron.GetTitleAsNameNoTooltip] has sent a message to the company, "Good [ROOT.Char.GetTitledFirstNameNoTooltip], your efforts are a credit to the realm!""
 gdp_decision.1200.a: ""The company is pleased to be of service.""
 gdp_decision.1200.b: ""Recognition is welcome, but so is reward.""
 gdp_decision.1200.b.flavor: "With all due respect..."
 gdp_decision.1200.b.success: "Your patron is generous"
 gdp_decision.1200.b.failure: "Your patron is disappointed"

 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$It seems one such peddler, [merchant.GetName], has actually used [merchant.GetHerHis] privileged authority to the realm's benefit, investing in the development of [market_province.GetBaronyNameExplicitlyNoTooltip]!\n\nSuch meritorious conduct is to be lauded, though providing incentives is likely to encourage more benevolence."
 gdp_decision.1210.a: "Such initiative should be encouraged."
 gdp_decision.1210.a.tt: "Other [clients|E] with your [charters|E] will be more willing to exercise your authority benevolently"
 gdp_decision.1210.b: "By [ROOT.Char.GetFaith.HighGodName], honest merchants #EMP do#! perhaps exist!"
 gdp_decision.1210.c: "Do not bother me with such things."
 gdp_decision.1210.c.flavor: "Further benevolent exercises of your authority may happen, but you will not be notified anymore"

 gdp_decision.1220.t: "In the Name of the [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1220.opening: "My introductions in [market_province.GetBaronyNameExplicitly], charter in hand, at first meet consternation from the local magistrates, but I soon make clear the good intentions of my company.\n\n"
 gdp_decision.1220.market_holder: "The local bigwig, [market_holder.GetTitledFirstName], listens to my proposals with tentative interest, finding the merit in encouraging production and commerce among [market_holder.GetHerHis] subjects.\n\n"
 gdp_decision.1220.closing: "Touring the place, several obvious areas of repair and improvement are quickly found and pointed out to us by the townsfolk."
 gdp_decision.1220.a: ""Well, what are we waiting for?""
 gdp_decision.1220.d: ""All very interesting, but other matters attend...""

 press_the_advantage_decision: "Press the Advantage"
 press_the_advantage_decision_desc: "Our recent successes have left rivals wrong-footed and markets uncertain. Now is the time to commit agents, favors, and hard-won leverage to a route that can turn pressure into profit."
 press_the_advantage_decision_tooltip: "Spend [competitive_pressure_i][competitive_pressure|E] to gain better [competitiveness_i][trade_competitiveness|E] on a [trade_route|E] for a given time"
 press_the_advantage_decision_confirm: "Press our advantage."
 merchant_competitive_pressure_gain_1_tt: "Gain [competitive_pressure_i]#P 1#! [competitive_pressure|E]"
 merchant_competitive_pressure_gain_2_tt: "Gain [competitive_pressure_i]#P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! [competitive_pressure|E]"
 merchant_competitive_pressure_spend_tt: "Spend [competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [competitive_pressure|E]"
 merchant_competitive_pressure_spend_cost_tt: "You have at least [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [competitive_pressure|E]"
 merchant_competitive_pressure_below_max_tt: "You have less than your maximum [competitive_pressure_i][competitive_pressure|E] #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!"
 press_the_advantage_route_not_already_pressed_tt: "You have an active [trade_route|E] not already benefiting from [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]"
 press_the_advantage_selected_route_has_trader_tt: "Selected [trade_route|E] has a [trader|E]"
 press_the_advantage_selected_route_not_already_pressed_tt: "Selected [trade_route|E] is not already benefiting from [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]"
 merchant_competitive_pressure_route_modifier: "Pressed Advantage"
 merchant_competitive_pressure_route_modifier_desc: "This trade route is receiving focused attention from agents who know exactly where competitors are vulnerable."

 choose_specialized_market_decision: "Choose Specialized Market"
 choose_specialized_market_decision_desc: "A company that understands a market's habits, officials, and hidden channels can make a home of unfamiliar streets. By focusing our inspectors on one market along our routes, we can turn local knowledge into commercial advantage."
 choose_specialized_market_decision_tooltip: "Choose a [market_i][market|E] on one of your [route_i][trade_routes|E] to receive your Inspector specialization bonus"
 choose_specialized_market_decision_confirm: "Study the market"
 choose_specialized_market_decision_effect_tt: "The selected [market_i][market|E] becomes your specialized [market_i][market|E]"
 choose_specialized_market_has_valid_market_tt: "You have a valid [market_i][market|E] on a [route_i][trade_route|E] or at your [domicile|E] location"
 choose_specialized_market_selected_market_has_valid_route_tt: "Selected [market_i][market|E] is on one of your [route_i][trade_routes|E] or at your [domicile|E] location"
 choose_specialized_market_selected_market_is_new_tt: "Selected [market_i][market|E] is not already your specialized [market_i][market|E]"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "This company has surveyed the local customs, officials, and commercial habits of this market."
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "This company maintains a careful inspection regime in this market."
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "This company has mapped the stalls, warehouses, and quiet arrangements of this market in exacting detail."
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "This company knows this market with the confidence of long mastery."

 pious_patronage_decision: "Pious Patronage"
 pious_patronage_decision_desc: "Faith opens doors that coin alone cannot. By funding shrines, clerics, and charitable works in a market already joined to our routes, we can turn shared devotion into commercial trust."
 pious_patronage_decision_tooltip: "Spend [piety_i][piety|E] to improve your [competitiveness_i][trade_competitiveness|E] in a [market_i][market|E]"
 pious_patronage_decision_confirm: "Fund the faithful"
 pious_patronage_has_valid_market_tt: "You have a [route_i][trade_route|E] passing through a valid [market_i][market|E] that is not already benefiting from [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip]"
 pious_patronage_selected_market_valid_faith_tt: "Selected [market_i][market|E] follows your [faith|E] #weak (or you have [GetPerk('prophet_perk').GetName(GetPlayer)])#!"
 pious_patronage_selected_market_has_valid_route_tt: "You have a [route_i][trade_route|E] through the selected [market_i][market|E]"
 pious_patronage_selected_market_no_modifier_tt: "You are not already benefiting from [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip] in the selected [market_i][market|E]"
 pious_patronage_different_faith_cost_tt: "You have at least [piety_i]#V [EmptyScope.ScriptValue('massive_piety_value')|0]#! [piety|E] to patronize a [market_i][market|E] outside your [faith|E]"
 pious_patronage_market_modifier: "Pious Patronage"
 pious_patronage_market_modifier_desc: "This company benefits from religious patronage in this market."

 organize_the_venture_decision: "Organize the Venture"
 organize_the_venture_decision_desc: "A promising venture is already underway. With firmer schedules, tighter instructions, and the company's leverage behind it, the work can be forced ahead."
 organize_the_venture_decision_tooltip: "Spend [competitive_pressure_i][competitive_pressure|E] to make an active [contract_scheme|E] progress faster"
 organize_the_venture_decision_confirm: "Set the work in order"
 merchant_competitive_pressure_organize_venture_spend_tt: "Spend [competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! [competitive_pressure|E]"
 merchant_competitive_pressure_organize_venture_spend_cost_tt: "You have at least [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! [competitive_pressure|E]"
 organize_the_venture_active_contract_scheme_tt: "You have an active [contract_scheme|E] that is not already organized"

 undercut_the_competition_decision: "Undercut the Competition"
 undercut_the_competition_decision_desc: "Profit can recover. A lost market may not. By cutting prices and accepting thinner margins across the company, we can force rivals onto uncertain ground."
 undercut_the_competition_decision_tooltip: "Gain [competitive_pressure_i][competitive_pressure|E] and better [competitiveness_i][trade_competitiveness|E] at the cost of sell prices for a given time"
 undercut_the_competition_decision_confirm: "Cut our margins"
 undercut_the_competition_no_modifier_tt: "You are not already undercutting the competition"

 set_company_focus_decision: "Set Company Focus"
 set_company_focus_decision_desc: "A company cannot live by ledgers alone. Public obligations, private margins, and the daily work of commerce all compete for attention."
 set_company_focus_decision_tooltip: "Choose an ongoing focus for your Merchant Company"
 set_company_focus_decision_confirm: "Set focus"
 company_focus_none_name: "No Company Focus"
 company_focus_none_desc: "Stop your current Company Focus."
 company_focus_none_tooltip: "" # Deliberately empty
 company_focus_public_works_name: "Public Works"
 company_focus_public_works_desc: "Sponsor civic works near your [domicile|E], improving local [popular_opinion_i][popular_opinion|E] and [prosperity_i][prosperity|E] while gaining [prestige_i][prestige|E] and [opinion|E] at the cost of [gold_i][income|E]."
 company_focus_public_works_tooltip: "" # Deliberately empty
 company_focus_private_profit_name: "Private Profit"
 company_focus_private_profit_desc: "Focus your company on private margins, improving [gold_i][gold|E] from your [domicile|E] and [competitiveness_i][trade_competitiveness|E] at the cost of [opinion|E]."
 company_focus_private_profit_tooltip: "" # Deliberately empty
 company_focus_public_works_inactive_tt: "You are not already focused on Public Works"
 company_focus_private_profit_inactive_tt: "You are not already focused on Private Profit"
 sponsor_public_works_has_domicile_county_tt: "Your [domicile|E] is located in a [county|E]"

 forge_charter_decision: "Forge Charter"
 forge_charter_decision_desc: "If we are to remain competitive, and our patron refuses to fight in our corner, we must take matters into our own hands."
 forge_charter_decision_tooltip: "Forge a [charter|E] from your [merchant_patron|E]"
 forge_charter_decision_confirm: "We do what we must."
 forge_charter_artifact_trigger: "You do not hold a [charter|E] [artifact|E] granted by your [merchant_patron|E] #weak ([patron_temp.GetShortUIName])#!"
 forge_charter_decision_durability_tt: "@warning_icon! #X Forged [charter|E] [artifacts|E] have much less [durability|E]#!\n#help The [GetPerk('accomplished_forger_perk').GetName(GetPlayer)] and [GetPerk('digging_for_dirt_perk').GetName(GetPlayer)] [perks|E] increase the $game_concept_durability$ of forgeries#!"
 forge_charter_decision_warning_tt: "@warning_icon! #X Your [merchant_patron|E] will consider you a [criminal|E] if the forgery comes to light#!"

 gdp_decision.2000.t: "$forge_charter_decision$"
 gdp_decision.2000.desc: "With some creative penmanship and shrewd approximation of seals, waxes, and other trappings of officialdom, the unscrupulous forger's work is an object to behold.\n\nI dare say it could even fool a keen eye with experience of such documents, as long as they did not look too closely..."
 gdp_decision.2000.a: "We must be careful."

 invite_merchants_decision: "Entice Merchants"
 invite_merchants_decision_desc: "If goods are to flow into, out of, and across the realm, we must ensure a healthy environment for the business of merchants."
 invite_merchants_decision_tooltip: "Invite [merchants|E] to settle in your [capital|E], creating [trade_routes|E] and offering their services as your [clients|E]."
 invite_merchants_decision_confirm: "The goods must flow."
 invite_merchants_decision_capital_full_tt: "Fewer than [EmptyScope.ScriptValue('invite_merchants_max_capital_merchants_value')|0] [merchants|E] have their [companies|E] in your [capital|E]"

 merchant_enticed_title: "Merchant Arrives"
 invite_merchants_decision_effect_1: "A number of [merchants|E] may move their [companies|E] to your [capital|E]"
 invite_merchants_decision_effect_2: "Any [merchants|E] who become your [client|E] will gain the [GetModifier('gdp_enticed_merchant_market_modifier').GetNameWithTooltip] in their new [market|E]"
 gdp_enticed_merchant_market_modifier: "Enticed Merchant"
 gdp_enticed_merchant_market_modifier_desc: "This character's Company has been given advantageous inducements to relocate to this market."

 gdp_decision.3000.opening: "[new_patron.Custom2('AppropriateGreetingPositive', new_client)]"
 gdp_decision.3000.desc: "I seek esteemed and industrious merchants such as yourself to relocate to [new_patron.GetPrimaryTitle.GetDefinitiveName].\n\nIn return I will ensure you find advantage in our markets."
 gdp_decision.3000.a: "@move_company_icon! Consider our books closed in [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_decision.3000.b: "We are going nowhere!"
 gdp_decision.3000.c: "[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] is our home, now and forever."
 gdp_decision.3000.c.tt: "No one will invite you to relocate your [company|E] again"

 gdp_sponsor_merchant_company_decision: "Sponsor Merchant"
 gdp_sponsor_merchant_company_decision_desc: "Trade is a famously dirty business, and not something for someone of my refinement. That said, surely I have someone in my court who could become my personal merchant and do it for me?"
 gdp_sponsor_merchant_company_decision_tooltip: "Fund one of your [courtiers|E] to found a [merchant|E] [company|E] that starts as your [client|E]"
 gdp_sponsor_merchant_company_decision_confirm: "Sponsor New Company"
 gdp_sponsor_merchant_company_decision_no_item_selected: "No [courtier|E] selected"
 gdp_sponsor_merchant_company_decision_cooldown_tt: "You have sponsored a [merchant|E] [company|E] in the last 5 years"
 gdp_sponsor_merchant_company_decision_candidate_tt: "You have an adult, healthy [courtier|E] at your [capital|E] who is not [lowborn|E], not an [heir|E] to any [title|E], and not your parent, child, sibling, [spouse|E], or [concubine|E]"
 gdp_sponsor_merchant_company_decision_effect_tt: "Choose how much [gold|E] to invest in [sponsored_courtier.GetShortUINamePossessive|V] new [company|E]. The investment sets its starting [company_size|E]"
 gdp_sponsor_merchant_company_decision_costs_tt: "Cost of each starting [company_size|E]:\n$BULLET_WITH_TAB$[GetLaw('company_size_small').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_small_value')|0]\n$BULLET_WITH_TAB$[GetLaw('company_size_medium').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_medium_value')|0]\n$BULLET_WITH_TAB$[GetLaw('company_size_large').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_large_value')|0]\n$BULLET_WITH_TAB$[GetLaw('company_size_huge').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_huge_value')|0]"
 gdp_sponsor_merchant_company_size_small_tt: "[company_size|E] will be [GetLaw('company_size_small').GetName]"
