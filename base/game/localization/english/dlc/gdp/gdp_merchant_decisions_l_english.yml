 gdp_decision.3010.t: "In the Company of [sponsored_courtier.GetNameNoTooltip]"
 gdp_decision.3010.desc: ""I am honored that you wish to bestow this responsibility on me! I will make your every [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] count"\n\n[sponsored_courtier.GetNameNoTooltip] looks enthusiastic, even if [sponsored_courtier.GetSheHe] cannot have known that [sponsored_courtier.GetSheHe] would become my trusted Merchant before entering this room.\nPerhaps it is the idea of the initial funding, and getting to spend it setting up [sponsored_courtier.GetHerHis] very own company that beckons more than the fulfilment of a lifelong ambition."
 gdp_decision.3010.a: "I will give you enough to get by."
 gdp_decision.3010.b: "All basic expenses will be provided."
 gdp_decision.3010.c: "A sizable amount of capital will ensure success."
 gdp_decision.3010.d: "We will spare no expense!"
 gdp_decision.3010.e: "We can consider this some more."

