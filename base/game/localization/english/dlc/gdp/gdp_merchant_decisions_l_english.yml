 craft_artifact_scheme.1000.t: "$craft_artifact$: Success"
 craft_artifact_scheme.1000.intro.curio: "Night after night I have spent in the workshop, with an associate or else a local guilds[ROOT.Char.GetWomanMan] by my side, fashioning some piece or other."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nBut today, I can at last say all that work has paid off! Looking over the piece, each mark left by my labors arouses a smile, and my only thought is where to proudly display it."
 craft_artifact_scheme.1000.intro.library: "Night after night I have spent hunched over in my study, ink-stained hands scribbling through writer's cramp, as the wick burns low."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nBut today, I can at last say all that work has paid off! Looking through the piece, each passage arouses a smile, and my only thought is of others reading its scrawlings."
 craft_artifact_scheme.1000.desc.curator: "\n\nMy curator, [curator.GetFirstNamePossessive] eyes light up, examining the work. "This a #EMP true#! accomplishment, [ROOT.Char.GetTitleAsNameNoTooltip].""
 craft_artifact_scheme.1000.a: "It was worth the effort."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nCrafted by [ROOT.Char.GetTitledFirstName] of [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nAuthored by [ROOT.Char.GetTitledFirstName] of [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_scheme.2000.t: "$craft_artifact$: Failure"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nEach attempt to realize my idea has been thwarted by miscalculation or misapprehension, and the room is littered with the bones of abandoned attempts that could not be repurposed..."
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nEach morning, discarded scraps of writing litter the floor, and the few pieces I have kept all fail in one way or another to realize the breadth of my intent..."
 craft_artifact_scheme.2000.desc.curator: "\n\nMy curator, [curator.GetFirstName], sighs, looking over the meager results of my labors. "Perhaps it is time to admit defeat?""
 craft_artifact_scheme.2000.a: "I grow sick of this..."
 craft_artifact_scheme.2000.b: "...but my work cannot go to waste!"
