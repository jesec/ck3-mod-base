 craft_artifact_desc: "I will attempt to produce a [company|E] [domicile_artifact|E]."
 craft_artifact_desc_general: "The $craft_artifact$ [scheme|E] is a [personal_scheme|E] in which you and your [company|E] attempt to craft an entirely new [domicile_artifact|E]. This Scheme primarily relies on your own [stewardship|E].\n\nThe [success_chance|E] is affected by many things, but mainly by your [stewardship_skill|E], and the [aptitude|E] of your $antiquarian_merchant$."
