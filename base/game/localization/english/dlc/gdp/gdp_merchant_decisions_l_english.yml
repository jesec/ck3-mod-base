 wipe_slate_merchant_decision: "Wipe Slate"
 wipe_slate_merchant_decision_desc: "Must a [ROOT.Char.GetWomanMan] forever suffer for crimes committed in the direst of circumstances? Are not all [ROOT.Char.GetFaith.GetAdherentNamePlural] entitled a path to redemption?\n\nWith time, energy, and — most importantly — #EMP coin#!, all manner of sins may be forgiven by the world at large."
