l_english:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]: What is Lost"
 gdp_guelph_ghibelline_scheme.1000.desc: "I find myself at [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]'s annual fair, where the joy and comradery is palpable.\n\nThe noise of rambunctious festivities, brightly colored cloth ornaments and the smell of delicious [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] cuisine are heavy in the streets — a delight for my weary senses.\n\nCoincidentally, I run into [target.GetTitledFirstName], who is eagerly taking in the sights of a nearby market stall, and I spot an opportunity to work my charm."
 gdp_guelph_ghibelline_scheme.1000.a: ""The #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]#! tried to ban these festivities, you know.""
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "You successfully argue the ill will of the [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName] brushes you off"
 gdp_guelph_ghibelline_scheme.1000.b: ""This pin would fit you perfectly, friend!""
 gdp_guelph_ghibelline_scheme.1000.c: "No need for me to intervene."

 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]: Rumor Has It..."
 gdp_guelph_ghibelline_scheme.1010.desc: "My informants tell me that [target.GetTitledFirstName], our #EMP esteemed#! [ROOT.Char.Custom('GetGuelphGhibelline')] leader, has seemed somewhat overwhelmed as of late, buckling under the weight of [target.GetHerHis] onerous duties.\n\nA few well-placed letters to our partisans could solidify that impression, and suggest a more #EMP worthy#! bearer of that burden."
 gdp_guelph_ghibelline_scheme.1010.a: "Have the letters drafted at once."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "Success chance is modified by your @gg_involvement_icon! [gg_involvement|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Your letters convince many [ROOT.Char.Custom('GetGuelphsGhibellines')] of your superior leadership"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Your letters do more harm to your cause than good"
 gdp_guelph_ghibelline_scheme.1010.b: "Anyone from House [ROOT.Char.GetHouse.GetName] would make a grand leader!"
 gdp_guelph_ghibelline_scheme.1010.c: "Who's to say it's even true?"

 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]: Silver Tongue"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "It would seem that my agent, [court_agent.GetTitledFirstName], has caught the ear of a group of scorned courtiers and dissidents over at [target.GetTitledFirstNamePossessive] court."
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "It would seem that my agent, [court_agent.GetTitledFirstName], has found sympathetic ears among [target.Custom('GetGuelphsGhibellines')] discontent with [target.GetTitledFirstNamePossessive] leadership."
 gdp_guelph_ghibelline_scheme.1020.intro: "It would seem that my agent, [court_agent.GetTitledFirstName], has caught the ear of [target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nI am overdue for my latest correspondence with [court_agent.GetTitledFirstNameNoTooltip]; should"
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "we engage with these local agitators to further our plans?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "I have [court_agent.GetHerHim] stoke their doubts about [target.GetFirstNameNoTooltip]?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "I take this opportunity to have [court_agent.GetHerHim] advocate the [ROOT.Char.Custom('GetGuelphsGhibellines')] in front of [target.GetTitleAsNameNoTooltip]?"
 gdp_guelph_ghibelline_scheme.1020.a: "Leverage my efforts instead."
 gdp_guelph_ghibelline_scheme.1020.b: "Let us utilize these... rogues."
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip] should earn [court_agent.GetHerHis] keep."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName] successfully furthers your plans"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName] is less than convincing"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U] should focus on my reputation."
 gdp_guelph_ghibelline_scheme.1020.prestige: "Tarnished Prestige"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Your prestige was somewhat tarnished."
 gdp_guelph_ghibelline_scheme.1020.piety: "Tarnished Piety"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Your piety was somewhat tarnished."
 gdp_guelph_ghibelline_scheme.1020.e: "My devoutness speaks for itself!"
 gdp_guelph_ghibelline_scheme.1020.f: "I shouldn't interfere."

 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]: Greasing the Wheels"
 gdp_guelph_ghibelline_scheme.1030.desc: "A long-standing attendant of mine scurries up to me as I am making the rounds one morning:\n\n"My [ROOT.Char.GetTitleAsNameNoTooltip], our informants in [target.GetTitledFirstNamePossessive] court reports that the [ROOT.Char.Custom('DescribeTargetSkill')] of that [target.GetTitleAsNameNoTooltip] is laughable at best.\n\nPerhaps we could turn this to our advantage, somehow... ?""
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "My [ROOT.Char.Custom2('RelationToMe', sly_character )], [sly_character.GetTitledFirstName], discreetly approaches me as I am making the rounds one morning:\n\n"In our efforts to #EMP save#! [target.GetPrimaryTitle.GetDefinitiveName] from the foolish [target.Custom('GetGuelphsGhibellines')] — how about we question the [ROOT.Char.Custom('DescribeTargetSkill')] of that [target.GetTitledFirstName]?\n\nFrom what I have been told, [target.GetSheHe] seems quite lackluster in that aspect.""
 gdp_guelph_ghibelline_scheme.1030.a: ""Effort shall trump gossip.""
 gdp_guelph_ghibelline_scheme.1030.a.tt: "Success chance is modified by your @gg_involvement_icon! [gg_involvement|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "You successfully undermine [target.GetShortUIName]"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Your efforts are in vain"
 gdp_guelph_ghibelline_scheme.1030.b: ""We should use this to undermine [target.GetHerHim] in [target.GetHerHis] court.""
 gdp_guelph_ghibelline_scheme.1030.c: ""Let us feed these rumors.""
 gdp_guelph_ghibelline_scheme.1030.d: ""I don't see that we should.""

 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.1262.desc: "Great success! [target.GetTitledFirstName|U] is finally seeing reason and now stands with us as a true [owner.Custom('GetGuelphGhibelline')].\n\nI knew [target.GetSheHe] would come around eventually."
 scheme_critical_moments.1262.a: "Terrific!"

 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.1263.desc: "#EMP Some people.#! Much to our shared frustration, no matter how hard I try to reason with, debate and coax [target.GetTitledFirstName], [target.GetSheHe] insists that the [target.Custom('GetGuelphsGhibellines')] has the correct side of the argument.\n\nNeedless to say, we did #EMP not#! part on friendly terms, this time around."
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')]#!!"

 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.1272.desc: "Celebrations are in order! One by one, the [owner.Custom('GetGuelphsGhibellines')] are withdrawing their support from [target.GetTitledFirstName], and instead look to me for guidance.\n\n[target.GetSheHe|U] has no choice but to step aside."
 scheme_critical_moments.1272.a: "Splendid!"

 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.1273.desc: "Despite our efforts, [target.GetTitledFirstName] remains steadfastly foremost among the [owner.Custom('GetGuelphsGhibellines')], and what support I managed to gather has withered and vanished."
 scheme_critical_moments.1273.desc.secret: "\n\nAt least [target.GetSheHe] still knows nothing of my plans."
 scheme_critical_moments.1273.desc.discovered: "\n\nEven worse, [target.GetSheHe] knows I was behind it, and [target.GetSheHe] is not likely to forget."
 scheme_critical_moments.1273.a: "Tsk, tsk."

 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.1282.desc: "Great success! [target.GetTitledFirstName|U] is finally seeing reason and now stands with us as a true [owner.Custom('GetGuelphGhibelline')].\n\nI knew [target.GetSheHe] would come around eventually."
 scheme_critical_moments.1282.a: "Terrific!"

 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.1283.desc: "#EMP Some people.#! Much to our shared frustration, no matter how hard I try to reason with, debate and coax [target.GetTitledFirstName], [target.GetSheHe] insists that the [target.Custom('GetGuelphsGhibellines')] has the correct side of the argument.\n\nNeedless to say, we did #EMP not#! part on friendly terms, this time around."
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')]#!!"

 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.1292.desc.intro: "Excellent news — [target.GetTitledFirstName|U] is to be replaced by the much more benign [target_character.GetTitledFirstName]!"
 scheme_critical_moments.1292.desc.intro.unknown: "Excellent news — [target.GetTitledFirstName|U] is to be replaced by a proper loyalist to the cause!"
 scheme_critical_moments.1292.desc: "\n\nTruly a feather in the cap of the [ROOT.Char.Custom('GetGuelphsGhibellines')], now we can rest assured [target.GetPrimaryTitle.GetDefinitiveName] will be ruled justly and correctly."
 scheme_critical_moments.1292.desc.discovered: "\n\nMy involvement has not gone unnoticed however, so I shall have to watch my back, moving forward..."
 scheme_critical_moments.1292.a: "Hear hear!"

 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.1293.desc: "The best laid plans...\n\n#EMP Someone messed up down the line.#! I'll find out who, but in the meantime there is no denying that [target.GetTitledFirstName] escaped my grasp this time. We shall have to settle for a delusional [target.Custom('GetGuelphGhibelline')] ruling [target.GetPrimaryTitle.GetDefinitiveName] for a little while longer."
 scheme_critical_moments.1293.a: "#EMP Curses#!!"
