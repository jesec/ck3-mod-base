 unity_merchant_promote_diligence_decision: "Promote Diligence"
 unity_merchant_promote_diligence_decision_desc: "To keep our company's place in the markets, every member must put profit above comfort until we outpace our rivals."
 unity_merchant_promote_diligence_decision_tooltip: "Spend [prestige|E] to push [company_sentiment|E] toward [company_sentiment_divided_i][company_sentiment_divided|E], and support the [company_possessive|E] [competitiveness|E] and your [house|E] members' skill development"
