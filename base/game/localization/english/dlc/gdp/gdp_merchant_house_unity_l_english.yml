l_english: 
 merchant_house_unity: "Company Direction" 

 rapacious_cs: "Rapacious"
 rapacious_cs_desc: "#weak Responsibilities of kinship have long since been forgotten in simmering resentment and ambition. The needs of the company comes before the needs of its members, with profit above all.#!"
 opportunistic_cs: "Opportunistic"
 opportunistic_cs_desc: "#weak Unruly kin chafe against the hierarchies of blood, viewing duty as secondary to individual interests.#!"
 balanced_cs: "Balanced"
 balanced_cs_desc: "#weak While a family needs a figurehead, its members must be free to conduct their own affairs without interference or judgement.#!"
 grasping_cs: "Grasping"
 grasping_cs_desc: "#weak The company's reputation and the reputations of its members are the same. To be a valued part of the company, one must strive to improve one's image as well as social standing.#!"
 ennobled_cs: "Ennobled"
 ennobled_cs_desc: "#weak With a dogged loyalty born of duty and respect, the interests of the whole are the same as the interests of the head. As a unit tightly-wound by familial ties, the company may stand on equal footing with the most noble families.#!" 

 house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts: "[house|E] members serving as [traders|E] are more likely to offer [trade_opportunities|E]"

