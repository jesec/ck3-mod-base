 house_unity_parameter_unity_very_high_risk_of_leaving: "Acceptance when other [rulers|E] invite [associates|E] to their [court|E]: #N +50#!"

 house_unity_parameter_unity_deputy_positions_cost_less: "[deputy|E] position salaries are reduced: #P -50%#!"
