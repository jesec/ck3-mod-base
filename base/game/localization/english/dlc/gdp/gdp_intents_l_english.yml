l_english:
 schmooze_intent: "Hobnob"
 schmooze_intent_desc: "You seek to grease the wheels of business and improve [competitiveness|E]."
 gdp_merchant_schmooze_modifier: "Hobnobbed with Nobles"
 gdp_merchant_schmooze_modifier_desc: "This character has made in-roads with local nobility in this market at a feast."
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U] Hobnobbed with [TARGET_CHARACTER.GetShortUINameNoTooltip]"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName] took the opportunity to hobnob with [TARGET_CHARACTER.GetShortUINameNoTooltip]"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U] Hobnobbed with the Nobility"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName] took the opportunity to hobnob with the nobility"

 gdp_schmooze_events.1000.t: "Hobnobbing with [schmoozee.GetFirstNameNoTooltip]"
 gdp_schmooze_events.1000.desc: "We merchants must jump at opportunities to rub shoulders with the nobility. With a clever word or a fine gift, one can ensure they do not stand in the way of a venture, or support a rival's.\n\nCarefully skirting the valley between sickly flattery and being overly-forward, I do my best to win over my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))], [schmoozee.GetTitledFirstName]."
 gdp_schmooze_events.1000.a: ""Please, good [schmoozee.GetTitleAsNameNoTooltip], take this gift.""
 gdp_schmooze_events.1000.b: ""A humble merchant such as I must look to my betters.""
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip] is flattered"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip] rolls [schmoozee.GetHerHis] eyes"
 gdp_schmooze_events.1000.c: ""Talking with you has been an honor.""
 gdp_schmooze_events.1000.d: ""I trade in many things fit for a [schmoozee.GetTitleAsNameNoTooltip]!""
 
 gdp_schmooze_events.1010.t: "Good-natured Competition"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName] and I break bread, bragging each of our company's successes in turn, as we mull our [ROOT.Char.Custom('RegionalDrink')] and [ROOT.Char.Custom('GetExpensiveMeal')]."
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName] and I share the shade of a [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], bragging each of our company's successes in turn."
 gdp_schmooze_events.1010.outro: "\n\nFor all our bluster, we clearly meet eye-to-eye on many things. The [schmoozee.GetWomanMan] may perhaps be useful to me, and I to [schmoozee.GetHerHim]."
 gdp_schmooze_events.1010.a: ""For a sum, I could give you some space.""
 gdp_schmooze_events.1010.b: ""Take this, and stay out of our way.""
 gdp_schmooze_events.1010.c: ""You sing my praises, and I'll sing yours.""
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip] is on board"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip] has no interest"
 gdp_schmooze_events.1010.d: "This isn't the time."
 
 gdp_schmooze_events.1030.t: "Divided Attention"
 gdp_schmooze_events.1030.feast: "As the evening progresses, I find myself caught between my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], [schmoozee_1.GetTitledFirstName], and my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], [schmoozee_2.GetTitledFirstName]. The nobles languidly debate the hypothetical principles of business and brokering over some grilled [schmoozer.Custom('GetRegionalFish')]."
 gdp_schmooze_events.1030.hunt: "As the hunt progresses, I find myself caught between my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], [schmoozee_1.GetTitledFirstName], and my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], [schmoozee_2.GetTitledFirstName]. The nobles languidly debate the hypothetical principles of business and brokering as the hounds search for a scent."
 gdp_schmooze_events.1030.outro: "\n\nAt last [schmoozee_1.GetFirstNameNoTooltip] turns to me to settle the matter, "Come, [schmoozer.GetTitledFirstNameNoTooltip], you're a merchant for goodness' sake, you must have an opinion?""
 gdp_schmooze_events.1030.a: ""You touch it with a needle, good [schmoozee_1.GetTitleAsNameNoTooltip].""
 gdp_schmooze_events.1030.b: ""[schmoozee_2.GetTitledFirstNameNoTooltip] has the measure of things.""
 gdp_schmooze_events.1030.c: ""Both your insights inspire me, truly.""
 gdp_schmooze_events.1030.c.success: "They are flattered"
 gdp_schmooze_events.1030.c.failure: "They roll their eyes"
 gdp_schmooze_events.1030.d: ""I could not possibly comment.""
 
 gdp_schmooze_events.1050.t: "Market Movement"
 gdp_schmooze_events.1050.feast: "The festivities break for a moment to allow guests to mingle and the servants to catch up,"
 gdp_schmooze_events.1050.hunt: "We pause to survey the [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')] [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')] as the hounds and beaters press ahead,"
 gdp_schmooze_events.1050.outro: "and I find myself unconsciously singling out key players in our markets.\n\n[schmoozee_1.GetTitledFirstName] is a useful [schmoozee_1.GetWomanMan] to know in [market_1.GetLocationTitle.GetNameNoTier], and [schmoozee_2.GetTitledFirstName] likewise in [market_2.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.three: "I also spy [schmoozee_3.GetTitledFirstName], based in [market_3.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.a: ""[schmoozee_1.GetFirstNameNoTooltip], I have been meaning to talk!""
 gdp_schmooze_events.1050.b: ""I have heard very interesting things, [schmoozee_2.GetFirstNameNoTooltip].""
 gdp_schmooze_events.1050.c: ""Oh [schmoozee_3.GetFirstNameNoTooltip], let's have a natter!""
 gdp_schmooze_events.1050.d: "The markets are doing just fine."

 gdp_schmooze_events.1060.t: "Vying for Attention"
 gdp_schmooze_events.1060.feast: "As the servants circle the tables, refilling cups and laying on another course,"
 gdp_schmooze_events.1060.hunt: "As we stop to drink from our water-skins and stretch our legs,"
 gdp_schmooze_events.1060.outro: "I spy my competitor, [rival.GetName], shamelessly buttering up [schmoozee.GetName].\n\nThe slimy [rival.GetWomanMan] simpers about the benefits [rival.GetHerHis] traders bring, while spurning my own associates as knaves and braggarts!"
 gdp_schmooze_events.1060.a: ""Come now, your paltry [rival.GetHouse.GetBaseNameNoTooltip] operation is a joke!""
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip] looks a fool"
 gdp_schmooze_events.1060.a.failure: "You look a fool"
 gdp_schmooze_events.1060.b: ""Steady on! Our book is very solid.""
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip] is convinced"
 gdp_schmooze_events.1060.b.failure: "You make a poor case"
 gdp_schmooze_events.1060.c: "Let them prattle."

 activity_used_trade_market_luxury_items_modifier: "Social Demand"
 activity_used_trade_market_luxury_items_modifier_desc: "This market's luxury goods have been diverted by a merchant for use in an activity."
 activity_used_trade_market_comforts_modifier: "Social Demand"
 activity_used_trade_market_comforts_modifier_desc: "This market's comforts have been diverted by a merchant for use in an activity."
