l_english:
 guelphs_ghibellines_prefix: "Guelphs & Ghibellines:"
 
 gdp_guelph_ghibelline.0500.t: "The Guelphs & Ghibellines"
 gdp_guelph_ghibelline.0500.intro.all: "A suspicious glance; a dismissive snort — the conflict between [pope_scope.GetTitledFirstName] and [ghibelline_leader.GetTitledFirstName] has created a growing rift in the once so tight-knit communities of northern Italy.\n\nThose who support the [ghibelline_leader.GetTitleAsNameNoTooltip]'s Ghibellines for imperialism and protection are pitted against those who seek increased independence by supporting the papacy's Guelphs."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "A suspicious glance; a dismissive snort — this absurd conflict between the apostate [ghibelline_leader.GetTitleAsName] and my devout officials has unfortunately created a growing rift in the once so tight-knit communities of northern Italy.\n\nThose who support the imperialistic Ghibellines for safety and protection are pitted against my god-fearing Guelphs, who merely support their sovereignty in face of this tyrant.\n\nTogether, we'll make the [ghibelline_leader.GetTitleAsNameNoTooltip] see reason. It is time for me to work my [ROOT.Char.Custom('GetHighestSkillAdjective')]."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "A suspicious glance; a dismissive snort — this absurd conflict between the fools in the papacy and myself has allegedly created a growing rift in the once so tight-knit communities of northern Italy.\n\nThose who support #EMP my#! Ghibellines for safety and protection are pitted against those who seek insecurity and a frail independence by supporting the papacy's naive Guelphs.\n\nAs the [ghibelline_leader.GetTitleAsNameNoTooltip], I grow wary of these ecclesiastic Guelph meddlers. They have undermined my authority for long enough and will fall in line — one way or the other..."
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nBless us that our dutiful leader, [guelph_leader.GetFirstNameNoTooltip], will be our voice and take up the struggle against our imperialistic oppressor. And I will do my part."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nIt is my understanding that our [ghibelline_leader.GetTitleAsNameNoTooltip] is the only one truly defending our people, and our realms, against those who wish us harm. In return, I shall support [ghibelline_leader.GetHerHis] Ghibellines to the full."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nAs I have not picked an allegiance just yet, I shall have to weigh the quarreling sides carefully in order to act in the best interests of house [ROOT.Char.GetHouse.GetBaseName]."
 gdp_guelph_ghibelline.0500.a: "Onward!"

 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "It has come to my attention that you have tirelessly been propagating and strengthening the [ROOT.Char.Custom('GetGuelphGhibellinePossessive')] position of power in this bothersome conflict.\n\nAs such, you have my unwavering gratitude."
 gdp_guelph_ghibelline.1000.a: "Much obliged."

 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "I will not be joining your derelict [actor.Custom('GetGuelphsGhibellines')] anytime soon."
 gdp_guelph_ghibelline.5000.a: "Most unwise."
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U] will not be able to request [recipient.GetShortUIName] join the [actor.Custom('GetGuelphsGhibellines')] for several years"

 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ the Concordat of Worms"
 gdp_guelph_ghibelline.6500.desc: "This conflict has been going on for long enough. After plenty of mulling over, my scribes present me with a written agreement:\n\nThe [ghibelline_leader.GetTitleAsNamePossessive|U] influence would be limited in ecclesiastical appointments, but it does allow [ghibelline_leader.GetHerHim] back to observe the elections and judge in disputed outcomes.\n\nI scratch my chin as I carefully ponder how this will impact us all."
 gdp_guelph_ghibelline.6500.a: "This is the way forward."
 gdp_guelph_ghibelline.6500.b: "The Papacy's power is #EMP supreme#!!"
 concordat_of_worms_fulfilled.t: "Concordat of Worms Fulfilled"
 concordat_of_worms_abandoned.t: "Concordat of Worms Abandoned"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName] decides whether to accept the agreement"
 cow_phase_moves_to_agitation.tt: "The [GetSituation('guelph_ghibelline').GetName] leaves the Prelude stage and transitions into [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]"
 cow_phase_moves_to_repose.tt: "The [GetSituation('guelph_ghibelline').GetName] leaves the Prelude stage and transitions into [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]"

 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "Let us put our differences aside for a moment and agree on the correct way to govern your ecclesiastical appointments.\n\nIn turn, the [ROOT.Char.GetTitleAsNameNoTooltip|U] may attend elections and handle disputed outcomes."
 gdp_guelph_ghibelline.6505.a: "I suppose this will suffice..."
 gdp_guelph_ghibelline.6505.b: "This is unacceptable!"

 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ the $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "As word comes around that the [hre_kaiser.GetTitleAsName] is setting [hre_kaiser.GetHerHis] sights on Northern Italy, with an intent to centralize and strengthen [hre_kaiser.GetHerHis] power in the region, my messengers have returned to me:"
 gdp_guelph_ghibelline.7000.desc.all: "\n\nAll of the respondents have joined the Lombard League, at my behest.\n\nNow, we are strong enough to resist any sudden move attempted by the [hre_kaiser.GetTitleAsName]... !"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nMore than half of the respondents have joined the Lombard League, at my behest.\n\nThis should allow us to withstand the [hre_kaiser.GetTitleAsName], and hopefully we may receive additional assistance from our holy friends..."
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nOnly a few of the respondents have joined the Lombard League; which undeniably causes me some concern.\n\n#EMP Never the matter!#! With a little holy help, we should be able to defend our newfound independence."
 gdp_guelph_ghibelline.7000.a: "It is time for a change!"
 gdp_guelph_ghibelline.7000.b: "Our time is now!"

 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ Join the $lombard_league_name$?"
 gdp_guelph_ghibelline.7005.desc: "It would appear as if [league_creator.GetTitledFirstName] is an honorable [league_creator.GetWomanMan] after all.\n\nNews reaches me that [league_creator.GetSheHe] has formed the [lombard_league_conf.GetName], an initiative to stave off the advances of the [hre_kaiser.GetTitleAsName].\n\nIt does seem like a sound initiative, if one is inclined to escape the shackles of the empire..."
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "Let's not be so hasty..."

 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ the $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "My messengers inform me that the contentious [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] #EMP [league_creator.GetTitledFirstName]#! is not happy with the state of affairs in [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier], and the treacherous [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] has convinced other feeble-minded sheep to join [league_creator.GetHerHim]!\n\nWhat even is a #EMP Lombard League#!?!"
 gdp_guelph_ghibelline.7010.a: "Their insolence must not go unpunished!"
 gdp_guelph_ghibelline.7010.b: "I have my eye set on other things."
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName] has created the [league_creator.GetConfederation.GetName] #weak (Currently #V [lombard_league_conf.GetMemberCount]#! members)#!"

 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "I'm afraid the Lombard League will make do without your #EMP gracious#! contributions."
 gdp_guelph_ghibelline.7015.a: "Hmmm."

 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ Compromise Reached"
 gdp_guelph_ghibelline.8500.desc: "A murmur escapes the audience as the two representatives of the Guelphs and the Ghibellines, [guelph_leader.GetName] and [ghibelline_leader.GetName], meet to sign the treaty.\n\nSome joyful, some decidedly more agitated at the notion of reaching a compromise, forced to concede their high-held beliefs of correctness.\n\nAfterwards, muted dialogues take place while the crowd disperses, moving over to partake in the customary dinner preparations."
 gdp_guelph_ghibelline.8500.a: "It is finally over."

 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "I see that you still have not seen the error of your ways. Why should we make such vast concessions when you [actor.Custom('GetGuelphsGhibellines')] are so clearly in the wrong?\n\nIt would amuse me if it wasn't so egregious."
 gdp_guelph_ghibelline.8510.a: "The insolence!"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U] declined your proposal to end the [GetSituation('guelph_ghibelline').GetName] [situation|E]"

 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "The agreement was a display in diplomacy; that much is certain.\n\n[guelph_leader.GetName] and [ghibelline_leader.GetName] both compromised, earning small victories but losing popular opinion.\n\nReaching a treaty to stand the test of time is no small feat; and we shall see how many of us can leave the past alone and look forward, toward a brighter future."
 gdp_guelph_ghibelline.8520.a: "I suppose it's for the best."

 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphGhibelline')] Victory"
 gdp_guelph_ghibelline.9000.desc.guelph: "It is settled. We have defended the rights of that which is most holy — the supreme authority that allows the Pope to safeguard and elect our sacred shepherds going forward.\n\nAnd to limit the influence of [GetTitleByKey('e_hre').GetName], whose ambition threatens us all in the end.\n\nThose #EMP astray#! Ghibelline souls hardly knew what hit them."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "Finally we have proven our sovereign right to rule the empire the way [ROOT.Char.GetFaith.HighGodName] intended — with a stern hand and a rational mind.\n\nHow could a displaced sacred conduit determine who is best to rule the lands of [GetTitleByKey('e_hre').GetName], after all.\n\nThose Pope-supporting Guelphs can take care of our souls, and we'll take care of what #EMP really#! matters."
 gdp_guelph_ghibelline.9000.a: "I believe celebrations are in order."

 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphGhibelline')] Defeat"
 gdp_guelph_ghibelline.9010.desc.win: "Time and time again we gain popular support in face of a weak [ROOT.Char.Custom('GuelphGhibellineGetOpposite')] opposition.\n\nOur distinguished leader [victorious_leader.GetTitledFirstName] as well as independent legislators has proclaimed the [ROOT.Char.Custom('GetGuelphsGhibellines')] to be in the right, thus settling this on-going #EMP situation#! once and for all.\n\nFinally reason is dawning on this part of the world!"
 gdp_guelph_ghibelline.9010.desc.lose: "Our support is dwindling; it is a fact.\n\nNeither the power nor influence of the [ROOT.Char.Custom('GetGuelphsGhibellines')] reaches as far as it should, as far as it needs to, and those dimwitted [ROOT.Char.Custom('GuelphGhibellineGetOpposite')] rulers have scrounged up overpowering #EMP independent#! legislators to support them.\n\nIt is time for the [ROOT.Char.Custom('GetGuelphsGhibellines')] to abandon this fight, and focus on more achievable goals."
 gdp_guelph_ghibelline.9010.a.win: "Let us savor this moment."
 gdp_guelph_ghibelline.9010.a.lose: "Those #EMP snakes#!!"
