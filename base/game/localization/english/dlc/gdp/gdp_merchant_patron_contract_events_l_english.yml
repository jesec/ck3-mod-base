l_english: 
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: The [patron.Custom('GetRoomPlural')|U] of the [patron.GetTitleAsNameNoTooltip] "
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName] is a great [patron.GetWomanMan], and nobles, priests, merchants, and commoners alike from [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] and beyond all vie for [patron.GetHerHis] attention and patronage.\n\nWe must be forthright, but also tread carefully, if we are to ensure the company remains in [patron.GetHerHis] good graces, neither outshone by a more wily rival nor falling completely from [patron.GetHerHis] attention.\n\nOur business must ever be on the tongues of the great and good of [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: Success!"
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName] could not resist my tales of far-off lands and the criss-crossing worlds of commerce, hanging on my words each evening at the banquet table.\n\nI can return to the company safe in the knowledge that [patron.GetFirstNameNoTooltip] sees us as valuable partners and welcome friends.\n\nOur reputation has been bolstered considerably in [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], and no doubt word of my influence will proceed me further afield."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: Failure!"
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName] called for my presence less and less, did I do something wrong? A change in the civility of the courtiers of [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] confirms to me [patron.GetHerHis] displeasure.\n\nDid my anecdotes bore [patron.GetHerHim]? Did I make one too many comments on vagaries of commerce? Did I overstep some invisible boundary of the #EMP noblesse#!?\n\nThere is nothing to be done now except return to the company, mitigate the damage, and put things back on the right path..."
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "Impressed Patron"
 gdp_impressed_patron_modifier_desc: "This merchant's efforts to ingratiate themselves have impressed their Patron."
 gdp_impressed_patron_critical_modifier: "Impressed Patron"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "Dismissive Patron"
 gdp_dismissive_patron_modifier_desc: "This merchant's efforts to ingratiate themselves have underwhelmed their Patron."
