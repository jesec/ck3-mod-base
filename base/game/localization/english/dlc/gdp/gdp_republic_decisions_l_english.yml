 gdp_decree_profligate_approval_desc: "[enactor.GetShortUIName|U] [CharAreIs( enactor )] [GetTrait('profligate').GetName( enactor )]"

 # Renounce Family Title
 gdp_renounce_noble_family_title_decision: "Retire from Heading House [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_renounce_noble_family_title_decision_republic_desc: "Retire to your family [consortery|E] and renounce all [titles|E] including the [house_head|E] title. Hand over the reins to your [house_possessive|E] heir, [ROOT.Char.GetHouse.GetHeirOfHouse.GetTitledFirstName], and allow [ROOT.Char.GetHouse.GetHeirOfHouse.GetHerHim] to take [house|E] [ROOT.Char.GetHouse.GetName] to new heights."
 gdp_renounce_noble_family_title_decision_republic_no_heir_desc: "Retire to your family [consortery|E] and renounce all [titles|E] including the [house_head|E] title. Hand over the reins to your [house_possessive|E] heir and allow them to take [house|E] [ROOT.Char.GetHouse.GetName] in a new direction."
 gdp_renounce_noble_family_title_decision_tooltip: "Renounce all [titles|E] and pass the [house_head|E] title to your [heir|E]"
