l_english:
 gdp_adopt_republic_government_decision: "Adopt Republican Ideals"
 gdp_adopt_republic_government_decision_desc: "I watch the crowd drift through the street, worn down by their daily struggle. It makes me wonder if our [ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l] ways are truly the only path for a ruler. Could I win loyalty through earned approval rather than birthright alone? Maybe it is time to embrace new ideals and reshape our way of life."
 gdp_adopt_republic_government_decision_tooltip: "Adopt republican ideals and become a [GetGovernment('republic_government').GetName]"
 gdp_adopt_republic_government_decision_confirm: "Adopt republican ideals"
 liege_has_granted_city_charter: "Your [liege|E] has granted you a City Charter"
 liege_has_granted_city_charter_duration: "Your [liege|E] has granted you a City Charter #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )])#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X You will no longer be an [elector|E] in the [GetTitleByKey('e_hre').GetName]#!"
 
 gdp_adopt_republican_ways_decision: "Adopt Republican Ways"
 gdp_adopt_republican_ways_decision_desc: "The gatherings that once bound us now strain under the weight of markets and walls. If [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] is to thrive, we must set aside the old tribal ways and let the city govern itself as a republic."
 gdp_adopt_republican_ways_decision_tooltip: "Leave [tribal|E] ways behind and become a [republic|E]"
 gdp_adopt_republican_ways_decision_confirm: "Adopt Republican Ways"
 gdp_tribal_capital_becomes_city_tt: "Your [realm_capital|E] will become a [city_holding|E]"
 gdp_other_tribal_holdings_become_castles_tt: "All other [tribal_holdings|E] in the realm will become [castle_holdings|E]"
 gdp_tribal_vassals_will_feudalize_tt: "Your [tribal|E] [vassals|E] will adopt [feudal|E] or [clan|E] [government|E]"

 convert_to_feudalism_from_republic_decision: "Adopt [ROOT.Char.Custom('GetTribalReformGovernment')|U] Ways"
 convert_to_feudalism_from_republic_decision_desc: "Assemblies, processes and bureaucracy slow down the effectiveness of our government. If [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] is to prosper, we must rid ourselves of these burdens."
 convert_to_feudalism_from_republic_decision_confirm: "Adopt [ROOT.Char.Custom('GetTribalReformGovernment')|U] ways"
 convert_to_feudalism_from_republic_decision_tooltip: "Change [government|E] type"
 patricians_becomes_merchants_desc: "[patrician|E] [vassals|E] become [merchants|E]"
 
 gdp_restore_roman_republic_decision: "Restore the Roman Republic"
 gdp_restore_roman_republic_decision_desc: "The Roman Republic was a beacon of freedom and prosperity, a model for all to follow. Yet, it has fallen into ruin, like so many things in this world. It is time to bring it back to life and restore its glory!"
 gdp_restore_roman_republic_decision_tooltip: "Restore the Roman Republic"
 gdp_restore_roman_republic_decision_confirm: "Restore the Roman Republic"
 restore_roman_republic_make_rome_capital_desc: "You may choose to make [GetTitleByKey('c_roma_urbs').GetName] the [realm_capital|E]"
 assembly_members_appointed_as_senators_desc: "All [assembly|E] members will be appointed as [republic_senators|E]"
 
 gdp_popular_mandate_decision: "Call for Popular Support"
 gdp_popular_mandate_decision_desc: "The people of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] love me. I can use that goodwill now, rallying them behind my continued tenure. The crowd's voice carries weight in the assembly, and a [ROOT.Char.GetTitleAsNameNoTooltip|l] with the people behind them commands a stronger hand when votes are counted.\n\nIt will cost me some of that favor, but a vote is won today, not tomorrow."
 gdp_popular_mandate_decision_tooltip: "Spend [popular_opinion|E] in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to gain an extra vote in the next [election|E]"
 gdp_popular_mandate_decision_confirm: "Rally the people behind me"
 gdp_popular_mandate_no_active_mandate_desc: "Does not already have popular support"

 gdp_civic_labor_decision: "Direct Civic Labor"
 gdp_civic_labor_decision_desc: "The goodwill of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] is as sure a resource as gold. I will call upon the citizens to lend their labor and expertise toward my construction efforts, in exchange for some of that goodwill spent."
 gdp_civic_labor_decision_tooltip: "Spend [popular_opinion|E] in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to gain bonuses to [ROOT.Char.GetTitleAsNameNoTooltip|l] domicile construction"
 gdp_civic_labor_decision_confirm: "Call upon the citizens"
 gdp_popular_gifts_decision: "Solicit Patronage"
 gdp_popular_gifts_decision_desc: "My standing among the people of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] gives me leverage. I will let it be known that the [ROOT.Char.GetTitleAsNameNoTooltip|l] is receiving offers from the great patrician houses. They will compete to outdo one another. The palace gains either way."
 gdp_popular_gifts_decision_tooltip: "Spend [popular_opinion|E] to pressure wealthy patrician families into competing for favor, earning [gold|E] and gifts for the palace"
 gdp_popular_gifts_decision_confirm: "Open the bidding"
 gdp_popular_gifts_artifact_tt: "You receive a random gift [artifact|E]"

 gdp_glorification_decision: "Accept Glorification"
 gdp_glorification_decision_desc: "The people of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] hold me in a regard that goes beyond politics or popularity. They wish to honor me not as their leader, but as the city made flesh. I will accept this moment for what it is."
 gdp_glorification_decision_tooltip: "Accept the city's glorification. A once-per-lifetime honor."
 gdp_glorification_decision_confirm: "Let them celebrate"
 gdp_glorification_artifact_tt: "You receive the #V $gdp_glorification_artifact_name$#! [artifact|E]"
 gdp_glorification_artifact_name: "Medallion of Civic Glory"
 gdp_glorification_artifact_desc: "A commemorative medallion presented by the citizens of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] in honor of their beloved [ROOT.Char.GetTitleAsNameNoTooltip|l]."

 gdp_popular_mandate_decision_toast: "Popular Support Secured"
 gdp_civic_labor_decision_toast: "Civic Labor Mobilized"
 gdp_popular_gifts_decision_toast: "Patricians Answer the Call"
 gdp_glorification_decision_toast: "The City Celebrates"

 gdp_fund_alms_decree_decision: "Give Alms in Capital"
 gdp_fund_alms_decree_decision_desc: "As [ROOT.Char.GetTitleAsNameNoTooltip], it falls to me to ensure that the citizens of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] are provided for. There are many reasons to give alms: to help those in need, to increase the city's prosperity, and to strengthen the bonds that hold our society together.\n\nWhatever the motive, providing for the poor is a reliable way to maintain the favor of the masses."
 gdp_fund_alms_decree_decision_tooltip: "Provide alms to the poor in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 gdp_fund_alms_decree_decision_confirm: "Provide alms"
 
 gdp_tax_holiday_decree_decision: "Tax Relief"
 gdp_tax_holiday_decree_decision_desc: "For the coming years, taxes levied on the citizens of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] shall be reduced. The treasury will bear the cost, but the goodwill of the people is worth the price."
 gdp_tax_holiday_decree_decision_tooltip: "Reduce city taxes in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to raise [popular_opinion|E]"
 gdp_tax_holiday_decree_decision_confirm: "Remit the city taxes"

 gdp_debt_forgiveness_decree_decision: "Debt Forgiveness"
 gdp_debt_forgiveness_decree_decision_desc: "Many citizens of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] are burdened by debts they cannot repay. By canceling what is owed to the city, we can offer them relief and earn their loyalty in return. Not everyone will approve of this use of the treasury, but a ruler who has the people behind him stands on firm ground."
 gdp_debt_forgiveness_decree_decision_tooltip: "Cancel citizen debts in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] for a significant boost to [popular_opinion|E]"
 gdp_debt_forgiveness_decree_decision_confirm: "Cancel the debts"
 gdp_debt_forgiveness_upset_patricians_tt: "Every [vassal|E] without the [GetHouseAspiration( 'republic_communal' ).GetName|V] [house_ambition|E]"
 gdp_debt_forgiveness_pleased_patricians_tt: "Every [vassal|E] with the [GetHouseAspiration( 'republic_communal' ).GetName|V] [house_ambition|E]"

 gdp_finance_war_decree_decision: "Finance War Effort"
 gdp_finance_war_decree_decision_desc: "War is a terrible affair, and above all a #EMP costly#! one. Should it become necessary, we can levy additional war taxes to secure funds for the war effort."
 gdp_finance_war_decree_decision_tooltip: "Levy additional taxes to finance ongoing wars"
 gdp_finance_war_decree_decision_confirm: "Levy war tax"
 finance_war_patrician_tax_name: "Patrican Tax"
 finance_war_patrician_tax_desc: "$finance_war_patrician_tax_name$"
 finance_war_patrician_tax_tooltip: "Exact an additional tax for [patricians|E]"
 finance_war_citizen_tax_name: "Citizen Tax"
 finance_war_citizen_tax_desc: "$finance_war_citizen_tax_name$"
 finance_war_citizen_tax_tooltip: "Exact an additional tax on [counties|E]"
 every_patrician_tt: "Every [patrician|E]"

 gdp_war_approval_decree_decision: "Request War Approval"
 gdp_war_approval_decree_decision_desc: "It is only by the will of the assembly that we may declare [war|E]. Greasing a few palms might be necessary to secure enough votes, but it is for the greater good."
 gdp_war_approval_decree_decision_tooltip: "Request permission from the [assembly|E] to declare a [war|E]"
 gdp_war_approval_decree_decision_confirm: "Request war approval"
 gdp_war_approval_decree_decision_effect_desc: "You gain permission to declare a [war|E]"
 must_have_assembly_approval_declare_war_desc: "You do #bold not#! have the [assembly_possessive|E] approval to declare [war|E]"
 gained_assembly_approval_declare_war_desc: "You have gained the [assembly_possessive|E] approval to declare [war|E]"

 gdp_banishment_approval_decree_decision: "Request Banishment Approval"
 gdp_banishment_approval_decree_decision_named: "Request Banishment of [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_banishment_approval_decree_decision_desc: "There are those among us who cannot abide our rule, and whom our rule can no longer abide. With the assent of the assembly, we may [banish|E] them from our realm, excising a dangerous element without the risk of deadly feud that a more permanent end would incur."
 gdp_banishment_approval_decree_decision_tooltip: "Request permission from the [assembly|E] to [banish|E] the character you have indicted"
 gdp_banishment_approval_decree_decision_confirm: "Request banishment approval"
 gdp_banishment_approval_decree_decision_effect_desc: "You gain permission to [banish|E] [indicted_character.GetShortUIName]"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "You gain permission to [banish|E] a character you have indicted"
 must_have_assembly_approval_banishment_desc: "You do #bold not#! have the [assembly_possessive|E] approval to [banish|E] them"
 gained_assembly_approval_banishment_desc: "You have already gained the [assembly_possessive|E] approval to [banish|E] [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"

 gdp_proscription_approval_decree_decision: "Request Proscription Approval"
 gdp_proscription_approval_decree_decision_named: "Request Proscription of the [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip] Family"
 gdp_proscription_approval_decree_decision_desc: "Blood always tells; a traitor's kin share in their taint and carry the same malice in their perfidious hearts. If the assembly consents, we may [banish|E] their entire family and rid ourselves of a recreant lineage."
 gdp_proscription_approval_decree_decision_tooltip: "Request permission from the [assembly|E] to [banish|E] the entire family of the character you have indicted"
 gdp_proscription_approval_decree_decision_confirm: "Request proscription approval"
 gdp_proscription_approval_decree_decision_effect_desc: "You gain permission to [banish|E] [indicted_character.GetShortUINamePossessive] entire family"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "You gain permission to [banish|E] the entire family of a character you have indicted"
 must_have_assembly_approval_proscription_desc: "You do #bold not#! have the [assembly_possessive|E] approval to [banish|E] their entire family"
 gained_assembly_approval_proscription_desc: "You have already gained the [assembly_possessive|E] approval to [banish|E] [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINamePossessive] entire family"

 gdp_execution_approval_decree_decision: "Request Execution Approval"
 gdp_execution_approval_decree_decision_named: "Request Execution of [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_execution_approval_decree_decision_desc: "Despite the benevolence of our rule, there are still those who would threaten its very foundations. The risk they pose is such that we cannot rest while they draw breath; with the approval of the assembly, we may [execute|E] them and put our people's minds at ease."
 gdp_execution_approval_decree_decision_tooltip: "Request permission from the [assembly|E] to [execute|E] the character you have indicted"
 gdp_execution_approval_decree_decision_confirm: "Request execution approval"
 gdp_execution_approval_decree_decision_effect_desc: "You gain permission to [execute|E] [indicted_character.GetShortUIName]"
 gdp_execution_approval_decree_decision_effect_no_indicted_desc: "You gain permission to [execute|E] the character you have indicted"
 must_have_assembly_approval_execution_desc: "You do #bold not#! have the [assembly_possessive|E] approval to [execute|E] them"
 gained_assembly_approval_execution_desc: "You have already gained the [assembly_possessive|E] approval to [execute|E] [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_has_no_valid_indicted_character_desc: "You have #bold not#! indicted anyone before the [assembly|E]"
 gdp_has_no_valid_indicted_family_desc: "You have #bold not#! indicted the head of a [patrician_family|E] before the [assembly|E]"
 gdp_indicted_family_head_is_player_desc: "The head of the indicted [patrician_family|E] must #bold not#! be a player"

 gdp_overthrow_government_decision: "Overthrow Government"
 gdp_overthrow_government_decision_desc: "The leadership of this republic is rotten to the core. The time has come to right this ship of state and depose the corrupt and feeble, so that republican virtue can once again govern [ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nI will find supporters and together we will overthrow the government of [ROOT.Char.GetLiege.GetNameNoTooltip]." 

 gdp_overthrow_government_decision_tooltip: "Overthrow the current [republic|E] government and make yourself as its ruler"
 gdp_overthrow_government_decision_confirm: "Deliver us from tyrants!"
 you_are_patrician_desc: "You are a landless [patrician|E]."
 overthrow_government_effect_tooltip: "#WEAK This Decision will start a [hostile_scheme|E] to overthrow the government.#!\n$EFFECT_LIST_BULLET$ You might become the new [liege|E]\n$EFFECT_LIST_BULLET$ Your [rivals|E] or political enemies might leave the [republic|E]\n$EFFECT_LIST_BULLET$ The laws of the republic will change to fit your house ambitions without the [assembly_possessive|E] approval\n@alert_icon! #alert_trial Conspiring against the state is a serious [crime|E], if exposed#!"
 gdp_overthrow_agent_focus_balance: "Balanced [agent|E] arrangement"
 gdp_overthrow_agent_focus_success: "Focus on [agents|E] increasing [scheme_potential|E]"
 gdp_overthrow_agent_focus_speed: "Focus on [agents|E] decreasing [scheme_speed|E]"
 gdp_overthrow_agent_focus_secrecy: "Focus on [agents|E] increasing [secrecy|E]"
 agent_focus_balance_tooltip: "$overthrow_government_interaction.tt.agent_focus_balance$"
 agent_focus_success_tooltip: "$overthrow_government_interaction.tt.agent_focus_success$"
 agent_focus_speed_tooltip: "$overthrow_government_interaction.tt.agent_focus_speed$"
 agent_focus_secrecy_tooltip: "$overthrow_government_interaction.tt.agent_focus_secrecy$"

 gdp_quarantine_ship_decree_decision: "Trentina Quarantine"
 gdp_quarantine_ship_decree_decision_desc: "#bold By the will of the Assembly:#!\nA thirty-day quarantine will be instituted to halt the spread of the harmful vapors that lead to plague and other maladies."
 gdp_quarantine_ship_decree_decision_tooltip: "Enact a quarantine of ships entering the harbor, increasing [epidemic_resistance|E] but at the cost of [competitiveness|E] for all [trade_routes|E] connected to the [capital_possessive|E] [trade_market|E]"
 gdp_quarantine_ship_decree_decision_confirm: "Instituted a Trentina Quarantine"

 gdp_quarantine_modifier_desc: "Every [character|E] with a [trade_route|E] route in the [capital_possessive|E] [market|E]" 
 DECREE_PLAGUE_APOCALYPTIC_DESC: "An apocalyptic [epidemic|E] outbreak in the [realm|E]"
 DECREE_PLAGUE_MAJOR_DESC: "A major [epidemic|E] outbreak in the [realm|E]"
 DECREE_PLAGUE_MINOR_DESC: "A minor [epidemic|E] outbreak in the [realm|E]"
 DECREE_PLAGUE_NONE_DESC: "There is no [epidemic|E] outbreak in the [realm|E]"

 gdp_enforce_curfew_decree_decision: "Nightly Curfew"
 gdp_enforce_curfew_decree_decision_desc: "#bold By the will of the Assembly:#!\nA strict curfew is hereby implemented and enforced, that criminal activity may be curtailed during the evening hours."
 gdp_enforce_curfew_decree_decision_tooltip: "Instituted a Nightly Curfew to curtail unlawful behavior and foil criminal schemes"
 gdp_enforce_curfew_decree_decision_confirm: "Instituted a Nightly Curfew"
 gdp_enforce_curfew_decree_decision_effect_desc: "The Nightly Curfew will lower the effectiveness of [hostile_scheme|E] and increase [control|E]"
 gdp_republic_curfew_desc: "All [vassals|E] in the [capital|E]"

 gdp_sponsor_craft_guild_decision: "Sponsor Craft Guild"
 gdp_sponsor_craft_guild_decision_desc: "In a republic, being recognized as a craft guild offers great benefits; therefore, artisans of many professions seek an official charter drawn up and approved by the assembly — sponsoring them through this process is not only good for the city, but the patrician who puts the bill before the assembly will also be viewed by the new guild as a patron."
 gdp_sponsor_craft_guild_decision_tooltip: "Sponsoring a craft guild will increase [prosperity_growth|E] and [urban_tax|E] in the [capital|E] [county|E], and increase your [house_possessive|E] [trade_competitiveness|E] and [trade_expertise|E] growth"
 gdp_sponsor_craft_guild_decision_confirm: "Sponsored a New Craft Guild"

 gdp_request_noble_magistracy_decision: "Request Noble Magistracy"
 gdp_request_noble_magistracy_decision_desc: "While most functionary positions are barred to those of patrician standing, there are positions reserved for noble magistrates — a perfect job for a young and ambitious patrician to learn the levers of state and gain some reputation."
 gdp_request_noble_magistracy_decision_tooltip: "The Noble Magistracy will increase your [heir_possessive|E] [dynasty_prestige|E] gain, [lifestyle_experience|E] gain, and [opinion|E], and increase their [stress_gain|E]"
 gdp_request_noble_magistracy_decision_confirm: "Requested a Noble Magistracy for your heir"

 gdp_request_relief_from_bankruptcy_decision: "Request Relief from Bankruptcy"
 gdp_request_relief_from_bankruptcy_decision_desc: "To make sure prominent families do not descend into squalor, the assembly can use the coffers of the republic to pay off creditors and bad debt — giving the ruined patrician a chance to claw their way back from the edge of bankruptcy."
 gdp_request_relief_from_bankruptcy_decision_tooltip: "Relief from Bankruptcy will pay off your [gold|E] debt from the [republic|E] [treasury|E]"
 gdp_request_relief_from_bankruptcy_decision_confirm: "Requested relief from bankruptcy"

 gdp_petition_for_state_protection_decision: "Petition for State Protection"
 gdp_petition_for_state_protection_decision_desc: "The state can extend a high degree of protection to those it deems worthy of it."
 gdp_petition_for_state_protection_decision_tooltip: "State Protection will strongly reduce the effectiveness of [hostile_scheme|E] against the protected character."
 gdp_petition_for_state_protection_decision_confirm: "Petitioned the state for protection"
 
