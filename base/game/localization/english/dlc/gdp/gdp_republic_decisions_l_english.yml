 change_republican_election_aspirations_decision: "Change Electoral Eligibility"
 change_republican_election_aspirations_decision_desc: "Chasing votes and herding cats; exhausting. Why not just sit back and focus on my own business, where coin may be made and energy may be focused on the relevant things in life."
 change_republican_election_aspirations_decision_tooltip: "Choose whether to seek elected or appointed office"
 change_republican_election_aspirations_decision_confirm: "Let my intentions be known"
 republic_renounced_election_personal_name: "Renounce Personal Eligibility"
