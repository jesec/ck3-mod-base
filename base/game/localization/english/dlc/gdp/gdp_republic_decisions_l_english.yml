 republic_desire_election_house_tooltip: "$republic_desire_election_house_desc$"

 gdp_republic_recruit_talent_decision: "Recruit Trader"
 gdp_republic_recruit_talent_decision_desc: "A trade empire demands many talents and many hands. Foremost among them are the traders who manage our routes, bargain in distant markets, and form the backbone of our wealth."
 gdp_republic_recruit_talent_decision_tooltip: "Recruit a new [trader|E] to help us with our [trade_routes|E]"
 gdp_republic_recruit_talent_decision_confirm: "Recruit trader"
 gdp_republic_recruit_trader_competitiveness_desc: "Recruit Competitive Trader"
 gdp_republic_recruit_trader_competitiveness_tooltip: "Recruit a [trader|E] focused on [martial_i][martial|E] and [intrigue_i][intrigue|E]"
 gdp_republic_recruit_trader_competitiveness_effect_desc: "A [character|E] focused on [martial_i][martial|E] and [intrigue_i][intrigue|E] will be hired and join your [court|E]"
