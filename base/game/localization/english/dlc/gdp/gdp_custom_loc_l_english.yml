l_english: 
 dinar: "dinar"
 dinar_plural: "dinars"
 dinar_gloss: "[Glossary('dinar', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('dinars', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "The #bold dinar#!, or #emp denar#!, was a gold coin introduced by the Umayyads in the 7th century to match the Byzantine gold [Glossary('solidus', 'SOLIDUS_GLOSS')], though its name stemmed from the silver [Glossary('denarius', 'DENARIUS_GLOSS')].\n\nIt spread throughout the Arabic world and its name is still used as a unit of several modern currencies."
 denarius: "denarius"
 denarius_plural: "denarii"
 denarius_gloss: "[Glossary('denarius', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('denarii', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "The #bold denarius#! was originally a silver coin of the Roman Republic, which was much debased by the Imperial period.\n\nDespite this, the term survived as shorthand for currency around the area of Roman influence, its name surviving in the later Carolingian silver [Glossary('denar', 'PENNY_GLOSS')] and the Arabic gold [Glossary('dinar', 'DINAR_GLOSS')]."
 ducat: "ducat"
 ducat_plural: "ducats"
 ducat_gloss: "[Glossary('ducat', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('ducats', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "The #bold ducato#!, or #emp dogado#!, was a gold coin introduced by Venice in the 13th century to match the Florentine [Glossary('florin', 'FLORIN_GLOSS')] and Genovese #emp genovino#! in response to debasements of the Byzantine gold [Glossary('solidus', 'SOLIDUS_GLOSS')], its name stemming from the title of the #emp Doge#! of Venice.\n\nIt soon became highly valued in commercial exchange, spreading throughout Europe and beyond, and was copied as a standard."
 dirham: "dirham"
 dirham_plural: "dirhams"
 dirham_gloss: "[Glossary('dirham', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('dirhams', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "The #bold dirham#!, or #emp dram#!, was a silver coin introduced by the Umayyads in the 7th century and adopted across the Arabic-speaking world, its name stemming from the ancient Greek silver #emp drachma#! of the Classical and Hellenistic periods.\n\nIt became a standard unit of weight in the Muslim world, spreading far and wide, and its name is still used as a unit of several modern currencies."
 aureus: "aureus"
 aureus_plural: "aurei"
 aureus_gloss: "[Glossary('aureus', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('aurei', 'AUREUS_GLOSS')]"
 solidus: "solidus"
 solidus_plural: "solidi"
 solidus_gloss: "[Glossary('solidus', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('solidi', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "The #bold solidus#!, or #emp nomisma#! (literally 'coin'), was a gold coin introduced by the Byzantines in the 4th century to replace the earlier Roman [Glossary('aureus', 'AUREUS_GLOSS')], until it was itself replaced by the [Glossary('hyperpyron', 'HYPERPYRON_GLOSS')] in the 11th century.\n\nThe gold coins of the Italian republics, such as the [Glossary('ducat', 'DUCAT_GLOSS')], [Glossary('florin', 'FLORIN_GLOSS')], and #emp genovino#!, were introduced in response to its debasement by the 13th century.\n\nIt was known as the #emp schilling#! in northern Europe, until Charlemagne's reforms standardized silver exchange value by that name in the 8th century."
 hyperpyron: "hyperpyron"
 hyperpyron_plural: "hyperpyra"
 hyperpyron_gloss: "[Glossary('hyperpyron', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('hyperpyra', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "The #bold hyperpyron#!, meaning 'highly refined', known as the #emp bezant#! in Europe, was a gold coin introduced by the Byzantines in the 11th century to replace the earlier gold [Glossary('solidus', 'SOLIDUS_GLOSS')].\n\nThough not as debased as the #emp solidus#!, its value was also much reduced by the 13th century, inspiring the introduction of the [Glossary('ducat', 'DUCAT_GLOSS')], [Glossary('florin', 'FLORIN_GLOSS')], and #emp genovino#! by the Italian republics."
 bezant: "bezant"
 bezant_plural: "bezants"
 bezant_gloss: "[Glossary('bezant', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('bezants', 'HYPERPYRON_GLOSS')]"
 florin: "florin"
 florin_plural: "florins"
 florin_gloss: "[Glossary('florin', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('florins', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "The #bold florin#! was a gold coin introduced by the Republic of Florence in the 13th century in response to debasements of the Byzantine [Glossary('solidus', 'SOLIDUS_GLOSS')] and [Glossary('hyperpyron', 'HYPERPYRON_GLOSS')], with the Genovese #emp genovino#! and Venetian [Glossary('ducat', 'DUCAT_GLOSS')] soon following.\n\nLike the #emp ducat#!, it became a widespread coin of exchange, with many mints around Europe issuing copies, and its name survives in the Hungarian #emp forint#!."
 penny: "penny"
 penny_plural: "pennies"
 penny_gloss: "[Glossary('penny', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('pennies', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "The #bold pfennig#!, or #emp penny#!, was a standardized silver coin introduced by Charlemagne in the 8th century as an equivalent to the earlier ubiquitous silver [Glossary('denarius', 'DENARIUS_GLOSS')] of the Roman world.\n\nIt was soon widespread and copied as a standard around Europe, and names such as #emp denar#!, #emp denier#!, and #emp dinero#! were used interchangeably for silver coins of its weight for centuries."
 pfennig: "pfennig"
 pfennig_plural: "pfennigs"
 pfennig_gloss: "[Glossary('pfennig', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('pfennigs', 'PENNY_GLOSS')]"
 denier: "denier"
 denier_plural: "deniers"
 denier_gloss: "[Glossary('denier', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('deniers', 'PENNY_GLOSS')]"
 dinero: "dinero"
 dinero_plural: "dineros"
 dinero_gloss: "[Glossary('dinero', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('dineros', 'PENNY_GLOSS')]"
 denaro: "denaro"
 denaro_plural: "denaros"
 denaro_gloss: "[Glossary('denaro', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('denaros', 'PENNY_GLOSS')]"
 denar: "denar"
 denar_plural: "denar"
 denar_gloss: "[Glossary('denar', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('denar', 'PENNY_GLOSS')]"
 groschen: "groschen"
 groschen_plural: "groschen"
 groschen_gloss: "[Glossary('groschen', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('groschen', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "The #bold groschen#!, or 'thick penny', was a heavier silver coin introduced by Duke Meinhard II of Tyrol in the 13th century in response to the equivalent Venetian #emp grosso#!, and was originally worth 12 [Glossary('pfennigs', 'PENNY_GLOSS')].\n\nThe standard soon spread around Europe, with the mints of Kutná Hora in Bohemia and Freiburg in Meissen being notable sources."
 tongbao: "tongbao"
 tongbao_plural: "tongbao"
 tongbao_gloss: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold Tongbao#!, meaning 'circulating treasure', is a name given to cast bronze-alloy [Glossary('qian', 'QIAN_GLOSS')]-style coins first issued by the Tang dynasty in the 7th century.\n\nThey became standard units of exchange across the Chinese sphere, and today are used in traditional Chinese medicine and as good-luck tokens."
 qian: "qian"
 qian_plural: "qian"
 qian_gloss: "[Glossary('qian', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('qian', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold Qian#!, meaning 'money', is a general term for the ubiquitous cast copper-alloy coins used as exchange units in China beginning in the Warring States period.\n\nTheir square-shaped holes aided in filing their cast edges smooth in bulk upon a rod, as well as allowing them to be strung in larger denominations for exchange, commonly in a string of 1000. They inspired similarly cast coins in Japan, Korea, Vietnam, and beyond."
 mon_coin: "mon"
 mon_coin_plural: "mon"
 mon_coin_gloss: "[Glossary('mon', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('mon', 'QIAN_GLOSS')]"
 tanka: "tanka"
 tanka_plural: "tanka"
 tanka_gloss: "[Glossary('tanka', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('tanka', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "The #bold tanka#!, or #emp taka#!, was a silver coin introduced by the Delhi Sultanate in the 13th century.\n\nIt spread throughout India and the neighboring regions where it was much copied, and became a standard exchange unit on the Silk Road."
 jital: "jital"
 jital_plural: "jital"
 jital_gloss: "[Glossary('jital', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('jital', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold Jital#! were originally silver coins with a bull-and-horseman design introduced in Kabul in the 8th century.\n\nThe design spread regionally with many copies issued and was eventually devalued, alloyed with more and more copper. #emp Jitals#! were entirely copper by the 16th century."
 coin: "coin"
 coin_plural: "coins"
 coin_gloss: "coin"
 coin_gloss_plural: "coins"
 bazaar: "bazaar"
 bazaar_plural: "bazaars"
 bazaar_gloss: "[Glossary('bazaar', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('bazaars', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold Bazaar#!, or #emp bazar#!, is a Persian name for a marketplace, coming from Proto-Indo-European. It later spread into Arabic and is now widely used throughout West Asia, India, and beyond."
 khrom: "khrom"
 khrom_plural: "khroms"
 khrom_gloss: "[Glossary('khrom', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('khroms', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold Khrom#! is a Tibetan term for a marketplace, which spread regionally along the Silk Road."
 shuka: "shuka"
 shuka_plural: "shukas"
 shuka_gloss: "[Glossary('shuka', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('shukas', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold Shuka#! is a term for a marketplace in the languages of the Caucasus. Like the Arabic [Glossary('suq', 'SUQ_GLOSS')], it was originally loaned from the Akkadian for 'street', but via Syriac."
 suq: "suq"
 suq_plural: "suqs"
 suq_gloss: "[Glossary('suq', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('suqs', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold Suq#!, also spelt #emp souk#!, is an Arabic word for a marketplace. Originally a loan from the Akkadian for 'street' via Aramaic, it is now a common term in the Muslim world and beyond."
 market_custom: "market"
 market_custom_plural: "markets"
 market_custom_gloss: "market"
 market_custom_gloss_plural: "markets"
 burgher: "burgher"
 burgher_plural: "burghers"
 patrician: "burgher"
 patrician_plural: "burghers"
 freeman: "freeman"
 freeman_plural: "freemen"

