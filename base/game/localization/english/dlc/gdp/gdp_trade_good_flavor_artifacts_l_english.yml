l_english:
 gdp_tgf_coin_artifact: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip] First Coin"
 gdp_tgf_coin_artifact_desc: "[tgf_market_holder.GetFirstNamePossessive] face on one side, and around the rim, in letters too small for anyone but a merchant to read: [tgf_coin_merchant.GetFirstName] supplied the [tgf_good.Custom('GetTradeGood')]."
 gdp_tgf_smith_weapon_axe: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] Axe"
 gdp_tgf_smith_weapon_dagger: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] Dagger"
 gdp_tgf_smith_weapon_hammer: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] Hammer"
 gdp_tgf_smith_weapon_mace: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] Mace"
 gdp_tgf_smith_weapon_spear: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] Spear"
 gdp_tgf_smith_weapon_sword: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] Sword"
 gdp_tgf_smith_weapon_desc: "Forged by [tgf_smith.GetFirstName] of [tgf_source_county.GetNameNoTier] from the best ingot [tgf_smith_patron.GetFirstName] ever bought. Worth ten times the metal, or so the smith swore."
 gdp_tgf_reading_stones_artifact_merchant: "[tgf_lens_merchant.GetFirstNamePossessiveNoTooltip] Reading Stones"
 gdp_tgf_reading_stones_artifact_lord: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip] Reading Stones"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "Two lenses of clear glass, ground by [tgf_glassmaker.GetFirstName] of [tgf_source_county.GetNameNoTier]. Seneca wrote that small letters swell in a glass globe of water. These make the small print of any contract plain."
 gdp_tgf_showpiece_artifact: "[tgf_showpiece_merchant.GetFirstNamePossessiveNoTooltip] Cabinet of [tgf_good.GetNameNoTooltip]"
 gdp_tgf_showpiece_artifact_desc: "Made by the master [tgf_good.Custom('GetTgfGoodCrafter')] [tgf_crafter.GetFirstName], every drawer lined with [tgf_showpiece_merchant.GetFirstNamePossessive] best [tgf_good.Custom('GetTradeGood')]. It is opened for buyers, and locked for everyone else."
 gdp_tgf_curio_grain: "A Sheaf of Prize Grain"
 gdp_tgf_curio_grain_desc: "Cut from the best field of a very good year."
 gdp_tgf_curio_millet: "A Jar of Old Millet"
 gdp_tgf_curio_millet_desc: "Years old and good as new. Millet keeps."
 gdp_tgf_curio_rice: "A Bowl of White Rice"
 gdp_tgf_curio_rice_desc: "Husked, polished, and too pretty to eat."
 gdp_tgf_curio_meat: "A Perfectly Salted Cut"
 gdp_tgf_curio_meat_desc: "Salted so well it may outlast its owner."
 gdp_tgf_curio_fish: "A Dried Fish, Mounted"
 gdp_tgf_curio_fish_desc: "Stiff as a board and twice as proud."
 gdp_tgf_curio_cheese: "A Wheel of Aged Cheese"
 gdp_tgf_curio_cheese_desc: "Pressed in a summer nobody else remembers."
 gdp_tgf_curio_fruit: "A Jar of Preserved Fruit"
 gdp_tgf_curio_fruit_desc: "Candied, sealed, and saved for a day that deserves it."
 gdp_tgf_curio_oil: "A Flask of First Pressing"
 gdp_tgf_curio_oil_desc: "Green-gold, from the first press of the year."
 gdp_tgf_curio_honey: "A Sealed Honey Pot"
 gdp_tgf_curio_honey_desc: "Dark as amber. Older than some vintages."
 gdp_tgf_curio_tea: "A Brick of Pressed Tea"
 gdp_tgf_curio_tea_desc: "Worth its weight, a long way from the garden."
 gdp_tgf_curio_horses: "A Champion's Horseshoe"
 gdp_tgf_curio_horses_desc: "From a horse that never lost a race, so the seller swore."
 gdp_tgf_curio_cattle: "A Polished Cow Horn"
 gdp_tgf_curio_cattle_desc: "Polished to a shine. Drinks well at feasts."
 gdp_tgf_curio_silver: "A Flawless Silver Ingot"
 gdp_tgf_curio_silver_desc: "Pure enough to mark with a thumbnail, and no one dares."
 gdp_tgf_curio_gold: "A River-Gold Nugget"
 gdp_tgf_curio_gold_desc: "Washed from a river no one will name."
 gdp_tgf_curio_iron: "A Perfect Iron Blank"
 gdp_tgf_curio_iron_desc: "Dense, dark, and without a single flaw."
 gdp_tgf_curio_copper: "A Gleaming Copper Round"
 gdp_tgf_curio_copper_desc: "Cast at the mine, bright as the day it cooled."
 gdp_tgf_curio_beer: "A Carved Tankard"
 gdp_tgf_curio_beer_desc: "Holds exactly one honest pint. Rarely used for one."
 gdp_tgf_curio_wine: "A Legendary Vintage"
 gdp_tgf_curio_wine_desc: "A bottle from a year the growers still whisper about."
 gdp_tgf_curio_gems: "An Uncut Gemstone"
 gdp_tgf_curio_gems_desc: "Rough as gravel, and worth a village."
 gdp_tgf_curio_amber: "An Amber Chunk"
 gdp_tgf_curio_amber_desc: "Honey-colored, with a fly caught inside forever."
 gdp_tgf_curio_ivory: "A Carved Ivory Sliver"
 gdp_tgf_curio_ivory_desc: "A tusk's tip, carved by someone with patience."
 gdp_tgf_curio_jade: "A River Jade Pebble"
 gdp_tgf_curio_jade_desc: "Cool in the hand, as true jade always is."
 gdp_tgf_curio_wood: "A Knot of Figured Wood"
 gdp_tgf_curio_wood_desc: "Grain like flowing water. Carvers bid on it yearly."
 gdp_tgf_curio_hemp: "A Perfect Coil of Rope"
 gdp_tgf_curio_hemp_desc: "Rope so even it looks drawn, not twisted."
 gdp_tgf_curio_wool: "A Golden Fleece"
 gdp_tgf_curio_wool_desc: "Not the golden one. Close, says the shepherd."
 gdp_tgf_curio_cotton: "A Tuft of Finest Cotton"
 gdp_tgf_curio_cotton_desc: "Light as down and white as frost."
 gdp_tgf_curio_flax: "A Skein of Silken Flax"
 gdp_tgf_curio_flax_desc: "Flax so fine it passes for silk at dusk."
 gdp_tgf_curio_textiles: "A Master Weaver's Bolt"
 gdp_tgf_curio_textiles_desc: "The weave so tight it turns rain."
 gdp_tgf_curio_furs: "A Flawless Winter Pelt"
 gdp_tgf_curio_furs_desc: "Taken at midwinter, when the coat is deepest."
 gdp_tgf_curio_leather: "A Tooled Leather Panel"
 gdp_tgf_curio_leather_desc: "Tanned, tooled, and soft as cloth."
 gdp_tgf_curio_sugar: "A White Sugarloaf Tip"
 gdp_tgf_curio_sugar_desc: "The whitest part of the loaf, saved for show."
 gdp_tgf_curio_spices: "A Box of Rare Spices"
 gdp_tgf_curio_spices_desc: "Opened once a year, to prove it exists."
 gdp_tgf_curio_ceramics: "A Flawless Glazed Bowl"
 gdp_tgf_curio_ceramics_desc: "Rings like a bell when struck. No one strikes it."
 gdp_tgf_curio_glass: "A Clear Glass Vial"
 gdp_tgf_curio_glass_desc: "Not a bubble in it. The glassblower retired proud."
 gdp_tgf_curio_jewelry: "A Masterwork Brooch"
 gdp_tgf_curio_jewelry_desc: "The pin alone took a month."
 gdp_tgf_curio_lacquerware: "A Lacquered Keepsake Box"
 gdp_tgf_curio_lacquerware_desc: "Thirty coats deep. It outshone the gift inside."
 gdp_tgf_curio_silk: "A Remnant of Perfect Silk"
 gdp_tgf_curio_silk_desc: "The loom's best hour, kept off the market."
 gdp_tgf_curio_incense: "A Lump of Pale Resin"
 gdp_tgf_curio_incense_desc: "Sweet unburned. Sweeter burned. Never burned."
 gdp_tgf_curio_medicaments: "An Apothecary's Sampler"
 gdp_tgf_curio_medicaments_desc: "One dose of everything, against everything."
 gdp_tgf_curio_stone: "A Carved Stone Fragment"
 gdp_tgf_curio_stone_place: "A Carved Stone from [tgf_source_county.GetNameNoTierNoTooltip]"
 gdp_tgf_curio_stone_desc: "Older than any mason alive, and better cut."
 gdp_tgf_curio_salt: "A Cake of Pure White Salt"
 gdp_tgf_curio_salt_desc: "White as snow, which gray salt never is."
 gdp_tgf_curio_alum: "A Fist-Sized Alum Crystal"
 gdp_tgf_curio_alum_desc: "Clear as ice and sharp on the tongue."
 gdp_tgf_curio_dyes: "A Vial of True Purple"
 gdp_tgf_curio_dyes_desc: "A color once reserved for emperors. Technically still is."
 gdp_tgf_curio_books_paper: "An Illuminated Page"
 gdp_tgf_curio_books_paper_desc: "One perfect page from a book no one can find."
 gdp_tgf_itinerary_artifact: "A Pilgrim's Itinerary"
 gdp_tgf_itinerary_artifact_desc: "A battered little book of roads, inns and fords, written in a careful hand. Some of these places are not on any map."
 gdp_tgf_first_sale_artifact: "[tgf_first_seller.GetFirstNamePossessiveNoTooltip] First [tgf_good.GetNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "The first [tgf_good.Custom('GetTgfGoodSmallest')] of [tgf_good.Custom('GetTradeGood')] [tgf_first_seller.GetFirstName] ever sold, bought back at twice the price and framed. It is not for sale. Probably."
 gdp_tgf_merchant_portrait_artifact: "Portrait of a Merchant"
 gdp_tgf_merchant_portrait_artifact_desc: "A merchant at a counting table, painted with a pile of coins and an air of great satisfaction."
 gdp_tgf_bale_book_artifact: "A Book From the Cargo"
 gdp_tgf_bale_book_artifact_desc: "Someone used it to keep the damp out of a merchant's goods. It worked, mostly."
 gdp_tgf_handbook_practice_artifact: "The Practice of Commerce"
 gdp_tgf_handbook_practice_artifact_desc: "Weights, measures, roads, and prices, set down by a merchant who clearly never slept. The margins are full of someone else's sums."
 gdp_tgf_handbook_roads_artifact: "The Book of Roads and Markets"
 gdp_tgf_handbook_roads_artifact_desc: "Every road between the great markets, with the tolls, the inns, and which ferrymen cheat."
 gdp_tgf_handbook_mirror_artifact: "The Merchant's Mirror"
 gdp_tgf_handbook_mirror_artifact_desc: "Advice for a merchant, from what to buy to whom to trust. Most of it is about whom not to trust."
