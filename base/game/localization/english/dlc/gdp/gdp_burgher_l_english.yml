 agitate_civic_unrest_interaction_desc: "Attempt to stir one of [recipient.GetShortUINamePossessiveNoTooltip] [counties|E] into demanding self-rule, starting a [war|E] with the #V $BURGHER_WAR_CB_NAME$#! [casus_belli|E] if denied"
 agitate_civic_unrest_eligible_tt: "You must be able to start a #V $gdp_civic_agitation_scheme$#! [scheme|E] against this [county|E]"
 revoke_civic_liberties_interaction: "Revoke Civic Liberties"
 revoke_civic_liberties_interaction_desc: "Strip all civic privileges from one of your [counties|E] at a heavy cost to [popular_opinion|E]"
