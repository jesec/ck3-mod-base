 revoke_civic_liberties_no_privileges_tt: "This [county|E] must possess civic privileges to revoke"

 gdp_civic_agitation_scheme: "Agitate Civic Unrest"
 gdp_civic_agitation_scheme_action: "Agitate Civic Unrest against"
 gdp_civic_agitation_scheme_desc: "I will rouse the good people of [SCHEME.GetTargetTitle.GetBaseNameNoTier] to demand the right to self-rule that they so richly deserve!"
 gdp_civic_agitation_scheme_desc_general: "$gdp_civic_agitation_scheme$ is a [hostile_scheme|E] that aims to stir a [county|E] into demanding self-rule from its [ruler|E]. It is a [secret_scheme|E] based on [intrigue|E], that can recruit [agents|E].\n\nA successful $gdp_civic_agitation_scheme$ will cause the targeted [county|E] to raise a $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E] that goes to [war|E] if its demands are refused.\n\nAny [merchant|E] can agitate, as can the head of a $republic_type_popular$, and any [republic|E] they free will adopt the same type. Other heads of a [republic|E] need a [patrician_rating|E] of at least [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V], and other [republican|E] [house_heads|E] need at least [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]."
 gdp_civic_agitation_scheme_desc_success: "The targeted [county|E] raises a $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E] and demands self-rule"
 gdp_civic_agitation_scheme_discovery_desc: "You are not exposed for agitating the [county|E]"
 gdp_civic_agitation_scheme_invalidated_title: "@scheme_icon! $gdp_civic_agitation_scheme$ Scheme Ends"
 gdp_civic_agitation_scheme_invalidated_desc: "The $gdp_civic_agitation_scheme$ [scheme|E] is no longer valid"

