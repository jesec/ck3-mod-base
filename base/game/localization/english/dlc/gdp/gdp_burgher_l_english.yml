 burgher_war_victory_desc: "Every rebelling [county|E] becomes a self-governing [republic|E], starting with [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|V], moving its [capital|E] to the [county|E]'s largest city if needed. Three or more will form a #V $confederation_type_trade_league_name$#!"
 burgher_war_victory_free_city_desc: "Every rebelling [county|E] becomes a self-governing [republic|E], starting with [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|V], moving its [capital|E] to the [county|E]'s largest city if needed. Three or more will form a #V $confederation_type_trade_league_name$#!"
 burgher_war_white_peace_desc: "The [faction|E] is disbanded and the leading [county|E] is granted a minor civic privilege. Its counties will not raise another $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E] for [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] years."
 burgher_war_defeat_desc: "The [faction|E] is disbanded and every rebelling [county|E] loses any civic privileges it possesses, along with [popular_opinion|E]. Its counties will not raise another $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E] for [EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0] years."
 burgher_war_ended_invalid.desc: "$BURGHER_WAR_CB_NAME$ invalidated: the $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E] no longer has a leader!"

 civic_privileges_county_modifier: "Civic Privileges"
 civic_privileges_county_modifier_desc: "This county has been granted a few minor civic privileges, none of them written into a charter."
 civic_privilege_market_rights_1_county_modifier: "Limited Market Rights"
 civic_privilege_market_rights_1_county_modifier_desc: "This county has been granted the right to hold a market under its lord's measures and oversight."
 civic_privilege_market_rights_2_county_modifier: "Market Rights"
 civic_privilege_market_rights_2_county_modifier_desc: "This county has been granted its own market days and scales and keeps a healthy share of the trade."
 civic_privilege_market_rights_3_county_modifier: "Broad Market Rights"
 civic_privilege_market_rights_3_county_modifier_desc: "This county has been granted near-total control over its market, leaving its lord a slim share of the trade."
 civic_privilege_guild_rights_1_county_modifier: "Limited Guild Rights"
 civic_privilege_guild_rights_1_county_modifier_desc: "This county's crafts have been granted the right to organize, though their masters still answer to their lord's court."
 civic_privilege_guild_rights_2_county_modifier: "Guild Rights"
 civic_privilege_guild_rights_2_county_modifier_desc: "This county's guilds have been granted the right to set their own standards and admit their own masters."
 civic_privilege_guild_rights_3_county_modifier: "Broad Guild Rights"
 civic_privilege_guild_rights_3_county_modifier_desc: "This county's guilds have been granted near-total control of its crafts and of what is made in them."
 civic_privilege_tax_exemption_1_county_modifier: "Partial Civic Tax Exemption"
 civic_privilege_tax_exemption_1_county_modifier_desc: "This county's town has been granted relief from some of the dues it owes its lord."
 civic_privilege_tax_exemption_2_county_modifier: "Civic Tax Exemption"
 civic_privilege_tax_exemption_2_county_modifier_desc: "This county's town has been granted the right to levy its own taxes at a rate of its own choosing."
 civic_privilege_tax_exemption_3_county_modifier: "Broad Civic Tax Exemption"
 civic_privilege_tax_exemption_3_county_modifier_desc: "This county's town has been granted relief from most of its taxes, and renders little beyond a token sum."
 civic_privilege_militia_charter_1_county_modifier: "Limited Militia Charter"
 civic_privilege_militia_charter_1_county_modifier_desc: "This county's town has been granted a watch of its own, so long as it does not venture beyond its walls."
 civic_privilege_militia_charter_2_county_modifier: "Militia Charter"
 civic_privilege_militia_charter_2_county_modifier_desc: "This county's town has been granted a militia of its own, and fewer of its troops march for their lord."
 civic_privilege_militia_charter_3_county_modifier: "Broad Militia Charter"
 civic_privilege_militia_charter_3_county_modifier_desc: "This county's town has been granted the right to arm itself, and spares its lord only a token few."
 burgher_grievance_county_modifier: "Civic Grievances"
 burgher_grievance_county_modifier_desc: "This county has had its demands refused, and is unwilling to let bygones be bygones."
 gdp_civic_agitation_county_modifier: "Civic Agitation"
 gdp_civic_agitation_county_modifier_desc: "This county is being stirred against its ruler by an outside hand."
 gdp_civic_agitation_popular_republic_modifier: "Voice of the People"
 gdp_civic_agitation_popular_republic_modifier_desc: "This scheme is backed by the head of a [GetLaw('republic_type_popular').GetName], a beacon of civic liberty."

