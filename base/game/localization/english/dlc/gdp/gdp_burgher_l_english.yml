 HANSEATIC_LEAGUE_NAME: "Hanseatic League"
 GENERIC_HANSE_NAME: "Hanse of [hanse_lead_town.GetName]"

 gdp_burgher.0001.desc: "We, the [burgher_county.Custom('BurgherPluralNoun')] of [burgher_county.GetNameNoTier], demand that you grant us [burgher_county.Custom('BurgherDemandedPrivilege')], so that our town may prosper and bring greater wealth to your realm."
 gdp_burgher.0001.a: "Their request is reasonable. Grant it my seal."
 gdp_burgher.0001.b: "I refuse!"

 gdp_burgher.0001.opening: "To our [ROOT.Char.Custom('LadyLordWomanMan')],"
 gdp_burgher.0010.desc: "We, the [burgher_county.Custom('BurgherPluralNoun')] of [burgher_county.GetNameNoTierNoTooltip], ask that you grant us the liberty to govern ourselves, to choose our own leaders and conduct affairs in our own name, else we may be forced to seize what you will not grant by grace."
 gdp_burgher.0010.a: "Give them their liberty."
 gdp_burgher.0010.b: "Let them fight for their #EMP "rights"#!."

 gdp_burgher.0020.t: "The Liberty of [freed_county.GetNameNoTierNoTooltip]"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier] has won its freedom, and with it the privilege to govern itself and appoint its own magistrates.\n\nNone of which, of course, would have been possible without #EMP my#! backing."
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier] has won its freedom, and with it the privilege to govern itself and appoint its own magistrates.\n\nNone of which, of course, would have been possible without #EMP my#! backing."
 gdp_burgher.0020.a: "The burden of leadership is one I will accept gladly."
 gdp_burgher.0020.b: "I will take my place among their magnates."
 gdp_burgher.0020.c: "Their goodwill will be profitable enough."
 gdp_burgher_agitator_not_republic_head_tt: "You must #bold not#! already head a [republic|E]"
 gdp_burgher_agitator_outranks_republic_head_tt: "Your [title_tier|E] must be lower than that of [burgher_ruler.GetTitledFirstName]"

 gdp_civic_agitation.0001.t: "Liberty Kindled"
 gdp_civic_agitation.0001.desc: "Everything has fallen into place. The people of [target.GetNameNoTier] burn with the most fervent desire for civic liberty that my agents could inflame, while their leaders deliver passionate orations in the market square about onerous taxes and unjust magistrates.\n\nI'm told a delegation is making ready to ride for their lord to demand the right to govern themselves. The only question remains is whether I ride with them."
 gdp_civic_agitation.0001.a: "I have come this far, and will see it to the end."
 gdp_civic_agitation.0001.b: "They should ride in force, armed and mounted at my expense."
 gdp_civic_agitation.0001.c: "Let the masses think it their idea. Those who matter know."
 gdp_civic_agitation.0001.c.exposed: "Own it, and promise them nothing more"
 gdp_civic_agitation_sponsor_joins_war_tt: "You will join the [war|E] alongside the [agitated_county.Custom('BurgherPluralNoun')], should their ruler rebuff them"
 gdp_civic_agitation_sponsor_war_chest_tt: "You will fund a company of professional soldiers in case war ensues"

 gdp_civic_agitation.0002.t: "Coin Ill Spent"
 gdp_civic_agitation.0002.desc: "The list of grievances was drawn up, read out before the people of [target.GetNameNoTier], and their leaders met and did #EMP nothing#!.\n\nMy agents have no account of what transpired beyond the obvious. My coin bought everything they would need except the nerve to actually #EMP use#! it."
 gdp_civic_agitation.0002.a: "I'll not soon forget this craven perfidy."

 found_the_hanseatic_league_decision: "Found the Hanseatic League"
 found_the_hanseatic_league_decision_tooltip: "Bind the [counties|E] of your [trade_league|E] into an even more powerful mercantile confederation"
 found_the_hanseatic_league_decision_confirm: "In concordance, we find prosperity"
 found_the_hanseatic_league_decision_desc: "Kings imagine that power wears a crown and carries a sword. We know a different truth. Power comes wrapped in furs, smells of fish, and carries ledgers recording sums that would bankrupt kingdoms.\n\nAlone, we are taxed, plundered, and threatened into compliance; united, there is no power in the northern seas that can withstand us. No harbor will deny our vessels, no foreign merchant able to undercut our wares, and no prince willing to impugn our privileges."
 found_the_hanseatic_league_cohesion_tt: "The [trade_league|E] must have at least #V 95#! [cohesion|E]"
 found_the_hanseatic_league_members_tt: "The [trade_league|E] must have at least #V 4#! members"
 found_the_hanseatic_league_message_title: "A Hanse Is Born"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U] [Select_CString( hanse_founder.IsLocalPlayer, 'have', 'has' )] bound the league into a sworn Hanse."

 league_needs_liege_consent_tt: "As a [vassal|E], you must have your [liege|E]'s consent, or a town free to join on its own"

 gdp_hanseatic.0010.opening: "From the [the_league.GetName],"
 gdp_hanseatic.0010.desc: "You hold trading rights in your own name, to your benefit and no others.\n\nSuch individual arrangements undermine us. We ask that you yield them in our favor, so that we may better prosper together."
 gdp_hanseatic.0010.a: "We shall surrender them to the [the_league.GetName]."
 gdp_hanseatic.0010.b: "I will bestow them upon [hanse_city_title.GetNameNoTier]."
 gdp_hanseatic.0010.c: "These rights are mine, #EMP and shall remain so#!."
