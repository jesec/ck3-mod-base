l_english: 
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]: Push for Advantages"
 gdp_merchant_scheme_advantage.1000.intro: "Pondering a means of hurrying along our business here in [task_contract_location.GetBaronyNameExplicitly], I look to"
 gdp_merchant_scheme_advantage.1000.intro.rival: "how our rival, [rival.GetTitledFirstNamePossessive], presence hinders us."
 gdp_merchant_scheme_advantage.1000.intro.partner: "my partner, [portrait.GetTitledFirstName], for solutions."
 gdp_merchant_scheme_advantage.1000.intro.agent: "my associate, [portrait.GetTitledFirstName], for solutions."
 gdp_merchant_scheme_advantage.1000.intro.trader: "my trader, [portrait.GetTitledFirstName], for solutions."
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nIf [portrait.GetTitledFirstNameNoTooltip] could only get serious and put [portrait.GetHerHis] full attention to the matter, we could surely put this matter behind us in no time..."
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nIf the company could only pull together as one, and put in some real elbow grease, we could surely put this matter behind us in no time..."
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nPerhaps, for the company's sake, I ought to roll up my sleeves and try to get some real work done, so we can move on to other matters..."
 gdp_merchant_scheme_advantage.1000.a: ""What do I pay you for, [portrait.GetTitledFirstNameNoTooltip]?!""
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.GetTitledFirstNameNoTooltip] is burdened"
 gdp_merchant_scheme_advantage.1000.b: ""The whole company needs to pull its finger out!""
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] The [company|E] is burdened"
 gdp_merchant_scheme_advantage.1000.c: ""Right, I'll just have to do it myself!""
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] You are burdened"
 gdp_merchant_scheme_advantage.1000.d.associate: ""Come, [portrait.GetFirstNameNoTooltip] can surely do more.""
 gdp_merchant_scheme_advantage.1000.d.unity: ""This company is full of layabouts!""
 gdp_merchant_scheme_advantage.1000.d.stress: ""I'll just to have work a little extra...""
 gdp_merchant_scheme_advantage.1000.e: ""Oh, forget it...""
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName] and I sit each day, debating the best ways to bring our goal closer. My trader brings up our lack of reliable manpower in [task_contract_location.GetBaronyNameExplicitly] time and again.\n\n"You know" [trader.GetFirstNameNoTooltip] sighs, "There is a [recruit.GetWomanMan] who may help us."
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetFirstName] is [recruit.GetHerHis] name, a lackey of [recruit_liege.GetTitledFirstName] of [recruit_liege.GetPrimaryTitle.GetDefinitiveName|l]...""
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetFirstName] is [recruit.GetHerHis] name, a local agent and fixer of the market...""
 gdp_merchant_scheme_advantage.1010.a: ""Let me talk to [recruit.GetHerHim]...""
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! You rely on charm"
 gdp_merchant_scheme_advantage.1010.b: ""Bring the [recruit.GetWomanMan] in, whatever the cost.""
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! You rely on lucre"
 gdp_merchant_scheme_advantage.1010.e: ""Bah, [recruit.GetSheHe] is not worth the trouble.""
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName] and I sit each day, debating the best ways to bring our goal closer. Eventually my trader broaches the topic of our [charter.GetName], and how it might be used to open doors currently closed to us in [task_contract_location.GetBaronyNameExplicitly].\n\n"After all" [trader.GetFirstNameNoTooltip] smiles, "Why not put [patron.GetTitledFirstNamePossessive] paper to good use?""
 gdp_merchant_scheme_advantage.1020.a: ""Yes, I'm sure we have the [patron.GetTitleAsNamePossessiveNoTooltip] backing!""
 gdp_merchant_scheme_advantage.1020.b: ""Our charter indeed speaks for itself.""
 gdp_merchant_scheme_advantage.1020.e: ""Now is not the time...""
