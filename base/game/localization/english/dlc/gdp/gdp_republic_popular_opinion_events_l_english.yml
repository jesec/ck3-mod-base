l_english:
 # Tier: severe negative 
 republic_popular_opinion_event.1001.t: "A Kettle Boiling"
 republic_popular_opinion_event.1001.desc: "These days, it is not a good time to be identified as a patrician on the street.\n\nSeeing my roaming eyes and worried expression, [relation_01.GetName] exclaims:\n\n"Damn it, [ROOT.Char.GetFullName]. Patricians of [event_location_01.GetName] do not sequester themselves. They walk the streets as proud citizens!"\n\n[relation_01.GetSheHe|U] is right, but of late the mood in the city is tense; discontent boiling under the surface. Protests and brawls plague the city, and I can only imagine what goes on after dark."
 republic_popular_opinion_event.1001.a: ""You are right. We need to hold our heads high.""
 republic_popular_opinion_event.1001.b: ""Might be a good time to get myself a bodyguard.""
 republic_popular_opinion_event.1001.c: ""The mob is going to kill us all!""
 republic_popular_opinion_event.1001.d: ""They won't find me easy prey.""

 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "Season of Discontent"
 republic_popular_opinion_event.1002.desc_1: "Standing at my window, I can hear angry voices echo; [event_location_01.GetName] is boiling with discontent. Workers are threatening to lay down their tools, or march in the streets. Symbols of the government are smashed or vandalized under the cover of darkness.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "Wherever I turn, I am met with sullen faces, obstruction and muttered insults."
 republic_popular_opinion_event.1002.desc_control_firm: "All the crowds can do is symbolic acts of defiance, as the government cracks down on the slightest sign of any unlawful gathering with brutal efficiency."
 republic_popular_opinion_event.1002.desc_control_strained: "Thank [ROOT.Char.GetFaith.HighGodName] the outbreaks of unrest are curtailed by the city guard. Ringleaders are arrested and put into the stocks on a daily basis. Agents intent on taking advantage of the chaos are hunted and exposed. Order is holding, for now."
 republic_popular_opinion_event.1002.desc_control_slipping: "Despite the hard work of the city guard, agitators slip through the cracks and violence plague the streets. Mobs gather and not all are broken up in time. The night belongs to gangs and ruffians."
 republic_popular_opinion_event.1002.desc_control_broken: "The government has lost control of the streets. The city guard hides in its barracks and the mob harasses patricians on the very steps of the palace! Rumors of foreign agents and saboteurs run rampant."
 republic_popular_opinion_event.1002.a: "I stand with the government!"
 republic_popular_opinion_event.1002.b: "I will make it clear that I stand with the people."
 republic_popular_opinion_event.1002.c: "Best to keep one's head down."

 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "Festive Spirit"
 republic_popular_opinion_event.1003.desc: "In the hustle and bustle of the [event_location_01.GetTitle.GetNamePossessive] market, I find myself talking to a citizen named [craftsman_character.GetName] and [craftsman_character.GetHerHis] jokes about [craftsman_character.GetHerHis] donkey make me bend over from laughter.\n\nOf late, it feels like the city is one big family; talking to strangers comes more easily and everyone is in a good mood, despite the harsh demands of life. The donkey brays happily and bump me with its head. \n\n"The Assembly have been doing a good job, eh?" [craftsman_character.GetFirstNameNoTooltip] says and scratches [craftsman_character.GetHerHis] donkey behind the ear. "Why don't you celebrate — organize a feast? The guilds would surely pitch in to make a good impression and show their appreciation.""
 republic_popular_opinion_event.1003.a: ""What a fantastic idea!""
 republic_popular_opinion_event.1003.b: ""Free coin, you say?""
 republic_popular_opinion_event.1003.c: ""I would rather get to know you.""
 republic_popular_opinion_event.1003.tt: "Your next [feast|E] [activity|E] is #P free. #!"

 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "Feeling Ambitious"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName] and I are enjoying some [ROOT.Char.Custom('RegionalDrink')] in a plaza near my home — lazily observing the bustle and industry of citizens going about their day. [relation_01.GetName] sighs with contentment after a sip of [relation_01.GetHerHis] drink.\n\n"I tell you, [ROOT.Char.GetFullName]: it's time to strike while the iron is hot. To get ambitious, I say! With the city in such a good mood, anything feels possible." [relation_01.GetSheHe|U] raises [relation_01.GetHerHis] cup and smile. "A toast: to fresh opportunities and coin aplenty!"\n\nI return the smile and raise my goblet."
 republic_popular_opinion_event.1004.a: ""To far-flung adventures!""
 republic_popular_opinion_event.1004.b: ""To new love and romance!""
 republic_popular_opinion_event.1004.c: ""To fame and glory!""
 republic_popular_opinion_event.1004.d: ""To family and friends!""
