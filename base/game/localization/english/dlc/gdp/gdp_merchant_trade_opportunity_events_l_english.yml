 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "As it stands, we no longer pay the tolls that we set out to manage."
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "As is likely to happen with a changeable situation, the Silk Road is no longer the same as when we began our journey, and with it goes our opportunity to manipulate its course."
