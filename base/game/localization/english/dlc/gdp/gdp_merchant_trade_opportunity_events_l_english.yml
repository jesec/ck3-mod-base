l_english: 
 gdp_merchant_trade_opportunity.0001.t: "Challenge Competitor: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "[task_contract_target.GetPrimaryTitle.GetNamePossessive] presence is a constant thorn in our side, damaging our prospects and profits, and nowhere more dearly than in [local_market.GetShortName].\n\nThese troublemakers must be dealt with and, one way or another, shown that we are the rightful masters of the local markets."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "After many days and nights haranguing the local peddlers, learning everything there is to know of the markets of [trade_market.GetShortName], we have found [target_title.GetNamePossessive] weaknesses.\n\nWith the means to undermine their local relationships, undercutting and outbidding them in key areas, we can soon send their profits tumbling along with their reputation!"
 gdp_merchant_trade_opportunity.0002.a: "Let's teach them to stay out of our patch."
 gdp_merchant_trade_opportunity.0002.b: "Revealing our hand will earn us their respect."
 gdp_merchant_trade_opportunity.0002.b.tt: "You must be a [friend|E], [spouse|E], or have at least [SCOPE.ScriptValue('high_skill_rating')|V0] [diplomacy|E], and not have a negative [relation|E] or be [house_feuding|E]"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "Our efforts to map [target_title.GetNamePossessive] networks, in [trade_market.GetShortName] and further afield, have borne little fruit. It seems we have even damaged our own reputation in the [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')].\n\nOur clumsy dealings have only strengthened the [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] position, with nary a loose chink in the long chains of their trade routes to be found..."
 gdp_merchant_trade_opportunity.0003.a: "By [ROOT.Char.GetFaith.WealthGodName]! This will eat into our profits!"

 gdp_merchant_trade_opportunity.0011.t: "Promote Goods: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "The bustling [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] of [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] see fierce competition between the peddlers and merchants for goods of all kinds.\n\nStanding amidst the din, brushed by the steady flow of passers-by, the question of how our wares are to stand out from the crowd, to catch the eye of customers and shopkeepers alike, is brought into sharp focus..."
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "Our attempts to promote the sale of [trade_good_type.GetNameNoTooltip|l] in [target_title.GetBaseNameNoTierNoTooltip] seem to have stuck, with many seeking out our "excellent" products, and sales steadily rising across the area.\n\nIt seems all our prodding and hawking has pulled at just the right purse-strings!"
 gdp_merchant_trade_opportunity.0012.a: "We won't waste this opportunity."
 gdp_merchant_trade_opportunity.0012.b: "I can already smell the [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]!"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "It is becoming clear that all our efforts to draw in customers, with admittedly somewhat embellished accounts of the quality of our goods, have not had the desired effect...\n\nSales are, if anything, falling, and demand for [trade_good_type.GetNameNoTooltip|l] across [target_title.GetBaseNameNoTierNoTooltip] seems to be drying up as trust among buyers falls."
 gdp_merchant_trade_opportunity.0013.a: "But these #EMP are#! the finest [trade_good_type.GetNameNoTooltip|l]!"

 gdp_merchant_trade_opportunity.0021.t: "Encourage Investment: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "Wandering [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] highlights the many shortcomings of its infrastructure, from the quality of roads, to the paltry storage facilities, to the [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l] itself.\n\nThe local rulers must be made to see the outweighed benefits of a little investment. Failing that, if we are to make the most of our connections here, we will have to do it ourselves..."
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "Deftly diagnosing the shortcomings of [target_title.GetAdjectiveNoTooltip] infrastructure, and the benefits to be gained by its improvement, has won us the attention of the right people.\n\nSeeds yet begin to bear fruit, as it seems [local_ruler.GetTitledFirstName] has been won over, and works are set to begin. With the flow of trade set to increase, local traders and townsfolk already tentatively congratulate us."
 gdp_merchant_trade_opportunity.0022.a: "If you want something done, do it yourself."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "Our attempts to convince those here of the myriad shortcomings of [target_title.GetAdjectiveNoTooltip] infrastructure have had yielded embarrassingly few results, and it seems unlikely we will have these fool's ears.\n\nBlunder after blunder will leave things in much the same state as we found them, with only bemused local officials and traders to show for our toil, unless we take matters into our own hands..."
 gdp_merchant_trade_opportunity.0023.a: "The trade must flow, one way or another."
 gdp_merchant_trade_opportunity.0023.b: "The locals are fools..."

 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "Misfortune's scars are plain to see in the [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] of [local_market.GetShortName], whose boarded and abandoned shops speak to the stymied flow of trade after the exodus of traders in these trying times.\n\nHowever, they must learn that hand-wringing and flight do little for commerce, and peace is never guaranteed. It falls to us to bring order, and fill their empty shoes."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: Success"
 gdp_merchant_trade_opportunity.0032.desc: "Peeping out from behind shuttered doors, the inhabitants of [target_title.GetBaseNameNoTierNoTooltip] quickly understood our purpose, and we have swiftly cemented a firm grip on the market and hoardings.\n\nThose who have lost out in this re-adjustment have been forced to begrudgingly accept the benefits of restored order and the slow rejuvenation of trade."
 gdp_merchant_trade_opportunity.0032.a: "It is just good business..."
 gdp_merchant_trade_opportunity.0032.b: "Our work here is done."
 every_county_province_custom: "Every $recently_looted_modifier$ [holding|E] in [saved_county.GetName]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: Failure"
 gdp_merchant_trade_opportunity.0033.desc: "Our aggressive presence in [target_title.GetBaseNameNoTierNoTooltip], and attempts to nudge its residents towards our ends, has been met with widespread hostility and a stubborn refusal to cooperate.\n\nThe populace and local traders have banded together against us, viewing the imposition of our dominance as far too high a price to pay for the restoration of order and commerce!"
 gdp_merchant_trade_opportunity.0033.a: "Stubborn fools!"

 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "The [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] of [local_market.GetShortName] harbor a litany of artisanal groups, whose closely-guarded numbers produce everything from rope to silverware to meet the needs of locals and buyers.\n\nWith the right introductions, we might access these networks of skilled craftspeople, build a reputation as patrons here, and perhaps learn of some profitable methods or trends."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: Success"
 gdp_merchant_trade_opportunity.0042.desc: "Our coin has built fruitful connections in [target_title.GetBaseNameNoTierNoTooltip], funding talented craftspeople of all stripes, their members quietly toiling away at items both humble and marvelous.\n\nBeing known as patrons brings warm welcome in all quarters, and the attention of a much discussed local artisan, [inspired_artisan.GetFirstName], who seeks funding for the production of [inspired_artisan.Custom('InspirationArtisanType')]."
 gdp_merchant_trade_opportunity.0042.a: "Our investments have achieved their aim."
 gdp_merchant_trade_opportunity.0042.b: "We cannot miss this opportunity!"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: Failure"
 gdp_merchant_trade_opportunity.0043.desc: "Our efforts to access the networks of the local [target_title.GetBaseNameNoTierNoTooltip] artisans have been rebuffed at each turn, our coin and interests begrudgingly accepted, and with little gratitude.\n\nWas our reputation soured by some misunderstanding, the manipulation of our rivals, or simply having the gall to stick our noses in? We may never know..."
 gdp_merchant_trade_opportunity.0043.a: "Pah, their wares were rubbish anyway..."

 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "The [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] of [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] pulse with the call of lucre, palpable in every look and gesture. The place calls out for our coin, drawing soon-to-be clients, powerless to refuse its promise.\n\nIt's far easier to find takers of [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] than givers, but we must be discerning. We bait our lines for the great and good of [local_market.GetShortName] in mind, and a worthy catch requires guile and patience."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: Success"
 gdp_merchant_trade_opportunity.0052.desc: "Having put the word about [target_title.GetBaseNameNoTierNoTooltip] of our open lines of financing, it wasn't long at all before we received a curiously humble invitation, and from [debtor.GetTitledFirstName], no less.\n\nIt appears the good [debtor.Custom('LadyLordWomanMan')] requires some "flexibility" in [debtor.GetHerHis] accounts. Far be it from mere merchants to question the means of one so esteemed..."
 gdp_merchant_trade_opportunity.0052.a: ""Let's adjust the ledgers here... #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip] of [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...#!""
 gdp_merchant_trade_opportunity.0052.b: ""I'm afraid it won't be possible at this time, my [debtor.GetLadyLord].""
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: Failure"
 gdp_merchant_trade_opportunity.0053.desc: "After spreading word of our open lines of financing, we have little to show for it. Our generous offers have been roundly rebuffed by the local notables of [target_title.GetBaseNameNoTierNoTooltip].\n\nWhether we mishandled our dealings, other merchant's business interfered, or the region's potentates are simply enjoying some rare season of wide prosperity, is hard to tell."
 gdp_merchant_trade_opportunity.0053.a: "No matter, they'll come crawling back. They always do..."
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], comes bearing interesting news. [market_owner.GetName] is in need of [trade_good_type.GetNameNoTooltip|l] and is looking for a merchant to provide [market_owner.GetHerHim] with a large shipment.\n\nThe boastful [task_contract_target.GetTitledFirstName] of the [task_contract_target.GetHouse.GetBaseName] company have proudly proclaimed that [task_contract_target.GetSheHe] will without a doubt be successful in closing the deal. With cunning and guile I believe we could outbid them and put them in their place."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: Success"
 gdp_merchant_trade_opportunity.0062.desc: "Our subtle attempts to intersect [target_title.GetNamePossessive] trade have worked in our favor. When the day of the bidding war came to be, all [target_title.GetHolder.GetTitledFirstName] could do was look on in shock and horror as we claimed victory in their stead.\n\nThe reputation of [target_title.GetNameNoTooltip] has been severely damaged, and we would be wise to use this power vacuum to our best advantage."
 gdp_merchant_trade_opportunity.0062.a: "All according to plan..."
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: Failure"
 gdp_merchant_trade_opportunity.0063.desc: "Despite our efforts to use subterfuge, [target_title.GetHolder.GetTitledFirstName] has bested us once more. With shame we had to admit a crushing defeat against [target_title.GetNameNoTier].\n\nWe might never know the cause of our misstep: Did pride get the best of us or was it perhaps a lack of financial finesse? For now, all we know is that we came out on the losing end with heavy heads and empty pockets."
 gdp_merchant_trade_opportunity.0063.a: "We will get them next time..."
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], examines a consignment of [trade_good_type.Custom('GetTradeGood')], poring over the [trade_good_type.Custom('GetTradeGoodUnitPlural')] in search of any blemish from mishandling, checking each fastening.\n\nA good is not always used to its fullest potential, and may be squandered by neglect or ignorance. From the lowest peddler to the loftiest bulk-trader, much can be learned."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: Success"
 gdp_merchant_trade_opportunity.0072.desc: "Flitting between the [destination.Custom('GetProvinceAdjective')] stalls of [destination.GetTitle.GetNameNoTierPossessiveNoTooltip] busy [destination.Custom('GetRegionalMarketTermGloss')] and its hushed halls of commerce, we have picked up many tidbits, tales, and tips in the art of [trade_good_type.Custom('GetTradeGood')] trading.\n\nFrom storage and transport of [trade_good_type.Custom('GetTradeGoodUnitPlural')], to seasonal demand and appraisal of quality, our learnings are sure to benefit our commerce in [local_market.GetName|l] and beyond."
 gdp_merchant_trade_opportunity.0072.a: "Who knew [trade_good_type.Custom('GetTradeGood')] could be so nuanced?"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: Failure"
 gdp_merchant_trade_opportunity.0073.desc: "We spent countless days and interminable hours trudging between the [destination.Custom('GetProvinceAdjective')] stalls of [destination.GetTitle.GetNameNoTierPossessiveNoTooltip] busy [destination.Custom('GetRegionalMarketTermGloss')] and its hushed halls of commerce, but seem to be no wiser in the art of [trade_good_type.Custom('GetTradeGood')] trading.\n\nThe taciturn peddlers and dismissive brokers rarely responded to our questions with more than bemused scorn or guarded silence, and the tidbits that were shared were trivial or unnecessarily tangled. "
 gdp_merchant_trade_opportunity.0073.a: "Bah, we don't need their help!"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], rolls [contract_employer.GetHerHis] eyes as we bemoan [contract_target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] latest exploits in [market.GetName|l].\n\nSomething must be done about that [contract_target.GetTitledFirstName], and [contract_target.GetHerHis] support from [contract_target.GetSuzerain.GetTitledFirstName], if we are not to be left in the dust..."
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: Success"
 gdp_merchant_trade_opportunity.0082.desc: "Our tireless efforts cajoling middle-men and casting aspersions on [target_title.GetDefinitiveName|l] and their blasted charter seem to have borne fruit, and many now think twice before accepting [target_title.GetHolder.GetTitledFirstNamePossessive] word at face value.\n\nEven the veracity of [target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive] seal on [target_title.GetHolder.GetTitledFirstNamePossessiveNoTooltip] papers has been called into question, word of which will surely not fall on happy ears in either quarter."
 gdp_merchant_trade_opportunity.0082.a: "To [ROOT.Char.GetRite.NegativeAfterLife] with their papers!"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: Failure"
 gdp_merchant_trade_opportunity.0083.desc: "Our tireless networking and scheming against the accursed agents of the [target_title.GetDefinitiveName|l] has all been for naught, with few willing to contemplate our approaches in the face of a charter bearing [target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive] own seal.\n\n[target_title.GetHolder.GetTitledFirstNamePossessive] reputation remains unblemished as ever, and we have only sullied our own name by stooping to such lows..."
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName] still smiles on the [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]..."
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0091.desc: "As my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName] and I wander the overcast [destination.Custom('GetRegionalMarketTermGloss')], the ill state of [destination.GetBaronyNameExplicitlyNoTooltip], brought about by the vagaries of war and famine, is plain to see.\n\nA worrying number of beggars, be they widows, orphans, or cripples, crowd the alleys, and a doom hangs over the deserted stalls like a second curtain of cloud."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: Success"
 gdp_merchant_trade_opportunity.0092.desc: "Working our way across the area, we have managed to find the local peddlers and tradespeople still in business despite the"
 gdp_merchant_trade_opportunity.0092.war: "depredations of war,"
 gdp_merchant_trade_opportunity.0092.disaster: "nearness of calamity,"
 gdp_merchant_trade_opportunity.0092.epidemic: "recent disease outbreaks,"
 gdp_merchant_trade_opportunity.0092.closing: "and even restored some vigor to their account books. Though small, every effort helps.\n\nDay by day, the [destination.Custom('GetRegionalMarketTermGloss')] of [destination.GetBaronyNameExplicitlyNoTooltip] seems to echo with a few more voices, its stalls glister with a few more goods, and its inns fill with a few more visitors.\n\nDay by day, the market of [destination.GetBaronyNameExplicitlyNoTooltip] seems to echo with a few more voices, its stalls glister with a few more goods, and its inns fill with a few more visitors."
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip] will soon prosper again."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: Failure"
 gdp_merchant_trade_opportunity.0093.desc: "We have traveled the length of [destination.GetBaronyNameExplicitlyNoTooltip], searching for opportunities to put coin into the hands of those who can do the most good, and restore the commercial life-blood of the area, but mostly in vain.\n\nThose we find are mostly plain profiteers unworthy of our generosity, or else in no position to do any good. It is hard to maintain any optimism in the face of our setbacks, and we fall into despair and frustration."
 gdp_merchant_trade_opportunity.0093.a: "There is nothing more we can do..."
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], and I, stand in awe, watching the bustling stalls of [destination.GetTitle.GetNameNoTierPossessive] great [destination.Custom('GetRegionalMarketTermGloss')]. Here, the flow of trade is no abstract thing - it is as palpable as the [ROOT.Char.Custom('GroundType')] underfoot.\n\nIn such a place, teeming with merchants each striving to make deals like ourselves, how could we fail to find advantage or favor?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: Success"
 gdp_merchant_trade_opportunity.0102.desc: "The last weeks have been spent in constant motion, rushing across [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] each day in pursuit of meeting and in search of contacts, but by shrewd diplomacy and shrewder business, we have built a healthy book of agreements with local brokers and middlemen.\n\nIt is clear our effort has not been in vain, and our work here has put us in good stead for the coming season."
 gdp_merchant_trade_opportunity.0102.a: "May our seeds bear fruit!"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: Failure"
 gdp_merchant_trade_opportunity.0103.desc: "Despite all of our attempts to ingratiate ourselves with local brokers and middlemen, crossing the breadth of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] each day in pursuit of meetings and in search of contacts, we are left no better than we begun.\n\nThis certainly spells some trouble for the ensuing season..."
 gdp_merchant_trade_opportunity.0103.a: "By [ROOT.Char.GetRite.WealthGodName]..."
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: Success"
 gdp_merchant_trade_opportunity.0112.desc: "We have worked diligently, casting our net across the city of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], seeking the points to grant a favor or apply a bribe. At the quick, our hopes were at last confirmed by a few favorable auctions and agreements, and the health of routes secured.\n\nWe can sit back peacefully, safe in the knowledge our work has guaranteed a steady flow of goods, and for some time to come."
 gdp_merchant_trade_opportunity.0112.a: "[ROOT.Char.GetRite.WealthGodName] smiles on us!"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: Failure"
 gdp_merchant_trade_opportunity.0113.desc: "All of our diligent work, casting our net across the city of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], seeking the points to grant a favor or apply a bribe, have been fallen to nought, swallowed like a raindrop in this roiling sea of commerce.\n\nIt is clear we have no way to secure the caravan space required to fulfill our desired quotas, and won't do for some time..."
 gdp_merchant_trade_opportunity.0113.a: "What is a trader, without a caravan..."
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], and I walk through the entrepôt of [destination.GetBaronyNameExplicitly], a hub of sale and resale, where merchants of all stripes cross paths, passing goods to destinations unknown and far-flung.\n\nIn such a place, with so many commodities changing hands, it is deals of scale, trading on bulk price, which makes or breaks a merchant's fortunes..."
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: Success"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nSomehow, we emerge from the vipers nest intact, and with a healthy book of promissory notes, ensuring competitive sale prices on [trade_good_type.Custom('GetTradeGoodUnitPlural')] of [trade_good_type.Custom('GetTradeGood')] in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] for the coming season!"
 gdp_merchant_trade_opportunity.0122.intro: "The days have been a blur of endless haggling, wrangling, and cajoling, my eyes darting between flapping tongues and gnashing teeth as prices are squawked across auction yards, [ROOT.Char.Custom('GroundType')] littered with discarded chits, scrawlings, and lost fortunes."
 gdp_merchant_trade_opportunity.0122.a: "It is a buyer's market!"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: Failure"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nWe emerge from the vipers nest battered and exhausted, bereft of the guaranteed [trade_good_type.Custom('GetTradeGood')] sale prices we had sought to secure, and outbid by our rivals..."
 gdp_merchant_trade_opportunity.0123.a: "It is a seller's market..."
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$: Success"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nSomehow, we emerge from the vipers nest intact, and with a healthy book of promissory notes, ensuring competitive purchase price for [trade_good_type.Custom('GetTradeGoodUnitPlural')] of [trade_good_type.Custom('GetTradeGood')] in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] for the coming season!"
 gdp_merchant_trade_opportunity.0132.a: "It is a seller's market!"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: Failure"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nWe emerge from the vipers nest battered and exhausted, bereft of the guaranteed [trade_good_type.Custom('GetTradeGood')] purchase prices we had sought to secure, and outbid by our rivals..."
 gdp_merchant_trade_opportunity.0133.a: "It is a buyer's market..."


 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "It is perhaps only fair that [task_contract_target.GetTitledFirstName] takes a portion of the sales in [local_market.GetName|l], as keeper of the peace and upholder of the law.\n\nHowever, there is #EMP always#! room for negotiation. We need only make [task_contract_target.GetHerHim] see the value of our routes, and explain the burden [task_contract_target.GetSheHe] places on our poor backs..."
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: Success"
 gdp_merchant_trade_opportunity.0142.desc: "These have been long days of cajoling, flattering, and exhorting in the halls of [task_contract_target.GetTitledFirstName], and our cheeks still sting from smiling, but our efforts were not in vain.\n\nWe have secured a reduced toll rate, ensuring better margins for some time to come."
 gdp_merchant_trade_opportunity.0142.a: "It is the cost of good business."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: Failure"
 gdp_merchant_trade_opportunity.0143.desc: "After so many long days of cajoling, flattering, and exhorting in the halls of [target.GetTitledFirstName], our cheeks stinging from smiling and legs weak from standing, we must return with nothing to show for labors...\n\nToday, as we awaited an audience, the [target.GetTitleAsNamePossessiveNoTooltip] guards primly explained that [target.GetSheHe] regrettably could not help us, and had urgent matters to attend to..."
 gdp_merchant_trade_opportunity.0143.a: "But [target.GetSheHe] seemed so pliable..."

 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "The factors and collectors of [local_market.GetName|l] swan about the place. These jackals jeer with sacks of [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] jangling at their sides, each filled with the honestly earned gold shaken from decent merchants' pockets, like [associate.GetFirstName] and I...\n\n[owner.GetTitledFirstNamePossessive] tolls are the bane of business here, and [owner.GetHerHis] greed has forced us to underhanded business."
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: Success"
 gdp_merchant_trade_opportunity.0152.desc: "After much hard-work, we have established good contacts among the local ne'er-do-wells and secured reliable #EMP alternative#! routes for goods coming out of [trade_market.GetName|l].\n\nCrate by crate, with each shipment that passes under the guards' credulous noses, the savings will soon stack up..."
 gdp_merchant_trade_opportunity.0152.a: "It is #EMP our#! money to keep."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: Failure"
 gdp_merchant_trade_opportunity.0153.desc: "Our efforts to establish a smuggling ring in [trade_market.GetName|l] have been foiled at every turn, by the incompetence of our agents, the vigilance of the local authorities, and the dishonesty of local ne'er-do-wells...\n\nWe have no choice but to continue paying, and for all our hard work have only sullied our own reputation as honest brokers."
 gdp_merchant_trade_opportunity.0153.a: "We should have just paid the tolls..."

 gdp_merchant_trade_opportunity.1001.t: "Greasing the Wheels"
 gdp_merchant_trade_opportunity.1001.desc: "Our [task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip] contacts have been displaying uncharacteristic reticence in their dealings and it has become clear the local ruler, [local_ruler.GetTitledFirstName], lies at the heart of it.\n\nSure enough, we soon receive word from the great [local_ruler.GetWomanMan] [local_ruler.GetHerselfHimself], demanding a "#EMP taste of the prospects#!" in [local_ruler.GetHerHis] lands..."
 gdp_merchant_trade_opportunity.1001.a: "#weak *sigh*#! Give the [local_ruler.GetWomanMan] [local_ruler.GetHerHis] [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]..."
 gdp_merchant_trade_opportunity.1001.b: "Surely an #EMP esteemed#! mind will understand our situation."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip] is charmed"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip] is irked"
 gdp_merchant_trade_opportunity.1001.c: ""You know, [other_merchant.GetPrimaryTitle.GetNameNoTooltip|l] #EMP really#! takes liberties.""
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] takes the bait"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] takes umbrage"
 gdp_merchant_trade_opportunity.1001.d: "Pah, we can get by."
 gdp_merchant_trade_opportunity.1011.t: "Mutual Munificence"
 gdp_merchant_trade_opportunity.1011.desc: "Our dealings in [local_market.GetShortName] seem to have caught the eye of the local ruler, [local_ruler.GetTitledFirstName], who has summoned the company to a private audience.\n\nAs I stand before [local_ruler.GetHerHim], the [local_ruler.GetTitleAsNameNoTooltip] smiles. "Trade brings great benefits; to the people, to the nobles, to all [local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Share with me your troubles, and I shall do what I can.""
 gdp_merchant_trade_opportunity.1011.a: "#weak *ahem*#! "The routes have been #EMP very#! tough, your eminence...""
 gdp_merchant_trade_opportunity.1011.b: ""I do have some ideas for the local [task_contract_location.Custom('GetRegionalMarketTerm')|l].""
 gdp_merchant_trade_opportunity.1011.b.good: "Your advice is sound"
 gdp_merchant_trade_opportunity.1011.b.bad: "Your advice is rubbish"
 gdp_merchant_trade_opportunity.1011.c: ""[other_merchant.GetPrimaryTitle.GetNameNoTooltip] make things very difficult.""
 gdp_merchant_trade_opportunity.1011.c.fallback: ""The competition make things very difficult.""
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] backs you"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] backs the [other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "A popularity contest based on [diplomacy_i|E][diplomacy|E] and [opinion_i|E][opinion|E]"
 gdp_merchant_trade_opportunity.1011.d: ""Bless you, and your benevolent rule, great [local_ruler.GetTitleAsNameNoTooltip].""
 gdp_merchant_trade_opportunity.1021.t: "Competitor in Common"
 gdp_merchant_trade_opportunity.1021.desc: "Consumed by those curs in [target.GetPrimaryTitle.GetName], I am taken off-guard by the approach of [other_merchant.GetTitledFirstName] of [other_merchant.GetPrimaryTitle.GetName], another competitor in the [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] of [local_market.GetShortName].\n\n"Well met [ROOT.Char.GetTitledFirstNameNoTooltip]," [other_merchant.GetSheHe] offers, "I have heard of your troubles with that [target.GetHouse.GetNameNoTooltip] huckster, [target.GetTitledFirstName]. Perhaps we can help each other?"" 
 gdp_merchant_trade_opportunity.1021.a: ""Very good! Here's the plan...""
 gdp_merchant_trade_opportunity.1021.b: ""How do I know you are to be trusted?""
 gdp_merchant_trade_opportunity.1021.b.good: "You come to an arrangement"
 gdp_merchant_trade_opportunity.1021.b.bad: "You come to blows"
 gdp_merchant_trade_opportunity.1021.c: ""Together, we can make it very hard for them.""
 gdp_merchant_trade_opportunity.1021.d: ""Never! You [other_merchant.GetHouse.GetNameNoTooltip] types are even worse!""
 gdp_merchant_trade_opportunity.1031.t: "Trade Secret"
 gdp_merchant_trade_opportunity.1031.desc: "While combing over some company records in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], a few leaves of paper shake free, fluttering to the ground. I stoop to collect them, and turn to find my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], scowling haltingly.\n\nScanning the documents, my eyebrow can't help but rise, as the reason for [associate.GetHerHis] distress becomes clear. [associate.GetFirstNameNoTooltip] has been hiding information vital to our business here! And all out of spite?"
 gdp_merchant_trade_opportunity.1031.a: ""Dammit [associate.GetFirstNameNoTooltip]! Where do your loyalties lie?""
 gdp_merchant_trade_opportunity.1031.b: ""Come, what is your grievance?""
 gdp_merchant_trade_opportunity.1031.c: ""#EMP OUT!#! You no longer serve this company's purposes!""
 gdp_merchant_trade_opportunity.1041.t: "A Family Effort"
 gdp_merchant_trade_opportunity.1041.desc: "Spirits are high, and talk around the company ever returns to recent successes in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], which by chance have all been led by my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName].\n\n[associate.GetHerHis|U] praises are being sung as a veritable genius of commerce, but of course in truth each venture has relied on the hard work of many hands and tongues across the [ROOT.Char.GetHouse.GetNameNoTooltip] network."
 gdp_merchant_trade_opportunity.1041.a: "Great work, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1041.b: "Clearly we haven't been working you hard enough."
 gdp_merchant_trade_opportunity.1041.c: "Your efforts are incredible, an example to us all!"
 gdp_merchant_trade_opportunity.1051.t: "Seeking Settlement"
 gdp_merchant_trade_opportunity.1051.desc: "As I walk through the [task_contract_location.Custom('GetRegionalMarketTermGloss')], our competitor [target.GetTitledFirstName] of [target.GetPrimaryTitle.GetName] suddenly appears before me, [target.GetHerselfHimself]! Though it must be said, [target.GetHerHis] deference takes me somewhat off-guard.\n\n"Look, [ROOT.Char.GetTitledFirstNameNoTooltip]," [target.GetSheHe] sighs, "I'll be plain: our interests here are at odds, and nothing good will come of us locking horns. I ask that you desist, and "
 gdp_merchant_trade_opportunity.1051.desc.gold: "I will pay you in coin for your troubles.""
 gdp_merchant_trade_opportunity.1051.desc.luxury: "in return I'll give you a tip on a wondrous acquisition in a far-off land.""
 gdp_merchant_trade_opportunity.1051.a: ""You speak truth. Very well, I accept.""
 gdp_merchant_trade_opportunity.1051.b: ""There is something here... let's negotiate.""
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip] acquiesces"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip] refuses"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName] will host a [GetActivityType('activity_feast').GetName] [activity|E] in your honor"
 gdp_merchant_trade_opportunity.1052.t: "Feast Invalidated"
 trade_opportunity_gain_luxury_contract_tt: "You will receive a [luxury_contract|E]"
 gdp_merchant_trade_opportunity.1051.d: ""Ha, business must #EMP truly#! be bad! Not a chance.""
 gdp_merchant_trade_opportunity.1061.t: "Stretched Thin"
 gdp_merchant_trade_opportunity.1061.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], has been complaining that, by focusing efforts on completing our business in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], our ability to keep up the daily flow of the [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] has been faltering.\n\n"Something has to give, [ROOT.Char.GetTitleAsNameNoTooltip], there is simply not enough time in a day and not enough hands at the company to keep a grip on things here if we continue like this.""
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] does not balk at a challenge!"
 gdp_merchant_trade_opportunity.1061.a.good: "Everything stays on track"
 gdp_merchant_trade_opportunity.1061.a.bad: "You over-exert yourself"
 gdp_merchant_trade_opportunity.1061.b: "Profits will not dip on my watch."
 gdp_merchant_trade_opportunity.1061.already_tt: "Already gained: [associate.GetShortUIName] #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! [stress|E], [scheme|E] #P +1#! [scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 gdp_merchant_trade_opportunity.1071.t: "Bottle Neck"
 gdp_merchant_trade_opportunity.1071.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], paces interminably, [associate.GetHerHis] temper further frayed by a lazily buzzing fly. "Gah!", [associate.GetSheHe] moans, "Look here [ROOT.Char.GetTitleAsNameNoTooltip], your work here in [task_contract_location.GetBaronyNameExplicitlyNoTooltip] is straining my resources!"\n\nPeering closely at the chits and ledgers, it is hard to argue with [associate.GetHerHim]. [associate.GetSheHe|U] sighs, "We will just have to compromise, or our office here will begin collapse under this strain...""
 gdp_merchant_trade_opportunity.1071.a: "We are committed to a singular goal."
 gdp_merchant_trade_opportunity.1071.d: "Leave this matter to me, and focus on your own tasks."
 gdp_merchant_trade_opportunity.1081.t: "In Good Hands"
 gdp_merchant_trade_opportunity.1081.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], has been handling most of the details of our present business in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], and it shows! [associate.GetFirstName] clearly possesses all the attention to detail and other qualities of a skilled trader.\n\nSince our work here began, I have scarcely needed to check a ledger or follow up on a command."
 gdp_merchant_trade_opportunity.1081.a: "Keep up the good work, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1081.b: "Such initiative should be rewarded."
 gdp_merchant_trade_opportunity.1081.c: "All the company must look to this example!"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip] sets example"
 gdp_merchant_trade_opportunity.1081.c.trigger: "Any other [associate|E] has less than [stewardship_i|E][EmptyScope.ScriptValue('medium_skill_rating')|V0]"
 gdp_merchant_trade_opportunity.1081.c.tt: "Another [associate_possessive|E] [stewardship|E] increases by [stewardship_i|E]#P 1#!"
 gdp_merchant_trade_opportunity.1081.d: "[ROOT.Char.GetHouse.GetNameNoTooltip] people are the best people, naturally."
 gdp_merchant_trade_opportunity.1091.t: "An Artless Associate"
 gdp_merchant_trade_opportunity.1091.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], has taken the reins of our current dealings in [task_contract_location.GetBaronyNameExplicitlyNoTooltip], though one now rather wishes [associate.GetSheHe] hadn't...\n\nEach day it seems I discover some sum lazily mis-totted, or have to suffer the complaints of a contact left needlessly awaiting word. Business cannot be conducted so sloppily!"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], let's go over the books."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip] learns a thing or two"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip] is a hopeless case"
 gdp_merchant_trade_opportunity.1091.c: "The company will have to take up the slack."
 gdp_merchant_trade_opportunity.1091.d: "[associate.GetSheHe|U] is doing [associate.GetHerHis] best, I suppose."
 gdp_merchant_trade_opportunity.1101.t: "Seed Capital"
 gdp_merchant_trade_opportunity.1101.desc: "Loans can be a venture for those with [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] to spare and patience to bide their time. As it goes, an eager investor has requested to meet in [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nI am greeted by [investor.GetTitledFirstName],"
 gdp_merchant_trade_opportunity.1101.ruler: "a local ruler in [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.1101.courtier: "the courtier of some local noble."
 gdp_merchant_trade_opportunity.1101.adventurer: "a worldly type with a train of followers."
 gdp_merchant_trade_opportunity.1101.fallback: "a [investor.GetWomanMan] of no background."
 gdp_merchant_trade_opportunity.1101.end: ""Well met, [ROOT.Char.GetTitledFirstNameNoTooltip]!" [investor.GetSheHe|U] smiles eagerly. "I would be [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip|l] willing sponsor. And what I expect in return? Well, let us not worry about that now.""
 gdp_merchant_trade_opportunity.1101.a: "You can rely on us, [investor.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.1101.c: "A little more would go far, vouchsafed on my honor."
 gdp_merchant_trade_opportunity.1101.d: "Flattered, but we are keeping things lean at this time."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName] will call to collect [gold_i|E][interest|0V] (#M 20% interest#!) in #V 5#! years"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "It is at last time for me to collect the fruits of my investment with your esteemed trading company.\n\nI patiently await receipt of my [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]."
 gdp_merchant_trade_opportunity.1102.a: "Very good, may the funds find you well."
 gdp_merchant_trade_opportunity.1102.b: "Ah - let's see. It has been a dry period [investor.GetFirstNameNoTooltip]..."
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip] accepts your excuses"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip] senses a rat"
 gdp_merchant_trade_opportunity.1102.d: "You have no investments with us, that is the end of it."
 
 gdp_merchant_trade_opportunity.9000.t: "Pressing Business in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9000.desc: "With that matter settled, there is other business calling our attention here in [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l].\n\nShall we put our affairs in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] in order, before beginning our journey back to [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]?"
 gdp_merchant_trade_opportunity.9000.a: "This should be looked at."
 gdp_merchant_trade_opportunity.9000.b: "Let us settle this one."
 gdp_merchant_trade_opportunity.9000.c: "I shall see to this matter."
 gdp_merchant_trade_opportunity.9000.d: "No, we are needed back in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
