 gdp_merchant_trade_opportunity.9050.desc_opening: "A promising prospect has soured.\n\nThe trade opportunity in [trade_destination.GetBaronyNameExplicitlyNoTooltip], the very purpose of our journey, is lost to us."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\nThe only question now is whether there is even any point in continuing down this ill-omened path."
