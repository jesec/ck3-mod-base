l_english:

 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "Government Overthrown"
 overthrow_government_outcome.1001.desc: "The conspiracy has reached its climax. It is now or never. Key agents have been placed in the barracks of the city watch, the Assembly, and the palace. On my order, they will seize the levers of power, ensuring that the old regime can be swept aside.\n\nTomorrow the Assembly will have no choice but to recognize my regime and condemn my opponents as Enemies of the State."
 overthrow_government_outcome.1001.a: "No blood. No exiles."
 overthrow_government_outcome.1001.b: "My personal enemies."
 overthrow_government_outcome.1001.c: "Everyone that opposes us has to go."
 
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "The Republic Stands"
 overthrow_government_outcome.1002.desc: "A conspiracy among my patricians has come to light, orchestrated by that rogue [owner.GetShortUINameNoTooltip]. Luckily, the coup was quickly dashed against the rock of my glorious government!\n\nThe rogues attempted to seize my august person, but my guards repelled their attempt. The Assembly and the military are still loyal to me, despite their foul efforts."
 overthrow_government_outcome.1002.a: "Have them seized!"
 overthrow_government_outcome.1002.b: "I will deal with them in time."
 overthrow_government_outcome.1002.c: "I will find it in my heart to forgive."
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName] and [owner.GetHerHis] [agents|E] are absolved of their [criminal|E] status and are no longer Enemies of the State"

# OVERTHROWN (Target) 
 overthrow_government_outcome.1003.t: "Overthrown"
 overthrow_government_outcome.1003.desc: ""My lord!" [craftsman_character.GetShortUINameNoTooltip] shouts as [craftsman_character.GetSheHe] bursts through the door, looking like [craftsman_character.GetSheHe] has been running for [craftsman_character.GetHerHis] life.\n\n"Conspiracy! Treason! [owner.GetShortUINameNoTooltip] has gathered sympathizers and moved to have the Assembly condemn you as an enemy of the state! Thugs are on their way!"\n\n[craftsman_character.GetSheHe|U] paces the room like a caged animal. "What should we do?" [craftsman_character.GetSheHe] asks."
 overthrow_government_outcome.1003.b.desc: ""My lord!" [craftsman_character.GetShortUINameNoTooltip] shouts as [craftsman_character.GetSheHe] bursts through the door, looking like [craftsman_character.GetSheHe] has been running for [craftsman_character.GetHerHis] life.\n\n"Conspiracy! Treason! [owner.GetShortUINameNoTooltip] has gathered sympathizers and moved to have the Assembly proclaim a new government. The word on the street is that you have been deposed, but that the new government has pardoned all their political enemies."\n\n[craftsman_character.GetSheHe|U] looks at me, crestfallen. "What should we do?" [craftsman_character.GetSheHe] asks."
 overthrow_government_outcome.1003.a: "I will plead my case before the [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] and the Assembly."
 overthrow_government_outcome.1003.b: "I will go into exile."
 overthrow_government_outcome.1003.c: "I will step away from politics as a humble merchant."
 overthrow_government_outcome.1003.d: "Nothing for now. Such are the tides of politics."

# ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "Enemy of the State"
 overthrow_government_outcome.1004.1.desc:  "I have been declared an enemy of the state!"
 overthrow_government_outcome.1004.2.desc: "\n\nThe proclamation is being posted up in every market square and on every church door. My life and property are in danger."
 overthrow_government_outcome.1004.3.desc: "\n\nI could be arrested at any time!"
 overthrow_government_outcome.1004.councilor.desc: "\n\nNo doubt because of my prominent position on the council of the deposed regime."
 overthrow_government_outcome.1004.personal.desc: "\n\nSince [owner.GetName] sees me as a personal enemy, it is not hard to guess why."
 overthrow_government_outcome.1004.political.desc: "\n\nUndoubtedly because of my position as a powerful patrician and a prominent voice against the new regime's [owner.GetHouse.GetHouseAspiration.GetName] agenda."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nUndoubtedly because of my position as an agent in the conspiracy to overthrow the government."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"

# DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "The Die Has Been Cast"
 overthrow_government_outcome.1005.desc: "There is a tense anticipation in the air as [speaker.GetShortUINameNoTooltip] steps forth and takes the floor before the Assembly.\n\n"Patricians! Long live the Patria and our Republic. It pains me to inform you that our [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] [target.GetFirstNameNoTooltip] has been deposed, on the grounds of corruption and treason against the Republic—"\n\nA wave of exclamations and mutterings sweeps the hall, but a few influential Patricians stand up and applaud.\n\n"By emergency decree, Citizen [owner.GetFirstNameNoTooltip] has stepped in to right the ship of state as our new [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]."\n\nThe applause intensifies as more Patricians stand up."

 overthrow_government_outcome.1005.a: "Long live the Republic!"
 overthrow_government_outcome.1005.b: "Boo! Tyrant! Treason!"
 
 government_overthrow_enemies.1001.b.custom: "The following Patrician become [criminals|E]:\n$EFFECT_LIST_BULLET$Overthrown [liege|E] and [councillors|E]\n$EFFECT_LIST_BULLET$Your [rivals|E] and [nemesis|E]\n$EFFECT_LIST_BULLET$Characters with #N -60#! or less [opinion|E] of you\n$EFFECT_LIST_BULLET$[house_heads|E] with [rivalry|E] [house_relation|E]\n$EFFECT_LIST_BULLET$They might ask for clemency in the [assembly|E] or go into exile\n$EFFECT_LIST_BULLET$[friends|E], [lovers|E], [soulmates|E], and [blood_brothers|E] are excluded"
 government_overthrow_enemies.1001.c.custom: "The following Patrician become [criminals|E]:\n$EFFECT_LIST_BULLET$Any [powerful_vassal|E] with different [house_ambition|E]\n$EFFECT_LIST_BULLET$Overthrown [liege|E] and [councillors|E]\n$EFFECT_LIST_BULLET$Your [rivals|E] and [nemesis|E]\n$EFFECT_LIST_BULLET$Characters with #N -60#! or less [opinion|E] of you\n$EFFECT_LIST_BULLET$[house_heads|E] with [rivalry|E] [house_relation|E]\n$EFFECT_LIST_BULLET$Personal enemies of your [agents|E]\n$EFFECT_LIST_BULLET$They might ask for clemency in the [assembly|E] or go into exile"
 government_overthrow_populace.1001.a.custom: "Every [county|E] in your [realm|E]"
 government_overthrow_populace.1001.a.description: "You offer a blanket pardon for opponents of the new regime."
 
 government_overthrow_forgiven.tt: "You are absolved of your crimes against the state"
 overthrow_government_outcome.tt.success.desc: "You eloquently defend your actions"
 overthrow_government_outcome.tt.success.toast: "You prove that your actions were out of love for the Republic"
 overthrow_government_outcome.tt.failure.desc: "Your speech falls on deaf ears"
 overthrow_government_outcome.tt.failure.toast: "You are booed and removed from the Assembly"

 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip] became a humble merchant"
 overthrow_government_enemy_of_the_state.tt: "The Assembly has named you an Enemy of the State"
 overthrow_government_amnesty.tt: "The Assembly has given a blanket amnesty to all conspirators"
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip] ordered your arrest for your role in conspiring against the state"
 overthrow_government_blanket_pardon.tt: "Government Overthrown: Pardoned"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip] has issued a proclamation of clemency for all [the_new_dodge.GetHerHis] political enemies."

 
