 gdp_visit_holding_decision_event.1340.t: "Down-time in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1340.desc: "The world of commerce can be a tiresome one, and there are only so many deals one can examine, and false smiles one can give, without a good break.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "Here in the tea-house I can leave the troubles of the company behind for a while.\n\nIt is a relief to simply nurse a good steaming cup of fresh tea, passing idle words, news, and gossip, with the local regulars."
 gdp_visit_holding_decision_event.1340.hashish: "Here in the hashish-house I can leave the troubles of the company behind for a while.\n\nIt is a relief to simply sit in the cool and quiet, passing idle words, news, and gossip, with the local regulars."
 gdp_visit_holding_decision_event.1340.drink: "Here in the tavern I can leave the troubles of the company behind for a while.\n\nIt is a relief to sip at a good cup of [ROOT.Char.Custom('RegionalAlcoholicDrink')], passing idle words, news, and gossip, with the local regulars."
 gdp_visit_holding_decision_event.1340.food: "Here in the feast-hall I can leave the troubles of the company behind for a while.\n\nIt is a relief to simply graze at a good spread, nibbling at [ROOT.Char.Custom('FavoriteTreat')], passing idle words, news, and gossip, with the local regulars."
 gdp_visit_holding_decision_event.1340.bath: "Here in the bath-house I can leave the troubles of the company behind for a while.\n\nIt is a relief to simply soak in the restorative waters, passing idle words, news, and gossip, with the local regulars."
 gdp_visit_holding_decision_event.1340.a: "I should do this more often."
