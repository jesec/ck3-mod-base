 gdp_visit_holding_decision_event.1000.t: "Visiting [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] [ROOT.Char.Custom('LocalHoldingTypeCapitalized')]"
 gdp_visit_holding_decision_event.1000.desc: "As the sun rises, so do the inhabitants of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. The morning stillness is promptly superseded by the lively chatter of people going about their daily routines. For the keen observer, opportunities can be found in every corner of these busy streets.\n\nWhere should I turn to seek my fortune today?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "Lessons from the Entrepôt"

 gdp_visit_holding_decision_event.1000.a: "I should head over to the guilds" 
