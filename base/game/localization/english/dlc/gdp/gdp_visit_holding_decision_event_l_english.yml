 gdp_visit_holding_decision_event.1000.c.tt: "A visit to the local market might offer the following opportunities: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "A fine day to take a stroll by the docks."
 gdp_visit_holding_decision_event.1000.e.tt: "A visit to the docks might offer the following opportunities: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
