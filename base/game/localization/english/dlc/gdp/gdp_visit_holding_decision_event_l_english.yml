 gdp_visit_holding_decision_event.1400.t: "Visiting [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] Docks"
 gdp_visit_holding_decision_event.1400.intro: "Down by the busy port of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], dockworkers are diligently unloading cargo in all shapes and sizes."
 gdp_visit_holding_decision_event.1400.asia: "Crates of silk and sacks of tea leaves are carefully handled by calloused hands. Soon they will supply the rest of the known world with its wonders, carried to safety by the djongs over rough seas."
 gdp_visit_holding_decision_event.1400.mena_india: "Amidst the chaos, a merchant is inspecting the cargo of some damaged crates. At the other end of the port crates of spices are carefully sealed to survive the perilous journey across the ocean."
 gdp_visit_holding_decision_event.1400.default: "Sacks of grain and salt are shipped offshore to distant lands. A grandiose oak cog has just anchored and from it, a group of foreign merchants in colorful clothing disembarks."
 gdp_visit_holding_decision_event.1400.outro: "Fresh air fill my lungs and I am eager to see if the winds of fortune are in my favor today.\n\n...Where should I head next?\n\n"
 gdp_visit_holding_decision_event.1400.b: "I should keep an eye out for interesting people."
 gdp_visit_holding_decision_event.1400.b.tt: "Scouting the docks might offer the following opportunity:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "I should have a word with that captain."
 gdp_visit_holding_decision_event.1400.d.tt: "Speak to the captain\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "I should speak with [sea_captain.GetFirstNameNoTooltip] again."
 gdp_visit_holding_decision_event.1400.c.tt: "Leave the docks for now"
