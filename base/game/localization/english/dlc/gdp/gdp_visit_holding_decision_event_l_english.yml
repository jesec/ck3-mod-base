 gdp_visit_holding_decision_event.1336.t: "The Baker"
 gdp_visit_holding_decision_event.1336.desc_intro: "The sweet smell of fresh [ROOT.Char.Custom('FavoriteTreat')] comes from a nearby market stall. Baskets of baked goods are stacked on every available surface.\n\nThe [cook.GetWomanMan] who owns the shop stands to the side with [cook.GetHerHis] head in [cook.GetHerHis] hands. When [cook.GetSheHe] sees me, [cook.GetSheHe] says,"
 gdp_visit_holding_decision_event.1336.desc_named_noble: ""I used to work for [local_noble.GetTitledFirstNameNoTooltip], but now [local_noble.GetSheHe] is 'watching [local_noble.GetHerHis] figure' and has no need for me." [cook.GetSheHe|U] gnaws on [cook.GetHerHis] lips. "Maybe a merchant like yourself could trade these. As for me... there is simply not enough time in the day.""
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: ""The hall will not send for me. I have more than I can possibly sell!""
 gdp_visit_holding_decision_event.1336.desc_returned_01: "The stall still smells of [ROOT.Char.Custom('FavoriteTreat')]. [cook.GetFirstName] is wrapping another bundle for a stranger who did not pay.\n\n[cook.GetSheHe|U] sees me and sighs. "They still have not sent for me. I cannot keep giving it away.""
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Fewer baskets now. [cook.GetFirstName] leans on the counter, flour on [cook.GetHerHis] sleeves, watching the last loaves go.\n\n"If you have a use for a baker," [cook.GetSheHe] says, "say it before the stall is empty.""
 gdp_visit_holding_decision_event.1336.a: ""My company has many mouths to feed.""
