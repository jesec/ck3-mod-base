 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ Steal [gold_i][gold|E] from offerings"
 gdp_visit_holding_decision_event.1000.d: "I think I'm done with today's errands."
 gdp_visit_holding_decision_event.1000.d.tt: "Go back home for now"
 gdp_visit_holding_decision_event.1000.d.changed_mind: ""Actually, I changed my mind.""
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Leave without exploring this [ROOT.Char.Custom('LocalHoldingTypeConcept')]"
 gdp_visit_holding_decision_event.1000.d.exhausted: "Seems there is nothing left to do..."
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Return home. New opportunities will be available after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Your [domicile|E] is currently not in your [merchant_patrons|E] realm"
 gdp_visit_holding_decision_event.1110.t: "Visiting [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] Guilds"
 gdp_visit_holding_decision_event.1110.desc: "The sound of hammer against metal echoes in the alleys of the guilds. Down the street a young apprentice is carrying his master's tools into a pottery workshop. For generations the guildhalls have forged journeymen into skilled masters of their craft. \n\nThe guilds offer a slew of services for any merchant, which of them should I seek out today?"
 gdp_visit_holding_decision_event.1110.a: "One of my artifacts could use some polish."
 gdp_visit_holding_decision_event.1110.a.tt: "A visit to the curator might offer the following opportunity:\n$EFFECT_LIST_BULLET$ Improve your common and masterwork @artifact_icon![artifacts|E]"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "You have used the services of the curator recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "You do not have any common or masterwork [artifacts|E]"
 gdp_visit_holding_decision_event.1110.b: "I'm in the mood for new arms and armor."
 gdp_visit_holding_decision_event.1110.b.tt: "A trip to the blacksmith might offer the following opportunity:\n$EFFECT_LIST_BULLET$ Buy common, masterwork or famed arms and armor @artifact_icon![artifacts|E]"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "You have bought something from the blacksmith recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.c: "I should arrange a meeting with a guild master."
 gdp_visit_holding_decision_event.1110.c.tt: "Meeting with a guild master might offer the following opportunity:$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "You have met with a guild master recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]"
 gdp_visit_holding_decision_event.1110.d: "Maybe I should go somewhere else?"
 gdp_visit_holding_decision_event.1110.d.tt: "Leave the guilds for now"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: The Curator"
 gdp_visit_holding_decision_event.1111.desc: "Stepping into the curator's workshop I am met with fascinating objects from near and far. By a workbench in the back a [curator.GetWomanMan] is hunched over a dagger, engraving the finest of jewels into its hilt. As I inspect one of the trinkets on display [curator.GetSheHe] is broken free of [curator.GetHerHis] concentration\n\n"Ah, a potential customer! How can I be of assistance to [ROOT.Char.GetTitledFirstNameNoTooltip] today?""
 gdp_visit_holding_decision_event.1111.a: "Maybe [artifact_target_1.GetNameNoTooltip] could use the polish."
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName] will gain an improvement"
 gdp_visit_holding_decision_event.1111.b: "Perhaps [artifact_target_2.GetNameNoTooltip] is in need of some love."
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName] will gain an improvement"
 gdp_visit_holding_decision_event.1111.c: "I guess my [artifact_target_3.GetNameNoTooltip] could be better."
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName] will gain an improvement"
 gdp_visit_holding_decision_event.1111.d: "I might have to come back later..."
 gdp_visit_holding_decision_event.1111.d.tt: "Return to the guilds and see what else [THIS.Char.GetCurrentLocation.GetName] has to offer"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: The Blacksmith"
 gdp_visit_holding_decision_event.1112.desc: "As I enter the blacksmiths workshop I can feel the almost unbearable heat of the forge. The smith who was hammering away at a broad sword is abruptly interrupted by my entrance. Wiping an amalgamation of sweat and soot from [blacksmith.GetHerHis] forehead [blacksmith.GetSheHe] turns [blacksmith.GetHerHis] attention to me instead.\n\n"So what do we have here? Is my [ROOT.Char.GetTitleAsNameNoTooltip] in the business of acquiring some of these fine arms and armor today? Best you would ever get in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip].""
 gdp_visit_holding_decision_event.1112.a: "This [arms_armor_artifact_1.GetNameNoTooltip] would be a fine addition."
 gdp_visit_holding_decision_event.1112.b: "Maybe I should buy the [arms_armor_artifact_2.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1112.c: "I could use something like the [arms_armor_artifact_3.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1112.d: "On second thought, maybe not today."
 gdp_visit_holding_decision_event.1112.d.tt: "Head back to the guilds and see what else [THIS.Char.GetCurrentLocation.GetName] has to offer"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: Guild Master Guidance"
 gdp_visit_holding_decision_event.1113.desc: "The meeting with the guild master [guild_master.GetName] has proven fruitful for the [ROOT.Char.GetHouse.GetName] company. In the dusty office among the piles of paper and books hours have suddenly flown by.\n\n[guild_master.GetNameNoTooltip] possesses such a unique insight into [guild_master.Custom('highest_skill_noun')]. [guild_master.GetHerHis|U] speech has both me and my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))] [visiting_associate.GetName] enthralled, eager to learn more."
 gdp_visit_holding_decision_event.1113.a.success: "You and [visiting_associate.GetName] absorbs the new knowledge with ease"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Deciphering ancient manuscripts is not an easy task"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "The equations are too difficult for you and [visiting_associate.GetName] to understand"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Grand diplomatic struggles are too complex to grasp"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "The lesson fall on deaf ears."
 gdp_visit_holding_decision_event.1113.a: ""Perhaps me and [visiting_associate.GetNameNoTooltip] could stay a while longer?""
 gdp_visit_holding_decision_event.1113.a.child: "The lesson will benefit [visiting_associate.GetNamePossessive] education"
 gdp_visit_holding_decision_event.1113.b: ""[visiting_associate.GetFirstNameNoTooltip] could use another lecture on the subject.""
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName] will teach [visiting_associate.GetNameNoTooltip] more on the subject:"
 gdp_visit_holding_decision_event.1113.c: ""Interesting, I will have to write that down right away!""
 gdp_visit_holding_decision_event.1113.c.tt: "[guild_master.GetNamePossessive] knowledge will be useful for the [THIS.Char.GetHouse.GetName] company"
 gdp_visit_holding_decision_event.1113.d: "Enough of [guild_master.Custom('highest_skill_noun')] for today."
 gdp_visit_holding_decision_event.1113.d.tt: "Head back to the guilds and see what else [THIS.Char.GetCurrentLocation.GetName] has to offer"
 gdp_visit_holding_decision_event.1300.t: "Visiting [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] Marketplace"
 gdp_visit_holding_decision_event.1300.asia: "Like all the markets along the great silk road, luxury goods such as jade, silk, and tea are found in abundance here.\n\nIn the midst of the crowded street a man is carefully unloading a cart of delicate porcelain vases. Next to him a foreign trader dressed in colorful clothing peruses the stalls, eager to make a purchase.\n\n"
 gdp_visit_holding_decision_event.1300.mena_india: "Colorful fabrics and patterned ceramics brighten up the otherwise dusky alleyway. Incense and spices fill the air with a welcoming scent.\n\nIn a dark corner a peddler is desperately trying to convince a skeptical passerby to buy his fine quality copper plates. This is an ample time to strike a deal.\n\n"
 gdp_visit_holding_decision_event.1300.default: "The smell of fresh produce intermingles with the aroma of the amassing crowd. Peddlers of the cramped square are involved in a shouting match.\n\n "[ROOT.Char.Custom('RegionalDrink')|U]! Special offer, only today!" "Last chance to buy the finest cut of [ROOT.Char.Custom('RegionalEdibleMeat')]."\n\n"

 gdp_visit_holding_decision_event.monk_hint: "A man leaves the nearby tea parlor with his head hung low, muttering something about ill omens. Apparently, someone is telling fortunes inside."
 gdp_visit_holding_decision_event.monk_hint_return: "The tea parlor is quieter now, but the fortune-telling monk has yet to leave."
 gdp_visit_holding_decision_event.caravaneer_hint: "A procession of weather-beaten caravans fill the street, the local stables struggling to keep up with the latest influx of trade."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "The caravans have not moved on. Their driver is still among the animals, waiting."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\nRumor has it that a particularly experienced captain is taking on passengers on his vessel today."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\nThe sea captain is still taking on passengers, and the crowd around the vessel has not thinned."
 gdp_visit_holding_decision_event.carnival_jester_hint: "I cannot help but overhear a fellow merchant complain about a particular street performer who is stealing the attention of his usual customers."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "The street performer is still holding the crowd, and the nearby merchants look no happier for it."
 gdp_visit_holding_decision_event.cook_hint: "I notice a lot of people walking around with [ROOT.Char.Custom('FavoriteTreat')] in their hands. I overhear one of them saying that there is a baker giving goods away for free."
 gdp_visit_holding_decision_event.cook_hint_return: "The baker has yet to close their stall."

 gdp_visit_holding_decision_event.1300.desc.fallback: "Coins and commodities change hands at a rapid pace. The market is ripe with opportunity."

 gdp_visit_holding_decision_event.1300.a: "I wonder what news the foreign traders bring?"
 gdp_visit_holding_decision_event.1300.a.tt: "Eavesdropping on traders might offer the following opportunity:$gdp_visit_holding_decision_effect_contracts$ "
 gdp_visit_holding_decision_event.1300.a.cooldown.tt: "You have created contracts recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1310_has_created_contract_recently') )]"
 gdp_visit_holding_decision_event.1300.b: "I should keep an eye out for capable new collaborators."
 gdp_visit_holding_decision_event.1300.b.cooldown.tt: "You have attempted to recruit associates recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_recruited_recently') )]"
 gdp_visit_holding_decision_event.1300.b.tt: "Scouting the marketplace might offer the following opportunity:$gdp_visit_holding_decision_effect_recruit$ " 
 gdp_visit_holding_decision_event.1300.c: "Perhaps I should go somewhere else..."
 gdp_visit_holding_decision_event.1300.d: "What fortune lies in store for me?"
 gdp_visit_holding_rare_spawn_alert.tt: "@alert_icon! #alert_trial This character appears rarely and will only show up once per lifetime!#!"
 gdp_visit_holding_decision_event.1300.d.tt: "Speak to the monk\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.d_second: "I will hear [monk.GetFirstNameNoTooltip] out after all."
 gdp_visit_holding_decision_event.1300.c.tt: "Leave the marketplace for now"
 gdp_visit_holding_decision_event.1300.g: "I should have a look at the caravans."
 gdp_visit_holding_decision_event.1300.g.tt: "Speak to the caravaneer\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.g_second: "Those caravans are still waiting."
 gdp_visit_holding_decision_event.1300.h: "That jester is drawing quite a crowd."
 gdp_visit_holding_decision_event.1300.h.tt: "Speak to the jester\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.h_second: "I should catch [carnival_jester.GetFirstNameNoTooltip] before the crowd thins."
 gdp_visit_holding_decision_event.1300.i: "Delicacies... free of charge?"
 gdp_visit_holding_decision_event.1300.i.tt: "Speak to the baker\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.i_second: "That baker is still giving goods away."
 gdp_visit_holding_decision_event.1300.j_tea: "The local tea-house calls..."
 gdp_visit_holding_decision_event.1300.j_hashish: "Time for some hashish I think..."
 gdp_visit_holding_decision_event.1300.j_drink: "The local tavern calls..."
 gdp_visit_holding_decision_event.1300.j_food: "Time for a good meal I think..."
 gdp_visit_holding_decision_event.1300.j_bath: "The local bath house calls."
 gdp_visit_holding_decision_event.1300.j.tt: "Work off some [stress_loss_i][stress|E]"
 gdp_visit_holding_decision_event.1300.j.associate.tt: "[visiting_associate.GetShortUIName] loses [stress|E]"
 gdp_visit_holding_decision_event.1300.j.cooldown.tt: "You have relaxed recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_relaxed_recently') )]"
 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$: Looking for Opportunities"
 gdp_visit_holding_decision_event.1310.desc: "As of late, I have heard a great many tales of foreign beasts and riches. Today, I will scour the marketplace to see if I can find someone who might know more about these rumors.\n\nAmong the traders, I spot a [foreigner.GetWomanMan] with an odd foreign accent proudly boasting of [foreigner.GetHerHis] endeavors in distant lands to a seemingly uninterested local trader. [foreigner.GetSheHe|U] might be a braggart, or maybe there is some truth to [foreigner.GetHerHis] stories? Perhaps a bit of gold could get [foreigner.GetHerHim] talking..."
 spawn_merchant_contract_interaction_duplicate_tt: "You already have an accepted or available [task_contract|E] of this type"
 spawn_merchant_contract_interaction_route_tt: "You have no active [trade_routes|E] with a [trader|E] assigned"
 spawn_merchant_contract_interaction_cooldown_tt: "This type of [task_contract|E] is on cooldown"
 gdp_visit_holding_decision_event.1310.a: "I want to hear more about these exotic creatures."
 gdp_visit_holding_decision_event.1310.a.tt: "Create a [menagerie|E] [luxury_contract_i][luxury_contract|E] on the map"
 gdp_visit_holding_decision_event.1310.b: "I am very curious about procuring those curios."
 gdp_visit_holding_decision_event.1310.b.tt: "Create a [curio|E] [luxury_contract_i][luxury_contract|E] on the map"
 gdp_visit_holding_decision_event.1310.c: "I should invest in the [ROOT.Char.GetHouse.GetNameNoTooltip] company instead"
 gdp_visit_holding_decision_event.1310.c.tt: "Create a [company_purpose|E] [trade_opportunity_i][trade_opportunity|E] on the map"
 gdp_visit_holding_decision_event.1310.d: "I'd rather look somewhere else today..."
 gdp_visit_holding_decision_event.1320.t_market: "$gdp_visit_holding_decision_event.1300.t$: Looking for Recruits"
 gdp_visit_holding_decision_event.1320.t_docks: "$gdp_visit_holding_decision_event.1400.t$: Looking for Recruits"
 gdp_visit_holding_decision_event.1320.desc: "When looking over the crowd, three potential candidates catch my eye!"
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "A crowd gathers, mesmerized by the flash of silver. [ROOT.Char.GetNamePossessive] prestidigitation has them lined up like lambs to the slaughter."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "Clad in well worn armor [ROOT.Char.GetFirstName] leans [ROOT.Char.GetHerHis] brawny frame against a wall, restlessly flipping a dagger."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName] inspects the stands one by one, meticulously noting down details in [ROOT.Char.GetHerHis] compact ledger. "
 gdp_visit_holding_decision_event.1320.traveler.desc: "Dressed in foreign attire, [ROOT.Char.GetFirstName] attempts to mediate a conflict between two traders, in broken [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName] no less!"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName] skulks in the shadows, a bundled-up baby in one arm and [ROOT.Char.GetHerHis] other palm outstretched, looking for the next unwitting mark."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "Hunched beside an injured caravaneer, [ROOT.Char.GetFirstName] quickly fashions a healing poultice from nearby weeds."
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip] seems interesting."
 gdp_visit_holding_decision_event.1320.option.tt: "You might be able to recruit [THIS.Char.GetFirstName] as an [associate|E] by doing the following:"
 gdp_visit_holding_decision_event.1320.no_gold.tt: ""
 gdp_visit_holding_decision_event.1320.option.money.tt: "$BULLET$Pay with @gold_icon![gold|E]"
 gdp_visit_holding_decision_event.1320.charlatan.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Win an @skill_intrigue_icon! [intrigue|E] [skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.hired_muscle.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Win a @skill_prowess_icon![prowess|E] & @skill_martial_icon![martial|E] [skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.numerate.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Win a @skill_stewardship_icon![stewardship|E] [skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.traveler.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Win a @skill_diplomacy_icon![diplomacy|E] [skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.urchin.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Win a @skill_intrigue_icon![intrigue|E] [skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.herbalist.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Win a @skill_learning_icon![learning|E] [skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip] looks promising."
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip] draws my attention."
 gdp_visit_holding_decision_event.1320.d: "No one caught my interest..."
 gdp_visit_holding_decision_event.1320.d.tt: "Go back to the marketplace and see what else [THIS.Char.GetCurrentLocation.GetName] has to offer"
 gdp_visit_holding_decision_event.1320.e: "No one caught my interest..."
 gdp_visit_holding_decision_event.1320.e.tt: "Go back to the docks and see what else [THIS.Char.GetCurrentLocation.GetNameNoTooltip] has to offer."
 gdp_visit_holding_decision_event.1320.tt: "Go back to see if there are any other interesting recruits"
 gdp_visit_holding_decision_event.1321.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$:" 
 gdp_visit_holding_decision_event.1321.t: "The Charlatan"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName] beckons me to come closer. With a sweeping hand gesture [charlatan_recruit.GetSheHe] proclaims:\n\n"Well... looks like we have a volunteer! If you can predict what side this coin will land on you'll be handsomely rewarded."\n\nWith a flick of the wrist [charlatan_recruit.GetSheHe] makes the coin disappear. The crowd awaits my next move in silent anticipation."
 gdp_visit_holding_decision_event.1321.a: "You #EMP clearly#! have a fake coin up your sleeve."
 gdp_visit_holding_decision_event.1321.a.success: "You manage to call the bluff"
 gdp_visit_holding_decision_event.1321.a.failure: "You fail to call the bluff"
 gdp_visit_holding_decision_event.1321.b: "Skillful deception, you should work for me instead."
 gdp_visit_holding_decision_event.1321.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![charlatan_recruit_cost|V0] [gold|E] needed to recruit [charlatan_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1321.c: "I don't have time for tricks..."
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1322.t: "The Rugged Rogue"
 gdp_visit_holding_decision_event.1322.desc: "As I move closer to [hired_muscle_recruit.GetFirstName], I feel [hired_muscle_recruit.GetHerHis] shifty eyes sizing me up.\n\n"Do you not know who you are looking at? I am the undefeated champion of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. You have some gall thinking that a [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] like you could ever take me on in a fight."\n\n[hired_muscle_recruit.GetSheHe|U] raises [hired_muscle_recruit.GetHerHis] fist in a threatening gesture towards me."
 gdp_visit_holding_decision_event.1322.a: " I will make [hired_muscle_recruit.GetHerHim] eat [hired_muscle_recruit.GetHerHis] words!"
 gdp_visit_holding_decision_event.1322.a.success: "You defeat [hired_muscle_recruit.GetFirstName]"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName] beats you"
 gdp_visit_holding_decision_event.1322.b: "Fight for me instead."
 gdp_visit_holding_decision_event.1322.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![hired_muscle_recruit_cost|V0] [gold|E] needed to recruit [hired_muscle_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1322.c: "I think I should leave now..."
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1323.t: "The Numerate Scholar" 
 gdp_visit_holding_decision_event.1323.desc: "With [numerate_recruit.GetHerHis] nose deep in the book [numerate_recruit.GetFirstName] barely notices me until I am really close. [numerate_recruit.GetSheHe|U] looks up at me with a pondering expression.\n\n"Say you look like a capable [ROOT.Char.GetWomanMan], perhaps you could help me solve this little problem of mine?"\n\nThe spread [numerate_recruit.GetSheHe] is holding up before me is carefully filled out with numbers and calculations. It looks like a balance book of stalls profits and expenses."
 gdp_visit_holding_decision_event.1323.a: "See if you move this number here..."
 gdp_visit_holding_decision_event.1323.a.success: "You solve the equation"
 gdp_visit_holding_decision_event.1323.a.failure: "You fail to solve the equation"
 gdp_visit_holding_decision_event.1323.b: "How would you like to do this for #EMP my#! company instead?"
 gdp_visit_holding_decision_event.1323.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![numerate_recruit_cost|V0] [gold|E] needed to recruit [numerate_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1323.c: "On second thought..."
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1324.t: "The Seasoned Traveler" 
 gdp_visit_holding_decision_event.1324.desc: "Tension between the two traders has reached a boiling point. Employing mollifying gestures, [traveler_recruit.GetFirstName] endeavors to de-escalate the conflict. Despite [traveler_recruit.GetHerHis] broken [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName], [traveler_recruit.GetSheHe] is somewhat successful. The effort is admirable for someone clearly not accustomed to the local culture.\n\nYet, neither trader can tell whether [traveler_recruit.GetSheHe] means quality, wares, or something else entirely, and the quarrel settles into a stalemate."
 gdp_visit_holding_decision_event.1324.a: ""Let me attempt to mediate.""
 gdp_visit_holding_decision_event.1324.a.success: "Your interpretation is convincing" 
 gdp_visit_holding_decision_event.1324.a.failure: "Your interruption is unwanted"
 gdp_visit_holding_decision_event.1324.b: "I could use someone with your expertise."
 gdp_visit_holding_decision_event.1324.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![traveler_recruit_cost|V0] [gold|E] needed to recruit [traveler_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1324.c: "I cannot be bothered..."
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1325.t: "The Urchin" 
 gdp_visit_holding_decision_event.1325.desc: "I've seen this act many times before, so I know to approach the [urchin_recruit.Custom('GirlBoy')] with care. Before I can speak, a frail arm shoves the bundle into my hands.\n\n"Please, kind [ROOT.Char.GetWomanMan], could you spare some food for me and the little one?"\n\n[urchin_recruit.GetHerHis|U] other hand is already groping for my pouch. The bundle slips and hits the ground, three rocks wrapped in a blanket, just as I had suspected. An obvious ruse, but a bold one."
 gdp_visit_holding_decision_event.1325.a: "Get that hand out of my bag this instant!"
 gdp_visit_holding_decision_event.1325.a.success: "You catch the thief" 
 gdp_visit_holding_decision_event.1325.a.failure: "You are too slow"
 gdp_visit_holding_decision_event.1325.b: "My company could use a deft pair of hands."
 gdp_visit_holding_decision_event.1325.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![urchin_recruit_cost|V0] [gold|E] needed to recruit [urchin_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1325.c: "Enough of this!"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1326.t: "The Herbalist" 
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName] pays me no mind as I move in closer. [herbalist_recruit.GetSheHe|U] is entranced by the pestle's movements as it crushes the ingredient into an ambiguous mixture.\n\n"A little bit of [ROOT.Char.Custom('Abortifacient')], and maybe some [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')], then perhaps I could boil it in [ROOT.Char.Custom('RegionalDrink')]. Yes...That should do the trick, what do you think?"\n\nWhile barely taking my presence into account [herbalist_recruit.GetSheHe] turns to me and holds the mortar to my nose, I am hit with a pungent smell."
 gdp_visit_holding_decision_event.1326.a: " #EMP Hmm#!, may I suggest adding more [ROOT.Char.Custom('Abortifacient')]?"
 gdp_visit_holding_decision_event.1326.a.success: "Your input is helpful" 
 gdp_visit_holding_decision_event.1326.a.failure: "Your input is unhelpful"
 gdp_visit_holding_decision_event.1326.b: "I could really use someone with your skills."
 gdp_visit_holding_decision_event.1326.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ @gold_icon![herbalist_recruit_cost|V0] [gold|E] needed to recruit [herbalist_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1326.c: "I don't think this is for me."

 gdp_visit_holding_decision_event.1330.t: "The Monk"
 gdp_visit_holding_decision_event.1330.desc: "In a quiet corner of the local tea parlor I find a monk divining meaning from the yarrow stalks before [monk.GetHerHim], [monk.GetHerHis] table illuminated by candlelight. The [monk.GetWomanMan] looks at me, sensing my interest.\n\n"Are you a disciple of the oracle, friend? If your mind is open and honest, The Way has much to show you.""
 gdp_visit_holding_decision_event.1330.desc_returned_01: "The tea parlor is emptier than before. [monk.GetFirstName] still sits with the yarrow stalks spread before [monk.GetHerHim], the candle burned lower.\n\n[monk.GetSheHe|U] does not look up."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "[monk.GetFirstName] is sweeping the stalks back into a cloth when I return. The candle gutters.\n\n"Persistent," [monk.GetSheHe] says. "The Way does not mind a second visit. Do you?""
 gdp_visit_holding_decision_event.1330.a: "My company could use a learned companion."
 gdp_visit_holding_decision_event.1330.a.tt: "@gold_icon![monk_recruit_cost|V0] [gold|E] needed to recruit [monk.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "Tell me what you have been studying."
 gdp_visit_holding_decision_event.1330.c: "I know a thing or two about heaven."
 gdp_visit_holding_decision_event.1330.c.success: "You impress [monk.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName] walks away, unimpressed"
 gdp_visit_holding_decision_event.1330.d: "Perhaps another time."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$:"

 gdp_visit_holding_decision_event.1333.t: "The Seasoned Caravaneer"
 gdp_visit_holding_decision_event.1333.desc: "The Dromedaries huddle together in what little shelter their pens offer. From the pack comes the occasional grunt, the stamping of a hoof, and... #EMP snoring#!?\n\nLooking closer, I spot a caravaneer asleep against [caravaneer.GetHerHis] saddlebags. [caravaneer.GetSheHe|U] wakes by the sound of my approach and quickly gets to [caravaneer.GetHerHis] feet, wiping the drool of [caravaneer.GetHerHis] face.\n\nHe explains: "I assure you, the stable owner knows I am here. I never leave my animals, for their safety, and my peace of mind.""
 gdp_visit_holding_decision_event.1333.desc_returned_01: "The dromedaries are still packed tight in the pen. This time [caravaneer.GetFirstName] is awake, running a hand down his saddle girth.\n\n[caravaneer.GetSheHe|U] glances over [caravaneer.GetHerHis] shoulder. "You again.""
 gdp_visit_holding_decision_event.1333.desc_returned_02: "A grunt from the pen, then [caravaneer.GetFirstNamePossessive] voice: "If you have come to stare, the animals charge extra."\n\n[caravaneer.GetSheHe|U] is sitting on the saddlebags now, fully dressed, waiting to see whether I mean to talk."
 gdp_visit_holding_decision_event.1333.a: ""I will keep your animals protected.""
 gdp_visit_holding_decision_event.1333.a.tt: "@gold_icon![caravaneer_recruit_cost|V0] [gold|E] needed to recruit [caravaneer.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: ""What news from the road?""
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "You have asked about the road recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]"
 gdp_visit_holding_decision_event.1333.c: ""I know a thing or two on how to organize caravans...""
 gdp_visit_holding_decision_event.1333.c.success: "You impress [caravaneer.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName] takes [caravaneer.GetHerHis] animals and leaves"
 gdp_visit_holding_decision_event.1333.d: "Perhaps another time."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1334.t: "The Sea Captain"
 gdp_visit_holding_decision_event.1334.desc: "Crowding the dock, a group of women and men have gathered around a weathered sailor in the hopes of securing passage on [sea_captain.GetHerHis] ship.\n\nI catch a pair of passers-by whispering to each other: "We are too late! [sea_captain.GetTitledFirstName|U] will not have space for us." Instead of turning to any other sailor, they choose to wait for his next arrival.\n\nWho exactly is this [sea_captain.GetWomanMan], and is that #EMP gold#! clinking inside of [sea_captain.GetHerHis] peg leg?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "The crowd around [sea_captain.GetFirstName] has thinned. [sea_captain.GetSheHe|U] is dropping coins into [sea_captain.GetHerHis] peg, one by one, as the last petitioners peel away.\n\n[sea_captain.GetSheHe|U] does not bother to turn. "I did not expect to see you again.""
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName|U] is waving a latecomer toward another hull. The peg taps the planks as [sea_captain.GetSheHe] turns.\n\n"Back already. Did you want a berth, or is it me you are after?""
 gdp_visit_holding_decision_event.1334.a: ""I can pay double than anybody here.""
 gdp_visit_holding_decision_event.1334.a.tt: "@gold_icon![sea_captain_recruit_cost|V0] [gold|E] needed to recruit [sea_captain.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: ""Mind sharing a story or two?""
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "You have heard a sea captain's story recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]"
 gdp_visit_holding_decision_event.1334.c: ""Trading goods is a far more lucrative venture.""
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip] is convinced"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName] shoves off"
 gdp_visit_holding_decision_event.1334.d: "Perhaps another time."
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1335.t: "The Carnival Jester"
 gdp_visit_holding_decision_event.1335.desc: "A rapt audience gathers around a [carnival_jester.GetWomanMan] performing in a street corner, drawing buyers from nearby merchant stalls and grinding the market activity to a halt.\n\nThe performer spreads [carnival_jester.GetHerHis] arm out and says, "Look here, all you who told me that my tricks could not be done if not for the dim Carnival venues. I, unlike you, do not need to hide behind any mask.""
 gdp_visit_holding_decision_event.1335.desc_returned_01: "The same corner, a thinner crowd. [carnival_jester.GetFirstName] finishes a turn, spots me, and spreads [carnival_jester.GetHerHis] arms as if I were part of the act.\n\n"An encore?""
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName] is packing [carnival_jester.GetHerHis] props into a cloth.\n\n"I'm starting to think it is me you are after.""
 gdp_visit_holding_decision_event.1335.a: ""My company needs sharp wit like yours.""
 gdp_visit_holding_decision_event.1335.a.tt: "@gold_icon![carnival_jester_recruit_cost|V0] [gold|E] needed to recruit [carnival_jester.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: ""Tell me more about these carnivals.""
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "You have asked about the carnivals recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]"
 gdp_visit_holding_decision_event.1335.c: ""Surely you have nothing more to prove here?""
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip] is convinced"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName] packs up and leaves"
 gdp_visit_holding_decision_event.1335.d: "Perhaps another time."
