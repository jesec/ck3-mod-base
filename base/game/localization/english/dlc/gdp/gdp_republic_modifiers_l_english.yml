 gdp_popular_mandate_modifier: "Popular Support"
 gdp_popular_mandate_modifier_desc: "This ruler has rallied the citizens of the capital behind their continued leadership, lending extra weight to their voice in the next election.\n\n#weak This [modifier|E] lasts for one election#!\n\n[GetLaw( 'republican_elective_succession_law' ).GetName] [voting_strength|E]: #P +1#!"
 gdp_patrician_promoted_voter_modifier: "Promoted Reputation"
