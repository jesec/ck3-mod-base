 gdp_republic_disgraced_patrician_house_modifier: "Disgraced Patricians"
 gdp_republic_disgraced_patrician_house_modifier_desc: "This house drove a republic into ruin and was cast out in shame. Their name carries little weight in the markets, and fewer still speak well of them."
 gdp_republic_unrest_guild_district_shutdown: "Guild District: Closed"
 gdp_republic_unrest_guild_district_shutdown_desc: "The artisan guilds have shut their doors. Crafts and workshops have ground to a halt."
 gdp_republic_unrest_market_district_shutdown: "Market District: Closed"
 gdp_republic_unrest_market_district_shutdown_desc: "The market district is locked and emptied. Trade and commerce in the city have stalled."
 gdp_republic_unrest_port_district_shutdown: "Port District: Closed"
 gdp_republic_unrest_port_district_shutdown_desc: "The port has been shut off to city authority. Maritime income has dried up."
 gdp_republic_unrest_bureaucratic_district_shutdown: "Bureaucratic District: Closed"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "The administrative district has gone silent. Civic revenues are left uncollected."
 gdp_republic_unrest_temple_district_shutdown: "Religious Enclave District: Closed"
 gdp_republic_unrest_temple_district_shutdown_desc: "The Religious Enclave district has withdrawn its cooperation. Pious donations has ceased flowing to the treasury."
 gdp_republic_unrest_entertainment_district_shutdown: "Entertainment District: Closed"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "The entertainment quarter has gone dark and empty. Urban revenue takes the hit."
 gdp_republic_unrest_urban_housing_district_shutdown: "Housing District: Closed"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "An entire residential quarter has barricaded itself. Urban tax collection has broken down."
 gdp_republic_riot_aftermath: "Aftermath of the Riots"
 gdp_republic_riot_aftermath_desc: "Streets were burned, granaries looted, and the civic fabric torn. Recovery will be slow."
 gdp_republic_uprising_aftermath: "Aftermath of the Uprising"
 gdp_republic_uprising_aftermath_desc: "The people rampaged through the city unchecked. Order will not return quickly."
 gdp_sponsored_guild_modifier: "Sponsored Craft Guild"
 gdp_sponsored_guild_modifier_desc: "Craftsmen has been allowed to form a new guild and sponsored by a wealthy benefactor."

 gdp_secret_information_house_modifier: "Diplomatic Secrets"
 gdp_secret_information_house_modifier_desc: "This house benefits from an insight into the secret diplomatic negotiations of their republic."
 gdp_ambitions_aligned_house_modifier: "House Ambition Aligned"
 gdp_ambitions_aligned_house_modifier_desc: "This house has aligned its interests with the other houses of the same ambition in the republic."
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "This house's reputation has been maligned by a torrent of lurid calumny.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_slander_rating_penalty_value' )|0=+]\n[house|E] Member [GetLaw('republican_elective_succession_law').GetName] Support Score: [EmptyScope.ScriptValue( 'republic_slander_election_value' )|0=+]"
 gdp_patrician_promoted_house_modifier: "Promoted Reputation"
 gdp_patrician_promoted_house_modifier_desc: "This house's standing in the republic has been advanced by a successful promotional campaign.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
 gdp_secured_republic_monopoly_modifier: "Secured Republic Monopoly"
 gdp_secured_republic_monopoly_modifier_desc: "This character has secured a monopoly for their republic.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'secured_republic_monopoly_rating_bonus_value' )|0=+]"
 gdp_head_held_high_modifier: "Head Held High"
 gdp_head_held_high_modifier_desc: "This character is holding their head high against all derision."
 gdp_training_for_the_worst_modifier: "Training for the Worst"
 gdp_training_for_the_worst_modifier_desc: "This character has decided to train their martial prowess, in case worst comes to worst."
 gdp_fear_of_the_mob_modifier: "Fear of the Mob"
 gdp_fear_of_the_mob_modifier_desc: "This character lives in dread of the fickle populace."
 gdp_champion_of_the_people_modifier: "Champion of the People"
 gdp_champion_of_the_people_modifier_desc: "This character has proclaimed themselves a champion of the common people."
 gdp_champion_of_the_state_modifier: "Champion of the Government"
 gdp_champion_of_the_state_modifier_desc: "This character has proclaimed themselves a champion of the ruling government."
 gdp_guild_sponsored_feast_modifier: "Guild Sponsored Feast"
 gdp_guild_sponsored_feast_modifier_desc: "This character has been offered a free feast by the guilds in their city."
 gdp_broken_trust_modifier: "Broken Trust"
 gdp_broken_trust_modifier_desc: "This character took advantage of the people's goodwill for their own gain."
 gdp_toast_to_adventure_modifier: "An Ambition for Adventure"
 gdp_toast_to_adventure_modifier_desc: "This character has ambitions for adventures far away."
 gdp_toast_to_romance_modifier: "An Ambition for Romance"
 gdp_toast_to_romance_modifier_desc: "This character has love and romance ambitions."
 gdp_toast_to_glory_modifier: "An Ambition for Glory"
 gdp_toast_to_glory_modifier_desc: "This character has ambitions for glory."
 gdp_toast_to_relations_modifier: "An Ambition for Friendship."
 gdp_toast_to_relations_modifier_desc: "This character has ambitions for friendship and family.\nUnlocks the $befriend_interaction$ [interaction|E]"

 gdp_republic_bureaucrat_modifier: "Republic Bureaucrat"
 gdp_republic_bureaucrat_modifier_desc: "This character recently showed great skill in the legislative process, managing paperwork with outmost efficiency.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\n[assembly|E] Approval during [voting_sessions|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "Law Maker"
 gdp_republic_law_maker_modifier_desc: "This character, through shrewd maneuvering or by pulling enough strings, recently secured the assembly's approval for their proposed law.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "Influential Trade Posts"
 gdp_dominate_market_trade_post_modifier_desc: "This market is being heavily influenced by a patrician's trade posts."
 gdp_trade_post_charity_modifier: "Held Charity"
 gdp_trade_post_charity_modifier_desc: "This character held a charity for the common people, to benefit the sick, the poor, and those in need."
 gdp_gather_popular_support_modifier: "Popular Among the People"
 gdp_gather_popular_support_modifier_desc: "This character has gathered support from the city's people, making their name known and their voice heard."
 gdp_gather_popular_support_house_t3_modifier: "Exceptional Family of the People"
 gdp_gather_popular_support_house_t3_modifier_desc: "This house has exceptional support from the city's people.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName] support score of [house|E] Members: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "Strong Family of the People"
 gdp_gather_popular_support_house_t2_modifier_desc: "This house has strong support from the city's people.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName] support score of [house|E] Members: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "Family of the People"
 gdp_gather_popular_support_house_t1_modifier_desc: "This house has support from the city's people.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\n[GetLaw('republican_elective_succession_law').GetName] support score of [house|E] Members: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "Despotic Mayor"
 gdp_signorial_execute_and_banish_modifier_desc: "This character has executed and banished citizens of the republic, and harbors ambitions to do more."
 gdp_ambition_promote_scheme_bonus_modifier: "Promoted Patricians"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "This character has spent time and effort to improve another patrician's reputation, earning goodwill in return.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (Rating does not stack)#!"

 gdp_noble_magistrate_modifier: "Noble Magistrate Position"
 gdp_noble_magistrate_modifier_desc: "This character has been given a minor noble magistracy to serve the republic with integrity and honor in an official capacity."
 gdp_republic_plaza_prestige_modifier: "Prestigious Plaza"
 gdp_republic_plaza_prestige_modifier_desc: "This character has contributed to the Great Plaza, earning them prestige and public favor."
 gdp_republic_trader_competitiveness_modifier: "Solid Trader"
 gdp_republic_trader_competitiveness_modifier_desc: "This character is a stone-cold trader who doesn't bend — they make the other side crack."
 gdp_republic_plaza_chancery_modifier: "Chancery Timber"
 gdp_republic_plaza_chancery_modifier_desc: "This character fitted out the archive, leaving them with carpenters, presses, and seasoned timber to spare, and they are putting the surplus to work at home."
 gdp_republic_plaza_scriptorium_modifier: "Well-Stocked Scriptorium"
 gdp_republic_plaza_scriptorium_modifier_desc: "This character owns a great deal of quality inks and pigments, having supplied the commune's copyists."
 gdp_republic_plaza_magistracy_modifier: "Robes of Office"
 gdp_republic_plaza_magistracy_modifier_desc: "This character clothed the city's magistrates at their own expense, and is greeted accordingly wherever the law is spoken."
 gdp_republic_plaza_popular_favor_modifier: "Popular Figurehead"
 gdp_republic_plaza_popular_favor_modifier_desc: "This character is an expert at swaying the crowd, making sure everyone knows exactly whose coin paid for their amenities."
 gdp_republic_plaza_trade_capacity_modifier: "Measured and Sealed"
 gdp_republic_plaza_trade_capacity_modifier_desc: "This character's goods pass the scales without dispute, and greater quantities change hands with every season."
 gdp_republic_plaza_expertise_modifier: "Trader of the Plaza"
 gdp_republic_plaza_expertise_modifier_desc: "This character holds sway over many of the city's merchants, gaining insights into commodities and trade that would otherwise take decades to acquire."
 gdp_republic_plaza_estate_income_modifier: "Public Creditor"
 gdp_republic_plaza_estate_income_modifier_desc: "The commune owes this character money, and the interest arrives punctually at their counting house."
 gdp_republic_plaza_physician_modifier: "Physician's Favor"
 gdp_republic_plaza_physician_modifier_desc: "This character paid to stock the city's wards with herbs and remedies, ensuring their own household never wants for either."
 gdp_republic_plaza_hired_swords_modifier: "Paymaster of Companies"
 gdp_republic_plaza_hired_swords_modifier_desc: "This character ensures that hired companies are paid promptly and in full, and they remember which purse it came from."
 gdp_republic_plaza_organized_worker_modifier: "Workforce Organizer"
 gdp_republic_plaza_organized_worker_modifier_desc: "This character organized the workforce for massive construction projects, learning a great deal about the large scale logistics that come with it."
 gdp_republic_civic_works_labor_modifier: "Organized Labor"
 gdp_republic_civic_works_labor_modifier_desc: "Workers have been marshaled and organized by the republic, accelerating construction across the capital."
 gdp_republic_civic_works_materials_modifier: "Materials Sourced"
 gdp_republic_civic_works_materials_modifier_desc: "A coordinated effort to source and stockpile building materials has reduced construction costs throughout the capital."
 gdp_republic_civic_works_amenities_modifier: "Public Amenities"
 gdp_republic_civic_works_amenities_modifier_desc: "New baths, fountains, and gathering spaces have raised the mood of the city's people."
 gdp_republic_civic_works_market_modifier: "Expanded Market"
 gdp_republic_civic_works_market_modifier_desc: "A larger and better-organized market district has drawn more merchants and improved trade conditions in the capital."
 gdp_republic_civic_works_guilds_modifier: "Artisan Guilds Endowed"
 gdp_republic_civic_works_guilds_modifier_desc: "Sponsored guilds have brought skilled craftsmen to the capital, driving investment and steadily improving its conditions."
 gdp_republic_civic_works_labor_character_modifier: "Labor Network"
 gdp_republic_civic_works_labor_character_modifier_desc: "Organizing the workforce for the Civic Works has given this ruler connections to skilled laborers and contractors across the capital.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "Supply Network"
 gdp_republic_civic_works_materials_character_modifier_desc: "Sourcing materials for the Civic Works has opened reliable channels for stone, timber, and supplies at favorable rates.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "Civic Patron"
 gdp_republic_civic_works_amenities_character_modifier_desc: "Funding the city's public amenities has earned this ruler visible goodwill among the people of the capital.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "Market Connections"
 gdp_republic_civic_works_market_character_modifier_desc: "Expanding the capital's market district has put this ruler in contact with merchants and traders who remember the favor.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "Guild Patron"
 gdp_republic_civic_works_guilds_character_modifier_desc: "Endowing the artisan guilds has built lasting ties with the city's craftsmen, whose gratitude reflects well on this ruler's standing.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "Settlement Expansion"
 gdp_republic_civic_works_settlement_modifier_desc: "Investment in the capital's urban infrastructure has made room for more people, and they are coming."
 gdp_republic_civic_works_settlement_character_modifier: "Urban Investor"
