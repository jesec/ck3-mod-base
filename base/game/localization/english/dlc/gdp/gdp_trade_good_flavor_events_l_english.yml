l_english:
 # Trade-good flavor pool (gdp_trade_good_flavor)

 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "Counting Stock"
 gdp_trade_good_flavor.1001.desc: "I count my [tgf_good.Custom('GetTradeGoodUnitPlural')] of [tgf_good.Custom('GetTradeGood')] one more time before bed. Three hundred and twelve, and every one of them already sold... at least in my head.\n\nI count them again. Just to be sure."
 gdp_trade_good_flavor.1001.a: "All there. All mine."
 gdp_trade_good_flavor.1001.b: "The ledger must agree with me."

 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "Word Travels"
 gdp_trade_good_flavor.1002.desc: "Word has reached me: at [tgf_market_holder.GetHerHis] own table, [tgf_market_holder.GetTitledFirstName] has been praising my [tgf_good.Custom('GetTgfGoodLook')]. [tgf_market_holder.GetSheHe|U] wants more, and [tgf_market_holder.GetHerHis] neighbors heard [tgf_market_holder.GetHerHim] say so.\n\nPraise is pleasant. Praise from a [tgf_market_holder.GetWomanMan] who keeps buying is better."
 gdp_trade_good_flavor.1002.a: "A gift for my favorite buyer."
 gdp_trade_good_flavor.1002.b: "Then [tgf_market_holder.GetSheHe] can pay more."
 gdp_trade_good_flavor.1002.c: "Let them talk."

 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "From the Source"
 gdp_trade_good_flavor.1003.desc: ""The [tgf_source_culture.GetName] workers here know their trade down to the last [tgf_good.Custom('GetTgfGoodSmallest')]," my trader, [tgf_trader.GetFirstName], writes from [tgf_source_county.GetNameNoTier]. "The [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTgfGoodIsAre')] [tgf_good.Custom('GetTgfGoodMade')], and nobody cuts corners."\n\nKnowing the source is half of selling the stock."
 gdp_trade_good_flavor.1003.a: "Every detail is worth coin."
 gdp_trade_good_flavor.1003.b: "Now I know what it should cost."
 gdp_trade_good_flavor.1003.c: "Respect, from one trades[ROOT.Char.GetWomanMan] to another."

 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "An Open Road"
 gdp_trade_good_flavor.1004.desc: "My trader, [tgf_trader.GetFirstName], grins like a [tgf_trader.GetWomanMan] who has already spent [tgf_trader.GetHerHis] cut. "The whole road is open, and they are asking by name for your [tgf_good.Custom('GetTgfGoodLook')]."\n\nGood years pass quickly. Best to squeeze this one."
 gdp_trade_good_flavor.1004.a: "Sell while the road is kind."
 gdp_trade_good_flavor.1004.b: "Every good year has a lesson. Learn it."
 gdp_trade_good_flavor.1004.c: "Invest in more wagons!"

 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "Dreams of Profit"
 gdp_trade_good_flavor.1005.desc: "I dreamed of [tgf_good.Custom('GetTradeGood')] again. [tgf_good.Custom('GetTradeGoodUnitPlural')|U] of it, stacked past the rafters, and me atop the pile — watching the buyers below fight over who pays first.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "I dreamed of [tgf_good.Custom('GetTradeGood')] again. Whole herds of them, filling every road to market — and me riding at the head of the column, counting buyers as they came running.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "I woke up laughing. Then I started writing the numbers down. In time, I will be rich!"
 gdp_trade_good_flavor.1005.a: "Why should it stay a dream?"
 gdp_trade_good_flavor.1005.a.tt: "A new [trade_opportunity|E] will soon present itself"
 gdp_trade_good_flavor.1005.b: "The numbers will work. I will make them work."
 gdp_trade_good_flavor.1005.c: "Five more minutes of being rich... Zz#DIE1 zz#!#DIE2 zz...#!"

 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "Fools Who Check"
 gdp_trade_good_flavor.1006.desc: "My trader, [tgf_trader.GetFirstName], pulls me aside at the warehouse. "The [tgf_good.Custom('GetTradeGood')] out of [tgf_source_county.GetNameNoTier] — [tgf_good.Custom('GetTgfGoodFlaw')]. They think we are fools who do not check!"\n\nThey wanted to cheat me. Instead, they handed me a discount."
 gdp_trade_good_flavor.1006.a: "Poor stuff should have a poor price."
 gdp_trade_good_flavor.1006.b: "Heh. Outsmarted."

 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "Ask for It by Name"
 gdp_trade_good_flavor.1007.desc: "My trader, [tgf_trader.GetFirstName], brings strange news from [tgf_source_county.GetNameNoTier]. "[tgf_good.Custom('GetTradeGood')|U], [tgf_good.Custom('GetTgfGoodSold')], and still the [tgf_source_culture.GetCollectiveNoun] ask for #EMP '[ROOT.Char.GetHouse.GetName] [tgf_good.Custom('GetTradeGood')]'#! by name, and pay over the going rate to get it! We are almost out of stock!"\n\nMy name, it turns out, is worth money."
 gdp_trade_good_flavor.1007.a: "Stamp my mark on every [tgf_good.Custom('GetTradeGoodUnit')]."
 gdp_trade_good_flavor.1007.b: "Sell, sell, sell!"

 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "Appraising [tgf_good.GetNameNoTooltip]"
 gdp_trade_good_flavor.1008.desc: "A letter arrives bearing [tgf_market_holder.GetTitledFirstNamePossessive] seal. "I have been offered [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')], and my steward cannot tell good from bad. Would you cast your merchant's eye over it?"\n\nFlattering. Flattery usually costs extra."
 gdp_trade_good_flavor.1008.a: "The truth, weighed and measured."
 gdp_trade_good_flavor.1008.b: "Magnificent. I have never seen better."
 gdp_trade_good_flavor.1008.c: "Expert opinions are sold, not given."

 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "Learn to Count"
 gdp_trade_good_flavor.1009.desc: "I catch my heir, [tgf_heir.GetFirstName], in the warehouse, peering into [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] as though coin might be hiding at the bottom.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "I catch my heir, [tgf_heir.GetFirstName], at the pens, sizing up a [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] as though coin might be hiding under the hide.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "Good instincts. Time someone sharpened them."
 gdp_trade_good_flavor.1009.a: "Come. Watch what I do."
 gdp_trade_good_flavor.1009.b: "Count them, then. Twice."

 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "The Imitator"
 gdp_trade_good_flavor.1010.desc: "A crate comes back to me in [tgf_source_county.GetNameNoTier] for being 'not up to the usual standard'. It is not mine, but someone copied my mark down to the last curl.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "One of my beasts comes back to me in [tgf_source_county.GetNameNoTier] for being 'not up to the usual standard'. It is not mine, but someone copied my brand down to the last curl.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "My trader, [tgf_trader.GetFirstName], names the forger: one [tgf_rival.GetFirstName], of the [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')]. [tgf_rival.GetSheHe|U] copies well, I will give [tgf_rival.GetHerHim] that."
 gdp_trade_good_flavor.1010.a: "Crush this forgery, whatever it costs."
 gdp_trade_good_flavor.1010.b: "Let every house hear of this insult."
 gdp_trade_good_flavor.1010.c: "Imitation spreads my name for free."
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U] turned [tgf_rival.GetShortUINamePossessiveNotMy] forgeries into a matter between their houses."
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U] turned [target_char.GetShortUINamePossessiveNotMy] forgeries into a matter between their houses."

 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "The Price of [tgf_good.GetNameNoTooltip]"
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName|U], a trader in the [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')]'s pay, finds me at my warehouse and sets a heavy purse on the table. "My master, [tgf_rival.GetFirstName], wants the names of your [tgf_good.Custom('GetTradeGood')] sellers. All of them. The purse says please."\n\n[tgf_envoy.GetSheHe|U] is not buying names. [tgf_envoy.GetSheHe|U] is buying years of my work."
 gdp_trade_good_flavor.1011.a: "Names are just ink. Pay up."
 gdp_trade_good_flavor.1011.b: "My edge is not for sale."

 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "A Truce of Traders"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U] sells [tgf_good.Custom('GetTradeGood')] in [tgf_source_county.GetNameNoTier], the same as I do, and every season we price each other closer to the bone. Today [tgf_ally.GetHerHis] letter offers a truce: we stop undercutting, and we both eat well.\n\nPeace, it turns out, can be bought like anything else."
 gdp_trade_good_flavor.1012.a: "Agreed. We both eat."
 gdp_trade_good_flavor.1012.b: "I can starve longer than [tgf_ally.GetSheHe] can."
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U] and [tgf_ally.GetShortUINameNotMe] agreed to stop undercutting each other."
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U] and [target_char.GetShortUINameNotMe] agreed to stop undercutting each other."

 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "A Private Price"
 gdp_trade_good_flavor.1013.desc: "I receive a letter under the seal of [tgf_market_holder.GetTitledFirstName]. "You buy your [tgf_good.Custom('GetTradeGood')] in my market. Buy [tgf_good.Custom('GetTgfGoodItThem')] there alone, and you will pay less than any other merchant ever has."\n\nExclusive is another word for leashed. But the rate is good."
 gdp_trade_good_flavor.1013.a: "[tgf_market_holder.GetHerHis|U] market, my discount. Done."
 gdp_trade_good_flavor.1013.b: "I bow to no one's ledger."

 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "Ask the Old Hands"
 gdp_trade_good_flavor.1014.desc: "A graying porter sets down [tgf_porter.GetHerHis] load at the [tgf_source_county.GetNameNoTier] warehouse. "Begging your pardon — but you are checking your [tgf_good.Custom('GetTradeGood')] all wrong." [tgf_porter.GetSheHe|U] shows me: here, and here.\n\nA lifetime of carrying [tgf_good.Custom('GetTradeGoodUnitPlural')] has taught [tgf_porter.GetHerHim] more than most."
 gdp_trade_good_flavor.1014.desc.livestock: "A graying drover slows [tgf_porter.GetHerHis] herd at the [tgf_source_county.GetNameNoTier] market. "Begging your pardon — but you are judging your [tgf_good.Custom('GetTradeGood')] all wrong." [tgf_porter.GetSheHe|U] shows me: here, and here.\n\nA lifetime of driving [tgf_good.Custom('GetTradeGood')] to market has taught [tgf_porter.GetHerHim] more than most."
 gdp_trade_good_flavor.1014.a: "Here. Wisdom deserves wages."
 gdp_trade_good_flavor.1014.b: "Go on. I am listening."

 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "A Beginner's Mistake"
 gdp_trade_good_flavor.1015.desc: "Somewhere in [tgf_source_county.GetNameNoTier], the peddler who sold me my [tgf_good.Custom('GetTradeGood')] is drinking to my health. I paid a fool's price, and I am the last to find out.\n\nWell. Fools who learn... stop being fools."
 gdp_trade_good_flavor.1015.a: "An expensive lesson is still a lesson."
 gdp_trade_good_flavor.1015.b: "Enough. Tonight the ledger sleeps."

 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "The Merchant's Handbook"
 gdp_trade_good_flavor.1016.desc.intro: "Wedged in a crate of [tgf_good.Custom('GetTradeGood')], wrapped against the damp, I find a copy of "
 gdp_trade_good_flavor.1016.desc.intro_livestock: "In the gear that came with the last [tgf_good.Custom('GetTradeGood')] I bought, wrapped against the damp, I find a copy of "
 gdp_trade_good_flavor.1016.desc.book_1: "The Practice of Commerce"
 gdp_trade_good_flavor.1016.desc.book_2: "The Book of Roads and Markets"
 gdp_trade_good_flavor.1016.desc.book_3: "The Merchant's Mirror"
 gdp_trade_good_flavor.1016.desc.outro: " — weights, measures, roads, and prices, set down by a merchant who clearly never slept.\n\nSomeone lost a treasure. I intend to use it."
 gdp_trade_good_flavor.1016.a: "Read it until the spine gives."
 gdp_trade_good_flavor.1016.b: "Rare books fetch rarer prices."

 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "The Feel of It"
 gdp_trade_good_flavor.1017.desc: "In [tgf_source_county.GetNameNoTier], a seller, one of the [tgf_seller.GetCulture.GetCollectiveNoun], holds out one [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] and names a price fit for three. "You are new to this, yes? Then pay to learn the feel of it."\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "In [tgf_source_county.GetNameNoTier], a seller, one of the [tgf_seller.GetCulture.GetCollectiveNoun], parades one [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] before me and names a price fit for three. "You are new to this, yes? Then pay to learn the feel of it."\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "Insolent. Correct, but insolent."
 gdp_trade_good_flavor.1017.a: "Take the coin. Teach me."
 gdp_trade_good_flavor.1017.b: "Absolutely not."

 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "Wrong Measure"
 gdp_trade_good_flavor.1018.desc: "My trader, [tgf_trader.GetFirstName], discovers we have been selling [tgf_good.Custom('GetTradeGood')] by the [ROOT.Char.GetCulture.GetName] measure — a shade smaller than the [tgf_source_culture.GetName] one the buyers assume. Every [tgf_good.Custom('GetTradeGoodUnit')] sold has come up short.\n\nAn honest mistake. Whether it stays one is up to me."
 gdp_trade_good_flavor.1018.a: "Fix the measures. All of them."
 gdp_trade_good_flavor.1018.b: "The difference stays in my purse."
 gdp_trade_good_flavor.1018.c: "Weigh it their way, and say so loudly."

 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "Two Goods, One Buyer"
 gdp_trade_good_flavor.1019.desc: "I receive a letter from [tgf_market_holder.GetTitledFirstName]. "Send me your [tgf_good.Custom('GetTradeGood')]. Send me your [tgf_good_b.Custom('GetTradeGood')] as well, since the one is nothing without the other."\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "I receive a letter from [tgf_market_holder.GetTitledFirstName]. "Send me your [tgf_good.Custom('GetTradeGood')]. Send me your [tgf_good_b.Custom('GetTradeGood')] as well, in the same delivery."\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "Two goods, one buyer, one price. My favorite kind of arithmetic."
 gdp_trade_good_flavor.1019.a: "Sold as a set, priced as a set."
 gdp_trade_good_flavor.1019.b: "Separately. Coin now beats coin later."

 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "The Builder's Rate"
 gdp_trade_good_flavor.1020.desc: "Scaffolds climb over [tgf_build_county.GetNameNoTier]. [tgf_market_holder.GetTitledFirstName] is building, and every cart that rolls up to the works is loaded with my [tgf_good.Custom('GetTradeGood')]. [tgf_market_holder.GetSheHe|U] writes, asking for a builder's rate — the same [tgf_good.Custom('GetTradeGood')], a bit cheaper, until the walls stand.\n\nEvery wall [tgf_market_holder.GetSheHe] raises is half mine already."
 gdp_trade_good_flavor.1020.a: "The builder's rate it is."
 gdp_trade_good_flavor.1020.b: "A rate, yes. A gift, no."
 gdp_trade_good_flavor.1020.c: "A favor now, a favor later."
 gdp_trade_good_flavor.1020.d: "The best of it stays in my yard."

 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "Know the Goods"
 gdp_trade_good_flavor.1021.desc: "Every trade has its masters, and masters #EMP keep#! learning. Tonight it is me, a lamp, and the finest [tgf_good.Custom('GetTradeGoodUnitPlural')] of [tgf_good.Custom('GetTradeGood')] in my stores, studied until the oil runs low.\n\nSomewhere in here is the reason mine sells and theirs does not."
 gdp_trade_good_flavor.1021.desc.livestock: "Every trade has its masters, and masters keep learning. Tonight it is me, a lantern, and the finest [tgf_good.Custom('GetTradeGood')] I own, studied from tooth to tail.\n\nSomewhere in here is the reason mine sell and theirs do not."
 gdp_trade_good_flavor.1021.desc.books: "Every trade has its masters, and masters #EMP keep#! learning. Tonight it is me, a lamp, and the finest books in my stores, read until the oil runs low.\n\nSomewhere in here is the reason mine sell and theirs do not."
 gdp_trade_good_flavor.1021.a: "This one I keep. Every other is measured against it."
 gdp_trade_good_flavor.1021.b: "There is always more to learn."

 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "A Name for the Trade"
 gdp_trade_good_flavor.1022.desc: "In [tgf_source_county.GetNameNoTier] they no longer say my name. They say [tgf_good.Custom('GetTgfGoodNickname')], and everyone knows who they mean. #bold Me.#!\n\nTitles are granted by lieges. Names like this are granted by markets, and a market's praise is earned."
 gdp_trade_good_flavor.1022.a: "Vulgar. Effective, but vulgar."
 gdp_trade_good_flavor.1022.b: "Let them. The name is good for business."

 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "A Choke on Supply"
 gdp_trade_good_flavor.1023.desc: ""You buy faster than we can make it," says [tgf_foreman.GetFirstName], a fore[tgf_foreman.GetWomanMan] in [tgf_source_county.GetNameNoTier], as I watch my [tgf_good.Custom('GetTradeGood')] being [tgf_good.Custom('GetTgfGoodMade')]. "There are only so many hands."\n\nMore hands cost coin. Turning buyers away costs more."
 gdp_trade_good_flavor.1023.a: "Hire more hands. I am paying."
 gdp_trade_good_flavor.1023.b: "Come work for me instead."
 gdp_trade_good_flavor.1023.c: "Then show me how it is done."

 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "Under the Hammer"
 gdp_trade_good_flavor.1024.desc: ""Forty [tgf_good.Custom('GetTradeGoodUnitPlural')] of [tgf_good.Custom('GetTradeGood')], to the best bid!" At the [tgf_source_county.GetNameNoTier] [tgf_source_province.Custom('GetRegionalMarketTerm')], [tgf_rival.GetFirstName], of the [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')], raises [tgf_rival.GetHerHis] hand before the auctioneer has finished.\n\n[tgf_rival.GetSheHe|U] looks at me and smiles. [tgf_rival.GetSheHe|U] thinks this lot already belongs to [tgf_rival.GetHerHim]..."
 gdp_trade_good_flavor.1024.a: "Whatever [tgf_rival.GetSheHe] bids, add one."
 gdp_trade_good_flavor.1024.b: "Raise, raise, raise... and it is all yours, [tgf_rival.GetFirstNameNoTooltip]!"
 gdp_trade_good_flavor.1024.c: "Let [tgf_rival.GetHerHim] bid. I will watch who wins."

 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "First at the Quay"
 gdp_trade_good_flavor.1025.desc: ""Twenty ships at the quay and one crane," says [tgf_docks_boss.GetFirstName], who runs the dockers of [tgf_source_county.GetNameNoTier]. "Whoever lands their [tgf_good.Custom('GetTradeGood')] first sets the price for the season. Yours can land first."\n\n[tgf_docks_boss.GetSheHe|U] holds out [tgf_docks_boss.GetHerHis] hand, palm up."
 gdp_trade_good_flavor.1025.a: "First off the boat, first to name the price."
 gdp_trade_good_flavor.1025.b: "Then I sell it right here, off the deck."
 gdp_trade_good_flavor.1025.c: "Let the others land first, and watch what they ask."

 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "By the Handful"
 gdp_trade_good_flavor.1026.desc: ""One [tgf_good.Custom('GetTgfGoodSmallest')] at a time, that is how the poor buy," says [tgf_stallholder.GetFirstName], who keeps a stall in the [tgf_source_county.GetNameNoTier] market. [tgf_stallholder.GetSheHe|U] has broken [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] of my [tgf_good.Custom('GetTradeGood')] into a hundred tiny parcels, and sells each one for a little more than it is worth.\n\n"Keep me supplied, and I will keep you paid.""
 gdp_trade_good_flavor.1026.a: "A fresh [tgf_good.Custom('GetTradeGoodUnit')] whenever you need it. Deal."
 gdp_trade_good_flavor.1026.b: "Sell [tgf_good.Custom('GetTgfGoodItThem')] to them at what they can pay."
 gdp_trade_good_flavor.1026.c: "Take the lot now. Coin in hand."

 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "Market Day"
 gdp_trade_good_flavor.1027.desc: ""[tgf_good.Custom('GetTradeGood')|U]! [tgf_good.Custom('GetTgfGoodLook')|U]! Who needs [tgf_good.Custom('GetTradeGood')]?" It is market day in [tgf_source_county.GetNameNoTier], and my crier can barely be heard. Every buyer in the county, all in one place, all with coin in hand.\n\nI only need them to spend it #EMP with me!#!"
 gdp_trade_good_flavor.1027.a: "I need the best pitch. Whatever it costs."
 gdp_trade_good_flavor.1027.b: "No stall. I will work the crowd myself."

 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "Foreign Coin"
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], a buyer in [tgf_source_county.GetNameNoTier], wants my [tgf_good.Custom('GetTradeGood')] and pays in [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]. "Coin is coin," [tgf_buyer.GetSheHe] says.\n\nCoin is coin, I agree, and tell [tgf_buyer.GetHerHim] what [tgf_buyer.GetHerHis] coins are worth to me. [tgf_buyer.GetSheHe|U] stops smiling."
 gdp_trade_good_flavor.1028.a: "Fine. Silver is silver."
 gdp_trade_good_flavor.1028.b: "My rate, or no deal."
 gdp_trade_good_flavor.1028.c: "Pay me in [tgf_good_b.Custom('GetTradeGood')] instead."

 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "Years on the Road"
 gdp_trade_good_flavor.1029.desc: ""Three years this road has carried your [tgf_good.Custom('GetTradeGood')]," my trader, [tgf_trader.GetFirstName], says, raising [tgf_trader.GetHerHis] cup. "And not one [tgf_good.Custom('GetTradeGoodUnit')] lost while I was on it!"\n\n[tgf_trader.GetSheHe|U] has lost five. But tonight, I let [tgf_trader.GetHerHim] have the glory."
 gdp_trade_good_flavor.1029.a: "You have done well!"
 gdp_trade_good_flavor.1029.b: "To the next three years."
 gdp_trade_good_flavor.1029.c: "Farther next time. Much farther."

 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "Watching It Sell"
 gdp_trade_good_flavor.1030.desc: ""That is real [ROOT.Char.GetHouse.GetName] [tgf_good.Custom('GetTradeGood')], that is," a buyer at the [tgf_source_county.GetNameNoTier] market says, pointing at one of my [tgf_good.Custom('GetTradeGoodUnitPlural')]. "[tgf_good.Custom('GetTgfGoodLook')|U]!"\n\n[tgf_buyer.GetSheHe|U] has no idea a [ROOT.Char.GetHouse.GetName] is standing right behind [tgf_buyer.GetHerHim].\n\nI could say something. I could also just enjoy it."
 gdp_trade_good_flavor.1030.a: "Say nothing. Listen to what they want."
 gdp_trade_good_flavor.1030.b: "Indeed it is. I should know."

 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "Outside Money"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] and [tgf_investor_b.GetFirstName], two [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] of [tgf_source_county.GetNameNoTier], have bought my [tgf_good.Custom('GetTradeGood')] for years. Now they want a cut.\n\n"A share in your trade," [tgf_investor_a.GetFirstNameNoTooltip] says, while [tgf_investor_b.GetFirstNameNoTooltip] counts out the coin. "We pay well, and we ask few questions."\n\nThey will ask questions. Investors always do."
 gdp_trade_good_flavor.1031.a: "Your coin, my profits. Some of them."
 gdp_trade_good_flavor.1031.b: "This trade stays in the family."
 gdp_tgf_kept_in_family_unity_desc: "Kept the trade in the family"

 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "The Display Room"
 gdp_trade_good_flavor.1032.desc: ""[tgf_good.Custom('GetTgfGoodIsThat')] [tgf_good.Custom('GetTradeGood')]?" every visitor asks, stopping in my hall. [tgf_good.Custom('GetTgfGoodItIs')]: the finest I own, [tgf_good.Custom('GetTgfGoodLook')], laid out where no one can miss [tgf_good.Custom('GetTgfGoodItThem')].\n\nNobody leaves my house without knowing what I sell."
 gdp_trade_good_flavor.1032.desc.livestock: ""Are those [tgf_good.Custom('GetTradeGood')]?" every visitor asks, stepping carefully around them in my hall. They are: the finest I own, [tgf_good.Custom('GetTgfGoodLook')], stabled where no one can miss them.\n\nNobody leaves my house without knowing what I sell. Or without checking their shoes."
 gdp_trade_good_flavor.1032.a: "Let them stare. Word will spread."
 gdp_trade_good_flavor.1032.b: "Take it, with my compliments."

 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "Keeping Your Hand In"
 gdp_trade_good_flavor.1033.desc: "An old supplier of [tgf_good.Custom('GetTradeGood')] writes to me: "I have kept the best of this year's [tgf_good.Custom('GetTradeGood')] aside for you, at the old price. Will you not buy again?"\n\nI left that trade behind, but my eye for [tgf_good.Custom('GetTradeGood')] is still sharp. An eye like mine is worth money, if I keep it in use."
 gdp_trade_good_flavor.1033.a: "Write back. Keep my eye sharp."
 gdp_trade_good_flavor.1033.b: "My knowledge is for sale. At a price."
 gdp_trade_good_flavor.1033.c: "Let it go. I have new trades now."

 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "The Itinerary"
 gdp_trade_good_flavor.1034.desc: "[tgf_pilgrim.GetFirstName], a pilgrim lodging in [tgf_source_county.GetNameNoTier], taps a battered little book. "Every road, every inn, every ford between here and the sea is in here. And in the margins, every market that pays well for [tgf_good.Custom('GetTradeGood')]. Yours, for a price."\n\nIt has gone farther than any of my carts."
 gdp_trade_good_flavor.1034.a: "Name your price, pilgrim."
 gdp_trade_good_flavor.1034.b: "Copy it tonight. Return it by morning."
 gdp_trade_good_flavor.1034.c: "Just tell me what you saw in the markets."

 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "Talking Shop"
 gdp_trade_good_flavor.1035.desc: ""So what is it you trade?" my guest, [tgf_guest.GetFirstName], asks on our walk after dinner. A mistake. By the time I have explained how I come by my [tgf_good.Custom('GetTradeGood')] — [tgf_good.Custom('GetTgfGoodMade')] — we have walked the whole market twice.\n\n[tgf_guest.GetSheHe|U] has not once tried to change the subject. That is how I know I have a buyer."
 gdp_trade_good_flavor.1035.a: "Shall we talk terms over dessert?"
 gdp_trade_good_flavor.1035.b: "Enough about mine. Where do you buy yours?"
 gdp_trade_good_flavor.1035.c: "Let me tell you how I made my first fortune on it."

 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "The Packing Floor"
 gdp_trade_good_flavor.1036.desc: ""A third more [tgf_good.Custom('GetTradeGoodUnitPlural')] on every cart," my trader, [tgf_trader.GetFirstName], says, showing me how. "Some will split on the road, and the buyers will complain. Most will not."\n\nMost is a number I like. Some is a number I can live with."
 gdp_trade_good_flavor.1036.a: "Pack them tight. Profit fits in the gaps."
 gdp_trade_good_flavor.1036.b: "Pack them well. Buyers judge the first one they open."
 gdp_trade_good_flavor.1036.c: "Leave it. It has worked so far."

 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "The Market Seal"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "A market official who checked goods for quality and true measure, and fixed a lead or wax seal to those that passed. Many towns forbade selling cloth and other wares without one, and the sealer took a fee for every seal."
 gdp_trade_good_flavor.1037.desc: ""Sealed goods sell for more. Everyone knows it," says [tgf_sealer.GetFirstName], the [Glossary( 'sealer', 'TGF_SEALER_GLOSS' )] of the [tgf_source_county.GetNameNoTier] market, without looking up from [tgf_sealer.GetHerHis] bench. "And I seal in the order I am paid, not the order I am asked."\n\nMy carts of [tgf_good.Custom('GetTradeGood')] wait in the sun. So does my profit."
 gdp_trade_good_flavor.1037.a: "Then we wait. Sealed is sealed."
 gdp_trade_good_flavor.1037.b: "Here. Now seal faster."
 gdp_trade_good_flavor.1037.c: "My name is seal enough."

 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "The Broker"
 gdp_trade_good_flavor.1038.desc: ""I know buyers you have never heard of, in towns you have never been to," says [tgf_broker.GetFirstName], a broker of the [tgf_source_county.GetNameNoTier] market, pouring me a cup I did not ask for. "Your [tgf_good.Custom('GetTradeGood')], their coin, my cut."\n\nThree parties. Only one of them is getting a free drink."
 gdp_trade_good_flavor.1038.a: "Find them. Take your cut."
 gdp_trade_good_flavor.1038.b: "I will find my own buyers, thank you."

 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "The Trader's Apprentice"
 gdp_trade_good_flavor.1039.desc: ""This one counts faster than I do," my trader, [tgf_trader.GetFirstName], says, pushing a skinny youth named [tgf_youth.GetFirstName] forward. [tgf_youth.GetFirstNameNoTooltip] names the price of [tgf_good.Custom('GetTradeGood')] in both our markets before I can ask.\n\nA clever child costs coin to keep. A clever child who works for me earns it back."
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip] stays with me."
 gdp_trade_good_flavor.1039.b: "Keep the youth, [tgf_trader.GetFirstNameNoTooltip]. Teach them well."
 gdp_trade_good_flavor.1039.c: "We have mouths enough."
 gdp_tgf_family_only_unity_desc: "Kept the company to family"

 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "Swimming in It"
 gdp_trade_good_flavor.1040.desc: "Late at night, the warehouse is mine alone: [tgf_good.Custom('GetTgfGoodLook')], piled higher than my head. I let the first handful run through my fingers, one [tgf_good.Custom('GetTgfGoodSmallest')] at a time.\n\nA thought creeps in. What if I... #EMP swam in it?#!"
 gdp_trade_good_flavor.1040.a: "Dive in, happy like a duck!"
 gdp_trade_good_flavor.1040.a.toast: "A Hard Landing"
 gdp_trade_good_flavor.1040.b: "No. Count it. Every [tgf_good.Custom('GetTgfGoodSmallest')]."

 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "The First Sale"
 gdp_trade_good_flavor.1041.desc: "Clearing out an old chest, I find it, wrapped in cloth: the first [tgf_good.Custom('GetTgfGoodSmallest')] of [tgf_good.Custom('GetTradeGood')] I ever sold. I bought it back years ago, at twice the price.\n\nWith no one to see, I hold it up to the light and tell it how far we have come. Every coin I have earned since is one of its children."
 gdp_trade_good_flavor.1041.a: "Frame it. Hang it where I can see it."
 gdp_trade_good_flavor.1041.b: "A relic of my rise. Someone will pay for that."

 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "Coin Under the Pillow"
 gdp_trade_good_flavor.1042.desc: ""Goodnight, coins." I say it every evening now, to the purse under my pillow: everything my [tgf_good.Custom('GetTradeGood')] brought in this season.\n\nIt is the hardest pillow I have ever owned, and the only one worth a fortune."
 gdp_trade_good_flavor.1042.a: "Sleep on it. Sleep on all of it."
 gdp_trade_good_flavor.1042.b: "It does no good under a pillow. Buy more [tgf_good.Custom('GetTradeGood')]."

 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "Portrait With Coins"
 gdp_trade_good_flavor.1043.desc: ""You, at your table. Your [tgf_good.Custom('GetTradeGood')] on one side, your coins on the other," says [tgf_painter.GetFirstName], a painter passing through [tgf_source_county.GetNameNoTier], framing me with [tgf_painter.GetHerHis] thumbs. "Every coin painted, every one [Glossary( 'counted', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )]."\n\nI like a [tgf_painter.GetWomanMan] who counts."
 gdp_trade_good_flavor.1043.a: "Paint it. Every coin."
 gdp_trade_good_flavor.1043.b: "Paint the coins... #EMP bigger.#!"
 gdp_trade_good_flavor.1043.c: "A painter is not a customer."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "Merchants and moneychangers liked to be painted at work, among their coins and scales. Petrus Christus painted a goldsmith weighing a ring for a betrothed couple in 1449."

 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "A Purse Too Heavy"
 gdp_trade_good_flavor.1044.desc: ""Shall I fetch a second servant, [ROOT.Char.Custom('FormOfAddressForLiege')]?" [tgf_servant.GetFirstName] asks. My purse, fat with this season's [tgf_good.Custom('GetTradeGood')] money, now needs a servant of its own to carry it behind me.\n\nI am considering a cart."
 gdp_trade_good_flavor.1044.a: "Yes. Two servants. Walk slowly."
 gdp_trade_good_flavor.1044.b: "No. A cart. With my name painted on it!"
 gdp_trade_good_flavor.1044.c: "Through the [tgf_good.Custom('GetTradeGood')] market first, [tgf_servant.GetFirstNameNoTooltip]."

 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "Profit and Piety"
 gdp_trade_good_flavor.1045.desc: "My ledgers open [Glossary( 'the old way', 'TGF_DATINI_GLOSS' )], in the name of [ROOT.Char.GetFaith.HighGodName] and of profit. This year, profit has filled forty pages, and not one coin of it has gone to [ROOT.Char.GetFaith.HighGodName].\n\nAny merchant knows a partner deserves a fair share."
 gdp_trade_good_flavor.1045.a: "A fair share for my partner above."
 gdp_trade_good_flavor.1045.b: "A quiet hour with [ROOT.Char.GetFaith.HighGodName], then back to the ledgers."
 gdp_trade_good_flavor.1045.c: "[ROOT.Char.GetFaith.HighGodName] made me good at this. It would be rude to stop."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "In the story of Joseph, told in the Torah, the Bible and the Quran, the ruler of Egypt dreams of seven fat cows eaten by seven lean ones. Joseph reads it as seven years of plenty and seven of famine, and Egypt fills its granaries in time."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "Francesco Datini, a merchant of Prato, headed his ledgers 'In the name of God and of profit,' and died one of the richest men in Tuscany."

 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "One of Their Own"
 gdp_trade_good_flavor.1046.desc: ""Half of [tgf_source_county.GetNameNoTier] is [tgf_source_culture.GetCollectiveNoun], like me," my trader, [tgf_trader.GetFirstName], tells me. "Doors open for me that stay shut for you. Prices drop for me that never drop for [ROOT.Char.GetCulture.GetCollectiveNoun] like you."\n\n[tgf_trader.GetFirstNameNoTooltip] means it kindly. I choose to hear only the part about prices."
 gdp_trade_good_flavor.1046.a: "From now on, you do the talking."
 gdp_trade_good_flavor.1046.b: "Here. Do not let anyone poach you."
 gdp_trade_good_flavor.1046.c: "Then I will learn their ways."

 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "Flooded Market"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetFirstName], of the [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')], is selling [tgf_good.Custom('GetTradeGood')] in [tgf_source_county.GetNameNoTier] for less than it costs to haul there. My trader, [tgf_trader.GetFirstName], is furious.\n\nI am curious. Anything that cheap, someone ought to be buying. Preferably me."
 gdp_trade_good_flavor.1047.a: "If [tgf_rival.GetFirstNameNoTooltip] wants to give it away, I will take it."
 gdp_trade_good_flavor.1047.b: "Let [tgf_rival.GetFirstNameNoTooltip] sell at a loss. My [tgf_good.Custom('GetTradeGood')] will keep."

 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "Manuscript in a Bale"
 gdp_trade_good_flavor.1048.desc: "Someone in [tgf_source_county.GetNameNoTier] packed my last [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] with old pages to keep it dry. My trader, [tgf_trader.GetFirstName], unwraps them with care. "A [Glossary( 'book', 'TGF_HOUSE_OF_WISDOM_GLOSS' )], or most of one. Someone will miss this."\n\nI paid for the [tgf_good.Custom('GetTradeGood')]. The book came free, and it may be worth more."
 gdp_trade_good_flavor.1048.a: "I will keep it."
 gdp_trade_good_flavor.1048.b: "Sell it with the [tgf_good.Custom('GetTradeGood')]."
 gdp_trade_good_flavor.1048.c: "Send it back to [tgf_source_county.GetNameNoTierNoTooltip]."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "Books crossed borders in merchants' packs. In Baghdad's House of Wisdom, scholars translated Greek, Persian and Indian works into Arabic, and many reached Latin from there."

 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "Merchants From Home"
 gdp_trade_good_flavor.1049.desc: "My trader, [tgf_trader.GetFirstName], writes from [tgf_source_county.GetNameNoTier]. "There is a whole [Glossary( 'quarter', 'TGF_DIASPORA_GLOSS' )] of [ROOT.Char.GetCulture.GetCollectiveNoun] here, far from home and missing it. Everyone back home knows the [ROOT.Char.GetHouse.GetBaseNameNoTooltip] name. When they hear it here, they crowd around."\n\nHomesickness, it turns out, is a market."
 gdp_trade_good_flavor.1049.a: "Sell to them as we sell at home."
 gdp_trade_good_flavor.1049.b: "Bring their eldest home to my company."
 gdp_trade_good_flavor.1049.c: "A taste of home is worth paying for."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "Merchants who settled abroad built quarters of their own: Sogdians along the Silk Road, Venetians in Constantinople, Jewish traders from Cairo to Aden. Their kin at home traded through them."

 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "The [tgf_good.GetNameNoTooltip] Road"
 gdp_trade_good_flavor.1050.desc: "I am introduced to [tgf_smuggler.GetFirstName], a [Glossary( 'smuggler', 'TGF_SMUGGLER_GLOSS' )] from [tgf_source_county.GetNameNoTier], who has one trick: the top [tgf_good.Custom('GetTradeGoodUnit')] of every cart is the worst on offer — [tgf_good.Custom('GetTgfGoodFlaw')] — so [tgf_market_holder.GetTitledFirstNamePossessive] tax collectors never dig deeper.\n\n"Half the market price," [tgf_smuggler.GetFirstNameNoTooltip] says. "Below the top [tgf_good.Custom('GetTradeGoodUnit')], it is perfect.""
 gdp_trade_good_flavor.1050.a: "Half price is my favorite price."
 gdp_trade_good_flavor.1050.a.toast: "Word Gets Back"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] will be grateful. For your head."
 gdp_trade_good_flavor.1050.c: "Fooling tax collectors? You are hired."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "Wherever rulers taxed goods, smugglers slipped past them. Salt, taxed almost everywhere, made the richest: Huang Chao, a salt smuggler in Tang China, led a rebellion that took the Tang capital, Chang'an."

 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "A Heavy Harvest"
 gdp_trade_good_flavor.2001.desc: "News reaches me from [tgf_source_county.GetNameNoTier], where I buy my [tgf_good.Custom('GetTradeGood')]. The [tgf_source_culture.GetName] peasants have brought in the harvest of a generation, and the storehouses cannot hold it.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "News reaches me from [tgf_source_county.GetNameNoTier], where I buy my [tgf_good.Custom('GetTradeGood')]. The [tgf_source_culture.GetName] herders have had the year of a generation. Every pen is full, and there is not grass enough for them all.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "Their good year. My good price."
 gdp_trade_good_flavor.2001.a: "Lock the price while they celebrate."
 gdp_trade_good_flavor.2001.b: "Ride out. Learn how they grew it."
 gdp_trade_good_flavor.2001.b.livestock: "Ride out. Learn how they bred them."

 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "The Hunter's Haul"
 gdp_trade_good_flavor.2002.desc: ""The [tgf_good.Custom('GetTgfGoodGatherers')] of [tgf_source_county.GetNameNoTier] have outdone themselves," my trader, [tgf_trader.GetFirstName], tells me. "A season's load of [tgf_good.Custom('GetTradeGood')] in one delivery, the best they have ever sent. The offers are already coming in."\n\nSell it all, or keep the finest piece? A merchant's favorite dilemma."
 gdp_trade_good_flavor.2002.a: "Sell it all while the price is high."
 gdp_trade_good_flavor.2002.b: "The best piece stays with me."
 gdp_trade_good_flavor.2002.c: "Flood the stalls. Everyone gets some."

 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "A Rich Vein"
 gdp_trade_good_flavor.2003.desc: "My trader, [tgf_trader.GetFirstName], comes grinning from the [tgf_source_county.GetNameNoTier] road. "A new seam — rich, shallow, and every digger in the county queuing to work it. Cheap [tgf_good.Custom('GetTradeGood')] today. Cheaper still if we buy into the seam."\n\nI have never known a seam to stay cheap for long."
 gdp_trade_good_flavor.2003.desc.amber: "My trader, [tgf_trader.GetFirstName], comes grinning from the [tgf_source_county.GetNameNoTier] road. "The autumn storms have thrown up more [tgf_good.Custom('GetTradeGood')] than anyone remembers, and every family on the shore is out gathering it. Cheap [tgf_good.Custom('GetTradeGood')] today. Cheaper still if #EMP we#! pay the gatherers."\n\nThe sea is never this generous for long."
 gdp_trade_good_flavor.2003.a: "Buy into the diggings."
 gdp_trade_good_flavor.2003.a.amber: "Pay the gatherers."
 gdp_trade_good_flavor.2003.b: "Buy while the carts overflow."

 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "Worth Its Secret"
 gdp_trade_good_flavor.2004.desc: ""A new color!" My trader, [tgf_trader.GetFirstName], has brought a sample all the way from [tgf_source_county.GetNameNoTier], and the dyer's yard swears no one else has the secret.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: ""A new glaze!" My trader, [tgf_trader.GetFirstName], has brought a sample all the way from [tgf_source_county.GetNameNoTier], and the workshop swears no one else has the secret.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "Secrets are expensive. Exclusive secrets are worth it."
 gdp_trade_good_flavor.2004.a: "Name the price. The secret is mine."
 gdp_trade_good_flavor.2004.b: "Admire it, note it, move on."

 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "Tasting the Wares"
 gdp_trade_good_flavor.2005.desc: "A merchant must know the wares. So I taste my own [tgf_good.Custom('GetTradeGood')] — once for duty, twice for certainty, and after that purely for pleasure. By evening the whole [tgf_good.Custom('GetTradeGoodUnit')] is gone.\n\nDelicious. The [tgf_source_culture.GetCollectiveNoun] would pay double for this."
 gdp_trade_good_flavor.2005.a: "Double. They will pay double."
 gdp_trade_good_flavor.2005.b: "Mm. Purely for quality. One more."

 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "Dress the Part"
 gdp_trade_good_flavor.2006.desc: "If you want to sell [tgf_good.Custom('GetTradeGood')], wear [tgf_good.Custom('GetTradeGood')]. I arrive at the market dressed in the best of my own stock, and watch the buyers look twice.\n\nThe goods speak. I merely wear them."
 gdp_trade_good_flavor.2006.a: "It fits. It stays."
 gdp_trade_good_flavor.2006.a.tt_furs: "You wear your fur cloak from now on"
 gdp_trade_good_flavor.2006.a.tt_leather: "You wear your leather cloak from now on"
 gdp_trade_good_flavor.2006.a.tt_silk: "You wear your silk mantle from now on"
 gdp_trade_good_flavor.2006.a.tt_textiles: "You wear your fine cloak from now on"
 gdp_trade_good_flavor.2006.b: "Let the wares do the talking."

 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "Face Value"
 gdp_trade_good_flavor.2007.desc: ""The new [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')] will carry my face," [tgf_market_holder.GetTitledFirstName] tells me, "and your [tgf_good.Custom('GetTradeGood')]. I want a steady supply, at a friendly rate."\n\n[tgf_market_holder.GetHerHis|U] face, my metal, one coin. History will remember us both."
 gdp_trade_good_flavor.2007.a: "A friendly rate! Strike me the first one."
 gdp_trade_good_flavor.2007.b: "Full price. Coin is coin."
 gdp_trade_good_flavor.2007.c: "Friendly rate? I have better things to do."

 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "Intact"
 gdp_trade_good_flavor.2008.desc: ""Not one [tgf_good.Custom('GetTradeGoodUnit')] lost," my trader, [tgf_trader.GetFirstName], tells me, very pleased with [tgf_trader.GetHerselfHimself]. "Nothing spoiled, nothing broken, nothing stolen. Every [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] arrived the way it left."\n\nThat is not luck. That is skill, and skill can be taught."
 gdp_trade_good_flavor.2008.a: "Show me how you packed it."
 gdp_trade_good_flavor.2008.b: "Careful hands. Impressive."
 gdp_trade_good_flavor.2008.c: "Tell the buyers. Whole goods sell high."

 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "Other [ROOT.Char.Custom('WomenMen')|U] See Armies"
 gdp_trade_good_flavor.2009.desc: "War has come to [tgf_market_holder.GetTitledFirstName], and war eats [tgf_good.Custom('GetTradeGood')]. [tgf_market_holder.GetHerHis|U] quartermasters buy everything my route can carry and ask when more is coming.\n\nOther [ROOT.Char.Custom('WomenMen')] see armies. I see customers."
 gdp_trade_good_flavor.2009.a: "War pays in advance."
 gdp_trade_good_flavor.2009.b: "Privileges, in writing, now."
 gdp_trade_good_flavor.2009.c: "Remember who armed you."

 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "The Guild Knocks"
 gdp_trade_good_flavor.2010.desc: "The [tgf_source_culture.GetName] guild of [tgf_source_county.GetNameNoTier] writes to me, very politely. My prices undercut theirs, and they would like us to agree on a price together, before anyone gets hurt.\n\nGuilds knock politely, but only once."
 gdp_trade_good_flavor.2010.a: "Pay the fee. Fix the price."
 gdp_trade_good_flavor.2010.b: "Let them do their worst."

 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "Rulers Set Fashions"
 gdp_trade_good_flavor.2011.desc: "Word travels faster than carts: [tgf_market_holder.GetTitledFirstName] wore my [tgf_good.Custom('GetTradeGood')] before [tgf_market_holder.GetHerHis] whole court in [tgf_source_county.GetNameNoTier], and half of them have already asked where it came from.\n\nRulers set fashions. Merchants set prices."
 gdp_trade_good_flavor.2011.a: "Tell everyone whose [tgf_good.Custom('GetTradeGood')] that was."
 gdp_trade_good_flavor.2011.b: "Raise the price while they stare."

 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "Sample the Goods"
 gdp_trade_good_flavor.2012.desc: "The [tgf_good.Custom('GetTradeGoodUnitPlural')] of [tgf_good.Custom('GetTradeGood')] stare back at me. It has been a black month, my head will not quiet, and I am surrounded by the best drink money buys.\n\nQuality control. Nobody needs to know."
 gdp_trade_good_flavor.2012.a: "Quality control. All of it."
 gdp_trade_good_flavor.2012.a.toast: "One Sample Too Many"
 gdp_trade_good_flavor.2012.b: "No. Stock is stock."

 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "A Masterwork Order"
 gdp_trade_good_flavor.2013.desc: ""Give me your best [tgf_good.Custom('GetTradeGood')] and a master's fee," says [tgf_crafter.GetFirstName], the finest [tgf_good.Custom('GetTgfGoodCrafter')] in [tgf_source_county.GetNameNoTier], "and I will make you something no one has seen before."\n\nMy purse considers. My pride has already agreed."
 gdp_trade_good_flavor.2013.a: "Fee agreed. Astonish me."
 gdp_trade_good_flavor.2013.b: "My goods need no dressing up."

 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "Their Dish, Our Goods"
 gdp_trade_good_flavor.2014.desc: ""They put your [tgf_good.Custom('GetTradeGood')] in their [tgf_source_province.Custom('GetTgfLocalDish')] now," my trader, [tgf_trader.GetFirstName], says, partaking. "Everyone in [tgf_source_county.GetNameNoTier] does. The cooks call it the new way, and nobody remembers the old one."\n\nI have never even tasted their [tgf_source_province.Custom('GetTgfLocalDish')]. I have never been prouder."
 gdp_trade_good_flavor.2014.a: "Then they can pay for the new way."
 gdp_trade_good_flavor.2014.b: "More carts. The cooks are hungry."

 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "Paid in Goods"
 gdp_trade_good_flavor.2015.desc: ""We want more coin," says [tgf_spokesperson.GetFirstName], speaking for the [tgf_good.Custom('GetTgfGoodGatherers')] of [tgf_source_county.GetNameNoTier]. I offer them [tgf_good.Custom('GetTradeGood')] instead.\n\n"You gather it," I point out. "Surely you like it!"\n\nThey do not like it."
 gdp_trade_good_flavor.2015.a: "Pay them. In coin."
 gdp_trade_good_flavor.2015.b: "Cut them in on the profit."
 gdp_trade_good_flavor.2015.c: "Goods are wages too."

 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "Money Doesn't Stink"
 gdp_trade_good_flavor.2016.desc: ""It stinks," says a buyer in [tgf_source_county.GetNameNoTier], holding my [tgf_good.Custom('GetTradeGood')] at arm's length. [tgf_good.Custom('GetTgfGoodFlaw')|U], I am told.\n\nI take the buyer's coin and sniff it. [Glossary( 'It smells of nothing at all', 'TGF_PECUNIA_NON_OLET_GLOSS' )]."
 gdp_trade_good_flavor.2016.a: "Sell to buyers with head colds."
 gdp_trade_good_flavor.2016.b: "Perhaps there's something for the smell?"
 gdp_trade_good_flavor.2016.c: "Keep the coin under my nose. All day."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#! — 'money does not stink'. The Roman emperor Vespasian is said to have held a coin from his tax on public urinals under his son's nose to make the point."

 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "Seven Fat Years"
 gdp_trade_good_flavor.2017.desc: "I dream of seven fat cows and seven lean ones[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]. I wake up and do the sums before breakfast.\n\nWhatever the lean years cost, my [tgf_good.Custom('GetTradeGood')] will cost more."
 gdp_trade_good_flavor.2017.a: "Store it all. Every last [tgf_good.Custom('GetTradeGoodUnit')]."
 gdp_trade_good_flavor.2017.b: "Buy more now, while it is cheap."
 gdp_trade_good_flavor.2017.c: "Cows are not ledgers. Back to sleep."

 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "Somebody's Cattle"
 gdp_trade_good_flavor.2018.desc: "I come out to find my gate blocked by a whole herd of [tgf_good.Custom('GetTradeGood')], and my trader, [tgf_trader.GetFirstName], grinning in the middle of it. "[tgf_raider.GetFirstName], a [Glossary( 'raider', 'TGF_CATTLE_RAID_GLOSS' )], brought these in from [tgf_market_holder.GetTitledFirstNamePossessive] pastures. Do not ask how. Half the market price."\n\n[tgf_market_holder.GetFirstNamePossessiveNoTooltip|U] brand is on every flank.\n\n"Brands," [tgf_trader.GetFirstNameNoTooltip] adds, "can be changed.""
 gdp_trade_good_flavor.2018.a: "A bargain is a bargain, whatever the brand."
 gdp_trade_good_flavor.2018.a.toast: "Someone Knew the Brand"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U] knowingly bought beasts stolen from [CHARACTER.GetShortUINamePossessive] herds."
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U] knowingly bought beasts stolen from [TARGET_CHARACTER.GetShortUINamePossessive] herds."
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] will owe me for these."
 gdp_trade_good_flavor.2018.c: "Slaughter them quickly."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "Raiding a neighbor's herds was an old sport and a serious business. Ireland's great epic, the Táin Bó Cúailnge, tells of a war fought over a single bull."

 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "A Dry Court's Thirst"
 gdp_trade_good_flavor.2019.desc: ""[tgf_market_holder.GetTitledFirstNamePossessive] court never drinks [tgf_good.Custom('GetTradeGood')]," my trader, [tgf_trader.GetFirstName], tells me. "[tgf_market_holder.GetTitledFirstNamePossessiveNoTooltip] court has also ordered forty [tgf_good.Custom('GetTradeGoodUnitPlural')] of ours. Both are true, apparently."\n\n[tgf_market_holder.GetFirstNamePossessiveNoTooltip] faith [Glossary( 'forbids the drinking', 'TGF_ABU_NUWAS_GLOSS' )]. Nothing forbids the overcharging."
 gdp_trade_good_flavor.2019.a: "Label the barrels as vinegar."
 gdp_trade_good_flavor.2019.b: "Double the price. Who would they complain to?"
 gdp_trade_good_flavor.2019.b.toast: "Another Supplier"
 gdp_trade_good_flavor.2019.b.toast_good: "Paid in Full"
 gdp_trade_good_flavor.2019.c: "Not worth my neck. Sell elsewhere."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "Wine was forbidden at many courts and loved at most of them. Abu Nuwas, poet at the court of the caliph Harun al-Rashid, wrote some of the finest wine poems in Arabic."

 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "A Perfect Wheel"
 gdp_trade_good_flavor.3001.desc: "The warehouse smells of it before I see it. A wheel of cheese so ripe and rich that the porters have posted a guard, half in jest. Half.\n\nSell it, and it buys a feast. Keep it, and it is one."
 gdp_trade_good_flavor.3001.a: "Guard it with your lives."
 gdp_trade_good_flavor.3001.b: "Everything has a price. Even perfection."

 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "A Famous Complaint"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "The oldest customer complaint known: a clay tablet from Ur, nearly three thousand years old even now, in which one Nanni berates the merchant Ea-nasir for delivering poor copper ingots and treating his messenger with contempt."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName] writes that my copper is poor and my ingots are light. All true.\n\n"What do you take me for, that you treat me with such [Glossary( 'contempt', 'TGF_EA_NASIR_GLOSS' )]?"\n\nI take [tgf_market_holder.GetHerHim] for a good customer. [tgf_market_holder.GetSheHe|U] has already paid."
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.GetSheHe|U] will buy again. [tgf_market_holder.GetSheHe|U] always does."
 gdp_trade_good_flavor.3002.a.toast: "Never Again"
 gdp_trade_good_flavor.3002.a.toast_good: "Back for More"
 gdp_trade_good_flavor.3002.b: "My copper is true. Let [tgf_market_holder.GetHerHim] test it!"
 gdp_trade_good_flavor.3002.b.toast_bad: "Caught Out"
 gdp_trade_good_flavor.3002.b.toast_good: "The Test Holds"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U] sold [CHARACTER.GetShortUIName] light ingots, and swore they were true."
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U] sold [TARGET_CHARACTER.GetShortUIName] light ingots, and swore they were true."
 gdp_trade_good_flavor.3002.c: "An apology, and better ingots next time."

 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "Paid in Pepper"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "Pepper was worth nearly its weight in silver, and often taken as payment. In London, the laws of King Æthelred, around the year 1000, set part of the toll on German merchants in pepper."
 gdp_trade_good_flavor.3003.desc: "A debtor of mine in [tgf_source_county.GetNameNoTier], [tgf_debtor.GetFirstName], has no coin left. So [tgf_debtor.GetSheHe] pays in [Glossary( 'pepper', 'TGF_PEPPER_GLOSS' )] instead, [tgf_good.Custom('GetTradeGoodUnit')] by tiny [tgf_good.Custom('GetTradeGoodUnit')], until my table smells like a spice market.\n\nI count it twice. Not a bad rate. And [tgf_debtor.GetFirstNameNoTooltip] cannot be the only one."
 gdp_trade_good_flavor.3003.a: "Henceforth, I accept pepper."
 gdp_trade_good_flavor.3003.b: "Coin. Scrape it together."
 gdp_trade_good_flavor.3003.c: "Work for me. The debt can wait."

 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "A Letter Full of Complaints"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "Merchants' letters hoarded for centuries — like those preserved in the Cairo Geniza, a synagogue storeroom of discarded papers — record Mediterranean trade in exhaustive, aggrieved detail. The flax dealers complain the most."
 gdp_trade_good_flavor.3004.desc: "My trader, [tgf_trader.GetFirstName], has sold every bale of my flax in [tgf_source_county.GetNameNoTier] at a fine price. [tgf_trader.GetHerHis|U] [Glossary( 'letter', 'TGF_GENIZA_GLOSS' )] says so — in one line. The other forty complain: the damp, the porters, the buyers, my packing.\n\nProfit first, grumbling after. The reverse would worry me."
 gdp_trade_good_flavor.3004.a: "One line of profit. I read that one twice."
 gdp_trade_good_flavor.3004.b: "Forty lines of free advice."

 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "A Subtlety"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "A showpiece of sugar and almond paste served between feast courses — castles, ships, and beasts sculpted to astonish the guests. The grandest subtleties were political statements as much as desserts."
 gdp_trade_good_flavor.3005.desc: ""[tgf_market_holder.GetTitledFirstName] wants a sugar [ROOT.Char.Custom('GetRandomRegionalBird')]," my trader, [tgf_trader.GetFirstName], tells me. "Twice the size of life, every feather picked out, on [tgf_market_holder.GetHerHis] table by midsummer. A [Glossary( 'subtlety', 'TGF_SUBTLETY_GLOSS' )] to crown [tgf_market_holder.GetHerHis] feast."\n\nSugar melts. Reputations keep."
 gdp_trade_good_flavor.3005.a: "I will make it. Larger than life."
 gdp_trade_good_flavor.3005.a.success: "The Feast Falls Silent"
 gdp_trade_good_flavor.3005.a.failure: "A Lopsided Bird"
 gdp_trade_good_flavor.3005.b: "Feast prices for feast pieces."
 gdp_trade_good_flavor.3005.c: "I sell sugar, not sculptures."

 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "The Swarm"
 gdp_trade_good_flavor.3006.desc: "The bees arrived uninvited, built between the rafters, and are now producing honey in my warehouse, rent-free.\n\nTenants who pay in honey. There are worse arrangements — if one ignores the stings."
 gdp_trade_good_flavor.3006.a: "Free honey. What could it cost?"
 gdp_trade_good_flavor.3006.a.toast: "Stung!"
 gdp_trade_good_flavor.3006.b: "Let them work. Rent-free."

 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "Another Pot of Tea"
 gdp_trade_good_flavor.3007.desc: "One cup, to know the wares. Then another, because the first worked. By midnight I have re-counted three ledgers and composed two letters, and I feel magnificent.\n\nThis is either a very fine cargo or a very expensive habit."
 gdp_trade_good_flavor.3007.a: "Another pot. Every morning."
 gdp_trade_good_flavor.3007.b: "Serve it to the whole company."

 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "Before It Turns"
 gdp_trade_good_flavor.3008.desc: "My trader, [tgf_trader.GetFirstName], opens a [tgf_good.Custom('GetTradeGoodUnit')] of [tgf_good.Custom('GetTradeGood')] and winces. "The river fog got in. Soft now — by the week's end it will be mold."\n\nDried fruit keeps for years. Wet fruit keeps for days. Time is money."
 gdp_trade_good_flavor.3008.a: "Dry it again, and dry it properly."
 gdp_trade_good_flavor.3008.b: "Let it ferment. Call it wine."

 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "The Midnight Oil"
 gdp_trade_good_flavor.3009.desc: "The lamp oil runs out an hour before the ledgers do, so I burn my own stock, the good [tgf_good.Custom('GetTradeGood')] meant for sale. It burns no brighter than the cloudy dregs we throw away.\n\nNo brighter. Yet the buyers pay three times as much for it."
 gdp_trade_good_flavor.3009.a: "Sell the dregs for lamps, the good oil for tables."
 gdp_trade_good_flavor.3009.b: "Burn on. The accounts come first."
 gdp_trade_good_flavor.3009.c: "Bed. The oil can rest too."

 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "In the Blade"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "Grain bought 'in the blade' was paid for while still green in the field, at a price far below what the harvest would fetch. Preachers and canon lawyers condemned the practice as usury in disguise."
 gdp_trade_good_flavor.3010.desc.condemned: "My faith calls it usury. My ledger calls it a discount."
 gdp_trade_good_flavor.3010.desc.permitted: "Some faiths call it usury. Mine calls it foresight."
 gdp_trade_good_flavor.3010.desc.intro: ""It is green now, but it will be gold by summer," [tgf_peasant.GetFirstName] of [tgf_source_county.GetNameNoTier] tells me, mud to the knee. "Pay me today's price for it, [Glossary( 'in the blade', 'TGF_IN_THE_BLADE_GLOSS' )], and the harvest is yours."\n\n"
 gdp_trade_good_flavor.3010.a: "Next year's harvest, at this year's price."
 gdp_trade_good_flavor.3010.b: "Keep your crop until it is grown."

 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "Ten-Year Millet"
 gdp_trade_good_flavor.3011.desc: "Behind the newer stock, I find [tgf_good.Custom('GetTradeGoodUnitPlural')] of millet from years ago, forgotten and miscounted. Every grain is still good. Millet keeps.\n\nFree stock from past me. The best kind of inheritance."
 gdp_trade_good_flavor.3011.a: "Sell it. Past me would want it that way."
 gdp_trade_good_flavor.3011.b: "Pack it for the road. Millet keeps."
 gdp_trade_good_flavor.3011.c: "Recount the whole warehouse."

 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "Polished or Not"
 gdp_trade_good_flavor.3012.desc: "Polished rice is white, light, and wanted at every high table. Unpolished rice is heavy, brown, and wanted everywhere else. My trader, [tgf_trader.GetFirstName], wants to know which kind of merchant I am.\n\nI'm the kind who gets paid."
 gdp_trade_good_flavor.3012.a: "Polish it. High tables pay high."
 gdp_trade_good_flavor.3012.b: "Sell it brown, and cheap, to everyone."
 gdp_trade_good_flavor.3012.c: "Polish the best. Sell the rest brown."

 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "Before the Fast"
 gdp_trade_good_flavor.3013.desc: ""[tgf_source_faith.Custom('GetTgfFastName')] begins soon!" my trader, [tgf_trader.GetFirstName], writes from [tgf_source_county.GetNameNoTier] in a hurry. "Nobody will touch meat for weeks — and after, they will want nothing else."\n\nA hungry buyer never haggles."
 gdp_trade_good_flavor.3013.desc_ramadan: ""Ramadan begins soon!" my trader, [tgf_trader.GetFirstName], writes from [tgf_source_county.GetNameNoTier] in a hurry. "Nobody eats until sunset, and after sunset, nobody eats anything but meat."\n\nA hungry buyer never haggles."
 gdp_trade_good_flavor.3013.a: "I keep the fast too. The meat can wait."
 gdp_trade_good_flavor.3013.b: "Salt it, and wait for the hunger."
 gdp_trade_good_flavor.3013.c: "Sell it all at the last feast before the fast."

 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "Look It in the Mouth"
 gdp_trade_good_flavor.3014.desc: "[tgf_dealer.GetFirstName|U] the horse-dealer swears by everything [tgf_dealer.GetSheHe] holds holy. "Four years old, friend, five at most. Look at that coat!" The coat is very fine. The teeth, I notice, [tgf_dealer.GetSheHe] keeps steering me away from.\n\nThere is a saying about gift horses. This one is not a gift."
 gdp_trade_good_flavor.3014.a: "Open wide. Let us see those teeth."
 gdp_trade_good_flavor.3014.b: "Old or not, this one is mine."
 gdp_trade_good_flavor.3014.c: "Your word is good. Join my company."

 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "Fatten for Market"
 gdp_trade_good_flavor.3015.desc: ""The herd reached [tgf_source_county.GetNameNoTier] lean and tired, like their own ghosts," my trader, [tgf_trader.GetFirstName], tells me. "[tgf_market_holder.GetTitledFirstName] has good grazing nearby, and offers it to us. For a fee, of course."\n\nFat sells. Grass is cheaper than fat."
 gdp_trade_good_flavor.3015.a: "Pay for the grass. Sell the fat."
 gdp_trade_good_flavor.3015.b: "Lean beasts still have a price."

 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "Calfskin for the Scribes"
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.GetTitledFirstName], chaplain to [tgf_market_holder.GetTitledFirstName], walks my tannery like a pilgrim choosing relics. "These, scraped thin, would carry the holy words for a thousand years," [tgf_chaplain.GetSheHe] says.\n\nA thousand years of my leather. Not bad for a cow."
 gdp_trade_good_flavor.3016.a: "Take the best ones, as a gift."
 gdp_trade_good_flavor.3016.b: "For the scribes, then. Let it last."
 gdp_trade_good_flavor.3016.c: "I'd rather sell to cobblers."

 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "Buying the Clip"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "Cistercian abbeys sold their wool clip — the year's shearing — to Italian and Flemish merchants years ahead, taking coin now for fleeces not yet grown. Many houses sank deep into debt doing it."
 gdp_trade_good_flavor.3017.desc: ""[tgf_abbot.GetTitledFirstName] offers us the wool of [tgf_abbey.GetNameNoTier] for years to come," my trader, [tgf_trader.GetFirstName], tells me. "[Glossary( 'Years of clip', 'TGF_WOOL_CLIP_GLOSS' )], paid now, delivered fleece by fleece. They want the coin today."\n\nThey plan far ahead. So do merchants."
 gdp_trade_good_flavor.3017.a: "Coin now, wool for years."
 gdp_trade_good_flavor.3017.b: "I prefer my sheep already shorn."

 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "The Vegetable Lamb"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "A legend repeated by travelers and scholars alike: in the far east grows a plant that bears living lambs on its stalk, which graze the ground around them until the stem withers. It was one way to explain cotton, a wool that grew on plants."
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName|U], a buyer in [tgf_source_county.GetNameNoTier], turns a tuft of my cotton over in wonder. "Is it true? They say it grows on a plant that bears little lambs, which graze until the stem gives out."\n\n[Glossary( 'The vegetable lamb', 'TGF_VEGETABLE_LAMB_GLOSS' )]. Wonders sell."
 gdp_trade_good_flavor.3018.a: "True, every word. And very rare."
 gdp_trade_good_flavor.3018.b: "No lambs. Just a very fluffy plant."

 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "Spolia"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "Stone taken from old buildings and reused in new ones. Columns, carvings, and inscribed blocks from ancient ruins found their way into churches, walls, and houses across the medieval world."
 gdp_trade_good_flavor.3019.desc: ""The quarrymen have stopped quarrying," my trader, [tgf_trader.GetFirstName], confesses in a letter from [tgf_source_county.GetNameNoTier]. "They are cutting from the old ruins instead — columns, carvings, all of it."\n\n[Glossary( 'Spolia', 'TGF_SPOLIA_GLOSS' )]. Old stone, new price."
 gdp_trade_good_flavor.3019.a: "Antique stone, at antique prices."
 gdp_trade_good_flavor.3019.b: "Keep the finest carving for me."

 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "The Mast Trunk"
 gdp_trade_good_flavor.3020.desc: ""[tgf_market_holder.GetTitledFirstNamePossessive] shipwrights want our [tgf_good.Custom('GetTradeGood')]," my trader, [tgf_trader.GetFirstName], tells me. "Not just any wood. The longest, straightest trunks we have, for masts. They know perfect wood is rare."\n\nRare things should never be sold in a hurry."
 gdp_trade_good_flavor.3020.a: "The best trunk is for my own ship."
 gdp_trade_good_flavor.3020.b: "Sold. Masts wait for no one."
 gdp_trade_good_flavor.3020.c: "Let them wait. The price will grow."

 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "The Tent of Smoke"
 gdp_trade_good_flavor.3021.t_bhang: "A Cup of Bhang"
 gdp_trade_good_flavor.3021.t_hashish: "Sweets Behind Closed Doors"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "Herodotus wrote that the Scythians threw hemp seed onto red-hot stones inside closed felt tents, and howled with joy in the smoke. Steppe peoples kept the custom long after."
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.GetSheHe|U] throws hemp seed on the hot stones of [tgf_hemp_host.GetHerHis] tent, and the smoke rises. "[Glossary( 'Breathe', 'TGF_HEMP_TENT_GLOSS' )], merchant. This is how we do business here."\n\nPurely for business reasons, of course."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "The Atharvaveda names bhang among the five sacred plants. Hemp leaves are ground with milk, ghee and spice into a drink taken at festivals and offered to Shiva."
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.GetSheHe|U] grinds hemp leaves with milk and spice, and hands me a cup. "[Glossary( 'Bhang', 'TGF_HEMP_BHANG_GLOSS' )], merchant. At festival time the whole town drinks it. Tonight, so do you."\n\nRefusing would be rude, and rudeness is bad for business."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "Hashish, hemp resin eaten in pastes and sweets, spread through Egypt and Syria from the twelfth century. Some Sufis praised it as a path to ecstasy, while jurists condemned it and rulers had whole fields burned."
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.GetSheHe|U] closes the door and unwraps a little sweet of pressed hemp resin. "[Glossary( 'Hashish', 'TGF_HEMP_HASHISH_GLOSS' )], merchant. The jurists frown on it. The jurists are not here."\n\nIt would be rude to refuse a buyer."
 gdp_trade_good_flavor.3021.desc.intro: ""[tgf_good.Custom('GetTradeGood')|U] [tgf_good.Custom('GetTgfHempUse')]?" [tgf_hemp_host.GetTitledFirstName] of [tgf_source_county.GetNameNoTier] laughs. "We have a better use for [tgf_good.Custom('GetTgfGoodItThem')]."\n\n"
 gdp_trade_good_flavor.3021.a: "Business is business. Pass the seed."
 gdp_trade_good_flavor.3021.a_bhang: "Business is business. Pass the cup."
 gdp_trade_good_flavor.3021.a_hashish: "Business is business. Pass the sweets."
 gdp_trade_good_flavor.3021.b: "Sell it. Keep my own head clear."
 gdp_trade_good_flavor.3021.a.toast_habit: "A New Habit"

 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "A Blade From My Best"
 gdp_trade_good_flavor.3022.desc: "A smith from [tgf_source_county.GetNameNoTier] named [tgf_smith.GetFirstName] weighs one of my iron ingots in [tgf_smith.GetHerHis] palm and grins. "Give me the best of these, and I will give you a blade worth ten times the metal."\n\nTen times. [tgf_smith.GetSheHe|U] knows how to talk to a merchant."
 gdp_trade_good_flavor.3022.a: "Forge it. Make it worth the boast."
 gdp_trade_good_flavor.3022.b: "Teach me which ingots are the best."

 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "The Lapidary's Claim"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "A cutter and polisher of gems, and often a reader of lapidaries: books listing the hidden powers of every stone, from sapphires against poison to amethysts against drunkenness."
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U], a [Glossary( 'lapidary', 'TGF_LAPIDARY_GLOSS' )] of [tgf_source_county.GetNameNoTier], holds one of my gems to the light with great seriousness. "This stone wards off [ROOT.Char.Custom('GetTgfAilment')]. It is written in the books."\n\nIt is not written on the price. Yet."
 gdp_trade_good_flavor.3023.a: "Sold with the claim. Priced to match."
 gdp_trade_good_flavor.3023.b: "Join my company. Bring your books."
 gdp_trade_good_flavor.3023.c: "I will not argue with the books."

 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "The Gentleman's Stone"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], a connoisseur of jade, taps each of my pieces against [tgf_connoisseur.GetHerHis] teeth and listens. Two [tgf_connoisseur.GetSheHe] sets aside. "Soapstone. Very good soapstone." The rest earns a slow, approving nod.\n\nA [tgf_connoisseur.GetWomanMan] who can tell true from false is worth more than either."
 gdp_trade_good_flavor.3024.a: "Smash the fakes. Name the supplier."
 gdp_trade_good_flavor.3024.b: "Join my company. Your eye is worth wages."
 gdp_trade_good_flavor.3024.c: "Teach me the trick with the teeth."

 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "Porcelain Ballast"
 gdp_trade_good_flavor.3025.desc: "My trader, [tgf_trader.GetFirstName], is very pleased with [tgf_trader.GetHerselfHimself]. "The ship needed ballast — and our [tgf_good.Custom('GetTradeGoodUnitPlural')] of ceramics are heavy. The captain charged us almost nothing."\n\nCargo that pays its own passage. My favorite kind."
 gdp_trade_good_flavor.3025.a: "Put the savings into the next cargo."
 gdp_trade_good_flavor.3025.b: "Learn to stow it as ballast."

 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "The Sap Bites"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "Lacquer does not dry in the air. Each coat of tree sap must harden for days in a warm, damp room, and a fine piece takes dozens of coats. Until it hardens, the sap blisters any skin it touches."
 gdp_trade_good_flavor.3026.desc: "The new [tgf_good.Custom('GetTradeGoodUnitPlural')] of lacquerware arrived before the last coat [Glossary( 'cured', 'TGF_LACQUER_CURE_GLOSS' )]. The finish looks perfect — deep, glossy, almost wet. My fingers itch to test it.\n\nLacquer-makers say the sap bites. I suspect they are exaggerating."
 gdp_trade_good_flavor.3026.a: "Build a damp room to cure it right."
 gdp_trade_good_flavor.3026.b: "One touch. Just to be sure."
 gdp_trade_good_flavor.3026.b.toast_rash: "The Lacquer Bites"
 gdp_trade_good_flavor.3026.c: "Let it cure. Good things wait."

 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "Reading Stones"
 gdp_trade_good_flavor.3027.desc.intro: "A glassmaker from [tgf_source_county.GetNameNoTier] named [tgf_glassmaker.GetFirstName] sets two polished stones on my ledger. The tiny numbers swell up, sharp and black. "For old eyes, friend. Or tired ones."\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "Mine are both. For the first time in years, I can read the small print on every contract."
 gdp_trade_good_flavor.3027.desc.young_eyes: "My eyes are neither. But I can read the small print on every contract now."
 gdp_trade_good_flavor.3027.a: "A pair for me. Wrap them well."
 gdp_trade_good_flavor.3027.b: "Send a pair to [tgf_market_holder.GetTitledFirstNameNoTooltip]."
 gdp_trade_good_flavor.3027.c: "Not the stones. The secret of them."

 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "Feast-Day Prices"
 gdp_trade_good_flavor.3028.desc.christian: ""The holy days are coming," my trader, [tgf_trader.GetFirstName], tells me, fresh from [tgf_source_county.GetNameNoTier]. "Every buyer wants incense fit for the Magi, and nobody haggles over what they burn at the altar."\n\n"
 gdp_trade_good_flavor.3028.desc: ""The holy days are coming," my trader, [tgf_trader.GetFirstName], tells me, fresh from [tgf_source_county.GetNameNoTier]. "Every buyer wants incense fit for the holiest shrine, and nobody haggles over what they burn at the altar."\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "A buyer who does not haggle is a gift from [ROOT.Char.GetFaith.HighGodName]."
 gdp_trade_good_flavor.3028.a: "I will burn some myself, for the feast."
 gdp_trade_good_flavor.3028.b: "The temple gets first pick, at cost."
 gdp_trade_good_flavor.3028.c: "Feast days, feast prices."

 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "Theriac"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "A famous cure-all, brewed from dozens of ingredients, often including viper's flesh and opium, and left to mature for years. Physicians prescribed it against poison, plague, and nearly everything else."
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U], an apothecary of [tgf_source_county.GetNameNoTier], sends a missive smelling of herbs. "Your stock is exactly what I need for [Glossary( 'theriac', 'TGF_THERIAC_GLOSS' )]. Against poison, plague, and every other ill."\n\nWhether it works is between [tgf_apothecary.GetHerHim] and [tgf_apothecary.GetHerHis] patients. My part is the selling."
 gdp_trade_good_flavor.3029.a: "Brew it, and sell it along my roads."
 gdp_trade_good_flavor.3029.b: "All sixty-four ingredients. From me."
 gdp_trade_good_flavor.3029.c: "Teach me the recipe. And a dose."

 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "No Paper for Charters"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "In 1231, Emperor Frederick II forbade the notaries of his Kingdom of Sicily to write public documents on paper, which he thought too fragile to trust. Parchment alone would do."
 gdp_trade_good_flavor.3030.desc: ""[tgf_market_holder.GetTitledFirstNamePossessive] clerks [Glossary( 'will not touch paper', 'TGF_PAPER_GLOSS' )] for anything official," my trader, [tgf_trader.GetFirstName], tells me, back from [tgf_source_county.GetNameNoTier] and still disgusted. "Parchment only, they say. As if it were holy."\n\nEvery rule can be argued with."
 gdp_trade_good_flavor.3030.a: "Argue the case. Paper is the future."
 gdp_trade_good_flavor.3030.a.success: "The chancery takes paper"
 gdp_trade_good_flavor.3030.a.failure: "The chancery stays with parchment"
 gdp_trade_good_flavor.3030.b: "Then they will buy my parchment."
 gdp_trade_good_flavor.3030.c: "Then I will learn what they do want."

 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "Gruit or Hops"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "A mix of herbs, such as bog myrtle and yarrow, that flavored and preserved ale before hops. Many rulers held the sole right to sell it, and so taxed every brew."
 gdp_trade_good_flavor.3031.desc: ""Hops," [tgf_brewer.GetFirstName], a brewer of [tgf_source_county.GetNameNoTier], whispers over my barrels. "Beer that keeps for months. And no one can tax hops." In [tgf_source_county.GetNameNoTier], every brewer must buy [tgf_market_holder.GetTitledFirstNamePossessive] [Glossary( 'gruit', 'TGF_GRUIT_GLOSS' )], and pay [tgf_market_holder.GetHerHis] tax with it.\n\nSomebody always pays for progress."
 gdp_trade_good_flavor.3031.a: "Hops it is. Let it travel."
 gdp_trade_good_flavor.3031.b: "Gruit, as the [tgf_market_holder.GetTitleAsNameNoTooltip|l] prefers."
 gdp_trade_good_flavor.3031.c: "A little of both, in every barrel."

 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "A Basket of Fruit"
 gdp_trade_good_flavor.3032.desc: "In [tgf_source_county.GetNameNoTier], [tgf_fruit_province.Custom('get_region_fruit_plural')] are eaten by the basket, and hardly any travel farther than the next village.\n\nDried, they would keep. Shipped, they would sell. I eat one, and reach for my ledger."
 gdp_trade_good_flavor.3032.a: "Find out who grows them, and how many."
 gdp_trade_good_flavor.3032.b: "Another one. For research."
