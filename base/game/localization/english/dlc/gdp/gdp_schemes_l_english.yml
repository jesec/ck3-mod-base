 scheme_critical_moments.1142.desc_patrician_self: "All the effort put into my campaign of self-promotion has paid off.\n\nMy standing among my peers has improved, new supporters are flocking to my [house|E], and my goal is closer to reach than ever!"
 scheme_critical_moments.1142.desc_patrician_other: "So much time and so many resources poured into promoting [target.GetTitledFirstNamePossessive] cause have borne fruit.\n\n[target.GetHerHis|U] reputation among [target.GetHerHis] peers has improved, new supporters are now convinced of [target.GetHerHis] value, and [target.GetHerHis] standing in the [republic|E] is now one step higher!"
 scheme_critical_moments.1143.desc_patrician_self: "All the energies and resources poured into my campaign of self-promotion were simply not enough. No one was convinced of my worth or swayed by my promises or bribes, and so my standing remains unchanged.\n\nI will need to think of something different to promote my [house|E]."
