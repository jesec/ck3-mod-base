 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.8602.desc: "The magistrates of [trade_post_county.GetName] have a price, and it turns out to be a modest one. Seal by seal, the tenancy in [trade_post_province.GetName] passes to us.\n\nBy the time [target.GetTitledFirstName] hears of it, our factors are already turning out [target.GetHerHis] clerks and painting over [target.GetHerHis] colors above the door."
 scheme_critical_moments.8602.a: "A fine address, and now it is ours."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.8603.desc: "Every bribe was taken, and every promise was broken. The magistrates of [trade_post_county.GetName] pocketed my coin without so much as upholding my ownership.\n\n[target.GetTitledFirstNamePossessive|U] hold on the place remains unshaken."
 scheme_critical_moments.8603.discovered: "\n\nWorse still, [target.GetTitledFirstNameNoTooltip] knows precisely whose hand was reaching for [target.GetHerHis] purse..."
 scheme_critical_moments.8603.fallback: "\n\nAt least our part in the affair remains a secret."
 scheme_critical_moments.8603.a: "Coin wasted on faithless men."
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U] tried to seize your [trade_post|E] in [trade_post_province.GetNameNoTooltip], but failed!"
 scheme_critical_moments.8604.t: "Trade Post Seized: [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "A rider brings word from [trade_post_county.GetName]: our factor has been thrown into the street, and the local magistrates declared me unwelcome while naming another as owner of the trade post in [trade_post_province.GetName].\n\nYears of trade, storage, and hard-won goodwill — signed away by men we had already paid."
 scheme_critical_moments.8604.discovered: "\n\nAnd now [owner.GetTitledFirstName] stands in my place, as though it had always been [owner.GetHersHis]. We will #EMP not#! forget this!"
 scheme_critical_moments.8604.a: "Turned out of our own doorway!"

