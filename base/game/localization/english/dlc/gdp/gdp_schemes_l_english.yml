 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.8402.desc: "Deep in [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], I watch [target_patron.GetTitledFirstNamePossessive] magistrates languidly pore over reams of documents. Each satisfying stamp confirms another [target.GetHouse.GetName] asset transferred to [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l].\n\nThe serenity of a fly buzzing lazily over their heads is suddenly interrupted by [target.GetFirstName] bursting into the chamber.\n\n#EMP "YOU!#!", [target.GetSheHe] croaks with venom. "How?! #DIE2 Why...#!""
 scheme_critical_moments.8402.a: "It is just good business..."
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.8403.desc: "After so much to-ing and fro-ing, so much hectoring of [target_patron.GetTitledFirstName], we nonetheless could not clinch the final moves before [target.GetTitledFirstName] caught wind something was afoot...\n\n[target.GetPrimaryTitle.GetDefinitiveName] is now firmly in a defensive stance, scuppering our ability to outmaneuver the swines in the courts."
 scheme_critical_moments.8403.discovered: "\n\nTo top it all off, it is clear [target.GetTitledFirstNameNoTooltip] knows we are ones behind it..."
 scheme_critical_moments.8403.fallback: "\n\n[target.GetTitledFirstNamePossessiveNoTooltip] clear ignorance of our involvement is however a small silver-lining..."
 scheme_critical_moments.8403.a: "Typical..."
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U] tried to conduct a $hostile_takeover$ of [target.GetShortUINamePossessive] Company, but failed!"
 scheme_critical_moments.8404.t: "Hostile Takeover: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "As we turned our attention to the daily bean-counting of our routes and snuffled in the mud for prospects, today we learn our attention has been terribly misplaced.\n\nA curt missive arrived from [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], a formality confirming today's court proceedings, proceedings which will see our company dissolved, and its assets #EMP seized#! by [owner.GetPrimaryTitle.GetDefinitiveName|l]!\n\nBy the time I arrive it is too late, if indeed it ever was not...\n\nThat scoundrel, [owner.GetTitledFirstName] smirks at me, as I desperately pore over the documents, and all affirmed by my patron, [target_patron.GetTitledFirstName]!"
 scheme_critical_moments.8404.a: "How?! #DIE2 Why...#!"

