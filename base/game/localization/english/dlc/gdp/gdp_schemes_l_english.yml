 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "I could almost feel sorry for the [target.GetHouse.GetName] family, with how accommodating - even #EMP enthusiastic#! - their servants and supposed associates have been in exposing their most lurid secrets to my agents. #EMP Almost#!.\n\nThe proof in my hands is indisputable; [secret_holder.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]!"
 gdp_patrician_find_secrets.0002.a: "[secret_holder.GetHerHis|U] reputation is in my hands."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "My agents have combed through the [target.GetHouse.GetName] family's discarded papers, coerced their servants, and weighted the purses of every gossipmonger in the market, and still found nothing of value.\n\nWhatever secrets [target.GetTitledFirstName] keeps behind [target.GetHerHis] doors, they're either buried too deeply to discern or they don't exist at all."
 gdp_patrician_find_secrets.0003.desc.outmatched: "My agents have haunted the [target.GetHouse.GetName] family's every step, but failed to grasp so much as a pale shadow of their secrets. Their doors are shut tighter than a miser's purse and their servants guard their tongues so closely they may as well lack the organs entirely.\n\nWhatever depraved deeds [target.GetTitledFirstName] has committed, we know no more than when we started."
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]! It was all for nothing."

