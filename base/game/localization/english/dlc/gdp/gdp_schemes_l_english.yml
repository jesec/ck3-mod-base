 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: Success"
 scheme_critical_moments.8502.desc: "Bit by bit, stolen ledgers, weedled gossip, and favor-gleaned morsels paint a picture of [target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] many buyers, sellers, and other connections.\n\nThere is no doubt these insights will allow us to better compete for [target.GetTitledFirstNamePossessive] favored goods on a more equal footing."
 scheme_critical_moments.8502.discovered: "\n\nAlas, our digging has not gone unnoticed by [target.GetTitledFirstNameNoTooltip]..."
 scheme_critical_moments.8502.a: "Excellent!"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U] was able to $steal_market_insights$ from [target.GetShortUINamePossessive] Company, but was discovered!"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: Failure"
 scheme_critical_moments.8503.desc: "So many days sparring words with peddlers, and long nights whispering over spluttering candles, have brought us no closer to any insights into [target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] operations...\n\nEven the documents taken from [target.GetTitledFirstNamePossessive] own offices were meaningless scribbles or old tallies."
 scheme_critical_moments.8503.discovered: "\n\nTo make matters worse, it seems [target.GetTitledFirstNameNoTooltip] has caught wind of our intrigues."
 scheme_critical_moments.8503.fallback: "\n\nWe can however take some small comfort that [target.GetTitledFirstNameNoTooltip] has not caught wind of our scheme."
 scheme_critical_moments.8503.a: "A waste of time..."
 scheme_critical_moments.8503.tt.failed: "[scheme.GetOwner.GetShortUIName|U] tried to $steal_market_insights$ from [target.GetShortUINamePossessive] Company, but failed!"

