l_english: 
 gdp_merchant_activity_events.0001.t: "Unfed Appetites"
 gdp_merchant_activity_events.0001.desc: "As the merriment unfolds, I hear grumblings from hungry and increasingly agitated guests. The food platters hold only crumbs, and no servants rush to fill them.\n\n[guest.GetTitledFirstName] [guest.Custom('quirk_neg_present')], empty cup at [guest.GetHerHis] side, and asks, "What does one have to do to get a drink at this blasted feast?""
 gdp_merchant_activity_events.0001.host: "\n\nPerhaps this is a chance for me to help liven the occasion?"
 gdp_merchant_activity_events.0001.guest: "\n\nPerhaps this is a chance for me to help liven our host [host.GetTitledFirstNamePossessive] event?"
 gdp_merchant_activity_events.0001.a: ""Here, get [host.GetTitledFirstNamePossessiveNoTooltip] kitchen going, spare no expense!""
 gdp_merchant_activity_events.0001.a.host: ""Very well, I shall #EMP really#! get the kitchen going!""
 gdp_merchant_activity_events.0001.b: "Looks like I am in a good position to bargain."
 gdp_merchant_activity_events.0001.c: ""You should be more thankful, [guest.GetTitledFirstNameNoTooltip]!""
 gdp_merchant_activity_events.0001.d: ""If you don't like it, get out!""
 gdp_merchant_activity_events.0001.e: ""Dip into the company warehouse.""
 
 gdp_merchant_activity_events.0005.t: "An Exotic Request"
 gdp_merchant_activity_events.0005.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))], [admirer.GetTitledFirstName], waves me over to join [admirer.GetHerHis] conversation with [guest.GetTitledFirstName].\n\n[admirer.GetFirstNameNoTooltip] smiles with"
 gdp_merchant_activity_events.0005.desc_esteemed: "warmth"
 gdp_merchant_activity_events.0005.desc_fallback: "mirth"
 gdp_merchant_activity_events.0005.desc_outro: "in [admirer.GetHerHis] eyes, and says, "I was just speaking to my [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))] here about your [luxury_artifact.Custom('GetLuxuryArtifactSentiment')] discovery abroad. Go on, tell us how you managed to acquire your [luxury_artifact.GetName]!"\n\nIt is clear to me that the [admirer.Custom('NoblewomanNobleman')] wants me to jest and cavort myself for the pair's amusement."
 gdp_merchant_activity_events.0005.a: ""It was no grand feat...""
 gdp_merchant_activity_events.0005.b: ""I risked life and limb for that thing!""
 gdp_merchant_activity_events.0005.b.success: "Your embellishments sound authentic"
 gdp_merchant_activity_events.0005.b.failure: "You are caught in the lie"
 gdp_merchant_activity_events.0005.c: ""Listen here, and listen well!""
 gdp_merchant_activity_events.0005.d: ""It is nothing compared to the luxuries I trade in [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip].""

 gdp_merchant_activity_events.0010.t: "The Gift of Giving"
 gdp_merchant_activity_events.0010.desc: "As soon as my fellow merchant, [merchant.GetTitledFirstName], arrived, [merchant.GetSheHe] began flaunting [merchant.GetHerHis] wealth. [merchant.GetSheHe|U] fondles [merchant.GetHerHis] expensive jewelry, flashes [merchant.GetHerHis] fine [merchant.Custom('RegionalFabric')] robes, and shamelessly promotes the [good.Custom('GetTradeGoodUnitPlural')] of [good.Custom('GetTradeGood')] [merchant.GetSheHe] peddles in [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip].\n\nI catch [merchant.GetHerHim] in the act of giving a gift to my [ROOT.Char.Custom2('RelationToMeShort', receiver)], [receiver.GetTitledFirstName], before a gaggle of awed onlookers."
 gdp_merchant_activity_events.0010.a: "Two can play that game..."
 gdp_merchant_activity_events.0010.b: ""Such a thoughtful gift, [merchant.GetTitledFirstNameNoTooltip]!""
 gdp_merchant_activity_events.0010.b.success: "You show [merchant.GetFirstNameNoTooltip] up"
 gdp_merchant_activity_events.0010.b.failure: "You look foolish"
 gdp_merchant_activity_events.0010.c: "Whatever."
 gdp_merchant_activity_events.0010.d: ""It is bad form to boast to ones betters.""

 gdp_merchant_activity_events.0015.t: "A Peasant's Lot"
 gdp_merchant_activity_events.0015.desc: "The feast, with good drink, plentiful food, and a hearth's pleasant warmth, proves a stark contrast to the chill of the night outside.\n\nI just removed myself from the festivities to get some air when I spotted a destitute crowd: a number of commoners lingering by the walls, hoping to catch crumbs from the feast once it ends."
 gdp_merchant_activity_events.0015.a: "Let them eat and make merry, on me!"
 gdp_merchant_activity_events.0015.b: "I would rather share some [ROOT.Char.Custom('RegionalDrink')] with the nobles."
 gdp_merchant_activity_events.0015.b.alcohol: "I would rather share some [ROOT.Char.Custom('RegionalAlcoholicDrink')] with the nobles."
 gdp_merchant_activity_events.0015.c: "This is where I #EMP truly#! belong."
 gdp_merchant_activity_events.0015.d: "Away with you, pond scum!"
 custom.every_attending_noble: "Every attending [noble|E] [character|E]"

 gdp_merchant_activity_events.0020.t: "The Eye of the Beholder"
 gdp_merchant_activity_events.0020.desc: "Word reaches me that my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))] [other.GetTitledFirstName] wears the most exquisite [fake_artifact.GetNameNoTooltip] for the occasion.\n\nI locate the [other.GetWomanMan] in the great hall, appearing quite resplendent in [other.GetHerHis] gowns and the necklace resting on [other.GetHerHis] chest. [other.GetSheHe|U] [other.Custom('quirk_pos_present')] when I approach, and says, "Have you seen my latest purchase? Quite a price, don't you think?"\n\nThe warm light from the hall's many candles catches the gem in a pleasing manner but, with my trained eye, I cannot help but notice its many flaws."
 gdp_merchant_activity_events.0020.a: ""Hilarious! [other.GetFirstNameNoTooltip] believes this trinket is worth something.""
 gdp_merchant_activity_events.0020.b: "#weak *whispering*#! "Let me dispose of this faulty bauble for you.""
 gdp_merchant_activity_events.0020.b.tt: "You gain a [attraction|E] [opinion|E] [artifact|E]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "Acquired [fake_artifact.GetName] from [other.GetTitledFirstName]."
 gdp_merchant_activity_events.0020.c: ""A most precious item, indeed.""

 fake_artifact_name: "Gem Necklace"
 fake_artifact_desc: "A neat necklace that shines prettily although, upon closer examination, one can glean how sloppily the gems are cut."

 gdp_merchant_activity_events.0025.t: "A Road Well Traveled"
 gdp_merchant_activity_events.0025.desc: "Amidst the laughter and chatter of the hall, I hear an unexpected sound —"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP OOH OOH!#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP KEE KEE!#!"
 gdp_merchant_activity_events.0025.desc_cont: "— Someone brought a [luxury_artifact.Custom('GetDomicileArtifactCreatureType')] to the feast?\n\nSurveying the crowd, I spot the owner of the creature, a fellow merchant [merchant.GetTitledFirstName]. [merchant.GetSheHe|U] notices my curious glance, [merchant.Custom('quirk_pos_present')], and says, "I acquired this fine specimen during one of my many journeys. There is this lovely marketplace I frequently visit. A company secret." [merchant.GetSheHe|U] taps [merchant.GetHerHis] nose with a self-satisfied smirk."
 gdp_merchant_activity_events.0025.a: ""Oh, I think I know this place!""
 gdp_merchant_activity_events.0025.b: ""Could you be convinced to share the location?""
 gdp_merchant_activity_events.0025.b.success: "You make convincing arguments"
 gdp_merchant_activity_events.0025.b.failure: "You fail to make convincing arguments"
 gdp_merchant_activity_events.0025.c: ""Tell me more of your travels!""
 gdp_merchant_activity_events.0025.tt.menagerie: "Create a #V $menagerie_acquisition_contract$#! [luxury_contract_i][luxury_contract|E]"
 gdp_merchant_activity_events.0025.tt.curio: "Create a #V $find_curio_contract$#! [luxury_contract_i][luxury_contract|E]"
