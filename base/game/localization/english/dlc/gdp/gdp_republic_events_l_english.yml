l_english:
 republic_event.0001.t: "The [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "The foundations of our republic are finally laid! Petty tyrants and their hired thugs will no longer chain us to plow and furrow. Their squabbles will no longer bring us pain and sorrow.\n\nNow, united as one commune, we shall shape our own fate and defend our hard-won liberty. Let our city stand as a beacon of hope, and our walls as a shield against tyranny."
 republic_event.0001.a: "The beginning of a new era!"
 republic_event.0002.t: "The [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "The old ways have served us well, and we will always honor them. But the clan hall can no longer hold what we have become. Markets, walls, and the will of the people now demand a different kind of rule.\n\nToday we set aside [tribal|E] rule and found a [republic|E]. Let the city speak with one voice, and let that voice be ours."
 republic_event.0002.a: "The city will remember this"
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "I hereby inform you that I have revoked your trade post in [actor.GetCapitalLocation.GetBaronyNameExplicitly], effective immediately.\n\nIt is, of course, in [actor.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] best interest. I am sure you will understand."
 republic_event.0010.a: "But that was #EMP my#! trade post!"
 republic_event.0012.desc: "You are no longer welcome in [trade_post_target_county.GetNameNoTierNoTooltip]! Consider your trading rights revoked. Anything of value you have there will be confiscated and the trade post razed to the ground."
 republic_event.0012.a: "I'll have to find a new home for my trade goods..."
 republic_event.0020.t: "The [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] Treasury"
 republic_event.0020.intro: "The time has come to revise the republic's budget."
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U] stands before me, brow furrowed, ledger in hand. A small army of aides trails behind [steward.GetHerHim], burdened with scrolls, tomes, and fiscal notes.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip|U]. We #EMP must#! go over our expenses and prepare a new budget for the treasury. I fear the matter cannot wait."
 republic_event.0020.solo_desc: "I find myself surrounded by a small army of clerks, burdened with scrolls, tomes, and fiscal notes. All waiting for me to finish my review.\n\n"
 republic_event.0020.income_desc: "Our current income greatly exceeds our expenses and it can be put to better use."
 republic_event.0020.deficit_desc: "Our expenses are too great, and the treasury will collapse without action."
 republic_event.0020.fallback_desc: "It has been many years since the last budget was put into effect."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U] has already reviewed the budget and it is in good shape. [steward.GetSheHe|U] has no changes to make."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "Several documents with proposals lie before me, each charting a different course for the treasury — where to spend, and where to tighten the purse.\n\nWhich one do I choose?"
 republic_event.0021.a: "Make sure all are well paid."
 republic_event.0021.b: "Balanced salaries will serve us best."
 republic_event.0021.c: "We should prioritize additional funds for the state."
 republic_event.0021.a.info_desc: "[treasury_budget_category|E] Focus: @gold_icon![treasury_salary_budget_short|E]\nHigh salaries are typically liked by most [patricians|E]"
 republic_event.0021.b.info_desc: "[treasury_budget_category|E] Focus: @law_icon!Balanced\nA well balanced budget that ensures [patricians|E] have a decent salary and also leaves enough [treasury|E] for the [liege|E]"
 republic_event.0021.c.info_desc: "[treasury_budget_category|E] Focus: @treasury_icon!Realm\nA low salary budget means more money for the republic — granting the [liege|E] additional funds to spend as they see fit"

 republic_event.0030.desc: "I regret to inform you that I have rescinded all of your monopolies within my markets. Trade must be allowed to flow freely."
 republic_event.0030.a: "We shall have to compete like everyone else..."
 republic_event.0040.desc: "I regret to inform you that I have decided to remove you from the [actor.GetConfederation.GetName]."
 republic_event.0040.a: "Competitors once more"
 republic_event.0050.desc: "The assembly of the [title.GetName] has elected me to the august office of [new_holder.GetTitleAsNameNoTooltip] [new_holder.Custom('GetRepublicTermLength')]."
 republic_event.0051.desc: "I have been re-elected [new_holder.Custom('GetRepublicTermLength')]. Glory to the [title.GetName]."
 republic_term_length_1_desc: "for a term of [EmptyScope.ScriptValue('law_term_length_1_value')|0] years"
 republic_term_length_2_desc: "for a term of [EmptyScope.ScriptValue('law_term_length_2_value')|0] years"
 republic_term_length_3_desc: "for a term of [EmptyScope.ScriptValue('law_term_length_3_value')|0] years"
 republic_term_length_4_desc: "for a term of [EmptyScope.ScriptValue('law_term_length_4_value')|0] years"
 republic_term_length_5_desc: "for a term of [EmptyScope.ScriptValue('law_term_length_5_value')|0] years"
 republic_term_length_indefinite_desc: "for life"
 republic_event.0052.desc: "I have presented a new law to the august members of the assembly.\n\nThe "[new_law.GetNameNoTooltip]" proposal will be put to a vote after thorough deliberation."
 republic_event.0053.pass.desc: "The "[new_law.GetNameNoTooltip]" proposal has been approved and made into republic law!"
 republic_event.0053.rejected.desc: "The "[new_law.GetNameNoTooltip]" proposal has been rejected by the assembly."
 republic_event.law.TT: "#bold Proposed:#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P Passed:#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N Rejected:#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold Kept:#! [current_law.GetName]"
 republic_event.assembly.response: "Understood."
 republic_event.assembly.opening: "Fellow Citizens,"
 rescind_trade_monopoly_notification_base_desc: "All [trade_monopolies|E] have been cancelled in [actor.GetShortUINamePossessive] [trade_markets|E] that belonged to:"
 rescind_trade_monopoly_notification_confederation_desc: "The [recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "The [recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "Your [company|E]"
 
 republic_event.0100.t: "The Republic of Rome"
 republic_event.0100.desc: "Rome. To utter the word, not as the name of a city, but as a symbol, an #EMP ideal#!, has long been a dream of many. I have made that dream a reality.\n\nI hear the celebrations echoing from every corner of the realm. Citizens, nay, #EMP Romans#!, will find a tomorrow in which we are the center of civilization once again. Now begins the work of restoring the lost ideals of antiquity. To become a beacon of hope, a light to guide us in these dark times."
 republic_event.0100.a: "All roads shall lead to Rome once more."
 republic_event.0100.b: "Rome is not just a place, it is an ideal."
