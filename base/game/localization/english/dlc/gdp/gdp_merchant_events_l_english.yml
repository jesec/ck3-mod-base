 associate_request_fulfilled_title: "Associate Promise Fulfilled"
 associate_request_failed_title: "Associate Promise Failed"

 gdp_merchant.3000.t: "A Translator's Tip"
 gdp_merchant.3000.desc: "My translator, [translator.GetTitledFirstName], has been sequestered for some time, evidently working through some foreign text or other, when [translator.GetSheHe] finally appears.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]," [translator.GetSheHe] beams, "I have been looking at reports acquired in [market.GetName|l], the short-hand [saved_culture.GetLanguage.GetName] was tricky, but there is much here about the movement of local goods!""
 gdp_merchant.3000.a: ""I want every last morsel, [translator.GetFirstNameNoTooltip]!""
 gdp_merchant.3000.a.tt: "[company|E] gains [trade_expertise|E] in all [trade_categories_short|E] traded in [market.GetName]"
 gdp_merchant.3000.b: ""Could you teach me this tongue?""
 gdp_merchant.3000.b.tt: "Your [scheme|E] gains the [GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]"
 gdp_merchant.3000.c: ""Sell the findings to the highest bidder.""
 gdp_merchant.3000.d: ""Focus on your language skills.""
 gdp_merchant_translator_buff_modifier: "Translator Tutor"

 gdp_merchant.3010.t: "A Fixer's Finding"
 gdp_merchant.3010.desc: "My fixer, [fixer.GetTitledFirstName], having been doggedly skulking about [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] for some time, at last arranges a meeting with a vague note about [fixer.GetHerHis] finding the #EMP goods#!.\n\n[fixer.GetSheHe|U] takes [fixer.GetHerHis] seat mysteriously,"
 gdp_merchant.3010.desc.secret: "before breaking into a smile. "It took some doing, but I have here proof that [secret_haver.GetName] is almost definitely a [secret.GetName]!""
 gdp_merchant.3010.desc.scheme: "[fixer.GetHerHis] visage apprehensive. "I have ill news, [ROOT.Char.GetTitleAsNameNoTooltip]. I have discovered [scheme_owner.GetName] has been plotting against you - against the company!""
 gdp_merchant.3010.a: ""Most useful, bring me more!""
 gdp_merchant.3010.b: ""Quite the sneak, aren't you [fixer.GetFirstNameNoTooltip]?""
 gdp_merchant.3010.c: ""I don't deal in ill-gotten gossip.""
 gdp_merchant.3010.d: ""This could be used in my work...""

 gdp_merchant.3020.t: "A Bailiff's Bluster"
 gdp_merchant.3020.desc: "My bailiff, [bailiff.GetTitledFirstName], has been looking through the list of debtors, humming and hawing over the pressure that may be applied to ensure the swift return of our [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')].\n\n"
 gdp_merchant.3020.pressure: ""[pressure_debtor_1.GetTitledFirstName] lacks funds, but could at least make a gesture of goodwill by servicing the debt..." [bailiff.GetFirstNameNoTooltip] growls.\n\n"
 gdp_merchant.3020.demand: "[bailiff.GetSheHe|U] sighs, "I have it on good authority that [demand_debtor_1.GetTitledFirstName] can pay... [demand_debtor_1.GetSheHe] simply thinks [demand_debtor_1.GetHerselfHimself] above us!"\n\n"
 gdp_merchant.3020.third: ""And then there is [portrait_3.GetTitledFirstName]..." [bailiff.GetSheHe] mutters."
 gdp_merchant.3020.a: ""Yes, surely [pressure_debtor_1.GetFirstNameNoTooltip] can afford a #EMP small#! service?""
 gdp_merchant.3020.a.tt: "Will owe you [gold_i]#V -[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#! less"
 gdp_merchant.3020.b: ""Put the screws on [demand_debtor_1.GetTitledFirstNameNoTooltip]...""
 gdp_merchant.3020.c: ""[pressure_debtor_2.GetFirstNameNoTooltip] can afford a small repayment.""
 gdp_merchant.3020.d: ""[demand_debtor_2.GetFirstNameNoTooltip] is clearly holding out on us!""
 gdp_merchant.3020.e: ""Remind [pressure_debtor_3.GetFirstNameNoTooltip] of [pressure_debtor_3.GetHerHis] obligations.""
 gdp_merchant.3020.f: ""It's time to give [demand_debtor_3.GetFirstNameNoTooltip] a clear signal.""
 gdp_merchant.3020.g: ""I'd rather keep them in my debt.""
 ho_loan_demand_refused_title: "Loan Demand Refused"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName] still owes you [gold_i][outstanding|V0]"
 ho_loan_reduced_title: "Loan Reduced"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName] now owes you [gold_i][outstanding|V0]"

 gdp_merchant.3031.t: "An Agent's Ardor"
 gdp_merchant.3031.desc: "My market agent, [market_agent.GetTitledFirstName], has been staying up into the wee hours lately, poring over ledgers as the wax burns low around [market_agent.GetHerHim]. [market_agent.GetSheHe|U] blinks, bleary-eyed, as [market_agent.GetSheHe] enters my study this morning.\n\n"[ROOT.Char.GetTitledFirstName]! I have been looking over our books for [market.GetName|l], and there is a clear prospect we would-" #weak *yawn*#! "We would be foolish not to exploit!""
 gdp_merchant.3031.a: ""Good work, [market_agent.GetFirstNameNoTooltip], now get some sleep!""
 gdp_merchant.3031.a.tt: "A [trade_opportunity.GetType.GetName|V] [trade_opportunity|E] appears in [market.GetName|l]"
 gdp_merchant.3031.b: ""Never mind that, focus on our present concerns!""

 gdp_merchant.3040.t: "A Curator's Care"
 gdp_merchant.3040.desc: "My curator, [antiquarian.GetTitledFirstName], keeps a watchful eye over the collection of [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], ensuring they are kept safe and in good condition, and providing interesting tidbits to occasional guests.\n\nAs I stop by to admire the [artifact.GetName] one morning, [antiquarian.GetSheHe] appears right on cue, "Ah [ROOT.Char.GetTitleAsNameNoTooltip], a most special piece it is. Though, I do wonder sometimes, does it hold up to the rest of the collection?""
 gdp_merchant.3040.b: ""It is time we part with it, find a buyer."""
 gdp_merchant.3040.c: ""Perhaps it could use some renovation.""
 gdp_merchant.3040.c.tt: "[artifact.GetName] is already in pristine condition"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName] is a #V Creature#!"
 gdp_merchant.3040.d: ""Nonsense, the collection is flawless.""

 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "A simple townsman would scarce believe the journey a mere scrap of cloth may take, across scorching deserts and roiling seas, to appear upon a market stall.\n\nThese travails of trader, beast, and boat are the everyday fare of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Even far towns where not a word of [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] is spoken nonetheless rely on our deliveries."
 gdp_merchant.8000.a: "A reputation worthy of the company!"
 gdp_merchant.8000.b: "But I must not forget my roots."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "Dearer than the bales and bolts of bartered goods, or precious stones and metals of the earth, are the marvels that with talent may be wrought of them at man's hands.\n\nIngenious contraptions, breathtaking decorations, and delicate craftsmanship are the life-blood of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l], and our name a marker of quality and trust."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "Even the greatest king may be rendered powerless as a pauper if the lucre ceases to flow, but lines of credit surround him like the many threads of a spider's web.\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] name is heard in courts across the land, relied upon to broker and deal, always willing to help in times of need, but not to be taken advantge of lightly."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"

 gdp_merchant.8010.t: "A Book of Travels"
 gdp_merchant.8010.desc: "Few have seen quite so much, and none the totality of my unique experience. From pauper to potentate, the far off lands of this world are at best in a haze, and they long for insights and entertainments to illuminate the dim.\n\nAs I sit down, pondering juicy morsels from my travels in [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier], I wonder what strangers, and my descendants, would most want to hear told."
 gdp_merchant.8010.a: "I will focus on foreign customs and etiquette."
 gdp_merchant.8010.a.tt: "The quality of this book will be strongly dependent on your [GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|V] #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#! and [GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|V] #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )])#! [trait_level_track_xp|E]"
 gdp_merchant.8010.b: "Readers seek trading tips and market insights."
 gdp_merchant.8010.c: "My work will describe exotic cities and wonders."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "It took longer than I expected, but at last I am somewhat happy with my scribblings. I have detailed my journey to [poi.GetName], adorned with anecdotes from the travel, with a particular emphasis on the exotic [author.Custom('GetTravelogueTopic')].\n\n"
 gdp_merchant.8011.weak: "Leafing through it, I find myself disappointed, and wonder if perhaps I could have made a better effort, but alas, it is time to lay down my quill."
 gdp_merchant.8011.mid: "Leafing through it, I am proud of the breadth of my work, yet I feel there is perhaps something still some special spark missing."
 gdp_merchant.8011.great: "Leafing through it, I find myself chuckling at my own words, and excited by passages as I though I were experiencing them anew. This is one to remember!"
 gdp_merchant.8011.a: "I will hang onto it for now."
 gdp_merchant.8011.b: "It shall go into the company library."
 travelogue_description_full: "This is a fanciful travelogue of the lands of [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier] written by the merchant [author.GetTitledFirstName]. It provides insights from [author.GetHerHis] experience of foreign [author.Custom('GetTravelogueTopic')].\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "The Travels of [author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]"
 travelogue_name_2: "The Road to [poi.GetCounty.GetName]"
 travelogue_name_3: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]: The Traveler"
 travelogue_name_4: "To [poi.GetCounty.GetName]"
 travelogue_name_5: "Adventures in [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_6: "[author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip] Travels"
 travelogue_name_7: "Distant Lands"
 travelogue_name_8: "There and Back Again"
 travelogue_name_9: "Of the [poi.GetCulture.GetCollectiveNounNoTooltip]"
 travelogue_name_10: "[poi.GetNameNoTierNoTooltip], [poi.GetTitle.Custom('BaronyTownType')|U] of Mystery"
 travelogue_name_11: "The Thousand"
 travelogue_name_12: "The Travels"
 travelogue_name_13: "The Journey"
 travelogue_name_14: "[author.GetFirstNamePossessiveNoTooltip] Adventure"
 travelogue_topic_customs: "customs"
 travelogue_topic_markets: "markets"
 travelogue_topic_places: "places"
 travelogue_description_quality_weak: "The book is poorly written and decidedly fantastical."
 travelogue_description_quality_mid: "The book contains several insightful passages."
 travelogue_description_quality_great: "The book is compelling, written with drama and excellence."

 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: Curious Visitor"
 gdp_merchant.8021.suzerain: "I am most honored when my patron, [visitor.GetTitledFirstName],"
 gdp_merchant.8021.merchant: "[visitor.GetTitledFirstName], fellow merchant and proprietor of [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.laamp: "[visitor.GetTitledFirstName], leader of a traveling band calling themselves [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.ruler: "I am pleasantly surprised when [visitor.GetTitledFirstName], a local ruler,"
 gdp_merchant.8021.fallback: "[visitor.GetTitledFirstName], a humble traveler,"
 gdp_merchant.8021.desc: "calls at my residence.\n\n[visitor.GetSheHe|U] beams as [visitor.GetSheHe] is led to view our collection, and looks about [visitor.GetHerHim], somewhat struck with wonder.\n\n"Well met, [ROOT.Char.GetTitledFirstNameNoTooltip]! I've heard tales of your company's exploits, and your exotic collection... could I trouble you for a sto-", [visitor.GetSheHe] gasps, drawn to the [artifact.GetName].\n\n"Oh! But what do you have here...?""
 gdp_merchant.8021.curio: "[visitor.GetSheHe|U] studies it from all angles, determined to hear its full history before [visitor.GetSheHe] is satisfied."
 gdp_merchant.8021.library: "[visitor.GetSheHe|U] carefully leafs through the pages as [visitor.GetSheHe] asks countless questions."
 gdp_merchant.8021.creature: "[visitor.GetSheHe|U] marvels at its grace, and gleefully watches its feeding-time."
 gdp_merchant.8021.a: "Yes, it is quite the thing."
 gdp_merchant.8021.b: "Would you like to have it?"

 gdp_merchant.9021.opening: "Greetings good [merchant.GetTitledFirstNameNoTooltip],"
 gdp_merchant.9021.diarch.desc: "As [commissioner.GetDiarchTitle] of [commissioner.GetName], I seek to commission the services of [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.9021.no_diarch.desc: "I seek to commission the services of [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.9021.desc: "\n\nThere is a scarcity of [target.GetName] in [trade_market.GetName|l]. Bring goods into the area, and you will be fairly compensated."
 gdp_merchant.9021.a: "Your commission is accepted."
 gdp_merchant.9021.b: "I must respectfully decline."
 gdp_merchant.9021.b.cooldown_tt: "You will not receive another [commission|E] request for #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! years"

 gdp_merchant.9005.t: "Forced Out"
 gdp_merchant.9005.desc_intro: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] barges into [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] office, a flush high on [courtier.GetHerHis] face.\n\n"I bring word from our Patron, [expeller.GetTitledFirstName]," [courtier.GetSheHe] says. "Our company is to close our accounts and leave [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] at once!"\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U] has ordered [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] out of [expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "[expeller.GetTitledFirstNamePossessiveNoTooltip] trust in us has worn too thin."
 gdp_merchant.9005.desc_body.enemies: "Is there no limit to [expeller.GetTitledFirstNamePossessiveNoTooltip] animosity?"
 gdp_merchant.9005.desc_body.fallback: "After all we have done here..."
 gdp_merchant.9005.a: "So it comes to this."
 gdp_merchant.9005.a.tt: "Your [company|E] will leave [expeller.GetShortUINamePossessive] [realm|E]"

 gdp_merchant.9100.t: "The Patrician House of [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9100.desc: "Having sufficiently proven ourselves to the haughty families of [new_patrician_liege.GetPrimaryTitle.GetNameNoTier], and provided [new_patrician_liege.GetTitledFirstName] with the right #emp incentives#!, my request for our elevation is assured.\n\nI at last possess the documents that assert beyond doubt [ROOT.Char.GetHouse.GetBaseName] is no mere merchant house, but sits among the other esteemed patrician families in the assembly of this [new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], equal even to the [new_patrician_liege.GetHouse.GetBaseName] under the law!"
 gdp_merchant.9100.a: "I eagerly await my first session in the assembly."
 merchant_patrician_transition_domicile_tt: "Your [domicile_buildings|E] have been retained"

 gdp_merchant.9110.t: "The Merchant House of [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9110.desc: "With the destruction of the old republic, [ROOT.Char.GetHouse.GetBaseName] and other proud patrician families of [new_merchant_location.GetBaronyNameExplicitly] have been reduced to mere merchant houses, subject to the whims of fortune and of the local ruler, [ROOT.Char.GetSuzerain.GetTitledFirstName].\n\nBereft of our assembly and the protection of our republic, we must put our trust in the laws of [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier] if we are to maintain some semblance of our former stature."
 gdp_merchant.9110.a: "How did it come to this..."

 broke_deal_opinion: "Broke Deal"
 gdp_repudiated_my_loan_opinion: "Repudiated My Loan"
 gdp_interest_free_loan_opinion: "Lent Without Interest"
 gdp_usurious_loan_opinion: "Lent Me Gold at Usury"

 gdp_merchant_unity_intermarriage_desc: "married into another [merchant|E] [house|E]"
 gdp_merchant_unity_noble_marriage_desc: "married into a noble [house|E]"

 gdp_merchant.2000.t: "Bare Market: [needed_good.GetNameNoTooltip]"
 gdp_merchant.2000.desc.intro: "As I walk through the "
 gdp_merchant.2000.desc.disaster: "disaster-struck "
 gdp_merchant.2000.desc.war: "war-torn "
 gdp_merchant.2000.desc.plague: "plague-ridden "
 gdp_merchant.2000.desc.unrest: "unruly "
 gdp_merchant.2000.desc.stalls: "streets of [starving_province.GetNameNoTooltip], I notice that the usually crowded [starving_province.Custom('GetRegionalMarketTermGloss')] has fallen silent.\n\nThe food stands are near empty except for a few stale [ROOT.Char.Custom('GetLocalStreetFoodPlural')] and rotten [ROOT.Char.Custom('RegionalRootVegetablePlural')]. Emaciated men and women sift through piles of waste along the sides of the street."
 gdp_merchant.2000.a: "I should hold on tight to what is left."
 gdp_merchant.2000.b: "The people will look for someone to blame."
 gdp_merchant.2000.c: "This is not my problem."

 gdp_merchant.2010.t: "[craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip] Monopoly:"
 gdp_merchant.2010.t.smith: "The Blacksmith"
 gdp_merchant.2010.t.goldsmith: "The Goldsmith"
 gdp_merchant.2010.t.carpenter: "The Carpenter"
 gdp_merchant.2010.t.tanner: "The Tanner"
 gdp_merchant.2010.t.potter: "The Potter"
 gdp_merchant.2010.desc.intro: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] has been talking incessantly of the master crafts[craftsman.GetWomanMan] [craftsman.GetFirstName] in [workshop_province.GetName]. Now, as I stand before [craftsman.GetHerHis] handiwork, I understand what all the fuss was about.\n\n[craftsman.GetFirstNameNoTooltip] welcomes me without lifting [craftsman.GetHerHis] gaze from [craftsman.GetHerHis] work. "Please, peruse my wares at your leisure."\n\nI am awestruck by "
 gdp_merchant.2010.desc.weapon: "a magnificent weapon."
 gdp_merchant.2010.desc.chalice: "an intricately wrought chalice."
 gdp_merchant.2010.desc.box: "an intricately carved wooden box."
 gdp_merchant.2010.desc.saddle: "a perfectly carved saddle."
 gdp_merchant.2010.desc.vase: "a delicately painted ceramic vase."
 gdp_merchant.2010.desc.craftsmanship: "This is no ordinary craftsmanship."
 gdp_merchant.2010.a: "Talent like this should not be wasted."
 gdp_merchant.2010.b: "Perhaps you could teach [associate.GetFirstNameNoTooltip] a thing or two."
 gdp_merchant.2010.c: "I would like to stay and observe your craft."

 gdp_merchant.2015.t: "The Price of [counsel_good.GetNameNoTooltip]"
 gdp_merchant.2015.desc: "I have received an unexpected summons from my patron [patron.GetTitledFirstName]. Given [patron.GetHerHis] [patron.Custom('quirk_neg_adjective')] nature, I enter the throne room with trepidation.\n\n"[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip], indulge me. What could you tell me of the qualities and market value of [counsel_good.GetNameNoTooltip]?""
 gdp_merchant.2015.a: ""I happen to be quite an expert on the subject.""
 gdp_merchant.2015.a.tt: "You must have reached at least [expertise_level|E] #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! in the [counsel_category.GetName] [trade_category_short|E]"
 gdp_merchant.2015.b: ""I might know a thing or two...""
 gdp_merchant.2015.a.monopoly.tt: "[monopoly_i][trade_monopoly|E] Acceptance: [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip] takes you for an authority"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip] sees through your lies"
 gdp_merchant.2015.b.monopoly.tt: "[monopoly_i][trade_monopoly|E] Acceptance: [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: ""I aspire to more in life than just trade.""

 gdp_merchant.2020.t: "A Seat at the Table"
 gdp_merchant.2020.desc: "I have the honor of dining in the [patron.GetCapitalLocation.GetHolding.GetType.GetName|l] of my patron [patron.GetTitledFirstName] in [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. [courtier_1.GetTitledFirstName], a [courtier_1.Custom('NoblewomanNobleman')], follows me with a burning gaze as I walk over to my place. [courtier_1.GetHerHis|U] whispers to the other guests are almost inaudible, but I can make out the words "riff-raff" and "bribes from a common peddler." The voices are silenced as [patron.GetFirstNameNoTooltip] rises to speak:\n\n"Trusted companions, newfound acquaintances, and long-lost brethren, I have gathered you here tonight to revel in my hospitality. Let us feast!""
 gdp_merchant.2020.a: ""Splendid, we have to do this more often!""
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName] will start a[GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName] as soon as possible #weak (within 1-3 months)#!"
 gdp_merchant.2020.b: "House [ROOT.Char.GetHouse.GetBaseNameNoTooltip] will get the recognition we deserve."
 gdp_merchant.2020.b.unity_gain.desc: "claimed a seat among nobility in our house's name"
 gdp_merchant.2020.c: ""Hear hear, now let us talk business!""
 gdp_merchant.2020.c.unity_loss.desc: "focused on what really matters: business"

 gdp_merchant.2025.t: "The Lesser Merchant"
 gdp_merchant.2025.desc: "[charter_rival.GetTitledFirstName] is, as usual, a no-show when duty calls. My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] [patron.GetTitledFirstName] and I wait patiently for [charter_rival.GetHerHis] arrival, until we decide to go over this month's ledgers without [charter_rival.GetHerHim].\n\nUnverified trade agreements still lie scattered across the table when [patron.GetFirstNameNoTooltip] sweeps the parchments aside and turns [patron.GetHerHis] attention to me:\n\n"[ROOT.Char.GetFirstNameNoTooltip], just between the two of us, what do you #EMP really#! think of [charter_rival.GetFirstNameNoTooltip]? Did I make the right choice when I granted [charter_rival.GetHerHim] my charter?""
 gdp_merchant.2025.a: ""Perhaps it would be of better use in my hands?""
 gdp_merchant.2025.a.charter.tt: "[charter_i][request_merchant_charter|E] Acceptance: [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: ""I trust your superior judgment, [patron.Custom('FormOfAddressForLiege')].""
 gdp_merchant.2025.b.unity_gain.desc: "showed patron we trust their judgment"

 gdp_merchant.4000.t: "Our Place Outside the Path"
 gdp_merchant.4000.desc.intro: "I enter the [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] market to find my vendors pushed into a remote alley, their tables lodged into the muck of a nearby pig sty.\n\n"
 gdp_merchant.4000.desc.patron: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))]"
 gdp_merchant.4000.desc.patron_representative: "[patron.GetTitledFirstNamePossessive] [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))], [market_character.GetName]"
 gdp_merchant.4000.desc.body: "stands far upwind, smirking as [market_character.GetSheHe] watches my associates shower me in complaints.\n\nWhen I approach, [market_character.GetFirstNameNoTooltip] says,"
 gdp_merchant.4000.desc.body.patron: ""A suitable place for [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l] business, is it not?" [market_character.GetSheHe|U] gestures toward the swines."
 gdp_merchant.4000.desc.body.patron_representative: ""I am here on behalf of your patron." Judging by the lift of [market_character.GetHerHis] chin and the gleam in [market_character.GetHerHis] eyes, [market_character.GetSheHe] takes a fair amount of pleasure in delivering these news."
 gdp_merchant.4000.desc.outro: ""You do not adhere to our customs, and never heed the word of [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]. Until you do, this will be your place.""
 gdp_merchant.4000.b: "I should learn about the Way."
 gdp_merchant.4000.b.tt: "Your next [GetActivityType('activity_adult_education').GetName] costs #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#! less [gold|E] if you host it at a [GetTrait('confucian_education').GetName(GetNullCharacter)] center"
 gdp_merchant.4000.c: "I will show them..."

 gdp_merchant.4010.t: "The Gates of Learning"
 gdp_merchant.4010.desc: "I am enjoying tea at the end of a long day at the market. Now and then, I catch a local scholar glancing at me with a curious look.\n\n"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] is a contemptuous lot," I hear [student.GetHerHim] mutter to [student.GetHerHis] friend. "They think they are better than us who observe the proper rites. We passed our examinations with due diligence. Besides exploiting others, what has [ROOT.Char.GetFirstNameNoTooltip] ever achieved?""
 gdp_merchant.4010.a: "This examination cannot be too hard."
 gdp_merchant.4010.b: ""And whose tea are you drinking?""
 gdp_merchant.4010.c: ""And whose business can this place afford to lose?""

 gdp_merchant.4020.t: "The Silk Road"
 gdp_merchant.4020.desc: "I enter [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] caught in a throng of bodies, both man and beast, spilling through the [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')] gates to join its endless procession of caravans. The dromedaries here are as high as elephants with the abundance of their cargo, tilting this way and that by the sheer bulk loaded on their backs.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "In every street corner there are traders unloading such quantities of goods that it defies belief.\n\nI see stalls with food discarded to the side, as there is so much production that it is simply not possible to sell it all before it spoils."
 gdp_merchant.4020.desc.steady_trading: "Never before have I seen such bounties in one place. There are so many people here that we become a clamoring mass, reduced to a single unit.\n\nWhen one caravan falters, there is always a master eager to crack the whip."
 gdp_merchant.4020.desc.hardship: "From what I am able to gather through scattered conversation in foreign tongues, this market is currently struggling.\n\nWhat this place looks like in more prosperous times, the sheer quantities of goods must be past all reckoning..."
 gdp_merchant.4020.a: "This is the road to the future."

 gdp_merchant.4030.t: "Distant Fortunes"
 gdp_merchant.4030.desc.intro: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] enters [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] office, eyes shining as I have only ever seen them admire a pile of gold.\n\n[associate.GetSheHe|U] hands me a box, and I open it to find"
 gdp_merchant.4030.desc.silk: "the finest silk I have ever seen, whisper-thin and impossibly light.\n\n"
 gdp_merchant.4030.desc.spice: "a fragrant powder, freshly milled.\n\n"They call it [rumoured_market_owner.Custom('RegionalSpice')]," [associate.GetSheHe] says."
 gdp_merchant.4030.desc.jade: "a jade stone, polished until the surface is smooth like glass.\n\n"
 gdp_merchant.4030.desc.ivory: "a piece of ivory, carved into the likeness of a miniature citadel.\n\n"
 gdp_merchant.4030.desc.outro: ""I bought this from a merchant who talked about his [rumoured_market_owner.GetCulture.GetNameNoTooltip|l] connections in the Silk Road. The gold we earn here in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] is nothing compared to what they reap in the [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')] of [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip].""
 gdp_merchant.4030.a: ""The Silk Road, you say?""
 gdp_merchant_4030_a_tt: "If you move your [company|E] to [rumoured_market.GetName] in the next #V 5#! years, you gain [GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip] in that [market|E] for #V 10 years#!"
 gdp_merchant.4030.b: ""Thank you, what a thoughtful gift.""
 gdp_merchant.4030.c: ""We have important business here, [associate.GetFirstNameNoTooltip].""
 merchant_unity_local_business: "prioritized nearby business over the [silk_road|E]"
 gdp_merchant.4030.artifact.silk: "[rumoured_market_location.GetBaronyNameExplicitlyNoTooltip] Silk"
 gdp_merchant.4030.artifact.silk.desc: "A swatch of whisper-thin silk brought from the markets of the Silk Road, impossibly light and smooth to the touch."
 gdp_merchant.4030.artifact.spice: "Pouch of Spices"
 gdp_merchant.4030.artifact.spice.desc: "A pouch of fragrant spices carried from the markets of the Silk Road."
 gdp_merchant.4030.artifact.jade: "Polished Jade Stone"
 gdp_merchant.4030.artifact.jade.desc: "A jade stone from the markets of the Silk Road, polished until its surface is as smooth as glass."
 gdp_merchant.4030.artifact.ivory: "Ivory Citadel"
 gdp_merchant.4030.artifact.ivory.desc: "A piece of ivory from the markets of the Silk Road, painstakingly carved into the likeness of a miniature citadel."

 gdp_merchant.5000.t: "Exposed Interest"
 gdp_merchant.5000.desc.debtor: "The door to [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] office swings open and my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] steps inside, flanked by my own associates."
 gdp_merchant.5000.desc.debtor_paranoid: "A creak of the door is all that betrays the approach of my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] as [accuser.GetSheHe] softly steps inside [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] office."
 gdp_merchant.5000.desc.bishop: "Hooded figures darken the doorstep of [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]. It does not take long before [accuser.Custom('GetActualBishopTitle')] [accuser.GetFirstName] stands before me, led by my own associates."
 gdp_merchant.5000.desc.clergy: "Hooded figures darken the doorstep of [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]. It does not take long before [accuser.Custom('PriestTitle')] [accuser.GetFirstName] stands before me, led by my own associates."
 gdp_merchant.5000.desc.steward: "The door to [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] office swings open and [debtor.GetFirstNamePossessive] [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] storms inside, flanked by my own associates."
 gdp_merchant.5000.desc.break: "\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip], there seems to be a discrepancy in the loan issued to [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'me', debtor.GetTitledFirstName )]," [accuser.GetSheHe] says."
 gdp_merchant.5000.desc.accepted: ""I do not particularly like being fed falsehoods. Show me your company books, and let us set the record straight.""
 gdp_merchant.5000.desc.discouraged.debtor: ""You know the [accuser.GetFaith.Custom('HouseOfWorshipBase')]'s disapproval of usury. Let us settle the score now, and this matter need not go further.""
 gdp_merchant.5000.desc.shunned.debtor: ""As soon as the [accuser.Custom('DefaultPriestTitlePlural')] learn of this, they will come down hard on you and your business. I am here to give you a chance to save yourself.""
 gdp_merchant.5000.desc.accepted.steward: ""Your patron does not particularly like being fed falsehoods. Show me your company books, and let us put the numbers to right.""
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: ""As a merchant, surely you understand that one cannot gain something for nothing? And yet... Well, we are hoping this matter can be resolved now, discreetly, to avoid your business suffering from this mistake and thus hurting commerce.""
 gdp_merchant.5000.desc.shunned: ""The way you have conducted your business is despicable. You, as a merchant, selling something that does not exist? This will be taken to court unless you plead forgiveness.""
 
 gdp_merchant.5000.a: ""Do you not know I act on behalf of [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]?""
 gdp_merchant.5000.a.debtor: ""Surely you would not wish to hurt our trade?""
 gdp_merchant.5000.b: ""You can take our assets in recompense.""
 gdp_merchant.5000.c: ""Here, let us look at the fine print.""
 gdp_merchant.5000.c.success: "Your accounts are immaculate"
 gdp_merchant.5000.c.failure: "The numbers are sloppy"
 gdp_merchant.5000.c.critical: "The interest is ill-disguised"
 gdp_merchant.5000.d: ""I suppose I could yield the interest...""
 gdp_merchant.5000.e: ""Consider the loan forgotten.""

 gdp_usury_penance_seized_goods_modifier: "Repossessed Caravans"
 gdp_usury_penance_seized_goods_modifier_desc: "This character's business suffers from the discovery of their hidden interest loans."
 gdp_usury_penance_same_faith_scandal_modifier: "Known Usurer"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "This character suffers from having their underhanded usury exposed."
 gdp_usury_penance_forgive_interest_tt: "The disguised [interest|E] is forgiven #weak ([TARGET_CHARACTER.GetShortUIName] owes [gold_i|E]$VALUE|0V$)#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "The disguised [loan|E] remains in place"

 gdp_merchant.5010.t: "The Fine Print"
 gdp_merchant.5010.desc: "It has been brought to my attention that my creditor [lender.GetFirstName] has not been entirely forthright in the settlement of my loan.\n\nGoing over the numbers again, I can tell that there are clauses in the fine print that tally a higher sum than we initially agreed upon.\n\nThe discrepancy in our agreement is clear for all to see, if I wish to act on it."
 gdp_merchant.5010.a: "Keep the secret."
 gdp_merchant.5010.b: "[lender.GetSheHe|U] will pay me back the interest."
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U] will not receive any interest."
 gdp_merchant.5010.c: "Repudiate the loan."
 gdp_usury_debtor_discover_interest_tt: "The hidden [interest|E] is #weak ([gold_i|E]$VALUE|0V$)#!"
 gdp_usury_debtor_keep_secret_tt: "The disguised [interest|E] remains a secret"
 gdp_usury_debtor_demand_repayment_tt: "Demand that the hidden [interest|E] be repaid"
 gdp_usury_debtor_inform_creditor_tt: "A letter is sent to [lender.GetShortUINameNoTooltip]"


 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ I require the hidden interest paid back post-haste. Do not consider fooling me again."
 gdp_merchant.5020.a: "How unfortunate."
 gdp_merchant.5020.a.tt: "Hidden interest paid back"
 gdp_usury_penance_interest_paid_back_tt: "The hidden [interest|E] is no longer owed"

 gdp_merchant.5020.desc_intro: "I have gone over our loan contract and it is clear as day that you have attempted to swindle me!"

 gdp_usury_debtor_kept_secret_message: "Secret Kept"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName] knows of the disguised [interest|E] and will keep it a secret."

 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "Consider the loan you gave me null and void. I will think more carefully next time you try to offer me anything."
 gdp_merchant.5040.a: "The nerve!"

 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "It pains me to write and admit that the toll of the open road, the ceaseless arguments at the markets, have proven too difficult for me to bear.\n\nCould you see it in your heart to call for the company to return home, at least for a while?"
 gdp_merchant.0060.a: "If I must."
 gdp_merchant.0060.a.tt: "You promise to take [GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName] within 2 years."
 gdp_merchant.0060.b: "You will have to overcome."
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName] has [stress_i]#N [associate.GetStress|0]#! [stress|E]. [associate.GetSheHe|U] will continue to gain Stress from failing [schemes|E] on [associate.GetHerHis] route."
