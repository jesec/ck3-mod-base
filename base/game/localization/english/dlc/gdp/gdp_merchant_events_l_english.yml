l_english: 
 gdp_merchant.0001.t: "A Path Paved with Gold"
 gdp_merchant.0001.desc: "I enter the local market as a free [ROOT.Char.GetWomanMan]. The cries of vendors can be heard from every street corner, intermingled with the clanking and banging of metals from nearby workshops. Everywhere I turn there are carts with [ROOT.Char.Custom('RegionalDrink')] crates, [ROOT.Char.Custom('RegionalFabric')] rolls, and [ROOT.Char.Custom('GetRandomRegionalBird')] cages being wheeled to and fro.\n\nThis is where I will build my dynasty."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "What shall be my first business venture?"

 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "After careful consideration, I have chosen to pursue the life of a merchant. I am in my most vigorous years and my desire to travel abroad urges me to act. I hope someday we can enter a business arrangement that would be beneficial to us both. I leave [old_primary_title.GetBaseNameNoTierNoTooltip] in your capable hands."
 gdp_merchant.0002.a: "An interesting turn of events."

 gdp_merchant.0010.t: "Family Matters"
 gdp_merchant.0010.desc: "After adjourning today's family meeting, my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] waves me down with a determined look on [associate.GetHerHis] face.\n\n"My dear [associate.Custom2('RelationToMe', ROOT.Char)]!"
 gdp_merchant.0010.desc.starting: "I have been a member of this company since its inception,""
 gdp_merchant.0010.desc.starting_fallback: "I have worked for this family for some time now,""
 gdp_merchant.0010.desc.cont: "[associate.GetSheHe] says, choosing [associate.GetHerHis] words carefully."
 gdp_merchant.0010.desc.children: ""And since your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] is not yet of age,"
 gdp_merchant.0010.desc.no_children: ""And since you have no adult children,"
 gdp_merchant.0010.desc.outro: "I was hoping you might consider adopting me. It would be my honor to represent the family as a member of the household.""
 gdp_merchant.0010.a: ""I have always seen you as one of my own.""
 merchant_adoption_event_tt: "[associate.GetShortUIName] becomes part of your [house|E]"
 merchant_unity_adoption_loss: "adopted associate into [house|E]"
 gdp_merchant.0010.b: ""You have yet to prove yourself useful.""
 gdp_merchant.0010.c: ""Let me get back to you on that.""

 gdp_merchant.0015.t: "A Face for Business"
 gdp_merchant.0015.desc: "With the creation of [trade_route.GetNameNoTooltip|l], our trade course is set.\n\nI have yet to choose a person who might represent us on our new venture. My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))] [courtier_1.GetTitledFirstName] is a [courtier_1.Custom('quirk_pos_adjective')] soul of"
 gdp_merchant.0015.desc_good_intellect: "reasonable intellect. Who knows, [courtier_1.GetSheHe] might surprise us with some hidden talents."
 gdp_merchant.0015.desc_excellent_intellect: "great intellect. It is easy to see [courtier_1.GetHerHim] making the family name proud."
 gdp_merchant.0015.desc_poor_intellect: "poor intellect. Perhaps this opportunity could challenge [courtier_1.GetHerHim] to improve [courtier_1.GetHerHis] abilities."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip] could be the [courtier_1.GetWomanMan] for the task..."
 gdp_merchant.0015.b: "...but [courtier_2.GetFirstNameNoTooltip] might be more suitable."
 gdp_merchant.0015.c: "I need to keep my talent close."
 gdp_merchant.0015.c.fallback: "No. I need everyone here."
 gdp_merchant.0015.c.tt: "You start your [trade_route|E] without a [trader|E] assigned"

 gdp_merchant.0020.t: "A Partner in Business"
 gdp_merchant.0020.desc: "The head of a family business is only as good as the neck that steers its gaze toward new prospects."
 gdp_merchant.0020.desc.partner_exists: "My partner, [old_holder.GetFirstName], who is supposed to shoulder this task, has consistently wasted our time and gold on fruitless ventures."
 gdp_merchant.0020.desc.fallback: "I currently do not employ anyone to fulfill this role and take place alongside me as partner."
 gdp_merchant.0020.desc.body: "The tension in the Company is palpable, causing bickering and posturing from everyone with an inkling for ambition.\n\n"
 gdp_merchant.0020.desc.outro_three: "Among them are [candidate_2.GetTitledFirstName] and [candidate_3.GetTitledFirstName], both swearing their unwavering loyalty to get a seat at the table.\n\nThey will do everything they can to bully their way ahead of [candidate_1.GetTitledFirstName], who is clearly their superior."
 gdp_merchant.0020.desc.outro_two: "Among them is [candidate_2.GetTitledFirstName], swearing [candidate_2.GetHerHis] unwavering loyalty to get a seat at the table.\n\n[candidate_2.GetSheHe|U] will do everything [candidate_2.GetSheHe] can to bully [candidate_2.GetHerHis] way ahead of [candidate_1.GetTitledFirstName], who is clearly their superior."
 gdp_merchant.0020.desc.outro_one: "Among them is [candidate_1.GetTitledFirstName], who swore [candidate_1.GetHerHis] unwavering loyalty to get a seat at the table.\n\n[candidate_1.GetSheHe|U] will do everything [candidate_1.GetSheHe] can to bully [candidate_1.GetHerHis] way ahead of any who might stand between [candidate_1.GetHerHim] and the job."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip] deserves a chance."
 gdp_merchant.0020.a.custom: "Every other candidate"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip] should get the opportunity."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip] is clearly the most deserving."
 gdp_merchant.0020.d: "These people already have tasks to mind..."
 gdp_merchant.0020.d.custom: "Every candidate"
 merchant_unity_partner_gain: "employed house member as Partner"
 merchant_unity_partner_loss: "employed outsider as Partner"

 gdp_merchant.0025.t: "Esteemed Artisans"
 gdp_merchant.0025.desc: ""Good [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip]," an unfamiliar voice calls out to me from the nearby tannery. I follow the sound, careful not to step in the muck from the dyeing vats.\n\nBefore I know it, I am face-to-face with... a carcass? Its hunter smiles at me as [traveler.GetSheHe] proudly displays [traveler.GetHerHis] trophy.\n\n"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] is known far and wide as expert craftsmen. You are aware, then, that the product you sell is only as good as the material at hand. As a hunter, I have made it my living to procure the finest supplies for distinguished buyers such as yourself.""
 gdp_merchant.0025.a: ""Have you considered trading at a larger scale?""
 gdp_merchant.0025.b: ""Please, go on...""
 merchant_unity_artisan_recruit_loss: "recruited an outsider"
 merchant_unity_artisan_recruit_decline_gain: "learned about luxury materials"

 gdp_merchant.0030.t: "A Force to be Reckoned With"
 gdp_merchant.0030.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstNameNoTooltip], look here!" I hear a [traveler.GetWomanMan] shout.\n\nI turn around to see a smith wave at me from [traveler.GetHerHis] workstation. As I walk up to [traveler.GetHerHim], I cannot help but notice how [traveler.GetSheHe] twists and flexes [traveler.GetHerHis] body, angling [traveler.GetHerHim]self to let the fire from the forge illuminate [traveler.GetHerHis] muscles just so...\n\n"I have waited so long to meet you. Since your company has garnered an #EMP impressive#! reputation for dominating your competitors, I would like to offer my fists to your cause. I can break heads, wield a sword, anything you need.""
 gdp_merchant.0030.a: ""I like your enthusiasm.""
 gdp_merchant.0030.b: ""#EMP Ehm...#! Show me more of your work.""
 merchant_unity_creditor_recruit_loss: "recruited an outsider"
 merchant_unity_creditor_recruit_decline_gain: "dismissed cloying company fanatic"

 gdp_merchant.0035.t: "A Far-Traveled Reputation"
 gdp_merchant.0035.desc: "An unusual amount of clamoring diverts my attention from the ledgers in front of me.\n\nStepping outside [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] office, I am met with a sharp-eyed merchant with days' worth of dust clinging to [traveler.GetHerHis] clothes.\n\n"Well met, [ROOT.Char.GetTitledFirstNameNoTooltip]," [traveler.GetSheHe] says. "Everyone on the road knows your name, and all the people I have met tell me you are the [ROOT.Char.GetWomanMan] to meet. I was hoping you would let me ride under your name, going forward.""
 gdp_merchant.0035.a: ""Why, you seem perfectly capable!""
 gdp_merchant.0035.b: ""I would rather hear news of distant trade.""
 merchant_unity_caravaneer_recruit_loss: "recruited an outsider"
 merchant_unity_caravaneer_recruit_decline_gain: "learned about distant markets"

 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "The [ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')] were pessimistic, but at last we received [recipient.GetTitledFirstNamePossessive] assent to our request, and the mood is now one of jubilation! We will at last have a city of our own, a republic to rule as we see fit!\n\nI am to be the first [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.0101.liege: "administering [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] and its environs as a subject city, reliant on and beholden to our [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] masters in equal measure."
 gdp_merchant.0101.independent: "administering [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] and its environs, along with the other local notable families, in the name of the people."
 gdp_merchant.0101.republic: "\n\nAfter many deals and doings, the great house of [ROOT.Char.GetHouse.GetBaseNameNoTooltip] can at last build an enduring legacy..."
 gdp_merchant.0101.a: "Here begins a new era for the people of [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip]!"

 gdp_merchant.0102.desc: "I was greatly heartened to hear you accepted our request!\n\nThe gold has been dispatched, and we move to draw up a charter for the [actor.GetPrimaryTitle.GetName],"
 gdp_merchant.0102.liege: "to govern as your humble subjects."
 gdp_merchant.0102.top_liege: "to govern it under [new_liege.GetTitledFirstName]."
 gdp_merchant.0102.independent: "and to govern it as an independent city."

 gdp_merchant.0103.desc: "What a ridiculous proposal. Do you seriously think my titles are for sale? And to such a lowly [actor.GetWomanMan] as #EMP you?!#!"

 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "After much discussion, [recipient.GetTitledFirstName] cannot hide [recipient.GetHerHis] interest in my generous offer to bring our two companies and houses together.\n\n[recipient.GetSheHe||U] nods,"
 gdp_merchant.0110.desc.personality.ai_honor: ""It appears that I have little choice in this matter. Still, I will uphold our end of the bargain and serve your interests as dutifully as I have my own.""
 gdp_merchant.0110.desc.personality.ai_zeal: ""I have faith that [recipient.GetFaith.WealthGodName] has shown us this path.""
 gdp_merchant.0110.desc.personality.ai_greed: ""I have gone over your ledgers and ours. With these numbers, I have no choice but accept your bargain.""
 gdp_merchant.0110.desc.personality.ai_compassion: ""I have conferred with the company and we believe this union of our companies will benefit us all.""
 gdp_merchant.0110.desc.personality.ai_boldness: ""I accept your proposal. Let there be no more hedging between us.""
 gdp_merchant.0110.desc.personality.ai_rationality: ""I have weighed our profits against the cost of refusing your offer. I accept.""
 gdp_merchant.0110.desc.personality.ai_vengefulness: ""I leave me no choice. You have played your hand well, and you win this round.""
 gdp_merchant.0110.desc.personality.ai_energy: ""I accept. See that your clerks draw up a contract and send it to me post-haste!""
 gdp_merchant.0110.desc.personality.ai_sociability: ""The [recipient.GetHouse.GetBaseNameNoTooltip] Company accepts your terms. I shall miss trading under our own name, but it is unwise to cling to pride.""
 gdp_merchant.0110.desc.personality.ai_personality_fallback: ""After much thought, I accept your proposal to combine our interests.""
 gdp_merchant.0110.desc.closing: "\n\n"Our trade routes are dismantled as agreed, and the [recipient.GetHouse.GetBaseNameNoTooltip] name will serve your company from this day forward.""
 gdp_merchant.0110.a: "The [recipient.GetHouse.GetBaseNameNoTooltip] markets are ours!"

 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "You forget yourself and your [actor.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip] importance. [recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip] will never yield to your petty interests."
 gdp_merchant.0111.a: "This venture proved ill-conceived."

 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "Rumors abound that the realm of [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] is in dire need of financial help. I could be the one who solves that situation... For a favor in return, of course."
 gdp_purpose_events.0001.a: "That might be my way out of this..."
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName] will consider your proposal."
 gdp_purpose_events.0001.b: "The gall!"

 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "I ask your financial aid in this time of need. Name your terms and I will not refuse them, so long as you can bring yourself to write them down."
 gdp_purpose_events.0002.a: "Draw up the bond, interest and all."
 gdp_purpose_events.0002.a.sin: "Draw up the bond, usury and all."
 gdp_purpose_events.0002.c: "Draw it up so that no one can call it usury."
 gdp_purpose_events.0002.d: "Send the gold, and ask nothing for it."
 gdp_purpose_events.0002.b: "I must politely refuse..."
 gdp_purpose_events.0002_notification: "Successful Loan"
 gdp_purpose_events.0002_fail_notification: "Loan Refused"
 fund_maa: "To fund a @stationed_regiment_icon! [men_at_arms|E] [regiment|E]"
 fund_mercenaries: "To fund a [mercenary_i|E][mercenary|E] contract"

 gdp_purpose_events.0003.desc: "It is known that war is taking a toll on your realm. I am prepared to sponsor your endeavors if you, my [ruler.GetTitleAsNameNoTooltip], would show me kindness in the future..."
 gdp_purpose_events.0003.a: "I need all the help I can get!"
 gdp_purpose_events.0003.b: "Kindness? I would never!"
 no_thanks.tt: "You let this opportunity pass..."

 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "It vexes me to write to you, but my realm could use your sponsorship in the war we're facing. I am prepared to show you kindness in the future if you would aid me."
 gdp_purpose_events.0004.a: "I could offer you a new specialized regiment!"
 gdp_purpose_events.0004.b: "I can grease a few palms I know..."

 gdp_merchant.1002.t: "The Founding of a Company"
 gdp_merchant.1002.desc: "An empty ledger sits on the desk in front of me. From the open window, sounds from the local [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] filter into [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l] office: the bargaining of trade, the creaking of cart wheels, and animals calling out from their pens.\n\nThe study is modest, low-lit and dim — I cannot stand alone if I am to compete with the traders of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Perhaps I should hire some people to aid the company?"
 gdp_merchant.1002.a: "I require business-minded individuals."
 gdp_merchant.1002.a.tt: "You start out with two [associates|E] skilled in [stewardship|E]"
 gdp_merchant.1002.b: "We will intimidate our opponents."
 gdp_merchant.1002.b.tt: "You start out with two [associates|E] skilled in [martial|E]"
 gdp_merchant.1002.c: "Skillful negotiators make good trade deals."
 gdp_merchant.1002.c.tt: "You start out with two [associates|E] skilled in [diplomacy|E]"
 gdp_merchant.1002.d: "There's no shortage of scholars here!"
 gdp_merchant.1002.d.tt: "You start out with two [associates|E] skilled in [learning|E]"
 gdp_merchant.1002.e: "Cunning will give us an advantage."
 gdp_merchant.1002.e.tt: "You start out with two [associates|E] skilled in [intrigue|E]"
 gdp_merchant.1002.f: "No, I don't need anyone."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial You may find [task_contracts|E] difficult, or impossible, until you acquire [associates|E]#!"
 gdp_merchant.1002.f.tt.associates: "You start out with no initial [associates|E] — only whatever [family|E] and [friends|E] you already have"

 gdp_merchant.1003.t: "The Founding of a Company"
 gdp_merchant.1003.desc: "The [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')], with all of its infinite multitudes, lies before me, and not a second goes by without a deal being struck and [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] changing hands.\n\nThe buzz of trade is everywhere: the cart wheels creak, animals call out from the crowded pens, and behind the din, my fellow merchants holler, hoping to get ahead of the competition.\n\nAll manner of goods cross hands here — if I am to compete with the many traders, perhaps I should focus my efforts?"
 gdp_merchant.1003.a: ""Securing bulk transports is key.""
 gdp_merchant.1003.b: ""We must leverage the [ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] measure of us.""
 gdp_merchant.1003.b.tt: "A [patron_contract|E] will be created"
 gdp_merchant.1003.c: ""We are merchants. Profit is everything.""

 gdp_merchant.1100.t: "A Crowded Company"
 gdp_merchant.1100.desc: "My [ROOT.Char.Custom2('RelationToMe', plaintiff)], [plaintiff.GetTitledFirstName], approaches me in my study, weighing [plaintiff.GetHerHis] words. "[ROOT.Char.GetFirstNameNoTooltip]... this is supposed to be a family business, yet we rely more and more on outsiders."\n\n"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] should trim the fat if we are to maintain our dignity."" 
 gdp_merchant.1100.a: ""[associate_2.GetFirstNameNoTooltip] is no longer needed.""
 gdp_merchant.1100.b: ""It is time we parted ways with [associate_1.GetFirstNameNoTooltip].""
 gdp_merchant.1100.c: ""Yes, let us 'trim the fat'...""
 gdp_merchant.1100.d: ""Nonsense, we need all the help we can get.""
 merchant_overcrowding_ignored_loss: "ignored company overcrowding"
 merchant_overcrowding_fired_gain: "fired an associate to address overcrowding"
 merchant_overcrowding_yeet_gain: "fired associates to address overcrowding"

 gdp_merchant.1200.t: "An Associate's Ask"
 gdp_merchant.1200.desc: "After a long day among the ledgers, I find my [ROOT.Char.Custom2('RelationToMe', requester)], [requester.GetTitledFirstName], loitering at my door, waiting to catch me. "Oh, [ROOT.Char.Custom2('RelationToMeAddress', requester)]! I've been meaning to ask..."\n\n"
 gdp_merchant.1200.desc.artifact: ""The company does so well under your leadership, with so many precious items crossing its books. I don't suppose you could... let me keep one?""
 gdp_merchant.1200.desc.activity: ""The company works hard, and you drive us well, but isn't it time we celebrated our exploits with an occasion to remember?""
 gdp_merchant.1200.desc.luxury_contract: ""The company's routes do well under your direction, but there must be so many wonders just waiting to be found, out there in the world...""
 gdp_merchant.1200.a: ""Very well, I'll see what I can do.""
 gdp_merchant.1200.b: ""Come now, I have better things to do.""
 merchant_associate_request_fulfill_gain: "fulfilled an [associate_possessive|E] request"
 merchant_associate_request_reject_loss: "rejected an [associate_possessive|E] request"
 merchant_associate_request_fail_loss: "failed to fulfill an [associate_possessive|E] request"
 gdp_merchant_1200_a_tt_artifact: "If you gift [TARGET_CHARACTER.GetShortUIName] any [artifact|E] in the next #V 5#! years:"
 gdp_merchant_1200_a_tt_activity: "If you host a [GetActivityType('activity_feast').GetName] or [GetActivityType('activity_hunt').GetName] [activity|E] in the next #V 5#! years:"
 gdp_merchant_1200_a_tt_luxury_contract: "If you complete a [luxury_contract|E] in the next #V 5#! years:"
