 game_concept_merchant_charter: "Merchant Charter"
 game_concept_merchant_charters: "Merchant Charters"
 game_concept_charter: "Charter"
 game_concept_charters: "Charters"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "A $game_concept_charter$ is a document [artifact|E] given by a [merchant_patron|E] to one of their [clients|E].\n\n$game_concept_merchants$ carrying $game_concept_charter$ $game_concept_artifacts$ bearing the seal of their $game_concept_merchant_patron$ have access to:\n$EFFECT_LIST_BULLET$#EMP #V $abuse_charter_authority_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $benevolent_charter_authority_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $leverage_charter_authority_interaction$#!#! [interaction|E]"

 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "$game_concept_make_a_request$ is an [interaction|E] used to call on a [merchant_patron|E] for favors, sponsorship, or other support."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "$game_concept_request_contract_change$ is an [interaction|E] used by a [vassal|E], [tributary|E], or [client|E] to renegotiate their obligations with their [liege|E] or [suzerain|E]."

 game_concept_leading_title: "Leading Title"
 game_concept_leading_title_desc: "The [title|E] that leads a title based confederation such as a [trade_league|E].\n\nThe [holder|E] of the leading title is the [trade_league_leader|E] of the confederation."

 game_concept_client_contract: "Client Contract"
 game_concept_client_contracts: "Client Contracts"
 game_concept_client_contract_desc: "$game_concept_client_contracts$ govern the [obligations|E] between a [client|E] and their [merchant_patron|E].\n\nFour obligations can be negotiated: the share of [trade|E] income paid to the Patron, [prestige|E] backing from the Patron, support for [trade_competitiveness|E], and facilitation of [marriages|E] on behalf of the merchant family.\n\nThe Contract is inherited on succession and cannot be dissolved unless the merchant relocates their [company|E] to a new [holding|E]."

 game_concept_member_title: "Member Title"
 game_concept_member_title_desc: "A [title|E] that is a member of a title based confederation such as a [trade_league|E]."

 game_concept_company_sentiment: "Company Direction"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "Direction"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "$game_concept_company_sentiment$ represents a [merchant_family_possessive|E] modus operandi, and the attitude its members have toward each other.\n\nThere are several [company_sentiment_levels|E], each applying different benefits and penalties to [house|E] members.\n\n$game_concept_company_sentiment$ changes depending on the actions of the $game_concept_company$ as a whole. [company_sentiment_positive_actions|E] will generally push $game_concept_sentiment$ toward [company_sentiment_concerted_i][company_sentiment_concerted|E], while [company_sentiment_negative_actions|E] will push it toward [company_sentiment_divided_i][company_sentiment_divided|E].\n\n[house_heads|E] generally have a greater degree of influence over their House's $game_concept_sentiment$ than other members."
 game_concept_company_sentiment_level: "Company Direction Stance"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "Company Direction Stances"
 game_concept_company_sentiment_level_desc: "$game_concept_company_sentiment_level$ is the current state of [company_sentiment|E]. The active stance changes as $game_concept_sentiment$ is pushed toward [company_sentiment_concerted_i][company_sentiment_concerted|E] through [company_sentiment_positive_actions|E] or toward [company_sentiment_divided_i][company_sentiment_divided|E] through [company_sentiment_negative_actions|E], and each stance provides the members of a [house|E] with various benefits and penalties.\n\nThere are five different Stances:\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i][company_sentiment_divided|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i][company_sentiment_fractious|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i][company_sentiment_independent|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i][company_sentiment_cooperative|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i][company_sentiment_concerted|E]"
 
 game_concept_company_sentiment_divided: "Rapacious"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "Opportunistic"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "Balanced"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "Grasping"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "Ennobled"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"

 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"

 game_concept_company_sentiment_divided_desc: "The $game_concept_company_sentiment_divided$ [company_sentiment_level|E] is the most competitive Stance. When a [company|E] adopts this Stance, every member of the family focuses on profit above all, even if it means stepping on each other's toes.\n\n#bold Effects from this $game_concept_company_sentiment_level$:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$[merchant_patron|E] Opinion: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$#EMP #V $unity_regional_networks_decision$#!#! [decision|E]"
 game_concept_company_sentiment_fractious_desc: "The $game_concept_company_sentiment_fractious$ [company_sentiment_level|E] is a highly competitive Stance, second only to being [rapacious|E]. When a [company|E] adopts this Stance, members put individual interests ahead of familial duty.\n\n#bold Effects from this [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$#EMP #V $unity_establish_network_decision$#!#! [decision|E]"
 game_concept_company_sentiment_independent_desc: "The $game_concept_company_sentiment_independent$ [company_sentiment_level|E] is the middle Stance. When a [company|E] adopts this Stance, the family still needs a figurehead, but members are free to conduct their own affairs without interference or judgement.\n\n#bold Effects from this [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$#EMP #V $unity_consult_house_decision$#!#! [decision|E]"
 game_concept_company_sentiment_cooperative_desc: "The $game_concept_company_sentiment_cooperative$ [company_sentiment_level|E] is a highly legitimacy-focused Stance, second only to being [ennobled|E]. When a [company|E] adopts this Stance, the company's reputation and the reputations of its members become one and the same, and each member must strive to improve their image as well as their social standing.\n\n#bold Effects from this [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$: #P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#! [decision|E]"
 game_concept_company_sentiment_concerted_desc: "The $game_concept_company_sentiment_concerted$ [company_sentiment_level|E] is the most legitimacy-focused Stance. When a [company|E] adopts this Stance, loyalty born of duty and respect binds the interests of the whole to those of the head, and the company may stand on equal footing with noble families.\n\n#bold Effects from this [company_sentiment_level|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$#EMP #V $unity_family_business_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#! [decision|E]"

 game_concept_company_sentiment_positive_actions: "Legitimizing Actions"
 game_concept_company_sentiment_positive_actions_desc: "Legitimizing Actions by your [company|E] will push your [company_sentiment|E] toward [company_sentiment_concerted_i][company_sentiment_concerted|E].\n\n[house_heads|E] can use the #V $unity_merchant_promote_excess_decision$#! [decision|E] to greatly push [company_sentiment|E] toward [company_sentiment_concerted_i][company_sentiment_concerted|E].\n\n#weak Some examples of $game_concept_company_sentiment_positive_actions$ are:$company_sentiment_increase_examples$#!"

 game_concept_company_sentiment_negative_actions: "Profit-Driven Actions"
 game_concept_company_sentiment_negative_actions_desc: "Profit-Driven Actions by your [company|E] will push your [company_sentiment|E] toward [company_sentiment_divided_i][company_sentiment_divided|E].\n\n[house_heads|E] can use the #V $unity_merchant_promote_diligence_decision$#! [decision|E] to greatly push [company_sentiment|E] toward [company_sentiment_divided_i][company_sentiment_divided|E].\n\n#weak Some examples of $game_concept_company_sentiment_negative_actions$ are:$company_sentiment_decrease_examples$#!"

 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ between House and nobility\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ Completing an Associate request\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ with another Merchant House\n$EFFECT_LIST_BULLET$ Invite to Company\n$EFFECT_LIST_BULLET$ Failing an Associate request\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$"

 game_concept_republican_army: "Republican Army"
 game_concept_republican_armies: "Republican Armies"
 game_concept_republican_army_desc: "A $game_concept_republican_army$ is an [army|E] recruited and maintained by a [realm|E] with a [republican|E] [government|E].\n\nThey are exclusively made up of [title_men_at_arms|E], and are controlled by whoever takes office as [liege|E]."
 REPUBLICAN_ARMY_CONCEPT: "[republican_army|E]"
 REPUBLICAN_ARMY_CONCEPT_NO_TOOLTIP: "$game_concept_republican_army$"
 REPUBLICAN_ARMIES_CONCEPT: "[republican_armies|E]"
 REPUBLICAN_ARMIES_CONCEPT_NO_TOOLTIP: "$game_concept_republican_armies$"
