l_english:

 # Trade
 game_concept_trade: "Trade"
 game_concept_trade_desc: "$game_concept_trade$ is the livelihood of [republics|E], [trade_leagues|E], and [merchants|E].\n\n[trade_routes|E] account for importing and exporting [goods|E] to and from [trade_markets|E], while a market's [needs|E] and [surpluses|E] are dictated by the [buildings|E] in their constituent [baronies|E].\n\nSale Prices, on the other hand, are determined by a holding's [prosperity|E], and characters engaged in sales use [competitiveness|E] and [monopolies|E] to dominate Markets. To increase profit, anyone trading in a Market should strive to increase the [capacity|E] and Length of their Routes, as well as the number of Markets and Trade Goods per route.\n\nAll [government_forms|E], except for [adventurers|E] and [nomads|E], can engage with $game_concept_trade$."
 game_concept_trade_good: "Trade Good"
 game_concept_trade_goods: "Trade Goods"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "Trade Good's"
 game_concept_trade_goods_possessive: "Trade Goods'"
 game_concept_good: "Good"
 game_concept_goods: "Goods"
 game_concept_basic_trade_good: "Basic Trade Good"
 game_concept_basic_trade_goods: "Basic Trade Goods"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$ are [trade_goods|E] that can be moved by a [distribution_route|E].\n\nIn contrast, a [profit_route|E] or [commission_route|E] may trade in any $game_concept_trade_goods$."
 game_concept_market_toll: "Market Toll"
 game_concept_market_tolls: "Market Tolls"
 game_concept_toll: "Toll"
 game_concept_tolls: "Tolls"
 game_concept_market_toll_desc: "$game_concept_market_tolls$ are the dues charged on every sale made within a [trade_market|E].\n\nThey are controlled by the [market_owner|E], who also receives all fees from them.\n\nMarkets with lower $game_concept_market_tolls$ are more profitable for [merchants|E].\n\nHigher $game_concept_market_tolls$ increase the $game_concept_market_owner_possessive$ [income|E], but cut into the profit $game_concept_merchants$ make on every [profit_route|E] selling $game_concept_goods$ at the $game_concept_market$. Steep enough $game_concept_tolls$ may push $game_concept_merchants$ to sell at less-tolled $game_concept_markets$ instead.\n\nThe [market_owner|E] and their [direct_vassals|E], [tributaries|E], and [clients|E] are exempt from paying tolls."
 game_concept_good_possessive: "Good's"
 game_concept_goods_possessive: "Goods'"
 game_concept_trade_good_desc: "$game_concept_trade_goods$ can be bought and sold at a [market|E]. A multitude of different wares are traded all across the world to fulfill the [needs|E] of the [realms|E]."
 game_concept_trade_category: "Goods Category"
 game_concept_trade_categories: "Goods Categories"
 game_concept_trade_category_short: "Category"
 game_concept_trade_categories_short: "Categories"
 game_concept_trade_category_desc: "$game_concept_trade_categories$ are groups of [trade_goods|E]. [trade_markets|E] often have a [need|E] for goods within a certain Category. Any good within that category can fulfill the need."
 game_concept_trade_expertise: "Trade Expertise"
 game_concept_expertise: "Expertise"
 game_concept_trade_expertise_desc: "$game_concept_trade_expertise$ represents practical experience trading in a specific [trade_category|E]. It is earned from the [primary_good|E] of active [trade_routes|E]. As Expertise grows, that Category becomes more profitable to handle, and higher [expertise_levels|E] grant further bonuses that depend on the Category."
 game_concept_trade_expertise_progress: "Trade Expertise Progress"
 game_concept_expertise_progress: "Expertise Progress"
 game_concept_trade_expertise_progress_desc: "Each point of [expertise|E] increases a character's progression toward the next [expertise_level|E]."
 game_concept_trade_expertise_level: "Trade Expertise Level"
 game_concept_expertise_level: "Expertise Level"
 game_concept_expertise_levels: "Expertise Levels"
 game_concept_trade_expertise_level_desc: "A [trade_category|E]'s $game_concept_trade_expertise_level$ is a ranked tier reflecting how experienced a [trade_company|E] has become at trading that Category.\n\nIt advances as [expertise_progress|E] accumulates from active [trade_routes|E], and each level provides additional [trade|E] bonuses.\n\nWithout active Trade in the Category, the level will gradually decline (#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! Expertise Progress per month)."
 game_concept_trade_market: "Trade Market"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "Trade Markets"
 game_concept_trade_market_possessive: "Trade Market's"
 game_concept_trade_markets_possessive: "Trade Markets'"
 game_concept_market: "Market"
 game_concept_markets: "Markets"
 game_concept_market_possessive: "Market's"
 game_concept_markets_possessive: "Markets'"
 game_concept_trade_market_desc: "A $game_concept_trade_market$ is a trading hub that consolidates the [production|E] and [needs|E] of all [holdings|E] that it encompasses.\n\nWithin a Market, local Production is used first to meet the [needs|E] of its [buildings|E]; whatever remains becomes a [surplus|E] that can be sold, while unmet Needs must be covered by imports. [trade_routes|E] link Markets together to carry [goods|E] between them.\n\nEach Market is centred on a [market_capital|E] held by its [market_owner|E], and the higher its [market_prosperity|E], the better the [sell_prices|E] it offers to traders."
 game_concept_market_prosperity: "Market Prosperity"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$ is the average [prosperity|E] level across all [counties|E] in a [market|E].\n\nHigher $game_concept_market_prosperity$ increases the [sell_prices|E] of [goods|E] in the Market, making it a more lucrative destination for [merchants|E]."
 game_concept_market_capital: "Market Capital"
 game_concept_market_capitals: "Market Capitals"
 game_concept_market_capital_possessive: "Market Capital's"
 game_concept_market_capitals_possessive: "Market Capitals'"
 game_concept_market_capital_desc: "The $game_concept_market_capital$ is the [holding|E] at the heart of a [market|E], usually the [de_jure|E] capital of the [duchy|E] the Market covers.\n\nIt is fixed at the start of the game and does not move. Whoever holds this [barony|E] becomes the [market_owner|E] and controls the Market."
 game_concept_market_owner: "Market Owner"
 game_concept_market_owners: "Market Owners"
 game_concept_market_owner_possessive: "Market Owner's"
 game_concept_market_owners_possessive: "Market Owners'"
 game_concept_owner: "Owner"
 game_concept_owners: "Owners"
 game_concept_owner_possessive: "Owner's"
 game_concept_owners_possessive: "Owners'"
 game_concept_market_owner_desc: "The $game_concept_market_owner$ is whoever holds the [market_capital|E] of a [market|E], control of which transfers with ownership of its [barony|E] through war or inheritance.\n\nThe Market Owner controls the Market; they can create [distribution_routes|E] connected to it, are the required partner for [commission_routes|E], can bestow [monopolies|E] within it, and set its [market_toll|E]."
 game_concept_market_priority: "Market Priority"
 game_concept_market_priorities: "Market Priorities"
 game_concept_market_priority_desc: "$game_concept_market_priority$ is the order in which the [holdings|E] of a [market|E] are served when their [needs|E] are met.\n\nFirst is the [market_capital|E], then the rest of its [county|E], followed by the other $game_concept_counties$ by their [county_capital|E]'s [settlement_size|E].\n\nInside each $game_concept_county$, the [county_capital|E] is first, followed by the other $game_concept_holdings$ by their [settlement_size|E].\n\nOnce inside the [holding|E], you can reorder the [districts|E] and [buildings|E] to ensure the right [building|E] gets its [needs|E] met first."
 game_concept_market_share: "Market Share"
 game_concept_market_shares: "Market Shares"
 game_concept_market_share_desc: "Your $game_concept_market_share$ is how much of a [trade_good|E] your [profit_route|E] can trade in a [market|E], as determined by your $game_concept_competitiveness$.\n\nFor example, if you have as much $game_concept_competitiveness$ as everyone else combined in a certain $game_concept_good$, your $game_concept_market_share$ would be 50%. If there is no one else trading in the $game_concept_good$, your $game_concept_market_share$ is always 100%.\n\nAt that point, you would be able to buy all the [surplus|E], or sell to meet all the [needs|E] in that $game_concept_market$, as long as you have enough [capacity|E]."
 game_concept_trade_route: "Trade Route"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "Trade Routes"
 game_concept_trade_route_possessive: "Trade Route's"
 game_concept_trade_routes_possessive: "Trade Routes'"
 game_concept_route: "Route"
 game_concept_routes: "Routes"
 game_concept_route_possessive: "Route's"
 game_concept_routes_possessive: "Routes'"
 game_concept_trade_route_desc: "A $game_concept_trade_route$ allows a [character|E] to engage in [trade|E] for [gold|E] or to meet the demands of their [realm|E]. These channels exchange [goods|E] between [markets|E], taking the [surplus|E] from one to fulfill the [needs|E] of the other.\n\nThere are three types of Routes:\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E]: Used by [dukes|E] and above to fulfill the [needs|E] of their [buildings|E].\n$EFFECT_LIST_BULLET$[profit_route|E]: Used by [merchants|E] and [republican|E] rulers to generate [gold|E].\n$EFFECT_LIST_BULLET$[commission_route|E]: Much like Profit Routes, but issued by landed rulers to Merchants to fulfill needs for a limited time, with a single, up-front payment.#!"
 game_concept_distribution_route: "Distribution Route"
 game_concept_distribution_routes: "Distribution Routes"
 game_concept_distribution: "Distribution"
 game_concept_distribution_route_possessive: "Distribution Route's"
 game_concept_distribution_routes_possessive: "Distribution Routes'"
 game_concept_distribution_route_desc: "A $game_concept_distribution_route$ is a type of [trade_route|E] used by [dukes|E] and above to supply their own [realm|E].\n\nIt connects two [markets|E], and any [surplus|E] in one $game_concept_market$ is used to fulfill [needs|E] in the other. However, only [basic_trade_goods|E] can be moved via $game_concept_distribution_routes$."
 game_concept_profit_route: "Profit Route"
 game_concept_profit_routes: "Profit Routes"
 game_concept_profit: "Profit"
 game_concept_profit_route_possessive: "Profit Route's"
 game_concept_profit_routes_possessive: "Profit Routes'"
 game_concept_profit_route_desc: "A $game_concept_profit_route$ is a type of [trade_route|E] used by [merchants|E] and [republican|E] [rulers|E] to earn [gold|E].\n\nIt buys [trade_goods|E] cheaply where they are in [surplus|E] and sells them where [needs|E] are high, profiting from the difference between the [buy_price|E] and the [sell_price|E]."
 game_concept_trade_route_modifier: "Trade Route Modifier"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "Trade Route Modifiers"
 game_concept_trade_route_modifier_desc: "This [modifier|E] applies to all the [trade_routes|E] of their owner. The different attributes that can be modified are:\n$BULLET_WITH_TAB$[competitiveness_i][trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i][route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i][max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i][max_trade_markets_short|E]"
 game_concept_commission_route: "Commission Route"
 game_concept_commission_route_desc: "A $game_concept_commission_route$ is a [trade_route|E] that a [merchant|E] fulfills on behalf of their [merchant_patron|E].\n\nThe $game_concept_merchant$ is paid by the $game_concept_merchant_patron$ to bring a specific [trade_good|E] to the designated [trade_market|E] for the $game_concept_commission_possessive$ duration.\n\nA $game_concept_merchant$ may have #V 1#! $game_concept_commission_route$ at a time."
 game_concept_commission_routes: "Commission Routes"
 game_concept_commission_route_possessive: "Commission Route's"
 game_concept_commission_routes_possessive: "Commission Routes'"
 game_concept_commission: "Commission"
 game_concept_commissions: "Commissions"
 game_concept_commission_possessive: "Commission's"
 game_concept_commissions_possessive: "Commissions'"
 game_concept_commissioned_route: "Commissioned Route"
 game_concept_commissioned_routes: "Commissioned Routes"
 game_concept_trade_route_length: "Trade Route Length"
 game_concept_route_length: "Route Length"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$ is the maximum number of [baronies|E] that a [profit_route|E] can span, including seas and navigable rivers. This can be increased by upgrading [company_buildings|E]."
 game_concept_max_trade_goods: "Max Trade Goods"
 game_concept_max_trade_goods_short: "Trade Goods"
 game_concept_max_trade_goods_desc: "$game_concept_max_trade_goods$ is the number of different [good|E] types that can be traded on a [route|E]. This can be increased by upgrading [company_buildings|E].\n\nA [profit_route|E] can never carry more than #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#! [goods|E], regardless of any bonuses."
 game_concept_max_trade_markets: "Max Trade Markets"
 game_concept_max_trade_markets_short: "Trade Markets"
 game_concept_max_trade_markets_desc: "$game_concept_max_trade_markets$ is the amount of [markets|E] a [character|E] can select as stops along a [profit_route|E]. This can be increased by upgrading [company_buildings|E]."
 game_concept_trade_route_capacity: "Trade Route Capacity"
 game_concept_trade_route_capacity_short: "Trade Capacity"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "Capacity"
 game_concept_trade_route_capacity_desc: "$game_concept_trade_route_capacity$ determines the amount of [trade_goods|E] that can be traded along a [profit_route|E] at any given time. This can be increased by upgrading [company_buildings|E]."
 game_concept_primary_good: "Primary Good"
 game_concept_primary_goods: "Primary Goods"
 game_concept_primary_good_desc: "[merchants|E] and [patricians|E] have one [trade_good|E] that is the $game_concept_primary_good$ for their [trade_routes|E].\n\nTrading it grants [trade_expertise|E] in that Good's [trade_category|E]."
 game_concept_road: "Road"
 game_concept_roads: "Roads"
 game_concept_road_possessive: "Road's"
 game_concept_roads_possessive: "Roads'"
 game_concept_road_desc: "A [road|E] connects two [markets|E], allowing [trade_routes|E] to travel between them.\n\n$game_concept_trade_routes$ along a $game_concept_road$ benefit from it, chiefly by increasing their [trade_route_length|E].\n\nA $game_concept_road$ also directly benefits the [barony|E] it passes through, such as improving the movement speed of [armies|E].\n\nThe benefits of a $game_concept_road$ grow with its [road_tier|E]."
 game_concept_road_tier: "Road Tier"
 game_concept_road_tiers: "Road Tiers"
 game_concept_road_tier_short: "Tier"
 game_concept_road_tier_desc: "$game_concept_road_tier$ is the level of development of a [road|E], rising from a rough, undeveloped track up to a well-built highway.\n\nA Road advances in Tier the more [trade|E] passes along it, with each Tier taking more use and longer to complete than the last. Higher Tiers strengthen the Road's effects — greater [trade_route_length|E] for the [trade_routes|E] that use it, and stronger bonuses for the [baronies|E] it crosses.\n\nRoads begin at a Tier set on the map, and only those above the lowest Tier are drawn at the start of the game."
 game_concept_building_need: "Building Need"
 game_concept_building_needs: "Building Needs"
 game_concept_need: "Need"
 game_concept_needs: "Needs"
 game_concept_building_need_desc: "A [building|E] can have $game_concept_needs$ for [trade_goods|E] which provide bonuses if met.\n\n$game_concept_needs$ are either for a specific [good|E] #weak (such as [GetTradeGoodType('trade_good_wine').GetName])#!, or any $game_concept_good$ from a certain [trade_category_short|E] #weak (such as [GetTradeGoodCategory('trade_category_alcohol').GetName])#!.\n\nAll $game_concept_needs$ are met by the $game_concept_trade_goods$ in the local [market|E]. If there is not a [surplus|E] of the $game_concept_good$ in the local $game_concept_market$, the $game_concept_goods$ will be doled out according to [market_priority|E].\n\n$game_concept_needs$ are always optional; there is no downside to not meeting them."
 game_concept_market_balance: "Market Balance"
 game_concept_market_balances: "Market Balances"
 game_concept_market_balance_short: "Balance"
 game_concept_market_balances_short: "Balances"
 game_concept_market_balance_desc: "Each [market|E] has a Balance for each [trade_good|E], or category of [goods|E].\n\nIf the Balance is positive, it is a [surplus|E].\n\nIf the Balance is negative, there are still unmet [needs|E] in [buildings|E] in the Market."
 game_concept_trade_surplus: "Market Surplus"
 game_concept_trade_surpluses: "Market Surpluses"
 game_concept_surplus: "Surplus"
 game_concept_surpluses: "Surpluses"
 game_concept_trade_surplus_desc: "A [trade_good|E] is in $game_concept_surplus$ in a [market|E] if there is more [production|E] than there is [need|E].\n\nThis means that all [buildings|E] in the $game_concept_market$ have their $game_concept_needs$ met.\n\nThis excess can be exported via [trade_routes|E] to other $game_concept_markets$."
 game_concept_trade_deficit: "Market Deficit"
 game_concept_trade_deficits: "Market Deficits"
 game_concept_deficit: "Deficit"
 game_concept_deficits: "Deficits"
 game_concept_trade_deficit_desc: "A [trade_good|E] has a $game_concept_deficit$ in a [market|E] if there are more [needs|E] than [production|E] or Imports.\n\nThis means that some [buildings|E] in the $game_concept_market$ will not have their $game_concept_needs$ met.\n\nImports via [trade_routes|E] can help to cover the $game_concept_deficit$."
 game_concept_production: "Production"
 game_concept_productions: "Production"
 game_concept_trade_goods_production: "Trade Goods Production"
 game_concept_produced: "Produced"
 game_concept_production_desc: "$game_concept_production$ is the quantity of a [trade_good|E] created each month by [districts|E] and their [buildings|E].\n\nWhen $game_concept_production$ in a [market|E] exceeds that market's [needs|E] for a good, the excess becomes a [surplus|E] available for [trade|E]. When $game_concept_production$ falls short, those Needs go unmet."
 game_concept_potential_production: "Potential Production"
 game_concept_potential_productions: "Potential Production"
 game_concept_potential_production_desc: "Each [county_possessive|E] Potential Production determines which raw [trade_goods|E] can be produced in the [resource_district|E] of the [county_capital|E]."
 game_concept_sell_price: "Sell Price"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "Sell Prices"
 game_concept_sell_price_desc: "A [market_possessive|E] $game_concept_sell_price$ is the [gold|E] value of a [trade_good|E] in [need|E].\n\nOwners of [profit_routes|E] earn the $game_concept_sell_price$ of a $game_concept_trade_good$ in a $game_concept_market$ when their [route|E] sells $game_concept_goods$ there to fulfill the $game_concept_market_possessive$ $game_concept_needs$.\n\n[landed|E] [rulers|E] also benefit from a high $game_concept_sell_price$, since more [merchants|E] are attracted to the $game_concept_market$, increasing the income from [tolls|E], or the likelihood that the $game_concept_need$ will be met.\n\n$game_concept_tolls$ are paid on every $game_concept_good$ sold, reducing the actual $game_concept_sell_price$.\n\nJust like its counterpart [buy_price|E], it increases with [market_prosperity|E]."
 game_concept_buy_price: "Buy Price"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "Buy Prices"
 game_concept_buy_price_desc: "A [market_possessive|E] $game_concept_buy_price$ is the [gold|E] cost of a [trade_good|E] in [surplus|E].\n\nOwners of [profit_routes|E] pay the $game_concept_buy_price$ of a $game_concept_trade_good$ in a $game_concept_market$ when their [route|E] buys $game_concept_goods$ there in $game_concept_surplus$.\n\nJust like its counterpart [sell_price|E], it increases with [market_prosperity|E]."
 game_concept_trade_monopoly: "Trade Monopoly"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "Trade Monopolies"
 game_concept_monopoly: "Monopoly"
 game_concept_monopolies: "Monopolies"
 game_concept_trade_monopoly_desc: "A $game_concept_monopoly$ lets only its owner buy and sell [goods|E] at a [market|E].\n\nA $game_concept_monopoly$ can apply in different ways:\n #indent_newline:4    $EFFECT_LIST_BULLET$A regular $game_concept_monopoly$ applies to a single [trade_category|E], while a [complete_monopoly|E] applies to all.\n$EFFECT_LIST_BULLET$An [exploitative_monopoly|E] allows its owner to buy [production|E] $game_concept_goods$ even before [needs|E] are met.\n$EFFECT_LIST_BULLET$A $game_concept_monopoly$ can be owned either by a [merchant|E], a [republic|E], or an entire [trade_league|E].#!\n\n$game_concept_monopolies$ can be acquired with the $request_trade_monopoly_for_character_interaction|V$ interaction."

 game_concept_complete_monopoly: "Complete Monopoly"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "Complete Monopolies"
 game_concept_complete_monopoly_short: "Complete"
 game_concept_complete_monopoly_desc: "A $game_concept_complete_monopoly$ covers every [trade_good|E] in a [market|E] at once. In contrast with a basic [monopoly|E], it is not limited to just one [trade_category|E]."

 game_concept_exploitative_monopoly: "Exploitative Monopoly"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "Exploitative Monopolies"
 game_concept_exploitative_monopoly_short: "Exploitative"
 game_concept_exploitative_monopoly_desc: "An $game_concept_exploitative_monopoly$ is a type of [monopoly|E] that allows its owner to directly buy the [production|E] of the [market|E].\n\nNormally, only the [surplus|E] can be bought. In contrast, the owner of an $game_concept_exploitative_monopoly$ can buy the $game_concept_production$ of [buildings|E] in the $game_concept_market$ before local [building_needs|E] are met."
 game_concept_trade_competitiveness: "Trade Competitiveness"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "Competitiveness"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "Each [profit_route|E] has $game_concept_competitiveness$: how much of the [trade_goods|E] in a [market|E] it can trade when competing with other $game_concept_profit_routes$.\n\nThe more of the total $game_concept_competitiveness$ for a certain $game_concept_trade_good$ you have, the higher your [market_share|E].\n\nIf there is a [monopoly|E] in the $game_concept_market$, only the owners of that $game_concept_monopoly$ compare their $game_concept_competitiveness$."
 game_concept_competitive_pressure: "Competitive Pressure"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "$game_concept_competitive_pressure$ represents short-lived commercial leverage earned by a [merchant|E]. It can be spent on unique [decisions|E] and [interactions|E] to give special advantages to specific [trade_routes|E]."
 game_concept_put_on_notice: "Put on Notice"
 game_concept_put_on_notice_desc: "$game_concept_put_on_notice$ is a [character_interaction|E] unlocked by the [GetPerk('prepared_conscription_perk').GetName(GetPlayer)] [perk|E]. It spends [competitive_pressure_i][competitive_pressure|E] to start a rival-facing [trade_opportunity|E] against a [merchant|E] in one of your [trade_route|E] [trade_markets|E]."
 game_concept_ruthless_oversight: "Ruthless Oversight"
 game_concept_ruthless_oversight_desc: "$game_concept_ruthless_oversight$ is a [character_interaction|E] unlocked by the [GetPerk('fear_tax_perk').GetName(GetPlayer)] [perk|E]. It can increase a Character's [court_position|E] [aptitude|E] at the cost of [dread|E], [opinion|E], and [company_sentiment|E]."
 game_concept_request_merchant_charter: "Request Merchant Charter"
 game_concept_request_merchant_charter_desc: "$game_concept_request_merchant_charter$ is a [character_interaction|E] that lets a [merchant|E] ask their [merchant_patron|E] for a [charter|E], giving them special rights within their local [market|E]."
 game_concept_monopolize_trade: "Monopolize Trade"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "$game_concept_monopolize_trade$ is a [character_interaction|E] that lets a [merchant|E] pay [gold|E] to a [market_owner|E] in exchange for a [trade_monopoly|E]."
 game_concept_trader: "Trader"
 game_concept_traders: "Traders"
 game_concept_trader_possessive: "Trader's"
 game_concept_traders_possessive: "Traders'"
 game_concept_trader_desc: "A $game_concept_trader$ is a [character|E] assigned to oversee a [trade_route|E].\n\nThey must be an [associate|E] or [courtier|E] of the Route's owner, and can only oversee one Route at a time. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\nEach Trader is assigned a task that improves a certain aspect of the Route. Their [aptitude|E] for that task is based on their [skills|E].\n\nWhile working a Route, Traders run personal [schemes|E] in each [trade_market|E]. If a Scheme fails, they gain the [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )] [trait|E] if they do not already have it. If they do, they instead gain a small amount of [trait_level_track_xp|E] in a random [GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )] [trait_level_track|E] ($trait_track_caravaneer$, $trait_track_artisan$, or $trait_track_creditor$)."
 game_concept_trader_council: "Apart from the owner's [spouse|E], they cannot also sit on the [council|E]."
 game_concept_trader_council_merchant: "The owner's [spouse|E] and [deputies|E] can also be $game_concept_traders$, except for the [GetCourtPositionType('partner_court_position').GetName()] and the [GetCourtPositionType('travel_leader_court_position').GetName()]."

#Merchant
 game_concept_merchant: "Merchant"
 game_concept_merchants: "Merchants"
 game_concept_merchant_possessive: "Merchant's"
 game_concept_merchants_possessive: "Merchants'"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "A $game_concept_merchant$ is an [unlanded|E] [character|E] who engages with [trade|E] as part of a [company|E].\n\nThese individuals seek to fulfill the [building_needs|E] of [trade_markets|E]; bolstering the economy in pursuit of personal wealth and improved social standing. Of these two goals, [prestige|E] is more valuable than [gold|E] as it allows them to elevate their position with their [merchant_patron|E] and [associates|E], empowering them to expand their [trade_routes|E] and ultimately secure a [trade_monopoly|E]."
 game_concept_merchant_family: "Merchant Family"
 game_concept_merchant_families: "Merchant Families"
 game_concept_merchant_family_possessive: "Merchant Family's"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$ are [houses|E] that engage in trade as [merchants|E] or [republicans|E]. They own a [company|E], controlled and owned by the [house_head|E], and are a vital part of a Realm's [trade|E] and [prosperity|E]."
 game_concept_associate: "Associate"
 game_concept_associates: "Associates"
 game_concept_associate_possessive: "Associate's"
 game_concept_associates_possessive: "Associates'"
 game_concept_associate_desc: "$game_concept_associates$ are [unlanded|E] characters who belong to a [merchant|E] [company|E]. They serve similar functions as [courtiers|E] for a landed ruler, and are able to manage [trade_routes|E] as [traders|E] and become [deputies|E]."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "Deputy"
 game_concept_deputies: "Deputies"
 game_concept_deputy_possessive: "Deputy's"
 game_concept_deputies_possessive: "Deputies'"
 game_concept_deputy_desc: "$game_concept_deputies$ serve [merchant_families|E] and their [companies|E] with various functions. These roles are similar to the [court_positions|E], given to [company|E] [associates|E], and their [aptitude|E] determines how successful they are at their tasks."
 game_concept_company: "Company"
 game_concept_companies: "Companies"
 game_concept_company_possessive: "Company's"
 game_concept_trade_company: "Trade Company"
 game_concept_trade_companies: "Trade Companies"
 game_concept_company_desc: "$game_concept_trade_companies$ are a [merchant_family_possessive|E] base of operations, from where all their associated [trade_routes|E] start.\n\nEach [GetGovernment( 'merchant_government' ).GetName] has a $game_concept_trade_company$ [domicile|E]. If a [merchant_patron|E] exists, the $game_concept_merchant_possessive$ $game_concept_domicile$ is typically located in their [merchant_patron_possessive|E] [holding|E].\n\n[company_buildings|E] are the [domicile_buildings|E] of the Company, providing bonuses to trade and all those who affiliate with it. The $game_concept_company$ also offers residency to its [associates|E], along with family members, and [knights|E], who may be hired as [deputies|E].\n\n#WEAK Like [courts|E], $game_concept_companies$ include some nameless [characters|E] not important enough to portray (albeit fewer of them).#!"
 game_concept_company_building: "Company Building"
 game_concept_company_buildings: "Company Buildings"
 game_concept_company_buildings_short: "Buildings"
 game_concept_company_building_desc: "$game_concept_company_buildings$ are the [domicile_buildings|E] of a [company|E]. They primarily improve [trade|E], including [capacity|E], [route_length|E], [max_trade_goods_short|E], and [max_trade_markets_short|E] on [trade_routes|E]."
 game_concept_usury: "Usury"
 game_concept_usurer: "Usurer"
 game_concept_usurers: "Usurers"
 game_concept_usurer_possessive: "Usurer's"
 game_concept_usurers_possessive: "Usurers'"
 game_concept_usurious: "Usurious"
 game_concept_interest: "Interest"
 game_concept_usury_desc: "$game_concept_usury$ is the [lending|E] of [gold|E] at $game_concept_interest$. Whether it is honest business or a [sin|E] is decided by the [GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip] [doctrine|E] of a [rite|E].\n\nWhere it is condemned, a [merchant|E] loses [piety|E] for every [loan|E] made through the $loan_money_interaction|V$ [interaction|E], and a [company|E] running on the $company_purpose_creditor|V$ purpose earns its owner a lasting reputation as a $game_concept_usurer$ once their $game_concept_interest$ is out in the open.\n\n#weak Some $game_concept_rites$ bar lending at $game_concept_interest$ only within their own [religion|E], leaving their $game_concept_merchants$ free to lend to everyone else.#!"
 game_concept_loan: "Loan"
 game_concept_loans: "Loans"
 game_concept_loan_possessive: "Loan's"
 game_concept_loans_possessive: "Loans'"
 game_concept_loaned: "Loaned"
 game_concept_lending: "Lending"
 game_concept_loan_desc: "A $game_concept_loan$ is a sum of [gold_i|E][gold|E] given with the expectation of repayment, with or without $game_concept_interest$.\n\n$game_concept_loans$ are generally taken by a [ruler|E] who finds themselves in [debt|E], or in need of extra funds for a [war|E] or other spending.\n\n$game_concept_loans$ may be granted with openly declared $game_concept_interest$, disguised $game_concept_interest$, or $game_concept_interest$ free, and different [faiths|E] have different views of [usury|E].\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help A $game_concept_loan$ may outlive the people who agreed it: when either party dies, it passes to their [heir|E], if they have one#!"
 loan_repayment_help: "#help $game_concept_loans$ can be repaid by a [debtor|E] using the [GetDecisionWithKey('repay_loan_decision').GetName] [decision|E], and a [creditor|E] may demand such via the #V $demand_repayment_interaction$#! [interaction|E] after at least #V 2#! years have passed\n\n[merchants|E] with the [GetLaw('company_purpose_creditor').GetName] [company_purpose|E] may also recover [loans|E] over time by employing a [GetCourtPositionType( 'bailiff_court_position' ).GetName()] and using the #V $bailiff_collect_loans$#! [court_position_task|E]#!"
 game_concept_merchant_patron: "Patron"
 game_concept_merchant_patrons: "Patrons"
 game_concept_merchant_patron_possessive: "Patron's"
 game_concept_merchant_patron_desc: "A $game_concept_merchant_patron$ is the [ruler|E] of the [holding|E] where a [merchant_possessive|E] [domicile|E] is located.\n\nThe $game_concept_merchant$ then is considered a [client|E] of the $game_concept_merchant_patron$, and must pay [taxes|E] to them."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "Client Merchant"
 game_concept_client_merchants: "Client Merchants"
 game_concept_client_merchant_possessive: "Client Merchant's"
 game_concept_client: "Client"
 game_concept_client_possessive: "Client's"
 game_concept_clients: "Clients"
 game_concept_client_merchant_desc: "A $game_concept_client_merchant$ is a [merchant|E] [character|E]. They own a [company|E] within the [realm|E] of a [landed|E] [ruler|E], who becomes their [merchant_patron|E].\n\nThe $game_concept_client_merchant$ provides their Patron with a portion of the income of their [trade|E]. They can't join a war or [faction|E] against their Patron, nor can they break free unless they move their Company elsewhere."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"

 game_concept_seize_realm_cb: "Seize Realm"
 game_concept_seize_realm_cb_desc: "A [casus_belli|E] that allows a [merchant|E] to establish a [republic|E] and become landed. Attacker may use the #V $gdp_merchant_seize_realm_call_debtor_interaction$#! [interaction|E] to spend @unspent_strong_hook_icon! [strong_hooks|E] #weak ($strong_indebted_hook$ or $strong_loan_hook$)#! to force [independent|E] [rulers|E] to join this [war|E] as [allies|E]."
 game_concept_company_purpose: "Company Purpose"
 game_concept_company_purposes: "Company Purposes"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$ are directives that shape a [company|E] and its [merchant_family|E].\n\nA company can focus either on moneylending, familial reliability, the quality and rarity of its merchandise, or the reach of its network, bridging distances and cultures alike.\n\nThe different purposes provide unique [interactions|E], [deputy|E] positions, and [trade|E] bonuses."

 game_concept_trade_acumen: "Trade Acumen"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "Acumen"
 game_concept_trade_acumen_desc: "$game_concept_acumen$ represents the total amount of [gold|E] a [merchant|E] [company|E] has accumulated through [trade|E], across all [trade_categories|E].\n\nAcumen is used to unlock different [company_sizes|E] and cannot be spent."

 game_concept_company_size: "Company Size"
 game_concept_company_sizes: "Company Sizes"
 game_concept_company_size_desc: "$game_concept_company_size$ represents a [merchant_family_possessive|E] dominance in [trade|E], with each level greatly increasing their [competitiveness|E] and Trade abilities. Advancing to a higher size requires accumulating [acumen|E].\n\nThere are four different Sizes: [GetLaw('company_size_small').GetName], [GetLaw('company_size_medium').GetName], [GetLaw('company_size_large').GetName], and [GetLaw('company_size_huge').GetName]."

#Contracts
 game_concept_trade_contract: "Trade Contract"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "Trade Contracts"
 game_concept_trade_contract_possessive: "Trade Contract's"
 game_concept_trade_contracts_possessive: "Trade Contracts'"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$ are avenues by which [merchant|E] [companies|E] may influence their [trade_routes|E] or seek valuable riches in distant lands.\n\nThe former are known as [trade_opportunities|E], and the latter as [luxury_contracts|E]."
 game_concept_trade_contract_tier: "Trade Contract Tier"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "Tier"
 game_concept_trade_contract_tier_desc: "Each [trade_contract|E] has a $game_concept_trade_contract_tier_tier$, which determines both the difficulty and the reward of the $game_concept_trade_contract$. It is usually based on the [prosperity|E] of its location."
 game_concept_luxury_contract: "Luxury Contract"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "Luxury Contracts"
 game_concept_luxury_contract_possessive: "Luxury Contract's"
 game_concept_luxury_contracts_possessive: "Luxury Contracts'"
 game_concept_luxury_contract_desc: "$game_concept_luxury_contracts$ require [merchant|E] [companies|E] to [travel|E] to a distant location and attempt to procure a [domicile_artifact|E].\n\nThese Contracts have a chance to spawn yearly for Merchants with the Caravaneer [company_purpose|E], and can be acquired via the [GetDecisionWithKey('gdp_visit_holding_decision').GetName] [decision|E]"

 game_concept_trade_opportunity: "Trade Opportunity"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "Trade Opportunities"
 game_concept_trade_opportunity_possessive: "Trade Opportunity's"
 game_concept_trade_opportunities_possessive: "Trade Opportunities'"
 game_concept_opportunity: "Opportunity"
 game_concept_opportunities: "Opportunities"
 game_concept_opportunity_possessive: "Opportunity's"
 game_concept_opportunities_possessive: "Opportunities'"
 game_concept_trade_opportunity_desc: "$game_concept_trade_opportunities$ require [merchant|E] [companies|E] to successfully complete a [scheme|E].\n\nThese are usually strictly business (like promoting profitable [trade_goods|E]), but may also be more antagonistic (like competing with a rival family for control of a [market|E]).\n\nIf the $game_concept_scheme$ is failed or abandoned for any reason, the $game_concept_trade_opportunity$ is failed too."
 game_concept_trade_opportunity_tier: "Trade Opportunity Tier"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "Tier"
 game_concept_trade_opportunity_tier_desc: "$game_concept_trade_opportunity_tier$ is reflective of the [prosperity|E] of the location where the Contract is set.\n\nThe higher the $game_concept_trade_opportunity_tier$, the higher the pay is scaled to be — though the difficulty of the task is generally also higher."
 game_concept_trade_opportunity_scheme: "Trade Opportunity Scheme"
 game_concept_trade_opportunity_schemes: "Trade Opportunity Schemes"
 game_concept_trade_opportunity_scheme_possessive: "Trade Opportunity Scheme's"
 game_concept_trade_opportunity_schemes_possessive: "Trade Opportunity Schemes'"
 game_concept_trade_opportunity_scheme_trade_opportunity: "Trade Opportunity"
 game_concept_trade_opportunity_scheme_opportunity: "Opportunity"
 game_concept_opportunity_scheme: "Opportunity Scheme"
 game_concept_opportunity_schemes: "Opportunity Schemes"
 game_concept_opportunity_scheme_possessive: "Opportunity Scheme's"
 game_concept_opportunity_schemes_possessive: "Opportunity Schemes'"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "Patron Contract"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "Patron Contracts"
 game_concept_patron_contract_possessive: "Patron Contract's"
 game_concept_patron_contracts_possessive: "Patron Contracts'"
 game_concept_patron_contract_desc: "$game_concept_patron_contracts$ require [merchant|E] [companies|E] to successfully complete a [scheme|E] against their [merchant_patron|E].\n\nThese are typically [diplomacy|E]-oriented and are designed to aid the Patron's wishes (like resolving a market dispute), or to bend them to the Merchant's will (like pushing out a rival merchant family).\n\nIf the $game_concept_scheme$ is failed or abandoned for any reason, the $game_concept_patron_contract$ is failed too."
 game_concept_patron_contract_scheme: "Patron Contract Scheme"
 game_concept_patron_contract_schemes: "Patron Contract Schemes"
 game_concept_patron_contract_scheme_possessive: "Patron Contract Scheme's"
 game_concept_patron_contract_schemes_possessive: "Patron Contract Schemes'"
 game_concept_patron_contract_scheme_patron_contract: "Patron Contract"
 game_concept_patron_scheme: "Patron Scheme"
 game_concept_patron_schemes: "Patron Schemes"
 game_concept_patron_scheme_possessive: "Patron Scheme's"
 game_concept_patron_schemes_possessive: "Patron Schemes'"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"

 game_concept_unity_contract: "Direction Contract"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "Direction Contracts"
 game_concept_unity_contract_possessive: "Direction Contract's"
 game_concept_unity_contracts_possessive: "Direction Contracts'"
 game_concept_unity_contract_desc: "$game_concept_unity_contracts$ arise when a [merchant_possessive|E] [company_sentiment|E] is low, presenting a problem that should be addressed."

 game_concept_domicile_artifact: "Domicile Artifact"
 game_concept_domicile_artifacts: "Domicile Artifacts"
 game_concept_domicile_artifact_desc: "A $game_concept_domicile_artifact$ is an [artifact|E] that is put on display in a [merchant_possessive|E] [company|E], such as [curios|E] and [creatures|E].\n\n$game_concept_domicile_artifacts$ are a $game_concept_merchant_possessive$ primary source of a passive [prestige|E] income.\n\nThere is no limit to how many $game_concept_artifacts$ a [character|E] can have, but only those displayed in a slot of its type has any effect.\n\n$game_concept_merchants$ can acquire $game_concept_domicile_artifacts$ from successfully completing [luxury_contracts|E]."

 game_concept_menagerie: "Menagerie"
 game_concept_menagerie_creature: "Menagerie Creature"
 game_concept_menagerie_creatures: "Menagerie Creatures"
 game_concept_creature: "Creature"
 game_concept_creatures: "Creatures"
 game_concept_creature_desc: "A $game_concept_creature$ is a living animal procured via [merchants|E] when completing [luxury_contracts|E]. \n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "Curiosity"
 game_concept_curios: "Curiosities"
 game_concept_curio_desc: "A $game_concept_curio$ is a rare [artifact|E] type procured via [merchants|E] when completing [luxury_contracts|E].\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "They can be displayed as a [domicile_artifact|E] in a [company|E] to gain a steady inflow of [prestige|E]."

 game_concept_guelph_ghibelline_precursor_situation: "$game_concept_guelph_ghibelline_situation$ Prelude"
 game_concept_guelph_ghibelline_precursor_situation_desc: "A prelude to the [guelph_ghibelline_situation|E] [situation|E], this is a collection of events that deepen the conflict between the Holy Roman Empire and the Papacy.\n\n#F It all started with the papal resurgence of [Glossary( 'In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS' )] where the Pope at the time declared that nobility should have no part in the papal elections but rather cardinals assembled in Rome.\n\nLater on during [Glossary( 'Dictatus Papae', 'DICTATUS_PAPAE_GLOSS' )] and the Investiture Controversy, the Pope declared that the Papal power vested in them by God is the universal power and the only one who can appoint or depose of churchmen. Bishops being invested with lay symbols of their office were frowned upon."
 game_concept_guelph_ghibelline_situation: "Guelphs & Ghibellines"
 game_concept_guelph_ghibelline_situation_desc: "A situation that arose as a conflict between the Pope ([guelphs|E]) and the Holy Roman Empire ([ghibellines|E]).\n\nOver time it evolved into a local matter of whether the rulers of Northern Italy wanted more involvement from the Empire or to keep their independence intact."
 game_concept_gg_involvement: "Involvement"
 game_concept_gg_involvement_desc: "The $game_concept_gg_involvement$ of a [ruler|E] in the [guelph_ghibelline_situation|E] [situation|E] signifies how much that character has affected the state of the Situation. This is mainly achieved by taking action against the opposing side.\n\nSuch actions include:\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[imprison|E], [torture|E] and [execution|E] [interactions|E]\n$BULLET_WITH_TAB$[GetScheme('gg_switch_sides').GetTypeName] [scheme|E], $gg_recruit_partisan_interaction|V$ [interaction|E], [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V] [casus_belli|E] etc\n$BULLET_WITH_TAB$Triggering [situation_catalysts|E]\n\nIn turn, $game_concept_gg_involvement$:\n$BULLET_WITH_TAB$Applies the scaling [GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip] [modifier|E] per #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#! increment\n$BULLET_WITH_TAB$Acts as a multiplier for rewards should your side end the Situation.\n\n#F During the [guelph_ghibelline_precursor_situation|E], $game_concept_gg_involvement$ cannot yet be gained, and it accrues at a reduced rate until the conflict fully erupts.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"

 game_concept_guelph: "Guelph"
 game_concept_guelphs: "Guelphs"
 game_concept_guelph_desc: "The Guelphs is the side of [guelph_ghibelline_situation|E] [situation|E] that supports the independence from the Holy Roman Empire, and by extension, the divine sovereignty.\n\n#F The name Guelph is derived from the House of Welf, historically Dukes of Bavaria, which was transformed by word-of-mouth and pronunciation.#!"
 game_concept_ghibelline: "Ghibelline"
 game_concept_ghibellines: "Ghibellines"
 game_concept_ghibelline_desc: "The Ghibellines is the side of [guelph_ghibelline_situation|E] [situation|E] that supports the increased influence and control that the Holy Roman Empire exercise over the interloping city states of Northern Italy.\n\n#F The name Ghibelline is derived from the Hohenstaufen rallying cry referencing castle Wibellingen during the Siege of Weinsberg.#!"

 game_concept_lombard_league: "Lombard League"
 game_concept_lombard_league_desc: "A League formed by the North Italian cities, opposing the increasing demands for centralization by the imperial $e_hre$."
 
 game_concept_confederation_cohesion: "Confederation Cohesion"
 game_concept_cohesion: "Cohesion"
 game_concept_confederation_cohesion_desc: "$game_concept_cohesion$ measures how firmly a [confederation|E] holds together, from #V 0#! to #V 100#!. Every member contributes to it monthly, for better or worse, and gains diminish at high $game_concept_cohesion$.\n\nEach level reached grants escalating benefits to the members. What generates $game_concept_cohesion$, and what the levels reward, depends on the kind of Confederation.\n\nConfederations use the following types of $game_concept_cohesion$:\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"

 game_concept_trade_league: "Trade League"
 game_concept_trade_league_desc: "A $game_concept_trade_league$ is a [confederation|E] of [republics|E] that Republican [rulers|E] may form or join for mutual commercial and defensive benefit.\n\nOne member holds the [leading_title|E] and acts as the [trade_league_leader|E] (the only member who can invite or remove others), while the rest hold a [member_title|E].\n\nMembers enjoy greater benefits as [league_cohesion|E] deepens."
 game_concept_trade_leagues: "Trade Leagues"
 game_concept_trade_league_short: "League"

 game_concept_league_cohesion: "League Cohesion"
 game_concept_league_cohesion_desc: "$game_concept_cohesion$ measures the unity of a [trade_league|E], each level reached granting escalating [trade|E] benefits to its members. Below #V 20#! the League is too loose for members to join each other's [wars|E] or to request [trade_monopolies|E].\n\nMembers generate it from their [title_tier|E], their [capital|E], and their [opinion|E] of the [trade_league_leader|E]. Monopolies held add more, while too few or too many [trade_league_members_short|E] bleed it."
 
 game_concept_trade_league_leader: "Trade League Leader"
 game_concept_trade_league_leader_desc: "A Trade League Leader is the official head of a [trade_league|E].\n\nThe leader is the only [trade_league_member_short|E] of a $game_concept_trade_league$ who can invite new members or remove existing members. A League begins with its founder as Leader. Members can later press a claim for Leadership. If the Leader leaves, another Member succeeds them based on [title_tier|E], [settlement_size|E] in [capital|E], and [prestige|E]."
 game_concept_trade_league_leader_short: "Leader"

 game_concept_trade_league_member: "Trade League Member"
 game_concept_trade_league_members: "Trade League Members"
 game_concept_trade_league_member_short: "Member"
 game_concept_trade_league_members_short: "Members"
 game_concept_trade_league_member_desc: "A Trade League Member is part of a [trade_league|E] by holding a [member_title|E], which are made up of the [primary_title|E] of member [republics|E].\n\nOne member holds the [leading_title|E] and acts as the [trade_league_leader|E]."

 game_concept_league_focus: "League Focus"
 game_concept_league_focuses: "League Focuses"
 game_concept_league_focus_desc: "$game_concept_league_focus$ is a [trade_category|E] chosen by the [trade_league_leader|E] of a [trade_league|E]. The [holder|E] of each [member_title|E] gains [trade_expertise|E], [production|E], and [sell_price|E] bonuses for that Category."
 
 game_concept_patrician: "Patrician"
 game_concept_patricians: "Patricians"
 game_concept_patrician_possessive: "Patrician's"
 game_concept_patrician_desc: "A Patrician is the [house_head|E] of a leading [merchant|E] family within a [republic|E]."

 game_concept_patrician_family: "Patrician Family"
 game_concept_patrician_families: "Patrician Families"
 game_concept_patrician_family_short: "Family"
 game_concept_patrician_family_desc: "A $game_concept_patrician_family$ is a [merchant_family|E] that is part of a [republic|E]. They are the noble elite who hold the power and influence within the Republic, using the [consortery|E] as their [domicile|E].\n\nA [county|E] [title_tier|E] Republic may only have a single Patrician Family, while Republics of a higher Tier may, and are expected to, have multiple."

 game_concept_patrician_rating: "Patrician Rating"
 game_concept_patrician_rating_short: "Rating"
 game_concept_patrician_rating_desc: "A [patrician_family|E] has a $game_concept_patrician_rating$, representing how integral and influential the family and its [patrician|E] are within the [republic|E].\n\nHaving a high Rating will grant bonuses to the Patrician and their [house|E], spread across three distinct levels. Each level unlocks additional benefits, such as:\n$BULLET_WITH_TAB$Improved [house_ambition|E]\n$BULLET_WITH_TAB$Increased Acceptance in [interactions|E]\n$BULLET_WITH_TAB$Increased [governor_salary|E]\n\nThere are many ways to increase Rating, key factors include:\n$BULLET_WITH_TAB$The [patrician_possessive|E] [trade|E] income\n$BULLET_WITH_TAB$Ruling the [republic|E]\n$BULLET_WITH_TAB$Securing seats on the [assembly|E] and the [liege_possessive|E] [council|E][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$[house|E] members holding a [clerical_region|E]\n$BULLET_WITH_TAB$Having the [GetModifier('favored_by_pope_modifier').GetNameWithTooltip] [modifier|E]"
 game_concept_patrician_rating_penalties_PAM: "Rating is reduced if the Patrician is [excommunicated|E], a known [criminal|E], or [GetModifier('scorned_pope_modifier').GetNameWithTooltip]."
 game_concept_patrician_rating_penalties_NO_PAM: "Rating is reduced if the Patrician is [excommunicated|E] or a known [criminal|E]."
 
 game_concept_consortery: "Consortery"
 game_concept_consorteries: "Consorteries"
 game_concept_consortery_possessive: "Consortery's"
 game_concept_consortery_desc: "The $game_concept_consortery$ is the residence and [domicile|E] of a [patrician_family|E]. It is typically located in their [liege_possessive|E] [capital|E]. \n\nSimilar to the [merchant_possessive|E] [trade_companies|E], the $game_concept_consortery$ uses [company_buildings|E] as [domicile_buildings|E] to further the House's prowess and competitiveness in trade.\n\nIt is inherited along with the [patrician_family|E] title."

 game_concept_assembly: "Assembly"
 game_concept_assembly_possessive: "Assembly's"
 game_concept_assembly_desc: "An Assembly is the governing body of a [realm|E].\n\nThe responsibilities of the Assembly are determined by [laws|E], which may include voting on and approving Laws, [republic_decrees|E], or vote on candidates in some forms of Elective [succession|E], such as [GetLaw('republican_elective_succession_law').GetName]."
 game_concept_republic_senate: "Senate"
 game_concept_republic_senate_possessive: "Senate's"
 
 game_concept_voting_session: "Voting Session"
 game_concept_voting_sessions: "Voting Sessions"
 game_concept_voting_session_desc: "A $game_concept_voting_session$ is the process by which an [assembly|E] decides on a proposed [law|E] or [republic_decree|E].\n\nWhile a Session is in progress, its members cast their votes for or against the proposal according to their Approval. If enough members approve before the Session ends, the proposal passes and takes effect.\n\nApproval can be raised ahead of a Session through a [councillor_task|E] and certain [perks|E], and a [hook|E] can be spent to force a member to vote your way."

 game_concept_republic_decree: "Republic Decree"
 game_concept_republic_decrees: "Republic Decrees"
 game_concept_republic_decree_short: "Decree"
 game_concept_republic_decrees_short: "Decrees"
 game_concept_republic_decree_desc: "A $game_concept_republic_decree$ is a type of [decision|E] for a [republic|E] that must be approved by the [assembly|E].\n\nWhile there are several types of $game_concept_republic_decrees_short$, most typically affect [patricians|E], the [realm_capital|E], or the Republic at large."
 
 game_concept_house_ambition: "House Ambition"
 game_concept_house_ambitions: "House Ambitions"
 game_concept_house_ambition_desc: "Each [house|E] within a [republic|E] has an Ambition, which indicate how the members of the House wants to impact the Republic."

 game_concept_republic_administration: "Republic Administration"    
 game_concept_republic_administration_short: "Administration"
 game_concept_republic_administrations: "Republic Administrations"
 game_concept_republic_administration_desc: "All [republics|E] have a designated Republic Administration, which determines what a Republic specializes in.\n\nOnly the Republic's [ruler|E] can change the Administration.\n\nThere are several administrations to choose from, each with their own unique benefits.\n\n#help The most common administrations are [GetLaw( 'republic_type_communal' ).GetName], [GetLaw( 'republic_type_maritime' ).GetName], and [GetLaw( 'republic_type_civic' ).GetName].#!"

 game_concept_republic_senator: "Senator"
 game_concept_republic_senators: "Senators"
 game_concept_republic_senator_desc: "A $game_concept_republic_senator$ is an appointed member of the [assembly|E] using the [GetLaw( 'republic_assembly_composition_roman_senate' ).GetName].\n\nSenators are appointed by the [republic_possessive|E] [ruler|E] or the Censor.\n\nOnly a set number of $game_concept_republic_senators$ can be appointed at once, decided by the Senate Size [law|E]."

 game_concept_mercenary_limit: "Mercenary Limit"
 game_concept_mercenary_limit_desc: "The Mercenary Limit decides how many [mercenaries|E] a [character|E] can hire at once.\n\nThe Mercenary Limit is decided by:\n$BULLET_WITH_TAB$[martial_i][martial|E] [skill|E]\n$BULLET_WITH_TAB$[title_tier_i][title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"

