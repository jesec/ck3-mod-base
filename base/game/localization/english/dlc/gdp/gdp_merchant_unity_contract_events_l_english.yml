l_english:
 option_boilerplate.tt.partner_aptitude: "#WEAK This duel is decided by your [deputy_possessive|E] [aptitude|E]#!"
 option_boilerplate.tt.partner_aptitude.success: "Your deputy succeeds"
 option_boilerplate.tt.partner_aptitude.failure: "Your deputy fails"

 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: Grumblings in [destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_unity_contract.1004.desc: "[local_ruler.GetTitledFirstNamePossessive] missive is short and to the point: the conduct of my trader, [trader.GetTitledFirstName], and thus my company, has been called into question by the irate denizens of [destination.GetBaronyNameExplicitly].\n\nLocal merchants, business owners, and residents all bring complaints of inconsistencies in my company's dealings. [local_ruler.GetTitledFirstNameNoTooltip] is keen to put the matter to bed, and quiet [local_ruler.GetHerHis] petitioners.\n\nClearly [trader.GetTitledFirstNameNoTooltip] has been taking rather too many liberties, far from the scrutiny [trader.GetSheHe] might suffer here in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nAll that waits is the journey to [destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_unity_contract.1004.a: "Let us get on our way."
 gdp_merchant_unity_contract.1004.tt.destination_list: "You immediately begin traveling to [destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT To complete the [task_contract|E]:\n$EFFECT_LIST_BULLET$You will have #V 3#! opportunities to give assurances:\n$TAB$$EFFECT_LIST_BULLET$#V 2#! assurances guarantees $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$#V 3#! assurances guarantees $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$#V 1#! assurance could lead to either a $label_success_standard$, a $label_success_qualified$, or a $label_failure_standard$\n$EFFECT_LIST_BULLET$Challenges may either be:\n$TAB$$EFFECT_LIST_BULLET$Testing your [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$Testing a [GetCourtPositionType('partner_court_position').GetName()] [deputy_possessive|E] [aptitude|E]\n$TAB$$EFFECT_LIST_BULLET$Testing your [diplomacy|E], [intrigue|E], or [learning|E]#!"

 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: Town Square"
 gdp_merchant_unity_contract.1010.desc.intro: ""[ROOT.Char.GetTitledFirstNameNoTooltip], I presume?" [local_ruler.GetTitledFirstName] sighs as my party and I meet [local_ruler.GetHerHis] entourage in [destination.GetBaronyNameExplicitly]. My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))], [trader.GetTitledFirstName], is in tow, shadowed by guards."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "My [GetCourtPositionType('partner_court_position').GetName()] [partner.GetFirstName] bobs along behind me, alert and ready to assist."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n"This merchant of yours has caused quite the upset, as our witnesses will attest." [local_ruler.GetFirstNameNoTooltip] continues, "I trust you will resolve this swiftly, I haven't time to waste on these matters!""
 gdp_merchant_unity_contract.1010.desc.outro: "\n\nI am directed to meet and hear the grievances of [person_c.GetTitledFirstName] and [person_d.GetTitledFirstName]. [trader.GetFirstNameNoTooltip] gives me a look which says, "[ROOT.Char.GetTitleAsNameNoTooltip], come now, surely you understand...""
 gdp_merchant_unity_contract.1010.a: "Good [local_ruler.GetTitledFirstNameNoTooltip], could you fill me in?"
 gdp_merchant_unity_contract.1010.a.tt: "You immediately seek [THIS.Char.GetTitledFirstNamePossessive] explanation"
 gdp_merchant_unity_contract.1010.b: "We shall meet with [person_c.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip] is keen to speak with us."
 gdp_merchant_unity_contract.1010.d: "Let us end this right now."

 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "We are escorted into the [char_current.GetTitleAsNamePossessive] private, and immodest, quarters. [char_current.GetSheHe|U] leads me to a room that clearly serves conferences of the [destination.GetTitle.Custom('BaronyTownTypePossessive')] most important people, gesturing to a seat."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName] takes me to [char_current.GetHerHis] company's premises nearby, where [char_current.GetHerHis] own associates busily mark their ledgers with the fruits of the day's deals."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName] is in charge of the city's docks, and stands watching the coming and goings from the quayside. [char_current.GetHerHis|U] endless papers track the dues owed by ships and tally delivered and loaded cargo."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName] oversees [destination.GetTitle.GetBaseNameNoTierPossessive] main market, ensuring the peddlers are properly licensed and the [local_ruler.GetTitleAsNamePossessiveNoTooltip] law is upheld."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "I find [char_current.GetFirstName] at [char_current.GetHerHis] smithy, busily hammering away at some horse shoes. [char_current.GetSheHe|U] barely notices my approach, apologizing when [char_current.GetSheHe] meets my gaze and passing the work to an apprentice."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "I find [char_current.GetFirstName] at [char_current.GetHerHis] tannery, a fetid place on the city's outskirts. [char_current.GetSheHe|U] barely registers the stench, the many pelts and customers attesting that the profit far outweighs the rankness."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "I find [char_current.GetFirstName] in [char_current.GetHerHis] workshop, the air thick with the scent of [char_current.Custom('GetRandomAppropriateTree')]. Spotting me, [char_current.GetSheHe] sets aside the joints [char_current.GetSheHe] is carving."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName] is head of the [destination.GetTitle.GetAdjectiveNoTooltip] town-watch, and I find [char_current.GetHerHim] dozing in the armory. Awaking, [char_current.GetSheHe] offers me a seat, spluttering about [char_current.GetHerHis] break-time."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: ""Let us speak plainly, [ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip]." [char_current.GetSheHe] begins. "I am told this [trader.GetWomanMan] of yours has engaged in all manner of deceptions and"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n"Get your company in order or you will have to find somewhere else to conduct your business.""
 gdp_merchant_unity_contract.1011.desc.personality.merchant: ""Is it so hard?" [char_current.GetSheHe] smiles, "To conduct your business fairly? With respect to your dealings, [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] shows poorly...""
 gdp_merchant_unity_contract.1011.desc.personality.courtier: ""I warn you," [char_current.GetSheHe] smiles, "The [local_ruler.GetTitleAsNameNoTooltip] has been patient thus far, but you would do well not to test [local_ruler.GetHerHim].""
 gdp_merchant_unity_contract.1011.desc.personality.market: ""Of all the traders operating here," [char_current.GetSheHe] smiles, spreading [char_current.GetHerHis] arms. "#EMP Your#! trader," [char_current.GetSheHe] points at me accusingly, "Is complained about time and again.""
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: ""We have a saying here," [char_current.GetSheHe] grimaces, "#EMP There's no smoke without fire#!, and your trader generates a #EMP lot#! of smoke, I tell you!""
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: ""I have always conducted my business in an upright manner, keeping healthy records and relations with my clients. It is such a shame that not all of us bother to do the same...""
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: ""There's no getting round it, [char_current.GetFaith.WealthGodName] watches over all of us, and I make sure to keep [char_current.GetFaith.WealthGodHerHis] good-side. Those who don't soon find out...""
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: ""Look, I like to take a coin as much as the next [char_current.GetWomanMan], more maybe! But I can't be running a business like this, being stiffed at every turn.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: ""You seem like a reasonable [ROOT.Char.GetWomanMan], [ROOT.Char.GetTitledFirstNameNoTooltip]. Please understand that your [trader.GetWomanMan] has wronged us, and we can't afford it.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: ""I consider myself a no-nonsense [char_current.GetWomanMan], I speak plainly and I hope others speak plainly with me. Your [trader.GetWomanMan] is a liar. That's all there is to it.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: ""I know, I know, it seems like we're doing well for ourselves, but I rely on shipments to ply my trade, and your [trader.GetWomanMan] has failed me one too many times.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: ""I like to play fairly, [ROOT.Char.GetTitledFirstNameNoTooltip], both in business, with my lessers, and with my betters. But fairness is only warranted if everyone is a party to it, otherwise, well, that's how #EMP some#! people get bad blood.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: ""I'm a busy [char_current.GetWomanMan], you're a busy [ROOT.Char.GetWomanMan], so I'll be blunt. If I don't get what I need, I can't feed mine. I want this sorted.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: ""Look, I'm sure [trader.GetFirstName] is a decent sort at heart, but there's a limit to what I can tolerate, and [trader.GetSheHe] has long since crossed that line.""
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: ""So... what are you going to do? Your [trader.GetWomanMan] has made many enemies here, and so needlessly. We just want to be treated decently.""
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "misplaced several shipments.""
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "delivered poor quality goods.""
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "failed to pay proper dues.""
 gdp_merchant_unity_contract.1011.a: "Attempt to reason away the discrepancies."
 gdp_merchant_unity_contract.1011.b: "Try to convince [char_current.GetHerHim] of your honor."
 gdp_merchant_unity_contract.1011.c: "Spin some yarn or other."
 gdp_merchant_unity_contract.1011.d.gold: ""Take this, for your inconvenience.""
 gdp_merchant_unity_contract.1011.d.competitiveness: ""I shall make sure things are put right.""
 gdp_merchant_unity_contract.1011.e: ""Perhaps we can come to an #EMP understanding?#!""
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], you can explain."
 gdp_merchant_unity_contract.1011.f.partner_away: "If only my [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] was here..."
 gdp_merchant_unity_contract.1011.f.partner_diff: "If only I had a different [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]..."
 gdp_merchant_unity_contract.1011.f.no_partner: "If only I had a [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]..."
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT You have given [task_contract.MakeScope.Var('assurances_given').GetValue|0V] assurances of a possible #V 3#!#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT You have spoken with [task_contract.MakeScope.Var('chars_checked').GetValue|0V] [characters|E] of a possible #V 3#!#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "You give #P +1#! assurance"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "No assurance is given"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Carry the one here, lose an entry there"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "Wait, no. Oh. Indeed?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "A foolish mistake on [char_current.GetHerHis] part"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Each word consistent"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "Not as smart as [char_current.GetSheHe] thinks [char_current.GetSheHe] is"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Smarter than you by half"
 gdp_merchant_unity_contract.1011.learning.tt.success: "You know where to look"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "You look everywhere but find nothing"

 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: Success!"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: Failure!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: Task Ignored"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "Looking over [char_current.GetHerHis] ledgers, [char_current.GetTitledFirstName] points out examples of malfeasance, outlays whose expected returns never materialized or were below the promised standard."
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "I speak at length of the good reputation of my company in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], and extensive references among the honorable folks thereabouts. Recent dealings are clearly an aberration that should be set aside for the good of commerce."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "I weave a meandering tale of recent difficulties, with many pointless tangents and the judicious application of truthful details, until even I am losing track of the web of lies."
 gdp_merchant_unity_contract.1012.desc.method.learning: "We talk for what #EMP feels#! like the better part of the day, discussing every conceivable aspect of [char_current.GetTitledFirstNamePossessive] businesses in [destination.GetBaronyNameExplicitly]. No stone left unturned, no question unasked."
 gdp_merchant_unity_contract.1012.desc.method.partner: "With [partner.GetFirstName] leading the interview, [char_current.GetTitledFirstName] sits down to answer a seemingly-unending barrage of questions. At first patiently, then increasingly less so as time wears on."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: ""Your understanding in this matter would be #EMP most#! appreciated." I smile, reaching for my purse and pouring a few coins onto the table. [char_current.GetSheHe|U] is briefly frozen, glancing between the shining metal and my raised eyebrow."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: ""[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] deeply regrets your inconvenience in this misunderstanding.", I croon. "I shall #EMP personally#! put right your losses.""
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "And with that, I've done all I can. It is time to put this to bed."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip] gives me a knowing look, and pulls the coins towards [char_current.GetHerHim]."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "[char_current.GetFirstNameNoTooltip] surprise quickly turns to anger, and I am pointed to the door."
 gdp_merchant_unity_contract.1012.desc.result.success: "With some blagging, and some bemoaning of the vagaries of trade, [char_current.GetFirstNameNoTooltip] slowly accepts my excuses for each of the discrepancies. Just the sad realities of long distance commerce."
 gdp_merchant_unity_contract.1012.desc.result.failure: "Despite my best attempts, [char_current.GetSheHe] dismisses each of my points, proffering a solution, rebuttal, or example from [char_current.GetHerHis] experience, and remains unsatisfied."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "A bird in the hand is worth two in the bush, and this [char_current.GetWomanMan]'s likely-misbegotten gains sit so very snugly in my hand — even if taking them has cut off our ability to investigate [char_current.GetHerHim]."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "May our luck hold for the next one."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Hopefully we do better with the next one."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.GetSheHe|U] cannot argue with that."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "May my purse survive our next visit..."
 gdp_merchant_unity_contract.1012.a: "[local_ruler.GetTitledFirstNameNoTooltip] next."
 gdp_merchant_unity_contract.1012.b: "Onwards, to see [person_c.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip] awaits us..."
 gdp_merchant_unity_contract.1012.d: "Let us end this now..."
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "You continue attempting to give assurances"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "You decide how to resolve the situation"

 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: Resolution"
 gdp_merchant_unity_contract.1021.desc.intro: "We gather in the town square once more, where [local_ruler.GetTitledFirstName] has gathered the expectant plaintiffs and my trader to hear my final opinion on the issue.\n\n[person_c.GetFirstName] and [person_d.GetFirstName] look to me, whilst [trader.GetFirstName] seems nervous for the first time since my arrival, shifting under their gaze.\n\nMy gut tells me that"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "the locals have been brought well on side."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "the locals are somewhat satisfied by my efforts."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "in any case I haven't won the local's trust."
 gdp_merchant_unity_contract.1021.desc.body: "\n\nThe [local_ruler.GetTitleAsNameNoTooltip] yawns, "Come now, what of""
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "these missing shipments?""
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "these poor quality goods?""
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "these unpaid dues?""
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Having given all possible assurances, your fulsome efforts have been enough to force an $label_success_critical$ even if you do not punish [trader.GetTitledFirstNameNoTooltip]#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT With sufficient assurances given, your efforts will likely conclude with a $label_success_standard$ even if you do not punish [trader.GetTitledFirstNameNoTooltip]#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT As you have given insufficient assurances, your shoddy efforts may lead to resistance if you do not punish [trader.GetTitledFirstNameNoTooltip]#!"
 gdp_merchant_unity_contract.1021.a: ""As I explained, this was simply a regrettable misunderstanding.""
 gdp_merchant_unity_contract.1021.a.tt: "You consider your assurances sufficient"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "If you gave many assurances"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "If you gave some assurance, and the locals give in"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "If you failed to assure, and the locals react poorly"
 gdp_merchant_unity_contract.1021.b: "You shall pay — half."
 gdp_merchant_unity_contract.1021.b.tt: "You find in favor of [local_ruler.GetTitledFirstName], but ease the tax burden on [trader.GetTitledFirstName] nonetheless"
 gdp_merchant_unity_contract.1021.c: ""This whole affair is hogswallop. Slander and hogswallop!""
 gdp_merchant_unity_contract.1021.c.tt: "You flatly deny any company wrongdoing"
 gdp_merchant_unity_contract.1021.d: ""[trader.GetTitledFirstNameNoTooltip] is guilty, and must be punished.""
 gdp_merchant_unity_contract.1021.d.tt: "You sacrifice [trader.GetTitledFirstNameNoTooltip] for the sake of the company"

 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: A Simple Misunderstanding"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: A Settled Matter"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: An Unsettled Matter"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: Unsatisfactory"
 gdp_merchant_unity_contract.1022.desc.success_critical: "The locals look at each other, nodding with gusto, while [trader.GetFirstName] beams. [local_ruler.GetTitledFirstName] is clearly relieved, and somewhat surprised. "Very good, in that case, this matter is closed!" [local_ruler.GetSheHe] pipes.\n\nThe plaintiffs each thank me profusely for my visit, and putting their minds at ease. Somehow the company is now #EMP more#! trusted in [destination.GetBaronyNameExplicitlyNoTooltip] than ever."
 gdp_merchant_unity_contract.1022.desc.success_standard: "The locals look at each other, nodding ponderously, while [trader.GetFirstName] smiles. [local_ruler.GetTitledFirstName] is tentative, but quickly moves on. "Right. Well, then the matter is closed." [local_ruler.GetSheHe] says, almost as a question.\n\nThe plaintiffs seem satisfied enough as they discuss the arguments. It seem the company's reputation in [destination.GetBaronyNameExplicitlyNoTooltip] is safe, for now."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "For a brief, tense moment, it looks like [local_ruler.GetTitledFirstName] and [local_ruler.GetHerHis] lackeys intend to contradict my weak conclusion, but the moment soon passes in silence.\n\n"Very well..." [local_ruler.GetTitleAsNameNoTooltip] sighs, eyeing the dissatisfied plaintiffs. "Make sure nothing like this ever happens again."\n\nThe locals clearly have doubts, but that is [trader.GetFirstNamePossessive] problem."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "Silence settles over the square.\n\nTense, awkward silence, as the locals eye one another, displeasure curling their mouths into near-snarls.\n\n[local_ruler.GetTitledFirstName] growls, "Is that it?", backed by the plaintiffs angry agreement.\n\n[trader.GetFirstNamePossessive] nervous gulp breaks the silence. "I am most sorry for the inconvenience," [trader.GetSheHe] offers, "But there is nothing more to be done, these things... happen.""
 gdp_merchant_unity_contract.1022.a: "That actually could not have gone better."
 gdp_merchant_unity_contract.1022.b: "All's well that ends well..."
 gdp_merchant_unity_contract.1022.c: "Well, that could have gone better."
 gdp_merchant_unity_contract.1022.d: "Uh... time to go."

 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: Denial"
 gdp_merchant_unity_contract.1023.desc: "The plaintiffs are dumbfounded, that much is clear from their angry whispers. The [local_ruler.GetTitleAsName] is clearly unsure how to proceed.\n\n[trader.GetFirstName] surprise turns to emboldened pride, as I continue: "I will not allow my company's good name to be dragged through the muck over such trifles."\n\nI turn up my nose, "You have wasted my time here, I have pressing business in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!""
 gdp_merchant_unity_contract.1023.a: "Time to go."

 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: Under the Wagon"
 gdp_merchant_unity_contract.1024.desc: "A chorus of cheers breaks out from the plaintiffs, as a somewhat surprised [local_ruler.GetTitledFirstName] calls the town-watch to clap irons on a dumb-founded [trader.GetFirstName].\n\n"B-but, [ROOT.Char.GetTitleAsNameNoTooltip]!" my trader croaks. I lazily wave [trader.GetHerHim] away with my hand, "Good riddance, [trader.GetSheHe] was a lousy trader anyway...""
 gdp_merchant_unity_contract.1024.a: "A necessary sacrifice."

 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: Inspiring Acumen"
 gdp_merchant_unity_contract.1031.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]?"\n\nI look up from my ledgers to find... a somewhat familiar [hopeful.GetCulture.GetName] [hopeful.GetWomanMan]? Where do I know [hopeful.GetHerHim] from...\n\n"I'm [hopeful.GetTitledFirstName], [ROOT.Char.GetTitleAsNameNoTooltip]. You came to my home town, [destination_1.GetBaseNameNoTier], some years ago, and settled a misunderstanding. I thought you did so with dignity and aplomb."\n\n"All the same, my businesses collapsed a ways back, and I find myself looking for other work. I thought you might... have use for me...""
 gdp_merchant_unity_contract.1031.a: "Very well, welcome aboard!"
 gdp_merchant_unity_contract.1031.b: "The company has no use for you."
