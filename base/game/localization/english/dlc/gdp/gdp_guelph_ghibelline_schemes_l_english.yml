l_english:

 #Side Switch Scheme
 gg_switch_sides: "Coax Defection"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] will soon understand what the #EMP correct#! alignment in this situation is..."
 gg_switch_sides_desc_general: "The $gg_switch_sides$ [scheme|E] is a [political_scheme|E] that aims to convince the [scheme_target|E] to change sides in the [guelph_ghibelline_situation|E] [situation|E]"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] joins the [CHARACTER.Custom('GetGuelphsGhibellinesConcept')]"
 gg_switch_sides_invalidated_title: "@scheme_icon! $gg_switch_sides$ Scheme Ends"

 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (Scheme)#!"
 gg_switch_sides_action: "Coax"
 scheme_interaction_tt_gg_switch_sides: "Attempt to coax [recipient.GetShortUINameNoTooltip] into joining the [actor.Custom('GetGuelphsGhibellinesConcept')]"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"

 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip] is still disgruntled from the last time you requested [recipient.GetSheHe] join the [actor.Custom('GetGuelphsGhibellinesConcept')]"

 #Claim Leadership Scheme
 gg_claim_leadership: "Claim Leadership"
 gg_claim_leadership_desc: "The [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')] will soon understand who is most fit to be their leader"
 gg_claim_leadership_desc_general: "The $gg_claim_leadership$ [scheme|E] is a [political_scheme|E] that aims to make the [scheme_owner|E] the leader of their side in the [guelph_ghibelline_situation|E] [situation|E]. It is a [secret_scheme|E] based on [diplomacy|E] that can recruit [agents|E].\n\nThe more [gg_involvement|E] the [scheme_owner|E] has compared to the current leader, the higher its [scheme_success_chance|E]. Outranking the leader in [prestige_level|E] also helps."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U] becomes the new leader of the [CHARACTER.Custom('GetGuelphsGhibellinesConcept')]"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "You avoid losing [prestige|E] and worsening relations with [TARGET_CHARACTER.GetShortUIName]"
 gg_claim_leadership_invalidated_title: "@scheme_icon! $gg_claim_leadership$ Scheme Ends"

 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (Scheme)#!"
 gg_claim_leadership_action: "Claim Leadership From"
 scheme_interaction_tt_gg_claim_leadership: "Attempt to seize [recipient.Custom('GetGuelphGhibellineConcept')] leadership from [recipient.GetShortUIName]"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"

 #Align Undecided Scheme
 gg_align_undecided: "Align Undecided"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] will be made to sympathize with the [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')]"
 gg_align_undecided_desc_general: "The $gg_align_undecided$ [scheme|E] is a [political_scheme|E] that aims to make the [scheme_target|E] join the [scheme_owner|E]'s side in the [guelph_ghibelline_situation|E] [situation|E]"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] becomes a [CHARACTER.Custom('GetGuelphGhibellineConcept')]"
 gg_align_undecided_invalidated_title: "@scheme_icon! $gg_align_undecided$ Scheme Ends"

 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (Scheme)#!"
 gg_align_undecided_action: "Align"
 scheme_interaction_tt_gg_align_undecided: "Attempt to align [recipient.GetShortUIName] with the [actor.Custom('GetGuelphsGhibellinesConcept')]"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"

 #Replace Ruler Scheme
 gg_replace_ruler: "Replace Ruler"
 gg_replace_ruler_desc: "[SCHEME.GetTargetCharacter.GetShortUINamePossessiveNoTooltip] services are no longer needed — [SCHEME.GetTargetCharacter.GetSheHe] needs to be replaced with someone a bit more... #EMP rational#!."
 gg_replace_ruler_desc_general: "The $gg_replace_ruler$ [scheme|E] is a [political_scheme|E] that aims to replace the [scheme_target|E] with a ruler who is loyal to the [scheme_owner|E]'s side in the [guelph_ghibelline_situation|E] [situation|E]"
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] is replaced by a [CHARACTER.Custom('GetGuelphGhibellineConcept')] loyalist"
 GG_REPLACE_RULER_DISCOVERY_DESC: "You avoid losing [prestige|E] and worsening relations with [TARGET_CHARACTER.GetShortUIName]"
 gg_replace_ruler_invalidated_title: "@scheme_icon! $gg_replace_ruler$ Scheme Ends"

 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (Scheme)#!"
 gg_replace_ruler_action: "Replace"
 scheme_interaction_tt_gg_replace_ruler: "Attempt to replace [recipient.GetShortUIName] with a [actor.Custom('GetGuelphGhibellineConcept')] loyalist"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"

 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip] is still on high alert from the last time you tried to replace [recipient.GetHerHim]"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "Can not replace a [GetSituation('guelph_ghibelline').GetName] leader while in the [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] [situation_phase_phase|E]"

 #Invalidation
 scheme_gg_situation_ended: "The [guelph_ghibelline_situation|E] ended"
 scheme_owner_not_aligned: "You are no longer a [guelph|E] or a [ghibelline|E]"
 scheme_target_not_aligned: "[target.GetShortUIName] is no longer a [guelph|E] or a [ghibelline|E]"
 scheme_target_not_undecided: "[target.GetShortUIName] is no longer [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'undecided' ).GetName]"
 scheme_owner_not_in_gg_situation: "You are no longer part of the [GetSituation('guelph_ghibelline').GetName] [situation|E]"
 scheme_target_not_in_gg_situation: "[target.GetShortUIName] is no longer part of the [GetSituation('guelph_ghibelline').GetName] [situation|E]"
 scheme_target_already_your_side: "[target.GetShortUIName] is already a [target.Custom('GetGuelphGhibellineConcept')]"
 scheme_target_is_titleless: "[target.GetShortUIName] no longer holds any titles"
 scheme_target_might_get_displaced: "[target.GetShortUIName] is the main defender in a [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V] [war|E]"
 scheme_target_might_get_reinstated: "[target.GetShortUIName] is the main defender in a [GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|V] [war|E]"
 scheme_owner_is_already_leader: "You are already the leader of the [owner.Custom('GetGuelphsGhibellinesConcept')]"
 scheme_target_no_longer_gg_leader: "[target.GetShortUIName] is no longer the leader of the [owner.Custom('GetGuelphsGhibellinesConcept')]"
