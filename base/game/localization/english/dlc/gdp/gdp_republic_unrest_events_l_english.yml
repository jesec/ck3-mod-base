l_english:
 gdp_republic_unrest.0001.t: "Capital Uprising: The Grievances"
 gdp_republic_unrest.0001.desc: "A group of workers and guild journeymen has gathered in the courtyard. One of them steps forward. "My [ROOT.Char.GetLadyLord], the taxes are turning us into paupers..."\n\nI have heard it all before. They are not the first, or the last, to bring these complaints to my doorstep."

 # Option A: Disperse
 gdp_republic_unrest.0001.a: "Guards! Get rid of these... people."

 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "I will not negotiate with peasants."
 gdp_republic_unrest.0001.b.success: "They disperse without further problems"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "The refusal leaves them furious"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"

 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "Have the council handle it."
 gdp_republic_unrest.0001.c.success: "They are convinced, for now"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "They see through the delay"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"

 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "I will make a concession, this time."

 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "Capital Uprising: The Cold Reception"
 gdp_republic_unrest.0011.desc: "As I pass through the markets, I hear the usual loud chatter, but something feels different from normal. The stalls go quiet, as do the people, who just give me uncomfortable looks.\n\nI have walked these streets for years, and it has never been like this before."
 gdp_republic_unrest.0011.a: "I am sure it is all in my mind."
 gdp_republic_unrest.0011.b: "Send someone to track down the rumors."
 gdp_republic_unrest.0011.b.success: "My people track down the source"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "The rumors continue"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "I will stop and talk to people."
 gdp_republic_unrest.0011.c.success: "People appreciate the gesture"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "Nobody is willing to talk"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "Distribute food and wine, whatever it takes."

 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "Capital Uprising: The Anonymous Letter"
 gdp_republic_unrest.0021.desc: "A letter is waiting on my desk when I arrive this morning. It has no seal, and no name. It goes into great detail to explain how much worse [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] has gotten since I became [ROOT.Char.GetTitleAsName]."
 gdp_republic_unrest.0021.a: "Throw it in the fire."
 gdp_republic_unrest.0021.b: "Someone put effort into this. Find out who."
 gdp_republic_unrest.0021.b.success: "Identified the author"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "Author remains unknown"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "I will make a public response."
 gdp_republic_unrest.0021.c.success: "The response is well received"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "The response is hated"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"

 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "Capital Uprising: The Square Belongs to Them Now"
 gdp_republic_unrest.0101.desc: ""My [ROOT.Char.GetLadyLord], some citizens have taken control of the market square... for days now." One of my guards informs me. "It seems a [demagogue.GetWomanMan] named [demagogue.GetFirstName] is loudly riling up the people."\n\nWhat am I even paying these fools for, if the market can be closed for days and nobody tells me?"

 # Option A: Disperse
 gdp_republic_unrest.0101.a: "Clear the square already!"

 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "Discredit this demagogue."
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName] is discredited"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "My attempts fall flat"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"

 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "I'll speak to them myself."
 gdp_republic_unrest.0101.c.success: "The crowd breaks apart"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "I face loud jeers"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"

 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "Just give them what they want."

 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "Capital Uprising: The Closed Quarter"
 gdp_republic_unrest.0111.desc: "News has reached me that the [closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )] has closed off all contact. They are refusing to acknowledge our tax collectors, and they will not listen to our guards."
 gdp_republic_unrest.0111.a: "Send some guards with those tax collectors."
 gdp_republic_unrest.0111.b: "Let's pay them off."
 gdp_republic_unrest.0111.b.success: "They get what they want"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "They refuse negotiations"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "I will go and talk to them myself."
 gdp_republic_unrest.0111.c.success: "They listen"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "They refuse to listen"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "They will tire eventually. Hopefully."

 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "Capital Uprising: The Effigy"
 gdp_republic_unrest.0121.desc: "As I walk through the streets I am stopped in my tracks by an ugly effigy dressed in something resembling my clothes, hanging publicly for all to see. The crowd is quiet and watching it, then me.\n\n"Just like the real thing!" someone shouts in the back, and there are loud jeers coming from the crowd."
 gdp_republic_unrest.0121.a: "Take it down! NOW!"
 gdp_republic_unrest.0121.a.flavor: "I will make sure nobody here talks about what they saw."
 gdp_republic_unrest.0121.b: "Find out who is behind this."
 gdp_republic_unrest.0121.b.success: "Organizers dealt with"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "Unable to track down organizers"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "I will publicly address this."
 gdp_republic_unrest.0121.c.success: "People listen"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "The crowd jeers and boos"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "Don't dignify it with a response."

 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "Capital Uprising: The City is Burning"
 gdp_republic_unrest.0201.desc: "I see the smoke rising before the guards reach me. "My [ROOT.Char.GetLadyLord], a demagogue named [demagogue.GetFirstName] has convinced people to set fire to one of the city districts."\n\nWhat is happening to my city?"

 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "Rouse the full garrison. Handle this."

 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "Prepare my horse!"
 gdp_republic_unrest.0201.b.success: "The rioters scatter"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "I have to flee back to the palace"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"

 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "I'll meet them in the square."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "The crowd turns on me"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"

 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "Pay them the whole treasury, if necessary."

 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "Capital Uprising: The Strike"
 gdp_republic_unrest.0211.desc: "As I pass through the markets, the strike is visible immediately. Nobody is out announcing their wares, the stalls are empty, and the workshops are quiet.\n\nIt is clear the guilds have made a decision among themselves, and all their workers are following in line."
 gdp_republic_unrest.0211.a: "Bring the guild masters in to talk."
 gdp_republic_unrest.0211.a.success: "An agreement is reached"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "They refuse to show"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "We'll pay them off, this time."
 gdp_republic_unrest.0211.b.success: "A price is agreed"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "They reject my compromise"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "Get them back to work. Now."
 gdp_republic_unrest.0211.d: "Meet their demands."

 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "Capital Uprising: The Manuscript"
 gdp_republic_unrest.0221.desc: ""My [ROOT.Char.GetLadyLord], they are... spreading these now," one of my guardsmen informs me, as he hands me a manuscript. "They are all over the city."\n\nIt goes into great detail, both insulting me personally and accusing me of all kinds of sin."
 gdp_republic_unrest.0221.a: "Find and deal with whoever wrote this."
 gdp_republic_unrest.0221.a.success: "The source is found and silenced"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "The author remains unknown"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "I will publicly reject this."
 gdp_republic_unrest.0221.b.success: "The accusations begin to fade"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "People jeer at me"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "Buy every copy."
 gdp_republic_unrest.0221.d: "This kind of thing fades on its own."

 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "Capital Uprising: At the Gates"
 gdp_republic_unrest.0301.desc: "I wake up to several guardsmen informing me that there is a mob coming our way. As I walk through my halls, I see how empty they are... most of my guards have deserted me.\n\nLooking out the window, I see them slowly approaching, shouting and cheering. The mob is coming for me."

 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "There is only one true [ROOT.Char.GetTitleAsNameNoTooltip]. Come and get [ROOT.Char.GetHerHim]."
 gdp_republic_unrest.0301.a.success: "I cut them down until all that remains is my trembling hands and the silent, bloodied palace"
 gdp_republic_unrest.0301.a.fail: "I fall to the mob"

 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "They will never take me alive!"
 gdp_republic_unrest.0301.b.success: "My men and I cut our way out"
 gdp_republic_unrest.0301.b.fail: "We are outnumbered"

 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "Leave through the servants' gate."
 gdp_republic_unrest.0301.c.success: "I manage to sneak away"
 gdp_republic_unrest.0301.c.fail: "I am caught"

 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "My reign is over."
 gdp_republic_unrest.0301.d.flavor: "Step to the window and announce my retirement. Then walk out unarmed and pray they let me live."

 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "Capital Uprising: The Great Silence"
 gdp_republic_unrest.0302.desc: "The palace is quiet now.\n\nThe bodies have not been moved, and the gates are still open where the last of the rebels fled. My hands have stopped shaking, mostly.\n\nI am still here."
 gdp_republic_unrest.0302.a: "I still... stand?"

 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "Capital Uprising: A New Name, A New Life"
 gdp_republic_unrest.0303.desc: "I am alive.\n\nThe city is behind me now, and no one on this street knows who I am. The title is gone, the palace is gone, and everything that defined me for years is gone.\n\nAnd yet I survived, and that has to count for something. Now where will I go?"
 gdp_republic_unrest.0303.a: "Head to [destination_a.GetNameNoTierNoTooltip]. A fresh start awaits."
 gdp_republic_unrest.0303.a.tt: "Travel to and move my domicile to [destination_a.GetNameNoTier]"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip] is far enough. I can rebuild there."
 gdp_republic_unrest.0303.b.tt: "Travel to and move my domicile to [destination_b.GetNameNoTier]"
 gdp_republic_unrest.0303.c: "Somewhere no one knows my name. [destination_c.GetNameNoTierNoTooltip] will do."
 gdp_republic_unrest.0303.c.tt: "Travel to and move my domicile to [destination_c.GetNameNoTier]"
 gdp_republic_unrest.0303.d: "I have nowhere else to go. I will stay and make myself useful."
 gdp_republic_unrest.0303.tt: "Refunded all [domicile_buildings|E]"

 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "The [old_doge.GetTitleAsNameNoTooltip] Has Fallen"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName] is dead. [old_doge.GetHeShe] fell during the uprising, and the palace has gone silent.\n\nWhat comes next is anyone's guess."
 gdp_republic_unrest.0304.a: "This changes everything."

 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "The [old_doge.GetTitleAsNameNoTooltip] Has Vanished"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName] is gone. No body, no farewell, [old_doge.GetHeShe] simply disappeared in the night while the mob was at the gates.\n\nWhat comes next is anyone's guess."
 gdp_republic_unrest.0305.a: "This changes everything."

 gdp_republic_unrest.0306.t: "Capital Uprising: A New City, A New Life"
 gdp_republic_unrest.0306.desc: "The road behind me is long and I try not to look back.\n\nThis place does not know my name yet. The markets are unfamiliar, the faces stranger still. But there is coin to be made here, alliances to be forged, and a life to be rebuilt from what little I have left."
 gdp_republic_unrest.0306.a: "Time to get to work."

 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "Capital Uprising: An Assassin in the Square"
 gdp_republic_unrest.0311.desc: "As I pass through the market, the crowd opens up in front of me. The loud chatter all goes silent. I see a figure suddenly rushing towards me, blade drawn.\n\nMy guards are too far back to help, and I have but a moment to respond."
 gdp_republic_unrest.0311.a: "Where's my blade?!"
 gdp_republic_unrest.0311.a.success: "I manage to defend myself in time"
 gdp_republic_unrest.0311.a.fail: "[assassin.GetSheHe|U] reaches me before my guards do"
 gdp_republic_unrest.0311.b: "I have to get out of here. Now."
 gdp_republic_unrest.0311.b.success: "I manage to evade the assassin"
 gdp_republic_unrest.0311.b.fail: "There is nowhere to run"

 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "Capital Uprising: Still Standing"
 gdp_republic_unrest.0312.desc: "The crowd has run away in the chaos, and I find myself somehow still alive.\n\nI look down at the dead body of the assassin, after the guards caught up and handled [assassin.GetHerHim]. [assassin.GetSheHe|U] looks just like any artisan in the city.\n\nWhere am I safe if even regular citizens are going to try to kill me?"
 gdp_republic_unrest.0312.a: "I... I need to go home."

 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "Capital Uprising: Blood for Blood"
 gdp_republic_unrest.0321.desc: "A messenger is shown into my study late at night, and hands over a letter.\n\nSome rioters in the city have taken my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))], [heir.GetFirstName], and if I am not gone by morning they will send [heir.GetHerHis] body back to my mansion."
 gdp_republic_unrest.0321.rival: "They can have [heir.GetHerHim]."
 gdp_republic_unrest.0321.a: "Mobilize the guard. Bring [heir.GetHerHim] back."
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U] survives"
 gdp_republic_unrest.0321.a.success: "My men rescue [heir.GetHerHim] in time"
 gdp_republic_unrest.0321.a.fail: "They are too late"
 gdp_republic_unrest.0321.b: "Find out where they are holding [heir.GetHerHim]."
 gdp_republic_unrest.0321.b.success: "They track [heir.GetHerHim] down"
 gdp_republic_unrest.0321.b.fail: "[heir.GetSheHe|U] cannot be found"
 gdp_republic_unrest.0321.c: "Every coin I have. Just give [heir.GetHerHim] back."
 gdp_republic_unrest.0321.d: "The title means nothing without [heir.GetFirstNameNoTooltip]."
 gdp_republic_unrest.0321.d.flavor: "If it saves [heir.GetHerHim], it's worth the price."

 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "Capital Uprising: Out Safe"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip] walks in through the door to my study, with a small shaken smile. [heir.GetSheHe|U] is fine, [heir.GetSheHe] survived. That is all that matters, for now.\n\nI must make sure this does not happen again."
 gdp_republic_unrest.0322.desc.rival: "A servant comes into my room, with the news. [heir.GetFirstNameNoTooltip] is back.\n\nGood, the succession remains intact, for now. I must make sure this does not happen again."
 gdp_republic_unrest.0322.a: "Oh, you are back!"
 gdp_republic_unrest.0322.a.rival: "Good. Now we can get back to business."

 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "Capital Uprising: Too Late"
 gdp_republic_unrest.0323.desc: "The knock at the gate comes after dark. I hear voices outside, then silence.\n\nBy the time I reach the courtyard, I already know. [heir.GetFirstNameNoTooltip] is there, laid out on the stones. The mob has sent what is left of [heir.GetHerHim] home."
 gdp_republic_unrest.0323.desc.rival: "The knock at the gate comes after dark. By the time I reach the courtyard, I already know.\n\n[heir.GetFirstNameNoTooltip] is there, laid out on the stones. The mob has sent what is left of [heir.GetHerHim] home. I stand there for a long time, looking at the remains of my heir."
 gdp_republic_unrest.0323.a.child: "Look how they massacred my [heir.Custom('GirlBoy')]..."
 gdp_republic_unrest.0323.a: "What did they do to you, [heir.GetFirstNameNoTooltip]?"
