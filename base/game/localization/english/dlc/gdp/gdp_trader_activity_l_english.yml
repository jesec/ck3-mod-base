 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "Negotiating Deals"
 gdp_trader_negotiate_deals_scheme_desc: "Your Trader will attempt to negotiate favorable terms with local merchants and officials to secure better buy and sell prices in this market.\n\n#weak On success:\n#!The visited [trade_market|E] gains a [competitiveness_i][trade_competitiveness|E] boost for #V 5 years#!$gdp_trader_scheme_shared_rules_tt$"
