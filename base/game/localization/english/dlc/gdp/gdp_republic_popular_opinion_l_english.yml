l_english:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "Low Popular Opinion: Restless People"

 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "Low Popular Opinion: City in Crisis"

 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "High Popular Opinion: Good Spirits"

 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "High Popular Opinion: City Flourishing"

 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "Economic Stagnation"
 gdp_popular_opinion_mild_neg_prosperity_desc: "Popular discontent has made citizens reluctant to invest in the city, slowing its long-term growth."

 gdp_popular_opinion_mild_neg_taxes: "Tax Avoidance"
 gdp_popular_opinion_mild_neg_taxes_desc: "Resentful citizens are finding ways to avoid paying their dues, reducing revenue from all city districts."

 gdp_popular_opinion_mild_neg_construction: "Construction Delays"
 gdp_popular_opinion_mild_neg_construction_desc: "Workers and craftsmen are less cooperative than usual, raising costs and slowing building progress."

 gdp_popular_opinion_mild_neg_defense: "Undermanned Walls"
 gdp_popular_opinion_mild_neg_defense_desc: "Citizens are unwilling to serve in the civic militia, leaving the city's defenses understaffed."

 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "Economic Collapse"
 gdp_popular_opinion_severe_neg_prosperity_desc: "Deep unrest has fractured the city's economy. Growth has stalled and existing prosperity is beginning to erode."

 gdp_popular_opinion_severe_neg_taxes: "Tax Revolt"
 gdp_popular_opinion_severe_neg_taxes_desc: "Open resistance to taxation has spread through all districts of the city, sharply cutting into public revenue."

 gdp_popular_opinion_severe_neg_construction: "Building Strikes"
 gdp_popular_opinion_severe_neg_construction_desc: "Guilds and laborers are refusing to work. Construction has become extremely slow and expensive."

 gdp_popular_opinion_severe_neg_defense: "Deserting Garrison"
 gdp_popular_opinion_severe_neg_defense_desc: "Soldiers have abandoned their posts or refused to serve. The city's walls stand nearly unmanned."

 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "Civic Investment"
 gdp_popular_opinion_mild_pos_prosperity_desc: "A confident citizenry is pouring its goodwill into the city's future, gently boosting long-term prosperity."

 gdp_popular_opinion_mild_pos_taxes: "Willing Taxpayers"
 gdp_popular_opinion_mild_pos_taxes_desc: "Citizens are paying their taxes without complaint, bringing in more revenue from each district of the city."

 gdp_popular_opinion_mild_pos_construction: "Civic Enthusiasm"
 gdp_popular_opinion_mild_pos_construction_desc: "Guilds and craftsmen are eager to contribute to the city's growth, reducing the cost and time of new works."

 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "Golden Age of Prosperity"
 gdp_popular_opinion_strong_pos_prosperity_desc: "The city is alive with optimism. Citizens and merchants alike are investing freely, driving strong and sustained growth."

 gdp_popular_opinion_strong_pos_taxes: "Overflowing Coffers"
 gdp_popular_opinion_strong_pos_taxes_desc: "The people's pride in their city translates directly into generous tax compliance across all districts."

 gdp_popular_opinion_strong_pos_construction: "Masterwork Construction"
 gdp_popular_opinion_strong_pos_construction_desc: "The finest artisans and craftsmen are competing for the honor of working in the city, driving down costs and accelerating every project."

 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "Cautious Sellers"
 gdp_popular_opinion_mild_neg_sell_price_desc: "Unease in the city has made traders wary, holding back goods and reducing prices across the market."

 gdp_popular_opinion_mild_neg_capacity: "Market Hesitancy"
 gdp_popular_opinion_mild_neg_capacity_desc: "Declining confidence has caused some merchants to reduce their presence, tightening the market's capacity."

 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "Market Panic"
 gdp_popular_opinion_severe_neg_sell_price_desc: "Crisis in the streets has driven prices down sharply as sellers scramble to offload goods in a collapsing market."

 gdp_popular_opinion_severe_neg_capacity: "Merchant Flight"
 gdp_popular_opinion_severe_neg_capacity_desc: "Prominent merchants are pulling out of the city altogether, leaving the trade market dramatically smaller."

 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "Confident Sellers"
 gdp_popular_opinion_mild_pos_sell_price_desc: "A positive mood in the city has boosted seller confidence, nudging prices upward across the market."

 gdp_popular_opinion_mild_pos_capacity: "Growing Market"
 gdp_popular_opinion_mild_pos_capacity_desc: "Optimism is drawing new traders and merchants to the city, gently expanding the market's capacity."

 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "Booming Trade"
 gdp_popular_opinion_strong_pos_sell_price_desc: "Exceptional civic pride has made the city's market a byword for quality, commanding premium prices for all goods."

 gdp_popular_opinion_strong_pos_capacity: "Thriving Market"
 gdp_popular_opinion_strong_pos_capacity_desc: "The city's reputation is drawing merchants from far and wide, significantly expanding its trade capacity."
