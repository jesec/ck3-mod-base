l_english:
 gdp_improve_trade_capacity: "Improve Trade Capacity"
 gdp_improve_trade_capacity_action: "Improve Trade Capacity"
 gdp_improve_trade_capacity_desc: "I have set my people to figure out ways to improve the capacity of my trade routes."
 gdp_improve_trade_capacity_desc_general: "$gdp_improve_trade_capacity$ is a [trade_scheme|E] in which a [merchant|E] or [patrician|E] puts their household to work increasing the [trade_route_capacity|E] of one of their own [trade_routes|E]."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "The chosen [trade_route|E] gains [capacity|E] for #V 15 years#!"
 gdp_improve_trade_capacity_invalidated_title: "@scheme_icon! $gdp_improve_trade_capacity$ Scheme Ends"

 gdp_improve_trade_competitiveness: "Improve Trade Competitiveness"
 gdp_improve_trade_competitiveness_action: "Improve Trade Competitiveness"
 gdp_improve_trade_competitiveness_desc: "I have set my people to figure out ways to ensure that my routes are prioritized ahead of the competition."
 gdp_improve_trade_competitiveness_desc_general: "$gdp_improve_trade_competitiveness$ is a [trade_scheme|E] in which a [merchant|E] or [patrician|E] puts their household to work increasing the [trade_competitiveness|E] of one of their own [trade_routes|E]."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "The chosen [trade_route|E] gains [competitiveness|E] for #V 15 years#!"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! $gdp_improve_trade_competitiveness$ Scheme Ends"

 gdp_improve_trade_expertise: "Improve Trade Expertise"
 gdp_improve_trade_expertise_action: "Improve Trade Expertise"
 gdp_improve_trade_expertise_desc: "I have set my people to figure out ways to improve our efficiency on our routes, ensuring that we all know the right people and learn from our mistakes."
 gdp_improve_trade_expertise_desc_general: "$gdp_improve_trade_expertise$ is a [trade_scheme|E] in which a [merchant|E] or [patrician|E] puts their household to work raising how quickly one of their own [trade_routes|E] gains [trade_expertise|E]."
 GDP_IMPROVE_TRADE_EXPERTISE_SUCCESS_DESC: "The chosen [trade_route|E] gains [expertise|E] more quickly for #V 15 years#!"
 gdp_improve_trade_expertise_invalidated_title: "@scheme_icon! $gdp_improve_trade_expertise$ Scheme Ends"

 GDP_IMPROVE_TRADE_ROUTES_STAFFED_ROUTES_DESC: "[trade_routes|E] with a [trader|E]: $VALUE|+=0$"
 GDP_IMPROVE_TRADE_ROUTES_ESTABLISHED_ROUTES_DESC: "Long-established [trade_routes|E]: $VALUE|+=0$"
 gdp_improve_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName] no longer runs [trade_routes|E] of [owner.GetHerHis] own"
 gdp_improve_trade_routes_owner_has_no_routes: "[owner.GetShortUIName] no longer has a single [trade_route|E] left to improve"
 gdp_improve_trade_routes_needs_route_tt: "You own at least one [trade_route|E]"
 gdp_improve_trade_routes_focused_route_gone: "The [trade_route|E] [owner.GetShortUIName] chose to work on no longer exists"
 gdp_improve_trade_capacity_decision_success_tt: "If the [scheme|E] succeeds, [selected_item.GetName|l] gains [GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip] for #V 15 years#!"
 gdp_improve_trade_competitiveness_decision_success_tt: "If the [scheme|E] succeeds, [selected_item.GetName|l] gains [GetModifier('gdp_improve_trade_routes_competitiveness_modifier').GetNameWithTooltip] for #V 15 years#!"
 gdp_improve_trade_expertise_decision_success_tt: "If the [scheme|E] succeeds, [selected_item.GetName|l] gains [GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip] for #V 15 years#!"

 gdp_improve_trade_routes_capacity_modifier: "Improved Logistics"
 gdp_improve_trade_routes_competitiveness_modifier: "Entrenched Interests"
 gdp_improve_trade_routes_expertise_modifier: "Seasoned Traders"

 gdp_improve_trade_capacity_decision: "Trade Scheme: Capacity"
 gdp_improve_trade_capacity_decision_desc: "I know there are goods we leave behind because our traders don't have enough room to carry them. With some investments and adjustments, it is only a matter of time before we can increase our presence at all the markets we visit."
 gdp_improve_trade_capacity_decision_tooltip: "Start a [GetScheme('gdp_improve_trade_capacity').GetTypeName] [scheme|E] on a [trade_route|E] of your choosing"
 gdp_improve_trade_capacity_decision_confirm: "Find the room and the hands."
 gdp_improve_trade_capacity_decision_effect_tt: "Start a [GetScheme('gdp_improve_trade_capacity').GetTypeName] [scheme|E], focused on [selected_item.GetName|l]"

 gdp_improve_trade_competitiveness_decision: "Trade Scheme: Competitiveness"
 gdp_improve_trade_competitiveness_decision_desc: "The competition is fierce at some of the markets my traders visit regularly. If I move some coins to the right hands, and make some small deals with the locals, my traders will be prioritized ahead of the competition."
 gdp_improve_trade_competitiveness_decision_tooltip: "Start a [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] [scheme|E] on a [trade_route|E] of your choosing"
 gdp_improve_trade_competitiveness_decision_confirm: "Win us a better welcome."
 gdp_improve_trade_competitiveness_decision_effect_tt: "Start a [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] [scheme|E], focused on [selected_item.GetName|l]"

 gdp_improve_trade_expertise_decision: "Trade Scheme: Expertise"
 gdp_improve_trade_expertise_decision_desc: "I am told by my traders that we are regularly making the same mistakes on some of our trade routes time and time again. It is time we take our experiences and ensure our routes will run as efficiently as possible."
 gdp_improve_trade_expertise_decision_tooltip: "Start a [GetScheme('gdp_improve_trade_expertise').GetTypeName] [scheme|E] on a [trade_route|E] of your choosing"
 gdp_improve_trade_expertise_decision_confirm: "Set them to one route."
 gdp_improve_trade_expertise_decision_effect_tt: "Start a [GetScheme('gdp_improve_trade_expertise').GetTypeName] [scheme|E], focused on [selected_item.GetName|l]"

 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$: Success"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U] is finally running the way it was always supposed to. I have been informed by my traders that we are finally bringing more goods, as I had hoped."
 gdp_trade_scheme.0002.a: "Worth every coin it cost me."

 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: Failure"
 gdp_trade_scheme.0003.desc: "Despite my best attempts, the trade route runs exactly like it used to. It is infuriating, but sometimes that's just how the market is."
 gdp_trade_scheme.0003.a: "Back to the ledgers."

 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: Success"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U] is finally making the money I had hoped it would. My traders are prioritized ahead of the competition, and we are making more money than we used to."
 gdp_trade_scheme.0004.a: "The favors were well spent."

 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$: Success"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U] is running more efficiently than it used to, and we are making fewer mistakes than we used to. These lessons will be the building blocks for the future fortunes of my house."
 gdp_trade_scheme.0005.a: "And I will keep building."

 gdp_disrupt_trade_routes: "Disrupt Trade Routes"
 gdp_disrupt_trade_routes_action: "Disrupt the Trade Routes of"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName] trades in my markets. A few bribed clerks and the right rumor would be enough to ruin one of [SCHEME.GetTargetCharacter.GetHerHis] [trade_routes|E]."
 gdp_disrupt_trade_routes_desc_general: "$gdp_disrupt_trade_routes$ is a [hostile_scheme|E] in which a [merchant|E] or [patrician|E] works to disrupt a rival's [trade_route|E] network. It is based on [intrigue|E], and can recruit [agents|E]."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "One of [TARGET_CHARACTER.GetShortUINamePossessive] [trade_routes|E] is impaired for #N 20 years#!"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "You are not exposed for disrupting a rival's [trade_routes|E]"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "You share a [trade_market|E] with [target.GetShortUIName]: $VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! $gdp_disrupt_trade_routes$ Scheme Ends"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName] no longer runs [trade_routes|E] of [owner.GetHerHis] own"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUIName] no longer runs [trade_routes|E] of [target.GetHerHis] own"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUIName] no longer has a single [trade_route|E] left to disrupt"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName] owns at least one [trade_route|E]"

 gdp_disrupt_trade_routes_capacity_modifier: "Disrupted Logistics"
 gdp_disrupt_trade_routes_competitiveness_modifier: "Poisoned Reputation"
 gdp_disrupt_trade_routes_discovered_opinion: "Disrupted My Trade Routes"

 gdp_disrupt_trade_routes_target_notification: "Trouble on [disrupted_trade_route.GetName|l]"
 gdp_disrupt_trade_routes_target_notification_tt: "Something has gone wrong on one of my [trade_routes|E]. My traders cannot tell me what."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "One of my [trade_routes|E] is running badly, and my traders have traced the cause back to [owner.GetShortUIName]."
 gdp_disrupt_trade_routes_target_caught_notification: "Sabotage Uncovered"
 gdp_disrupt_trade_routes_target_caught_tt: "One of [owner.GetShortUINamePossessive] men was caught on one of my [trade_routes|E], and he admitted what he had been sent to do."

 start_gdp_disrupt_trade_routes_interaction: "$gdp_disrupt_trade_routes$ #weak (Scheme)#!"
 start_gdp_disrupt_trade_routes_notification: "$gdp_disrupt_trade_routes$"
 scheme_interaction_tt_gdp_disrupt_trade_routes_approved: "Quietly disrupt one of [recipient.GetShortUINamePossessive] [trade_routes|E]"
 gdp_disrupt_trade_routes_effect_tt: "If successful, one of [recipient.GetShortUINamePossessive] [trade_routes|E] is impaired for #N 20 years#!"

 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_balance: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_overseer' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_success: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_speed: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_overseer' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_messenger' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_secrecy: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_alibi' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]"

 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$: Success"
 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U] will find itself short on the space needed to carry all the goods it once did. Let [target.GetShortUIName] wonder why [target.GetHerHis] ledgers aren't adding up anymore."
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U] no longer has the priorities and privileges it once had in the markets. Let [target.GetShortUIName] see how hard it is to make money now."
 gdp_trade_scheme.0012.desc_discovered: "\n\nThough one of my men was found, so it might lead back to me."
 gdp_trade_scheme.0012.a: "Best of luck to the fool."
 gdp_trade_scheme.0012.a_discovered: "It's worth it."

 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$: Failure"
 gdp_trade_scheme.0013.desc: "Despite our best attempts, [target.GetShortUIName] and [target.GetHerHis] trade routes are handling things just as well as they always have."
 gdp_trade_scheme.0013.desc_discovered: "\n\nAnd one of my traders was seen trying to handle things. An embarrassment to my house's name."
 gdp_trade_scheme.0013.a: "Infuriating."

 gdp_destroyed_republic_opinion: "Destroyed My Republic"
 gdp_smuggler_opinion: "Smuggler"
