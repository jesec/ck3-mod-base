l_english:

 gdp_visit_holding_decision_event.1200.t: "Visiting Patron"
 gdp_visit_holding_decision_event.1200.intro_desc: "As I enter [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l], I am awestruck by its opulence. There are priceless artifacts and ornaments everywhere I turn: [patron.Custom('RegionalFabric')] tapestries, statues, and expertly carved furniture. The rich smell of [patron.Custom('GetExpensiveMeal')] fills the air.\n\nLost between rushing servants, "
 gdp_visit_holding_decision_event.1200.all_available_desc: "I spot [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] announcing my arrival while [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] stands near. I need to straighten myself up and make my proposal."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "I spot [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] gesturing for me to come closer. I guess this means I'm [patron.GetHerHis] top priority. I need to straighten myself up and make my proposal."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "I spot [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] gesturing for me to come closer while [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] is nowhere to be seen. I guess [patron.GetSheHe] is too busy to meet me. I need to straighten myself up and make my proposal."
 gdp_visit_holding_decision_event.1200.representative_desc: "I spy [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] waiting to receive me on behalf of [patron.GetTitledFirstNameNoTooltip], who I've been told is indisposed. I need to straighten myself up and make my proposal."
 gdp_visit_holding_decision_event.1200.none_available_desc: "I keep trying to find [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] or anyone else to make my plea, to no avail. I guess I should have made an appointment."
 gdp_visit_holding_decision_event.1200.a: "I want increased control of [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] markets."
 gdp_visit_holding_decision_event.1200.a.tt: "Your proposal might offer the following opportunity:$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "I will seek investment opportunities."
 gdp_visit_holding_decision_event.1200.b.tt: "Seeking out financial ventures might offer the following opportunities:$gdp_visit_holding_decision_effect_prestige$ "
 gdp_visit_holding_decision_event.1200.c: "On second thought..."
 gdp_visit_holding_decision_event.1200.c.tt: "Go back to see what else [THIS.Char.GetCurrentLocation.GetName] has to offer"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "My list of associates impress [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "The names I mention are of insignificant"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "My words cause offense"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "My organizational skills convince [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "I fumble my argument"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "My ledger shows signs of embezzlement"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "I manage to convince [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip] is not swayed"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip] is offended by my lies"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.GetTitledFirstNameNoTooltip] is impressed by my knowledge"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "My deep dive into economic theory bores [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "I somehow manage to make [negotiator.GetTitledFirstNameNoTooltip] feel stupid"
 gdp_visit_holding_decision_event.1200.a_martial.success: "My knowledge on martial logistics impresses [negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "I end up sounding like a pretender"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "My examples sound like threats"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.GetTitledFirstNameNoTooltip] is deeply impressed by my might"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip] yawns"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip] misjudges my physical display as a threat"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "You recently sought trade privileges from [patron.GetShortUIName] — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "You recently traded gold for prestige with [patron.GetShortUIName] — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: A Competitive Market"
 gdp_visit_holding_decision_event.1201.all_available_desc: "With an inviting gesture, [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] beckons me to come closer. I hastily go over my proposal one last time before I approach. It is of utmost importance for the [ROOT.Char.GetHouse.GetName] merchant company that this deal goes through.\n\n As I move closer I sense an air of superiority from [patron.GetFirstName].\n\n "Make your offer clear and I might be so kind as to consider it...""
 gdp_visit_holding_decision_event.1201.patron_available_desc: "With an intimidating gesture, [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] beckons me to come closer. I hastily go over my proposal one last time before I approach. It is of utmost importance for the [ROOT.Char.GetHouse.GetName] merchant company that this deal goes through.\n\n As I move closer I sense an air of superiority from [patron.GetFirstName].\n\n "Make your offer clear and I might be so kind as to consider it..."""
 gdp_visit_holding_decision_event.1201.steward_available_desc: "With an inviting gesture, [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] beckons me to come closer. I hastily go over my proposal one last time before I approach. It is of utmost importance for the [ROOT.Char.GetHouse.GetName] merchant company that this deal goes through.\n\n"Make your offer clear and I'll evaluate if it's [patron.GetTitledFirstNamePossessive] best interest.""
 gdp_visit_holding_decision_event.1201.representative_desc: "With a measured gesture, [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] beckons me to come closer. I hastily go over my proposal one last time before I approach. It is of utmost importance for the [ROOT.Char.GetHouse.GetName] merchant company that this deal goes through.\n\n"Make your offer clear and I'll evaluate if it's [patron.GetTitledFirstNamePossessive] best interest.""
 gdp_visit_holding_decision_event.1201.a: ""Let me go over the contract proposal...""
 gdp_visit_holding_decision_event.1201.b: ""You are bound by your words, aren't you?""
 gdp_visit_holding_decision_event.1201.c: "Never mind."
 gdp_visit_holding_decision_event.1201.c.tt: "Return to your audience and see what else you might propose"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: An Investment Proposition"
 gdp_visit_holding_decision_event.1202.all_available_desc: "I stand idly by as [patron.GetFirstName] reads through my proposal. The hint of a frown has formed between his eyebrows as he looks back up from the papers.\n\n"Mmh.. I see... I guess I could consider vouching for you and the [ROOT.Char.GetHouse.GetName] company for this sum. That should be enough to earn you some respect right, [ROOT.Char.GetFirstNameNoTooltip]?""
 gdp_visit_holding_decision_event.1202.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)] seems quite interested in [patron.GetHerHis] [negotiator.Custom('ComplimentAdjective')] expression while I tell [negotiator.GetHerHim] about my proposal.\n\n"This is enough to earn you some respect, [ROOT.Char.GetFirstNameNoTooltip].""
 gdp_visit_holding_decision_event.1202.steward_available_desc: "I stand patiently by as [steward.GetFirstName] reads through my proposal. Visibly intrigued by the contents, [steward.GetSheHe] looks back up at me.\n\n"This proposal is well written, I will give you that... I guess I could consider vouching for you and the [ROOT.Char.GetHouse.GetName] company to [patron.GetTitledFirstName]""
 gdp_visit_holding_decision_event.1202.representative_desc: "I stand patiently by as [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] reads through my proposal on behalf of [patron.GetTitledFirstNameNoTooltip]. Visibly intrigued by the contents, [negotiator.GetSheHe] looks back up at me.\n\n"This proposal is well written. I shall ensure it reaches [patron.GetTitledFirstNameNoTooltip]'s attention.""
 gdp_visit_holding_decision_event.1202.a: ""Perhaps we could negotiate...""
 gdp_visit_holding_decision_event.1202.b: ""I accept your offer.""
 gdp_visit_holding_decision_event.1202.b.success: "Transaction Successful!"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName] does not want to see you again for a while — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]"
 gdp_caught_stealing.tt: "You were recently caught stealing from a holy place — you are banished until [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]"
 gdp_visit_holding_decision_event.1000.b.tt: "An appeal to your [merchant_patron|E] might offer the following opportunities: $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Your [merchant_patron|E] or [patron.GetHerHis] representative must be present"
 
 gdp_visit_holding_decision_event.1500.t: "Visiting [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "Back at the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] grounds, everything is the same. As the sun slowly moves across the sky, the square's adjacent buildings take turns providing shade for the open plaza"
 gdp_visit_holding_decision_event.1500.desc_returned_02: "An intense scent of incense relentlessly creeps into my nostrils as I stride through the muted sunshine back to the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] grounds."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "I squint as I climb back up from the duskiness of the healer's hut, finding my way back to the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] plaza."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "Walking back through the gates of the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], an arcadian tranquility lingers with me as I find myself back at the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] square."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "I return from the serene garden feeling lighter, as I look out over the bustling [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] square."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "I follow the dwindling alleyways back from [merchant_physician_recruit.GetFirstNamePossessiveNoTooltip] study, and find myself back at the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] grounds."
 gdp_visit_holding_decision_event.1500.desc: "There is a certain peace at the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] square, despite there being a lot of commerce, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural], and helpers around.\n\nA magnificent [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] poses in the middle, and off to the sides I spot signs with bold healing claims, as well as an annex garden for quiet contemplation of [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nAt the edge of the square, a devotee is preaching about better bodily health; and as agreed on beforehand, my ill [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName] has been escorted and is waiting for me at the healer's hut."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nAt the edge of the square, a devotee is preaching how better bodily health will increase our spiritual health. [merchant_physician_recruit.GetSheHe|U] stands firm despite the occasional heckle from the peasant crowd."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nAs agreed with one of the attendants at the camp, my ill [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName] has been escorted, and is waiting for me, at the healer's hut."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] nods appreciatively and looks around the busy square, already eyeballing curious stalls and points of interests."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nI find myself in a content state, looking out over the plaza, and I draw a couple of deep breaths as I reflect on my next destination."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName], who's starting to look a bit weary, says: "I am not one to complain, but... surely we are done here now, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?""
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nHaving spent a considerable amount of time here at the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] square, I am satisfied with this day's dealings, and I look around for the fastest way back to the main square."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\nThe devotee preacher keeps preaching [merchant_physician_recruit.GetHerHis] health-related teachings, but is seemingly nearing the end of the lecture."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nFor some reason, there now seems to be an abundance of children at the square. Were they here all along? They play and tussle, constantly finding new ways to do old things; not seldomly to their caretaker's surprise and chagrin.\n\nMy mind keeps dwelling on [1500_sickly_minor.GetFirstNamePossessive] state of health, as I look around the square for my next destination."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\nOn my left, [visiting_partner.GetFirstName] curiously inspects a stand covered in the tiniest bottles — allegedly filled with drops of venom from a [ROOT.Char.Custom('VenomousCreature')].\n\nThe mere thought makes my skin crawl, as I try to decide where to go next."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] nudges my shoulder, pointing to the guards escorting a ragged [ROOT.Char.GetWomanMan] from the premises, shouting about the end of the world.\n\nI instinctively raise my eyebrows, and observe the commotion as I consider what to do next."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] hands me a morsel on our walk across the square.\n\nI thoughtfully chew the dried rations as I ponder what my next move is."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nIn a shady corner of the plaza, a huckster is trying to convince a noble [ROOT.Char.GetWomanMan] of the healing properties of red sand.\n\nI casually observe their bickering as I ponder what my next move is."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nAt a nearby stand carrying obsidian mirrors, a [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] is trying to mask [ROOT.Char.GetHerHis] excitement as [ROOT.Char.GetSheHe] finally has the opportunity to inspect [ROOT.Char.GetHerselfHimself].\n\nSlightly amused, I try to decide where to go next."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nBy the small rotunda, a huckster carrying transcripts of [ROOT.Char.Custom('RandomReligiousTextName')] is reading aloud from the text for a humble audience.\n\nI absentmindedly listen as I observe the plaza, pondering what to do next."
 gdp_visit_holding_decision_event.1500.a: "I will seek the blessing of the healers."
 gdp_visit_holding_decision_event.1500.a_second: "I will return to the healers."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Maybe the healers can help [1500_sickly_minor.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip] is still waiting for me."
 gdp_visit_holding_decision_event.1500.a.tt: "A visit to the healers might offer the following opportunity:$gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "You have visited the healers recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]"
 gdp_visit_holding_decision_event.1500.b: "This [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] is intriguing."
 gdp_visit_holding_decision_event.1500.b_second: "The [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] is worth another visit."
 gdp_visit_holding_decision_event.1500.b.tt: "Entering the local place of worship might offer the following opportunities:$gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "You have visited the local house of worship recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]"
 gdp_visit_holding_decision_event.1500.c: "The gardens look interesting."
 gdp_visit_holding_decision_event.1500.c_second: "I will take another look at the gardens."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ Contemplate faith and reduce [stress|E]"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ Forage for provisions"
 gdp_visit_holding_decision_event.1500.c.tt: "A visit to the gardens might offer the following opportunities:$gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "You have visited the gardens recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]"
 gdp_visit_holding_decision_event.1500.d: "Is that a preacher over there?"
 gdp_visit_holding_decision_event.1500.d_second: "I have unfinished business with [merchant_physician_recruit.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1500.d.tt: "Speaking with the physician might offer the following opportunity:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "I will attend to other matters."

 gdp_visit_holding_decision_event.1501.intro: "The light is dimmer and there is a distinct #EMP smell#! in the healer's hut. Not #EMP unpleasant#!, but encroaching.\n\n[merchant_healer_character.GetFirstName] is standing at a tall table, busy preparing a concoction."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: The Healer"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ As we enter, a [merchant_healer_character.GetWomanMan] looks at us with a beaming smile.\n\n"Welcome to my humble abode! I am [merchant_healer_character.GetFirstNameNoTooltip]. How may I help?""
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName], who is ill, joins me at the healer's hut. [1500_sickly_minor.GetSheHe|U] coughs bleakly as I carry [1500_sickly_minor.GetHerHim] downstairs.\n\nThe healer, [merchant_healer_character.GetFirstName], gets up from [merchant_healer_character.GetHerHis] wooden stool and gives me a somber look: "Will you be requiring my services?""
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "As we enter the healer's hut, [merchant_healer_character.GetFirstName] is in the middle of performing a cleansing procedure on an elderly [ROOT.Char.GetWomanMan]. [visiting_partner.GetFirstName] eagerly observes [merchant_healer_character.GetFirstNameNoTooltip], a glint of excitement in [visiting_partner.GetHerHis] eye: "I wouldn't mind trying my hand at #EMP that#!..."\n\n[merchant_healer_character.GetFirstNameNoTooltip] looks up when [merchant_healer_character.GetSheHe] hears our voices: "I didn't see you there! Is something ailing you?""
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ [merchant_healer_character.GetSheHe|U] looks up, raising [merchant_healer_character.GetHerHis] eyebrows slightly: "I see you made it back in one piece! How can I help you this time?""
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName] is resting on some soft bedding by the corner stove in the healer's hut, awaiting my return. Instinctively, I lean in to check [1500_sickly_minor.GetHerHis] breathing, and I stroke [1500_sickly_minor.GetHerHis] hair.\n\n[merchant_healer_character.GetFirstName] puts down [merchant_healer_character.GetHerHis] [ROOT.Char.Custom('WritingInstrument')] and gives me a grim look: "What did we settle on?""
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "As we enter the healer's hut, [merchant_healer_character.GetFirstName] is mulling over some herbs, but [merchant_healer_character.GetSheHe] looks up at us as we descend the staircase: "Ah, changed your mind, then?"\n\nOn my left, [visiting_partner.GetFirstNameNoTooltip] is shifting [visiting_partner.GetHerHis] weight from foot to foot, still yearning to try [visiting_partner.GetHerHis] hand at the procedure we saw [merchant_healer_character.GetFirstNameNoTooltip] perform earlier."
 gdp_visit_holding_decision_event.1501.desc_returned_01: "[merchant_healer_character.GetFirstName] is tending to another patient as I step down the stairs and into the healer's hut. [merchant_healer_character.GetSheHe|U] glances at me, then motions to [merchant_healer_character.GetHerHis] patient to have a seat on some bedding further into the room.\n\n[merchant_healer_character.GetSheHe|U] proceeds to close a makeshift curtain made out of a worn sheet, awarding both the patient and us some privacy.\n\n"I see you have returned," [merchant_healer_character.GetSheHe] notes, diligently: "Did you need my help with anything?""
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Stepping back down into the dimly lit healer's hut, [merchant_healer_character.GetFirstName] is seated a bit further in, flipping through the pages of a worn journal of some kind. Difficult to distinguish from a distance, it looks to contain depictions of the human form.\n\n[merchant_healer_character.GetSheHe|U] carefully closes the journal, tucks it away, then looks at me and remarks in a calm voice: "Ah, so you're back. Found something that ails you, after all?""
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nOut of the corner of my eye, I spot some medicinal trinkets, of which a magnificent horn grabs my attention."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nA bit further into the room, the magnificent [1500_health_artifact.GetName] is still resting along with the other medicinal trinkets."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nA bit further into the room, on a shelf filled with medicinal trinkets, I spy a curious [1500_health_artifact.GetName], clamoring for my interest."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nA bit further into the room, the [1500_health_artifact.GetName] is still clamoring for my interest."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: ""I am interested in that [1500_health_artifact.GetNameNoTooltip].""
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: ""[1500_sickly_minor.GetFirstNameNoTooltip], my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))], needs treatment!""
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Treatment Failure"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "The treatment fails"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "Treatment Successful"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"

 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: The [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "A sermon has just concluded as we return to the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]. [merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] is walking around with a broom, gently tidying up and making the holy ground neat for any visitors who come here for prayer and reflection.\n\n[merchant_clergy_character.GetSheHe|U] looks up as I approach, a soft smile creasing [merchant_clergy_character.GetHerHis] lips: "Welcome back into [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U] warm embrace. Why don't you stay a while and take in the scenery?""
 gdp_visit_holding_decision_event.1503.desc_returned_02: "[merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] is seated on one of the benches facing the pulpit, seemingly engrossed in contemplation, when I re-enter the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship].\n\n[merchant_clergy_character.GetSheHe|U] turns [merchant_clergy_character.GetHerHis] head in my direction, looking over [merchant_clergy_character.GetHerHis] shoulder as I approach: "So busy. Let those weary feet rest for a moment, my child. How may I be of service?""
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "As I enter the remarkable gates of the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], the [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]s tending to this place have just finished dispersing their tasks for the day.\n\nI peer down the main aisle and unexpectedly recognize [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName], who in turn gives me an inscrutable look and walks over: "My wayward child. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] has delivered you safely back at our doorstep!""
 gdp_visit_holding_decision_event.1503.desc: "Passing through the gates of the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], I am struck by the work that must have gone into the exquisite structures and sacred decor.\n\nOne of the [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]s tending to this place notices me and collectedly walks over: "Greetings, my child. I am [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName]. How may I help you?""
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "I #EMP suppose#!..."
 gdp_visit_holding_decision_event.1503.b: ""Maybe [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] could bless our company?""
 gdp_visit_holding_decision_event.1503.c: "Clearly #EMP I#! am in need of these donations."
 gdp_visit_holding_decision_event.1503.c_guarded: "One more donation, into #EMP my#! pouch."
 gdp_visit_holding_decision_event.1503.c_master_thief: ""Psst, [visiting_partner.GetFirstNameNoTooltip], keep watch!""
 gdp_visit_holding_decision_event.1503.c.flavor: "Make a distraction, pilfer some coin. Easy."
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Hmm. The guards sure circulate a lot more frequently around these parts, for some reason..."
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Successful Thievery"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "You successfully steal the donations"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "Banished!"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "You are banished from the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Guards Summoned"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"

 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "As I hand over the donation, [merchant_clergy_character.GetFirstNamePossessive] eyes widen in shock: "You... you look just like [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]... [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]... I swear..." [merchant_clergy_character.GetSheHe] stares at me for a moment, mouthing words, like a fish out of water.\n\nThen, realizing what [merchant_clergy_character.GetSheHe] is doing, [merchant_clergy_character.GetFirstNameNoTooltip] pulls [merchant_clergy_character.GetHerselfHimself] together and clears [merchant_clergy_character.GetHerHis] throat: "I would be honored to donate #EMP my#! life to your cause.""
 gdp_visit_holding_decision_event.1504.desc: "[merchant_clergy_character.GetFirstNamePossessive] smile widens as [merchant_clergy_character.GetSheHe] leans over, placing a hand on my shoulder: "Most gracious of you, my child. I understand coin isn't always easy to part with for a merchant such as yourself."\n\n[merchant_clergy_character.GetSheHe|U] nods sententiously, [merchant_clergy_character.GetHerHis] hand falling back to [merchant_clergy_character.GetHerHis] side as [merchant_clergy_character.GetSheHe] rests [merchant_clergy_character.GetHerHis] eyes on me."
 gdp_visit_holding_decision_event.1504.a: ""Mayhaps [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] could bless our business?""
 gdp_visit_holding_decision_event.1504.a_epiphany: ""I am only interested in [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive] grace.""
 gdp_visit_holding_decision_event.1504.b: ""We #EMP could#! use another able body.""
 gdp_visit_holding_decision_event.1504.c: ""I don't care about anything if not my fellow man.""
 gdp_visit_holding_decision_event.1504.c_epiphany: "...we aren't hiring at this time."

 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: The Garden"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "The garden is still tranquil, and some visitors are carrying muted conversations in the seated areas whereas others are engrossed in silent contemplation, watching nature go by.\n\nI listen to the murmur and the breeze; the wind in the trees, suddenly feeling more at ease."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "This time, I spot a small bird in one the [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] trees, on the curb of trying its wings for the first time.\n\nIt smoothly slips over the edge of the nest, but the wings are somehow entangled and for a few moments the bird is free-falling through the air until... the wind gently catches the bird, carrying it to safety. A sense of relief spreads throughout my chest."
 gdp_visit_holding_decision_event.1505.desc: "The garden is framed by hedges, and trees are spread out across the gentle mounds where the odd bird and squirrel can be observed through the foliage.\n\nI can feel a presence quite strongly here, caught up in all this beauty. What if, through all my trials and tribulations, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] has been with me all along... ?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nA bit further up the road, [visiting_partner.GetFirstName] is having another look at the edible plants in the area."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nAnd further up the road, I spot even more wild morsels, stretching in the afternoon sun."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nFrom behind me, I can hear [visiting_partner.GetFirstName] muttering every time we encounter yet another obscurely edible plant on our stroll."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nOut of the corner of my eye, I notice delicious-looking wild fruits and herbs, contributing to the lusciousness of the garden."
 gdp_visit_holding_decision_event.1505.a: "I feel at peace."
 gdp_visit_holding_decision_event.1505.a_convert: "Maybe [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip] isn't such a bad thing, after all."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "You have contemplated this garden recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.b: "It would be a shame to waste those morsels."
 gdp_visit_holding_decision_event.1505.b_partner: ""[visiting_partner.GetFirstNameNoTooltip], how about we do some foraging?""
 gdp_visit_holding_decision_event.1505.b_flavor: "Time to harvest!"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "You have harvested this garden recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )]"
 gdp_visit_holding_decision_event.1505.c: ""...so many hidden nooks and crevices, #EMP [visiting_partner.GetFirstNameNoTooltip]#!...""
 gdp_visit_holding_decision_event.1505.c.flavor: "Truly divine."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "You have unwinded in this garden recently — try again after [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )]"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"

 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$: The Physician"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "The door to [merchant_physician_recruit.GetFirstNamePossessive] study is slightly ajar, and through the crevice I observe [merchant_physician_recruit.GetFirstNameNoTooltip] cutting the hair of a client, sitting very still, using some terrifyingly sharp and slender shears.\n\nI place a knock on the door and enter, turning the physician's attention to me: "Very sneaky. What did you want?""
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName] is standing outside [merchant_physician_recruit.GetHerHis] door, inspecting the shoulder of a [ROOT.Char.GetWomanMan], seemingly in pain.\n\n[merchant_physician_recruit.GetSheHe|U] wraps up the visit, supplying instructions on how to best heal the joint, then turns to me: "You're back. Did you want something this time?""
 gdp_visit_holding_decision_event.1507.desc_returned_03: "As I gingerly walk up the stairs to [merchant_physician_recruit.GetFirstNamePossessive] study, I peer through the open door.\n\n[merchant_physician_recruit.GetSheHe|U] appears to be caught up in some form of physical exercise and working up quite the sweat, repeatedly squatting, standing up and then starting over.\n\nAfter a certain amount of repetitions, [merchant_physician_recruit.GetSheHe] stops, wiping [merchant_physician_recruit.GetHerHis] forehead and having a swig from a nearby bottle. [merchant_physician_recruit.GetHerHis|U], now razor-sharp, eyes focus on me: "Quite incessant, aren't you?""
 gdp_visit_holding_decision_event.1507_desc_intro: "I follow [merchant_physician_recruit.GetFirstName] down a dwindling alley, up some stairs and into [merchant_physician_recruit.GetHerHis] study. The room is crammed, floor to ceiling, with shelves containing scriptures and prints relating to humors, health and spirituality.\n\n[merchant_physician_recruit.GetSheHe|U] sits down in the only chair, behind the desk, absentmindedly stroking a small talisman and then finally notices my presence: "
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$"Oh. Haven't I seen you somewhere before? What do you want?"\n\nI carefully weigh my words, before I retort:"
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$"Oh. You. Did you want something?"\n\n"I saw your lecture to those worse-off," I reply, and hesitate before continuing:"
 gdp_visit_holding_decision_event.1507.a: ""Want to come work for me?""
 gdp_visit_holding_decision_event.1507.b: ""Help me strengthen the spirit of my associates!""
 gdp_visit_holding_decision_event.1507.c: ""You need to #EMP use#! your skills to stay sharp. Join my company.""
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName] agrees with your assessment"
 gdp_visit_holding_decision_event.1507.c.failure: "You fail to entice [merchant_physician_recruit.GetShortUIName]"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUIName] starts ignoring you"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "Return to the [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] grounds and see what else they have to offer"
