l_english:
 # Scheme
 gdp_incite_unrest_scheme: "Incite Unrest"
 gdp_incite_unrest_scheme_desc: "Spread sedition and discontent among the common people of the capital, turning them against their ruler."
 gdp_incite_unrest_scheme_desc_general: "Spread sedition and discontent among the common people of the capital, turning them against their ruler."
 gdp_incite_unrest_scheme_action: "Inciting unrest against"
 GDP_INCITE_UNREST_SUCCESS_DESC: "Agitators have stirred the populace. Popular opinion in the liege's capital county will fall."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "The scheme to incite unrest in the capital has been uncovered."

 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "Scheme Abandoned"
 gdp_incite_unrest_scheme_owner_not_republic: "We no longer hold a republican government and cannot pursue this scheme."

 # Interaction
 gdp_incite_unrest_start_interaction: "Incite Unrest"
 gdp_incite_unrest_scheme_interaction_tt_approved: "Work in secret to spread dissent among the common people of [recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V], reducing [recipient.GetTitledFirstNamePossessiveNoTooltip|V] [popular_opinion|E]."
 gdp_incite_unrest_scheme_start_notification: "Scheme Launched"
 gdp_incite_unrest_scheme_target_tt: "Someone is scheming against you."

 # Success messages
 gdp_incite_unrest_scheme_success_t: "Unrest Spreads"
 gdp_incite_unrest_scheme_success_liege_t: "Unrest in the Capital"

 # Failure message
 gdp_incite_unrest_scheme_failure_t: "Scheme Fizzles"
 gdp_incite_unrest_scheme_failure_desc: "Our agitators failed to stir unrest against [scope:target.GetTitledFirstName] and the plot has come to nothing; the populace remains unmoved."

 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "Plot Exposed"

 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "The agitators have done their work. Discontent is spreading through the streets of [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], and [target.GetTitledFirstName] is losing the trust of the people."
 gdp_incite_unrest_scheme_event.0005.a: "The people are ready to be pushed further."

 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "Whispers of discontent have taken hold in [This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. Someone has been stirring up the common people against [This.GetHerHim], and their grievances are growing louder."
 gdp_incite_unrest_scheme_event.0006.a: "I must restore order."

 # County modifier
 gdp_incite_unrest_county_modifier: "Sown with Sedition"
 gdp_incite_unrest_county_modifier_desc: "Agitators have been at work here, spreading grievances and turning the populace against the ruler."

 # Character modifier
 gdp_caught_inciting_unrest_modifier: "Disgraced Schemer"
 gdp_caught_inciting_unrest_modifier_desc: "This patrician was caught fomenting unrest against the republic's head. Other houses and voters look upon them with suspicion."
