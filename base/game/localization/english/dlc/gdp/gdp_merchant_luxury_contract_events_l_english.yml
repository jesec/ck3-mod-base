l_english:

 ### MENAGERIE

 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "Crossing the [local_province.Custom('GetTerrainLandPlural')] of [local_county.GetNameNoTierNoTooltip], my party reaches the vicinity of the local settlement, setting our camp among the [local_province.Custom('GetProvinceFoliageDescAdjective')] outskirts,"
 gdp_merchant_luxury_contract.0001.desc.locals: "A group of passing villagers respond to our clumsy inquiries into the local wildlife with strange but unmistakable enactments of"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "A group of passing villagers respond to our inquiries with local stories of the"
 gdp_merchant_luxury_contract.0001.desc.jungle: "the air heavy with sweet nectar."
 gdp_merchant_luxury_contract.0001.desc.mountain: "the brisk air whistling among the branches."
 gdp_merchant_luxury_contract.0001.desc.desert: "the beating sun scorching the silent landscape."
 gdp_merchant_luxury_contract.0001.desc.plains: "heady with the scent of wild-flowers."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "fearsome cats."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "cunning cats"
 gdp_merchant_luxury_contract.0001.desc.bear: "ferocious bears."
 gdp_merchant_luxury_contract.0001.desc.monkey: "mischievous monkeys."
 gdp_merchant_luxury_contract.0001.desc.elephant: "majestic elephants."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "fearsome cats and ferocious bears."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "ferocious bears and majestic elephants."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "fearsome cats and majestic elephants."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "mischievous monkeys and fearsome cats."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "mischievous monkeys and majestic elephants."
 gdp_merchant_luxury_contract.0001.desc.bird: "beguiling birds."
 gdp_merchant_luxury_contract.0001.desc.close: "It seems we are on the right track, at least!"
 gdp_merchant_luxury_contract.0001.a: "The beasts of the wilds await!"
 gdp_merchant_luxury_contract.0001.a.flavor: "Favors displays of [martial_i|E][martial|E], [intrigue_i|E][intrigue|E], and [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "Attempt to procure a #V Creature#! [domicile_artifact|E] in the wilderness"
 gdp_merchant_luxury_contract.0001.b: "Let's see what we can find in the [local_barony.Custom('BaronyTownType')]."
 gdp_merchant_luxury_contract.0001.b.flavor: "Favors displays of [diplomacy_i|E][diplomacy|E], [stewardship_i|E][stewardship|E], and [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.0001.b.tt: "Attempt to procure a #V Creature#! [domicile_artifact|E] in the urban center"
 gdp_merchant_luxury_contract_back_to_town_tt: "You head back to the [local_barony.Custom('BaronyTownType')]"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "You head back to the wilds"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: Local Color"
 gdp_merchant_luxury_contract.0011.desc: "Wandering the unfamiliar lanes of [local_province.GetBaronyNameExplicitlyNoTooltip], I soon come across a [local_province.Custom('GetProvinceAdjective')] [local_province.Custom('GetRegionalMarketTermGloss')], where a well-dressed local [rich_local.GetWomanMan], impossible to miss, stands talking"
 gdp_merchant_luxury_contract.0011.cage: "by a caged [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0011.shoulder: "with [rich_local.Custom('GetAnimalArticle')] [rich_local.Custom('GetAnimalType')] on [rich_local.GetHerHis] shoulder!"
 gdp_merchant_luxury_contract.0011.leashed: "with a leashed [rich_local.Custom('GetAnimalType')] at [rich_local.GetHerHis] side!"
 gdp_merchant_luxury_contract.0011.close: "\n\nI glean from nearby peddlers that [rich_local.GetSheHe] is [rich_local.GetTitledFirstName], a [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)] local notable with an interest in wild and exotic animals.\n\nPerhaps [rich_local.GetSheHe] might be willing to make a deal?"
 gdp_merchant_luxury_contract.0011.a: ""My good [rich_local.GetWomanMan], might we discuss your splendid [rich_local.Custom('GetAnimalType')]?""
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.GetSheHe|U] sells you the [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetSheHe|U] refuses your offer"
 gdp_merchant_luxury_contract.0011.b: "I can find my own..."
 gdp_merchant_luxury_contract.some_other_way: "You must find some other way to acquire a Creature"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.GetTitledFirstName] eyes me up and down with curiosity as I make my introductions and pour effusive praise on [rich_local.GetHerHis] beast.\n\n"
 gdp_merchant_luxury_contract.0012.success: "[rich_local.GetHerHis|U] expression warms as I speak, eagerly imbibing my compliments and excitedly inquiring as to how I found myself so far from home.\n\nWe soon settle on a price, and I find suddenly find myself the proud owner of a magnificent [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0012.failure: "[rich_local.GetHerHis|U] expression soon sours however, spreading first to a frown, then a disdainful scoff, as [rich_local.GetSheHe] roundly dismisses me with a signal to [rich_local.GetHerHis] attendants to lead me away.\n\nThat pompous buffoon treats me as though #EMP I#! were the [rich_local.Custom('GetAnimalType')]..."
 gdp_merchant_luxury_contract.0012.a: "It shall be the talk of [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_luxury_contract.0012.b: "Wait, look I can offer more!"
 gdp_merchant_luxury_contract.0012.c: "Where does the fool live, that [rich_local.Custom('GetAnimalType')] #EMP will#! be mine!"
 gdp_merchant_luxury_contract.0012.c.success: "You heist the [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0012.c.failure: "You barely escape the guards"
 gdp_merchant_luxury_contract.0012.d: "#weak *shaking my head*#! "Forget it, I'll bag one myself.""
 gdp_merchant_luxury_contract.0012.e: "I am done with this..."
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "It wasn't hard to find [rich_local.GetTitledFirstNamePossessive] compound in [local_province.GetBaronyNameExplicitlyNoTooltip] and recruit some local knuckle-draggers at the tavern before stealing upon the place once darkness fell.\n\n"
 gdp_merchant_luxury_contract.0013.success: "It was almost too easy to breach the perimeter, and before we know it we are several streets away, straining our ears for any sounds of alarm.\n\nThe [rich_local.Custom('GetAnimalPossessive')] subdued [rich_local.Custom('GetAnimalSoundPresent')] are all that can be heard!"
 gdp_merchant_luxury_contract.0013.failure: "Unfortunately that's where my luck ran out! I scarcely escaped the guards, drawn by that treacherous [rich_local.Custom('GetAnimalPossessive')] [rich_local.Custom('GetAnimalSoundPresent')] as the plan fell to pieces...\n\n[rich_local.GetFirstNamePossessiveNoTooltip] people will surely be seeking me!"
 gdp_merchant_luxury_contract.0013.a: "Fool should have sold it to me!"
 gdp_merchant_luxury_contract.0013.b: "I must leave this place at once!"

 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]: The Bestiary"
 gdp_merchant_luxury_contract.0021.desc: "Deep in the warren-like [local_barony.Custom('BaronyTownType')] [local_province.Custom('GetRegionalMarketTermGloss')], a stench and beastly calls draw me to a [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)]-looking [dealer.GetWomanMan] behind a battered stall, the [local_province.Custom('GetProvinceAdjective')] clearing filled with all manner of [local_province.Custom('GetRandomRegionalWood')] cages.\n\nSpotting my interest, [dealer.GetSheHe] urgently waves me over. It is a feast for the eyes! A magnificent [ROOT.Char.Custom('GetAnimalType')] immediately draws my attention. As I admire its [ROOT.Char.Custom('GetAnimalFeature')], a rather miserable [dealer.Custom('GetAnimalType')] [dealer.Custom('GetAnimalSoundPresent')] in protest.\n\nThe peddler's eyes glow hungrily as I browse."
 gdp_merchant_luxury_contract.0021.a: ""Beautiful... I must have this [ROOT.Char.Custom('GetAnimalType')]!""
 gdp_merchant_luxury_contract.0021.b: "They surely bargain in [local_province.GetBaronyNameExplicitlyNoTooltip], too..."
 gdp_merchant_luxury_contract.0021.b.success_critical: "You make a masterful deal"
 gdp_merchant_luxury_contract.0021.b.success: "You save a few coins"
 gdp_merchant_luxury_contract.0021.b.failure: "You only make things worse"
 gdp_merchant_luxury_contract.0021.b.tt: "You will have the option to decline"
 gdp_merchant_luxury_contract.0021.c: "#weak *pointing*#! "I'll take the [dealer.Custom('GetAnimalType')]!""
 gdp_merchant_luxury_contract.0021.d: ""I am only browsing.""
 task_contract_success_pseudo: "#P Success:#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "The dealer winks, clearly a born hawker. We go back and forth for what seems an age, poring over every mark of the [ROOT.Char.Custom('GetAnimalPossessive')] [ROOT.Char.Custom('GetAnimalHide')] and debating the qualities of its [ROOT.Char.Custom('GetAnimalSoundPresent')].\n\n"
 gdp_merchant_luxury_contract.0022.success: "I make a strong case, and [dealer.GetSheHe] is somewhat flustered by my arguments. Soon enough [dealer.GetSheHe] gives in, dropping the price substantially, though there is always a limit..."
 gdp_merchant_luxury_contract.0022.neutral: "My arguments must have made some impact on [dealer.GetHerHim], for the [dealer.Custom('GetWomanManPossessive')] price drops somewhat, though [dealer.GetSheHe] budge no further..."
 gdp_merchant_luxury_contract.0022.failure: "I seem to rub [dealer.GetHerHim] the wrong way, for the [dealer.Custom('GetWomanManPossessive')] has only increased, and [dealer.GetSheHe] is now obstinate..."
 gdp_merchant_luxury_contract.0022.a: ""It's a deal.""
 gdp_merchant_luxury_contract.0022.b: ""Actually, I want the [dealer.Custom('GetAnimalType')]...""
 gdp_merchant_luxury_contract.0022.c: "#weak *shaking my head*#! "Forget it.""
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "At last I have achieved what I set out to do, and am the proud owner of [ROOT.Char.Custom('GetAnimalArticle')] [ROOT.Char.Custom('GetAnimalType')]! The proud creature has been properly secured, ready to join our caravan home.\n\nJust wait 'til they see this in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_luxury_contract.0023.a: "Let's go."

 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: On the Hunt"
 gdp_merchant_luxury_contract.0041.desc: "Leaving the trails, I head deeper into the [local_province.Custom('GetTerrainType')], pressing through [local_province.Custom('GetProvinceFoliageDesc')] in search of any sign of a beast. Only bird calls break the eerie silence. I pull my cloak tighter.\n\nJust as I turn to leave a thicket, I almost miss it! There amidst the [local_province.Custom('GetProvinceGroundDesc')], unmistakable [ROOT.Char.Custom('GetAnimalTrack')]-prints! A sudden [ROOT.Char.Custom('GetAnimalSound')] in the distance confirms it: a [ROOT.Char.Custom('GetAnimalType')] lurks nearby!"
 gdp_merchant_luxury_contract.0041.a: "Onward, before it flees!"
 gdp_merchant_luxury_contract.0041.a.tt: "You pursue the [THIS.Char.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0041.b: "F-forget it, let's go back!"

 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "As I break through the [local_province.Custom('GetProvinceFoliageDesc')], I spy a glimpse of [ROOT.Char.Custom('GetAnimalColor')] [ROOT.Char.Custom('GetAnimalHide')] from the corner of my eye. Fearing the worst, I spin back, my heart almost leaving my chest!\n\nBefore me sits a small bedraggled [ROOT.Char.Custom('GetAnimalType')], just a [ROOT.Char.Custom('GetAnimalChild')]. Its wide curious eyes gaze into mine without fear. I look about us, but it seems to be quite alone, no parent or [ROOT.Char.Custom('GetAnimalGroup')] in sight..."
 gdp_merchant_luxury_contract.0042.a: "I am here for a beast full-grown!"
 gdp_merchant_luxury_contract.0042.a.tt: "You continue in search of an adult [THIS.Char.Custom('GetAnimalType')] [artifact|E]"
 gdp_merchant_luxury_contract.0042.b: "Perhaps I could lay a trap..."
 gdp_merchant_luxury_contract.0042.b.success: "You use the [ROOT.Char.Custom('GetAnimalChild')] as bait"
 gdp_merchant_luxury_contract.0042.b.success.tt: "You also gain an adult [THIS.Char.Custom('GetAnimalType')] [artifact|E]"
 gdp_merchant_luxury_contract.0042.b.failure: "You fail and the [ROOT.Char.Custom('GetAnimalChild')] escapes"
 gdp_merchant_luxury_contract.0042.c: "Time to go. #EMP You're#! coming with me, little one!"
 baby_creature_artifact_name: "[baby_creature.GetNameNoTooltip] [ROOT.Char.Custom('GetAnimalChild')|U]"

 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "I am taken aback by a flash in the [local_province.Custom('GetProvinceFoliageDesc')], thinking some beast has stolen upon me and fearing the worst!\n\nI am half-relived to see it is only a local trapper, eyeing me suspiciously, arrow nocked.\n\n"Hah, are you come seeking [ROOT.Char.Custom('GetAnimalPlural')]? I have not seen your kind before."" 
 gdp_merchant_luxury_contract.0043.a: "Here, could you... help me?"
 gdp_merchant_luxury_contract.0043.b: "I would be honored to hunt by your side!"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip] assists you"
 gdp_merchant_luxury_contract.0043.b.success_tt: "You will have a higher chance to succeed"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip] dismisses you"
 gdp_merchant_luxury_contract.0043.c: "Stay out of my way."

 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "It's simple enough to shepherd the pliant [ROOT.Char.Custom('GetAnimalChild')] into a suitable clearing, and tether it the ground with some rope.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName] is a welcome help, with a deep knowledge of the local [local_province.Custom('GetTerrainType')] and its denizens. We are soon on the [ROOT.Char.Custom('GetAnimalPossessive')] trail!\n\n"
 gdp_merchant_luxury_contract.0044.desc: "It is slow going in such an unfamiliar landscape, with many missteps and redoubled paths, but we are soon on the [ROOT.Char.Custom('GetAnimalPossessive')] trail!\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "Sure enough, its soft [ROOT.Char.Custom('GetAnimalSoundParticiple')] soon attracts the attention of a grown [ROOT.Char.Custom('GetAnimaltype')]. We watch the beast scanning cautiously from the [local_province.Custom('GetProvinceFoliageDesc')]. At last it tentatively approaches the [ROOT.Char.Custom('GetAnimalChild')], and we spring our trap!"
 gdp_merchant_luxury_contract.0044.bait_failure: "Or it should have been... after some time sitting placidly and [ROOT.Char.Custom('GetAnimalSoundParticiple')] softly, the damned thing suddenly bolted with all its strength, pulling free and disappearing into the [local_province.Custom('GetProvinceFoliageDesc')]..."
 gdp_merchant_luxury_contract.0044.success: "We are lucky enough to come upon the [ROOT.Char.Custom('GetAnimalType')] almost unawares in the [local_province.Custom('GetProvinceFoliageDesc')], and in a great rush of [ROOT.Char.Custom('GetAnimalSoundParticiple')] [ROOT.Char.Custom('GetAnimalColor')] movement, the beast is secured in a net!"
 gdp_merchant_luxury_contract.0044.failure: "However, things quickly go awry. Just as quickly as we spot it, the beast is away into the [local_province.Custom('GetTerrainLand')] in a rush of [ROOT.Char.Custom('GetAnimalSoundParticiple')] [ROOT.Char.Custom('GetAnimalColor')] movement, too spooked to be captured."
 gdp_merchant_luxury_contract.0044.a: "What a fine pair you make!"
 gdp_merchant_luxury_contract.0044.b: "Blasted beasts!"
 gdp_merchant_luxury_contract.0044.c: "I have you now!"
 gdp_merchant_luxury_contract.0044.d: "Blasted beast!"
 gdp_merchant_luxury_contract.0044.e: "How would you like to see [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], [hunter.GetFirstNameNoTooltip]?"

 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: Poached"
 gdp_merchant_luxury_contract.0051.desc: "We come across a [local_province.Custom('GetProvinceGroundDescAdjective')] village and ask about the local wildlife. The headman gravely warns us to leave, explaining that a local bigwig, "[rich_local.GetName]", is hunting [rich_local.Custom('GetAnimalPlural')] in the area.\n\nBefore we move on, a [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)] villager appears, quietly arguing it would be easy to capture one of the [rich_local.GetTitleAsNamePossessiveNoTooltip] [rich_local.Custom('GetAnimalPlural')]!\n\nA brazen idea, but perhaps too good an opportunity to pass?"
 gdp_merchant_luxury_contract.0051.a: "A [rich_local.Custom('GetAnimalType')]? Let's go at once!"
 gdp_merchant_luxury_contract.0051.a.flavor: "The locals may be punished..."
 gdp_merchant_luxury_contract.0051.a.tt: "You will attempt to poach from [rich_local.GetShortUIName]"
 gdp_merchant_luxury_contract.0051.b: "I won't tangle with a [rich_local.GetTitleAsNameNoTooltip]..."

 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "My guide, [hunter.GetFirstName], leads us quickly through the [local_province.Custom('GetProvinceFoliageDesc')], crossing the [local_province.Custom('GetTerrainTypePlural')] with impressive speed. Coming upon a clearing [hunter.GetSheHe] suddenly halts, cocking an ear.\n\n"Quiet!", [hunter.GetSheHe] hisses, pulling me out of sight, "Close now."\n\nIn only an instant, the party is rumbling past us, churning the [local_province.Custom('GetProvinceGroundDesc')] as the hunters cry in the distance.\n\nThen, I hear it: the [rich_local.Custom('GetAnimalSound')] of a [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0052.a: "Here one comes! Net!"
 gdp_merchant_luxury_contract.0052.a.success: "You catch the [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.neutral: "You miss the [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.failure: "The [rich_local.Custom('GetAnimalType')] hurts you"
 gdp_merchant_luxury_contract.0052.b: "Hide! We're done for!"
 gdp_merchant_luxury_contract.0052.b.tt: "The [rich_local.Custom('GetAnimalType')] escapes"

 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "We arrive back at the village, where the headman comes storming out, screaming that [rich_local.GetTitledFirstNamePossessive] men have been here, searching for poachers!\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName] looks guilty at the shackled [rich_local.Custom('GetAnimalType')], though not guiltily enough to hide [hunter.GetHerHis] pride."
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName] looks dejectedly at the ground as the rest of village scowl.\n\nAs [hunter.GetSheHe] heads back to [hunter.GetHerHis] dwelling, a tethered [hunter.Custom('GetAnimalType')] appears, [hunter.Custom('GetAnimalWalkParticiple')] about the [local_province.Custom('GetProvinceGroundDesc')]."
 gdp_merchant_luxury_contract.0053.a: ""What a marvelous creature...""
 gdp_merchant_luxury_contract.0053.b: ""...I shall tell the [rich_local.GetTitleAsNameNoTooltip] who took it!""
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip] is impressed by your boldness"
 gdp_merchant_luxury_contract.0053.c: ""This was a terrible idea...""
 gdp_merchant_luxury_contract.0053.d: ""...still, I could use a [hunter.GetWomanMan] like you, [hunter.GetFirstNameNoTooltip].""
 gdp_merchant_luxury_contract.0053.e: ""You never said you had a [hunter.Custom('GetAnimalType')]!""
 
 ##### PROCURE CURIO

 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "This morning we spy the [local_barony.Custom('BaronyTownType')] of [local_province.GetBaronyNameExplicitlyNoTooltip], our long sought destination, emerging from [local_province.Custom('GetTerrainLandPlural')]"
 gdp_merchant_luxury_contract.1001.desc.locals: "At the gate, passing villagers respond to our clumsy [local_county.GetCountyData.GetCulture.GetLanguage.GetName] inquiries for directions with difficulty, but signal a"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "At the gate, a group of passing villagers respond to our [local_county.GetCountyData.GetCulture.GetLanguage.GetName] inquiries with directions to a"
 gdp_merchant_luxury_contract.1001.desc.religious: "grand and hallowed sepulcher in [religious_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "sage center of learning in [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.fallback: "local market."
 gdp_merchant_luxury_contract.1001.a: "The local [local_province.Custom('GetRegionalMarketTerm')] should have something."
 gdp_merchant_luxury_contract.1001.a.flavor: "Favors displays of [stewardship_i|E][stewardship|E] and [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1001.a.tt: "Attempt to procure a #V Curio#! [domicile_artifact|E] at the market"
 gdp_merchant_luxury_contract.1001.d: "The grand [local_province.Custom('GetRegionalMarketTerm')] calls us!"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "Let us seek out this holy place."
 gdp_merchant_luxury_contract.1001.e.flavor: "Favors displays of [piety_i|E][piety|E] and [learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "Attempt to procure a #V Curio#! [domicile_artifact|E] at the religious site"
 gdp_merchant_luxury_contract.1001.f: "There must be much we can learn here."
 gdp_merchant_luxury_contract.1001.f.flavor: "Favors displays of [learning_i|E][learning|E] and [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "Attempt to procure a #V Curio#! [domicile_artifact|E] at the center of learning"
 gdp_merchant_luxury_contract.1001.return.religious: "Let's go back to the holy place..."
 gdp_merchant_luxury_contract.1001.return.scholarly: "Let's find the center of learning..."
 gdp_merchant_luxury_contract.1001.return.urban: "I'll just go to the market..."
 gdp_merchant_luxury_contract.1001.give_up: "Oh, forget it!"
 gdp_merchant_luxury_contract.1001.fallback: "I'm not leaving [local_province.GetBaronyNameExplicitlyNoTooltip] empty-handed."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "You find some trinket in the [local_province.Custom('GetRegionalMarketTermGloss')]"

 ### MARKET SITE

 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: Center of Commerce"
 gdp_merchant_luxury_contract.1101.desc: "The [local_province.GetTitle.Custom('BaronyTownType')] of [local_province.GetBaronyNameExplicitlyNoTooltip] bustles with business, as locals and travelers seek goods of every sort amidst the sights, sounds, and smells of the [local_province.Custom('GetProvinceAdjective')] [local_province.Custom('GetRegionalMarketTermGloss')].\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "In a dark corner, I spot a surly street-urchin, [urchin.GetHerHis] beady eyes silently scanning the steady flow of passers-by."
 gdp_merchant_luxury_contract.1101.antiques: "A gnarled stand of antiquities peppered with [local_province.Custom('GetRandomRegionalWood')] knickknacks and tarnished metal invites my curiosity, much to its [dealer.Custom('GetYoungMiddleAgedOld')] steward's delight."
 gdp_merchant_luxury_contract.1101.bookseller: "The tattered [ROOT.Char.Custom('RegionalFabric')] awning of a dingy shop belies the multitudes of tattered scrolls and tomes piled against its walls, supervised by a [dealer.Custom('GetYoungMiddleAgedOld')] [dealer.GetWomanMan]."
 gdp_merchant_luxury_contract.1101.travelers: "A band of grizzled-looking [traveler.GetCulture.GetCollectiveNoun] have ensconced themselves in a nearby square, their garb and speech setting them apart from the [local_province.GetCulture.GetName] locals."
 gdp_merchant_luxury_contract.1101.tavern: "Across the way, the bawdy revelry of a tavern brings my attention to a rough-looking gambler, twirling the coin-purse [gambler.GetSheHe] has just liberated from a distraught challenger."
 gdp_merchant_luxury_contract.1101.merchant: "I notice a well-dressed [other_merchant.GetWomanMan] haranguing a caravan's slow progress through town. [other_merchant.GetSheHe|U] is clearly a local merchant after my own heart."
 gdp_merchant_luxury_contract.1101.a: "That child looks... #EMP wily#!."
 gdp_merchant_luxury_contract.1101.a.flavor: "Favors displays of [intrigue_i|E][intrigue|E] and [diplomacy|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "You see what the urchin says"
 gdp_merchant_luxury_contract.1101.b: "This dealer might have something interesting..."
 gdp_merchant_luxury_contract.1101.b.flavor: "Favors displays of [learning_i|E][learning|E] and [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1101.b.tt: "You try to buy an interesting antiquity"
 gdp_merchant_luxury_contract.1101.c: "There must be an interesting book or two here."
 gdp_merchant_luxury_contract.1101.c.flavor: "Favors displays of [learning_i|E][learning|E] and [gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1101.c.tt: "You try to buy an interesting book"
 gdp_merchant_luxury_contract.1101.d: "Those [traveler.GetCulture.GetCollectiveNounNoTooltip] must have seen a thing or two."
 gdp_merchant_luxury_contract.1101.d.lingua: "A chance to test my [traveler.GetCulture.GetLanguage.GetNameNoTooltip]."
 gdp_merchant_luxury_contract.1101.d.flavor: "Favors displays of [diplomacy_i|E][diplomacy|E] and [learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "You converse with the travelers"
 gdp_merchant_luxury_contract.1101.e: "I cannot resist a game of chance..."
 gdp_merchant_luxury_contract.1101.e.flavor: "Favors displays of [intrigue_i|E][intrigue|E] and chance"
 gdp_merchant_luxury_contract.1101.e.tt: "You see what can be won from the gambler"
 gdp_merchant_luxury_contract.1101.f: "Ah, a competitor might understand me."
 gdp_merchant_luxury_contract.1101.f.flavor: "Favors displays of [stewardship_i|E][stewardship|E] and [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1101.f.tt: "You see what the merchant has to say"

 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstNamePossessive|U] guard is hard to lower indeed. I try to win [urchin.GetHerHim] over with contempt for the passers-by and tales from the mean streets of [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "My stories of far-off places and the profits of the merchant life pique [urchin.GetHerHis] interest. As I am about to make an offer, [urchin.GetSheHe] offers me the jewelry outright if I will take [urchin.GetHerHim] with me!"
 gdp_merchant_luxury_contract.1102.urchin.success: "Eventually I feel I have made enough progress to be direct, and ask how much [urchin.GetSheHe] would take for the jewelry. With a sly grin, [urchin.GetSheHe] gives me [urchin.GetHerHis] price."
 gdp_merchant_luxury_contract.1102.urchin.failure: "Eventually I feel I have made enough progress to be direct, and ask how much [urchin.GetSheHe] would take for the jewelry. [urchin.GetSheHe|U] merely curls [urchin.GetHerHis] lip and tells me to get lost."

 gdp_merchant_luxury_contract.1102.antiques: "The shrewd dealer and I go back and forth for some time, arguing about the quality of the piece's construction, its age, and its condition.\n\nEventually the [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] bugger and I reach an impasse."
 gdp_merchant_luxury_contract.1102.antiques.success: "I have to say, the price is not bad, far better than I might have hoped for."
 gdp_merchant_luxury_contract.1102.antiques.failure: "I can't say I am happy with the result, and can only feel taken advantage of."

 gdp_merchant_luxury_contract.1102.bookseller: "The shrewd dealer and I go back and forth for some time, arguing about the book's providence, its age, and its condition.\n\nEventually the [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] bugger and I reach an impasse."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"

 gdp_merchant_luxury_contract.1102.travelers: "The group warms to me somewhat, evidently I am the most interesting thing they have seen all day, and we are soon swapping tales of our travels."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nIt is not long until we are breaking bread, laughing and joking at our common misfortunes and experiences of [local_province.GetBaronyNameExplicitly]. [traveler.GetFirstName] presses a parcel into my hand as we bid farewell, embracing me warmly."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nAfter sharing a few tidbits, I quickly run out of things to talk about, and the [traveler.GetCulture.GetCollectiveNoun] cannot hide that they wish for me to move on."

 gdp_merchant_luxury_contract.1102.tavern: "Things seem evenly matched as we warm up our dice, winning a round or two in turn as we swap coins and trade jibes, but [gambler.GetFirstName] is a tricky customer, no doubt about it.\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "[merchant.GetFaith.WealthGodName] smiles on me this day! With a blazing early lead, I leave [gambler.GetFirstNamePossessiveNoTooltip] dumbstruck and cursing, digging a deeper and deeper hole, until [gambler.GetSheHe] storms out, hurling [gambler.GetHerHis] dice into the street!"
 gdp_merchant_luxury_contract.1102.tavern.failure: "It takes a while, but eventually I manage to take a leading edge, testing [gambler.GetFirstNamePossessiveNoTooltip] patience enough for [gambler.GetHerHim] to call it a day as I gloat over my coins."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "It's not long before [gambler.GetSheHe] pulls out the stops, and I'm quickly down many rounds, out of patience with a wounded coin-purse. I make a sullen retreat from [gambler.GetFirstNamePossessiveNoTooltip] gloating."

 gdp_merchant_luxury_contract.1102.merchant: "In some quiet offices near the [local_province.Custom('GetRegionalMarketTermGloss')], [other_merchant.GetTitledFirstName] and I discuss our businesses at length, mulling mutual connections in far flung places, each playing up our successes.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "We hit it off well, sharing [other_merchant.Custom('RegionalDrink')] over bread as we pass tips and discuss future possibilities for mutual gain. Sad to say farewell, [other_merchant.GetFirstNameNoTooltip] presents me with some fine samples as a parting gift."
 gdp_merchant_luxury_contract.1102.merchant.failure: "We do not seem to find much common ground, each irritated by the other's bragging and unwillingness to share any useful information. I soon take me leave of the insipid [other_merchant.GetWomanMan]."

 gdp_merchant_luxury_contract.1102.a: "This will do nicely."
 gdp_merchant_luxury_contract.1102.b: "This will have to do..."

 gdp_merchant_luxury_contract.1111.desc: "I cross the [local_province.Custom('GetProvinceAdjective')] street toward the [urchin.Custom('GirlBoy')]. Spotting me, [urchin.GetHerHis] incisive eyes seek an explanation, but I make it clear I am no threat, sidling up to the wall [urchin.GetSheHe] leans against.\n\nThe suggestion of a shiny trinket sparkles enticingly in [urchin.GetHerHis] hand, but is speedily tucked away as [urchin.GetSheHe] follows my eyes. "What do you want?", [urchin.GetSheHe] spits. "I'm [urchin.GetFirstName]. These are #EMP my#! streets.""
 gdp_merchant_luxury_contract.1111.a: "You look like you know a thing or two."
 gdp_merchant_luxury_contract.1111.a.success_critical: "You win [urchin.GetHerHis] trust"
 gdp_merchant_luxury_contract.1111.a.success: "You buy [urchin.GetHerHis] spoils"
 gdp_merchant_luxury_contract.1111.a.failure: "You win [urchin.GetHerHis] contempt"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "It was purloined by [urchin.GetFirstName] on the streets of [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip] Ring"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "[local_county.GetAdjectiveNoTooltip] Brooch"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip] Necklace"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"

 gdp_merchant_luxury_contract.1121.desc: "I make a show of aloofness as I peruse the articles on offer, hiding the true extent of my interest, though it is hard to tell how convinced the shop-keep truly is.\n\nMy heart is soon set on a particular item which stands above the rest, time having made its style exotic even here in the place it was made."
 gdp_merchant_luxury_contract.1121.a: "Let's talk about the price..."
 gdp_merchant_luxury_contract.1121.a.success_critical: "You haggle a very good price"
 gdp_merchant_luxury_contract.1121.a.success: "You haggle a good price"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetSheHe|U] drives hard bargain"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "Antique [artifact.GetName]"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] It is beyond use in combat, worn by the passage of time."
 gdp_merchant_luxury_contract.1121.artifact.bowl: "Antique [local_province.GetCounty.GetCulture.GetNameNoTooltip] Bowl"
 gdp_merchant_luxury_contract.1121.artifact.plate: "Antique [local_province.GetCounty.GetCulture.GetNameNoTooltip] Plate"
 gdp_merchant_luxury_contract.1121.artifact.urn: "Antique [local_province.GetCounty.GetCulture.GetNameNoTooltip] Urn"

 gdp_merchant_luxury_contract.1131.desc: "I make a show of aloofness as I peruse the works on offer, hiding the true extent of my interest, though it is hard to tell how convinced the shop-keep truly is.\n\nMy heart is soon set on a particular binding which stands above the rest, from what I can tell a rare and overlooked work."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Acquired from a dealer in [local_province.GetBaronyNameExplicitly]."

 gdp_merchant_luxury_contract.1141.desc: "I approach the [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )] leader of the band with a warm smile, hoping our common foreignness will be a uniting factor in a strange place.\n\nThe [traveler.GetWomanMan] calls [traveler.GetHerselfHimself] [traveler.GetFirstName]. I introduce myself in turn as "[merchant.GetNameNoTooltip]. Surely you have heard of me?", I half-bluff, half-joke."
 gdp_merchant_luxury_contract.1141.a: "You must have some interesting stories!"
 gdp_merchant_luxury_contract.1141.a.flavor: "A test of your [diplomacy_i|E][diplomacy|E] and [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1141.a.success: "You get on with [traveler.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip] grows tired of you"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] Acquired from a dealer in [local_province.GetBaronyNameExplicitly], it is beyond use in combat, worn by the passage of time."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip] Brooch"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ Acquired from travelers in [local_province.GetBaronyNameExplicitly]."

 gdp_merchant_luxury_contract.1151.desc: "Pressing through the curtain into the dingy den, I take in the dissolutes and vagabonds. In the room's center, the gambler sits happily counting coins.\n\nI take a seat opposite as the [gambler.GetWomanMan] takes my measure, eyebrow raised. "You want to play, do you?", [gambler.GetSheHe] smiles. "I am [gambler.GetFirstName], and don't start crying when I take your coin.""
 gdp_merchant_luxury_contract.1151.a: "Let's play."
 gdp_merchant_luxury_contract.1151.a.flavor: "A test of your [intrigue_i|E][intrigue|E] and chance"
 gdp_merchant_luxury_contract.1151.a.success: "You clean [gambler.GetHerHim] out"
 gdp_merchant_luxury_contract.1151.a.failure: "You win some coin"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "You lose some coin"
 gdp_merchant_luxury_contract.1151.artifact.dice: "Gambler's Lucky Dice"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "The hard-won dice of [gambler.GetFirstName], a rogue and gambler of [local_province.GetBaronyNameExplicitly]."

 gdp_merchant_luxury_contract.1161.desc: "Interrupting the merchant's griping, I introduce myself as head of [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], based out of [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], noting that I am not here on business.\n\nIn turn, I learn [other_merchant.GetSheHe] is [other_merchant.GetName], hailing from [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly], here dealing in [merchant_good.GetName]. Our measures taken, [other_merchant.GetSheHe] offers to host me nearby."
 gdp_merchant_luxury_contract.1161.a: "There is much we could discuss."
 gdp_merchant_luxury_contract.1161.a.flavor: "A test of your [stewardship_i|E][stewardship|E] and [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip] warms to you"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip] is implacable"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Fabric Samples"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Samples of [other_merchant.Custom('RegionalFabric')] from [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], used by merchants in their dealings."
 gdp_merchant_luxury_contract.1161.artifact.gem: "Gem Samples"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Samples of precious stones from [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], used by merchants in their dealings."
 gdp_merchant_luxury_contract.1161.artifact.gold: "Metal Samples"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Samples of precious metal from [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], used by merchants in their dealings."

 ### RELIGIOUS SITE

 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: Religious Center"
 gdp_merchant_luxury_contract.1501.desc: "We follow the paths of countless pilgrims and worshipers, and soon come upon the magnificent [religious_building_district.GetType.GetPrimaryBuildingType.GetName] in [religious_building_province.GetName].\n\n"
 gdp_merchant_luxury_contract.1501.site: "The sepulcher is a grand monument to past [religious_building_faith.GetReligion.GetAdjective] rulers' zeal for [religious_building_faith.HighGodName]. From within, the melodic murmurings of an ongoing service can be heard."
 gdp_merchant_luxury_contract.1501.tombs: "A short way off is an outcropping of weathered stone tombs marked with the [religious_building_faith.ReligiousSymbol], overgrown and eroded by many seasons."
 gdp_merchant_luxury_contract.1501.pilgrim: "Steady lines of devotees, their attire marking them as pilgrims, wait to enter. One group stands out in particular, bearing some sort of reliquary between them."
 gdp_merchant_luxury_contract.1501.monks: "Nearby, a group of monks huddle quietly in the shade, contemplating and exchanging quiet words as the world languidly moves around them."
 gdp_merchant_luxury_contract.1501.keepsake: "Approaching the edifice, I notice a worn patch of masonry, where several stones have been loosened and cracked by the passage of time."
 gdp_merchant_luxury_contract.1501.apostate: "Off on [pilgrim.GetHerHis] own, a troubled-looking [pilgrim.GetWomanMan] sits in the building's shadow, elbows on [pilgrim.GetHerHis] knees, with face in one hand and a small book in the other."
 gdp_merchant_luxury_contract.1501.a: "I want to see inside."
 gdp_merchant_luxury_contract.1501.a.flavor: "Favors displays of [learning_i|E][learning|E] and [piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.a.tt: "You see what awaits within the [religious_building_faith.HouseOfWorship]"
 gdp_merchant_luxury_contract.1501.b: "There must be something in those tombs..."
 gdp_merchant_luxury_contract.1501.b.flavor: "Favors displays of [intrigue_i|E][intrigue|E] and [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "You return at night to loot a grave"
 gdp_merchant_luxury_contract.1501.c: "Those pilgrims look gullible..."
 gdp_merchant_luxury_contract.1501.c.flavor: "Favors displays of [intrigue_i|E][intrigue|E] and [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "You attempt to swindle a pilgrim"
 gdp_merchant_luxury_contract.1501.d: "I wish to talk to these monks."
 gdp_merchant_luxury_contract.1501.d.flavor: "Favors displays of [learning_i|E][learning|E] and [piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.d.tt: "You start a dialogue with the monks"
 gdp_merchant_luxury_contract.1501.e: "No one will notice a missing stone..."
 gdp_merchant_luxury_contract.1501.e.flavor: "Favors displays of [intrigue_i|E][intrigue|E] and [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "You attempt to pilfer a piece of the edifice"
 gdp_merchant_luxury_contract.1501.f: "That [pilgrim.GetWomanMan] looks like [pilgrim.GetSheHe] needs help."
 gdp_merchant_luxury_contract.1501.f.flavor: "Favors displays of [diplomacy_i|E][diplomacy|E] and [piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.f.tt: "You strike up a conversation with the pilgrim"

 gdp_merchant_luxury_contract.1502.site: "The [priest.Custom('PriestTitle')] looks me up and down carefully, weighing my words and countenance as worshipers file past us, mutterings prayers and wishes.\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "At last [priest.GetSheHe] sighs, "I cannot refuse your earnest request." [priest.GetSheHe|U] reaches for a nearby book, [priest.GetHerHis] fingers pondering its cover for a moment before presenting it to me.\n\n"Take this, my friend. May you find the word of [religious_building_faith.HighGodNameAlternate] within.""
 gdp_merchant_luxury_contract.1502.site.failure: "At last [priest.GetSheHe] frowns. "Out with you, you are in the wrong place. This is a [religious_building_faith.HouseOfWorship], a place of worship. I have no time for your foolishness today."\n\nSeveral worshipers turn, watching for me to leave."

 gdp_merchant_luxury_contract.1502.pilgrim: "By friendly inquiries, I eventually gather they brought the relic here to donate to the [pilgrim.GetFaith.HouseOfWorship], having acquired it near their hometown.\n\nI make a show of alarm, feigning concern on their behalf, to have been swindled so ungraciously!\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Upset, but not angry, I watch them wander off, tossing the small box into the waste-ground beyond the precinct."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Their reaction, however, takes me somewhat off-guard, as they throw the relic to the ground, smashing and kicking it to smithereens, much to the consternation of the crowd.\n\nI had best make me leave..."

 gdp_merchant_luxury_contract.1502.tomb: "These tombs are harder to break open than they look! We eventually prize apart one of the grander monuments with an almighty heave.\n\nWiping my sweat away to peer into its murky depths, I see something, and cautiously reach inside, lifting it out.\n\n"Bring the light!" I whisper impatiently.\n\nIn my hands I hold..."
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "a finely made and decorated urn!"
 gdp_merchant_luxury_contract.1502.tomb.success: "a worn and damaged urn?"
 gdp_merchant_luxury_contract.1502.tomb.failure: "a #EMP bone#!?"

 gdp_merchant_luxury_contract.1502.monks: "These monks are even more interesting than I thought! Many curious interpretations and insights arise from a life in the cloth, from the [monk.GetFaith.ReligiousText] to mysteries of [monk.GetFaith.TricksterGodName].\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "We strike up a great conversation, and the monks seem sad to have to bid me farewell. [monk.GetFirstName] presses something into my hand as we part, leaving with a warm smile."
 gdp_merchant_luxury_contract.1502.monks.failure: "However, [monk.GetFirstName] seems to lose interest each time I take a turn to speak, displeased or disinterested, and soon makes it clear I have overstayed my welcome."

 gdp_merchant_luxury_contract.1502.keepsake: "With a last glance behind me, I make my best attempt to knock, catch, and grab a piece in one smooth movement.\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "With grace and deftness, I displace a small chunk of the wall, secreting it under my cloak, as I stroll on nonchalantly. No one seems to have noticed!"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "My paltry movements only plant me on the ground with a thud, hissing in pain, as several curious pilgrims glance between me and the wall incredulously."

 gdp_merchant_luxury_contract.1502.apostate: "The [pilgrim.GetWomanMan] makes no protest as I sit beside [pilgrim.GetHerHim], softly recalling my favorite verses from the [merchant.GetFaith.ReligiousText], but [pilgrim.GetSheHe] soon stops crying, distracted by my words.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "I sense that [pilgrim.GetSheHe] is moved by my words, and indeed it is not long before [pilgrim.GetFirstName] makes it clear [pilgrim.GetSheHe] wishes to leave this place, and join me on the path of [merchant.GetFaith.HighGodNameAlternate]!"
 gdp_merchant_luxury_contract.1502.apostate.success: "As I read, I sense a shift in temperament from [pilgrim.GetHerHim], as though a heavy weight has been lifted from [pilgrim.GetHerHis] shoulders.\n\nWithout a word, [pilgrim.GetSheHe] stands, walking out of the precinct, [pilgrim.GetHerHis] tattered book abandoned at my side."
 gdp_merchant_luxury_contract.1502.apostate.failure: "It is not long however, before [pilgrim.GetHerHis] countenance hardens, and [pilgrim.GetSheHe] is animated by a new emotion: rage.\n\n[pilgrim.GetHerHis|U] cries that I am driving [pilgrim.GetHerHim] to apostasy — in the grounds of a [pilgrim.GetFaith.HouseOfWorship] no less! — soon draw irate onlookers..."

 gdp_merchant_luxury_contract.1502.a.critical: "This will do very nicely!"
 gdp_merchant_luxury_contract.1502.a: "This will do nicely."
 gdp_merchant_luxury_contract.1502.b: "This will have to do..."

 gdp_merchant_luxury_contract.1511.desc: "When the sun has set, we steal back into the proximity of the [religious_building_district.GetType.GetPrimaryBuildingType.GetName], seeking riches among the forgotten tombs of long dead locals.\n\nFearful of being witnessed, we are careful to avoid the normal routes, and eventually find ourselves in the cold and silent graveyard."
 gdp_merchant_luxury_contract.1511.a: "Let's open a tomb, and quick about it!"
 gdp_merchant_luxury_contract.1511.a.flavor: "A test of your [intrigue_i|E][intrigue|E] and [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1511.a.success_critical: "You find a rich artifact"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "You find a high quality #V Curio#! [domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.a.success: "You find a modest artifact"
 gdp_merchant_luxury_contract.1511.a.success.tt: "You find a low quality #V Curio#! [domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.a.failure: "You find nothing of note"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "You find a #V Curio#! [domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.artifact.urn: "[religious_building_faith.GetAdjectiveNoTooltip] Grave Goods"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "An urn from the tomb of a long-dead [religious_building_faith.GetAdherentName], looted from [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1511.artifact.skull: "Looted Skull"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "The skull of a long-dead [religious_building_faith.GetAdherentName], looted from a tomb at [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1511.artifact.bone: "Looted [priest.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "The bone of a long-dead [religious_building_faith.GetAdherentName], looted from a tomb at [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."

 gdp_merchant_luxury_contract.1521.desc: "Stepping through the great doors into the relative darkness, I find myself in a decorated entrance hall, heavy with the exotic odors of rites and offerings.\n\nThe worshipers center around a [priest.GetWomanMan], the [priest.Custom('PriestTitle')], talking with congregants, who immediately spots me — clearly I stand out here.\n\n[priest.GetSheHe|U] swoops to me [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )], "Well met, you stand in [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."\n\n"What do you seek here?", [priest.GetSheHe] asks, eyeing me curiously. "Do you follow the precepts of [religious_building_faith.GetNameNoTooltip]?""
 gdp_merchant_luxury_contract.1521.a: "I want to learn all I can of [religious_building_faith.GetNameNoTooltip]."
 gdp_merchant_luxury_contract.1521.a.flavor: "A test of your [learning_i|E][learning|E] and [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1521.a.success: "The [priest.Custom('PriestTitle')] offers me a text"
 gdp_merchant_luxury_contract.1521.a.failure: "The [priest.Custom('PriestTitle')] is suspicious"

 gdp_merchant_luxury_contract.1531.desc: "The [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )] pilgrims eye me with suspicion as I approach, clutching tightly to their humble relic as I try to get a better glimpse.\n\nIt is certainly an object of some significance to [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip], and would make a nice talking point back in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nI can surely convince these yokels that they have been had by some peddler or unscrupulous [pilgrim.GetFaith.PriestNeuter]..."
 gdp_merchant_luxury_contract.1531.a: "It's clearly a fake, there are hundreds in [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
 gdp_merchant_luxury_contract.1531.a.success: "The pilgrims discard the relic"
 gdp_merchant_luxury_contract.1531.a.failure: "The pilgrims are angry"

 gdp_merchant_luxury_contract.1541.desc: "The monks look at me askance at first, thrown by my foreign ways, but cannot hide their curiosity, especially when I make it clear I wish to discuss theology.\n\nThe younger among them are unsure, but their leader, the [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )] [monk.GetFirstName], welcomes me into their circle and peppers me with questions of my travels."
 gdp_merchant_luxury_contract.1541.a: "Yes, yes, but what are your thoughts on [monk.GetFaith.WealthGodName]?"
 gdp_merchant_luxury_contract.1541.a.flavor: "A test of your [learning_i|E][learning|E] and [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1541.a.success: "The monks enjoy the discussion"
 gdp_merchant_luxury_contract.1541.a.failure: "The monks are underwhelmed"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "[religious_building_faith.GetAdjectiveNoTooltip] Prayer Beads"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "A set of [religious_building_faith.GetAdjective] prayer beads, a gift from a monk at [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1541.artifact.icon: "[religious_building_faith.GetAdjectiveNoTooltip] Icon"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "[SCOPE.Custom('ArtifactArticleWealth')] icon of [SCOPE.Custom('ArtifactQuality')] craftsmanship depicting [newly_created_artifact.GetFeatureText('icon_decoration')], a gift from monk [monk.GetFirstName] at [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."

 gdp_merchant_luxury_contract.1551.desc: "Looking about me surreptitiously, I casually stroll around the [religious_building_district.GetType.GetPrimaryBuildingType.GetName], smiling politely at passers-by and making a show of admiring the architecture.\n\nGradually, I hone in on an area of choice stonework, seemingly already loose, in one the quietest parts of the complex's perimeter."
 gdp_merchant_luxury_contract.1551.a: "I just need to find the right moment..."
 gdp_merchant_luxury_contract.1551.a.success: "You take a piece of stonework"
 gdp_merchant_luxury_contract.1551.a.failure: "You are caught red-handed"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Holy Stonework"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "A small piece of stonework from the religious center of [religious_building_district.GetType.GetPrimaryBuildingType.GetName], pilfered as a keepsake."

 gdp_merchant_luxury_contract.1561.desc: "As I approach the [pilgrim.GetWomanMan] it becomes clear [pilgrim.GetSheHe] is a pilgrim, like so many here, laden with travel gear and scorched by the sun.\n\nI glean [pilgrim.GetHerHis] name is [pilgrim.GetFirstName], and after many misfortunes, [pilgrim.GetSheHe] has lost [pilgrim.GetHerHis] faith in the [pilgrim.GetFaith.GetAdjectiveNoTooltip] [pilgrim.GetFaith.HighGodName]. Even this pilgrimage has failed to restore it.\n\nI spot [pilgrim.GetHerHis] tear-stained and heavily worn [pilgrim.GetFaith.ReligiousText]. A testament to [pilgrim.GetHerHis] struggles."
 gdp_merchant_luxury_contract.1561.a: "The [merchant.GetFaith.ReligiousText] has the answers..."
 gdp_merchant_luxury_contract.1561.a.flavor: "A test of your [diplomacy_i|E][diplomacy|E] and [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip] is converted"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip] is heartened"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip] is enraged"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "Tear-Stained [religious_building_faith.ReligiousText|U]"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "The personal scriptures of a troubled [pilgrim.GetFaith.GetAdherentNameNoTooltip], [pilgrim.GetFirstName], who had lost [pilgrim.GetHerHis] faith."
 
 ### UNIVERSITY SITE

 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: Nexus of Knowledge"
 gdp_merchant_luxury_contract.1601.desc: "I am struck by the scale of the [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName], its grounds and halls clamoring with so many studious souls, debating and wondering.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "A [scholar.GetWomanMan], constantly [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )], hurries about flanked by attendants, haughtily dismissing [scholar.GetHerHis] colleagues. Evidently [scholar.GetSheHe] is in charge here."
 gdp_merchant_luxury_contract.1601.sages: "Beneath a tree in the grounds, a wizened old [sage.GetWomanMan] sits in silence, perhaps contemplating some deep question of the universe, perhaps simply cat-napping."
 gdp_merchant_luxury_contract.1601.library: "Passing a door, I spot a [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [scholar.GetWomanMan] alone in an impressive library, surrounded by reams of texts. [scholar.GetSheHe|U] is seemingly in a state of bliss, quietly reading."
 gdp_merchant_luxury_contract.1601.physician: "In another room, a [physician.GetWomanMan] presides over a ghoulish collection of specimens, animal and human alike, and various implements. One can only hope [physician.GetSheHe] is a physic..."
 gdp_merchant_luxury_contract.1601.student: "One particularly rowdy group of students is hard to miss, arguing good-naturedly, laughing at the top of their lungs as they rib one another in a shady spot of the central quad."
 gdp_merchant_luxury_contract.1601.botanist: "In a quiet corner of the complex, I come across a room containing a strange collection of plants and beasts, preserved and catalogued by a [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [botanist.GetWomanMan]."
 gdp_merchant_luxury_contract.1601.a: "That must be the dean."
 gdp_merchant_luxury_contract.1601.a.flavor: "Favors displays of [diplomacy_i|E][diplomacy|E] and [prestige_i|E][prestige_level|E]."
 gdp_merchant_luxury_contract.1601.a.tt: "You approach the dean"
 gdp_merchant_luxury_contract.1601.b: "I am drawn to that old [sage.GetWomanMan]..."
 gdp_merchant_luxury_contract.1601.b.flavor: "Favors displays of [learning_i|E][learning|E] and [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1601.b.tt: "You approach the sage"
 gdp_merchant_luxury_contract.1601.c: "Knowledge can always be found in a library."
 gdp_merchant_luxury_contract.1601.c.flavor: "Favors displays of [learning_i|E][learning|E] and [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "You enter the library"
 gdp_merchant_luxury_contract.1601.d: "The ways of the medicus are fascinating."
 gdp_merchant_luxury_contract.1601.d.flavor: "Favors displays of [learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "You approach the physician"
 gdp_merchant_luxury_contract.1601.e: "Those students look like fun."
 gdp_merchant_luxury_contract.1601.e.flavor: "Favors displays of [diplomacy_i|E][diplomacy|E] and [prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "You approach the students"
 gdp_merchant_luxury_contract.1601.f: "The collection of specimens is breathtaking."
 gdp_merchant_luxury_contract.1601.f.flavor: "Favors displays of [learning_i|E][learning|E] and [diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "You explore the collection"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "Originally part of the collection of [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]."
 
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName] follows my line of thinking until I have myself abundantly clear. I am from a distant land, where this piece of paper will holds no water, after all.\n\nHaving made the necessary arguments, I expectantly give [scholar.GetHerHim] space to speak."
 gdp_merchant_luxury_contract.1602.dean.success: "A broad grin crosses [scholar.GetHerHis] face, as [scholar.GetSheHe] fetches the official papers, certifying my... qualities."
 gdp_merchant_luxury_contract.1602.dean.failure: "[scholar.GetHerHis|U] impassive face hardens, and [scholar.GetSheHe] awkwardly asks me to leave."

 gdp_merchant_luxury_contract.1602.sages: "We talk of philosophy for what seems like an age, mulling questions I have seldom spoken of, oblivious to the skies slow darkening, the fading buzz of another days business.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "At last the [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan] stands, pulls something from [sage.GetHerHis] robe, passes it to me with a knowing and nod, and disappears unceremoniously."
 gdp_merchant_luxury_contract.1602.sages.failure: "At last [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan] stands, pulls [sage.GetHerHis] robe about [sage.GetHerHim], and disappears unceremoniously. I enjoyed our talk at least..."

 gdp_merchant_luxury_contract.1602.library: "I signal an interest in [scholar.GetHerHis] reading materials, and [scholar.GetSheHe] introduces [scholar.GetHerselfHimself] as [scholar.GetFirstName]. For some time, [scholar.GetSheHe] lists the many works [scholar.GetSheHe] has read, and is yet to read, as part of [scholar.GetHerHis] studies, asking for my opinions on each.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip] is soon grinning like a child, and when it eventually comes time to leave, [scholar.GetSheHe] passes me a small tome with a sly wink."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip] quickly loses all interest in me and my answers, rudely turning back to [scholar.GetHerHis] scribbles, and I take my leave."

 gdp_merchant_luxury_contract.1602.physician: "I express my interest in the subject of anatomy, contributing as much as I can. [physician.GetSheHe|U] talks at length of the workings of the body, grabbing osseous props to illustrate [physician.GetHerHis] points.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.GetSheHe|U] seems impressed by my knowledge, bemoaning the ignorance of [scholar.GetHerHis] students and colleagues, and presents me with an article."
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetSheHe|U] impatiently rolls [physician.GetHerHis] eyes at my questions and hesitant explanations, and soon finds some fusty excuse to eject me from the room."

 gdp_merchant_luxury_contract.1602.student: "We have a raucous time at the [student.Custom('GetPubName')], as I hold court amidst the fresh-faced dissolutes, trading stories of my travels and answering their many questions.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "We move from tavern to tavern and it is soon morning. We bid farewell after a last roadside rhapsody, and one of them presses something into my hand. What a night!"
 gdp_merchant_luxury_contract.1602.student.failure: "Things seem to go well at first, but they soon grow bored of my company and I find myself alone with my cup on the wrong side of town. What did I say?"

 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName] eagerly guides me around the collection, pointing out choice articles of curiosity and beauty.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.GetSheHe|U] is greatly animated by my interest, nodding enthusiastically as [botanist.GetSheHe] points out the rarity and providence of the items.\n\nWhen I at last must leave, [botanist.GetSheHe] presents a small offering [botanist.GetSheHe] saw I had a particular eye on."
 gdp_merchant_luxury_contract.1602.botanist.failure: "It seems I am unable to properly appreciate the collection or [botanist.GetHerHis] guidance, and [botanist.GetSheHe] soon makes it clear my presence is surplus to [botanist.GetHerHis] requirements..."

 gdp_merchant_luxury_contract.1602.a: "I will cherish it!"
 gdp_merchant_luxury_contract.1602.b: "It's something, I suppose."

 gdp_merchant_luxury_contract.1611.desc: "At first dismissive, the dean is clearly flattered when I make it clear I am a successful merchant from distant [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], theatrically introducing [scholar.GetHerselfHimself] as [scholar.Custom('MistressMaster')|U] [scholar.GetFirstName].\n\n[scholar.GetSheHe|U] beckons me to [scholar.GetHerHis] private offices, pointing out architectural quirks and curiosities along the way. "So, what can I do for you, good [merchant.GetTitledFirstNameNoTooltip]?", [scholar.GetSheHe] grins."
 gdp_merchant_luxury_contract.1611.a: "I wish I could have had the chance to study here..."
 gdp_merchant_luxury_contract.1611.a.flavor: "A test of your [diplomacy_i|E][diplomacy|E] and [prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "You are awarded an honorary diploma"
 gdp_merchant_luxury_contract.1611.a.success: "You are offered an honorary diploma for a price"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip] is offended"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Honorary Diploma"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "An honorary certificate of learning, presented by the dean of [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] in [local_province.GetBaronyNameExplicitly]."

 gdp_merchant_luxury_contract.1621.desc: "I approach the sage cautiously, careful not to unduly disturb [sage.GetHerHis] deep focus, however, [sage.GetSheHe] is one who startles me!\n\n"Would you like to join me?", [sage.GetSheHe] asks calmly, without turning or even opening or [sage.GetHerHis] eyes. "Come and sit."\n\nI humbly accept [sage.GetHerHis] offer. arranging myself beside [sage.GetHerHim] as graciously as possible.\n\n"I am [sage.GetFirstName]," [sage.GetSheHe] croaks, "What brings you to this place?""
 gdp_merchant_luxury_contract.1621.a: "I... don't know."
 gdp_merchant_luxury_contract.1621.a.flavor: "A test of your [learning_i|E][learning|E] and [piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetSheHe|U] is heartened"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetSheHe|U] is disappointed"

 gdp_merchant_luxury_contract.1631.desc: "I step into a room of seemingly endless arrays of shelves stuffed with scrolls, cloying with the musty tones of old ink and paper.\n\nSoftly approaching the silent scholar, I at last catch [scholar.GetHerHis] eye. At first busily dismissive, [scholar.GetHerHis] gaze softens as my foreignness seems to pique [scholar.GetHerHis] curiosity. "
 gdp_merchant_luxury_contract.1631.a: "What's that you are reading, friend?"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.GetSheHe|U] is impressed by your knowledge"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetSheHe|U] thinks you are a rube"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"

 gdp_merchant_luxury_contract.1641.desc: "A macabre scene awaits me. Countless bones, human and otherwise, are arrayed in neat rows, poked at and prodded by a [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)] [physician.GetWomanMan] for the benefit of a smattering of students.\n\n[physician.GetSheHe|U] at last notices me with a quizzical glance, beckoning me to join the group. I glean this is [physician.GetFirstName], and am relieved [physician.GetSheHe] is in fact a [physician.GetWomanMan] of medicine."
 gdp_merchant_luxury_contract.1641.a: "Ah, isn't that a [merchant.Custom('RandomSaintBone')|l] bone?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip] is impressed"
 gdp_merchant_luxury_contract.1641.a.failure: "You displease [physician.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "Human [physician.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "A bone used as a medical teaching aid. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "Human Skull"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "A skull used as a medical teaching aid. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"

 gdp_merchant_luxury_contract.1651.desc: "Approaching the group, I make my introduction. The students form a circle around me, laughing among themselves, but clearly intrigued at an outsider's approach.\n\nOnce they hear I am a well-traveled merchant from distant [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], their curiosity is piqued, and I am invited to an infamous nearby establishment for... refreshments."
 gdp_merchant_luxury_contract.1651.a: "To the tavern!"
 gdp_merchant_luxury_contract.1651.a.success: "You entertain the students"
 gdp_merchant_luxury_contract.1651.a.failure: "You bore the students"

 gdp_merchant_luxury_contract.1661.desc: "Entering the strange hall, I am dumbstruck. I have never seen such a collection, the untold array of colors, petals and leaves, furs and feathers, a feast for the senses and compendium of nature...\n\nI am snapped back to reality by the place's steward introducing [botanist.GetHerselfHimself] as [botanist.GetFirstName], and offering me a tour of the place."
 gdp_merchant_luxury_contract.1661.a: "Much obliged!"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip] appreciates your interest"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip] is underwhelmed"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "The [newly_created_artifact.Custom('ArtifactAnimalTrinketType')] of a [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "The feather of a [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
