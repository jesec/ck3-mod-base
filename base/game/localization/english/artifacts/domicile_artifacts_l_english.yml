 creature_type_lion_desc: "King of the beasts, the symbol of bravery, now chained into submission. It prowls back and forth in its pen as far as its bonds allow."
 creature_type_caracal_desc: "A large cat-like creature. It stalks around its pen, shredding anything placed inside to decorate the cage."
 creature_type_lynx_desc: "A timid and stocky cat. It keeps low to the ground, ears tucked back, eyes frantically taking in the surroundings around its perch."
 creature_type_tiger_desc: "A fearsome creature, king of the mountain animals. It is easy to rile its anger and make it show its fangs, frightening visitors."
 creature_type_leopard_desc: "A lithe, graceful and equally deadly animal. It is a patient and clever creature, with an impressive leap."
 creature_type_bear_desc: "A ferocious bear, lumbering around in constant search for food. Its massive paws could break bones as easily as twigs."
 creature_type_elephant_desc: "A deceptively gentle giant. Its trunk is highly dexterous, to the surprise and delight of every visitor."
 creature_type_peacock_desc: "A proud and dignified bird with a distinctive call. It is the crowning glory of any garden."
 creature_type_parrot_desc: "A lively specimen with the ability to mimic human sounds: A neat trick when entertaining guests."
 creature_type_crane_desc: "A light-winged and noble animal. It is the symbol of good luck and eternal youth."
 creature_type_cockatoo_desc: "A colorful bird with bright plumage and quick, perceptive eyes."
 creature_type_monkey_desc: "This sociable ape is an adorable companion with delightfully human behavior and expressions."

 creature_type_lion_reforged_desc: "King of the beasts, the symbol of bravery. $creature_history_entry$"
