l_english:
 bm_1178_merchants: "Guelphs & Ghibellines"
 bm_1178_merchants_desc: "The conflict between the Guelphs and the Ghibellines has been a long time coming. Starting with the investiture crisis at the end of the 11th century, the conflict has been simmering for a century.\n\nWith Frederick Barbarossa as the Kaiser, the conflict has escalated, and all of Italy is now choosing a side. The Ghibellines stand with the Kaiser, and the Guelphs stand with the Pope in Rome.\n\n#bold The conflict rages both within the republics of Italy and between them. Choose your side in the conflict, and bring it to victory.#!"

 bookmark_merchants_1178_marco_sanudo: "Marco Sanudo"
 bookmark_merchants_1178_marco_sanudo_subheading: "Patrician of Venice"
 bookmark_merchants_1178_enrico_dandolo: "Enrico Dandolo"
 bookmark_merchants_1178_marco_sanudo_desc: "The Sanudo family is one of the older noble families of Venice, supposedly related to the legendary Candiano family that held the office of Doge many times at the height of their power.\n\nMarco is the young scion at the head of the house after his father passed away, and he is close to his uncle Enrico Dandolo, the man who would go down in history as the orchestrator of the Fourth Crusade.\n\n#bold Can you fulfill your fate to become the Duke of the Archipelago?#!"

 bookmark_merchants_1178_humbert_savoy: "Humbert III of Savoy"
 bookmark_merchants_1178_humbert_savoy_subheading: "Duke of Savoy #b #bol (Guelph)#!#!"
 bookmark_merchants_1178_thomas_savoy: "Thomas"
 bookmark_merchants_1178_humbert_savoy_desc: "As the Duke of the Savoy, Humbert has proven himself a pious man by generously donating to the local monasteries, and withdrawing from secular life altogether for a while after his third wife passed away.\n\nAfter siding with the Guelphs, he has been at odds with Frederick Barbarossa, and has had his lands both taken and pillaged.\n\n#bold Can you protect the Savoyard lands from the Kaiser?#!"

 bookmark_merchants_1178_guido_guerra: "Guido Guerra III"
 bookmark_merchants_1178_guido_guerra_subheading: "Count of Casentino #color_yellow #bol (Ghibelline)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "Rinaldo"
 bookmark_merchants_1178_guido_guerra_desc: "The Guidi have been counts in the upper Arno for centuries, and few houses in Tuscany can claim a longer line.\n\nGuido Guerra has spent his life in imperial service: he stood at the siege of Milan and Barbarossa's privilege confirms his castles, rights, and mines on both slopes of the Apennines.\n\n#bold Can you make your county one that will go down in history?#!"

 bookmark_merchants_1178_speronella_dalesmanni: "Speronella Dalesmanni"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Patrician of Padua #b #bol (Guelph)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "Ezzelino da Romano"
 bookmark_merchants_1178_pietro_iii: "Pietro Traversari"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "As a teenager, Speronella was kidnapped by the Imperial Vicar of Padua, Pagano della Torre. When she was eventually freed by her brother, the vicar was overthrown, and with his fall the city of Padua became a free commune.\n\n#bold As a free woman, can you take your legendary status and turn it into political power or a fortune?#!"

 bookmark_merchants_1178_konrad_urslingen: "Konrad von Urslingen"
 bookmark_merchants_1178_konrad_urslingen_subheading: "Duke of Spoleto #color_yellow #bol (Ghibelline)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "Jutta"
 bookmark_merchants_1178_konrad_urslingen_desc: "A young German duke ruling an Italian duchy at the Emperor's pleasure, Konrad holds Spoleto at the heart of the peninsula, where the roads from north to south all cross. His authority rests on imperial favor, but the emperor is far away on the other side of the Alps.\n\n#bold Can you make the heartland of the Italian peninsula your own, or will the people reject your rule?#!"
