 bm_1066_merchants: "Channels of Commerce"
 bm_1066_merchants_desc: "For a realm to thrive, it not only needs to sustain itself, but keep the flow of goods moving. A ruler does not win grand campaigns based on birthright, after all — it is gold that procures the weapons, provisions, and foreign aid that bolsters their armies.\n\nMerchants are at play behind every trade, every deal struck, moving caravans and ships along legendary routes. And if they do not get the recognition they deserve, they will carve out a place for themselves and give rise to a new type of city, governed by its own citizens.\n\n#bold When wealth becomes the measure of power, will you lead your family to dominate the market and manage a lasting trade empire?"

 bookmark_merchants_domenico_contarini: "Domenico Contarini"
