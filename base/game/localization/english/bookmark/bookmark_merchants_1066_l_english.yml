 bookmark_merchants_ibn_jarada_desc: ""

 bookmark_merchants_sun_zhong: "Sūn Zhōng"
 bookmark_merchants_sun_zhong_subheading: "Merchant of Mingzhou"
 bookmark_merchants_sun_zhong_desc: "Mingzhou's harbor is where the Song meets the eastern sea, and Sūn Zhōng has made himself the man who keeps it busy. Silk and porcelain leave his warehouses for Japan and Goryeo; incense and silver come the other way. The officials who tax the traffic have learned that a well-timed gift is cheaper than a report.\n\n#bold The Silk Road's eastern shore is a port, not a caravan track. Can you make the Sūn name the current no court can divert?#!"

 bookmark_merchants_vitale_faliero: "Vitale Faliero"
 bookmark_merchants_vitale_faliero_subheading: "Patrician of Venice"
 bookmark_merchants_vitale_faliero_desc: "The Faliero are among Venice's most ambitious merchant houses, and Vitale has pushed his company further East than his rivals dare. Byzantine trade routes, Norman pressure in the Adriatic, and jealous rivals on the city's councils all press in from every side.\n\n#bold Venice sits at the crossroads of two worlds. Will you steer the Faliero name to mastery over both?#!"

 bookmark_merchants_wuhsha_al_dallala: "Wuhsha 'the Broker'"
 bookmark_merchants_wuhsha_al_dallala_subheading: "Cairene Broker"
 bookmark_merchants_wuhsha_al_dallala_desc: "As a woman of immense wealth, Wuhsha al-Dallala keeps close account of her fortunes as well as her enemies.\n\nHer independent nature has come at the cost of expulsion from the Synagogue. But Wuhsha knows patience, and bides her time to seek revenge on those who wronged her.\n\n#bold Do you have what it takes to leverage loans to humiliate your opponents?#!"
 bookmark_merchants_greek_salvidi_1: "Hillel Salvidi"

 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "Abu Sa'id"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "Son of Wuhsha"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""

 bookmark_merchants_nattal_sahu: "Nattal Sahu"
 bookmark_merchants_nattal_sahu_subheading: "Merchant-Prince of Delhi"
 bookmark_merchants_nattal_sahu_desc: "In the markets of Yoginipur, the name Sahu commands respect. Chief of Delhi's Jain merchant community and trusted counselor to the Tomara king Anangapal II, Nattal has woven a trade network stretching from the western ports to the markets of Bengal.\n\n#bold With a king's trust and a merchant's wit, can you build something that will outlast both?#!"

 bookmark_merchants_new_merchant_company: "Custom Character"
 bookmark_merchants_new_merchant_company_subheading: "Silk Road Merchant"
 bookmark_merchants_new_merchant_company_desc: "The Silk Road does not belong to emperors and kings. It belongs to those bold enough to walk it.\n\nFound your own merchant company at the crossroads of East and West. Build a trading empire one caravan at a time, forging connections from the bazaars of Samarkand to the ports of the Mediterranean.\n\n#bold Will your family name echo across a hundred cities?#!"
