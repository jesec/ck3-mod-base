l_english:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ Caught in a Heatwave"
 gdp_travel_events.1000.desc: "The dunes of [ROOT.Char.GetCurrentLocation.GetName] stretch beyond the horizon in an endless sea of sand. The heat of the sun paints an ever-changing, hypnotizing pattern on the surface. Drenched in sweat without a shadow in sight, we stop to rest. My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetFirstName] turns to me wide-eyed. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], fear not the heat, last night I received a blessing from [entourage_member_one.GetFaith.HighGodName]! A vision of an oasis not far from here.""
 gdp_travel_events.1000.a: "Actually it should be this way!"
 gdp_travel_events.1000.b: "We are out of options, let us try."
 gdp_travel_events.1000.b.success: "Praise [entourage_member_one.GetFaith.HighGodName], the oasis is real"
 gdp_travel_events.1000.b.failure: "It was nothing but a mirage"
 gdp_travel_events.1000.c: "I will not put my trust in visions."
 low_caravaneer_experience_reason_tooltip: "Requires #V 100#! [trait_level_track_xp|E] on the $trait_track_caravaneer$ track ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])"
 gdp_travel_events.1010.t: "Lost Travelers"
 gdp_travel_events.1010.desc: "Down the road from the [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')] of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], our caravan is getting ready to set up camp. Just as we are about to get comfortable for the evening, a faint voice calls out behind us.\n\n\"Excuse me, [ROOT.Char.Custom('FormOfAddressForLiege')]. My family and I are travelers separated from our caravan. We don't have much to offer, but I'd give up anything to keep my [traveler_child.Custom('GetDaughterSon')] safe tonight.""
 gdp_travel_events.1010.a: "Keep your coin. Come with us."
 gdp_travel_events.1010.b: "We can shelter you... for a small fee."
 gdp_travel_events.1010.c: "#EMP Anything#! you say..."
 gdp_travel_events.1010.d: "We have enough mouths to feed."
 gdp_travel_events.1020.t: "Tidbits on the Road"
 gdp_travel_events.1020.desc.intro: "The distance of the journey from [journey_start.GetName] is sorely felt in my behind as my [ROOT.Char.Custom('GetDonkeyDromedary')] trots on through the [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]. Seemingly unbothered by the excursion, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] rides up beside me, eager to tell me something.\n\n"
 gdp_travel_events.1020.desc.caravaneer: ""Small anecdote [ROOT.Char.Custom('FormOfAddressForLiege')], the other day I spoke to a caravan master from [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]. He told me of this magnificent navigational contraption...""
 gdp_travel_events.1020.desc.artisan: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], did you know that [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] makes for a terrific fabric dye? If you take the petals and grind them...""
 gdp_travel_events.1020.desc.creditor: ""Fun fact [ROOT.Char.Custom('FormOfAddressForLiege')], in some places, plunder #EMP might#! be legal if the victim is indebted to you. That reminds me of the time my cousins and I...""
 gdp_travel_events.1020.desc.war_profiteer: ""Interesting tidbit for you [ROOT.Char.Custom('FormOfAddressForLiege')], this [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] once was the site of great battle. Here fell a legendary swordsman, they say he tore through his enemies like a [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]...""
 gdp_travel_events.1020.a: "Fascinating, please tell me more."
 gdp_travel_events.1020.b: "Let us talk about [ROOT.Char.Custom('my_subject_of_interest')] instead."
 gdp_travel_events.1020.c: "I prefer to ride in silence."
 gdp_travel_events.1020.b.success: "You change the topic of discussion"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip] is not interested in hearing you out"
 gdp_travel_events.1030.t: "Vile Whispers"
 gdp_travel_events.1030.desc: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))] [ambitious_associate.GetFirstName] slides up to me, looking around to see if we have any spectators. [ambitious_associate.GetSheHe|U] hunches closer and whispers:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I have heard some concerning things about your partner [current_partner.GetFirstName]. Word around the company say [current_partner.GetSheHe] #EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!. If that is true, we must bring [current_partner.GetHerHim] to justice!\n\n...and, perhaps a reward is in store for the one who brought you these dire news?""
 gdp_travel_events.1030.a: "I must know the truth!"
 gdp_travel_events.1030.a.unity_loss.desc: "Found out the nature of your partner"
 gdp_travel_events.1030.b: "I do not wish to speculate."
 gdp_travel_events.1030.b.unity_gain.desc: "Refused to fall for speculative rumors about your partner"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ Unmaintained Well"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName] peers into an old well and wrinkles [thirsty_traveler.GetHerHis] nose.\n\nThe well has gone long without care. Its stones are overgrown, its bucket half-rotten, and its waters have taken on a foul stench that even a thirsty man would hesitate to swallow.\n\nUnfortunately, our water skins are already limp, nearly empty, and thirst is fast becoming unbearable."
 gdp_travel_events.1040.a: "A little filth won't hurt a [ROOT.Char.GetWomanMan] like me!"
 gdp_travel_events.1040.b: "I know a way to purify the water."
 gdp_travel_events.1040.c: "We must ration the water we have left."
 gdp_travel_events.1040.d: "It's going to be a long, thirsty road."
 gdp_travel_events.1040.e: "Perhaps just a sip..."
 gdp_travel_events.1040.e.critical_failure.tt: "Your illness worsens."
 gdp_travel_events.1040.e.success: "The water is safe to drink."
 gdp_travel_events.1040.e.success.desc: "You drink from the well and feel refreshed."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ Toppled Timber"
 gdp_travel_events.1050.desc: "A storm has swept through the [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] in [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], uprooting trees that now lay strewn across the road. Locals workers chop away at the debris, but it will be some time before we can pass.\n\nThe [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] around the blockage are traversable, but precarious leaning trees make this a dangerous detour."
 gdp_travel_events.1050.x: "My steed [ROOT.Char.Custom('WarhorseStoryName')] will haul this debris aside!"
 gdp_travel_events.1050.a: "Might as well put my hands to good use."
 gdp_travel_events.1050.b: "We could learn from their methods."
 gdp_travel_events.1050.c: "Let's find a way around this blockage."
 gdp_travel_events.1050.d: "We'll wait for the workers to finish."
 gdp_travel_events.1050.c.success: "You find a way around the fallen trees."
 gdp_travel_events.1050.c.failure: "You injure yourself in the wilds."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ Rats in the Hold"
 gdp_travel_events.1060.desc: "The hold of the ship is filled with rats, greedily feasting on our provisions. Some blame improper storage - loose lids and worn sacks. Others the sheer unbelievable size of the swarm.\n\nWhatever the reason, we are fast losing this battle and must act before the filthy rats gobble up everything we have and leave us bereft."
 gdp_travel_events.1060.x: "Let my cat [ROOT.Char.Custom('CatStoryName')] handle this."
 gdp_travel_events.1060.a: ""Bring me a harpoon and a good net!""
 gdp_travel_events.1060.b: "I'll fix the storage problem myself!"
 gdp_travel_events.1060.c: "Set course for port and restock supplies."
 gdp_travel_events.1060.d: "Everybody get to rat catching!"
 gdp_travel_events.1060.b.tt: "You must have at least #V 25#! [GetTradeGoodCategory('trade_category_cereals').GetName] [expertise|E]"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ Target on our Backs"
 gdp_travel_events.1070.desc: "One moment there is dust on the horizon, the next we spot a band of thugs rearing their horses over a rubble crest.\n\n"Halt!" their leader calls out to me. "Hand over your bartered gold peacefully, [ROOT.Char.GetTitleAsNameNoTooltip|l], and no one gets hurt.""
 gdp_travel_events.1070.a: ""I travel with [ROOT.Char.GetSuzerain.GetShortUINamePossessive] protection, you curs!""
 gdp_travel_events.1070.a.success: "Your patron's name gives you safe passage"
 gdp_travel_events.1070.b: ""You will have to take it from us!""
 gdp_travel_events.1070.b.success: "You drive the bandits off"
 gdp_travel_events.1070.b.failure: "The bandits take your gold"
 gdp_travel_events.1070.c: ""Anything to let us pass.""
 
 gdp_travel_events.2000.t: "The Tilted Tower"
 gdp_travel_events.2000.desc: "Is it...my eyes? Do my feet not stand as soundly as they feel? No, my senses have not deserted me, despite the unreality of the vision before me. #EMP The great [GetBuildingType('tower_of_pisa').GetNameNoTooltip] is leaning#!!\n\n"The ground here is about as firm as curdled milk, [ROOT.Char.Custom('FormOfAddressForLiege')]," says [mason.GetFirstName], the master mason standing beside me. "[ROOT.Char.GetSheHe|U] started slipping when we were scarcely a quarter of the way up, but we got [ROOT.Char.GetHerHim] there in the end."\n\n\"Magnificent, isn't [ROOT.Char.GetSheHe]?""
 gdp_travel_events.2000.a: "Perhaps its #EMP peculiarity#! will attract travelers, at least...?"
 gdp_travel_events.2000.b: "You're either a genius or a mad[mason.GetWomanMan]. You're hired!"
 
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip],"
 gdp_travel_events.2002.desc: "Our masons are pleased to report that the stately [GetBuildingType('tower_of_pisa').GetNameNoTooltip] is finally complete.\n\nYet I must relate that I have also heard peculiar word from Pisa, of travelers speaking of an edifice #EMP quite#! unlike anything they have seen before. I fear something may be amiss with its construction."
 gdp_travel_events.2002.a: "Let me judge their work with my own eyes."
 gdp_travel_events.2002.b: "As long as it remains upright, I care not at all."