l_english:
 influence_house_ambition_ongoing.1001.tt: "A Sympathetic Ear"
 influence_house_ambition_ongoing.1001.desc: "If I could find a sympathetic ear in [target.GetFirstNamePossessive] company it might help sway [target.GetHerHis] opinion and make [target.GetHerHim] see things my way.\n\nI better pick someone pleasing to talk to and has a way with words. Would not hurt if they are fair to behold either.\n\nAfter discreetly inquiring about [target.GetFirstNamePossessive] courtiers, I have found two candidates: [target_associate_01.GetFirstName] and [target_associate_02.GetFirstName]."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip] is a good choice."
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip] might get through to [target_associate_02.GetHerHis] master." 
 influence_house_ambition_ongoing.1001.c: "No. My words alone are enough."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip] makes a convincing argument on your behalf"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip] fails to formulate a good argument"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip] makes a convincing argument on your behalf"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip] fails to formulate a good argument"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "Wants coin for helping you."
 influence_house_ambition_ongoing.1001.cooltip.relation: "Demands nothing in return."
 influence_house_ambition_ongoing.1001.cooltip.lewd: "Suggest an "alternative" reward"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "Wants a favor in return."


 influence_house_ambition_ongoing.1002.tt: "Harsh Negotiations"
 influence_house_ambition_ongoing.1002.desc: "I start to wonder if the [target.GetFirstName] is even taking me seriously. All I hear are vague promises, delays and endless bloviating debates.\n\nThe time has come to make my displeasure known. Not directly, perhaps, but in a way that makes [target.GetFirstName] understand that there are ramifications to displeasing a [ROOT.Char.GetTitleAsNameNoTooltip] of my caliber!"
 influence_house_ambition_ongoing.1002.a: "Sabotage [target.GetHerHis] business interests."
 influence_house_ambition_ongoing.1002.b: "Have thugs ambush and beat [target.GetHerHis] courtier."
 influence_house_ambition_ongoing.1002.c: "Set fire to [target.GetHerHis] home."
 influence_house_ambition_ongoing.1002.d: "I will teach [target.GetHerHim] terror!"
 influence_house_ambition_ongoing.1002.e: "I will be patient a while longer."



