l_english:
 yearly_republic.1001.t: "Come to Bed, Dear"
 yearly_republic.1001.desc: "Even as midnight draws near, my [spouse_target.GetWifeHusband] [spouse_target.GetTitledFirstName] finds me deep in documents, reviewing the ledgers once again.\n\n"Come to bed, my [ROOT.Char.GetWifeHusband]," [spouse_target.GetSheHe] pleads. "Surely, work can wait until tomorrow?"\n\n"Or," [spouse_target.GetFirstNameNoTooltip] says and looks thoughtful, "perhaps I could share your labors?""
 yearly_republic.1001.a: "Better get us more candles, my love."
 yearly_republic.1001.b: "I'm too behind on my duties. Leave me be!"
 yearly_republic.1001.c: "The world can wait as long as I have you."
 yearly_republic.1001.communal: "All [vassals|E] gain #P 10#! opinion of #value you#!"

 yearly_republic.1002.t: "Thorny Marriage"
 yearly_republic.1002.desc: "My marriage to [spouse_target.GetTitledFirstName] has seen plenty of strife. We seemingly agree on nothing. No doubt, [spouse_target.GetSheHe] is keeping [spouse_target.GetHerHis] kin abreast of my 'shortcomings' through frequent letters.\n\nI had hoped my marriage would tie my business interests closer to house [spouse_target.GetDynastyHouseName], but every time I meet their agents or clients in the city I see the distrust in their eyes.\n\nUnless something is done, this venomous sentiment will keep spreading through the ranks of both of our families, like bad blood from an infected wound."
 yearly_republic.1002.a: "I will buy the gratitude of [spouse_target.GetFirstNameNoTooltip] and [spouse_target.GetHerHis] house."
 yearly_republic.1002.b: "I will forge [spouse_target.GetHerHis] letters to sing my praises."
 yearly_republic.1002.c: "I swear to [ROOT.Char.GetFaith.random_GoodGodNames] to better myself in your eyes."
 yearly_republic.1002.d: "They can think what they will."
 yearly_republic.1002.tt.falsifying_success.desc: "Edit your spouse's letters to make yourself look better"
 yearly_republic.1002.falsifying_success.toast: "[spouse_target.GetDynastyHouseName] is convinced that you have improved"
 yearly_republic.1002.tt.falsifying_failure.desc: "Fail in your attempt to falsify your spouse's letters"
 yearly_republic.1002.falsifying_failure.toast: "[spouse_target.GetDynastyHouseName]'s opinion of you worsens even more"
 yearly_republic.1002.tt.impress_spouse_success.desc: "Your spouse is impressed by your efforts"
 yearly_republic.1002.impress_spouse_success.toast: "[spouse_target.GetDynastyHouseName] approves of your efforts"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "Your spouse is not impressed by your efforts"
 yearly_republic.1002.impress_spouse_failure.toast: "[spouse_target.GetDynastyHouseName] sees you as a lost cause"

 yearly_republic.1003.t: "Back Alley Honor"
 yearly_republic.1003.desc: ""You fool! Brawling in the streets can lead to a feud between the houses! Look at yourself: you're bleeding!" My [spouse_target.GetWifeHusband] [spouse_target.GetTitledFirstName] cries at the sight of my [ROOT.Char.Custom2('RelationToMeShort', rook_01)] [rook_01.GetTitledFirstName] — but the young rake just laughs, as [rook_01.GetHerHis] blood drips on my floor.\n\n"My opponent fared far worse than me! That [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))] [rook_02.GetFirstName] is limping home in shame."\n\nBlast, these youth gangs! Roaming the streets with weapons and bravado, getting into fights and doing all kinds of evil deeds to amuse themselves.\n\n"It was just a little brawl. Don't fret, [rook_01.Custom2('RelationToMeShort', spouse_target)] — I only defended our family name in the face of slander."
 yearly_republic.1003.a: "Ah, the follies of youth."
 yearly_republic.1003.b: "Clearly [rook_02.GetNameNoTooltip] was at fault. We demand reparations!"
 yearly_republic.1003.c: "We shall send a gift to [rook_02.GetDynastyHouseNameNoTooltip] to smooth things over."

 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "Your accusations against my house are groundless, vain, and wholly without merit.\n\nYou shall receive nothing from us — save, should you regrettably choose to press the matter further, the courteous attentions of our blades upon your throat."
 yearly_republic.1004.b.desc: "As the head of house [other_house_character_01.GetDynastyHouseName], I deeply regret this unpleasantness between our families. I must apologize for the inconvenience and beg that you accept this offering as an expression of my remorse."
 yearly_republic.1004.a: "They will regret this show of disrespect!"
 yearly_republic.1004.b: "Fine, we will get our restitution in due time."
 yearly_republic.1004.c: "We accept our due."
 yearly_republic.1004.d: "Let this be the end of discord between us."

 yearly_republic.1005.t: "Veto of the Masses"
 yearly_republic.1005.desc: "Discord between my house and [other_house_character_01.GetDynastyHouseName] has spilled into the streets of [capital_01.GetName] once more, our wagoners brawling over right of way until the road itself was blocked. Just another petty grievance, or so I thought, until the mob gathered at my door.\n\n"Enough!" one man shouts. "We cannot conduct our affairs while [ROOT.Char.GetDynastyHouseName] and [other_house_character_01.GetDynastyHouseNameNoTooltip] squabble. Stop dragging the city into your misery!"\n\nMy [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] [house_member_01.GetTitledFirstName] scoffs at their presumption. "Who are they to dictate our conduct?""
 yearly_republic.1005.a: "No, [ROOT.Char.Custom2('RelationToMeShort', house_member_01)]. It's time to sit down with [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.b: "My oratory skills will put the blame on house [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.c: "Guards! Drive this rabble from my door."

 yearly_republic.1005.tt.oratory_blame.desc: "Dazzle the crowd with your oratory"
 yearly_republic.1005.tt.oratory_blame.toast: "You pinned the problems on house [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Get drowned out by the jeering crowd"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "You fail to pin the blame on house [other_house_character_01.GetDynastyHouseName]"

 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "You are quite right. The hour has come to sit down and let cooler heads prevail — for the sake of those yet unborn, and for the enduring good of the republic. We shall meet with you."
 yearly_republic.1006.b.desc: "Unfortunately, we can see no cause to afford you the opportunity of lying to our faces. Doubtless you seek only a more convenient angle from which to do us harm. There shall be no negotiations."
 yearly_republic.1006.a: "Excellent!"
 yearly_republic.1006.b: "Damnation!"

 yearly_republic.1007.t: "Detente between [ROOT.Char.GetDynastyHouseNameNoTooltip] and [other_house_character_01.GetDynastyHouseNameNoTooltip]"
 yearly_republic.1007.desc: "The tension in the air is palpable as I sit down across from [other_house_character_01.GetTitledFirstName] in a neutral establishment. Our clients crowd the room, divided into two sides — like two armies eyeing each other across the battlefield. Daggers hidden below cloaks, no doubt.\n\n"So," [other_house_character_01.GetFirstNameNoTooltip] says in a reserved voice. "Say what you want to say."\n\nEvery eye in the room is on me, as I gather my wits and begin."
 yearly_republic.1007.a: "This feud is bad for business."
 yearly_republic.1007.b: "We should make peace, as [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]."
 yearly_republic.1007.c: "Blood has been spilled; let blood tie us together."
 yearly_republic.1007.d: "Let's settle it with steel, here and now!"
 yearly_republic.1007.tt.detente_business.desc: "You convince [other_house_character_01.GetShortUINameNoTooltip] of your argument"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip] is convinced"
 yearly_republic.1007.tt.detente_business_failure.desc: "You fail to convince [other_house_character_01.GetShortUINameNoTooltip] of your argument"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip] is not fully convinced"
 yearly_republic.1007.detente_business.change.desc: "Both houses agreed to settle their differences for business reasons"
 yearly_republic.1007.piety.change.desc: "Both houses agreed to settle their differences out of love for [ROOT.Char.GetFaith.HighGodName]."
 yearly_republic.1007.detente_marriage.change.desc: "Both houses agreed to settle their differences with a marriage."
 yearly_republic.1007.duel_win.desc: "You win the duel"
 yearly_republic.1007.duel_win.toast: "You stab [other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip] wins the duel"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip] stabs you"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip] gets wounded or killed"
 yearly_republic.1007.duel_loss.custom: "You get wounded or killed"
 yearly_republic.1007.c.tt.suitable_pair: "Both houses have unmarried members who can marry each other"

 house_relation_reason_falsify_good_desc: "Received letters talking about house leader's good character"
 house_relation_reason_falsify_bad_desc: "Found that house leader falsified letters"
 house_relation_reason_thorny_desc: "An unhappy marriage is spreading discord"
 house_relation_reason_bribery_good_desc: "Showered spouse with gold and jewelry"
 house_relation_reason_street_combat_desc: "Street fighting between the youths of both houses"
 house_relation_reason_business_argument_desc: "Discussed the merits of business"
 house_relation_reason_house_blamed_desc: "Blamed for social upheaval"
 house_relation_reason_houses_aligned_desc: "Made common cause at a gathering of like-minded houses"
 house_relation_reason_cooperation_desc: "Deepened cooperation between the houses."
 demand_reparation_for_fight_desc: "Send a letter demanding reparations"
 pay_reparation_for_fight_desc: "Send a letter with a gift and an apology"
 offer_a_sitdown_desc: "Send a letter to offer a detente"

 yearly_republic.1008.t: "Wolves in Merchants' Clothing"
 yearly_republic.1008.desc: "A bit of interesting information has reached my ears:\nOne of the merchant captains in [other_patrician_01.GetTitledFirstNamePossessive] employ has been dabbling in indiscriminate banditry while carrying out trade contracts around the Mediterranean and subsequently selling captured cargo for personal profit — a wolf in sheep's clothing, indeed!\n\nWhile it's impossible to know if [other_patrician_01.GetFirstNameNoTooltip] is in on this scheme, it would matter little to the Assembly members who have had their ships and cargo plundered."
 yearly_republic.1008.a: "Hire the captain to work for you, forthwith."
 yearly_republic.1008.b: "Threaten the captain until [bandit_01.GetSheHe] shares [bandit_01.GetHerHis] loot."
 yearly_republic.1008.c: "Threaten [other_patrician_01.GetFirstNameNoTooltip] to gain leverage."

 yearly_republic.1009.t: "Salon of Secrets"
 yearly_republic.1009.desc: "I'm spending an afternoon sitting in a cozy salon owned by [patrician_spouse_01.GetTitledFirstName].\n\nWhile talking to my [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName] and enjoying some [patrician_spouse_01.Custom('GetExpensiveDrink')], I notice a small shadow moving on a wall close to a large screen. After some observation I deduce that it comes from an arm doing slight, precise movements; [relation_01.GetFirstNameNoTooltip] stops talking and the movement stops as well; someone is writing down every word that is said within the salon from behind that screen!\n\nSeems like our [patrician_spouse_01.Custom('HostessHost')] [patrician_spouse_01.GetFirstNameNoTooltip], and [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband] [patrician_husband_01.GetTitledFirstName], are spying on the conversations of [patrician_spouse_01.GetHerHis] guests."
 yearly_republic.1009.a: "I must warn everyone of this wicked scheme!"
 yearly_republic.1009.a.tt: "Gain #P 20#! opinion of #value you#! and #N -25#! opinion of [patrician_spouse_01.GetShortUINameNoTooltip] and [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.b: "What a great idea! I should do that myself."
 yearly_republic.1009.c: "Blackmail [patrician_spouse_01.GetFirstNameNoTooltip] and [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband] to keep [patrician_spouse_01.GetHerHis] secret."
 yearly_republic.1009.c.success.desc: "Outwit [patrician_spouse_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.success.toast: "You gain a strong hook on [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip] outwits you"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip] moves closer to becoming your rival"
 yearly_republic.1009.flavor: "Who knows what you might overhear?"
 yearly_republic.1009.b.secret_learned: "Your spying efforts uncovered a secret"
 
 yearly_republic.1010.t: "Patricians in the Rafters"
 yearly_republic.1010.desc: "My [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName] finds me during a leisurely walk and leans in to whisper:\n\n"Ambassador [ambassador_01.GetFirstName] has returned from [ambassador_mission_location_01.GetName] and is giving a report before a closed council in the palace, tonight."\n\n[relation_01.GetSheHe|U] shakes [relation_01.GetHerHis] head. "Oh, imagine what a business advantage it would be to hear that report before it is presented to the full Assembly!"\n\nAs [relation_01.GetFirstNameNoTooltip] says this, the roof of the palace can be seen in the distance."
 yearly_republic.1010.a: "We shall pry tiles from the palace roof and listen in."
 yearly_republic.1010.b: "Maybe [ambassador_01.GetFirstNameNoTooltip] can be persuaded?"
 yearly_republic.1010.c: "We will know in due time."
 yearly_republic.1010.a.success.desc: "You overhear the report"
 yearly_republic.1010.a.success.toast: "You overhear the report"
 yearly_republic.1010.a.mixed.desc: "You fall off the roof"
 yearly_republic.1010.a.mixed.toast: "You fall off the roof"
 yearly_republic.1010.a.failure.desc: "You fall into the chamber"
 yearly_republic.1010.a.failure.toast: "You fall into the chamber"
 yearly_republic.1010.a.mixed.custom: "You and [relation_01.GetShortUIName] gain the [GetTrait('wounded_1').GetName( GetNullCharacter )|LV] [trait|E]"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUIName|U] loses #N 25#! [opinion|E] of you and [relation_01.GetShortUIName] #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW Crime — Allows [republic_ruler.GetShortUIName] to rightfully imprison both of you#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip] is amenable to a bribe"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip] is offended you asked"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip] gives you the report"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip] refuses to be bribed"

 yearly_republic.1011.t: "Summoned to Council"
 yearly_republic.1011.desc: "Once again I have been summoned to partake in one of the many secret councils that make the republic function.\n\nSuch obligations take time away from my family and business, yet as a Patrician I cannot refuse a summons without a valid reason, or a permit from the Assembly."
 yearly_republic.1011.a: "I will get my physician to attest that I am bedridden."
 yearly_republic.1011.b: "Since my dear [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)] is sick, I have good reason to stay home."
 yearly_republic.1011.c: "I will ask the Assembly for a 5-year exception permit."
 yearly_republic.1011.d: "It's my duty to go."
 yearly_republic.1011.c.success.desc: "The Assembly grants the permit"
 yearly_republic.1011.c.success.toast: "The Assembly granted your permit"
 yearly_republic.1011.c.failure.desc: "The Assembly denies the permit"
 yearly_republic.1011.c.failure.toast: "The Assembly denied your permit"

 yearly_republic.1012.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip] Procession"
 yearly_republic.1012.desc: "The anticipation of the crowd is palpable as the [ROOT.Char.GetTitleAsNamePossessive] procession exits the gate of the palace, beginning its march through the city.\n\nFirst come the civil servants in order of importance and prestige, then me: the [ROOT.Char.GetTitleAsNameNoTooltip] in the finest robes of state; the symbols of my authority held high for the people to marvel at. \nBehind me the patricians march, ranked after the eminence of their house.\n\nEveryone is in their place, the hierarchy and glory of our republic made manifest for all to see in this venerable ceremony!"
 yearly_republic.1012.a: "For the republic! For the people!"
 yearly_republic.1012.b: "Glory to the Assembly!"
 yearly_republic.1012.c: "All is a reflection of MY glory!"
 yearly_republic.1012.c.tt: "For the next #V 10#! years, passing the $republican_despot_succession_law$ [succession_law|E] costs #P 50%#! less [prestige|E]"

 yearly_republic.1013.t: "Marriage to the Sea"
 yearly_republic.1013.desc: "The [Glossary( '#bold Bucentaur#!', 'BUCENTAUR_GLOSS' )] has passed the last of the barrier islands and the salty expanse of the Adriatic Sea stretches out before me. [bishop_01.GetTitledFirstName] hands me the ceremonial ring and steps back.\nI hold it up for the gathered dignitaries to see, and in accordance with ancient rites, I toss it into the green waves.\n\n"[Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )]" I declare, and as the crowd aboard roars in approval at my words, our Republic's marriage to the sea — the source of our wealth and power — is complete."
 yearly_republic.1013.a: "We rule the waves!"
 yearly_republic.1013.b: "A foolish and empty ritual."
 yearly_republic.1013.c: "I am coming, my love!"
 yearly_republic.1013.d: "To the sea I will remain true!"

 yearly_republic.1014.t: "Aligning the Houses"
 yearly_republic.1014.desc: "On the invitation of [faction_head_01.GetTitledFirstName], the house heads of the [faction_head_01.GetHouse.GetHouseAspiration.GetName] ambition have gathered.\n\n"My Friends! In times such as these we need to come together and align our interests. Lest the other alignments of our beloved Republic find opportunity to divide and crush us."\n\nWe debate long into the night and while our divisions are many, there is opportunity for a strong voice to heal the gaps and create a united front."
 yearly_republic.1014.a: ""We should all join the Guelphs.""
 yearly_republic.1014.b: ""We should all join the Ghibellines.""
 yearly_republic.1014.c: ""Let's strengthen the bonds between our houses.""
 yearly_republic.1014.d: ""All rivalries among us have to end.""
 yearly_republic.1014.e: ""We should align our business interests.""
 yearly_republic.1014.e.tt: "All [patricians|E] with the [faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E] gain [GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip] for 2 years"
 yearly_republic.1014.a.tt: "All [patricians|E] with the [faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E] become members of the [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName] [situation_participant_group|E]"
 yearly_republic.1014.b.tt: "All [patricians|E] with the [faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E] become members of the [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName] [situation_participant_group|E]"
 yearly_republic.1014.c.tt: "All [patricians|E] with the [faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E] improve their [house_relations|E] with one another"
 yearly_republic.1014.d.tt: "Rivalries and enmities between the [patricians|E] with the [faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E] are brought to an end"
 yearly_republic.1014.tt.align_guelphs_success.desc: "The gathering is won over, and the houses pledge themselves to the Guelphs"
 yearly_republic.1014.align_guelphs_success.toast: "The Houses Turn Guelph"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "The debate turns sour, and the houses keep their own counsel"
 yearly_republic.1014.align_guelphs_failure.toast: "The Houses Remain Divided"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "The gathering is won over, and the houses pledge themselves to the Ghibellines"
 yearly_republic.1014.align_ghibellines_success.toast: "The Houses Turn Ghibelline"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "The debate turns sour, and the houses keep their own counsel"
 yearly_republic.1014.align_ghibellines_failure.toast: "The Houses Remain Divided"
 yearly_republic.1014.d.toast: "Old Grudges Laid to Rest"
 yearly_republic.1014.e.toast: "The Houses Pool Their Interests"

 yearly_republic.1015.t: "Gold for Votes"
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName|U] finds me as I am strolling through the market. [patrician.GetSheHe|U] approaches, all easy smiles and a carefully lowered voice.\n\n"Ah, it is nice to have a break from the dreary affair of voting in the Assembly. I often find myself perplexed on how to vote. A wise mind such as yours is like a golden lighthouse in a foggy sea, letting a wretch such as myself find his way in such fraught political matters." [patrician.GetSheHe|U] sighs dramatically.\n\n"But, I find myself low on coin. How is a poor boatman to point his prow next time the Assembly calls for a vote?""
 yearly_republic.1015.a: "Just name your price."
 yearly_republic.1015.c: "My proposals will stand on their own merits."

 yearly_republic.1016.t: "Beating the Vote Out of Them"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U] is an insolent worm, but [patrician.GetSheHe] has a vote in the Assembly all the same; a vote that [patrician.GetSheHe] could be "convinced" to put at my disposal.\n\nI just need to apply some pressure on [patrician.GetHerHim], so that [patrician.GetSheHe] understands the consequences inherent in disappointing a man such as myself."
 yearly_republic.1016.a: "Sabotage [patrician.GetHerHis] business interests."
 yearly_republic.1016.b: "Have thugs ambush and beat [patrician.GetHerHis] courtier."
 yearly_republic.1016.c: "Set fire to [patrician.GetHerHis] home."
 yearly_republic.1016.d: "I will teach [patrician.GetHerHim] terror!"
 yearly_republic.1016.e: "Let [patrician.GetHerHim] vote [patrician.GetHerHis] conscience."
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip] pledges to vote as you do"
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip] will be made an example of."

 yearly_republic.1017.t: "Philosopher-Kings"
 yearly_republic.1017.desc: "The dinner has lasted into the small hours; drinks flowing and tongues loosening.\n[debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName] and I have debated every topic under heaven.\n\nIt strikes me that I am in dialogue with some of the most learned patricians in the republic — an illustrious company indeed. The kind of people that could be convinced to vote my way the next time the Assembly gathers, using sound argument and brilliance of thought."
 yearly_republic.1017.a: "Brilliant oratory will convince them."
 yearly_republic.1017.b: "The soundness of my reasoning will dazzle them."
 yearly_republic.1017.c: "Maybe it's better to listen and learn."
 yearly_republic.1017.a.success.desc: "Out-talk [debater_orator.GetFirstNameNoTooltip], the finest speaker at the table"
 yearly_republic.1017.a.success.toast: "The Table Is Won Over"
 yearly_republic.1017.a.failure.desc: "Be talked in circles by [debater_orator.GetFirstNameNoTooltip], the finest speaker at the table"
 yearly_republic.1017.a.failure.toast: "Your Rhetoric Falls Flat"
 yearly_republic.1017.b.success.desc: "Out-reason [debater_scholar.GetFirstNameNoTooltip], the most learned mind at the table"
 yearly_republic.1017.b.success.toast: "The Table Is Convinced"
 yearly_republic.1017.b.failure.desc: "Have your reasoning picked apart by [debater_scholar.GetFirstNameNoTooltip], the most learned mind at the table"
 yearly_republic.1017.b.failure.toast: "Your Argument Is Picked Apart"
 yearly_republic.1017.c.toast: "A Night Spent Listening"
 yearly_republic.1017.c.tt: "A small chance that the night's debate leaves a lasting mark on you"
 yearly_republic.1017.c.insight.toast: "The Debate Leaves Its Mark"

 yearly_republic.1018.t: "Come Bearing Gifts"
 yearly_republic.1018.desc: "My [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName] arrives at my gate unannounced. After we have exchanged greetings and a heartfelt embrace, [benefactor_01.GetFirstNameNoTooltip] leads me outside to a waiting cart loaded with goods and trinkets.\n\n"Sorry for not sending word ahead of my visit, but I was passing by and thought you would enjoy this [new_curio.GetType] I procured in my recent travels."\n\n[benefactor_01.GetSheHe|U] lifts a sheet from the cart, revealing [new_curio.GetName]."
 yearly_republic.1018.a: ""Thank you, my [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]!""
 yearly_republic.1018.b: "Perhaps this could fetch a good price?"
 yearly_republic.1018_domicile_curio_sold_tt: "You sell the [new_curio.GetName] later on."

 yearly_republic.1019.t: "An Eye for Details"
 yearly_republic.1019.desc: "Another day walking the streets of [event_location_01.GetName] together with my [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetShortUIName]. There is always something to look at and discuss.\n\n"Look how they store that produce; I saw them do it much better in the [target_city.GetNameNoTooltip]. Let me tell you, [ROOT.Char.GetFirstNameNoTooltip], there is so much to learn from the people around us, if you just pay a little bit of attention."

 yearly_republic.1019.a: ""Did you learn about [experience_trade_category_01.GetNameNoTooltip] during your travels?""
 yearly_republic.1019.b: ""Let's discuss the [experience_trade_category_02.GetNameNoTooltip] business at the market.""
 yearly_republic.1019.c: "I should make observation a daily habit."

 yearly_republic.1020.t: "The Bathhouse Deal"
 yearly_republic.1020.desc: ""...business thrives between trusted partners, after all."\n\nDumping a bucket of water over [house_benefactor_01.GetHerHis] own head, [house_benefactor_01.GetFirstName] turns to me once more with a serious expression. "Your family has our respect, [ROOT.Char.GetFirstName]."\n\nThe steam of the bathhouse fogs my vision and the heat of the water is relaxing my muscles.\n\n"You and yours have been good friends to us in house [house_benefactor_01.GetDynastyHouseNameNoTooltip], and I feel it is only natural that we deepen our cooperation. It would benefit both our houses.""
 yearly_republic.1020.a: ""We should share agents and contacts abroad, widening our reach.""
 yearly_republic.1020.b: ""Let's share our expertise and grow stronger together.""

 ## GLOSS
 BUCENTAUR_GLOSS: "The Bucentaur was the gilded state barge of Venezia, rowed by oarsmen of the Arsenal and used only for ceremony."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! — Latin for "we wed thee, sea, in sign of true and perpetual dominion"."
