 trade_category_non_construction: "Non-Construction Goods"
 trade_category_non_construction_desc: "Every trade good except construction materials; it does not cover wood, hemp, or stone."
 trade_category_non_food: "Non-Food Goods"
 trade_category_non_food_desc: "Every trade good except basic food; it does not cover grain, millet, rice, fruit, meat, fish, or cheese."
 trade_category_non_medicinal: "Non-Medicinal Goods"
 trade_category_non_medicinal_desc: "Every trade good except medicaments."
 trade_category_non_luxury: "Non-Luxury Goods"
 trade_category_non_luxury_desc: "Every trade good except luxuries and comfort foods, such as silk, spices, jewelry, cheese, fruit, oil, honey, and tea."
 trade_category_food: "Basic Food"
 trade_category_food_desc: "The essential foodstuffs that sustain any population, including grain, millet, rice, fruit, meat, fish, and cheese. A steady supply is the first requirement of every settlement, army, and household."
 trade_category_beasts_of_burden: "Beasts of Burden"
 trade_category_beasts_of_burden_desc: "Livestock essential to agriculture and transport, including horses and cattle. They power farms, haul goods, and sustain the rural economy of any realm."
 trade_category_minerals: "Minerals"
 trade_category_minerals_desc: "Goods drawn from the earth through mining and quarrying, including metals, gemstones, salt, and alum. They feed the forges, mints, and craft workshops upon which all industry depends."
 trade_category_luxury: "Luxury"
 trade_category_luxury_desc: "Rare and costly goods coveted by the wealthy and powerful, from silk and spices to ivory and jewelry. They confer an aura of prestige and refinement and are affordable only to the most prosperous courts."
 trade_category_refined_goods: "Refined Goods"
 trade_category_alcohol: "Alcohol"
 trade_category_alcohol_desc: "Beer and wine, far more than simple indulgences. They serve as safe alternatives to contaminated water, as religious sacraments, and as social necessities in taverns and at court."
 trade_category_liqour_raw_materials: "Distillables"
 trade_category_precious_metals: "Precious Metals"
 trade_category_precious_metals_desc: "Silver and gold, the lifeblood of mints and treasuries. Beyond their monetary use, precious metals are essential for fine craftsmanship and displays of status."
 trade_category_jewelry_materials: "Precious Stones"
 trade_category_jewelry_materials_desc: "Rare and exotic raw materials prized for their beauty, including gems, amber, ivory, and jade. These command high prices and are essential for luxury craftsmanship and religious adornment."
 trade_category_crops: "Crops"
 trade_category_crops_desc: "Cultivated field crops including cereals, sugar, cotton, and flax. Grown in tended plots and watered by irrigation, they form the natural bounty on which farming communities are built."
 trade_category_base_metals: "Base Metals"
 trade_category_base_metals_desc: "Iron and copper, the practical metals underpinning industry and warfare. Iron forms weapons, tools, and armor; copper is essential for alloying and everyday metalwork."
 trade_category_cereals: "Cereals"
 trade_category_cereals_desc: "Staple crops including grain, millet, and rice. Cereals are the foundation of any diet and among the most widely traded goods, essential to feed cities and armies."
 trade_category_meat: "Meats"
 trade_category_meat_desc: "Preserved and cured meat and fish. These protein-rich provisions sustain households, garrisons, and long voyages far from fresh supplies."
 trade_category_comforts: "Comforts"
 trade_category_comforts_desc: "Everyday food goods beyond basic sustenance, including cheese, fruit, olive oil, honey, and tea. Comforts improve quality of life and are in steady demand across all settled communities."
 trade_category_clothes: "Clothes"
 trade_category_clothes_desc: "Finished garments and clothing materials including textiles, furs, and leather. From rough work gear to fine dress, clothing is a fundamental need for every person in a realm."
 trade_category_luxury_consumption: "Luxury Consumables"
 trade_category_luxury_consumption_desc: "Costly and sought-after goods from distant lands, including sugar and spices. These enhance food, feature in medicine, and are affordable only to the privileged few."
 trade_category_luxury_items: "Luxury Items"
 trade_category_luxury_items_desc: "Refined objects of status and culture including ceramics, glass, jewelry, lacquerware, and silk. They are the hallmarks of a prosperous and sophisticated court."
 trade_category_construction_materials: "Construction Materials"
 trade_category_mandala_arms: "Rudimentary Weapons"
 trade_category_mandala_arms_desc: "Simple materials for arming a host, chiefly copper and wood. They furnish the spears, shields, and fundamental implements of war for realms lacking access to more formidable forged armaments."
 trade_category_carpentry_supplies: "Carpentries"
 trade_category_carpentry_supplies_desc: "Wood and hemp, the raw materials of construction and seafaring. Timber frames buildings and ships alike, while hemp provides the ropes and rigging essential to maritime trade."
 trade_category_rural_goods: "Rural Goods"
 trade_category_rural_goods_desc: "The raw bounty of the countryside, spanning crops, livestock, timber, and the valuable ores won from the earth's grasp. These are the raw goods that flow from the land to the towns and cities that process them."
 trade_category_agricultural_goods: "Agricultural Goods"
 trade_category_agricultural_goods_desc: "The full produce of farm and field, from cereals and fibers to wine, honey, and livestock. These goods represent the broad output of a settled agricultural economy."
 trade_category_bast_fibres: "Bast Fibres"
 trade_category_fabrics: "Fabric"
 trade_category_fabrics_desc: "Raw textile fibers including wool, cotton, and flax. These are the intermediate goods between raw agriculture and finished cloth, feeding the looms of weavers across the realm."
 trade_category_guild_goods: "Guild Goods"
 trade_category_guild_goods_desc: "Worked and finely crafted wares produced in the workshops of urban guilds, including beer, textiles, glass, and jewelry. They are the finished output of skilled tradesmen."
 trade_category_cheap_common: "Common Goods"
 trade_category_cheap_common_desc: "Inexpensive and widely available wares found in nearly every market, from grain and fish to timber and stone. Their low value and abundance make them the everyday substance of local trade."
 trade_category_fine_goods: "Fine Goods"
 trade_category_fine_goods_desc: "High-value wares that flow through the great marketplaces of the world. They are the currency of wealth, status, and civilized life."
 trade_category_staple_goods: "Staple Goods"
 trade_category_staple_goods_desc: "The bulk commodities that sustain cities and armies. Wherever people live in numbers, these goods must flow."
 trade_category_stone: "Stone"
 trade_category_stone_desc: "Quarried building stone for fortifications, churches, and civic infrastructure. Where local deposits are scarce, it must be imported for any serious construction project."
 trade_category_salt: "Salt"
 trade_category_salt_desc: "An essential mineral preservative and dietary necessity. Salt enables the preservation of meat and fish and the tanning of hides, and has been a driver of long-range trade since ancient times."
 trade_category_alum: "Alum"
 trade_category_alum_desc: "A versatile mineral salt used primarily as a mordant to fix dyes onto textiles. Also employed in tanning and medicine, its scarcity makes it a strategically valuable commodity."
 trade_category_dyes: "Dyes"
 trade_category_dyes_desc: "Vivid colorants derived from plants, minerals, and insects. Dyes are used across many crafts: fixing color into cloth, glazing ceramics, and illuminating manuscripts with vibrant inks."
 trade_category_books: "Books"
 trade_category_books_desc: "Manuscripts and the paper or parchment on which they are written. Books are central to education, administration, and the transmission of knowledge, and are in demand wherever literacy takes hold."
 trade_category_incense: "Incense"
 trade_category_incense_desc: "Aromatic resins and compounds burned in religious ceremonies throughout the world. A steady supply is essential for churches, temples, and shrines in any devout community."
 trade_category_medicaments: "Medicaments"
 trade_category_medicaments_desc: "Remedies, herbs, and medical compounds used by physicians and healers. Access to medicaments reduces the toll of disease and injury and is vital to any growing settlement."

 trade_good_wood: "Wood"
 trade_good_wood_desc: "Timber is an essential building material for houses, ships, and furniture. Good quality hardwood is not always locally available and may need to be imported from forested regions."
 trade_good_stone: "Stone"
 trade_good_stone_desc: "Quarried from deposits of limestone, sandstone, or marble, building stone is essential for serious construction. Heavy and costly to transport, it is often scarce away from natural outcrops."
 trade_good_wool: "Wool"
 trade_good_wool_desc: "Shorn from sheep and cleaned, wool is the most important textile fiber in medieval Europe. It is spun into yarn and woven into cloth, providing the raw material for a vast weaving industry."
 trade_good_cotton: "Cotton"
 trade_good_cotton_desc: "Cultivated across warm regions from India to Egypt, cotton produces a lighter and more breathable fiber than wool. Spun and woven, it is the basis of much of the textile trade in the Islamic world and beyond."
 trade_good_leather: "Leather"
 trade_good_leather_desc: "Tanned animal hides turned into a durable and workable material. Leather is used for boots, belts, saddles, armor, and book bindings, making it a fundamental craft material across every culture."
 trade_good_flax: "Flax"
 trade_good_flax_desc: "Grown both for its linen fibers and the linseed oil that can be extracted from its seeds, flax is one of the oldest crops grown by man. While the harvesting can be labor intensive Flax is not as particular as other fiber crops and can be grown almost anywhere."
 trade_good_hemp: "Hemp"
 trade_good_hemp_desc: "A versatile plant grown for its strong fibers, which are twisted into rope, woven into sailcloth, or used for caulking. Hemp is essential to any maritime economy and to construction across the world."
 trade_good_salt: "Salt"
 trade_good_salt_desc: "Harvested from sea evaporation pans, rock salt mines, or brine springs, salt is an essential preservative and dietary mineral. Its ability to prevent spoilage has made it one of the most consistently traded commodities throughout history."
 trade_good_grain: "Grain"
 trade_good_grain_desc: "Ground into flour for bread or porridge, grain is the most important crop in the medieval world. From wheat in the west to rye in the north, it feeds peasants and nobles alike."
 trade_good_fruit: "Fruit"
 trade_good_fruit_desc: "Fresh and dried fruits provide sweetness and variety to the medieval diet. Orchard fruits such as apples, pears, and figs are traded from warmer regions to satisfy demand in the north."
 trade_good_meat: "Cured Meat"
 trade_good_meat_desc: "Salted, smoked, or dried to prevent spoilage, cured meats are an essential source of protein. They sustain armies on campaign and families through the lean winter months."
 trade_good_fish: "Fish"
 trade_good_fish_desc: "Dried, salted, or smoked fish can travel long distances without spoiling, making it an important protein source far from any coast or river. Herring and cod in particular drove long-range maritime trade."
 trade_good_cattle: "Cattle"
 trade_good_cattle_desc: "Cattle provide draft power for plowing fields alongside milk, meat, and hides. They are the most versatile livestock, and access to good breeding stock improves any farming economy."
 trade_good_horses: "Horses"
 trade_good_horses_desc: "Horses are the primary draft and riding animals of the medieval world, essential for agriculture, transport, and warfare. Fine breeds from the steppe and Iberia are particularly prized."
 trade_good_cheese: "Cheese"
 trade_good_cheese_desc: "A preserved dairy product made by curdling and aging milk. Cheese keeps far longer than fresh milk and is a reliable source of fat and protein across the seasons."
 trade_good_beer: "Beer"
 trade_good_beer_desc: "Brewed from fermented grain, beer is the everyday drink of northern Europe. Low in alcohol but nutritious, it is safer to drink than water in many towns and consumed at every level of society."
 trade_good_wine: "Wine"
 trade_good_wine_desc: "Produced from fermented grapes, wine holds a privileged place in medieval culture as a drink of the church, the nobility, and the wealthy. It is traded widely from vineyards in the Mediterranean and Rhine valley."
 trade_good_oil: "Olive Oil"
 trade_good_oil_desc: "Pressed from the olive, this oil serves as cooking fat, lamp fuel, and soap base across the Mediterranean world. Its importance declines further north where animal fats and butter take its place."
 trade_good_honey: "Honey"
 trade_good_honey_desc: "The primary sweetener of the medieval world, honey is also used in mead, medicine, and the preservation of food. Bees are kept across the world but quality honey commands a premium."
 trade_good_rice: "Rice"
 trade_good_rice_desc: "The dominant cereal of South and East Asia, rice requires flooded paddies and a warm climate but yields abundantly. It forms the dietary foundation for vast populations."
 trade_good_millet: "Millet"
 trade_good_millet_desc: "A resilient cereal crop that thrives in poor soils and dry climates where other grains fail. Millet is a staple across much of Africa, Central Asia, and the drier parts of India."
 trade_good_iron: "Iron"
 trade_good_iron_desc: "The workhorse metal of the medieval world, iron is smelted from ore to make tools, weapons, horseshoes, and nails. No settlement can grow without a steady supply for its craftsmen and soldiers."
 trade_good_alum: "Alum"
 trade_good_alum_desc: "Alum is a rare salt with properties like being able to stop bleeding, useful in glass finishing, or the tanning of leather. Its main use is as a mordant, that both bleaches and makes dyes stick much more efficiently to textiles.\n\nAlum is found in its natural form in warm areas such as the middle east, but can also be extracted from alunite rocks in other areas of the world."
 trade_good_jade: "Jade"
 trade_good_jade_desc: "A hard beautiful stone of great cultural significance in East Asia, jade is worked into tools, ornaments, and ritual objects. It commands enormous prices in Chinese courts and is a symbol of virtue and rank."
 trade_good_gold: "Gold"
 trade_good_gold_desc: "The most precious of metals, gold is the basis of royal treasuries and the highest-value coinage. Its rarity and luster make it the favored material for crowns, relics, and display objects."
 trade_good_silver: "Silver"
 trade_good_silver_desc: "The most common monetary metal, silver is minted into coins that circulate across the known world. Beyond currency, it is worked into jewelry, plate, and religious objects of great beauty."
 trade_good_amber: "Amber"
 trade_good_amber_desc: "A fossilized tree resin found primarily on the shores of the Baltic, amber has been traded since ancient times. Its warm golden color and workability make it prized for beads, pendants, and decorative objects."
 trade_good_copper: "Copper"
 trade_good_copper_desc: "A soft and workable metal used for cooking vessels, church bells, and alloys such as bronze and brass. Its warm color also makes it popular for decorative metalwork."
 trade_good_gems: "Gems"
 trade_good_gems_desc: "Precious stones including rubies, sapphires, and emeralds are among the most valuable goods along any trade route. Cut and polished, they adorn crowns, reliquaries, and the jewels of the powerful."
 trade_good_silk: "Silk"
 trade_good_silk_desc: "The finest of all textile fibers, silk is spun from the cocoons of silkworms and woven into cloth of extraordinary softness and luster. Originating in China, it is one of the most valuable traded goods in the world."
 trade_good_textiles: "Textiles"
 trade_good_textiles_desc: "Woven cloth produced from wool, cotton, linen, or blended fibers. Fine textiles are among the most traded goods in the medieval world, with renowned workshops in Flanders, Italy, and the Middle East."
 trade_good_furs: "Furs"
 trade_good_furs_desc: "Pelts of fox, ermine, sable, beaver, and other animals trapped across the northern forests. Fur garments are a mark of wealth and rank, and demand from noble courts drives a lucrative trade."
 trade_good_books_paper: "Books & Paper"
 trade_good_books_paper_desc: "Handwritten manuscripts and the parchment or paper on which they are recorded. Books preserve legal codes, religious texts, and accumulated knowledge, and are in demand wherever administration and learning flourish."
 trade_good_spices: "Spices"
 trade_good_spices_desc: "Pepper, cinnamon, cloves, nutmeg, and other aromatics from South and Southeast Asia are among the most valuable goods in the world. They preserve food, flavor it, and signal wealth."
 trade_good_tea: "Tea"
 trade_good_tea_desc: "Prepared from the dried and processed leaves of the tea plant, tea is the defining drink of the Far East. It spread westward along the Silk Road, gaining importance as a trade commodity in its own right."
 trade_good_dyes: "Dyes"
 trade_good_dyes_desc: "Colorants extracted from plants such as woad and madder, insects such as kermes, and minerals. Dyes give cloth, ceramics, and illuminated manuscripts their vivid colors and are essential to the craft industries that depend on them."
 trade_good_jewelry: "Jewelry"
 trade_good_jewelry_desc: "Finished pieces combining precious metals with gemstones, enamel, or glass. Jewelry is the most visible mark of personal wealth in the medieval world and is exchanged as gifts and diplomatic tokens."
 trade_good_ivory: "Ivory"
 trade_good_ivory_desc: "Carved from elephant tusks, ivory is a material of prestige and devotion. It is used for ornamental carvings, chess pieces, reliquary panels, and the most lavish decorative objects."
 trade_good_glass: "Glass"
 trade_good_glass_desc: "Blown and shaped glass vessels, window panes, and decorative objects. Fine glasswork from Venice and the Islamic world commands high prices, while simpler glass is used increasingly in churches and wealthy homes."
 trade_good_sugar: "Sugar"
 trade_good_sugar_desc: "Refined from sugarcane grown in warm southern regions, sugar is a rare and costly luxury. It is used as a sweetener, a medicine, and a status ingredient in the kitchens of the wealthy."
 trade_good_incense: "Incense"
 trade_good_incense_desc: "Aromatic resins such as frankincense and myrrh, burned in religious ceremonies across every faith. Incense requires warmth and specialized trees to produce, and is exported from Arabia, Ethiopia, and India."
 trade_good_ceramics: "Ceramics"
 trade_good_ceramics_desc: "Fine pottery and porcelain produced to high standards of craft and artistry. Quality ceramics from China and the Islamic world are sought-after luxury goods and decorative objects."
 trade_good_lacquerware: "Lacquerware"
 trade_good_lacquerware_desc: "Objects coated in multiple layers of lacquer resin, prized in East Asia for their durability and glossy finish. Lacquered boxes, trays, and furniture are luxury exports that travel far along the silk routes."
 trade_good_medicaments: "Medicaments"
 trade_good_medicaments_desc: "A broad range of dried herbs, mineral compounds, and processed remedies used by physicians and apothecaries. Access to medicaments is critical for treating wounds, managing disease, and maintaining a healthy population."

