l_english:
 activity_carnival: "Carnival"
 activity_carnival_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] Carnival"
 activity_carnival_owner: "Host"
 activity_carnival_desc: "Appease and amuse your citizens by putting on a dazzling carnival! Give yourself and your subjects the opportunity to lay aside rank and distinction; losing themselves in masked revelry, entertainment and food!\n\nEveryone will be eager to celebrate your republic's history and culture. It is a good opportunity to show off your wealth to stoke the envy of your rivals or move unseen amongst the masses to experience their uninhibited thoughts and concerns."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$May gain [prestige_i][prestige|E]\n$BULLET_WITH_TAB$May gain [piety_i][piety|E]\n$BULLET_WITH_TAB$Participants may improve other [activity_guest_short_possessive|E] [opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$Participants may lose [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$May improve [control_i|E] [control|E] in the [county|E]\n$BULLET_WITH_TAB$May improve [prosperity_i|E] [prosperity|E] in the [county|E]\n$BULLET_WITH_TAB$May improve [popular_opinion_i|E] [popular_opinion|E]\n"
 activity_carnival_guest_help_text: "A Carnival is an excellent opportunity to find new talented commoners, make business connections or just lose [stress_loss_i][stress|E]."
 activity_carnival_province_desc: "You organize a Carnival in [ROOT.Province.GetName]."
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Participants may gain [prestige|E]\n$BULLET_WITH_TAB$ Participants may gain [opinion|E] of other participants\n$BULLET_WITH_TAB$ Participants may lose [stress_loss_i][stress|E]."

 activity_carnival_conclusion_desc: "The [GetActivityType( 'activity_carnival' ).GetName] has concluded."
 activity_carnival_selection_tooltip: "Delight your people with masked revelries\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$[control_i|E] [control|E]\n$BULLET_WITH_TAB$[prosperity_i|E] [prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]"
 
 carnival_decoration_basic: "Basic Decorations"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ Decreased [prestige|E] gain\n\n#weak The city is beautiful enough as it is, surely?#!"
 carnival_decoration_extensive: "Extensive Decorations"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$ Moderate [prestige|E] gain\n\n#weak Decorate the city with flowers, textiles and sets to transport the citizen into marvelous world beyond the ordinary.#!"
 carnival_decoration_extravagant: "Extravagant Decorations"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ Greatly increased [prestige|E] gain\n\n#weak Turn the entire city on its head, sparing no expense to decorate streets and plazas into wonderlands of the imagination.#!"
 
 carnival_entertainment_basic: "Basic Entertainment"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ Decreased [popular_opinion|E] gain\n\n#weak A few jugglers and a singer is enough.#!"
 carnival_entertainment_extensive: "Extensive Entertainment"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ Moderate [popular_opinion|E] gain\n\n#weak Hire a troupe of actors, jugglers, jesters and bards to entertain and amaze the crowd.#!"
 carnival_entertainment_extravagant: "Extravagant Entertainment"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ Greatly increased [popular_opinion|E] gain\n\n#weak Fill the plazas with entertainers from all over the world so the populous is thrilled and dazzled by exotic acts of all kinds.#!"

 go_incognito_intent: "Go Incognito"
 go_incognito_intent_desc: "Join the Carnival as a masked participant to mix anonymously with the masses.\n#EMP #low Learn [secret_i] [secrets|E] and act under a veil of anonymity."
 flaunt_wealth_intent: "Flaunt Wealth"
 flaunt_wealth_intent_desc: "Don a striking costume and seek opportunities to throw money around lavishly.\n#EMP #low Gain [prestige_i] [prestige|E] and [popular_opinion_i] [popular_opinion|E]."


