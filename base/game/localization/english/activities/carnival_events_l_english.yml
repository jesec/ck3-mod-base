 ## Event - Thundering hooves 
 carnival.1020.t: "Thundering Hooves"
 carnival.1020.desc: "[murder_victim.GetNameNoTooltip] is leaving a feast as I spot [murder_victim.GetHerHim] and [murder_victim.GetHerHis] [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip].\n\nI reel in on my horse’s reigns, waiting for [murder_victim.GetFirstNameNoTooltip] to say [murder_victim.GetHerHis] goodbyes to the host. My target is unaware of the danger that stomping its hooves just down the street.\n\nIt is an opportune moment, but comes with a risk of innocents getting hurt as well."
 carnival.1020.a: "I will slice both in half as I ride past."
 carnival.1020.b: "Forward [ROOT.Char.Custom('WarhorseStoryName')]! They will know I am a [ROOT.Char.GetWomanMan] to fear."
 carnival.1020.c: "Ride [murder_victim.GetFirstNameNoTooltip] down. A terrible accident."
 carnival.1020.d: "I gesture to the men I have hired to ride down my quarry."
 carnival.1020.e: "Not today, the risk is too great."

 carnival.1020.tt.horse.hit.desc: "The victim is crushed under the hooves"
 carnival.1020.tt.horse.miss.desc: "The horse misses its target"

 carnival.1020.tt.horse.hit.toast: "The victim was crushed under the hooves"
 carnival.1020.tt.horse.miss.toast: "The horse missed its target"
 carnival.1020.murder_horse.log_title: "Warhorse Rampage"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName] rode down [murder_victim.GetShortUIName] with [carnival_main.GetHerHis] warhorse, [carnival_main.Custom('WarhorseStoryName')]"
 carnival.1020.accident.log_title: "Terrible Accident"
 carnival.1020.accident.log: "[murder_victim.GetShortUIName] died after being trampled by a horse in a terrible accident."
 carnival.1020.both_accident.log_title: "Terrible Accident"
 carnival.1020.both_accident.log: "In a terrible accident, [murder_victim.GetShortUIName] and [bystander.GetShortUIName] were trampled to death by a horse"
 carnival.1020.bystander_accident.log_title: "Terrible Accident"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName] died after being trampled by a horse in a terrible accident."
 carnival.1020.sword.log_title: "Murder From Horseback"
 carnival.1020.sword.log: "[murder_victim.GetShortUIName] and [bystander.GetShortUIName] were sliced in two by a rider."
