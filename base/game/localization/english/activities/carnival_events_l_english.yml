l_english:
 
 ## Event - Carnival Opening 
 carnival.1001.t: "A Time of Wonder"
 carnival.1001.desc: "The preparations are complete.\n\nColorful banners line the boulevards, processions wind their way through the alleys and streets of [carnival_location.GetName]. Crowds gather around the plazas — rich or poor, ugly or fair, we all are one and the same in this sea of masked faces.\n\nWhat a spectacle this will be!"
 carnival.1001.a: "It is time to don the mask. [Glossary( '#bold Carnis levare!#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "Try to find me now, assassins!"
 carnival.1001.c: "A mask hides flaws and scars alike…"
 
 ## Event - Carnival Closing
 carnival.1002.t: "Return to the Mundane"
 carnival.1002.desc: "The streets are strewn with the remnants of the carnival; discarded masks and decorations litter the gutters as revelers drag themselves back home. Putting aside our differences, we have feasted, danced, played games, and laughed together as a united city.\n\nThe glamor of the carnival will remain in the air for a while yet, reminding us of who we are, then it is back to our regular lives, to the hierarchy, toil, and obligations — until the Carnival returns once more."
 carnival.1002.a: "Time to get on with business."
 carnival.1002.b: "What if every day could be like this?"
 carnival.1002.c: "It feels good to return to order."
 
 ## Event - A chance for mischief
 carnival.1003.t: "A Chance for Mischief"
 carnival.1003.desc: "Visiting the gaudy abode of House [house_target.GetDynastyHouseName], I see fine [house_target.Custom('RegionalFabric')] drapes, hundreds of [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')], servants aplenty, and [house_target.GetName] pontificating to [house_target.GetHerHis] clients – I get the urge to humble them all a bit.\n\nSuch mischief is in the spirit of Carnival, surely?\n\nI should secretly hire some ruffians to:"
 carnival.1003.a: "Throw rotten eggs at [house_target.GetFirstNameNoTooltip]!"
 carnival.1003.b: "Riot through [house_target.GetHerHis] palace dressed as devils."
 carnival.1003.c: " Paint rude graffiti of [house_target.GetHerHis] family along the boulevards."
 carnival.1003.d: "On second thought, no."

 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName] is too ashamed to go outside"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName] looses [house_member.GetHerHis] mind"
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUINamePossessive] blood is boiling"
 
 carnival.1003.throw_eggs_log_title: "Pelted With Eggs"
 carnival.1003.throw_eggs_log: "The manor of House [house_target.GetDynastyHouseName] was pelted with eggs"
 carnival.1003.mischief.insanity.log_title: "Devilish Riot"
 carnival.1003.mischief.insanity.log: "A riot of thugs dressed as devils drove [house_member.GetShortUIName] to lose [house_member.GetHerHis] mind"
 carnival.1003.mischief.irritable.log_title: "Devilish Riot"
 carnival.1003.mischief.irritable.log: "A riot of thugs dresses as devils has left [house_member.GetShortUIName] angry and irritated with everyone around them"
 carnival.1003.mischief.reclusive.log_title: "Devilish Riot"
 carnival.1003.mischief.reclusive.log: "A riot of thugs dresses as devils has driven [house_member.GetShortUIName] into hiding"
 
 ## Event - House Relations 
 carnival.1004.t: "House Relation"
 carnival.1004.desc: "A city divided will not long endure, so it behooves me to make common cause with the powerful houses involved in the politics of [carnival_location.GetName].\n\nTaking [other_house_leader01.GetName] aside during a banquet, I attempt to make him see the benefit of good relations between my house [ROOT.Char.GetDynastyHouseName] and [other_house_leader01.GetHerHis] house [other_house_leader01.GetDynastyHouseName]."
 carnival.1004.a: "Our ledgers are full, our pockets deep!"
 carnival.1004.b: "Cooperation in business benefits us both."
 carnival.1004.c: "Your house is well beneath house [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 carnival.1004.d: "The relation between our houses should remain the same."
 
 ## Event - Prank a friend
 carnival.1005.t: "Larking a Friend"
 carnival.1005.desc: "The carnival is a perfect time to pull a jape on a friend — all in a good-natured spirit, of course.\n\nI see my friend [friend.GetName] talking to [bystander.GetName] and my mind immediately springs to some entertaining possibilities!"
 carnival.1005.a: "Challenge both of them to a duel with a wooden stick!"
 carnival.1005.b: "Bump into [friend.GetHerHim] in disguise, speak a made-up language."
 carnival.1005.c: "I will pelt them with painted eggshells full of perfume!"
 carnival.1005.d: "No. I should not force my humor on others."

 carnival.1005.tt.stick_success.desc: "You have a enjoyable stick fight"
 carnival.1005.tt.stick_failure.desc: "You get too rough while playing around"
 carnival.1005.tt.success.desc: "Everyone laughs at your flourish"
 carnival.1005.tt.failure.desc: "Your victims call you a dull donkey"
 carnival.1005.tt.disguise_success.desc: "You amuse your audience"
 carnival.1005.tt.disguise_failure.desc: "You confuse and annoy your audience."

 carnival.1005.tt.success.toast: "Everyone laughed at your flourish" 
 carnival.1005.tt.failure.toast: "Your victims called you a dull donkey"
 carnival.1005.tt.egg_success.toast: "Your friend loved the fragrant surprise"
 carnival.1005.tt.egg_failure.toast: "Your friend hated the smell."
 
 ## Event - The entertainer 
 carnival.1006.t: "The Entertainers"
 carnival.1006.desc: "Carnivals are high season for entertainers of all stripes. I find myself listening to a talented troupe of musicians spinning tales with voices, verse and instruments."
 carnival.1006.a: "Pay the musicians to sing songs about my greatness!"
 carnival.1006.b: "I will have a middleman recruit the best among them."
 carnival.1006.c: "I should request a popular melody."
 carnival.1006.d: "Invite a nearby [dancer_character.GetWomanMan] to a dance!"

 cooltip.carnival.1006.bawdy_song.tt: "Requests a bawdy song"
 cooltip.carnival.1006.patriotic_song.tt: "Requests a song about [Glossary( '#bold Patria!#!', 'carnival_patria_GLOSS' )]"
 cooltip.carnival.1006.spiritual_song.tt: "Requests a spiritual song"

 carnival.1006.tt.dance_success.desc: "The [dancer_character.GetWomanMan] accepts the invitation to dance"
 carnival.1006.tt.dance_failure.desc: "The [dancer_character.GetWomanMan] declines the invitation to dance"

 carnival.1006.tt.dance_success.toast: "You dance with [dancer_character.GetFirstNameNoTooltip]"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip] decline to dance with you."
 carnival.1006.bawdy_song.tt.toast: "You got a bawdy song!"
 carnival.1006.patriotic_song.tt.toast: "You got a song about the [Glossary( '#bold Patria!#!', 'carnival_patria_GLOSS' )]!"
 carnival.1006.spiritual_song.tt.toast: "You got a spiritual song!"	
 carnival.1006.recruit_entertainer.log_title: "Recruited Entertainer"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip] recruited [entertainer_character.GetFirstNameNoTooltip]"
 
 ## Event - Learning to juggle
 carnival.1007.t: "Learning to Juggle"
 carnival.1007.desc: "Minstrels, jugglers, and fools entertain the people along the boulevard of [carnival_location.GetName]. Especially the Jugglers catch my eye. It is hard not to admire the control they have over the knives and balls they keep suspended in the air.\n\nOne of the jugglers steps forth and asks if I want to try, just for the joy of it.\n\n"One, two, or three balls–how many can you keep from falling to the ground, [ROOT.Char.Custom('MistressMaster')]?""
 carnival.1007.a: "I will wager anyone that I can keep three balls in the air!"
 carnival.1007.b: "Two balls are more than enough."
 carnival.1007.c: "How about two of those knives?"
 carnival.1007.d: "I don't lower myself with such frivolities."

 carnival.1007.juggling_success.tt.toast: "Successfully juggled"
 carnival.1007.juggling_fail.tt.toast: "Dropped the balls"
 carnival.1007.juggling_athletic.tt.toast: "Juggling is a good way to train the body and senses"
 carnival.1007.juggling_k.success.tt.toast: "Successfully juggled knives"
 carnival.1007.juggling_k.fail.tt.toast: "Cut yourself while juggling knives"

 carnival.1007.blademaster.log_title: "Fascination With Blades"
 carnival.1007.blademaster.log: "[carnival_main.GetFirstNameNoTooltip] has gained a fascination for playing with sharp blades after juggling with knives"
 
 ## Event - A wild dance	
 carnival.1008.t: "A Wild Dance"
 carnival.1008.desc: "The central plaza is a sea of masked dancers, music mixing with laughter. Strangers meet and are separated again as partners come and go in the twirling dance.\n\nAs I stand on the edge of the plaza the atmosphere is contagious!"
 carnival.1008.a: ""I shall reward the finest dancers with gold!""
 carnival.1008.b: "DANCE, DANCE – until my legs give out!"
 carnival.1008.c: "Let the dance lead me wherever it will."
 carnival.1008.d: "Just enjoy the moment."

 carnival.1008.strong.tt.toast: "Dancing legs"
 carnival.1008.exhausted.tt.toast: "The dance exhausted you!"
 carnival.1008.hurt.tt.toast: "Hurt yourself dancing!"

 ## Event - A drink with a craftsman 
 carnival.1009.t: "A Drink With a Master [craftsman_character.Custom('CraftsmanDescOption')]"
 carnival.1009.desc: "In one of the fine establishments on the street of [craftsman_character.Custom('CraftsmanDescOption')|l]s, I fall into conversation with a master craftsman.\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.GetSheHe|U] is shocked to meet the [carnival_host.GetTitleAsNameNoTooltip] in person."
 carnival.1009.1_b.desc: "Safe behind my mask, I am sure that [craftsman_character.GetSheHe] does not realize who I am."
 carnival.1009.2_a.desc: "I listen with interest as [craftsman_character.GetSheHe] complains about bad city management, blaming the [carnival_host.GetTitleAsNameNoTooltip] for the state of [craftsman_character.GetHerHis] trade."
 carnival.1009.2_b.desc: "I listen with interest as [craftsman_character.GetSheHe] praises the [carnival_host.GetTitleAsNameNoTooltip] for the good management of the city and lifts a tankard to [carnival_host.GetHerHis] good health."
 carnival.1009.2_c.desc: "Being quite happy with the good management of the city, [craftsman_character.GetSheHe|l] lavishes praise on me."
 carnival.1009.2_d.desc: "[craftsman_character.GetSheHe|U] grows quiet and then sullenly says that things have been a bit hard as of late."
 carnival.1009.a: "I will take this to heart and redouble my efforts."
 carnival.1009.b: "I will send the guards to make an example of this churl."
 carnival.1009.c: ""Then you deal with it, councilor!""
 carnival.1009.d: "I need to reveal who I am and promise to do better for the city."
 carnival.1009.e: "The first honest praise I have heard in months."
 carnival.1009.f: "I knew it! No need to stress about city business."
 carnival.1009.g: "Just as expected. I should raise a statue in my own honor."
 carnival.1009.h: "Convince the [craftsman_character.Custom('CraftsmanDescOption')] to speak their mind"
 carnival.1009.i: ""Hidden forces are undermining our republic, friend.""
 carnival.1009.j: ""Surely I deserve a reward for all my hard work?""
 carnival.1009.k: ""The entire republic can take credit for our good fortune!""
 carnival.1009.l: "I nod my head and keep gulping down my [ROOT.Char.Custom('RegionalDrink')]."
 carnival.1009.m: "I did not come here to prattle, but to fight!"
 carnival.1009.n: ""Teach me something about your trade, good [craftsman_character.Custom('CraftsmanDescOption')|l]!""
 carnival.1009.o: "Recruit the master through a middleman."
 carnival.1009.p: ""Drink's on me, friend.""

 custom.carnival.1009.spreading_ill_rumors: "Every [courtier|E] of Different [culture|E] or [faith|E]"
 custom.carnival.1009.shared_praise: "Every [courtier|E]"

 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U] gained an #V Artisan#! [inspiration|E]"

 carnival.1009.drunk.tt.toast: "You lose yourself to drink"
 carnival.1009.tasty.tt.toast: "Mmm, tasty!"
 carnival.1009.skillup.tt.toast: "You learned from the master craftsman"
 carnival.1009.patron.tt.toast: "Gained an associate"

 carnival.1009.councilor.log_title: "New Councilor"
 carnival.1009.councilor.log: "[craftsman_character.GetShortUIName|U] was appointed as [councillor|E]"
 carnival.1009.recruiting.log_title: "Recruited Master [craftsman_character.Custom('CraftsmanDescOption')|U]"
 carnival.1009.recruiting.log: "[craftsman_character.GetShortUIName|U] was recruited by [carnival_main.GetFirstNameNoTooltip]"
 carnival.1009.learning_trade.log_title: "Learned From a Master Craftsman"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip] gained some knowledge from a master [craftsman_character.Custom('CraftsmanDescOption')|l]"

