 ## Event - The Arrow
 carnival.1021.t: "The Arrow"
 carnival.1021.desc: "My vantage point is quiet, except the creaking of wood, and the sound of the street gently drifting in through the window shutters. Outside, in the courtyard below, my target [murder_victim.GetFirstNameNoTooltip] is unaware of my gaze - or the [SCOPE.Custom('UniqueBowOrJustBow')] by my side.\n\nI have brought along a hired thug, [bandit_01.GetFirstNameNoTooltip], in case I need an extra pair of hands.\n\nAs I pull the bow string, [murder_victim.GetFirstNameNoTooltip] looks up, [murder_victim.GetHerHis] eyes searching the windows!"
 carnival.1021.a: "Take the shot before he sees me."
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip], take the shot. I will secure the escape route."
 carnival.1021.c: "Duck down. We need to wait for a better opportunity."

 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip] kills the wrong person"

 carnival.1021.tt.arrow.hit.desc: "The arrow hits your target"
 carnival.1021.tt.arrow.miss.desc: "The arrow misses and the target sees you"
 carnival.1021.tt.thug.arrow.hit.desc: "The arrow hits your target"
 carnival.1021.tt.thug.arrow.miss.desc: "The arrow hit the wrong target"

 carnival.1021.tt.arrow.hit.toast: "The arrow struck the target"
 carnival.1021.tt.arrow.miss.toast: "The arrow missed the target and you are spotted!"
 carnival.1021.tt.thug.arrow.hit.toast: "The thug's arrow struck the target"
 carnival.1021.tt.thug.arrow.miss.toast: "The thug's arrow struck the wrong target!"

 carnival.1021.arrow.log_title: "Unknown Archer"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip] was slain by an unknown archer's arrow"
 
 ## Event - Procession of My Own 
 carnival.1022.t: "Procession of My Own"
 carnival.1022.desc: "The city pays for the Carnival, for the benefit of all and while there is gold enough for adequate diversions, an enterprising citizen of means could bolster the splendor of our festivities.\n\nWere I to make a contribution, my peers might look upon me green with envy, and in the eyes of my lessers I would shine like a patrician of old. Yes, just think, those grandees of ancient city-states made their wealth known! Were I to sponsor a glorious procession, my name would live on everyone's lips!\n\n #BOLD But what should be the theme?#!"
 carnival.1022.a: "A #BOLD beautiful#! procession that honors my achievements!"
 carnival.1022.b: "An #BOLD intimidating#! procession to instill fear and respect!"
 carnival.1022.c: "A #BOLD religious#! procession to show my piety!"
 carnival.1022.d: "On second thought, I got better ways to spend my gold."

custom.carnival.1022.guestopinion: "Every Guest at the Carnival"
custom.zealot_carnival.1022.guestopinion: "Every [GetVassalStance( 'zealot' ).GetTextIcon] Guest at the Carnival"
 
 ## Event - Legacy in marble
 carnival.1023.t: "A Legacy in Marble"
 carnival.1023.desc: "From childhood I have heard stories of the ancient city states. The patricians were great patrons of the arts. While the grand buildings of the glorious past now lie in ruin, their art and beauty still inspire. By sponsoring artists I can elevate my name into this august company.\n\nImagine: my reputation persisting beyond this mortal coil!\n\nLet the people behold beauty clad in marble, stone, and wood, painted in all the colors of the rainbow! For the glory of the [Glossary( '#bold Patria#!', 'carnival_patria_GLOSS' )], the veneration of our ancestors, and the prestige of House [ROOT.Char.GetDynastyHouseName]!"
 carnival.1023.a: "Sponsor a competition for young artists"
 carnival.1023.b: "Commission new frescos and decorations for a public square."
 carnival.1023.c: "Order a set of statues, showing the founders of the city."
 carnival.1023.d: "Wait, art is this expensive!?"
 
 ## Event - Whispers behind the mask
 carnival.1024.t: "Whispers Behind the Mask"
 carnival.1024.desc: "In the swirling revelry of the carnival, lines blur, and people lose their sense of propriety. You never know who the masked person next to you truly is, or what they will remember.\n\n[hook_target.GetTitledFirstNameNoTooltip] has lost themselves to excess. Spending the evening dancing with anyone that catches [hook_target.GetHerHis] eye; drinking and eating as if there is no tomorrow. Laughing and talking without a care for who is listening. Dancing very close to an outright scandal, completely unaware of me #BOLD watching from behind my mask.#!\n\n #BOLD I could spare [hook_target.GetHerHim] the embarrassment, or use it against [hook_target.GetHerHim], putting [hook_target.GetTitledFirstNameNoTooltip] in my debt.#!"
 carnival.1024.a: "I will keep a friendly eye on [hook_target.GetHerHim]."
 carnival.1024.b: "Sure would be a shame if someone held this over [hook_target.GetHerHim] later."
 carnival.1024.c: "Better send a friendly warning to [hook_target.GetHerHis] House."
 carnival.1024.d: "Let [hook_target.GetTitledFirstNameNoTooltip] make [hook_target.GetHerHis] own mistakes."

 carnival.1025.t: "Trinkets and Fantastic Beasts"
 carnival.1025.into_desc: "I find myself in front of a foreign merchant's stand. Strange items from far and wide are laid out, not to mention the cages that are on display, holding exotic beasts. The sounds and smells of this menagerie are something else.\n\n"Come take a look, one and all! Wondrous things I have to sell!" the merchant cries and gestures to [merchant_character.GetHerHis] stock.\n\n"[merchant_trinket.GetName] of high quality; and [merchant_creature.Custom('GetCarnival1025PitchArticle')] [merchant_creature.GetName] —"
 carnival_1025_creature_lion_desc: "African Manticore - fierce man-eater of legend.""
 carnival_1025_creature_caracal_desc: "tiny but fierce!""
 carnival_1025_creature_lynx_desc: "it can run up a tree in seconds and its urine creates crystals with magic properties!""
 carnival_1025_creature_tiger_desc: "fierce man-eater of Persian legend!""
 carnival_1025_creature_leopard_desc: "as spoken of in ancient texts!""
 carnival_1025_creature_bear_desc: "it can stand on its forelegs and juggle stones the size of a man's head!""
 carnival_1025_creature_elephant_desc: "created by a mad alchemist!""
 carnival_1025_creature_peacock_desc: "born from flames!""
 carnival_1025_creature_parrot_desc: "it can talk and sing hymns!""
 carnival_1025_creature_cockatoo_desc: "rare indeed!""
 carnival_1025_creature_crane_desc: "see how gracefully it moves!""
 carnival_1025_creature_monkey_desc: "from the pits of hell!""
 carnival.1025.a: ""Amazing, I will take the trinket""
 carnival.1025.b_1: ""Miraculous, I will procure the beast""
 carnival.1025.b_2: ""Pretty sure that is just [merchant_creature.Custom('GetCarnival1025RealBeastArticle')] [merchant_creature.Custom('GetCarnival1025RealBeastName')] though.""
 carnival.1025.c: "At least looking is free."
 carnival.1025.embarrassed_merchant: "Merchant gives you a discount out of embarrassment."
