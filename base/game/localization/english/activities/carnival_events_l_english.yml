 ## Event - the duel
 carnival.1010.t: "The Duel"
 carnival.1010.desc: "Two masked strangers are squared up as the crowd is making space for the combatants to circle each other — blades drawn! The hatred in their eyes indicate that they intent to do more than just draw some blood."
 carnival.1010.a.desc: "\n\nI remain just another mask in the crowd."
 carnival.1010.b.desc: "Having been noticed, the crowd waits to see if I will intervene."
 carnival.1010.a: "Call for the guards to break up the duel."
 carnival.1010.b: "Convince them to stop."
 carnival.1010.c: "Order them to stop."
 carnival.1010.d: "Let the duel proceed."

 cooltip.carnival.1010_duel_diplomacy_success: "You stop the duel"
 cooltip.carnival.1010_duel_diplomacy_fail: "You fail to stop the duel"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName] loses the duel and might be wounded or killed."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName] loses the duel and might be wounded or killed."

 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName] wins the duel"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName] wins the duel"
 carnival.1010_duel_guards_success.desc: "Guards come running"
 carnival.1010_duel_guards_fail.desc: "The guards are too late"

 carnival.1010_duel_guards_success_toast: "The guards break up the duel"
 carnival.1010_duel_guards_failure_toast: "The guards are too late to stop the duel"
 carnival.1010_duel_diplomacy_success_toast: "You stopped the duel"
 carnival.1010_duel_diplomacy_fail_toast: "You failed to stop the duel"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName] was wounded in the duel"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName] was killed in the duel"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName] was wounded in the duel"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName] was Killed in the duel"

 carnival.1010.duel_stop.log_title: "Stopped a Duel"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip] stopped a duel between [duelist_01.GetFirstNameNoTooltip] and [duelist_02.GetFirstNameNoTooltip]"
 carnival.1010.duel_continue.log_title: "Failed to Stop a Duel"
 carnival.1010.duel_continue.log: "[carnival_main.GetShortUIName|U] tried but failed to stop a duel between [duelist_01.GetShortUIName] and [duelist_02.GetShortUIName]"

 ## Event - Gracious Host
 carnival.1011.t: "Gracious Host"
 carnival.1011.desc: "A carnival is an excellent opportunity to show off my wealth and taste, opening the gates of my palace to the people. While discussing this with [house_member01.GetFirstNameNoTooltip], I ponder who to invite. [house_member01.GetSheHe|U] has some good suggestions. But the final decision is mine. "
 carnival.1011.a: "Decorate the entire palace, spare no expense!"
 carnival.1011.b: "Open the gates to the poor!"
 carnival.1011.c: "Invite only the most eminent guests!"
 carnival.1011.d: "Keep it to the extended family only."
 
 ## Event - Puppet theater
 carnival.1012.t: "Puppet Theater"
 carnival.1012.desc: "The commoners love their puppet theaters, gawking at slapstick and bawdy plays. Grotesque puppets carved in parody of all walks of life; fornicating, fighting, bickering and getting up to all kinds of improbable situations.\n\nThe carnival of [carnival_location.GetName] has attracted a host of these puppeteers, and while the people adore them, the [carnival_host.GetFaith.PriestNeuterPlural] are worried about the low-brow nature of the entertainment."
 carnival.1012.a: "I will attend the shows in secret."
 carnival.1012.b: "Bribe a show to put on my own play!"
 carnival.1012.c: "I will openly attend the shows!"
 carnival.1012.d: "Discreetly censure the entertainers behind the scenes."
 carnival.1012.e: "Forbid such vulgar displays."
 
 ## Event - The Mask Maker
 carnival.1013.t: "The Mask Maker"
 carnival.1013.desc: "Passing through a mostly deserted courtyard I chance upon an old [mask_maker.GetWomanMan] carving a mask. Next to [mask_maker.GetHerHim] is a stall full of [mask_maker.GetHerHis] work: row upon row of masks of all kinds.\n\nThe craftsmanship is truly exquisite."
 carnival.1013.a: "Buy everything and hand them out to everyone I meet!"
 carnival.1013.b: "Give the mask maker the funds to set up a workshop."
 carnival.1013.c: "Buy an exquisite mask for myself."
 carnival.1013.d: "Buy a terrifying mask for myself."
 carnival.1013.maskmaker_workshop.log_title: "Invested in Mask Maker's workshop"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName] helped a mask maker set up a workshop"
 
 ## Event - Holy Fools 
 carnival.1014.t: "Holy Fools"
 carnival.1014.desc: "A parody of a holy procession is making its way down the street. Costumes that caricature priests, monks, and even the highest leaders of our faith! The clergy are being mocked openly."
 carnival.1014_2.a.desc: "\n\nI remain hidden in the crowd."
 carnival.1014_2.b.desc: "\n\nPeople look to me for a reaction."
 carnival.1014.a: "Discreetly call for the guards to disperse this travesty."
 carnival.1014.b: "Condemn them for their sinfulness!"
 carnival.1014.c: "Join in the mockery."
 carnival.1014.d: "Slink away into the crowd."
 carnival.1014.e: "I have not laughed this hard in years!"

 cooltip.carnival.1014.non_believer: "#weak #EMP [stress|E] loss due to your Non-Believer [secret|E]#!#!""

 carnival.1014.secret.tt.toast: "You realize that you never believed in your heart"
 carnival.1014.mockery.tt.toast: "You feel both guilt and relief"
 
 ## Event - The Cat
 carnival.1015.t: "The Cat"
 carnival.1015.desc: "A tiny shadow has been following me all evening. Every corner I turn, there are two bright eyes and a raspy #EMP “mew”#! waiting for me.\n\n“Seems like you have made a friend,” [observer_01.GetTitledFirstName] points out and laughs, as the cat presses itself against my leg again."
 carnival.1015.a: "Seems like it was meant to be!"
 carnival.1015.b: "I’m sure they would like to stay with you more."
 carnival.1015.c: "[family_member01.GetTitledFirstName] could use a companion."
 carnival.1015.adopt_cat.log_title: "Adopted a Cat"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName] adopted a cat" 
 
 ## Event - Lover's mask
 carnival.1016.t: "A Lover's Mask"
 carnival.1016.desc: "As I wander the streets of [carnival_location.GetName], deep in the throes of celebration I hear music echoe in the alleys; as parties spill out from taverns into the streets. Everywhere Commoner and Patrician are rubbing shoulders, rank and privilige replaced by a mask.\n\nI feel a tap on my shoulder and behind me stands a masked [woo_character.GetWomanMan]. [woo_character.GetSheHe|U] strikes a dramatic pose, then giggles. As the stranger moves the mask aside for a second, I recognize [woo_character.GetNameNoTooltip].\n\n #EMP “Hello there, my [ROOT.Char.GetLadyLord]. Would you like to spend the evening with me? Just two masked strangers enjoying the carnival”#!, [woo_character.GetSheHe] says with an exaggerated courtly bow."
 carnival.1016.a: "What a delightful surprise! Lead the way, #EMP “stranger.”#!"
 carnival.1016.b: "I would love the company of a #BOLD friend.#!"
 carnival.1016.c: "And strangers we should remain."
 
 ## Event - In candle light 
 carnival.1017.t: "In Candlelight"
 carnival.1017.desc: "I find [intent_target.GetNameNoTooltip] in a quiet tavern. Outside, the carnival rages, but inside it is cozy – lit by candlelight. [intent_target.GetNameNoTooltip] is reading as I enter, [intent_target.GetHerHim] brow wrinkled in concentration.\n\nI am sure that some witty conversation will draw [intent_target.GetHerHim] attention to my charms."
 carnival.1017.a: "Impress [intent_target.GetHerHim] with my knowledge on literature."
 carnival.1017.b: "Make [intent_target.GetHerHim] forget the book with witty banter."
 carnival.1017.c: "Ask [intent_target.GetHerHim] if I can read the book after [intent_target.GetHerHim]."

 carnival.1017.a.tt.failure.desc: "Ah, a good book for a simple person"
 carnival.1017.a.tt.success.desc: "This reminds me of another book"
 carnival.1017.b.tt.success.desc: "Draw [intent_target.GetHerHis] attention away from the book"

 carnival.1017.a.tt.success.toast: "Your wide knowledge caught [intent_target.GetTitledFirstName]'s attention"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName] found you boring and pompous"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName] forgot all about the book"
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName]'s nose stays buried in [intent_target.GetHerHis] book"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName] found your wit less enticing than [intent_target.GetHerHis] book"
 carnival.1017.c.tt.toast: "You and [intent_target.GetTitledFirstName] grow closer discussing an interesting book"
 
 ## Event - Flowers & song 
 carnival.1018.t: "Love and Games"
 carnival.1018.desc: "A crowd has gathered in the square to watch competitions of strength and skill. Games like wrestling, foot races, tug-of-war are being played as the audience cheers. The atmosphere is jovial and friendly.\n\n[intent_target.GetTitledFirstName] seems impressed by the prowess on display. [intent_target.GetHerHis] eyes keep wandering toward [contender.GetTitledFirstName]. If I want to win [intent_target.GetHerHis] favor, I will need to best [contender.GetHerHim] somehow."
 carnival.1018.a: "I will crush [contender.GetHerHim] in the wrestling ring!"
 carnival.1018.b: "Maybe [contender.GetSheHe] could be convinced to take a fall?"
 carnival.1018.c: "Ridicule [contender.GetHerHim] in front of [intent_target.GetTitledFirstNameNoTooltip]"
 carnival.1018.d: "I don't feel like entering this competition."

 carnival.1018.a.success.desc: "You best [contender.GetTitledFirstNameNoTooltip]"

 carnival.1018.a.success.toast: " [intent_target.GetTitledFirstNameNoTooltip] is impressed by your prowess"
 carnival.1018.a.failure: "You are knocked on your posterior"
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip] forgets that you exist"
 carnival.1018.b.success: "You manage to make it seem real"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip] hails you as the champion"
 carnival.1018.b.failure: "The contest is obviously staged"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip] calls you a fraud"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip] is amused and charmed"
 
 ## Event - A mask in the crowd 
 carnival.1019.t: "Masks in the Crowd"
 carnival.1019.desc: "I keep seeing the same mask in the crowd. As I move through the street, the same frozen visage of a grinning fool seems to hover at the edge of my vision. Appearing again and again in the river of masks. Am I being followed? The thought alone puts ice in my veins.\n\nI exit the thoroughfare and the masked men follow. I am sure that they intend to do me harm!"
 carnival.1019.a: "Prepare an ambush."
 carnival.1019.b: "Lure them towards a guard squad."
 carnival.1019.c: "Scream for help."

 cooltip.carnival.1019.tt.assassination_success: "You kill your attacker"
