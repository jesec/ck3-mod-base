 ## Event - Dead End
 carnival.1111.t: "Dead End"
 carnival.1111.desc: "As I struggle with one of the assassins, I feel a pain in my neck as his partner stabs me from behind. The ground rushes up to meet me as I fall. Strength leaves my limbs, and my ragged breath leaves bloody bubbles on my lips."
 carnival.1111.a: "It was not supposed to end like this."
 
