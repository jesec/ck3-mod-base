 #Food and drink glosses
 ABALONE_GLOSS: "一种肉质肥厚紧实的珍贵贝类。"
 SEA_CUCUMBER_GLOSS: "一种柔软的海洋生物，在中国的高级烹饪中被当作一道佳肴。"
 SWALLOW_NEST_GLOSS: "一种能熬进奢华汤品的稀有鸟巢。"
 ENTREMETS_GLOSS: "一道精心制作的甜食或惊喜菜肴，在两道主菜间被端上桌。"
 MOCHI_GLOSS: "一种耐嚼的糯米糕。"
 DURIAN_GLOSS: "一种大型热带水果，以其浓郁的香气和丰富的像蛋奶羹一样黏糊的果肉而闻名。"
 AQUA_VITAE_GLOSS: "烈性蒸馏酒，被视作一种药用饮品。"
 TRIBUTE_CHILLED_TEA_GLOSS: "冰镇的上等茶，作为宫廷礼物送出。"
 EMPEROR_TEA_GLOSS: "专供宫廷最优质的皇家茶叶。"
 BAIJIU_GLOSS: "一种浓郁的中国烈酒，用粮食蒸馏得来。"
 HANAKUSA_GLOSS: "一种日本用花朵和叶子混合冲泡的草药饮品。"
 PEARL_POWDER_GLOSS: "用作昂贵补品的磨碎珍珠。"
 CHRYSANTHEMUM_BEER_GLOSS: "一种菊花风味的淡爽啤酒。"
 SHARBAT_GLOSS: "一种加糖的水果饮品，通常冰镇并添加香料。"
 SAMBUSA_GLOSS: "一种填满加香料的肉或蔬菜馅的油酥糕点。"
 PAKHALA_GLOSS: "一道来自印度东部用发酵米汤制成的清凉菜肴。"
 PILAU_GLOSS: "用香料和肉或蔬菜烹制的调味米饭。"
 PASTILLA_GLOSS: "一种马格里布派：薄薄的油酥面皮内包裹着加香料的肉馅。"
 BOTUO_GLOSS: "一种源自中国的厚实小麦面片汤。"
 SPHOUNGATA_GLOSS: "一种用打散的鸡蛋做的拜占庭风味煎蛋卷。"
 TARICHOS_GLOSS: "腌咸鱼，一道拜占庭主食。"
 BING_GLOSS: "一种中国的薄饼或烙饼。"
 MANTOU_GLOSS: "一种中国暄软的蒸制小麦圆糕点。"
 ZOSUI_GLOSS: "一种日本的米粥，用高汤烹制。"
 KIMCHI_GLOSS: "用盐和香料发酵的高丽蔬菜。"
 BUBUR_GLOSS: "一种末罗瑜群岛的米粥。"
