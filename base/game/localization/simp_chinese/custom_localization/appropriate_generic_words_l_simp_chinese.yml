 #Food and drink glosses
 ABALONE_GLOSS: "一种肉质肥厚紧实的珍贵贝类。"
 SEA_CUCUMBER_GLOSS: "一种柔软的海洋生物，在中国的高级烹饪中被当作一道佳肴。"
 SWALLOW_NEST_GLOSS: "一种能熬进奢华汤品的稀有鸟巢。"
 ENTREMETS_GLOSS: "一道精心制作的甜食或惊喜菜肴，在两道主菜间被端上桌。"
 MOCHI_GLOSS: "一种耐嚼的糯米糕。"
 DURIAN_GLOSS: "一种大型热带水果，以其浓郁的香气和丰富的像蛋奶羹一样黏糊的果肉而闻名。"
 AQUA_VITAE_GLOSS: "烈性蒸馏酒，被视作一种药用饮品。"
 TRIBUTE_CHILLED_TEA_GLOSS: "冰镇的上等茶，作为宫廷礼物送出。"
 EMPEROR_TEA_GLOSS: "专供宫廷最优质的皇家茶叶。"
 BAIJIU_GLOSS: "一种浓郁的中国烈酒，用粮食蒸馏得来。"
 HANAKUSA_GLOSS: "一种日本用花朵和叶子混合冲泡的草药饮品。"
 PEARL_POWDER_GLOSS: "用作昂贵补品的磨碎珍珠。"
 CHRYSANTHEMUM_BEER_GLOSS: "一种菊花风味的淡爽啤酒。"
 SHARBAT_GLOSS: "一种加糖的水果饮品，通常冰镇并添加香料。"
 SAMBUSA_GLOSS: "一种填满加香料的肉或蔬菜馅的油酥糕点。"
 PAKHALA_GLOSS: "一道来自印度东部用发酵米汤制成的清凉菜肴。"
 PILAU_GLOSS: "用香料和肉或蔬菜烹制的调味米饭。"
 PASTILLA_GLOSS: "一种马格里布派：薄薄的油酥面皮内包裹着加香料的肉馅。"
 BOTUO_GLOSS: "一种源自中国的厚实小麦面片汤。"
 SPHOUNGATA_GLOSS: "一种用打散的鸡蛋做的拜占庭风味煎蛋卷。"
 TARICHOS_GLOSS: "腌咸鱼，一道拜占庭主食。"
 BING_GLOSS: "一种中国的薄饼或烙饼。"
 MANTOU_GLOSS: "一种中国暄软的蒸制小麦圆糕点。"
 ZOSUI_GLOSS: "一种日本的米粥，用高汤烹制。"
 KIMCHI_GLOSS: "用盐和香料发酵的高丽蔬菜。"
 BUBUR_GLOSS: "一种末罗瑜群岛的米粥。"
 #Oldest record of the word: Codex diplomaticus Caietanus, 997 - https://en.wikipedia.org/wiki/History_of_pizza
 PIZZA_GLOSS: "一种南意大利的扁圆饼，在番茄从美洲传入之前就早已存在。根据997年加埃塔的一份租约，一名佃户需向主教在圣诞节缴纳十二张，在复活节又交出十二张。"
 #Vaddaradhane, c. 920 - https://en.wikipedia.org/wiki/Idli
 IDLI_GLOSS: "一种来自印度南部的用黑吉豆面糊制成的糕饼。在一部约公元920年的羯罗拿吒语故事集中，已经用“逸荼利祇”这个名字来称呼它。"
 #Etienne Boileau, Livre des metiers - https://en.wikipedia.org/wiki/Oublie
 OUBLIE_GLOSS: "一种在热烙模具中烘烤后卷起来的薄脆饼。到十三世纪六十年代，巴黎已经有了专门制作这种薄饼的行会，会内商贩会在夜里沿街叫卖他们的这种货品。"
 BLIN_GLOSS: "一种用饼铛热着吃的薄煎饼，在四旬斋前的盛宴上堆成了堆。"
 #https://en.wikipedia.org/wiki/Obwarzanek_krakowski
 OBWARZANEK_GLOSS: "一圈面团先煮后烤，串在绳子上出售。克拉科夫将其称作“奥布瓦扎内克”，在1394年以前，王室宫廷就已经在采购这种食物了。"
 #Pogača, from Latin focacia - https://en.wikipedia.org/wiki/Poga%C4%8Da
 POGACA_GLOSS: "一种壁炉灰烬中烘烤出来的圆面饼，这一名称源自拉丁语“福卡恰”，义为壁炉面包。"
 FUL_GLOSS: "慢火久炖的蚕豆，是埃及城镇里的日常食物。"
 INJERA_GLOSS: "一种用发酵苔麸制成的宽大松软的面饼，既可以当盘子，也可以当勺子用。"
 #Narezushi, the fermented form of sushi before the Edo period - https://en.wikipedia.org/wiki/Narezushi
 NAREZUSHI_GLOSS: "把鱼肉裹进加盐的米饭中，放几个月后变酸。刮去米饭，只食鱼肉。"
 AKARA_GLOSS: "将磨碎的黑眼豆放棕榈油中煎炸而成。"
 FURA_GLOSS: "粟面团经过蒸煮，捣成团，再拌进酸牛奶里。"
 TSAMPA_GLOSS: "炒青稞面，加入黄油揉成团，用手指拿着吃。"
 #William of Rubruck, Itinerarium (1253-1255), on the dried curds he calls grut - https://en.wikipedia.org/wiki/Aaruul
 AARUUL_GLOSS: "凝乳在阳光下晒干晒硬，每次旅途的必备之物。1253年，鲁布鲁克的威廉在蒙古人之中见到过这种食物。"
