 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "你的恶行从爱尔兰到契丹无人不知，无人不晓。"
 greeting_supplimentary.negative.greek: "你下贱的品行有如希腊戏剧的主角一般。"
 greeting_supplimentary.negative.insult.1: "愿你的体液在躯体里朽烂。"
 greeting_supplimentary.negative.insult.2: "愿你的一生短暂而不幸。"
 greeting_supplimentary.negative.insult.3: "愿智慧永远弃你而去。"
 greeting_supplimentary.negative.insult_muslim.1: "诅咒你的七代祖宗。"
 greeting_supplimentary.negative.insult_muslim.2: "愿你活活被缝进死骆驼的肚子里。"
 greeting_supplimentary.negative.insult_muslim.3: "愿安拉降灾于你全家。"
 greeting_supplimentary.negative.insult_muslim.4: "你这条污秽的狗杂种。"
 greeting_supplimentary.negative.insult_muslim.5: "愿胡狼为你的曝骨而争。"
 greeting_supplimentary.negative.insult_muslim.6: "愿你的水井被沙子填满，帐篷里爬满蝎子。"
 greeting_supplimentary.negative.insult_christian.1: "愿诸圣弃绝你的事业。"
 greeting_supplimentary.negative.insult_christian.2: "你的名字将从所有祈祷中被抹去。"
 greeting_supplimentary.negative.insult_norse.1: "愿你的祖先唾弃你的阴魂。"
 greeting_supplimentary.negative.insult_norse.2: "你的勇气比冬日的薄冰还要脆弱。"
 greeting_supplimentary.negative.insult_byzantine.1: "连君士坦丁堡的老鼠都躲避你的臭味。"
 greeting_supplimentary.negative.insult.4: "愿你的田亩荒芜，井水枯竭。"
 greeting_supplimentary.negative.insult.unreliable_swine: "你这不可靠的猪。"
 greeting_supplimentary.negative.insult.oathbreaker: "你是背信弃义的骗子。"
 greeting_supplimentary.negative.insult_jewish.1: "愿你的名字从生命册上被抹去。"
 greeting_supplimentary.negative.insult_zoroastrian.1: "愿黑暗扼杀你所守护的火焰。"
 greeting_supplimentary.negative.insult_hindu.1: "你已远离正道——我必将使你离得更远。"
 greeting_supplimentary.negative.insult_christian.3: "愿地狱张开大口将你吞噬。"
 greeting_supplimentary.negative.insult_norse.3: "乌鸦将尽情享用你的尸体。"
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "祝你和你的家人平安。"
 greeting_supplimentary.positive.flattery.2: "你的智慧与仁德广为传颂。"
 greeting_supplimentary.positive.flattery.3: "祝你平安。"
 greeting_supplimentary.positive.flattery.4: "祝你生活平静充实。"
 greeting_supplimentary.positive.flattery.5: "你的冷酷令人羡慕。"
 greeting_supplimentary.positive.flattery.6: "你的品味十分出色，享誉世界。"
 greeting_supplimentary.positive.flattery.7: "你的名声早已无人不知无人不晓。"
 greeting_supplimentary.positive.flattery.8: "愿你的血脉传承千年。"
 greeting_supplimentary.positive.flattery.9: "愿神保佑你持剑的手臂强健有力。"
 greeting_supplimentary.positive.flattery.10: "愿和平与富足降临你的家族。"
 greeting_supplimentary.positive.flattery.11: "愿幸运眷顾你的旗帜。"
 greeting_supplimentary.positive.flattery_chinese.1: "愿你福祚绵长，得天眷命。"
 greeting_supplimentary.positive.flattery_chinese.2: "愿你民康物阜，繁荣昌盛。"
 greeting_supplimentary.positive.flattery_chinese.3: "愿你身康体健，享国千秋。"
 greeting_supplimentary.positive.flattery_norse.1: "愿诸神赐予你顺风与肥牛。"
 greeting_supplimentary.positive.flattery_byzantine.1: "愿城市的荣光照耀你的家族。"
 greeting_supplimentary.positive.flattery_jewish.1: "愿神保佑你的家族平安。"
 greeting_supplimentary.positive.flattery.12: "你的智慧是寻求建议之人的光。"
 greeting_supplimentary.positive.flattery.13: "愿天国保佑你。"
