 situation_guelph_ghibelline_phase_ad_interim_desc_short: "该[GetSituation('guelph_ghibelline').GetName][situation_phase|E]是局势的转折点，[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName]与[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName]将决定下一阶段是进入[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]还是[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]……\n\n$precursor_situation_leader_help$"
