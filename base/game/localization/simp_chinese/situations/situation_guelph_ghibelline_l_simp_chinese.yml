 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "这一[GetSituation('guelph_ghibelline').GetName][situation_phase|E]是之前的[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]阶段的升级版。\n\n现在，君主与其神权封臣的关系强化，因为一方面封臣对于$religiousheadname_pope$宣称拥有普世最高权力举棋不定，另一方面其领主也希望维持其最高权威。\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "大约[Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V][Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), '年', '年' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), '个月', '个月' ) )]后，局势将升级，进入[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]或[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName][situation_phase_phase|E]"
