 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "[GetSituation('guelph_ghibelline').GetName][situation|E]中[guelphs|E]的领袖。\n\n在[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]和[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]序幕[situation_phase|E]中，$religiousheadname_pope$领导[guelphs|E]，斗争随历史路线升级。只有当序幕阶段过渡到公开冲突后，领袖自身的[decisions|E]才可用。$gg_leader_group_help$"
