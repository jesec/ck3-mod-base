 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "[GetSituation('guelph_ghibelline').GetName][situation|E]中[ghibellines|E]的领袖。\n\n在[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]和[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]序幕[situation_phase|E]中，[GetTitleByKey('e_hre').GetName]统治者领导[ghibellines|E]，斗争随历史路线升级。只有当序幕阶段过渡到公开冲突后，领袖自身的[decisions|E]才可用。$gg_leader_group_help$"
