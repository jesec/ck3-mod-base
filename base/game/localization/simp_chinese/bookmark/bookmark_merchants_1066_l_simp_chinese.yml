l_simp_chinese:
 bm_1066_merchants: "生财有道"
 bm_1066_merchants_desc: "一片领地想要兴旺，不仅需要自给自足，还要让商品持续流动起来。毕竟，统治者不能只靠出身就打赢大战——真正支撑军队的，是黄金换来的武器、补给和外援。\n\n每一笔生意、每一桩买卖背后都有商人的身影，他们的商队和船只沿着传奇的路线穿行。倘若不能得到应有的认可，他们便会自己开辟一块地方，建起一座新型城市，由其公民自行治理。\n\n#bold 当财富成为衡量权力的尺度时，你会带领你的家族支配市场，经营一个长存的贸易帝国吗？"
 bookmark_merchants_domenico_contarini: "多梅尼科·孔塔里尼"
 bookmark_merchants_domenico_contarini_subheading: "威尼斯总督"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "伊本·贾拉达"
 bookmark_merchants_ibn_jarada_subheading: "巴格达商人"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "孙忠"
 bookmark_merchants_sun_zhong_subheading: "明州商人"
 bookmark_merchants_sun_zhong_desc: "明州港，大宋连通东海的门户，孙忠正是让这里日夜不息的人。丝绸与瓷器自他的货仓启程，驶向日本与高丽，熏香与白银则循着海路源源而来。掌管往来货税的官员们已心知肚明：一份送得恰到好处的礼物，远比一纸如实参劾的奏章来得更实惠。\n\n#bold 丝绸之路东端的尽头是海港，而非陆上商队的辙迹。你能让孙氏一门，成为一股朝廷也无法左右的洪流吗？#!"
 bookmark_merchants_vitale_faliero: "维塔莱·法列罗"
 bookmark_merchants_vitale_faliero_subheading: "威尼斯贵人"
 bookmark_merchants_vitale_faliero_desc: "法列罗家族是威尼斯最具雄心的商人家族之一，而维塔莱已将其商会推向比竞争对手更遥远的东方。拜占庭的贸易路线、亚得里亚海的诺曼人压力以及城市议会中嫉恨的对手，从四面八方逼迫而来。\n\n#bold 威尼斯坐落在两个世界的十字路口。你能引领法列罗之名，驾御这两个世界？#!"
 bookmark_merchants_wuhsha_al_dallala: "“典当商”乌赫莎 "
 bookmark_merchants_wuhsha_al_dallala_subheading: "开罗典当商"
 bookmark_merchants_wuhsha_al_dallala_desc: "作为一名身家丰厚的女性，武赫莎·达拉拉对自己的财富和敌人都算得一清二楚。\n\n她独立的性情使她付出了被逐出犹太会堂的代价。但武赫莎懂得耐心静待时机，向那些亏待过她的人寻仇。\n\n#bold 你有能力利用贷款来羞辱你的对手吗？#!"
 bookmark_merchants_greek_salvidi_1: "希列·萨尔维迪"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "阿布‑赛义德"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "乌赫莎的儿子"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "捺吒罗·娑呼"
 bookmark_merchants_nattal_sahu_subheading: "德里的商贾王公"
 bookmark_merchants_nattal_sahu_desc: "在瑜祇尼补罗的市场里，娑呼的名号总能赢得尊重。捺吒罗是德里耆那教商人群体的首领，也是都摩罗王朝国王阿能伽波罗二世信任的顾问，他搭建起了一套贸易网络，从西部港口一直延伸到旁伽罗的各个集市。\n\n#bold 拥有国王的信任和商人的机敏，你能建立起某种比两者都更长久的东西吗？#!"
 bookmark_merchants_new_merchant_company: "自定义角色"
 bookmark_merchants_new_merchant_company_subheading: "丝路商人"
 bookmark_merchants_new_merchant_company_desc: "丝绸之路不属于帝王，它属于那些有足够胆量踏上它的人。\n\n在东西方交汇的十字路口，创建你自己的商会。一支商队接一支商队，筑起你的贸易帝国，从撒马尔罕的市集到地中海的港口，织就四通八达的联结。\n\n#bold 你家族的名号能在百城之间回响不息吗？#!"
