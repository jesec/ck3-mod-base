l_simp_chinese:
 bm_1178_merchants: "归尔甫派与吉伯林派"
 bm_1178_merchants_desc: "归尔甫派与吉伯林派之间的冲突由来已久。这场冲突始于11世纪末的续任权之争，已酝酿了一个世纪。\n\n随着腓特烈·巴巴罗萨成为凯撒，冲突升级，全意大利如今都在选边站队。吉伯林派支持皇帝，而归尔甫派支持罗马教宗。\n\n#bold 这场冲突既在意大利各共和国内部肆虐，也在它们之间肆虐。在这场冲突中选择你的阵营，并带领它走向胜利。#!"
 bookmark_merchants_1178_marco_sanudo: "马尔科·萨努多"
 bookmark_merchants_1178_marco_sanudo_subheading: "威尼斯贵人"
 bookmark_merchants_1178_enrico_dandolo: "恩里科·丹多洛"
 bookmark_merchants_1178_marco_sanudo_desc: "萨努多家族是威尼斯古老的贵族豪门之一，据传与传奇的坎迪亚诺家族有亲缘关系——后者在权势鼎盛时期曾有族人多次出任总督之职。\n\n马尔科是父亲去世后执掌家族的年轻子弟，他与舅父恩里科·丹多洛关系密切，而后者将作为第四次十字军东征的策划者载入史册。\n\n#bold 你能实现自己的命运，成为群岛公爵吗？#!"
 bookmark_merchants_1178_humbert_savoy: "萨伏依的翁贝托三世"
 bookmark_merchants_1178_humbert_savoy_subheading: "萨伏依公爵#b #bol （归尔甫派）#!#!"
 bookmark_merchants_1178_thomas_savoy: "托马斯"
 bookmark_merchants_1178_humbert_savoy_desc: "作为萨伏依公爵，翁贝托已证明自己的虔诚：他向当地修道院慷慨捐赠，并在第三任妻子去世后一度完全退出世俗生活。\n\n在站到归尔甫派一边后，他便与腓特烈·巴巴罗萨不和，其领地也屡遭占领和劫掠。\n\n#bold 你能保护萨伏依的领地免受凯撒侵害吗？#!"
 bookmark_merchants_1178_guido_guerra: "圭多·圭拉三世"
 bookmark_merchants_1178_guido_guerra_subheading: "卡森蒂诺伯爵#color_yellow #bol （吉伯林派）#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "里纳尔多"
 bookmark_merchants_1178_guido_guerra_desc: "圭迪家族数百年来一直是阿尔诺河上游区域的伯爵，托斯卡纳鲜有家族能宣称拥有比此更长的世系。\n\n圭多·圭拉一生效力于帝国：他曾参与围攻米兰，而巴巴罗萨的特权确认了他在亚平宁山脉两侧的城堡、权利与矿藏。\n\n#bold 你能让你的伯爵领载入史册吗？#!"
 bookmark_merchants_1178_speronella_dalesmanni: "斯佩罗内拉·达莱斯曼尼"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "帕多瓦贵人#b #bol （归尔甫派）#!#!"
 bookmark_merchants_1178_ezzelino_ii: "埃泽利诺·达罗马诺"
 bookmark_merchants_1178_pietro_iii: "彼得罗·特拉韦尔萨里"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "少年时，斯佩罗内拉被帕多瓦的皇帝代理帕加诺·德拉托雷绑架。当她最终被兄弟解救时，那位代理已被推翻；随着他的垮台，帕多瓦城成为自由公社。\n\n#bold 作为一名自由女性，你能将自己的传奇地位转化为政治权力或财富吗？#!"
 bookmark_merchants_1178_konrad_urslingen: "康拉德·冯·乌尔斯林根"
 bookmark_merchants_1178_konrad_urslingen_subheading: "斯波莱托公爵#color_yellow #bol （吉伯林派）#!#!"
 bookmark_merchants_1178_jutta_urslingen: "尤塔"
 bookmark_merchants_1178_konrad_urslingen_desc: "年轻的德意志公爵康拉德蒙在皇帝的授意下统治着意大利的斯波莱托公国。这里位于半岛中心，南北道路在此交汇。他的权威依赖于皇帝的恩宠，但皇帝却远在阿尔卑斯山彼端。\n\n#bold 你能将意大利半岛的腹地纳为己有，还是让民众拒绝你的统治呢？#!"
