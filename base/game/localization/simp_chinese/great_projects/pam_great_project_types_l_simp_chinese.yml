 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$：照射[province.GetNameNoTooltip]的彩光"
 pam_great_projects_events.0003.desc: "“#EMP 与光明结合之物，必然是光明的，而新光遍撒的宏伟工程，也是光明的。”#![religion_buddy.GetTitledFirstName]看到那在阳光下闪烁的雕花玻璃时说道。\n\n玻璃匠[glazier.GetTitledFirstName]已将[Glossary('熔色玻璃','POT_METAL_GLOSS')]碎片铺在刷白的桌面上，以便我们能更好地审视各色预期的设计方案。\n\n我宣布：“这个窗户要在中殿以及[province.GetNameNoTooltip]各处都能看到，它必须描绘……”"
 pam_great_projects_events.0003.a: "叶瑟之树，维系[ROOT.Char.GetDynastyNameNoTooltip]的正统。"
 pam_great_projects_events.0003.a.flavor: "[Glossary('叶瑟之树','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为以[travel|E]领袖身份造访的[dynasty|E]成员提供@dynasty_prestige_icon![dynasty_prestige|E]"
 pam_great_projects_events.0003.b: "带有你肖像和纹章的捐赠者镶板。"
 pam_great_projects_events.0003.b.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为造访者提供@prestige_icon![prestige|E]"
 pam_great_projects_events.0003.c: "朝圣神迹场景，为吸引远方的信徒。"
 pam_great_projects_events.0003.c.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为拥有[GetTrait('pilgrim').GetName( GetNullCharacter )][trait|E]的角色提供更多[trait_level_track_xp|E]"
 pam_great_projects_events.0003.d: "一扇圣母玛利亚彩窗，窗前点着一盏长明灯。"
 pam_great_projects_events.0003.d.flavor: "他应在[blessed_mary.GetTitledFirstName]的玻璃圣像前，日夜保持一盏油灯和蜡烛常明不熄。"
 pam_great_projects_events.0003.d.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会提供@stress_loss_icon![stress_loss|E]和[spiritual_fulfillment|E]"
