 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "只要资源充足，我们便能将主的光辉播撒，不止播撒于零散的异教徒，更要遍及所有的异教[realms|E]。藉由我们的教化，他们将习得最正确的[rite|E]，进而壮大[christendom|E]。"
 great_project_type_pam_mass_rite_conversion_desc_generic: "只要资源充足，我们便能将我们的信仰发扬光大，不再局限于零星皈依者，而是传入敌对[faiths|E]势力盘踞的整片[realms|E]。依靠我们的引导教化，当地民众将皈依正统[rite|E]，使我们的影响力遍及四方各地。"
