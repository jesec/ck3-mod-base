l_simp_chinese:
 great_project_type_pam_cathedral_01: "建造一座$building_type_great_project_cathedral_01$"
 great_project_type_pam_cathedral_01_desc: "将璀璨的圣十字架，矗立在坚厚石墙之上、庄严穹顶与巍峨高塔之巅！引天国的皎洁圣光降临尘世，辉耀在圣职教长的宝座与祭台。\n\n历经多年的辛劳营建，一座伟大的灯塔将向远近的信徒发出光芒。"
 great_project_type_pam_cathedral_02: "建立$building_type_great_project_cathedral_02$"
 great_project_type_pam_cathedral_02_desc: "让尖拱升腾，让彩窗闪耀！\n\n如同拉撒路一般，这座高贵的主教座堂将重获新生，引领我们进入新时代。"
 great_project_type_pam_cathedral_03: "建立$building_type_great_project_cathedral_03$"
 great_project_type_pam_cathedral_03_desc: "愿那精美的石雕花窗与卷曲的石饰，化作圣洁火焰的王冠，宣告这座光辉久远的圣殿迎来新纪元！\n\n一场漫长的扩建会将现有的[GetBuilding('great_project_cathedral_02').GetName|V]升级为[GetBuilding('great_project_cathedral_03').GetName|V]，在末世之中引导信徒前行。"
