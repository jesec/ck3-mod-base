 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$：尖塔加冕"
 pam_great_projects_events.0020.desc: "终于，随着十字架被安放在尖塔之顶，每一座都如同当年基督在[Glossary('哥耳哥达','GOLGOTHA_GLOSS')]山上那样。它们矗立着，提醒我们祂为我们的救赎而受难，并应许每个安息日祂的宝血将流淌，净化我们的罪孽。\n\n自建造伊始，儿子成了父亲，父亲又成了埋入黄土的老人。然而他们崇高的辛劳、汗水与鲜血，已永存于石中。\n\n帝国可能倾覆，但[province.GetName]的[cathedral_building.GetName]将如天主之爱般永世长存。"
 pam_great_projects_events.0020.a: "从近处到远方，来我们身边敬拜吧！"
 GOLGOTHA_GLOSS: "各各他，源自拉丁语，意为#EMP “髑髅地”#!，是罗马时代耶路撒冷一座形似头颅的山丘，也是耶稣受难之地。处决发生在城墙外，距离祂被埋葬的墓穴不远。该地如今位于[GetBuilding('dome_of_the_rock_01').GetName|V]附近的圣墓教堂内。"
