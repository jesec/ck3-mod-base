 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$：[province.GetNameNoTooltip]的神圣壁画"
 pam_great_projects_events.0002.desc: "虽然司祭们得以研读上帝的话语，但真正向信众彰显主的真理与荣耀的，乃是圣像。\n\n如今，所需资金已经筹措到位，圣像画师也已齐聚一堂，我必须要做出决定，选用哪些经文章节来装点穹顶、墙壁以及天花板。"
 pam_great_projects_events.0002.a: "基督诞生时的三位贤士。"
 pam_great_projects_events.0002.b: "沙漠中的圣热罗尼莫与他的狮子。"
 pam_great_projects_events.0002.c: "亚巴郎与罗特出埃及而赴迦南。"
 pam_great_projects_events.0002.d: "荣福童贞玛利亚领报。"
 pam_great_projects_events.0002.e: "圣奥斯定之心因对主的认知而燃烧。"
 pam_great_projects_events.0002.f: "基督为宗徒濯足。"
 pam_great_projects_events.0002.mystic_xp: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为拥有[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]的角色提供更多[trait_level_track_xp|E]"
