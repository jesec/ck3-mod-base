 pam_great_projects_events.0003.e.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为狂热造访者提供@piety_icon![piety|E]和@stress_loss_icon![stress_loss|E]"
 pam_great_projects_events.0003.e.owner_msg.title: "玻璃中的殉道"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName]委托制作了一组关于殉道的彩色玻璃组画，用于[grand_cathedral|E]。该主题使你更加虔诚。"
 TREE_OF_JESSE_GLOSS: "叶瑟之树描绘了基督祖先的谱系，其形象从达味之父叶瑟斜卧的身躯中生长而出。教堂的彩色玻璃窗将圣经中的王室世系与当今在位的王朝相联系，以此表示君权神授。主要的范例见于沙特尔和圣但尼的大教堂。"
 POT_METAL_GLOSS: "熔色玻璃通过在熔炉中将金属氧化物加入玻璃料中搅拌进行着色，因此色泽贯穿整块玻璃板，而非仅停留在表面。玻璃大师将冷却后的玻璃板切割成小块，铺在刷白的木板上，以观察透光效果，然后再用铅框固定出窗面。"
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$：落下奠基石"
 pam_great_projects_events.0005.desc.intro: "第一块基石已然奠下！如同橡果孕育橡树，[owner.GetTitledFirstName]之座将成长为一座启迪人心的纪念碑。每一块石料、每一根梁木，都将[ROOT.Char.GetFaith.HighGodName]的荣耀辐射给[owner.GetPrimaryTitle.GetNameNoTier]及整个基督教世界中的所有[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]。\n\n[Select_CString(founder.IsLocalPlayer,'我',Select_CString(founder.IsFemale,'她','他'))|U]资助建造的慷慨之举，将随钟声回响，为每位信徒所传颂。"
 pam_great_projects_events.0005.desc.contributor: "\n\n尤其值得铭记的是，[optional_contributor.GetTitledFirstNamePossessive]所献的[contribution.GetName]，将令我们的[cathedral_building.GetName]更加不朽。"
 pam_great_projects_events.0005.desc.outro: "让这伟大工程开工吧！"
 pam_great_projects_events.0005.a: "“我们的子孙将见证它完工。”"
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$：依照神圣的秩序"
 pam_great_projects_events.0006.desc.intro_architect: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))][architect.GetFirstName]指向"
 pam_great_projects_events.0006.desc.intro_no_architect: "我望向"
 pam_great_projects_events.0006.desc.intro: "一系列木桩，木桩间以拉紧的绳索相连，勾勒出一座巨大十字架的轮廓——这是即将建造的十字形建筑的构想。"
 pam_great_projects_events.0006.desc.steward_founder: "\n\n我在学习时见过这个！\n\n“你一定是$pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n“但如何规划这样一座宏伟的建筑呢？”我问道。"
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n“我们$pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "运用了[Glossary('按正方形','AD_QUADRATUM_GLOSS')]系统！主为我们提供了神圣秩序；通过使用正方形，我们可以推断出比任何[ROOT.Char.Custom('ResidenceBuilding')]都更宏伟的建筑比例。”"
 pam_great_projects_events.0006.desc.foundations: "\n\n我看到地基的挖掘工作即将开始。"
 pam_great_projects_events.0006.a: "为[founder.GetDynastyNameNoTooltip]祖先挖一座地下墓穴。"
 pam_great_projects_events.0006.a.tt: "在[owner.GetShortUINamePossessive]的[cathedral_complex|E]建造一座[GetDomicileBuilding('cathedral_crypt_01').GetName|V]，用以纪念[founder.GetDynastyName][dynasty|E]"
 pam_great_projects_events.0006.b: "扩建中殿以容纳朝圣者。"
 pam_great_projects_events.0006.b.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为来访朝圣者提供更多[GetTrait('pilgrim').GetName( GetNullCharacter )][trait_level_track_xp|E]和@piety_icon![piety|E]"
 pam_great_projects_events.0006.c: "唯有天主能指引这一切。"
 AD_QUADRATUM_GLOSS: "拉丁语#EMP 按正方形#!。中世纪的石匠大师采用简单的比例系统来规划建筑场地。他们使用正方形边长与对角线的比例。以这两个长度为边的矩形，被视为形状和谐。以此为仅有的基础单位，石匠可以推导出一系列更大或更小的正方形和矩形，从而确保设计图中每个部分都能彼此衔接。"
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$：天空中起伏的肋拱"
 pam_great_projects_events.0007.desc.intro_architect: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))][architect.GetFirstName]领我穿过一片巨大的梁柱森林。主教座堂的脚手架本身就宛如一座木制的教堂，支撑着在石制拱顶上辛勤劳作的石匠们。"
 pam_great_projects_events.0007.desc.intro_no_architect: "我穿行于一片巨大的梁柱森林之中。主教座堂的脚手架本身就宛如一座独立的木制教堂，支撑着那些在拱顶上劳作的石匠们。"
 pam_great_projects_events.0007.desc.architect: "\n\n“一旦完工，这些拱顶将庇护信徒免受风雨侵袭，并将我们的祈祷引向高天。”"
 pam_great_projects_events.0007.desc.architect_says: "[architect.GetSheHe]说。"
 pam_great_projects_events.0007.desc.outro: "\n\n我的目光落在一处已完成的拱顶开间，它们让我想起吞下约纳的那条巨鱼的肋骨。天主的殿宇便是如此荣耀，既能引人潜入深海，亦能带人直上星辰。"
 pam_great_projects_events.0007.a: "用夜空装饰拱顶。"
 pam_great_projects_events.0007.a.tt: "[grand_cathedral|E]完工后，其[point_of_interest|E]会为拥有[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]的角色提供更多[trait_level_track_xp|E]"
 pam_great_projects_events.0007.b: "宣讲一场关于约纳式悔改的讲道。"
 pam_great_projects_events.0007.b.tt: "你的[faith|E]获得@fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#![fervor|E]"
 pam_great_projects_events.0007.c: "让石匠们继续干。"
 fervor_gain_cathedral_jonah_sermon: "在[grand_cathedral|E]建造时宣讲忏悔"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$：铸造天主之声"
 pam_great_projects_events.0008.desc.intro: "工程进展顺利，但这座主教座堂缺少一种声音，来召唤来自整个[owner.GetPrimaryTitle.GetNameNoTier]的信众。"
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName]告诉我我们必须造一口大铜钟！"
 pam_great_projects_events.0008.desc.no_architect: "\n\n我们必须铸造一口钟！"
 pam_great_projects_events.0008.desc.need_bell: "这是一项冒险且昂贵的工程；仅原材料一项支出便让[founder.GetPrimaryTitle.GetNameNoTier]的金库不堪重负。"
 pam_great_projects_events.0008.desc.plague_named: "\n\n遗憾的是，钟匠因[epidemic.GetName]丧生。"
 pam_great_projects_events.0008.desc.plague_generic: "\n\n遗憾的是，钟匠在近期的瘟疫中丧生。"
 pam_great_projects_events.0008.desc.outro: "其子[bell_maker_son.GetFirstName]向我保证，[bell_maker_son.GetHerHis]父亲在临终前将其中的秘密知识传给了[bell_maker_son.GetHerHim]，这口钟可以继续铸造。"
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName]，一位在当地师傅手下受训、雄心勃勃的年轻青铜匠，主动站了出来。[bell_maker_son.GetSheHe|U]渴望通过铸造一口配得上[owner.GetPrimaryTitle.GetNameNoTier]的[cathedral_building.GetName]的铜钟，来证明[bell_maker_son.GetHerHis]的价值。"
 pam_great_projects_events.0008.a: "要是他失败了，我就杀了他。"
 pam_great_projects_events.0008.a.tt: "如果铸钟失败，你会处决[bell_maker_son.GetShortUIName]"
 pam_great_projects_events.0008.belltower_may.tt: "可以在[owner.GetShortUINamePossessive]的[cathedral_complex|E]建造[GetDomicileBuilding('cathedral_belltower_02').GetName|V]"
 pam_great_projects_events.0008.aa: "要是他失败了，我就把他身上的肉剐下来。"
 pam_great_projects_events.0008.b: "他可以成为主的工具。"
 pam_great_projects_events.0008.b.tt: "你相信[bell_maker_son.GetShortUIName]能铸造这口钟"
 pam_great_projects_events.0008.b.flavor: "大卫杀死歌利亚时，也不过是个年轻的牧羊人。"
 pam_great_projects_events.0008.c: "找个安全的选择，即使他不是大师的儿子。"
 pam_great_projects_events.0008.duel.success: "铸造成功了！一座[GetDomicileBuilding('cathedral_belltower_02').GetName|V]将在[owner.GetShortUINamePossessive]的[cathedral_complex|E]建造"
 pam_great_projects_events.0008.duel.failure: "铸造失败了……你必须决定接下来该怎么办"
 pam_cathedral_bell_casting_duel: "[CHARACTER.GetShortUINamePossessive|U]的[learning|E]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]：\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]：\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]：\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]：\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$：天主发声"
 pam_great_projects_events.0009.desc.body: "我看着[bell_maker_son.GetFirstName]来回奔跑，指挥着工人们。\n\n[bell_maker_son.GetSheHe|U]不断挑战[bell_maker_son.GetHerHis]父亲的旧班底，坚持在选址、模具黏土以及熔炉烧制方面都按[bell_maker_son.GetHerHis]自己的方式来。"
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName]和我看着[bell_maker_son.GetFirstName]来回奔跑，指挥着工人们。\n\n[bell_maker_son.GetSheHe|U]不断挑战[bell_maker_son.GetHerHis]父亲的旧班底，坚持在选址、模具黏土以及熔炉烧制方面都按[bell_maker_son.GetHerHis]自己的方式来。"
 pam_great_projects_events.0009.desc.success_end: "\n\n熔化的青铜缓缓注入模具，仿佛有天主之手引导，完美成型。然后它被吊起，向所有[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]发出响亮的召唤：\n\n“来上主的殿宇！”"
 pam_great_projects_events.0009.a: "让[province.GetNameNoTooltip]的[province.Custom('GetTerrainType')|l]聆听天主之声。"
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$：毁灭的先兆！"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\n熔化的青铜在模具中嘶吼，但最终完整成型。然后它被吊起，拉动钟锤，然而当钟锤击打到钟壁时，只传来一声沉闷的钝响，接着是一道噼啪声。毁灭的先兆！"
 pam_great_projects_events.0010.a: "必须遵守诺言。"
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U]被处决"
 pam_great_projects_events.0010.b: "裂开的钟已经是惩罚了。"
 pam_great_projects_events.0010.b.faith: "主对他另有安排。"
 pam_great_projects_events.0010.c: "把青铜熔了，铸造更锋利的东西。"
 pam_great_projects_events.0010.c.tt: "裂开的钟被重铸为一件刑具；[bell_maker_son.GetShortUIName]成了它的第一名受害者。未来[founder.GetCapitalLocation.GetNameNoTooltip]的工匠们将懂得服从。"
 pam_great_projects_events.0010.c.intrigue_xp.tt: "你获得[intrigue_lifestyle|E][experience|E]"
 pam_great_projects_events.0010.d: "让这成为关于谦卑的一课。"
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$：仿佛出自天主之手"
 pam_great_projects_events.0011.desc.intro: "在视察[province.GetNameNoTooltip]的[cathedral_building.GetName]的施工进度时，一阵巨大的旋转木结构发出的刺耳尖啸声冲击了我的耳朵。"
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName]指向那个巨型踏车，一对工人正在里面行走。"
 pam_great_projects_events.0011.desc.no_architect: "\n\n我发现了噪音的来源——一座巨大的踏车，里面有一对工人正在行走。"
 pam_great_projects_events.0011.desc.outro: "\n\n它仿佛出自天主之手，绳索与滑轮将大块新切割的[Glossary('方石','ASHLAR_GLOSS')]和一桶桶灰浆吊升至施工中的屋顶。我满怀敬畏地凝望着这批重物，若由下方院中的搬运工来背，怕早已压断了他们的脊梁。"
 pam_great_projects_events.0011.a: "我们[founder.GetCulture.GetCollectiveNounNoTooltip]人必须从这巨轮上学习。"
 pam_great_projects_events.0011.a.tt: "你的[culture|E]获得@culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#!当前[cultural_fascination|E]进度"
 pam_great_projects_events.0011.b: "[founder.GetCapitalLocation.GetNameNoTooltip]许多工程都能从此受益！"
 pam_great_projects_events.0011.c: "令人印象深刻，但我会将此类行动留给天主。"
 ASHLAR_GLOSS: "方石是经过精准切割和修整的石料，在地面上被加工成方正平整的形状。建造主教座堂时，方石一旦被吊升至必要的高度后，就必须严丝合缝地拼接，因此需要精密的规划。"
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$：更高的召唤"
 pam_great_projects_events.0013.desc: "木匠敲动木槌的咚咚声在上方回响，预示着不久的将来，这里的音响效果会让朝拜者沐浴在天主的圣言中。\n\n[architect.GetFirstName]解释道：“这里将会有一座不太大的楼厢，咏礼司铎将在我们自己的[Glossary('唱经楼','CANTORIA_GLOSS')]上主持礼仪！其实，我们称呼吾主时，必须用与他人说话时不同的声音。”[architect.GetSheHe|U]随即招手，将年轻的唱经班男孩[choir_boy.GetFirstName]叫上前。\n\n那孩子轻快地爬上脚手架，吐露出天使般的音符；当它在墙壁间回荡，进入我的身体时，仿佛天主穿过了我一般。"
 pam_great_projects_events.0013.a: "扩大楼座，声音越多越好。"
 pam_great_projects_events.0013.b: "这个天使必须为我的宫廷增光添彩。"
 pam_great_projects_events.0013.castrato: "将这声音留给上主的唱经楼。"
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U]已被阉割，因此[choir_boy.GetHerHis]的嗓音不会变声"
 pam_great_projects_events.0013.c: "这些表演是为了压榨我而设的诡计！"
 pam_great_projects_events.0013.d: "我情绪激荡，必须离开。"
 CANTORIA_GLOSS: "唱经楼是教堂中高悬的唱经楼座，通常设于歌咏团的上方或临近中殿与耳堂相交处，由歌者——后来也包括管风琴——在此引领礼仪。"
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$：祂的慈爱"
 pam_great_projects_events.0012.desc: "西立面已经完工！入口已准备好迎接穿越[Glossary('前廊','NARTHEX_GLOSS')]前来礼拜的信众。[cathedral_building.GetName]可能需要耗尽一生方能完全建成，但[owner.GetPrimaryTitle.GetNameNoTier]的善良基督徒们必须对主慈爱的未来充满信念。我的讲道开始了……\n\n#EMP “[ROOT.Char.Custom('RandomBibleQuote')]”#!\n\n……我会将经书中的这一课教授给他们。"
 NARTHEX_GLOSS: "前廊是教堂的入口大厅，位于西侧大门与中殿之间。它迎接信徒进入神圣的空间，在更为严格的礼仪中，弥撒期间忏悔者与慕道者在此与会众隔开。"
 pam_great_projects_events.0012.a: "“缔造和平的人是有福的……”"
 pam_great_projects_events.0012.a.flavor: "“[Glossary('...for they will be called children of God.','MATTHEW_5_9_GLOSS')]”"
 pam_great_projects_events.0012.a.tt: "[owner.GetPrimaryTitle.GetNameNoTier]所有[owner.GetFaith.GetAdjective][county|E]获得[GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]，持续#V 10年#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "“懒汉，你去看看蚂蚁……”"
 pam_great_projects_events.0012.b.flavor: "“[Glossary('...consider its ways and be wise.','PROVERBS_6_6_GLOSS')]”"
 pam_great_projects_events.0012.b.tt: "[owner.GetPrimaryTitle.GetNameNoTier]所有[owner.GetFaith.GetAdjective][county|E]获得[GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]，持续#V 10年#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "“弟兄们，我……”"
 pam_great_projects_events.0012.c.flavor: "“[Glossary('...by the name of our Lord Jesus Christ, that all of you be in agreement and that there be no divisions among you, but that you be knit together in the same mind and the same purpose.','1_CORINTHIANS_1_10_GLOSS')]”"
 pam_great_projects_events.0012.c.tt: "[owner.GetPrimaryTitle.GetNameNoTier]所有[owner.GetFaith.GetAdjective][county|E]获得[GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]，持续#V 10年#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "“应常欢乐，不断祈祷……”"
 pam_great_projects_events.0012.d.flavor: "“[Glossary('...give thanks in all circumstances, for this is the will of God in Christ Jesus for you. Do not quench the Spirit. Do not despise prophecies.','1_THESSALONIANS_5_16_20_GLOSS')]”"
 pam_great_projects_events.0012.d.tt: "[owner.GetPrimaryTitle.GetNameNoTier]所有[owner.GetFaith.GetAdjective][county|E]获得[GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]，持续#V 10年#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "“所以，我们既有如此众多如云的证人，围绕着我们……”"
 pam_great_projects_events.0012.e.flavor: "“[Glossary('Let us also lay aside every weight and the sin that clings so closely, and let us run with perseverance the race that is set before us.','HEBREWS_12_1_GLOSS')]”"
 pam_great_projects_events.0012.e.tt: "[owner.GetPrimaryTitle.GetNameNoTier]所有[owner.GetFaith.GetAdjective][county|E]获得[GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V]，持续#V 10年#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "“对贫苦的人，她随手赒济……”"
 pam_great_projects_events.0012.f.flavor: "“[Glossary('...and reaches out her hands to the needy.','PROVERBS_31_20_GLOSS')]”"
