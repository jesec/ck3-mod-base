 trade_category_non_construction: "非建材"
 trade_category_non_construction_desc: "除建筑材料以外的所有贸易商品；不包括木料、麻或石料。"
 trade_category_non_food: "非食物"
 trade_category_non_food_desc: "除基本食物以外的所有贸易商品；不包括麦、粟、稻、水果、腌肉、鱼或奶酪。"
 trade_category_non_medicinal: "非药品"
 trade_category_non_medicinal_desc: "除药物以外的所有贸易商品。"
 trade_category_non_luxury: "非奢侈品"
 trade_category_non_luxury_desc: "除丝绸、香料、珠宝、奶酪、水果、油和茶叶等奢侈品与舒适食品之外的所有贸易商品。"
 trade_category_food: "基础食物类"
 trade_category_food_desc: "维系所有人口生存的基础食材，包含麦、粟、稻、水果、肉类、鱼类与奶酪。稳定的食物供给是所有聚居地、军队与家庭的首要刚需。"
 trade_category_beasts_of_burden: "驮兽类"
 trade_category_beasts_of_burden_desc: "诸如牛、马等役畜是农业生产与交通运输所需的核心。它们为农田劳作、货物运输提供动力，支撑着一切领地的乡村经济运转。"
 trade_category_minerals: "矿物类"
 trade_category_minerals_desc: "通过采矿与采石作业从地底开采的物资，包含金属、宝石、盐与明矾。这类物资为锻造工坊、铸币厂和手工艺作坊提供原料，是所有产业发展的基础。"
 trade_category_luxury: "奢侈品类"
 trade_category_luxury_desc: "权贵阶层追捧的珍稀贵重商品，如丝绸、香料、象牙与珠宝。这类物品象征着地位与雅致格调，仅有富庶贵族的宫廷能够消费。"
 trade_category_refined_goods: "精致商品类"
 trade_category_alcohol: "酒精饮料类"
 trade_category_alcohol_desc: "啤酒与葡萄酒远非单纯的消遣饮品。它们是不洁水源的安全替代品，兼具宗教祭祀功用，也是酒馆与宫廷社交的必备物资。"
 trade_category_liqour_raw_materials: "酿酒原料类"
 trade_category_precious_metals: "贵金属类"
 trade_category_precious_metals_desc: "黄金与白银是铸币与国库储备的命脉。除货币流通用途外，贵金属也是精细工艺制作、身份地位展示的关键材料。"
 trade_category_jewelry_materials: "珍宝类"
 trade_category_jewelry_materials_desc: "因质地绝美而备受珍视的稀有异域原料，包括宝石、琥珀、象牙与玉石。这类原料价值高昂，是奢侈品工艺与宗教饰品的核心用材。"
 trade_category_crops: "作物类"
 trade_category_crops_desc: "已驯化的大田作物，包含谷物、甘蔗、棉花与亚麻。在精心呵护的土地中经灌溉生长，是农耕社群赖以存续的天然物产。"
 trade_category_base_metals: "基础金属类"
 trade_category_base_metals_desc: "支撑工业生产与军事作战的实用金属，以铁、铜为主。铁可制作武器、工具与护甲，铜是合金冶炼与日常金属器物制作的核心原料。"
 trade_category_cereals: "谷物类"
 trade_category_cereals_desc: "麦、粟、稻等主食作物。谷物是任何人类饮食体系的根基，也是流通最广泛的贸易商品，为城市与军队提供核心粮食保障。"
 trade_category_meat: "肉类"
 trade_category_meat_desc: "各类腌制、风干的肉类与鱼类。这类高蛋白物资可为家庭聚落、驻军营地以及远离新鲜食材补给的远洋航行提供口粮支撑。"
 trade_category_comforts: "舒适品类"
 trade_category_comforts_desc: "基础饱腹之外的日常食用品，包含奶酪、水果、橄榄油、蜂蜜与茶叶。这类物品能够提升生活质量，在所有定居社群中均有稳定需求。"
 trade_category_clothes: "衣物类"
 trade_category_clothes_desc: "成品服饰与制衣原料，包含纺织品、毛皮与皮革。从粗布工装到精致礼服，衣物是领地所有民众的基础生活必需品。"
 trade_category_luxury_consumption: "奢侈消费品类"
 trade_category_luxury_consumption_desc: "产自异域的珍稀高价物资，以蔗糖、香料为代表。这类物资可改良食材风味、入药使用，仅少数特权阶层能够享用。"
 trade_category_luxury_items: "奢侈物品类"
 trade_category_luxury_items_desc: "彰显身份与修养的精致器物，包含陶瓷、玻璃、珠宝、漆器与丝绸。是繁荣与高雅宫廷的标志。"
 trade_category_construction_materials: "建筑材料类"
 trade_category_mandala_arms: "简易武器类"
 trade_category_mandala_arms_desc: "打造制式军备的简易原料，主要为铜与木材。可供军备薄弱的领地制作长矛、盾牌等基础作战器具，满足更强军事装备需求。"
 trade_category_carpentry_supplies: "木工制品类"
 trade_category_carpentry_supplies_desc: "木材与麻，是建筑建造与航海作业的核心原料。木材可用于搭建房屋、建造船舶，麻则可制作绳索与船具，是海上贸易的必备物资。"
 trade_category_rural_goods: "乡村商品类"
 trade_category_rural_goods_desc: "乡村产出的各类天然物资，涵盖农作物、牲畜、木材以及开采自地底的珍贵矿石。这类初级物产从乡村流向城镇，供城镇加工利用。"
 trade_category_agricultural_goods: "农产品类"
 trade_category_agricultural_goods_desc: "农场产出的全部物产，包括谷物、纤维作物、葡萄酒、蜂蜜与牲畜。这类物资代表着定居农耕经济的整体产出成果。"
 trade_category_bast_fibres: "韧皮纤维类"
 trade_category_fabrics: "纺织原料类"
 trade_category_fabrics_desc: "羊毛、棉花、亚麻等纺织原材。属于农业初级产品与成品布料之间的中间原料，供给领地各处的织工织造生产。"
 trade_category_guild_goods: "行会商品类"
 trade_category_guild_goods_desc: "城市行会工坊制作的精制成品，包含啤酒、纺织品、玻璃与珠宝。是专业工匠精工制作的成熟商品。"
 trade_category_cheap_common: "普遍商品类"
 trade_category_cheap_common_desc: "几乎所有市集均有售卖、物美价廉、储量充足的通用物资，包括谷物、鱼类、木材、石材等。因其价值低廉、产量充沛，是地方贸易的主流日常货品。"
 trade_category_fine_goods: "精美商品类"
 trade_category_fine_goods_desc: "流通于大型市集的高价值物资，是财富、地位与文明生活的通货。"
 trade_category_staple_goods: "日用品类"
 trade_category_staple_goods_desc: "维系城市运转与军队存续的大宗物资。但凡人口聚居之地，这类物资的流通必不可缺。"
 trade_category_stone: "石料类"
 trade_category_stone_desc: "开采所得的建筑石材，用于修筑防御工事、教堂与城市公共设施。本地石材储量匮乏的地区，开展大型基建工程必须进口石材。"
 trade_category_salt: "盐类"
 trade_category_salt_desc: "兼具防腐功用与食用价值的核心矿物。食盐可用于腌制鱼、肉和鞣制皮革，自古以来就是长途贸易的重要货品。"
 trade_category_alum: "明矾类"
 trade_category_alum_desc: "用途广泛的矿物盐，主要作为媒染剂固定织物染料，同时可用于鞣皮与医药。因其产量稀缺，成为具备战略价值的贸易物资。"
 trade_category_dyes: "染料类"
 trade_category_dyes_desc: "提取自植物、矿物与昆虫的彩色颜料。广泛应用于各类工艺制作，可为布料固色、陶瓷上釉、手抄典籍绘制彩色墨迹。"
 trade_category_books: "书籍类"
 trade_category_books_desc: "手抄典籍以及书写所用的纸张或羊皮纸。书籍是教育普及、政务管理、知识传承的核心载体，在任何有识字群体的地区均有需求。"
 trade_category_incense: "熏香类"
 trade_category_incense_desc: "用于各地宗教仪式焚烧的芳香树脂与芳香合成物料。对于所有虔信社群的教堂、庙宇与神龛而言，稳定的熏香供给必不可少。"
 trade_category_medicaments: "药物类"
 trade_category_medicaments_desc: "医师与疗愈者使用的药剂、草药与医用合成配方物资。充足的药剂供给能够降低伤病带来的伤亡，是所有发展中聚落的重要保障。"
 trade_good_wood: "木料"
 trade_good_wood_desc: "木材是建造房屋、船舶与制作家具的核心建材。优质硬木并非各地均有产出，往往需要从林区进口获取。"
 trade_good_stone: "石料"
 trade_good_stone_desc: "石材开采自石灰岩、砂岩或大理石矿脉，是大型建筑工程的必备材料。石材运输成本高、负重极大，远离天然岩矿的地区通常石材稀缺。"
 trade_good_wool: "羊毛"
 trade_good_wool_desc: "羊毛取自绵羊剪毛并经清洁处理，是中世纪欧洲最重要的纺织纤维。羊毛可纺线、织布，为庞大的纺织产业提供核心原料。"
 trade_good_cotton: "棉花"
 trade_good_cotton_desc: "棉花广泛种植于印度、埃及等温暖地区，其纤维相较羊毛更为轻薄透气。棉花经纺纱织布后，是伊斯兰世界及更广区域纺织贸易的核心基础物资。"
 trade_good_leather: "皮革"
 trade_good_leather_desc: "经鞣制加工的兽皮，质地耐用且易于加工。皮革可制作靴履、腰带、马鞍、护甲与书籍封皮，是所有文明中不可或缺的工艺原料。"
 trade_good_flax: "亚麻"
 trade_good_flax_desc: "亚麻是人类种植历史最悠久的作物之一，既可以从茎秆中提取纤维用于纺织，也能从种子中榨取亚麻籽油。尽管收获环节需要投入较多人力，但它对生长环境的要求低于其他纤维作物，因此几乎在世界各地都能种植。"
 trade_good_hemp: "麻"
 trade_good_hemp_desc: "麻是用途广泛的作物，其强韧纤维可捻制绳索、织造船帆、填充船缝。麻是全球航海经济与建筑行业的刚需物资。"
 trade_good_salt: "盐"
 trade_good_salt_desc: "盐出产自海边晒盐池、岩盐矿或盐泉，是重要的防腐剂和膳食矿物质。它的防腐能力使之成为历史上流通最为持续稳定的商品之一。"
 trade_good_grain: "麦"
 trade_good_grain_desc: "麦可以磨粉制作面包或熬制成粥，是中世纪最重要的农作物。从西欧的小麦到北欧的黑麦，各种麦类供养着农民与贵族。"
 trade_good_fruit: "水果"
 trade_good_fruit_desc: "新鲜水果与果干为中世纪饮食增添风味与品类。苹果、梨、无花果等果园果品从温暖地区外销，满足北方地区的消费需求。"
 trade_good_meat: "腌肉"
 trade_good_meat_desc: "经盐渍、烟熏或风干防腐处理的腌制肉类，是核心蛋白质来源。可供行军军队食用，也能帮助民众熬过物资匮乏的冬季。"
 trade_good_fish: "鱼"
 trade_good_fish_desc: "风干、盐渍或烟熏的鱼类可长途运输而不易变质，使内陆非沿河地区也可将其作为重要的蛋白质来源。其中鲱鱼与鳕鱼推动了大规模远洋贸易的发展。"
 trade_good_cattle: "牛"
 trade_good_cattle_desc: "牛可为耕地提供役畜动力，同时产出牛乳、牛肉与牛皮，是用途最全面的家畜。优质种牛的引进与繁育，能够有效提振农耕经济。"
 trade_good_horses: "马"
 trade_good_horses_desc: "马匹是中世纪主要的畜力与乘骑牲畜，广泛应用于农业生产、交通运输与军事作战。大草原与伊比利亚出产的优良马种尤为珍贵。"
 trade_good_cheese: "奶酪"
 trade_good_cheese_desc: "奶酪是一种通过凝结与熟化工艺加工而成的乳制品。与鲜奶相比，奶酪拥有更长的保质期，能够在一年四季中稳定地提供脂肪与蛋白质营养。"
 trade_good_beer: "啤酒"
 trade_good_beer_desc: "啤酒由谷物发酵酿制而成，是北欧民众的日常饮品。其酒精含量低但营养丰富，在多数城镇中比生水更为安全，广受社会各阶层喜爱。"
 trade_good_wine: "葡萄酒"
 trade_good_wine_desc: "葡萄酒由葡萄发酵酿造，在中世纪文化中地位尊贵，是教会、贵族与富商的专属饮品。地中海与莱茵河谷的葡萄园产出的葡萄酒贸易流通广泛。"
 trade_good_oil: "橄榄油"
 trade_good_oil_desc: "橄榄油由橄榄压榨制成，在地中海世界被广泛用作烹饪油料、灯具燃料与制皂原料。北方地区因物产差异，多以动物脂肪和黄油替代橄榄油。"
 trade_good_honey: "蜂蜜"
 trade_good_honey_desc: "蜂蜜是中世纪主要的甜味剂，同时可用于酿造蜂蜜酒、调配药剂与食品防腐。世界各地均有养蜂产业，但优质蜂蜜价格高昂。"
 trade_good_rice: "稻"
 trade_good_rice_desc: "稻米是东亚与南亚的主力谷物，需要水田和温暖的气候，但产量极高，是庞大人口的饮食基础。"
 trade_good_millet: "粟"
 trade_good_millet_desc: "粟适应性极强，可在贫瘠土壤与干旱气候中生长，是其他谷物难以存活地区的优选作物，为非洲大部、中亚及印度干旱区域的主食。"
 trade_good_iron: "铁"
 trade_good_iron_desc: "铁是中世纪用途最广的金属，由铁矿冶炼而成，可制作工具、武器、马蹄铁与铁钉。稳定的铁器供给，是聚落发展、工匠劳作与军队装备的基础。"
 trade_good_alum: "明矾"
 trade_good_alum_desc: "明矾是一种稀有的盐类矿物，具有止血、澄清玻璃或鞣制皮革等多种用途。其最主要的应用是作为媒染剂——既能漂白，也能增强染料在纺织品上的附着力。\n\n明矾在中东等温暖地区有天然产出，同时也可从世界其他地区的明矾石中提取。"
 trade_good_jade: "玉石"
 trade_good_jade_desc: "玉是质地坚硬的美丽矿石，在东亚拥有极高的文化价值，可雕琢为工具、饰品与祭祀礼器。玉在中华宫廷价值连城，是德行与身份的象征。"
 trade_good_gold: "黄金"
 trade_good_gold_desc: "黄金是最贵重的金属，是王室国库的基础，也是最高价值铸币的原料。凭借其稀缺性与亮丽光泽，黄金成为王冠、圣物与陈设器物的首选材质。"
 trade_good_silver: "白银"
 trade_good_silver_desc: "白银是最通用的货币金属，铸造的银币流通于整个已知世界。除货币功能外，白银还可打造精美珠宝、银器与宗教器物。"
 trade_good_amber: "琥珀"
 trade_good_amber_desc: "琥珀是石化树脂，主产于波罗的海沿岸，自古便作为商品流通。其色泽温润、易于雕琢，常被制作成珠饰、吊坠等装饰器物，价值不菲。"
 trade_good_copper: "铜"
 trade_good_copper_desc: "铜质地柔软、易于加工，可制作炊具、教堂钟，也可用于冶炼青铜、黄铜等合金。温润的色泽也使其成为装饰金属工艺的常用材质。"
 trade_good_gems: "宝石"
 trade_good_gems_desc: "红宝石、蓝宝石、祖母绿等珍贵宝石，是各条贸易线路中价值最高的货品之一。经切割打磨后，可装饰王冠、圣物匣与权贵珠宝。"
 trade_good_silk: "丝绸"
 trade_good_silk_desc: "丝绸是最顶级的纺织纤维，由蚕茧抽丝织造而成，面料柔滑透亮、质感华贵。丝绸起源于中国，是全球贸易中价值极高的奢侈品。"
 trade_good_textiles: "纺织品"
 trade_good_textiles_desc: "以羊毛、棉花、亚麻或混纺纤维织造的布料。优质纺织品是中世纪贸易的核心品类，佛兰德、意大利与中东地区的工坊织物闻名于世、流通广泛。"
 trade_good_furs: "毛皮"
 trade_good_furs_desc: "在北方森林捕猎的狐狸、白鼬、紫貂、海狸等动物的皮毛。毛皮服饰是财富与地位的象征，贵族宫廷的旺盛需求催生了利润丰厚的毛皮贸易。"
 trade_good_books_paper: "书籍与纸张"
 trade_good_books_paper_desc: "手抄典籍及承载文字的羊皮纸、纸张。书籍承载律法、宗教经文与历代知识，在政务兴盛、文教繁荣的地区拥有稳定需求。"
 trade_good_spices: "香料"
 trade_good_spices_desc: "胡椒、肉桂、丁香、肉豆蔻等产自南亚与东南亚的芳香香料，属于世间顶级贵重的货品之一。香料可保鲜、调味食材，同时也是财富地位的象征。"
 trade_good_tea: "茶叶"
 trade_good_tea_desc: "茶叶由茶树叶片经干燥、加工制成，是远东地区的标志性饮品。茶叶沿丝绸之路向西传播，逐渐成为重要的贸易商品。"
 trade_good_dyes: "染料"
 trade_good_dyes_desc: "提取自菘蓝与茜草等植物、胭脂虫等昆虫以及各类矿物的染色物质。染料为布料、陶瓷与彩绘手抄典籍赋予鲜亮色彩，是相关手工业不可或缺的核心物料。"
 trade_good_jewelry: "珠宝"
 trade_good_jewelry_desc: "由贵金属搭配宝石、珐琅或玻璃制成的成品首饰。珠宝是中世纪个人财富最直观的体现，也常作为礼品与外交信物流通。"
 trade_good_ivory: "象牙"
 trade_good_ivory_desc: "象牙取自大象的长牙，兼具尊贵属性与宗教供奉意义。可用于制作装饰雕刻品、棋子、圣物匣饰板以及各类顶级奢华陈设器物。"
 trade_good_glass: "玻璃"
 trade_good_glass_desc: "经吹制、塑形工艺打造的玻璃器皿、窗玻璃与装饰摆件。威尼斯与伊斯兰世界出产的精品玻璃制品价值高昂，普通玻璃则日益广泛应用于教堂与富人宅邸。"
 trade_good_sugar: "糖"
 trade_good_sugar_desc: "由南方温暖地区种植的甘蔗提炼制成，是稀缺昂贵的奢侈品。糖可用作甜味剂、药物，也是富人厨房中彰显身份的高端食材。"
 trade_good_incense: "熏香"
 trade_good_incense_desc: "乳香、没药等芳香树脂，被各大教派用于宗教祭祀焚烧。熏香的生产依赖温暖气候与专属树种，主要从阿拉伯、埃塞俄比亚与印度对外出口。"
 trade_good_ceramics: "陶瓷"
 trade_good_ceramics_desc: "工艺精湛、艺术性极强的优质陶器与瓷器。产自中国与伊斯兰世界的高品质陶瓷，是备受追捧的奢侈品与装饰器物。"
 trade_good_lacquerware: "漆器"
 trade_good_lacquerware_desc: "多层漆树脂涂刷制成的器物，凭借坚固耐用的特性与莹润光泽广受东亚珍视。漆盒、漆盘、漆制家具等漆器奢侈品沿丝绸之路远销各地。"
 trade_good_medicaments: "药物"
 trade_good_medicaments_desc: "医师与药剂师使用的各类干制草药、矿物制剂与加工成品药剂。药剂是医治创伤、防治疫病、维系民众健康的关键物资。"
