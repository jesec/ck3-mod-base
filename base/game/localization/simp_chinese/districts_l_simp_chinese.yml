l_simp_chinese:
 DISTRICT_DEBUG_KEY: "#D 调试键值：#![DistrictType.GetKey]"
 DISTRICT_DEBUG_FULL: "#D DEBUG KEY AND DESC:#!\n[District.GetKey]\n[District.GetDescKey]"
 bureacratic_district_capital_trigger: "[root_scope.GetName]是你的[realm_capital|E]"
 civic_district_capital_trigger: "[root_scope.GetName]是你的[capital|E]"
 household_district_government_trigger: "你的[government|E]是[feudal|E]、[clan|E]、[administrative|E]、[celestial|E]、[meritocratic|E]、[ritsuryo|E]或[soryo|E]"
 household_district_top_liege_trigger: "你是一位[independent_ruler|E]，这是[administrative|E]、[celestial|E]和[meritocratic|E][governments|E]所需的"
 bureaucratic_district_ledger_or_administrative_trigger: "持有者拥有[administrative|E][government|E]，或该[barony|E]的[culture|E]已发现#V $innovation_ledger$#![innovation|E]"
 port_district_water_trigger: "该[barony|E]#bol 未#!毗邻海域或河流"
 temple_district_trigger: "该地既不是[county_capital|E]，也不是[temple|E]或[temple_citadel|E]"
 metropolitan_district_city_trigger: "这是[city_holding|E]"
 ### Holdings ###
 castle_holding_district: "城堡地产区"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "部落地产区"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "城市地产区"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "神殿地产区"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "游牧聚落地产区"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "牧民定居点地产区"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "寺庙城塞地产区"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"
 DISTRICT_FOCUS_HEADING: "#low 区划重心\n#!"
 UNLOCKS_DISTRICTS: "#low 已解锁[districts|E]#!"
 ### Economy ###
 guild_district: "行会区划"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]"
 guild_district_desc_flavor: "行会大厅里汇聚了镇上最杰出的工匠，他们把自己的行业秘密看得很紧。他们手艺精湛，要价高昂，而学徒们则被使唤得过度劳累。"
 market_district: "市场区划"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[gold_i][buy_prices|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax_short|E]和[artisan_tax_i][artisan_tax|E]"
 market_district_desc_flavor: "当地的农民、工匠和商人从早到晚挤在这个热闹的广场上。任何镇上无法生产的东西，都能在这里买到，价格也称得上“公道”。"
 port_district: "港口区划"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]"
 port_district_desc_flavor: "码头和仓库沿着水岸一字排开，码头工人在这里从大大小小的船上搬运货物。所有从海外运来的东西都得首先经过这里。"
 entrepot_location_district: "货栈区"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax|E]"
 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', '允许通过其建筑在远距离转售商品' )|E]\n\n进口商品在这些仓库清点、分类，之后发往市场。这里的商人永远清楚什么货物紧缺，并据此定价。"
 entrepot_holding_district_level_2_tt: "需要#V 2#!级[holding_district|E]"
 entrepot_holding_district_level_3_tt: "需要#V 3#!级[holding_district|E]"
 entrepot_holding_district_level_4_tt: "需要#V 4#!级[holding_district|E]"
 holding_district_level_2_tt: "需要#V 2#!级[holding_district|E]"
 holding_district_level_3_tt: "需要#V 3#!级[holding_district|E]"
 holding_district_level_4_tt: "需要#V 4#!级[holding_district|E]"
 ### Fortification ###
 border_forts_district: "边境堡垒区"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[control_i][control|E]"
 border_forts_district_desc_flavor: "一连串的堡垒守卫着男爵领的边界，每座堡垒里都驻守着熟悉每一条道路和渡口的士兵。来袭的劫掠者很少能深入腹地。"
 walls_district: "城墙区"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]"
 walls_district_desc_flavor: "坚固的石墙围着整座城镇，为居民提供了抵御劫掠者的绝佳保护。镇上的人会抱怨城门收的过路费，但这笔钱总比被人抢了要划算。"
 ### Military ###
 military_district: "军事区划"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[siege_weapon_i][siege_weapons|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 military_district_desc_flavor: "坚固的兵营容纳着领地的士兵，供给他们饮食、操练，随时准备出征。但要让他们始终保持清醒，就完全是另一回事了。"
 ### Civic ###
 bureaucratic_district: "官僚区划"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i][vassals|E]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[tax_collector|E]和[governor_efficiency|E]"
 bureaucratic_district_desc_flavor: "各级官员在这些大厅里抄录、盖印并归档领地的各类事务。他们的工作很少得到称赞，但若没了他们，领地将很快陷入停滞。"
 household_district: "王城区"
 imperial_household_district: "皇城区"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 household_district_desc_flavor: "在这些宏伟的厅堂中，统治者临朝听政。高墙之后，国家的威严由仆役、能工巧匠和大臣共同维系。有些人终其一生都未曾离开过这里。"
 mandala_district: "曼荼罗区划"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][dynasty_prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 mandala_district_desc_flavor: "这片神圣区域里的每一座神殿、每一尊雕像、每一场仪式，都在讲述同一个故事：国王是依照神的意志进行统治的。这个故事被反复讲述，声音传得很远。"
 temple_district: "宗教区"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 temple_district_desc_flavor: "这片区域里遍布圣所，钟声、唱经声或是唤拜声，划分着一天里的每一个时辰。在这里，神职人员的势力几乎与领主不相上下。"
 temple_district_christian: "教堂专区"
 temple_district_islamic: "清真寺区"
 ### Metropolitan ###
 entertainment_district: "娱乐区划"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_tax|E]"
 entertainment_district_desc_flavor: "音乐、游戏和各类表演，把各个阶层的城镇居民都吸引到这片区域。贵族们装出不喜欢它们的样子，农民们也装作没看见他们。"
 patrician_district: "贵族区划"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 patrician_district_desc_flavor: "大理石、丝绸和进口香料，在这片富人区里是随处可见的东西。这里的家族互相通婚，互相借贷，也互相算计。"
 urban_housing_district: "住宅区"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]和[settlement_size_growth_short|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$解锁[urban_districts|E]"
 urban_housing_district_desc_flavor: "城里大多数人都住在这些拥挤的街道里，好几户人家共用一片屋顶。对从乡下来的新人来说，这里是通往更好生活的起点。"
 ### Rural ###
 manor_houses_district: "庄园宅邸区"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E]和[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 manor_houses_district_desc_flavor: "在乡间各处，庄园宅邸是小贵族的住所，他们看管着周边的土地。谷物与钱币向上输送，随之而来的还有人们的抱怨。"
 religious_community_district: "宗教社区"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 religious_community_district_desc_flavor: "虔诚的信徒聚集在这片安静的社群里，远离世俗生活，祈祷、耕种、抄写圣典。但世俗世界还是不断把各种纷扰送到这里。"
 villages_district: "村庄区"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i]较低的[settlement_size|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E]和[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]\n$BULLET_WITH_TAB$解锁[rural_districts|E]"
 villages_district_desc_flavor: "村庄散落在城墙外的乡间，每一个村子都有自己的田地和水井。这里的农民辛勤耕作，而城里的人则把粮食当成理所当然的东西。"
 ### Tribal ###
 tribal_economy_prestige_district: "宴会大厅区"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]"
 tribal_economy_prestige_district_desc_flavor: "在这些宴会大厅中，部族成员齐聚一堂，吃喝畅饮，夸耀各自的功绩。每多饮一杯，故事便增添几分夸张。"
 tribal_military_district: "战争营地区"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 tribal_military_district_desc_flavor: "部落里的战士在这些棚屋里磨利武器，讲述曾经劫掠的故事。年轻人在一旁仔细听着，心中已经在谋划自己的劫掠行动。"
 tribal_wanua_district: "万蒂兰区"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i][barter_goods|E]\n$BULLET_WITH_TAB$[vassal_limit_i][vassal_limit|E]\n$BULLET_WITH_TAB$[domain_limit_i][domain_limit|E]"
 tribal_wanua_district_desc_flavor: "人们聚在这些开阔厅堂里，在长老面前倾诉自己的不满，长老们也会确保首领能听到这些话。"
 ### Duchy ###
 bailiwick_district: "执达吏辖区"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E]和[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 bailiwick_district_desc_flavor: "乡野承担公国的一切开支，而在此区划中，执达吏们确保每一块田地、每一群牲畜、每一个村庄都履行好职责。"
 staple_district: "贸易中心区"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E]、[commerce_tax_i][commerce_tax_short|E]、[artisan_tax_i][artisan_tax_short|E]和[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 staple_district_desc_flavor: "仓库、秤具和账房挤满了贸易中心区，公国最有价值的商品在这里过秤、收税并得到看管。"
 endowment_district: "供奉区"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 endowment_district_desc_flavor: "捐赠给供奉区的每一份礼物都是永久的，这里的教士持有的特许状，来自那些名字早已被人遗忘的统治者。"
 assay_district: "验金区"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]和[civic_tax_i][civic_tax|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[vassal_i][vassals|E]"
 assay_district_desc_flavor: "该区划里铸造的每一批钱币，都会留出几枚锁进箱子，留待日后查验，以防铸币工匠起了贪心。"
 military_duchy_capital_district: "集合场区"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]和[fort_level|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]"
 military_duchy_capital_district_desc_flavor: "凡在此区划集结的士兵，其姓名、武器和战马都被登记入册；缺席者同样记录在案。"
 ducal_residence_district: "公爵官邸区"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 ducal_residence_district_desc_flavor: "该区划的宾客在配得上公爵身份的厅堂与花园中接受款待；在这里的晚宴上谈成的公国事务，比在宫廷里还要多。"
 royal_residence_district: "王室居住区"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 royal_residence_district_desc_flavor: "该区划的宾客在配得上国王身份的厅堂与花园中接受款待；在这里的晚宴上谈成的领地事务，比在宫廷里还要多。"
 governance_district: "衙署"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 governance_district_desc_flavor: "各级官员都在该区划的大堂里办公；行省的税款在这里清点，粮仓在这里查验，驻军也在这里领饷。"
 forestry_district: "林业区划"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_glass').GetNameWithIcon]、[GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon]和[GetTradeGoodType('trade_good_meat').GetNameWithIcon]"
 forestry_district_desc_flavor: "这里的森林为房屋、船只和炉火提供木材，砍伐权受到严密保护。盗伐木材所受的惩罚，几乎和偷猎鹿一样严厉。"
 grain_district: "小麦种植区划"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 grain_district_desc_flavor: "谷物是任何经济的支柱，而该区划的田地大量种植谷物。未被烤成面包的，便被用来酿造、蒸馏或出售。"
 wool_district: "绵羊养殖区划"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]、[GetTradeGoodType('trade_good_leather').GetNameWithIcon]、[GetTradeGoodType('trade_good_cheese').GetNameWithIcon]、[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]和[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 wool_district_desc_flavor: "成群的绵羊在该区划的牧场上吃草，羊毛被成袋地卖给国家各地的织工。不止一位大商人从一群羊起家。"
 cattle_district: "牲畜养殖区划"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_meat').GetNameWithIcon]、[GetTradeGoodType('trade_good_cheese').GetNameWithIcon]和[GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 cattle_district_desc_flavor: "牛群在该区划的牧场上吃草，因其肉、奶和拉犁的力气而受到重视。在许多地方，新娘的嫁妆仍然以牛来计数。"
 cotton_district: "棉花种植区划"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]和[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 cotton_district_desc_flavor: "在该区划的田地里，白色棉铃逐渐成熟，经手工采摘，成包出售。一些远方民族相信，它长在能结出小绵羊的植物上。"
 stone_district: "采石区划"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 stone_district_desc_flavor: "采石场在该区划的山丘上留下道道疤痕，石料被开采出来，用于领地各地的城墙、神殿和城堡。一些最精美的建筑，就起源于这里的山坡。"
 fish_district: "渔业区划"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 fish_district_desc_flavor: "该区划的鱼被鲜食、腌制、熏制或风干，并贩往水源稀缺的遥远内陆。一次好鱼获能让一个村庄吃上一个月。"
 wine_district: "葡萄种植区"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 wine_district_desc_flavor: "该区划的葡萄园种植葡萄，供餐桌鲜食、晾晒成干以及最重要的酿酒。一个好年份会被铭记数十年，而一个坏年份则会被记得更久。"
 oil_district: "橄榄种植区划"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 oil_district_desc_flavor: "该区划出产的油可用于照明、烹饪、膏抹信徒，还能滋润富人的肌肤。它几乎无所不能，少有家庭离得开它。"
 rice_district: "水稻种植区划"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]和[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 rice_district_desc_flavor: "这里，水田铺展在大地上，由整个村庄共同照料——一起插秧、除草、收割。种稻的活儿太重，单靠一个家庭根本做不完。"
 millet_district: "粟米种植区划"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_wood').GetNameWithIcon]"
 millet_district_desc_flavor: "这里的干旱平原上遍布种植粟和高粱的田地，有些高度足以藏住一名骑手。它们那细小而坚硬的谷粒，可存放多年而不腐坏。"
 mine_district: "矿业区划"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_jewelry').GetNameWithIcon]"
 mine_district_desc_flavor: "无论该区划地下蕴藏着什么——铁、银还是盐——都由矿工们挖掘而出，他们一生中在地下度过的时光比在地上还多。"
 salt_district: "盐业区划"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 salt_district_desc_flavor: "没有盐，就无法保存肉或鱼供匮乏时期使用，也无法满足军队需要。该区划供应大量盐，并且了解盐。"
 amber_district: "琥珀采集区划"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "琥珀在风暴过后被冲上岸，也从内陆的沙地和沼泽中挖掘而出。一块包着昆虫的琥珀，被认为能带来好运。"
 silk_district: "桑蚕养殖区划"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]和[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 silk_district_desc_flavor: "该区划的丝绸，始于日日夜夜以桑叶喂养的细小蚕虫。一件长袍，要用掉成千上万只蚕的茧。"
 furs_district: "毛皮加工区划"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 furs_district_desc_flavor: "该区划的捕兽人会在最冷的月份外出，那时动物的毛皮最厚也最值钱。一张上等毛皮，可能就值一季的工钱。"
 spices_district: "香料种植区划"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 spices_district_desc_flavor: "这里的香料取自植物的各个部位：树皮、嫩芽、浆果、根或是花蕊。所有香料都靠手工采集，并精心晾干。"
 tea_district: "茶叶种植区划"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 tea_district_desc_flavor: "茶树生长在该区划陡峭的山坡上，清晨常有雾气缭绕。最上等的叶子在幼嫩时采摘，一次只采一芽两叶。"
 dyes_district: "染料加工区划"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 dyes_district_desc_flavor: "该区划的染料取自树根、叶子、浆果甚至碾碎的昆虫。一种深沉而持久的颜色，往往要经过十几次浸染才能得到。"
 ivory_district: "象牙狩猎区划"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 ivory_district_desc_flavor: "该区划的大象被捕获、驯服并训练，用于战争、劳作和祭祀。象牙只是它们价值的一部分。"
 sugar_district: "糖料种植区划"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 sugar_district_desc_flavor: "该区划的甘蔗长得高大，被压榨出甜汁，再熬煮成坚硬的糖砖。在远方，一块糖砖比一头牛还值钱。"
 incense_district: "熏香采集区划"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 incense_district_desc_flavor: "该区划产出的熏香，取自树皮渗出的树脂，经日晒硬化而成；其烟袅袅，升腾于已知世界的座座神庙之中。"
 medicaments_district: "药材采集区划"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 medicaments_district_desc_flavor: "该区划的花园与荒野中生长着药草，采集它们的人深知哪些叶子能治病，哪些叶子会害人。"
 ceramics_district: "陶瓷制造区划"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_glass').GetNameWithIcon]"
 ceramics_district_desc_flavor: "该区划的陶土极为细腻，陶工们会跋涉数周前来挖掘。这里烧制出的上等器物，轻敲时会发出钟鸣般的声响。"
 hemp_district: "线麻种植区划"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 hemp_district_desc_flavor: "该区划遍布麻田，人们将其收割、浸沤、捶打，取出纤维，用来制成绳索、布料和帆。"
 flax_district: "亚麻种植区划"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_textiles').GetNameWithIcon]和[GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 flax_district_desc_flavor: "这里的亚麻被连根拔起，而非割下，以便每一寸纤维都得以保留。亚麻籽用来榨油，压榨后的残渣则用来喂养牲畜。"
 honey_district: "养蜂区划"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]和[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 honey_district_desc_flavor: "该区划以稻草、黏土或空心原木制成蜂箱养蜂，取蜜时用烟使蜂群镇静。对大多数人来说，这是他们一生中唯一尝到的甜味。"
 fruit_district: "水果种植区划"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]和[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]潜在生产：[GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 fruit_district_desc_flavor: "该区划的山坡与谷地遍布果园，果实可鲜食、晒干或压榨。"
 horses_district: "马匹养殖区划"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 horses_district_desc_flavor: "开阔的牧场、围场和马厩遍布该区划，马匹在这里被繁育、驯服，并卖给来自领地各地的骑手。"
