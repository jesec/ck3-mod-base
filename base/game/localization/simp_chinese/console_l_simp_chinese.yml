l_simp_chinese:
 # None of these need to be translated, it's just that they can look a bit nicer in here where we can format them instead of doing raw tooltips
 control_console_button_tooltip: "左键点击：[GetPlayer.GetCapitalLocation.GetCounty.GetName]获得25控制力\nShift+左键点击：治下所有伯爵领获得25控制力\n右键点击：[GetPlayer.GetCapitalLocation.GetCounty.GetName]失去25控制力\nShift+右键点击：治下所有伯爵领失去25控制力"
 prosperity_console_button_tooltip: "左键点击：[GetPlayer.GetCapitalLocation.GetCounty.GetName]获得5繁荣度\nShift+左键点击：治下所有伯爵领获得5繁荣度\n右键点击：[GetPlayer.GetCapitalLocation.GetCounty.GetName]失去5繁荣度\nShift+右键点击：治下所有伯爵领失去5繁荣度"
 popular_opinion_console_button_tooltip: "左键点击：[GetPlayer.GetCapitalLocation.GetCounty.GetName]获得5点民众好感\nShift+左键点击：治下所有伯爵领获得5点民众好感\n右键点击：[GetPlayer.GetCapitalLocation.GetCounty.GetName]失去5点民众好感\nShift+右键点击：治下所有伯爵领失去5点民众好感"
 size_console_button_tooltip: "左键点击：[GetPlayer.GetCapitalLocation.GetNameNoTooltip]获得1规模\nShift+左键点击：所有直辖省份获得1规模\n右键点击：[GetPlayer.GetCapitalLocation.GetNameNoTooltip]失去1规模\nShift+右键点击：所有直辖省份失去1规模"
