l_simp_chinese:
 VIRTUE_MODIFIER: "[TRAIT.GetName( GetPlayer )|L]（[virtue|E]）"
 SIN_MODIFIER: "[TRAIT.GetName( GetPlayer )|L]（[sin|E]）"
 holy_site_elevated_modifier: "升格圣地"
 holy_site_elevated_modifier_desc: "该角色近期将一处[holy_site|E]升格为[eminent_holy_site|E]，令该信仰的狂热信徒感到欣喜。"
 holy_site_elevated_county_holder_opinion: "升格我的圣地"
 holy_site_elevated_county_holder_opinion_desc: "该角色最近升格了一处[holy_site|E]，令圣地控制者感到满意。"
 holy_site_demoted_modifier: "降级圣地"
 holy_site_demoted_modifier_desc: "该角色近期降级了一处[holy_site|E]，冒犯了信仰的狂热信徒与乡土封臣。"
 holy_site_demoted_county_holder_opinion: "降级了我的圣地"
 holy_site_demoted_county_holder_opinion_desc: "该角色近期降级了一处[holy_site|E]，冒犯了该圣地的控制者。"
 recent_excommunication: "近期的绝罚"
 recent_excommunication_desc: "该角色最近被[excommunicated|E]了，这损害了此人在自己信仰中的地位。一年内无法请求赦免。"
 excommunication_recently_lifted: "绝罚近期被撤销"
 excommunication_recently_lifted_desc: "该角色昔日被[excommunication|E]的污点需要一定时间才会完全消失。"
 vow_of_poverty_modifier: "神贫誓愿"
 vow_of_poverty_modifier_desc: "该角色已经许下了神圣的誓言，要把其大部分财富捐给别人。"
 tenet_hedonistic_obese_modifier: "圣化放纵"
 tenet_hedonistic_obese_modifier_desc: "该角色的纵情享乐被尊崇为对世俗欢愉的圣拥。"
 temporal_condemnation_modifier: "世俗谴责"
 temporal_condemnation_modifier_desc: "宗教权威谴责该角色不适宜领导虔信者。"
 scorned_theocrats_modifier: "鄙视神职人员"
 scorned_theocrats_modifier_desc: "该角色公开侮辱并威胁了一位神职人员。"
 known_non_believer: "不信者"
 known_non_believer_desc: "该角色被揭露是一位不信者。"
 dynasty_beneficiary_won_ghw: "热忱的宗族"
 dynasty_beneficiary_won_ghw_desc: "没有人能否认该宗族的成员在战争，特别是在宗教战争中，一次又一次表现出的热情和勇敢。"
 house_beneficiary_won_ghw_crusade: "十字军家族"
 house_beneficiary_won_ghw_crusade_desc: "该家族成员蓄势待发，在需要他们对教会奉献的时刻，回应召唤并在与异教徒的战斗中证明自己。"
 house_beneficiary_won_ghw_jihad: "圣战者家族"
 house_beneficiary_won_ghw_jihad_desc: "有一点毋庸置疑：神圣战斗的灵魂在此家族的成员中鲜活而强大。"
 house_beneficiary_won_ghw: "圣战士"
 house_beneficiary_won_ghw_desc: "该家族的成员在与信仰之敌的斗争中屡屡脱颖而出，毫无疑问地证明了他们的热忱。"
 resurging_saoshyant: "萨奥希扬特复苏"
 resurging_saoshyant_desc: "该宗族诞生了预言中的萨奥希扬特，回归并带领世界走出黑暗。"
 wind_spirit_blessing: "风灵的祝福"
 wind_spirit_blessing_desc: "据说该角色得到了诸灵的祝福。"
 water_spirit_blessing: "水灵的祝福"
 water_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 rock_spirit_blessing: "岩灵的祝福"
 rock_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 tree_spirit_blessing: "树灵的祝福"
 tree_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 bush_spirit_blessing: "荒灵的祝福"
 bush_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 preserved_wilderness_modifier: "荒野保留地"
 preserved_wilderness_modifier_desc: "这片未定之地被奉为神圣荒野加以保护，使其天然路径对旅人更为安全。\n\n[travel_speed|E]：@travel_speed_icon!#P +10%#!"
 preserved_wilderness_travel_modifier: "穿越保留的荒野"
 preserved_wilderness_travel_modifier_desc: "[travel_speed|E]：@travel_speed_icon!#P +10%#!"
 bhakti_hinduism_ganga: "恒河女神信徒"
 bhakti_hinduism_ganga_desc: "该角色信奉恒河女神——纯洁、赎罪和解脱之神。"
 bhakti_hinduism_saraswati: "辩才天女信徒"
 bhakti_hinduism_saraswati_desc: "该角色信奉辩才天女——学识、音乐、艺术和智慧的女神。"
 bhakti_hinduism_kali: "迦梨信徒"
 bhakti_hinduism_kali_desc: "该角色信奉迦梨——毁灭邪恶势力的女神。"
 bhakti_hinduism_kubera: "俱毗罗信徒"
 bhakti_hinduism_kubera_desc: "该角色信奉俱毗罗——身体畸形的富贵、正义和物质财富之神。"
 bhakti_vaishnavism_lakishmi: "吉祥天女信徒"
 bhakti_vaishnavism_lakishmi_desc: "该角色信奉吉祥天女——财富、幸运和繁荣的女神。"
 bhakti_vaishnavism_jagganath: "世主信徒"
 bhakti_vaishnavism_jagganath_desc: "该角色信奉世主——世界的主宰。"
 bhakti_vaishnavism_hayagriva: "马头明王信徒"
 bhakti_vaishnavism_hayagriva_desc: "该角色信奉马头明王——知识和智慧的马头之神。"
 bhakti_shaivism_parvati: "雪山神女信徒"
 bhakti_shaivism_parvati_desc: "该角色信奉雪山神女——生育、爱情、美貌、婚姻、子孙和奉献的女神。"
 bhakti_shaivism_virabhadra: "雄贤信徒"
 bhakti_shaivism_virabhadra_desc: "该角色信奉雄贤——代表湿婆义愤的忿怒相。"
 bhakti_shaivism_munishwarar: "牟尼湿伐罗信徒"
 bhakti_shaivism_munishwarar_desc: "该角色信奉牟尼湿伐罗——代表湿婆家庭之爱的圣贤相。"
 bhakti_shaivism_dakshinamoorthy: "南方相信徒"
 bhakti_shaivism_dakshinamoorthy_desc: "该角色信奉南方相——一切形式的学识之神。"
 bhakti_smartism_ganesha: "象头神信徒"
 bhakti_smartism_ganesha_desc: "该角色信奉象头神——知识、写作、智慧和新生的象头之神。"
 bhakti_smartism_vishnu: "毗湿奴信徒"
 bhakti_smartism_vishnu_desc: "该角色信奉毗湿奴——照看和维护创造之神。"
 bhakti_smartism_shiva: "湿婆信徒"
 bhakti_smartism_shiva_desc: "该角色信奉湿婆——追捕和消灭一切邪恶之神。"
 bhakti_germanic_generic_odin: "奥丁信徒"
 bhakti_germanic_generic_odin_desc: "该角色偏爱的神是奥丁——战争、巫术、死亡和诗歌之神。"
 bhakti_germanic_not_danish_ullr: "乌勒尔信徒"
 bhakti_germanic_not_danish_ullr_desc: "该角色偏爱的神是乌勒尔——战争和荣耀之神。"
 bhakti_germanic_danish_tyr: "提尔信徒"
 bhakti_germanic_danish_tyr_desc: "该角色偏爱的神是提尔——战争和勇气之神。"
 bhakti_germanic_generic_thor: "托尔信徒"
 bhakti_germanic_generic_thor_desc: "该角色偏爱的神是托尔——保护、风暴、人性和力量之神。"
 bhakti_germanic_generic_freyr: "弗雷信徒"
 bhakti_germanic_generic_freyr_desc: "该角色偏爱的神是弗雷——和平、丰收和仁治之神。"
 bhakti_buddhism_amitabha: "阿弥陀佛信徒"
 bhakti_buddhism_amitabha_desc: "该角色信奉阿弥陀佛——无量光佛、净土之主。"
 bhakti_buddhism_avalokiteshvara: "观世音信徒"
 bhakti_buddhism_avalokiteshvara_desc: "该角色信奉观世音——大慈大悲菩萨。"
 bhakti_buddhism_bhaisajyaguru: "药师佛信徒"
 bhakti_buddhism_bhaisajyaguru_desc: "该角色信奉药师佛——消灾延寿大医王如来。"
 meditating_in_seclusion_modifier: "隐修冥想"
 meditating_in_seclusion_modifier_desc: "该角色开始了灵魂深处之旅，目前对世俗事务关注甚少。"
 astrology_great_battle: "未雨绸缪准备大战"
 astrology_great_battle_desc: "该角色正在未雨绸缪，为一场打战役做训练准备。"
 astrology_new_friends: "结交新朋友"
 astrology_new_friends_desc: "该角色正在止息旧日对立，并结交新朋友。"
 astrology_hard_work: "勤劳的人"
 astrology_hard_work_desc: "该角色准备证明努力努力工作与勤劳献身是成功之路。"
 astrology_betrayal: "怀疑他人"
 astrology_betrayal_desc: "有些事使该角色失去了对他人的信任，变得多疑起来。"
 astrology_new_beginnings: "思想开明"
 astrology_new_beginnings_desc: "该角色一直努力试图保持开明。"
 feud_with_the_church_modifier: "与教会不和"
 feud_with_the_church_modifier_desc: "众所皆知，该角色与教会长期不和，而且行事后果可能会很严重。"
 sun_trial_suspicious_modifier: "可疑的烈日裁判"
 sun_trial_suspicious_modifier_desc: "众所周知，该角色曾组织过一场结果可疑的烈日裁判，这使其名誉扫地。"
 natural_primitivism_court_naturism_modifier: "宫廷天体主义"
 natural_primitivism_court_naturism_modifier_desc: "该角色加入了其统治者的天体主义宫廷，抛下了宫廷的排场与华服。"
 natural_primitivism_court_naturism_self_conscious_modifier: "害羞"
 natural_primitivism_court_naturism_self_conscious_modifier_desc: "该角色公开撤回了其天体主义宫廷改革，现在感受到了对宫廷的每一道目光的重量。"
 natural_primitivism_unbound_court_county_modifier: "无缚的宫廷"
 natural_primitivism_unbound_court_county_modifier_desc: "该伯爵领的统治者已敦促宫廷放下等级与优雅的积习。民众欢迎这种松弛的秩序，尽管税收与控制力为此付出了代价。"
