 christian_fulfillment_level_1: "离弃之人"
 christian_fulfillment_level_2: "忧心之人"
 christian_fulfillment_level_3: "悔悟之人"
 christian_fulfillment_level_4: "得赦之人"
 christian_fulfillment_level_5: "宁定之人"
 christian_fulfillment_level_6: "蒙恩之人"
 default_fulfillment_level_0: "茫然无措"
 default_fulfillment_level_1: "上下求索"
 default_fulfillment_level_2: "循规蹈矩"
 default_fulfillment_level_3: "虔诚笃信"
 default_fulfillment_level_4: "从心所欲"
 industrious_junior_members_modifier: "勤勉的见习者"
 foolish_convert_modifier: "愚蠢改宗"
 foolish_convert_modifier_desc: "该角色愚蠢到贸然皈依一个教义体系迥异的外来[rite|E]，如今正艰难地适应全新的精神生活。"
 reckless_convert_modifier: "轻率改宗"
 reckless_convert_modifier_desc: "该角色未做充足准备便仓促皈依理念相异的宗教[rite|E]，如今正倍感挣扎地适应全新的精神生活。"
 informed_convert_modifier: "睿智改宗"
 informed_convert_modifier_desc: "该角色决定皈依一套早已熟习的宗教[rite|E]，如今正准备周全地适应全新的精神生活。"
 study_faith_learning_mannerism: "学习礼仪"
 study_faith_learning_mannerism_desc: "尽管效率较低，但学习与[rite|E]相关的行为举止和外在礼节，长远来看或许能产生实质性成果。"
 study_faith_newfound_coherence: "豁然贯通"
 study_faith_newfound_coherence_desc: "在学习该[rite|E]的过程中，迄今所发现的矛盾，非但没有构成障碍，反而成为了宝贵的资源。通过梳理两种信仰体系之间的差异，你更清晰地理解了目标礼仪[core_tenets|E]和[doctrines|E]背后的深层含义。"
 study_faith_cautious_studies: "谨慎研习"
 study_faith_cautious_studies_desc: "该[rite|E]最好以更缓慢的节奏研习，花足够时间将令人不适的观点转化为更易消化的片段，并逐渐适应其陌生的思维方式。"
 study_faith_slow_and_steady: "学习缓慢"
 study_faith_slow_and_steady_desc: "该角色被大量陌生的习俗所淹没，努力消化这些知识正使其心智不堪重负。"
 study_faith_cramming_side_studies: "分秒必争"
 study_faith_cramming_side_studies_desc: "这学生如此沉浸于该[rite|E]的内在机制中，以至于人们常发现其埋头疾书、记录笔记……即便在本该忙别的事情时也不例外。"
 followers_of_dead_faith_scheme_modifier: "失传的知识"
 followers_of_dead_faith_scheme_modifier_desc: "[faith|E]已不再公开传播，因此极难找到信徒。"
 appealing_theology_modifier: "神学吸引力"
 appealing_theology_modifier_desc: "该角色发现了一部特别吸引自己的异族神学文本。"
 suspicions_of_heresy_modifier: "异端嫌疑"
 suspicions_of_heresy_modifier_desc: "该角色常被看到阅读异族神学文本，令其同信仰者对其虔诚产生怀疑。"
 monastic_onslaught_modifier: "修道院赞助"
 monastic_onslaught_modifier_desc: "一个得到世俗赞助者充分支持的修道院推动了当地的经济活动。"
 pam_monastic_order_improvement_modifier: "修院的援助"
 pam_monastic_order_improvement_modifier_desc: "修会的修士为该伯爵领提供劳动力和顾问服务。"
 pam_military_order_improvement_modifier: "受祝福的军队"
 pam_military_order_improvement_modifier_desc: "军事修会的战士们在该伯爵领训练当地征召兵，强化军纪。"
 pam_tithes_or_mercy_harsh_tithes_modifier: "强制什一税"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "残酷的什一税征收使得当地民众对治理者充满怨恨。"
 pam_tithes_or_mercy_show_mercy_modifier: "减免什一税"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "宽松的什一税征收增进了当地民众的信任与善意。"
 pam_blissful_harmony_gospel_modifier: "良生福音"
 pam_blissful_harmony_gospel_modifier_desc: "统治者的布道赞颂和平、虔诚和有序的生活。"
 pam_blissful_harmony_restless_ambition_modifier: "不安分的野心"
 pam_blissful_harmony_restless_ambition_modifier_desc: "片刻的欢愉让该角色坐立不安，想要更多。"
 pam_stone_for_god_estate_build_discount_modifier: "上主之殿的石料"
 pam_stone_for_god_estate_build_discount_modifier_desc: "该角色敏锐的建筑师眼光，使获取石材成为可能。"
 pam_relocating_faithfuls_to_frontiers: "将信徒安置往边境"
 pam_relocating_faithfuls_to_frontiers_desc: "该伯爵领鼓励同[rite|E]者迁往其他[realm|E]进行传教。"
 pam_moving_faithfuls_to_frontiers: "信徒迁入"
 pam_moving_faithfuls_to_frontiers_desc: "该伯爵领有不同[faith|E]的人迁入并传教。\n#weak 这使#V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#![interaction|E]花费降低。#!"
 pam_building_new_shrines: "修建新神龛"
 pam_building_new_shrines_desc: "该伯爵领有不同[faith|E]信仰的居民迁入并建起新的神龛。\n#weak 这使#V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#![interaction|E]花费降低。#!"
 pam_grand_cathedral_started_modifier: "大座堂建造开工"
 pam_grand_cathedral_started_modifier_desc: "该角色统筹协调了使大座堂工程开工所需的一切资源。这座历经数代方才完工的宏伟工程昭示了他们对神的虔诚信仰。"
 pam_grand_cathedral_completed_modifier: "大座堂建造竣工"
 pam_grand_cathedral_completed_modifier_desc: "该角色统筹协调了使大座堂工程竣工所需的一切资源。这座历经数代方才完工的宏伟工程昭示了他们对神的虔诚信仰。"
 pam_grand_cathedral_02_started_modifier: "扩建大座堂"
 pam_grand_cathedral_02_started_modifier_desc: "该角色调集资源，将一座现有的大座堂提升至更高的规模。这项跨越数代人的工程，是其对天主虔诚的伟大明证。"
 pam_grand_cathedral_02_completed_modifier: "完成大座堂扩建"
 pam_grand_cathedral_02_completed_modifier_desc: "该角色监督了大座堂的扩建。"
 pam_grand_cathedral_family_contributed_south_modifier: "资助建造座堂附属堂"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "一名来自该宗族的成员曾出资建造了大座堂的附属礼拜堂。这座历经数代方才完工的宏伟工程昭示了他们对神的虔诚信仰。"
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "主教座堂地下墓穴赞助人"
 pam_cathedral_founder_crypt_modifier_desc: "该角色投资在大座堂下为其宗族建造地下墓穴。"
 pam_cathedral_bell_cracked_lesson_modifier: "裂开的钟的教训"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "该伯爵领的石匠们工作得更加谨慎，以弥补铸钟失败的耻辱。"
 pam_cathedral_bell_bronze_torture_implements_modifier: "青铜刑具"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "一口铸造失败的座堂大钟的青铜废料，被重新做成了恐怖的刑具。钟匠成了它们的第一个牺牲品。工匠们如今知道了失败的代价。"
 pam_cathedral_treadwheel_crane_modifier: "踏轮起重机"
 pam_cathedral_treadwheel_crane_modifier_desc: "一座来自主教座堂工地的大型踏轮起重机，已在首都竖立起来。"
 pam_cathedral_cantoria_scam_modifier: "被揭穿的骗局"
 pam_cathedral_cantoria_scam_modifier_desc: "在一场骗局被揭穿后，建造者们以重燃的节俭与高效投入工作。"
 pam_cathedral_famed_choir_boy_modifier: "宫廷的天使之声"
 pam_cathedral_famed_choir_boy_modifier_desc: "一名嗓音绝美的唱诗班男孩为该宫廷增光添彩。"
 pam_cathedral_sermon_peace_county_modifier: "和平布道"
 pam_cathedral_sermon_peace_county_modifier_desc: "一位统治者在主教座堂新建门廊前的布道，使该伯爵领的民众更加满足，朝圣者也能更安全地行走于其道路之上。"
 pam_cathedral_sermon_peace_ruler_modifier: "引向和平"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "该统治者被主教座堂关于基督和平的布道感动。"
 pam_cathedral_sermon_diligence_county_modifier: "勤奋布道"
 pam_cathedral_sermon_diligence_county_modifier_desc: "一位统治者在主教座堂新建门廊前的布道，激励了教堂的建筑工人和石匠们勤奋工作。"
 pam_cathedral_sermon_diligence_ruler_modifier: "引向勤奋"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "该统治者被主教座堂关于神圣劳动的布道感动。"
 pam_cathedral_sermon_unity_county_modifier: "团结布道"
 pam_cathedral_sermon_unity_county_modifier_desc: "一位统治者在主教座堂新建门廊前的布道，推动了该伯爵领的集体顺从。"
 pam_cathedral_sermon_unity_ruler_modifier: "引向和谐"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "该统治者被主教座堂关于基督教团契的布道感动。"
 pam_cathedral_sermon_charity_county_modifier: "慈善布道"
 pam_cathedral_sermon_charity_county_modifier_desc: "统治者在新建的大教堂门廊前的布道，让伯爵领的民众打开钱包，人心温暖。"
 pam_cathedral_sermon_charity_ruler_modifier: "引导向善"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "该统治者被主教座堂关于慷慨施舍的布道感动。"
 pam_cathedral_sermon_perseverance_county_modifier: "坚忍布道"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "统治者在新建的大教堂门廊前的布道，重新点燃了该伯爵领的虔诚追求和有序发展。"
 pam_cathedral_sermon_perseverance_ruler_modifier: "引向狂热"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "该统治者被主教座堂关于信仰赛跑的布道感动。"
 pam_cathedral_sermon_rejoice_county_modifier: "喜乐布道"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "一位统治者在主教座堂新建门廊前的布道，用主不变的爱让信徒们充满了希望。"
 pam_cathedral_sermon_rejoice_ruler_modifier: "引向欢乐"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "该统治者被主教座堂关于主里喜乐的布道感动。"
 pam_cardinal_order_improve_development_modifier: "枢机指令：提高发展度"
 pam_cardinal_order_improve_development_modifier_desc: "奉上级的命令，一位枢机正致力于促进当地总主教区的发展。"
 pam_cardinal_order_convert_faith_modifier: "枢机指令：信仰皈依"
 pam_cardinal_order_convert_faith_modifier_desc: "奉上级的命令，一位枢机正致力于加强当地总主教区及周边地区的皈依工作。\n\n$EFFECT_LIST_BULLET$该[county|E]的[convert_county|E]：#P +25%#!"
 pam_cardinal_order_increase_control_modifier: "枢机指令：提高伯爵领控制度"
 pam_cardinal_order_increase_control_modifier_desc: "奉上级的命令，一位枢机正致力于安抚当地总主教区的民众。"
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "枢机指令：加速文化热潮"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "奉上级的命令，一位枢机正致力于加快新科技的研究。"
 pam_cardinal_order_improve_epidemic_resistance_modifier: "枢机指令：提高瘟疫抗性"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "奉上级的命令，一位枢机正调动教会的资源以协助减轻瘟疫。"
 pam_cardinal_order_improve_legitimacy_modifier: "枢机指令：提高合法性"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "奉上级的命令，一位枢机正致力于强化当地总主教区统治者的合法性。"
 pam_cardinal_order_undermine_legitimacy_modifier: "枢机指令：破坏合法性"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "奉上级的命令，一位枢机正致力于削弱当地总主教区统治者的合法性。"
 heathen_mandate_modifier: "异端徒宣说正统性"
 heathen_mandate_modifier_desc: "一位异教统治者手下的神职人员声称拥有这片土地上的灵魂，他们虚假的信仰背书了这可憎的主张。"
 pam_recently_baptized_at_domicile_modifier: "最近受洗"
 pam_recently_baptized_at_domicile_modifier_desc: "该角色在其总主教座堂群的洗礼堂接受了洗礼。"
 pam_khachkar_ancestral_county: "祖先十字架石"
 pam_khachkar_ancestral_county_custom_desc: "由[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed]的[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]为[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetHerHis]竖立"
 pam_denied_new_pope_modifier: "拒绝新教宗"
 pam_denied_new_pope_modifier_desc: "该角色拒绝承认新当选的教宗。"
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "神圣立场"
 pam_dulia_relic_piety_per_dread_modifier: "殉道者光环"
 pam_dulia_relic_piety_per_knight_modifier: "东道主的祝福"
 pam_dulia_relic_stress_loss_per_piety_modifier: "抚慰恩典"
 pam_dulia_relic_piety_per_legitimacy_modifier: "圣人傅油"
 pam_dulia_relic_learning_per_piety_modifier: "光辉奉献"
 pam_dulia_relic_monthly_piety_modifier: "恩典之泉"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "信经仲裁者"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "该角色在大公会议尚未开启辩论之前，便已平息了一场关于信经措辞的争端。"
 pam_ecumenical_council_primacy_upheld_modifier: "管辖得以维持"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "该角色在公开会议上被问及信仰下的所有教堂应当隶属于谁的管辖，并当场在席位上就敲定了这个问题的答案。"
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "新代祷者"
 pam_dulia_new_saint_modifier_desc: "该角色受最近宣布的新圣人的启发。"
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "所有教座的朝圣者"
 pam_pilgrim_of_every_holy_site_modifier_desc: "该角色于其信仰所承认的每一处圣地守夜祈祷。"
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "遵守伦常"
 tenet_harmonious_society_five_bonds_modifier_desc: "该角色将君臣、父子、夫妇、长幼、朋友这五伦之一维系得井然有序。"
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "祝圣之链"
 tenet_apostolic_succession_episcopate_modifier_desc: "该角色所属信仰之中，每一位主教都是由一位先于他受祝圣的主教所祝圣的，由此赋予了稳固的正统性。"
 modifier_definition_value_per_theocratic_vassal: "\t#weak 随每名[theocratic_vassal|E]提高（最多[EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')]）#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "信徒的唱经团"
 tenet_divine_liturgy_choirs_modifier_desc: "在该角色持有的每一座教堂中，同样的经文在同样的时辰被吟唱，自任何在世者出生之前便已如此。"
 modifier_definition_value_per_held_temple: "\t#weak 随持有的每座[temple_holding|E]提高（最多[EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')]）#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "能力出众的主持者"
 tenet_divine_liturgy_officiant_modifier_desc: "该角色对其信仰的神圣礼仪怀有极为谨敬的遵从。"
 tenet_divine_liturgy_schola_cantorum_modifier: "咏经学校"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "一位领主若开办圣歌学校，其麾下的礼乐师便值得一听。"
 tenet_pentarchy_holy_site_modifier: "宗主教座"
 tenet_pentarchy_holy_site_modifier_desc: "该伯爵领的圣地在信众的管理下繁荣兴旺。"
 tenet_polyamory_new_beloved_modifier: "因新爱而生辉"
 tenet_polyamory_new_beloved_modifier_desc: "一位新欢让该角色满心欢喜。"
 modifier_definition_value_per_chaplain_learning: "\t#weak 随每点[court_chaplain|E][learning|E]提高（最多[EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')]）#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "惩罚之债"
 tenet_purgatory_sin_penalty_modifier_desc: "忏悔可得赦免，但那罪招致的惩罚之债并不会因此一笔勾销。今生未清偿的，来世必要追偿。而信众自能看清，该角色究竟选择了这两条道路中的哪一条。"
 tenet_original_sin_sinners_insight_modifier: "罪人的洞察"
 tenet_original_sin_sinners_insight_modifier_desc: "凡是背负罪的人，都清楚地知道罪藏在别人身上的哪里。"
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "染血"
 pam_holy_weapon_1_artifact_modifier_desc: "该[holy_relic|E]随军获得了针对[faith|E]之敌的胜利。虔诚者已开始关注它。"
 pam_holy_weapon_2_artifact_modifier: "战火淬炼"
 pam_holy_weapon_2_artifact_modifier_desc: "对其他[religions|E]赢得了如此多的胜利，以至于信徒不再称之为运气。"
 pam_holy_weapon_3_artifact_modifier: "著名圣物"
 pam_holy_weapon_3_artifact_modifier_desc: "它声名远播，虔信之士一见到它，精神便为之振奋。"
 pam_holy_weapon_4_artifact_modifier: "天命之器"
 pam_holy_weapon_4_artifact_modifier_desc: "无论谁携带该圣物，都被视为在行使神的旨意；那些与其并肩同行之人，也因此而战意坚决。"
