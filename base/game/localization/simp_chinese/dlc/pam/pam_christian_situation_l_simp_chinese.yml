 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "[GetRiteByKey('roman_rite').GetAdherentNamePlural]与[GetRiteByKey('byzantine_rite').GetAdherentNamePlural]之间的对立，已将基督教世界向[Concept( 'schism', '大分裂')|E]推进了多少。\n\n一旦积累足够多的不满，教会可能会分裂。$GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon!#alert_trial [GetFaithByKey( 'christian_faith').GetName]在[Concept( 'schism', '大分裂')|E]发生或被阻止前无法拥有[head_of_faith|E]#!\n\n#help 增加方式：\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName]投票从[rites|E]中移除[core_tenet|E]或[doctrine|E]\n$BULLET_WITH_TAB$在[GetActivityType('activity_ecumenical_council').GetName]的辩论之前，两种礼仪间的争斗\n$BULLET_WITH_TAB$[GetSituation('the_christian_church').GetName]两种礼仪间的[kings|E]或以上等级的[war|E]\n$BULLET_WITH_TAB$一种礼仪的[holy_site|E]皈依另一种礼仪\n$BULLET_WITH_TAB$降级任一礼仪的[holy_site|E]\n$BULLET_WITH_TAB$[head_of_rite|E]被另一种礼仪谋杀#!"
