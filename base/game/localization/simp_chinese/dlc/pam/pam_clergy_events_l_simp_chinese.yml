l_simp_chinese:
 pam_clergy_events.0001.t: "你愿以何名被呼召？"
 pam_clergy_events.0001.desc: "我的[chaplain.GetCouncilTitle|l][chaplain.GetFirstName]翻到圣伯多禄继任者登记册的下一页空白，这是[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )]的见证。\n\n#emp “你所选择的名字，将比你的统治时间长一千代。”#!\n\n[chaplain.GetHerHis|U]手中的羽毛笔对准了墨迹必须落下的位置。\n\n#emp “你愿以何名号被称呼？”#!"
 pam_clergy_events.0001.a: "让它永远为人所知。"
 pam_clergy_events.0003.t: "信条重塑"
 pam_clergy_events.0003.desc: "[pam_recast_rite.GetNameNoTooltip]的一项核心信条在[pam_recast_pope.GetTitledFirstName]的领导下发生了变更：[tenet_to_remove.GetBaseName]替换为[tenet_to_add.GetBaseName]。"
 pam_clergy_events.0010.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U]的意志"
 pam_clergy_events.0010.desc.intro: "作为[cardinalate.GetHolder.GetTitleAsNameNoTooltip]，我即是[Select_CString( actor.IsFemale, '圣母', '圣父' )|U]意志的延伸。\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "我尊崇其于万有之上的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]引领我履行作为[cardinalate.GetHolder.GetTitleAsNameNoTooltip]的职责。\n\n"
 pam_clergy_events.0010.desc: "凭[actor.GetHerHis]无限的智慧，[actor.GetTitledFirstName]认定我应当致力于"
 pam_clergy_events.0010.desc.develop: "推动公共工程的建设，使[archdiocese.GetName]内所有的[recipient.GetFaith.GetAdherentNamePlural]繁荣昌盛。"
 pam_clergy_events.0010.desc.convert_faith: "推动并巩固[archdiocese.GetName]及其周边地区[ROOT.Char.Custom('GetUnbelieverNamePlural')]归信的事业。"
 pam_clergy_events.0010.desc.increase_control: "安抚[archdiocese.GetName]群众的事业。"
 pam_clergy_events.0010.desc.cultural_fascination: "加速新兴学识的探索事业，从而造福于[actor.GetHerHis]的[actor.GetCulture.GetCollectiveNoun]信众同胞。"
 pam_clergy_events.0010.desc.epidemic_resistance: "在[archdiocese.GetName]调动教会资源，以协助疫病的防控。"
 pam_clergy_events.0010.desc.improve_legitimacy: "强化[archdiocese.GetName]内[recipient.GetFaith.GetAdjective]君主正统性的使命。"
 pam_clergy_events.0010.desc.undermine_legitimacy: "贬损[archdiocese.GetName]内[recipient.GetFaith.GetAdjective]君主正统性的使命。"
 pam_clergy_events.0010.a: "“我将如您所愿，[actor.Custom('FormOfAddressForLiege')]！”"
 pam_clergy_events.0010.b: "什一税有更好的用途……"
 pam_clergy_events.0030.t: "我们有教宗了"
 pam_clergy_events.0030.t.female: "我们有教宗了"
 pam_clergy_events.0030.desc: "白烟在[new_pope.GetCurrentLocation.GetName]中心升起，宣告一位新的[new_pope.GetTitledFirstName]已经选出：\n\n“愿圣宗徒伯多禄与保禄——我们所信靠其权柄与威能者——在主面前为我们代求。愿全能的天主，圣父、圣子及圣神的祝福，降于你身上，永远与你同在。”\n\n“阿们。”"
 pam_clergy_events.0030.a: "荣耀归于圣伯多禄之座。"
 pam_clergy_events.0030.b: "似乎一位假先知现身了。"
 pam_clergy_events.0030.b.tt: "[GetDecisionWithKey('declare_antipope_decision').GetName][decision|E]花费降低，持续#V 15年#!"
 pam_clergy_events.0030.aa: "谁在乎教会的事务？"
 pam_clergy_events.0030.aa.tt: "将来的“我们有教宗了”事件将会以消息方式出现"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName]当选[head_of_faith|E]。"
 pam_clergy_events.0040.opening: "致虔诚的[head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]，"
 pam_clergy_events.0040.desc: "鉴于枢机团人数减少，我认为将你擢升为枢机是恰当的。愿你的虔诚与智慧在这有需要的时刻巩固教会。"
 pam_clergy_events.0040.appoint_tt: "你被任命为[cardinal|E]"
 pam_clergy_events.0040.a: "我接受这神圣的重担。"
 pam_clergy_events.0041.opening: "致圣伯多禄之座，"
 pam_clergy_events.0041.desc: "枢机团尚未满员，你并未补充我们最虔诚的[ROOT.Char.GetWomenMen]留下的空缺。\n\n我不会让教会无人守护！我将亲自戴上枢机红帽。"
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U]自立为[cardinal|E]"
 pam_clergy_events.0041.a: "这种傲慢不会被遗忘。"
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "枢机团的席位空悬，而教会不能坐等仪式。我们中最虔诚的几位已一同领受红帽，枢机团于是再度完整。\n\n我们相信您会宽恕我们的仓促。"
 pam_clergy_events.0042.a: "完整的枢机团能更好地为我服务。"
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "信仰的重大改变"
 pam_clergy_events.0051.desc: "我在[county.GetNameNoTier|U]的座位在我身下摇晃。我毕生致力于服侍的那些灵魂，如今却作为[new_faith.GetAdherentNamePlural]祈祷。\n\n我是否该改信以维持控制？这样我便能照料[title.GetName]的子民，但我还能真正帮助那些不再是[old_faith.GetAdherentNamePlural]的人吗？我们所有人被迫奉行[new_faith.GetNameNoTooltip]，这难道能带来任何好处吗？！"
 pam_clergy_events.0051.a: "做必要之事，只为我的羊群服务。"
 pam_clergy_events.0051.a.keep_see_tt: "你维持对[title.GetName]的控制"
 pam_clergy_events.0051.b: "我只能服务[old_faith.GetAdherentNamePluralNoTooltip]同胞。"
 pam_clergy_events.0051.b.tt: "你的所有[landed|E][titles|E]被摧毁"
 pam_clergy_events.0051.c: "我接受我的职位的结束。"
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER 你会建立一座[adventurer|E][camp|E]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER 你[game_over|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "[title.GetNameNoTooltip]的终结"
 pam_clergy_events.0052.desc: "无论如何走到这一步，我已不能再名正言顺地引领[title.GetDefinitiveName]。教会曾置于我手中的一切，如今正从这双手中离去。"
 pam_clergy_events.0052.a: "就这样吧。"
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "圣伯多禄之座上的[new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetDynasty.GetNameNoTooltip][new_prelate.GetFaith.ReligiousHeadName|U]"
 pam_clergy_events.0060.t.antipope: "[new_prelate.GetDynasty.GetNameNoTooltip]宣称[new_prelate.GetFaith.ReligiousHeadTitleName|U]"
 pam_clergy_events.0060.t.archbishop: "[new_prelate.GetDynasty.GetNameNoTooltip]接管牧杖"
 pam_clergy_events.0060.desc.intro: "我们一直寻求引导基督教世界，无论是以御座还是讲坛。如今，[new_prelate.GetFaith.HighGodName|U]决定将[new_prelate.GetDynasty.GetName]擢升至新的高度。\n\n"
 pam_clergy_events.0060.desc.pope: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))][new_prelate.GetFirstName]已登上圣伯多禄之座，成为[new_prelate.GetFaith.HighGodNamePossessive]在尘世的代理人。"
 pam_clergy_events.0060.desc.head_of_faith: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))][new_prelate.GetFirstName]持有[prelate_title.GetDefinitiveName]。"
 pam_clergy_events.0060.desc.hof_outro: "国王与皇帝不过是其[Select_CString( new_prelate.IsFemale, '圣母', '圣父' )|U]意志阴影下的孩童。一支由[new_prelate.GetFaith.BishopMalePlural]组成的大军，如今听命于一位[new_prelate.GetDynasty.GetNameNoTooltip]族人。"
 pam_clergy_events.0060.desc.antipope: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))][new_prelate.GetFirstName]已被宣布为[new_prelate.GetFaith.ReligiousHeadName|U]，而另一位却仍在位。每一名[new_prelate.GetFaith.GetAdherentName]现在都必须选择谁才是[new_prelate.GetFaith.HighGodName|U]的代表。在尘埃落定之前，我们所有人的灵魂都处于危险之中。"
 pam_clergy_events.0060.desc.archbishop: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))][new_prelate.GetFirstName]已被授予[prelate_title.GetDefinitiveName]之职。什一税、修院以及[new_prelate.GetHerHim]治下每一位[new_prelate.GetFaith.BishopNeuter]的祝圣，如今都由[new_prelate.GetDynasty.GetNameNoTooltip]宗族的人掌管。"
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.GetHerHis|U]信仰[new_prelate.GetFaith.GetNameNoTooltip]而非[ROOT.Char.GetFaith.GetNameNoTooltip]，但我们仍然是一家人。"
 pam_clergy_events.0060.a: "这是对教会和[new_prelate.GetDynasty.GetNameNoTooltip]宗族的祝福。"
 pam_clergy_events.0060.a.antipope: "这场纷争我可不想继承。"
 pam_clergy_events.0060.b: "我希望更仔细地审视一下[prelate_title.GetDefinitiveNameNoTooltip]。"
 pam_clergy_events.0060.b.antipope: "只有我能解决这场危机。"
 pam_clergy_events.0060.b.tt: "@warning_icon!你将放弃当前角色，之后无法再继续扮演。\n\n#TUT 当[new_prelate.GetShortUINameNoTooltip]去世时，你将扮演你的[player_heir|E]，其将通过[appointment|E]或选举而非[dynasty|E]继承接任这一[ecclesiastical|E]职位。#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U]与你信仰不同。你将继续作为[new_prelate.GetFaith.GetAdherentName]。"
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U]凭借违抗而非选举占据该职位。所有拒绝承认这一宣称的人，都会为它而来。"
