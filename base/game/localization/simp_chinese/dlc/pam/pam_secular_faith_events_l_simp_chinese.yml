l_simp_chinese:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "一种超越你自身[faith|E]的习俗已在你心中生根，你获得了关于[pam_sf_seeded_tenet.GetBaseName][core_tenet|E]的[agnostic_knowledge|E]。"
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U]担任了[TARGET_CHARACTER.GetShortUIName]的代父母，这份精神上的亲属关系逐渐发展成了友谊。"
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]担任了[CHARACTER.GetShortUIName]的代父母，这份精神上的亲属关系逐渐发展成了友谊。"
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]因共同的信仰而走近。"
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]成为了最亲密的朋友，共同的信仰加深了他们之间的纽带。"
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U]庇护了[TARGET_CHARACTER.GetShortUIName]，使其免受宗教迫害。"
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]庇护了[CHARACTER.GetShortUIName]，使其免受宗教迫害。"
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]因共同的信仰成为了情人。"
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]在共同的神圣放纵夜后成为了情人。"
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]在告解室中得到的不只是赦罪，由此成为了情人。"
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]在探讨信仰的奥妙后成为了情人。"
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U]与[TARGET_CHARACTER.GetShortUIName]成为了灵魂伴侣，他们的爱因共同的信仰而加深。"
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U]把[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip]的圣职卖给了一个付得起钱的陌生人。"
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]把[CHARACTER.GetShortUINamePossessiveNoTooltip]的圣职卖给了一个付得起钱的陌生人。"
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U]把[CHARACTER.GetShortUIName]送进了修道院，强迫[CHARACTER.GetHerHim]立下神圣誓言。"
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U]把[TARGET_CHARACTER.GetShortUIName]送进了修道院，强迫[TARGET_CHARACTER.GetHerHim]立下神圣誓言。"
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "尊敬的父亲"
 pam_my_liege_reverend_mother: "尊敬的母亲"
 pam_my_liege_captain: "长官"
 pam_my_liege_khan: "大汗"
 pam_my_liege_khatun: "大可敦"
 pam_my_liege_chieftain: "酋长"
 pam_my_liege_serene_lord: "最尊贵的领主"
 pam_my_liege_serene_lady: "最尊贵的女士"
 pam_my_liege_lord: "大人"
 pam_my_liege_lady: "女士"
 pam_my_liege_liege: "大人"
 pam_secular_faith_events.0001.t: "圣烟"
 pam_secular_faith_events.0001.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，拿着香炉沿着中殿走。圣烟飘到房梁上，带着会众低声念出的祈祷。\n\n有那么一刻，整个世界仿佛都在朝[ROOT.Char.GetFaith.PositiveAfterLife]靠近，我也跟着它一起。"
 pam_secular_faith_events.0001.a: "我会沉浸在祈祷中。"
 pam_secular_faith_events.0001.b: "此礼仪应敬献给[ROOT.Char.GetFaith.WealthGodName]。"
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('GetCourt')]应当分享这份虔诚。"
 pam_secular_faith_events.0002.t: "拯救生命"
 pam_secular_faith_events.0002.desc: "[traveler_in_danger.GetTitledFirstName]，一名途经我的领地的旅人，在[background_terrain_scope.GetName]遭到了匪徒袭击。\n\n[traveler_in_danger.GetHerHis|U]的生命正处在危险之中，但在[ROOT.Char.GetFaith.HighGodNamePossessive]的圣日动武是被禁止的。安息日不是我能打破的规矩。如果我等到日落再出发，赶过去可能只能为[traveler_in_danger.GetHerHim]收尸。\n\n然而，当一条生命岌岌可危时，我怎么能袖手旁观？"
 pam_secular_faith_events.0002.a: "生命重于一切，我们上马。"
 pam_secular_faith_events.0002.b: "我必须请教我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )][chaplain.GetFirstNameNoTooltip]。"
 pam_secular_faith_events.0002.c: "我不会违背安息日。"
 pam_secular_faith_events.0003.t: "夜中幻象"
 pam_secular_faith_events.0003.desc: "我醒过来，身上缠着的东西不只是梦——一道火柱，一个叫得出我名字的声音，一张我忘不掉的脸……\n\n来找我的是[ROOT.Char.GetFaith.HighGodName]吗？是[ROOT.Char.GetFaith.HealthGodName]吗？还是伪装成和善模样的[ROOT.Char.GetFaith.DevilName]……\n\n或许这只是血液里烧出来的一阵昏乱。"
 pam_secular_faith_events.0003.a: "那声音低语着至福的真理……"
 pam_secular_faith_events.0003.b: "发烧引发的昏乱……我得去查阅下相关病例记载。"
 pam_secular_faith_events.0003.c: "[ROOT.Char.Custom('GetCourt')]必须听说我所见到的！"
 pam_secular_faith_events.0004.t: "禁忌真相"
 pam_secular_faith_events.0004.desc: "我睡不着，满脑子都是疑虑，在我[ROOT.Char.Custom('ResidenceBuilding')]那片漆黑的[ROOT.Char.Custom('ResidenceBuildingHallsType')]里来回踱步。\n\n我的思绪不断飘向我的信仰所谴责的事物：[pam_sf_forbidden_tenet.GetBaseName]。这本该让我感到不安——可我却觉得这个信念里藏着某种正当的真理，我没法把这个念头从脑子里赶出去。"
 pam_secular_faith_events.0004.a: "我将坚持真理——但会保持沉默。"
 pam_secular_faith_events.0004.b: "不，我不会迷失。"
 pam_secular_faith_events.0005.t: "烛光下"
 pam_secular_faith_events.0005.desc_intro: "晚间的研读本是为了让心绪平静，但有一段话始终萦绕不去。\n\n"
 pam_secular_faith_events.0005.desc_tenet: "这和他们称作[pam_sf_revelation_tenet.GetBaseName]的信条有关，这套行事方式是我自身的信仰绝不会容许的。我告诉自己这是野蛮的。"
 pam_secular_faith_events.0005.desc_doctrine: "这和[pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )]的教义有关，这套说教是我的信仰绝不会容许的。我告诉自己这是错误的。"
 pam_secular_faith_events.0005.desc_end: "但是，在烛光下，我发现自己能理解为何另一个灵魂会执着于此。"
 pam_secular_faith_events.0005.a: "我必须把思绪付诸笔端。"
 pam_secular_faith_events.0005.b: "理解它并无害处。"
 pam_secular_faith_events.0005.c: "祈祷将净化这些念头。"
 pam_secular_faith_events.0006.t: "圣人遗骨"
 pam_secular_faith_events.0006.desc: "一名风尘仆仆的朝圣者在集市上引起了我的注意。[relic_seller.GetHerHis]颤抖的手里握着一根泛黄的指骨。\n\n“这是一位圣人的骨头，”这个[relic_seller.GetWomanMan]发誓说，“我在前往[GetTitleByKey('c_jerusalem').GetNameNoTier]的路上找到它的，但它放在一位[ROOT.Char.GetTitleAsNameNoTooltip]手里会更安全。”\n\n懂行的人能判断这个说法的真假。巧的是，这件圣物正待出售。"
 pam_secular_faith_events.0006.a: "让我先评估一下，再考虑付钱。"
 pam_secular_faith_events.0006.b: "我会买下它。"
 pam_secular_faith_events.0006.c: "陌生人的骨头对我没用。滚吧。"
 pam_sf_acquire_relic_tt: "你获得一件普通[rarity|E]的遗物[artifact|E]"
 pam_sf_examine_relic_tt: "你获得了一件遗物[artifact|E]，其[rarity|E]受你的[learning_i][learning_skill|E]影响"
 pam_sf_acquire_relic_toast: "获得圣物"
 pam_sf_fingerbone_relic_name: "圣[SCOPE.Custom('PamFingerboneSaint')]的指骨"
 pam_sf_fingerbone_relic_desc: "一根泛黄的指骨，被尊为圣[SCOPE.Custom('PamFingerboneSaint')]的遗骨，存放在一个小型圣物匣中。"
 pam_secular_faith_events.0007.t: "傲慢的主教"
 pam_secular_faith_events.0007.desc: "我手下的一位[defiant_bishop.GetTitleAsNameNoTooltip]，[defiant_bishop.GetFirstName]，骄傲而人脉广阔，而且显然确信自己比我强。最近有几个仆人病倒了，我需要[defiant_bishop.GetHerHim]来为我的家宅祝福。\n\n在无视我的传唤好几天之后，[defiant_bishop.GetSheHe]终于来了。“我请求原谅我的迟到，”[defiant_bishop.GetSheHe]得意地笑着说，“但我听命于一位比任何[ROOT.Char.GetTitleAsNameNoTooltip]都更伟大的主。”"
 pam_secular_faith_events.0007.a: "以你的职位应得的体面行事。"
 pam_secular_faith_events.0007.b: "拜托了，快举行仪式吧。"
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName]或许是你的主，但我才是你的领主。滚出去！"
 pam_secular_faith_events.0008.t: "罪恶之重"
 pam_secular_faith_events.0008.desc: "蜡烛快要燃尽了，同一个念头又回来了。我犯下了[penance_sin.GetName( ROOT.Char )]，而我的信仰将这列为罪行之一。\n\n无论我多少次把这个念头推到一边，负罪感都没有消失。\n\n“规训你自己，你的灵魂就能卸下重担。”我的[ROOT.Char.Custom2( 'RelationToMeShort', confessor )]，[confessor.GetFirstName]，没有斥责也没有定罪。“完成这项苦修，不要偏离。”"
 pam_secular_faith_events.0008.a: "我会听从[confessor.GetFirstNameNoTooltip]的建议。"
 pam_secular_faith_events.0008.b: "现在不行，我还没准备好。"
 pam_secular_faith_events.0009.t: "似基督的陌生人"
 pam_secular_faith_events.0009.desc: "我的大门前站着一个浑身是疤的独行陌生人，伸出手来讨要施舍。\n\n“但愿我没有打扰您，[ROOT.Char.Custom('ComplimentAdjective')][ROOT.Char.GetTitleAsNameNoTooltip]。”[stranger.GetSheHe]优雅地鞠了一躬说道，“如果您的财力允许，我恳求能分到一小部分。”\n\n身为乞丐，[stranger.GetSheHe|U]的谈吐异常得体。你永远不知道自己拒之门外的会是什么人。"
 pam_secular_faith_events.0009.a: "进来吧，我的[ROOT.Char.Custom('ResidenceBuilding')]为你敞开。"
 pam_secular_faith_events.0009.b: "拿着这面包，平安地去吧。"
 pam_secular_faith_events.0010.t: "谁从寒冷中来"
 pam_secular_faith_events.0010.desc_blessed: "我放进门的这个[stranger.GetWomanMan]根本不是普通流浪汉——[stranger.GetFirstName]谈论经文和政治如此从容，连我手下那些有学问的人都安静下来听他讲话。\n\n看来[ROOT.Char.GetFaith.HighGodName]终究来到了我的门前。我不会让[stranger.GetHerHim]继续漂泊下去。"
 pam_secular_faith_events.0010.desc_thief: "我醒过来，看到壁炉是冷的，保险箱也敞着。\n\n面包和住所，换来的却是最古老的背叛。\n\n[stranger.GetFirstName]连夜走了，我的财物也跟着[stranger.GetHerHim]一起消失。\n\n等宅子里的人醒过来，[stranger.GetSheHe]早就逃出了我的领地，我再也抓不到[stranger.GetSheHe]了。"
 pam_secular_faith_events.0010.a: "你被派来这里是有原因的。"
 pam_secular_faith_events.0010.b: "我邀请了一条毒蛇入席。"
 pam_secular_faith_events.0011.t: "忏悔者"
 pam_secular_faith_events.0011.desc: "我醒来时听到的不是雷声，而是鞭笞的裂响。\n\n一群忏悔者聚在我的[ROOT.Char.Custom('ResidenceBuilding')]外，他们的后背皮开肉绽、鲜血淋漓，宣称他们的[ROOT.Char.GetFaith.HighGodName]要求践行[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )]。\n\n我家里的人都等着我拿主意。"
 pam_secular_faith_events.0011.a: "这背后是否有更深层的真相？"
 pam_secular_faith_events.0011.b: "也鞭笞我吧——因为我也犯了错。"
 pam_secular_faith_events.0011.c: "将这疯子逐出我的领地！"
 pam_secular_faith_events.0012.t: "纹章祝福"
 pam_secular_faith_events.0012.desc: "和平是一笔借贷，从来不是白给的礼物。\n\n在[ROOT.Char.GetFaith.WarGodName]的节庆日，我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，提出要为我家族的纹章祝圣。\n\n“神，祢曾赐予大卫对抗歌利亚的力量，求祢将那同样的力量赐予[ROOT.Char.GetHouse.GetBaseName]家族——愿你们永远能起身守护弱者。”[chaplain.GetSheHe]祈祷道。"
 pam_secular_faith_events.0012.a: "祝福我的旗帜与刀剑，以备危难。"
 pam_secular_faith_events.0012.b: "让我们为和平祈祷吧。"
 pam_secular_faith_events.0012.c: "轻声的祝福便已足够。"
 pam_secular_faith_events.0013.t: "死亡宣告"
 pam_secular_faith_events.0013.desc: "一个眼神狂乱的传教士被拖到我面前。[prophet.GetSheHe]被指控煽动暴民和预言吉凶，毫不耽搁地伸出颤抖的手指指向我的[ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )]，[doomed_soul.GetTitledFirstName]。\n\n“记下这个人！”[prophet.GetSheHe]喊道。“下一次月亮升起之前，[doomed_soul.GetSheHe]就要冰冷地躺在地下。[ROOT.Char.GetFaith.HighGodName]已经把确切的启示告诉我了！”\n\n[prophet.GetHerHis|U]的笃定让人不安，[doomed_soul.GetFirstNamePossessiveNoTooltip]的恐惧更是如此。"
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName]借陌生人的口发声……"
 pam_secular_faith_events.0013.b: "滚开，你这疯疯癫颠的蠢货！"
 prophecy_foretold_tt: "预言已经降下，万一它是真的呢？"
 prophecy_foretold_2_tt: "预言已经降下，但纯纯胡说八道！"
 pam_secular_faith_events.0014.t: "预言应验"
 pam_secular_faith_events.0014.desc_fulfilled: "一轮新月已经过去，[doomed_soul.GetTitledFirstName]死了——[doomed_soul.GetHerHis]在睡梦中安静地离世。\n\n那个衣衫破烂的传教士精准说出了死亡的时刻。我没法忘掉这件事。\n\n这到底是预言……还是恐惧具象成了现实？"
 pam_secular_faith_events.0014.desc_failed: "一轮新月已经过去，[doomed_soul.GetTitledFirstName]还活着。那个衣衫破烂的传教士指定的时刻来了又去，什么也没带走。\n\n[prophet.GetSheHe|U]是个骗子，或者是个傻子，但绝对不是[ROOT.Char.GetFaith.HighGodName]的代言人。"
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\n我觉得自己相当蠢。"
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U]是一位真正的先知！"
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName]的行事方式神秘莫测。"
 pam_secular_faith_events.0014.c: "我为什么会相信[prophet.GetHerHis]那该死的预言！？"
 pam_secular_faith_events.0014.d: "我真该相信那个预言……"
 pam_secular_faith_events.0014.e: "我就说那个传教士是骗子！"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U]获得宗教[inspiration|E]"
 pam_secular_faith_events.0015.t: "哭泣的圣像"
 pam_secular_faith_events.0015.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，催促我赶往[miracle_church.GetName]。教堂内，一位圣徒画像的眼睛正流下芬芳的油。\n\n关于神迹的消息比任何信使都传得快，而神迹是一种既强大也危险的事物。"
 pam_secular_faith_events.0015.a: "神迹？必须加以调查。"
 pam_secular_faith_events.0015.b: "让信徒们来吧，我们会接待他们。"
 pam_secular_faith_events.0015.c: "这祝福不能与人分享。"
 pam_secular_faith_events.0015.d: "我的领地受到了祝福！"
 no_miracles_tt: "这个神迹很可疑……"
 pam_secular_faith_events.0016.t: "讲台有价"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U][candidate.GetWomanMan]走进我的[ROOT.Char.Custom('ResidenceBuilding')]，不是来求一个恩惠，而是来买一个。\n\n“你的[old_realm_priest.GetCouncilTitle]，[old_realm_priest.GetFirstName]，是一位好牧人。”[candidate.GetSheHe]低声说道，把一个鼓鼓的钱袋放在桌上，“但我将证明自己是一位更……懂得感恩的人。任命我接替[old_realm_priest.GetHerHis]的职位，你就能收获[ROOT.Char.GetFaith.WealthGodNamePossessive]的祝福。”"
 pam_secular_faith_events.0016.desc_sanctioned: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )]并没有羞耻，而银子也是极好。"
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )]是一种罪恶。收下那笔金子将玷污我的灵魂。"
 pam_secular_faith_events.0016.a: "毕竟，黄金比罪恶更有分量……"
 pam_secular_faith_events.0016.b: "公平的价格，公平的交易。这个职位是你的了。"
 pam_secular_faith_events.0016.c: "这个职位不是用来卖的。"
 pam_secular_faith_events.0017.t: "[ROOT.Char.Custom('GetCourt')|U]的异端"
 pam_secular_faith_events.0017.desc: "“异端！”我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，伸出指责的手指向[accused.GetFirstName]。“你难道看不出[accused.GetFirstNamePossessiveNoTooltip]那卑劣的[accused.GetRite.GetAdjective]势力正在影响你的[ROOT.Char.Custom('GetCourt')]吗？[accused.GetSheHe|U]必须忏悔，皈依[ROOT.Char.GetFaith.HighGodName]。”\n\n[accused.GetFirstNameNoTooltip]面无表情，可这指控显然已经刺痛了[accused.GetHerHim]。"
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip]，让我带你皈依正信。"
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip]皈依了"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName]无动于衷"
 pam_secular_faith_events.0017.b: "那就去牢房忏悔吧。逮捕[accused.GetHerHim]。"
 pam_secular_faith_events.0017.c: "够了。[accused.GetFirstNameNoTooltip]受我庇护。"
 pam_secular_faith_events.0018.t: "献给神的孩子"
 pam_secular_faith_events.0018.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', pious_child )]，[pious_child.GetFirstName]，和大多数孩子不一样。别的孩子在玩耍的时候，[pious_child.GetSheHe]整天待在小教堂里。\n\n“我从没见过像[pious_child.GetHerHim]这样的孩子，”我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]轻声说，“[pious_child.GetSheHe|U]会花好几个小时祈祷，做弥撒的时候会流泪。再清楚不过了：[pious_child.GetFirstNameNoTooltip]想要过[GetTrait('devoted').GetName( pious_child )]的生活。”"
 pam_secular_faith_events.0018.a: "侍奉[ROOT.Char.GetFaith.HighGodName]，但继续待在这里。"
 pam_secular_faith_events.0018.b: "教会将得到我的[pious_child.Custom('GetDaughterSon')]。"
 pam_secular_faith_events.0018.c: "不，[pious_child.GetSheHe]属于[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家族。"
 pam_secular_faith_events.0019.t: "神的和平"
 pam_secular_faith_events.0019.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，带着沉重的消息来了。\n\n“在[ROOT.Char.GetFaith.HighGodNamePossessive]的注视下，兄弟不该与兄弟互相残杀。”[chaplain.GetSheHe|U]郑重宣告。“[feud_attacker.GetTitledFirstName]和[feud_defender.GetTitledFirstName]已经彼此拔剑相向，而流血的是那些小民！”\n\n“停下这事。让[GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )]约束他们。”"
 pam_secular_faith_events.0019.a: "以[ROOT.Char.GetFaith.HighGodName]之名，和平将实现。"
 pam_secular_faith_events.0019.b: "每一位拔剑的领主都将为此负责。"
 pam_secular_faith_events.0019.c: "我的封臣之间的纷争，应该由我来裁决。"
 pam_sf_peace_of_god_ends_wars_tt: "所有你的[vassals|E]的[war|E]均以[white_peace|E]结束"
 pam_secular_faith_events.0020.t: "[temple_location.GetNameNoTooltip]的[ROOT.Char.GetFaith.HouseOfWorship|U]"
 pam_secular_faith_events.0020.desc: "石匠们把最后一块石头安放在了我主持修建的第一座[ROOT.Char.GetFaith.HouseOfWorship]，坐落在[temple_location.GetName]的[temple_location.Custom('TerrainTypeProvincePrefix')][temple_location.Custom('TerrainTypeProvince')]上。\n\n我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，手拿香炉，在场地中行走。\n\n“人们会因为您献给[ROOT.Char.GetFaith.HighGodName]的[ROOT.Char.GetFaith.HouseOfWorshipPlural]而记住您，”[chaplain.GetSheHe]说。“让这座成为众多中的第一座。”"
 pam_secular_faith_events.0020.a: "[chaplain.GetFirstNameNoTooltip]，带领我们祈祷。"
 pam_secular_faith_events.0020.b: "让[consecrated_county.GetNameNoTierNoTooltip]在[ROOT.Char.GetFaith.HouseOfWorship]周围繁荣起来。"
 pam_secular_faith_events.0020.c: "我将在这些围墙之内寻求智慧。"
 pam_secular_faith_events.0020.d: "我才刚刚开始[ROOT.Char.GetFaith.HighGodNamePossessive]的工作。"
 pam_secular_faith_events.0021.t: "天上的异象"
 pam_secular_faith_events.0021.desc: "睡不着。我走到[ROOT.Char.Custom('GetCourtyard')]的寂静暗处，抬头望向天空。今晚，天空向我显现了[ROOT.Char.Custom('GetPamCelestialOmen')]。\n\n这样的征兆从来都不是毫无意义的。"
 pam_omen_blood_moon: "一轮暗红色的月亮"
 pam_omen_star_host: "一片本不该出现的星群"
 pam_omen_comet: "一簇双尾彗星"
 pam_omen_falling_stars: "一片流星雨"
 pam_omen_moon_halo: "环绕月亮的一圈苍白光晕"
 pam_omen_eclipse: "一轮被蚀成铜色月牙的月亮"
 pam_omen_wandering_star: "一颗明亮的流浪之星"
 pam_secular_faith_events.0021.a: "我将研究这个征兆。"
 pam_secular_faith_events.0021.b: "[ROOT.Char.GetFaith.HighGodNamePossessive]的眷顾在其间闪耀。"
 pam_secular_faith_events.0021.c: "这征兆预示着征服！"
 pam_secular_faith_events.0021.d: "天空并不欠我答案。"
 pam_secular_faith_events.0022.t: "[ROOT.Char.GetTitleAsNameNoTooltip]的触碰"
 pam_secular_faith_events.0022.desc_intro: "我的[ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )]，[sick_courtier.GetFirstName]，拖着步子朝我走来，脸色苍白，站不稳身子。\n\n"
 pam_secular_faith_events.0022.desc_ill: "“[ROOT.Char.Custom('FormOfAddressForLiege')]，我日渐衰弱，得了可怕的[illness_trait.GetName( GetNullCharacter )]，完全看不到治愈的希望。就连医生[physician.GetTitledFirstName]也不知道我得了什么病！”[sick_courtier.GetSheHe]哀叹道。\n\n"
 pam_secular_faith_events.0022.desc_other: "“我日渐衰弱，得了[illness_trait.GetName]，完全看不到治愈的希望。就连医生[physician.GetTitledFirstName]，也不知道我得了什么病！”[sick_courtier.GetSheHe]哀叹道。\n\n"
 pam_secular_faith_events.0022.desc_end: "“我听说，加冕者的手带着[ROOT.Char.GetFaith.HighGodNamePossessive]的赐福。这是我最后的希望了。”"
 pam_secular_faith_events.0022.a: "来吧，让我用手轻抚你。"
 pam_secular_faith_events.0022.b: "不……我会在原地为你赐福。"
 pam_sf_kings_touch_gamble_tt: "我的触碰或许能让[sick_courtier.GetFirstName]从病痛中康复，但也可能让我染上疾病……"
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName]从病床上爬起"
 pam_sf_kings_touch_infected_toast: "疾病也传到了我身上"
 pam_sf_kings_touch_nothing_toast: "我的触碰未能给[sick_courtier.GetFirstName]带来任何改变"
 pam_secular_faith_events.0023.t: "流浪抄写员"
 pam_secular_faith_events.0023.desc: "一个消瘦的[scholar.GetWomanMan]被带到我面前，[scholar.GetHerHis]手指上沾着墨水，腋下夹着书卷。\n\n“我是[scholar.GetFirstName]，一名抄写员兼学者。”[scholar.GetSheHe]接着说，“我没有家，也没有赞助者。这双手生来不是做苦力的，而是用来把[ROOT.Char.GetTitleAsNameNoTooltip]的话记录在[ROOT.Char.Custom('GetWritingMaterial')]上。”\n\n“我恳求您，给我一口饭和一个容身的地方，我会忠心侍奉您。”"
 pam_secular_faith_events.0023.a: "学者？把你懂的教给我。"
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip]需要你的帮助。"
 pam_secular_faith_events.0023.c: "我的账本需要一只稳健的手。"
 pam_secular_faith_events.0023.d: "我不需要你。滚开。"
 pam_secular_faith_events.0024.t: "进入修道院"
 pam_secular_faith_events.0024.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', rival_character )]，[rival_character.GetFirstName]，一如往常，在[ROOT.Char.Custom('GetCourt')]里是个[rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)][rival_character.Custom2('InsultNounClumsy', ROOT.Char)]，同时也是个[rival_character.Custom2('InsultAdjective', ROOT.Char)][rival_character.Custom2('InsultNoun', ROOT.Char)]。但收到来自[archdiocese.GetName]的[archbishop.GetTitledFirstName]的信时，我的心情好了起来。\n\n“[rival_character.GetFirstName]会很好地侍奉[ROOT.Char.GetFaith.HighGodName]，”[archbishop.GetSheHe]在信中写道，“修道院会很乐意接纳[rival_character.GetHerHim]。”\n\n世人很快就会忘记那些在那里跪下的人。"
 pam_secular_faith_events.0024.a: "于是，[ROOT.Char.GetFaith.HighGodName]又收获了一位“自愿”的仆人！"
 pam_secular_faith_events.0024.b: "我宁愿让敌人处于我的视线之内。"
 pam_secular_faith_events.0025.t: "[Select_CString( ROOT.Char.IsFemale, '代母', '代父' )]"
 pam_secular_faith_events.0025.desc: "“我希望皈依[ROOT.Char.GetFaith.GetAdjective]信仰，身心皆是。”我的[ROOT.Char.Custom2( 'RelationToMeShort', converting_char )]，[converting_char.GetFirstName]，郑重地说。“我希望接受洗礼，成为一名[ROOT.Char.GetRite.GetAdherentName]……并且请求你站在洗礼池边，做我的[Select_CString( ROOT.Char.IsFemale, '代母', '代父' )]。”"
 pam_secular_faith_events.0025.a: "那就让所有人都见证我们新关系！"
 pam_secular_faith_events.0025.b: "信仰无需盛大的场面。"
 pam_secular_faith_events.0025.c: "我无法接受这份荣誉。"
 pam_secular_faith_events.0026.t: "受纠缠的灵魂"
 pam_secular_faith_events.0026.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', afflicted )]，[afflicted.GetFirstName]，从来没有真正神智清醒过……可[afflicted.GetSheHe]甚至开始不再像是自己了。\n\n“[ROOT.Char.GetFaith.EvilGodNames]！我的身体里有[ROOT.Char.GetFaith.EvilGodNames]！”[afflicted.GetSheHe]在[ROOT.Char.GetFaith.HouseOfWorship]的地板上抽搐着，狂乱地叫喊。\n\n我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，脸色发白。“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，我担心[afflicted.GetHerHis]的灵魂正被恶魔纠缠。能帮到[afflicted.GetHerHim]的唯一办法，就是进行一场驱魔仪式。”"
 pam_secular_faith_events.0026.a: "[afflicted.GetSheHe|U]需要妥善照料。"
 pam_secular_faith_events.0026.b: "我将亲自主导驱魔仪式。"
 pam_secular_faith_events.0026.c: "这是神圣的工作。交给你处理。"
 pam_secular_faith_events.0026.d: "把[afflicted.GetHerHim]赶出去，免得恐慌蔓延！"
 pam_sf_exorcism_success_toast: "驱魔成功"
 pam_sf_exorcism_failed_toast: "驱魔失败"
 pam_secular_faith_events.0027.t: "信仰危机"
 pam_secular_faith_events.0027.desc: "“[ROOT.Char.GetFaith.HighGodName]，您听得见我吗？”我轻声开口。但在心底深处，我知道[ROOT.Char.GetFaith.HighGodNameSheHe|U]不会理会我这样的罪人。\n\n我是不是弄错了[ROOT.Char.GetFaith.HighGodHerHis|U]的旨意？[old_tenet.GetName( ROOT.Char.GetRite )]难道不是[ROOT.Char.GetFaith.HighGodHerHis|U]智慧的真正显现吗？\n\n光线落在十字架上，有什么希望在我心里醒了过来。"
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName]要求[new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]！"
 pam_secular_faith_events.0027.b: "或许……[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]？"
 pam_secular_faith_events.0027.c: "我在劫难逃，其他人也逃不过……"
 pam_secular_faith_events.0028.t: "我的灵魂，归于平静"
 pam_secular_faith_events.0028.desc: "我跪在[ROOT.Char.GetFaith.HouseOfWorship]里，[ROOT.Char.GetFaith.HighGodName]的存在渗进了我灵魂的每一处角落。\n\n崇敬[old_tenet.GetName( ROOT.Char.GetRite )]让我看到了真理。我从未感受过这样的平静。我怎么能把这样的喜悦只留给自己？难道我不应该带领其他人走向同样的光明，让他们看到真理吗？"
 pam_secular_faith_events.0028.a: "我会找到愿意倾听的人。"
 pam_secular_faith_events.0028.b: "但是，我真正的热情在于[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]！"
 pam_secular_faith_events.0028.c: "我应该把我的感受写在[ROOT.Char.Custom('GetWritingMaterial')]上。"
 pam_secular_faith_events.0029.t: "亡者来访"
 pam_secular_faith_events.0029.desc: "“醒醒，[ROOT.Char.GetFirstNameNoTooltip]，”一个熟悉的声音响起。“我在这里，[departed.Custom2( 'RelationToMeShort', root_scope )]……在你需要我的时候。”\n\n我动了动，额头上沾着汗。那道幻影晃了一下，随即消失了。\n\n那难道是……我的[ROOT.Char.Custom2( 'RelationToMeShort', departed )]？"
 pam_secular_faith_events.0029.a: "[departed.GetSheHe|U]平安地守护着我。"
 pam_secular_faith_events.0029.b: "那……是个警告吗？"
 pam_secular_faith_events.0029.c: "不过是心魔作祟，仅此而已。"
 pam_secular_faith_events.0030.t: "隐修者"
 pam_secular_faith_events.0030.desc: "“我想要离[ROOT.Char.GetFaith.HighGodName]更近，”我的[ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )]，[would_be_anchorite.GetFirstName]，郑重地说，“这个世界满是让人分心的东西，我想要彻底的独处。”\n\n[would_be_anchorite.GetSheHe|U]望着我[ROOT.Char.Custom('ResidenceBuilding')]的墙壁，用手指顺着墙面摸过去。\n\n“[church_scope.GetName]的[ROOT.Char.GetFaith.HouseOfWorship]很美。我希望被封闭在它的围墙里，在不停的祈祷中度过余生。”"
 pam_secular_faith_events.0030.a: "如果你有意，我的石匠随时听候差遣。"
 pam_secular_faith_events.0030.b: "不，这个我不会答应你。"
 pam_secular_faith_events.0031.t: "学者之争"
 pam_secular_faith_events.0031.desc: "“怎么会有人否认[tenet_1.GetBaseName]的神圣性？”我的[ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )]，[disputant_one.GetFirstName]喊道。\n\n“胡说！[tenet_2.GetBaseName]能让你更接近神明，这再清楚不过了！你什么都没学到吗？”我的[ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )]，[disputant_two.GetFirstName]反驳道。"
 pam_secular_faith_events.0031.a: "学者辩论？让我拿一下笔记……"
 pam_secular_faith_events.0031.b: "我被[tenet_1.GetBaseNameNoTooltip]打动。"
 pam_secular_faith_events.0031.c: "[tenet_2.GetBaseNameNoTooltip]说得真切。"
 pam_secular_faith_events.0031.d: "活跃的[ROOT.Char.Custom('GetCourt')]正是博学的[ROOT.Char.Custom('GetCourt')]。"
 pam_secular_faith_events.0032.t: "诱惑时刻"
 pam_secular_faith_events.0032.desc_food: "我醒来，枕头被口水浸湿了一块。厨房里飘来烤[ROOT.Char.Custom('RegionalEdibleMeat')]和塞了[ROOT.Char.Custom('GetFoodDetail')]的[ROOT.Char.Custom('GetRandomRegionalSmallGame')]的香气，[ROOT.Char.Custom('RegionalDrink')]杯的碰撞声和欢快的说话声从[ROOT.Char.Custom('ResidenceBuildingHallsType')]里传过来。\n\n因我的[vice_trait.GetName( GetNullCharacter )]，[ROOT.Char.GetFaith.PriestNeuterPlural]命令我斋戒……但[ROOT.Char.GetFaith.HighGodName]为什么偏偏要在这个晚上考验我？\n\n我感觉我的决心正跟着肚子里的咕咕声一起散掉。"
 pam_secular_faith_events.0032.a: "[ROOT.Char.GetFaith.HighGodName]认可了我的冲动！"
 pam_secular_faith_events.0032.b: "不，斋戒还没过，我必须忍耐。"
 pam_secular_faith_events.0032.c: "尝一小口……又有谁会知道呢？"
 pam_secular_faith_events.0033.t: "枕边布道"
 pam_secular_faith_events.0033.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )]，[believing_spouse.GetFirstName]，信奉着[believing_spouse.GetRite.GetName]，夜里总乐意把相关教义轻声讲给我听。\n\n“我[ROOT.Char.Custom('RomanticComplimentAdjective')][believing_spouse.Custom2( 'RelationToMeShort', root_scope )]，你知道吗？[new_tenet.Custom('GetGenericTenetSentence')]，这真#EMP 令人着迷#!。”[believing_spouse.GetSheHe|U]说着，紧紧抱住我。\n\n[believing_spouse.GetHerHis|U]的热情就像[believing_spouse.GetHerHis]的笑容一样迷人。"
 pam_secular_faith_events.0033.a: "嗯，给我多讲点……"
 pam_secular_faith_events.0033.b: "#EMP 你#!更令人着迷！到我怀里来。"
 pam_secular_faith_events.0033.c: "拜托，我的[believing_spouse.Custom('RomanticComplimentNoun')]，我得睡觉了。"
 pam_secular_faith_events.0034.t: "弃婴"
 pam_secular_faith_events.0034.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，以前从来不会迟到的……[ROOT.Char.GetFaith.HouseOfWorship]的寂静被一阵婴儿微弱的哭声打破。\n\n“仁慈的[ROOT.Char.GetFaith.HighGodName]……”[chaplain.GetFirstNameNoTooltip]低声说着，轻轻把孩子抱在怀里，“因为[trait_scope.GetName( GetNullCharacter )]而被遗弃……没有哪个灵魂该承受这样的命运。”\n\n孩子的小手指卷曲着握住[chaplain.GetHerHis]的拇指。"
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName]赐给了我一个[foundling.Custom('GetDaughterSon')]。"
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip]会收留[foundling.GetHerHim]。"
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip]将抚养这个孩子。"
 pam_secular_faith_events.0034.d: "我才不在乎孩子。"
 pam_secular_faith_events.0035.t: "克修"
 pam_secular_faith_events.0035.desc: "地上有血。顺着鞭打的声音找过去，我看到了我的[ROOT.Char.Custom2( 'RelationToMeShort', sufferer )]，[sufferer.GetFirstName]。一把深红色的鞭子在[sufferer.GetHerHis]手里，眼泪顺着[sufferer.GetHerHis]的脸颊流下来。\n\n“我[sinful_trait.GetName( GetNullCharacter )]的欲望快要把我吞掉了，”[sufferer.GetSheHe]喘着气说，“鞭子的刺痛，总好过诱惑的烈火。”\n\n“这份痛会过去，但[ROOT.Char.GetFaith.NegativeAfterLife|U]不会。”"
 pam_secular_faith_events.0035.a: "有趣……把鞭子给我。"
 pam_secular_faith_events.0035.b: "让[sufferer.GetHerHim]自己苦修吧。"
 pam_secular_faith_events.0035.c: "看在[ROOT.Char.GetFaith.HighGodNamePossessive]的份上，别做这种蠢事了。"
 pam_sf_scourge_abandoned_toast: "被遗弃的灾祸"
 pam_secular_faith_events.0036.t: "隐士的智慧"
 pam_secular_faith_events.0036.desc: "一个衣衫褴褛的[hermit.GetWomanMan]求见，自称是从遥远的[hermit_location.GetName][hermit_location.Custom('TerrainTypeProvince')]来的隐士。\n\n“整整七个晚上，[ROOT.Char.GetFaith.HighGodName]都不让我合眼，”[hermit.GetSheHe]神情严肃地说，“这不是为了惩罚我，而是要让我的脑子里装满本该传给别人、传给你的真理。”\n\n“听清楚我的话，并留心在意。然后我就会回到我的独居中去。”"
 pam_secular_faith_events.0036.a: "你能传授什么奥秘？"
 pam_secular_faith_events.0036.b: "我愿意学习。"
 pam_secular_faith_events.0036.c: "滚开，乞丐。"
 pam_secular_faith_events.0037.t: "肉欲启示"
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U]流淌至深夜，一位来访的流浪者，[reveler.GetFirstName]，凑近了过来。"
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U]流淌至深夜，我的[ROOT.Char.Custom2( 'RelationToMeShort', reveler )]，[reveler.GetFirstName]，凑近了过来。"
 pam_secular_faith_events.0037.desc: "没过多久，我几乎所有注意力都被[reveler.GetHerHis]的[reveler.Custom('ObjectifiedFeature')]吸引过去。\n\n“有些祷告是用嘴说的，”[reveler.GetSheHe]一边慢慢脱下自己的[reveler.Custom('GetClothingArticle')]一边说，“还有些祷告是用身体做的。想不想看看[reveler.Custom('pam_sf_carnal_art')]，我的[ROOT.Char.Custom('RaunchyComplimentNoun')]。”\n\n[reveler.GetSheHe|U]向我伸出手。“接下来的欢愉，能比得上[ROOT.Char.GetFaith.PositiveAfterLife]里的极乐。”"
 pam_secular_faith_events.0037.a: "把你身后的门关好了，让我看看。"
 pam_secular_faith_events.0037.b: "遮好身体，[reveler.GetWomanMan]。"
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "盘绕的巨蟒"
 pam_sf_carnal_art_2: "潺潺的小溪"
 pam_sf_carnal_art_3: "缠绕的藤蔓"
 pam_sf_carnal_art_4: "交缠的紧缚"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "贯竹的撑入"
 pam_sf_carnal_art_6: "母马的技巧"
 pam_sf_carnal_art_7: "绽放的莲花"
 pam_sf_carnal_art_8: "因陀罗的妻子"
 pam_sf_carnal_art_9: "挺立的蛇头"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "情人的绳结"
 pam_sf_carnal_art_11: "玫瑰与荆棘"
 pam_sf_carnal_art_12: "吟游诗人的秘密"
 pam_sf_carnal_art_13: "手捧的火焰"
 pam_secular_faith_events.0038.t: "乐园的滋味"
 pam_secular_faith_events.0038.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', reveler )]，[reveler.GetFirstName]，又往盘子里添了些[ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')]，隔着桌子朝我咧嘴笑。\n\n“你饿着肚子、举着空杯子去追寻[ROOT.Char.GetFaith.HighGodName]。我却在成熟的水果、丰足的肉、笑声和歌声里找到了[ROOT.Char.GetFaith.CreatorHerHim]，”[reveler.GetSheHe]举起满满一杯酒。\n\n“[ROOT.Char.GetFaith.HighGodNamePossessive]的礼物本是为被享用而赐下的，[ROOT.Char.Custom('FormOfAddressForLiege')]。浪费我们得到的东西？那才是大罪恶！”"
 pam_secular_faith_events.0038.a: "或许，神性就在酒杯中……"
 pam_secular_faith_events.0038.b: "那么我将举办一场盛宴以示敬意。"
 pam_secular_faith_events.0038.c: "伪装成虔诚的堕落，不了。"
 pam_secular_faith_events.0039.t: "黑暗中的祈祷"
 pam_secular_faith_events.0039.desc: "我的[ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )]，[spymaster_scope.GetFirstName]，走到我面前，[spymaster_scope.GetHerHis]仍因自己计谋的成果而感到不安。\n\n“我跪在[secret_keeper.GetTitledFirstName]身边祈祷，[ROOT.Char.Custom('FormOfAddressForLiege')]，我撒了谎——一句小小的、带着虔诚意味的假话，轻声说出来好哄得[secret_keeper.GetHerHis]开口。”\n\n“[secret_keeper.GetSheHe|U]在[ROOT.Char.GetFaith.HighGodName]的大殿里坦白了[secret_keeper.Custom('GetSecretCrimeConfessionIndef')]，”[spymaster_scope.GetSheHe]压低了声音，“我说出了[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]……或许这种欺骗，是我们欠[ROOT.Char.GetFaith.HighGodName]的职责？”"
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName]确实在暗中行事……"
 pam_secular_faith_events.0039.b: "卑鄙的把戏……直接告诉我秘密吧。"
 pam_secular_faith_events.0040.t: "信徒的血肉"
 pam_secular_faith_events.0040.desc: "晚餐时，我的[ROOT.Char.Custom2( 'RelationToMeShort', scholar )]，[scholar.GetFirstName]，摊开一本翻旧了的厚书。又一堂课要开始了。\n\n“[Glossary( '伊赛多涅斯人', 'ISSEDONES_GLOSS' )]不安葬死者，[ROOT.Char.Custom('FormOfAddressForLiege')]。他们会把死者吃掉！”[scholar.GetSheHe]说，几乎没停下来喘气，“亡父的肉和羊肉混在一起，还将他的头骨镀金，当作圣物珍藏。对他们来说，这是子女所能表现出的最真实的爱。”\n\n“而最妙的部分是什么？”[scholar.GetSheHe]咧嘴一笑，“希罗多德本人既不认为他们邪恶，也不认为他们疯狂。他说，#EMP ‘习惯，乃是万物的主宰。’#!”"
 pam_secular_faith_events.0040.a: "哦，这些我全都知道。"
 pam_secular_faith_events.0040.b: "阴暗的习俗……再说些。"
 pam_secular_faith_events.0040.c: "[ROOT.Char.GetFaith.HighGodName]在上啊，[scholar.GetWomanMan]，我正要吃饭呢！"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "古希腊历史学家希罗多德描述的一支遥远北方的草原民族。当一个人的父亲去世时，他的亲族会宰杀牲畜，把肉和死者的肉混在一起，在庄重的葬礼宴席上分食。然后头骨会被剥皮、洗净、镀金，当作圣物来保存，每年都要对之举行祭典。希罗多德将这样的仪式与希腊人的火葬并列，并不是要谴责它们，而是要表明“习惯乃是万物的主宰”——每个民族都认为自己的一套方式最为正当。"
 pam_secular_faith_events.0041.t: "裸体的真相"
 pam_secular_faith_events.0041.desc: "我在自己的花园里散步时，发现一位陌生人站在[ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')]花坛间，对方正从我的[ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')]果树上摘果子——这人像刚出生时那样赤身露体，身上仅有的遮盖物是飘落的树叶。\n\n“哦，一位[ROOT.Char.GetTitleAsName]！你为什么要躲在布料和王冠后面？”[adamite.GetSheHe]在[ROOT.Char.GetFaith.HighGodName]与我面前毫无愧色地发问，“我已经接纳了最初的那种纯真，那时我们赤身生活，没有恐惧。”\n\n[adamite.GetSheHe|U]又咬了一口果子，汁水顺着[adamite.GetHerHis]的皮肤往下流。“或许你也该这么做。”"
 pam_secular_faith_events.0041.a: "我也渴望这种自由。"
 pam_secular_faith_events.0041.b: "吃完我的水果，讲述你的故事，然后离开。"
 pam_secular_faith_events.0041.c: "将这个擅闯者关起来。"
 pam_secular_faith_events.0042.t: "轻车熟路"
 pam_secular_faith_events.0042.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )]，[sponsor_character.GetFirstName]，在花园里和我碰面，手里拿着打开的钱袋，脸上带着温和的笑意。\n\n“让我来承担你[GetActivityType( 'activity_pilgrimage').GetName]的费用吧，[ROOT.Char.Custom('FormOfAddressForLiege')]。朝圣的路上不该数钱——轻松上路，并我们两人祈祷。”\n\n钱币是真的。这份钱币背后的信任，也是真的。"
 pam_secular_faith_events.0042.a: "我将怀着感恩的心走上这条路。"
 pam_secular_faith_events.0042.b: "我会收下钱币并据为己有。"
 pam_secular_faith_events.0042.c: "留着你的钱吧，朋友。"
 pam_sf_pilgrimage_sponsor_tt: "如果你在#V 7#!年内完成[GetActivityType( 'activity_pilgrimage').GetName]，[sponsor_character.GetFirstName]对你的好感将提高#P 50#!"
 pam_sf_pilgrimage_sponsor_toast: "心怀喜悦的赞助人"
 pam_secular_faith_events.0043.t: "朝圣者的欢迎"
 pam_secular_faith_events.0043.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', holy_man )]，[holy_man.GetFirstName]，在祭坛前握住我的双手。\n\n走上朝圣之路吧，[ROOT.Char.Custom('FormOfAddressForLiege')]。等你回来，我会在[capital_county.GetNameNoTier]的每一座广场上宣告你完成了[GetActivityType( 'activity_pilgrimage').GetName]。你的人民会知道，他们的[ROOT.Char.GetTitleAsNameNoTooltip]曾为他们屈膝祈祷。”"
 pam_secular_faith_events.0043.a: "我便踏上朝圣之路。"
 pam_secular_faith_events.0043.b: "我有很多世俗事务要处理。"
 pam_sf_extolled_pilgrimage_toast: "人民欢欣鼓舞"
 pam_secular_faith_events.0044.t: "教会的耳朵"
 pam_secular_faith_events.0044.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )]，[friendly_bishop.GetFirstName]，今天来的时候心情格外好。\n\n“我最近在同僚那里很受认可——主教们、修道院长们，那些在教会里有分量的声音。要是你需要他们的虔诚见解，或是他们的道德权威，我可以替你出面说情。”\n\n[friendly_bishop.GetFirstNamePossessiveNoTooltip]在热衷权力的[ROOT.Char.GetFaith.PriestNeuterPlural]那里攒下的情面，很容易就消耗干净。"
 pam_secular_faith_events.0044.a: "那就以我的名义发言。"
 pam_secular_faith_events.0044.b: "你的友谊本就是足够的祝福。"
 pam_secular_faith_events.0045.t: "顿悟"
 pam_secular_faith_events.0045.desc: "它像晴天里劈下的闪电一样袭来——是顿悟。\n\n教义、信条、礼仪、信仰。之前还像上千个零散念头的东西，此刻在我面前拼成了唯一的真相。"
 pam_secular_faith_events.0045.a: "未来在召唤我引领前行。"
 pam_secular_faith_events.0045.b: "我将沉浸在此刻。"
 pam_secular_faith_events.0046.t: "共同信念"
 pam_secular_faith_events.0046.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', intimate )]，[intimate.GetFirstName]，在谈及[shared_tenet.GetName( intimate.GetRite )]时，无法藏住眼中的信念。\n\n“[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )]让我做的一切都有了意义，”[intimate.GetSheHe]说，“只有一样东西对我来说同样重要……那就是你，我[ROOT.Char.Custom('ComplimentAdjective')][intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))]。”\n\n一滴眼泪顺着[intimate.GetHerHis]的脸颊滑落。“我只想让你知道。”"
 pam_secular_faith_events.0046.a: "让共同的信念加深我们的关系！"
 pam_secular_faith_events.0046.b: "共享这份信念……就像爱一样。"
 pam_secular_faith_events.0046.c: "感谢你的分享。"
 pam_secular_faith_events.0047.t: "虔诚奉献"
 pam_secular_faith_events.0047.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，在胸前画了十字，低下了[chaplain.GetHerHis]的头。\n\n“[ROOT.Char.GetFaith.HighGodName]将王冠戴在你的额上，自有其深意。我忠心地侍奉你，也是在践行[ROOT.Char.GetFaith.HighGodHerHis|U]的意志。”[chaplain.GetSheHe]郑重宣告。\n\n“我已向[ROOT.Char.GetFaith.HighGodName]宣誓忠诚。现在，我也愿意向你立下这个誓言。”"
 pam_secular_faith_events.0047.a: "那就全心全意地为我效劳。"
 pam_secular_faith_events.0047.b: "你必须始终将[ROOT.Char.GetFaith.HighGodName]放在首位。"
 pam_secular_faith_events.0048.t: "恶魔之梦"
 pam_secular_faith_events.0048.desc: "我醒来，却无法动弹。\n\n一个扭曲的身影在我面前手舞足蹈，咯咯怪笑。是恶魔吗？恐惧慢慢漫遍我的全身。“呵……呵……你的罪孽很重。很快[ROOT.Char.GetFaith.EvilGodNames]就会来收了你！”\n\n不管这是梦还是真的恶魔，我都没法当作什么都没发生。我必须与[ROOT.Char.GetFaith.HighGodName]达成和解。"
 pam_secular_faith_events.0048.a: "这个梦……一定意味着什么。"
 pam_secular_faith_events.0048.b: "只是一场梦，继续睡吧。"
 pam_secular_faith_events.0048.c: "[ROOT.Char.GetFaith.HighGodName]保佑我！我必须忏悔。"
 pam_sf_demon_torment_modifier_tt: "要移除该修正，你必须建造一座[GetBuilding('temple_01').GetName][holding|E]，或者进行一次[GetActivityType('activity_pilgrimage').GetName]"
 pam_sf_demon_torment_lifted_toast: "折磨消退"
 pam_secular_faith_events.0049.t: "“天使品级”"
 pam_secular_faith_events.0049.desc: "从我礼拜堂传来的不是祈祷的声音。\n\n“对的，#emp 对的#!大人！让这个可怜的罪人在[GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]里找到该待的位置！”我的[ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )][lustful_priest.GetFirstName]狂喜地喊道，“我是条在泥里扭动的虫子，充满世俗的欲望。#emp 惩罚我！#!”\n\n[ROOT.Char.GetFaith.HighGodName]啊，我的礼拜堂里究竟发生了什么！？"
 pam_secular_faith_events.0049.a: "这一定是某种仪式，我得……记笔记。"
 pam_secular_faith_events.0049.b: "如果是在#EMP 我的#!礼拜堂里，那#emp 我要#!加入！"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip]，一个堕落者！？恶心，但有用。"
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U][chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0050.desc: "[ROOT.Char.GetFaith.HouseOfWorship]里的蜡烛摇曳，但丝毫无法驱散我满脑子的邪念。\n\n“跟我到告解室来，[ROOT.Char.Custom('FormOfAddressForLiege')]。”我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]低声说。我的目光停在[chaplain.GetHerHis][chaplain.Custom('ObjectifiedFeature')]上。“无论你的灵魂背负着什么，都只管说出来，不用害怕。”\n\n[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )]是神圣的……但有一桩罪比所有罪都更沉重：[chaplain.GetFirstNamePossessive][chaplain.Custom('AdmiredFeature')]。"
 pam_secular_faith_events.0050.a: "……你的告解室还能容下两个人吗？"
 pam_secular_faith_events.0050.b: "原谅我，[chaplain.GetMotherFather]，我有不洁的念头。"
 pam_secular_faith_events.0051.t: "你的主"
 pam_secular_faith_events.0051.desc: "#EMP “我是你的主，”#!一个洪亮的声音在[ROOT.Char.GetFaith.HouseOfWorship]中回荡。#EMP “你要在我面前下拜。”#!\n\n我跪倒在地，视线变得模糊。我擦去脸上的一道血痕。\n\n#EMP “我，你的主，命令你：用你全部的心和全部的灵魂来服从我。”#!一个声音变成了一百个。一百个又变成了一千个。#EMP “你若不服从，我必诅咒你，直到你被毁灭，因为你离弃了我，你的主。”#!"
 pam_secular_faith_events.0051.a: "我会……服从……"
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial 即将发生可怕或美妙的事……#!"
 pam_sf_lord_your_god_tt: "求您，[ROOT.Char.GetFaith.HighGodName]……发发慈悲。"
 pam_sf_voice_of_jesus_toast: "耶稣之声"
 pam_sf_stroke_of_god_toast: "神罚"
 pam_secular_faith_events.0052.t: "逝去之后"
 pam_secular_faith_events.0052.desc: "在[resting_church.GetNameNoTier]的[ROOT.Char.GetFaith.HouseOfWorship]里，我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，在我之前的统治者们那磨损的墓石板前停下脚步。\n\n“[ROOT.Char.GetFaith.HighGodName]赐给你的冬天比多数人都多，[ROOT.Char.Custom('FormOfAddressForLiege')]。决定自己如何安息并非罪过。”\n\n“将你的尊容刻于石上，还是穿上修士的[Glossary( '朴素风帽', 'AD_SUCCURRENDUM_GLOSS' )]——选择在你。”"
 pam_secular_faith_events.0052.a: "照着我的模样雕刻……但要更年轻，更好看一些。"
 pam_secular_faith_events.0052.b: "朴素兜帽已经足够。"
 pam_secular_faith_events.0052.c: "坟墓有的是耐心。"
 pam_sf_effigy_planned_tt: "如果在你死后一场[GetActivityType( 'activity_funeral').GetName]为你举办，举办人将获得[prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#![prestige|E]"
 pam_sf_cowl_burial_planned_tt: "如果在你死后一场[GetActivityType( 'activity_funeral').GetName]为你举办，举办人将获得[piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#![piety|E]"
 pam_sf_effigy_unveiled_toast: "雕像揭幕"
 pam_sf_cowl_burial_toast: "素服安息"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "临终前矢发誓愿并穿上会衣，即所谓#G “为了被救助”#!而死，是中世纪基督教世界大领主们的最后手段。统治者临死前希望身着朴素的风帽斗篷而非锦衣华服下葬，以便审判前被列入谦卑修士之中，而非列入权贵。"
 pam_secular_faith_events.0053.t: "圣物前行"
 pam_secular_faith_events.0053.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，像助产士般小心翼翼地掀起圣物匣的盖子。里面躺着我家族的珍宝：[procession_relic.GetName]。\n\n“锁起来的圣物帮不了任何人，[ROOT.Char.Custom('FormOfAddressForLiege')]，”[chaplain.GetSheHe]说，“赐给你的人民一次[Glossary( '圣物展示', 'OSTENSION_GLOSS' )]——让这件圣物被所有人看见，祝福从这里到城门之间的每一条街。”"
 pam_secular_faith_events.0053.a: "我将亲自护送圣物匣。"
 pam_secular_faith_events.0053.b: "我将独自守夜。"
 pam_secular_faith_events.0053.c: "我不敢动它。"
 pam_sf_procession_gamble_tt: "街道并非宝库，宝物可能受损……"
 pam_sf_relic_jostled_toast: "被人群推挤"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "展示圣遗物的庄重巡游。在盛大的节日，圣物从宝库中取出，穿行于街巷田野间，使得附着于圣坛的祝福得以沿途触及每一灵魂。巡游的圣物所到之处，无不吸引人群、钱财与声名。"
 pam_secular_faith_events.0054.t: "水盆与布"
 pam_secular_faith_events.0054.desc: "脚边的水盆冒着热气，[ROOT.Char.Custom('GetCourt')]的人都聚在一旁围观。我面前的凳子上坐着一个[pauper.Custom2('dummy_peasant_profession', pauper)]，看得出来很紧张，[pauper.GetHerHis]的光脚沾满了泥。那股味……很明显。\n\n就在这个夜晚，救主曾亲自拿着水盆和布跪下。[Glossary( '濯足礼', 'MANDATUM_GLOSS' )]已经准备妥当，水是温的，大厅里每一双眼睛都在看着我。\n\n剩下要做的只有跪下——或是改变主意。"
 pam_secular_faith_events.0054.deviant: "#EMP 我会用舌头舔干净那双美味的足。#!"
 pam_secular_faith_events.0054.a: "跪下，接过布。"
 pam_secular_faith_events.0054.b: "跪下，亲吻这双疲惫的脚。"
 pam_secular_faith_events.0054.c: "我……做不到。把盆拿走。"
 pam_sf_odorous_feet_tt: "跪下时，我会感到圣洁……但更永远忘不了农夫的脚臭"
 pam_sf_odorous_feet_toast: "恶臭不散"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "濯足礼，得名于基督在最后的晚餐中所言：#G “我给你们一条新命令。”#!每年复活节前一周的星期四，君士坦丁堡的皇帝和西方的国王们都会端着水盆和布巾，跪在选定的穷人面前，为他们洗脚，并把银币塞进他们掌心——这一夜，厅堂里最有权势的头颅，压得最低。"
 pam_secular_faith_events.0055.t: "青铜之声"
 pam_secular_faith_events.0055.desc: "[bell_church.GetName]的老钟裂了，于是被重铸。今天，新钟挂在钟楼里闪闪发亮。钟下站着我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，带着水、圣油和盐。\n\n“钟必须先[Glossary( '领洗', 'BELL_BAPTISM_GLOSS' )]，才能为[ROOT.Char.GetFaith.HighGodName]发声，”[chaplain.GetSheHe]坚持道，袖子已经挽了起来，“洗净、傅油、命名——之后，无论是恶魔还是风暴都不会让它沉默。”"
 pam_secular_faith_events.0055.a: "那就洗净、傅油，并赐名吧。"
 pam_secular_faith_events.0055.b: "这是青铜，而非灵魂——告诫上是这么说的。"
 pam_secular_faith_events.0055.c: "简短祝福即可，敲响它吧。"
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "教堂的钟和基督徒一样，都接受祝圣：用圣水清洗，用圣油敷抹，起一位圣人的名字——有些人甚至充当钟的代父母。查理曼的#G 《广训》#!在789年禁止为钟付洗，但这项习俗照样延续了数个世纪。领过洗的钟被相信能驱散它声响所及范围内的风暴、冰雹和恶魔；后来的铸钟人会在钟上铸下铭文——#G 我击碎雷霆#!。"
 pam_secular_faith_events.0056.t: "厅中麻雀"
 pam_secular_faith_events.0056.desc: "一只麻雀从冬夜的黑暗中疾飞而入，掠过[ROOT.Char.Custom('ResidenceBuildingHallType')]，穿过火炬的烟雾与欢声笑语，又从[ROOT.Char.Custom('ResidenceBuildingWindowType')]飞出。\n\n[ROOT.Char.Custom('GetCourt')]众人笑了起来。但我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )][chaplain.GetFirstName]却没有笑。\n\n“[Glossary( '人生便是如此', 'BEDE_SPARROW_GLOSS' )]，[ROOT.Char.Custom('FormOfAddressForLiege')]——短暂地在光明与温暖中停留，从一方黑暗中来，又到另一方黑暗中去。在这之前与在这之后的一切，唯有[ROOT.Char.GetFaith.HighGodName]知晓。”"
 pam_secular_faith_events.0056.scholar: "比德也几乎是一字不差地写了同样的话。"
 pam_secular_faith_events.0056.a: "那么，就好好利用上这光明时光。"
 pam_secular_faith_events.0056.b: "那是一只鸟。再来点酒。"
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "在比德的叙述中，诺森布里亚国王埃德温的一位顾问将人生比作一只冬夜中从温暖宴会厅飞过的麻雀：它短暂地穿过光明与舒适，从风暴中来，又回到风暴中去，而此前此后的一切皆不可知。他指出，如果新的信仰能够解答那厅堂之外发生的事，那它就值得他们信奉——而埃德温被说服了。"
 pam_secular_faith_events.0057.t: "教堂麦酒"
 pam_secular_faith_events.0057.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，站在[ale_church.GetName]的教堂墓地里，四周的桌子旁坐着半个教区的人，从[GetBuilding('breweries_01').GetName]新运来的木桶已经就位，[chaplain.GetSheHe]手里已经端着一个满溢的酒杯。\n\n“教堂屋顶漏雨了，[ROOT.Char.Custom('FormOfAddressForLiege')]，什一税的钱不够修。所以兄弟们酿了酒，我们来卖，教区的人就喝[Glossary( '教堂麦酒', 'CHURCH_ALE_GLOSS' )]，直到修屋顶的钱全部凑齐。”\n\n“每喝一杯都是一件善事。你要不要来一杯？”"
 pam_secular_faith_events.0057.a: "给我倒一杯，敬屋顶。"
 pam_secular_faith_events.0057.b: "别省麦酒了，屋顶的钱我自己出。"
 pam_secular_faith_events.0057.c: "在圣地喝酒？倒掉。"
 pam_sf_church_ale_gamble_tt: "每一杯都是为了屋顶，教堂酿的酒劲头十足……"
 pam_sf_church_ale_toast: "翌日清晨的头疼"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "一种教区节庆，用捐赠的麦芽酿造的麦酒在教堂墓地里出售，收入用于教堂的维护——漏雨的屋顶、新钟、穷人的面包。一场又一场宗教会议谴责在圣地上饮酒，一个接一个的教区继续酿酒；对许多村庄教堂来说，麦酒筹得的钱比什一税还要多。"
 pam_secular_faith_events.0058.t: "老鼠吃了什么？"
 pam_secular_faith_events.0058.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，猛地冲进来，脸色像祭坛布一样白，手里攥着一个小小的银制[Glossary( '圣体盒', 'PYX_GLOSS' )]，仿佛那东西在他手里烫得厉害。\n\n“是老鼠，[ROOT.Char.Custom('FormOfAddressForLiege')]。它今晚早些时候咬穿盒子，吃掉了[Glossary( '圣饼', 'RESERVED_HOST_GLOSS' )]！”\n\n[chaplain.GetSheHe|U]几乎说不出话来。“学者们一直在争论[Glossary( '老鼠吃了什么', 'QUID_MUS_SUMIT_GLOSS' )]——那只老鼠到底吃了什么？我现在该怎么做？”"
 pam_secular_faith_events.0058.scholar: "冷静点，老鼠吃了饼，仅此而已。"
 pam_secular_faith_events.0058.mean: "你竟让#EMP 老鼠#!在[ROOT.Char.GetFaith.HighGodName]面前偷吃？！滚出我的[ROOT.Char.Custom('GetCourt')]！"
 pam_secular_faith_events.0058.a: "购买一个锁更好的圣体盒。"
 pam_secular_faith_events.0058.b: "所以，这老鼠要下地狱了？哈！"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G “老鼠吃了什么？”#!——这是一个经院学者们认真辩论过的问题：如果一只老鼠啃了祝圣过的祭饼，它吃下的是天主的身体吗？教会法规定，保管圣事疏忽的司铎应当补赎，而大圣师们裁定，老鼠只吃下了饼的外形——圣事本身会从那些不相称的牙齿中隐退。"
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "一种带盖的小盒，通常由银或镀金制成，用于存放弥撒中祝圣过的面饼。教会法典要求它必须保持洁净、上锁，不受凡俗之人染指——尤其是贪吃的访客。"
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "在弥撒中被祝圣后留下来的饼，存放在教堂里，以便病患和临终之人随时都能领受。一经祝圣，这饼便被认定为天主真实的身体——这使得它的保管成为重中之重的事宜。"
 pam_secular_faith_events.0059.t: "主日"
 pam_secular_faith_events.0059.desc: "天亮时，消息传来，说在[sighting_county.GetBaseNameNoTier]的[sighting_province.Custom('GetTerrainTypePlural')]里发现一只[sighting_county.Custom('GetAnimalAdjective')][sighting_county.Custom('GetAnimalType')]。猎犬在吠叫，马匹在院子里不停踏脚——但我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]，[chaplain.GetFirstName]，正直直站在大门口。\n\n“今天是[Glossary( '安息日', 'LORDS_DAY_GLOSS' )]，[ROOT.Char.Custom('FormOfAddressForLiege')]。钟已经敲过，弥撒正等着您呢！”\n\n“[ROOT.Char.GetFaith.HighGodName]已经给了你六天时间骑马出行。你连这一天也要贪求吗？”"
 pam_secular_faith_events.0059.a: "给马卸鞍，我们将听弥撒。"
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')]不会等人。上马！"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "一周的第一天，为纪念复活而守为圣日。教会会议禁止在这一天进行劳役、集市和闲散玩乐，基督教君主们也将这一禁令写入法律——尽管许多领主认为，猎鹿和布道一样，是他们与天主之间的事。"
 pam_secular_faith_events.0060.t: "无忧的人生"
 pam_secular_faith_events.0060.desc: "我骑马穿过[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的街道，空荡荡的金库正令我烦忧不已，这时我看到了一个乞丐。\n\n没有俗世财物的牵绊，[hermit.GetSheHe]带着那种接纳了自身处境的平和与通达跳着舞。这是一个摆脱了我所忍受的苦难的灵魂。\n\n或许[hermit.GetSheHe]看到了某种能让我也得到解脱的真相。"
 pam_secular_faith_events.0060.a: "我拥有的越少，我就越是我自己！"
 pam_secular_faith_events.0060.b: "我将再次为我的牢笼镀上金饰！"
 pam_secular_faith_events.0060.c: "让我离开这雨中。"
