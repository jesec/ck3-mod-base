l_simp_chinese:
 pam_generic_events.0001.t: "信仰学者"
 pam_generic_events.0001.desc: "当我走进[ROOT.Char.GetFaith.HouseOfWorship]时，我的[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )][chaplain.GetFirstName]似乎正沉浸在宣讲之中。\n\n“啊，[ROOT.Char.Custom('FormOfAddressForLiege')]，”[chaplain.GetSheHe]终于注意到我，“您对[ROOT.Char.GetFaith.HighGodName]之言的兴趣日益增长了吗？我可以教您其中的门道。”"
 pam_generic_events.0001.a: "值得一试。"
 pam_generic_events.0001.b: "治理土地已经占用了我的全部精力。"
 pam_generic_events.0002.t: "我是好人吗？"
 pam_generic_events.0002.desc.intro: "我的[ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )]，[doubting_child.GetFirstName]，在蜡烛早该熄灭很久之后溜进了我的房间。眼泪划过[doubting_child.GetHerHis]的脸颊。\n\n“我是好人吗？”[doubting_child.GetSheHe]小声说。“如果我生来就是罪恶……"
 pam_generic_events.0002.desc.sin: "#EMP 让人作呕的#![sinful_trait.GetName( ROOT.Char )|l]……"
 pam_generic_events.0002.desc.sp: "如果我的灵魂感到这样空虚……"
 pam_generic_events.0002.desc.outro: "[ROOT.Char.GetFaith.HighGodName]怎么可能还会接纳我？”"
 pam_generic_events.0002.a: "抛下让你感到羞愧的东西。"
 pam_generic_events.0002.b: "你是被宠爱着的。"
 pam_generic_events.0002.c: "那么我们就祈祷吧。"
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U]在[TARGET_CHARACTER.GetShortUIName]怀疑自己的善良时给予了[TARGET_CHARACTER.GetHerHis]安慰。"
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]在[CHARACTER.GetShortUIName]怀疑自己的善良时给予了[CHARACTER.GetHerHis]安慰。"
 pam_generic_events.0003.t: "你为何物"
 pam_generic_events.0003.desc: "我的[ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )]，[worried_spouse.GetFirstName]，在黄昏后等在树篱间。[worried_spouse.GetHerHis|U]的手在膝头反复绞动。\n\n“你实在太#EMP [sinful_trait.GetName( ROOT.Char )|l]#!了，”[worried_spouse.GetSheHe]低声说。“这在[ROOT.Char.GetFaith.HighGodName]面前让我们两人都蒙羞。你怎么能对自己的信仰这么不上心？你难道看不出这对你造成了什么影响吗？”"
 pam_generic_events.0003.a: "为了你？我会改正的。"
 pam_generic_events.0003.b: "[ROOT.Char.GetFaith.HighGodName]正是这样创造我的。"
 pam_generic_events.0003.c: "你担心的太多了。"
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U]向[TARGET_CHARACTER.GetShortUIName]承诺会改过自新并前往朝圣。"
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]向[CHARACTER.GetShortUIName]承诺会改过自新并前往朝圣。"
 rival_embraced_sinful_ways: "[TARGET_CHARACTER.GetShortUIName]恳求[CHARACTER.GetShortUIName|U]悔改时，[CHARACTER.GetHerHim]选择拒绝。"
 rival_embraced_sinful_ways_corresponding: "[CHARACTER.GetShortUIName]恳求[TARGET_CHARACTER.GetShortUIName|U]悔改时，[TARGET_CHARACTER.GetHerHim]选择拒绝。"
 pam_generic_events.0004.t: "黑暗中的亮光"
 pam_generic_events.0004.desc: "[ROOT.Char.GetFaith.HouseOfWorship]里空无一人。雾气在立柱之间盘绕，蜡烛在我已故的[ROOT.Char.Custom2( 'RelationToMeShort', deceased )][deceased.GetFirstName]的回忆旁摇曳，[deceased.GetSheHe][deceased.GetDeathReasonHideKiller]。\n\n我的[ROOT.Char.Custom2( 'RelationToMeShort', comforter )][comforter.GetFirstName]坐得很近，[comforter.GetHerHis]的袖子蹭到了我的袖子。“悲痛是一条路，”[comforter.GetSheHe]轻声说。“走下去，你或许最终能看到[ROOT.Char.GetFaith.PositiveAfterLife]在路的尽头等你。”"
 pam_generic_events.0004.a: "是我！是#EMP 我#!干的！"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP 在我父的家里，有许多住处。#!"
 JOHN_14_2_GLOSS: "#weak ——《若望福音》14:2，思高圣经#!"
 pam_generic_events.0004.c: "那么我们就祈祷吧。"
 pam_generic_events.0004.d: "来，我们举杯纪念他们。"
 pam_generic_events.0005.t: "忠诚的铁拳"
 pam_generic_events.0005.desc: "“[clerical_holder.GetSheHe]#EMP 怎么敢#!！？”\n\n我的[ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )]，[loyal_vassal.GetTitledFirstName]，大步走进议事厅，手里的剑已经抽出了一半。\n\n“[clerical_holder.GetTitledFirstName]怎么敢把你驱逐出去？”[loyal_vassal.GetSheHe|U]往地上啐了一口。“我在[clerical_region.GetName]布置了人手。你下命令，我们就去拜访[clerical_holder.GetHerHim]。”"
 pam_generic_events.0005.a: "很好，去吧。"
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName]将前往[clerical_holder.GetCapitalLocation.GetName]。[loyal_vassal.GetHerHis]返回后你将获得[dread|E]，并提升[GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName][vassal|E]的[opinion|E]。"
 pam_generic_events.0005.b: "还有更聪明的办法。"
 pam_generic_events.0005.b.tt: "你获得一个针对[clerical_holder.GetShortUIName]的[GetScheme('murder').GetTypeName][schemes|E]的#P 巨大#!增益，持续#V 15年#!"
 pam_generic_events.0005.c: "我受过教导，要把另一面脸颊也转给去。"
 pam_generic_events.0005.c.tt: "#V $declaration_of_repentance_interaction$#![character_interaction|E]的接受度提高#P +20#!，持续#V 10年#!"
 pam_generic_events.0005.c.tt2: "#V 10年#!内将更有可能对你使用#V $lift_excommunication_interaction$#![character_interaction|E]"
 pam_turned_the_other_cheek_accept_reason: "泰然宽容"
 PAM_GENERIC_0005_MURDER_BONUS: "一位忠诚的封臣在该目标的领地中拥有军队：$VALUE|+0=$"
 pam_generic_events.0007.opening: "致[ROOT.Char.GetTitledFirstName]"
 pam_generic_events.0007.desc: "大功告成。我找到了[clerical_holder.GetTitledFirstName]，并让[clerical_holder.GetHerHim]流血不止。"
 pam_generic_events.0007.a: "很好。"
 pam_generic_events.0008.t: "黑暗中的声音"
 pam_generic_events.0008.desc: "晚餐还沉甸甸堵在我胃里，我跌跌撞撞往自己的卧房走。我的视线发花，脚下的走廊在往一边歪。\n\n然后……传来一个声音。“如此一个[virtuous_trait.GetName( ROOT.Char )|l]的[ROOT.Char.GetTitleAsNameNoTooltip|l]……”那个声音说。“真是美德，很合你们主的心意。”\n\n这真的是[ROOT.Char.GetFaith.HighGodName]的声音吗？还是说，这只是我身体不适产生的幻觉？"
 pam_generic_events.0008.a: "是的。#EMP 是的！#!"
 pam_generic_events.0008.b: "一定是祂！"
 pam_generic_events.0008.c: "古老的力量正在苏醒……"
 pam_generic_events.0008.d: "有时候食物就会有这种效果。"
 pam_generic_events.0008.e: "也许……是我吃坏了肚子？"
 pam_generic_events.0008.f: "还是先祈祷一下吧，以防万一。"
 pam_generic_events.0009.t: "地狱之火"
 pam_generic_events.0009.desc: "我醒过来时浑身都湿透了，心脏在胸腔里狂跳。\n\n我在梦里被火烧着。肉从骨头上像黄油一样往下化。“[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]！[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]！”一大群恶魔对着我喊。\n\n[ROOT.Char.GetFaith.NegativeAfterLife]的火正将我吞噬，每一声惨叫都出自我的喉咙。"
 pam_generic_events.0009.a: "鞭子知道该怎么做。"
 pam_generic_events.0009.b: "肉体的债需要肉体偿还。"
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP 罪人们，你们务要洁净你们的手，你们务要清洁你们的心！#!"
 JAMES_4_8_GLOSS: "#weak ——《雅各伯书》4:8，思高圣经#!"
 pam_generic_events.0009.d: "与[comforting_courtier.GetTitledFirstName]交谈总能让人宽心。"
 pam_generic_events.0009.e: "梦终究只是梦。"
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U]在经历了一场关于永堕地狱的噩梦后，向[TARGET_CHARACTER.GetShortUIName]寻求慰藉。"
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]在经历了一场关于永堕地狱的噩梦后，向[CHARACTER.GetShortUIName]寻求慰藉。"
 pam_generic_events.0010.t: "受祝福的游戏"
 pam_generic_events.0010.desc: "四周的[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]在眼前展开。很快传来几十匹马狂奔的轰隆声响，[hunting_ruler.GetName]领头走在最前面，神态很是得意。\n\n#EMP “停——！”#![hunting_ruler.GetSheHe|U]抬手示意，让身后的随从都停了下来。“赞美[ROOT.Char.GetFaith.HighGodName]赐下这样的好天气！”[hunting_ruler.GetSheHe|U]高声喊道，“也赞美祂赐给我们今天要猎的猎物！”"
 pam_generic_events.0010.a: "如果你想听，给你个建议……"
 pam_generic_events.0010.b: "你的目光如长矛般锐利。"
 pam_generic_events.0010.b.success: "你的赞美恰如其分"
 pam_generic_events.0010.b.failure: "你的赞美毫无分量"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetSheHe|U]将你的赞誉铭记于心"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetSheHe|U]对你的空洞奉承感到恼怒"
 pam_generic_events.0010.b.tt: "[hunting_ruler.GetTitledFirstName]更可能接受#high $negotiate_alliance_interaction$#![character_interaction|E]，持续#V 10年#!"
 pam_generic_events.0010.c: "赞美归于主！"
 pam_generic_events.0010.d: "借我几名骑手护送我一程。"
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U]称赞了[TARGET_CHARACTER.GetShortUINamePossessive]狩猎技巧。"
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]称赞了[CHARACTER.GetShortUINamePossessive]狩猎技巧。"
 pam_praised_hunting_alliance_accept_reason: "称赞了我的狩猎"
 pam_generic_events.0011.t: "一点罪孽"
 pam_generic_events.0011.desc: "[sinful_courtier.GetTitledFirstNamePossessive]的恶行已经持续太久。我的宫廷里到处都是关于[sinful_courtier.GetHerHis]行事[sinful_trait.GetName( ROOT.Char )|l]的传闻，我也亲眼见过仆人们在[sinful_courtier.GetSheHe]经过时纷纷往后躲。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]！”我走进书房时[sinful_courtier.GetSheHe|U]高声说道，[sinful_courtier.Custom('quirk_neg_pp')]。“能见到您面前真是我的荣幸。”"
 pam_generic_events.0011.a: "你要放弃你的[sinful_trait.GetNameNoTooltip( ROOT.Char )|l]。"
 pam_generic_events.0011.b: "聆听[ROOT.Char.GetFaith.HighGodName]赐予我们的教诲。"
 pam_generic_events.0011.b.success: "接受教诲"
 pam_generic_events.0011.b.failure: "其并没有听从"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetSheHe|U]明白了自己的罪孽之重"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetSheHe|U]对你的教导不以为然"
 pam_generic_events.0011.c: "这对你来说可不太好……"
 pam_generic_events.0011.c.success: "温和的建议能实现感化"
 pam_generic_events.0011.c.failure: "你的软弱只招来了轻蔑"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetSheHe|U]被你的关怀所打动"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetSheHe|U]将你的仁慈视为软弱"
 pam_generic_events.0011.d: "或许情况没那么严重。"
