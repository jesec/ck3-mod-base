l_simp_chinese:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "叙任权冲突"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "你的胜利迫使[defender.GetShortUIName]一方接受你对神职人员任命的立场。"
 pam_investiture_conflict_cb_victory_desc_defender: "[attacker.GetShortUIName|U]的胜利迫使你们一方接受其对神职人员任命的立场。"
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U]获胜，迫使[defender.GetShortUIName]一方接受[attacker.GetShortUIName]对神职人员任命的立场。"
 pam_investiture_conflict_cb_white_peace_desc: "关于神职人员任命的冲突无果而终，双方均未让步。"
 pam_investiture_conflict_cb_defeat_desc_attacker: "你的失败迫使你和你的支持者接受[defender.GetShortUIName]对神职人员任命的立场。"
 pam_investiture_conflict_cb_defeat_desc_defender: "你的胜利迫使[attacker.GetShortUIName]一方接受你对神职人员任命的立场。"
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U]获胜，迫使[attacker.GetShortUIName]一方接受[defender.GetShortUIName]对神职人员任命的立场。"
 msg_pam_investiture_conflict_cb_invalidated_message: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]结束了，叙任权冲突不再有效。"
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "叙任权会议#EMP 尚未#!召开"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "被迫屈服"
 pam_investiture_conflict_forced_stance_tt: "在叙任权冲突中落败的你，在即将到来的会议上不得不屈从于胜者关于神职人员任命的立场。"
