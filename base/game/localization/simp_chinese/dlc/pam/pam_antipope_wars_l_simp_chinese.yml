 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "你扶持的[challenger_hof|E]夺取[head_of_faith_possessive|E]头衔，[attacker.GetRite.GetName]成为[mainline_rite|E]。"
 pam_challenge_hof_cb_victory_desc_attacker: "你夺取[head_of_faith_possessive|E]头衔，[attacker.GetRite.GetName]成为[mainline_rite|E]。"
 pam_challenge_hof_cb_victory_desc: "[challenger_hof|E]成为[head_of_faith|E]。"
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U]继续担任[head_of_faith|E]。"
 pam_challenge_hof_cb_defeat_desc_attacker: "你对[head_of_faith|E]的挑战失败了。"
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "战争结束了：防御方不再是[head_of_faith|E]。"
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "战争结束了：不再存在信仰领袖的挑战者。"
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U]成为[sponsor.GetShortUINamePossessive]的[vassal|E]"
 PAM_ANTIKING_WAR_CB_NAME: "废黜[challenger_hof|E]"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "你移除[defender.GetShortUINamePossessive]的[challenger_hof|E]，获得[attacker.GetFaith.GetReligiousHead.GetShortUINamePossessive]的感激。"
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "你移除了[defender.GetShortUINamePossessive]的[challenger_hof|E]。"
 pam_antiking_cb_victory_desc: "[challenger_hof|E]被废黜了。"
 pam_antiking_cb_white_peace_desc: "[challenger_hof|E]保留。"
 pam_antiking_cb_defeat_desc_attacker: "你废黜[challenger_hof|E]的尝试失败了。"
 pam_antiking_cb_defeat_desc: "[challenger_hof|E]继续存在。"
 msg_pam_antiking_cb_invalidated_message: "战争结束了：防御方不再扶持[challenger_hof|E]。"
 pam_humiliation_cb_papabile_score_loss_tt: "[defender.GetShortUINamePossessive|U]的[papabile_score|E]降低#N ‑25#!"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "[attacker.GetShortUINamePossessive|U]的[papabile_score|E]降低#N ‑25#!"
 pam_clerical_disgrace_modifier: "神职人员的耻辱"
 pam_clerical_disgrace_modifier_desc: "该角色在宗教战争中被羞辱，削弱了其对[clerical_titles|E]的[candidate_score|E]。"
 pam_clerical_disgrace_candidacy_penalty_desc: "在宗教战争中被羞辱"
 pam_antipope_events.0010.t: "觊觎者伏诛"
 pam_antipope_events.0010.desc.christian: "那个[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')]裂教者[pam_ch_hof_challenger.GetTitledFirstName]跪在我面前，如今已被剥夺了[pam_ch_hof_challenger.GetHerHis]那虚假的[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]头衔。\n\n[pam_ch_hof_challenger.GetSheHe]依旧挑衅地说道：“约柜在我所立之处，不在你脚下。”\n\n看来[pam_ch_hof_challenger.GetHerHis|U]的舌头仍是撒旦的仆人。"
 pam_antipope_events.0010.desc: "伪称者[pam_ch_hof_challenger.GetTitledFirstName]跪在我面前，[pam_ch_hof_challenger.GetHerHis]虚假的[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]头衔已被剥夺。\n\n[pam_ch_hof_challenger.GetSheHe]依旧不肯低头，开口答道：“我才是真正的[ROOT.Char.GetFaith.ReligiousHeadName]。”"
 pam_antipope_events.0010.a.christian: "牢房或许能让[pam_ch_hof_challenger.GetHerHim]像约纳一样改悔。"
 pam_antipope_events.0010.a: "把[pam_ch_hof_challenger.GetHerHim]关起来。"
 pam_antipope_events.0010.b.christian: "处决[pam_ch_hof_challenger.GetHerHim]。上主直到谁是属祂的人。"
 pam_antipope_events.0010.b: "处决[pam_ch_hof_challenger.GetHerHim]。剩下的交给[ROOT.Char.GetFaith.HighGodName]。"
 pam_antipope_events.0010.c: "手下留情。"
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.GetSheHe|U]将呼喊真[ROOT.Char.GetFaith.ReligiousHeadName|U]的名字。"
 pam_challenge_hof_war_random_permanent_harm_tt: "遭受随机永久性伤害"
 pam_antipope_events.0011.t: "庇护的代价"
 pam_antipope_events.0011.desc.christian: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive]的钱袋助长了这邪恶的分裂，推举了一位对立[ROOT.Char.GetFaith.ReligiousHeadName|U]来对抗[ROOT.Char.GetRite.GetName]。\n\n圣经对这样的扶持者并不宽容：[Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetSheHe|U]抬起头，依然充满挑衅：“你不是[ROOT.Char.GetFaith.ReligiousHeadName]，而是一个伪修士。下地狱吧，下地狱吧，永世受到诅咒。”"
 pam_antipope_events.0011.desc: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive]的金钱扶持了一位对立[ROOT.Char.GetFaith.ReligiousHeadName|U]分裂[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]。\n\n[pam_ch_hof_sponsor.GetSheHe|U]抬起头：“你不是[ROOT.Char.GetFaith.ReligiousHeadName]。你是骗子。”"
 pam_antipope_events.0011.a: "没收资助此事的款项。"
 pam_antipope_events.0011.b: "处决[pam_ch_hof_sponsor.GetHerHim]。同意是有代价的。"
 pam_antipope_events.0011.c: "[pam_ch_hof_sponsor.GetHerHis]家族蒙受的耻辱已是足够的惩罚。"
 pam_antipope_events.0011.d: "鞭笞[pam_ch_hof_sponsor.GetHerHim]，直到皮开肉绽。"
 pam_romans_1_32_english: "凡作这样事的人，应受死刑；但他们不仅自己作这些事，而且还赞同作这些事的人。"
 ROMANS_1_32_GLOSS: "#weak ——《罗马书》1:32，思高圣经#!"
 pam_antipope_events.0012.t: "对被废黜者的审判"
 pam_antipope_events.0012.t.christian: "撒旦士兵的判词"
 pam_antipope_events.0012.intro.christian: "[ROOT.Char.GetRite.GetName]听命于我。伪[ROOT.Char.GetFaith.ReligiousHeadName|U][pam_ch_hof_old_hof.GetTitledFirstName]跪伏在我脚下。"
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]听命于我。伪[ROOT.Char.GetFaith.ReligiousHeadName|U]，[pam_ch_hof_old_hof.GetTitledFirstName]跪伏在我脚下。"
 pam_antipope_events.0012.intro.sponsor: "我的[ROOT.Char.GetFaith.ReligiousHeadName|U][pam_ch_hof_new_hof.GetFirstName]已经登基。觊觎者[pam_ch_hof_old_hof.GetTitledFirstName]跪在我面前。"
 pam_antipope_events.0012.dialogue.christian: "\n\n[pam_ch_hof_old_hof.GetSheHe]一如既往地桀骜，厉声说道：“你靠着刀剑夺得了和平的宝座。”\n\n“主认为，为实现其旨意使用手段是恰当的。”我回应道。"
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetSheHe|U]说：“你靠刀剑夺来了这一切。”\n\n“而我也将靠刀剑守住它。”我回应道。"
 pam_antipope_events.0012.a: "牢房或许能冷却这份骄傲。"
 pam_antipope_events.0012.b: "双头即为怪，得去掉一个。"
 pam_antipope_events.0012.c: "纷争已够多了。让[pam_ch_hof_old_hof.GetHerHim]安息吧。"
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.GetSheHe|U]将高呼真正[ROOT.Char.GetFaith.ReligiousHeadName|U]之名。"
 pam_antipope_events.0014.t: "对我的审判"
 pam_antipope_events.0014.intro.judge: "“我免去所有[pam_ch_hof_judge.GetFaith.GetAdherentNamePlural]对你的服从义务。”[pam_ch_hof_judge.GetTitledFirstName]说道。"
 pam_antipope_events.0014.intro.mercy.christian: "“走吧，从此不要再犯罪。”[pam_ch_hof_judge.GetTitledFirstName]说道。"
 pam_antipope_events.0014.intro.mercy: "“走吧。不要再回到这条路上了。” [pam_ch_hof_judge.GetTitledFirstName]说。"
 pam_antipope_events.0014.desc.condemned.christian: "\n\n我热爱正义，憎恨不义，因此我死去。"
 pam_antipope_events.0014.desc.condemned: "\n\n我为我所坚守的信念而死。"
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U]及其手下对我极尽嘲笑，鞭笞我的身躯。我不过是一具空壳，如同被脱粒后的谷糠。"
 pam_antipope_events.0014.desc.captive.christian: "\n\n他们给了我一间牢房。我从来都知道，对于一位神圣的[ROOT.Char.GetWomanMan]，一间牢房就足够了。"
 pam_antipope_events.0014.desc.captive: "\n\n他们给了我一间牢房。这就是我所能得到的一切。"
 pam_antipope_events.0014.desc.spared.christian: "\n\n似乎石头留在了他们手中，而我得以自由离去。我不应辜负这份宽恕。"
 pam_antipope_events.0014.desc.spared: "\n\n看来我将重获自由。我不应辜负这份宽恕。"
 pam_antipope_events.0014.desc.generic: "\n\n审判已至。接下来由我来选择。"
 pam_antipope_events.0014.a: "愿我的家族被铭记为对[ROOT.Char.GetFaith.HighGodName]忠诚。"
 pam_antipope_events.0014.b: "他们的双手将永远洗不干净。"
 pam_antipope_events.0014.b.toast: "你已被[GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]玷污"
 pam_antipope_events.0014.c: "保护我的家族免受此耻辱。"
 pam_antipope_events.0014.d: "我将与真正的[ROOT.Char.GetFaith.ReligiousHeadName]和解。"
 pam_antipope_events.0014.e: "[pam_ch_hof_judge.GetTitledFirstNameNoTooltip]教唆我的恶行，我将予以处决。"
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "我将赤足行走，直至赎罪完成。"
 pam_antipope_events.0015.opening: "致[ROOT.Char.GetFaith.GetAdjectiveNoTooltip][ROOT.Char.GetTitledFirstNameNoTooltip]，"
 pam_antipope_events.0015.desc.defender_victory.christian: "须知，针对[ROOT.Char.GetFaith.ReligiousHeadName|U]的分裂派挑战已经被粉碎。僭位者的权位已遭摧毁，[ROOT.Char.GetRite.GetName]依然稳固。任何君主或主教都不得怀疑自己应当效忠的对象。"
 pam_antipope_events.0015.desc.defender_victory: "须知，针对[ROOT.Char.GetFaith.ReligiousHeadName|U]的挑战已经被粉碎。僭位者的权位已遭摧毁，[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]依然稳固。任何统治者都不得怀疑自己应当效忠的对象。"
 pam_antipope_events.0015.desc.attacker_victory.christian: "须知，为[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]而起的战争已经结束。我已将圣座从撒旦的枷锁中解放出来，[ROOT.Char.GetRite.GetName]将听从我的号令。"
 pam_antipope_events.0015.desc.attacker_victory: "须知，为[ROOT.Char.GetFaith.ReligiousHeadTitleName|U]而起的战争已经结束。我坐拥圣座，[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]们追随于我。让所有信徒都知道，新的[ROOT.Char.GetFaith.ReligiousHeadName]已经掌权。"
 pam_antipope_events.0015.a: "就这样吧。"
