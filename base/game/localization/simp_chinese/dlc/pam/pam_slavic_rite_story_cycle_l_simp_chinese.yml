l_simp_chinese:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "格拉哥里字母"
 slavic_rite.1000.desc: "“上前吧，[greek_preacher.GetFirstName]修士，”我的[court_chaplain.GetActiveCouncilTask.GetPositionName]引导着这位信奉[GetRiteByKey('byzantine_rite').GetAdjective]的[greek_preacher.Custom('MyPriestTitle')]。\n\n“愿您的国度蒙福，[ROOT.Char.GetTitleAsNameNoTooltip]。我的教友正在为您的子民创造一种字母，进展顺利。但是，唉，我们的工作落入妄图宣称对您的土地拥有教会权威的[GetRiteByKey('carolingian_christianity').GetAdherentName]牧师的阴影下，受到他们的威胁。[Glossary('基里尔与麦托迪', 'CYRIL_AND_METHODIUS_GLOSS')]要我多争取一些时间，以便制定一项策略来避免冲突，寻求外交解决方案。”"
 slavic_rite.1000.a: "我们已走到这一步，我指望着他们。"
 slavic_rite.1000.a_tt: "[Glossary('基里尔与麦托迪', 'CYRIL_AND_METHODIUS_GLOSS')]，创造新斯拉夫文字的兄弟二人，很快就会通知你他们在你的领地内传播新[court_chaplain.GetFaith.GetAdjective][rite|E]的下一步行动。"
 slavic_rite.1000.b: "最好还是放弃这条路，免得激起[GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip]的愤怒。"
 slavic_rite.1000.b_tt: "[Glossary('基里尔与麦托迪', 'CYRIL_AND_METHODIUS_GLOSS')]为发展本地文字和建立新[rite|E]所做的一切努力都将被放弃。"
 slavic_rite.1000.b_tt_2: "$story_slavic_rite$[story_cycle|E]结束。"
 # Travel to Rome Initiation
 slavic_rite.0001.t: "摩拉维亚传教使命"
 slavic_rite.0001.desc: "再次见到[Glossary( '基里尔与麦托迪', 'CYRIL_AND_METHODIUS_GLOSS' )]，我松了一口气，希望他们有计划来应对[GetRiteByKey('carolingian_christianity').GetAdherentName]的干涉。\n\n“尊敬的[ROOT.Char.GetTitleAsNameNoTooltip]，看来要确保你的人民的信仰安全的唯一办法，就是前往[pope_scope.GetCapitalLocation.GetBaronyNameExplicitly]，获得[pope_scope.GetTitledFirstName]的祝福。”\n\n我确实希望圣伯多禄之座的权威能够约束那些专横跋扈的[GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip]，但他们似乎只尊重自己人。"
 slavic_rite.0001.a: "祝你们好运。"
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName]与[methodius_scope.GetFirstName]将即刻启程。如果此行圆满成功，二人归来后或许将在你的领地内掀起一场新的宗教运动。"
 slavic_rite.0001.b: "我不会让你们空手而去。"
 slavic_rite_travel_toast_title: "基里尔与麦托迪踏上旅途"
 slavic_rite_moravian_mission_gift_sent_tooltip: "一份礼物包裹将送往[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]。兄弟二人归来后会向你禀报对方的接受情况。"
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "[methodius_scope.GetRite.GetName]的诞生"
 slavic_rite.0003.desc: "我收到消息，依托[moravia_liege_scope.GetTitledFirstNameNoTooltip]的支持，[methodius_scope.GetFirstNameNoTooltip]正于[moravia_liege_scope.GetCulture.GetNameNoTooltip]人的土地上广泛传播全新的[methodius_scope.GetFaith.GetNameNoTooltip]信仰修行范式。国内学者将这套定制化体系称作[methodius_scope.GetRite.GetName]。\n\n即便我们长久以来试图同化本地族群，[methodius_scope.GetSheHe]依旧取得了[pope_scope.GetTitledFirstName]的许可，获准在领地内推行全新创制的斯拉夫文字。"
 slavic_rite.0003.a: "且看[methodius_scope.GetHerHis]的新仪轨能否长久。"
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "[ROOT.Char.GetCulture.GetNameNoTooltip]人的[methodius_scope.GetRite.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "今日清晨，宫廷收到一则耐人寻味的消息。\n\n多年以来，[liege_scope.GetTitledFirstNameNoTooltip]默许[methodius_scope.GetCulture.GetNameNoTooltip]神职者[methodius_scope.GetFirstNam]，在我们的土地上持续传播[methodius_scope.GetHerHis]渎神的修行之道。这套[methodius_scope.GetFaith.GetNameNoTooltip]信仰经过改造适配，贴合本民族生活习俗，以此拉拢[ROOT.Char.GetCulture.GetNameNoTooltip]民众皈依。\n\n近来，围绕传统信仰与外来教义的纷争愈演愈烈，我必须认真考量，该如何应对这场信仰变局。"
 slavic_rite.0004.desc_chalcedonian: "我们的[liege_scope.GetTitleAsNameNoTooltip]已下令在全境推行[methodius_scope.GetRite.GetNameNoTooltip]。据国内学者的说法，这套礼仪体系能够让信徒在不割裂本土生活传统的前提下，更便捷地践行[methodius_scope.GetFaith.GetNameNoTooltip]信仰。\n\n这或许值得关注？"
 slavic_rite.0004.a_pagan: "祖先习俗的优越性无可替代。"
 slavic_rite.0004.b_pagan: "这套新教义或许并非全无道理……"
 slavic_rite.0004.a_chalcedonian: "我绝不背离正统与正道。"
 slavic_rite.0004.b_chalcedonian: "召集学者讨论。"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "甘苦参半的旅程"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName]自[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]归来，独自站在我面前。当我问及[cyril_scope.GetFirstName]时，[methodius_scope.GetHerHis]的神情骤然黯淡。\n\n“仁慈的[ROOT.Char.GetTitleAsNameNoTooltip]，好消息是[pope_scope.GetTitledFirstName]陛下已降下祝福与许可，允许我们用自己的方法和经文，在[ROOT.Char.GetCulture.GetNameNoTooltip]人民和你的领地内传播信仰。”[methodius_scope.GetHerHis]深吸一口气，语声沉痛——“但遗憾的是，我被迫让我的兄长留在他乡。我会竭尽所能，不让我们多年的传教努力付诸东流。愿[ROOT.Char.GetFaith.HighGodName]护佑世人。”"
 slavic_rite.0005.a: "我们必让你兄弟为此骄傲！"
 slavic_rite.0005.b: "我能做的是铭记逝者，继承他的遗志。"
 pam_cyril_statue_modifier: "基里尔的缅怀"
 pam_brothers_travel_safety_modifier: "谨慎的旅途"
 slavic_rite.0005.c: "愿你的传教事业一切顺利。"
 slavic_rite_mass_conversion_tooltip: "已筹备在[moravia_liege_scope.GetPrimaryTitle.GetNameNoTier]所有[duchies|E]中进行大规模皈依[great_project|E]，目标是将其下属的所有[counties|E]转化为[methodius_scope.GetRite.GetName]"
 slavic_rite_moravian_mission_gift_received_tooltip: "[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]已收到你赠送的厚礼，并且深表感谢。"
 slavic_rite_ecclesiastical_title_creation_tooltip: "创建$slavic_rite_ecclesiastical_title$，[methodius_scope.GetFirstName]成为第一任[holder|E]"
 slavic_rite_ecclesiastical_title: "摩拉维亚$d_et_archdiocese_prefix$"
 slavic_rite_ecclesiastical_title_name: "摩拉维亚"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "摩拉维亚传教的结束"
 slavic_rite.0006.desc.brothers_are_dead: "随着[Glossary('基里尔与麦托迪', 'CYRIL_AND_METHODIUS_GLOSS')]兄弟的离世，已经没有人有足够的能力来继续他们的礼仪工作了。如果我们仍然想要完成对我的人民的全面皈依，就必须发展我们自己的方法。"
 slavic_rite.0006.desc.no_longer_christian: "我看到了通往荣耀的道路。曾经驱使我为我的人民和家族带来幸福的那个动力，如今看来完全微不足道。他们注定要走的路和我为他们期望的不同。幸好，[ROOT.Char.GetFaith.HighGodName]已经为我们指出了正途。"
 slavic_rite.0006.desc.no_longer_king: "最近的事件和我失去权势的教训告诉我，不要承担超出自己能力的事。我们目前无法维持摩拉维亚的传教事业。也许等我们东山再起之后，可以在新的条件下再次尝试。\n\n在那之前，[ROOT.Char.GetPrimaryTitle.GetNameNoTier]需要得到保护，以免重蹈覆辙。"
 slavic_rite.0006.desc.no_longer_slav: "我的祖先大概不会为我现在的样子感到骄傲。\n\n那就这样吧。如何统治[ROOT.Char.GetPrimaryTitle.GetNameNoTier]不是他们说了算，只有我才能决定。"
 slavic_rite.0006.a.brothers_are_dead: "本不应如此……"
 slavic_rite.0006.a.no_longer_christian: "赞美[ROOT.Char.GetFaith.HighGodName]！"
 slavic_rite.0006.a.no_longer_king: "我再也负担不起这样的野心了。"
 slavic_rite.0006.a.no_longer_slav: "格拉哥里字母成了治下人民的负担。"
 slavic_rite.0006.a.tooltip: "向领地宣传福音的$story_slavic_rite$已无效。"
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "为[ROOT.Char.GetFaith.HighGodName]所统一的国度"
 slavic_rite.0007.desc: "“#italic ……使我们在[ROOT.Char.GetHerHis]的统治之下，可以敬虔端正、平安无事的度日。\n\n因为天下万国，普世权威，一切荣耀，\n永归于祢。阿们。#!”\n\n当[archdiocese_holder.GetTitledFirstName]念毕这段祈祷，一股永恒的福乐之感漫过我的灵魂。我们那“将自身的天上传统传遍国度每一角落”的使命，已然大获全胜。愿[ROOT.Char.GetFaith.HighGodName]赐福我的家室、[Glossary( '基里尔与麦托迪', 'CYRIL_AND_METHODIUS_GLOSS' )]兄弟，以及[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]的善良子民。"
 slavic_rite.0007.a: "我们命中注定要踏上这条神圣之路。"
 pam_slavic_rite_clergy_opinion_modifier: "蒙福的君主"
 slavic_rite.0007.b: "我的人民没有什么是不能承受的。"
 pam_slavic_rite_culture_opinion_modifier: "人民之君"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "地下传教士"
 slavic_rite.0010.desc: "在我的宫廷司祭[court_chaplain.GetTitledFirstName]的押送下，一位[undercover_preacher.GetCulture.GetNameNoTooltip][undercover_preacher.Custom('MyPriestTitle')]与[undercover_preacher.GetHerHis]随行的一群传教士厚着脸皮走进了我的大厅。\n\n“向您致敬，[ROOT.Char.GetTitleAsNameNoTooltip]。我们发现这些渗透者在宣讲[ROOT.Char.GetFaith.HighGodName]的话语，却不尊重[court_chaplain_superior.GetTitledFirstName]的权威，也不尊重您的权威。”[court_chaplain.GetSheHe|U]停下来，从头到脚打量了这个外来者一番，然后又转向你。\n\n“据说，他们已经在暗处潜伏了相当长一段时间，试图说服并玷污您那些毫无戒备的子民的灵魂。您希望我们如何处置他们？”"
 slavic_rite.0010.a: "滚开，别再出现在我的领地。"
 slavic_rite.0010.b: "看来我们之前的警告还不够啊。"
 slavic_rite.0010.c: "你没必要面对你失望的主人。"
 slavic_rite.0010.c.success: "[undercover_preacher.GetSheHe|U]愿意在你的宫廷开始新生活"
 slavic_rite.0010.c.failure: "[undercover_preacher.GetSheHe|U]未被说服"
 preacher_recruited.t: "招募传教士"
 preacher_left.t: "传教士离开"
 # 0020
 slavic_rite.0020.t: "为虔诚事业的拨款"
 slavic_rite.0020.desc: "“他们并不想占当地人的便宜，[ROOT.Char.GetTitleAsNameNoTooltip]。[court_chaplain_superior.GetTitledFirstNamePossessive]的巡回传教士在这方面非常体贴。他们甚至想让我跟您谈谈，这种谦卑值得称赞。一份确认会让他们和您的人民都轻松很多。”\n\n[court_chaplain.GetTitledFirstNamePossessive]替别人来说服我的努力值得注意，但我不禁在想，[court_chaplain.GetSheHe]是不是该把这些才能用在帮助我的人民放下旧传统上。\n\n“我有预感，这是[ROOT.Char.GetFaith.HighGodNamePossessive]给您一个拉近关系的机会。”"
 slavic_rite.0020.a: "我们越快消除人们的不虔诚越好。"
 pam_slavic_rite_great_project_speed_modifier: "投资皈依项目"
 slavic_rite.0020.b: "我们只能匀出这么多。"
 slavic_rite.0020.c: "绝对不行。"
 # 0030
 slavic_rite.0030.t: "东西论战"
 slavic_rite.0030.desc: "一阵微风拂过修道院花园里的树叶，[court_chaplain_superior.GetTitledFirstName]的两位客座教士在辩论的人群中面对面站着。一位身着东方传统服饰，另一位带着西方的权威。他们起初谦逊的声音变得自信而热忱。\n\n他们讨论了许多礼仪话题，从学术辩论转向引人入胜的争论，我对每一句话都越来越感兴趣。\n\n这不只是一场对话；它象征着两个世界之间的较量，暗示着脆弱的和谐，或者更深的隔阂。"
 slavic_rite.0030.a: "[visiting_byzantine_clergy.GetCulture.GetNameNoTooltip][visiting_byzantine_clergy.Custom('MyPriestTitle')]说得有理。"
 slavic_rite.0030.b: "[visiting_carolingian_clergy.GetNamePossessiveNoTooltip]的论据耐人寻味。"
 slavic_rite.0030.c: "知识就是知识，我两方都同意。"
 slavic_rite.0030.d: "我们的道路比这些古老的教义都强。"
