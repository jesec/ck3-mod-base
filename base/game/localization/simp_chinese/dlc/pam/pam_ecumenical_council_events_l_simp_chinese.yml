 ecumenical_council_events.0113.t: "信仰武装"
 ecumenical_council_events.0113.desc: "那些领土遭受异教邪恶势力蹂躏的人，因共同的悲愤而退至一旁。\n\n“信仰的敌人在烧我的田地，”[lead_conservative.GetTitledFirstName]宣称，“我们还要在愚蠢的梦想上吵来吵去吗？难道刀剑还没有刺穿我们的心？”\n\n“分裂的信条是破碎的盾牌，”[lead_innovator.GetTitledFirstName]回答。“让我们把教会法确立下来，届时我们将团结一致地去战斗，重振旗鼓！”"
 ecumenical_council_events.0113.support: "能再次尝到希望的滋味，会是件好事。"
 ecumenical_council_events.0113.support_duel: "让我们弥合教会，我们的盾牌！"
 ecumenical_council_events.0113.support_duel.success: "他们接受，并将并肩作战"
 ecumenical_council_events.0113.support_duel.success_halved: "部分人被说服进行改革"
 ecumenical_council_events.0113.support_duel.failure: "他们已经不记得希望"
 ecumenical_council_events.0113.oppose: "难道没有比这些荒唐事更紧要的事吗？"
 ecumenical_council_events.0113.oppose_duel: "警告他们不要鲁莽行事。"
 ecumenical_council_events.0113.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0113.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0113.oppose_duel.failure: "他们仍徒劳地希望着"
 ecumenical_council_events.0113.conservatives_custom: "被[besieged|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0113.conservatives_custom_halved: "被[besieged|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0113.innovators_custom: "被[besieged|E]的[ec_innovators|E]（#V [feature_innovators_size]#!）"
