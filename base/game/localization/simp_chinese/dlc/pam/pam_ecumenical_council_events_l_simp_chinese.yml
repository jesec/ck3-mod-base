 # Flavor Events
 ecumenical_council_summons_events.0001.t: "[guest_1.GetTitleAsNameNoTooltip|U]的担忧"
 ecumenical_council_summons_events.0001.desc: "“而那个问题……[guest_1.GetFaith.HighGodName]啊，它一直在折磨我，我几乎睡不着……”[guest_1.GetTitledFirstName]痛苦地低声向[guest_2.GetTitledFirstName]倾诉。\n\n“我明白……”[guest_2.GetFirstNameNoTooltip]点了点头，“或许你可以和主持者[host.GetTitleAsNameNoTooltip]谈谈？[host.GetSheHe]也许能给出一些心灵上的建议？”"
 ecumenical_council_summons_events.0001.a: "什么事让[guest_1.GetHerHim]这样担忧……"
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "你得知了[guest_1.GetShortUINamePossessive]的秘密"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip]只需要一些友善的安慰。"
 ecumenical_council_summons_events.0001.c: "还是不知道为好。"
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U]在大公会议上就[TARGET_CHARACTER.GetShortUINamePossessive]的秘密安慰了[TARGET_CHARACTER.GetShortUIName]。"
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]在大公会议上就[CHARACTER.GetShortUINamePossessive]的秘密安慰了[CHARACTER.GetShortUIName]。"
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUIName|U]试图在会议上打听[TARGET_CHARACTER.GetShortUINamePossessive]的秘密时被抓个正着。"
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U]将在会议上打听[CHARACTER.GetHerHis]的秘密的[TARGET_CHARACTER.GetShortUIName]抓个正着。"
 ecumenical_council_summons_events.0010.t: "秘密"
 ecumenical_council_summons_events.0010.desc: "我们的东道主[host.GetTitledFirstName]似乎没注意到我的存在，[host.GetSheHe]正由一名仆人帮着整理[host.GetHerHis]的法衣。\n\n“[host.GetFaith.HighGodName]啊，请宽恕我……”[host.GetSheHe]喃喃自语，“这些关于我……取向的谣言。竟认为我，基督的代表，沉浸于这种癖好！这些谣言绝不能传到我的枢机耳中。”"
 ecumenical_council_summons_events.0010.a: "“我看出你已悔过，[host.GetTitleAsNameNoTooltip]。”"
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "你得知了[host.GetShortUINamePossessive]的秘密"
 ecumenical_council_summons_events.0010.b: "“[ROOT.Char.Custom('RandomBibleQuoteShort')]”"
 ecumenical_council_summons_events.0010.b.flavor: "[host.GetSheHe|U]将从经文中寻得慰藉！"
 ecumenical_council_summons_events.0010.c: "有些事情最好留在蒙昧中。"
 ecumenical_council_summons_events.0020.t: "后勤问题"
 ecumenical_council_summons_events.0020.desc.intro: "“若非得如此……”[host.GetTitledFirstName]示意一名司祭退下。\n\n“[ROOT.Char.GetTitledFirstNameNoTooltip]！”[host.GetSheHe|U]唤我注意。"
 ecumenical_council_summons_events.0020.desc.caravans: "“给我们运送粮食的大篷车还没有抵达。"
 ecumenical_council_summons_events.0020.desc.servants: "“我们的人手实在不够，无法招待所有宾客。"
 ecumenical_council_summons_events.0020.desc.overcrowded: "“[ROOT.Char.GetCurrentLocation.GetName]为这场会议安排的住所，实在容纳不下这么多宾客。"
 ecumenical_council_summons_events.0020.desc.outro: "但想必你也没办法解决我们的麻烦吧？”"
 ecumenical_council_summons_events.0020.aaa: "“这是我的领土，陛下。我自会安排妥当。”"
 ecumenical_council_summons_events.0020.aa: "我知道#EMP 很多#!人还欠我一个人情……"
 ecumenical_council_summons_events.0020.a: "“只要金子到位，一切好办，陛下！”"
 ecumenical_council_summons_events.0020.b: "“我将动用我的所有人脉！”"
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName]会记得我这位有影响力的候选人……"
 ecumenical_council_summons_events.0020.c: "我只能献上谦逊的祈祷……"
 ecumenical_council_summons_events.0020.papabile_tt: "你的[papabile_score|E]提高#P +10#!"
 ecumenical_council_summons_events.0030.t: "风雨无常"
 ecumenical_council_summons_events.0030.desc.intro: "大公会议召开在即，狂风呼啸，暴雨抽打着道路。"
 ecumenical_council_summons_events.0030.desc.dry_season: "在这个时节，这样的恶劣天气实属反常。"
 ecumenical_council_summons_events.0030.desc.wet_season: "时至这个季节，这样的恶劣天气本就在意料之中。"
 ecumenical_council_summons_events.0030.desc.outro: "我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )]，[chaplain.GetFirstName]浑身止不住地瑟瑟发抖。\n\n“大人……恐怕我无法继续参加会议了。这场狂风暴雨与降温，对我的身体不大好。我积了太多痰……”"
 ecumenical_council_summons_events.0030.aa: "“我读了#EMP 很多#!关于这种症状的书！”"
 ecumenical_council_summons_events.0030.a: "我必须请最训练有素的医生！"
 ecumenical_council_summons_events.0030.b: "“我会为你祈祷的。”"
 ecumenical_council_summons_events.0030.c: "生死有命，顺其自然。"
 ecumenical_council_summons_events.0040.t: "怯场"
 ecumenical_council_summons_events.0040.desc: "大公会议日渐临近，我发现我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )][chaplain.GetFirstName]正焦躁地在庭院中来回踱步。\n\n“关于[ROOT.Char.GetFaith.ReligiousSymbol]的形态问题，这是当然，这是当然……还有[chaplain.CustomFixedRandom('random_learning_topic')]相关的争议……？”我听见[chaplain.GetHerHim]低声喃喃自语。"
 ecumenical_council_summons_events.0040.aa: "“你应谨记[ROOT.Char.GetFaith.KnowledgeGodName]的教诲，[chaplain.GetFirstNameNoTooltip]。”"
 ecumenical_council_summons_events.0040.aa.flavor: "一些精神上的指导会令人安心。"
 ecumenical_council_summons_events.0040.a: "需要提醒[chaplain.GetSheHe|U]，[chaplain.GetSheHe]代表着我的颜面。"
 ecumenical_council_summons_events.0040.a.tt.success: "你的外交能力收效良好"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName]对你的好意心存疑虑"
