 ecumenical_council_events.0101.t: "学者之言"
 ecumenical_council_events.0101.desc: "学者们在大厅里引经据典，每一句都让争论更加尖锐。\n\n“[lead_conservative.GetFaith.ReligiousText|U]说得很清楚，”[lead_conservative.GetTitledFirstName]坚持道，“[ec_current_topic.GetName( activity.GetHost.GetRite )]应当保持不变。”\n\n“请完整阅读我引用的段落，”[lead_innovator.GetTitledFirstName]回答道，“你会发现它几乎就是在要求这项改革！”"
 ecumenical_council_events.0101.support: "指出他们在断章取义。"
 ecumenical_council_events.0101.support_duel: "以更深的学识驳倒他们。"
 ecumenical_council_events.0101.support_duel.success: "他们接受了由经文而得的变革"
 ecumenical_council_events.0101.support_duel.success_halved: "部分人接受了由经文而得的变革"
 ecumenical_council_events.0101.support_duel.failure: "他们仍声称经文明确反对这一点"
 ecumenical_council_events.0101.oppose: "支持[lead_conservative.GetTitledFirstNameNoTooltip]：经文不能变动。"
 ecumenical_council_events.0101.oppose_duel: "争辩这种变革源于时代的改变。"
 ecumenical_council_events.0101.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0101.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0101.oppose_duel.failure: "他们仍坚持对变革的解读"
