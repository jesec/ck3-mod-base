 ecumenical_council_summons_events.0050.t: "质疑信仰"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName]一瞥见[non_pious_guest.GetTitledFirstName]的身影，就几乎压不住心中的讥讽。\n\n“[ROOT.Char.GetTitleAsNameNoTooltip]，快看哪！”[pious_guest.GetSheHe]向我指出，“[non_pious_guest.GetFirstNameNoTooltip]今天竟肯亲临圣会，真该受到表扬！我还以为，[non_pious_guest.GetSheHe]唯一熟悉的去处是城里的[Glossary( '澡堂', 'BATHHOUSES_GLOSS' )]呢。"
 ecumenical_council_summons_events.0050.desc.non_pious_host: "可笑的是，[non_pious_guest.GetSheHe]竟还自称是全体[ROOT.Char.GetFaith.GetAdherentNamePlural]的领袖。”"
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip]才是担当此职的合适人选。"
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "真没想到[non_pious_guest.GetSheHe]会决定来参加这次会议。”"
 ecumenical_council_summons_events.0050.aa: "好的牧者，本就该出于羊群中……"
 ecumenical_council_summons_events.0050.a: "“我可以将此事#EMP 公之于众#!……只要你付点报酬。”"
 ecumenical_council_summons_events.0050.b: "“[pious_guest.GetTitleAsNameNoTooltip]，#EMP 你#!怎么知道谁常去澡堂的？”"
 ecumenical_council_summons_events.0050.c: "感谢[ROOT.Char.GetFaith.HighGodName]带来了一些娱乐。"
 BATHHOUSES_GLOSS: "在许多中世纪城镇，曾经只用于简单沐浴的澡堂声名狼藉。其隐蔽的隔间为性工作者提供了足够的私密场所来从事交易。"
