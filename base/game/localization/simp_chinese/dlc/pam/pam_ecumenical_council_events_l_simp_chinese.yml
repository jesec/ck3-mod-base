 ecumenical_council_events.0104.t: "亲族教士"
 ecumenical_council_events.0104.desc: "族中的神职人员们正在讨论[ROOT.Char.GetHouse.GetName]家族应当支持哪一方。[lead_conservative.GetTitledFirstName]说：“我们的家族不应公开分裂；我不会支持[host.GetTitledFirstName]！”\n\n而[lead_innovator.GetTitledFirstName]则在[lead_conservative.GetTitledFirstNamePossessiveNoTooltip]身后做出嘲弄的手势，暗示并非所有族人都反对革新。"
 ecumenical_council_events.0104.support: "呼吁[ROOT.Char.GetHouse.GetNameNoTooltip]家族支持变革。"
 ecumenical_council_events.0104.support_duel: "说服拒绝革新的人。"
 ecumenical_council_events.0104.support_duel.success: "你的家族将一并支持革新"
 ecumenical_council_events.0104.support_duel.success_halved: "部分人将支持革新"
 ecumenical_council_events.0104.support_duel.failure: "你的家族分裂了"
 ecumenical_council_events.0104.oppose: "与[lead_conservative.GetFirstNameNoTooltip]一道反对革新。"
