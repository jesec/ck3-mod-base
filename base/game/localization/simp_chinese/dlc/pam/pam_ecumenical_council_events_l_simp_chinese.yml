 ecumenical_council_events.0107.t: "初次参会"
 ecumenical_council_events.0107.desc: "一群年轻的神职人员交头接耳，显然他们中的许多人都是第一次参加，大公会议，因而兴奋不已。\n\n“一场运动正在这里兴起：你们能感觉到[lead_innovator.GetFaith.HouseholdGodName]的触动吗？让我们以一种早已被遗忘的大胆在教会上留下印记！”[lead_innovator.GetTitledFirstName]说。\n\n“可鄙的蠢货！我们必须遵从教会教父，拒绝这些令人作呕的变革，。”[lead_conservative.GetTitledFirstName]坚持说。"
 ecumenical_council_events.0107.support: "信仰的黎明！"
 ecumenical_council_events.0107.support_duel: "驳斥这种保守的怯懦。"
 ecumenical_council_events.0107.support_duel.success: "他们的眼中闪烁着希望的光芒"
 ecumenical_council_events.0107.support_duel.success_halved: "部分人承诺提供支持"
 ecumenical_council_events.0107.support_duel.failure: "他们依然充满蔑视"
 ecumenical_council_events.0107.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip]所言属实。"
 ecumenical_council_events.0107.oppose_duel: "痛斥鲁莽的后果！"
 ecumenical_council_events.0107.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
