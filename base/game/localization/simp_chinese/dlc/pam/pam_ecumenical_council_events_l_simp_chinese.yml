 # ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "牢骚满腹的灰发"
 ecumenical_council_events.0111.desc: "那些头发灰白的老者们转来转去，互相争吵。\n\n“我们看着会议一次次来了又走，每一次都出了错。相比于纠正那些歪路，看样子我们更想要变本加厉！”[lead_conservative.GetTitledFirstName]抱怨说。\n\n“你这老[lead_conservative.Custom('RegionalFarmAnimal')]！上次你也是这么说的，你就一直这么嚷嚷到进坟墓吧！”[lead_innovator.GetTitledFirstName]吼了回去。"
 ecumenical_council_events.0111.support: "这些变革将纠正历史遗留的错误！"
 ecumenical_council_events.0111.support_duel: "重申有利于守旧派的论点。"
 ecumenical_council_events.0111.support_duel.success: "他们一边发着牢骚，一边接受了"
 ecumenical_council_events.0111.support_duel.success_halved: "部分人接受了这一纠正"
 ecumenical_council_events.0111.support_duel.failure: "他们依然喊着“邪路一条！”"
 ecumenical_council_events.0111.oppose: "支持[lead_conservative.GetTitledFirstNameNoTooltip]：别再犯傻了。"
 ecumenical_council_events.0111.oppose_duel: "把这些老爱做梦的人打入智识的尘埃！"
 ecumenical_council_events.0111.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0111.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0111.oppose_duel.failure: "革新派依旧洁身自好"
