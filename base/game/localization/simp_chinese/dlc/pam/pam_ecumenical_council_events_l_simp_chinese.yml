 pam_rite_quarrel_championed_opinion: "在大公会议上支持了我所属的礼仪"
 pam_rite_quarrel_slighted_opinion: "在大公会议上支持其他礼仪而反对我的"
 pam_rite_quarrel_overruled_opinion: "在大公会议上否决了我的礼仪"
 ecumenical_council_summons_events.0060.t: "同侪之首"
 ecumenical_council_summons_events.0060.desc: "代表[GetRiteByKey('roman_rite').GetName]发言的[ec_roman_champion.GetTitledFirstName]不肯罢休：\n\n“所有教会都听命于罗马，而罗马不听命于任何人！”\n\n[ec_greek_champion.GetTitledFirstName]掰着[ec_greek_champion.GetHerHis]的手指，数出五位牧首：\n\n“他们之中，有谁曾跪下过？”"
 ecumenical_council_summons_events.0060.a: "“你们两个都闭嘴。大公会议还没开始。”"
 ecumenical_council_summons_events.0060.a.success: "两人在大殿表态之前就被劝服了"
 ecumenical_council_summons_events.0060.a.failure: "他们都不听我的，在大殿里各自站队"
 ecumenical_council_summons_events.0060.b: "伯多禄得到了钥匙，而罗马掌控着它们。"
 ecumenical_council_summons_events.0060.c: "罗马只不过是众教区中的首席。"
 ecumenical_council_summons_events.0060.d: "我担任此职，此事到此为止。"
 ecumenical_council_summons_events.0061.t: "和子"
 ecumenical_council_summons_events.0061.desc: "“两个字，”[GetRiteByKey('byzantine_rite').GetName]的[ec_greek_champion.GetTitledFirstName]说道。“[GetRiteByKey('roman_rite').GetAdherentNamePlural]未曾征询东方便偷偷塞进信经里两个字。”\n\n“真理不需要任何人的许可，只需要天主的许可。”[ec_roman_champion.GetTitledFirstName]答道。"
 ecumenical_council_summons_events.0061.a: "信经历经的磨难远不止一场争执。"
 ecumenical_council_summons_events.0061.a.success: "措辞在争论僵化之前便已搁置"
 ecumenical_council_summons_events.0061.a.failure: "双方的争论都固化为教义"
 ecumenical_council_summons_events.0061.b: "添加这些词语是因为它们属实。"
 ecumenical_council_summons_events.0061.c: "信条由大公会议订立，也有大公会议能够修改。"
 ecumenical_council_summons_events.0061.d: "信经将在此处由我诵读。"
 ecumenical_council_summons_events.0062.t: "祭坛之饼"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName]举起一块无酵饼，薄而苍白，如同一枚钱币，说道：\n\n“[GetRiteByKey('roman_rite').GetAdherentNamePlural]从来不需要更多。”\n\n[ec_greek_champion.GetTitledFirstName]将一块有酵饼放在它旁边，问道：\n\n“那么，[GetRiteByKey('byzantine_rite').GetAdherentNamePlural]自宗徒时代以来就一直是错的吗？”"
 ecumenical_council_summons_events.0062.a: "明天两块饼都将在我的祭坛上受祝福，我们会各吃一块。"
 ecumenical_council_summons_events.0062.a.success: "两块饼都被吃了，争吵也随之而去"
 ecumenical_council_summons_events.0062.a.failure: "那天晚上摆好了两座祭坛，无人跨越其间"
 ecumenical_council_summons_events.0062.b: "无酵饼，如同最后的晚餐那样。"
 ecumenical_council_summons_events.0062.c: "有酵饼，献给复活的主。"
 ecumenical_council_summons_events.0062.d: "饼就是饼。重要的是祝福。"
 ecumenical_council_summons_events.0063.t: "语言问题"
 ecumenical_council_summons_events.0063.desc: "祷文以拉丁语诵读。[GetRiteByKey('byzantine_rite').GetAdherentNamePlural]的席位上，众人等着译文，而他们等来的译文却走了样。[ec_greek_champion.GetTitledFirstName]低声嘟囔道：\n\n“罗马礼辩论起来像律师。冗长，却无实质。”\n\n“希腊礼辩论起来像哲学家。什么也解决不了。”[ec_roman_champion.GetTitledFirstName]回应道。"
 ecumenical_council_summons_events.0063.a: "那么，就让我们找到用两种语言都能表达的词语吧。"
 ecumenical_council_summons_events.0063.a.success: "找到了一种两边都不会曲解的措辞"
 ecumenical_council_summons_events.0063.a.failure: "双方都笃定对方在恶意辩论"
 ecumenical_council_summons_events.0063.b: "用拉丁语讲明白。"
 ecumenical_council_summons_events.0063.c: "教父们用希腊文写作，我们可以设法读懂。"
 ecumenical_council_summons_events.0063.d: "以我的名义，双语并行。事情到此为止。"
