 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetNameNoTooltip]情感"
 ecumenical_council_events.0105.desc: "在会场的众多语言中，[ROOT.Char.GetCulture.GetLanguage.GetName]那熟悉的声音格外突出。当然，那是[lead_conservative.GetTitledFirstName]在纠缠我们的同胞。\n\n“我们[lead_conservative.GetCulture.GetCollectiveNounNoTooltip]人对这种革新毫无兴趣！”[lead_conservative.GetSheHe]高声斥责。\n\n“但难道你们希望我们因教会的停滞不前而受到指责吗？”[lead_innovator.GetTitledFirstName]反驳道。"
 ecumenical_council_events.0105.support: "你不能代表我们所有人，[lead_conservative.GetFirstNameNoTooltip]。"
 ecumenical_council_events.0105.support_duel: "我们[lead_conservative.GetCulture.GetCollectiveNounNoTooltip]人拥有革新的历史。"
 ecumenical_council_events.0105.support_duel.success: "在场所有人都同意支持革新"
 ecumenical_council_events.0105.support_duel.success_halved: "部分人同意支持革新"
 ecumenical_council_events.0105.support_duel.failure: "他们仍拒绝革新"
 ecumenical_council_events.0105.oppose: "支持[ROOT.Char.GetCulture.GetNameNoTooltip]人的传统！"
 ecumenical_council_events.0105.oppose_duel: "捍卫传统。"
 ecumenical_council_events.0105.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
