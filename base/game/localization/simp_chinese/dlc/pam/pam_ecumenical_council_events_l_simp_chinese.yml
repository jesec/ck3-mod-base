 ecumenical_council_events.0110.t: "野心勃勃"
 ecumenical_council_events.0110.desc: "“这只是一处小小的修正！”[lead_innovator.GetTitledFirstName]说，“而且如果我们帮忙推动通过，我们作为[lead_innovator.GetFaith.ReligiousHeadName]候选人的地位也会更有利”\n\n“你那野心过于膨胀，会让我们所有人一同遭殃。”[lead_conservative.GetTitledFirstName]冷笑着说。"
 ecumenical_council_events.0110.support: "适度的野心有其可取之处"
 ecumenical_council_events.0110.support_duel: "进一步争取改进！"
 ecumenical_council_events.0110.support_duel.success: "他们接受：这只不过是一个微不足道的改动"
 ecumenical_council_events.0110.support_duel.success_halved: "部分人接受了拥护的功劳"
 ecumenical_council_events.0110.support_duel.failure: "你们的野心昭然若揭"
 ecumenical_council_events.0110.oppose: "骄者必败"
 ecumenical_council_events.0110.oppose_duel: "警惕野心带来的邪恶！"
 ecumenical_council_events.0110.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
