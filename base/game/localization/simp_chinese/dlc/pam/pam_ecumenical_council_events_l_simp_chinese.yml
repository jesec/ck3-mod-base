 ecumenical_council_events.0115.innovators_custom_halved: "高[intrigue|E]的[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0116.t: "谁来付账？"
 ecumenical_council_events.0116.desc: "我发现几个教区的管家趴在一张碎羊皮纸上，争论着数字，仿佛这里不是大厅而是账房。\n\n“我的教区经不起再一场动荡了，”[lead_conservative.GetTitledFirstName]说。“每个堂区都要新书。每个[lead_conservative.GetFaith.HouseOfWorship]村庄都要信使。要是这事通过了，什一税根本撑不住。”\n\n“那要是通不过呢？”[lead_innovator.GetTitledFirstName]问。“我们已经争吵了好几年。那些钱无论如何都花掉了。不如把剩下的花在一条信徒会遵守的法律上。”"
 ecumenical_council_events.0116.support: "是的，何必为已花掉的银币哀叹？"
 ecumenical_council_events.0116.support_duel: "就这样论证：支持即投资！"
 ecumenical_council_events.0116.support_duel.success: "他们被引诱支持改革"
 ecumenical_council_events.0116.support_duel.success_halved: "部分人接受这一说法"
 ecumenical_council_events.0116.support_duel.failure: "他们仍在抱怨开支"
 ecumenical_council_events.0116.oppose: "我的教区承受不起这场动荡。"
 ecumenical_council_events.0116.oppose_duel: "“[ROOT.Char.GetFaith.HighGodName]啊！这是财务上的不负责任！”"
 ecumenical_council_events.0116.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派放弃"
 ecumenical_council_events.0116.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人放弃"
 ecumenical_council_events.0116.oppose_duel.failure: "他们坚持自己的投资"
 ecumenical_council_events.0116.conservatives_custom: "高[stewardship|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0116.conservatives_custom_halved: "高[stewardship|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0116.innovators_custom: "高[stewardship|E]的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0116.innovators_custom_halved: "高[stewardship|E]的[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0117.t: "过多修正案"
 ecumenical_council_events.0117.desc: "我瞥见两位经验丰富的谈判者正在法令的页边起草条款，像对待正式条约一样反复删改某一条款。\n\n“就这样留着吧！否则我们还没碰到更棘手的问题，就有一半人要走了，”[lead_conservative.GetTitledFirstName]说。“我花了几个月才把这些人留在同一张桌前。措辞要再软化些，不然整场会议都保不住了。”\n\n“然后等会议结束后，留下一堆没人执行的烂摊子？”[lead_innovator.GetTitledFirstName]回答道。"
 ecumenical_council_events.0117.support: "我们必须有说服力，必须要清晰明确。"
 ecumenical_council_events.0117.support_duel: "一道坚定的法令总比万马齐喑好，不是吗？"
 ecumenical_council_events.0117.support_duel.success: "他们接受了，不会有烂摊子了"
 ecumenical_council_events.0117.support_duel.success_halved: "部分人接受了，起码不会有烂摊子了"
 ecumenical_council_events.0117.support_duel.failure: "他们仍然害怕被疏远"
 ecumenical_council_events.0117.oppose: "我们不能冒在大公议会上失败的风险！"
 ecumenical_council_events.0117.oppose_duel: "这太不成熟了，不能通过！"
 ecumenical_council_events.0117.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0117.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0117.oppose_duel.failure: "他们坚持自己的主张"
 ecumenical_council_events.0117.conservatives_custom: "高[diplomacy|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0117.conservatives_custom_halved: "高[diplomacy|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0117.innovators_custom: "高[diplomacy|E]的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0117.innovators_custom_halved: "高[diplomacy|E]的[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0118.t: "遥远教座的传统"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName]，会议上的一位来自[lead_conservative.GetCulture.GetNameNoTooltip]的显赫成员，和一群远道而来维护教会传统的神职人员站在一起。\n\n“[lead_conservative.GetFaith.GetAdjective]世界就像[lead_conservative.GetFaith.HighGodName]的爱一样广阔，”[lead_conservative.GetSheHe]说。“我们希望这趟朝圣之行不是为了眼睁睁看着[lead_innovator.GetTitledFirstName]宣扬要拆散教会教父们的事业。”"
 ecumenical_council_events.0118.support: "最艰难的朝圣会带来最高深的启示。"
 ecumenical_council_events.0118.support_duel: "向他们保证[lead_innovator.GetFirstNamePossessiveNoTooltip]得到的启示。"
 ecumenical_council_events.0118.support_duel.success: "他们接受了这些教父传统的安全性"
 ecumenical_council_events.0118.support_duel.success_halved: "部分人接受了这些教父传统的安全性"
 ecumenical_council_events.0118.support_duel.failure: "他们仍然担忧[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]的宣道"
 ecumenical_council_events.0118.oppose: "“让我们共同缅怀你的牺牲。”"
 ecumenical_council_events.0118.oppose_duel: "“我将宣讲反对[lead_innovator.GetTitledFirstNameNoTooltip]。”"
 ecumenical_council_events.0118.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0118.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0118.oppose_duel.failure: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]的信徒不为所动"
 ecumenical_council_events.0118.conservatives_custom: "来自远方的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0118.conservatives_custom_halved: "来自远方的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0118.innovators_custom: "宣扬变革的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0118.innovators_custom_halved: "宣扬变革的[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0120.t: "史书留名"
 ecumenical_council_events.0120.desc: "几位最有名望的客人退到会场边缘，掂量着这一切被记录下来后他们的名声会怎样。\n\n“最近写的每部编年史里都找得到我的名字。我有什么必要被绑在一条可能被永世嘲笑的诏书上？”[lead_conservative.GetTitledFirstName]说。\n\n“人们记得的是解决争端的人，不是比谁双手最干净。而我将会这样被铭记。”[lead_innovator.GetTitledFirstName]回答。"
 ecumenical_council_events.0120.support: "“难道我们不是教会的领袖吗？”"
 ecumenical_council_events.0120.support_duel: "“你绝不会孤军奋战！”"
 ecumenical_council_events.0120.support_duel.success: "质疑者让自己载入了史册"
 ecumenical_council_events.0120.support_duel.success_halved: "部分人让自己载入了史册"
 ecumenical_council_events.0120.support_duel.failure: "他们依然不愿面对"
 ecumenical_council_events.0120.oppose: "我不会让我的名声沦为笑柄。"
 ecumenical_council_events.0120.oppose_duel: "“愚者平息争执……却以闹剧执行。”"
 ecumenical_council_events.0120.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0120.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0120.oppose_duel.failure: "他们并不在意你的侮辱。"
 ecumenical_council_events.0120.conservatives_custom: "有[prestige|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0120.conservatives_custom_halved: "有[prestige|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0120.innovators_custom: "有[prestige|E]的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0120.innovators_custom_halved: "有[prestige|E]的[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0122.t: "趁我尚有能力之时"
 ecumenical_council_events.0122.desc: "几个病恹恹的教士远离大厅的人群坐着，寻找太阳的温暖。\n\n“不知到在去面见[lead_conservative.GetFaith.HighGodName]之前，我能不能听见这次会议的尾声……然后就带着它新鲜恐怖的气味下到[lead_conservative.GetFaith.NegativeAfterLife]里去。”[lead_conservative.GetTitledFirstName]喘息着说。\n\n“你已经没什么可失去的了，[lead_conservative.GetFirstNameNoTooltip]，但你一定还剩下一些希望可以留给这个世界，好让你能平安地去[lead_innovator.GetFaith.PositiveAfterLife]吧？”[lead_innovator.GetTitledFirstName]答道。"
 ecumenical_council_events.0122.support: "“以[ROOT.Char.GetFaith.HighGodName]之名，这些最后时刻弥足珍贵！”"
 ecumenical_council_events.0122.support_duel: "我不会带着沉默面见[ROOT.Char.GetFaith.HighGodName]。"
 ecumenical_council_events.0122.support_duel.success: "他们受激励投身于最终的改革"
 ecumenical_council_events.0122.support_duel.success_halved: "部分人受激励投身于最终的改革"
 ecumenical_council_events.0122.support_duel.failure: "他们将在痛苦中消亡"
 ecumenical_council_events.0122.oppose: "我们最后的力量属于[ROOT.Char.GetFaith.HighGodName]，以及[ROOT.Char.GetFaith.HighGodHerHis|U]的圣言。"
 ecumenical_council_events.0122.oppose_duel: "“莫让此事玷污我们的一生！”"
 ecumenical_council_events.0122.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0122.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0122.oppose_duel.failure: "他们仍然受到诅咒"
 ecumenical_council_events.0122.conservatives_custom: "[health|E]糟糕的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0122.conservatives_custom_halved: "[health|E]糟糕的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0122.innovators_custom: "[health|E]糟糕的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0122.innovators_custom_halved: "[health|E]糟糕的[ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0123.t: "当战争来临"
 ecumenical_council_events.0123.desc: "我发现我的盟友们在争吵，几乎像是在战场上互相摆开了架势。这是个坏兆头。\n\n“我们只有一个共同利益，该死的！别让我像宠物似的投票，像什么[ROOT.Char.GetTitledFirstName]牵着链子的吠叫的猎犬！”[lead_conservative.GetTitledFirstName]厉声道。\n\n“那我该怎么看待盟友，连用简单的话来兑现[lead_innovator.GetSheHe]用凡人的性命向[ROOT.Char.GetPrimaryTitle.GetNameNoTier]发过的誓都做不到？”[lead_innovator.GetTitledFirstName]反驳道。"
 ecumenical_council_events.0123.support: "“是的，我必须唤起所有的忠诚。”"
 ecumenical_council_events.0123.support_duel: "警告说你认为这是一种耻辱。"
 ecumenical_council_events.0123.support_duel.success: "你的盟友会站在你一边"
 ecumenical_council_events.0123.support_duel.success_halved: "部分盟友会站在你一边"
 ecumenical_council_events.0123.support_duel.failure: "你的盟友没有被恐吓"
 ecumenical_council_events.0123.oppose: "“在这里，你的忠诚只属于经文。”"
 ecumenical_council_events.0123.oppose_duel: "我将向[lead_innovator.GetFirstNameNoTooltip]这样的盟友寻求忠诚……"
 ecumenical_council_events.0123.oppose_duel.success: "你的盟友屈服了"
 ecumenical_council_events.0123.oppose_duel.success_halved: "你的部分盟友屈服了"
 ecumenical_council_events.0123.oppose_duel.failure: "你的盟友不会被召集起来反对你"
 ecumenical_council_events.0123.conservatives_custom: "[allied|E][ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0123.conservatives_custom_halved: "[allied|E][ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0123.innovators_custom: "[allied|E][ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0123.innovators_custom_halved: "[allied|E][ec_innovators|E]（#V [feature_innovators_size_halved]#!）"
 ecumenical_council_events.0126.t: "仇敌之间"
 ecumenical_council_events.0126.desc: "要在人群里找到[rival.GetTitledFirstName]，我的[ROOT.Char.Custom2('RelationToMe', rival)]，实在不容易。\n\n“你肯定知道我为何而来，”[rival.GetSheHe]咆哮道。“说你的话，选你的边……我只等着投你反对票。”"
 ecumenical_council_events.0126.a: "凭良心投票，而非仇恨。"
 ecumenical_council_events.0126.b: "收起你的怨恨吧，我不会上当的。"
 ecumenical_council_events.0126.c: "会议让[rival.GetHerHim]分心了……"
 ecumenical_council_events.0126.c.tt: "该[scheme|E]将#P 提高#![success_chance|E]"
 ecumenical_council_events.0126.conservatives_custom: "你的[rivals|E]中的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0126.innovators_custom: "你的[rivals|E]中的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0129.t: "会场中的恐惧"
 ecumenical_council_events.0129.desc: "那些在我面前瑟瑟发抖的人注视着这场争论，瞪大的眼睛像一团团颤抖的奶油。其中地位最低的[lead_conservative.GetTitledFirstName]甚至不敢与我对视：\n\n“说出你的要求吧，”[lead_conservative.GetSheHe]低声道，“我已经清楚拒绝你的后果了 。”"
 ecumenical_council_events.0129.support: "残忍从未让我失望过。"
 ecumenical_council_events.0129.support_duel: "我也会确保其他人也知晓此事。"
 ecumenical_council_events.0129.support_duel.success: "恐惧使他们屈服于你"
 ecumenical_council_events.0129.support_duel.success_halved: "恐惧只慑服了部分人"
 ecumenical_council_events.0129.support_duel.failure: "他们的恐惧转而成为反抗"
 ecumenical_council_events.0129.oppose: "于是，恐惧吞噬了希望。"
 ecumenical_council_events.0129.oppose_duel: "我不会让任何人违抗我。"
 ecumenical_council_events.0129.oppose_duel.success: "恐惧者纷纷同意"
 ecumenical_council_events.0129.oppose_duel.success_halved: "部分人选择服从"
 ecumenical_council_events.0129.oppose_duel.failure: "他们的恐惧化为了反抗"
 ecumenical_council_events.0129.conservatives_custom: "[intimidated|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0129.conservatives_custom_halved: "[intimidated|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
