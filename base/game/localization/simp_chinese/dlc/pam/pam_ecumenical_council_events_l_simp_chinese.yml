 ecumenical_council_events.0106.t: "效忠义务"
 ecumenical_council_events.0106.desc: "我和我的封臣们聚集在其中一间厅室里。\n\n“即使在这里，你们的领主也是你们的主人，”[lead_conservative.GetTitledFirstName]告诫其他人。“如果我们的[ROOT.Char.GetTitleAsName]不支持这种异端革新，那么你们也必须保持沉默。”\n\n“我们的[ROOT.Char.GetTitleAsNamePossessiveNoTooltip]在其他地方能管束我们，但在这里不行！”[lead_innovator.GetTitledFirstName]反驳道。"
 ecumenical_council_events.0106.desc_innovator: "我和我的封臣们齐聚一堂。\n\n“一位领主应当得到答复，”[lead_conservative.GetTitledFirstName]说，“遗憾的是，我担心这件事超出了[ROOT.Char.GetHerHim]的能力。唯有[lead_conservative.GetFaith.HighGodName]指引我们的心，[lead_conservative.GetFaith.HighGodName]划定了我们绝不能偏离的界线！”\n\n“啊，可是我们[ROOT.Char.GetTitleAsNamePossessiveNoTooltip]的愿望并没有违逆[ROOT.Char.GetFaith.HighGodNamePossessive]的意志，”[lead_innovator.GetTitledFirstName]回答。“想你的誓言，听听[ROOT.Char.GetHerHis]的智慧吧！”"
 ecumenical_council_events.0106.support: "“作为[ROOT.Char.GetTitleAsNameNoTooltip]，我是[ROOT.Char.GetFaith.HighGodName]的代理人。”"
 ecumenical_council_events.0106.support_duel: "要求这些封臣履行宣誓效忠的义务。"
 ecumenical_council_events.0106.support_duel.success: "他们会服从你"
 ecumenical_council_events.0106.support_duel.success_halved: "部分人同意服从你"
 ecumenical_council_events.0106.support_duel.failure: "你的封臣忠于[lead_conservative.GetFaith.HighGodName]"
 ecumenical_council_events.0106.oppose: "支持[lead_conservative.GetTitledFirstNameNoTooltip]：这超出了领主的权威范围。"
 ecumenical_council_events.0106.oppose_duel: "声称主的旨意并不违背上帝。"
 ecumenical_council_events.0106.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
