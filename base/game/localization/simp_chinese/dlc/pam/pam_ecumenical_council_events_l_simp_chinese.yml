l_simp_chinese:
 ecumenical_council_events.0001: "[my_location.GetBaronyNameExplicitlyNoTooltip]大公会议"
 ecumenical_council_events.0001.desc_intro: "[my_location.GetBaronyNameExplicitly]的诸座[ROOT.Char.GetFaith.HouseOfWorshipPlural]已为此盛会装点一新。整个基督教世界的贤达之士都已应邀响应"
 ecumenical_council_events.0001.host: "我的呼唤。"
 ecumenical_council_events.0001.dislikes_host: "[host.Custom('InsultAdjective')][host.GetTitledFirstNamePossessive]的呼唤。"
 ecumenical_council_events.0001.likes_host: "[host.Custom('ComplimentAdjective')][host.GetTitledFirstNamePossessive]的呼唤。"
 ecumenical_council_events.0001.neutral: "[host.GetTitledFirstNamePossessive]的呼唤。"
 ecumenical_council_events.0001.intent_arrived: "\n\n而且，我已经在与会者中望见[intent_target.GetTitledFirstName]的身影，好极了！"
 ecumenical_council_events.0001.waiting_for_intent: "\n\n距离[intent_target.GetTitledFirstName]现身会场，只是时间问题……"
 ecumenical_council_events.0001.no_intent_target: "\n\n我只需静候他们的到来！"
 ecumenical_council_events.0001.a.bad: "我必须如此。"
 ecumenical_council_events.0001.a.good: "圣责即是我责。"
 ecumenical_council_events.0002.t: "盛会召集"
 ecumenical_council_events.0002.desc_intro: "[host.GetFaith.HouseOfWorship]大门敞开，我们的重要工作可以开始了。准备期间，正是时候寻找盟友，一同致力于"
 ecumenical_council_events.0002.reformist: "调和君王与神职者之间的嫌隙。"
 ecumenical_council_events.schism_crisis_intro: "\n\n问候的语气是热络的，其间的沉默却不是。罗马和君士坦丁堡不再互致客套，每一处没被弥合的争执，都是基督这唯一躯体上的又一道裂痕。"
 ecumenical_council_events.0002.first_tenet: "\n\n空气中充满了议论声。被召集的人们开始就[ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]及其他紧迫事务表明立场。"
 ecumenical_council_events.0002.host: "\n\n我张开双臂，迎接一众信徒共同面对我们重要的使命。"
 ecumenical_council_events.0002.guest: "\n\n“欢迎，孩子们，愿上主指引我们完成这关键的使命！”[host.GetTitledFirstName]示意我们上前。"
 ecumenical_council_events.0002.a: "阿们。"
 ecumenical_council_events.0010.t: "我们对[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]的立场"
 ecumenical_council_events.0010.desc.intro: "首场辩论围绕[ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]展开。现行教会法将其地位定为[host.Custom('GetEcumenicalDebateTenet1StatusText')|l]。[lead_portrait.GetTitledFirstName]进行开场发言：\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n“越来越多的人认为这是崇拜的核心。”我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )][court_chaplain.GetFirstName]报告称。"
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n“禁止一项习俗确实存在风险，但在这种情况下是有充分理由的。”我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )][court_chaplain.GetFirstName]安慰道。"
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n“这种实践仍然很流行，若谴责它……会有一定风险。”我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )][court_chaplain.GetFirstName]提出了担忧。"
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n“这种实践正逐渐失去人心，现在正是放弃支持的良机。”我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )][court_chaplain.GetFirstName]建议道。"
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n“这种实践正逐渐流行起来，支持它或许是明智之举。”我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )][court_chaplain.GetFirstName]建议道。"
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n“这种实践令人费解，支持它会很危险。”我的[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )][court_chaplain.GetFirstName]警告道。"
 ecumenical_council_events.0010.desc.fallback.explanation: "“这是我们的信仰尚未厘清的教义，如今其定位交由本次大公会议裁决。”"
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "“我们被问及，是否维护[ROOT.Char.GetFaith.HighGodName]的和平与休战。我们的民众必须发誓，让教堂、圣职人员和手无寸铁之人免遭掠夺与杀戮吗？我们能让任何人不在神圣节期间拿起武器，违者逐出[ROOT.Char.GetFaith.GetAdjective]教会吗？”"
 ecumenical_council_events.0010.desc.dulia.explanation: "“我们被问及，圣人是否当受高度敬奉。他们的遗物可以被视为神圣，他们的庆节可以遵守，他们的代祷可以寻求，而我们的钦崇仍仅仅归于[ROOT.Char.GetFaith.HighGodName]吗？”"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "“我们被问及，藉由司铎的祝圣，祭台上的饼与酒是否真的变成了基督的体血。”"
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "“我们被问及，圣洁的生活是否必须让祈祷与劳作相协调。懒惰是灵魂的仇敌吗？我们在田间或缮写室的劳作，应当与[ROOT.Char.Custom('GetReligiousRite')]的时辰祈祷一样受到尊崇吗？”"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "“我们被问及，天主之母圣母玛利亚是否应当受到超过其他所有圣人的尊崇。”"
 ecumenical_council_events.0010.desc.simony.explanation: "“我们被问及，圣职、祝福或圣事可否用金钱买卖。”"
 ecumenical_council_events.0010.desc.monophysitism.explanation: "“我们被问及，基督是否只有一种性体，即完全的神性，而祂的人性被吞没，以致成了血肉身的圣言中只剩下神性。”"
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "“我们被问及，[ROOT.Char.GetFaith.GetAdjective]教会是否必须像《宗徒大事录》中所记载的那样存在。我们应当放出我们的传教士，带着传教热火，将圣言带给那些仍身处黑暗中的人吗？”"
 ecumenical_council_events.0010.desc.purgatory.explanation: "“我们被问及，既未受罚，又未完全洁净的灵魂，死后是否得以净化。活着的人的祈祷和礼仪能在他们见到[ROOT.Char.GetFaith.HighGodName]前帮助他们吗？”"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "“我们被问及，生育儿女是否是神圣的职责。信徒应当让子孙后代充满大地吗？”"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "“我们被问及，主教的权柄是否真的来自他们从宗徒传下来的不间断的继承。”"
 ecumenical_council_events.0010.desc.confession.explanation: "“我们被问及，每个[ROOT.Char.GetFaith.GetAdherentName]是否都必须向司铎告解以求赦罪。告解保密该被严格保守，不可侵犯吗？”"
 ecumenical_council_events.0010.desc.original_sin.explanation: "“我们被问及，是否每个灵魂都承继了亚当的罪。我们从出生就受到了玷污，需要洗礼的恩典吗？”"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "“我们被问及，圣天使是否在[ROOT.Char.GetFaith.HighGodName]之下按等级排列，每个品阶上下有秩。[ROOT.Char.GetFaith.GetAdjective]教会的圣职应当反映天上的秩序吗？”"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "“我们被问及，信徒是否应作基督的精兵。被召唤时，我们必须要拿起刀剑，保卫[ROOT.Char.GetFaith.GetAdjective]教会吗？”"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "“我们被问及，信仰是否可以借助理性寻求理解。学校应当运用辩证法和哲学来整饬和捍卫教义吗？”"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "“我们被问及，基督按其人性，是否由收养而成为[ROOT.Char.GetFaith.HighGodName]之子。”"
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "“我们被问及，爱你的近人，即便是陌生人和仇敌，是否必须约束每个[ROOT.Char.GetFaith.GetAdherentName]，成为爱敬[ROOT.Char.GetFaith.HighGodName]的确定尺度。”"
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "“我们被问及，[ROOT.Char.Custom('GetReligiousRite')]，连同圣歌、献香和有序的仪式，是否是信徒亲近[ROOT.Char.GetFaith.HighGodName]的主要途径。”"
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "“我们被问及，在基督之中，神性和人性是否是同一道成肉身的性体，不可分割，也不可混淆。”"
 ecumenical_council_events.0010.desc.hesychasm.explanation: "“我们被问及，无休止地重复神圣的静默和内心单纯的祈祷，能否使灵魂得以直观[ROOT.Char.GetFaith.HighGodNamePossessive|U]非受造之光？”"
 ecumenical_council_events.0010.desc.anachoresis.explanation: "“我们被问及，隐遁出世是否神圣。隐修士离群索居是通往[ROOT.Char.GetFaith.HighGodName]的真道吗？”"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "“我们被问及，当身体遭受大斋、刚毛衬衣和鞭笞的约束时，精神是否因此得以充实。”"
 ecumenical_council_events.0010.desc.holy_myron.explanation: "“我们被问及，[Glossary( '圣油', 'CHRISM_GLOSS' )]是否应该以圣神的恩赐来为洗礼和加冕留下印记。”"
 CHRISM_GLOSS: "希腊语意为“傅油”。#bold 圣油#!是由主教祝圣的是一种芬芳油，用于在洗礼和坚振礼中为信徒傅油，有时也用于王室加冕礼。"
 ecumenical_council_events.0010.desc.khachkar.explanation: "“我们被问及，雕刻的石制十字架可否耸立在我们中间，作为信仰长存的公开见证，标记了圣地与亡者。”"
 ecumenical_council_events.0010.desc.philanthropia.explanation: "“我们被问及，照顾穷人是否是[ROOT.Char.GetFaith.GetAdjective]教会一项有约束力的义务。我们必须筹集施舍，兴建医院和仁济之家吗？”"
 ecumenical_council_events.0010.desc.aniconism.explanation: "“我们被问及，是否每一幅圣像都必须从我们的教堂中被清除。对它们的敬拜，是对世俗形象的偶像崇拜，将我们的目光和心思从[ROOT.Char.GetFaith.HighGodName]那里引开吗？”"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "“我们被问及，《圣经》是否必须按隐藏的属灵意义来解读。用希腊的学问和寓意解经可以揭开文字本身所掩藏的真意吗？”"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "“我们被问及，背起十字架，以神圣的目的行进，这本身是否是对基督的敬礼。刀剑可以护卫朝圣之路，并从不信者手中夺回失地吗？”"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "“我们被问及，肉体的享乐是否使灵魂更接近神性。欲望应当被尊崇和追求，而非当作罪过加以回避吗？”"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "“我们被问及，信仰与民族意识是否在[ROOT.Char.GetFaith.HighGodName]之下合而为一。外人必须留在真信众之外吗？”"
 ecumenical_council_events.0010.desc.communion.explanation: "“我们被问及，共同的圣礼是否召唤来[ROOT.Char.GetFaith.HighGodName]临在。那些不与我们同守圣礼的人，必须被算在真信众之外吗？”"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "“我们被问及，临终前，最终的属灵净化能否洗去一切罪过；净化之后，是否必须拒绝食物和生命，以免罪恶重返。”"
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "“我们被问及，婚姻是否必须保持在神圣的血脉之内，甚至在[ROOT.Char.GetFaith.GetAdjective]教会禁绝的近亲之间。”"
 ecumenical_council_events.0010.desc.gnosticism.explanation: "“我们被问及，救恩是否存在于隐秘的知识中，仅向入门者默示，从而释放神火，使其回归本源。”"
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "“我们被问及，会士是否应当一无所有。他们应当辗转于城镇间，靠施舍为生，宣讲[ROOT.Char.GetFaith.HighGodName]的圣言吗？”"
 ecumenical_council_events.0010.desc.pacifism.explanation: "“我们被问及，在[ROOT.Char.GetFaith.GetAdherentName]的生活中，刀剑是否毫无地位。正义战争的观念是错误的吗？”"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "“我们被问及，[ROOT.Char.GetFaith.GetAdjective]教会是否应由五大宗主教教区以集体共治的方式管理。这否定了[ROOT.Char.GetFaith.HighGodNamePossessive]首席代祷者的首席权吗？”"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "“我们被问及，在迫害、艰难或疑惑之下，信仰是否必须被毫不退让地坚守。无论付出何种代价，我们都一定要坚定不移吗？”"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "“我们被问及，我们是否最好像宗徒一样发下神贫誓愿，来服侍[ROOT.Char.GetFaith.HighGodName]。”"
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "“我们被问及，信众是否必须不受干扰，以保留他们自己的路。[ROOT.Char.GetFaith.GetAdjective]教会应该既不干涉外人，也不容外人干涉吗？”"
 ecumenical_council_events.0010.desc.adaptive.explanation: "“我们被问及，要求普世遵从我们的习俗和限制，是否损害信众。只要我们信仰的核心不变，我们的律法可以适应它必须存在的这个世界吗？”"
 ecumenical_council_events.0010.desc.esotericism.explanation: "“我们被问及，[ROOT.Char.GetFaith.HighGodName]的奥迹是否迫使我们去寻求周遭世界的知识。”"
 ecumenical_council_events.0010.desc.legalism.explanation: "“我们被问及，神圣的律法是否必须约束[ROOT.Char.GetFaith.GetAdjective]生活的每一个行为。任何罪人，无论有多么高贵显赫、专横跋扈，都不能凌驾于我们的律法之上吗？”"
 ecumenical_council_events.0010.desc.literalism.explanation: "“我们被问及，圣经作为[ROOT.Char.GetFaith.HighGodNamePossessive]智慧唯一的宝库，是否不可更改、完整无缺。”"
 ecumenical_council_events.0010.desc.reincarnation.explanation: "“我们被问及，灵魂是否经历多次轮回，而非仅仅面临一次[ROOT.Char.GetFaith.HighGodNamePossessive]的审判。”"
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "“我们被问及，[ROOT.Char.GetFaith.GetAdjective]教会圣师可否就每一个信仰和律法的新问题，作出有约束力的裁决。”"
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "“我们被问及，[ROOT.Char.GetFaith.GetAdjective]生活是否必须围绕争斗和顺服来塑造。信徒必须要完全顺服于[ROOT.Char.GetFaith.HighGodNamePossessive|U]的旨意吗？”"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "“我们被问及，在迫害下，[ROOT.Char.GetFaith.GetAdherentName]可否假意信奉另一种信仰。”"
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "“我们被问及，不信者是否可以通过缴纳保护税的方式，继续留在[ROOT.Char.GetFaith.GetAdjective]治下？”"
 ecumenical_council_events.0010.desc.asceticism.explanation: "“我们被问及，祈求[ROOT.Char.GetFaith.HighGodName]是否要通过饥饿、匮乏和拒绝舒适来实现。”"
 ecumenical_council_events.0010.desc.bhakti.explanation: "“我们被问及，每个灵魂是否都应当以爱慕的敬奉，将自身系于神明的某一相位？”"
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "“我们被问及，是否对活物禁止造成一切伤害。甚至对低等的走兽和昆虫，我们也应当避免伤害吗？”"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "“我们被问及，祈求[ROOT.Char.GetFaith.HighGodName]是否主要通过默观和认识自我来实现。”"
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "“我们被问及，我们是否有在餐桌前接待任何陌生人的神圣义务。”"
 ecumenical_council_events.0010.desc.adorcism.explanation: "“我们被问及，这世上的灵体是否应当被尊崇和欢迎，使得它们帮助我们，而不被当作不洁的力量驱逐出去。”"
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "“我们被问及，我们的祖先是否应当以祈祷和供奉来尊崇，好让他们照拂、引导我们。”"
 ecumenical_council_events.0010.desc.astrology.explanation: "“我们被问及，[ROOT.Char.GetFaith.HighGodNamePossessive]的旨意是否可以在星辰中解读。上天隐藏着我们命运的秘密吗？”"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "“我们被问及，欢愉是否是一种礼物，作为敬拜的一种形式来寻求。”"
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "“我们被问及，人的生命是否可以在祭台上献出。为[ROOT.Char.GetFaith.HighGodName]流的血可以作为神圣的礼物吗？”"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "“我们被问及，某些灵魂是否从出生起就被标记为拥有神圣权力和属灵领导地位，在[ROOT.Char.GetFaith.GetAdjective]教会任何傅油前就已蒙拣选。”"
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "“我们被问及，[ROOT.Char.GetFaith.GetAdjective]的历书是否应当满是神圣的庆节，以将信徒联结在一起。”"
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "“我们被问及，分娩是否必须用神圣的礼仪来准备。产房必须被洁净，好让[ROOT.Char.GetFaith.HighGodName]祝福母子吗？”"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "“我们被问及，森林、奔流的河水和被露水亲吻过的山谷是否神圣。我们应当在旷野中寻求[ROOT.Char.GetFaith.HighGodName]吗？”"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "“我们被问及，是否应该向太阳祈祷。这赐予生命的光明就是我们的[ROOT.Char.GetFaith.HighGodName]吗？”"
 ecumenical_council_events.0010.desc.warmonger.explanation: "“我们被问及，战争和征服本身是否是一种神圣礼仪。刀剑是传播[ROOT.Char.GetFaith.HighGodName]圣言最可靠的手段吗？”"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "“我们被问及，是否可以用血腥残酷的场面来纪念圣日。这样的狂欢在[ROOT.Char.GetFaith.HighGodName]面前算是真正的崇敬吗？”"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "“我们被问及，高处和大地的根基是否神圣。我们应当在山巅沿着隐秘的石径寻求[ROOT.Char.GetFaith.HighGodName]吗？”"
 ecumenical_council_events.0010.desc.household_gods.explanation: "“我们被问及，炉灶和家宅的神祇是否可以在[ROOT.Char.GetFaith.GetAdjective]的家庭中保留和尊崇。”"
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "“我们被问及，远东的礼仪和典章是否可以融入我们的信仰。”"
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "“我们被问及，是否可以从东方的信仰中学习——它们彼此相邻而居，却不互称对方邪恶——即使我们并不信奉他们东方的神明。”"
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "“我们被问及，新皈依者旧有的民俗是否可以完整保留：悄然借鉴，而非加以摒弃和谴责。”"
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "“我们被问及，那些基督之外的人，是否仍然可以尊崇祂的训诲和榜样，而不必承认祂是真天主。”"
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "“我们被问及，萨拉森人的律法是否可以引入[ROOT.Char.GetFaith.GetAdjective]教会，将他们的教义与福音相融合。”"
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "“我们被问及，犹太人的律法和学问是否应当被接纳进入[ROOT.Char.GetFaith.GetAdjective]教会，即使我们并不认同他们所有的主张。”"
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "“我们被问及，痛苦本身是否神圣。给予痛苦是一种祝福，而接受痛苦则是从[ROOT.Char.GetFaith.HighGodName|U]而来的恩典吗？”"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "“我们被问及，圣德是否在于弃绝城市，拥抱旷野中的生活，重新回归最初的存在状态。”"
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "“我们被问及，对现实世界的统治权是否是一种神圣的目的。攫取权力就能履行[ROOT.Char.GetFaith.HighGodNamePossessive]的旨意吗？”"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "“我们被问及，死者的血肉是否可以作为一种圣礼来食用。”"
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "“我们被问及，欺骗是否可以是神圣的。当真理会危害信仰时，信徒可以撒谎，甚至相信自己所说的谎言吗？”"
 ecumenical_council_events.0010.desc.polyamory.explanation: "“我们被问及，信徒是否可以与多人分享爱，并抛弃‘一个灵魂要对另一个人的情感负责’的主张。”"
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "“我们被问及，人的生命是否可以在神圣仪式中献上。自愿者可以将自己献上，有罪者可以被献于[ROOT.Char.GetFaith.GetAdjective]的祭台上吗？”"
 ecumenical_council_events.0010.desc.megaliths.explanation: "“我们被问及，是否必须为了[ROOT.Char.GetFaith.HighGodNamePossessive]的荣耀树立起宏伟的石碑。”"
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "“我们被问及，信徒是否必须共同持有所有财产。”"
 ecumenical_council_events.0010.desc.pure_land.explanation: "“我们被问及，超越苦难的真福之境是否仅靠信赖和敬礼即能达到，而非靠财富、学问或对仪式的精通。”"
 ecumenical_council_events.0010.desc.no_mind.explanation: "“我们被问及，是否通过心灵的空虚和自我的静默来寻求[ROOT.Char.GetFaith.HighGodName]。”"
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "“我们被问及，高处是否确实高而神圣。最好在山顶上寻求[ROOT.Char.GetFaith.HighGodName]吗？”"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "“我们被问及，这个时代是否日渐黑暗，恶魔披着虔诚的伪装行世。当神圣律法衰败时，我们必须击杀这样的仇敌来捍卫它吗？”"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "“我们被问及，被杀者的首级是否应该被当作神圣的战利品。”"
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "“我们被问及，追求知识是否是一种神圣的职责。”"
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "“我们被问及，公正的统治是否是[ROOT.Char.GetFaith.GetAdjective]君王必须遵守的一种神圣职责。”"
 ecumenical_council_events.0010.desc.filial_piety.explanation: "“我们被问及，尊崇父母和长辈是否是[ROOT.Char.GetFaith.HighGodName]的命令。”"
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "“我们被问及，社会和谐、各安其位，是否是[ROOT.Char.GetFaith.GetAdjective]秩序的核心。”"
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "“我们被问及，毁灭本身是否可以是神圣的。拆毁旧物是[ROOT.Char.GetFaith.HighGodName]对我们的要求吗？”"
 ecumenical_council_events.0010.desc.preservation.explanation: "“我们被问及，圣德是否在于建立和保存所建之物。[ROOT.Char.GetFaith.GetAdjective]的圣殿和工程必须被照管，使它们可以永远繁盛吗？”"
 ecumenical_council_events.0010.desc.takamin.explanation: "“我们被问及，强壮的熊是否是神性的容器。狩猎必须将那头巨兽敬为神圣，在杀它时必须怀着神圣的敬意吗？”"
 ecumenical_council_events.0010.a_1: "它将替换[current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]。"
 ecumenical_council_events.0010.a_2: "我会移除[current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]以作替换。"
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]必须被移除。"
 ecumenical_council_events.0010.b: "禁止这种行为！"
 ecumenical_council_events.0010.c: "目前，我会允许实践它。"
 ecumenical_council_events.0010.d: "至少，让我们承认这一信条。"
 ecumenical_council_events.0011.t: "$ecumenical_council_events.0010.t$"
 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$"
 ecumenical_council_events.0011.desc.outro: "我们的东道主[host.GetTitledFirstName]宣布：\n\n“我提议将[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
 ecumenical_council_events.0011.desc.permit: "允许。”"
 ecumenical_council_events.0011.desc.prohibit: "禁止。”"
 ecumenical_council_events.0011.desc.learn: "纳入已知。”"
 ecumenical_council_events.0011.desc.make_core: "纳入核心，替换[core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]。”"
 ecumenical_council_events.0011.a: "我投票支持变革。"
 ecumenical_council_events.0011.b: "我不同意。"
