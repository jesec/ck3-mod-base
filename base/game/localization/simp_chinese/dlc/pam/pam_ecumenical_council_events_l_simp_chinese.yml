 ecumenical_council_events.0103.oppose: "提供赞助。"
 ecumenical_council_events.0103.oppose_duel: "警告革新会让[lead_innovator.GetHerHis]们贫穷。"
 ecumenical_council_events.0103.oppose_duel.success: "他们开始畏惧这种亵渎"
