 ecumenical_council_events.0114.t: "以信仰与钢铁为武装"
 ecumenical_council_events.0114.desc.intro: "正如久经战事之人的常态，我们当中的老战士们正聚在一起消磨时间。\n\n“[lead_innovator.GetFaith.HighGodName]啊，要是这些变革能达成一致就好了。信徒就能再次站到同一面旗帜下！”[lead_innovator.GetTitledFirstName]说道。\n\n"
 ecumenical_council_events.0114.desc.conservative: "“我们砍倒过很多的[ec_hostile_faith.GetAdherentName]，”[lead_conservative.GetTitledFirstName]说。“[lead_conservative.GetFaith.WarGodName]不正眷顾着我们的旗帜吗？”"
 ecumenical_council_events.0114.desc.conservative_generic: "“我们砍倒过很多的敌人”[lead_conservative.GetTitledFirstName]说。“[lead_conservative.GetFaith.WarGodName]不正眷顾着我们的旗帜吗？”"
 ecumenical_council_events.0114.support: "让我们升起一面崭新而神圣的旗帜。"
 ecumenical_council_events.0114.support_duel: "将畏惧者召集至[ROOT.Char.GetFaith.HighGodNamePossessive]的祝福旗帜之下！"
 ecumenical_council_events.0114.support_duel.success: "士兵必须服从"
 ecumenical_council_events.0114.support_duel.success_halved: "部分人受到招募"
 ecumenical_council_events.0114.support_duel.failure: "他们顽固地坚守己见"
 ecumenical_council_events.0114.oppose: "支持[lead_conservative.GetTitledFirstNameNoTooltip]，正统的捍卫者。"
 ecumenical_council_events.0114.oppose_duel: "好一场唇枪舌剑！"
 ecumenical_council_events.0114.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0114.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0114.oppose_duel.failure: "他们将徒劳地冲锋"
 ecumenical_council_events.0114.conservatives_custom: "好战的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0114.conservatives_custom_halved: "好战的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0114.innovators_custom: "好战的[ec_innovators|E]（#V [feature_innovators_size]#!）"
