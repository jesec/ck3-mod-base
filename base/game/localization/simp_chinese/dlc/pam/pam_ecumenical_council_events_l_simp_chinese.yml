 ecumenical_council_events.0108.t: "朋友之间"
 ecumenical_council_events.0108.desc: "在会上看到我的[ROOT.Char.Custom2('RelationToMe', friend)][friend.GetTitledFirstName]真是令人舒心。\n\n“你当然知道我的立场，”[friend.GetSheHe]说，“只要你给一句话，我就跟随。”"
 ecumenical_council_events.0108.a: "与我同在，[friend.GetFirstNameNoTooltip]。"
 ecumenical_council_events.0108.b: "你可以坚持自己的信念。"
 ecumenical_council_events.0108.conservatives_custom: "你的[friends|E]中的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0108.innovators_custom: "你的[friends|E]中的[ec_innovators|E]（#V [feature_innovators_size]#!）"
 ecumenical_council_events.0109.t: "暗流涌动的不满"
 ecumenical_council_events.0109.desc: "在会场之外，似乎有一小群人在暗中策划。谁想在没有我的情况下重塑信仰？\n\n“如果这件事都能被质疑，那其他的为什么不行？”[lead_conservative.GetTitledFirstName]警告说。“我不会打开那扇门，把不确定性招进[lead_conservative.GetFaith.HighGodName]的殿堂。”\n\n“你难道不想丢掉那些不再对我们有用的传统吗？”[lead_innovator.GetTitledFirstName]回答。"
 ecumenical_council_events.0109.support: "有人愿意倾听就足够了。"
 ecumenical_council_events.0109.support_duel: "我知道怎么让谨慎的人愿意倾听……"
 ecumenical_council_events.0109.support_duel.success: "他们不会阻挡道路"
 ecumenical_council_events.0109.support_duel.success_halved: "部分人听从你"
 ecumenical_council_events.0109.support_duel.failure: "他们联合起来排挤你"
 ecumenical_council_events.0109.oppose: "轻轻关上那扇门。"
 ecumenical_council_events.0109.oppose_duel: "“[lead_innovator.GetFirstNameNoTooltip]，你总热衷制造动乱吗？”"
 ecumenical_council_events.0109.oppose_duel.success: "他们不会冒动乱的风险"
 ecumenical_council_events.0109.oppose_duel.success_halved: "部分人撤回了支持"
 ecumenical_council_events.0109.oppose_duel.failure: "他们仍渴望纷争与毁灭"
