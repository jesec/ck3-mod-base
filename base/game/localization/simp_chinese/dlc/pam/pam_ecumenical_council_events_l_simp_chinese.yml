 ecumenical_council_events.0115.t: "耳语与手段"
 ecumenical_council_events.0115.desc: "尽管承认这一点让我感到痛苦，但并非所有神职人员都配得上他们的法衣。即使在这个庄严的团体中，我也必须敏锐地留意那些偏爱阴影而非经文纯净光芒的人。用不了多久，就能在黑暗中撞见低语。\n\n“这里的每个灵魂都渴望……某种东西。我们必须思量，聪明的人，谁会付出渴望的代价，”[lead_conservative.GetTitledFirstName]向那些愿意倾听的耳朵低语道。“大胆的思想，激进的改革……没有什么比这代价更昂贵……”\n\n另一条毒蛇，[lead_innovator.GetTitledFirstName]，起身反驳[lead_conservative.GetHerHim]：“你以为将来为混乱付出代价的人是#EMP 你#!吗？在即将到来的动荡时代，当我们可以随心所欲的时候……？”"
 ecumenical_council_events.0115.support: "混乱也有其用处。"
 ecumenical_council_events.0115.support_duel: "机遇只留给善于倾听的人。"
 ecumenical_council_events.0115.support_duel.success: "他们的贪婪驱使他们向你靠近"
 ecumenical_council_events.0115.support_duel.success_halved: "部分人选择追求混乱"
 ecumenical_council_events.0115.support_duel.failure: "他们对机遇视而不见"
 ecumenical_council_events.0115.oppose: "一顿小餐之后，我们[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]便永远饥饿。"
 ecumenical_council_events.0115.oppose_duel: "在经文中寻求真理，否则你将迷失。"
 ecumenical_council_events.0115.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0115.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0115.oppose_duel.failure: "他们迷失于黑暗的欲望之中"
 ecumenical_council_events.0115.conservatives_custom: "高[intrigue|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0115.conservatives_custom_halved: "高[intrigue|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
