 ecumenical_council_events.0112.t: "领地内的疾病"
 ecumenical_council_events.0112.desc: "“我的领地上尸横遍野！起初，我还在疑惑为何会受到[lead_conservative.GetFaith.HighGodNamePossessive]的惩罚，但现在——一切都太清楚了！人类在受苦，因为我们的世界在排斥这种对教会法的扭曲。”[lead_conservative.GetTitledFirstName]说。\n\n“你对这次会议的仇恨已经让你蒙蔽到看不见自己的救赎了吗？”[lead_innovator.GetTitledFirstName]反驳道。“我们的改革会平息[lead_innovator.GetFaith.HighGodName]的怒火！”"
 ecumenical_council_events.0112.support: "是的，[ROOT.Char.GetFaith.HighGodName|U]要求教会变革。"
 ecumenical_council_events.0112.support_duel: "或许可以用顽固派自己的逻辑反过来对付[lead_conservative.GetHerHim]！"
 ecumenical_council_events.0112.support_duel.success: "许多人视之为神罚的终结"
 ecumenical_council_events.0112.support_duel.success_halved: "部分人会试图安抚[lead_innovator.GetFaith.HighGodName]"
 ecumenical_council_events.0112.support_duel.failure: "破坏教会法的风险太严重了"
 ecumenical_council_events.0112.oppose: "或者进一步激怒[ROOT.Char.GetFaith.HighGodName]！"
 ecumenical_council_events.0112.oppose_duel: "警告这会破坏教会法。"
 ecumenical_council_events.0112.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派屈服"
 ecumenical_council_events.0112.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip]一派有部分人屈服"
 ecumenical_council_events.0112.oppose_duel.failure: "他们仍对变革抱有希望"
 ecumenical_council_events.0112.conservatives_custom: "面临[epidemic|E]的[ec_conservatives|E]（#V [feature_conservatives_size]#!）"
 ecumenical_council_events.0112.conservatives_custom_halved: "面临[epidemic|E]的[ec_conservatives|E]（#V [feature_conservatives_size_halved]#!）"
 ecumenical_council_events.0112.innovators_custom: "面临[epidemic|E]的[ec_innovators|E]（#V [feature_innovators_size]#!）"
