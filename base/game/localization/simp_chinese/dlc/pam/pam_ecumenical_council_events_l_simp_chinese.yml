 ecumenical_council_events.0102.t: "相互竞争的祈祷"
 ecumenical_council_events.0102.desc: "与会的虔信者已分成两派，围绕提案提出各自的诉求。\n\n[lead_innovator.GetTitledFirstName]呼求[lead_innovator.GetFaith.HighGodName]确认他们所受的启示乃是[lead_innovator.GetFaith.HighGodHerHis|U]旨意的映照。[lead_conservative.GetTitledFirstNamePossessive]一派随即回应，祈求[lead_innovator.GetFaith.random_GoodGodNames]维护长久以来为教会服务的传统。"
 ecumenical_council_events.0102.support: "加入变革的祈祷。"
 ecumenical_council_events.0102.support_duel: "宣扬变革，直到他们一派屈服。"
 ecumenical_council_events.0102.support_duel.success: "您的布道打动了持异议的教士"
 ecumenical_council_events.0102.support_duel.success_halved: "您的布道打动了部分持异议的教士"
 ecumenical_council_events.0102.support_duel.failure: "他们继续祈祷着；你的布道毫无效果"
 ecumenical_council_events.0102.oppose: "加入对古老法律的祈祷。"
 ecumenical_council_events.0102.oppose_duel: "宣扬旧法律，直到他们一派屈服。"
 ecumenical_council_events.0102.oppose_duel.success: "你的布道动摇了寻求改革的教士"
