 ecumenical_council_events.0103.t: "变革的代价"
 ecumenical_council_events.0103.desc: "“你的固执将毁了我们！”[lead_innovator.GetTitledFirstName]喊道。\n\n“[lead_conservative.GetPrimaryTitle.GetNameNoTooltip]的信众会感谢那位重修他们[lead_conservative.Custom('GetFaithTemple')]的赞助者。”[lead_conservative.GetTitledFirstName]说道。"
 ecumenical_council_events.0103.support: "提供赞助。"
 ecumenical_council_events.0103.support_duel: "详述[lead_conservative.GetHerHis]们能如何致富。"
 ecumenical_council_events.0103.support_duel.success: "他们看到了革新的价值"
 ecumenical_council_events.0103.support_duel.success_halved: "部分人接受了革新的价值"
