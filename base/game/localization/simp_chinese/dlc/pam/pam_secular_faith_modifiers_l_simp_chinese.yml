l_simp_chinese:
 pam_sf_devotion_modifier: "向繁荣奉献"
 pam_sf_devotion_modifier_desc: "该角色私下进行了奉献，获得了虔诚与金钱的回报。"
 pam_sf_grace_modifier: "蒙受恩典"
 pam_sf_grace_modifier_desc: "该角色得到了一份恩典，一句感恩，或是一个能提振精神的静默誓言。"
 pam_sf_consolation_modifier: "和平"
 pam_sf_consolation_modifier_desc: "该角色处于和平状态。"
 pam_sf_visionary_renown_modifier: "宣示启示"
 pam_sf_visionary_renown_modifier_desc: "该角色向宫廷宣告了一次神启异象，提升了自己的声望。"
 pam_sf_consecrated_arms_modifier: "祝圣纹章"
 pam_sf_consecrated_arms_modifier_desc: "该角色的家族纹章已在神圣的节日里获得祝福。"
 pam_sf_serenity_modifier: "颂扬公共仪式"
 pam_sf_serenity_modifier_desc: "该角色公开的虔诚行为使其赢得了神职人员和廷臣的好感。"
 pam_sf_humiliated_modifier: "屈辱誓言"
 pam_sf_humiliated_modifier_desc: "该角色被迫立下神圣誓言，并被幽禁于修道院中。"
 pam_sf_promised_acclaim_modifier: "朝圣者的誓言"
 pam_sf_promised_acclaim_modifier_desc: "该角色的领地司祭已承诺，将在其下一次完成朝圣后向首府的民众宣告。\n\n完成一次朝圣后，其[capital|E]将获得[GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]，持续#V 15#!年。"
 pam_sf_extolled_pilgrimage_county_modifier: "朝圣者的欢迎"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "统治者朝圣的消息传遍整个伯爵领，民众因此感到自豪，精神振奋。"
 pam_sf_free_feast_discount_desc: "盛宴在即"
 pam_sf_free_feast_modifier: "渴望盛宴"
 pam_sf_free_feast_modifier_desc: "神圣的纵欲让该角色胃口大开：\n$EFFECT_LIST_BULLET$下一次[GetActivityType( 'activity_feast').GetName]花费：[gold_i]#P -100%#!\n#weak 在宴会开始时消耗。#!"
 pam_sf_pilgrimage_funded_modifier: "赞助朝圣"
 pam_sf_pilgrimage_funded_modifier_desc: "一位赞助人已承诺支付这个角色下一次朝圣的部分费用：\n$EFFECT_LIST_BULLET$[GetActivityType( 'activity_pilgrimage').GetName]花费：[gold_i]#P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "赞助朝圣"
 pam_sf_ear_of_clergy_modifier: "教会的耳朵"
 pam_sf_ear_of_clergy_modifier_desc: "教会更有可能接受该角色的请求：\n$EFFECT_LIST_BULLET$#V $hof_ask_for_claim_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $hof_ask_for_gold_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $request_excommunication_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $request_legitimacy_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $ecclesiastic_grant_claim_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $strengthen_claim_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $request_enforce_succession_interaction$#!接受度：#P +25#!\n$EFFECT_LIST_BULLET$#V $request_white_peace_interaction$#!接受度：#P +25#!"
 pam_religious_delirium_modifier: "宗教谵妄"
 pam_religious_delirium_modifier_desc: "该角色相信天国对其讲话：\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E]获得：#P +50%#!\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E]损失：#N +50%#!"
 pam_sf_church_builder_modifier: "教堂建造者"
 pam_sf_church_builder_modifier_desc: "建起了第一座宗教建筑后，该角色建造教堂的花费略有降低，并获得稳定的虔诚来源。"
 pam_sf_scriptorium_county_modifier: "文书工作"
 pam_sf_scriptorium_county_modifier_desc: "定居的学者抄录并保管此领地的账目。"
 pam_sf_doctrine_clarity_modifier: "顿悟"
 pam_sf_doctrine_clarity_modifier_desc: "该角色经历了一次罕见的清醒时刻，一次顿悟。"
 pam_sf_favorable_omen_modifier: "吉兆"
 pam_sf_favorable_omen_modifier_desc: "该角色将天象解读为神恩的征兆，信徒们因这份祝福而振奋。"
 pam_sf_omen_of_victory_modifier: "胜利之兆"
 pam_sf_omen_of_victory_modifier_desc: "该角色确信上天已许诺胜利，其军队无所畏惧地行进。"
 pam_sf_demon_torment_modifier: "恶魔折磨"
 pam_sf_demon_torment_modifier_desc: "该角色确信自己被恶魔缠上了，需要修建一座[GetBuilding('temple_01').GetName][holding|E]，或是举行一次[GetActivityType('activity_pilgrimage').GetName]。"
 pam_sf_besieged_by_demons_modifier: "被恶魔纠缠"
 pam_sf_besieged_by_demons_modifier_desc: "该角色的心智正遭到恶魔纠缠，日渐癫狂、抽搐，一天比一天更丧失理智。"
 pam_sf_grief_solace_modifier: "受灵魂慰藉"
 pam_sf_grief_solace_modifier_desc: "该角色据称被一个鬼魂造访后，找到了安静的慰藉。"
 pam_sf_grief_warning_modifier: "被灵魂警告"
 pam_sf_grief_warning_modifier_desc: "该角色相信自己曾被鬼魂警告过。"
 pam_sf_peace_of_god_modifier: "神的和平"
 pam_sf_peace_of_god_modifier_desc: "该角色已在整个领地宣誓并执行神的和平。"
 pam_sf_immured_anchorite_modifier: "隐世修士"
 pam_sf_immured_anchorite_modifier_desc: "这座神殿的墙内禁闭着一位隐士。"
 pam_sf_voice_of_jesus_modifier: "神之声"
 pam_sf_voice_of_jesus_modifier_desc: "该角色受到神的声音召唤，起身时变了模样，各项感官都变得敏锐，仿佛被神的手触碰过。"
 pam_sf_stroke_of_god_modifier: "神罚"
 pam_sf_stroke_of_god_modifier_desc: "该角色突然中风倒下，医生称其遭了“神罚”，血液涌上大脑，留下事后瘫痪的身体和心智。"
 pam_sf_lingering_stench_modifier: "挥之不去的恶臭"
 pam_sf_lingering_stench_modifier_desc: "无论该角色如何努力，都忘不掉为穷人洗脚时闻到的气味。"
 pam_sf_site_of_miracle_county_modifier: "神迹之地"
 pam_sf_site_of_miracle_county_modifier_desc: "该伯爵领发生了神迹，吸引着朝圣者和盗匪。"
 pam_sf_consecrated_county_modifier: "新近祝圣"
 pam_sf_consecrated_county_modifier_desc: "该伯爵领新近祝圣了一座教堂。"
 pam_sf_flagellant_cults_county_modifier: "自鞭笞教派"
 pam_sf_flagellant_cults_county_modifier_desc: "忏悔者成群结队，在该伯爵领的街道上鞭笞着自己。"
 pam_sf_relic_procession_county_modifier: "圣物前行"
 pam_sf_relic_procession_county_modifier_desc: "一件圣人的遗物曾在该伯爵领中庄严游行，人们因此走得稍微挺直了些。"
 pam_sf_blessed_bell_county_modifier: "受洗之钟"
 pam_sf_blessed_bell_county_modifier_desc: "该伯爵领的教堂钟已受施洗、傅油并命名。民众相信其钟声能驱散风暴与邪魔。"
 pam_sf_church_ale_county_modifier: "教堂麦酒"
 pam_sf_church_ale_county_modifier_desc: "该伯爵领的统治者和教区居民一同喝了教堂酿的麦酒，教区的人至今仍对此津津乐道。"
 pam_sf_safe_passage_modifier: "安全通行"
 pam_sf_safe_passage_modifier_desc: "这名旅人在途中获救后，得到了护送和安全通行的许可。"
 pam_sf_waylaid_road_modifier: "途中遇袭"
 pam_sf_waylaid_road_modifier_desc: "这名旅人的行程在途中遇袭后，旅程变得危险重重。"
 pam_sf_penance_lustful_modifier: "克制欲望"
 pam_sf_penance_lustful_modifier_desc: "该角色正为纵欲进行赎罪，克制欲望的代价是子嗣减少。"
 pam_sf_penance_chaste_modifier: "摆脱束缚"
 pam_sf_penance_chaste_modifier_desc: "该角色正违背自身本性，抛弃其信仰视为罪恶的贞洁。"
 pam_sf_penance_gluttonous_modifier: "斋戒日"
 pam_sf_penance_gluttonous_modifier_desc: "该角色正为暴食而斋戒忏悔，用肉体的苦来喂养灵魂。"
 pam_sf_penance_temperate_modifier: "打破长期斋戒"
 pam_sf_penance_temperate_modifier_desc: "该角色正在抛弃其信仰视为罪恶的节制，心胸更宽松了，钱袋也是。"
 pam_sf_penance_greedy_modifier: "忏悔施舍"
 pam_sf_penance_greedy_modifier_desc: "该角色正为贪婪而施舍忏悔，钱箱轻了，良心也轻了。"
 pam_sf_penance_generous_modifier: "收紧钱袋"
 pam_sf_penance_generous_modifier_desc: "该角色正在克制其信仰视为罪恶的慷慨，更富有了，但也更遭人怨恨。"
 pam_sf_penance_lazy_modifier: "悔过劳作"
 pam_sf_penance_lazy_modifier_desc: "该角色正投身于累人的劳作，为自己的懒惰之罪进行忏悔。"
 pam_sf_penance_diligent_modifier: "强制休息"
 pam_sf_penance_diligent_modifier_desc: "该角色正在放下其信仰视为罪恶的勤奋，心态更平静，但效率也更低了。"
 pam_sf_penance_wrathful_modifier: "克制怒火"
 pam_sf_penance_wrathful_modifier_desc: "该角色正为暴怒而忏悔，尝试克制自己的行为，手更温和了，刀刃也更钝了。"
 pam_sf_penance_calm_modifier: "振奋精神"
 pam_sf_penance_calm_modifier_desc: "该角色正放下其信仰视为罪恶的冷静，投身到狂热，行事更激进，也更难放松下来。"
 pam_sf_penance_patient_modifier: "强行提速"
 pam_sf_penance_patient_modifier_desc: "该角色正抛弃其信仰视为罪恶的耐心，因此仓促而不安。"
 pam_sf_penance_impatient_modifier: "培养耐心"
 pam_sf_penance_impatient_modifier_desc: "该角色正在为急躁的脾气而修习忍耐作为忏悔，而等待的过程令人煎熬。"
 pam_sf_penance_arrogant_modifier: "践行谦卑"
 pam_sf_penance_arrogant_modifier_desc: "该角色正用谦卑忏悔来弥补傲慢的举止，名声也随之消退。"
 pam_sf_penance_humble_modifier: "傲慢姿态"
 pam_sf_penance_humble_modifier_desc: "该角色正按照信仰的要求，放下谦卑、展现出傲慢，获得了名声却也被视为虚荣。"
 pam_sf_penance_deceitful_modifier: "坦诚之誓"
 pam_sf_penance_deceitful_modifier_desc: "该角色正坚守诚实的誓言，为自己的欺骗忏悔，狡诈也随之被磨去。"
 pam_sf_penance_honest_modifier: "学习掩饰"
 pam_sf_penance_honest_modifier_desc: "该角色正学习其信仰推崇的狡诈手段，以取代诚实，人变得更精明，却也不再那么受人信任。"
 pam_sf_penance_craven_modifier: "直面恐惧"
 pam_sf_penance_craven_modifier_desc: "该角色正因懦弱而做忏悔，强迫自己不退缩，但每一刻都怕得要命。"
 pam_sf_penance_brave_modifier: "磨钝勇气"
 pam_sf_penance_brave_modifier_desc: "该角色正在克制其信仰视为罪恶的勇气，尝试更加谨慎，战士的锋芒被磨钝了。"
 pam_sf_penance_shy_modifier: "强迫勇敢"
 pam_sf_penance_shy_modifier_desc: "该角色正强装得勇敢，为自己孤僻的性格忏悔，但每一次聚会都感到难熬。"
 pam_sf_penance_gregarious_modifier: "退入沉默"
 pam_sf_penance_gregarious_modifier_desc: "该角色正从罪恶的狂欢中抽身，退入沉默，朋友也因此少了。"
 pam_sf_penance_ambitious_modifier: "遏制野心"
 pam_sf_penance_ambitious_modifier_desc: "该角色正怀着悔意垂下野心的目光，随之而去的还有声望。"
 pam_sf_penance_content_modifier: "点燃追求"
 pam_sf_penance_content_modifier_desc: "该角色正在唤起追求，以对抗其信仰视为罪恶的安于现状，变得焦躁不安并竭力进取。"
 pam_sf_penance_arbitrary_modifier: "公正统治"
 pam_sf_penance_arbitrary_modifier_desc: "该角色正以公正进行统治，对以往的专断进行忏悔，更加公平，但也更加贫穷。"
 pam_sf_penance_just_modifier: "随心统治"
 pam_sf_penance_just_modifier_desc: "该角色根据信仰的要求任性行事，而非根据正义，虽更富有但更少受人爱戴。"
 pam_sf_penance_cynical_modifier: "重燃信仰"
 pam_sf_penance_cynical_modifier_desc: "该角色正重新点燃信仰，作为曾经愤世嫉俗的忏悔，信仰披在身上像一件陌生的外衣。"
 pam_sf_penance_zealous_modifier: "磨钝狂热"
 pam_sf_penance_zealous_modifier_desc: "该角色正冷却其信仰视为过度的狂热，而虔诚的信徒也对其冷淡下来。"
 pam_sf_penance_paranoid_modifier: "学习信任"
 pam_sf_penance_paranoid_modifier_desc: "该角色正学着用忏悔来消除猜疑，心扉打开了，戒备也放下了。"
 pam_sf_penance_trusting_modifier: "保护内心"
 pam_sf_penance_trusting_modifier_desc: "该角色保护着一颗其信仰认为过于轻信的心，更加警惕了，但也被认为是冷漠。"
 pam_sf_penance_compassionate_modifier: "放下仁慈"
 pam_sf_penance_compassionate_modifier_desc: "该角色正在克制其信仰视为罪恶的仁慈，一张更冷酷的面孔让别人学会了害怕。"
 pam_sf_penance_callous_modifier: "培养仁慈"
 pam_sf_penance_callous_modifier_desc: "该角色正通过忏悔来培养仁慈，以弥补曾经冷酷的心、手段更温和了，但以前倚仗的恐惧逐渐消散。"
 pam_sf_penance_sadistic_modifier: "放弃残暴"
 pam_sf_penance_sadistic_modifier_desc: "该角色正以忏悔来放弃残忍，由此带来的恐惧也随之消散。"
 pam_sf_penance_stubborn_modifier: "顺服意志"
 pam_sf_penance_stubborn_modifier_desc: "该角色正以忏悔驯服固执的意志，在原本不肯让步的地方选择让步。"
 pam_sf_penance_fickle_modifier: "安抚灵魂"
 pam_sf_penance_fickle_modifier_desc: "该角色为灵魂的反复无常而坚持忏悔，而这令其倍感煎熬。"
 pam_sf_penance_eccentric_modifier: "遵循惯例"
 pam_sf_penance_eccentric_modifier_desc: "该角色正以忏悔搁置那些怪诞念头，以作为对古怪行为的赎罪。"
 pam_sf_penance_vengeful_modifier: "践行宽恕"
 pam_sf_penance_vengeful_modifier_desc: "该角色正通过忏悔来放下旧怨，对待俘虏更为温和，但反击时也更为迟缓。"
 pam_sf_penance_forgiving_modifier: "心怀怨恨"
 pam_sf_penance_forgiving_modifier_desc: "该角色依照信仰的要求心怀怨恨，而非宽恕，更冷淡了，也更令人畏惧。"
 pam_mystical_birthright_spiritual_leader_modifier: "生而兴旺"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "一种与生俱来的先天征兆塑造了该角色的精神成长。"
 pam_personal_sacrifice_of_wealth_county_modifier: "虔诚投资"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "统治者的虔诚供奉正在促进该伯爵领的发展。"
 pam_sf_grinding_modifier: "乏味的工作"
 pam_sf_grinding_modifier_desc: "该角色正埋头苦读，灵魂也因此备受煎熬。"
