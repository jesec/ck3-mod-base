 pam_tenet_events.0004.opening.hof: "最尊敬的[diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip]，"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "我写信是为了通知你，[diverged_rite.GetName]已将[diverged_added_tenet.GetBaseName]采纳为其信条之一。\n\n一个能良好指引其子民的仪式，会从整体上强化[diverged_rite.GetFaith.GetAdjective]信仰。这不过是简单的智慧罢了。"
 pam_tenet_events.0004.desc.forward_doctrine: "我写信是为了通知你，[diverged_rite.GetName]现已正式遵行[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )]。\n\n一个能良好指引其子民的礼仪，会从整体上强化[diverged_rite.GetFaith.GetAdjective]信仰。这不过是简单的智慧罢了。"
 pam_tenet_events.0004.desc.backward_tenet: "我写信是为了通知你，[diverged_rite.GetName]已接纳了[diverged_added_tenet.GetBaseName]信条。\n\n借此我们与[diverged_rite.GetFaith.GetMainRite.GetName]更加接近。两种礼仪诉说着同一种声音，[diverged_rite.GetFaith.GetAdjective]信仰将繁荣昌盛！"
 pam_tenet_events.0004.desc.backward_doctrine: "我写信是为了通知你，[diverged_rite.GetName]已接纳了[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )]教义。\n\n借此我们与[diverged_rite.GetFaith.GetMainRite.GetName]更加接近。两种礼仪诉说着同一种声音，[diverged_rite.GetFaith.GetAdjective]信仰将繁荣昌盛！"
 pam_tenet_events.0004.a: "就这样吧。"
 pam_tenet_events.0004.a.tt.diverged: "[diverged_rite.GetName][rite|E]进一步从[diverged_rite.GetFaith.GetMainRite.GetName][mainline_rite|E]偏离，导致年度[fervor_i][fervor|E]加速降低"
 pam_tenet_events.0004.a.tt.consolidated: "[diverged_rite.GetName][rite|E]与[diverged_rite.GetFaith.GetMainRite.GetName][mainline_rite|E]的距离拉近，使年度[fervor_i][fervor|E]降低速度减缓"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "我已为穷人舍去了我的一半财产，我的灵魂因施舍而富裕。\n\n如今我请求你也拿出你的一半。两手空空可得赦免；双手满盈将被牢记。"
 pam_tenet_events.0005.a: "如果我的[redistributing_liege.GetTitleAsNameNoTooltip]可以，那我也可以。"
 pam_tenet_events.0005.b: "我手头繁忙，且将继续如此。"
 pam_tenet_events.0005.b.tt: "你的金库金币大门，你的[counties|E]什么都不会得到"
 pam_tenet_events.0006.t: "隐藏的知识"
 pam_tenet_events.0006.desc_intro: "那些没有标识的书册在我面前摊开，其中绘图一览无余，内容却并非言语可以诉说。这是虔诚信徒被告诫永远不可触碰的学问，而我为自己买下了与它共处的一夜。"
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName]走到门槛前时停了下来。“这些东西被封印是有原因的，”[mystic_witness.GetSheHe]低声说道，“你读了里面的东西，便再也无法忘却。”"
 pam_tenet_events.0006.desc_alone: "\n\n我的宫廷中无人与我共同阅读这些书册。无论其中藏着什么，我都会独自面对。"
 pam_tenet_events.0006.a: "这里面的内容没什么是我不能理解的。继续阅读。"
 pam_tenet_events.0006.b: "只走到灯光照亮之处便停下。"
 pam_tenet_events.0007.t: "亡者的指导"
 pam_tenet_events.0007.desc: "门已闩上，灯已熄灭，世界逐渐收缩，直到只剩一盏摇曳的烛火与缭绕在我周围的浓烟。我已能感知到[guiding_forebear.GetTitledFirstName]的灵体在烟幕后翻腾扭动。\n\n在黑暗中，我将那些白天不敢言说的沉重忧患坦露无遗。灵体的回应不同于凡人——它们透过墓穴般的低语、忽明忽暗的火焰噼啪、无形气息的悄然掠过以及烟雾中蠕动的幽灵来传达。\n\n在绝望中寻求指引，我的双眼紧盯着每一个征兆，寻找那个我最需要的答案。"
 pam_tenet_events.0007.a: "将引导你的智慧借予我。"
 pam_tenet_events.0007.b: "给我足够的平静，让我面对黎明。"
 pam_tenet_events.0008.t: "被铭记的自我"
 pam_tenet_events.0008.desc: "印章，杯子，从我[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))][remembered_forebear.GetTitledFirstName]手上取下的戒指。我将它们放在身前，与它们相对而坐，直到潜意识将自己当成它们的主人。\n\n没有身影显现。没有声音说话。我并非在被提醒关于[remembered_forebear.GetHerHim]的事，而是在被提醒关于我自己的事。而那提醒，是一种我随那一世放下，但并非丢失的本性。"
 pam_tenet_events.0008.a: "那就是我：[remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l]，完完全全。"
 pam_tenet_events.0008.b: "[remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l]在我心中觉醒，我知道这就是我的本性。"
 pam_tenet_events.0008.c: "是的。我曾经拥有，也可以再次拥有[remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l]的本性。"
 pam_tenet_events.0008.d: "那些生命已经消逝。我仍是我。"
 pam_tenet_events.0009.t: "打开宝箱"
 pam_tenet_events.0009.desc_intro: "他们把箱子搬进院子，将钥匙放在我手里。"
 pam_tenet_events.0009.desc_witness: "[redistribution_witness.GetTitledFirstName]走过队列。\n\n“慷慨的[ROOT.Char.GetTitleAsNameNoTooltip]仍然是[ROOT.Char.GetTitleAsNameNoTooltip]，”[redistribution_witness.GetSheHe]说道，“没有人能因施舍得当而得救，唯有当自己已一无所有时，方可得救。”"
 pam_tenet_events.0009.desc_alone: "没有人站在我身边。管家们保持距离，静静等待。"
 pam_tenet_events.0009.desc_end: "\n\n我自己的钱箱，只需转动手腕便能打开。其他人的，我只能采取强制措施。"
 pam_tenet_events.0009.a: "打开锁，让所有人都承担一份责任。"
 pam_tenet_events.0009.flavor: "你的那些有余钱的封臣将被强制打开他们的钱箱，你的伯爵领将变得更加自由、更难控制，而那些不认同此信条的人会因此而怨恨你。"
 pam_tenet_events.0009.b: "等等。只分我自己的就行。"
 pam_tenet_events.0009.b.tt: "你只分发自己的财物。你的[vassals|E]的钱箱依然封闭，不会因此事而怨恨"
 pam_tenet_events.0010.t: "肉体之债"
 pam_tenet_events.0010.desc_intro: "鞭子躺在它一直在的地方。今夜与它相伴的，还有熨斗与短刀——被人悄悄送来，仅经过我的手。"
 pam_tenet_events.0010.desc_alone: "\n\n今夜无人为我掌灯。无论我从桌上拿了什么，都无人目睹。"
 pam_tenet_events.0010.a: "拿鞭子来，打到我的头脑平静下来。"
 pam_tenet_events.0010.b: "让我告别这世间的景色。"
 pam_tenet_events.0010.c: "去掉欲望之根，罪恶也随之而去。"
