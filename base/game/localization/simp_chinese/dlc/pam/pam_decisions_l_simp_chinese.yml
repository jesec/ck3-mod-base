 pam_bull_events.0001.t: "《[GetCurrentDate.GetYear]年教宗诏书》"
 pam_bull_events.0001.desc: "“我劝告你们所有人，去对抗[title.GetName]的异教徒，将那片土地从他们的暴政中解放出来，从他们手中解放成千上万被俘的兄弟。”\n\n“如此，基督之名的尊荣可在你们这个时代得以彰显，你们那誉满天下的勇武，也得以保持完整和坚定。”"
 pam_bull_events.0001.a: "#EMP 因主之名。#!"
 pam_bull_events.0001.a.flavor: "#EMP 因主之名。#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "“你们中信奉[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]者当知晓，[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]如今已对此颁下许可。”"
 pam_bull_events.0002.desc.tenet_forbidden: "“[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]的教义如今在我们的家园已无容身之处。告知任何奉行此教义的人，他们正在违反教会的圣洁性，犯下了大罪。”"
 pam_bull_events.0002.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0002.a.flavor: "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0003.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0003.desc: "“为了根除[heresy_rite.GetName]的邪恶，我以宗座权威，将他们定为异端，他们将受到永恒的诅咒，"
 pam_bull_events.0003.desc.heresiarch: "而他们的领袖[heresiarch.GetTitledFirstName]当被称为异端领袖。”"
 pam_bull_events.0003.desc.no_heresiarch: "持续无数世纪。”"
