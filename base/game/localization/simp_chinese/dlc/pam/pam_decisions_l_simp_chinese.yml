 pam_renounce_papal_candidacy_decision: "放弃参选[ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_embrace: "参选[ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_desc_renounce: "有些人耗尽一生，攀爬着那通往[ROOT.Char.GetFaith.ReligiousHeadName]宝座的天梯；而我，早已看透这场攀爬会将他们异化成何等模样。\n\n让诸位[cardinal|E]知晓：在下一次[ROOT.Char.GetFaith.ReligiousHeadName]选举之时，我绝不参与角逐。我的使命，只在我的教区之中。"
 pam_renounce_papal_candidacy_decision_desc_embrace: "我曾告知众人，绝不觊觎[ROOT.Char.GetFaith.ReligiousHeadName]的宝座。那时我太年轻，而[ROOT.Char.GetFaith.GetName]由更为温和的双手托举。\n\n但如今，望诸位[cardinal|E]知晓，我已愿意参选。"
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "退出下一任[head_of_faith|E]的候选"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "再次参选下一任[head_of_faith|E]"
 pam_renounce_papal_candidacy_decision_renounce_tt: "在下一任[head_of_faith|E]选举中，你不会被视为候选人，但可保留自己的投票权"
 pam_renounce_papal_candidacy_decision_embrace_tt: "当下一位[head_of_faith|E]选举时，你可以被视为候选人"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "必须有另一位[cardinal|E]愿意挺身而出"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "撤下我的名字"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "我愿意了"
 pam_decision_events.0015.t: "宣示虔诚事工之言"
 pam_decision_events.0015.desc.intro.no_praiser: "我忠诚的司祭们传扬着"
 pam_decision_events.0015.desc.intro.praiser: "我那颇具影响力的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))][my_praiser.GetTitledFirstName]传扬着"
 pam_decision_events.0015.desc.intro: "由我的[GetDomicileBuilding('chancery_01').GetName]所撰写的颂词：\n\n“美德之行犹如良种，由主栽种，在那里繁茂为虔诚的丰盈。人皆当知晓[praise_worthy_priest.GetName]，因[praise_worthy_priest.GetHerHis]高尚"
 pam_decision_events.0015.desc.virtuoustrait: "而又[my_virtuous_trait.GetName(praise_worthy_priest)]"
 pam_decision_events.0015.desc.mid: "的美德，常受"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]的指引……”"
 pam_decision_events.0015.desc.novirtuoustenet: "神的指引……”"
 pam_decision_events.0015.desc.bad: "\n\n尽管赞誉之词不绝于耳，我心仍畏惧地狱之火的亲吻。"
 pam_decision_events.0015.desc.good: "\n\n没错，我确是主的器皿，是祂在尘世之美的化身。"
 pam_decision_events.0015.desc.neutral: "\n\n尽管赞誉之词不绝于耳，唯有死后，我方能知晓自己的灵魂是否与主同在。"
 pam_decision_events.0015.desc.outro: "\n\n“……诚然，凭借[praise_worthy_priest.GetHerHis]事迹的义德，这正是那有朝一日堪当领导教会的伟人之样式！”"
 pam_decision_events.0015.b: "“我名下已有诸多奇迹。”"
 pam_decision_events.0015.b.flavor: "既然有封圣的可能，又何必选择教宗之位？"
 pam_decision_events.0015.b.tt: "#V 提高死后封圣概率#!\n#weak 需要[dynasty|E]才能封圣#!"
 pam_decision_events.0015.c: "若主愿我引领……"
 pam_decision_events.0015.c.flavor: "……则我必须兴起"
 pam_decision_events.0015.c.tt: "#V 提升对[praise_worthy_priest_superior_title.GetName]的选举分数#!：#P +30#!"
 pam_decision_events.0015.d: "不能再有其他的名字。"
 pam_decision_events.0015.d.flavor: "清空我虔诚的财库；我绝不甘居人后"
 pam_decision_events.0015.d.tt: "#V 提高[praise_worthy_priest_superior_title.GetName]的选举分数#!：#P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!，足够脱颖而出成为$theocratic_elective_populist$\n需要@piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0][piety|E]"
