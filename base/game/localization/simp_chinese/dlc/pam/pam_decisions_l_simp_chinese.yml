 pam_kingdom_of_heaven.0001.t: "天主的国"
 pam_kingdom_of_heaven.0001.desc: "“天主的国好比一个人把种子撒在地里，他黑夜白天，或睡或起，那种子发芽生长，至于怎样，他却不知道。”\n\n我转身面向基督教世界。我的手指间，握着来自圣地的泥土。\n\n“因为土地自然生长果实：先发苗，”我摊开手掌，泥土消散在空气中。“后吐穗，”我指向我的子民。“最后穗上满了麦粒。”我举起我的权杖。\n\n“当果实成熟的时候，便立刻派人以镰刀收割，因为到了收获的时期。”"
 pam_kingdom_of_heaven.0001.a: "我不会放弃[previous_capital.GetNameNoTooltip]。"
 pam_kingdom_of_heaven.0001.b: "圣伯多禄之座如何比得上基督之座？"
