 pam_decision_events.0008.t: "征收什一税"
 pam_decision_events.0008.desc.intro: "[ROOT.Char.GetFaith.HouseOfWorshipPlural]堆满的金库触手可及。紧随着我的卫兵踏入神殿的脚步声，钱币的叮当声传来。\n\n"
 pam_decision_events.0008.desc.chaplain: "“如今[ROOT.Char.GetTitleAsNameNoTooltip|l]喜欢羞辱[ROOT.Char.GetFaith.HighGodName]的仆人了？”[chaplain.GetTitledFirstName]斥责道。“像剥光#EMP 下流的#!妓女一样剥光[ROOT.Char.GetFaith.HighGodHerHis|U]的圣所能让你感到欢欣吗？”"
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]厌恶地转过脸去。[ROOT.Char.GetFaith.HighGodName]的仆人似乎十分热衷于金钱。"
 pam_decision_events.0008.a: "慷慨不是一种美德吗？"
