 pam_kowtowed_to_pope_modifier: "向教会屈服"
 pam_kowtowed_to_pope_modifier_desc: "该[ruler|E]已向教会屈服，承诺在结束[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]的会议上支持#EMP “属灵，可被剥夺”#!教义。一旦会议解决争端，该修正将被移除。"
