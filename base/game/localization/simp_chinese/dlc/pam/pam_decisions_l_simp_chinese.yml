 pam_decision_events.0019.t: "朝圣者的守护者"
 pam_decision_events.0019.desc: "一封信函将承载我的话语，送达所有[ROOT.Char.GetFaith.GetAdherentNamePlural]：\n\n“通往圣地的道路已变得危险重重。告知所有信众，你们在朝圣途中可携带武器，保卫自身，对抗任何阻隔通往天堂之路的人。”"
 pam_decision_events.0019.a: "主啊，赐我们力量。"
 pam_decision_events.0018.opening: "致所有土地的[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]，"
 pam_decision_events.0018.desc.armed_pilgrimages: "我已对此事盖印确认。从今日起，[GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )]将被列为[hof_scope.GetFaith.GetName]的核心教义之一。\n\n信仰的所有统治者都须听从。"
 pam_decision_events.0018.desc.struggle_submission: "我已对此事盖印确认。从今日起，[GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )]将被列为[hof_scope.GetFaith.GetName]的核心教义之一。\n\n信仰的所有统治者都须听从。"
 pam_decision_events.0018.a: "就这样吧。"
 pam_decision_events.0017.t: "竖立祖先十字架石"
 pam_decision_events.0017.desc: "我在一处俯瞰[khachkar_location.GetNameNoTier]的高地上选定了十字架石的竖立之处。\n\n我将让雕刻大师们创造出一件真正令人敬畏的作品，以纪念[khachkar_ancestor.GetTitledFirstNameNicknamed]。一座以玫瑰花结、装饰图案和铭文环绕的十字架，铭文上刻着[khachkar_ancestor.GetHerHis]的[khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)]敬奉[khachkar_ancestor.GetHerHis]的记忆。\n\n愿当地朝圣者在它之下祈祷，也愿所有人都能看到我们对这片土地的合法统治。"
 pam_decision_events.0017.a: "愿十字架永世长存。"
 pam_decision_events.0017.b: "时机不对。"
