 pam_decision_events.0021.t: "生活的圣言"
 pam_decision_events.0021.desc: "[ROOT.Char.Custom('GetFaithTemple')]中已再无跪拜之地。朝圣者与[ROOT.Char.GetFaith.PriestNeuterPlural]摩肩接踵，贵族与乞丐同处一堂，而人群仍在从门口不断涌入。\n\n我的事迹被算得比任何编年史家所能记录的都更为详尽——走过的每一条路，遵守的每一次夜祷，奉[ROOT.Char.GetFaith.HighGodNamePossessive]之名施舍的每一枚钱币。其中一位[ROOT.Char.GetFaith.PriestNeuterPlural]握住我的手，将它按在[ROOT.Char.GetFaith.HighGodNamePossessive]的圣坛上：“说吧，我们会倾听。”\n\n随之而来的静默，属于我一人。我用什么来填满它，回响将远传于这些高墙之外。"
 pam_decision_events.0021.a: "让慈悲成为我的布道。"
 pam_decision_events.0021.b: "我会用火与剑来传达圣言。"
 pam_herald_shepherd_of_the_faithful_modifier: "信众的牧者"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "该角色以慈悲之言宣告其神圣使命，因此获得信众的敬爱。"
 pam_herald_fire_and_sword_modifier: "火与剑"
 pam_herald_fire_and_sword_modifier_desc: "该角色将其神圣使命宣告为战斗的号召，信仰的战士们纷纷涌向其旗帜。"
 pam_convert_to_theocracy_decision: "采用神权统治"
 pam_convert_to_theocracy_decision_desc: "当前的等级制度是对[ROOT.Char.GetFaith.GoodGodNames]所定规则的歪曲。我已被赋予唯一一条纠正它的道路——这条道路既能颂赞[ROOT.Char.GetFaith.CreatorHerHim|U]，又能履行我对子民的职责。这就是[ROOT.Char.GetFaith.GoodGodNames]的话语。"
 pam_convert_to_theocracy_decision_confirm: "施行[ROOT.Char.GetFaith.HighGodNamePossessive|U]的权威"
 pam_convert_to_theocracy_decision_tooltip: "将你的[government|E]更改为[theocracy|E]"
 pam_convert_theocracy_to_feudal_decision: "恢复世俗统治"
 pam_convert_theocracy_to_feudal_decision_desc: "作为[ROOT.Char.GetFaith.HighGodNamePossessive|U]律法名义上的权威，[ROOT.Char.GetFaith.GetAdherentNamePlural]仰赖我给予属灵指导。唉，我自觉不能胜任此职，将这类裁决交给我的[ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]。\n\n我的专长在于世俗事务，理应由我戴上世俗的冠冕！让人民知道，主事的是我，不是[ROOT.Char.GetFaith.PriestNeuterPlural]，甚至也不是[ROOT.Char.GetFaith.HighGodName]。"
