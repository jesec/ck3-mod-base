 pam_antipope_events.0001.desc.intro: "[ROOT.Char.GetRite.GetName]的全体似乎都聚集在这座[ROOT.Char.GetFaith.HouseOfWorship]之中。\n\n"
 pam_antipope_events.0001.desc.self: "我将手高高举起。[pope.GetTitledFirstName]的虚假统治即将走向终结。现在轮到我来引导[pope.GetHerHis]那些受尽虐待的信众了。"
 pam_antipope_events.0001.desc.sponsor: "“让传令官宣告，#EMP 我#!才是真正的[ROOT.Char.GetFaith.ReligiousHeadName|U]！”[antipope.GetTitledFirstName]咆哮道。“让所有人都知道，那个伪[pope.GetTitledFirstName]躲在[pope.GetHerHis]的[pope_capital.GetName]的宫殿里，而信众却无人引导，遭受欺凌！”\n\n[antipope.GetSheHe|U]转向我。“但无需再恐惧。虔诚的[ROOT.Char.GetTitledFirstName]已决心终结你的悲痛。而我，将与[ROOT.Char.GetHerHim]同行。”"
 pam_antipope_events.0001.a: "让[ROOT.Char.GetFaith.GetNameNoTooltip]颤抖。"
