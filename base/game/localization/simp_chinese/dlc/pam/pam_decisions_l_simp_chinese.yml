 pam_personal_sacrifice_of_wealth_decision: "献祭财富"
 pam_personal_sacrifice_of_wealth_decision_desc: "献出你的一部分财富以表虔诚，促进你保护下的一个伯爵领的发展。"
 pam_personal_sacrifice_of_wealth_decision_tooltip: "花费[gold|E]提高选择的[county|E]的[development_growth|E]并获得[spiritual_fulfillment|E]"
 pam_personal_sacrifice_of_wealth_decision_confirm: "献出祭品"
 pam_personal_sacrifice_of_wealth_decision_toast: "确立虔诚投资"
 pam_develop_clerical_court_decision: "教育你的圣职宫廷"
 pam_develop_clerical_court_decision_desc_christian: "闲散的文书成不了[ROOT.Char.GetFaith.HighGodName]的合格仆人。我要召集家中的相关人员——为合格者授圣职，训导已受圣职的人，并召唤初学修士来到我的门前。"
 pam_develop_clerical_court_decision_desc: "闲散的仆从不会为[ROOT.Char.GetFaith.HighGodName]带来荣耀。让我召集家中众人——提拔配得上的人成为[clergy|E]，训导已受圣职的人，并召唤初学修士来到我的门前。"
 pam_develop_clerical_court_decision_tooltip: "为你的宫廷任命、教导或招募[clergy|E]"
 pam_develop_clerical_court_decision_confirm: "召集家臣"
 pam_develop_clerical_court_decision_tt: "你召集你的家臣，并选择以下#EMP 之一#!：\n$EFFECT_LIST_BULLET$最多[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]名平信徒[courtiers|E]成为[clergy|E]，每人为你提供额外[piety_i][piety|E]\n$EFFECT_LIST_BULLET$最多[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]名宫廷[clergy|E]获得[learning_i][learning|E]和[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]或[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]/[trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$最多[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]名来自周边土地的初学修士加入你的宫廷和[clergy|E]\n\n无论你选择哪条道路，你都会获得[GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0][piety_i][piety|E]\n\n#weak 奖励会随你的[learning|E]、[piety_level|E]和宗教[traits|E]提升；偶尔会出现罕见机遇#!"
 pam_develop_clerical_court_decision_candidates_tt: "你有一位适合授予圣职或进行教导的[courtier|E]，或者附近有一位合适的人选"
 pam_clerical_court_joins_clergy_tt: "加入[pam_clerical_patron.GetFaith.GetName]的[clergy|E]"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName]加入神职人员"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName]智慧增长"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName]响应召唤"
 pam_oblate_patron_reason: "著名的初学修士赞助者"
 pam_oblate_patron_modifier: "初学修士赞助者"
 pam_oblate_patron_modifier_desc: "该角色以支持那些投身宗教侍奉的人而闻名。立誓的门槛变低了，父母们也更愿意送别自己的孩子。"
 pam_scriptorium_modifier: "文书厅"
 pam_scriptorium_modifier_desc: "该角色供养着一间文书厅，他们的工作吸引着博学之士来到首府。"
 pam_decision_events.0032.t: "牧养羊群"
 pam_decision_events.0032.desc.intro.christian: "我召集家中的文书与神职人员，权衡谁应当被授予圣职，谁还需要更多的指引。"
 pam_decision_events.0032.desc.intro: "我向在我的宫廷中侍奉[ROOT.Char.GetFaith.GetName]的人发问：谁要正式进入侍奉的行列，谁又渴望得到指引？"
 pam_decision_events.0032.desc.pupil: "\n\n我的学生[pam_clerical_pupil.GetFirstName]正站在那里祈祷，急于证明[pam_clerical_pupil.GetHerHis]自身的价值。"
 pam_decision_events.0032.desc.no_pupil: "\n\n他们中投身信仰服务的人太少——这是我打算纠正的不足。"
 pam_decision_events.0032.desc.novice: "\n\n在我的宅邸外，一个名叫[pam_clerical_novice.GetFirstName]的满怀期许的陌生人，恳求能获得一个侍奉该信仰的位置。"
 pam_decision_events.0032.desc.outro.christian: "\n\n我该如何照料[ROOT.Char.GetFaith.HighGodName]赐予我的羊群？"
 pam_decision_events.0032.desc.outro: "\n\n我应当如何培养这些[ROOT.Char.GetFaith.HighGodName]托付给我的人？"
 pam_decision_events.0032.prodigy: "我的学生拥有神圣的天赋！"
 pam_decision_events.0032.oblates: "告诉所有人，我欢迎那些被召唤服役之人。"
 pam_decision_events.0032.piety: "他们的虔诚也坚定了我的信仰。"
 pam_decision_events.0032.novice: "一个有前途的灵魂——立刻接纳[pam_clerical_novice.GetHerHim]。"
 pam_decision_events.0032.miracle: "听说我的学生创造了奇迹。"
 pam_decision_events.0032.relic.christian: "这部圣书应当归入我的宝库！"
 pam_decision_events.0032.relic: "让这些著作丰富我的宫廷。"
 pam_decision_events.0032.language: "让我的学生研读圣书。"
 pam_decision_events.0032.scriptorium.christian: "让缮写室里的每一支羽毛笔都动起来。"
 pam_decision_events.0032.scriptorium: "让宫廷中所有文书都开始工作。"
 pam_decision_events.0032.a.christian: "任命我宅邸中最具资格者。"
 pam_decision_events.0032.a: "将我最得力的家臣提拔进入教会服务。"
 pam_decision_events.0032.a.tt: "最多[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]名你最博学的平信徒[courtiers|E]#weak （包括亲属）#!：\n$EFFECT_LIST_BULLET$成为[pam_clerical_patron.GetFaith.GetName][clergy|E]\n$EFFECT_LIST_BULLET$获得[learning_i][learning|E]和对你的[opinion|E]\n$EFFECT_LIST_BULLET$给予你[piety_i][piety|E]"
 pam_decision_events.0032.b: "指示我手下的神职人员。"
 pam_decision_events.0032.b.tt: "最多[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]名你的最博学的宫廷[clergy|E]：\n$EFFECT_LIST_BULLET$获得[learning_i][learning|E]#weak （最多[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0]）#!\n$EFFECT_LIST_BULLET$获得或推进[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]或[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]"
 pam_decision_events.0032.c.named: "接纳[pam_clerical_novice.GetFirstNameNoTooltip]，并传话表示欢迎初学修士。"
 pam_decision_events.0032.c: "传出去，我们欢迎初学修士。"
 pam_decision_events.0032.c.tt: "最多[pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]名来自周边土地的初学修士：\n$EFFECT_LIST_BULLET$加入你的宫廷，成为[pam_clerical_patron.GetFaith.GetName][clergy|E]\n$EFFECT_LIST_BULLET$皈依你的[rite|E]"
 pam_seize_capital_clerical_region_decision: "夺取圣职区"
 pam_seize_capital_clerical_region_decision_desc: "我的首都位于我未持有的[clerical_region|E]内。不该有任何[archbishop|E]凌驾于我统治的教座之上：那个[title|E]应当属于[head_of_faith|E]。"
 pam_seize_capital_clerical_region_decision_tooltip: "接管你的首都所在的[clerical_region|E]，若教座未空缺，罢免其[archbishop|E]"
 pam_seize_capital_clerical_region_decision_confirm: "接管教座"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName]被罢免"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName]传给你"
