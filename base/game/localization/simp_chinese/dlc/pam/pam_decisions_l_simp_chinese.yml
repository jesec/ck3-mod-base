 pam_decision_last_rites_desc: "#EMP [ROOT.Char.GetFaith.HighGodName]，求祢按照祢的仁慈怜悯我，依祢丰厚的慈爱，消灭我的罪恶。求你将我的过犯洗尽，求祢将我的罪恶除净。#!\n\n我即将脱离此肉躯生命，愿把灵魂整饬妥当。若能抵御地狱势力的侵袭，我或可获得善终与永生，安居于天国。"
 pam_decision_last_rites_tooltip: "为离开尘世预备你的灵魂"
 pam_decision_last_rites_tooltip_sp_effect: "你会获得些许[spiritual_fulfillment|E]@spiritual_fulfillment_icon!"
 pam_decision_last_rites_confirm: "来我床前"
 pam_decision_last_rites_sp_tooltip: "你的[spiritual_fulfillment|E]至少为#V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_doctrine_tt: "[faith|E]必须拥有[GetDoctrineType('doctrine_sacraments_central').GetBaseName][doctrine|E]"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon!#X 若你未接受临终圣事：\n$BULLET_WITH_TAB$你失去[legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$$every_zealot_vassal$：\n$TAB$$BULLET_WITH_TAB$对#V 你#!的[opinion|E]降低#N 30#!#!"
 pam_decision_events.0005.secret_reveal: "@alert_icon!#alert_trial 你可能需要揭露一个[secret|E]"
 pam_decision_events.0005.details: "你将有机会[lease|E][titles|E]，或者如果你没有可租赁头衔，则可以向[monastic_holy_orders|E]、[holy_orders|E]或[the_christian_church|E]捐赠[gold|E]——这会为你的[player_heir|E]提供增益[modifiers|E]"
 pam_decision_events.0005.t: "临终圣事：我的最后时刻"
 pam_decision_events.0005.desc.healthtrait: "罪孽使我[death_trait.GetName(soon_dead)|l]，亦恐是我即将离世的原因。"
 pam_decision_events.0005.desc.bad: "我曾努力尊崇[ROOT.Char.GetFaith.HighGodName]，却因骄矜而试图向他洞悉万有的眼目隐藏己罪。\n\n"
 pam_decision_events.0005.desc.good: "仰赖上主的仁慈，我觉得仿佛有天使近在身旁，护佑我的灵魂免受恶魔攫取。\n\n"
 pam_decision_events.0005.desc.neutral: "尽管我曾力图光荣[ROOT.Char.GetFaith.HighGodName]，如今临近永生的门槛，我却忧心我的灵魂能否被判定配进入他的天国？\n\n"
 pam_decision_events.0005.desc.notalone: "在我身旁有我[ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )][ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))][fam_or_friend_1.GetFirstName]，以及其他为我的灵魂祈祷的人。"
 pam_decision_events.0005.desc.alone: "我恐惧战栗，孑然一身，身边无亲近之人能为我的灵魂祈祷。"
 pam_decision_events.0005.desc.outro: "我的告解神父手持[Glossary('圣事礼典','SACRAMENTARY_GLOSS')]，规劝我道：“你要面对[ROOT.Char.GetFaith.HighGodName]，切勿欺瞒！”\n\n即便是深陷罪恶的达味王，也在告明之后得以洁净……[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "补赎圣事就在眼前。"
 pam_decision_events.0005.b: "让魔鬼抓了我吧！把这司铎给我赶走。"
 pam_psalm_51_english: "“得罪了你……我作了你视为恶的事……在你的判决上，显出你公义，在你的断案上，显出你的正直。”"
 SACRAMENTARY_GLOSS: "圣事礼典，或称#EMP 礼典#!，是基督教主教或司铎在礼仪中使用的书籍。因时代和地区不同，书中可能包含诵读或咏唱的经文，以及施行圣事所需的祷文。"
 pam_decision_events.0006.t: "终傅圣事：我的罪孽常在我眼前"
 pam_decision_events.0006.intro: "“是人都会犯错。但没有忏悔，就没有赦免。”[confessor.GetTitledFirstName]说。"
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\n我的罪孽巨大且频繁。我的灵魂沉重不堪，被撒旦灼热的手指紧紧攥着，他决意要夺走那显然已属于他的。\n\n"
 pam_decision_events.0006.desc.good: "\n\n我的心神轻松，因我所作所为合乎上主的旨意。\n\n"
 pam_decision_events.0006.desc.neutral: "\n\n我仅是凡人之躯，纵有善意，终究难免获罪。\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "我那[my_sinful_trait.GetName(soon_dead)]的本性，多少次将我引入歧途！"
 pam_decision_events.0006.desc.secret_sin: "我曾在黑暗的港湾中，藏匿着我身为[my_secret.GetName]的秘密。"
 pam_decision_events.0006.desc.my_criminal_trait_sin: "或许最糟糕的是，我竟是一个[my_criminal_trait.GetName(soon_dead)]！这令人窒息的罪疚，扼住了每一次呼吸。"
 pam_decision_events.0006.desc.sin_default: "我的罪过，虽必不少，却难以一一记起。我确信，一旦向[confessor.GetTitledFirstNameNoTooltip]开口，它们便会如决堤之海般倾泻而出。"
 pam_decision_events.0006.desc.sin_default_good_sp: "愿[ROOT.Char.GetFaith.HighGodName]压碎我的骨骸，抹去我的罪污。"
 pam_decision_events.0006.desc.outro: "我必须怀着真切的悔悟，坦承己罪，否则便不能领受圣体。"
 pam_decision_events.0006.a: "“请赦免我，[confessor.GetMotherFather]……”"
 pam_decision_events.0006.b: "有些罪应当随我入土。"
 pam_decision_events.0006.b.flavor: "你告明了一些罪过，但保留了那些可能牵连他人的秘密。"
 pam_decision_events.0007.t: "终傅圣事：圣体、圣血与圣油"
 pam_decision_events.0007.intro: "我的罪恶已然清算。欠一百德纳与欠一万塔冷通，终究是截然不同的两码事。\n\n此时，我的告解神父将祝圣过的饼与酒递到了我面前。"
 pam_decision_events.0007.desc.bad: "此刻，当我主的圣体圣血呈现眼前，我仍听见小鬼们的窃窃私语，求我交出灵魂，好使我继续存活，沉溺于世俗的享乐。\n\n"
 pam_decision_events.0007.desc.good: "倾吐重负之后，我欣然迎接死亡的怀抱。我渴望恭领我主的圣体圣血，因我即将与主相偕于天乡。\n\n"
 pam_decision_events.0007.desc.neutral: "愿主的圣体圣血护佑我，抵御那宛如埋伏的狼群、欲在我命定之刻未至时便攫取我的恶魔。\n\n"
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U]随即用圣油傅抹我的额头、双手和双脚。"
 pam_decision_events.0007.desc.oil.bad: "我的灵魂依旧不安。\n\n"
 pam_decision_events.0007.desc.oil.good: "我的灵魂感受到了主的爱。\n\n"
 pam_decision_events.0007.desc.oil.neutral: "我的灵魂感觉得到了前往永生旅途的护佑。\n\n"
 pam_decision_events.0007.desc.outro: "[Glossary('临终圣体','VIATICUM_GLOSS')]和[Glossary('临终傅油','UNCTION_GLOSS')]已完成，便可以安排身后为我祈祷之人了。"
 VIATICUM_GLOSS: "临终圣体（拉丁文意为“旅途之粮”）是指临终者在终傅圣事中领受的圣体圣事。此旅途乃是通往永生的通道。"
 UNCTION_GLOSS: "临终傅油是指病者临终时，领受圣油，即为预备进入永生的安所而施行的圣事。"
 pam_decision_events.0007.a: "愿[monastic_order.GetName]为我祈祷。"
 pam_decision_events.0007.b: "我愿向[military_order.GetName]捐赠。"
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip]将得到我的财富，我要[religious_head.GetHerHis]为我祷告。"
 pam_decision_events.0007.d: "向[confessor.GetTitledFirstNameNoTooltip]说句虔诚话就够了。"
