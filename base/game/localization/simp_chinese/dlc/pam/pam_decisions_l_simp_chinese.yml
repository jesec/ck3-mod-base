 pam_decision_events.0002.t: "展现奉献"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName]站在我身侧，祭台旁边。柔和的阳光照耀着"
 pam_decision_events.0002.desc.uncrowned: "我的衣服，如同一条神圣的披风。"
 pam_decision_events.0002.desc.crowned: "我的冠冕，如同一道光轮。"
 pam_decision_events.0002.desc.mid: "\n\n“[ROOT.Char.Custom('RandomBibleQuote')]……”[my_chaplain.GetHerHis|U]的讲道说个不停，"
 pam_decision_events.0002.desc.bad: "而我努力集中注意力。"
 pam_decision_events.0002.desc.good: "而观众似乎只关注我。"
 pam_decision_events.0002.desc.neutral: "而我打量着观众，寻找令人印象深刻的面孔。"
 pam_decision_events.0002.desc.outro: "\n\n“而我们的[ROOT.Char.GetNameNoTooltip]明智且有德行，将会带领我们度过这注定失败的时期。”"
 pam_decision_events.0002.a: "我必须亲自向人群发表讲话。"
 pam_decision_events.0002.b: "一次简单的致谢就可以了。"
 pam_mentor_sp_decision: "提供属灵指引"
 pam_mentor_sp_decision_desc: "我们这些行走在[ROOT.Char.GetFaith.HighGodNamePossessive]的光辉之下的人，有责任引导那些迷失于黑暗之中的人，以及那些因年少而可能在思想或行为上误入歧途的人。"
 pam_mentor_sp_decision_desc_tooltip: "帮助孩子提高其[spiritual_fulfillment|E]"
 pam_mentor_sp_decision_confirm: "诉说，聆听。"
 pam_mentor_sp_decision_sp_tooltip: "你的[spiritual_fulfillment|E]至少为#V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
