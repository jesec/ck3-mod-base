 pam_decision_events.0003.t: "最重要的一课"
 pam_decision_events.0003.desc.intro: "夜幕降临，城堡内一片寂静。我的[target_child.Custom('GetDaughterSon')]随我坐在私人小堂里。\n\n我端详着[target_child.GetHerHim]。"
 pam_decision_events.0003.desc.bad: "[target_child.GetHerHis|U]面色低沉，眼神漠然，几乎要睡着了。\n\n“[ROOT.Char.GetMotherFather|U]，”[target_child.GetSheHe]不耐烦地问，“你为什么叫我来？”"
 pam_decision_events.0003.desc.good: "[target_child.GetHerHis|U]的眼睛被烛光照得明亮。[target_child.GetSheHe|U]是个好[target_child.GetWomanMan]。\n\n“[ROOT.Char.GetMotherFather|U]，”[target_child.GetSheHe]问道，“我什么地方做错了吗？”"
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U]人。如今已经够大了。\n\n“[ROOT.Char.GetMotherFather|U]，”[target_child.GetSheHe]轻声问，“人当如何善度人生？”"
 pam_decision_events.0003.a: "腐烂的[ROOT.Char.GetTitleAsNameNoTooltip|l]很快就会毒害[target_child.GetHerHis]的[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]。"
 pam_decision_events.0003.b: "只要……做个好人。"
 grudge_pressured_me_sp: "在[TARGET_CHARACTER.GetShortUIName]就[CHARACTER.GetShortUIName|U]的灵性满足对[CHARACTER.GetHerHim]施压后，[CHARACTER.GetShortUIName]对[TARGET_CHARACTER.GetShortUIName]发展出了怨恨。"
 grudge_pressured_me_sp_corresponding: "在[CHARACTER.GetShortUIName]就[TARGET_CHARACTER.GetShortUIName]的灵性满足对[TARGET_CHARACTER.GetHerHis]施压后，[TARGET_CHARACTER.GetShortUIName]对[CHARACTER.GetShortUIName|U]发展出了怨恨。"
