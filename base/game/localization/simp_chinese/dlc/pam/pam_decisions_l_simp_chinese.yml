 pam_kowtow_to_pope_decision_desc: "王冠与牧杖正为谁有权任命圣职头衔持有者而争执不休。与其冒险公然违抗，不如向[ROOT.Char.GetFaith.ReligiousHeadName]屈膝，在解决此事的大会上与信众站在一起。"
