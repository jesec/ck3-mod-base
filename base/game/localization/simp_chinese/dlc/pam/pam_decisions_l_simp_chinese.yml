 pam_proclaim_living_word_decision_desc: "信众们低声相传，说[ROOT.Char.GetFaith.HighGodName]已标记了我。朝圣者们在路边的神龛中念诵我的名字，[ROOT.Char.GetFaith.PriestNeuterPlural]将我的裁决当作经文引用。\n\n让它在每一座祭坛上被宣告：通过我，生活的圣言显现。"
