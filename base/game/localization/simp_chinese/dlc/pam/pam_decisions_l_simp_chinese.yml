 pam_decision_events.0020.desc: "在[clerical_region.GetName]举行弥撒后，我召集了一群信众，让他们聆听[ROOT.Char.GetFaith.HighGodName|U]的话语。我从[ROOT.Char.GetFaith.ReligiousText|U]中选了一段经文，来传授我的[selected_item.GetName( actor.GetRite )]教义：\n\n“[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]”"
