 pam_decision_events.0001.t: "告解圣事"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName]耐心地在空荡的礼拜堂中等待着。\n\n"
 pam_decision_events.0001.desc.bad: "[chaplain.GetHerHis|U]严厉的表情与我印象中的神父一样。"
 pam_decision_events.0001.desc.good: "即使我肩膀上的负担并不沉重，但仍然可以减轻。"
 pam_decision_events.0001.desc.neutral: "我来到[chaplain.GetHerHim]身边，如同迷途的牛，不确定心中是否拥有良善。"
 pam_decision_events.0001.desc.sin.preamble: "\n\n因罪而生的愧疚，于我而言并不陌生。"
 pam_decision_events.0001.desc.sin.lustful: "我任凭色欲主宰了我的意志。"
 pam_decision_events.0001.desc.sin.chaste: "我的禁欲已成逃避职责的冰冷庇护所。"
 pam_decision_events.0001.desc.sin.gluttonous: "我纵容肉身，饮食无度。"
 pam_decision_events.0001.desc.sin.temperate: "我的节制已僵化为对正当需求的否认。"
 pam_decision_events.0001.desc.sin.greedy: "我本该施舍时，却紧握金银不放。"
 pam_decision_events.0001.desc.sin.generous: "我的施予失于明智，终致自身枯竭。"
 pam_decision_events.0001.desc.sin.lazy: "怠惰使我远离祈祷与职守。"
 pam_decision_events.0001.desc.sin.diligent: "我对劳作的狂热，挤占了仁慈的空间。"
 pam_decision_events.0001.desc.sin.wrathful: "愤怒驱使我堕入罪愆。"
 pam_decision_events.0001.desc.sin.calm: "我的冷静，不过是披着美德外衣的冷漠。"
 pam_decision_events.0001.desc.sin.patient: "耐心已变质为怯懦的拖延。"
 pam_decision_events.0001.desc.sin.impatient: "急躁使我变得苛刻而鲁莽。"
 pam_decision_events.0001.desc.sin.arrogant: "骄傲膨胀了我的心智。"
 pam_decision_events.0001.desc.sin.humble: "虚假的谦卑使我远离真理。"
 pam_decision_events.0001.desc.sin.deceitful: "我口出谎言，隐瞒了本应坦诚相告之事。"
 pam_decision_events.0001.desc.sin.honest: "我直率的诚实，在当存温柔之处留下了伤痕。"
 pam_decision_events.0001.desc.sin.craven: "恐惧使我背弃了正道。"
 pam_decision_events.0001.desc.sin.brave: "我的勇猛越过了审慎，沦为鲁莽。"
 pam_decision_events.0001.desc.sin.shy: "胆怯使我未能行当行之善。"
 pam_decision_events.0001.desc.sin.gregarious: "我对交际的沉迷，淹没了良知的声音。"
 pam_decision_events.0001.desc.sin.ambitious: "野心已凌驾于我的良知之上。"
 pam_decision_events.0001.desc.sin.content: "知足钝化了我对义德的渴慕。"
 pam_decision_events.0001.desc.sin.arbitrary: "我凭一时好恶施政，而非依公义而行。"
 pam_decision_events.0001.desc.sin.just: "我的公义缺乏怜悯，且带着俯视之睥睨。"
 pam_decision_events.0001.desc.sin.cynical: "愤世嫉俗侵蚀了我的信仰。"
 pam_decision_events.0001.desc.sin.zealous: "狂热燃烧得比仁爱更为炽烈。"
 pam_decision_events.0001.desc.sin.paranoid: "猜忌毒化了我与他人的往来。"
 pam_decision_events.0001.desc.sin.trusting: "轻信使我无视邪恶。"
 pam_decision_events.0001.desc.sin.compassionate: "怜悯使我宽恕了本该谴责之事。"
 pam_decision_events.0001.desc.sin.callous: "我对他人的苦难硬起了心肠。"
 pam_decision_events.0001.desc.sin.stubborn: "固执使我听不进劝诫。"
 pam_decision_events.0001.desc.sin.fickle: "反复无常使我的言语失信于人。"
 pam_decision_events.0001.desc.sin.eccentric: "我的古怪行径使信众跌倒。"
 pam_decision_events.0001.desc.sin.vengeful: "复仇之心吞噬了我。"
 pam_decision_events.0001.desc.sin.forgiving: "对于重罪，我的宽恕来得过于轻率。"
 pam_decision_events.0001.desc.sin.sadistic: "我曾在残忍中寻得快意。"
 pam_decision_events.0001.desc.outro: "\n\n“[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]”"
 pam_decision_events.0001.a: "原谅我，[chaplain.GetMotherFather]。我犯下了罪。"
 pam_john_20_22_english: "你们领受圣神罢！你们赦免谁的罪，就给谁赦免；你们存留谁的，就给谁存留。"
 JOHN_20_22_GLOSS: "#weak 《若望福音》20:22-23，思高圣经#!"
 pam_decision_act_of_devotion: "展现奉献"
 pam_decision_act_of_devotion_desc: "我与[ROOT.Char.GetFaith.HighGodName]的深刻内在联系是如此强烈，我必须将其表露出来！\n\n召集[ROOT.Char.GetFaith.PriestNeuterPlural]，举行一场盛大的弥撒，召唤领地内的所有人。让他们见证他们领主的虔诚。"
 pam_decision_act_of_devotion_desc_tooltip: "以[piety|E]换取[prestige|E]"
 pam_decision_act_of_devotion_tooltip_effect: "你会选择以下之一：\n$BULLET_WITH_TAB$[prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#![prestige|E]\n$BULLET_WITH_TAB$[prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#![prestige|E]，并以损失1级[piety_level|E]为代价获得额外[prestige_level|E]升级"
 pam_decision_act_of_devotion_confirm: "敲响钟声！"
 pam_decision_act_of_devotion_sp_tooltip: "你的[spiritual_fulfillment|E]至少达到#V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "你的[prestige_level|E]必须低于[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]"
 pam_confession_penalty_modifier: "补赎"
 pam_confession_penalty_modifier_desc: "该角色必须应告解神父的要求执行行动"
