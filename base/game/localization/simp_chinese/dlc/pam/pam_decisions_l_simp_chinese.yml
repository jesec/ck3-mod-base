 pam_decision_events.0001.a.confession_random_outcome: "你的[court_chaplain|E]可能向你询问什么，或者在告解过程中你可能会听到什么……"
 pam_decision_events.0001.a.piety: "你的告解感觉很真诚"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName]得知了一些新信息"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName]反对你的罪恶特质"
 pam_decision_events.0001.a.courtier_secret: "你听到[my_courtier.GetShortUIName]的告解"
