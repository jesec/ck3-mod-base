 pam_promulgate_word_of_pious_deeds_decision: "宣示虔诚事工之言"
 pam_promulgate_word_of_pious_deeds_decision_desc: "我的文书厅汇编了一篇赞美我基督般事迹的颂词。尽管自颂美德有失体面，但亲近之人仍愿将我的虔诚之名传遍所有[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]耳中。\n\n如此一来，传言或将四起——称我是那最有资格登上圣伯多禄宝座的[ROOT.Char.GetWomanMan]……乃至更远。"
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "对[Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)]的#V 选举分数提高#!：#P +30#!或提高[canonization|E]概率"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "选择其一：\n\t$EFFECT_LIST_BULLET$花费[piety|E]#V 提高对[praise_worthy_priest_superior_title.GetName]的选举分数#!\n\t$EFFECT_LIST_BULLET$提高你在未来[canonization|E]的概率"
