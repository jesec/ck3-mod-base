 pam_bull_events.0004.desc.crusade: "我敦促你们所有人，去对抗[title.GetName]的异教徒。"
 pam_bull_events.0004.desc.heresy: "宣告全体信徒，[heresy_rite.GetName]如今被革出教门，其追随者皆为异端。"
 pam_bull_events.0004.desc.tenet_permitted: "“你们中信奉[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]者当知晓，[bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip]如今已对此颁下许可。”"
