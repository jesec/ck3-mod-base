 consecrated_king_modifier: "第一任受祝圣君主"
 consecrated_king_modifier_small: "$consecrated_king_modifier$"
 consecrated_king_modifier_desc: "一个神圣的王国建立，使该角色成为君主。其权柄直接源于神授。"
 consecrated_king_modifier_small_desc: "$consecrated_king_modifier_desc$"
 pam_decision_events.0030.b.decline: "[religious_authority.GetTitleAsName]斥责你的王国"
 pam_decision_events.0030.opening: "至圣[Select_CString( religious_authority.IsFemale, '圣母', '圣父' )|U]，"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName]仅拣选少数人，作为[ROOT.Char.GetFaith.HighGodHerHis|U][religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip]子民的高贵守护者，即那些治理[ROOT.Char.GetFaith.HighGodNameSheHe|U]赐予凡世之美好疆土的君王。\n\n我恳请成为那蒙福少数中的一员。创建一个[king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]王国，我将守护它抵御一切邪恶。"
 pam_decision_events.0030.a: "一个新的[religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip]王国就此被祝圣。"
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName]对你没有如此规划，[king_aspirant.GetFirstNameNoTooltip]……"
 pam_decision_events.0031.t: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip][ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 pam_decision_events.0031.desc.self_crowning: "哪片土地能比[ROOT.Char.GetPrimaryTitle.GetNameNoTier]更蒙受祝福？哪个封地更值得王权的庇佑？[ROOT.Char.GetFaith.WarGodName]难道未曾守护其子民免受灾祸，并在疆界内保全我的神圣宝座？\n\n我行使[ROOT.Char.GetFaith.HighGodNamePossessive]的意志，已祝圣[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip][ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]。我已使自己成为这片土地的神圣守护者，从今以后，我的旨意再不容轻慢。\n\n封臣与信徒们——俯首躬身！虔诚的[religious_authority.GetFaith.GetReligion.GetAdherentNamePlural]当懂得尊崇他们的[ROOT.Char.GetTitleAsName]。"
 pam_decision_events.0031.desc_three_duchies: "奉[religious_authority.GetTitledFirstNamePossessiveRegnal]之诏令，我的国土井然有序，如同苍穹中轮转不息的星辰。由[duchy_1.GetName]、[duchy_2.GetName]与[duchy_3.GetName]，组成一个蒙福且统一的[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]。\n\n并且，从一位正义而高尚的灵魂中，诞生了一位新的[ROOT.Char.GetTitleAsName]！我因[religious_authority.GetTitleAsNamePossessiveNoTooltip]的授命而升格，如今遵循[religious_authority.GetHerHis]的路线引领民众前行。"
 pam_decision_events.0031.desc: "奉[religious_authority.GetTitledFirstNamePossessiveRegnal]之诏令，一个新[ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]的名号已载入史册。[ROOT.Char.GetFaith.PriestNeuterPlural]与民众将我高举，齐声颂扬！只要[ROOT.Char.GetPrimaryTitle.GetNameNoTier]仍未被异教徒与异端夺取，我将永远是它合法的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetTitleAsName]。\n\n[religious_authority.GetTitleAsNameNoTooltip]，我的创造者，确实已赐福于这个普通的国度……并且必将对我的君主作为投以关切的目光。"
 pam_decision_events.0031.a: "愿[ROOT.Char.GetFaith.HighGodName]永远爱我的[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]。"
 any_landed_duchy_title_tt: "你持有的至少一个[duchy|E]是[landed|E][title|E]#weak #EMP （不是[clerical_region|E]或[noble_family|E]）#!#!"
