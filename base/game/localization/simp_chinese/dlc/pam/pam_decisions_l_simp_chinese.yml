 pam_decision_events.0003.mystic: "[target_child.GetShortUIName]对此事产生了浓厚的兴趣"
 pam_decision_events.0003.learning: "[target_child.GetShortUIName]增长了[target_child.GetHerHis]的知识"
 pam_decision_events.0003.education: "[target_child.GetShortUIName]提升了[target_child.GetHerHis]所受的教育"
