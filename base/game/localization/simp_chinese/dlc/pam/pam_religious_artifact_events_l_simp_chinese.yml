l_simp_chinese:
 pam_religious_artifact_events.0001.t: "神圣伟业"
 pam_religious_artifact_events.0001.desc: "“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，”我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))][inspiration_owner.GetFirstName]微笑着步入厅堂，开口说道：“我在梦中蒙受了[ROOT.Char.GetFaith.HighGodName|U]的启示！”\n\n“我窥见一件华美圣物，用料都是稀世宝石，经巧手精心雕琢，专以供奉独一的[ROOT.Char.GetFaith.HighGodName|U]。如果你能拨付我需的财力与物资，我必将为你带回一件绝伦至宝，足以令每一位[ROOT.Char.GetTitleAsNameNoTooltip]惊叹！”\n\n真是个大胆的承诺，而凡人得享[ROOT.Char.GetFaith.HighGodName|U]启示的机会又多罕有？"
 pam_religious_artifact_events.0001.aa: "听起来你倒梦想着让我松开钱袋！"
 pam_religious_artifact_events.0001.a: "我的虔诚是无限的！"
 pam_religious_artifact_events.0001.b: "[ROOT.Char.GetFaith.HighGodName|U]不需要饰品。"
 pam_religious_artifact_events.0002.desc: "我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))][inspiration_owner.GetFirstName]邀我前往城堡礼拜堂。当[inspiration_owner.GetSheHe]满怀骄傲，将那件我日夜期盼的订制品呈于眼前时，一切即刻明了。\n\n[newly_created_artifact.GetDesc]"
 pam_religious_artifact_events.0002.a: "干得好，[inspiration_owner.GetFirstNameNoTooltip]！"
 create_artifact_religious_artifact_tooltip: "[inspiration_owner.GetShortUIName]打造了做工[SCOPE.Custom('ArtifactQuality')]的[newly_created_artifact.GetName]"
