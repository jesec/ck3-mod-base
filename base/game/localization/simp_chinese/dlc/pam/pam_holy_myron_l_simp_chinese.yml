 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "为婴儿傅油"
 pam_holy_myron_unction_toast: "为病人傅油"
 pam_holy_myron.0300.t: "圣神印记"
 pam_holy_myron.0300.desc: "我的[child.Custom('GetDaughterSon')][child.GetFirstName]在[myron_officiant.GetFaith.PriestNeuter]的怀中哭号，圣油被呈上前来。\n\n教会为每一个新生儿备有足够的祝圣之油——但我自己的瓶装圣膏就在伸手可及之处，只需一滴闪亮的圣油，便足以为这孩子留下终身的印记。"
 pam_holy_myron.0300.desc_twin: "\n\n不止一个额头，而是两个——襁褓中的[pam_myron_twin.GetFirstName]，躺在[pam_myron_twin.GetHerHis]的孪生同胞身旁，等待接受同样的印记。"
 pam_holy_myron.0300.a: "教会的圣油就足够了。"
 pam_holy_myron.0300.b: "只有圣膏才够格。"
