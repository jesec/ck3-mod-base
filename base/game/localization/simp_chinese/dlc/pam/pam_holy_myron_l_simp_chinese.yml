l_simp_chinese:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "瓶装圣膏"
 pam_holy_myron_artifact_desc_common: "一个带瓶塞的容器，盛装着祝圣过的圣油：用[Glossary('犹大香料','pam_myron_gloss_balsam')]浸于纯橄榄油中，并将上一批圣油中的一滴掺入新油，使祝福的链条绵延不绝，一路上溯至宗徒。"
 pam_holy_myron_artifact_desc_masterwork: "一个带瓶塞的容器，盛装着祝圣过的圣油：用[Glossary('犹大香料','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]和[Glossary('没药','pam_myron_gloss_myrrh')]浸于纯橄榄油中，并将上一批圣油中的一滴掺入新油，使祝福的链条绵延不绝，一路上溯至宗徒。"
 pam_holy_myron_artifact_desc_famed: "一个带瓶塞的容器，盛装着祝圣过的圣油：用[Glossary('犹大香料','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]、[Glossary('没药','pam_myron_gloss_myrrh')]、[Glossary('甘松','pam_myron_gloss_spikenard')]和[Glossary('肉桂','pam_myron_gloss_cinnamon')]浸于纯橄榄油中，并将上一批圣油中的一滴掺入新油，使祝福的链条绵延不绝，一路上溯至宗徒。"
 pam_holy_myron_artifact_desc_illustrious: "一个带瓶塞的容器，盛装着祝圣过的圣油，以完全忠实于最古老配方的方式调配而成：用[Glossary('犹大香料','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]、[Glossary('没药','pam_myron_gloss_myrrh')]、[Glossary('甘松','pam_myron_gloss_spikenard')]、[Glossary('肉桂','pam_myron_gloss_cinnamon')]、[Glossary('香蒲','pam_myron_gloss_calamus')]和[Glossary('桂皮','pam_myron_gloss_cassia')]浸于纯橄榄油中，并将上一批圣油中的一滴掺入新油，使祝福的链条绵延不绝，一路上溯至宗徒。"
 pam_holy_myron_charges_line: "圣膏剩余：#V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "犹大的著名香料：一种芳香树脂，从一种死海边的耶里哥和恩革底种植的低矮灌木上渗出。它是古代世界最昂贵的香水，每一滴都弥足珍贵。它是圣油的核心成分，被严加看守的树丛别处无有。"
 pam_myron_gloss_frankincense: "一种金色树脂，从阿拉伯南部枝节多瘤的树木上采集，举世难求。自古以来，它就在祭台前燃烧，香气随着烟火袅袅升起，伴随着祈祷声传向天际，为圣油增添了芬芳。"
 pam_myron_gloss_myrrh: "一种味道苦涩、色暗如血的树脂，从阿拉伯南部和非洲之角的荆棘树种流出。它在《出谷纪》中被列为配制傅礼用圣油的材料之一，曾被三贤士献给圣婴，也被信徒带到祂的坟墓前。"
 pam_myron_gloss_spikenard: "一种浓郁芬芳的油脂，从一种仅生长于东部山区的植物根部榨出，被运至印度的港口。主在伯达尼受傅时用的即是这种拿尔多香液，其昂贵的价格令门徒震惊。"
 pam_myron_gloss_cinnamon: "印度及域外岛屿树木芳香的内皮，在《出谷纪》中被列为配制傅礼用圣油的材料之一。它穿越了半个世界，才抵达基督教的祭台。"
 pam_myron_gloss_calamus: "《圣经》中的菖蒲：一种从远东沼泽中采集的芳香芦苇，在《出谷纪》中被列为配制傅礼用圣油的材料之一。"
 pam_myron_gloss_cassia: "一种较肉桂更为粗糙的近亲，从遥远东方的树木上剥下，在《出谷纪》中被列为配制傅礼用圣油的材料之一。"
 ### Modifiers
 pam_holy_myron_vessel_modifier: "圣膏容器"
 pam_holy_myron_vessel_modifier_desc: "该容器盛放着祝圣过的圣油，[Glossary('犹大香料','pam_myron_gloss_balsam')]的香气使其守护者神圣化。"
 pam_holy_myron_vessel_potent_modifier: "强效圣膏容器"
 pam_holy_myron_vessel_potent_modifier_desc: "该容器盛放着效力罕见的圣油，里面充满了[Glossary('乳香','pam_myron_gloss_frankincense')]和[Glossary('甘松','pam_myron_gloss_spikenard')]；光是它的香气就显现出圣德。"
 pam_chrismated_artifact_modifier: "傅油"
 pam_chrismated_artifact_modifier_desc: "该宝物已傅过圣膏，[Glossary('没药','pam_myron_gloss_myrrh')]的香气仍萦绕其上。"
 pam_chrismated_regalia_modifier: "傅油礼器"
 pam_chrismated_regalia_modifier_desc: "该宝物在加冕礼中沾染过圣膏，祝福并没有衰退。"
 pam_holy_myron_pilgrim_modifier: "香料携带者"
 pam_holy_myron_pilgrim_modifier_desc: "该角色踏上旅途寻找圣膏的原料——[Glossary('犹大香料','pam_myron_gloss_balsam')]、[Glossary('乳香','pam_myron_gloss_frankincense')]及更稀有之物——途中绝不冒险。"
 pam_chrismated_child_modifier: "傅油"
 pam_chrismated_child_modifier_desc: "该角色在出生后不久便被傅油，在祝圣的油膏中领受了圣神的印记与恩赐。"
 pam_myron_chrismated_child_modifier: "以圣膏傅油"
 pam_myron_chrismated_child_modifier_desc: "该角色在出生后不久便被以圣膏傅油——[Glossary('犹大香料','pam_myron_gloss_balsam')]涂抹在初生的额头上——这是一次永不褪去的膏抹。"
 pam_anointed_with_holy_oil_modifier: "受傅油"
 pam_anointed_with_holy_oil_modifier_desc: "该角色已领受病人傅油礼：带着[Glossary('犹太香料','pam_myron_gloss_balsam')]香气的甜油被涂在额头和手上，在这场试炼中为身体和灵魂提供力量。"
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "准备圣膏"
 pam_prepare_holy_myron_decision_tooltip: "派你的[court_chaplain|E]去收集稀有香料，祝圣一件#V 瓶装圣膏#!，这是可用于神圣傅油的[artifact|E]"
 pam_prepare_holy_myron_decision_desc: "圣膏并非由厨房中随意可得的物品混合而成。《圣经》指定了其用料——[Glossary('没药','pam_myron_gloss_myrrh')]、甘甜的[Glossary('肉桂','pam_myron_gloss_cinnamon')]、[Glossary('香蒲','pam_myron_gloss_calamus')]与[Glossary('桂皮','pam_myron_gloss_cassia')]，配以纯净橄榄油——每一种都必须从其生长的土地上采得。\n\n这次旅途走得越远，带回来的祝圣原料就越丰富。但漫漫长路充满艰辛险阻——盗匪与热病可能降低原料质量，或夺去其携带者的生命。"
 pam_prepare_holy_myron_decision_confirm: "派出队伍"
 pam_prepare_holy_myron_decision_needs_chaplain: "你的[court_chaplain|E]必须是未在旅行的可用成年人"
 pam_prepare_holy_myron_decision_already_owned: "你不能已经拥有瓶装圣膏"
 pam_prepare_holy_myron_decision_journey_underway: "你的[court_chaplain|E]已经在收集香料"
 pam_prepare_holy_myron_decision_levant_name: "犹大香料"
 pam_prepare_holy_myron_decision_levant_desc: "你的[court_chaplain|E]将在#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!收集[Glossary('犹大香料','pam_myron_gloss_balsam')]——一个目的地，简单的混合。\n\n生成一件[common|E]瓶装圣膏。"
 pam_prepare_holy_myron_decision_arabia_name: "犹大香料和乳香"
 pam_prepare_holy_myron_decision_arabia_desc: "你的[court_chaplain|E]将在#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!收集[Glossary('犹大香料','pam_myron_gloss_balsam')]，然后在#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!收集[Glossary('乳香','pam_myron_gloss_frankincense')]和[Glossary('没药','pam_myron_gloss_myrrh')]——香料之路上的两个目的地。\n\n生成一件[masterwork|E]瓶装圣膏。"
 pam_prepare_holy_myron_decision_india_name: "所有神圣材料"
 pam_prepare_holy_myron_decision_india_desc: "你的[court_chaplain|E]将在#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!收集[Glossary('犹大香料','pam_myron_gloss_balsam')]，在#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!收集[Glossary('乳香','pam_myron_gloss_frankincense')]和[Glossary('没药','pam_myron_gloss_myrrh')]，在#V [GetTitleByKey('c_kerala').GetNameNoTier]#!收集[Glossary('甘松','pam_myron_gloss_spikenard')]和[Glossary('肉桂','pam_myron_gloss_cinnamon')]，这是一段漫长的旅途。\n\n生成一件[famed|E]瓶装圣膏。如果你的[court_chaplain|E]忠实地遵循旧配方——有#V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!概率，受[ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis]的[learning|E]修正——升级为[illustrious|E]。"
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "你必须能支付[gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V][gold|E]"
 pam_prepare_holy_myron_decision_afford_india_tt: "你必须能支付[gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V][gold|E]"
 pam_prepare_holy_myron_journey_toast: "收集圣膏原料的队伍出发"
 pam_prepare_holy_myron_journey_toast_tt: "你的[court_chaplain|E]开始收集圣膏的原料"
 pam_prepare_holy_myron_decision_levant_effect_tt: "你的[court_chaplain|E]出发前往#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!。返回时，一件[common|E]瓶装圣膏将被祝圣——如果一路平安的话。"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "你的[court_chaplain|E]出发前往#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!和#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!。返回时，一件[masterwork|E]瓶装圣膏将被祝圣——路上的匪患和厄运可能会使其质量降低。"
 pam_prepare_holy_myron_decision_india_effect_tt: "你的[court_chaplain|E]出发前往#V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!、#V [GetTitleByKey('c_dhofar').GetNameNoTier]#!和#V [GetTitleByKey('c_kerala').GetNameNoTier]#!。返回时，一件[famed|E]瓶装圣膏将被祝圣，并且有#V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!概率升级为[illustrious|E]——路上的匪患和厄运可能会使其质量降低。"
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]，"
 pam_holy_myron.0011.desc_levant: "我从盐海之滨写下此信。在那里，[Glossary('犹大香料','pam_myron_gloss_balsam')]从割裂的树皮中渗出，如同金色的泪滴。种植者要价甚高，但那树脂是真品——仅需一滴沾于腕间，便足以使满室生香。第一样原料已经入手。"
 pam_holy_myron.0011.desc_arabia: "香料之路十分漫长，离很远才有一处水井，但佐法尔已赐予我们所求之物：[Glossary('乳香','pam_myron_gloss_frankincense')]如晨冰般苍白，[Glossary('没药','pam_myron_gloss_myrrh')]如旧血般深暗。此地的商队首领们说，世间最上等的树脂仅存于此。我信了他们，并支付了价钱。"
 pam_holy_myron.0011.desc_india: "渡海考验着船上每一个人的灵魂，但马拉巴尔海岸的市场藏着奇珍异宝：来自高山的[Glossary('甘松','pam_myron_gloss_spikenard')]，以及我所知最甜美的[Glossary('肉桂','pam_myron_gloss_cinnamon')]。最后的原料已在手中。我们调转船头，准备返乡。"
 pam_holy_myron.0011.a: "愿接下来一路顺风。"
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]，厄运降临，"
 pam_holy_myron.0012.desc: "前方隘口被一群武装人员封锁。他们自称收费员，尽管从未有任何君主授予过他们这项权利。他们清点了我们的箱笼，知道其价值所在——只要我们肯付一笔钱，他们便会放我们通过，不予抢夺。\n\n我等待你的吩咐，并将香料放在身边。"
 pam_holy_myron.0012.a: "付钱吧。圣油比钱更有价值。"
 pam_holy_myron.0012.b: "教会的钱不是给土匪的。"
 pam_holy_myron.0012.b.tt: "收集的香料将被抢夺，最后一批圣膏的质量将#N 降低#!"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]，"
 pam_holy_myron.0013.desc: "在途中，一场热病将我击倒。我提笔时双手颤抖，旅店老板娘给了我三种偏方，发誓有用，但这些药一味比一味难闻。不必为香料担心——它们已经干制封存，保管得比我还周全。只要能站起身，我便继续赶路。"
 pam_holy_myron.0013.a: "我会为[myron_chaplain.GetHerHim]祈祷。"
 pam_holy_myron_journey_abandoned_toast: "圣膏之行被放弃"
 pam_holy_myron.0020.t: "旅途结束"
 pam_holy_myron.0020.desc: "一位商人带来了消息：我派去收集圣膏原料的[myron_chaplain.GetTitledFirstName]，已在远离家乡的地方去世。香料落入陌生人手中，我的钱币与[myron_chaplain.GetHerHis]的辛劳，终究未能换来圣油。"
 pam_holy_myron.0020.a: "愿[ROOT.Char.GetFaith.HighGodName]赐[myron_chaplain.GetHerHim]安息。"
 pam_holy_myron.0100.t: "祝圣圣膏"
 pam_holy_myron.0100.desc.intro: "风尘仆仆的[myron_chaplain.GetTitledFirstName]终于回到我身边，宫廷人员还没来得及看清来人，便已闻到了货物散发的气味。在紧闭的门后，圣油被调和，一滴旧油融入新油之中——正如宗徒时代以来代代相传的做法。\n\n"
 pam_holy_myron.0100.desc_full: "所有原料都完好无损地运回。芳香的金色成品圣油被倒入瓶中，供奉在我的祭坛前。"
 pam_holy_myron.0100.desc_robbed: "路途上损失了许多原料，调和的圣油比我期望的更为稀薄——然而祝圣将使旅途中损耗的一切得以完整，圣油瓶仍被供奉在我的祭坛之前。"
 pam_holy_myron.0100.a: "祝福的链条仍然没有断开。"
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "最后的傅油"
 pam_holy_myron.0200.desc: "当我走近灵柩时，哀悼者们纷纷让开道路，[pam_holy_myron_artifact.GetName]被人捧在我身前。在满朝聚集的众人注视下，用圣油在逝者额头画一个十字，就能让[deceased.GetTitledFirstName]以受膏者的身份，出现在[ROOT.Char.GetFaith.HighGodName]的宝座前——这是在场每一个灵魂都能亲眼见证并传颂的殊荣。而我花在死者身上的每一滴，都是生者永远见不到的。"
 pam_holy_myron.0200.a: "为[deceased.GetFirstNameNoTooltip]傅油。"
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#!封圣后将获得更高的尊崇"
 pam_holy_myron.0200.b: "圣油是给活人的。"
 pam_holy_myron.0200.b.tt: "你为那些仍能受赐福者保管着圣油"
 ### Spending the oil
 pam_holy_myron_spend_tt: "花费一次瓶装圣膏使用次数"
 pam_holy_myron_spend_last_tt: "花费#N 最后#!一次瓶装圣膏使用次数——空瓶将#N 丢失#!"
 pam_holy_myron_vessel_spent_toast: "圣瓶干涸"
 pam_holy_myron_vessel_spent_tt: "最后一滴圣油倾尽，容器也将不在使用"
 ### Coronation
 pam_holy_myron_coronation_option: "让圣膏为王冠施印封圣。"
 pam_holy_myron_coronation_option.flavor: "将圣油用一次在自己的傅油礼上"
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\n在加冕礼上，它曾以圣油涂抹，至今仍承载着神圣的祝福。"
 pam_holy_myron_coronation_memory: "被以圣膏傅油"
 pam_holy_myron_coronation_memory_desc: "在我的加冕礼上，[anointer.GetTitledFirstName]以圣膏为我傅油。"
 pam_holy_myron_coronation_memory_desc_second_perspective: "在你的加冕礼上，[anointer.GetTitledFirstName]以圣膏为你傅油。"
 pam_holy_myron_coronation_memory_desc_third_perspective: "[owner.GetTitledFirstName]在[owner.GetHerHis]的加冕礼上被以圣膏傅油。"
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "使用圣膏为宝物傅油"
 pam_anoint_artifact_decision_tooltip: "花费一次圣膏使用次数，为你的一件[artifacts|E][sanctified|E]，无论你的信条是否允许。"
 pam_anoint_artifact_decision_desc: "圣膏无需征得神职人员的许可。凡它所触及之物——刀剑、书卷或饰物——都会因油本身而被[sanctified|E]，[ROOT.Char.GetFaith.GetName]任何信条或主教都无法反对。"
 pam_anoint_artifact_decision_confirm: "傅油"
