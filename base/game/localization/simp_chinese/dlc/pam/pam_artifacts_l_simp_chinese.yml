l_simp_chinese:
 artifact_pedestal_bible_name: "$artifact_name_prefix$圣经"
 artifact_pedestal_bible_description: "一本带珠宝封皮的彩绘圣经，每一节经文都靠耐心、虔诚的手工抄写完成。"
 artifact_pedestal_thurible_name: "$artifact_name_prefix$提炉"
 artifact_pedestal_thurible_description: "一个挂在打磨光亮的链条上的精致香炉——点燃时，它使满室飘散袅袅香烟，把祈祷带上天空。"
 artifact_pedestal_situla_name: "$artifact_name_prefix$圣水盂"
 artifact_pedestal_situla_description: "一个装饰华丽的圣水容器，用于游行时向信徒洒下祝福。"
 artifact_pedestal_crozier_name: "$artifact_name_prefix$牧杖"
 artifact_pedestal_crozier_description: "一根主教的牧杖，制成牧羊人曲杖的样式，用来引导信众，鞭策迷途的人。"
