l_simp_chinese:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName]横跨诸多国度，由无数语言、文化各异的民族组成，纷争亦随之而生。\n\n教义分歧自教会诞生之初便已存在，而在这灾祸的末世，瘟疫肆虐、战火连绵、异端横行，信徒间的合一正经受严峻考验。\n\n正如使徒[st_paul.GetName]曾劝导格林多信徒坚守合一，如今全体[christians|E]也应当遵从[st_paul.GetHerHis]的教导，谨记“[Glossary( '在你们中不要有分裂', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]”。如若不然，我们必将深陷异端泥潭，沦为敌基督肆意玩弄的棋子。\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "我们那些软弱的邻居——[christians|E]们，信奉着一个虚弱又善妒的神，像幼孩般为手中玩偶的本质而争吵不休。与此同时，他们的警惕已经迟钝，他们的刀剑正忍饥挨饿——毕竟太久未尝过真正的血腥滋味了。\n\n他们企图派遣传教士踏入我们的土地，散播软弱的教义。我们何不也去拜访一番，洗劫他们的教会宝库！以我们为例，他们或许能再次学会强大。"
 pam_the_christian_church.0051.desc.heathen_rulers: "我们的[christian|E]邻居是一群粗野、好斗的民族。他们如同水底的淤泥，是[ROOT.Char.GetFaith.HighGodName]信众的拙劣反面。他们固守着腐朽的旧观念，虚妄的信仰终将把他们引向毁灭。\n\n他们的财富尽管微薄，但尽可肆意夺取。他们的臣民散漫无序，已经到了该被征服的时候。"
 pam_the_christian_church.0051.desc.heretic_rulers: "[st_peter.GetName]宗座上那头蠢驴，会把真心信主的人打成异端。哪怕基督再临，他也会当个法利塞人，再次喊着把主钉上十字架。\n\n看看我们这些奉基督为主的人，内部分裂成什么样子！罗马的伪祭司，正是这一切乱象的始作俑者。\n\n这个撒旦的僭代者，一心要置我们于死地。为了所有[christians|E]的救赎，必须剜除这信仰的恶疮！"
 pam_the_christian_church.0051.desc.western: "随着罗马主教权势的日渐式微，在最后审判即将来临之时，我们务必弥合信仰中出现的这些裂痕。"
 pam_the_christian_church.0051.desc.eastern: "被基督之敌四面围困，我们在临近最后审判之时，必须寻求与罗马主教共同的立场。"
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\n会议已允许君主自由罢免教会任命的主教。"
 pam_the_christian_church.0051.desc.oriental_orthodox: "“[Glossary( '由天主圣言降生的唯一性体', 'MIAPHYSITISM_GLOSS' )]”。末日审判日益临近，我们必须引领迷途的弟兄姊妹，重回真理的圣光之下。"
 pam_the_christian_church.0051.a: "基督为吾等引路！"
 pam_the_christian_church.0051.b: "必须密切关注这些基督徒的动向。"
 MIAPHYSITISM_GLOSS: "#bold “由天主圣言降生的唯一性体！”#!公元431年，亚历山大里亚圣济利禄于厄弗所大公会议中宣告此论。这一观点被称作基督合性论，为东方正统教会所广泛遵循。"
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "阴霾笼罩着[GetSituation('the_christian_church').GetTopSubRegion.GetName]，斥责的呼声在黑暗中响起。\n\n#EMP “罗马已经堕落，沦为现世的索多玛！”#!\n\n#EMP “教宗既当皮条客，也当娼妓！”#!\n\n即便是心性温和之人，也不得不承认：教会正深陷空前危机，信仰的变革势在必行。"
 pam_the_christian_church.0052.desc.unreformed_pagan: "我们的弱邻，那些意志薄弱的[christians|E]们正在哭喊——“我们的末日近了！教宗残暴得全如一名异教徒！”\n\n至少其中有一句是属实的。让我们亲手为他们实现口中的末日！"
 pam_the_christian_church.0052.desc.heathen_rulers: "“我们的教会崩坏了！”[christians|E]们奔走哀嚎着。\n\n他们能认清这一点是好的，尽管我们一直心知肚明。这群盲从虚妄的庸人，终有一日需要效仿我们，皈依[ROOT.Char.GetFaith.HighGodName]的正道。\n\n他们的财富尽管微薄，但尽可肆意夺取。他们的臣民散漫无序，已经到了该被征服的时候。"
 pam_the_christian_church.0052.desc.heretic_rulers: "这个身披圣伯多禄祭衣的敌基督，必须有人制止！"
 pam_the_christian_church.0052.desc.western: "变革必须先在罗马发生，唯有如此，[GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip]方能愈合。"
 pam_the_christian_church.0052.desc.eastern: "被基督之敌四面围困，我们必须清除罗马内部的腐化，否则就会被其吞噬。"
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "愿主照亮我们前路！"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "我们理当为传教事业的伟大进展而欣喜！异教徒的野蛮人开始学会踏上基督之道，[GetSituation('the_christian_church').GetTopSubRegion.GetName]的信仰疆域亦随之不断扩张。\n\n遗憾的是，并非所有人都愿接纳教会的指引。无需忧虑，如果他们拒绝我们的传教士，他们将在锋刃上学会我们的祷文！\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "[christians|E]带着他们的神职者来到我们的土地。若我们赶走他们，他们下次便会持剑而来。\n\n我们当中许多人仍坚守着[ROOT.Char.GetFaith.HighGodName]的道路，却也有些人看出侍奉这位人神、这位基督的益处。统治者的权力可由此获得神圣认可，教会可充当往来信使，而最令人心动的是——他们会负责征税。"
 pam_the_christian_church.0053.desc.heathen_rulers: "我们的[christians|E]邻居正强行逼迫偶像崇拜者改信，而在他们眼里，这些人原只配遭受屠戮。\n\n趁着他们的刀剑还没对准我们，[ROOT.Char.GetFaith.HighGodName]为我们降下了可乘之机。他们的财富尽管微薄，但尽可肆意夺取。他们的臣民散漫无序，已经到了该被征服的时候。"
 pam_the_christian_church.0053.desc.heretic_rulers: "罗马的伪装者，正妄图将异教徒引向其扭曲的信仰！这个敌基督早已不满足于毒害全体[christians|E]的心智，更怀着扭曲的贪欲，要将懵懂无知的拜偶像者一同拖入他邪祟的怀抱。"
 pam_the_christian_church.0053.desc.western: "我们必须谨慎引导这些新生的基督徒去敬拜[ROOT.Char.GetRite.GetName]，正如圣伯多禄宗座所认可的那样。"
 pam_the_christian_church.0053.desc.eastern: "尽管罗马声称只寻求让[GetSituation('the_christian_church').GetTopSubRegion.GetName]之外的人皈依，但我们仍需保持警惕，以防他们夺走我们的[ROOT.Char.GetRite.GetName]，或者更糟糕，将他们刚沾满异教徒鲜血的刀剑，转向他们自己的信友。"
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName]面临着艰巨的任务，但教会并非不可挽救。\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\n然而，教会依旧存有救赎的机会！\n\n"
 pam_the_christian_church.0054.desc.intro.common: "我们对天主的信仰从未动摇，但无数民众早已对教会心生失望。昔日的神职人员以效仿基督的善行作为表率，如今却丧失了绝大部分自主权，沦为皇帝与国王们操控权势的爪牙。"
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural]正在撕扯自己的祭衣，指望他们的神注意不到那些补丁。当他们忙于修补祭披与编年史时，或许便无暇派出更多神职人员来骚扰我们的圣林与河畔祠庙了。"
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural]正在排演一场关于律法与祭坛的大革新，每一派都宣称要以更纯粹的方式侍奉那位受难的神。我们大可以记下他们的新口号，但我们的斧刃仍旧比他们的宗教会议回答得更直白。"
 pam_the_christian_church.0054.desc.heretic_rulers: "罗马的宗派分子如今竟为所谓改革而争论不休！他们所谓的托古革新，不过是将同一套枷锁重新排列，又被更致命的自以为义所收紧。让他们在自己的大殿里先把头颅砸破吧，然后他们会来惦记我们的。"
 pam_the_christian_church.0054.desc.western: "尽管有人将这种拨乱反正的举措称为“改革”，但鉴于民众对革新心存戒备，不如将其表述为“回归古道”，或许更易为世人所接纳。"
 pam_the_christian_church.0054.desc.eastern: "罗马，或者说任何一个自诩为普世仲裁者的教廷机构，都在费力地打磨自己的礼仪：新的教规、新的誓言、对古老罪恶新的斥责。我们注视着，我们驳斥着，我们也在巩固着我们自己的宗教会议，唯恐西方的节制被误认为是一种普世的枷锁。"
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\n会议已决定支持教会的终身任命权。"
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\n世俗君主强迫[christianity.GetReligiousHeadTitle.GetNamePossessive|U]属下的主教们向其宣誓效忠，仿佛圣职任命不过是另一块可供出租的田产。与此同时，[christianity.GetReligiousHeadTitle.GetName]禁止那些加冕之手祝圣他们未曾祝圣过的主教冠。\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\n没有无可置疑的牧者，每一个王座便自行塑造自己的主教；祭袍固然神圣，但祝圣仪式中弥漫的却是钱币而非乳香的气味。\n\n"
 pam_the_christian_church.0055.desc.intro.common: "在整个[GetSituation('the_christian_church').GetTopSubRegion.GetName]中，祭坛与王座之间的宿怨已不再是空穴来风的流言蜚语。"
 pam_the_christian_church.0055.desc.unreformed_pagan: "当[christianity.GetAdherentNamePlural]为究竟是王冠还是祭披才能祝圣主教而争执不休时，投向我们的传教士目光便少了几分。让国王与教宗彼此在文书中相互掣肘吧——他们的分裂使我们的圣林更加安宁。"
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "罗马高喊着叙任权暴政，但若它能抓得住绳索，同样会将镣铐加于我们的教师身上！你们这些法利赛人，先折断自己的项圈，再来教训我们吧！"
 pam_the_christian_church.0055.desc.western: "若我们将牧杖过于偏向于世俗的权杖，二者甚至可能混为一谈。\n\n"
 pam_the_christian_church.0055.desc.eastern: "西方的国王们因权戒与牧杖与罗马争吵，他们罪恶的行径玷污了整个教秩。\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "在整个[GetSituation('the_christian_church').GetTopSubRegion.GetName]，信徒们呼吁解放圣墓。十字架被打磨以利行军，圣物被典当以充军资。\n\n热忱燃烧着激情，但若这狂热冷却，信仰的炽烈将凝结为怀疑——其速如同灰烬飘离火堆。\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "他们的战争鼓吹者高呼十字军，却荒废了自家的土地；就让罗马人在遥远的沙丘上耗尽自身吧。"
 pam_the_christian_church.0056.desc.western: "在布道无法触及的异域，刀剑却能够抵达。\n\n"
 pam_the_christian_church.0056.desc.eastern: "西方的军队正向圣地进发。\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$——[GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$，在[christianity.GetReligiousHeadTitle.GetNamePossessive|U]细心的注视下。\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$。\n\n即使没有一个无可争议的牧羊人，信仰也必然会回归理性。\n\n"
 pam_the_christian_church.0057.desc.intro.common: "教会的争吵停止了。[GetSituation('the_christian_church').GetTopSubRegion.GetName]迎来了一个和平与共融的时代。"
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "学院中可以堆积一个又一个论据，但大多数灵魂仍然通过司祭的话语来领悟神。\n\n我们不可忘记，我们的宗教是属于万民的。"
 pam_the_christian_church.0057.desc.eastern: "我们仍在以咏唱举心祈祷，而西方的书案却因沉重的论著而吱呀作响。协和固然值得欢迎，但他们的学派争论不应踱步进入我们的文牍与公案。"
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "召集会议"
 pam_the_christian_church.0058.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]的漫长时间终于迎来高潮。一场会议被召集，旨在彻底裁定由谁授予神职人员圣职：是教会还是王权。"
 pam_the_christian_church.0058.a: "需要决定下来。"
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "会议召开"
 pam_the_christian_church.0059.desc.located: "诏书已发出，教会的神父们如今聚集于[investiture_convene_host.GetTitledFirstName]在[investiture_convene_location.GetName]召开的叙任权会议。会议的裁决将决定整个基督教世界：授权神职的究竟是教会还是王权。"
 pam_the_christian_church.0059.desc: "诏书已发出，教会的神父们如今聚集于叙任权会议。会议的裁决将决定整个基督教世界：授权神职的究竟是教会还是王权。"
 pam_the_christian_church.0059.a: "让他们商议吧。"
 pam_the_christian_church_not_hof_trigger_tt: "你不是信仰领袖"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "教会即将召开特别会议，以决定你[faith|E]的下一项神职人员的任命[doctrine|E]。"
 pam_the_christian_church.0060.t: "在你们中不要有分裂"
 pam_the_christian_church.0060.desc: "基督教世界正悬于刀锋之上。[schism_mainline_rite.GetName]宣称承继了宗徒的统绪，而[schism_competitor_rite.GetName]亦决不让步。\n\n基督曾警告说，[Glossary( '凡一国自相纷争，必成废墟', 'MATTHEW_12_25_LATIN_GLOSS' )]。若在这场危机中任由伤口溃烂，教会或许将再也无法维持一致。"
 pam_the_christian_church.0060.a: "我支持[schism_mainline_rite.GetNameNoTooltip]。"
 pam_the_christian_church.0060.a.tt: "促进[GetDecisionWithKey('pam_cause_great_schism_decision').GetName][decision|E]"
 pam_the_christian_church.0060.b: "我支持[schism_competitor_rite.GetNameNoTooltip]。"
 pam_the_christian_church.0060.b.tt: "促进[GetDecisionWithKey('pam_cause_great_schism_decision').GetName][decision|E]"
 pam_the_christian_church.0060.c: "一副身躯必须有两条手臂。"
 pam_the_christian_church.0060.c.tt: "促进[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName][decision|E]"
 pam_the_christian_church.0061.t: "大分裂"
 pam_the_christian_church.0061.desc: "[schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]使节已在圣坛前宣判：\n\n“愿那伪[schism_eastern_faith.ReligiousHeadName][schism_eastern_faith.GetReligiousHead.GetFirstName]，以及他的一切追随者，皆受弃绝。[Glossary( '吾主，来吧', 'MARANATHA_GLOSS' )]，惩罚一切异端！不，是惩罚魔鬼及其使者，除非他们悔改。”\n\n“此不敬之文，与其编纂者、执笔者及一切经手之人，同受弃绝。”[schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip]回应道。\n\n信众就此分裂为[schism_western_faith.GetAdherentNamePlural]与[schism_eastern_faith.GetAdherentNamePlural]。我的灵魂如今归于[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]。"
 pam_the_christian_church.0061.desc.bystander: "消息自[schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]传来：教使已在祭坛上宣判绝罚，而[schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip]亦以相同方式予以回击。\n\n那些曾自称同属一个教会的人们，如今已然分裂为[schism_western_faith.GetAdherentNamePlural]与[schism_eastern_faith.GetAdherentNamePlural]。他们的争端本与我毫无干系，[ROOT.Char.GetFaith.GetName]信仰也未曾因此有所动摇，然而目睹这一切，仍旧令人感到痛心。"
 pam_the_christian_church.0061.a: "就这样吧。"
 pam_the_christian_church.0061.a.shame: "真是遗憾。"
 pam_the_christian_church.0061.a.bystander: "兄弟相争，实在令人惋惜。"
 MARANATHA_GLOSS: "阿拉米语口号#bold “吾主，来吧！”#!。出自《格林多前书》16:22，成为咒逐的格式：被诅咒者被弃绝，直到主归来。"
 pam_the_christian_church.0062.t: "维持共融"
 pam_the_christian_church.0062.desc: "那道险些撕裂基督教世界的伤口已被缝合。通过[schism_peacemaker.GetTitledFirstName]的辛劳，争吵的教座被召回同一张桌前。\n\n[Glossary( '尽力以和平的联系，保持心神的合一，因为只有一个身体和一个圣神，正如你们蒙召，同有一个希望一样。只有一个主，一个信德，一个洗礼。', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName]仍处于共融之中。"
 pam_the_christian_church.0062.a: "赞美主。"
 pam_the_christian_church.0062.a.peacemaker: "没有哪个教区能统治其他教区。"
 pam_the_christian_church.0062.b: "让[new_head_of_faith.GetTitledFirstNameNoTooltip]引领我们所有人。"
 pam_the_christian_church.0062.b.self: "那么整个教众都将听命于我。"
 pam_the_christian_church.0063.t: "遗落之人"
 pam_the_christian_church.0063.desc: "我已跨入[ROOT.Char.GetRite.GetName]，然而[schism_dissenter.GetTitledFirstName]并未跟随。[schism_dissenter.GetSheHe|U]不断为我的灵魂与我曾属的团体忧虑：\n\n“你离开了我们，”[schism_dissenter.GetSheHe]低声说道，“当教会将自己撕裂成两半……它必会如此……你我将站在伤痕的两侧。”"
 pam_the_christian_church.0063.a: "同一个上帝聆听着我们双方。"
 pam_the_christian_church.0063.b: "让我告诉你我为何跨越了界限。"
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip]与我并肩而行"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip]不为所动"
 pam_the_christian_church.0063.c: "将你的恐惧深藏于心底。"
 pam_the_christian_church.0064.t: "伤口将裂开"
 pam_the_christian_church.0064.desc.opening.self_mainline: "我的呼声与[schism_competitor_head.GetTitledFirstName]的声音针锋相对。"
 pam_the_christian_church.0064.desc.opening.self_competitor: "我的声音与[schism_mainline_head.GetTitledFirstName]针锋相对。"
 pam_the_christian_church.0064.desc.opening: "[schism_mainline_head.GetTitledFirstName]与[schism_competitor_head.GetTitledFirstName]的声音针锋相对。"
 pam_the_christian_church.0064.desc: "我看不出[schism_mainline_rite.GetName]与[schism_competitor_rite.GetName]之间有任何重归和睦的道路。\n\n经上的警句已定谳：[Glossary( '凡一国自相纷争，就成为荒场', 'MATTHEW_12_25_LATIN_GLOSS' )]。[christianity.GetName]内部的共融尚未破裂，但伤口终将绽开。那一刻不可避免。"
 pam_the_christian_church.0064.a: "主啊，不要抛弃我们。"
 pam_the_christian_church.0064.a.tt: "大分裂进程已达到其临界点"
