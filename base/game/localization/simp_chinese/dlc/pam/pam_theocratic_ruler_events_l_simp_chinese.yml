l_simp_chinese:
 pam_theocratic_ruler_events.0001.t: "对教会的遗赠"
 pam_theocratic_ruler_events.0001.desc: "一位富商给教会留了一笔遗赠，数目相当可观。\n\n我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))][subordinate_priest.GetFirstName]带来了账目和意向书。[subordinate_priest.GetSheHe|U]等着我来裁决。\n\n“遗嘱上说，这笔钱应该用来加强对[ROOT.Char.GetFaith.HighGodName]的信仰。”"
 pam_theocratic_ruler_events.0001.a: "我找到了[subordinate_priest.GetSheHe]挪用圣款的证据……"
 pam_theocratic_ruler_events.0001.b: "“作为神职同僚，让我们互相辩论。”"
 pam_theocratic_ruler_events.0001.c: "心怀感恩与审慎，存入宝库。"
 pam_theocratic_ruler_events.0001.b.success: "主的行事深不可测"
 pam_theocratic_ruler_events.0001.b.failure: "这位教士并不明白事理"
 pam_theocratic_ruler_events.0001.b.toast.success: "你说服[subordinate_priest.GetHerHim]并拿走遗赠。"
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.GetSheHe|U]将捐赠献给[ROOT.Char.GetFaith.HighGodName]。"
 pam_theocratic_ruler_events.0002.t: "来自边境之外的旅人"
 pam_theocratic_ruler_events.0002.desc: "消息传到我这里，[foreign_ruler.GetTitledFirstName]，一位信奉[foreign_ruler.GetFaith.GetName]旧道的邻近统治者，已经进入了我的领地。\n\n这支小小的旅团要去别处，但他们的路线离得很近，以至于我应该在宫廷里以正式的问候接待他们。\n\n我该如何接待他们？"
 pam_theocratic_ruler_events.0002.a: "一份适度的礼物，并致以和平之意。"
 pam_theocratic_ruler_events.0002.b: "“我寻求我们人民之间的真诚理解。”"
 pam_theocratic_ruler_events.0002.b.success: "我的礼节赢得了他们的好感"
 pam_theocratic_ruler_events.0002.b.failure: "我的话听起来空洞无力"
 pam_theocratic_ruler_events.0002.b.toast.success: "你的礼节赢得了好感，使两文化民众之间的宽容得到增长"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.GetSheHe|U]不为所动，你的话听起来空洞无力"
 pam_theocratic_ruler_events.0002.b.acceptance: "宫廷使团"
 pam_theocratic_ruler_events.0002.c: "异教徒在我们的土地上没有立足之地。"
 TRUCE_PAM_NEIGHBOR_GIFT: "\n基于礼物与睦邻尊重的停战"
 pam_theocratic_ruler_events.0003.t: "巩固边境的指导"
 pam_theocratic_ruler_events.0003.desc: "战争和掠夺者已经对我的土地考验得够多了。我召见了[advisor.GetTitledFirstName]，我信任的[advisor.GetCouncilTitle]，一起权衡该怎么做。\n\n“我们可以联系[alliance_target.GetTitledFirstName]。同为本信仰的神权统治者，[alliance_target.GetSheHe]可以来援助我们。”\n\n还是我该把这个重担扛在自己肩上？"
 pam_theocratic_ruler_events.0003.a: "派出使者。我们必须站在一起。"
 pam_theocratic_ruler_events.0003.a.tt: "你与[alliance_target.GetShortUINameNoTooltip]缔结了[alliance|E]"
 pam_theocratic_ruler_events.0003.b: "征召虔诚的农夫守卫边境。"
 pam_theocratic_ruler_events.0003.b.army: "虔诚的农民"
 pam_theocratic_ruler_events.0003.c: "提供援助，重建近期被劫掠的伯爵领。"
 pam_theocratic_ruler_events.0003.d: "我将此事交托于[ROOT.Char.GetFaith.HighGodNamePossessive]之手。"
 pam_theocratic_ruler_events.0004.t: "以修士为邻"
 pam_theocratic_ruler_events.0004.desc: "[monastic_order_head.GetPrimaryTitle.GetName]就在近旁。我邀请了[monastic_order_head.GetTitledFirstName]，来讨论我们如何加深合作。\n\n“[monastic_order_head.GetFaith.HighGodName]并不以我们的骄傲来审判我们，而要看我们服侍的意愿。”[monastic_order_head.GetTitledFirstNameNoTooltip]轻声说道。"
 pam_theocratic_ruler_events.0004.a: "请让你的修士们祝福我的土地。"
 pam_theocratic_ruler_events.0004.b: "你的门徒[monastic_monk.GetTitledFirstNameNoTooltip]将充实我的宫廷。"
 pam_theocratic_ruler_events.0004.c: "让我们一同祈祷。"
 pam_theocratic_ruler_events.0005.t: "信仰之剑"
 pam_theocratic_ruler_events.0005.desc: "[military_order_head.GetPrimaryTitle.GetName]已在我的领地安驻，我邀请了[military_order_head.GetTitledFirstName]来讨论信仰之剑如何为彼此效力。\n\n“[military_order_head.GetFaith.HighGodName]不祝福闲置的钢铁，只祝福为保卫信徒而举起的刀剑。”[military_order_head.GetTitledFirstNameNoTooltip]说道，而[military_order_head.GetHerHis]的追随者[order_knight.GetTitledFirstName]在[military_order_head.GetHerHim]身旁沉默地躬身行礼。"
 pam_theocratic_ruler_events.0005.a: "以修会的纪律操练我的[ROOT.Char.Custom('GetFighterTermPlural')]。"
 pam_theocratic_ruler_events.0005.b: "让[order_knight.GetTitledFirstNameNoTooltip]担任我的贴身侍卫。"
 pam_theocratic_ruler_events.0005.c: "让我们谈论何为正义之战。"
 pam_theocratic_ruler_events.0006.t: "什一税或仁慈"
 pam_theocratic_ruler_events.0006.desc: "一位村长[local_peasant_leader.GetTitledFirstName]被带到我面前。[local_peasant_leader.GetHerHis|U]的人拖欠了教会的税，现在以困难为由请求宽恕。\n\n“冬天太残酷了，[ROOT.Char.GetLadyLord]，我们的粮仓几乎已经空了。”[local_peasant_leader.GetSheHe]说道，声音不太稳。\n\n问题再清楚不过：是用恐惧来管教这个地方，还是用仁慈来维持和平。"
 pam_theocratic_ruler_events.0006.a: "毫无例外，惩罚首恶。"
 pam_theocratic_ruler_events.0006.a.tt: "你获得[gold_i][EmptyScope.ScriptValue('minor_gold_value')|0]，并囚禁[local_peasant_leader.GetShortUINameNoTooltip]，[troubled_county.GetName]获得#N 强制什一税#!，持续5年（#N ‑20#![county_opinion|E]）。"
 pam_theocratic_ruler_events.0006.b: "这次算了。仁慈同样可以侍奉主。"
 pam_theocratic_ruler_events.0006.b.tt: "你获得[piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0]，[troubled_county.GetName]获得#P 减免什一税#!，持续5年 (#P +20#![county_opinion|E])。"
 pam_theocratic_ruler_events.0006.c: "我的财政总管失职了。过错在他。"
 pam_theocratic_ruler_events.0006.c.tt: "如果可能，你获得一个对[ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip]的[hook|E]（如果可用，则添加更强的义务牵制）。[ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip]对你的[opinion|E]降低（#N ‑20#!，5年内逐渐衰减）。"
 pam_theocratic_ruler_events.0007.t: "幸福和谐"
 pam_theocratic_ruler_events.0007.desc: "当温和的阳光抬起晨露、暖热教堂墓地的石头时，我意识到：这一次，职责没有在扯我的袖子。就连一只勤劳的蜜蜂似乎也会停下来，在黎明的光线里暖暖后背。\n\n我的土地安静而有序，金库里有金子，我的信众满足而恭敬。就连我的领主[ROOT.Char.GetLiege.GetTitledFirstName]，也赞许地谈起我如何引导[ROOT.Char.GetLiege.GetHerHis]的臣民走向基督。"
 pam_theocratic_ruler_events.0007.a: "和平固然美好，但[ROOT.Char.GetFaith.HighGodName]赋予了我更伟大的使命。"
 pam_theocratic_ruler_events.0007.b: "传播秩序、敬虔生活的福音。"
 pam_theocratic_ruler_events.0007.c: "让我静静聆听，保持平静。"
 pam_theocratic_ruler_events.0008.t: "石叠石"
 pam_theocratic_ruler_events.0008.desc: "自从我继承了[stone_province.GetName]，一座拥有[GetBuilding('curtain_walls_01').GetName]的城堡，我就一直在观察着这些为世俗统治而造的出色石工。但对虔诚的信徒来说，防御工事真的有必要吗？\n\n我的领地没有一座配得上我名号的[GetDomicileBuilding('episcopal_palace_01').GetName]，而这里却已经有世俗之手砌起的规整石料。"
 pam_theocratic_ruler_events.0008.a: "我可以利用这些原始城墙的多余石料。"
 pam_theocratic_ruler_events.0008.b: "推倒城墙，建起我的[GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]。"
 pam_theocratic_ruler_events.0008.c: "人类双手的每一件作品，都是具象化的祈祷。"
 pam_theocratic_ruler_events.0008.c.flavor: "你拥有信条[GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]"
 pam_theocratic_ruler_events.0008.d: "城墙还是需要的。"
 pam_theocratic_ruler_events.0009.t: "试着成为牧者"
 pam_theocratic_ruler_events.0009.desc: "我收到了教众满是泪水的报告，说[heir.GetTitledFirstName]在最近一次布道时大发脾气，他们无法遵守[heir.GetSheHe]所要求的严格教规。\n\n当我质问[heir.GetHerHim]时，[heir.GetSheHe]勃然大怒。\n\n“哦，这些卑劣的罪人！我实在无法忍受他们可悲的赎罪尝试。”"
 pam_theocratic_ruler_events.0009.a: "“牧者需要冷静，克制你的情绪。”"
 pam_theocratic_ruler_events.0009.a.success: "[heir.GetHerHim]听进了你的建议"
 pam_theocratic_ruler_events.0009.a.failure: "你的话没能安抚[heir.GetHerHim]"
 pam_theocratic_ruler_events.0009.a.toast.success: "成功的建议"
 pam_theocratic_ruler_events.0009.a.toast.failure: "失败的建议"
 pam_theocratic_ruler_events.0009.b: "我失望地轻轻摇了摇头。"
 pam_theocratic_ruler_events.0009.b.flavor: "[heir.GetSheHe|U]得不到我的祝福，不适合统治"
 pam_theocratic_ruler_events.0009.c: "“祈祷吧，锤炼你的肉体。”"
 pam_theocratic_ruler_events.0010.t: "刀剑或牧杖"
 pam_theocratic_ruler_events.0010.desc: "作为领地的统治者，我被迫以刀剑和祝福来侍奉[ROOT.Char.GetFaith.HighGodName]。\n\n我清楚地记得[pilgrimage_memory.GetDescription]，以及[battle_memory.GetDescription]。战场上尸体堆得很高；我的追随者知道我不会回避手头的事。\n\n展望领地的未来，我的[ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle]，[ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName]，和我的[ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle]，[ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName]，都希望我把他们各自的手段作为我们行动的重点。"
 pam_theocratic_ruler_events.0010.a: "尊崇刀剑。"
 pam_theocratic_ruler_events.0010.b: "牧杖应当领导。"
 pam_theocratic_ruler_events.0010.c: "让刀剑与牧杖并肩效力。"
 pam_theocratic_ruler_events.0011.t: "安息吧，陨落的骑士"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName]跪在我面前，带来了关于[landed_subject.GetHerHis]那为捍卫[ROOT.Char.GetFaith.HighGodName]而牺牲的亲族的消息。\n\n“他独自抵挡了许多异教徒，但伤口太深了。至少我们还能做最后的告别。”\n\n“请让他安息在祭坛通道下方，剑放在身旁。我将永远感激您。”"
 pam_theocratic_ruler_events.0011.a: "支付石头的钱，他就能在这里安息。"
 pam_theocratic_ruler_events.0011.a.flavor: "骑士将安息于教堂。"
 pam_theocratic_ruler_events.0011.b: "只要你捐出这把剑，就可以使用墓穴。"
 pam_theocratic_ruler_events.0011.b.flavor: "骑士将不会带着剑安息"
 pam_theocratic_ruler_events.0011.c: "战士属于广阔的天空。"
 pam_theocratic_ruler_events.0011.c.flavor: "骑士将被安葬在教堂围墙外。"
 pam_fallen_knight_crusader_sword_name: "十字军之剑"
 pam_fallen_knight_crusader_sword_desc: "一把骑士佩剑，那位骑士在为信仰而战时倒下。剑身上布满异教徒武器留下的缺口，剑柄上刻有一个小小的十字。"
 pam_theocratic_ruler_events.0012.t: "昔日圣林"
 pam_theocratic_ruler_events.0012.desc: "我的随从在森林的合拢小径处放慢了脚步。[grove_subject.GetTitledFirstName]，[grove_county.GetNameNoTier]的一位信徒，从树间走出，张开双手表示问候。\n\n“如果你真心想赢得这片土地上信徒的信任，你就必须倾听并接纳[ROOT.Char.GetFaith.HighGodName]早已在此播下的种子。在[grove_province.GetName]的古老圣林旁建一座神殿，人们就会知道你是谁的牧者。”"
 pam_theocratic_ruler_events.0012.a: "让自然指引我的信仰。"
 pam_theocratic_ruler_events.0012.b: "带我去看看这片树林。"
 pam_theocratic_ruler_events.0012.b.success: "你的人稍后前去砍伐木材"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip]识破了你的计谋"
 pam_theocratic_ruler_events.0012.b.toast.success: "古树被运走换钱。"
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip]传播了你亵渎的行为。"
 pam_theocratic_ruler_events.0012.c: "这片荒野散发着魔鬼的气息。"
 pam_theocratic_ruler_events.0013.t: "天使的启发"
 pam_theocratic_ruler_events.0013.desc: "今天的弥撒上，仿佛受到了神圣的感召，一个声音从唱诗班中升起，清澈而美得不似人间。\n\n当[angelic_singer.GetTitledFirstName]歌唱时，信徒们都静默下来，而在最后一个音符消散很久之后，我发现自己仍在倾听。"
 pam_theocratic_ruler_events.0013.a: "“你的天赋得自[ROOT.Char.GetFaith.HighGodName]。立下誓言去侍奉吧。”"
 pam_theocratic_ruler_events.0013.a.success: "你的话让[angelic_singer.GetHerHim]深感虔诚"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip]未被说服"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip]立下誓言，加入你的宫廷。"
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip]婉拒并离开。"
 pam_theocratic_ruler_events.0013.b: "留下做我的客人，我想再听听那声音。"
 pam_theocratic_ruler_events.0013.c: "唱诗班该开始歌唱了。"
 pam_theocratic_ruler_events.0014.t: "皈依者的恳求"
 pam_theocratic_ruler_events.0014.desc: "在我的布道会上，[convert_peasant.GetTitledFirstName]，一位从[neighbour_faith.GetNameNoTooltip]旧道皈依的[convert_peasant.GetCulture.GetNameNoTooltip]人，从人群中挤了过来。\n\n“旧传统里仍有许多值得学的东西。我知道，如果您能用心考量，我的同胞会知道您尊重我们的传统。像这样的人会聚到您身边，支持您的一切努力。”\n\n[convert_peasant.GetSheHe|U]等着我的祝福，而我以一个沉默的点头作答。"
 pam_theocratic_ruler_events.0014.a: "把这污秽之人从我眼前带开。"
 pam_theocratic_ruler_events.0014.a.flavor: "你拥有[GetTrait('arrogant').GetName( GetNullCharacter )][trait|E]"
 pam_theocratic_ruler_events.0014.a.acceptance: "拒绝皈依者的恳求"
 pam_theocratic_ruler_events.0014.b: "接纳[offered_tenet_a.GetBaseNameNoTooltip]为我自己的信条。"
 pam_theocratic_ruler_events.0014.b.tt: "你的下一次[GetGreatProjectType('pam_mass_rite_conversion').GetName|V][great_project|E]的#V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#!贡献免费。"
 pam_theocratic_ruler_events.0014.c: "接纳[offered_tenet_b.GetBaseNameNoTooltip]为我自己的信条。"
 pam_theocratic_ruler_events.0014.c.tt: "你的下一次[GetGreatProjectType('pam_mass_rite_conversion').GetName|V][great_project|E]的#V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#!贡献免费。"
 pam_theocratic_ruler_events.0014.d: "牧者会由羊群引导吗？"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "皈依者的恳求"
 pam_theocratic_ruler_events.0015.t: "指引继任者"
 pam_theocratic_ruler_events.0015.desc: "在我之后，教座需要一位既能引领祈祷又能主持裁决的牧者。第一顺位的[succession_heir_first.GetTitledFirstName]，以及紧随其后的[succession_heir_second.GetTitledFirstName]，已被私下召来在我面前背诵经文。\n\n他们中有一人将继承我的重担，而我今天无法平等地引导二人。\n\n“我信仰中的孩子。不要仅仅向我展示你们记忆的东西，还要展示你们内心中的东西。”"
 pam_theocratic_ruler_events.0015.a: "指导[succession_heir_first.GetFirstNameNoTooltip]对经文的理解。"
 pam_theocratic_ruler_events.0015.b: "通过经文指引[succession_heir_second.GetFirstNameNoTooltip]。"
 pam_theocratic_ruler_events.0015.c: "我还是牧者，由我来背诵。"
 pam_theocratic_ruler_events.0015.c.success: "你的学识胜过他们的背诵"
 pam_theocratic_ruler_events.0015.c.failure: "你在一段他们熟识的段落跌了跟头"
 pam_theocratic_ruler_events.0015.c.toast.success: "他们对你对教义的掌握印象深刻。"
 pam_theocratic_ruler_events.0015.c.toast.failure: "你的下属就你的错误交换眼神。"
