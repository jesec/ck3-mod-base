l_simp_chinese:
 pam_curse_enemy_decision: "诅咒敌人"
 pam_curse_enemy_decision_desc: "#F 哪个蠢货竟敢与我作对？我要在众灵面前点他们的名，把每一桩怨恨、每一次侮辱、每一道诅咒都倾泻到他们身上。让他们趁现在还能笑就笑吧；他们的清算很快就会到来。#!"
 pam_curse_enemy_decision_tooltip: "执行针对你的仇敌或[wars|E]对手的仪式"
 pam_curse_enemy_decision_confirm: "开始仪式"
 pam_curse_enemy_decision_valid_target: "你拥有在世的成年[rival|E]、[nemesis|E]或战争对手"
 pam_curse_enemy_decision_selected_target_valid: "你选择的敌人仍然是在世的成年[rival|E]、[nemesis|E]或战争对手"
 pam_curse_enemy_decision_no_item_selected: "未选择敌人"
 pam_seek_war_aid_decision: "寻求战争援助"
 pam_seek_war_aid_decision_desc: "#F 战争考验的不只是军备与人数。我将向众灵祈求洞察、活力或坚韧，足以支撑我的事业渡过前方的试炼。#!"
 pam_seek_war_aid_decision_tooltip: "请求众灵在你当前的战争中予以援助"
 pam_seek_war_aid_decision_confirm: "召唤众灵"
 pam_adorcism_events.0001.t: "众灵前的名字"
 pam_adorcism_events.0001.desc: "在隐秘之处，我将[pam_adorcism_curse_target.GetTitledFirstNamePossessive]名字刻入泥土，大声说出每一桩怨恨。这仪式不能折断骨头，也不能让庄稼枯萎，但那并非它的目的。\n\n当我起身时，我的怒火已冷却为决心。现在，关于[pam_adorcism_curse_target.GetHerHim]的每一条传言，都像一根等待被拉扯的线。"
 pam_adorcism_events.0001.a: "我的目的很明确。"
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U]，我已在众灵面前说出你的名字，对你施下了诅咒。当厄运找上你时，记住，是我的意志召来了它。"
 pam_adorcism_events.0002.desc.default: "\n\n我已在众灵面前说出你的名字，对你施下了诅咒。当厄运找上你时，记住，是我的意志召来了它。"
 pam_adorcism_events.0002.a: "快，去请[ROOT.Char.GetFaith.PriestNeuter]来！"
 pam_adorcism_events.0002.a.flavor: "诅咒啃噬着你的思绪，每一道阴影都仿佛是不祥之兆。"
 pam_adorcism_events.0101.t: "无形之军机"
 pam_adorcism_events.0101.desc: "在营地最后一堆篝火之外，我倾洒祭品，侧耳倾听，身后大军的声音渐渐远去。风搅动尘土，没有带来清晰的声音，但仪式使我的思绪安定下来。\n\n我必须决定，为前方的战役寻求何种助力。"
 pam_adorcism_events.0101.a: "为我展示通往胜利的道路。"
 pam_adorcism_events.0101.b: "借给我握剑的手臂力量。"
 pam_adorcism_events.0101.c: "赋予我无比的坚韧。"
 pam_adorcism_curse_focus_modifier: "定位怒火"
 pam_adorcism_curse_focus_modifier_desc: "该角色已指名其怒火所向，并通过仪式将其向外施放。"
 pam_adorcism_ill_omen_modifier: "身负凶兆"
 pam_adorcism_ill_omen_modifier_desc: "该角色所属礼仪的成员在诅咒传闻之后，对其心怀猜疑。"
 pam_adorcism_curse_anxiety_modifier: "畏惧诅咒"
 pam_adorcism_curse_anxiety_modifier_desc: "该角色无法摆脱这样的念头：每一场即将降临的不幸，都是被召唤降临在其身上的。"
 pam_adorcism_battle_guidance_modifier: "众灵指引战略"
 pam_adorcism_battle_guidance_modifier_desc: "该角色相信众灵已显现战斗的有利迹象。"
 pam_adorcism_personal_vigor_modifier: "众灵赋予活力"
 pam_adorcism_personal_vigor_modifier_desc: "仪式上的自信赋予了该角色个人战斗领域的力量。"
 pam_adorcism_campaign_endurance_modifier: "众灵赋予士气"
 pam_adorcism_campaign_endurance_modifier_desc: "该角色的军队在长期作战中信念愈发坚定。"
