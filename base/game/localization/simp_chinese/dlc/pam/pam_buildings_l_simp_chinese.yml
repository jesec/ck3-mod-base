l_simp_chinese:
 # Abbey of St Gall
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$"
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$"
 building_pam_abbey_of_st_gall_01: "圣加仑修道院"
 building_pam_abbey_of_st_gall_01_desc: "这座修道院环绕于圣加仑的隐修之所而建，以其学堂、缮写室与图书馆而闻名。在其高墙之内，修士们抄录圣典、培育神职人员，其学识远播于康斯坦茨湖岸之外。"
 building_pam_abbey_of_st_gall_01_destination_desc: "[GetBuilding('pam_abbey_of_st_gall_01').GetName]在高墙之下汇聚了朝圣者与学者。院中修士保存手稿、培养教士，并在阿尔卑斯山麓延续着圣加仑的记忆。"
 # Palais des Papes
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$"
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$"
 building_pam_palais_de_papes_01: "教宗宫"
 building_pam_palais_de_papes_01_desc: "这座宫殿高踞于阿维尼翁之上，兼具要塞与居所之功能，以厚重的石墙庇护着教廷。礼拜堂、觐见厅与行政厅堂将这城市变为教会权力的中心。"
 building_pam_palais_de_papes_01_destination_desc: "[GetBuilding('pam_palais_de_papes_01').GetName]以其坚固的城墙与肃穆的礼拜堂俯瞰阿维尼翁，这座宫殿正是为承载教会的政务与礼仪而建。"
 # Archbasilica of Saint John Lateran
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$"
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$"
 building_pam_lateran_basilica_01: "拉特朗圣若望大殿"
 building_pam_lateran_basilica_01_desc: "罗马的主教座堂，为全城及普世教会之母堂与总堂。在其大殿与毗连厅堂之中，公会议得以召开、教义得以裁定、罗马最高教长的权威亦得以彰显。"
 building_pam_lateran_basilica_01_destination_desc: "[GetBuilding('pam_lateran_basilica_01').GetName]在罗马主教的座席之处恭迎朝圣者与高级神职人员，庄严的礼仪与教会政务在这巍峨的古墙之下交汇。"
 # Reims Cathedral
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$"
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$"
 building_pam_reims_cathedral_01: "兰斯大教堂"
 building_pam_reims_cathedral_01_desc: "在兰斯，这座主教座堂屹立为克洛维受洗及其诸王加冕的圣地。在此，神职人员的祝圣能将统治者的宣称转化为神圣的权柄，在信仰与王权之间铸就纽带。"
 building_pam_reims_cathedral_01_destination_desc: "[GetBuilding('pam_reims_cathedral_01').GetName]吸引着旅人前来这君主加冕的神圣核心，法兰克诸王在此祭坛前屈膝，在王国面前受傅油。"
