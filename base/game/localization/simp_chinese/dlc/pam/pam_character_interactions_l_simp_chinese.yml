 pam_interactions_events.0039.opening: "[ROOT.Char.GetFirstName]，我忠诚的仆人，"
 pam_interactions_events.0039.desc: "对于这突如其来的消息，我深感遗憾，但必须告知你：我将[target.GetName]交给了[actor.GetPrimaryTitle.GetNameNoTier]的[actor.GetTitleAsName]。\n\n这是[secondary_recipient.GetTitledFirstNameRegnal]的旨意，他负责了[actor.GetTitledFirstNameNicknamed]和我之间关于你的[ROOT.Char.GetPrimaryTitle.GetTierAsName]的谈判。回到[recipient.GetCapitalLocation.GetTitle.GetNameNoTier]去，你很快就会被重新分派。"
 pam_interactions_events.0039.a: "看来，我下野了……"
 pam_interactions_events.0039_revoked_governorship_tt: "#high 你的#![governorship|E]被剥夺了"
 pam_interactions_events.0039_governorship_transfer_tt: "[target.GetName]被移交给[actor.GetShortUIName]"
