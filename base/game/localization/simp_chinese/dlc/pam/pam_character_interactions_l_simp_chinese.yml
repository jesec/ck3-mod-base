 pam_interactions_events.0090.desc: "的确，[recipient.GetFaith.HighGodName]正以慈爱的目光注视着[recipient.GetPrimaryTitle.GetNameNoTier]！通过你的宣告，我被立为这片土地的[recipient.GetTitleAsName]，而[recipient.GetFaith.GetAdjective]的信众们欢欣鼓舞。\n\n我将用生命守护这个[recipient.GetPrimaryTitle.GetTierAsName]。以法律明智治理，以刀剑与权杖坚定统治，并谨遵你的谏言。"
