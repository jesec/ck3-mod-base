 pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName]希望结束[puppet_or_actor.GetHerHis]的婚姻，是的，但尽管[puppet_or_actor.GetSheHe]与[secondary_recipient.GetTitledFirstName]之间或许积怨已深……他们毕竟是在[puppet_or_actor.GetFaith.HighGodName]面前结合的。而他们并无充分的理由解除婚姻。\n\n因此，我必须编造一些谎言作为离婚的合法理由。这是一种亵渎，或许，理应获得某种补偿……"
 pam_interactions_events.0060.a: "这场分手理应……引发一场血雨腥风的丑闻。"
 pam_interactions_events.0060.a.tt: "我不会编造高尚的谎言，而是对[secondary_recipient.GetFirstNameNoTooltip]提出卑鄙的指控！[secondary_recipient.GetHerHis|U]的家族将被迫为[secondary_recipient.GetHerHis]辩护……而[puppet_or_actor.GetFirstNamePossessiveNoTooltip]的亲属也会为[puppet_or_actor.GetHerHis]辩护。"
 pam_interactions_events.0060.b: "让[puppet_or_actor.GetTitleAsNameNoTooltip]为虔信者捐赠土地。"
 pam_interactions_events.0060.b.tt: "给[lease_order.GetName]一个头衔将减轻我们灵魂的负担……"
 pam_interactions_events.0060.c: "这个人情需要以人情来换。"
 pam_interactions_events.0060.d: "宣称[secondary_recipient.GetFirstNameNoTooltip]已被许身给修会。"
 pam_interactions_events.0060.d.tt: "如果[secondary_recipient.GetSheHe]很久以前曾向[divorcee_joining_order.GetName]发过誓愿，那么这段婚姻就应当被宣告无效！那么，还有谁比我更适合引导[secondary_recipient.GetFirstNamePossessiveNoTooltip]的新生活呢？"
 pam_interactions_events.0060.e: "不向这对不幸的夫妇提出任何要求。"
