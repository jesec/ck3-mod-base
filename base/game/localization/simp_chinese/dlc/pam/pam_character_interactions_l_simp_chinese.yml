 pam_interactions_events.0050.aa.tt: "教导这个没有爱情的粗人，[puppet_or_actor.GetSheHe]需要摒弃所有肉体的需求与渴望……"
 pam_interactions_events.0050.a: "通往[recipient.GetFaith.PositiveAfterLife]之路？爱，奉献。"
 pam_interactions_events.0050.a.tt: "在你的引导下，这对近乎破裂的夫妇或许能在彼此身上找到救赎。"
 pam_interactions_events.0050.b: "遵守你在[recipient.GetFaith.GoodGodNames]前立下的誓言。"
 pam_interactions_events.0050.c: "这种对神圣婚姻的蔑视是亵渎！"
 pam_interactions_events.0050.d: "祈祷，一起祈祷，祈祷[recipient.GetFaith.HighGodNamePossessive]的指引。"
