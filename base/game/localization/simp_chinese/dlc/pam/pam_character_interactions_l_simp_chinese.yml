 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal]，"
 pam_interactions_events.0050.desc: "在[puppet_or_actor.GetFaith.ReligiousText]中，婚姻是神圣的结合。但在现实世界中……却远没有那么完美。\n\n你已拒绝让[secondary_recipient.GetTitledFirstName]与我分开。我们该如何处理这残局……？"
