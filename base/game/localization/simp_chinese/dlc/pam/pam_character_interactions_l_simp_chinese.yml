 pam_interactions_events.0072.opening: "邪恶的[recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)]，"
 pam_interactions_events.0072.desc_joined_war: "我现在来到你面前。作为传教士，为你的黑暗带来光明。作为你的[puppet_or_actor.GetMotherFather]，带来惩罚。\n\n而在你的[puppet_or_actor.Custom('MotherFatherPossessive')]身边，来了一位[puppet_or_actor.GetFaith.GoodGodNames]的战士，[secondary_recipient.GetName]。[secondary_recipient.GetHerHis|U]的军队将把[target.GetNameNoTier]从邪恶中解放出来。"
 pam_interactions_events.0072.desc: "已经太迟了。你再无悔改的机会。\n\n看吧，[recipient.GetPrimaryTitle.GetNameNoTier]这邪恶之地将被撕裂！看吧，[puppet_or_actor.GetFaith.DevilName]的仆从将被屠戮！我已举起信众的武器，并派[secondary_recipient.GetName]来毁灭你！"
 pam_interactions_events.0072.a: "[puppet_or_actor.GetFaith.HighGodName]一定十分残忍，才会放出这样的[puppet_or_actor.GetWomenMen]来对付我们！"
