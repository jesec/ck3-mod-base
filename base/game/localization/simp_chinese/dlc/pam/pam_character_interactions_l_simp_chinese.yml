 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U]可以直接[excommunicate|E][secondary_recipient.GetShortUIName]"
 no_valid_excommunicator_tt: "由于你的[faith|E]没有[theocratic|E][head_of_faith|E]，[secondary_recipient.GetShortUIName]只能被满足以下任意条件的强大[ecclesiastical|E][ruler|E][excommunicated|E]：\n$EFFECT_LIST_BULLET$是[secondary_recipient.GetHerHis]的[liege|E]或更高\n$EFFECT_LIST_BULLET$是相邻[ruler|E]或[secondary_recipient.GetHerHis]的[realm_capital|E]位于其[clerical_region|E]内\n$EFFECT_LIST_BULLET$是[secondary_recipient.GetHerHis]的[court_chaplain|E]的[superior|E]或更高\n$EFFECT_LIST_BULLET$是[secondary_recipient.GetHerHis]的[court_chaplain|E]，且没有[superior|E]"
