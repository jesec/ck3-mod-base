 pam_interactions_events.0096.desc: "将[target.GetNameNoTier]从[former_de_jure_liege.GetNameNoTier]割离是极为明智和蒙福的举动！\n\n就照你所颁令的那样：在万世之中，[de_jure_master.GetPrimaryTitle.GetNameNoTier]将作为这座[target.GetTierAsNameNoTooltip]与[ROOT.Char.GetFaith.PositiveAfterLife]之间的壁垒，使忠信的[target.GetAdjectiveNoTooltip][ROOT.Char.GetFaith.GetAdherentNamePlural]永远被引向[ROOT.Char.GetFaith.HighGodNamePossessive]的光明。\n\n我将此纳入我神圣的[de_jure_master.Custom('GetTitleTierAdjective')]誓言。"
