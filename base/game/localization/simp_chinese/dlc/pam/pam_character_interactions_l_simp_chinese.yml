 pam_interactions_events.0094.opening: "合法的[ROOT.Char.GetTitleAsName]！"
 pam_interactions_events.0094.desc_conversion: "通过[target.GetNameNoTier]传播[cleric.GetFaith.HighGodName]的话语！不要对其迷途的子民吝惜杖责，也不要用你的[ROOT.Char.Custom('GetFighterTermPlural')]的力量来捍卫这片土地的美德。\n\n[target.GetTierAsNameNoTooltip]归你统治。它从属于每一位[ROOT.Char.GetPrimaryTitle.GetAdjective][ROOT.Char.GetTitleAsName]的#EMP 法理#!直到时间的尽头。"
 pam_interactions_events.0094.desc: "对于[cleric.GetFaith.GetAdherentNamePlural]来说，这是[target.GetNameNoTooltip]蒙福的一天！哦，他们多么渴望与[ROOT.Char.GetPrimaryTitle.GetNameNoTier]的兄弟姐妹们合而为一！\n\n[target.GetAdjectiveNoTooltip]心中所愿已成为[cleric.GetFaith.HighGodNamePossessive][cleric.GetTitleAsName]所立之法：许多国家的君主现在承认该[target.GetTierAsNameNoTooltip]是[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]的#EMP 法理#!领土。"
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip]与[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]永恒结合。"
 pam_interactions_events.0095.opening: "[target_county.GetNameNoTier]及其他诸地的[ROOT.Char.GetTitleAsName]，"
 pam_interactions_events.0095.desc: "你蒙受了[cleric.GetFaith.HighGodName]的祝福！依凭[cleric.GetFaith.HighGodName]的智慧，[cleric.GetFaith.HighGodHerHis|U]将整个[target.GetName]置于[de_jure_master.GetPrimaryTitle.GetName]的[de_jure_master.GetTitleAsName]的永恒保护之下。\n\n作为[cleric.GetTitleAsName]，我代表[target.GetAdjectiveNoTooltip][cleric.GetFaith.GetAdherentNamePlural]、[de_jure_master.GetTitleAsNameNoTooltip]，以及所有明白以#EMP 法理#!划分[cleric.GetFaith.HighGodNamePossessive]的凡间诸国智慧的人们，颁布此法令。"
 pam_interactions_events.0095.a: "诅咒[de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]的贪婪！"
