 pam_interactions_events.0091.opening: "我的恩主，"
 pam_interactions_events.0091.desc_hook_theocrat: "您的调停让我深感亏欠。一只手被赋予了牧者的权杖，另一只手则与[recipient.GetFaith.HighGodName]紧紧相握。理当如此！[target.GetNameNoTier]是一份厚礼，而我则是满怀感激的受赠者。\n\n让所有土地都知晓：依[ROOT.Char.GetTitledFirstNameRegnal]的旨意，[target.GetTierAsName]归于圣职！"
 pam_interactions_events.0091.desc_hook: "您的调停让我深感亏欠。一只手被赋予了统治的权杖，另一只手则与[recipient.GetFaith.HighGodName]紧紧相握。理当如此！[target.GetNameNoTier]是一份厚礼，而我则是满怀感激的受赠者。\n\n让所有土地都知晓：依[ROOT.Char.GetTitledFirstNameRegnal]的旨意，[target.GetTierAsName]归我所有！"
 pam_interactions_events.0091.desc: "您的调停是我未曾想到的祝福。神圣[ROOT.Char.GetMotherFather|U]的权能广大，又满是慈爱——感谢[recipient.GetFaith.HighGodName]！\n\n[target.GetName]是一片高贵的土地。我将承袭其头衔，以谦卑与恩典统治其[recipient.GetFaith.GetAdherentNamePlural]。"
 pam_interactions_events.0091.a: "我将密切关注[target.GetNameNoTierNoTooltip]。"
 pam_interactions_events.0092.opening_theocratic: "最虔诚的[ROOT.Char.GetFaith.PriestNeuter]，"
 pam_interactions_events.0092.opening: "我的[ROOT.Char.Custom('GetTitleTierAdjective')]孩子，"
 pam_interactions_events.0092.desc_hook: "当你为[recipient.GetFaith.HighGodName]与[recipient.GetFaith.HighGodHerHis|U]的教长厚赐于你的伟大恩典祈祷时，请仔细思量，你究竟有多配得上这[target.GetTierAsName]。或许，仍需有人代你完成虔诚的敬拜。\n\n在此事上，我会提出我的建议。我们必须确保你在[target.GetNameNoTierNoTooltip]的统治，能取悦并服务于[recipient.GetFaith.HighGodName]。"
 pam_interactions_events.0092.desc: "你的[target.GetTierAsNameNoTooltip]已宣告成立！\n\n在我的祈祷指引下，我确实对你的升格给予了特别关注。我只要求你用心治理，使你的统治成为[target.GetNameNoTier][recipient.GetFaith.GetAdherentNamePlural]的祝福。"
