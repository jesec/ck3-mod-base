 pam_interactions_events.0070.t: "为[puppet_or_actor.GetTitleAsNameNoTooltip]而战的战争"
 pam_interactions_events.0070.desc_intro_pagan: "“为了[target.GetNameNoTier]的邪恶异教徒，"
 pam_interactions_events.0070.desc_intro_heretic: "“为了[target.GetNameNoTier]的异端[recipient.GetFaith.GetAdherentNamePlural]，"
 pam_interactions_events.0070.desc_intro_infidel: "“为了[target.GetNameNoTier]的[recipient.GetFaith.GetReligion.GetAdjective]异教徒，"
 pam_interactions_events.0070.desc_intro_heathen: "“为了[target.GetNameNoTier]的异教[recipient.GetFaith.GetReligion.GetAdherentNamePlural]，"
 pam_interactions_events.0070.desc: "#EMP 诅咒、毁灭——死于剑下！#![puppet_or_actor.GetTitledFirstNameRegnal]喊道，[puppet_or_actor.GetHerHis]的话被传到了[secondary_recipient.GetPrimaryTitle.GetNameNoTier]躁动不安的民众中。\n\n“举起[ROOT.Char.GetFaith.random_GoodGodNames]的圣旗，[ROOT.Char.GetTitledFirstName]！我召唤你将[recipient.GetTitledFirstName]从[target.GetNameNoTierNoTooltip]的土地上驱逐出去！将[recipient.GetHerHis]那些[recipient.GetPrimaryTitle.GetAdjective]的[recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]丢进[ROOT.Char.GetFaith.NegativeAfterLife]的火焰里！”\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "的确，[puppet_or_actor.GetTitleAsNameNoTooltip]渴望扩展[puppet_or_actor.GetFaith.HighGodNamePossessive]的疆域！[puppet_or_actor.GetSheHe|U]发誓要亲自出征，并将[puppet_or_actor.GetHerHis]军队交由我调遣。"
 pam_interactions_events.0070.desc_outro_funding_war: "这些要求有金钱作为后盾：[puppet_or_actor.GetTitleAsNameNoTooltip]承诺提供一笔战争资金，好让我在[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]的[ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]不仅仅凭信仰而战。"
 pam_interactions_events.0070.a: "“[ROOT.Char.GetFaith.WarGodName]与我们同在！#EMP 开战！#!”"
 pam_interactions_events.0070.b: "让[recipient.GetTitledFirstNamePossessiveNoTooltip]的人民继续和平。"
 cultural_acceptance_gain_refused_incited_holy_war: "一位世俗统治者阻止了圣战的发生"
 pam_interactions_events.0071.t: "[ROOT.Char.GetFaith.HighGodNamePossessive]对[target.GetNameNoTierNoTooltip]的征服"
 pam_interactions_events.0071.desc_intro: "在战斗的呐喊中，在歌谣中，在祈求胜利的祷文中——[ROOT.Char.GetFaith.HighGodNamePossessive]的圣言被带给了一群[recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]的[target.GetTierAsNameNoTooltip]！在[secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier]的主[ROOT.Char.GetFaith.HouseOfWorship]，[secondary_recipient.GetName]宣布对"
 pam_interactions_events.0071.desc_intro_pagan: "这些[recipient.GetPrimaryTitle.GetAdjective]异教徒发动圣战。\n\n如同野蛮的牲畜，[recipient.GetTitledFirstName]和[recipient.GetHerHis]的[recipient.GetCulture.GetCollectiveNoun]必将在[secondary_recipient.GetPrimaryTitle.GetNameNoTierPossessive]的[secondary_recipient.GetFaith.GetReligion.GetAdjective]大军正义降临之际四散溃逃！"
 pam_interactions_events.0071.desc_intro_heretic: "这些[recipient.GetPrimaryTitle.GetAdjective]的异端发动圣战。\n\n在一片血色洪流中，[recipient.GetTitledFirstName]和[recipient.GetHerHis]那些污秽的[recipient.GetFaith.GetAdherentNamePlural]将从这片土地上被冲走！亵渎[ROOT.Char.GetFaith.HighGodName]的圣言之人，向来是如此下场！"
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.GetPrimaryTitle.GetNameNoTier]的[recipient.GetTitleAsName]发动圣战。\n\n这些[recipient.GetFaith.GetReligion.GetAdjective]异教徒，如同所有曾败倒在先知的#EMP 吉哈德#!面前的人一样，很快就会被迫臣服！"
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.GetPrimaryTitle.GetNameNoTier]的[recipient.GetTitleAsName]发动圣战。\n\n以[ROOT.Char.GetFaith.WarGodName]之名，[secondary_recipient.GetSheHe]将击溃那些异教徒的大军！所有[ROOT.Char.GetFaith.GetReligion.GetAdjective]人民都将满怀敬畏地旁观。"
 pam_interactions_events.0071.desc_outro_joining_war: "\n\n我自己的军队不会袖手旁观。不！他们将与[secondary_recipient.GetTitledFirstNamePossessiveNoTooltip][secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l]一同攻陷[recipient.GetCapitalLocation.GetTitle.GetNameNoTier]。"
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\n来自[secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip]及更远之地的狂热战士，已聚集在[secondary_recipient.GetTitledFirstNamePossessiveNoTooltip]的旗帜之下。"
 pam_interactions_events.0071.desc_outro_funding_war: "\n\n仅凭[ROOT.Char.GetFaith.HighGodNamePossessive]的眷顾便足以保证[secondary_recipient.GetTitledFirstNameNoTooltip]的胜利。而我慷慨的赠予更确保了[secondary_recipient.GetHerHis]的信心。"
 pam_interactions_events.0071.a: "为这一事业而死的人，愿你们永远受到敬仰。"
