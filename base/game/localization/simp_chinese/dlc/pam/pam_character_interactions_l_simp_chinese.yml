 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName]，哦，蒙冤受屈的[actor.GetTitledFirstNameNoTooltip]！"
 pam_interactions_events.0020_threatened: "停手吧，停止你要对我们[secondary_recipient.GetFaith.GetReligion.GetAdjective][secondary_recipient.GetFaith.HouseOfWorshipPlural]施加的惩罚性职责、恶毒的谴责和邪恶的暴力！你令人畏惧的决心将在未来的日子里派上用场——因为对[target.GetNameNoTier]的宣称权已属于你。"
 pam_interactions_events.0020_offer_hook: "你承诺支持[secondary_recipient.GetPrimaryTitle.GetNameNoTier]的行为触动了我，于是我发现了你长期被忽视的权利——对[target.GetNameNoTier]的主张！"
 pam_interactions_events.0020_indebted: "卑微的[secondary_recipient.GetFaith.PriestNeuter]蒙受你的恩惠，因此我寻找并确证了无可辩驳的证据，证明[target.GetNameNoTier]理应归属于你的家族，却一直受人剥夺！"
 pam_interactions_events.0020: "你有权宣称[target.GetNameNoTier]：这是神意所赐的古老权利！我已向你的内阁提供了确凿证据。"
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal]不会乐意看到这个真相。但[secondary_recipient.GetFaith.FateGodName]不会理会骗子的抗议。"
 pam_interactions_events.0020.a.low_zeal: "历史由此改写……"
 pam_interactions_events.0020.a.high_zeal: "以神圣权利的名义，[target.GetNameNoTierNoTooltip]属于我！"
 pam_interactions_events.0020.a: "我的宣称已确立，去他的[recipient.GetTitledFirstNameNoTooltip]。"
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName]授予了[puppet_or_actor.GetShortUIName]对[target.GetNameNoTier]的宣称"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName]，"
 pam_interactions_events.0021: "如果你注定应该统治[target.GetNameNoTier]，[secondary_recipient.GetFaith.HighGodName]岂会不凭血脉的权利将它赐予你？\n\n不，我不会为了你那邪恶的目的而贬低[recipient.GetTitledFirstNameRegnal]——也不会为你的邪恶事业书写谎言，背叛你我凡人的灵魂。\n\n为你所犯的错误祈祷吧。"
 pam_interactions_events.0021.a: "[secondary_recipient.GetFaith.HouseOfWorship|U]的城墙给了[secondary_recipient.GetHerHim]庸人的勇气！"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]对[target.GetNameNoTier]的宣称请求"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "我与生俱来的权利的持有者，"
 pam_interactions_events.0022_shrimp: "尽管我只是个[actor.GetTitleAsName]，但[actor.GetFaith.GetAdjective][secondary_recipient.GetFaith.AltPriestTermPlural]发现，我的血脉中流淌着对[target.GetName]全境的古老宣称。"
 pam_interactions_events.0022_shark: "[target.GetName]本应属于由[actor.GetFaith.HighGodName]授予我[actor.Custom('GetTitleTierAdjective')]世系的头衔之一。自古以来都是如此，但直到近期才为人所知。"
 pam_interactions_events.0022: "博学的学者们早已明知——且最近证实——[target.GetName]是我名正言顺的宣称。"
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal]已赐予我的宣称以神圣的认可。[secondary_recipient.GetPrimaryTitle.GetName]全力支持我。\n\n因此我开始怀着希望与祈祷，期盼有朝一日我能作为主人被迎入美丽的[target.GetNameNoTierNoTooltip]……"
 pam_interactions_events.0022.a: "谎言！一个由虚伪的[secondary_recipient.GetFaith.PriestNeuter]支持的虚假宣称！"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "神圣的[secondary_recipient.GetMotherFather]，"
 pam_interactions_events.0023_shrimp: "若我手握正当宣称，难道我不能比那[actor.Custom2('InsultAdjective', recipient)]的[recipient.GetFirstNameRegnal]更能以德治理[target.GetName]吗？求你让[actor.GetFaith.HighGodNamePossessive]的光芒照耀我这个区区[actor.GetTitleAsName]吧。"
 pam_interactions_events.0023_shark: "凭[actor.GetFaith.HighGodNamePossessive]的旨意，我已是诸多土地与人民的主人和守护者。然而[target.GetName]却在我的疆域与权利范围之外。"
 pam_interactions_events.0023: "信徒之中议论纷纷。有些人热切希望我去夺取[target.GetName]，而另一些人则否认我对该头衔有任何权利。"
 pam_interactions_events.0023_end: "\n\n像你这样博学的人，一定能从历史记载中#EMP 发现#!所需的证据……并为我提供一份获圣许的[target.GetNameNoTierNoTooltip]宣称吧？"
 pam_interactions_events.0023.a: "愿[target.GetNameNoTierNoTooltip]归于你，我的[actor.Custom('GetDaughterSon')]。"
 pam_interactions_events.0023.b: "一位[secondary_recipient.GetTitleAsNameNoTooltip]绝不能以谎言交易。"
