 # player Priest refuses event
 pam_interactions_events.0031.opening: "我任性的[actor.Custom('GetDaughterSon')]，"
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName]赐你双唇去讲述公正之语。[actor.GetFaith.HighGodName]赐你双手去挥舞刀剑。[actor.GetFaith.HighGodName]将[actor.GetFaith.PriestNeuterPlural]赐予世间，好让你能听从他们的智慧。\n\n而你却为贪婪所噬，口出不公之言。你为恐惧所困，手中之剑欲斩向[target.GetNameNoTier]却又踌躇不前。\n\n事已至此，你必须听从我的智慧，放过这位[target.GetTierAsName]。"
 pam_interactions_events.0031.a: "那个[secondary_recipient.GetTitleAsNameNoTooltip]拒绝了我！"
 # Player clergy response event
 pam_interactions_events.0033.opening: "天国与尘世秩序的守护者，"
 pam_interactions_events.0033_de_jure: "我需要你的帮助。请宣布我对[target.GetName]的统治是正当的——根据法理权利，它属于我。请赐予我你的认可，让我能够不流血地说服[recipient.GetName]。\n\n"
 pam_interactions_events.0033_claim: "我请求你神圣的许可，以实现我对[target.GetNameNoTier]的宣称。好让[recipient.GetName]能在不让[actor.GetFaith.GetAdjective]信徒流血的情况下交出[target.GetTierAsName]。\n\n"
 pam_interactions_events.0033_threaten: "如果你拒绝我的这个请求……那就得由#EMP 你#!去向[ROOT.Char.GetFaith.HighGodName]解释，[target.GetNameNoTierNoTooltip]为什么会遭受这样的杀戮与焚烧。"
 pam_interactions_events.0033_succession: "如果你代我发言，我将发誓：如果我以[actor.GetPrimaryTitle.GetNameNoTier][actor.GetTitleAsName]的身份死去——且我的家族并无子嗣——[actor.GetPrimaryTitle.GetNameNoTier]将归属于教会。"
 pam_interactions_events.0033_pilgrimage: "作为你在此凡间之事上圣许的回报，我承诺进行一次朝圣：以此感谢[actor.GetFaith.HighGodName]赐予我的祝福。"
 pam_interactions_events.0033_use_hook: "当然，你肯定没有忘记……你今天的身份是我给你的。你笔尖写下的，也必须依照我的意愿……"
 pam_interactions_events.0033_offer_hook: "把你虔诚的名声借给我的事业，并不只是小恩小惠。如果你在这些凡间的政治中支持我，来日我必回报于你。"
 pam_interactions_events.0033_donate: "助我一臂之力，用土地富足我的国家，我会乐意捐钱给你虔诚的金库。"
 pam_interactions_events.0033_fallback: "除非由神圣的调解人发起，这些关于土地和头衔的谈判将不会有任何结果。你是否愿意将你神圣的权威借予我的事业？"
 pam_interactions_events.0033.aa: "好，就这么做。"
 pam_interactions_events.0033.a: "以我的敕令的名义，[target.GetNameNoTierNoTooltip]必须属于[actor.GetFirstNamePossessiveNoTooltip]。"
 pam_interactions_events.0033.a.tt: "致[recipient.GetTitledFirstNameNoTooltip]的信：固执己见、占有他人土地不放，是在蔑视[secondary_recipient.GetFaith.HighGodName]和[secondary_recipient.GetTitleAsNameNoTooltip]！"
 pam_interactions_events.0033.b: "我无法认可这无礼的要求。"
 pam_interactions_events.0033.b.tt: "这世界秩序井然如常。[recipient.GetTitledFirstNameNoTooltipRegnal]必须保有[target.GetNameNoTierNoTooltip]。"
 clergy_land_inform_priest_might_fail_tt: "@warning_icon!#X #bold [actor.GetShortUIName]将尝试说服[recipient.GetShortUIName]将[target.GetName]交给[actor.GetHerHim]，可能会失败#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon!#alert_trial #bold [actor.GetShortUIName]可以强迫[recipient.GetShortUIName]把[target.GetName]给予[actor.GetHerHim]，但也可选择承受失败的风险#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName]将顺从地将[target.GetName]交给[actor.GetShortUIName]#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold 你的[GetLaw('church_authority_3').GetName][law|E]允许你强迫[recipient.GetShortUIName]顺从地将[target.GetName]交给[actor.GetShortUIName]#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "作为神圣仲裁者，我在此开启谈判。"
 pam_interactions_events.0032_intro: "你一直悉心治理[target.GetNameNoTier]，但[recipient.GetFaith.HighGodName]的旨意是[target.GetTierAsNameNoTooltip]应属于[actor.GetName]。能否请你将土地不流血地割让给[actor.GetHerHim]？\n\n"
 pam_interactions_events.0032_de_jure: "因为[target.GetNameNoTierNoTooltip]依#EMP 法理#!权利属于[actor.GetHersHis]。"
 pam_interactions_events.0032_claim: "因为，在全能者眼中，[actor.GetHerHis]对[target.GetNameNoTierNoTooltip]的宣称是最真实的。"
 pam_interactions_events.0032.aa: "现在，我的笔在何处……"
 pam_interactions_events.0032.aa.flavor: "我要向全世界证明：[recipient.GetFaith.HighGodName]剥夺了这些有罪的骗子一切[recipient.GetFaith.GetAdjectiveNoTooltip]的美德。他们所拥有的——以及将要拥有的——都只是无耻的狂妄。"
 clergy_interaction_scholar_block_tt: "#P #bold #EMP [actor.GetShortUINamePossessive]获得[target.GetName]的尝试失败了#!#!#!"
 pam_interactions_events.0032.a: "如果这是[actor.GetFaith.HighGodName]的意愿，那我会放弃[target.GetNameNoTierNoTooltip]。"
 pam_interactions_events.0032.b: "不。我不相信你们。"
 pam_interactions_events.0032.b.tt: "要是能轻松地让[actor.GetTitledFirstNameNoTooltip]和[secondary_recipient.GetTitledFirstNameNoTooltip]闭嘴就好了……"
 clerical_land_transfer_actor_attempt_tt: "@alert_icon!#alert_trial #bold 可通过以下方法之一，诱使你接受[actor.GetHerHis]夺取[target.GetName]：#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "为[target.GetNameNoTierNoTooltip]进行谈判"
 pam_interactions_events.0030.desc_intro_envoy: "在神圣的土地上，我的使者[secondary_recipient.GetTitledFirstNameRegnal]为我主张[target.GetNameNoTier]的归属。"
 pam_interactions_events.0030.desc_intro: "在[secondary_recipient.GetTitledFirstNameRegnal]的祝福和圣地的保护下，我向[target.GetNameNoTier]提出主张。"
 pam_interactions_events.0030.desc: "和平的言辞，夹杂着战争的威胁。宣告我被授予的权利。如此等等……\n\n"
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed]不会这么轻易地就被赶出[recipient.GetHerHis]的[target.GetTierAsNameNoTooltip]。这片土地的事，必须用世俗的承诺来了结……或者用邪恶的威胁。"
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed]绝不会如此轻易地放开对[vassal.GetName]的掌控。无论是用重金许诺还是威势相逼：我的封臣必须靠实力争取。"
 pam_interactions_events.0030.a: "提醒[recipient.GetFirstNameNoTooltip][recipient.GetSheHe]有某些……义务。"
 pam_interactions_events.0030.a.flavor: "且唯有[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]的[actor.GetTitleAsNameNoTooltip]方能要求封臣履行这些义务！"
 pam_interactions_events.0030.b: "我不需要[ROOT.Char.Custom2('RelationToMe', recipient)]。我需要[target.GetNameNoTierNoTooltip]。"
 pam_interactions_events.0030.b.flavor: "说清楚：若[recipient.GetFirstNameNoTooltip]拒绝，[recipient.GetSheHe]便与你再无瓜葛。"
 pam_interactions_events.0030.c: "若[recipient.GetSheHe]不肯退让，就玷污这片神圣的土地。"
 pam_interactions_events.0030.c.tt: "用恶毒的指控来痛骂那个肮脏的罪人！让诅咒和蔑视降临在你们二人身上！[secondary_recipient.GetTitledFirstNameNoTooltip]和所有其他[actor.GetFaith.PriestNeuterPlural]会让[recipient.GetFirstNameNoTooltip]屈服！"
 pam_interactions_events.0030.d: "威胁要制造一场使其丧失合法性的丑闻。"
 pam_interactions_events.0030.d.flavor: "若是名声与声誉都押上，那本就声望寥寥的[recipient.GetTitleAsNameNoTooltip]岂能长久……"
 pam_interactions_events.0030.e: "干脆出价购买[target.GetTierAsNameNoTooltip]。"
 pam_interactions_events.0030.f: "我将此交由[ROOT.Char.GetFaith.HighGodName]与[recipient.GetFirstNamePossessiveNoTooltip]的决断。"
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold 未给予任何好处，[recipient.GetShortUIName]不太可能接受#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon!#alert_trial 未给予任何好处，[recipient.GetShortUIName]接受的可能性降低#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "[target.GetNameNoTierNoTooltip]之争"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal]继续以[actor.GetNamePossessive]的名义为[target.GetNameNoTier]提出辩护——[secondary_recipient.GetSheHe]宣称，这是为了维护[recipient.GetFaith.HighGodNamePossessive]的尘世秩序以及[recipient.GetFaith.GetAdjective]全体神职人员的权益。"
 pam_interactions_events.0034.desc_intro: "[actor.GetName]陈述了[actor.GetHerHis]对[target.GetNameNoTier]的主张：[actor.GetSheHe]重申了受[recipient.GetFaith.GetAdjective]信仰庇护与支持的要求。"
 pam_interactions_events.0034.desc_vassal: "不必在意我曾向[target.GetHolder.GetName]宣誓至死效忠，事实证明，这份忠诚似乎是可以讨价还价的。"
 pam_interactions_events.0034.desc_target: "不必在意[target.GetTierAsNameNoTooltip]依照血缘和征服归属于我。这世上的任何东西都是可以讨价还价的。"
 pam_interactions_events.0034.desc: "\n\n我来到圣地，平静地忍受着这些对我权利的侵犯。我只能沉思所给予的一切……\n\n"
 pam_interactions_events.0034.desc_method_hook: "[actor.GetTitledFirstNameNoTooltip]对我所持义务将一笔勾销的承诺。"
 pam_interactions_events.0034.desc_method_relation: "我们之间所有的温暖、信任和爱，都将以一种毁灭性的方式结束。据[actor.GetFirstNameNoTooltip]说，[actor.GetHerHim|U]的心全系在这片土地上。\n\n[actor.GetSheHe|U]会因为我拒绝了这件事而永远仇恨我。"
 pam_interactions_events.0034.desc_method_piety: "我本就脆弱的信仰关系面临彻底毁灭的威胁。这也会连累[actor.GetTitledFirstNameNoTooltip]，但[actor.GetHerHis]虔诚信仰的根基比我更稳固。"
 pam_interactions_events.0034.desc_method_legitimacy: "这是对我合法性的严重威胁。一场可憎的围绕[target.GetNameNoTierNoTooltip]公开争吵，一桩让我们两人都沦为笑柄的丑闻……"
 pam_interactions_events.0034.desc_method_gold: "一堆闪闪发光的钱币。那位[actor.GetTitleAsNameNoTooltip]声称，对于一个[target.GetTierAsNameNoTooltip]而言，这是合适的价码。"
 pam_interactions_events.0034.desc_no_method: "……#EMP 什么都没有#!。有的只是对[target.GetNameNoTier]的要求，以及一种假定——认定我害怕[recipient.GetFaith.PriestNeuterPlural]的蔑视和战争的恐怖。"
 pam_interactions_events.0034.a: "[actor.GetSheHe|U]可以在[target.GetNameNoTierNoTooltip]升起[actor.GetHerHis]的旗帜。"
 pam_interactions_events.0034.b: "只要我活着，[target.GetTierAsNameNoTooltip]就是我的。"
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip]，收入囊中"
 pam_interactions_events.0035.desc_intro: "经过一番思量，[recipient.GetFirstNameNicknamed]让步了！割让[target.GetNameNoTier]的谈判迅速且富有成果。\n\n[secondary_recipient.GetTitledFirstNamePossessive]主张我的权利的敕令得以实现。"
 pam_interactions_events.0035.desc_hook: "我对[recipient.GetFirstNameNoTooltip]所持的义务已光荣履行。"
 pam_interactions_events.0035.desc_relation: "是的，苦涩的泪水流下，欢乐与仰慕终结。我为了得到[target.GetNameNoTierNoTooltip]而深深折磨了[recipient.GetFirstNameNoTooltip]。但……"
 pam_interactions_events.0035.desc_piety: "因此，我威胁将[recipient.GetFirstNameNoTooltip]与自己一同淹没于邪恶耻辱中的话……也不必兑现了。"
 pam_interactions_events.0035.desc_legitimacy: "因此，我那些欲引发纷争与诽谤的威胁……也不必兑现了。"
 pam_interactions_events.0035.desc_gold: "消息已经送到了我的管账人和债主那里，这就是我甘愿付出的代价。"
 pam_interactions_events.0035.desc_fallback: "[actor.GetFaith.HighGodName]竟将如此大能赋予我们的[actor.GetFaith.GetAdjective][actor.GetFaith.PriestNeuterPlural]，以及我！无需军队或征战——仅凭我们的号令，世界得以重定秩序。"
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName]将向我宣誓[vassal.GetHerHis]效忠。"
 pam_interactions_events.0035.desc: "\n\n[target.GetTierAsNameNoTooltip]属于我了。"
 pam_interactions_events.0035.a: "在[target.GetNameNoTierNoTooltip]全境，高高升起我的旗帜！"
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip]，遭拒"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName]在勇猛士兵的护卫下给出了[recipient.GetHerHis]的答复，尽管有[secondary_recipient.GetTitledFirstNamePossessive]的和平调解，仍显不安：\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName]在魁梧的[recipient.Custom('KnightCulturePluralNoTooltip')|l]护卫下给出了[recipient.GetHerHis]的答复，尽管有[secondary_recipient.GetTitledFirstNamePossessive]的和平调解，仍显不安：\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName]独自一人、不屈地给出了[recipient.GetHerHis]的答复，全赖[secondary_recipient.GetTitledFirstNamePossessive]的和平调解而壮了胆：\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName]在保镖簇拥下给出了[recipient.GetHerHis]的答复，对[secondary_recipient.GetTitledFirstNamePossessive]的和平调解一脸不屑：\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName]在魁梧的[recipient.Custom('KnightCulturePluralNoTooltip')|l]簇拥下给出了[recipient.GetHerHis]的答复，对[secondary_recipient.GetTitledFirstNamePossessive]的和平调解一脸不屑：\n\n"
 pam_interactions_events.0036.desc_hook: "“[target.GetNameNoTierPossessive]在我心中的地位，高于你所能对我提出的任何义务。"
 pam_interactions_events.0036.desc_relation: "“[actor.GetPrimaryTitle.GetNameNoTier]的[actor.GetTitleAsName]唾弃我的心，将我的灵魂撕成碎片。我不会再听[actor.GetHerHim]的任何话语。"
 pam_interactions_events.0036.desc_piety: "“若是索要[target.GetNameNoTier]遭拒，你便要凭罪孽与指控让我俩都颜面尽失？很好。"
 pam_interactions_events.0036.desc_legitimacy: "“去散播你那恶毒的谎言吧。让[target.GetNameNoTier]的民众，以及所有其他人，都来反对我俩吧。"
 pam_interactions_events.0036.desc_gold: "“你以为能用金银买下[target.GetNameNoTier]？对如此高贵的[target.GetTierAsNameNoTooltip]来说，这交易可太过简单了。"
 pam_interactions_events.0036.desc_fallback: "“单凭区区一位[actor.GetTitleAsName]和一个[secondary_recipient.GetTitleAsNameNoTooltip]的三言两语，就能赢取[target.GetNameNoTier]……？不能。"
 pam_interactions_events.0036.desc_afraid: "派[recipient.GetFaith.PriestNeuterPlural]来，我会欢迎他们。派使节来，我会与之商谈……”\n\n“但我不能像这样放弃[target.GetTierAsNameNoTooltip]。”"
 pam_interactions_events.0036.desc_pious: "派更多堕落的[recipient.GetFaith.PriestNeuterPlural]去，派魔鬼般的军队武装开往[target_capital.GetTitle.GetNameNoTier]……”\n\n“我绝不会放弃[target.GetTierAsNameNoTooltip][recipient.GetFaith.HighGodName]赐予我的东西。”"
 pam_interactions_events.0036.desc: "派更多吵闹的[recipient.GetFaith.PriestNeuterPlural]去，派成队的[actor.Custom('GetFighterTermPlural')]武装开往[target_capital.GetTitle.GetNameNoTier]……”\n\n“我不会这么轻易放弃[target.GetTierAsNameNoTooltip]。”"
 pam_interactions_events.0036.a_relation: "[recipient.GetSheHe]怎能拒绝我？！？"
 pam_interactions_events.0036.a: "违抗一位[secondary_recipient.GetTitleAsNameNoTooltip]的意志？可耻……"
 clergy_land_transfer_refusal_tt: "拒绝将[target.GetName]割让给[actor.GetShortUIName]"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed]，[ROOT.Char.GetPrimaryTitle.GetNameNoTier]的[ROOT.Char.GetTitleAsNameNoTooltip]，"
 pam_interactions_events.0037.desc: "对于这突如其来的消息，我深感遗憾，但必须告知你：从今往后，[actor.GetPrimaryTitle.GetNameNoTier]的[actor.GetTitleAsName]就是你的领主了。\n\n这是[secondary_recipient.GetTitledFirstNameRegnal]的旨意，其负责了[actor.GetTitledFirstNameNicknamed]和我之间关于你的[ROOT.Char.GetPrimaryTitle.GetTierAsName]的谈判。你既然一直忠于[recipient.GetPrimaryTitle.GetNameNoTier]，那也请忠于你的新领主。"
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName]已成为你的[liege|E]"
 pam_interactions_events.0037.a: "我的誓言现已作废。从此无人能命令我。"
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip]已经放弃[recipient.GetHerHis]的宗主权。如果[actor.GetTitledFirstNameNoTooltip]想要接手……[actor.GetSheHe]必须全副武装前往[target.GetNameNoTierNoTooltip]。"
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]？当真？"
 pam_interactions_events.0037.b.tt: "从前我的子民遥望[recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]，我猜他们如今要望向[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]了。"
