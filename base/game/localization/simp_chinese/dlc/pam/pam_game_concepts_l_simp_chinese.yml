l_simp_chinese:
 game_concept_puppet: "傀儡"
 game_concept_puppets: "傀儡"
 game_concept_puppeted: "傀儡"
 game_concept_puppeting: "傀儡"
 game_concept_puppet_type: "傀儡类型"
 game_concept_puppet_types: "傀儡类型"
 game_concept_puppet_type_desc: "[puppet|e]始终拥有一个类型，该类型决定了他们可以代表你采取的行动。\n\n虽然他们的大部分特殊行动是共通的，但每种$game_concept_puppet_type$都有仅限该类型使用的独特行动。\n\n比如，一个[clerical_puppet|e]可以代表你将某人[excommunicate|e]，而一个[external_ruler_puppet|e]可以被迫释放[tributary|e]，或是和自己的[spouse|e]离婚。\n\n你每种类型最多只能拥有一个$game_concept_puppet$。"
 game_concept_puppet_desc: "傀儡是受[puppeteer|E]控制，可借其执行特殊傀儡行动的[character|E]。\n\n通过傀儡行动，可开启原本关闭的门径：[clerical_puppet|E]可代你请求[clerical_titles|E]或[excommunication|E]，而[external_ruler_puppet|E]可受命释放[tributaries|E]、给予独立或与其配偶[spouse|E]。\n\n可用行动由[puppet_type|E]决定。"
 game_concept_puppeteer: "操纵者"
 game_concept_puppeteers: "操纵者"
 game_concept_puppeteer_possessive: "操纵者"
 game_concept_puppeteers_possessive: "操纵者"
 game_concept_puppeteer_desc: "操纵者是控制着一个或多个[puppets|E]的[character|E]。\n\n通过傀儡行事，操纵者可行使自身所不具备的权力，例如[clergy|E]的影响力或另一[realm|E]的权威。"
 game_concept_clerical_puppet: "领地司祭傀儡"
 game_concept_clerical_puppets: "领地祭司傀儡"
 game_concept_clerical_puppet_desc: "作为自己[liege|E]的[puppet|E]的[realm_priest|E]。\n\n操纵者可以通过其插手[faith|E]事务：向[head_of_faith|E]请愿[clerical_titles|E]或[excommunication|E]、管理[holy_sites|E]、建立新的[rite|E]，或是举办[ecumenical_council|E]。"
 game_concept_external_clerical_puppet: "神职统治者傀儡"
 game_concept_external_clerical_puppets: "神职统治者傀儡"
 game_concept_external_clerical_puppet_desc: "成为另一位[ruler|E][puppet|E]的有权势的[clergy|E]——[archbishop|E]，甚至于[head_of_faith|E]。\n\n该神职人员的地位越高，其影响力就越广：一个被操纵的信仰领袖可以代表你对敌人进行[excommunicate|E]、任命[cardinals|E]、授予[pressed_claim|E]，或是发起一场[holy_war|E]。"
 game_concept_external_ruler_puppet: "世俗统治者傀儡"
 game_concept_external_ruler_puppets: "世俗统治者傀儡"
 game_concept_external_ruler_puppet_desc: "是另一[character|E][puppet|E]的非[clergy|E][ruler|E]。\n\n通过该傀儡，你可以干预其他[realms|E]的事务，例如使用[schemes|E]或[imprisonment|E]。\n\n\n获得该类型的傀儡需要#V $make_external_ruler_puppet_interaction$#![interaction|E]，在以下条件至少满足一项时解锁：\n$BULLET_WITH_TAB$你是目标的[clergy|E][vassal|E]\n$BULLET_WITH_TAB$你是[GetTrait('seducer').GetName( GetNullCharacter )]，目标是你的[lover|E]（若目标不低于[king|E]等级，改为[soulmate|E]）\n$BULLET_WITH_TAB$你是[GetTrait('torturer').GetName( GetNullCharacter )]，目标被关押在你的[dungeon|E]\n$BULLET_WITH_TAB$你拥有[GetTrait('family_first').GetName( GetNullCharacter )]特质，目标是你的[close_family|E]\n$BULLET_WITH_TAB$你是[GetTrait('diplomat').GetName( GetNullCharacter )]，目标是[independent_ruler|E]\n$BULLET_WITH_TAB$你是[GetTrait('gallant').GetName( GetNullCharacter )]，目标是你的[spouse|E]\n$BULLET_WITH_TAB$你是目标的[diarch|E]且处于[entrenched_regency|E]"
 game_concept_ecumenical_council: "大公会议"
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$是一种[activity|E]，全基督教世界的最高[clergy|E]将齐聚一堂，共同决定教会的未来。\n\n在多轮辩论中，与会的教长们将对存在争议的[core_tenets|E]的[tenet_status|E]做出裁决——将其定为[permitted_tenet_status|E]或[prohibited_tenet_status|E]，或是将其提升为[core_tenet_status|E]——并确立[faith|E]的[doctrines|E]。"
 game_concept_ecumenical_councils: "大公会议"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "大分裂"
 game_concept_schism_desc: "$game_concept_schism$是统一的$christian_faith$[faith|E]从罗马和希腊[rites|E]分裂为$catholic$和$orthodox$的时刻。\n\n当[the_christian_church|E][situation|E]进入特定[the_christian_church_chapters_short|E]时，分裂的威胁便会浮现，基督教世界的统治者必须选择立场。除非通过[decisions|E]弥合分裂——或强行撕裂——否则该时期结束后，分裂将成为永久性。"
 game_concept_schisms: "大分裂"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "圣职头衔"
 game_concept_clerical_titles: "圣职头衔"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$是管理[faith|E]内[clerical_region|E]的[clergy|E]持有的[ecclesiastical|E][title|E]。对于[christian|E]信仰，它以[archdiocese|E]的形式出现。\n\n它的持有者是圣职区内[clergy|E]的[religious_superior|E]，通常由[head_of_faith|E]授予。"
 game_concept_the_christian_church: "基督教会"
 game_concept_the_christian_church_desc: "基督教会是监督和指导耶稣基督追随者的宗教机构，表现为一个通过一系列[the_christian_church_chapters_short|E]推进的[situation|E]。\n\n其范围涵盖世界上所有[archdiocese|E]；至少[county|E]级别的所有[christian|E][ruler|E]，只要其[realm|E]的任意部分位于某总主教区内，即为教会成员——无论其是神职人员还是世俗人士。"
 game_concept_christendom: "基督教世界"
 game_concept_christendom_desc: "$game_concept_christendom$包含[the_christian_church|E][situation|E]的所有[independent|E][christian|E][ruler|E]的[realm|E]。"
 game_concept_christian: "基督徒"
 game_concept_christians: "基督徒"
 game_concept_christian_possessive: "基督徒"
 game_concept_christian_desc: "基督[religion|E]的追随者。"
 game_concept_papal_bull: "教宗诏书"
 game_concept_papal_bulls: "教宗诏书"
 game_concept_bull: "诏书"
 game_concept_bulls: "诏书"
 game_concept_papal_bull_desc: "教宗诏书是由某一[christian|E][faith|E]的[head_of_faith|E]发布的正式法令，在发布者的意志背后承载着[the_christian_church|E]的全部权威。\n\n拥有足够[church_authority|E]的基督教[head_of_faith|E]，可以通过[GetDecisionWithKey('enact_a_bull_decision').GetName][decision|E]来发布诏书，花费[piety|E]以：\n\n$EFFECT_LIST_BULLET$发动[great_holy_war|E]\n$EFFECT_LIST_BULLET$谴责一个[rite|E]为[heresy|E]\n$EFFECT_LIST_BULLET$宣布一个[core_tenet|E]为[permitted_tenet_status|E]或[prohibited_tenet_status|E]"
 game_concept_situation_the_christian_church_phase: "基督教会时期"
 game_concept_the_christian_church_chapter_short: "时期"
 game_concept_the_christian_church_chapters_short: "时期"
 game_concept_situation_the_christian_church_phases: "基督教会时期"
 game_concept_situation_the_christian_church_phase_desc: "时期是[the_christian_church|E]的[situation_phases|E]。总共有七个时期，归类为四个[the_christian_church_chapter_types|E]。"
 game_concept_the_christian_church_chapter_type: "时期类型"
 game_concept_the_christian_church_chapter_types: "时期类型"
 game_concept_the_christian_church_chapter_type_desc: "[the_christian_church|E]有四种$game_concept_the_christian_church_chapter_types$，分类了[situation_the_christian_church_phases|E]。\n\n$game_concept_the_christian_church_chapter_types$：[the_christian_church_unstable_short|E]、[the_christian_church_crisis_short|E]、[the_christian_church_zeal_short|E]和[the_christian_church_stability_short|E]"
 game_concept_the_christian_church_unstable: "动荡篇章"
 game_concept_the_christian_church_unstable_short: "动荡"
 game_concept_the_christian_church_unstable_desc: "在[the_christian_church|E]的#high $game_concept_the_christian_church_unstable$#!，信徒的服从性降低：\n\n[rulers|E]更有可能改信其他[rite|E]，绝罚频率提高，[gold|E]可能被用来谋取私利。\n\n#high $fragile_unity$#!和#high $reform_phase$#!属于$game_concept_the_christian_church_unstable_short$[the_christian_church_chapters_short|E]。"
 game_concept_the_christian_church_zeal: "狂热篇章"
 game_concept_the_christian_church_zeal_short: "狂热"
 game_concept_the_christian_church_zeal_desc: "#high $game_concept_the_christian_church_zeal$#!激发对外的热情：\n\n大规模改信可能发生，[great_holy_wars|E]频率提高，[papal_bulls|E]频率提高，改变[faith|E]更加容易。\n\n#high $conversion_phase$#!和#high $crusade_phase$#!属于$game_concept_the_christian_church_zeal_short$[the_christian_church_chapters_short|E]。"
 game_concept_the_christian_church_stability: "稳定篇章"
 game_concept_the_christian_church_stability_short: "稳定"
 game_concept_the_christian_church_stability_desc: "#high $game_concept_the_christian_church_stability$#!是[the_christian_church|E]难得的晴天：\n\n建造[temple_holding|E]的花费降低，大座堂的建造速度提高，[characters|E]更有可能成为[GetTrait('devoted').GetName( GetNullCharacter )]，大分裂可以弥合。\n\n#high $concord$#!是唯一的$game_concept_the_christian_church_stability$。"
 game_concept_the_christian_church_crisis: "危机篇章"
 game_concept_the_christian_church_crisis_short: "危机"
 game_concept_the_christian_church_crisis_desc: "#high $game_concept_the_christian_church_crisis$#!是[the_christian_church|E]最危急的时刻。\n\n寻求大赦花费降低，[ecumenical_councils|E]更频繁地召开，[rulers|E]可以任命自己的[court_chaplain|E]，[clergy|E]可以结婚，[head_of_faith|E]可能解决主持[anointment|E]，[taxes|E]受到影响。\n\n#high $saeculum_obscurum$#!和#high $investiture_crisis$#!属于$game_concept_the_christian_church_crisis_short$[the_christian_church_chapters_short|E]。"
 game_concept_head_of_rite: "礼仪领袖"
 game_concept_head_of_rite_desc: "[rite|E]的领袖[character|E]：若[head_of_faith|E]遵从该礼仪，则由其担任；否则，由礼仪追随者最多的[clerical_region|E]持有者担任；若仍无，则由管辖该[rite_possessive|E][counties|E]最多的[ruler|E]担任。\n\n只有$game_concept_head_of_rite$才能修改[rite_possessive|E]的[core_tenets|E]与[doctrines|E]，当教会走向[schism|E]时，他们便是为其羊群发声之人。"
 game_concept_ecclesiastical: "教会制"
 game_concept_ecclesiastical_government: "教会制"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "$game_concept_ecclesiastical$是一种由[christian|E][clergy|E][rulers|E]（例如[bishops|E]和[archbishops|E]）使用的[theocratic|E][government_form|E]。\n\n大多数教会制统治者是从世俗[liege|E]手中[lease|E]其[temple_holdings|E]的神权制[vassals|E]，并听命于[head_of_faith|E]，不过持有非[leased|E]的[landed|E][titles|E]的[bishop|E]，也可以凭其实力成为[independent|E]教会制[ruler|E]。此类统治者对其[vassals|E]的权力，由其[church_authority|E]决定。"
 game_concept_lease_contract: "租赁契约"
 game_concept_lease_contract_desc: "角色[leasing|E]头衔的法律条件。它还决定了谁是[religious_superior|E]。"
 game_concept_church_obligations: "教会义务"
 game_concept_church_obligations_desc: "教会义务代表对[church_holding|E]收入的所有义务。这些义务支付给[superior|E]、[head_of_faith|E]或当地世俗[ruler|E]。例如：[church_centralization|E]和[secular_obligations|E]。"
 game_concept_church_centralization: "教会上缴"
 game_concept_minimal_centralization: "少量上缴"
 game_concept_mild_centralization: "中等上缴"
 game_concept_strong_centralization: "大量上缴"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$代表教会权威和财务集中的程度。集中程度越高，教阶体系中向上流动的收入就越多。\n\n共有三类：\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "世俗义务"
 game_concept_personal_obligations: "个人义务"
 game_concept_fixed_obligations: "固定义务"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$决定了[church_holdings|E]收入中应归属于当地[secular_ruler|E]的份额。\n\n包括：\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\n在某些时期，世俗统治者还额外拥有对教会的本地权力：\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "宗教上级"
 game_concept_religious_superiors: "宗教上级"
 game_concept_superior: "上级"
 game_concept_religious_superior_desc: "宗教上级是在宗教等级体系内持有宗教辖区，拥有一个或多个[subordinate|E]神职人员的[character|E]。"
 game_concept_religious_subordinate: "宗教下属"
 game_concept_religious_subordinates: "宗教下属"
 game_concept_subordinate: "下属"
 game_concept_subordinates: "下属"
 game_concept_religious_subordinate_desc: "宗教下属是在宗教等级体系内拥有[religious_superior|E]的[character|E]。"
 game_concept_clerical_region: "圣职区"
 game_concept_clerical_regions: "圣职区"
 game_concept_clerical_region_possessive: "圣职区"
 game_concept_clerical_regions_possessive: "圣职区"
 game_concept_clerical_region_desc: "圣职区是归属于某一[clerical_title|E]辖区的地理区域。区域内任何神职人员都是该区域相关[title|E]持有者的[subordinate|E]。\n\n一名[ruler|E]属于包含其[capital|E][county|E]的圣职区，而新圣职区会在其建立者[primary_title|E]的[capital|E]建立。圣职区可以覆盖多个[realms|E]，并拥有位于不同领地的下属。\n\n一名$game_concept_ruler$同一时间只能持有一个$game_concept_clerical_region$。若被授予新的区域，该统治者将失去其在前一个区域内持有的所有土地。"
 game_concept_clerical_region_capital: "圣职区首府"
 game_concept_clerical_region_capitals: "圣职区首府"
 game_concept_clerical_region_capital_desc: "圣职区首府是[clerical_region|E]建立时所依托的拥有[ecclesiastical_estate|E]的[county|E]，也是管辖该教区的[clerical_title|E]的所在地。与[de_jure_capital|E]不同，它固定于该教区，无法迁移。"
 clerical_electors: "圣职选举人"
 game_concept_archdiocese: "总主教区"
 game_concept_archdioceses: "总主教区"
 game_concept_archdiocese_desc: "总主教区是[christian|E]下的[clerical_region|E]形式——一种由[archbishop|E]通过其[clerical_title|E]持有的教会领地，以首府[county|E]为驻地，并可在该地可修建[grand_cathedral|E]。\n\n[christian|E][ruler|E]在属灵事务上须听命于其[capital|E][county|E]所属总主教区的[archbishop|E]，而所有总主教区所辖领土共同构成了[the_christian_church|E][situation|E]。"
 game_concept_grand_cathedral: "大座堂"
 game_concept_grand_cathedrals: "大座堂"
 game_concept_grand_cathedral_desc: "大座堂是通过在[archdiocese|E]首府、[archbishop|E]的驻地开展一项[great_project|E]而建成的[great_building|E]。\n\n建造第一座主教座堂是一项具有纪念意义的虔诚之举：建立者将持续获得[piety|E]、[legitimacy|E]和[spiritual_fulfillment|E]，一个额外[personal_tenet|E]槽位，以及同[faith|E]角色的常驻[opinion|E]加成。一旦建成，它将扩大持有者的[cathedral_complex|E]，并吸引来自整个[christendom|E]的基督教朝圣者，日后还可扩建为[GetBuilding('great_project_cathedral_02').GetName|V]或[GetBuilding('great_project_cathedral_03').GetName|V]。"
 game_concept_monastic_holy_order: "隐修修会"
 game_concept_monastic_holy_orders: "隐修修会"
 game_concept_monastic_holy_order_possessive: "隐修修会"
 game_concept_monastic_holy_orders_possessive: "隐修修会"
 game_concept_monastic: "隐修"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "隐修修会是一种致力于祈祷、学习和传播单一[core_tenet|E]的[holy_order|E]。它属于其建立者的[rite|E]，并拥护该[rite_possessive|E]的一项[core_tenets|E]，在信徒中推广其实践。\n\n隐修修会由[archabbot|E]领导，依靠其[monastic_order_patrons|E]授予的[temple_holdings|E]和[gold|E]维持。修会则提供[spiritual_fulfillment|E]和[piety|E]作为回报。\n\n任何[faith|E]允许隐修制度的[ruler|E]都可以通过#high 建立隐修修会#![decision|E]来创建该组织。"
 game_concept_monastic_order_patron: "隐修修会庇护者"
 game_concept_monastic_order_patrons: "隐修修会庇护者"
 game_concept_monastic_order_patronize: "资助"
 game_concept_monastic_order_patronized: "庇护"
 game_concept_monastic_order_patronage: "资助"
 game_concept_monastic_order_patron_desc: "隐修修会庇护者是负责供养[monastic_holy_order|E]的至少[duchy|E][title_tier|E]的[ecclesiastical|E]或世俗[ruler|E]，通常就是创立修会的统治者。庇护者以世俗财富资助修会，向其租赁[temple_holdings|E]并捐赠[gold|E]。\n\n作为对如此慷慨的回报，庇护者会获得[piety|E]和[spiritual_fulfillment|E]。他们也可能控制修会领袖，让其作为[puppet|E]执行[clerical|E]互动。"
 game_concept_mendicant: "托钵修士"
 game_concept_rite: "礼仪"
 game_concept_rite_possessive: "礼仪"
 game_concept_rites_possessive: "礼仪"
 game_concept_rite_desc: "礼仪是[faith|E]的分支：一个信仰实践的地方变体，由[head_of_rite|E]领导，拥有自己的[counties|E]和[characters|E]。每种信仰都有一个[mainline_rite|E]，可以发展出多个礼仪。\n\n礼仪通过其所倡导的[core_tenets|E]与[doctrines|E]来定义自身。信条是被[permitted_tenet_status|E]还是被[prohibited_tenet_status|E]，根据[faith|E]的[mainline_rite|E]判断。[rite_possessive|E]的选择越是违背这些判断，其[rite_divergence|E]就越高：偏离的礼仪会削弱[faithpossessive|E]的[fervor|E]，逐渐被视为[heresy|E]，并在[divergence|E]达到#V 100#!时脱离成为独立的[faith|E]。\n\n新的礼仪可由虔诚者创立，[rulers|E]可以从一个礼仪转投另一个，但只有[head_of_rite|E]才能修改礼仪。"
 game_concept_rites: "礼仪"
 game_concept_archabbot: "修院长"
 game_concept_archabbot_desc: "$game_concept_archabbot$是[monastic_holy_order|E]的[ruler|E]，以及修会捍卫的[rite|E]的[head_of_rite|E]，负责引导其成员修习、默观，并传播其[core_tenets|E]。\n\n修会可以由[monastic_order_patron|E]提供支持，其[monastic_order_patronage|E]能为修会带来财富与影响力。\n\n$game_concept_archabbot$去世后，其[titles|E]将传给一位继任者，通常是其[courtier|E]中[learning|E]最高的角色。"
 game_concept_archbishop: "总主教"
 game_concept_archbishops: "总主教"
 game_concept_archbishop_possessive: "总主教"
 game_concept_archbishops_possessive: "总主教"
 game_concept_archbishop_desc: "总主教是持有公国级[clerical_title|E][archdiocese|E]的基督教角色，其[clerical_region|E]可能跨越多个[realms|E]。\n\n作为圣职区内[bishops|E]和下级[clergy|E]的[religious_superior|E]，总主教位阶高于普通[bishop|E]，并向[head_of_faith|E]负责。"
 game_concept_bishop: "主教"
 game_concept_bishops: "主教"
 game_concept_bishop_possessive: "主教"
 game_concept_bishops_possessive: "主教"
 game_concept_bishop_desc: "$game_concept_bishop$是基督教[faith|E]的[clergy|E]，持有或租赁[temple_holdings|E]。\n\n主教驻扎于[archdiocese|E]内，向当地作为其[religious_superior|E]的[archbishop|E]负责。持有[leased|E]头衔的无封地主教为世俗[liege|E]服务；而持有非租赁[landed|E][titles|E]的主教，则可作为[ecclesiastical|E][ruler|E]进行统治。"
 game_concept_rite_divergence: "偏离度"
 game_concept_rite_divergent: "偏离"
 game_concept_divergence: "偏离度"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "偏离度衡量一种[rite_possessive|E]的[core_tenets|E]与[doctrines|E]偏离其母[faith|E]的程度。礼仪若将[prohibited_tenet_status|E]信条采纳为[core_tenet_status|E]，偏离度会提高。\n\n高偏离度会削弱母信仰的[fervor|E]，使[heresy|E]更容易爆发。达到#V 100#!偏离度的礼仪将自动被宣布为异端，并成为新的[faith|E]。"
 game_concept_spiritual_fulfillment: "灵性满足"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$是衡量[character|E]在其[faith|E]方面内心平和程度的指标。\n\n其基准值根据人物拥有的[traits|E]计算，并考量这些特质是否被视作[sinful|E]或[virtuous|E]。\n\n通过以[faith|E]认可的方式行事，可以获得或失去$game_concept_spiritual_fulfillment$，并可以采用[personal_tenets|E]来抵消负面特质的影响。"
 game_concept_fulfillment: "满足"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "灵性满足等级"
 game_concept_spiritual_fulfillment_levels: "灵性满足等级"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E]的[spiritual_fulfillment|E]按阈值分为多个$game_concept_spiritual_fulfillment_levels$，每个等级拥有各自的效果。\n\n低等级使生活更简单，罪恶行为更轻松。高等级使奉献更容易，并开辟了新的宗教选择。"
 game_concept_personal_tenet: "个人信条"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$是[ruler|E]作为其属灵核心所采纳的[core_tenet|E]。\n\n采纳在[faith|E]内属于[core_tenet_status|E]或[permitted_tenet_status|E]的$game_concept_personal_tenet$，会带来[spiritual_fulfillment|E]；而采纳被[prohibited_tenet_status|E]的个人信条，则会生成一个[secret|E]。$game_concept_personal_tenets$还会提供额外效果，并解锁特殊机制。\n\n一个角色可以采纳的$game_concept_personal_tenets$数量，受其[piety_level|E]以及[GetTrait('theologian').GetName( GetNullCharacter )][trait|E]影响。"
 game_concept_personal_tenets: "个人信条"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "枢机"
 game_concept_cardinals: "枢机"
 game_concept_cardinal_possessive: "枢机"
 game_concept_cardinals_possessive: "枢机"
 game_concept_cardinalate: "枢机职"
 game_concept_cardinalates: "枢机职"
 game_concept_cardinal_desc: "被教宗选择辅佐其进一步推行[the_christian_church|e]意志的[clergy|e]。所有[college_of_cardinals|E]成员既是教宗候选人，也是教宗选举人，并拥有[papabile_score|E]。"
 game_concept_college_of_cardinals: "枢机团"
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$是由[cardinals|E]组成的机构，负责为教宗提供建议，并选举[the_christian_church|E]下一任[head_of_faith|E]。\n\n每一位[cardinal|E]既是教宗职位的候选人，也是选举人。"
 game_concept_papabile_score: "教宗候选分数"
 game_concept_papabile_scores: "教宗候选分数"
 game_concept_papabile_score_desc: "[college_of_cardinals|E]的所有成员都拥有一个$game_concept_papabile_score$，该分数综合考虑其他们的[traits|E]、[piety_level|E]、[rite|E]以及其他枢机的[opinion|E]。\n\n拥有最高$game_concept_papabile_score$的[cardinals|E]在教宗选举期间更有可能获得更多选票。\n\n$game_concept_papabile_score$可以通过#high $increase_papabile_score_interaction$#![character_interaction|E]和[GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName][decision|E]来提升。"
 game_concept_mainline_rite: "主流礼仪"
 game_concept_mainline_rite_desc: "主流[rite|E]代表[faith|E]最重要的一套理念。非主流$game_concept_rite$被视为与该$game_concept_rite$[rite_divergent|E]。\n\n哪种$game_concept_rite$属于主流，取决于$game_concept_faith$是否拥有[head_of_faith|E]。\n\n如果$game_concept_faith$拥有$game_concept_head_of_faith$，那么主流$game_concept_rite$就是信仰领袖遵循的礼仪。这意味着当一位属于不同$game_concept_rite$的继任者接任时，主流可能发生改变，包括潜在的[challenger_hof|E]。\n\n如果没有$game_concept_head_of_faith$，任何[counties|E]比主流礼仪更多的$game_concept_rite$都能取代主流礼仪，前提是它所持有的[holy_sites|E]至少与主流$game_concept_rite$一样多。"
 game_concept_mainline_rites: "主流礼仪"
 game_concept_mainline_rite_short: "主流"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "信条地位"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$描述了[rite_possessive|E]对特定[core_tenet|E]或[doctrine|E]的立场。两者都适用于相同的五个等级，从低到高分别为：\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E]——$game_concept_rite$对该$game_concept_core_tenet$或$game_concept_doctrine$没有认知。\n$EFFECT_LIST_BULLET$[known_tenet_status|E]——$game_concept_rite$了解它，但并未支持或禁止。\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E]——$game_concept_rite$允许采用。\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E]——$game_concept_rite$明令禁止采用。\n$EFFECT_LIST_BULLET$[core_tenet_status|E]——$game_concept_rite$积极推广该$game_concept_core_tenet$的实践。\n\n$game_concept_rite$对特定$game_concept_core_tenet$或$game_concept_doctrine$的立场决定了建立或偏离$game_concept_rite$时能否选择它，以及[followers|E]是否会因为使用它而承受灵性惩罚。\n\n这与[character_possessive|E]的[tenet_knowledge|E]不同，后者描述了角色的个人认知，而非$game_concept_rite$的立场。"
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "未知"
 game_concept_unknown_tenet_status_desc: "$game_concept_unknown_tenet_status$[tenet_status|E]意味着[rite|E]对该[core_tenet|E]或[doctrine|E]完全没有认知。$game_concept_rite$[followers|E]不了解它，创建新$game_concept_rite$或选择[personal_tenet|E]时也无法选择它。"
 game_concept_known_tenet_status: "已知"
 game_concept_known_tenet_status_desc: "$game_concept_known_tenet_status$[tenet_status|E]意味着该[rite|E]了解这一[core_tenet|E]或[doctrine|E]，但既不支持也不允许其实践。在创建或偏离$game_concept_rite$时，可以考虑将其提升到更高的[tenet_status|E]。"
 game_concept_permitted_tenet_status: "允许"
 game_concept_permit_tenet_status: "允许"
 game_concept_permitted_tenet_status_desc: "$game_concept_permitted_tenet_status$[tenet_status|E]意味着[rite|E]批准该[core_tenet|E]或[doctrine|E]但未积极推广。该$game_concept_rite$的[character|E]可以采用这类$game_concept_core_tenet$作为[personal_tenet|E]而不会产生灵性惩罚。"
 game_concept_prohibited_tenet_status: "禁止"
 game_concept_prohibit_tenet_status: "禁止"
 game_concept_prohibited_tenet_status_desc: "$game_concept_prohibited_tenet_status$[tenet_status|E]意味着某一[rite|E]明确禁止该[core_tenet|E]或[doctrine|E]。该$game_concept_rite$的[character|E]若将此类$game_concept_core_tenet$采纳为[personal_tenet|E]，会以此为[secret|E]；而将[prohibited_tenet_status|E][core_tenets|E]采纳为[core_tenet_status|E]的$game_concept_rite$，与[faith|E]的[rite_divergent|E]会大幅增加。"
 game_concept_core_tenet_status: "核心"
 game_concept_core_tenet_status_desc: "$game_concept_core_tenet_status$[tenet_status|E]意味着[rite|E]正在积极推广该[core_tenet|E]或[doctrine|E]。$game_concept_rite$的所有[followers|E]都会受其效果影响。"
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "了解"
 game_concept_doctrine_knowledge: "了解"
 game_concept_rite_knowledge: "了解"
 game_concept_agnostic_knowledge: "了解"
 game_concept_tenet_knowledge_desc: "角色并不知晓每一项宗教实践的全部细节。\n\n已知的信条和教义在创建[rite_divergent|E]$game_concept_rite$时可以使用，并且能被采纳为[personal_tenets|E]。了解一种$game_concept_rite$的所有$game_concept_core_tenets$和$game_concept_doctrines$会使皈依变得更容易。\n\n你[faith|E]中的所有[core_tenets|E]和[doctrines|E]对你都是已知的。新的知识可以通过[spouses|E]或[friends|E]等关系、[traveling|E]、[activities|E]或研习礼仪[scheme|E]获得。"
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "供奉"
 game_concept_enshrine: "供奉"
 game_concept_enshrined_desc: "供奉于[holy_site|E]的[holy_relic|E]能激活并提高圣地给予的增益，效果取决于所有供奉的宝物的总[rarity|E]。\n\n供奉的宝物不再由角色拥有，但可以由圣地的[holder|E]、[top_liege|E]或[clerical_region|E]持有者与其互动。宝物将不再破损。你只能供奉自己[faith|E]的圣物，其他信仰的圣物不提供增益。\n\n供奉或移除供奉的宝物可能会有奖励或消耗。"
 game_concept_holy_relic: "圣物"
 game_concept_holy_relics: "圣物"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$是对于某个[faith|E]具有宗教意义的[artifact|E]。$game_concept_holy_relic$可以被[enshrined|E]在[holy_site|E]中，以获得增益。\n\n有些宝物天然对某个信仰是神圣的，但宝物也可以通过[sanctified|E]成为圣物。"
 game_concept_sanctified: "祝圣"
 game_concept_sanctify: "祝圣"
 game_concept_sanctifying: "祝圣"
 game_concept_sanctified_desc: "对[artifact|E]祝圣可使其成为某个[faith|E]的[holy_relic|E]。一件宝物可以被多个信仰祝圣。"
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "教会庄园"
 game_concept_ecclesiastical_estates: "教会庄园"
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$——或称$game_concept_cathedral_complex$——是一种隶属于[clerical_title|E]的[domicile|E]，代表[archbishop|E]及其教座内的私人地产。在[GetGovernment('ecclesiastical_government').GetName]中，次级[clergy|E]必须先获得此类[title|E]，才能被授予头衔。\n\n在此处可建造[ecclesiastical_estate_buildings|E]，以扩大持有者的财富、[piety|E]与[spiritual_fulfillment|E]。$game_concept_ecclesiastical_estate$不会更改地点，并将由下一位头衔[holder|E]继承。"
 game_concept_ecclesiastical_estate_building: "教会庄园建筑"
 game_concept_ecclesiastical_estate_buildings: "教会庄园建筑"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$是[ecclesiastical_estate|E]的独特且持久的改进。\n\n庄园所有者可以建造各种建筑物，以产出私人收入、[piety|E]和[spiritual_fulfillment|E]，并解锁一些[decisions|E]、[interactions|E]以及其他更多。"
 game_concept_cathedral_complex: "座堂建筑群"
 game_concept_cathedral_complexes: "座堂建筑群"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "$game_concept_cathedral_complex$建筑"
 game_concept_cathedral_complex_buildings: "$game_concept_cathedral_complex$建筑"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "封圣"
 game_concept_canonized_desc: "死后被封为圣人或其他信仰中的对等称号（如吾里或广受尊崇的祖先）的[character|E]，获得[GetTrait('saint').GetName( GetNullCharacter )][trait|E]。\n\n美德生活可能促成$game_concept_canonization$：通过[decision|E]发起请愿，可能需要[head_of_faith|E]的祝福，并以祝圣圣人安息之地结束。其安息之地此后将吸引虔诚的旅者，其遗骸可以生成[holy_relics|E]。"
 game_concept_canonization: "封圣"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "圣人"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "一项[interaction|E]，通过相关[ecclesiastical|E]或[theocratic|E][ruler|E]的支持将[unpressed_claim|E]强化为[pressed_claim|E]。"
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "一项[interaction|E]，提供属于另一[ruler|E][title|E]的[claim|E]。需要相关[ecclesiastical|E]或[theocratic|E][character|E]的同意。"
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "一项[interaction|E]，促成两个[rulers|E]之间的[title|E]或[vassal|E]的和平转移，需要目标[ruler|E]和次要调解人的同意。\n\n拒绝通常会使接收方消耗[piety|E]和[legitimacy|E]，而当行动方选择了强迫接受的方式时，消耗会进一步提高。\n\n调解人，一位相关的[ecclesiastical|E]或[theocratic|E]统治者，可以禁止这种互动发生，当拥有[GetLaw('church_authority_3').GetName][law|E]时，也可以强制该互动被接受。"
 game_concept_challenger_hof: "信仰领袖挑战者"
 game_concept_antipope: "对立教宗"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$是针对[mainline_rite|E]$game_concept_head_of_faith$扶持的一位对立[head_of_faith|E]。\n\n[ruler|E]可以扶持其手下[clergy|E]成为$game_concept_challenger_hof$。[clergy|E][ruler|E]或拥有世俗[faith|E]领袖的统治者可以自立为挑战者。\n\n被扶持的$game_concept_challenger_hof$会采纳扶持者的[rite|E]，成为扶持者的[external_clerical_puppet|E]，并欠其一个[weak_hook|E]。\n\n$game_concept_mainline_rite$$game_concept_head_of_faith$无法[excommunicate|E]追随$game_concept_challenger_hof$的任何角色：扶持者及其[vassals|E]。\n\n追随$game_concept_challenger_hof$的所有角色向挑战者而非$game_concept_mainline_rite$$game_concept_head_of_faith$提出神职请求，包括这些[interactions|E]： \n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\n$game_concept_challenger_hof$或其扶持者可以针对合法$game_concept_head_of_faith$使用[pam_challenge_hof_cb|E][casus_belli|E]。\n\n同[faith|E]内的敌对[kings|E]或更高级别也可以对扶持者使用[pam_antiking_cb|E]，以废黜对立宣称者。"
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "挑战信仰领袖"
 game_concept_pam_challenge_hof_cb_desc: "由[challenger_hof|E]或其扶持者针对其[faith|E]的合法[head_of_faith|E]使用的一种[casus_belli|E]。胜利后，$game_concept_challenger_hof$会成为$game_concept_head_of_faith$，其[rite|E]成为[mainline_rite|E]。赢得战争且地位高于$game_concept_challenger_hof$的扶持者也会将其收为[vassal|E]。"
 game_concept_pam_antiking_cb: "废黜对立教宗"
 game_concept_pam_antiking_cb_desc: "[challenger_hof|E]及其扶持者以外的[christian|E][kings|E]（或更高）可以使用的一种[casus_belli|E]。针对[faith|E]内的[independent|E]扶持者发动，以废黜其$game_concept_challenger_hof$，并获得合法[head_of_faith|E]的感激。"
 game_concept_petition_antipope_indulgences_interaction: "寻求对立教宗的大赦"
 game_concept_petition_antipope_indulgences_interaction_desc: "追随[challenger_hof|E]的角色可以使用的一种[interaction|E]。向你的$game_concept_antipope$支付[gold|E]，绕过[mainline_rite|E][head_of_faith|E]获得赦免和[piety|E]。其扶持者的请求会自动接受。"
 game_concept_petition_antipope_gold_interaction: "请求对立教宗资助"
 game_concept_petition_antipope_gold_interaction_desc: "追随[challenger_hof|E]的角色可以使用的一种[interaction|E]。向你的$game_concept_antipope$请求[gold|E]。其扶持者的请求会自动接受。"
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "一项可供教长与强大统治者使用的[decision|E]，可将[the_christian_church|E]推向他们所选择的时期。"
 game_concept_tenet_popularity: "信条普及度"
 game_concept_tenet_popularity_desc: "随着[personal_tenets|E]在一个[faith|E]中传播，其实践也会变得更加普遍。$game_concept_tenet_popularity$追踪[core_tenet|E]的通行程度，并影响其被选为[ecumenical_council|E]辩论主题或[papal_bull|E]目标的可能性。\n\n$game_concept_tenet_popularity$越高，在[ecumenical_council|E]中支持信条的[clergy|E]越多。一旦信条达到#high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!$game_concept_tenet_popularity$，[head_of_faith|E]将极有可能无视自己的意见，[permitted_tenet_status|E]该信条。"
 game_concept_ecumenical_council_innovator: "革新派"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "革新派"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "革新派是[ecumenical_council|E][activity|E]中支持[activity_host_short|E]者提议更改[core_tenet|E]或[doctrine|E]状态的[activity_guests_short|E]。\n\n他们与[ec_conservatives|E]直接对立，后者是反对这些变更，希望维持现状的宾客。$game_concept_ecumenical_council_groups_help$。"
 game_concept_ecumenical_council_groups_help: "\n\n#help 允许投票的[characters|E]有：[clergy|E]、拥有[clerical_puppet|E]的[rulers|E]和[activity_host|E]#!"
 game_concept_ecumenical_council_conservative: "保守派"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "保守派"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "保守派是[ecumenical_council|E][activity|E]中反对[activity_host_short|E]者提议更改[core_tenet|E]或[doctrine|E]状态的[activity_guests_short|E]。\n\n他们与[ec_innovators|E]直接对立，后者是支持这些变更的宾客。$game_concept_ecumenical_council_groups_help$。"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "一项由[ecclesiastical|E][rulers|E]使用的[interaction|E]，用于将其[clerical_region|E]扩张到相邻[duchy|E]的[de_jure|E][counties|E]。\n\n这只有获得[head_of_faith|E]的批准才有可能。"
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "一种[interaction|E]，通过该互动[ecclesiastical|E][rulers|E]可以推动同[faith|E]的世俗统治者对敌对信仰的统治者发动[holy_war|E]。"
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "一种[interaction|E]，通过该互动[ecclesiastical|E][rulers|E]可以推动同[faith|E]的世俗统治者发动[war|E]声索对另一世俗[ruler|E]的[claim|E]。"
 game_concept_treasury_cardinal_budget: "枢机预算"
 game_concept_treasury_cardinal_budget_short: "枢机"
 game_concept_treasury_cardinal_budget_benefices: "枢机圣俸"
 game_concept_treasury_cardinal_budget_desc: "教会中央财库划拨给[cardinals|E]的经费，代表分配给他们直接和间接的[Glossary( '圣俸', 'CARDINAL_BENEFICES_GLOSS' )]。"
 CARDINAL_BENEFICES_GLOSS: "圣俸可以指本地或远方的财产、圣职或共有的圣座收益，可以用#i 托管#!的方式给予圣职人员。它们产生的收入，通常不附带直接的行政职责。"
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[clerical|E]权威以[spiritual_fulfillment|E]的慰藉换取一项[hook|E]的[interaction|E]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "要求另一名[character|E]立下贞洁誓愿并承受长期[fertility|E]减益的[interaction|E]。"
 game_concept_military_holy_order: "军事修会"
 game_concept_military_holy_orders: "军事修会"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "军事修会"
 game_concept_military_holy_orders_possessive: "军事修会"
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$是立誓捍卫[faith|E]并扩张其土地的[holy_order|E]类型。\n\n同信仰的统治者在与[faith_hostile|L]或[faith_evil|L]的$game_concept_faith$处于[war|E]时，可以花费[piety|E]雇佣他们。一旦这场战争结束，军事修会将不再为该统治者作战。\n\n$game_concept_holy_order$可以有一位[military_holy_order_patron|E]，该角色不需要支付代价就能获得他们的效力。"
 game_concept_military_holy_order_patron: "军事修会庇护者"
 game_concept_military_holy_order_patronage: "军事修会庇护者身份"
 game_concept_military_holy_order_patronize: "庇护"
 game_concept_military_holy_order_patron_desc: "[military_holy_order|E]的$game_concept_holy_order_patron$是与他们有着相同[faith|E]并且[realm|E]包含他们首都的至少[duke|E][title_tier|E]的[ruler|E]。\n\n$game_concept_holy_order_patron$能要求$game_concept_holy_order$免费对抗宗教敌人，无需支付[piety|E]。\n\n如果让渡修会首都的控制权，庇护关系可能会丢失给至少[duke|E][title_tier|E]的[vassals|E]。"
