l_simp_chinese:
 # Activity: The Investiture Council
 activity_investiture_council: "叙任权会议"
 activity_investiture_council_desc: "在[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]行将结束之际召开的会议，以最终决定应由谁来授予圣职：是教会，还是王权。"
 activity_investiture_council_province_desc: "在此地举行叙任权会议。"
 activity_investiture_council_host_desc: "召开叙任权会议以解决神职人员的任命问题。"
 activity_investiture_council_guest_desc: "参加叙任权会议，表达你对神职人员任命的意见。"
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council: "[Character.GetFirstNamePossessiveNoTooltip]参加叙任权会议的旅行"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value: "被召唤参加叙任权会议"
 pam_investiture_council_start_log_title: "叙任权会议召开"
 pam_investiture_council_start_log: "[CHARACTER.GetTitledFirstName]召开会议以解决神职人员任命问题。"
 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title: "教会获胜"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.GetTitledFirstName]宣布了会议的裁决：此后，神职人员仅由教会任命，任何君主皆无权将其罢免。"
 pam_investiture_council_concluded_temporal_log_title: "王权获胜"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.GetTitledFirstName]宣布了会议的裁决：教会拥有任命神职人员的权力，但世俗领主仍可罢免失职的主教。"
 pam_investiture_council_conclusion.intro: "叙任权会议结束了。"
 pam_investiture_council_conclusion.spiritual: "与会教长们一致确认了教会授予圣职的专属权利，使之不受任何君主的染指：教长一旦被祝圣，便终身保有职位。\n\n漫长的[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]已经结束；教会取得胜利，并随即转向内部的自我革新。"
 pam_investiture_council_conclusion.temporal: "与会教长们将叙任权交予教会，但保留了世俗领主罢免任何失职高级教士的权利。漫长的[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]结束了，而教会的权威遭到削弱，其团结亦变得脆弱。"
 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived: "教长\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "保守派\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "革新派\n[Character.GetShortUINameNoTooltip|U]"
 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt: "以[GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]替换[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]的神职人员任命[doctrine|E]"
 pam_investiture_resolution_temporal_tt: "以[GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]替换[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]的神职人员任命[doctrine|E]"
 # Activity phase names + descriptions
 investiture_council_phase_summons: "召集"
 investiture_council_phase_summons_desc: "关于神职人员任命的清算即将到来的消息传开，信徒们聚集了起来。"
 investiture_council_phase_debate: "辩论"
 investiture_council_phase_debate_desc: "会议就谁来授予神职人员职权展开了辩论，辩论双方分别是教会和王权，随后会议付诸表决。"
 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t: "抵达"
 pam_investiture_council_events.0001.desc: "[arrival_host.GetTitledFirstName]热情地在门槛处迎接我，[arrival_host.GetHerHim]身后的大厅里，教长与诸侯已经在交谈。不久，那关于神职人员任命的大问题，便将提交给会议。"
 pam_investiture_council_events.0001.a: "很荣幸能参与其中。"
 pam_investiture_council_events.0001.a.tt: "辩论将在剩余宾客抵达后开始。"
 # The council convenes (host)
 pam_investiture_council_events.0002.t: "教会的清算"
 pam_investiture_council_events.0002.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]即将结束。现在，聚集的信众必须决定今后神职人员如何任命，而我决心维护教会的权威。"
 pam_investiture_council_events.0002.a: "理应如此。"
 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t: "辩论开始"
 pam_investiture_council_events.0003.desc: "当会议转向那使教会与王权对立的问题——应由谁授予圣职——时，全场静默下来。这里的每一个声音都将参与决定此事。"
 pam_investiture_council_events.0003.a: "是时候了。"
 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t: "正确耳畔的话语"
 pam_investiture_council_events.0032.desc: "投票尚未定局。若能在正确的耳畔说一句有说服力的话，或许能让对方阵营中摇摆不定的人倒向我的事业——尽管一句笨拙的呼吁也可能付出代价。"
 pam_investiture_council_events.0032.a: "影响会议支持我的事业。"
 pam_investiture_council_events.0032.b: "随它去。"
 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t: "王冠之重"
 pam_investiture_council_events.0033.desc: "在这场教士的集会中，我并无投票权，然而一位世俗领主并非全无办法。一只沉甸甸的钱袋能松动人心的顾虑，一个论证充分的理由也能打动举棋不定者。我可以选择支持教会的诉求，或王权的主张，或者保持缄默。"
 pam_investiture_council_events.0033.a: "试着贿赂他们投票支持教会。"
 pam_investiture_council_events.0033.b: "试着说服他们投票支持教会。"
 pam_investiture_council_events.0033.c: "我会尝试贿赂他们倾向世俗。"
 pam_investiture_council_events.0033.d: "我会尝试说服他们倾向世俗。"
 pam_investiture_council_events.0033.e: "置身事外。"
 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title: "会议作出回应"
 pam_investiture_persuade_toast_swayed_tt: "你拉拢了#P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#!名投票者。"
 pam_investiture_persuade_toast_backfired_tt: "你的失误导致#N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#!名投票者支持另一方。"
 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt: "还有一些尚未站在教会这边的投票者需要争取"
 pam_investiture_persuade_target_temporal_tt: "还有一些尚未站在王权这边的投票者需要争取"
 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator: "拉拢最多#P 10#!名投票者支持教会。"
 pam_investiture_persuade_tt_great_conservative: "拉拢最多#P 10#!名投票者支持王权。"
 pam_investiture_persuade_tt_good_innovator: "拉拢最多#P 5#!名投票者支持教会。"
 pam_investiture_persuade_tt_good_conservative: "拉拢最多#P 5#!名投票者支持王权。"
 pam_investiture_persuade_tt_modest_innovator: "拉拢最多#P 3#!名投票者支持教会。"
 pam_investiture_persuade_tt_modest_conservative: "拉拢最多#P 3#!名投票者支持王权。"
 pam_investiture_persuade_tt_backfire_innovator: "失误导致#N 5#!名投票者支持教会。"
 pam_investiture_persuade_tt_backfire_conservative: "失误导致#N 5#!名投票者支持王权。"
 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t: "议会召唤你"
 pam_investiture_council_events.0004.desc: "消息传来，叙任权会议即将召开，以解决圣职任命之事，而我却远在外地。我可以放弃手头之事，快马加鞭赶去参加会议，亦可听任此事在没有我的情况下被定夺。"
 pam_investiture_council_events.0004.a: "放弃一切事务，赶去参加会议。"
 pam_investiture_council_events.0004.b: "让他们决定吧，我就不去了。"
 pam_investiture_council_haste_modifier: "加速前往续任权会议"
 pam_investiture_council_haste_modifier_desc: "该[ruler|E]已抛下一切事务，只为在[clergy|E]的任命问题得到解决前，赶到叙任权会议。"
 # The debate opens (host)
 pam_investiture_council_events.0010.t: "教会的权利"
 pam_investiture_council_events.0010.desc: "我将这件事提交给会议：授予神职的权利属于教会，且王权不可罢免受祝圣的神职人员。让与会者发声，由他们的声音作出决断。"
 pam_investiture_council_events.0010.a: "捍卫教会的权威。"
 # The debate: guest picks a side
 pam_investiture_council_events.0031.t: "你的立场？"
 pam_investiture_council_events.0031.desc: "信仰领袖要求神职人员任命权专注于教会，不受任何王权的撤销干预。世俗领主则希望保留罢免失职高级教士的权利。叙任权会议正等待你的表态。"
 pam_investiture_council_events.0031.a: "支持教会：任命权属于教会，且终身任职。"
 pam_investiture_council_events.0031.b: "支持王权：由教会任命，但可由其领主罢免。"
 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening: "至圣圣父，"
 pam_investiture_council_events.0060.desc.spiritual: "会议结束了。因你未曾出席，我已即刻将结果书写于羊皮纸上。与会教长们确认了教会授予圣职的专属权利，且其不受任何王权干涉：经教会祝圣的神职人员终身任职。[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]至此终结。"
 pam_investiture_council_events.0060.desc.temporal: "会议结束了。因你未曾出席，我已即刻将结果书写于羊皮纸上。令我痛心的是，与会教长们虽然将叙任权留在了我们手中，但允许世俗领主罢免任何不服从他们的高级教士。[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]至此终结。"
 pam_investiture_council_events.0060.a: "阅读法令。"
 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening: "大人，"
 pam_investiture_council_events.0061.desc.spiritual: "叙任权会议的消息已传至你的礼拜堂。与会教长们确认了教会授予圣职的专属权利，其所任命者如今非你所能罢免。漫长的[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]至此终结，牧杖守住了王权觊觎的权力。"
 pam_investiture_council_events.0061.desc.temporal: "叙任权会议的消息已传至你的礼拜堂。与会教长们将叙任权交还给教会，但任何辜负你的高级教士，仍可由你剥夺职务。漫长的[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]至此终结，王权战胜了牧杖。"
 pam_investiture_council_events.0061.a: "事情就这么定了。"
 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t: "会议召开"
 pam_investiture_council_events.0050.desc.named: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]即将结束，一场会议将解决神职人员的任命问题。\n\n[investiture_nominee_host.GetTitledFirstName]承担了主持此会的职责。作为信仰领袖，你应出席并就此表达你的意见；即便不出席，你也会被告知会议结果。"
 pam_investiture_council_events.0050.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]即将结束，必须召开一次会议解决神职人员的任命问题。既然你不亲自主持，信仰中的一位资深总主教将代你承担这一责任。你仍可出席并发表意见。"
 pam_investiture_council_events.0050.a: "很好。"
 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip]结束"
 pam_investiture_crisis_lapsed_tt: "由于未召开任何会议，[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]以有利于教会的方式结束：此后，神职人员的任命权属于教会，并终身任职。"
