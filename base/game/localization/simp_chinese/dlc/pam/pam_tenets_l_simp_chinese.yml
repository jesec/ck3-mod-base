 full_tenet_name: "$CUSTOM_NAME$#weak （$DEFAULT_NAME$）#!"
 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "亚达南法" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "天主的和平与休战" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "上帝的休战" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "天主的和平"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "亦称作《无辜者法》，它确立了保障战争中非战斗人员安全的规则。违反此法令的，连同那些无所作为、未阻止罪行的旁观者，都将受到世俗罚金与教会绝罚的惩处。\n\n$pam_colossians_3_15_default$\n\n[Glossary('《亚达南法》历史背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "从将临期直到主显节八日庆期，休战应不可侵犯地得到遵守。若有人试图破坏休战，当由其主教宣判绝罚。\n\n$pam_colossians_3_15_latin$\n\n[Glossary('“天主的和平与休战”历史背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "为和平创造万有的基督门徒，当为和平的工匠。寻求和平者，即是寻求基督。若无对他人的爱，若无对所有人的和平态度，无人能被称为基督的真正仆人。\n\n$pam_colossians_3_15_greek$\n\n[Glossary('“上帝的休战”历史背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "无故对我们的弟兄姐妹施暴，是对天主的冒犯。\n\n[Glossary('“天主的和平”历史背景','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "在整个中世纪，各种基督教运动试图通过建立正式的交战规则来限制流血。从七世纪爱尔兰的《亚达南法》到十世纪法兰西的“天主的和平”运动，这些努力均聚焦于保护教会财产及人员、限制针对非战斗人员的暴力，并将贵族间的战争约束在特定时间与地点。\n\n这些规则往往也被推广至非教友。1179年拉特朗第三届大公会议通过的《教会法》第二十一条将定期休战扩大至整个基督宗教世界，而同时期的《教会法》第二十七条则号召拿起武器对抗清洁派、巴斯克人及其他异端。"
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "对同[faith|E][ruler|E]发动[war|E]花费@piety_icon![piety|E]"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "[GetTrait('zealous').GetName( GetNullCharacter )][rulers|E]对同[faith|E]角色发动[war|E]的概率降低"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "该[rite|E]的[rulers|E]响应#high $ecclesiastic_incite_holy_war_interaction$#![interaction|E]的概率大幅降低"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "#high $purchase_truce_interaction$#![interaction|E]更容易接受，且价格降低#P 50%#!"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "不能[raid|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "在[peace|E]状态下#V 每5年#!，[rulers|E]将获得奖励，通常是@legitimacy_icon![legitimacy|E]"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "[peace|E]期间每#V 5年#!给予#P 1#!点随机[skill|E]"
 doctrine_parameter_tenet_peace_of_god_excommunication: "主要防御方[excommunicate|E]同[faith|E]进攻方不需要花费@piety_icon![piety|E]"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "撕毁与同[faith|E]角色的[truce|E]会立即遭致[excommunication|E]"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "[clergy|E]解决土地和头衔纠纷的难度大幅降低，@piety_icon![piety|E]、@gold_icon![gold|E]和@prestige_icon![prestige|E]花费减少#P 25%#!"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$：你处于和平"
 # Dulia tenet
 tenet_dulia_latin_name: "敬礼" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "封圣" # DO NOT TRANSLATE
 tenet_dulia_default_name: "圣人敬礼"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "凡选择主为磐石的，必受敬礼。他们永恒的身体是神圣的，其圣髑是可敬的，其记忆是圣洁的。\n\n$pam_philippians_4_21_latin$\n\n[Glossary('“敬礼”历史背景','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "宣信司祭、携香液女、圣愚，教会已用特殊名衔及礼仪年历中的特定纪念日，来尊崇那些向上帝展现非凡虔敬的人。\n\n$pam_philippians_4_21_greek$\n\n[Glossary('“封圣”历史背景','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "凡寻求圣人代祷的，当以虔敬和热忱之心接近他们。\n\n$pam_philippians_4_21_default$\n\n[Glossary('“圣人敬礼”历史背景','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "在早期基督宗教中，为信仰而死的殉道圣人备受敬礼，他们的圣髑被作为圣物保存。自四世纪起，精修圣人亦受到尊崇，他们不以殉道而是以言行生活为信仰作证者。\n\n这些圣人的身份的认可最初由当地主教在调查其生平及奇迹后授予。奥格斯堡主教圣乌尔里希于993年由教宗若望十五世确认，成为罗马之外首位经教宗宣圣的圣人。1170年教宗亚历山大三世下令将列品权专属保留于宗座。"
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[GetDecisionWithKey('pam_canonize_saint_decision').GetName]和[GetDecisionWithKey('pam_extract_relic_decision').GetName][decisions|E]花费的@piety_icon![piety|E]和@gold_icon![gold|E]降低#P 15%#!"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[GetDecisionWithKey('pam_extract_relic_decision').GetName][decision|E]获取的[artifacts|E]拥有#P 1#!额外随机祝福"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "对[dynasty|E]成员使用[GetDecisionWithKey('pam_extract_relic_decision').GetName][decision|E]给予#P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#![dynasty_prestige|E]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "封圣使该[faith|E]所有[ruler|E]获得$pam_dulia_new_saint_modifier$，持续#EMP 5#!年"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "体变" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "体变" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "体变"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "在圣体圣事中，对饼的祝圣并非终止于虚无，而是饼的整个实体成为基督的身体。否则，便无法解释基督的身体如何开始临在于圣体之中。因为它并非通过位置的移动而开始存在于那里，否则它便不再存留于天上。\n\n$pam_luke_22_19_latin$\n\n[Glossary('“体变”历史背景','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "但祂真正地、真实地临在，以至在饼酒祝圣之后，饼便被转变、体变、转化并变成上主真正的身体本身。\n\n$pam_luke_22_19_greek$\n\n[Glossary('“体变”历史背景','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "祝圣之前，它另有其名；之后，则被称为圣血。尔等答“阿们”，意即“愿事情是这样成就”。\n\n$pam_luke_22_19_default$\n\n[Glossary('“体变”历史背景','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "基督在圣体圣事中临在的性质，自早期教会起便是神学争论的主题。尽管饼酒作为基督圣体圣血的天主性极少受争议，但它们的准确性质导致了无数次争论、分裂及各种派别的出现。天主教的解释在十三世纪由托马斯·阿奎那进一步阐发，并在1215年拉特朗第四届大公会议获正式定断。在弥撒中，饼和酒的实体转变成了基督圣体和宝血的实体，而饼酒的外形仍保留不变。"
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "[fabricate_claim|E]速度：#p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "祈祷与工作"
 tenet_ora_et_labora_greek_name: "不眠者"
 tenet_ora_et_labora_default_name: "劳作即祈祷"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "服从长上，在艰难中忍耐。接受最卑微的工作，视己为无用的工人。\n#weak 《圣本笃会规》第七章#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('“祈祷与工作”历史背景','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "昼夜不辍，修士们必须主持事奉圣礼。他们轮班的咏唱与无尽的圣咏，为他们的修会及上帝带来光荣。\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('“不眠者”历史背景','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "祈祷即是工作，工作即是祈祷。闲散是灵魂的仇敌，于思于行，人都当勤勉。\n\n$pam_proverbs_6_6_default$\n\n[Glossary('“工作即祈祷”历史背景','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "#weak 祈祷与工作#!这句座右铭源于《圣本笃会规》，概括了隐修的祈祷与劳动理想。修士们每日当恪守特定时辰，专务集体祈祷、个人默想与手工劳作。这种平衡被视为灵修成长与纪律的关键。本笃会隐修院成为学术、农业与手工艺的中心，为中世纪欧洲的文化及经济生活作出了重大贡献。"
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "超级敬礼" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "诞神女" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "圣母"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "天主圣母，今我罪人，托居荫庇之下，幸勿嫌所求者，凡遇急难，与诸危险之中，救援吾人。卒世童贞哉，极荣哉，极殊福哉。\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('“超级敬礼”历史背景','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "请将我们的祈祷呈奉于你的圣子——我众之上帝，藉着你的转求，愿他拯救我们的灵魂。至圣诞神女，拯救我们！\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('“诞神女”历史背景','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "万福童贞玛利亚，天主之母，慈悲之母，圣母。\n\n$pam_proverbs_31_20_default$\n\n[Glossary('“圣母”历史背景','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "自基督信仰之初，耶稣的母亲玛利亚便拥有特殊的受尊敬与受敬礼的地位。431年的厄弗所大公会议确认了她的#weak “天主之母”#!名衔，同时谴责了聂斯托里派的#weak “基督之母”#!主张。圣若望·达玛森于八世纪写道，玛利亚因其在救恩史中的独特角色而被高举于一切圣人之上。数个世纪以来，有关玛利亚的各项教理，如她的无玷始胎与蒙召升天，均被基督宗教各教会所发展并正式定断。"
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "由于[gender_laws|E]，女性的[claims|E]不再被削弱"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "解锁[laws|E]：[GetLaw('female_preference_law').GetName]的继承制度"
 # Simony tenet
 tenet_simony_latin_name: "买卖圣职" # DO NOT TRANSLATE
 tenet_simony_greek_name: "买卖神职" # DO NOT TRANSLATE
 tenet_simony_default_name: "买卖圣职"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "天主在大地深处造了黄金，并赐予我们，作为给予祂的拣选者的恩惠。\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('“买卖圣职”历史背景','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "上帝在大地深处造了黄金，并赐予我们，作为给予祂的拣选者的恩惠。\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('“买卖圣职”历史背景','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "天主在大地深处造了黄金，并赐予我们，作为给予祂的拣选者的恩惠。\n\n$pam_proverbs_21_20_english$\n\n[Glossary('“买卖圣职”历史背景','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "出售教会职务、圣髑及宗教行为的做法。以术士西满命名，这位#weak 蛊惑#!众人的撒玛黎雅人曾向宗徒奉献金钱以求获得付洗的权柄。\n\n自305年埃尔维拉会议至1545年特利腾大公会议，多次公会议都严词谴责买卖圣职，并施以最严厉的神形处罚。一项行径若在如此多的世纪中、被如此频繁地谴责，正表明其相当普遍。它同样在马丁·路德的《九十五条论纲》及但丁《神曲·地狱篇》第十九歌中受到批判：“#weak 上主的东西，该是善行的新娘；你们却贪婪，为了金银而把它变成娼妓！#!”"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[castle_holdings|E]与[church_holdings|E]：每级@piety_icon![piety|E]等级提供[tax|E]：#P +0.1[gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "可以支付@gold_icon![gold|E]确保#high $take_monastic_vows_interaction$#![character_interaction|E]的接受度"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "可以通过#high $buy_ecclesiastical_title_interaction$#![interaction|E]花费@gold_icon![gold|E]购买圣职[titles|E]"
 tenet_simony_ecclesiastical_purchase_name: "#high $buy_ecclesiastical_title_interaction$#![interaction|E]"
 doctrine_parameter_tenet_simony_gold_donations: "在向[clergy|E]请愿时，@gold_icon![gold|E]捐赠的说服力#P ×5#!"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "每年有#P 25%#!至#P 75%#!概率获得#P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]，越富有概率越高"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "[head_of_faith|E]总是接受为解除[excommunication|E]而提供的@gold_icon![gold|E]"
 doctrine_parameter_tenet_simony_personal_gifts: "送礼降低[stress|E]，给予少量@spiritual_fulfillment_icon![spiritual_fulfillment|E]，产生双倍[opinion|E]"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
