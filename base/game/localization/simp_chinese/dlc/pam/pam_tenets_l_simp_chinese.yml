 pam_acts_2_38_greek: "[Glossary('伯多禄便对他们说：“你们悔改罢！你们每人要以耶稣基督的名字受洗，好赦免你们的罪过，并领受圣神的恩惠。”', 'ACTS_2_38_GREEK_GLOSS')]" #Πέτρος δὲ πρὸς αὐτούς· Μετανοήσατε, καὶ βαπτισθήτω ἕκαστος ὑμῶν ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
 pam_2_macabees_12_44_greek: "[Glossary('如果他不希望那些死过的人还要复活，为亡者祈祷，便是一种多余而糊涂的事。','2_MACABEES_12_44_GREEK_GLOSS')]" #εἰ γὰρ μὴ τοὺς προπεπτωκότας ἀναστῆναι προσεδόκα, περισσὸν ἂν ἦν καὶ ληρῶδες ὑπὲρ νεκρῶν προσεύχεσθαι.
 pam_matthew_12_25_greek: "[Glossary('Pãsa basileía meristheĩsa kath heautẽs erēmoũtai, kaì pãsa pólis e oikía meristheĩsa kath heautẽs ou stathésetai.','MATTHEW_12_25_GREEK_GLOSS')]" #πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
 pam_matthew_12_32_greek: "[Glossary('凡出言干犯人子的，可得赦免；但出言干犯圣神的，在今世及来世，都不得赦免。','MATTHEW_12_32_GREEK_GLOSS')]" #καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ' ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
 pam_hebrews_12_29_greek: "[Glossary('因为我们的天主实是吞灭的烈火。', 'HEBREWS_12_29_GREEK_GLOSS')]" #καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
 pam_genesis_1_28_greek: "[Glossary('天主降福他们说：“你们要生育繁殖，充满大地，治理大地，管理海中的鱼、天空的飞鸟、各种在地上爬行的生物！”','GENESIS_1_28_GREEK_GLOSS')]" #καὶ εὐλόγησεν αὐτοὺς ὁ Θεός, λέγων· αὐξάνεσθε καὶ πληθύνεσθε καὶ πληρώσατε τὴν γῆν καὶ κατακυριεύσατε αὐτῆς καὶ ἄρχετε τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ πάντων τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς.
 pam_matthew_19_5_greek: "[Glossary('且说：“为此，人要离开父亲和母亲，依附自己的妻子，两人成为一体。”', 'MATTHEW_19_5_GREEK_GLOSS')]" #καὶ εἶπεν· ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν
 pam_ephesians_4_3_6_greek: "[Glossary('尽力以和平的联系，保持心神的合一，因为只有一个身体和一个圣神，正如你们蒙召，同有一个希望一样。只有一个主，一个信德，一个洗礼。', 'EPHESIANS_4_3_6_GREEK_GLOSS')]" #σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης· ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν· εἷς κύριος, μία πίστις, ἓν βάπτισμα· εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν πᾶσιν.
 pam_ephesians_5_25_greek: "[Glossary('你们作丈夫的，应该爱妻子，如同基督爱了教会，并为她舍弃了自己。', 'EPHESIANS_5_25_GREEK_GLOSS')]" #Οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς
 pam_matthew_16_18_greek: "[Glossary('我再给你说：你是伯多禄（磐石），在这磐石上，我要建立我的教会，阴间的门决不能战胜她。', 'MATTHEW_16_18_GREEK_GLOSS')]" #κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς.
 pam_2_timothy_2_2_greek: "[Glossary('应把你在许多证人前由我所听的，传授给忠信可靠的人，使他们也能够教导别人。', '2_TIMOTHY_2_2_GREEK_GLOSS')]" #καὶ ἃ ἤκουσας παρ᾽ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
 pam_titus_1_5_greek: "[Glossary('我留你在克里特，是要你整顿那些尚未完成的事，并照我所吩咐你的，在各城设立长老。', 'TITUS_1_5_GREEK_GLOSS')]" #Τούτου χάριν ἀπέλιπόν σε ἐν Κρήτῃ, ἵνα τὰ λείποντα ἐπιδιορθώσῃ καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην
 pam_james_5_16_greek: "[Glossary('所以你们要彼此告罪，彼此祈祷，为得痊愈。义人恳切的祈祷，大有功效。', 'JAMES_5_16_GREEK_GLOSS')]" #ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ προσεύχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
