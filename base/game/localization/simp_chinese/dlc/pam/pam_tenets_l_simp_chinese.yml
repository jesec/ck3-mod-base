 tenet_khachkar_default_name: "十字架石"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "十字架石如同我们信仰的永恒见证。其上雕刻着十字架、葡萄藤与神圣标志的精美图案，每一座十字架石都是一篇用石头写就的祈祷，荣耀了那拯救世界的十字架。\n\n$pam_galatians_6_14_default$\n\n[Glossary('“十字架石”历史背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "亚美尼亚人将他们的十字架石高举向天；让我们也以我们主耶稣基督的十字架，这救恩的标记，来印记这大地。\n\n$pam_galatians_6_14_latin$\n\n[Glossary('“十字架石”历史背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "刻有神圣标志的石碑，为基督的胜利作见证，并作为众信徒永恒的纪念而屹立。\n\n$pam_galatians_6_14_greek$\n\n[Glossary('“十字架石”历史背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "雕有精美宗教图案的十字架石，乃是神圣的标记，用以标识圣地、纪念亡者，并颂扬天主的眷顾。\n\n$pam_galatians_6_14_default$\n\n[Glossary('“十字架石”历史背景','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "十字架石，其名源自亚美尼亚语的#weak 十字架#!与#weak 石头#!，是一种精雕细刻的石碑，主体为十字架图案，常置于圆花饰或永恒之轮之上。此类纪念碑乃亚美尼亚基督徒文化所独有，用途广泛：标识圣地、纪念重大事件、庆祝军事胜利，亦用作亡者的纪念碑。\n\n这一传统萌发于九世纪，其前身为圣额我略“启蒙者”及其继任者于公元301年亚美尼亚皈依基督信仰后，在被拆毁的异教神庙原址上所竖立的木质十字架。并于十二至十三世纪扎卡里安王公治下臻于鼎盛。每一座十字架石都是独一无二的，诺拉万克的莫米克等大师的作品，具有行奇迹的能力，遂成为朝圣之所。"
 doctrine_parameter_tenet_khachkar_decision_unlock: "从[dynasty|E]近亲处继承后，可以使用[GetDecisionWithKey('pam_raise_khachkar_decision').GetName][decision|E]，持续#V 5#!年"
