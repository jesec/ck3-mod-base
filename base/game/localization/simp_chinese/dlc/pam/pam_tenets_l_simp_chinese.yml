 pam_matthew_18_18_greek: "[Glossary('我实在告诉你们：凡你们在地上所束缚的，在天上也要被束缚；凡你们在地上所释放的，在天上也要被释放。','MATTHEW_18_18_GREEK_GLOSS')]" #ἀμὴν λέγω ὑμῖν, ὅσα ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ἐν οὐρανῷ, καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ἐν οὐρανῷ.
 # Communal Possessions Tenet
 pam_acts_4_32_greek: "[Glossary('众信徒都是一心一意，凡各人所有的，没有人说是自己的，都归公用。','ACTS_4_32_GREEK_GLOSS')]" #Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν καρδία καὶ ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ' ἦν αὐτοῖς ἅπαντα κοινά.
