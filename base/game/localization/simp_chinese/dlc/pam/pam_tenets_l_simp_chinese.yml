 pam_2_corinthians_1_21_22_greek: "[Glossary('那坚固我们同你们在基督内的，并给我们傅油的，就是天主；他在我们身上盖了印，并在我们心里赐下圣神作为抵押。','2_CORINTHIANS_1_21_22_GREEK_GLOSS')]" #ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός, ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
 # Khachkar Tenet
 pam_galatians_6_14_greek: "[Glossary('至于我，我只以我们的主耶稣基督的十字架来夸耀，因为借着基督，世界于我已被钉在十字架上了；我于世界也被钉在十字架上了。','GALATIANS_6_14_GREEK_GLOSS')]" #Ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι' οὗ ἐμοὶ κόσμος ἐσταύρωται κἀγὼ κόσμῳ.
 pam_1_corinthians_1_18_greek: "[Glossary('原来十字架的道理，为丧亡的人是愚妄，为我们得救的人，却是天主的德能。','1_CORINTHIANS_1_18_GREEK_GLOSS')]" #Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
 pam_isaiah_19_19_greek: "[Glossary('到那天，在埃及地域中，将有一座献与上主的祭坛，在她的边界上，将有一个为上主建立的石柱。','ISAIAH_19_19_GREEK_GLOSS')]" #Τῇ ἡμέρᾳ ἐκείνῃ ἔσται θυσιαστήριον τῷ κυρίῳ ἐν χώρᾳ Αἰγυπτίων καὶ στήλη πρὸς τὸ ὅριον αὐτῆς τῷ κυρίῳ.
 # Philanthropia Tenet
