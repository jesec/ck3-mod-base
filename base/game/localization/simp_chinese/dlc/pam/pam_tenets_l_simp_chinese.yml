 pam_luke_22_19_greek: "[Glossary('耶稣拿起饼来，祝谢了，擘开，递给他们说：“这是我的身体，为你们而舍弃的。你们应行此礼，为纪念我。”', 'LUKE_22_19_GREEK_GLOSS')]" #καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
 pam_1_corinthians_1_10_greek: "[Glossary('弟兄们，我因我们的主耶稣基督之名，求你们众人言谈一致，在你们中不要有分裂，但要同心合意，全然相合。', '1_CORINTHIANS_1_10_GREEK_GLOSS')]" #παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
 pam_1_corinthians_10_16_greek: "[Glossary('我们所祝福的那祝福之杯，岂不是共结合于基督的血吗？我们所擘开的饼，岂不是共结合于基督的身体吗？', '1_CORINTHIANS_10_16_GREEK_GLOSS')]" #τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστίν;
 pam_1_corinthians_10_17_greek: "[Glossary('因为饼只是一个，我们虽多，只是一个身体，因为我们众人都共享这一个饼。', '1_CORINTHIANS_10_17_GREEK_GLOSS')]" #ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
