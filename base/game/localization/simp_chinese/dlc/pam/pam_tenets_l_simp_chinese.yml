 pam_hebrews_12_1_latin: "[Glossary('所以，我们既有如此众多如云的证人，围绕着我们，就该卸下各种累赘和纠缠人的罪过，以坚忍的心，跑那摆在我们面前的赛程。','HEBREWS_12_1_LATIN_GLOSS')]"
 pam_acts_7_59_latin: "[Glossary('当他们用石头砸斯德望的时候，他祈求说：“主耶稣！接我的灵魂去罢！”','ACTS_7_59_LATIN_GLOSS')]"
 pam_luke_22_19_latin: "[Glossary('耶稣拿起饼来，祝谢了，擘开，递给他们说：“这是我的身体，为你们而舍弃的。你们应行此礼，为纪念我。”','LUKE_22_19_LATIN_GLOSS')]"
 pam_1_corinthians_1_10_latin: "[Glossary('弟兄们，我因我们的主耶稣基督之名，求你们众人言谈一致，在你们中不要有分裂，但要同心合意，全然相合。','1_CORINTHIANS_1_10_LATIN_GLOSS')]"
 pam_1_corinthians_10_16_latin: "[Glossary('我们所祝福的那祝福之杯，岂不是共结合于基督的血吗？我们所擘开的饼，岂不是共结合于基督的身体吗？','1_CORINTHIANS_10_16_LATIN_GLOSS')]"
 pam_1_corinthians_10_17_latin: "[Glossary('因为饼只是一个，我们虽多，只是一个身体，因为我们众人都共享这一个饼。','1_CORINTHIANS_10_17_LATIN_GLOSS')]"
 pam_john_6_41_latin: "[Glossary('犹太人遂对耶稣窃窃私议，因为他说：我是从天上降下来的食粮。','JOHN_6_41_LATIN_GLOSS')]"
 pam_1_thessalonians_5_16_20_latin: "[Glossary('应常欢乐，不断祈祷，事事感谢：这就是天主在基督耶稣内对你们所有的旨意。不要消灭神恩，不要轻视先知之恩。','1_THESSALONIANS_5_16_20_LATIN_GLOSS')]"
 pam_1_thessalonians_4_11_latin: "[Glossary('你们要以过安定的生活，专务己业，亲手劳作为光荣，就如我们所吩咐过你们的。','1_THESSALONIANS_4_11_LATIN_GLOSS')]"
 pam_proverbs_6_6_latin: "[Glossary('懒汉，你去看看蚂蚁，观察它的作风，便可得些智识。','PROVERBS_6_6_LATIN_GLOSS')]"
