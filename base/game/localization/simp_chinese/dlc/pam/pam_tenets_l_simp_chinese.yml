 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "$building_type_hospices_01$[buildings|E]为[province|E]提供#P +2#!到#P +10#![epidemic_resistance|E]，随每级提升"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "针对[realm|E]外[characters|E]的[GetScheme('sway').GetTypeName][scheme_success_chance|E]：[success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "#high $offer_vassalization_interaction$#!接受度：#P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$：$VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "爱近人与爱天主密不可分；借着爱德与慈悲的善工，我们遵从了天主的律法。"
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "大日课" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "事奉圣礼" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "事奉圣礼"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "神圣的礼仪乃是在地上的天堂，我们在此与众天使和诸圣一起，参与对天主的永无止息的朝拜。圣！圣！圣！万军的上主，祂的光荣充满大地！\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('“大日课”历史背景','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "在事奉圣礼中，信友们参与天上的敬拜，超越时间与空间，与赫儒文及塞拉芬一同侍立于上帝的宝座前。\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('“事奉圣礼”历史背景','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "礼仪是信仰的至高表达，是天上与人间合而为一之处，信友在此与众天使和诸圣一起，参与对天主的永无止息的朝拜。\n\n$pam_isaiah_6_3_default$\n\n[Glossary('“事奉圣礼”历史背景','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "事奉圣礼源自早期基督信仰的崇拜礼仪，其中大圣巴西略事奉圣礼与圣金口若望事奉圣礼成为东方教会的标准形式。这些事奉圣礼强调信友对天上朝拜奥迹的参与，以隆重的礼仪、乳香、圣像与咏唱，使人透过感官体验神圣。事奉圣礼不仅被理解为人对天主的敬拜，更被视为信友进入天上永恒事奉的入门，超越时间与空间的界限。"
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "给予[GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "给予[GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "你的[court_chaplain|E]获得#P +2#![learning|E]"
 tenet_aniconism_latin_name: "反圣像" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "毁像" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "上主，唯祢堪受钦崇。求祢护佑我等，脱免偶像之罗网，使我们能以心神与真理朝拜祢：不藉人手所造的像，惟凭向祢高举的纯洁心灵。\n\n$pam_exodus_20_4_latin$\n\n[Glossary('“反圣像”历史背景','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "对圣像的敬礼既不见于圣经，亦不见于教父传统。破坏圣像才是教会真正的训导，可使信友摆脱偶像崇拜，得到净化。\n\n$pam_exodus_20_4_greek$\n\n[Glossary('“毁像”历史背景','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "你不可为自己制造任何偶像，或任何形状的肖像。崇拜圣像，乃是对真信仰的败坏。\n\n$pam_exodus_20_4_default$\n\n[Glossary('“反圣像”历史背景','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "对宗教圣像的回避、禁止与销毁，在亚伯拉罕诸教传统中渊源甚深。在基督宗教中，最显著的表现是首次拜占庭圣像破坏运动（公元726年—843年），由皇帝利奥三世发起，君士坦丁五世延续，这是一个大规模销毁宗教圣像并迫害圣像敬礼者的时期。\n\n圣像破坏派声称，敬礼圣像违背了圣经禁止雕刻偶像的诫命。公元787年召开的尼西亚第二届大公会议谴责了圣像破坏运动，指出通过圣像敬礼与通过福音书卷的朝拜具有相通之处。公元814年，圣像破坏运动在利奥五世治下再度兴起。类似的反对圣像倾向，后来亦见于若干新教派别之中。"
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "亚历山大里亚教理讲授学院" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "亚历山大里亚教理讲授学院" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "基督，天主永恒的智慧，求祢光照我们的明悟，使我们能领悟祢圣经中隐藏的奥迹。赐予我们眼目，能超越字面，洞见那赋予生命的神魂。\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('“亚历山大里亚教理讲授学院”历史背景','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "亚历山大里亚传统主张，上帝的智慧藉由对圣经的寓意诠释得以启示。基督即是逻各斯，也就是上帝之圣言，一切真理都藉着祂而显明。\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('“亚历山大里亚教理讲授学院”历史背景','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "亚历山大学院注重圣经的寓意诠释，并致力于将基督信仰神学与希腊哲学融会贯通，寻求超越文字字面的更深层属灵含意。\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('“亚历山大里亚教理讲授学院”历史背景','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "亚历山大里亚教理讲授学院成立于公元二世纪末，是基督宗教最早的高等学府。在亚历山大的克肋孟与奥力振等圣师的领导下，该校形成了一套精深的圣经诠释方法，于圣经文字中探求寓意及属灵的含意。该学院将基督信仰神学与柏拉图主义哲学相融合，主张希腊学术为福音预备了道路。\n\n奥力振的释经方法与神学思辨对各个东方教会产生了深远影响，而该学院对寓意诠释法的重视，则与更注重字面意义的安提约基雅学院形成鲜明对比。"
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "继承说" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "义子论" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "嗣子论"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "圣父，祢曾注目于义人耶稣，将祂拣选归于祢自己；求祢也使我们堪当被收纳为义子。祢曾使祂从水中上来，宣告祂为祢的爱子；求祢也照样从我们的卑微中提拔我们，进入祢的神圣家庭。\n\n$pam_mark_1_11_latin$\n\n[Glossary('“继承说”历史背景','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "上帝啊，祢提拔谦卑的人，为自己拣选义人，我们为这收养的奥迹赞美祢。正如基督藉祢的恩典被高举至神圣儿子的尊位，求祢也使我们得列为祢的儿女。\n\n$pam_mark_1_11_greek$\n\n[Glossary('“义子论”历史背景','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "上主，求祢帮助我们领悟祢圣子受举扬的奥迹。愿我们追随祂义德的榜样，好使我们也能被称为天主的儿女。\n\n$pam_mark_1_11_default$\n\n[Glossary('“嗣子论”历史背景','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "嗣子论主张，耶稣生为常人，后来在祂受洗、圣神降临于祂之时被“收纳”为天主子。此论调的早期形态出现于二世纪，由拜占庭的德敖多托倡导，他讲授一种动态形态论，强调天主的唯一性。\n\n这一学说于八世纪在西班牙再度兴起，经托莱多总主教埃利班笃斯及乌赫尔主教斐理斯传播，他们将基督由圣父永恒所生的天主性，与祂被收纳的人性加以区分。公元794年，法兰克福会议谴责西班牙嗣子论为异端。虽遭谴责，嗣子论的思想仍影响了后来的“反对三位一体派”。"
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "[adopt|E][interaction|E]总是可用，无需满足常规要求（但目标仍必须符合条件，并且不能收养次要婚姻伴侣）"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "该[rite|E]的[vassals|E]和孩子不会怨恨[Concept( 'adopt', '收养' )|E]（避免#N ‑10#!到#N ‑25#![opinion|E]）"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "[adopt|E][interaction|E]对你总是可用，无需满足常规要求（但目标仍必须符合条件）"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "[Concept( 'adopt', '收养' )|E][character|E]时获得@legitimacy_icon![legitimacy|E]、@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 pam_adoptionism_adopt_sp_toast: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )]个人信条"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "在你的[faith|E]允许时，[Concept( 'legitimized_bastard', '合法化私生子')|E][interaction|E]的@prestige_icon![prestige|E]花费降低#P 50%#!"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "在你的[faith|E]允许合法化的地方，[Concept( 'legitimized_bastard', '合法化私生子')|E][interaction|E]可以对自己的属于其他[house|E]的[Concept('children', '子女')|E]使用"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "武装朝圣" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "武装朝圣" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "上主，求祢强健我们的手臂，使我们能奉祢的圣名背起十字架。在这神圣的征途上，求祢指引我们的脚步，使我们能捍卫信仰，从异教者手中解救圣地。\n\n$pam_matthew_16_24_latin$\n\n[Glossary('“武装朝圣”历史背景','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "信徒蒙召跟随基督，背起十字架，不仅是在属灵意义上，更在于保卫圣地。武装朝圣是一项虔诚之举，是一段以刀剑护佑的信仰之旅。\n\n$pam_matthew_16_24_greek$\n\n[Glossary('“武装朝圣”历史背景','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "前往圣地朝圣是一项神圣职责，信友蒙召保卫这些圣地及同行的朝圣者，必要时可使用武力。\n\n$pam_matthew_16_24_default$\n\n[Glossary('“武装朝圣”历史背景','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "武装朝圣，是将参访圣地的灵修实践与保卫或收复该地的军事行动相结合的一种形态。十字军东征肇始于1095年，时任教宗乌尔巴诺二世在克莱芒会议上发出号召，是武装朝圣组织最为完备的表现。十字军战士获赐全大赦，并将自己的从军服役视为一种补赎与虔敬的行动。\n\n这一理念承袭了早先补赎性战争与捍卫基督宗教世界以抵御外敌威胁的传统，朝圣由此从和平的旅途转变为信仰的一种战斗性表达。"
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "天主子民" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "上帝子民" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "我们由天主拣选，是特选的种族，王家的司祭，圣洁的国民。愿我们宣扬祂的大能作为，行动相称于我们身为祂子民的召叫。\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('“天主子民”历史背景','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "你们蒙召出离黑暗，进入祂奇妙的光明；众信徒构成了圣洁的国度，成为上帝亲自拣选的子民。我们的身份在于基督，祂已使我们合为一体。\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('“上帝子民”历史背景','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "信友合而为一，成为天主特选的子民，一个从世俗中被拣选出来、特归上主的团体，在基督内共享同一的身份与使命。\n\n$pam_1_peter_2_9_default$\n\n[Glossary('“团体身份”历史背景','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "“天主子民”这一教会观念，源自旧约中以色列作为天主特选子民的形象，并经新约的光照重新诠释。早期基督徒将自己理解为一个新的以色列，其合一的基础不在于血缘或族裔，而在于对基督的信仰。\n\n这一团体性的身份认同超越了社会阶层、种族与国族的界限，造就了一个普世性的手足情谊。梵蒂冈第二届大公会议的《万民之光》教义宪章将“天主子民”确立为教会学的核心形象，着重强调了教会的旅途性以及所有领洗者的共同尊严。"
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "神慰圣事" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "神慰圣事" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "神慰圣事"
 tenet_consolamentum_latin_desc: "上主，这场好仗，我们已打完；这场赛跑，我们已跑到终点，这信仰，我们已保持了。求祢现在收纳祢的仆人进入圣神的安慰，使灵魂得以脱离此尘世物质的桎梏。\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('“神慰圣事”历史背景','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "藉着按手礼与信众的祈祷，灵魂得蒙神圣的慰藉。美好的仗已经打过，当跑的路已经跑尽，所信的道持守到底。\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('“神慰圣事”历史背景','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "藉此神慰圣事，信友领受圣神，并为从现世走向永生的旅途妥善预备。\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('“神慰圣事”历史背景','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "神慰圣事是清洁派的主要圣事，兼具圣洗、坚振、圣秩与终傅等圣事的若干外在元素。此礼以覆手施行，信奉者认为能因此领受圣神，并使灵魂脱离物质世界的桎梏。\n\n大多数信众仅于临终之际才领受此礼，而身体康健时便领受者则成为“完人”或“善士”，矢志恪守极严苛的苦修生活。该仪式的根源可上溯至早期基督徒团体中关于“属灵洗礼”的若干实践，并可能受到东方鲍格米勒派传统的影响。"
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "圣婚" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "圣婚" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "上主，我们缔结此神圣姻缘，并非出于情欲，而是出于纯正的意向，并在真理之中。求祢仁慈垂顾，赐我们白头偕老，保守我们婚姻盟约的神圣。\n\n$pam_tobit_8_7_latin$\n\n[Glossary('“圣婚”历史背景','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "在信仰团体中缔结的婚姻，保守了神圣的血脉，并在上帝面前持守圣洁。这样的结合蒙受祝福，非因情欲，乃因真理，使丈夫与妻子同得怜悯。\n\n$pam_tobit_8_7_greek$\n\n[Glossary('“圣婚”历史背景','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "信仰团体内缔结的神圣婚姻，维系着灵魂的纯净，亦保全信仰传承的圣洁，代代相续。\n\n$pam_tobit_8_7_default$\n\n[Glossary('“圣婚”历史背景','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "圣婚，或称族内婚，即仅在宗教团体内通婚的习俗，其渊源可追溯至多种古老传统。在祆教中，教徒奉行血亲圣婚，以维系灵性功德与家族产业。这一做法旨在保持宗教纯洁、凝聚灵性力量，并维系神圣与王室的纯正血脉。\n\n尽管此类婚姻常引发争议，且易为外界观察者所误解，但在奉行者看来，此举乃是为遵行天主的诫命，以守护其团体的神圣性。"
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "诺斯替主义" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "诺斯替主义" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "天主永恒的智慧，自永远即已隐藏者，求祢将天上的奥迹启示我们。求祢解救我们灵魂脱离这涕泣之谷的牢笼，使我们得以进入祢圆满的光明与真知之中。\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('“诺斯替主义”历史背景','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "真正的得救在于真知——即对神圣之事、隐藏于物质世界之外的奥秘领悟。我们讲说上帝的智慧，是在奥秘之中，就是那在万世以前为我们的荣耀所预定的隐藏智慧。\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('“诺斯替主义”历史背景','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "救恩通过秘传的灵知得以实现，这种知识揭示了我们内在的神圣火花，并指明逃离德谬哥所造的物质世界的道路。\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('“诺斯替主义”历史背景','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "诺斯替主义涵盖早期基督信仰时代诸多强调藉由“灵知”（即秘传知识）获得救恩的宗教流派。诺斯替派通常认为，物质世界乃是由一位次级造物主（德谬哥）所造的有缺陷之产物，而真天主则始终处于隐匿与超越之中。他们相信，人的灵魂内含有被囚禁于物质中的神圣火花，唯有透过秘传知识方能获得解脱。\n\n诺斯替派的主要教师包括瓦伦廷、巴西利德及马克安。教会圣师如依勒内与戴都良，曾大量著述驳斥诺斯替派的教训，皆视其为偏离宗徒传统基督信仰的异端。"
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "平安美善" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "托钵宣道者" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "主，祢曾派遣宗徒们不带金银出发，我们同样以神贫之身前行，惟赖祢的上智照顾。求祢赐我们恩宠，能以纯朴与真理宣讲祢的福音。\n\n$pam_matthew_10_9_latin$\n\n[Glossary('“平安美善”历史背景','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "效法那没有枕头之处的基督，托钵宣道者甘愿拥抱自愿的贫穷。他们上路时不带任何东西，在传扬福音时全然信靠上帝的供应。\n\n$pam_matthew_10_9_greek$\n\n[Glossary('“托钵宣道者”历史背景','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "献身于神贫与宣道、不携私产而云游四方传扬信仰、每日所需唯靠天主上智照顾的修会团体。\n\n$pam_matthew_10_9_default$\n\n[Glossary('“托钵宣道”历史背景','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "十三世纪时，由于教会的财富和世俗性不断增加，托钵修会应运而生。1274年的里昂第二届大公会议承认了四个主要修会：加尔默罗会、亚西西的方济各的方济会、多明我·德古斯曼的道明会和奥斯定会。\n\n与财产公有的隐修修会不同，托钵修会追求团体和个人的清贫，几乎完全依赖施舍生活。他们以城镇为中心，在城镇传教，强调教育和学术。托钵修士的理念直接承继自《玛窦福音》第10章第9节至第10节中基督对宗徒的指示：不要带东西上路。"
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "五大宗主教区" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "五大牧首区" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "信友无论何处因基督的名字聚在一起，祂就在他们中间。罗马、君士坦丁堡、亚历山大里亚、安提约基雅与耶路撒冷五大宗主教区，犹如教会的柱石，屹立不摇。\n\n$pam_matthew_18_20_latin$\n\n[Glossary('“五大宗主教区”历史背景','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "教会由使徒时期所设立的五大牧首区治理。无论在哪里，有两三个人奉祂的名聚会，基督就在他们中间；而通过五大牧首区，祂的权柄施行于普世。\n\n$pam_matthew_18_20_greek$\n\n[Glossary('“五大牧首区”历史背景','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "普世教会由五个古老的宗主教区共同治理，各宗主教区于其辖区内享有治权，并藉着大公会议的共融保持合一。\n\n$pam_matthew_18_20_default$\n\n[Glossary('“五大牧首区”历史背景','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "五大牧首区是教会治理的一种模式，承认五个主要的宗主教区：罗马、君士坦丁堡、亚历山大里亚、安条克及耶路撒冷。该制度于公元451年由迦克墩大公会议正式确立，反映了这些城市在罗马帝国中的政治地位。每位宗主教在其辖区内享有治权，争议则通过大公会议裁决。\n\n此制度从未被罗马全面接受，因为罗马持守教宗首席权，而公元641年亚历山大里亚遭围攻一事更动摇了这一体制。1054年东西教会大分裂后，该体制终告瓦解。东正教继续尊崇五大牧首区的理想，随后亦在俄罗斯、塞尔维亚等地建立了新的牧首区。"
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "信德不倦" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "无敌的信德" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "上主，求祢坚固我们的信德，这信德是所希望之事的担保，是未见之事的确证。愿我们能恳切持守，不畏一切逆境，事奉祢之心绝不动摇。\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('“信德不倦”历史背景','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "信德是所望之事的实底，是未见之事的确据。藉着不动摇的信，信众胜过一切试炼与逼迫，坚立至死。\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('“无敌的信德”历史背景','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "不为迫害、患难或疑虑所撼动的信德。信友蒙召坚守自己所确信的，不顾此世的任何后果。\n\n$pam_hebrews_11_1_default$\n\n[Glossary('“不屈信仰”历史背景','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "在基督信仰的整个历史中，殉道圣人与精修圣人的芳表始终被奉为楷模。从最初尼禄与戴克里先教难，到日后种种试炼，再到如布拉格的圣亚德伯等传教士为劝化充满敌意的民众而奔走殉道，基督徒蒙召持守信仰，至死不渝。\n\n这份无论如何必须捍卫、坚持并传播信仰的坚定信念，激励了无数的隐修运动与传教事业。圣人们为信仰忍受酷刑、从容就义的事迹，坚固了信友们的决心，也指明了一条稳妥的得救之路。"
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "合性论" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "合性论" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "合性论"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "厄弗所大公会议并非强盗会议。迦克墩大公会议的错误必须予以纠正。天主性与人性在基督的独一位格内，不相混淆、不相变化、不相分割、不相分离地结合为一。\n\n$pam_colossians_2_9_latin$\n\n[Glossary('“合性论”历史背景','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "艾弗所会议为艾弗提希平反、定弗拉维安为有罪，此举并无不当。基督拥有一位格内联合的神性与人性，完全上帝且完全的人，二者联合而不相混杂，亦不分离。\n\n$pam_colossians_2_9_greek$\n\n[Glossary('“合性论”历史背景','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "基督在降生成人时，天主性与人性紧密结合，合为一个联合性体，二者不相分离。\n\n$pam_colossians_2_9_default$\n\n[Glossary('“合性论”历史背景','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "合性论一词源于希腊语的#weak “一”#!和#weak “性体”#!。该教义主张，在基督里，神性与人性不混淆、不分离地结合成为一个复合的性体。亚历山大里亚的济利禄曾以#weak “由天主圣言降生的唯一性体”#!这一表述来倡导此基督论。它与基督一性论的区别在于，其在合一中坚持两种本性的完整实在。\n\n公元451年的迦克墩公会议拒绝了这一表述，转而支持“基督二性论”。东方正统教会（科普特、亚美尼亚、埃塞俄比亚、叙利亚）因此与拜占庭教会分离，并持守其合性论神学至今。"
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[GetTrait('honest').GetName( GetNullCharacter )][characters|E]：#P +10%#!@piety_icon![piety|E]获得、#P +10#![clergy|E][opinion|E]"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[GetTrait('deceitful').GetName( GetNullCharacter )][characters|E]：#N ‑10%#!@piety_icon![piety|E]获得，#N ‑10#![clergy|E][opinion|E]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "[liege|E]与你[faith|E]不同时每年获得[piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#![piety|E]"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "静修" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "静修" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "静修"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "上主，求祢赐我们圣善静默的恩宠。使我们得以寻见那住在不可接近之光中的祢。求祢教导我们不断祈祷，好让我们的心灵成为祢临在的圣殿。\n\n$pam_psalm_46_10_latin$\n\n[Glossary('“静修”历史背景','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "主耶稣基督，上帝之子，怜悯我罪人。藉着身心的静止，藉着不停重复的心祷，使我得以上升至神视，得见那非受造的神圣之光。\n\n$pam_psalm_46_10_greek$\n\n[Glossary('“静修”历史背景','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "借由内心的静默、默观祈祷，并反复诵念耶稣祷文，信友得以与天主直接共融，并于心神的直观中得见祂非受造的真光。\n\n$pam_psalm_46_10_default$\n\n[Glossary('“静修”历史背景','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "#weak 静修#!，意为“宁静”，是东方基督教的一种默想传统，强调心灵的祈祷与对上帝的直接体验。它植根于公元四世纪埃及旷野教父的修行。反复诵念#weak “主耶稣基督，上帝之子，怜悯我罪人”#!的耶稣祷文，成为静修灵修的核心实践，并常与呼吸和心跳的节奏协调。\n\n十四世纪时，圣格里高利·帕拉玛斯为阿索斯山的静修士，以及他们所见证的、塔佛尔山的非受造之光辩护，反驳卡拉布里亚的瓦尔拉穆对其异端的指控。1341年与1351年的君士坦丁堡大公会议最终为帕拉玛斯平反，并将静修主义确立为正教教义。"
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "在你的[capital|E]采用[GetDecisionWithKey('meditate_in_seclusion_decision').GetName][decision|E]获得#P 更多#!@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "该[rite|E][clergy|E]的#high $spiritual_counsel_interaction$#!给予更多@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "[GetTrait('patient').GetName( GetNullCharacter )][characters|E]：#P +10%#!@piety_icon![piety|E]获得，#P +10%#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]获得"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[GetTrait('impatient').GetName( GetNullCharacter )][characters|E]：#N ‑10%#!@piety_icon![piety|E]获得"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[GetTrait('journaller').GetName( GetNullCharacter )]、[GetTrait('contrite').GetName( GetNullCharacter )]、[GetTrait('confider').GetName( GetNullCharacter )]和[GetTrait('flagellant').GetName( GetNullCharacter )][characters|E]：#P +10%#![stress|E]降低，#P +5%#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]获得"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "摆脱一级[stress|E]时获得@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]（每年最多一次）"
 pam_hesychasm_meditation_toast: "来自你的[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]：在家安静冥想的加成"
 pam_hesychasm_stillness_toast: "来自你的[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]：心中的宁静"
 hesychasm_anachoresis_mortification_exclusivity_desc: "角色同时只能拥有以下[core_tenets|E]之一：[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]、[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]、[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]、[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]"
 # Anachoresis tenet
 tenet_anachoresis_latin_name: "隐修" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "隐修" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "隐修"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "上主，祢曾引领祢的圣子进入旷野，为祂的使命作准备；求祢也同样引领我们进入内心的旷野。在独处与静默中，愿我们摆脱世俗的纷扰，唯独寻见祢。\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('“隐修”历史背景','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "有福的是那些离弃世俗的人，因为他们必在旷野的静默中找到上帝。正如先知们曾住在洞穴与地下的坑中，基督的仆人们也当退隐独处，为要与情欲争战。\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('“隐修”历史背景','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "信友通过退离世俗、遁入旷野，藉着独居祈祷和克己修练，能获得心灵的洁净，克制偏情，并亲近天主。\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('“隐修”历史背景','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "#weak 隐修#!，意为“退隐”或“遁世”，是指基督徒隐修者退出社会、进入荒野，以追求祈祷、斋戒及与魔鬼势力进行属灵战斗之生活的实践。此运动于三世纪在埃及兴起，底比斯的圣保禄传统上被视为第一位基督徒隐修者。约于公元250年，他为躲避德西乌斯皇帝的迫害，退隐至底比斯旷野。\n\n这种独修生活方式在整个中世纪也十分盛行，许多隐士居住在附属于修道院的隔间中，透过墙上一扇内墙小窗领受圣体。十三世纪英格兰的《隐修女规箴》等文献，为隐修女与隐修士提供了灵修指引与规范。"
 doctrine_parameter_tenet_anachoresis_mystic_trait: "获得[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "采用[GetDecisionWithKey('meditate_in_seclusion_decision').GetName][decision|E]离开[capital|E]获得#P 更多#!@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
