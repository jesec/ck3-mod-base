 pam_john_19_26_27_greek: "[Glossary('耶稣看见母亲，又看见他所爱的门徒站在旁边，就对母亲说：“女人，看，你的儿子！”然后又对那门徒说：“看，你的母亲！”就从那时起，那门徒把她接到自己家里。', 'JOHN_19_26_27_GREEK_GLOSS')]" #Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ μητρί· Γύναι, ἴδε ὁ υἱός σου. εἶτα λέγει τῷ μαθητῷ· Ἴδε ἡ μήτηρ σου. καὶ ἀπ᾽ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
