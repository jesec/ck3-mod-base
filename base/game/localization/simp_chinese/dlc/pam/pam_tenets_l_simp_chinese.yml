 pam_1_thessalonians_5_16_20_greek: "[Glossary('应常欢乐，不断祈祷，事事感谢：这就是天主在基督耶稣内对你们所有的旨意。不要消灭神恩，不要轻视先知之恩。', '1_THESSALONIANS_5_16_20_GREEK_GLOSS')]" #πάντοτε χαίρετε, ἀδιαλείπτως προσεύχεσθε, ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς. τὸ πνεῦμα μὴ σβέννυτε, προφητείας μὴ ἐξουθενεῖτε
