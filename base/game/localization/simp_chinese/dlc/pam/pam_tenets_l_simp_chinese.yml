 pam_colossians_3_15_latin: "[Glossary('还要叫基督的平安，在你们心中作主；你们所以蒙召存于一个身体内，也是为此，所以你们该有感恩之心。','COLOSSIANS_3_15_LATIN_GLOSS')]"
 pam_matthew_5_9_latin: "[Glossary('缔造和平的人是有福的，因为他们要称为天主的子女。','MATTHEW_5_9_LATIN_GLOSS')]"
