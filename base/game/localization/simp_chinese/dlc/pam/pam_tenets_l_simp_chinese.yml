 # Monophysitism tenet
 tenet_monophysitism_latin_name: "一性论" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "一性论" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "一性论"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "圣子是唯一的，其性体亦是唯一的，纵使祂被理解为取了具有理性灵魂的血肉之躯。\n\n$pam_john_1_1_latin$\n\n[Glossary('“一性论”历史背景','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "降生成人之圣言的单一性体。\n\n$pam_john_1_1_greek$\n\n[Glossary('“一性论”历史背景','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "基督只有一个性体，完全为天主性。\n\n$pam_john_1_1_default$\n\n[Glossary('“一性论”历史背景','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "由希腊文#weak “单一”#!和希腊文#weak “性体”#!而来，此教义断言耶稣基督只有一个天主性体，即降生成人的天主圣言。尽管在451年加采东大公会议上被谴责为异端，它仍在巴西利斯库斯皇帝治下获得支持，并在查士丁尼一世皇帝治下受到保护。它导致了如无首派（拒绝亚历山大里亚宗主教的权威）、幻影论（相信耶稣的人性仅为幻象）等分裂派别的出现。"
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[GetTrait('theologian').GetName( GetNullCharacter )][characters|E]：#P +10%#!@piety_icon![piety|E]，#P +5#!狂热者[opinion|E]，#P +10%#![lifestyle|E]经验"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[GetTrait('stubborn').GetName( GetNullCharacter )][characters|E]：#P +10%#!@piety_icon![piety|E]获得，#P +10#![clergy|E][opinion|E]"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[GetTrait('trusting').GetName( GetNullCharacter )][characters|E]：#N ‑10%#!@piety_icon![piety|E]获得，#N ‑10#![clergy|E][opinion|E]"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "针对你[religion|E]的其他[faiths|E]时：[convert_county|E]加速#P +25%#!，[characters|E]接受皈依的可能性增加#P +20#!"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "宗徒大事录" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "使徒行实" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "热忱传教"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "正如梅瑟立于法老前，大胆宣告祢赋予他的使命，我们的传教士也如此立于人前。\n\n$pam_acts_1_8_latin$\n\n[Glossary('“宗徒大事录”历史背景','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "我归向祢，并将祢的子民、祢赐予我的恩托付于祢。求祢以大能的右手引导他们，将他们庇护于祢的翼荫下。\n\n$pam_acts_1_8_greek$\n\n[Glossary('“使徒行实”历史背景','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "将天上的光明带给在黑暗中的人，将希望带给在绝望中的人。\n\n$pam_acts_1_8_default$\n\n[Glossary('“热忱传教”历史背景','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "基督宗教在公元最初几个世纪迅速传播，主要归功于宗徒及早期门徒的热心传教。他们的旅程横跨罗马帝国，建立起基督徒团体并劝化不同背景的个人。对传教的热忱被因耶稣基督而来的救恩讯息的深度确信所推动，导致基督信仰从一个犹太教内的微小宗派成长为世界主要宗教。\n\n在中世纪，众多后来的圣人与殉道者前往遥远的异教之地进行传教，不懈地传播基督信仰。"
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "[GetDecisionWithKey('zealous_missionary_prep_decision').GetName][decision|E]的要求降低，更多[adventurers|E]将采用"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "使[characters|E]皈依获得#P 50#!@legitimacy_icon!；你的[court_chaplain|E]使[county|E]改信给予#P 100#!@legitimacy_icon!和#P 5#!@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "使[character|E]皈依获得#P 3#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]，有领地[ruler|E]为#P 10#!"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "你的[head_of_rite|E]在劝说[characters|E]皈依该[rite|E]时获得#P +25#!接受度"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "要求[characters|E]改信时，你的[learning|E]优势按#P 双倍#!计算"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "使一位[ruler|E]改信给予#P 25#!至#P 1500#!@piety_icon![piety|E]，数值随其[title|E]等级极大提升"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "来自[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]信条"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "炼狱" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "炼狱" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "炼狱"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "我更加害怕的刑罚，反而在下方。我的灵魂为此而怔忡不安，令我感到重担已压在身上。\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('“炼狱”历史背景','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "而在天国之人，因尚无肉身，不能于神化之恩中增长，故我众之祈祷可助其于神化之恩中增长。\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('“炼狱”历史背景','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "那些于恩宠状态中逝世者的最终净化，此净化于其内只留下进入天国喜乐所必需的圣德。\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('“炼狱”历史背景','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "尽管灵魂处于过渡状态、等待进入天国的观念被普遍接受，但此状态的确切性质常有争论。它究竟是实际处所、心灵状态、纯粹隐喻抑或物理净化，在不同神学家和教派间各有不同。圣妇热那亚的加大利纳写道，这是喜乐与自愿的罪过之苦并存的状态，而亚历山大里亚的奥力振则写及天主乃吞灭的烈火。\n\n天主教会在佛罗伦萨大公会议（1439年）及特利腾大公会议（1545年—1563年）中正式确立炼狱的教理，将其定断为灵魂经历净化的暂时状态，并教导在世信友的祈祷与善工，能裨助彼处之灵魂。"
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[sinful|E][characters|E]不太可能加入[factions|E]（每拥有一项[sin|E]，#N ‑15#!）"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[sinful|E][rulers|E]每拥有一项[sin|E]，获得的@piety_icon![piety|E]减少#N 10%#!"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "[stress|E]崩溃可能会以[virtues|E]替换[sinful|E][traits|E]，崩溃越深概率越高"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "该[rite|E]的[Concept('excommunicated', '被绝罚')|E][characters|E]通过苦修赎罪：#P +25%#!@piety_icon![piety|E]获取和#P +10#!同信仰[opinion|E]"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|E]花费更少@prestige_icon![prestige|E]且不会降低你的[prestige_level|E]"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "一位近亲[family|E]成员死亡时，其每拥有一个[sin|E]，你获得#P 50#!@piety_icon![piety|E]"
 pam_purgatory_prayers_for_the_dead_toast: "你的[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]：为炼灵祈祷"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "你们要生育繁殖" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "你们要生育繁殖" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "你们要生育繁殖"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "夫妇不仅将自己给予对方，也将子女这一现实给予对方；子女是他们爱情的活的形象，是他们生命的活生生而不可分的综合。\n\n$pam_genesis_1_28_latin$\n\n[Glossary('“你们要生育繁殖”历史背景','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "的确子女全是上主的赐予，胎儿也全是他的报酬。\n\n$pam_genesis_1_28_greek$\n\n[Glossary('“你们要生育繁殖”历史背景','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "在天主的计划中，家庭是一个生命与爱的亲密团体，这团体一如所有受造与得赎之物，须努力在天主的国里达到圆满。\n\n$pam_genesis_1_28_default$\n\n[Glossary('“你们要生育繁殖”历史背景','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "“你们要生育繁殖”是圣经中天主的命令，见于《创世纪》1章28节，天主在此命令亚当与厄娃生育繁衍，充满大地。"
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "向你的配偶求爱的难度大幅降低，并给予大量[fertility|E]加成"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "总是可以与低[fertility|E]的配偶离婚"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "新生儿根据父母关系的亲密程度获得[health|E]增益"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "悉心抚育"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "慈爱抚育"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "虔诚抚育"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "充满爱的结合诞下的孩子，在父母双方的温暖中茁壮成长。"
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "出生及成年时：\n$BULLET_WITH_TAB$#V 子女#!获得[GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip]，持续2年。\n$BULLET_WITH_TAB$#V 父母#!获得[GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip]，持续2年。"
 tenet_be_fruitful_and_multiply_child_modifier: "备受宠爱"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "众信友因对生育之恩的热诚敬重，而愈加关怀并照顾青年及其父母。"
 tenet_be_fruitful_and_multiply_parent_modifier: "赞美多产"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "宗徒继承" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "使徒继承" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "宗徒继承"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "基督授予宗徒伯多禄的尊荣与治权的首席地位，由他的继承者——历代教宗所继承。\n\n$pam_matthew_16_18_latin$\n\n[Glossary('“宗徒继承”历史背景','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "罗马教会的首任主教是克劳迪亚之子利诺，由帕弗罗祝圣。\n\n$pam_matthew_16_18_greek$\n\n[Glossary('“使徒继承”历史背景','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "从宗徒直至今日一脉相承、从未间断的主教传承，确保了信仰的真实传递。\n\n$pam_matthew_16_18_default$\n\n[Glossary('“宗徒继承”历史背景','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "教理“宗徒继承”主张，主教们的权柄源自一条上溯至宗徒本人的、从未间断的祝圣传承。二世纪时，里昂的圣依勒内以宗徒继承为据驳斥诺斯替异端，证明了基督的真正教导经由教会合法主教而得以保存。\n\n自十三世纪起，教宗佩戴渔人之戒，作为继承圣伯多禄之象征。东方正教会承认西方教宗的传承及其在早期基督教中的角色，但未赋予伯多禄高于其他宗徒的地位，且视教宗理诺为罗马的首任主教。"
 tenet_apostolic_succession_requires_head_of_faith_tt: "你的[faith|E]必须拥有[head_of_faith|E]"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "同[faith|E][theocratic_vassals|E]对其[liege|E]的[legitimacy_expectations|E]降低"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "给予[GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "晋升[cardinal|E]使其[papabile_score|E]进一步提升#P 10#!"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "@legitimacy_icon![legitimacy|E]得到[head_of_faith|E]亲自宣扬，给予额外@legitimacy_icon![legitimacy|E]"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "废黜[antipope|E]给予@legitimacy_icon![legitimacy|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 # Confession tenet
 tenet_confession_latin_name: "告解" # DO NOT TRANSLATE
 tenet_confession_greek_name: "忏悔" # DO NOT TRANSLATE
 tenet_confession_default_name: "告解圣事"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "神父，请降福我，因我犯了罪。至仁慈的天主！我俯伏于祢足前，恳求祢的宽宥。我以全然的诚心，向祢并向祢的司铎告明我所犯的罪。\n\n$pam_james_5_16_latin$\n\n[Glossary('“告解”历史背景','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "主啊，求祢垂听我这个卑污者的祈祷，并摧毁那蜷伏于我内的毒蛇！\n\n$pam_james_5_16_greek$\n\n[Glossary('“忏悔”历史背景','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "经由告解，罪人可获得罪赦，并与天主及圣教会修和。\n\n$pam_james_5_16_default$\n\n[Glossary('“告解圣事”历史背景','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "告明罪过的实践在基督宗教历史中有显著演进。早期教会中，重罪须行公开告明。至六世纪，私下向司铎告解的现象在凯尔特教会中愈发普及，并传遍西方基督宗教世界。1215年拉特朗第四届大公会议规定所有基督徒每年至少告解一次。告解圣事的秘密——即所告明之罪绝对的保密性——成为该圣事的标志性特征，司铎们宁受致命之苦，亦绝不背离保守秘密的责任。"
 doctrine_parameter_tenet_confession_priests_secrets: "你的[faith|E]的一位同样践行告解圣事，且对你有好感或受制于强牵制的[court_chaplain|E]提高了$task_find_secrets$[councillor_task|E]的效率"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "该[rite|E][clergy|E]的#high $spiritual_counsel_interaction$#!给予更多@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName][schemes|E]缓解更多[stress|E]"
 doctrine_parameter_tenet_confession_confess_sins_decision: "可以使用[GetDecisionWithKey('pam_decision_confession').GetName][decision|E]"
 # Original Sin tenet
 tenet_original_sin_latin_name: "原罪" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "原罪" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "原罪"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "众人因亚当抗命而失掉纯洁。原罪的后果，即堕落而倾向于恶的人性，仍留在人身上，并促使他展开属灵的战斗。\n\n$pam_romans_5_12_latin$\n\n[Glossary('“原罪”历史背景','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "我们造化万有的造物者，过错全在我们。亚当和夏娃听从了撒旦，竟亵渎了上主。他们出于骄傲，任由自己受了迷惑，致使人的本性变得软弱。我们心中的思念，尽是邪恶。\n\n$pam_romans_5_12_greek$\n\n[Glossary('“原罪”历史背景','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "全人类都承受了亚当原罪的玷染，唯有藉基督而来的天主恩宠方能救赎我们。\n\n$pam_romans_5_12_default$\n\n[Glossary('“原罪”历史背景','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "原罪的教理在五世纪初由希波的圣奥斯定详尽阐述，尤其为驳斥否认原罪遗传的白拉奇异端。圣奥斯定教导：亚当的罪传予所有后代，败坏了人性，若无天主的圣宠，得救绝无可能。公元418年的迦太基会议确认了这端道理，使之成为西方基督教神学的基石。东方基督教则形成了稍有不同的理解，强调祖传之罪，而非直接继承的罪责。"
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "同[rite|E][counties|E]的[promote_culture|E][councillor_task|E]速度加快#P 25%#!"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "若[liege|E]属于其他[faith|E]，则该[faith|E]的[counties|E]需要额外#N 50%#!时间才会[Concept( 'promote_culture', '改变文化' )|E]"
 doctrine_parameter_tenet_original_sin_sinners_insight: "你每拥有一项[sin|E]，便获得#P +10#!敌对[scheme|E]最大成功概率"
 doctrine_parameter_tenet_original_sin_baptism_piety: "当你的孩子出生时，获得#P 50#!@piety_icon![piety|E]；新生儿受洗时获得#P 250#!@piety_icon![piety|E]"
 pam_original_sin_baptism_toast: "来自你的[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]：新生儿的污点已被洗净"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "天使品级" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "天使品级" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "天使品级"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "圣洁的天使，请环绕守护我的领地和家庭。天父啊，愿祢派遣天使止息所有控告我与恐惧我的声音，并迅速将我的祷告呈到祢的宝座前。\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('“天使品级”历史背景','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "求你作基督徒子民的护守天使、睿智的谋士与忠实的同伴，为他们带来启迪、力量、喜乐、平安和慰藉。\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('“天使品级”历史背景','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "天使分为九个品级，从炽天使到普通天使，各自按所指派的角色侍奉上帝，并服事人类。\n\n$pam_hebrews_1_14_default$\n\n[Glossary('“天使品级”历史背景','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "天使品阶之概念于五或六世纪由伪狄约尼削在其著作《天阶体系》中系统化。他将天使分为三组三级：最高级为炽爱天使、普智天使、上座者；中级为宰制者、掌权者、异能者；低级为率领者、总领天使和天使。\n\n此等级体系深刻影响中世纪基督宗教神学，并为东西方基督宗教所采纳。圣托玛斯·阿奎那将其天使学融入《神学大全》，且此体系塑造了整个中世纪的天国艺术呈现。"
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "招募高[aptitude|E]的[court_positions|E]给予#P 3#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]，解雇或剥夺职位消耗#N 3#!"
 pam_celestial_hierarchy_hire_sp_toast: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )]个人信条"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "属于[liege|E][faith|E]的[court_positions|E]持有者从[piety_level|E]获得[aptitude|E]"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "[clergy|E]针对世俗[rulers|E]的[interaction|E]获得#P +20#!接受度"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "[religious_relations|E][councillor_task|E]效率提高#P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')]%#!"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "高于目标的每级[piety_level|E]使同[faith|E][interaction|E]的接受度#P +10#!，低于目标的每级使接受度#N ‑10#!"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "[clergy|E]针对世俗[ruler|E]的行动：$VALUE|=+0$"
 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "相对[piety_level|E]：$VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "神职人员对世俗[ruler|E]的权威：$VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "基督的精兵" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "基督的精兵" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "基督的精兵"
 tenet_miles_christi_latin_desc: "所以要站稳！用真理作带，束起你们的腰，穿上正义作甲。要奋力打这场有关信仰的好仗，如同基督的真精兵。\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('“基督的精兵”历史背景','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "每位虔诚的基督徒都必须准备好为基督受苦，坚定地抵抗精神上的邪恶力量，以士兵的勇气忍受苦难。\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('“基督的精兵”历史背景','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "信徒被呼召成为灵性的战士，披戴神所赐的全副武装与罪和邪恶争战，预备为基督受苦，如同士兵为统帅受苦。\n\n$pam_ephesians_6_11_default$\n\n[Glossary('“基督的精兵”历史背景','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "“基督的精兵”的概念植根于基督教的传统，最早可追溯至圣保禄的书信，他在其中使用军事隐喻来描绘灵性生活。中世纪时期，这一概念既被用于实际或是灵性层面的战争。\n\n像圣殿骑士团和医院骑士团这样的军事修会是这一理想的具象化体现，将修道戒律与尚武精神融为一体。格来福的伯尔纳铎的《新精兵赞》称赞这些战士僧侣是基督教美德的典范，他们的战斗不为世俗利益，而为捍卫整个基督教世界。"
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "作为防御方，与同[faith|E]角色以[white_peace|E]结束[war|E]，可获得#P 100#!@piety_icon![piety|E]和@legitimacy_icon![legitimacy|E]（受双方[title|E]级别修正）以及#P 5#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "指挥赢得[battle|E]或[siege|E]给予#P 3#!@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "携带[holy_relic|E]武器赢得针对其他[religion|E]的[battles|E]，会通过四级祝福使该武器得到强化，最多#P 50#!次胜利"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "爱德" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "博爱" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "仁爱"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "凡你们对我这些最小兄弟姊妹中的一个所做的，就是对我做的。施舍与看顾穷人并非仅仅是公民责任，而是亲近基督本身的一条途径。\n\n[Glossary('“爱德”历史背景','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "博爱——对人类的爱——在新罗马的皇家与教会医院、收容所和济贫院中得到了最充分的表现。喂饱饥饿的人、赎回被掳的人，就是效法那位为我们虚己的基督。\n\n[Glossary('“博爱”历史背景','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "圣教会将慷慨地行哀矜、照顾贫穷的人，以及兴办有组织的爱德事业，尊奉为基督徒的中心本分，这正是遵循教会圣师们的训导和早期收容所与医院的芳表。\n\n[Glossary('“仁爱”历史背景','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "在拜占庭基督教中，博爱既指普遍之爱的美德，也指具体的机构——医院、客馆、孤儿院和施济所——它们由皇帝、主教和众信徒所支持。恺撒里亚的瓦西里、金口约安，以及后来的皇帝如查士丁尼，将帝国统治的正当性与看顾穷乏者联系起来。教会从不将战争美化为通往圣洁的道路；却确实坚持，财富与权力在部分程度上是因它们如何服侍穷人而得以称义的。"
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "[county|E]等级即可任命[GetCourtPositionType('high_almoner_court_position').GetName]"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "为另一[character|E]支付赎金获得@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]，受支付的@gold_icon![gold|E]数量修正"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[GetTrait('generous').GetName( GetNullCharacter )][characters|E]：#P +10#!同信仰[opinion|E]，#P +20%#![development_growth|E]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[GetTrait('greedy').GetName( GetNullCharacter )][characters|E]：#N ‑10#!同信仰[opinion|E]，#N ‑25%#!@piety_icon![piety|E]获得"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "向[debt|E][character|E]赠送[gift|E]可获得@prestige_icon![prestige|E]和@piety_icon![piety|E]"
 pam_philanthropia_ransom_toast: "来自你的[GetTenetType('tenet_philanthropia').GetName( GetPlayer.GetRite )]个人信条"
 # Scholasticism tenet
 tenet_scholasticism_latin_name: "圣教学" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "士林哲学" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "经院哲学"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "追求知识也是敬拜天主，因为在认识受造之物的过程中，我们得以更亲近地去认识造物主。你们应当寻求智慧，就必蒙受恩赐。\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('“圣教学”历史背景','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "信仰与理性并非对立，而是相辅相成，因为上帝赐给我们理智去寻求真理，又赐给我们心灵去爱慕祂。借着研读与默想，我们会上升到更高的知识层面去。\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('“士林哲学”历史背景','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "藉着严格的理性探求与辩证方法，信仰和理性得以调和，实现对神圣真理的更深理解。\n\n$pam_proverbs_1_7_default$\n\n[Glossary('“经院哲学”历史背景','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "经院哲学是中世纪欧洲大学中占主导地位的治学方法，在十二至十三世纪达到顶峰。它力求使基督教神学与古典哲学——特别是亚里士多德的著作——得以调和。\n\n像坎特伯雷的安色莫、皮埃尔·阿贝拉尔、大亚尔伯和托马斯·阿奎那这些伟大的经院思想家们，发展出着重严谨逻辑与辩论的系统性神学方法。托马斯·阿奎那所著的《神学大全》是经院方法至高的成就，它试图将一切人类知识都统合在一个基督教的框架之内。"
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "造访[GetReligionByKey('judaism_religion').GetAdjective]、[GetReligionByKey('islam_religion').GetAdjective]和[GetReligionByKey('zoroastrianism_religion').GetAdjective][counties|E]的[points_of_interest|E]给予额外@piety_icon![piety|E]、[learning|E][experience|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_scholasticism_university_bonus: "完成[GetActivityType('activity_adult_education').GetName]给予持久的[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip][modifier|E]"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName][scheme_success_chance|E]：[success_chance_i]#P +10%#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "每年有概率无需学习即可获得[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]，随[learning|E]、[piety_level|E]和会说的语言数量提高"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "参加[GetActivityType('activity_adult_education').GetName]花费的@gold_icon![gold|E]降低#P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')]%#!"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization( HasDlcFeature( 'legacy_of_persia' ), 'tenet_scholasticism_court_scholar_effect', 'blank_line' )]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "无需$tradition_fp3_beacon_of_learning_name$[culture_tradition|E]即可任命[GetCourtPositionType('court_scholar_court_position').GetName]，并且#P 无需俸禄#!"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "追求知识也是敬拜天主，因为在认识受造之物的过程中，我们得以更亲近地去认识造物主。"
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "巡回学堂"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.GetTitledFirstName]在旅途的最后一段路上一直与你争论不休，最终在经过某个[barony|E]时认定这个问题最好以书面形式解决。"
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "爱你的近人" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "爱你的近人" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "爱你的近人"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "愿我们能以祢的眼光看待他人，少一些判断，多一些仁爱，并视他们与我们一样，皆为祢手中尚未完成的工程，终将在适当的时期由祢亲手成就。\n\n$pam_matthew_22_39_latin$\n\n[Glossary('“爱你的近人”历史背景','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "有什么比爱近人更甘甜、更美好的呢？爱是福乐，恨是折磨。全部律法和先知都系于这两条诫命：你当全心爱上主你的上帝，并爱近人如己。\n\n$pam_matthew_22_39_greek$\n\n[Glossary('“爱你的近人”历史背景','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "爱近人与爱天主密不可分；我们借着爱德与慈悲的善工，满全了天主的全部法律。\n\n$pam_matthew_22_39_default$\n\n[Glossary('“爱你的近人”历史背景','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "爱近人的诫命是基督徒伦理的核心，源自《肋未纪》19章18节，并由基督提升至与爱天主并列，成为天主全部律法的总纲。亚历山大的克肋孟、金口若望等教会早期圣师强调，真正的爱必须超越家庭与朋友，广及一切人类，包括外方人和仇人。这一训导，激励了整个中世纪基督徒慈善机构、医院的兴起，以及哀矜善工的实行。"
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "[county_opinion|E]满#P 60#!的该[faith|E][counties|E]可以获得[GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip][modifier|E]"
