 pam_john_1_1_greek: "[Glossary('在起初已有圣言，圣言与天主同在，圣言就是天主。', 'JOHN_1_1_GREEK_GLOSS')]" #Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
 pam_hebrews_1_3_greek: "[Glossary('他是天主光荣的反映，是天主本体的真像，以自己大能的话支撑万有；当他涤除了罪恶之后，便在高天上坐于“尊威”的右边。', 'HEBREWS_1_3_GREEK_GLOSS')]" #ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως αὐτοῦ, καθαρισμὸν τῶν ἁμαρτιῶν ποιησάμενος ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς
 pam_acts_1_8_greek: "[Glossary('但当圣神降临于你们身上时，你们将充满圣神的德能，要在耶路撒冷及全犹太和撒玛黎雅，并直到地极，为我作证人。', 'ACTS_1_8_GREEK_GLOSS')]" #ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ' ὑμᾶς καὶ ἔσεσθέ μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρίᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
