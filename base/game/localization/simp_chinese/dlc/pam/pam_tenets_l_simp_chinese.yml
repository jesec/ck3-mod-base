 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "克修" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "肉体之死" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "克修"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "上主，求祢赐我们恩宠，使我们能将肉身连同私欲偏情，一并钉在十字架上。愿我们经由这圣化的痛苦，分担基督的苦难，克修肉身的恶行，从而真正活于祢内。\n\n$pam_galatians_5_24_latin$\n\n[Glossary('“克修”历史背景','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "藉着斋戒、守夜及肉身的克制，上帝的仆人们制服肉体，使它顺服，从而使心灵得以翱翔于天。\n\n$pam_galatians_5_24_greek$\n\n[Glossary('“肉体之死”历史背景','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "信友克修肉身及其私欲邪情，分担基督的苦难，为净化灵魂，达至属灵的成全。\n\n$pam_galatians_5_24_default$\n\n[Glossary('“克修”历史背景','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "[GetTrait('scarred').GetName( GetNullCharacter )][trait|E]给予@piety_icon![piety|E]和信徒[opinion|E]"
 doctrine_parameter_tenet_mortification_revel_bonus: "在[GetDecisionWithKey('stress_loss_flagellant_decision').GetName][decision|E]中获得@spiritual_fulfillment_icon![spiritual_fulfillment|E]和[GetTrait('flagellant').GetName( GetNullCharacter )][trait|E]"
 doctrine_parameter_tenet_mortification_holy_scars: "接受该[personal_tenet|E]时获得[GetTrait('scarred').GetName( GetNullCharacter )][trait|E]"
 doctrine_parameter_tenet_mortification_suffering_sanctifies: "每次受伤获得@piety_icon![piety|E]，失去[stress|E]"
 doctrine_parameter_tenet_mortification_mortify_flesh: "可以使用[GetDecisionWithKey('stress_loss_flagellant_decision').GetName][decision|E]"
