 pam_mortification_holy_scars_toast: "来自你的[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]：鞭子在你身上留下了圣痕"
 pam_mortification_suffering_sanctifies_toast: "来自你的[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]：你将肉体的痛苦献给神明"
 tenet_mortification_of_the_flesh_historical_desc: "克修的根基在于圣保禄的训诲：他呼吁信友#weak “致死肉性的妄动”#!（《罗马书》8:13），以及#weak “我痛击我身，使它为奴”#!（《格林多前书》9:27）。因此，从教会最初几个世纪起，克修便成为基督徒灵修生活的核心操练。践行克修最为极致的，当属“石柱人”。圣长西默盎“石柱人”曾在阿勒颇附近的一根立柱顶端的小平台上度过了37年，在炎炎烈日与刺骨严寒中恒心站立祈祷。\n\n自笞在中世纪西方基督信仰中传播开来，由圣伯多禄·达弥盎（1007年—1072年）在神职人员中倡导。在十三和十四世纪的自笞者运动中，常可见到一群群平信徒列队穿行于城镇，公开鞭笞自己，作为补赎己罪的行动，尤其是在瘟疫和灾难时期。"
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "圣膏" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "圣油" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "圣膏" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "圣膏"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "藉由阿布纳祝圣的圣膏，信众领受圣灵的印记。正如鸽子在基督于约旦河受洗时降在祂身上，圣灵也藉着这神圣的傅油，降在新领洗者身上，印记他们成为上帝的儿女。\n\n$pam_john_3_5_default$\n\n[Glossary('“圣膏”历史背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "藉着由主教祝圣的圣油，信友领受了圣神恩宠的印记。这傅油圆满完成了坚振的恩宠。\n\n$pam_john_3_5_latin$\n\n[Glossary('“圣油”历史背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "圣膏由牧首祝圣，是圣灵恩赐的印记。藉着这神圣的膏抹，新受光照者得享圣灵全备之恩赐，成为永生上帝的殿。\n\n$pam_john_3_5_greek$\n\n[Glossary('“圣膏”历史背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "圣膏或圣油，是在坚振圣事中特别祝圣的油，用于给新领洗者傅油，赋予他们圣神恩赐的印记，完成他们进入教会的入门圣事。\n\n$pam_john_3_5_default$\n\n[Glossary('“圣膏”历史背景','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "#weak 圣膏#!，意为“芳香的油”或“膏油”，用于“圣膏礼”（或西方术语中的“坚振礼”）圣事。在东方教会，圣膏礼紧随洗礼之后施行，即使对婴儿也是如此；而在西方教会，坚振礼通常由主教单独施行。用油膏抹的实践有着深厚的圣经根源：#weak “基督”#!和#weak “弥赛亚”#!这两个称谓本身都意为#weak “受膏者”#!。\n\n新圣膏的祝圣是罕见而庄严的事件，因为每次配制新膏时，都会加入一部分旧膏，据称这形成了一条可追溯至使徒时代本身的、从未中断的传承链。埃塞俄比亚传统认为，#weak 圣膏#!配方是由“九圣”——五世纪的叙利亚传教士——带来的，并由牧首（阿布纳）在庄严仪式中祝圣。"
 doctrine_parameter_tenet_holy_myron_artifact: "可以通过[GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName][decision|E]派遣[court_chaplain|E]制造#V 圣膏#![artifact|E]，可以花费该宝物的使用次数祝福[artifacts|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: "、你的[coronation|E]"
 pam_holy_myron_param_funeral_append: "和[funerals|E]中的死者"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "可以向其他统治者赠送你的#V 圣膏#![artifact|E]的使用次数，获得@piety_icon![piety|E]和[opinion|E]"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "你的新生孩子获得[GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip][modifier|E]，持续#V 16#!年；使用一次#V 圣膏#![artifact|E]使用次数使[GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip][modifier|E]时限变为永久"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "[ill|E]时：获得@spiritual_fulfillment_icon![spiritual_fulfillment|E]，失去[stress|E]，获得[GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip][modifier|E]，持续#V 2#!年"
 # Khachkar tenet
 tenet_khachkar_armenian_name: "十字架石" # DO NOT TRANSLATE
