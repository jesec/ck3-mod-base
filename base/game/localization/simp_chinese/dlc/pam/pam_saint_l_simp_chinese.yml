 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
