 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "一方精美的圣髑盒，供奉着从[relic_creator_saint.GetShortUINameNotMe]受祝福的遗骸中取出的一根圣指。"
 pam_saint_relic_tooth_desc: "一方精美的圣髑盒，供奉着从[relic_creator_saint.GetShortUINameNotMe]受祝福的遗骸中取出的一枚圣牙。"
 pam_saint_relic_rib_desc: "一方精美的圣髑盒，供奉着从[relic_creator_saint.GetShortUINameNotMe]受祝福的遗骸中取出的一根圣肋。"
 pam_saint_relic_hair_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的一缕圣发。"
 pam_saint_relic_vestment_desc: "一方精美的圣物盒，供奉着[relic_creator_saint.GetShortUINameNotMe]穿戴过的一件祭披。"
 pam_saint_relic_hand_desc: "一方精美的圣髑盒，供奉着从[relic_creator_saint.GetShortUINameNotMe]受祝福的遗骸中取出的圣手。"
 pam_saint_relic_arm_desc: "一方精美的圣髑盒，供奉着从[relic_creator_saint.GetShortUINameNotMe]受祝福的遗骸中取出的圣臂。"
 pam_saint_relic_skull_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]受尊崇的颅骨。"
 pam_saint_relic_blood_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的圣血。"
 pam_saint_relic_heart_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的圣心。"
 pam_saint_relic_effigy_desc: "一尊受敬仰的雕像，仿照[relic_creator_saint.GetShortUINameNotMe]的容貌而制，受到信众的尊崇。"
 pam_saint_relic_letter_desc: "一方精美的圣髑盒，供奉着由[relic_creator_saint.GetShortUINameNotMe]亲笔书写的信函。"
 pam_saint_relic_drawing_desc: "一幅由[relic_creator_saint.GetShortUINameNotMe]绘制的著名画作。"
 pam_saint_relic_stationery_desc: "一套由[relic_creator_saint.GetShortUINameNotMe]使用过的文具，据说能为其持有者带来同样的智慧。"
 pam_saint_relic_ash_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的圣骨灰。"
 pam_saint_relic_canopic_jar_desc: "一只装着[relic_creator_saint.GetShortUINameNotMe]内脏的罐子。"
 pam_saint_relic_staff_desc: "一根[relic_creator_saint.GetShortUINameNotMe]在朝圣之旅中使用过的手杖。"
 pam_saint_relic_water_filter_desc: "一块曾由[relic_creator_saint.GetShortUINameNotMe]在旅途中用于滤水的布片。"
 pam_saint_relic_bowl_desc: "一只曾由[relic_creator_saint.GetShortUINameNotMe]在旅途中乞食时使用过的钵盂。"
 pam_saint_relic_robe_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的圣袍。"
 pam_saint_relic_sword_desc: "一把又[relic_creator_saint.GetShortUINameNotMe]挥舞过的圣剑，据说能为持有它的信徒赐予神圣的庇护与力量。"
 pam_saint_relic_sarira_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的舍利。"
 pam_saint_relic_skull_buddhism_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的螺髻。"
 pam_saint_relic_finger_buddhism_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的指骨舍利。"
 pam_saint_relic_tooth_buddhism_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的牙舍利。"
 pam_saint_relic_rib_buddhism_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的肋骨舍利。"
 pam_saint_relic_talisman_desc: "一件由[relic_creator_saint.GetShortUINameNotMe]亲手绘制的护身符。据称它能驱逐邪祟，或治愈持有者。"
 pam_saint_relic_pellet_desc: "一瓶由[relic_creator_saint.GetShortUINameNotMe]炼制的长生丹药。"
 pam_saint_relic_footprint_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的足印。"
 pam_saint_relic_afarganyu_desc: "一件曾属于[relic_creator_saint.GetShortUINameNotMe]的火盆。"
 pam_saint_relic_ring_desc: "一枚曾属于[relic_creator_saint.GetShortUINameNotMe]的圣戒。"
 pam_saint_relic_bracelet_desc: "一只曾属于[relic_creator_saint.GetShortUINameNotMe]的圣镯。"
 pam_saint_relic_commentary_desc: "一部由[relic_creator_saint.GetShortUINameNotMe]撰写的注释集，呈现了[relic_creator_saint.GetHerHis]对[relic_creator_saint.GetFaith.ReligiousText]的解读。"
 pam_saint_relic_tzitzit_desc: "一股[relic_creator_saint.GetShortUINamePossessiveNotMy]的神圣䍁子，显示了[relic_creator_saint.GetHerHis]的虔诚。"
 pam_saint_relic_relic_desc: "一方精美的圣髑盒，供奉着[relic_creator_saint.GetShortUINameNotMe]的圣物。"
 # Buried-saint point of interest
 poi_buried_saint: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]之墓"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "造访圣人陵墓"
 poi_buried_saint.visit_va: "造访祖先陵墓"
 poi_buried_saint.visit_desc: "造访一位[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]的陵墓，你心中充满了虔诚。"
 poi_buried_saint.preset_visit_desc: "你在[visited_saint.GetShortUIName]墓前驻足，致以敬意。"
 poi_buried_saint.foreign_visit: "造访古墓"
 poi_buried_saint.foreign_visit_desc: "你的信仰并不尊崇[visited_saint.GetShortUIName]，但此墓仍有许多值得学习之处。"
 pam_poi_buried_saint_on_visit_preset_relic_tt: "致以敬意，获得少量[piety_i|E][piety|E]，并可选择以比远程获取#EMP 更低#!的花费取出一件神圣的[Concept('artifact','圣物')|E]。"
 pam_poi_buried_saint_on_visit_relic_tt: "向[visited_saint.GetShortUIName]致以敬意，可选择以#EMP 较小#!花费获取一件[Concept('artifact','圣物')|E]。"
 pam_poi_buried_saint_on_visit_no_relic_tt: "向在此地安息的[visited_saint.Custom('PamSaintOrAncestorNoun')][visited_saint.GetShortUIName]致以敬意。"
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "在[visited_saint.GetShortUINameNoTooltip]的陵墓前"
 pam_saint_events.0007.desc: "我的旅程将我带到了我的信仰中的[visited_saint.Custom('PamVeneratedSaintOrAncestor')][visited_saint.GetShortUIName]的安息之地。空气中弥漫着浓厚的圣洁气息，陵墓周围，信众正默默跪地祈祷。"
 pam_saint_events.0007.a: "我将致以敬意并继续前行。"
 pam_saint_events.0007.b: "让我们取得一件圣物。"
 pam_saint_events.0007.b.tt: "将从[visited_saint.GetShortUINameNoTooltip]的遗骸中取得一件[Concept('artifact','圣物')|E]"
 pam_saint_events.0007.b.toast: "取得圣物"
 pam_saint_events.0007.b.toast_desc: "以虔诚的双手，从[visited_saint.GetShortUINameNoTooltip]的遗骸中取出[relic_artifact.GetName]，以祝福我的 [realm|EU]。"
