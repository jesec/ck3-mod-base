 pam_saint_events.0003.t_va: "新[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_saint_events.0003.desc_saint: "成了。[saint_candidate.GetFirstName]在[consecration_province.GetName]被祝圣，名列诸圣之列。愿[saint_candidate.GetHerHis]的光芒世代保佑我的[saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip]同胞。"
 pam_saint_events.0003.desc_va: "成了。[saint_candidate.GetFirstName]在[consecration_province.GetName]接受[saint_candidate.Custom('PamConsecratedEnshrined')]，名列[saint_candidate.Custom('PamBlessedOnesOrAncestors')]之列。愿[saint_candidate.GetHerHis]的光芒世代保佑我们的国家。"
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "感谢天主。"
 pam_saint_events.0003.a_va: "万分感谢。"
 pam_saint_events.0003.a.dynasty_opinion_tt: "与你[faith|EU]相同的[dynasty|E]成员对你的[Concept('opinion','好感度')|E]提高#P 20#!，持续20年"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "拒绝封圣"
 pam_saint_events.0004.t_va: "拒绝崇敬"
 pam_saint_events.0004.desc: "我们请求[GetPlayer.Custom('PamCanonizeVenerateVerb')][saint_candidate.GetFirstName]的请愿，已被[petition_recipient.GetTitledFirstName]拒绝。[saint_candidate.GetSheHe|U]未能名列[GetPlayer.Custom('PamBlessedOnesOrAncestors')]之列。"
 pam_saint_events.0004.a: "就这样吧。"
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "准备圣髑匣"
 pam_saint_events.0005.desc: "在[extract_site.GetName]，虔诚的双手开始了庄严的劳动，为的是能从[relic_saint.GetShortUIName]蒙福的遗骸中取出一件圣物。\n\n庆祝这一神圣时刻的准备工作正在进行中。"
 pam_saint_events.0005.a: "让我们满怀崇敬地完成此事。"
 pam_saint_events.0005.a.tt: "很快将从[extract_site.GetName]取出一件[relic_saint.GetShortUIName]的[Concept('artifact','圣物')|E]。"
 # The relic is drawn
 pam_saint_events.0006.t: "圣物"
 pam_saint_events.0006.desc_relic: "我们从在[extract_site.GetName][GetPlayer.Custom('PamConsecratedEnshrined')]的[relic_saint.GetFirstName]的神圣遗骸中取得了一件圣物：#EMP [relic_artifact.GetName]#!。愿它世世代代祝福我领地中的信众。"
 pam_saint_events.0006.desc: "从在[extract_site.GetName][GetPlayer.Custom('PamConsecratedEnshrined')]的[relic_saint.GetFirstName]的神圣遗骸中，一件[Concept('artifact','圣物')|E]被取出以保佑我的领地。"
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "荣耀归于天主！"
 pam_saint_events.0006.a_va: "万分感谢。"
 pam_saint_events.0006.a.tt: "[relic_artifact.GetName]已被取出，现在由你保管。"
 pam_dulia_relic_dynasty_prestige_tt: "来自[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]信条："
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "来自[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]信条，你的[faith|E]的所有[ruler|E]获得$pam_dulia_new_saint_modifier$，持续#EMP 5#!年"
 pam_dulia_new_saint_message_t: "新代祷者"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.GetTitledFirstName]已被抬上祭坛，[pam_new_saint.GetFaith.GetName]的信众获得了天主面前的一位代祷者。"
 # Relic benefit requirement (can_benefit on pam_saint_relic_template).
 pam_saint_relic_benefit_faith_tt: "持有者与[CHARACTER.GetShortUIName][religion|E]相同"
