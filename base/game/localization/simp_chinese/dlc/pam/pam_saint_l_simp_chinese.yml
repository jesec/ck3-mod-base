 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "祝圣圣人"
 pam_choose_consecration_site_decision_va: "祝圣[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "我将选择我的[realm|EU]内的[Concept('ecclesiastical_domicile_building','主教座堂')|E]，在此祝圣这位[Concept('canonized','圣人')|E]，并安放其遗骨，以吸引信众前来。"
 pam_choose_consecration_site_decision_desc_va: "我将选择我的[realm|EU]内的一处神圣之地，在此祝圣这位[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]，并安放其遗骨，以吸引信众前来。"
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "我将选择我的[realm|EU]内的[faith|EU][Concept('holy_site','圣地')|E]，在此祝圣这位[Concept('canonized','圣人')|E]，并安放其遗骨，以吸引信众前来。"
 pam_choose_consecration_site_decision_desc_holy_site_va: "我将选择我的[realm|EU]内的[faith|EU][Concept('holy_site','Holy Site')|E]，在此祝圣这位[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]，并安放其遗骨，以吸引信众前来。"
 pam_choose_consecration_site_decision_tooltip: "选择[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]祝圣地点。"
