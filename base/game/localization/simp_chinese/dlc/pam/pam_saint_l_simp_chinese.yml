 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "获取圣物"
 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U]在我的领地内接受[GetPlayer.Custom('PamConsecratedEnshrined')]。我们可以怀着应有的敬意，从其遗体中取出圣物来祝福信徒。"
 pam_extract_relic_decision_tooltip: "从埋葬在你控制的土地上的[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]处取得一件圣物。"
 pam_extract_relic_decision_confirm: "获取圣物"
 pam_extract_relic_decision_req_saint: "你的[realm|EU]内安息着你可以从其身上获取圣物的[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U]"
 pam_extract_relic_decision_req_saint_count: "迄今为止从[CHARACTER.GetShortUIName]取得了[CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')]/[CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')][Concept('artifact','圣物')|E]"
 pam_extract_relic_decision_extract_tt: "从[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]的遗体获取一件[Concept('artifact','圣物')|E]"
 pam_extract_relic_decision_choose_tt: "选择从哪位埋葬的[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]身上获取[Concept('artifact','圣物')|E]"
 pam_extract_relic_decision_item_valid_tt: "仍可以从该[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]身上获取[Concept('artifact','圣物')|E]。"
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "请愿书送出"
 pam_saint_events.0001.desc: "[saint_candidate.GetFirstName]一事已准备就绪，在[consecration_province.GetName]有一处荣耀之地等待着其受祝福的遗骨。\n\n如今此事已超出我的掌控：请愿书已送往[petition_recipient.GetTitledFirstName]，我只能祈祷裁决是恩允的。"
 pam_saint_events.0001.a: "我们等待并祈祷。"
 pam_saint_events.0001.a.tt_saint: "一封请求在[consecration_province.GetName]祝圣[saint_candidate.GetFirstName]使其成为[Concept('canonized','圣人')|E]的请愿书将被送交[petition_recipient.GetTitledFirstName]。其答复将稍后送来。"
 pam_saint_events.0001.a.tt_va: "一封请求在[consecration_province.GetName][saint_candidate.Custom('PamConsecratedEnshrined')][saint_candidate.GetFirstName]使其成为[saint_candidate.Custom('PamVeneratedSaintOrAncestor')]的请愿书将被送交[petition_recipient.GetTitledFirstName]。其答复将稍后送来。"
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "封圣请愿书"
 pam_saint_events.0002.t_va: "崇敬请愿书"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName]恳求我们将[saint_candidate.GetFirstName]列入真福圣人，在[consecration_province.GetName]接受祝圣。"
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName]恳求我们将[saint_candidate.GetFirstName]列入[saint_candidate.Custom('PamBlessedOnesOrAncestors')]，在[consecration_province.GetName]接受[saint_candidate.Custom('PamConsecratedEnshrined')]。"
 pam_saint_events.0002.desc.traits_1: "\n\n在生前，[saint_candidate.GetFirstNameNoTooltip]是个[pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]的[saint_candidate.GetWomanMan]。"
 pam_saint_events.0002.desc.traits_2: "\n\n在生前，[saint_candidate.GetFirstNameNoTooltip]是个[pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]、[pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]的[saint_candidate.GetWomanMan]。"
 pam_saint_events.0002.desc.traits_3: "\n\n在生前，[saint_candidate.GetFirstNameNoTooltip]是个[pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]、[pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]和[pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]的[saint_candidate.GetWomanMan]。"
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "一缕闪烁的光从这灵魂中散发出来；一道微弱的火焰，然而并非每一位圣人都是在更大的火焰中锻造出来的。\n\n决断权在我们手中。"
 pam_saint_events.0002.desc.virtue_1_va: "一缕闪烁的光从这灵魂中散发出来；一道微弱的火焰，然而并非每一位受尊崇的灵魂都是在更大的火焰中锻造出来的。\n\n决断权在我们手中。"
 pam_saint_events.0002.desc.virtue_2: "不可否认，这个灵魂取得的成就足以取悦[saint_candidate.GetFaith.HighGodName]——这无疑是一种恩典，尽管并不完美。\n\n决断权在我们手中。"
 pam_saint_events.0002.desc.virtue_3: "这个灵魂是美德的化身；鲜有凡人能如此清晰地披戴如此多的神圣。\n\n决断权在我们手中。"
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName]无疑配得上。"
 pam_saint_events.0002.a.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive]的[canonizer.GetFaith.GetAdherentName][Concept('dynasty','宗族')|E]成员对你的[Concept('opinion','好感度')|E]提高#P 10#!，持续20年"
 pam_saint_events.0002.b: "我们不同意。"
 pam_saint_events.0002.b.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive]的[canonizer.GetFaith.GetAdherentName][Concept('dynasty','宗族')|E]成员对你的[Concept('opinion','好感度')|E]降低#N 10#!，持续20年"
