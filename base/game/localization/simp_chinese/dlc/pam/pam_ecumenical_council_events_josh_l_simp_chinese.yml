l_simp_chinese:
 ecumenical_council_events_josh.0001.t: "夜祷谋杀案"
 ecumenical_council_events_josh.0001.desc: "虔信者的行为是如此呆板。前来[Glossary( '夜祷', 'COMPLINE_GLOSS' )]的[murder_target.GetTitledFirstName]躬身祈祷，我趁机潜伏在阴影中。\n\n[murder_target.GetHerHis|U]那冗长的祷词让[murder_target.GetHerHim]的弱点暴露无遗。这里只有我们两人，即使精致的长袍——无论是法衣还是丝绒服——都能成为套索。"
 ecumenical_council_events_josh.0001.a: "过去勒紧[murder_target.GetHerHis]的华服。"
 ecumenical_council_events_josh.0001.a.tt: "有点太紧了"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetSheHe|U]摆脱我的扼制"
 ecumenical_council_events_josh.0001.a.toast.success: "谋杀成功"
 ecumenical_council_events_josh.0001.a.toast.failure: "谋杀失败"
 ecumenical_council_events_josh.0001.a.flavor: "祈祷这么勤的人，一定是罪人……"
 ecumenical_council_events_josh.0001.b: "不，不能在这神圣之举期间……"
 COMPLINE_GLOSS: "夜祷是基督教传统中日课的最末一次祈祷。"
 ecumenical_council_events_josh.0010.t: "圣人庆典"
 ecumenical_council_events_josh.0010.desc: "教士齐聚一堂，没什么比纪念我们的指路明星更令人高兴了。本月，我们认为最适合向[monthly_saint.GetTitledFirstName]致敬。\n\n“以[ROOT.Char.GetFaith.HighGodNamePossessive]之名，我们将指引这一天的礼拜。”"
 ecumenical_council_events_josh.0010.a: "举行弥撒。"
 ecumenical_council_events_josh.0010.b: "我会主持一场讲道。"
 ecumenical_council_events_josh.0010.c: "只需额外添加一首圣咏。"
 ecumenical_council_events_josh.0011.t: "声如雷震"
 ecumenical_council_events_josh.0011.desc: "和宾客打招呼时，站在人群中的[guest_giant.GetTitledFirstName][guest_giant.GetHerHis]那高大的体型吸引了我的目光。但当[guest_giant.GetSheHe]说出“安好，我的信仰守护者同伴”时，我才发现他真正的潜力。 \n\n[guest_giant.GetSheHe]那雷鸣般的洪亮声音会非常有用。[Glossary( '晚祷', 'VESPER_GLOSS' )]中的圣咏需要一名低音……"
 ecumenical_council_events_josh.0011.a: "让[guest_giant.GetHerHis]吟诵我们献给[ROOT.Char.GetFaith.HighGodName]的祷词。"
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName]和在场的所有人都会感到震撼。"
 ecumenical_council_events_josh.0011.b: "我在辩论中用得上他那洪亮的支持。"
 ecumenical_council_events_josh.0011.b.tt: "[guest_giant.GetSheHe|U]成为可以依仗的人"
 ecumenical_council_events_josh.0011.b.tt2: "[guest_giant.GetSheHe|U]只有分得自己的一份才能被信任"
 ecumenical_council_events_josh.0011.b.toast.success: "你说服[guest_giant.GetHerHim]支持你。"
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetSheHe|U]希望能获得一些回报"
 ecumenical_council_events_josh.0011.b.flavor: "让[guest_giant.GetTitledFirstName]在合适的时机大声赞同，我就能获得优势。"
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U]是客人，不是工具。"
 ecumenical_council_events_josh.0011.c.flavor: "在我们中给[guest_giant.GetHerHim]找个位置。"
 ecumenical_council_events_josh.0011.c.tt: "你没有迫使[guest_giant.GetTitledFirstName]加入唱诗班或参与辩论"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]在大公会议期间决定支持[CHARACTER.GetShortUIName]。"
 VESPER_GLOSS: "晚祷通常是基督教传统中日课的晚饭前祈祷。"
 ecumenical_council_events_josh.0012.t: "主教的戒指"
 ecumenical_council_events_josh.0012.desc: "我注意到[guest_bishoplover.GetTitledFirstName]和[guest_bishop.GetTitledFirstName]自会议开始以来就形影不离。今天早上在[Glossary( '晨祷', 'LAUD_GLOSS' )]时，[guest_bishoplover.GetFirstName]不仅迟到还衣冠不整。[guest_bishoplover.GetHerHis]手指上戴的是不是[guest_bishop.GetFirstNamePossessive]的戒指？我挑了挑眉毛，轻轻把我注意到的告诉了[guest_bishoplover.GetHerHim]。\n\n[guest_bishoplover.GetFirstName]意识到自己露馅了，红着脸，结结巴巴地回应道。\n\n“求你了，别让任何人知道……”"
 ecumenical_council_events_josh.0012.b: "“把戒指给我，然后什么都别说。”"
 ecumenical_council_events_josh.0012.c: "“这件事只有你、我和[ROOT.Char.GetFaith.HighGodName]知道。”"
 ecumenical_council_events_josh.0012.bishopringname: "主教戒指"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\n一个表明佩戴者宗徒职务的明显标志。"
 LAUD_GLOSS: "晨祷通常是基督教传统中日课的早饭前祈祷。"
 ecumenical_council_events_josh.0013.t: "时尚之罪"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U]身着华丽的长袍站着。毫无疑问，这身为此场合新织的祭服是来自其虔诚信众的礼物。丝质圣带上绣着[ROOT.Char.GetFaith.WealthGodName]的图案。\n\n真是大胆！[fashion_criminal.GetSheHe]是在公然违反[fashion_criminal.GetFaith.GetName]的信条，还是仅仅是只虚荣的孔雀？"
 ecumenical_council_events_josh.0013.a: "“把这可耻的人从我眼前带走。”"
 ecumenical_council_events_josh.0013.b: "“退下，你已经证明自己配不上！”"
 ecumenical_council_events_josh.0013.b.toast.success: "你将[fashion_criminal.GetHerHim]驱离了。"
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetSheHe|U]设法继续留在会议。"
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]在大公会议上穿着不合适的衣服。"
 ecumenical_council_events_josh.0020.t: "热忱的灯塔"
 ecumenical_council_events_josh.0020.desc.intro: "“瞧瞧这[ROOT.Char.GetFaith.GetName]的支柱！这正是义人追随十字架的证明。”\n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: "指出，[faith_battle_memory.GetDescription]。必须处处与异教徒对抗。我拔出剑，接受他的赞扬。“为了信徒！”"
 ecumenical_council_events_josh.0020.desc.fallback: "认可我近期对信仰所做的贡献。在一众神职人员面前受到褒奖，让我胸膛充满了骄傲。"
 ecumenical_council_events_josh.0020.a: "“以[ROOT.Char.GetFaith.HighGodNamePossessive]之名，我们必将胜利！”"
 ecumenical_council_events_josh.0020.a.flavor: "我的举动打动了在场的神职人员。"
 ecumenical_council_events_josh.0020.b: "我将尽情享受这份荣耀。"
 ecumenical_council_events_josh.0021.t: "在光明中"
 ecumenical_council_events_josh.0021.desc: "辩论持续进行，一束光线洒落在地面上。我走进那束光里，突然间所有的目光都转向了我。\n\n仿佛我的话语还不够有力，这束神圣的光选择为我的主张助力，我的辩论对手[council_opponent.GetFirstName]则被留在了阴影中。[council_opponent.GetHerHis|U]的论点似乎显得更加含糊不清了。"
 ecumenical_council_events_josh.0021.a: "趁势压制[council_opponent.GetFirstName]。"
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U]放弃[ec_conservatives|E]加入[ec_innovators|E]"
 ecumenical_council_events_josh.0021.b: "让光明战胜集会。"
 ecumenical_council_events_josh.0021.b.ct: "最多#V 3#!名[ec_conservatives|E]加入[ec_innovators|E]"
 ecumenical_council_events_josh.0021.c: "让他们见证我的光彩。"
 ecumenical_council_events_josh.0021.c.ct: "增加#V 50#!对一个[clerical_title|E][appointment|E]的投资"
 ecumenical_council_events_josh.0022.t: "团结在信仰中"
 ecumenical_council_events_josh.0022.desc: "在会议上巡视时，[host.GetTitledFirstName|U]看到了一个机会，可以让追随者们团结起来共同对抗外部威胁。[host.GetSheHe|U]唤我和[alliance_target.GetTitledFirstName]来到[host.GetHerHim]面前。\n\n“我忠诚的信徒们，你们既要在信仰中坚定，也要在面对困境时并肩而立。”"
 ecumenical_council_events_josh.0022.a: "让教会祝福我们的同盟。"
 ecumenical_council_events_josh.0022.a.flavor: "我将利用我的虔诚声望来确立同盟。"
 ecumenical_council_events_josh.0022.b: "同盟将建立在相互理解的基础上。"
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetHerHim|U]同意结盟。"
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetSheHe|U]对你的示好感到被冒犯。"
 ecumenical_council_events_josh.0022.b.flavor: "我与人相处的迷人方式，肯定足够了。"
 ecumenical_council_events_josh.0022.c: "会议不是合适的地点。"
 ecumenical_council_events_josh.0022.c.flavor: "鞠躬致意便已足够。"
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U]拒绝了不适当的结盟。"
 ecumenical_council_events_josh.0023.t: "为我祈祷"
 ecumenical_council_events_josh.0023.desc: "“愿恩典与平安归于你。”[host.GetTitledFirstName|U]正在祝福走近的宾客。我正好可以趁此机会，拜倒在这位信仰之柱面前，这或许能让[host.GetHerHim]在[host.GetHerHis]的[Glossary( '晨祷', 'LAUD_GLOSS' )]中为我祈祷，那必能更接近救赎。\n\n“边上站站，别磨蹭了。你堵着队伍了。”排在我后面的[prayer_opponent.GetFirstName|U]低声催促道。"
 ecumenical_council_events_josh.0023.a: "“一笔可观的捐赠，愿你能为我祈祷。”"
 ecumenical_council_events_josh.0023.b: "亲吻主持者祭袍的下摆。"
 ecumenical_council_events_josh.0023.b.tt: "我确保我的请求得到倾听"
 ecumenical_council_events_josh.0023.b.tt2: "我违反了礼仪，被推到了一边"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U]会为你祈祷。"
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U]对你的请求置之不理。"
 ecumenical_council_events_josh.0023.c: "最好谦虚退让，保持虔诚。"
 ecumenical_council_events_josh.0024.t: "奥秘之美"
 ecumenical_council_events_josh.0024.desc: "有些人来到这里，纯粹是为了热切地谈论神圣的奥秘，渴望做出新奇的阐释，并为此争论不休。[tenet_target_a.GetName]便是其中一位与会者。\n\n“[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]！[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]，我的弟兄们。尊崇[ROOT.Char.GetFaith.HighGodName]置于我们面前的这些戒律，依次寻求智慧，你们终将领悟神圣！”\n\n人群中议论声此起彼伏。与此同时，[tenet_target_b.Custom('FormalComplimentAdjective')][tenet_target_b.GetTitledFirstName]，则被一部陌生的经文吸引。我唯一能辨认出的几个字是：“[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )]。”"
 ecumenical_council_events_josh.0024.a: "“你说智慧，[tenet_target_a.GetFirstNameNoTooltip]？”"
 ecumenical_council_events_josh.0024.b: "那本书看起来很有趣。"
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName]早已为我指明了真正的道路。"
 ecumenical_council_events_josh.0025.t: "不速之神学家"
 ecumenical_council_events_josh.0025.desc: "会场边缘出现一阵骚动。几名不寻常的新来者抖落了路上的尘埃；我们的主教们窃窃私语，凝目注视，并示意新来者离开。这群陌生人的首领，一个[theologian.GetWomanMan]高声喊道：\n\n“我远道而来，是为了替[theologian.GetFaith.GetAdherentNamePlural]同胞见证。古时的教父和神圣的宗徒们，曾情同手足。既然如此，为何我不能获准入内？”"
 ecumenical_council_events_josh.0025.a: "入场需要付费……"
 ecumenical_council_events_josh.0025.a.flavor: "我可以轻松地把[theologian.GetHerHim]加到我的邀请名单末尾。"
 ecumenical_council_events_josh.0025.b: "“你们的教义简直是耻辱！”"
 ecumenical_council_events_josh.0025.c: "“有趣。不如我们稍后自己开个会议。”"
 ecumenical_council_events_josh.0025.d: "礼貌地引导[theologian.GetHerHim]离开。"
