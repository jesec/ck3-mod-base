 pam_ss_word_minbar: "讲经坛"
 pam_ss_word_lectern: "讲台"
 pam_ss_word_seminary: "神学院"
 pam_ss_word_madrasa: "经学院"
 pam_ss_word_school: "学校"
 pam_ss_word_offices: "公务署"
 pam_ss_word_daily_prayers: "日常祈祷"
 pam_ss_word_daily_rites: "日常礼仪"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "荒废学术"
 pam_lapsed_studies_modifier_desc: "该角色因绝望而放弃了神圣的学问。"
 pam_renewed_zeal_modifier: "重燃热忱"
 pam_renewed_zeal_modifier_desc: "受到严厉告诫后，该角色已重新致力于其学业。\n[GetScheme('study_scripture').GetTypeName][success_chance|E]：#P +10%#!"
 pam_inspired_study_modifier: "激励学习"
 pam_inspired_study_modifier_desc: "一份贴心的礼物能让这些研究得以继续。"
 pam_cloistered_rigor_modifier: "闭门苦读"
 pam_cloistered_rigor_modifier_desc: "学习在闭门之后以不遗余力的严谨态度进行。"
 pam_cloistered_rigor_personal_modifier: "埋头苦读"
 pam_cloistered_rigor_personal_modifier_desc: "该角色已退出世俗事务，以不懈的严谨态度投身于神圣学识的追求。"
 pam_measured_devotion_modifier: "审慎虔诚"
 pam_measured_devotion_modifier_desc: "这些研究在专门拨出的时间内稳步进行。"
 pam_measured_devotion_personal_modifier: "虔诚的经学家"
 pam_measured_devotion_personal_modifier_desc: "该角色正以沉稳而坚定的虔诚之心钻研神圣学识。"
 pam_mortified_flesh_modifier: "克修"
 pam_mortified_flesh_modifier_desc: "守斋和守夜使研习时的头脑更加敏锐。"
 pam_divine_favor_modifier: "神圣眷顾"
 pam_divine_favor_modifier_desc: "这些学习在祝福之下进行。"
 pam_devoted_acolyte_modifier: "尽职的辅祭"
 pam_devoted_acolyte_modifier_desc: "一个尽职的帮手能满足这些研习的所有需求。"
 pam_amanuensis_modifier: "忠实抄写员"
 pam_amanuensis_modifier_desc: "一位忠实的助手将笔记与页面整理得井井有条。"
 pam_persistent_devotions_modifier: "虔诚不渝"
 pam_persistent_devotions_modifier_desc: "挫折只会让这些研究更加严谨。"
 pam_renowned_exegete_modifier: "著名解经家"
 pam_renowned_exegete_modifier_desc: "该角色对神圣文本的解读使其成为一位[Glossary('解经家', 'GLOSS_EXEGETE')]。"
 pam_doctrinal_clarity_modifier: "教义明晰"
 pam_doctrinal_clarity_modifier_desc: "该角色对其信仰的教义有着极为清晰的领悟。\n\n$sway_ruler_to_my_rite_interaction$接受度：#p +20#!\n$pam_evangelize_personal_tenet_interaction$接受度：#p +20#!\n$pam_evangelize_personal_tenet_interaction$[piety|E]花费：#p -50%#!"
 pam_known_in_the_synod_modifier: "在教会会议中闻名"
 pam_known_in_the_synod_modifier_desc: "该角色的学识在神职人员中口口相传。"
 pam_assisted_by_theologians_modifier: "被神学家帮助"
 pam_assisted_by_theologians_modifier_desc: "博学的神学家们正在帮助该角色。"
 pam_known_by_mystics_modifier: "为神秘主义者所知"
 pam_known_by_mystics_modifier_desc: "该角色在神秘主义者与沉思者中备受推崇。"
 pam_monastic_copyists_modifier: "修道院抄写员"
 pam_monastic_copyists_modifier_desc: "不知疲倦的修道院抄写员为这些研究提供新的文本。"
 pam_charterhouse_silence_modifier: "加尔都西会修道院的静默"
 pam_charterhouse_silence_modifier_desc: "默观的戒律让研习稳步进行。"
 pam_pastoral_letter_county_modifier: "牧函"
 pam_pastoral_letter_county_modifier_desc: "每次礼拜时，都会大声朗读一封信函件，里面有着远方信仰牧者的慰问和训示。"
