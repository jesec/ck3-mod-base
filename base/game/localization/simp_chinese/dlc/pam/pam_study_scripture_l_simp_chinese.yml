l_simp_chinese:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "宗教学习"
 study_scripture_action: "宗教学习"
 study_scripture_desc: "我将投身于神圣的学问——[GetPlayer.GetFaith.ReligiousText]、我信仰的教义，以及超越它们的奥秘。"
 study_scripture_desc_general: "$study_scripture$是一种[personal_scheme|E]，通过它你可以你可以尝试获得[piety|E]、[skill|E]和[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )][trait|E]。"
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "你提升你的技能、获得虔诚或发现机会"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "你欣然接纳[GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]：$VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "你欣然接纳[GetTenetType('tenet_scholasticism').GetBaseName]：$VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "你的圣职上级的[learning|E]：$VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "你拥有[GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip]：$VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "你的[stress|E]影响了你的学习：$VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "你拥有[GetTrait('zealous').GetName( owner )]：$VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "你拥有[GetTrait('cynical').GetName( owner )]特质：$VALUE|+0=$"
 pam_study_scripture_decision: "研读[ROOT.Char.GetFaith.ReligiousText|U]"
 pam_study_scripture_decision_desc: "[ROOT.Char.GetFaith.ReligiousText]不会自行解读，[ROOT.Char.GetFaith.GetName]的教义也不会向懒散之人展现。把[ROOT.Char.Custom('StudyOfficesWord')]之间的时间空出来——去研读，去默想，让羊群看到它们的牧者在学习。"
 pam_study_scripture_decision_tooltip: "开始一项针对你自己的[GetScheme('study_scripture').GetTypeName][scheme|E]"
 pam_study_scripture_decision_tt: "你开始一项针对你自己的[GetScheme('study_scripture').GetTypeName][scheme|E]\n\n预期奖励：\n$EFFECT_LIST_BULLET$[piety_i][piety|E]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )][trait|E]/[trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[learning_i][stewardship_i][diplomacy_i][skill|E]#weak （最多8点）#!\n$EFFECT_LIST_BULLET$[clergy|E]中的机会\n\n缺点：\n$EFFECT_LIST_BULLET$可能获得[stress_i][stress|E]\n$EFFECT_LIST_BULLET$降低[prestige_i][prestige|E]获得"
 pam_study_scripture_decision_confirm: "让课程开始吧。"
 pam_study_scripture_decision_req_tt: "你目前没有进行[GetScheme('study_scripture').GetTypeName][scheme|E]"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial 你进行中的[personal_scheme|E]将结束#!"
 study_scripture_title: "$study_scripture$："
 study_scripture_outcome_piety: "$study_scripture_title$虔诚得报"
 study_scripture_outcome_fragment_tt: "#EMP “[owner.Custom('RandomStudyVerseFragment')]”#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$经文洞察"
 study_scripture_outcome_mystery: "$study_scripture_title$一窥奥迹"
 study_scripture_outcome_stress: "$study_scripture_title$学习倦怠"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "是我步履前的灵灯，是我路途上的光明……"
 pam_ss_fragment_psalm_119_165: "爱慕你法律的必饱享平安……"
 pam_ss_fragment_proverbs_9_9: "你若指教明智的人……"
 pam_ss_fragment_proverbs_4_7: "首先应争取的是智慧……"
 pam_ss_fragment_joshua_1_8: "你要日夜默思……"
 pam_ss_fragment_matthew_7_7: "你们找，必要找着……"
 pam_ss_fragment_james_1_5: "你们中谁若缺乏智慧……"
 pam_ss_fragment_2_timothy_2_15: "你要努力在天主前，显示自己是经得起考验的……"
 pam_ss_fragment_verbum_domini: "主的圣言永远常存……"
 pam_ss_fragment_generic_1: "谜团愈发深重……"
 pam_ss_fragment_generic_2: "智慧生根发芽……"
 pam_ss_fragment_generic_3: "文字逐渐揭示其含义……"
