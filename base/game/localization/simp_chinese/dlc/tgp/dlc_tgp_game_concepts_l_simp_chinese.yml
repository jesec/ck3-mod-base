l_simp_chinese:
 # Meritocratic
 game_concept_meritocratic: "贤能制"
 game_concept_meritocratic_desc: "$game_concept_meritocratic$是一种与[celestial|E]类似的[government_bureaucratic_type|E][government_form|E]，[liege|E]可以任命角色担任民政或军事[governors|E]。\n\n角色可以使用[influence|E]、[noble_families|E]和[family_mansions|E]。\n\n独立[rulers|E]拥有[legitimacy|E]，而[vassals|E]专注于提升[merit|E]。"
 game_concept_meritocratic_i: "@government_type_meritocratic!"
 # Meritocratic Bureaucracy
 game_concept_meritocratic_bureaucracy: "贤能官僚制"
 game_concept_meritocratic_bureaucracy_desc: "$game_concept_meritocratic_bureaucracy$代表了[meritocratic|E][realm_possessive|E]的集权等级，以及[ruler|E]对[vassals|E]的一般权力。\n\n只有[top_liege|E]可以更改$game_concept_meritocratic_bureaucracy$。贤能制$game_concept_vassals$使用与$game_concept_liege$同等级的官僚体制。\n\n共有四级$game_concept_meritocratic_bureaucracy$：\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_0$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_1$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_2$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_3$\n\n提高$game_concept_meritocratic_bureaucracy$需要花费一定的[prestige|E]，具体取决于[realm_size|E]和统治者的[learning_skill|E]。"
 # Steppe Admin
 game_concept_steppe_admin: "宫帐制"
 game_concept_steppe_admin_desc: "$game_concept_steppe_admin$是一种类似于[celestial|E]和[meritocratic|E]的[government_bureaucratic_type|E][government_form|E]，但它源自[nomadic|E]$game_concept_government_form$。[liege|E]任命角色担任[governors|E]，分为民政和军事两类。他们仍然保留[tributaries|E]、推行[obedience|E]，且拥有更高的[dread|E]上限。\n\n角色可使用[influence|E]、[noble_families|E]和[family_mansions|E]。\n\n独立[rulers|E]拥有[legitimacy|E]，而[vassals|E]则专注于获取[merit|E]。"
 game_concept_steppe_admin_i: "@government_type_steppe_admin!"
 game_concept_ceremonial_claimant_faction: "$ceremonial_claimant_faction$"
 game_concept_ceremonial_claimant_factions: "礼节性宣称者派系"
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$谋求扶持特定的[claimant|E]成为[ceremonial_liege|E]。一旦成功，现任礼节性领主需要将其[title|E]让位给宣称者。所有[faction|E]成员将获得一个对宣称者的[hook|E]。"
 game_concept_imperial_policy_faction: "$imperial_policy_faction$"
 game_concept_faction_imperial_policy: "帝国政策"
 game_concept_imperial_policy_factions: "帝国政策派系"
 game_concept_imperial_policy_faction_desc: "$game_concept_imperial_policy_faction$寻求更改[realm|E]的[imperial_policy|E]，采用派系领袖选择的新[law|E]。"
 game_concept_east_asian_estate: "东亚庄园"
 game_concept_east_asian_estates: "东亚庄园"
 game_concept_mansion: "庄园"
 game_concept_mansions: "庄园"
 game_concept_family_mansion: "家族庄园"
 game_concept_family_mansions: "家族庄园"
 game_concept_east_asian_estate_desc: "$game_concept_mansion$是由[GetGovernment('japan_administrative_government').GetName]和[GetGovernment('japan_feudal_government').GetName][realms|E]内的[noble_families|E][house_head|E]持有的[domicile|E]类型，代表与任何特定[landed|E][title|E]无关的私人土地。\n\n[east_asian_estate|E]可以建造来扩大家族的财富和[influence|E]，$game_concept_mansion$将由后代继承。"
 game_concept_east_asian_estate_building: "东亚庄园建筑"
 game_concept_east_asian_estate_buildings: "东亚庄园建筑"
 game_concept_mansion_building: "庄园建筑"
 game_concept_mansion_buildings: "庄园建筑"
 game_concept_east_asian_estate_building_desc: "$game_concept_east_asian_estate_buildings$是[east_asian_estate|E]的独特且持久的改进。\n\n庄园所有者可以建造各种建筑物，以产出私人收入，扩大家族的[influence|E]，获得一定数量的[decisions|E]、[interactions|E]，以及其他更多。"
