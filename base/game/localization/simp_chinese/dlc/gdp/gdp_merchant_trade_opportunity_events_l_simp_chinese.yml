l_simp_chinese:
 gdp_merchant_trade_opportunity.0001.t: "挑战竞争者：[task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "[task_contract_target.GetPrimaryTitle.GetNamePossessive]的存在如芒刺在背，时刻损害着我们的前景与利润，在[local_market.GetShortName]更是如此。\n\n必须解决这些麻烦制造者，无论如何都要让他们明白，我们才是当地市场的合法掌控者。"
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "经过多日多夜对当地商贩的游说，彻底摸清了[trade_market.GetShortName]市场的底细后，我们发现了[target_title.GetNamePossessive]的弱点。\n\n我们会凭借削弱其当地关系的手段，并在关键领域压价和抬价，我们很快就能让他们的利润与声誉双双暴跌！"
 gdp_merchant_trade_opportunity.0002.a: "让他们学会别踏足我们的地盘。"
 gdp_merchant_trade_opportunity.0002.b: "亮出底牌会赢得他们的尊重。"
 gdp_merchant_trade_opportunity.0002.b.tt: "你必须是[friend|E]、[spouse|E]，或拥有至少[SCOPE.ScriptValue('high_skill_rating')|V0][diplomacy|E]，且没有负面[relation|E]或处于[house_feuding|E]状态"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "我们试图在[trade_market.GetShortName]乃至更远地区压制[target_title.GetNamePossessive]的贸易网络的努力收效甚微。似乎我们反而损害了自己在[task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')]的声誉。\n\n我们笨拙的交易只巩固了[target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]家族的地位，其漫长贸易路线的链条上竟找不到一丝破绽……"
 gdp_merchant_trade_opportunity.0003.a: "[ROOT.Char.GetFaith.WealthGodName]啊！这将蚕食我们的利润！"
 gdp_merchant_trade_opportunity.0011.t: "推广商品：[task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]熙熙攘攘的[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]中，商贩与商人间对各类货物的竞争异常激烈。\n\n市场充满喧嚣，来往不息的人流擦肩而过，如何让我们的商品脱颖而出，吸引顾客与店主的眼球，这个问题变得尤为尖锐……"
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "我们在[target_title.GetBaseNameNoTierNoTooltip]推广[trade_good_type.GetNameNoTooltip|l]销售的努力似乎有了效果，许多人开始寻找我们的“优质”产品，整个地区的销售额也在稳步上升。\n\n看来我们的推销，正好打动了该打动的人的钱袋子！"
 gdp_merchant_trade_opportunity.0012.a: "我们不会浪费这次机会。"
 gdp_merchant_trade_opportunity.0012.b: "我已经闻到[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]的味道了！"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "显而易见的是，我们为了吸引顾客所做的所有努力——尽管对商品质量的描述确实有些夸大——并没有达到预期的效果……\n\n销售额非但没有上升，反而在下降，[target_title.GetBaseNameNoTierNoTooltip]各地对[trade_good_type.GetNameNoTooltip|l]的需求似乎在枯竭，买家的信任度也在下降。"
 gdp_merchant_trade_opportunity.0013.a: "但这些#EMP 可是#!最优质的[trade_good_type.GetNameNoTooltip|l]！"
 gdp_merchant_trade_opportunity.0021.t: "鼓励投资：[local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "漫步于[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]，其基础设施的诸多不足显露出来，从道路质量到简陋的仓储设施，乃至[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l]本身都是这样。\n\n必须让当地统治者看到少量投资带来的巨大回报。如若不然，要想充分利用我们在此地的关系，我们就得自己动手了……"
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "我们精准诊断了[target_title.GetAdjectiveNoTooltip]基础设施的不足及改善后的收益，成功引起了关键人物的注意。\n\n播下的种子开始结果，[local_ruler.GetTitledFirstName]似乎已被说服，工程即将启动。随着贸易流量有望增长，当地商人与城镇居民已试探性地向我们道贺。"
 gdp_merchant_trade_opportunity.0022.a: "若想成事，唯有亲为。"
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "我们试图说服当地人士认识到[target_title.GetAdjectiveNoTooltip]基础设施诸多不足的努力，结果却令人尴尬地收效甚微，看来这些人是听不进劝的。\n\n一次次的失策让一切几乎维持原状，我们辛苦奔忙，只换来了当地官员与商贾的困惑，除非我们亲自动手……"
 gdp_merchant_trade_opportunity.0023.a: "贸易无论如何都必须流动起来。"
 gdp_merchant_trade_opportunity.0023.b: "愚蠢的当地人……"
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$：[local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "在[local_market.GetShortName]的[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]中，劫难的伤痕清晰可见，木板封死的废弃店铺诉说着动荡时期商人外逃后停滞的贸易。\n\n然而，他们必须明白，束手无策与逃离对商业无益，和平也从未有保障。该由我们来恢复秩序，填补他们的空缺了。"
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$：成功"
 gdp_merchant_trade_opportunity.0032.desc: "从紧闭的门后向外窥探，[target_title.GetBaseNameNoTierNoTooltip]的居民很快便明白了我们的来意，我们迅速牢固掌控了市场与货栈。\n\n在此次调整中受损的人不得不勉强接受秩序恢复与贸易缓慢复苏带来的好处。"
 gdp_merchant_trade_opportunity.0032.a: "这不过是桩好买卖……"
 gdp_merchant_trade_opportunity.0032.b: "我们在这里的任务结束了。"
 every_county_province_custom: "[saved_county.GetName]所有$recently_looted_modifier$[holding|E]。"
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$：失败"
 gdp_merchant_trade_opportunity.0033.desc: "我们在[target_title.GetBaseNameNoTierNoTooltip]的强势介入，以及试图将居民引向我们的目的，遭到了广泛的敌意和顽固的拒绝合作。\n\n当地民众与商贩已联合起来对抗我们，他们主张，仅为了换取秩序与商业恢复，便给予我们支配地位，这种代价太高了！"
 gdp_merchant_trade_opportunity.0033.a: "顽固的蠢货！"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$：[task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "[local_market.GetShortName]的[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]中遍布着众多手艺行会，其成员人数严加守护，生产从绳索到银器的各种物品，满足当地人与买家的需求。\n\n通过适当的引介，我们或许能打入这些能工巧匠的关系网，建立我们作为赞助人的声誉，甚至学到些有利可图的技术或潮流。"
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$：成功"
 gdp_merchant_trade_opportunity.0042.desc: "我们用金钱在[target_title.GetBaseNameNoTierNoTooltip]建立了丰硕的关系，资助了各行各业的能工巧匠。他们的成员默默制作着或朴素或非凡的物品。\n\n作为赞助人让我们处处受到欢迎，还吸引了一位备受讨论的当地工匠[inspired_artisan.GetFirstName]，此人正在为制作[inspired_artisan.Custom('InspirationArtisanType')]寻求资助。"
 gdp_merchant_trade_opportunity.0042.a: "我们的投资已达目的。"
 gdp_merchant_trade_opportunity.0042.b: "我们不能错过这个机会！"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$：失败"
 gdp_merchant_trade_opportunity.0043.desc: "我们试图打入当地[target_title.GetBaseNameNoTierNoTooltip]工匠关系网的努力屡遭拒绝，我们的金钱和关注被勉强接受，且鲜有感激。\n\n是我们的声誉因某些误会、对手的操纵，还是仅仅因为我们胆敢插手而变糟？我们或许永远无从知晓……"
 gdp_merchant_trade_opportunity.0043.a: "呸，反正他们的东西都是垃圾……"
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$：[task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]的[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]充斥着金钱的召唤，在每一个眼神和手势中都清晰可感。这个地方非常需要我们的资金，我们引来了潜在的主顾，他们无法抗拒金钱的许诺。\n\n找需要[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]的人远比找放贷者容易，但我们必须眼光独到。我们要以[task_contract_title.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]的权贵为目标，一次有价值的捕获需要手腕与耐心。"
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$：成功"
 gdp_merchant_trade_opportunity.0052.desc: "我们在[target_title.GetBaseNameNoTierNoTooltip]放出提供融资的消息后，没多久就收到了一份谦卑得令人好奇的邀请，而且来自[debtor.GetTitledFirstName]本人。\n\n看来这位尊贵的[debtor.Custom('LadyLordWomanMan')]需要在[debtor.GetHerHis]的账目上有些“灵活度”。区区商人岂敢质疑如此尊贵之人的手段……"
 gdp_merchant_trade_opportunity.0052.a: "“我们来调整一下这边的账目……#EMP [debtor.GetFirstNameNoTooltip]。[debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]的[debtor.GetTitleAsNameNoTooltip]……#!”"
 gdp_merchant_trade_opportunity.0052.b: "“[debtor.GetLadyLord]，恐怕此刻不行。”"
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$：失败"
 gdp_merchant_trade_opportunity.0053.desc: "在放出我们提供融资的消息后，却没什么成果。我们慷慨的提议被[target_title.GetBaseNameNoTierNoTooltip]的当地显贵们一致断然拒绝。\n\n实在难以分辨，到底是因为我们处理不当、其他商人的业务干扰，还是该地区的权贵们难得地恰逢普遍的繁荣时期。"
 gdp_merchant_trade_opportunity.0053.a: "无妨，他们会爬回来的。他们总是这样……"
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$：[task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))][contract_employer.GetFirstName]带来了一个有趣的消息，[market_owner.GetName]需要[trade_good_type.GetNameNoTooltip|l]，正在找商人给[market_owner.GetHerHim]供应一大批货。\n\n[task_contract_target.GetHouse.GetBaseName]商会那位爱吹嘘的[task_contract_target.GetTitledFirstName]已经得意洋洋地宣称，[task_contract_target.GetSheHe]一定能拿下这笔生意。我觉得凭我们的机灵和手段，可以出价压过他们，好挫挫他们的锐气。"
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$：成功"
 gdp_merchant_trade_opportunity.0062.desc: "我们暗中干涉[target_title.GetNamePossessive]贸易的企图已见成效。竞标之日到来时，[target_title.GetHolder.GetTitledFirstName]只能惊恐万分地看着我们取而代之，赢得胜利。\n\n[target_title.GetNameNoTooltip]的声誉严重受损，我们应当明智地利用这一权力真空。"
 gdp_merchant_trade_opportunity.0062.a: "一切按计划进行……"
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$：失败"
 gdp_merchant_trade_opportunity.0063.desc: "尽管我们试图运用诡计，[target_title.GetHolder.GetTitledFirstName]还是再次击败了我们。我们羞愧地承认了对[target_title.GetNameNoTier]的惨败。\n\n我们或许永远无从知晓失误的缘由：是骄傲冲昏了头脑，还是缺乏财务技巧？眼下，我们只知自己垂头丧气、囊中空空地落败了。"
 gdp_merchant_trade_opportunity.0063.a: "我们下次会收拾他们的……"
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$：[trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))][contract_employer.GetFirstName]正在检查一批[trade_good_type.Custom('GetTradeGood')]，仔细端详着每一[trade_good_type.Custom('GetTradeGoodUnitPlural')]，寻找因处理不当而产生的瑕疵，检查每一处是否扎牢。\n\n货物并不总能发挥其全部潜力，可能因疏忽或无知而被浪费。从最低微的小贩到最显赫的大宗商人，都能从中学到很多。"
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$：成功"
 gdp_merchant_trade_opportunity.0072.desc: "穿梭于[destination.GetTitle.GetNameNoTierPossessiveNoTooltip]繁忙的[destination.Custom('GetRegionalMarketTermGloss')]的[destination.Custom('GetProvinceAdjective')]摊位与其静谧的商业会馆之间，我们收集到了许多关于[trade_good_type.Custom('GetTradeGood')]交易艺术的零碎信息、故事和诀窍。\n\n从[trade_good_type.Custom('GetTradeGoodUnitPlural')]的储存和运输，到季节性需求和品质鉴定，我们的所学必将有益于我们在[local_market.GetName|l]及以远地区的商业活动。"
 gdp_merchant_trade_opportunity.0072.a: "谁曾料想[trade_good_type.Custom('GetTradeGood')]还有这么多门道？"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$：失败"
 gdp_merchant_trade_opportunity.0073.desc: "我们在[destination.GetTitle.GetNameNoTierPossessiveNoTooltip]繁忙的[destination.Custom('GetRegionalMarketTermGloss')]的[destination.Custom('GetProvinceAdjective')]摊位与其静谧的商业会馆之间跋涉了无数时日，耗费了漫长时光，却似乎对[trade_good_type.Custom('GetTradeGood')]交易艺术依然一无所获。\n\n沉默寡言的小贩和轻蔑的掮客们对我们的提问大多只报以困惑的嘲笑或警惕的沉默，而分享出来的零碎信息要么微不足道，要么毫无必要地纠缠不清。"
 gdp_merchant_trade_opportunity.0073.a: "呸，我们不需要他们的帮助！"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$：[contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "当我们哀叹[contract_target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]在[market.GetName|l]的最新行径时，我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))][contract_employer.GetFirstName]翻了个白眼。\n\n如果我们不想被甩在后面，就必须对那个[contract_target.GetTitledFirstName]以及[contract_target.GetSuzerain.GetTitledFirstName]对[contract_target.GetHerHis]的支持采取行动……"
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$：成功"
 gdp_merchant_trade_opportunity.0082.desc: "我们不懈地游说中间商，并对[target_title.GetDefinitiveName|l]及其该死的特许状散布怀疑，这些努力似乎已见成效，如今许多人在全盘接受[target_title.GetHolder.GetTitledFirstNamePossessive]的话之前都会三思。\n\n甚至[target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive]在[target_title.GetHolder.GetTitledFirstNamePossessiveNoTooltip]文件上印章的真伪也受到了质疑，这番话传到任何一方耳中都不会令人高兴。"
 gdp_merchant_trade_opportunity.0082.a: "让他们的文件下[ROOT.Char.GetRite.NegativeAfterLife]去吧！"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$：失败"
 gdp_merchant_trade_opportunity.0083.desc: "我们针对[target_title.GetDefinitiveName|l]那些可恶的代理人所进行的不懈串联和密谋全都白费了，面对盖有[target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive]亲印的特许状，几乎没有人愿意考虑我们的提议。\n\n[target_title.GetHolder.GetTitledFirstNamePossessive]的声誉一如既往地清白无瑕，而我们却因自降身价而玷污了自己的名声……"
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName]依然眷顾着[target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]……"
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$：[local_market.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0091.desc: "当我和我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))][associate.GetFirstName]漫步在阴云密布的[destination.Custom('GetRegionalMarketTermGloss')]时，[destination.GetBaronyNameExplicitlyNoTooltip]因战争和饥荒的变幻无常而陷入的糟糕境况一目了然。\n\n令人不安的大量乞丐——无论是寡妇、孤儿还是残疾人——挤满了小巷，一种不祥之兆如同第二层乌云笼罩在冷清的摊位上。"
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$：成功"
 gdp_merchant_trade_opportunity.0092.desc: "我们走遍该地区，设法找到了仍在营业的当地小贩和手艺人，尽管经历了"
 gdp_merchant_trade_opportunity.0092.war: "战争的蹂躏，"
 gdp_merchant_trade_opportunity.0092.disaster: "灾难的临近，"
 gdp_merchant_trade_opportunity.0092.epidemic: "近期疾病的爆发，"
 gdp_merchant_trade_opportunity.0092.closing: "甚至让他们的账本恢复了些许活力。虽然微小，但每一分努力都有帮助。\n\n日复一日，[destination.GetBaronyNameExplicitlyNoTooltip]的[destination.Custom('GetRegionalMarketTermGloss')]似乎回响着更多人的声音，摊位上闪耀着更多货物，客栈里住进了更多访客。\n\n日复一日，[destination.GetBaronyNameExplicitlyNoTooltip]的市场似乎回响着更多人的声音，摊位上闪耀着更多货物，客栈里住进了更多访客。"
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip]很快就会再度繁荣。"
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$：失败"
 gdp_merchant_trade_opportunity.0093.desc: "我们走遍了[destination.GetBaronyNameExplicitlyNoTooltip]，寻找将钱交到最能发挥作用的人手中、恢复该地区商业活力的机会，但大多徒劳无功。\n\n我们找到的人大多是十足的奸商，配不上我们的慷慨，或者根本没有能力做任何好事。面对挫折，我们很难保持乐观，陷入了绝望和沮丧之中。"
 gdp_merchant_trade_opportunity.0093.a: "我们无能为力了……"
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))][associate.GetFirstName]和我，惊叹地伫立着，望着[destination.GetTitle.GetNameNoTierPossessive]宏伟的[destination.Custom('GetRegionalMarketTermGloss')]中熙熙攘攘的摊位。在这里，贸易的流动并非抽象之物——它就像脚下的[ROOT.Char.Custom('GroundType')]一样真切可感。\n\n在这样一个挤满了像我们一样竭力想做成交易的商人的地方，我们怎会找不到优势或人情呢？"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$：成功"
 gdp_merchant_trade_opportunity.0102.desc: "过去几周一直在不停奔波，每日穿梭于[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]，为了会面，也为了寻找人脉；但凭借精明的外交和更为精明的生意手腕，我们已与当地的经纪人和中间商建立了一整套可观的协议。\n\n显然，我们的努力没有白费，我们在这里的工作已为即将到来的季节打下了良好基础。"
 gdp_merchant_trade_opportunity.0102.a: "愿我们的种子结出硕果！"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$：失败"
 gdp_merchant_trade_opportunity.0103.desc: "尽管我们费尽心思讨好当地的经纪人和中间商，每日穿越[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]全境，只为会面与寻找人脉，我们的境况却并不比开始时更好。\n\n这无疑预示着接下来这一季会有麻烦……"
 gdp_merchant_trade_opportunity.0103.a: "[ROOT.Char.GetRite.WealthGodName]啊……"
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$：成功"
 gdp_merchant_trade_opportunity.0112.desc: "我们辛勤工作，在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]全城撒网，寻找可以施恩或行贿的关节。很快，几场有利的拍卖和协议终于证实了我们的期望，商路的稳固也得到了保障。\n\n我们可以安然静坐，心中笃定，我们的工作已保证货物稳定流通，而且还能持续一段时间。"
 gdp_merchant_trade_opportunity.0112.a: "[ROOT.Char.GetRite.WealthGodName]对我们微笑！"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$：失败"
 gdp_merchant_trade_opportunity.0113.desc: "我们所有勤勉的努力——在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]全城撒网，寻找可以施恩或行贿的关节——都化为乌有，如同雨滴落入这片翻腾的商海，被吞没得无影无踪。\n\n显然，我们无法确保获得所需配额所需的商队舱位，而且在一段时间内也办不到……"
 gdp_merchant_trade_opportunity.0113.a: "没有了商队，贸易负责人又算什么……"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))][associate.GetFirstName]和我一起穿过[destination.GetBaronyNameExplicitly]的转口集散地——一个买卖与转售的枢纽，形形色色的商人在此交汇，将货物送往未知而遥远的去处。\n\n在这样的地方，如此多商品易手，真正决定商人成败兴衰的，是规模交易，是靠批发价格做买卖……"
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$：成功"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n不知怎的，我们完好无损地从毒蛇巢穴中脱身，还带着一整套可观的期票，确保来季在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]的[trade_good_type.Custom('GetTradeGood')]的[trade_good_type.Custom('GetTradeGoodUnitPlural')]具有竞争性售价！"
 gdp_merchant_trade_opportunity.0122.intro: "这些日子在一片模糊中过去，无休止的讨价还价、争吵和哄劝，我的目光在翻动的舌头与咬紧的牙关之间来回游移，价格在拍卖场上被尖声喊出，[ROOT.Char.Custom('GroundType')]上散落着丢弃的票据、潦草的字迹和破灭的财富。"
 gdp_merchant_trade_opportunity.0122.a: "这是个买方市场！"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$：失败"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n我们遍体鳞伤、精疲力竭地从毒蛇巢穴中脱身，不仅未能获得我们曾试图锁定的[trade_good_type.Custom('GetTradeGood')]保证售价，还被对手以更高出价压过……"
 gdp_merchant_trade_opportunity.0123.a: "这是个卖方市场……"
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$：成功"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n不知怎的，我们完好无损地从毒蛇巢穴中脱身，还带着一整套可观的期票，确保来季在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]的[trade_good_type.Custom('GetTradeGood')]的[trade_good_type.Custom('GetTradeGoodUnitPlural')]具有竞争性购入价格！"
 gdp_merchant_trade_opportunity.0132.a: "这是个卖方市场！"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$：失败"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n我们遍体鳞伤、精疲力竭地从毒蛇巢穴中脱身，不仅未能获得我们曾试图锁定的[trade_good_type.Custom('GetTradeGood')]保证购入价格，还被对手以更高出价压过……"
 gdp_merchant_trade_opportunity.0133.a: "这是买家市场……"
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$：[task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "[task_contract_target.GetTitledFirstName]作为治安的维护者和法律的捍卫者，从[local_market.GetName|l]的销售中抽取一部分，或许才算公平。\n\n然而，#EMP 总有#!谈判的余地。我们只需让[task_contract_target.GetHerHim]看到我们路线的价值，并说明[task_contract_target.GetSheHe]压在我们可怜脊背上的负担……"
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$：成功"
 gdp_merchant_trade_opportunity.0142.desc: "这些日子漫长难熬，在[task_contract_target.GetTitledFirstName]的厅堂里不停哄劝、奉承、陈情，我们的脸颊至今还因堆笑而发疼，但努力没有白费。\n\n我们争取到了更低的通行费率，确保未来一段时间能有更好的利润空间。"
 gdp_merchant_trade_opportunity.0142.a: "这是好生意的成本。"
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$：失败"
 gdp_merchant_trade_opportunity.0143.desc: "在[target.GetTitledFirstName]的厅堂里哄劝、奉承、陈情了这么多漫长的日子，我们笑得脸颊发痛，站得双腿发软，却只能两手空空地回去，辛劳毫无成果……\n\n今天，当我们等候接见时，[target.GetTitleAsNamePossessiveNoTooltip]的卫兵一本正经地解释说，[target.GetSheHe]很遗憾无法帮助我们，有要事必须处理……"
 gdp_merchant_trade_opportunity.0143.a: "但[target.GetSheHe]看起来这样顺从……"
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$：[destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "[local_market.GetName|l]的代理商和收税人趾高气扬地四处游荡。这些豺狼在一旁讥笑，腰间挂着叮当作响的[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]钱袋，每一袋都是从像[associate.GetFirstName]和我这样正经商人的口袋里摇出来的辛苦钱……\n\n[owner.GetTitledFirstNamePossessive]的通行费是这里生意的祸根，[owner.GetHerHis]的贪婪迫使我们干起了见不得人的营生。"
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$：成功"
 gdp_merchant_trade_opportunity.0152.desc: "经过诸多辛苦，我们已在当地的地痞无赖中建立了良好的人脉，并为从[trade_market.GetName|l]运出的货物确保了可靠的#EMP 替代#!路线。\n\n一箱又一箱，每一批从守卫轻信的眼皮底下经过的货物，省下的钱很快就会积少成多……"
 gdp_merchant_trade_opportunity.0152.a: "这是#EMP 我们#!的钱，得留着。"
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$：失败"
 gdp_merchant_trade_opportunity.0153.desc: "我们试图在[trade_market.GetName|l]建立走私网络，却一次次受挫——我们手下无能，地方当局警觉，当地地痞无赖又不讲信义……\n\n我们别无选择，只能继续交钱；而这一切辛苦，只玷污了我们作为诚实经纪人的名声。"
 gdp_merchant_trade_opportunity.0153.a: "我们本该直接付过路费的……"
 gdp_merchant_trade_opportunity.1001.t: "疏通关节"
 gdp_merchant_trade_opportunity.1001.desc: "我们在[task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip]的联络人一直表现出异乎寻常的沉默，显然当地统治者[local_ruler.GetTitledFirstName]是症结所在。\n\n果然，我们很快便收到那位尊贵的[local_ruler.GetWomanMan]的口信，要求在[local_ruler.GetHerHis]的领地上“#EMP 分一杯羹#!”……"
 gdp_merchant_trade_opportunity.1001.a: "#weak *叹气*#!，给这个[local_ruler.GetWomanMan]些[local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]……"
 gdp_merchant_trade_opportunity.1001.b: "想必#EMP 尊贵#!的头脑会理解我们的处境。"
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip]被打动了"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip]被惹恼了"
 gdp_merchant_trade_opportunity.1001.c: "“你知道，[other_merchant.GetPrimaryTitle.GetNameNoTooltip|l]#EMP 实在#!太放肆了。”"
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip]上钩了"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip]被冒犯了"
 gdp_merchant_trade_opportunity.1001.d: "哼，我们能应付过去。"
 gdp_merchant_trade_opportunity.1011.t: "互惠互利"
 gdp_merchant_trade_opportunity.1011.desc: "我们在[local_market.GetShortName]的经营似乎引起了当地统治者[local_ruler.GetTitledFirstName]的注意，并召见商会私下觐见。\n\n当我立于[local_ruler.GetHerHim]面前时，这位[local_ruler.GetTitleAsNameNoTooltip]微笑道：“贸易带来巨大利益；惠及人民、惠及贵族、惠及整个[local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]！把你的难处告诉我，我定当尽力为你解困。”"
 gdp_merchant_trade_opportunity.1011.a: "#weak *咳咳*#!“各条商道一直#EMP 非常#!艰难，大人……”"
 gdp_merchant_trade_opportunity.1011.b: "“对于当地的[task_contract_location.Custom('GetRegionalMarketTerm')|l]，我倒有些想法。”"
 gdp_merchant_trade_opportunity.1011.b.good: "你的建议很合理"
 gdp_merchant_trade_opportunity.1011.b.bad: "你的建议毫无价值"
 gdp_merchant_trade_opportunity.1011.c: "“[other_merchant.GetPrimaryTitle.GetNameNoTooltip]让事情变得很棘手。”"
 gdp_merchant_trade_opportunity.1011.c.fallback: "“竞争对手让事情变得很棘手。”"
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip]支持你"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip]支持[other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "一场基于[diplomacy_i|E][diplomacy|E]和[opinion_i|E][opinion|E]的人气竞赛"
 gdp_merchant_trade_opportunity.1011.d: "“赞美你，以及你的仁政，伟大的[local_ruler.GetTitleAsNameNoTooltip]。”"
 gdp_merchant_trade_opportunity.1021.t: "共同的对手"
 gdp_merchant_trade_opportunity.1021.desc: "正为[target.GetPrimaryTitle.GetName]那帮无赖烦心时，[local_market.GetShortName]的[task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]中另一位竞争者，[other_merchant.GetPrimaryTitle.GetName]的[other_merchant.GetTitledFirstName]走上前来，让我措手不及。\n\n“幸会，[ROOT.Char.GetTitledFirstNameNoTooltip]”，[other_merchant.GetSheHe]招呼道，“我听闻了你与[target.GetHouse.GetNameNoTooltip]的奸商[target.GetTitledFirstName]之间的麻烦。或许我们可以互相帮助？”"
 gdp_merchant_trade_opportunity.1021.a: "“很好！计划是这样的……”"
 gdp_merchant_trade_opportunity.1021.b: "“我怎么知道你可信？”"
 gdp_merchant_trade_opportunity.1021.b.good: "你们达成了协议"
 gdp_merchant_trade_opportunity.1021.b.bad: "你们动起手来"
 gdp_merchant_trade_opportunity.1021.c: "“让我们联手，我们可以让他们非常难受。”"
 gdp_merchant_trade_opportunity.1021.d: "“休想！你们[other_merchant.GetHouse.GetNameNoTooltip]这号人更加恶劣！”"
 gdp_merchant_trade_opportunity.1031.t: "商业机密"
 gdp_merchant_trade_opportunity.1031.desc: "在[task_contract_location.GetBaronyNameExplicitlyNoTooltip]翻阅商会档案时，几张纸滑落，飘到地上。我弯腰捡起，转身发现我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]，[associate.GetFirstName]，正犹豫地皱着眉头。\n\n细览文件，我的眉头不禁扬起，[associate.GetHerHis]苦恼的原因显而易见。[associate.GetFirstNameNoTooltip]一直对我们隐瞒着此地业务至关重要的信息！而这一切全是出于怨恨？"
 gdp_merchant_trade_opportunity.1031.a: "“该死的[associate.GetFirstNameNoTooltip]！你的忠诚何在？”"
 gdp_merchant_trade_opportunity.1031.b: "“说吧，你有何不满？”"
 gdp_merchant_trade_opportunity.1031.c: "“#EMP 滚！#!你不再为本商会效力了！”"
 gdp_merchant_trade_opportunity.1041.t: "举家协力"
 gdp_merchant_trade_opportunity.1041.desc: "气氛高涨，商会里的话题总是绕回最近在[task_contract_location.GetBaronyNameExplicitlyNoTooltip]取得的成功，而巧合的是，这些成功都是由我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]，[associate.GetFirstName]牵头完成的。\n\n[associate.GetHerHis|U]被称赞为真正的商业天才，但当然，每一次商业冒险都依赖于[ROOT.Char.GetHouse.GetNameNoTooltip]网络中许多人的辛勤工作。"
 gdp_merchant_trade_opportunity.1041.a: "干得好，[associate.GetFirstNameNoTooltip]！"
 gdp_merchant_trade_opportunity.1041.b: "显然你还能干更多活。"
 gdp_merchant_trade_opportunity.1041.c: "你的努力令人惊叹，是我们所有人的榜样！"
 gdp_merchant_trade_opportunity.1051.t: "寻求和解"
 gdp_merchant_trade_opportunity.1051.desc: "走在[task_contract_location.Custom('GetRegionalMarketTermGloss')]上，我们的竞争对手，[target.GetPrimaryTitle.GetName]的[target.GetTitledFirstName]，突然出现在我面前，正是[target.GetHerselfHimself]本人！不过必须得说，[target.GetHerHis]的恭敬让我有些意外。\n\n“听着，[ROOT.Char.GetTitledFirstNameNoTooltip]，”[target.GetSheHe]叹了口气，“我就直说了。我们在这里的利益是冲突的，这不会有什么好结果。我请求你停下，"
 gdp_merchant_trade_opportunity.1051.desc.gold: "我会用金币酬谢你的辛劳。”"
 gdp_merchant_trade_opportunity.1051.desc.luxury: "作为回报，我会告诉你一个关于远方奇珍的线索。”"
 gdp_merchant_trade_opportunity.1051.a: "“你说得对。好吧，我接受。”"
 gdp_merchant_trade_opportunity.1051.b: "“也不是不行……我们来谈谈吧。”"
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip]勉强同意"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip]拒绝"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName]将为你举办一场[GetActivityType('activity_feast').GetName][activity|E]以表敬意"
 gdp_merchant_trade_opportunity.1052.t: "宴会无效"
 trade_opportunity_gain_luxury_contract_tt: "你将获得一份[luxury_contract|E]"
 gdp_merchant_trade_opportunity.1051.d: "“哈，生意肯定#EMP 相当#!差吧！没门。”"
 gdp_merchant_trade_opportunity.1061.t: "捉襟见肘"
 gdp_merchant_trade_opportunity.1061.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]，[associate.GetTitledFirstName]，一直在抱怨，说我们把精力都放在了完成[task_contract_location.GetBaronyNameExplicitlyNoTooltip]的生意上，[task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]的日常运转已经跟不上了。\n\n“必须得做出取舍了，[ROOT.Char.GetTitleAsNameNoTooltip]，一天就这么多时间，商会也没那么多人手，再这样下去，这边的事情根本顾不过来。”"
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]从不畏惧挑战！"
 gdp_merchant_trade_opportunity.1061.a.good: "一切按计划进行"
 gdp_merchant_trade_opportunity.1061.a.bad: "你劳累过度"
 gdp_merchant_trade_opportunity.1061.b: "有我在，利润绝不会下滑。"
 gdp_merchant_trade_opportunity.1061.already_tt: "已经获得：[associate.GetShortUIName]#N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#![stress|E]，[scheme|E]#P +1#![scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 gdp_merchant_trade_opportunity.1071.t: "瓶颈期"
 gdp_merchant_trade_opportunity.1071.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]，[associate.GetTitledFirstName]，来回走个不停，一只懒洋洋的苍蝇嗡嗡飞着，更让[associate.GetHerHis]心烦意乱。“啊！”[associate.GetSheHe]抱怨道，“你看看，[ROOT.Char.GetTitleAsNameNoTooltip]，你在[task_contract_location.GetBaronyNameExplicitlyNoTooltip]的工作把我的资源都快榨干了！”\n\n仔细看着那些票据和账本，很难反驳[associate.GetHerHim]。[associate.GetSheHe|U]叹了口气，“我们只能妥协了，不然这边的办事处迟早要撑不住了……”"
 gdp_merchant_trade_opportunity.1071.a: "我们致力于实现唯一的目标。"
 gdp_merchant_trade_opportunity.1071.d: "这件事交给我来处理，你专注于你自己的任务吧。"
 gdp_merchant_trade_opportunity.1081.t: "井井有条"
 gdp_merchant_trade_opportunity.1081.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]，[associate.GetTitledFirstName]，一直在处理我们在[task_contract_location.GetBaronyNameExplicitlyNoTooltip]的大部分生意细节，效果显而易见！[associate.GetFirstName]显然具备一个老练商人该有的细致和其他素质。\n\n自从我们在这里开工以来，我几乎不需要核对账目或跟进指令。"
 gdp_merchant_trade_opportunity.1081.a: "继续努力，[associate.GetFirstNameNoTooltip]！"
 gdp_merchant_trade_opportunity.1081.b: "这样的积极性值得嘉奖。"
 gdp_merchant_trade_opportunity.1081.c: "整个商会都应以此为榜样！"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip]以身作则"
 gdp_merchant_trade_opportunity.1081.c.trigger: "任何其他低于[stewardship_i|E][EmptyScope.ScriptValue('medium_skill_rating')|V0]的[associate|E]"
 gdp_merchant_trade_opportunity.1081.c.tt: "另一个[associate_possessive|E]的[stewardship|E]提高[stewardship_i|E]#P 1#!"
 gdp_merchant_trade_opportunity.1081.d: "[ROOT.Char.GetHouse.GetNameNoTooltip]的人自然是最好的。"
 gdp_merchant_trade_opportunity.1091.t: "笨拙的伙计"
 gdp_merchant_trade_opportunity.1091.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))]，[associate.GetTitledFirstName]，接手了我们在[task_contract_location.GetBaronyNameExplicitlyNoTooltip]的全部生意，不过现在倒是有些后悔让[associate.GetSheHe]来管了……\n\n每天都能发现哪笔账算得稀里糊涂，或者不得不听某个联络人抱怨说被晾在一边等消息。生意不能这么做！"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip]，我们来核对一下账目。"
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip]学到了一些东西"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip]无可救药了"
 gdp_merchant_trade_opportunity.1091.c: "商会将不得不填补这一缺口。"
 gdp_merchant_trade_opportunity.1091.d: "我想[associate.GetSheHe|U]已经尽力了。"
 gdp_merchant_trade_opportunity.1101.t: "资本投资"
 gdp_merchant_trade_opportunity.1101.desc: "对那些手头有富余[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]、又有耐心慢慢等待的人来说，放贷可以是一门生意。正好，有个热切的投资者希望在[task_contract_location.GetBaronyNameExplicitlyNoTooltip]与我见面。\n\n我见到了[investor.GetTitledFirstName]，"
 gdp_merchant_trade_opportunity.1101.ruler: "一位[investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]当地的统治者。"
 gdp_merchant_trade_opportunity.1101.courtier: "一位当地贵族的廷臣。"
 gdp_merchant_trade_opportunity.1101.adventurer: "一个见过世面的人，身后跟着一群随从。"
 gdp_merchant_trade_opportunity.1101.fallback: "一个毫无背景的[investor.GetWomanMan]。"
 gdp_merchant_trade_opportunity.1101.end: "“幸会，[ROOT.Char.GetTitledFirstNameNoTooltip]！”[investor.GetSheHe|U]热络地笑着说，“我愿意成为[ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip|l]的赞助人。至于我期望的回报？嗯，现在不急着讨论这个。”"
 gdp_merchant_trade_opportunity.1101.a: "你可以信赖我们，[investor.GetFirstNameNoTooltip]。"
 gdp_merchant_trade_opportunity.1101.c: "再多给一点会大有帮助，我以我的名誉担保。"
 gdp_merchant_trade_opportunity.1101.d: "过奖了，但我们眼下正在精简团队"
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName]将在#V 5#!年后来收取[gold_i|E][interest|0V]（#M 20%利息#!）"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "是时候收回我在贵商会的投资回报了。\n\n我耐心等着收到我的[investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]。"
 gdp_merchant_trade_opportunity.1102.a: "很好，希望这资金能帮到你。"
 gdp_merchant_trade_opportunity.1102.b: "呃——让我想想。[investor.GetFirstNameNoTooltip]，最近实在是淡季……"
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip]接受了你的辩解"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip]察觉到不对劲"
 gdp_merchant_trade_opportunity.1102.d: "你从未在我们这里有投资，这事到此为止。"
 gdp_merchant_trade_opportunity.9000.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]的紧迫业务"
 gdp_merchant_trade_opportunity.9000.desc: "那件事解决了，在[ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l]还有别的事需要我们留意。\n\n我们是不是先把[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]这边的事情都处理好，再动身回[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]？"
 gdp_merchant_trade_opportunity.9000.a: "这件事应该关注下。"
 gdp_merchant_trade_opportunity.9000.b: "来解决这件事。"
 gdp_merchant_trade_opportunity.9000.c: "我会处理这件事。"
 gdp_merchant_trade_opportunity.9000.d: "不，我们需要回到[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]。"
 gdp_merchant_trade_opportunity.9000.accept_tt: "你接受并开启[THIS.TaskContract.GetEmployer.GetUINamePossessive]的在[THIS.TaskContract.GetLocation.GetBaronyNameExplicitly][THIS.TaskContract.GetType.GetName|V]的[trade_opportunity_tier_tier|E][THIS.TaskContract.GetTaskContractTierValue|V][trade_opportunity|E]"
 gdp_merchant_trade_opportunity.9010.t: "商机：[task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "[task_contract_location.GetBaronyNameExplicitly]有重要商会事务等待处理，"
 gdp_merchant_trade_opportunity.9010.intro: "[task_contract_location.GetBaronyNameExplicitly]有重要商会事务等待处理，"
 gdp_merchant_trade_opportunity.9010.desc: "在我回来之前，我的任务必须交由伙计们处理。\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "我的[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l][partner.GetFirstName]可以被委派处理此事，而我去处理其他事务。"
 gdp_merchant_trade_opportunity.9010.partner_busy: "我的[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l][partner.GetFirstName]目前无暇处理。或许我应该亲自负责此事……"
 gdp_merchant_trade_opportunity.9010.candidate: "除非我找到别人来托付这件要事，否则我只能亲自处理了。"
 gdp_merchant_trade_opportunity.9010.no_partner: "既然没有人可以托付这件要事，我只能亲自处理。"
 gdp_merchant_trade_opportunity.9010.a: "没时间浪费了。"
 gdp_merchant_trade_opportunity.9010.c: "是的，[partner.GetFirstNameNoTooltip]能处理好。"
 gdp_merchant_trade_opportunity.9010.c.no_partner: "让我的合伙人来处理吧。"
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUIName]已参与[trade_opportunity|E]"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "你的合伙人正在处理另一项[trade_opportunity|E]"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "被分配负责你的[task_contract.GetType.GetName|V][trade_opportunity|E]"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon!#M 在[task_contract|E]完成之前将不可用#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon!#M 成功率取决于[THIS.Char.GetHerHis]的[aptitude|E]（[THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )]）#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon!#X 如果[THIS.Char.GetSheHe]不再是你的[GetCourtPositionType('partner_court_position').GetName]，合同会失败#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "[THIS.Char.GetShortUIName|U]被委托处理你在[task_contract_location.GetBaronyNameExplicitly]的[task_contract.GetType.GetName][trade_opportunity|E]"
 gdp_merchant_trade_opportunity.9010.d: "也许[candidate.GetFirstNameNoTooltip]能胜任这个任务。"
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "也许有人能胜任这个任务。"
 gdp_merchant_trade_opportunity.9010.d.tt: "你拥有[associates|E]：\n$EFFECT_LIST_BULLET$不是[traders|E]\n$EFFECT_LIST_BULLET$可以担任[GetCourtPositionType('partner_court_position').GetName]"
 gdp_merchant_trade_opportunity.9010.e: "忘了它吧，还有其他事物要忙。"
 gdp_merchant_trade_opportunity.9010.e.tt: "该[task_contract|E]将被取消"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "你立即开始[traveling|E]前往[task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.tt.start: "你立即开始[task_contract|E]"
 gdp_merchant_trade_opportunity.9020.t: "商机：[task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9020.intro: "我的[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l][partner.GetFirstName]终于从[task_contract_location.GetBaronyNameExplicitly]返回，同时带来了关于[partner.GetHerHis]进展的消息。\n\n"
 gdp_merchant_trade_opportunity.9020.success: "[partner.GetSheHe|U]高兴地解释说，尽管困难重重，[partner.GetSheHe]还是巧妙地解决了这件事，既为商会谋得了利益，也为自己赢得了名声……"
 gdp_merchant_trade_opportunity.9020.failure: "[partner.GetSheHe|U]有些勉强地解释了[partner.GetHerHis]的任务有多么艰难，尽管[partner.GetHerHis]付出了巨大努力，商会还是遭受了损失……"
 gdp_merchant_trade_opportunity.9020.a.success: "很好，[partner.GetFirstNameNoTooltip]。"
 gdp_merchant_trade_opportunity.9020.a.failure: "我本该亲自处理的……"
 gdp_merchant_trade_opportunity.9050.t: "错失良机"
 gdp_merchant_trade_opportunity.9050.desc_opening: "一个原本大有希望的前景已然破灭。\n\n我们此行的核心目标——前往[trade_destination.GetBaronyNameExplicitlyNoTooltip]的商机，已经从我们手中溜走。"
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\n现在唯一的问题在于，是否还有必要继续沿着这条不祥之路走下去。"
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "其依赖的贸易路线不再存在。"
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]不再位于[trade_opportunity_route.GetName]上"
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "[trade_opportunity_route.GetName]不再拥有该商机依赖的贸易负责人"
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "事实证明，[trade_opportunity_route.GetName]的动荡已经自行平息。"
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "既然我们已不再自称工匠，再以工匠身份行事就不合时宜了。"
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "既然我们已不再自称放贷人，再以放贷人身份行事就不合时宜了。"
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "据过往的贸易者所说，我们的竞争对手商会已销声匿迹。"
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "看来我们目的地的货栈已经不再对我们开放了。"
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "如今，我们已不再支付当初着手管理的通行费。"
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "世事无常，这样的情况在所难免：丝绸之路已非我们启程时的模样，我们借机操纵其走向的机遇也随之消逝。"
 gdp_merchant_trade_opportunity.9050.reason_unknown: "目前尚不清楚此时发生了什么变化。"
 gdp_merchant_trade_opportunity.9050.a: "这里没什么可做的了。"
 gdp_merchant_trade_opportunity.9050.b: "看看[trade_destination.GetBaronyNameExplicitlyNoTooltip]能提供什么。"
 gdp_merchant_trade_opportunity.9050.b.tt: "继续旅行，抵达时顺便#weak 造访[trade_destination.GetBaronyNameExplicitly]#!"
 gdp_merchant_trade_opportunity.9050.toast: "失去在[trade_destination.GetBaronyNameExplicitlyNoTooltip]的商机"
 gdp_merchant_trade_opportunity.9050.toast_route_destroyed: "通往[trade_destination.GetBaronyNameExplicitlyNoTooltip]的贸易路线已中断"
 gdp_merchant_trade_opportunity.9050.toast_desc_route_destroyed: "该[trade_opportunity|E]的[trade_route|E]不再存在"
 gdp_merchant_trade_opportunity.9050.toast_desc_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]不再是[trade_opportunity_route.GetName]的[market|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_trader_changed: "[trade_opportunity_route.GetName]已失去其[trader|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_upheaval_ended: "[trade_opportunity_route.GetName]不再经过陷入动乱的[market|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_artisan: "你的[company|E]不再拥有[GetLaw('company_purpose_artisan').GetName][company_purpose|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_creditor: "你的[company|E]不再拥有[GetLaw('company_purpose_creditor').GetName][company_purpose|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_competitor_gone: "你的竞争[merchant_family|E]不再领导[company|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_charter_gone: "你的竞争对手不再持有其[merchant_patron|E]的[charter|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_entrepot_gone: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]不再拥有[entrepot_district|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_tolls_ended: "你不再在[trade_destination.GetBaronyNameExplicitlyNoTooltip]支付[tolls|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_silk_road: "你不再是[silk_road|E]参与者"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_imprisoned: "你被[imprisoned|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_incapable: "你拥有[GetTrait('incapable').GetName( GetNullCharacter )]特质"
