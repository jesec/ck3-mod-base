l_simp_chinese:
 gdp_merchant.0001.t: "黄金铺就之路"
 gdp_merchant.0001.desc: "我以一个自由[ROOT.Char.GetWomanMan]的身份走进当地集市。每个街角都能听到商贩的叫卖声，混杂着附近作坊里金属敲打的声响。到处都是推车，运着[ROOT.Char.Custom('RegionalDrink')]的箱子、[ROOT.Char.Custom('RegionalFabric')]的布匹卷和[ROOT.Char.Custom('GetRandomRegionalBird')]的笼子，来回穿梭。\n\n这是我建立起宗族的地方。"
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "我的第一笔商业投资该是什么？"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "经过深思熟虑，我决定追求商人的生活。我正当年，出海旅行的愿望促使我采取行动。希望有一天我们能达成一笔对双方都有利的交易。[old_primary_title.GetBaseNameNoTierNoTooltip]就交到你手里了。"
 gdp_merchant.0002.a: "有趣的转折。"
 gdp_merchant.0010.t: "家庭事务"
 gdp_merchant.0010.desc: "今天的家族会议散场后，我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))][associate.GetTitledFirstName]一脸坚决地把我叫住了。\n\n“亲爱的[associate.Custom2('RelationToMe', ROOT.Char)]！"
 gdp_merchant.0010.desc.starting: "这家商会刚成立的时候我就在了，”"
 gdp_merchant.0010.desc.starting_fallback: "我在这家商会工作有段时间了，”"
 gdp_merchant.0010.desc.cont: "[associate.GetSheHe]斟酌着[associate.GetHerHis]措辞说着。"
 gdp_merchant.0010.desc.children: "“既然你的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))]还没成年，"
 gdp_merchant.0010.desc.no_children: "“既然你没有成年子女，"
 gdp_merchant.0010.desc.outro: "我希望能考虑收养我。能作为家族的一员代表家族，将是我的荣幸。”"
 gdp_merchant.0010.a: "“我一直将你视如己出。”"
 merchant_adoption_event_tt: "[associate.GetShortUIName]成为你的[house|E]成员"
 merchant_unity_adoption_loss: "将伙计收养入[house|E]"
 gdp_merchant.0010.b: "“你还没有证明自己的作用。”"
 gdp_merchant.0010.c: "“我以后再告诉你答案。”"
 gdp_merchant.0015.t: "商业面孔"
 gdp_merchant.0015.desc: "随着[trade_route.GetNameNoTooltip|l]的创建，我们的贸易方向已经确定。\n\n我还没决定谁能代表我们开展这项新事业。我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))][courtier_1.GetTitledFirstName]是个[courtier_1.Custom('quirk_pos_adjective')]的人，"
 gdp_merchant.0015.desc_good_intellect: "有着理智的头脑。[courtier_1.GetSheHe]的一些潜在才能或许能让我们大吃一惊。"
 gdp_merchant.0015.desc_excellent_intellect: "向来天资聪颖。[courtier_1.GetHerHim]肯定能让家族的姓氏引以为傲。"
 gdp_merchant.0015.desc_poor_intellect: "但不算太聪明。也许这次机会能促使[courtier_1.GetHerHim]提高[courtier_1.GetHerHis]自己的能力。"
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip]也许是能胜任这项任务的[courtier_1.GetWomanMan]……"
 gdp_merchant.0015.b: "……或许[courtier_2.GetFirstNameNoTooltip]更为合适。"
 gdp_merchant.0015.c: "我必须将人才留在身边。"
 gdp_merchant.0015.c.fallback: "不，这里所有人我都需要。"
 gdp_merchant.0015.c.tt: "你在没有指派[trader|E]的情况下启用了[trade_route|E]"
 gdp_merchant.0020.t: "商业伙伴"
 gdp_merchant.0020.desc: "家族生意的好坏，全依仗带着大家往新方向看的领头。"
 gdp_merchant.0020.desc.partner_exists: "我的合伙人[old_holder.GetFirstName]本该是承担这项任务的人，却一直在浪费我们的时间和金钱，做些毫无结果的事。"
 gdp_merchant.0020.desc.fallback: "目前我没有雇佣任何合伙人同我一起工作。"
 gdp_merchant.0020.desc.body: "商会内部的紧张气氛显而易见，每一个心怀野心的人都开始争吵不休、故作姿态。\n\n"
 gdp_merchant.0020.desc.outro_three: "其中就有[candidate_2.GetTitledFirstName]和[candidate_3.GetTitledFirstName]，两人都信誓旦旦地宣誓忠诚，只为能在桌上占有一席之地。\n\n他们会不择手段地挤到[candidate_1.GetTitledFirstName]前面去，尽管对方明显比他们强。"
 gdp_merchant.0020.desc.outro_two: "其中就有[candidate_2.GetTitledFirstName]，[candidate_2.GetHerHis]信誓旦旦地宣誓忠诚，只为能在桌上占有一席之地。\n\n[candidate_2.GetSheHe|U]会不择手段地挤到[candidate_1.GetTitledFirstName]前面去，尽管对方明显比[candidate_2.GetHerHis]强。"
 gdp_merchant.0020.desc.outro_one: "其中包括[candidate_1.GetTitledFirstName]，[candidate_1.GetHerHis]信誓旦旦地宣誓忠诚，只为能在桌上占有一席之地。\n\n[candidate_1.GetSheHe|U]会想尽一切办法，强行挤开任何挡在[candidate_1.GetHerHim]和这个职位之间的人。"
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip]值得一个机会。"
 gdp_merchant.0020.a.custom: "所有其他候选人"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip]应该获得这个机会。"
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip]显然最配得上。"
 gdp_merchant.0020.d: "这些人已经有任务要操心了……"
 gdp_merchant.0020.d.custom: "所有候选人"
 merchant_unity_partner_gain: "雇佣家族成员为合伙人"
 merchant_unity_partner_loss: "雇佣外人为合伙人"
 gdp_merchant.0025.t: "受尊敬的手工艺人"
 gdp_merchant.0025.desc: "“尊敬的[ROOT.Char.GetTitleAsNameNoTooltip][ROOT.Char.GetFirstNameNoTooltip]，”一个不熟悉的声音从附近的制革厂朝我喊道。我循声而去，小心不踩进制革染缸的污泥里。\n\n不知不觉间，我迎面撞上的是……一具兽尸？它的猎人朝我微笑，[traveler.GetSheHe]自豪地展示着[traveler.GetHerHis]的战利品。\n\n“[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]以能工巧匠闻名远近。那么您应当明白，您所出售的货物，其品质完全取决于手头的材料。作为一名猎人，我以替像您这样尊贵的买家采办最上等的货源为生。”"
 gdp_merchant.0025.a: "“你考虑过扩大贸易规模吗？”"
 gdp_merchant.0025.b: "“请继续……”"
 merchant_unity_artisan_recruit_loss: "招募了一个外来者"
 merchant_unity_artisan_recruit_decline_gain: "了解了奢侈品材料"
 gdp_merchant.0030.t: "不可小觑的力量"
 gdp_merchant.0030.desc: "“[ROOT.Char.GetTitleAsNameNoTooltip|U][ROOT.Char.GetFirstNameNoTooltip]，看这里！”我听到一个[traveler.GetWomanMan]喊道。\n\n我转过身，看见一名铁匠从[traveler.GetHerHis]的工作台朝我挥手。当我走近[traveler.GetHerHim]时，我不禁注意到[traveler.GetSheHe]如何扭动并屈伸[traveler.GetHerHis]身体，调整[traveler.GetHerHim]自己的角度，好让锻炉的火光恰好照亮[traveler.GetHerHis]肌肉……\n\n“我已等了很久才见到您。既然贵商会已赢得#EMP 令人瞩目#!的声誉，能够压倒竞争对手，我愿将自己的拳头献给您的宏图。我可以砸碎脑袋、挥舞刀剑，您需要什么都可以。”"
 gdp_merchant.0030.a: "“我喜欢你的热情。”"
 gdp_merchant.0030.b: "“#EMP 呃……#!多给我看看你的其他作品。”"
 merchant_unity_creditor_recruit_loss: "招募了一个外来者"
 merchant_unity_creditor_recruit_decline_gain: "解雇了谄媚的商会狂热分子"
 gdp_merchant.0035.t: "远播的声誉"
 gdp_merchant.0035.desc: "不寻常的喧哗声把我的注意力从面前的账簿上引开。\n\n走出[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]的办公室，我迎面遇到一个目光锐利的商人，[traveler.GetHerHis]衣服上沾着积了好几天的尘土。\n\n“幸会，[ROOT.Char.GetTitledFirstNameNoTooltip]，”[traveler.GetSheHe]说。“路上人人都知道你的名字，我遇到的所有人都告诉我，你就是那个值得一见的人。我希望你允许我今后打着你的名号行走商路。”"
 gdp_merchant.0035.a: "“哎呀，你看起来完全有能力！”"
 gdp_merchant.0035.b: "“我更愿意听听远方贸易的消息。”"
 merchant_unity_caravaneer_recruit_loss: "招募了一个外来者"
 merchant_unity_caravaneer_recruit_decline_gain: "了解了远方市场"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "[ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')]原本很悲观，但最终我们得到了[recipient.GetTitledFirstNamePossessive]对我们请求的同意，现在气氛一片欢腾。我们终于将拥有一座属于自己的城市，一个可以按我们意愿治理的共和国！\n\n我将成为[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]的首任[ROOT.Char.GetTitleAsNameNoTooltip]，"
 gdp_merchant.0101.liege: "管理[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]及其周边地区，臣属并在同等程度上依赖效忠于我们的[new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip]宗主。"
 gdp_merchant.0101.independent: "以人民的名义，与本地其他名门望族共同治理[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]及其周边地区。"
 gdp_merchant.0101.republic: "\n\n经过诸多交易与运作，伟大的[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家族终于能够建立起持久的遗产……"
 gdp_merchant.0101.a: "[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip]人民的新时代就此开始！"
 gdp_merchant.0102.desc: "得知您接受了我们的请求，我深感欣慰！\n\n黄金已经送出，我们开始为[actor.GetPrimaryTitle.GetName]起草一份章程，"
 gdp_merchant.0102.liege: "以您谦卑臣民的身份进行统治。"
 gdp_merchant.0102.top_liege: "在[new_liege.GetTitledFirstName]的管辖下治理它。"
 gdp_merchant.0102.independent: "并将作为独立的城市进行治理。"
 gdp_merchant.0103.desc: "真是荒谬的提议。你难道以为我的头衔是拿来卖的吗？而且还是卖给像#EMP 你#!这样的卑贱的[actor.GetWomanMan]？！"
 gdp_merchant.0110.t: "$merge_company_interaction$：[actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "经过长时间的商议，[recipient.GetTitledFirstName]无法掩饰[recipient.GetHerHis]对我提出的将我们两家商团和家族联合起来的慷慨提议的兴趣。\n\n[recipient.GetSheHe||U]点了点头，"
 gdp_merchant.0110.desc.personality.ai_honor: "“看来我在这件事上别无选择。不过，我仍会履行我们的约定，像忠于自己的事业一样尽职尽责地为你服务。”"
 gdp_merchant.0110.desc.personality.ai_zeal: "“我相信[recipient.GetFaith.WealthGodName]已为我们指明了这条道路。”"
 gdp_merchant.0110.desc.personality.ai_greed: "“我已仔细核对了你我的账目。面对这些数字，我别无选择，只能接受你的协议。”"
 gdp_merchant.0110.desc.personality.ai_compassion: "“我已与商会商议过，我们认为此次商会的合并将使我们双方共同受益。”"
 gdp_merchant.0110.desc.personality.ai_boldness: "“我接受你的提议。我们之间不必再遮遮掩掩了。”"
 gdp_merchant.0110.desc.personality.ai_rationality: "“我权衡了一下接受你的提议带来的收益与拒绝的代价。我同意。”"
 gdp_merchant.0110.desc.personality.ai_vengefulness: "“你让我别无选择。你这一手棋下得精妙，这一局是你赢了。”"
 gdp_merchant.0110.desc.personality.ai_energy: "“我接受。让你的书记员尽快起草一份合同并送交给我！”"
 gdp_merchant.0110.desc.personality.ai_sociability: "“[recipient.GetHouse.GetBaseNameNoTooltip]商会接受你的条件。我们会怀念以自己名义经商的日子，但固守骄傲并不明智。”"
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "“经过深思熟虑，我接受你的提议，将我们的利益合而为一。”"
 gdp_merchant.0110.desc.closing: "\n\n“按照约定，我已经撤销了我们的贸易路线，自今日起，[recipient.GetHouse.GetBaseNameNoTooltip]的名字将为你的商会效力。”"
 gdp_merchant.0110.a: "[recipient.GetHouse.GetBaseNameNoTooltip]的市场是我们的了！"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "你忘了自己的地位，也忘了[actor.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip]的分量。[recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip]绝不会屈服于你的蝇头小利。"
 gdp_merchant.0111.a: "事实证明这次失策了。"
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "有传言称，[indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]的领地急需财政援助。我或许能解决这一困境……当然，我需要一份人情作为回报。"
 gdp_purpose_events.0001.a: "那或许是我摆脱困境的办法……"
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName]会考虑你的提议。"
 gdp_purpose_events.0001.b: "好大的胆子！"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "我恳请你在此困难时刻给予经济援助。开出你的条件，只要你写下来，我不会拒绝。"
 gdp_purpose_events.0002.a: "拟订债券，连本带息。"
 gdp_purpose_events.0002.a.sin: "拟订债券，连有息贷一起。"
 gdp_purpose_events.0002.c: "拟订得没人能称之为有息贷。"
 gdp_purpose_events.0002.d: "送去黄金，不求回报。"
 gdp_purpose_events.0002.b: "我必须礼貌地拒绝……"
 gdp_purpose_events.0002_notification: "贷款成功"
 gdp_purpose_events.0002_fail_notification: "贷款被拒"
 fund_maa: "资助一支@stationed_regiment_icon![men_at_arms|E][regiment|E]"
 fund_mercenaries: "资助一份[mercenary_i|E][mercenary|E]合约"
 gdp_purpose_events.0003.desc: "众所周知，战争正让您的领地付出沉重代价。我的[ruler.GetTitleAsNameNoTooltip]，如果您将来能对我回报以善意，我愿意资助您的事业……"
 gdp_purpose_events.0003.a: "我需要一切能得到的帮助！"
 gdp_purpose_events.0003.b: "善意？我绝不会！"
 no_thanks.tt: "你错过了这个机会……"
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "给你写信让我感到不悦，但我的领地需要你在我们面临的这场战争中提供资助。如果你愿意帮助我，我准备好在未来对你回报以善意。"
 gdp_purpose_events.0004.a: "我能为你组建一个新的职业军团！"
 gdp_purpose_events.0004.b: "我可以打点几个我认识的人……"
 gdp_merchant.1002.t: "商会创立"
 gdp_merchant.1002.desc: "面前的桌子上放着一本空白的账本。从敞开的窗户，当地[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]的声音传进了[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l]的书房：讨价还价声、车轮的吱嘎声，还有牲畜在围栏里的叫声。\n\n这间书房很简朴，光线昏暗——如果我想跟[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]的商人们竞争，靠我一个人是撑不住的。也许我该雇几个人来帮商会？"
 gdp_merchant.1002.a: "我需要有商业头脑的人。"
 gdp_merchant.1002.a.tt: "你以两位擅长[stewardship|E]的[associates|E]起步"
 gdp_merchant.1002.b: "我们要震慑住竞争对手。"
 gdp_merchant.1002.b.tt: "你以两位擅长[martial|E]的[associates|E]起步"
 gdp_merchant.1002.c: "熟练的谈判者能达成有利的贸易协议。"
 gdp_merchant.1002.c.tt: "你以两位擅长[diplomacy|E]的[associates|E]起步"
 gdp_merchant.1002.d: "这里从不缺学者！"
 gdp_merchant.1002.d.tt: "你以两位擅长[learning|E]的[associates|E]起步"
 gdp_merchant.1002.e: "精明能给我们带来优势。"
 gdp_merchant.1002.e.tt: "你以两位擅长[intrigue|E]的[associates|E]起步"
 gdp_merchant.1002.f: "不，我不需要任何人。"
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon!#alert_trial 你会发现[task_contracts|E]很难或不可能完成，直到你获得[associates|E]#!"
 gdp_merchant.1002.f.tt.associates: "你出发时没有任何初始的[associates|E]——只有你已经拥有的[family|E]和[friends|E]"
 gdp_merchant.1003.t: "创立商会"
 gdp_merchant.1003.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]的[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]展现在我面前，人潮无穷无尽；每时每刻都有交易达成，[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]不断易手。\n\n贸易的喧闹无处不在：车轮吱呀作响，拥挤的围栏里牲畜嘶鸣，而在这一片嘈杂背后，我的商界同行们高声吆喝，只盼抢在竞争对手前头。\n\n各类商品在此转手——若要与众多商人一争高下，或许我该集中精力，专攻一处？"
 gdp_merchant.1003.a: "“确保大宗运输是关键。”"
 gdp_merchant.1003.b: "“我们必须利用[ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip]对我们的重视。”"
 gdp_merchant.1003.b.tt: "将创建一份[patron_contract|E]"
 gdp_merchant.1003.c: "“我们是商人。利润就是一切。”"
 gdp_merchant.1100.t: "拥挤的商会"
 gdp_merchant.1100.desc: "我的[ROOT.Char.Custom2('RelationToMe', plaintiff)][plaintiff.GetTitledFirstName]在我的书房里找到我，斟酌着[plaintiff.GetHerHis]的措辞。“[ROOT.Char.GetFirstNameNoTooltip]……这本该是家族生意，可我们却越来越依赖外人。”\n\n“为了维护我们的体面，[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]应当裁掉冗员。”"
 gdp_merchant.1100.a: "“不再需要[associate_2.GetFirstNameNoTooltip]了。”"
 gdp_merchant.1100.b: "“是时候与[associate_1.GetFirstNameNoTooltip]分道扬镳了。”"
 gdp_merchant.1100.c: "好，我们“裁掉冗员”……"
 gdp_merchant.1100.d: "“胡说，我们需要尽可能多的帮手。”"
 merchant_overcrowding_ignored_loss: "无视了商会人满为患的问题"
 merchant_overcrowding_fired_gain: "解雇了一名伙计以解决人满为患"
 merchant_overcrowding_yeet_gain: "解雇了多名伙计以解决人满为患"
 gdp_merchant.1200.t: "伙计的请求"
 gdp_merchant.1200.desc: "埋头于账本中度过了漫长的一天后，我发现我的[ROOT.Char.Custom2('RelationToMe', requester)][requester.GetTitledFirstName]在我门口徘徊，等着拦住我。“哦，[ROOT.Char.Custom2('RelationToMeAddress', requester)]！我一直想问问……”\n\n"
 gdp_merchant.1200.desc.artifact: "“在你的领导下，商会经营得如此出色，账上流转着这么多珍贵物品。不知你能不能……让我留一件？”"
 gdp_merchant.1200.desc.activity: "“商会上下辛勤劳作，你也领导有方，但难道不是时候举办一场难忘的庆典来庆祝我们的成就了吗？”"
 gdp_merchant.1200.desc.luxury_contract: "“在你的指挥下，商会的商路运转良好，但外面的世界一定有无数奇观等待被发现……”"
 gdp_merchant.1200.a: "“很好，我会看看我能做些什么。”"
 gdp_merchant.1200.b: "“行了，我还有更重要的事要做。”"
