 gdp_merchant.3000.t: "译员的提示"
 gdp_merchant.3000.desc: "我的译员[translator.GetTitledFirstName]已经闭门不出了一段时间，显然是在钻研某种外文文本，如今[translator.GetSheHe]终于出现了。\n\n“[ROOT.Char.GetTitleAsNameNoTooltip]，”[translator.GetSheHe]满面笑容地说，“我一直在看从[market.GetName|l]获得的报告，那种速记式的[saved_culture.GetLanguage.GetName]很难懂，但这里有很多关于当地货物流动的内容！”"
 gdp_merchant.3000.a: "“我想要每一丁点，[translator.GetFirstNameNoTooltip]！”"
 gdp_merchant.3000.a.tt: "[company|E]获得[market.GetName]所有正在贸易的[trade_categories_short|E]的[trade_expertise|E]"
 gdp_merchant.3000.b: "“你能教我这门语言吗？”"
 gdp_merchant.3000.b.tt: "你的[scheme|E]获得[GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]"
 gdp_merchant.3000.c: "“把发现卖给出价最高的人。”"
 gdp_merchant.3000.d: "“专注于你的语言技能。”"
 gdp_merchant_translator_buff_modifier: "翻译导师"
 gdp_merchant.3010.t: "掮客的发现"
 gdp_merchant.3010.desc: "我的事务员[fixer.GetTitledFirstName]在[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]一带执拗地暗中活动了一段时间后，终于凭一张含糊其辞的短笺安排了会面，说[fixer.GetHerHis]找到了#EMP 货物#!。\n\n[fixer.GetSheHe|U]神秘兮兮地落座，"
 gdp_merchant.3010.desc.secret: "随后绽开笑容。“费了些功夫，但我这里有一份证据，证明[secret_haver.GetName]几乎肯定是个[secret.GetName]！”"
 gdp_merchant.3010.desc.scheme: "[fixer.GetHerHis]神色忧虑。“我有坏消息，[ROOT.Char.GetTitleAsNameNoTooltip]。我发现[scheme_owner.GetName]一直在密谋对付你——对付商会！”"
 gdp_merchant.3010.a: "“很有用，多搞些来！”"
 gdp_merchant.3010.b: "“你挺会偷偷摸摸的嘛，[fixer.GetFirstNameNoTooltip]？”"
 gdp_merchant.3010.c: "“我不处理来路不正的流言。”"
 gdp_merchant.3010.d: "“这可以用在我的工作中……”"
 gdp_merchant.3020.t: "执法官的虚张声势"
 gdp_merchant.3020.desc: "我的催债人[bailiff.GetTitledFirstName]，一直在翻看债务人名册，反复盘算着可以施加何种压力，以确保我们的[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]尽快收回。\n\n"
 gdp_merchant.3020.pressure: "“[pressure_debtor_1.GetTitledFirstName]没钱，但至少可以做个善意姿态，先偿付一部分债务……”[bailiff.GetFirstNameNoTooltip]低声吼道。\n\n"
 gdp_merchant.3020.demand: "[bailiff.GetSheHe|U]叹了口气，“我得到可靠消息，[demand_debtor_1.GetTitledFirstName]付得起……[demand_debtor_1.GetSheHe]只是自认为高我们一等！”\n\n"
 gdp_merchant.3020.third: "“还有[portrait_3.GetTitledFirstName]……”[bailiff.GetSheHe]嘀咕着。"
 gdp_merchant.3020.a: "“是的，[pressure_debtor_1.GetFirstNameNoTooltip]肯定付得起一个#EMP 小小#!的帮忙？”"
 gdp_merchant.3020.a.tt: "欠你的金钱会减少[gold_i]#V ‑[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#!"
 gdp_merchant.3020.b: "“给[demand_debtor_1.GetTitledFirstNameNoTooltip]施加压力……”"
 gdp_merchant.3020.c: "“[pressure_debtor_2.GetFirstNameNoTooltip]付得起一小笔还款。”"
 gdp_merchant.3020.d: "“[demand_debtor_2.GetFirstNameNoTooltip]显然在瞒着我们！”"
 gdp_merchant.3020.e: "“提醒[pressure_debtor_3.GetFirstNameNoTooltip][pressure_debtor_3.GetHerHis]的义务。”"
 gdp_merchant.3020.f: "“是时候给[demand_debtor_3.GetFirstNameNoTooltip]一个明确的信号了。”"
 gdp_merchant.3020.g: "“我宁愿让他们欠着我。”"
 ho_loan_demand_refused_title: "贷款要求被拒绝"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName]仍欠你[gold_i][outstanding|V0]"
 ho_loan_reduced_title: "贷款减少"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName]现在欠你[gold_i][outstanding|V0]"
 gdp_merchant.3031.t: "代理人的热情"
 gdp_merchant.3031.desc: "我的市场代理人[market_agent.GetTitledFirstName]，近来一直熬到凌晨，在[market_agent.GetHerHim]身旁蜡烛越烧越短时仍埋头研读账簿。[market_agent.GetSheHe|U]今早走进我的书房时，睡眼惺忪地眨着眼。\n\n“[ROOT.Char.GetTitledFirstName]！我一直在查看我们在[market.GetName|l]的账簿，有一个明显的前景，我们会——”#weak *哈欠*#!“我们若不加以利用，那就太傻了！”"
 gdp_merchant.3031.a: "“干得漂亮，[market_agent.GetFirstNameNoTooltip]，现在去睡会吧！”"
 gdp_merchant.3031.a.tt: "一个[trade_opportunity.GetType.GetName|V][trade_opportunity|E]出现在[market.GetName|l]"
 gdp_merchant.3031.b: "“别管那个，专注于我们当前的事务！”"
 gdp_merchant.3040.t: "保管员的关怀"
 gdp_merchant.3040.desc: "我的保管员[antiquarian.GetTitledFirstName]一直精心照看着[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]的收藏，确保它们安全无损、保存完好，并偶尔向访客提供一些有趣的轶事。\n\n一天早晨，我驻足欣赏[artifact.GetName]时，[antiquarian.GetSheHe]适时出现，“啊，[ROOT.Char.GetTitleAsNameNoTooltip]，这是一件极为特别的藏品。不过，我有时会想，它是否配得上收藏中的其余藏品呢？”"
 gdp_merchant.3040.b: "“是时候该把它脱手了，找个买家。”"
 gdp_merchant.3040.c: "“也许它需要一些翻新。”"
 gdp_merchant.3040.c.tt: "[artifact.GetName]已经处于完好状态"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName]是#V 异兽#!"
 gdp_merchant.3040.d: "“胡说，这藏品完美无缺。”"
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "一个普通的城里人很难相信，一小块布可能跨越灼热的沙漠和汹涌的大海，最终出现在市场的摊位上。\n\n商人、牲畜和船只的这些艰辛，正是[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]的日常。即便是那些完全不通[ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]的遥远城镇，也依赖着我们的货物。"
 gdp_merchant.8000.a: "商会当之无愧的声誉！"
 gdp_merchant.8000.b: "但我不能忘记我的根基。"
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "比成捆成匹的以物易物之货、比地下的宝石和金属更珍贵的，是凭人的才能用它们打造出的奇物。\n\n巧妙的机械、令人叹为观止的装饰和精美的工艺，是[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]的命脉，我们的名号就是品质与信誉的象征。"
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "即便是最伟大的国王，一旦财源断绝，也会变得像乞丐一样无能为力，但信贷网络如同蛛网般围绕着他。\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive]的名号响彻各地宫廷，人们信赖我们居中斡旋和交易，我们总愿在危难时伸出援手，但也绝不会被轻易占便宜。"
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "游记"
 gdp_merchant.8010.desc: "很少有人见过如此之多，更无人拥有我这般独特的全部经历。从穷人到权贵，这世上的远方国度在他们眼中至多是一片朦胧，他们渴望见闻与消遣来照亮黑暗。\n\n当我坐下，回味我在[poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier]旅行中的精彩见闻时，我思忖着陌生人和我的后代最想听我讲述什么。"
 gdp_merchant.8010.a: "我将着重描述异族风俗和礼仪。"
 gdp_merchant.8010.a.tt: "这本书的质量将在很大程度上取决于你的[GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|V]#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!和[GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|V]#weak （[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]）#![trait_level_track_xp|E]"
 gdp_merchant.8010.b: "读者想要的是交易技巧和市场洞见。"
 gdp_merchant.8010.c: "我的作品将描绘异域城市和奇观。"
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "这比我预想的耗时更长，但最终我对自己写下的文字还算满意。我详细记述了前往[poi.GetName]的旅程，点缀以旅途中的轶事，着重描绘了异域的[author.Custom('GetTravelogueTopic')]。\n\n"
 gdp_merchant.8011.weak: "翻阅时，我发现自己颇为失望，想着或许本可以更用心一些，但——唉，是时候放下鹅毛笔了。"
 gdp_merchant.8011.mid: "翻阅时，我为自己作品的广度感到自豪，但总觉得还缺少某种特别的火花。"
 gdp_merchant.8011.great: "翻阅时，我发现自己被自己的文字逗笑，又被某些段落激动得仿佛重新经历了一遍。这本书值得铭记！"
 gdp_merchant.8011.a: "我暂时自己留着。"
 gdp_merchant.8011.b: "它应当放进商会藏书室。"
 travelogue_description_full: "这是一本由商人[author.GetTitledFirstName]撰写的关于[author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier]之地的奇幻游记。书中分享了[author.GetHerHis]对外国[author.Custom('GetTravelogueTopic')]的见闻与洞见。\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "[author.GetFirstNameNoTooltip]·[author.GetHouse.GetNameNoTooltip]游记"
 travelogue_name_2: "通往[poi.GetCounty.GetName]之路"
 travelogue_name_3: "[author.GetFirstNameNoTooltip][author.GetHouse.GetNameNoTooltip]：旅者"
 travelogue_name_4: "致[poi.GetCounty.GetName]"
 travelogue_name_5: "[author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]冒险记"
 travelogue_name_6: "[author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip]游记"
 travelogue_name_7: "远方国度"
 travelogue_name_8: "去而复返"
 travelogue_name_9: "论[poi.GetCulture.GetCollectiveNounNoTooltip]"
 travelogue_name_10: "[poi.GetNameNoTierNoTooltip]，神秘的[poi.GetTitle.Custom('BaronyTownType')|U]"
 travelogue_name_11: "千奇录"
 travelogue_name_12: "游记"
 travelogue_name_13: "旅程"
 travelogue_name_14: "[author.GetFirstNamePossessiveNoTooltip]历险记"
 travelogue_topic_customs: "风俗"
 travelogue_topic_markets: "市场"
 travelogue_topic_places: "地方"
 travelogue_description_quality_weak: "这本书文笔拙劣，且明显荒诞不经。"
 travelogue_description_quality_mid: "书中有几段颇有见地的文字。"
 travelogue_description_quality_great: "这本书引人入胜，文笔生动而卓越。"
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$：好奇的访客"
 gdp_merchant.8021.suzerain: "当我的赞助人[visitor.GetTitledFirstName]到访时，我深感荣幸，"
 gdp_merchant.8021.merchant: "[visitor.GetTitledFirstName]，同为商人及[visitor.GetPrimaryTitle.GetDefinitiveName]的所有者，"
 gdp_merchant.8021.laamp: "[visitor.GetTitledFirstName]，一支自称[visitor.GetPrimaryTitle.GetDefinitiveName]的旅行商队的首领，"
 gdp_merchant.8021.ruler: "当[visitor.GetTitledFirstName]，一位本地统治者到访时，我又惊又喜，"
 gdp_merchant.8021.fallback: "[visitor.GetTitledFirstName]，一位谦逊的旅人，"
 gdp_merchant.8021.desc: "到访我的住所。\n\n[visitor.GetSheHe|U]被领去参观我们的收藏时笑容满面，环顾四周，[visitor.GetHerHim]显得有些惊叹。\n\n“幸会，[ROOT.Char.GetTitledFirstNameNoTooltip]！我听闻过贵商会的功绩，还有你的异域收藏……能否麻烦你给我讲——”，[visitor.GetSheHe]突然倒吸一口气，[visitor.GetSheHe]被那件[artifact.GetName]吸引住了。\n\n“哦！你这里有什么……？”"
 gdp_merchant.8021.curio: "[visitor.GetSheHe|U]从各个角度端详着它，非要听完它的完整来历[visitor.GetSheHe]才肯罢休。"
 gdp_merchant.8021.library: "[visitor.GetSheHe|U]一边小心翼翼地翻动书页，一边提出无数问题。"
 gdp_merchant.8021.creature: "[visitor.GetSheHe|U]惊叹于它的优雅，还兴高采烈地观看它进食。"
 gdp_merchant.8021.a: "是啊，它确实是个好东西。"
 gdp_merchant.8021.b: "你想拥有它吗？"
 gdp_merchant.9021.opening: "敬启，[merchant.GetTitledFirstNameNoTooltip]，"
 gdp_merchant.9021.diarch.desc: "作为[commissioner.GetName]的[commissioner.GetDiarchTitle]，我寻求委托[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]提供服务。"
 gdp_merchant.9021.no_diarch.desc: "我寻求委托[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]提供服务。"
 gdp_merchant.9021.desc: "\n\n[trade_market.GetName|l]缺乏[target.GetName]。若你能将货物运入该地区，你将获得公平的报酬。"
 gdp_merchant.9021.a: "你的委托已被接受。"
 gdp_merchant.9021.b: "我必须礼貌地拒绝。"
 gdp_merchant.9021.b.cooldown_tt: "你在#V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#!年内不会获得另一份[commission|E]请求"
 gdp_merchant.9005.t: "被逐出"
 gdp_merchant.9005.desc_intro: "我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))][courtier.GetTitledFirstName]闯进[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]的办公室，[courtier.GetHerHis]脸上泛着红晕。\n\n“我带来了我们庇护人[expeller.GetTitledFirstName]的口信，”[courtier.GetSheHe]说，“我们的商会要结清账目，立刻离开[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]！”\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U]已下令将[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]逐出[expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip]。\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "[expeller.GetTitledFirstNamePossessiveNoTooltip]对我们的信任已经消耗殆尽。"
 gdp_merchant.9005.desc_body.enemies: "[expeller.GetTitledFirstNamePossessiveNoTooltip]的敌意就没有个限度吗？"
 gdp_merchant.9005.desc_body.fallback: "我们在这里做了这么多……"
 gdp_merchant.9005.a: "终究还是到了这一步。"
 gdp_merchant.9005.a.tt: "你的[company|E]将离开[expeller.GetShortUINamePossessive]的[realm|E]"
 gdp_merchant.9100.t: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]贵人家族"
 gdp_merchant.9100.desc: "我们已充分向[new_patrician_liege.GetPrimaryTitle.GetNameNoTier]那些傲慢的家族证明了我们自己，并为[new_patrician_liege.GetTitledFirstName]提供了恰当的#emp 激励#!，我为我们晋升而提出的请求稳操胜券。\n\n我终于拿到了这些文件，它们无可置疑地证明：[ROOT.Char.GetHouse.GetBaseName]绝非仅仅是一个商人世家，而是跻身于这个[new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]议会中其他受人尊敬的贵人世家之列，在法律上甚至与[new_patrician_liege.GetHouse.GetBaseName]平起平坐！"
 gdp_merchant.9100.a: "我热切期待我在议会的首场会议。"
 merchant_patrician_transition_domicile_tt: "你的[domicile_buildings|E]已被保留"
 gdp_merchant.9110.t: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]的商行"
 gdp_merchant.9110.desc: "随着旧共和国的覆灭，[ROOT.Char.GetHouse.GetBaseName]以及[new_merchant_location.GetBaronyNameExplicitly]其他骄傲的贵族世家，已沦为单纯的商人家族，听凭命运和当地统治者[ROOT.Char.GetSuzerain.GetTitledFirstName]的摆布。\n\n失去了我们的议会和共和国的庇护，若要维持昔日地位的些许体面，我们只能寄望于[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier]的法律。"
 gdp_merchant.9110.a: "事情怎么到了这一步……"
 broke_deal_opinion: "违背约定"
 gdp_repudiated_my_loan_opinion: "否认了我的贷款"
 gdp_interest_free_loan_opinion: "无息借出"
 gdp_usurious_loan_opinion: "对我放债取利"
 gdp_merchant_unity_intermarriage_desc: "嫁娶了另一个[merchant|E][house|E]的成员"
 gdp_merchant_unity_noble_marriage_desc: "嫁娶了贵族[house|E]的成员"
 gdp_merchant.2000.t: "空荡的市场：[needed_good.GetNameNoTooltip]"
 gdp_merchant.2000.desc.intro: "当我走在"
 gdp_merchant.2000.desc.disaster: "饱受灾难的"
 gdp_merchant.2000.desc.war: "战火蹂躏的"
 gdp_merchant.2000.desc.plague: "瘟疫肆虐的"
 gdp_merchant.2000.desc.unrest: "动荡不安的"
 gdp_merchant.2000.desc.stalls: "[starving_province.GetNameNoTooltip]的街道上时，我注意到通常拥挤的[starving_province.Custom('GetRegionalMarketTermGloss')]已陷入沉寂。\n\n食品摊几乎空空如也，只剩下几块不新鲜的[ROOT.Char.Custom('GetLocalStreetFoodPlural')]和腐烂的[ROOT.Char.Custom('RegionalRootVegetablePlural')]。瘦骨嶙峋的男男女女在街道两旁翻捡着成堆的垃圾。"
 gdp_merchant.2000.a: "我应该紧紧守住剩下的东西。"
 gdp_merchant.2000.b: "人们会寻找替罪羊。"
 gdp_merchant.2000.c: "这不关我的事。"
 gdp_merchant.2010.t: "[craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip]垄断："
 gdp_merchant.2010.t.smith: "铁匠"
 gdp_merchant.2010.t.goldsmith: "金匠"
 gdp_merchant.2010.t.carpenter: "木匠"
 gdp_merchant.2010.t.tanner: "制革匠"
 gdp_merchant.2010.t.potter: "陶匠"
 gdp_merchant.2010.desc.intro: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))][associate.GetFirstName]一直不停地谈论[workshop_province.GetName]的工匠大师[craftsman.GetWomanMan][craftsman.GetFirstName]。如今，当我站在[craftsman.GetHerHis]的作品前，我明白了这一切惊叹的缘由。\n\n[craftsman.GetFirstNameNoTooltip]没有从[craftsman.GetHerHis]的活计上抬起目光，[craftsman.GetHerHis]只是欢迎道：“请随意看看我的货品。”\n\n我惊叹于"
 gdp_merchant.2010.desc.weapon: "一件华美的武器。"
 gdp_merchant.2010.desc.chalice: "一只精雕细琢的圣血杯。"
 gdp_merchant.2010.desc.box: "一个雕刻精巧的木盒。"
 gdp_merchant.2010.desc.saddle: "一副完美雕制的马鞍。"
 gdp_merchant.2010.desc.vase: "一个彩绘精美的陶瓷花瓶。"
 gdp_merchant.2010.desc.craftsmanship: "这绝非普通的手艺。"
 gdp_merchant.2010.a: "这样的才能不应被浪费。"
 gdp_merchant.2010.b: "也许你能教[associate.GetFirstNameNoTooltip]一两手。"
 gdp_merchant.2010.c: "我想留下来观摩你的手艺。"
 gdp_merchant.2015.t: "[counsel_good.GetNameNoTooltip]的价格"
 gdp_merchant.2015.desc: "我收到了我的赞助人[patron.GetTitledFirstName]出人意料的召见。鉴于[patron.GetHerHis][patron.Custom('quirk_neg_adjective')]的天性，我惴惴不安地走进王座厅。\n\n“[ROOT.Char.Custom('MistressMaster')|U][ROOT.Char.GetFirstNameNoTooltip]，请容我请教。你能告诉我[counsel_good.GetNameNoTooltip]的品质和市场价值吗？”"
 gdp_merchant.2015.a: "“我碰巧对这个领域相当在行。”"
 gdp_merchant.2015.a.tt: "你必须在[counsel_category.GetName][trade_category_short|E]达到至少#V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#![expertise_level|E]"
 gdp_merchant.2015.b: "“我大概懂一点点……”"
 gdp_merchant.2015.a.monopoly.tt: "[monopoly_i][trade_monopoly|E]接受度：[monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip]视你为权威"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip]看穿了你的谎言"
 gdp_merchant.2015.b.monopoly.tt: "[monopoly_i][trade_monopoly|E]接受度：[monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "“我生命中渴望的不只是贸易。”"
 gdp_merchant.2020.t: "一席之地"
 gdp_merchant.2020.desc: "我有幸在我的庇护者[patron.GetTitledFirstName]位于[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]的[patron.GetCapitalLocation.GetHolding.GetType.GetName|l]中用餐。当我走向自己的座位时，[courtier_1.GetTitledFirstName]，一位[courtier_1.Custom('NoblewomanNobleman')]，用灼热的目光盯着我。[courtier_1.GetHerHis|U]对其他宾客的低语几乎听不见，但我能辨认出“乌合之众”和“从平民小贩那里收受贿赂”这些字眼。当[patron.GetFirstNameNoTooltip]起身发言时，那些声音便沉寂下来：\n\n“信任的伙伴、新结识的朋友、久别重逢的兄弟，今夜我召集你们到此，共享我的款待。让我们开宴吧！”"
 gdp_merchant.2020.a: "“好极了，我们以后得常来！”"
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName]将尽快举办一场[GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName] #weak （1-3个月内）#!"
 gdp_merchant.2020.b: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家族将获得我们应得的认可。"
 gdp_merchant.2020.b.unity_gain.desc: "我们家族的名号在贵族中占据了一席之地"
 gdp_merchant.2020.c: "“很好！现在让我们谈正事！”"
 gdp_merchant.2020.c.unity_loss.desc: "专注于真正重要的事：生意"
 gdp_merchant.2025.t: "小商人"
 gdp_merchant.2025.desc: "[charter_rival.GetTitledFirstName]一如既往，在需要尽责时不见人影。我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))][patron.GetTitledFirstName]和我耐心等待[charter_rival.GetHerHis]到来，直到我们决定不等[charter_rival.GetHerHim]，先审阅本月的账簿。\n\n未经核实的贸易协议仍散落在桌上，这时[patron.GetFirstNameNoTooltip]将羊皮纸扫到一旁，把[patron.GetHerHis]的注意力转向我：\n\n“[ROOT.Char.GetFirstNameNoTooltip]，只在我们两人之间说，你对[charter_rival.GetFirstNameNoTooltip]怎么看？说#EMP 真心话#!。我授予[charter_rival.GetHerHim]我的特许状，是做了正确的选择吗？”"
 gdp_merchant.2025.a: "“也许在我手里会更有用？”"
 gdp_merchant.2025.a.charter.tt: "[charter_i][request_merchant_charter|E]接受度：[charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "“我相信你的卓越判断，[patron.Custom('FormOfAddressForLiege')]。”"
 gdp_merchant.2025.b.unity_gain.desc: "向庇护者表明我们相信他们的判断"
 gdp_merchant.4000.t: "我道不行"
 gdp_merchant.4000.desc.intro: "我走进[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]市场，却发现我的摊贩们被挤到一条偏僻的小巷里，他们的货桌陷在附近猪圈的泥污之中。\n\n"
 gdp_merchant.4000.desc.patron: "我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))]"
 gdp_merchant.4000.desc.patron_representative: "[patron.GetTitledFirstNamePossessive]的[patron.Custom2('RelationToMe', SCOPE.sC('market_character'))][market_character.GetName]"
 gdp_merchant.4000.desc.body: "站在上风处很远的地方，而[market_character.GetSheHe]望着我的同伴们向我倾泻抱怨。\n\n当我走近时，[market_character.GetFirstNameNoTooltip]说道，"
 gdp_merchant.4000.desc.body.patron: "“一个适合[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l]生意的地方，不是吗？”[market_character.GetSheHe|U]朝那些猪比划了一下。"
 gdp_merchant.4000.desc.body.patron_representative: "“我代表你的庇护者前来。”从[market_character.GetHerHis]扬起的下巴和眼中的神采判断，[market_character.GetSheHe]在传达这个消息时相当得意。"
 gdp_merchant.4000.desc.outro: "“你不遵守我们的习俗，也从不听从[Glossary( '孔子', 'CONFUCIUS_GLOSS' )]的教诲。在你做到之前，这里就是你的位置。”"
 gdp_merchant.4000.b: "我应该学习“道”。"
 gdp_merchant.4000.b.tt: "如果你的下一次[GetActivityType('activity_adult_education').GetName]在[GetTrait('confucian_education').GetName(GetNullCharacter)]中心举办，其花费减少#P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#![gold|E]"
 gdp_merchant.4000.c: "我会让他们见识见识……"
 gdp_merchant.4010.t: "学问之门"
 gdp_merchant.4010.desc: "漫长的集市日结束后，我坐下享用着茶。不时有当地学者投来好奇的目光。\n\n“[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]这帮人傲慢得很，”我听见[student.GetHerHim]对[student.GetHerHis]的朋友低声嘟囔。“他们自以为比我们这些恪守礼仪的人高人一等。我们勤勤恳恳地考试，可[ROOT.Char.GetFirstNameNoTooltip]除了剥削他人，还取得过什么成就？”"
 gdp_merchant.4010.a: "这考试并不太难。"
 gdp_merchant.4010.b: "“你喝的茶又来自谁？”"
 gdp_merchant.4010.c: "“这地方又能丢得起谁的生意？”"
 gdp_merchant.4020.t: "丝绸之路"
 gdp_merchant.4020.desc: "我进入[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]，被人畜混杂的人潮裹挟，涌过[ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')]城门，汇入城中络绎不绝的商队行列。这里的单峰驼驮着丰盛的货物，高得如同大象，又因背上沉重的负载而左右摇晃。\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "每个街角都有商人在卸下多到令人难以置信的货物。\n\n我看到有些摊位把食物丢弃在一旁，因为产量实在太大，根本不可能在腐坏之前全部卖完。"
 gdp_merchant.4020.desc.steady_trading: "我从未在一个地方见过如此丰饶的景象。这里的人如此之多，我们汇成一片喧嚷的洪流，凝聚成一个整体。\n\n每当一支商队停滞不前，总会有主人急于挥鞭催促。"
 gdp_merchant.4020.desc.hardship: "从那些用异国语言进行的零散交谈中，我所能拼凑出的是：这个市场眼下正举步维艰。\n\n若是在更繁荣的时期，这地方会是什么光景——货物的数量必定多到无法估量……"
 gdp_merchant.4020.a: "这是通往未来的道路。"
 gdp_merchant.4030.t: "远方的财富"
 gdp_merchant.4030.desc.intro: "我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))][associate.GetFirstName]走进[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]的办公室，眼睛闪着光，那种神情我只见过其欣赏一堆黄金时才有的。\n\n[associate.GetSheHe|U]递给我一个盒子，我打开它，发现是"
 gdp_merchant.4030.desc.silk: "我见过的最好的丝绸，薄如蝉翼，轻若无物。\n\n"
 gdp_merchant.4030.desc.spice: "一种芬芳的粉末，刚磨好的。\n\n“他们叫它[rumoured_market_owner.Custom('RegionalSpice')]，”[associate.GetSheHe]说。"
 gdp_merchant.4030.desc.jade: "一块玉石，抛光到表面像玻璃一样光滑。\n\n"
 gdp_merchant.4030.desc.ivory: "一块象牙，雕刻成微型城堡的样子。\n\n"
 gdp_merchant.4030.desc.outro: "“我从一个商人那里买下了这个，他跟我吹嘘自己在丝绸之路上和[rumoured_market_owner.GetCulture.GetNameNoTooltip|l]人的人脉。我们在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]这里赚到的黄金，与他们在[rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]收获的[rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')]的相比，根本算不了什么。”"
 gdp_merchant.4030.a: "“你说丝绸之路？”"
 gdp_merchant_4030_a_tt: "如果你在接下来的#V 5#!年内将[company|E]迁至[rumoured_market.GetName]，你将在该[market|E]获得[GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]，持续#V 10年#!"
 gdp_merchant.4030.b: "“谢谢你，真是体贴的礼物。”"
 gdp_merchant.4030.c: "“我们在这里有重要的生意，[associate.GetFirstNameNoTooltip]。”"
 merchant_unity_local_business: "优先考虑附近的生意而非[silk_road|E]"
 gdp_merchant.4030.artifact.silk: "[rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]丝绸"
 gdp_merchant.4030.artifact.silk.desc: "从丝绸之路市场带来的薄如耳语的丝绸，轻得不可思议，触感光滑。"
 gdp_merchant.4030.artifact.spice: "一袋香料"
 gdp_merchant.4030.artifact.spice.desc: "一袋从丝绸之路市场带来的芬芳香料。"
 gdp_merchant.4030.artifact.jade: "抛光玉石"
 gdp_merchant.4030.artifact.jade.desc: "来自丝绸之路市场的玉石，抛光到表面像玻璃一样光滑。"
 gdp_merchant.4030.artifact.ivory: "象牙城堡"
 gdp_merchant.4030.artifact.ivory.desc: "来自丝绸之路市场的象牙，精心雕刻成微型城堡的样子。"
 gdp_merchant.5000.t: "暴露的利息"
 gdp_merchant.5000.desc.debtor: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]官署的门突然打开，我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))][accuser.GetFirstName]走了进来，两侧是我自己的伙计。"
 gdp_merchant.5000.desc.debtor_paranoid: "门发出一声吱呀的轻响，这是我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))][accuser.GetFirstName]接近的唯一声音，[accuser.GetSheHe]轻轻走进[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]官署。"
 gdp_merchant.5000.desc.bishop: "一群戴着兜帽的人堵在了[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]的门口。不久，[accuser.Custom('GetActualBishopTitle')][accuser.GetFirstName]由我的伙计领着，站到了我的面前。"
 gdp_merchant.5000.desc.clergy: "一群戴着兜帽的人堵在了[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]的门口。不久，[accuser.Custom('PriestTitle')][accuser.GetFirstName]由我的伙计领着，站到了我的面前。"
 gdp_merchant.5000.desc.steward: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]官署的门突然打开，[debtor.GetFirstNamePossessive]的[debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))]冲了进来，两侧是我自己的伙计。"
 gdp_merchant.5000.desc.break: "\n\n“[ROOT.Char.GetTitledFirstNameNoTooltip]，给[SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, '我', debtor.GetTitledFirstName )]的贷款似乎有出入，”[accuser.GetSheHe]说。"
 gdp_merchant.5000.desc.accepted: "“我不太喜欢别人拿假话糊弄我。把你的商行账簿拿给我，我们把账目理清。”"
 gdp_merchant.5000.desc.discouraged.debtor: "“你知道[accuser.GetFaith.Custom('HouseOfWorshipBase')]不赞成有息贷。让我们现在结清账目，这件事就不必进一步了。”"
 gdp_merchant.5000.desc.shunned.debtor: "“一旦[accuser.Custom('DefaultPriestTitlePlural')]知道这件事，他们会严厉对待你和你的生意。我来这里给你一个自救的机会。”"
 gdp_merchant.5000.desc.accepted.steward: "“你的庇护者不太喜欢别人拿假话糊弄他。把你的商行账簿拿给我，我们把数目理清。”"
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "“身为商人，你当然明白，人不可能不付出就有所得，对吧？可是……好吧，我们希望这件事现在就能私下解决，免得你的生意因这个错误受损，进而影响商贸。”"
 gdp_merchant.5000.desc.shunned: "“你经营生意的方式是可鄙的。你作为一个商人，卖不存在的东西？除非你请求原谅，否则就法庭见。”"
 gdp_merchant.5000.a: "“你不知道我代表[ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]行事吗？”"
 gdp_merchant.5000.a.debtor: "“你肯定不希望伤害我们的贸易吧？”"
 gdp_merchant.5000.b: "“你可以拿走我们的资产作为补偿。”"
 gdp_merchant.5000.c: "“来，让我们看看细则。”"
 gdp_merchant.5000.c.success: "你的账目完美无缺"
 gdp_merchant.5000.c.failure: "数字马虎"
 gdp_merchant.5000.c.critical: "利息伪装得很差"
 gdp_merchant.5000.d: "“我想我可以让出利息……”"
 gdp_merchant.5000.e: "“就当这笔贷款被遗忘了吧。”"
 gdp_usury_penance_seized_goods_modifier: "没收商队"
 gdp_usury_penance_seized_goods_modifier_desc: "该角色的生意因隐藏利息的贷款被发现而遭受打击。"
 gdp_usury_penance_same_faith_scandal_modifier: "众所周知的放债取利者"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "该角色因卑鄙的有息贷被曝光而遭受不利。"
 gdp_usury_penance_forgive_interest_tt: "伪装的[interest|E]被免除#weak （[TARGET_CHARACTER.GetShortUIName]欠[gold_i|E]$VALUE|0V$）#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "伪装的[loan|E]仍然有效"
 gdp_merchant.5010.t: "细则"
 gdp_merchant.5010.desc: "有人提醒我，我的债权人[lender.GetFirstName]在结清我的贷款时并不完全坦诚。\n\n再次核对账目后，我能看出细则中有条款算出的总额高于我们最初商定的数额。\n\n我们协议中的出入有目共睹，只要我愿意追究。"
 gdp_merchant.5010.a: "保守秘密。"
 gdp_merchant.5010.b: "[lender.GetSheHe|U]要把利息还回来。"
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U]将不会获得任何利息。"
 gdp_merchant.5010.c: "否认贷款。"
 gdp_usury_debtor_discover_interest_tt: "隐秘[interest|E]为#weak （[gold_i|E]$VALUE|0V$）#!"
 gdp_usury_debtor_keep_secret_tt: "伪装的[interest|E]仍然是秘密"
 gdp_usury_debtor_demand_repayment_tt: "要求偿还隐藏的[interest|E]"
 gdp_usury_debtor_inform_creditor_tt: "一封信被送到[lender.GetShortUINameNoTooltip]"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$我要求隐藏的利息尽快偿还。别再想骗我。"
 gdp_merchant.5020.a: "真不幸。"
 gdp_merchant.5020.a.tt: "隐藏利息已偿还"
 gdp_usury_penance_interest_paid_back_tt: "隐藏的[interest|E]不再被欠"
 gdp_merchant.5020.desc_intro: "我已经仔细看过我们的贷款合同，很明显你试图诈骗我！"
 gdp_usury_debtor_kept_secret_message: "秘密保住了"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName]知道伪装的[interest|E]并将保守秘密。"
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "就当你给我的贷款无效吧。下次你试图给我任何东西时，我会更仔细考虑。"
 gdp_merchant.5040.a: "好大的胆子！"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "我痛苦地写信承认，开放道路的通行费、市场上无休止的争吵，已证明是我难以承受的。\n\n你能发发善心叫商会回家，至少一段时间吗？"
 gdp_merchant.0060.a: "如果必须如此。"
 gdp_merchant.0060.a.tt: "你承诺在2年内采用[GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName]。"
 gdp_merchant.0060.b: "你将不得不克服。"
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName]拥有[stress_i]#N [associate.GetStress|0]#![stress|E]。[associate.GetSheHe|U]会继续因[associate.GetHerHis]的路线上的失败[schemes|E]获得压力。"
