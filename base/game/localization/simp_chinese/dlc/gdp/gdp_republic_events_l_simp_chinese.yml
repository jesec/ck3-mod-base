l_simp_chinese:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "我们共和国的基石终于奠定！小暴君和他们雇来的打手再也不能把我们拴在犁和垄沟上。他们的争吵再也不会给我们带来痛苦和悲伤。\n\n现在，我们作为一个公社团结在一起，将塑造自己的命运，捍卫我们来之不易的自由。让我们的城市成为希望的灯塔，让我们的城墙成为抵御暴政的盾牌。"
 republic_event.0001.a: "新时代的开端！"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "旧的道路曾善待我们，我们也永远尊崇它们。但氏族会堂已容纳不下我们如今的模样。市场、城墙与人民的意志，如今都要求一种不同的统治方式。\n\n今天我们摒弃[tribal|E]统治，建立一个[republics|E]。让这座城市以一个声音说话，让那个声音成为我们的声音。"
 republic_event.0002.a: "城市不会遗忘。"
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "我特此通知你，我即刻撤销你在[actor.GetCapitalLocation.GetBaronyNameExplicitly]的贸易站。\n\n当然，这是为了[actor.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip]的最佳利益。我相信你会理解。"
 republic_event.0010.a: "但那是#EMP 我的#!贸易站！"
 republic_event.0012.desc: "你在[trade_post_target_county.GetNameNoTierNoTooltip]已不再受欢迎！你的贸易权利已被撤销。你在那里的所有有价值的东西将被没收，贸易站也会被彻底夷平。"
 republic_event.0012.a: "我得为我的货物找个新家了……"
 republic_event.0020.t: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]国库"
 republic_event.0020.intro: "是时候修订共和国的预算了。"
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U]站在我面前，眉头紧锁，手中握着账本。一小队助手跟在[steward.GetHerHim]身后，携带着卷轴、典籍和财政记录。\n\n“[ROOT.Char.GetTitleAsNameNoTooltip|U]。我们#EMP 必须#!审核开支并为国库制定一份新的预算。此事恐怕刻不容缓。"
 republic_event.0020.solo_desc: "我被一群文书员包围着，他们捧着卷轴、典籍和财政票据。所有人都在等我完成审阅。\n\n"
 republic_event.0020.income_desc: "我们当前的收入远超支出，可以用于更好的用途。"
 republic_event.0020.deficit_desc: "我们的开支过大，若在不采取行动国库将崩溃。"
 republic_event.0020.fallback_desc: "自上次预算方案实施以来，已经过去了许多年。"
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U]已审查过预算，目前状况良好。[steward.GetSheHe|U]认为无需更改。"
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "几份提案文书摊开在我面前，每份都为国库开支规划了不同的方向——该在哪些地方花钱，又该在哪些地方收紧预算。\n\n我该选哪一份呢？"
 republic_event.0021.a: "确保所有人都得到丰厚的报酬。"
 republic_event.0021.b: "均衡的薪资将最符合我们的利益。"
 republic_event.0021.c: "我们应优先为国家提供额外资金。"
 republic_event.0021.a.info_desc: "[treasury_budget_category|E]重心：@gold_icon![treasury_salary_budget_short|E]\n高薪通常受到大多数[patricians|E]的喜爱"
 republic_event.0021.b.info_desc: "[treasury_budget_category|E]重心：@law_icon!均衡\n均衡预算既确保了[patricians|E]获得体面的薪俸，也为[liege|E]保留足够的[treasury|E]储备"
 republic_event.0021.c.info_desc: "[treasury_budget_category|E]重心：@treasury_icon!领地\n较低的薪俸预算意味着共和国国库有更多余钱，从而为[liege|E]提供可自行支配的额外资金"
 republic_event.0030.desc: "我很遗憾地通知你，我已撤销你在我的市场中的所有垄断权。贸易必须自由流通。"
 republic_event.0030.a: "我们现在得像其他人一样竞争……"
 republic_event.0040.desc: "很遗憾通知你，我已决定将你逐出[actor.GetConfederation.GetName]。"
 republic_event.0040.a: "再次成为竞争对手"
 republic_event.0050.desc: "[title.GetName]议会已推选我担任尊贵的[new_holder.GetTitleAsNameNoTooltip]一职，[new_holder.Custom('GetRepublicTermLength')]。"
 republic_event.0051.desc: "我已经再次当选，[new_holder.Custom('GetRepublicTermLength')]。荣耀归于[title.GetName]。"
 republic_term_length_1_desc: "任期为[EmptyScope.ScriptValue('law_term_length_1_value')|0]年"
 republic_term_length_2_desc: "任期为[EmptyScope.ScriptValue('law_term_length_2_value')|0]年"
 republic_term_length_3_desc: "任期为[EmptyScope.ScriptValue('law_term_length_3_value')|0]年"
 republic_term_length_4_desc: "任期为[EmptyScope.ScriptValue('law_term_length_4_value')|0]年"
 republic_term_length_5_desc: "任期为[EmptyScope.ScriptValue('law_term_length_5_value')|0]年"
 republic_term_length_indefinite_desc: "终身执政"
 republic_event.0052.desc: "我已经向议会的各位尊贵议员提交了一项新法案。\n\n这项“[new_law.GetNameNoTooltip]”提案将在经过充分审议后，交付投票表决。"
 republic_event.0053.pass.desc: "“[new_law.GetNameNoTooltip]”提案已获批准，正式成为共和国法律！"
 republic_event.0053.rejected.desc: "议会已否决“[new_law.GetNameNoTooltip]”提案。"
 republic_event.law.TT: "#bold 已上会：#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P 已通过：#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N 已否决：#!#![new_law.GetName]"
 republic_event.law_kept.TT: "#bold 维持现状：#![current_law.GetName]"
 republic_event.assembly.response: "明白了。"
 republic_event.assembly.opening: "各位市民，"
 rescind_trade_monopoly_notification_base_desc: "所有[trade_monopolies|E]在[actor.GetShortUINamePossessive]的[trade_markets|E]被取消，这些市场属于："
 rescind_trade_monopoly_notification_confederation_desc: "[recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "你的[company|E]"
 republic_event.0100.t: "罗马共和国"
 republic_event.0100.desc: "罗马。说出这个词，不把它当作一座城市的名字，而是当作一个象征，一个#EMP 理想#!，长久以来很多人的梦想。我已经让这个梦想成为现实。\n\n我听见庆典的声响从国家的每一个角落传来。市民们，不，是#EMP 罗马人们#!，你们将迎来一个明天，我们将再次成为文明的中心。现在，复兴失落的古典理想的工作已经开始。我们要成为希望的灯塔，成为在黑暗时代指引的光。"
 republic_event.0100.a: "条条大路再次通罗马。"
 republic_event.0100.b: "罗马不仅是一个地方，更是一种理想。"
