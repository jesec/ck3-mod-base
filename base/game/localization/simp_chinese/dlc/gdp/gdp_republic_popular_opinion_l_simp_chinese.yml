l_simp_chinese:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "低民众好感度：焦躁的民众"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "低民众好感度：危机中的城市"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "高民众好感度：好心情"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "高民众好感度：城市繁荣"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "经济停滞"
 gdp_popular_opinion_mild_neg_prosperity_desc: "民众的不满使市民不愿投资城市，导致其长期发展有所放缓。"
 gdp_popular_opinion_mild_neg_taxes: "避税"
 gdp_popular_opinion_mild_neg_taxes_desc: "不满的市民想方设法逃避应缴税款，导致城中各区收入减少。"
 gdp_popular_opinion_mild_neg_construction: "施工延误"
 gdp_popular_opinion_mild_neg_construction_desc: "工人与匠人的合作不如往常，推高了成本，拖慢了建造进度。"
 gdp_popular_opinion_mild_neg_defense: "人手不足的城墙"
 gdp_popular_opinion_mild_neg_defense_desc: "市民不愿参加城市民兵，致使城防人手不足。"
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "经济崩溃"
 gdp_popular_opinion_severe_neg_prosperity_desc: "严重的动荡已使城市经济分崩离析。增长陷入停滞，现有繁荣也开始逐渐消退。"
 gdp_popular_opinion_severe_neg_taxes: "抗税暴动"
 gdp_popular_opinion_severe_neg_taxes_desc: "公开的抗税行为已蔓延至城市各区，严重削弱了公共收入。"
 gdp_popular_opinion_severe_neg_construction: "建筑罢工"
 gdp_popular_opinion_severe_neg_construction_desc: "行会与劳工拒绝工作。建造变得极其缓慢且昂贵。"
 gdp_popular_opinion_severe_neg_defense: "守军逃亡"
 gdp_popular_opinion_severe_neg_defense_desc: "士兵们擅离职守或拒绝服役。城墙几近无人值守。"
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "公民投资"
 gdp_popular_opinion_mild_pos_prosperity_desc: "自信的市民正将他们的善意注入城市的未来，温和地推动其长期繁荣。"
 gdp_popular_opinion_mild_pos_taxes: "积极的纳税人"
 gdp_popular_opinion_mild_pos_taxes_desc: "市民们毫无怨言地缴纳税款，为城市各区带来更多收入。"
 gdp_popular_opinion_mild_pos_construction: "公民热情"
 gdp_popular_opinion_mild_pos_construction_desc: "行会与工匠热切投身于城市的建设，降低了新工程的花费与耗时。"
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "繁荣的黄金时代"
 gdp_popular_opinion_strong_pos_prosperity_desc: "城市洋溢着乐观的活力。市民与商人纷纷踊跃投资，推动着强劲而持续的增长。"
 gdp_popular_opinion_strong_pos_taxes: "金库满溢"
 gdp_popular_opinion_strong_pos_taxes_desc: "民众对城市的自豪感，直接转化为各区民众踊跃纳税的意愿。"
 gdp_popular_opinion_strong_pos_construction: "大师级施工"
 gdp_popular_opinion_strong_pos_construction_desc: "最优秀的工匠们竞相以在这座城市工作为荣，由此压低了成本，也加速了每一项工程的进度。"
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "谨慎的卖家"
 gdp_popular_opinion_mild_neg_sell_price_desc: "城中的不安情绪使商人变得谨慎，他们囤积货物，压低了整个市场的价格。"
 gdp_popular_opinion_mild_neg_capacity: "犹豫的市场"
 gdp_popular_opinion_mild_neg_capacity_desc: "信心下降导致一些商人缩减了业务，市场容量因此收紧。"
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "市场恐慌"
 gdp_popular_opinion_severe_neg_sell_price_desc: "街头的危机导致价格急剧下跌，卖家在崩盘的市场中争相抛售货物。"
 gdp_popular_opinion_severe_neg_capacity: "商人撤离"
 gdp_popular_opinion_severe_neg_capacity_desc: "重要商人们正在完全撤出这座城市，使得贸易市场急剧萎缩。"
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "自信的卖家"
 gdp_popular_opinion_mild_pos_sell_price_desc: "城中积极的情绪提振了卖家的信心，使整个市场的价格小幅上涨。"
 gdp_popular_opinion_mild_pos_capacity: "增长的市场"
 gdp_popular_opinion_mild_pos_capacity_desc: "乐观的情绪正吸引新的商人来到城中，市场容量也随之慢慢扩大。"
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "蓬勃的贸易"
 gdp_popular_opinion_strong_pos_sell_price_desc: "非凡的市民自豪感使该城的市场成为品质的代名词，所有商品都能卖出溢价。"
 gdp_popular_opinion_strong_pos_capacity: "繁荣的市场"
 gdp_popular_opinion_strong_pos_capacity_desc: "这座城市的声誉正吸引着四面八方的商人，大大扩展了它的贸易容量。"
