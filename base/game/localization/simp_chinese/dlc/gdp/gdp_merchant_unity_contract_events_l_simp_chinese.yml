l_simp_chinese:
 option_boilerplate.tt.partner_aptitude: "#WEAK 该挑战取决于你的[deputy_possessive|E]的[aptitude|E]#!"
 option_boilerplate.tt.partner_aptitude.success: "你的代理人成功了"
 option_boilerplate.tt.partner_aptitude.failure: "你的代理人失败了"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$：[destination.GetBaronyNameExplicitlyNoTooltip]的不满"
 gdp_merchant_unity_contract.1004.desc: "[local_ruler.GetTitledFirstNamePossessive]的信简短直接：我的商人[trader.GetTitledFirstName]以及因而我商会的行为，已被[destination.GetBaronyNameExplicitly]愤怒的居民们提出质疑。\n\n当地的商人、店主和居民纷纷投诉商会交易中的不一致之处。[local_ruler.GetTitledFirstNameNoTooltip]急于解决此事，安抚[local_ruler.GetHerHis]的请愿者。\n\n显然，[trader.GetTitledFirstNameNoTooltip]在远离[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]这里的监督时，行事太过放肆了。\n\n眼下就等着动身去[destination.GetBaronyNameExplicitlyNoTooltip]了。"
 gdp_merchant_unity_contract.1004.a: "我们出发吧。"
 gdp_merchant_unity_contract.1004.tt.destination_list: "你立即开始前往[destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT 要完成该[task_contract|E]：\n$EFFECT_LIST_BULLET$你有#V 3#!次保证机会：\n$TAB$$EFFECT_LIST_BULLET$#V 2#!次保证能保证取得$label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$#V 3#!次保证能保证取得$label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$#V 1#!次保证可能导致$label_success_standard$、$label_success_qualified$或$label_failure_standard$\n$EFFECT_LIST_BULLET$挑战可以：\n$TAB$$EFFECT_LIST_BULLET$考验你的[stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$考验[GetCourtPositionType('partner_court_position').GetName()][deputy_possessive|E]的[aptitude|E]\n$TAB$$EFFECT_LIST_BULLET$考验你的[diplomacy|E]、[intrigue|E]或[learning|E]#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$：市镇广场"
 gdp_merchant_unity_contract.1010.desc.intro: "“[ROOT.Char.GetTitledFirstNameNoTooltip]，我猜？”[local_ruler.GetTitledFirstName]叹了口气，我和我的队伍在[destination.GetBaronyNameExplicitly]遇到了[local_ruler.GetHerHis]的随行人员。我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))]，[trader.GetTitledFirstName]，跟在后面，由守卫们紧紧护卫着。"
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "我的[GetCourtPositionType('partner_court_position').GetName()][partner.GetFirstName]紧随我身后，很警觉，随时准备帮忙。"
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n“你的这个商人惹出了不小的麻烦，我们的证人会作证的。”[local_ruler.GetFirstNameNoTooltip]继续说道，“我相信你会迅速解决此事，我可没时间在这些事情上浪费精力！”"
 gdp_merchant_unity_contract.1010.desc.outro: "\n\n我被指示去见[person_c.GetTitledFirstName]和[person_d.GetTitledFirstName]，听取他们的诉苦。[trader.GetFirstNameNoTooltip]看了我一眼，那眼神在说：“[ROOT.Char.GetTitleAsNameNoTooltip]，行了，你肯定明白的……”"
 gdp_merchant_unity_contract.1010.a: "好[local_ruler.GetTitledFirstNameNoTooltip]，能否为我说明一下情况？"
 gdp_merchant_unity_contract.1010.a.tt: "你立即要求[THIS.Char.GetTitledFirstNamePossessive]做出解释"
 gdp_merchant_unity_contract.1010.b: "我们将与[person_c.GetTitledFirstNameNoTooltip]会面。"
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip]很乐意与我们交谈。"
 gdp_merchant_unity_contract.1010.d: "让我们现在就结束这一切。"
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$：[char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "我们被带入[char_current.GetTitleAsNamePossessive]私人而毫不低调的起居室。[char_current.GetSheHe|U]领我到一个显然是用来接待[destination.GetTitle.Custom('BaronyTownTypePossessive')]最重要人物的房间，示意我坐下。"
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName]把我带到附近[char_current.GetHerHis]商会的所在地，那里[char_current.GetHerHis]的手下正忙着把当天交易的成果记在账本上。"
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName]负责管理城市的码头，站在岸边注视着船只的来往。[char_current.GetHerHis|U]用无尽的文件记录着船只应付的费用，并统计着卸货和装货的货物。"
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName]负责监管[destination.GetTitle.GetBaseNameNoTierPossessive]的主市场，确保小贩们都有适当的执照，并且[local_ruler.GetTitleAsNamePossessiveNoTooltip]的法律得到遵守。"
 gdp_merchant_unity_contract.1011.desc.business.smithy: "我在[char_current.GetFirstName]的铁匠铺找到[char_current.GetHerHis]，[char_current.GetSheHe|U]正忙着敲打一些马蹄铁。[char_current.GetSheHe]几乎没注意到我走过来，等目光对上才道了声歉，把活交给了学徒。"
 gdp_merchant_unity_contract.1011.desc.business.tannery: "我在[char_current.GetFirstName]的制革厂找到了[char_current.GetHerHis]，那是城郊一个臭气熏天的地方。[char_current.GetSheHe|U]似乎闻不到那股恶臭，成堆的毛皮和顾客证明，这利润远远超过了这里的难闻气味。"
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "我在[char_current.GetFirstName]的工坊里找到了[char_current.GetHerHis]，空气中弥漫着[char_current.Custom('GetRandomAppropriateTree')]的气味。看到了我，[char_current.GetSheHe]放下了手里正在刻的榫头。"
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName]是[destination.GetTitle.GetAdjectiveNoTooltip]城镇守卫队的队长，我在军械库发现[char_current.GetHerHim]在打瞌睡。[char_current.GetSheHe]醒来后给我让了个座，结结巴巴地说现在是在休息时间。"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "“我们直说吧，[ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip]。”[char_current.GetSheHe]开口道，“我听说你的手下这个[trader.GetWomanMan]干了各种欺骗勾当，而且"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n“把你的商会整顿好，否则你就得另找地方做生意了。”"
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "“有那么难吗？”[char_current.GetSheHe]微笑着，“公平地做好你的业务？就你们做生意的方式而言，[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]的表现可不怎么样……”"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "“我警告你，”[char_current.GetSheHe]微笑着说，“[local_ruler.GetTitleAsNameNoTooltip]至今一直很有耐心，但你最好不要试探[local_ruler.GetHerHim]。”"
 gdp_merchant_unity_contract.1011.desc.personality.market: "“在这里做买卖的人里，”[char_current.GetSheHe]笑着，摊开[char_current.GetHerHis]的双臂。“#EMP 你的#!这个贸易负责人，”[char_current.GetSheHe]指着我，带着指责的语气，“一次又一次地被投诉。”"
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "“我们这里有句俗话，”[char_current.GetSheHe]苦着脸说，“#EMP 无风不起浪#!，而你的那个贸易负责人可真是搞出了#EMP 一屁股#!的浪，我跟你讲！”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "“我一向以正直的方式经营事务，妥善保存客户的记录并保持良好的关系。遗憾的是，并非所有人都愿意像我这样做……”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "“这事儿没法绕过去，[char_current.GetFaith.WealthGodName]可盯着我们呢。我可一直记得要站在[char_current.GetFaith.WealthGodHerHis]好的那一边。不这么做的人，很快就会明白……”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "“听着，我和所有[char_current.GetWomanMan]一样爱钱，说不定更爱！但我不能这样经营生意，处处被人坑。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "“你看起来是个通情达理的[ROOT.Char.GetWomanMan]，[ROOT.Char.GetTitledFirstNameNoTooltip]。请理解，你手下的[trader.GetWomanMan]冒犯了我们，而我们无法承受这样的损失。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "“我自认为是个不搞虚的[char_current.GetWomanMan]，说话直来直去，也希望别人跟我说话坦诚。你手下那个[trader.GetWomanMan]就是个骗子。就这么回事。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "“我知道，我知道，看起来我们合作做得很好，但我做生意全靠货物运过来，而你手下那个[trader.GetWomanMan]让我失望太多次了。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "“我喜欢公平行事，[ROOT.Char.GetTitledFirstNameNoTooltip]，无论是在生意场上，对待下属还是上级。但公平得大家都认才行，不然的话，嗯，#EMP 有些#!人就是这么结下仇的。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "“我是个忙人，你也是个忙人，我就直说了。如果我得不到我需要的东西，我就没法养活我的人。我希望这事能解决。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "“听着，我相信[trader.GetFirstName]本性其实不坏，但我的忍耐也是有限度的，而且[trader.GetSheHe]早就过线了。”"
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "“那么……你打算怎么办？你手下那个[trader.GetWomanMan]在这儿树了不少敌人，完全是自找的。我们只希望能得到公正的对待。”"
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "还弄丢了几批货物。”"
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "还交付了劣质的货物。”"
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "还没能缴纳应缴的费用。”"
 gdp_merchant_unity_contract.1011.a: "试着解释这些差异。"
 gdp_merchant_unity_contract.1011.b: "尝试说服[char_current.GetHerHim]相信你的名誉。"
 gdp_merchant_unity_contract.1011.c: "随便编个什么故事出来。"
 gdp_merchant_unity_contract.1011.d.gold: "“收下这个，给你添麻烦了。”"
 gdp_merchant_unity_contract.1011.d.competitiveness: "“我会确保一切得到纠正。”"
 gdp_merchant_unity_contract.1011.e: "“也许我们能达成某种#EMP 共识？#!”"
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U]，你可以解释。"
 gdp_merchant_unity_contract.1011.f.partner_away: "要是我的[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]在这……"
 gdp_merchant_unity_contract.1011.f.partner_diff: "要是我有别的[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]……"
 gdp_merchant_unity_contract.1011.f.no_partner: "要是我有一名[GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]……"
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT 你给予了[task_contract.MakeScope.Var('assurances_given').GetValue|0V]/#V 3#!次保证#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT 你已与[task_contract.MakeScope.Var('chars_checked').GetValue|0V]/#V 3#!名[characters|E]对话#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "你给予#P +1#!保证"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "未给予保证"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "拆了东墙补西墙"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "等等，不对。哦……真的吗？"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "[char_current.GetHerHis]犯下的愚蠢错误"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "每个词都说得通"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "没[char_current.GetSheHe]自己以为的那么聪明"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "比你聪明一倍"
 gdp_merchant_unity_contract.1011.learning.tt.success: "你知道该看哪里"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "你到处找，却什么也没找到"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$：成功！"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$：失败！"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$：任务被无视"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "[char_current.GetTitledFirstName]翻看着[char_current.GetHerHis]的账本，指出了几处渎职的例子——那些预期的收益从未兑现，或是低于承诺标准的支出。"
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "我详细地讲述了我们商会在[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]的良好声誉，以及当地尊贵人士给予的大量推荐。近期的交易显然只是一次意外，为了商业的整体利益，理应将其搁置一旁。"
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "我编织了一个关于近期困难的冗长故事，其中穿插了许多无用的离题，并恰当地加入了一些真实细节，直到连我自己都快理不清这张谎言的网了。"
 gdp_merchant_unity_contract.1012.desc.method.learning: "我们谈了#EMP 感觉像#!是大半天的时间，讨论了[char_current.GetTitledFirstNamePossessive]在[destination.GetBaronyNameExplicitly]生意中所有能想到的方面。没有遗漏任何细节，没有漏掉任何问题。"
 gdp_merchant_unity_contract.1012.desc.method.partner: "由[partner.GetFirstName]主导谈话，[char_current.GetTitledFirstName]坐下来回答似乎没完没了的连番提问。起初还算耐心，但随着时间推移，耐心越来越少。"
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "“如果您能理解，我将#EMP 万分#!感激！”我微笑着，伸手去拿钱包，往桌上倒了几枚硬币。[char_current.GetSheHe|U]暂地愣住了，目光在闪亮的金属和我扬起的眉毛之间来回移动。"
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "“[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]对这场误会给您带来的不便深感抱歉。”我低声说道。“我会#EMP 亲自#!补偿您的损失。”"
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "好了，我能做的都做了。是时候让这事告一段落了。"
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip]意味深长地看了我一眼，随后将钱币拉向[char_current.GetHerHim]自己。"
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "[char_current.GetFirstNameNoTooltip]的惊讶迅速转为愤怒，我被指向了门口。"
 gdp_merchant_unity_contract.1012.desc.result.success: "靠着一些花言巧语，再加上对生意无常的几声抱怨，[char_current.GetFirstNameNoTooltip]慢慢接受了我对每处差额的解释。这不过是长途贸易里令人无奈的现实罢了。"
 gdp_merchant_unity_contract.1012.desc.result.failure: "尽管我已经尽力了，[char_current.GetSheHe]还是逐一驳回了我的观点，并搬出从[char_current.GetHerHis]的经验里找来的解决办法、反驳或例证，依然不肯满意。"
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "双鸟在林不如一鸟在手，而这个[char_current.GetWomanMan]很可能来路不正的所得，如今安安稳稳地落在我的手中——尽管拿走它们意味着我们不能再继续调查[char_current.GetHerHim]了。"
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "愿下一次我们也这样好运。"
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "希望我们下一次能做得更好。"
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.GetSheHe|U]对此无可辩驳。"
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "愿我的钱袋能挺过我们的下一次拜访……"
 gdp_merchant_unity_contract.1012.a: "接下来是[local_ruler.GetTitledFirstNameNoTooltip]。"
 gdp_merchant_unity_contract.1012.b: "前进，去见[person_c.GetTitledFirstNameNoTooltip]。"
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip]等着我们……"
 gdp_merchant_unity_contract.1012.d: "我们现在结束这一切……"
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "你继续试图给予保证"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "你决定如何解决这种情况"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$：解决方案"
 gdp_merchant_unity_contract.1021.desc.intro: "我们再次聚在镇广场上，[local_ruler.GetTitledFirstName]已经把那些满怀期待的原告和我的商人召集起来，等着听我对此事的最终意见。\n\n[person_c.GetFirstName]和[person_d.GetFirstName]看着我，而[trader.GetFirstName]自从我到来后第一次显得紧张，在他们的注视下不自在地挪动着身体。\n\n我的直觉告诉我，"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "当地人已经被争取过来了。"
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "当地人对我的努力还算满意。"
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "无论如何，我还没有赢得当地人的信任。"
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip]打了个哈欠：“好了，现在说说"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "这些失踪的货物呢？”"
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "这些劣质商品呢？”"
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "这些未付的欠款呢？”"
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT 你给予了所有可能的保证，即使你不惩罚[trader.GetTitledFirstNameNoTooltip]，你的充分努力也会以$label_success_critical$结束#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT 你给予了足够的保证，即使你不惩罚[trader.GetTitledFirstNameNoTooltip]，你的努力也很可能以$label_success_standard$结束#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT 你未能给予足够的保证，如果不惩罚[trader.GetTitledFirstNameNoTooltip]，你的敷衍行为可能招来反对#!"
 gdp_merchant_unity_contract.1021.a: "“正如我所解释的，这只是一场令人遗憾的误会。”"
 gdp_merchant_unity_contract.1021.a.tt: "你认为你的保证足够了"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "如果你给予了许多保证"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "如果你给予了部分保证，而当地人让步了"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "如果你未能给予保证，而当地人反应激烈"
 gdp_merchant_unity_contract.1021.b: "你得支付一半。"
 gdp_merchant_unity_contract.1021.b.tt: "你做出了有利于[local_ruler.GetTitledFirstName]的裁决，但还是减轻了[trader.GetTitledFirstName]的税务负担"
 gdp_merchant_unity_contract.1021.c: "“整件事都是胡说八道。诽谤，纯粹的胡说八道！”"
 gdp_merchant_unity_contract.1021.c.tt: "你断然否认商会有任何不当行为"
 gdp_merchant_unity_contract.1021.d: "“[trader.GetTitledFirstNameNoTooltip]有罪，必须受到惩罚。”"
 gdp_merchant_unity_contract.1021.d.tt: "为了商会的利益，你选择牺牲[trader.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$：简单的误会"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$：尘埃落定"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$：未决之事"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$：不尽人意"
 gdp_merchant_unity_contract.1022.desc.success_critical: "当地人彼此对视，热情地点着头，[trader.GetFirstName]则笑容满面。[local_ruler.GetTitledFirstName]明显松了口气，也有些惊讶。“很好，这样的话，这件事结束了！”[local_ruler.GetSheHe]尖声说道。\n\n原告们每个人都对我的到访表达感谢，也都放下了心中的顾虑。不知怎的，商会如今在[destination.GetBaronyNameExplicitlyNoTooltip]比以往任何时候都#EMP 更#!受信任了。"
 gdp_merchant_unity_contract.1022.desc.success_standard: "当地民众面面相觑，若有所思地点着头，而[trader.GetFirstName]露出了微笑。[local_ruler.GetTitledFirstName]有些犹豫，但很快就继续了下去。“好吧。那么，这件事结束了。”[local_ruler.GetSheHe]说道，语气几乎像是在提问。\n\n原告们讨论着那些论点，看起来足够满意了。商会在[destination.GetBaronyNameExplicitlyNoTooltip]的名声暂时算是保住了。"
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "在短暂而紧张的一刻，[local_ruler.GetTitledFirstName]和[local_ruler.GetHerHis]的跟班们似乎打算反驳我站不住脚的结论，但那一刻很快就在沉默中过去了。\n\n“很好……”[local_ruler.GetTitleAsNameNoTooltip]叹了口气，看着不满的原告们。“确保这种事不会再发生了。”\n\n当地人显然有疑虑，但那是[trader.GetFirstNamePossessive]的问题。"
 gdp_merchant_unity_contract.1022.desc.failure_standard: "沉默笼罩了广场。\n\n紧张而尴尬的沉默，当地人互相打量着，不满让他们的嘴角几近扭曲成咆哮。\n\n[local_ruler.GetTitledFirstName]低吼道：“就这样？”原告们愤怒地附和表示支持。\n\n[trader.GetFirstNamePossessive]紧张地吞咽了一下，打破了沉默。“我对造成的不便非常抱歉，”[trader.GetSheHe]说道，“但已经没有什么能做的了，这种事……总是难免的。”"
 gdp_merchant_unity_contract.1022.a: "这结果简直再好不过了。"
 gdp_merchant_unity_contract.1022.b: "结局好，一切就好……"
 gdp_merchant_unity_contract.1022.c: "嗯，本来可以更好的。"
 gdp_merchant_unity_contract.1022.d: "呃……该走了。"
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$：拒绝"
 gdp_merchant_unity_contract.1023.desc: "原告们目瞪口呆，从他们愤怒的低语中这一点很清楚。[local_ruler.GetTitleAsName]显然不确定该如何继续。\n\n[trader.GetFirstName]的惊讶变成了大胆的得意，我继续说道：“我不会允许我商会的好名声因为这些琐事而被拖进泥沼。”\n\n我扬起鼻子，“你们在这里浪费了我的时间，我在[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]有要紧的事！”"
 gdp_merchant_unity_contract.1023.a: "该走了。"
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$：货车底下"
 gdp_merchant_unity_contract.1024.desc: "原告们爆发出一阵欢呼，而略显惊讶的[local_ruler.GetTitledFirstName]则叫镇上的守卫给目瞪口呆的[trader.GetFirstName]上了镣铐。\n\n“可、可是，[ROOT.Char.GetTitleAsNameNoTooltip]！”我的贸易负责人嘶哑地喊道。我懒洋洋地挥了挥手把[trader.GetHerHim]打发走，“走了正好，反正[trader.GetSheHe]是个糟糕的商人……”"
 gdp_merchant_unity_contract.1024.a: "必要的牺牲。"
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$：鼓舞才智"
 gdp_merchant_unity_contract.1031.desc: "“[ROOT.Char.GetTitledFirstNameNoTooltip]？”\n\n我从账本上抬起头，看见……一个有点眼熟的[hopeful.GetCulture.GetName][hopeful.GetWomanMan]？我在哪儿见过[hopeful.GetHerHim]……\n\n“我是[hopeful.GetTitledFirstName]，[ROOT.Char.GetTitleAsNameNoTooltip]。几年前你来过我的家乡[destination_1.GetBaseNameNoTier]，解决了一场误会。我觉得你当时处理得很体面，也很从容。”\n\n“不过后来我的生意倒闭了，现在正在找别的工作。我想你可能……用得上我……”"
 gdp_merchant_unity_contract.1031.a: "很好，欢迎加入！"
 gdp_merchant_unity_contract.1031.b: "商会不需要你。"
