l_simp_chinese:
 #Side Switch Scheme
 gg_switch_sides: "拉拢倒戈"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]很快会明白，在这种局势下什么才是#EMP 正确#!的立场……"
 gg_switch_sides_desc_general: "$gg_switch_sides$[scheme|E]是一种[political_scheme|E]，意图说服[scheme_target|E]在[guelph_ghibelline_situation|E][situation|E]中改换阵营。"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]加入[CHARACTER.Custom('GetGuelphsGhibellinesConcept')]"
 gg_switch_sides_invalidated_title: "@scheme_icon!$gg_switch_sides$计谋结束"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$#weak （计谋）#!"
 gg_switch_sides_action: "拉拢"
 scheme_interaction_tt_gg_switch_sides: "尝试说服[recipient.GetShortUINameNoTooltip]加入[actor.Custom('GetGuelphsGhibellinesConcept')]"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip]对你上次要求[recipient.GetSheHe]加入[actor.Custom('GetGuelphsGhibellinesConcept')]仍耿耿于怀"
 #Claim Leadership Scheme
 gg_claim_leadership: "宣称领导权"
 gg_claim_leadership_desc: "[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')]很快会明白谁最适合做他们的领袖"
 gg_claim_leadership_desc_general: "$gg_claim_leadership$[scheme|E]是一种[political_scheme|E]，意图使[scheme_owner|E]成为[guelph_ghibelline_situation|E][situation|E]中其所属阵营的领袖。这是一种基于[diplomacy|E]的[secret_scheme|E]，可以招募[agents|E]。\n\n[scheme_owner|E]的[gg_involvement|E]比当前领袖越高，其[scheme_success_chance|E]就越高。在[prestige_level|E]上超过领袖也会有所帮助。"
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U]成为[CHARACTER.Custom('GetGuelphsGhibellinesConcept')]的新领袖"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "你避免了失去[prestige|E]和恶化同[TARGET_CHARACTER.GetShortUIName]的关系"
 gg_claim_leadership_invalidated_title: "@scheme_icon!$gg_claim_leadership$计谋结束"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$#weak （计谋）#!"
 gg_claim_leadership_action: "宣称领导权："
 scheme_interaction_tt_gg_claim_leadership: "尝试从[recipient.GetShortUIName]手中夺取[recipient.Custom('GetGuelphGhibellineConcept')]的领导权"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "招揽摇摆者"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]将被引导产生对[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')]的同情"
 gg_align_undecided_desc_general: "$gg_align_undecided$[scheme|E]是一种[political_scheme|E]，意图让[scheme_target|E]在[guelph_ghibelline_situation|E][situation|E]中加入[scheme_owner|E]一方"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]成为[CHARACTER.Custom('GetGuelphGhibellineConcept')]"
 gg_align_undecided_invalidated_title: "@scheme_icon!$gg_align_undecided$计谋结束"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$#weak （计谋）#!"
 gg_align_undecided_action: "招揽"
 scheme_interaction_tt_gg_align_undecided: "尝试将[recipient.GetShortUIName]招揽为[actor.Custom('GetGuelphsGhibellinesConcept')]"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "替换统治者"
 gg_replace_ruler_desc: "[SCHEME.GetTargetCharacter.GetShortUINamePossessiveNoTooltip]的服务已不再需要——[SCHEME.GetTargetCharacter.GetSheHe]需要被一个更……#EMP 理性#!的人取代。"
 gg_replace_ruler_desc_general: "$gg_replace_ruler$[scheme|E]是一种[political_scheme|E]，意图用一位[scheme_owner|E]在[guelph_ghibelline_situation|E][situation|E]中所属阵营的统治者替换[scheme_target|E]。"
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]被一名[CHARACTER.Custom('GetGuelphGhibellineConcept')]忠实拥护者取代"
 GG_REPLACE_RULER_DISCOVERY_DESC: "你避免了失去[prestige|E]和恶化同[TARGET_CHARACTER.GetShortUIName]的关系"
