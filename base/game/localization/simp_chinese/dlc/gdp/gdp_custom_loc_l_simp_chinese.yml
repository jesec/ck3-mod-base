l_simp_chinese:
 dinar: "第纳尔"
 dinar_plural: "第纳尔"
 dinar_gloss: "[Glossary('第纳尔', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('第纳尔', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "#bold 第纳尔#!，或#emp 代纳尔#!，是七世纪由伍麦叶王朝推行的一种金币，对标拜占庭金币[Glossary('索利多', 'SOLIDUS_GLOSS')]，尽管其名称源自银币[Glossary('狄纳里', 'DENARIUS_GLOSS')]。\n\n它传遍了阿拉伯世界，其名称至今仍被用作几种现代货币的单位。"
 denarius: "狄纳里"
 denarius_plural: "狄纳里"
 denarius_gloss: "[Glossary('狄纳里', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('狄纳里', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "#bold 狄纳里#!最初是罗马共和国使用的一种银币，到了帝国时期其成色逐渐降低。\n\n尽管如此，这个词仍作为罗马影响区域内货币的简称而存续下来，这一名称继续被用于加洛林的银币[Glossary('代纳尔', 'PENNY_GLOSS')]和阿拉伯的金币[Glossary('第纳尔', 'DINAR_GLOSS')]。"
 ducat: "杜卡特"
 ducat_plural: "杜卡特"
 ducat_gloss: "[Glossary('杜卡特', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('杜卡特', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "#bold 杜卡特#!，或#emp 多加多#!，是十三世纪威尼斯推行的一种金币，对标佛罗伦萨的[Glossary('弗罗林', 'FLORIN_GLOSS')]和热那亚的#emp 热那维诺#!，以应对拜占庭金币[Glossary('索利多', 'SOLIDUS_GLOSS')]成色的下降；其名称源自威尼斯的#emp 总督#!。\n\n它很快在商业交换中备受珍视，传遍欧洲及以远地区，并作为标准被仿铸。"
 dirham: "迪拉姆"
 dirham_plural: "迪拉姆"
 dirham_gloss: "[Glossary('迪拉姆', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('迪拉姆', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "#bold 迪拉姆#!，或#emp 德拉姆#!，是七世纪伍麦叶王朝推行的一种银币，被阿拉伯语世界广泛采用，其名称源于古典时代和希腊化时期的古希腊银币#emp 德拉克马#!。\n\n它成为穆斯林世界的标准重量单位，广泛传播，其名称至今仍被用作几种现代货币的单位。"
 aureus: "奥雷"
 aureus_plural: "奥雷"
 aureus_gloss: "[Glossary('奥雷', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('奥雷', 'AUREUS_GLOSS')]"
 solidus: "索利多"
 solidus_plural: "索利多"
 solidus_gloss: "[Glossary('索利多', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('索利多', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "#bold 索利多#!，或#emp 诺米斯玛#!（字面义为“钱币”），是四世纪拜占庭人推行的一种金币，用以取代早先的罗马[Glossary('奥雷', 'AUREUS_GLOSS')]，直到在十一世纪它又被[Glossary('赫帕派伦', 'HYPERPYRON_GLOSS')]取代。\n\n意大利各共和国的金币，如[Glossary('杜卡特', 'DUCAT_GLOSS')]、[Glossary('弗罗林', 'FLORIN_GLOSS')]和#emp 热那维诺#!，正是为了应对它在十三世纪前成色下降而推行的。\n\n它在北欧被称为#emp 先令#!，直到八世纪查理曼改革用该名称为白银的交换价值统一了标准。"
 hyperpyron: "赫帕派伦"
 hyperpyron_plural: "赫帕派伦"
 hyperpyron_gloss: "[Glossary('赫帕派伦', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('赫帕派伦', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "#bold 赫帕派伦#!，意为“高度精炼”，在欧洲被称为#emp 拜占特#!，是十一世纪拜占庭人推行的一种金币，用以取代早先的金币[Glossary('索利多', 'SOLIDUS_GLOSS')]。\n\n尽管不像#emp 索利多#!那样成色下降得厉害，但到十三世纪时，它的价值也已大大降低，从而促使意大利各共和国的[Glossary('杜卡特', 'DUCAT_GLOSS')]、[Glossary('弗罗林', 'FLORIN_GLOSS')]和#emp 热那维诺#!的问世。"
 bezant: "拜占特"
 bezant_plural: "拜占特"
 bezant_gloss: "[Glossary('拜占特', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('拜占特', 'HYPERPYRON_GLOSS')]"
 florin: "弗罗林"
 florin_plural: "弗罗林"
 florin_gloss: "[Glossary('弗罗林', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('弗罗林', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "#bold 弗罗林#!是十三世纪佛罗伦萨共和国推行的一种金币，以应对拜占庭[Glossary('索利多', 'SOLIDUS_GLOSS')]和[Glossary('赫帕派伦', 'HYPERPYRON_GLOSS')]成色的下降；热那亚的#emp 热那维诺#!和威尼斯的[Glossary('杜卡特', 'DUCAT_GLOSS')]也很快紧随其后。\n\n与#emp 杜卡特#!一样，它成了一种广泛流通的交换货币，欧洲许多铸币厂都在发行它的仿制品。其名称存留于匈牙利的#emp 福林#!中。"
 penny: "便士"
 penny_plural: "便士"
 penny_gloss: "[Glossary('便士', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('便士', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "#bold 芬尼#!，或#emp 便士#!，是八世纪查理曼推行的一种标准化银币，相当于罗马世界早先流通的银币[Glossary('狄纳里', 'DENARIUS_GLOSS')]。\n\n它很快传播开来，并作为标准被欧洲各地仿制；此后数百年间，#emp 第纳尔#!、#emp 德涅尔#!和#emp 迪内罗#!等名称，都被用来指称同一重量的银币。"
 pfennig: "芬尼"
 pfennig_plural: "芬尼"
 pfennig_gloss: "[Glossary('芬尼', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('芬尼', 'PENNY_GLOSS')]"
 denier: "德涅尔"
 denier_plural: "德涅尔"
 denier_gloss: "[Glossary('德涅尔', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('德涅尔', 'PENNY_GLOSS')]"
 dinero: "迪内罗"
 dinero_plural: "迪内罗"
 dinero_gloss: "[Glossary('迪内罗', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('迪内罗', 'PENNY_GLOSS')]"
 denaro: "德纳罗"
 denaro_plural: "德纳罗"
 denaro_gloss: "[Glossary('德纳罗', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('德纳罗', 'PENNY_GLOSS')]"
 denar: "代纳尔"
 denar_plural: "代纳尔"
 denar_gloss: "[Glossary('代纳尔', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('代纳尔', 'PENNY_GLOSS')]"
 groschen: "格罗申"
 groschen_plural: "格罗申"
 groschen_gloss: "[Glossary('格罗申', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('格罗申', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "#bold 格罗申#!，或称“厚便士”，是十三世纪蒂罗尔公爵迈因哈德二世推行的一种较重的银币，用以对应同等的威尼斯#emp 格罗索#!，最初价值12[Glossary('芬尼', 'PENNY_GLOSS')]。\n\n这一标准很快传遍欧洲，其中波希米亚的库特纳霍拉铸币厂和迈森的弗赖贝格铸币厂是著名产地。"
 tongbao: "通宝"
 tongbao_plural: "通宝"
 tongbao_gloss: "[Glossary('通宝', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('通宝', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold 通宝#!是七世纪唐朝首次发行的铸造铜合金[Glossary('钱', 'QIAN_GLOSS')]币的名称。\n\n后来它成为整个中华文化圈的标准交换单位，如今则用于传统中医，并作为吉祥护身符使用。"
 qian: "钱"
 qian_plural: "钱"
 qian_gloss: "[Glossary('钱', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('钱', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold 钱#!是对中国自战国时期起作为交换单位普遍使用的铸造铜合金硬币的统称。\n\n其方孔便于将铸件的边缘在杆上批量修锉平滑，也便于将它们串成更大的面额用于交换，通常一串一千枚。它们启发了日本、高丽、越南等地的类似铸造钱币。"
 mon_coin: "文"
 mon_coin_plural: "文"
 mon_coin_gloss: "[Glossary('文', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('文', 'QIAN_GLOSS')]"
 tanka: "天罡"
 tanka_plural: "天罡"
 tanka_gloss: "[Glossary('天罡', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('天罡', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "#bold 天罡#!，或称#emp 塔卡#!，是十三世纪德里苏丹国推行的一种银币。\n\n它传遍印度及周边地区，并在那里被大量仿制，成为丝绸之路上标准的交换单位。"
 jital: "吉塔尔"
 jital_plural: "吉塔尔"
 jital_gloss: "[Glossary('吉塔尔', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('吉塔尔', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold 吉塔尔#!最初是八世纪在迦布罗推行的一种银币，印有瘤牛与骑像图案。\n\n它们在地区内传播，发行了许多仿制币，最终贬值掺入越来越多的铜，到十六世纪#emp 吉塔尔#!已完全变成了铜币。"
 coin: "钱币"
 coin_plural: "钱币"
 coin_gloss: "钱币"
 coin_gloss_plural: "钱币"
 bazaar: "市集"
 bazaar_plural: "市集"
 bazaar_gloss: "[Glossary('巴扎', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('巴扎', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold 巴扎#!，或#emp 八匝儿#!，是波斯语中对“市集”的称呼，源自原始印欧语。它后来传入阿拉伯语，如今广泛使用于西亚、印度及以远地区。"
 khrom: "市集"
 khrom_plural: "市集"
 khrom_gloss: "[Glossary('冲木', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('冲木', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold 冲木#!是藏语中表示“市集”的词，在沿丝绸之路的区域内传播开来。"
 shuka: "市集"
 shuka_plural: "市集"
 shuka_gloss: "[Glossary('舒卡', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('舒卡', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold 舒卡#!是高加索诸语言里对“市集”的称呼。它和阿拉伯语的[Glossary('苏克', 'SUQ_GLOSS')]一样，最初借自阿卡德语中的“街道”，但经由叙利亚语传入。"
 suq: "市集"
 suq_plural: "市集"
 suq_gloss: "[Glossary('苏克', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('苏克', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold 苏克#!是阿拉伯语中表示“市集”的词，最初借自阿卡德语中的“街道”，经由阿拉米语传入，如今在穆斯林世界及以远地区是个常见词汇。"
 market_custom: "市集"
 market_custom_plural: "市集"
 market_custom_gloss: "市场"
 market_custom_gloss_plural: "市场"
 burgher: "市民"
 burgher_plural: "市民"
 patrician: "市民"
 patrician_plural: "市民"
 freeman: "自由民"
 freeman_plural: "自由民"
 artifact_curious: "稀有"
 artifact_fascinating: "迷人"
 artifact_impressive: "令人惊叹"
 artifact_magnificent: "绝顶"
 artifact_parrot: "鹦鹉"
 artifact_cockatoo: "凤头鹦鹉"
 artifact_monkey: "猴"
 tributary_merchant_contract: "[client_contract|E]"
 tributary_contract: "[tributary_contract|E]"
