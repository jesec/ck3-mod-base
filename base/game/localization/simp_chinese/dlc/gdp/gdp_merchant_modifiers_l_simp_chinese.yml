l_simp_chinese:
 gdp_merchant_starting_capacity_modifier: "增加容量"
 gdp_merchant_starting_capacity_modifier_desc: "该角色的商会能承载更多货物。"
 gdp_voluntary_merchant_modifier: "自愿经商"
 gdp_voluntary_merchant_modifier_desc: "该角色已放弃头衔，以商人的身份闯荡。"
 gdp_patron_competitiveness_modifier: "竞争激励"
 gdp_patron_competitiveness_modifier_desc: "该角色的庇护者被说服加强其生意的影响力。"
 gdp_romance_fan_modifier: "无可救药的浪漫"
 gdp_romance_fan_modifier_desc: "该角色无法抵抗一首好的爱情故事。"
 gdp_nepotism_modifier: "鼓励裙带关系"
 gdp_nepotism_modifier_desc: "该角色认为家族优先，无论代价如何。"
 gdp_merit_modifier: "鼓励绩效"
 gdp_merit_modifier_desc: "该角色不在乎利润从哪来。"
 gdp_full_attention_modifier: "专注商业"
 gdp_full_attention_modifier_desc: "该角色不会将时间浪费在琐事上。"
 gdp_responsible_modifier: "承担责任"
 gdp_responsible_modifier_desc: "该角色正在承担自身的责任，至少目前如此。"
 gdp_cooperation_modifier: "合作家族"
 gdp_cooperation_modifier_desc: "该角色选择与其他家族合作以实现互利。"
 gdp_guild_master_inpiration_diplomacy_modifier: "外交指导"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "该角色寻求了一位精通外交的行会首领的指导。"
 gdp_guild_master_inpiration_learning_modifier: "学术顾问"
 gdp_guild_master_inpiration_learning_modifier_desc: "该角色寻求了一位博学的行会首领的建议。"
 gdp_guild_master_inpiration_stewardship_modifier: "财务辅导"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "该角色寻求了一位行会首领的指导。"
 gdp_boasted_market_competence_modifier: "自夸市场竞争力"
 gdp_boasted_market_competence_modifier_desc: "当被其庇护者要求在贵族面前装疯卖傻时，该角色却借此扭转了局势。"
 gdp_driven_by_motivation_modifier: "野心驱使"
 gdp_driven_by_motivation_modifier_desc: "该角色正尽力为其所在商会的所有者创造价值。"
 gdp_promoted_diligence_modifier: "鼓励勤勉"
 gdp_promoted_diligence_modifier_desc: "该角色受到家主的施压，不得不加倍努力经营事业，甚至不惜以自身健康为代价。"
 gdp_promoted_excess_modifier: "鼓励铺张"
 gdp_promoted_excess_modifier_desc: "该角色被鼓励放下生意，去过奢靡的生活，从而提升了外交能力与商会的公众声望。"
 gdp_oasis_of_hope_modifier: "希望的绿洲"
 gdp_oasis_of_hope_modifier_desc: "这个旅行团队奇迹般地在沙漠中找到了一片绿洲，并成功恢复。"
 gdp_low_morale_entourage_modifier: "士气低落的旅团"
 gdp_low_morale_entourage_modifier_desc: "尽管热浪滚滚，该角色还是决定穿越沙漠。"
 organize_the_venture_scheme_modifier: "组织风投"
 organize_the_venture_scheme_modifier_desc: "该合同计谋现已采用更严格的日程和更密切的监督。"
 merchant_undercut_the_competition_modifier: "无情压价"
 merchant_undercut_the_competition_modifier_desc: "该角色正接受较低的利润空间，以迫使竞争对手失去优势地位。"
 merchant_cornering_the_market_modifier: "把持市场"
 merchant_cornering_the_market_modifier_desc: "该角色正利用近期的商业压力来加强自己的市场地位。"
 merchant_public_benefactor_modifier: "大众慈善家"
 merchant_public_benefactor_modifier_desc: "该角色正在赞助商会住所附近的市政工程，将利润转化为公众好感。"
 merchant_private_profit_focus_modifier: "私人利润"
 merchant_private_profit_focus_modifier_desc: "该角色以牺牲公众尊重为代价，将商会专注于私人利润和商业优势。"
 merchant_sponsored_public_works_county_modifier: "资助公共工程"
 merchant_sponsored_public_works_county_modifier_desc: "该伯爵领受益于一家商会的公共工程和市政资助。"
 gdp_merge_company_competitiveness_modifier: "贸易主导者"
 gdp_merge_company_competitiveness_modifier_desc: "该角色瓦解了对手公司的贸易路线，并主导了这些市场。"
 gdp_merchant_full_larder_modifier: "粮仓充实"
 gdp_merchant_full_larder_modifier_desc: "该角色将饥荒市场的粮食留作自家餐桌之用，从此什么也不缺。"
 gdp_merchant_staying_vigilant: "保持警惕"
 gdp_merchant_staying_vigilant_desc: "该角色预料到自己的贸易造成的饥荒会招来报复，因此小心翼翼地留意着每一处阴影。"
 gdp_merchant_master_craft_tutelage_modifier: "名师指导"
 gdp_merchant_master_craft_tutelage_modifier_desc: "该角色曾在一位工匠大师的作坊中度过时光。"
 gdp_thirsty_traveler_modifier: "口渴的旅人"
 gdp_thirsty_traveler_modifier_desc: "该角色不得不长途跋涉，一路无水可饮。"
 gdp_pure_waters_modifier: "洁净之水"
 gdp_pure_waters_modifier_desc: "该角色的商会储备充足，有净化之水可供饮用。"
 gdp_rationing_water_modifier: "配给饮水"
 gdp_rationing_water_modifier_desc: "该角色的商团正实行严格但有效的饮水配给，在寻找更多水源的过程中行动迟缓。"
 gdp_workout_modifier: "肌肉疲惫"
 gdp_workout_modifier_desc: "砍伐树木对该角色来说是一项不错但十分耗费体力的锻炼。假以时日，他们会恢复力气。"
 gdp_cat_rats_modifier: "猫猫爪"
 gdp_cat_rats_modifier_desc: "该角色因一只勤勉的猫咪而享受了一段无鼠的航行。"
 gdp_fishing_modifier: "垂钓之乐"
 gdp_fishing_modifier_desc: "该角色通过亲身经历深知成功渔获的价值。"
 gdp_catch_rats_modifier: "捕鼠"
 gdp_catch_rats_modifier_desc: "该角色被迫在黑暗狭窄的船舱中捕捉老鼠，为此付出了健康的代价。"
 dedicated_trade_studies: "专注贸易研究"
 dedicated_trade_studies_desc: "该角色选择从商而非参与行政，致力于精通市场之道。"
 gdp_local_business_modifier: "本地商业"
 gdp_local_business_modifier_desc: "该角色选择在附近市场竞争，而非远赴丝绸之路追逐财富。"
 gdp_silk_road_market_foothold_modifier: "丝绸之路立足点"
 gdp_silk_road_market_foothold_modifier_desc: "该角色最近把商会搬迁至一处丝绸之路上的集市，正利用新建立的本地人脉获取收益。"
 tgp_silk_road_interesting_innovations_modifier: "有趣的革新"
 tgp_silk_road_interesting_innovations_modifier_desc: "该角色对丝绸之路上的种种创新产生了兴趣，归来时也变得更加睿智。"
 gdp_silk_road_bargain_modifier: "丝绸之路交易"
 gdp_silk_road_bargain_modifier_desc: "该角色找准机会在一座丝绸之路市场上谈成了一笔大交易。"
 gdp_silk_road_market_investment_modifier: "丝绸之路市场投资"
 gdp_silk_road_market_investment_modifier_desc: "该角色认为在这座丝绸之路市场投资有利可图。"
 gdp_merchant_legacy_3_ennobled_modifier: "可信的商人"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "该角色及其商会凭借卓越的商业才能，在上流社会中广受认可。"
 gdp_merchant_legacy_3_rapacious_modifier: "仔细核算"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "该角色会仔细核查商会所有账目，并与关键伙计分享发现。"
