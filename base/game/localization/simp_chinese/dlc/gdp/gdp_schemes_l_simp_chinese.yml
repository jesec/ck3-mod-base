 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.8402.desc: "在[target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]深处，我看着[target_patron.GetTitledFirstNamePossessive]的官员们懒洋洋地翻阅大量文件。每一个令人满意的印章都确认了又一处[target.GetHouse.GetName]的资产转移到了[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]名下。\n\n一只苍蝇懒洋洋地飞过他们头顶的宁静，突然被[target.GetFirstName]冲进大厅打断。\n\n#EMP “你！#!”，[target.GetSheHe]嘶哑而怨毒地喊道。“怎么可能？！#DIE2 为什么……#!”"
 scheme_critical_moments.8402.a: "这只是生意……"
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.8403.desc: "经过如此多的反复折腾，对[target_patron.GetTitledFirstName]如此多的威逼施压，我们仍然未能在[target.GetTitledFirstName]察觉到风吹草动之前完成最后的步骤……\n\n[target.GetPrimaryTitle.GetDefinitiveName]如今严阵以待，彻底破坏了我们在法庭上智胜那些家伙的能力。"
 scheme_critical_moments.8403.discovered: "\n\n更糟糕的是，显然[target.GetTitledFirstNameNoTooltip]已经知道是我们干的……"
 scheme_critical_moments.8403.fallback: "\n\n然而，[target.GetTitledFirstNamePossessiveNoTooltip]对我们的参与毫不知情，这算是一点小小的安慰……"
 scheme_critical_moments.8403.a: "果然如此……"
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U]试图对[target.GetShortUINamePossessive]的商会进行$hostile_takeover$，但失败了！"
 scheme_critical_moments.8404.t: "恶意收购：[owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "当我们把注意力转向日常的商路账目清点，在泥泞中寻找商机时，今天我们得知我们的注意力放错了地方。\n\n一封简短的信函从[target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]送达，这是一份正式通知，确认了今天的法庭程序——这些程序将导致我们的商会被解散，其资产被[owner.GetPrimaryTitle.GetDefinitiveName|l]#EMP 没收#!！\n\n当我赶到时已经太迟了，如果曾经还有过机会的话……\n\n那个无赖[owner.GetTitledFirstName]对我得意地笑，而我绝望地翻阅文件，而这一切都得到了我的庇护人[target_patron.GetTitledFirstName]的确认！"
 scheme_critical_moments.8404.a: "怎么可能？！#DIE2 为什么……#!"
