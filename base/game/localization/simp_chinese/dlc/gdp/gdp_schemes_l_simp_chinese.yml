 scheme_interaction_tt_patrician_find_secrets_approved: "尝试揭露属于[recipient.GetShortUINamePossessiveNoTooltip][patrician_family|E]的一个[secret|E]"
 start_patrician_find_secrets_notification: "$patrician_find_secrets$"
 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "我几乎都要为[target.GetHouse.GetName]家族感到难过了——他们的仆人和所谓的伙计竟然如此配合，甚至#EMP 热情#!地向我的手下揭发他们最骇人听闻的秘密。#EMP 几乎#!。\n\n我手中的证据无可辩驳；[secret_holder.GetTitledFirstName][secret_to_reveal.Custom('SecretDescriptionThirdPerson')]！"
 gdp_patrician_find_secrets.0002.a: "[secret_holder.GetHerHis|U]的名誉握在我的手中。"
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "我的密探仔细翻查了[target.GetHouse.GetName]家族丢弃的文件，胁迫了他们的仆人，还塞满了市场上每一个流言贩子的钱袋，却仍然一无所获。\n\n无论[target.GetTitledFirstName]在[target.GetHerHis]门后藏着什么秘密，它们要么埋得太深、无从察觉，要么根本不存在。"
 gdp_patrician_find_secrets.0003.desc.outmatched: "我的密探如影随形地尾随[target.GetHouse.GetName]家族的每一步，却连他们秘密的一抹淡影都没能抓住。他们的门关得比守财奴的钱袋还紧，他们的仆人守口如瓶，简直像压根没有舌头这个器官。\n\n无论[target.GetTitledFirstName]犯下过什么龌龊勾当，我们所知与开始时并无二致。"
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]！全都白费了。"
