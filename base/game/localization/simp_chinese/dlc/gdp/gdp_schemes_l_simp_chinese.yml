 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.8502.desc: "一点一滴地，窃取的账本、套出的闲言碎语和靠人情得来的零碎信息，拼凑出了[target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]众多买家、卖家和其他关系的图景。\n\n毫无疑问，这些见解将使我们能够在更平等的基础上竞争[target.GetTitledFirstNamePossessive]所青睐的货物。"
 scheme_critical_moments.8502.discovered: "\n\n唉，我们的挖掘并未逃过[target.GetTitledFirstNameNoTooltip]的眼睛……"
 scheme_critical_moments.8502.a: "太好了！"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U]成功地从[target.GetShortUINamePossessive]的商会$steal_market_insights$，但被发现了！"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.8503.desc: "这么多天与小贩们唇枪舌剑，无数个夜晚在忽明忽暗的烛光下低声密语，我们仍然未能窥见[target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]的运营内情……\n\n即便从[target.GetTitledFirstNamePossessive]自己的办公室里取来的文件，也只是毫无意义的涂鸦或过时的账目。"
 scheme_critical_moments.8503.discovered: "\n\n更糟糕的是，[target.GetTitledFirstNameNoTooltip]似乎已经察觉到了我们的密谋。"
 scheme_critical_moments.8503.fallback: "\n\n然而，我们可以稍感安慰的是，[target.GetTitledFirstNameNoTooltip]并未察觉到我们的计谋。"
 scheme_critical_moments.8503.a: "浪费时间……"
