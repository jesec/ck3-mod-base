 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.8602.desc: "[trade_post_county.GetName]的地方官员是有价码的，而且事实证明并不高。一个印章接一个印章，[trade_post_province.GetName]的租赁权便转到了我们手中。\n\n等到[target.GetTitledFirstName]听说此事时，我们的代理人已经在把[target.GetHerHis]的职员赶出门外，并涂掉门上有关[target.GetHerHis]的标识。"
 scheme_critical_moments.8602.a: "选址不错，现在归我们了。"
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.8603.desc: "每一笔贿赂都被收下，每一个承诺都被打破。[trade_post_county.GetName]的长官们收了我的钱，却没有维护我的所有权。\n\n[target.GetTitledFirstNamePossessive|U]对那里的控制仍未动摇。"
 scheme_critical_moments.8603.discovered: "\n\n更糟的是，[target.GetTitledFirstNameNoTooltip]清楚知道是谁的手伸向了[target.GetHerHis]的钱袋……"
 scheme_critical_moments.8603.fallback: "\n\n至少我们在事件中的角色仍是秘密。"
 scheme_critical_moments.8603.a: "钱浪费在不忠之人身上。"
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U]试图夺取你在[trade_post_province.GetNameNoTooltip]的[trade_post|E]，但是失败了！"
 scheme_critical_moments.8604.t: "贸易站被夺取：[trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "一名骑手从[trade_post_county.GetName]带来消息：我们的代理商被扔到了大街上，地方官员宣布我不受欢迎，同时指定另一个人为[trade_post_province.GetName]贸易站的所有者。\n\n多年的贸易、仓储和来之不易的商誉——就这样被我们早已花钱打点的人签字拱手让出。"
 scheme_critical_moments.8604.discovered: "\n\n现在[owner.GetTitledFirstName]站在我的位置上，仿佛它一直是[owner.GetHersHis]的。我们#EMP 不会#!忘记这件事！"
 scheme_critical_moments.8604.a: "被赶了出来！从我们自家门口！"
 steal_trade_post_failed_toast: "企图夺取贸易站"
 steal_trade_post_host_toast: "贸易站易手"
 steal_trade_post_host_toast_desc: "[trade_post_province.GetName]的[trade_post|E]已从[target.GetShortUIName]转给[owner.GetShortUIName]"
