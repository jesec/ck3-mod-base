 patrician_find_secrets_desc_general: "在查找秘密[scheme|E]中，你尝试发现属于另一[patrician_family|E]的罪行或可耻[secret|E]。"
 PATRICIAN_FIND_SECRETS_SUCCESS_DESC: "你会发现[SCHEME.GetTargetCharacter.GetShortUINamePossessive]的[patrician_family|E]的[secret|E]，如果存在的话。"
 PATRICIAN_FIND_SECRETS_DISCOVERY_DESC: "你未因企图揭露[secret|E]而被曝光"
