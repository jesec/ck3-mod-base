 scheme_critical_moments.1142.desc_patrician_self: "我为自我宣扬而付出的所有努力终于得到了回报。\n\n我在同僚中的地位提升了，新的支持者纷纷涌向我的[house|E]，我离目标比以往任何时候都更近了！"
 scheme_critical_moments.1142.desc_patrician_other: "我为宣扬[target.GetTitledFirstNamePossessive]的名声所付出的时间和资源终于结出了果实。\n\n[target.GetHerHis|U]在同僚中的声誉提升了，新的支持者现在相信[target.GetHerHis]的价值，现在[target.GetHerHis]在[republics|E]的地位更进一步！"
 scheme_critical_moments.1143.desc_patrician_self: "我为自我宣扬而付出的所有能量和资源根本不够。没有人被我说服，或被我的承诺——还有贿赂——打动，因此我的地位仍然不变。\n\n我需要想出其他方法来宣扬我的[house|E]。"
 scheme_critical_moments.1143.desc_patrician_other: "$scheme_critical_moments.1143.desc_other$"
 patrician_promote_success_toast: "地位已提升！"
 patrician_promote_toast_scheme_desc: "你的[target.Custom2('RelationToMeShort', SCOPE.sC('owner'))][owner.GetShortUINameNoTooltip|U]宣扬了你的地位"
