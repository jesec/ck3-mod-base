l_simp_chinese:
 gdp_tgf_coin_artifact: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip]的第一枚钱币"
 gdp_tgf_coin_artifact_desc: "一面是[tgf_market_holder.GetFirstNamePossessive]的头像，边缘用只有商人才能看清的小字写着：[tgf_coin_merchant.GetFirstName]供应了[tgf_good.Custom('GetTradeGood')]。"
 gdp_tgf_smith_weapon_axe: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]的[tgf_good.Custom('GetTradeGood')|U]斧"
 gdp_tgf_smith_weapon_dagger: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]的[tgf_good.Custom('GetTradeGood')|U]匕首"
 gdp_tgf_smith_weapon_hammer: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]的[tgf_good.Custom('GetTradeGood')|U]锤"
 gdp_tgf_smith_weapon_mace: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]的[tgf_good.Custom('GetTradeGood')|U]钉头锤"
 gdp_tgf_smith_weapon_spear: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]的[tgf_good.Custom('GetTradeGood')|U]矛"
 gdp_tgf_smith_weapon_sword: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip]的[tgf_good.Custom('GetTradeGood')|U]剑"
 gdp_tgf_smith_weapon_desc: "由[tgf_source_county.GetNameNoTier]的[tgf_smith.GetFirstName]用[tgf_smith_patron.GetFirstName]买过的最好铁锭锻造。铁匠发誓说它的价值是那块金属的十倍。"
 gdp_tgf_reading_stones_artifact_merchant: "[tgf_lens_merchant.GetFirstNamePossessiveNoTooltip]的阅读石"
 gdp_tgf_reading_stones_artifact_lord: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip]的阅读石"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "两片透明玻璃镜片，由[tgf_source_county.GetNameNoTier]的[tgf_glassmaker.GetFirstName]研磨。塞涅卡写道，小字会在装水的玻璃球中放大。这些镜片让任何合同上的小字都变得清晰。"
 gdp_tgf_showpiece_artifact: "[tgf_showpiece_merchant.GetFirstNamePossessiveNoTooltip]的[tgf_good.GetNameNoTooltip]陈列柜"
 gdp_tgf_showpiece_artifact_desc: "由[tgf_good.Custom('GetTgfGoodCrafter')]大师[tgf_crafter.GetFirstName]制作，每个抽屉都装着[tgf_showpiece_merchant.GetFirstNamePossessive]最好的[tgf_good.Custom('GetTradeGood')]。它为买家打开，对其他人一概上锁。"
 gdp_tgf_curio_grain: "一捆上等小麦"
 gdp_tgf_curio_grain_desc: "从丰年中最好的一块田里割下。"
 gdp_tgf_curio_millet: "一罐陈年粟米"
 gdp_tgf_curio_millet_desc: "陈放多年，仍完好如新。粟米耐储存。"
 gdp_tgf_curio_rice: "一碗白米"
 gdp_tgf_curio_rice_desc: "脱壳、碾白，漂亮得让人舍不得吃。"
 gdp_tgf_curio_meat: "一块完美腌制的肉"
 gdp_tgf_curio_meat_desc: "腌得如此之好，可能比主人活得还久。"
 gdp_tgf_curio_fish: "一条装框的干鱼"
 gdp_tgf_curio_fish_desc: "硬如木板，骄傲加倍。"
 gdp_tgf_curio_cheese: "一轮陈年奶酪"
 gdp_tgf_curio_cheese_desc: "在一个已无人记得的夏天压制。"
 gdp_tgf_curio_fruit: "一罐蜜饯"
 gdp_tgf_curio_fruit_desc: "糖渍、密封，留待值得开罐的那一天。"
 gdp_tgf_curio_oil: "一瓶初榨油"
 gdp_tgf_curio_oil_desc: "绿金色，来自今年的第一次压榨。"
 gdp_tgf_curio_honey: "一罐密封蜂蜜"
 gdp_tgf_curio_honey_desc: "颜色深如琥珀，比某些陈年佳酿还老。"
 gdp_tgf_curio_tea: "一块紧压茶砖"
 gdp_tgf_curio_tea_desc: "在远离茶园的地方价值不菲。"
 gdp_tgf_curio_horses: "一块冠军马蹄铁"
 gdp_tgf_curio_horses_desc: "来自一匹从未输过比赛的马，卖家是如此发誓的。"
 gdp_tgf_curio_cattle: "一只抛光牛角"
 gdp_tgf_curio_cattle_desc: "打磨得光亮可鉴，宴席上用它饮酒正合适。"
 gdp_tgf_curio_silver: "一块无瑕银锭"
 gdp_tgf_curio_silver_desc: "纯到能用指甲留下痕迹，但没人敢试。"
 gdp_tgf_curio_gold: "一块河金"
 gdp_tgf_curio_gold_desc: "从一条无人愿说出名字的河里淘出。"
 gdp_tgf_curio_iron: "一块完美铁坯"
 gdp_tgf_curio_iron_desc: "致密、深色，没有一丝瑕疵。"
 gdp_tgf_curio_copper: "一枚闪亮铜饼"
 gdp_tgf_curio_copper_desc: "在矿场铸成，闪亮得如同刚冷却那天。"
 gdp_tgf_curio_beer: "一只雕刻酒杯"
 gdp_tgf_curio_beer_desc: "正好盛实实在在的一品脱。不过很少只用来喝一品脱。"
 gdp_tgf_curio_wine: "一瓶传奇年份酒"
 gdp_tgf_curio_wine_desc: "一瓶出自种植者至今仍低声议论的那个年份的酒。"
 gdp_tgf_curio_gems: "一颗未切割宝石"
 gdp_tgf_curio_gems_desc: "粗糙如砾石，价值一个村庄。"
 gdp_tgf_curio_amber: "一块琥珀"
 gdp_tgf_curio_amber_desc: "蜜色，一只苍蝇被永远困在里面。"
 gdp_tgf_curio_ivory: "一片雕刻象牙"
 gdp_tgf_curio_ivory_desc: "一截象牙尖，雕刻自一位耐心匠人之手。"
 gdp_tgf_curio_jade: "一块河玉卵石"
 gdp_tgf_curio_jade_desc: "入手清凉，真玉向来如此。"
 gdp_tgf_curio_wood: "一块纹理木节"
 gdp_tgf_curio_wood_desc: "纹理如流水。雕刻师每年都为其竞相出价。"
 gdp_tgf_curio_hemp: "一盘完美的绳"
 gdp_tgf_curio_hemp_desc: "绳子如此均匀，看起来像画出来的，而不是搓出来的。"
 gdp_tgf_curio_wool: "一撮金色羊毛"
 gdp_tgf_curio_wool_desc: "不是那个金羊毛。牧羊人说，也差不太多。"
 gdp_tgf_curio_cotton: "一簇上等棉花"
 gdp_tgf_curio_cotton_desc: "轻如绒，白如霜。"
 gdp_tgf_curio_flax: "一绞丝般亚麻"
 gdp_tgf_curio_flax_desc: "亚麻细到黄昏时能被当成丝绸。"
 gdp_tgf_curio_textiles: "织工大师的一匹布"
 gdp_tgf_curio_textiles_desc: "织得如此细密，连雨水都能挡开。"
 gdp_tgf_curio_furs: "一张无瑕冬皮"
 gdp_tgf_curio_furs_desc: "取于隆冬毛皮最厚之时。"
 gdp_tgf_curio_leather: "一块压花皮革"
 gdp_tgf_curio_leather_desc: "鞣制、压花，柔软如布。"
 gdp_tgf_curio_sugar: "一块白色塔糖尖"
 gdp_tgf_curio_sugar_desc: "塔糖中最白的部分，留作展示。"
 gdp_tgf_curio_spices: "一盒稀有香料"
 gdp_tgf_curio_spices_desc: "每年打开一次，以证明它确实存在。"
 gdp_tgf_curio_ceramics: "一只无瑕釉碗"
 gdp_tgf_curio_ceramics_desc: "敲击时声如钟鸣。但无人会去敲。"
 gdp_tgf_curio_glass: "一只透明玻璃瓶"
 gdp_tgf_curio_glass_desc: "里面没有一个气泡。吹制者退休时仍充满自豪。"
 gdp_tgf_curio_jewelry: "一枚极品胸针"
 gdp_tgf_curio_jewelry_desc: "单是别针就花了一个月。"
 gdp_tgf_curio_lacquerware: "一只漆器纪念盒"
 gdp_tgf_curio_lacquerware_desc: "上了三十层漆，光彩盖过了盒中的赠礼。"
 gdp_tgf_curio_silk: "一块完美丝绸余料"
 gdp_tgf_curio_silk_desc: "织机状态最佳时织出，从未流入市场。"
 gdp_tgf_curio_incense: "一块浅色树脂"
 gdp_tgf_curio_incense_desc: "未点燃时香甜，点燃后更香甜。从未点燃过。"
 gdp_tgf_curio_medicaments: "一份药剂师样品集"
 gdp_tgf_curio_medicaments_desc: "每样一剂，包治百病。"
 gdp_tgf_curio_stone: "一块石雕碎片"
 gdp_tgf_curio_stone_place: "来自[tgf_source_county.GetNameNoTierNoTooltip]的石雕"
 gdp_tgf_curio_stone_desc: "比任何活着的石匠都老，切割得更好。"
 gdp_tgf_curio_salt: "一块纯白盐饼"
 gdp_tgf_curio_salt_desc: "白如雪，灰盐永远难以企及。"
 gdp_tgf_curio_alum: "一块拳头大的明矾晶体"
 gdp_tgf_curio_alum_desc: "澄澈如冰，入口尖涩。"
 gdp_tgf_curio_dyes: "一小瓶货真价实的紫色染料"
 gdp_tgf_curio_dyes_desc: "一种曾专属于皇帝的颜色。严格来说现在仍是。"
 gdp_tgf_curio_books_paper: "一页彩饰书页"
 gdp_tgf_curio_books_paper_desc: "一页完美的书页，出自一本无人能找到的书。"
 gdp_tgf_itinerary_artifact: "一份朝圣者行程日志"
 gdp_tgf_itinerary_artifact_desc: "一本破旧的小书，记载了道路、客栈和渡口，字迹工整用心。其中有些地方不见于任何地图上。"
 gdp_tgf_first_sale_artifact: "[tgf_first_seller.GetFirstNamePossessiveNoTooltip]的第一[tgf_good.Custom('GetTgfGoodSmallest')][tgf_good.GetNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "[tgf_first_seller.GetFirstName]卖出的第一[tgf_good.Custom('GetTgfGoodSmallest')][tgf_good.Custom('GetTradeGood')]，以两倍价格买回并装框。此物概不出售，大概。"
 gdp_tgf_merchant_portrait_artifact: "一位商人的肖像"
 gdp_tgf_merchant_portrait_artifact_desc: "一位坐在算账桌前的商人，画中堆叠的钱币与他那志得意满的神态跃然纸上。"
 gdp_tgf_bale_book_artifact: "一本来自货箱的书"
 gdp_tgf_bale_book_artifact_desc: "有人用它给商人的货物防潮，大多数时候还挺管用的。"
 gdp_tgf_handbook_practice_artifact: "《商业实践》"
 gdp_tgf_handbook_practice_artifact_desc: "重量、度量、道路和价格，由一名显然从不睡觉的商人写下。页边写满了别人的算式。"
 gdp_tgf_handbook_roads_artifact: "《道路与市场之书》"
 gdp_tgf_handbook_roads_artifact_desc: "各大市场之间的每一条路，连同沿途的通行费和客栈，以及哪些渡夫会坑人，都记在其中。"
 gdp_tgf_handbook_mirror_artifact: "《商人之镜》"
 gdp_tgf_handbook_mirror_artifact_desc: "给商人的建议，从买什么到该信任谁。大部分是关于不该信任谁。"
