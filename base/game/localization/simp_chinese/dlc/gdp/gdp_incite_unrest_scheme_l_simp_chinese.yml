l_simp_chinese:
 # Scheme
 gdp_incite_unrest_scheme: "煽动骚乱"
 gdp_incite_unrest_scheme_desc: "在首都的平民中散布煽动性言论和不满情绪，使他们转而反抗自己的统治者。"
 gdp_incite_unrest_scheme_desc_general: "在首都的平民中散布煽动性言论和不满情绪，使他们转而反抗自己的统治者。"
 gdp_incite_unrest_scheme_action: "煽动骚乱："
