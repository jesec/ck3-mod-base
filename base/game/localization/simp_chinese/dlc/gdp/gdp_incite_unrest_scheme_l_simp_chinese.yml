 GDP_INCITE_UNREST_DISCOVERY_DESC: "在首都煽动骚乱的计谋已被揭露。"
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "放弃计谋"
 gdp_incite_unrest_scheme_owner_not_republic: "我们已不再是共和制政体，因此无法继续实施该计谋。"
 # Interaction
 gdp_incite_unrest_start_interaction: "煽动骚乱"
 gdp_incite_unrest_scheme_interaction_tt_approved: "秘密在[recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V]的平民中散布不满，降低[recipient.GetTitledFirstNamePossessiveNoTooltip|V]的[popular_opinion|E]。"
 gdp_incite_unrest_scheme_start_notification: "计谋已启动"
 gdp_incite_unrest_scheme_target_tt: "有人在密谋针对你。"
 # Success messages
 gdp_incite_unrest_scheme_success_t: "骚乱扩散"
 gdp_incite_unrest_scheme_success_liege_t: "首都的骚乱"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "计谋失败"
 gdp_incite_unrest_scheme_failure_desc: "我们的煽动者未能激起对[scope:target.GetTitledFirstName]的不满，阴谋毫无结果；民众依然无动于衷。"
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "密谋曝光"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "煽动者们已经得手。不满情绪正在[target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]的街头蔓延，[target.GetTitledFirstName]正在失去民众的信任。"
 gdp_incite_unrest_scheme_event.0005.a: "民众已准备好被进一步驱使。"
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "不满的低语已在[This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]蔓延开来。有人一直在煽动平民反对[This.GetHerHim]，他们的怨愤之声日益高涨。"
 gdp_incite_unrest_scheme_event.0006.a: "我必须恢复秩序。"
 # County modifier
 gdp_incite_unrest_county_modifier: "播种骚乱"
 gdp_incite_unrest_county_modifier_desc: "煽动者在此地暗中活动，散布怨愤，煽动民众反对统治者。"
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "可耻的阴谋家"
 gdp_caught_inciting_unrest_modifier_desc: "这位贵人被发现在暗中煽动针对共和国首脑的骚乱。其他家族和选举人都对其投以怀疑的目光。"
