 tradition_saharan_traders_name: "撒哈拉商人"
 tradition_saharan_traders_desc: "撒哈拉沙漠与其说是一道屏障，不如说是一条贸易通途，连接着萨赫勒和西非内陆与地中海——这是一个古老的事实。该文化已接受自己在这一交流中的角色，许多人一生都在商队中度过。"
 culture_parameter_oasis_villages_building_slot: "[GetTerrain( 'oasis' ).GetName]地形的#V [GetDistrictType('villages_district').GetName]#!、#V [GetDistrictType('religious_community_district').GetName]#!和#V [GetDistrictType('manor_houses_district').GetName]#![districts|E]的[building|E]槽位#P +1#!"
 culture_parameter_saharan_seasoned_traveler_route_length: "[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )][trait|E]的#V $trait_track_danger$#!路线的每个等级给予#P +1#![trade_route_length|E]"
 culture_parameter_saharan_merchant_domicile_buildings: "解锁#V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#!和#V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#![domicile_buildings|E]"
