 culture_parameter_roman_law_cheaper_university: "送[ward|E]前往大学和举办[GetActivityType('activity_adult_education').GetName][activity|E]的花费[gold_i]#P ‑[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#!"
