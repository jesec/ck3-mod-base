 tradition_silk_road_traders_name: "丝路商人"
 tradition_silk_road_traders_desc: "丝绸之路在东西方之间带来持续不断的货物流。丝绸、茶叶、漆器、玉石以及许多其他昂贵商品，沿着漫长的路途一站接一站地运送。这塑造了丝绸之路上的社会。富裕的城市要么直接从事长途贸易，要么向那些从事贸易的人出售商品。"
 tradition_monsoon_traders_name: "季风商人"
 tradition_monsoon_traders_desc: "从西方的舶主到东方的贸易行会与种姓，印度洋商人世世代代将胡椒、棉布和珍贵货物运往市场。"
