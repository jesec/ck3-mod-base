l_simp_chinese:
 tradition_fortune_seekers_name: "财富追寻者"
 tradition_fortune_seekers_desc: "该文化不以空手离家为耻，并期望那些继承无多的人去海外寻找财富。在那里，他们学会万千道路的走法，也学会每件货物的分量和每笔贷款的条件。"
 culture_parameter_fortune_seekers_merchant_propensity: "该[culture|E]的[characters|E]更有可能成为[merchants|E]"
