l_simp_chinese:
 city_stroll_prefix: "城市漫步"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$：拾获者归己"
 gdp_republic_patrician_decision.1000.desc: "我拐进主街旁的一条小巷，遇见一个当地小贩正在交谈中：\n\n“……结果没人来取走它。”那个[local_character.GetWomanMan]朝[local_character.GetHerHis]的同伴耸了耸肩，指着散落在巷子里的一箱箱[abandoned_trade_good.GetNameNoTooltip|l]。\n\n没人站出来认领这批货。我迅速把那批货物上上下下打量了一番。一个#EMP 机会#!。"
 gdp_republic_patrician_decision.1000.a: "不如我们来创造一些需求……"
 gdp_republic_patrician_decision.1000.a.flavor: "那几箱[abandoned_trade_good.GetNameNoTooltip|l]被发现时已经破损，里面的东西都碎了。"
 gdp_republic_patrician_decision.1000.b: "“哦嗬，那是我的，看见没！”"
 gdp_republic_patrician_decision.1000.c: "“啊，[liege_scope.GetTitledFirstNamePossessiveNoTooltip]丢了[abandoned_trade_good.GetNameNoTooltip|l]！多谢了。”"
 gdp_republic_patrician_decision.1000.d: "好吧，这不关我的事。"
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$：花园一日"
 gdp_republic_patrician_decision.1010.desc: "我发现了一处隐秘的绿洲；一块名副其实的璞玉，坐落于[city_location.GetTitle.GetNameNoTier]的曲径小巷之中。步道已不复昔日模样，植物也不多，却打理得井井有条。一个有着非常尽职的看护者的地方。\n\n一群群贵族，也有商人、平民和劳工，栖身于绿荫之中，享受着工作之余的短暂休憩。\n\n我信步而行，心情略微轻松，负担也略微可承受。"
 gdp_republic_patrician_decision.1010.a: "我们要把这里变成[city_location.GetTitle.GetNameNoTierNoTooltip]最好的花园！"
 gdp_republic_patrician_decision.1010.b: "那么，这小植物是什么？"
 gdp_republic_patrician_decision.1010.b.poison_plant: "你发现了有趣的植物"
 gdp_republic_patrician_decision.1010.b.health_plant: "你发现了有益的草药"
 gdp_republic_patrician_decision.1010.c: "让我……稍微更自由一点……"
 gdp_republic_patrician_decision.1010.c.flavor: "全都敞开来。多放松啊！"
 gdp_republic_patrician_decision.1010.c.success: "你未被察觉"
 gdp_republic_patrician_decision.1010.c.failure: "你被发现了"
 gdp_republic_patrician_decision.1010.d: "真愉快！"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$：[city_location.GetTitle.GetNameNoTierNoTooltip]大广场"
 gdp_republic_patrician_decision.1020.intro: "无论[city_location.GetCounty.GetTitle.GetAdjective]贵族和统治者们有何政治手段与计谋，大广场上的生活依旧继续。"
 gdp_republic_patrician_decision.1020.intro.01: "厨房炉火正旺，新鲜[ROOT.Char.Custom('GetLocalStreetFood')]的宜人香气充满我的鼻腔。"
 gdp_republic_patrician_decision.1020.intro.02: "一头暴躁的驴子对着主人叫唤，主人正愤怒地试图用水管冲洗它，清掉一层层结块的泥巴。"
 gdp_republic_patrician_decision.1020.intro.03: "几位年长市民四处走动，对面包价格和如今青年的傲慢发出不满的声音。"
 gdp_republic_patrician_decision.1020.intro.04: "一群[ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l]在周围盘旋，饥肠辘辘地盯着当地食物摊。"
 gdp_republic_patrician_decision.1020.intro.rain: "今天早晨，背景仍是昨日的暴雨。"
 gdp_republic_patrician_decision.1020.desc.maa: "\n\n在那边，我注意到一群士兵，不是[city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]本地人。他们看起来格格不入，眼神中带着忧虑。从他们有时激烈的讨论中我能听到的来看，他们似乎在寻找一位新庇护者。"
 gdp_republic_patrician_decision.1020.desc.trader: "\n\n在广场边缘，一个粗犷的身影用阴郁的目光扫过路人。当我靠近[local_character.GetHerHim]时，我听到[local_character.GetHerHis]最近终止其显赫的[liege_scope.GetHouse.GetBaseName]商业合同的哀叹。一位时运不济的受人尊敬的贸易负责人？"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\n在广场中央，一位医生坐在一堆箱子上，刚刚结束一场关于体液以及如何更容易平衡黑胆汁的讲座。我试探性地点了点头表示同意。$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\n在广场阴凉角落的一个摊位上，我发现了完美的[ROOT.Char.Custom('RandomMediumObject')]，这东西肯定能帮助我的[scheme_to_boost.GetName|l]计谋……$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\n眺望广场，我注意到有什么东西在反光。我眯眼看向地面寻找来源，发现一小件几乎完全被泥土覆盖的珠宝。$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\n广场对面，一小群时运不济的农民正被押离场。其中一个年幼的孩子发出一声撕心裂肺的哭喊，透着饥饿与恐惧，而旁观者则尽力对这悲惨的一行人视而不见。"
 gdp_republic_patrician_decision.1020.outro: "\n\n我的仆人微妙地清了清[ROOT.Char.GetHerHis]喉咙，让我意识到是时候回家处理其他责任了。"
 gdp_republic_patrician_decision.1020.a: "我应该能养活一两张嘴。"
 gdp_republic_patrician_decision.1020.b: "那些士兵可能有用……"
 gdp_republic_patrician_decision.1020.c: "嗯，我总是可以再起用一个能干的贸易负责人……"
 gdp_republic_patrician_decision.1020.d: "那个医生应该为我工作。"
 gdp_republic_patrician_decision.1020.e: "工作优先，闲逛在后。"
 gdp_republic_patrician_decision.1020.f: "我只需把这个清理干净……"
 gdp_republic_patrician_decision.1020.g: "可看之处，可遇之人！"
 gdp_republic_patrician_decision.1020.g.alternate: "又是在[GetPlayer.GetCapitalLocation.GetNameNoTooltip]的一天。"
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$：[city_location.GetTitle.GetNameNoTierPossessiveNoTooltip]港口"
 gdp_republic_patrician_decision.1030.desc: "越靠近本地港口，鱼腥味和腐烂海藻的气味就越发浓重。带着家眷的渔民——母亲和年幼的孩子——还有一群流浪猫都在这片区域徘徊，做着日常的活计。\n\n我们走过时，我无意中听到两个渔民在哀叹：“……我们确实弄到了新鱼钩。但要是能有一套新渔网，我们能做的会多得多……”他们一注意到我在场，便沉默下来。"
 gdp_republic_patrician_decision.1030.desc.outro: "\n\n我哼着歌点头。"
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\n我哼着歌点头，一只流浪猫蹭上我的腿，大声打呼。"
 gdp_republic_patrician_decision.1030.a: "“我可以说服自己采购新渔网……”"
 gdp_republic_patrician_decision.1030.a.flavor: "这可能会带来#EMP 净#!利润！"
 gdp_republic_patrician_decision.1030.b: "“如果我批量买你的鱼，什么价？”"
 gdp_republic_patrician_decision.1030.c: "猫！"
 gdp_republic_patrician_decision.1030.d: "“美好的一天，不是吗。”"
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$：[ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "我悠闲漫步时，在大广场上看到了[liege_scope.GetTitledFirstNamePossessive]最新的工程：[ROOT.Char.Custom('GetGreatProjectDescription')]。\n\n然而工头却似乎有点犯难，[local_character.GetSheHe]一边挠着头，一边不停地瞥着那张写满名字和印章的纸：“这……慷慨的捐赠……印章缺了一块……寄送者会是谁呢，嗯……”\n\n一笔未署名的工程捐款？#EMP 有意思。#!"
 gdp_republic_patrician_decision.1040.a: "“我的贡献！我们做到了！”"
 gdp_republic_patrician_decision.1040.a.success: "你揽下贡献的功劳"
 gdp_republic_patrician_decision.1040.a.failure: "你被发现了"
 gdp_republic_patrician_decision.1040.b: "“[liege_scope.GetTitledFirstNamePossessiveNoTooltip]的贡献！太棒了！”"
 gdp_republic_patrician_decision.1040.c: "好吧，这不关我的事。"
 gdp_republic_patrician_decision.1040.c.flavor: "我相信他们会解决的。"
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')]获得[contribution_to_fund.GetName]"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$：启动失败"
 gdp_republic_patrician_decision.1100.desc: "我最后拍了一下腰包，便走出书房，准备到[city_location.GetTitle.GetNameNoTierPossessive]可爱的街道上散散步。\n\n额头蹭到房门，传来一声低沉的#EMP 闷响#!。这该死的门#EMP 纹丝不动#!！它变形卡住了？\n\n环顾房间，窗户倒是有，可这么摔下去，肯定得断上一两根骨头。\n\n我努力思索。"
 gdp_republic_patrician_decision.1100.a: "“你——你好？卫兵？仆人？！”"
 gdp_republic_patrician_decision.1100.a.flavor: "不，墙壁没有逼近。它们没有……对吧？"
 gdp_republic_patrician_decision.1100.b: "窗下有很多缓冲！"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "我的身体渴望锻炼！"
 gdp_republic_patrician_decision.1100.d: "我还是……回到我的书桌吧。"
