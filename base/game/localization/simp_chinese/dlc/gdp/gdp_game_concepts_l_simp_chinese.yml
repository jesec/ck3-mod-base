l_simp_chinese:
 # Trade
 game_concept_trade: "贸易"
 game_concept_trade_desc: "$game_concept_trade$是[republics|E]、[trade_leagues|E]和[merchants|E]的营生。\n\n[trade_routes|E]表示[trade_markets|E]对[goods|E]的进出口，而市场的[needs|E]和[surpluses|E]取决于其下属[baronies|E]中的[buildings|E]。\n\n另一方面，售出价格由地产的[prosperity|E]决定，参与销售的角色会利用[competitiveness|E]和[monopolies|E]来支配市场。为了提高利润，任何在市场中进行贸易的人都应努力增加其贸易路线的[capacity|E]和长度，以及每条路线上的市场和贸易商品数量。\n\n除[adventurers|E]和[nomads|E]外，所有[government_forms|E]都可以参与$game_concept_trade$。"
 game_concept_trade_good: "贸易商品"
 game_concept_trade_goods: "贸易商品"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "贸易商品"
 game_concept_trade_goods_possessive: "贸易商品"
 game_concept_good: "商品"
 game_concept_goods: "商品"
 game_concept_basic_trade_good: "基础贸易商品"
 game_concept_basic_trade_goods: "基础贸易商品"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$是可以由[distribution_route|E]运输的[trade_goods|E]。\n\n相比之下，[profit_route|E]或[commission_route|E]可以贸易任何$game_concept_trade_goods$。"
 game_concept_market_toll: "市场通行费"
 game_concept_market_tolls: "市场通行费"
 game_concept_toll: "通行费"
 game_concept_tolls: "通行费"
 game_concept_market_toll_desc: "$game_concept_market_tolls$是对[trade_market|E]内的每笔销售收取的费用。\n\n它们由[market_owner|E]控制，收取的费用也归其所有。\n\n$game_concept_market_tolls$较低的市场对[merchants|E]更有利可图。\n\n提高$game_concept_market_tolls$会增加$game_concept_market_owner_possessive$的[income|E]，但会削减$game_concept_merchants$在每一条[profit_route|E]上于$game_concept_market$出售$game_concept_goods$所获得的利润。足够高的$game_concept_tolls$可能会促使$game_concept_merchants$转而前往收费更低的$game_concept_markets$出售。\n\n[market_owner|E]及其[direct_vassals|E]、[tributaries|E]和[clients|E]无需支付通行费。"
 game_concept_good_possessive: "商品"
 game_concept_goods_possessive: "商品"
 game_concept_trade_good_desc: "$game_concept_trade_goods$可以在[market|E]上买卖。世界各地交易着各式各样用于满足[realms|E][needs|E]的商品。"
 game_concept_trade_category: "商品类别"
 game_concept_trade_categories: "商品类别"
 game_concept_trade_category_short: "类别"
 game_concept_trade_categories_short: "类别"
 game_concept_trade_category_desc: "$game_concept_trade_categories$是[trade_goods|E]的分组。[trade_markets|E]通常会对某个类别内的商品产生[need|E]，该类别内的任何商品均可满足此需求。"
 game_concept_trade_expertise: "贸易专长"
 game_concept_expertise: "专长"
 game_concept_trade_expertise_desc: "$game_concept_trade_expertise$代表对特定[trade_category|E]的实际贸易经验。它来自活跃[trade_routes|E]的[primary_good|E]。随着专长提升，该类别的商品会变得更有利可图，而更高的[expertise_levels|E]会根据类别提供进一步的加成。"
 game_concept_trade_expertise_progress: "贸易专长进度"
 game_concept_expertise_progress: "专长进度"
 game_concept_trade_expertise_progress_desc: "每点[expertise|E]都会提高角色通往下一[expertise_level|E]的进度。"
 game_concept_trade_expertise_level: "贸易专长等级"
 game_concept_expertise_level: "专长等级"
 game_concept_expertise_levels: "专长等级"
 game_concept_trade_expertise_level_desc: "[trade_category|E]的$game_concept_trade_expertise_level$是一项等级分阶，反映了一个[trade_company|E]在该类别的贸易中积累了多少经验。\n\n该等级随着活跃的[trade_routes|E]累积[expertise_progress|E]而提升，每一级都会提供额外的[trade|E]加成。\n\n若该类别没有活跃的贸易，等级将逐渐下降（每月#N ‑[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#!专长进度）。"
 game_concept_trade_market: "贸易市场"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "贸易市场"
 game_concept_trade_market_possessive: "贸易市场"
 game_concept_trade_markets_possessive: "贸易市场"
 game_concept_market: "市场"
 game_concept_markets: "市场"
 game_concept_market_possessive: "市场"
 game_concept_markets_possessive: "市场"
 game_concept_trade_market_desc: "$game_concept_trade_market$是一个贸易枢纽，整合了它所包含的所有[holdings|E]的[production|E]与[needs|E]。\n\n在一个市场内，本地产出首先用于满足其[buildings|E]的[needs|E]；剩余部分成为可出售的[surplus|E]，而未满足的需求必须通过进口来弥补。[trade_routes|E]将各市场连接起来，在它们之间运送[goods|E]。\n\n每个市场以[market_owner|E]持有的[market_capital|E]为中心，其[market_prosperity|E]越高，向商人提供的[sell_prices|E]就越好。"
 game_concept_market_prosperity: "市场繁荣度"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$是[market|E]内所有[counties|E]的平均[prosperity|E]等级。\n\n$game_concept_market_prosperity$越高，市场内[goods|E]的[sell_prices|E]越高，使其成为[merchants|E]更有利可图的目的地。"
 game_concept_market_capital: "市场中心"
 game_concept_market_capitals: "市场中心"
 game_concept_market_capital_possessive: "市场中心"
 game_concept_market_capitals_possessive: "市场中心"
 game_concept_market_capital_desc: "$game_concept_market_capital$是位于[market|E]核心地带的[holding|E]，通常是市场覆盖的[duchy|E]的[de_jure|E]首府。\n\n它在游戏开始时是固定的，不会移动。谁持有该[barony|E]，谁就成为[market_owner|E]并控制该市场。"
 game_concept_market_owner: "市场所有者"
 game_concept_market_owners: "市场所有者"
 game_concept_market_owner_possessive: "市场所有者"
 game_concept_market_owners_possessive: "市场所有者"
 game_concept_owner: "所有者"
 game_concept_owners: "所有者"
 game_concept_owner_possessive: "所有者"
 game_concept_owners_possessive: "所有者"
 game_concept_market_owner_desc: "$game_concept_market_owner$是指持有某个[market|E]的[market_capital|E]的角色，其控制权随该[barony|E]的所有权通过战争或继承而转移。\n\n市场所有者控制着市场；他们可以创建连接到该市场的[distribution_routes|E]，是[commission_routes|E]所需的合作方，可以在市场内授予[monopolies|E]，并设置其[market_toll|E]。"
 game_concept_market_priority: "市场优先级"
 game_concept_market_priorities: "市场优先级"
 game_concept_market_priority_desc: "$game_concept_market_priority$是[market|E]中[holdings|E]在满足其[needs|E]时获得供应的顺序。\n\n首先是[market_capital|E]，然后是剩余[county|E]，按其他$game_concept_counties$的[county_capital|E]的[settlement_size|E]排序。\n\n在每个$game_concept_county$内部，[county_capital|E]优先，然后按其他$game_concept_holdings$的[settlement_size|E]排序。\n\n在[holding|E]内部，你可以重新排列[districts|E]和[buildings|E]，以确保正确的[building|E]能优先满足[needs|E]。"
 game_concept_market_share: "市场份额"
 game_concept_market_shares: "市场份额"
 game_concept_market_share_desc: "你的$game_concept_market_share$是你的[profit_route|E]在一个[market|E]中能够交易某种[trade_good|E]的数量，由你的$game_concept_competitiveness$决定。\n\n例如，如果你的$game_concept_competitiveness$与交易某种$game_concept_good$的所有其他人之和持平，你的$game_concept_market_share$就是50%。如果没有其他人交易该$game_concept_good$，你的$game_concept_market_share$始终是100%。\n\n在这种情况下，只要你有足够的[capacity|E]，你就能买下所有[surplus|E]，或选择出售以满足该$game_concept_market$中的所有[needs|E]。"
 game_concept_trade_route: "贸易路线"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "贸易路线"
 game_concept_trade_route_possessive: "贸易路线"
 game_concept_trade_routes_possessive: "贸易路线"
 game_concept_route: "路线"
 game_concept_routes: "路线"
 game_concept_route_possessive: "路线"
 game_concept_routes_possessive: "路线"
 game_concept_trade_route_desc: "$game_concept_trade_route$允许[character|E]通过开展[trade|E]获取[gold|E]或满足其[realm|E]的需求。这些渠道在至少两个[markets|E]之间交换[goods|E]，将一地的[surplus|E]用于满足另一地的[needs|E]。\n\n路线有三种类型：\n#indent_newline:4 $EFFECT_LIST_BULLET$[distribution_route|E]：由[dukes|E]和更高级别的统治者使用，以满足其[buildings|E]的[needs|E]。\n$EFFECT_LIST_BULLET$[profit_route|E]：由[merchants|E]和[republican|E]统治者使用，以赚取[gold|E]。\n$EFFECT_LIST_BULLET$[commission_route|E]：与盈利路线类似，但由拥有土地的统治者向商人发布，以一次性预付款在限定时间内满足需求。#!"
 game_concept_distribution_route: "分配路线"
 game_concept_distribution_routes: "分配路线"
 game_concept_distribution: "分配"
 game_concept_distribution_route_possessive: "分配路线"
 game_concept_distribution_routes_possessive: "分配路线"
 game_concept_distribution_route_desc: "$game_concept_distribution_route$是[dukes|E]及以上等级为了供应自身[realm|E]而使用的一种[trade_route|E]。\n\n它连接了两个[markets|E]，其中一个$game_concept_market$的任何[surplus|E]都用于满足另一市场的[needs|E]。但是，仅[basic_trade_goods|E]可以通过$game_concept_distribution_routes$运输。"
 game_concept_profit_route: "盈利路线"
 game_concept_profit_routes: "盈利路线"
 game_concept_profit: "盈利"
 game_concept_profit_route_possessive: "盈利路线"
 game_concept_profit_routes_possessive: "盈利路线"
 game_concept_profit_route_desc: "$game_concept_profit_route$是[merchants|E]和[republican|E][rulers|E]用于赚取[gold|E]的一种[trade_route|E]。\n\n它在[trade_goods|E]处于[surplus|E]时低价买入，在[needs|E]较高的地方卖出，从[buy_price|E]和[sell_price|E]的差价赚取利润。"
 game_concept_trade_route_modifier: "贸易路线修正"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "贸易路线修正"
 game_concept_trade_route_modifier_desc: "该[modifier|E]适用于其所有者的全部[trade_routes|E]。可修正的各项属性包括：\n$BULLET_WITH_TAB$[competitiveness_i][trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i][route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i][max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i][max_trade_markets_short|E]"
 game_concept_commission_route: "委托路线"
 game_concept_commission_route_desc: "$game_concept_commission_route$是[merchant|E]代表其[merchant_patron|E]运营的一种[trade_route|E]。\n\n$game_concept_merchant$由$game_concept_merchant_patron$支付报酬，在$game_concept_commission_possessive$期限内将特定的[trade_good|E]运送到指定的[trade_market|E]。\n\n一个$game_concept_merchant$同时只能拥有#V 1#!条$game_concept_commission_route$。"
 game_concept_commission_routes: "委托路线"
 game_concept_commission_route_possessive: "委托路线"
 game_concept_commission_routes_possessive: "委托路线"
 game_concept_commission: "委托"
 game_concept_commissions: "委托"
 game_concept_commission_possessive: "委托"
 game_concept_commissions_possessive: "委托"
 game_concept_commissioned_route: "委托路线"
 game_concept_commissioned_routes: "委托路线"
 game_concept_trade_route_length: "贸易路线长度"
 game_concept_route_length: "路线长度"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$是[profit_route|E]所能跨越的最大[baronies|E]数量，包括跨海和跨通航河流。可以通过升级[company_buildings|E]提高。"
 game_concept_max_trade_goods: "最大贸易商品"
 game_concept_max_trade_goods_short: "贸易商品"
 game_concept_max_trade_goods_desc: "$game_concept_max_trade_goods$指一条[route|E]上可交易的[good|E]种类数量。可通过升级[company_buildings|E]来增加。\n\n一条[profit_route|E]永远不能携带超过#V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#!种[goods|E]，无论有任何增益。"
 game_concept_max_trade_markets: "最大贸易市场"
 game_concept_max_trade_markets_short: "贸易市场"
 game_concept_max_trade_markets_desc: "$game_concept_max_trade_markets$是指[character|E]在[profit_route|E]上可选择的[markets|E]停靠点数量。可以通过升级[company_buildings|E]来增加。"
 game_concept_trade_route_capacity: "贸易路线容量"
 game_concept_trade_route_capacity_short: "贸易容量"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "容量"
 game_concept_trade_route_capacity_desc: "$game_concept_trade_route_capacity$决定了在任何时间能够沿[profit_route|E]进行贸易的[trade_goods|E]数量。可以通过升级[company_buildings|E]来增加。"
 game_concept_primary_good: "主要商品"
 game_concept_primary_goods: "主要商品"
 game_concept_primary_good_desc: "[merchants|E]和[patricians|E]拥有一项[trade_good|E]作为其[trade_routes|E]的$game_concept_primary_good$。\n\n贸易该商品提供所属[trade_category|E]的[trade_expertise|E]。"
 game_concept_road: "道路"
 game_concept_roads: "道路"
 game_concept_road_possessive: "道路"
 game_concept_roads_possessive: "道路"
 game_concept_road_desc: "一条[road|E]连接两个[markets|E]，使[trade_routes|E]能够在它们之间通行。\n\n沿$game_concept_road$的$game_concept_trade_routes$从中受益，主要是提高其[trade_route_length|E]。\n\n$game_concept_road$也直接惠及它所经过的[barony|E]，例如提高[armies|E]的行军速度。\n\n$game_concept_road$的增益随其[road_tier|E]而增长。"
 game_concept_road_tier: "道路等级"
 game_concept_road_tiers: "道路等级"
 game_concept_road_tier_short: "等级"
 game_concept_road_tier_desc: "$game_concept_road_tier$是[road|E]的发展等级，从不发达、未开发的路径直至精心铺设的大道。\n\n道路等级的提升取决于经由其上的[trade|E]流量，每一级都比前一级需要更多的使用量和更长的时间。等级越高，道路的效果越强——为使用道路的[trade_routes|E]提供更高的[trade_route_length|E]，并为经过的[baronies|E]提供更强的增益。\n\n道路以地图上设定的等级起始，只有高于最低等级的道路才会在游戏开始时显示。"
 game_concept_building_need: "建筑需求"
 game_concept_building_needs: "建筑需求"
 game_concept_need: "需求"
 game_concept_needs: "需求"
 game_concept_building_need_desc: "[building|E]拥有对[trade_goods|E]的$game_concept_needs$，满足时可提供加成。\n\n$game_concept_needs$要么针对特定[good|E]#weak （例如[GetTradeGoodType('trade_good_wine').GetName]）#!，要么针对某一[trade_category_short|E]中的任意$game_concept_good$#weak （例如[GetTradeGoodCategory('trade_category_alcohol').GetName]）#!。\n\n所有$game_concept_needs$都由当地[market|E]中的$game_concept_trade_goods$来满足。如果当地$game_concept_market$中没有$game_concept_good$的[surplus|E]，则$game_concept_goods$将根据[market_priority|E]进行分配。\n\n$game_concept_needs$始终是可选项；未满足时不会产生负面影响。"
 game_concept_market_balance: "市场结余"
 game_concept_market_balances: "市场结余"
 game_concept_market_balance_short: "结余"
 game_concept_market_balances_short: "结余"
 game_concept_market_balance_desc: "每个[market|E]对每种[trade_good|E]或[goods|E]类别都有一项结余。\n\n如果结余为正，即为[surplus|E]。\n\n如果结余为负，则市场中的[buildings|E]仍有未满足的[needs|E]。"
 game_concept_trade_surplus: "市场盈余"
 game_concept_trade_surpluses: "市场盈余"
 game_concept_surplus: "盈余"
 game_concept_surpluses: "盈余"
 game_concept_trade_surplus_desc: "如果[production|E]多于[need|E]，那么[trade_good|E]会在[market|E]中出现$game_concept_surplus$。\n\n这意味着$game_concept_market$中的所有[buildings|E]的$game_concept_needs$都得到满足。\n\n这些剩余可以通过[trade_routes|E]出口到其他$game_concept_markets$。"
 game_concept_trade_deficit: "市场赤字"
 game_concept_trade_deficits: "市场赤字"
 game_concept_deficit: "赤字"
 game_concept_deficits: "赤字"
 game_concept_trade_deficit_desc: "一种[trade_good|E]如果在一个[market|E]内的[needs|E]多于[production|E]或进口，就会出现$game_concept_deficit$。\n\n这意味着$game_concept_market$中的一些[buildings|E]将无法满足其$game_concept_needs$。\n\n通过[trade_routes|E]进口可以帮助弥补$game_concept_deficit$。"
 game_concept_production: "生产量"
 game_concept_productions: "生产量"
 game_concept_trade_goods_production: "贸易商品生产量"
 game_concept_produced: "已产出"
 game_concept_production_desc: "$game_concept_production$是[districts|E]和其[buildings|E]每月生产的[trade_good|E]数量。\n\n当[market|E]的$game_concept_production$超出[needs|E]时，超出量成为可用于[trade|E]的[surplus|E]。当$game_concept_production$低于需求时，需求将无法满足。"
 game_concept_potential_production: "潜在产出"
 game_concept_potential_productions: "潜在产出"
 game_concept_potential_production_desc: "每个[county_possessive|E]的潜在产出决定了[county_capital|E]的[resource_district|E]能生产什么原材料[trade_goods|E]。"
 game_concept_sell_price: "出售价格"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "出售价格"
 game_concept_sell_price_desc: "[market_possessive|E]$game_concept_sell_price$是一种[trade_good|E]在[need|E]中的[gold|E]价值。\n\n[profit_routes|E]的所有者，当其[route|E]在一个$game_concept_market$出售$game_concept_goods$以满足$game_concept_market_possessive$$game_concept_needs$时，获得$game_concept_trade_good$$game_concept_sell_price$的金钱。\n\n[landed|E][rulers|E]也从高$game_concept_sell_price$中受益，因为更多[merchants|E]被吸引到$game_concept_market$，提高了来自[tolls|E]的收入，或$game_concept_need$得到满足的可能性。\n\n出售的每笔$game_concept_good$都要支付$game_concept_tolls$，从而降低了实际的$game_concept_sell_price$。\n\n与对应的[buy_price|E]类似，它会随[market_prosperity|E]而提高。"
 game_concept_buy_price: "购买价格"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "购买价格"
 game_concept_buy_price_desc: "[market_possessive|E]$game_concept_buy_price$是一种[trade_good|E]在[surplus|E]中的[gold|E]成本。\n\n[profit_routes|E]的所有者，当其[route|E]在$game_concept_market$中买入$game_concept_surplus$$game_concept_goods$时，支付该$game_concept_trade_good$的$game_concept_buy_price$。\n\n与对应的[sell_price|E]类似，它会随[market_prosperity|E]而提高。"
 game_concept_trade_monopoly: "贸易垄断"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "贸易垄断"
 game_concept_monopoly: "垄断"
 game_concept_monopolies: "垄断"
 game_concept_trade_monopoly_desc: "$game_concept_monopoly$只允许其所有者在[market|E]买卖[goods|E]。\n\n$game_concept_monopoly$可以以不同方式适用：\n#indent_newline:4 $EFFECT_LIST_BULLET$常规$game_concept_monopoly$适用于单个[trade_category|E]，而[complete_monopoly|E]适用于所有类别。\n$EFFECT_LIST_BULLET$[exploitative_monopoly|E]允许其所有者甚至在[needs|E]被满足之前购买$game_concept_goods$[production|E]。\n$EFFECT_LIST_BULLET$$game_concept_monopoly$可以由[merchant|E]、[republics|E]或整个[trade_league|E]拥有。#!\n\n$game_concept_monopolies$可以通过$request_trade_monopoly_for_character_interaction|V$互动获得。"
 game_concept_complete_monopoly: "完全垄断"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "完全垄断"
 game_concept_complete_monopoly_short: "完全"
 game_concept_complete_monopoly_desc: "$game_concept_complete_monopoly$同时覆盖[market|E]中的每一种[trade_good|E]。与基本[monopoly|E]相比，它不限于一个[trade_category|E]。"
 game_concept_exploitative_monopoly: "剥削式垄断"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "剥削式垄断"
 game_concept_exploitative_monopoly_short: "剥削式"
 game_concept_exploitative_monopoly_desc: "$game_concept_exploitative_monopoly$是一种允许其所有者直接购买[market|E]的[production|E]的[monopoly|E]。\n\n通常情况下角色只能购买[surplus|E]。相比之下，$game_concept_exploitative_monopoly$的所有者可以在当地[building_needs|E]被满足之前购买$game_concept_market$中[buildings|E]的$game_concept_production$。"
 game_concept_trade_competitiveness: "贸易竞争力"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "竞争力"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "每条[profit_route|E]都拥有$game_concept_competitiveness$：在与其他$game_concept_profit_routes$竞争时，它能在[market|E]中交易多少[trade_goods|E]。\n\n你对某种$game_concept_trade_good$的总$game_concept_competitiveness$占比越高，你的[market_share|E]就越高。\n\n如果$game_concept_market$中存在[monopoly|E]，只有该$game_concept_monopoly$的所有者才比较其$game_concept_competitiveness$。"
 game_concept_competitive_pressure: "竞争压力"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "$game_concept_competitive_pressure$代表[merchant|E]获得的短期商业优势。它可以用在特定[decisions|E]和[interactions|E]上，给特定的[trade_routes|E]带来特殊优势。"
 game_concept_put_on_notice: "正式通告"
 game_concept_put_on_notice_desc: "$game_concept_put_on_notice$是[GetPerk('prepared_conscription_perk').GetName(GetPlayer)][perk|E]解锁的一项[character_interaction|E]。它花费[competitive_pressure_i][competitive_pressure|E]，针对你的[trade_route|E][trade_markets|E]上的一名[merchant|E]开启面对竞争对手的[trade_opportunity|E]。"
 game_concept_ruthless_oversight: "无情监督"
 game_concept_ruthless_oversight_desc: "$game_concept_ruthless_oversight$是[GetPerk('fear_tax_perk').GetName(GetPlayer)][perk|E]解锁的一项[character_interaction|E]。它可以提高角色的[court_position|E][aptitude|E]，代价是[dread|E]、[opinion|E]和[company_sentiment|E]。"
 game_concept_request_merchant_charter: "请求商人特许状"
 game_concept_request_merchant_charter_desc: "$game_concept_request_merchant_charter$是一种[character_interaction|E]，允许[merchant|E]请求[merchant_patron|E]赐予[charter|E]，赋予其本地[market|E]内的特殊权利。"
 game_concept_monopolize_trade: "垄断贸易"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "$game_concept_monopolize_trade$是一项[character_interaction|E]，允许[merchant|E]向[market_owner|E]支付[gold|E]，以换取[trade_monopoly|E]。"
 game_concept_trader: "贸易负责人"
 game_concept_traders: "贸易负责人"
 game_concept_trader_possessive: "贸易负责人"
 game_concept_traders_possessive: "贸易负责人"
 game_concept_trader_desc: "$game_concept_trader$是被指派监督一条[trade_route|E]的[character|E]。\n\n他们必须是路线所有者的[associate|E]或[courtier|E]，并且一次只能监督一条路线。[SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\n每位贸易负责人被指派一项任务，改善路线的某个方面。他们对该任务的[aptitude|E]取决于他们的[skills|E]。\n\n在路线工作时，贸易负责人会在每个[trade_market|E]中执行个人[schemes|E]。若计谋失败，如果他们还没有[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )][trait|E]，则获得该特质。如果已拥有，则改为在随机[GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )][trait_level_track|E]（$trait_track_caravaneer$、$trait_track_artisan$或$trait_track_creditor$）中获得少量[trait_level_track_xp|E]。"
 game_concept_trader_council: "除所有者的[spouse|E]外，其他人不能同时担任[council|E]成员。"
 game_concept_trader_council_merchant: "所有者的[spouse|E]和[deputies|E]也可以担任$game_concept_traders$，除了[GetCourtPositionType('partner_court_position').GetName()]和[GetCourtPositionType('travel_leader_court_position').GetName()]。"
 #Merchant
 game_concept_merchant: "商人"
 game_concept_merchants: "商人"
 game_concept_merchant_possessive: "商人"
 game_concept_merchants_possessive: "商人"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "$game_concept_merchant$是作为[company|E]一员参与[trade|E]的[unlanded|E][character|E]。\n\n商人们致力于满足[trade_markets|E]的[building_needs|E]；在追求个人财富和更高社会地位的同时促进经济。在这两个目标中，[prestige|E]比[gold|E]更有价值，它能提高商人在[merchant_patron|E]和[associates|E]眼中的地位，同时允许其扩大[trade_routes|E]，并最终获得[trade_monopoly|E]。"
 game_concept_merchant_family: "商人家族"
 game_concept_merchant_families: "商人家族"
 game_concept_merchant_family_possessive: "商人家族"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$是以[merchants|E]或[republicans|E]身份从事贸易的[houses|E]。他们拥有由[house_head|E]控制和所有的[company|E]，是领地[trade|E]与[prosperity|E]的重要组成部分。"
 game_concept_associate: "伙计"
 game_concept_associates: "伙计"
 game_concept_associate_possessive: "伙计"
 game_concept_associates_possessive: "伙计"
 game_concept_associate_desc: "$game_concept_associates$是属于[merchant|E][company|E]的[unlanded|E]角色。他们的职能与有地统治者的[courtiers|E]类似，能够作为[traders|E]管理[trade_routes|E]并成为[deputies|E]。"
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "代理人"
 game_concept_deputies: "代理人"
 game_concept_deputy_possessive: "代理人"
 game_concept_deputies_possessive: "代理人"
 game_concept_deputy_desc: "$game_concept_deputies$服务于[merchant_families|E]及其[companies|E]，承担各种职能。其作用类似于授予[company|E][associates|E]的[court_positions|E]，而他们的[aptitude|E]决定了其在任务中的表现如何。"
 game_concept_company: "商会"
 game_concept_companies: "商会"
 game_concept_company_possessive: "商会"
 game_concept_trade_company: "贸易商会"
 game_concept_trade_companies: "贸易商会"
 game_concept_company_desc: "$game_concept_trade_companies$是[merchant_family_possessive|E]运作的基地，所有相关的[trade_routes|E]都以此为起点。\n\n每个[GetGovernment( 'merchant_government' ).GetName]角色都有一个$game_concept_trade_company$[domicile|E]。如果存在[merchant_patron|E]，$game_concept_merchant_possessive$$game_concept_domicile$通常位于其[merchant_patron_possessive|E]的[holding|E]。\n\n[company_buildings|E]是商会的[domicile_buildings|E]，为贸易以及所有与之相关的人提供增益。$game_concept_company$同时为其[associates|E]、亲属以及可以被雇佣为[deputies|E]的[knights|E]提供住所。\n\n#WEAK 与[courts|E]类似，$game_concept_companies$中也包括一些不那么重要、不值得描述的无名[characters|E]——只是数量较少而已。#!"
 game_concept_company_building: "商会建筑"
 game_concept_company_buildings: "商会建筑"
 game_concept_company_buildings_short: "建筑"
 game_concept_company_building_desc: "$game_concept_company_buildings$是[company|E]的[domicile_buildings|E]。这些建筑主要用于促进[trade|E]，包括[trade_routes|E]的[capacity|E]、[route_length|E]、[max_trade_goods_short|E]和[max_trade_markets_short|E]。"
 game_concept_usury: "有息贷"
 game_concept_usurer: "放债取利者"
 game_concept_usurers: "放债取利者"
 game_concept_usurer_possessive: "放债取利者"
 game_concept_usurers_possessive: "放债取利者"
 game_concept_usurious: "有息"
 game_concept_interest: "利息"
 game_concept_usury_desc: "$game_concept_usury$是拥有$game_concept_interest$的[gold|E][lending|E]。它是正当生意还是[sin|E]，由[rite|E]的[GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip][doctrine|E]决定。\n\n在被谴责的地方，[merchant|E]每通过$loan_money_interaction|V$[interaction|E]发放一笔[loan|E]，就会失去[piety|E]；而以$company_purpose_creditor|V$为宗旨运营的[company|E]，一旦其$game_concept_interest$公开，就会使其所有者获得长期的$game_concept_usurer$名声。\n\n#weak 有些$game_concept_rites$只禁止在其自身[religion|E]内部放贷取息，使其$game_concept_merchants$可以自由放贷给其他所有人。#!"
 game_concept_loan: "贷款"
 game_concept_loans: "贷款"
 game_concept_loan_possessive: "贷款"
 game_concept_loans_possessive: "贷款"
 game_concept_loaned: "贷款"
 game_concept_lending: "借贷"
 game_concept_loan_desc: "$game_concept_loan$是借出时预期偿还，可能拥有也可能没有$game_concept_interest$的一笔[gold_i|E][gold|E]。\n\n$game_concept_loans$通常由[debt|E][ruler|E]举借，或是为了[war|E]或其他开支而需要额外资金。\n\n$game_concept_loans$可以以公开$game_concept_interest$、隐秘$game_concept_interest$或无$game_concept_interest$的方式发放，而不同的[faiths|E]对[usury|E]有不同的看法。\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help 一份$game_concept_loan$可能比达成协议的当事人活得还久：当任意一方去世时，这份协议会转移给他们的[heir|E]（如果有继承人的话）#!"
 loan_repayment_help: "#help [debtor|E]可以使用[GetDecisionWithKey('repay_loan_decision').GetName][decision|E]偿还$game_concept_loans$，[creditor|E]可以在至少#V 2#!年后通过#V $demand_repayment_interaction$#![interaction|E]要求偿还贷款#!\n\n拥有[GetLaw('company_purpose_creditor').GetName][company_purpose|E]的[merchants|E]，也可以通过雇佣[GetCourtPositionType( 'bailiff_court_position' ).GetName()]和使用#V $bailiff_collect_loans$#![court_position_task|E]逐步追回[loans|E]"
 game_concept_merchant_patron: "庇护者"
 game_concept_merchant_patrons: "庇护者"
 game_concept_merchant_patron_possessive: "庇护者"
 game_concept_merchant_patron_desc: "$game_concept_merchant_patron$是[merchant_possessive|E][domicile|E]所在[holding|E]的[ruler|E]。\n\n该$game_concept_merchant$会被视为$game_concept_merchant_patron$的[client|E]，必须向其缴纳[taxes|E]。"
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "受庇护商人"
 game_concept_client_merchants: "受庇护商人"
 game_concept_client_merchant_possessive: "受庇护商人"
 game_concept_client: "受庇护者"
 game_concept_client_possessive: "受庇护者"
 game_concept_clients: "受庇护者"
 game_concept_client_merchant_desc: "$game_concept_client_merchant$是一名[merchant|E][character|E]，在一位[landed|E][ruler|E]的[realm|E]内拥有一家[company|E]，这位统治者便成为其[merchant_patron|E]。\n\n$game_concept_client_merchant$会将自己[trade|E]收入的一部分提供给庇护者。他们不能加入针对庇护者的战争或[faction|E]，也不能脱离关系，除非将商会迁往别处。"
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "夺取领地"
 game_concept_seize_realm_cb_desc: "一种[casus_belli|E]，允许[merchant|E]建立[republics|E]并获取领地。进攻方可以通过#V $gdp_merchant_seize_realm_call_debtor_interaction$#![interaction|E]使用@unspent_strong_hook_icon![strong_hooks|E]#weak （$strong_indebted_hook$或$strong_loan_hook$）#!强迫[independent|E][rulers|E]作为[allies|E]加入该[war|E]。"
 game_concept_company_purpose: "商会宗旨"
 game_concept_company_purposes: "商会宗旨"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$是塑造[company|E]和其[merchant_family|E]的准则。\n\n一家商会可以专注于放贷、家族信誉、商品的质量与稀有性或者其贸易网络的覆盖范围——跨越距离与文化。\n\n不同的宗旨会提供独特的[interactions|E]、[deputy|E]职位和[trade|E]加成。"
 game_concept_trade_acumen: "贸易精明"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "精明"
 game_concept_trade_acumen_desc: "$game_concept_acumen$代表[merchant|E][company|E]通过[trade|E]在全部[trade_categories|E]中积累的[gold|E]总额。\n\n精明用于解锁各项[company_sizes|E]，且不可消耗。"
 game_concept_company_size: "商会规模"
 game_concept_company_sizes: "商会规模"
 game_concept_company_size_desc: "$game_concept_company_size$代表[merchant_family_possessive|E]在[trade|E]中的主导地位，每个等级都会大幅提升其[competitiveness|E]和贸易能力。提升到更大的规模需要积累[acumen|E]。\n\n共有四种不同的规模：[GetLaw('company_size_small').GetName]、[GetLaw('company_size_medium').GetName]、[GetLaw('company_size_large').GetName]和[GetLaw('company_size_huge').GetName]。"
 #Contracts
 game_concept_trade_contract: "贸易合同"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "贸易合同"
 game_concept_trade_contract_possessive: "贸易合同"
 game_concept_trade_contracts_possessive: "贸易合同"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$是[merchant|E][companies|E]影响其[trade_routes|E]或在远方寻求宝贵财富的途径。\n\n前者被称为[trade_opportunities|E]，后者则被称为[luxury_contracts|E]。"
 game_concept_trade_contract_tier: "贸易合同等级"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "等级"
 game_concept_trade_contract_tier_desc: "每份[trade_contract|E]都有一项$game_concept_trade_contract_tier_tier$，决定了$game_concept_trade_contract$的难度和奖励，通常取决于合同地点的[prosperity|E]。"
 game_concept_luxury_contract: "珍奇合同"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "珍奇合同"
 game_concept_luxury_contract_possessive: "珍奇合同"
 game_concept_luxury_contracts_possessive: "珍奇合同"
 game_concept_luxury_contract_desc: "$game_concept_luxury_contracts$要求[merchant|E][companies|E][travel|E]至遥远地点，尝试获取[domicile_artifact|E]。\n\n这类合同每年有概率为行商[company_purpose|E]的商人生成，可以通过[GetDecisionWithKey('gdp_visit_holding_decision').GetName][decision|E]获得。"
 game_concept_trade_opportunity: "商机"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "商机"
 game_concept_trade_opportunity_possessive: "商机"
 game_concept_trade_opportunities_possessive: "商机"
 game_concept_opportunity: "商机"
 game_concept_opportunities: "商机"
 game_concept_opportunity_possessive: "商机"
 game_concept_opportunities_possessive: "商机"
 game_concept_trade_opportunity_desc: "$game_concept_trade_opportunities$需要[merchant|E][companies|E]成功完成[scheme|E]。\n\n这些通常严格属于商业行为（例如推广有利可图的[trade_goods|E]），但也可能更具对抗性（例如与竞争对手家族争夺[market|E]控制权）。\n\n如果$game_concept_scheme$失败，或因某些原因被放弃，$game_concept_trade_opportunity$也会失败。"
 game_concept_trade_opportunity_tier: "商机等级"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "等级"
 game_concept_trade_opportunity_tier_desc: "$game_concept_trade_opportunity_tier$反映了合同所在地的[prosperity|E]。\n\n$game_concept_trade_opportunity_tier$越高，报酬也相应提升——尽管任务的难度通常也会随之增加。"
 game_concept_trade_opportunity_scheme: "商机计谋"
 game_concept_trade_opportunity_schemes: "商机计谋"
 game_concept_trade_opportunity_scheme_possessive: "商机计谋"
 game_concept_trade_opportunity_schemes_possessive: "商机计谋"
 game_concept_trade_opportunity_scheme_trade_opportunity: "商机"
 game_concept_trade_opportunity_scheme_opportunity: "商机"
 game_concept_opportunity_scheme: "商机计谋"
 game_concept_opportunity_schemes: "商机计谋"
 game_concept_opportunity_scheme_possessive: "商机计谋"
 game_concept_opportunity_schemes_possessive: "商机计谋"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "庇护者合同"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "庇护者合同"
 game_concept_patron_contract_possessive: "庇护者合同"
 game_concept_patron_contracts_possessive: "庇护者合同"
 game_concept_patron_contract_desc: "$game_concept_patron_contracts$需要[merchant|E][companies|E]成功完成针对其[merchant_patron|E]的[scheme|E]。\n\n这些通常偏向[diplomacy|E]，目的是协助庇护者的意愿（例如解决市场争端），或者让庇护者按商人的意愿行事（例如排挤竞争的商人家族）。\n\n如果$game_concept_scheme$失败，或因某些原因被放弃，$game_concept_patron_contract$也会失败。"
 game_concept_patron_contract_scheme: "庇护者合同计谋"
 game_concept_patron_contract_schemes: "庇护者合同计谋"
 game_concept_patron_contract_scheme_possessive: "庇护者合同计谋"
 game_concept_patron_contract_schemes_possessive: "庇护者合同计谋"
 game_concept_patron_contract_scheme_patron_contract: "庇护者合同"
 game_concept_patron_scheme: "庇护者计谋"
 game_concept_patron_schemes: "庇护者计谋"
 game_concept_patron_scheme_possessive: "庇护者计谋"
 game_concept_patron_schemes_possessive: "庇护者计谋"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "方向合同"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "方向合同"
 game_concept_unity_contract_possessive: "方向合同"
 game_concept_unity_contracts_possessive: "方向合同"
 game_concept_unity_contract_desc: "当[merchant_possessive|E]的[company_sentiment|E]较低时，会出现$game_concept_unity_contracts$，这是一个需要解决的问题。"
 game_concept_domicile_artifact: "住所宝物"
 game_concept_domicile_artifacts: "住所宝物"
 game_concept_domicile_artifact_desc: "$game_concept_domicile_artifact$是在[merchant_possessive|E][company|E]中陈列展示的[artifact|E]，例如[curios|E]和[creatures|E]。\n\n$game_concept_domicile_artifacts$是$game_concept_merchant_possessive$被动[prestige|E]收入的主要来源。\n\n一个[character|E]可以拥有多少$game_concept_artifacts$没有上限，但只有陈列在对应类型槽位中才会产生效果。\n\n$game_concept_merchants$可以通过成功完成[luxury_contracts|E]来获得$game_concept_domicile_artifacts$。"
 game_concept_menagerie: "异兽"
 game_concept_menagerie_creature: "异兽"
 game_concept_menagerie_creatures: "异兽"
 game_concept_creature: "异兽"
 game_concept_creatures: "异兽"
 game_concept_creature_desc: "$game_concept_creature$是[merchants|E]通过完成[luxury_contracts|E]获得的活体动物。\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "奇珍"
 game_concept_curios: "奇珍"
 game_concept_curio_desc: "$game_concept_curio$是[merchants|E]通过完成[luxury_contracts|E]获得的一种稀有[artifact|E]类型。\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "它们可以作为[domicile_artifact|E]在[company|E]展示，以稳定获得[prestige|E]。"
 game_concept_guelph_ghibelline_precursor_situation: "$game_concept_guelph_ghibelline_situation$序幕"
 game_concept_guelph_ghibelline_precursor_situation_desc: "作为[guelph_ghibelline_situation|E][situation|E]的前奏，这是一系列加深神圣罗马帝国与教宗国之间冲突的事件。\n\n#F 一切都始于[Glossary( '因主之名', 'IN_NOMINE_DOMINI_GLOSS' )]的教宗复兴运动，当时的教宗宣布贵族不应参与教宗选举，而应由聚集在罗马的枢机们来进行。\n\n后来在[Glossary( '教宗训令', 'DICTATUS_PAPAE_GLOSS' )]及叙任权斗争期间，教宗宣称上帝授予其的权力是普世权力，只有教宗有权任免教会人员。主教接受世俗授予职位象征的做法遭到反对。"
 game_concept_guelph_ghibelline_situation: "归尔甫派与吉伯林派"
 game_concept_guelph_ghibelline_situation_desc: "教宗（[guelphs|E]）与神圣罗马帝国（[ghibellines|E]）之间的一场冲突。\n\n随着时间推移，它逐渐演变为一个地方性问题：北意大利的统治者们究竟是希望帝国更多介入，还是保持其独立自主。"
 game_concept_gg_involvement: "参与度"
 game_concept_gg_involvement_desc: "[ruler|E]在[guelph_ghibelline_situation|E][situation|E]中的$game_concept_gg_involvement$表示该角色对局势状态的影响程度，主要来自于针对对立阵营采取的行动。\n\n此类行动包括：\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[imprison|E]、[torture|E]和[execution|E][interactions|E]\n$BULLET_WITH_TAB$[GetScheme('gg_switch_sides').GetTypeName][scheme|E]、$gg_recruit_partisan_interaction|V$[interaction|E]以及[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V][casus_belli|E]等\n$BULLET_WITH_TAB$触发[situation_catalysts|E]\n\n相应的，$game_concept_gg_involvement$：\n$BULLET_WITH_TAB$每提高#V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#!点，[GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip][modifier|E]将相应同比变化\n$BULLET_WITH_TAB$如果由你方结束局势，它会作为奖励的倍数。\n\n#F 在[guelph_ghibelline_precursor_situation|E]期间，还无法获得$game_concept_gg_involvement$，并且直到冲突全面爆发前，其累积速率降低。#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "归尔甫派"
 game_concept_guelphs: "归尔甫派"
 game_concept_guelph_desc: "归尔甫派是[guelph_ghibelline_situation|E][situation|E]中支持从神圣罗马帝国中独立、进而主张神授主权的一方。\n\n#F 归尔甫一名源自韦尔夫家族，历史上为巴伐利亚公爵家族，这一名称经口耳相传的语音演变形成。#!"
 game_concept_ghibelline: "吉伯林派"
 game_concept_ghibellines: "吉伯林派"
 game_concept_ghibelline_desc: "吉伯林派是[guelph_ghibelline_situation|E][situation|E]中支持神圣罗马帝国对北意大利城邦加强影响与控制的一方。\n\n#F 吉伯林一名源自霍恩施陶芬家族在魏恩斯贝格围城战中的战斗口号，指代维伯林根城堡。#!"
 game_concept_lombard_league: "伦巴第同盟"
 game_concept_lombard_league_desc: "由北意大利城市组成的联盟，旨在反对$e_hre$日益增长的集权要求。"
 game_concept_confederation_cohesion: "联盟凝聚力"
 game_concept_cohesion: "凝聚力"
 game_concept_confederation_cohesion_desc: "$game_concept_cohesion$衡量一个[confederation|E]有多团结，从#V 0#!到#V 100#!。每个成员每月都会为其做出贡献，无论好坏，而在高$game_concept_cohesion$时收益会递减。\n\n每达到一个等级，都会为成员提供递增的加成。产生$game_concept_cohesion$的因素，以及各等级的奖励内容，取决于联盟的种类。\n\n联盟使用以下类型的$game_concept_cohesion$：\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "贸易联盟"
 game_concept_trade_league_desc: "$game_concept_trade_league$是[republics|E]的[confederation|E]，共和制[rulers|E]可以为了共同的商业和防御利益而组建或加入。\n\n一名成员持有[leading_title|E]，并担任[trade_league_leader|E]（唯一可以邀请或移除其他成员的成员），其余成员则持有[member_title|E]。\n\n随着[league_cohesion|E]加深，成员将获得更大增益。"
 game_concept_trade_leagues: "贸易联盟"
 game_concept_trade_league_short: "联盟"
 game_concept_league_cohesion: "联盟凝聚力"
 game_concept_league_cohesion_desc: "$game_concept_cohesion$衡量一个[trade_league|E]的统一度，每达到一个等级都会为其成员带来递增的[trade|E]好处。低于#V 20#!时，联盟过于松散，成员无法加入彼此的[wars|E]或请求[trade_monopolies|E]。\n\n成员从他们的[title_tier|E]、他们的[capital|E]，以及他们对[trade_league_leader|E]的[opinion|E]中产生凝聚力。持有的垄断会增加更多，而[trade_league_members_short|E]太少或太多则会使其流失。"
 game_concept_trade_league_leader: "贸易联盟领袖"
 game_concept_trade_league_leader_desc: "贸易联盟领袖是[trade_league|E]的正式首领。\n\n领袖是$game_concept_trade_league$中唯一能邀请新成员或移除现有成员的[trade_league_member_short|E]。联盟最开始以其创立者为领袖。成员之后可以提出对领袖之位的宣称。如果领袖退出，另一位成员将根据[title_tier|E]、[capital|E]的[settlement_size|E]以及[prestige|E]继任。"
 game_concept_trade_league_leader_short: "领袖"
 game_concept_trade_league_member: "贸易联盟成员"
 game_concept_trade_league_members: "贸易联盟成员"
 game_concept_trade_league_member_short: "成员"
 game_concept_trade_league_members_short: "成员"
 game_concept_trade_league_member_desc: "贸易联盟成员通过持有[member_title|E]而成为[trade_league|E]的一部分，这些头衔由成员[republics|E]的[primary_title|E]构成。\n\n其中一名成员持有[leading_title|E]，并担任[trade_league_leader|E]。"
 game_concept_league_focus: "联盟重心"
 game_concept_league_focuses: "联盟重心"
 game_concept_league_focus_desc: "$game_concept_league_focus$是由[trade_league|E][trade_league_leader|E]选定的一种[trade_category|E]。所有[member_title|E]的[holder|E]都会在该类别上获得[trade_expertise|E]、[production|E]和[sell_price|E]加成。"
 game_concept_patrician: "贵人"
 game_concept_patricians: "贵人"
 game_concept_patrician_possessive: "贵人"
 game_concept_patrician_desc: "贵人是[republics|E]内主要[merchant|E]家族的[house_head|E]。"
 game_concept_patrician_family: "贵人家族"
 game_concept_patrician_families: "贵人家族"
 game_concept_patrician_family_short: "家族"
 game_concept_patrician_family_desc: "$game_concept_patrician_family$是[republics|E]内的[merchant_family|E]。他们是共和国中掌握权力和影响力的贵族精英，使用[consortery|E]作为[domicile|E]。\n\n[county|E][title_tier|E]的共和国只能拥有一个贵人家族，而更高等级的共和国则可以，且应当拥有多个贵人家族。"
 game_concept_patrician_rating: "贵人评分"
 game_concept_patrician_rating_short: "评分"
 game_concept_patrician_rating_desc: "[patrician_family|E]拥有一项$game_concept_patrician_rating$，代表该家族及其[patrician|E]在[republics|E]中的不可或缺程度与影响力。\n\n高评分将为贵人及其[house|E]带来加成，分布在三个不同等级中。每级都会解锁额外增益，例如：\n$BULLET_WITH_TAB$加强[house_ambition|E]\n$BULLET_WITH_TAB$提高[interactions|E]接受度\n$BULLET_WITH_TAB$提高[governor_salary|E]\n\n有许多方式可以提高评分，关键因素包括：\n$BULLET_WITH_TAB$[patrician_possessive|E]的[trade|E]收入\n$BULLET_WITH_TAB$统治[republics|E]\n$BULLET_WITH_TAB$在[assembly|E]和[liege_possessive|E][council|E]中获得席位[AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$[house|E]成员持有[clerical_region|E]\n$BULLET_WITH_TAB$拥有[GetModifier('favored_by_pope_modifier').GetNameWithTooltip][modifier|E]"
 game_concept_patrician_rating_penalties_PAM: "如果贵人被[excommunicated|E]、是已知的[criminals|E]或拥有[GetModifier('scorned_pope_modifier').GetNameWithTooltip]，评分会降低。"
 game_concept_patrician_rating_penalties_NO_PAM: "如果贵人被[excommunicated|E]或是已知的[criminals|E]，评分会降低。"
 game_concept_consortery: "商行"
 game_concept_consorteries: "商行"
 game_concept_consortery_possessive: "商行"
 game_concept_consortery_desc: "$game_concept_consortery$是[patrician_family|E]的宅邸与[domicile|E]，通常位于其[liege_possessive|E]的[capital|E]。\n\n与[merchant_possessive|E]的[trade_companies|E]类似，$game_concept_consortery$使用[company_buildings|E]作为[domicile_buildings|E]，以提升家族在贸易中的实力与竞争力。\n\n它随[patrician_family|E]头衔一同继承。"
 game_concept_assembly: "议会"
 game_concept_assembly_possessive: "议会"
 game_concept_assembly_desc: "议会是[realm|E]的统治机构。\n\n议会的职责由[laws|E]决定，可能包括对法律和[republic_decrees|E]进行投票与批准，或在某些形式的选举[succession|E]（例如[GetLaw('republican_elective_succession_law').GetName]）中对候选人进行投票。"
 game_concept_republic_senate: "元老院"
 game_concept_republic_senate_possessive: "元老院"
 game_concept_voting_session: "表决会议"
 game_concept_voting_sessions: "表决会议"
 game_concept_voting_session_desc: "$game_concept_voting_session$是[assembly|E]就拟议的[law|E]或[republic_decree|E]作出决定的过程。\n\n在会议进行期间，成员根据其认可度对提案投赞成票或反对票。如果在会议结束前有足够多的成员赞成，提案即获通过并生效。\n\n可以通过[councillor_task|E]和某些[perks|E]在会议前提高认可度，也可以花费[hook|E]强迫某位成员按你的意愿投票。"
 game_concept_republic_decree: "共和国法令"
 game_concept_republic_decrees: "共和国法令"
 game_concept_republic_decree_short: "法令"
 game_concept_republic_decrees_short: "法令"
 game_concept_republic_decree_desc: "$game_concept_republic_decree$是[republic|E]的一类[decision|E]，须经[assembly|E]批准方可生效。\n\n虽然$game_concept_republic_decrees_short$有若干类型，但大多数主要影响[patricians|E]、[realm_capital|E]或整个共和国。"
 game_concept_house_ambition: "家族野心"
 game_concept_house_ambitions: "家族野心"
 game_concept_house_ambition_desc: "每个[republics|E]内的[house|E]都有自己的野心，表明该家族成员希望如何影响共和国。"
 game_concept_republic_administration: "共和国行政"
 game_concept_republic_administration_short: "行政"
 game_concept_republic_administrations: "共和国行政"
 game_concept_republic_administration_desc: "所有[republics|E]都有一项指定的共和国行政，决定了共和国的专长。\n\n只有共和国的[ruler|E]才能更改行政。\n\n有多种行政可供选择，每种行政都有各自独特的增益。\n\n#help 最常见的行政有[GetLaw( 'republic_type_communal' ).GetName]、[GetLaw( 'republic_type_maritime' ).GetName]和[GetLaw( 'republic_type_civic' ).GetName]。#!"
 game_concept_republic_senator: "元老"
 game_concept_republic_senators: "元老"
 game_concept_republic_senator_desc: "$game_concept_republic_senator$是[GetLaw( 'republic_assembly_composition_roman_senate' ).GetName]法律下受任命的[assembly|E]成员。\n\n元老由[republic_possessive|E][ruler|E]或监察官任命。\n\n同时能任命的$game_concept_republic_senators$数量存在上限，具体人数由元老院规模[law|E]决定。"
 game_concept_mercenary_limit: "雇佣兵上限"
 game_concept_mercenary_limit_desc: "雇佣兵上限决定了[character|E]同时可以雇佣多少[mercenaries|E]。\n\n雇佣兵上限由以下因素决定：\n$BULLET_WITH_TAB$[martial_i][martial|E][skill|E]\n$BULLET_WITH_TAB$[title_tier_i][title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
 # No tooltip versions
 tributary_default_no_tooltip: "朝贡者"
 tributary_default_no_tooltip_plural: "朝贡者"
 merchant_tributary_client_no_tooltip: "受庇护者"
 merchant_tributary_client_no_tooltip_plural: "受庇护者"
 suzerain_default_no_tooltip: "宗主"
 suzerain_default_no_tooltip_plural: "宗主"
 merchant_tributary_patron_no_tooltip: "庇护者"
 merchant_tributary_patron_no_tooltip_plural: "庇护者"
 # Lowercase versions
 tributary_default_no_tooltip_lowercase: "朝贡者"
 tributary_default_no_tooltip_lowercase_plural: "朝贡者"
 tributary_default_no_tooltip_lowercase_plural_possessive: "朝贡者"
 merchant_tributary_client_no_tooltip_lowercase: "受庇护者"
 merchant_tributary_client_no_tooltip_lowercase_plural: "受庇护者"
 merchant_tributary_client_no_tooltip_lowercase_plural_possessive: "受庇护者"
 suzerain_default_no_tooltip_lowercase: "宗主"
 suzerain_default_no_tooltip_lowercase_plural: "宗主"
 suzerain_default_no_tooltip_lowercase_plural_possessive: "宗主"
 merchant_tributary_patron_no_tooltip_lowercase: "庇护者"
 merchant_tributary_patron_no_tooltip_lowercase_plural: "庇护者"
 merchant_tributary_patron_no_tooltip_lowercase_plural_possessive: "庇护者"
 # Game Concept Versions
 merchant_tributary_patron: "[merchant_patron|E]"
 merchant_tributary_patron_plural: "[merchant_patrons|E]"
 merchant_tributary_client: "[client|E]"
 merchant_tributary_client_plural: "[clients|E]"
 tributary_default: "[tributary|E]"
 tributary_default_plural: "[tributaries|E]"
 suzerain_default: "[suzerain|E]"
 suzerain_default_plural: "[suzerains|E]"
 game_concept_merchant_charter: "商人特许状"
 game_concept_merchant_charters: "商人特许状"
 game_concept_charter: "特许状"
 game_concept_charters: "特许状"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "$game_concept_charter$是[merchant_patron|E]发给[clients|E]的文件[artifact|E]。\n\n持有带有其$game_concept_merchant_patron$印章的$game_concept_charter$$game_concept_artifacts$的$game_concept_merchants$可以使用：\n$EFFECT_LIST_BULLET$#EMP #V $abuse_charter_authority_decision$#!#![decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $benevolent_charter_authority_decision$#!#![decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $leverage_charter_authority_interaction$#!#![interaction|E]"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "$game_concept_make_a_request$是一种用于向[merchant_patron|E]请求帮助、赞助或其他支持的[interaction|E]。"
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "$game_concept_request_contract_change$是[vassal|E]、[tributary|E]或[client|E]用来与其[liege|E]或[suzerain|E]重新协商义务的[interaction|E]。"
 game_concept_leading_title: "领袖头衔"
 game_concept_leading_title_desc: "领导[trade_league|E]等联盟的[title|E]。\n\n领袖头衔的[holder|E]即是联盟的[trade_league_leader|E]。"
 game_concept_client_contract: "受庇护者契约"
 game_concept_client_contracts: "受庇护者契约"
 game_concept_client_contract_desc: "$game_concept_client_contracts$规定了[client|E]与[merchant_patron|E]之间的[obligations|E]。\n\n可以协商四项义务：支付给庇护者的[trade|E]收入分成、庇护者提供的[prestige|E]支持、对[trade_competitiveness|E]的扶持以及代表商人家族促成[marriages|E]。\n\n契约在继承时延续，除非商人将其[company|E]迁移至新的[holding|E]，否则不可解除。"
 game_concept_member_title: "成员头衔"
 game_concept_member_title_desc: "作为基于头衔的联盟（例如[trade_league|E]）成员的一个[title|E]。"
 game_concept_company_sentiment: "商会方向"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "方向"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "$game_concept_company_sentiment$代表[merchant_family_possessive|E]的行事风格，以及其成员间的态度。\n\n存在多个[company_sentiment_levels|E]，每个都会对[house|E]成员施加不同的增益与惩罚。\n\n$game_concept_company_sentiment$会根据$game_concept_company$整体的行动而变化。[company_sentiment_positive_actions|E]通常会将$game_concept_sentiment$推向[company_sentiment_concerted_i][company_sentiment_concerted|E]，而[company_sentiment_negative_actions|E]会推向[company_sentiment_divided_i][company_sentiment_divided|E]。\n\n与普通成员相比，[house_heads|E]通常对其家族的$game_concept_sentiment$拥有更大的影响力。"
 game_concept_company_sentiment_level: "商会方向姿态"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "商会方向姿态"
 game_concept_company_sentiment_level_desc: "$game_concept_company_sentiment_level$是[company_sentiment|E]的当前状态。随着$game_concept_sentiment$通过[company_sentiment_positive_actions|E]被推向[company_sentiment_concerted_i][company_sentiment_concerted|E]，或通过[company_sentiment_negative_actions|E]被推向[company_sentiment_divided_i][company_sentiment_divided|E]，当前立场会发生变化，而每种立场都会为[house|E]成员提供各种增益和惩罚。\n\n共有五种不同立场：\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i][company_sentiment_divided|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i][company_sentiment_fractious|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i][company_sentiment_independent|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i][company_sentiment_cooperative|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i][company_sentiment_concerted|E]"
 game_concept_company_sentiment_divided: "贪婪"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "投机"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "平衡"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "进取"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "崇高"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"
 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"
 game_concept_company_sentiment_divided_desc: "$game_concept_company_sentiment_divided$[company_sentiment_level|E]是最具竞争性的立场。当一家[company|E]采取这一立场时，家族中的每个成员都将利润置于一切之上，哪怕这意味着彼此踩踏。\n\n#bold 该$game_concept_company_sentiment_level$的效果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#N ‑20#!\n$EFFECT_LIST_BULLET$[merchant_patron|E]好感：#P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]：#P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$#EMP #V $unity_regional_networks_decision$#!#![decision|E]"
 game_concept_company_sentiment_fractious_desc: "$game_concept_company_sentiment_fractious$ [company_sentiment_level|E]是一种高度竞争性的立场，仅次于[rapacious|E]。当一家[company|E]采取这一立场时，成员将个人利益置于家族责任之上。\n\n#bold 该[company_sentiment_level|E]的效果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#N ‑10#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]：#P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$#EMP #V $unity_establish_network_decision$#!#![decision|E]"
 game_concept_company_sentiment_independent_desc: "$game_concept_company_sentiment_independent$[company_sentiment_level|E]是中间立场。当一家[company|E]采取这一立场时，家族仍需要一个名义上的领袖，但成员可以自由处理自己的事务，不受干涉或评判。\n\n#bold 该[company_sentiment_level|E]的效果：#!\n$EFFECT_LIST_BULLET$#EMP #V $unity_consult_house_decision$#!#![decision|E]"
 game_concept_company_sentiment_cooperative_desc: "$game_concept_company_sentiment_cooperative$[company_sentiment_level|E]是一种高度注重合法性的立场，仅次于[ennobled|E]。当一家[company|E]采取这一立场时，商会的声誉与其成员的声誉合为一体，每位成员都必须努力改善自身形象，并提升社会地位。\n\n#bold 此[company_sentiment_level|E]的效果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$：#P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$：#P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#![decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#![decision|E]"
 game_concept_company_sentiment_concerted_desc: "$game_concept_company_sentiment_concerted$[company_sentiment_level|E]是最注重合法性的立场。当一家[company|E]采取这一立场时，由责任与尊重而生的忠诚将整体的利益与首领的利益紧紧相连，商会便可与贵族家族平起平坐。\n\n#bold 此[company_sentiment_level|E]的效果：#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$：#P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$：#P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$#EMP #V $unity_family_business_decision$#!#![decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#![decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#![decision|E]"
 game_concept_company_sentiment_positive_actions: "正当行动"
 game_concept_company_sentiment_positive_actions_desc: "[company|E]的正当行动会将[company_sentiment|E]推向[company_sentiment_concerted_i][company_sentiment_concerted|E]。\n\n[house_heads|E]可以使用#V $unity_merchant_promote_excess_decision$#![decision|E]，大幅将[company_sentiment|E]推向[company_sentiment_concerted_i][company_sentiment_concerted|E]。\n\n#weak $game_concept_company_sentiment_positive_actions$的一些示例：$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "利润驱动行动"
 game_concept_company_sentiment_negative_actions_desc: "[company|E]的利润驱动行为会将[company_sentiment|E]推向[company_sentiment_divided_i][company_sentiment_divided|E]。\n\n[house_heads|E]可以使用#V $unity_merchant_promote_diligence_decision$#![decision|E]，大幅将[company_sentiment|E]推向[company_sentiment_divided_i][company_sentiment_divided|E]。\n\n#weak $game_concept_company_sentiment_negative_actions$的一些示例：$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$在家族和贵族间$arrange_marriage_interaction$\n$EFFECT_LIST_BULLET$$gift_artifact_interaction$\n$EFFECT_LIST_BULLET$完成伙计要求\n$EFFECT_LIST_BULLET$$pay_ransom_interaction$\n$EFFECT_LIST_BULLET$$offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$$restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$$abandon_hook_interaction$\n$EFFECT_LIST_BULLET$$fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$$propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$与另一商人家族$arrange_marriage_interaction$\n$EFFECT_LIST_BULLET$邀请至商会\n$EFFECT_LIST_BULLET$未能满足伙计要求\n$EFFECT_LIST_BULLET$$merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$$declare_war_interaction$\n$EFFECT_LIST_BULLET$$imprison_interaction$\n$EFFECT_LIST_BULLET$$move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$$disinherit_interaction$\n$EFFECT_LIST_BULLET$$denounce_interaction$\n$EFFECT_LIST_BULLET$$expose_secret_interaction$\n$EFFECT_LIST_BULLET$$blackmail_interaction$\n$EFFECT_LIST_BULLET$$break_betrothal_interaction$"
 game_concept_republican_army: "共和国军队"
 game_concept_republican_armies: "共和国军队"
 game_concept_republican_army_desc: "$game_concept_republican_army$是由[republican|E][government|E]的[realm|E]招募并维护的[army|E]。\n\n它们完全由[title_men_at_arms|E]组成，并由[liege|E]控制。"
 REPUBLICAN_ARMY_CONCEPT: "[republican_army|E]"
 REPUBLICAN_ARMY_CONCEPT_NO_TOOLTIP: "$game_concept_republican_army$"
 REPUBLICAN_ARMIES_CONCEPT: "[republican_armies|E]"
 REPUBLICAN_ARMIES_CONCEPT_NO_TOOLTIP: "$game_concept_republican_armies$"
