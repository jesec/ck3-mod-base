l_simp_chinese:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "民怨沸腾"
 republic_popular_opinion_event.1001.desc: "这些日子，在街上被认出是贵人可不是什么好事。\n\n看到我四处游移的目光和忧虑的神情，[relation_01.GetName]高声说道：\n\n“该死，[ROOT.Char.GetFullName]。[event_location_01.GetName]的贵人不会把自己关起来。他们像骄傲的公民一样走在街上！”\n\n[relation_01.GetSheHe|U]说得对，但近来城中气氛紧张；不满在表面下沸腾。抗议和斗殴困扰着这座城市，而天黑之后会发生什么，我简直不敢想象。"
 republic_popular_opinion_event.1001.a: "“你说得对，我们得昂首挺胸。”"
 republic_popular_opinion_event.1001.b: "“也许是时候给自己找个贴身侍卫了。”"
 republic_popular_opinion_event.1001.c: "“暴民会把我们全杀了的！”"
 republic_popular_opinion_event.1001.d: "“他们不会觉得我是好欺负的。”"
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "不满的季节"
 republic_popular_opinion_event.1002.desc_1: "站在我的窗前，我能听到愤怒的声音回荡；[event_location_01.GetName]正因不满而沸腾。工人们威胁要放下工具，或上街游行。政府的标志在夜色掩护下被砸毁或涂污。\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "无论我转向何处，迎接我的都是阴郁的面孔、阻挠和低声的咒骂。"
 republic_popular_opinion_event.1002.desc_control_firm: "民众所能做的，只剩下象征性的反抗举动；政府对任何非法集会的最细微迹象，都施以残酷而高效的镇压。"
 republic_popular_opinion_event.1002.desc_control_strained: "感谢[ROOT.Char.GetFaith.HighGodName]，骚乱的爆发已被城市卫队遏制。头目们每天都被逮捕，戴上足枷。那些意图趁乱行事的人遭到追捕和揭露。秩序暂时得以维持。"
 republic_popular_opinion_event.1002.desc_control_slipping: "尽管城市卫队努力维持秩序，煽动者仍能钻空子，暴力在街头肆虐。人群聚集起来，而且并非所有都能被及时驱散。夜晚落入帮派和恶棍手中。"
 republic_popular_opinion_event.1002.desc_control_broken: "政府已失去对街道的控制。城市卫队龟缩在营房里，暴民甚至在宫殿的台阶上袭扰贵人！有关外国间谍与破坏分子的谣言满天飞。"
 republic_popular_opinion_event.1002.a: "我支持政府！"
 republic_popular_opinion_event.1002.b: "我支持人民。"
 republic_popular_opinion_event.1002.c: "最好把头低下。"
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "节日气氛"
 republic_popular_opinion_event.1003.desc: "在[event_location_01.GetTitle.GetNamePossessive]市场的熙熙攘攘中，我与一位名叫[craftsman_character.GetName]的市民攀谈起来，[craftsman_character.GetHerHis]关于自己那头驴子的笑话让我笑得直不起腰。\n\n近来，我感觉整座城市就像一个大家庭；尽管生活艰辛，但和陌生人交谈变得更容易，人人心情都很好。驴子欢快地嘶鸣着，用头蹭了蹭我。\n\n“议会干得不错，是吧？”[craftsman_character.GetFirstNameNoTooltip]说着，挠了挠[craftsman_character.GetHerHis]驴子的耳后。“你为什么不庆祝一下——办一场宴会？各行会肯定会出钱出力，好留下个好印象，也表达下他们的感激。”"
 republic_popular_opinion_event.1003.a: "“绝妙的主意！”"
 republic_popular_opinion_event.1003.b: "“你说的，免费的金币？”"
 republic_popular_opinion_event.1003.c: "“我宁愿了解你。”"
 republic_popular_opinion_event.1003.tt: "你的下一次[feast|E][activity|E]#P 免费#!。"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "雄心壮志"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName]和我正在我家附近的一处广场上享用一些[ROOT.Char.Custom('RegionalDrink')]——懒洋洋地看着市民们为生计奔忙、忙碌不休。[relation_01.GetName]喝了一口[relation_01.GetHerHis]的饮品后，满足地叹了口气。\n\n“我跟你说，[ROOT.Char.GetFullName]：该趁热打铁了。要我说，就该大胆进取！城里如今气氛这么好，让人觉得万事皆有可能。”[relation_01.GetSheHe|U]举起[relation_01.GetHerHis]的杯子，扬起笑容。“敬新的机会和滚滚财源！”\n\n我也回以微笑，举起酒杯。"
 republic_popular_opinion_event.1004.a: "“敬远方的冒险！”"
 republic_popular_opinion_event.1004.b: "“敬新的爱情与浪漫！”"
 republic_popular_opinion_event.1004.c: "“敬名望与荣耀！”"
 republic_popular_opinion_event.1004.d: "“敬亲族与朋友！”"
