l_simp_chinese:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]：推进优势"
 gdp_merchant_scheme_advantage.1000.intro: "思考着如何加快我们在[task_contract_location.GetBaronyNameExplicitly]的工作进度，我望向"
 gdp_merchant_scheme_advantage.1000.intro.rival: "我们的对手，[rival.GetTitledFirstNamePossessive]的存在阻碍了我们。"
 gdp_merchant_scheme_advantage.1000.intro.partner: "我的合伙人[portrait.GetTitledFirstName]，寻找解决方案。"
 gdp_merchant_scheme_advantage.1000.intro.agent: "我的伙计[portrait.GetTitledFirstName]，寻找解决方案。"
 gdp_merchant_scheme_advantage.1000.intro.trader: "我的贸易负责人[portrait.GetTitledFirstName]，寻找解决方案。"
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\n要是[portrait.GetTitledFirstNameNoTooltip]能认真起来，把全部心思都放在这件事上，我们肯定能很快了结此事……"
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\n只要大家能齐心协力，再加把劲，这件事肯定很快就能解决……"
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\n或许，为了商会着想，我该卷起袖子踏踏实实干点事，这样才能腾出手来处理其他事务……"
 gdp_merchant_scheme_advantage.1000.a: "“我付你薪水是干什么用的，[portrait.GetTitledFirstNameNoTooltip]？！”"
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E][portrait.GetTitledFirstNameNoTooltip]身负重担"
 gdp_merchant_scheme_advantage.1000.b: "“整个商会都得加把劲行动起来！”"
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E][company|E]承受重担"
 gdp_merchant_scheme_advantage.1000.c: "“好吧，看来只能我亲自出马了！”"
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E]你承受重担"
 gdp_merchant_scheme_advantage.1000.d.associate: "“加油[portrait.GetFirstNameNoTooltip]，你能人多劳。”"
 gdp_merchant_scheme_advantage.1000.d.unity: "“这个商会里全是懒鬼！”"
 gdp_merchant_scheme_advantage.1000.d.stress: "“看来我得再加把劲了……”"
 gdp_merchant_scheme_advantage.1000.e: "“唉，算了……”"
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName]和我每天坐在一起，讨论如何才能更好地推进我们的目标。我的贸易负责人一次又一次地提到我们在[task_contract_location.GetBaronyNameExplicitly]缺乏可靠的人力。\n\n“你知道，”[trader.GetFirstNameNoTooltip]叹了口气，“有个[recruit.GetWomanMan]或许能帮到我们。"
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetHerHis]名叫[recruit.GetFirstName]，是[recruit_liege.GetPrimaryTitle.GetDefinitiveName|l][recruit_liege.GetTitledFirstName]的一名仆人……“"
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetHerHis]名叫[recruit.GetFirstName]，是一名活跃于当地市场的密探与掮客……”"
 gdp_merchant_scheme_advantage.1010.a: "“我去和[recruit.GetHerHim]谈谈……”"
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon!你依靠魅力"
 gdp_merchant_scheme_advantage.1010.b: "“无论付出何种代价，都要把这个[recruit.GetWomanMan]招进来。”"
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon!你依靠金钱"
 gdp_merchant_scheme_advantage.1010.e: "“哼，[recruit.GetSheHe]不值得我这么费心。”"
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName]和我每天坐在一起，讨论如何让我们的目标更近一步。最终我的贸易负责人提到了[charter.GetName]的事，说可以用它来打开目前在[task_contract_location.GetBaronyNameExplicitly]对我们关着的那些门路。\n\n“说到底，”[trader.GetFirstNameNoTooltip]笑着说，“为什么不把[patron.GetTitledFirstNamePossessive]的文书拿来好好用用呢？”"
 gdp_merchant_scheme_advantage.1020.a: "“是的，我确信我们得到了[patron.GetTitleAsNamePossessiveNoTooltip]的支持！”"
 gdp_merchant_scheme_advantage.1020.b: "“我们的特许状本身便足以说明一切。”"
 gdp_merchant_scheme_advantage.1020.e: "“现在还不是时候……”"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "优势推进：潜力"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "试图加速该计谋的举动反而阻碍了其进展。"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "优势推进：增长"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "优势推进：阶段"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "优势推进：竞争力"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "加快计谋的尝试阻碍了贸易努力。"
 gdp_merchant_scheme_advantage_outcome: "推进优势"
 gdp_merchant_scheme_advantage.desc: "推进了[opportunity|E][scheme|E][opportunities|E]"
 gdp_merchant_scheme_advantage_add_1_opportunity_tt: "[scheme|E]获得#P +1#![scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 gdp_merchant_scheme_advantage_add_2_opportunities_tt: "[scheme|E]获得#P +2#![scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 gdp_merchant_scheme_advantage_subtract_opportunity_tt: "[scheme|E]失去#N -1#![scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 house_relation_reason_scheme_push_for_advantage_desc: "[char.GetShortUINameNotMe|U]针对[target_char.GetShortUINameNotMe]推进贸易优势"
