l_simp_chinese:
 gdp_merchant_activity_events.0001.t: "食欲难平"
 gdp_merchant_activity_events.0001.desc: "随着宴会进行，我听到那些又饿又越来越不耐烦的客人在抱怨。盘子里只剩下些碎屑，也没有仆人赶着来添菜。\n\n[guest.GetTitledFirstName][guest.Custom('quirk_neg_present')]，空杯子放在[guest.GetHerHis]手边，问道：“在这该死的宴会上，要怎么样才能弄到杯酒喝？”"
 gdp_merchant_activity_events.0001.host: "\n\n也许这是个让我来活跃一下气氛的机会？"
 gdp_merchant_activity_events.0001.guest: "\n\n也许这是个让我来帮助[host.GetTitledFirstNamePossessive]活跃一下气氛的机会？"
 gdp_merchant_activity_events.0001.a: "“快，招呼[host.GetTitledFirstNamePossessiveNoTooltip]的厨房动起来，不必节省费用！”"
 gdp_merchant_activity_events.0001.a.host: "“很好，我这就让厨房#EMP 真正#!动起来！”"
 gdp_merchant_activity_events.0001.b: "看起来我处于有利的谈判位置。"
 gdp_merchant_activity_events.0001.c: "“你应该多感激，[guest.GetTitledFirstNameNoTooltip]！”"
 gdp_merchant_activity_events.0001.d: "“不喜欢就滚！”"
 gdp_merchant_activity_events.0001.e: "“商会仓库里有的是。”"
 gdp_merchant_activity_events.0005.t: "异域请求"
 gdp_merchant_activity_events.0005.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))][admirer.GetTitledFirstName]招手让我加入[admirer.GetHerHis][guest.GetTitledFirstName]的谈话。\n\n[admirer.GetFirstNameNoTooltip]微笑着，眼中带着"
 gdp_merchant_activity_events.0005.desc_esteemed: "温暖"
 gdp_merchant_activity_events.0005.desc_fallback: "欢乐"
 gdp_merchant_activity_events.0005.desc_outro: "说道：“我刚才正跟我的[admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))]说你在国外的[luxury_artifact.Custom('GetLuxuryArtifactSentiment')]的发现呢。来，告诉我们你是怎么弄到那[luxury_artifact.GetName]的！”\n\n我清楚，这位[admirer.Custom('NoblewomanNobleman')]是想让我插科打诨，给这二位取乐。"
 gdp_merchant_activity_events.0005.a: "“这不是什么了不起的事情……”"
 gdp_merchant_activity_events.0005.b: "“为了那东西我可是冒了生命危险！”"
 gdp_merchant_activity_events.0005.b.success: "你的润色听起来很真实"
 gdp_merchant_activity_events.0005.b.failure: "你被人揭穿了谎言"
 gdp_merchant_activity_events.0005.c: "“听好了，仔细听着！”"
 gdp_merchant_activity_events.0005.d: "“与我在[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]交易的奢侈品相比，这不值一提。”"
 gdp_merchant_activity_events.0010.t: "馈赠之礼"
 gdp_merchant_activity_events.0010.desc: "我的商人同伴[merchant.GetTitledFirstName]一到，就开始炫耀[merchant.GetHerHis]的财富。[merchant.GetSheHe|U]把玩[merchant.GetHerHis]的昂贵珠宝，展示[merchant.GetHerHis]精致的[merchant.Custom('RegionalFabric')]长袍，并厚着脸皮推销[merchant.GetSheHe]在[merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip]兜售的几[good.Custom('GetTradeGoodUnitPlural')][good.Custom('GetTradeGood')]。\n\n我撞见[merchant.GetHerHim]正向我的[ROOT.Char.Custom2('RelationToMeShort', receiver)][receiver.GetTitledFirstName]送礼，周围围着一群看呆了的旁观者。"
 gdp_merchant_activity_events.0010.a: "来这一套是吧……"
 gdp_merchant_activity_events.0010.b: "“礼物真体贴啊，[merchant.GetTitledFirstNameNoTooltip]！”"
 gdp_merchant_activity_events.0010.b.success: "你让[merchant.GetFirstNameNoTooltip]当众出丑"
 gdp_merchant_activity_events.0010.b.failure: "你看着像个蠢货"
 gdp_merchant_activity_events.0010.c: "随便了。"
 gdp_merchant_activity_events.0010.d: "“在尊长面前自夸很失礼啊。”"
 gdp_merchant_activity_events.0015.t: "农民的命运"
 gdp_merchant_activity_events.0015.desc: "宴会上的好酒、充足的食物和壁炉舒适的温暖，与外面夜晚的寒冷形成鲜明对比。\n\n我刚离开宴席想透口气，就看到一群穷困的人：几个平民靠在墙边，等着宴会结束后捡些残羹剩饭。"
 gdp_merchant_activity_events.0015.a: "让他们尽情吃喝，欢快作乐，我请客！"
 gdp_merchant_activity_events.0015.b: "我更愿意和贵族们一起喝点[ROOT.Char.Custom('RegionalDrink')]。"
 gdp_merchant_activity_events.0015.b.alcohol: "我宁愿与贵族们一起喝[ROOT.Char.Custom('RegionalAlcoholicDrink')]。"
 gdp_merchant_activity_events.0015.c: "这里才是我#EMP 真正#!该待的地方。"
 gdp_merchant_activity_events.0015.d: "滚开，卑贱的渣滓！"
 custom.every_attending_noble: "所有出席[noble|E][character|E]"
 gdp_merchant_activity_events.0020.t: "旁观者的眼睛"
 gdp_merchant_activity_events.0020.desc: "有消息传到我这里，我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))][other.GetTitledFirstName]为这个场合佩戴了最精致的[fake_artifact.GetNameNoTooltip]。\n\n我在大厅里找到了这个[other.GetWomanMan]，[other.GetHerHis]穿着华服，项链搭在[other.GetHerHis]胸前，看上去光彩照人。我走过去时，[other.GetSheHe|U][other.Custom('quirk_pos_present')]，说道：“你看到我最新买的东西了吗？价格可不便宜，你说是不是？”\n\n大厅里无数蜡烛的暖光让那颗宝石看上去很漂亮，但凭我训练有素的眼睛，还是忍不住注意到它的许多瑕疵。"
 gdp_merchant_activity_events.0020.a: "“笑死！[other.GetFirstNameNoTooltip]居然觉得这破玩意儿值钱。”"
 gdp_merchant_activity_events.0020.b: "#weak *窃窃私语*#!“我来给你处理掉这个有缺陷的小玩意儿。”"
 gdp_merchant_activity_events.0020.b.tt: "你获得一件[attraction|E][opinion|E][artifact|E]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "从[other.GetTitledFirstName]处获得了[fake_artifact.GetName]。"
 gdp_merchant_activity_events.0020.c: "“确实是一件真正的珍宝。”"
 fake_artifact_name: "宝石项链"
 fake_artifact_desc: "一条漂亮的项链，亮闪闪的，不过仔细一看，就能发现那些宝石切得有多粗糙。"
 gdp_merchant_activity_events.0025.t: "熟走的路"
 gdp_merchant_activity_events.0025.desc: "在大厅的欢声笑语中，我听到一个意想不到的声音——"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP 呜喔！呜喔！#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP 啾啾啾！#!"
 gdp_merchant_activity_events.0025.desc_cont: "——有人带了一只[luxury_artifact.Custom('GetDomicileArtifactCreatureType')]来宴会上？\n\n扫视人群时，我看到了那头动物的主人，一个商人同行[merchant.GetTitledFirstName]。[merchant.GetSheHe|U]注意到我好奇的目光，[merchant.Custom('quirk_pos_present')]，说道：“这是我在某次旅途中弄到的好货色。有一个很不错的集市，我经常去。商业机密。”[merchant.GetSheHe|U]带着得意的假笑，用手指点了点自己的鼻子。"
 gdp_merchant_activity_events.0025.a: "“哦，我想我知道这个地方！”"
 gdp_merchant_activity_events.0025.b: "“你能告诉我它的位置吗？”"
 gdp_merchant_activity_events.0025.b.success: "你提出了有说服力的论点"
 gdp_merchant_activity_events.0025.b.failure: "你没能提出令人信服的论点"
 gdp_merchant_activity_events.0025.c: "“再给我讲讲你的旅行经历！”"
 gdp_merchant_activity_events.0025.tt.menagerie: "生成一份#V $menagerie_acquisition_contract$#![luxury_contract_i][luxury_contract|E]"
 gdp_merchant_activity_events.0025.tt.curio: "生成一份#V $find_curio_contract$#![luxury_contract_i][luxury_contract|E]"
