l_simp_chinese:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]：曾失去的东西"
 gdp_guelph_ghibelline_scheme.1000.desc: "我正身处[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]的年度集市，欢乐与友善的气氛无处不在。\n\n喧闹的庆祝声、色彩鲜艳的布饰以及[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip]美食的香气弥漫在街巷中——让我疲惫的感官为之一振。\n\n巧合的是，我遇到了正兴致勃勃地看附近货摊上的东西的[target.GetTitledFirstName]，这是一个施展我魅力的机会。"
 gdp_guelph_ghibelline_scheme.1000.a: "“你知道吗，#EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]#!曾想过禁止这些庆祝活动。”"
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "你成功论证了[ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]的恶意"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName]没搭理你"
 gdp_guelph_ghibelline_scheme.1000.b: "“这枚胸针和你简直绝配，朋友！”"
 gdp_guelph_ghibelline_scheme.1000.c: "我没必要介入。"
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]：谣言四起……"
 gdp_guelph_ghibelline_scheme.1010.desc: "我的线人带来消息，说我们#EMP 尊贵的#![ROOT.Char.Custom('GetGuelphGhibelline')]领袖[target.GetTitledFirstName]近来举动有些力不从心，据说是被眼下的职责压得喘不过气。\n\n只要给我们的支持者送去几封恰到好处的信，就能坐实这种印象，并暗示有更#EMP 配得上#!承担这一重担的人。"
 gdp_guelph_ghibelline_scheme.1010.a: "立即起草信件。"
 gdp_guelph_ghibelline_scheme.1010.a.tt: "成功率受你的@gg_involvement_icon![gg_involvement|E]（#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!）修正"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "你的信让许多[ROOT.Char.Custom('GetGuelphsGhibellines')]相信你的领导力更为卓越"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "你的信件起到了反作用"
 gdp_guelph_ghibelline_scheme.1010.b: "[ROOT.Char.GetHouse.GetName]家族的任何成员都能成为伟大的领袖！"
 gdp_guelph_ghibelline_scheme.1010.c: "这种事谁说得准呢？"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]：巧舌如簧"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "看来我的同谋[court_agent.GetTitledFirstName]，已经吸引到了[target.GetTitledFirstNamePossessive]宫廷中一群心怀不满的廷臣和异见者的注意。"
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "看起来我的同谋，[court_agent.GetTitledFirstName]，已经在对[target.GetTitledFirstNamePossessive]领导不满的[target.Custom('GetGuelphsGhibellines')]中找到了共鸣者。"
 gdp_guelph_ghibelline_scheme.1020.intro: "看来我的同谋[court_agent.GetTitledFirstName]，已经赢得了[target.GetTitledFirstName]的信任。"
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\n我该给[court_agent.GetTitledFirstNameNoTooltip]回信了，已经拖了太久。"
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "我们是否该与这些当地煽动者接触，以推进我们的计划？"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "我要让[court_agent.GetHerHim]煽动他们对[target.GetFirstNameNoTooltip]的疑虑吗？"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "我要不要借此机会，让[court_agent.GetHerHim]在[target.GetTitleAsNameNoTooltip]面前为[ROOT.Char.Custom('GetGuelphsGhibellines')]发声？"
 gdp_guelph_ghibelline_scheme.1020.a: "利用我的影响力。"
 gdp_guelph_ghibelline_scheme.1020.b: "让我们好好利用这些……恶棍。"
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip]应该尽心尽力。"
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName]成功拓展了你的计划"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName]不太令人信服"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U]应该专注于我的声誉。"
 gdp_guelph_ghibelline_scheme.1020.prestige: "威望受损"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "你的威望被败坏了。"
 gdp_guelph_ghibelline_scheme.1020.piety: "虔诚受损"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "你的虔诚被败坏了。"
 gdp_guelph_ghibelline_scheme.1020.e: "我的虔诚不言自明！"
 gdp_guelph_ghibelline_scheme.1020.f: "我不该插手。"
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]：助推"
 gdp_guelph_ghibelline_scheme.1030.desc: "一天早晨，我正在四处巡视时，一位长期服侍我的随从匆匆赶来：\n\n“[ROOT.Char.GetTitleAsNameNoTooltip]，我们在[target.GetTitledFirstNamePossessive]宫廷中的线人回报说，那位[target.GetTitleAsNameNoTooltip]的[ROOT.Char.Custom('DescribeTargetSkill')]简直可笑至极。\n\n也许我们能在某方面加以利用……？”"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "我的[ROOT.Char.Custom2('RelationToMe', sly_character )][sly_character.GetTitledFirstName]，在一个早晨我巡视时悄悄来到我身边：\n\n“在我们努力#EMP 拯救#![target.GetPrimaryTitle.GetDefinitiveName]脱离愚蠢的[target.Custom('GetGuelphsGhibellines')]的过程中——我们何不就那位[target.GetTitledFirstName]的[ROOT.Char.Custom('DescribeTargetSkill')]提出质疑呢？\n\n据我所知，[target.GetSheHe]在这方面似乎相当欠缺。”"
 gdp_guelph_ghibelline_scheme.1030.a: "“努力胜过流言。”"
 gdp_guelph_ghibelline_scheme.1030.a.tt: "成功率受你的@gg_involvement_icon![gg_involvement|E]（#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!）修正"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "你成功削弱了[target.GetShortUIName]"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "你的努力徒劳无功"
 gdp_guelph_ghibelline_scheme.1030.b: "“我们应该利用这一点削弱[target.GetHerHim]在[target.GetHerHis]宫廷中的威望。”"
 gdp_guelph_ghibelline_scheme.1030.c: "“让我们添柴加火。”"
 gdp_guelph_ghibelline_scheme.1030.d: "“我看不出有这么做的必要。”"
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1262.desc: "大获全胜！[target.GetTitledFirstName|U]终于认清形势，现在作为真正的[owner.Custom('GetGuelphGhibelline')]与我们站在一起。\n\n我就知道[target.GetSheHe]最终会回心转意。"
 scheme_critical_moments.1262.a: "太棒了！"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.1263.desc: "#EMP 总有一些人。#!让我们都感到沮丧的是，无论我多么努力地与[target.GetTitledFirstName]讲道理、辩论和劝说，[target.GetSheHe]始终坚称[target.Custom('GetGuelphsGhibellines')]的主张才是正确的。\n\n显然，这次我们并#EMP 未#!友好地分别。"
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')]#!！"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1272.desc: "该庆祝一番了！[owner.Custom('GetGuelphsGhibellines')]一个接一个撤回了对[target.GetTitledFirstName]的支持，转而向我寻求指引。\n\n[target.GetSheHe|U]别无选择，只能退位让贤。"
 scheme_critical_moments.1272.a: "太好了！"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.1273.desc: "尽管我付出了努力，[target.GetTitledFirstName]依然稳居[owner.Custom('GetGuelphsGhibellines')]之首，而我设法争取到的支持，也已枯萎消散。"
 scheme_critical_moments.1273.desc.secret: "\n\n至少[target.GetSheHe]仍对我的计划一无所知。"
 scheme_critical_moments.1273.desc.discovered: "\n\n更糟的是，[target.GetSheHe]知道是我在背后搞鬼，而且[target.GetSheHe]绝不会忘记这件事。"
 scheme_critical_moments.1273.a: "啧啧。"
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1282.desc: "大获全胜！[target.GetTitledFirstName|U]终于认清形势，现在作为真正的[owner.Custom('GetGuelphGhibelline')]与我们站在一起。\n\n我就知道[target.GetSheHe]最终会回心转意。"
 scheme_critical_moments.1282.a: "太棒了！"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.1283.desc: "#EMP 总有一些人。#!让我们都感到沮丧的是，无论我多么努力地与[target.GetTitledFirstName]讲道理、辩论和劝说，[target.GetSheHe]始终坚称[target.Custom('GetGuelphsGhibellines')]的主张才是正确的。\n\n显然，这次我们并#EMP 未#!友好地分别。"
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')]#!！"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]：成功"
 scheme_critical_moments.1292.desc.intro: "好消息——[target.GetTitledFirstName|U]将被温和得多的[target_character.GetTitledFirstName]取代！"
 scheme_critical_moments.1292.desc.intro.unknown: "好消息——[target.GetTitledFirstName|U]将被一位真正忠于事业的人取代！"
 scheme_critical_moments.1292.desc: "\n\n值得[ROOT.Char.Custom('GetGuelphsGhibellines')]骄傲的成就，现在我们大可放心，[target.GetPrimaryTitle.GetDefinitiveName]必将得到公正合理的治理。"
 scheme_critical_moments.1292.desc.discovered: "\n\n不过，我的参与并非无人察觉，因此今后我必须多加小心……"
 scheme_critical_moments.1292.a: "很好！"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]：失败"
 scheme_critical_moments.1293.desc: "再好的计划也难免……\n\n#EMP 下面有人搞砸了。#!我会查出来是谁，但眼下不得不承认[target.GetTitledFirstName]这次逃脱了我的掌控。我们只得暂时容忍一个妄自尊大的[target.Custom('GetGuelphGhibelline')]继续统治[target.GetPrimaryTitle.GetDefinitiveName]。"
 scheme_critical_moments.1293.a: "#EMP 该死#!！"
