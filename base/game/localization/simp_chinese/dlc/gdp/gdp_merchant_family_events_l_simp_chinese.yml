 gdp_merchant_family.9140.t: "市场饲料"
 gdp_merchant_family.9140.desc: "从[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]那些闷热的办公室里，我学习着[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]赖以发财——或者说试图发财——的贸易路线。要记住的地方和货物太多了。\n\n[associate.GetFirstName]用[associate.GetHerHis]的[ROOT.Char.Custom('WritingInstrument')]敲了敲桌子，把我从白日梦中惊醒。“来吧，[ROOT.Char.Custom('GirlBoy')]！你要是不学学我们的生意，将来怎么当[ROOT.Char.GetTitleAsNameNoTooltip]！”"
 gdp_merchant_family.9140.a: "“给我讲讲[category_1.Custom('GetTradeGoodCategory')]贸易。”"
 gdp_merchant_family.9140.a.tt: "成年时，[merchant.GetPrimaryTitle.GetDefinitiveName|l]会获得#V 450#![category_1.GetNameWithIcon][trade_expertise|E]"
 gdp_merchant_family.9140.b: "“经营[category_2.Custom('GetTradeGoodCategory')]让我着迷。”"
 gdp_merchant_family.9140.b.tt: "成年时，[merchant.GetPrimaryTitle.GetDefinitiveName|l]会获得#V 450#![category_2.GetNameWithIcon][trade_expertise|E]"
 gdp_merchant_family.9140.c: "“我想了解[category_3.Custom('GetTradeGoodCategory')]的流动。”"
 gdp_merchant_family.9140.c.tt: "成年时，[merchant.GetPrimaryTitle.GetDefinitiveName|l]会获得#V 450#![category_3.GetNameWithIcon][trade_expertise|E]"
 gdp_merchant_family.9150.t: "得力助手"
 gdp_merchant_family.9150.desc: "等候我成年的日子里，我大部分时间都跟随在商会合伙人[partner.GetFirstName]的随行人员中。我跟着[partner.GetHerHis]处理交易和会议，尽可能吸收知识。\n\n某天，在一番艰苦的账簿工作之后，[partner.GetSheHe|U]转向我。“你做得不错，年轻的[ROOT.Char.GetTitleAsNameNoTooltip]。”[partner.GetSheHe]咧嘴一笑，弹给我一枚硬币。“生意不容易，但与[ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')][ROOT.Char.GetSuzerain.GetTitleAsName]不同，单凭我们的钻营就能让我们维持下去。”"
 gdp_merchant_family.9150.a: "“我不会让你或商会失望。”"
 gdp_merchant_family.9150.b: "“你完全配得上它，[partner.GetFirstNameNoTooltip]。”"
 gdp_merchant_family.9150.b.tt: "接下来的#V 10#!年内，[partner.GetShortUINamePossessive]的[GetCourtPositionType( 'partner_court_position' ).GetName()][aptitude|E]：#p +1#!"
 gdp_merchant_family.9150.c: "“然而，没有[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]，我们又会在哪里？”"
 gdp_merchant_family.9150.c.tt: "成年时，你会获得[GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip][modifier|E]，持续#V 10#!年"
 merchant_childhood_suzerain_modifier: "讨好恩主者"
 merchant_childhood_suzerain_modifier_desc: "该角色明白与那些掌握最大权力的人保持良好关系的重要性。"
 merchant_childhood_desc: "商人童年"
