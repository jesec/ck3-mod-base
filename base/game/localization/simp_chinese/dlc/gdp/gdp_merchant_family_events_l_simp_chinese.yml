l_simp_chinese:
 gdp_merchant_family.0001.t: "私奔的[house_member.Custom('GetBrideGroom')|U]"
 gdp_merchant_family.0001.desc: "黑暗中一阵响动，我发现我的[ROOT.Char.Custom2('RelationToMe', house_member)][house_member.GetTitledFirstName]正在翻找商会的金库，[house_member.GetHerHis]身旁跟着一个[wedding_interest.GetWomanMan]，正低声催着[house_member.GetHerHim]快走。\n\n“这是什么意思？”我问道，两人转过身来，紧紧抓着彼此。这时我认出了那个陌生人，是[wedding_interest_house_head.GetTitledFirstNamePossessive]的[wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)]。\n\n“我们不会再留在这里了。我们两家的恩怨会把我们拆散，所以我们决定离开，”[house_member.GetTitledFirstNameNoTooltip]说，"
 gdp_merchant_family.0001.desc.stubborn_outro: "挑衅地扬起下巴，手紧紧握着[wedding_interest.GetTitledFirstNamePossessiveNoTooltip]。"
 gdp_merchant_family.0001.desc.fallback_outro: "松开了[wedding_interest.GetTitledFirstNamePossessiveNoTooltip]的手，尽管这对[house_member.GetHerHim]来说似乎很痛苦，然后向我伸出手，无声地恳求。"
 gdp_merchant_family.0001.a: "“拿上金子，带着我的祝福走吧。”"
 gdp_merchant_family.0001.b: "“我怎样才能说服你们俩留下？”"
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName]加入了你的商会"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName]不为所动"
 gdp_merchant_family.0001.c: "“你们#EMP 哪儿也#!别想去！”"
 gdp_merchant_family.0002.t: "血浓于水"
 gdp_merchant_family.0002.desc_intro: "我正在审阅最新的利润报告时，[blood.Custom2('MyCharacterIntroduction', ROOT.Char)]怒气冲冲地闯了进来。\n\n“这个[water.Custom('InsultAdjective')]的[water.Custom('InsultNoun')]太过分了，”[blood.GetSheHe]厉声说道，“[water.GetSheHe|U]冒险行事，无视界限，让我们其他人看起来像十足的傻瓜。"
 gdp_merchant_family.0002.desc_adopted: "这对[ROOT.Char.GetHouse.GetName]家族的成员来说太不像话了。”"
 gdp_merchant_family.0002.desc_associate: "这对我们商会的一个区区伙计来说太不像话了。”"
 gdp_merchant_family.0002.desc_outro: "\n\n等抱怨终于结束，我重新看向账本。不管别的怎样，[water.GetFirstNameNoTooltip]确实在带来利润，而结果是很难争辩的。"
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip]必须认清[water.GetHerHis]的位置。"
 gdp_merchant_family.0002.a.unity_gain.desc: "选择了血亲家族，而非商业才干"
 gdp_merchant_family.0002.b: "拿出像[water.GetFirstNamePossessiveNoTooltip]这样的业绩再来找我。"
 gdp_merchant_family.0002.b.unity_loss.desc: "选择了商业才干，而非血亲家族"
 gdp_merchant_family.0002.c: "“我太忙了，没空管这事……”"
 gdp_merchant_family.0003.t: "不容羞辱"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U]面带满脸的愠色地朝我走来。\n\n“你绝对猜不到我刚才听见了什么，”[offended.GetSheHe]说道，“[offender.Custom2('MyCharacterIntroduction', ROOT.Char)]居然认为侮辱我——乃至羞辱我们整个家族——是一件有趣的消遣。”\n\n这种冒犯尽管看似无足轻重，但明显是蓄意而为之。"
 gdp_merchant_family.0003.a: "以[ROOT.Char.GetFaith.HighGodName]的名义，[offender.GetHouse.GetNameNoTooltip]家族必须道歉！"
 gdp_merchant_family.0003.a.unity_gain.desc: "选择了一致对外并回击羞辱"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U]公开侮辱了[target_char.GetShortUINamePossessive]的家族"
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U]，你该听听他们的言外之意……"
 gdp_merchant_family.0003.b.unity_loss.desc: "拒绝用同等手段报复羞辱"
 gdp_merchant_family.0003.c: "这事你来处理，我还有别的事要做。"
 gdp_merchant_family.0003.c.unity_loss.desc: "无视了对家族的羞辱"
 gdp_merchant_family.0004.t: "天赐良缘"
 gdp_merchant_family.0004.desc: "我在庭院中悠然踱步，忽然从院子的另一端传来一道陌生的声音。“[ROOT.Char.Custom('FormOfAddressForLiege')]，请稍等，我有要事相告。”[offer_2.GetFullName]走到我面前，语气温和而恭敬。\n\n“[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U]派我前来提亲，希望[offer.Custom2('YourCharacterIntroduction', ROOT.Char)]能与我家联姻，以此加深两家的情谊。”我听后心中一动，暗自思量起这份提议。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')]意下如何？”"
 gdp_merchant_family.0004.a: "“我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))]将对此深感荣幸。”"
 gdp_merchant_family.0004.b: "“不如达成一份互利互惠的交易？”"
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U]与[target_char.GetShortUINamePossessive]签署了一份互利的协约"
 gdp_merchant_family.0004.c: "“恕我拒绝，但欢迎你留下。”"
 gdp_merchant_family.0005.t: "[ROOT.Char.GetHouse.GetNameNoTooltip]家族之耻"
 gdp_merchant_family.0005.desc: "消息传来，[wayward.Custom2('MyCharacterIntroduction', ROOT.Char)]不慎遗失了一批至关重要的货物。此事若不能妥善处理，必将严重损害家族声誉。我将[wayward.GetHerHim]唤至房中当面质询。\n\n“[wayward.Custom2('RelationToMe', ROOT.Char)]，我真心感到抱歉。但这场事故绝非全是我的过错——同族之中竟有人暗中算计，处处与我为难！”"
 gdp_merchant_family.0005.a: "“你这[wayward.Custom('InsultAdjective')][ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]，令人蒙羞！”"
 gdp_merchant_family.0005.a.unity_loss.desc: "公开斥责了一名家族成员"
 gdp_merchant_family.0005.b: "“我们永远应该同舟共济。”"
 gdp_merchant_family.0005.b.unity_gain.desc: "选择共同应对事故"
 gdp_merchant_family.0005.c: "“自己摆平这事吧。”"
 gdp_merchant_family.0010.t: "一触即发"
 gdp_merchant_family.0010.desc: "随着#EMP “咣当”#!一声，箱子砸在地上，原本正常的[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]活动也停了下来。我转过身，看见我的两个同伴[attacker.GetTitledFirstName]和[defender.GetTitledFirstName]快要打起来了。\n\n“我为家族累死累活，”[attacker.GetTitledFirstNameNoTooltip]说着，[attacker.Custom('quirk_neg_present')]，眼睛里闪着愤怒的光。“而这个废物[defender.GetWomanMan]却在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]闲逛。你要是不拦我，我发誓非把[defender.GetHerHim]打醒不可。”"
 gdp_merchant_family.0010.a: "我的伙计们不该有这样表现。"
 gdp_merchant_family.0010.a.tt.success: "你成功调解了冲突"
 gdp_merchant_family.0010.a.tt.failure: "你没能调解冲突"
 gdp_merchant_family.0010.b: "上吧，让大家看看我们是怎么解决恩怨的。"
 gdp_merchant_family.0010.c: "你会后悔对[defender.GetTitledFirstNameNoTooltip]动手的！"
 gdp_merchant_family.0010.d: "随你便吧。"
 gdp_merchant_family.0010.tt.duel: "@alert_icon!#alert_trial [attacker.GetShortUIName]和[defender.GetShortUIName]将对彼此发起[prowess_i][prowess|E]和[martial_i][martial|E]联合对决！有人会受伤#!"
 merchant_unity_fight_stopped: "阻止商会成员之间的争斗"
 merchant_unity_fight_promoted: "煽动商会成员内部争斗"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip]获胜"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U]打伤了[defender.GetFirstName]"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip]获胜"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.GetSheHe|U]在自卫时打伤了[attacker.GetFirstName]"
 gdp_merchant_family.0015.t: "商业密友"
 gdp_merchant_family.0015.desc: "在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]的[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l]上众多熟悉的面孔中，[tip_giver.GetShortUIName]引起了我的注意，把我拉到一旁。[tip_giver.GetSheHe]带着狡黠的微笑，递给我一本账本。\n\n“啊，[ROOT.Char.GetTitledFirstName]，我正要找你呢！让我分享一些我最近的见解，就当是为我们继续合作的一点心意。”"
 gdp_merchant_family.0015.a: "“我们联手可以大赚一笔！”"
 gdp_merchant_family.0015.b: "“让我把这个从你这里买下来。”"
 gdp_merchant_family.0015.b.artifact: "内部账本"
 gdp_merchant_family.0015.b.artifact.desc: "一本严密保管的账本，记载着市场利润、利润率和有用的人脉"
 gdp_merchant_family.0015.c: "“#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#!将从中受益……”"
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U]和[target_char.GetShortUIName]交换了有利可图的情报"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U]利用[target_char.GetShortUINamePossessive]提供的消息反过来对付了[target_char.GetHerHim]"
 gdp_merchant_family.0020.t: "人才交换"
 gdp_merchant_family.0020.desc: "我的商业联系人[house_friend.Custom('MistressMaster')|U][house_friend.GetFirstName]在我们往常的会面中迟到了。等[house_friend.GetSheHe]终于到达时，还带来了意想不到的同伴。\n\n“[ROOT.Char.Custom('MistressMaster')|U]，这位是我的[house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))][nepo_hire.GetFirstName]，"
 gdp_merchant_family.0020.desc.diplomacy: "一位熟练的外交官。"
 gdp_merchant_family.0020.desc.martial: "一位倔强的战略家。"
 gdp_merchant_family.0020.desc.stewardship: "一位管账的高手。"
 gdp_merchant_family.0020.desc.intrigue: "一个敏锐的[nepo_hire.GetWomanMan]。"
 gdp_merchant_family.0020.desc.learning: "一个博学的[nepo_hire.GetWomanMan]。"
 gdp_merchant_family.0020.desc.outro: "在[ROOT.Char.GetPrimaryTitle.GetName]你的指导下，[nepo_hire.GetSheHe]一定会大有作为。”"
 gdp_merchant_family.0020.a: "“欢迎[nepo_hire.GetFirstNameNoTooltip|U]加入我们。”"
 gdp_merchant_family.0020.a.unity_loss.desc: "作为人情，安排了一个伙计职位"
 gdp_merchant_family.0020.b: "“恐怕我们没有空缺。”"
 gdp_merchant_family.0020.b.unity_gain.desc: "拒绝雇用外人"
 gdp_merchant_family.0020.c: "“你这是在侮辱我。”"
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U]将[target_char.GetShortUINamePossessive]的亲属招入了[char.GetHerHis]的商会"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U]拒绝了[target_char.GetShortUINamePossessive]的亲属"
 gdp_merchant_family.0025.t: "并非针对个人"
 gdp_merchant_family.0025.desc: "我的手腕因签署最后一批看似无穷无尽的贸易协议而酸痛。就在我准备收工时，[leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)]走到我面前。[leaving_associate.GetSheHe]紧张地摸索着，举起一小张羊皮纸，开始念上面的内容。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，我很遗憾地通知您，我收到了来自[rival_poacher.GetPrimaryTitle.GetName]的一份我实在无法拒绝的邀请。不是针对您，这只是生意。”"
 gdp_merchant_family.0025.a: "“带着我的祝福去吧。”"
 gdp_merchant_family.0025.b: "“你的位置在这里，和我们在一起。”"
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U]留在了[company|E]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip]同意留下"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip]还是离开了"
 gdp_merchant_family.0025.c: "“记住，你欠我的。”"
 gdp_merchant_family.0025.d: "“行，走吧。”"
 gdp_merchant_family.0025.d.rival: "“[rival_poacher.GetTitledFirstNameNoTooltip]，你会为与我作对的那一天付出代价的！”"
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U]从[CHARACTER.GetShortUIName]处挖走了一名[associate|E]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U]出于善意将一名[associate|E]让给了[target_char.GetShortUINamePossessive]的商会"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U]从[char.GetHouse.GetName]挖走了一名[associate|E]"
 gdp_merchant_family.0030.t: "公事还是享乐？"
 gdp_merchant_family.0030.desc: "我的两位伙计，[house_member.GetTitledFirstName]和[associate.GetTitledFirstName]，在#EMP 相当#!漫长的用餐时间后回到[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]的办公室，还带回了一壶[ROOT.Char.Custom('RegionalAlcoholicDrink')]。\n\n“……然后我跟他说，那只猫就配待在猪圈里！”[house_member.GetTitledFirstNameNoTooltip]说道，引得[associate.GetTitledFirstNameNoTooltip]捧腹大笑。\n\n如果我不采取行动，这俩人今天剩下的时间怕是干不了什么正事了。"
 gdp_merchant_family.0030.a: "“我去拿瓶好酒来。”"
 gdp_merchant_family.0030.a.flavor: "只有最好的才配得上[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]"
 gdp_merchant_family.0030.b: "“回去干活，你们这群不知好歹的东西！”"
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]容不下游手好闲之人"
 gdp_merchant_family.0030.c: "看看这段友谊会走向何方。"
 merchant_unity_breaks_encouraged: "只喝市面上最好的酒"
 merchant_unity_breaks_discouraged: "不鼓励工间休息"
 gdp_merchant_family.9000.t: "年轻的[ROOT.Char.GetTitleAsNameNoTooltip][ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "我终于成为了[ROOT.Char.GetWomanMan]，也到了足以作为[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]的[ROOT.Char.GetTitleAsNameNoTooltip|l]，取得我应有之位的时候。我必须填补我的[ROOT.Char.Custom2('RelationToMeShort', predecessor)]，[predecessor.GetFirstName]留下的空缺。\n\n我的同僚们如今指望我来执掌我们的事业，在商界寻找新的航向与机遇，尽管有人告诫我，应当依靠他们的经验与智慧……"
 gdp_merchant_family.9000.a: "[educator.GetTitledFirstNamePossessiveNoTooltip]的指导将是无价的。"
 gdp_merchant_family.9000.b: "从哪里开始……"
 gdp_merchant_family.9000.route_hint_tt: "你现在可以创建和编辑[distribution_routes|E]"
 gdp_merchant_family.9010.t: "失去支柱的商会"
 gdp_merchant_family.9010.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', previous_holder)][previous_holder.GetFirstName]已经离开了我们。[previous_holder.GetSheHe|U]曾是商会备受尊敬的[previous_holder.Custom('MistressMaster')]。我们的大厅里再没有笑声，办公室里再没有激烈的争论，每个人都显得忧心忡忡。\n\n"
 gdp_merchant_family.9010.interim_generated: "所有人都指望一位名叫[interim.GetFirstName]的[interim.GetWomanMan]，此人被召唤来帮助管理事务，并且"
 gdp_merchant_family.9010.interim_relation: "所有人都指望我的[ROOT.Char.Custom2('RelationToMeShort', interim)][interim.GetFirstName]，此人"
 gdp_merchant_family.9010.interim: "所有人都指望我的[ROOT.Char.Custom2('RelationToMePossessive', previous_holder)]信任的伙计[interim.GetFirstName]，此人"
 gdp_merchant_family.9010.close: "已在[previous_holder.GetFirstNamePossessiveNoTooltip]缺席期间做好了安排，并将处理日常业务，直到我长大到足以管理。"
 gdp_merchant_family.9010.a: "事情变化得太快了。"
 gdp_merchant_family.9110.t: "行业诀窍"
 gdp_merchant_family.9110.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', trader)][trader.GetFirstName]，是商会里最有经验的商人之一，却很少待在办公室里。\n\n[trader.GetSheHe|U]管理着[route.GetName|l]，确保每一[good.Custom('GetTradeGoodUnit')]货物都安全地从卖方送到买家手中，一路用[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')]充实我们的钱袋。\n\n“一个好贸易负责人要无处不在。”[trader.GetSheHe|U]微笑着说。“要认识[ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')]里每个摊位上的人，了解他们的难处——还有每个城镇和商队守卫的难处！”"
 gdp_merchant_family.9110.a: "当我掌权时，我会像[trader.GetNameNoTooltip]一样。"
 gdp_merchant_family.9110.b: "“给我讲讲商队的事！”"
 gdp_merchant_family.9110.b.tt: "成年时，你将在#emp $trait_track_caravaneer$#!中获得#V 10#![trait_level_track_xp|E]#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#!"
 gdp_merchant_family.9110.c: "“我也想成为一名[good.Custom('GetTradeGood')]贸易负责人！”"
 gdp_merchant_family.9110.c.tt: "成年时，[merchant.GetPrimaryTitle.GetDefinitiveName|l]将获得#V 450#![category.GetNameWithIcon][trade_expertise|E]"
 gdp_merchant_family.9130.t: "青春的野心"
 gdp_merchant_family.9130.desc: "我通过观察商会的日常业务学到很多，我的伙计们竭尽全力让我参与，以增进我的理解。"
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]在远方广泛贸易，其账簿上满是远离[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]的、我几乎念不出来的地名。究竟在哪里，我只能猜测。"
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]以稀有优质物品的供应商，以及[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]工匠的赞助人而闻名。"
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]以用[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')]换取人情而闻名，其账簿上写满了[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]的不幸者和赌徒的名字。"
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]根基稳固，但并无特别出名之处。它不过是[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]的贸易商行之一，涉足甚广。"
 gdp_merchant_family.9130.a: "我迫不及待地想成为商会的掌舵人。"
 gdp_merchant_family.9130.a.caravaneer: "我们将走得更远。"
 gdp_merchant_family.9130.a.artisan: "我们的商号是品质的保证。"
 gdp_merchant_family.9130.a.creditor: "信贷是我们的业务。"
 gdp_merchant_family.9130.a.tt: "成年时，你会获得#V 5#!点#emp $trait_track_caravaneer$#!、#emp $trait_track_artisan$#!和#emp $trait_track_creditor$#!#weak （[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）#![trait_level_track_xp|E]"
