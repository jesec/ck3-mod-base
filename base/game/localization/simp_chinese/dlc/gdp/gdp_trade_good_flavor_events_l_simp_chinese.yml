l_simp_chinese:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "清点库存"
 gdp_trade_good_flavor.1001.desc: "睡前我又数了一遍我的每[tgf_good.Custom('GetTradeGoodUnitPlural')][tgf_good.Custom('GetTradeGood')]。三百一十二[tgf_good.Custom('GetTradeGoodUnitPlural')]，全都卖出去了……至少在我脑子里是这样。\n\n我又再数了一遍。只是确认一下。"
 gdp_trade_good_flavor.1001.a: "都在那，都是我的。"
 gdp_trade_good_flavor.1001.b: "账簿必须和我的数对得上。"
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "消息传开"
 gdp_trade_good_flavor.1002.desc: "消息传到我这里：[tgf_market_holder.GetTitledFirstName]在[tgf_market_holder.GetHerHis]自己的餐桌上，一直夸赞我的[tgf_good.Custom('GetTgfGoodLook')]。[tgf_market_holder.GetSheHe|U]想要更多，而[tgf_market_holder.GetHerHis]的邻居们都听到[tgf_market_holder.GetHerHim]说的话了。\n\n赞美令人愉快。一位持续购买的[tgf_market_holder.GetWomanMan]的赞美，更令人愉快。"
 gdp_trade_good_flavor.1002.a: "给我最爱的买家一份礼物。"
 gdp_trade_good_flavor.1002.b: "那[tgf_market_holder.GetSheHe]可得多付钱。"
 gdp_trade_good_flavor.1002.c: "让他们说去吧。"
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "来自源头"
 gdp_trade_good_flavor.1003.desc: "“这里的[tgf_source_culture.GetName]工人对自己的行当熟到不能再熟，连一[tgf_good.Custom('GetTgfGoodSmallest')]都不放过，”我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]写信来说。“[tgf_good.Custom('GetTradeGood')][tgf_good.Custom('GetTgfGoodMade')]，没有人偷工减料。”\n\n了解源头，库存就卖出了一半。"
 gdp_trade_good_flavor.1003.a: "每一个细节都值钱。"
 gdp_trade_good_flavor.1003.b: "现在我知道它该是什么价了。"
 gdp_trade_good_flavor.1003.c: "致以一名商人对同行的敬意。"
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "畅通之路"
 gdp_trade_good_flavor.1004.desc: "我的贸易负责人[tgf_trader.GetFirstName]笑得像个已经花光自己分成的[tgf_trader.GetWomanMan]。“整条路都畅通无阻，他们点名要你的[tgf_good.Custom('GetTgfGoodLook')]。”\n\n好年景过得快。最好趁年景好狠狠赚上一笔。"
 gdp_trade_good_flavor.1004.a: "趁路况好赶紧卖。"
 gdp_trade_good_flavor.1004.b: "每个好年景都有教育意义，好好学。"
 gdp_trade_good_flavor.1004.c: "投资更多货车！"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "利润之梦"
 gdp_trade_good_flavor.1005.desc: "我又梦见了[tgf_good.Custom('GetTradeGood')]。成[tgf_good.Custom('GetTradeGoodUnitPlural')|U]成[tgf_good.Custom('GetTradeGoodUnitPlural')|U]，堆得高过房梁，而我坐在货堆顶上——看着下面的买家争抢着谁先付钱。\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "我又梦见了[tgf_good.Custom('GetTradeGood')]。成群结队，挤满通往市场的每一条路——而我骑在队伍前头，数着跑来的买家。\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "我笑着醒来，然后开始把数字写下来。假以时日，我会发财的！"
 gdp_trade_good_flavor.1005.a: "它为什么不能成真？"
 gdp_trade_good_flavor.1005.a.tt: "一个新[trade_opportunity|E]即将出现"
 gdp_trade_good_flavor.1005.b: "这些数字会实现的，我会让它们实现。"
 gdp_trade_good_flavor.1005.c: "再当五分钟的有钱人……Zz#DIE1 zz#!#DIE2 zz……#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "会验货的傻子"
 gdp_trade_good_flavor.1006.desc: "我的贸易负责人[tgf_trader.GetFirstName]在仓库把我拉到一边。“从[tgf_source_county.GetNameNoTier]来的[tgf_good.Custom('GetTradeGood')]——[tgf_good.Custom('GetTgfGoodFlaw')]。他们以为我们是不会验货的傻子！”\n\n他们想骗我，结果反而给了我一个折扣。"
 gdp_trade_good_flavor.1006.a: "劣货就该有劣价。"
 gdp_trade_good_flavor.1006.b: "嘿！被我识破了。"
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "点名求购"
 gdp_trade_good_flavor.1007.desc: "我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]带回奇怪的消息。“[tgf_good.Custom('GetTradeGood')|U]，[tgf_good.Custom('GetTgfGoodSold')]，可[tgf_source_culture.GetCollectiveNoun]仍然点名要#EMP ‘[ROOT.Char.GetHouse.GetName][tgf_good.Custom('GetTradeGood')]’#!，还愿意付高于市价的价钱！我们快没货了！”\n\n原来，我的名字这样值钱。"
 gdp_trade_good_flavor.1007.a: "在每一[tgf_good.Custom('GetTradeGoodUnit')]上盖上我的印章。"
 gdp_trade_good_flavor.1007.b: "卖，卖，卖！"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "评估[tgf_good.GetNameNoTooltip]"
 gdp_trade_good_flavor.1008.desc: "一封盖着[tgf_market_holder.GetTitledFirstNamePossessive]印章的信到了。“有人向我提供了一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]，而我的管家分不清好坏。你愿意用商人的眼光看看吗？”\n\n恭维。恭维通常要额外收费。"
 gdp_trade_good_flavor.1008.a: "经过称重测量，给出真相。"
 gdp_trade_good_flavor.1008.b: "好极了，我从没见过更好的。"
 gdp_trade_good_flavor.1008.c: "专家的意见要收费，不是白送的。"
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "学会数数"
 gdp_trade_good_flavor.1009.desc: "我在仓库里撞见我的继承人[tgf_heir.GetFirstName]，正盯着一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]往里张望，好像底下可能藏着钱币。\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "我在围栏边撞见我的继承人[tgf_heir.GetFirstName]，正打量着一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]，好像毛皮底下可能藏着钱币。\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "不错的直觉。该让人好好打磨打磨了。"
 gdp_trade_good_flavor.1009.a: "来，看我怎么做。"
 gdp_trade_good_flavor.1009.b: "那就数它们，数两遍。"
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "模仿者"
 gdp_trade_good_flavor.1010.desc: "一箱货被退回[tgf_source_county.GetNameNoTier]，理由是“未达到惯常标准”。那不是我的货，有人伪造了我的标记，连最后一笔弯曲都照抄了下来。\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "我的一头牲畜被退回[tgf_source_county.GetNameNoTier]，理由是“未达到惯常标准”。这牲畜不是我的，有人伪造了我的烙印，连最后一笔弯曲都照刻了下来。\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "我的贸易负责人[tgf_trader.GetFirstName]说出了伪造者的名字：[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]的[tgf_rival.GetFirstName]。伪造得不错，这一点我承认。"
 gdp_trade_good_flavor.1010.a: "不惜代价粉碎这桩伪造。"
 gdp_trade_good_flavor.1010.b: "让每一家都知晓这份侮辱。"
 gdp_trade_good_flavor.1010.c: "这种模仿行为免费替我扬名。"
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U]把[tgf_rival.GetShortUINamePossessiveNotMy]的伪造变成了他们两家之间的事。"
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U]把[target_char.GetShortUINamePossessiveNotMy]的伪造变成了他们两家之间的事。"
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "[tgf_good.GetNameNoTooltip]的价钱"
 gdp_trade_good_flavor.1011.desc: "[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]雇的贸易负责人[tgf_envoy.GetFirstName|U]在我的仓库找到我，把一个沉甸甸的钱袋放在桌上。“我的主人[tgf_rival.GetFirstName]想要你的[tgf_good.Custom('GetTradeGood')]卖家的名字。全部。这袋钱也全给你。”\n\n[tgf_envoy.GetSheHe|U]买的不是名字。[tgf_envoy.GetSheHe|U]买的是我多年的心血。"
 gdp_trade_good_flavor.1011.a: "名字不过是墨水。付钱吧。"
 gdp_trade_good_flavor.1011.b: "我的优势不卖。"
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "商人的休战"
 gdp_trade_good_flavor.1012.desc: "和我一样，[tgf_ally.GetFirstName|U]也在[tgf_source_county.GetNameNoTier]卖[tgf_good.Custom('GetTradeGood')]，每个季节我们都把价格压得离成本更近。今天[tgf_ally.GetHerHis]来信提出休战：我们停止互相压价，对双方都利好。\n\n看来，和平也可以像别的东西一样买来。"
 gdp_trade_good_flavor.1012.a: "同意。我们都得利。"
 gdp_trade_good_flavor.1012.b: "我比[tgf_ally.GetSheHe]更能耗。"
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U]和[tgf_ally.GetShortUINameNotMe]同意停止互相压价。"
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U]和[target_char.GetShortUINameNotMe]同意停止互相压价。"
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "专属价"
 gdp_trade_good_flavor.1013.desc: "我收到一封盖着[tgf_market_holder.GetTitledFirstName]印章的信。“你在我的市场是购买[tgf_good.Custom('GetTradeGood')]。只在我这里购买[tgf_good.Custom('GetTgfGoodItThem')]，我就给你独家优惠价。”\n\n独家不过是受制于人的另一种说法。但这价钱确实不错。"
 gdp_trade_good_flavor.1013.a: "[tgf_market_holder.GetHerHis|U]的市场，我的折扣。成交。"
 gdp_trade_good_flavor.1013.b: "我不向任何人的账簿低头。"
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "问问老手"
 gdp_trade_good_flavor.1014.desc: "一个头发花白的搬运工在[tgf_source_county.GetNameNoTier]仓库放下[tgf_porter.GetHerHis]的货物。“恕我冒昧——您验[tgf_good.Custom('GetTradeGood')]的方法全错了。”[tgf_porter.GetSheHe|U]指给我看：这里，还有这里。\n\n一辈子搬运了无数[tgf_good.Custom('GetTradeGoodUnitPlural')]货物的经验，让[tgf_porter.GetHerHim]懂得比大多数人都多。"
 gdp_trade_good_flavor.1014.desc.livestock: "一位头发花白的赶畜人把[tgf_porter.GetHerHis]的畜群停在[tgf_source_county.GetNameNoTier]的市场。“恕我冒昧——但您评判[tgf_good.Custom('GetTradeGood')]的标准完全错了。”[tgf_porter.GetSheHe|U]指给我看：这里，还有这里。\n\n一辈子赶着[tgf_good.Custom('GetTradeGood')]去市场，让[tgf_porter.GetHerHim]懂得比大多数人都多。"
 gdp_trade_good_flavor.1014.a: "给，智慧该有报酬。"
 gdp_trade_good_flavor.1014.b: "继续说，我听着呢。"
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "新手的错误"
 gdp_trade_good_flavor.1015.desc: "在[tgf_source_county.GetNameNoTier]某处，那个卖给我[tgf_good.Custom('GetTradeGood')]的小贩正举杯祝我健康。我是个付了过高价钱的傻子，而我是最后一个知道的。\n\n好吧。肯学习的傻子……就不再是傻子了。"
 gdp_trade_good_flavor.1015.a: "昂贵的教训也是教训。"
 gdp_trade_good_flavor.1015.b: "够了，今晚让账簿安睡。"
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "商人手册"
 gdp_trade_good_flavor.1016.desc.intro: "在一箱[tgf_good.Custom('GetTradeGood')]里，我发现一本用防潮布包裹的"
 gdp_trade_good_flavor.1016.desc.intro_livestock: "在我上次买的那批[tgf_good.Custom('GetTradeGood')]随附的用具里，我发现一本用防潮布包裹的"
 gdp_trade_good_flavor.1016.desc.book_1: "《商业实践》"
 gdp_trade_good_flavor.1016.desc.book_2: "《道路与市场之书》"
 gdp_trade_good_flavor.1016.desc.book_3: "《商人之镜》"
 gdp_trade_good_flavor.1016.desc.outro: "——重量、度量、道路和价格，由一名显然从不睡觉的商人写下。\n\n有人丢了一件宝物，而我打算把它用起来。"
 gdp_trade_good_flavor.1016.a: "读到书脊散架。"
 gdp_trade_good_flavor.1016.b: "稀有的书卖更稀有的价。"
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "手感"
 gdp_trade_good_flavor.1017.desc: "在[tgf_source_county.GetNameNoTier]，一个[tgf_seller.GetCulture.GetCollectiveNoun]人卖家，拿出一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]，报了一个够买三份的价。“你是新手，对吧？那就付钱学学手感。”\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "在[tgf_source_county.GetNameNoTier]，一个[tgf_seller.GetCulture.GetCollectiveNoun]人卖家，在我面前兜售一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]，报了一个够买三[tgf_good.Custom('GetTradeGoodUnit')]的价。“你是新手，对吧？那就付钱学学手感。”\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "无礼，但说得没错。"
 gdp_trade_good_flavor.1017.a: "收下钱，教我。"
 gdp_trade_good_flavor.1017.b: "绝对不行。"
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "错误的量具"
 gdp_trade_good_flavor.1018.desc: "我的贸易负责人[tgf_trader.GetFirstName]发现我们一直用[ROOT.Char.GetCulture.GetName]式量具卖[tgf_good.Custom('GetTradeGood')]——它比买家以为的[tgf_source_culture.GetName]式量具小一点点。于是卖出的每一[tgf_good.Custom('GetTradeGoodUnit')]都短斤少两。\n\n一个无心之失。它是否仍算无心之失，就看我怎么做了。"
 gdp_trade_good_flavor.1018.a: "修正全部的量具。"
 gdp_trade_good_flavor.1018.b: "差额留在我钱包里。"
 gdp_trade_good_flavor.1018.c: "按他们的度量来称重，并大声说明。"
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "两种货，一个买家"
 gdp_trade_good_flavor.1019.desc: "我收到[tgf_market_holder.GetTitledFirstName]的一封信。“把你的[tgf_good.Custom('GetTradeGood')]送来。也把你的[tgf_good_b.Custom('GetTradeGood')]送来，因为这二者缺一不可。”\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "我收到[tgf_market_holder.GetTitledFirstName]的一封信。“把你的[tgf_good.Custom('GetTradeGood')]送来。也把你的[tgf_good_b.Custom('GetTradeGood')]送来，同一批交付。”\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "两种货，一个买家，一个价格。我最喜欢的那种算术。"
 gdp_trade_good_flavor.1019.a: "成套卖，成套定价。"
 gdp_trade_good_flavor.1019.b: "分开卖。现在的钱胜过以后的钱。"
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "成本价"
 gdp_trade_good_flavor.1020.desc: "脚手架在[tgf_build_county.GetNameNoTier]层层架起。[tgf_market_holder.GetTitledFirstName]正在大兴土木，每一辆驶到工地的马车都装满了我的[tgf_good.Custom('GetTradeGood')]。[tgf_market_holder.GetSheHe|U]写信来，要求按成本价供应——同样的[tgf_good.Custom('GetTradeGood')]，价钱便宜一点，直到城墙立起。\n\n[tgf_market_holder.GetSheHe]筑起的每一堵墙，都有我的一半功劳。"
 gdp_trade_good_flavor.1020.a: "那就按成本价。"
 gdp_trade_good_flavor.1020.b: "价格可以优惠，白送可不行。"
 gdp_trade_good_flavor.1020.c: "先卖个人情，日后讨还。"
 gdp_trade_good_flavor.1020.d: "把最好的留在我院子里。"
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "了解商品"
 gdp_trade_good_flavor.1021.desc: "每一行都有大师，而大师会#EMP 持续#!学习。今晚我带着一盏灯，来到我库存中最好的几[tgf_good.Custom('GetTradeGoodUnitPlural')][tgf_good.Custom('GetTradeGood')]旁，一直研究到灯油将尽。\n\n这就是我的货卖得出去，而他们卖不出去的原因。"
 gdp_trade_good_flavor.1021.desc.livestock: "每一行都有大师，而大师会持续学习。今晚带着一盏灯，来到我拥有的最好的[tgf_good.Custom('GetTradeGood')]旁边，从头到尾研究。\n\n这就是我的牲畜卖得出去，而他们卖不出去的原因。"
 gdp_trade_good_flavor.1021.desc.books: "每一行都有大师，而大师会#EMP 持续#!学习。今晚我带着一盏灯，来到我库存中最好的书籍旁，一直研究到灯油将尽。\n\n这就是我的书卖得出去，而他们卖不出去的原因。"
 gdp_trade_good_flavor.1021.a: "这批我留着，作为其他批的衡量标准。"
 gdp_trade_good_flavor.1021.b: "总有更多可学。"
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "行当诨名"
 gdp_trade_good_flavor.1022.desc: "在[tgf_source_county.GetNameNoTier]，他们不再说我的名字。他们说[tgf_good.Custom('GetTgfGoodNickname')]，所有人都知道那是谁。那便是#bold 我。#!\n\n头衔由领主授予。这样的称号由市场授予，而市场的赞誉是挣来的。"
 gdp_trade_good_flavor.1022.a: "粗俗，但有效。"
 gdp_trade_good_flavor.1022.b: "让他们说，这个绰号对生意有好处。"
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "供应瓶颈"
 gdp_trade_good_flavor.1023.desc: "“你买的速度比我们产得还快，”[tgf_source_county.GetNameNoTier]的一位工头[tgf_foreman.GetFirstName]说，我看着我的[tgf_good.Custom('GetTradeGood')][tgf_good.Custom('GetTgfGoodMade')]。“人手就这么多。”\n\n多雇人手要花钱，而把买家拒之门外会损失更多钱。"
 gdp_trade_good_flavor.1023.a: "雇更多人，我付钱。"
 gdp_trade_good_flavor.1023.b: "不如来为我工作。"
 gdp_trade_good_flavor.1023.c: "那教教我怎么做。"
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "拍卖锤落下"
 gdp_trade_good_flavor.1024.desc: "“四十[tgf_good.Custom('GetTradeGoodUnitPlural')][tgf_good.Custom('GetTradeGood')]，价高者得！”在[tgf_source_county.GetNameNoTier]的[tgf_source_province.Custom('GetRegionalMarketTerm')]，[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]的[tgf_rival.GetFirstName]在拍卖师说完之前就举起了[tgf_rival.GetHerHis]的手。\n\n[tgf_rival.GetSheHe|U]看着我微笑。[tgf_rival.GetSheHe|U]以为这批货已经归[tgf_rival.GetHerHim]了……"
 gdp_trade_good_flavor.1024.a: "不管[tgf_rival.GetSheHe]出多少，再加一个数。"
 gdp_trade_good_flavor.1024.b: "加价，加价，加价……都归你了，[tgf_rival.GetFirstNameNoTooltip]！"
 gdp_trade_good_flavor.1024.c: "让[tgf_rival.GetHerHim]出价，我看看谁赢。"
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "码头第一"
 gdp_trade_good_flavor.1025.desc: "“码头上有二十艘船，却只有一台起重机，”管理[tgf_source_county.GetNameNoTier]码头工人的[tgf_docks_boss.GetFirstName]说。“谁的[tgf_good.Custom('GetTradeGood')]先卸下，谁就能定这一季的价。你的货可以最先卸。”\n\n[tgf_docks_boss.GetSheHe|U]伸出手，掌心朝上。"
 gdp_trade_good_flavor.1025.a: "先下船，先定价。"
 gdp_trade_good_flavor.1025.b: "那我就在这儿卖，就在甲板上。"
 gdp_trade_good_flavor.1025.c: "让别人先卸，看看他们开什么价。"
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "按小份卖"
 gdp_trade_good_flavor.1026.desc: "“一次一[tgf_good.Custom('GetTgfGoodSmallest')]，穷人就是这么买的，”在[tgf_source_county.GetNameNoTier]市场摆摊的[tgf_stallholder.GetFirstName]说。[tgf_stallholder.GetSheHe|U]把我的一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]拆成一百份，每份卖得比实际价值略高一点。\n\n“你为我供货，我给你付钱。”"
 gdp_trade_good_flavor.1026.a: "你随时需要，随时能拿到新一批。成交。"
 gdp_trade_good_flavor.1026.b: "按他们付得起的价卖货给他们。"
 gdp_trade_good_flavor.1026.c: "现在全部拿走，落袋为安。"
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "集市日"
 gdp_trade_good_flavor.1027.desc: "“[tgf_good.Custom('GetTradeGood')|U]！[tgf_good.Custom('GetTgfGoodLook')|U]！谁要[tgf_good.Custom('GetTradeGood')]？”今天是[tgf_source_county.GetNameNoTier]的集市日，几乎没人能听清我的叫卖员的吆喝声。全伯爵领的买家，全在一个地方，全拿着钱。\n\n我只需要他们把钱#EMP 花在我这儿！#!"
 gdp_trade_good_flavor.1027.a: "我需要最好的摊位，不管花多少。"
 gdp_trade_good_flavor.1027.b: "不要摊位，我自己去人群里叫卖。"
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "外国钱币"
 gdp_trade_good_flavor.1028.desc: "[tgf_source_county.GetNameNoTier]的一名买家[tgf_buyer.GetFirstName]想要用[tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]买我的[tgf_good.Custom('GetTradeGood')]。“钱就是钱，”[tgf_buyer.GetSheHe]说。\n\n钱就是钱，我同意，然后告诉[tgf_buyer.GetHerHim]这钱对我值多少。[tgf_buyer.GetSheHe|U]笑不出来了。"
 gdp_trade_good_flavor.1028.a: "行，银子就是银子。"
 gdp_trade_good_flavor.1028.b: "按我的价，不然拉倒。"
 gdp_trade_good_flavor.1028.c: "改用[tgf_good_b.Custom('GetTradeGood')]付我。"
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "路上的岁月"
 gdp_trade_good_flavor.1029.desc: "“这条路运输你的[tgf_good.Custom('GetTradeGood')]三年了，”我的贸易负责人[tgf_trader.GetFirstName]举杯说。“我负责这条路时一[tgf_good.Custom('GetTradeGoodUnit')]都没丢！”\n\n[tgf_trader.GetSheHe|U]其实丢了五[tgf_good.Custom('GetTradeGoodUnit')]。但今晚，我让[tgf_trader.GetHerHim]享受这份荣耀。"
 gdp_trade_good_flavor.1029.a: "你做得很好！"
 gdp_trade_good_flavor.1029.b: "敬未来三年。"
 gdp_trade_good_flavor.1029.c: "下次走得更远，远得多。"
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "看着它卖"
 gdp_trade_good_flavor.1030.desc: "“那是真正的‘[ROOT.Char.GetHouse.GetName][tgf_good.Custom('GetTradeGood')]’，没错。”[tgf_source_county.GetNameNoTier]市场的一个买家指着我的一[tgf_good.Custom('GetTradeGoodUnitPlural')][tgf_good.Custom('GetTradeGood')]说。“[tgf_good.Custom('GetTgfGoodLook')|U]！”\n\n[tgf_buyer.GetSheHe|U]完全不知道一个[ROOT.Char.GetHouse.GetName]家族的人就站在[tgf_buyer.GetHerHim]身后。\n\n我可以开口说些什么，也可以只是享受这一刻。"
 gdp_trade_good_flavor.1030.a: "什么都不说，听他们想要什么。"
 gdp_trade_good_flavor.1030.b: "确实是，这我还能不清楚？"
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "外部资金"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName]和[tgf_investor_b.GetFirstName]，[tgf_source_county.GetNameNoTier]的两位[tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')]，多年来一直买我的[tgf_good.Custom('GetTradeGood')]。如今他们想分一杯羹。\n\n“让我们入股你的生意，”[tgf_investor_a.GetFirstNameNoTooltip]说，而[tgf_investor_b.GetFirstNameNoTooltip]数着钱。“我们出资不菲，而且不多过问。”\n\n他们会过问的，投资人总是如此。"
 gdp_trade_good_flavor.1031.a: "你出钱，我分一部分利润。"
 gdp_trade_good_flavor.1031.b: "这门生意要留在家族内部。"
 gdp_tgf_kept_in_family_unity_desc: "把生意留在家族内部"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "陈列室"
 gdp_trade_good_flavor.1032.desc: "“[tgf_good.Custom('GetTgfGoodIsThat')][tgf_good.Custom('GetTradeGood')]吗？”每位访客都在我的大厅里停下来问。[tgf_good.Custom('GetTgfGoodItIs')]：我拥有的最好的，[tgf_good.Custom('GetTgfGoodLook')]，摆在没人能错过[tgf_good.Custom('GetTgfGoodItThem')]的地方。\n\n没人离开我家时会不知道我在卖什么。"
 gdp_trade_good_flavor.1032.desc.livestock: "“那些是[tgf_good.Custom('GetTradeGood')]吗？”每位访客问，小心翼翼地绕过它们。没错：我拥有的最好的，[tgf_good.Custom('GetTgfGoodLook')]，拴在没人能错过的地方。\n\n没人离开我家时会不知道我在卖什么，也没人在离开前会不检查一下自己的鞋子。"
 gdp_trade_good_flavor.1032.a: "让他们看，消息会传开。"
 gdp_trade_good_flavor.1032.b: "拿走，算我送的。"
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "保持手感"
 gdp_trade_good_flavor.1033.desc: "一位老供货商写信给我：“今年最好的[tgf_good.Custom('GetTradeGood')]我给你留着了，还是老价钱。你就不再多买些吗？”\n\n我已不再做那门生意，可我看[tgf_good.Custom('GetTradeGood')]的眼力依旧毒辣。像我这样的眼力是能换钱的——只要我还继续用它。"
 gdp_trade_good_flavor.1033.a: "回信，保持眼力锐利。"
 gdp_trade_good_flavor.1033.b: "我的知识是用来赚钱的。你得付钱。"
 gdp_trade_good_flavor.1033.c: "随它去，我有新行当了。"
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "行程日志"
 gdp_trade_good_flavor.1034.desc: "寄宿在[tgf_source_county.GetNameNoTier]的朝圣者[tgf_pilgrim.GetFirstName]拍了拍一本破旧的小书。“从这里到海边，每一条路、每一家客栈、每一个渡口，都记在这里面。而在页边空白处，还记着每一个肯以不错的价格收购[tgf_good.Custom('GetTradeGood')]的市场。出个价，它就是你的了。”\n\n它走过的路，比我任何一辆货车都远。"
 gdp_trade_good_flavor.1034.a: "开价吧，朝圣者。"
 gdp_trade_good_flavor.1034.b: "今晚把它抄下来，明早还回去。"
 gdp_trade_good_flavor.1034.c: "就告诉我你在市场看到了什么。"
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "谈生意"
 gdp_trade_good_flavor.1035.desc: "“那你是做什么买卖的？”我的客人[tgf_guest.GetFirstName]在晚饭后散步时问道。这一问可糟了。等我解释完我怎么弄到我的[tgf_good.Custom('GetTradeGood')]——[tgf_good.Custom('GetTgfGoodMade')]——我们已经把整个市场走了两圈。\n\n[tgf_guest.GetSheHe|U]一次也没试着转移话题。于是我知道，自己碰上了一个买家。"
 gdp_trade_good_flavor.1035.a: "我们边吃甜点边谈条款，如何？"
 gdp_trade_good_flavor.1035.b: "不说我的了。你是从哪儿进货的？"
 gdp_trade_good_flavor.1035.c: "让我告诉你我怎么靠它赚到第一桶金。"
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "包装层"
 gdp_trade_good_flavor.1036.desc: "“每辆车上多装三分之一[tgf_good.Custom('GetTradeGoodUnitPlural')]，”我的贸易负责人[tgf_trader.GetFirstName]一边示范给我看，一边说道，“有些货会在路上裂开，买家会抱怨。但大多数不会。”\n\n“大多数”是我喜欢的数字。“有些”是我能接受的数字。"
 gdp_trade_good_flavor.1036.a: "塞紧些，利润就藏在缝隙里。"
 gdp_trade_good_flavor.1036.b: "好好装车。买家会根据打开的第一件货来评判整批货。"
 gdp_trade_good_flavor.1036.c: "别动它，毕竟一直没出过岔子。"
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "市场印章"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "一名市场官员，负责检查商品品质与真实度量，并给合格的商品盖上铅封或蜡封。许多城镇禁止出售没有盖章的布匹和其他商品，盖印官每盖一个印收一次费。"
 gdp_trade_good_flavor.1037.desc: "“有印章的货卖得更贵，这谁都知道，”[tgf_source_county.GetNameNoTier]市场的[Glossary( '盖印官', 'TGF_SEALER_GLOSS' )][tgf_sealer.GetFirstName]坐在工位上头也不抬地说，“而且我按收钱的顺序盖，不是按要求的顺序。”\n\n我一车车的[tgf_good.Custom('GetTradeGood')]在太阳下等着。我的利润也是。"
 gdp_trade_good_flavor.1037.a: "那就等吧，盖了印就行。"
 gdp_trade_good_flavor.1037.b: "给，现在盖快点。"
 gdp_trade_good_flavor.1037.c: "我的名字就是够分量的印章。"
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "掮客"
 gdp_trade_good_flavor.1038.desc: "“我认识一些你从没听说过的买家，在你从没去过的城镇里，”[tgf_source_county.GetNameNoTier]市场的掮客[tgf_broker.GetFirstName]说，给我倒了一杯我没要的酒。“你的[tgf_good.Custom('GetTradeGood')]，他们的钱，我的抽成。”\n\n三方，只有一方免费喝了一杯。"
 gdp_trade_good_flavor.1038.a: "找到他们，拿你的抽成。"
 gdp_trade_good_flavor.1038.b: "我会自己找买家，谢谢。"
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "贸易负责人的学徒"
 gdp_trade_good_flavor.1039.desc: "“这家伙算账比我还快，”我的贸易负责人[tgf_trader.GetFirstName]把一个叫[tgf_youth.GetFirstName]的瘦弱少年推上前。[tgf_youth.GetFirstNameNoTooltip]在我开口询问之前，就说出了我们两个市场里[tgf_good.Custom('GetTradeGood')]的价格。\n\n聪明的孩子养着要花钱。但为我做事的聪明孩子，能把花的全挣回来。"
 gdp_trade_good_flavor.1039.a: "把[tgf_youth.GetFirstNameNoTooltip]留在我身边。"
 gdp_trade_good_flavor.1039.b: "留下这孩子，[tgf_trader.GetFirstNameNoTooltip]。好好教。"
 gdp_trade_good_flavor.1039.c: "我们吃饭的嘴已经够多了。"
 gdp_tgf_family_only_unity_desc: "把商会留给了家族"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "泡在里面"
 gdp_trade_good_flavor.1040.desc: "深夜，仓库只有我一人：[tgf_good.Custom('GetTgfGoodLook')]，堆得比我还高。我抓了一把，让它们一[tgf_good.Custom('GetTgfGoodSmallest')][tgf_good.Custom('GetTgfGoodSmallest')]从指间流过。\n\n一个念头爬了上来。如果我……#EMP 在里面游个泳呢？#!"
 gdp_trade_good_flavor.1040.a: "跳进去，像鸭子一样快乐！"
 gdp_trade_good_flavor.1040.a.toast: "硬着陆"
 gdp_trade_good_flavor.1040.b: "不，每一[tgf_good.Custom('GetTgfGoodSmallest')]数清楚了。"
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "第一笔买卖"
 gdp_trade_good_flavor.1041.desc: "清理旧箱子时，我找到了它，用布包着：我卖出的第一[tgf_good.Custom('GetTgfGoodSmallest')][tgf_good.Custom('GetTradeGood')]。几年前我以两倍价格买了回来。\n\n没人看见时，我把它举到光下，告诉它我们走了多远。此后我赚的每一枚钱币都是它的孩子。"
 gdp_trade_good_flavor.1041.a: "装框，挂在我能看见的地方。"
 gdp_trade_good_flavor.1041.b: "我崛起的标志。有人会为这个付钱。"
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "枕头下的钱币"
 gdp_trade_good_flavor.1042.desc: "“晚安，钱币们。”我现在每晚都这么说，对着枕头下的钱袋：这一季我的[tgf_good.Custom('GetTradeGood')]赚来的全部。\n\n这是我有过的最硬的枕头，也是唯一一个值大笔财富的枕头。"
 gdp_trade_good_flavor.1042.a: "睡在上面，睡在全部钱币上面。"
 gdp_trade_good_flavor.1042.b: "放在枕头下没用。再买更多[tgf_good.Custom('GetTradeGood')]。"
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "钱币与肖像"
 gdp_trade_good_flavor.1043.desc: "“你就坐在桌旁。你的[tgf_good.Custom('GetTradeGood')]放到一边，你的钱币放到另一边，”路过[tgf_source_county.GetNameNoTier]的画家[tgf_painter.GetFirstName]说道，并用[tgf_painter.GetHerHis]的拇指给我取景，“每一枚钱币都画上，每一枚都[Glossary( '点清', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )]。”\n\n我喜欢会数数的[tgf_painter.GetWomanMan]。"
 gdp_trade_good_flavor.1043.a: "画吧，每一枚钱币都画上。"
 gdp_trade_good_flavor.1043.b: "把钱币画……#EMP 大一点。#!"
 gdp_trade_good_flavor.1043.c: "画家不是顾客。"
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "商人和货币兑换商喜欢在工作时被绘制肖像，周围是他们的钱币和秤。彼得鲁斯·克里斯图斯在1449年画了一位金匠正在为一对订婚情侣称量戒指。"
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "太重的钱袋"
 gdp_trade_good_flavor.1044.desc: "“[ROOT.Char.Custom('FormOfAddressForLiege')]，要不要再叫一个仆人来？”[tgf_servant.GetFirstName]问。我的钱袋，装满这一季的[tgf_good.Custom('GetTradeGood')]钱，现在需要一名仆人在我身后扛着。\n\n我在考虑搞一辆车。"
 gdp_trade_good_flavor.1044.a: "是的，两个人。走慢点。"
 gdp_trade_good_flavor.1044.b: "不，搞一辆车。上面写上我的名字！"
 gdp_trade_good_flavor.1044.c: "先去[tgf_good.Custom('GetTradeGood')]市场，[tgf_servant.GetFirstNameNoTooltip]。"
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "利润与虔诚"
 gdp_trade_good_flavor.1045.desc: "我的账簿按[Glossary( '老方法', 'TGF_DATINI_GLOSS' )]开头，写着以[ROOT.Char.GetFaith.HighGodName]和利润的名义。今年，利润写了四十页，没有一枚钱币给了[ROOT.Char.GetFaith.HighGodName]。\n\n任何商人都知道合伙人该得公平的一份。"
 gdp_trade_good_flavor.1045.a: "给我上面的合伙人公平的分成。"
 gdp_trade_good_flavor.1045.b: "与[ROOT.Char.GetFaith.HighGodName]静静共处一小时，然后回到账簿上。"
 gdp_trade_good_flavor.1045.c: "这都是[ROOT.Char.GetFaith.HighGodName]的意思。停下来太无礼了。"
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "在《律法书》、《圣经》和《古兰经》中讲述的若瑟的故事里，埃及统治者梦见七头肥壮的母牛被七头干瘦的母牛吃掉。若瑟将其解读为七个丰年和七个荒年，埃及及时填满了粮仓。"
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "普拉托商人弗朗切斯科·达蒂尼，在账簿开头写下“以天主和利润的名义”，他去世时是托斯卡纳最富有的人之一。"
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "他们自己人"
 gdp_trade_good_flavor.1046.desc: "“[tgf_source_county.GetNameNoTier]有一半是像我这样的[tgf_source_culture.GetCollectiveNoun]人，”我的贸易负责人[tgf_trader.GetFirstName]告诉我，“对我敞开的门对你关着。对我降的价从不对像你这样的[ROOT.Char.GetCulture.GetCollectiveNoun]人降。”\n\n[tgf_trader.GetFirstNameNoTooltip]说这话是好意。我选择只听关于价格的那部分。"
 gdp_trade_good_flavor.1046.a: "从现在起，你来谈。"
 gdp_trade_good_flavor.1046.b: "给，别让任何人把你挖走。"
 gdp_trade_good_flavor.1046.c: "那么，我会学习他们的习俗。"
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "市场泛滥"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetHouse.GetBaseNameNoTooltip][tgf_rival.Custom('GetTgfCompanyWord')]的[tgf_rival.GetFirstName]在[tgf_source_county.GetNameNoTier]以比运到那里的成本价还低的价格出售[tgf_good.Custom('GetTradeGood')]。我的贸易负责人[tgf_trader.GetFirstName]气坏了。\n\n我倒是挺好奇。那么便宜的东西，总该有人买。最好是我。"
 gdp_trade_good_flavor.1047.a: "如果[tgf_rival.GetFirstNameNoTooltip]想白送，那我就收下了。"
 gdp_trade_good_flavor.1047.b: "让[tgf_rival.GetFirstNameNoTooltip]亏本卖，我的[tgf_good.Custom('GetTradeGood')]不动。"
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "包裹里的手稿"
 gdp_trade_good_flavor.1048.desc: "[tgf_source_county.GetNameNoTier]有人把我最后一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]用旧纸页包着防潮。我的贸易负责人[tgf_trader.GetFirstName]小心地把书页展开。“一本[Glossary( '书', 'TGF_HOUSE_OF_WISDOM_GLOSS' )]，或者说大半本。有人会想念这个。”\n\n我付的是[tgf_good.Custom('GetTradeGood')]的钱。书是白来的，却可能更值钱。"
 gdp_trade_good_flavor.1048.a: "我会留着它。"
 gdp_trade_good_flavor.1048.b: "和[tgf_good.Custom('GetTradeGood')]一起卖掉。"
 gdp_trade_good_flavor.1048.c: "送回[tgf_source_county.GetNameNoTierNoTooltip]。"
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "书在商人的行囊中穿越国界。在巴格达的智慧宫，学者们将希腊、波斯和印度的著作翻译成阿拉伯语，许多又从那里传到拉丁语世界。"
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "家乡来的商人"
 gdp_trade_good_flavor.1049.desc: "我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]写信来。“这里有一整片[Glossary( '城区', 'TGF_DIASPORA_GLOSS' )]都是[ROOT.Char.GetCulture.GetCollectiveNoun]人，远离家乡，想念家乡。在家乡的每个人都知道[ROOT.Char.GetHouse.GetBaseNameNoTooltip]家族的名号。他们在这里听到这个名字时，都会围拢过来 。”\n\n原来，乡愁也是有市场的。"
 gdp_trade_good_flavor.1049.a: "像在家乡一样卖给他们。"
 gdp_trade_good_flavor.1049.b: "把他们中最年长的带回我的商会。"
 gdp_trade_good_flavor.1049.c: "家乡的味道值得付钱。"
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "定居国外的商人建立了自己的城区：丝绸之路沿途的粟特人，君士坦丁堡的威尼斯人，从开罗到阿丹的犹太商人。家乡的亲族通过他们从事贸易。"
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "[tgf_good.GetNameNoTooltip]之路"
 gdp_trade_good_flavor.1050.desc: "我被介绍给[tgf_source_county.GetNameNoTier]的[Glossary( '走私者', 'TGF_SMUGGLER_GLOSS' )][tgf_smuggler.GetFirstName]，[tgf_smuggler.GetSheHe]有一个诀窍：每辆车最上面那一[tgf_good.Custom('GetTradeGoodUnit')]装最次的货——[tgf_good.Custom('GetTgfGoodFlaw')]——这样[tgf_market_holder.GetTitledFirstNamePossessive]的税吏就从不往下深挖。\n\n“半价，”[tgf_smuggler.GetFirstNameNoTooltip]说。“最上面那一[tgf_good.Custom('GetTradeGoodUnit')]以下，全是上等货。”"
 gdp_trade_good_flavor.1050.a: "半价是我最喜欢的价格。"
 gdp_trade_good_flavor.1050.a.toast: "消息走漏"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip]会感激我的。为你的脑袋。"
 gdp_trade_good_flavor.1050.c: "骗税吏？你被录用了。"
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "无论统治者在何处对商品征税，走私者总能绕过他们。盐几乎在所有地方都被征税，也造就了最富有的走私者——黄巢，中国唐代的私盐贩子，他领导了一场起义，攻占了大唐的首都长安。"
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "丰收"
 gdp_trade_good_flavor.2001.desc: "消息从我购买[tgf_good.Custom('GetTradeGood')]的[tgf_source_county.GetNameNoTier]传来。[tgf_source_culture.GetName]农民获得了几十年一遇的大丰收，仓库都装不下了。\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "消息从我购买[tgf_good.Custom('GetTradeGood')]的[tgf_source_county.GetNameNoTier]传来。[tgf_source_culture.GetName]牧民迎来了几十年一遇的好年景。每个围栏都满了，草都不够它们吃。\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "他们的好年景，我的好价钱。"
 gdp_trade_good_flavor.2001.a: "趁他们庆祝时锁定价格。"
 gdp_trade_good_flavor.2001.b: "骑马出去，学他们怎么种地。"
 gdp_trade_good_flavor.2001.b.livestock: "骑马出去，学他们怎么养殖。"
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "猎人的收获"
 gdp_trade_good_flavor.2002.desc: "“[tgf_source_county.GetNameNoTier]的[tgf_good.Custom('GetTgfGoodGatherers')]这回可真是超常发挥，”我的贸易负责人[tgf_trader.GetFirstName]告诉我，“一季的[tgf_good.Custom('GetTradeGood')]一次交付，还是他们送过的最好的一批。报价已经源源不断地来了。”\n\n全卖掉，还是留下最上等的那一件？商人最甜蜜的烦恼。"
 gdp_trade_good_flavor.2002.a: "趁价高全卖掉。"
 gdp_trade_good_flavor.2002.b: "最好的一件留给我。"
 gdp_trade_good_flavor.2002.c: "全部摆上摊位，每个人都能买到一点。"
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "富矿"
 gdp_trade_good_flavor.2003.desc: "我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]的路上笑着回来。“一个新矿层——品位高、埋藏浅，全伯爵领的挖掘者都排队去挖。现在[tgf_good.Custom('GetTradeGood')]便宜。如果我们入股，会更便宜。”\n\n我从没见过哪条矿层能长久便宜下去。"
 gdp_trade_good_flavor.2003.desc.amber: "我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]的路上笑着回来。“秋季风暴冲上来的[tgf_good.Custom('GetTradeGood')]比任何人记得的都多，岸上每家每户都出来捡。现在[tgf_good.Custom('GetTradeGood')]便宜。如果我们#EMP 付钱#!给采集者，会更便宜。”\n\n大海不会一直这么慷慨。"
 gdp_trade_good_flavor.2003.a: "入股矿场。"
 gdp_trade_good_flavor.2003.a.amber: "付钱给采集者。"
 gdp_trade_good_flavor.2003.b: "趁货源充足，赶紧买入。"
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "物有所值"
 gdp_trade_good_flavor.2004.desc: "“一种全新的颜色！”我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]千里迢迢带回了一份样品，染坊所有人发誓说，这秘方别无他人掌握。\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "“一种全新的釉料！”我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]千里迢迢带回了一份样品，工坊所有人发誓说，这秘方别无他人掌握。\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "秘方昂贵，独家秘方更是物有所值。"
 gdp_trade_good_flavor.2004.a: "开个价吧，秘方归我了。"
 gdp_trade_good_flavor.2004.b: "欣赏它，记下它，然后继续。"
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "品鉴货物"
 gdp_trade_good_flavor.2005.desc: "商人必须了解自己的货品。因此我品尝了自己的[tgf_good.Custom('GetTradeGood')]——第一口是出于职责，第二口是为了确认，之后就纯粹是为了享受。到了晚上，整[tgf_good.Custom('GetTradeGoodUnit')]都被我吃光了。\n\n味道很好。那些[tgf_source_culture.GetCollectiveNoun]人愿意出双倍价钱买下它。"
 gdp_trade_good_flavor.2005.a: "双倍，他们将支付双倍。"
 gdp_trade_good_flavor.2005.b: "嗯，纯粹为了确认品质。再来一份。"
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "盛装出行"
 gdp_trade_good_flavor.2006.desc: "要想卖出[tgf_good.Custom('GetTradeGood')]，就得自己穿上[tgf_good.Custom('GetTradeGood')]。我穿着自家库存里最上等的货来到市场，注意到不少买家都特意多打量了几眼。\n\n商品会自己说话。我只是把它们穿在身上而已。"
 gdp_trade_good_flavor.2006.a: "它很合身，留着吧。"
 gdp_trade_good_flavor.2006.a.tt_furs: "你从此将披上你的毛皮斗篷"
 gdp_trade_good_flavor.2006.a.tt_leather: "你从此将披上你的皮革斗篷"
 gdp_trade_good_flavor.2006.a.tt_silk: "你从此将披上你的丝绸斗篷"
 gdp_trade_good_flavor.2006.a.tt_textiles: "你从此将披上你的精美斗篷"
 gdp_trade_good_flavor.2006.b: "让货物自己说话。"
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "面值"
 gdp_trade_good_flavor.2007.desc: "“新[tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')]上会印着我的脸，”[tgf_market_holder.GetTitledFirstName]告诉我，“并用你的[tgf_good.Custom('GetTradeGood')]制成。我要稳定的供应，按友情价。”\n\n[tgf_market_holder.GetHerHis|U]的脸，我的金属，一种钱币。历史会记住我们两个。"
 gdp_trade_good_flavor.2007.a: "友情价！铸的第一枚给我。"
 gdp_trade_good_flavor.2007.b: "全价，钱就是钱。"
 gdp_trade_good_flavor.2007.c: "友情价？我还有更要紧的事。"
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "完好无损"
 gdp_trade_good_flavor.2008.desc: "“一[tgf_good.Custom('GetTradeGoodUnit')]都没少，”我的贸易负责人[tgf_trader.GetFirstName]十分得意地告诉我，“没有东西腐坏，没有东西破损，也没有东西失窃。每一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]都和出发时一模一样，完好送到了。”\n\n这不是运气，是本事。而本事是可以教给别人的。"
 gdp_trade_good_flavor.2008.a: "让我看看你是怎么打包的。"
 gdp_trade_good_flavor.2008.b: "技艺精湛，令人印象深刻。"
 gdp_trade_good_flavor.2008.c: "告诉买家，完好的货售价更高。"
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "他人眼中的军队"
 gdp_trade_good_flavor.2009.desc: "战火已经烧到了[tgf_market_holder.GetTitledFirstName]的领地，而战争会消耗大量[tgf_good.Custom('GetTradeGood')]。[tgf_market_holder.GetHerHis|U]的军需官买下了我这条商路能运的所有货物，还追问下一批货什么时候能到。\n\n其他人眼中的是军队，我眼中的是客户。"
 gdp_trade_good_flavor.2009.a: "预支的战争财。"
 gdp_trade_good_flavor.2009.b: "我现在就要书面的特权。"
 gdp_trade_good_flavor.2009.c: "记住是谁给的你们武装。"
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "行会敲门"
 gdp_trade_good_flavor.2010.desc: "[tgf_source_county.GetNameNoTier]的[tgf_source_culture.GetName]行会给我写了一封信信，措辞非常客气。我的价格压低了他们的利润，他们希望我们共同商定一个价格，免得有人亏损。\n\n行会敲门时很客气，但只敲一次。"
 gdp_trade_good_flavor.2010.a: "交会费，把价格定下。"
 gdp_trade_good_flavor.2010.b: "让他们放马过来。"
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "统治者定义时尚"
 gdp_trade_good_flavor.2011.desc: "消息传得比车还快：[tgf_market_holder.GetTitledFirstName]在[tgf_source_county.GetNameNoTier]的整个宫廷面前穿了我的[tgf_good.Custom('GetTradeGood')]，一半人已经在打听这是哪来的。\n\n统治者定义时尚，商人定义价格。"
 gdp_trade_good_flavor.2011.a: "告诉所有人那是谁的[tgf_good.Custom('GetTradeGood')]。"
 gdp_trade_good_flavor.2011.b: "趁他们着迷时涨价。"
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "品尝商品"
 gdp_trade_good_flavor.2012.desc: "成[tgf_good.Custom('GetTradeGoodUnitPlural')]的[tgf_good.Custom('GetTradeGood')]回望着我。这个月糟透了，我脑子一直静不下来，而身边全是钱能买到的最好的酒。\n\n这是把控品质，没人需要知道过程。"
 gdp_trade_good_flavor.2012.a: "把控品质。全部。"
 gdp_trade_good_flavor.2012.a.toast: "多尝了一杯"
 gdp_trade_good_flavor.2012.b: "不，库存就是库存。"
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "大师的订单"
 gdp_trade_good_flavor.2013.desc: "“把你最好的[tgf_good.Custom('GetTradeGood')]给我，再付一笔大师的酬金，”[tgf_crafter.GetFirstName]，也就是[tgf_source_county.GetNameNoTier]手艺最好的[tgf_good.Custom('GetTgfGoodCrafter')]说道，“我就给你做一样前所未见的东西。”\n\n我的钱包还在斟酌，我的自尊心已经先答应下来了。"
 gdp_trade_good_flavor.2013.a: "钱我出了，让我见识见识吧。"
 gdp_trade_good_flavor.2013.b: "我的商品无需任何装饰。"
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "他们的菜品，我们的商品"
 gdp_trade_good_flavor.2014.desc: "“现在他们会把你的[tgf_good.Custom('GetTradeGood')]加进他们的[tgf_source_province.Custom('GetTgfLocalDish')]里，”我的贸易负责人[tgf_trader.GetFirstName]一边吃东西一边说，“[tgf_source_county.GetNameNoTier]所有人都这么做。厨师们管这叫新做法，已经没人记得老做法了。”\n\n我甚至从未尝过他们的[tgf_source_province.Custom('GetTgfLocalDish')]。我从未这样自豪过。"
 gdp_trade_good_flavor.2014.a: "那就让他们为新做法付钱吧。"
 gdp_trade_good_flavor.2014.b: "再派几辆车去。厨子们正饿着呢。"
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "以货代款"
 gdp_trade_good_flavor.2015.desc: "“我们想要更多的钱，”[tgf_spokesperson.GetFirstName]代表[tgf_source_county.GetNameNoTier]的[tgf_good.Custom('GetTgfGoodGatherers')]说道。我提出给他们[tgf_good.Custom('GetTradeGood')]作为替代。\n\n“这东西就是你们采来的，”我指出，“你们肯定喜欢它吧！”\n\n他们并不喜欢。"
 gdp_trade_good_flavor.2015.a: "付钱吧，用硬币。"
 gdp_trade_good_flavor.2015.b: "把部分利润分给他们。"
 gdp_trade_good_flavor.2015.c: "货物也是报酬。"
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "钱不发臭"
 gdp_trade_good_flavor.2016.desc: "“臭死了，”[tgf_source_county.GetNameNoTier]的一位买家说着，伸长胳膊把我的[tgf_good.Custom('GetTradeGood')]远远拿开。[tgf_good.Custom('GetTgfGoodFlaw')|U]，他们这么告诉我。\n\n我接过买家的钱币，凑过去闻了闻。[Glossary( '一点气味都没有', 'TGF_PECUNIA_NON_OLET_GLOSS' )]。"
 gdp_trade_good_flavor.2016.a: "那就卖给感冒的买家。"
 gdp_trade_good_flavor.2016.b: "也许有什么办法能盖住这气味？"
 gdp_trade_good_flavor.2016.c: "把钱币放在我鼻子底下。一整天。"
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G 钱不发臭#!——据说罗马皇帝韦斯巴芗曾将一枚对公共厕所征税得来的钱币拿到他儿子鼻下，以阐明这个道理。"
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "七个丰年"
 gdp_trade_good_flavor.2017.desc: "我梦见七头肥母牛和七头瘦母牛[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]。我醒过来，在早饭前就算完了账目。\n\n不管荒年的开销是多少，我的[tgf_good.Custom('GetTradeGood')]能卖出更高的价钱。"
 gdp_trade_good_flavor.2017.a: "全部囤积起来。一[tgf_good.Custom('GetTradeGoodUnit')]也不放过。"
 gdp_trade_good_flavor.2017.b: "趁现在便宜，多买一些。"
 gdp_trade_good_flavor.2017.c: "牛不是账本。回去睡吧。"
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "某人的牛群"
 gdp_trade_good_flavor.2018.desc: "我出门时，发现我的大门被一整群[tgf_good.Custom('GetTradeGood')]堵住了，我的贸易负责人[tgf_trader.GetFirstName]站在畜群中间咧着嘴笑。“一个叫[tgf_raider.GetFirstName]的[Glossary( '劫掠者', 'TGF_CATTLE_RAID_GLOSS' )]，把这些东西从[tgf_market_holder.GetTitledFirstNamePossessive]的牧场带了过来。别问是怎么弄来的，只要市价的一半。”\n\n每一头的侧腹上，都打着[tgf_market_holder.GetFirstNamePossessiveNoTooltip|U]的烙印。\n\n“这些烙印，”[tgf_trader.GetFirstNameNoTooltip]补充道，“可以处理掉。”"
 gdp_trade_good_flavor.2018.a: "交易就是交易，管它什么烙印。"
 gdp_trade_good_flavor.2018.a.toast: "有人认出了烙印"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U]明知牲畜是从[CHARACTER.GetShortUINamePossessive]那偷来的，却仍然将它们买下。"
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U]明知牲畜是从[TARGET_CHARACTER.GetShortUINamePossessive]那偷来的，却仍然将它们买下。"
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip]会为此欠我一个人情。"
 gdp_trade_good_flavor.2018.c: "迅速宰杀它们。"
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "劫掠邻居的畜群曾是一项古老的消遣，也是一桩严肃的营生。爱尔兰的伟大史诗《夺牛记》便讲述了一场因一头公牛而引发的战争。"
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "禁酒宫廷的渴求"
 gdp_trade_good_flavor.2019.desc: "“[tgf_market_holder.GetTitledFirstNamePossessive]的宫廷从不饮用[tgf_good.Custom('GetTradeGood')]，”我的贸易负责人[tgf_trader.GetFirstName]告诉我，“但[tgf_market_holder.GetTitledFirstNamePossessiveNoTooltip]的宫廷也向我们订购了四十[tgf_good.Custom('GetTradeGoodUnitPlural')]。这两件事显然都是真的。”\n\n[tgf_market_holder.GetFirstNamePossessiveNoTooltip]的信仰[Glossary( '禁止饮酒', 'TGF_ABU_NUWAS_GLOSS' )]，但没有任何教义禁止漫天要价。"
 gdp_trade_good_flavor.2019.a: "将酒桶贴上醋的标记。"
 gdp_trade_good_flavor.2019.b: "价格翻倍。他们能向谁抱怨呢？"
 gdp_trade_good_flavor.2019.b.toast: "另一个供应商"
 gdp_trade_good_flavor.2019.b.toast_good: "全额支付"
 gdp_trade_good_flavor.2019.c: "不值得我冒险。去别处卖吧。"
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "酒虽然在许多宫廷中遭到禁止，却仍受大部分人的喜爱。哈里发哈伦·拉希德宫廷中的诗人阿布·努瓦斯，用阿拉伯语创作了一批最优秀的饮酒诗。"
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "完美的奶酪"
 gdp_trade_good_flavor.3001.desc: "还没看到奶酪，仓库里就已经弥漫着它的气味。那是一轮成熟度极高、风味极浓郁的奶酪，搬运工们半开玩笑地给它安排了一名守卫。半开玩笑，半是认真。\n\n把它卖掉，换来的钱能置办一场盛宴。把它留着，它本身就是一场盛宴。"
 gdp_trade_good_flavor.3001.a: "用你们的生命守护好它。"
 gdp_trade_good_flavor.3001.b: "万物皆有价，再完美也不例外。"
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "著名的投诉"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "已知最古老的客户投诉：一块来自乌尔的泥板，距今已有近三千年的历史。在这块泥板上，一位名叫南尼的人斥责商人埃亚‑纳西尔交付了劣质铜锭，并以轻蔑的态度对待他的信使。"
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName]写信说我的铜成色不佳，锭重不足。确实如此。\n\n“你把我当成什么人了，竟然如此[Glossary( '轻蔑', 'TGF_EA_NASIR_GLOSS' )]地对待像我这样的人？ ”\n\n我只把[tgf_market_holder.GetHerHim]当好主顾。[tgf_market_holder.GetSheHe|U]已经付过钱了。"
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.GetSheHe|U]会再次购买的。[tgf_market_holder.GetSheHe|U]向来如此。"
 gdp_trade_good_flavor.3002.a.toast: "没有下次了"
 gdp_trade_good_flavor.3002.a.toast_good: "再次光顾"
 gdp_trade_good_flavor.3002.b: "我的铜货真价实，让[tgf_market_holder.GetHerHim]来检验吧！"
 gdp_trade_good_flavor.3002.b.toast_bad: "被抓包"
 gdp_trade_good_flavor.3002.b.toast_good: "检验通过"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U]向[CHARACTER.GetShortUIName]出售了轻质锭，却发誓它们货真价实。"
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U]向[TARGET_CHARACTER.GetShortUIName]出售了轻质锭，却发誓它们货真价实。"
 gdp_trade_good_flavor.3002.c: "抱歉，下次会提供更好的锭。"
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "胡椒付款"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "胡椒的价值几乎和等重的白银相当，常被用作支付手段。在伦敦，埃塞尔雷德国王于大约公元1000年颁布的法令里，就规定德意志商人的部分通行费要用胡椒来缴纳。"
 gdp_trade_good_flavor.3003.desc: "我在[tgf_source_county.GetNameNoTier]的债务人[tgf_debtor.GetFirstName]，现在已身无分文。于是[tgf_debtor.GetSheHe]改用[Glossary( '胡椒', 'TGF_PEPPER_GLOSS' )]抵债，一[tgf_good.Custom('GetTradeGoodUnit')]一[tgf_good.Custom('GetTradeGoodUnit')]地支付，直到我的桌子闻起来像个香料市场。\n\n我清点两遍，折算比例不算差。而且[tgf_debtor.GetFirstNameNoTooltip]肯定不是唯一一个这样做的人。"
 gdp_trade_good_flavor.3003.a: "从今往后，我接受胡椒。"
 gdp_trade_good_flavor.3003.b: "要钱币，去凑齐了。"
 gdp_trade_good_flavor.3003.c: "为我效力。债务可以暂缓。"
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "满是抱怨的信"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "商人们的信件被保存了几个世纪——比如保存在开罗秘库（一个存放废弃纸张的犹太会堂储藏室）中的那些——以详尽而委屈的细节记录了地中海贸易。亚麻商抱怨得最多。"
 gdp_trade_good_flavor.3004.desc: "我的贸易负责人[tgf_trader.GetFirstName]在[tgf_source_county.GetNameNoTier]以不错的价钱卖出了我的每一捆亚麻。[tgf_trader.GetHerHis|U]在[Glossary( '信件', 'TGF_GENIZA_GLOSS' )]中是这么说的——只用了一行。其余四十行在抱怨：湿气、脚夫、买家、我的包装。\n\n利润在前，抱怨在后。要是反过来，我才该担心。"
 gdp_trade_good_flavor.3004.a: "一行利润，我读了两遍。"
 gdp_trade_good_flavor.3004.b: "四十行免费建议。"
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "精巧糖雕"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "一种在宴会菜肴间端上的用糖和杏仁膏制成的展示品——城堡、船只和野兽，精雕细琢令客人惊叹。最宏大的精巧糖雕既是政治声明，也是甜点。"
 gdp_trade_good_flavor.3005.desc: "“[tgf_market_holder.GetTitledFirstName]想要一只糖[ROOT.Char.Custom('GetRandomRegionalBird')]，”我的贸易负责人[tgf_trader.GetFirstName]告诉我。“两倍于实物大小，纤毫毕现，仲夏前放在[tgf_market_holder.GetHerHis]桌上。一座[Glossary( '精巧糖雕', 'TGF_SUBTLETY_GLOSS' )]能将[tgf_market_holder.GetHerHis]的宴会推向高潮。”\n\n糖会融化，名声却长存。"
 gdp_trade_good_flavor.3005.a: "我来做，比实物更大。"
 gdp_trade_good_flavor.3005.a.success: "宴会震撼得说不出话"
 gdp_trade_good_flavor.3005.a.failure: "一只歪鸟"
 gdp_trade_good_flavor.3005.b: "宴会价格买宴会作品。"
 gdp_trade_good_flavor.3005.c: "我卖糖，不卖雕塑。"
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "蜂群"
 gdp_trade_good_flavor.3006.desc: "蜜蜂不请自来，在椽子之间筑巢，现在在我的仓库里产蜜，一分租金也不付。\n\n这些是以蜂蜜付租的房客。这样的安排也不算太糟——只要不去计较蜇人的事。"
 gdp_trade_good_flavor.3006.a: "免费蜂蜜，能有什么代价？"
 gdp_trade_good_flavor.3006.a.toast: "被蜇了！"
 gdp_trade_good_flavor.3006.b: "让它们工作，免租金。"
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "又一壶茶"
 gdp_trade_good_flavor.3007.desc: "一杯下肚，摸清了货色。再来一杯，因为第一杯效果不错。到午夜，我重新核对完三本账簿，写好了两封信，感觉状态好极了。\n\n这要么是一批上好的货，要么是一个开销不小的习惯。"
 gdp_trade_good_flavor.3007.a: "每天早上都来一壶。"
 gdp_trade_good_flavor.3007.b: "让全商会都喝。"
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "趁它没坏"
 gdp_trade_good_flavor.3008.desc: "我的贸易负责人[tgf_trader.GetFirstName]打开一[tgf_good.Custom('GetTradeGoodUnit')][tgf_good.Custom('GetTradeGood')]，皱起眉头。“河上的雾气渗了进去，货物现在变软了——到周末就会发霉。”\n\n干果能保存几年，湿果只能保存几天。时间就是金钱。"
 gdp_trade_good_flavor.3008.a: "再晒干，好好晒干。"
 gdp_trade_good_flavor.3008.b: "让它发酵，按酒卖钱。"
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "午夜灯油"
 gdp_trade_good_flavor.3009.desc: "灯油在账簿记完前一小时就已烧完，所以我点起了自己的库存，那是本该出售的上等[tgf_good.Custom('GetTradeGood')]。它烧起来并不比我们丢弃的浑浊残渣更亮。\n\n并不更亮，但买家愿意出三倍价钱来买它。"
 gdp_trade_good_flavor.3009.a: "把残渣当灯油卖，好油上餐桌。"
 gdp_trade_good_flavor.3009.b: "继续烧，账目优先。"
 gdp_trade_good_flavor.3009.c: "睡觉，油也可以休息了。"
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "青苗交易"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "“青苗交易”，是指在田里谷物还青绿时就付钱买下，价格远低于收获时的售价。传教士和教会法学家谴责这种做法是变相的放债取利。"
 gdp_trade_good_flavor.3010.desc.condemned: "我的信仰称之为放债取利。我的账簿称之为折扣。"
 gdp_trade_good_flavor.3010.desc.permitted: "有些信仰称之为放债取利。我的信仰称之为远见。"
 gdp_trade_good_flavor.3010.desc.intro: "“它现在还是青的，到夏天就会变成金黄，”来自[tgf_source_county.GetNameNoTier]的[tgf_peasant.GetFirstName]对我说，膝盖下都沾着泥，“按今天的价钱付给我，[Glossary( '还没抽穗的青苗', 'TGF_IN_THE_BLADE_GLOSS' )]，收成全部归你。”\n\n"
 gdp_trade_good_flavor.3010.a: "明年的收成，今年的价钱。"
 gdp_trade_good_flavor.3010.b: "让你的作物长成了再说。"
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "陈年粟米"
 gdp_trade_good_flavor.3011.desc: "在新货品后面，我翻出了好几年前的几[tgf_good.Custom('GetTradeGoodUnitPlural')]粟米，之前被漏记、彻底遗忘了。每一粒都还完好。粟米毕竟耐储存。\n\n这是过去的我为自己留下的免费货品，属于最好的那种遗产。"
 gdp_trade_good_flavor.3011.a: "卖掉它。过去的我会希望如此。"
 gdp_trade_good_flavor.3011.b: "打包带走，粟米耐存。"
 gdp_trade_good_flavor.3011.c: "重新清点整个仓库。"
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "碾磨与否"
 gdp_trade_good_flavor.3012.desc: "精米洁白、质地轻，是每张高档餐桌上的抢手货。糙米分量重、颜色深，在别的地方处处都有需求。我的贸易负责人[tgf_trader.GetFirstName]想知道我要做哪一种商人。\n\n我要做那种能赚到钱的商人。"
 gdp_trade_good_flavor.3012.a: "碾磨它，高档餐桌给的价高。"
 gdp_trade_good_flavor.3012.b: "把糙米低价卖给所有人。"
 gdp_trade_good_flavor.3012.c: "挑选上品碾磨，次品低价出售。"
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "斋戒前"
 gdp_trade_good_flavor.3013.desc: "“[tgf_source_faith.Custom('GetTgfFastName')]很快就要开始了！”我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]匆匆寄信来，“接下来几周没人会碰肉食——等这段日子过去，他们就只想吃肉，别的什么都不想要。”\n\n肚子饿的买家从来不会讨价还价。"
 gdp_trade_good_flavor.3013.desc_ramadan: "“‌斋月‌很快就要开始了！”我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]匆匆寄信来，“日落前没人进食，日落后，除了肉之外没人会吃别的东西。”\n\n肚子饿的买家从来不会讨价还价。"
 gdp_trade_good_flavor.3013.a: "我也守斋，肉可以等一等。"
 gdp_trade_good_flavor.3013.b: "用盐腌制，然后等待饥肠辘辘的人们。"
 gdp_trade_good_flavor.3013.c: "在斋戒前的最后一次宴会上全部售出。"
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "看它的牙"
 gdp_trade_good_flavor.3014.desc: "马商[tgf_dealer.GetFirstName|U]把[tgf_dealer.GetSheHe]信奉的一切都搬出来发誓：“这匹马四岁，朋友，最多五岁。你看这皮毛！”这皮毛确实非常好。但我注意到，[tgf_dealer.GetSheHe]一直试图把我的视线从马的牙齿上引开。\n\n有句老话说的是，馈赠之马，勿看牙口。这一匹可不是白送的。"
 gdp_trade_good_flavor.3014.a: "把嘴张大些，让我们看看牙齿。"
 gdp_trade_good_flavor.3014.b: "不管老不老，这匹是我的。"
 gdp_trade_good_flavor.3014.c: "你很会说话，加入我的商会吧。"
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "育肥上集市"
 gdp_trade_good_flavor.3015.desc: "“牛赶到[tgf_source_county.GetNameNoTier]时又瘦又累，看起来简直像骷髅架子上披了层皮，”我的贸易负责人[tgf_trader.GetFirstName]告诉我。“[tgf_market_holder.GetTitledFirstName]附近有好牧场，愿意给我们用。当然，要收费。”\n\n肥肉好卖钱，而草可比肥肉便宜。"
 gdp_trade_good_flavor.3015.a: "付草钱，卖肥肉。"
 gdp_trade_good_flavor.3015.b: "瘦牛也有价。"
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "给书吏的小牛皮"
 gdp_trade_good_flavor.3016.desc: "[tgf_market_holder.GetTitledFirstName]的宫廷司祭[tgf_chaplain.GetTitledFirstName]像朝圣者挑选圣物一样走过我的制革厂。“这些，刮薄了，能承载圣言一千年。”[tgf_chaplain.GetSheHe]说。\n\n我的皮革能传世千年，对牛来说，这结局不算差。"
 gdp_trade_good_flavor.3016.a: "拿最好的，作为礼物。"
 gdp_trade_good_flavor.3016.b: "那就给书吏。让它传世。"
 gdp_trade_good_flavor.3016.c: "我宁愿卖给鞋匠。"
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "买下剪毛"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "熙笃会修道院会提前几年将一整年的羊毛产量卖给意大利和佛兰德斯的商人。现在收了钱，卖的却是还没长出来的羊毛，许多修道院因此深陷债务。"
 gdp_trade_good_flavor.3017.desc: "“[tgf_abbot.GetTitledFirstName]为我们提供[tgf_abbey.GetNameNoTier]未来几年的羊毛，”我的贸易负责人[tgf_trader.GetFirstName]告诉我，“[Glossary( '好几年的毛量', 'TGF_WOOL_CLIP_GLOSS' )]，现在就付款，到时候再一捆羊毛一捆羊毛地交付。他们今天就要钱。”\n\n他们计划得很长远，商人们也一样。"
 gdp_trade_good_flavor.3017.a: "现在就付钱，买下未来几年的羊毛。"
 gdp_trade_good_flavor.3017.b: "我更喜欢已经剪过毛的羊。"
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "植物羊"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "旅行者和学者都反复讲述着同一个传说：在极远的东方生长着一种植物，茎秆上会结出活的羊羔，它们吃周围的草直到茎秆枯萎。这是解释棉花的一种方式，一种长在植物上的羊毛。"
 gdp_trade_good_flavor.3018.desc: "[tgf_source_county.GetNameNoTier]的一名买家[tgf_buyer.GetFirstName|U]惊奇地翻弄我的一撮棉花。“是真的吗？他们说它长在一种植物上，结出小羊，小羊一直吃草直到茎秆枯萎。”\n\n[Glossary( '植物羊', 'TGF_VEGETABLE_LAMB_GLOSS' )]这种奇谈也能卖钱。"
 gdp_trade_good_flavor.3018.a: "真的，每个字都是真的。而且非常稀有。"
 gdp_trade_good_flavor.3018.b: "没有羊，只是一种非常蓬松的植物。"
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "旧材再利用"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "从旧建筑上拆下来、重新用到新建筑里的石料。古代遗址里的石柱、雕刻和刻字石块，被搬进了中世纪世界各地的教堂、城墙和民居里。"
 gdp_trade_good_flavor.3019.desc: "“采石工们已经不开采新石料了，”我的贸易负责人[tgf_trader.GetFirstName]在一封从[tgf_source_county.GetNameNoTier]寄来的信里坦言，“他们转而从旧遗迹里凿取东西——石柱、雕刻，所有这类物件。”\n\n这就是[Glossary( '旧材再利用', 'TGF_SPOLIA_GLOSS' )]。旧石料，卖出新价钱。"
 gdp_trade_good_flavor.3019.a: "古董的石材，古董的价格。"
 gdp_trade_good_flavor.3019.b: "把最好的雕刻留给我。"
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "桅杆木料"
 gdp_trade_good_flavor.3020.desc: "“[tgf_market_holder.GetTitledFirstNamePossessive]的造船匠想要我们的[tgf_good.Custom('GetTradeGood')]，”我的贸易负责人[tgf_trader.GetFirstName]告诉我，“不是随便什么木材。他们要我们手里最长、最直的树干，用来做船桅。他们知道完美的木材有多难得。”\n\n稀罕的东西永远不该急着出手。"
 gdp_trade_good_flavor.3020.a: "最好的木料留给我自己的船。"
 gdp_trade_good_flavor.3020.b: "成交，桅杆可不等人。"
 gdp_trade_good_flavor.3020.c: "让他们等着，价格会上涨的。"
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "烟之帐"
 gdp_trade_good_flavor.3021.t_bhang: "一杯大麻茶"
 gdp_trade_good_flavor.3021.t_hashish: "门后甜品"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "希罗多德写道，斯基泰人会在封闭毡帐里把大麻籽丢到烧红的石头上，然后在冒出的烟气里舒服地嚎叫。草原民族将这一习俗延续了很久。"
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.GetSheHe|U]把大麻籽撒在自己帐篷里烧热的石头上，烟升了起来。“[Glossary( '吸吧', 'TGF_HEMP_TENT_GLOSS' )]，商人。我们这儿做生意就是这样。”\n\n当然，这纯粹是出于生意上的考量。"
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "《阿闼婆吠陀》将大麻列为五种神圣植物之一。大麻叶和牛奶、酥油、香料一起研磨成饮品，在节庆时饮用，也用来供奉湿婆。"
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.GetSheHe|U]把大麻叶和香料一起磨碎加入牛奶里，递给我一杯。“[Glossary( '喝吧', 'TGF_HEMP_BHANG_GLOSS' )]，商人。节庆时全镇的人都喝这个。今晚，你也喝。”\n\n拒绝会显得很失礼，而失礼对生意没好处。"
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "大麻脂，一种混入糊状物与甜点中食用的大麻树脂，自十二世纪起在埃及和叙利亚传播开来。一些苏菲派将其赞为通往狂喜之境的道路，而教法学家则予以谴责，统治者甚至将整片田地焚毁。"
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.GetSheHe|U]关上门，拆开一小块压制成型的大麻脂甜品。“[Glossary( '大麻脂', 'TGF_HEMP_HASHISH_GLOSS' )]，商人。教法学家不认可这个，但他们现在不在这儿。”\n\n拒绝一位买家会显得很失礼。"
 gdp_trade_good_flavor.3021.desc.intro: "“[tgf_good.Custom('GetTradeGood')|U][tgf_good.Custom('GetTgfHempUse')]？”[tgf_source_county.GetNameNoTier][tgf_hemp_host.GetTitledFirstName]笑道，“我们对[tgf_good.Custom('GetTgfGoodItThem')]有更好的用途。”\n\n"
 gdp_trade_good_flavor.3021.a: "生意就是生意。接过大麻籽。"
 gdp_trade_good_flavor.3021.a_bhang: "生意就是生意。接过杯子。"
 gdp_trade_good_flavor.3021.a_hashish: "生意就是生意。接过甜品。"
 gdp_trade_good_flavor.3021.b: "卖了它。让我自己保持清醒。"
 gdp_trade_good_flavor.3021.a.toast_habit: "新习惯"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "至臻之刃"
 gdp_trade_good_flavor.3022.desc: "来自[tgf_source_county.GetNameNoTier]的铁匠[tgf_smith.GetFirstName]把我的一块铁锭放在掌心里掂了掂，笑了起来：“把最好的那块铁给我，我给你打出一把价值十倍于金属的刀刃。”\n\n十倍。[tgf_smith.GetSheHe|U]太懂怎么和商人说话了。"
 gdp_trade_good_flavor.3022.a: "锻造它，让它配得上这份夸耀。"
 gdp_trade_good_flavor.3022.b: "教教我哪种锭最好。"
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "宝石匠的声明"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "宝石切割师与打磨师，常常也是宝石志的读者：这些书籍列举了每种石头隐藏的力量，从蓝宝石可避毒到紫水晶防醉酒。"
 gdp_trade_good_flavor.3023.desc: "来自[tgf_source_county.GetNameNoTier]的[Glossary( '宝石匠', 'TGF_LAPIDARY_GLOSS' )][tgf_lapidary.GetFirstName|U]，神情郑重地把我的一颗宝石举到光线下。“这块石头能避[ROOT.Char.Custom('GetTgfAilment')]。书上是这么写的。”\n\n然而，价格上还没体现出这层价值。至少目前没有。"
 gdp_trade_good_flavor.3023.a: "随声明一同出售，价格也相应定高。"
 gdp_trade_good_flavor.3023.b: "加入我的商会，带上你的书一起。"
 gdp_trade_good_flavor.3023.c: "我不会与书籍争辩。"
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "君子之石"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U]，一位鉴玉师，把我的每一件玉石轻轻磕在自己的牙齿上，然后聆听声响。[tgf_connoisseur.GetHerHis]挑出两件放到一边。“皂石。品质很好的皂石。”剩下的那些，[tgf_connoisseur.GetSheHe]缓缓点头表示认可。\n\n能辨明真假的行家，比真玉和假玉都更有价值。"
 gdp_trade_good_flavor.3024.a: "销毁赝品，查明供应商。"
 gdp_trade_good_flavor.3024.b: "加入我的商会吧，你的眼光值这份工钱。"
 gdp_trade_good_flavor.3024.c: "教教我用牙齿的窍门。"
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "陶瓷压舱物"
 gdp_trade_good_flavor.3025.desc: "我的贸易负责人[tgf_trader.GetFirstName]对自己的安排十分满意。“这艘船需要压舱物，而我们的这[tgf_good.Custom('GetTradeGoodUnitPlural')]货又很重。船长几乎没向我们收运费。”\n\n能自付运费的货物，正是我最钟爱的那种。"
 gdp_trade_good_flavor.3025.a: "把省下的钱投入下一批货物。"
 gdp_trade_good_flavor.3025.b: "学着把它当作压舱物来堆放。"
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "树液蜇咬"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "漆不会在空气中自然干透。每一层树漆都要在温暖潮湿的房间里静置好几天才能硬化，一件上品要刷上几十层漆。在完全硬化之前，漆液碰到皮肤就会让皮肤起泡。"
 gdp_trade_good_flavor.3026.desc: "这[tgf_good.Custom('GetTradeGoodUnitPlural')]新漆器到货时，最后一层漆还没完全[Glossary( '固化', 'TGF_LACQUER_CURE_GLOSS' )]。漆面看起来完美极了——色泽深沉、光亮，仿佛还带着湿润感。我手痒难耐，想去摸一下试试。\n\n漆匠说这种树汁会蜇人，我觉得他们是在夸大其词。"
 gdp_trade_good_flavor.3026.a: "建造一间潮湿的房间来固化。"
 gdp_trade_good_flavor.3026.b: "轻轻碰下，只是确认。"
 gdp_trade_good_flavor.3026.b.toast_rash: "生漆蜇人"
 gdp_trade_good_flavor.3026.c: "等它固化，好东西值得等待。"
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "阅读石"
 gdp_trade_good_flavor.3027.desc.intro: "来自[tgf_source_county.GetNameNoTier]的玻璃工匠[tgf_glassmaker.GetFirstName]把两块打磨好的玻璃片放在我的账本上。微小的数字一下子放大了，轮廓变得清晰而黝黑。“朋友，给老花眼用的。或者给累坏了的眼睛用。”\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "我两样都占点。多年来头一次，我能看清每份合同上的小字了。"
 gdp_trade_good_flavor.3027.desc.young_eyes: "我的眼睛不花也不累。但我现在能看清每份合同上的小字了。"
 gdp_trade_good_flavor.3027.a: "给我来一对，包好点。"
 gdp_trade_good_flavor.3027.b: "给[tgf_market_holder.GetTitledFirstNameNoTooltip]送一对。"
 gdp_trade_good_flavor.3027.c: "不是那些石头，而是它们的秘密。"
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "节日价格"
 gdp_trade_good_flavor.3028.desc.christian: "“圣日就要到了，”我的贸易负责人[tgf_trader.GetFirstName]刚从[tgf_source_county.GetNameNoTier]回来就跟我说，“每个买家都想要适合献给东方三贤士的香，没人会为在祭坛上烧的东西讨价还价。”\n\n"
 gdp_trade_good_flavor.3028.desc: "“圣日就要到了，”我的贸易负责人[tgf_trader.GetFirstName]刚从[tgf_source_county.GetNameNoTier]回来就跟我说，“每个买家都想要配得上最神圣神殿的香，没人会为在祭坛上烧的东西讨价还价。”\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "不还价的买家是[ROOT.Char.GetFaith.HighGodName]赐予的礼物。"
 gdp_trade_good_flavor.3028.a: "为了宴会，我自己也会烧一些。"
 gdp_trade_good_flavor.3028.b: "神殿有优先挑选权，但需自付费用。"
 gdp_trade_good_flavor.3028.c: "节庆日，节庆价。"
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "底也伽"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "一种有名的万灵药，用几十种原料熬制而成，通常还会加入蝰蛇肉和阿芙蓉，之后要放上数年让它熟成。医生会将它开来解毒、抗疫，几乎什么病症都能用上。"
 gdp_trade_good_flavor.3029.desc: "[tgf_source_county.GetNameNoTier]的药剂师[tgf_apothecary.GetFirstName|U]寄来一封带着草药气味的信。“你的存货正是我调配[Glossary( '底也伽', 'TGF_THERIAC_GLOSS' )]需要的东西。用来解毒、抗疫，治疗其他所有病症。”\n\n它到底有没有用，是[tgf_apothecary.GetHerHim]和[tgf_apothecary.GetHerHis]病人之间的事，我只负责售卖。"
 gdp_trade_good_flavor.3029.a: "熬制它，并沿着商路出售。"
 gdp_trade_good_flavor.3029.b: "全部六十四种材料，由我提供。"
 gdp_trade_good_flavor.3029.c: "教我这个配方，外加一剂药。"
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "特许无纸"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "1231年，腓特烈二世皇帝禁止其治下西西里王国的公证人使用纸张书写公文，因为他认为纸张过于脆弱，并不可靠，唯有羊皮纸可以胜任。"
 gdp_trade_good_flavor.3030.desc: "“[tgf_market_holder.GetTitledFirstNamePossessive]的文书处理任何公务都[Glossary( '不碰纸张', 'TGF_PAPER_GLOSS' )]，”我的贸易负责人[tgf_trader.GetFirstName]从[tgf_source_county.GetNameNoTier]回来后，仍一脸反感地跟我说，“他们说只用羊皮纸，好像那东西是圣物一样。”\n\n没有哪条规矩是完全没法商量的。"
 gdp_trade_good_flavor.3030.a: "据理力争，纸张才是未来。"
 gdp_trade_good_flavor.3030.a.success: "官署采纳纸张"
 gdp_trade_good_flavor.3030.a.failure: "官署仍使用羊皮纸"
 gdp_trade_good_flavor.3030.b: "那他们就会买我的羊皮纸。"
 gdp_trade_good_flavor.3030.c: "那我去了解一下他们真正想要什么。"
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "格鲁特还是啤酒花"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "一种草本混合物，成分包括香杨梅和蓍草这类植物，在啤酒花普及之前用来给麦酒调味和延长保存期。很多统治者都独占其售卖权，每酿一批酒都要课税。"
 gdp_trade_good_flavor.3031.desc: "“啤酒花，”[tgf_source_county.GetNameNoTier]的酿酒师[tgf_brewer.GetFirstName]凑在我的酒桶边低声说，“酿出来的啤酒能放好几个月，而且没人能对啤酒花收税。”在[tgf_source_county.GetNameNoTier]，每个酿酒师都必须购买[tgf_market_holder.GetTitledFirstNamePossessive]的[Glossary( '格鲁特', 'TGF_GRUIT_GLOSS' )]，还要用它来缴纳相应的税。\n\n总得有人为进步付出代价。"
 gdp_trade_good_flavor.3031.a: "那就啤酒花，把它销路打开。"
 gdp_trade_good_flavor.3031.b: "格鲁特，正如[tgf_market_holder.GetTitleAsNameNoTooltip|l]所偏好的。"
 gdp_trade_good_flavor.3031.c: "每个桶里都各加一些。"
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "水果篮"
 gdp_trade_good_flavor.3032.desc: "在[tgf_source_county.GetNameNoTier]，[tgf_fruit_province.Custom('get_region_fruit_plural')]被成筐吃掉了，这些水果几乎运不出下一个村庄。\n\n把它们制成干果，便可长期保存，运出去就能卖出好价钱。我吃了一颗，伸手去拿我的账本。"
 gdp_trade_good_flavor.3032.a: "查明是谁种植了它们，以及数量有多少。"
 gdp_trade_good_flavor.3032.b: "再吃一个，为了研究。"
