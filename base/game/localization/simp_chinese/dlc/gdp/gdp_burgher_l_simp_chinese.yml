 HANSEATIC_LEAGUE_NAME: "汉萨同盟"
 GENERIC_HANSE_NAME: "[hanse_lead_town.GetName]的汉萨"
 gdp_burgher.0001.desc: "我们，[burgher_county.GetNameNoTier]的[burgher_county.Custom('BurgherPluralNoun')]，要求您授予我们[burgher_county.Custom('BurgherDemandedPrivilege')]，让我们的城镇得以发展，为您的领地带来更多财富。"
 gdp_burgher.0001.a: "他们的要求合理。授予我的保证。"
 gdp_burgher.0001.b: "我拒绝！"
 gdp_burgher.0001.opening: "致我们的[ROOT.Char.Custom('LadyLordWomanMan')]，"
 gdp_burgher.0010.desc: "我们，[burgher_county.GetNameNoTierNoTooltip]的[burgher_county.Custom('BurgherPluralNoun')]，请求你授予我们自治的自由，选择我们自己的领袖，以我们自己的名义处理事务，否则我们可能被迫夺取你不愿恩赐的东西。"
 gdp_burgher.0010.a: "给他们自由。"
 gdp_burgher.0010.b: "让他们为他们的#EMP “权利”#!而战。"
 gdp_burgher.0020.t: "[freed_county.GetNameNoTierNoTooltip]的自由"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier]赢得了自由，以及自治和任命自己长官的特权。\n\n当然，如果没有#EMP 我#!的支持，这一切都不可能。"
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier]赢得了自由，以及自治和任命自己长官的特权。\n\n当然，如果没有#EMP 我#!的支持，这一切都不可能。"
 gdp_burgher.0020.a: "领导的重担我将欣然接受。"
 gdp_burgher.0020.b: "我将在他们的显贵中占有一席之地。"
 gdp_burgher.0020.c: "他们的善意将足够有利可图。"
 gdp_burgher_agitator_not_republic_head_tt: "你#bold 不能#!已经领导一个[republic|E]"
 gdp_burgher_agitator_outranks_republic_head_tt: "你的[title_tier|E]必须低于[burgher_ruler.GetTitledFirstName]"
 gdp_civic_agitation.0001.t: "自由点燃"
 gdp_civic_agitation.0001.desc: "一切已就绪。[target.GetNameNoTier]的人民燃烧着我的代理人所能煽动的最热切的市民自由渴望，而他们的领袖在集市广场发表关于苛税和不义长官的激情演说。\n\n我听说一个代表团正准备骑马前往觐见，向领主要求自治权。唯一的问题是我是否与他们同行。"
 gdp_civic_agitation.0001.a: "我已经走到这一步，将看到最后。"
 gdp_civic_agitation.0001.b: "他们应该作为骑兵，武装并骑马，费用由我承担。"
 gdp_civic_agitation.0001.c: "让群众以为这是他们的主意。关键的人才知道真相。"
 gdp_civic_agitation.0001.c.exposed: "承认它，并承诺他们更多"
 gdp_civic_agitation_sponsor_joins_war_tt: "如果他们的统治者拒绝他们，你将与[agitated_county.Custom('BurgherPluralNoun')]一起加入[war|E]"
 gdp_civic_agitation_sponsor_war_chest_tt: "你将资助一队职业士兵以防战争发生"
 gdp_civic_agitation.0002.t: "钱花得不当"
 gdp_civic_agitation.0002.desc: "申诉清单已经拟好，在[target.GetNameNoTier]民众面前宣读完毕，他们的领袖们聚首商议，却仍#EMP 毫无作为#!。\n\n我的同谋们除了明面上的情况外，对后来发生了什么一无所知。我的钱买到了他们所需的一切，唯独买不到真正#EMP 动用#!它的胆量。"
 gdp_civic_agitation.0002.a: "我不会很快忘记这种懦弱的背叛。"
 found_the_hanseatic_league_decision: "建立汉萨同盟"
 found_the_hanseatic_league_decision_tooltip: "将你的[trade_league|E]的[counties|E]联合成一个更强大的商业联盟"
 found_the_hanseatic_league_decision_confirm: "同心协力，我们迎来繁荣"
 found_the_hanseatic_league_decision_desc: "国王们想象权力戴着王冠、拿着剑。我们知道一个不同的真相。权力裹着毛皮，闻起来像鱼，带着记录足以让王国破产的金额的账簿。\n\n各自为战，我们被征税、掠夺和威胁到顺从；团结一致，北方海域没有力量能抵挡我们。没有港口会拒绝我们的船只，没有外国商人能削价我们的货物，没有君主愿意质疑我们的特权。"
 found_the_hanseatic_league_cohesion_tt: "[trade_league|E]必须至少有#V 95#![cohesion|E]"
 found_the_hanseatic_league_members_tt: "[trade_league|E]必须至少有#V 4#!成员"
 found_the_hanseatic_league_message_title: "汉萨诞生"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U]将联盟团结为一个宣誓的汉萨。"
 league_needs_liege_consent_tt: "作为[vassal|E]，你必须得到你的[liege|E]的同意，或者一个自由城镇自行加入"
 gdp_hanseatic.0010.opening: "来自[the_league.GetName]，"
 gdp_hanseatic.0010.desc: "你以自己名义持有贸易权，为你而非他人利益。\n\n这种个人安排有损我方利益。我们请求你将其让渡给我们，以便我们更好地共同繁荣。"
 gdp_hanseatic.0010.a: "我们将把它们交给[the_league.GetName]。"
 gdp_hanseatic.0010.b: "我将把它们授予[hanse_city_title.GetNameNoTier]。"
 gdp_hanseatic.0010.c: "这些权利是我的，#EMP 并将继续如此#!。"
