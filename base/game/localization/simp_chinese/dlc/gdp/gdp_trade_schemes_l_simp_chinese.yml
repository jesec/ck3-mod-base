 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$：成功"
 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U]将面临运力不足，无法再像以往那样运送所有货物。让[target.GetShortUIName]去烦恼为何账目再也对不上吧。"
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U]再也没有从前在市场里享有的优先待遇和特权。让[target.GetShortUIName]见识一下现在赚钱有多困难。"
 gdp_trade_scheme.0012.desc_discovered: "\n\n尽管我的一名手下已被发现，这可能会牵连到我。"
 gdp_trade_scheme.0012.a: "祝那蠢货好运。"
 gdp_trade_scheme.0012.a_discovered: "这是值得的。"
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$：失败"
 gdp_trade_scheme.0013.desc: "尽管我们竭尽全力，[target.GetShortUIName]和[target.GetHerHis]的贸易路线还是像往常一样运作得井井有条。"
 gdp_trade_scheme.0013.desc_discovered: "\n\n我的一个贸易负责人被发现试图插手此事。这对我家族的名声是一种耻辱。"
 gdp_trade_scheme.0013.a: "令人恼火。"
 gdp_destroyed_republic_opinion: "摧毁了我的共和国"
 gdp_smuggler_opinion: "走私者"
