 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUIName]不再经营[target.GetHerHis]自己的[trade_routes|E]"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUIName]已经没有可破坏的[trade_route|E]"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName]拥有至少一条[trade_route|E]"
 gdp_disrupt_trade_routes_capacity_modifier: "后勤中断"
 gdp_disrupt_trade_routes_competitiveness_modifier: "声誉受损"
 gdp_disrupt_trade_routes_discovered_opinion: "破坏我的贸易路线"
 gdp_disrupt_trade_routes_target_notification: "[disrupted_trade_route.GetName|l]的麻烦"
 gdp_disrupt_trade_routes_target_notification_tt: "我的一条[trade_routes|E]出了问题。我的贸易负责人也说不出具体什么原因。"
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "我的一条[trade_routes|E]运行不畅，我的贸易负责人已经追查到起因在[owner.GetShortUIName]身上。"
 gdp_disrupt_trade_routes_target_caught_notification: "破坏行动败露"
 gdp_disrupt_trade_routes_target_caught_tt: "[owner.GetShortUINamePossessive]的一名手下在我的[trade_routes|E]上被抓获，他承认了自己受命执行的任务。"
