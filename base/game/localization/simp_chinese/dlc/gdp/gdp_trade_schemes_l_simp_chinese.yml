 gdp_improve_trade_routes_expertise_modifier: "老练贸易商"
 gdp_improve_trade_capacity_decision: "贸易计谋：容量"
 gdp_improve_trade_capacity_decision_desc: "我知道，因为商队的运力不足，我们有些货物不得不被留下。只要投入一些资金并做出调整，我们迟早能在所有到过的市场里扩大自己的份额。"
 gdp_improve_trade_capacity_decision_tooltip: "在你选择的[trade_route|E]上开始[GetScheme('gdp_improve_trade_capacity').GetTypeName][scheme|E]"
 gdp_improve_trade_capacity_decision_confirm: "腾出空间和人手。"
 gdp_improve_trade_capacity_decision_effect_tt: "开始一项[GetScheme('gdp_improve_trade_capacity').GetTypeName][scheme|E]，专注于[selected_item.GetName|l]"
 gdp_improve_trade_competitiveness_decision: "贸易计谋：竞争力"
 gdp_improve_trade_competitiveness_decision_desc: "在我的贸易负责人经常光顾的一些市场上，竞争十分激烈。如果我给合适的人塞些钱，再和当地人做些小交易，我的贸易负责人就能优先于竞争对手。"
 gdp_improve_trade_competitiveness_decision_tooltip: "在你选择的[trade_route|E]上开始一项[GetScheme('gdp_improve_trade_competitiveness').GetTypeName][scheme|E]"
 gdp_improve_trade_competitiveness_decision_confirm: "为我们赢得更热情的欢迎。"
 gdp_improve_trade_competitiveness_decision_effect_tt: "开始一项[GetScheme('gdp_improve_trade_competitiveness').GetTypeName][scheme|E]，专注于[selected_item.GetName|l]"
 gdp_improve_trade_expertise_decision: "贸易计谋：专长"
 gdp_improve_trade_expertise_decision_desc: "我的贸易负责人告诉我，我们在一些贸易路线上一次又一次地重复犯同样的错误。是时候吸取经验教训，确保我们的路线尽可能高效地运行了。"
 gdp_improve_trade_expertise_decision_tooltip: "在你选择的[trade_route|E]上开始一项[GetScheme('gdp_improve_trade_expertise').GetTypeName][scheme|E]"
 gdp_improve_trade_expertise_decision_confirm: "集中到一条路线上。"
 gdp_improve_trade_expertise_decision_effect_tt: "开始一项[GetScheme('gdp_improve_trade_expertise').GetTypeName][scheme|E]，专注于[selected_item.GetName|l]"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$：成功"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U]终于如预期般顺利运行。据我的贸易负责人汇报，我们如今正如我所愿，运来了更多的货物。"
 gdp_trade_scheme.0002.a: "每一分钱都花得值。"
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]：失败"
 gdp_trade_scheme.0003.desc: "尽管我竭尽全力，这条商路还是和以前一模一样。这让人恼火，但有时候市场就是这样。"
 gdp_trade_scheme.0003.a: "回去看账本。"
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$：成功"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U]终于赚到了我所期望的收益。我的贸易负责人比竞争对手享有优先权，我们赚的钱比以前多了。"
 gdp_trade_scheme.0004.a: "人情用得恰到好处。"
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$：成功"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U]比以前运转得更顺畅，我们犯的错也比以前更少。这些经验会成为我的家族未来财富的基础。"
 gdp_trade_scheme.0005.a: "我将继续建设。"
 gdp_disrupt_trade_routes: "破坏贸易路线"
 gdp_disrupt_trade_routes_action: "破坏贸易路线："
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName]在我的市场上进行贸易。只需收买几名职员并散布适当的谣言，便足以破坏[SCHEME.GetTargetCharacter.GetHerHis]的一条[trade_routes|E]。"
 gdp_disrupt_trade_routes_desc_general: "$gdp_disrupt_trade_routes$是一种[hostile_scheme|E]，[merchant|E]或[patrician|E]意图通过此计谋破坏对手的[trade_route|E]网络。该计谋基于[intrigue|E]，能够招揽[agents|E]。"
