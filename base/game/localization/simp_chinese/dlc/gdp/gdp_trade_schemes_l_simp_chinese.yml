 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "你破坏对手[trade_routes|E]的行为并未暴露"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "你与[target.GetShortUIName]共用[trade_market|E]：$VALUE|+=0$"
