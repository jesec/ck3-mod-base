l_simp_chinese:
 gdp_republic_unrest.0001.t: "首都暴动：民怨沸腾"
 gdp_republic_unrest.0001.desc: "一群工人和行会帮工聚集在庭院里。其中一人走上前来。“[ROOT.Char.GetLadyLord]，税赋正把我们变成穷光蛋……”\n\n这些我早就听过了。他们不是第一个，也不会是最后一个把这类抱怨带到我家门口的人。"
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "卫兵！赶走这些……人。"
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "我不会和农民谈判。"
 gdp_republic_unrest.0001.b.success: "他们没再惹麻烦就散去了"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "拒绝让他们怒不可遏"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "交给内阁处理。"
 gdp_republic_unrest.0001.c.success: "他们暂时被说服了"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "他们看穿了拖延"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "这次我会做出让步。"
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "首都暴动：冷遇"
 gdp_republic_unrest.0011.desc: "当我穿过集市时，照例听见喧闹的嘈杂声，但总觉得与平日不同。摊位安静下来，人们也安静下来，只是带着不安的神情看着我。\n\n我在这些街道上走了多年，从未像这样过。"
 gdp_republic_unrest.0011.a: "我确信这一切都是我的错觉。"
 gdp_republic_unrest.0011.b: "派人去追查谣言。"
 gdp_republic_unrest.0011.b.success: "我的人追查到了源头"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "谣言继续传播"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "我会停下来和人们谈谈。"
 gdp_republic_unrest.0011.c.success: "人们赞赏这一姿态"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "没人愿意说话"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "分发食物和酒，不惜一切代价。"
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "首都暴动：匿名信"
 gdp_republic_unrest.0021.desc: "今天早上我到达时，一封没有封缄、也没有署名的信正等在我的桌上。它不厌其烦地详述，自从我成为[ROOT.Char.GetTitleAsName]以来，[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]已经变得多么糟糕。"
 gdp_republic_unrest.0021.a: "把它扔进火里。"
 gdp_republic_unrest.0021.b: "有人为此努力过。找出是谁。"
 gdp_republic_unrest.0021.b.success: "查明了作者"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "作者仍未知"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "我会公开回应。"
 gdp_republic_unrest.0021.c.success: "回应受到欢迎"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "回应遭到厌恶"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "首都暴动：广场现在归他们了"
 gdp_republic_unrest.0101.desc: "“[ROOT.Char.GetLadyLord]，一些市民已经控制了集市广场……到现在已经好几天了。”我的一名卫兵向我报告。“看来是一个名叫[demagogue.GetFirstName]的[demagogue.GetWomanMan]正在大声煽动民众。”\n\n我到底花钱养这些蠢货是干什么用的，市场都能被关闭好几天了，却没人告诉我？"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "把广场清空！"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "抹黑这个煽动者。"
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName]名誉扫地"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "我的尝试毫无效果"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "我亲自跟他们谈。"
 gdp_republic_unrest.0101.c.success: "人群散去"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "我面对大声嘲笑"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "给他们想要的。"
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "首都暴动：封闭街区"
 gdp_republic_unrest.0111.desc: "消息传到我这里，[closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )]已切断所有联系。他们拒绝承认我们的税吏，也不会听从我们的卫兵。"
 gdp_republic_unrest.0111.a: "派一些卫兵和那些税吏一起去。"
 gdp_republic_unrest.0111.b: "我们收买他们吧。"
 gdp_republic_unrest.0111.b.success: "他们得到了想要的"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "他们拒绝谈判"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "我会亲自去和他们谈谈。"
 gdp_republic_unrest.0111.c.success: "他们听从了"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "他们拒绝听从"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "他们最终会累的。但愿如此。"
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "首都暴动：假人"
 gdp_republic_unrest.0121.desc: "当我走过街道时，一个丑陋的肖像挡住了我的去路，它穿着有点像我的衣服，公开悬挂供所有人观看。人群安静地看着它，然后看着我。\n\n“跟真的一样！”后面有人喊道，人群中传来大声嘲笑。"
 gdp_republic_unrest.0121.a: "把它拿下来！马上！"
 gdp_republic_unrest.0121.a.flavor: "我会确保这里没人谈论他们看到的东西。"
 gdp_republic_unrest.0121.b: "找出幕后黑手。"
 gdp_republic_unrest.0121.b.success: "组织者已处理"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "无法追查组织者"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "我会公开处理此事。"
 gdp_republic_unrest.0121.c.success: "人们倾听"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "人群嘲笑并发出嘘声"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "不必理会。"
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "首都暴动：城市在燃烧"
 gdp_republic_unrest.0201.desc: "我在守卫赶到之前看到烟雾升起。“[ROOT.Char.GetLadyLord]，一个名叫[demagogue.GetFirstName]的煽动者说服人们放火烧毁了城中一个区划。”\n\n我的城市到底怎么了？"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "召集全部驻军。处理这件事。"
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "备马！"
 gdp_republic_unrest.0201.b.success: "暴乱者四散"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "我不得不逃回宫殿"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "我会在广场见他们。"
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "人群转而反对我"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "如果需要，把整个国库都给他们。"
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "首都暴动：罢工"
 gdp_republic_unrest.0211.desc: "当我穿过集市时，罢工立刻显而易见。没有人出来叫卖，摊位空着，作坊安静。\n\n很明显，行会之间已经做出了决定，他们所有的工人都照做。"
 gdp_republic_unrest.0211.a: "带行会大师来谈话。"
 gdp_republic_unrest.0211.a.success: "达成协议"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "他们拒绝露面"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "这次我们收买他们。"
 gdp_republic_unrest.0211.b.success: "价格谈妥"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "他们拒绝我的妥协"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "让他们立刻回去工作。"
 gdp_republic_unrest.0211.d: "满足他们的要求。"
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "首都暴动：手稿"
 gdp_republic_unrest.0221.desc: "“我的[ROOT.Char.GetLadyLord]，他们……现在在散布这些，”一名卫兵告诉我，递给我一份手稿。“全城都是。”\n\n它详细地对我进行人身侮辱，还指控我各种罪行。"
 gdp_republic_unrest.0221.a: "找到并处理写这个的人。"
 gdp_republic_unrest.0221.a.success: "源头已被找到并封口"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "仍未知作者身份"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "我会公开驳斥。"
 gdp_republic_unrest.0221.b.success: "指控开始消退"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "人们嘲笑我"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "买下所有副本。"
 gdp_republic_unrest.0221.d: "这种事会自己过去的。"
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "首都暴动：兵临城下"
 gdp_republic_unrest.0301.desc: "我醒来时，几名卫兵告诉我有一群暴民正朝我们而来。当我走过大厅时，我看到它们多么空荡……我的大部分卫兵已经弃我而去。\n\n望向窗外，我看到他们慢慢逼近，喊着、欢呼着。暴民来找我了。"
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "真正的[ROOT.Char.GetTitleAsNameNoTooltip]只有一个。过来抓[ROOT.Char.GetHerHim]呀。"
 gdp_republic_unrest.0301.a.success: "我把他们砍倒，直到只剩下我颤抖的双手和寂静、血染的宫殿"
 gdp_republic_unrest.0301.a.fail: "我落入暴民之手"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "他们永远别想活捉我！"
 gdp_republic_unrest.0301.b.success: "我和我的人杀出一条血路"
 gdp_republic_unrest.0301.b.fail: "我们寡不敌众"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "从仆役的小门离开。"
 gdp_republic_unrest.0301.c.success: "我设法溜走了"
 gdp_republic_unrest.0301.c.fail: "我被抓住了"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "我的统治结束了。"
 gdp_republic_unrest.0301.d.flavor: "走到窗前，宣布我将下野。然后空着手走出去，祈祷他们饶我一命。"
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "首都暴动：大寂静"
 gdp_republic_unrest.0302.desc: "宫殿现在安静了。\n\n尸体还没被移走，大门还敞开着，最后一批叛军就是从那里逃跑的。我的手已基本不再发抖。\n\n我还在这里。"
 gdp_republic_unrest.0302.a: "我……没有倒下？"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "首都暴动：新名字，新生活"
 gdp_republic_unrest.0303.desc: "我还活着。\n\n那座城市已经在身后了，这条街上没人知道我是谁。头衔没了，宫殿没了，这些年来定义我的一切都没了。\n\n然而我活了下来，这总该有点意义。现在我要去哪里？"
 gdp_republic_unrest.0303.a: "前往[destination_a.GetNameNoTierNoTooltip]，全新的开始等待着。"
 gdp_republic_unrest.0303.a.tt: "前往[destination_a.GetNameNoTier]并将住所迁移到那里"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip]已经够远了，我可以在那里东山再起。"
 gdp_republic_unrest.0303.b.tt: "前往[destination_b.GetNameNoTier]并将住所迁移到那里"
 gdp_republic_unrest.0303.c: "去一个没人知道我名字的地方。[destination_c.GetNameNoTierNoTooltip]就不错。"
 gdp_republic_unrest.0303.c.tt: "前往[destination_c.GetNameNoTier]并将住所迁移到那里"
 gdp_republic_unrest.0303.d: "我无处可去，就留下来做些力所能及的事吧。"
 gdp_republic_unrest.0303.tt: "返还全部[domicile_buildings|E]的花费"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.GetTitleAsNameNoTooltip]倒下"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName]死了。在暴乱中，[old_doge.GetHeShe]倒下了，宫殿陷入死寂。\n\n接下来会发生什么，谁也无法预料。"
 gdp_republic_unrest.0304.a: "这改变了一切。"
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.GetTitleAsNameNoTooltip]消失了"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName]失踪了。没有尸体，没有告别，[old_doge.GetHeShe]就在暴民到宫门的那天夜里消失了。\n\n接下来会发生什么，谁也无法预料。"
 gdp_republic_unrest.0305.a: "这改变了一切。"
 gdp_republic_unrest.0306.t: "首都暴动：新城市，新生活"
 gdp_republic_unrest.0306.desc: "身后的路很长，我尽量不回头去看。\n\n这个地方还不知道我的名字。陌生的市场，更加陌生的面孔。但在这里能赚到钱，能找到盟友，能用仅剩的那点东西重新建起生活。"
 gdp_republic_unrest.0306.a: "该开始工作了。"
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "首都暴动：广场刺客"
 gdp_republic_unrest.0311.desc: "当我穿过市场时，人群在我面前散开。嘈杂的谈话声全部安静下来。我看到一个人影突然朝我冲来，刀已出鞘。\n\n我的卫兵太远，帮不上忙，我的反应窗口只有一瞬间。"
 gdp_republic_unrest.0311.a: "我的刀呢？！"
 gdp_republic_unrest.0311.a.success: "我及时成功自卫"
 gdp_republic_unrest.0311.a.fail: "[assassin.GetSheHe|U]比我的守卫先一步找上我"
 gdp_republic_unrest.0311.b: "我得马上离开这里。"
 gdp_republic_unrest.0311.b.success: "我成功躲过了刺客"
 gdp_republic_unrest.0311.b.fail: "无处可逃"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "首都暴动：仍未倒下"
 gdp_republic_unrest.0312.desc: "人群在混乱中跑散了，我都不知道自己怎么活下来的。\n\n我低头看着刺客的尸体，卫兵们追上并处理了[assassin.GetHerHim]。[assassin.GetSheHe|U]看起来就像城里的任何工匠。\n\n如果连普通市民都想杀我，我在哪里安全？"
 gdp_republic_unrest.0312.a: "我……我需要回家。"
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "首都暴动：以血偿血"
 gdp_republic_unrest.0321.desc: "深夜，一名信使被带进我的书房，递给我一封信。\n\n城里的一些暴乱者抓走了我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))][heir.GetFirstName]，如果到早晨我还不离开，他们就会把[heir.GetHerHis]的尸体送回我的宅邸。"
 gdp_republic_unrest.0321.rival: "[heir.GetFirstName]归他们了。"
 gdp_republic_unrest.0321.a: "调动卫队，把[heir.GetHerHim]带回来。"
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U]活了下来"
 gdp_republic_unrest.0321.a.success: "我的人及时救出了[heir.GetHerHim]"
 gdp_republic_unrest.0321.a.fail: "他们去得太迟了"
 gdp_republic_unrest.0321.b: "查出他们把[heir.GetHerHim]关在哪里。"
 gdp_republic_unrest.0321.b.success: "他们找到了[heir.GetHerHim]"
 gdp_republic_unrest.0321.b.fail: "没有找到[heir.GetSheHe|U]"
 gdp_republic_unrest.0321.c: "我所有的钱都给你们，求你们把[heir.GetHerHim]还回来。"
 gdp_republic_unrest.0321.d: "没有[heir.GetFirstNameNoTooltip]，头衔毫无意义。"
 gdp_republic_unrest.0321.d.flavor: "只要能救下[heir.GetHerHim]，付出任何代价都值得。"
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "首都暴动：安全脱身"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip]走进我书房的门，带着一丝颤抖的微笑。[heir.GetSheHe|U]没事，[heir.GetSheHe]活下来了。目前，这才是最重要的。\n\n我必须确保这种事不再发生。"
 gdp_republic_unrest.0322.desc.rival: "一名仆人进入我的房间，带来消息。[heir.GetFirstNameNoTooltip]回来了。\n\n好，继承顺位暂时完好。我必须确保这种事不再发生。"
 gdp_republic_unrest.0322.a: "哦，你回来了！"
 gdp_republic_unrest.0322.a.rival: "好，现在我们可以继续处理正事了。"
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "首都暴动：为时已晚"
 gdp_republic_unrest.0323.desc: "天黑之后传来了敲门声。我听见外面有人说话，然后安静下来。\n\n当我赶到庭院时，心中已经有了预感。[heir.GetFirstNameNoTooltip]在那里，躺在石板上。暴民把[heir.GetHerHim]的尸体送了回来。"
 gdp_republic_unrest.0323.desc.rival: "天黑之后传来了敲门声。当我赶到庭院时，心中已经有了预感。\n\n[heir.GetFirstNameNoTooltip]在那里，躺在石板上。暴民把[heir.GetHerHim]的尸体送了回来。我在原地站了很久，看着我的继承人的尸骸。"
 gdp_republic_unrest.0323.a.child: "看看他们是怎么残害我的孩子的……"
 gdp_republic_unrest.0323.a: "[heir.GetFirstNameNoTooltip]，他们对你做了什么？"
