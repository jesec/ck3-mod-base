l_simp_chinese:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "推翻政府"
 overthrow_government_outcome.1001.desc: "阴谋已经走到了高潮。现在正是最后的时机，错过就再也没有机会。关键同谋已经被安插进了城守卫队的营房、议会和宫殿里。只要我一声令下，他们就会掌控权力枢纽，确保旧政权能被彻底清除。\n\n明天议会将别无选择，只能承认我的政权，并将反对我的人定罪为国家公敌。"
 overthrow_government_outcome.1001.a: "没有流血，没有放逐。"
 overthrow_government_outcome.1001.b: "我的私敌。"
 overthrow_government_outcome.1001.c: "所有反对我们的人都必须离开。"
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "共和国屹立不倒"
 overthrow_government_outcome.1002.desc: "我的贵人当中有一场阴谋暴露了，是那个恶棍[owner.GetShortUINameNoTooltip]策划的。幸好，这场政变在我光辉政府的坚石上撞得粉碎！\n\n那些恶徒试图劫持我本人，但我的卫兵击退了他们的企图。尽管他们费尽心机，议会和军队仍然效忠于我。"
 overthrow_government_outcome.1002.a: "把他们抓起来！"
 overthrow_government_outcome.1002.b: "我自会及时处置他们。"
 overthrow_government_outcome.1002.c: "我会发自内心地原谅。"
 overthrow_government_outcome_forgive_tt: "赦免了[owner.GetShortUIName]及其[agents|E]的[criminal|E]，他们不再被视为国家公敌"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "被推翻"
 overthrow_government_outcome.1003.desc: "“大人！”[craftsman_character.GetShortUINameNoTooltip]冲进门来喊道，像是拼了命一路跑过来的。\n\n“有阴谋！是叛国！[owner.GetShortUINameNoTooltip]已经纠集了一批同党，打算让议会给你扣上国家公敌的罪名！暴徒就在路上！”\n\n[craftsman_character.GetSheHe|U]像笼中困兽一样在房间里踱来踱去。“我们该怎么办？”[craftsman_character.GetSheHe]问道。"
 overthrow_government_outcome.1003.b.desc: "“大人！”[craftsman_character.GetShortUINameNoTooltip]冲进门来喊道，像是拼了命一路跑过来的。\n\n“阴谋！叛国！[owner.GetShortUINameNoTooltip]已纠集了一批同党，推动议会宣布成立新政府。街上传言你已被废黜，但新政府赦免了他们所有的政治敌人。”\n\n[craftsman_character.GetSheHe|U]看着我，神情沮丧。“我们该怎么办？”[craftsman_character.GetSheHe]问道。"
 overthrow_government_outcome.1003.a: "我将在[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]和议会前为自己申辩。"
 overthrow_government_outcome.1003.b: "我将流亡。"
 overthrow_government_outcome.1003.c: "我将远离政治，做一名卑微的商人。"
 overthrow_government_outcome.1003.d: "暂时没什么。这就是政治的潮流。"
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "国家公敌"
 overthrow_government_outcome.1004.1.desc: "我被宣布为了国家公敌！"
 overthrow_government_outcome.1004.2.desc: "\n\n公告已张贴于每个市集广场和每座教堂大门之上。我的性命与财产正岌岌可危。"
 overthrow_government_outcome.1004.3.desc: "\n\n我随时都可能被逮捕！"
 overthrow_government_outcome.1004.councilor.desc: "\n\n毫无疑问，这是因为我在被推翻政权的内阁中身居要职。"
 overthrow_government_outcome.1004.personal.desc: "\n\n既然[owner.GetName]视我为私敌，其中的原因便不难猜到了。"
 overthrow_government_outcome.1004.political.desc: "\n\n毫无疑问，这是因为我身为有势力的贵人，同时是反对新政权[owner.GetHouse.GetHouseAspiration.GetName]议程的重要发声者。"
 overthrow_government_outcome.1004.conspiracy.desc: "\n\n毫无疑问，这是因为我在推翻政府的阴谋中担任同谋。"
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "骰子已经掷下"
 overthrow_government_outcome.1005.desc: "空气中弥漫着紧绷的期待感，[speaker.GetShortUINameNoTooltip]迈步上前，站上了议会的发言台。\n\n“贵人们！祖国与共和国万岁。我很痛心地告知各位，我们的[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U][target.GetFirstNameNoTooltip]已被废黜，因为腐败与背叛共和国——”\n\n大厅中掀起一阵惊呼和议论，但几位有影响力的贵人站起来鼓了掌。\n\n“根据紧急法令，公民[owner.GetFirstNameNoTooltip]已接任，作为我们的新[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]来稳住国家的航船。”\n\n更多贵人站起身，掌声变得更加响亮。"
 overthrow_government_outcome.1005.a: "共和国万岁！"
 overthrow_government_outcome.1005.b: "嘘！暴君！叛国！"
 government_overthrow_enemies.1001.b.custom: "以下贵人成为[criminals|E]：\n$EFFECT_LIST_BULLET$被推翻的[liege|E]和[councillors|E]\n$EFFECT_LIST_BULLET$你的[rivals|E]和[nemesis|E]\n$EFFECT_LIST_BULLET$对你的[opinion|E]不高于#N ‑60#!的角色\n$EFFECT_LIST_BULLET$拥有[rivalry|E][house_relation|E]的[house_heads|E]\n$EFFECT_LIST_BULLET$他们可能在[assembly|E]请求宽恕或流亡\n$EFFECT_LIST_BULLET$[friends|E]、[lovers|E]、[soulmates|E]和[blood_brothers|E]除外"
 government_overthrow_enemies.1001.c.custom: "以下贵人成为[criminals|E]：\n$EFFECT_LIST_BULLET$任何[house_ambition|E]不同的[powerful_vassal|E]\n$EFFECT_LIST_BULLET$被推翻的[liege|E]和[councillors|E]\n$EFFECT_LIST_BULLET$你的[rivals|E]和[nemesis|E]\n$EFFECT_LIST_BULLET$对你的[opinion|E]不高于#N ‑60#!的角色\n$EFFECT_LIST_BULLET$拥有[rivalry|E][house_relation|E]的[house_heads|E]\n$EFFECT_LIST_BULLET$你[agents|E]的私敌\n$EFFECT_LIST_BULLET$他们可能在[assembly|E]请求宽恕或流亡"
 government_overthrow_populace.1001.a.custom: "你的[realm|E]内所有[county|E]"
 government_overthrow_populace.1001.a.description: "你全面赦免了新政权的反对者。"
 government_overthrow_forgiven.tt: "你被赦免了对国家的罪行"
 overthrow_government_outcome.tt.success.desc: "你雄辩地为自己的行为进行了辩护"
 overthrow_government_outcome.tt.success.toast: "你证明了自己的行动是出于对共和国的热爱"
 overthrow_government_outcome.tt.failure.desc: "你的演讲无人倾听"
 overthrow_government_outcome.tt.failure.toast: "你被嘘声赶下演讲台，离开了议会"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip]成为了一名卑微的商人"
 overthrow_government_enemy_of_the_state.tt: "议会已宣布你为国家公敌"
 overthrow_government_amnesty.tt: "议会全面赦免了所有阴谋者"
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip]因你密谋反对国家而下令逮捕你"
 overthrow_government_blanket_pardon.tt: "推翻政府：赦免"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip]已发布公告，赦免[the_new_dodge.GetHerHis]的所有政敌。"
