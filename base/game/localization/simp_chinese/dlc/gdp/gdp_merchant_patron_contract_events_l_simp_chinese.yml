l_simp_chinese:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]：[patron.GetTitleAsNameNoTooltip]的[patron.Custom('GetRoomPlural')|U]"
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName]是一位了不起的[patron.GetWomanMan]，来自[patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]及更远地方的贵族、教士、商人和平民，都在争相博取[patron.GetHerHis]的关注和庇护。\n\n我们必须坦诚，但也要小心行事，才能确保商会一直受到[patron.GetHerHis]的青睐，既不被更狡猾的对手盖过风头，也不至于完全从[patron.GetHerHis]的视线中消失。\n\n我们的生意必须时刻挂在[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]的显贵们嘴边。"
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$：成功"
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName]无法抗拒我讲述的远方之地和纵横交错的商路，每晚在宴席上都听得入了神。\n\n我可以放心回到公司，因为知道[patron.GetFirstNameNoTooltip]把我们当成有价值的伙伴和受欢迎的朋友。\n\n我们在[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]的声望已大大提升，而且毫无疑问，我的影响力会先我一步传到更远的地方。"
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$：失败！"
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName]召见我的次数越来越少，是我做错了什么吗？[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]那些廷臣态度的变化，证实了[patron.GetHerHis]的不满。\n\n是我讲的轶事让[patron.GetHerHim]觉得无聊了？还是我对商业的反复谈论太多了？又或者我越过了#EMP 贵族#!某条看不见的界限？\n\n现在没有别的办法，只能回到商会，尽量弥补，把事情拉回正轨……"
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "受打动的庇护者"
 gdp_impressed_patron_modifier_desc: "该商人费尽心思地讨好自己的庇护人，给对方留下了深刻的印象。"
 gdp_impressed_patron_critical_modifier: "受打动的庇护者"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "不屑一顾的庇护者"
 gdp_dismissive_patron_modifier_desc: "该商人试图讨好其庇护者的努力未能达到预期效果。"
