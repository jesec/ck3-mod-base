l_simp_chinese:
 guelphs_ghibellines_prefix: "归尔甫派与吉伯林派："
 gdp_guelph_ghibelline.0500.t: "归尔甫派与吉伯林派"
 gdp_guelph_ghibelline.0500.intro.all: "一个怀疑的眼神；一声不屑的冷哼——[pope_scope.GetTitledFirstName]与[ghibelline_leader.GetTitledFirstName]之间的冲突，已在北意大利那些曾经紧密相连的社区中制造了一道不断扩大的裂痕。\n\n那些为了帝国权威与庇护而支持[ghibelline_leader.GetTitleAsNameNoTooltip]的吉伯林派，正与那些通过支持教宗寻求更大独立的归尔甫派针锋相对。"
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "一个怀疑的眼神；一声不屑的冷哼——背教者[ghibelline_leader.GetTitleAsName]与我虔诚的官员之间的这场荒唐冲突，已在北意大利那些曾经紧密相连的社区中制造了一道不断扩大的裂痕。\n\n那些为求安全与庇护而支持吉伯林派的人，正与我敬畏上帝的归尔甫派针锋相对；后者不过是在这位暴君面前维护自身的主权。\n\n我们将合力让[ghibelline_leader.GetTitleAsNameNoTooltip]认清道理。是时候施展我[ROOT.Char.Custom('GetHighestSkillAdjective')]的才能了。"
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "一个怀疑的眼神；一声不屑的冷哼——教廷里那帮蠢货与我之间这场荒唐的冲突，已在北意大利那些曾经紧密相连的社区中制造了一道不断扩大的裂痕。\n\n那些为了安全与庇护而支持#EMP 我#!的吉伯林派，正与那些通过支持教宗寻求更大独立的幼稚归尔甫派针锋相对。\n\n作为[ghibelline_leader.GetTitleAsNameNoTooltip]，我越来越提防这些教会里的归尔甫派搅局者。他们削弱我的权威已经够久了，但他们终将俯首听命——不管用哪种方式……"
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\n愿我们尽职的领袖[guelph_leader.GetFirstNameNoTooltip]代我们发声，挺身反抗帝国的压迫者。而我，也将尽我的一份力。"
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\n我深信我们的[ghibelline_leader.GetTitleAsNameNoTooltip]是真正捍卫我们人民与疆土，对抗意图伤害我们之人的人。作为回报，我将全力支持[ghibelline_leader.GetHerHis]的吉伯林派。"
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\n既然我还没有选边站队，就必须仔细掂量这争吵的双方，以便为[ROOT.Char.GetHouse.GetBaseName]的最大利益行事。"
 gdp_guelph_ghibelline.0500.a: "前进！"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "我注意到，你在这场恼人的冲突中不遗余力地宣传并巩固[ROOT.Char.Custom('GetGuelphGhibellinePossessive')]的权力地位。\n\n为此，我向你致以最诚挚的感谢。"
 gdp_guelph_ghibelline.1000.a: "无任感激！"
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "我短期内不会加入你那破败的[actor.Custom('GetGuelphsGhibellines')]。"
 gdp_guelph_ghibelline.5000.a: "太不明智了。"
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U]在几年内将无法要求[recipient.GetShortUIName]加入[actor.Custom('GetGuelphsGhibellines')]"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$《沃尔姆斯宗教协定》"
 gdp_guelph_ghibelline.6500.desc: "这场冲突已经持续够久了。经过深思熟虑，我的文书向我呈上了一份书面协议：\n\n[ghibelline_leader.GetTitleAsNamePossessive|U]在教会任命上的影响力将受到限制，但协议允许[ghibelline_leader.GetHerHim]回来监督选举，并在有争议的结果中进行裁决。\n\n我挠着下巴，仔细思考这对我们所有人会有什么影响。"
 gdp_guelph_ghibelline.6500.a: "这是前进的方向。"
 gdp_guelph_ghibelline.6500.b: "教廷的权力#EMP 至高无上#!！"
 concordat_of_worms_fulfilled.t: "《沃尔姆斯宗教协定》已签订"
 concordat_of_worms_abandoned.t: "《沃尔姆斯宗教协定》已废除"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName]决定是否接受协议"
 cow_phase_moves_to_agitation.tt: "[GetSituation('guelph_ghibelline').GetName]离开序幕阶段，进入了[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]"
 cow_phase_moves_to_repose.tt: "[GetSituation('guelph_ghibelline').GetName]离开序幕阶段，进入了[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "让我们暂时放下分歧，就管理你教会任命事务的正确方式达成一致。\n\n作为交换，[ROOT.Char.GetTitleAsNameNoTooltip|U]可以出席选举并处理有争议的结果。"
 gdp_guelph_ghibelline.6505.a: "我想这应该足够……"
 gdp_guelph_ghibelline.6505.b: "简直无法接受！"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$$lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "消息传来，[hre_kaiser.GetTitleAsName]正将目光投向北意大利，意图在该地区集权并加强[hre_kaiser.GetHerHis]的权力。我的信使们也已返回向我报告："
 gdp_guelph_ghibelline.7000.desc.all: "\n\n所有的应询者都已应我之邀加入了伦巴第同盟。\n\n现在，我们已经足够强大，可以抵挡[hre_kaiser.GetTitleAsName]任何突然的举动……！"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\n超过半数的应询者都已应我之邀加入了伦巴第同盟。\n\n这应该能让我们抵挡[hre_kaiser.GetTitleAsName]，希望我们还能从那些神圣的朋友那里得到更多援助……"
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\n只有少数响应者加入了伦巴第同盟；这很难不让我有些担忧。\n\n#EMP 没关系！#!只要有一点神圣的援助，我们应该能够捍卫我们新获得的独立。"
 gdp_guelph_ghibelline.7000.a: "是时候做出改变了！"
 gdp_guelph_ghibelline.7000.b: "我们的时代到了！"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$加入$lombard_league_name$？"
 gdp_guelph_ghibelline.7005.desc: "看来[league_creator.GetTitledFirstName]终究是位值得尊敬的[league_creator.GetWomanMan]。\n\n我收到消息，[league_creator.GetSheHe]已经组建了[lombard_league_conf.GetName]，这是一项旨在抵御[hre_kaiser.GetTitleAsName]推进的倡议。\n\n如果有人想要摆脱帝国的枷锁，这看起来的确是个不错的举措……"
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "先别这么着急……"
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$$lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "我的信使报告称，那个好争吵的[ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))]#EMP [league_creator.GetTitledFirstName]#!对[league_creator.GetCapitalLocation.GetTitle.GetNameNoTier]的现状感到不满，这个背信弃义的[ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))]还说服了其他软弱的胆小鬼加入[league_creator.GetHerHim]！\n\n#EMP 伦巴第同盟#!？到底算个什么东西？！"
 gdp_guelph_ghibelline.7010.a: "他们的傲慢必须受到惩罚！"
 gdp_guelph_ghibelline.7010.b: "我的目光正放在别的事情上。"
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName]已创建[league_creator.GetConfederation.GetName]#weak （目前#V [lombard_league_conf.GetMemberCount]#!名成员）#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "恐怕伦巴第同盟没有你的#EMP 慷慨#!资助也能过得去。"
 gdp_guelph_ghibelline.7015.a: "嗯……"
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$达成妥协"
 gdp_guelph_ghibelline.8500.desc: "当归尔甫派与吉伯林派的两位代表[guelph_leader.GetName]和[ghibelline_leader.GetName]会面签署条约时，人群中窃窃私语。\n\n有人欢喜，有人则因不得不达成妥协、被迫放弃自己坚信不疑的正确理念而明显不安。\n\n随后，人群逐渐散去，窃窃私语仍在继续，大家移步参加惯例的晚宴准备。"
 gdp_guelph_ghibelline.8500.a: "终于结束了。"
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "我看出你仍未认识到自己的错误。既然你们[actor.Custom('GetGuelphsGhibellines')]显然理亏，凭什么要我们做出如此巨大的让步？\n\n要不是这事太过荒唐，我倒会觉得有些可笑。"
 gdp_guelph_ghibelline.8510.a: "狂妄至极！"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U]拒绝了你结束[GetSituation('guelph_ghibelline').GetName][situation|E]的提议"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "这份协议是一次外交上的展示，这一点毋庸置疑。\n\n[guelph_leader.GetName]和[ghibelline_leader.GetName]都做出了妥协，赢得了一些小的胜利，但失去了民意的支持。\n\n达成一项经得起时间考验的条约并非易事；我们且看我们当中有多少人能够放下过去，向前看，走向更光明的未来。"
 gdp_guelph_ghibelline.8520.a: "我想这样也好。"
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$[ROOT.Char.Custom('GetGuelphGhibelline')]获胜"
 gdp_guelph_ghibelline.9000.desc.guelph: "尘埃落定。我们捍卫了至圣的权利——即教宗得以保全并遴选未来神圣牧者的最高权威。\n\n同时，[GetTitleByKey('e_hre').GetName]的影响力也得到限制，其野心终究威胁着我们所有人。\n\n那些#EMP 误入歧途#!的吉伯林灵魂恐怕至死都不知遭遇了什么。"
 gdp_guelph_ghibelline.9000.desc.ghibelline: "最终，依照[ROOT.Char.GetFaith.HighGodName]的意愿，我们证明了我们有主权权利——以严厉的手腕和理性的头脑来统治帝国的正当主权。\n\n毕竟，一个被废黜的神圣媒介怎能决定谁最适合统治[GetTitleByKey('e_hre').GetName]的土地。\n\n那些支持教宗的归尔甫派，就让他们去管我们的灵魂吧，由我们来管#EMP 真正#!重要的事。"
 gdp_guelph_ghibelline.9000.a: "我觉得是该好好庆祝一下了。"
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$[ROOT.Char.Custom('GetGuelphGhibelline')]失败"
 gdp_guelph_ghibelline.9010.desc.win: "我们一次又一次地在面对软弱的[ROOT.Char.Custom('GuelphGhibellineGetOpposite')]反对派时获得人民的支持。\n\n我们杰出的领袖[victorious_leader.GetTitledFirstName]以及独立的立法者已经宣布[ROOT.Char.Custom('GetGuelphsGhibellines')]是正确的，并已一劳永逸地解决了这个持续的#EMP 局势#!。\n\n终于，理性在这个世界的一角开始显现了。"
 gdp_guelph_ghibelline.9010.desc.lose: "我们的支持在减少，这是事实。\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')]的权力和影响力都没有达到它该有的程度，没有达到它需要的程度，而那些愚蠢的[ROOT.Char.Custom('GuelphGhibellineGetOpposite')]统治者已经搜罗了一帮难以抵挡的#EMP 独立#!立法者来支持他们。\n\n是时候让[ROOT.Char.Custom('GetGuelphsGhibellines')]放弃这场争斗，转而专注于那些更能实现的目标了。"
 gdp_guelph_ghibelline.9010.a.win: "让我们尽情享受这一刻吧。"
 gdp_guelph_ghibelline.9010.a.lose: "那些#EMP 毒蛇#!！"
