l_simp_chinese:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]：[local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "穿过[local_county.GetNameNoTierNoTooltip]的[local_province.Custom('GetTerrainLandPlural')]，我的队伍到达当地定居点附近，在[local_province.Custom('GetProvinceFoliageDescAdjective')]的郊外扎营，"
 gdp_merchant_luxury_contract.0001.desc.locals: "我们磕磕绊绊地向一群路过的村民询问本地的野生动物，得到了难以听懂但确定无疑的答复："
 gdp_merchant_luxury_contract.0001.desc.locals_language: "我们向一群路过的村民询问本地的野生动物并得到了答复："
 gdp_merchant_luxury_contract.0001.desc.jungle: "空气中弥漫着花蜜的甜香。"
 gdp_merchant_luxury_contract.0001.desc.mountain: "轻快的风在树枝间呼啸。"
 gdp_merchant_luxury_contract.0001.desc.desert: "烈日灼烧着寂静的大地。"
 gdp_merchant_luxury_contract.0001.desc.plains: "空气中弥漫着令人陶醉的野花芬芳。"
 gdp_merchant_luxury_contract.0001.desc.big_cat: "可怕的猫。"
 gdp_merchant_luxury_contract.0001.desc.small_cat: "狡猾的猫。"
 gdp_merchant_luxury_contract.0001.desc.bear: "凶猛的熊。"
 gdp_merchant_luxury_contract.0001.desc.monkey: "顽皮的猴子。"
 gdp_merchant_luxury_contract.0001.desc.elephant: "雄伟的大象。"
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "可怕的猫和凶猛的熊。"
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "凶猛的熊和雄伟的大象。"
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "可怕的猫和雄伟的大象。"
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "顽皮的猴子和可怕的猫。"
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "顽皮的猴子和雄伟的大象。"
 gdp_merchant_luxury_contract.0001.desc.bird: "迷人的鸟儿。"
 gdp_merchant_luxury_contract.0001.desc.close: "看起来至少我们走在正轨上！"
 gdp_merchant_luxury_contract.0001.a: "荒野中的野兽等待着我们！"
 gdp_merchant_luxury_contract.0001.a.flavor: "倾向于展示[martial_i|E][martial|E]、[intrigue_i|E][intrigue|E]和[prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "尝试在荒野中捕获一只#V 异兽#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.0001.b: "让我们看看在[local_barony.Custom('BaronyTownType')]能找到什么。"
 gdp_merchant_luxury_contract.0001.b.flavor: "倾向于展示[diplomacy_i|E][diplomacy|E]、[stewardship_i|E][stewardship|E]和[gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.0001.b.tt: "尝试在市中心获得一只#V 异兽#![domicile_artifact|E]"
 gdp_merchant_luxury_contract_back_to_town_tt: "你决定返回[local_barony.Custom('BaronyTownType')]"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "你决定返回荒野"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]：本土特色"
 gdp_merchant_luxury_contract.0011.desc: "漫步在[local_province.GetBaronyNameExplicitlyNoTooltip]陌生的街巷间，我很快便来到一处[local_province.Custom('GetProvinceAdjective')]的[local_province.Custom('GetRegionalMarketTermGloss')]，那里有位衣着考究的[rich_local.GetWomanMan]，令人难以忽视，正在和"
 gdp_merchant_luxury_contract.0011.cage: "一只被关在笼子里的[rich_local.Custom('GetAnimalType')]交谈！"
 gdp_merchant_luxury_contract.0011.shoulder: "[rich_local.GetHerHis]肩膀上的[rich_local.Custom('GetAnimalArticle')][rich_local.Custom('GetAnimalType')]交谈！"
 gdp_merchant_luxury_contract.0011.leashed: "[rich_local.GetHerHis]身边一只套着项圈的[rich_local.Custom('GetAnimalType')]交谈！"
 gdp_merchant_luxury_contract.0011.close: "\n\n我从附近的小贩那里得知，[rich_local.GetSheHe]是[rich_local.GetTitledFirstName]，本地一名[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)]大人物，对奇珍异兽颇有兴趣。\n\n或许，[rich_local.GetSheHe]会愿意达成一笔交易？"
 gdp_merchant_luxury_contract.0011.a: "“好[Select_CString( rich_local.IsFemale, '夫人', '先生' )]，我们能否谈谈您那了不起的[rich_local.Custom('GetAnimalType')]？”"
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.GetSheHe|U]将[rich_local.Custom('GetAnimalType')]卖给了你"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetSheHe|U]拒绝了你的提议"
 gdp_merchant_luxury_contract.0011.b: "我能找到我自己的……"
 gdp_merchant_luxury_contract.some_other_way: "你必须找到其他途径来获取异兽"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.GetTitledFirstName]好奇地上下打量着我，我一边作自我介绍，一边对[rich_local.GetHerHis]的宠物大加赞美。\n\n"
 gdp_merchant_luxury_contract.0012.success: "我说着话时，[rich_local.GetHerHis|U]神情变得热络起来，热切地接受我的赞美，并好奇地询问我为何来到离家这么远的地方。\n\n我们很快谈妥了价格，而我转眼间就成了这非凡[rich_local.Custom('GetAnimalType')]的主人！"
 gdp_merchant_luxury_contract.0012.failure: "[rich_local.GetHerHis|U]的表情很快就变了，先是皱起眉头，继而轻蔑地嗤笑一声，毫不客气地挥手示意[rich_local.GetHerHis]的侍从将我打发走。\n\n那个自大的蠢货待#EMP 我#!仿佛是那只[rich_local.Custom('GetAnimalType')]……"
 gdp_merchant_luxury_contract.0012.a: "这将成为[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]的谈资！"
 gdp_merchant_luxury_contract.0012.b: "等等，听着，我可以给你更多！"
 gdp_merchant_luxury_contract.0012.c: "那个白痴住在哪里？那只[rich_local.Custom('GetAnimalType')]#EMP 会#!是我的！"
 gdp_merchant_luxury_contract.0012.c.success: "你偷走了[rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0012.c.failure: "你勉强逃脱了守卫的追捕"
 gdp_merchant_luxury_contract.0012.d: "#weak *摇摇头*#!“算了，我自己去抓一只。”"
 gdp_merchant_luxury_contract.0012.e: "我受够了……"
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "要在[local_province.GetBaronyNameExplicitlyNoTooltip]找到[rich_local.GetTitledFirstNamePossessive]的庄园并不困难，先在酒馆招募几个当地恶棍，接着等到夜幕降临后趁其不备发起突袭。\n\n"
 gdp_merchant_luxury_contract.0013.success: "突破外围防线简直易如反掌，转眼间我们已深入数条街道，于是竖起耳朵倾听是否有警报声。\n\n[rich_local.Custom('GetAnimalPossessive')]低沉的[rich_local.Custom('GetAnimalSoundPresent')]是唯一能听到的声音！"
 gdp_merchant_luxury_contract.0013.failure: "不幸的是，我的好运到此为止！那只狡猾[rich_local.Custom('GetAnimalPossessive')]的[rich_local.Custom('GetAnimalSoundPresent')]引来了守卫，计划彻底败露，我好不容易才逃脱……\n\n[rich_local.GetFirstNamePossessiveNoTooltip]的手下肯定会追捕我的！"
 gdp_merchant_luxury_contract.0013.a: "那蠢货本该把它卖给我的！"
 gdp_merchant_luxury_contract.0013.b: "我必须立刻离开这里！"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]：异兽"
 gdp_merchant_luxury_contract.0021.desc: "在如同迷宫般的[local_barony.Custom('BaronyTownType')][local_province.Custom('GetRegionalMarketTermGloss')]深处，一股恶臭和野兽的叫声引我走向一个摊位破旧、面相[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)][dealer.GetWomanMan]，身边这片[local_province.Custom('GetProvinceAdjective')]的空地上摆满了各种[local_province.Custom('GetRandomRegionalWood')]制成的笼子。\n\n看到我感兴趣，[dealer.GetSheHe]急切地向我招手。真是大饱眼福！一只雄壮的[ROOT.Char.Custom('GetAnimalType')]立刻吸引了我的注意。当我欣赏着它[ROOT.Char.Custom('GetAnimalFeature')]时，一只相当凄惨的[dealer.Custom('GetAnimalType')]正[dealer.Custom('GetAnimalSoundPresent')]着以示抗议。\n\n我看货时，小贩的眼睛闪着贪婪的光芒。"
 gdp_merchant_luxury_contract.0021.a: "“真漂亮……我一定要得到这只[ROOT.Char.Custom('GetAnimalType')]！”"
 gdp_merchant_luxury_contract.0021.b: "他们肯定也在[local_province.GetBaronyNameExplicitlyNoTooltip]讨价还价……"
 gdp_merchant_luxury_contract.0021.b.success_critical: "你做了一笔绝妙的交易"
 gdp_merchant_luxury_contract.0021.b.success: "你省下了几枚[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]"
 gdp_merchant_luxury_contract.0021.b.failure: "你只把事情弄得更糟"
 gdp_merchant_luxury_contract.0021.b.tt: "你将可以选择拒绝"
 gdp_merchant_luxury_contract.0021.c: "#weak *指着*#!“我要这只[dealer.Custom('GetAnimalType')]！”"
 gdp_merchant_luxury_contract.0021.d: "“我只是随便看看。”"
 task_contract_success_pseudo: "#P 成功：#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "商贩眨了眨眼，显然是个天生的叫卖好手。我们讨价还价了仿佛一个时代之久，仔细检视[ROOT.Char.Custom('GetAnimalPossessive')][ROOT.Char.Custom('GetAnimalHide')]上的每一个印记，并争论其[ROOT.Char.Custom('GetAnimalSoundPresent')]的品质。\n\n"
 gdp_merchant_luxury_contract.0022.success: "我据理力争，[dealer.GetSheHe]被我的论点弄得有些慌乱。很快[dealer.GetSheHe]就妥协了，大幅降低了价格，不过总归还是有个限度……"
 gdp_merchant_luxury_contract.0022.neutral: "我的观点一定对[dealer.GetHerHim]产生了些影响，[dealer.Custom('GetWomanManPossessive')]的价格略有下降，不过[dealer.GetSheHe]不愿再让步了……"
 gdp_merchant_luxury_contract.0022.failure: "我似乎惹恼了[dealer.GetHerHim]，因为这[dealer.Custom('GetWomanManPossessive')]反而提高了价格，并且[dealer.GetSheHe]现在决不肯让步……"
 gdp_merchant_luxury_contract.0022.a: "“成交。”"
 gdp_merchant_luxury_contract.0022.b: "“其实，我想要的是这只[dealer.Custom('GetAnimalType')]……”"
 gdp_merchant_luxury_contract.0022.c: "#weak *摇摇头*#!“算了。”"
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "终于，我实现了目标，成为了[ROOT.Char.Custom('GetAnimalArticle')][ROOT.Char.Custom('GetAnimalType')]的自豪主人！这骄傲的生物已被妥善安置，准备随我们一起回家。\n\n等着瞧他们在[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]看到它时的表情吧！"
 gdp_merchant_luxury_contract.0023.a: "出发。"
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]：狩猎"
 gdp_merchant_luxury_contract.0041.desc: "离开小径，我深入[local_province.Custom('GetTerrainType')]，拨开[local_province.Custom('GetProvinceFoliageDesc')]搜寻任何野兽的踪迹。只有鸟鸣打破诡异的寂静。我拉紧了斗篷。\n\n就在转身要离开一片灌木丛时，我差点错过！就在[local_province.Custom('GetProvinceGroundDesc')]之间，赫然是数道[ROOT.Char.Custom('GetAnimalTrack')]印！远处突然传来的[ROOT.Char.Custom('GetAnimalSound')]证实了这一点：附近藏着一只[ROOT.Char.Custom('GetAnimalType')]！"
 gdp_merchant_luxury_contract.0041.a: "快追，趁它还没逃走！"
 gdp_merchant_luxury_contract.0041.a.tt: "你追逐着[THIS.Char.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0041.b: "算了，我们回去吧！"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "当我穿过[local_province.Custom('GetProvinceFoliageDesc')]时，眼角瞥见一抹[ROOT.Char.Custom('GetAnimalColor')]色的[ROOT.Char.Custom('GetAnimalHide')]。我担心最坏的情况，猛地转回身，心几乎要从胸口跳出来！\n\n面前是一只瘦小的[ROOT.Char.Custom('GetAnimalType')]，还只是[ROOT.Char.Custom('GetAnimalChild')]。它那双又大又好奇的眼睛注视着我，一点也不怕。我环顾四周，它看起来孤零零的，看不见父母，也看不见任何[ROOT.Char.Custom('GetAnimalGroup')]同类……"
 gdp_merchant_luxury_contract.0042.a: "我是专为成年的猛兽而来！"
 gdp_merchant_luxury_contract.0042.a.tt: "你继续寻找一只成年[THIS.Char.Custom('GetAnimalType')][artifact|E]"
 gdp_merchant_luxury_contract.0042.b: "也许我可以设个陷阱……"
 gdp_merchant_luxury_contract.0042.b.success: "你将[ROOT.Char.Custom('GetAnimalChild')]用作诱饵"
 gdp_merchant_luxury_contract.0042.b.success.tt: "你也获得一只成年[THIS.Char.Custom('GetAnimalType')][artifact|E]"
 gdp_merchant_luxury_contract.0042.b.failure: "你失败了，[ROOT.Char.Custom('GetAnimalChild')]逃走了"
 gdp_merchant_luxury_contract.0042.c: "该走了。跟我一起走吧，#EMP 小家伙#!！"
 baby_creature_artifact_name: "[baby_creature.GetNameNoTooltip]幼崽"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "[local_province.Custom('GetProvinceFoliageDesc')]里突然闪过一道光，我吓了一跳，以为有什么野兽摸到了我身边，心里担心最坏的情况！\n\n看到那只是一名本地猎人，正怀疑地盯着我，箭已搭在弦上，我松了一口气。\n\n“哈，你是来找[ROOT.Char.Custom('GetAnimalPlural')]的吗？我以前没见过你这种人。”"
 gdp_merchant_luxury_contract.0043.a: "那个，你能……帮帮我吗？"
 gdp_merchant_luxury_contract.0043.b: "能与你一起狩猎，是我的荣幸！"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip]协助你"
 gdp_merchant_luxury_contract.0043.b.success_tt: "你将拥有更高的成功几率"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip]无视你"
 gdp_merchant_luxury_contract.0043.c: "别挡我的路。"
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "把温顺的[ROOT.Char.Custom('GetAnimalChild')]赶到合适的空地，再用绳子拴在地上，就这么简单。\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName]是个不错的帮手，对当地的[local_province.Custom('GetTerrainType')]和上面的生物都很了解。没过多久，我们就找到了[ROOT.Char.Custom('GetAnimalPossessive')]的踪迹！\n\n"
 gdp_merchant_luxury_contract.0044.desc: "在这片陌生的土地上，我们时不时走错路或折返重走，但很快就发现了[ROOT.Char.Custom('GetAnimalPossessive')]的踪迹！\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "果然，它那轻轻的[ROOT.Char.Custom('GetAnimalSoundParticiple')]很快就引来了一只成年[ROOT.Char.Custom('GetAnimaltype')]的注意。我们看着那野兽从[local_province.Custom('GetProvinceFoliageDesc')]里小心地张望。最后它试探着靠近了[ROOT.Char.Custom('GetAnimalChild')]，我们立刻触发了陷阱！"
 gdp_merchant_luxury_contract.0044.bait_failure: "计划里不是这样的……那该死的东西安安静静地坐了一会儿，轻声[ROOT.Char.Custom('GetAnimalSoundParticiple')]着，突然就拼了命地挣扎起来，一下挣脱了束缚，消失在了[local_province.Custom('GetProvinceFoliageDesc')]里……"
 gdp_merchant_luxury_contract.0044.success: "我们很幸运，[local_province.Custom('GetProvinceFoliageDesc')]里的那只[ROOT.Char.Custom('GetAnimalType')]毫无察觉，伴随着一阵[ROOT.Char.Custom('GetAnimalSoundParticiple')]，那[ROOT.Char.Custom('GetAnimalColor')]色的身影落入了网中！"
 gdp_merchant_luxury_contract.0044.failure: "然而，事情很快就出了岔子。我们刚发现它，那野兽就受到惊吓，如一道[ROOT.Char.Custom('GetAnimalColor')]光[ROOT.Char.Custom('GetAnimalSoundParticiple')]着冲进了[local_province.Custom('GetTerrainLand')]里，根本抓不住。"
 gdp_merchant_luxury_contract.0044.a: "多般配的一对啊！"
 gdp_merchant_luxury_contract.0044.b: "该死的畜生！"
 gdp_merchant_luxury_contract.0044.c: "抓住你了！"
 gdp_merchant_luxury_contract.0044.d: "该死的畜生！"
 gdp_merchant_luxury_contract.0044.e: "你想去[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]吗，[hunter.GetFirstNameNoTooltip]？"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]：偷猎"
 gdp_merchant_luxury_contract.0051.desc: "我们偶然发现了一个[local_province.Custom('GetProvinceGroundDescAdjective')]的村子，便向人打听当地的野兽。村长一脸严肃地警告我们快走，说有个当地的大人物——“[rich_local.GetName]”，正在这一带狩猎[rich_local.Custom('GetAnimalPlural')]。\n\n正当我们准备离开时，一个[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)]村民冒了出来，悄悄说要抓一只[rich_local.GetTitleAsNamePossessiveNoTooltip]的[rich_local.Custom('GetAnimalPlural')]其实很容易！\n\n这主意够大胆的，但这么好的机会，真要错过吗？"
 gdp_merchant_luxury_contract.0051.a: "[rich_local.Custom('GetAnimalType')]？我们马上出发！"
 gdp_merchant_luxury_contract.0051.a.flavor: "当地人可能会受到惩罚……"
 gdp_merchant_luxury_contract.0051.a.tt: "你将尝试从[rich_local.GetShortUIName]那偷猎"
 gdp_merchant_luxury_contract.0051.b: "我不会与[rich_local.GetTitleAsNameNoTooltip]发生冲突……"
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "我的向导[hunter.GetFirstName]带着我们飞快地穿过[local_province.Custom('GetProvinceFoliageDesc')]，以惊人的速度在[local_province.Custom('GetTerrainTypePlural')]上行进。来到一片空地时，[hunter.GetSheHe]突然停下脚步，竖起一只耳朵。\n\n“别出声！”[hunter.GetSheHe]低声说着，把我拉到了隐蔽处，“很近了。”\n\n就在那一瞬间，一行人轰隆隆地从我们身边经过，马蹄踏过[local_province.Custom('GetProvinceGroundDesc')]，远处传来猎人们的呼喊声。\n\n然后，我听到了：一只[rich_local.Custom('GetAnimalType')]的[rich_local.Custom('GetAnimalSound')]！"
 gdp_merchant_luxury_contract.0052.a: "来了！撒网！"
 gdp_merchant_luxury_contract.0052.a.success: "你抓住了[rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.neutral: "你没网住[rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('GetAnimalType')]弄伤了你"
 gdp_merchant_luxury_contract.0052.b: "快躲起来！我们完蛋了！"
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('GetAnimalType')]逃走了"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "我们回到村子里，村长冲了出来，大叫着说[rich_local.GetTitledFirstNamePossessive]的人在这里，正在搜捕偷猎者！\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName]看着那只被拴住的[rich_local.Custom('GetAnimalType')]，一脸心虚，但还没心虚到藏住[hunter.GetHerHis]的得意。"
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName]沮丧地看着地面，村里其他人也都皱着眉头。\n\n当[hunter.GetSheHe]往自己住处走时，一只拴着的[hunter.Custom('GetAnimalType')]出现了，在[local_province.Custom('GetProvinceGroundDesc')]上[hunter.Custom('GetAnimalWalkParticiple')]着。"
 gdp_merchant_luxury_contract.0053.a: "“多奇妙的生物……”"
 gdp_merchant_luxury_contract.0053.b: "“……我会告诉[rich_local.GetTitleAsNameNoTooltip]是谁拿走了它！”"
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip]对你的勇气印象深刻"
 gdp_merchant_luxury_contract.0053.c: "“这真是个糟糕的主意……”"
 gdp_merchant_luxury_contract.0053.d: "“……不过，我确实需要你这样一个[hunter.GetWomanMan]，[hunter.GetFirstNameNoTooltip]。”"
 gdp_merchant_luxury_contract.0053.e: "“你从来没说过你有一只[hunter.Custom('GetAnimalType')]！”"
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]：[local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "今天上午，[local_province.GetBaronyNameExplicitlyNoTooltip]的[local_barony.Custom('BaronyTownType')]从[local_province.Custom('GetTerrainLandPlural')]中浮现，我们终于到达了目的地。"
 gdp_merchant_luxury_contract.1001.desc.locals: "在门口，路过的村民听到我们用磕磕绊绊的[local_county.GetCountyData.GetCulture.GetLanguage.GetName]询问，虽然听得很费劲，但还是给我们指了路，"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "在门口，一群路过的村民听到我们用[local_county.GetCountyData.GetCulture.GetLanguage.GetName]询问，给我们指了路，"
 gdp_merchant_luxury_contract.1001.desc.religious: "说在[religious_building_province.GetBaronyNameExplicitlyNoTooltip]有一座宏伟庄严的陵墓。"
 gdp_merchant_luxury_contract.1001.desc.scholarly: "说在[scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]有一座智者的学术中心。"
 gdp_merchant_luxury_contract.1001.desc.fallback: "说在附近有一座本地市场。"
 gdp_merchant_luxury_contract.1001.a: "当地的[local_province.Custom('GetRegionalMarketTerm')]应该有些东西。"
 gdp_merchant_luxury_contract.1001.a.flavor: "倾向于展示[stewardship_i|E][stewardship|E]和[gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1001.a.tt: "尝试在市场上采购一件#V 奇珍#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.1001.d: "宏伟的[local_province.Custom('GetRegionalMarketTerm')]在召唤我们！"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "我们去寻找这个圣地。"
 gdp_merchant_luxury_contract.1001.e.flavor: "倾向于展示[piety_i|E][piety|E]和[learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "尝试在宗教场所获取一件#V 奇珍#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.1001.f: "我们在这里一定能学到很多东西。"
 gdp_merchant_luxury_contract.1001.f.flavor: "倾向于展示[learning_i|E][learning|E]和[diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "尝试在学术中心获取一件#V 奇珍#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.1001.return.religious: "我们回去圣地吧……"
 gdp_merchant_luxury_contract.1001.return.scholarly: "我们去找找学术中心……"
 gdp_merchant_luxury_contract.1001.return.urban: "我就去趟市场……"
 gdp_merchant_luxury_contract.1001.give_up: "哦，算了吧！"
 gdp_merchant_luxury_contract.1001.fallback: "我不会空手离开[local_province.GetBaronyNameExplicitlyNoTooltip]。"
 gdp_merchant_luxury_contract.1001.fallback.flavor: "你在[local_province.Custom('GetRegionalMarketTermGloss')]里发现了一些小玩意儿"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]：商业中心"
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip]的[local_province.GetTitle.Custom('BaronyTownType')]里一片繁忙，当地人和旅客在[local_province.Custom('GetProvinceAdjective')]的[local_province.Custom('GetRegionalMarketTermGloss')]的景象、声音和气味中搜寻着各色商品。\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "在昏暗的角落里，一个满脸戾气的街头流浪儿引起了我的注意，[urchin.GetHerHis]那双小眼睛正静静地打量着来来往往的行人。"
 gdp_merchant_luxury_contract.1101.antiques: "一个摆满古董的旧摊位引起了我的好奇，上面散落着[local_province.Custom('GetRandomRegionalWood')]做的小玩意儿和发黑的金属制品，看到有客人，那个[dealer.Custom('GetYoungMiddleAgedOld')]摊主很是高兴。"
 gdp_merchant_luxury_contract.1101.bookseller: "一家昏暗的小店，挂着破旧的[ROOT.Char.Custom('RegionalFabric')]遮阳篷，墙边堆满了破旧的卷轴和书籍，一名[dealer.Custom('GetYoungMiddleAgedOld')][dealer.GetWomanMan]在一旁看管着。"
 gdp_merchant_luxury_contract.1101.travelers: "一群面色灰败的[traveler.GetCulture.GetCollectiveNoun]人在附近的广场上安顿了下来，他们的衣着和口音跟本地[local_province.GetCulture.GetName]人截然不同。"
 gdp_merchant_luxury_contract.1101.tavern: "街对面，酒馆里嘈杂的喧闹声引起了我的注意，一个看上去很粗鲁的赌徒正转着手里的钱袋，那是[gambler.GetSheHe]刚从一个一脸沮丧的对手手里赢来的。"
 gdp_merchant_luxury_contract.1101.merchant: "我注意到一个衣着讲究的[other_merchant.GetWomanMan]正对着一支缓慢穿过城镇的商队大声催促。[other_merchant.GetSheHe|U]显然是个跟我志同道合的本地商人。"
 gdp_merchant_luxury_contract.1101.a: "那个孩子看起来……#EMP 很狡猾#!。"
 gdp_merchant_luxury_contract.1101.a.flavor: "倾向于展示[intrigue_i|E][intrigue|E]和[diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "你瞧瞧那流浪儿会说什么"
 gdp_merchant_luxury_contract.1101.b: "这个商人或许有些有趣的东西……"
 gdp_merchant_luxury_contract.1101.b.flavor: "倾向于展示[learning_i|E][learning|E]和[gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1101.b.tt: "你尝试购买一件有趣的古董"
 gdp_merchant_luxury_contract.1101.c: "这里应该有一两本有趣的书吧。"
 gdp_merchant_luxury_contract.1101.c.flavor: "倾向于展示[learning_i|E][learning|E]和[gold_i|E][gold|E]"
 gdp_merchant_luxury_contract.1101.c.tt: "你尝试购买一本有趣的书"
 gdp_merchant_luxury_contract.1101.d: "那些[traveler.GetCulture.GetCollectiveNounNoTooltip]人肯定见识过不少。"
 gdp_merchant_luxury_contract.1101.d.lingua: "一个考验我的[traveler.GetCulture.GetLanguage.GetNameNoTooltip]的机会。"
 gdp_merchant_luxury_contract.1101.d.flavor: "倾向于展示[diplomacy_i|E][diplomacy|E]和[learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "你与旅行者们交谈"
 gdp_merchant_luxury_contract.1101.e: "我忍不住想搏一搏手气……"
 gdp_merchant_luxury_contract.1101.e.flavor: "倾向于展示[intrigue_i|E][intrigue|E]和运气"
 gdp_merchant_luxury_contract.1101.e.tt: "你看看能从赌徒那里赢得什么"
 gdp_merchant_luxury_contract.1101.f: "啊，也许同行能懂我。"
 gdp_merchant_luxury_contract.1101.f.flavor: "倾向于展示[stewardship_i|E][stewardship|E]和[prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1101.f.tt: "你听听这个商人会说什么"
 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstNamePossessive|U]的戒备心确实很难放下。我试着用对路人的轻蔑态度，还有[merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]那些破烂街道上的故事来赢得[urchin.GetHerHim]的信任。\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "我讲的那些远方的故事和行商的利润让[urchin.GetHerHis]来了兴致。我正要开价，[urchin.GetSheHe]主动提出把饰品直接给我，条件是让我带[urchin.GetHerHim]一起回去！"
 gdp_merchant_luxury_contract.1102.urchin.success: "最后，我觉得铺垫足够了，就直截了当地询问[urchin.GetSheHe]要多少钱才肯卖那件饰品。[urchin.GetSheHe]狡黠一笑，报了个价。"
 gdp_merchant_luxury_contract.1102.urchin.failure: "最后，我觉得铺垫足够了，就直截了当地询问[urchin.GetSheHe]要多少钱才肯卖那件饰品。[urchin.GetSheHe|U]只是轻蔑地撇了撇嘴，让我滚开。"
 gdp_merchant_luxury_contract.1102.antiques: "我和那个精明的摊主拉锯了一阵子，争论这东西做工怎么样，有多少年头，品相又如何。\n\n最终，我和那个[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )]混蛋谈出一个谁也不肯让步的价钱。"
 gdp_merchant_luxury_contract.1102.antiques.success: "我得说，这个价格不错，比我预期的要好得多。"
 gdp_merchant_luxury_contract.1102.antiques.failure: "这个结果我并不满意，只觉得被占了便宜。"
 gdp_merchant_luxury_contract.1102.bookseller: "我和那个精明的摊主拉锯了一阵子，争论这书的来历、年头和品相。\n\n最终，我和那个[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )]混蛋谈出一个谁也不肯让步的价钱。"
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "这群人对我稍微热乎了点，显然我是他们今天见到的最有趣的人，很快我们便开始分享旅途中的见闻。"
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\n没过多久，我们就围坐在一起吃着面包，一边笑着拿[local_province.GetBaronyNameExplicitly]的那些共同的倒霉事和经历打趣。告别时，[traveler.GetFirstName]把一个包裹塞进我手里，热情地拥抱了我。"
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\n聊了几句之后，我很快就没什么可说的了，而那些[traveler.GetCulture.GetCollectiveNoun]人也难掩希望我离开的意愿。"
 gdp_merchant_luxury_contract.1102.tavern: "我们热了热骰子，局面看起来势均力敌，你赢一轮我赢一轮，交换着钱币也互相打趣，但[gambler.GetFirstName]无疑是个难缠的家伙。\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "[merchant.GetFaith.WealthGodName]对我微笑！这轮一开局我就占了上风，[gambler.GetFirstNamePossessiveNoTooltip]目瞪口呆地骂着，越输越多，直到[gambler.GetSheHe]一拍桌子走了，把骰子甩到了街上！"
 gdp_merchant_luxury_contract.1102.tavern.failure: "虽然花了些时间，但最终我总算占了点上风，[gambler.GetFirstNamePossessiveNoTooltip]的耐心磨得差不多了，[gambler.GetHerHim]干脆收了手，而我在一旁数着钱得意。"
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "没过多久，[gambler.GetSheHe]就使出了全力，我很快连输好几轮，钱包也伤得不轻，耐心全没了。我闷闷不乐地离开了，身后是[gambler.GetFirstNamePossessiveNoTooltip]得意的嘲笑。"
 gdp_merchant_luxury_contract.1102.merchant: "在[local_province.Custom('GetRegionalMarketTermGloss')]附近几间安静的办公室里，[other_merchant.GetTitledFirstName]和我详细讨论了各自的生意，盘算着在遥远地方的共同人脉，各自都不忘夸耀自己的成功。\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "我们很是投缘，一边吃着面包喝着[other_merchant.Custom('RegionalDrink')]，一边交流心得，商量着将来怎么一起赚钱。分别时很是不舍，[other_merchant.GetFirstNameNoTooltip]送了我几样好东西当告别礼物。"
 gdp_merchant_luxury_contract.1102.merchant.failure: "我们似乎没找到多少共同点，彼此都反感对方的自夸，也不愿分享任何有用的信息。没过多久我就向那个乏味的[other_merchant.GetWomanMan]告辞离去。"
 gdp_merchant_luxury_contract.1102.a: "这样正好。"
 gdp_merchant_luxury_contract.1102.b: "只能先这样了……"
 gdp_merchant_luxury_contract.1111.desc: "我穿过[local_province.Custom('GetProvinceAdjective')]的街道，朝那个[urchin.Custom('GirlBoy')]走去。[urchin.GetHerHis]一看见我，敏锐的眼神就透着询问，但我摆明了没恶意，侧身靠在[urchin.GetSheHe]倚着的墙边。\n\n[urchin.GetHerHis]手里一个亮闪闪的小饰品若隐若现，诱人地发着光，但[urchin.GetSheHe]顺着我的目光看过来，很快就把它收起来了。“你想干嘛？”[urchin.GetSheHe]啐了一口，“我叫[urchin.GetFirstName]，这里是#EMP 老子的#!地盘。”"
 gdp_merchant_luxury_contract.1111.a: "你看起来懂不少。"
 gdp_merchant_luxury_contract.1111.a.success_critical: "你赢得了[urchin.GetHerHis]的信任"
 gdp_merchant_luxury_contract.1111.a.success: "你买下了[urchin.GetHerHis]的赃物"
 gdp_merchant_luxury_contract.1111.a.failure: "你只获得[urchin.GetHerHis]的蔑视"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "[urchin.GetFirstName]在[local_province.GetBaronyNameExplicitly]的街道上偷走了它。"
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip]戒指"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$$gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "[local_county.GetAdjectiveNoTooltip]胸针"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$$gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip]项链"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$$gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "我装出一副漠不关心的样子，随意翻看着摊上的货品，掩藏起自己真正的兴趣程度，不过很难说店主到底信了几分。\n\n我很快看中了一样特别的东西，在那堆货里显得很突出，时间让它的款式变得很独特，哪怕是在它原产地看也是如此。"
 gdp_merchant_luxury_contract.1121.a: "我们来谈谈价格……"
 gdp_merchant_luxury_contract.1121.a.success_critical: "你谈了个非常好的价钱"
 gdp_merchant_luxury_contract.1121.a.success: "你谈了个好价钱"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetSheHe|U]不肯讨价还价"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "古董[artifact.GetName]"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc]经历时间的侵蚀后，它早已不堪用于战斗。"
 gdp_merchant_luxury_contract.1121.artifact.bowl: "古董[local_province.GetCounty.GetCulture.GetNameNoTooltip]碗"
 gdp_merchant_luxury_contract.1121.artifact.plate: "古董[local_province.GetCounty.GetCulture.GetNameNoTooltip]盘"
 gdp_merchant_luxury_contract.1121.artifact.urn: "古董[local_province.GetCounty.GetCulture.GetNameNoTooltip]瓮"
 gdp_merchant_luxury_contract.1131.desc: "我装出一副漠不关心的样子，随意翻看着摊上的书，掩藏起自己真正的兴趣程度，不过很难说店主到底信了几分。\n\n我很快看中了一本装帧特别的，据我判断是一部罕见且被忽视的作品。"
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc]购得自[local_province.GetBaronyNameExplicitly]的一位商人。"
 gdp_merchant_luxury_contract.1141.desc: "我带着热情的微笑走向那个[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )]领头的，指望我们都是外乡人，在这个陌生地方能拉近点距离。\n\n那个[traveler.GetWomanMan]自称叫[traveler.GetFirstName]。我也跟着自我介绍：“[merchant.GetNameNoTooltip]。你肯定听说过我吧？”半是吹嘘，半是开玩笑。"
 gdp_merchant_luxury_contract.1141.a: "你一定有不少有趣的故事！"
 gdp_merchant_luxury_contract.1141.a.flavor: "考验你的[diplomacy_i|E][diplomacy|E]和[prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1141.a.success: "你与[traveler.GetFirstNameNoTooltip]相处融洽"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip]对你感到厌倦"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc]购得自[local_province.GetBaronyNameExplicitly]的一位商人。经历时间的侵蚀后，它早已不堪用于战斗。"
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip]胸针"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$获得自[local_province.GetBaronyNameExplicitly]的旅行者。"
 gdp_merchant_luxury_contract.1151.desc: "掀开帘子挤进那间昏暗的窝点，我扫了一眼里面那些酒鬼和流浪汉。屋子中间，那个赌徒正开心地数着硬币。\n\n我在对面坐下，这[gambler.GetWomanMan]打量着我，眉毛一挑。“想玩两把？”[gambler.GetSheHe]笑着说。“我是[gambler.GetFirstName]，输了钱可别哭鼻子。”"
 gdp_merchant_luxury_contract.1151.a: "来玩吧。"
 gdp_merchant_luxury_contract.1151.a.flavor: "考验你的[intrigue_i|E][intrigue|E]"
 gdp_merchant_luxury_contract.1151.a.success: "你赢光了[gambler.GetHerHim]的钱"
 gdp_merchant_luxury_contract.1151.a.failure: "你赢了些钱"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "你输了些钱"
 gdp_merchant_luxury_contract.1151.artifact.dice: "赌徒的幸运骰子"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "从[local_province.GetBaronyNameExplicitly]的一名无赖赌徒[gambler.GetFirstName]那辛苦赢来的骰子。"
 gdp_merchant_luxury_contract.1161.desc: "我打断了商人的牢骚，介绍自己是[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]的领头，来自[merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]，并说明自己不是来谈生意的。\n\n而我也得知了[other_merchant.GetSheHe]名叫[other_merchant.GetName]，来自[other_merchant.GetCapitalLocation.GetBaronyNameExplicitly]，在此地做[merchant_good.GetName]的买卖。互相试探过后，[other_merchant.GetSheHe]提出要在附近招待我。"
 gdp_merchant_luxury_contract.1161.a: "我们有很多可以讨论的。"
 gdp_merchant_luxury_contract.1161.a.flavor: "考验你的[stewardship_i|E][stewardship|E]和[prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip]对你热情起来"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip]不为所动"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "布料样品"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "来自[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]的[other_merchant.Custom('RegionalFabric')]样品，商人们做生意时用的。"
 gdp_merchant_luxury_contract.1161.artifact.gem: "宝石样品"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "来自[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]的宝石样品，商人们做生意时用的。"
 gdp_merchant_luxury_contract.1161.artifact.gold: "金属样品"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "来自[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]的贵金属样品，商人们做生意时用的。"
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]：宗教中心"
 gdp_merchant_luxury_contract.1501.desc: "我们沿着无数朝圣者与信徒的足迹前行，不久便来到[religious_building_province.GetName]宏伟的[religious_building_district.GetType.GetPrimaryBuildingType.GetName]。\n\n"
 gdp_merchant_luxury_contract.1501.site: "这座陵墓是一座宏伟的纪念碑，纪念着过去[religious_building_faith.GetReligion.GetAdjective]统治者对[religious_building_faith.HighGodName]的虔诚热忱。从里面可以听到正在进行的礼拜仪式传来的悠扬低语。"
 gdp_merchant_luxury_contract.1501.tombs: "不远处是一片风化的石墓群，上面刻着[religious_building_faith.ReligiousSymbol]，经过许多季节的侵蚀，长满了杂草。"
 gdp_merchant_luxury_contract.1501.pilgrim: "一队队信徒整齐地等着进入，他们的衣着表明他们是朝圣者。其中一群人尤其显眼，他们一起抬着某种圣物盒。"
 gdp_merchant_luxury_contract.1501.monks: "附近，一群修士安静地聚在阴凉处，沉思着，低声交谈，周围的世界慵懒地流动着。"
 gdp_merchant_luxury_contract.1501.keepsake: "走近这座建筑，我注意到一处磨损的墙面，有几块石头因为年深日久已经松动开裂了。"
 gdp_merchant_luxury_contract.1501.apostate: "在一旁，一个看起来心事重重的[pilgrim.GetWomanMan]独自坐在建筑物的阴影里，手肘支在[pilgrim.GetHerHis]的膝盖上，一只手捂着脸，另一只手拿着本小书。"
 gdp_merchant_luxury_contract.1501.a: "我想看看里面。"
 gdp_merchant_luxury_contract.1501.a.flavor: "倾向于展示[learning_i|E][learning|E]和[piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.a.tt: "你看看[religious_building_faith.HouseOfWorship]里什么等着你"
 gdp_merchant_luxury_contract.1501.b: "那些陵墓里一定有什么东西……"
 gdp_merchant_luxury_contract.1501.b.flavor: "倾向于展示[intrigue_i|E][intrigue|E]和[prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "你夜里回来盗墓"
 gdp_merchant_luxury_contract.1501.c: "那些朝圣者看起来很好骗……"
 gdp_merchant_luxury_contract.1501.c.flavor: "倾向于展示[intrigue_i|E][intrigue|E]和[diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "你试图欺骗一名朝圣者"
 gdp_merchant_luxury_contract.1501.d: "我想和这些僧侣谈谈。"
 gdp_merchant_luxury_contract.1501.d.flavor: "倾向于展示[learning_i|E][learning|E]和[piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.d.tt: "你开始与僧侣们对话"
 gdp_merchant_luxury_contract.1501.e: "没人会注意到少了一块石头……"
 gdp_merchant_luxury_contract.1501.e.flavor: "倾向于展示[intrigue_i|E][intrigue|E]和[prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "你试图偷走建筑的一部分"
 gdp_merchant_luxury_contract.1501.f: "那个[pilgrim.GetWomanMan]看起来好像需要帮助。"
 gdp_merchant_luxury_contract.1501.f.flavor: "倾向于展示[diplomacy_i|E][diplomacy|E]和[piety_i|E][piety|E]"
 gdp_merchant_luxury_contract.1501.f.tt: "你开始和朝圣者搭话"
 gdp_merchant_luxury_contract.1502.site: "[priest.Custom('PriestTitle')]仔细打量了我一番，一边琢磨我的话和神色，一边看着信徒们从我们身边走过，嘴里默念着祈祷和心愿。\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "最后[priest.GetSheHe]叹了口气：“我没法拒绝你这诚恳的请求。” [priest.GetSheHe|U]伸手拿过旁边的一本书，手指在封面上停留了片刻，然后递给了我。\n\n“拿去吧，我的朋友。愿你能在其中找到[religious_building_faith.HighGodNameAlternate]的话语。”"
 gdp_merchant_luxury_contract.1502.site.failure: "最后[priest.GetSheHe]皱起了眉。“出去，你走错地方了。这是[religious_building_faith.HouseOfWorship]，是做礼拜的地方。我今天没空听你胡说。”\n\n几个信徒转过头，看着我等我离开。"
 gdp_merchant_luxury_contract.1502.pilgrim: "通过友好的询问，我最终得知他们把圣物带到这里是为了捐给[pilgrim.GetFaith.HouseOfWorship]，东西是在他们家乡附近弄到的。\n\n我装出一副大吃一惊的样子，假意关心他们，说他们竟然被人这么无耻地骗了！\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "他们有些沮丧，但并未恼怒，我看着他们走开，把那个小盒子扔到了场地外面的荒地上。"
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "然而，他们的反应让我有点措手不及——他们将圣物扔到地上，又踢又踩，把它摔了个粉碎，围观的人群都惊愕不已。\n\n我还是赶紧离开为妙……"
 gdp_merchant_luxury_contract.1502.tomb: "这些墓穴比看上去难撬多了！我们费了好大劲，才把其中一座更气派的墓碑撬开。\n\n我擦了擦汗，往那幽暗的深处望去，看到了什么东西，便小心地把手伸进去，把它取了出来。\n\n“拿灯来！”我不耐烦地低声说。\n\n我手里拿着……"
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "一个制作精良且装饰华丽的骨灰瓮！"
 gdp_merchant_luxury_contract.1502.tomb.success: "一个破破烂烂的瓮？"
 gdp_merchant_luxury_contract.1502.tomb.failure: "一根#EMP 骨头#!？"
 gdp_merchant_luxury_contract.1502.monks: "这些僧侣比我想的还要有意思！在这身长袍下生活，衍生出了许多稀奇的解读和见解，从[monk.GetFaith.ReligiousText]到[monk.GetFaith.TricksterGodName]的种种谜团。\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "我们聊得很投机，僧侣们似乎很不舍得跟我告别。分别时，[monk.GetFirstName]把什么东西塞进了我手里，然后带着温暖的微笑离开了。"
 gdp_merchant_luxury_contract.1502.monks.failure: "然而，每次轮到我说话时，[monk.GetFirstName]都会显得兴味索然，不是不高兴就是没兴趣，很快就让我明白，我待得太久了。"
 gdp_merchant_luxury_contract.1502.keepsake: "我最后回头看了一眼，然后尽力尝试以一气呵成的动作完成敲击、接住和抓住的动作。\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "我优雅而灵巧地取下墙上的一小块，藏在斗篷下面，若无其事地继续走着。似乎没有人注意到！"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "我那无力的动作只是让我扑通一声摔在地上，疼得直抽气，几个好奇的朝圣者难以置信地看看我，又看看墙。"
 gdp_merchant_luxury_contract.1502.apostate: "当我坐到[pilgrim.GetHerHim]身旁，轻声念着我最喜欢的[merchant.GetFaith.ReligiousText]经文时，[pilgrim.GetWomanMan]没有表示反对，而[pilgrim.GetSheHe]也很快停止哭泣，被我的话吸引了注意力。\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "我感觉到[pilgrim.GetSheHe]被我的话打动了，果然没过多久，[pilgrim.GetFirstName]就明确表示[pilgrim.GetSheHe]想离开这个地方，跟我走上追随[merchant.GetFaith.HighGodNameAlternate]的道路！"
 gdp_merchant_luxury_contract.1502.apostate.success: "我读着的时候，能感觉到[pilgrim.GetHerHim]的情绪变了，好像有什么沉重的东西从[pilgrim.GetHerHis]肩上卸了下来。\n\n[pilgrim.GetSheHe]一言不发地站起来，走出了那片区域，[pilgrim.GetHerHis]那本破旧的书被丢在了我身边。"
 gdp_merchant_luxury_contract.1502.apostate.failure: "然而没过多久，[pilgrim.GetHerHis]的脸色就沉了下来，一种新的情绪将[pilgrim.GetSheHe]点燃：愤怒。\n\n[pilgrim.GetHerHis|U]大喊我在把[pilgrim.GetHerHim]往叛教的路上逼——而且还是在[pilgrim.GetFaith.HouseOfWorship]里面！——很快就招来了一群愤怒的围观者……"
 gdp_merchant_luxury_contract.1502.a.critical: "这再好不过了！"
 gdp_merchant_luxury_contract.1502.a: "这样正好。"
 gdp_merchant_luxury_contract.1502.b: "只能先这样了……"
 gdp_merchant_luxury_contract.1511.desc: "当太阳落山后，我们悄悄溜回[religious_building_district.GetType.GetPrimaryBuildingType.GetName]附近，在早已死去的当地人那些被遗忘的坟墓中寻找财宝。\n\n由于害怕被人看见，我们小心翼翼地避开寻常路线，最终进入这片寒冷而寂静的墓地之中。"
 gdp_merchant_luxury_contract.1511.a: "快些打开这座坟墓！"
 gdp_merchant_luxury_contract.1511.a.flavor: "对你[intrigue_i|E][intrigue|E]和[prowess_i|E][prowess|E]的考验"
 gdp_merchant_luxury_contract.1511.a.success_critical: "你发现了一件珍贵的宝物"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "你发现了一件高品质的#V 奇珍#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.a.success: "你发现了一件普通宝物"
 gdp_merchant_luxury_contract.1511.a.success.tt: "你发现了一件低品质的#V 奇珍#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.a.failure: "你没发现任何值得注意的东西"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "你发现了一件#V 奇珍#![domicile_artifact|E]"
 gdp_merchant_luxury_contract.1511.artifact.urn: "[religious_building_faith.GetAdjectiveNoTooltip]陪葬品"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "一个从早已逝去的[religious_building_faith.GetAdherentName]墓中的骨灰瓮，掠夺自[religious_building_district.GetType.GetPrimaryBuildingType.GetName]。"
 gdp_merchant_luxury_contract.1511.artifact.skull: "盗来的头骨"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "一个早已逝去的[religious_building_faith.GetAdherentName]的头骨，掠夺自[religious_building_district.GetType.GetPrimaryBuildingType.GetName]的一座墓穴。"
 gdp_merchant_luxury_contract.1511.artifact.bone: "盗来的[priest.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "一个早已逝去的[religious_building_faith.GetAdherentName]的骨头，掠夺自[religious_building_district.GetType.GetPrimaryBuildingType.GetName]的一座墓穴。"
 gdp_merchant_luxury_contract.1521.desc: "我穿过巨大的门扇，步入相对幽暗之处，发现自己置身于一间装饰华丽的门厅，空气中弥漫着仪式与祭品浓重的异域气息。\n\n信众们围拢在一位[priest.GetWomanMan]——[priest.Custom('PriestTitle')]——周围，[priest.GetSheHe]正与会众交谈，却立刻注意到了我——显然我在这里格格不入。\n\n[priest.GetSheHe|U][merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )]朝我走来，“幸会，你来到了[religious_building_district.GetType.GetPrimaryBuildingType.GetName]。”\n\n“你在此寻求什么？”[priest.GetSheHe]好奇地打量着我，问道。“你遵循[religious_building_faith.GetNameNoTooltip]的戒律吗？”"
 gdp_merchant_luxury_contract.1521.a: "我想尽可能多地了解[religious_building_faith.GetNameNoTooltip]。"
 gdp_merchant_luxury_contract.1521.a.flavor: "考验你的[learning_i|E][learning|E]和[piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')]给了我一份文本"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')]感觉你很可疑"
 gdp_merchant_luxury_contract.1531.desc: "我走近时，那些[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )]朝圣者用怀疑的眼光看着我，紧紧攥着他们那件简陋的圣物，而我则想凑近看得更清楚些。\n\n这对[pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip]来说肯定是件很有意义的东西，回到[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]之后也会是个不错的谈资。\n\n我肯定能让这些乡巴佬相信，他们是被哪个小贩或者不怀好意的[pilgrim.GetFaith.PriestNeuter]给骗了……"
 gdp_merchant_luxury_contract.1531.a: "这显然是赝品，[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]有好几百个……"
 gdp_merchant_luxury_contract.1531.a.success: "朝圣者扔掉了圣物"
 gdp_merchant_luxury_contract.1531.a.failure: "朝圣者们很愤怒"
 gdp_merchant_luxury_contract.1541.desc: "那些僧侣起初斜眼看我，被我的异国做派弄得有些不知所措，但藏不住好奇心，尤其是当我明确表示想讨论神学的时候。\n\n年轻的那些还拿不准，但他们的领头人，那位[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )] [monk.GetFirstName]，把我迎进了他们的圈子，不停地向我问起旅途的事。"
 gdp_merchant_luxury_contract.1541.a: "是的，是的，但你对[monk.GetFaith.WealthGodName]有什么看法？"
 gdp_merchant_luxury_contract.1541.a.flavor: "考验你的[learning_i|E][learning|E]和[piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1541.a.success: "僧侣们乐于进行讨论"
 gdp_merchant_luxury_contract.1541.a.failure: "僧侣们感到失望"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "[religious_building_faith.GetAdjectiveNoTooltip]念珠"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "一串[religious_building_faith.GetAdjective]念珠，是[religious_building_district.GetType.GetPrimaryBuildingType.GetName]一位僧侣的赠礼。"
 gdp_merchant_luxury_contract.1541.artifact.icon: "[religious_building_faith.GetAdjectiveNoTooltip]圣像"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "一幅[SCOPE.Custom('ArtifactArticleWealth')]的圣像，做工[SCOPE.Custom('ArtifactQuality')]，描绘了[newly_created_artifact.GetFeatureText('icon_decoration')]，这是[religious_building_district.GetType.GetPrimaryBuildingType.GetName]的[monk.GetFirstName]修士赠送的礼物。"
 gdp_merchant_luxury_contract.1551.desc: "我偷偷环顾四周，悠闲地踱步在[religious_building_district.GetType.GetPrimaryBuildingType.GetName]周围，礼貌地对路人微笑，并装出欣赏建筑的样子。\n\n渐渐地，我锁定了一片上等石砌区域，那石砌似乎已经松动，位于建筑群外围最安静的一角。"
 gdp_merchant_luxury_contract.1551.a: "我只需要找到合适的时机……"
 gdp_merchant_luxury_contract.1551.a.success: "你拿走一块石制品"
 gdp_merchant_luxury_contract.1551.a.failure: "你被当场抓获"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "圣石"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "偷自[religious_building_district.GetType.GetPrimaryBuildingType.GetName]宗教中心的一小块石雕，当作纪念品私藏起来。"
 gdp_merchant_luxury_contract.1561.desc: "当我走近那个[pilgrim.GetWomanMan]时，很明显[pilgrim.GetSheHe]是个朝圣者，跟这里的许多人一样，背着一身行装，被太阳晒得黝黑。\n\n我打听到[pilgrim.GetHerHis]的名字叫[pilgrim.GetFirstName]，在经历了许多不幸之后，[pilgrim.GetSheHe]已经对[pilgrim.GetFaith.GetAdjectiveNoTooltip] [pilgrim.GetFaith.HighGodName]失去了信仰。就连这次朝圣也没能让[pilgrim.GetHerHis]重新找回它。\n\n我注意到[pilgrim.GetHerHis]那本沾满泪痕、磨得很旧的[pilgrim.GetFaith.ReligiousText]。那是[pilgrim.GetHerHis]一路挣扎的证明。"
 gdp_merchant_luxury_contract.1561.a: "[merchant.GetFaith.ReligiousText]中自有答案……"
 gdp_merchant_luxury_contract.1561.a.flavor: "对你[diplomacy_i|E][diplomacy|E]和[piety_i|E][piety_level|E]的考验"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip]选择改信"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip]备受鼓舞"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip]被激怒了"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "泪水渍染的[religious_building_faith.ReligiousText|U]"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "一个失去了信仰的[pilgrim.GetFaith.GetAdherentNameNoTooltip]——[pilgrim.GetFirstName]——的私人经文。"
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]：知识之网"
 gdp_merchant_luxury_contract.1601.desc: "我被[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]的规模震撼到了，它的庭院和大厅里挤满了那么多好学的人，他们在争论，在思索。\n\n"
 gdp_merchant_luxury_contract.1601.dean: "一个[scholar.GetWomanMan]，时常[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )]，在随从的簇拥下匆忙走动，傲慢地打发着[scholar.GetHerHis]的同事们。显然[scholar.GetSheHe]是这里的主事人。"
 gdp_merchant_luxury_contract.1601.sages: "在庭院里的一棵树下，一位枯瘦年迈的[sage.GetWomanMan]安静地坐着，也许在沉思某个宇宙深处的难题，也许只是在打盹。"
 gdp_merchant_luxury_contract.1601.library: "经过一扇门，我看到一个[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )]的[scholar.GetWomanMan]独自待在一间气派的图书馆里，周围堆满了成卷的文本。[scholar.GetSheHe|U]看上去一脸陶醉，正安安静静地读着书。"
 gdp_merchant_luxury_contract.1601.physician: "在另一间房里，一个[physician.GetWomanMan]操弄着一堆古怪的标本，动物的和人的都有，还有各种各样的器械。只能希望[physician.GetSheHe]是个真正的医生……"
 gdp_merchant_luxury_contract.1601.student: "有一群特别吵闹的学生很难忽略，他们在中央广场的阴凉处大声互相开着玩笑，好脾气地争论着，笑得声嘶力竭。"
 gdp_merchant_luxury_contract.1601.botanist: "在建筑群的一个安静角落，我撞见一间房，里面摆着一堆奇特的植物和动物标本，都被一个[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )]的[botanist.GetWomanMan]保存并分类好了。"
 gdp_merchant_luxury_contract.1601.a: "那一定是院长了。"
 gdp_merchant_luxury_contract.1601.a.flavor: "倾向于展示[diplomacy_i|E][diplomacy|E]和[prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1601.a.tt: "你走近院长"
 gdp_merchant_luxury_contract.1601.b: "我被那个老智者吸引了……"
 gdp_merchant_luxury_contract.1601.b.flavor: "倾向于展示[learning_i|E][learning|E]和[piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1601.b.tt: "你走近智者"
 gdp_merchant_luxury_contract.1601.c: "知识总能在图书馆中找到。"
 gdp_merchant_luxury_contract.1601.c.flavor: "倾向于展示[learning_i|E][learning|E]和[diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "你进入了图书馆"
 gdp_merchant_luxury_contract.1601.d: "医者的技艺令人着迷。"
 gdp_merchant_luxury_contract.1601.d.flavor: "倾向于展示[learning_i|E][learning|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "你走近医师"
 gdp_merchant_luxury_contract.1601.e: "那些学生看起来很有趣。"
 gdp_merchant_luxury_contract.1601.e.flavor: "倾向于展示[diplomacy_i|E][diplomacy|E]和[prowess_i|E][prowess|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "你走近学生们"
 gdp_merchant_luxury_contract.1601.f: "标本的收集令人叹为观止。"
 gdp_merchant_luxury_contract.1601.f.flavor: "倾向于展示[learning_i|E][learning|E]和[diplomacy_i|E][diplomacy|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "你浏览了收藏"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "最初是[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]收藏的一部分。"
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName]顺着我的思路想了想，直到我把话说得非常清楚。我毕竟来自一个遥远的地方，这张纸在那里根本没有任何分量。\n\n说完了该说的，我满怀期待地给[scholar.GetHerHim]留出说话的空间。"
 gdp_merchant_luxury_contract.1602.dean.success: "学者脸上露出一个大大的笑容，去拿来了那些官方文件，证明了我的……资质。"
 gdp_merchant_luxury_contract.1602.dean.failure: "[scholar.GetHerHis|U]毫无表情的脸庞变得冷峻，[scholar.GetSheHe]尴尬地要求我离开。"
 gdp_merchant_luxury_contract.1602.sages: "我们聊起了哲学，像是聊了很久，那些问题我很少跟人提过，不知不觉天色慢慢暗下来，一天的忙碌声也渐渐消了。\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "最后那位[sage.Custom('GetYoungMiddleAgedOld')]智者站了起来，从袍子里掏出什么东西，会意地点头递给我，随后不告而别地消失了。"
 gdp_merchant_luxury_contract.1602.sages.failure: "最后那位[sage.Custom('GetYoungMiddleAgedOld')]智者站了起来，拢了拢袍子，不告而别地消失了。至少，我很享受我们的谈话……"
 gdp_merchant_luxury_contract.1602.library: "我表示对[scholar.GetHerHis]的阅读材料感兴趣，[scholar.GetSheHe]便自我介绍为[scholar.GetFirstName]。随后一段时间里，[scholar.GetSheHe]列举了作为其学业一部分已读和待读的诸多著作，并逐一询问我的看法。\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip]很快就笑得像个孩子，等到该走的时候，[scholar.GetSheHe]狡黠地朝我眨眨眼，递给我一本小书。"
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip]很快对我和我的回答失去了所有兴趣，粗鲁地转回去继续写写画画，我也只好告辞。"
 gdp_merchant_luxury_contract.1602.physician: "我表示对解剖学感兴趣，并尽己所能参与其中。[physician.GetSheHe|U]大谈身体的运作，抓着骨头模型来演示[physician.GetHerHis]的观点。\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.GetSheHe|U]似乎对我的知识印象深刻，感叹[scholar.GetHerHis]的学生和同事们的无知，然后递给我一篇文章。"
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetSheHe|U]对我的问题和犹豫的解释不耐烦地翻了个白眼，很快就找了个过时的借口把我赶出了房间。"
 gdp_merchant_luxury_contract.1602.student: "我们在[student.Custom('GetPubName')]度过了一段喧闹的时光，我在那群面孔稚嫩的浪子中间高谈阔论，交换着我旅行中的故事，回答他们许多问题。\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "我们从一个酒馆转到另一个酒馆，很快就到了早晨。在最后一次路边狂欢之后我们道了别，其中一人把什么东西塞进我手里。多么美妙的一夜！"
 gdp_merchant_luxury_contract.1602.student.failure: "一开始似乎还顺利，但她们很快就厌倦了我的陪伴，回过神来我发现自己独自端着酒杯，在城里的另一边。我说错什么了？"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName]热切地带我参观藏品，指出那些新奇而美丽的珍品。\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.GetSheHe|U]被我的兴趣大大鼓舞，一边指着那些稀有而珍贵的东西，一边热情地点头。\n\n等我终于要走的时候，[botanist.GetSheHe]递给我一个小物件，是[botanist.GetSheHe]看到我特别留意过的东西。"
 gdp_merchant_luxury_contract.1602.botanist.failure: "看来我没法好好欣赏那些藏品，也领会不了[botanist.GetHerHis]的讲解，[botanist.GetSheHe]很快就表明了，我的存在对[botanist.GetHerHis]来说完全多余……"
 gdp_merchant_luxury_contract.1602.a: "我会珍惜它的！"
 gdp_merchant_luxury_contract.1602.b: "总归是聊胜于无。"
 gdp_merchant_luxury_contract.1611.desc: "院长一开始不怎么在意，但当我表明自己是来自远方[merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]的成功商人时，他显然受宠若惊，夸张地把[scholar.GetHerselfHimself]自己介绍为[scholar.GetFirstName][scholar.Custom('MistressMaster')|U]。\n\n[scholar.GetSheHe|U]招手将我带到[scholar.GetHerHis]的私人书房，一路上指出建筑上的特色和有趣的东西。“那么，我能为您做什么呢，尊敬的[merchant.GetTitledFirstNameNoTooltip]？”[scholar.GetSheHe]笑着说。"
 gdp_merchant_luxury_contract.1611.a: "真希望我曾有机会在这里学习……"
 gdp_merchant_luxury_contract.1611.a.flavor: "考验你的[diplomacy_i|E][diplomacy|E]和[prestige_i|E][prestige_level|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "你获得了一份荣誉文凭"
 gdp_merchant_luxury_contract.1611.a.success: "你可以得到一份荣誉文凭，但需要支付一定费用"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip]感觉被冒犯了"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "荣誉文凭"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "一份由[local_province.GetBaronyNameExplicitly]的[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]院长颁发的荣誉学识证书。"
 gdp_merchant_luxury_contract.1621.desc: "我小心地走近那位智者，以免过分打扰[sage.GetHerHis]的专注，然而，[sage.GetSheHe]却把我吓了一跳！\n\n“想和我一起吗？”[sage.GetSheHe]平静地问道，没有转身，甚至没有睁开[sage.GetHerHis]眼睛。“过来坐吧。”\n\n我谦逊地接受了[sage.GetHerHis]的邀请，尽可能优雅地在[sage.GetHerHim]身旁坐好。\n\n“我是[sage.GetFirstName]，”[sage.GetSheHe]用沙哑的声音说道，“你来这地方做什么？”"
 gdp_merchant_luxury_contract.1621.a: "我……不知道。"
 gdp_merchant_luxury_contract.1621.a.flavor: "考验你的[learning_i|E][learning|E]和[piety_i|E][piety_level|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetSheHe|U]感到振奋"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetSheHe|U]很失望"
 gdp_merchant_luxury_contract.1631.desc: "我走进一个房间，里面是一排排看似没有尽头的架子，堆满了卷轴，弥漫着陈旧墨水和纸张的霉味。\n\n我轻轻走近那位沉默的学者，终于引起了[scholar.GetHerHis]的注意。起初[scholar.GetHerHis]只是匆忙地想要打发我，但看到我的异乡面孔，[scholar.GetHerHis]的目光变得柔和起来，显然是产生了好奇。"
 gdp_merchant_luxury_contract.1631.a: "朋友，你在读什么？"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.GetSheHe|U]对你的学识印象深刻"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetSheHe|U]认为你是个乡巴佬"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc]$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "一幅骇人的场景等着我。无数的骨头，人类的和其他动物的，排成整齐的行列，一个[merchant.Custom2('QuirkAdjectivePosOrNeg', physician)][physician.GetWomanMan]正摆弄着它们，为几名学生讲解。\n\n[physician.GetSheHe|U]终于注意到了我，带着疑惑的眼神示意我加入。我了解到这位就是[physician.GetFirstName]，并庆幸[physician.GetSheHe]确实是一位行医的[physician.GetWomanMan]。"
 gdp_merchant_luxury_contract.1641.a: "啊，这不是一根[merchant.Custom('RandomSaintBone')|l]吗？"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip]印象深刻"
 gdp_merchant_luxury_contract.1641.a.failure: "你惹恼了[physician.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "人类[physician.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "一根用作医学教具的骨头。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "人类头骨"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "一个用作医学教具的头骨。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "走近那群人，我做了自我介绍。学生们在我周围围成一圈，彼此笑着，但显然对一个外来者的接近感到好奇。\n\n他们听说我是来自远方[merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]的行商时，好奇心被勾了起来，我被邀请去附近一家声名狼藉的地方……喝点东西。"
 gdp_merchant_luxury_contract.1651.a: "去酒馆！"
 gdp_merchant_luxury_contract.1651.a.success: "你取悦了学生们"
 gdp_merchant_luxury_contract.1651.a.failure: "你让学生们感到无聊"
 gdp_merchant_luxury_contract.1661.desc: "走进这间奇特的大厅，我惊呆了。我从未见过这样的收藏，数不清的颜色、花瓣和叶子、皮毛和羽毛，一场感官的盛宴，一部自然的图鉴……\n\n直到这里的管家自我介绍是[botanist.GetFirstName]，并提议带我参观一圈，我才回过神来。"
 gdp_merchant_luxury_contract.1661.a: "非常感谢！"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip]感谢你的关注"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip]略感失望"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "一只[owner.Custom('GetAnimalType')]的[newly_created_artifact.Custom('ArtifactAnimalTrinketType')]。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "一只[owner.Custom('GetAnimalType')]的羽毛。$gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
