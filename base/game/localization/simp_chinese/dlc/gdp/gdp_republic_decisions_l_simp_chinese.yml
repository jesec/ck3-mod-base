 gdp_sponsor_craft_guild_decision: "赞助手工业行会"
 gdp_sponsor_craft_guild_decision_desc: "在共和国中，获得认可的手工业行会能带来巨大好处；因此，许多职业的工匠寻求由议会起草并批准的官方特许状——在此过程中赞助他们不仅对城市有益，将法案提交议会的贵人也将被新行会视为赞助人。"
 gdp_sponsor_craft_guild_decision_tooltip: "赞助手工业行会将增加[capital|E][county|E]的[prosperity_growth|E]和[urban_tax|E]，并促进你[house_possessive|E]的[trade_competitiveness|E]和[trade_expertise|E]增长"
