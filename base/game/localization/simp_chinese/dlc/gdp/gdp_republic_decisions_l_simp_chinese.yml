 gdp_debt_forgiveness_decree_decision: "债务免除"
 gdp_debt_forgiveness_decree_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的许多市民背负着无法偿还的债务。通过免除欠城市的债务，我们可以减轻他们的负担，并借此赢得忠诚。不是所有人都会赞同这种国库用途，但一个得到人民支持的统治者才能根基稳固。"
 gdp_debt_forgiveness_decree_decision_tooltip: "免除[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的市民债务，大幅提升[popular_opinion|E]"
