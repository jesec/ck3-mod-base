 gdp_glorification_decision_toast: "城市庆祝"
 gdp_fund_alms_decree_decision: "在首都施舍"
 gdp_fund_alms_decree_decision_desc: "作为[ROOT.Char.GetTitleAsNameNoTooltip]，确保[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的公民得到供养是我的责任。施舍的原因有很多：帮助有需要的人，增进城市繁荣，加强社会联系纽带。\n\n无论动机如何，为穷人提供帮助都是维持大众好感的可靠方式。"
 gdp_fund_alms_decree_decision_tooltip: "向[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的穷人施舍"
 gdp_fund_alms_decree_decision_confirm: "提供施舍"
 gdp_tax_holiday_decree_decision: "税收减免"
 gdp_tax_holiday_decree_decision_desc: "未来数年，对[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]市民征收的税将减少。国库将承担代价，但人民的善意值得这个价格。"
