l_simp_chinese:
 gdp_adopt_republic_government_decision: "采纳共和制理念"
 gdp_adopt_republic_government_decision_desc: "我看着人群在街上游荡，被日复一日的挣扎消磨着。这让我不禁怀疑，我们[ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l]的方式是否真的是统治者的唯一出路。也许我可以通过赢得认可而非仅凭血统来获得忠诚。或许是时候接受新的理念，改变我们的生活方式了。"
 gdp_adopt_republic_government_decision_tooltip: "采纳共和理念，成为[GetGovernment('republic_government').GetName]"
 gdp_adopt_republic_government_decision_confirm: "采纳共和制理念"
 liege_has_granted_city_charter: "你的[liege|E]已授予你城市宪章"
 liege_has_granted_city_charter_duration: "你的[liege|E]已授予你城市宪章#weak （直到[GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )]）#!"
