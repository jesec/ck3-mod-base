 gdp_overthrow_government_decision_desc: "这个共和国的领导层已经烂到根子上了。是时候矫正这艘国家的航船，废黜那些腐化无能的人，让共和美德重新治理[ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]了。\n\n我会寻找支持者，一起推翻[ROOT.Char.GetLiege.GetNameNoTooltip]的政府。"
