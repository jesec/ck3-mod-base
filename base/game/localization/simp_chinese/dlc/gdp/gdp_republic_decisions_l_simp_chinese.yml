 convert_to_feudalism_from_republic_decision_tooltip: "更改[government|E]"
 patricians_becomes_merchants_desc: "[patrician|E][vassals|E]成为[merchants|E]"
 gdp_restore_roman_republic_decision: "重建罗马共和国"
 gdp_restore_roman_republic_decision_desc: "罗马共和国曾是自由与繁荣的灯塔，是所有人效仿的典范。然而，它已如世间诸多事物一样，沦为废墟。是时候让它重获生机，恢复它昔日的荣光了！"
 gdp_restore_roman_republic_decision_tooltip: "重建罗马共和国"
 gdp_restore_roman_republic_decision_confirm: "重建罗马共和国"
 restore_roman_republic_make_rome_capital_desc: "你可以选择让[GetTitleByKey('c_roma_urbs').GetName]成为[realm_capital|E]"
 assembly_members_appointed_as_senators_desc: "所有[assembly|E]成员将被任命为[republic_senators|E]"
 gdp_popular_mandate_decision: "呼吁民众支持"
 gdp_popular_mandate_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的人民爱戴我。我现在可以利用这份善意，团结他们支持我继续任职。人群的声音在议会中有分量，而一位有人民支持的[ROOT.Char.GetTitleAsNameNoTooltip|l]在计票时拥有更强的手腕。\n\n这会耗费一些我那份好感，但选票赢在当下，而非明天。"
 gdp_popular_mandate_decision_tooltip: "花费[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的[popular_opinion|E]获得下一次[election|E]的额外选票"
 gdp_popular_mandate_decision_confirm: "团结民众支持我"
 gdp_popular_mandate_no_active_mandate_desc: "尚未拥有民众支持"
 gdp_civic_labor_decision: "指示市民劳役"
 gdp_civic_labor_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的善意是如黄金般可靠的资源。我将呼吁市民为我的建设努力提供劳动和专长，作为交换，将消耗部分的善意。"
 gdp_civic_labor_decision_tooltip: "花费[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的[popular_opinion|E]获得[ROOT.Char.GetTitleAsNameNoTooltip|l]住所建造加成"
 gdp_civic_labor_decision_confirm: "呼吁市民"
 gdp_popular_gifts_decision: "寻求赞助"
 gdp_popular_gifts_decision_desc: "我在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]民众中的声望给了我筹码。我会放出风声，说[ROOT.Char.GetTitleAsNameNoTooltip|l]正在收到各大贵族家族的出价。他们会竞相压过对方。无论如何，宫廷都得益。"
 gdp_popular_gifts_decision_tooltip: "花费[popular_opinion|E]迫使富有的贵人家庭争相效忠，为宫殿赚取[gold|E]和礼物"
 gdp_popular_gifts_decision_confirm: "公开招标"
 gdp_popular_gifts_artifact_tt: "你收到一份随机[artifact|E]赠礼"
 gdp_glorification_decision: "接受颂扬"
 gdp_glorification_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]人民对我的敬重早已超越了政治或名望。他们尊敬我，不单只是领袖，而是这座城市的具象化身。我会坦然接受这一时刻。"
 gdp_glorification_decision_tooltip: "接受城市的赞美。一生仅此一次的荣耀。"
 gdp_glorification_decision_confirm: "让他们庆祝吧"
 gdp_glorification_artifact_tt: "你获得#V $gdp_glorification_artifact_name$#![artifact|E]"
 gdp_glorification_artifact_name: "公民荣耀勋章"
 gdp_glorification_artifact_desc: "一枚由[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的市民赠送的纪念奖章，以纪念他们敬爱的[ROOT.Char.GetTitleAsNameNoTooltip|l]。"
