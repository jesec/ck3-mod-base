 gdp_adopt_republican_ways_decision: "采纳共和制道路"
 gdp_adopt_republican_ways_decision_desc: "曾经维系我们的集会，如今在市场与城墙的重压下不堪重负。若[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]想要繁荣，我们就必须抛弃古老的部落习俗，让这座城市作为一个共和国自行治理。"
 gdp_adopt_republican_ways_decision_tooltip: "放弃[tribal|E]道路，成为[republic|E]"
 gdp_adopt_republican_ways_decision_confirm: "采纳共和制道路"
 gdp_tribal_capital_becomes_city_tt: "你的[realm_capital|E]会成为[city_holding|E]"
 gdp_other_tribal_holdings_become_castles_tt: "领地内的所有其他[tribal_holdings|E]将会变为[castle_holdings|E]"
 gdp_tribal_vassals_will_feudalize_tt: "你的[tribal|E][vassals|E]将采用[feudal|E]或[clan|E][government|E]"
 convert_to_feudalism_from_republic_decision: "采用[ROOT.Char.Custom('GetTribalReformGovernment')|U]"
 convert_to_feudalism_from_republic_decision_desc: "议会、流程和官僚体系拖慢了我们政府的运转效率。如果[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]想要发展兴盛，我们就必须摆脱这些负担。"
