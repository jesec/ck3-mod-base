l_simp_chinese:
 gdp_visit_holding_decision_event.1200.t: "拜访庇护者"
 gdp_visit_holding_decision_event.1200.intro_desc: "我走进[ROOT.Char.GetCurrentLocation.GetName]的[ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l]，被眼前的奢华震惊了。到处都是无价的工艺品和装饰：[patron.Custom('RegionalFabric')]织锦、雕像、精雕细琢的家具。空气中弥漫着[patron.Custom('GetExpensiveMeal')]的浓郁香味。\n\n在匆忙穿行的仆从间，"
 gdp_visit_holding_decision_event.1200.all_available_desc: "我看见[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]正通报我的到来，而[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]就站在一旁。我得先让自己镇定下来，接着提出我的请求。"
 gdp_visit_holding_decision_event.1200.patron_available_desc: "我看见[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]招手让我走近。看来我是[patron.GetHerHis]最优先要见的人。我得先让自己镇定下来，接着提出我的请求。"
 gdp_visit_holding_decision_event.1200.steward_available_desc: "我看见[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]招手让我过去，但[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]哪儿都找不到。看来[patron.GetSheHe]太忙了没空见我。我得先让自己镇定下来，接着提出我的请求。"
 gdp_visit_holding_decision_event.1200.representative_desc: "我看见[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)]正代表[patron.GetTitledFirstNameNoTooltip]等着接待我，听说是因为[patron.GetSheHe]身体不适。我得先让自己镇定下来，接着提出我的请求。"
 gdp_visit_holding_decision_event.1200.none_available_desc: "我一直在努力寻找[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]或者其他能受理我请愿的人，但都没成功。看来我应该提前预约的。"
 gdp_visit_holding_decision_event.1200.a: "我想要加强对[ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]市场的控制。"
 gdp_visit_holding_decision_event.1200.a.tt: "你的提议可能提供以下机会：$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "我将寻找投资机会。"
 gdp_visit_holding_decision_event.1200.b.tt: "寻找财务投资可能提供以下机会：$gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.c: "转念一想……"
 gdp_visit_holding_decision_event.1200.c.tt: "回去看看[THIS.Char.GetCurrentLocation.GetName]还有什么其他的机会"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "我的伙计名单给[negotiator.GetTitledFirstNameNoTooltip]留下了深刻印象"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "我提到的名字都无足轻重"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "我的话引起了冒犯"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "我的组织能力说服了[negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "我的论点站不住脚"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "我的账目显示有贪污迹象"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "我说服了[negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip]不为所动"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip]对我的谎言感到被冒犯"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.GetTitledFirstNameNoTooltip]对我的学识印象深刻"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "我对经济理论的深入探讨让[negotiator.GetTitledFirstNameNoTooltip]感到厌烦"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "不知怎的，我让[negotiator.GetTitledFirstNameNoTooltip]觉得我很愚蠢"
 gdp_visit_holding_decision_event.1200.a_martial.success: "我对军事后勤的知识让[negotiator.GetTitledFirstNameNoTooltip]印象深刻"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "我最终听起来像个冒牌货"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "我举的例子听起来像在威胁"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.GetTitledFirstNameNoTooltip]对我的强大印象深刻"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip]打了个哈欠"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip]将我的肢体展示误判为威胁"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "你近期向[patron.GetShortUIName]请求过贸易特权——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]后再尝试"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "你近期以金钱向[patron.GetShortUIName]换取过威望——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]后再尝试"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$：竞争激烈的市场"
 gdp_visit_holding_decision_event.1201.all_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]做了个邀请的手势，示意我靠近些。我走过去前，赶紧在心里把方案最后过了一遍。这笔交易能不能成，对[ROOT.Char.GetHouse.GetName]商会来说至关重要。\n\n走近时，我感受到[patron.GetFirstName]身上散发出的优越感。\n\n“把你的条件说清楚，我也许会好心考虑一下……”"
 gdp_visit_holding_decision_event.1201.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]做出一个带有威慑意味的手势，示意我靠近些。我走过去前，赶紧在心里把方案最后过了一遍。这笔交易能不能成，对[ROOT.Char.GetHouse.GetName]商会来说至关重要。\n\n走近时，我感受到[patron.GetFirstName]身上散发出的优越感。\n\n“把你的条件说清楚，我也许会好心考虑一下……”"
 gdp_visit_holding_decision_event.1201.steward_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)]做出一个邀请的手势，示意我靠近些。我走过去前，赶紧在心里把方案最后过了一遍。这笔交易能不能成，对[ROOT.Char.GetHouse.GetName]商会来说至关重要。\n\n“把你的条件说清楚，我会评估这是否符合[patron.GetTitledFirstNamePossessive]的利益。”"
 gdp_visit_holding_decision_event.1201.representative_desc: "[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)]做出一个克制的手势，示意我靠近些。我走过去前，赶紧在心里把方案最后过了一遍。这笔交易能不能成，对[ROOT.Char.GetHouse.GetName]商会来说至关重要。\n\n“把你的条件说清楚，我会评估这是否符合[patron.GetTitledFirstNamePossessive]的利益。”"
 gdp_visit_holding_decision_event.1201.a: "“让我把合同提案过一遍……”"
 gdp_visit_holding_decision_event.1201.b: "“你言出必行，对吧？”"
 gdp_visit_holding_decision_event.1201.c: "算了吧。"
 gdp_visit_holding_decision_event.1201.c.tt: "回到你的听众面前，看看你还能提出什么建议。"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$：投资提案"
 gdp_visit_holding_decision_event.1202.all_available_desc: "我在一旁站着，看[patron.GetFirstName]翻看我的提案。他抬起头看向我，眉头微微皱起。\n\n“嗯……我明白了……这笔钱，我想我可以考虑为你和[ROOT.Char.GetHouse.GetName]商会担保。这应该足够为你赢得一些尊重了吧，[ROOT.Char.GetFirstNameNoTooltip]？”"
 gdp_visit_holding_decision_event.1202.patron_available_desc: "我向[patron.Custom2('MyCharacterIntroduction', ROOT.Char)]阐述提案时，[patron.GetHerHis]脸上露出了[negotiator.Custom('ComplimentAdjective')]的表情，似乎对此很感兴趣。\n\n“这足够为你赢得一些尊重了，[ROOT.Char.GetFirstNameNoTooltip]。”"
 gdp_visit_holding_decision_event.1202.steward_available_desc: "我耐心地站在一旁，等[steward.GetFirstName]读完我的提案。[steward.GetSheHe]显然对内容很感兴趣，抬起头看着我。\n\n“这份提案写得不错，这点我承认……我大概可以考虑替你和[ROOT.Char.GetHouse.GetName]商会向[patron.GetTitledFirstName]担保。”"
 gdp_visit_holding_decision_event.1202.representative_desc: "我耐心地站在一旁，等[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)]替[patron.GetTitledFirstNameNoTooltip]读完我的提案。[negotiator.GetSheHe]显然对内容很感兴趣，抬起头看着我。\n\n“这份提案写得不错。我会确保它送到[patron.GetTitledFirstNameNoTooltip]手中。”"
 gdp_visit_holding_decision_event.1202.a: "“或许我们可以协商……”"
 gdp_visit_holding_decision_event.1202.b: "“我接受你的提议。”"
 gdp_visit_holding_decision_event.1202.b.success: "交易成功！"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName]暂时不想再见到你——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]后再尝试"
 gdp_caught_stealing.tt: "你最近被抓到过在神圣的地方偷窃——你被驱逐直到[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]"
 gdp_visit_holding_decision_event.1000.b.tt: "向你的[merchant_patron|E]请愿可能提供以$gdp_visit_holding_decision_effect_prestige$下机会：$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "你的[merchant_patron|E]或[patron.GetHerHis]的代表必须在场"
 gdp_visit_holding_decision_event.1500.t: "拜访[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip][ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "回到[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]，一切都还是那样。随着太阳在天空中缓缓移动，广场周围的建筑轮流在广场中投下阴影。"
 gdp_visit_holding_decision_event.1500.desc_returned_02: "我大步穿过柔和的阳光回到[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]，一股浓香猛地钻进我的鼻孔。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "从昏暗的治疗师小屋出来，我眯起眼睛，寻找回到[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]广场的路。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "穿过[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]的大门，我回到[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]广场，一种田园诗般的宁静萦绕着我。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "从宁静的花园回来时，望向繁忙的[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]广场，我感到心情轻松。"
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "我离开[merchant_physician_recruit.GetFirstNamePossessiveNoTooltip]的书房，沿着逐渐变窄的小巷返回，回到了[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]的广场。"
 gdp_visit_holding_decision_event.1500.desc: "尽管有很多商贩、[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]和助手，但[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural]广场依然有一种特有的宁静。\n\n广场中央矗立着一座宏伟的[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]，在一旁我看到一些大胆宣称疗效的标志，还有一个附属花园供人静静沉思[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]。"
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\n广场边缘，一名信徒正在宣扬更好的身体健康，按照事先约定，我生病的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))][1500_sickly_minor.GetFirstName]被护送到治疗师小屋，正在那里等我。"
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\n在广场边缘，一位信徒正在宣讲如何通过提高身体健康来提升我们的精神健康。尽管偶尔受到农民人群的嘲笑，[merchant_physician_recruit.GetSheHe|U]立场坚定。"
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\n按照与一名护理者在营地的约定，我生病的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))][1500_sickly_minor.GetFirstName]被护送到治疗师小屋，正在那里等我。"
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName]感激地点头，环顾繁忙的广场，已经开始注视那些令人好奇的摊位和令人感兴趣的东西。"
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\n我处于满足的状态，望着广场，深吸几口气，思考着下一个目的地。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n看起来有些疲惫的[visiting_partner.GetFirstName]说道：“我不是个爱抱怨的人，但是……我们在这里的事肯定都处理完了吧，[visiting_partner.Custom2('RelationToMe', ROOT.Char)]？”"
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\n在[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]广场待了相当长的一段时间后，我对今天处理的事情感到满意，环顾四周寻找起返回主广场的最快道路。"
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n这位虔诚的传教士一直在宣讲[merchant_physician_recruit.GetHerHis]那与健康有关的教义，但似乎讲道已接近尾声。"
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\n不知道为什么，广场上现在似乎有很多孩子。他们一直都在这里吗？他们玩耍、打闹，不断为旧的活动找到新的方法；这常常令他们的看护者惊讶和恼怒。\n\n我环顾广场寻找下一个目的地时，我的思绪仍然停留在[1500_sickly_minor.GetFirstNamePossessive]的健康状况上。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\n在我左侧，[visiting_partner.GetFirstName]好奇地检查着一个放满小瓶子的架子——据称瓶里装满了[ROOT.Char.Custom('VenomousCreature')]的毒液。\n\n我思考着接下来要去哪里，一想到这些就起了鸡皮疙瘩。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName]推推我的肩膀，指向护送一个衣衫褴褛，大声呼喊世界末日的[ROOT.Char.GetWomanMan]离场的卫兵。\n\n我正思考着接下来的行动，本能地扬了扬眉毛，看向这场骚动。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName]在我们穿过广场时递给我一块干粮。\n\n我一边沉思地咀嚼着干粮，一边思考着下一步的行动。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\n在广场背阴的一处角落里，一个小商贩正尝试说服一位贵族[ROOT.Char.GetWomanMan]相信红沙的治疗作用。\n\n我一边思考着接下来的行动，一边漫不经心地注视着他们的争论。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\n在附近一个摆着黑曜石镜子的摊位上，一名[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter]正尝试掩盖[ROOT.Char.GetHerHis]的兴奋，因为[ROOT.Char.GetSheHe]终于有机会检查一下[ROOT.Char.GetHerselfHimself]自己了。\n\n有点好笑，我这么想着，同时思考接下来要去哪里。"
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\n在小型圆厅旁，一个小商贩拿着[ROOT.Char.Custom('RandomReligiousTextName')]抄本，正在为谦卑的观众大声朗读。\n\n我一边观察广场，一边心不在焉地听着，同时思考接下来的行动。"
 gdp_visit_holding_decision_event.1500.a: "我会寻求医师的祝福。"
 gdp_visit_holding_decision_event.1500.a_second: "我会回到医师那里。"
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "也许医师们能帮到[1500_sickly_minor.GetFirstNameNoTooltip]。"
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip]还在等我。"
 gdp_visit_holding_decision_event.1500.a.tt: "拜访医者可能带来以下机遇：$gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "你近期已拜访了医师——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]后再尝试"
 gdp_visit_holding_decision_event.1500.b: "这座[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]倒挺有意思。"
 gdp_visit_holding_decision_event.1500.b_second: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]值得再次参访。"
 gdp_visit_holding_decision_event.1500.b.tt: "前往本地宗教场所可能带来以下机遇：$gdp_visit_holding_decision_effect_donate$$gdp_visit_holding_decision_effect_blessing$$gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "你近期造访了本地的崇拜之所——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]后再尝试"
 gdp_visit_holding_decision_event.1500.c: "这些花园看起来很有趣。"
 gdp_visit_holding_decision_event.1500.c_second: "我会再去看一看花园。"
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$沉思信仰，降低[stress|E]"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$搜寻补给"
 gdp_visit_holding_decision_event.1500.c.tt: "造访花园可能带来以下机遇：$gdp_visit_holding_decision_effect_garden_contemplate$$gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "你近期造访了花园——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]后再尝试"
 gdp_visit_holding_decision_event.1500.d: "那边站着一位布道者吗？"
 gdp_visit_holding_decision_event.1500.d_second: "我和[merchant_physician_recruit.GetFirstNameNoTooltip]还有没说完的事。"
 gdp_visit_holding_decision_event.1500.d.tt: "与医师交谈可能带来以下机遇：$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "我得去处理其他事情。"
 gdp_visit_holding_decision_event.1501.intro: "光线变暗了，治疗师小屋里有股明显的#EMP 气味#!。不算#EMP 刺鼻#!，但多少有些难闻。\n\n[merchant_healer_character.GetFirstName]正站在一张高高的桌子旁，忙着调配药物。"
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$：医师"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$我们刚一进门，便见到一个[merchant_healer_character.GetWomanMan]满面笑容地迎向我们。\n\n“欢迎光临寒舍！我是[merchant_healer_character.GetFirstNameNoTooltip]，请问需要什么帮助？”"
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "我生病的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))][1500_sickly_minor.GetFirstName]和我一起来到治疗师小屋。我搀着[1500_sickly_minor.GetHerHim]下了楼梯，[1500_sickly_minor.GetSheHe|U]剧烈地咳嗽着。\n\n治疗师[merchant_healer_character.GetFirstName]从[merchant_healer_character.GetHerHis]的木凳上起身，用严峻的眼神看了我一眼：“需要我的服务吗？”"
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "当我们走进治疗师小屋时，[merchant_healer_character.GetFirstName]正在为一名老年[ROOT.Char.GetWomanMan]清洁。[visiting_partner.GetFirstName]急切地看着[merchant_healer_character.GetFirstNameNoTooltip]，[visiting_partner.GetHerHis]眼中闪烁着兴奋的光芒：“我也行试试#EMP 那个#!……”\n\n[merchant_healer_character.GetFirstNameNoTooltip]听到我们的声音，抬起头来：“我没看到你们！你哪里不舒服吗？”"
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$[merchant_healer_character.GetSheHe|U]抬起头，稍微扬了扬[merchant_healer_character.GetHerHis]的眉毛：“你完好无损地回来了！这一次我能帮你做些什么？”"
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName]正躺在治疗师小屋角落里火炉旁的柔软垫子上休息，等着我回来。我倾身探了探[1500_sickly_minor.GetHerHis]的呼吸，然后摸了摸[1500_sickly_minor.GetHerHis]的头发。\n\n[merchant_healer_character.GetFirstName]放下[merchant_healer_character.GetHerHis]的[ROOT.Char.Custom('WritingInstrument')]，冷冷看了我一眼：“接下来呢？”"
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "我们走进治疗师小屋时，[merchant_healer_character.GetFirstName]正在琢磨一些草药，但[merchant_healer_character.GetSheHe]在我们走下楼梯时抬头看了我们一眼：“啊，改变主意了？”\n\n在我左侧，[visiting_partner.GetFirstNameNoTooltip]将[visiting_partner.GetHerHis]的身体重心从一只脚移到另一只脚，仍然想要尝试我们之前看到[merchant_healer_character.GetFirstNameNoTooltip]做的手术。"
 gdp_visit_holding_decision_event.1501.desc_returned_01: "当我沿着楼梯进入治疗师小屋时，[merchant_healer_character.GetFirstName]正在照顾另一位病人。[merchant_healer_character.GetSheHe|U]瞥了我一眼，然后示意[merchant_healer_character.GetHerHis]的病人在房间稍远处的床上坐下。\n\n然后，[merchant_healer_character.GetSheHe|U]拉上用旧床单做的临时窗帘，给了病人和我们一些隐私。\n\n“你回来了，”[merchant_healer_character.GetSheHe]不知疲倦地说：“有什么需要我帮忙吗？”"
 gdp_visit_holding_decision_event.1501.desc_returned_02: "回到昏暗的治疗师小屋，[merchant_healer_character.GetFirstName]坐在稍远的地方，翻阅着一本破旧的笔记。从远处看不清楚，里面似乎描述了人类的形体。\n\n[merchant_healer_character.GetSheHe|U]小心地合上笔记，把它收起来，然后看向我，平静地说道：“啊，你回来了。终究发现了什么困扰你的东西？”"
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\n我眼角的余光瞥见了一些医用小饰物，其中有一件华丽的角吸引了我的注意。"
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\n房间稍远处，令人印象深刻的[1500_health_artifact.GetName]仍和其他药用小饰物搁在一起。"
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\n房间稍远处，在一个装满药用小饰物的架子上，我看到一个奇特的[1500_health_artifact.GetName]，勾起了我的兴趣。"
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\n房间稍远处，[1500_health_artifact.GetName]仍然挑动着我的兴趣。"
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "“我对那个[1500_health_artifact.GetNameNoTooltip]感兴趣。”"
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "“我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))][1500_sickly_minor.GetFirstNameNoTooltip]需要治疗！”"
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "治疗失败"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "治疗失败"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "治疗成功"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$：[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "我们回到[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]，一场布道刚刚结束。[merchant_clergy_character.GetFirstName][merchant_clergy_character.Custom('SisterBrother')|U]拿着扫帚走来走去，小心地打扫着卫生，为前来祈祷和沉思的访客提供一处整洁的神圣之地。\n\n当我走近时，[merchant_clergy_character.GetSheHe|U]抬头看了看，嘴角一弯露出一丝微笑：“欢迎回到[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]温暖的怀抱。你为什么不待上一会儿，欣赏一下风景？”"
 gdp_visit_holding_decision_event.1503.desc_returned_02: "我再次进入[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]，[merchant_clergy_character.GetFirstName][merchant_clergy_character.Custom('SisterBrother')|U]正坐在一张面向讲坛的长椅上，看起来正聚精会神地冥想。\n\n当我走进时，[merchant_clergy_character.GetSheHe|U]转过头朝我的方向看来：“太忙碌了。让疲惫的脚休息一下吧，孩子。有什么需要我帮忙吗？”"
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "当我进入[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]大门时，负责这个地方的[GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]刚刚完成了当天分发的任务。\n\n我顺着主过道望去，出乎意料地看到了[merchant_clergy_character.GetFirstName][merchant_clergy_character.Custom('SisterBrother')]，后者神秘莫测地看了我一眼，走了过来：“任性的孩子。[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]把你安全送回了我们门前！”"
 gdp_visit_holding_decision_event.1503.desc: "穿过[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]大门时，那些精致的结构和神圣的装饰让我惊叹不已。\n\n负责这里的一名[GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]注意到我，镇定地走了过去：“你好，孩子。我是[merchant_clergy_character.GetFirstName][merchant_clergy_character.Custom('SisterBrother')]。有什么需要我帮助吗？”"
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "我#EMP 想#!……"
 gdp_visit_holding_decision_event.1503.b: "“也许[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]能赐福我们的商会？”"
 gdp_visit_holding_decision_event.1503.c: "显然#EMP 我#!需要这些捐款。"
 gdp_visit_holding_decision_event.1503.c_guarded: "再捐一次款，进入#EMP 我的#!口袋。"
 gdp_visit_holding_decision_event.1503.c_master_thief: "“喂，[visiting_partner.GetFirstNameNoTooltip]，盯着点！”"
 gdp_visit_holding_decision_event.1503.c.flavor: "分散注意力，偷一些钱币。简单。"
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "嗯。出于某种原因，卫兵在这里频繁走动……"
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "成功的偷窃"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "你成功偷到了捐款"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "被驱逐！"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "你被从[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]驱逐"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "卫兵被叫来了"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "当我递交捐款时，[merchant_clergy_character.GetFirstNamePossessive]的眼睛震惊地睁大：“你……你看起来就像神的……[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]的……[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]的……我发誓……”[merchant_clergy_character.GetSheHe]盯着我看了一会儿，嘴里像鱼一样在动。\n\n意识到自己的窘态后，[merchant_clergy_character.GetFirstNameNoTooltip]整理了一下自己，清了清嗓子：“我将很荣幸把#EMP 我的#!生命奉献给你的事业。”"
 gdp_visit_holding_decision_event.1504.desc: "[merchant_clergy_character.GetFirstNamePossessive]的笑意愈加浓厚，[merchant_clergy_character.GetSheHe]俯身把一只手放在我的肩膀上：“你真是太慷慨了，我的孩子。我理解，对于像你这样的冒险者来说，金钱来之不易。”\n\n[merchant_clergy_character.GetSheHe|U]意味深长地点点头，[merchant_clergy_character.GetHerHis]的手回落到身侧，[merchant_clergy_character.GetHerHis]把目光落在我身上。"
 gdp_visit_holding_decision_event.1504.a: "“也许[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]能赐福我们的商会？”"
 gdp_visit_holding_decision_event.1504.a_epiphany: "“我只对[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]的恩典感兴趣。”"
 gdp_visit_holding_decision_event.1504.b: "“我们#EMP 需要#!另一副能干的身体。”"
 gdp_visit_holding_decision_event.1504.c: "“我只想要自己的同胞。”"
 gdp_visit_holding_decision_event.1504.c_epiphany: "……我们目前不招人。"
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$：花园"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "花园依然宁静，一些访客坐在长椅上低声交谈，而另一些人则静静地沉思，观看大自然的变化。\n\n我听着低语和微风，风吹过树木，顿时感觉更自在了。"
 gdp_visit_holding_decision_event.1505.desc_returned_02: "这次，我在[ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]的林子里发现了一只小鸟，它正尝试第一次展翅飞翔。\n\n它轻轻地滑出巢穴边缘，但翅膀似乎纠缠在一起，几秒钟内小鸟在空中自由下落，直到……风轻轻接住小鸟，将它送到安全之处。一种宽慰的感觉在我胸中蔓延。"
 gdp_visit_holding_decision_event.1505.desc: "花园被树篱环绕，树木分散在柔和的土丘上，偶尔可以透过树叶看到鸟和松鼠。\n\n在这一切美景中，我感受到一种强烈的临在。在所有的试炼和磨难中，[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]一直陪着我吧？"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\n又往前走了几步，[visiting_partner.GetFirstName]正在重新查看该地的可食用植物。"
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\n又往前走了几步，我发现更多的野味，它们在下午的阳光下伸展。"
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\n我们在花园散步时，每次看到不知能不能食用的植物，我都能听到身后[visiting_partner.GetFirstName]的嘟囔声。"
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\n我眼角的余光瞥见了看起来十分美味的野果和香草，为花园增添了几分甘美。"
 gdp_visit_holding_decision_event.1505.a: "我感到平静。"
 gdp_visit_holding_decision_event.1505.a_convert: "也许[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]也没那么糟糕。"
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "你最近已经在这个花园沉思过了——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]后再次尝试"
 gdp_visit_holding_decision_event.1505.b: "浪费那些食物可太可惜了。"
 gdp_visit_holding_decision_event.1505.b_partner: "“[visiting_partner.GetFirstNameNoTooltip]，我们去采集些食物怎么样？”"
 gdp_visit_holding_decision_event.1505.b_flavor: "收获时间！"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "你最近在这个花园里收割过——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )]后再次尝试"
 gdp_visit_holding_decision_event.1505.c: "“……如此多的隐藏的角落和缝隙，#EMP [visiting_partner.GetFirstNameNoTooltip]#!……”"
 gdp_visit_holding_decision_event.1505.c.flavor: "真是神圣无比。"
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "你最近在这个花园里放松过——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )]后再次尝试"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$：医生"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "通向[merchant_physician_recruit.GetFirstNamePossessive]诊室的门微微开着，通过缝隙，我看到[merchant_physician_recruit.GetFirstNameNoTooltip]正在用非常锋利和细长的剪刀给一位客人理发，客人坐得非常稳。\n\n我敲了敲门然后进去，吸引了医生的注意：“鬼鬼祟祟。你想要什么？”"
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName]站在[merchant_physician_recruit.GetHerHis]的门外，检查着一位[ROOT.Char.GetWomanMan]看似疼痛的肩膀。\n\n[merchant_physician_recruit.GetSheHe|U]结束了这次就诊，指示了如何最好地治疗关节，然后转向我：“你回来了。这次你想要什么？”"
 gdp_visit_holding_decision_event.1507.desc_returned_03: "当我小心翼翼地走上通向[merchant_physician_recruit.GetFirstNamePossessive]诊室的楼梯时，我透过敞开的门窥视。\n\n[merchant_physician_recruit.GetSheHe|U]似乎正忙于某种形式的体能锻炼，大汗淋漓，反复做深蹲和起立。\n\n经过一系列重复后，[merchant_physician_recruit.GetSheHe]停了下来，擦了擦[merchant_physician_recruit.GetHerHis]的额头，拿起旁边的瓶子并喝了一口。现在[merchant_physician_recruit.GetHerHis|U]眼神锐利地盯着我：“你真是锲而不舍，不是吗？”"
 gdp_visit_holding_decision_event.1507_desc_intro: "我跟随[merchant_physician_recruit.GetFirstName]穿过一条渐渐变窄的小巷，上楼梯进入了[merchant_physician_recruit.GetHerHis]的诊室。房间里从地板到天花板堆满了书架，上面放着有关体液、健康和灵性的书籍和印刷品。\n\n[merchant_physician_recruit.GetSheHe|U]坐在唯一的椅子上，桌子后面，心不在焉地抚摸着一个小护身符，然后终于注意到我的存在："
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$“咦，我以前是不是在哪见过你？你想做什么？”\n\n我仔细斟酌着要说的话，然后回应道："
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$“哦，是你啊。你想要什么？”\n\n“我看到你告诫那些穷困者，”我回答道，犹豫了一下继续说道："
 gdp_visit_holding_decision_event.1507.a: "“想要为我工作吗？”"
 gdp_visit_holding_decision_event.1507.b: "“帮我增强我的伙计的精神吧！”"
 gdp_visit_holding_decision_event.1507.c: "“你的能力需要#EMP 使用#!才能保持锋利。加入我的商会吧。”"
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName]同意你的看法"
 gdp_visit_holding_decision_event.1507.c.failure: "你未能怂恿[merchant_physician_recruit.GetShortUIName]"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUIName]开始无视你"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "你回到了[THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]的庭院，看看他们还有什么能提供"
