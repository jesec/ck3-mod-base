 gdp_visit_holding_decision_event.1310.a.tt: "在地图上生成一份[menagerie|E][luxury_contract_i][luxury_contract|E]"
 gdp_visit_holding_decision_event.1310.b: "我对获取那些奇珍异宝非常感兴趣。"
