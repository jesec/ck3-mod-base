 gdp_visit_holding_decision_event.1400.t: "造访[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]码头"
 gdp_visit_holding_decision_event.1400.intro: "繁忙的[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]港口上，码头工人正忙着装卸各式各样的货物。"
 gdp_visit_holding_decision_event.1400.asia: "一箱箱丝绸、一袋袋茶叶，被一双双粗糙的大手小心装卸。这些珍货随后会搭乘远洋的楼船，闯过汹涌海浪，运往世界各地。"
 gdp_visit_holding_decision_event.1400.mena_india: "四下一派繁忙景象，一位商人正仔细检查着破损的货箱。码头另一侧，装满香料的木箱已被严密封存，即将启程驶向危机四伏的远洋。"
 gdp_visit_holding_decision_event.1400.default: "成袋的粮食与食盐，正被装上船只运往远方。一艘巨大的橡木柯克船刚刚抛锚靠岸，一群衣着花哨的异域商人陆续走下船来。"
 gdp_visit_holding_decision_event.1400.outro: "清新的海风扑面而来，我迫不急地期盼着今日能撞上好运。\n\n……接下来应该去哪？\n\n"
 gdp_visit_holding_decision_event.1400.b: "我得留心观察那些有趣的人。"
 gdp_visit_holding_decision_event.1400.b.tt: "在码头上物色伙伴可能提供以下机会：$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "我得跟那位船长谈谈。"
 gdp_visit_holding_decision_event.1400.d.tt: "与船长交谈\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "我应该再和[sea_captain.GetFirstNameNoTooltip]谈谈。"
 gdp_visit_holding_decision_event.1400.c.tt: "暂时离开码头"
 DECISION_ALREADY_VISITING_HOLDING: "[CHARACTER.Custom('IsAlreadyVisitingHolding')]"
 DECISION_ALREADY_VISITING_HOLDING_TIME: "该行动将于[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'gdp_visit_holding_is_visiting') )]后再次可用"
 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "你已经在造访地产了"
 gdp_visit_holding_decision_event.1340.t: "在[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]的闲暇时光"
 gdp_visit_holding_decision_event.1340.desc: "商界的日子有时很是熬人，人能过目的交易数量有限，能挤出的假笑也有上限，没有一次像样的休息根本撑不下去。\n\n"
 gdp_visit_holding_decision_event.1340.tea: "在这间茶馆里，我可以暂时把商队的烦心事抛在脑后。\n\n捧着一杯热气腾腾的新茶，和当地的常客随便聊几句闲话、说说见闻和八卦，实在是件让人松快的事。"
 gdp_visit_holding_decision_event.1340.hashish: "在这间大麻馆里，我可以暂时把商队的烦心事抛在脑后。\n\n坐在凉爽安静的地方，和当地的常客随便聊几句闲话、说说见闻和八卦，实在是件让人松快的事。"
 gdp_visit_holding_decision_event.1340.drink: "在这间酒馆里，我可以暂时把商队的烦心事抛在脑后。\n\n抿着一杯不错的[ROOT.Char.Custom('RegionalAlcoholicDrink')]，和当地的常客随便聊几句闲话、说说见闻和八卦，实在是件让人松快的事。"
 gdp_visit_holding_decision_event.1340.food: "在这间宴会厅里，我可以暂时把商队的烦心事抛在脑后。\n\n随便吃点餐食，小口啃着[ROOT.Char.Custom('FavoriteTreat')]，和当地的常客随便聊几句闲话、说说见闻和八卦，实在是件让人松快的事。"
 gdp_visit_holding_decision_event.1340.bath: "在这间澡堂里，我可以暂时把商队的烦心事抛在脑后。\n\n泡在让人恢复精力的温水里，和当地的常客随便聊几句闲话、说说见闻和八卦，实在是件让人松快的事。"
 gdp_visit_holding_decision_event.1340.a: "我应该常来。"
