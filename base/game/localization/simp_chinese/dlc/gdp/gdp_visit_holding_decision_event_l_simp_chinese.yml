l_simp_chinese:
 gdp_visit_holding_decision: "造访地产"
 gdp_visit_holding_decision_tooltip: "$visit_local_settlement_decision_tooltip$\n[ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasWorship')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasWorship')]"
 gdp_visit_holding_decision_confirm: "出发！"
 gdp_visit_holding_decision_desc: "机遇自会眷顾有心人。[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]当地的[ROOT.Char.Custom('LocalHoldingTypeConcept')]之内蕴藏着无限商机！新的主顾、贸易合同与生意正等待你的到来。"
 gdp_visit_holding_decision_effect_intro: "你将获得机会去："
 gdp_visit_holding_decision_effect_artifact: "\n$EFFECT_LIST_BULLET$购买新的或改进现有的[artifact_i][artifacts|E]"
 gdp_visit_holding_decision_effect_guild: "\n$EFFECT_LIST_BULLET$提升你或你[family_i][family|E]的[skill_i][skills|E]"
 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$提升你的[competitiveness_i][trade_competitiveness|E]"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$用[gold_i][gold|E]换取[prestige_i][prestige|E]"
 gdp_visit_holding_decision_effect_recruit: "\n$EFFECT_LIST_BULLET$遇见并招募[associate_i][associates|E]"
 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$发现[luxury_contract_i][luxury_contracts|E]"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$降低你的[stress_loss_i][stress|E]"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$$gdp_visit_holding_decision_effect_artifact$$gdp_visit_holding_decision_effect_guild$$gdp_visit_holding_decision_effect_competitiveness$$gdp_visit_holding_decision_effect_prestige$$gdp_visit_holding_decision_effect_recruit$$gdp_visit_holding_decision_effect_contracts$$gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak 你仍有机会在以下地点探索：#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$行会"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$市场"
 VISIT_HOLDING_DECISION_AVAILABLE_DOCKS: "\n$EFFECT_LIST_BULLET$码头"
 VISIT_HOLDING_DECISION_AVAILABLE_PATRON: "\n$EFFECT_LIST_BULLET$你的[ROOT.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip]宫廷"
 VISIT_HOLDING_DECISION_AVAILABLE_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 VISIT_HOLDING_DECISION_EXHAUSTED_AREAS_HEADER: "\n#weak 这些区域将在以下时间后重新开放：#!"
 VISIT_HOLDING_DECISION_EXHAUSTED_GUILDS: "\n$EFFECT_LIST_BULLET$行会——[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$市场——[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$码头——[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$你的[ROOT.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip]宫廷——[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]——[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "你已探索完这个[ROOT.Char.Custom('LocalHoldingTypeConcept')]的所有机会。新的选项将在[GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]后可用"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "造访[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip][ROOT.Char.Custom('LocalHoldingTypeCapitalized')]"
 gdp_visit_holding_decision_event.1000.desc: "太阳冉冉升起，[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]的居民们也纷纷起身劳作。清晨的静谧很快被往来人群的谈笑与日常劳作声打破。只要细心观察，你就能发现热闹街巷的每一处都藏着机遇。\n\n今天，我应该去哪里寻觅新的财富？"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "货栈的一课"
 gdp_visit_holding_decision_event.1000.a: "我该去拜访当地行会。"
 gdp_visit_holding_decision_event.1000.a.tt: "造访行会可能提供以下机会：$gdp_visit_holding_decision_effect_artifact$$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "你已探索完行会提供的一切。请在[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]后重试"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "你已探索完市场提供的一切。请在[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]后重试"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "你已探索完码头提供的一切。请在[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]后重试"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "你目前已在[THIS.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip]的宫廷用尽了所有机会。请在[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]后重试"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "你没有可以寻求觐见的庇护人"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "你已探索完这座[THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]目前提供的一切。请在[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]后重试"
 gdp_visit_holding_caught_stealing.tt: "你最近在这个[THIS.Char.Custom('LocalHoldingTypeConcept')]的[THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]偷窃被抓——你被禁止进入，直到[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]"
 gdp_visit_holding_decision_event.1000.b: "我应该请求面见[patron.GetTitledFirstNameNoTooltip]。"
 gdp_visit_holding_decision_event.1000.c: "真是逛集市的好天气。"
 gdp_visit_holding_decision_event.1000.c.tt: "造访当地市场可能提供以下机会：$gdp_visit_holding_decision_effect_recruit$$gdp_visit_holding_decision_effect_contracts$$gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "今天适合沿着码头散步。"
 gdp_visit_holding_decision_event.1000.e.tt: "造访码头可能提供以下机会：$gdp_visit_holding_decision_effect_recruit$$gdp_visit_holding_decision_effect_contracts$$gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "这里的[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]看起来很有趣。"
 gdp_visit_holding_decision_event.1000.f.tt: "造访当地宗教场所可能提供以下机会：$gdp_visit_holding_decision_effect_donate$$gdp_visit_holding_decision_effect_cure$$gdp_visit_holding_decision_effect_blessing$$gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$捐赠[gold_i][gold|E]以获得[piety_i][piety|E]"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$改善你的[health|E]或治愈[diseases|E]"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$获得[character_modifier|E]形式的祝福"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$从供奉中偷取[gold_i][gold|E]"
 gdp_visit_holding_decision_event.1000.d: "我想今天该办的事已经办完了。"
 gdp_visit_holding_decision_event.1000.d.tt: "暂且先回到住所"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "“其实，我改主意了。”"
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "不探索这个[ROOT.Char.Custom('LocalHoldingTypeConcept')]就离开"
 gdp_visit_holding_decision_event.1000.d.exhausted: "看来没什么可做的了……"
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "回家。新的机会将在[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]后可用"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "你的[domicile|E]当前不位于[merchant_patrons|E]的领地内"
 gdp_visit_holding_decision_event.1110.t: "造访[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]行会"
 gdp_visit_holding_decision_event.1110.desc: "街巷间不断传来金属敲击的声响，一名年轻学徒正抬着师傅的工具箱走入一间陶器作坊。长久以来，行会会馆将一代代青涩的学徒打磨为技艺精湛的匠人。\n\n行会能为商人提供各式各样的服务，今天我应当寻求哪一项帮助？"
 gdp_visit_holding_decision_event.1110.a: "我有一件宝物需要打磨一下。"
 gdp_visit_holding_decision_event.1110.a.tt: "造访器物修缮师可能提供以下机会：\n$EFFECT_LIST_BULLET$提升你普通或大师级的@artifact_icon![artifacts|E]"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "你最近委托过修缮——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]后再试"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "你没有任何普通或大师级[artifacts|E]"
 gdp_visit_holding_decision_event.1110.b: "我想购置全新的武器与盔甲。"
 gdp_visit_holding_decision_event.1110.b.tt: "造访铁匠铺可能提供以下机会：\n$EFFECT_LIST_BULLET$购买普通、大师或名作级的武器或盔甲@artifact_icon![artifacts|E]"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "你最近从铁匠铺购买过商品——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]后再试"
 gdp_visit_holding_decision_event.1110.c: "我应该设法跟行会首领见面。"
 gdp_visit_holding_decision_event.1110.c.tt: "造访行会首领可能提供以下机会：$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "你最近拜访过行会首领——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]后再试"
 gdp_visit_holding_decision_event.1110.d: "还是换个地方看看吧？"
 gdp_visit_holding_decision_event.1110.d.tt: "暂时离开行会区域"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$：修缮师"
 gdp_visit_holding_decision_event.1111.desc: "走进修缮师的工坊，映入眼帘的是来自四面八方的奇珍异宝。后方工作台边，一位[curator.GetWomanMan]正俯身于匕首前，在刀柄上雕刻最精美的宝石。当我端详一件展品时，[curator.GetSheHe]从专注中回过神来。\n\n“啊，来客人了！今天有什么可以帮到[ROOT.Char.GetTitledFirstNameNoTooltip]的？”"
 gdp_visit_holding_decision_event.1111.a: "也许[artifact_target_1.GetNameNoTooltip]需要擦亮一下。"
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName]将获得提升"
 gdp_visit_holding_decision_event.1111.b: "也许[artifact_target_2.GetNameNoTooltip]需要一些关爱。"
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName]将获得提升"
 gdp_visit_holding_decision_event.1111.c: "我想我的[artifact_target_3.GetNameNoTooltip]还能更精美些。"
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName]将获得提升"
 gdp_visit_holding_decision_event.1111.d: "我可能得晚点再来……"
 gdp_visit_holding_decision_event.1111.d.tt: "回到行会，看看在[THIS.Char.GetCurrentLocation.GetName]还有什么能做的"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$：铁匠铺"
 gdp_visit_holding_decision_event.1112.desc: "走进铁匠铺，炉火的热浪扑面而来，几乎让人喘不过气。一位铁匠正挥动铁锤，锻造着一柄阔剑。见有人进来，[blacksmith.GetHerHis]停下了手中的活计，[blacksmith.GetSheHe]抬手抹了抹额头上混着汗水与煤灰的污渍，转过头望向我。\n\n“哟，来了位[ROOT.Char.GetTitleAsNameNoTooltip]。你今天是想添置些精良的武器和护甲吗？放眼整个[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]，你可找不到比这儿更好的东西了。”"
 gdp_visit_holding_decision_event.1112.a: "[arms_armor_artifact_1.GetNameNoTooltip]对我的藏品是一个很好的补充。"
 gdp_visit_holding_decision_event.1112.b: "也许我该买下[arms_armor_artifact_2.GetNameNoTooltip]。"
 gdp_visit_holding_decision_event.1112.c: "我可以用得上像[arms_armor_artifact_3.GetNameNoTooltip]这样的装备。"
 gdp_visit_holding_decision_event.1112.d: "转念一想，今天算了。"
 gdp_visit_holding_decision_event.1112.d.tt: "回到行会，看看在[THIS.Char.GetCurrentLocation.GetName]还有什么能做的"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$：行会首领的指点"
 gdp_visit_holding_decision_event.1113.desc: "与行会首领[guild_master.GetName]的会面，令[ROOT.Char.GetHouse.GetName]商会获益良多。那间布满灰尘的书房里堆满了卷宗与文书，不知不觉间，几个小时就过去了。\n\n[guild_master.GetNameNoTooltip]在[guild_master.Custom('highest_skill_noun')]方面有着独到的见解。[guild_master.GetHerHis|U]的言谈让我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))][visiting_associate.GetName]深深着迷，我们只想继续聆听更多充满智慧的经验分享。"
 gdp_visit_holding_decision_event.1113.a.success: "你与[visiting_associate.GetName]轻松领会了所学知识"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "解读这些古老的手稿并非易事"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "你和[visiting_associate.GetName]并没有理解这些算式"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "谈判技巧太过复杂，你难以理解"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "教导的东西没人听进去。"
 gdp_visit_holding_decision_event.1113.a: "“我能和[visiting_associate.GetNameNoTooltip]多待一段时间吗？”"
 gdp_visit_holding_decision_event.1113.a.child: "这些教导将提升[visiting_associate.GetNamePossessive]的教育成果"
 gdp_visit_holding_decision_event.1113.b: "“请为[visiting_associate.GetFirstNameNoTooltip]就此事多作讲解。”"
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName]将给[visiting_associate.GetNameNoTooltip]多讲讲这方面知识："
 gdp_visit_holding_decision_event.1113.c: "“有意思，我得赶紧记下来！”"
 gdp_visit_holding_decision_event.1113.c.tt: "[guild_master.GetNamePossessive]的知识会帮到[THIS.Char.GetHouse.GetName]商会"
 gdp_visit_holding_decision_event.1113.d: "今天的[guild_master.Custom('highest_skill_noun')]话题就聊到这儿吧。"
 gdp_visit_holding_decision_event.1113.d.tt: "回到行会，看看在[THIS.Char.GetCurrentLocation.GetName]还有什么能做的"
 gdp_visit_holding_decision_event.1300.t: "造访[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]集市"
 gdp_visit_holding_decision_event.1300.asia: "与丝路上所有的集市一样，这里的摊位也琳琅满目，摆满了玉石、丝绸、茶叶等珍品奇货。\n\n拥挤的街道上，一名男子正小心翼翼地卸下一车精致的瓷瓶。一旁，身着艳丽服饰的异域商人逐个摊位仔细查看，迫不及待地想要采购称心的货物。"
 gdp_visit_holding_decision_event.1300.mena_india: "色彩缤纷的织物、纹饰精美的陶器，让原本昏暗的街巷一下子鲜亮起来。空气中飘荡着熏香与香料的芬芳，令人心旷神怡。\n\n角落里，一名小贩正卖力地向路人推销他那做工上乘的铜盘，对方却面露迟疑。现在，正是谈上一笔买卖的时机。"
 gdp_visit_holding_decision_event.1300.default: "生鲜食材的气味在人群中交织弥漫，喧闹声不绝于耳。狭小的广场上，各路小贩竞相叫卖，吆喝声此起彼伏。\n\n“上好的[ROOT.Char.Custom('RegionalDrink')|U]！今日特价，仅此一日！”“新鲜的[ROOT.Char.Custom('RegionalEdibleMeat')]嘞，错过了可就没了！”\n\n"
 gdp_visit_holding_decision_event.monk_hint: "一名男子垂头丧气地离开附近的茶馆，嘴里念叨着什么不祥之兆。显然，里面有人在算命。"
 gdp_visit_holding_decision_event.monk_hint_return: "茶馆现在安静多了，但那算命的僧人还未离去。"
 gdp_visit_holding_decision_event.caravaneer_hint: "一队队饱经风霜的商队挤满了街道，当地的马厩根本应付不过来这波新涌来的贸易人流。"
 gdp_visit_holding_decision_event.caravaneer_hint_return: "商队尚未启程。车夫仍与牲畜们在一起静候着。"
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\n有传言说，一位经验丰富的船长今天要用他的船接载乘客。"
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\n船长仍在接载乘客，船边的人群也未散去。"
 gdp_visit_holding_decision_event.carnival_jester_hint: "我无意中听到一位同行商人抱怨，说有个街头艺人抢走了他常客的注意力。"
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "街头艺人依然吸引着人群，附近的商人因此愈发不悦。"
 gdp_visit_holding_decision_event.cook_hint: "我注意到很多人手里拿着[ROOT.Char.Custom('FavoriteTreat')]走来走去。我听见其中一个人说，有个面包师正在免费分发食物。"
 gdp_visit_holding_decision_event.cook_hint_return: "面包师还没有收摊。"
 gdp_visit_holding_decision_event.1300.desc.fallback: "钱币与商品快速易手，市场机遇无限。"
 gdp_visit_holding_decision_event.1300.a: "去听听异域商人带来了什么消息？"
 gdp_visit_holding_decision_event.1300.a.tt: "偷听商人谈话可能提供以下机会：$gdp_visit_holding_decision_effect_contracts$"
 gdp_visit_holding_decision_event.1300.a.cooldown.tt: "你最近生成过合同——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1310_has_created_contract_recently') )]后再试"
