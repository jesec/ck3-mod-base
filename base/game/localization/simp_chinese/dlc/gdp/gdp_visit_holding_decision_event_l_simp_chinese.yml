 gdp_visit_holding_decision_event.1320.t_docks: "$gdp_visit_holding_decision_event.1400.t$：招募人手"
 gdp_visit_holding_decision_event.1320.desc: "放眼望去，我发现三位有潜力的候选人！"
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "人群聚拢过来，被银光闪动迷住了眼。[ROOT.Char.GetNamePossessive]的戏法让他们排起长队，像待宰的羔羊。"
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "[ROOT.Char.GetFirstName]身着磨损铠甲，魁梧的身躯倚靠在墙边，百无聊赖地翻转着手中的匕首。"
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName]逐一检查看台，并在[ROOT.Char.GetHerHis]的随身账本上仔细记录着细节。"
 gdp_visit_holding_decision_event.1320.traveler.desc: "身着异族服饰的[ROOT.Char.GetFirstName]，用磕磕绊绊的[ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]试图调解两名商人之间的冲突！"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName]潜伏在阴影中，一手抱着襁褓中的婴儿，另一只手摊开伸出，寻找下一个毫无防备的目标。"
 gdp_visit_holding_decision_event.1320.herbalist.desc: "[ROOT.Char.GetFirstName]蹲伏在一名受伤的商队成员身旁，迅速用附近的野草调制出疗伤药膏。"
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip]似乎很有趣。"
 gdp_visit_holding_decision_event.1320.option.tt: "你可以通过以下方式将[THIS.Char.GetFirstName]招募为[associate|E]："
 gdp_visit_holding_decision_event.1320.no_gold.tt: ""
 gdp_visit_holding_decision_event.1320.option.money.tt: "$BULLET$支付@gold_icon![gold|E]"
 gdp_visit_holding_decision_event.1320.charlatan.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$通过一项@skill_intrigue_icon![intrigue|E][skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.hired_muscle.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$通过一项@skill_prowess_icon![prowess|E]和@skill_martial_icon![martial|E][skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.numerate.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$通过一项@skill_stewardship_icon![stewardship|E][skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.traveler.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$通过一项@skill_diplomacy_icon![diplomacy|E][skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.urchin.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$通过一项@skill_intrigue_icon![intrigue|E][skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.herbalist.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$通过一项@skill_learning_icon![learning|E][skill_challenge_no_prefix|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip]看起来很有前途。"
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip]引起了我的注意。"
 gdp_visit_holding_decision_event.1320.d: "没有能让我看上眼的……"
 gdp_visit_holding_decision_event.1320.d.tt: "回到集市，看看在[THIS.Char.GetCurrentLocation.GetName]还有什么能做的"
 gdp_visit_holding_decision_event.1320.e: "没有能让我看上眼的……"
 gdp_visit_holding_decision_event.1320.e.tt: "回到码头，看看在[THIS.Char.GetCurrentLocation.GetNameNoTooltip]还有什么能做的。"
 gdp_visit_holding_decision_event.1320.tt: "回去看看有没有其他有趣的招募对象"
 gdp_visit_holding_decision_event.1321.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1321.t: "江湖骗子"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName]招手示意我上前。[charlatan_recruit.GetSheHe]大手一挥，高声对人群宣布：\n\n“哟，看来又有一位观众要参与互动了！请这位朋友猜猜，待会儿硬币落地会是哪一面。猜对了的话，少不了丰厚奖励。”\n\n说罢，[charlatan_recruit.GetSheHe]手腕轻轻一转，硬币霎时不见踪影。围观的人们屏息静待，所有的目光都聚焦到了我身上。"
 gdp_visit_holding_decision_event.1321.a: "你的袖子里#EMP 肯定#!藏了枚假硬币。"
 gdp_visit_holding_decision_event.1321.a.success: "你成功戳穿了对方的把戏"
 gdp_visit_holding_decision_event.1321.a.failure: "你未能识破对方的把戏"
 gdp_visit_holding_decision_event.1321.b: "手法倒是精妙，你应该为我工作。"
 gdp_visit_holding_decision_event.1321.b.tt: "招募[charlatan_recruit.GetFirstNameNoTooltip]需要花费@gold_icon![charlatan_recruit_cost|V0][gold|E]，$gdp_visit_holding_decision_event.1320.no_gold.tt$"
 gdp_visit_holding_decision_event.1321.c: "我没空陪你玩这些把戏……"
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1322.t: "彪悍无赖"
 gdp_visit_holding_decision_event.1322.desc: "我刚靠近[hired_muscle_recruit.GetFirstName]，就感受到[hired_muscle_recruit.GetHerHis]警惕的目光在我身上来回扫视。\n\n“你知不知道自己在看谁？我可是[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]无人能敌的打架高手。像你这样的[hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)]，也配来挑战我？”\n\n说完，[hired_muscle_recruit.GetSheHe|U]攥紧拳头，摆出一副跃跃欲试的架势。"
 gdp_visit_holding_decision_event.1322.a: "我要让[hired_muscle_recruit.GetHerHim]收回大话！"
 gdp_visit_holding_decision_event.1322.a.success: "你击败了[hired_muscle_recruit.GetFirstName]"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName]打趴了你"
 gdp_visit_holding_decision_event.1322.b: "不如为我而战。"
 gdp_visit_holding_decision_event.1322.b.tt: "招募[hired_muscle_recruit.GetFirstNameNoTooltip]需要花费@gold_icon![hired_muscle_recruit_cost|V0][gold|E]，$gdp_visit_holding_decision_event.1320.no_gold.tt$"
 gdp_visit_holding_decision_event.1322.c: "我想我该走了……"
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1323.t: "精算之士"
 gdp_visit_holding_decision_event.1323.desc: "[numerate_recruit.GetFirstName]正埋头翻阅账簿，直到我走近，[numerate_recruit.GetSheHe|U]才抬起头来，眼中带着思索的神色。\n\n“你看起来像是个能干的[ROOT.Char.GetWomanMan]，能不能帮我看看这笔账目？”\n\n[numerate_recruit.GetSheHe]边说边将账本摊到我面前，上面密密麻麻写满了数字和计算过程，像是一份记录摊位收支的流水账。"
 gdp_visit_holding_decision_event.1323.a: "试试调整这里的数字……"
 gdp_visit_holding_decision_event.1323.a.success: "你理清了这份账目"
 gdp_visit_holding_decision_event.1323.a.failure: "你没能理清这份账目"
 gdp_visit_holding_decision_event.1323.b: "要不要来为#EMP 我#!的商会打理账目？"
 gdp_visit_holding_decision_event.1323.b.tt: "招募[numerate_recruit.GetFirstNameNoTooltip]需要花费@gold_icon![numerate_recruit_cost|V0][gold|E]，$gdp_visit_holding_decision_event.1320.no_gold.tt$"
 gdp_visit_holding_decision_event.1323.c: "让我再想想……"
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1324.t: "老练的旅行者"
 gdp_visit_holding_decision_event.1324.desc: "两位商人之间的紧张气氛已到沸点。[traveler_recruit.GetFirstName]努力用安抚的姿态缓和冲突。尽管[traveler_recruit.GetHerHis]的[ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]说得很蹩脚，[traveler_recruit.GetSheHe]还是取得了一些成效。对于一个明显不熟悉当地文化的人来说，这努力值得赞赏。\n\n然而，两位商人都无法确定[traveler_recruit.GetSheHe]指的是质量、货物，还是完全别的什么，争吵陷入了僵局。"
 gdp_visit_holding_decision_event.1324.a: "“让我来试着调解。”"
 gdp_visit_holding_decision_event.1324.a.success: "你的解释令人信服"
 gdp_visit_holding_decision_event.1324.a.failure: "你的打扰不受欢迎"
 gdp_visit_holding_decision_event.1324.b: "我能用得上你的能力。"
 gdp_visit_holding_decision_event.1324.b.tt: "招募[traveler_recruit.GetFirstNameNoTooltip]需要花费@gold_icon![traveler_recruit_cost|V0][gold|E]，$gdp_visit_holding_decision_event.1320.no_gold.tt$"
 gdp_visit_holding_decision_event.1324.c: "我懒得理……"
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1325.t: "流浪儿"
 gdp_visit_holding_decision_event.1325.desc: "这种把戏我见得多了，所以我小心地靠近那个[urchin_recruit.Custom('GirlBoy')]。还没来得及开口，一只瘦弱的手臂就把一个小包塞进我手里。\n\n“求求您，好心人，能给我和这孩子一点吃的吗？”\n\n[urchin_recruit.GetHerHis|U]另一只手已经在偷偷摸索我的钱袋。小包滑落，掉在地上，里面是三块石头，果然不出我所料。虽然是个显而易见的骗局，但也算胆大。"
 gdp_visit_holding_decision_event.1325.a: "马上把那只手从我包里伸出来！"
 gdp_visit_holding_decision_event.1325.a.success: "你抓到了窃贼"
 gdp_visit_holding_decision_event.1325.a.failure: "你太慢了"
 gdp_visit_holding_decision_event.1325.b: "我的商会用得上这样的人。"
 gdp_visit_holding_decision_event.1325.b.tt: "招募[urchin_recruit.GetFirstNameNoTooltip]需要花费@gold_icon![urchin_recruit_cost|V0][gold|E]，$gdp_visit_holding_decision_event.1320.no_gold.tt$"
 gdp_visit_holding_decision_event.1325.c: "够了！"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1326.t: "草药师"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName]并没有理会我的靠近。[herbalist_recruit.GetSheHe|U]正出神地看着研杵将药材碾成糊状。\n\n“加一点[ROOT.Char.Custom('Abortifacient')]，或许再来点[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]，然后用[ROOT.Char.Custom('RegionalDrink')]煎煮。对……应该能奏效，你觉得呢？”\n\n[herbalist_recruit.GetSheHe]几乎没把我当回事，转身把研钵凑到我鼻子前，一股刺鼻的气味扑面而来。"
 gdp_visit_holding_decision_event.1326.a: "#EMP 嗯#!，也许再加点[ROOT.Char.Custom('Abortifacient')]？"
 gdp_visit_holding_decision_event.1326.a.success: "你的意见很有帮助"
 gdp_visit_holding_decision_event.1326.a.failure: "你的意见毫无帮助"
 gdp_visit_holding_decision_event.1326.b: "我用得上你的能力。"
 gdp_visit_holding_decision_event.1326.b.tt: "招募[herbalist_recruit.GetFirstNameNoTooltip]需要花费@gold_icon![herbalist_recruit_cost|V0][gold|E]，$gdp_visit_holding_decision_event.1320.no_gold.tt$"
 gdp_visit_holding_decision_event.1326.c: "我想这不适合我。"
 gdp_visit_holding_decision_event.1330.t: "僧人"
 gdp_visit_holding_decision_event.1330.desc: "在当地茶室的一个安静角落，我看见一位僧人正借着烛光，在面前的桌案上用蓍草占卜。察觉到我的兴趣。[monk.GetHerHis]抬眼看向我。\n\n“朋友，你相信神谕吗？只要你心怀坦诚，道会向你展现诸多启示。”"
 gdp_visit_holding_decision_event.1330.desc_returned_01: "茶馆比先前更加冷清。[monk.GetFirstName]仍坐在那里，面前摊开着蓍草，烛火已燃得更低。\n\n[monk.GetSheHe|U]没有抬头。"
 gdp_visit_holding_decision_event.1330.desc_returned_02: "我回来时，[monk.GetFirstName]正将茎秆扫回布兜。蜡烛快要熄灭了。\n\n“很执着，”[monk.GetSheHe]说道，“道并不介意第二次造访。而你呢？”"
 gdp_visit_holding_decision_event.1330.a: "我的商会需要一位博学的同伴。"
 gdp_visit_holding_decision_event.1330.a.tt: "招募[monk.GetFirstNameNoTooltip]需要@gold_icon![monk_recruit_cost|V0][gold|E]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "告诉我你在研究什么。"
 gdp_visit_holding_decision_event.1330.c: "我对上天的事略知一二。"
 gdp_visit_holding_decision_event.1330.c.success: "你给[monk.GetFirstNameNoTooltip]留下深刻印象"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName]转身离去，不为所动"
 gdp_visit_holding_decision_event.1330.d: "或许下次吧。"
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1333.t: "经验丰富的商队首领"
 gdp_visit_holding_decision_event.1333.desc: "单峰驼挤在围栏里仅有的一点遮蔽处里。驼群里时不时传来咕哝声、蹄子跺地的声响，还有……#EMP 呼噜声#!？\n\n我凑近看，发现一个商队伙计靠着自己的鞍囊睡着了。[caravaneer.GetSheHe|U]被我的脚步声惊醒，迅速起身，擦擦[caravaneer.GetHerHis]脸上的口水。\n\n[caravaneer.GetHerHis]解释道：“我可以保证，马厩主人知道我在这里。我从不离开我的牲口，为了它们的安全，也好让我自己安心。”"
 gdp_visit_holding_decision_event.1333.desc_returned_01: "单峰骆驼仍紧紧挤在围栏里。这一回[caravaneer.GetFirstName]醒着，一只手正沿着马肚鞍带往下摸。\n\n[caravaneer.GetSheHe|U]回头瞥了一眼。“又是你。”"
 gdp_visit_holding_decision_event.1333.desc_returned_02: "围栏里传来一声哼响，接着是[caravaneer.GetFirstNamePossessive]的声音：“如果你这么喜欢看动物，那可要另收费。”\n\n[caravaneer.GetSheHe|U]现在坐在鞍囊上，衣着整齐，等着看我想说什么。"
 gdp_visit_holding_decision_event.1333.a: "“我会保护你的牲畜。”"
 gdp_visit_holding_decision_event.1333.a.tt: "招募[caravaneer.GetFirstNameNoTooltip]需要@gold_icon![caravaneer_recruit_cost|V0][gold|E]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "“路上有什么消息？”"
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "你近期询问过道路的事——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]后再尝试"
 gdp_visit_holding_decision_event.1333.c: "“我对组织商队还是略知一二的……”"
 gdp_visit_holding_decision_event.1333.c.success: "你给[caravaneer.GetFirstNameNoTooltip]留下深刻印象"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName]带着[caravaneer.GetHerHis]的牲畜离开了。"
 gdp_visit_holding_decision_event.1333.d: "或许下次吧。"
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$："
 gdp_visit_holding_decision_event.1334.t: "海员"
 gdp_visit_holding_decision_event.1334.desc: "码头边挤满了人，男男女女围在一个饱经风霜的水手身旁，希望能搭上[sea_captain.GetHerHis]的船出海。\n\n我撞见两个路人在窃窃私语：“我们来晚了！[sea_captain.GetTitledFirstName|U]的船上没有空位给我们了。”他们没去找别的水手，而是选择等[sea_captain.GetHerHis]下次返航。\n\n这[sea_captain.GetWomanMan]到底是谁？也许[sea_captain.GetHerHis]的木腿里面，正有#EMP 金币#!叮当作响？"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "围在[sea_captain.GetFirstName]身边的人群已经散了。[sea_captain.GetSheHe|U]正把硬币一枚一枚塞进自己的木腿里，最后几个求[sea_captain.GetHerHis]办事的人也陆续离开。\n\n[sea_captain.GetSheHe|U]甚至懒得转身。“没想到还能再见到你。”"
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName|U]正挥手让一个迟到者去另一艘船。[sea_captain.GetSheHe]转身的时候，木腿在木板上敲出声响。\n\n“这么快就回来了。你是想要个铺位，还是冲着我来的？”"
 gdp_visit_holding_decision_event.1334.a: "“我可以付双倍价，比这里的任何人都多。”"
 gdp_visit_holding_decision_event.1334.a.tt: "招募[sea_captain.GetFirstNameNoTooltip]需要@gold_icon![sea_captain_recruit_cost|V0][gold|E]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "“跟我说说你的故事怎么样？”"
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "你近期听过船长的故事——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]后再尝试"
 gdp_visit_holding_decision_event.1334.c: "“货物买卖是门利润高得多的生意。”"
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip]被说服"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName]开船离开"
 gdp_visit_holding_decision_event.1334.d: "或许下次吧。"
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1335.t: "嘉年华小丑"
 gdp_visit_holding_decision_event.1335.desc: "一群看得入神的观众围在街角表演的[carnival_jester.GetWomanMan]身边，连附近摊位的买家都被吸引过来，市场的买卖陷入停顿。\n\n表演者张开[carnival_jester.GetHerHis]的手臂喊道：“看看这里，之前有人说我的把戏只在光线昏暗的嘉年华里才能演成。我和你们不一样，根本用不着躲在任何面具后面。”"
 gdp_visit_holding_decision_event.1335.desc_returned_01: "同一个角落，人群稀落了些。[carnival_jester.GetFirstName]结束了一轮表演，看见了我，于是张开双臂，好像我是表演的一部分。\n\n“要我再来一段？”"
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName]正把[carnival_jester.GetHerHis]的道具包进一块布里。\n\n“我开始觉得，你其实是冲着我来的。”"
 gdp_visit_holding_decision_event.1335.a: "“我的商会正需要你这样机敏的人才。”"
 gdp_visit_holding_decision_event.1335.a.tt: "招募[carnival_jester.GetFirstNameNoTooltip]需要@gold_icon![carnival_jester_recruit_cost|V0][gold|E]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "“多给我讲讲这些嘉年华的事。”"
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "你近期询问过嘉年华的事——[GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]后再尝试"
 gdp_visit_holding_decision_event.1335.c: "“你犯不着再证明你的本事了。”"
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip]被说服"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName]收拾行装离开了"
 gdp_visit_holding_decision_event.1335.d: "或许下次吧。"
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$："
 gdp_visit_holding_decision_event.1336.t: "面包师"
 gdp_visit_holding_decision_event.1336.desc_intro: "新鲜出炉的[ROOT.Char.Custom('FavoriteTreat')]甜香从附近的市场摊位飘来。一篮篮烘焙好的食物堆满了所有能放东西的地方。\n\n开店的[cook.GetWomanMan]站在一旁，双手按着脑袋。看见我之后，[cook.GetSheHe]开口说道，"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "“我过去给[local_noble.GetTitledFirstNameNoTooltip]效力，现在[local_noble.GetSheHe]说要‘注意身材’，就用不着我了。”[cook.GetSheHe|U]咬了咬嘴唇，“或许像你这样的商人能把这些点心转手卖掉。至于我……一天的时间实在不够用。”"
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "“庄园不派人来收我的货。我手里的东西多到根本卖不完！”"
 gdp_visit_holding_decision_event.1336.desc_returned_01: "摊位上还留着[ROOT.Char.Custom('FavoriteTreat')]的香味。[cook.GetFirstName]正给一个没付钱的陌生人打包另一份点心。\n\n[cook.GetSheHe|U]看见我，叹了口气：“庄园还是没派人来。我总不能一直这么白送下去。”"
 gdp_visit_holding_decision_event.1336.desc_returned_02: "现在篮子已经空了许多。[cook.GetFirstName]靠在柜台上，袖子沾着面粉，看着最后几条面包被人拿走。\n\n“要是你需要一个面包师，”他说，“趁我收摊之前告诉我。”"
 gdp_visit_holding_decision_event.1336.a: "“我的商会有很多张嘴要喂饱。”"
 gdp_visit_holding_decision_event.1336.a.tt: "招募[cook.GetFirstNameNoTooltip]需要@gold_icon![cook_recruit_cost|V0][gold|E]"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
