 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.b: "让我看看你是如何维持商会供给的。"
 gdp_visit_holding_decision_event.1336.c: "让我们看看谁更了解厨房。"
 gdp_visit_holding_decision_event.1336.c.success: "你给[cook.GetFirstNameNoTooltip]留下了深刻印象"
 gdp_visit_holding_decision_event.1336.c.failure: "[cook.GetFirstName]收起摊位离开了"
