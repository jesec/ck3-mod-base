 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$：寻找商机"
 gdp_visit_holding_decision_event.1310.desc: "近来关于奇珍异兽的传闻不绝于耳。今天我决定去集市转转，看能否打探到更多消息。\n\n人群中，我注意到一个口音奇特的外乡人。[foreigner.GetSheHe|U]正对一位兴致索然的本地商贩滔滔不绝，大肆吹嘘自己在远方的游历经历。这个[foreigner.GetWomanMan]或许只是在夸夸其谈，但传闻也未必全是空穴来风。说不定花上几枚金币，就能让[foreigner.GetHerHis]吐露些细节……"
