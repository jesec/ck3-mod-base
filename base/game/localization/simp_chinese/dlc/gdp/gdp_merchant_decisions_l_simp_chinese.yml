 craft_artifact_scheme.1000.t: "$craft_artifact$：成功"
 craft_artifact_scheme.1000.intro.curio: "一夜又一夜，我在作坊中度过，身边有一位伙计或当地行会的[ROOT.Char.GetWomanMan]，制作某件作品。"
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\n但今天，我终于可以说所有努力都得到了回报！端详这件作品，我劳作留下的每一道痕迹都唤起微笑，我唯一的念头是把它骄傲地展示在哪里。"
 craft_artifact_scheme.1000.intro.library: "一夜又一夜，我弓身于书房，沾满墨水的手忍着书写痉挛涂写，灯芯渐短。"
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\n但今天，我终于可以说所有努力都得到了回报！翻阅这件作品，每一段都唤起微笑，我唯一的念头是别人读到它的涂鸦。"
 craft_artifact_scheme.1000.desc.curator: "\n\n我的保管员，[curator.GetFirstNamePossessive]眼睛亮了起来，检查作品。“这是一项#EMP 真正的#!成就，[ROOT.Char.GetTitleAsNameNoTooltip]。”"
 craft_artifact_scheme.1000.a: "值得这番努力。"
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\n由[ROOT.Char.GetPrimaryTitle.GetName|l]的[ROOT.Char.GetTitledFirstName]制作。"
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\n由[ROOT.Char.GetPrimaryTitle.GetName|l]的[ROOT.Char.GetTitledFirstName]撰写。"
 craft_artifact_scheme.2000.t: "$craft_artifact$：失败"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\n每一次尝试将我的想法变为现实，都因计算失误或理解偏差而受挫，房间里散落着被遗弃的尝试的骸骨，它们甚至无法被改作他用……"
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\n每天早晨，废弃的写作碎片散落一地，而我保留的少数几篇都以某种方式未能实现我意图的广度……"
 craft_artifact_scheme.2000.desc.curator: "\n\n我的保管员，[curator.GetFirstName]，叹息着看我劳动的微薄成果。“也许是时候承认失败了？”"
 craft_artifact_scheme.2000.a: "我对此感到厌倦……"
 craft_artifact_scheme.2000.b: "……但我的作品不能白费！"
