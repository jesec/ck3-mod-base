 gdp_decision.3010.t: "[sponsored_courtier.GetNameNoTooltip]的商会"
 gdp_decision.3010.desc: "“我很荣幸你愿意把这份责任交给我！我会让你的每一枚[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]都花得值得。”\n\n[sponsored_courtier.GetNameNoTooltip]显得热情满满。[sponsored_courtier.GetSheHe]在走进这间屋子之前，绝对想不到自己会成为我信赖的商人。\n也许吸引[sponsored_courtier.GetHerHis]的，更多是那笔启动资金，以及能亲手用这笔钱建立起属于自己的商会，而不是实现什么毕生抱负。"
 gdp_decision.3010.a: "我会给你足够的资金。"
 gdp_decision.3010.b: "我会提供所有基本费用。"
 gdp_decision.3010.c: "一大笔资金将确保成功。"
 gdp_decision.3010.d: "我们将不惜代价！"
 gdp_decision.3010.e: "我们可以再考虑一下。"
