l_simp_chinese:
 gdp_repudiate_usurious_loan_decision: "谴责有息贷款"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip]公开写下了带利息的债券，而我们的[ROOT.Char.GetRite.PriestNeuterPlural]认为这类契约对任何人都没有约束力。应当让这笔债务被废除，而非偿还。\n\n这不是盗窃，这是[ROOT.Char.GetRite.GetAdjectiveNoTooltip]法律。不过无论如何，从此地到海边的每个商人都会称之为盗窃。"
 gdp_repudiate_usurious_loan_decision_tooltip: "让你的[clergy|E]以[usury|E]为由废除债务，保留[gold|E]，代价是你在[merchants|E]中的名声"
 gdp_repudiate_usurious_loan_decision_confirm: "在罪恶中订立的契约不能约束我！"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "你无力偿还这笔[loan|E]"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "你最近没有谴责过[creditor|E]"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon!#X [merchants|E]在可预见的未来不太愿意向你提供信贷#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "你的[rite|E]必须将这笔贷款视为罪恶，并且你[faith|E]的一位[clergy|E]统治者必须离得足够近，才能废除它：其[rite|E]同意，不是你的[creditor|E]或[rival|E]，且未与你交战\n#weak 你的[head_of_faith|E]，你首都或你所在地的[clerical_region|E]持有者，或你[top_liege_possessive|E]领地内的任何[clergy|E]。#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "你的[Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E]必须支持你：对你持有#P 正面#![opinion|E]，或作为被你持有[strong_hook|E]的[puppet|E]"
 become_merchant_decision: "成为商人"
 become_merchant_decision_desc: "在宫廷担任职务，要是连人情世故都不懂，那又有什么用？出国游历，将不同的国度联结在一起——这些念头太强烈了，根本压不住。"
 become_merchant_decision_tooltip: "放弃你的[titles|E]，建立一家[merchant|E][company|E]"
 become_merchant_decision_confirm: "现在是做生意的时候了！"
 become_merchant_decision_house_head_tt: "你必须是[house_head|E]"
 gdp_recently_became_adventurer_decision_cooldown_tt: "你已作为[adventurer|E]#V 5年#!"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U]将不再欠[repudiated_lender.GetShortUIName][repudiating_borrower.GetHerHisYour]的贷款"
 abuse_charter_authority_decision: "滥用特许状权威"
 abuse_charter_authority_decision_tooltip: "利用你的[charter|E]获取[gold_i|E][gold|E]并提高你的[competitiveness_i|E][competitiveness|E]"
 abuse_charter_authority_decision_desc: "我持有一份来自[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]的特许状，[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]的意志等同于法律。有领地的君主在我们身后，没人敢妨碍我们的利益。"
 abuse_charter_authority_decision_confirm: "我以[ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]之名行事！"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "[gurkhan_possessive|E]的权威在这里不被认可"
 abuse_charter_authority_decision.region_already_abused: "这些土地已经目睹了[gurkhan_possessive|E]权威的滥用"
 abuse_charter_authority_decision.nothing_to_abuse: "该[location|E]没有可以滥用的土地"
 gdp_charter_abused_market_modifier: "滥用特许状权威"
 gdp_charter_abused_market_modifier_desc: "该角色滥用了特许状赋予的权威为自己的商会谋取利益。"
 gdp_charter_abused_market_county_modifier: "滥用特许状权威"
 gdp_charter_abused_market_county_modifier_desc: "该伯爵领已被某商会利用其特许状大肆盘剥以中饱私囊。"
 gdp_charter_leveraged_market_modifier: "被特许经营者排挤"
 gdp_charter_leveraged_market_modifier_desc: "该角色的商会因敌对势力持有统治者颁发的特许状而衰落。"
 gdp_charter_charitable_market_county_modifier: "特许发展"
 gdp_charter_charitable_market_county_modifier_desc: "该伯爵领已由一家商会利用其特许状直接介入开发。"
 gdp_decision.1000.t: "庇护者的愠怒"
 gdp_decision.1000.desc: "一名信使从[patron.GetTitledFirstNameNoTooltipRegnal]的大厅带来消息，有人在那里控诉我商会的恶行，我的庇护者面无表情地听着。\n\n据说治安官们逐项列出了我们不当行为的指控，而[patron.GetTitleAsNameNoTooltip]也逐渐对我产生了反感。\n\n我的庇护者现在要求我立即回应，解释我们的所作所为……"
 gdp_decision.1000.a: "“我接受审判。”"
 gdp_decision.1000.b: "“想必你明白，我这么做是为了领地……”"
 gdp_decision.1000.b.success: "你的庇护者大发慈悲"
 gdp_decision.1000.b.failure: "你的庇护者出离愤怒"
 gdp_decision.1000.a.effects: "你的[merchant_patron|E]获得针对你的[imprisonment_reason|E]和[execute_reason|E]"
 gdp_decision.1000.a.severe_effects: "你的[merchant_patron|E]获得针对你和你的[close_family_members|E]的[imprisonment_reason|E]和[execute_reason|E]"
 gdp_decision.1000.a.survived_patrons_wrath: "尽管你躲过了[merchant_patron_possessive|E]的怒火，但你将无法再次滥用其权威"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "身为[ROOT.Char.GetTitleAsNameNoTooltip]，[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]的商人们都以我的名义行事，而那些持有我印章特许状的人更是如此。\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$可看来有这么个小贩，[merchant.GetName]，利用了我的仁慈，拿着特权中饱私囊，以民众为代价来让[merchant.GetHerHis]自己发财。\n\n这种放肆行为确实令人愤怒，但我还得权衡一下这类商人给领地带来的好处。"
 gdp_decision.1010.a: "[merchant.GetSheHe|U]要为此负责！"
 gdp_decision.1010.a.tt: "如果[merchant.GetShortUIName]被[imprisoned|E]，其他拥有你的[charters|E]的[clients|E]将更不敢滥用你的权威"
 gdp_decision.1010.b: "我暂且放过此事……"
 gdp_decision.1010.c: "谈论这些杂货商之事有失我身份。"
 gdp_decision.1010.c.flavor: "此后滥用权威的行为仍会发生，但你将不会再收到通知"
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]……？我没给过特许状！"
 gdp_decision.1020.t: "以[patron.GetTitleAsNameNoTooltip]之名"
 gdp_decision.1020.opening: "只需稍稍挥动我的特许状，[market_province.GetBaronyNameExplicitly]的大门和官员的办公室就以[patron.GetTitledFirstName]的名义打开了。\n\n"
 gdp_decision.1020.market_holder: "当地的大人物[market_holder.GetTitledFirstName]已经明确表示了[market_holder.GetHerHis]的不满，[market_holder.GetHerHis]咆哮着说[patron.GetTitleAsNameNoTooltip]会知晓此事，但这毫无用处。这份文件没有争议。\n\n"
 gdp_decision.1020.closing: "商会代理人可以获取市场设施，在没有适当文件的情况下扣押任何货物，用虚假的索赔和指控给我们的竞争对手找麻烦，只需要我乐意。"
 gdp_decision.1020.a: "没有人能挡我的路。"
 gdp_decision.1020.b: "我们应该算[market_holder.GetTitledFirstNameNoTooltip]一份。"
 gdp_decision.1020.c: "我改变主意了。"
 gdp_decision.1020.d: "“我的#EMP 检查#!结束了。这一次……”"
 gdp_decision.1020.b.success: "这件事未被透露给[patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1020.b.failure: "[patron.GetTitleAsNameNoTooltip]得知了这次滥用行为"
 benevolent_charter_authority_decision: "指导地方投资"
 benevolent_charter_authority_decision_tooltip: "利用你的[charter|E]开发[building_i|E][building|E]并提高当地[prosperity_i|E][prosperity|E]"
 benevolent_charter_authority_decision_desc: "拥有[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]的特许，我有权在寻常商会的职权范围外进行直接干预。"
 benevolent_charter_authority_decision_confirm: "以[ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip]的名义能做许多善事。"
 merchant_charter_intervention_county_cooldown: "过去#V 5#!年内未在[THIS.Char.GetDomicile.GetLocation.GetName]进行干预#!"
 gdp_decision.1200.t: "庇护者的欣慰"
 gdp_decision.1200.desc: "消息从[patron.GetTitledFirstNameNoTooltipRegnal]的厅堂传来，在那里，我的商会的自发行动在我欣喜的庇护者面前得到了高度赞扬。\n\n几位见证者对[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]及其近期的干预大加赞赏。\n\n因此，[patron.GetTitleAsNameNoTooltip]向商会送来信息：“干得好[ROOT.Char.GetTitledFirstNameNoTooltip]，你的努力为领地增光添彩！”"
 gdp_decision.1200.a: "“商会乐于服务。”"
 gdp_decision.1200.b: "“口头认可当然好，物质激励也重要。”"
 gdp_decision.1200.b.flavor: "恕我直言……"
 gdp_decision.1200.b.success: "你的庇护者很慷慨"
 gdp_decision.1200.b.failure: "你的庇护者很失望"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$看起来有这么个小贩，[merchant.GetName]，使用了[merchant.GetHerHis]被授予的特权为领地谋福，投资了[market_province.GetBaronyNameExplicitlyNoTooltip]的开发！\n\n这种立功行为值得称赞，不过提供激励也许会鼓励更多善举。"
 gdp_decision.1210.a: "应该鼓励这种积极性。"
 gdp_decision.1210.a.tt: "其他拥有你的[charters|E]的[clients|E]将更愿意善意地行使你的权威"
 gdp_decision.1210.b: "[ROOT.Char.GetFaith.HighGodName]啊，也许诚实的商人#EMP 真的#!存在！"
 gdp_decision.1210.c: "别拿这种破事烦我。"
 gdp_decision.1210.c.flavor: "此后善意行使权威的行为仍会发生，但你不会再收到通知"
 gdp_decision.1220.t: "以[patron.GetTitleAsNameNoTooltip]之名"
 gdp_decision.1220.opening: "我手拿特许状出现在[market_province.GetBaronyNameExplicitly]，起初让当地官员十分惊愕，但我很快就表明了商会的善意。\n\n"
 gdp_decision.1220.market_holder: "当地的大人物[market_holder.GetTitledFirstName]略感兴趣地倾听我的提议，发现这对鼓励[market_holder.GetHerHis]的臣民的生产和商业大有好处。\n\n"
 gdp_decision.1220.closing: "在此地参观时，市民们很快发现并向我们指出了几处明显需要修复和改善的区域。"
 gdp_decision.1220.a: "“那我们还等什么？”"
 gdp_decision.1220.d: "“一切都很好，但其他事务需要……”"
 press_the_advantage_decision: "乘胜追击"
