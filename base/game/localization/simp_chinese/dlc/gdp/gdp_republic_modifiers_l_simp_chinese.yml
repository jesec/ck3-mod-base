 gdp_republic_plaza_chancery_modifier: "文书厅木材"
 gdp_republic_plaza_chancery_modifier_desc: "该角色为档案馆置办齐全，给他们留下多余的木匠、压印机和风干木材，他们正把富余物资用于自家。"
 gdp_republic_plaza_scriptorium_modifier: "储备充足的缮写室"
 gdp_republic_plaza_scriptorium_modifier_desc: "该角色拥有大量优质墨水和颜料，曾供应公社的抄写员。"
 gdp_republic_plaza_magistracy_modifier: "官服"
 gdp_republic_plaza_magistracy_modifier_desc: "该角色自费为城市治安法官提供服装，在任何宣讲法律之处都受到相应问候。"
 gdp_republic_plaza_popular_favor_modifier: "受欢迎的傀儡"
 gdp_republic_plaza_popular_favor_modifier_desc: "该角色是煽动人群的专家，确保每个人都知道是谁的钱支付了他们的便利设施。"
 gdp_republic_plaza_trade_capacity_modifier: "称量并封缄"
 gdp_republic_plaza_trade_capacity_modifier_desc: "该角色的货物过秤毫无争议，且每季都有更大数量转手。"
 gdp_republic_plaza_expertise_modifier: "广场商人"
 gdp_republic_plaza_expertise_modifier_desc: "该角色对城市许多商人有影响力，获得否则需要数十年才能获得的商品和贸易洞察。"
 gdp_republic_plaza_estate_income_modifier: "公共债权人"
 gdp_republic_plaza_estate_income_modifier_desc: "公社欠该角色钱，利息准时到达其账房。"
 gdp_republic_plaza_physician_modifier: "医生恩惠"
 gdp_republic_plaza_physician_modifier_desc: "该角色花钱为城市病房储备草药和药物，确保自己的家庭永不缺其中任何一样。"
 gdp_republic_plaza_hired_swords_modifier: "雇佣兵出纳"
 gdp_republic_plaza_hired_swords_modifier_desc: "该角色确保雇佣连队及时全额领薪，他们记得钱来自哪个钱包。"
 gdp_republic_plaza_organized_worker_modifier: "劳动力组织者"
 gdp_republic_plaza_organized_worker_modifier_desc: "该角色为大规模建设项目组织了劳动力，并从中对随之而来的大规模后勤工作有了深入了解。"
 gdp_republic_civic_works_labor_modifier: "有组织的劳工"
 gdp_republic_civic_works_labor_modifier_desc: "工人已被共和国召集和组织，加速整个首府的建设。"
 gdp_republic_civic_works_materials_modifier: "材料采购"
 gdp_republic_civic_works_materials_modifier_desc: "协调采购和储存建筑材料已降低整个首府的建设成本。"
 gdp_republic_civic_works_amenities_modifier: "公共设施"
 gdp_republic_civic_works_amenities_modifier_desc: "新浴场、喷泉和聚集空间提升了城市人民的情绪。"
 gdp_republic_civic_works_market_modifier: "扩大集市"
 gdp_republic_civic_works_market_modifier_desc: "更大、组织更好的集市区吸引了更多商人，改善了首府的贸易条件。"
 gdp_republic_civic_works_guilds_modifier: "资助工匠行会"
 gdp_republic_civic_works_guilds_modifier_desc: "受赞助的行会为首府带来熟练工匠，推动投资并稳步改善其条件。"
 gdp_republic_civic_works_labor_character_modifier: "劳工网络"
 gdp_republic_civic_works_labor_character_modifier_desc: "为市政工程组织劳动力使这位统治者与整个首府的熟练劳工和承包商建立了联系。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "供应网络"
 gdp_republic_civic_works_materials_character_modifier_desc: "为市政工程采购材料开辟了以优惠价格获得石头、木材和供应的可靠渠道。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "民政赞助人"
 gdp_republic_civic_works_amenities_character_modifier_desc: "资助城市的公共设施为这位统治者在首府人民中赢得了可见的善意。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "市场关系"
 gdp_republic_civic_works_market_character_modifier_desc: "扩大首府集市区使这位统治者与记得恩惠的商人和贸易者建立了联系。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "行会赞助人"
 gdp_republic_civic_works_guilds_character_modifier_desc: "资助手工业行会与城市工匠建立了持久联系，他们的感激反映了这位统治者的地位。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "定居点扩张"
 gdp_republic_civic_works_settlement_modifier_desc: "对首府城市基础设施的投资为更多人腾出空间，他们正在到来。"
 gdp_republic_civic_works_settlement_character_modifier: "城市投资者"
 gdp_republic_civic_works_settlement_character_modifier_desc: "资助共和国首府的扩张使这位统治者对城市如何增长有影响力。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "民政秩序"
 gdp_republic_civic_works_order_modifier_desc: "对守夜人和市政基础设施的投资使首府更有秩序，更易治理。"
 gdp_republic_civic_works_order_character_modifier: "民政权威"
 gdp_republic_civic_works_order_character_modifier_desc: "资助首府的市政秩序为这位统治者赢得了稳定和良好治理的声誉。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "公立学校"
 gdp_republic_civic_works_school_modifier_desc: "该伯爵领已获得大量资金用于建设公立学校。"
 gdp_republic_civic_works_school_character_modifier: "学校赞助人"
 gdp_republic_civic_works_school_character_modifier_desc: "该角色资助了首府学校的建设，为青年提供接受教育和学习的机会。\n[patrician_rating|E]：[EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
