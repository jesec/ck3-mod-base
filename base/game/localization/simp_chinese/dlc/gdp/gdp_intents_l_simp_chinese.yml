l_simp_chinese:
 schmooze_intent: "联谊"
 schmooze_intent_desc: "你试图润滑商业的车轮，提高[competitiveness|E]。"
 gdp_merchant_schmooze_modifier: "与贵族联谊"
 gdp_merchant_schmooze_modifier_desc: "该角色在一次宴会上与该市场的本地商人建立了关系。"
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U]与[TARGET_CHARACTER.GetShortUINameNoTooltip]联谊"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName]抓住机会与[TARGET_CHARACTER.GetShortUINameNoTooltip]联谊"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U]与贵族联谊"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName]抓住机会与贵族联谊"
 gdp_schmooze_events.1000.t: "与[schmoozee.GetFirstNameNoTooltip]联谊"
 gdp_schmooze_events.1000.desc: "我们商人必须抓住一切机会与贵族打交道。凭借一句巧妙的话语或一份精美的礼物，就能确保他们不会阻挠某项事业，也不会去支持竞争对手的生意。\n\n在谄媚逢迎与过于唐突之间小心周旋，我竭尽全力去赢得我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))][schmoozee.GetTitledFirstName]的青睐。"
 gdp_schmooze_events.1000.a: "“好[schmoozee.GetTitleAsNameNoTooltip]，请收下这份礼物。”"
 gdp_schmooze_events.1000.b: "“像我这样卑微的商人，必须仰仗更高阶级。”"
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip]深感荣幸"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip]翻了个白眼"
 gdp_schmooze_events.1000.c: "“与您交谈是我的荣幸。”"
 gdp_schmooze_events.1000.d: "“我有许多配得上[schmoozee.GetTitleAsNameNoTooltip]的商品！”"
 gdp_schmooze_events.1010.t: "良性竞争"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName]与我共餐，轮流吹嘘各自商会的成就，一边品味着[ROOT.Char.Custom('RegionalDrink')]和[ROOT.Char.Custom('GetExpensiveMeal')]，一边谈笑风生。"
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName]与我在一棵[ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')]的树荫下，轮流夸耀各自商会的成就。"
 gdp_schmooze_events.1010.outro: "\n\n尽管我们都在自吹自擂，但显然在许多事情上我们意见一致。这个[schmoozee.GetWomanMan]或许对我有用，而我对[schmoozee.GetHerHim]也是如此。"
 gdp_schmooze_events.1010.a: "“付一笔钱，我就给你腾出些空间。”"
 gdp_schmooze_events.1010.b: "“收下这个，别挡我的路。”"
 gdp_schmooze_events.1010.c: "“你赞美我，我也会赞美你。”"
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip]同意"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip]不感兴趣"
 gdp_schmooze_events.1010.d: "现在不是时候。"
 gdp_schmooze_events.1030.t: "分配精力"
 gdp_schmooze_events.1030.feast: "夜渐渐深了，我发现自己夹在了我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))][schmoozee_1.GetTitledFirstName]与我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))][schmoozee_2.GetTitledFirstName]之间。贵族们一边享用着烤[schmoozer.Custom('GetRegionalFish')]，一边慵懒地辩论着关于商业与中介的假设性原则。"
 gdp_schmooze_events.1030.hunt: "随着狩猎的推进，我发现自己夹在了我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))][schmoozee_1.GetTitledFirstName]与我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))][schmoozee_2.GetTitledFirstName]之间。贵族们一边放任猎犬搜寻气味，一边慵懒地辩论着关于商业与中介的假设性原则。"
 gdp_schmooze_events.1030.outro: "\n\n最终，[schmoozee_1.GetFirstNameNoTooltip]转过身来，要我出面裁定这件事：“来吧，[schmoozer.GetTitledFirstNameNoTooltip]，你毕竟是个商人，总该有自己的见解吧？”"
 gdp_schmooze_events.1030.a: "“您说的很对，好[schmoozee_1.GetTitleAsNameNoTooltip]。”"
 gdp_schmooze_events.1030.b: "“[schmoozee_2.GetTitledFirstNameNoTooltip]讲的有些道理。”"
 gdp_schmooze_events.1030.c: "“你们的见解都启发了我，真的。”"
 gdp_schmooze_events.1030.c.success: "他们很满意"
 gdp_schmooze_events.1030.c.failure: "他们翻了翻白眼"
 gdp_schmooze_events.1030.d: "“我拿不准。”"
 gdp_schmooze_events.1050.t: "市场行动"
 gdp_schmooze_events.1050.feast: "庆典暂时中断，好让宾客们彼此交谈，也让仆人们趁机赶上，"
 gdp_schmooze_events.1050.hunt: "我们停下来探察[ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')]的[ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')]，猎犬和驱赶者冲向前方，"
 gdp_schmooze_events.1050.outro: "我下意识地认出了市场中的那些关键人物。\n\n[schmoozee_1.GetTitledFirstName]是[market_1.GetLocationTitle.GetNameNoTier]值得结识的有用之人，而[schmoozee_2.GetTitledFirstName]在[market_2.GetLocationTitle.GetNameNoTier]同样如此。"
 gdp_schmooze_events.1050.three: "我也看到了[market_3.GetLocationTitle.GetNameNoTier]的[schmoozee_3.GetTitledFirstName]。"
 gdp_schmooze_events.1050.a: "“[schmoozee_1.GetFirstNameNoTooltip]，我一直想和您谈谈！”"
 gdp_schmooze_events.1050.b: "“我听说了非常有趣的事，[schmoozee_2.GetFirstNameNoTooltip]。”"
 gdp_schmooze_events.1050.c: "“啊，[schmoozee_3.GetFirstNameNoTooltip]，让我们谈谈！”"
 gdp_schmooze_events.1050.d: "这些市场目前表现良好。"
 gdp_schmooze_events.1060.t: "争抢关注"
 gdp_schmooze_events.1060.feast: "仆人们穿梭于各餐桌之间，添满酒杯，又端上下一道菜肴，"
 gdp_schmooze_events.1060.hunt: "我们停下脚步，从水囊中喝口水，并伸展一下腿脚，"
 gdp_schmooze_events.1060.outro: "我看到我的竞争对手[rival.GetName]正在无耻地讨好[schmoozee.GetName]。\n\n那个滑头[rival.GetWomanMan]假笑着吹嘘[rival.GetHerHis]的代理人带来的种种好处，同时却把我的伙计贬斥为无赖和吹牛大王！"
 gdp_schmooze_events.1060.a: "“得了吧，你们[rival.GetHouse.GetBaseNameNoTooltip]家可怜的生意简直是个笑话！”"
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip]看着像个蠢货"
 gdp_schmooze_events.1060.a.failure: "你看着像个蠢货"
 gdp_schmooze_events.1060.b: "“别急！我们的账目可靠得很。”"
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip]被说服了"
 gdp_schmooze_events.1060.b.failure: "你的话毫无说服力"
 gdp_schmooze_events.1060.c: "随他们去。"
 activity_used_trade_market_luxury_items_modifier: "社交需求"
 activity_used_trade_market_luxury_items_modifier_desc: "该市场的奢侈品被一名商人转移到一场活动中使用。"
 activity_used_trade_market_comforts_modifier: "社交需求"
 activity_used_trade_market_comforts_modifier_desc: "该市场的舒适品被一名商人转移到一场活动中使用。"
