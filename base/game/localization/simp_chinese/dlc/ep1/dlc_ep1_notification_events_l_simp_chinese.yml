 ep1_notifications.0013.t: "采用了其宫廷语言"
 ep1_notifications.0013.desc: "[target_character.GetShortUINamePossessive]将[target_character.GetHerHis]的[court_language|E]更改为了[target_character.GetCourtLanguage.GetName]无比明智的决定！"
