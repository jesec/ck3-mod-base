 # Invalidation event
 petition_head_of_faith.0601.t: "请愿终止"
 petition_head_of_faith.0601.desc.no_head: "等到我准备呈上陈词时，已再无合适的属灵牧者来受理我的请愿。"
 petition_head_of_faith.0601.desc.head_dead: "[recipient.GetTitledFirstName]还未等到受理我的请愿便已去世。"
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName]已被囚禁，无法接受正式的请愿。"
 petition_head_of_faith.0601.desc.head_changed: "我的信仰领袖发生更替，我的请愿无法再呈递给[recipient.GetTitledFirstName]。"
 petition_head_of_faith.0601.desc.at_war: "在我与[recipient.GetTitledFirstName]交战期间，我无法提出正式请愿。"
 petition_head_of_faith.0601.desc.repentance_resolved: "我已经没有需要撤销的绝罚。"
 petition_head_of_faith.0601.desc.repentance_too_soon: "我刚受训诫不久，此刻的忏悔恐怕不会被倾听。"
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.GetTitledFirstName]还未等到请愿被受理便已去世。"
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName]已不再属于我的信仰，因此无法请求正式的绝罚。"
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName]不再是国王或更高级统治者，因此不在本次正式请愿的范围内。"
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName]已经被绝罚了。"
 petition_head_of_faith.0601.desc.fallback: "我的请愿已无法继续，此行终究一无所获。"
 petition_head_of_faith.0601.desc.refund.piety: "我为这次请愿预定付出的虔诚已经恢复。"
 petition_head_of_faith.0601.desc.refund.none: "至少目前还没有失去任何东西。"
 petition_head_of_faith.0601.a: "就这样吧。"
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "请愿：忏悔"
 petition_head_of_faith.1000.t.excommunication: "请愿：绝罚"
 petition_head_of_faith.1000.desc.court_low_grandeur: "曾经宏伟的宫殿如今已一片狼藉。我祈祷这并非象征[recipient.GetFaith.ReligiousHeadName]的灵性匮乏。\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "这座宫殿以宏伟厅堂闻名，走进去时真的让人自感渺小。我祈祷它那来自天国的鎏金，能映照出内里的公义与灵性富足。\n\n"
 petition_head_of_faith.1000.desc.intro: "天主在地上的代理人端坐于此。"
 petition_head_of_faith.1000.desc.recipient_sinful: "尽管众所周知，[recipient.GetSheHe]犯下了[petition_hof_gravest_sin.GetName(recipient)]的罪，但不知道用了什么魔鬼的手段，[recipient.GetSheHe]还是登上了圣伯多禄的宝座。"
 petition_head_of_faith.1000.desc.recipient_virtuous: "[recipient.GetHerHis]的判断，自然会受[recipient.GetHerHis]天性中的[petition_hof_gravest_virtue.GetName(recipient)]所引导。"
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.GetHerHis|U]每况愈下的健康状况，显然是一生从事高尚劳作的结果。"
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.GetHerHis|U]每况愈下的健康状况，显然是一生毫无节制、肆意挥霍换来的结果。"
 petition_head_of_faith.1000.desc.address: "\n\n我向[recipient.GetHerHim]提出了请求：“神圣的[recipient.GetMotherFather|U]，"
 petition_head_of_faith.1000.desc.repentance: "我怀着谦卑之心前来，恳求解除加于我灵魂之上的惩戒，祈求我能重新被接纳进入信徒的共融中。”"
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName]犯了罪、冒犯了天主。我不过是个卑微的信使；对[petition_target.GetHerHis]不朽灵魂作出判决，自然是您的权力。”"
 petition_head_of_faith.1000.a.argue: "我会陈述我的理由。"
 petition_head_of_faith.1000.a.argue_tt: "在觐见期间尝试说服[recipient.GetShortUINameNoTooltip]"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n“朕已经听到了你的声音，我的孩子。说出你请求的具体内容，朕会带着善意接纳它。”"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n“你的请求已呈到朕面前。朕将按教法和圣教会的要求来判决。”"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n“说些漂亮话并不困难。朕会以主所要求的审慎态度来对待你的请求。”"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n“你贸然前来，未免太过僭越了。好好斟酌你的下一句话。”"
 petition_head_of_faith.1000.desc.conclusion: "[recipient.GetSheHe]说完，满怀期待地等待着。"
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "请愿：[actor.GetTitledFirstNamePossessiveNoTooltip]忏悔"
 petition_head_of_faith.1310.desc.intro: "“[Select_CString( ROOT.Char.IsFemale, '圣母', '圣父' )|U]，我遭受了绝罚，无法领受圣事，也与信徒们隔绝了。我恳求您，解除加于我灵魂上的惩戒，使我重回共融。”跪着的[actor.GetTitledFirstName]说道。\n\n“在天主面前把你的痛悔说明白。”我回应道。"
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n“您曾向我显示过仁慈，[Select_CString( ROOT.Char.IsFemale, '圣母', '圣父' )|U]。我不求世俗的恩惠，只求主和圣教会看到我忏悔的真心。”"
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n“在主面前，我如同任何悔罪者一样站立，只请求教会法之下的公正。”"
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n“不要把我当成[SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )]，用好话引你走偏。我在[ROOT.Char.GetFaith.HighGodName]和祂在世间的代理者面前发誓，我心怀悔意。”"
 petition_head_of_faith.1310.serpent.christian: "园中那条蛇"
 petition_head_of_faith.1310.serpent.generic: "一条蛇"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n“我们在世上曾是敌人。我不求你在世俗的事上为我说好话，但请承认我的补赎，不要危及我的灵魂。”"
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n“我们听闻，你犯下了[petition_gravest_sin.GetName(actor)]。动听的话不能为一个染污的灵魂作答。你提出什么改正？”"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n“小的恶行沾不上你的名声。也许禁令已经起了有益的作用。我们会看看你的灵魂是否配得上你的举止。”"
 petition_head_of_faith.1310.a: "“起来吧，我的孩子。你已恢复与信众的共融。”"
 petition_head_of_faith.1310.b: "“惩戒依然有效。待你悔意昭然时，再行归来。”"
 petition_head_of_faith.1320.t: "请愿：绝罚[petition_target.GetTitledFirstNamePossessiveNoTooltip]"
 petition_head_of_faith.1320.desc.intro: "“[Select_CString( ROOT.Char.IsFemale, '圣母', '圣父' )|U]，[petition_target.GetTitledFirstName]犯了罪、冒犯了天主。如果不把这腐烂割去，我们所有人的灵魂都会受到损害。”[actor.GetTitledFirstName]说。\n\n“我们不会将绝罚当作君主的私人武器。在主面前将你的指控说明白”。我回应道。"
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n“您曾向我显示过公正，[Select_CString( ROOT.Char.IsFemale, '圣母', '圣父' )|U]。我不求世俗的恩惠，只求主和圣教会看到[petition_target.GetTitledFirstNamePossessiveNoTooltip]过犯的真相。"
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n“在主面前，我作为我主耶稣基督的卑微子民提出这项指控，只请求圣教会所要求的公正。"
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n“不要把我当成园中那条用好话解决私人争执的蛇。我在[ROOT.Char.GetFaith.HighGodName]及其在地上的代理者面前起誓，这项指控是公正的。"
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n“我们在世上曾是敌人。但请按照教规的要求衡量[petition_target.GetTitledFirstNamePossessiveNoTooltip]的灵魂。"
 petition_head_of_faith.1320.desc.target_sinful: "[petition_target.GetTitledFirstNamePossessiveNoTooltip]的腐烂源自[petition_target.GetHerHis]本性中的[petition_gravest_sin.GetName(petition_target)]。”"
 petition_head_of_faith.1320.desc.finish: "[actor.GetTitledFirstName]下结论道。"
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNamePossessiveNoTooltip]把[petition_target.GetHerHis]的邪恶隐藏得很好，但我相信若您寻求主的指导，[petition_target.GetHerHis]的罪将会显明。”"
 petition_head_of_faith.1320.a: "“我将[petition_target.GetHerHim]逐出信众的共融。”"
 petition_head_of_faith.1320.b: "“你的论点没有说服力，[petition_target.GetHerHim]不会受到惩戒。”"
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "宣布绝罚"
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName]起身，施行主的公正：\n\n“[petition_target.GetTitledFirstName]被绝罚，[petition_target.GetHerHis]将被逐出信众的身体，灵魂落入危险，直到作出真正的悔改。”"
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName]已通过祂的仆人发声。"
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "请愿被拒"
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName]起身，施行主的公正：\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "“你所列举的罪行尚不足以判处如此严厉的惩罚。[petition_target.GetTitledFirstName]不会被绝罚。”"
 petition_head_of_faith.2030.desc.finesse: "“朕不会为君主的金钱赶走信徒。凯撒的东西买不来[recipient.GetFaith.HighGodName]的审判。”"
 petition_head_of_faith.2030.desc.learning_duel: "“你想用蓄意歪曲的教会法来陷害一位[petition_target.GetTitleAsNameNoTooltip]吗？[petition_target.GetTitledFirstName]不会仅凭你的……学问而被绝罚。”"
 petition_head_of_faith.2030.desc.fallback: "“你未免太过自大了！我看不出有任何理由要将[petition_target.GetTitledFirstName]绝罚。”"
 petition_head_of_faith.2030.a: "我想，[recipient.GetFaith.HighGodName]已经由祂仆人之口发声。"
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "争辩"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "“你是否要依据圣经和教会法规来证明[petition_target.GetTitledFirstNamePossessiveNoTooltip]的罪行？[petition_target.GetSheHe]一直在向雕刻的偶像下拜吗？”"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "“你是否能在十字架石前对[petition_target.GetTitledFirstNameNoTooltip]提出指控？”"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "“难道[petition_target.GetTitledFirstNameNoTooltip]不配得到圣母的怜悯？你站在这里，身上的衣袍就真的那样纯洁？”"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "“你要朕仅凭着私仇的一时冲动，而不是确凿的重罪证据，就把[petition_target.GetTitledFirstNameNoTooltip]从神圣的礼仪中驱逐出去吗？”"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "“你要将[petition_target.GetTitledFirstNameNoTooltip]挡在基督的祭坛外吗？要剥夺[petition_target.GetHerHim]领受我们主的肉体滋养的权利吗？难道[petition_target.GetSheHe]就不应再饮下祂的宝血？”"
 petition_head_of_faith.2000.desc.atmosphere_communion: "“你觉得把[petition_target.GetTitledFirstNameNoTooltip]从信徒的共融中赶出去合适吗？”"
 petition_head_of_faith.2000.desc.atmosphere_confession: "“你难道要朕利用在告解之封印下说出的东西，去对付[petition_target.GetTitledFirstNameNoTooltip]吗？”"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "“尚未尝试温和的手段使[petition_target.GetTitledFirstNameNoTooltip]迷途知返，难道你就要朕将[petition_target.GetHerHim]逐出吗？”"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "“你是否要呼求使徒的权柄，让朕在地上和天上定[petition_target.GetTitledFirstNameNoTooltip]的罪？”"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "“你打断了朕对教规的研究，就为了谴责[petition_target.GetTitledFirstNameNoTooltip]。你的言辞是否有教父的著作和圣经作为根据？”"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "“你要朕因为[petition_target.GetTitledFirstNameNoTooltip]在圣季流血或对教会土地施暴而采取行动？[petition_target.GetSheHe]是否违反了天主的和平与休战？”"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "“你对[petition_target.GetTitledFirstNameNoTooltip]的怨愤，一定在此处裁决最为妥当吗？你们二人何不都背起十字架，向基督之敌开战？”"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "“你来要求朕把[petition_target.GetTitledFirstNameNoTooltip]逐出教会，而我们五大牧首教座正试图维系一个纷争不断的基督教世界。你相信整个[Glossary( '普世', 'OIKOUMENE_GLOSS' )]都会支持你的指控吗？”"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "“[petition_target.GetTitledFirstNameNoTooltip]是否以公开的蔑视冒犯了对殉道者的敬拜？”"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "“你想让朕把[petition_target.GetTitledFirstNameNoTooltip]逐出教会。给朕一些迹象，表明[petition_target.GetSheHe]一直活在不服从和懒惰之中，因为懒惰是灵魂的大敌。”"
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "“你想让朕给[petition_target.GetTitledFirstNameNoTooltip]定罪，好似[petition_target.GetSheHe]独自继承了亚当的罪？每个灵魂降生于世都带着堕落的伤痕，但教会只驱逐那些沉溺于罪恶的人。”"
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "“你穿着华丽服饰来此，高声控诉要对[petition_target.GetTitledFirstNameNoTooltip]施以公正，而我们的修道士行走在贫民间，除了身上穿的衣服一无所有。一个托钵修士难道不会更劝人忍耐吗，还是说罪恶已经大到了那种地步？”"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "“你想剥夺[petition_target.GetTitledFirstNameNoTooltip]的圣事。你想危及[petition_target.GetHerHis]在天堂与基督同享永恒生命财富的份吗？我们追求的是在地上立下的神贫誓愿。”"
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "“你想朕仅凭[petition_target.GetHerHis]敌人的一句话就把一名基督战士赶出教会吗？”"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "“你希望圣教会如何裁决你与[petition_target.GetTitledFirstNameNoTooltip]的争端？”"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n“你必须知道，朕不会把绝罚当作君主的私器来使用。我们会判断需要施行什么样的正义。在主面前陈述你的理由！”[Select_CString( recipient.IsFemale, '圣母', '圣父' )|U]要求道。"
 petition_head_of_faith.2000.desc.target_sinful: "\n\n虽然[recipient.GetFaith.GetReligiousHeadTitle.GetNamePossessive]的言辞必须显得不偏不倚，但显然[petition_target.GetTitledFirstNamePossessiveNoTooltip]罪恶的名声已经传至这神圣殿堂。我只需确认[petition_target.GetHerHis]的罪行即可。"
 petition_head_of_faith.2000.desc.target_clean: "\n\n看来[recipient.GetTitledFirstName]知道[petition_target.GetTitledFirstNameNoTooltip]并未身陷罪恶。既然没有恶行的证据可以呈交法庭，我需要另寻他径，以求得我所追寻的公正。"
 OIKOUMENE_GLOSS: "希腊语义为“有人居住的世界”。在东罗马用语中，#bold 普世#!指的是文明世界：即帝国及其教会管辖的更广大的基督教秩序。"
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "在主面前宣告[petition_target.GetTitledFirstNameNoTooltip]犯下的[petition_gravest_sin.GetName(petition_target)]。"
 petition_head_of_faith.2000.a.cite_sins_fallback: "在主面前，列举[petition_target.GetTitledFirstNamePossessiveNoTooltip]的罪过。"
 petition_head_of_faith.2000.b.finesse: "“教会有许多需求，请允许我处理其中几项。”"
 petition_head_of_faith.2000.c.learning_duel: "我将引述冷僻的经文，将邪恶的[petition_target.GetTitleAsNameNoTooltip]陷于困境。"
 petition_head_of_faith.2000.d.hook: "提醒[recipient.GetFaith.ReligiousHeadName]某些……私密的事。"
 petition_head_of_faith.2000.e.withdraw: "……或许这是[petition_target.GetFaith.HighGodName]与[petition_target.GetTitledFirstNameNoTooltip]之间的事。"
 petition_head_of_faith.5000.e.withdraw: "……也许我对此还没有做好准备。"
 petition_head_of_faith_hook_committed_tt: "你将使用一个[hook|E]来促成此事"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip]的美德胜过罪恶"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName]被说服了"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName]被说服了"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName]未被说服"
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName]感到冒犯"
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName]无视你的论点"
 petition_head_of_faith_affronted_opinion: "被贿赂冒犯"
 petition_head_of_faith_affronted_opinion_desc: "该角色被一位自以为可以用金钱购买宗教裁决的请愿者羞辱了。"
 petition_head_of_faith_dismissed_debate_opinion: "不为辩词所动"
 petition_head_of_faith_dismissed_debate_opinion_desc: "该角色驳斥了一位请愿者，因其对教会法的曲解未能说服对方。"
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "寻求赦免"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "旅行前往你的[head_of_faith|E]处，乞求撤销你的[excommunication|E]。"
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "你将前往[recipient.GetCapitalLocation.GetName]，正式请求[recipient.GetTitledFirstName]撤销你的[excommunication|E]"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "告解"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "“你来寻求赦免。你是否明知只有圣经和忏悔才能洁净你，却还在雕像前叩拜？”"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "“我希望你来到那雕刻的十字架石脚下祈求赦免。”"
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "“圣母满怀怜悯，但朕不能仅因她的缘故就撤销对你的惩戒。”"
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "“你再次寻求参加神圣礼仪。想想是什么让你远离了祭坛和信众。”"
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "“你已被禁止靠近基督的祭坛，也被禁止领受祂的血肉的滋养。”"
 petition_head_of_faith.5000.desc.atmosphere_communion: "“你已被隔绝在信徒的共融之外。”"
 petition_head_of_faith.5000.desc.atmosphere_confession: "“告解的圣事要求完整而诚实的陈述。”"
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "“绝罚是教会的良药。这是一份礼物，好让你改过自新，缩短你在炼狱中的时日。”"
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "“朕握有伯多禄的钥匙。这权柄可以解除你的束缚，只要你确实悔改。”"
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "“你寻求和解。按照《法令集》的章节和分部来满足法律的要求。”"
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "“你的罪是否是破坏了天主的和平与休战？你是否在圣期流了血？”"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "“如果你名义上领受了十字架，却又伤害了基督教世界，便是公然违反了律法。”"
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "“五大教座正注视着这一切。当整个[Glossary( '普世', 'OIKOUMENE_GLOSS' )]都在见证时，朕不会让赦免变得廉价。”"
 petition_head_of_faith.5000.desc.atmosphere_dulia: "“殉道者以他们的血赢得了在天堂的位置。”"
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "“懒惰是灵魂的敌人。下跪不仅出于忏悔，也要准备好苦修、祈祷和劳作。”"
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "“你生而有罪，我们都是如此。为何还要在那继承之上增添新的恶行？”"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "“我们的修士们在穷人中间游走，除了破旧的会衣之外一无所有。”"
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "“我们在地上追求贫穷的誓愿。财富或地位买不回圣礼。”"
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "“你胸前佩戴着十字架，却冒犯了基督教世界。”"
 petition_head_of_faith.5000.desc.atmosphere_fallback: "“赦罪不是单凭你漫长的朝圣就能获得的。”"
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n“你必须知道，朕撤销惩戒不是为了作秀或迎合讨好。在天主面前直白地表达你的痛悔吧！”[Select_CString( recipient.IsFemale, '圣母', '圣父' )|U]如此要求道。"
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\n我犯下[petition_gravest_sin.GetName(actor)]罪行的消息，想必已传至这神圣殿堂。"
 petition_head_of_faith.5000.desc.penitent_clean: "\n\n无需呈上重大的恶行，教廷自会明白禁令已起到应有的效果。"
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "忏悔我的罪过，毫无保留。"
 petition_head_of_faith.5000.b.canon_law: "论证教会律法要求恢复我的教籍。"
 petition_head_of_faith.5000.c.weep: "将自己全然交托于教廷的慈悲。"
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName]被打动了"
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName]未被打动"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName]接受你的告解"
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.GetFaith.ReligiousHeadName]未被你说服"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.GetFaith.ReligiousHeadName]被你的谦卑打动"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.GetFaith.ReligiousHeadName]对你的表演不为所动"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "给予赦免"
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName]站起身，宣告主的慈悲：\n\n“起身吧，孩子。你已重返信众的共融。你灵魂上的禁令已被撤销。”"
 petition_head_of_faith.5020.a: "感谢[recipient.GetFaith.HighGodName]。"
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "未被赦免"
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName]站起身来，要以主的名义做出裁决：\n\n"
 petition_head_of_faith.5030.desc.confess: "“你的忏悔听着空洞无力。"
 petition_head_of_faith.5030.desc.canon_law: "“你那贫乏的学识正是你灵魂的写照。"
 petition_head_of_faith.5030.desc.weep: "“泪水并非赎罪。"
 petition_head_of_faith.5030.desc.fallback: "“你未免太过僭越了。"
 petition_head_of_faith.5030.desc.conclusion: "惩戒依然有效。”"
 petition_head_of_faith.5030.a: "我想，[recipient.GetFaith.HighGodName]已经由祂仆人之口发声。"
