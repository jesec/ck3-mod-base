l_simp_chinese:
 HISTORICAL_CHARACTER_TOOLTIP: "#T 历史角色#!\n\n#high [Character.Custom('HistoricalCharacterDesc')]#!\n\n#weak 该角色是历史人物，但根据[Character.GetHerHis]出现地点的[culture|E]和[faith|E]，可能会与[Character.GetHerHis]的现实情况有所偏差。[Character.GetSheHe|U]所出现的时间也可能会与[Character.GetHerHis]在历史上扬名的时间略微偏离1到5年。#!"
 danger_dynasty_abandon_tt: "#X @warning_icon!你将会放弃你的[dynasty|E]，不能再继续扮演他们了！#!"
 will_wander_tt: "[historical_character.GetFullName]会成为一位[wanderer|E]"
 historical_char_creation_events.t: "历史回响：[historical_character.GetFullNameNicknamedNoTooltip]"
 historical_char_creation_events.desc: "被称为[historical_character.GetFullNameNicknamed]的[historical_character.Custom('HistoricalCharacterJobDesc')]据说在我的领地内漫游着寻找工作机会。[historical_character.GetSheHe|U]来自[birth_location.GetName]，[historical_character.GetHerHim]身上有着某种气质……一个[historical_character.Custom('DescriptorPositiveStandalone')]同时又有几分[historical_character.Custom('DescriptorNegativeStandalone')]的人。\n\n\n@historical_character_icon!#weak 该角色是历史人物：#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events_alternative.desc: "被称为[historical_character.GetFullNameNicknamed]的[historical_character.Custom('HistoricalCharacterJobDesc')]让[historical_character.GetHerselfHimself]自己在宫廷中声名鹊起。[historical_character.GetSheHe|U]是[historical_character.Custom('DescriptorPositiveStandalone')]，尽管我说不出到底怎么样，但[historical_character.GetHerHim]身上有着某些非凡之处……\n\n\n@historical_character_icon!#weak 该角色是历史人物：#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events.1.a: "我很好奇[historical_character.GetHerHim]的命运将会如何……"
 historical_char_creation_events.1.b: "这样的[historical_character.GetWomanMan]对我有大用！"
 historical_char_creation_events.1.c: "[historical_character.GetFullNameNoTooltip]？谁在乎！"
 historical_char_creation_events.2.t: "宗教改革：成功"
 historical_char_creation_events.2.desc: "[inspiration_owner.GetFullName]花了无数个日日日夜夜，钻研书籍、经文，撰写了数不胜数的文献和专著。当我读到[inspiration_owner.GetSheHe]所写的内容时，[inspiration_owner.GetHerHis|U]的天才已无可置疑……\n\n让人难以置信。这可能会改变#EMP 一切。#!"
 historical_char_creation_events.2.a: "这些神圣的话语必须要分享！"
 religious_reformer_modifier: "宗教改革者"
 religious_reformer_modifier_desc: "在大智慧的帮助下，该角色准备好要创建一种新信仰。\n\n如果新[faith|E]被创建，这一修正将被移除"
 mass_conversion_tt: "给予一次#V $legendary_conversion$#![decision|E]使用机会"
 religious_inspiration: "宗教灵感"
 religious_inspiration_desc: "具有宗教[inspired|E]的角色会全身心地投入到对[faith|E]的复杂精妙和神秘莫测的研究中。他们通常是宗教运动伟大的改革者或领袖。这种灵感#EMP 非常罕见。#!"
 historical_character.karunakara: "迦楼那迦罗是朱罗国王俱律东伽的一位名将，制服了反对朱罗王朝事业的敌人和叛徒。迦楼那迦罗的生平在《羯陵伽千象诗》中有所描述，诗中他掌控羯陵伽，随后使其向俱律东伽称臣的事迹备受崇敬。"
 historical_character.sekkilhar: "作为神童，西吉剌年幼时便被罗阇俱律东伽招募为一位受重视的大臣和政治家。西吉剌以撰写的《大往世书》最为人所知，用4253句诗文讲述了湿婆派六十三圣的生平事迹。最终，西吉剌本人也一直在该地区被做出神像游街。"
 historical_character.omar_khayyam: "欧玛尔·海亚姆是一位十一世纪的波斯博学家、诗人、数学家和天文学家。如今以他的诗集《鲁拜集》最为人所知，他对波斯的代数和天文学做出了重大贡献。他关于三次方程分类与解法的学术作品是一项不朽的数学成就。"
 historical_character.bhaskaracharya: "婆塞羯罗阿阇黎是一位十二世纪的印度数学家和天文学家，他撰写了开创性的著作《顶上珠悉檀多》。这部全面的专著涵盖了算术、代数、行星数学和球面三角学等话题。他在微积分方面的工作早于牛顿和莱布尼茨五个多世纪。"
 historical_character.joseph_rabban: "约瑟夫·拉班是一位九世纪马拉巴尔派犹太社区中的杰出人物。支罗国王授予他在柯枝犹太社区的权利和特权，而拉班的领导帮助巩固了犹太人在南印度的势力和影响。他的举措确保了自治权和对他们商业和文化贡献的尊重。"
 historical_character.atisha: "阿底峡是中世纪佛教中最伟大的名人之一，他原本是一位来自旁伽罗的宗教领袖，但却与毗诃罗的超戒寺有着牢固的联系。他通过自己的著作，承担了将大乘佛教和金刚乘佛教遍传东南亚和吐蕃的责任。"
 historical_character.hemachandra: "醯摩旃陀罗是一位十二世纪的印度学者、博学家和耆那教僧侣。他为数学、语法、韵律学和哲学做出了重大贡献。醯摩旃陀罗的《成金声教》是耆那教文献中一部关键的作品，他的学说极大地影响了耆那教的教育与习俗。"
 historical_character.kshemendra: "谶摩因陀罗是一位十一世纪的迦湿弥罗诗人和学者，在文学创作上多才多艺，涉及到讽刺、戏仿和宗教经文。他值得注意的作品包括《宗母》和《破慢》，这两部作品幽默诙谐地批判了当时的风俗习惯，使他成为古典梵语文学中一位独特的人物。"
 historical_character.akka_mahadevi: "摩诃提毗大姊是一位十二世纪的羯罗拿吒诗人，也是一位林伽派奉爱运动中的杰出人物。她以自己的言说或诗作而闻名，追求了一条精神奉献和解脱的道路，通过遁世及倡导精神修行中女性的平等与赋权，向社会规范发起挑战。"
 historical_character.namdev: "那摩提婆是一位十三世纪的摩剌侘圣人和诗人，以其献给毗褚婆的拜赞歌而闻名，也是摩诃剌侘奉爱运动中的一位杰出人物。他的作品受到了普通民众的欢迎，也极大地增强了作为一种诗歌和宗教语言的摩剌侘语的传播及声望。"
 historical_character.madhvacharya: "摩陀婆阿阇黎是一位十三世纪的印度哲学家和吠檀多二元论派首要的拥护者。他宣扬灵魂（我）与终极实在（梵）截然有别，这与当时盛行的不二论哲学形成了鲜明对比。他的著述和论辩显著地影响了印度教神学。"
 historical_character.vidyapati: "毗地耶波底是一位十四世纪来自印度毗诃罗的诗人和学者。他以他献给湿婆的情歌和颂赞而著称，这些歌曲深刻影响了奉爱运动。他的作品因其抒情的美感和深邃的情绪表达而受到赞誉。"
 historical_character.abhinavagupta: "阿毗那婆笈多是一位十到十一世纪来自迦湿弥罗的印度哲学家和神秘主义者。他被视为不二论湿婆派中最伟大的学者之一。阿毗那婆笈多的作品影响了印度教哲学，尤其是在他的《舞论注》中关于美学和灵性的论说。"
 historical_character.basava: "婆娑婆是一位十二世纪的印度哲学家和社会改革家，兴起了林伽派运动。他的学说挑战了传统的种姓制度，强调对湿婆神的敬拜。婆娑婆的言说或诗作倡导精神平等，塑造了奉爱运动。他的理念显著地影响到中世纪印度的社会和宗教。"
 historical_character.hildegard: "希尔德加德·冯·宾根是一位有远见的女修道院院长、神秘主义者、作家和作曲家，以她的宗教神视和学术作品而著称。她撰写了神学、医学和音乐方面的文章，为中世纪基督教思想做出了贡献。希尔德加德还以她的礼仪乐曲和教仪剧而闻名，这些作品强调精神和整体的治疗。"
 historical_character.bernard_of_clairvaux: "格来福的伯尔纳铎是一位熙笃会修道院长、宣道者和神学家，以创立格来福修院，以及塑造拉丁基督教世界的讲道和书信而闻名。他推动熙笃会改革，宣讲第二次十字军东征，并撰写《新精兵赞》为圣殿骑士团辩护。"
 historical_character.thomas_aquinas: "托马斯·阿奎那是一位道明会神学家和哲学家，以在他的《神学大全》中将亚里士多德哲学与基督教神学结合起来而出名。他主张理性与信仰的兼容，显著地影响到基督教教义、自然法和伦理学。阿奎那作为一位被列品的圣人和教会圣师，其遗泽犹在。"
 historical_character.dante_alighieri: "但丁·阿利吉耶里是一位意大利诗人，以一段穿越地狱、炼狱和天堂的史诗之旅《神曲》而著称。他的作品对西方文学和基督教神学有着持久的影响。但丁对道德与人性的探究为他赢得了“意大利语之父”的称号。"
 historical_character.thomas_becket: "托马斯·贝克特是一位英格兰总主教和殉道者，以他与国王亨利二世围绕教会权利所产生的冲突最为人所知。他对教会权威的坚决捍卫导致他于1170年被谋杀于坎特伯雷主教座堂。贝克特的殉道巩固了他作为圣人的地位，他在坎特伯雷的圣龛也成了一处重要的朝圣地。"
 historical_character.maimonides: "迈蒙尼德是一位十二世纪的犹太哲学家和学者。他以他的《律法再述》最为人所知，这是一部犹太律法的法典，还有《迷途指津》，这本书探讨了宗教与哲学的关系。他被视为历史上最有影响力的犹太思想家之一。"
 historical_character.chretien_de_troyes: "克雷蒂安用古法语撰写的故事在亚瑟王传奇发展过程中发挥了关键作用。他在《朗斯洛，或坐囚车的骑士》和《伯斯华，或圣杯传奇》等作品中引入了典雅爱情和圣杯的元素，影响了骑士文学。他的著述强调骑士精神、英雄主义和典雅爱情的主题。"
 historical_character.egil_skallagrimrsson: "埃吉尔·斯卡德拉格里姆松是一位著名的冰岛战士诗人，也是《埃吉尔萨迦》中的核心人物。他以脾气暴躁和诗才横溢而著称，也因其暴行、铿锵有力的诗句以及在冰岛早期的定居和维京人对英格兰的劫掠中的重要作用而被人们铭记。"
 historical_character.gunnlaug_ormstunga: "《贡恩劳格萨迦》的主角“蛇舌”贡恩劳格是一位维京战士诗人，以他的游历和斗诗而闻名。这部萨迦讲述了他悲剧的爱情故事和他与一位诗坛对手的争斗，捕捉到了维京社会中荣耀和声誉的动态。"
 historical_character.torbjorg_the_seeress: "“女先知”索尔比约格是《红发埃里克萨迦》中专章描写的一位预言家人物。她以从事预言和占卜而闻名，在预测未来事件上发挥了至关重要的作用，她在萨迦中礼仪性的出场反映出诺斯人对预言力量的信仰。"
 historical_character.erik_rode: "埃里克·勒德，亦称“红发”埃里克，是一位维京探险家和格陵兰首个诺斯定居点的建立者。他以他的冒险精神和领导的殖民活动而闻名，创建了一个会持续数个世纪的社群。"
 historical_character.alhazen: "哈桑·海赛姆是一位十一世纪的阿拉伯数学家和物理学家，以他在光学领域的工作而闻名。他的著作《光学宝鉴》确立了现代光学的原理，影响了中世纪的西方科学。他因其严谨的实验方法和对伊斯兰黄金时代的重大贡献而被人们铭记。"
 historical_character.ibn_battuta: "伊本·白图泰是一位十四世纪的摩洛哥探险家，以其广泛的游历而闻名，他的旅行遍及伊斯兰世界内外，行程超过了十二万千米。他的《伊本·白图泰游记》对中世纪的文化和社会有着详细的见闻，使他成为历史上最著名的旅行家之一。"
 historical_character.william_of_ockham: "奥卡姆的威廉是一位十四世纪的英格兰哲学家和神学家，以“奥卡姆剃刀”而著称，这是一种避繁逐简的原则。作为一位经院哲学传统的关键人物，他挑战了教会的权威，提倡世俗与宗教权力相分离。他的理念影响了逻辑、科学和政治思想的发展。"
 historical_character.geoffrey_chaucer: "杰弗里·乔叟是一位十四世纪的英格兰诗人和作家，以《坎特伯雷故事集》最为知名，是一部描绘了坎特伯雷朝圣之旅的故事集。他的作品因其鲜活的人物、幽默的风格以及对中世纪社会的探索而受到赞扬。乔叟对英语文学的贡献为他赢得了“英语诗歌之父”的称号。"
 historical_character.aaron_of_lincoln: "林肯的亚伦是一位十二世纪的英格兰金融家和放债人，以成为中世纪英格兰最富有的犹太人之一而闻名。他为贵族和教会包括大教堂在内的建筑项目提供了大笔贷款。他去世以后，国王亨利二世没收了他庞大的资产。"
 historical_character.john_wycliffe: "约翰·威克里夫是一位十四世纪的英格兰神学家和改革家，以其早年对天主教会习俗的批判而闻名。他主张将《圣经》翻译为英文，为宗教改革打下了基础。威克里夫质疑教会权威的学说影响了罗拉德派运动及后来如马丁·路德这样的改革家。"
 historical_character.jan_hus: "扬·胡斯是一位波希米亚的神父，同时也担任布拉格查理大学的校长。他公开谴责教宗的大赦，并要求用本地方言讲道，从而点燃了一场民族改革运动。他在获得帝国的安全通行权后，被召至康士坦斯大公会议，却被定为有罪，并于1415年遭受火刑处决。他的殉难所引发的胡斯战争，一次又一次抵御了十字军的征讨。"
 historical_character.john_oldcastle: "约翰·奥尔德卡斯尔爵士，即科伯姆男爵，是一位英格兰骑士，也是亨利五世年少时亲密的伙伴。他公开信奉了威克里夫的罗拉德派教义。在被宣判为异端并关入伦敦塔后，他逃了出来，并于1414年在伦敦领导了一场注定失败的罗拉德派起义。他最终再次被捕，随后被置于慢火堆上绞死。"
 historical_character.jerome_of_prague: "布拉格的哲罗姆是一位波希米亚学者、辩论家，曾求学于牛津，将威克里夫的著作带回布拉格，他与扬·胡斯比肩，是改革派中最博学的拥护者。他被召至康士坦斯大公会议并被要求公开放弃主张，他起初屈服，随后又公开重申了胡斯的教义，最终在挚友殉道一年后，于同一地点被火刑处死。"
 historical_character.gerardo_of_borgo_san_donnino: "圣多尼诺镇的杰拉尔多是一位年轻的方济会士。约在1254年，他将菲奥雷的约阿基姆的预言性著述汇编成《永恒福音导论》，宣称“圣神时代”即将来临，制度化的教会不久将会被一个穷人默观修会取代。教宗亚历山大四世于1255年封禁该书；杰拉尔多拒绝放弃主张，便被判处终身监禁，约二十年后死于狱中。"
 historical_character.durand_of_huesca: "韦斯卡的杜兰德是一位有着阿拉贡人出身的博学的瓦勒度派传教士。他与清洁派及罗马神学家的辩论最终以他与教宗依诺增爵三世的和解而告终。他被获准在教会内讲道，并创立了“贫穷天主教徒”修会，在信奉天主教正统教义的同时，实践着瓦勒度派的宗徒式贫穷。"
 historical_character.niketas_of_constantinople: "尼基塔斯是一位来自君士坦丁堡的鲍格米勒派主教，后于1167年左右西行主持了圣费利克斯‑德卡拉曼的清洁派会议。他确立了朗格多克地区的二元教阶制度，并为该地首批主教举行了神慰圣事，将清洁派教会缝合进了一个更广泛的东方异见传统之中。"
 historical_character.guilhabert_de_castres: "吉亚贝尔·德卡斯特尔是一位清洁派的“完人”和图卢兹主教。他数十年如一日的巡回布道，将二元论信仰带入了贵族宫廷与农民村庄。在阿尔比十字军最艰难的岁月里，他躲在蒙塞居尔山间的要塞中幸存下来，在流亡中组织自己的教会，直至去世。"
 historical_character.priest_bogomil: "鲍格米勒司祭是一位十世纪保加利亚的乡村神职人员。他宣扬使徒式的贫穷，拒绝有形教会及其圣事，中世纪欧洲最持久的二元论运动之一鲍格米勒派即以他的名字命名。他的门徒从巴尔干半岛出发，将其教义传播到整个拜占庭帝国，往西最远到达了朗格多克。"
 historical_character.vasili_the_bogomil: "“医生”巴西尔是一位阿莱克修斯一世·科穆宁治下君士坦丁堡的鲍格米勒派领袖，在《阿莱克修斯传》中被描述为皇帝反异端运动的头号目标。阿莱克修斯亲自劝其忏悔，但巴西尔拒绝放弃信仰，最终在竞技场被处以火刑。他的处决预示了帝国对整个巴尔干地区鲍格米勒派社群长期的镇压。"
 historical_character.roger_bacon: "罗杰·培根是一位十三世纪的英格兰哲学家和方济会士，他以早年倡导科学方法而闻名。他在研究中强调观察和实验，为实证科学的发展做出了贡献。培根在光学和炼金术方面的工作影响了中世纪时期后来的学者。"
 historical_character.heloise_dargenteuil: "埃洛伊兹·达让特伊是一位十二世纪的法兰西女修道院院长和学者，以她与皮埃尔·阿贝拉尔的书信往来最为人所知。她的信件以其充满激情和智慧的内容而著称，表明了她深厚的才智和情感深度。埃洛伊兹后来成为了护慰者女修道院的院长，她在那里显露出了强大的领导力。"
 historical_character.peter_abelard: "皮埃尔·阿贝拉尔是一位十二世纪的法兰西哲学家和神学家，因他的学术方法和与埃洛伊兹有争议的关系而著名。他的著作《是与非》运用辩证推理来探讨神学问题。阿贝拉尔的生平和成果对中世纪哲学有着重大影响，而他与埃洛伊兹的爱情故事仍是中世纪的一类经典叙事。"
 historical_character.petrarch: "彼特拉克是一位十四世纪的意大利学者和诗人，被普遍认为是“人文主义之父”。他以他的十四行诗最为人所知，特别是《歌集》，其中着重表达了他对劳拉的单恋。彼特拉克的作品对文艺复兴时期人文主义的发展起到了重要作用，强调了古典知识和个人。"
 historical_character.christine_pizan: "克里斯蒂娜·德皮桑是一位十四世纪的法兰西作家和诗人，以她提倡妇女权利和教育的作品而著称。她撰写了《淑女之城》，挑战了她那个时代的厌女心态，赞扬了女性的成就。克里斯蒂娜的著述是率先提出性别平等的作品之一，使她成为中世纪欧洲一位先驱性的女权主义者。"
 historical_character.giotto_di_bondone: "乔托·迪邦多内是一位十三、十四世纪的意大利画家和建筑家，以他在艺术中对透视法和现实主义的创新运用而受到称赞。他的作品标志着对非写实拜占庭传统的突破，为文艺复兴奠定了基础。乔托在帕多瓦的斯克罗韦尼礼拜堂的壁画被视为杰作，影响了一代代艺术家。"
 historical_character.fibonacci: "莱奥纳尔多·斐波那契是一位十二至十三世纪的意大利数学家，以将印度‑阿拉伯数字系统引入欧洲最为知名。他的《计算之书》普及了阿拉伯数字和算术在西方世界的使用。斐波那契还以斐波那契数列而被认可，这是一个数学概念，描述了在自然界和各种研究领域中所发现的一种模式。"
 historical_character.giovanni_boccaccio: "乔瓦尼·薄伽丘是一位十四世纪的意大利作家和诗人，以他的作品《十日谈》最为人所知，该书收集了十个逃避黑死病的人所讲述的故事。薄伽丘生动的叙事和对人类行为的探索使他成为文艺复兴早期文学中一位关键人物。他的作品影响了后世如乔叟这样的作家，帮助塑造了意大利的文学传统。"
 historical_character.snorri_sturluson: "斯诺里·斯蒂德吕松是一位十三世纪的冰岛史学家、诗人和政治家，以撰写了一部诺斯神话的基础作品《散文埃达》而著称。他的著述是现代人理解诺斯遗产至关重要的来源。斯诺里的作品还包括《挪威列王传》，这是一部将历史和民间传说糅合在一起的挪威诸王编年史。"
 historical_character.hrotsvitha: "赫罗茨维塔是一位十世纪的德意志女诵经员、诗人和剧作家，被誉为基督教时代的第一位女性剧作家。她在甘德斯海姆修道院写作，创作出的戏剧、诗歌和传说在基督教主题中吸纳进了古典时代的影响，通常会颂扬女性的毅力和才智。"
 historical_character.ramanuja: "罗摩奴阇是一位十一世纪的印度神学家，以其在建立吉祥毗湿奴派传统中的基础作用而闻名。他提倡对毗湿奴的敬拜，推崇一种个人化和慈悲的灵修方法。他对“吠檀多”的阐释强调制限不二论，与其他学派大相径庭。"
 historical_character.arnaldus_de_villa_nova: "阿尔诺·德维拉诺瓦是一位十三世纪的加泰罗尼亚医生、炼金术士和学者，以他对医学和化学的贡献而著称。他是医学实践中科学方法的早期倡导者，被认为编写了许多医学文献和炼金术著述。他的作品显著影响了欧洲的医学思想和新兴的化学领域。"
 historical_character.ibn_khaldun: "伊本·赫勒敦是一位十四世纪来自突尼斯的阿拉伯学者，被视为现代社会学、史学史和经济学之父中的一位。他最著名的作品《历史绪论》是一次将历史和社会现象从神话中剥离，并将其建立在对因果关系、社会冲突和经济因素分析的基础之上的早期尝试。"
 historical_character.rumi: "鲁米是一位十三世纪的波斯诗人、神学家和苏菲派神秘主义者。他深刻的精神遗产被浓缩进他的诗作中，尤其是经常被称作“波斯语的《古兰经》”的《玛斯纳维》。鲁米的学说强调无条件的爱、宽容，以及通过个人精神体验追求神圣真理。"
 historical_character.avicenna: "阿维森纳，亦称伊本·西拿，是一位波斯博学家，被认为是伊斯兰黄金时代最重要的医生、天文学家、思想家和作家之一。他最为知名的不朽作品是《治疗论》和《医典》，这两部作品几个世纪以来一直都被伊斯兰世界和欧洲用作标准的医学教科书。"
 historical_character.averroes: "阿威罗伊（伊本·路世德）是一位十二世纪的安达卢西亚博学家，以其有关亚里士多德哲学的著述而著称。他的著作聚焦于在伊斯兰传统中融入古典希腊哲学。他将哲学合理化的努力使之成为伊斯兰和欧洲知识史上的一位主要人物，为文艺复兴做出了显著的贡献。"
 historical_character.al_biruni: "比鲁尼是一位十一世纪的波斯学者和博学家，他对天文学、数学和地理学等多个学科都做出了重大贡献。他在地球半径方面著述颇丰，并在随同伽色尼王朝入侵之后对印度的宗教和哲学编纂了一部全面的研究论著。"
 historical_character.rashi: "拉希（所罗门·以撒）是一位十一世纪的法兰西拉比和受尊崇的犹太学者，以他对《塔木德》和《希伯来圣经》的全面评注而著称。他的作品对犹太学和律法有着深远且持久的影响，是传统犹太教育中不可或缺的部分。"
 historical_character.yehuda_halevi: "犹大·哈列维是一位十二世纪的西班牙犹太诗人和哲学家，以他深刻的诗歌和哲理对话而受到称赞。在《库萨里》一书中，哈列维捍卫了犹太教的哲学真理，并表达出他对锡安衷心的向往。他的著作将宗教虔诚与丰富的抒情传统糅合在一起，使他成为中世纪希伯来语文学的一位核心人物。"
 historical_character.shaprut: "哈斯戴·伊本·沙普鲁特是一位十世纪穆斯林西班牙的犹太医生、外交家和学者。他在充当了哈里发阿卜杜勒‑拉赫曼三世的心腹时，在科尔多瓦的知识和外交领域发挥了关键作用，促进了犹太学者与伊斯兰学者的文化交流。"
 historical_character.gersonides: "利未·本·革顺（格尔松尼德）是一位十四世纪的法兰西犹太哲学家、天文学家和数学家。他以他科学的方法而著称，撰写了几部关于数学和天文学具有影响力的专著。他还因其对天文仪器设计的改进工作和对自由意志和神的预知的哲学探索而闻名。"
 historical_character.ezra: "亚伯拉罕·伊本·以斯拉是一位十二世纪来自西班牙的犹太学者、诗人和博学家。伊本·以斯拉以其圣经评注、占星术和数学的深厚贡献而闻名，他广泛游历于地中海地区，用自己的著述影响着知识界。"
 historical_character.gabriol: "所罗门·伊本·加比罗尔是一位十一世纪来自穆斯林西班牙的犹太哲学家和诗人。他以他新柏拉图主义的作品而闻名，尤其是《生命之泉》，他探究了上帝和宇宙的本质，显著地影响了犹太教和基督教思想。伊本·加比罗尔也是一位多产的希伯来语诗歌作家。"
 historical_character.nachmanides: "纳赫曼尼德，亦称摩西·本·纳赫曼或者兰班，是一位十三世纪的犹太学者和神学家。纳赫曼尼德以他对《律法书》深刻的评注和在赫罗纳犹太社区中的领导地位而著称，他在1263年的巴塞罗那辩论中捍卫了犹太信仰而声名大噪。他的著述和学说糅合了犹太律法、神秘主义和伦理教义。"
 historical_character.crescas: "哈斯戴·克莱斯卡是一位十四世纪的犹太哲学家，以挑战当时盛行的亚里士多德哲学而见称。他以他的哲学作品《上主之光》最为知名，这本书据理反对了亚里士多德学派的观点，奠定现代犹太哲学的基础理念，影响了像斯宾诺莎这样的思想家。"
 historical_character.saadia: "萨阿底亚·高昂是一位十世纪的犹太哲学家、神学家和学者。他曾任著名的苏拉学院的校长，以他关于犹太律法的作品和他的哲学专著《论信仰和意见》而著称。这部专著是首次在犹太神学中融入希腊哲学元素的系统性尝试。"
 historical_character.awkal: "优素福·伊本·奥卡勒是一位十世纪来自伊斯兰世界的犹太商人和旅行家，以他详细记述了自己横跨地中海、近东和非洲部分地区的贸易旅行而闻名。他的著述对他贸易路线沿途的商业惯例、文化互动以及犹太社区的勃勃生机提出了宝贵的见解。"
 historical_character.benjamin_of_tudela: "图德拉的便雅悯是一位十二世纪的犹太旅行家和探险家。他以他的旅行日记《便雅悯行纪》最为人所知，记录了他在欧洲、亚洲和非洲的旅行。便雅悯详细记述了中世纪世界各地犹太社群的情况。"
 historical_character.marco_polo: "马可·波罗是一位威尼斯商人、探险家和作家，他在1271年至1295年期间沿丝绸之路游历了亚洲。他广泛记述了他在忽必烈汗统治时期前往中国的旅行，这些游记以《马可·波罗行纪》为题出版，向欧洲人全面展示了亚洲的风土人情。"
 historical_character.bridget_of_sweden: "瑞典的彼利日大是一位十四世纪的神秘主义者和圣人，以她深奥的宗教神视和创立彼利日大女修会而闻名。她在丈夫去世后，献身于宗教仪式，并数次前往圣地朝圣。"
 historical_character.meister_eckhart: "埃克哈特大师是一位十三世纪的神学家、哲学家和神秘主义者，以他在天主的本性和人类灵魂与神的关系上有影响力的学说而闻名。他的讲道和著述探讨了无执、灵魂中诞生的神性和存在的同一性等主题。"
 historical_character.jangar: "江格尔是斡亦剌惕史诗《江格尔》中的传奇英雄。他因建造了幻想中的香巴拉城，并以智慧和勇气领导人民而著称。他与敌人的战斗和他对恢复国泰民安、繁荣昌盛的追求，言简意赅地体现出了斡亦剌惕人的奋斗和理想。"
 historical_character.zawisza: "黑扎维沙是一位十五世纪的波兰骑士和军事将领，以他的英勇和骑士精神而著称。扎维沙在1410年的格林瓦尔德战役中表现出色，后来又供职于各个不同的朝廷中。他在1428年对奥斯曼帝国的十字军东征中围攻戈卢巴茨要塞时壮烈牺牲。"
 historical_character.theophanes_the_greek: "“希腊人”塞奥法尼斯是一位杰出的拜占庭画家。他为俄罗斯圣像绘制的发展带来了富有表现力和感染力的深度，这脱离了更为正式的拜占庭风格。他最引人注目的贡献包括了诺夫哥罗德主易圣容教堂和莫斯科圣母领报主教座堂的壁画。"
 historical_character.nicetas_choniates: "尼基塔斯·霍尼亚蒂斯是一位十二世纪末十三世纪初的拜占庭政府官员和史学家。他以他的作品《编年史》而著称，书中详细记述了1118年至1207年间拜占庭的生活和政治，涵盖了拜占庭帝国的衰落和第四次十字军东征中的事件。"
 historical_character.michael_psellos: "米海尔·普塞洛斯是一位十一世纪的拜占庭哲学家、政治家和史学家。普塞洛斯担任过数位皇帝手下的廷臣，是在拜占庭宫廷中复兴希腊哲学和科学的关键。他最引人注目的作品《编年表》深刻而详尽地记述了拜占庭的政治和宫廷生活。"
 historical_character.john_tzetzes: "约翰·采齐斯是一位十二世纪的拜占庭学者，以他巨量的文学产出和对古典文学的渊博学识而闻名。他在语法、历史和神话题材上著述颇丰，他最著名的作品是《千行集》（或称《历史之书》），是一部诗歌形式的历史和神话轶事集。"
 historical_character.theophylact_of_ohrid: "德奥斐拉克特是一位十一世纪拜占庭的总主教和学者。在奥赫里德总主教任期内，他在该地区宗教和文化生活中发挥了至关重要的作用，对东正教神学施加了重大的影响。"
 historical_character.eustathius_of_thessalonica: "德撒洛尼基的艾弗斯塔提是十二世纪拜占庭的学者、神学家和德撒洛尼基总主教。艾弗斯塔提以其丰富的著作而著称，曾为荷马的著作撰写过详尽的评注。在担任总主教期间，他努力重建并改革了西西里入侵德撒洛尼基之后教会在社会中所起到的作用。"
 historical_character.nicephorus_blemmydes: "尼基弗鲁斯·布雷米狄斯是一位十三世纪的拜占庭学者和神学家。他创办了一所学校和一座修道院，在那里教学并度过了他的大半人生。布雷米狄斯在哲学、神学和科学方面著述颇丰，努力调和古典哲学理念与基督教教义。"
 historical_character.georgius_pachymeres: "乔治乌斯·帕西迈利斯是一位十三世纪的拜占庭史学家和学者，以他全面的作品《拜占庭史》而闻名，该书记载了1255年至1308年拜占庭帝国的编年史。他的著述详细记述了巴列奥略王朝统治时期和拉丁人占领的影响。"
 historical_character.manuel_moschopoulos: "曼努埃尔·莫斯霍普洛斯是一位十三世纪末十四世纪初的拜占庭学者和语法学家，以他复兴古典希腊学问和文献的工作最为人所知。他在语法学题材上著述颇丰，创作出对古典作家的评注，旨在保存和阐明古籍文献。"
 historical_character.theodore_metochites: "梅托希蒂斯是一位博学家，在哲学、天文学、数学和艺术方面都出类拔萃，在皇帝安德罗尼科斯二世·巴列奥略手下担任首席大臣，可谓是文艺复兴前的文艺复兴人。他以他对君士坦丁堡霍拉教堂的赞助最为人所知，他委托在那里制作了大量的马赛克和壁画。"
 historical_character.michael_choniates: "米海尔·霍尼亚蒂斯是一位十二世纪的拜占庭学者、诗人和教会人物，以他在1182年至1204年期间担任雅典总主教一职而著称。在一个拜占庭控制力不断衰退的时代，他努力维护着雅典的文化和知识传统。"
 historical_character.joseph_tarchaneiotes: "约瑟夫·塔尔哈尼奥蒂斯是一位活跃于十一世纪末的拜占庭将军，主要以他在拜占庭抵抗塞尔柱突厥人的军事行动中所发挥的作用而闻名。塔尔哈尼奥蒂斯在皇帝阿莱克修斯一世·科穆宁手下服役，他在几场至关紧要的战役中发挥了关键作用，包括成功防守住尼西亚。"
 historical_character.gemistus_pletho: "格弥斯托士·卜列东是一位十五世纪的哲学家。卜列东是一位新柏拉图主义坚定的拥护者，在预示着君士坦丁堡陷落的知识复兴中发挥了极其关键的作用。他在佛罗伦萨大公会议上也起到了重要作用，他在会议上力主东正教和天主教教会的重新合一。"
 historical_character.arethas_of_caesarea: "恺撒里亚的阿瑞塔是一位十世纪的总主教、学者和有着丰富古希腊手稿的收藏家。作为卡帕多基亚地区恺撒里亚的总主教，阿瑞塔对拜占庭的知识和文化生活做出了重大贡献，确保了古典知识的存续，这些知识后来也会影响到文艺复兴。"
 historical_character.basil_lekapenos: "巴西尔·利卡潘努斯是一位权宦和行政家，在十世纪末十一世纪初担任了几位拜占庭皇帝的首席大臣。作为皇帝罗曼努斯一世的私生子，巴西尔通过担任内廷总管（内侍）一职在拜占庭宫廷内施加着巨大的影响力。"
 historical_character.john_the_orphanotrophos: "“孤儿院院长”约翰是一位十一世纪初皇帝米海尔四世在位期间显要的宦官和有影响力的宫廷官员。作为孤儿院院长——负责孤儿和穷人福利的公职官员，约翰积聚了相当大的权力和影响力。"
 historical_character.samonas: "萨莫纳斯是一位九世纪末十世纪初皇帝“智者”利奥六世手下显要的宦官和有影响力的宫廷官员。他原本来自萨莫萨塔，通过担任内廷总管（皇帝内侍）一职崭露头角，在拜占庭宫廷内施加着相当大的影响力。"
 historical_character.peter_the_eunuch: "“阉人”彼得是一位十一世纪皇帝米海尔四世在位期间杰出的拜占庭宫廷官员和可信赖的顾问。作为内廷总管，彼得在支持米海尔四世登上皇位方面发挥了极其关键的作用，还增进了斯督迪修道院的权益。"
 historical_character.constantine_the_paphlagonian: "“帕夫拉戈尼亚人”君士坦丁是一位九世纪的拜占庭宦官和有影响力的宫廷官员。他担任过皇帝“智者”利奥六世的内廷总管（内侍），以他在一段充满了政治阴谋和派系斗争的时期努力维护宫廷内部的稳定而著称。"
 historical_character.peter_the_stratopedarches: "“军营长官”彼得是一位十世纪显要的军事将领和宦官，“体力十分充沛”。他在皇帝巴西尔二世在位期间，尤其是在将军巴尔达斯·斯克莱鲁斯领导的叛乱期间，发挥了至关重要的作用。"
 historical_character.basilios_bessarion: "巴西尔·贝萨里翁是一位十五世纪的学者、哲学家和枢机主教。贝萨里翁皈依天主教，并在佛罗伦萨大公会议期间主张东正教会和天主教会的合一，力争此举将加强基督徒的团结，对抗奥斯曼日益加重的威胁。"
 historical_character.demetrios_kydones: "季米特里奥斯·屈佐尼斯是一位十四世纪的杰出学者、翻译家和外交家，以他在东正教的拜占庭帝国内提倡拉丁和罗马天主教的传统而闻名。他将托马斯·阿奎那和其他拉丁经院哲学家的许多作品都翻译成了希腊文。"
 historical_character.manuel_holobolos: "曼努埃尔·奥洛沃洛斯是一位十三世纪的学者和官员，以他的文学和修辞技巧而闻名。他在几位拜占庭皇帝手下担任各种行政职务，最让人铭记的是他雄辩的信件和演讲。"
 historical_character.john_axuch: "约翰·阿克苏赫是一位十二世纪的拜占庭军事将领和皇帝约翰二世·科穆宁手下的首席大臣。阿克苏赫原本是一位塞尔柱突厥人，小时候被俘，在皇室中被带大，一下子成了皇帝最信赖的顾问和朋友。"
 historical_character.mkhitar_gosh: "姆希塔尔·戈什是一位十二世纪的亚美尼亚学者、圣职者和法学家，以他对亚美尼亚法律和文学的贡献而著称。他编写了亚美尼亚法律中最早的法典之一——《法律之书》。"
 historical_character.shota_rustaveli: "绍塔·鲁斯塔韦利是一位十二世纪的格鲁吉亚诗人，也是格鲁吉亚文学最伟大的贡献者之一。他以他的史诗《虎皮武士》最为人所知，这首诗被认为是格鲁吉亚民族文学的一部杰作。"
 historical_character.grigor_tatevatsi: "格里戈尔·塔特瓦齐是一位十四世纪的亚美尼亚哲学家、神学家和学者，以他在中世纪亚美尼亚塔特夫修道院学校担起校长和教师的职责而著称。"
 historical_character.sargis_pitsak: "萨尔吉斯·皮察克是一位十四世纪的亚美尼亚手稿彩饰绘制师和书吏，以他对中世纪亚美尼亚书籍制作艺术的贡献而著称。"
 historical_character.medici: "阿韦拉尔多·德美第奇，亦称比奇，是显赫的美第奇家族早期的一位祖先，这一家族在文艺复兴时期的佛罗伦萨崭露头角。阿韦拉尔多为家族在佛罗伦萨政界和社交圈内确立财富和地位起到了重要作用。"
 historical_character.borgia: "阿方索·德波吉亚是一位西班牙枢机主教和外交家，后来于1455年成为教宗加理多三世。在担任教宗前，他是一位受人尊敬的法学家和署理，在让《卡斯佩妥协方案》中冲突的各方走向和解上发挥了关键作用。"
 historical_character.william_wallace: "威廉·华莱士是十三世纪末苏格兰抗英独立战争期间的一位苏格兰骑士和杰出领袖。华莱士以他大胆的战术和强烈的爱国主义而闻名，在1297年著名的斯特灵桥战役中击败了英格兰军队，并被任命为苏格兰护国主。"
 historical_character.la_hire: "艾蒂安·德维尼奥勒，被习称为“拉海尔”，是百年战争后期一位关键的军事将领。拉海尔以他在战斗中的英勇和威猛而著称，也是贞德手下的主要将领之一。"
 historical_character.bar_sauma: "列班·巴·扫马是一位来自中国元朝的聂斯脱里派修士出身的外交家。他原本要启程前往耶路撒冷朝圣，但却未能成行，反而在巴格达度过了数年。他在后来的人生中担任了蒙古的驻欧大使，会见了欧洲君主、拜占庭皇帝和教宗，商讨潜在的法蒙同盟。"
 historical_character.hodja: "“霍加”纳斯尔丁是土耳其文化中一位民间英雄和标志性的文学形象，经常被描绘为一名睿智风趣的老人，他会给出晦涩难懂的建议或遭遇不幸，运用他的机智幽默解决所有问题。"
 historical_character.widukind_of_corvey: "科韦的维杜金德是一位十世纪的萨克森隐修士和史学家，以他的作品《萨克森人史》而著称，这是一部详细记录了撒克逊人事迹的编年史，尤其侧重于皇帝奥托一世的统治时期。"
 historical_character.roger_de_flor: "罗杰·德弗洛尔是一位十三世纪末十四世纪初杰出的佣兵队长和冒险家。他原本是一名圣殿骑士，后来成为突袭兵的首领，组建了加泰罗尼亚佣兵团。他曾为安德罗尼科斯二世和米海尔九世而战，后者因他在拜占庭帝国内的影响力与日俱增而将他刺杀。"
 historical_character.regino_of_prum: "普吕姆的雷吉诺是一位九世纪出名的本笃会隐修士、史学家和音乐理论家。他曾担任普吕姆修道院院长，直到899年被驱逐，此后他成了特里尔圣玛尔定修道院的院长。他以他的《编年史》最为出名。"
 historical_character.geoffrey_of_monmouth: "蒙茅斯的杰弗里是一位十二世纪的威尔士圣职者，也是不列颠史学史和亚瑟王传奇文学发展过程中最重要的人物之一。他开创性的作品《不列颠诸王史》是一部记述了不列颠诸王生平的伪史。"
 historical_character.raiktor: "1081年，在阿莱克修斯一世·科穆宁上台后的动荡之中，一名叫雷克托尔的修士谎称自己是被废黜的皇帝米海尔七世。诺曼公爵罗贝尔·吉斯卡尔趁机利用雷克托尔的宣称，来为自己入侵巴尔干开脱。尽管这一骗局被揭穿，吉斯卡尔仍然继续着他的征战，在底拉西乌姆城前展示雷克托尔以获取支持。最终，吉斯卡尔因诡计失败而抛弃了雷克托尔，雷克托尔一旦不再有用，很可能就被悄悄处理掉了。"
 historical_character.nichiren: "$Nichiren$是日本佛教中一位激进而强硬的改革者，宣称依止《妙法莲华经》为得救之不二法门。他激烈批判对立的宗派和政治上的自满大意，因其教义而遭受到了流放与刺杀。他的思想遗产催生出一门独特的、具有民族主义色彩的佛门宗派，一直延续至今。"
 historical_character.dogen: "日本曹洞宗的创始人，因其禅法及要著《正法眼藏》而备受尊崇，这部作品塑造了日本禅学。"
 historical_character.kokan_shiren: "镰仓时代的临济宗禅僧、诗人及史学家。编撰了佛教史名著《善邻国宝记》及多部将禅意与文学典雅相融合的诗集。"
 historical_character.jeong_mong_ju: "郑梦周是一位高丽晚期的政治家、学者和诗人，因在王朝覆灭之际坚守忠诚而备受尊崇。作为一位理学思想的外交大师，他与崛起的朝鲜政权较量，因自身的原则遭到刺杀。其表达忠贞不移的绝命诗，至今仍是朝韩最著名的诗篇之一。"
 historical_character.yi_saek: "李穑是一位高丽晚期的大儒，将朱熹的理学引进高丽，培养了一代未来朝鲜的改革者。虽然支持教育改革，但他依然效忠高丽王朝，拒绝入仕新朝。其影响横贯两朝，塑造了朝鲜几个世纪的思潮。"
 historical_character.jinul: "$Ji_nul$是一位高丽时代富有远见的禅僧，试图通过统一禅修与教义研究来改革高丽佛教。他在松广寺创立了曹溪宗，强调戒律修持中的个人开悟。其教义奠定了高丽禅宗的基础，融合了禅意与学术深度。"
 historical_character.prapanca: "阇婆满者伯夷王朝的宫廷诗人兼史官，著有史诗《阇婆史颂》（1365年），详述了满者伯夷的辉煌与地理环境，其作品是研究阇婆历史与治国术的关键史料。"
 historical_character.tantular: "姆普·坦图拉尔是一位知名的阇婆诗人，创作了《须陀须摩传》，引出了“存异求同”这一名言，其后被印度尼西亚选为国家格言。"
 historical_character.kanwa: "姆普·甘婆是一位爱罗浪伽国王在位时期的宫廷诗人，创作了史诗《阿周那的姻缘》，融合了印度教神话与阇婆人的想象。"
 historical_character.sedah: "姆普·塞达受阇耶婆耶国王的委托开始创作《婆罗多大战记》，一部改编自《摩诃婆罗多》的作品，后由姆普·帕努卢续成。"
 historical_character.panuluh: "姆普·帕努卢续成了《婆罗多大战记》，并创作了《诃利世系记》，对阇婆文学传统贡献卓著。"
 historical_character.dharmaja: "姆普·达摩阇是一位爱罗浪伽国王在位时期的诗人，以创作《爱神遭焚记》而闻名，这篇诗作影响了后世的阇婆文学。"
 historical_character.monaguna: "姆普·牟那求那被认为创作了《须摩那花夺命记》，这一诗作反映出印度教叙事与阇婆文化的融合。"
 historical_character.kuturan: "姆普·库图兰是一位婆利历史上受到尊崇的宗教领袖，被认为统一了婆利岛各印度教派系，建立了融合宗教与习惯法的“习俗村”制度。"
 historical_character.dwijendra: "姆普·提鞞阇因陀罗是一位精神领袖，在龙目岛与婆利岛印度教的传播中发挥了重要作用，以其教义及遍建岛上的庙宇而闻名。"
 historical_character.kavindrarimathana: "迦毗因陀罗利摩他那是一位罗阇因陀罗跋摩二世国王在位期间的杰出建筑师和工程师。被认为是他所设计的重要寺庙，包括了比粒寺与东梅蓬寺，彰显出吉蔑帝国的建筑技艺。"
 historical_character.daun_penh: "边夫人是一位十四世纪受人敬重的寡妇，传说在洞里萨河泛滥时，她在一段漂浮的坡垒木中发现几尊神圣的佛像。她将其视为神迹，遂在山顶建立了“塔山寺”以供奉佛像。她的虔诚之举催生出了一座以其命名的城市——金边。"
 historical_character.yue_fei: "岳飞是中国最负盛名的将领之一，出身寒微，却成为南宋抵御金国女真入侵的中流砥柱。因坚持对皇帝的忠诚和国家统一的理想而遭到贪官出卖，蒙冤遇害。他的精神遗产成为了爱国与正直的一种象征。"
 historical_character.wen_tianxiang: "文天祥是一位南宋末年备受尊崇的儒将，是抗元斗争中一盏明灯。在王朝保卫战失败被俘后，他拒仕元朝，慷慨就义。他狱中所作之诗，尤其是《正气歌》，使其精神遗产成为了美德忠义的典范。"
 historical_character.fan_zhongyan: "北宋政治家、宰相和理学思想家，以其名言“先天下之忧而忧，后天下之乐而乐”闻名，他曾实施具有里程碑意义的改革，以改善治理和社会福祉。"
 historical_character.li_qingzhao: "中国最伟大的女词人之一，宋词著名作者，她的词作深刻地表达了自身的失落与往日的优雅。"
 historical_character.qiu_chuji: "备受尊崇的道教大师（全真道北七真之一）以及成吉思汗的顾问；从华北远赴中亚，向大汗进谏了治国与长生之术，帮助确立了元朝早期的宗教政策。"
 historical_character.wang_chongyang: "北宋末年的道教改革宗师，全真派创始人。王嚞弃武后隐居于终南山，晚年出山传道，宣扬一种混杂了道教内丹、佛教禅定与儒家伦理的融合修炼方式。他的七大弟子将该教派传遍华北，并传入了蒙古宫廷。"
 historical_character.chu_van_an: "陈朝敬重的儒学宗师，先后任升龙国子监司业及祭酒。以其清直严毅、教育改革及著名谏议《七斩疏》奏请君王诛杀佞臣而闻名。"
 historical_character.nguyen_thuyen: "十三世纪的诗人官员，被认为是在文学创作中使用喃字（越南本土文字）的第一人。因为其传说能驱退鳄鱼的诗作而受到人们的纪念，成为越南语言与学问影响力的象征。"
 historical_character.pham_ngu_lao: "陈朝名将，十三世纪协助击退了多次蒙古入侵。他一介农民出身，却凭勇毅擢升，成为爱国精神的象征（亦是一首名诗的赞颂对象，突出了他的奉献）。"
 historical_character.sakata_kintoki: "$dynn_Satake$$Kin_toki$是一位相模山中的勇猛武士，相传以巨力与忠诚侍奉$dynn_Minamoto$$Yorimitsu$。他以“金太郎”为名的传奇事迹包括搏熊、拔树和冲锋陷阵。"
 historical_character.takezaki_suenaga: "$dynn_Takezaki$$Suenaga$是一位镰仓幕府赤胆忠心的武士，因在蒙古侵日战争中的英勇而闻名。他决意让自己的战功获得正当的认可，便托人制作了记录其事迹的绘卷。"
 historical_character.eisai: "$Eisai$出身于一个神官世家，出家后却对主流的法华宗（或称“天台宗”）不满，因而入宋求禅问道。归国后，他将禅法引入日本，开创临济宗，建立首座禅院，复兴饮茶之风。"
 historical_character.ippen: "$Ippen$少习佛典而后还俗。在熊野参谒时获神启开悟法门：踊跃[Glossary( '念佛', 'GLOSS_NEMBUTSU')]，法喜充满。受此感召，$Ippen$再度出家，成为一位净土宗高僧，率领一众信徒云游日本，创立时宗。"
 historical_character.myoe: "$MyO_e$幼年孤苦，师从$Mongaku$、$Eisai$等高僧，广学诸宗而未契。为避寺院纷争而遁世隐修，他重弘渐衰的华严宗，融入真言与天台的思想，拒斥[Glossary( '念佛', 'GLOSS_NEMBUTSU')]之风。"
 historical_character.honen: "$HO_nen$幼年因父遇刺出家，精进修成天台宗高僧。因痛感僧伽安逸与生民疾苦之悬殊，$HO_nen$体认到[Glossary( '念佛', 'GLOSS_NEMBUTSU')]法门的包罗万象，成为一位领导净土宗的上师。其激进的理念引发了其他宗门的敌视，导致他在承元法难中被流放。"
 historical_character.shinran: "$Shinran$自幼丧亲，早年出家后修行困顿。受梦示指引，$Shinran$投身同为沙门的$HO_nen$门下，成为其高足，承元法难中遭到流放。他心怀热忱，持续弘扬净土宗[Glossary( '念佛', 'GLOSS_NEMBUTSU')]法门，最终创立了自己的宗派——净土真宗，现为日本流传最广的佛教宗派。"
 historical_character.mibu_tadamine: "尽管$Tadamine$出身寒微，他却在歌合中崭露头角，凭借自己的和歌诗名大振，还奉皇命咏进应制，亦得藤原家赏识。与其子$Tadami$同列“三十六歌仙”，逾八十一首诗作入选敕撰和歌集。"
 historical_character.murasaki: "紫式部是著名诗人藤原兼辅的曾孙女，出生于博学的良门流世家，曾任一条天皇中宫藤原彰子的宫廷女官。她诗才卓绝，早负盛名，位列女房三十六歌仙。如今她以自己的日记和与同为诗人的#EMP 清少纳言#!的竞争，以及也许是世界上最早小说的#EMP 《源氏物语》#!最为人所知。"
 historical_character.francis_of_assisi: "亚西西的方济各是一位十三世纪的意大利会士，他放弃商贾世家的财富，拥抱赤贫，并向穷人布道。他是方济会的创始人，以质朴而谦卑的方式效法基督生活，成为中世纪基督教世界最受人爱戴的圣人之一，他也是第一位有记载的受五伤圣痕者。"
 historical_character.bonaventure: "文都辣是一位十三世纪意大利的方济会士、神学家和哲学家，因其将神秘神学与士林理性结合而被称为“色辣芬天神博士”。他曾任小兄弟会总会长，也是里昂第二届大公会议中的领军人物，致力于调和拉丁与希腊教会。"
 historical_character.peter_waldo: "彼得·瓦勒度原是里昂的一名富商，在经历宗教觉醒后，他散尽家财，开始用方言宣讲宗徒式的贫穷。他的追随者被称为瓦勒度派，最终受到罗马的谴责，但在阿尔卑斯山谷中幸存下来，成为最早的持久性原始新教运动之一。"
 historical_character.joachim_of_fiore: "菲奥雷的约阿基姆是一位十二世纪卡拉布里亚的修道院院长和神秘主义者。他的三分史观将历史划分为三个时代——圣父时代、圣子时代和圣灵时代——这深刻地影响到中世纪的默示思想。他的著作塑造了方济会中的灵修派，并激发了拉丁欧洲数个世纪的千禧年主义思辨。"
 historical_character.catherine_of_siena: "锡耶纳的加大利纳是一位十四世纪的道明会神秘主义者，她的神视和政治书信使其成为中世纪末期教会最具影响力的女性之一。据信她说服教宗额我略十一世将教廷从阿维尼翁迁回罗马，后被宣为圣人和教会圣师。"
 historical_character.suger: "叙热是一位十二世纪的法兰克人，圣但尼修道院院长，国王路易六世和路易七世的顾问，第二次十字军东征期间法兰西的摄政。他对修道院进行了雄心勃勃的改造——高耸的拱顶沐浴在彩色玻璃透出的光线中——被广泛认为标志着哥特式建筑风格的诞生。"
 historical_character.matthew_paris: "马修·帕里斯是一位十三世纪英格兰的本笃会修士，以及圣奥尔本斯修道院的编年史家。他的《大编年史》将犀利辛辣的政治评论与其亲手绘制的生动地图插画结合在一起，提供了他所处时代最为多彩详尽的历史记录之一。"
 historical_character.ramon_llull: "拉蒙·柳利是一位十三世纪马略卡的博学家、神学家和传教士。他发展出一套逻辑“艺术”，旨在通过理性论证使所有民族皈依基督教。他用加泰罗尼亚语、拉丁语和阿拉伯语创作了大量作品，开拓了方言哲学和组合逻辑——而这在数世纪后启发了莱布尼茨。"
 historical_character.walther: "瓦尔特·冯·德福格尔魏德是德意志中世纪最负盛名的恋诗歌手，一位浪迹天涯的抒情诗人。他的歌咏题材从宫廷爱情延伸到对皇帝和教宗尖锐的政治评论。他曾为神圣罗马帝国的多位诸侯效力，还赢得了“中世纪德意志语言最强音”的美誉。"
 historical_character.jacopone: "雅各布内·达托迪是一位十三世纪意大利的方济会士和诗人。他用翁布里亚方言创作的神秘主义作品《颂歌》是早期宗教抒情诗的杰作。他曾激烈批评教宗波尼法爵八世，因支持反对教宗的方济会灵修派而被监禁多年。"
 historical_character.cimabue: "奇马布埃，本名琴尼·迪佩波，是一名佛罗伦萨的画家。他在十三世纪晚期创作的祭台画与湿壁画，打破了僵化的拜占庭传统，走向一种更为自然主义的风格。据传，他发掘了年轻的乔托，让意大利十四世纪的艺术走上了正轨。"
 historical_character.andrea_pisano: "安德烈亚·皮萨诺是一位十四世纪意大利的雕塑家与建筑师，以铸造佛罗伦萨洗礼堂南门这件青铜浮雕杰作而闻名。他后来接替乔托，担任佛罗伦萨主教座堂的工程总监。"
 historical_character.joan_of_arc: "贞德生于洛林的一户农家，自称得神启召唤她将英格兰人逐出法兰西。她率领王师为奥尔良解围，在兰斯为王太子加冕，扭转了百年战争的局势。她被俘后，以异端受审，在鲁昂被火刑处死，年仅十九岁。"
 historical_character.paul_vladimiri: "帕维乌·沃德科维奇是一位波兰神学家、法学家和雅盖隆大学校长。在康士坦斯大公会议上，他以异教民族也拥有财产和自治的天赋权利的论断而著称，谴责条顿骑士团强制改信的战争，即使在天主眼中也是非法的。"
 historical_character.peter_the_hermit: "隐士彼得是一位法兰西的苦修传道员，他充满激情的讲道集结了成千上万的平民加入1096年的平民十字军。他这支难以管束的队伍在安纳托利亚几乎全军覆没，但他本人却幸存下来并参加了三年后攻占耶路撒冷的战役。"
 historical_character.margery_kempe: "玛格丽‧肯普是一位英格兰神秘主义者和朝圣者，她在经历过一系列可怕的神视后，放弃了自己的酿酒生意，前往罗马、耶路撒冷和孔波斯特拉。她晚年口述的《玛格丽·肯普之书》被认为是现存最早的英文自传。"
 historical_character.robert_of_st_albans: "圣奥尔本斯的罗伯特是一位英格兰圣殿骑士，他约于1185年脱离骑士团，改信伊斯兰教，效力于萨拉丁。他率领阿尤布王朝的军队袭击十字军诸国，据传与苏丹家族存在联姻，这成为长期以来西方编年史中一桩丑闻。"
 historical_character.werner_of_urslingen: "维尔纳·冯·乌尔斯林根是一位德意志贵族，他成为意大利最早的佣兵队长之一，创立了臭名昭著的“伟大佣兵团”，在十四世纪四十年代蹂躏了意大利半岛。他胸甲上铭刻的名言是：“天主、怜悯与慈悲之敌。”"
 historical_character.leif_erikson: "莱夫·埃里克松是一位诺斯探险家，被认为于公元1000年左右率领已知的第一批欧洲人踏足了北美。他从其父“红发”埃里克的格陵兰殖民地向西航行，将发现的森林茂密的海岸命名为“文兰”，他在那里过冬，之后带回了木材和葡萄。"
 historical_character.saxo_grammaticus: "萨克索·格拉玛提库斯是一位十二世纪的丹麦史学家，以及隆德总主教阿布萨隆家中的文书。他那部包罗万象的《丹麦人的事迹》融神话、传说与当代编年史于一身，保存了濒临失传的哈姆雷特传说——这一传说在四个世纪后启发了莎士比亚。"
 historical_character.thorkell_the_tall: "“高个”索凯尔是一位约姆斯维京雅尔，他率领的维京大军在1009年—1012年间蹂躏了英格兰，俘虏了坎特伯雷总主教亚斐奇，并最终未能从自己战士的手中救下他。而后，他先后为埃塞尔雷德国王和克努特大帝效力，成为北海帝国最有权势的雅尔之一。"
 historical_character.botond: "博通德是一位十世纪中期传奇的马扎尔战士。据匈牙利编年史记载，他曾一斧砸碎了君士坦丁堡的铁门，并在单挑中击败了拜占庭的勇士。无论他是否真实存在过，他的名字已成为马扎尔人勇力的代名词。"
 historical_character.anonymus_belae_regis: "人们仅知道他被称为“P大师”或佚名，这位国王贝洛三世的无名公证员，大约在十二与十三世纪之交撰写了《匈牙利人事迹》。他这部关于马扎尔人征服的拉丁语编年史，将系谱与富有想象力的传说融为一体，至今仍是关于匈牙利起源的基础叙事作品。"
 historical_character.friar_julianus: "尤利奥努什会士是一位十三世纪匈牙利的道明会士，他经历过两次向东寻找马扎尔人故土的非凡之旅。他在巴什基尔发现了一个讲匈牙利语的社群，但第二次却因蒙古人挺进的消息而中止旅程——这一警告很快就会席卷整个匈牙利。"
 historical_character.simon_of_keza: "凯佐的西蒙是一位国王拉斯洛四世宫廷中的匈牙利圣职人员，约在1283年撰写了《匈人暨匈牙利人事迹》。他的编年史详细阐述了马扎尔人与匈人同源的神话，将阿提拉塑造为匈牙利人的先王——这一观念将在数个世纪里塑造匈牙利的民族认同。"
 historical_character.miklos_toldi: "米克洛什·托尔迪这位匈牙利的传奇大力士，生活在“伟大者”拉约什统治时期。在歌谣和编年史中，他被塑造成一位农民出身的英雄，以惊人的力量通过战功赢得宫廷的恩宠。他的故事在十九世纪亚诺什·奥洛尼的笔下，成为匈牙利的民族史诗。"
 historical_character.gallus_anonymus: "高卢无名氏是一位匿名的本笃会修士——可能是法兰克人或威尼斯人——他在十二世纪初于“歪嘴”博莱斯瓦夫三世的宫廷撰写了波兰最早的叙事编年史。其《波兰王公事迹》至今仍是波兰史学的奠基之作。"
 historical_character.benedict_the_pole: "“波兰人”本笃是一位十三世纪的方济会士，曾陪同乔瓦尼·达皮安·德尔卡尔皮内（若望·柏朗嘉宾）作为教宗特使出使哈剌和林贵由大汗的宫廷，一路历经艰险。他关于蒙古世界的拉丁语报告简短而生动，是欧洲对东部草原最早的可信记述之一。"
 historical_character.nestor_chronicler: "涅斯托尔是一位基辅洞窟修道院的修士，传统上被认为是《往年纪事》（早期罗斯人的基础史籍）的编纂者。他的著作塑造了俄罗斯人对自身历史、信仰和统治数个世纪的留里克王朝的认知。"
 historical_character.andrei_rublev: "安德烈·鲁布廖夫是一位俄罗斯东正教修士，中世纪莫斯科大公国最负盛名的圣像画家。他为圣塞尔吉圣三一修道院绘制的光彩熠熠的《三位一体》圣像画，被广泛视为俄罗斯神圣艺术的最高杰作。"
 historical_character.muireadhach_albanach: "“阿尔巴人”穆雷达赫·奥达利是一位十三世纪早期爱尔兰的吟游诗人，出身于声名显赫的奥达利家族。他在杀死自己赞助人的管家后逃往苏格兰——因此获得了“阿尔巴人”（即苏格兰人）的绰号——后来参加了十字军，之后又回到爱尔兰，为爱尔兰海两岸的盖尔领主作诗。"
 historical_character.dafydd_ap_gwilym: "戴维兹·阿普·格威利姆被公认为中世纪威尔士最伟大的诗人，是一位十四世纪“对句体”诗歌的大师。他的诗句时而俏皮，时而虔诚，时而情色，将古典威尔士传统与欧洲大陆的宫廷时尚融为一体。"
 historical_character.stephen_hagiochristophorites: "斯蒂芬·圣赫里斯托福里蒂斯是皇帝安德罗尼科斯一世·科穆宁朝中臭名昭著的宠臣和首席执行者。以其残酷的敲诈和政治谋杀闻名。1185年他试图逮捕伊萨克·安杰洛斯时灾难性地失手了，这引发了推翻安德罗尼科斯一世、终结科穆宁统治的起义。"
 historical_character.george_akropolites: "乔治·阿克罗波利蒂斯是一位十三世纪的拜占庭政治家、学者、史学家，供职于尼西亚帝国和复辟的巴列奥略帝国宫廷。他的编年史记述了君士坦丁堡被拉丁人洗劫至光复之间年代的史实，是理解这一关键时期的主要史料。"
 historical_character.al_farabi: "阿布‑纳斯尔·法拉比是一位十世纪伊斯兰黄金时代的哲学家，因其对希腊思想深刻的评注而被誉为继亚里士多德之后的“第二导师”。他活跃于巴格达、阿勒颇和大马士革，著有关于逻辑学、形而上学、音乐理论和理想的政治秩序的著作。"
 historical_character.al_mutanabbi: "穆太奈比是一位十世纪的阿拉伯诗人，常被誉为最伟大的阿拉伯语诗人。他生于库法的寒微之家，其激烈的颂诗和尖刻的讽刺诗赢得了哈姆丹王朝王子赛义夫·道拉的赞助，但他本人的傲慢使其树敌无数，最终在沙漠途中遇袭身亡。"
 historical_character.munis_al_muzaffar: "穆尼斯·穆扎法尔是一位希腊出生的阉奴，后来崛起为阿拔斯哈里发国后期最有权势的将军和事实上的摄政。他维持了帝国三十年的统一，镇压叛乱，抵御外侮，不料却被自己扶上宝座的那位哈里发罢黜并处决。"
 historical_character.ibn_zaydun: "伊本·宰敦是一位十一世纪的安达卢斯诗人和政治家，出身于科尔多瓦贵族家庭。他与伍麦叶公主兼诗人瓦拉达·宾特·穆斯塔克菲注定失败的爱情，催生出了阿拉伯语中最负盛名的情诗。"
 historical_character.al_razi: "阿布‑贝克尔·拉齐，在中世纪欧洲被称为“拉齐斯”，是一位九至十世纪的波斯博学家，是他那个时代最杰出的医师。他的临床观察首次区分出了天花和麻疹，他庞大的医学百科全书《医学集成》几个世纪以来一直是拉丁欧洲的标准教材。"
 historical_character.ibn_tufail: "伊本·图费勒是一位十二世纪安达卢西亚的博学家——医师、哲学家和穆瓦希德哈里发的维齐尔——以其哲学小说《哈义·本·叶格赞的故事》最为知名。该故事讲述了一个在荒岛上获得了精神真理的野孩子，这影响了从斯宾诺莎到《鲁滨逊漂流记》作者的欧洲思想家。"
 historical_character.ibn_hazm: "伊本·哈兹姆是一位十一世纪安达卢西亚涉猎广泛的思想家，字面直解的扎希里派教法学家，著有《鸽子的项圈》——古典阿拉伯语中最著名的爱情论著。他对自己侍奉的科尔多瓦伍麦叶哈里发国的崩溃愤愤不平，晚年转向了尖刻的宗教论战。"
 historical_character.attar: "法里德丁·阿塔尔是一位波斯的苏菲派诗人和内沙布尔的药剂师。他的《百鸟朝凤》以寓言形式描绘了灵魂走向神圣的旅程。他的诗篇成为后世波斯神秘主义的重要源泉之一，深刻影响了鲁米和苏菲派传统。"
 historical_character.saadi_shirazi: "设拉子的萨阿迪是一位十三世纪的波斯诗人，在蒙古人席卷而来后，他在数十年中从安纳托利亚游荡到了印度。他的《果园》和《蔷薇园》融合了机智、温暖与处世智慧，这让他成为几个世纪以来波斯语世界中读者最广泛的诗人。"
 historical_character.hafez: "设拉子的哈菲兹是一位十四世纪波斯的抒情诗人。他的加扎勒抒情诗时而狂喜，时而反讽，时而静穆虔诚，被尊为波斯语诗歌的最高成就。时至今日，在伊朗家庭中，他的《诗集》仍被当作占卜书来查阅。"
 historical_character.nizami_ganjavi: "尼扎米·占贾维是一位十二世纪占贾的波斯诗人，他创作的五部伟大的浪漫叙事诗——《五卷诗》——是古典波斯语文学的支柱。他讲述的蕾莉与马杰农、霍斯陆与席琳的故事，成为整个波斯化世界叙事诗的标杆。"
 historical_character.chishti: "穆尔因丁·契斯提是一位出生于波斯的苏菲派神秘主义者，约于1192年在罗阇萨傥那的阿杰梅尔定居，并在印度创立了契斯提教团。他以普世慈悲的伦理而闻名，其圣陵至今仍是次大陆最受人喜爱的朝圣地之一，吸引着各种信仰的信众。"
 historical_character.auliya: "尼扎姆丁·奥利亚是一位十三至十四世纪德里契斯提教团的苏菲派大师，因接纳一切信仰与阶层的人群而在苏丹国内广受爱戴。他关于内在虔诚与无私服务的教导，塑造了数个世纪的印度灵性生活，并为其弟子阿米尔·霍斯劳的诗作提供了灵感。"
 historical_character.amir_khusrau: "阿米尔·霍斯劳是一位波斯语诗人、廷臣和音乐家，曾侍奉七任德里苏丹。作为尼扎姆丁·奥利亚的虔诚门徒，他被认为帮助塑造了早期印达维语的雏形，并为印度斯坦音乐传统奠定了基础。"
 historical_character.ferdowsi: "菲尔多西是一位十至十一世纪的波斯诗人，他耗费三十多年创作的巨著《列王纪》（约五万联）用其祖先的语言，保存了伊朗神话与英雄的过往。他生前虽未获厚报，而今却被尊为波斯语的救星。"
 historical_character.ibn_fadlan: "伊本·法德兰是一位十世纪阿拔斯王朝的使节，奉哈里发穆克塔迪尔之命出使伏尔加保加尔人的汗廷。他生动的游记——包括一段罗斯酋长在伏尔加河上举行水葬的著名的目击描述——仍是研究中世纪早期草原及诺斯东部最珍贵的史料之一。"
 historical_character.nizam_al_mulk: "尼扎姆·穆勒克这位杰出的波斯维齐尔，在苏丹阿尔普·阿尔斯兰和马立克沙治下，于塞尔柱帝国实际掌权近三十年。他的《治国策》阐明了中世纪波斯的王权理论，他创办的尼扎姆宗教学校网，塑造了数个世纪的逊尼派学术。"
 historical_character.yusuf_khass_hajib: "玉素甫·哈斯·哈吉甫是一位十一世纪喀喇汗王朝的学者，出自裴罗将军城，他撰写了现存最早的重要突厥语著作《福乐智慧》。其中讽喻性的诗句阐述了治国、公正与美好生活，使他获得了“哈斯·哈吉甫（御前侍臣）”的宫廷头衔。"
 historical_character.kashgari: "马哈茂德·喀什噶里是一位十一世纪喀喇汗王朝的词典编纂者，遍游突厥语世界，编纂了《突厥语大词典》——一部综合性的阿拉伯语‑突厥语词典与民族志。他悉心收集的方言、民歌、谚语以及已知最早的突厥语世界地图，是一扇了解中世纪大草原无可比拟的窗口。"
 historical_character.yunus_emre: "尤努斯·埃姆雷是一位十三至十四世纪安纳托利亚的苏菲派神秘主义者和民间诗人。他用土耳其方言创作的朴素的礼拜诗，有助于将这门语言塑造成高雅文学的载体。他传达出的人文与宽容的要旨，使其成为土耳其宗教传统中最受人爱戴的人物之一。"
 historical_character.ahmad_yasawi: "艾哈迈德·亚萨维是一位十二世纪赛拉姆的苏菲神秘主义者，创立了亚萨维教团，这是第一个在中亚突厥民族中扎根的苏菲派大教团。他的突厥语虔敬诗集《智慧集》带着伊斯兰教深入草原，塑造了该地区几个世纪的精神风貌。"
 historical_character.haji_bektash: "哈吉·拜克塔什·韦利是一位十三世纪的苏菲派神秘主义者，在蒙古入侵后从呼罗珊迁至安纳托利亚。他关于内在虔诚与宽容的教导催生了拜克塔什教团，该教团后来成为耶尼切里军团的精神核心以及安纳托利亚阿列维派传统的基石。"
 historical_character.yelu_chucai: "耶律楚材是一位契丹的士大夫，曾担任成吉思汗和窝阔台汗的首席谋臣。作为儒家与佛学的虔诚信奉者，他坚持不懈的谏言拯救了华北大片土地免遭屠戮，没被改作草场，他也使蒙古大汗信服，一个安定纳税的帝国远比一片赤地焦土更能带来长远的收益。"
 historical_character.su_shi: "苏轼，号东坡居士，是一位北宋时期的全才——不仅是词人、画家、书法家、政治家，还是一位美食家。他的诗赋散文，以及贬谪到江南岭外湿热瘴疠之地时写下的自嘲书信，使他成为中国历史上最受人喜爱的文人之一。"
 historical_character.zhu_xi: "朱熹是一位十二世纪南宋的哲学家。他融会儒、释、道三家思想，重塑了东亚的思想体系。他的 《四书章句集注》 在之后七个世纪里，成为中国、朝鲜和越南科举考试制度的基础。"
 historical_character.jayadeva: "阇耶提婆是一位十二世纪旁伽罗地区的梵语诗人，他的抒情诗《牧童歌》将奎师那与罗陀的爱情改写成崇高的宗教寓言。他的诗篇成为奉爱运动的核心内容，至今仍然传唱于从乌里舍到喀拉拉的神庙中。"
