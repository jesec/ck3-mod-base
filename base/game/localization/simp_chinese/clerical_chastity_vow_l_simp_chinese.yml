l_simp_chinese:
 request_clerical_chastity_interaction: "要求发贞洁誓愿"
 request_clerical_chastity_interaction_desc: "要求[recipient.GetShortUINameNoTooltip]向[recipient.GetFaith.HighGodName]立下贞洁誓愿。如果[recipient.GetSheHe]同意，[recipient.GetSheHe]会承受长期的[fertility|E]惩罚，且在誓言结束或放弃前无法开始勾引或求爱。"
 request_clerical_chastity_notification_text: "向[actor.GetFaith.HighGodName]立下此誓，将你的肉体束缚于于戒律之中。你的服从将荣耀[actor.GetFaith.GetAdjectiveNoTooltip]信仰。"
 clerical_chastity_offer_piety: "提供虔诚"
 clerical_chastity_recipient_must_be_in_reach_tt: "你必须是[head_of_faith|E]或持有至少[duchy|E]级的[title|E]，除非[recipient.GetShortUINameNoTooltip]本人持有与你相邻的[county|E]"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip]必须是[head_of_faith|E]或持有至少[duchy|E]级[title|E]，除非[recipient.GetShortUINameNoTooltip]亲自持有与[puppet_or_actor.GetShortUINamePossessiveNoTooltip]相邻的[county|E]"
 clerical_chastity_vow_blocks_scheme_tt: "你不能受[GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|L]约束"
 request_clerical_chastity_actor_toast: "同意要求"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName]同意[puppet_or_actor.GetShortUIName]的要求"
 request_clerical_chastity_recipient_toast: "发贞洁誓愿"
 request_clerical_chastity_decline_actor_toast: "拒绝要求"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName]拒绝[puppet_or_actor.GetShortUIName]的要求"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName( recipient.Self )]是我的[faith|E]的美德：$VALUE|=+0$"
 clerical_chastity_ai_rival: "[actor.GetShortUINameNoTooltip|U]的仇敌：$VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "我的[clerical_region|E]的[realm_capital|E]：$VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "提高额外[piety|E]：$VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[recipient.GetSheHe|U]是[recipient.GetTitleAsNameNoTooltip|U]：$VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "撤回贞洁誓愿"
 renounce_clerical_chastity_vow_decision_confirm: "放弃誓言"
 renounce_clerical_chastity_vow_decision_desc: "我立下此誓，是因为一位司铎要求我守贞。我可以放弃它，但违背神圣的承诺会让我付出[piety|E]的代价，并成为我良心上的负担。"
 renounce_clerical_chastity_vow_decision_tooltip: "提前结束誓言。你失去[piety|E]，承受[stress|E]，并且使你的[clergy_opinion|E]降低，持续10年。"
 renounce_clerical_chastity_vow_toast: "放弃誓言"
 renounce_clerical_chastity_vow_toast_desc: "你放弃你的贞洁誓愿。"
 clerical_chastity_vow.0001.toast_released: "誓言结束"
 clerical_chastity_vow.0001.toast_released_desc: "你立下的誓言已经到期。"
