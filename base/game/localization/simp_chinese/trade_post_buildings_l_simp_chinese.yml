 building_type_trade_blacksmith_quarter_01: "锻铁场"
 building_type_trade_blacksmith_quarter_01_desc: "金属的价值全在于其纯度，因此每一块进入这座锻造场的金属锭都要经过称重、检测并打上戳记。"
