 trade_food_depot_05: "$building_type_trade_food_depot_01$ V"
 # Cloth Hall #
 building_type_trade_cloth_hall_01: "织机房"
 building_type_trade_cloth_hall_01_desc: "一卷卷羊毛布、亚麻布和丝绸在该织机房中被采购、检验并存放，随后运往海外。"
