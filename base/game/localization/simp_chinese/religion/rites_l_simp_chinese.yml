 mozarabic_church: "穆扎赖卜礼"
 mozarabic_church_adj: "穆扎赖卜派"
 mozarabic_church_adherent: "穆扎赖卜人"
 mozarabic_church_adherent_plural: "穆扎赖卜人"
 mozarabic_church_desc: "穆扎赖卜礼承袭自早期伊比利亚礼仪。因长期处于伊斯兰政权统治之下，该礼仪维持了对罗马一定程度的独立性。长久与异教族群混居共存的历史，使其相较于更为基要主义的派别，对信仰差异具备更高的包容度。"
 ambrosian_rite: "安布罗斯礼"
 ambrosian_rite_adj: "安布罗斯礼"
 ambrosian_rite_adherent: "安布罗斯礼基督徒"
 ambrosian_rite_adherent_plural: "安布罗斯礼基督徒"
 ambrosian_rite_desc: "自伟大的圣安布罗斯主教时代起，米兰总教区便奉行安布罗斯礼。该礼仪保留着自己的礼拜和圣咏，并重视希波的圣奥古斯丁思想的神学传统。"
 beneventan_rite: "贝内文托礼"
 beneventan_rite_adj: "贝内文托礼"
 beneventan_rite_adherent: "贝内文托礼基督徒"
 beneventan_rite_adherent_plural: "贝内文托礼基督徒"
 beneventan_rite_desc: "伦巴第南部的礼仪传统，以贝内文托和卡西诺山大修道院为中心。其独特的圣咏和礼仪规范使其有别于罗马礼，而罗马正以日益增长的怀疑目光注视着这一礼仪。"
 carolingian_christianity: "加洛林礼"
 carolingian_christianity_adj: "加洛林礼"
 carolingian_christianity_adherent: "加洛林礼基督徒"
 carolingian_christianity_adherent_plural: "加洛林礼基督徒"
 carolingian_christianity_desc: "加洛林礼是成型于加洛林王朝统治时期的基督教礼仪，核心特质为推崇隐修修行与对外传教事业。"
 byzantine_rite: "希腊礼"
 byzantine_rite_adj: "希腊礼"
 byzantine_rite_adherent: "希腊礼基督徒"
 byzantine_rite_adherent_plural: "希腊礼基督徒"
 byzantine_rite_desc: "君士坦丁堡牧首区是正统教会最重要的信仰核心之一，坐拥底蕴深厚的神学传承与深远的历史影响力。希腊礼直接承袭自当地牧首教会的体系。"
 antiochian_rite: "安条克礼"
 antiochian_rite_adj: "安条克礼"
 antiochian_rite_adherent: "安条克基督徒"
 antiochian_rite_adherent_plural: "安条克基督徒"
 antiochian_rite_desc: "安条克牧首区是最古老的基督教社群之一，由圣伯多禄与圣保禄两位宗徒亲自立会奠基。该教会承袭西叙利亚传统，因主持教会重组的雅各·巴拉戴乌斯而得名“雅各派”。其在教义上恪守合性论，并沿用古老的圣雅各礼拜仪式。"
 slavic_rite: "斯拉夫礼"
 slavic_rite_adj: "斯拉夫礼"
 slavic_rite_adherent: "斯拉夫基督徒"
 slavic_rite_adherent_plural: "斯拉夫基督徒"
 slavic_rite_desc: "这一礼仪由基里尔与麦托迪兄弟传入斯拉夫诸部族。该礼仪吸纳拜占庭礼仪元素，依托格拉哥里字母，适应了斯拉夫族群的语言与民俗文化。"
 georgian_rite: "格鲁吉亚礼"
 georgian_rite_adj: "格鲁吉亚礼"
 georgian_rite_adherent: "格鲁吉亚基督徒"
 georgian_rite_adherent_plural: "格鲁吉亚基督徒"
 georgian_rite_desc: "格鲁吉亚礼代表格鲁吉亚的基督教传统，拥有自成一体的礼拜典制与教会传承，与东正教的神学理论与修行范式联系紧密。"
 coptic_rite: "科普特礼"
 coptic_rite_adj: "科普特礼"
 coptic_rite_adherent: "科普特基督徒"
 coptic_rite_adherent_plural: "科普特基督徒"
 coptic_rite_desc: "科普特教会将自身的起源追溯到福音书作者圣马尔谷，既是基督教隐修制度的起源地，也保持了发扬教育和哲学的长期传统，并因此闻名于世。"
 ethiopian_rite: "吉兹礼"
 ethiopian_rite_adj: "吉兹礼"
 ethiopian_rite_adherent: "吉兹基督徒"
 ethiopian_rite_adherent_plural: "吉兹基督徒"
 ethiopian_rite_desc: "吉兹礼以埃塞俄比亚高地为信仰核心，继承了阿克苏姆古王国的信仰遗产。它与其他亚历山大教会礼仪同属一脉，但圣经正典收录篇目更广博，隐修体系更完备，且传承有所罗门王族延续千年的金约。"
 armenian_rite: "亚美尼亚使徒礼"
 armenian_rite_adj: "亚美尼亚使徒礼"
 armenian_rite_adherent: "亚美尼亚使徒礼基督徒"
 armenian_rite_adherent_plural: "亚美尼亚使徒礼基督徒"
 armenian_rite_desc: "由宗徒巴尔多禄茂和达陡建立的亚美尼亚宗徒教会，在亚美尼亚迅速获得信徒，将亚美尼亚王国牧化为有史以来第一个将基督教确立为官方宗教的国家。"
 apostolic_religious_head_title: "卡托利科斯"
 apostolic_religious_head_title_plural: "卡托利科斯"
 apostolic_religious_head_title_name: "教座"
 # Nabi
 nabi: "先知派"
 nabi_adj: "先知派"
 nabi_adherent: "先知派信徒"
 nabi_adherent_plural: "先知派信徒"
 nabi_desc: "诚如《古兰经》明文所示，先知受全能真主拣选，奉命传达祂的启示，警醒世人复生日的降临——彼时众人将被召集于祂面前，为自身一切所作所为接受审判。核心教义明确，先知穆罕默德是众先知中的最后一位。"
 # Pre madhabs
 sahabah: "直传派"
 sahabah_adj: "直传派"
 sahabah_adherent: "直传弟子"
 sahabah_adherent_plural: "直传弟子"
 sahabah_desc: "亦被称作穆罕默德的“圣伴”，指其在世期间亲身会面、见证过先知的穆斯林追随者。直传弟子在早期伊斯兰圣战、社会建构、圣训传述与领地治理中，发挥了无可替代的作用。"
 tabiun: "再传派"
 tabiun_adj: "再传派"
 tabiun_adherent: "再传弟子"
 tabiun_adherent_plural: "再传弟子"
 tabiun_desc: "追随直传弟子（圣伴），在后来的逊尼派教法学派诞生前承接其教义传承的一代穆斯林。"
 # Sunni
 hanafi: "哈乃斐派"
 hanafi_adj: "哈乃斐派"
 hanafi_adherent: "哈乃斐派信徒"
 hanafi_adherent_plural: "哈乃斐派信徒"
 hanafi_desc: "由法学家、教义学家艾布·哈尼法奠基成型，首重理性推演在教法释疑中的体系化运用。哈乃斐教法体系以《古兰经》、圣训、公议与类比为四大核心法源。"
 hanbali: "罕百里派"
 hanbali_adj: "罕百里派"
 hanbali_adherent: "罕百里派信徒"
 hanbali_adherent_plural: "罕百里派信徒"
 hanbali_desc: "伊斯兰教逊尼派四大教法学派中规模最小的一支，承袭艾哈迈德·伊本·罕百勒的学说根基。该学派排斥人为编纂的成文法典体系，独尊《古兰经》与圣训为至高无上的教法本源。"
 maliki: "马立克派"
 maliki_adj: "马立克派"
 maliki_adherent: "马立克派信徒"
 maliki_adherent_plural: "马立克派信徒"
 maliki_desc: "伊斯兰教逊尼派四大主流教法学派之一，由学者马立克·本·艾奈斯于八世纪创立。马立克派与其他逊尼教法学派的核心差异，集中在教法判例的渊源选取与采信标准。"
 shafii: "沙斐仪派"
 shafii_adj: "沙斐仪派"
 shafii_adherent: "沙斐仪派信徒"
 shafii_adherent_plural: "沙斐仪派信徒"
 shafii_desc: "得名于九世纪初期，被誉为“伊斯兰法理学之父”的伊斯兰法学泰斗沙斐仪。该学派核心主张：信众一切受沙里亚法约束的行为，皆能在天启律法（沙里亚法）中找到明确规制依据。"
 #Ismaili
 ismaili: "伊斯玛仪派"
 ismaili_adj: "伊斯玛仪派"
 ismaili_adherent: "伊斯玛仪派"
 ismaili_adherent_plural: "伊斯玛仪派信徒"
 ismaili_desc: "什叶派主要支派之一，主张承载神圣真知、具备无谬性的正统伊玛目世系由伊斯玛仪·本·贾法尔承系。因伊斯玛仪为穆罕默德之后第七任伊玛目，该派也被称作“七伊玛目派”。"
 #Qarmatians
 qarmatian: "卡尔马特派"
 qarmatian_adj: "卡尔马特派"
 qarmatian_adherent: "卡尔马特派"
 qarmatian_adherent_plural: "卡尔马特派信徒"
 qarmatian_desc: "伊斯玛仪派的一支，吸收了祆教的元素。伊玛目的数量被真主预定为七位，因此在第七位伊玛目——穆罕默德·伊本·伊斯玛仪——回归指引信士之前，不会再有伊玛目。"
 #Nizari
 nizari: "尼扎里耶派"
 nizari_adj: "尼扎里耶派"
 nizari_adherent: "尼扎里耶派"
 nizari_adherent_plural: "尼扎里耶派信徒"
 nizari_desc: "该派别强调以理性思辨解读《古兰经》与圣训，奉行伊玛目世袭制度，追认阿里为神圣谱系的初代源头。"
 #Zayidi
 zayidi: "栽德派"
 zayidi_adj: "栽德派"
 zayidi_adherent: "栽德派"
 zayidi_adherent_plural: "栽德派信徒"
 zayidi_desc: "真伊玛目并非不谬，而由他们与腐化和邪恶的斗争确立。所以栽德派信仰栽德·伊本·阿里是伊玛目一职的正统继承者，因为他起义反抗了伍麦叶王朝。"
 #Imamism (Twelver)
 imami: "十二伊玛目派"
 imami_adj: "十二伊玛目派"
 imami_adherent: "十二伊玛目派"
 imami_adherent_plural: "十二伊玛目派信徒"
 imami_desc: "十二伊玛目派相信有十二位伊玛目被预言要领导乌玛，而第十二位伊玛目，扎曼，正等待着回归引领穆斯林进入审判日。"
 islam_ayatollah: "阿亚图拉"
 islam_ayatollah_plural: "阿亚图拉"
 ghulat: "伊赫提拉夫派"
 ghulat_adj: "伊赫提拉夫派"
 ghulat_adherent: "伊赫提拉夫派"
 ghulat_adherent_plural: "伊赫提拉夫派信徒"
 ghulat_desc: "伊赫提拉夫派相信从阿里开始伊玛目不谬的神性。真主不仅任命并启迪了他们，更部分居住于他们内以指引他们的行为，和延伸出去的整个乌玛。"
 alawite: "阿拉维派"
 alawite_adj: "阿拉维派"
 alawite_adherent: "阿拉维派信徒"
 alawite_adherent_plural: "阿拉维派信徒"
 alawite_desc: "阿拉维派有隐秘的宗教教义，古兰经只是他们的圣典之一。除了相信通过阿里传承的伊玛目之外，阿拉维派也相信转世，以及众生都是被逐出天园的星辰，现在必须成功过上美善与虔诚的生活，才能重获自己的位置。"
 #Alevis
 alevi: "阿列维派"
 alevi_adj: "阿列维派"
 alevi_adherent: "阿列维派"
 alevi_adherent_plural: "阿列维派信徒"
 alevi_desc: "阿列维派相信十二伊玛目的传承，但也遵行其圣典集《天命》中描绘的许多其他传统。在阿列维派传统中，真主就是真理，穆罕默德与阿里是祂在这个世界的显现。"
