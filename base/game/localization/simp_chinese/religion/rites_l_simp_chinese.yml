l_simp_chinese:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "[Rite.GetNameNoTooltip]由[Character.GetFullName]在[GetCurrentDate.GetStringLong]创立于[Character.GetCurrentLocation.GetTitle.GetAdjective]，被视为[Faith.GetAdjective]信仰体系下的一种礼仪。[Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "[Rite.GetNameNoTooltip]由[Character.GetFullName]创立于[GetCurrentDate.GetStringLong]，被视为[Faith.GetAdjective]信仰体系下的一种礼仪。[Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "该礼仪在所属母信仰框架内，保有独特的虔敬修行取向。"
 generic_rite_focus_tenet_aniconism: "该礼仪摒弃一切神圣造像，借由具象缺席、自我节制与无形神性的圣洁，修习敬畏之心。"
 generic_rite_focus_tenet_alexandrian_catechism: "该礼仪重视学识教化、精深教义与对信众持久且审慎的训导培育。"
 generic_rite_focus_tenet_armed_pilgrimages: "该礼仪视圣战与武装朝圣为虔信者必须履行的神圣义务。"
 generic_rite_focus_tenet_carnal_exaltation: "该礼仪将欲望和肉体欢愉尊为天赐馈赠。"
 generic_rite_focus_tenet_communal_identity: "该礼仪将信仰实践深度绑定集体习俗、共同生活和排斥变化的社群身份。"
 generic_rite_focus_tenet_communion: "该礼仪以共同修持、布施济贫及与精神领袖的灵性共融，凝聚信仰共同体。"
 generic_rite_focus_tenet_consolamentum: "该礼仪主张借由弃绝世俗和坚定地预备死亡达成终极净化。"
 generic_rite_focus_tenet_divine_marriage: "该礼仪为世俗结合与统治权柄赋予神圣意义，视神圣婚配为神圣秩序的现世投射。"
 generic_rite_focus_tenet_gnosticism: "该礼仪追寻现世表象之下的隐秘真知，主张救赎唯有依托神圣秘知方可成就。"
 generic_rite_focus_tenet_mendicant_preachers: "该礼仪依靠云游的传道者、谦卑的信仰见证与持之以恒的教义宣讲，向外传播信仰。"
 generic_rite_focus_tenet_pacifism: "该礼仪推崇克制与和平，将不必要的流血视作灵魂的严重堕落。"
 generic_rite_focus_tenet_pentarchy: "该礼仪尊崇古老教座权威，倡导以有序治理统合全域信仰体系。"
 generic_rite_focus_tenet_unrelenting_faith: "该礼仪称颂坚定不移的信仰热忱、坚韧的心志，以及为神圣理想挺身抗争的信念。"
 generic_rite_focus_tenet_vows_of_poverty: "该礼仪崇尚神贫，劝勉信众舍弃奢靡，以简朴的方式生活。"
 generic_rite_focus_tenet_pastoral_isolation: "该礼仪主张隔绝式牧养信众群体，坚守信仰边界，拒绝做出妥协。"
 generic_rite_focus_tenet_rite: "该礼仪极度重视礼仪典制、神职阶序体系与历代神圣传统的保存。"
 generic_rite_focus_tenet_adaptive: "该礼仪的特征柔韧变通而不失根本，在吸纳地方风俗的同时，坚守自身神圣核心。"
 generic_rite_focus_tenet_esotericism: "该礼仪推崇隐秘智慧与入道秘传，认为神圣真理仅向已做好准备之人启示。"
 generic_rite_focus_tenet_legalism: "该礼仪将神圣性植根于明晰律法、中正裁断与井然有序的生命规训之中。"
 generic_rite_focus_tenet_literalism: "该礼仪恪守圣典原文，排斥宽松的诠释与继承而来的妥协。"
 generic_rite_focus_tenet_reincarnation: "该礼仪视灵魂旅途为循环往复的轮回进程，每一世皆塑造来世。"
 generic_rite_focus_tenet_religious_legal_pronouncements: "该礼仪赋予神圣律法与宗教正式裁决恒久的灵性权威。"
 generic_rite_focus_tenet_struggle_submission: "该礼仪主张，信仰需经由抗争、征服以及不敬神者的俯首归顺来证得。"
 generic_rite_focus_tenet_false_conversion_sanction: "该礼仪容许生存趋利之下的隐性顺服与表面伪装。"
 generic_rite_focus_tenet_tax_nonbelievers: "该礼仪将无信者视作应尽贡赋的依附群体，以世俗税赋巩固神圣等级秩序。"
 generic_rite_focus_tenet_asceticism: "该礼仪借由克己弃欲、身心苦修与情欲节制，谋求圣洁。"
 generic_rite_focus_tenet_bhakti: "该礼仪以赤诚奉爱为核心，主张以倾心顺服的虔信，令灵魂贴近神性本源。"
 generic_rite_focus_tenet_dharmic_pacifism: "该礼仪推崇不害与自制，视平和为凌驾忿怒的修行。"
 generic_rite_focus_tenet_inner_journey: "该礼仪主张反求诸己，依托内省修持、自律克己与自我革新，求得灵性觉醒。"
 generic_rite_focus_tenet_ritual_hospitality: "该礼仪将待客之礼定为神圣义务，以神圣习俗联结主客。"
 generic_rite_focus_tenet_adorcism: "该礼仪以虔敬之心崇奉诸灵，祈求蒙受灵恩眷顾，规避灵体的愤怒。"
 generic_rite_focus_tenet_ancestor_worship: "该礼仪向逝去先灵寻求指引与祝福，以此维系生者的延续。"
 generic_rite_focus_tenet_astrology: "该礼仪从天象运转中解读天意，深信星辰能昭示命运节律与行事时机。"
 generic_rite_focus_tenet_hedonistic: "该礼仪接纳宴乐与纵欲，在集体崇拜中将感官欢愉予以神圣化。"
 generic_rite_focus_tenet_human_sacrifice: "该礼仪视人牲血祭为凡人与神明之间可怖但神圣的契约。"
 generic_rite_focus_tenet_mystical_birthright: "该礼仪坚信部分灵魂生来身负天命，与生俱来便承载神圣权能与超凡灵性。"
 generic_rite_focus_tenet_ritual_celebrations: "该礼仪推崇集体宴饮和神圣节庆，认为其是信仰最完整的表达。"
 generic_rite_focus_tenet_sacred_childbirth: "该礼仪极为尊崇分娩，视母职孕育与新生命诞生为具有神圣意义的行为。"
 generic_rite_focus_tenet_sanctity_of_nature: "该礼仪于自然万物中见证神性，尊崇生命繁衍、大地丰饶与原生造化之圣。"
 generic_rite_focus_tenet_sun_worship: "该礼仪敬拜太阳，将其视作维系生机的秩序、光照与神恩之源。"
 generic_rite_focus_tenet_warmonger: "该礼仪颂扬征伐伟业与尚武精神，要求信众以沙场征战证明自身信仰。"
 generic_rite_focus_tenet_gruesome_festivals: "该礼仪奉行诡怖祭仪，以惊惧、血祭与肃穆京观构筑独特的神圣展演。"
 generic_rite_focus_tenet_cthonic_redoubts: "该礼仪将大地上的高耸山峦和隐秘之处奉为超凡神圣之所。"
 generic_rite_focus_tenet_household_gods: "该礼仪以家庭为核心，令家宅、宗族与日常修行皆受家神护佑。"
 generic_rite_focus_tenet_sinitic_syncretism: "该礼仪融合华夏思想体系，追求和谐而非割裂。"
 generic_rite_focus_tenet_eastern_syncretism: "该礼仪包容吸纳东方宗教教义，视异域智慧为神圣真理的同源回响。"
 generic_rite_focus_tenet_unreformed_syncretism: "该礼仪自由地承袭古老原始的习俗仪轨，融汇远古传统成为全新的神圣信仰体系。"
 generic_rite_focus_tenet_christian_syncretism: "该礼仪并不直接排斥基督教教义，而是以自身神圣框架重新诠释其教义内涵。"
 generic_rite_focus_tenet_islamic_syncretism: "该礼仪借鉴伊斯兰教义与习俗，从邻域的天启信仰中汲取可用的真理。"
 generic_rite_focus_tenet_jewish_syncretism: "该礼仪吸纳犹太教的传统律法与集体记忆，以此完善自身对神圣的认知。"
 generic_rite_focus_tenet_exaltation_of_pain: "该礼仪认定苦痛具备净化灵性之效，以主动承受伤痛、坚韧忍耐彰显虔诚信仰。"
 generic_rite_focus_tenet_natural_primitivism: "该礼仪警惕过度文明的奢靡腐化，推崇质朴原始、贴近自然的极简生活方式。"
 generic_rite_focus_tenet_pursuit_of_power: "该礼仪称颂远大抱负与世俗统治权，将世间权柄视作践行神圣旨意的正当工具。"
 generic_rite_focus_tenet_ritual_cannibalism: "该礼仪将吞食人肉纳入禁忌崇拜和神圣怖畏体系之内。"
 generic_rite_focus_tenet_sacred_shadows: "该礼仪披上秘密的面纱，圣化遮掩、朦胧以及不为世人所知的事物。"
 generic_rite_focus_tenet_polyamory: "该礼仪祝福多重爱情并存，拒绝将神圣的亲密关系局限于单一契约之内。"
 generic_rite_focus_tenet_sacrificial_ceremonies: "该礼仪以庄严献祭为崇拜核心，借神圣牺牲缔结誓约，以此换取神性护佑与恩典。"
 generic_rite_focus_tenet_megaliths: "该礼仪以不朽巨石划定神圣，依靠纪念石碑维系记忆与虔敬之心。"
 generic_rite_focus_tenet_fp3_fedayeen: "该礼仪将潜行、渗透与舍身式的暴力刺杀神圣化，号召信众为崇高信仰事业献身。"
 generic_rite_focus_tenet_communal_possessions: "该礼仪淡化私有财产，劝导信众践行资源共有。"
 generic_rite_focus_tenet_pure_land: "该礼仪将希望寄托于脱离苦痛的福乐圣境，依靠虔信、忆念与奉修抵达净土。"
 generic_rite_focus_tenet_no_mind: "该礼仪追求超越执念的清明境界，以自律修行，成就澄澈的本心。"
 generic_rite_focus_tenet_mountain_worship: "该礼仪视高山峻岭为贴近神性的圣域，将群山高地确立为核心崇敬对象。"
 generic_rite_focus_tenet_extinction_of_dharma: "该礼仪认定现世已被腐化侵蚀，为捍卫真理，准许施行严酷决绝的暴力。"
 generic_rite_focus_tenet_cranial_trophies: "该礼仪将敌人的遗骸视作神圣信物，用以彰显胜利与慑人的威望。"
 generic_rite_focus_tenet_pursuit_of_knowledge: "该礼仪将治学问道奉为神圣修行，借研习、论辩与审慎探究追寻真理。"
 generic_rite_focus_tenet_benevolent_governance: "该礼仪将公正治理、有序管辖与国家抚育，作为评判圣洁的标准之一。"
 generic_rite_focus_tenet_filial_piety: "该礼仪以敬亲尊老为伦理与神圣秩序的基石。"
 generic_rite_focus_tenet_harmonious_society: "该礼仪崇尚平衡、礼制与社群和睦，视作宇宙秩序的现世映照。"
 generic_rite_focus_tenet_sacred_destruction: "该礼仪视神圣毁灭为净化的手段，令崩坏与倾覆成为神圣革新的手段。"
 generic_rite_focus_tenet_preservation: "该礼仪推崇恒久与延续，以及对所托付之物的精心守护。"
 generic_rite_focus_tenet_takamin: "该礼仪满怀敬畏与恭谨之心，敬拜巨熊以及荒野之中一切原始的超凡灵力。"
 generic_rite_focus_tenet_peace_of_god: "该礼仪严格约束暴力行径，为杀伐流血划定神圣边界，限定武力行使的正当范围。"
 generic_rite_focus_tenet_dulia: "该礼仪尊崇圣徒与德行楷模，缅怀其圣行典范，却绝不将其等同神性。"
 generic_rite_focus_tenet_transubstantiation: "该礼仪坚信神圣奥迹具备真实的质变力量，使圣事成为神性临在的核心。"
 generic_rite_focus_tenet_ora_et_labora: "该礼仪将祷告与劳作相结合，主张恪守秩序的勤勉劳作，本身即是一种灵性奉侍。"
 generic_rite_focus_tenet_hyperdulia: "该礼仪尤为尊崇至圣代祷者，其敬礼规格远超普通圣徒。"
 generic_rite_focus_tenet_simony: "该礼仪承认圣职权柄、信仰庇护与世俗财富难以彻底割裂的现实处境。"
 generic_rite_focus_tenet_monophysitism: "该礼仪宣告了基督性体的唯一性，拒绝生硬割裂基督神性的奥义。"
 generic_rite_focus_tenet_acts_of_apostles: "该礼仪效仿宗徒的社群模式，以初代信徒的慈善布施与集体生活作为信仰践行的范本。"
 generic_rite_focus_tenet_purgatory: "该礼仪教导多数灵魂需经历死后涤罪净化，方能超脱罪污，进入圆满永福之境。"
 generic_rite_focus_tenet_be_fruitful_and_multiply: "该礼仪尊崇家庭伦理与血脉繁衍，视孕育新生、延续族群为信众的神圣天职。"
 generic_rite_focus_tenet_apostolic_succession: "该礼仪以连绵不绝的传承链确立神职权威，道统渊源直溯诸位宗徒。"
 generic_rite_focus_tenet_confession: "该礼仪重视公开补赎与罪赦恩典，相信直言袒露罪愆是灵魂疗愈的开端。"
 generic_rite_focus_tenet_original_sin: "该礼仪认为人性软弱与生俱来，一切降世灵魂，皆无法脱离沾染。"
 generic_rite_focus_tenet_celestial_hierarchy: "该礼仪将宇宙构筑为层级严明的神圣秩序，各个位阶皆源自神圣的规划。"
 generic_rite_focus_tenet_miles_christi: "该礼仪将信众塑造为神圣战士，号召以坚定热忱捍卫信仰真理。"
 generic_rite_focus_tenet_scholasticism: "该礼仪依托义理争辩、经文注疏与理性和信仰的调和，不断打磨信理。"
 generic_rite_focus_tenet_adoptionism: "该礼仪强调被提升举扬与被收养而成为神圣之子，弱化了子的永恒特性。"
 generic_rite_focus_tenet_love_thy_neighbour: "该礼仪将慈悲宽恕与邻舍友爱确立为日常信仰生活的核心。"
 generic_rite_focus_tenet_divine_liturgy: "该礼仪尊崇庄严规整的祭仪典制，认为有序的集体崇拜是窥见神性最清晰的途径。"
 generic_rite_focus_tenet_miaphysitism: "该礼仪阐释了基督的一个位格下神性与人性不可分割的融合。"
 generic_rite_focus_tenet_hesychasm: "该礼仪依托静默凝神、身心止寂与内心持诵圣祷，追求与神性合一。"
 generic_rite_focus_tenet_anachoresis: "该礼仪推崇离俗遁世，于与世隔绝的孤居苦修之中修得圣洁。"
 generic_rite_focus_tenet_mortification_of_the_flesh: "该礼仪借由肉体苦修以得圣洁，使躯体全然服从灵性修行的目标。"
 generic_rite_focus_tenet_holy_myron: "该礼仪格外重视傅圣油仪式，将圣膏视作神圣恩宠的印记。"
 generic_rite_focus_tenet_khachkar: "该礼仪为雕刻十字的石碑赋予神圣意义，以恒久石刻作为信仰的公共见证。"
 generic_tenet_focus_fallback: "该信条在所属母信仰框架内，保有独特的虔敬修行取向。"
