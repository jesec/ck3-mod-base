 roman_rite: "罗马礼"
 roman_rite_adj: "罗马礼"
 roman_rite_adherent: "罗马礼基督徒"
 roman_rite_adherent_plural: "罗马礼基督徒"
 roman_rite_desc: "罗马礼是罗马教会的礼仪传统，由拉丁神学与教会法权体系塑造，着重恪守圣事规仪、圣职圣统与制度上的统一。"
 insular_celtic: "海岛礼"
 insular_celtic_adj: "海岛基督教"
 insular_celtic_adherent: "海岛基督徒"
 insular_celtic_adherent_plural: "海岛基督徒"
 insular_celtic_desc: "海岛礼源于数百年前偏离罗马天主教正统的海岛乡间教会，在母教会的强制规训之下，其大量独有的仪轨特征已然消亡，但该礼仪依旧高度重视忏悔补赎与修院制度，并保留了诸多与大陆主流基督教迥异的凯尔特传统婚俗。"
