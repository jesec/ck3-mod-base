 generic_tenet_focus_tenet_vows_of_poverty: "[GetTenetType('tenet_vows_of_poverty').GetName( GetPlayer.GetRite )]崇尚神贫，劝勉信众舍弃奢靡，以简朴的方式生活。"
 generic_tenet_focus_tenet_pastoral_isolation: "[GetTenetType('tenet_pastoral_isolation').GetName( GetPlayer.GetRite )]主张隔绝式牧养信众群体，坚守信仰边界，拒绝做出妥协。"
 generic_tenet_focus_tenet_adaptive: "[GetTenetType('tenet_adaptive').GetName( GetPlayer.GetRite )]的特征柔韧变通而不失根本，在吸纳地方风俗的同时，坚守自身神圣核心。"
 generic_tenet_focus_tenet_esotericism: "[GetTenetType('tenet_esotericism').GetName( GetPlayer.GetRite )]推崇隐秘智慧与入道秘传，认为神圣真理仅向已做好准备之人启示。"
 generic_tenet_focus_tenet_legalism: "[GetTenetType('tenet_legalism').GetName( GetPlayer.GetRite )]将神圣性植根于明晰律法、中正裁断与井然有序的生命规训之中。"
 generic_tenet_focus_tenet_literalism: "[GetTenetType('tenet_literalism').GetName( GetPlayer.GetRite )]恪守圣典原文，排斥宽松的诠释与继承而来的妥协。"
 generic_tenet_focus_tenet_reincarnation: "[GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )]视灵魂旅途为循环往复的轮回进程，每一世皆塑造来世。"
 generic_tenet_focus_tenet_religious_legal_pronouncements: "[GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )]赋予神圣律法与宗教正式裁决恒久的灵性权威。"
 generic_tenet_focus_tenet_struggle_submission: "[GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )]主张，信仰需经由抗争、征服以及不敬神者的俯首归顺来证得。"
 generic_tenet_focus_tenet_false_conversion_sanction: "[GetTenetType('tenet_false_conversion_sanction').GetName( GetPlayer.GetRite )]容许生存趋利之下的隐性顺服与表面伪装。"
 generic_tenet_focus_tenet_tax_nonbelievers: "[GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )]将无信者视作应尽贡赋的依附群体，以世俗税赋巩固神圣等级秩序。圣的等级秩序。"
 generic_tenet_focus_tenet_asceticism: "[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]借由克己弃欲、身心苦修与情欲节制，谋求圣洁。"
 generic_tenet_focus_tenet_bhakti: "[GetTenetType('tenet_bhakti').GetName( GetPlayer.GetRite )]以赤诚奉爱为核心，主张以倾心顺服的虔信，令灵魂贴近神性本源。"
 generic_tenet_focus_tenet_dharmic_pacifism: "[GetTenetType('tenet_dharmic_pacifism').GetName( GetPlayer.GetRite )]推崇不害与自制，视平和为凌驾忿怒的修行。"
 generic_tenet_focus_tenet_inner_journey: "[GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )]主张反求诸己，依托内省修持、自律克己与自我革新，求得灵性觉醒。"
 generic_tenet_focus_tenet_ritual_hospitality: "[GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )]将待客之礼定为神圣义务，以神圣习俗联结主客。"
 generic_tenet_focus_tenet_adorcism: "[GetTenetType('tenet_adorcism').GetName( GetPlayer.GetRite )]以虔敬之心崇奉诸灵，祈求蒙受灵恩眷顾，规避灵体的愤怒。"
 generic_tenet_focus_tenet_ancestor_worship: "[GetTenetType('tenet_ancestor_worship').GetName( GetPlayer.GetRite )]向逝去先灵寻求指引与祝福，以此维系生者的延续。"
 generic_tenet_focus_tenet_astrology: "[GetTenetType('tenet_astrology').GetName( GetPlayer.GetRite )]从天象运转中解读天意，深信星辰能昭示命运节律与行事时机。"
 generic_tenet_focus_tenet_hedonistic: "[GetTenetType('tenet_hedonistic').GetName( GetPlayer.GetRite )]接纳宴乐与纵欲，在集体崇拜中将感官欢愉予以神圣化。"
 generic_tenet_focus_tenet_human_sacrifice: "[GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )]视人牲血祭为凡人与神明之间可怖但神圣的契约。"
 generic_tenet_focus_tenet_mystical_birthright: "[GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )]坚信部分灵魂生来身负天命，与生俱来便承载神圣权能与超凡灵性。"
 generic_tenet_focus_tenet_ritual_celebrations: "[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )]推崇集体宴饮和神圣节庆，认为其是信仰最完整的表达。"
 generic_tenet_focus_tenet_sacred_childbirth: "[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )]极为尊崇分娩，视母职孕育与新生命诞生为具有神圣意义的行为。"
 generic_tenet_focus_tenet_sanctity_of_nature: "[GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )]于自然万物中见证神性，尊崇生命繁衍、大地丰饶与原生造化之圣。"
 generic_tenet_focus_tenet_sun_worship: "[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )]敬拜天空中灼热的圆轮，将其视作维系生机的秩序、光照与神恩之源。"
 generic_tenet_focus_tenet_warmonger: "[GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )]颂扬征伐伟业与尚武精神，要求信众以沙场征战证明自身信仰。"
 generic_tenet_focus_tenet_gruesome_festivals: "[GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )]奉行诡怖祭仪，以惊惧、血祭与肃穆京观构筑独特的神圣展演。"
 generic_tenet_focus_tenet_cthonic_redoubts: "[GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )]将大地上的高耸山峦和隐秘之处奉为超凡神圣之所。"
 generic_tenet_focus_tenet_household_gods: "[GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )]以家庭为核心，令家宅、宗族与日常修行皆受家神护佑。"
 generic_tenet_focus_tenet_sinitic_syncretism: "[GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )]融合华夏思想体系，追求和谐而非割裂。"
 generic_tenet_focus_tenet_eastern_syncretism: "[GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )]包容吸纳遥远之地的宗教教义，视异域智慧为神圣真理的同源回响。"
 generic_tenet_focus_tenet_unreformed_syncretism: "[GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )]自由地承袭古老原始的习俗仪轨，融汇远古传统成为全新的神圣信仰体系。"
 generic_tenet_focus_tenet_christian_syncretism: "[GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )]并不直接排斥基督教教义，而是以自身神圣框架重新诠释其教义内涵。"
 generic_tenet_focus_tenet_islamic_syncretism: "[GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )]借鉴穆斯林教义与习俗，从邻域的天启信仰中汲取可用的真理。"
 generic_tenet_focus_tenet_jewish_syncretism: "[GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )]吸纳希伯来人的传统律法与集体记忆，以此完善自身对神圣的认知。"
 generic_tenet_focus_tenet_exaltation_of_pain: "[GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )]认定苦痛具备净化灵性之效，以主动承受伤痛、坚韧忍耐彰显虔诚信仰。"
 generic_tenet_focus_tenet_natural_primitivism: "[GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )]警惕过度文明的奢靡腐化，推崇质朴原始、贴近自然的极简生活方式。"
 generic_tenet_focus_tenet_pursuit_of_power: "[GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )]称颂远大抱负与世俗统治权，将世间权柄视作践行神圣旨意的正当工具。"
 generic_tenet_focus_tenet_ritual_cannibalism: "[GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )]将吞食人肉纳入禁忌崇拜和神圣怖畏体系之内。"
 generic_tenet_focus_tenet_sacred_shadows: "[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]披上秘密的面纱，圣化遮掩、朦胧以及不为世人所知的事物。"
 generic_tenet_focus_tenet_polyamory: "[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )]祝福多重爱情并存，拒绝将神圣的亲密关系局限于单一契约之内。"
 generic_tenet_focus_tenet_sacrificial_ceremonies: "[GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )]以庄严献祭为崇拜核心，借神圣牺牲缔结誓约，以此换取神性护佑与恩典。"
 generic_tenet_focus_tenet_megaliths: "[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )]以不朽巨石划定神圣，依靠纪念石碑维系记忆与虔敬之心。"
 generic_tenet_focus_tenet_fp3_fedayeen: "[GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )]将潜行、渗透与舍身式的暴力刺杀神圣化，号召信众为崇高信仰事业献身。"
 generic_tenet_focus_tenet_communal_possessions: "[GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )]淡化私有财产，劝导信众践行资源共有。"
 generic_tenet_focus_tenet_pure_land: "[GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )]将希望寄托于脱离苦痛的福乐圣境，依靠虔信、忆念与奉修抵达净土。"
 generic_tenet_focus_tenet_no_mind: "[GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )]追求超越执念的清明境界，以自律修行，成就澄澈的本心。"
 generic_tenet_focus_tenet_mountain_worship: "[GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )]视高山峻岭为贴近神性的圣域，将群山高地确立为核心崇敬对象。"
 generic_tenet_focus_tenet_extinction_of_dharma: "[GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )]认定现世已被腐化侵蚀，为捍卫真理，准许施行严酷决绝的暴力。"
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )]将敌人的遗骸视作神圣信物，用以彰显胜利与慑人的威望。"
 generic_tenet_focus_tenet_pursuit_of_knowledge: "[GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )]将治学问道奉为神圣修行，借研习、论辩与审慎探究追寻真理。"
 generic_tenet_focus_tenet_benevolent_governance: "[GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )]将公正治理、有序管辖与国家抚育，作为评判圣洁的标准之一。"
 generic_tenet_focus_tenet_filial_piety: "[GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )]以敬亲尊老为伦理与神圣秩序的基石。"
 generic_tenet_focus_tenet_harmonious_society: "[GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )]崇尚平衡、礼制与社群和睦，视作宇宙秩序的现世映照。"
 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )]视神圣毁灭为净化的手段，令崩坏与倾覆成为神圣革新的手段。"
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )]推崇恒久与延续，以及对所托付之物的精心守护。"
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )]满怀敬畏与恭谨之心，敬拜巨熊以及荒野之中一切原始的超凡灵力。"
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )]严格约束暴力行径，为杀伐流血划定神圣边界，限定武力行使的正当范围。"
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]尊崇圣徒与德行楷模，珍视其圣行典范，却绝不将其等同神性。"
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )]坚信神圣奥迹具备真实的质变力量，使圣事成为神性临在的核心。"
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )]将虔敬与劳作合一，主张诚实的劳动本身即可成为崇拜。"
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )]尤为尊崇至圣代祷者，其敬礼规格远超普通圣徒。"
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )]承认圣职权柄、任命权与世俗财富难以彻底割裂的现实处境。"
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )]宣告了基督性体的唯一性，拒绝生硬割裂基督神性的奥义。"
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]效仿宗徒的社群模式，以初代信徒的慈善布施与集体生活作为信仰践行的范本。"
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]教导多数灵魂需经历死后涤罪净化，方能超脱罪污，进入圆满永福之境。"
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )]尊崇家庭伦理与血脉繁衍，视孕育新生、延续族群为信众的神圣天职。"
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )]以连绵不绝的传承链确立神职权威，道统渊源直溯诸位宗徒。"
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )]重视公开补赎与罪赦恩典，相信直言袒露罪愆是灵魂疗愈的开端。"
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]认为人性软弱与生俱来，一切降世灵魂，皆无法脱离沾染。"
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )]将宇宙构筑为层级严明的神圣秩序，各个位阶皆源自神圣的规划。"
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )]将信众塑造为神圣战士，号召以坚定热忱捍卫信仰真理。"
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )]依托义理争辩、经文注疏与理性和信仰的调和，不断打磨信理。"
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )]强调被提升举扬与被收养而成为神圣之子，弱化了子的永恒特性。"
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )]将仁慈与普爱置于为日常信仰生活的核心。"
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )]尊崇庄严规整的祭仪典制，认为有序的集体崇拜是窥见神性最清晰的途径。"
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )]阐释了基督的一个奥迹中神性与人性不可分割的结合。"
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]依托静默凝神、身心止寂与内心持诵圣祷，追求与神性合一。"
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]推崇离俗遁世，于与世隔绝的孤居苦修之中修得圣洁。"
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]借由肉体苦修以得圣洁，使躯体全然服从灵性修行的目标。"
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )]格外重视傅圣油仪式，将圣膏视作神圣恩宠的印记。"
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )]为雕刻十字的石碑赋予神圣意义，以恒久石刻作为信仰的公共见证。"
