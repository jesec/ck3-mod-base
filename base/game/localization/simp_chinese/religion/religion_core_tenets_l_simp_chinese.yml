 tenet_fp3_fedayeen_name: "菲达因"
 tenet_fp3_sacred_murder_name: "圣谋杀"
 tenet_fp3_fedayeen_desc: "当常规战争无效时，我们有责任通过渗透和诡计在[ROOT.Rite.GetFaith.HighGodNameAlternate]面前摧毁[ROOT.Rite.GetFaith.HighGodHerHis|U]的敌人。我们必须不怕死不怕痛，热切地为更伟大的事业献出我们的生命。"
