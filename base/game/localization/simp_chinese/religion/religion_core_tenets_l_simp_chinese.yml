 tenet_alexandrian_catechism_name: "亚历山大里亚教理问答"
 tenet_alexandrian_catechism_desc: "亚历山大里亚教理学校有着悠久的传统，鼓励神学家批判思考和质疑现状。\n\n尽管学校在物质上被摧毁了，我们延续着这些传统。"
 tenet_islamic_rationalism_name: "伊斯兰理性主义"
 tenet_islamic_rationalism_desc: "既然[ROOT.Rite.GetFaith.HighGodNameAlternate]公正而明智，那[ROOT.Rite.GetFaith.HighGodNameSheHe|U]就不能违背理性，或是不顾[ROOT.Rite.GetFaith.HighGodHerHis|U]造物的福祉。只有通过独立的理性，我们才能理解我们在[ROOT.Rite.GetFaith.HighGodHerHis|U]的伟业中扮演的角色，并区分善恶。"
 doctrine_parameter_scholasticism_is_holy: "[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )][trait|E]提供额外增益"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "以[learning|E][education_focus|E]教育的孩子，成年时可能获得[learning_lifestyle|E][experience|E]，你自己受的教育越好，概率越高"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "伯爵领改信速度：#P +25%#!"
 tenet_hedonistic_name: "享乐主义"
 tenet_hedonistic_desc: "神明让这世界充满了丰富的愉悦供我们沉迷享受——不参与这些事情就怠慢了创世的工程。"
 doctrine_parameter_piety_from_feasts_active: "举行[GetActivityType('activity_feast').GetName]获得@piety_icon![piety|E]"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" #Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "举行[GetActivityType('activity_festival').GetName]获得@piety_icon![piety|E]"
 tenet_carnal_exaltation_name: "肉欲高扬"
 tenet_carnal_exaltation_desc: "崇高的肉体欢愉某种意义上超越其他的世间体验，令我们更加靠近神性。我们应该赞美自己的性欲，为自己寻求机会满足之。"
 doctrine_parameter_piety_from_seduction_active: "成功的[GetScheme('seduce').GetTypeName][schemes|E]给予@piety_icon![piety|E]"
