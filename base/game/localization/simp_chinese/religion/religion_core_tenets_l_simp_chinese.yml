 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "拥有[GetTrait('lustful').GetName( GetNullCharacter )]、[GetTrait('rakish').GetName( GetNullCharacter )]或[GetTrait('deviant').GetName( GetNullCharacter )]的[characters|E]每项特质获得#P +2#![intrigue|E]、#P +2#![diplomacy|E]和#P +25%#![fertility|E]"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "拥有[GetTrait('lustful').GetName( GetNullCharacter )]、[GetTrait('rakish').GetName( GetNullCharacter )]或[GetTrait('deviant').GetName( GetNullCharacter )]的[characters|E]每项特质使[GetScheme('seduce').GetTypeName][schemes|E]加速#P 20#!天"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "可以使用[GetDecisionWithKey('commission_artifact_decision').GetName][decision|E]制造色情宝物"
 tenet_polyamory_name: "多边恋"
 tenet_polyamory_desc: "我们相互之间的爱应该像[ROOT.Rite.GetFaith.FertilityGodNamePossessive]对我们的爱那样无条件。我们必须抛弃那些认为一个人只能对另一个人动情的过时观念。"
 doctrine_parameter_no_unfaithfulness_penalty_active: "信徒不因婚外关系而对其配偶或配偶的情人受到[opinion|E]惩罚或有[imprisonment_reasons|E]"
 doctrine_parameter_tenet_polyamory_romance_seduction_scheme_bonus: "[GetScheme('courting').GetTypeName]和[GetScheme('seduce').GetTypeName][scheme_success_chance|E]：[success_chance_i]#P +35%#!"
 doctrine_parameter_tenet_polyamory_romance_seduction_fulfillment: "成功的[GetScheme('courting').GetTypeName]和[GetScheme('seduce').GetTypeName][schemes|E]降低[stress|E]，获得@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
