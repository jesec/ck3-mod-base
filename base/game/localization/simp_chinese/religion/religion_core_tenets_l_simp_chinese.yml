 tenet_pastoral_isolation_desc: "我们需要离群索居。我们的修行完全靠自己，与我们本身之外的他人毫无关系。"
 doctrine_parameter_unattractive_for_character_conversions: "该[faith|E]的[characters|E]更愿意改宗"
 tenet_natural_primitivism_name: "自然原始主义"
 tenet_natural_primitivism_desc: "文明是违反自然的，人类徒劳而亵渎地想要对本质上无序的造物施加秩序。我们抛弃衣物、等级、法律与宫廷的虚荣，依照[ROOT.Rite.GetFaith.PantheonTerm]所期望的那样生活：狂野、简朴而自由。"
