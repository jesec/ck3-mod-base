 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "如果没有[head_of_faith|E]存在，每控制一个[holy_site|E]，信徒在执行[convert_county|E][councillor_task|E]时获得一个增益"
 doctrine_parameter_pilgrimage_decision_active: "该[rite|E]的角色成功[pilgrimage|E]后可以获得一项额外增益"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "向[holy_orders|E][leasing|E][holdings|E]给予额外@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
