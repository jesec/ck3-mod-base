 #FP3 tenets
 tenet_communal_possessions_name: "公有财产"
 tenet_communal_possessions_desc: "[ROOT.Rite.GetFaith.HighGodName]本打算让我们所有人平分大地上的资源。我们应该一切公有，并重新分配权贵们偷走的财富。"
 doctrine_parameter_piety_from_gifts_active: "赠送[gifts|E]和[artifacts|E]获得@piety_icon![piety|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "统治者与[lowborn|E]的[characters|E]结婚会获得@piety_icon![piety|E]，且不会因此失去任何@legitimacy_icon![legitimacy|E]"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "解锁$redistribute_realm_wealth_decision$[decision|E]"
 tenet_sacrificial_ceremonies_name: "献祭仪式"
 tenet_sacrificial_ceremonies_desc: "活人的献祭，无论是自愿还是非自愿，都会缩短我们与神性的距离。一个人在仪式中自愿牺牲自己，这既是习俗，也是美德；同时，我们献祭那些犯下忤逆神明的不可饶恕罪的人，也一样是一种美德。"
 tenet_megaliths_name: "巨石建筑"
 tenet_megaliths_desc: "对神明的膜拜不应仅仅局限于神殿之中，这些只是人力所为的简陋构造，让我们无暇关注环绕身边的真正的神造之物。我们应当接纳石头和流动的空气，将石头按照造物主降下的旨意摆放，唯有这样才能取悦他们，让我们离神性更近一步。"
 doctrine_parameter_can_build_megaliths: "可以在[temple|E]地产内修建巨石阵，在公爵领首府修建伟大巨石阵。"
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "造访[buildings|E][points_of_interest|E]获得双倍经验奖励"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "在[GetTerrain( 'hills' ).GetName]、[GetTerrain( 'terraced_hills' ).GetName]、[GetTerrain( 'mountains' ).GetName]或[GetTerrain( 'desert_mountains' ).GetName]完成建造获得@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
