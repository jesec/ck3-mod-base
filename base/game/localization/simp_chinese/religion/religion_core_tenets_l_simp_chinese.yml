 tenet_monasticism_name: "隐修制度"
 tenet_monasticism_desc: "美食佳酿的欢愉只会让我们疏于侍奉神明。将我们自己隔绝在偏远的隐修院中，是避免这些诱惑的最佳方式。"
 doctrine_parameter_take_vows_active: "[courtiers|E]可以誓发终身圣愿并成为[GetTrait('devoted').GetName( GetNullCharacter )]"
 doctrine_parameter_devoted_trait_criminal: "[GetTrait('devoted').GetName( GetNullCharacter )]特质是[criminal|E]"
 doctrine_parameter_cannot_take_the_vows: "该[rite|E]的角色无法使用#high $take_vows_interaction$#![character_interaction|E]"
 tenet_divine_marriage_name: "圣婚"
 tenet_divine_marriage_xwedodah: "血亲圣婚"
 tenet_divine_marriage_desc: "通过与近亲结婚，我们效仿了最初造物的神圣结合。优秀的品质会随着血脉流传下去，于是我们在与邪恶的永恒斗争中获得纯洁和青睐。"
 doctrine_parameter_divine_marriage_opinion: "与[close_family|E]结婚的信徒可以获得相同[faith|E]的[vassals|E]$VALUE|0+=$[opinion|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "如果你同[close_family|E]结婚，[GetDoctrineType('doctrine_monogamy').GetBaseName]的婚姻加成也会给予大量@piety_icon![piety|E]"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "[spouse|E][councillor_tasks|E]的[skills|E]贡献：#P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "信徒创建或加入[factions|E]对抗与[close_family|E]或[extended_family|E]通婚的[liege|E]的可能性大幅降低"
 tenet_pacifism_name: "和平主义"
 tenet_pacifism_desc: "暴力是一种可憎的行为，只会导致苦难、痛苦和悔恨。我们致力于尽可能地避免暴力，就能为信徒创建更强大更安全的社会。在和平的秩序下，和平主义的伯爵领会得到繁荣发展。"
 doctrine_parameter_holy_wars_forbidden: "不能发动[holy_wars|E]或是[raid|E]"
 doctrine_parameter_pacifist_opinion_active: "和平主义者好感：$VALUE|+=0$"
 pacifist_opinion_name: "和平主义者"
 pacifist_county_opinion_name: "和平主义伯爵领"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "对其他和平主义者[opinion|E]：$VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "处于和平状态至少两年的统治者，其每月获得的@piety_icon![piety|E]提高$VALUE|+$"
 PIETY_LONG_PEACE: "长期和平"
 tenet_vows_of_poverty_name: "神贫誓愿"
 tenet_vows_of_poverty_desc: "金钱侵蚀人心，令人远离正信。想要专注于真正重要的事务，我们必须避免积聚物质财富。选择谦卑的活动，并在此过程中寻到虔诚。"
 doctrine_parameter_vows_of_poverty_active: "[rulers|E]可以[decide|E]发神贫誓愿，通过减少每月的[tax|E]收入来增加每月所获得的@piety_icon![piety|E]"
 tenet_human_sacrifice_name: "人祭"
 tenet_human_sacrifice_desc: "证明我们虔诚的最佳方式就是献祭。我们所能献上最为珍贵的祭品就是人命。"
 doctrine_parameter_human_sacrifice_active: "[executions|E]增加@piety_icon![piety|E]而不是消耗@piety_icon![piety|E]"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[sharing_power|E]时[executions|E]永不消耗@prestige_icon![prestige|E]"
 doctrine_parameter_flower_war_cb_active: "能对邻近领地使用[flowery_war|E]的[casus_belli|E]"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "根据祭品的[nobility|E]身份和[rank|E]，[executions|E]给予额外@piety_icon![piety|E]和@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "[sieges|E]期间俘虏角色的概率大幅提高"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "[imprison|E]无地角色的概率提高"
 tenet_gruesome_festivals_blot_name: "血祭"
 tenet_gruesome_festivals_name: "恐怖节庆"
 tenet_gruesome_festivals_desc: "我们在鲜血中诞生。我们靠鲜血存活，牲畜的血、亲族的血和仇敌的血。[ROOT.Rite.GetFaith.PantheonTerm]要求与我们公平地分享，这再自然不过了。"
 gruesome_festivals_active_name: "可以组织大献祭"
 doctrine_parameter_gruesome_festivals_active: "可以每十年举行一次[GetActivityType('activity_gruesome_festival').GetName][activity|E]，获得@piety_icon![piety|E]，并提升同[faith|E]封臣及[county_opinion|E]"
 tenet_volcanic_veneration_name: "火山崇拜"
 tenet_volcanic_veneration_desc: "新生的泥土从我们家园内的汹涌坑洞中喷涌而出，没有比这更加神圣的事物。我们在灾难的边缘度过人生，永远仰仗[ROOT.Rite.GetFaith.PantheonTerm]的仁慈。"
 tenet_cthonic_redoubts_name: "地下堡垒"
 tenet_cthonic_redoubts_desc: "没有比大地之根更优秀的避难所，没有比隆起的山脊更坚固的要塞，也没有比隐蔽的山径更庄严的朝圣之路。我们自这些高耸的山峰上凝望下方的造物，感受神赐的真正重量。"
 doctrine_parameter_easier_to_convert_faith_in_mountains: "山地[terrain|E]的[convert_county|E]速度：#P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "同样信仰[faith|E]的山地[terrain|E]的[promote_culture|E]速度：#P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "有敌意的山地[terrain|E]的[convert_county|E]速度：#P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "禁食"
 tenet_consolamentum_name_alternate: "自杀圣礼"
 tenet_consolamentum_desc: "若年老或重病，我们将举行仪式洁净自己罪恶的灵魂。仪式完成后，我们就快速坚决地结束生命，令罪恶没有机会再次侵袭我们。"
 doctrine_parameter_consolamentum_active: "信徒在年老体衰、拥有无能特质、或濒临死亡时，可以[decide|E]是否要结束自己的生命；这样不会引发自杀一般会造成的惩罚"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "若信徒通过[GetDecisionWithKey('initiate_consolamentum_decision').GetName][decision|E]死亡，其继承人将获得#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#!@piety_icon![piety|E]"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "如果你死于[GetDecisionWithKey('initiate_consolamentum_decision').GetName][decision|E]，你的继承人获得#P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#!@piety_icon![piety|E]，以及持续#P 10#!年的$pam_blessed_passing_modifier$"
 tenet_gnosticism_name: "诺斯替主义"
 tenet_gnosticism_desc: "居住于所有人类中的神性火花能通过知识得到解脱，回归其灵界中的天堂之源。"
 doctrine_parameter_granting_titles_gives_stress: "放弃[titles|E]减轻[stress|E]"
 tenet_mendicant_preachers_name: "托钵宣道"
 tenet_mendicant_preachers_desc: "我们的传教士除所穿的衣服外身无长物，前往远方各地。他们依靠当地人的慷慨生活，并分享正信的知识作为回报。"
 doctrine_parameter_mendicant_preachers_conversion_active: "伯爵领改信速度：#P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "使[character|E]改信给予额外@spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "拉拢另一[faith|E]的[characters|E]由有高概率成功"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "[activities|E]中其他[faith|E]的宾客可能皈依你的信仰"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "启用针对你当前[location|E]的[rulers|E]的#V $attempt_conversion_of_local_ruler_interaction$#![interaction|E]"
