 doctrine_parameter_tenet_communion_denied_sacrament: "该[rite|E]的[Concept('excommunicated', '被绝罚')|E][characters|E]的@piety_icon![piety|E]获得#N ‑25%#!，失去#N ‑10#!同信仰[opinion|E]"
