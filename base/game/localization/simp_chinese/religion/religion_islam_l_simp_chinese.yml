 #Ṣadr al-Islām
 sadr_al_islam: "最初的伊斯兰教"
 sadr_al_islam_adj: "最初的伊斯兰教"
 sadr_al_islam_adherent: "穆斯林"
 sadr_al_islam_adherent_plural: "穆斯林"
 sadr_al_islam_desc: "在后世各类教法学派尚未诞生的最纯粹的时代，穆斯林由蒙受天启的先知亲自引领。圣伴与最初的数代再传弟子，皆谨行恪守先知的圣行（逊奈）。"
 #Sunni
 sunni: "逊尼派"
 sunni_adj: "逊尼派"
 sunni_adherent: "逊尼派信徒"
 sunni_adherent_plural: "逊尼派信徒"
 sunni_desc: "逊尼派指遵从穆罕默德言行典范——即圣行（逊奈）的穆斯林群体。逊尼派伊斯兰教法体系，主要以《古兰经》、圣训与公议（宗教学者的一致共识）作为信仰与律法的核心本源。"
 #Shia
 shia: "什叶派"
 shia_adj: "什叶派"
 shia_adherent: "什叶派信徒"
 shia_adherent_plural: "什叶派信徒"
 shia_desc: "什叶派是伊斯兰教重要分支，主张宗教领导权必须留存于先知穆罕默德的家族内部，由蒙受真主引导的诸位伊玛目世袭传承。该派系强调敬拜、尊崇先知圣裔。"
 islam_shia_priest: "毛拉"
 islam_shia_priest_plural: "毛拉"
 islam_shia_religious_head_title: "伊玛目"
 islam_shia_religious_head_title_name: "伊玛目国"
 #Kharijite
 kharijite: "哈瓦利吉派"
 kharijite_adj: "哈瓦利吉派"
 kharijite_adherent: "哈瓦利吉派信徒"
 kharijite_adherent_plural: "哈瓦利吉派信徒"
 kharijite_desc: "一支伊斯兰教的早期宗派，他们认为教权遴选的标准应为信士的虔敬，而非血缘世系，有罪的统治者理应被罢黜。该派别兴起于伊斯兰内战动荡时期，同时拒斥逊尼派与什叶派双方的主张，并认为犯下大罪者应被逐出伊斯兰教。"
 #Masmudism
 masmudi: "穆瓦希德派"
 masmudi_adj: "穆瓦希德派"
 masmudi_adherent: "穆瓦希德派信徒"
 masmudi_adherent_plural: "穆瓦希德派信徒"
 masmudi_desc: "穆瓦希德运动是一支源于北非柏柏尔部落的逊尼伊斯兰教改革派，自认为是认主独一者，并宣扬纯化的一神论。"
 masmudi_religious_head_title: "哈里发"
 masmudi_religious_head_title_name: "哈里发国"
 #Quranism
 quranist: "唯古兰经派"
 quranist_adj: "唯古兰经派"
 quranist_adherent: "唯古兰经派信徒"
 quranist_adherent_plural: "唯古兰经派信徒"
 quranist_desc: "伊斯兰的字面释经派别，强调古兰经是圣智的唯一来源，应当遵循每一字每一句，忽略圣训和教令。"
 #Druze
 druze: "德鲁兹派"
 druze_adj: "德鲁兹派"
 druze_adherent: "德鲁兹派信徒"
 druze_adherent_plural: "德鲁兹派信徒"
 druze_desc: "德鲁兹信仰起源于德鲁兹山，遵循许多伊斯马仪派的原则，不过在其以存在的真理为重点的深奥神学理论中，也含有诺斯替信仰的成分。"
 druze_religious_text: "《智慧书》"
 druze_religious_text_2: "$druze_religious_text$" #Optional translation alt
 druze_religious_text_3: "$druze_religious_text$" #Optional translation alt
