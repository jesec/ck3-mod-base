 ## Event - the duel
 carnival.1010.t: "决斗"
 carnival.1010.desc: "两个戴面具的陌生人正面对峙，人群让出空间，让对战者绕圈移动——利刃出鞘！他们眼里的恨意表明，他们要做的不只是放点血。"
 carnival.1010.a.desc: "\n\n而我不过是人群中又一张面具。"
 carnival.1010.b.desc: "被人注意到后，人群等着看我会不会插手。"
 carnival.1010.a: "叫卫兵来制止这场决斗。"
 carnival.1010.b: "说服他们停下来。"
 carnival.1010.c: "命令他们停下。"
 carnival.1010.d: "让决斗继续进行。"
 cooltip.carnival.1010_duel_diplomacy_success: "你制止了决斗"
 cooltip.carnival.1010_duel_diplomacy_fail: "你未能阻止决斗"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName]输掉了决斗，可能因此受伤或死亡。"
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName]输掉了决斗，可能因此受伤或死亡。"
 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName]赢得决斗"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName]赢得决斗"
 carnival.1010_duel_guards_success.desc: "卫兵们跑了过来"
 carnival.1010_duel_guards_fail.desc: "卫兵们来得太迟了"
 carnival.1010_duel_guards_success_toast: "卫兵们制止了决斗"
 carnival.1010_duel_guards_failure_toast: "卫兵来不及阻止这场决斗"
 carnival.1010_duel_diplomacy_success_toast: "你阻止了决斗"
 carnival.1010_duel_diplomacy_fail_toast: "你没能阻止决斗"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName]在决斗中受伤"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName]在决斗中被杀"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName]在决斗中受伤"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName]在决斗中被杀"
 carnival.1010.duel_stop.log_title: "阻止决斗"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip]阻止了[duelist_01.GetFirstNameNoTooltip]和[duelist_02.GetFirstNameNoTooltip]之间的决斗"
 carnival.1010.duel_continue.log_title: "未能阻止决斗"
 carnival.1010.duel_continue.log: "[carnival_main.GetShortUIName|U]试图阻止[duelist_01.GetShortUIName]和[duelist_02.GetShortUIName]之间的决斗，但没能成功"
 ## Event - Gracious Host
 carnival.1011.t: "好客之主"
 carnival.1011.desc: "嘉年华是个展示我财富和品味的好机会，正好可以把宫殿的大门向人们敞开。在和[house_member01.GetFirstNameNoTooltip]讨论这件事时，我在思考应该邀请谁。[house_member01.GetSheHe|U]提出了一些不错的建议。但最终的决定由我来做。"
 carnival.1011.a: "装饰整座宫殿，不惜一切代价！"
 carnival.1011.b: "向穷人敞开大门！"
 carnival.1011.c: "只邀请最尊贵的宾客！"
 carnival.1011.d: "只邀请亲戚们。"
 ## Event - Puppet theater
 carnival.1012.t: "木偶剧场"
 carnival.1012.desc: "平民喜欢他们的木偶戏，看那些闹剧和低俗的表演。那些怪诞的木偶被雕刻出来，模仿各行各业的人；交媾、斗殴、争吵，卷入各种荒诞不经的情境。\n\n[carnival_location.GetName]的嘉年华吸引了许多这样的木偶戏艺人，虽然民众喜爱他们，但[carnival_host.GetFaith.PriestNeuterPlural]却对这些娱乐的低俗性质感到担忧。"
 carnival.1012.a: "我将秘密出席这些演出。"
 carnival.1012.b: "贿赂剧团，上演我的戏剧！"
 carnival.1012.c: "我会公开出席这些演出！"
 carnival.1012.d: "暗中谴责台后的表演者。"
 carnival.1012.e: "禁止此类粗俗的表演。"
 ## Event - The Mask Maker
 carnival.1013.t: "面具匠"
 carnival.1013.desc: "穿过一个几乎没什么人的院子，我碰巧遇到一个上了年纪的[mask_maker.GetWomanMan]在刻面具。在[mask_maker.GetHerHim]旁边是个摆满了[mask_maker.GetHerHis]的作品的摊子：一排排各种各样的面具。\n\n这手艺确实精巧。"
 carnival.1013.a: "全部买下，然后分给我遇到的每一个人！"
 carnival.1013.b: "为面具匠提供成立作坊的资金。"
 carnival.1013.c: "为自己购买一副精美的面具。"
 carnival.1013.d: "为自己购买一副恐怖的面具。"
 carnival.1013.maskmaker_workshop.log_title: "投资了面具匠的作坊"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName]帮助一位面具匠开设了一间工坊"
 ## Event - Holy Fools
 carnival.1014.t: "圣愚"
 carnival.1014.desc: "一场模仿圣游行的队伍正沿着街道走来。那些装扮在讽刺牧师、僧侣，甚至我们信仰中最高的领袖！神职人员正被公开嘲弄。"
 carnival.1014_2.a.desc: "\n\n我继续隐藏在人群中。"
 carnival.1014_2.b.desc: "\n\n人群期待着我的反应。"
 carnival.1014.a: "悄悄叫卫兵驱散这场闹剧。"
 carnival.1014.b: "谴责他们的罪恶！"
 carnival.1014.c: "加入嘲弄。"
 carnival.1014.d: "悄悄溜进人群。"
 carnival.1014.e: "我好几年都没笑得这么开心了！"
 cooltip.carnival.1014.non_believer: "#weak #EMP 由于你的不信者[secret|E]而失去[stress|E]#!#!"
 carnival.1014.secret.tt.toast: "你意识到自己心中从未真正相信过"
 carnival.1014.mockery.tt.toast: "你感到既内疚又释怀"
 ## Event - The Cat
 carnival.1015.t: "猫"
 carnival.1015.desc: "一整个晚上都有个小小的影子跟着我。不管我转到哪个角落，总有一双亮晶晶的眼睛和一声沙哑的#EMP “喵”#!在等着我。\n\n“看来你交了个朋友啊。”[observer_01.GetTitledFirstName]指着大笑，那只猫又一次蹭上了我的腿。"
 carnival.1015.a: "看来这是命中注定！"
 carnival.1015.b: "我相信它更愿意与你多待一会儿。"
 carnival.1015.c: "[family_member01.GetTitledFirstName]需要一个伴儿。"
 carnival.1015.adopt_cat.log_title: "收养了一只猫"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName]收养了一只猫"
 ## Event - Lover's mask
 carnival.1016.t: "情人的面具"
 carnival.1016.desc: "我漫步在[carnival_location.GetName]的街头，沉浸在庆典的狂热中，听到音乐在小巷里回荡；派对从酒馆涌到街上。到处都是平民和贵族摩肩接踵，等级和特权被面具取代。\n\n我感到有人轻拍了我的肩膀，身后站着一个戴面具的[woo_character.GetWomanMan]。[woo_character.GetSheHe|U]摆了个夸张的姿势，然后咯咯笑了起来。当那陌生人把面具拨开一瞬，我认出了[woo_character.GetNameNoTooltip]。\n\n#EMP “你好啊，[ROOT.Char.GetLadyLord]。你愿意和我一起度过今晚吗？只是两个戴着面具的陌生人一起享受嘉年华而已。”#![woo_character.GetSheHe]说着，夸张地行了个宫廷礼。"
 carnival.1016.a: "真是个惊喜！带路吧，#EMP “陌生人”。#!"
 carnival.1016.b: "我很乐意有个#BOLD 朋友#!陪伴。"
 carnival.1016.c: "我们应该继续当陌生人。"
 ## Event - In candle light
 carnival.1017.t: "烛光中"
 carnival.1017.desc: "我在一家安静的酒馆里找到了[intent_target.GetNameNoTooltip]。外面嘉年华正在热闹地进行，但里面却很舒适——烛光照明。我进去时，[intent_target.GetNameNoTooltip]正读着书，[intent_target.GetHerHim]把眉头皱起，一脸专注。\n\n我确信几句风趣的对话就能让[intent_target.GetHerHim]注意到我的魅力。"
 carnival.1017.a: "用我的文学知识给[intent_target.GetHerHim]留下深刻印象。"
 carnival.1017.b: "用诙谐的玩笑让[intent_target.GetHerHim]忘记那本书。"
 carnival.1017.c: "问[intent_target.GetHerHim]之后能不能把书借我读。"
 carnival.1017.a.tt.failure.desc: "啊，一本适合简单之人的好书"
 carnival.1017.a.tt.success.desc: "这让我想起了另一本书"
 carnival.1017.b.tt.success.desc: "把[intent_target.GetHerHis]的注意力从书上引开"
 carnival.1017.a.tt.success.toast: "你的广博知识引起了[intent_target.GetTitledFirstName]的注意"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName]觉得你既无聊又自负"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName]完全忘记了那本书"
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName]一直埋头在[intent_target.GetHerHis]的书里"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName]觉得你不如[intent_target.GetHerHis]的书有趣"
 carnival.1017.c.tt.toast: "你和[intent_target.GetTitledFirstName]因讨论一本有趣的书而变得更加亲近"
 ## Event - Flowers & song
 carnival.1018.t: "爱情与游戏"
 carnival.1018.desc: "一群人聚集在广场上观看力量和技巧的比赛。摔跤、赛跑、拔河这类游戏正在举行，观众们欢呼着。气氛欢乐而友好。\n\n[intent_target.GetTitledFirstName]似乎对场上展现的实力印象深刻。[intent_target.GetHerHis]的目光不断飘向[contender.GetTitledFirstName]。如果我想赢得[intent_target.GetHerHis]的青睐，就得想办法胜过[contender.GetHerHim]才行。"
 carnival.1018.a: "我要在摔跤场上把[contender.GetHerHim]放倒！"
 carnival.1018.b: "也许可以说服[contender.GetSheHe]故意输掉？"
 carnival.1018.c: "在[intent_target.GetTitledFirstNameNoTooltip]面前嘲笑[contender.GetHerHim]"
 carnival.1018.d: "我不想参加这场比赛。"
 carnival.1018.a.success.desc: "你打败了[contender.GetTitledFirstNameNoTooltip]"
 carnival.1018.a.success.toast: "[intent_target.GetTitledFirstNameNoTooltip]对你的勇武印象深刻"
 carnival.1018.a.failure: "你被摔了个四仰八叉"
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip]忘记了你的存在"
 carnival.1018.b.success: "你设法让假赛看起来十分逼真"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip]为你成为冠军欢呼"
 carnival.1018.b.failure: "假赛假的不能再假"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip]骂你是骗子"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip]被逗乐并迷住了"
 ## Event - A mask in the crowd
 carnival.1019.t: "人群中的面具"
 carnival.1019.desc: "我在人群中反复看到同一张面具。我在街上走，那张傻笑的愚人脸好像一直浮在视野边缘。在那片面具的河流里，它一次又一次地出现。我是不是被跟踪了？光是这个念头就让我脊背发凉。\n\n我离开大街，那些戴面具的人跟了上来。我确信他们想害我。"
 carnival.1019.a: "准备伏击。"
 carnival.1019.b: "把他们引向一队守卫。"
 carnival.1019.c: "大声呼救。"
 cooltip.carnival.1019.tt.assassination_success: "你杀死了袭击者"
 cooltip.carnival.1019.tt.assassination_fended: "你击伤了袭击者"
 cooltip.carnival.1019.tt.assassination_captured: "袭击者被囚禁"
 cooltip.carnival.1019.tt.assassination_scream: "你的叫喊声让刺客四散而逃"
 carnival.1019.tt.assassination_success.desc: "你杀死了袭击者"
 carnival.1019.tt.assassination_fended.desc: "你击退了袭击者"
 carnival.1019.tt.assassination_wounded.desc: "你受伤了"
 carnival.1019.tt.assassination_killed.desc: "袭击者杀死了你"
 carnival.1019.tt.assassination_gotaway.desc: "你设法逃脱"
 carnival.1019.tt.assassination_cornered.desc: "你被逼入绝境"
 carnival.1019.tt.assassination_captured.desc: "卫兵抓住了刺客"
 carnival.1019.tt.assassination_fended_toast: "你刺伤了追击者，逃进了小巷"
 carnival.1019.tt.assassination_wounded_toast: "袭击者将你刺伤，随后悄然隐入黑暗"
 carnival.1019.tt.assassination_success_toast: "未遂的刺客[murder_01.GetFirstNameNoTooltip]死亡"
 carnival.1019.tt.assassination_gotaway_toast: "你从袭击者手中溜走了"
 carnival.1019.tt.assassination_captured_toast: "刺客[murderer_01.GetFirstNameNoTooltip]被扔进了牢房。"
 ## Event - Thundering hooves
 carnival.1020.t: "雷鸣之蹄"
 carnival.1020.desc: "我看到[murder_victim.GetNameNoTooltip]和[murder_victim.GetHerHis]的[murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))][bystander.GetFirstNameNoTooltip]时，他们正要离开一场宴会。\n\n我勒住马的缰绳，等着[murder_victim.GetFirstNameNoTooltip]向东道主告别。我的目标还不知道，危险就在几条街外，正跺着蹄子。\n\n这是个合适的时机，但也有可能伤到无辜的人。"
 carnival.1020.a: "我会骑马经过时把两个人都劈成两半。"
 carnival.1020.b: "前进，[ROOT.Char.Custom('WarhorseStoryName')]！他们会明白我是个令人畏惧的[ROOT.Char.GetWomanMan]。"
 carnival.1020.c: "骑马撞向[murder_victim.GetFirstNameNoTooltip]。一场可怕的意外。"
 carnival.1020.d: "我向雇来的手下示意，让他们骑马追向我的猎物。"
 carnival.1020.e: "今天不行，风险太大了。"
 carnival.1020.tt.horse.hit.desc: "受害者被马蹄践踏致死"
 carnival.1020.tt.horse.miss.desc: "那马没有命中目标"
 carnival.1020.tt.horse.hit.toast: "受害者被马蹄践踏致死"
 carnival.1020.tt.horse.miss.toast: "那马没有命中目标"
 carnival.1020.murder_horse.log_title: "战马狂飙"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName]骑着[carnival_main.GetHerHis]的战马[carnival_main.Custom('WarhorseStoryName')]，撞倒了[murder_victim.GetShortUIName]"
 carnival.1020.accident.log_title: "可怕的意外"
 carnival.1020.accident.log: "在一次可怕的意外中，[murder_victim.GetShortUIName]被一匹马踩踏致死。"
 carnival.1020.both_accident.log_title: "可怕的意外"
 carnival.1020.both_accident.log: "在一次可怕的意外中，[murder_victim.GetShortUIName]和[bystander.GetShortUIName]被一匹马踩踏致死"
 carnival.1020.bystander_accident.log_title: "可怕的意外"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName]在一次可怕的意外中被一匹马踩踏致死。"
 carnival.1020.sword.log_title: "马背上的谋杀"
 carnival.1020.sword.log: "[murder_victim.GetShortUIName]和[bystander.GetShortUIName]被一名骑手劈成两半。"
 carnival.1020.miss.log_title: "[murder_victim.GetShortUIName]险些被马压死"
 carnival.1020.miss.log: "[murder_victim.GetShortUIName]声称[carnival_main.GetShortUIName]试图骑马撞向自己：这是一起未遂的谋杀！"
 ## Event - The Arrow
 carnival.1021.t: "箭矢"
 carnival.1021.desc: "我的位置很安静，只有木头的嘎吱声，还有街上的声音透过百叶窗飘进来。在外面的院子里，我的目标[murder_victim.GetFirstNameNoTooltip]并没有察觉我的目光——也没察觉我身边的[SCOPE.Custom('UniqueBowOrJustBow')]。\n\n我带了一个雇来的打手，[bandit_01.GetFirstNameNoTooltip]，以防我需要多一双手。\n\n当我拉开弓弦时，[murder_victim.GetFirstNameNoTooltip]抬起头，[murder_victim.GetHerHis]的眼睛正扫视各个窗户！"
 carnival.1021.a: "趁他没发现我，赶紧放箭。"
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip]，放箭。我会确保撤退路线安全。"
 carnival.1021.c: "蹲下。我们需要等待更好的时机。"
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip]杀错了人"
 carnival.1021.tt.arrow.hit.desc: "箭矢命中目标"
 carnival.1021.tt.arrow.miss.desc: "箭矢落空，目标发现了你"
 carnival.1021.tt.thug.arrow.hit.desc: "箭矢命中目标"
 carnival.1021.tt.thug.arrow.miss.desc: "箭矢射错了目标"
 carnival.1021.tt.arrow.hit.toast: "箭矢命中了目标"
 carnival.1021.tt.arrow.miss.toast: "箭矢没射中目标，你被发现了！"
 carnival.1021.tt.thug.arrow.hit.toast: "打手的箭矢命中了目标"
 carnival.1021.tt.thug.arrow.miss.toast: "打手的箭矢射错了目标！"
 carnival.1021.arrow.log_title: "未知弓箭手"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip]被一支未知弓箭手的箭杀死"
 ## Event - Procession of My Own
 carnival.1022.t: "属于我的游行"
 carnival.1022.desc: "城市出资举办嘉年华，是为了全民的受益。只要还有足够的金子办像样的娱乐，一个有钱又有头脑的市民就能让我们的节庆更加气派。\n\n如果我捐一笔钱，同行们大概会嫉妒得发绿，而在那些不如我的人眼里，我会像古代的贵族一样耀眼。没错，想想看，那些古代城邦的大人物们都会把自己的财富亮出来！如果我赞助一场盛大的游行，我的名字就会人人传颂！\n\n#BOLD 但主题该定什么呢？#!"
 carnival.1022.a: "一场#BOLD 美丽的#!游行，以向我的成就致敬！"
 carnival.1022.b: "一场#BOLD 令人畏惧的#!的游行，让人心生恐惧与敬畏！"
 carnival.1022.c: "一场#BOLD 宗教性#!游行，以彰显我的虔诚！"
 carnival.1022.d: "转念一想，我有比这更好的花钱法子。"
 custom.carnival.1022.guestopinion: "所有参加嘉年华的宾客"
 custom.zealot_carnival.1022.guestopinion: "所有参加嘉年华的[GetVassalStance( 'zealot' ).GetTextIcon]宾客"
 ## Event - Legacy in marble
 carnival.1023.t: "大理石的遗产"
 carnival.1023.desc: "从小我就听过那些古老城邦的故事。贵族们是艺术的大赞助人。虽然辉煌过去的宏大建筑如今已成废墟，但它们的艺术和美仍然给人以启发。通过赞助艺术家，我可以把自己的名字提升到这个尊贵的行列中。\n\n想象一下：我的名声能超越这凡俗的躯壳而存在！\n\n让人们看到披着大理石、石材和木材，涂满彩虹所有颜色的美吧！为了[Glossary( '#bold 祖国#!', 'carnival_patria_GLOSS' )]的荣耀，为了我们祖先的崇敬，也为了[ROOT.Char.GetDynastyHouseName]家族的声望！"
 carnival.1023.a: "赞助一场青年艺术家比赛"
 carnival.1023.b: "为公共广场委托创作新的壁画和装饰。"
 carnival.1023.c: "定制一套雕像，展示城市的奠基者。"
 carnival.1023.d: "等等，艺术都这么贵的吗！？"
 ## Event - Whispers behind the mask
 carnival.1024.t: "面具后的低语"
 carnival.1024.desc: "在嘉年华旋转的欢庆中，界限变得模糊，人们失去了分寸感。你永远不知道你身边戴面具的人到底是谁，或者他们会记住什么。\n\n[hook_target.GetTitledFirstNameNoTooltip]已放纵过度。整晚与任何吸引[hook_target.GetHerHis]目光的人跳舞；吃喝得仿佛没有明天。大笑和说话，不在乎谁在听。跳舞跳到几乎要出丑闻，完全没注意到我#BOLD 在面具后看着。#!\n\n#BOLD 我可以不让[hook_target.GetHerHim]尴尬，也可以拿这事来要挟[hook_target.GetHerHim]，让[hook_target.GetTitledFirstNameNoTooltip]欠我一个人情。#!"
 carnival.1024.a: "我会友善的看着[hook_target.GetHerHim]。"
 carnival.1024.b: "要是以后有人拿这个要挟[hook_target.GetHerHim]，那可真是遗憾。"
 carnival.1024.c: "最好给[hook_target.GetHerHis]的家族发个友好的警告。"
 carnival.1024.d: "让[hook_target.GetTitledFirstNameNoTooltip]自己承担自己的错误。"
 carnival.1025.t: "饰品和神奇动物"
 carnival.1025.into_desc: "我站在一个异族商人的摊位前。来自四面八方的稀奇物件陈列于此，更别提那些摆出来展示，里面关着异域野兽的笼子了。这些动物的叫声与气味，真是与众不同。\n\n“都来看看哪，诸位！神奇的东西！”商人吆喝着，朝[merchant_character.GetHerHis]的货物比划。\n\n“高品质的[merchant_trinket.GetName]；还有[merchant_creature.Custom('GetCarnival1025PitchArticle')][merchant_creature.GetName]——"
 carnival_1025_creature_lion_desc: "非洲曼提柯尔——传说中凶猛的食人兽。”"
 carnival_1025_creature_caracal_desc: "个子不大，但凶猛异常！”"
 carnival_1025_creature_lynx_desc: "它可以在几秒内跑上一棵树，它的尿液会形成具有神奇特性的晶体！”"
 carnival_1025_creature_tiger_desc: "波斯传说中凶猛的食人兽！”"
 carnival_1025_creature_leopard_desc: "正如古代文献中所说！”"
 carnival_1025_creature_bear_desc: "它能用前腿倒立，还能抛接人头大小的石头！”"
 carnival_1025_creature_elephant_desc: "由一位疯狂的炼金术士创造！”"
 carnival_1025_creature_peacock_desc: "从火焰中诞生！”"
 carnival_1025_creature_parrot_desc: "它可以说话和唱赞美诗！”"
 carnival_1025_creature_cockatoo_desc: "实在稀有！”"
 carnival_1025_creature_crane_desc: "看看它的动作多么优雅！”"
 carnival_1025_creature_monkey_desc: "来自地狱的深渊！”"
 carnival.1025.a: "“太棒了，我要那件饰品。”"
 carnival.1025.b_1: "“真是神奇，我会买下那只野兽。”"
 carnival.1025.b_2: "“不过可以肯定的是，这只是[merchant_creature.Custom('GetCarnival1025RealBeastArticle')][merchant_creature.Custom('GetCarnival1025RealBeastName')]。”"
 carnival.1025.c: "至少看看是免费的。"
 carnival.1025.embarrassed_merchant: "商人出于尴尬给你打了折。"
 carnival_1025_creature_lion_name: "非洲曼提柯尔"
 carnival_1025_creature_caracal_name: "侏儒猎豹"
