 ## Event - Dead End
 carnival.1111.t: "死局"
 carnival.1111.desc: "在我与其中一个刺客搏斗时，我感到脖子上一阵疼痛——他的同伙从背后刺中了我。地面迎面撞来，我重重倒地。力气迅速从四肢流失，我急促的呼吸在唇边化作带血的泡沫。"
 carnival.1111.a: "本不该这样收场。"
