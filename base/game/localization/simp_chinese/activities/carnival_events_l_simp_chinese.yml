l_simp_chinese:
 ## Event - Carnival Opening
 carnival.1001.t: "奇迹时刻"
 carnival.1001.desc: "准备工作已经就绪。\n\n五颜六色的横幅挂在大道两旁，游行队伍在[carnival_location.GetName]的小巷和街道间蜿蜒穿行。人群聚集在广场周围——无论贫富美丑，在这片面具的海洋中，我们全都一样。\n\n这将是多么盛大的一场景象！"
 carnival.1001.a: "是时候戴上面具了。[Glossary( '#bold 撤走肉食！#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "刺客们，现在来找我吧！"
 carnival.1001.c: "面具既能遮住缺陷，也能遮住伤疤……"
 ## Event - Carnival Closing
 carnival.1002.t: "回归平凡"
 carnival.1002.desc: "街道上散落着嘉年华的残迹；被丢弃的面具和装饰品堆满了水沟，狂欢者们拖着身子回家。我们放下了分歧，一起大吃大喝，跳舞，玩游戏，像一座团结的城市那样欢笑。\n\n嘉年华的魅力还会在空气中停留一阵，提醒着我们自己是谁，然后我们便回到日常生活中，回到等级、劳作和义务中——直到嘉年华再次到来。"
 carnival.1002.a: "是时候回归正事了。"
 carnival.1002.b: "要是每天都能这样该多好？"
 carnival.1002.c: "回归秩序的感觉真好。"
 ## Event - A chance for mischief
 carnival.1003.t: "恶作剧的机会"
 carnival.1003.desc: "拜访[house_target.GetDynastyHouseName]家那俗气的宅邸时，我看到了精美的[house_target.Custom('RegionalFabric')]窗帘，数百朵[house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')]，仆从成群，还有[house_target.GetName]在对[house_target.GetHerHis]的客户们高谈阔论——我突然很想让他们都谦卑一点。\n\n这种恶作剧应该很符合嘉年华的精神吧？\n\n我应该悄悄雇几个恶棍去。"
 carnival.1003.a: "朝[house_target.GetFirstNameNoTooltip]扔臭鸡蛋！"
 carnival.1003.b: "装扮成魔鬼在[house_target.GetHerHis]的府邸中闹事。"
 carnival.1003.c: "在主干道沿线涂鸦[house_target.GetHerHis]家人的低俗涂鸦。"
 carnival.1003.d: "转念一想，还是算了。"
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName]羞愧得不敢出门"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName]失去了理智"
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUINamePossessive]怒火中烧"
 carnival.1003.throw_eggs_log_title: "被扔臭鸡蛋"
 carnival.1003.throw_eggs_log: "[house_target.GetDynastyHouseName]家族的庄园被人扔了臭鸡蛋"
 carnival.1003.mischief.insanity.log_title: "魔鬼捣乱"
 carnival.1003.mischief.insanity.log: "一群打扮成魔鬼的暴徒快把[house_member.GetShortUIName]逼疯了"
 carnival.1003.mischief.irritable.log_title: "魔鬼捣乱"
 carnival.1003.mischief.irritable.log: "一群打扮成魔鬼的暴徒让[house_member.GetShortUIName]愤怒不已，对周围所有人发泄"
 carnival.1003.mischief.reclusive.log_title: "魔鬼捣乱"
 carnival.1003.mischief.reclusive.log: "一群打扮成魔鬼的暴徒把[house_member.GetShortUIName]逼得躲藏起来"
 ## Event - House Relations
 carnival.1004.t: "家族关系"
 carnival.1004.desc: "一个分裂的城市无法长久存续，因此我有必要与参与[carnival_location.GetName]政治的那些强大家族结成共同的事业。\n\n在宴会上，我把[other_house_leader01.GetName]拉到一旁，试图让他看到我的家族[ROOT.Char.GetDynastyHouseName]和[other_house_leader01.GetHerHis]的家族[other_house_leader01.GetDynastyHouseName]之间保持良好关系的好处。"
 carnival.1004.a: "我们的账簿满满当当，口袋深不见底！"
 carnival.1004.b: "商业上的合作对我们双方都有利。"
 carnival.1004.c: "你的家族远不如[ROOT.Char.GetDynastyHouseNameNoTooltip]家族。"
 carnival.1004.d: "我们家族之间的关系应当保持不变。"
 ## Event - Prank a friend
 carnival.1005.t: "捉弄朋友"
 carnival.1005.desc: "嘉年华是跟朋友开个玩笑的绝佳时机——当然，一切都是出于善意。\n\n我看到我的朋友[friend.GetName]在跟[bystander.GetName]说话，我的脑子里立刻冒出了一些有趣的主意！"
 carnival.1005.a: "向他们两人发起木棍决斗挑战！"
 carnival.1005.b: "乔装打扮假装偶遇，说一种自己编的语言。"
 carnival.1005.c: "我要用装满香水的彩蛋壳砸他们！"
 carnival.1005.d: "不，我不应该把自己的幽默强加给别人。"
 carnival.1005.tt.stick_success.desc: "你有一场愉快的棍棒打斗"
 carnival.1005.tt.stick_failure.desc: "你玩耍的时候太粗鲁了"
 carnival.1005.tt.success.desc: "大家都笑你摆架子"
 carnival.1005.tt.failure.desc: "你的受害者们叫你是蠢驴"
 carnival.1005.tt.disguise_success.desc: "你逗乐了听众"
 carnival.1005.tt.disguise_failure.desc: "你让听众感到困惑和厌烦。"
 carnival.1005.tt.success.toast: "大家都笑你摆架子"
 carnival.1005.tt.failure.toast: "你的受害者们叫你是蠢驴"
 carnival.1005.tt.egg_success.toast: "你的朋友很喜欢这份芬芳的惊喜"
 carnival.1005.tt.egg_failure.toast: "你的朋友很讨厌那股味道。"
 ## Event - The entertainer
 carnival.1006.t: "艺人"
 carnival.1006.desc: "嘉年华是各类艺人的狂欢季。我正聆听着一队才华横溢的乐师，他们用歌声、诗篇和乐器编织着故事。"
 carnival.1006.a: "花钱请乐师们，让他们唱我伟大的歌！"
 carnival.1006.b: "我会通过中间人招募他们中最优秀的人。"
 carnival.1006.c: "我应该点一首流行的曲子。"
 carnival.1006.d: "邀请附近的[dancer_character.GetWomanMan]共舞一曲！"
 cooltip.carnival.1006.bawdy_song.tt: "点一首低俗的歌"
 cooltip.carnival.1006.patriotic_song.tt: "点一首关于[Glossary( '#bold 祖国！#!', 'carnival_patria_GLOSS' )]的歌"
 cooltip.carnival.1006.spiritual_song.tt: "点一首关于灵性的歌"
 carnival.1006.tt.dance_success.desc: "[dancer_character.GetWomanMan]接受了共舞邀请"
 carnival.1006.tt.dance_failure.desc: "[dancer_character.GetWomanMan]拒绝了共舞邀请"
 carnival.1006.tt.dance_success.toast: "你与[dancer_character.GetFirstNameNoTooltip]共舞"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip]拒绝与你共舞。"
 carnival.1006.bawdy_song.tt.toast: "你点了首下流歌曲！"
 carnival.1006.patriotic_song.tt.toast: "你点了首关于[Glossary( '#bold 祖国#!', 'carnival_patria_GLOSS' )]的歌!"
 carnival.1006.spiritual_song.tt.toast: "你点了首圣歌！"
 carnival.1006.recruit_entertainer.log_title: "招聘艺人"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip]招募了[entertainer_character.GetFirstNameNoTooltip]"
 ## Event - Learning to juggle
 carnival.1007.t: "学习杂耍"
 carnival.1007.desc: "吟游诗人、杂耍艺人和小丑在[carnival_location.GetName]的大道上为人们表演。尤其是那些杂耍艺人吸引了我的目光。很难不佩服他们对那些悬在空中的刀和球的控制力。\n\n其中一个杂耍艺人走上前来，问我是否想试试，就图个乐子。\n\n“一个、两个还是三个球——你能让多少个不落到地上，[ROOT.Char.Custom('MistressMaster')]？”"
 carnival.1007.a: "我打赌，我能同时抛接三个球！"
 carnival.1007.b: "两个球就够了。"
 carnival.1007.c: "抛两把刀怎么样？"
 carnival.1007.d: "我不想自降身份做这种轻浮的事。"
 carnival.1007.juggling_success.tt.toast: "成功的杂耍"
 carnival.1007.juggling_fail.tt.toast: "球落地了"
 carnival.1007.juggling_athletic.tt.toast: "杂耍是锻炼身体和感官的好方法"
 carnival.1007.juggling_k.success.tt.toast: "成功玩刀具杂耍"
 carnival.1007.juggling_k.fail.tt.toast: "耍刀时割伤了自己"
 carnival.1007.blademaster.log_title: "痴迷刀片"
 carnival.1007.blademaster.log: "[carnival_main.GetFirstNameNoTooltip]在用刀杂耍后，对玩锋利的刀片产生着迷"
 ## Event - A wild dance
 carnival.1008.t: "狂野之舞"
 carnival.1008.desc: "中央广场是一片戴面具的舞者之海，音乐与笑声交织。陌生人们相遇，又在旋转的舞蹈中随着舞伴的来去而分开。\n\n当我站在广场边缘时，这种气氛是会传染的！"
 carnival.1008.a: "“我将用黄金奖赏最出色的舞者！”"
 carnival.1008.b: "跳舞，跳舞——直到我的双腿力竭瘫软！"
 carnival.1008.c: "让舞蹈引领我去往任何地方。"
 carnival.1008.d: "享受这一刻。"
 carnival.1008.strong.tt.toast: "舞动的双腿"
 carnival.1008.exhausted.tt.toast: "舞会让你筋疲力尽！"
 carnival.1008.hurt.tt.toast: "跳舞时弄伤了自己！"
 ## Event - A drink with a craftsman
 carnival.1009.t: "与[craftsman_character.Custom('CraftsmanDescOption')]大师共饮"
 carnival.1009.desc: "在[craftsman_character.Custom('CraftsmanDescOption')|l]匠人街上的一家好店铺里，我与一位工匠大师攀谈起来。\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.GetSheHe|U]对能亲自见到[carnival_host.GetTitleAsNameNoTooltip]本人感到惊讶。"
 carnival.1009.1_b.desc: "戴着面具很安全，我确信[craftsman_character.GetSheHe]没有认出我。"
 carnival.1009.2_a.desc: "我饶有兴趣地听[craftsman_character.GetSheHe]抱怨着糟糕的城市管理，指责[carnival_host.GetTitleAsNameNoTooltip]导致了[craftsman_character.GetHerHis]眼下贸易的困境。"
 carnival.1009.2_b.desc: "我兴致勃勃地听[craftsman_character.GetSheHe]赞扬着[carnival_host.GetTitleAsNameNoTooltip]对城市的良好管理，并举杯祝[carnival_host.GetHerHis]身体健康。"
 carnival.1009.2_c.desc: "[craftsman_character.GetSheHe|l]对城市的良好管理非常满意，对我大加赞赏。"
 carnival.1009.2_d.desc: "[craftsman_character.GetSheHe|U]沉默片刻，随后闷闷不乐地说最近日子有点不好过。"
 carnival.1009.a: "我会牢记这一点，加倍努力。"
 carnival.1009.b: "我会派卫兵拿这个乡巴佬开刀。"
 carnival.1009.c: "“那你去解决好它，议员大人！”"
 carnival.1009.d: "我得亮明身份，并且承诺会为这座城市做得更好。"
 carnival.1009.e: "这几个月来，我头一次听到有人真心实意地夸赞。"
 carnival.1009.f: "我早就知道！城市的麻烦事根本不必焦虑。"
 carnival.1009.g: "不出所料。我应当为自己立一座雕像以示荣耀。"
 carnival.1009.h: "说服[craftsman_character.Custom('CraftsmanDescOption')]说出心声"
 carnival.1009.i: "“朋友，我们的共和国正暗流涌动啊。”"
 carnival.1009.j: "“我辛苦做了这么多，总该得到点回报吧？”"
 carnival.1009.k: "“我们的好运，得益于整个共和国！”"
 carnival.1009.l: "我点点头，继续大口喝着[ROOT.Char.Custom('RegionalDrink')]。"
 carnival.1009.m: "我来这里不是为了闲聊，而是为了打架！"
 carnival.1009.n: "“教我一些关于你手艺的知识吧，好[craftsman_character.Custom('CraftsmanDescOption')|l]！”"
 carnival.1009.o: "通过中间人招募大师。"
 carnival.1009.p: "“朋友，这杯我请了。”"
 custom.carnival.1009.spreading_ill_rumors: "所有不同[culture|E]或[faith|E]的[courtier|E]"
 custom.carnival.1009.shared_praise: "所有[courtier|E]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U]获得#V 工匠#![inspiration|E]"
 carnival.1009.drunk.tt.toast: "你喝醉了"
 carnival.1009.tasty.tt.toast: "嗯，真美味！"
 carnival.1009.skillup.tt.toast: "你从工艺大师那里学到了技艺"
 carnival.1009.patron.tt.toast: "获得伙计"
 carnival.1009.councilor.log_title: "新的内阁成员"
 carnival.1009.councilor.log: "[craftsman_character.GetShortUIName|U]被任命为[councillor|E]"
 carnival.1009.recruiting.log_title: "招募[craftsman_character.Custom('CraftsmanDescOption')|U]大师"
 carnival.1009.recruiting.log: "[craftsman_character.GetShortUIName|U]已被[carnival_main.GetFirstNameNoTooltip]招募"
 carnival.1009.learning_trade.log_title: "向工艺大师学习"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip]从一位[craftsman_character.Custom('CraftsmanDescOption')|l]大师那里学到了一些知识"
