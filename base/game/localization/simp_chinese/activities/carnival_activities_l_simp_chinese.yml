 activity_carnival_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]的嘉年华"
 activity_carnival_owner: "举办人"
 activity_carnival_desc: "通过举办一场眼花缭乱的嘉年华来安抚和娱乐你的市民！让你自己和你的臣属有机会放下等级和地位，沉浸在面具后的狂欢、娱乐和美食之中。\n\n每个人都会热切地庆祝你的共和国的历史与文化。这是一个展示财富以激起对手嫉妒的好机会，也是一个在人群中匿名穿行，感受他们无拘无束的想法与忧虑的好机会。"
 activity_carnival_host_desc: "$BULLET_WITH_TAB$可能获得[prestige_i][prestige|E]\n$BULLET_WITH_TAB$可能获得[piety_i][piety|E]\n$BULLET_WITH_TAB$参与者可能获得其他[activity_guest_short_possessive|E]的[opinion_i|E][opinion|E]\n$BULLET_WITH_TAB$参与者可能失去[stress_loss_i][stress|E]\n$BULLET_WITH_TAB$可能提高[county|E]的[control_i|E][control|E]\n$BULLET_WITH_TAB$可能提高[county|E]的[prosperity_i|E][prosperity|E]\n$BULLET_WITH_TAB$可能提高[popular_opinion_i|E][popular_opinion|E]\n"
 activity_carnival_guest_help_text: "嘉年华是发掘有才华的平民、建立商业联系或仅仅是降低[stress_loss_i][stress|E]的绝佳机会。"
 activity_carnival_province_desc: "你在[ROOT.Province.GetName]组织嘉年华。"
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$参与者可能获得[prestige|E]\n$BULLET_WITH_TAB$参与者可能获得其他参与者的[opinion|E]\n$BULLET_WITH_TAB$参与者可能失去[stress_loss_i][stress|E]"
 activity_carnival_conclusion_desc: "[GetActivityType( 'activity_carnival' ).GetName]结束了。"
 activity_carnival_selection_tooltip: "以蒙面狂欢取悦你的人民\n\n预期奖励：\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[piety_i|E][piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E][stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E][opinion|E]\n$BULLET_WITH_TAB$[control_i|E][control|E]\n$BULLET_WITH_TAB$[prosperity_i|E][prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E][popular_opinion|E]"
