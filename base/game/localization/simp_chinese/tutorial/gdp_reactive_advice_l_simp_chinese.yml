l_simp_chinese:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "建筑需求"
 action_reactive_advice_building_needs: "建议：$REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "你的[buildings|E]对[trade_goods|E]有[needs|E]，这些需求由本地[market|E]提供。点击此处了解如何满足这些需求。"
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "如果你想从[domain|E]的[buildings|E]获得最大收益，就应该确保它们能够获得所需的[trade_goods|E]。\n\n来看看如何做到这一点吧！"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "首先，我们应该查看你的[domain|E]。"
 reactive_advice_building_needs_step_open_domain_tab_prompt: "在领地面板打开直辖领地界面（已高亮）"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "这些是你的[domain|E]的所有[holdings|E]。\n\n每个地产的[county|E]都属于一个[market|E]。所有由[buildings|E]生产和消费的[goods|E]都在这些市场中交换。"
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "现在，让我们查看你的一处[holdings|E]。"
 reactive_advice_building_needs_step_open_county_view_prompt: "点击你的一处地产（已高亮）"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "这些是你的[holding|E]的[districts|E]。在每个区划内拥有生产和消费[goods|E]的[buildings|E]。"
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "作为示例，我们可以查看你的[holding_district|E]的[needs|E]。"
 reactive_advice_building_needs_step_open_district_view_prompt: "点击$game_concept_holding_district$（已高亮）#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "在这里，你可以看到[district|E]中每座[building|E]的效果。\n\n某些效果需要消耗[county|E][market|E]中的[trade_goods|E]才能生效。\n\n例如，[holding_district|E]会向[holding|E]提供[food_supply|E]，前提是它能消费[GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon]和[GetTradeGoodCategory('trade_category_meat').GetNameWithIcon]。\n\n不满足[need|E]没有负面效果，而且所有$game_concept_buildings$即使无法获得所需的$game_concept_trade_goods$，也仍会提供某种益处。"
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "通常，并不需要某种特定的[trade_good|E]，而是某一[trade_category_short|E]的$game_concept_goods$的任意组合就足够了。例如，一座[building|E]可能需要[GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon]，这意味着[GetTradeGoodType('trade_good_grain').GetNameWithIcon]、[GetTradeGoodType('trade_good_millet').GetNameWithIcon]或[GetTradeGoodType('trade_good_rice').GetNameWithIcon]中任意一种都可以。\n\n此外，某些[needs|E]可以多次提供；每次满足数量时，效果就会再次生效。"
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "所以，[buildings|E]需求[trade_goods|E]，但它们从何而来？\n\n在[county|E]中消费的每一种贸易商品，都来自该伯爵领的[market|E]。"
 reactive_advice_building_needs_step_open_market_view_prompt: "打开伯爵领的市场（已高亮）#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "这是[county|E]的[market|E]。通常情况下，市场覆盖与[duchy|E]相同的[counties|E]。"
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "在这里，你可以看到每种[trade_good|E]，以及它是否存在[surplus|E]或未满足的[need|E]。\n\n如果存在未满足的需求（#N 负结余#!），则[market|E]中并非所有[buildings|E]都获得了它们的[needs|E]。\n\n如果存在盈余（#P 正结余#!），则市场中所有[buildings|E]对该贸易品的需求都已满足，且该商品可通过[trade_routes|E]出口。\n\n#I 你可以点击一种$game_concept_trade_good$，以查看其在市场中的状态以及在地图上的分布。#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "如果存在未满足的[need|E]，你可以尝试通过多种方式满足它：\n\n$BULLET_WITH_TAB$在[market|E]中建造生产该[trade_good|E]的[buildings|E]。\n$BULLET_WITH_TAB$在你[realm|E]内的两个$game_concept_markets$之间建立[distribution_route|E]。\n$BULLET_WITH_TAB$委托你的一名[client_merchants|E]进口该$game_concept_trade_good$。\n\n然而，并非所有$game_concept_needs$都能轻易满足，有时最好让该$game_concept_need$保持未满足状态。"
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "建造队列"
 action_reactive_advice_construction_queue: "建议：$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "你拥有队列中的建造。打开这里了解如何管理所有建造。"
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "你拥有队列中的建造！\n\n即使你目前无法负担[building|E]花费，你仍可以将其加入队列，一旦你能够支付费用即可开始建造。\n\n让我们查看你的队列。"
 reactive_advice_construction_queue_intro_prompt: "打开$BUILD_QUEUE_WINDOW_TITLE$面板（已高亮）"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "这些是你目前在所有[holdings|E]中已排入队列的所有建造。\n\n一旦你能够支付其费用，且所有其他条件均满足，将自动支付费用开始建造。\n\n建造按队列顺序开始，但你可以在此处通过拖放来重新排列。"
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "如果你想保留一些[gold|E]或其他资源，可以将其储备在此处。\n\n储备资源不会用于启动队列中的建筑，从而确保你始终保留一笔备用资源。"
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "关于建筑队列的说明就是这些了，祝你建造愉快！"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "贸易路线"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "当其他人在田间劳作或向穷人征税时，你则从[goods|E]的流动中获利。\n\n[trade_routes|E]是[merchants|E]和[republics|E]赚取[gold|E]的主要方式。"
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "首先，你必须决定要贸易哪种[trade_good|E]。\n\n这些是为你推荐的选项，但如果你在寻找特定商品，也可以查看所有贸易商品。"
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "在地图上，你可以看到所有交易你选中[trade_good|E]的[markets|E]。\n\n要进行贸易，你需要将一个有商品[surplus|E]的市场（#trade_surplus 青色#!）与一个有该商品[need|E]的地方（#trade_need 金色#!）连接起来。\n\n如果某个市场挤满了其他[merchants|E]，你在那里将只能贸易一部分商品，具体数量受你的[competitiveness|E]限制。\n\n通过低买高卖，你可以赚取更大的利润。\n\n#I 点击市场可将其加入或移出路线。#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "当你将[markets|E]加入你的[route|E]时，所选[good|E]将由该路线运输并显示在此处。\n\n最左边的商品是[primary_good|E]；交易它可获得[trade_expertise|E]。随着时间推移，这将根据其[trade_category|E]为你带来各种好处。\n\n#I 如果你携带超过1种商品，你可以将另一种拖到第一位，使其成为$game_concept_primary_good$。#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "你只能携带有限种类的[goods|E]，且总[capacity|E]也有限。\n\n任何此类限制都可以通过在你的[company|E]中建造[company_buildings_short|E]来改善。"
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "同样，路线受[trade_route_length|E]限制，你只能在有限数量的[markets|E]停留。"
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "最后，你可以指派一名[associates|E]担任[trader|E]。根据你分配给他们的任务，他们将从不同方面改善[route|E]。"
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "随着你的[company|E]发展，你将解锁更多[routes|E]，并提升路线长度和贸易量。\n\n这样一来，你就能赚取越来越多的[gold|E]！"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "成为商人"
 action_reactive_advice_merchant_introduction: "建议：$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "你是个[merchant|E]！点击此处了解商业的基础。"
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "你是[merchant|E]！\n\n虽然[trade|E]是[company|E]的命脉，但生意不仅仅是赚钱。"
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "我们先看看你的[company|E]如何在长期内发展。"
 reactive_advice_merchant_introduction_open_overview_prompt: "在领地面板打开概览界面（已高亮）"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "这是你的[company_size|E]，衡量你的$game_concept_company_possessive$实力的主要标准。\n\n随着你的$game_concept_company$发展，更高[rank|E]的[rulers|E]，如[kings|E]和[emperors|E]，会注意到你。"
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "这是你的[company|E][domicile|E]，你的运营基地。\n\n在这里，你可以花费[gold|E]和[prestige|E]建造[domicile_buildings|E]，进一步强化你的$game_concept_company$。"
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "这是你的[company_purpose|E]，它决定你的$game_concept_company$的重心。\n\n贸易商是默认宗旨，但你可以更改为专注于[artifacts|E]、奢侈品或放贷。"
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "然而，即便身为[merchant|E]，你也无法摆脱地方领主的统治。"
 reactive_advice_merchant_introduction_open_patronage_prompt: "打开$MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$界面（已高亮）"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "这是你的[merchant_patron|E]，即你的[domicile|E]所在[holding|E]的[ruler|E]。\n\n虽然你确实必须向你的$game_concept_merchant_patron$缴税，但你也能从这种关系中获益。\n\n例如，你可以修改你的[client_contract|E]，要求你的$game_concept_merchant_patron$支持你的贸易活动，或降低向贵族提议[marriages|E]的难度。"
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "你通常不是你的[merchant_patron|E]唯一的[client|E][merchant|E]。\n\n其他$game_concept_clients$也会与你从同一地点进行贸易，且只有一个$game_concept_client$能持有特殊的[charter|E]。持有$game_concept_charter$将以特殊[decisions|E]的形式增强你的贸易。"
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "最后，该谈谈那个最重要的问题了：赚钱。"
 reactive_advice_merchant_introduction_open_trade_prompt: "在贸易面板打开贸易路线界面（已高亮）"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "这些是你的[trade_routes|E]，是你赚取[gold|E]的主要方式。\n\n随着你发展你的$game_concept_company$，你将能拥有更多$game_concept_routes$，它们能延伸得更远，并运输更多[goods|E]。这反过来会为你赚取更多$game_concept_gold$。"
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "这就是[merchant|E]之道：从你的[trade_routes|E]中赚取[gold|E]，并将其用于提升你的[prestige|E]和[company_size|E]。\n\n由负责任且组织有序的$game_concept_merchants$拥有的企业，终将超越富有的[rulers|E]所拥有的企业！"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "商会方针"
 action_reactive_advice_company_direction: "建议：$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "随着时间推移，你的[company_direction|E]可能会发生变化。打开这里了解更多。"
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "不是所有[merchants|E]都有相同的目标。虽然[gold|E]本身就是权力，但有些人更看重家族与贵族身份。"
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "你的[company_direction|E]是[house|E]的一部分，让我们看看。"
 reactive_advice_company_direction_open_house_prompt: "选择你的家族（已高亮）"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "回到[sentiment|E]界面。"
 reactive_advice_company_direction_open_direction_tab_prompt: "打开方针界面（已高亮）"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "这是你的[company_direction|E]。虽然它最初是[company_sentiment_independent|E]，但可能会倾向于[company_sentiment_divided|E]或[company_sentiment_concerted|E]。\n\n与[noble|E][houses|E]联姻会使其倾向于$game_concept_company_sentiment_concerted$，而与其他[merchants|E]联姻则会使其倾向于$game_concept_company_sentiment_divided$。"
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "资助建造"
 action_reactive_advice_sponsor_construction: "建议：$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "你可以赞助其他[characters_possessive|E][holdings|E]中的[buildings|E]。打开此窗口了解具体方法。"
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "你现在可以资助其他[characters_possessive|E][holdings|E]中[buildings|E]的升级。"
 reactive_advice_sponsor_construction_select_holding_prompt: "在地图上选择任意地产"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "现在，选择其中的一个[districts|E]。"
 reactive_advice_sponsor_construction_open_district_prompt: "选择一个区划（已高亮）"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "你可以在这里资助一项建筑！注意你只能#EMP 升级#![buildings|E]，而且只能在[districts|E]内进行。\n\n资助的主要目的是提升[holding_possessive|E][market|E]中某类[trade_good|E]的[surplus|E]或[need|E]。这样你就能把$game_concept_market$接入你的[profit_routes|E]，增加你获得的[gold|E]。"
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "共和国政治"
 action_reactive_advice_republican_politics: "建议：$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "你是[republics|E]的一员。打开此界面以了解其政治的错综复杂之处。"
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "作为[house_head|E]，你属于一个高尚的[republics|E]！\n\n作为[patrician_family|E]的领袖，你与其他$game_concept_patrician_families$以一套某种程度上民主的程序共同统治。即使你目前不是$game_concept_republics$的[ruler|E]，只要你有[gold|E]和影响力，你总能参与其中。"
 reactive_advice_republican_politics_intro_prompt: "在共和国面板打开概览界面（已高亮）"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "与公民一样，并非所有[republics|E]都是平等的。每个$game_concept_republics$都有一项[title_tier|E]和[republic_administration|E]，如此处所示。\n\n通过花费[prestige|E]和[treasury|E]，[ruler|E]可以提高$game_concept_republics$的$game_concept_title_tier$，从而提升其权力。\n\n当前$game_concept_ruler$也可以更改$game_concept_republic_administration$，这决定了$game_concept_republics$的总体方向。"
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "说到[ruler|E]，这位就是！\n\n与其他[governments|E]的暴政不同，[republic|E]$game_concept_ruler$经选举产生，而且任期有限。\n\n然而，同一位$game_concept_ruler$可以连任，因此他们同时又是领先的候选人，这很常见。"
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "[ruler|E]的权力受到[assembly|E]的制约。现在让我们来看看。"
 reactive_advice_republican_politics_open_assembly_prompt: "打开议会界面（已高亮）"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "[ruler|E]并非全能：任何[law|E]变更或[republic_decree_short|E]都必须得到[assembly|E]的批准。$game_concept_assembly$成员甚至可以提出自己的$game_concept_law$变更。\n\n$game_concept_assembly$通常包括[republic|E]的[patrician_families|E]。虽然他们没有现代意义上的意识形态，但每个家族都有一个[house_ambition|E]，影响他们的投票方式。\n\n请注意，$game_concept_republic$并不需要屈从于民主的多样与混乱。随着$game_concept_laws$的通过，$game_concept_assembly$与$game_concept_ruler$之间的权力平衡可能发生变化。"
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "既然[assembly|E]通常由[patrician_families|E]组成，那我们继续探讨它们。"
 reactive_advice_republican_politics_open_families_prompt: "打开家族界面（已高亮）"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "这些是[republic|E]的[patrician_families|E]。\n\n每个家族，包括你的家族，都有一个[patrician_rating|E]。当你增加来自[trade|E]的收入，并在[assembly|E]或[ruler|E]的[council|E]中获得席位时，你的$game_concept_patrician_rating$就会提升。\n\n拥有高$game_concept_patrician_rating$会增加你的[house_ambition|E]的效果，甚至能让你推翻政府！"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "[republics|E]的命运掌握在你手中。\n\n如何塑造它，取决于你。你会将权力只保留给你的家族，还是与他人分享？\n\n随着你的[patrician_rating|E]因你的[trade_routes|E]而增长，你的权力与影响力也随之增长。"
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "在这里，你可以建立自己的[distribution_routes|E]。\n\n分配路线允许你在[realm|E]内的[markets|E]间运输[trade_goods|E]以满足[needs|E]。"
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "[distribution_route|E]可以运输任意数量的[trade_goods|E]，但只能运输[basic_trade_goods|E]，这些商品显示在这里。\n\n因此，你无须选择要运输哪一种$game_concept_trade_good$。\n\n#I 你可以选择任意基础商品，在地图上查看其[market_balance|E]#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "在地图上，每个[market|E]的名称下方，你可以看到哪些[basic_trade_goods|E]处于[surplus|E]。这意味着你可以把商品从这里运走。"
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "同样，任何未满足的[needs|E]也会显示出来。这意味着你可以将[basic_trade_goods|E]运往这个[market|E]。"
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "一条[distribution_route|E]只能连接两个[markets|E]，[goods|E]则双向流通。\n\n一旦将两个市场添加到路线中，你便可以在高亮窗口中看到[needs|E]是如何得到满足的。\n\n由于这条路线穿过你自己的[realm|E]，你无需支付[buy_price|E]或任何[tolls|E]。\n\n#I 要在地图上添加或移除某条路线中的市场，点击该市场即可#!"
