l_simp_chinese:
 msg_passive_learned_tenet_abroad_desc: "通过在[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]观察[passive_learn_source.GetRite.GetAdjective][rite|E]的[passive_learn_source.GetTitledFirstName]，你[agnostic_knowledge|E]了[passive_learn_tenet.GetBaseName][core_tenet|E]。"
 msg_passive_learned_doctrine_abroad_desc: "通过在[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]观察[passive_learn_source.GetRite.GetAdjective][rite|E]的[passive_learn_source.GetTitledFirstName]，你[agnostic_knowledge|E]了[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )][doctrine|E]。"
 msg_passive_learned_rite_abroad_desc: "通过[passive_learn_source.GetTitledFirstNameNoTooltip]，你[agnostic_knowledge|E]了[passive_learn_source.GetRite.GetAdjective][rite|E]的[core_tenets|E]和[doctrines|E]。"
 msg_passive_learned_tenet_pilgrimage_rite_desc: "在[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]，你[agnostic_knowledge|E]了[passive_learn_rite.GetAdjective][rite|E]的[passive_learn_tenet.GetBaseName][core_tenet|E]。"
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "在[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]，你[agnostic_knowledge|E]了[passive_learn_rite.GetAdjective][rite|E]的[passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )][doctrine|E]。"
 rite_travel_events.1000.t: "路过的[passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "黄昏降临，一个路过的[passive_learn_rite.GetAdherentName]来到火堆旁加入了我们。\n\n夜渐深，我们分喝[passive_learn_source.Custom('RegionalDrink')]，吃着[passive_learn_source.Custom('RegionalEdibleMeat')]，聊着天。[passive_learn_source.GetSheHe|U]讲起了自己族人的神圣教义，讲[passive_learn_rite.GetNameNoTooltip]是怎么被信奉和实践的。每一句话都带着确信。"
 rite_travel_events.1000.a: "非常有见地。"
 rite_travel_events.1000.b: "[passive_learn_source.GetSheHe|U]应该加入我。"
 rite_travel_events.1000.c: "我对这种异端邪说不感兴趣。"
 rite_travel_events.2000.t: "启示"
 rite_travel_events.2000.desc: "在[location.GetName]的[location.GetTerrain.GetNameNoTooltip]旅行时，我发现一群聚集的人。\n\n一位传道人在讲一种叫做[passive_learn_tenet.GetBaseName]的东西。我从未听说过，我能感受到[passive_learn_source.GetHerHis]话语中的分量。\n\n我本想直接走过去。但我停下来听了。\n\n这……这是真理。"
 rite_travel_events.2000.a: "[ROOT.Char.GetFaith.HighGodName]对我寄予厚望。"
 rite_travel_events.2000.b: "我不是异教徒！"
