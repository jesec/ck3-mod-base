 siena_university_desc: "$building_type_siena_university_desc$"
 building_type_nalanda_university: "那烂陀大学"
 building_type_nalanda_university_desc: "$building_type_generic_university_desc$\n\n那烂陀大学是吠陀学术的重要场所，吸引了远自吐蕃和中国而来的学生。"
