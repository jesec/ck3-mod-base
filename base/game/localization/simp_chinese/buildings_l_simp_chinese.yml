 nalanda_university_desc: "$building_type_nalanda_university_desc$"
 building_type_rammelsberg_mines_01: "拉默尔斯贝格银矿"
 building_type_rammelsberg_mines_01_desc: "在拉默尔斯贝格山的山脚，有一座收益可观、备受追捧的银矿。"
 rammelsberg_mines_01: "拉默尔斯贝格采矿点"
 rammelsberg_mines_01_desc: "一个小的矿业居民点在矿脉附近建立了起来。定居者已经开始开采矿脉提取矿石，但到目前为止，还只能采到地表的矿。"
 rammelsberg_mines_02: "拉默尔斯贝格矿井"
 rammelsberg_mines_02_desc: "随着采矿点的扩大，越来越多的矿石被开采出来。合格的工程师大量涌入，使得建设一个真正意义上的矿场得以实现。"
 rammelsberg_mines_03: "拉默尔斯贝格大矿井"
 rammelsberg_mines_03_desc: "随着开采规模越来越大，更多的矿脉入口被我们打通，我们更在矿洞中建立起大型竖井，让工人们得以开采出更深处的矿石。"
 rammelsberg_mines_04: "拉默尔斯贝格矿业综合体"
 rammelsberg_mines_04_desc: "随着采矿量的增加，一些冶炼厂和铸造厂也在定居点附近被建立起来。加工金属已经成为了这里居民的第二天性，他们的技艺举世皆知。"
