 mount_baekdu_01_desc: "$building_type_mount_baekdu_01_desc$"
 building_type_mozu_tombs: "$mozu_tombs$"
 building_type_mozu_tombs_desc: "$mozu_tombs_desc$"
 mozu_tombs: "百舌鸟古坟群"
 mozu_tombs_desc: "百舌鸟的前方后圆古坟据说安葬着上古天皇。对附近海湾的船只而言，古坟群既是显著的地标，也让人回想起往昔的岁月。"
 building_type_trosky_castle_01: "$trosky_castle_01$"
 building_type_trosky_castle_01_desc: "$trosky_castle_01_desc$"
 trosky_castle_01: "特罗斯基城堡"
 trosky_castle_01_desc: "特罗斯基城堡坐落于一座死火山的两块玄武岩岩层间，其名称意为“废墟”，正是源于这两座岩石形似坍塌的城堡遗迹。"
 building_type_great_project_cathedral_01: "$great_project_cathedral_01$"
 building_type_great_project_cathedral_01_desc: "$great_project_cathedral_01_desc$"
 great_project_cathedral_01: "罗马式大座堂"
 great_project_cathedral_01_desc: "一座始建于早期的主教座堂，为主教驻锡之所，也是基督徒朝圣者心中的明灯。厚重的圆拱与庄严的穹顶之下，圣髑与祭坛静候信众前来瞻仰。\n\n[building|E]效果：在[cathedral_complex|E]添加[GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName]"
 building_type_great_project_cathedral_under_construction: "座堂"
 building_great_project_cathedral_under_construction: "施工中的座堂"
 building_great_project_cathedral_under_construction_desc: "在绞盘起重机和无数脚手架的支撑下，这座由粗石砌筑、尚未完工的宏伟建筑正在缓缓升起，准备有朝一日成为神圣的主教座堂。"
