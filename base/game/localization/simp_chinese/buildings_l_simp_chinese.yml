 building_type_hetian_mines_01: "于阗玉矿"
 building_type_hetian_mines_01_desc: "于阗自古便是和阗玉的产地。这种珍贵的白石是所有玉石中最珍贵的，许多人认为其价值高于黄金或白银。玉石既可直接从山中开采，也可自露天矿坑与河床直接采集。"
 hetian_mines_01: "于阗采矿点"
 hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
 hetian_mines_02: "于阗矿井"
 hetian_mines_02_desc: "随着采矿点的发展，越来越多的玉石被开采出来。随着这些玉石知名度的提升，能干的工程师与商人不断涌入，大大提升了开采作业的盈利性。"
 hetian_mines_03: "于阗大矿井"
 hetian_mines_03_desc: "随着采矿作业的发展，矿场本身也随之扩大。更多人从事采矿工作，往返于玉石开采的多个采矿点之间的交通现在是该地区的常态景象。"
 hetian_mines_04: "于阗矿业综合体"
 hetian_mines_04_desc: "随时间推移，玉石不仅成为该地区的主要出口商品，也成为众多工匠与手艺人的生计。名副其实的作坊与经销商行如今排列在街道两旁。"
 building_type_dushan_mines_01: "独山玉矿"
 building_type_dushan_mines_01_desc: "作为中国四大名玉的产地之一，独山自汉朝以来就一直是玉石开采地。独山玉与其它玉石不同之处在于更浓郁的色泽，也往往比其它种类的玉更加混杂。"
