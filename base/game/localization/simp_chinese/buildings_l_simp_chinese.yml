 building_type_sankore_university: "桑科雷大学"
 building_type_sankore_university_desc: "$building_type_generic_university_desc$\n\n桑科雷大学起初是一座清真寺，在从行商那里获得了丰富的图书后，转变成了一个学术中心。"
