 building_type_zawar_mines_01: "阇婆罗矿区"
 building_type_zawar_mines_01_desc: "几千年来，阇婆罗矿区一直是铅、锌和银的丰富来源。阇婆罗矿床的独一无二不仅在于其丰富程度上，而且还在于其明晰的矿层分隔方式上，这使得在没有更先进冶金工艺的条件下，手工分别矿石成为可能。"
