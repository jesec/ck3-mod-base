 sankore_university_desc: "$building_type_sankore_university_desc$"
 building_type_siena_university: "锡耶纳大学"
 building_type_siena_university_desc: "$building_type_generic_university_desc$\n\n锡耶纳大学和在其中任教的教师完全由锡耶纳的税收进行资助，更确切地说是用向学生租房而获得的税收进行资助。"
