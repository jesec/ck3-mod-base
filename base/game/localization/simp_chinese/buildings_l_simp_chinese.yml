 building_type_powder_magazine_01: "火药工坊"
 building_type_powder_magazine_01_desc: "火药需要精心生产、妥善保管以及定期维护，才能确保其有效性不受影响。若要招募[GetMaA('handgunners').GetName]以及其他依赖火药的军事单位，必须建造专门的设施作为支持。"
 powder_magazine_01: "火药仓库"
 building_powder_magazine_01_desc: "这些专门设计的储存设施能够安全存放火药，有效隔绝外界环境因素的影响，从而显著降低潜在事故发生的可能性。"
 building_powder_magazine_02: "火药转运局"
 building_powder_magazine_02_desc: "任命专职官员监管负责火药复杂物流的专业人员，确保火药妥善储存并在全国范围内安全运输，有效防止任何差错发生。"
 building_powder_magazine_03: "硫磺矿"
 building_powder_magazine_03_desc: "硫磺，这种有时被称为火石的物质，尽管蕴藏丰富，但大规模开采仍然面临诸多挑战。建立专业矿场能够确保这种珍贵矿物资源的持续稳定供应。"
 building_powder_magazine_04: "硝石工坊"
 building_powder_magazine_04_desc: "硝石作为火药制造的核心成分，必须在严格控制的环境中由经验丰富的专业人员进行处理，否则在大规模生产过程中可能引发灾难性火灾，导致整座建筑付之一炬。"
 building_powder_magazine_05: "火药库"
 building_powder_magazine_05_desc: "建造坚固的建筑以供火药的储存，其选址需远离居民区与重要资产，以确保安全。"
 building_powder_magazine_06: "警卫室"
 building_powder_magazine_06_desc: "火药本身具有极高危险性，若被不法之徒获取，其威胁将更加严重。现在可以部署充足的安保力量，有效防备那些居心叵测之人。"
 building_powder_magazine_07: "火药精炼工坊"
 building_powder_magazine_07_desc: "这座独立建筑专门用于混合各种原料制造火药，其隔离设计确保即使发生意外爆炸，也不会波及整个生产基地，有效降低了灾难性损失的风险。"
 building_powder_magazine_08: "手铳工坊"
 building_powder_magazine_08_desc: "手持火器在实战使用过程中常常表现不稳定，甚至容易出现开裂故障。因此，我们必须采购最优质的生产设备，并聘请技艺精湛的工匠大师，确保能够打造出性能卓越的高品质武器装备。"
 powder_magazine_1_effect_desc: "$unlocks_building_desc$[gunpowder|E][men_at_arms|E]征募上限：#P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
 powder_magazine_2_effect_desc: "$unlocks_building_desc$[gunpowder|E][men_at_arms|E]征募上限：#P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
 powder_magazine_3_effect_desc: "$unlocks_building_desc$[gunpowder|E][men_at_arms|E]征募上限：#P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 building_type_mandala_capital_01: "曼荼罗寺庙群"
 building_type_mandala_capital_01_desc: "这座[great_project|E]不仅是庙宇，更是力量的丰碑。它镌刻着我们的功业与#EMP 宫廷威仪#!。如此圣所昭示着神圣提婆罗阇的统治与恩泽。"
 mandala_capital_01: "华饰主殿"
 mandala_capital_01_desc: "作为宏构之始，这座精雕细琢的主殿供奉着统御四方的提婆罗阇，是臣民顶礼膜拜的圣地。"
 mandala_capital_02: "巍峨宝殿"
 mandala_capital_02_desc: "在原有寺庙主殿的基础上，曼荼罗寺庙进行了扩建，增加了神龛、家具和装饰。"
 mandala_capital_03: "寮舍之地"
 mandala_capital_03_desc: "随着寺庙规模的扩大，又增添了新的寮舍。\n现在，不仅有多个供奉神灵的神龛，还有参差错落的信众和僧侣的居所。"
 mandala_capital_04: "曼荼罗补罗"
 mandala_capital_04_desc: "寺庙的占地如一个袖珍小镇，基本实现了生活必需品的自给自足。\n此外，新增的圣物阁与横贯东西的冥想池，将灵性通道拓展至新的维度。"
 mandala_capital_05: "通天神宫"
 mandala_capital_05_desc: "这座稀世神宫是罕见的建筑珍品，是为提婆罗阇特设的华美居所。\n圣迹、法物与奇珍异宝令四方来客叹为观止，惊叹于这座神庙宫殿的繁华。"
 building_type_wulingyuan_01: "$wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$wulingyuan_01_desc$"
 wulingyuan_01: "武陵源"
 wulingyuan_01_desc: "群山中耸立着数以千计的砂岩峰林，拔地而起，蔚为壮观。而除此鬼斧神工的宝迹之外，其间深谷纵横、溪流潺湲，更兼星罗棋布之湖泊与溶洞。"
 building_type_leshan_giant_buddha_01: "$leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$leshan_giant_buddha_01_desc$"
 leshan_giant_buddha_01: "乐山大佛"
 leshan_giant_buddha_01_desc: "这尊摩崖弥勒造像临江而凿，正对岷江与大渡河交汇处，以慈悲法相护佑往来舟楫。"
 building_type_yungang_grottoes_01: "$yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$yungang_grottoes_01_desc$"
 yungang_grottoes_01: "云冈石窟"
 yungang_grottoes_01_desc: "此石窟寺建筑群包含数十座主窟与数百小龛，窟内雕凿佛像更是数以万计。"
 building_type_wudang_mountain_temples_01: "$wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$wudang_mountain_temples_01_desc$"
 wudang_mountain_temples_01: "武当山道观"
 wudang_mountain_temples_01_desc: "武当乃道教洞天福地，其宫观建筑群以太极修炼之法闻名遐迩。"
 building_type_shaolin_monastery_01: "$shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$shaolin_monastery_01_desc$"
 shaolin_monastery_01: "少林寺"
 shaolin_monastery_01_desc: "少林寺最为人熟知的是作为少林功夫的发源地，培养出众多武学高僧，它同时也是一座研习佛学、翻译经文的修行之所。"
 building_type_lingyin_temple_01: "$lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$lingyin_temple_01_desc$"
 lingyin_temple_01: "灵隐寺"
 lingyin_temple_01_desc: "灵隐寺是一名天竺僧于公元328年肇建传法之古刹。历经历朝扩建，形成规模宏大的殿阁、石窟、佛塔，其中的僧舍可容数千比丘修行起居。"
 building_type_giant_wild_goose_pagoda_01: "$giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$giant_wild_goose_pagoda_01_desc$"
 giant_wild_goose_pagoda_01: "大雁塔"
 giant_wild_goose_pagoda_01_desc: "大雁塔始建于公元652年，是一处保存经卷、雕刻和各种造像的地方。该塔后来被重建为壮观的十层塔，但历经各式各样的复建修缮后，塔也降到了七层。"
 building_type_kaifeng_palace_01: "$kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$kaifeng_palace_01_desc$"
 kaifeng_palace_01: "开封皇城"
 kaifeng_palace_01_desc: "开封皇城由宋室定都汴梁时所营建，政令通达的行政中枢坐落于朱垣之内，确保都城乃至天下繁荣昌盛。"
 kaifeng_examination_cost_bonus_desc: "该[barony|E]作为[realm_capital|E]时，[GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName][activity|E]的花费：#P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuildingType('kaifeng_palace_01').GetName]"
 building_type_forbidden_city_01: "$forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$forbidden_city_01_desc$"
 forbidden_city_01: "紫禁城"
 forbidden_city_01_desc: "紫禁城是由近千座殿宇组成的庞大皇城，巍峨宫墙与深堑护城河护卫着这座万千官吏勤恪奉公的国家统治核心。"
 building_type_qianling_mausoleum_01: "$qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$qianling_mausoleum_01_desc$"
 qianling_mausoleum_01: "乾陵"
 qianling_mausoleum_01_desc: "乾陵乃唐高宗与武则天合葬之所，另有数位李氏宗亲祔葬于此。墓冢环绕的封土方城和神道上成列的石像是这座陵墓最具标识性的特征。"
 building_type_quanzhou_seaport_01: "$quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$quanzhou_seaport_01_desc$"
 quanzhou_seaport_01: "泉州港"
 quanzhou_seaport_01_desc: "泉州港是一座商贾云集的著名港口。远至阿拉伯、安纳托利亚，近如日本、高丽，远近各地的商人纷至沓来。商船往来如织，不仅促进了当地产业的繁荣，更使泉州的造船技艺在东南地区独占鳌头。"
 building_type_angkor_wat_01: "$angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$angkor_wat_01_desc$"
 angkor_wat_01: "吴哥窟"
 angkor_wat_01_desc: "吴哥窟是一座供奉毗湿奴神的巨大寺庙建筑群，其设计象征印度教神话中众神居住的须弥山。整个建筑群被宏伟的护城河环绕，拥有多座廊式殿堂，内部布满宗教艺术品、雕塑和浮雕。"
 building_type_citadel_thang_long_01: "升龙城" #昇龍
 building_type_citadel_thang_long_01_desc: "$citadel_thang_long_01_desc$"
 citadel_thang_long_01: "大罗城"
 citadel_thang_long_01_desc: "这是一座驻扎了藩镇劲旅的城池，它被加固为一座牢不可破的要塞以抵御外敌。"
 citadel_thang_long_02: "升龙皇城" #昇龍
 citadel_thang_long_02_desc: "这座皇城复合体兼具堡垒与宫苑功能，分为罗城、皇城及禁城三大建制区域。"
 building_type_po_klong_garai_01: "$po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$po_klong_garai_01_desc$"
 po_klong_garai_01: "波克朗加莱塔"
 po_klong_garai_01_desc: "波克朗加莱塔是占族建筑艺术的巅峰之作，据说是为纪念同名传奇国王而建造。该寺庙包含三座独特的砖塔，主殿内安放着令人惊叹的湿婆神雕像。"
 building_type_dau_temple_01: "$dau_temple_01$"
 building_type_dau_temple_01_desc: "$dau_temple_01_desc$"
 dau_temple_01: "桑寺"
 dau_temple_01_desc: "一座位于羸娄备受尊崇的寺庙，标志来自遥远国度的僧侣最初聚集之地。留存于此的砖塔、舍利和肉身佛体现了几百年来对佛教的敬奉。"
 building_type_liuhe_pagoda_01: "$liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$liuhe_pagoda_01_desc$"
 liuhe_pagoda_01: "六和塔"
 liuhe_pagoda_01_desc: "君王用以镇压江潮并礼敬佛祖而兴建的高塔。它的灯塔照耀大地，象征天人合一。"
 building_type_muaro_jambi_01: "$muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$muaro_jambi_01_desc$"
 muaro_jambi_01: "穆阿罗占卑建筑群"
 muaro_jambi_01_desc: "穆阿罗占卑位于巴当哈里河沿岸，广阔的砖结构建筑群同时保护着贸易和信仰。作为室利佛逝堡垒，它为苏门答腊腹地的统治者提供庇护并动员军队。"
 building_type_hanging_temple_01: "$hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$hanging_temple_01_desc$"
 hanging_temple_01: "悬空寺"
 hanging_temple_01_desc: "悬空寺是一座悬挂在恒山崖壁上的寺庙。据传说，它的建造始于数世纪前一位名为了然的僧侣。寺庙以支柱支撑的木结构大殿供奉着佛教、道教和儒家圣贤，将优美宁静融合进了多种信仰，还挑战着重力。"
 building_type_pagoda_of_fogong_temple_01: "$pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$pagoda_of_fogong_temple_01_desc$"
 pagoda_of_fogong_temple_01: "佛宫寺释迦塔"
 pagoda_of_fogong_temple_01_desc: "佛宫寺释迦塔是一座没有使用钉子建造的高大木塔。塔高九层，存放着舍利和雕像，其巧妙设计至今仍是一个工程奇迹与信仰象征。"
 building_type_plain_of_jars_01: "$plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$plain_of_jars_01_desc$"
 plain_of_jars_01: "石缸平原"
 plain_of_jars_01_desc: "石缸平原是一个遍布着巨型石器的广阔高原，它们的用途笼罩在神秘之中。这些石器曾用于古代仪式，作为被遗忘民族的遗迹留存至今，激发着人们的敬畏和当地的崇敬。"
 building_type_dieng_plateau_01: "$dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$dieng_plateau_01_desc$"
 dieng_plateau_01: "迪延高原"
 dieng_plateau_01_desc: "迪延高原是一个薄雾笼罩的火山盆地，硫磺池和气体喷口点缀景观。错落有致的古老寺庙和祭祀传说使这里既令人畏惧又备受尊崇，是一个古代善恶神灵曾经游荡的神圣高地。"
 building_type_mount_apo_01: "$mount_apo_01$"
 building_type_mount_apo_01_desc: "$mount_apo_01_desc$"
 mount_apo_01: "阿波山"
 mount_apo_01_desc: "阿波山高耸于贝纳多湖之上，在卢马德语中意为“受尊敬的长者”。它是“圣山之灵”的缩写形式，也被称为“长者桑达瓦”或“祖父桑达瓦”。为“阿波桑达瓦”举行的仪式由部落的萨满执行，萨满被视为祖先灵魂的媒介。"
 building_type_besakih_temple_01: "$besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$besakih_temple_01_desc$"
 besakih_temple_01: "布撒基寺"
 besakih_temple_01_desc: "被称为“婆利母庙”的布撒基寺是岛上最重要、最神圣的印度教寺庙建筑群。它位于婆利岛最高火山和圣山“阿贡山”的山坡上。它是岛上宗教和文化中心，为所有人举办盛大仪式。"
 building_type_gongsanseong_fortress_01: "$gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$gongsanseong_fortress_01_desc$"
 gongsanseong_fortress_01: "公山城"
 gongsanseong_fortress_01_desc: "公山城坐落于俯瞰锦江的山巅之上。作为百济的王城而建，其悠长的城墙和石门保卫着国王与臣民，是王朝权力和防御的山地堡垒。"
 building_type_krakatoa_01: "$krakatoa_01$"
 building_type_krakatoa_01_desc: "$krakatoa_01_desc$"
 krakatoa_01: "喀拉喀托火山"
 krakatoa_01_desc: "喀拉喀托是一座雄伟的火山，位于一座近海的岛屿之上。"
 building_type_borobudur_01: "$borobudur_01$"
 building_type_borobudur_01_desc: "$borobudur_01_desc$"
 borobudur_01: "婆罗浮屠"
 borobudur_01_desc: "婆罗浮屠是由九层石台层层堆砌而成的巨型佛教寺庙，顶部矗立着中央圆顶。整个建筑表面装饰着数千幅浮雕和数百尊佛像。"
 building_type_hoshi_ryokan_01: "$hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$hoshi_ryokan_01_desc$"
 hoshi_ryokan_01: "法师旅馆"
 hoshi_ryokan_01_desc: "法师旅馆是一座由家族祖辈经营的古老客栈，为旅人提供休憩、餐食和温泉浴，以疗愈旅途的尘劳。"
 building_type_celestial_great_barracks_01: "军镇大营"
 building_type_celestial_great_barracks_01_desc: "这座庞大的军营要塞综合体为当地总督提供兵力以扩充军队，并能显著提升了该地区的防御能力。经过扩建，它本身就成为一座堡垒城镇，一旦官员履职不力，这里就会承担起整个行省的防御、补给和治理职能。"
 celestial_great_barracks_01: "$building_type_celestial_great_barracks_01$"
 building_celestial_great_barracks_01_desc: "这座庞大的军营要塞综合体为当地总督提供兵力以扩充军队，并能显著提升了该地区的防御能力。"
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U]不是军事[governor|E]"
 celestial_great_barracks_great_project_only_desc: "只能通过完成[GetGreatProjectType('construct_great_barracks').GetName][great_project|E]来建造"
 building_type_the_great_wall_01: "$the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$the_great_wall_01_desc$"
 the_great_wall_01: "长城"
 the_great_wall_01_desc: "这是长城最为古老的一部分，大部分建于秦朝。岁月的流逝也许磨蚀了石头、砖块和砂浆，但它仍然是一座坚固的防御工事。"
 building_type_the_great_wall_02: "$the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$the_great_wall_02_desc$"
 the_great_wall_02: "长城"
 the_great_wall_02_desc: "汉朝大幅扩建了秦朝所建的长城。其新建的长城横跨沙漠和山脉，绵延数百英里。"
 building_type_the_great_wall_03: "$the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$the_great_wall_03_desc$"
 the_great_wall_03: "长城"
 the_great_wall_03_desc: "在公元五世纪至六世纪期间，北魏、北齐和隋三朝均对长城进行了扩建和修缮，增强了长城的防御工事。"
 building_type_the_great_wall_04: "$the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$the_great_wall_04_desc$"
 the_great_wall_04: "长城"
 the_great_wall_04_desc: "长城是一项令人叹为观止的工程壮举。自公元前七世纪初次修建以来，它已被多次扩建。如今，长城绵延数千里，设有无数烽燧、营房和戍所。毫无疑问，任何北方游牧入侵者都无法逾越这道雄伟的屏障。"
 building_type_the_great_wall_shanhai_pass: "$the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 the_great_wall_shanhai_pass: "$the_great_wall_04$"
 the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 the_great_wall_liaodong: "$the_great_wall_04$"
 the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 special_building_improve_silk_road: "该[special_building|E]完工后会使[sub_region_temp.GetName][situation_sub_region|E]更接近[situation_silk_road_phase_exceptional_bounty|E][silk_road|E][situation_phase|E]#weak （如果未处于该阶段）#!"
 building_type_herat_bazaar_01: "$herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$herat_bazaar_01_desc$"
 herat_bazaar_01: "赫拉特市集"
 herat_bazaar_01_desc: "熙熙攘攘的赫拉特市集自阿契美尼德王朝时期就以#italic 哈拉伊瓦#!之名声名在外。每日出入城市的商队使此地成为了呼罗珊的明珠。"
 herat_bazaar_02: "赫拉特繁盛市集"
 herat_bazaar_02_desc: "赫拉特繁盛市集货殖云集，“呼罗珊明珠”的光辉比任何冠冕的宝石还要更加闪耀。"
 building_type_tabriz_bazaar_01: "$tabriz_bazaar_01$"
 building_type_tabriz_bazaar_01_desc: "$tabriz_bazaar_01_desc$"
 tabriz_bazaar_01: "大不里士市集"
 tabriz_bazaar_01_desc: "自古以来，大不里士这座古老的市场便一直是重要的商业中心。墙壁上装饰着彩色的瓷砖和着色的灰泥，彰显着这座古老年集市的财富与声望。"
 tabriz_bazaar_02: "大不里士繁盛市集"
 tabriz_bazaar_02_desc: "岁月并未削弱大不里士庄严古市的活力；恰恰相反，这座令人肃然起敬的市集似乎比以往任何时候都更加热闹。"
 building_type_gurganj_bazaar_01: "$gurganj_bazaar_01$"
 building_type_gurganj_bazaar_01_desc: "$gurganj_bazaar_01_desc$"
 gurganj_bazaar_01: "玉龙杰赤市集"
 gurganj_bazaar_01_desc: "作为通往草原的门户，繁华的玉龙杰赤城因汇聚了众多在边地求财牟利的商贾和旅人而闻名。"
 gurganj_bazaar_02: "玉龙杰赤繁盛市集"
 gurganj_bazaar_02_desc: "烈日之下，牧民、商贾与冒险家在此谋取财富，用到由皇帝铸造的异域钱币时，总会低声传颂遥远中国的富庶。"
 building_type_lhasa_market_01: "$lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$lhasa_market_01_desc$"
 lhasa_market_01: "逻些市集"
 lhasa_market_01_desc: "地处于印度与中华之间的要冲，逻些商人汇集于布达拉宫巍峨的阴影下，竞相吸引着旅人的注目。"
 lhasa_market_02: "逻些繁盛市集"
 lhasa_market_02_desc: "日光之下并无新事，逻些的商人更令你对此深信不疑，丝绸之路沿途流转的奇珍异宝，无一不曾经其掌眼。"
 building_type_changan_market_01: "$changan_market_01$"
 building_type_changan_market_01_desc: "$changan_market_01_desc$"
 changan_market_01: "长安市集"
 changan_market_01_desc: "长安，意为#EMP “长治久安”#!，这里的市集熙来攘往，百货云集，几乎是所有出入中华商货的必经之地。"
 changan_market_02: "长安繁盛市集"
 changan_market_02_desc: "长安豪商对人间至宝早已司空见惯——他们不仅遍识天下奇珍，很可能还藏有个中精品。"
 building_type_dunhuang_market_01: "$dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$dunhuang_market_01_desc$"
 dunhuang_market_01: "敦煌市集"
 dunhuang_market_01_desc: "敦煌城坐落于疏勒河波光粼粼的岸边，标志着河西走廊与塔里木盆地的分界，是往来旅人关键的歇足地。"
 dunhuang_market_02: "敦煌繁盛市集"
 dunhuang_market_02_desc: "敦煌被烈日曝晒的街巷间，唯有无数满载的骆驼、骡马与行人慵缓而稳健的步伐，以及他们东西往返交织不息的足迹。"
 building_type_lahur_bazaar_01: "$lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$lahur_bazaar_01_desc$"
 lahur_bazaar_01: "拉合尔市集"
 lahur_bazaar_01_desc: "拉合尔老城环绕两大市集而建，民居错落于绵延的夯土墙内。市集的嘈杂熙熙攘攘，自老一辈记事之始便未曾断绝，我们料想它们必将世代延续。"
 lahur_bazaar_02: "拉合尔繁盛市集"
 lahur_bazaar_02_desc: "商旅穿行于拉合尔繁盛的市集，如江河奔流于大地般自然。密集的市场中商铺林立，商贩目光如炬，仿佛蕴藏着这座城市传奇历史中的所有智慧。"
 building_type_hamadan_bazaar_01: "哈马丹市集"
 building_type_hamadan_bazaar_01_desc: "$hamadan_bazaar_01_desc$"
 hamadan_bazaar_01: "哈马丹市集"
 hamadan_bazaar_01_desc: "作为古代米底文明的心脏，哈马丹自泥板与楔形文字铭刻的时代起便是商贸重镇。历经数百代，商贾们在哈马丹主要集市的摊位上，不仅兜售货品，更展示着他们精湛的手艺。"
 hamadan_bazaar_02: "哈马丹繁盛市集"
 hamadan_bazaar_02_desc: "哈马丹的大集市以前所未有的态势繁荣兴盛，其财富之丰盈、活动之频繁，皆达到了其悠久而尊荣的历史中无可比拟的新巅峰。"
 building_type_sunday_bazaar_01: "可失合儿周日市集"
 building_type_sunday_bazaar_01_desc: "$sunday_bazaar_01_desc$"
 sunday_bazaar_01: "可失合儿周日市集"
 sunday_bazaar_01_desc: "一些当地人会告诉你，早在货币尚未发明之前，可失合儿便已有了周日集市。漫步于市场的摊位之间，难免会有这样的感受——难以想象如此繁华竟有未曾存在的时代。"
 sunday_bazaar_02: "可失合儿繁盛周日市集"
 sunday_bazaar_02_desc: "尽管可失合儿盛大的周日集市或许自古便已存在，但它如今的繁荣必将为后世所铭记。"
 building_type_mount_fuji_01: "富士山"
 building_type_mount_fuji_01_desc: "巍峨壮丽的富士山终年积雪，孤峰傲立于日本东部门户，是列岛最具标志性的自然奇观，吸引着无数旅人与朝圣者前来朝圣，使所有凝望它的人获得内心的宁静。作为神道教最神圣的信仰圣地之一，富士山是火山女神#EMP 木花咲耶姬#!的居所——这位执掌火山、樱花与刹那芳华之美的女神。"
 mount_fuji_01: "$building_type_mount_fuji_01$"
 mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 building_type_waterworks_01: "水资源管理"
 building_type_waterworks_01_desc: "水是所有生命赖以生存的基础。维系水源稳定供给并善加利用，对维系国家强盛与统治稳固至关重要。"
 waterworks_01: "人工池塘"
 building_waterworks_01_desc: "管理水资源的第一步是有水可供管理。在地面挖掘一个简单洼地，用黏土铺设以保水，形成可蓄水备用的天然区域。"
 building_waterworks_02: "蓄水池"
 building_waterworks_02_desc: "更深的孔洞、渗透性较低的衬层与简易顶盖有助于打造能够储存更多水且储存时间更长的设施，同时减少污染或蒸发造成的损失。"
 building_waterworks_03: "平水运河"
 building_waterworks_03_desc: "在储水地点之间挖掘沟渠，使受控水源能覆盖更多的人。在水资源过剩时缓解洪水压力，同时仍能在干旱时期为人们、牲畜与作物供水。如果规划得当，此类设施甚至可供轻型船只通行。"
 building_waterworks_04: "灌溉水库"
 building_waterworks_04_desc: "任何类型的山丘、山脊或地势变化，如果挖掘适当堤坝都可以变成储水场所。这些露天水库通过沟渠相连，能够相互供给，从而更好地控制特定时间的储水量与用水量。"
 building_waterworks_05: "阶梯井"
 building_waterworks_05_desc: "水资源管控可与基础挖井技术相结合，在地下挖出巨型建筑结构，此结构将始终拥有源自地下的水源。这些地下建筑仍能连接至地面水闸与沟渠，既能为其补充更多水源，也能按需将水虹吸引流至其他区域。"
 building_waterworks_06: "运河闸门"
 building_waterworks_06_desc: "水道本身的深度可通过闸门与排水系统进行控制。储存在这些闸门后的水可用于为驳船与小船建造可航行的水道，从而使运河极适宜运输。"
 building_waterworks_07: "人工湖"
 building_waterworks_07_desc: "一个巨型水库可容纳大量的水。由河流与沟渠供给水源的人工湖能为广阔农田与众多村庄供水。其宏伟意味着它们本身也可以作为显赫之地，成为崇拜与统治的理想场所。"
 building_waterworks_08: "供水与排污系统"
 building_waterworks_08_desc: "通过管道与泵，水可上下流动，能向最高的塔楼供水并将废物冲至最远的污水池中。任何地方都不会缺水，多余的水可以在变成危险洪水前被排出。"
 building_type_spice_plantation_01: "香料种植园"
 building_type_spice_plantation_01_desc: "最上乘的香气与最细腻的风味仅能从生长于世界上非常特定区域的植物中提取。如果土地能够培育这些植物，它们的稀有性与品质会使生产利润异常丰厚。"
 building_spice_plantation_01: "搜寻香料"
 building_spice_plantation_01_desc: "香料由自然中的数种乔木、灌木和花朵产出。但首先是要#italic 找到#!这些植物。"
 building_spice_plantation_02: "栽培香料林"
 building_spice_plantation_02_desc: "最受欢迎的香料可在适当条件下，通过适当劳动力与适当监管者的适当监督进行种植。"
 building_spice_plantation_03: "香料园"
 building_spice_plantation_03_desc: "在大面积的土地上以几何方法种植作物，能够年复一年产出产量稳定的香料。"
 building_spice_plantation_04: "干燥香料"
 building_spice_plantation_04_desc: "在作物附近预留空间用于在运输前对香料进行干燥，使得更多收获的作物能在变质前得到加工，从而节省香料总体生产的成本。"
 building_spice_plantation_05: "香料磨坊"
 building_spice_plantation_05_desc: "研磨会使香料更易变质，但也能使储存更加高效。磨坊还能协助风选，使作物更加纯净。"
 building_spice_plantation_06: "香料地产"
 building_spice_plantation_06_desc: "将工人住房、作物加工和产品储存集中整合到香料实际种植地附近，有助于以更少的总体成本生产和销售更多的香料。"
 building_spice_plantation_07: "种植园土地管理"
 building_spice_plantation_07_desc: "大地本身可被改造以开垦更多土地用于作物种植。梯田与沟渠为种植更多作物创造了新的机会。"
 building_spice_plantation_08: "产业化香料生产"
 building_spice_plantation_08_desc: "只要方向正确，整片土地都可以全力生产最赚钱的香料。每一棵乔木，每一丛灌木，每一片叶子，每一粒坚果都是金库里的又一枚钱币。"
 building_type_examination_hall_01: "贡院"
 building_type_examination_hall_01_desc: "无贡院则科举不立。州府长官须确保官员考务所用一应俱全，并保障学子应考之需，同时杜绝舞弊之隙。"
 examination_hall_01: "$building_type_examination_hall_01$"
 building_examination_hall_01_desc: "开科取士，需先立试院。设考棚以为考选之基，虽规制简备，然为抡才之始。"
 examination_hall_02: "$building_type_examination_hall_01$ II"
 building_examination_hall_02_desc: "一次小小的祈祷，比起世界上所有的学习和准备，更能给予考生信心。"
 examination_hall_03: "$building_type_examination_hall_01$ III"
 building_examination_hall_03_desc: "这座集讲堂、考场、学官衙署及仓储于一体的贡院建筑群，为科举考试各个环节的开展提供了高效优质的全面保障。"
 examination_hall_04: "$building_type_examination_hall_01$ IV"
 examination_hall_05: "$building_type_examination_hall_01$ V"
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "降低在该[holding|E]中举办的[GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName]和[GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName][activities|E]的费用：[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "地点拥有$building_type_examination_hall_01$"
 building_can_benefit_requirements: "#S 如果你满足要求：#!\n"
 rebuilding_grants_full_benefits: "#S [rebuilding|El]后：#!\n"
 building_requirements_header: "#S 要求：#!\n"
 building_fallback: "#S 如果你未满足要求：#!\n"
 building_effects_header: "#S 效果：#!\n"
 building_type_citadel_shrine_01: "要塞神殿"
 building_type_citadel_shrine_01_desc: "一座$building_type_temple_citadel_01$若缺少供奉神明的殿堂，便称不上完整。无论是往来民众还是驻守将士，当踏入其高墙之内，那庄严神圣的气息便能抚慰每一颗躁动的心灵。"
 building_citadel_shrine_01: "钵罗娑陀高塔"
 building_citadel_shrine_01_desc: "钵罗娑陀高塔耸立于$building_type_temple_citadel_01$之上，在远处勾勒出庄严的轮廓，让信徒们能够从远处瞻仰圣殿。"
 building_citadel_shrine_02: "钵浪伽尖塔"
 building_citadel_shrine_02_desc: "钵浪伽尖塔巍然耸立，层层叠叠的结构被繁复精美的雕刻所环绕，更凸显其拔地而起的恢弘气势。当人们在此祈祷时——无论是低声诵念还是静默沉思——这座建筑都能成为视觉的温柔栖息地，令人心旷神怡。"
 building_citadel_shrine_03: "圣洁雕像"
 building_citadel_shrine_03_desc: "这群雕像永恒地仰望着苍穹，仿佛在沉思着亘古的奥秘。它们静默的凝视，总能在信徒心底激起层层波澜——或是虔诚的震颤，或是深邃的惶惑，又或是某种超越言语的灵性共鸣。"
 building_citadel_shrine_04: "狮子塑像"
 building_citadel_shrine_04_desc: "这些威仪凛然的守护狮龇牙而笑，炯炯目光如炬，为$building_type_temple_citadel_01$的居民们带来神圣的庇护与祝福。"
 building_citadel_shrine_05: "那伽守护者"
 building_citadel_shrine_05_desc: "这些精雕细琢的七头蛇像以砂岩为材，胸前曼荼罗纹饰繁复精美，默默守护着神殿，为信众带来绵延不绝的和平与繁荣福祉。"
 building_citadel_shrine_06: "浅浮雕"
 building_citadel_shrine_06_desc: "人们总在这些浅浮雕前长久驻足，细细品味那些精妙的细节——刀光剑影间凝固着壮烈的战斗史诗，而每一道纹路深处，都镌刻着神性的万千姿态与创世的永恒神话。"
 building_citadel_shrine_07: "宝函"
 building_citadel_shrine_07_desc: "这座$building_type_temple_citadel_01$汇聚了无数宗教圣像与仪式法器，其藏品之丰赡、品类之完备，堪称举世无双。"
 building_citadel_shrine_08: "天王像"
 building_citadel_shrine_08_desc: "那神圣的存在以永恒之姿凝驻时光，信徒们虔诚祈祷、躬身致意，只为承接其庄严的恩泽与祝福。"
 building_type_sacred_pool_01: "圣池"
 building_type_sacred_pool_01_desc: "这样一大片水域或许有多种用途；而最令人惊叹的，莫过于它随四时流转所呈现的奇观——池水倒映的天光云影幻化出的绝美景致。这些水池既是水源也是防御工事，是居民日常生活的重要组成部分。"
 sacred_pool_01: "莲花池"
 building_sacred_pool_01_desc: "一方和谐的池塘，以其美丽与宁静令观者叹服，相传诸多重要精神仪式曾在此举行。"
 sacred_pool_02: "神圣水库"
 building_sacred_pool_02_desc: "随着规模的扩展，这座$sacred_pool_02$偶尔也会吸引来野生动物。在动植物和谐共处的景象下，访客能体悟到生命轮回最本真的模样。"
 building_sacred_pool_03: "灵潭"
 building_sacred_pool_03_desc: "这片水域作为举行奇特仪式的场所，述说着其统治者德被四方的故事。"
 building_sacred_pool_04: "护城河"
 building_sacred_pool_04_desc: "$building_type_sacred_pool_01$如今环绕着宗教场所，在它与潜在敌人之间形成了一道防护，居民们由此感到更加安全。"
 building_sacred_pool_05: "小巴莱"
 building_sacred_pool_05_desc: "一群监护狮守卫着巴莱，让任何闯入者在穿越其平静水域前都不得不三思而行。"
 sacred_pool_06: "圣池"
 building_sacred_pool_06_desc: "$sacred_pool_06$从东延伸到西，蔚为壮观。蛇形雕像协助着守卫它的外围。"
 building_sacred_pool_07: "大巴莱"
 building_sacred_pool_07_desc: "雕像、繁花似锦的植被与瑰丽绝伦的景致映衬着这片浩瀚水域，在酷暑之际带来清凉和水分。"
 building_sacred_pool_08: "圣巴莱"
 building_sacred_pool_08_desc: "过往旅人无不敬畏于这片人工水域的浩瀚——极目远眺，对岸难辨虚实。恰是此地通连神圣的明证。"
 building_type_vihara_halls_01: "精舍厅"
 building_type_vihara_halls_01_desc: "这是一座寺院建筑，为僧众在雨季提供庇护，此处是静思、祈祷与休养之所。扩建大厅有助于居住信徒的活力与虔诚。"
 vihara_halls_01: "祈祷佛龛"
 building_vihara_halls_01_desc: "新增的$vihara_halls_01$为访客提供了礼拜与冥想的场所。"
 building_vihara_halls_02: "藏经阁"
 building_vihara_halls_02_desc: "藏经阁内典藏古今经卷。来访信众可随时研习，藉此精进修持并进一步开悟。"
 building_vihara_halls_03: "柱廊拜佛堂"
 building_vihara_halls_03_desc: "宏伟的柱廊耸立于这些拜佛堂之上，为内部叩拜者呈现繁复的铭刻与各种宗教图景。"
 building_vihara_halls_04: "曼陀婆"
 building_vihara_halls_04_desc: "这座带柱大殿的宏伟规格非常适合举办公共仪式或其他宗教法会。"
 building_vihara_halls_05: "舍罗亭阁"
 building_vihara_halls_05_desc: "一座坐落于绿茵之中的亭阁，其美感与灵性氛围相得益彰。"
 building_vihara_halls_06: "结界石"
 building_vihara_halls_06_desc: "结界石有助于$building_type_vihara_halls_01$的管理者确定僧侣进行符合仪轨的礼拜时所需空间的适当大小与距离。"
 vihara_halls_07: "钟铃塔"
 building_vihara_halls_07_desc: "一座宏伟的$vihara_halls_07$矗立于$building_type_vihara_halls_01$之上，白昼反射阳光，夜色中巍然可见。"
 building_vihara_halls_08: "大佛堂"
 building_vihara_halls_08_desc: "厅堂的舒适与便利吸引僧侣们远道而来访修，通过珍贵的信息渠道巩固并传播教义与思想，将和谐传播至邻近领地。"
 building_type_itsukushima_jinja_01: "$itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$itsukushima_jinja_01_desc$"
 itsukushima_jinja_01: "严岛神社" #厳島神社
 itsukushima_jinja_01_desc: "严岛神社始建于六世纪，供奉着神道教中的海洋和风暴女神。其水上回廊凌波而立，眺望着仿佛漂浮于松岛湾水面之上的著名鸟居。"
 itsukushima_jinja_02: "$itsukushima_jinja_01$"
 itsukushima_jinja_02_desc: "$itsukushima_jinja_01_desc$"
 building_type_heian_palace_01: "$heian_palace_01$"
 building_type_heian_palace_01_desc: "$heian_palace_01_desc$"
 heian_palace_01: "平安宫" #平安宮
 heian_palace_01_desc: "这座庞大的宫殿群由桓武天皇营建作为其都城平安京的核心，即“平安之都”，是日本的皇室朝堂、居所及中央官署的所在地。它的廊道间充斥着典礼仪轨、权谋机变，古老的贵族门阀在此角逐权势。"
 building_type_ise_jingu_01: "$ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$ise_jingu_01_desc$"
 ise_jingu_01: "伊势神宫" #伊勢神宮
 ise_jingu_01_desc: "伊势神宫是太阳女神#EMP 天照大神#!的皇大神宫，也是神道教至圣地之一。神社供奉着大和皇权神器，并由从皇族中遴选的斋王巫女主持。"
 building_type_kofuku_ji_01: "$kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$kofuku_ji_01_desc$"
 kofuku_ji_01: "兴福寺" #興福寺
 kofuku_ji_01_desc: "兴福寺始建于七世纪，是奈良七大寺之一，是日本佛教思想与权力最古老且最重要的核心之一。"
 building_type_enryaku_ji_01: "$enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$enryaku_ji_01_desc$"
 enryaku_ji_01: "延历寺" #延暦寺
 enryaku_ji_01_desc: "延历寺由$SaichO_$于八世纪末建立，坐落于比睿山上，俯瞰着桓武天皇的首都平安京，是日本佛教法华宗（或称天台宗）的中心。"
 building_type_dazaifu_01: "$dazaifu_01$"
 building_type_dazaifu_01_desc: "$dazaifu_01_desc$"
 dazaifu_01: "太宰府政厅" #興福寺
 dazaifu_01_desc: "太宰府是帝国朝廷设于九州边陲的行政中心。职能涵盖统筹岛内防务、促进海外贸易及接待外国使节，太宰府长官职位常为雄心勃勃的官僚的晋升阶梯。"
 building_type_chinjufu_01: "$chinjufu_01$"
 building_type_chinjufu_01_desc: "$chinjufu_01_desc$"
 chinjufu_01: "镇守府政区" #鎮守府
 chinjufu_01_desc: "镇守府初设于多贺，是朝廷平定日本北方的军事要塞，由一名负责区域防务与税收事务的专职指挥官统辖。"
 building_type_hakata_port_01: "$hakata_port_01$"
 building_type_hakata_port_01_desc: "$hakata_port_01_desc$"
 hakata_port_01: "博多港" #博多
 hakata_port_01_desc: "自大和政权肇始以来，九州北岸的博多港即为海上门户，受邻近太宰府官署统辖，商贾在此兜售异域商品，各国使团由此踏上日本国土。"
 building_hakata_port_02: "$hakata_port_01$"
 building_hakata_port_02_desc: "$hakata_port_01_desc$"
 building_type_hwangnyongsa_01: "$hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$hwangnyongsa_01_desc$"
 hwangnyongsa_01: "皇龙寺" #皇龍寺 (황룡사)
 hwangnyongsa_01_desc: "皇龙寺落成于七世纪，系新罗真兴王敕建的一座庞大的建筑群，是佛教弘法与权力的中枢，其内矗立着世界上最高的宝塔之一。"
 building_type_white_deer_grotto_academy_01: "$white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$white_deer_grotto_academy_01_desc$"
 white_deer_grotto_academy_01: "白鹿洞书院"
 white_deer_grotto_academy_01_desc: "该学院由隐士李渤创建于白鹿出没之地，作为理学思想中心而蓬勃发展。"
 building_type_shigu_academy_01: "$shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$shigu_academy_01_desc$"
 shigu_academy_01: "石鼓书院"
 shigu_academy_01_desc: "该书院吸引了学者在湖南幽静群山中研习经典。作为诗歌与哲学的中心，它将唐代传统延续至宋代。"
 building_type_culai_academy_01: "$culai_academy_01$"
 building_type_culai_academy_01_desc: "$culai_academy_01_desc$"
 culai_academy_01: "徂徕书院"
 culai_academy_01_desc: "学者们在徂徕山群峰间建立了一所书院以潜心研习儒家典籍。它的厅堂间回荡着关于自然和谐与治理国家的辩论。"
 building_type_lize_academy_01: "$lize_academy_01$"
 building_type_lize_academy_01_desc: "$lize_academy_01_desc$"
 lize_academy_01: "丽泽书院"
 lize_academy_01_desc: "丽泽书院在河北的水域芦苇间推动学术发展，在动荡的边疆地区中成为儒家秩序的北方堡垒。"
 building_type_maoshan_academy_01: "$maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$maoshan_academy_01_desc$"
 maoshan_academy_01: "茅山书院"
 maoshan_academy_01_desc: "该书院专注于仪轨、冥想和圣典修习，与宋代儒家书院形成了精神对照。"
 building_type_tiantai_monasteries_01: "$tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc: "$tiantai_monasteries_01_desc$"
 tiantai_monasteries_01: "天台宗寺院"
 tiantai_monasteries_01_desc: "该寺院作为天台宗的学术机构，专注于教授哲学与禅修。"
 building_type_jizu_shan_temples_01: "$jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc: "$jizu_shan_temples_01_desc$"
 jizu_shan_temples_01: "鸡足山寺庙"
 jizu_shan_temples_01_desc: "这座山地佛教寺庙建筑群曾是一处密宗佛教的据点。朝圣者将其比作印度的灵鹫山。"
 building_type_nanhua_temple_01: "$nanhua_temple_01$"
 building_type_nanhua_temple_01_desc: "$nanhua_temple_01_desc$"
 nanhua_temple_01: "南华寺"
 nanhua_temple_01_desc: "禅宗六祖惠能的驻锡之地，至今它仍是禅宗教义活跃的传播中心。"
 building_type_byeokran_port_01: "$byeokran_port_01$"
 building_type_byeokran_port_01_desc: "$byeokran_port_01_desc$"
 byeokran_port_01: "碧澜渡" #碧瀾渡 (벽란도)
 byeokran_port_01_desc: "碧澜渡地处开城西郊的礼成江入海口，是外商洋货避开北界山险进入高丽半岛最直接的路线。"
 building_type_sado_mines_01: "$sado_mines_02$" #佐渡金山
 building_type_sado_mines_01_desc: "$sado_mines_01_desc$"
 sado_mines_01: "佐渡金山矿坑"
 sado_mines_01_desc: "作为一个古老的流放地，鲜有人料想到偏远的佐渡岛地表下竟暗藏如此丰厚的黄金矿藏。"
 sado_mines_02: "佐渡金山矿井"
 sado_mines_02_desc: "矿坑得到扩建，引进了能真正增加黄金开采量的工程师。"
 sado_mines_03: "佐渡金山大矿井"
 sado_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现新的黄金矿脉。"
 sado_mines_04: "佐渡金山矿业综合体"
 sado_mines_04_desc: "黄金的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 building_type_tada_mines_01: "$tada_mines_02$" #多田銀銅山遺
 building_type_tada_mines_01_desc: "$tada_mines_01_desc$"
 tada_mines_01: "多田铜山矿坑"
 tada_mines_01_desc: "在坐落于北摄山脉的多田村的地下，蕴藏着大量贵金属待提炼。相传东大寺大佛鎏金所用金材即采掘于此地。"
 tada_mines_02: "多田铜山矿井"
 tada_mines_02_desc: "矿坑得到扩建，引进了能真正增加铜矿开采量的工程师。"
 tada_mines_03: "多田铜山大矿井"
 tada_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现新的铜矿脉。"
 tada_mines_04: "多田铜山矿业综合体"
 tada_mines_04_desc: "铜矿的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 building_type_tsushima_mines_01: "$tsushima_mines_02$" #対馬銀山
 building_type_tsushima_mines_01_desc: "$tsushima_mines_01_desc$"
 tsushima_mines_01: "对马银山矿坑"
 tsushima_mines_01_desc: "对马岛以银矿闻名，这些银矿发现于七世纪末天武天皇时期。日本海沿岸的黑色矿石富含方铅矿，出产巨额财富。"
 tsushima_mines_02: "对马银山矿井"
 tsushima_mines_02_desc: "矿坑得到扩建，引进了能真正增加银矿开采量的工程师。"
 tsushima_mines_03: "对马银山大矿井"
 tsushima_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现新的银矿脉。"
 tsushima_mines_04: "对马银山矿业综合体"
 tsushima_mines_04_desc: "银矿的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 building_type_koganeyama_mines_01: "$koganeyama_mines_02$"
 building_type_koganeyama_mines_01_desc: "$koganeyama_mines_01_desc$"
 koganeyama_mines_01: "金华山矿坑"
 koganeyama_mines_01_desc: "金华山及其附属的金山神社因日本最早发现的金砂矿床而闻名，该神社由圣武天皇于八世纪敕建，供奉矿业之神#EMP 金山神#!。"
 koganeyama_mines_02: "金华山矿井"
 koganeyama_mines_02_desc: "矿坑得到扩建，引进了能真正增加黄金开采量的工程师。"
 koganeyama_mines_03: "金华山大矿井"
 koganeyama_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现新的黄金矿脉。"
 koganeyama_mines_04: "金华山矿业综合体"
 koganeyama_mines_04_desc: "黄金的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 building_type_mount_baekdu_01: "白头山"
 building_type_mount_baekdu_01_desc: "据说白头山的巍峨山峰是高丽半岛所有山脉的起源，其峰顶是该地区众多信仰和族群的圣地。"
