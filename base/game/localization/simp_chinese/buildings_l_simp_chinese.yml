 building_type_ratnapura_mines_01: "剌那补罗宝石矿"
 building_type_ratnapura_mines_01_desc: "“珍宝之城”剌那补罗是世界上最重要的红宝石和蓝宝石来源地之一。数百年来，这些财宝一直被开采，并用来和印度次大陆、东南亚和中国的商人进行交易。"
