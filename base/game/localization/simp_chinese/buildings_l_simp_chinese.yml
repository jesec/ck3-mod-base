 ratnapura_mines_03: "剌那补罗大矿井"
 ratnapura_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现大型宝石。"
 ratnapura_mines_04: "剌那补罗矿业综合体"
 ratnapura_mines_04_desc: "宝石的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 building_type_mogok_mines_01: "抹谷宝石矿"
 building_type_mogok_mines_01_desc: "抹谷以出产红宝石与蓝宝石闻名，亦伴生尖晶石、石榴石等次等矿石。\n作为“红宝石之谷”，此地宝石不仅储量丰富，更以无与伦比的品质著称——深红色原石出土时，在烈日映照下焕发他处难觅的璀璨光芒。"
