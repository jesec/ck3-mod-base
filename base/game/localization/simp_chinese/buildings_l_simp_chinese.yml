 ijil_mines_03_desc: "随着开采规模越来越大，更多的矿脉入口被我们打通，我们更在矿洞中建立起大型竖井，让工人们得以开采出更多矿盐。"
 ijil_mines_04: "伊吉勒矿业综合体"
 ijil_mines_04_desc: "随着盐产量的增加，这里吸引来了世界各地的商人和工匠。"
 building_type_turda_mines_01: "托尔道盐矿"
 building_type_turda_mines_01_desc: "托尔道的巨大盐山成为特兰西瓦尼亚的经济中心已有好几个世纪。矿场和盐市仍然是该地区一个重要的收入来源。"
 turda_mines_01: "托尔道矿坑"
 turda_mines_01_desc: "$building_type_turda_mines_01_desc$"
 turda_mines_02: "托尔道矿井"
 turda_mines_02_desc: "随着采矿点的扩大，越来越多的矿盐被开采出来。合格的工程师大量涌入，使得建设一个真正意义上的矿场得以实现。"
 turda_mines_03: "托尔道大矿井"
 turda_mines_03_desc: "随着开采规模越来越大，更多的矿脉入口被我们打通，我们更在矿洞中建立起大型竖井，让工人们得以开采出更多矿盐。"
 turda_mines_04: "托尔道矿业综合体"
 turda_mines_04_desc: "随着盐产量的增加，这里吸引来了世界各地的商人和工匠。"
 building_type_wieliczka_mines_01: "维利奇卡盐矿"
 building_type_wieliczka_mines_01_desc: "该地区巨大的盐矿储量有潜力供应整个区域。采盐将使该地世代富裕。"
 wieliczka_mines_01: "维利奇卡采矿点"
 wieliczka_mines_01_desc: "$building_type_wieliczka_mines_01_desc$"
 wieliczka_mines_02: "维利奇卡矿井"
 wieliczka_mines_02_desc: "$turda_mines_02_desc$"
 wieliczka_mines_03: "维利奇卡大矿井"
 wieliczka_mines_03_desc: "$turda_mines_03_desc$"
 wieliczka_mines_04: "维利奇卡矿业综合体"
 wieliczka_mines_04_desc: "$turda_mines_04_desc$"
 #Ziliujing and Gongjing
 building_type_zigong_mines_01: "自流井与贡井"
 building_type_zigong_mines_01_desc: "由于具备独特的采盐优势，此地自商代起便从地底深处汲取盐分，延续数千年。如今与可预见的未来，它仍是影响区域经济的重大因素。"
 zigong_mines_01: "自流井与贡井采矿点"
 zigong_mines_01_desc: "$building_type_zigong_mines_01_desc$"
 zigong_mines_02: "自流井与贡井矿井"
 zigong_mines_02_desc: "$turda_mines_02_desc$"
 zigong_mines_03: "自流井与贡井大矿井"
 zigong_mines_03_desc: "$turda_mines_03_desc$"
 zigong_mines_04: "自流井与贡井矿业综合体"
 zigong_mines_04_desc: "$turda_mines_04_desc$"
 building_type_allaq_mines_01: "阿拉吉干河金矿"
 building_type_allaq_mines_01_desc: "埃及东部沙漠的山区中蕴藏着深厚的金矿床，被编年史家简称为采矿之国。该地区的中枢便是阿拉吉干河及其矿场。"
 allaq_mines_01: "阿拉吉干河采矿点"
 allaq_mines_01_desc: "$building_type_allaq_mines_01_desc$"
 allaq_mines_02: "阿拉吉干河矿井"
 allaq_mines_02_desc: "$rammelsberg_mines_02_desc$"
 allaq_mines_03: "阿拉吉干河大矿井"
 allaq_mines_03_desc: "$rammelsberg_mines_03_desc$"
 allaq_mines_04: "阿拉吉干河矿业综合体"
 allaq_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_takkeda_mines_01: "塔凯达铜矿"
 building_type_takkeda_mines_01_desc: "阿伊尔高原拥有丰富的铜矿床，从史前时代开始便已在塔凯达进行了开采。"
 takkeda_mines_01: "塔凯达采矿点"
 takkeda_mines_01_desc: "$building_type_takkeda_mines_01_desc$"
 takkeda_mines_02: "塔凯达矿井"
 takkeda_mines_02_desc: "$rammelsberg_mines_02_desc$"
 takkeda_mines_03: "塔凯达大矿井"
 takkeda_mines_03_desc: "$rammelsberg_mines_03_desc$"
 takkeda_mines_04: "塔凯达矿业综合体"
 takkeda_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_kollur_mines_01: "拘露卢钻石矿"
 building_type_kollur_mines_01_desc: "拘露卢钻石矿发掘出的钻石有着全印度次大陆最大的开采量。在此劳作极为危险，但带来的财富也是难以想象的。"
 kollur_mines_01: "拘露卢矿坑"
 kollur_mines_01_desc: "仅是黏土和沙砾的坑洞，身缠腰布的工人在此日夜辛劳以开采钻石。"
 kollur_mines_02: "拘露卢矿井"
 kollur_mines_02_desc: "矿坑得到扩建，引进了能真正增加钻石开采量的工程师。"
 kollur_mines_03: "拘露卢大矿井"
 kollur_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现大型钻石。"
 kollur_mines_04: "拘露卢矿业综合体"
 kollur_mines_04_desc: "钻石的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 building_type_tribe_01: "部落建筑"
 building_type_tribe_01_desc: "一个简单但是有效的部落建筑，为部落村庄起到防御作用。"
 tribe_01: "$building_type_tribe_01$"
 tribe_01_desc: "用圆木和粗糙切割的石头建成，这座建筑气势宏伟，尽管体型较小。"
 tribe_02: "$building_type_tribe_01$ II"
 tribe_02_desc: "加固建筑从封建城堡中吸取灵感，增添了许多新的防卫要素。"
 building_type_longhouses_01: "集会厅"
 building_type_longhouses_01_desc: "部落首领、长老、将军聚拢在长屋中商议决策。这伟大的殿宇与其中聚集的贵人们交相辉映。"
 building_longhouses_01: "长屋"
 building_longhouses_01_desc: "长屋的大小足以容纳长老间召开的重要会议，法律和政策在此被敲定。"
 building_longhouses_02: "大会堂"
 building_longhouses_02_desc: "大会堂中有一个中央高台，在那里酋长或者将军可以发表激动人心的演讲。"
 building_type_war_camps_01: "战地军营"
 building_type_war_camps_01_desc: "当战争的号角响起，勇猛的部落勇士聚集在战地军营。即使在和平时期，他们也会在此比武，为不可避免的冲突做准备。"
 war_camps_01: "比武场"
 building_war_camps_01_desc: "训练设施、竞技场和木墙组成了比武场。勇士们在这里训练他们的技艺。"
 building_war_camps_02: "战士公会"
 building_war_camps_02_desc: "只有最伟大的战士才能进入战士公会，他们仅需现身就能激励人心。"
 building_type_palisades_01: "栅栏"
 building_type_palisades_01_desc: "层层木质栅栏保护着零散的部落定居点，保护他们免受常见的威胁，如野生动物或小规模劫掠。"
 building_palisades_01: "简易栅栏"
 building_palisades_01_desc: "简易栅栏提供了有限的防护，在对抗小型冲突时有效，然而在对抗大股敌人时就显得有点力不从心了。"
 building_palisades_02: "城墙与壕沟"
 building_palisades_02_desc: "外部壕沟和用石头加强的栅栏提供了被围攻时的有效防护。"
 building_type_market_villages_01: "集市"
 building_type_market_villages_01_desc: "一系列集镇在这片土地上的旅人来往的地区相继建立。在这里，部落民可以与旅行商人们商贸往来。"
 building_market_villages_01: "贸易前哨"
 building_market_villages_01_desc: "贸易前哨为部落和商人提供交流和易货的机会。"
 building_market_villages_02: "集镇"
 building_market_villages_02_desc: "这些村庄会在规定的时间开展公共集市活动，吸引整个地区的商人并增加当地的财富。"
 building_type_water_temples_01: "苏巴克水庙"
 building_type_water_temples_01_desc: "以水神祠和寺庙为基础的内陆友好型灌溉系统；仪式化的历法指导种植休耕和运河维护周期。"
 water_temples: "$building_type_water_temples_01$"
 building_type_water_temples_1: "$water_temples$"
 building_type_water_temples_1_desc: "$building_type_water_temples_01_desc$"
 water_temples_1: "$water_temples$"
 water_temples_2: "$water_temples$ II"
 water_temples_3: "$water_temples$ III"
 water_temples_4: "$water_temples$ IV"
 water_temples_5: "$water_temples$ V"
 building_water_temples_01: "苏巴克堰与田间神祠"
 building_water_temples_01_desc: "小型堰和土渠连接稻田；一座神祠监督供品和工作轮值。稳定的盈余开始流动，仪式也是如此。"
 building_water_temples_02: "苏巴克神祠议会"
 building_water_temples_02_desc: "多座神祠通过历法化的分水协调更广泛的“苏巴克”；纠纷与修缮由集体处理，提升管控与产量。"
 building_water_temples_03: "水庙网"
 building_water_temples_03_desc: "适当的水庙巡回监督同步种植与休耕周期；虫害减少，产量增加，宗教虔敬增长。"
 building_water_temples_04: "大水庙景观"
 building_water_temples_04_desc: "整个灌溉系统由寺庙领导的集会组织；梯田、水闸与庆典使该省份成为一个虔诚的粮仓。"
 building_type_stilted_granaries_01: "干栏式粮仓"
 building_type_stilted_granaries_01_desc: "防鼠的立柱支撑谷仓，由四根或更多木桩架高，非常适合储存贡品和供应行伍。"
 building_stilted_granaries_01: "立柱粮仓"
 building_stilted_granaries_01_desc: "简易的四柱谷仓可以保持种子和贡品干燥；村庄守卫在出征时吃得更好。"
 building_stilted_granaries_02: "粮仓排"
 building_stilted_granaries_02_desc: "一整排带有防鼠装置和垂带踏跺的干栏式谷仓。粮食贡赋更加稳定，征粮效率提高。"
 building_stilted_granaries_03: "仓刻铭干栏式粮仓"
 building_stilted_granaries_03_desc: "仓刻铭标识盈余；仓监轮换存储和口粮配给，以支持更长的行军。"
 building_stilted_granaries_04: "粮仓监区"
 building_stilted_granaries_04_desc: "用围栏围起的建筑群，设有看守和理货棚，粮食安全稳定整个伯爵领。"
 building_type_kora_kora_yards_01: "科拉科拉船船坞"
 building_type_kora_kora_yards_01_desc: "氏族独木舟棚屋及舷外支架武装独木舟的滑道。"
 kora_kora_yards: "$building_type_kora_kora_yards_01$"
 building_type_kora_kora_yards_1: "$kora_kora_yards$"
 building_type_kora_kora_yards_1_desc: "$building_type_kora_kora_yards_01_desc$"
 kora_kora_yards_1: "$kora_kora_yards$"
 kora_kora_yards_2: "$kora_kora_yards$ II"
 kora_kora_yards_3: "$kora_kora_yards$ III"
 kora_kora_yards_4: "$kora_kora_yards$ IV"
 kora_kora_yards_5: "$kora_kora_yards$ V"
 building_kora_kora_yards_01: "独木舟棚屋"
 building_kora_kora_yards_01_desc: "设有顶棚的舷外支架划艇滑道；水手们为海岸袭击和岛间航行进行训练。"
 building_kora_kora_yards_02: "氏族船厂"
 building_kora_kora_yards_02_desc: "木材、纤维捆扎材料和备用舷外支架的储备加快了维修速度；劫掠者带回战利品和交易品。"
 building_kora_kora_yards_03: "科拉科拉船船坞"
 building_kora_kora_yards_03_desc: "更大的船体、战斗平台和信号鼓；海岸巡逻和季节性远征成为生活的节律（以及收入来源）。"
 building_kora_kora_yards_04: "武装独木舟大军械库"
 building_kora_kora_yards_04_desc: "船坞大师为整个舰队配备装备；下水坡道、索具阁和集结平台令邻居畏惧。"
 building_type_idjang_forts_01: "伊姜堡垒"
 building_type_idjang_forts_01_desc: "阶梯式部落堡垒，位于山嘴或小山丘上的据点。"
 idjang_forts: "$building_type_idjang_forts_01$"
 building_type_idjang_forts_1: "$idjang_forts$"
 building_type_idjang_forts_1_desc: "$building_type_idjang_forts_01_desc$"
 idjang_forts_1: "$idjang_forts$"
 idjang_forts_2: "$idjang_forts$ II"
 idjang_forts_3: "$idjang_forts$ III"
 idjang_forts_4: "$idjang_forts$ IV"
 idjang_forts_5: "$idjang_forts$ V"
 building_idjang_forts_01: "栅栏伊姜"
 building_idjang_forts_01_desc: "木栅栏立于可防御的高地，警戒火堆和干壕沟阻止了劫掠者。"
 building_idjang_forts_02: "石墙伊姜"
 building_idjang_forts_02_desc: "关键墙面以碎石护墙替代了木材；有盖通道让防御者可以安全穿梭。"
 building_idjang_forts_03: "阶梯伊姜"
 building_idjang_forts_03_desc: "阶梯式通道、突击楼梯和射击平台为箭矢和长矛创造了致命角度。"
 building_idjang_forts_04: "堡垒伊姜"
 building_idjang_forts_04_desc: "门楼、内堡和蓄水池；守军可坚守数季。"
 building_type_wantilan_01: "万蒂兰"
 building_type_wantilan_01_desc: "开放式的无墙大厅与社区亭阁，用于集会、仪式与演出。"
 building_wantilan_01: "小型万蒂兰"
 building_wantilan_01_desc: "村中会堂用于集会、宣誓与演练；长老在纷争爆发前就进行仲裁。"
 building_wantilan_02: "万蒂兰亭阁"
 building_wantilan_02_desc: "宽阔的层顶大厅举办节日庆典与成人仪式，共享仪式可以提升士气与威望。"
 building_wantilan_03: "神庙万蒂兰"
 building_wantilan_03_desc: "与当地圣所相连的仪式场地，提供充足空间进行供奉与游行。"
 building_wantilan_04: "大万蒂兰"
 building_wantilan_04_desc: "一个地标性竞技场，鼓手、舞者与首领共处一室。"
 building_type_military_academy_01: "军校"
 building_type_military_academy_01_desc: "专门用来训练军官和骑士的设施，以提高他们在战斗中的效率。"
 military_academy_01: "$building_type_military_academy_01$"
 building_military_academy_01_desc: "有志成为军官者给予他们在军事学校的表现接受彻底调查。很自然的是，这所学校只接受贵族家世的学生。"
 military_academy_02: "$building_type_military_academy_01$ II"
 building_military_academy_02_desc: "中高级军官在这里接受训练，在这里他们可以更好地了解部队调动、野外准备和战场条件。"
 military_academy_03: "$building_type_military_academy_01$ III"
 building_military_academy_03_desc: "大军事学院是先进军事机构的心脏。在这里训练的军官学习所有的战场战略、军队组织和最新的战争技术知识。"
 military_academy_04: "$building_type_military_academy_01$ IV"
 military_academy_05: "$building_type_military_academy_01$ V"
 building_type_march_01: "边区"
 building_type_march_01_desc: "边区领主用防御工事和当地守军保卫边境。"
 marches_effect_desc: "降低特定[raid_intents|E]的成功率"
 marches_effect_2_desc: "阻止特定的[raid_intents|E]"
 march_01: "$building_type_march_01$"
 building_march_01_desc: "边区在此公国最脆弱和偏远的地区组建，保护其免受袭击。尽管边区只是零星分布，但却是有用的预警系统，且不时也会抓住几个走私者。"
 march_02: "$building_type_march_01$ II"
 building_march_02_desc: "边区领主制度扩展到整个边境，为我们提供了一道坚固的防御线。"
 march_03: "$building_type_march_01$ III"
 building_march_03_desc: "大规模的边区防御工事在整个公国设立，大大阻滞任何进犯敌军。"
 march_04: "$building_type_march_01$ IV"
 march_05: "$building_type_march_01$ V"
 building_type_siege_works_01: "攻城器械所"
 building_type_siege_works_01_desc: "专用的攻城器械所让统治者可以使用并维护高质量的攻城武器。"
 siege_works_01: "$building_type_siege_works_01$"
 building_siege_works_01_desc: "攻城工坊通过专门和标准化的建造程序提供更快、更稳定的攻城武器。"
 siege_works_02: "$building_type_siege_works_01$ II"
 building_siege_works_02_desc: "在攻城战中使用最先进的武器——投石机，这需要专业的工程师来操作。"
 siege_works_03: "$building_type_siege_works_01$ III"
 building_siege_works_03_desc: "大炮是战场上最新出现的武器。它们声音大、非常重、难以操纵，但对石制防御工事具有致命的杀伤力。具备制造和使用大炮的能力，使我们在与敌人对抗时具备无可争议的优势。"
 siege_works_04: "$building_type_siege_works_01$ IV"
 siege_works_05: "$building_type_siege_works_01$ V"
 building_type_royal_armory_01: "君主军械库"
 building_type_royal_armory_01_desc: "由君主资助的军械库将会为军队提供稳定的武器供应和维护。"
 royal_armory_01: "$building_type_royal_armory_01$"
 building_royal_armory_01_desc: "战争时期，农民征召兵从兵站中分配到武器。这些武器大多是生锈的旧斧头、断掉的长枪和钝刀，但只要稍加保养，它们就能比士兵们通常使用的普通农具更高效。"
 royal_armory_02: "$building_type_royal_armory_01$ II"
 building_royal_armory_02_desc: "由王权运作的军械库收集和保养武器与盔甲以供战时使用。这些东西都有不错的质量，可以瞬间让任何醉醺醺的懒汉在外观上变成一名合格的士兵，虽然作风不一定跟得上。"
 royal_armory_03: "$building_type_royal_armory_01$ III"
 building_royal_armory_03_desc: "一个王家军械库收纳并维护着大量的武器，足以在短时间内组建数量惊人的农民征召军团，并吸引国内最优秀的雇佣兵。"
 royal_armory_04: "$building_type_royal_armory_01$ IV"
 royal_armory_05: "$building_type_royal_armory_01$ V"
 building_type_jousting_lists_01: "比武场"
 building_type_jousting_lists_01_desc: "有了专门的场地给骑士比武，更多骑兵和骑士就会受到激励去努力训练并加入我们麾下。"
 jousting_lists_01: "$building_type_jousting_lists_01$"
 building_jousting_lists_01_desc: "常年开放的空地，帮助训练骑兵和骑士。"
 jousting_lists_02: "$building_type_jousting_lists_01$ II"
 building_jousting_lists_02_desc: "有了骑士比武竞技场和向公众开放的看台，这些比武大会场地能吸引大量参赛者。"
 jousting_lists_03: "$building_type_jousting_lists_01$ III"
 building_jousting_lists_03_desc: "升级加入了王家贵客的座位和更大的露天场地，这个比武大会竞技场确实令人惊叹。"
 jousting_lists_04: "$building_type_jousting_lists_01$ IV"
 jousting_lists_05: "$building_type_jousting_lists_01$ V"
 building_type_blacksmiths_01: "铁匠"
 building_type_blacksmiths_01_desc: "君主雇佣的铁匠为禁卫打造武器盔甲，确保优质军备的稳定供应。"
 blacksmiths_01: "$building_type_blacksmiths_01$"
 building_blacksmiths_01_desc: "技术最好生产力最强的铁匠由君主雇佣，专门为禁卫生产长剑、锁子甲和长矛。"
 blacksmiths_02: "$building_type_blacksmiths_01$ II"
 building_blacksmiths_02_desc: "与各种行会合作，大批装备就可以在有订单时便宜地制造出来。"
 blacksmiths_03: "$building_type_blacksmiths_01$ III"
 building_blacksmiths_03_desc: "大型锻造厂专为向君权提供武器而建；只有最好的铁匠能被雇佣在里面工作。"
 blacksmiths_04: "$building_type_blacksmiths_01$ IV"
 blacksmiths_05: "$building_type_blacksmiths_01$ V"
 building_type_archery_ranges_01: "靶场"
 building_type_archery_ranges_01_desc: "专门的靶场让普通人也能用弓箭训练，也让有经验的弓箭手能磨练技艺。"
 archery_ranges_01: "$building_type_archery_ranges_01$"
 building_archery_ranges_01_desc: "靶场欢迎所有人，不论你是富是穷。原因有两重：农民可以射箭，这样在战争中就更有用处；而有经验的神射手保持状态去在竞技中争夺名次。"
 archery_ranges_02: "$building_type_archery_ranges_01$ II"
 building_archery_ranges_02_desc: "君权雇佣最好的制弓师，目标是制作最佳质量的弓，他们在专门为这个任务而建的设施中工作。"
 archery_ranges_03: "$building_type_archery_ranges_01$ III"
 building_archery_ranges_03_desc: "为了激励农民并为我们的神射手提供足够的挑战，这些特别的靶场设计用来训练我们弓箭手的长距离射击。"
 archery_ranges_04: "$building_type_archery_ranges_01$ IV"
 archery_ranges_05: "$building_type_archery_ranges_01$ V"
 building_type_leisure_palace_01: "行宫"
 building_type_leisure_palace_01_desc: "停留在一处奢侈华美的城堡是挺不错的，但有多几处可以选绝不会有害处。"
 leisure_palace_01: "$building_type_leisure_palace_01$"
 building_leisure_palace_01_desc: "当责任的重担太难背负（或愤怒的农民在冲击城门）的时候，没什么地方比得上田园郊外别墅的一场即兴放松！"
 leisure_palace_02: "$building_type_leisure_palace_01$ II"
 building_leisure_palace_02_desc: "夏宫位于公国内一处风景优美的地方，远离我们辛劳臣民的卑贱生活。真的没有更好展示王家权势和威望的方法了，我们就是比其他所有人#emphasis 更优越#!。"
 leisure_palace_03: "$building_type_leisure_palace_01$ III"
 building_leisure_palace_03_desc: "冬宫的用途是为王室提供一年中较严酷月份里的住处。食品储藏室中物品丰富，地理位置易守难攻，冷得发抖的臣民有幸在高耸冬宫的俯视下在附近劳作。"
 leisure_palace_04: "$building_type_leisure_palace_01$ IV"
 leisure_palace_05: "$building_type_leisure_palace_01$ V"
 chateau_01: "城堡"
 chateau_02: "$chateau_01$ II"
 chateau_03: "$chateau_01$ III"
 chateau_04: "$chateau_01$ IV"
 chateau_05: "$chateau_01$ V"
 building_type_royal_forest_01: "王室森林"
 building_type_royal_forest_01_desc: "王室保留地是财富的重要来源，让你能够无视省份中的当地法律，剥夺当地人的权利，然后再把权利卖回去。无须多言，狩猎也很赞。"
 royal_forest_01: "$building_type_royal_forest_01$"
 building_royal_forest_01_desc: "这个公国内的大片森林保留给王室使用。农民禁止住在森林内、狩猎森林的任何动物或清理树木务农。攻击路过的君权的课税查定人也是尤其受到禁止的。"
 royal_forest_02: "$building_type_royal_forest_01$ II"
 building_royal_forest_02_desc: "整座城镇都被这片王室保留地吞并，附近的居民点时常发现他们的居所在王室官吏的地图上，赫然被列进当地的王室保留地中。"
 royal_forest_03: "$building_type_royal_forest_01$ III"
 building_royal_forest_03_desc: "法律只有通过制度的保障才能生效，现在这片王室保留地拥有了一整套包括法院、看守和书记的制度，在训练有素的治安法官的支持下，他们随时准备着执行王室的法令。"
 royal_forest_04: "$building_type_royal_forest_01$ IV"
 royal_forest_05: "$building_type_royal_forest_01$ V"
 building_type_royal_garden_01: "御花园"
 building_type_royal_garden_01_desc: "一座美丽的花园很适合人们放松和社交。虽然小型的私人花园就能满足大部分人的需求，但富裕而有权势的人需要最壮观的作品才能满足！"
 royal_garden_01: "$building_type_royal_garden_01$"
 building_royal_garden_01_desc: "石墙封闭着的小花园，将繁忙的俗世关闭在外，提供了一处安宁舒适的避风港。"
 royal_garden_02: "$building_type_royal_garden_01$ II"
 building_royal_garden_02_desc: "昂贵而壮丽的花园，花草果树等等争奇斗艳。这座花园时常受到一大批园丁的照料。"
 royal_garden_03: "$building_type_royal_garden_01$ III"
 building_royal_garden_03_desc: "御苑是一座庞大而震撼的园林景观，精心嵌入了周边的地形和建筑之中。御苑向所有人开放，令远方的来客震撼不已。"
 royal_garden_04: "$building_type_royal_garden_01$ IV"
 royal_garden_05: "$building_type_royal_garden_01$ V"
 building_type_ananda_temple_01: "阿难陀寺"
 building_type_ananda_temple_01_desc: "虽然蒲甘有数千座佛塔、寺庙和佛龛，它们星罗棋布于整座城市和周围的平原，但是阿难陀寺绝对是其中的冠冕。完美布局的建筑结构内有着许多独特的石匾和石像。这里既是礼佛之处，也是以宗教精神教化人民的学术中心。"
 ananda_temple_01: "$building_type_ananda_temple_01$"
 ananda_temple_01_desc: "$building_type_ananda_temple_01_desc$"
 building_type_hotin_fort_01: "霍京工事"
 building_type_hotin_fort_01_desc: "霍京堡垒是修建于德涅斯特河畔的一座小堡垒。其所处的位置能保护当地贸易路线并控制河道。"
 hotin_fort_01: "霍京堡垒"
 hotin_fort_01_desc: "$building_type_hotin_fort_01_desc$"
 hotin_fort_02: "霍京要塞"
 hotin_fort_02_desc: "一座威严的要塞，让旧日的堡垒相形见绌。这座工事经过数世纪的扩建，有了高耸的石墙、宽广的护城河以及数幢厚重的塔楼。这座防御建筑定能轻易将大部分攻势化为无形。"
 building_type_golden_gate_of_kiev_01: "基辅金门"
 building_type_golden_gate_of_kiev_01_desc: "基辅金门的造型和名称都来自君士坦丁堡的一座城门，既是城门也是凯旋拱门。远处就能看见教堂的金圆顶建在门上，是基辅的重要象征。"
 golden_gate_of_kiev_01: "$building_type_golden_gate_of_kiev_01$"
 golden_gate_of_kiev_01_desc: "$building_type_golden_gate_of_kiev_01_desc$"
 building_type_heddal_stave_church_01: "海达尔木板教堂"
 building_type_heddal_stave_church_01_desc: "海达尔木板教堂是挪威最大的木结构教堂，拥有非常漂亮的木质内饰。传说教堂由一只山巨魔在仅仅三天内建造完工。"
 heddal_stave_church_01: "$building_type_heddal_stave_church_01$"
 heddal_stave_church_01_desc: "$building_type_heddal_stave_church_01_desc$"
 building_type_temple_of_uppsala_01: "乌普萨拉神庙"
 building_type_temple_of_uppsala_01_desc: "位于乌普萨拉的神庙是大部分斯堪的纳维亚的宗教中心。一株圣树在神庙边挺立，旁有一口水井，与传说中的世界树类似。"
 temple_of_uppsala_01: "$building_type_temple_of_uppsala_01$"
 temple_of_uppsala_01_desc: "$building_type_temple_of_uppsala_01_desc$"
 temple_of_uppsala_02: "乌普萨拉大教堂"
 temple_of_uppsala_02_desc: "高耸的乌普萨拉大教堂能媲美南欧最壮丽的建筑物，是瑞典最声名显赫君主的安葬之地，也安放着圣人们的遗骨。"
 building_type_lund_cathedral_01: "隆德大教堂"
 building_type_lund_cathedral_01_desc: "宏伟的隆德大教堂上有着丰富的石雕装饰。这座教堂修建时受到罗马式建筑的影响，与德意志的教堂有许多相似之处。这座建筑专献给圣老楞佐，隆德的主保圣人。"
 lund_cathedral_01: "$building_type_lund_cathedral_01$"
 lund_cathedral_01_desc: "$building_type_lund_cathedral_01_desc$"
 building_type_danevirke_01: "丹麦边墙"
 building_type_danevirke_01_desc: "丹麦边墙是一个范围广大的土垒工事，用以防范来自大陆针对丹麦领土的侵略，自最初建造之后已经过多次扩建。"
 danevirke_01: "$building_type_danevirke_01$"
 danevirke_01_desc: "$building_type_danevirke_01_desc$"
 building_type_aljaferia_palace_01: "阿尔哈费里亚"
 building_type_aljaferia_palace_01_desc: "阿尔哈费里亚是修建于萨里亚平原的一座大型宫殿堡垒，见证了萨拉戈萨的实力和财富。它气势磅礴，既是令人生畏的防御工事，也是伊比利亚建筑的巅峰。"
 aljaferia_palace_01: "$building_type_aljaferia_palace_01$"
 aljaferia_palace_01_desc: "$building_type_aljaferia_palace_01_desc$"
 building_type_roman_wall_of_lugo_01: "卢戈的罗马城墙"
 building_type_roman_wall_of_lugo_01_desc: "卢戈长城由罗马人在很久以前修建，至今仍是一道令人震撼的景观。朝圣者前往圣地亚哥‑德孔波斯特拉需要穿过城墙的五道大门，使得朝圣之旅的影响更加深远。"
 roman_wall_of_lugo_01: "$building_type_roman_wall_of_lugo_01$"
 roman_wall_of_lugo_01_desc: "$building_type_roman_wall_of_lugo_01_desc$"
 building_type_rock_of_gibraltar_01: "直布罗陀巨岩"
 building_type_rock_of_gibraltar_01_desc: "直布罗陀巨岩俯瞰着地中海的门户，那道狭窄的海峡。它是古代赫剌克勒斯之柱的一部分，被认为是已知世界的终点。现在看着它，你不禁会好奇巨岩之后的世界。"
 rock_of_gibraltar_01: "$building_type_rock_of_gibraltar_01$"
 rock_of_gibraltar_01_desc: "$building_type_rock_of_gibraltar_01_desc$"
 building_type_tower_of_hercules_01: "布里甘提乌姆灯塔"
 building_type_tower_of_hercules_01_desc: "这座古老的灯塔据说是仿照它更为出名的姊妹亚历山大灯塔而建造的。无数个世纪以来，它一直是航海者的向导，直到现在仍对加利西亚的沿海贸易意义重大。有人声称，你能从这座孤零零的灯塔上瞥见爱尔兰的绿色海岸，但放眼望去，你看到的只有无尽的大海。"
 tower_of_hercules_01: "$building_type_tower_of_hercules_01$"
 tower_of_hercules_01_desc: "$building_type_tower_of_hercules_01_desc$"
 building_type_city_wall_of_toledo_01: "托莱多城墙"
 building_type_city_wall_of_toledo_01_desc: "这些宏伟的城墙最初是由罗马人在古代建造的，后来在西哥特人之王瓦慕巴统治期间又进行了大规模扩建。早期的阿拉伯统治者又将之进一步扩宽，创建了一套与诸王之城相匹配的防御体系。"
 city_wall_of_toledo_01: "$building_type_city_wall_of_toledo_01$"
 city_wall_of_toledo_01_desc: "$building_type_city_wall_of_toledo_01_desc$"
 building_type_alcazar_of_segovia_01: "塞哥维亚城堡"
 building_type_alcazar_of_segovia_01_desc: "这座要塞像船首一样矗立于岩石峭壁之上，令人望而生畏。它雄伟且坚不可摧，是城堡王国卡斯蒂利亚众多城堡中最伟大的一座。"
 alcazar_of_segovia_01: "$building_type_alcazar_of_segovia_01$"
 alcazar_of_segovia_01_desc: "$building_type_alcazar_of_segovia_01_desc$"
 building_type_holy_site_basilica_santiago_01: "圣地亚哥‑德孔波斯特拉主教座堂"
 building_type_holy_site_basilica_santiago_01_desc: "这座宏伟的建筑修建于长雅各伯之墓上，是圣雅各伯之路的终点，也是基督教世界圣地中的一顶王冠。大量来自西欧和北欧的朝圣者来到这里，各说着十多种不同的语言——不过许多人也会因为震撼而说不出任何一句话来。"
 holy_site_basilica_santiago_01: "$building_type_holy_site_basilica_santiago_01$"
 holy_site_basilica_santiago_01_desc: "$building_type_holy_site_basilica_santiago_01_desc$"
 building_type_charnel_grounds_01: "停尸场"
 building_type_charnel_grounds_01_desc: "这些露天场地既是精神净化的场所，也是死者安息之处，也为尸体的腐烂分解提供了场地。"
 charnel_grounds_01: "$building_type_charnel_grounds_01$"
 building_charnel_grounds_01_desc: "被太阳晒白，被猛禽啄食，尸体在山顶腐化。"
 charnel_grounds_02: "$building_type_charnel_grounds_01$ II"
 building_charnel_grounds_02_desc: "这里一部分是宗教场所，一部分是墓园，腐烂的尸体被妥善保存，远离活人。"
 charnel_grounds_03: "$building_type_charnel_grounds_01$ III"
 building_charnel_grounds_03_desc: "到处都是尸体，香囊部分掩盖了小径上的气味，活着的人在那里准备向大自然献上新的祭品。"
 charnel_grounds_04: "$building_type_charnel_grounds_01$ IV"
 charnel_grounds_05: "$building_type_charnel_grounds_01$ V"
 building_type_imam_reza_shrine_01: "伊玛目里达圣陵"
 building_type_imam_reza_shrine_01_desc: "这座圣陵中安放着阿里·里达的遗体，有些什叶派信徒将其誉为第八任伊玛目，他就在这片土地上殉道。这片一直在扩建的建筑群包含了他的陵寝、礼拜堂、图书馆和集市，随着朝圣者和旅队的来往聚散，以一种既兼收并蓄而又大气堂皇的方式发展着。"
 imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$"
 imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$"
 building_type_soltaniyeh_01: "苏丹尼耶拱北"
 building_type_soltaniyeh_01_desc: "这座建筑既是殿宇也是陵墓，其宏伟的规模和精致的对称美必能激发出未来许多伟大作品的灵感。这座建筑巨大的双壳圆顶覆盖着绿松石，规模之大看着就像是对天堂的一种挑战。"
 soltaniyeh_01: "$building_type_soltaniyeh_01$"
 soltaniyeh_01_desc: "$building_type_soltaniyeh_01_desc$"
 building_type_palace_of_ctesiphon_01: "泰西封王宫遗迹"
 building_type_palace_of_ctesiphon_01_desc: "这座古老的建筑曾是萨珊王朝万王之王的礼仪行在，但一度辉煌的殿堂如今已被寂静所笼罩，花园里的花朵也不再盛开。许多建材被运去营建巴格达，人们四散奔逃。然而，一种诡异的壮丽尚存，古老的辉煌仍在。"
 palace_of_ctesiphon_01: "$building_type_palace_of_ctesiphon_01$"
 palace_of_ctesiphon_01_desc: "$building_type_palace_of_ctesiphon_01_desc$"
 building_type_palace_of_ctesiphon_02: "泰西封大王宫"
 building_type_palace_of_ctesiphon_02_desc: "如今经过重建，先王御座又恢复了昔日的荣光。花园中的花朵重新盛开，大厅再次充满了音乐和光彩。访客从四面八方纷至沓来，为了一睹露天御座厅的巨大拱门，这是一个古代世界中长期被遗忘的奇迹，现在终于在歌曲中找到了自己的位置。"
 palace_of_ctesiphon_02: "$building_type_palace_of_ctesiphon_02$"
 palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$"
 building_type_falak_ol_aflak_citadel_01: "诸天之天城堡"
 building_type_falak_ol_aflak_citadel_01_desc: "这座萨珊王朝时期的泥砖要塞坐落于霍拉马巴德城中一座山顶上，仍是一道令人难忘的风景。附近河谷中的居民称之为#italic “法拉克阿夫拉克”#!，义即“诸天之天”，因为在他们看来这座城堡似乎安坐于世界之巅，并且他们也常在其坚墙之内寻得庇护。"
 falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$"
 falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$"
 building_type_minarets_and_remains_of_jam_01: "贾姆宣礼塔"
 building_type_minarets_and_remains_of_jam_01_desc: "这座建筑耸立于哈里河谷之上，覆盖着灰泥和釉面砖装饰以及交替的书法条带，是一座精美的纪念碑，展现了信仰和财富即便是在这些偏远崎岖的土地上，也能取得怎样的成就。"
 minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$"
 minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$"
 building_type_great_wall_of_gorgan_01: "戈尔甘长城"
 building_type_great_wall_of_gorgan_01_desc: "戈尔甘长城是一套由古代诸王修建的庞大的防御系统，作为抵御嚈哒匈人的堡垒，充满了传奇色彩。据说亚历山大大帝本人曾在征服东方的行军途中通过了它的大门。"
 great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$"
 great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$"
 building_type_maharloo_lake_01: "马哈尔卢湖"
 building_type_maharloo_lake_01_desc: "尽管这片季节性湖泊有时仅仅是一处干燥的盐滩，但在仲夏时节，湖水会呈现出一抹精致的淡红色调。年轻的诗人聚于岸边，凝望奇异的水面，思索大地的美丽与神秘。"
 maharloo_lake_01: "$building_type_maharloo_lake_01$"
 maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$"
 building_type_tomb_of_cyrus_01: "拔示巴之墓"
 building_type_tomb_of_cyrus_01_desc: "这座古老的白色石灰岩坟墓据说是所罗门王的母亲拔示巴的安息之地，受到许多信仰的推崇。此地由女性照管，并且也只允许女性进入黑暗的墓穴内部。她们很少谈到在里面看到的东西。附近的水域据说受到了祝福，能治愈被疯狗咬伤的人。"
 tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$"
 tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$"
 building_type_rainbow_mountains_01: "彩虹山脉"
 building_type_rainbow_mountains_01_desc: "造物主似乎亲自用彩虹的颜色涂抹了这片山脊。红、白、黄、灰、橙以及更奇怪的色调给这片宁静的岩石景观增添了色彩。当地统治者经常会带客人到这里狩猎，一睹这壮丽的奇观。"
 rainbow_mountains_01: "$building_type_rainbow_mountains_01$"
 rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$"
 building_type_mount_damavand_01: "达马万德山"
 building_type_mount_damavand_01_desc: "达马万德山是一座白雪皑皑的大山，充满了古老的传说，据说是怪物暴君佐哈克的监狱，他将在此服刑直至世界末日。古时许多英雄都曾在这座山上立下丰功伟绩，而对于今天到此游览的人们来说，它的磅礴气势似乎触动到他们的灵魂。这是一座休眠火山，山坡上有星罗棋布的温泉，疲惫的旅人可停于此处放松身心，回想古人的行迹。"
 mount_damavand_01: "$building_type_mount_damavand_01$"
 mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$"
 building_type_holy_site_fire_temple_01: "大祆祠"
 building_type_holy_site_fire_temple_01_desc: "在这座宏伟建筑内燃烧着#italic “阿塔什‑巴赫拉姆”#!，即“胜利之火”，这是所有火焰中最伟大、最纯净的火，由闪电的雷火、王者的烛火、火葬的薪火、金匠的炉火和苦行者的灶火聚集而成。远方的朝圣者前来观赏这一奇观，而穆护举行的净化仪式似乎永无止境。"
 holy_site_fire_temple_01: "大祆祠"
 holy_site_fire_temple_01_desc: "$building_type_holy_site_fire_temple_01_desc$"
 building_type_ark_of_bukhara_01: "布哈拉城堡"
 building_type_ark_of_bukhara_01_desc: "据说，夏沃什王子在世界还年轻的时候建造了这座巨大的要塞。三千年后，这片地区的古代统治者布哈拉胡到诸王对其进行了修复，自那以后就一直在被使用。远近游客纷至沓来欣赏这座建筑，七根巨柱也与北斗七星遥相呼应，但它首先是一座防御工事，其恢弘壮丽令人望而生畏。"
 ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$"
 ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$"
 building_type_shah_i_zinda_01: "沙阿津达"
 building_type_shah_i_zinda_01_desc: "这片墓葬群的名字义为#italic “活着的国王”#!，指的是穆罕默德的堂弟库萨姆·伊本·阿拔斯，据说他就葬于此处。这些陵墓相当地渺小而简陋，但却蕴含着一种肃穆之美，让许多人流连于寂静的坟茔间，思索人生的短暂。"
 shah_i_zinda_01: "$building_type_shah_i_zinda_01$"
 shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$"
 shah_i_zinda_02: "沙阿津达墓地"
 shah_i_zinda_02_desc: "#italic “活着的国王”#!是一片由陵墓、高门和盖有绿松石瓦的圆顶通道所组成的巨大墓地，是先知的堂弟和其他许多古代大领主的埋身地。这片墓葬群在不断扩建，看着既崇高，又诡异，也同样令人印象深刻。"
 building_type_alamut_castle_01: "阿拉穆特城堡"
 building_type_alamut_castle_01_desc: "这座鹰巢坐落于一面巍峨的峭壁之上，由朱斯坦王朝修建，用作他们受围领地的要塞堡垒。它有着令人敬畏的环境和坚固的壁垒，人人都说它近乎是牢不可破的，对于任何能在这么一处偏僻位置发展壮大的好战派系或教派而言，它都是一个理想的据点。"
 alamut_castle_01: "$building_type_alamut_castle_01$"
 alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$"
 building_type_alamut_castle_02: "阿拉穆特要塞"
 building_type_alamut_castle_02_desc: "这座城堡坐落在一面巍峨的峭壁之上，长期以来一直被用作偏远的山中堡垒。现在，它已被重建成一座令人敬畏的#italic 菲达因#!要塞，在这雄伟壮观的防御工事中还设有图书馆、实验室和宁静的花园。对有的人来说，这里是流血与战争之所在；而对其他人而言，这里是精神的安歇地——又或许两者兼而有之。"
 alamut_castle_02: "$building_type_alamut_castle_02$"
 alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$"
 building_type_assassin_castle_01: "阿萨辛$castle_04$"
 building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
 assassin_castle_01: "$building_type_assassin_castle_01$"
 assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$"
 building_type_qanats_01: "$qanats_06$"
 building_type_qanats_01_desc: "$qanats_05_desc$"
 building_qanats_01: "冰窖"
 building_qanats_01_desc: "这些圆顶形状的冰窖将地下贮藏与耐热建材结合在一起，形成了一片隔热空间，起到了一种蒸发冷却器的功能。"
 building_qanats_02: "蓄水池"
 building_qanats_02_desc: "这些半埋于地下的拱形结构在波斯语中被称为#italic “阿卜安巴尔”#!，被用来储存大量的水。"
 building_qanats_03: "捕风塔"
 building_qanats_03_desc: "这些高塔是波斯人的发明，与蓄水池和其他建筑物相通。它们通过对着盛行风向的开口捕捉气流，然后让气流在塔内循环，以供冷却。"
 building_qanats_04: "坎儿孜"
 building_qanats_04_desc: "坎儿孜是地下井渠系统的第一阶段，是一系列竖井，由一条坡度平缓的隧道连通，这条隧道利用一处地下水源并将水输送到地表。"
 building_qanats_05: "小坎儿井"
 qanats_05_desc: "坎儿井是地下井渠，旨在减少蒸发造成的水量损失。这个系统虽然在现阶段规模还相当小，但仍能为农业提供大量效益。"
 qanats_06: "坎儿井"
 building_qanats_06_desc: "地下井渠已经扩建，连通了当地的蓄水池、冰窖和灌溉系统。"
 building_qanats_07: "大坎儿井"
 building_qanats_07_desc: "这个庞大的地下井渠系统绵延了好几#italic 程#!，为农民和乡亲给予了惊人的供水量。"
 building_qanats_08: "巨型坎儿井系统"
 building_qanats_08_desc: "这个令人惊叹的地下井渠系统流入了无数地下蓄水池、灌溉渠道、冰窖、澡堂、喷泉和饮用水井，是波斯人聪明才智和无上荣光的真实证明。"
 building_type_tower_of_silence_01: "大寂静之塔"
 building_type_tower_of_silence_01_desc: "死者被摆放在露天塔上供鸟啄食，以免土地或火焰被他们玷污。之后，遗骨被收拢起来，投入中央的坑中。"
 tower_of_silence_01: "大寂静之塔"
 tower_of_silence_01_desc: "这座平顶塔楼建在公爵领内一片安静的区域，那是当地人让死者安息的地方。里面的尸体暴露在食腐鸟和阳光的酷烈之下，将他们逝去的灵魂安稳地送往死后的世界，让活着的人不受腐败的影响。宗教禁令让这座塔成为必要，而非成为传统的荒野，但它的出现却让社群迅速成为一体。"
 tower_of_silence_01.tt.liege_not_approve_of_burial: "[liege_possessive|E]的[faith|E]允许你的人民在不需要$building_type_event_tower_of_silence_01$的情况下举行传统的葬礼"
 tower_of_silence_01.tt.county_not_tos_users: "[county|E]的[faith|E]不会像这样处理死者"
 building_type_event_tower_of_silence_01: "寂静之塔"
 building_type_event_tower_of_silence_01_desc: "$tower_of_silence_01_desc$"
 event_tower_of_silence_01: "寂静之塔"
 event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$"
 church_of_the_theotokos: "诞神女教堂"
 church_of_the_theotokos_desc: "圣十字早已征服了这座宏伟的建筑，彻底击败了对处女神雅典娜的异教崇拜。\n如今，这里供奉着童贞圣母玛利亚，也是唯一配得上#EMP 神圣#!之名的贞女。"
 building_type_church_of_the_theotokos: "$church_of_the_theotokos$"
 building_type_church_of_the_theotokos_desc: "$church_of_the_theotokos_desc$"
 parthenon: "帕特农神庙"
 parthenon_desc: "强大的雅典娜的圣殿再次骄傲地矗立着，不受愚蠢迷信的玷污。\n这些雄伟的立柱和墙壁建于一千多年前，经受住了时间的考验，仍然从上方保护着信徒的家园，无言地象征着处女神的赐福，她也将自己的名号赋予了这座城市。"
 building_type_parthenon: "$parthenon$"
 building_type_parthenon_desc: "$parthenon_desc$"
 hagios_demetrios: "圣迪弥特里教堂"
 hagios_demetrios_desc: "圣迪弥特里教堂是这座城市里最重要的圣所。\n这座教堂建立之初，基督信仰还仍属年轻，教堂吸纳了一座罗马浴场，而这位圣人连同其他许多早期信徒就关押、殉道并埋葬于其中。"
 building_type_hagios_demetrios: "$hagios_demetrios$"
 building_type_hagios_demetrios_desc: "$hagios_demetrios_desc$"
 kassiopi_castle: "卡西奥皮城堡"
 kassiopi_castle_desc: "一座宏伟的岸边防御工事，在其战略位置能监视这条将岛屿与大陆分隔开的海峡，使其成为伊奥尼亚地区一处至关重要的控制点。"
 building_type_kassiopi_castle: "$kassiopi_castle$"
 building_type_kassiopi_castle_desc: "$kassiopi_castle_desc$"
 saint_lazarus: "圣拉匝若教堂"
 saint_lazarus_desc: "按照传统，曾被基督从死里复活的伯达尼的拉匝若，在第二次去世后被安葬于拉纳卡城。\n这座坟墓曾失落了数个世纪，但就在寻回坟墓之后，皇帝利奥六世将圣人的圣髑敬迁至君士坦丁堡，并在坟址上兴建了这座宏伟的教堂。"
 building_type_saint_lazarus: "$saint_lazarus$"
 building_type_saint_lazarus_desc: "$saint_lazarus_desc$"
 building_type_sumela_monastery_01: "苏梅拉修道院"
 building_type_sumela_monastery_01_desc: "这座修道院建于黑色之山的悬崖峭壁之上，其起源之悠久，几乎被笼罩于迷雾之中；据有的人说，修道院是奉狄奥多西皇帝之令最初于四世纪建立，但其中的圣泉和古壁画可能更为古老。\n修道院所藏的至宝是一面圣母壁画，据说由使徒路喀亲手绘制。"
 sumela_monastery_01: "$building_type_sumela_monastery_01$"
 sumela_monastery_01_desc: "修道院曾沦为废墟，之后由数位皇帝修复扩建；当下的建筑格局主要由查士丁尼皇帝通过贝利萨留出面所奠定。"
 sumela_monastery_02: "翻修的$building_type_sumela_monastery_01$"
 sumela_monastery_02_desc: "距离这座修道院上一次翻修已有许多个世纪。最近一次官方介入赐予了修道院更多的世袭土地、属民、免税特权以及可以用来修造新建筑的皇家资助。岩间教堂从中受益最大，因为收获了一整套全新的壁画。"
 patras_castle: "帕特雷城堡"
 patras_castle_desc: "帕特雷市的古老卫城，矗立于沃贾斯山脉中一座山岭之上，于查士丁尼皇帝统治期间被替换为一座防御工事。\n这座城堡自那之后就一直被持续使用，永受本地主保圣人安德列及#EMP 地方守护神#!帕特里涅拉（一座罗马的少女雕像）的庇佑。"
 building_type_patras_castle: "$patras_castle$"
 building_type_patras_castle_desc: "$patras_castle_desc$"
 maiden_tower: "少女塔"
 maiden_tower_desc: "这块海岸前的礁石在雅典人亚西比德的时代就已经有了一座海关站矗立其上，这要归功于其位于博斯普鲁斯海峡入口的理想位置。\n现在，位于同一座小岛上的设防塔楼就能控制住所有往来黑海的海上交通；此外，还能在塔楼与君士坦丁堡之间的海平面上拉起一条巨大的锁链，有效拦截了任何危险的或不受欢迎的船只。"
 building_type_maiden_tower: "$maiden_tower$"
 building_type_maiden_tower_desc: "$maiden_tower_desc$"
 despot_palace: "专制君主宫殿"
 despot_palace_desc: "一座位于塔伊耶托斯山中一处安全位置的宏伟宫殿，处在坚城米斯特拉斯的正上方。\n这座宫殿所有的奢华能与君士坦丁堡殿堂的伟大相媲美，只有最富有和最具影响力的总督才能配得上。"
 building_type_despot_palace: "$despot_palace$"
 building_type_despot_palace_desc: "$despot_palace_desc$"
 building_type_meteora_01: "迈泰奥拉"
 building_type_meteora_01_desc: "迈泰奥拉一名是由当地人为品都斯山旁隆起的一片令人惊叹的天然石柱群而起的。"
 meteora_01: "$building_type_meteora_01$"
 meteora_01_desc: "自九世纪期早期以来，苦行隐修士们就一直栖居于迈泰奥拉天然的洞穴石窟中，但任何人力所造的建筑都没让此处的景观走样。"
 meteora_02: "$building_type_meteora_01$"
 meteora_02_desc: "随着越来越多的隐修士在迈泰奥拉挖空的山峰中寻求庇护，越来越多的修道院也随之开始出现。\n不过，人类对于此地险恶大自然的支配能力依旧脆弱；这些修道院都极其难进，一般都只能依赖梯子、绳索、徒手攀缘以及#EMP 祈祷#!，因为一旦装备失效，失足跌落的后果是致命的。"
 building_type_mount_athos_01: "阿索斯山"
 building_type_mount_athos_01_desc: "按照传统，童贞女玛利亚乘船从巴勒斯坦前往塞浦路斯，拜访她圣子的朋友拉匝若，他当时正在那岛上传播福音；那时船只被吹离了航道，被迫停泊于阿索斯山旁的此地。玛利亚下船后，被这片地域的自然之美所震撼，于是祝福了这里并请求此地作为她自己的花园。从天上传来一道声音满足了她的心愿；自那以后，此地就被视为圣地并禁止任何女性进入。"
 mount_athos_01: "$building_type_mount_athos_01$"
 mount_athos_01_desc: "至少从君士坦丁一世皇帝的时代以来，基督教社团就已居住在这片岬角，来自阿索斯山的修士参加过第七次尼西亚大公会议。不过，正规的修道团体或永久建筑还未存在。"
 mount_athos_02: "$building_type_mount_athos_01$"
 mount_athos_02_desc: "一位名叫阿塔纳西的修士来到阿索斯山，揭开了在半岛上各处兴建修道院的序幕：最早的两个修道院分别名为大拉伏拉和瓦托佩迪，均敬献给了圣母领报。有了像样的修道院，当地的修道生活便有了秩序和规则。"
 mount_athos_03: "$building_type_mount_athos_01$"
 mount_athos_03_desc: "基于世俗权力奉献的诸多特许、教会法上的自治地位、真正与世隔绝的生活方式以及繁盛的圣像产出，阿索斯山作为修道中心的盛名，确保了几个世纪以有来源源不断新加入的修士。\n随着僧修士数量的增长，修道院的数量也随之增加。阿索斯山上现有二十座修道院，是该地区最大、最具影响力的修道社区。"
 apollinare_nuovo: "新圣亚坡理纳圣殿"
 apollinare_nuovo_desc: "新圣亚坡理纳圣殿近来才获得现有的名字，当时圣亚坡理纳的圣髑才从邻近在克拉塞的圣殿迁入。不过该圣殿的历史远早于此。\n这座建筑在六世纪早期就已由东哥特人的国王狄奥多里克首次祝圣，成为一座亚略派的教堂，它在结构和装饰上历经了多次修缮翻新，但还保留着独特的风格——东西方艺术优雅地交融在一起——还有令人惊艳的拜占庭马赛克镶嵌画。"
 building_type_apollinare_nuovo: "$apollinare_nuovo$"
 building_type_apollinare_nuovo_desc: "$apollinare_nuovo_desc$"
 saint_catherine: "圣埃卡特里纳修道院"
 saint_catherine_desc: "一座位于沙漠中的朴实的修道院，但却有着一段厚重的历史。修道院最初的建筑结构事实上是奉君士坦丁皇帝之母的命令在燃烧的荆棘向摩伊息斯显现之地建立的。查士丁尼皇帝资助了扩建工程，把这里建成了如今这座筑有防御工事的修道院，并将摩伊息斯之泉也围在其中。在修道院奠基仅仅几个世纪之后，圣埃卡特里纳的圣髑就敬迁至此，这也改变了修道院的名称。\n这座修道院的缮写室和圣像制作中心一直都位于最古老、最多产者之列。"
 building_type_saint_catherine: "$saint_catherine$"
 building_type_saint_catherine_desc: "$saint_catherine_desc$"
 jvari_monastery: "十字圣架修道院"
 jvari_monastery_desc: "一座古老的修道院，矗立之地正是当年圣尼纳在格鲁吉亚传福音时树立起灵迹十字圣架之所在。\n这座神圣的建筑吸引来了整个高加索的朝圣者。"
 building_type_jvari_monastery: "$jvari_monastery$"
 building_type_jvari_monastery_desc: "$jvari_monastery_desc$"
 etchmiadzin_cathedral: "瓦加尔沙帕特主教座堂"
 etchmiadzin_cathedral_desc: "这座古老的主教座堂是亚美尼亚宗徒基督教历史上的中心。教堂最初由光照者圣额我略建立于一座原始宗教的神庙之上，象征着亚美尼亚王国新采用宗教的胜利，之后在萨珊王朝入侵期间教堂几乎被全毁，数年之后又从地基开始重建。\n但在七世纪后，这座主教座堂一再被洗劫和废弃，早已破败不堪。只有大刀阔斧、不惜代价地介入重建才能使其恢复往日的荣光。"
 building_type_etchmiadzin_cathedral: "$etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc: "$etchmiadzin_cathedral_desc$"
 cattolica_stilo: "斯蒂洛教堂"
 cattolica_stilo_desc: "这座建筑受到了强烈的拜占庭影响：一座附带洗礼堂的小教堂，建立在裸岩之上，用红砖修砌而成，建筑平面宛如一道“刻画的十字”，四面墙壁环绕着丰富的壁画作为装饰，俯瞰斯蒂拉罗河谷。\n这座教堂是险恶的自然环境中的一颗孤独的宝石，人们可以在这里感到离上帝更近了。"
 building_type_cattolica_stilo: "$cattolica_stilo$"
 building_type_cattolica_stilo_desc: "$cattolica_stilo_desc$"
 hosios_loukas: "成德者路喀修道院"
 hosios_loukas_desc: "这座修道院专用于安放斯提里翁山的成德者圣路喀之圣髑，他是一名隐修士。\n圣髑据说会渗出灵迹之油，吸引了无数朝圣者来睡在墓边，以求通过“睡庙”来获得治愈。修道院高质且奢华的内部装饰在整个东地中海都广受赞扬，那个时代最杰出的艺术家为其丰富了马赛克画、圣像、烛台、雕刻和织物的装饰。"
 building_type_hosios_loukas: "$hosios_loukas$"
 building_type_hosios_loukas_desc: "$hosios_loukas_desc$"
 sofia_ohrid: "圣索菲亚教堂"
 sofia_ohrid_desc: "奥赫里德的主教座堂在斯拉夫人初次袭击这片土地时也首度被毁，直到此地平安重返基督信仰的会众中时才得以重建。\n教堂最后的格局是一座穹顶式巴西利卡，富丽堂皇地装饰着那个时代最杰出的艺术家为其创作的壁画群。"
 building_type_sofia_ohrid: "$sofia_ohrid$"
 building_type_sofia_ohrid_desc: "$sofia_ohrid_desc$"
 fairy_chimneys: "穴居聚落"
 fairy_chimneys_desc: "该地区的岩石具有极强的可塑性，自然形成了石锥、石峰和石窟。\n几个世纪以来，人类一直在利用这些结构，建造马厩、仓库和避难所，然后是房屋和生产建筑，最后在岩锥内修建教堂，整个聚落就此形成。"
 building_type_fairy_chimneys: "$fairy_chimneys$"
 building_type_fairy_chimneys_desc: "$fairy_chimneys_desc$"
 cilician_gates: "奇里乞亚门"
 cilician_gates_desc: "奇里乞亚门是一处穿过托罗斯山脉的山口，连接了奇里乞亚平原和安纳托利亚高原。\n自洪荒伊始，山口就已建有防御工事，控制住它，便意味着控制住了一条小亚细亚和中东的商业与军事主动脉。"
 building_type_cilician_gates: "$cilician_gates$"
 building_type_cilician_gates_desc: "$cilician_gates_desc$"
 swahili_port_pemba: "奔巴贸易港群"
 swahili_port_pemba_desc: "奔巴岛的珊瑚暗礁、白沙海滩与红树林湿地，为岛民提供了四通八达的水道与丰饶物产，使之成为赞吉海岸天然的贸易中转站。"
 building_type_swahili_port_pemba: "$swahili_port_pemba$"
 building_type_swahili_port_pemba_desc: "$swahili_port_pemba_desc$"
 swahili_port_zanzibar: "层拔贸易港群"
 swahili_port_zanzibar_desc: "温古贾岛的沙质海岸受珊瑚礁庇护，成就了船舶的天然良港。印度洋各地商贾纷至沓来，尽享其作为海运枢纽的地利优势。"
 building_type_swahili_port_zanzibar: "$swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc: "$swahili_port_zanzibar_desc$"
 swahili_port_mombasa: "慢八撒港"
 swahili_port_mombasa_desc: "慢八撒港雄踞陡峭悬崖环绕的岩岛之巅，坐拥易守难攻的天然防御地势，却仍对海上航路保持独特通达性。"
 building_type_swahili_port_mombasa: "$swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc: "$swahili_port_mombasa_desc$"
 swahili_port_pate: "帕泰岛贸易港群"
 swahili_port_pate_desc: "帕泰岛坐落于斯瓦希里文化腹地北缘，是最早接触伊斯兰教并由此联通中东商路网络的斯瓦希里区域之一。"
 building_type_swahili_port_pate: "$swahili_port_pate$"
 building_type_swahili_port_pate_desc: "$swahili_port_pate_desc$"
 swahili_port_lamu: "拉穆贸易港群"
 swahili_port_lamu_desc: "海滩温暖的白沙与轻逸拍岸生机勃勃的蔚蓝海水，掩映着作为拉穆命脉的繁荣商贸。长久以来这里一直与跨洋贸易紧密相连，已知世界东西两端的商品都可以在此买卖。"
 building_type_swahili_port_lamu: "$swahili_port_lamu$"
 building_type_swahili_port_lamu_desc: "$swahili_port_lamu_desc$"
 building_type_dragon_kiln_01: "龙窑"
 building_type_dragon_kiln_01_desc: "此窑炉群沿陡峭山坡而建，可产生极端高温火候，用以烧制作为贵重贸易品与礼器的珍奇瓷器。"
 dragon_kiln_01: "$building_type_dragon_kiln_01$"
 building_dragon_kiln_01_desc: "这座长窑通过横向引导火流走向，形成陶匠所需之炽热环境，用以烧造价值不菲的碗盏、瓶器及其他陶瓷制品。"
 dragon_kiln_02: "$building_type_dragon_kiln_01$ II"
 building_dragon_kiln_02_desc: "采用匣钵容器可显著优化陶瓷生产流程，此类简易装置能在规模化烧制过程中有效隔绝烟尘、灰烬及工业残渣，保护胚体免受污染与损毁。"
 dragon_kiln_03: "$building_type_dragon_kiln_01$ III"
 building_dragon_kiln_03_desc: "通过将主火区隔离为多个燃烧室，既可精准调控窑温，又便于工人装卸陶器。此结构革新使得高品质陶瓷得以批量生产，吸引更多买家愿以溢价购藏。"
 dragon_kiln_04: "$building_type_dragon_kiln_01$ IV"
 dragon_kiln_05: "$building_type_dragon_kiln_01$ V"
 dragon_kiln_terrain_requirement_tt: "[terrain|E]不是#V $terrain_mountains$#!、#V $terrain_desert_mountains$#!或#V $terrain_hills$#!"
 only_one_mint_tt: "[province|E]中不能存在其他铸币厂：只能建造一座#V $mint$#!（位于#V $mine_district$#!）或#V $bureaucratic_mint$#!（位于#V $bureaucratic_district$#!）"
 TERRAIN_NOT_FARMLANDS: "地形不是$farmlands$"
 building_type_burkhan_khaldun_01: "不儿罕合勒敦山"
 building_type_burkhan_khaldun_01_desc: "不儿罕合勒敦山是肯特山脉中最巍峨的山峰。\n相传众多蒙古英雄诞生于此，山坡上遍布敖包，人们在此献祭，以祈求它的赐福。"
 burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
 burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"
 pleasure_dome: "大安阁"
 pleasure_dome_desc: "一座蒙古宫殿，既是军事中心又是文化中心。银树造型的水法象征着最高的荣耀，雕像周身缠绕着蛇，口里流淌出各种美酒佳酿。"
 building_type_pleasure_dome: "$pleasure_dome$"
 building_type_pleasure_dome_desc: "$pleasure_dome_desc$"
 building_type_murex_farm_01: "骨螺渔场"
 building_type_murex_farm_01_desc: "帝王紫的需求量向来很大。用以制作这种奢华染料的螺类正是在此处捕捞和加工的。"
 building_murex_farm_01: "骨螺捕捞场"
 building_murex_farm_01_desc: "地中海沿岸已经建立起了蓬勃发展的捕螺业。出售捕捞的这种螺类提供了一份不算高但却很稳定的收入。"
 building_murex_farm_02: "骨螺加工中心"
 building_murex_farm_02_desc: "该中心加工骨螺非常高效，增大了对宝贵的骨螺分泌物的提取量。其成效就是令人渴求的紫色染料的质量得以更高。"
 building_murex_farm_03: "染料蒸馏所"
 building_murex_farm_03_desc: "专业的蒸馏所将骨螺的分泌物提炼成浓郁的紫色染料。其操作显著提升了染料的鲜艳度和价值。"
 building_murex_farm_04: "晾晒场"
 building_murex_farm_04_desc: "露天的庭院加快了染料氧化的过程。这缩简了紫色染料的生产时间，确保了一种更为高效的工作流程。"
 building_murex_farm_05: "染工大师行会"
 building_murex_farm_05_desc: "染工大师行会以实现完美的推罗紫色而著称，增强了纺织品染色的精确性，使得紫色服装具有一致的高品质。"
 building_murex_farm_06: "丝织作坊"
 building_murex_farm_06_desc: "这座工坊专门编织像丝绸这种可染色的奢华面料，解锁了生产高质量服饰的能力，增加了其贸易价值。"
 building_murex_farm_07: "皇家纺织工坊"
 building_murex_farm_07_desc: "这座皇家工坊专注于大规模生产推罗紫染色的纺织品，显著提升了这些著名服饰的销售收入。"
 building_murex_farm_08: "紫色皇宫"
 building_murex_farm_08_desc: "一座以推罗紫为主题装饰的宏伟宫殿，象征着财富与权力。这展现了当地精熟的推罗紫生产工艺。"
 building_type_generic_copper_mines_01: "铜矿"
 building_type_generic_copper_mines_01_desc: "一处重要的铜矿，为幸运的所有者提供利润颇丰的铜矿石。"
 generic_copper_mines_01: "铜矿点"
 generic_copper_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_copper_mines_02: "铜矿井"
 generic_copper_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_copper_mines_03: "大型铜矿井"
 generic_copper_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_copper_mines_04: "铜矿综合体"
 generic_copper_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_generic_silver_mines_01: "银矿"
 building_type_generic_silver_mines_01_desc: "富饶的银矿，提供源源不断的贵重白银。"
 generic_silver_mines_01: "银矿点"
 generic_silver_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_silver_mines_02: "银矿井"
 generic_silver_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_silver_mines_03: "大型银矿井"
 generic_silver_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_silver_mines_04: "银矿综合体"
 generic_silver_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_generic_gold_mines_01: "金矿"
 building_type_generic_gold_mines_01_desc: "极其珍贵且稀有的金矿，该地区的所有贵族对其垂涎三尺。"
 generic_gold_mines_01: "金矿点"
 generic_gold_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_gold_mines_02: "金矿井"
 generic_gold_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_gold_mines_03: "大型金矿井"
 generic_gold_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_gold_mines_04: "金矿综合体"
 generic_gold_mines_04_desc: "$rammelsberg_mines_04_desc$"
 building_type_capital_bureau_01: "首府政务区"
 building_type_capital_bureau_01_desc: "一个专门的政府机构，它将调用所有资源管理首府。大量的吏员和侍从居住在这片高墙内，随时待命，听候长官的调遣。"
 building_capital_bureau_01: "法院"
 building_capital_bureau_01_desc: "法律是城市繁荣的根基，而法院是唯一能捍卫法律的地方。"
 building_capital_bureau_02: "治安办公室"
 building_capital_bureau_02_desc: "这处机构内部署了大量治安人员，保护城市免受犯罪侵扰，并抓捕违法乱纪之人。"
 building_capital_bureau_03: "消防总部"
 building_capital_bureau_03_desc: "火灾永远是人口密集区域的一大隐患，而一支训练有素的救火队能在火灾蔓延之前将其扑灭。"
 building_capital_bureau_04: "行会管理署"
 building_capital_bureau_04_desc: "城市当局会指派官员来监督各个行会，以确保行会运转高效、高质，并遵循所有必要的程序。"
 building_capital_bureau_05: "司法部"
 building_capital_bureau_05_desc: "随着城市的不断壮大，扩充司法部门势在必行。大批官员、吏员和法官们都在此不遗余力地维护着法律与秩序。"
 building_capital_bureau_06: "城市监狱"
 building_capital_bureau_06_desc: "尽管城市各处可能已设有不少小型监狱，但一座更大的监狱能确保任何违法之人随时能分配到空的牢房。"
 building_capital_bureau_07: "商贸学院"
 building_capital_bureau_07_desc: "贸易是一门利润丰厚的行业，因此必须通过法律进行严格管控。通过监管进城的关税和货物，我们能更加高效地管理首府的物资供应，也许还能多赚取一些黄金。"
 building_capital_bureau_08: "城市官邸"
 building_capital_bureau_08_desc: "这座官邸宏伟庄严，气势足以让大多数宫殿都黯然失色，此地确保行政长官随时都能亲临现场处理事务。毕竟，城市虽永不休息，但其管理者却需要。"
 capital_bureau_custom_effect_desc: "#low 解锁：#!\n提高[GetCourtPositionType('eparch_court_position').GetName()][court_position|E]的[aptitude|E]"
 #ACH
 building_type_oath_warriors_building_01: "军事授权"
 building_type_oath_warriors_building_01_desc: "统治这片疆域的君主已在加冕誓言中宣誓要广纳勇士。"
 oath_warriors_building_01: "老兵勋田"
 oath_warriors_building_01_desc: "长期服役的贵族战士在当地被授予了慷慨的土地，在这忠诚服役的意愿也相应增加。"
 oath_warriors_building_02: "军事庄园"
 oath_warriors_building_02_desc: "那些未战死于沙场的贵族战士阶级成员生活优渥，他们被授予的地产使他们能充分招募并武装自己。"
 oath_warriors_building_03: "村庄封邑"
 oath_warriors_building_03_desc: "许多当地村庄被授予骑士军官作为私人领地，使他们能够以牺牲其他阶级利益为代价来积累力量与财富。"
 oath_warriors_building_04: "广袤军事地产"
 oath_warriors_building_04_desc: "当地税收的相当一部分份额上缴给低阶战士贵族，这些贵族是田地与定居点的头衔持有者。不过，他们强大的随从仍在服役效忠。"
 building_type_oath_faithful_building_01: "宗教圣迹"
 building_type_oath_faithful_building_01_desc: "统治这片疆域的君主已在加冕誓言中宣誓要护佑信众。"
 oath_faithful_building_01: "路边神龛"
 oath_faithful_building_01_desc: "道路旁的小遮蔽处里安置有简易圣像。"
 oath_faithful_building_02: "圣饰门楼"
 oath_faithful_building_02_desc: "定居点的入口上方以及内部通道的每一处都装饰着精细的宗教艺术品，这些作品令人肃然起敬，也保佑着每一位通行者的安全。"
 oath_faithful_building_03: "神殿圣所"
 oath_faithful_building_03_desc: "当地的神殿建筑群已经被扩建，这些宁静场所增设了拱顶花园与淡水井。"
 oath_faithful_building_04: "圣迹广场"
 oath_faithful_building_04_desc: "大量资金用于建造大型中央广场，广场遍布宗教艺术品，没有多余的垃圾和高利贷活动，并为当地人供水。"
 building_type_oath_poor_building_01: "官方救济院"
 building_type_oath_poor_building_01_desc: "统治这片疆域的君主已在加冕誓言中宣誓要赈济贫民。"
 oath_poor_building_01: "慈善习俗"
 oath_poor_building_01_desc: "当局鼓励有经济能力的人将多余食物与财富提供给不幸者，通常是在圣日期间。"
 oath_poor_building_02: "济贫院"
 oath_poor_building_02_desc: "赤贫者、寡妇及老者将得到简单食宿与一些照料。"
 oath_poor_building_03: "慈善部门"
 oath_poor_building_03_desc: "救济院及其他服务贫民的公共设施由资财充裕的官员妥善管理。"
 oath_poor_building_04: "慈善机构"
 oath_poor_building_04_desc: "全境贫者皆无匮乏。为潜在的流浪者提供优越的住宿，医院照料病患及老者，贫农获发慷慨的津贴。"
