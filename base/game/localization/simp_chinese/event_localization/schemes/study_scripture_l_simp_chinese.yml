l_simp_chinese:
 study_scripture_outcome.10.t: "$study_scripture_title$研读之道"
 study_scripture_outcome.10.desc: "那些书摊开在讲台架上：[ROOT.Char.GetFaith.GetAdjective]教义的条目被一笔一划耐心地抄写下来。一根蜡烛在黑暗中摇曳。下方的[ROOT.Char.GetFaith.HouseOfWorship]里，信徒们在等候着，一如往常。\n\n"
 study_scripture_outcome.10.desc_quote: "在最上面那一页，我之前的某个读者用笔划出了单独的一句话：#EMP “[ROOT.Char.Custom('RandomStudyVerseFragment')]”#!\n\n我愿意为这神圣的书页奉献多少自我？"
 study_scripture_outcome.10.desc_generic: "我愿意为这神圣的书页奉献多少自我？"
 study_scripture_outcome.10.a: "在世界在修道院门外等候吧。"
 study_scripture_outcome.10.b: "学习自有其时，[ROOT.Char.Custom('StudyOfficesWord')]也有它们的时候。"
 study_scripture_outcome.10.c: "我将随性而读。"
 no_change_study_scripture_tt: "你的[GetScheme('study_scripture').GetTypeName][scheme|E]的进展无修正"
 study_scripture_outcome.110.t: "$study_scripture_title$神圣之页"
 study_scripture_outcome.110.desc: "我逐行研读[ROOT.Char.GetFaith.GetName]的伟大经文，蜡烛下的蜡油聚成一滩，页边空白处画的兔子和蜗牛像是在互相争吵。\n\n"
 study_scripture_outcome.110.desc_quote: "有一段话触动了我：\n#EMP “[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!\n\n如果我要做[ROOT.Char.GetFaith.HighGodNamePossessive]忠实信徒的牧者，这些是我必须铭刻在心里的话。"
 study_scripture_outcome.110.desc_generic: "如果我要做[ROOT.Char.GetFaith.HighGodNamePossessive]忠实信徒的牧者，这些是我必须铭刻在心里的话。"
 study_scripture_outcome.110.a: "我必须不惜一切代价去学习。"
 study_scripture_outcome.110.b: "理解自会适时而至。"
 study_scripture_outcome.120.t: "$study_scripture_title$长篇注释"
 study_scripture_outcome.120.desc: "在我能带领我的信众之前，我必须先学会带领自己。[commentary_writer.GetTitledFirstName]的注释摊开在我面前——另一位学者倾其一生对[ROOT.Char.GetFaith.ReligiousText]所做的功课，密得像荆棘丛，尖得有过之而无不及。我每理清一行，就冒出三行新的。\n\n只有靠自律，我才能走通。"
 study_scripture_outcome.120.a: "我将梳理文本以探寻更深层的含义。"
 study_scripture_outcome.120.b: "稳扎稳打，持续进步。"
 study_scripture_outcome.120.c: "一页一页就够了。"
 scholar_xp_high_tt: "你在学识上取得显著提升"
 scholar_xp_low_tt: "你在学识上取得少量提升"
 study_scripture_outcome.130.t: "$study_scripture_title$页边注的耐心"
 study_scripture_outcome.130.desc: "为什么就是读不懂？我把那段话看了第四遍，它还是像攥紧的拳头一样难以打开。我把额头轻轻抵在桌上。\n\n“我给你带了根蜡烛，”我的[ROOT.Char.Custom2('RelationToMeShort', tutor)][tutor.GetFirstName]站在门口说。“啊——那些旧注释。这几页我很熟。要不要一起读一会儿？”\n\n我抬起头。也许一只援手正是我现在需要的。"
 study_scripture_outcome.130.a: "教教我吧，我并非傲慢到不愿学习。"
 study_scripture_outcome.130.b: "陪我坐一会儿，文字可以等。"
 study_scripture_outcome.140.t: "$study_scripture_title$向[ROOT.Char.Custom('StudyParishWord')|U]传道"
 study_scripture_outcome.140.desc: "我叹了口气合上书。教义全在这里面，可上次[preacher.GetTitledFirstName]在我面前讲道的时候，里面没有半点三段论：只有[ROOT.Char.GetFaith.HighGodNamePossessive]直白的真理。[ROOT.Char.Custom('StudyParishWord')]哭了。#EMP 我#!也哭了。"
 study_scripture_outcome.140.a: "有教义，也有践行。两者我都要学习。"
 study_scripture_outcome.140.b: "我的使命是书页，而非[ROOT.Char.Custom('StudyPulpitWord')]。"
 study_scripture_outcome.150.t: "$study_scripture_title$世俗事务"
 study_scripture_outcome.150.desc: "“随我来，”我的[ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )][steward_scope.GetFirstName]说着，胳膊底下夹着账本，朝门外的清晨招了招手。\n\n“神殿的田地、磨坊、什一税谷仓——记下哪些是满的，哪些在漏，哪些被许了两家。单靠恩典可喂不饱羊群。”"
 study_scripture_outcome.150.a: "教我记账。"
 study_scripture_outcome.150.b: "至少散散步能让我清醒一下。"
 study_scripture_outcome.160.t: "$study_scripture_title$博学同伴"
 study_scripture_outcome.160.desc: "我的研习让我和[colleague.GetTitledFirstName]开始了书信往来，[colleague.GetHerHis]的虔诚在自己的城墙之外也被人称道。\n\n"
 study_scripture_outcome.160.desc_distant: "我们就信仰方面的问题互通书信——疑问、论点、指正来回传递。[colleague.GetHerHis|U]的字迹糟得很，但论证却有理有据。"
 study_scripture_outcome.160.a: "让我们好好辩论一番。"
 study_scripture_outcome.160.b: "一位博学的[ROOT.Char.GetWomanMan]应当明白[ROOT.Char.GetHerHis]所见是如何治理的。"
 study_scripture_outcome.160.c: "一起回到文本中吧。"
 piety_gain_high_tt: "获得大量虔诚"
 piety_gain_low_tt: "获得少量虔诚"
 study_scripture_outcome.170.t: "$study_scripture_title$密封的信"
 study_scripture_outcome.170.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', letterman)][letterman.GetFirstName]像捧圣物一样把信送进来：一封盖着[senior.GetTitledFirstName]印章的信。\n\n“你研习的消息比你自己知道的传得还要远。一个会读书的牧者让信仰更加丰盈。坚持下去，我的恩典与你同在。”\n\n"
 study_scripture_outcome.170.desc_quote: "信的末尾单独列出一句经文，与正文隔开：\n#EMP “[ROOT.Char.Custom('RandomBibleQuoteShort')]”#!"
 study_scripture_outcome.170.desc_generic: "信的结尾以[ROOT.Char.GetFaith.HighGodNamePossessive]的名义祝福，字迹比其他部分要大。"
 study_scripture_outcome.170.a: "我会拟写一份得体的回复。"
 study_scripture_outcome.170.b: "或许[senior.GetSheHe]会更公开地称赞我的学识？"
 study_scripture_outcome.170.c: "再读一遍。这次慢点读。"
 study_scripture_outcome.171.t: "$study_scripture_title$致信徒书"
 study_scripture_outcome.171.desc: "我收到来自[ROOT.Char.GetFaith.GetName]各个角落的信。为礼拜仪式上的一个词吵得不可开交的神职人员，害怕自己内心疑惑的乡村[ROOT.Char.GetFaith.PriestNeuterPlural]，还有一个学者恳求我判断一段没有活人能核实的译文。我的印章是用来终结争论的。\n\n"
 study_scripture_outcome.171.desc_quote: "今晚这封信满怀希望地引用经文对我说：\n#EMP “[ROOT.Char.Custom('RandomBibleQuoteShort')]”#!\n\n桌上的信堆越来越高。而我的学识，也在悄悄地增长。"
 study_scripture_outcome.171.desc_generic: "桌上的信堆越来越高。而我的学识，也在悄悄地增长。"
 study_scripture_outcome.171.a: "全都回应他们。这就是牧者该做的事。"
 study_scripture_outcome.171.b: "让抄写员将我的答复传遍信仰的每一个角落。"
 study_scripture_outcome.171.c: "今夜我是一名学生，信件可以稍后再处理。"
 study_scripture_outcome.172.t: "$study_scripture_title$牧函"
 study_scripture_outcome.172.desc: "今晚我研读牧者们写给远方会众的信：从[ROOT.Char.Custom('StudyParishWord')]到[ROOT.Char.Custom('StudyParishWord')]，布道和教导的内容差别很大。\n\n我想到了[pastoral_lord.GetTitledFirstName]领地上[pastoral_county.GetNameNoTier]的信徒。他们在那里有一座教堂。远离我的管辖离，缺少我的指引……也许是时候我亲自给他们写封信了。\n\n我拿起羽毛笔。#EMP “致[pastoral_county.GetNameNoTier]的信众……”#!"
 study_scripture_outcome.172.a: "发出。"
 study_scripture_outcome.172.b: "这次的课程是书写。这就足够了。"
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName]已致信[pastoral_county.GetNameNoTier]的人民"
 study_scripture_outcome.180.t: "$study_scripture_title$卸下重负"
 study_scripture_outcome.180.desc: "我咬紧牙关、绷着肩膀开始读，以为又是一项需要熬过去的职责。\n\n"
 study_scripture_outcome.180.desc_confession: "从第一页读到最后一页的某个地方，我整个人垮了。我背负的一切，我开口说了出来，只说给[ROOT.Char.GetFaith.HighGodName]听。那份重量消失了。\n\n几个月来头一次，前面的路清楚了。"
 study_scripture_outcome.180.desc_generic: "从第一页读到最后一页的某个地方，肩上的重量滑落了。就好像有一层面纱被揭开。\n\n几个月来头一次，前面的路清楚了。"
 study_scripture_outcome.180.a: "现在——接下来读什么呢……"
 study_scripture_outcome.190.t: "$study_scripture_title$博学者的赞助"
 study_scripture_outcome.190.desc: "学问也有它的门道。一本抄好的书送对议事厅，一个有前途的读经人安排对了席位，我的名字在对的厅堂里被人热情提起……\n\n我很勤勉。但没人看见的勤勉就是白费的勤勉。"
 study_scripture_outcome.190.a: "确保宗教会议听到我的名字。"
 study_scripture_outcome.190.b: "请神学家们分享他们的笔记。"
 study_scripture_outcome.190.c: "神秘主义者需要知道我的作品。"
 study_scripture_outcome.190.d: "我的虔诚无需依附他人。"
 study_scripture_outcome.200.t: "$study_scripture_title$神视"
 study_scripture_outcome.200.desc: "有些书页上，文字戛然而止，而后是另一种存在。那个被称为[mystic.GetTitledFirstName]的[GetTrait('lifestyle_mystic').GetName( mystic )]写到一种比正午还明亮的黑暗，写到言语穷尽之后仍在继续的祈祷——而[ROOT.Char.GetFaith.GetName]教导说，这样的门为敢于叩门的人而存在。\n\n我一直读到蜡烛燃尽。然后我在黑暗中坐了很久，听着。"
 study_scripture_outcome.200.a: "黑暗中有什么在等待，我将去寻找它。"
 study_scripture_outcome.200.b: "考验我吧，奥秘。我无所畏惧。"
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip]值得一封赞美信。"
 study_scripture_outcome.200.d: "我会记下那扇门，还是先专注更朴素的研习吧。"
 study_scripture_outcome.300.t: "$study_scripture_title$守夜"
 study_scripture_outcome.300.desc: "[ROOT.Char.GetFaith.HouseOfWorship]里很冷，也完全静了下来。在最后一次祈祷和第一次祈祷之间有一段不属于任何人的时间，我把它据为己有——一根蜡烛，黑暗，还有从四面逼近火焰的那种神秘。\n\n有什么东西在寂静后面等着。它很有耐心。今晚，我也一样。"
 study_scripture_outcome.300.a: "更深，我要走得更深。"
 study_scripture_outcome.300.b: "静默一小时，随后入眠。"
 study_scripture_outcome.300.c: "我已守过夜，这就足够了。"
 study_scripture_outcome.100.t: "$study_scripture_title$继承之问"
 study_scripture_outcome.100.desc: "夜色降临时，我把选举的教规摊在面前，微弱的光照着那些书页。谁可以被提拔，谁可以提拔他人，哪些先例要守、哪些可以变通——全都在这里面，留给有耐心去读的人。\n\n老人会死去，秘密会议再召集。而那些红衣主教们会记得谁在关键时刻懂得律法。"
 study_scripture_outcome.100.a: "终有一日，有人会问起这个问题，而我将是答案。"
 study_scripture_outcome.100.b: "智慧需要时间，让野心稍候。"
 study_scripture_outcome.100.c: "我还是去睡觉吧……"
 pam_ss_papabile_tt: "你对教宗继承的[papabile_score|E]提高#P +10#!"
 study_scripture_outcome.101.t: "$study_scripture_title$著名解经家"
 study_scripture_outcome.101.desc: "答案在一顿冷掉的晚饭中降临，就在一口和下一口之间。我终于知道怎么解读这段文字了：\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP “[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!\n\n一代又一代的[Glossary('解经家', 'GLOSS_EXEGETE')]都在争论这些词句。如今它们的含义似乎再清楚不过。问题是，我该怎么处理我的理解。"
 study_scripture_outcome.101.desc_generic: "一代又一代的[Glossary('解经家', 'GLOSS_EXEGETE')]都在争论这些词句。如今它们的含义似乎再清楚不过。问题是，我该怎么处理我的理解。"
 study_scripture_outcome.101.a: "在下次宴会上从[ROOT.Char.Custom('StudyPulpitWord')]宣讲此道。"
 study_scripture_outcome.101.b: "在学者间悄悄流传。"
 study_scripture_outcome.101.c: "它无声地赐予我，我也将无声地归还。"
 GLOSS_EXEGETE: "从事经文注释的人——擅长批判性解释、诠释或阐述文本，尤其是宗教经典的专家或学者。"
 study_scripture_outcome.102.t: "$study_scripture_title$教义明晰"
 study_scripture_outcome.102.desc: "多年来，[ROOT.Char.GetFaith.GetName]的教义一直存于我的脑海，但有些教导我始终不太明白。\n\n"
 study_scripture_outcome.102.desc_tenet: "今晚，[pam_ss_clarity_tenet.GetBaseName|U]终于变得清晰：它要求什么，它宽恕什么，它的界限在哪里。我理解得足够透彻，可以在任何学者面前为之辩护，也可以向一个孩子解释清楚。"
 study_scripture_outcome.102.desc_generic: "今晚，教义终于变得清晰：它要求什么，它宽恕什么，它的界限在哪里。我理解得足够透彻，可以在任何学者面前为之辩护，也可以向一个孩子解释清楚。"
 study_scripture_outcome.102.desc_quote: "\n\n#EMP “[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!"
 study_scripture_outcome.102.a: "我必须在光线暗下来之前把它写下来。"
 study_scripture_outcome.102.b: "这份喜悦便已足够。"
 study_scripture_outcome.102.c: "即使启示也可以等到明早再说。"
 study_scripture_outcome.121.t: "$study_scripture_title$老师"
 study_scripture_outcome.121.desc: "在蜡烛本该熄灭很久之后，我发现我的[ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )]，[student_courtier.GetTitledFirstName]，还在图书馆里，弓着背对着一本远远超出[student_courtier.GetHerHis]学识范围的书。\n\n“请您宽恕，[ROOT.Char.Custom('FormOfAddressForLiege')]。”[student_courtier.GetSheHe|U]吓了一跳，结结巴巴地说。“我……我只是希望我能读懂这本大部头……”\n\n我记得我曾经多么想要有一位真正#EMP 读过#!这本书的老师。"
 study_scripture_outcome.121.a: "我们会一起好好读一遍。"
 study_scripture_outcome.121.b: "我将赞助[student_courtier.GetHerHim]。"
 study_scripture_outcome.121.c: "让[student_courtier.GetHerHim]独自学习吧，这能磨炼心性。"
 study_scripture_outcome.122.t: "$study_scripture_title$教理问答"
 study_scripture_outcome.122.desc: "我的学习有了成果。今晚，我把屋里的人召集到我[ROOT.Char.Custom('ResidenceBuilding')]的[ROOT.Char.Custom('ResidenceBuildingHallsType')]，在他们面前翻开了[ROOT.Char.GetFaith.ReligiousText]。\n\n我读，他们听。很快就有人提出问题——有些简单，有些却出人意料地尖锐。看来，对神圣学问有渴求的不止我一个。"
 study_scripture_outcome.122.a: "给每个人一行一行来。这就是工作。"
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U]头脑敏锐。我会多教导[pupil.GetHerHim]。"
 study_scripture_outcome.122.c: "为[stray.GetFirstNameNoTooltip|U]留一扇书房的后门。"
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U]学的足够了。愿[devout.GetHerHim]得到我的祝福。"
 study_scripture_outcome.123.t: "$study_scripture_title$[ROOT.Char.Custom('StudySeminaryWord')|U]之门"
 study_scripture_outcome.123.desc: "我研习的名声跟着朝圣者和小贩传了出去，今天他们给我带来了一个想求学的人。[aspirant.GetTitledFirstName]站在我门口，一身旅途风尘，神情倔强，手里紧紧抓着一本借来的书，双手在发抖。\n\n“他们说你是真的读过你所宣扬的东西。请教教我，我愿为你效力。”"
 study_scripture_outcome.123.a: "啊，我们从信仰的基础知识开始。"
 study_scripture_outcome.123.b: "我的宫廷可不是[ROOT.Char.Custom('StudySeminaryWord')]。"
 study_scripture_outcome.400.t: "$study_scripture_title$医者先自医"
 study_scripture_outcome.400.desc: "这段经文让我停了下来。里面的谴责让人不安地觉得熟悉。\n\n"
 study_scripture_outcome.400.desc_generic: "经文没有点我的名，却又点了：你是[penance_sin.GetName( ROOT.Char )]的，它说——直白而且毫不留情——好像写的人认识我。"
 study_scripture_outcome.400.desc_end: "\n\n我可以合上书不再往下读。但那指控依然留在那里。"
 study_scripture_outcome.400.a: "唯一的解药是忏悔。"
 study_scripture_outcome.400.b: "无论怎样，我必须继续读下去。"
 study_scripture_outcome.400.c: "圣人布道，罪人治国。"
 study_scripture_outcome.410.t: "$study_scripture_title$奇异评注"
 study_scripture_outcome.410.desc: "这份手抄本是借来的，之前的读者在页边空白处留下了自己的想法：反驳、祈祷，还有对他们称为[pam_ss_margin_tenet.GetBaseName]那条教义的笔记。\n\n我应该忽略这些涂涂写写。但我却把它们读了两遍。"
 study_scripture_outcome.410.a: "现在，第三遍，慢慢地。"
 study_scripture_outcome.410.b: "这样较真的谬论值得一个像样的反驳。"
 study_scripture_outcome.410.c: "连同书页一起，投入火中。"
 study_scripture_outcome.430.t: "$study_scripture_title$信条与心灵"
 study_scripture_outcome.430.desc: "在[ROOT.Char.GetFaith.GetName]的教义中，有一条对我而言超越所有其他教义：[pam_ss_heart_tenet.GetBaseName]，从我还没法替它辩护的时候起就带着它。今晚我把我的研习转向它，想找出其中不足之处。\n\n"
 study_scripture_outcome.430.desc_quote: "经文用同一个声音回答：\n#EMP “[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]”#!\n\n缺陷从来不在教义里。"
 study_scripture_outcome.430.desc_generic: "经文用同一个声音回答，比我的更古老、更沉稳。缺陷从来不在教义里。"
 study_scripture_outcome.430.a: "我深信不疑。让整个[ROOT.Char.Custom('StudyParishWord')]都看到我践行它。"
 study_scripture_outcome.430.b: "我要为它辩护。"
 study_scripture_outcome.430.c: "细究之下，任何教义都有缺陷……"
 pam_ss_spread_tenet_tt: "你的书面辩护最多可说服#V 3#!位[rulers|E]接纳[pam_ss_heart_tenet.GetBaseName]"
 pam_ss_conviction_spread_tt: "$study_scripture_title$已采纳个人信条"
 study_scripture_outcome.1000.t: "$study_scripture_title$受责的牧者"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U]没有提高嗓门。[senior.GetSheHe|U]不需要那样做。\n\n“他们告诉我你的研究在积灰。一个不愿学习的牧者只会带出一群没有方向的羊。你得到的比大多数人都多——你用这些做了什么？”\n\n之后的沉默比任何训斥都难熬。"
 study_scripture_outcome.1000.desc_letter: "信上盖着[senior.GetTitledFirstName]的印章，每一句克制的话都像石头一样砸下来：\n\n“有消息传到我这里，说你的研习出了问题。一个不肯学习的牧者会把[ROOT.Char.GetHerHis]的羊群带偏。你得到的比大多数人都多。我希望听到更好的消息。”\n\n没有署名，印章已足够。"
 study_scripture_outcome.1000.desc_dream: "梦里我站在一座巨大的图书馆中，每本书都印着我的名字，每一页都是空白的。一个我从上百幅圣像中认出的身影合上了最后一本，轻轻地，就像合上死者的眼睛那样。\n\n“你得到的比大多数人都多。”圣人说——我醒来时，那些话还留在房间里。"
 study_scripture_outcome.1000.a: "我不会再让人失望。"
 study_scripture_outcome.1000.b: "我再也撑不下去了。到此为止——永远。"
 study_scripture_outcome.1000.c: "够了。我需要休息。"
 never_study_scripture_again_tt: "你#N 再也无法#!发起[GetScheme('study_scripture').GetTypeName][scheme|E]"
 study_scripture_outcome.1010.t: "$study_scripture_title$笔墨礼物"
 study_scripture_outcome.1010.desc: "一个包裹从[sender.GetTitledFirstName]寄来。"
 study_scripture_outcome.1010.end_christian: "一条缎带标出了我一直没能掌握的那段经文：\n\n#EMP “[ROOT.Char.Custom('RandomRelevantBibleQuote')]”#!\n\n一份大方的礼物，也是一份有用的礼物。"
 study_scripture_outcome.1010.end: "里面是一本装帧精美的祷告书，书页上满是祈祷、注释和细致的彩饰。\n\n一份大方的礼物，也是一份有用的礼物。那些一直躲开我的答案，也许已经藏在这些书页之间了。"
 study_scripture_outcome.1010.a: "我会好好利用这份礼物。"
 study_scripture_outcome.1010.b: "一本好书，放在我的书架上会很合适。"
 pam_ss_devotional_book_name: "祷告书"
 pam_ss_devotional_book_description: "一本带有彩饰的圣典和注释，抄写和镀金中能看出心灵的虔诚。一条缎带标出了受赠者最需要读的那段经文。"
 study_scripture_outcome.1020.t: "$study_scripture_title$克修"
 study_scripture_outcome.1020.desc: "今晚经文又把我压垮了，就像昨晚，就像前晚。我的目光从书页上滑开，脑子里想着晚饭、床、什么都行，就是不想教义。\n\n问题出在身体上。古时的苦修士知道这一点：安逸是[ROOT.Char.GetFaith.DevilName]最沉默的仆从，而饥饿让灵魂变得锋利。也许肉体必须先让步，灵魂才能往前走。"
 study_scripture_outcome.1020.a: "鞭笞能净化我的思想。"
 study_scripture_outcome.1020.b: "饿其体肤，喂饱灵魂。"
 study_scripture_outcome.1020.c: "又或许，一顿晚餐、一张床，以及明天重新开始的机会。"
 study_scripture_outcome.1030.t: "$study_scripture_title$隐居禁院"
 study_scripture_outcome.1030.desc: "我的研习停下来了。同样的桌子，同样的蜡烛，同样的挫败。于是我去找我的[ROOT.Char.Custom2( 'RelationToMeShort', counselor )][counselor.GetTitledFirstName]，[counselor.GetSheHe]的虔诚并不在乎身份高低。\n\n"
 study_scripture_outcome.1030.desc_hermitage: "“你带来了太多心墙，”[counselor.GetFirstNameNoTooltip]说着，手势指向空荡荡的房间、那盏孤灯、那片安静。“古老的隐士知道：把一切都剥去，剩下的就是你一直在找的东西。”"
 study_scripture_outcome.1030.desc_monastery: "“你读起书来像个统治者，”[counselor.GetFirstNameNoTooltip]说，语气并不刻薄。“征服书页，像计税一样数它们。在这里，我们把同一行字读上一周，直到它反过来读我们。”"
 study_scripture_outcome.1030.a: "为我的书房安排一场祝福仪式。"
 study_scripture_outcome.1030.b: "那我就连续两周读同一段文字。"
 study_scripture_outcome.1030.c: "我会为此祈祷，然后将其搁置。"
 study_scripture_outcome.1040.t: "$study_scripture_title$第二双手"
 study_scripture_outcome.1040.desc_acolyte: "我没有开口求助，但它不请自来。我的[ROOT.Char.Custom2( 'RelationToMeShort', helper )][helper.GetTitledFirstName]替我把笔记整理好，找到了对的注释，还把蜡烛剪了剪。[helper.GetSheHe|U]已经悄悄摸透了我的习惯——甚至知道哪些段落会让我叹气。\n\n“在祷告前得先休息好。”[helper.GetSheHe]简单地说着，在我的笔记旁边放下一份热的[helper.Custom('GetLocalStreetFood')]。"
 study_scripture_outcome.1040.desc_partner: "我的[ROOT.Char.Custom2( 'RelationToMeShort', helper )][helper.GetTitledFirstName]悄悄进来，从我手中拿走手抄本，把那一行念了出来。那些字是神圣的。[ROOT.Char.GetFaith.HighGodName]宽恕我——今晚我觉得[helper.GetHerHis]的[helper.Custom('ObjectifiedFeature')]更加神圣。\n\n“让我帮你，”[helper.GetSheHe]轻声低语，靠得近到能共享烛火的温暖。“我愿意。”"
 study_scripture_outcome.1040.a: "那就记录口述直到黎明，我们要做完这件事。"
 study_scripture_outcome.1040.b: "那就一起待一个小时吧。"
 study_scripture_outcome.1040.c: "这份善意已足够。"
 study_scripture_outcome.1040.d: "靠近些，烛光只能照这么远……"
 study_scripture_outcome.1050.t: "$study_scripture_title$灵魂的暗夜"
 study_scripture_outcome.1050.desc: "我读得太远了。午夜过后的某个时候，答案让位于疑问，确信让位于怀疑。\n\n"
 study_scripture_outcome.1050.desc_quote: "我不是第一个面对这种寂静的人。#EMP “我的神，我的神，你为什么离弃我？”#!\n\n蜡烛在燃烧，寂静还在支撑。接下来呢？"
 study_scripture_outcome.1050.desc_generic: "每个时代的圣人都曾经历过这样的疑虑——那一刻，[ROOT.Char.GetFaith.HighGodName]屏住了气，不愿道出缘由。\n\n蜡烛在燃烧，寂静还在支撑。接下来呢？"
 study_scripture_outcome.1050.a: "怀疑与其他词句并无二致。"
 study_scripture_outcome.1050.b: "或许，沉默本身就是答案。"
 study_scripture_outcome.1050.c: "过去的话语，过去的怀疑——直入奥秘本身。"
 study_scripture_outcome.1060.t: "$study_scripture_title$教规[Select_CString( order_head.IsFemale, '姐妹', '兄弟' )]"
 study_scripture_outcome.1060.desc_house: "我挣扎着，没学到什么有用的东西。但这事传到了[order_head.GetPrimaryTitle.GetNameNoTier|l]那里，[order_head.GetSheHe]的修会在[order_house_county.GetNameNoTier]有一座宅邸。今天他们的马车嘎吱嘎吱地进了我的院子：手抄的注释、一箱蜡烛，还有一封盖着[order_head.GetTitledFirstName]印章的信。\n\n“只要教规还在，没有哪个牧者会独自研习。告知一声，我们拥有的就是你拥有的。”"
 study_scripture_outcome.1060.desc_far: "我的挣扎的事情传到了很远的地方——一直传到[order_head.GetPrimaryTitle.GetNameNoTier|l]。今天他们的马车嘎吱嘎吱地进了我的院子：手抄的注释、一箱蜡烛，还有一封盖着[order_head.GetTitledFirstName]印章的信。\n\n“只要教规还在，没有哪个牧者会独自研习。告知一声，我们拥有的就是你拥有的。”"
 study_scripture_outcome.1060.a: "感谢所有参与抄录的人。"
 study_scripture_outcome.1060.b: "派一位有学识的教士给我。"
 study_scripture_outcome.1060.c: "愿[ROOT.Char.GetFaith.HighGodName]庇佑他们。"
 pam_ss_lettered_brother_tt: "一位该修会的#EMP 有学问的教士#!加入你的[court|E]"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U]自[order_head.GetPrimaryTitle.GetNameNoTier|l]抵达"
