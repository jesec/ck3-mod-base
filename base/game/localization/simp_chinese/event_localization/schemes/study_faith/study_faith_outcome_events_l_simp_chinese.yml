l_simp_chinese:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "发现[target.GetAdherentNameNoTooltip]！"
 study_faith_outcome.0010.desc: "我的谨慎打探和小额贿赂果然没有白费！如今[study_faith_target.GetShortUIName]就站在我面前，据说是一位[target.GetAdherentName]。\n\n"
 study_faith_outcome.0010.desc.in_realm: "不久前，我请求与一位来自我领地的[target.GetAdherentName]会面。如今[study_faith_target.GetShortUIName]已应召而来，站在我的面前。\n\n"
 study_faith_outcome.0010.d.intimidated: "“您要我做什么，[ROOT.Char.GetTitleAsName]？”[study_faith_target.GetSheHe]颤抖着问道。卫兵们怀疑地盯着[study_faith_target.GetHerHim]，随时准备在出现任何巫术迹象时采取行动。"
 study_faith_outcome.0010.d.safe: "“我能为您做些什么，[ROOT.Char.GetTitleAsName]？”[study_faith_target.GetSheHe]略显胆怯地问道。我的卫兵们了解关于我搜索的传闻，好奇地打量着[study_faith_target.GetHerHim]。"
 study_faith_outcome.0010.a: "让我从你身上研习[target.GetNameNoTooltip]。"
 study_faith_outcome.0010.b: "我改变主意了。"
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName]将被释放，[study_faith_target.GetSheHe]可以按照自己认为合适的方式过 [study_faith_target.GetHerHis]的生活"
 study_faith_outcome.0101.t: "了解[actor.GetFaith.HighGodName]"
 study_faith_outcome.0101.desc: "对[actor.GetRite.GetName]的艰苦研究，使我更好地理解了我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))][actor.GetName]，尤其是如何走上[actor.GetFaith.GoodGodNames]的道路。"
 study_faith_outcome.0101.a: "是时候皈依了。"
 study_faith_outcome.0101.b: "我不能放弃[ROOT.Char.GetFaith.GoodGodNames]！"
 study_faith_outcome.0102.desc: "感谢你的耐心和慷慨，引导我走出无知。如今我已走上[actor.GetFaith.GoodGodNames]的道路。"
 study_faith_outcome.0102.a: "我这么做是对的。"
 study_faith_outcome.0103.desc: "我忠于[recipient.GetFaith.GoodGodNames]！我不会放弃[recipient.GetRite.GetName]。"
 study_faith_outcome.0103.a: "不服从是有代价的……"
 study_faith_outcome.0111.t: "努力掌握[actor.GetRite.GetNameNoTooltip]"
 study_faith_outcome.0111.desc: "对[actor.GetRite.GetName]的艰苦研究毫无进展！我不仅难以走上[actor.GetFaith.GoodGodNames]的道路，还担心我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))][actor.GetFirstNamePossessive]可能已误入歧途。"
 study_faith_outcome.0111.a: "也许改信会带来理解……"
 study_faith_outcome.0111.b: "我会加倍努力。"
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$：突破"
 study_faith_outcome.1000.desc: "经过所有这些努力，一切终于各就各位。没日没夜地翻阅书籍，不眠不休地练习礼仪，数不胜数的[target.GetFaith.GetAdjective]课程用以掌握神学——所有这些加在一起，终于让我对[target.GetRite.GetAdjective]仪式有了清晰的理解。\n\n我一直在努力模仿[target.GetTitledFirstName]，不过现在，我想我开始理解[target.GetSheHe]为什么会在[target.GetRite.GetName]的“温暖怀抱”中感受到舒适了！"
 study_faith_outcome.1000.a: "我能学习几乎任何信仰的实践！"
 study_faith_outcome.1000.b: "我认为[scheme.GetTargetCharacter.GetRite.GetNameNoTooltip]礼仪比我自己的更有道理……"
 study_faith_outcome.1200.t: "$study_faith$：聚焦新信条"
 study_faith_outcome.1200.desc: "我的书房熟悉的墙壁见证了一场安静的胜利——我终于弄清了[discovered_tenet.GetName( target.GetRite )]在[target.GetRite.GetAdjective]中的价值。尽管这信条有些陌生，但我稍加想象，就能在脑海中浮现出[target.GetTitledFirstName]和[target.GetHerHis]的亲属们参与这一陌生实践的场景。\n\n这不过是漫漫长路上的一步——然而，我在[target.GetRite.GetNameNoTooltip]礼仪中的探索旅程，终究又向前挪了几寸。"
 study_faith_outcome.1200.a: "我渴望更了解[target.GetRite.GetAdjectiveNoTooltip]！"
 study_faith_outcome.1200.b: "真迷人。我很好奇它和[additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]有什么关联！"
 study_faith_outcome.1200.c: "这让我很不舒服……"
 study_faith_outcome.1400.t: "$study_faith$：[target.GetRite.GetNameNoTooltip]习俗"
 study_faith_outcome.1400.desc: "要理解[target.GetRite.GetName]礼仪，不仅要研究它的形而上学框架，还要研究它对日常生活的世俗影响。\n\n在反思了[discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]的概念后，我已经充分掌握了其含义，可以将其与[target.GetRite.GetNameNoTooltip]的整体实践联系起来。"
 study_faith_outcome.1400.alt1.desc: "\n\n借此契机，我也洞悉了他们践行[third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]时的细微教义差异！"
 study_faith_outcome.1400.alt2.desc: "\n\n这只是一个更大谜题中的一小块，但每一块都让我离理解整个[target.GetRite.GetNameNoTooltip]礼仪更近一步。"
 study_faith_outcome.1400.a: "有用的知识。前进。"
 study_faith_outcome.1400.b: "我会加班加点。"
 study_faith_outcome.1400.c: "让我从[target.GetShortUINameNoTooltip]身上挖掘更多。"
 study_faith_outcome.1500.t: "$study_faith$：难以触及"
 study_faith_outcome.1500.desc: "长期的研习使我走到了外部人士所能抵达的最远的地方。[target.GetRite.GetName][rite|E]依然存在的奥秘，都是仅传给内部人士的，无法从文本、观察甚至最耐心的老师那里获得。\n\n我所能了解的，如今已全数了解了。"
 study_faith_outcome.1500.a: "我已了解了所能了解的。"
 study_faith_outcome.1500.toast: "$study_faith$结束"
 study_faith_outcome.1500.toast.desc: "你已了解了外人所能了解的[target.GetRite.GetName][rite|E]的所有[core_tenet|E]和[doctrine|E]"
 study_faith_scheme_stays_active: "[scheme|E]保持进行"
 study_faith_outcome.3000.t: "$study_faith$：继续研习？"
 study_faith_outcome.3000.desc: "不幸的是[target.GetTitledFirstName]永远不在我身边了。真遗憾，我一直都是指望[target.GetHerHim]来指导[target.GetFaith.GetName]的细节。\n\n说是这么说，但也无需中止我的研习——我只需要再找一个人来效仿就好了！"
 study_faith_outcome.3000.alt1.desc: "很遗憾[target.GetTitledFirstName]不是指导我[target.GetFaith.GetName]细节的最佳人选。\n\n说是这么说，但也无需中止我的研习——我只需要再找一个人来效仿就好了！"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip]是热忱的崇拜者！"
 study_faith_outcome.3000.b: "也许[potential_continuation_target_2.GetTitledFirstNameNoTooltip]？[potential_continuation_target_2.GetHerHis|U]的神学很有趣。"
 study_faith_outcome.3000.c: "也许该选[potential_continuation_target_3.GetTitledFirstNameNoTooltip]？"
 study_faith_outcome.3000.d: "啊，我正好在找一个不学的理由！万岁！"
 study_faith_scheme_retains_progress: "[scheme|E]保留之前的全部进度"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U]研习礼仪！"
 child_studied_faith_desc: "你的[owner.Custom('GetDaughterSon')]了解了[target.GetRite.GetName][rite|E]"
 child_studied_faith_invalidated_title: "你孩子的研习礼仪计谋无效"
 child_studied_faith_invalidated_desc: "你孩子的[GetScheme('study_faith').GetTypeName][scheme|E]已无效"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$：年富力强"
 study_faith_ongoing.1000.t.theologian: "$study_faith$：见多识广"
 study_faith_ongoing.1000.desc.young: "我对[scheme.GetTargetCharacter.GetFaith.GetName]的研习进展顺利。我感觉自己拥有世界上所有的注意力和精力！"
 study_faith_ongoing.1000.desc.theologian: "我对[scheme.GetTargetCharacter.GetFaith.GetName]的研习进展顺利。显然他们的体系架构与其他信仰并非完全不同！"
 study_faith_ongoing.1000.desc: "\n\n“#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!”\n\n虽然我只是转述释义，细细考究经文字句的细微处，但感觉已经领会了信仰的真谛。\n\n如果能继续这般专注钻研，我很快便能洞悉[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]的全部隐秘要义！"
 study_faith_ongoing.1000.a: "我要将我#EMP 全部#!时间投入学习！"
 study_faith_ongoing.1000.b: "我宁愿把时间花到别处……"
 study_faith_ongoing.1010.t: "$study_faith$：心领神会"
 study_faith_ongoing.1010.desc: "#EMP “[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]”#!\n\n研读[scheme.GetTargetCharacter.GetFaith.GetAdjective]经典之际，我忽然察觉身旁有一双目光，抬头望去，只见[lover_target.GetFirstName]正含情脉脉俯身凝望。\n\n“你在研究关于[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]的典籍吗？”[lover_target.GetSheHe]轻声问道。\n\n“真没想到，宫廷中竟然还有同道之人，更何况还是[ROOT.Char.GetTitleTierName]大人！或许……我可以为你提供一些帮助？用更为……‘切身’的体悟？”"
 study_faith_ongoing.1010.a: "随我回寝室讨论吧，免得旁人打扰。"
 study_faith_ongoing.1010.b: "我只是在做你们这些[lover_target.Custom('GetDerogatoryNonbeliever')]的学问罢了，别想太多！"
 study_faith_ongoing.1010.c: "走开，[lover_target.Custom2('InsultNounSexual', ROOT.Char)]。我必须集中注意力！"
 study_faith_ongoing.1010.c.tt: "#EMP 你当着[lover_target.GetHerHis]的面关上房门，继续埋头研习#!"
 study_faith_ongoing.1011.t: "$study_faith$：错误的道路"
 study_faith_ongoing.1011.desc: "我的怀疑已经有一段时间了，在问了几个充满陷阱的问题之后，[scheme.GetTargetCharacter.GetTitledFirstNamePossessive]的谎言暴露无遗。与[scheme.GetTargetCharacter.GetSheHe]宣称的不同，[scheme.GetTargetCharacter.GetHerHis]对[scheme.GetTargetCharacter.GetFaith.GetName]的信仰并没有那么真诚！\n\n虽然看一出不信者上演的戏剧非常有趣，但要真正推进我对[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]的理解，也许我最好找到一名更虔诚的信徒……"
 study_faith_ongoing.1011.a: "我不能再指望[scheme.GetTargetCharacter.GetShortUINameNoTooltip]了。"
 study_faith_ongoing.1011.b: "既然[scheme.GetTargetCharacter.GetSheHe]能藏得这么好，也许我也可以……"
 study_faith_ongoing.1011.c: "好吧，那么[scheme.GetTargetCharacter.GetShortUINameNoTooltip]#EMP 到底#!信仰什么？"
 study_faith_ongoing.1011.c.tt: "我会尝试窥探[scheme.GetTargetCharacter.GetHerHis]的秘密信仰。"
 study_faith_ongoing.1012.t: "$study_faith$：古老礼仪的践行者"
 study_faith_ongoing.1012.desc: "我调查[scheme.GetTargetCharacter.GetTitledFirstNamePossessive]信仰的尝试取得了成功，虽然方式出乎我的意料。[scheme.GetTargetCharacter.GetSheHe]毫无疑问并不信仰[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]，但[scheme.GetTargetCharacter.GetSheHe]似乎追随了[actual_faith.GetName]的奇怪、被遗忘的礼仪。他们的实践无异于……巫术。\n\n这一发现让我震惊。我能利用这一点吗？"
 study_faith_ongoing.1012.a: "好吧……这确实#EMP 耐人寻味#!。"
 study_faith_ongoing.1012.b: "我需要一位新老师指导我的研习。"
 study_faith_ongoing.1012.b.tt: "你会尝试寻找一位类似的老师继续研习[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1012.c: "事实上，这可比[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]有说服力多了！"
 study_faith_ongoing.1012.c.tt: "你现在将研习[actual_faith.GetNameNoTooltip]"
 study_faith_ongoing.1013.t: "$study_faith$：虚有其表的伪信者"
 study_faith_ongoing.1013.desc: "我尝试探究[scheme.GetTargetCharacter.GetTitledFirstNamePossessive]所追随信仰的努力最终失败。在虔诚的外表之下，[scheme.GetTargetCharacter.GetHerHis]的世界观完全没有任何神学根基作为支撑。\n\n或许[scheme.GetTargetCharacter.GetSheHe]信奉[scheme.GetTargetCharacter.GetFaith.GetName]的教义准则，只是为了趋利避害、博取声望或者明哲保身？\n\n无论原因如何，显而易见，这个[scheme.GetTargetCharacter.GetWomanMan]对自己所宣称的信仰毫无真心与热忱。"
 study_faith_ongoing.1013.a: "浪费时间！我受够[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]了。"
 study_faith_ongoing.1020.t: "$study_faith$：本地信徒"
 study_faith_ongoing.1020.desc: "看来我研习[scheme.GetTargetCharacter.GetFaith.GetAdjective]的消息已经传到了[faith_helper.GetTitledFirstName]耳中。[faith_helper.GetSheHe|U]是一名本地信徒，因此提议帮助我研习。\n\n“我不求别的，只需要象征性给点奖励就行了，[ROOT.Char.Custom('FormOfAddressForLiege')]。”[faith_helper.GetSheHe|U]说道，[faith_helper.Custom('quirk_pos_pp')]。"
 study_faith_ongoing.1020.a: "如果你愿意帮忙，这些金子就是你的了。"
 study_faith_ongoing.1020.b: "一报换一报？"
 study_faith_ongoing.1020.c: "哦，你真是#EMP 太无私了#!，提出来要帮我，还免费！"
 study_faith_ongoing.1020.d: "多谢，但我能自己搞定。"
 study_faith_ongoing.1020.c.success: "你诱骗[faith_helper.GetFirstNameNoTooltip]来帮你"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip]一眼看穿了你的伎俩"
 study_faith_ongoing.1030.t: "$study_faith$：旧[scheme.GetTargetCharacter.GetFaith.ReligiousText|U]"
 study_faith_ongoing.1030.desc: "一个[chosen_peasant.GetWomanMan]带着贪婪的笑容找到了我。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，你真的在研习[scheme.GetTargetCharacter.GetFaith.GetName]？我父亲某次去[holy_site.GetNameNoTier]时带回了这本[scheme.GetTargetCharacter.GetFaith.ReligiousText]！”\n\n“我不识字，留着它也没用。我很乐意用它来换几个子儿。”"
 study_faith_ongoing.1030.a: "真巧啊。这些钱是你的了。"
 study_faith_ongoing.1030.b: "这玩意儿没你想的那么宝贵……"
 study_faith_ongoing.1030.b.flavor: "与这个小商贩谈价还价"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName]接受交易"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName]被你的出价侮辱了"
 study_faith_ongoing.1030.c: "卫兵，把这些异端文本从[chosen_peasant.GetHerHim]手中收缴。"
 study_faith_ongoing.1030.d: "骗子！滚蛋……"
 study_faith_ongoing.1040.t: "$study_faith$：赞美"
 study_faith_ongoing.1040.desc: "真是莫大的幸事！我接连收到来信，[target.GetTitledFirstName]对我潜心研习[scheme.GetTargetCharacter.GetFaith.GetAdjective]信仰奥义的举动大加赞誉。[target.GetSheHe|U]甚至称我为[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]信徒中钻研[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]最有造诣的人！\n\n我的努力得到了认可，感觉真好！"
 study_faith_ongoing.1040.a: "书吏！回信致以我的谢意。"
 study_faith_ongoing.1040.b: "[target.GetFirstNamePossessiveNoTooltip]对信仰的体悟，令我深受启发……"
 study_faith_ongoing.1040.c: "呸！只有#EMP 我自己#!才有资格认可我！"
 study_faith_ongoing.1050.t: "$study_faith$：蓄意破坏的气息"
 study_faith_ongoing.1050.desc: "我的笔记散落在书房各处，我记录[scheme.GetTargetCharacter.GetFaith.GetName]那些晦涩矛盾教义的研习笔记啊！数月心血被撕毁，窗边散落的纸页暗示，已有部分笔记被人掷出窗外。\n\n难道我要再次从零开始？！\n\n#EMP 嗅一嗅……#!这股令人生厌的气味是什么？乳香或是檀香，混杂着一丝……花香？这气味让我想起我那个[sabotage_rival.Custom2('InsultAdjective', ROOT.Char)][ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))]，[sabotage_rival.GetTitledFirstName]得意的嘴脸。正是[sabotage_rival.GetSheHe]试图毁去我的修习……"
 study_faith_ongoing.1050.a: "我的笔记……不！这么多工夫，白费了！"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip]#EMP 得死！#!"
 study_faith_ongoing.1050.c: "哈哈！我一直保留着#EMP 备份！#!"
 study_faith_ongoing.1060.t: "$study_faith$：曲解经文的无知"
 study_faith_ongoing.1060.desc: "为检验我对[scheme.GetTargetCharacter.GetFaith.ReligiousText|U]的研习进度，我向我信仰[scheme.GetTargetCharacter.GetFaith.GetAdjective]的[ROOT.Char.Custom2('RelationToMeShort', offended_character)]，[offended_character.GetTitledFirstName]，转述了典籍的章节释义：#EMP “[offended_character.GetFaith.PriestNeuter]当举起[target.Custom('GetAccessory')]，好使[target.Custom('FormOfAddressForLiege')]采摘[target.GetCurrentLocation.Custom('get_region_flower_type')]……”#!\n\n“你的解读简直荒谬至极！你不仅把我们的[offended_character.GetFaith.PriestNeuterPlural]形容得像一帮[offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))]人，更是将[offended_character.GetFaith.HighGodName]污蔑成[offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]！”\n\n看来我对[scheme.GetTargetCharacter.GetFaith.GetAdjective]信仰的细微之处领悟依然尚浅……"
 study_faith_ongoing.1060.a: "请收下这份薄礼，以表我的歉意。"
 study_faith_ongoing.1060.b: "我本意是赞颂[offended_character.GetFaith.PriestNeuter]们的德行！"
 study_faith_ongoing.1060.c: "你懂什么？！[offended_character.GetFaith.HighGodName]就是个#EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]烂货#!！"
 study_faith_ongoing.1060.d: "我只是想更透彻地理解[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]！"
 study_faith_ongoing.1060.b.success: "你哄骗[offended_character.GetHerHim]以为你在#EMP 奉承#![offended_character.GetHerHis]的[offended_character.GetFaith.PriestNeuterPlural]"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip]识破了你的谎言"
 study_faith_ongoing.1060.d.success: "你成功解释了这只是个误会"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip]不相信你"
 study_faith_ongoing.1070.t: "$study_faith$：污秽神话"
 study_faith_ongoing.1070.desc: "[target.GetTitledFirstNamePossessive]赠予的[scheme.GetTargetCharacter.GetFaith.GetAdjective]神话典籍，在宫廷中引发骚动。当我翻阅书卷，高声诵读最引人入胜的段落时，众人纷纷侧目。\n\n起初，我以为这是[ROOT.Char.GetFaith.EvilGodNames]对我耍了什么把戏，可细读其中几段露骨文字后才惊觉，这简直就是一本情色读物。\n\n神圣典籍之中，怎么会直白描写[scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive]的[ROOT.Char.Custom('ObjectifiedFeature')]？真是[ROOT.Char.Custom('CulturalCurse')|U]。"
 study_faith_ongoing.1070.a: "卫兵，把这本破书给我扔掉！"
 study_faith_ongoing.1070.b: "你们敢嘲笑我？！#EMP 全抓起来用鞭子抽。#!"
 study_faith_ongoing.1070.c: "好吧，我估计这本书#EMP 有#!一定的教育意义，从某种意义上来说……"
 study_faith_ongoing.1080.t: "$study_faith$：良师"
 study_faith_ongoing.1080.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', court_tutor)][court_tutor.GetFirstName]始终不遗余力地帮助我钻研[scheme.GetTargetCharacter.GetFaith.GetName]的教义细节。\n\n[court_tutor.GetHerHis|U]诲人不倦的治学之心令人敬佩！[court_tutor.GetSheHe]的手边常备[scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]典籍，还时常为我引荐博学的[scheme.GetTargetCharacter.GetFaith.PriestNeuter]与之探讨。\n\n真的，要是没有[court_tutor.GetHerHis]的帮助，我绝对理解不到这么深。"
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip]，你理应得到奖励！"
 study_faith_ongoing.1080.b: "[court_tutor.GetSheHe|U]出色地完成了[court_tutor.GetHerHis]的任务。"
 study_faith_ongoing.1090.t: "$study_faith$：难以理解！"
 study_faith_ongoing.1090.desc.intro: "[scheme.GetTargetCharacter.GetFaith.GetName]背后的神学理论令人难以捉摸！"
 study_faith_ongoing.1090.tenet.desc: "尤其是[discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )]这一条，我完全无法理解。"
 study_faith_ongoing.1090.doctrine.desc: "尤其是[discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )]，我完全无法理解。"
 study_faith_ongoing.1090.desc.main: "\n\n我的脑袋已经胀满了！一个念头刚挤进来，另一个就被挤出去，掉入遗忘的深渊。"
 study_faith_ongoing.1090.friend.desc: "\n\n“坚持下去，我[ROOT.Char.Custom('ComplimentAdjective')]朋友。我相信你！”\n\n幸运的是，[helpful_friend.GetTitledFirstName]总是在我身边，帮我理清这些陌生的教义。我真的很幸运。"
 study_faith_ongoing.1090.no_friend.desc: "\n\n也许我需要休息一下？"
 study_faith_ongoing.1090.a: "我总能依靠[helpful_friend.GetFirstNameNoTooltip]的指引！"
 study_faith_ongoing.1090.b: "无论有多抽象，我都必须坚持！"
 study_faith_ongoing.1090.c: "我只需要把书放下片刻……"
 study_faith_ongoing.1090.d: "这毫无希望！"
 study_faith_ongoing.1100.t: "$study_faith$：信[target.GetFaith.GetAdjectiveNoTooltip]的[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1100.desc: "关于我潜心研习[scheme.GetTargetCharacter.GetFaith.GetName]信仰的消息已然传开。\n\n他们现在称我为“信[target.GetFaith.GetAdjectiveNoTooltip]的[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]”，这个名号恐怕会引发不少误会……"
 study_faith_ongoing.1100.a: "一场巧妙的演说或许能安抚我的臣民与[target.GetFaith.GetAdherentNamePluralNoTooltip]！"
 study_faith_ongoing.1100.b: "研学是我自己的事，不能分心！"
 study_faith_ongoing.1100.c: "当然，[scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]一定能对我刮目相看！"
 study_faith_ongoing.1100.a.success: "你进行一场了不起的演讲"
 study_faith_ongoing.1100.a.success.tt: "所有信仰[root_scope.GetFaith.GetNameNoTooltip]或[target.GetFaith.GetNameNoTooltip]的廷臣与宾客"
 study_faith_ongoing.1100.a.failure: "你出丑了"
 study_faith_ongoing.1110.t: "$study_faith$：[target.GetFaith.GetAdjectiveNoTooltip]诗歌的魅力"
 study_faith_ongoing.1110.desc: "啊，《[poet_location.Custom('GetTerrainTypePlural')|U]的[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U]》，出自[poet_location.GetCounty.GetName]的诗人[the_poet.GetFirstName]之手——真是一部绝妙的[scheme.GetTargetCharacter.GetFaith.GetAdjective]诗集！\n\n#POE 《[ROOT.Char.Custom('GeneratePoem_Title')]》#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n也许诗歌正是窥见信仰的一扇天窗？"
 study_faith_ongoing.1110.a: "我将尝试创作[target.GetFaith.GetAdjectiveNoTooltip]的诗！"
 study_faith_ongoing.1110.b: "我或许该为我的[ROOT.Char.Custom2('RelationToMeShort', lover_to_be)][lover_to_be.GetFirstNameNoTooltip]吟诵一首#EMP 浪漫#!的诗歌？"
 study_faith_ongoing.1110.c: "我将分析这首诗的宗教性质。"
 study_faith_ongoing.1110.a.success: "你发现自己擅长写诗"
 study_faith_ongoing.1110.a.failure: "你的诗歌创作稍显拙劣"
 study_faith_ongoing.1120.t: "$study_faith$：异端传说"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n“堂堂[ROOT.Char.GetTitleTierName]，竟然在这研究异信仰的寓言故事？你难道不知羞耻吗？！”我的[ROOT.Char.Custom2('RelationToMeShort', zealot)][zealot.GetTitledFirstName]厉声斥责。\n\n“如果你的对头知道你亲近异端思想，一定会不择手段将你打成异端分子！”\n\n的确，[ROOT.Char.Custom('GetCourt')]里的庸碌之辈与仇视我的人，很可能会曲解我研读[scheme.GetTargetCharacter.GetFaith.GetAdjective]文本的举动。"
 study_faith_ongoing.1120.a: "不！这都是……#EMP 备受推崇的[target.GetFaith.GetAdjectiveNoTooltip]神学经典！#!"
 study_faith_ongoing.1120.b: "你竟敢指控我为异端？！让你见识下我的厉害！"
 study_faith_ongoing.1120.c: "你说得对。这类文本不适合[ROOT.Char.GetTitleTierName]。"
 study_faith_ongoing.1120.d: "随他们怎么想，这些著述足以带来启迪！"
 study_faith_ongoing.1120.a.success: "你成功哄骗了[zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a.failure: "你对异端读物的喜好迅速传开"
 study_faith_ongoing.1120.b.tt: "向[zealot.GetFirstName]发起挑战，与[zealot.GetHerHim]#V 决斗#!以惩罚[zealot.GetHerHis]的无礼！\n#weak 这次决斗不会决出生死。#!\n如果你获胜，会获得[prestige_i][prestige|E]和一个该[scheme|E]的[modifier|E]。如果你失败，会被奚落。\n\n你的[prowess|E]：[prowess_i]#V [root_for_loc.GetProwess]#!\n[zealot.GetFirstNamePossessive]的[prowess|E]：[prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "我与[zealot.GetFirstNameNoTooltip]的决斗已作废"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "“我认输！请原谅我，您绝非愚钝之人！饶我一命吧！”[zealot.GetTitledFirstName]大喊道。\n\n这下可让[zealot.GetHerHim]再也不敢侮辱#EMP 我#!了。"
 study_faith_ongoing.1123.a: "正如那只聪明的[ROOT.Char.Custom('GetAnimalType')|U]所言：“不要侮辱比你强的人！”"
 study_faith_ongoing.1123.b: "你会因为自己的无礼烂在地牢里！"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName]朝你躺在地上的位置旁边啐了一口。\n\n“你这软弱可悲的[ROOT.Char.GetTitleTierName]。现在我要帮你个忙，把这些愚蠢的书都清理掉。”[zealot.GetSheHe]说道。"
 study_faith_ongoing.1124.a: "学习中的挫折……"
 study_faith_ongoing.1130.t: "$study_faith$：信仰之悦"
 study_faith_ongoing.1130.desc: "“啊，我亲爱的[ROOT.Char.GetFirstNameNoTooltip]！你竟然真的在研习我所笃信的[scheme.GetTargetCharacter.GetFaith.GetName]？真高兴你愿意费心试着理解我！”[lover_to_help.GetTitledFirstName]说道，[lover_to_help.Custom('quirk_pos_pp')]。\n\n“我很乐意#EMP 倾尽所能#!为你提供帮助。”"
 study_faith_ongoing.1130.a: "我会接受任何我能得到的帮助！"
 study_faith_ongoing.1130.b: "我想到了一种最令人愉悦的求教方式。"
 study_faith_ongoing.1130.c: "我更喜欢一个人学习。"
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip]是一个优秀，但妖媚的老师"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip]只带你钻研信仰中小众且耽于情色的内容，你没能明白这些行为与信仰的关联"
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip]的帮助过于轻佻，根本帮不上忙。"
 study_faith_ongoing.1140.t: "$study_faith$：引导之手"
 study_faith_ongoing.1140.desc: "“我十分赞许你研习[scheme.GetTargetCharacter.GetFaith.GetName]的努力，这一定能巩固你身为[ROOT.Char.GetTitleTierName]的地位！”我的[SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))][close_one_to_help.GetFirstName]由衷说道。\n\n“我自幼便熟悉[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]的教义仪轨。我的[SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]，或许我能为你指点一二？”"
 study_faith_ongoing.1140.a: "你能帮我理解这条教义吗？"
 study_faith_ongoing.1140.b: "你要一同参与我的研学功课吗？"
 study_faith_ongoing.1200.t: "$study_faith$：异教忠犬"
 study_faith_ongoing.1200.desc: "在我努力学习[scheme.GetTargetCharacter.GetFaith.GetName]教义的过程中，我记了大量笔记，毕竟光靠脑子可记不下这么多繁杂的细节。啊呀！但是当我需要它们的时候，却怎么都找不到了！\n\n正烦闷间，熟悉的湿凉鼻尖蹭上了我的手心，原来是[ROOT.Char.Custom('DogStoryName')]。我下意识低头看向它，本想借这份陪伴稍稍平复心绪。\n\n只见它摇着尾巴，得意地看着我。直到这时，我才意识到，它嘴里正紧紧叼着我的笔记……"
 study_faith_ongoing.1200.a: "我不可能一直生你的气！"
 study_faith_ongoing.1200.b: "你想出去遛一圈？那走吧。"
 study_faith_ongoing.1200.c: "那可不是个玩具！#EMP 坏#!狗！"
 study_faith_ongoing.1300.t: "$study_faith$：实践出真知"
 study_faith_ongoing.1300.desc: "当我们途经[ROOT.Char.GetCurrentLocation.GetTitle.GetName]时，当地民众似乎正进行着一场[scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]庆典。尽管我们是[ROOT.Char.GetFaith.GetAdherentNamePlural]，一个[interlocutor.GetWomanMan]还是向我们走来，邀请我们一同参与。\n\n我的随从试图挡在我们中间，担心这可能是个陷阱。\n\n去他的危险。我几乎想不出比这更好的机会，能让我亲身了解[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]了！"
 study_faith_ongoing.1300.a: "带路吧！"
 study_faith_ongoing.1300.a.flavor: "只是个小小的[scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]仪式，能有什么害处？"
 study_faith_ongoing.1300.b: "就[interlocutor.GetHerHis]的信仰细节展开讨论，肯定会最有启发性。"
 study_faith_ongoing.1300.b.flavor: "你尝试与[interlocutor.GetFirstNameNoTooltip]进行友好的辩论"
 study_faith_ongoing.1300.b.success: "你与[interlocutor.GetFirstNameNoTooltip]进行了愉快的辩论"
 study_faith_ongoing.1300.b.failure: "你未能与[interlocutor.GetFirstNameNoTooltip]沟通"
 study_faith_ongoing.1300.c: "“加入我们一起前往[next_destination.GetNameNoTooltip]吧！”"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "飞蛾不解星象文理，仍自趋向萤火；灵魂不必识祂名号，也可为祂吞没。"
 holy_text_indeterminate_quote_2: "风沙只将暴君的足迹抹去，沙土只记下口渴者与善者的脚印。"
 holy_text_indeterminate_quote_3: "流水不拣选磨光的石头，只以长久冲刷，使它们都琢磨成器。"
 holy_text_indeterminate_quote_4: "饮于知识之泉者，必先躬身俯首。"
 holy_text_indeterminate_quote_5: "那日，大山俯首，非向君王，非向军队，只向那胆敢发问的孩童。"
 holy_text_indeterminate_quote_6: "隐者先以怀疑的轻声开口，如此当你终于回应时，信德是出于自己的。"
 holy_text_indeterminate_quote_7: "凡在祭坛前许下的谎言，必将化作烟气消散；凡是诚心的眼泪，必萌而生实，落入天国的花园。"
 holy_text_indeterminate_quote_8: "不必怨叹前路的晦暗，正是暗夜让你的灯火学得燃烧。"
 holy_text_indeterminate_quote_9: "祂的光辉不理会骄傲者的祈祷，只记下无人看顾时默默施行的慈悲。"
 holy_text_indeterminate_quote_10: "世界被人分作‘你’和‘我’，神只付之一笑——祂眼中本只有‘我们’。"
