l_simp_chinese:
 influence_house_ambition_ongoing.1001.tt: "倾听的耳朵"
 influence_house_ambition_ongoing.1001.desc: "如果我能在[target.GetFirstNamePossessive]的商会找到一只善于倾听的耳朵，也许有助于影响[target.GetHerHis]的观点，让[target.GetHerHim]以我的视角看待事情。\n\n我最好选择一个说话好听且善于言谈的人。要是长得好看就更棒了。\n\n在谨慎地询问了[target.GetFirstNamePossessive]的廷臣后，我找到了两名候选者：[target_associate_01.GetFirstName]和[target_associate_02.GetFirstName]。"
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip]是个好选择。"
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip]也许能被[target_associate_02.GetHerHis]的主人理解。"
 influence_house_ambition_ongoing.1001.c: "不用。单凭我的话就足够了。"
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip]代你提出了令人信服的论据"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip]未能提出好的论据"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip]代你提出了令人信服的论据"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip]未能提出好的论据"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "想要金钱回报。"
 influence_house_ambition_ongoing.1001.cooltip.relation: "不要求任何回报。"
 influence_house_ambition_ongoing.1001.cooltip.lewd: "建议“替代”奖励。"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "想要人情作为回报。"
 influence_house_ambition_ongoing.1002.tt: "艰难的谈判"
 influence_house_ambition_ongoing.1002.desc: "我开始怀疑[target.GetFirstName]是否有认真和我交流。我只听到含糊的承诺、拖延和无休止的争辩。\n\n是时候表达我的不满了。也许不需要太直接，但得让[target.GetFirstName]明白，让我这样的[ROOT.Char.GetTitleAsNameNoTooltip]不高兴是有后果的！"
 influence_house_ambition_ongoing.1002.a: "破坏[target.GetHerHis]的商业利益。"
 influence_house_ambition_ongoing.1002.b: "派暴徒埋伏，痛殴[target.GetHerHis]的廷臣。"
 influence_house_ambition_ongoing.1002.c: "去[target.GetHerHis]家里放一把火。"
 influence_house_ambition_ongoing.1002.d: "我会教教[target.GetHerHim]什么是恐怖！"
 influence_house_ambition_ongoing.1002.e: "我会再耐心一会。"
