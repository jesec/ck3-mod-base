l_simp_chinese:
 religious_interaction.1.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.desc: "经过多次祈祷和深思熟虑，我决定批准你与你[secondary_recipient.GetWifeHusband]，[secondary_recipient.GetFirstNameNoTooltip]离婚的请求，"
 religious_interaction.1.consanguinity: "基于血亲婚姻的理由。"
 religious_interaction.1.fallback: "基于疑似通奸的理由。"
 religious_interaction.1.adultery: "基于通奸的理由。"
 religious_interaction.1.different_faith: "基于其信奉敌对宗教的理由。"
 religious_interaction.1.eunuch: "基于其作为[secondary_recipient.GetWomanMan]但不能人事的理由。"
 religious_interaction.1.a: "对不起，[secondary_recipient.GetFirstNameNoTooltip]。"
 religious_interaction.1.price_feud: "\n\n然而，此举恐怕无法真正将你二人彻底斩断为两不相干的陌路，不是吗？正因如此，我已以你的名义，向[secondary_recipient.GetHouse.GetName]全族传发了针对[secondary_recipient.GetFirstName]的恶毒指控。\n\n那位身[actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))]的族人，如今似乎对一场……#EMP 永久的#!分别颇感兴趣。"
 religious_interaction.1.price_lease: "\n\n这一虚假的宣告自有其代价：[barony_to_lease.GetName]将被租赁给[lease_order.GetName]。倘若你果真如你弃绝你的[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]那般，也弃绝了这些信仰的仆从……那你的灵魂便将蒙受双重的污损。"
 religious_interaction.1.price_hook: "\n\n请你思量，你那位[recipient.GetTitleAsName]以这番可疑的宣告为你谋得了何等恩惠。也请思量：施与受，皆为善举。"
 religious_interaction.1.price_vows: "\n\n这些理由实属牵强……正因如此，我已备妥证据，证明[secondary_recipient.GetFirstNameNoTooltip]在成为你的[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]之前，早已立下成为一名[joining_order_title.GetAdjective][secondary_recipient.Custom('SisterBrother')]的誓言。\n\n我必将亲自确保[secondary_recipient.GetHerHis]至死恪守此等虔敬。"
 religious_interaction.1.price_none: "\n\n此事当然是一场闹剧，一桩玷污了我灵魂的卑劣交易。然而凭着良知，我再也无法容忍你与[secondary_recipient.GetFirstNameNoTooltip]继续同床共枕。"
 religious_interaction.1.a_feud: "你这邪恶的[recipient.GetFaith.PriestNeuter]！你做了什么？！"
 religious_interaction.1.a_hook: "摆脱了[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]……却又被[recipient.GetTitleAsNameNoTooltip]所累。"
 religious_interaction.6.price_feud: "\n\n然而，此举恐怕无法真正将二人彻底斩断为两不相干的陌路，不是吗？正因如此，我已以[actor.GetFirstNamePossessiveNoTooltip]的名义，向[secondary_recipient.GetHouse.GetName]全族传发了针对[secondary_recipient.GetFirstName]的恶毒指控。\n\n[actor.GetHerHis|U]那位身为[actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))]的族人，如今似乎对一场……#EMP 永久的#!分别颇感兴趣。"
 religious_interaction.6.price_lease: "\n\n这一虚假的宣告自有其代价：[barony_to_lease.GetName]将被租赁给[lease_order.GetName]。倘若[secondary_recipient.GetFirstNameNoTooltip]果真如你弃绝[actor.GetHerHis]的[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]那般，也弃绝了这些信仰的仆从……那[actor.GetHerHis]的灵魂便将蒙受双重的污损。"
 religious_interaction.6.price_hook: "\n\n请你思量，你那位[recipient.GetTitleAsName]以这番可疑的宣告为你谋得了何等恩惠。也请思量：施与受，皆为善举。"
 religious_interaction.6.price_vows: "\n\n这些理由实属牵强……正因如此，我已备妥证据，证明[secondary_recipient.GetFirstNameNoTooltip]在成为[actor.GetFirstNamePossessiveNoTooltip]的[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]之前，早已立下成为一名[joining_order_title.GetAdjective][secondary_recipient.Custom('SisterBrother')]的誓言。\n\n我必将亲自确保[secondary_recipient.GetHerHis]至死恪守此等虔敬。"
 religious_interaction.6.price_none: "\n\n此事当然是一场闹剧，一桩玷污了我灵魂的卑劣交易。然而凭着良知，我再也无法容忍[actor.GetFirstNameNoTooltip]与[secondary_recipient.GetFirstNameNoTooltip]继续同床共枕。"
 religious_interaction.2.desc: "深思熟虑之后，我决定为了我们家族最大的利益，批准你与你[secondary_recipient.GetWifeHusband]，[secondary_recipient.GetFirstNameNoTooltip]离婚的请求，"
 religious_interaction.2.infertility: "基于其拒绝圆房的理由。"
 religious_interaction.2.adultery: "基于其与他人交媾，亵渎婚姻神圣性的理由。"
 religious_interaction.3.desc_subordinate: "作为[actor.GetFaith.HighGodNamePossessive]在地上所有信众的代表，我批准你的请求。"
 religious_interaction.3.desc: "我考虑到你的困境，决定批准你请求。"
 religious_interaction.3.defensive_war: "愿这些资金帮助你守卫信仰，不受[war_target.GetTitledFirstName]和[war_target.GetHerHis]的[war_target.GetFaith.GetAdjective]大军入侵！"
 religious_interaction.2.offensive_war: "愿这些资金为你针对[war_target.GetTitledFirstName]的战争带来胜利！"
 religious_interaction.3.fallback: "愿这些资金帮助你在你的领土上传播正信！"
 religious_interaction.3.a: "赞颂[ROOT.Char.GetFaith.WealthGodName]，退税到账了！"
 religious_interaction.3.b: "这些资金会为我带来胜利！"
 religious_interaction.3.c: "我会善用这笔财富。"
 religious_interaction.3.d: "这些金钱能充实我枯竭的金库！"
 religious_interaction.32.desc: "经过考虑之后，我决定拒绝你的请求。"
 religious_interaction.32.a: "哦，不！"
 religious_interaction.4.desc: "我已考虑你的请求，决定承认你对于[target.GetName]的宣称。"
 religious_interaction.4.child: "因为[secondary_recipient.GetTitledFirstName]只是小孩，你有权介入。"
 religious_interaction.4.they_are_female: "因为[secondary_recipient.GetTitledFirstName]是女人，你有权介入。"
 religious_interaction.4.they_are_male: "因为[secondary_recipient.GetTitledFirstName]是男人，你有权介入。"
 religious_interaction.4.fallback: "发现了无可辩驳的证据，你的祖先确实曾经在古时统治这片土地。"
 religious_interaction.4.a: "我会证明我才是正当统治者！"
 religious_interaction.42.desc: "经过考虑之后，我决定拒绝你对[target.GetName]宣称的请求。"
 religious_interaction.42.a: "该死！"
 religious_interaction.5.child: "因为你尚未成年，"
 religious_interaction.5.they_are_female: "因为你的女性身份，"
 religious_interaction.5.they_are_male: "因为你的男性身份，"
 religious_interaction.5.fallback: "因为你明显缺乏虔诚，"
 religious_interaction.5.outro: "让教会非常担忧，"
 religious_interaction.5.outro_different_recipient: "应[actor.GetName]请求，我已授予[actor.GetHerHis]对[target.GetName]的宣称权。"
 religious_interaction.5.self: "我决定行使我对[target.GetName]的宣称权，这是我的正当权利。"
 religious_interaction.5.a: "这是歪曲！"
 religious_interaction.6.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.desc: "经过多次祈祷和考虑，我决定满足你的请求，允许[secondary_actor.GetFirstNameNoTooltip]与[secondary_recipient.GetFirstNameNoTooltip]离婚，"
 religious_interaction.6.consanguinity: "基于血亲婚姻的理由。"
 religious_interaction.6.fallback: "基于疑似通奸的理由。"
 religious_interaction.6.adultery: "基于通奸的理由。"
 religious_interaction.6.different_faith: "基于其信奉敌对宗教的理由。"
 religious_interaction.6.eunuch: "基于其作为[actor.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]但不能人事的理由。"
 religious_interaction.6.a: "[actor.GetFirstNameNoTooltip]和[secondary_recipient.GetFirstNameNoTooltip]之间已经结束了。"
 religious_interaction.1001.t.fatwa: "签发法特瓦！"
 religious_interaction.1001.t: "教法谴责！"
 religious_interaction.1001.desc: "我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))][actor.GetTitledFirstName]在[actor.GetHerHis]的[actor.GetFaith.PriestNeuterPlural]发布的令状上看到了我的名字，我被判为罪人！\n\n这能作为法律依据，判定我不适合统治[recipient.GetFaith.GetAdjective]的土地。"
 religious_interaction.1001.a: "如果[actor.GetSheHe]不是我的领主，我就会……"
 religious_interaction.1001.a.revoke_tt: "[actor.GetTitledFirstName]可以[revoke|E]我的一个头衔"
 #Religious Head of Faith Interactions
 religious_interaction.1010_subordinate: "作为你在至圣之[actor.GetFaith.GetAdjective]耳畔、至虔之[actor.GetFaith.GetAdjective]心前的代祷者，我现将你从罪孽的重负中解脱，赐予你赦免。\n\n你慷慨的捐赠已为你赢得了宽恕。"
 religious_interaction.1010: "你想要赎罪，这值得称道。我接受你的慷慨捐赠，作为回报，送给你我的祝福。"
 religious_interaction.1011: "你的劣迹太过严重，远超金钱所能挽回的程度。如果你真的想要赎罪，你必须改弦更张，向我证明你真的想要获得原谅。那时我才会接受的你捐赠。"
 religious_interaction.excommunication.opening: "[excommunication_issuer.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1020: "我从[actor.GetTitledFirstName]听到了关于你劣迹的忧虑消息。"
 religious_interaction.1020.requested: "我已从[actor.GetTitledFirstName]处听闻了关于你恶行的令人不安的报告。在[actor.GetHerHis]的敦促下，[recipient.GetFaith.GetAdjective]信仰的教会已决定将你绝罚。\n\n愿[recipient.GetFaith.HighGodName]怜悯你的灵魂。"
 religious_interaction.1020.sin: "来自[actor.GetTitledFirstName]的令人不安的报告印证了你的[my_sinful_trait.GetName( ROOT.Char )]本性。在[actor.GetHerHis]的敦促下，[recipient.GetFaith.GetAdjective]信仰的教会已决定将你绝罚。\n\n愿[recipient.GetFaith.HighGodName]怜悯你的灵魂。"
 religious_interaction.1020.empire: "你对帝冠的宣称已经分裂了[recipient.GetFaith.GetAdjective]信仰。在[actor.GetTitledFirstNamePossessive]的敦促下，我已决定对你施以绝罚。"
 religious_interaction.1020.a.tt_petition: "#help 获得[piety|E]。一年后，亲自向你的[head_of_faith|E]请愿，并选择#high $petition_head_of_faith_decision_option_repentance$#!。查看[Concept( 'excommunicated_recovery', '恢复选项' )|E]。#!"
 religious_interaction.1020.a.tt_declaration: "#help 获得[piety|E]。一年后，对一名有效神职人员使用#high $declaration_of_repentance_interaction$#!。查看[Concept( 'excommunicated_recovery', '恢复选项' )|E]。#!"
 religious_interaction.1020.a: "我将接受我的补赎，并寻求赦免。"
 religious_interaction.1020.b: "该死的[actor.GetFirstNameNoTooltip]！"
 religious_interaction.1020.b.tt: "#help 失去[stress|E]。与[actor.GetShortUIName]更接近成为[rivalry|E]。#!"
 religious_interaction.1020.c: "该死的[recipient.GetTitleAsNameNoTooltip]竟听从了[actor.GetHerHim]！"
 religious_interaction.1020.c.tt: "#help 失去[stress|E]。与[recipient.GetShortUIName]更接近成为[rivalry|E]。[GetTrait('cynical').GetName( GetNullCharacter )]、[GetTrait('wrathful').GetName( GetNullCharacter )]和[GetTrait('arbitrary').GetName( GetNullCharacter )][courtiers|E]认可。#!"
 religious_interaction.1021.generic: "我们都可能犯错，因我们生而有罪。然而可叹的是，在你身上，我甚至看不到任何尝试行走于基督道路的迹象。"
 religious_interaction.1021.empire: "在这末世之时，你将你的野心置于基督教世界的存亡之需上。你对帝冠的宣称，乃是教会肌体上的一枚毒疮！"
 religious_interaction.1021.clergy_hostility: "我们之间的敌意并非秘密。然而将你绝罚的原因，乃是你对罪孽的贪恋，以及你的顽固不化。"
 religious_interaction.1021.sin: "你那[my_sinful_trait.GetName( ROOT.Char )]的本性早已是众人皆知。我绝不能允许你成为将羊群引向歧途的恶劣典范。"
 religious_interaction.1021.conclusion: "\n\n你已被[actor.GetFaith.GetAdjective]信仰的教会所绝罚。愿[actor.GetFaith.HighGodName]怜悯你的灵魂。"
 religious_interaction.1021.a: "我服从教会的裁决。"
 religious_interaction.1021.b: "我的帝冠由[recipient.GetFaith.HighGodName]所授，而非[actor.GetTitleAsNameNoTooltip]！"
 religious_interaction.1021.b.tt: "#help 失去[stress|E]。与[actor.GetShortUIName]更接近成为[rivalry|E]。[GetTrait('cynical').GetName( GetNullCharacter )]、[GetTrait('wrathful').GetName( GetNullCharacter )]和[GetTrait('arbitrary').GetName( GetNullCharacter )][courtiers|E]认可。#!"
 religious_interaction.1022: "我为你讲述的关于[secondary_recipient.GetTitledFirstNamePossessive]劣迹的事情而忧虑。如此做会我感到痛苦，但我同意，为了[actor.GetFaith.GetAdjective]信仰，必须绝罚[secondary_recipient.GetSheHe]。"
 religious_interaction.1022.toast_puppeteer: "[recipient.GetShortUIName]同意了[puppet_or_actor.GetShortUINamePossessive]的绝罚请求"
 religious_interaction.1023: "你意图让[actor.GetFaith.GetAdherentName]同胞受绝罚，是想要做什么？[actor.GetFaith.GetAdjective]信仰不是用于获得政治利益的工具！你应该感到幸运，因为我没有因为这个请求而绝罚你。 "
 religious_interaction.1023.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]的绝罚请求"
 religious_interaction.1024: "我观察到你确实为你的罪而悔改了，为了救赎你自己而做了许多努力。尽管你对于[actor.GetFaith.GetAdjective]信仰的过犯确实严重，你近来的行为使我相信你应该获得第二次机会。\n\n有鉴于此，我于兹免除你的绝罚，欢迎你回归[actor.GetFaith.GetAdjective]信仰。"
 religious_interaction.1024.toast_puppeteer: "[recipient.GetShortUIName]撤销了[puppet_or_actor.GetShortUINamePossessive]的绝罚"
 religious_interaction.1025: "你觉得我会轻易绝罚人吗？你觉得半真半假的歉意就足以弥补吗？你尽管请求；你不会被允许回到[actor.GetFaith.GetAdjective]信仰，直到你证明你改变了自己的卑劣行径。"
 religious_interaction.1025.toast_puppeteer: "[recipient.GetShortUIName]拒绝撤销[puppet_or_actor.GetShortUINamePossessive]的绝罚"
 religious_interaction.1030: "深思熟虑之后，我得出结论，你的话语是真实而智慧的。我会加入隐修会，开始独自侍奉[actor.GetFaith.HighGodName]的新生活。"
 religious_interaction.1031: "你好意劝我立下神圣誓言，我倍感荣幸。但我相信[recipient.GetFaith.HighGodName|U]对我的人生另有安排。我的内心与良知都不允许我许下这份誓言。"
 religious_interaction.1031.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]誓发终身愿的要求"
 religious_interaction.1000.positive: "我很高兴[recipient.GetFirstNameNoTooltip]能体会到我请求中的智慧。"
 religious_interaction.1000.negative: "真不幸……"
 religious_interaction.1000.strong_negative: "该死！"
 religious_interaction.1024.positive: "[recipient.GetFirstNameNoTooltip]这次行事明智，我很欣慰。"
 religious_interaction.2002.desc: "我已决定追随你加入光明，改宗[ROOT.Char.GetFaith.GetName]！"
 religious_interaction.2002.toast_puppeteer: "[recipient.GetShortUIName]接受了[puppet_or_actor.GetShortUINamePossessive]的改信要求"
 religious_interaction.2002.a: "赞美[ROOT.Char.GetFaith.HighGodName]！"
 religious_interaction.2003.desc: "我有强大的信心，不会被你尘世的言语动摇。我更想要在[recipient.GetFaith.DivineRealm]中获得我的赏报。"
 religious_interaction.2003.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]的改信要求"
 religious_interaction.2003.hooking_out: "\n\n我也想提醒你，你欠我这一次，最好不要仅仅因为我是真正的信徒就迫害我。"
 religious_interaction.2003.a: "我只是为你的救赎着想。"
 religious_interaction.2003.b: "好吧，你会在这个世界付出代价！"
 religious_interaction.2003.c: "别以为我会让你逃掉这一次！"
 religious_interaction.2003.d: "哦，我以为你会按我说的做。"
 religious_interaction.2011.desc: "我很乐于与你同喜，但翻新[recipient.GetFaith.HouseOfWorshipPlural]和在我的农民中传教的大量成本……\n\n如果你帮助我支付这些花费，我会更乐意向你的[ROOT.Char.GetFaith.HighGodName]祈祷。"
 religious_interaction.2011.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]的要求，除非其支付金钱"
 religious_interaction.2011.a: "一切为了信仰。"
 religious_interaction.2011.b: "我不会为了你的永恒救赎而付钱！"
 religious_interaction.2011.c: "你会为了比金钱更有价值的东西而行动。"
 religious_interaction.2012.desc: "我感受到你信仰的智慧，但我希望你明白从黑暗中进入光明需要经过怎样漫长而曲折的道路。\n\n也许如果你承诺在我有需求的任何方面支持我，这趟旅程会更加容易。"
 religious_interaction.2012.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]的要求，除非其给予人情"
 religious_interaction.2012.a: "我接受，为了信徒在各处的利益。"
 religious_interaction.2012.b: "我不会为你的灵魂讨价还价！"
 religious_interaction.2012.c: "首先，你还有其他债没还我。"
 religious_interaction.2015.desc: "[actor.GetRite.GetName]显然已为你带来了力量。我希望能更好地理解你从[actor.GetFaith.HighGodName]那里所获得的权能。"
 religious_interaction.2015.toast_puppeteer: "[recipient.GetShortUIName]要求[puppet_or_actor.GetShortUIName]在其研习信仰时等待"
 religious_interaction.2015.a: "我将教导你[actor.GetFaith.GoodGodNames]之道。"
 religious_interaction.2015.b: "今日你要向[actor.GetFaith.GoodGodNames]俯首！"
 religious_interaction.2015.c: "或许通过实践，你才能学得最好。"
 religious_interaction.2016.desc: "依照你的请求，你可在我的监督之下研习[actor.GetFaith.GoodGodNames]的教义。"
 religious_interaction.2016.a: "让我们开始吧。"
 religious_interaction.2016.a.tt: "你会开始对[actor.GetShortUINameNoTooltip][GetScheme('study_faith').GetTypeName]。"
 religious_interaction.2021.opening: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2021.desc: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]\n你是时候与我一同加入光明了，我的[puppet_or_actor.Custom2('RelationToMe', SCOPE.sC('recipient'))]。考虑你欠我的东西，我要求你改信[puppet_or_actor.GetFaith.GetName]！"
 religious_interaction.2021.a: "我……好吧，我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('puppet_or_actor'))]。"
