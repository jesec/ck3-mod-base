l_simp_chinese:
 holy_order_hired_message: "已雇佣军事修会"
 holy_order.hired_message: "[actor.GetUIName]已召集了[holy_order.GetName]"
 holy_order_hired_by_enemy_message: "敌方军事修会"
 holy_order.hired_by_enemy: "[holy_order.GetName]已被[actor.GetUIName]召集，现在与我们为敌"
 holy_order.destroyed_message: "[title.GetName]已被摧毁"
 holy_order_expanded: "军事修会扩张"
 holy_order.new_lease: "[holy_order.GetName]现在从[former_holder.GetTitledFirstName]处租借了[barony.GetName]"
 monastic_holy_order_expanded: "隐修修会扩张"
 holy_order.0001.t: "军事修会"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U]等着与我告别，[recipient.GetHerHis]已经准备好了随从和行李。\n\n"
 holy_order.0001.desc_demand: "“这倒也算死得其所……”[recipient.GetSheHe]低声嘟囔道，“死在为夺取这片陌生异教徒的土地的路上。我还以为我会为[actor.GetPrimaryTitle.GetNameNoTier]战死呢……”\n\n[recipient.GetSheHe|U]翻身上马，问道：“我该去哪儿？”"
 holy_order.0001.desc: "“那么，[ROOT.Char.Custom('FormOfAddressForLiege')]，我的心与剑要服务于哪个修会呢？”"
 holy_order.0001.desc_relation: "“我的利剑早已渴望撕裂异教徒的肮脏皮囊，[recipient.Custom2('RelationToMeShort', ROOT.Char)]！可我该奔赴何处，又有谁能成为我并肩的[recipient.Custom('SisterBrother')]？”"
 holy_order.0001.a: "你要加入[holy_order_1.GetName]。"
 holy_order.0001.b: "你将属于[holy_order_2.GetName]。"
 holy_order.0001.c: "[holy_order_3.GetName]会容纳你。"
 holy_order.0001.d: "现在你是[holy_order_4.GetName]的麻烦了。"
 holy_order.0001.e: "我犯了个错误——你属于这里！"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName]接受了[puppet_or_actor.GetShortUINamePossessive]加入军事修会的召唤"
 holy_order.0002.desc_angry: "我已念出神圣之言，正如你的意志加诸我一般，如今我已与[ROOT.Char.GetFaith.HighGodName]同在。"
 holy_order.0002.desc: "我愿意回应圣召，侍奉更高的存在，我感谢你让我走上了正义的道路。"
 holy_order.0002.a_demand: "很好。现在静候[ROOT.Char.GetFaith.PositiveAfterLife]吧。"
 holy_order.0002.a: "我相信你会好好侍奉[ROOT.Char.GetFaith.HighGodName]！"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName]应[puppet_or_actor.GetShortUINamePossessive]的请求立下誓言"
 char_interaction.0001.opening_low_piety: "你是个[ROOT.GetCharacter.Custom('GetSinfulShameful')]的生灵，匍匐至侍奉[ROOT.Char.GetFaith.HighGodName]的神圣教团跟前……在担忧你的世俗财富之前，先想想怎么赎回你的灵魂吧。"
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "我听说你需要钱，[order.GetName]可以满足你。"
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName]向我微笑！"
 holy_order.0200.b: "但……但是我需要这些钱！"
 holy_order.0202.second_time: "我再提醒你一次，你欠我的组织#bold [ROOT.Var('loan_amount_owed').GetValue|0]#!金币。"
 holy_order.0202.opening: "你欠我的组织#bold [ROOT.Var('loan_amount_owed').GetValue|0]#!金币。"
 holy_order.0202.desc: "如果你不还钱，我们会为你找其他方式来偿还——[ROOT.Char.GetFaith.HighGodName]可以接受的方式，但你就未必了。"
 holy_order.0202.a: "我当然会遵守我们的协议。"
 holy_order.0202.a_no: "我会还的！只要让我找到钱……"
 holy_order.0202.a._not.tt: "@warning_icon! #X [gold_i][gold|E]不足#!"
 holy_order.0202.b_christian: "耐心不是一种美德吗？"
 holy_order.0202.b: "我们都是虔诚的信徒……请给我更多时间！"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip]会再给你5年时间"
 holy_order.0202.c: "也许我们能找到其他偿还方式……？"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip]会对你有所求#!"
 holy_order.0202.d: "这些钱在我手中更有用！"
 holy_order.0203.desc: "我可看不惯那些食言的人，[ROOT.Char.GetFaith.HighGodNameAlternate]同样如此。为了纠正这次的藐视，你要将[province.GetName]交给我们，这样我们可以进一步为[ROOT.Char.GetFaith.HighGodNamePossessive]效命。"
 holy_order.0203.a: "当然，[province.GetNameNoTierNoTooltip]会是你们的。"
 holy_order.0203.b: "如此荒谬的要求！"
 holy_order.0204.desc: "我可看不惯那些食言的人，[ROOT.Char.GetFaith.HighGodNameAlternate]同样如此。为了纠正这次的藐视，你要将你的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))][child.GetTitledFirstName]送来我们这里，为[ROOT.Char.GetFaith.HighGodNamePossessive]效命。"
 holy_order.0204.a: "我会送[child.GetHerHim]……我会送[child.GetHerHis]去的。"
 holy_order.0204.a.tt: "你将不再欠骑士团任何金钱"
 holy_order.0205.desc: "关于贷款的所有事情都是你贪婪的可耻表现。我会让[ROOT.Char.GetFaith.ReligiousHeadName]知道这些的！"
 holy_order.0205.a: "该死！"
 holy_order_letter.opening: "同为[ROOT.Char.GetFaith.HighGodNameAlternate]之仆者，"
 holy_order.1001.intro: "热忱的灵魂们正纷纷涌向[holy_order.GetName]，准备为[ROOT.Char.GetFaith.GetAdjective]信仰献出他们凡俗的血肉之躯。我们需要更多的土地来驻扎我们的[GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]。"
 holy_order.1001.end: "\n\n[target_barony.GetName]完美符合这一目标，能否将其租赁给我们，以服务于我们神圣的事业？"
 holy_order.1001.a: "批准你的请求。为了[ROOT.Char.GetFaith.HighGodName]！"
 holy_order.1001.b: "[alternative_barony.GetNameNoTierNoTooltip]会不会也能满足你的要求？"
 holy_order.1001.c: "不，我不会赐予你这片土地。"
 holy_order.1011.intro: "在[target_barony.GetName]还有不少良田需要耕种，还有一座不错的[grandmaster.GetFaith.HouseOfWorship]，正适合由我的[grandmaster.Custom('SistersBrothers')]建立修道院来侍奉。"
 holy_order.1011.end: "\n\n你愿意做我们的中间人，让[holy_order.GetName]在那里建一座修道院吗？"
 holy_order.1011.a: "修会可以租赁[target_barony.GetNameNoTierNoTooltip]。"
 holy_order.1011.b: "[alternative_barony.GetNameNoTierNoTooltip]真有宁静吗？"
 holy_order.1011.c: "恐怕你必须将你的[grandmaster.Custom('SistersBrothers')]派往别处。"
 holy_order.2001.t: "神圣的意图"
 holy_order.2001.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))][child.GetFirstName]来找我，我很快发现[child.GetSheHe]要讨论一些非常严肃的事情。\n\n“[ROOT.Char.Custom('MotherFather')|U]，我在这里永远生活在别人的阴影之下。让我加入[holy_order.GetName]，侍奉[child.GetFaith.HighGodName]。我已经想清楚了，这就是我想要做的。”"
 holy_order.2001.a: "让[child.GetFaith.HighGodNameAlternate]指引你，我的[child.Custom('DaughterSon')]。"
 holy_order.2001.b: "虽然可能没那么伟大，但我在这里对你也有计划。"
 holy_order.2002.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))][sibling.GetTitledFirstName]告诉了我[sibling.GetHerHis]的计划，[sibling.GetSheHe]显然已经考虑了很长时间。\n\n“留在这里没什么意义，而如果我想要效忠某人，我宁愿效忠于[sibling.GetFaith.HighGodName][sibling.GetFaith.HighGodHerselfHimself]自身。我打算加入[holy_order.GetName]。”"
 holy_order.2002.a: "我理解你的选择，[sibling.Custom('SisterBrother')]。"
 holy_order.2002.b: "哦，你绝对#EMP 不能#!那样做！"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "总是需要真正的战士遏止对于[grandmaster.GetFaith.GetAdjective]信仰的任何威胁。\n我相信你的[child.Custom('DaughterSon')]，[child.GetTitledFirstName]，天资聪颖却继承无望，若在[holy_order_scope.GetName]中服务，能活得更为出色。[child.GetSheHe]将与我们一同训练，学习，大大光荣你的名字。"
 holy_order.2003.a: "[child.GetHersHis|U]将会成为真正的[child.GetFaith.GetAdherentName]。"
 holy_order.2003.child_joins_order: "[child.GetFirstName]获得[GetTrait('order_member').GetName( child.Self )]并加入[grandmaster.GetTitledFirstNameNoTooltip]的宫廷"
 holy_order.2003.b: "也许你可以训练[alternative_child.GetFirstNameNoTooltip]？"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName]获得[GetTrait('order_member').GetName( alternative_child.Self )]并加入[grandmaster.GetTitledFirstNameNoTooltip]的宫廷"
 holy_order.2003.c: "[child.GetHerHis|U]在这里与我一起就是最适合的地方。"
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "我已将生命献给[child.GetFaith.HighGodNameAlternate]，但[child.GetFaith.HighGodNameSheHe]不会希望我忽视自己的家人。\n\n[grandmaster.GetTitledFirstName]已批准我离队，回归旧有的生活，再次成为你[ROOT.Char.Custom('GetCourt')]的一分子。"
 holy_order.2004.a: "欢迎回家，我的[child.Custom('DaughterSon')]！"
 holy_order.2004.b: "不，这里没有你的位置了。"
 holy_order.2005.t: "回家"
 holy_order.2005.desc: "[child.GetTitledFirstNamePossessive]这次访亲的时间长于以往。我的[child.Custom('DaughterSon')][child.GetHerselfHimself]安坐于我的[ROOT.Char.Custom('GetCourt')]中——[child.GetHerselfHimself]吞吃我的食物，骚扰我的仆人——我提起回到[holy_order.GetName]话题。[child.GetHerHis|U]的回答很不幸地热情洋溢。\n\n“你不知道吗，[ROOT.Char.Custom('MotherFather')]？[grandmaster.GetTitledFirstName]慷慨地解除了我对于[child.GetFaith.GetName]的职责！我终于回家了，为家人服务。”"
 holy_order.2005.a: "哦，你是要……长住？"
 holy_order.destroyed_title: "军事修会解散"
 holy_order.2010.t: "新隐修修会"
 holy_order.2010.desc: "多年来，隐士、神秘主义者和来自其他老修会的不满于现状的门徒聚集在[barony.GetNameNoTier]，在荒野中辛苦建造他们的新家。一个名为[leader.GetFirstName][leader.Custom('SisterBrother')|U]的[leader.GetWomanMan]已经崛起为这个新兴修会“[leader.GetPrimaryTitle.GetName]”的领袖……但是#EMP 我#!威严的声音尚未在此事上发声。我也没有提出一项神圣的戒律，作为该修会生活方式的核心。\n\n这群纯粹的奉献者在[barony.GetNameNoTierNoTooltip]歌唱什么？他们要做什么来充实地生活，思考和写作？谁应当领导他们？"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )]和[monk_tenet_1.GetFirstNameNoTooltip][monk_tenet_1.Custom('SisterBrother')|U]。"
 holy_order.2010.5: "[tenet_5.GetName( order_rite )]和[monk_tenet_2.GetFirstNameNoTooltip][monk_tenet_2.Custom('SisterBrother')|U]。"
 holy_order.2010.6: "[tenet_6.GetName( order_rite )]和[monk_tenet_3.GetFirstNameNoTooltip][monk_tenet_3.Custom('SisterBrother')|U]。"
 holy_order.2010.d: "[tenet_1.GetName( order_rite )]和[monk_tenet_1.GetFirstNameNoTooltip][monk_tenet_1.Custom('SisterBrother')|U]。"
 holy_order.2010.e: "[tenet_2.GetName( order_rite )]和[monk_tenet_2.GetFirstNameNoTooltip][monk_tenet_2.Custom('SisterBrother')|U]。"
 holy_order.2010.f: "[tenet_3.GetName( order_rite )]和[monk_tenet_3.GetFirstNameNoTooltip][monk_tenet_3.Custom('SisterBrother')|U]。"
 monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )]会成为[monastic_order.GetName]倡导的[core_tenet|E]"
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName]倡导[tenet_pick.GetName( order_rite )]"
 founded_monastic_order_modifier: "建立隐修修会"
 founded_monastic_order_modifier_desc: "这位睿智的统治者协助创立了全新的修会团体，借此开辟出一条直达神圣存在的全新修行之路。"
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName]成为[monastic_order.GetName]的[ruler|E]"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName]仍然是[monastic_order.GetName]的[ruler|E]"
 holy_order.2009.t: "建造修道院"
 holy_order.2009.desc: "在静谧的[province.GetTerrain.GetNameNoTooltip|l]中，在这片深受[province.GetCulture.GetCollectiveNoun]人热爱的土地上，我埋下了第一块石头，有朝一日，这里将矗立起[province.GetName]的修道院。\n\n我的劳工与朴素的见习修士一同动手，从地上砌起围墙，他们勤劳的身体里传来祈祷的赞美诗。首批受尊崇的修士——诸如[potential_leader.Custom('SisterBrother')|U][potential_leader.GetName]——也来到这里，着手规划唱诗班席位和食堂的蓝图。\n\n不出几年，一个新的修会将在此诞生。而除了石料与[ROOT.Char.Custom('GetWritingMaterial')]之外，这个修会还需要更多宣誓入会的成员。"
 holy_order.2009.a: "这一新修会必须由我支持的人来引领。"
 holy_order.2009.b: "许多修士正对其当前的修会感到不满……"
 holy_order.2009.b.tt: "……他们宁愿脱离旧日的上级管束，投身这一新修会的麾下，以求获得订立全新修行戒律的自由。"
 holy_order.2009.c: "召集隐世的苦行者与热忱的青年。"
 monastic_order_creation_increased_spiritual_fulfillment: "与[monastic_holy_order|E]的[interactions|E]会提供更多[spiritual_fulfillment|E]，持续#high 50年#!"
 monastic_founder_become_saint_tt: "如果[chosen_leader.GetShortUIName]拥有至少#high 65+#!的[GetTrait('devoted').GetName( chosen_leader.Self )][trait_level_track_xp|E]，或至少@piety_level_4_icon_christian![GetModifier( 'piety_level_4' ).GetNameWithTooltip|L][piety_level|E]，[chosen_leader.GetSheHe]将在去世后成为[GetTrait('saint').GetName( chosen_leader.Self )]"
 holy_order.2020.t: "修道誓愿"
 holy_order.2020.desc: "在我的执意要求下，[recipient.GetFirstNamePossessive]换上崭新修道袍，转身背离我的[ROOT.Char.Custom('ResidenceBuilding')]，远离俗世的[ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]与贵族生活。[recipient.GetSheHe|U]正式受封，归入[archabbot.GetPrimaryTitle.GetName]的门下。\n\n与修会中的其他[recipient.Custom('SistersBrothers')]同道一样，[recipient.GetFirstNameNoTooltip]立下誓言，愿终生恪守本分、忠诚侍奉神圣团体。[recipient.GetSheHe|U]将肉身奉献给[recipient.GetFaith.HighGodName]，以心神敬奉[recipient.GetFaith.PositiveAfterLife]。\n\n[recipient.GetFirstNameNoTooltip]将居住在[archabbot.GetCapitalLocation.GetName]，或是修会下辖的其他圣所，自此开启潜心研学、静心冥想的修行人生。"
 holy_order.2020.aa: "修会迎来一位勤勉之士。"
 holy_order.2020.aa.tt: "[recipient.GetFirstNamePossessiveNoTooltip]的管理能力将为修会的恒久劳作而效力。"
 holy_order.2020.a: "修会迎来一位贤明门徒。"
 holy_order.2020.a.tt: "世间没有地方比这里更适合学识渊博的[recipient.GetFirstNameNoTooltip]了。"
 holy_order.2020.b: "他们资助人的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))]可不是个杂役……"
 holy_order.2020.c: "一笔“捐赠”足以让[recipient.GetFirstNameNoTooltip]享受照顾。"
 holy_order.2020.d: "[recipient.GetHerHis|U]的生命现在属于修会。"
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName]应[puppet_or_actor.GetShortUINamePossessive]请求加入了一个隐修修会"
 take_vows_improve_education_learning_tt: "@skill_learning_icon![learning|E][education|E]成果将会提升"
 take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon![stewardship|E][education|E]成果将会提升"
 recently_joined_holy_order_desc: "[recipient.GetShortUIName]在其过去5年内加入了修会"
 child_in_holy_order_desc: "[recipient.GetShortUIName]是一位许诺给修会的孩子"
 custom.every_domain_monastic_order: "你的[domain|E]内的所有[monastic_holy_order|E]"
 order_gains_minor_tenet_popularity_tt: "其[core_tenet|E]获得#P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#![tenet_popularity|E]"
 new_order_gains_minor_tenet_popularity_tt: "你的新[monastic_holy_order|E]的[core_tenet|E]将获得额外#P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#![tenet_popularity|E]"
 holy_order.2030.t: "捐赠：[recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "我的财宝被送入[recipient.GetTitledFirstNamePossessive]修道院的宝库。这份捐赠，将用以供养圣土耕作、誊写圣典，支撑[recipient.GetPrimaryTitle.GetName]的世俗教务……\n\n……同时，万千祷告将为我不朽的灵魂而诵念。修士以祈祷为生，而据说，他们专一而纯粹的虔诚，能令[ROOT.Char.GetFaith.random_GoodGodNames|U]留意垂听、格外眷顾。\n\n#EMP [actor.GetFaith.HighGodName|U]，你可听见他们口中念诵我的名？#!"
 holy_order.2030.desc_desperate_plea: "#EMP 你可知我卑微匍匐、苦苦哀求——如囚徒一般渴求你的宽恕？#!"
 holy_order.2030.desc_huge_donation: "#EMP 你可知我为此割舍了多少财富……？#!"
 holy_order.2030.a: "新的祷告声响起，为了我的救赎。"
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUIName]接受了[puppet_or_actor.GetShortUINamePossessive]的修道院捐赠"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U]，"
 holy_order.2031.desc: "我已为你的请求深思与祷告，但恐怕再多捐赠，也无法驱使院内修士代你向[recipient.GetFaith.HighGodName]祈求。你的救赎就连我们也无能为力。"
 holy_order.2031.a: "呸！至少我的钱还在。"
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]的修道院捐赠"
 already_has_monastic_lease_tt: "[target.GetNameNoTier]已经被[leased|E]给[monastic_holy_order|E]"
 lease_title_to_existing_monastic_order_interaction: "授予修道院"
 lease_title_to_existing_monastic_order_interaction_desc: "将一处[temple_holding|E][lease|E]给[recipient.GetPrimaryTitle.GetName]，获得[spiritual_fulfillment|E]、[piety|E]并加深与修会的互动"
 INTERACTION_LEASE_DONATION: "购置附属地产"
 no_valid_temple_holdings_to_lease_tt: "你的[domain|E]内没有可供[lease|E]的[temple_holdings|E]"
 monastic_onslaught_modifier_tt: "[target_county.GetName]获得[GetModifier('monastic_onslaught_modifier').GetNameWithTooltip]，持续#high 20年#!"
 holy_order.2040.opening: "[actor.GetPrimaryTitle.GetNameNoTier]的[actor.GetFirstName]，尊贵的恩主，"
 holy_order.2040.desc: "一切就绪。[recipient.GetPrimaryTitle.GetNameNoTier]的一处分会修道院将会落成，毗邻于[target.GetNameNoTier]的[actor.GetFaith.HouseOfWorship]；在这[target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier]的腹地，我们将存放自[recipient.GetCapitalLocation.GetName]图书馆运来的古老典籍。\n\n"
 holy_order.2040.desc_nuns: "届时，我们的[recipient.GetFaith.DevoteeFemalePlural]将日夜为你向[actor.GetFaith.HighGodName]颂唱祷文。"
 holy_order.2040.desc_monks: "届时，我们的[recipient.GetFaith.DevoteeMalePlural]将日夜为你向[actor.GetFaith.HighGodName]颂唱祷文。"
 holy_order.2040.desc_huge_donation: "这是修会对你慷慨善举的至诚感谢。"
 holy_order.2040.desc_rite: "\n\n要知道，正如本修会的每一处分院一般，本分会也将恪守[recipient.GetRite.GetName]的仪轨。"
 holy_order.2040.a: "愿贵修会繁荣昌盛！"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUIName]接受了[puppet_or_actor.GetShortUINamePossessive]租借男爵领的提议"
 holy_order.2041.opening: "[actor.GetPrimaryTitle.GetNameNoTier]的[actor.GetFirstName]，"
 holy_order.2041.desc: "我们，[recipient.GetFaith.HighGodNamePossessive]最纯洁的虔信者，将[recipient.GetFaith.PositiveAfterLife]的至纯神圣带到这苦难的人间……却不得不忧惧，[actor.GetPrimaryTitle.GetNameNoTier]上出现了一种连我们祈祷也无法驱散的疫病。\n\n既然你领地上的灵魂与[recipient.GetFaith.HighGodName]可悲地割裂，[recipient.GetPrimaryTitle.GetName]便无法前往[target.GetNameNoTier]。"
 holy_order.2041.a: "他们的“圣洁”——一派胡言！"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUIName]拒绝了[puppet_or_actor.GetShortUINamePossessive]租借男爵领的提议"
 monastic_order_entering_interaction_range_tt: "@alert_icon!#alert_trial [monastic_order.GetName]将进入[holy_order_vicinity|E]，启用他们的[interactions|E]#!"
 holy_order.2050.t: "[barony.GetNameNoTierNoTooltip]的运动兴起"
 holy_order.2050.desc: "“[target_order.GetName]是否仍在如沙漠中的隐士那般受苦？”——[clerical_helper.GetNamePossessive]那些言辞激烈的信件，皆以此开篇。\n\n“[target_lessee.GetTitledFirstName]可还在用黄金装扮[target_lessee.GetHerselfHimself]自己？”——[barony.GetNameNoTier]的改革派在布道中如此质问，并总会以这样一句话作结：#EMP “一条新道路！一条新戒律！”#!\n\n这座修道院正迅速成为虔诚改革与异见滋生的温床。修士们早已不再认同[target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip]的传统，也对那些关于[target_order_tenet.GetName( founder.GetRite )]的陈词滥调深感厌倦。然而，这股改革的热忱仍须被引向一个全新的原则，归于一人的麾下。"
 msg_order_movement_took_monastery.t: "[chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip]运动"
 movement_took_monastery_notification_3_tt: "[new_holy_order.GetName]从[target_order.GetName]接收[barony.GetNameNoTier]和其他[leases|E]"
 movement_took_monastery_notification_2_tt: "[new_holy_order.GetName]从[target_order.GetName]接收[barony.GetNameNoTier]和[lease_2.GetNameNoTier]"
 movement_took_monastery_notification_tt: "[new_holy_order.GetName]从[target_order.GetName]接收[barony.GetNameNoTier]的[lease|E]"
 movement_took_monastery_patron_notification_tt: "[founder.GetShortUIName]认可这个改革[monastic_holy_order|E]"
