l_simp_chinese:
 faith_creation.1001.t.schism: "[reformed_faith.GetAdjectiveNoTooltip]分裂"
 faith_creation.1001.t.reformation: "[reformed_faith.GetAdjectiveNoTooltip]改革"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetName]出现了新的分裂，[reformer.GetTitledFirstName]和[reformer.GetHerHis]的追随者脱离了母信仰[old_faith.GetName]信仰，他们曾经遵守的[old_rite.GetAdjective]成为了信仰的种子。"
 faith_creation.1001.desc.reformation: "[reformer.GetTitledFirstName]，[reformed_faith.GetAdherentNamePlural]中的显贵，召集了其领土中的所有[reformer.Custom('DefaultPriestTitle')]，将各种零散仪式整合为单一的礼仪，并据此为信仰确立了官方教义。"
 faith_creation.1001.desc.schism.personal: "[old_faith.GetAdjective][old_faith.AltPriestTermPlural]已偏离正路，再不能信任他们的指引。我已召集一群与我意见一致的[reformer.Custom('DefaultPriestTitlePlural')]，而我们基于[old_rite.GetName]建立的一切，已不再属于我们的母信仰。"
 faith_creation.1001.desc.reformation.personal: "终于，我召集了世界上所有重要的[reformer.Custom('DefaultPriestTitle')]，为的是将我们分散的仪式规范整合为一，并据此确立指引我们今后信仰的教义。"
 faith_creation.1001.desc.schism.personal.hof: "我不会再屈膝了，[old_hof.GetTitledFirstName]与[old_faith.GetAdjective]的[old_faith.AltPriestTermPlural]已将信众引入歧途。我已聚集了与我信念一致的[reformer.Custom('DefaultPriestTitlePlural')]，从我们沿袭至今的[old_rite.GetAdjective]中，铸就了一种脱离[old_faith.GetName]的信仰。"
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName]已抛弃[old_hof.GetTitledFirstName]的权威，带领[reformer.GetHerHis]的追随者脱离[old_faith.GetName]。他们所遵循的[old_rite.GetAdjective]，如今已成为一种独立信仰的根基，只对其自身负责。"
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\n慷慨激昂的[reformer.Custom('DefaultPriestTitlePlural')]已在讨论发动[reformed_faith.GHWNamePlural]以在世上传播新信仰，"
 faith_creation.1001.desc.outlook.pacifism: "\n\n这些[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]谴责暴力和流血，表示战争只会导致苦难与仇恨，"
 faith_creation.1001.desc.outlook.dogmatic: "\n\n这些[reformer.Custom('DefaultPriestTitlePlural')]宣布[reformed_faith.GetNameNoTooltip]是唯一正信，"
 faith_creation.1001.desc.outlook.accepting: "\n\n这些[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]鼓励合作与宽容，甚至对不信者也一样，"
 faith_creation.1001.desc.outlook.fallback: "\n\n这些[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]对其他信仰采取实用而均衡的观点，"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "声称荣耀[reformed_faith.HighGodName]的唯一正确的奉献方式只有人祭！"
 faith_creation.1001.desc.belief.indulgent: "鼓励信徒沉溺于肉欲，放纵生活。"
 faith_creation.1001.desc.belief.incest: "认可近亲婚姻，声称家庭的联系是神圣的，这样的婚姻受到祝福。"
 faith_creation.1001.desc.belief.aniconism: "拒绝使用任何宗教象征，声称区区肖像无法捕捉到[reformed_faith.HighGodName]的伟大。"
 faith_creation.1001.desc.belief.ascetic: "在追随者中提倡苦修，声称物质的追求阻碍了前往灵性完满的道路。"
 faith_creation.1001.desc.belief.spirits: "要求诸灵帮助指引信徒渡过这动荡的年代。"
 faith_creation.1001.desc.belief.superstition: "许多古老的迷信和神话故事都正典化为官方教条。"
 faith_creation.1001.desc.belief.nature: "尊重自然本身，努力存留和保护自然不受那些为私利而剥削自然的人的侵害。"
 faith_creation.1001.desc.belief.community: "新信仰与信徒的文化传统相互交织，形成了联系紧密的[reformed_faith.GetAdherentNamePluralNoTooltip]社区，不愿意接纳外来者。"
 faith_creation.1001.desc.belief.pain: "教导信徒，肉体必须通过苦难与痛苦来学会谦卑，因为受苦能净化灵魂，并使信众更接近[reformed_faith.HighGodName]。"
 faith_creation.1001.desc.belief.iconoclasm: "呼召民众，将假神的偶像与祭坛尽行推倒焚毁，凡尚存之处都将如此。"
 faith_creation.1001.desc.belief.militant: "主张信奉者首先是士兵，受召以刀剑传播信仰。"
 faith_creation.1001.desc.belief.veneration: "尊崇已故圣徒为代祷者，敬奉其遗物，并在祈祷中呼求其名。"
 faith_creation.1001.desc.belief.sacraments: "坚信恩典仅得授于神圣礼仪，且仅由受祝圣之手施予，他人不得为之。"
 faith_creation.1001.desc.belief.penance: "教导每一个灵魂生而有罪，唯有通过忏悔与苦修，方能洁净。"
 faith_creation.1001.desc.belief.christology: "已解决了一项重大的教义问题，确立了神性的本质，所有信徒都必须信奉这一界定。"
 faith_creation.1001.desc.belief.rebirth: "坚信灵魂被束缚在一个伟大的重生之轮上，每一生都由前世的业行所塑造。"
 faith_creation.1001.desc.belief.learning: "将学习置于一切之上，认为探究世界即是更好地领悟[reformed_faith.HighGodName]的旨意。"
 faith_creation.1001.desc.belief.law: "将神圣的法律置于一切之上，坚持教义的每一个字都必须严格遵守。"
 faith_creation.1001.desc.belief.missionary: "已立誓将福音传遍大地每一个角落，不使任何灵魂再陷于黑暗之中。"
 faith_creation.1001.desc.belief.hierarchy: "教导万物各安其位，唯有当每个灵魂都尊崇既有秩序时，和谐才能流转不息。"
 faith_creation.1001.desc.belief.charity: "号召信徒以慈善回应苦难，悉心照料穷人、病患与异乡人。"
 faith_creation.1001.desc.belief.family: "视血缘纽带为神圣，教导人们敬奉祖先、繁衍子嗣本身就是一种崇拜行为。"
 faith_creation.1001.desc.belief.sacred_sites: "树立起宏伟的石质纪念碑，作为自身虔诚的见证，成为世代相传的圣地。"
 faith_creation.1001.desc.belief.worldly: "以世俗务实的态度看待信仰，认为金钱、妥协与恰到好处的沉默，或许能像祈祷一样忠于信仰。"
 faith_creation.1001.desc.belief.syncretic: "将邻人的信仰融入自身，认为通往同一真理的道路或许有许多条。"
 faith_creation.1001.desc.belief.fallback: "要求所有信徒放下旧有的争执，为了新信仰团结在一起。"
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip]选择亲自领导蓬勃发展的[reformed_faith.GetAdjectiveNoTooltip]运动，自称[reformed_faith.ReligiousHeadName]，[reformer.GetSheHe]要将这一崇高的职位传给[reformer.GetHerHis]继承人。"
 faith_creation.1001.desc.temporal.personal: "\n\n我选择亲自领导蓬勃发展的[reformed_faith.GetAdjectiveNoTooltip]运动，自称[reformed_faith.ReligiousHeadName]，我要将这一崇高的职位传给后代。"
 faith_creation.1001.desc.spiritual: "\n\n[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]选择[reformed_hof.GetFirstNameNoTooltip]为他们的新[reformed_faith.ReligiousHeadName]，这位领袖将塑造信仰中的主流礼仪，作为衡量其他所有[reformed_faith.GetAdjectiveNoTooltip]礼仪的标准，并仲裁整个信仰内的争端。"
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformed_faith.GetAdjectiveNoTooltip][reformer.Custom('DefaultPriestTitlePlural')]选择维持[reformed_hof.GetFirstNameNoTooltip]为他们的[reformed_faith.ReligiousHeadName]，[reformed_hof.GetSheHe]将继续塑造信仰中的主流礼仪，作为衡量其他所有[reformed_faith.GetAdjectiveNoTooltip]礼仪的标准，并仲裁整个信仰内的争端。"
 faith_creation.1001.desc.no_head: "\n\n蓬勃发展的运动决定不设立宗教领袖，而让每一种礼仪拥有自己的教义，每一位[reformer.Custom('DefaultPriestTitle')]负责自己的[reformed_faith.HouseOfWorship]。"
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip]热切地等待着他们的[reformed_faith.ReligiousHeadName]——预言中将会集合所有信徒并开启[reformed_faith.GetAdjectiveNoTooltip]的新黄金时代的伟大领袖——的到来。"
 faith_creation.1001.o.frightened: "[ROOT.Char.GetFaith.random_GoodGodNames]救我们免受这些嗜血的[second.Custom('GetUnbelieverNamePlural')]侵害！"
 faith_creation.1001.o.heretical: "这些异端要为他们对[ROOT.Char.GetFaith.HighGodName]犯下的罪付出代价！"
 faith_creation.1001.o.crusader: "一两场[ROOT.Char.GetFaith.GHWName]就能送这些[second.Custom('GetUnbelieverNamePlural')]去他们该去的地方！"
 faith_creation.1001.o.interested: "我们应该留意这个新形势……"
 faith_creation.1001.o.uninterested: "这些[second.Custom('GetUnbelieverNamePlural')]信什么都无所谓。"
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "获得#V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!次免费建立、降级、升级、采纳或放弃[holy_sites|E]的行动"
 faith_creation.1001.o.personal: "世界会看到，[ROOT.Char.GetFaith.HighGodName]宠爱我们！"
 faith_creation.1002.t: "渐行渐远的礼仪"
 faith_creation.1002.t.new_faith: "我们自己的信仰"
 faith_creation.1002.desc.intro.founder: "我的[old_rite.GetAdjective]逐渐偏离——一次又一次祈祷、一条又一条信条——直到它已不再是[old_faith.GetName]。"
 faith_creation.1002.desc.intro.member: "我们的[old_rite.GetAdjective]在[founder.GetTitledFirstName]带领下逐渐偏离——一次又一次祈祷、一条又一条信条——直到它已不再是[old_faith.GetName]。"
 faith_creation.1002.desc.intro.observer: "[founder.GetTitledFirstName]的[old_rite.GetAdjective]逐渐偏离——一次又一次祈祷、一条又一条信条——直到它已不再是[old_faith.GetName]。"
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName]宣布了裁决：迷途的羊群被逐出教门，联系彻底断绝。"
 faith_creation.1002.desc.anathema.no_hof: "\n\n[old_faith.GetName][old_faith.AltPriestTermPlural]在每座祭坛宣布了裁决：迷途的羊群被逐出教门，联系彻底断绝。"
 faith_creation.1002.desc.new_head.personal: "今后的重担将由我承担：如今我已成为[new_faith.GetName]的[new_faith.ReligiousHeadName|U]。"
 faith_creation.1002.desc.new_head.founder: "引领他们走出困境之人，至今仍在引领——[founder.GetFirstNameNoTooltip]，[new_faith.GetName]的[new_faith.ReligiousHeadName|U]。"
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName]如今是[new_faith.GetName]的[new_faith.ReligiousHeadName|U]。"
 faith_creation.1002.desc.new_head.none: "没有单个牧者能指引这群新信徒；它的[new_faith.AltPriestTermPlural]只对自己负责。"
 faith_creation.1002.desc.outro.new_faith: "\n\n我们自己的信仰，我们自己的律法——但这火焰刚刚重燃，[old_faith.GetName]现在可能会以刀剑相向，而不仅仅是加以谴责。"
 faith_creation.1002.desc.outro.old_faith: "\n\n每一个信奉[old_rite.GetName]的伯爵领与灵魂，都在一瞬之间背弃了[old_faith.GetName]。他们不再是同胞——我们可能很快会在战场上相见。"
 faith_creation.1002.a: "终于，我们自己的信仰。"
 faith_creation.1002.a.founder: "道路一直是我们的——如今名字也是了。"
 faith_creation.1002.b: "异端，永远都是。"
 faith_creation.1002.b.hof: "让他们知道外面的世界有多冷。"
 faith_creation.1002.consequences.tt: "[new_faith.GetName]现在是完全分离的[faith|E]：\n$EFFECT_LIST_BULLET$先前[rite|E]的所有[followers|E]和[counties|E]现在属于新信仰\n$EFFECT_LIST_BULLET$[new_faith.GetName]与[old_faith.GetName]变为[faith_hostility|E]，允许[holy_wars|E]\n$EFFECT_LIST_BULLET$两种信仰不再拥有共同的[head_of_faith|E]"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName]获得#V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!次免费建立、降级、升级、采纳或放弃[holy_sites|E]的行动"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName]失去[GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip]成为[faith.ReligiousHeadName|U]"
 faith_creation.1010.desc.start: "尽管我们并未因此质疑自己信仰的正义性，但那段没有精神领袖的日子真是难熬。不过，这煎熬终于结束了，因为"
 faith_creation.1010.desc.temporal.personal: "我终于说服了[faith.AltPriestTermPlural]们承认我是唯一真正的[faith.ReligiousHeadName|U]。"
 faith_creation.1010.desc.temporal: "[HoF.GetTitledFirstName]成功说服[faith.AltPriestTermPlural]们承认[HoF.GetHerHim]为唯一真正的[faith.ReligiousHeadName|U]。"
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural]召开会议，选出[HoF.GetFirstName]作为唯一真正的[faith.ReligiousHeadName|U]，主流礼仪的掌管者。"
 faith_creation.1010.desc.end: "\n\n信徒们最终团结在一位领导者身后，看来[faith.GetNameNoTooltip]似乎要走进新的黄金时代。"
 faith_creation.1010.desc.end.personal: "\n\n信徒们终于团结在我身后，我会带领[faith.GetNameNoTooltip]走进新的黄金时代！"
 faith_creation.1010.a: "荣耀归于[faith.HighGodName]！"
 faith_creation.1011.message.title: "宗教领袖确立"
 faith_creation.1011.message.desc: "[faith.GetAdjective][faith.AltPriestTermPlural]已正式宣布[faith.ReligiousHeadName|U][HoF.GetFirstName]为他们的[head_of_faith|E]"
 faith_creation.1021.t: "教内礼仪"
 faith_creation.1021.t.founder: "我们自己的礼仪"
 faith_creation.1021.desc.intro.founder: "[new_rite.GetName]已宣告成立，追随者皆寄希望于我。我们仍为[old_faith.GetAdherentNamePlural]，但已不再属于[source_rite.GetAdjective]。"
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName]成立了一种[old_faith.GetName]新礼仪。其追随者称它为[new_rite.GetName]，但依然属于[old_faith.GetAdjective]信仰。"
 faith_creation.1021.desc.divergence.minor: "\n\n它与[source_rite.GetAdjective]仅有细微的不同。"
 faith_creation.1021.desc.divergence.moderate: "\n\n其仪式对于大多数遵循[source_rite.GetAdjective]的人来说略显陌生。"
 faith_creation.1021.desc.divergence.major: "\n\n其仪式与[source_rite.GetAdjectiveNoTooltip]相去甚远，令人怀疑。"
 faith_creation.1021.desc.differing.tenet: "最大的不同在于[differing_tenet.GetBaseName]。"
 faith_creation.1021.desc.differing.doctrine: "最大的不同在于[differing_doctrine.GetDescriptiveName]。"
 faith_creation.1021.desc.differing.fallback: "没有单一的仪式显示出分歧。"
 faith_creation.1021.desc.outro.founder.mainline: "\n\n我们脱离了主流礼仪，那个[old_faith.GetNameNoTooltip]评判其他所有人的标准。就让他们称之为狂妄吧。"
 faith_creation.1021.desc.outro.founder.branch: "\n\n我们本就已是一种分支礼仪，如今自成一体。"
 faith_creation.1021.desc.outro.observer: "\n\n新礼仪的出现并不罕见。这种礼仪能否扎根，抑或是枯萎，甚至腐烂为异端，尚需时间验证。"
 faith_creation.1021.a.founder: "让它在虔诚者中安静地传播。"
 faith_creation.1021.b.founder: "让整个领地听到这个消息。"
 faith_creation.1021.a: "一种鲜活的信仰容得下诸多礼仪。"
 faith_creation.1021.b: "每个异端最初都只是新礼仪。"
