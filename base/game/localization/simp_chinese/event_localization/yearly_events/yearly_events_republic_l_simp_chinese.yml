l_simp_chinese:
 yearly_republic.1001.t: "该睡觉了，亲爱的"
 yearly_republic.1001.desc: "午夜将近，我的[spouse_target.GetWifeHusband][spouse_target.GetTitledFirstName]却发现我仍深陷在文书之中，审核着那些账簿。\n\n“上床歇息吧，我的[ROOT.Char.GetWifeHusband]，”[spouse_target.GetSheHe]恳求道，“工作想必可以等到明日再说吧？”\n\n“或者，”[spouse_target.GetFirstNameNoTooltip]说着，若有所思，“也许我可以为你分担一些？”"
 yearly_republic.1001.a: "最好给我们多备些蜡烛，我的爱人。"
 yearly_republic.1001.b: "我的工作还落后一大截。别管我！"
 yearly_republic.1001.c: "只要有你，世界尽可等待。"
 yearly_republic.1001.communal: "所有[vassals|E]对#value 你#!的好感提高#P 10#!"
 yearly_republic.1002.t: "荆棘婚姻"
 yearly_republic.1002.desc: "我与[spouse_target.GetTitledFirstName]的婚姻充满了争执。我们似乎在任何事情上都无法达成一致。毫无疑问，[spouse_target.GetSheHe]正在通过频繁的书信让[spouse_target.GetHerHis]的亲属们时刻了解我的“不足之处”。\n\n我曾希望我的婚姻能将我的商业利益与[spouse_target.GetDynastyHouseName]家族更紧密地绑定在一起，但每当我在这座城中遇到他们的代理人或客户时，我都能看到他们眼中的不信任。\n\n若不采取行动，这种有毒的情绪将继续在我们两个家族中蔓延，就像感染的伤口流出的败血一样。"
 yearly_republic.1002.a: "我将买来[spouse_target.GetFirstNameNoTooltip]及[spouse_target.GetHerHis]家族的感激。"
 yearly_republic.1002.b: "我将伪造[spouse_target.GetHerHis]的书信来为我歌功颂德。"
 yearly_republic.1002.c: "我向[ROOT.Char.GetFaith.random_GoodGodNames]发誓，要在你眼中变得更好。"
 yearly_republic.1002.d: "随他们怎么想。"
 yearly_republic.1002.tt.falsifying_success.desc: "修改你配偶的信，使你自己看起来更优秀"
 yearly_republic.1002.falsifying_success.toast: "[spouse_target.GetDynastyHouseName]家族相信你已经提高了自己"
 yearly_republic.1002.tt.falsifying_failure.desc: "未能修改你配偶的信件"
 yearly_republic.1002.falsifying_failure.toast: "[spouse_target.GetDynastyHouseName]家族对你的看法更糟了"
 yearly_republic.1002.tt.impress_spouse_success.desc: "你的配偶对你的努力印象深刻"
 yearly_republic.1002.impress_spouse_success.toast: "[spouse_target.GetDynastyHouseName]认可你的努力"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "你的配偶未被你的努力打动"
 yearly_republic.1002.impress_spouse_failure.toast: "[spouse_target.GetDynastyHouseName]家族将你视作赔本买卖"
 yearly_republic.1003.t: "暗巷恩怨"
 yearly_republic.1003.desc: "“你这蠢货！在街头斗殴会引发两大家族间的世仇的！看看你自己：你在流血！”我的[spouse_target.GetWifeHusband][spouse_target.GetTitledFirstName]看到我的[ROOT.Char.Custom2('RelationToMeShort', rook_01)][rook_01.GetTitledFirstName]时惊叫道——但这位年轻的浪荡子只是哈哈大笑，任由[rook_01.GetHerHis]的鲜血滴落在我家地板上。\n\n“我的对手比我惨多了！那个[rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))][rook_02.GetFirstName]正狼狈地瘸着腿回家呢。”\n\n该死的，这群年轻人！带着武器在街头游荡，虚张声势，寻衅滋事，做尽各种恶事来取乐。\n\n“不过是场小冲突罢了。别担心，[rook_01.Custom2('RelationToMeShort', spouse_target)]——我只是面对诽谤时捍卫了我们家族的名誉。”"
 yearly_republic.1003.a: "唉，年轻人的愚蠢。"
 yearly_republic.1003.b: "显然[rook_02.GetNameNoTooltip]有错。我们要求赔偿！"
 yearly_republic.1003.c: "我们应该向[rook_02.GetDynastyHouseNameNoTooltip]家族赠送一份礼物以平息事态。"
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "你对我家族的指控毫无根据、虚妄不实，完全没有道理。\n\n你从我们这里什么也得不到——除非你非要继续追究，那么我们的刀刃会很乐意“礼貌”地光顾你的喉咙。"
 yearly_republic.1004.b.desc: "作为[other_house_character_01.GetDynastyHouseName]家族的族长，我对我们两家之间的不愉快深表遗憾。我必须为此带来的困扰致歉，并恳请你接受这份薄礼，以表我的歉意。"
 yearly_republic.1004.a: "他们会为这无礼之举后悔的！"
 yearly_republic.1004.b: "好，我们迟早会讨回公道。"
 yearly_republic.1004.c: "我们接受应得的赔偿。"
 yearly_republic.1004.d: "愿我们之间的纷争就此终结。"
 yearly_republic.1005.t: "民众的否决"
 yearly_republic.1005.desc: "我们与[other_house_character_01.GetDynastyHouseName]家族间的不和再次蔓延到[capital_01.GetName]的街头，我们的车夫为争夺路权大打出手，直至道路被彻底堵塞。我本以为这不过是又一起琐碎的争端——直到一群人聚集在我家门前。\n\n“够了！”一个男人喊道。“[ROOT.Char.GetDynastyHouseName]家族和[other_house_character_01.GetDynastyHouseNameNoTooltip]家族争吵不休，我们无法做任何生意。别再把城市拖进你们的纷争里了！”\n\n我的[ROOT.Char.Custom2('RelationToMeShort', house_member_01)][house_member_01.GetTitledFirstName]对他们的放肆嗤之以鼻。“他们凭什么来干涉我们的行为？”"
 yearly_republic.1005.a: "不，[ROOT.Char.Custom2('RelationToMeShort', house_member_01)]。是时候与[other_house_character_01.GetDynastyHouseNameNoTooltip]家族谈谈了。"
 yearly_republic.1005.b: "我的雄辩会将责任归咎于[other_house_character_01.GetDynastyHouseNameNoTooltip]家族。"
 yearly_republic.1005.c: "卫兵！把这些家伙赶出我家大门。"
 yearly_republic.1005.tt.oratory_blame.desc: "用你的雄辩迷惑人群"
 yearly_republic.1005.tt.oratory_blame.toast: "你将问题归咎于[other_house_character_01.GetDynastyHouseName]家族"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "被人群的嘲笑淹没"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "你未能将问题归咎于[other_house_character_01.GetDynastyHouseName]家族"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "你是对的。是时候坐下来，让理性之人说话了——为了那些尚未出生的人，也为了共和国的长远利好。我们会与你们见面。"
 yearly_republic.1006.b.desc: "很遗憾，我们不觉得有任何理由给你当面说谎的机会。毫无疑问，你不过是另寻一个更方便的角度来加害于我们。不会有任何谈判。"
 yearly_republic.1006.a: "太好了！"
 yearly_republic.1006.b: "该死！"
 yearly_republic.1007.t: "[ROOT.Char.GetDynastyHouseNameNoTooltip]家族与[other_house_character_01.GetDynastyHouseNameNoTooltip]家族的关系缓和"
 yearly_republic.1007.desc: "空气中弥漫着紧张的气氛，我在一处中立场所坐到了[other_house_character_01.GetTitledFirstName]的对面。我们的委托人挤满了房间，分列两侧——如同两支军队在战场上互相凝视。毫无疑问，斗篷之下藏着匕首。\n\n“那么，”[other_house_character_01.GetFirstNameNoTooltip]以克制的语气说道，“说说你想说什么吧。”\n\n房中每一只眼睛都注视着我，我整理好思绪，开口发言。"
 yearly_republic.1007.a: "这场仇恨对生意有害。"
 yearly_republic.1007.b: "我们作为[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]应该达成和平。"
 yearly_republic.1007.c: "血已经流了；就让血将我们联结在一起。"
 yearly_republic.1007.d: "就用刀剑在此了结吧！"
 yearly_republic.1007.tt.detente_business.desc: "你说服了[other_house_character_01.GetShortUINameNoTooltip]接受你的观点"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip]被说服了"
 yearly_republic.1007.tt.detente_business_failure.desc: "你未能说服[other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip]未被说服"
 yearly_republic.1007.detente_business.change.desc: "双方家族同意为了商业利益而化解分歧"
 yearly_republic.1007.piety.change.desc: "双方家族出于对[ROOT.Char.GetFaith.HighGodName]的爱而同意化解分歧。"
 yearly_republic.1007.detente_marriage.change.desc: "双方家族同意以联姻化解分歧。"
 yearly_republic.1007.duel_win.desc: "你赢得决斗"
 yearly_republic.1007.duel_win.toast: "你刺中了[other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip]赢得决斗"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip]刺中了你"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip]受伤或被杀"
 yearly_republic.1007.duel_loss.custom: "你受伤或被杀"
 yearly_republic.1007.c.tt.suitable_pair: "双方家族都有尚未婚配、可以互相嫁娶的成员"
 house_relation_reason_falsify_good_desc: "收到赞扬家族族长品行的信件"
 house_relation_reason_falsify_bad_desc: "发现家族族长伪造了信件"
 house_relation_reason_thorny_desc: "一桩不美满的婚姻正在滋生不和"
 house_relation_reason_bribery_good_desc: "用黄金和珠宝厚待了配偶"
 house_relation_reason_street_combat_desc: "双方家族年轻人之间的街头斗殴"
 house_relation_reason_business_argument_desc: "讨论了商业上的好处"
 house_relation_reason_house_blamed_desc: "被指责造成社会动荡"
 house_relation_reason_houses_aligned_desc: "在志同道合的家族聚会上结成了共同阵线"
 house_relation_reason_cooperation_desc: "加深了家族间的合作。"
 demand_reparation_for_fight_desc: "寄信索要赔偿"
 pay_reparation_for_fight_desc: "寄信附上礼物和道歉"
 offer_a_sitdown_desc: "寄信提议缓和关系"
 yearly_republic.1008.t: "披着商人外衣的狼"
 yearly_republic.1008.desc: "一则有趣的消息传入了我的耳中：\n[other_patrician_01.GetTitledFirstNamePossessive]雇佣的一位商船船长，在地中海执行贸易合同期间一直从事无差别的劫掠行为，并将截获的货物转卖以牟取私利——真是一匹披着羊皮的狼！\n\n虽然无从得知[other_patrician_01.GetFirstNameNoTooltip]是否参与了这一阴谋，但对于那些舰船与货物曾遭劫掠的议会成员而言，这已经无关紧要了。"
 yearly_republic.1008.a: "立刻雇用这位头领为你效力。"
 yearly_republic.1008.b: "威胁头领，直到[bandit_01.GetSheHe]交出[bandit_01.GetHerHis]的赃物。"
 yearly_republic.1008.c: "威胁[other_patrician_01.GetFirstNameNoTooltip]以获得把柄。"
 yearly_republic.1009.t: "秘密沙龙"
 yearly_republic.1009.desc: "我花了整个下午，坐在[patrician_spouse_01.GetTitledFirstName]经营的一间舒适沙龙里。\n\n我一边与我的[ROOT.Char.Custom2('RelationToMeShort', relation_01)][relation_01.GetTitledFirstName]交谈，一边享用着[patrician_spouse_01.Custom('GetExpensiveDrink')]，这时我注意到靠近一处隔断的墙壁上有一只小小的影子在移动。观察片刻后，我推断那是一只手臂在做着细微而精准的动作；[relation_01.GetFirstNameNoTooltip]停下谈话时，那动作也随之停止——有人正躲在隔断后，将沙龙里说的每一个字都记下来！\n\n看来，我们的[patrician_spouse_01.Custom('HostessHost')][patrician_spouse_01.GetFirstNameNoTooltip]和[patrician_spouse_01.GetHerHis]的[patrician_husband_01.GetWifeHusband][patrician_husband_01.GetTitledFirstName]，正在窥探[patrician_spouse_01.GetHerHis]的客人们的谈话。"
 yearly_republic.1009.a: "我必须提醒所有人这个邪恶的阴谋！"
 yearly_republic.1009.a.tt: "对#value 你#!的好感提高#P 20#!，对[patrician_spouse_01.GetShortUINameNoTooltip]和[patrician_husband_01.GetShortUINameNoTooltip]的好感降低#N ‑25#!"
 yearly_republic.1009.b: "好主意啊！我也该这么办。"
 yearly_republic.1009.c: "向[patrician_spouse_01.GetFirstNameNoTooltip]和[patrician_spouse_01.GetHerHis]的[patrician_husband_01.GetWifeHusband]勒索保守[patrician_spouse_01.GetHerHis]秘密的封口费。"
 yearly_republic.1009.c.success.desc: "智胜[patrician_spouse_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.success.toast: "你获得对[patrician_husband_01.GetShortUINameNoTooltip]的强牵制"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip]智胜你"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip]更接近成为你的仇敌"
 yearly_republic.1009.flavor: "谁知道你会不会听到什么？"
 yearly_republic.1009.b.secret_learned: "你的刺探行动发现了一个秘密"
 yearly_republic.1010.t: "梁上的贵族"
 yearly_republic.1010.desc: "在我悠然散步时，我的[ROOT.Char.Custom2('RelationToMeShort', relation_01)][relation_01.GetTitledFirstName]找到了我，倾身低语道：\n\n“[ambassador_01.GetFirstName]大使已从[ambassador_mission_location_01.GetName]返回，今晚将在宫中的闭门会议上作报告。”\n\n[relation_01.GetSheHe|U]摇了摇头。“哦，想象一下，如果能在向全体议会呈报之前就听到那份报告，那将是多大的商业优势！”\n\n[relation_01.GetFirstNameNoTooltip]说话间，远处的宫殿屋顶依稀可见。"
 yearly_republic.1010.a: "我们应该从屋顶揭下几片瓦偷听。"
 yearly_republic.1010.b: "也许[ambassador_01.GetFirstNameNoTooltip]能被说服？"
 yearly_republic.1010.c: "我们会在适当的时候知道的。"
 yearly_republic.1010.a.success.desc: "你听到了报告"
 yearly_republic.1010.a.success.toast: "你听到了报告"
 yearly_republic.1010.a.mixed.desc: "你从屋顶跌落"
 yearly_republic.1010.a.mixed.toast: "你从屋顶跌落"
 yearly_republic.1010.a.failure.desc: "你掉进了房间"
 yearly_republic.1010.a.failure.toast: "你掉进了房间"
 yearly_republic.1010.a.mixed.custom: "你和[relation_01.GetShortUIName]获得[GetTrait('wounded_1').GetName( GetNullCharacter )|LV][trait|E]"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUIName|U]对你和[relation_01.GetShortUIName]的[opinion|E]降低#N 25#!#weak （$spy_opinion$）#!\n@portrait_punishment_icon!#TUT_KW 罪行——允许[republic_ruler.GetShortUIName]合法囚禁你们二人#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip]接受贿赂"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip]被你的要求冒犯了"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip]将报告给你"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip]拒绝收受贿赂"
 yearly_republic.1011.t: "会议召令"
 yearly_republic.1011.desc: "我再次被召去参加那些维系共和国运转的众多秘密会议之一。\n\n这样的职责占用了本该属于家庭与生意的时间，然而作为贵人，若无正当理由或议会批准，我无法拒绝召令。"
 yearly_republic.1011.a: "我会让我的医生证明我卧床不起。"
 yearly_republic.1011.b: "由于我亲爱的[ROOT.Char.Custom2('RelationToMeShort', sick_person_01)]病了，我有足够的理由留在家里。"
 yearly_republic.1011.c: "我会请求议会授予5年的豁免批准。"
 yearly_republic.1011.d: "这是我的责任。"
 yearly_republic.1011.c.success.desc: "议会授予批准"
 yearly_republic.1011.c.success.toast: "议会授予你批准"
 yearly_republic.1011.c.failure.desc: "议会拒绝批准"
 yearly_republic.1011.c.failure.toast: "议会拒绝授予你批准"
 yearly_republic.1012.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip]的游行"
 yearly_republic.1012.desc: "人群的期待之情几乎触手可及，[ROOT.Char.GetTitleAsNamePossessive]的队伍从宫殿大门鱼贯而出，开始穿过城市的巡行。\n\n走在最前面的是按地位与声望排列的公务官员，然后是我：[ROOT.Char.GetTitleAsNameNoTooltip]，身着最华贵的国家礼服；象征我权威的仪仗被高高举起，供人群瞻仰。\n在我身后，贵人按家族的显赫地位依次列队行进。\n\n人人都处于自己的位置上，我们共和国的等级秩序与无上荣光，在这庄严的典礼中尽显无遗！"
 yearly_republic.1012.a: "为了共和国！为了人民！"
 yearly_republic.1012.b: "荣耀归于议会！"
 yearly_republic.1012.c: "一切都是我荣耀的反映！"
 yearly_republic.1012.c.tt: "在接下来的#V 10#!年内，通过$republican_despot_succession_law$[succession_law|E]花费的[prestige|E]降低#P 50%#!"
 yearly_republic.1013.t: "与大海成婚"
 yearly_republic.1013.desc: "[Glossary( '#bold 礼舟#!', 'BUCENTAUR_GLOSS' )]驶过了最后一道障壁岛，亚得里亚海的广阔海面在我眼前展开。[bishop_01.GetTitledFirstName]将仪式戒指递到我手中，随即退后。\n我将其高举，让聚集的显贵们都能看见，并依照古老仪式，将它掷入碧绿的海浪之中。\n\n“[Glossary( '#bold 大海呀，我们娶你为妻，作为真实而永恒统治的象征。#!', 'DESPONSAMUS_GLOSS' )]”我高声宣告，船上的人群以欢呼回应。至此，我们共和国与大海——我们财富与权力的源泉——的联姻，便告完成。"
 yearly_republic.1013.a: "我们统治海洋！"
 yearly_republic.1013.b: "愚蠢空洞的仪式。"
 yearly_republic.1013.c: "我来了，我的爱！"
 yearly_republic.1013.d: "我将永远忠于大海！"
 yearly_republic.1014.t: "协调各家族"
 yearly_republic.1014.desc: "应[faction_head_01.GetTitledFirstName]之邀，[faction_head_01.GetHouse.GetHouseAspiration.GetName]野心的各家族首领已齐聚一堂。\n\n“朋友们！值此之际，我们必须团结一致，协调我们的利益。否则，我们敬爱的共和国中的其他派系必将寻机分裂并击垮我们。”\n\n我们讨论至深夜，尽管我们之间分歧众多，但仍有机会以强有力的声音弥合裂痕，结成统一阵线。"
 yearly_republic.1014.a: "“我们应该一起加入归尔甫派。”"
 yearly_republic.1014.b: "“我们应该一起加入吉伯林派。”"
 yearly_republic.1014.c: "“让我们加强各家族间的联系。”"
 yearly_republic.1014.d: "“我们之间的一切仇恨都必须结束。”"
