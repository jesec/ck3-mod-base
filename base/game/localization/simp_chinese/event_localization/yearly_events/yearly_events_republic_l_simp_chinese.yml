 yearly_republic.1015.t: "以黄金换选票"
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName|U]在我逛市场时找到了我。[patrician.GetSheHe|U]满脸堆笑地走到我身边，声音却压得很低。\n\n“啊，能在议会投票的沉闷事务中喘口气，真是太好了。我常常对如何投票感到困惑。像您这样睿智的头脑，就像雾海中的金色灯塔，能让我这样的可怜人在如此棘手的事务中找到方向。”[patrician.GetSheHe|U]夸张地叹了口气。\n\n“可是，我发现自己手头很紧。下次议会召集投票时，我这可怜的船夫要怎样才能把船头指向正确的方向呢？”"
 yearly_republic.1015.a: "说个价吧。"
 yearly_republic.1015.c: "我的提案将凭自身的价值立足。"
 yearly_republic.1016.t: "把票打出来"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U]是个狂妄的蛆虫，但[patrician.GetSheHe]在议会中同样拥有一票；[patrician.GetSheHe]这一票可以被“说服”交由我支配。\n\n我只需对[patrician.GetHerHim]施加一点压力，让[patrician.GetSheHe]明白，让我失望会带来怎样的后果。"
 yearly_republic.1016.a: "破坏[patrician.GetHerHis]的商业利益。"
 yearly_republic.1016.b: "派暴徒埋伏，痛殴[patrician.GetHerHis]的廷臣。"
 yearly_republic.1016.c: "去[patrician.GetHerHis]家里放一把火。"
 yearly_republic.1016.d: "我会教教[patrician.GetHerHim]什么是恐怖！"
 yearly_republic.1016.e: "让[patrician.GetHerHim]凭良心投票。"
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip]承诺与你投一致票"
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip]将被杀鸡儆猴。"
 yearly_republic.1017.t: "哲人王"
 yearly_republic.1017.desc: "晚宴一直持续到深夜；觥筹交错，话匣渐开。\n[debater_01.GetFirstName]、[debater_02.GetFirstName]、[debater_03.GetFirstName]与我，把天底下的事聊了个遍。\n\n我忽然意识到，与我交谈的正是共和国中最有学识的几位贵人——当真是群星璀璨。下一次议会集会时，只需借助严密的论证与思想的锋芒，这些人或许便能被说服与我投一致票。"
 yearly_republic.1017.a: "用杰出的雄辩说服他们。"
 yearly_republic.1017.b: "用理性的推断打动他们。"
 yearly_republic.1017.c: "也许最好倾听学习。"
 yearly_republic.1017.a.success.desc: "在辩论中胜过桌旁最出色的演说家[debater_orator.GetFirstNameNoTooltip]"
 yearly_republic.1017.a.success.toast: "争取到桌边众人"
 yearly_republic.1017.a.failure.desc: "被桌旁最出色的演说家[debater_orator.GetFirstNameNoTooltip]绕得晕头转向"
 yearly_republic.1017.a.failure.toast: "你的修辞毫无效果"
 yearly_republic.1017.b.success.desc: "在论理上胜过桌旁最博学的[debater_scholar.GetFirstNameNoTooltip]"
 yearly_republic.1017.b.success.toast: "说服了桌边众人"
 yearly_republic.1017.b.failure.desc: "你的论证被桌旁最博学的[debater_scholar.GetFirstNameNoTooltip]逐一驳倒"
 yearly_republic.1017.b.failure.toast: "你的论点被驳得体无完肤"
 yearly_republic.1017.c.toast: "彻夜倾听"
 yearly_republic.1017.c.tt: "有小概率夜晚的辩论会给你留下深刻印象"
 yearly_republic.1017.c.insight.toast: "辩论留下了印记"
 yearly_republic.1018.t: "携礼而来"
 yearly_republic.1018.desc: "我的[ROOT.Char.Custom2('RelationToMeShort', benefactor_01)][benefactor_01.GetName]不期而至，来到我的门前。我们互致问候、真心拥抱之后，[benefactor_01.GetFirstNameNoTooltip]领我走到外面，那里停着一辆装满了货物和饰品的马车。\n\n“抱歉没有提前捎信说我要来，但我正好路过，觉得你会喜欢这件我在最近旅行中弄到的[new_curio.GetType]。”\n\n[benefactor_01.GetSheHe|U]从车上掀开一块布，露出[new_curio.GetName]。"
 yearly_republic.1018.a: "“谢谢，我的[ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]！”"
 yearly_republic.1018.b: "也许这能卖个好价钱？"
 yearly_republic.1018_domicile_curio_sold_tt: "你不久后卖掉了[new_curio.GetName]。"
 yearly_republic.1019.t: "观察之眼"
 yearly_republic.1019.desc: "又是与我的[ROOT.Char.Custom2('RelationToMeShort', benefactor_01)][benefactor_01.GetShortUIName]一起漫步在[event_location_01.GetName]街头的一天。总有些东西可看可谈。\n\n“看看他们是怎么储存那些产品的；我在[target_city.GetNameNoTooltip]见过他们做得比这好得多。我跟你说，[ROOT.Char.GetFirstNameNoTooltip]，只要稍微留心，我们身边的人就有太多可学之处。”"
 yearly_republic.1019.a: "“你在旅行中是否了解过[experience_trade_category_01.GetNameNoTooltip]？”"
 yearly_republic.1019.b: "“我们去市场谈谈[experience_trade_category_02.GetNameNoTooltip]的生意吧。”"
 yearly_republic.1019.c: "我应当把观察当作日常习惯。"
 yearly_republic.1020.t: "浴场交易"
 yearly_republic.1020.desc: "“……毕竟，生意是在互信的伙伴之间兴旺起来的。”\n\n把一桶水浇在自己头上，[house_benefactor_01.GetFirstName]再次转向我，神情严肃。“你的家族值得我们的敬意，[ROOT.Char.GetFirstName]。”\n\n浴场的蒸汽模糊了我的视线，热水的温度正放松着我的肌肉。\n\n“你和你的家人一直是我们[house_benefactor_01.GetDynastyHouseNameNoTooltip]家族的好朋友，我觉得我们深化合作是再自然不过的事。这对我们两个家族都有好处。”"
 yearly_republic.1020.a: "“我们应当共享在国外的代理人与人脉，以扩大我们的影响力。”"
 yearly_republic.1020.b: "“让我们分享专长，共同成长壮大。”"
