l_simp_chinese:
 culture_notification.0010.t: "摒弃传统"
 culture_notification.0010.desc: "[this_player.GetCulture.GetName][culture|E]摒弃了[tradition.GetName][tradition|E]"
 culture_notification.0011.t: "接受传统"
 culture_notification.0011.desc: "[this_player.GetCulture.GetName][culture|E]接受了[tradition.GetName][tradition|E]"
 culture_notification.1001.t: "融合文化：[new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "[founder.GetTitledFirstName]融合了[parent_1.GetName]文化和[parent_2.GetName]文化，建立了[new_culture.GetName|V][hybrid_culture|E]"
 culture_notification.1011.t: "[new_culture.GetNameNoTooltip]文化融合"
 culture_notification.1011.intro: "经年累月的往来，让[parent_1.GetName]与[parent_2.GetName]两族人民越走越近——近得足以让某种新认同生根发芽：一个自称“[new_culture.GetName]人”的民族。\n\n"
 culture_notification.1011.blend: "这种融合显而易见。他们保留了[tradition_1.GetName]的[parent_1.GetNameNoTooltip]传统，同时沿袭了[tradition_2.GetName]的[parent_2.GetNameNoTooltip]习俗。二者共同定义了这个新兴民族。"
 culture_notification.1011.blend_fallback: "两种母文化都谈不上压倒对方——[new_culture.GetNameNoTooltip]的生活方式将两个世界天衣无缝地融为一体。"
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "[hybrid_culture|E][new_culture.GetName]由[parent_1.GetName]文化和[parent_2.GetName][cultures|E]融合而成。"
 culture_notification.1101.t: "文化分离：[new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName]创建了[new_culture.GetName|V]文化，一种[parent_1.GetName]文化的[divergent_culture|E]"
 culture_notification.1111.t: "[new_culture.GetNameNoTooltip]文化分离"
 culture_notification.1111.intro: "此处的方言悄然变调，那边的新俗逐渐抬头——这些差异一开始可能容易忽略，但如今已不容忽视：居住于[founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]的[parent_1.GetCollectiveNoun]民众已经将他们自己称为“[new_culture.GetName]人”。\n\n"
 culture_notification.1111.tradition.new: "他们祖先的传统正逐渐被[new_tradition.GetName]所取代。"
 culture_notification.1111.tradition.lost: "他们抛弃了[parent_1.GetCollectiveNounNoTooltip]的[lost_tradition.GetName]之道。"
 culture_notification.1111.ethos.bellicose: "身处强敌与对手的环伺之下，[new_culture.GetCollectiveNounNoTooltip]人变得更加[new_culture.GetEthos.GetName]，选择把命运托付给武力与刀剑。"
 culture_notification.1111.ethos.bureaucratic: "[new_culture.GetCollectiveNounNoTooltip]人转而崇尚[new_culture.GetEthos.GetName]文书，冗长的特许状与浩繁的编年史能让这个民族感到舒心。"
 culture_notification.1111.ethos.courtly: "倾心于礼仪与繁文缛节，[new_culture.GetCollectiveNounNoTooltip]如今恪守着一种[new_culture.GetEthos.GetName]的新生活方式。"
 culture_notification.1111.ethos.communal: "无论共襄胜利还是共渡患难，[new_culture.GetCollectiveNounNoTooltip]人都已变得更加以[new_culture.GetEthos.GetName]为重，与邻里休戚与共。"
 culture_notification.1111.ethos.stoic: "面对危险和无法预测的世界，[new_culture.GetCollectiveNounNoTooltip]人变得更加[new_culture.GetEthos.GetName]，把勇毅的品格置于一切之上。"
 culture_notification.1111.ethos.spiritual: "在转而向内心求索答案之后，[new_culture.GetCollectiveNounNoTooltip]人成为一个以[new_culture.GetEthos.GetName]著称的民族，虔敬更胜往昔。"
 culture_notification.1111.ethos.egalitatian: "在[new_culture.GetCollectiveNounNoTooltip]人之中，出身如今已不如才干重要——他们是一个崇尚[new_culture.GetEthos.GetName]的社会。"
 culture_notification.1111.ethos.unchanged: "他们的生活观念并未发生巨变，然而政令与疆界的裂痕，已将一个民族一分为二。"
 culture_notification.1111.outro.other: "\n\n无论出于个人的操控还是共同的信念，[founder.GetTitledFirstName]如今已立于这场文化觉醒的风口浪尖。"
 culture_notification.1111.outro.founder: "\n\n所有的[new_culture.GetNameNoTooltip]人如今瞩望着我。我们的未来从这里开始。"
 culture_notification.1111.a.other: "情况如何发展，我们拭目以待。"
 culture_notification.1111.a.founder: "敬新的时代，新的纪元，新的民族！"
 culture_notification_tooltip: "[divergent_culture|E][new_culture.GetName]由[parent_1.GetName][culture|E]分离而出。"
