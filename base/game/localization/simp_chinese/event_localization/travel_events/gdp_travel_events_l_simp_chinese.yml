l_simp_chinese:
 gdp_travel_events.1000.t: "$travel_danger_prefix$遭遇热浪"
 gdp_travel_events.1000.desc: "[ROOT.Char.GetCurrentLocation.GetName]的沙丘绵延至天际，像一片没有尽头的沙海。烈日凌空，在沙面上投下变幻迷离的光影。四下无荫，我们浑身大汗，只得停下休息。我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))][entourage_member_one.GetFirstName]睁大眼睛看向我。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，别担心这炎热。昨天晚上我得到了[entourage_member_one.GetFaith.HighGodName]的启示！祂让我看见不远处有一片绿洲。”"
 gdp_travel_events.1000.a: "这里确实应该有一片绿洲！"
 gdp_travel_events.1000.b: "我们已别无选择，只能一试。"
 gdp_travel_events.1000.b.success: "绿洲的确存在，赞美[entourage_member_one.GetFaith.HighGodName]"
 gdp_travel_events.1000.b.failure: "那不过是一场海市蜃楼"
 gdp_travel_events.1000.c: "我不会相信幻象。"
 low_caravaneer_experience_reason_tooltip: "需要在$trait_track_caravaneer$（[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]）上有#V 100#![trait_level_track_xp|E]"
 gdp_travel_events.1010.t: "迷途旅人"
 gdp_travel_events.1010.desc: "离开[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly][ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')]的路途上，我的商队正准备扎营。正当众人即将安顿歇息时，身后传来一阵微弱的呼喊。\n\n“请帮帮我们，[ROOT.Char.Custom('FormOfAddressForLiege')]。我与家人在旅途中同商队失散了。我们没有什么能回报的，但只要能保护我的[traveler_child.Custom('GetDaughterSon')]今夜平安，我愿意付出一切代价。”"
 gdp_travel_events.1010.a: "留着你的钱，跟我们走吧。"
 gdp_travel_events.1010.b: "我们可以庇护你……但得付点小钱。"
 gdp_travel_events.1010.c: "你刚刚说#EMP 什么#!都会做……"
 gdp_travel_events.1010.d: "我们要喂的嘴巴够多了。"
 gdp_travel_events.1020.t: "路上趣闻"
 gdp_travel_events.1020.desc.intro: "从[journey_start.GetName]出发的旅程路途遥远，我的臀部随着[ROOT.Char.Custom('GetDonkeyDromedary')]在[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]上颠簸前行而酸痛不已。我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))][associate.GetFirstName]却似乎完全不受旅途影响，骑着牲口来到我身边，急着要跟我说什么。\n\n"
 gdp_travel_events.1020.desc.caravaneer: "“[ROOT.Char.Custom('FormOfAddressForLiege')]，有个小趣事。前几天我与一位来自[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]的商队首领聊过。他跟我提到了一个做工精巧的航海装置……”"
 gdp_travel_events.1020.desc.artisan: "“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，你知道[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]可以做很好的布料染料吗？如果把花瓣碾碎……”"
 gdp_travel_events.1020.desc.creditor: "“[ROOT.Char.Custom('FormOfAddressForLiege')]，说个有意思的事。在某些地方，如果对方欠你钱，抢劫#EMP 有时#!是合法的。这让我想起有一次我和我那些表亲……”"
 gdp_travel_events.1020.desc.war_profiteer: "“[ROOT.Char.Custom('FormOfAddressForLiege')]，跟你说件有趣的事，这片[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]曾经是一场大战的战场。一位传奇剑客在这里倒下，据说他杀敌就像一头[ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]……”"
 gdp_travel_events.1020.a: "真有趣，请再多说一些。"
 gdp_travel_events.1020.b: "我们还是谈谈[ROOT.Char.Custom('my_subject_of_interest')]吧。"
 gdp_travel_events.1020.c: "我更喜欢安静骑行。"
 gdp_travel_events.1020.b.success: "你改变了讨论的话题"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip]没兴趣听你说话"
 gdp_travel_events.1030.t: "恶毒低语"
 gdp_travel_events.1030.desc: "我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))][ambitious_associate.GetFirstName]凑到我身边，四下看了看有没有旁人在场。[ambitious_associate.GetSheHe|U]弯下腰，压低声音说：\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]，我听说了一些关于你的合伙人[current_partner.GetFirstName]的不安传闻。商会里都在传，说[current_partner.GetSheHe]#EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!！如果那是真的，我们必须把[current_partner.GetHerHim]送交法办！\n\n……另外，给你带来这些要命消息的人，是不是该得到一点奖赏？”"
 gdp_travel_events.1030.a: "我必须知道真相！"
 gdp_travel_events.1030.a.unity_loss.desc: "发现了合伙人的本质"
 gdp_travel_events.1030.b: "我不愿妄加揣测。"
 gdp_travel_events.1030.b.unity_gain.desc: "拒绝相信关于你合伙人的投机谣言"
 gdp_travel_events.1040.t: "$travel_danger_prefix$无人维护的水井"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName]朝一口古井里望去，皱起了鼻子。\n\n这口井早已无人管理。井石上长满了杂草，吊桶已经半朽，井水散发出一股恶臭，连口渴之人也会犹豫要不要喝上一口。\n\n不幸的是，我们的水囊已经瘪了，几乎见底，干渴正变得愈发难耐。"
 gdp_travel_events.1040.a: "一点污秽伤不到我！"
 gdp_travel_events.1040.b: "我知道一种净化水的方法。"
 gdp_travel_events.1040.c: "我们必须配给剩余的水。"
 gdp_travel_events.1040.d: "这将是一段漫长而干渴的旅途。"
 gdp_travel_events.1040.e: "也许只抿一口……"
 gdp_travel_events.1040.e.critical_failure.tt: "你的病恶化了。"
 gdp_travel_events.1040.e.success: "水喝起来是安全的。"
 gdp_travel_events.1040.e.success.desc: "你喝下井水，感觉精神再次焕发。"
 gdp_travel_events.1050.t: "$travel_danger_prefix$倒塌的树木"
 gdp_travel_events.1050.desc: "一场风暴席卷了[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]的[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]，将树木连根拔起，横七竖八地倒在路上。当地工人正在砍伐清理，但恐怕还要等一段时间我们才能通过。\n\n堵塞处周围的[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]虽然可以通行，但那些摇摇欲坠的树木使这条绕行路线险象环生。"
 gdp_travel_events.1050.x: "我的坐骑[ROOT.Char.Custom('WarhorseStoryName')]会将这些残骸拖到一边！"
 gdp_travel_events.1050.a: "不妨好好利用我的双手。"
 gdp_travel_events.1050.b: "我们可以从他们的方式中学习。"
 gdp_travel_events.1050.c: "让我们想办法绕过这片障碍。"
 gdp_travel_events.1050.d: "我们会等待工人完成清理。"
 gdp_travel_events.1050.c.success: "你找到一条绕过倒下的树的路。"
 gdp_travel_events.1050.c.failure: "你在荒野中伤到自己。"
 gdp_travel_events.1060.t: "$travel_danger_prefix$船舱里的老鼠"
 gdp_travel_events.1060.desc: "船舱里满是老鼠，贪婪地啃食着我们的给养。有人怪储存不当——盖子松动，袋子破损。另一些人则怪鼠群大得简直难以置信。\n\n无论原因为何，我们正迅速输掉这场战斗，必须采取行动，免得这些肮脏的老鼠把我们所有东西都吃光，让我们一无所有。"
 gdp_travel_events.1060.x: "让我的猫[ROOT.Char.Custom('CatStoryName')]来解决。"
 gdp_travel_events.1060.a: "“给我拿一把鱼叉和一张好网！”"
 gdp_travel_events.1060.b: "我会亲自解决存储问题！"
 gdp_travel_events.1060.c: "设定航线前往港口补充物资。"
 gdp_travel_events.1060.d: "你们都去抓老鼠！"
 gdp_travel_events.1060.b.tt: "你必须至少拥有#V 25#![GetTradeGoodCategory('trade_category_cereals').GetName][expertise|E]"
 gdp_travel_events.1070.t: "$travel_danger_prefix$沿路打劫"
 gdp_travel_events.1070.desc: "前一刻，地平线上还只有尘土，下一刻，我们就看到一伙暴徒在碎石坡顶勒马而立。\n\n“站住！”他们的首领朝我喊道。“和平地交出你交易得来的黄金，[ROOT.Char.GetTitleAsNameNoTooltip|l]，就没人会受伤。”"
 gdp_travel_events.1070.a: "“我受[ROOT.Char.GetSuzerain.GetShortUINamePossessive]的庇护，你们这群混蛋！”"
 gdp_travel_events.1070.a.success: "庇护者的名号让你安全通行"
 gdp_travel_events.1070.b: "“有本事你从我手上抢啊！”"
 gdp_travel_events.1070.b.success: "你赶走了强盗"
 gdp_travel_events.1070.b.failure: "强盗抢走了你的金币"
 gdp_travel_events.1070.c: "“放我们过去，我什么都给你。”"
 gdp_travel_events.2000.t: "斜塔"
 gdp_travel_events.2000.desc: "我的眼睛……出毛病了？难道我的双脚并没有感觉中站得那样稳？不，尽管眼前景象如此不真实，我的感官并没有失灵。#EMP 大[GetBuildingType('tower_of_pisa').GetNameNoTooltip]正在倾斜#!！\n\n“这里的地面大概和凝乳一样‘结实’，[ROOT.Char.Custom('FormOfAddressForLiege')]，”站在我身旁的石匠大师[mason.GetFirstName]说道。“[ROOT.Char.GetSheHe|U]才建到不到四分之一高时就开始歪了，但我们最终还是把[ROOT.Char.GetHerHim]弄到了那个高度。”\n\n“[ROOT.Char.GetSheHe]很壮观，不是吗？”"
 gdp_travel_events.2000.a: "也许它的#EMP 独特之处#!能吸引到些旅人……？"
 gdp_travel_events.2000.b: "你要么是天才，要么是疯子。你被雇用了！"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip]，"
 gdp_travel_events.2002.desc: "我们的石匠们欣喜地报告，宏伟的[GetBuildingType('tower_of_pisa').GetNameNoTooltip]终于竣工了。\n\n然而我必须提及，我也从比萨听到了一些古怪的消息，旅行者们谈起一座#EMP 完全#!不同于他们以往所见的建筑。我担心它的建造可能出了什么岔子。"
 gdp_travel_events.2002.a: "让我亲眼评判他们的工作。"
 gdp_travel_events.2002.b: "只要它还能立着，我完全不在乎。"
