l_simp_chinese:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "圣伯多禄遗骨"
 artifact_relic_peter_bones_desc: "宗徒之长、第一任罗马主教伯多禄宗徒的骸骨。"
 artifact_relic_paul_bones_name: "圣保禄遗骨"
 artifact_relic_paul_bones_desc: "保禄宗徒的遗骨，他于鼠尾草水泉殉道。"
 artifact_relic_crown_of_thorns_name: "荆棘冠冕"
 artifact_relic_crown_of_thorns_desc: "基督在被钉十字架前被按在头顶的荆棘冠冕。"
 artifact_relic_baptist_arm_name: "圣若翰洗者右臂"
 artifact_relic_baptist_arm_desc: "圣若翰洗者的右前臂，据说正是那只在约旦河中为基督施洗的手。"
 artifact_relic_true_cross_name: "真十字架碎片"
 artifact_relic_true_cross_desc: "钉死基督的十字架的一块碎片，安放在一个镀金的圣髑盒中。"
 artifact_relic_bones_of_james_name: "圣雅各伯遗骨"
 artifact_relic_bones_of_james_desc: "长雅各伯宗徒的遗骨，吸引了来自整个基督教世界的朝圣者。"
 artifact_relic_mark_name: "圣马尔谷之髑"
 artifact_relic_mark_desc: "亚历山大教会的创立者圣史马尔谷被砍下的头颅。"
 artifact_relic_lance_antioch_name: "安条克圣枪"
 artifact_relic_lance_antioch_desc: "一把据称曾刺穿基督肋旁的铁枪枪头。"
 artifact_relic_tabot_name: "约板"
 artifact_relic_tabot_desc: "一块经过祝圣的代表约柜的石板，被尊为埃塞俄比亚最神圣的圣物。"
 artifact_relic_nine_saints_name: "九圣遗骨"
 artifact_relic_nine_saints_desc: "九圣遗骨——这是九名为躲避迦克墩争议而逃往阿克苏姆的叙利亚教会修士，建立了埃塞俄比亚最早的修道院，将合性论基督教传播至高原各地。"
 artifact_relic_thomas_name: "多默宗徒圣髑"
 artifact_relic_thomas_desc: "多默宗徒的遗骨和血迹斑斑的矛头，据说是他将信仰带到喀拉拉并在那里殉道。"
 artifact_relic_augustine_pallium_name: "圣奥斯定披带"
 artifact_relic_augustine_pallium_desc: "坎特伯雷的奥斯定所穿戴的披带，他是首位坎特伯雷大主教与英格兰人的宗徒。"
 artifact_relic_three_magi_name: "三贤士圣髑"
 artifact_relic_three_magi_desc: "跟随星星来到白冷的三位贤士的遗骨。"
 artifact_relic_becket_name: "圣托马斯·贝克特圣髑"
 artifact_relic_becket_desc: "托马斯·贝克特沾满血迹的衣衫和头骨，他在1170年于自己的主教座堂殉道，迅速被誉为英格兰基督徒中最伟大的圣人。"
 artifact_relic_ursula_name: "圣乌苏拉遗骨"
 artifact_relic_ursula_desc: "乌苏拉及其同伴处女殉道者的遗骨，出土于科隆的墓地。"
 artifact_relic_ignatius_name: "圣依纳爵遗骨"
 artifact_relic_ignatius_desc: "依纳爵的遗骨，他是安条克第二任宗主教，若望宗徒的门徒，在图拉真统治时期于罗马殉道。"
 # Islamic
 artifact_relic_black_stone_name: "黑石碎片"
 artifact_relic_black_stone_desc: "一块锃亮的黑色碎片，从克尔白的黑石上分离下来，曾被先知本人亲吻，并受到每一位朝觐者的尊崇。"
 artifact_relic_dhulfiqar_name: "佐勒菲卡尔"
 artifact_relic_dhulfiqar_desc: "先知的裂刃剑，据说是他赠予阿里的，被全乌玛尊为神许统治的象征。"
 artifact_relic_buraq_footprint_name: "卜拉格蹄迹"
 artifact_relic_buraq_footprint_desc: "一块留有卜拉格蹄印的石头，当时先知正骑着卜拉格从耶路撒冷的基石上登宵。"
 artifact_relic_sword_of_ali_name: "阿里之剑"
 artifact_relic_sword_of_ali_desc: "据信，这是阿里·伊本·艾比·塔利卜在白德尔与隋芬之战中挥舞过的一柄利刃。"
 artifact_relic_abu_hanifa_turban_name: "艾布‑哈尼法头巾"
 artifact_relic_abu_hanifa_turban_desc: "哈乃斐教法学派创始人艾布‑哈尼法·努尔曼的学者头巾——对于每一位哈乃斐派拜谒者而言，它都是逊尼派教法学的一大标杆。"
 artifact_relic_prophet_sandals_name: "先知凉鞋"
 artifact_relic_prophet_sandals_desc: "据说是先知穿过的皮凉鞋，被伊斯兰世界的虔诚工匠以凉鞋的形制不断仿制。"
 # Jewish
 artifact_relic_western_wall_name: "西墙砖石"
 artifact_relic_western_wall_desc: "一块来自第二圣殿站台西墙的石料，这是公元70年罗马人摧毁圣殿后少数存留至今的遗迹之一。"
 artifact_relic_tablets_name: "法版碎片"
 artifact_relic_tablets_desc: "一块石片，据说是摩西一怒之下将法版扔在西奈山下摔碎的碎片。"
 # Buddhist
 artifact_relic_bodhi_leaf_name: "菩提树叶"
 artifact_relic_bodhi_leaf_desc: "一片保存完好的树叶，来自菩提伽耶的菩提树，佛陀正是在此树下开悟。"
 artifact_relic_vajrasana_name: "金刚座碎片"
 artifact_relic_vajrasana_desc: "金刚座铮亮的碎片——菩提树下的金刚宝座，佛陀曾端坐其上岿然不动，直至觉悟成道。"
 artifact_relic_dhamek_name: "法观塔舍利"
 artifact_relic_dhamek_desc: "一件来自鹿野苑的佛陀圣物，佛陀在那里向他的首批弟子传授佛法。"
 artifact_relic_jowo_name: "释迦牟尼等身像"
 artifact_relic_jowo_desc: "一尊从中土带来的佛陀年少时的圣像，被吐蕃人视为最神圣的雕像。"
 artifact_relic_sacred_tooth_name: "佛牙舍利"
 artifact_relic_sacred_tooth_desc: "佛陀的左侧尖牙，于公元四世纪从羯陵伽被带出——它是王权的保障，护持舍利使得统治者的法统凌驾在其他所有人之上。"
 # Hindu
 artifact_relic_lingam_name: "宇主林伽"
 artifact_relic_lingam_desc: "一片湿婆林伽神圣的碎片，出自恒河岸边最神圣的城市波罗奈的大神庙。"
 artifact_relic_trishul_name: "湿婆三叉戟"
 artifact_relic_trishul_desc: "一把据说是湿婆亲持的三叉戟——它是湿婆神主宰创造、护持和毁灭的象征。"
 artifact_relic_krishna_stone_name: "奎师那降诞石"
 artifact_relic_krishna_stone_desc: "一块来自秣菟罗奎师那降诞地的破旧石头，传统上认为此地正是奎师那的出生之处。"
 artifact_relic_rama_footprint_name: "罗摩足迹"
 artifact_relic_rama_footprint_desc: "一块有着罗摩本人足印的石头，来自他的出生地阿踰陀。"
 # Jain
 artifact_relic_palitana_tirtha_name: "波利多拿津渡"
 artifact_relic_palitana_tirtha_desc: "一块来自波利多拿胜怨山上的圣迹石，波利多拿是耆那教传统中最神圣的一处津渡。"
 artifact_relic_parshvanatha_paduka_name: "胁主足石"
 artifact_relic_parshvanatha_paduka_desc: "足印石，一块带有第二十三位渡津者胁主足印的石头。"
 artifact_relic_shikharji_nishidhi_name: "渡津者坐化碑"
 artifact_relic_shikharji_nishidhi_desc: "来自三迷陀‑尸佉罗山峰的坐化碑，二十四位渡津者中的二十位在此获得解脱——这里是耆那信仰中最神圣的津渡。"
 # Zoroastrian
 artifact_relic_atash_bahram_name: "法伦巴格圣火余烬"
 artifact_relic_atash_bahram_desc: "从穆护的圣火——伟大的“胜利之火”中带来的炽热余烬，仍被照管于祆祠之中。"
 # Norse
 artifact_relic_yggdrasil_branch_name: "世界树树枝"
 artifact_relic_yggdrasil_branch_desc: "一根据说是从乌普萨拉神庙圣树上掉落的树枝，树上仍然悬挂着被屠宰祭品的尸体。"
 # Slavic
 artifact_relic_perun_idol_name: "佩伦神像"
 artifact_relic_perun_idol_desc: "一尊斯拉夫众神之主雷神佩伦的木偶，由弗拉基米尔大公所立。"
 # Tengri
 artifact_relic_suldetug_name: "旄纛"
 artifact_relic_suldetug_desc: "一柄由牦牛尾制成的黑色旗帜，作为战神之灵的容器，被举于草原汗王的面前。"
 # Shinto
 artifact_relic_yata_kagami_name: "八咫镜"
 artifact_relic_yata_kagami_desc: "一面铜镜，传统上被视为日本皇室三大神器之一，据说这面镜子曾将太阳女神天照引出岩洞。"
 artifact_relic_shin_no_mihashira_name: "心御柱"
 artifact_relic_shin_no_mihashira_desc: "一片心御柱的残片——这是埋藏在伊势神宫内宫最深的圣所之下神圣的中心柱，被认为是伊势最隐蔽、最圣洁的神秘之物，并在每次式年迁宫中得以重新奉建。"
 # Confucian
 artifact_relic_kong_tomb_name: "孔林石碑"
 artifact_relic_kong_tomb_desc: "一块曲阜孔子墓前的石碑，受到孔家世代尊崇。"
 artifact_relic_analects_name: "《论语》"
 artifact_relic_analects_desc: "一份《论语》早期的竹简抄本——收录了孔夫子的语录——被一代代中华学者研究。"
 # Hellenic
 artifact_relic_athena_promachos_name: "雅典娜先锋像碎片"
 artifact_relic_athena_promachos_desc: "一块青铜碎片，来自曾经屹立守望于卫城之上的雅典娜巨像。"
 # West African
 artifact_relic_opa_oranmiyan_name: "奥兰米扬石杖"
 artifact_relic_opa_oranmiyan_desc: "传说中奥兰米扬国王的花岗岩石杖，被安放在伊费神圣的土地上，这里是约鲁巴人的祖居地。"
 artifact_relic_oshe_shango_name: "尚戈双头斧"
 artifact_relic_oshe_shango_desc: "尚戈双头斧是以风暴之神尚戈的雷霆双石为原型铸造的。尚戈的祭司在狂舞中会将这把斧头高高举起。"
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "神偶"
 artifact_misc_relic_idol_desc: "一尊雕刻的偶像，是神明在仪式中的肉身载体。"
 artifact_misc_relic_stele_name: "祖传石碑"
 artifact_misc_relic_stele_desc: "一块镌刻着祭司世系的石板，作为世代相传的见证。"
 artifact_misc_relic_mask_name: "仪式面具"
 artifact_misc_relic_mask_desc: "一张在最高礼仪上佩戴的仪式面具，作为神灵临在的容器。"
 artifact_misc_relic_banner_name: "圣旗"
 artifact_misc_relic_banner_desc: "一面受祝圣的旗帜，圣地每一场盛大仪式上都有其身影，布料上沉甸甸地积着供奉的烟尘。"
