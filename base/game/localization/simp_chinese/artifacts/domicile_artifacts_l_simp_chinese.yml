 creature_type_lion_desc: "万兽之王，勇武的化身。如今却被锁链困住，只能在围栏内沿着锁链的轨迹来回踱步。"
 creature_type_caracal_desc: "一头大型猫类动物。它在圈舍中四处徘徊，将投喂进来的一切撕碎并装点笼栏。"
 creature_type_lynx_desc: "一只身形敦实、性情怯懦的大猫。它紧贴地面，双耳后贴，立在栖处警觉地环顾四周。"
 creature_type_tiger_desc: "一头令人生畏，称霸山林的巨兽。它极易被激怒，露出的獠牙，令观者胆战心惊。"
 creature_type_leopard_desc: "一只身姿轻盈优雅，却也凶险致命的野兽。它狡猾且极有耐心，拥有惊人的跳跃能力。"
 creature_type_bear_desc: "一头凶猛巨熊，它拖着笨重的身躯终日觅食。粗壮的熊掌能像折断细枝般击碎骨头。"
 creature_type_elephant_desc: "一头看似温和的巨兽。它的长鼻灵巧自如，总能让前来观赏的客人啧啧称奇、心生欢喜。"
 creature_type_peacock_desc: "一只骄傲庄严的鸟。它的鸣声独特，是庭苑之中最为耀眼的景致。"
 creature_type_parrot_desc: "一只生性活泼的珍禽，它能够模仿人声，用来招待宾客颇有趣味。"
 creature_type_crane_desc: "一只体态轻盈、气质高雅的珍禽。它象征着着幸运与长寿。"
 creature_type_cockatoo_desc: "一只羽色明艳的鸟，它的目光灵动敏锐。"
 creature_type_monkey_desc: "一只喜爱群居的猿类，它的行为举止与神态都酷似人类，十分惹人喜爱。"
 creature_type_lion_reforged_desc: "万兽之王，勇武的化身。$creature_history_entry$"
 creature_type_caracal_reforged_desc: "一只性情凶悍的异兽。$creature_history_entry$"
