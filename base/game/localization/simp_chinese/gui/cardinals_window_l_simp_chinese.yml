 theocratic_elective_pious: "虔诚派"
 theocratic_elective_pious_desc: "#flavor 枢机团必须推出一位得到所有人信服，生前即已如同圣人的枢机。#!\n\n要成为#EMP $theocratic_elective_pious$#!，角色需要比其他所有[cardinal|E]都更圣洁。[piety_level|E]拥有最高权重，接着是[learning|E]和[GetTrait('lifestyle_scholar').GetName( GetPlayer )]、[GetTrait('pilgrim').GetName( GetPlayer )]或[GetTrait('lifestyle_mystic').GetName( GetPlayer )]特质。[sin|E]产生的惩罚大于[virtue|E]产生的增益。[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "大众派"
 theocratic_elective_populist_desc: "#flavor 信众不愿追随的教宗根本算不上教宗，因此枢机团会推举一位已在街头赢得欢呼的枢机。#!\n\n要成为#EMP $theocratic_elective_populist$#!，角色需要在名望上超越其他所有[cardinal|E]。提高你的[prestige_level|E]和[diplomacy|E]，维持[college_of_cardinals|E]内的[friends|E]，拥有高[tenet_popularity|E]的[personal_tenets|E]，以及使用[GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName][decision|E]。[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "权势派"
 theocratic_elective_powerful_desc: "#flavor 圣伯多禄之座既有敌人，也有追随者，因此枢机团会推举一位有能力守住它的教长。#!\n\n要成为#EMP $theocratic_elective_powerful$#!，角色需要在世俗分量上超越其他所有[cardinal|E]。让你的[rite|E]传播至更多[counties|E]，持有[holy_sites|E]，提高你的[dynasty_prestige_level|E]——或使用#V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#![character_interaction|E]走上前台。[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
