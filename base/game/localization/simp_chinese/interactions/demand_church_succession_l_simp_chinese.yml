l_simp_chinese:
 demand_church_succession_interaction: "要求教会继承"
 demand_church_succession_religious_head_interaction: "下令教会继承"
 demand_church_succession_interaction_desc: "如果[recipient.GetTitledFirstName]在去世时没有合法继承人，那么[recipient.GetSheHe]持有的领地将被移交给[fallback_heir|E][actor.GetPrimaryTitle.GetName]的持有者。"
 demand_church_succession_religious_head_interaction_desc: "作为[actor.GetFaith.GetAdjective][faith|E]的[head_of_faith|E]，下令如果[recipient.GetTitledFirstName]在没有继承人时死亡，[recipient.GetSheHe]的领地应当移交给[actor.GetPrimaryTitle.GetName]。"
 demand_church_succession_target_in_reach: "[recipient.GetShortUINamePossessive]的[realm|E]与[actor.GetShortUINamePossessive]的[realm|E]不相邻且不在[actor.GetShortUINamePossessive]的[archdiocese|E]内"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName]已将其继承权许诺给其他神职人员或[fallback_heir|E]"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName]的[primary_title|E]处于[elective_succession|E]或[advanced_succession|E]"
 demand_church_succession_recently_refused_tt: "[recipient.GetTitledFirstName]最近违抗了教会提出的一项继承要求，在未来十年内不能再收到这类要求"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "要求教会继承"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.GetTitledFirstName]要求，如果[recipient.GetTitledFirstName]在去世时没有继承人，[actor.GetPrimaryTitle.GetName]应当继承[recipient.GetHerHis]的领地。"
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName]受到[faith|E]约束"
 demand_church_succession_actor_toast_desc: "如果[recipient.GetSheHe]在去世时没有继承人，[actor.GetPrimaryTitle.GetName]应当继承[recipient.GetHerHis]的领地。"
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName]将[recipient.GetTitledFirstName]绑定至[faith|E]"
 demand_church_succession_actor_toast_desc_puppeteer: "如果[recipient.GetSheHe]在去世时没有继承人，[puppet_or_actor.GetPrimaryTitle.GetName]应当继承[recipient.GetHerHis]的领地。"
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "蒙[actor.GetFaith.HighGodNamePossessive]恩典，我就继承之事致信于你。"
 demand_church_succession.0001.desc.archbishop: "我所管辖的总教区一直照拂你的领地，我就继承之事致信。"
 demand_church_succession.0001.desc.bishop: "你的牧者就继承之事致信于你。"
 demand_church_succession.0001.desc.head_of_faith_generic: "作为信仰的[actor.GetTitleAsNameNoTooltip]，我就继承之事致信于你。"
 demand_church_succession.0001.desc.theocrat_generic: "从[actor.GetFaith.HighGodName]的祭坛旁，我就继承之事致信。"
 demand_church_succession.0001.flavour.zealous: "\n\n切莫误解，"
 demand_church_succession.0001.flavour.ambitious: "\n\n坦诚而言，"
 demand_church_succession.0001.flavour.deceitful: "\n\n想必这让你宽心，"
 demand_church_succession.0001.flavour.greedy: "\n\n我直言相告，"
 demand_church_succession.0001.flavour.compassionate: "\n\n请恕此不得已，[recipient.GetTitledFirstName]，但"
 demand_church_succession.0001.flavour.default: "\n\n恕我直言，"
 demand_church_succession.0001.recipient.elderly_childless: "你炉边的摇篮空空如也，你的血脉将随你而终。信众会静候——届时，他们将继承。"
 demand_church_succession.0001.recipient.childless: "你无在世子女。倘若[actor.GetFaith.HighGodName]不改变此况，你的领地将服务于信仰。"
 demand_church_succession.0001.recipient.one_child: "仅有一子尚存于你与终结之间。倘若[actor.GetFaith.HighGodName]将其召去，信众已准备好接管。"
 demand_church_succession.0001.recipient.default: "岁月无常，世事难料。若你的后继无人，你的领地将归于我们，以[actor.GetFaith.HighGodNamePossessive]的名义治理。"
 demand_church_succession.0001.a: "既已写就，便当如此。"
 demand_church_succession.0001.b: "那我最好生下一位继承人。"
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip]越界了。"
 demand_church_succession.0001.c.tt: "你回绝了[fallback_heir_title|E]的安排，并在十年内免受教会进一步的继承要求，而[actor.GetTitledFirstName]不会轻易宽恕这样的冒犯"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "我已经阅读了你的请求，并在此予以拒绝。我的领地绝不会落入教会之手。[actor.GetTitledFirstName]，你只管照料你的祭坛，而我会打理我的土地。"
 demand_church_succession.0002.a: "我会记住这无礼之举。"
 demand_church_succession_fertility_modifier: "决心生育继承人"
 demand_church_succession_fertility_modifier_desc: "为免领地落入神职人员之手，该角色在婚床之上加倍努力。"
 defied_church_succession_opinion: "违抗了我的继承要求"
 meddling_church_opinion: "干涉了我的继承事务"
