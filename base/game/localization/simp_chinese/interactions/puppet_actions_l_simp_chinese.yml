 pam_interactions_events.0120.opening: "致杰出的[recipient.GetFaith.GetReligion.GetAdjective]信徒[recipient.GetFirstName]，"
 pam_interactions_events.0120.desc_religious_head_actor: "说真的，自[recipient.GetFaith.CreatorName]创造人类以来，我们从未见过您这样的[recipient.GetTitleAsName]！您下令，我遵命，这是我的荣幸。\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "我无法独自引领信众。即使[recipient.GetFaith.HighGodNamePossessive]的第一子民，[recipient.GetTitleAsName][recipient.GetHerselfHimself]本人，也必须屈从于这世间的法则。因此，我将协助并服从你，[actor.GetTitleAsName]。\n\n"
 pam_interactions_events.0120.desc: "我何等有福，能够在[recipient.GetFaith.HighGodNamePossessive]和您的双重命令下为信众服务。我将倾尽全力。\n\n"
 pam_interactions_events.0120.desc_lunacy: "我担心我的灵正在死去……除了你的建议，没有任何劝导能给我丝毫慰藉……\n\n"
 pam_interactions_events.0120.desc_dread: "让我们毁灭那些必须被毁灭的人：那些已被[recipient.GetFaith.HighGodName]所抛弃的人……正如[recipient.GetFaith.HighGodNameSheHe|U]已抛弃了我一样。\n\n"
 pam_interactions_events.0120.desc_piety: "[recipient.GetFaith.HighGodName|U][recipient.GetFaith.HighGodHerselfHimself|U]已赋予我们神圣的使命！\n\n"
 pam_interactions_events.0120.desc_friendly: "我对[recipient.Custom2('RelationToMe', SCOPE.sC('actor'))]的爱，我绝对的信任，将引导我度过即将到来的事情。\n\n"
 pam_interactions_events.0120.desc_skill: "在你出色的指引下……我期待能参与一番伟大的事业。\n\n"
 pam_interactions_events.0120.outro: "你的哪些祈祷需要得到回应？"
 pam_interactions_events.0120.a: "我的所有祈祷，[recipient.GetTitleAsNameNoTooltip]！"
 pam_interactions_events.0121.opening: "可敬的[ROOT.Char.GetTitleAsName]，"
 pam_interactions_events.0121.desc_honor: "我特此放下我作为[recipient.GetPrimaryTitle.GetNameNoTier][recipient.GetTitleAsName]的骄傲，坚定地遵从你的指教。\n\n"
 pam_interactions_events.0121.desc: "[recipient.GetPrimaryTitle.GetNameNoTier][recipient.GetTitleAsName]将在你的权力游戏中扮演[recipient.GetHerHis]的角色，帮助你干预俗世的事务。\n\n"
 pam_interactions_events.0121.desc_lunacy: "正如你所说：我的宫廷是个充斥着庸人与骗子的地方。我的梦是黑暗的。只有你的话对我才有意义，只有你的药能够治愈……\n\n"
 pam_interactions_events.0121.desc_dread: "我是你手中的武器。毫无质疑，毫无顾忌。\n\n"
 pam_interactions_events.0121.desc_piety: "解除我的疑虑，向我指明如何赢得[recipient.GetFaith.HighGodNamePossessive]的爱！\n\n"
 pam_interactions_events.0121.desc_friendly: "我的[recipient.Custom2('RelationToMe', SCOPE.sC('actor'))]，我完全相信你，我发誓不会让你失望。\n\n"
 pam_interactions_events.0121.desc_skill: "我相信，有你密切关注我领地的事务，绝不会允许我失败。\n\n"
 pam_interactions_events.0121.outro: "让我们看看你的计划。"
 pam_interactions_events.0121.a: "尽管[recipient.GetSheHe]是[recipient.GetTitleAsNameNoTooltip|U]，但[recipient.GetSheHe]为教会服务。"
